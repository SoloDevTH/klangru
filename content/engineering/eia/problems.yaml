        feedback: การซ่อนความไม่แน่นอนทำให้ผู้ตัดสินใจประเมินความเสี่ยงผิดไป
      - id: b
        text: ระบุความไม่แน่นอนและสมมติฐานอย่างชัดเจน พร้อมแผนติดตามที่ปรับได้และเกณฑ์ที่ต้องดำเนินการเพิ่ม
        correct: true
