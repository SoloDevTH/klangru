id: thai.listening.main-points
subject: thai
title: { th: การฟังและดูจับใจความสำคัญ, en: "Listening and viewing for main ideas" }
summary: แยกใจความสำคัญกับรายละเอียดจากเรื่องที่ฟังและดู ตั้งคำถามและตอบคำถามเชิงเหตุผล และพูดสรุปใจความให้ไม่แคบและไม่กว้างเกินไป
difficulty: 3
minutes: 30
prerequisites: [thai.listening.instructions-retelling]
encompasses:
  - { id: thai.listening.instructions-retelling, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: main-idea-umbrella.svg
    alt: "แผนภาพร่ม ผ้าร่มเขียนว่า ใจความสำคัญ: ผักบุ้งเป็นผักที่ปลูกง่าย ใต้ร่มมีกล่องรายละเอียด 3 กล่อง: โตเร็ว เก็บกินได้ไว / ขึ้นได้ทั้งในดินและในน้ำ / ใช้พื้นที่ปลูกน้อย ข้อความด้านล่าง: ใจความสำคัญคลุมรายละเอียดทุกข้อ เหมือนร่มที่คลุมคนทุกคนข้างใต้"
    caption: "ใจความสำคัญคลุมรายละเอียดทุกข้อ"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: จับใจความจากประกาศหน้าเสาธง
    problem: "ข้อความที่ได้ยิน: \"วันพฤหัสบดีนี้โรงเรียนจัดกีฬาสี ขอให้นักเรียนแต่งชุดพละตามสีของตน มาถึงโรงเรียนก่อน 7 โมงครึ่งเพื่อเดินขบวนพาเหรด และนำขวดน้ำส่วนตัวมาด้วย เพราะโรงเรียนงดใช้แก้วพลาสติก\" สรุปใจความเป็นประโยคเดียว"
    steps:
      - text: "จดคำสำคัญ: พฤหัสบดี · กีฬาสี · ชุดพละตามสี · ก่อน 7 โมงครึ่ง · ขวดน้ำส่วนตัว"
      - text: "ตอบ 5W1H: งานอะไร (กีฬาสี) เมื่อไร (วันพฤหัสบดี) ต้องทำอะไร (แต่งชุด มาเช้า นำขวดน้ำ)"
      - text: "เรื่องหลักคือ มีกีฬาสีและสิ่งที่ต้องเตรียม ส่วนเหตุผลเรื่องแก้วพลาสติกเป็นรายละเอียด"
        why: "เหตุผลนี้อธิบายรายละเอียดข้อเดียว (ขวดน้ำ) จึงไม่ใช่เรื่องหลักของประกาศ"
      - text: "เขียนสรุปแล้วตรวจว่าคลุมรายละเอียดสำคัญทุกข้อ ไม่แคบและไม่กว้างเกินไป"
    answer: "วันพฤหัสบดีนี้มีกีฬาสี นักเรียนต้องแต่งชุดพละตามสี มาก่อน 7 โมงครึ่ง และนำขวดน้ำมาเอง"
  - { type: check, problem: thai.listening.main-points.p004, prompt: "ใจความมักอยู่ในพาดหัว" }
  - type: worked-example
    title: ตอบคำถามเชิงเหตุผล
    problem: "จากนิทานมดกับตั๊กแตน ตอบคำถามว่า \"ทำไมตั๊กแตนจึงต้องไปขออาหารจากมด\""
    steps:
      - text: "หาผล: ตั๊กแตนหิวและต้องไปขออาหาร"
      - text: "หาเหตุจากเรื่อง: ฤดูร้อนตั๊กแตนร้องเพลงเล่นทั้งวัน ไม่เก็บอาหาร และฤดูหนาวหญ้าเหี่ยวหมด"
        why: "คำตอบเชิงเหตุผลต้องมาจากข้อมูลในเรื่อง ไม่ใช่ความเห็นของเรา"
      - text: "เชื่อมเหตุกับผลด้วยคำว่า เพราะ"
    answer: "เพราะตั๊กแตนไม่ได้เก็บอาหารไว้ตั้งแต่ฤดูร้อน เมื่อหน้าหนาวหญ้าเหี่ยวหมดจึงไม่มีอะไรกิน"
  - { type: check, problem: thai.listening.main-points.p010, prompt: "คำถามแบบไหนต้องเชื่อมเหตุกับผล" }
  - type: figure
    src: news-screen.svg
    alt: "ภาพจากรายการข่าวโรงเรียน มีโต๊ะวางหนังสือ 3 ตัวและนักเรียน 2 คน แถบพาดหัวว่า ตลาดนัดหนังสือมือสอง รายได้ซื้อหนังสือเข้าห้องสมุด แถบตัวอักษรด้านล่างว่า ศุกร์ 13 พ.ย. · โรงอาหาร · 08.30–15.30 น. · เล่มละ 5–20 บาท"
    caption: "ข้อมูลจากการดู: พาดหัวบอกใจความ แถบตัวอักษรบอกรายละเอียด"
glossary:
  - { term: ใจความสำคัญ, definition: "เรื่องหลักที่ผู้พูดต้องการบอก คลุมรายละเอียดทุกข้อ" }
  - { term: รายละเอียด, definition: "ส่วนที่อธิบาย ขยาย หรือยกตัวอย่างใจความสำคัญ" }
  - { term: คำสำคัญ, definition: "คำที่บอกเรื่องหลัก มักพูดซ้ำหลายครั้ง ใช้จดระหว่างฟัง" }
  - { term: คำถามเชิงเหตุผล, definition: "คำถามที่ต้องเชื่อมเหตุกับผล เช่น ทำไม เพราะอะไร" }
  - { term: 5W1H, definition: "คำถาม ใคร ทำอะไร ที่ไหน เมื่อไร ทำไม อย่างไร ใช้เก็บข้อมูลจากเรื่อง" }
flashcards:
  - { front: "ใจความสำคัญต่างจากรายละเอียดอย่างไร", back: "ใจความคลุมทั้งเรื่อง รายละเอียดอธิบายใจความเพียงบางส่วน" }
  - { front: "ประโยคใจความมักอยู่ตรงไหน", back: "ต้นเรื่อง หรือท้ายเรื่อง (หลังคำว่า สรุปว่า ดังนั้น จึง)" }
  - { front: "สรุปที่ดีต้องเป็นอย่างไร", back: "ไม่แคบเกินไป (รายละเอียดข้อเดียว) และไม่กว้างเกินไป (ใช้กับเรื่องไหนก็ได้)" }
  - { front: "ถูกถามสิ่งที่เรื่องไม่ได้บอก ควรตอบว่า", back: "เรื่องนี้ไม่ได้บอก (ไม่เดาเอง)" }
