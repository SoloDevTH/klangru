  - id: openstax
    name: OpenStax (Rice University)
    url: https://openstax.org/
    languages: [en]
    subjects: [math, physics, chemistry]
    license: CC-BY-NC-SA-4.0 (most current books); CC-BY-4.0 (Physics, Statistics)
    reuse: link-only
    derivative_license: [CC-BY-NC-SA-4.0]
    api: >-
      CMS API https://openstax.org/apps/cms/api/v2/pages/?type=books.Book&fields=title,license_name,license_version,license_url,book_state,cnx_id
      (ใบอนุญาตรายเล่ม) และสารบัญรายเล่มจาก https://openstax.org/rex/release.json + https://openstax.org<archiveUrl>/contents/<cnx_id>@<version>.json
      URL บท: https://openstax.org/books/<book-slug>/pages/<section-slug>
    notes: >-
      บล็อก "An update on OpenStax licensing" (2026-04-22) ระบุว่า "OpenStax has transitioned our textbook library from a mix of CC BY and CC BY-NC-SA licensing to CC BY-NC-SA licensing across the library ... with limited exceptions"
      และ "No action is needed by anyone who has previously created derivatives of CC BY content" ข้อมูลใน ADR 0001 และรายงานเดิมที่ว่า OpenStax เป็น CC BY 4.0 จึงล้าสมัย
      ตรวจรายเล่มจาก CMS API วันที่ 2026-10-24 ดู per_book ตรวจซ้ำทุกครั้งก่อนดัดแปลง เพราะเล่มที่ปรับปรุงจะเปลี่ยนเป็น NC-SA
    per_book:
      - { book: physics, title: Physics, license: CC-BY-4.0, reuse: adapt }
      - { book: statistics, title: Statistics, license: CC-BY-4.0, reuse: adapt }
      - { book: college-physics-2e, title: College Physics 2e, license: CC-BY-NC-SA-4.0, reuse: link-only }
      - { book: university-physics-volume-1, title: University Physics Volume 1, license: CC-BY-NC-SA-4.0, reuse: link-only }
      - { book: chemistry-2e, title: Chemistry 2e, license: CC-BY-NC-SA-4.0, reuse: link-only }
      - { book: chemistry-atoms-first-2e, title: "Chemistry: Atoms First 2e", license: CC-BY-NC-SA-4.0, reuse: link-only }
      - { book: prealgebra-2e, title: Prealgebra 2e, license: CC-BY-NC-SA-4.0, reuse: link-only }
      - { book: elementary-algebra-2e, title: Elementary Algebra 2e, license: CC-BY-NC-SA-4.0, reuse: link-only }
      - { book: intermediate-algebra-2e, title: Intermediate Algebra 2e, license: CC-BY-NC-SA-4.0, reuse: link-only }
      - { book: algebra-and-trigonometry-2e, title: Algebra and Trigonometry 2e, license: CC-BY-NC-SA-4.0, reuse: link-only }
      - { book: precalculus-2e, title: Precalculus 2e, license: CC-BY-NC-SA-4.0, reuse: link-only }
      - { book: calculus-volume-1, title: Calculus Volume 1, license: CC-BY-NC-SA-4.0, reuse: link-only }
      - { book: contemporary-mathematics, title: Contemporary Mathematics, license: CC-BY-NC-SA-4.0, reuse: link-only }
      - { book: introductory-statistics-2e, title: Introductory Statistics 2e, license: CC-BY-NC-SA-4.0, reuse: link-only }
    evidence_url: https://openstax.org/blog/openstax-licensing

  - id: libretexts
    name: LibreTexts
    url: https://libretexts.org/
    languages: [en]
    subjects: [math, physics, chemistry]
    license: Mixed, set per page (CC0, CC BY, CC BY-SA, CC BY-NC, CC BY-NC-SA, CC BY-NC-ND, CC BY-ND, GPL, GFDL, or undeclared)
    reuse: link-only
    api: ยังไม่ได้ตรวจ API ใบอนุญาตแสดงที่ท้ายแต่ละหน้า ("This page titled ... is shared under a ... license")
    notes: >-
      คู่มือ Construction Guide ของ LibreTexts ระบุว่าแต่ละหน้าเลือกใบอนุญาตผ่าน meta-tag "Licensing" ได้หลายแบบรวมถึง ND
      ค่าเริ่มต้นเป็น link-only หน้าใดที่ท้ายหน้าเป็น CC0, CC BY หรือ CC BY-SA ดัดแปลงได้หลังบันทึกใบอนุญาตของหน้านั้น
      หน้า NC/NC-SA ทำได้เฉพาะหัวข้อที่ใช้ CC-BY-NC-SA-4.0 หน้า ND และหน้าที่ไม่ระบุใบอนุญาตใช้ได้แค่ลิงก์
    evidence_url: https://chem.libretexts.org/Courses/Remixer_University/Construction_Guide_for_LibreTexts_2e/10:_Page_Settings/10.06:_Selecting_Copyright_for_Page_(Meta-Tags)

  - id: ck12
    name: CK-12 Foundation
    url: https://www.ck12.org/
    languages: [en]
    subjects: [math, physics, chemistry]
    license: CK-12 Curriculum Materials License (custom, not Creative Commons; last updated 2021-02-16)
    reuse: link-only
    api: ไม่มี API สาธารณะ
    notes: >-
      ตั้งแต่ ก.พ. 2564 CK-12 เปลี่ยนจาก CC BY-NC เป็นใบอนุญาตของตัวเอง อนุญาตให้คัดลอกและดัดแปลง "solely for Educational Purposes"
      ซึ่งนิยามไว้แคบ (นักเรียน ผู้ปกครอง ครู สถานศึกษาไม่แสวงกำไร ติวเตอร์รายบุคคล) งานดัดแปลงต้องใช้ใบอนุญาตเดียวกัน
      ใบอนุญาตเพิกถอนได้ (revocable) และต้องให้สิทธิ์ CK-12 นำงานดัดแปลงไปใช้ได้ทุกวัตถุประสงค์
      ใช้กับเนื้อหาของคลังที่เป็น CC ไม่ได้ ADR 0001 ที่เขียนว่า CK-12 เป็น CC BY-NC จึงล้าสมัย
    evidence_url: https://www.ck12info.org/curriculum-materials-license/

