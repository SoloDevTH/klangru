<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="sans-serif">
<title>ปัจจัยของความรุนแรงหลายระดับ</title>
<rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="380.0" y="28.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">ปัจจัยที่ทำให้เกิดความรุนแรงหลายระดับ (ดัดแปลงจาก WHO)</text>
<circle cx="230.0" cy="220.0" r="170.0" fill="#d6eaf8" stroke="#333" stroke-width="1.5"/>
<circle cx="230.0" cy="220.0" r="115.0" fill="#d5f5e3" stroke="#333" stroke-width="1.5"/>
<circle cx="230.0" cy="220.0" r="60.0" fill="#fdebd0" stroke="#333" stroke-width="1.5"/>
<text x="230.0" y="225.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">บุคคล</text>
<text x="230.0" y="140.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">ความสัมพันธ์</text>
<text x="230.0" y="85.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">ชุมชนและสังคม</text>
<rect x="430.0" y="60.0" width="310.0" height="100.0" rx="8" fill="#fdebd0" stroke="#333" stroke-width="1.5"/>
<text x="445.0" y="84.0" font-size="14" text-anchor="start" font-weight="bold" fill="#111">บุคคล</text>
<text x="455.0" y="108.0" font-size="12.5" text-anchor="start" fill="#111">• ใช้แอลกอฮอล์และสารเสพติดเร็ว</text>
<text x="455.0" y="128.0" font-size="12.5" text-anchor="start" fill="#111">• จัดการอารมณ์ไม่ได้</text>
<text x="455.0" y="148.0" font-size="12.5" text-anchor="start" fill="#111">• เคยเห็นหรือถูกทำร้ายในบ้าน</text>
<rect x="430.0" y="170.0" width="310.0" height="100.0" rx="8" fill="#d5f5e3" stroke="#333" stroke-width="1.5"/>
<text x="445.0" y="194.0" font-size="14" text-anchor="start" font-weight="bold" fill="#111">ความสัมพันธ์</text>
<text x="455.0" y="218.0" font-size="12.5" text-anchor="start" fill="#111">• ลงโทษรุนแรงหรือขาดการดูแล</text>
<text x="455.0" y="238.0" font-size="12.5" text-anchor="start" fill="#111">• กลุ่มเพื่อนหรือแก๊งใช้ความรุนแรง</text>
<text x="455.0" y="258.0" font-size="12.5" text-anchor="start" fill="#111">• ค่านิยมต้องเอาคืน</text>
<rect x="430.0" y="280.0" width="310.0" height="100.0" rx="8" fill="#d6eaf8" stroke="#333" stroke-width="1.5"/>
<text x="445.0" y="304.0" font-size="14" text-anchor="start" font-weight="bold" fill="#111">ชุมชนและสังคม</text>
<text x="455.0" y="328.0" font-size="12.5" text-anchor="start" fill="#111">• สุราและอาวุธหาง่าย ยาเสพติด</text>
<text x="455.0" y="348.0" font-size="12.5" text-anchor="start" fill="#111">• ความยากจน ความเหลื่อมล้ำ</text>
<text x="455.0" y="368.0" font-size="12.5" text-anchor="start" fill="#111">• ค่านิยมชายเป็นใหญ่ สื่อทำให้ดูเท่</text>
</svg>
