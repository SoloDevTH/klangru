  - id: computer.programming.design-debug.p017
    topics: [computer.programming.design-debug]
    difficulty: 5
    type: numeric
    stem: |
      ปีอธิกสุริยคติ (กุมภาพันธ์มี 29 วัน) คือ ค.ศ. ที่หาร 4 ลงตัว ยกเว้นปีที่หาร 100 ลงตัว แต่ถ้าหาร 400 ลงตัวก็เป็นปีอธิกสุริยคติ นักเรียนเขียนฟังก์ชันนี้สำหรับปฏิทินกิจกรรมโรงเรียน แล้วทดสอบกับปี 1900, 2000, 2023, 2024 และ 2100 ฟังก์ชันให้ผล **ผิด** กี่ปี

      ```python
      def is_leap(y):
          return y % 4 == 0 and y % 100 != 0
      ```
    answer: { value: 1, unit: ปี }
    hints:
      - "หาคำตอบที่ถูกของแต่ละปีตามกติกาเต็มก่อน แล้วหาผลของฟังก์ชัน"
      - "ฟังก์ชันลืมกรณีใดในกติกา ปีใดในชุดทดสอบเข้ากรณีนั้น"
