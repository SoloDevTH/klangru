<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" font-family="sans-serif">
<title>โครงสร้างกำลังแรงงาน</title>
<defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#222"/></marker></defs>
<rect width="700" height="340" fill="#ffffff"/>
<rect x="240.0" y="15.0" width="220.0" height="60.0" fill="#eef2f7" stroke="#335" stroke-width="1.5" rx="8"/>
<text x="350.0" y="39.0" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">ผู้อายุ 15 ปีขึ้นไป</text>
<text x="350.0" y="61.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">1,200,000 คน</text>
<rect x="60.0" y="120.0" width="240.0" height="60.0" fill="#d9e7f7" stroke="#335" stroke-width="1.5" rx="8"/>
<text x="180.0" y="144.0" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">กำลังแรงงาน</text>
<text x="180.0" y="166.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">800,000 คน</text>
<rect x="400.0" y="120.0" width="260.0" height="60.0" fill="#f2f2f2" stroke="#335" stroke-width="1.5" rx="8"/>
<text x="530.0" y="144.0" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">ผู้อยู่นอกกำลังแรงงาน</text>
<text x="530.0" y="166.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">400,000 คน</text>
<text x="530.0" y="200.0" font-size="12" text-anchor="middle" fill="#444" font-weight="normal">นักเรียน ผู้ทำงานบ้าน ผู้เกษียณ</text>
<rect x="10.0" y="225.0" width="160.0" height="60.0" fill="#dff1e3" stroke="#335" stroke-width="1.5" rx="8"/>
<text x="90.0" y="249.0" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">ผู้มีงานทำ</text>
<text x="90.0" y="271.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">760,000 คน</text>
<rect x="190.0" y="225.0" width="160.0" height="60.0" fill="#fbe3dd" stroke="#335" stroke-width="1.5" rx="8"/>
<text x="270.0" y="249.0" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">ผู้ว่างงาน</text>
<text x="270.0" y="271.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">40,000 คน</text>
<line x1="350.0" y1="75.0" x2="180.0" y2="120.0" stroke="#335" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="350.0" y1="75.0" x2="530.0" y2="120.0" stroke="#335" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="180.0" y1="180.0" x2="90.0" y2="225.0" stroke="#335" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="180.0" y1="180.0" x2="270.0" y2="225.0" stroke="#335" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="370.0" y="318.0" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold">อัตราการว่างงาน = 40,000 ÷ 800,000 × 100 = 5% (จังหวัดสมมติ)</text>
</svg>