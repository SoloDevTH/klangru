id: earthscience.atmosphere.energy-balance
subject: earthscience
title: { th: พลังงานจากดวงอาทิตย์และสมดุลพลังงานของโลก, en: "Solar energy and Earth's energy balance" }
summary: ปัจจัยที่ทำให้แต่ละบริเวณรับและคายพลังงานจากดวงอาทิตย์ต่างกัน มุมแสง ฤดูกาล อัลบีโด ความจุความร้อน งบพลังงานของโลก ปรากฏการณ์เรือนกระจก และการป้อนกลับ
difficulty: 5
minutes: 40
prerequisites: [physics.thermal.temperature-heat]
encompasses:
  - { id: physics.thermal.temperature-heat, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: มุมของแสงอาทิตย์กับละติจูด
    src: sun-angle.svg
    alt: "โลกเป็นวงกลม มีเส้นศูนย์สูตรเป็นเส้นประแนวนอน ลำแสงอาทิตย์สองลำที่กว้างเท่ากันส่องมาจากทางซ้าย ลำหนึ่งตกที่เส้นศูนย์สูตรแบบตั้งฉาก ส่วนโค้งสีแดงที่รับแสงสั้น เขียนว่าแสงตกตั้งฉาก พื้นที่รับแสงเล็ก ร้อนมาก อีกลำตกที่ละติจูด 50 องศาเหนือแบบเฉียง ส่วนโค้งสีแดงที่รับแสงยาวกว่า เขียนว่าแสงตกเฉียง พลังงานกระจายบนพื้นที่ใหญ่ขึ้น"
    caption: "ที่ละติจูดสูง แสงยังผ่านบรรยากาศเป็นระยะทางยาวกว่าด้วย (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: worked-example
    title: เทียบแสงตอนเที่ยงที่กรุงเทพฯ ในเดือนธันวาคมกับเมษายน
    problem: "กรุงเทพฯ อยู่ละติจูด $13.75°$ เหนือ หาความเข้มแสงอาทิตย์ตอนเที่ยงบนพื้นราบที่ยอดบรรยากาศ ในวันที่เดคลิเนชัน $-23.44°$ (21 ธ.ค.) และ $+13.75°$ (ปลาย เม.ย.) ใช้ $S = 1{,}361\\ \\mathrm{W/m^2}$"
    steps:
      - text: "21 ธ.ค.: $z = |13.75 - (-23.44)| = 37.19°$"
        why: "ตอนเที่ยงดวงอาทิตย์อยู่บนเส้นเมริเดียน มุมจากแนวดิ่งจึงเป็นผลต่างของละติจูดกับเดคลิเนชัน"
      - text: "$I = 1{,}361 \\cos 37.19° \\approx 1{,}084\\ \\mathrm{W/m^2}$"
      - text: "ปลาย เม.ย.: $z = |13.75 - 13.75| = 0°$ ดวงอาทิตย์อยู่เหนือศีรษะ $I = 1{,}361\\ \\mathrm{W/m^2}$"
      - text: "อัตราส่วน $1{,}084/1{,}361 \\approx 0.80$ ตอนเที่ยงเดือนธันวาคมได้พลังงานต่อพื้นที่ราวร้อยละ 80 ของปลายเดือนเมษายน และกลางวันก็สั้นกว่าด้วย"
    answer: "ธันวาคมราว 1,084 W/m² เมษายนราว 1,361 W/m²"
  - { type: check, problem: earthscience.atmosphere.energy-balance.p004, prompt: "ดวงอาทิตย์ผ่านเหนือศีรษะกรุงเทพฯ เมื่อไร" }
  - type: figure
    title: อัลบีโดของพื้นผิวต่าง ๆ
    src: albedo.svg
    alt: "แผนภูมิแท่งแนวนอนช่วงอัลบีโดโดยประมาณ หิมะใหม่ 0.80–0.90 น้ำแข็งทะเล 0.50–0.70 เมฆหนา 0.60–0.90 ทรายทะเลทราย 0.30–0.40 นาข้าวและทุ่งหญ้า 0.15–0.25 ป่าไม้ 0.08–0.15 ถนนแอสฟัลต์ 0.05–0.10 มหาสมุทรตอนแดดสูง 0.05–0.08"
    caption: "ค่าโดยประมาณ ขึ้นกับมุมแสงและสภาพพื้นผิว (วาดโดยทีมคลังรู้)"
  - type: figure
    title: งบพลังงานของโลก
    src: energy-budget.svg
    alt: "แผนภาพสามชั้น อวกาศ บรรยากาศ และผิวโลก ลูกศรแสงอาทิตย์เข้ามา 340 ลูกศรสะท้อนออกจากเมฆและอากาศ 77 และจากพื้น 23 รวม 100 อัลบีโดราว 0.3 อากาศดูดกลืน 77 ผิวโลกดูดกลืน 163 ผิวโลกแผ่อินฟราเรดขึ้น 398 แก๊สเรือนกระจกแผ่กลับลงมา 340 การระเหย 86 การนำและพาความร้อน 18 อินฟราเรดออกสู่อวกาศ 240 หน่วยวัตต์ต่อตารางเมตร เฉลี่ยทั้งโลก ยอดบรรยากาศ เข้า 340 ใกล้เคียงออก 100 บวก 240 ปัจจุบันเข้ามากกว่าออกราว 0.6"
    caption: "ค่าเฉลี่ยทั้งโลกตลอดปี ปัดเศษจากแผนภาพงบพลังงานของ NASA (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: อุณหภูมิสมดุลของโลกที่ไม่มีบรรยากาศ
    problem: "ใช้ $S = 1{,}361\\ \\mathrm{W/m^2}$, $\\alpha = 0.30$, $\\sigma = 5.67 \\times 10^{-8}\\ \\mathrm{W/(m^2\\cdot K^4)}$ หาอุณหภูมิที่โลกแผ่รังสีออกเท่ากับที่ดูดกลืน"
    steps:
      - text: "พลังงานที่ดูดกลืนเฉลี่ย $= S(1-\\alpha)/4 = 1{,}361 \\times 0.70 / 4 \\approx 238\\ \\mathrm{W/m^2}$"
        why: "หาร 4 เพราะรับแสงด้วยพื้นที่หน้าตัด แต่แผ่รังสีจากผิวทั้งลูก"
      - text: "สมดุล: $\\sigma T^4 = 238$ จึงได้ $T^4 = 238 / 5.67 \\times 10^{-8} = 4.20 \\times 10^9$"
      - text: "$T = (4.20 \\times 10^9)^{1/4} \\approx 255\\ \\mathrm{K}$ หรือราว $-18\\ °\\mathrm{C}$"
      - text: "ผิวโลกจริงเฉลี่ยราว $288\\ \\mathrm{K}$ ส่วนต่างราว 33 K มาจากแก๊สเรือนกระจกที่แผ่อินฟราเรดกลับลงมา"
    answer: "ประมาณ 255 K"
  - type: interactive
    title: อุณหภูมิสมดุลกับอัลบีโด
    caption: "เส้นคือ $T = 278.3\\,[s(1-x)]^{1/4}$ เคลวิน เมื่อ $x$ คืออัลบีโด และ $s$ คือพลังงานจากดวงอาทิตย์เทียบกับปัจจุบัน (1 = 1,361 W/m²) ลองดูที่ $x = 0.3$ แล้วเพิ่ม $x$ เป็น 0.6 เหมือนโลกที่ปกคลุมด้วยน้ำแข็งมาก"
    widget:
      kind: function-plot
      functions: ["278.3\\cdot(s\\cdot(1-x))^{0.25}"]
      sliders:
        - { name: s, min: 0.8, max: 1.2, step: 0.01, value: 1, label: พลังงานจากดวงอาทิตย์ (เท่าของปัจจุบัน) }
      x: [0, 0.9]
      y: [150, 300]
  - { type: check, problem: earthscience.atmosphere.energy-balance.p011, prompt: "ผลสุดท้ายย้อนไปเสริมสาเหตุเดิม" }
  - type: simulation
    title: "ปรากฏการณ์เรือนกระจก (PhET Greenhouse Effect)"
    url: https://phet.colorado.edu/en/simulations/greenhouse-effect
    provider: phet
    note: "เพิ่มความเข้มข้นของแก๊สเรือนกระจกแล้วสังเกตโฟตอนอินฟราเรดที่ถูกดูดกลืนและแผ่กลับลงมา ดูอุณหภูมิเพิ่มขึ้นจนถึงค่าคงที่ใหม่ ลองเพิ่มเมฆแล้วดูว่าแสงอาทิตย์ถูกสะท้อนออกไปอย่างไร"
glossary:
  - { term: ค่าคงตัวสุริยะ, definition: "กำลังของแสงอาทิตย์ที่ตกตั้งฉากบนพื้นที่ 1 ตารางเมตรที่ยอดบรรยากาศ ประมาณ 1,361 W/m²" }
  - { term: อัลบีโด, definition: "สัดส่วนของพลังงานแสงที่พื้นผิวสะท้อนกลับ เทียบกับที่ตกกระทบ มีค่า 0 ถึง 1" }
  - { term: มุมเซนิท, definition: "มุมระหว่างทิศของดวงอาทิตย์กับแนวดิ่งเหนือศีรษะ ความเข้มบนพื้นราบเป็น S cos z" }
  - { term: สมดุลพลังงาน, definition: "สภาพที่พลังงานที่โลกได้รับเท่ากับพลังงานที่โลกคายออกสู่อวกาศ อุณหภูมิเฉลี่ยจึงคงที่" }
  - { term: ปรากฏการณ์เรือนกระจก, definition: "การที่แก๊สในบรรยากาศดูดกลืนอินฟราเรดจากผิวโลกแล้วแผ่กลับลงมา ทำให้ผิวโลกอุ่นกว่ากรณีไม่มีบรรยากาศ" }
  - { term: การป้อนกลับ, definition: "การที่ผลของการเปลี่ยนแปลงย้อนไปเสริม (ป้อนกลับแบบเสริม) หรือลด (ป้อนกลับแบบลด) การเปลี่ยนแปลงเดิม" }
flashcards:
  - { front: "ปัจจัยที่ทำให้แต่ละบริเวณได้พลังงานต่างกัน", back: "มุมแสงตามละติจูดและฤดู ความยาวกลางวัน อัลบีโด เมฆ ชนิดพื้นผิว ความสูง และการพาความร้อนโดยลมและกระแสน้ำ" }
  - { front: "ทำไมค่าเฉลี่ยที่โลกได้รับคือ S/4", back: "โลกรับแสงด้วยพื้นที่หน้าตัด πR² แต่กระจายบนผิวทั้งหมด 4πR²" }
  - { front: "โลกที่ไม่มีเรือนกระจกจะมีอุณหภูมิเท่าไร", back: "ราว 255 K (−18 °C) ผิวโลกจริงราว 288 K (15 °C)" }
  - { front: "การป้อนกลับของน้ำแข็งกับอัลบีโด", back: "ร้อนขึ้น → น้ำแข็งละลาย → อัลบีโดลด → ดูดกลืนมากขึ้น → ร้อนขึ้นอีก" }
