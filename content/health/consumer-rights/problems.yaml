- id: health.consumer.consumer-rights.p015
  topics:
  - health.consumer.consumer-rights
  difficulty: 5
  type: mcq
  stem: ตาของภูมิไปตรวจที่คลินิกเอกชน พนักงานเร่งให้เซ็นสัญญาซื้อแพ็กเกจอาหารเสริม 30,000 บาท โดยบอกว่า "ราคานี้วันนี้วันเดียว" และไม่ให้นำสัญญากลับไปอ่าน ข้อใดเป็นการปฏิบัติตนตามสิทธิผู้บริโภคที่เหมาะสมที่สุด
  choices:
  - id: a
    text: ไม่เซ็นทันที ขอสำเนาสัญญาและข้อมูลสินค้ากลับไปอ่านและปรึกษาลูกหลานหรือเภสัชกร ตรวจเลข อย. และถ้าถูกกดดันหรือเงื่อนไขไม่เป็นธรรมให้ร้องเรียน สคบ. 1166
    correct: true
  - id: b
    text: เซ็นทันทีเพราะกลัวเสียโอกาสได้ราคาถูก
    feedback: การเร่งให้ตัดสินใจเป็นสัญญาณเตือน และเป็นการกดดันที่ขัดกับสิทธิเลือกอย่างอิสระและสิทธิทำสัญญาที่เป็นธรรม
  - id: c
    text: เซ็นแล้วค่อยยกเลิกภายหลัง
    feedback: การยกเลิกสัญญาที่ลงนามแล้วอาจยุ่งยากและเสียค่าใช้จ่าย ควรอ่านและเข้าใจก่อนลงนาม
  hints:
  - การเร่งให้ตัดสินใจละเมิดสิทธิข้อใด
  - ผู้บริโภคมีหน้าที่อ่านสัญญาและข้อมูลก่อนตัดสินใจ
  solution: การไม่เซ็นภายใต้แรงกดดัน การขอข้อมูลและสัญญามาอ่าน การปรึกษาผู้รู้ และการร้องเรียนเมื่อถูกเอาเปรียบ เป็นการใช้สิทธิที่จะได้รับข่าวสาร สิทธิเลือกอย่างอิสระ และสิทธิทำสัญญาที่เป็นธรรม
