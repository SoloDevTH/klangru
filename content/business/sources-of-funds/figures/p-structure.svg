<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="560" height="260" font-family="sans-serif">
<title>โครงสร้างเงินทุนของบริษัทสมมติ</title>
<defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#222"/></marker></defs>
<rect width="560" height="260" fill="#ffffff"/>
<text x="280.0" y="28.0" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">บริษัท ก (สมมติ) มูลค่าตลาดของเงินทุน</text>
<rect x="40.0" y="60.0" width="288.0" height="70.0" fill="#1e7d45" stroke="#fff" stroke-width="2" rx="0"/>
<text x="184.0" y="92.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">ส่วนของผู้ถือหุ้น 60 ล้านบาท</text>
<text x="184.0" y="114.0" font-size="13" text-anchor="middle" fill="#fff" font-weight="normal">ผลตอบแทนที่ต้องการ 10%</text>
<rect x="328.0" y="60.0" width="192.0" height="70.0" fill="#1f5fa8" stroke="#fff" stroke-width="2" rx="0"/>
<text x="424.0" y="92.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">หนี้ 40 ล้านบาท</text>
<text x="424.0" y="114.0" font-size="13" text-anchor="middle" fill="#fff" font-weight="normal">ดอกเบี้ย 6% ต่อปี</text>
<text x="40.0" y="170.0" font-size="14" text-anchor="start" fill="#222" font-weight="normal">อัตราภาษีเงินได้นิติบุคคล 20%</text>
<text x="40.0" y="200.0" font-size="14" text-anchor="start" fill="#222" font-weight="normal">ดอกเบี้ยหักเป็นค่าใช้จ่ายทางภาษีได้</text>
</svg>