problems:
  - id: phy.wn.p001
    topics: [physics.dynamics.weight-normal]
    difficulty: 1
    type: numeric
    stem: "นักเรียนคนหนึ่งมีมวล $50\\ \\mathrm{kg}$ มีน้ำหนักบนโลกเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 490, unit: N }
    hints:
      - "น้ำหนักเป็นแรง หน่วยนิวตัน ไม่ใช่กิโลกรัม"
      - "ใช้ $W = mg$"
    misconceptions:
      - { match: 50, feedback: "นั่นคือมวล ($\\mathrm{kg}$) น้ำหนักเป็นแรงที่โลกดึงดูด ต้องคูณมวลด้วย $g$" }
      - { match: 5.1, feedback: "ดูเหมือนนำมวลหารด้วย $g$ น้ำหนักได้จาก $W = mg$ คือคูณ ไม่ใช่หาร" }
    solution: "$W = mg = (50\\ \\mathrm{kg})(9.8\\ \\mathrm{m/s^2}) = 490\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wn.p002
    topics: [physics.dynamics.weight-normal]
    difficulty: 1
    type: mcq
    stem: "นักบินอวกาศมีมวล $70\\ \\mathrm{kg}$ บนโลก เมื่อไปยืนบนดวงจันทร์ซึ่งมีความเร่งโน้มถ่วงประมาณ $\\tfrac{1}{6}$ ของโลก มวลของเขาเป็นเท่าใด"
    choices:
      - { id: a, text: "$70\\ \\mathrm{kg}$", correct: true }
      - { id: b, text: "ประมาณ $11.7\\ \\mathrm{kg}$", feedback: "ที่ลดลงเหลือ $\\tfrac{1}{6}$ คือ **น้ำหนัก** ไม่ใช่มวล มวลคือปริมาณเนื้อสารซึ่งไม่ขึ้นกับสถานที่" }
      - { id: c, text: "$0\\ \\mathrm{kg}$", feedback: "มวลไม่ได้หายไปเมื่อออกจากโลก แม้แต่ในอวกาศที่รู้สึกไร้น้ำหนัก มวลก็ยังเท่าเดิม" }
      - { id: d, text: "$686\\ \\mathrm{N}$", feedback: "นั่นคือน้ำหนักบนโลก ($70 \\times 9.8$) และมีหน่วยเป็นนิวตัน ซึ่งเป็นหน่วยของแรง ไม่ใช่มวล" }
    hints:
      - "มวลกับน้ำหนักต่างกันอย่างไร"
      - "สิ่งใดขึ้นกับ $g$ และสิ่งใดไม่ขึ้นกับ $g$"
    solution: "มวลคือปริมาณเนื้อสาร ไม่ขึ้นกับสถานที่ จึงยังเป็น $70\\ \\mathrm{kg}$ ส่วนน้ำหนักบนดวงจันทร์ลดลงเหลือราว $\\tfrac{1}{6}$ ของบนโลก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wn.p003
    topics: [physics.dynamics.weight-normal]
    difficulty: 2
    type: numeric
    stem: "ความเร่งโน้มถ่วงบนดวงจันทร์ประมาณ $1.6\\ \\mathrm{m/s^2}$ นักบินอวกาศมวล $70\\ \\mathrm{kg}$ มีน้ำหนักบนดวงจันทร์เท่าใด (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 112, unit: N }
    hints:
      - "สูตรน้ำหนักใช้ได้กับทุกดาว แค่เปลี่ยนค่า $g$"
      - "ใช้ $W = mg$ โดยให้ $g$ เป็นของดวงจันทร์"
    misconceptions:
      - { match: 686, feedback: "นั่นคือน้ำหนักบนโลก (ใช้ $g = 9.8\\ \\mathrm{m/s^2}$) ข้อนี้อยู่บนดวงจันทร์ ต้องใช้ $g = 1.6\\ \\mathrm{m/s^2}$" }
      - { match: 43.75, feedback: "ดูเหมือนนำมวลหารด้วย $g$ น้ำหนักคือ $W = mg$ ต้องคูณ" }
    solution: "$W = mg_{\\text{ดวงจันทร์}} = (70\\ \\mathrm{kg})(1.6\\ \\mathrm{m/s^2}) = 112\\ \\mathrm{N}$ (มวลยังเป็น $70\\ \\mathrm{kg}$ เท่าเดิม)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wn.p004
    topics: [physics.dynamics.weight-normal]
    difficulty: 2
    type: numeric
    stem: "หนังสือมวล $2\\ \\mathrm{kg}$ วางนิ่งบนโต๊ะราบ โดยไม่มีแรงอื่นกระทำในแนวดิ่ง โต๊ะดันหนังสือขึ้นด้วยแรงปฏิกิริยาตั้งฉากเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 19.6, tolerance: 0.1, unit: N }
    hints:
      - "หนังสือนิ่ง แรงลัพธ์ในแนวดิ่งจึงเป็นศูนย์"
      - "แรงในแนวดิ่งมีแค่น้ำหนักลงกับแรงปฏิกิริยาตั้งฉากขึ้น สองแรงนี้ต้องหักล้างกันพอดี"
    misconceptions:
      - { match: 2, feedback: "นั่นคือมวล ($\\mathrm{kg}$) แรงปฏิกิริยาต้องเท่ากับน้ำหนัก $mg$ ในหน่วยนิวตัน" }
      - { match: 0, feedback: "ถ้าโต๊ะไม่ดันขึ้น หนังสือจะตกทะลุโต๊ะ เมื่อหนังสือนิ่ง โต๊ะต้องดันขึ้นด้วยแรงเท่ากับน้ำหนัก" }
    solution: "ทิศขึ้นเป็นบวก: $N - mg = 0$ → $N = mg = (2\\ \\mathrm{kg})(9.8\\ \\mathrm{m/s^2}) = 19.6\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wn.p005
    topics: [physics.dynamics.weight-normal]
    difficulty: 3
    type: numeric
    stem: "กล่องมวล $5\\ \\mathrm{kg}$ วางนิ่งบนโต๊ะ มีคนใช้มือกดกล่องลงตรง ๆ ด้วยแรง $20\\ \\mathrm{N}$ แรงปฏิกิริยาตั้งฉากที่โต๊ะดันกล่องเป็นเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 69, unit: N }
    hints:
      - "วาดแผนภาพแรง: แรงลงมีสองแรง แรงขึ้นมีหนึ่งแรง"
      - "กล่องนิ่ง แรงขึ้นต้องเท่ากับผลรวมของแรงลง"
      - "$N = mg + F$"
    misconceptions:
      - { match: 49, feedback: "นั่นคือน้ำหนักของกล่องอย่างเดียว แรงกดจากมือก็ดันกล่องลงด้วย โต๊ะจึงต้องดันขึ้นมากกว่า $mg$" }
      - { match: 29, feedback: "แรงกดจากมือมีทิศลงเหมือนน้ำหนัก ต้องบวกเพิ่ม ไม่ใช่ลบออก" }
    solution: "ทิศขึ้นเป็นบวก กล่องนิ่ง: $N - mg - F = 0$ → $N = (5)(9.8) + 20 = 49 + 20 = 69\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wn.p006
    topics: [physics.dynamics.weight-normal]
    difficulty: 3
    type: numeric
    stem: "ถังน้ำมวลรวม $5\\ \\mathrm{kg}$ วางอยู่บนพื้นข้างโอ่ง เด็กคนหนึ่งดึงหูถังขึ้นตรง ๆ ด้วยแรง $15\\ \\mathrm{N}$ แต่ถังยังไม่ลอยขึ้น พื้นดันถังด้วยแรงปฏิกิริยาตั้งฉากเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 34, unit: N }
    hints:
      - "ถังยังนิ่ง แรงลัพธ์ในแนวดิ่งเป็นศูนย์"
      - "แรงขึ้นมีสองแรง คือแรงดึงของเด็กและแรงปฏิกิริยาจากพื้น"
      - "$N + F = mg$"
    misconceptions:
      - { match: 64, feedback: "แรงดึงของเด็กมีทิศขึ้น ช่วยพื้นรับน้ำหนักบางส่วน จึงต้องลบออกจาก $mg$ ไม่ใช่บวกเพิ่ม" }
      - { match: 49, feedback: "นั่นคือน้ำหนักของถัง แต่เด็กดึงขึ้นช่วยอยู่ $15\\ \\mathrm{N}$ พื้นจึงดันน้อยกว่า $mg$" }
    solution: "ทิศขึ้นเป็นบวก: $N + F - mg = 0$ → $N = (5)(9.8) - 15 = 49 - 15 = 34\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wn.p007
    topics: [physics.dynamics.weight-normal]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ยืนบนตาชั่งในลิฟต์ สถานการณ์ใดที่ตาชั่งอ่านค่า **มากกว่า** น้ำหนักจริง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ลิฟต์เริ่มออกตัวขึ้นจากชั้นล่าง", correct: true }
      - { id: b, text: "ลิฟต์กำลังลงแล้วชะลอเพื่อหยุดที่ชั้นล่าง", correct: true }
      - { id: c, text: "ลิฟต์ขึ้นด้วยความเร็วคงตัว", feedback: "ความเร็วคงตัวแปลว่าความเร่งเป็นศูนย์ ตาชั่งจึงอ่านได้เท่ากับน้ำหนักพอดี สิ่งที่ทำให้ค่าเปลี่ยนคือความเร่ง ไม่ใช่ทิศของความเร็ว" }
      - { id: d, text: "ลิฟต์กำลังขึ้นแล้วชะลอเพื่อหยุดที่ชั้นบน", feedback: "ลิฟต์ขึ้นแล้วช้าลง ความเร่งจึงมีทิศลง ตาชั่งอ่านค่าน้อยกว่าน้ำหนัก" }
      - { id: e, text: "ลิฟต์เริ่มออกตัวลงจากชั้นบน", feedback: "ลิฟต์เริ่มลงคือเร่งลง ตาชั่งอ่านค่าน้อยกว่าน้ำหนัก" }
    hints:
      - "ตาชั่งอ่านค่า $N = m(g + a)$ เมื่อทิศขึ้นเป็นบวก"
      - "หาว่าแต่ละสถานการณ์ ความเร่งมีทิศขึ้นหรือลง (ไม่ใช่ความเร็ว)"
    solution: "ตาชั่งอ่านมากกว่าน้ำหนักเมื่อความเร่งมีทิศขึ้น ได้แก่ ลิฟต์เริ่มขึ้น (เร็วขึ้นในทิศขึ้น) และลิฟต์ที่กำลังลงแล้วชะลอ (ช้าลงขณะลง ความเร่งจึงชี้ขึ้น)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wn.p008
    topics: [physics.dynamics.weight-normal]
    difficulty: 4
    type: numeric
    stem: "ลิฟต์ในห้างสรรพสินค้าเริ่มขึ้นด้วยความเร่ง $1.2\\ \\mathrm{m/s^2}$ คนมวล $60\\ \\mathrm{kg}$ ยืนอยู่ในลิฟต์ พื้นลิฟต์ดันคนด้วยแรงปฏิกิริยาตั้งฉากเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 660, unit: N }
    hints:
      - "คนมีความเร่งขึ้นไปพร้อมลิฟต์ แรงลัพธ์จึงไม่เป็นศูนย์"
      - "ให้ทิศขึ้นเป็นบวก: $N - mg = ma$"
      - "จัดรูปเป็น $N = m(g + a)$ แล้วแทนค่า"
    misconceptions:
      - { match: 588, feedback: "นั่นคือน้ำหนัก $mg$ ซึ่งใช้ได้เมื่อลิฟต์ไม่มีความเร่ง ลิฟต์ที่เร่งขึ้นต้องดันคนแรงกว่าน้ำหนัก" }
      - { match: 516, feedback: "ลิฟต์เร่ง **ขึ้น** ความเร่งเป็นบวก จึงได้ $N = m(g + a)$ ไม่ใช่ $m(g - a)$" }
    solution: "ทิศขึ้นเป็นบวก: $N - mg = ma$ → $N = m(g + a) = (60\\ \\mathrm{kg})(9.8 + 1.2)\\ \\mathrm{m/s^2} = 660\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wn.p009
    topics: [physics.dynamics.weight-normal]
    difficulty: 4
    type: numeric
    stem: "คนมวล $50\\ \\mathrm{kg}$ ยืนบนตาชั่งในลิฟต์ที่กำลังเร่งลงด้วยความเร่งขนาด $2\\ \\mathrm{m/s^2}$ ตาชั่งดันคนด้วยแรงเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 390, unit: N }
    hints:
      - "ให้ทิศขึ้นเป็นบวก ความเร่งทิศลงจึงเป็น $a = -2\\ \\mathrm{m/s^2}$"
      - "ใช้ $N = m(g + a)$ ระวังเครื่องหมายของ $a$"
    misconceptions:
      - { match: 590, feedback: "ลิฟต์เร่ง **ลง** ความเร่งต้องเป็นลบเมื่อทิศขึ้นเป็นบวก จึงได้ $N = m(g - 2)$" }
      - { match: 490, feedback: "นั่นคือน้ำหนักจริงซึ่งใช้ได้เมื่อไม่มีความเร่ง ลิฟต์ที่เร่งลงทำให้ตาชั่งดันน้อยกว่าน้ำหนัก" }
    solution: "ทิศขึ้นเป็นบวก $a = -2\\ \\mathrm{m/s^2}$: $N = m(g + a) = (50)(9.8 - 2) = (50)(7.8) = 390\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wn.p010
    topics: [physics.dynamics.weight-normal]
    difficulty: 5
    type: numeric
    stem: "ตาชั่งดิจิทัลแสดงผลเป็นกิโลกรัม โดยนำแรงที่ดันเท้าหารด้วย $9.8$ คนมวล $55\\ \\mathrm{kg}$ ยืนบนตาชั่งนี้ในลิฟต์คอนโดที่เริ่มขึ้นด้วยความเร่ง $1.4\\ \\mathrm{m/s^2}$ ตาชั่งแสดงกี่กิโลกรัม ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขทศนิยม 1 ตำแหน่ง ในหน่วย kg)"
    answer: { value: 62.86, tolerance: 0.6, unit: kg }
    hints:
      - "หาแรงที่ตาชั่งดันเท้าก่อน ด้วย $N = m(g + a)$"
      - "ค่าที่แสดงบนจอคือ $\\dfrac{N}{9.8}$"
      - "หรือคิดลัด: ค่าที่แสดง $= m \\cdot \\dfrac{g + a}{g}$"
    misconceptions:
      - { match: 55, feedback: "นั่นคือค่าที่แสดงเมื่อลิฟต์ไม่มีความเร่ง ลิฟต์ที่เร่งขึ้นทำให้ตาชั่งถูกกดแรงกว่าปกติ" }
      - { match: 47.14, feedback: "ลิฟต์เร่ง **ขึ้น** ต้องใช้ $g + a$ ไม่ใช่ $g - a$" }
    solution: "$N = (55)(9.8 + 1.4) = (55)(11.2) = 616\\ \\mathrm{N}$ ตาชั่งแสดง $\\dfrac{616}{9.8} \\approx 62.9\\ \\mathrm{kg}$ แม้มวลจริงยังเป็น $55\\ \\mathrm{kg}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wn.p011
    topics: [physics.dynamics.weight-normal]
    difficulty: 5
    type: numeric
    stem: "คนมวล $60\\ \\mathrm{kg}$ ยืนบนตาชั่งในลิฟต์ ตาชั่งอ่านแรงได้ $480\\ \\mathrm{N}$ ลิฟต์มีความเร่งขนาดเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขบวกในหน่วย m/s²)"
    answer: { value: 1.8, tolerance: 0.02, unit: m/s² }
    hints:
      - "ตาชั่งอ่านน้อยกว่าน้ำหนักจริง ($588\\ \\mathrm{N}$) แปลว่าความเร่งมีทิศใด"
      - "ทิศขึ้นเป็นบวก: $N - mg = ma$"
      - "จัดรูปเป็น $a = \\dfrac{N - mg}{m}$ แล้วตอบเฉพาะขนาด"
    misconceptions:
      - { match: 8, feedback: "ดูเหมือนนำ $N$ หารด้วยมวลตรง ๆ แรงลัพธ์ไม่ใช่ $N$ อย่างเดียว ต้องหักน้ำหนักออกก่อน: $\\Sigma F = N - mg$" }
      - { match: 17.8, feedback: "ดูเหมือนบวก $N$ กับ $mg$ แรงทั้งสองมีทิศตรงข้ามกัน แรงลัพธ์คือ $N - mg$" }
    solution: "$mg = (60)(9.8) = 588\\ \\mathrm{N}$ แล้ว $a = \\dfrac{N - mg}{m} = \\dfrac{480 - 588}{60} = -1.8\\ \\mathrm{m/s^2}$ ลิฟต์มีความเร่งขนาด $1.8\\ \\mathrm{m/s^2}$ ทิศลง (อาจกำลังเริ่มลง หรือกำลังขึ้นแล้วชะลอ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wn.p012
    topics: [physics.dynamics.weight-normal]
    difficulty: 2
    type: match
    stem: "จับคู่ปริมาณกับคำอธิบายที่ถูกต้อง"
    pairs:
      - { left: "มวล", right: "หน่วย $\\mathrm{kg}$ และมีค่าเท่าเดิมทุกที่" }
      - { left: "น้ำหนัก", right: "แรงดึงดูดของดาว หน่วย $\\mathrm{N}$ เปลี่ยนตาม $g$" }
      - { left: "แรงปฏิกิริยาตั้งฉาก", right: "แรงที่ผิวดันวัตถุในทิศตั้งฉากกับผิว" }
      - { left: "ค่าที่ตาชั่งอ่านได้", right: "แรงที่ตาชั่งดันเท้า (น้ำหนักปรากฏ)" }
