id: physics.rotation.static-equilibrium
subject: physics
title: { th: สมดุลกลและเครื่องกลอย่างง่าย, en: Static equilibrium and simple machines }
summary: แรงลัพธ์ของแรงที่ทำมุมกัน เงื่อนไขสมดุลต่อการเลื่อนที่และการหมุน สมดุลของแรงสามแรง ศูนย์กลางมวล ศูนย์ถ่วง เสถียรภาพ และประสิทธิภาพของเครื่องกล
difficulty: 6
minutes: 40
prerequisites: [physics.rotation.torque, physics.units.vectors, physics.energy.power, physics.energy.simple-machines]
encompasses:
  - { id: physics.rotation.torque, weight: 0.5 }
  - { id: physics.units.vectors, weight: 0.4 }
  - { id: physics.energy.simple-machines, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: แรงลัพธ์ด้วยรูปสี่เหลี่ยมด้านขนาน
    src: resultant.svg
    alt: "ลูกศร F₁ ขนาด 30 N ชี้ไปทางขวาตามแนวราบ และลูกศร F₂ ขนาด 40 N ชี้เฉียงขึ้นทำมุม 60 องศากับ F₁ จากจุดเดียวกัน เส้นประสร้างรูปสี่เหลี่ยมด้านขนาน เส้นทแยงมุมคือแรงลัพธ์ R ประมาณ 60.8 N ทำมุม 34.7 องศากับ F₁ ด้านขวามีการคำนวณ R² = 30² + 40² + 2(30)(40)cos 60° = 3700"
  - type: worked-example
    title: หาแรงลัพธ์ของแรงที่ทำมุมกัน
    problem: "เด็กสองคนดึงเชือกที่ผูกกับกล่องจากจุดเดียวกัน คนแรกดึง $30\\ \\mathrm{N}$ คนที่สองดึง $40\\ \\mathrm{N}$ เชือกทั้งสองทำมุม $60^\\circ$ กัน หาขนาดและทิศของแรงลัพธ์"
    steps:
      - text: "$R^2 = 30^2 + 40^2 + 2(30)(40)\\cos 60^\\circ = 900 + 1600 + 1200 = 3700$"
        why: "$\\cos 60^\\circ = 0.5$ มุมระหว่างแรงน้อยกว่า $90^\\circ$ แรงจึงเสริมกันมากกว่ากรณีตั้งฉาก"
      - text: "$R = \\sqrt{3700} \\approx 60.8\\ \\mathrm{N}$"
      - text: "$\\tan\\alpha = \\dfrac{40\\sin 60^\\circ}{30 + 40\\cos 60^\\circ} = \\dfrac{34.6}{50} = 0.693$ ได้ $\\alpha \\approx 34.7^\\circ$ จากแนวแรงของคนแรก"
        why: "แรงลัพธ์เอียงเข้าหาแรงที่มากกว่า มุมจึงมากกว่าครึ่งหนึ่งของ $60^\\circ$"
    answer: "แรงลัพธ์ประมาณ 60.8 N ทำมุม 34.7° กับแรง 30 N"
  - { type: check, problem: physics.rotation.static-equilibrium.p006, prompt: "ใช้สูตรที่มี 2F₁F₂ cos θ" }
  - type: figure
    title: สมดุลของแรงสามแรง
    src: three-forces.svg
    alt: "ภาพ ก. โคมไฟหนัก 100 N แขวนที่ปมเชือก เชือก 1 ไปทางซ้ายทำมุม 30 องศากับแนวราบ เชือก 2 ไปทางขวาทำมุม 60 องศากับแนวราบ ลูกศร T₁ สั้น T₂ ยาวกว่า และ W ชี้ลง ภาพ ข. นำลูกศรสามลูกมาต่อหางต่อหัว W ชี้ลง ต่อด้วย T₁ = 50 N ชี้ขึ้นซ้าย และ T₂ ≈ 86.6 N ชี้ขึ้นขวากลับมาที่จุดเริ่มต้น ได้สามเหลี่ยมปิด ข้างภาพเขียนทฤษฎีของลามี T₁/sin150° = T₂/sin120° = W/sin90°"
    caption: "สามเหลี่ยมของแรงปิดพอดีแปลว่าแรงลัพธ์เป็นศูนย์"
  - type: figure
    title: เสถียรภาพของตู้ทรงสูง
    src: stability.svg
    alt: "ตู้สี่เหลี่ยมผืนผ้ากว้าง 0.60 m สูง 1.80 m เอียงหมุนรอบขอบล่างด้านขวาสามมุม ก. เอียง 10 องศา เส้นประแนวดิ่งจากศูนย์ถ่วงตกในฐาน ตู้ตั้งกลับ ข. เอียง 18.4 องศา เส้นประตกที่ขอบฐานพอดี ค. เอียง 28 องศา เส้นประตกนอกฐาน ตู้ล้ม"
  - type: worked-example
    title: บันไดพิงผนังลื่น
    problem: "บันไดสม่ำเสมอยาว $5.0\\ \\mathrm{m}$ หนัก $200\\ \\mathrm{N}$ พิงผนังลื่น ปลายล่างห่างผนัง $3.0\\ \\mathrm{m}$ (ปลายบนสูง $4.0\\ \\mathrm{m}$) หาแรงจากผนัง แรงตั้งฉากจากพื้น และแรงเสียดทานที่พื้น"
    figure: { src: ladder.svg, alt: "บันไดพิงผนังด้านขวา ปลายล่างห่างผนัง 3.0 m ปลายบนสูง 4.0 m บันไดยาว 5.0 m น้ำหนัก W = 200 N กระทำที่กึ่งกลาง ผนังลื่นให้แรง N₁ ตั้งฉากกับผนังชี้ออกจากผนัง พื้นให้แรง N₂ ชี้ขึ้น และแรงเสียดทาน f ที่ปลายล่างชี้เข้าหาผนัง" }
    steps:
      - text: "แรงที่กระทำมีสี่แรง: $W$ ลงที่กึ่งกลาง $N_1$ จากผนังในแนวราบ (ผนังลื่นจึงไม่มีแรงเสียดทาน) $N_2$ ขึ้นจากพื้น และแรงเสียดทาน $f$ ที่พื้นชี้เข้าหาผนัง"
      - text: "ใช้ปลายล่างเป็นจุดหมุน: แขนของ $W$ คือระยะแนวราบ $1.5\\ \\mathrm{m}$ แขนของ $N_1$ คือความสูง $4.0\\ \\mathrm{m}$"
        why: "จุดหมุนที่ปลายล่างทำให้ $N_2$ และ $f$ ไม่มีโมเมนต์ เหลือตัวไม่รู้ค่าตัวเดียว"
      - text: "$\\sum M = 0$: $N_1(4.0) = 200(1.5)$ ได้ $N_1 = 75\\ \\mathrm{N}$"
      - text: "$\\sum F_x = 0$: $f = N_1 = 75\\ \\mathrm{N}$ และ $\\sum F_y = 0$: $N_2 = W = 200\\ \\mathrm{N}$"
    answer: "ผนังดันด้วยแรง 75 N พื้นดันขึ้น 200 N และแรงเสียดทานที่พื้น 75 N"
  - { type: check, problem: physics.rotation.static-equilibrium.p008, prompt: "เลือกจุดหมุนที่แรงอีกแรงผ่าน" }
  - type: interactive
    title: แรงลัพธ์ของแรงสองแรง
    caption: "ลากปลายลูกศรสองลูกให้มีขนาดและทิศต่าง ๆ แล้วดูลูกศรผลรวม ลองให้สองลูกศรชี้ตรงข้ามกันและขนาดเท่ากัน แรงลัพธ์จะเป็นศูนย์"
    widget: { kind: vector-add, a: [3, 0], b: [2, 3.5], draggable: true }
  - type: simulation
    title: "การรวมเวกเตอร์ (PhET Vector Addition)"
    url: https://phet.colorado.edu/en/simulations/vector-addition
    provider: phet
    note: "หน้า Explore 2D วางเวกเตอร์ขนาด 30 และ 40 หน่วยทำมุม 60 องศากัน แล้วเปิดผลรวม เทียบขนาดที่ได้กับการคำนวณ 60.8"
glossary:
  - { term: สมดุลกล, definition: "สภาพที่วัตถุไม่เปลี่ยนสภาพการเคลื่อนที่ทั้งการเลื่อนที่และการหมุน ต้องมีแรงลัพธ์และโมเมนต์ลัพธ์เป็นศูนย์" }
  - { term: แผนภาพวัตถุอิสระ, definition: "ภาพวัตถุที่แยกออกมาพร้อมลูกศรแทนแรงทุกแรงที่กระทำต่อวัตถุนั้น" }
  - { term: ทฤษฎีของลามี, definition: "เมื่อแรงสามแรงสมดุล แต่ละแรงหารด้วยไซน์ของมุมระหว่างแรงอีกสองแรงมีค่าเท่ากัน" }
  - { term: ศูนย์กลางมวล, definition: "จุดที่เสมือนรวมมวลทั้งหมดของวัตถุ แรงที่ผ่านจุดนี้ทำให้วัตถุเลื่อนที่โดยไม่หมุน" }
  - { term: ศูนย์ถ่วง, definition: "จุดที่น้ำหนักทั้งหมดของวัตถุเสมือนกระทำ ใกล้ผิวโลกอยู่ที่เดียวกับศูนย์กลางมวล" }
  - { term: เสถียรภาพ, definition: "ความสามารถของวัตถุที่จะกลับสู่ตำแหน่งเดิมเมื่อถูกทำให้เอียงเล็กน้อย ยิ่งศูนย์ถ่วงต่ำและฐานกว้างยิ่งมีเสถียรภาพ" }
flashcards:
  - { front: "เงื่อนไขสมดุลกลสองข้อ", back: "$\\sum \\vec F = 0$ และ $\\sum M = 0$" }
  - { front: "ขนาดแรงลัพธ์ของแรงสองแรงที่ทำมุม θ", back: "$R^2 = F_1^2 + F_2^2 + 2F_1F_2\\cos\\theta$" }
  - { front: "แรงสามแรงสมดุล แนวแรงต้องเป็นอย่างไร", back: "พบกันที่จุดเดียว และต่อหางต่อหัวได้สามเหลี่ยมปิด" }
  - { front: "วัตถุจะล้มเมื่อใด", back: "เมื่อแนวดิ่งผ่านศูนย์ถ่วงตกนอกฐาน" }
  - { front: "ประสิทธิภาพของเครื่องกล", back: "งานที่ได้ ÷ งานที่ใส่ × 100% = MA จริง ÷ MA ในอุดมคติ × 100%" }
