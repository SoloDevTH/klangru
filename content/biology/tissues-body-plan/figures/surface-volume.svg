<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="sans-serif" font-size="14">
<title>ลูกบาศก์ด้าน 1, 2 และ 4 เซนติเมตร พร้อมพื้นที่ผิว ปริมาตร และอัตราส่วนพื้นที่ผิวต่อปริมาตร</title>
<rect x="0" y="0" width="780" height="400" fill="#ffffff"/>
<polygon points="70.0,194.0 108.0,194.0 127.0,178.8 89.0,178.8" fill="#e3f2fd" stroke="#37474f" stroke-width="1.6"/>
<polygon points="108.0,194.0 127.0,178.8 127.0,216.8 108.0,232.0" fill="#bbdefb" stroke="#37474f" stroke-width="1.6"/>
<polygon points="70.0,194.0 108.0,194.0 108.0,232.0 70.0,232.0" fill="#90caf9" stroke="#37474f" stroke-width="1.6"/>
<text x="89.0" y="218.0" text-anchor="middle" fill="#0d47a1" font-weight="bold">1 cm</text>
<text x="92.5" y="260.0" text-anchor="middle" fill="#263238" font-weight="bold">ด้าน 1 cm</text>
<text x="92.5" y="278.0" text-anchor="middle" fill="#263238">พื้นที่ผิว 6 cm²</text>
<text x="92.5" y="296.0" text-anchor="middle" fill="#263238">ปริมาตร 1 cm³</text>
<text x="92.5" y="314.0" text-anchor="middle" fill="#263238">อัตราส่วน 6 ต่อ cm</text>
<polygon points="300.0,156.0 376.0,156.0 414.0,125.6 338.0,125.6" fill="#e3f2fd" stroke="#37474f" stroke-width="1.6"/>
<polygon points="376.0,156.0 414.0,125.6 414.0,201.6 376.0,232.0" fill="#bbdefb" stroke="#37474f" stroke-width="1.6"/>
<polygon points="300.0,156.0 376.0,156.0 376.0,232.0 300.0,232.0" fill="#90caf9" stroke="#37474f" stroke-width="1.6"/>
<text x="338.0" y="199.0" text-anchor="middle" fill="#0d47a1" font-weight="bold">2 cm</text>
<text x="351.0" y="260.0" text-anchor="middle" fill="#263238" font-weight="bold">ด้าน 2 cm</text>
<text x="351.0" y="278.0" text-anchor="middle" fill="#263238">พื้นที่ผิว 24 cm²</text>
<text x="351.0" y="296.0" text-anchor="middle" fill="#263238">ปริมาตร 8 cm³</text>
<text x="351.0" y="314.0" text-anchor="middle" fill="#263238">อัตราส่วน 3 ต่อ cm</text>
<polygon points="520.0,80.0 672.0,80.0 748.0,19.2 596.0,19.2" fill="#e3f2fd" stroke="#37474f" stroke-width="1.6"/>
<polygon points="672.0,80.0 748.0,19.2 748.0,171.2 672.0,232.0" fill="#bbdefb" stroke="#37474f" stroke-width="1.6"/>
<polygon points="520.0,80.0 672.0,80.0 672.0,232.0 520.0,232.0" fill="#90caf9" stroke="#37474f" stroke-width="1.6"/>
<text x="596.0" y="161.0" text-anchor="middle" fill="#0d47a1" font-weight="bold">4 cm</text>
<text x="628.0" y="260.0" text-anchor="middle" fill="#263238" font-weight="bold">ด้าน 4 cm</text>
<text x="628.0" y="278.0" text-anchor="middle" fill="#263238">พื้นที่ผิว 96 cm²</text>
<text x="628.0" y="296.0" text-anchor="middle" fill="#263238">ปริมาตร 64 cm³</text>
<text x="628.0" y="314.0" text-anchor="middle" fill="#263238">อัตราส่วน 1.5 ต่อ cm</text>
<text x="20" y="390" fill="#555" font-size="12">พื้นที่ผิว = 6L² และปริมาตร = L³ จึงได้อัตราส่วนพื้นที่ผิวต่อปริมาตร = 6 ÷ L (ภาพไม่ได้วาดตามสัดส่วนของตัวเลข)</text>
</svg>