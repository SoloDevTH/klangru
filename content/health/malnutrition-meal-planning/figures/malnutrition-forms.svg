<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="sans-serif">
<title>รูปแบบของภาวะทุพโภชนาการ</title>
<rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="380.0" y="28.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">ภาวะทุพโภชนาการมีทั้ง "ขาด" และ "เกิน"</text>
<rect x="260.0" y="50.0" width="240.0" height="46.0" rx="10" fill="#f5cba7" stroke="#a04000" stroke-width="1.5"/>
<text x="380.0" y="79.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">ภาวะทุพโภชนาการ</text>
<rect x="40.0" y="140.0" width="320.0" height="46.0" rx="10" fill="#d6eaf8" stroke="#1f5d99" stroke-width="1.5"/>
<text x="200.0" y="169.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f5d99">โภชนาการขาด</text>
<rect x="400.0" y="140.0" width="320.0" height="46.0" rx="10" fill="#fadbd8" stroke="#922b21" stroke-width="1.5"/>
<text x="560.0" y="169.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#922b21">โภชนาการเกิน</text>
<line x1="380.0" y1="96.0" x2="200.0" y2="138.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="380.0" y1="96.0" x2="560.0" y2="138.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="40.0" y="215.0" width="320.0" height="36.0" rx="6" fill="#eef5fb" stroke="#9bbbd4" stroke-width="1.5"/>
<text x="52.0" y="231.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#111">ผอม (น้ำหนักน้อยเมื่อเทียบส่วนสูง)</text>
<text x="52.0" y="246.0" font-size="11" text-anchor="start" fill="#444">มักบอกว่าเพิ่งขาดอาหารหรือป่วย</text>
<rect x="40.0" y="257.0" width="320.0" height="36.0" rx="6" fill="#eef5fb" stroke="#9bbbd4" stroke-width="1.5"/>
<text x="52.0" y="273.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#111">เตี้ย (ส่วนสูงน้อยเมื่อเทียบอายุ)</text>
<text x="52.0" y="288.0" font-size="11" text-anchor="start" fill="#444">ขาดอาหารเรื้อรังเป็นเวลานาน</text>
<rect x="40.0" y="299.0" width="320.0" height="36.0" rx="6" fill="#eef5fb" stroke="#9bbbd4" stroke-width="1.5"/>
<text x="52.0" y="322.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#111">น้ำหนักน้อยเมื่อเทียบอายุ</text>
<text x="52.0" y="330.0" font-size="11" text-anchor="start" fill="#444"></text>
<rect x="40.0" y="341.0" width="320.0" height="36.0" rx="6" fill="#eef5fb" stroke="#9bbbd4" stroke-width="1.5"/>
<text x="52.0" y="357.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#111">ขาดวิตามินและแร่ธาตุ</text>
<text x="52.0" y="372.0" font-size="11" text-anchor="start" fill="#444">เช่น เหล็ก ไอโอดีน วิตามินเอ</text>
<rect x="400.0" y="215.0" width="320.0" height="36.0" rx="6" fill="#fdf0ef" stroke="#d9a7a2" stroke-width="1.5"/>
<text x="412.0" y="238.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#111">น้ำหนักเกินและโรคอ้วน</text>
<text x="412.0" y="246.0" font-size="11" text-anchor="start" fill="#444"></text>
<rect x="400.0" y="257.0" width="320.0" height="36.0" rx="6" fill="#fdf0ef" stroke="#d9a7a2" stroke-width="1.5"/>
<text x="412.0" y="273.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#111">โรคไม่ติดต่อที่เกี่ยวกับอาหาร</text>
<text x="412.0" y="288.0" font-size="11" text-anchor="start" fill="#444">เบาหวาน ความดันโลหิตสูง โรคหัวใจ</text>
<rect x="400.0" y="299.0" width="320.0" height="36.0" rx="6" fill="#fdf0ef" stroke="#d9a7a2" stroke-width="1.5"/>
<text x="412.0" y="315.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#111">ได้รับวิตามินหรือแร่ธาตุเกิน</text>
<text x="412.0" y="330.0" font-size="11" text-anchor="start" fill="#444">เช่น กินอาหารเสริมเกินขนาด</text>
<text x="380.0" y="392.0" font-size="11" text-anchor="middle" fill="#555">ที่มา: องค์การอนามัยโลก (WHO) คนคนเดียวหรือครอบครัวเดียวอาจมีทั้งสองแบบพร้อมกัน</text>
</svg>
