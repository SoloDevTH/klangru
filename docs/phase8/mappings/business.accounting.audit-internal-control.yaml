topic: business.accounting.audit-internal-control
rows:
  - { framework: th-tqf-accounting, indicators: ["8.1.5"], coverage: partial, note: "วัตถุประสงค์และขั้นตอนการสอบบัญชี มาตรฐานการสอบบัญชีไทยที่ยึด ISA ความมีสาระสำคัญ แบบจำลองความเสี่ยง หลักฐานและความน่าเชื่อถือ การสุ่มตัวอย่างแบบมีระบบ อัตราเบี่ยงเบน การขยายผลแบบอัตราส่วน และความเห็นสี่แบบในรายงานผู้สอบบัญชี ยังไม่ได้ลงรายละเอียดกฎหมายวิชาชีพบัญชี ข้อความในรายงานแต่ละส่วน (เช่น เรื่องสำคัญในการตรวจสอบ) และงานให้ความเชื่อมั่นอื่นนอกจากการตรวจสอบงบการเงิน" }
  - { framework: th-tqf-accounting, indicators: ["8.1.6"], coverage: full, note: "หลักการกำกับดูแลที่ดี สิทธิของผู้ถือหุ้น คณะกรรมการและคณะกรรมการตรวจสอบ บทบาทผู้มีส่วนได้ส่วนเสีย การเปิดเผยข้อมูล ความเสี่ยงและโอกาส วงจรบริหารความเสี่ยงองค์กรและตารางความเสี่ยง องค์ประกอบห้าประการของการควบคุมภายในตาม COSO (p001 p002 p009 p010 p015 p018)" }
