  - id: computer.programming.python-expressions.p017
    topics: [computer.programming.python-expressions]
    difficulty: 5
    type: code
    stem: |
      เขียนฟังก์ชัน `format_money(amount)` ที่รับจำนวนเงิน แล้วคืนข้อความในรูปแบบ `1,234.50 บาท` คือมีลูกน้ำคั่นทุกหลักพัน และมีทศนิยม 2 ตำแหน่ง
    starter: |
      def format_money(amount):
          return ""
    tests: |
      assert format_money(1234.5) == "1,234.50 บาท", f"format_money(1234.5) ควรได้ 1,234.50 บาท แต่ได้ {format_money(1234.5)!r}"
      assert format_money(0) == "0.00 บาท", f"format_money(0) ควรได้ 0.00 บาท แต่ได้ {format_money(0)!r}"
      assert format_money(1000000) == "1,000,000.00 บาท", "จำนวนล้านต้องมีลูกน้ำคั่นทุกหลักพัน"
    reference: |
      def format_money(amount):
          return f"{amount:,.2f} บาท"
    hints:
      - "ใช้การจัดรูปแบบตัวเลขในสตริง f-string ที่มี , คั่นหลักพัน"
      - "ทศนิยม 2 ตำแหน่งกำหนดด้วย .2f และต่อด้วยคำว่า บาท"
    solution: "return f\"{amount:,.2f} บาท\" เช่น 1234.5 ได้ 1,234.50 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

