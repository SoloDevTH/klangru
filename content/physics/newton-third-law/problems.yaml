      - "เท้าดันผนัง ผนังทำอะไรกลับมาตามกฎข้อที่ 3"
    solution: "เท้าดันผนัง (กระทำต่อผนัง) ผนังจึงดันเท้ากลับด้วยแรงขนาดเท่ากัน (กระทำต่อนักว่ายน้ำ) แรงจากผนังนี้ทำให้นักว่ายน้ำเร่งออกไป"
