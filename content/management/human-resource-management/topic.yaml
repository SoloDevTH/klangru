id: management.hr.human-resource-management
subject: management
title: { th: การจัดการทรัพยากรมนุษย์, en: Human resource management }
summary: วางแผนอัตรากำลังจากภาระงาน สรรหาและคัดเลือก วิเคราะห์ความต้องการและประเมินผลการฝึกอบรมสี่ระดับ ประเมินผลงาน ค่าตอบแทน อัตราการลาออก และกฎหมายแรงงานพื้นฐาน
difficulty: 5
minutes: 40
prerequisites: [management.principles.organizing, management.org.leadership-motivation]
encompasses:
  - { id: management.principles.organizing, weight: 0.2 }
  - { id: management.org.leadership-motivation, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: อัตรากำลังเภสัชกรห้องจ่ายยา
    problem: "โรงพยาบาลแห่งหนึ่ง (สมมติ) คาดว่าปีหน้าจะมีใบสั่งยาผู้ป่วยนอก 90,000 ใบ ตรวจสอบและจ่ายยาใบละ 4 นาที เภสัชกรหนึ่งคนมีเวลาทำงานจริงปีละ 1,600 ชั่วโมงหลังหักวันหยุด วันลา และการประชุม ต้องมีเภสัชกรประจำห้องจ่ายยาอย่างน้อยกี่คน"
    steps:
      - text: "ภาระงานรวม $90{,}000 \\times 4 = 360{,}000$ นาที"
      - text: "แปลงเป็นชั่วโมง $360{,}000 \\div 60 = 6{,}000$ ชั่วโมง"
        why: "หน่วยของภาระงานต้องตรงกับหน่วยของเวลาทำงานต่อคน"
      - text: "FTE $= 6{,}000 \\div 1{,}600 = 3.75$"
      - text: "ปัดขึ้นเป็น 4 คน"
        why: "ปัดลงเป็น 3 คนจะมีงาน 1,200 ชั่วโมงที่ไม่มีคนทำ ผู้ป่วยต้องรอนานขึ้น"
    answer: "ต้องมีเภสัชกรอย่างน้อย 4 คน (3.75 FTE) ถ้าช่วงเช้ามีใบสั่งยาหนาแน่น อาจต้องจัดเวรให้ช่วงนั้นมีคนมากกว่าช่วงบ่าย"
  - { type: check, problem: management.hr.human-resource-management.p005, prompt: "ระวังหน่วยนาทีกับชั่วโมง และอย่าลืมปัดขึ้น" }
  - type: figure
    src: kirkpatrick.svg
    alt: "ขั้นบันไดสี่ขั้นจากล่างขึ้นบน ระดับ 1 ปฏิกิริยา: ผู้เข้าอบรมพอใจไหม วัดด้วยแบบประเมินท้ายการอบรมในวันอบรม ระดับ 2 การเรียนรู้: ได้ความรู้และทักษะไหม วัดด้วยการทดสอบก่อนและหลังหรือการสาธิตในวันอบรม ระดับ 3 พฤติกรรม: นำไปใช้ในงานจริงไหม วัดด้วยการสังเกตหน้างานและหัวหน้าประเมินหลัง 1–3 เดือน ระดับ 4 ผลลัพธ์: องค์การได้ผลอะไร วัดจากของเสีย ข้อร้องเรียน หรือยอดขายหลัง 3–12 เดือน ลูกศรด้านขวาบอกว่าระดับสูงขึ้นวัดยากขึ้นแต่มีคุณค่าต่อองค์การมากขึ้น"
    caption: "การประเมินผลการฝึกอบรมสี่ระดับ"
  - type: worked-example
    title: ประเมินการอบรมพนักงานคัดแยกมะม่วงครบสี่ระดับ
    problem: "โรงงาน (สมมติ) จ่ายค่าอบรมการคัดเกรดมะม่วง 120,000 บาท ผลประเมิน: ผู้เข้าอบรมพอใจเฉลี่ย 4.5 จาก 5 คะแนนทดสอบเฉลี่ยเพิ่มจาก 55 เป็น 82 หัวหน้าสังเกตว่าหลังอบรม 2 เดือนพนักงานใช้แผ่นเทียบสีทุกกล่อง และมะม่วงที่ลูกค้าตีกลับลดลงคิดเป็นเงิน 30,000 บาทต่อเดือน จงจัดข้อมูลเข้าแต่ละระดับและคิด ROI ของ 6 เดือนแรก"
    steps:
      - text: "ระดับ 1 ปฏิกิริยา: ความพอใจ 4.5 จาก 5"
      - text: "ระดับ 2 การเรียนรู้: คะแนนทดสอบ 55 → 82"
      - text: "ระดับ 3 พฤติกรรม: ใช้แผ่นเทียบสีทุกกล่องหลังอบรม 2 เดือน"
        why: "ความรู้ที่ไม่ถูกนำไปใช้ในงานจะไม่ทำให้ผลลัพธ์เปลี่ยน"
      - text: "ระดับ 4 ผลลัพธ์: สินค้าตีกลับลดลง 6 เดือนคิดเป็น $30{,}000 \\times 6 = 180{,}000$ บาท"
      - text: "ROI $= \\dfrac{180{,}000 - 120{,}000}{120{,}000} \\times 100\\% = 50\\%$"
        why: "ต้องระวังว่าผลลัพธ์อาจมาจากปัจจัยอื่นด้วย เช่น ฤดูกาลหรือวัตถุดิบดีขึ้น ควรเทียบกับช่วงเวลาหรือกลุ่มที่ไม่ได้อบรม"
    answer: "ข้อมูลครบสี่ระดับ ROI ใน 6 เดือนแรกเท่ากับ 50%"
  - { type: check, problem: management.hr.human-resource-management.p008 }
glossary:
  - { term: คนเต็มเวลา (FTE), definition: "หน่วยวัดอัตรากำลังเท่ากับเวลาทำงานของพนักงานเต็มเวลาหนึ่งคน คิดจากภาระงานหารด้วยชั่วโมงทำงานจริงต่อคน" }
  - { term: อัตราผ่าน, definition: "สัดส่วนของผู้สมัครที่ผ่านจากขั้นหนึ่งไปขั้นถัดไปของการสรรหาและคัดเลือก" }
  - { term: ความตรงของเครื่องมือคัดเลือก, definition: "ระดับที่ผลการทดสอบหรือสัมภาษณ์ทำนายผลการทำงานจริงได้" }
  - { term: การวิเคราะห์ความต้องการการฝึกอบรม (TNA), definition: "การหาช่องว่างระหว่างความรู้และทักษะที่งานต้องการกับที่มีอยู่ ในระดับองค์การ งาน และบุคคล" }
  - { term: แนวโน้มเข้าหากลาง, definition: "ความคลาดเคลื่อนของผู้ประเมินที่ให้คะแนนระดับกลางกับเกือบทุกคน ทำให้แยกคนเก่งกับคนที่ต้องพัฒนาไม่ได้" }
  - { term: การประเมินค่างาน, definition: "การเปรียบเทียบคุณค่าของงานแต่ละตำแหน่งอย่างเป็นระบบ เพื่อกำหนดอัตราค่าตอบแทนที่เป็นธรรม" }
  - { term: อัตราการลาออก, definition: "จำนวนผู้ลาออกในช่วงเวลาหารด้วยจำนวนพนักงานเฉลี่ยในช่วงเวลานั้น คูณ 100" }
flashcards:
  - { front: "สูตร FTE", back: "ภาระงานรวม (ชั่วโมง) ÷ ชั่วโมงทำงานจริงต่อคน แล้วปัดขึ้น" }
  - { front: "ประเมินการอบรมสี่ระดับ", back: "ปฏิกิริยา → การเรียนรู้ → พฤติกรรม → ผลลัพธ์" }
  - { front: "TNA สามระดับ", back: "องค์การ (เป้าหมายต้องการทักษะอะไร) · งาน (งานต้องใช้อะไร) · บุคคล (ใครยังขาด)" }
  - { front: "อัตราการลาออก", back: "ผู้ลาออก ÷ จำนวนพนักงานเฉลี่ย × 100%" }
  - { front: "ROI ของการอบรม", back: "(ผลประโยชน์ − ต้นทุน) ÷ ต้นทุน × 100%" }
