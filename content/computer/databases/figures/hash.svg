  <line x1="232.0" y1="115.0" x2="318.0" y2="90.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="320.0" y="52.0" width="200.0" height="60.0" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="420.0" y="77.5" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">ฟังก์ชันแฮชที่ช้า</text>
  <text x="420.0" y="95.7" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">(เช่น bcrypt, Argon2)</text>
  <line x1="522.0" y1="82.0" x2="598.0" y2="82.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="600.0" y="52.0" width="270.0" height="60.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
