problems:
  - id: english.grammar.pronouns-possessives.p001
    topics: [english.grammar.pronouns-possessives]
    difficulty: 1
    type: mcq
    stem: "พิมเป็นเด็กผู้หญิง เลือกคำที่ถูก: *Pim is my friend. ___ is nine years old.*"
    choices:
      - { id: a, text: "She", correct: true, feedback: "ถูก พิมเป็นผู้หญิงและเป็นประธาน ใช้ She" }
      - { id: b, text: "He", feedback: "ภาษาไทยใช้ เขา ได้ทั้งชายและหญิง แต่ภาษาอังกฤษใช้ he กับผู้ชายเท่านั้น" }
      - { id: c, text: "Her", feedback: "her เป็นรูปกรรมหรือแปลว่า ของเธอ ประธานต้องใช้ she" }
      - { id: d, text: "It", feedback: "it ใช้กับสัตว์และสิ่งของ ไม่ใช้กับคน" }
    hints:
      - "พิมเป็นผู้ชายหรือผู้หญิง"
      - "ช่องว่างอยู่หน้ากริยา is จึงเป็นประธาน"
    solution: "พิมเป็นผู้หญิงและคำนี้เป็นประธาน: ***She** is nine years old.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.pronouns-possessives.p002
    topics: [english.grammar.pronouns-possessives]
    difficulty: 1
    type: match
    stem: "จับคู่สรรพนามประธานกับคำที่แปลว่า ของ... (ใช้หน้าคำนาม)"
    pairs:
      - { left: "I", right: "my" }
      - { left: "you", right: "your" }
      - { left: "he", right: "his" }
      - { left: "she", right: "her" }
      - { left: "we", right: "our" }
      - { left: "they", right: "their" }
    hints:
      - "นึกถึงวลี my bag, your bag, ..."
      - "she กับ her, we กับ our"
    solution: "I → my · you → your · he → his · she → her · we → our · they → their"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.pronouns-possessives.p003
    topics: [english.grammar.pronouns-possessives]
    difficulty: 1
    type: text
    stem: "เติมคำที่แปลว่า ของฉัน: *This is ___ book.*"
    accepted: ["my"]
    misconceptions:
      - { match: "mine", feedback: "mine ยืนเดี่ยว ไม่มีคำนามตาม หน้าคำนาม book ใช้ my" }
      - { match: "me", feedback: "me เป็นรูปกรรม แปลว่า ฉัน ไม่ได้แปลว่า ของฉัน" }
      - { match: "I", feedback: "I เป็นประธาน หน้าคำนามใช้ my" }
    hints:
      - "หลังช่องว่างมีคำนาม book"
      - "my หรือ mine ตัวไหนใช้หน้าคำนาม"
    solution: "*This is **my** book.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.pronouns-possessives.p004
    topics: [english.grammar.pronouns-possessives]
    difficulty: 2
    type: mcq
    stem: "มะม่วงหลายลูกอยู่บนต้นไกล ๆ เลือกคำที่ถูก: *___ are mangoes.*"
    choices:
      - { id: a, text: "Those", correct: true, feedback: "ถูก หลายชิ้นและอยู่ไกลใช้ those" }
      - { id: b, text: "These", feedback: "these ใช้กับของหลายชิ้นที่อยู่ใกล้ตัว" }
      - { id: c, text: "That", feedback: "that ใช้กับของชิ้นเดียว แต่ประโยคใช้ are และ mangoes เป็นพหูพจน์" }
      - { id: d, text: "This", feedback: "this ใช้กับของชิ้นเดียวที่อยู่ใกล้" }
    hints:
      - "มะม่วงมีหลายลูก และอยู่ไกล"
      - "ไกล + หลายชิ้น ใช้คำไหน"
    solution: "ไกลและหลายชิ้นใช้ ***Those** are mangoes.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.pronouns-possessives.p005
    topics: [english.grammar.pronouns-possessives]
    difficulty: 2
    type: text
    stem: "เติมสรรพนามแทน Ken: *I like Ken. I play football with ___.*"
    accepted: ["him"]
    misconceptions:
      - { match: "he", feedback: "he เป็นประธาน หลังบุพบท with ต้องใช้รูปกรรม him" }
      - { match: "his", feedback: "his แปลว่า ของเขา ที่นี่ต้องการรูปกรรม him" }
      - { match: "Ken's", feedback: "ไม่ได้บอกความเป็นเจ้าของ ใช้สรรพนามกรรม him" }
    hints:
      - "ช่องว่างอยู่หลังบุพบท with"
      - "รูปกรรมของ he คืออะไร"
    solution: "หลังบุพบทใช้รูปกรรม: *I play football with **him**.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.pronouns-possessives.p006
    topics: [english.grammar.pronouns-possessives]
    difficulty: 2
    type: text
    stem: "เติมคำที่แปลว่า ของฉัน: *This pen is ___.*"
    accepted: ["mine", "mine."]
    misconceptions:
      - { match: "my", feedback: "my ต้องมีคำนามตามหลัง ท้ายประโยคไม่มีคำนามจึงใช้ mine" }
      - { match: "me", feedback: "me เป็นรูปกรรม ไม่ได้แปลว่า ของฉัน" }
      - { match: "my pen", feedback: "ประโยคมี pen อยู่แล้ว ใช้ mine คำเดียว" }
    hints:
      - "หลังช่องว่างไม่มีคำนาม"
      - "คำที่ยืนเดี่ยวได้คือ mine, yours, his, hers, ours, theirs"
    solution: "*This pen is **mine**.* (เท่ากับ This is my pen.)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.pronouns-possessives.p007
    topics: [english.grammar.pronouns-possessives]
    difficulty: 2
    type: mcq
    stem: "เลือกคำที่ถูก: *Pim and I are cousins. ___ grandmother lives in Lampang.*"
    choices:
      - { id: a, text: "Our", correct: true, feedback: "ถูก Pim and I = we ของพวกเราคือ our" }
      - { id: b, text: "Their", feedback: "their ใช้แทน they ผู้พูดอยู่ในกลุ่มด้วย (I) จึงเป็น we → our" }
      - { id: c, text: "We", feedback: "we เป็นประธาน หน้าคำนาม grandmother ต้องใช้ our" }
      - { id: d, text: "Ours", feedback: "ours ยืนเดี่ยว หน้าคำนามใช้ our" }
    hints:
      - "Pim and I แทนด้วยสรรพนามอะไร"
      - "ของ + คำนาม ใช้รูป my, your, our ..."
    solution: "Pim and I = we → ***Our** grandmother lives in Lampang.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.pronouns-possessives.p008
    topics: [english.grammar.pronouns-possessives]
    difficulty: 3
    type: text
    stem: "ดูภาพ แล้วตอบหนึ่งคำ: *Whose bag is this?* — *It's ___.*"
    figure: { src: whose-quiz.svg, alt: "เด็กสามคน มะลิ (Mali) ผู้หญิงยืนข้างกระเป๋านักเรียนสีชมพู เคน (Ken) ผู้ชายยืนข้างลูกฟุตบอล และพลอย (Ploy) ผู้หญิงยืนข้างหมวกสีเหลือง ใต้ภาพเขียนว่า Whose bag is this? Whose ball is this? Whose hat is this?" }
    accepted: ["Mali's", "hers", "Mali's.", "hers."]
    misconceptions:
      - { match: "Mali", feedback: "ต้องเติม 's เพื่อบอกว่าเป็นของมะลิ: Mali's" }
      - { match: "her", feedback: "her ต้องมีคำนามตาม (her bag) ถ้ายืนเดี่ยวใช้ hers" }
      - { match: "her's", feedback: "hers ไม่มี ' เขียนว่า hers" }
      - { match: "Ken's", feedback: "เคนยืนข้างลูกฟุตบอล กระเป๋าอยู่ข้างมะลิ" }
    hints:
      - "กระเป๋าอยู่ข้างใคร"
      - "ตอบด้วยชื่อ + 's หรือสรรพนามยืนเดี่ยว"
    solution: "กระเป๋าเป็นของมะลิ: *It's **Mali's**.* หรือ *It's **hers**.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.pronouns-possessives.p009
    topics: [english.grammar.pronouns-possessives]
    difficulty: 3
    type: order
    stem: "เรียงคำเป็นคำถาม \"มอเตอร์ไซค์คันนั้นเป็นของใคร\""
    items: ["Whose", "motorbike", "is", "that?"]
    hints:
      - "ขึ้นต้นด้วย Whose แล้วตามด้วยคำนาม"
      - "Whose + คำนาม + is + that?"
    solution: "*Whose motorbike is that?* whose ต้องตามด้วยคำนามทันที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.pronouns-possessives.p010
    topics: [english.grammar.pronouns-possessives]
    difficulty: 3
    type: mcq
    stem: "เลือกคำที่ถูก: *The cat is hungry. ___ bowl is empty.*"
    choices:
      - { id: a, text: "Its", correct: true, feedback: "ถูก its = ของมัน" }
      - { id: b, text: "It's", feedback: "it's ย่อมาจาก it is ประโยคนี้ต้องการ ของมัน (its)" }
      - { id: c, text: "It", feedback: "it เป็นประธานหรือกรรม หน้าคำนามใช้ its" }
      - { id: d, text: "Their", feedback: "their ใช้กับหลายตัว แมวมีตัวเดียว (the cat = it)" }
    hints:
      - "ชามเป็นของแมว แมว = it"
      - "ลองแทน It's ด้วย It is แล้วอ่านดูว่าถูกไหม"
    solution: "*The cat is hungry. **Its** bowl is empty.* (It is bowl ไม่มีความหมาย จึงใช้ it's ไม่ได้)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.pronouns-possessives.p011
    topics: [english.grammar.pronouns-possessives]
    difficulty: 3
    type: text
    stem: "ใช้สรรพนามคำเดียวแทนคำที่เป็นตัวเอียง: ***Nida and Ploy** are at the market.* → *___ are at the market.*"
    accepted: ["They"]
    misconceptions:
      - { match: "Them", feedback: "them เป็นรูปกรรม หน้ากริยา are ต้องใช้ประธาน they" }
      - { match: "Their", feedback: "their แปลว่า ของพวกเขา ประธานใช้ they" }
      - { match: "She", feedback: "สองคนเป็นพหูพจน์ ใช้ they" }
      - { match: "We", feedback: "we รวมผู้พูดด้วย นิดากับพลอยเป็นคนอื่น ใช้ they" }
    hints:
      - "นิดาและพลอยเป็นกี่คน"
      - "สองคนขึ้นไปที่ไม่รวมผู้พูดและเป็นประธาน ใช้คำไหน"
    solution: "***They** are at the market.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.pronouns-possessives.p012
    topics: [english.grammar.pronouns-possessives]
    difficulty: 3
    type: match
    stem: "จับคู่สรรพนามประธานกับรูปกรรม"
    pairs:
      - { left: "I", right: "me" }
      - { left: "he", right: "him" }
      - { left: "she", right: "her" }
      - { left: "we", right: "us" }
      - { left: "they", right: "them" }
    hints:
      - "รูปกรรมใช้หลังกริยาหรือบุพบท เช่น with me"
      - "she กับ her, we กับ us"
    solution: "I → me · he → him · she → her · we → us · they → them"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.pronouns-possessives.p013
    topics: [english.grammar.pronouns-possessives]
    difficulty: 4
    type: text
    stem: "ประโยค *These book is mine.* ผิด แก้ให้ถูกโดยให้หมายถึงหนังสือ **เล่มเดียว** (เขียนเต็มประโยค)"
    accepted: ["This book is mine.", "This book is mine", "This is my book.", "This is my book"]
    misconceptions:
      - { match: "These books are mine.", feedback: "ประโยคนี้ถูกไวยากรณ์ แต่หมายถึงหลายเล่ม โจทย์ให้หมายถึงเล่มเดียว" }
      - { match: "These books are mine", feedback: "ประโยคนี้ถูกไวยากรณ์ แต่หมายถึงหลายเล่ม โจทย์ให้หมายถึงเล่มเดียว" }
      - { match: "These books is mine.", feedback: "หลายเล่มต้องใช้ are และโจทย์ให้หมายถึงเล่มเดียว" }
      - { match: "This book is my.", feedback: "ท้ายประโยคไม่มีคำนามตาม ใช้ mine" }
    hints:
      - "เล่มเดียวที่อยู่ใกล้ใช้ this หรือ these"
      - "this + คำนามเอกพจน์ + is"
    solution: "***This book is mine.*** (หรือ *This is my book.*) ถ้าหมายถึงหลายเล่มคือ *These books are mine.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.pronouns-possessives.p014
    topics: [english.grammar.pronouns-possessives]
    difficulty: 4
    type: mcq
    stem: "สมชายให้ปากกาฉันทุกวัน ข้อใดเขียนถูก"
    choices:
      - { id: a, text: "He gives me a pen every day.", correct: true, feedback: "ถูก He เป็นประธาน me เป็นกรรม" }
      - { id: b, text: "Him gives I a pen every day.", feedback: "สลับรูปกัน ประธานใช้ he กรรมใช้ me" }
      - { id: c, text: "He gives my a pen every day.", feedback: "my ต้องตามด้วยคำนามที่เป็นของฉัน ผู้รับปากกาใช้รูปกรรม me" }
      - { id: d, text: "His gives me a pen every day.", feedback: "his แปลว่า ของเขา ประธานใช้ he" }
    hints:
      - "ใครเป็นผู้ให้ (ประธาน) ใครเป็นผู้รับ (กรรม)"
      - "ประธาน he กรรม me"
    solution: "**He gives me a pen every day.**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.pronouns-possessives.p015
    topics: [english.grammar.pronouns-possessives]
    difficulty: 4
    type: text
    stem: "ตอบหนึ่งคำ แปลว่า ของเธอ: *Is this Nida's phone?* — *Yes, it's ___.*"
    accepted: ["hers", "hers."]
    misconceptions:
      - { match: "her", feedback: "her ต้องมีคำนามตาม (her phone) ถ้ายืนเดี่ยวใช้ hers" }
      - { match: "her's", feedback: "hers ไม่มี '" }
      - { match: "she's", feedback: "she's ย่อมาจาก she is ไม่ได้แปลว่า ของเธอ" }
      - { match: "his", feedback: "นิดาเป็นผู้หญิง ใช้ hers" }
    hints:
      - "นิดาเป็นผู้หญิง และหลังช่องว่างไม่มีคำนาม"
      - "รูปยืนเดี่ยวของ her คืออะไร"
    solution: "*Yes, it's **hers**.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.pronouns-possessives.p016
    topics: [english.grammar.pronouns-possessives]
    difficulty: 4
    type: text
    stem: "เติมคำที่แปลว่า ของพวกเขา: *The students put ___ bags on the desks.*"
    accepted: ["their"]
    misconceptions:
      - { match: "there", feedback: "there แปลว่า ที่นั่น ของพวกเขาสะกดว่า their" }
      - { match: "they're", feedback: "they're ย่อมาจาก they are ของพวกเขาคือ their" }
      - { match: "them", feedback: "them เป็นรูปกรรม หน้าคำนามใช้ their" }
      - { match: "theirs", feedback: "theirs ยืนเดี่ยว หน้าคำนาม bags ใช้ their" }
    hints:
      - "the students = they"
      - "ของ + คำนาม ใช้รูปไหน และระวังคำที่ออกเสียงเหมือนกัน"
    solution: "*The students put **their** bags on the desks.* (their, there, they're ออกเสียงเหมือนกันแต่ความหมายต่างกัน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.pronouns-possessives.p017
    topics: [english.grammar.pronouns-possessives]
    difficulty: 5
    type: text
    stem: "เขียนประโยคใหม่ ใช้สรรพนามแทนทุกคำนาม: *Ken gives the book to Mali.*"
    accepted: ["He gives it to her.", "He gives it to her", "He gives her it.", "He gives her it"]
    misconceptions:
      - { match: "He gives it to she.", feedback: "หลังบุพบท to ใช้รูปกรรม her" }
      - { match: "Him gives it to her.", feedback: "ประธานใช้ he ไม่ใช่ him" }
      - { match: "He gives it to hers.", feedback: "hers แปลว่า ของเธอ ผู้รับใช้รูปกรรม her" }
      - { match: "He gives them to her.", feedback: "the book มีเล่มเดียว ใช้ it" }
      - { match: "She gives it to him.", feedback: "Ken เป็นผู้ชาย (he) และ Mali เป็นผู้หญิง (her)" }
    hints:
      - "Ken = ประธาน ผู้ชาย, the book = สิ่งของ, Mali = ผู้หญิง อยู่หลัง to"
      - "ประธาน he · สิ่งของ it · หลังบุพบทใช้รูปกรรม"
    solution: "Ken → **He**, the book → **it**, Mali (หลัง to) → **her**: *He gives it to her.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.pronouns-possessives.p018
    topics: [english.grammar.pronouns-possessives]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "เลือกประโยคที่ **ถูกต้อง** ทั้งหมด"
