problems:
  - id: biology.cells.cell-division.p001
    topics: [biology.cells.cell-division]
    difficulty: 1
    type: order
    stem: "เรียงระยะของการแบ่งนิวเคลียสแบบไมโทซิสให้ถูกต้อง"
    items:
      - "โพรเฟส"
      - "เมทาเฟส"
      - "แอนาเฟส"
      - "เทโลเฟส"
    hints:
      - "ระยะที่โครโมโซมเรียงกลางเซลล์อยู่ก่อนระยะที่โครมาทิดแยกไปขั้วเซลล์"
      - "ระยะสุดท้ายเกิดนิวเคลียสใหม่สองนิวเคลียส"
    solution: "โพรเฟส → เมทาเฟส → แอนาเฟส → เทโลเฟส แล้วตามด้วยไซโทไคนีซิส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-division.p002
    topics: [biology.cells.cell-division]
    difficulty: 1
    type: mcq
    stem: "เซลล์ผิวหนังของคนมีโครโมโซม 46 แท่ง เมื่อแบ่งเซลล์แบบไมโทซิส เซลล์ใหม่แต่ละเซลล์มีโครโมโซมกี่แท่ง"
    choices:
      - { id: a, text: "46 แท่ง", correct: true }
      - { id: b, text: "23 แท่ง", feedback: "จำนวนลดลงครึ่งหนึ่งเกิดในไมโอซิส ไม่ใช่ไมโทซิส" }
      - { id: c, text: "92 แท่ง", feedback: "DNA จำลองตัวเป็นสองเท่าก่อนแบ่ง แต่แบ่งให้สองเซลล์ แต่ละเซลล์จึงกลับมา 46 แท่ง" }
      - { id: d, text: "12 แท่ง", feedback: "ไมโทซิสไม่ได้ลดจำนวนโครโมโซม เซลล์ใหม่ต้องเหมือนเซลล์เดิม" }
    hints:
      - "ไมโทซิสใช้ในการเจริญเติบโตและซ่อมแซม เซลล์ใหม่ต้องเหมือนเซลล์เดิม"
      - "จำนวนโครโมโซมของเซลล์ลูกเท่ากับของเซลล์แม่หรือไม่"
    solution: "ไมโทซิสให้เซลล์ใหม่ที่มีจำนวนโครโมโซมเท่าเซลล์เดิม คือ 46 แท่ง ($2n \\to 2n$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-division.p003
    topics: [biology.cells.cell-division]
    difficulty: 2
    type: text
    stem: "ในอินเตอร์เฟส ระยะใดที่มีการจำลอง DNA ทำให้ปริมาณ DNA ในเซลล์เพิ่มเป็นสองเท่า (ตอบชื่อระยะ)"
    accepted: ["S", "ระยะ S", "ระยะเอส", "เอส", "S phase", "ระยะ s", "s"]
    hints:
      - "อินเตอร์เฟสมีสามระยะย่อย คือ G1 S และ G2"
      - "ชื่อระยะมาจากคำว่า synthesis (การสังเคราะห์)"
    misconceptions:
      - { match: "G1", feedback: "ใน G1 เซลล์เติบโตและสร้างโปรตีน ยังไม่จำลอง DNA" }
      - { match: "G2", feedback: "ใน G2 DNA จำลองเสร็จแล้ว เซลล์เตรียมพร้อมแบ่ง" }
      - { match: "โพรเฟส", feedback: "โพรเฟสเป็นระยะของไมโทซิส DNA จำลองไปแล้วตั้งแต่อินเตอร์เฟส" }
    solution: "ระยะ S (synthesis) เป็นช่วงที่จำลอง DNA โครโมโซมแต่ละแท่งจึงมีสองซิสเตอร์โครมาทิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-division.p004
    topics: [biology.cells.cell-division]
    difficulty: 2
    type: match
    stem: "จับคู่ระยะของไมโทซิสกับเหตุการณ์"
    pairs:
      - { left: "โพรเฟส", right: "โครโมโซมหดตัวเห็นชัด เยื่อหุ้มนิวเคลียสสลาย" }
      - { left: "เมทาเฟส", right: "โครโมโซมเรียงอยู่กลางเซลล์" }
      - { left: "แอนาเฟส", right: "ซิสเตอร์โครมาทิดแยกไปคนละขั้วเซลล์" }
      - { left: "เทโลเฟส", right: "เกิดเยื่อหุ้มนิวเคลียสใหม่สองนิวเคลียส" }
    hints:
      - "เมทา (meta) แปลว่ากลาง แอนา (ana) แปลว่าแยกขึ้น"
      - "เทโล (telo) แปลว่าปลายหรือท้ายสุด"
    solution: "โพรเฟส → โครโมโซมหดตัว, เมทาเฟส → เรียงกลางเซลล์, แอนาเฟส → โครมาทิดแยก, เทโลเฟส → นิวเคลียสใหม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-division.p005
    topics: [biology.cells.cell-division]
    difficulty: 2
    type: numeric
    stem: "เซลล์ร่างกายของคนมีโครโมโซม $2n = 46$ อสุจิที่ได้จากไมโอซิสมีโครโมโซมกี่แท่ง"
    answer: { value: 23, unit: แท่ง }
    hints:
      - "ไมโอซิสลดจำนวนโครโมโซมลงเท่าไร"
      - "เซลล์สืบพันธุ์เป็นแฮพลอยด์ (n)"
    misconceptions:
      - { match: 46, feedback: "ถ้าอสุจิมี 46 แท่ง ลูกที่เกิดจากปฏิสนธิจะมี 92 แท่ง ไมโอซิสจึงต้องลดลงครึ่งหนึ่ง" }
      - { match: 11.5, feedback: "แบ่งครึ่งสองครั้ง แต่จำนวนโครโมโซมลดลงครึ่งหนึ่งเพียงครั้งเดียวในไมโอซิส I ไมโอซิส II แยกโครมาทิดโดยจำนวนโครโมโซมเท่าเดิม" }
    solution: "ไมโอซิสลดจำนวนโครโมโซมจาก $2n = 46$ เป็น $n = 23$ แท่ง เมื่ออสุจิปฏิสนธิกับเซลล์ไข่ ($n = 23$) ไซโกตจึงกลับมามี 46 แท่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-division.p006
    topics: [biology.cells.cell-division]
    difficulty: 2
    type: mcq
    stem: "ไซโทไคนีซิสของเซลล์พืชต่างจากเซลล์สัตว์อย่างไร"
    choices:
      - { id: a, text: "เซลล์พืชสร้างเซลล์เพลตกลางเซลล์แล้วเจริญเป็นผนังกั้น ส่วนเซลล์สัตว์คอดเข้าจากขอบ", correct: true }
      - { id: b, text: "เซลล์พืชคอดเข้าจากขอบ ส่วนเซลล์สัตว์สร้างเซลล์เพลต", feedback: "สลับกัน เซลล์พืชคอดเข้าไม่ได้เพราะมีผนังเซลล์แข็ง" }
      - { id: c, text: "เซลล์พืชไม่มีไซโทไคนีซิส จึงได้เซลล์ที่มีสองนิวเคลียส", feedback: "เซลล์พืชมีไซโทไคนีซิส โดยสร้างเซลล์เพลตแบ่งไซโทพลาซึม" }
      - { id: d, text: "ไม่ต่างกัน ทั้งสองคอดเข้าจากขอบเซลล์", feedback: "ผนังเซลล์ของพืชทำให้คอดเข้าไม่ได้ จึงต้องสร้างผนังกั้นจากกลางเซลล์" }
    hints:
      - "เซลล์พืชมีโครงสร้างใดที่เซลล์สัตว์ไม่มี"
      - "ผนังเซลล์แข็งคอดเข้าได้หรือไม่"
    solution: "เซลล์สัตว์คอดเข้าจากขอบจนขาด เซลล์พืชมีผนังเซลล์แข็ง จึงให้เวสิเคิลจากกอลจิบอดีมารวมกันกลางเซลล์เป็นเซลล์เพลต แล้วเจริญเป็นผนังเซลล์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-division.p007
    topics: [biology.cells.cell-division]
    difficulty: 3
    type: numeric
    stem: "ภาพแสดงเซลล์ปลายรากหอมที่ย้อมสี นับเซลล์ที่อยู่ในระยะไมโทซิส (เห็นโครโมโซมหรือกำลังแยกเป็นสองนิวเคลียส) แล้วคำนวณดัชนีไมโทซิสเป็นร้อยละ"
    figure: { src: root-tip.svg, alt: "ตารางเซลล์ปลายรากรูปสี่เหลี่ยม 5 แถว 10 คอลัมน์ รวม 50 เซลล์ เซลล์ส่วนใหญ่มีนิวเคลียสกลมพร้อมนิวคลีโอลัส มีเพียงบางเซลล์ที่ต่างออกไป: 2 เซลล์มีโครโมโซมเป็นแท่งสั้นกระจุกอยู่ในวงประ (โพรเฟส) 1 เซลล์มีโครโมโซมเรียงเป็นแถวกลางเซลล์ (เมทาเฟส) 1 เซลล์มีโครโมโซมสองกลุ่มแยกไปซ้ายและขวา (แอนาเฟส) และ 1 เซลล์มีนิวเคลียสเล็กสองนิวเคลียสและเส้นประแบ่งกลาง (เทโลเฟส)" }
    answer: { value: 10, unit: "%" }
    hints:
      - "นับเซลล์ทั้งหมดในภาพ และนับเฉพาะเซลล์ที่ไม่ได้มีนิวเคลียสกลมปกติ"
      - "ดัชนีไมโทซิส = จำนวนเซลล์ในไมโทซิส ÷ จำนวนเซลล์ทั้งหมด × 100"
    misconceptions:
      - { match: 90, feedback: "นี่คือร้อยละของเซลล์ในอินเตอร์เฟส ดัชนีไมโทซิสนับเฉพาะเซลล์ที่กำลังแบ่ง" }
      - { match: 11.1, feedback: "หารด้วยจำนวนเซลล์ในอินเตอร์เฟส (45) ต้องหารด้วยจำนวนเซลล์ทั้งหมด (50)" }
    solution: "มีเซลล์ทั้งหมด $5 \\times 10 = 50$ เซลล์ อยู่ในไมโทซิส 5 เซลล์ (โพรเฟส 2 เมทาเฟส 1 แอนาเฟส 1 เทโลเฟส 1) ดัชนีไมโทซิส $= \\frac{5}{50} \\times 100 = 10\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-division.p008
    topics: [biology.cells.cell-division]
    difficulty: 3
    type: numeric
    stem: "เซลล์หนึ่งแบ่งแบบไมโทซิสต่อเนื่อง 5 รอบ โดยทุกเซลล์ที่ได้แบ่งต่อทุกรอบ จะได้เซลล์ทั้งหมดกี่เซลล์"
    answer: { value: 32, unit: เซลล์ }
    hints:
      - "แบ่งหนึ่งรอบ จำนวนเซลล์เพิ่มเป็นกี่เท่า"
      - "เริ่มจาก 1 แล้วคูณ 2 ไปทั้งหมด 5 ครั้ง"
    misconceptions:
      - { match: 10, feedback: "นำ 2 คูณ 5 แต่จำนวนเซลล์เพิ่มเป็นสองเท่าทุกรอบ จึงเป็น $2^5$" }
      - { match: 25, feedback: "คำนวณ $5^2$ ต้องเป็น $2^5$ คือคูณ 2 ห้าครั้ง" }
    solution: "1 → 2 → 4 → 8 → 16 → 32 เซลล์ หรือ $2^5 = 32$ เซลล์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-division.p009
    topics: [biology.cells.cell-division]
    difficulty: 3
    type: mcq
    stem: "ถ้าต้องการนับจำนวนโครโมโซมของหอมหัวใหญ่จากปลายราก ควรเลือกเซลล์ในระยะใด"
    choices:
      - { id: a, text: "เมทาเฟส เพราะโครโมโซมหดสั้นที่สุดและเรียงกลางเซลล์ แยกนับได้ง่าย", correct: true }
      - { id: b, text: "อินเตอร์เฟส เพราะพบเซลล์มากที่สุด", feedback: "พบมากจริง แต่โครโมโซมยังเป็นเส้นใยยาวพันกัน มองไม่เห็นเป็นแท่ง จึงนับไม่ได้" }
      - { id: c, text: "แอนาเฟส เพราะโครโมโซมแยกเป็นสองกลุ่ม", feedback: "ในแอนาเฟสโครมาทิดแยกกันแล้ว นับได้เป็นสองเท่าของจำนวนโครโมโซมและซ้อนกันมาก" }
      - { id: d, text: "เทโลเฟส เพราะเห็นนิวเคลียสใหม่ชัด", feedback: "ในเทโลเฟสโครโมโซมเริ่มคลายตัวกลับเป็นเส้นใย มองเป็นแท่งไม่ชัด" }
    hints:
      - "ระยะใดที่โครโมโซมหดตัวมากที่สุด"
      - "ระยะใดที่โครโมโซมยังไม่แยกโครมาทิดและอยู่แถวเดียวกัน"
    solution: "ในเมทาเฟสโครโมโซมหดตัวมากที่สุดและเรียงอยู่กลางเซลล์ แต่ละแท่งยังมีสองโครมาทิดติดกัน จึงนับจำนวนโครโมโซมได้ชัดเจน (หอมหัวใหญ่ $2n = 16$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-division.p010
    topics: [biology.cells.cell-division]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดเกิดในไมโอซิส แต่ไม่เกิดในไมโทซิส (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ฮอมอโลกัสโครโมโซมเข้าคู่กัน (ไซแนปซิส)", correct: true }
      - { id: b, text: "ครอสซิงโอเวอร์", correct: true }
      - { id: c, text: "ฮอมอโลกัสโครโมโซมแยกจากกันไปคนละเซลล์", correct: true }
      - { id: d, text: "ซิสเตอร์โครมาทิดแยกจากกัน", feedback: "เกิดทั้งในไมโทซิส (แอนาเฟส) และไมโอซิส (แอนาเฟส II)" }
      - { id: e, text: "เยื่อหุ้มนิวเคลียสสลาย", feedback: "เกิดในโพรเฟสของทั้งสองแบบ" }
    hints:
      - "เหตุการณ์ใดเกี่ยวกับคู่เหมือนโดยเฉพาะ"
      - "ไมโอซิส II คล้ายไมโทซิส จึงมีเหตุการณ์ที่เหมือนกัน"
    solution: "ไซแนปซิส ครอสซิงโอเวอร์ และการแยกคู่เหมือนเกิดในไมโอซิส I เท่านั้น ส่วนการแยกซิสเตอร์โครมาทิดและการสลายของเยื่อหุ้มนิวเคลียสเกิดทั้งสองแบบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-division.p011
    topics: [biology.cells.cell-division]
    difficulty: 3
    type: numeric
    stem: "ข้าวมีโครโมโซม $2n = 24$ เซลล์ปลายรากข้าวที่อยู่ในระยะเมทาเฟสของไมโทซิสมีโครมาทิดทั้งหมดกี่โครมาทิด"
    answer: { value: 48, unit: โครมาทิด }
    hints:
      - "ในเมทาเฟส DNA จำลองแล้ว โครโมโซมหนึ่งแท่งมีกี่โครมาทิด"
      - "นำจำนวนโครโมโซมคูณจำนวนโครมาทิดต่อโครโมโซม"
    misconceptions:
      - { match: 24, feedback: "นี่คือจำนวนโครโมโซม (นับจากเซนโทรเมียร์) แต่ละแท่งมี 2 โครมาทิด" }
      - { match: 12, feedback: "12 คือจำนวนโครโมโซมของเซลล์แฮพลอยด์ ไม่ใช่จำนวนโครมาทิดในเซลล์ปลายราก" }
    solution: "เซลล์ปลายรากเป็นดิพลอยด์ มี 24 โครโมโซม ในเมทาเฟสแต่ละแท่งมี 2 ซิสเตอร์โครมาทิด รวม $24 \\times 2 = 48$ โครมาทิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-division.p012
    topics: [biology.cells.cell-division]
    difficulty: 4
    type: numeric
    stem: "จากภาพเซลล์ปลายรากหอม ถ้าวัฏจักรเซลล์ของเซลล์ปลายรากยาว 22 ชั่วโมง ระยะไมโทซิสใช้เวลาประมาณกี่ชั่วโมง"
