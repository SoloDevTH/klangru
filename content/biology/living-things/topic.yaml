id: biology.life.living-things
subject: biology
title: { th: สิ่งมีชีวิตและสิ่งไม่มีชีวิต, en: Living and non-living things }
summary: ลักษณะ 6 อย่างที่บอกว่าเป็นสิ่งมีชีวิต การเปรียบเทียบกับสิ่งไม่มีชีวิตรอบตัว และการแยกสิ่งที่ยังมีชีวิต ตายแล้ว หรือไม่เคยมีชีวิต
difficulty: 1
minutes: 20
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: เปรียบเทียบลักษณะของสิ่งมีชีวิต
    src: compare-living.svg
    alt: "ตารางเปรียบเทียบ 4 สิ่ง คือ แมว ต้นมะม่วง หุ่นยนต์ของเล่น และก้อนหิน กับลักษณะ 6 ข้อ ได้แก่ ต้องการอาหารและน้ำ หายใจ เจริญเติบโต สืบพันธุ์มีลูกได้ เคลื่อนไหวตอบสนองต่อสิ่งเร้า และขับถ่ายของเสีย แมวและต้นมะม่วงได้เครื่องหมายถูกครบทั้ง 6 ข้อ สรุปว่าเป็นสิ่งมีชีวิต หุ่นยนต์ของเล่นได้เครื่องหมายถูกเฉพาะข้อเคลื่อนไหว ข้ออื่นเป็นกากบาท ก้อนหินเป็นกากบาททุกข้อ ทั้งสองจึงเป็นสิ่งไม่มีชีวิต"
    caption: "หุ่นยนต์ขยับได้เพราะใช้ถ่านไฟฉาย มีลักษณะคล้ายสิ่งมีชีวิตเพียงข้อเดียว สิ่งมีชีวิตต้องมีครบทุกข้อ (วาดโดยทีมคลังรู้)"
  - { type: check, problem: biology.life.living-things.p001, prompt: "ลองใช้ลักษณะ 6 ข้อตอบดู" }
  - type: worked-example
    title: เห็ดเป็นสิ่งมีชีวิตหรือไม่
    problem: "หลังฝนตก น้องนิดเห็นเห็ดฟางขึ้นที่กองฟางข้างบ้าน วันต่อมาเห็ดดอกโตขึ้นและมีดอกเล็ก ๆ ขึ้นเพิ่มอีกหลายดอก เห็ดเป็นสิ่งมีชีวิตหรือไม่"
    steps:
      - text: "ถามข้อแรก: เห็ดต้องการอาหารและน้ำไหม ใช่ เห็ดดูดอาหารจากฟางที่เน่า และขึ้นเมื่อได้น้ำฝน"
      - text: "ถามว่าเห็ดโตขึ้นเองไหม ใช่ ดอกเห็ดใหญ่ขึ้นทุกวันโดยไม่มีใครมาเติม"
        why: "การโตของสิ่งมีชีวิตเกิดจากภายในโดยใช้อาหาร ต่างจากลูกโป่งที่ใหญ่ขึ้นเพราะลมจากข้างนอก"
      - text: "ถามว่าเห็ดมีลูกได้ไหม ใช่ มีดอกเห็ดเล็ก ๆ เกิดใหม่เพิ่มขึ้น"
      - text: "เห็ดยังหายใจ และตอบสนองต่อความชื้นด้วย เมื่ออากาศแห้งเห็ดจะเหี่ยว"
      - text: "เห็ดมีลักษณะครบ จึงเป็นสิ่งมีชีวิต แม้จะไม่ใช่สัตว์และไม่ได้มีใบสีเขียวแบบพืช"
    answer: "เห็ดเป็นสิ่งมีชีวิต"
  - { type: check, problem: biology.life.living-things.p009, prompt: "คิดก่อนว่าใบไม้แห้งเคยเป็นส่วนของอะไร" }
glossary:
  - { term: สิ่งมีชีวิต, definition: "สิ่งที่ต้องการอาหาร หายใจ เจริญเติบโต สืบพันธุ์ ตอบสนองต่อสิ่งเร้า และขับถ่ายของเสีย เช่น คน สัตว์ พืช เห็ด" }
  - { term: สิ่งไม่มีชีวิต, definition: "สิ่งที่ไม่มีลักษณะของสิ่งมีชีวิต เช่น ก้อนหิน น้ำ อากาศ ของเล่น" }
  - { term: สิ่งเร้า, definition: "สิ่งที่มากระตุ้นสิ่งมีชีวิต เช่น แสง เสียง ความร้อน การสัมผัส" }
  - { term: สืบพันธุ์, definition: "การมีลูกหรือสร้างต้นใหม่ เพื่อให้สิ่งมีชีวิตชนิดนั้นมีต่อไป" }
  - { term: วัฏจักรชีวิต, definition: "ช่วงชีวิตที่วนซ้ำ ตั้งแต่เกิด โตขึ้น จนมีลูกที่เริ่มต้นใหม่อีกครั้ง" }
flashcards:
  - { front: "ลักษณะของสิ่งมีชีวิตมีอะไรบ้าง", back: "ต้องการอาหารและน้ำ หายใจ เจริญเติบโต สืบพันธุ์ เคลื่อนไหวตอบสนองต่อสิ่งเร้า และขับถ่ายของเสีย" }
  - { front: "หุ่นยนต์เดินได้ ทำไมไม่มีชีวิต", back: "เดินได้เพราะใช้ถ่าน ไม่กินอาหาร ไม่โตขึ้นเอง และมีลูกไม่ได้" }
  - { front: "พืชไม่เดิน ทำไมมีชีวิต", back: "พืชสร้างอาหาร หายใจ โตขึ้น มีเมล็ดเป็นต้นใหม่ และตอบสนองต่อแสงหรือการสัมผัส" }
  - { front: "ใบไม้แห้งกับก้อนหินต่างกันอย่างไร", back: "ใบไม้แห้งเคยมีชีวิตแต่ตายแล้ว ก้อนหินไม่เคยมีชีวิตเลย" }
