      - { id: b, text: "เด็กได้รับแอลลีลจากพ่อแม่แบบแอลลีลด้อยที่ซ่อนอยู่", feedback: "ถ้าพ่อแม่เป็นพาหะ การตรวจเลือดต้องพบแอลลีลนี้ในเซลล์ของพ่อแม่ แต่ไม่พบเลย" }
      - { id: c, text: "เด็กได้รับรังสีอัลตราไวโอเลตจากแสงแดดหลังเกิด จนทุกเซลล์เปลี่ยน", feedback: "มิวเทชันจากแสงแดดหลังเกิดเกิดในเซลล์ผิวหนังบางเซลล์ ไม่ได้เกิดในทุกเซลล์ของร่างกาย" }
    hints:
      - "แอลลีลที่อยู่ในทุกเซลล์ต้องมีตั้งแต่ไซโกตหรือก่อนหน้านั้น"
      - "ถ้าพ่อแม่ไม่มีแอลลีลนี้ แอลลีลต้องเกิดขึ้นใหม่ที่ใด"
    solution: "แอลลีลที่อยู่ในทุกเซลล์ต้องมีตั้งแต่ไซโกต และเพราะพ่อแม่ไม่มี จึงต้องเกิดใหม่จากมิวเทชันในเซลล์ที่สร้างเซลล์สืบพันธุ์ เช่น ความผิดพลาดขณะจำลอง DNA หรือในไซโกตระยะแรก แอลลีลนี้ถ่ายทอดต่อให้ลูกของเด็กได้ ส่วนมิวเทชันในเซลล์ร่างกายหลังเกิดไม่ถ่ายทอด"
