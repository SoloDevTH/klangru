problems:
- id: thai.poetry.prosody.p001
  topics:
  - thai.poetry.prosody
  difficulty: 1
  type: numeric
  stem: กลอนสุภาพ 1 บท มี 4 วรรค วรรคละ 8 คำ รวมมีกี่คำ
  answer:
    value: 32
    unit: คำ
  misconceptions:
  - match: 16
    feedback: นับแค่ 2 วรรค (1 บาท) บทหนึ่งมี 2 บาท 4 วรรค
  - match: 12
    feedback: บวก 4 + 8 ต้องคูณ
  hints:
  - บทหนึ่งมีกี่วรรค
  - จำนวนวรรค × จำนวนคำต่อวรรค
  solution: $4 \times 8 = 32$ คำ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.prosody.p002
  topics:
  - thai.poetry.prosody
  difficulty: 1
  type: mcq
  stem: กาพย์ยานี 11 วรรคหน้ามีกี่คำ
  choices:
  - id: a
    text: 5 คำ
    correct: true
    feedback: ถูก วรรคหน้า 5 วรรคหลัง 6 รวม 11
  - id: b
    text: 6 คำ
    feedback: 6 คำคือวรรคหลัง
  - id: c
    text: 11 คำ
    feedback: 11 คือทั้งบาท
  - id: d
    text: 8 คำ
    feedback: 8 คำคือกลอนสุภาพ
  hints:
  - ชื่อ 11 บอกจำนวนคำในหนึ่งบาท
  - บาทหนึ่งแบ่งเป็นวรรคหน้าและวรรคหลัง
  solution: วรรคหน้า **5 คำ** วรรคหลัง 6 คำ รวม 11 คำต่อบาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.prosody.p003
  topics:
  - thai.poetry.prosody
  difficulty: 2
  type: match
  stem: จับคู่ชนิดคำประพันธ์กับลักษณะ
  pairs:
  - left: กาพย์ยานี 11
    right: บาทละ 11 คำ (5 + 6)
  - left: กาพย์ฉบัง 16
    right: บทละ 3 วรรค 6 / 4 / 6
  - left: กาพย์สุรางคนางค์ 28
    right: บทละ 7 วรรค วรรคละ 4 คำ
  - left: โคลงสี่สุภาพ
    right: 4 บาท 30 คำ เอก 7 โท 4
  hints:
  - ตัวเลขท้ายชื่อกาพย์บอกจำนวนคำ
  - โคลงสี่สุภาพมีบังคับเอกโท
  solution: ยานี = บาทละ 11 · ฉบัง = 6/4/6 · สุรางคนางค์ = 7 วรรค วรรคละ 4 · โคลงสี่สุภาพ = 30 คำ เอก 7 โท 4
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.prosody.p004
  topics:
  - thai.poetry.prosody
  difficulty: 2
  type: numeric
  stem: ในฉันทลักษณ์ คำว่า **สะอาด** นับเป็นกี่คำ
  answer:
    value: 2
    unit: คำ
  misconceptions:
  - match: 1
    feedback: ฉันทลักษณ์นับพยางค์ สะอาด มี 2 พยางค์ สะ-อาด
  hints:
  - คำในฉันทลักษณ์คือพยางค์
  - อ่านช้า ๆ ว่ามีกี่พยางค์
  solution: สะ-อาด มี 2 พยางค์ จึงนับเป็น **2 คำ**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.prosody.p005
  topics:
  - thai.poetry.prosody
  difficulty: 2
  type: mcq
  stem: กาพย์ยานี "เช้านี้ฟ้าแจ่ม**ใส** · ลมโชยไกลพาชื่นบาน" ท้ายวรรคแรก (ใส) สัมผัสกับคำใดในวรรคที่สอง
  choices:
  - id: a
    text: ไกล (คำที่ 3)
    correct: true
    feedback: ถูก ยานีส่งสัมผัสไปคำที่ 3 ของวรรคหลัง
  - id: b
    text: บาน (คำที่ 6)
    feedback: ท้ายวรรคหลังส่งไปท้ายวรรคถัดไป ไม่ได้รับจากวรรคหน้า
  - id: c
    text: ลม (คำที่ 1)
    feedback: ลม ไม่มีสระไอ
  - id: d
    text: ชื่น (คำที่ 5)
    feedback: ชื่น ไม่มีสระไอ
  hints:
  - หาคำที่มีสระไอ
  - ยานีรับสัมผัสที่คำที่ 3 ของวรรคหลัง
  solution: ใส สัมผัสกับ **ไกล** ซึ่งเป็นคำที่ 3 ของวรรคที่สอง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.prosody.p006
  topics:
  - thai.poetry.prosody
  difficulty: 3
  type: mcq
  stem: ท้ายวรรค **รับ** ของกลอนสุภาพ ห้ามใช้เสียงวรรณยุกต์ใด
  choices:
  - id: a
    text: สามัญ และ ตรี
    correct: true
    feedback: ถูก วรรครับนิยมเสียงจัตวา
  - id: b
    text: เอก และ โท
    feedback: ท้ายวรรครับใช้เสียงเอก โท ได้ ข้อห้ามนี้เป็นของวรรครองและวรรคส่ง
  - id: c
    text: จัตวา
    feedback: จัตวาเป็นเสียงที่นิยมที่สุดในวรรครับ
  - id: d
    text: ไม่มีข้อห้าม
    feedback: วรรคที่ไม่บังคับคือวรรคสดับ
  hints:
  - วรรครับคือวรรคที่ 2
  - วรรครับนิยมเสียงจัตวา และห้ามเสียงที่นิยมในวรรครองกับวรรคส่ง
  solution: ท้ายวรรครับห้าม **สามัญ** และ **ตรี** นิยม **จัตวา**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.prosody.p007
  topics:
  - thai.poetry.prosody
  difficulty: 3
  type: mcq
  stem: กลอนสุภาพ วรรครับลงท้ายด้วย "หวาน" คำใดเหมาะเป็น **ท้ายวรรครอง** ที่สุด
  choices:
  - id: a
    text: ลาน
    correct: true
    feedback: ถูก สัมผัส /อาน/ และเป็นเสียงสามัญ
  - id: b
    text: ขาน
    feedback: สัมผัสได้ แต่เป็นเสียงจัตวา ซึ่งห้ามในวรรครอง
  - id: c
    text: ลัน
    feedback: สระสั้น อะ ไม่สัมผัสกับสระยาว อา
  - id: d
    text: ลาง
    feedback: ตัวสะกดแม่กง ไม่ใช่แม่กน
  hints:
  - ต้องสัมผัสสระและตัวสะกดกับ หวาน
  - ท้ายวรรครองต้องเป็นเสียงสามัญหรือตรี
  solution: '**ลาน** สัมผัสกับ หวาน และเป็นเสียงสามัญ ซึ่งเหมาะกับท้ายวรรครอง'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.prosody.p008
  topics:
  - thai.poetry.prosody
  difficulty: 3
  type: numeric
  stem: โคลงสี่สุภาพบังคับตำแหน่งคำเอกและคำโทรวมกันกี่แห่ง
  answer:
    value: 11
    unit: แห่ง
  misconceptions:
  - match: 7
    feedback: 7 คือจำนวนคำเอกอย่างเดียว ต้องรวมคำโทอีก 4
  - match: 30
    feedback: 30 คือจำนวนคำทั้งบท
  hints:
  - เอกกี่แห่ง โทกี่แห่ง
  - นำมาบวกกัน
  solution: เอก 7 + โท 4 = **11** แห่ง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.prosody.p009
  topics:
  - thai.poetry.prosody
  difficulty: 3
  type: mcq
  stem: กาพย์ฉบัง 16 คำท้ายวรรคแรกต้องสัมผัสกับคำใด
  choices:
  - id: a
    text: คำท้ายวรรคที่สอง
    correct: true
    feedback: ถูก
  - id: b
    text: คำที่ 3 ของวรรคที่สอง
    feedback: เป็นตำแหน่งของกาพย์ยานี
  - id: c
    text: คำท้ายวรรคที่สาม
    feedback: ท้ายวรรคที่สามส่งไปบทถัดไป
  - id: d
    text: คำที่ 2 ของวรรคที่สาม
    feedback: เป็นสัมผัสเสริมที่ไม่บังคับ
  hints:
  - ฉบังมี 3 วรรค 6/4/6
  - วรรคที่สองสั้น 4 คำ รับสัมผัสที่ท้ายวรรค
  solution: ท้ายวรรค 1 สัมผัสกับ **ท้ายวรรค 2** ส่วนท้ายวรรค 3 ส่งไปท้ายวรรค 1 ของบทถัดไป
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.prosody.p010
  topics:
  - thai.poetry.prosody
  difficulty: 4
  type: order
  stem: เรียงวรรคของกาพย์สุรางคนางค์ 28 (แต่งโดยคลังรู้) ให้ถูกตามสัมผัสและความหมาย
  items:
  - ตื่นเช้าวันใหม่
  - อาบน้ำทันใด
  - แต่งกายสะอาด
  - กินข้าวกับแม่
  - เดินแลตลาด
  - ทักทายหมู่ญาติ
  - แล้วไปโรงเรียน
  hints:
  - ท้ายวรรค 1 สัมผัสท้ายวรรค 2 (ใหม่–ใด)
  - ท้ายวรรค 3 สัมผัสท้ายวรรค 5 และ 6 ส่วนท้ายวรรค 4 สัมผัสคำที่ 2 ของวรรค 5 (แม่–แล)
  solution: ตื่นเช้าวันใหม่ · อาบน้ำทันใด · แต่งกายสะอาด · กินข้าวกับแม่ · เดินแลตลาด · ทักทายหมู่ญาติ · แล้วไปโรงเรียน (ใหม่–ใด · อาด–ลาด–ญาติ · แม่–แล)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.prosody.p011
  topics:
  - thai.poetry.prosody
  difficulty: 4
  type: mcq
  stem: 'กลอนสุภาพ (แต่งโดยคลังรู้): "แดดยามเย็นส่องฟ้าสีส้มสวย · ลมพัดช่วยโบกพาความเหนื่อยหาย / นั่งริมน้ำมองปลาว่ายตามสาย · ใจสบายคลายทุกข์ได้ทุกวัน" บทนี้ **ผิดฉันทลักษณ์** ตรงไหน'
  choices:
  - id: a
    text: ท้ายวรรครอง (สาย) เป็นเสียงจัตวา ซึ่งห้ามใช้
    correct: true
    feedback: ถูก ท้ายวรรครองต้องเป็นเสียงสามัญหรือตรี
  - id: b
    text: สวย ไม่สัมผัสกับ ช่วย
    feedback: สวย–ช่วย สัมผัส /อวย/ ถูกแล้ว
  - id: c
    text: วรรคส่งมี 7 คำ
    feedback: ใจ สะ บาย คลาย ทุกข์ ได้ ทุก วัน = 8 คำ
  - id: d
    text: ท้ายวรรครับ (หาย) เป็นเสียงจัตวา
    feedback: วรรครับนิยมเสียงจัตวาอยู่แล้ว
  hints:
  - ตรวจจำนวนคำและสัมผัสก่อน แล้วจึงตรวจเสียงท้ายวรรค
  - สาย อักษรสูง คำเป็น ไม่มีรูปวรรณยุกต์ เป็นเสียงอะไร
  solution: จำนวนคำและสัมผัสถูกทั้งหมด แต่ **ท้ายวรรครอง "สาย" เป็นเสียงจัตวา** ซึ่งห้ามใช้ ควรเปลี่ยนเป็นคำเสียงสามัญ เช่น "นั่งริมน้ำมองปลาว่ายเรียงราย"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.prosody.p012
  topics:
  - thai.poetry.prosody
  difficulty: 4
  type: mcq
  stem: ในบาทที่ 2 ของโคลงสี่สุภาพ คำตำแหน่งใดบังคับเป็น **คำเอก** (เลือกได้มากกว่า 1 ข้อ)
  multiple: true
  choices:
  - id: a
    text: คำที่ 2
    correct: true
    feedback: ถูก
  - id: b
    text: คำที่ 6
    correct: true
    feedback: ถูก คำแรกของวรรคหลัง
  - id: c
    text: คำที่ 7
    feedback: คำที่ 7 บังคับเป็นคำโท
  - id: d
    text: คำที่ 5
    feedback: คำที่ 5 เป็นที่รับสัมผัสจากบาทที่ 1 ไม่บังคับเอก
  hints:
  - ดูแผนผังโคลงสี่สุภาพ บาทที่ 2
  - วรรคหลังของบาทที่ 2 คือ เอก โท
  solution: 'บาทที่ 2: **คำที่ 2 เป็นเอก** และวรรคหลัง **คำที่ 6 เอก** คำที่ 7 โท เช่น เสียง**ย่อม**ยอยศใคร **ทั่ว**หล้า'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.prosody.p013
  topics:
  - thai.poetry.prosody
  difficulty: 4
  type: mcq
  stem: ตำแหน่งคำเอกในโคลงหาคำที่มีไม้เอกไม่ได้ ใช้คำใดแทนได้
  choices:
  - id: a
    text: จะ (คำตาย)
    correct: true
    feedback: ถูก คำตายใช้แทนคำเอกได้
  - id: b
    text: นา (คำเป็น ไม่มีรูปวรรณยุกต์)
    feedback: คำเป็นที่ไม่มีไม้เอกใช้แทนไม่ได้
  - id: c
    text: ได้ (คำที่มีไม้โท)
    feedback: ไม้โทใช้แทนไม้เอกไม่ได้
  - id: d
    text: ไหม (คำเป็น)
    feedback: เป็นคำเป็น ใช้แทนเอกไม่ได้
  hints:
  - คำเอกใช้อะไรแทนได้
  - คำตายคือคำที่มีสระเสียงสั้นไม่มีตัวสะกด หรือสะกดด้วย ก บ ด
  solution: '**จะ** เป็นคำตาย ใช้แทนคำเอกได้ (ส่วนคำโทไม่มีคำแทน)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.prosody.p014
  topics:
  - thai.poetry.prosody
  difficulty: 4
  type: mcq
  stem: กาพย์ยานีบทแรกจบด้วย "...นกน้อยร้องขับขาน · ทุกหัวใจสุขสด**ใส**" บทที่สองต้องให้ **ท้ายวรรคที่ 2** สัมผัสกับคำใด
  choices:
  - id: a
    text: ใส
    correct: true
    feedback: ถูก ท้ายบทแรกส่งไปท้ายวรรคที่ 2 ของบทถัดไป
  - id: b
    text: ขาน
    feedback: ขาน รับสัมผัสในบทแรกแล้ว
  - id: c
    text: สุข
    feedback: สุข ไม่ได้อยู่ในตำแหน่งส่งสัมผัส
  - id: d
    text: ไม่ต้องสัมผัส เพราะขึ้นบทใหม่
    feedback: สัมผัสระหว่างบทเป็นสัมผัสบังคับ
  hints:
  - ระหว่างบทของยานี ส่งจากคำไหน
  - คำสุดท้ายของบท
  solution: ท้ายบท (**ใส**) ส่งไปท้ายวรรคที่ 2 ของบทถัดไป
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.prosody.p015
  topics:
  - thai.poetry.prosody
  difficulty: 5
  type: mcq
  stem: ข้อใดเป็นกาพย์ยานีบทที่สองที่ต่อจาก "...ทุกหัวใจสุขสดใส" ได้ **ถูกฉันทลักษณ์ทั้งบท**
  choices:
  - id: a
    text: แม่ค้าขายของเช้า · ส่งเสียงเล่าเรื่องใกล้ไกล / ผู้คนเดินผ่านไป · ยิ้มทักทายกันทั่วหน้า
    correct: true
    feedback: ถูก 5/6/5/6 คำ เช้า–เล่า ไกล–ไป และ ไกล รับสัมผัสระหว่างบทจาก ใส
  - id: b
    text: แม่ค้าขายของเช้า · ส่งเสียงเล่าเรื่องสนุก / ผู้คนเดินผ่านไป · ยิ้มทักทายกันทั่วหน้า
    feedback: ท้ายวรรค 2 (สนุก) ไม่สัมผัสกับ ใส และไม่สัมผัสกับ ไป
  - id: c
    text: แม่ค้าขายของ · ส่งเสียงเล่าเรื่องใกล้ไกล / ผู้คนเดินผ่านไป · ยิ้มทักทายกันทั่วหน้า
    feedback: วรรคแรกมี 4 คำ ต้องมี 5
  - id: d
    text: แม่ค้าขายของเช้า · ส่งเสียงดังเรื่องใกล้ไกล / ผู้คนเดินผ่านไป · ยิ้มทักทายกันทั่วหน้า
    feedback: คำที่ 3 ของวรรค 2 (ดัง) ไม่สัมผัสกับ เช้า
  hints:
  - 'ตรวจทีละข้อ: จำนวนคำ สัมผัสในบท สัมผัสระหว่างบท'
  - ท้ายวรรค 2 ต้องสัมผัสกับ ใส
