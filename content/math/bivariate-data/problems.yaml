problems:
  - id: math.stats.bivariate-data.p001
    topics: [math.stats.bivariate-data]
    difficulty: 1
    type: mcq
    stem: "ในแผนภาพการกระจายของส่วนสูงกับขนาดเท้าของนักเรียน จุดไล่ขึ้นจากซ้ายไปขวาและเกาะกลุ่มใกล้เส้นตรง ข้อใดบรรยายความสัมพันธ์ได้ถูกต้อง"
    choices:
      - { id: a, text: "ความสัมพันธ์ทางบวกที่ค่อนข้างแรง", correct: true }
      - { id: b, text: "ความสัมพันธ์ทางลบที่ค่อนข้างแรง", feedback: "ทางลบจุดจะไล่ลงจากซ้ายไปขวา" }
      - { id: c, text: "ไม่มีความสัมพันธ์", feedback: "จุดมีทิศทางชัดเจนและเกาะกลุ่ม จึงมีความสัมพันธ์" }
      - { id: d, text: "ความสัมพันธ์ทางบวกที่อ่อน", feedback: "จุดเกาะกลุ่มใกล้เส้น แปลว่าแรง ถ้าอ่อนจุดจะกระจายกว้าง" }
    hints:
      - "จุดไล่ขึ้น บอกทิศทางอะไร"
      - "จุดชิดเส้น บอกความแรงอย่างไร"
    solution: "จุดไล่ขึ้นคือความสัมพันธ์ทางบวก และจุดเกาะใกล้เส้นตรงคือความสัมพันธ์แรง: คนที่สูงกว่ามักมีเท้าใหญ่กว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.bivariate-data.p002
    topics: [math.stats.bivariate-data]
    difficulty: 2
    type: match
    stem: "จับคู่แผนภาพการกระจาย P Q R S กับลักษณะของความสัมพันธ์"
    figure: { src: panels-problem.svg, alt: "แผนภาพการกระจายสี่รูป P จุดลดลงจากซ้ายมาถึงกลางแล้วเพิ่มขึ้นทางขวาเป็นรูปตัวยู Q จุดไล่ขึ้นจากซ้ายไปขวาใกล้เส้นตรง R จุดกระจายทั่วกรอบไม่มีทิศทาง S จุดไล่ลงจากซ้ายไปขวาใกล้เส้นตรง" }
    pairs:
      - { left: "P", right: "ไม่ใช่เส้นตรง (ลงแล้วขึ้น)" }
      - { left: "Q", right: "ทางบวก แบบเส้นตรง" }
      - { left: "R", right: "ไม่มีความสัมพันธ์" }
      - { left: "S", right: "ทางลบ แบบเส้นตรง" }
    hints:
      - "ดูทิศทาง: ขึ้น ลง หรือไม่มีทิศ"
      - "ดูรูปร่าง: เส้นตรงหรือโค้ง"
    solution: "P ลงแล้วขึ้นเป็นรูปโค้ง จึงไม่ใช่เส้นตรง Q ไล่ขึ้นเป็นเส้นตรง (ทางบวก) R ไม่มีทิศทาง S ไล่ลงเป็นเส้นตรง (ทางลบ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.bivariate-data.p003
    topics: [math.stats.bivariate-data]
    difficulty: 2
    type: numeric
    stem: "เส้นแนวโน้มของชั่วโมงอ่านหนังสือต่อสัปดาห์ ($x$) กับคะแนนสอบ ($y$) คือ $\\hat{y} = 5x + 40$ ทำนายคะแนนของนักเรียนที่อ่าน 6 ชั่วโมง"
    answer: { value: 70, unit: คะแนน }
    hints:
      - "แทน $x = 6$ ในสมการ"
      - "$5 \\times 6 + 40$"
    misconceptions:
      - { match: 270, feedback: "บวกก่อนคูณ $5 \\times (6 + 40)$ ต้องคูณ $5 \\times 6$ ก่อนแล้วบวก 40" }
      - { match: 51, feedback: "บวก $5 + 6 + 40$ แต่ $5x$ หมายถึง 5 คูณ x" }
    solution: "$\\hat{y} = 5(6) + 40 = 30 + 40 = 70$ คะแนน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.bivariate-data.p004
    topics: [math.stats.bivariate-data]
    difficulty: 3
    type: mcq
    stem: "เส้นแนวโน้ม $\\hat{y} = 5x + 40$ ($x$ = ชั่วโมงอ่านหนังสือต่อสัปดาห์ $y$ = คะแนนสอบ) ความชัน 5 มีความหมายว่าอย่างไร"
    choices:
      - { id: a, text: "อ่านเพิ่ม 1 ชั่วโมงต่อสัปดาห์ สัมพันธ์กับคะแนนเพิ่มขึ้นโดยเฉลี่ย 5 คะแนน", correct: true }
      - { id: b, text: "นักเรียนที่ไม่อ่านเลยจะได้ 5 คะแนน", feedback: "คะแนนเมื่อไม่อ่านคือจุดตัดแกน y ซึ่งเป็น 40 ไม่ใช่ความชัน" }
      - { id: c, text: "ต้องอ่าน 5 ชั่วโมงจึงจะได้คะแนนเพิ่ม 1 คะแนน", feedback: "สลับกัน ความชันคือ y เปลี่ยนเท่าไรเมื่อ x เพิ่ม 1" }
      - { id: d, text: "การอ่านทุกชั่วโมงทำให้คะแนนเพิ่ม 5 คะแนนแน่นอน", feedback: "เส้นแนวโน้มบอกแนวโน้มโดยเฉลี่ย และไม่ได้พิสูจน์ว่าเป็นสาเหตุ" }
    hints:
      - "ความชัน = การเปลี่ยนของ y ต่อ x เพิ่ม 1 หน่วย"
      - "หน่วยของความชันคือ คะแนนต่อชั่วโมง"
    solution: "ความชัน 5 คะแนนต่อชั่วโมง: อ่านเพิ่ม 1 ชั่วโมงต่อสัปดาห์ สัมพันธ์กับคะแนนที่เพิ่มขึ้นโดยเฉลี่ย 5 คะแนน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.bivariate-data.p005
    topics: [math.stats.bivariate-data]
    difficulty: 3
    type: mcq
    stem: "เส้นแนวโน้มราคาโทรศัพท์มือสอง $\\hat{y} = -1{,}500x + 9{,}000$ ($x$ = อายุการใช้งานเป็นปี $y$ = ราคาเป็นบาท) จำนวน 9,000 มีความหมายว่าอย่างไร"
    choices:
      - { id: a, text: "ราคาที่ทำนายของโทรศัพท์อายุ 0 ปี (ยังใหม่) คือ 9,000 บาท", correct: true }
      - { id: b, text: "ราคาลดลงปีละ 9,000 บาท", feedback: "การลดลงต่อปีคือความชัน −1,500 บาท" }
      - { id: c, text: "โทรศัพท์จะไม่มีราคาเมื่ออายุ 9,000 ปี", feedback: "9,000 คือค่า y เมื่อ x = 0 ไม่ใช่ค่า x" }
      - { id: d, text: "ราคาเฉลี่ยของโทรศัพท์ทุกเครื่องคือ 9,000 บาท", feedback: "จุดตัดไม่ใช่ค่าเฉลี่ย แต่เป็นค่าทำนายเมื่อ x = 0" }
    hints:
      - "จุดตัดแกน y คือค่า y เมื่อ x = 0"
      - "x = 0 หมายถึงอายุการใช้งาน 0 ปี"
    solution: "แทน $x = 0$ ได้ $\\hat{y} = 9{,}000$ จึงเป็นราคาที่ทำนายของเครื่องอายุ 0 ปี ส่วน −1,500 คือราคาลดลงโดยเฉลี่ยปีละ 1,500 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.bivariate-data.p006
    topics: [math.stats.bivariate-data]
    difficulty: 3
    type: numeric
    stem: "ใช้เส้นแนวโน้ม $\\hat{y} = 5x + 40$ นักเรียนคนหนึ่งอ่านหนังสือ 4 ชั่วโมงต่อสัปดาห์ ได้คะแนนจริง 62 คะแนน ส่วนเหลือของนักเรียนคนนี้เป็นเท่าไร"
    answer: { value: 2, unit: คะแนน }
    hints:
      - "หาค่าทำนายก่อน: แทน $x = 4$"
      - "ส่วนเหลือ = ค่าจริง − ค่าทำนาย"
    misconceptions:
      - { match: -2, feedback: "ลบกลับข้าง ส่วนเหลือคือค่าจริงลบค่าทำนาย ($62 - 60$)" }
      - { match: 60, feedback: "60 คือค่าทำนาย ยังต้องนำค่าจริงมาลบ" }
    solution: "ค่าทำนาย $5(4) + 40 = 60$ ส่วนเหลือ $= 62 - 60 = 2$ คะแนน (จุดอยู่เหนือเส้น)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.bivariate-data.p007
    topics: [math.stats.bivariate-data]
    difficulty: 3
    type: mcq
    stem: "แผนภาพการกระจายแสดงอุณหภูมิสูงสุดของวันกับจำนวนน้ำแข็งไสที่ร้านหนึ่งในเชียงใหม่ขายได้ จุดใดเป็นค่าผิดปกติ"
    figure: { src: scatter-problem.svg, alt: "แผนภาพการกระจาย แกนนอนอุณหภูมิสูงสุด 27 ถึง 37 องศาเซลเซียส แกนตั้งจำนวนที่ขายได้ 0 ถึง 140 ถ้วย จุดส่วนใหญ่ไล่ขึ้นจาก (28, 53) ไปถึง (36, 128) ใกล้เส้นตรง มีจุดที่วงกลมกำกับไว้สี่จุด A ที่ (28, 53) B ที่ (34, 40) C ที่ (33, 97) และ D ที่ (36, 128)" }
    choices:
      - { id: a, text: "A", feedback: "A อยู่ซ้ายล่าง แต่ยังอยู่ในแนวเดียวกับจุดอื่น วันเย็นขายได้น้อยตามแนวโน้ม" }
      - { id: b, text: "B", correct: true }
      - { id: c, text: "C", feedback: "C อยู่กลางกลุ่มจุด ตรงกับแนวโน้ม" }
      - { id: d, text: "D", feedback: "D มีค่ามากที่สุด แต่ยังอยู่ในแนวเดียวกับจุดอื่น ค่าสูงสุดไม่จำเป็นต้องผิดปกติ" }
    hints:
      - "ค่าผิดปกติคือจุดที่อยู่ห่างจากแนวโน้มของกลุ่ม"
      - "ที่ 34 °C จุดอื่นขายได้ราว 100 ถ้วย"
    solution: "จุด B (34 °C ขายได้ 40 ถ้วย) อยู่ต่ำกว่าแนวโน้มมาก วันอื่นที่ร้อนพอกันขายได้ราว 100 ถ้วย อาจเป็นวันที่ร้านปิดเร็วหรือฝนตก ควรหาสาเหตุ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.bivariate-data.p008
    topics: [math.stats.bivariate-data]
    difficulty: 3
    type: numeric
    stem: |
      สำรวจนักเรียน ม.3 จำนวน 100 คน ในกลุ่มนักเรียนที่เล่นกีฬาเป็นประจำ นอนก่อน 4 ทุ่มคิดเป็นร้อยละเท่าไร

      | | นอนก่อน 4 ทุ่ม | นอนหลัง 4 ทุ่ม | รวม |
      |---|---|---|---|
      | เล่นกีฬา | 36 | 12 | 48 |
      | ไม่เล่นกีฬา | 18 | 34 | 52 |
      | รวม | 54 | 46 | 100 |
    answer: { value: 75, unit: "%" }
    hints:
      - "\"ในกลุ่มที่เล่นกีฬา\" ใช้แถวเล่นกีฬาเป็นตัวหาร"
      - "$\\dfrac{36}{48} \\times 100$"
    misconceptions:
      - { match: 36, feedback: "หารด้วยทั้งหมด 100 คน แต่โจทย์ถามเฉพาะในกลุ่มที่เล่นกีฬา (48 คน)" }
      - { match: 66.67, feedback: "หารด้วยหลักนอนก่อน 4 ทุ่ม (54 คน) นั่นคือร้อยละของคนเล่นกีฬาในกลุ่มที่นอนเร็ว" }
    solution: "ในกลุ่มที่เล่นกีฬา 48 คน นอนก่อน 4 ทุ่ม 36 คน $\\dfrac{36}{48} \\times 100 = 75\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.bivariate-data.p009
    topics: [math.stats.bivariate-data]
    difficulty: 3
    type: mcq
    stem: "ข้อมูลรายเดือนพบว่าเดือนที่ขายไอศกรีมได้มาก มีคนจมน้ำมากด้วย ข้อสรุปใดสมเหตุสมผลที่สุด"
    choices:
      - { id: a, text: "ทั้งสองอย่างอาจเพิ่มขึ้นเพราะอากาศร้อน ข้อมูลนี้ไม่ได้บอกว่าอย่างหนึ่งเป็นสาเหตุของอีกอย่าง", correct: true }
      - { id: b, text: "กินไอศกรีมทำให้จมน้ำ ควรห้ามขายไอศกรีมใกล้แหล่งน้ำ", feedback: "ความสัมพันธ์ไม่ใช่เหตุและผล อากาศร้อนเป็นตัวแปรที่สามที่ทำให้ทั้งสองเพิ่มขึ้น" }
      - { id: c, text: "การจมน้ำทำให้คนอยากกินไอศกรีม", feedback: "กลับทิศเหตุผลก็ยังเป็นการสรุปเหตุและผลจากการสังเกต ซึ่งทำไม่ได้" }
      - { id: d, text: "ไม่มีความสัมพันธ์กันเลย", feedback: "ข้อมูลบอกว่าทั้งสองเพิ่มพร้อมกัน จึงมีความสัมพันธ์ทางบวก แต่ไม่ใช่เหตุและผล" }
    hints:
      - "มีอะไรที่ทำให้ทั้งสองอย่างเพิ่มขึ้นพร้อมกันไหม"
      - "ช่วงไหนคนกินไอศกรีมและลงเล่นน้ำมากที่สุด"
    solution: "ทั้งสองตัวแปรมีความสัมพันธ์ทางบวก แต่มีตัวแปรที่สาม คืออากาศร้อน ทำให้คนกินไอศกรีมและลงเล่นน้ำมากขึ้นพร้อมกัน สหสัมพันธ์จึงไม่ได้บอกเหตุและผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.bivariate-data.p010
    topics: [math.stats.bivariate-data]
    difficulty: 4
    type: numeric
    stem: "นักเรียนลากเส้นแนวโน้มของระยะทางที่ขี่จักรยาน ($x$ กิโลเมตร) กับเวลาที่ใช้ ($y$ นาที) ผ่านจุด $(2, 30)$ และ $(10, 70)$ ความชันของเส้นเป็นกี่นาทีต่อกิโลเมตร"
    answer: { value: 5, unit: นาที/กม. }
    hints:
      - "ความชัน = การเปลี่ยนของ y หารด้วยการเปลี่ยนของ x"
      - "$\\dfrac{70 - 30}{10 - 2}$"
    misconceptions:
      - { match: 0.2, feedback: "หาร x ด้วย y (กลับเศษส่วน) ความชันคือ $\\Delta y \\div \\Delta x$" }
      - { match: 15, feedback: "หาร 30 ด้วย 2 จากจุดเดียว ต้องใช้การเปลี่ยนระหว่างสองจุด" }
    solution: "$m = \\dfrac{70 - 30}{10 - 2} = \\dfrac{40}{8} = 5$ นาทีต่อกิโลเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.bivariate-data.p011
    topics: [math.stats.bivariate-data]
    difficulty: 4
    type: mcq
    stem: "จากข้อมูลส่วนสูงของเด็กอายุ 6–12 ปี ได้เส้นแนวโน้ม $\\hat{y} = 6x + 80$ ($x$ = อายุเป็นปี $y$ = ส่วนสูงเป็นเซนติเมตร) ถ้าใช้ทำนายส่วนสูงเมื่ออายุ 40 ปี ได้ 320 เซนติเมตร ข้อใดอธิบายได้ถูกต้อง"
    choices:
      - { id: a, text: "เป็นการทำนายนอกช่วงข้อมูล คนหยุดสูงเมื่อโตเต็มที่ แนวโน้มเส้นตรงจึงใช้ไม่ได้", correct: true }
      - { id: b, text: "คำนวณผิด ที่ถูกคือ 6 × 40 = 240 เซนติเมตร", feedback: "แทนค่าถูกแล้ว ($6 \\times 40 + 80 = 320$) ปัญหาอยู่ที่การใช้เส้นนอกช่วงข้อมูล" }
      - { id: c, text: "เชื่อถือได้ เพราะความสัมพันธ์เป็นทางบวกที่แรง", feedback: "ความสัมพันธ์แรงในช่วง 6–12 ปี ไม่ได้รับประกันว่าจะเป็นเส้นตรงต่อไปจนอายุ 40 ปี" }
      - { id: d, text: "ต้องเปลี่ยนเป็นหน่วยเมตรก่อน", feedback: "หน่วยไม่ใช่ปัญหา 320 เซนติเมตรก็คือ 3.2 เมตรซึ่งเป็นไปไม่ได้" }
    hints:
      - "ข้อมูลที่ใช้สร้างเส้นอยู่ในช่วงอายุเท่าใด"
      - "คนเราสูงขึ้นเรื่อย ๆ ตลอดชีวิตไหม"
    solution: "อายุ 40 ปีอยู่นอกช่วงข้อมูล 6–12 ปีมาก (extrapolation) ส่วนสูงหยุดเพิ่มเมื่อโตเต็มวัย ค่า 320 เซนติเมตรจึงเป็นไปไม่ได้ ควรทำนายเฉพาะภายในหรือใกล้ช่วงข้อมูล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.bivariate-data.p012
    topics: [math.stats.bivariate-data]
    difficulty: 4
    type: numeric
    stem: "แปลงนาทดลองแห่งหนึ่งพบเส้นแนวโน้มของปริมาณปุ๋ย ($x$ กิโลกรัมต่อไร่) กับผลผลิตข้าว ($y$ กิโลกรัมต่อไร่) เป็น $\\hat{y} = 8x + 380$ โดยข้อมูลมี $x$ ตั้งแต่ 0 ถึง 25 ทำนายผลผลิตเมื่อใส่ปุ๋ย 15 กิโลกรัมต่อไร่"
    answer: { value: 500, unit: กก./ไร่ }
    hints:
      - "15 อยู่ในช่วงข้อมูล จึงทำนายได้"
      - "แทน $x = 15$: $8 \\times 15 + 380$"
    misconceptions:
      - { match: 403, feedback: "บวก $8 + 15 + 380$ แต่ $8x$ หมายถึง 8 คูณ x" }
      - { match: 120, feedback: "120 คือส่วนที่เพิ่มจากปุ๋ย ($8 \\times 15$) ยังต้องบวกจุดตัด 380" }
    solution: "$\\hat{y} = 8(15) + 380 = 120 + 380 = 500$ กิโลกรัมต่อไร่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.bivariate-data.p013
    topics: [math.stats.bivariate-data]
    difficulty: 3
    type: numeric
    stem: "ชมรมหมากรุกไทยสำรวจนักเรียน 30 คน เป็นนักเรียนชาย 14 คน ชายที่เล่นหมากรุกเป็น 9 คน หญิงที่เล่นหมากรุกเป็น 5 คน ถ้าสร้างตารางสองทาง (เพศ × เล่นหมากรุกเป็นหรือไม่) ช่อง หญิงที่เล่นไม่เป็น มีกี่คน"
    answer: { value: 11, unit: คน }
    hints:
      - "หาจำนวนนักเรียนหญิงก่อน"
      - "หญิง $= 30 - 14$ แล้วลบหญิงที่เล่นเป็น"
    misconceptions:
      - { match: 16, feedback: "16 คือนักเรียนหญิงทั้งหมด ต้องลบหญิงที่เล่นเป็น 5 คน" }
      - { match: 5, feedback: "5 คือหญิงที่เล่นเป็น โจทย์ถามหญิงที่เล่นไม่เป็น" }
    solution: "หญิง $30 - 14 = 16$ คน เล่นเป็น 5 คน เล่นไม่เป็น $16 - 5 = 11$ คน (ชายเล่นไม่เป็น $14 - 9 = 5$ คน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.bivariate-data.p014
    topics: [math.stats.bivariate-data]
    difficulty: 5
    type: numeric
    stem: |
      จากตารางสองทาง ร้อยละของนักเรียนที่นอนก่อน 4 ทุ่มในกลุ่มที่เล่นกีฬา มากกว่าในกลุ่มที่ไม่เล่นกีฬากี่จุดร้อยละ (ตอบทศนิยม 1 ตำแหน่ง)

      | | นอนก่อน 4 ทุ่ม | นอนหลัง 4 ทุ่ม | รวม |
      |---|---|---|---|
      | เล่นกีฬา | 36 | 12 | 48 |
      | ไม่เล่นกีฬา | 18 | 34 | 52 |
    answer: { value: 40.4, tolerance: 0.15, unit: จุดร้อยละ }
    hints:
      - "หาร้อยละภายในแต่ละแถวแยกกัน"
      - "$\\dfrac{36}{48} \\times 100$ และ $\\dfrac{18}{52} \\times 100$ แล้วลบกัน"
    misconceptions:
      - { match: 18, feedback: "ลบจำนวนดิบ ($36 - 18$) แต่สองกลุ่มมีขนาดไม่เท่ากัน ต้องเทียบเป็นร้อยละภายในแถว" }
      - { match: 75, feedback: "75 คือร้อยละของกลุ่มที่เล่นกีฬาเพียงกลุ่มเดียว ต้องลบร้อยละของกลุ่มที่ไม่เล่นด้วย" }
    solution: "เล่นกีฬา: $\\dfrac{36}{48} = 75\\%$ ไม่เล่น: $\\dfrac{18}{52} \\approx 34.6\\%$ ต่างกัน $75 - 34.6 \\approx 40.4$ จุดร้อยละ ต่างกันมาก จึงมีความสัมพันธ์ระหว่างการเล่นกีฬากับเวลานอน (แต่ไม่ได้พิสูจน์ว่าเป็นสาเหตุ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.bivariate-data.p015
    topics: [math.stats.bivariate-data]
    difficulty: 5
    type: numeric
    stem: "ข้อมูลชุดหนึ่งมีจุดเฉลี่ย $(\\bar{x}, \\bar{y}) = (6, 52)$ ถ้าเส้นแนวโน้มผ่านจุดเฉลี่ยและมีความชัน 4 จุดตัดแกน $y$ ของเส้นเป็นเท่าไร"
    answer: { value: 28 }
    hints:
      - "เขียนเส้นเป็น $y = 4x + c$"
      - "แทนจุด $(6, 52)$ แล้วแก้หา $c$"
    misconceptions:
      - { match: 76, feedback: "บวก $4 \\times 6$ เข้ากับ 52 แต่ต้องลบ: $c = 52 - 24$" }
      - { match: 48, feedback: "ลบแค่ 4 ต้องลบ $4 \\times 6 = 24$" }
    solution: "$52 = 4(6) + c$ จึงได้ $c = 52 - 24 = 28$ เส้นคือ $\\hat{y} = 4x + 28$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.bivariate-data.p016
    topics: [math.stats.bivariate-data]
    difficulty: 5
    type: mcq
    stem: "จำนวนผู้ติดตามช่องวิดีโอใหม่ของน้ำในเดือนที่ 1 ถึง 5 คือ 300, 600, 1,200, 2,400, 4,800 คน แบบจำลองใดเหมาะกับข้อมูลนี้ที่สุด"
    choices:
      - { id: a, text: "แบบเลขชี้กำลัง เพราะค่าเพิ่มเป็นสองเท่าทุกเดือน", correct: true }
      - { id: b, text: "แบบเส้นตรง เพราะค่าเพิ่มขึ้นทุกเดือน", feedback: "เพิ่มขึ้นทุกเดือนแต่เพิ่มไม่เท่ากัน (300, 600, 1,200, 2,400) เส้นตรงต้องเพิ่มเท่ากันทุกครั้ง" }
      - { id: c, text: "ไม่มีความสัมพันธ์", feedback: "ค่าเพิ่มอย่างเป็นระบบตามเดือน จึงมีความสัมพันธ์ชัดเจน" }
      - { id: d, text: "แบบเส้นตรงที่มีความชันลบ", feedback: "ค่าเพิ่มขึ้น ไม่ได้ลดลง" }
    hints:
      - "ดูผลต่างของเดือนที่ติดกัน และอัตราส่วนของเดือนที่ติดกัน"
      - "ผลต่างไม่คงที่ แต่อัตราส่วนเป็น 2 ทุกครั้ง"
    solution: "ผลต่าง 300, 600, 1,200, 2,400 ไม่คงที่ เส้นตรงจึงไม่เหมาะ แต่อัตราส่วนเป็น 2 ทุกเดือน แบบจำลองเลขชี้กำลัง $y = 150 \\times 2^x$ จึงเหมาะกว่า บนแผนภาพการกระจายจุดจะเป็นเส้นโค้งที่ชันขึ้นเรื่อย ๆ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.bivariate-data.p017
    topics: [math.stats.bivariate-data]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการสร้างแผนภาพการกระจายและเส้นแนวโน้มจากข้อมูลสองตัวแปร"
    items:
      - "เลือกตัวแปรที่จะอยู่บนแกน x และแกน y"
      - "กำหนดสเกลและเขียนชื่อแกนพร้อมหน่วย"
      - "วางจุด (x, y) หนึ่งจุดต่อข้อมูลหนึ่งตัว"
      - "อธิบายทิศทาง ความแรง รูปร่าง และค่าผิดปกติ"
      - "ถ้าเป็นแบบเส้นตรง ลากเส้นแนวโน้มผ่านกลางกลุ่มจุด"
    hints:
      - "ต้องมีแกนก่อนจึงวางจุดได้"
      - "ต้องดูรูปแบบก่อน จึงรู้ว่าควรลากเส้นตรงหรือไม่"
    solution: "เลือกแกน → กำหนดสเกลและชื่อแกน → วางจุด → อธิบายรูปแบบ → ลากเส้นแนวโน้มเมื่อรูปแบบเป็นเส้นตรง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.bivariate-data.p018
    topics: [math.stats.bivariate-data]
    difficulty: 4
    type: numeric
    stem: "ร้านรับซื้อโทรศัพท์มือสองใช้เส้นแนวโน้ม $\\hat{y} = -1{,}500x + 9{,}000$ ($x$ = อายุการใช้งานเป็นปี $y$ = ราคาบาท) ทำนายราคาของโทรศัพท์อายุ 3 ปี"
    answer: { value: 4500, unit: บาท }
    hints:
      - "แทน $x = 3$"
      - "$-1{,}500 \\times 3 + 9{,}000$"
    misconceptions:
      - { match: 13500, feedback: "ใช้ความชันเป็นบวก ราคาลดลงปีละ 1,500 บาท ต้องลบ" }
      - { match: 7500, feedback: "ลบแค่ปีเดียว ($9{,}000 - 1{,}500$) อายุ 3 ปีลดลงสามครั้ง" }
    solution: "$\\hat{y} = -1{,}500(3) + 9{,}000 = -4{,}500 + 9{,}000 = 4{,}500$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.bivariate-data.p019
    topics: [math.stats.bivariate-data]
    difficulty: 2
    type: mcq
    stem: "จากแผนภาพการกระจายอุณหภูมิกับจำนวนน้ำแข็งไสที่ขายได้ (ไม่นับจุด B) ความสัมพันธ์เป็นแบบใด"
    figure: { src: scatter-problem.svg, alt: "แผนภาพการกระจาย แกนนอนอุณหภูมิสูงสุด 27 ถึง 37 องศาเซลเซียส แกนตั้งจำนวนที่ขายได้ 0 ถึง 140 ถ้วย จุดส่วนใหญ่ไล่ขึ้นจาก (28, 53) ไปถึง (36, 128) ใกล้เส้นตรง มีจุดที่วงกลมกำกับไว้สี่จุด A ที่ (28, 53) B ที่ (34, 40) C ที่ (33, 97) และ D ที่ (36, 128)" }
    choices:
      - { id: a, text: "ทางบวก แบบเส้นตรง", correct: true }
      - { id: b, text: "ทางลบ แบบเส้นตรง", feedback: "จุดไล่ขึ้นจากซ้ายไปขวา ไม่ใช่ไล่ลง" }
      - { id: c, text: "ไม่มีความสัมพันธ์", feedback: "จุดส่วนใหญ่เรียงเป็นแนวชัดเจน มีเพียงจุด B ที่หลุดออกไป" }
      - { id: d, text: "ไม่ใช่เส้นตรง (โค้ง)", feedback: "จุดเรียงใกล้เส้นตรง ไม่ได้โค้งขึ้นหรือลง" }
    hints:
      - "ดูทิศทาง: วันที่ร้อนกว่าขายได้มากหรือน้อย"
      - "ดูว่าจุดเรียงใกล้เส้นตรงหรือเส้นโค้ง"
    solution: "วันที่ร้อนกว่ามักขายได้มากกว่า จุดไล่ขึ้นใกล้เส้นตรง จึงเป็นความสัมพันธ์ทางบวกแบบเส้นตรง (ค่อนข้างแรง)"
    license: CC-BY-SA-4.0
    ai_assisted: true
