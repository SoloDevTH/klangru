problems:
  - id: computer.systems.mobile-computing.p001
    topics: [computer.systems.mobile-computing]
    difficulty: 1
    type: mcq
    stem: "สถานีฐานในเครือข่ายเซลลูลาร์ทำหน้าที่อะไรเป็นหลัก"
    choices:
      - { id: b, text: "เก็บรูปภาพและวิดีโอของผู้ใช้ทุกคน", feedback: "สถานีฐานทำหน้าที่เชื่อมต่อการสื่อสาร ไม่ได้เป็นที่เก็บไฟล์ของผู้ใช้" }
      - { id: a, text: "รับส่งสัญญาณกับอุปกรณ์เคลื่อนที่ในพื้นที่เซลล์ที่สถานีนั้นดูแล", correct: true }
      - { id: c, text: "ติดตั้งแอปให้โทรศัพท์โดยอัตโนมัติ", feedback: "การติดตั้งแอปเกิดผ่านระบบปฏิบัติการและร้านแอป ไม่ได้เกิดจากสถานีฐาน" }
      - { id: d, text: "เปลี่ยนระบบปฏิบัติการของอุปกรณ์", feedback: "สถานีฐานไม่ได้เปลี่ยนระบบปฏิบัติการของเครื่อง" }
    hints:
      - "ลองนึกถึงสิ่งที่สถานีฐานต้องทำเพื่อให้โทรศัพท์ในพื้นที่ใช้เครือข่ายได้"
      - "สถานีฐานทำงานในระดับการสื่อสารไร้สาย ไม่ได้ทำงานกับแอปบนเครื่อง"
    solution: "สถานีฐานรับส่งสัญญาณไร้สายกับอุปกรณ์ในเซลล์ของตน และเชื่อมต่อกับเครือข่ายหลักเพื่อให้อุปกรณ์ใช้บริการได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.mobile-computing.p002
    topics: [computer.systems.mobile-computing]
    difficulty: 1
    type: match
    stem: "จับคู่คำศัพท์ของเครือข่ายและแอปมือถือกับความหมายที่ตรงที่สุด"
    pairs:
      - { left: "เซลล์ (cell)", right: "พื้นที่ที่สถานีฐานหนึ่งดูแลการเชื่อมต่อ" }
      - { left: "การส่งต่อ (handover)", right: "ย้ายการเชื่อมต่อไปยังเซลล์ที่สัญญาณแรงกว่าเมื่อผู้ใช้เคลื่อนที่" }
      - { left: "แอปเนทีฟ", right: "แอปที่เขียนมาสำหรับระบบปฏิบัติการหนึ่งโดยเฉพาะ" }
      - { left: "เว็บแอป", right: "แอปที่ทำงานผ่านเบราว์เซอร์ ไม่ต้องติดตั้งจากร้านแอป" }
    hints:
      - "คำว่า handover แปลตรงตัวว่า ส่งมอบ"
      - "คำว่า native หมายถึงการเขียนให้เข้ากับระบบโดยตรง"
    solution: "เซลล์คือพื้นที่บริการของสถานีฐาน การส่งต่อคือการย้ายการเชื่อมต่อระหว่างเซลล์ แอปเนทีฟเขียนสำหรับระบบปฏิบัติการหนึ่ง และเว็บแอปทำงานผ่านเบราว์เซอร์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.mobile-computing.p003
    topics: [computer.systems.mobile-computing]
    difficulty: 2
    type: numeric
    stem: "ผู้ใช้ในจังหวัดเชียงใหม่ดาวน์โหลดไฟล์ขนาด 240 เมกะไบต์ (MB) ผ่านเครือข่ายที่ได้ความเร็ว 40 เมกะบิตต่อวินาที (Mbps) โดยไม่คิดค่าใช้จ่ายส่วนหัวของโพรโทคอล จะใช้เวลาประมาณกี่วินาที (ตอบเป็นวินาที)"
    answer: { value: 48, unit: วินาที }
    hints:
      - "หน่วยของไฟล์เป็นไบต์ แต่ความเร็วเป็นบิต ต้องแปลงให้หน่วยตรงกัน"
      - "1 ไบต์ มี 8 บิต ดังนั้น 240 MB เท่ากับ 240 × 8 เมกะบิต"
      - "เวลา = ขนาดไฟล์ในหน่วยบิต ÷ ความเร็ว"
    misconceptions:
      - { match: 6, feedback: "ลืมแปลงไบต์เป็นบิต ทำให้คำนวณเวลาจากขนาดเป็นไบต์โดยตรง ซึ่งเร็วกว่าความจริงแปดเท่า" }
    solution: "240 MB = 240 × 8 = 1,920 เมกะบิต เวลา = 1,920 ÷ 40 = 48 วินาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.mobile-computing.p004
    topics: [computer.systems.mobile-computing]
    difficulty: 2
    type: mcq
    stem: "เมื่อโทรศัพท์เปลี่ยนจาก Wi-Fi ไปใช้เครือข่ายมือถือ เหตุใดการเชื่อมต่อบางอย่างจึงอาจขาดได้"
    choices:
      - { id: b, text: "เครือข่ายมือถือไม่สามารถส่งข้อมูลได้เลย", feedback: "เครือข่ายมือถือส่งข้อมูลได้ แต่การเชื่อมต่อเดิมผูกกับที่อยู่ที่เปลี่ยนไป" }
      - { id: c, text: "Wi-Fi ไม่ได้ใช้โพรโทคอลอินเทอร์เน็ต", feedback: "Wi-Fi ใช้โพรโทคอลอินเทอร์เน็ตเช่นกัน ปัญหาอยู่ที่การเปลี่ยนเครือข่าย" }
      - { id: a, text: "อุปกรณ์ได้ที่อยู่ IP จากเครือข่ายใหม่ ซึ่งต่างจากที่ใช้กับการเชื่อมต่อเดิม", correct: true }
      - { id: d, text: "จอภาพของโทรศัพท์จะปิดอัตโนมัติ", feedback: "การเปลี่ยนเครือข่ายไม่ได้ทำให้จอปิด" }
    hints:
      - "ลองนึกว่าเครื่องแต่ละเครือข่ายได้ที่อยู่แบบใด"
      - "การเชื่อมต่อที่ผูกกับที่อยู่เดิมจะทำงานต่อได้หรือไม่เมื่อที่อยู่เปลี่ยน"
    solution: "อุปกรณ์ได้รับที่อยู่ IP จากแต่ละเครือข่าย เมื่อเปลี่ยนเครือข่ายที่อยู่จึงเปลี่ยน การเชื่อมต่อที่ผูกกับที่อยู่เดิมอาจขาดจนกว่าระบบหรือแอปจะรองรับการเปลี่ยนนี้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.mobile-computing.p005
    topics: [computer.systems.mobile-computing]
    difficulty: 2
    type: numeric
    stem: "แอปส่งตำแหน่งของรถรับส่งนักเรียนทุก 10 วินาที ต่อมาปรับให้ส่งทุก 60 วินาที จำนวนครั้งที่ส่งต่อชั่วโมงลดลงกี่เปอร์เซ็นต์ (ตอบเป็นเปอร์เซ็นต์ ทศนิยมได้ 1 ตำแหน่ง)"
    answer: { value: 83.3, tolerance: 0.1, unit: เปอร์เซ็นต์ }
    hints:
      - "หาจำนวนครั้งที่ส่งต่อชั่วโมงก่อนและหลังการปรับ"
      - "ทุก 10 วินาทีส่งได้ 360 ครั้งต่อชั่วโมง ทุก 60 วินาทีส่งได้ 60 ครั้งต่อชั่วโมง"
      - "การลดลงเป็นเปอร์เซ็นต์ = ส่วนที่หายไป ÷ ของเดิม × 100"
    misconceptions:
      - { match: 16.7, feedback: "นั่นคือสัดส่วนที่เหลือ (60 ÷ 360) ไม่ใช่ส่วนที่ลดลง โจทย์ถามว่าลดลงกี่เปอร์เซ็นต์" }
    solution: "เดิม 3,600 ÷ 10 = 360 ครั้งต่อชั่วโมง ใหม่ 3,600 ÷ 60 = 60 ครั้ง ลดลง 300 ครั้ง คิดเป็น 300 ÷ 360 × 100 ≈ 83.3%"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.mobile-computing.p006
    topics: [computer.systems.mobile-computing]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นข้อดีหลักของการพัฒนาแอปข้ามแพลตฟอร์ม"
    choices:
      - { id: b, text: "ใช้ฟีเจอร์เฉพาะของทุกระบบปฏิบัติการได้ครบเสมอ", feedback: "แอปข้ามแพลตฟอร์มอาจเข้าถึงฟีเจอร์เฉพาะของบางระบบได้จำกัด" }
      - { id: c, text: "ไม่ต้องทดสอบบนอุปกรณ์จริงเลย", feedback: "แอปข้ามแพลตฟอร์มยังต้องทดสอบบนอุปกรณ์จริง เพราะพฤติกรรมอาจต่างกันในแต่ละระบบ" }
      - { id: d, text: "ไม่ต้องอัปเดตแอปอีกหลังเผยแพร่", feedback: "แอปทุกประเภทต้องอัปเดตเมื่อมีการแก้ไขหรือพบช่องโหว่" }
      - { id: a, text: "เขียนโค้ดชุดเดียวแล้วใช้ได้บนหลายระบบปฏิบัติการ ซึ่งมักช่วยลดต้นทุนการพัฒนา", correct: true }
    hints:
      - "คิดว่าแอปข้ามแพลตฟอร์มแก้ปัญหาอะไรให้ทีมพัฒนาเป็นหลัก"
      - "ตัวเลือกที่พูดว่าไม่ต้องทำอะไรเลยมักเป็นข้อความที่ไม่ถูกต้อง"
    solution: "ข้อดีหลักคือเขียนโค้ดชุดเดียวใช้ได้หลายระบบ ลดเวลาและต้นทุนการพัฒนา แต่ต้องยังทดสอบให้ตรงกับพฤติกรรมของแต่ละแพลตฟอร์ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.mobile-computing.p007
    topics: [computer.systems.mobile-computing]
    difficulty: 2
    type: text
    stem: "แอปที่ยังใช้งานข้อมูลบางส่วนได้เมื่อไม่มีสัญญาณอินเทอร์เน็ต และส่งข้อมูลที่ค้างขึ้นเซิร์ฟเวอร์เมื่อกลับมาเชื่อมต่อ เรียกการทำงานแบบนี้ว่าอะไร (ตอบเป็นคำไทยหรืออังกฤษ)"
    accepted: ["ออฟไลน์", "การทำงานออฟไลน์", "ทำงานออฟไลน์", "offline", "offline mode"]
    hints:
      - "คำนี้ตรงข้ามกับการทำงานที่ต้องต่อเน็ตตลอดเวลา"
      - "ลองนึกถึงโหมดที่แอปเก็บข้อมูลไว้ในเครื่องก่อน"
    solution: "การทำงานออฟไลน์ (offline mode) คือการเก็บข้อมูลไว้ในเครื่องแล้วซิงก์เมื่อกลับมาเชื่อมต่อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.mobile-computing.p008
    topics: [computer.systems.mobile-computing]
    difficulty: 3
    type: order
    stem: "เรียงสถานะของแอปเมื่อผู้ใช้สลับไปแอปอื่นแล้วกลับมาใช้แอปนี้อีกครั้ง"
    items:
      - "แอปอยู่หน้าจอและผู้ใช้กำลังใช้งาน"
      - "ผู้ใช้เปิดแอปอื่น แอปนี้ไปทำงานเบื้องหลัง"
      - "ระบบพักแอปนี้ไว้เพื่อประหยัดแบตเตอรี่"
      - "ผู้ใช้กลับมาเปิดแอป แอปคืนสถานะที่บันทึกไว้"
    hints:
      - "สถานะแรกคือตอนที่ผู้ใช้กำลังดูแอปอยู่"
      - "สถานะสุดท้ายคือการกลับมาทำงานต่อจากจุดที่ค้างไว้"
    solution: "แอปเริ่มที่หน้าจอ ย้ายไปทำงานเบื้องหลังเมื่อสลับแอป ระบบพักแอปเพื่อประหยัดแบตเตอรี่ และเมื่อกลับมาแอปคืนสถานะที่บันทึกไว้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.mobile-computing.p009
    topics: [computer.systems.mobile-computing]
    difficulty: 3
    type: numeric
    stem: "แอปสั่งอาหารของร้านในตลาดนัดแห่งหนึ่งโหลดข้อมูลขนาด 4 MB ทุกครั้งที่ผู้ใช้เปิดแอป ผู้ใช้เปิดแอป 25 ครั้งต่อวัน ถ้าเดือนนั้นมี 30 วัน แอปจะใช้ข้อมูลรวมทั้งเดือนกี่ MB (ค่าสมมติ)"
    answer: { value: 3000, unit: MB }
    hints:
      - "หาจำนวนครั้งที่เปิดแอปทั้งเดือนก่อน"
      - "จำนวนครั้งทั้งเดือน = 25 × 30"
      - "ข้อมูลรวม = จำนวนครั้งทั้งเดือน × 4 MB"
    misconceptions:
      - { match: 100, feedback: "ลืมคูณจำนวนวันในเดือน คำนวณได้เพียงข้อมูลของวันเดียว" }
      - { match: 750, feedback: "ลืมคูณขนาดข้อมูลต่อครั้งที่ 4 MB ทำให้ได้เพียงจำนวนครั้งทั้งเดือน" }
    solution: "จำนวนครั้งทั้งเดือน = 25 × 30 = 750 ครั้ง ข้อมูลรวม = 750 × 4 = 3,000 MB"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.mobile-computing.p010
    topics: [computer.systems.mobile-computing]
    difficulty: 3
    type: mcq
    stem: "แอปที่ต้องการประหยัดแบตเตอรี่ได้ดีที่สุดควรทำอย่างไร"
    choices:
      - { id: a, text: "ดึงตำแหน่งเฉพาะตอนที่จำเป็น และพักงานเบื้องหลังที่ไม่จำเป็น", correct: true }
      - { id: b, text: "ดึงตำแหน่งทุกวินาทีเพื่อให้ข้อมูลใหม่เสมอ", feedback: "การดึงตำแหน่งถี่ทุกวินาทีใช้แบตเตอรี่มากโดยไม่จำเป็นในหลายงาน" }
      - { id: c, text: "ให้งานทุกอย่างทำงานตลอดเวลาเพื่อความรวดเร็ว", feedback: "งานที่ทำงานตลอดเวลาเป็นสาเหตุสำคัญของการใช้แบตเตอรี่สูง" }
      - { id: d, text: "ปิดการเชื่อมต่อทุกอย่างแม้ผู้ใช้กำลังต้องการ", feedback: "การปิดการเชื่อมต่อที่ผู้ใช้ต้องการทำให้แอปใช้ไม่ได้ ไม่ใช่การออกแบบที่ดี" }
    hints:
      - "ลองคิดว่าการทำงานที่ไม่จำเป็นกินแบตเตอรี่อย่างไร"
      - "ตัวเลือกที่ทำงานตลอดเวลาหรือถี่เกินจำเป็นมักใช้พลังงานมาก"
    solution: "การดึงข้อมูลเฉพาะตอนจำเป็นและการพักงานเบื้องหลังที่ไม่ต้องทำงานช่วยลดการใช้พลังงานได้โดยที่ผู้ใช้ยังได้บริการที่ต้องการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.mobile-computing.p011
    topics: [computer.systems.mobile-computing]
    difficulty: 3
    type: mcq
    stem: "เมื่อแอปเก็บข้อมูลไว้ในเครื่องก่อนส่งขึ้นเซิร์ฟเวอร์ ปัญหาที่ต้องวางแผนรับมือตั้งแต่ต้นคืออะไร"
    choices:
      - { id: b, text: "ข้อมูลในเครื่องจะหายไปทุกครั้งที่ปิดแอป", feedback: "การเก็บข้อมูลในเครื่องออกแบบให้คงอยู่ได้ ปัญหาหลักคือความขัดแย้งของค่า" }
      - { id: a, text: "ข้อมูลอาจขัดแย้งกันเมื่อแก้ไขพร้อมกันจากหลายอุปกรณ์ จึงต้องมีกติกาแก้ข้อขัดแย้ง", correct: true }
      - { id: c, text: "แอปจะส่งข้อมูลขึ้นเซิร์ฟเวอร์ได้เร็วขึ้นทุกครั้งโดยไม่มีข้อจำกัด", feedback: "ข้อความนี้ไม่ใช่ปัญหาที่ต้องรับมือ แต่เป็นข้อสันนิษฐานที่ไม่ถูกต้อง" }
      - { id: d, text: "ผู้ใช้ไม่สามารถปิดการซิงก์ได้เลย", feedback: "การซิงก์ควบคุมได้ตามการออกแบบ ปัญหาหลักคือการจัดการความขัดแย้งของข้อมูล" }
    hints:
      - "ลองนึกถึงกรณีที่ผู้ใช้แก้ไขข้อมูลเดียวกันจากสองเครื่องขณะออฟไลน์"
      - "ตัวเลือกที่กล่าวว่าไม่มีข้อจำกัดเลยมักไม่ใช่คำตอบที่ถูกต้อง"
    solution: "เมื่อข้อมูลถูกแก้ในหลายอุปกรณ์ขณะออฟไลน์ เมื่อซิงก์แล้วค่าอาจขัดกัน แอปต้องกำหนดว่าจะยึดค่าใดหรือให้ผู้ใช้เลือกเอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.mobile-computing.p012
    topics: [computer.systems.mobile-computing]
    difficulty: 4
    type: numeric
    stem: "แอปสั่งอาหารของร้านแห่งหนึ่งในตลาดนัดเก็บคำสั่งซื้อที่ยังไม่ได้ส่งขึ้นเซิร์ฟเวอร์ไว้ 42 รายการขณะไม่มีสัญญาณ เมื่อกลับมาเชื่อมต่อส่งได้ครั้งละ 8 รายการ ต้องส่งอย่างน้อยกี่ครั้งจึงจะส่งครบทั้งหมด (ตอบเป็นจำนวนครั้ง)"
    answer: { value: 6 }
    hints:
      - "หาร 42 ด้วย 8 ได้ผลลัพธ์เป็นทศนิยม ต้องดูว่ามีเศษหรือไม่"
      - "ถ้ายังมีเศษ ต้องส่งอีกหนึ่งครั้งเพื่อส่งรายการที่เหลือ"
    misconceptions:
      - { match: 5, feedback: "ปัดลงจาก 42 ÷ 8 = 5.25 เป็น 5 ครั้ง ทำให้มีรายการ 2 รายการที่ยังไม่ได้ส่ง" }
    solution: "42 ÷ 8 = 5 เศษ 2 จึงต้องส่งอีก 1 ครั้ง รวมเป็น 6 ครั้ง ครั้งที่ 6 ส่งเพียง 2 รายการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.mobile-computing.p013
    topics: [computer.systems.mobile-computing]
    difficulty: 4
    type: numeric
    stem: "แบตเตอรี่สมาร์ตโฟนรุ่นหนึ่งมีความจุ 4,000 mAh และแรงดัน 3.8 V (ค่าสมมติ) พลังงานที่เก็บได้เท่ากับกี่วัตต์-ชั่วโมง (Wh) ตอบทศนิยมได้ 2 ตำแหน่ง"
    answer: { value: 15.2, tolerance: 0.05, unit: Wh }
    hints:
      - "พลังงานเท่ากับกระแสคูณแรงดัน แต่ความจุ mAh คือมิลลิแอมแปร์-ชั่วโมง"
      - "แปลง mAh เป็น A-h โดยหาร 1,000 แล้วคูณกับแรงดัน"
    misconceptions:
      - { match: 1052.6, feedback: "หารความจุด้วยแรงดันแทนการคูณ ผลที่ได้จึงไม่ใช่หน่วยพลังงาน" }
    solution: "4,000 mAh = 4 Ah พลังงาน = 4 × 3.8 = 15.2 Wh"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.mobile-computing.p014
    topics: [computer.systems.mobile-computing]
    difficulty: 4
    type: mcq
    stem: "ข้อใดอธิบายการส่งต่อ (handover) ระหว่างเซลล์ได้ถูกต้องที่สุด"
    choices:
      - { id: b, text: "ผู้ใช้ต้องปิดและเปิดเครื่องใหม่ทุกครั้งที่เปลี่ยนเซลล์", feedback: "การส่งต่อที่ดีทำงานโดยไม่ให้ผู้ใช้ต้องรีสตาร์ตเครื่อง" }
      - { id: c, text: "การส่งต่อเกิดเฉพาะเมื่ออุปกรณ์ปิดเครื่อง", feedback: "การส่งต่อเกิดขณะอุปกรณ์เปิดอยู่และกำลังเคลื่อนที่" }
      - { id: a, text: "เมื่อสัญญาณจากเซลล์เดิมอ่อนลง เครือข่ายย้ายการเชื่อมต่อไปยังเซลล์ที่แรงกว่าโดยผู้ใช้ไม่ต้องเริ่มใหม่", correct: true }
      - { id: d, text: "เซลล์ทั้งหมดในเมืองใช้สถานีฐานเดียวกัน", feedback: "แต่ละเซลล์มีสถานีฐานที่ดูแลพื้นที่ของตน" }
    hints:
      - "คำถามถามถึงการย้ายการเชื่อมต่อจากเซลล์หนึ่งไปอีกเซลล์"
      - "เป้าหมายของการส่งต่อคือให้การเชื่อมต่อต่อเนื่อง"
    solution: "การส่งต่อคือการย้ายการเชื่อมต่อไปยังเซลล์ที่สัญญาณดีกว่าขณะอุปกรณ์เคลื่อนที่ โดยเป้าหมายคือให้ผู้ใช้ไม่รู้สึกว่าการเชื่อมต่อขาดไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.mobile-computing.p015
    topics: [computer.systems.mobile-computing]
    difficulty: 4
    type: mcq
    stem: "แอปหนึ่งต้องการสิทธิ์เข้าถึงตำแหน่งของผู้ใช้เพื่อแสดงร้านอาหารใกล้เคียง ข้อใดเป็นแนวทางที่เหมาะสมที่สุด"
    choices:
      - { id: b, text: "ขอสิทธิ์ตำแหน่งทันทีที่เปิดแอปครั้งแรกโดยไม่อธิบาย", feedback: "การขอสิทธิ์โดยไม่อธิบายทำให้ผู้ใช้ไม่ไว้ใจและอาจปฏิเสธ" }
      - { id: c, text: "ขอสิทธิ์และเก็บตำแหน่งทุกวินาทีตลอดไป", feedback: "การเก็บตำแหน่งตลอดเวลาเกินกว่าที่งานต้องการ และขัดกับหลักการให้สิทธิ์น้อยที่สุดที่จำเป็น" }
      - { id: d, text: "ไม่ต้องขอสิทธิ์ เพราะตำแหน่งเป็นข้อมูลสาธารณะ", feedback: "ตำแหน่งของบุคคลเป็นข้อมูลที่ต้องได้รับการดูแลและขอสิทธิ์อย่างเหมาะสม" }
      - { id: a, text: "ขอสิทธิ์เฉพาะตอนที่ผู้ใช้ค้นหาร้านใกล้เคียง อธิบายเหตุผลก่อนขอ และให้ผู้ใช้ถอนสิทธิ์ได้", correct: true }
    hints:
      - "ลองคิดว่าแอปต้องการตำแหน่งจริงเมื่อไร"
      - "หลักการให้สิทธิ์น้อยที่สุดที่จำเป็นช่วยตัดสินใจได้"
    solution: "การขอสิทธิ์เมื่อต้องใช้งาน อธิบายเหตุผล และให้ถอนได้ เป็นแนวทางที่สอดคล้องกับหลักการให้สิทธิ์น้อยที่สุดที่จำเป็นและความเป็นส่วนตัวของผู้ใช้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.mobile-computing.p016
    topics: [computer.systems.mobile-computing]
    difficulty: 5
    type: numeric
    stem: "ไฟล์ขนาด 240 MB ถูกดาวน์โหลดบนเครือข่ายที่โฆษณาความเร็ว 40 Mbps แต่ได้ความเร็วจริงเฉลี่ยเพียง 70% ของที่โฆษณา ไม่คิดค่าส่วนหัวของโพรโทคอล จะใช้เวลาประมาณกี่วินาที (ตอบทศนิยมได้ 1 ตำแหน่ง)"
    answer: { value: 68.6, tolerance: 0.1, unit: วินาที }
    hints:
      - "คำนวณความเร็วจริงก่อน คือ 70% ของ 40 Mbps"
      - "แปลงขนาดไฟล์เป็นเมกะบิต คือ 240 × 8"
      - "เวลา = ขนาดไฟล์ในหน่วยบิต ÷ ความเร็วจริง"
    misconceptions:
      - { match: 48, feedback: "ลืมปรับความเร็วจริงให้เหลือ 70% ของที่โฆษณา จึงได้เวลาที่เร็วเกินจริง" }
    solution: "ความเร็วจริง = 0.7 × 40 = 28 Mbps ขนาดไฟล์ = 240 × 8 = 1,920 เมกะบิต เวลา = 1,920 ÷ 28 ≈ 68.6 วินาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.mobile-computing.p017
    topics: [computer.systems.mobile-computing]
    difficulty: 5
    type: mcq
    stem: "ทีมที่พัฒนาแอปข้ามแพลตฟอร์มควรให้ความสำคัญกับเรื่องใดตั้งแต่ต้นของโครงการ"
    choices:
      - { id: a, text: "การเข้าถึงได้ การรองรับภาษาและฟอนต์ไทย ความปลอดภัยของข้อมูล และการอัปเดตที่ทำร่วมกันได้บนทุกแพลตฟอร์ม", correct: true }
      - { id: b, text: "ดูแค่ความสวยงามบนเครื่องรุ่นล่าสุดเท่านั้น", feedback: "การทดสอบเฉพาะรุ่นล่าสุดละเลยผู้ใช้จำนวนมากที่ใช้เครื่องรุ่นเก่าหรือแตกต่างกัน" }
      - { id: c, text: "เลื่อนเรื่องความปลอดภัยไปทำหลังเผยแพร่ เพื่อให้เร็วขึ้น", feedback: "ความปลอดภัยที่เลื่อนไปจะทำให้ช่องโหว่ถูกเปิดเผยก่อนแก้ไข" }
      - { id: d, text: "ใช้ภาษาอังกฤษอย่างเดียวเพื่อให้ตรงกันทุกแพลตฟอร์ม", feedback: "ผู้ใช้จำนวนมากต้องการภาษาของตนเอง การรองรับภาษาท้องถิ่นเป็นส่วนสำคัญของคุณภาพ" }
    hints:
      - "คิดถึงเรื่องที่ต้องรับมือไม่ว่าจะเป็นแพลตฟอร์มใด"
      - "ตัวเลือกที่เลื่อนหรือละเลยเรื่องสำคัญมักเป็นคำตอบที่ไม่เหมาะ"
    solution: "เรื่องที่ต้องคิดทุกแพลตฟอร์มคือการเข้าถึงได้ การแสดงภาษาไทยให้ถูกต้อง ความปลอดภัยของข้อมูล และการอัปเดต ซึ่งควรวางแผนตั้งแต่ต้นมากกว่าแก้ทีหลัง"
    license: CC-BY-SA-4.0
    ai_assisted: true
