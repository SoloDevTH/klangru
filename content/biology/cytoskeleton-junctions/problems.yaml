      - { match: 0.25, feedback: "ลืมแปลง 10 mm เป็น 10,000 μm ก่อนหาร จึงได้ค่าน้อยเกินจริงมาก" }
    hints:
      - "หาก่อนว่าเซลล์หนึ่งเซลล์ในภาพกว้างกี่ mm"
      - "ขนาดเซลล์ในภาพ (μm) ÷ ขนาดเซลล์จริง (μm)"
    solution: "5 เซลล์ยาว 50 mm ดังนั้นเซลล์หนึ่งยาว 10 mm = 10,000 μm กำลังขยาย = 10,000 ÷ 40 = 250 เท่า ซึ่งต่างจาก 400 เท่าที่ตั้งไว้"
