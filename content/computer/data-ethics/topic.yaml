id: computer.society.data-ethics
subject: computer
title: { th: จริยธรรมและธรรมาภิบาลข้อมูล, en: "Data ethics and data governance" }
summary: ความเป็นเจ้าของและอธิปไตยข้อมูล ประโยชน์และความเสี่ยงของเมทาดาทา ความเอนเอียงที่แทรกได้ทุกขั้นของงานข้อมูล กฎหมายคุ้มครองข้อมูลส่วนบุคคล และนโยบายที่ทำให้ใช้ข้อมูลอย่างรับผิดชอบ
difficulty: 5
minutes: 45
prerequisites: [computer.society.privacy, computer.data.data-processing]
encompasses:
  - { id: computer.society.privacy, weight: 0.3 }
  - { id: computer.data.data-processing, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: bias-pipeline.svg
    alt: "ลำดับห้ากล่องจากซ้ายไปขวา ได้แก่ เก็บข้อมูล ติดป้ายข้อมูล เลือกตัวแปร ฝึกและทดสอบ และนำไปใช้ ใต้แต่ละกล่องมีตัวอย่างความเอนเอียงที่อาจเกิดขึ้น เช่น เก็บจากผู้ใช้แอปเท่านั้น หรือดูแค่ค่าเฉลี่ยรวมจนกลุ่มเล็กถูกกลบ"
    caption: "ความเอนเอียงอาจแทรกเข้าไปได้ในทุกขั้นของงานข้อมูล ไม่ได้เกิดเฉพาะตอนสร้างโมเดล"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: สำรวจความพึงพอใจของขนส่งสาธารณะผ่านแอปจะได้ตัวอย่างแบบใด
    problem: "เมืองหนึ่งมีประชากร 8,000 คน อายุ 18–35 ปีคิดเป็น 40% (ค่าสมมติ) การสำรวจเก็บผ่านแอปเท่านั้น มีผู้ตอบ 1,600 คน ในจำนวนนี้ 1,280 คนอายุ 18–35 ปี ตัวอย่างนี้เอนเอียงไปทางกลุ่มอายุนี้กี่เปอร์เซ็นต์จุด"
    steps:
      - text: "สัดส่วนของกลุ่มอายุ 18–35 ปีในตัวอย่าง = 1,280 ÷ 1,600 = 0.80 หรือ 80%"
        why: "ตัวอย่างนี้มาจากผู้ใช้แอปเท่านั้น จึงเป็นภาพของกลุ่มที่ใช้แอปเป็นหลัก"
      - text: "สัดส่วนของกลุ่มเดียวกันในประชากรจริง = 40%"
      - text: "ผลต่าง = 80% − 40% = 40 เปอร์เซ็นต์จุด"
        why: "ผลต่างนี้บอกว่าตัวอย่างเอนเอียงไปทางกลุ่มนี้มากเพียงใด ไม่ใช่อัตราส่วน"
      - text: "ผลสำรวจจึงควรถ่วงน้ำหนักให้ตรงกับสัดส่วนประชากร หรือเก็บข้อมูลเพิ่มจากกลุ่มที่ขาด"
        why: "การถ่วงน้ำหนักช่วยปรับผลรวม แต่ไม่ได้เพิ่มข้อมูลของกลุ่มที่ไม่ได้ตอบเลย"
    answer: "ตัวอย่างเอนเอียงไปทางกลุ่มอายุ 18–35 ปี 40 เปอร์เซ็นต์จุด ผลสำรวจต้องปรับหรือเก็บข้อมูลเพิ่มก่อนสรุป"
  - { type: check, problem: computer.society.data-ethics.p002, prompt: "ลองจับคู่ขั้นตอนกับความเอนเอียงก่อนอ่านต่อ" }
  - type: worked-example
    title: ความแม่นยำโดยรวมซ่อนกลุ่มที่แย่กว่าได้อย่างไร
    problem: "ระบบทำนายผลมีความถูกต้อง 92% ในกลุ่ม X ที่มี 800 รายการ และ 65% ในกลุ่ม Y ที่มี 200 รายการ (ค่าสมมติ) ความถูกต้องโดยรวมคิดเป็นกี่เปอร์เซ็นต์ และกลุ่ม Y ได้รับผลอย่างไร"
    steps:
      - text: "จำนวนที่ถูกในกลุ่ม X = 0.92 × 800 = 736 รายการ"
      - text: "จำนวนที่ถูกในกลุ่ม Y = 0.65 × 200 = 130 รายการ"
        why: "ต้องคำนวณเป็นจำนวนรายการก่อนรวม เพราะสองกลุ่มมีขนาดไม่เท่ากัน"
      - text: "ความถูกต้องรวม = (736 + 130) ÷ 1,000 = 866 ÷ 1,000 = 86.6%"
      - text: "กลุ่ม Y ถูกต้องเพียง 65% ต่ำกว่าค่ารวมเกือบ 22 เปอร์เซ็นต์จุด"
        why: "ตัวเลขรวมที่สูงทำให้มองไม่เห็นว่ากลุ่มเล็กได้รับผลแย่กว่า จึงต้องรายงานแยกตามกลุ่ม"
    answer: "ความถูกต้องรวม 86.6% แต่กลุ่ม Y ได้เพียง 65% จึงต้องตรวจแยกตามกลุ่มก่อนนำระบบไปใช้"
  - { type: check, problem: computer.society.data-ethics.p006, prompt: "ตัวอย่างที่ตรงกับหลักการลดข้อมูลคือข้อใด" }
glossary:
  - { term: จริยธรรมข้อมูล (data ethics), definition: "การพิจารณาว่าการเก็บ ใช้ และเผยแพร่ข้อมูลส่งผลดีหรือร้ายต่อคนและสังคมอย่างไร และควรทำอะไรให้เป็นธรรม" }
  - { term: ธรรมาภิบาลข้อมูล (data governance), definition: "กติกา บทบาท และการตรวจสอบที่กำหนดว่าใครทำอะไรกับข้อมูลได้บ้างตลอดวงจรของข้อมูล" }
  - { term: เมทาดาทา (metadata), definition: "ข้อมูลที่อธิบายข้อมูลอื่น เช่น เวลา ตำแหน่ง และความถี่ของการใช้งาน" }
  - { term: ความเอนเอียง (bias), definition: "ความคลาดเคลื่อนที่เป็นระบบ ทำให้ผลของข้อมูลหรือโมเดลเอียงไปทางกลุ่มใดกลุ่มหนึ่ง" }
  - { term: ความเป็นส่วนตัวเชิงอนุพันธ์ (differential privacy), definition: "วิธีเติมสัญญาณรบกวนแบบสุ่มลงในค่าสถิติ เพื่อให้การมีหรือไม่มีของบุคคลหนึ่งในข้อมูลแทบไม่เปลี่ยนผลที่เผยแพร่" }
flashcards:
  - { front: "อธิปไตยข้อมูลหมายถึงอะไร", back: "สิทธิ์ของบุคคล ชุมชน หรือประเทศในการกำหนดว่าข้อมูลเกี่ยวกับตนถูกเก็บและใช้อย่างไร" }
  - { front: "ความเอนเอียงแทรกได้ในขั้นใดบ้างของงานข้อมูล", back: "ทุกขั้น ได้แก่ การเก็บ การติดป้าย การเลือกตัวแปร การฝึกและทดสอบ และการนำไปใช้" }
  - { front: "เหตุใดความถูกต้องรวมจึงอาจไม่พอ", back: "ค่ารวมอาจสูงแต่กลุ่มเล็กได้ผลแย่มาก จึงต้องรายงานแยกตามกลุ่ม" }
  - { front: "ทำไมการลบชื่ออย่างเดียวจึงไม่พอ", back: "ข้อมูลทางอ้อมที่เหลืออาจรวมกันจนระบุตัวบุคคลได้" }
