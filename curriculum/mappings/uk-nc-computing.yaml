# หัวข้อในคลังกับ National curriculum in England: computing (KS1–KS4)
# รหัส UKNC-CO-* เป็นรหัสที่เราตั้ง จับคู่จากเนื้อหาใน lesson.md และ problems.yaml จริง (ตรวจ 2026-10-24)
# หัวข้อ content/computer ที่มี topic.yaml lesson.md problems.yaml ครบ ณ วันที่จับคู่: computer.algorithms.intro, computer.data.binary, computer.programming.basics
framework: uk-nc-computing
mappings:
  - topic: computer.data.binary
    indicators: ["UKNC-CO-KS3-04", "UKNC-CO-KS3-06"]
    coverage: partial
    note: "KS3-06 มีการแทนข้อความ ภาพ และเสียงด้วยเลขฐานสอง ยังไม่มีการเก็บและทำงานของคำสั่งในเครื่อง KS3-04 มีการแปลงเลขฐานสองแต่ยังไม่มีตรรกะแบบบูลและการบวกเลขฐานสอง"
  - topic: computer.programming.basics
    indicators: ["UKNC-CO-KS1-02", "UKNC-CO-KS2-02", "UKNC-CO-KS2-03", "UKNC-CO-KS3-03"]
    coverage: partial
    note: "KS2-02 ครบ (ลำดับ ทางเลือก วนซ้ำ ตัวแปร input/output) การหาข้อผิดพลาดทางไวยากรณ์และตรรกะ ใช้ภาษาที่เป็นข้อความ (Python) และรายการ ยังไม่มีภาษาที่สองและโปรแกรมแบบโมดูล"
  - topic: computer.algorithms.intro
    indicators: [UKNC-CO-KS1-01, UKNC-CO-KS1-03, UKNC-CO-KS2-03]
    coverage: full
    note: KS1-01 KS1-03 ครบ (อัลกอริทึมต้องชัดเจนไม่กำกวม ทำนายผลด้วยการไล่) KS2-03 มีการอธิบายและหาข้อผิดพลาดในอัลกอริทึม ส่วนในโปรแกรมอยู่ใน programming.basics
  - topic: computer.data.digital-data-basics
    indicators: [UKNC-CO-KS1-04]
    coverage: partial
    note: สอนการสร้าง จัดระเบียบ จัดเก็บ แก้ไข และเรียกใช้ไฟล์ แต่ไม่ได้ฝึกใช้เทคโนโลยีจริง
  - topic: computer.data.internet-search
    indicators: [UKNC-CO-KS2-05]
    coverage: full
    note: รวมการเลือกและจัดอันดับผลการค้นหา โฆษณา และการประเมินเนื้อหา
  - topic: computer.programming.block-programming
    indicators: [UKNC-CO-KS2-01]
    coverage: partial
    note: สอนการวางแผน การแตกงานเป็นส่วนย่อย การไล่หาบั๊ก และการควบคุมหุ่นยนต์ด้วยเซนเซอร์ แต่ยังไม่ได้เขียนและดีบักโปรแกรมของตนเอง
  - topic: computer.safety.safe-ict-primary
    indicators: [UKNC-CO-KS1-06, UKNC-CO-KS2-07]
    coverage: full
