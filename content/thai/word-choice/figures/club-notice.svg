<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="sans-serif">
<title>ประกาศชมรมหุ่นยนต์</title>
<defs></defs>
<rect x="0" y="0" width="700" height="300" fill="#fff"/>
<rect x="10.0" y="10.0" width="680.0" height="280.0" rx="10" fill="#fffdf5" stroke="#b08900" stroke-width="2.5"/>
<text x="350.0" y="58.0" font-size="26" text-anchor="middle" fill="#7a5c00" font-weight="bold">ประกาศ ชมรมหุ่นยนต์</text>
<text x="350.0" y="112.0" font-size="21" text-anchor="middle" fill="#111" font-weight="normal">ขอเชิญสมาชิกทุกคนมาประชุมเลือกประธานชมรม</text>
<text x="350.0" y="154.0" font-size="21" text-anchor="middle" fill="#111" font-weight="normal">ที่ห้องคอมพิวเตอร์ อาคาร 3</text>
<text x="350.0" y="196.0" font-size="21" text-anchor="middle" fill="#111" font-weight="normal">วันอังคารที่ 10 พฤศจิกายน</text>
<text x="350.0" y="238.0" font-size="21" text-anchor="middle" fill="#111" font-weight="normal">สมาชิกที่ไม่มาจะเสียสิทธิ์ออกเสียง</text>
<text x="660.0" y="276.0" font-size="16" text-anchor="end" fill="#555" font-weight="normal">ประธานชมรม</text>
</svg>
