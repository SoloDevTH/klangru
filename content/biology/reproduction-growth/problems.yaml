    choices:
      - { id: a, text: "เอ็มบริโอส่งจิบเบอเรลลินไปกระตุ้นชั้นแอลิวโรนให้สร้างอะไมเลส ซึ่งย่อยแป้งรอบเมล็ด", correct: true }
      - { id: b, text: "เอ็มบริโอสร้างแป้งเพิ่มบนวุ้น", feedback: "วงใสแปลว่าแป้งหายไป ไม่ได้มีแป้งเพิ่ม" }
      - { id: c, text: "จิบเบอเรลลินย่อยแป้งได้โดยตรง", feedback: "ถ้าจิบเบอเรลลินย่อยแป้งเอง จะต้องเกิดวงใสแม้ไม่มีเมล็ด การทดลองนี้แสดงว่าเมล็ดต้องสร้างเอนไซม์" }
      - { id: d, text: "ไอโอดีนไม่ทำปฏิกิริยากับแป้งรอบเอ็มบริโอ", feedback: "ไอโอดีนติดสีน้ำเงินกับแป้งเสมอ วงใสแปลว่าแป้งถูกย่อยไปแล้ว" }
