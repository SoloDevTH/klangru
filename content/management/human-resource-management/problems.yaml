    ai_assisted: true

  - id: management.hr.human-resource-management.p017
    topics: [management.hr.human-resource-management]
    difficulty: 5
    type: numeric
    stem: "หอผู้ป่วยอายุรกรรม (สมมติ) มีผู้ป่วยเฉลี่ยวันละ 28 คน ผู้ป่วยหนึ่งคนต้องการการพยาบาลเฉลี่ย 4.5 ชั่วโมงต่อวัน หอเปิดทุกวันตลอดปี (365 วัน) พยาบาลหนึ่งคนมีเวลาทำงานจริง 1,575 ชั่วโมงต่อปี ต้องมีพยาบาลอย่างน้อยกี่คน"
    answer: { value: 30, unit: คน }
    hints:
      - "ชั่วโมงการพยาบาลต่อปี = 28 × 4.5 × 365"
      - "หารด้วยชั่วโมงทำงานจริงต่อคน แล้วปัดขึ้น"
    misconceptions:
      - { match: 29, feedback: "ปัดลงจาก 29.2 จะขาดชั่วโมงการพยาบาล ต้องปัดขึ้น" }
      - { match: 21, feedback: "ดูเหมือนคิดเฉพาะวันทำการ 260 วัน หอผู้ป่วยต้องมีพยาบาลทุกวันตลอดปี 365 วัน" }
    solution: "ชั่วโมงการพยาบาล $28 \\times 4.5 \\times 365 = 45{,}990$ ชั่วโมงต่อปี FTE $= 45{,}990 \\div 1{,}575 = 29.2$ ปัดขึ้นเป็น 30 คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

