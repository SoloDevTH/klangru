<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" width="640" height="170" font-family="sans-serif" font-size="14">
<title>การต่อเซลล์ไฟฟ้าแบบอนุกรมที่ถูกและผิด</title>
<rect x="0" y="0" width="640" height="170" fill="#ffffff"/>
<text x="160.0" y="30.0" text-anchor="middle" fill="#15211e" font-size="15" font-weight="bold">ถูก: ขั้วบวกต่อขั้วลบ</text>
<rect x="40.0" y="70.0" width="110.0" height="36.0" rx="6" fill="#455a64" stroke="#15211e" stroke-width="2"/>
<rect x="150.0" y="80.0" width="8.0" height="16.0" rx="0" fill="#9e9e9e" stroke="#15211e" stroke-width="1.5"/>
<text x="138.0" y="94.0" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">+</text>
<text x="52.0" y="94.0" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">−</text>
<text x="95.0" y="126.0" text-anchor="middle" fill="#15211e" font-size="13">1.5 V</text>
<rect x="170.0" y="70.0" width="110.0" height="36.0" rx="6" fill="#455a64" stroke="#15211e" stroke-width="2"/>
<rect x="280.0" y="80.0" width="8.0" height="16.0" rx="0" fill="#9e9e9e" stroke="#15211e" stroke-width="1.5"/>
<text x="268.0" y="94.0" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">+</text>
<text x="182.0" y="94.0" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">−</text>
<text x="225.0" y="126.0" text-anchor="middle" fill="#15211e" font-size="13">1.5 V</text>
<text x="160.0" y="150.0" text-anchor="middle" fill="#2e7d32" font-size="15">รวมกันได้ 1.5 V + 1.5 V = 3 V</text>
<text x="480.0" y="30.0" text-anchor="middle" fill="#15211e" font-size="15" font-weight="bold">ผิด: ขั้วบวกชนขั้วบวก</text>
<rect x="360.0" y="70.0" width="110.0" height="36.0" rx="6" fill="#455a64" stroke="#15211e" stroke-width="2"/>
<rect x="470.0" y="80.0" width="8.0" height="16.0" rx="0" fill="#9e9e9e" stroke="#15211e" stroke-width="1.5"/>
<text x="458.0" y="94.0" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">+</text>
<text x="372.0" y="94.0" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">−</text>
<text x="415.0" y="126.0" text-anchor="middle" fill="#15211e" font-size="13">1.5 V</text>
<rect x="490.0" y="70.0" width="110.0" height="36.0" rx="6" fill="#455a64" stroke="#15211e" stroke-width="2"/>
<rect x="482.0" y="80.0" width="8.0" height="16.0" rx="0" fill="#9e9e9e" stroke="#15211e" stroke-width="1.5"/>
<text x="502.0" y="94.0" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">+</text>
<text x="588.0" y="94.0" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">−</text>
<text x="545.0" y="126.0" text-anchor="middle" fill="#15211e" font-size="13">1.5 V</text>
<text x="480.0" y="150.0" text-anchor="middle" fill="#b4521f" font-size="15">หักล้างกัน หลอดไฟไม่สว่าง</text>
</svg>
