<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 390" width="500" height="390" font-family="sans-serif" font-size="16">
  <title>แผ่นกระดาษสี่เหลี่ยมจัตุรัสด้านละ 30 cm ตัดมุมสี่เหลี่ยมจัตุรัสด้านละ x ออกทั้งสี่มุม</title>
  <rect x="50" y="30" width="300" height="300" fill="#e2f0ed" stroke="#15211e" stroke-width="2.5"/>
  <rect x="50" y="30" width="40" height="40" fill="#ffffff" stroke="#b4521f" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="310" y="30" width="40" height="40" fill="#ffffff" stroke="#b4521f" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="50" y="290" width="40" height="40" fill="#ffffff" stroke="#b4521f" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="310" y="290" width="40" height="40" fill="#ffffff" stroke="#b4521f" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="90" y="70" width="220" height="220" fill="none" stroke="#6b7672" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="70" y="55" text-anchor="middle" fill="#b4521f" font-size="15" font-weight="bold" font-style="italic">x</text>
  <text x="330" y="55" text-anchor="middle" fill="#b4521f" font-size="15" font-weight="bold" font-style="italic">x</text>
  <line x1="50" y1="348" x2="350" y2="348" stroke="#15211e" stroke-width="1.5" />
  <line x1="50" y1="342" x2="50" y2="354" stroke="#15211e" stroke-width="1.5" />
  <line x1="350" y1="342" x2="350" y2="354" stroke="#15211e" stroke-width="1.5" />
  <text x="200" y="368" text-anchor="middle" fill="#15211e" font-size="15" font-weight="bold">30 cm</text>
  <text x="370" y="170" text-anchor="start" fill="#b4521f" font-size="13" >ตัดมุมทั้งสี่ออก</text>
  <text x="370" y="190" text-anchor="start" fill="#b4521f" font-size="13" >แล้วพับขอบขึ้น</text>
</svg>
