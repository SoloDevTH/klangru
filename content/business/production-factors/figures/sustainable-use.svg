<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" font-family="sans-serif" font-size="14">
  <title>วิธีใช้ทรัพยากรอย่างยั่งยืนหกวิธีและประโยชน์</title>
  <rect x="0" y="0" width="760" height="230" fill="#ffffff"/>
  <rect x="20.0" y="30.0" width="225.0" height="64.0" rx="8" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="132.5" y="57.8" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">ใช้อย่างประหยัด</text>
  <text x="132.5" y="75.3" text-anchor="middle" fill="#1f2937" font-size="13">ใช้เท่าที่จำเป็น</text>
  <rect x="265.0" y="30.0" width="225.0" height="64.0" rx="8" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="377.5" y="57.8" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">ลด</text>
  <text x="377.5" y="75.3" text-anchor="middle" fill="#1f2937" font-size="13">ลดของใช้ครั้งเดียวทิ้ง</text>
  <rect x="510.0" y="30.0" width="225.0" height="64.0" rx="8" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="622.5" y="57.8" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">ใช้ซ้ำ</text>
  <text x="622.5" y="75.3" text-anchor="middle" fill="#1f2937" font-size="13">ใช้ของเดิมหลายครั้ง</text>
  <rect x="20.0" y="110.0" width="225.0" height="64.0" rx="8" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="132.5" y="137.8" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">นำกลับมาใช้ใหม่</text>
  <text x="132.5" y="155.3" text-anchor="middle" fill="#1f2937" font-size="13">แปรรูปเศษวัสดุ</text>
  <rect x="265.0" y="110.0" width="225.0" height="64.0" rx="8" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="377.5" y="137.8" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">ปลูกทดแทน</text>
  <text x="377.5" y="155.3" text-anchor="middle" fill="#1f2937" font-size="13">ปลูกป่า ปล่อยพันธุ์ปลา</text>
  <rect x="510.0" y="110.0" width="225.0" height="64.0" rx="8" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="622.5" y="137.8" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">พลังงานหมุนเวียน</text>
  <text x="622.5" y="155.3" text-anchor="middle" fill="#1f2937" font-size="13">แสงอาทิตย์ ลม</text>
  <text x="380.0" y="212.0" text-anchor="middle" fill="#6b7280" font-size="13">ประโยชน์: มีทรัพยากรใช้ถึงรุ่นลูกหลาน · ลดต้นทุน · ลดมลพิษ</text>
</svg>
