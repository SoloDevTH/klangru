    solution: 'องค์ประกอบตั้งฉากกับกำแพง $v\cos 60^\circ = 5\ \mathrm{m/s}$ เปลี่ยนจาก $+5$ เป็น $-5$ ส่วนองค์ประกอบขนานไม่เปลี่ยน $\Delta p = m(5 - (-5)) = 0.4 \times 10 = 4\ \mathrm{kg \cdot m/s}$ มีทิศตั้งฉากออกจากกำแพง'
