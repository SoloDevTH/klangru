problems:
- id: technology.living.work-process.p001
  topics:
  - technology.living.work-process
  difficulty: 1
  type: order
  stem: "เรียงลำดับกระบวนการทำงานสี่ขั้นให้ถูกต้อง"
  items:
  - "ลงมือทำตามแผนและจดปัญหาที่พบ"
  - "ประเมินผลและปรับปรุงงาน"
  - "วิเคราะห์งานว่ามีเป้าหมายและขั้นตอนอย่างไร"
  - "วางแผนลำดับงาน คน เวลา และวัสดุ"
  hints:
  - "ก่อนวางแผนต้องรู้ก่อนว่างานคืออะไรและเป้าหมายคืออะไร"
  - "การประเมินผลเป็นขั้นหลังลงมือทำ และอาจทำให้วนกลับไปขั้นก่อนหน้าได้"
  - "ถ้าไม่มีแผนก็ไม่รู้ว่าจะลงมือทำอะไรก่อน"
  solution: "วิเคราะห์งานว่ามีเป้าหมายและขั้นตอนอย่างไร แล้ววางแผนลำดับงาน คน เวลา และวัสดุ จากนั้นลงมือทำตามแผนและจดปัญหา สุดท้ายประเมินผลและปรับปรุง เพราะต้องรู้ข้อมูลตั้งต้นก่อนจึงวางแผนได้"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.work-process.p002
  topics:
  - technology.living.work-process
  difficulty: 1
  type: mcq
  stem: "เหตุผลที่งานต้องมีเป้าหมายที่ชัดเจนคือข้อใด"
  choices:
  - id: a
    text: "ทำให้ไม่ต้องวางแผนลำดับงานอีก"
    feedback: "เป้าหมายไม่ได้แทนแผน แผนยังจำเป็นเสมอ"
  - id: b
    text: "ทำให้รู้ว่างานเสร็จเมื่อไร และประเมินได้ว่าผลเป็นไปตามที่ตั้งไว้หรือไม่"
    correct: true
  - id: c
    text: "ทำให้ใช้วัสดุได้มากขึ้นโดยไม่ต้องคิด"
    feedback: "เป้าหมายที่ดีช่วยให้ใช้วัสดุพอดี ไม่ได้ทำให้ใช้มากขึ้น"
  - id: d
    text: "ทำให้ไม่ต้องตรวจงานหลังทำเสร็จ"
    feedback: "การตรวจงานยังจำเป็น และเป้าหมายเป็นเกณฑ์สำหรับตรวจงานนั้นเอง"
  hints:
  - "ลองนึกถึงการทำงานที่ไม่รู้ว่าเมื่อไรจะเสร็จ"
  - "เป้าหมายช่วยให้เทียบผลกับสิ่งที่ตั้งไว้ได้"
  solution: "เป้าหมายที่ชัดเจนบอกว่างานเสร็จเมื่อไรและผลควรเป็นอย่างไร ทำให้ประเมินผลและปรับปรุงได้ตรงจุด"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.work-process.p003
  topics:
  - technology.living.work-process
  difficulty: 2
  type: match
  stem: "จับคู่เครื่องมือการจัดการกับหน้าที่ของแต่ละเครื่องมือ"
  pairs:
  - left: "รายการตรวจ (checklist)"
    right: "ช่วยให้ไม่ตกหล่นงานย่อย"
  - left: "ตารางงาน"
    right: "บอกว่าใครทำอะไรและเมื่อไร"
  - left: "เป้าหมายของงาน"
    right: "บอกว่าจะถือว่างานสำเร็จเมื่อใด"
  - left: "บันทึกปัญหาที่พบระหว่างทำ"
    right: "เป็นข้อมูลสำหรับปรับปรุงรอบถัดไป"
  hints:
  - "แต่ละเครื่องมือตอบคำถามต่างกัน"
  - "ลองถามว่าเครื่องมือนั้นช่วยตอบเรื่องอะไร เช่น ใคร เมื่อไร หรือผลเป็นอย่างไร"
  - "การบันทึกปัญหาเกิดขึ้นในขั้นไหนของกระบวนการ"
  solution: "รายการตรวจกันงานตกหล่น ตารางงานกำหนดคนและเวลา เป้าหมายบอกเกณฑ์ความสำเร็จ และบันทึกปัญหาเป็นข้อมูลสำหรับการปรับปรุง"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.work-process.p004
  topics:
  - technology.living.work-process
  difficulty: 2
  type: mcq
  stem: "ต้มน้ำแกงต้องรอให้เดือดประมาณ 10 นาที และต้องล้างผักอีก 8 นาที ข้อใดจัดลำดับได้เสร็จเร็วที่สุดเมื่อทำคนเดียว"
  choices:
  - id: a
    text: "ล้างผักให้เสร็จก่อน แล้วจึงตั้งหม้อรอเดือด"
    feedback: "ทำให้เวลาต่อกันเป็นผลรวม 8 + 10 = 18 นาที ช้ากว่าที่จำเป็น"
  - id: b
    text: "ตั้งหม้อก่อน แล้วล้างผักระหว่างรอน้ำเดือด"
    correct: true
  - id: c
    text: "ยืนดูหม้อจนเดือดแล้วค่อยล้างผัก"
    feedback: "การยืนรอโดยไม่ทำอย่างอื่นทำให้เวลาต่อกันเป็นผลรวม"
  - id: d
    text: "ล้างผักครึ่งหนึ่ง แล้วตั้งหม้อ และล้างต่อจนเสร็จ"
    feedback: "หม้อเริ่มช้ากว่าที่ควร จึงต้องรอนานกว่า 10 นาที"
  hints:
  - "ช่วงที่หม้อกำลังเดือด คนทำไม่จำเป็นต้องยืนดู"
  - "งานที่ไม่ต้องรอผลของอีกงานสามารถทำระหว่างที่ตั้งเวลาไว้ได้"
  - "ลองคำนวณเวลารวมของแต่ละตัวเลือก"
  solution: "ตั้งหม้อก่อนเพื่อให้เริ่มเดือดทันที แล้วล้างผัก 8 นาทีระหว่างรอ 10 นาที เสร็จทั้งหมดใน 10 นาที ส่วนตัวเลือกอื่นทำให้มีช่วงที่ไม่ได้ทำงานหรือหม้อเริ่มช้า"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.work-process.p005
  topics:
  - technology.living.work-process
  difficulty: 2
  type: numeric
  stem: "ห้องเรียนต้องกวาด 15 นาที แล้วถูพื้น 20 นาที (ถูพื้นต้องทำหลังกวาดเสร็จ) และเช็ดกระดาน 5 นาที (ทำเมื่อไรก็ได้) ถ้ามีนักเรียนสองคน คนหนึ่งกวาดแล้วถูพื้น อีกคนเช็ดกระดาน ใช้เวลาอย่างน้อยกี่นาทีจึงเสร็จ (ตอบเป็นนาที)"
  answer:
    value: 35
    tolerance: 0
    unit: "นาที"
  misconceptions:
  - match: 40
    feedback: "ตอบ 40 คือทำทุกงานต่อกันทีละงาน โดยไม่ให้อีกคนช่วยทำพร้อมกัน"
  - match: 20
    feedback: "ตอบ 20 คิดว่ากวาดกับถูพื้นทำพร้อมกันได้ ทั้งที่ถูพื้นต้องรอให้กวาดเสร็จก่อน"
  hints:
  - "ดูก่อนว่างานไหนต้องรอให้งานอื่นเสร็จก่อน"
  - "นักเรียนคนที่สองว่างตั้งแต่ต้น และเช็ดกระดานไม่ต้องรองานอื่น"
  - "เวลาทั้งหมดของคนแรกคือกวาดแล้วถูพื้นต่อกัน"
  solution: "คนแรกใช้เวลา 15 + 20 = 35 นาที (กวาดก่อนแล้วจึงถูพื้น) ส่วนคนที่สองใช้ 5 นาทีและทำพร้อมกันได้ เวลาที่ใช้จริงจึงเป็น 35 นาที (ตรวจด้วย python3: max(15+20, 5) = 35)"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.work-process.p006
  topics:
  - technology.living.work-process
  difficulty: 2
  type: text
  stem: "เครื่องมือที่ใช้จดลำดับว่าใครทำอะไรและเมื่อไร เรียกว่าอะไร (ตอบเป็นคำ 2 คำ)"
  accepted:
  - "ตารางงาน"
  misconceptions:
  - match: "รายการของ"
    feedback: "รายการของช่วยให้มีของครบ แต่ไม่ได้บอกลำดับเวลาและคนที่รับผิดชอบ"
  hints:
  - "เครื่องมือนี้ใช้จัดการเรื่องเวลาเป็นหลัก"
  - "ลองนึกถึงเอกสารที่มีช่องบอกชื่อคน งาน และเวลาเรียงกัน"
  solution: "ตารางงานระบุงาน คนรับผิดชอบ และเวลาที่ต้องเสร็จ ทำให้ทุกคนรู้หน้าที่ของตนเองและไม่ทำงานซ้ำกัน"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.work-process.p007
  topics:
  - technology.living.work-process
  difficulty: 2
  type: order
  stem: "เรียงลำดับวิธีทำข้าวผัดหนึ่งจาน ให้งานไม่สะดุดและอาหารไม่ไหม้"
  items:
  - "เตรียมวัตถุดิบให้ครบก่อนเริ่มทำ"
  - "เจียวกระเทียมในน้ำมันจนหอม"
  - "ใส่ไข่คนให้ร่วน แล้วใส่ข้าวผัดให้ทั่ว"
  - "ปรุงรสด้วยซีอิ๊วและน้ำปลาตามชอบ"
  - "ตักใส่จานแล้วเสิร์ฟทันที"
  hints:
  - "ก่อนตั้งไฟต้องเตรียมทุกอย่างให้พร้อม"
  - "กระเทียมต้องเจียวก่อนใส่วัตถุดิบอื่น"
  - "การปรุงรสมักทำหลังข้าวและไข่เข้ากันดีแล้ว"
  solution: "เตรียมวัตถุดิบให้ครบ แล้วเจียวกระเทียม ใส่ไข่และข้าว ปรุงรส และตักเสิร์ฟ การเตรียมให้ครบก่อนช่วยให้ไม่ต้องหยุดกลางคันจนอาหารไหม้"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.work-process.p008
  topics:
  - technology.living.work-process
  difficulty: 3
  type: mcq
  stem: "ร้านข้าวกล่องใช้เวลาเตรียมวันละ 90 นาที ขั้นที่นานที่สุดคือรอข้าวสุก 40 นาที ซึ่งไม่ต้องมีคนดูแล ข้อใดคือแนวทางปรับปรุงที่เหมาะสมที่สุด"
  choices:
  - id: a
    text: "จ้างคนเพิ่มให้ทำทุกขั้นพร้อมกัน"
    feedback: "การเพิ่มคนโดยไม่ดูว่างานรอกันอยู่ตรงไหน ไม่ได้แก้จุดที่เสียเวลาจริง"
  - id: b
    text: "ใช้เวลาระหว่างรอข้าวสุกทำงานอื่น เช่น ล้างผักและหั่นวัตถุดิบ"
    correct: true
  - id: c
    text: "เลิกทำข้าวกล่องทั้งหมดเพื่อลดงานให้น้อยลง"
    feedback: "การเลิกทำงานไม่ใช่การปรับปรุงกระบวนการ"
  - id: d
    text: "ตัดขั้นหั่นผักออกโดยไม่ตรวจว่าจำเป็นหรือไม่"
    feedback: "การตัดขั้นตอนโดยไม่ตรวจอาจทำให้คุณภาพลดลงหรือเกิดปัญหาภายหลัง"
  hints:
  - "ดูให้ออกว่าช่วงไหนของกระบวนการไม่ต้องใช้คน"
  - "ช่วงว่างระหว่างรอ สามารถใช้ทำงานอื่นที่ไม่ขึ้นกับข้าวได้"
  - "ปรับลำดับงานให้มีงานอื่นทำในช่วงที่ข้าวกำลังสุก"
  solution: "ปัญหาคือการรอโดยไม่ได้ทำอะไร ทางแก้ที่ตรงจุดคือใช้เวลารอทำงานอื่นที่ไม่ขึ้นกับข้าว เช่น ล้างและหั่นผัก การเพิ่มคนหรือเลิกงานไม่ได้แก้ที่ต้นเหตุ"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.work-process.p009
  topics:
  - technology.living.work-process
  difficulty: 3
  type: numeric
  stem: "ต้องหุงข้าว 45 นาที (ระหว่างหุงไม่ต้องดูแล) หั่นผัก 15 นาที และผัดกับข้าว 10 นาที โดยการผัดกับข้าวต้องรอให้ข้าวสุกและหั่นผักเสร็จก่อน ถ้าทำคนเดียวและจัดลำดับให้เสร็จเร็วที่สุด ใช้เวลาทั้งหมดกี่นาที (ตอบเป็นนาที)"
  answer:
    value: 55
    tolerance: 0
    unit: "นาที"
  misconceptions:
  - match: 70
    feedback: "ตอบ 70 คือทำทีละงานตามลำดับ โดยไม่ใช้ช่วงที่ข้าวหุงอยู่ทำงานอื่น"
  - match: 25
    feedback: "ตอบ 25 เกิดจากลืมว่าการผัดกับข้าวต้องรอข้าวสุก จึงรวมเฉพาะการหั่นผักกับการผัด"
  hints:
  - "ช่วงที่หุงข้าว คนทำอย่างอื่นได้"
  - "การผัดกับข้าวเริ่มได้เมื่อข้าวสุกแล้ว"
  - "ลองดูว่าเวลาหุงข้าวกับเวลาหั่นผักทับกันได้หรือไม่"
  solution: "หุงข้าวก่อนแล้วหั่นผักระหว่างนั้น (ใช้เวลา 45 นาที) จากนั้นผัดกับข้าวอีก 10 นาที รวม 45 + 10 = 55 นาที (ตรวจด้วย python3: max(45, 15) + 10 = 55) ถ้าทำทีละงานจะได้ 45 + 15 + 10 = 70 นาที"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.work-process.p010
  topics:
  - technology.living.work-process
  difficulty: 3
  type: mcq
  stem: "หลังอบขนมแล้วพบว่าขนมสุกไม่ทั่ว ข้อใดคือการประเมินผลและปรับปรุงที่เหมาะสมที่สุด"
  choices:
  - id: a
    text: "เพิ่มเวลาอบอย่างเดียวโดยไม่ดูสาเหตุ"
    feedback: "ถ้าไม่รู้สาเหตุ การเพิ่มเวลาอาจทำให้ด้านนอกไหม้ก่อนที่ด้านในจะสุก"
  - id: b
    text: "หาสาเหตุ เช่น ไฟไม่สม่ำเสมอหรือวางถาดไม่ตรงกลาง แล้วปรับทีละอย่างและทดสอบซ้ำ"
    correct: true
  - id: c
    text: "ยอมรับผลเพราะทำมาแล้ว ไม่ต้องแก้ไข"
    feedback: "การไม่แก้ไขทำให้ข้อผิดพลาดเกิดซ้ำในรอบถัดไป"
  - id: d
    text: "เปลี่ยนสูตรทั้งหมดโดยไม่ทดสอบ"
    feedback: "การเปลี่ยนหลายอย่างพร้อมกันโดยไม่ทดสอบ ทำให้ไม่รู้ว่าอะไรช่วยได้จริง"
  hints:
  - "ก่อนแก้ต้องรู้ก่อนว่าปัญหาเกิดจากอะไร"
  - "ปรับทีละอย่างแล้วดูผล จะรู้ว่าอะไรได้ผล"
  - "เมื่อพบปัญหาในการประเมิน ให้ย้อนกลับไปดูแผนและวิธีลงมือทำ"
  solution: "การประเมินผลต้องหาสาเหตุก่อน แล้วปรับทีละอย่างและทดสอบซ้ำ เพื่อรู้ว่าการแก้ไขใดได้ผล ไม่ควรเพิ่มเวลาหรือเปลี่ยนหลายอย่างพร้อมกันโดยยังไม่รู้สาเหตุ"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.work-process.p011
  topics:
  - technology.living.work-process
  difficulty: 2
  type: text
