<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="sans-serif" font-size="14">
<title>หลักการดุลรอบขอบเขตระบบ</title>
<rect x="0" y="0" width="640" height="330" fill="#ffffff"/>
<rect x="200.0" y="70.0" width="240.0" height="170.0" rx="10" fill="#f4f8fd" stroke="#1f5fa8" stroke-width="2.5"/>
<rect x="180" y="50" width="280" height="210" rx="14" fill="none" stroke="#1f5fa8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="320.0" y="40.0" text-anchor="middle" fill="#1f5fa8" font-size="14">ขอบเขตระบบ (เส้นประ)</text>
<text x="320.0" y="140.0" text-anchor="middle" fill="#15211e" font-size="18" font-weight="bold">ระบบ</text>
<text x="320.0" y="166.0" text-anchor="middle" fill="#1e7a3c" font-size="13">เกิด (ปฏิกิริยา)</text>
<text x="320.0" y="186.0" text-anchor="middle" fill="#c0392b" font-size="13">ใช้ไป (ปฏิกิริยา)</text>
<text x="320.0" y="210.0" text-anchor="middle" fill="#7b3fa0" font-size="13">สะสมภายใน</text>
<line x1="40.0" y1="120.0" x2="183.9" y2="120.0" stroke="#15211e" stroke-width="3"/>
<polygon points="195.0,120.0 182.0,114.2 182.0,125.8" fill="#15211e" stroke="#15211e" stroke-width="1" stroke-linejoin="round"/>
<text x="110.0" y="108.0" text-anchor="middle" fill="#15211e" font-size="15" font-weight="bold">เข้า</text>
<line x1="40.0" y1="190.0" x2="183.9" y2="190.0" stroke="#15211e" stroke-width="3"/>
<polygon points="195.0,190.0 182.0,184.2 182.0,195.8" fill="#15211e" stroke="#15211e" stroke-width="1" stroke-linejoin="round"/>
<text x="110.0" y="178.0" text-anchor="middle" fill="#15211e" font-size="15" font-weight="bold">เข้า</text>
<line x1="445.0" y1="155.0" x2="589.0" y2="155.0" stroke="#15211e" stroke-width="3"/>
<polygon points="600.0,155.0 587.0,149.2 587.0,160.8" fill="#15211e" stroke="#15211e" stroke-width="1" stroke-linejoin="round"/>
<text x="520.0" y="143.0" text-anchor="middle" fill="#15211e" font-size="15" font-weight="bold">ออก</text>
<text x="320.0" y="300.0" text-anchor="middle" fill="#15211e" font-size="17" font-weight="bold">เข้า − ออก + เกิด − ใช้ไป = สะสม</text>
<text x="320.0" y="322.0" text-anchor="middle" fill="#777" font-size="13">สถานะคงตัว: สะสม = 0   ไม่มีปฏิกิริยา: เกิด = ใช้ไป = 0</text>
</svg>
