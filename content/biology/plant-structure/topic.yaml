id: biology.plants.plant-structure
subject: biology
title: { th: เนื้อเยื่อและโครงสร้างของพืช, en: "Plant tissues and internal structure" }
summary: ชนิดของเนื้อเยื่อเจริญและเนื้อเยื่อถาวร แผนผังสรุปเนื้อเยื่อพืช และโครงสร้างภายในของราก ลำต้น และใบพืชใบเลี้ยงเดี่ยวและใบเลี้ยงคู่จากภาคตัดขวาง
difficulty: 4.5
minutes: 40
prerequisites: [biology.cells.cell-structure]
encompasses:
  - { id: biology.cells.cell-structure, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: แผนผังสรุปชนิดของเนื้อเยื่อพืช
    src: tissue-chart.svg
    alt: "แผนผังต้นไม้: เนื้อเยื่อพืชแบ่งเป็นเนื้อเยื่อเจริญ (แบ่งเซลล์ได้ตลอด) และเนื้อเยื่อถาวร (ทำหน้าที่เฉพาะ ไม่แบ่งเซลล์) เนื้อเยื่อเจริญมี 3 ตำแหน่ง: ปลายยอดหรือปลายราก (ยืดยาว) ด้านข้าง (แคมเบียม เพิ่มขนาด) และเหนือข้อ (ข้อของหญ้า ไผ่) เนื้อเยื่อถาวรมี 3 กลุ่ม: เนื้อเยื่อผิว (เอพิเดอร์มิส เพริเดิร์มหรือคอร์ก) เนื้อเยื่อพื้น (พาเรงคิมา คอลเลงคิมา สเกลอเรงคิมา) และเนื้อเยื่อลำเลียง (ไซเลม ลำเลียงน้ำ โฟลเอ็ม ลำเลียงอาหาร) ใต้แผนผังเขียนว่า เนื้อเยื่อเชิงเดี่ยวคือพาเรงคิมา คอลเลงคิมา สเกลอเรงคิมา ส่วนเนื้อเยื่อเชิงซ้อนคือไซเลม โฟลเอ็ม เพริเดิร์ม"
    caption: "เขียนแผนผังเองโดยเริ่มจากคำถามว่า เซลล์ยังแบ่งตัวได้ไหม แล้วแยกเนื้อเยื่อถาวรตามหน้าที่ (วาดโดยทีมคลังรู้)"
  - { type: check, problem: biology.plants.plant-structure.p002, prompt: "ทบทวนก่อนดูภาคตัดขวาง" }
  - type: figure
    title: ภาคตัดขวางของราก
    src: root-sections.svg
    alt: "ซ้ายคือรากพืชใบเลี้ยงคู่ (ถั่ว) วงกลมที่มีขนรากยื่นออกด้านนอก จากนอกเข้าใน: เอพิเดอร์มิส คอร์เทกซ์ที่มีเซลล์กลมจำนวนมาก เอนโดเดอร์มิสเป็นวงสีน้ำตาลเข้ม เพริไซเคิลอยู่ถัดเข้าไป ตรงกลางเป็นไซเลมสีแดงรูปดาว 4 แฉก และโฟลเอ็มสีฟ้า 4 กลุ่มอยู่ระหว่างแฉก ไม่มีพิธ ขวาคือรากพืชใบเลี้ยงเดี่ยว (ข้าวโพด) มีเอพิเดอร์มิส คอร์เทกซ์ และเอนโดเดอร์มิสเหมือนกัน แต่สตีลกว้างกว่า ไซเลมสีแดง 10 กลุ่มเรียงเป็นวงสลับกับโฟลเอ็มสีฟ้า และมีพิธเป็นเซลล์จาง ๆ อยู่ตรงกลาง"
    caption: "รากใบเลี้ยงคู่มีไซเลมเป็นแฉกตรงกลาง รากใบเลี้ยงเดี่ยวมีไซเลมสลับโฟลเอ็มเป็นวงและมีพิธ (วาดโดยทีมคลังรู้)"
  - type: figure
    title: ภาคตัดขวางของลำต้น
    src: stem-sections.svg
    alt: "ซ้ายคือลำต้นพืชใบเลี้ยงคู่ (ทานตะวัน) มีเอพิเดอร์มิสด้านนอก คอร์เทกซ์เป็นแถบเซลล์แคบ ๆ มัดท่อลำเลียง 8 มัดเรียงเป็นวง แต่ละมัดมีโฟลเอ็มสีฟ้าด้านนอก แถบวาสคิวลาร์แคมเบียมสีส้มคั่นกลาง และไซเลมสีแดงด้านใน มีเส้นประสีส้มเชื่อมแคมเบียมระหว่างมัด และพิธเป็นเซลล์ขนาดใหญ่ตรงกลาง ขวาคือลำต้นพืชใบเลี้ยงเดี่ยว (ข้าวโพด) มีเอพิเดอร์มิสด้านนอก และมัดท่อลำเลียงรูปไข่ราว 30 มัดกระจายทั่วเนื้อเยื่อพื้น แต่ละมัดมีโฟลเอ็มสีฟ้าด้านบนและไซเลมสีแดงสองท่อด้านล่าง ไม่มีแคมเบียม"
    caption: "ลำต้นใบเลี้ยงคู่มีมัดท่อลำเลียงเรียงเป็นวงและมีแคมเบียม ลำต้นใบเลี้ยงเดี่ยวมีมัดท่อลำเลียงกระจาย (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ระบุภาคตัดขวางที่ไม่รู้ชื่อ
    problem: "นักเรียนส่องภาคตัดขวางชิ้นหนึ่ง เห็นมัดท่อลำเลียงหลายมัดเรียงเป็นวง แต่ละมัดมีโฟลเอ็มด้านนอก ไซเลมด้านใน และมีเซลล์แบนบางคั่นกลาง ตรงกลางเป็นเซลล์พาเรงคิมาขนาดใหญ่ ชิ้นนี้คือส่วนใดของพืชกลุ่มใด"
    steps:
      - text: "ดูการเรียงของไซเลมกับโฟลเอ็ม: อยู่ในมัดเดียวกัน โฟลเอ็มด้านนอก ไซเลมด้านใน จึงเป็นลำต้น ไม่ใช่ราก"
        why: "ในรากไซเลมกับโฟลเอ็มอยู่สลับกันคนละรัศมี ไม่ได้อยู่ในมัดเดียวกัน"
      - text: "ดูการจัดเรียงของมัด: เรียงเป็นวง แยกคอร์เทกซ์กับพิธได้ชัด เป็นลักษณะของพืชใบเลี้ยงคู่"
      - text: "ยืนยันด้วยเซลล์แบนบางระหว่างไซเลมกับโฟลเอ็ม ซึ่งคือวาสคิวลาร์แคมเบียม พบในพืชใบเลี้ยงคู่"
    answer: "ลำต้นพืชใบเลี้ยงคู่"
  - type: figure
    title: ภาคตัดขวางของใบ
    src: leaf-section.svg
    alt: "ภาคตัดขวางใบพืชใบเลี้ยงคู่เรียงจากบนลงล่าง: คิวทิเคิลเป็นแถบเหลืองบาง เอพิเดอร์มิสด้านบนเป็นเซลล์สี่เหลี่ยมใสแถวเดียว แพลิเซดมีโซฟิลล์เป็นเซลล์ยาวเรียงชิดกันตั้งฉากกับผิวใบ มีคลอโรพลาสต์สีเขียวจำนวนมาก สปองจีมีโซฟิลล์เป็นเซลล์กลมรีเรียงห่าง ๆ มีช่องอากาศมาก ตรงกลางมีมัดท่อลำเลียงหรือเส้นใบเป็นวงกลม ไซเลมสีแดงอยู่ครึ่งบน โฟลเอ็มสีฟ้าอยู่ครึ่งล่าง เอพิเดอร์มิสด้านล่างมีช่องที่เป็นปากใบ ล้อมด้วยเซลล์คุมสองเซลล์ เหนือปากใบเป็นช่องอากาศ และมีคิวทิเคิลบางใต้เอพิเดอร์มิสด้านล่าง"
    caption: "แพลิเซดอยู่ด้านที่ได้แสง สปองจีมีช่องอากาศต่อกับปากใบด้านล่าง ไซเลมของเส้นใบอยู่ด้านบน โฟลเอ็มอยู่ด้านล่าง (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: หาอายุต้นไม้จากความกว้างของวงปี
    problem: "ต้นสักต้นหนึ่งมีรัศมีเนื้อไม้ 14 เซนติเมตร ถ้าวงปีแต่ละวงกว้างเฉลี่ย 0.7 เซนติเมตร ต้นสักนี้มีอายุประมาณกี่ปี"
    steps:
      - text: "วงปี 1 วง (แถบสีจางกับแถบสีเข้มคู่หนึ่ง) คือเนื้อไม้ที่สร้างใน 1 ปี"
        why: "แคมเบียมสร้างเซลล์ใหญ่สีจางในฤดูฝน และเซลล์เล็กสีเข้มในฤดูแล้ง"
      - text: "จำนวนวงปี $= \\frac{\\text{รัศมี}}{\\text{ความกว้างต่อวง}} = \\frac{14}{0.7} = 20$ วง"
      - text: "จึงมีอายุประมาณ 20 ปี (ไม่นับช่วงต้นกล้าก่อนเกิดวงปีแรก)"
    answer: "ประมาณ 20 ปี"
  - { type: check, problem: biology.plants.plant-structure.p005, prompt: "ใช้ภาพภาคตัดขวางของใบช่วยเรียง" }
glossary:
  - { term: เนื้อเยื่อเจริญ, definition: "เนื้อเยื่อที่เซลล์แบ่งตัวได้ตลอด พบที่ปลายยอด ปลายราก ด้านข้าง (แคมเบียม) และเหนือข้อ" }
  - { term: ไซเลม, definition: "เนื้อเยื่อลำเลียงน้ำและธาตุอาหารจากรากขึ้นไป มีเทรคีดและเวสเซลเมมเบอร์ที่ตายแล้ว" }
  - { term: โฟลเอ็ม, definition: "เนื้อเยื่อลำเลียงอาหาร มีซีฟทิวบ์เมมเบอร์ที่มีชีวิตแต่ไม่มีนิวเคลียส และเซลล์คอมพาเนียน" }
  - { term: เอนโดเดอร์มิส, definition: "เซลล์ชั้นในสุดของคอร์เทกซ์ในราก ผนังมีแถบแคสพาเรียนควบคุมการผ่านของน้ำและแร่ธาตุ" }
  - { term: วาสคิวลาร์แคมเบียม, definition: "เนื้อเยื่อเจริญด้านข้างระหว่างไซเลมกับโฟลเอ็ม สร้างไซเลมและโฟลเอ็มเพิ่ม ทำให้ลำต้นขยายขนาดและเกิดวงปี" }
  - { term: มีโซฟิลล์, definition: "เนื้อเยื่อสังเคราะห์ด้วยแสงในใบ แบ่งเป็นแพลิเซดมีโซฟิลล์และสปองจีมีโซฟิลล์" }
flashcards:
  - { front: "เนื้อเยื่อพื้น 3 ชนิด", back: "พาเรงคิมา (ผนังบาง สะสมอาหาร) คอลเลงคิมา (ผนังหนาที่มุม) สเกลอเรงคิมา (ผนังหนามาก มีลิกนิน)" }
  - { front: "รากใบเลี้ยงคู่ต่างจากรากใบเลี้ยงเดี่ยวอย่างไร", back: "ใบเลี้ยงคู่: ไซเลมเป็นแฉก ไม่มีพิธ / ใบเลี้ยงเดี่ยว: ไซเลมสลับโฟลเอ็มเป็นวง มีพิธ" }
  - { front: "ลำต้นใบเลี้ยงคู่ต่างจากลำต้นใบเลี้ยงเดี่ยวอย่างไร", back: "ใบเลี้ยงคู่: มัดท่อลำเลียงเรียงเป็นวง มีแคมเบียม / ใบเลี้ยงเดี่ยว: มัดท่อลำเลียงกระจาย ไม่มีแคมเบียม" }
  - { front: "ชั้นของใบจากบนลงล่าง", back: "คิวทิเคิล → เอพิเดอร์มิสบน → แพลิเซด → สปองจี → เอพิเดอร์มิสล่างที่มีปากใบ" }
  - { front: "วงปี 1 วงคืออะไร", back: "แถบเนื้อไม้สีจาง (ฤดูฝน) กับแถบสีเข้ม (ฤดูแล้ง) คู่หนึ่ง ที่แคมเบียมสร้างใน 1 ปี" }
