id: biology.plants.hormones-responses
subject: biology
title: { th: ฮอร์โมนพืชและการตอบสนองของพืช, en: "Plant hormones and plant responses" }
summary: การค้นพบออกซิน บทบาทของออกซิน ไซโทไคนิน จิบเบอเรลลิน เอทิลีน และกรดแอบไซซิก สารควบคุมการเจริญเติบโตที่ใช้ทางการเกษตร และการตอบสนองของพืชต่อแสง แรงโน้มถ่วง และการสัมผัส
difficulty: 5
minutes: 45
prerequisites: [biology.plants.reproduction-growth, biology.plants.plant-transport]
encompasses:
  - { id: biology.plants.reproduction-growth, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: การทดลองที่นำไปสู่การค้นพบออกซิน
    src: coleoptile-experiments.svg
    alt: "การทดลองกับโคลีออปไทล์ 5 ชุด แสงส่องจากด้านซ้ายในชุด 1 ถึง 4 ชุด 1 ครอบปลายยอดด้วยหมวกทึบแสง ผลไม่โค้ง ชุด 2 ครอบส่วนล่าง ปลายยอดรับแสงได้ ผลโค้งเข้าหาแสง ชุด 3 สอดแผ่นไมกาใต้ปลายยอดด้านมืด ผลไม่โค้ง ชุด 4 สอดแผ่นไมกาใต้ปลายยอดด้านสว่าง ผลโค้งเข้าหาแสง ชุด 5 ในที่มืด ตัดยอดแล้ววางวุ้นที่มีออกซินเยื้องทางขวา ผลโค้งไปทางซ้าย คือโค้งออกจากด้านที่วางวุ้น"
    caption: "ปลายยอดรับแสงและสร้างสารที่เคลื่อนลงมาทางด้านมืด สารนี้คือออกซิน (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ทำนายผลจากการทดลองกับโคลีออปไทล์
    problem: "ตัดปลายยอดโคลีออปไทล์แล้ววางกลับบนต้นเดิมโดยมีแผ่นไมกากั้นระหว่างปลายยอดกับต้นทั้งแผ่น แล้วให้แสงจากด้านซ้าย ต้นกล้าจะโค้งหรือไม่"
    steps:
      - text: "ปลายยอดยังรับแสงและสร้างออกซินได้"
      - text: "แผ่นไมกากั้นทั้งแผ่น ออกซินจึงเคลื่อนลงไปยังเซลล์ด้านล่างไม่ได้ทั้งสองด้าน"
        why: "สารผ่านแผ่นไมกาไม่ได้ ต่างจากวุ้นที่สารซึมผ่านได้"
      - text: "เซลล์ด้านล่างไม่ได้รับออกซินเพิ่มทั้งสองด้าน จึงไม่ยืดต่างกัน"
    answer: "ต้นกล้าไม่โค้งเข้าหาแสง"
  - { type: check, problem: biology.plants.hormones-responses.p005, prompt: "ด้านที่ยืดมากกว่าอยู่ด้านนอกของส่วนโค้ง" }
  - type: figure
    title: มุมโค้งกับความเข้มข้นของออกซิน
    src: went-curve.svg
    alt: "กราฟเส้นมุมโค้งของโคลีออปไทล์ (องศา) กับความเข้มข้นของออกซินในวุ้น (mg/L) ที่ 0, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40 mg/L มุมโค้ง 0, 5, 10, 15, 20, 17, 12, 7, 3 องศา มุมเพิ่มเป็นเส้นตรงจนสูงสุดที่ 0.20 mg/L แล้วลดลง เป็นข้อมูลสมมติ"
    caption: "ข้อมูลสมมติ ความเข้มข้นที่สูงเกินไปกลับยับยั้งการยืดของเซลล์ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: อ่านความเข้มข้นจากกราฟเวนต์
    problem: "จากกราฟ วุ้นที่มีออกซินความเข้มข้นต่ำ (ไม่เกิน 0.20 mg/L) ทำให้โคลีออปไทล์โค้ง 18 องศา วุ้นนี้มีออกซินเข้มข้นเท่าใด"
    steps:
      - text: "ในช่วง 0 ถึง 0.20 mg/L มุมโค้งเพิ่ม 5 องศาทุก 0.05 mg/L หรือ 100 องศาต่อ 1 mg/L"
      - text: "ความเข้มข้น $= 18 \\div 100 = 0.18$ mg/L"
        why: "ใช้ได้เฉพาะช่วงที่กราฟเป็นเส้นตรง ช่วงความเข้มข้นสูงมุมโค้งลดลง ค่ามุมเดียวกันจึงอาจมาจากสองความเข้มข้น"
    answer: "0.18 mg/L"
  - { type: check, problem: biology.plants.hormones-responses.p011, prompt: "รากกับลำต้นไวต่อออกซินเท่ากันหรือไม่" }
glossary:
  - { term: ฮอร์โมนพืช, definition: "สารที่พืชสร้างในปริมาณน้อย ควบคุมการเจริญเติบโตและการตอบสนอง" }
  - { term: ออกซิน, definition: "ฮอร์โมนที่กระตุ้นการยืดตัวของเซลล์ การเกิดราก และทำให้เกิดยอดเด่น" }
  - { term: ไซโทไคนิน, definition: "ฮอร์โมนที่กระตุ้นการแบ่งเซลล์และการเกิดยอด ชะลอการเสื่อมของใบ" }
  - { term: จิบเบอเรลลิน, definition: "ฮอร์โมนที่กระตุ้นการยืดของลำต้น การงอกของเมล็ด และการขยายขนาดผล" }
  - { term: เอทิลีน, definition: "ฮอร์โมนที่เป็นแก๊ส เร่งการสุกและการร่วงของใบและผล" }
  - { term: กรดแอบไซซิก, definition: "ฮอร์โมนที่ทำให้ปากใบปิดเมื่อขาดน้ำ และทำให้ตาและเมล็ดพักตัว" }
  - { term: การเบน, definition: "การเจริญเติบโตที่มีทิศทางสัมพันธ์กับทิศของสิ่งเร้า เช่น การเบนตามแสง" }
  - { term: ยอดเด่น, definition: "การที่ออกซินจากตายอดยับยั้งการเจริญของตาข้าง" }
flashcards:
  - { front: "แสงจากด้านเดียวทำให้ออกซินเป็นอย่างไร", back: "เคลื่อนไปด้านมืด เซลล์ด้านมืดยืดมากกว่า ยอดโค้งเข้าหาแสง" }
  - { front: "ทำไมรากโค้งลงเมื่อวางนอน", back: "ออกซินสะสมด้านล่าง ยับยั้งการยืดของเซลล์ราก ด้านบนยืดมากกว่า" }
  - { front: "สัดส่วนฮอร์โมนในการเพาะเลี้ยงเนื้อเยื่อ", back: "ไซโทไคนินมากกว่า เกิดยอด ออกซินมากกว่า เกิดราก" }
  - { front: "สารสังเคราะห์ที่ใช้ในการเกษตร", back: "IBA NAA เร่งราก 2,4-D กำจัดวัชพืชใบกว้าง เอทีฟอนเร่งดอกสับปะรด พาโคลบิวทราโซลยับยั้งจิบเบอเรลลิน" }
  - { front: "ไมยราบหุบใบเป็นการเบนหรือไม่", back: "ไม่ใช่ เป็นการเปลี่ยนแรงดันเต่ง เกิดเร็วและกลับคืนได้" }
