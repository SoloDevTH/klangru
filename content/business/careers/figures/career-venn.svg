<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" width="620" height="430" font-family="sans-serif" font-size="14">
  <title>แผนภาพเวนน์สามวง ความสนใจ ความถนัด และความต้องการของตลาด</title>
  <rect x="0" y="0" width="620" height="430" fill="#ffffff"/>
  <circle cx="240" cy="165" r="125" fill="#dbeafe" fill-opacity="0.65" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="380" cy="165" r="125" fill="#fef3c7" fill-opacity="0.65" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="310" cy="280" r="125" fill="#dcfce7" fill-opacity="0.65" stroke="#1f2937" stroke-width="1.5"/>
  <text x="180.0" y="110.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">ความสนใจ</text>
  <text x="180.0" y="128.0" text-anchor="middle" fill="#1f2937" font-size="12">สิ่งที่ชอบทำ</text>
  <text x="440.0" y="110.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">ความถนัด</text>
  <text x="440.0" y="128.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">และความรู้</text>
  <text x="310.0" y="355.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">ความต้องการของตลาด</text>
  <text x="310.0" y="373.0" text-anchor="middle" fill="#1f2937" font-size="12">งานที่มีคนจ้างหรือมีคนซื้อ</text>
  <text x="310.0" y="208.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">อาชีพที่</text>
  <text x="310.0" y="226.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">เหมาะกับเรา</text>
</svg>
