<polygon points="165.0,190.0 156.0,185.9 156.0,194.1" fill="#1f5fa8" stroke="#1f5fa8" stroke-width="1" stroke-linejoin="round"/>
<line x1="110.0" y1="230.0" x2="157.3" y2="230.0" stroke="#1f5fa8" stroke-width="2"/>
<polygon points="165.0,230.0 156.0,225.9 156.0,234.1" fill="#1f5fa8" stroke="#1f5fa8" stroke-width="1" stroke-linejoin="round"/>
<text x="80.0" y="192.0" text-anchor="middle" fill="#1f5fa8" font-size="12">รับความร้อน</text>
<text x="80.0" y="210.0" text-anchor="middle" fill="#1f5fa8" font-size="12">จากอาหาร</text>
<line x1="555.0" y1="150.0" x2="602.4" y2="150.0" stroke="#c0392b" stroke-width="2"/>
<polygon points="610.0,150.0 601.0,145.9 601.0,154.1" fill="#c0392b" stroke="#c0392b" stroke-width="1" stroke-linejoin="round"/>
<line x1="555.0" y1="190.0" x2="602.4" y2="190.0" stroke="#c0392b" stroke-width="2"/>
<polygon points="610.0,190.0 601.0,185.9 601.0,194.1" fill="#c0392b" stroke="#c0392b" stroke-width="1" stroke-linejoin="round"/>
<line x1="555.0" y1="230.0" x2="602.4" y2="230.0" stroke="#c0392b" stroke-width="2"/>
<polygon points="610.0,230.0 601.0,225.9 601.0,234.1" fill="#c0392b" stroke="#c0392b" stroke-width="1" stroke-linejoin="round"/>
<text x="645.0" y="192.0" text-anchor="middle" fill="#c0392b" font-size="12">คายความ</text>
<text x="645.0" y="210.0" text-anchor="middle" fill="#c0392b" font-size="12">ร้อนออก</text>
<text x="360.0" y="360.0" text-anchor="middle" fill="#15211e" font-size="13">ความร้อนถูก "สูบ" จากที่เย็นไปที่ร้อนได้ เพราะคอมเพรสเซอร์ใช้ไฟฟ้าทำงาน</text>
</svg>
