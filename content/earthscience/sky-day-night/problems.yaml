    ai_assisted: true

  - id: earthscience.astronomy.sky-day-night.p015
    topics: [earthscience.astronomy.sky-day-night]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นประโยชน์ของดวงอาทิตย์ต่อสิ่งมีชีวิต (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ต้นข้าวในนาใช้แสงอาทิตย์สร้างอาหาร", correct: true }
      - { id: b, text: "ให้ความอบอุ่นแก่โลก สิ่งมีชีวิตจึงอยู่ได้", correct: true }
      - { id: c, text: "แผงโซลาร์เซลล์บนหลังคาโรงเรียนเปลี่ยนแสงอาทิตย์เป็นไฟฟ้า", correct: true }
      - { id: d, text: "ทำให้เกิดดาวบนท้องฟ้าตอนกลางคืน", feedback: "ดาวดวงอื่นมีแสงในตัวเอง ไม่ได้เกิดจากดวงอาทิตย์ และแสงอาทิตย์ตอนกลางวันยังกลบแสงดาวด้วย" }
    hints:
      - "ดวงอาทิตย์ให้แสงและความร้อน"
      - "คิดถึงพืช ความอบอุ่น และการผลิตไฟฟ้า"
    solution: "ดวงอาทิตย์ให้แสงที่พืชใช้สร้างอาหาร ให้ความอบอุ่น และให้แสงที่เปลี่ยนเป็นไฟฟ้าได้ ส่วนดาวดวงอื่นมีแสงในตัวเอง ไม่ได้เกิดจากดวงอาทิตย์"
