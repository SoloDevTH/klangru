problems:
  - id: health.sport.rules-fair-play.p001
    topics: [health.sport.rules-fair-play]
    difficulty: 1
    type: numeric
    stem: "ในการแข่งขันวอลเลย์บอล แต่ละฝ่ายมีผู้เล่นในสนามกี่คน (ตอบเป็นตัวเลขในหน่วยคน)"
    answer: { value: 6, unit: คน }
    misconceptions:
      - { match: 5, feedback: "5 คนคือบาสเกตบอลหรือฟุตซอล วอลเลย์บอลมีฝ่ายละ 6 คน" }
      - { match: 11, feedback: "11 คนคือฟุตบอล วอลเลย์บอลมีฝ่ายละ 6 คน" }
    hints:
      - "ผู้เล่นยืนแถวหน้า 3 คน แถวหลัง 3 คน"
      - "ดูตารางกติกาพื้นฐานในบทเรียน"
    solution: "วอลเลย์บอลมีผู้เล่นในสนามฝ่ายละ 6 คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sport.rules-fair-play.p002
    topics: [health.sport.rules-fair-play]
    difficulty: 1
    type: mcq
    stem: "หลังแข่งฟุตบอลจบ ทีมของนัทแพ้ 1–2 ข้อใดแสดงน้ำใจนักกีฬา"
    choices:
      - { id: a, text: "เดินไปจับมือและแสดงความยินดีกับทีมที่ชนะ", correct: true }
      - { id: b, text: "ต่อว่ากรรมการว่าตัดสินไม่ยุติธรรม", feedback: "ควรยอมรับคำตัดสินของกรรมการ แม้จะไม่พอใจผล" }
      - { id: c, text: "เตะลูกบอลทิ้งด้วยความโมโห", feedback: "การแสดงความโกรธแบบนี้ไม่มีมารยาท และอาจทำให้คนอื่นบาดเจ็บ" }
      - { id: d, text: "โทษเพื่อนในทีมที่ทำพลาด", feedback: "ทีมแพ้ด้วยกันชนะด้วยกัน ควรให้กำลังใจกันและฝึกต่อ" }
    hints:
      - "น้ำใจนักกีฬาคือรู้แพ้ รู้ชนะ รู้อภัย"
      - "รู้แพ้คือยอมรับผลอย่างสุภาพ"
    solution: "การแสดงความยินดีกับผู้ชนะคือการรู้แพ้ ซึ่งเป็นน้ำใจนักกีฬา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sport.rules-fair-play.p003
    topics: [health.sport.rules-fair-play]
    difficulty: 1
    type: mcq
    stem: "ก่อนเล่นมอญซ่อนผ้า เพื่อน ๆ ตกลงกันว่า \"คนที่ถูกตีด้วยผ้าต้องมาเป็นมอญรอบต่อไป\" สิ่งนี้เรียกว่าอะไร"
    choices:
      - { id: a, text: "ข้อตกลงในการเล่น", correct: true }
      - { id: b, text: "กติกาสากลที่สหพันธ์กีฬากำหนด", feedback: "มอญซ่อนผ้าเป็นการละเล่นพื้นเมือง ไม่มีสหพันธ์กำหนด ผู้เล่นตกลงกันเอง" }
      - { id: c, text: "มารยาทของผู้ดู", feedback: "สิ่งนี้เป็นสิ่งที่ผู้เล่นตกลงกันก่อนเล่น ไม่เกี่ยวกับผู้ดู" }
    hints:
      - "ใครเป็นคนกำหนดสิ่งนี้"
      - "สิ่งที่ผู้เล่นตกลงกันเองก่อนเล่นเรียกว่าอะไร"
    solution: "สิ่งที่ผู้เล่นตกลงกันเองก่อนเล่นเรียกว่าข้อตกลง ทุกคนต้องทำตามเพื่อให้เล่นอย่างยุติธรรม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sport.rules-fair-play.p004
    topics: [health.sport.rules-fair-play]
    difficulty: 2
    type: match
    stem: "จับคู่ชนิดกีฬากับจำนวนผู้เล่นในสนามฝ่ายละ"
    pairs:
      - { left: "ฟุตบอล", right: "11 คน" }
      - { left: "วอลเลย์บอล", right: "6 คน" }
      - { left: "ฟุตซอล", right: "5 คน" }
      - { left: "เซปักตะกร้อ (เรกู)", right: "3 คน" }
    hints:
      - "ฟุตบอลใช้สนามใหญ่ที่สุดจึงมีผู้เล่นมากที่สุด"
      - "ตะกร้อทีมหนึ่งมีผู้เสิร์ฟ 1 คน และผู้เล่นหน้าตาข่าย 2 คน"
    solution: "ฟุตบอล 11 คน วอลเลย์บอล 6 คน ฟุตซอล 5 คน เซปักตะกร้อ 3 คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sport.rules-fair-play.p005
    topics: [health.sport.rules-fair-play]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นมารยาทที่ดีของผู้ดูกีฬา (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ปรบมือเมื่อทีมคู่แข่งเล่นได้สวย", correct: true }
      - { id: b, text: "เชียร์ทีมตัวเองด้วยถ้อยคำสุภาพ", correct: true }
      - { id: c, text: "เก็บขยะของตัวเองก่อนออกจากสนาม", correct: true }
      - { id: d, text: "โห่ตอนคู่แข่งกำลังเสิร์ฟ", feedback: "การโห่รบกวนสมาธิผู้เล่นและไม่ให้เกียรติคู่แข่ง" }
      - { id: e, text: "ขว้างขวดน้ำลงสนามเมื่อไม่พอใจกรรมการ", feedback: "อันตรายต่อผู้เล่นและกรรมการ ผิดมารยาทอย่างร้ายแรง" }
    hints:
      - "ผู้ดูที่ดีให้เกียรติทั้งสองทีมและกรรมการ"
      - "ข้อที่ถูกมีสามข้อ"
    solution: "ผู้ดูที่ดีปรบมือให้ทั้งสองฝ่าย เชียร์อย่างสุภาพ และรักษาความสะอาด ไม่โห่และไม่ขว้างปาสิ่งของ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sport.rules-fair-play.p006
    topics: [health.sport.rules-fair-play]
    difficulty: 2
    type: numeric
    stem: "ฟุตบอลระดับสากลแข่ง 2 ครึ่ง ครึ่งละ 45 นาที เวลาแข่งขันตามกติกา (ไม่รวมพักครึ่งและเวลาทดเจ็บ) รวมกี่นาที (ตอบเป็นตัวเลขในหน่วยนาที)"
    answer: { value: 90, unit: นาที }
    misconceptions:
      - { match: 45, feedback: "45 นาทีคือครึ่งเดียว การแข่งขันมี 2 ครึ่ง" }
      - { match: 47, feedback: "ต้องคูณจำนวนครึ่งกับเวลาต่อครึ่ง ไม่ใช่บวก 45 กับ 2" }
    hints:
      - "มีกี่ครึ่ง แต่ละครึ่งกี่นาที"
      - "นำจำนวนครึ่งคูณเวลาต่อครึ่ง"
    solution: "$2 \\times 45 = 90$ นาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sport.rules-fair-play.p007
    topics: [health.sport.rules-fair-play]
    difficulty: 3
    type: numeric
    stem: "ในการแข่งบาสเกตบอล ปอยิงลูกนอกเส้นสามคะแนนลง 4 ลูก ยิงลูกปกติลง 5 ลูก และยิงลูกโทษลง 3 ลูก ปอทำคะแนนได้รวมกี่คะแนน (ตอบเป็นตัวเลขในหน่วยคะแนน)"
    answer: { value: 25, unit: คะแนน }
    misconceptions:
      - { match: 12, feedback: "12 คือจำนวนลูกที่ยิงลง ต้องคูณกับคะแนนของลูกแต่ละแบบ" }
      - { match: 28, feedback: "ลูกโทษได้ลูกละ 1 คะแนน ไม่ใช่ 2 คะแนน" }
    hints:
      - "ลูกนอกเส้นสามคะแนน = 3 ลูกปกติ = 2 ลูกโทษ = 1"
      - "คูณจำนวนลูกกับคะแนนของแต่ละแบบ แล้วบวกกัน"
    solution: "$4 \\times 3 + 5 \\times 2 + 3 \\times 1 = 12 + 10 + 3 = 25$ คะแนน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sport.rules-fair-play.p008
    topics: [health.sport.rules-fair-play]
    difficulty: 3
    type: numeric
    stem: "ดูกระดานคะแนนวอลเลย์บอล ก่อนเซต 4 ทีมบ้านดอนแดงชนะไปแล้วกี่เซต (ตอบเป็นตัวเลขในหน่วยเซต)"
    figure:
      src: volleyball-score.svg
      alt: "กระดานคะแนนวอลเลย์บอลนักเรียนหญิง รอบชิงชนะเลิศ ทีมบ้านดอนแดง: เซต 1 ได้ 25 เซต 2 ได้ 23 เซต 3 ได้ 25 เซต 4 ได้ 24 ทีมบ้านหนองบัว: เซต 1 ได้ 21 เซต 2 ได้ 25 เซต 3 ได้ 18 เซต 4 ได้ 24 เซต 4 กำลังแข่งอยู่"
    answer: { value: 2, unit: เซต }
    misconceptions:
      - { match: 3, feedback: "เซต 2 ทีมดอนแดงได้ 23 แพ้หนองบัวที่ได้ 25 และเซต 4 ยังไม่จบ" }
      - { match: 1, feedback: "ทีมดอนแดงชนะทั้งเซต 1 (25–21) และเซต 3 (25–18)" }
    hints:
      - "เทียบคะแนนของสองทีมทีละเซต ทีมที่ได้มากกว่าชนะเซตนั้น"
      - "เซต 4 ยังไม่จบ ไม่ต้องนับ"
    solution: "เซต 1 ดอนแดงชนะ 25–21 เซต 2 แพ้ 23–25 เซต 3 ชนะ 25–18 จึงชนะไปแล้ว 2 เซต แพ้ 1 เซต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sport.rules-fair-play.p009
    topics: [health.sport.rules-fair-play]
    difficulty: 3
    type: mcq
    stem: "วอลเลย์บอลเซตที่ 1 คะแนนเป็น 25–24 ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "เซตยังไม่จบ ต้องเล่นต่อจนฝ่ายหนึ่งนำ 2 คะแนน", correct: true }
      - { id: b, text: "ฝ่ายที่ได้ 25 ชนะเซตนี้แล้ว", feedback: "ได้ 25 คะแนนยังไม่พอ ต้องนำอย่างน้อย 2 คะแนนด้วย" }
      - { id: c, text: "เสมอกัน ต้องเริ่มเซตใหม่", feedback: "ไม่มีการเริ่มเซตใหม่ เล่นต่อจนมีฝ่ายนำ 2 คะแนน" }
    hints:
      - "เซตปกติจบที่ 25 คะแนน โดยต้องนำกี่คะแนน"
      - "25 กับ 24 ต่างกันเท่าใด"
    solution: "ต้องได้ 25 คะแนนและนำอย่างน้อย 2 คะแนน 25–24 นำแค่ 1 จึงเล่นต่อ เช่น 26–24 จึงจบเซต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sport.rules-fair-play.p010
    topics: [health.sport.rules-fair-play]
    difficulty: 3
    type: mcq
    stem: "เพื่อนในห้องที่ใส่เฝือกอ่อนที่ขาอยากเล่นเกมส่งบอลกับกลุ่ม ข้อใดเป็นการยอมรับความแตกต่างระหว่างบุคคลได้ดีที่สุด"
    choices:
      - { id: a, text: "ตกลงกันให้เพื่อนเป็นผู้ส่งบอลจากจุดที่ยืนอยู่กับที่ ทุกคนได้เล่นด้วยกัน", correct: true }
      - { id: b, text: "บอกให้เพื่อนนั่งดูเพราะจะทำให้ทีมแพ้", feedback: "การกันเพื่อนออกเป็นการละเมิดสิทธิที่จะได้มีส่วนร่วม" }
      - { id: c, text: "ให้เพื่อนวิ่งเหมือนคนอื่น จะได้ยุติธรรม", feedback: "การให้วิ่งขณะขาเจ็บไม่ปลอดภัย ความยุติธรรมคือปรับให้ทุกคนเล่นได้อย่างปลอดภัย" }
      - { id: d, text: "ล้อเพื่อนเพื่อให้กลุ่มสนุก", feedback: "การล้อทำให้เพื่อนเสียใจ ไม่ใช่การยอมรับความแตกต่าง" }
    hints:
      - "ยอมรับความแตกต่างคือให้ทุกคนมีส่วนร่วมได้อย่างปลอดภัย"
      - "ข้อตกลงในการเล่นปรับได้"
    solution: "ปรับข้อตกลงให้เพื่อนเล่นได้อย่างปลอดภัย ทุกคนได้สิทธิเล่น ไม่ล้อเลียน คือการยอมรับความแตกต่าง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sport.rules-fair-play.p011
    topics: [health.sport.rules-fair-play]
    difficulty: 3
    type: text
    stem: "เติมคำ: พฤติกรรมของผู้มีน้ำใจนักกีฬา คือ มีวินัย เคารพกฎกติกา รู้แพ้ รู้ชนะ และรู้ ______"
    accepted: ["อภัย", "รู้อภัย", "ให้อภัย"]
    misconceptions:
      - { match: "เท่าทัน", feedback: "คำที่ต้องการเกี่ยวกับการไม่ถือโทษเมื่อคนอื่นพลาด" }
    hints:
      - "เป็นสิ่งที่เราทำเมื่อคู่แข่งชนเราโดยไม่ตั้งใจ"
      - "คำนี้มีความหมายว่าไม่ถือโทษ"
    solution: "รู้อภัย คือให้อภัยเมื่อผู้อื่นทำพลาดโดยไม่ตั้งใจ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sport.rules-fair-play.p012
    topics: [health.sport.rules-fair-play]
    difficulty: 4
    type: numeric
    stem: "จากกระดานคะแนน เซต 4 เสมอกัน 24–24 ทีมบ้านดอนแดงต้องได้คะแนนติดต่อกันอย่างน้อยกี่คะแนนจึงจะชนะเซตนี้ (ตอบเป็นตัวเลขในหน่วยคะแนน)"
    figure:
      src: volleyball-score.svg
      alt: "กระดานคะแนนวอลเลย์บอลนักเรียนหญิง รอบชิงชนะเลิศ ทีมบ้านดอนแดง: เซต 1 ได้ 25 เซต 2 ได้ 23 เซต 3 ได้ 25 เซต 4 ได้ 24 ทีมบ้านหนองบัว: เซต 1 ได้ 21 เซต 2 ได้ 25 เซต 3 ได้ 18 เซต 4 ได้ 24 เซต 4 กำลังแข่งอยู่"
    answer: { value: 2, unit: คะแนน }
    misconceptions:
      - { match: 1, feedback: "ได้ 1 คะแนนจะเป็น 25–24 นำแค่ 1 คะแนน ยังไม่จบเซต" }
    hints:
      - "เซตวอลเลย์บอลต้องนำอย่างน้อย 2 คะแนน"
      - "ลองนับ: ได้ 1 คะแนนเป็นเท่าใด ได้ 2 คะแนนเป็นเท่าใด"
    solution: "ได้ 2 คะแนนติดกันเป็น 26–24 นำ 2 คะแนนจึงชนะเซต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sport.rules-fair-play.p013
    topics: [health.sport.rules-fair-play]
    difficulty: 4
    type: mcq
    stem: "จากกระดานคะแนน ถ้าทีมบ้านดอนแดงชนะเซต 4 ผลการแข่งขันจะเป็นอย่างไร (แข่งแบบชนะ 3 ใน 5 เซต)"
    figure:
      src: volleyball-score.svg
      alt: "กระดานคะแนนวอลเลย์บอลนักเรียนหญิง รอบชิงชนะเลิศ ทีมบ้านดอนแดง: เซต 1 ได้ 25 เซต 2 ได้ 23 เซต 3 ได้ 25 เซต 4 ได้ 24 ทีมบ้านหนองบัว: เซต 1 ได้ 21 เซต 2 ได้ 25 เซต 3 ได้ 18 เซต 4 ได้ 24 เซต 4 กำลังแข่งอยู่"
    choices:
      - { id: a, text: "ดอนแดงชนะการแข่งขัน 3 ต่อ 1 เซต", correct: true }
      - { id: b, text: "ต้องแข่งเซต 5 ต่อ", feedback: "ดอนแดงจะชนะครบ 3 เซตแล้ว จึงไม่ต้องแข่งเซต 5" }
      - { id: c, text: "ดอนแดงชนะ 4 ต่อ 0 เซต", feedback: "ดอนแดงแพ้เซต 2 ไปแล้ว" }
      - { id: d, text: "ผลเสมอ 2 ต่อ 2 เซต", feedback: "ถ้าดอนแดงชนะเซต 4 จะมี 3 เซต ส่วนหนองบัวมี 1 เซต" }
    hints:
      - "นับเซตที่แต่ละทีมชนะแล้ว รวมเซต 4"
      - "ทีมที่ชนะครบ 3 เซตก่อนชนะการแข่งขัน"
    solution: "ดอนแดงชนะเซต 1 และ 3 อยู่แล้ว ถ้าชนะเซต 4 จะครบ 3 เซต ชนะ 3–1 การแข่งขันจบโดยไม่ต้องเล่นเซต 5"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sport.rules-fair-play.p014
    topics: [health.sport.rules-fair-play]
    difficulty: 4
    type: numeric
