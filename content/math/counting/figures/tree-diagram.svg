<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 350" width="620" height="350" font-family="sans-serif" font-size="16">
  <title>แผนภาพต้นไม้ของการเลือกข้าว 2 แบบและกับข้าว 3 แบบ</title>
  <circle cx="40" cy="170" r="5" fill="#15211e"/>
  <line x1="40" y1="170" x2="150" y2="95" stroke="#15211e" stroke-width="1.8" />
  <text x="190" y="100" text-anchor="middle" fill="#0a6b60" font-size="15" font-weight="bold">ข้าวสวย</text>
  <line x1="232" y1="95" x2="330" y2="45" stroke="#15211e" stroke-width="1.5" />
  <text x="370" y="50" text-anchor="middle" fill="#b4521f" font-size="14" font-weight="bold">ไก่ทอด</text>
  <text x="426" y="50" text-anchor="start" fill="#15211e" font-size="13" >1. ข้าวสวย + ไก่ทอด</text>
  <line x1="232" y1="95" x2="330" y2="95" stroke="#15211e" stroke-width="1.5" />
  <text x="370" y="100" text-anchor="middle" fill="#b4521f" font-size="14" font-weight="bold">หมูปิ้ง</text>
  <text x="426" y="100" text-anchor="start" fill="#15211e" font-size="13" >2. ข้าวสวย + หมูปิ้ง</text>
  <line x1="232" y1="95" x2="330" y2="145" stroke="#15211e" stroke-width="1.5" />
  <text x="370" y="150" text-anchor="middle" fill="#b4521f" font-size="14" font-weight="bold">ไข่เจียว</text>
  <text x="426" y="150" text-anchor="start" fill="#15211e" font-size="13" >3. ข้าวสวย + ไข่เจียว</text>
  <line x1="40" y1="170" x2="150" y2="245" stroke="#15211e" stroke-width="1.8" />
  <text x="190" y="250" text-anchor="middle" fill="#0a6b60" font-size="15" font-weight="bold">ข้าวเหนียว</text>
  <line x1="232" y1="245" x2="330" y2="195" stroke="#15211e" stroke-width="1.5" />
  <text x="370" y="200" text-anchor="middle" fill="#b4521f" font-size="14" font-weight="bold">ไก่ทอด</text>
  <text x="426" y="200" text-anchor="start" fill="#15211e" font-size="13" >4. ข้าวเหนียว + ไก่ทอด</text>
  <line x1="232" y1="245" x2="330" y2="245" stroke="#15211e" stroke-width="1.5" />
  <text x="370" y="250" text-anchor="middle" fill="#b4521f" font-size="14" font-weight="bold">หมูปิ้ง</text>
  <text x="426" y="250" text-anchor="start" fill="#15211e" font-size="13" >5. ข้าวเหนียว + หมูปิ้ง</text>
  <line x1="232" y1="245" x2="330" y2="295" stroke="#15211e" stroke-width="1.5" />
  <text x="370" y="300" text-anchor="middle" fill="#b4521f" font-size="14" font-weight="bold">ไข่เจียว</text>
  <text x="426" y="300" text-anchor="start" fill="#15211e" font-size="13" >6. ข้าวเหนียว + ไข่เจียว</text>
  <text x="190" y="20" text-anchor="middle" fill="#0a6b60" font-size="13" >เลือกข้าว (2 แบบ)</text>
  <text x="370" y="20" text-anchor="middle" fill="#b4521f" font-size="13" >เลือกกับข้าว (3 แบบ)</text>
  <text x="300" y="335" text-anchor="middle" fill="#15211e" font-size="16" font-weight="bold">ทั้งหมด 2 × 3 = 6 แบบ</text>
</svg>
