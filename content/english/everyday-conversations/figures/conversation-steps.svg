<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="sans-serif">
<title>สี่ขั้นของบทสนทนาในชีวิตประจำวัน</title>
<rect x="0" y="0" width="760" height="250" fill="#fff"/>
<rect x="15.0" y="20.0" width="165.0" height="210.0" rx="12" fill="#e3effa" stroke="#1f4e9c" stroke-width="2"/>
<text x="97.5" y="50.0" font-size="17" text-anchor="middle" fill="#1f4e9c" font-weight="bold">1. เปิด</text>
<text x="97.5" y="72.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" font-style="italic">Open</text>
<line x1="30.0" y1="85.0" x2="165.0" y2="85.0" stroke="#1f4e9c" stroke-width="1" stroke-linecap="round"/>
<text x="97.5" y="115.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">Excuse me.</text>
<text x="97.5" y="147.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">Hi, Ken!</text>
<text x="97.5" y="179.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">Good morning.</text>
<line x1="182.0" y1="125.0" x2="203.0" y2="125.0" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="203.0,125.0 194.9,128.9 194.9,121.1" fill="#111" stroke="#111" stroke-width="1" stroke-linejoin="round"/>
<rect x="205.0" y="20.0" width="165.0" height="210.0" rx="12" fill="#eaf6ea" stroke="#2e7d32" stroke-width="2"/>
<text x="287.5" y="50.0" font-size="17" text-anchor="middle" fill="#2e7d32" font-weight="bold">2. ถาม–ตอบ</text>
<text x="287.5" y="72.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" font-style="italic">Ask &amp; answer</text>
<line x1="220.0" y1="85.0" x2="355.0" y2="85.0" stroke="#2e7d32" stroke-width="1" stroke-linecap="round"/>
<text x="287.5" y="115.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">How much is this?</text>
<text x="287.5" y="147.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">Where do you live?</text>
<text x="287.5" y="179.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">Do you like durian?</text>
<line x1="372.0" y1="125.0" x2="393.0" y2="125.0" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="393.0,125.0 384.9,128.9 384.9,121.1" fill="#111" stroke="#111" stroke-width="1" stroke-linejoin="round"/>
<rect x="395.0" y="20.0" width="165.0" height="210.0" rx="12" fill="#fff3dc" stroke="#c77700" stroke-width="2"/>
<text x="477.5" y="50.0" font-size="17" text-anchor="middle" fill="#c77700" font-weight="bold">3. ต่อบทสนทนา</text>
<text x="477.5" y="72.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" font-style="italic">React &amp; follow up</text>
<line x1="410.0" y1="85.0" x2="545.0" y2="85.0" stroke="#c77700" stroke-width="1" stroke-linecap="round"/>
<text x="477.5" y="115.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">Really? That's great!</text>
<text x="477.5" y="147.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">What about you?</text>
<text x="477.5" y="179.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">Sorry? Could you ...</text>
<line x1="562.0" y1="125.0" x2="583.0" y2="125.0" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="583.0,125.0 574.9,128.9 574.9,121.1" fill="#111" stroke="#111" stroke-width="1" stroke-linejoin="round"/>
<rect x="585.0" y="20.0" width="165.0" height="210.0" rx="12" fill="#f6e3f0" stroke="#9c2f7a" stroke-width="2"/>
<text x="667.5" y="50.0" font-size="17" text-anchor="middle" fill="#9c2f7a" font-weight="bold">4. ปิด</text>
<text x="667.5" y="72.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" font-style="italic">Close</text>
<line x1="600.0" y1="85.0" x2="735.0" y2="85.0" stroke="#9c2f7a" stroke-width="1" stroke-linecap="round"/>
<text x="667.5" y="115.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">Thank you so much.</text>
<text x="667.5" y="147.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">See you tomorrow!</text>
<text x="667.5" y="179.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">Have a nice day.</text>
</svg>
