  - id: physics.matter.elasticity.p014
    topics: [physics.matter.elasticity]
    difficulty: 4
    type: numeric
    stem: "เสาคอนกรีตของอาคารสูง $3.0\\ \\mathrm{m}$ หน้าตัดสี่เหลี่ยมจัตุรัสกว้าง $0.20\\ \\mathrm{m}$ รับแรงอัด $200\\ \\mathrm{kN}$ ถ้ามอดุลัสของยังของคอนกรีตเท่ากับ $2.5 \\times 10^{10}\\ \\mathrm{N/m^2}$ เสาหดสั้นลงกี่มิลลิเมตร"
    answer: { value: 0.6, tolerance: 0.01, unit: mm }
    misconceptions:
      - { match: 0.12, feedback: "ใช้ความกว้าง $0.20\\ \\mathrm{m}$ เป็นพื้นที่ พื้นที่หน้าตัดคือ $0.20 \\times 0.20 = 0.040\\ \\mathrm{m^2}$" }
      - { match: 0.0006, feedback: "0.0006 คือคำตอบในหน่วยเมตร โจทย์ถามเป็นมิลลิเมตร" }
    hints:
      - "ความเค้นอัดใช้สูตรเดียวกับความเค้นดึง $\\Delta L = \\dfrac{F L_0}{A Y}$"
      - "พื้นที่หน้าตัด $= 0.20 \\times 0.20\\ \\mathrm{m^2}$ และ $200\\ \\mathrm{kN} = 2.0 \\times 10^{5}\\ \\mathrm{N}$"
    solution: "$A = 0.040\\ \\mathrm{m^2}$, $\\Delta L = \\dfrac{(2.0 \\times 10^5)(3.0)}{(0.040)(2.5 \\times 10^{10})} = 6.0 \\times 10^{-4}\\ \\mathrm{m} = 0.60\\ \\mathrm{mm}$ เสาหดน้อยมากจนมองไม่เห็น"
