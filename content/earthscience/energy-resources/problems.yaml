problems:
  - id: earthscience.resources.energy-resources.p001
    topics: [earthscience.resources.energy-resources]
    difficulty: 1
    type: mcq
    stem: "แหล่งพลังงานใดเป็นพลังงานหมุนเวียน"
    choices:
      - { id: a, text: "แสงอาทิตย์", correct: true }
      - { id: b, text: "แก๊สธรรมชาติ", feedback: "แก๊สธรรมชาติเป็นเชื้อเพลิงซากดึกดำบรรพ์ ใช้แล้วหมดไป แม้จะเป็นแก๊สก็ตาม" }
      - { id: c, text: "ถ่านหินลิกไนต์", feedback: "ถ่านหินเกิดจากซากพืชทับถมหลายล้านปี ใช้แล้วหมดไป" }
      - { id: d, text: "น้ำมันดีเซล", feedback: "ดีเซลกลั่นจากน้ำมันดิบซึ่งเป็นเชื้อเพลิงซากดึกดำบรรพ์" }
    hints:
      - "พลังงานหมุนเวียนเกิดขึ้นใหม่ได้ตลอด"
      - "สิ่งใดมีให้ใช้ทุกวันโดยไม่หมด"
    solution: "แสงอาทิตย์ส่องมาถึงโลกทุกวัน เป็นพลังงานหมุนเวียน ส่วนแก๊สธรรมชาติ ถ่านหิน และน้ำมันดีเซลมาจากเชื้อเพลิงซากดึกดำบรรพ์ ใช้แล้วหมดไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.resources.energy-resources.p002
    topics: [earthscience.resources.energy-resources]
    difficulty: 1
    type: match
    stem: "จับคู่พลังงานหมุนเวียนกับตัวอย่างการใช้ในประเทศไทย"
    pairs:
      - { left: "แสงอาทิตย์", right: "แผงโซลาร์เซลล์บนหลังคาโรงเรียน" }
      - { left: "น้ำ", right: "โรงไฟฟ้าที่เขื่อน" }
      - { left: "ชีวมวล", right: "โรงไฟฟ้าที่เผาแกลบและชานอ้อย" }
      - { left: "ลม", right: "กังหันลมบนสันเขาและชายฝั่ง" }
      - { left: "ความร้อนใต้พิภพ", right: "โรงไฟฟ้าใกล้แหล่งน้ำพุร้อนในภาคเหนือ" }
    hints:
      - "ชีวมวลคือของเหลือจากพืชและสัตว์"
      - "ความร้อนใต้พิภพมาจากภายในโลก พบได้ที่แหล่งน้ำพุร้อน"
    solution: "แสงอาทิตย์ใช้แผงโซลาร์เซลล์ น้ำใช้เขื่อน ชีวมวลใช้แกลบและชานอ้อย ลมใช้กังหันลม และความร้อนใต้พิภพใช้แหล่งน้ำพุร้อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.resources.energy-resources.p003
    topics: [earthscience.resources.energy-resources]
    difficulty: 1
    type: mcq
    stem: "ทำไมจึงเรียกถ่านหิน น้ำมัน และแก๊สธรรมชาติว่า พลังงานที่ใช้แล้วหมดไป"
    choices:
      - { id: a, text: "ต้องใช้เวลาหลายล้านปีจึงเกิดขึ้นใหม่ เราใช้เร็วกว่าที่ธรรมชาติสร้างมาก", correct: true }
      - { id: b, text: "เผาแล้วไม่เหลือเถ้าเลย", feedback: "ถ่านหินเผาแล้วเหลือเถ้า เหตุผลที่ใช้แล้วหมดไปคือเกิดใหม่ช้ามาก" }
      - { id: c, text: "มีแต่ในต่างประเทศ", feedback: "ไทยก็มีแหล่งถ่านหิน น้ำมัน และแก๊สธรรมชาติ แต่มีจำกัด" }
      - { id: d, text: "ทำได้จากพืชที่ปลูกทุกปี", feedback: "พืชที่ปลูกทุกปีคือชีวมวล ซึ่งเป็นพลังงานหมุนเวียน" }
    hints:
      - "เชื้อเพลิงเหล่านี้เกิดจากซากสิ่งมีชีวิตที่ทับถมใต้ดิน"
      - "การทับถมจนเป็นเชื้อเพลิงใช้เวลานานเท่าไร"
    solution: "เชื้อเพลิงซากดึกดำบรรพ์เกิดจากซากสิ่งมีชีวิตที่ถูกฝังและได้รับความร้อนและแรงกดนานหลายล้านปี เราใช้หมดเร็วกว่าที่ธรรมชาติสร้างใหม่มาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.resources.energy-resources.p004
    topics: [earthscience.resources.energy-resources]
    difficulty: 2
    type: numeric
    stem: "เครื่องปรับอากาศกำลังไฟฟ้า 1,200 W เปิด 8 ชั่วโมง ใช้พลังงานไฟฟ้ากี่กิโลวัตต์ชั่วโมง (kWh)"
    answer: { value: 9.6, tolerance: 0.05, unit: kWh }
    misconceptions:
      - { match: 9600, feedback: "9,600 คือวัตต์ชั่วโมง ต้องหารด้วย 1,000 เพื่อเป็นกิโลวัตต์ชั่วโมง" }
      - { match: 150, feedback: "นำกำลังไฟฟ้าหารด้วยเวลา พลังงานต้องเป็นกำลังไฟฟ้าคูณเวลา" }
    hints:
      - "พลังงาน (kWh) $=$ กำลังไฟฟ้า (W) $\\times$ เวลา (h) $\\div 1{,}000$"
      - "$1{,}200 \\times 8 \\div 1{,}000$"
    solution: "$\\dfrac{1{,}200 \\times 8}{1{,}000} = 9.6$ kWh หรือ 9.6 หน่วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.resources.energy-resources.p005
    topics: [earthscience.resources.energy-resources]
    difficulty: 2
    type: mcq
    stem: "เชื้อเพลิงชนิดใดที่ประเทศไทยใช้ผลิตไฟฟ้ามากที่สุด และส่วนหนึ่งได้จากแหล่งในอ่าวไทย"
    choices:
      - { id: a, text: "แก๊สธรรมชาติ", correct: true }
      - { id: b, text: "ถ่านหินลิกไนต์", feedback: "ลิกไนต์จากแม่เมาะใช้ผลิตไฟฟ้าจริง แต่สัดส่วนน้อยกว่าแก๊สธรรมชาติมาก และไม่ได้มาจากอ่าวไทย" }
      - { id: c, text: "แสงอาทิตย์", feedback: "แสงอาทิตย์เพิ่มขึ้นเร็ว แต่ยังเป็นสัดส่วนเล็กเมื่อเทียบกับแก๊สธรรมชาติ" }
      - { id: d, text: "น้ำมันเตา", feedback: "ไทยเคยใช้น้ำมันเตามาก แต่ปัจจุบันเปลี่ยนมาใช้แก๊สธรรมชาติแทนเกือบหมด" }
    hints:
      - "เป็นเชื้อเพลิงซากดึกดำบรรพ์ที่อยู่ในสถานะแก๊ส"
      - "ส่งขึ้นฝั่งด้วยท่อใต้ทะเล"
    solution: "ไทยผลิตไฟฟ้าจากแก๊สธรรมชาติมากที่สุด ราวสองในสาม ส่วนหนึ่งมาจากแหล่งในอ่าวไทย อีกส่วนนำเข้าทางท่อและในรูปแก๊สธรรมชาติเหลว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.resources.energy-resources.p006
    topics: [earthscience.resources.energy-resources]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการเกิดถ่านหิน"
    items:
      - "พืชในป่าพรุและหนองน้ำตายทับถมกันในน้ำ"
      - "ซากพืชเน่าไม่หมดเพราะขาดออกซิเจน กลายเป็นพีต"
      - "ตะกอนทับถมด้านบน ซากพืชถูกฝังลึกลง"
      - "ความร้อนและแรงกดเปลี่ยนซากพืชเป็นลิกไนต์ แล้วเป็นถ่านหินที่แข็งขึ้น"
    hints:
      - "เริ่มจากพืชที่ยังมีชีวิต"
      - "ยิ่งถูกฝังลึกและนาน ถ่านหินยิ่งแข็งและมีคาร์บอนมาก"
    solution: "พืชตายในหนองน้ำ → เน่าไม่หมดเป็นพีต → ถูกตะกอนทับจนฝังลึก → ความร้อนและแรงกดเปลี่ยนเป็นลิกไนต์และถ่านหิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.resources.energy-resources.p007
    topics: [earthscience.resources.energy-resources]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นผลกระทบจากการเผาเชื้อเพลิงซากดึกดำบรรพ์ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ปล่อยแก๊สคาร์บอนไดออกไซด์ที่ทำให้โลกร้อนขึ้น", correct: true }
      - { id: b, text: "ถ่านหินที่มีกำมะถันปล่อยซัลเฟอร์ไดออกไซด์ ทำให้เกิดฝนกรด", correct: true }
      - { id: c, text: "รถยนต์และโรงงานปล่อยฝุ่นละออง PM2.5", correct: true }
      - { id: d, text: "ทำให้โลกหมุนรอบตัวเองช้าลง", feedback: "การเผาเชื้อเพลิงไม่มีผลต่อการหมุนของโลก" }
      - { id: e, text: "ทำให้ดวงอาทิตย์ร้อนขึ้น", feedback: "ดวงอาทิตย์ไม่ได้รับผลจากสิ่งที่เกิดบนโลก ที่ร้อนขึ้นคือโลกเพราะแก๊สเรือนกระจก" }
    hints:
      - "คิดถึงสิ่งที่ออกจากปล่องควันและท่อไอเสีย"
      - "ผลกระทบต้องเกิดกับอากาศ สิ่งมีชีวิต และภูมิอากาศบนโลก"
    solution: "การเผาเชื้อเพลิงปล่อยคาร์บอนไดออกไซด์ ซัลเฟอร์ไดออกไซด์ และฝุ่นละออง ทำให้โลกร้อน ฝนกรด และปัญหาสุขภาพ แต่ไม่ได้เปลี่ยนการหมุนของโลกหรือความร้อนของดวงอาทิตย์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.resources.energy-resources.p008
    topics: [earthscience.resources.energy-resources]
    difficulty: 3
    type: numeric
    stem: "บ้านหลังหนึ่งเปลี่ยนหลอดไส้ 60 W เป็นหลอด LED 9 W ที่สว่างใกล้กัน 1 หลอด เปิดวันละ 5 ชั่วโมง เดือนละ 30 วัน ถ้าค่าไฟหน่วยละ 4.50 บาท (ค่าไฟสมมติ) จะประหยัดค่าไฟได้เดือนละกี่บาท"
    answer: { value: 34.43, tolerance: 0.3, unit: บาท }
    misconceptions:
      - { match: 40.5, feedback: "40.50 บาทคือค่าไฟของหลอดไส้ทั้งหมด ต้องหักค่าไฟของหลอด LED ที่ยังต้องจ่ายออกด้วย" }
      - { match: 34425, feedback: "ลืมหารด้วย 1,000 เพื่อแปลงวัตต์ชั่วโมงเป็นกิโลวัตต์ชั่วโมง" }
    hints:
      - "กำลังไฟฟ้าที่ลดลง $= 60 - 9$ W"
      - "พลังงานที่ประหยัด (kWh) $= 51 \\times 5 \\times 30 \\div 1{,}000$ แล้วคูณ 4.50"
    solution: "พลังงานที่ประหยัด $= \\dfrac{(60 - 9) \\times 5 \\times 30}{1{,}000} = 7.65$ kWh เงินที่ประหยัด $= 7.65 \\times 4.50 \\approx 34.43$ บาทต่อเดือน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.resources.energy-resources.p009
    topics: [earthscience.resources.energy-resources]
    difficulty: 3
    type: numeric
    stem: "กราฟแสดงพลังงานไฟฟ้าที่เครื่องใช้ไฟฟ้าแต่ละชนิดในบ้านหลังหนึ่งใช้ต่อวัน (ข้อมูลสมมติ) ถ้าใช้แบบนี้ทุกวัน 30 วัน บ้านหลังนี้ใช้พลังงานไฟฟ้ารวมเดือนละกี่ kWh"
    figure: { src: p-appliances.svg, alt: "กราฟแท่งแนวนอน พลังงานไฟฟ้าที่ใช้ต่อวันเป็น kWh เครื่องปรับอากาศ 7.2 ตู้เย็น 1.2 หม้อหุงข้าว 0.6 หลอดไฟรวม 0.6 โทรทัศน์ 0.5 เครื่องซักผ้า 0.4" }
    answer: { value: 315, tolerance: 1, unit: kWh }
    misconceptions:
      - { match: 10.5, feedback: "10.5 kWh คือพลังงานต่อวัน ต้องคูณ 30 วัน" }
      - { match: 216, feedback: "216 kWh คือเฉพาะเครื่องปรับอากาศ ต้องรวมเครื่องใช้ไฟฟ้าทุกชนิด" }
    hints:
      - "รวมพลังงานของทุกเครื่องต่อวันก่อน"
      - "$7.2 + 1.2 + 0.6 + 0.6 + 0.5 + 0.4$ แล้วคูณ 30"
    solution: "ต่อวัน $= 7.2 + 1.2 + 0.6 + 0.6 + 0.5 + 0.4 = 10.5$ kWh ต่อเดือน $= 10.5 \\times 30 = 315$ kWh เครื่องปรับอากาศใช้ถึง 216 kWh จึงเป็นจุดแรกที่ควรประหยัด เช่น ตั้งอุณหภูมิ 25–26 °C"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.resources.energy-resources.p010
    topics: [earthscience.resources.energy-resources]
    difficulty: 3
    type: mcq
    stem: "อำเภอหนึ่งในภาคอีสานมีโรงงานน้ำตาลที่มีชานอ้อยเหลือจำนวนมากทุกปี ลมอ่อน และไม่มีแม่น้ำที่สร้างเขื่อนได้ พลังงานหมุนเวียนแบบใดเหมาะเป็นแหล่งหลักที่สุด"
    choices:
      - { id: a, text: "ชีวมวลจากชานอ้อย", correct: true }
      - { id: b, text: "พลังงานลม", feedback: "ลมอ่อน กังหันลมจะผลิตไฟฟ้าได้น้อย ไม่คุ้มค่า" }
      - { id: c, text: "พลังงานน้ำจากเขื่อน", feedback: "ไม่มีแม่น้ำที่มีความต่างระดับพอจะสร้างเขื่อน" }
      - { id: d, text: "ความร้อนใต้พิภพ", feedback: "ความร้อนใต้พิภพใช้ได้เฉพาะบริเวณที่มีแหล่งน้ำร้อนใต้ดิน โจทย์ไม่ได้บอกว่ามี" }
    hints:
      - "ดูว่าท้องถิ่นนี้มีทรัพยากรอะไรมาก"
      - "ชานอ้อยเป็นของเหลือจากพืช"
    solution: "ชานอ้อยเป็นชีวมวลที่มีมากในท้องถิ่น ใช้เป็นเชื้อเพลิงผลิตไฟฟ้าและไอน้ำให้โรงงานได้ทั้งวัน และลดของเหลือทิ้ง ต้องมีระบบกรองควันและฝุ่นด้วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.resources.energy-resources.p011
    topics: [earthscience.resources.energy-resources]
    difficulty: 3
    type: match
    stem: "จับคู่พลังงานหมุนเวียนกับข้อจำกัดสำคัญ"
    pairs:
      - { left: "แสงอาทิตย์", right: "ผลิตไฟฟ้าไม่ได้ตอนกลางคืน" }
      - { left: "ลม", right: "อัตราเร็วลมไม่สม่ำเสมอ ไทยมีที่ลมแรงพอไม่มาก" }
      - { left: "น้ำจากเขื่อน", right: "ป่าและที่อยู่อาศัยจมน้ำ กระทบการอพยพของปลา" }
      - { left: "ชีวมวล", right: "การเผายังปล่อยควันและฝุ่น ต้องมีวัตถุดิบต่อเนื่อง" }
    hints:
      - "แต่ละแหล่งขึ้นกับธรรมชาติอะไร"
      - "เขื่อนต้องกักน้ำไว้เป็นพื้นที่กว้าง"
    solution: "แสงอาทิตย์ไม่มีตอนกลางคืน ลมไม่สม่ำเสมอ เขื่อนทำให้พื้นที่จมน้ำ และชีวมวลยังมีควันและต้องหาวัตถุดิบต่อเนื่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.resources.energy-resources.p012
    topics: [earthscience.resources.energy-resources]
    difficulty: 4
    type: numeric
    stem: "ร้านกาแฟติดแผงโซลาร์เซลล์ราคา 96,000 บาท ช่วยลดค่าไฟได้เดือนละ 1,000 บาท (ข้อมูลสมมติ) ระยะเวลาคืนทุนกี่ปี"
    answer: { value: 8, tolerance: 0.05, unit: ปี }
    misconceptions:
      - { match: 96, feedback: "96 คือจำนวนเดือน โจทย์ถามเป็นปี ให้หารด้วย 12" }
