<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" font-family="sans-serif" font-size="14">
<title>ทางเดินของแสงในหยดน้ำที่ทำให้เกิดรุ้งปฐมภูมิ แสงหักเหเข้า สะท้อนกลับหนึ่งครั้งที่ผิวด้านหลัง แล้วหักเหออก แสงสีแดงออกมาทำมุม 42 องศา แสงสีม่วงทำมุม 40.6 องศากับแนวแสงอาทิตย์</title>
<rect x="0" y="0" width="600" height="470" fill="#ffffff"/>
<circle cx="330.0" cy="190.0" r="120.0" fill="#e8f2fb" stroke="#1f5fa8" stroke-width="2"/>
<line x1="40.0" y1="86.6" x2="258.1" y2="86.6" stroke="#e0a100" stroke-width="3"/>
<polygon points="269.1,86.6 258.1,81.1 258.1,92.1" fill="#e0a100" stroke="#e0a100" stroke-width="1" stroke-linejoin="round"/>
<text x="40.0" y="76.6" text-anchor="start" fill="#15211e" font-size="13">แสงอาทิตย์ (แสงขาว)</text>
<line x1="269.1" y1="86.6" x2="441.9" y2="146.6" stroke="#d32f2f" stroke-width="1.6"/>
<line x1="441.9" y1="146.6" x2="354.7" y2="307.4" stroke="#d32f2f" stroke-width="1.6"/>
<line x1="354.7" y1="307.4" x2="229.1" y2="422.0" stroke="#d32f2f" stroke-width="2"/>
<text x="237.1" y="426.0" text-anchor="start" fill="#d32f2f" font-size="13">แดง</text>
<line x1="269.1" y1="86.6" x2="442.5" y2="148.3" stroke="#7b1fa2" stroke-width="1.6"/>
<line x1="442.5" y1="148.3" x2="351.1" y2="308.1" stroke="#7b1fa2" stroke-width="1.6"/>
<line x1="351.1" y1="308.1" x2="222.1" y2="418.8" stroke="#7b1fa2" stroke-width="2"/>
<text x="214.1" y="422.8" text-anchor="end" fill="#7b1fa2" font-size="13">ม่วง</text>
<line x1="354.7" y1="307.4" x2="184.7" y2="307.4" stroke="#777" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="179.7" y="301.4" text-anchor="end" fill="#777" font-size="12">แนวขนานกับแสงอาทิตย์</text>
<path d="M 284.7 307.4 A 70 70 0 0 0 303.0 354.6" fill="none" stroke="#15211e" stroke-width="1.2"/>
<text x="262.7" y="337.4" text-anchor="start" fill="#15211e" font-size="13">≈ 42°</text>
<text x="348.0" y="56.0" text-anchor="middle" fill="#1f5fa8" font-size="13">หยดน้ำฝน</text>
<text x="458.0" y="196.0" text-anchor="start" fill="#15211e" font-size="12">สะท้อนที่ผิวด้านหลัง</text>
<text x="20.0" y="458.0" text-anchor="start" fill="#15211e" font-size="12">มุมระหว่างแสงที่ออกมากับแนวแสงอาทิตย์: แดงประมาณ 42° ม่วงประมาณ 40.6° สีแดงจึงอยู่ขอบนอกของรุ้ง</text>
</svg>
