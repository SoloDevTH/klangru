  - id: biology.diversity.biodiversity.p013
    topics: [biology.diversity.biodiversity]
    difficulty: 4
    type: numeric
    stem: "จากภาพ คำนวณดัชนีความหลากหลายของซิมป์สันของแปลง ก ด้วยสูตร $D = 1 - \\sum p_i^2$ ตอบทศนิยม 2 ตำแหน่ง"
    figure: { src: mangrove-survey.svg, alt: "แผนภูมิแท่งสองแผง แปลง ก ป่าชายเลนธรรมชาติ มีโกงกาง 12 ต้น แสม 8 ต้น ลำพู 6 ต้น ตะบูน 4 ต้น แปลง ข ป่าชายเลนที่ปลูกใหม่ มีโกงกาง 27 ต้น แสม 3 ต้น ลำพู 0 ต้น ตะบูน 0 ต้น แปลงทั้งสองมีขนาดเท่ากัน เป็นข้อมูลสมมติ" }
    answer: { value: 0.71, tolerance: 0.01 }
    hints:
      - "หาจำนวนทั้งหมดของแปลง ก แล้วหา $p_i$ ของแต่ละชนิด"
      - "ยกกำลังสอง $p_i$ ทุกตัว บวกกัน แล้วนำไปลบออกจาก 1"
    misconceptions:
      - { match: 0.29, feedback: "นี่คือ $\\sum p_i^2$ ยังไม่ได้นำไปลบออกจาก 1" }
      - { match: 0.75, feedback: "คิดเหมือนทุกชนิดมีจำนวนเท่ากัน ต้องใช้จำนวนจริงของแต่ละชนิด" }
    solution: "แปลง ก มี $12 + 8 + 6 + 4 = 30$ ต้น $\\sum p_i^2 = \\frac{12^2 + 8^2 + 6^2 + 4^2}{30^2} = \\frac{260}{900} \\approx 0.289$ ดังนั้น $D = 1 - 0.289 \\approx 0.71$"
