<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280" font-family="sans-serif" font-size="15">
  <title>พลังงานไฟฟ้าที่หลอดไส้ 60 W และหลอด LED 9 W ใช้ในหนึ่งวินาที แบ่งเป็นแสง 3 J และความร้อน วาดตามมาตราส่วน</title>
  <rect x="0" y="0" width="600" height="280" fill="#ffffff"/>
  <text x="138.0" y="79.0" fill="#15211e" font-size="14" text-anchor="end">หลอดไส้ 60 W</text>
  <rect x="150.0" y="55.0" width="21.0" height="36.0" rx="0" fill="#fff3b0" stroke="#15211e" stroke-width="1.5"/>
  <rect x="171.0" y="55.0" width="399.0" height="36.0" rx="0" fill="#f6c9b3" stroke="#b4521f" stroke-width="1.5"/>
  <text x="150.0" y="111.0" fill="#15211e" font-size="13" text-anchor="start">แสง 3 J + ความร้อน 57 J</text>
  <text x="138.0" y="169.0" fill="#15211e" font-size="14" text-anchor="end">หลอด LED 9 W</text>
  <rect x="150.0" y="145.0" width="21.0" height="36.0" rx="0" fill="#fff3b0" stroke="#15211e" stroke-width="1.5"/>
  <rect x="171.0" y="145.0" width="42.0" height="36.0" rx="0" fill="#f6c9b3" stroke="#b4521f" stroke-width="1.5"/>
  <text x="150.0" y="201.0" fill="#15211e" font-size="13" text-anchor="start">แสง 3 J + ความร้อน 6 J</text>
  <rect x="150.0" y="240.0" width="16.0" height="14.0" rx="0" fill="#fff3b0" stroke="#15211e" stroke-width="1.5"/>
  <text x="172.0" y="252.0" fill="#15211e" font-size="13" text-anchor="start">แสง (พลังงานที่ต้องการ)</text>
  <rect x="360.0" y="240.0" width="16.0" height="14.0" rx="0" fill="#f6c9b3" stroke="#b4521f" stroke-width="1.5"/>
  <text x="382.0" y="252.0" fill="#15211e" font-size="13" text-anchor="start">ความร้อน (สูญเปล่า)</text>
  <text x="150.0" y="30.0" fill="#15211e" font-size="14" text-anchor="start" font-weight="bold">พลังงานที่ใช้ในทุก 1 วินาที</text>
</svg>
