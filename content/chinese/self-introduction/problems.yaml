  ai_assisted: true
- id: chinese.vocab.self-introduction.p009
  topics:
  - chinese.vocab.self-introduction
  difficulty: 3
  type: mcq
  stem: คุณยายชาวจีนถามเราอย่างสุภาพว่า 您贵姓？ (Nín guìxìng?) ถ้าเรามีชื่อจีนแซ่หลิน (林 Lín) ควรตอบว่าอะไร
  choices:
  - id: a
    text: 我叫林。
    feedback: 叫 ตามด้วยชื่อเต็ม คำถามนี้ถามแซ่ ตอบด้วย 姓
  - id: b
    text: 您姓林。
    feedback: 您 = คุณ ต้องตอบเกี่ยวกับตัวเองด้วย 我
  - id: c
    text: 我姓林。
    correct: true
    feedback: ถูก 贵 เป็นคำยกย่องที่ใช้กับผู้ฟังเท่านั้น ตอนตอบใช้ 我姓…
  - id: d
    text: 我贵姓林。
    feedback: ห้ามใช้ 贵 กับตัวเอง เพราะเป็นคำยกย่อง
  hints:
  - 您贵姓 = คุณแซ่อะไร (สุภาพ)
  - 贵 guì แปลว่า มีค่า ใช้ยกย่องผู้ฟัง
  solution: '**我姓林。** Wǒ xìng Lín. (ต่อด้วยชื่อเต็มได้ เช่น 我姓林，叫林美)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.self-introduction.p010
  topics:
  - chinese.vocab.self-introduction
  difficulty: 3
  type: numeric
  stem: เพื่อนชาวจีนบอกว่า 我家有爸爸、妈妈、两个哥哥、一个妹妹和我。 ครอบครัวของเขามีกี่คน (กี่ 口人)
  answer:
    value: 6
    unit: คน
  misconceptions:
  - match: 5
    feedback: อย่าลืมนับตัวผู้พูด (我) ด้วย
  - match: 4
    feedback: 两个哥哥 คือพี่ชาย 2 คน
  hints:
  - 两个哥哥 = พี่ชาย 2 คน
  - นับ พ่อ แม่ พี่ชาย น้องสาว และตัวผู้พูด
  solution: $1 + 1 + 2 + 1 + 1 = 6$ คน จึงพูดว่า 我家有六口人。
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.self-introduction.p011
  topics:
  - chinese.vocab.self-introduction
  difficulty: 3
  type: mcq
  stem: '"ตา" (พ่อของแม่) ภาษาจีนเรียกว่าอะไร'
  choices:
  - id: a
    text: 外公 wàigōng
    correct: true
    feedback: ถูก ญาติฝั่งแม่มักมีคำว่า 外 นำหน้า (ภาคเหนือของจีนเรียก 姥爷 lǎoye)
  - id: b
    text: 爷爷 yéye
    feedback: 爷爷 คือ ปู่ (พ่อของพ่อ)
  - id: c
    text: 外婆 wàipó
    feedback: 外婆 คือ ยาย (แม่ของแม่)
  - id: d
    text: 奶奶 nǎinai
    feedback: 奶奶 คือ ย่า (แม่ของพ่อ)
  hints:
  - ภาษาไทยแยกฝั่งพ่อ (ปู่ ย่า) กับฝั่งแม่ (ตา ยาย) ภาษาจีนก็แยกเหมือนกัน
  - ฝั่งแม่มีคำว่า 外 (นอก) นำหน้า
  solution: ตา = **外公** · ยาย = 外婆 · ปู่ = 爷爷 · ย่า = 奶奶
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.self-introduction.p012
  topics:
  - chinese.vocab.self-introduction
  difficulty: 4
  type: mcq
  stem: '"เขาเป็นน้องชายของฉัน" ประโยคใดถูกต้อง'
  choices:
  - id: a
    text: 他是弟弟我。
    feedback: 'เจ้าของต้องอยู่หน้า: 我弟弟'
  - id: b
    text: 他是我弟弟。
    correct: true
    feedback: ถูก 弟弟 = น้องชาย ญาติใกล้ชิดละ 的 ได้
  - id: c
    text: 他是我哥哥。
    feedback: 哥哥 = พี่ชาย (อายุมากกว่า)
  - id: d
    text: 她是我妹妹。
    feedback: 她 妹妹 เป็นผู้หญิง (น้องสาว)
  hints:
  - น้อง = อายุน้อยกว่า ผู้ชาย = 弟
  - เจ้าของวางหน้าคำนาม
  solution: '**他是我弟弟。** Tā shì wǒ dìdi. (พูด 我的弟弟 ก็ได้)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.self-introduction.p013
  topics:
  - chinese.vocab.self-introduction
  difficulty: 4
  type: match
  stem: จับคู่คำถามกับคำตอบที่เหมาะสม
  pairs:
  - left: 你叫什么名字？
    right: 我叫李明。
  - left: 你今年多大？
    right: 我今年十六岁。
  - left: 你是哪国人？
    right: 我是泰国人。
  - left: 你家有几口人？
    right: 我家有五口人。
  - left: 你有姐姐吗？
    right: 我没有姐姐。
  hints:
  - 多大 ถามอายุ 几口人 ถามจำนวนคนในครอบครัว
  - คำถามที่มี 吗 ตอบแบบมีหรือไม่มี
  solution: 什么名字 → 我叫李明 · 多大 → 十六岁 · 哪国人 → 泰国人 · 几口人 → 五口人 · 有姐姐吗 → 我没有姐姐
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.self-introduction.p014
  topics:
  - chinese.vocab.self-introduction
  difficulty: 4
  type: mcq
  stem: ประโยคใดใช้ 和 hé (และ) ถูกต้อง
  choices:
  - id: a
    text: 我是泰国人和我十三岁。
    feedback: '和 เชื่อมประโยคสองประโยคไม่ได้ ให้ใช้เครื่องหมายจุลภาคแทน: 我是泰国人，我十三岁'
  - id: b
    text: 我和有一个妹妹。
    feedback: 和 ต้องอยู่ระหว่างคำนาม ไม่ใช่หน้ากริยา
  - id: c
    text: 我有一个哥哥，和一个妹妹也有。
    feedback: ลำดับคำผิด ใช้ 和 เชื่อมคำนามติดกันเลย
  - id: d
    text: 我有一个哥哥和一个妹妹。
    correct: true
    feedback: ถูก 和 เชื่อมคำนามสองคำ
  hints:
  - 和 ภาษาจีนต่างจาก และ ภาษาไทย ตรงที่เชื่อมประโยคไม่ได้
  - 和 ใช้เชื่อมคำนาม เช่น 爸爸和妈妈
  solution: '**我有一个哥哥和一个妹妹。** 和 เชื่อมคำนาม ส่วนประโยคสองประโยคใช้ ， คั่น'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.self-introduction.p015
  topics:
  - chinese.vocab.self-introduction
  difficulty: 4
  type: order
  stem: คุยวิดีโอกับเพื่อนทางจดหมายชาวจีนครั้งแรก เรียงคำเป็นประโยค "ยินดีที่ได้รู้จักคุณ"
  items:
  - 很
  - 高兴
  - 认识
  - 你
  hints:
  - ยินดีมาก = 很高兴
  - ตามด้วย รู้จัก + คุณ
  solution: '**很高兴认识你。** Hěn gāoxìng rènshi nǐ. (พูด 认识你很高兴 ก็ได้)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.self-introduction.p016
  topics:
  - chinese.vocab.self-introduction
  difficulty: 5
