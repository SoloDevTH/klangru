  - id: engineering.safety.risk-assessment.p016
    topics:
      - engineering.safety.risk-assessment
    difficulty: 4
    type: code
    stem: เขียนฟังก์ชัน `risk_rating(likelihood, severity)` ที่รับโอกาส (1–5) และความรุนแรง (1–5) แล้วคืนแถบความเสี่ยงเป็นข้อความ โดยคำนวณ R = likelihood × severity และแบ่งแถบดังนี้ R ≤ 4 เป็น 'ต่ำ', R ≤ 9 เป็น 'ปานกลาง', R ≤ 16 เป็น 'สูง', และที่เหลือเป็น 'สูงมาก'
    starter: "def risk_rating(likelihood, severity):\n    pass\n"
    tests: 'r = risk_rating(1, 1)

      assert r is not None, "ฟังก์ชันยังไม่ได้คืนค่า ให้ใช้ return ไม่ใช่ print"

      assert r == ''ต่ำ'', f"risk_rating(1, 1) ควรได้ ''ต่ำ'' แต่ได้ {r!r}"

      assert risk_rating(2, 3) == ''ปานกลาง'', f"risk_rating(2, 3) ควรได้ ''ปานกลาง'' (R = 6) แต่ได้ {risk_rating(2, 3)!r}"

      assert risk_rating(4, 4) == ''สูง'', f"risk_rating(4, 4) ควรได้ ''สูง'' (R = 16) แต่ได้ {risk_rating(4, 4)!r}"

      assert risk_rating(5, 4) == ''สูงมาก'', f"risk_rating(5, 4) ควรได้ ''สูงมาก'' (R = 20) แต่ได้ {risk_rating(5, 4)!r}"

      assert risk_rating(2, 2) == ''ต่ำ'', f"risk_rating(2, 2) ควรได้ ''ต่ำ'' (R = 4) แต่ได้ {risk_rating(2, 2)!r} ตรวจขอบเขตของแถบ"

      '
    reference: "def risk_rating(likelihood, severity):\n    r = likelihood * severity\n    if r <= 4:\n        return 'ต่ำ'\n    if r <= 9:\n        return 'ปานกลาง'\n    if r <= 16:\n        return 'สูง'\n    return 'สูงมาก'\n"
    hints:
      - คำนวณ R ก่อนด้วย likelihood * severity
      - เขียนเงื่อนไขจากค่าน้อยไปมากด้วย if และคืนค่าด้วย return
    solution: R = likelihood × severity จากนั้นตรวจเงื่อนไข R ≤ 4, R ≤ 9, R ≤ 16 ตามลำดับ และคืนข้อความที่เหลือเป็น 'สูงมาก' ขอบเขตของแถบเป็นค่าสมมติที่ต้องปรับตามนโยบายองค์กร
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.safety.risk-assessment.p017
    topics:
      - engineering.safety.risk-assessment
    difficulty: 5
    type: numeric
    stem: (ข้อมูลสมมติ) ความถี่ของเหตุการณ์เริ่มต้น 0.2 ครั้งต่อปี ผ่านชั้นป้องกันแรก PFD = 0.1 และชั้นที่สอง PFD = 0.01 และเหตุการณ์ที่ผ่านทั้งสองชั้นมีโอกาส 0.5 ที่จะกลายเป็นเหตุร้ายแรง ความถี่ของเหตุการณ์ร้ายแรงต่อปีเท่ากับเท่าไร (ตอบเป็นทศนิยมห้าตำแหน่ง ตัวเลขอย่างเดียว)
    answer:
      value: 0.0001
      tolerance: 1.0e-05
      unit: ต่อปี
    hints:
      - ความถี่ร้ายแรง = ความถี่เริ่มต้น × PFD₁ × PFD₂ × P(ร้ายแรง)
      - คูณตัวเลขทั้งสี่ตัวตามลำดับ ผลลัพธ์จะเป็นค่าเล็กมาก
    misconceptions:
      - match: 0.0002
        feedback: ลืมนำโอกาสที่เหตุการณ์ที่ผ่านชั้นป้องกันจะกลายเป็นเหตุร้ายแรง (0.5) มาคิดด้วย
    solution: ความถี่ร้ายแรง = 0.2 × 0.1 × 0.01 × 0.5 = 0.0001 ต่อปี ถ้าเป้าหมายเป็น 1 × 10⁻⁴ ต่อปี ค่านี้เท่ากับเป้าหมายพอดี
    license: CC-BY-SA-4.0
    ai_assisted: true
