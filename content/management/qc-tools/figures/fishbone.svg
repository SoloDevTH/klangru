<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 340" width="790" height="340" font-family="sans-serif" font-size="15">
  <title>แผนผังก้างปลาของปัญหาผู้ป่วยนอกรอพบแพทย์นาน แยกสาเหตุเป็นหกกลุ่ม</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15211e"/></marker></defs>
  <line x1="120.0" y1="170.0" x2="620.0" y2="170.0" stroke="#15211e" stroke-width="3" marker-end="url(#ah)"/>
  <rect x="628" y="132" width="140" height="76" rx="8" fill="#fbe3d6" stroke="#b4521f" stroke-width="2"/>
  <text x="698.0" y="158.0" text-anchor="middle" dominant-baseline="middle" fill="#15211e" font-size="14" font-weight="bold">ผู้ป่วยนอก</text>
  <text x="698.0" y="180.0" text-anchor="middle" dominant-baseline="middle" fill="#15211e" font-size="14" font-weight="bold">รอพบแพทย์</text>
  <text x="698.0" y="198.0" text-anchor="middle" dominant-baseline="middle" fill="#15211e" font-size="12">นานเกิน 2 ชม.</text>
  <line x1="135.0" y1="50.0" x2="205.0" y2="170.0" stroke="#15211e" stroke-width="2"/>
  <text x="135.0" y="34.0" text-anchor="middle" dominant-baseline="middle" fill="#0a6b60" font-size="13" font-weight="bold">คน (Man)</text>
  <line x1="35.7" y1="94.0" x2="160.7" y2="94.0" stroke="#6b7a76" stroke-width="1.3"/>
  <text x="148.7" y="85.0" text-anchor="end" dominant-baseline="middle" fill="#15211e" font-size="11.5">แพทย์เข้าตรวจสาย</text>
  <line x1="54.3" y1="126.0" x2="179.3" y2="126.0" stroke="#6b7a76" stroke-width="1.3"/>
  <text x="167.3" y="117.0" text-anchor="end" dominant-baseline="middle" fill="#15211e" font-size="11.5">พยาบาลคัดกรองน้อย</text>
  <line x1="315.0" y1="50.0" x2="385.0" y2="170.0" stroke="#15211e" stroke-width="2"/>
  <text x="315.0" y="34.0" text-anchor="middle" dominant-baseline="middle" fill="#0a6b60" font-size="13" font-weight="bold">วิธีการ (Method)</text>
  <line x1="215.7" y1="94.0" x2="340.7" y2="94.0" stroke="#6b7a76" stroke-width="1.3"/>
  <text x="328.7" y="85.0" text-anchor="end" dominant-baseline="middle" fill="#15211e" font-size="11.5">เรียกคิวไม่เป็นระบบ</text>
  <line x1="234.3" y1="126.0" x2="359.3" y2="126.0" stroke="#6b7a76" stroke-width="1.3"/>
  <text x="347.3" y="117.0" text-anchor="end" dominant-baseline="middle" fill="#15211e" font-size="11.5">ซักประวัติซ้ำ</text>
  <line x1="495.0" y1="50.0" x2="565.0" y2="170.0" stroke="#15211e" stroke-width="2"/>
  <text x="495.0" y="34.0" text-anchor="middle" dominant-baseline="middle" fill="#0a6b60" font-size="13" font-weight="bold">เครื่องจักร (Machine)</text>
  <line x1="395.7" y1="94.0" x2="520.7" y2="94.0" stroke="#6b7a76" stroke-width="1.3"/>
  <text x="508.7" y="85.0" text-anchor="end" dominant-baseline="middle" fill="#15211e" font-size="11.5">ระบบคิวล่ม</text>
  <line x1="414.3" y1="126.0" x2="539.3" y2="126.0" stroke="#6b7a76" stroke-width="1.3"/>
  <text x="527.3" y="117.0" text-anchor="end" dominant-baseline="middle" fill="#15211e" font-size="11.5">เครื่องวัดความดันน้อย</text>
  <line x1="135.0" y1="290.0" x2="205.0" y2="170.0" stroke="#15211e" stroke-width="2"/>
  <text x="135.0" y="306.0" text-anchor="middle" dominant-baseline="middle" fill="#0a6b60" font-size="13" font-weight="bold">วัสดุ (Material)</text>
  <line x1="45.0" y1="230.0" x2="170.0" y2="230.0" stroke="#6b7a76" stroke-width="1.3"/>
  <text x="158.0" y="221.0" text-anchor="end" dominant-baseline="middle" fill="#15211e" font-size="11.5">แฟ้มประวัติหาย</text>
  <line x1="315.0" y1="290.0" x2="385.0" y2="170.0" stroke="#15211e" stroke-width="2"/>
  <text x="315.0" y="306.0" text-anchor="middle" dominant-baseline="middle" fill="#0a6b60" font-size="13" font-weight="bold">การวัด (Measurement)</text>
  <line x1="215.7" y1="246.0" x2="340.7" y2="246.0" stroke="#6b7a76" stroke-width="1.3"/>
  <text x="328.7" y="237.0" text-anchor="end" dominant-baseline="middle" fill="#15211e" font-size="11.5">ไม่จับเวลารอ</text>
  <line x1="234.3" y1="214.0" x2="359.3" y2="214.0" stroke="#6b7a76" stroke-width="1.3"/>
  <text x="347.3" y="205.0" text-anchor="end" dominant-baseline="middle" fill="#15211e" font-size="11.5">ไม่มีตัวชี้วัดรายวัน</text>
  <line x1="495.0" y1="290.0" x2="565.0" y2="170.0" stroke="#15211e" stroke-width="2"/>
  <text x="495.0" y="306.0" text-anchor="middle" dominant-baseline="middle" fill="#0a6b60" font-size="13" font-weight="bold">สภาพแวดล้อม (Environment)</text>
  <line x1="405.0" y1="230.0" x2="530.0" y2="230.0" stroke="#6b7a76" stroke-width="1.3"/>
  <text x="518.0" y="221.0" text-anchor="end" dominant-baseline="middle" fill="#15211e" font-size="11.5">ผู้ป่วยมาพร้อมกันตอนเช้า</text>
