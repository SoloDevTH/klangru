<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="sans-serif" font-size="16">
  <title>การหารยาว 1,358 ÷ 12</title>
  <rect x="0" y="0" width="720" height="380" fill="#ffffff"/>
  <text x="230.0" y="70.0" font-size="24" text-anchor="middle" fill="#0a6b60" font-weight="bold">1</text>
  <text x="260.0" y="70.0" font-size="24" text-anchor="middle" fill="#0a6b60" font-weight="bold">1</text>
  <text x="290.0" y="70.0" font-size="24" text-anchor="middle" fill="#0a6b60" font-weight="bold">3</text>
  <text x="152.0" y="108.0" font-size="24" text-anchor="end" fill="#15211e">12</text>
  <path d="M 162 118 Q 174 90 164 82 L 310 82" fill="none" stroke="#15211e" stroke-width="2"/>
  <text x="200.0" y="108.0" font-size="24" text-anchor="middle" fill="#15211e">1</text>
