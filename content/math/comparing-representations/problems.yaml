problems:
  - id: math.functions.comparing-representations.p001
    topics: [math.functions.comparing-representations]
    difficulty: 1
    type: mcq
    stem: "ค่าไฟฟ้าของบ้านหลังหนึ่งขึ้นอยู่กับจำนวนหน่วยไฟฟ้าที่ใช้ ข้อใดเป็นตัวแปรตาม"
    choices:
      - { id: a, text: "ค่าไฟฟ้า", correct: true }
      - { id: b, text: "จำนวนหน่วยไฟฟ้าที่ใช้", feedback: "จำนวนหน่วยเป็นสิ่งที่เปลี่ยนก่อน เป็นตัวแปรอิสระ ค่าไฟเปลี่ยนตามจำนวนหน่วย" }
      - { id: c, text: "ทั้งสองอย่างเป็นตัวแปรตาม", feedback: "ในความสัมพันธ์นี้มีตัวหนึ่งเป็นเหตุ (ตัวแปรอิสระ) อีกตัวเปลี่ยนตาม (ตัวแปรตาม)" }
    hints:
      - "ตัวแปรตามคือสิ่งที่ \"ขึ้นอยู่กับ\" อีกสิ่งหนึ่ง"
      - "อ่านประโยค: ค่าไฟฟ้าขึ้นอยู่กับอะไร"
    solution: "ค่าไฟฟ้าเปลี่ยนตามจำนวนหน่วยที่ใช้ ค่าไฟฟ้าจึงเป็นตัวแปรตาม และจำนวนหน่วยเป็นตัวแปรอิสระ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.functions.comparing-representations.p002
    topics: [math.functions.comparing-representations]
    difficulty: 2
    type: numeric
    stem: "รถตู้แล่นด้วยอัตราเร็วคงที่ ระยะทางเป็นไปตาม $d = 65t$ เมื่อ $d$ เป็นกิโลเมตรและ $t$ เป็นชั่วโมง ใน 3 ชั่วโมงรถตู้แล่นได้กี่กิโลเมตร (ตอบในหน่วย km)"
    answer: { value: 195, unit: km }
    hints:
      - "แทน $t = 3$ ในสมการ"
      - "$d = 65 \\times 3$"
    misconceptions:
      - { match: 68, feedback: "บวก 65 กับ 3 สมการ $d = 65t$ หมายถึง 65 คูณ $t$" }
      - { match: 21.67, feedback: "หาร 65 ด้วย 3 ระยะทาง = อัตราเร็ว × เวลา" }
    solution: "$d = 65 \\times 3 = 195$ กิโลเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.functions.comparing-representations.p003
    topics: [math.functions.comparing-representations]
    difficulty: 2
    type: mcq
    stem: "จุดใดอยู่บนกราฟของ $y = 3x + 1$"
    choices:
      - { id: a, text: "$(2, 7)$", correct: true }
      - { id: b, text: "$(7, 2)$", feedback: "สลับพิกัด แทน $x = 7$ ได้ $y = 22$ ไม่ใช่ 2" }
      - { id: c, text: "$(1, 3)$", feedback: "แทน $x = 1$ ได้ $y = 4$ ลืมบวก 1" }
      - { id: d, text: "$(0, 3)$", feedback: "แทน $x = 0$ ได้ $y = 1$ เลข 3 คือความชัน ไม่ใช่ค่าเมื่อ $x = 0$" }
    hints:
      - "จุดอยู่บนกราฟเมื่อแทนค่าแล้วสมการเป็นจริง"
      - "แทน $x$ ของแต่ละจุด แล้วดูว่าได้ $y$ ตรงหรือไม่"
    solution: "แทน $x = 2$: $3(2) + 1 = 7$ ตรงกับ $y = 7$ จุด $(2, 7)$ จึงอยู่บนกราฟ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.functions.comparing-representations.p004
    topics: [math.functions.comparing-representations]
    difficulty: 2
    type: numeric
    stem: "กราฟแสดงระยะทางจากบ้านของยายขณะเดินไปตลาด ซื้อของ แล้วเดินกลับบ้าน ในช่วง 10 นาทีแรกยายเดินด้วยอัตราเร็วกี่เมตรต่อนาที (ตอบในหน่วย m/min)"
    figure: { src: distance-time.svg, alt: "กราฟระยะทางจากบ้าน (เมตร) กับเวลา (นาที) เป็นเส้นตรงจาก (0, 0) ขึ้นไปถึง (10, 800) จากนั้นราบที่ 800 เมตรจนถึงนาทีที่ 25 แล้วลงเป็นเส้นตรงถึง (33, 0)" }
    answer: { value: 80, unit: m/min }
    hints:
      - "อัตราเร็ว = ระยะทาง ÷ เวลา หรือความชันของเส้นในช่วงนั้น"
      - "ใน 10 นาทีแรก ยายไปได้ไกลจากบ้านกี่เมตร"
    misconceptions:
      - { match: 800, feedback: "800 คือระยะทาง ยังต้องหารด้วยเวลา 10 นาที" }
      - { match: 0.0125, feedback: "หารกลับด้าน อัตราเร็วคือระยะทาง ÷ เวลา" }
    solution: "ใน 10 นาทีแรกไปได้ 800 เมตร อัตราเร็ว $= 800 \\div 10 = 80$ เมตรต่อนาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.functions.comparing-representations.p005
    topics: [math.functions.comparing-representations]
    difficulty: 2
    type: numeric
    stem: "จากกราฟระยะทางจากบ้านของยาย ยายอยู่ที่ตลาดนานกี่นาที (ตอบในหน่วยนาที)"
    figure: { src: distance-time.svg, alt: "กราฟระยะทางจากบ้าน (เมตร) กับเวลา (นาที) เป็นเส้นตรงจาก (0, 0) ขึ้นไปถึง (10, 800) จากนั้นราบที่ 800 เมตรจนถึงนาทีที่ 25 แล้วลงเป็นเส้นตรงถึง (33, 0)" }
    answer: { value: 15, unit: นาที }
    hints:
      - "ช่วงที่อยู่กับที่ ระยะทางจากบ้านไม่เปลี่ยน กราฟจึงราบ"
      - "ส่วนที่ราบเริ่มและจบที่นาทีใด"
    misconceptions:
      - { match: 25, feedback: "25 คือเวลาที่ออกจากตลาด ต้องลบเวลาที่มาถึง (นาทีที่ 10)" }
      - { match: 800, feedback: "800 คือระยะทาง ข้อนี้ถามระยะเวลา อ่านบนแกนนอน" }
    solution: "กราฟราบจากนาทีที่ 10 ถึงนาทีที่ 25 ยายอยู่ที่ตลาด $25 - 10 = 15$ นาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.functions.comparing-representations.p006
    topics: [math.functions.comparing-representations]
    difficulty: 3
    type: numeric
    stem: "ฟังก์ชัน A ให้ไว้เป็นตาราง: เมื่อ $x = 0, 2, 4, 6$ ได้ $y = 5, 11, 17, 23$ ตามลำดับ อัตราการเปลี่ยนแปลงของฟังก์ชัน A เท่าใด"
    answer: { value: 3 }
    hints:
      - "อัตราการเปลี่ยนแปลง $= \\dfrac{\\Delta y}{\\Delta x}$"
      - "ระหว่างสองแถวที่ติดกัน $y$ เพิ่ม 6 แต่ $x$ เพิ่มเท่าไร"
    misconceptions:
      - { match: 6, feedback: "ใช้แค่ผลต่างของ $y$ แต่ $x$ เพิ่มทีละ 2 ต้องหารด้วย 2" }
      - { match: 5, feedback: "5 คือค่าเริ่มต้น (ค่า $y$ เมื่อ $x = 0$) ไม่ใช่อัตราการเปลี่ยนแปลง" }
    solution: "$\\dfrac{11 - 5}{2 - 0} = \\dfrac{6}{2} = 3$ ตรวจคู่อื่น $\\dfrac{23 - 17}{6 - 4} = 3$ เท่ากัน ฟังก์ชัน A จึงเป็นเชิงเส้นและมีอัตรา 3"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.functions.comparing-representations.p007
    topics: [math.functions.comparing-representations]
    difficulty: 3
    type: mcq
    stem: "ฟังก์ชัน A เป็นตาราง $x = 0, 2, 4, 6$ ได้ $y = 5, 11, 17, 23$ ส่วนฟังก์ชัน B คือ $y = 2.5x + 8$ ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "A เพิ่มเร็วกว่า แต่ B มีค่าเริ่มต้นมากกว่า", correct: true }
      - { id: b, text: "B เพิ่มเร็วกว่า และ B มีค่าเริ่มต้นมากกว่า", feedback: "อัตราของ A คือ $\\tfrac{6}{2} = 3$ ซึ่งมากกว่า 2.5 ถ้าได้ 6 แสดงว่าลืมหารด้วยผลต่างของ $x$ แต่ 6 ก็ยังมากกว่า 2.5" }
      - { id: c, text: "A เพิ่มเร็วกว่า และ A มีค่าเริ่มต้นมากกว่า", feedback: "ค่าเริ่มต้นของ A คือ 5 (เมื่อ $x = 0$) ส่วนของ B คือ 8" }
      - { id: d, text: "ทั้งสองฟังก์ชันเพิ่มเร็วเท่ากัน", feedback: "หาอัตราของ A จากตาราง $\\tfrac{\\Delta y}{\\Delta x} = 3$ ไม่เท่ากับ 2.5" }
    hints:
      - "หาอัตราและค่าเริ่มต้นของ A จากตาราง"
      - "ของ B อ่านจาก $y = mx + c$ ได้ทันที"
    solution: "A: อัตรา $\\tfrac{6}{2} = 3$ ค่าเริ่มต้น 5 B: อัตรา 2.5 ค่าเริ่มต้น 8 A จึงเพิ่มเร็วกว่า แต่ B เริ่มสูงกว่า (สองฟังก์ชันเท่ากันเมื่อ $3x + 5 = 2.5x + 8$ คือ $x = 6$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.functions.comparing-representations.p008
    topics: [math.functions.comparing-representations]
    difficulty: 3
    type: expression
    stem: "ตารางแสดงความสัมพันธ์เชิงเส้น เมื่อ $x = 1, 2, 3, 4$ ได้ $y = 7, 10, 13, 16$ เขียนสมการของ $y$ ในรูปของ $x$"
    prefix: "y ="
    answer: { latex: "3x+4", variables: [x] }
    misconceptions:
      - { match: "3x+7", feedback: "ใช้ $y$ เมื่อ $x = 1$ เป็นค่าเริ่มต้น ค่าเริ่มต้นคือ $y$ เมื่อ $x = 0$ ย้อนจาก 7 ลงไป 3 ได้ 4" }
      - { match: "x+6", feedback: "$x$ เพิ่ม 1 แล้ว $y$ เพิ่ม 3 อัตราการเปลี่ยนแปลงจึงเป็น 3 ไม่ใช่ 1" }
    hints:
      - "อัตราการเปลี่ยนแปลง: $x$ เพิ่ม 1 แล้ว $y$ เพิ่มเท่าไร"
      - "หาค่า $y$ เมื่อ $x = 0$ โดยย้อนจาก $x = 1$ ลงไปหนึ่งขั้น"
    solution: "อัตรา $= 3$ ค่า $y$ เมื่อ $x = 0$ คือ $7 - 3 = 4$ จึงได้ $y = 3x + 4$ ตรวจ: $x = 4$ ได้ $3(4) + 4 = 16$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.functions.comparing-representations.p009
    topics: [math.functions.comparing-representations]
    difficulty: 3
    type: numeric
    stem: "กราฟแสดงค่าเช่าจักรยานของสองร้านในเชียงใหม่ ร้าน ก คิดค่ามัดจำแล้วบวกค่าเช่ารายชั่วโมง ร้าน ข คิดค่าเช่ารายชั่วโมงอย่างเดียว เช่ากี่ชั่วโมงสองร้านจึงคิดเงินเท่ากัน (ตอบในหน่วยชั่วโมง)"
    figure: { src: bike-rental.svg, alt: "กราฟค่าเช่า (บาท) กับเวลาเช่า (ชั่วโมง) 0 ถึง 8 ชั่วโมง เส้นร้าน ก เริ่มที่ 40 บาทและเพิ่มชั่วโมงละ 10 บาท ถึง 120 บาทที่ 8 ชั่วโมง เส้นร้าน ข เริ่มที่ 0 และเพิ่มชั่วโมงละ 20 บาท ถึง 160 บาทที่ 8 ชั่วโมง สองเส้นตัดกันหนึ่งจุด" }
    answer: { value: 4, unit: ชั่วโมง }
    hints:
      - "สองร้านคิดเงินเท่ากันที่จุดตัดของสองเส้น"
      - "อ่านค่าบนแกนนอนของจุดตัด หรือแก้ $40 + 10x = 20x$"
    misconceptions:
      - { match: 80, feedback: "80 บาทคือค่าเช่าที่จุดตัด ข้อนี้ถามจำนวนชั่วโมง" }
      - { match: 2, feedback: "ลองตรวจ: 2 ชั่วโมงร้าน ก คิด 60 บาท ร้าน ข คิด 40 บาท ยังไม่เท่ากัน" }
    solution: "สองเส้นตัดกันที่ $(4, 80)$ ตรวจด้วยสมการ $40 + 10x = 20x$ ได้ $10x = 40$, $x = 4$ ชั่วโมง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.functions.comparing-representations.p010
    topics: [math.functions.comparing-representations]
    difficulty: 3
    type: match
    stem: "จับคู่สถานการณ์กับสมการที่เหมาะสม"
    pairs:
      - { left: "เวลาที่ใช้เดินทาง 120 km เมื่อขับด้วยอัตราเร็ว x km/h", right: "$y = \\dfrac{120}{x}$" }
      - { left: "แบคทีเรีย 100 ตัวเพิ่มเป็นสองเท่าทุกชั่วโมง", right: "$y = 100 \\times 2^x$" }
      - { left: "ค่าเช่าจักรยาน มัดจำ 40 บาท บวกชั่วโมงละ 10 บาท", right: "$y = 40 + 10x$" }
      - { left: "ส้มกิโลกรัมละ 40 บาท", right: "$y = 40x$" }
    hints:
      - "สิ่งที่ยิ่งมากอีกสิ่งยิ่งน้อยในผลคูณคงที่ คือกราฟส่วนกลับ"
      - "เพิ่มเป็นเท่าตัวทุกช่วงเวลาคือเอกซ์โพเนนเชียล เพิ่มทีละเท่ากันคือเชิงเส้น"
    solution: "เวลา × อัตราเร็ว = 120 จึงเป็นส่วนกลับ แบคทีเรียคูณ 2 ทุกชั่วโมงเป็นเอกซ์โพเนนเชียล ค่าเช่ามีค่าเริ่มต้นจึงเป็น $40 + 10x$ ส่วนราคาส้มเป็นสัดส่วน $40x$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.functions.comparing-representations.p011
    topics: [math.functions.comparing-representations]
    difficulty: 4
    type: mcq
    stem: "ถ้าเช่าจักรยาน 6 ชั่วโมง ควรเช่าร้านใด และถูกกว่าอีกร้านกี่บาท (ร้าน ก: 40 + 10x บาท ร้าน ข: 20x บาท เมื่อ x เป็นจำนวนชั่วโมง)"
    figure: { src: bike-rental.svg, alt: "กราฟค่าเช่า (บาท) กับเวลาเช่า (ชั่วโมง) 0 ถึง 8 ชั่วโมง เส้นร้าน ก เริ่มที่ 40 บาทและเพิ่มชั่วโมงละ 10 บาท ถึง 120 บาทที่ 8 ชั่วโมง เส้นร้าน ข เริ่มที่ 0 และเพิ่มชั่วโมงละ 20 บาท ถึง 160 บาทที่ 8 ชั่วโมง สองเส้นตัดกันหนึ่งจุด" }
    choices:
      - { id: a, text: "ร้าน ก ถูกกว่า 20 บาท", correct: true }
      - { id: b, text: "ร้าน ข ถูกกว่า 20 บาท", feedback: "ร้าน ข ถูกกว่าเฉพาะเมื่อเช่าน้อยกว่า 4 ชั่วโมง หลังจุดตัดเส้นร้าน ข อยู่สูงกว่า" }
      - { id: c, text: "สองร้านคิดเท่ากัน", feedback: "เท่ากันที่ 4 ชั่วโมงเท่านั้น ที่ 6 ชั่วโมงร้าน ก คิด 100 บาท ร้าน ข คิด 120 บาท" }
      - { id: d, text: "ร้าน ก ถูกกว่า 40 บาท", feedback: "40 บาทคือค่ามัดจำ ลองคำนวณค่าเช่าของทั้งสองร้านที่ 6 ชั่วโมงแล้วลบกัน" }
    hints:
      - "ดูว่าที่ $x = 6$ เส้นใดอยู่ต่ำกว่า"
      - "คำนวณ $40 + 10(6)$ และ $20(6)$"
    solution: "ร้าน ก: $40 + 60 = 100$ บาท ร้าน ข: $20 \\times 6 = 120$ บาท ร้าน ก ถูกกว่า $120 - 100 = 20$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.functions.comparing-representations.p012
    topics: [math.functions.comparing-representations]
    difficulty: 4
    type: numeric
    stem: "รินน้ำร้อนชงชาทิ้งไว้ในห้อง กราฟแสดงอุณหภูมิของน้ำกับเวลา ประมาณจากกราฟว่าน้ำเย็นลงเหลือ $50^\\circ\\mathrm{C}$ เมื่อเวลาผ่านไปประมาณกี่นาที (ตอบในหน่วยนาที ละเอียดถึงครึ่งนาที)"
    figure: { src: cooling.svg, alt: "กราฟอุณหภูมิ (องศาเซลเซียส) กับเวลา (นาที) 0 ถึง 20 นาที เส้นตารางทุก 1 นาทีและทุก 5 องศา เส้นโค้งเริ่มที่ 95 องศาเมื่อเวลา 0 ลดลงเร็วในช่วงแรกแล้วช้าลง ผ่าน 60 องศาประมาณนาทีที่ 4 ผ่าน 40 องศาประมาณนาทีที่ 9 และเข้าใกล้ 28 องศาที่นาทีที่ 20" }
    answer: { value: 6.3, tolerance: 0.5, unit: นาที }
    hints:
      - "ลากเส้นแนวนอนจาก $50^\\circ\\mathrm{C}$ บนแกนตั้งไปชนเส้นโค้ง"
      - "จากจุดนั้นลากลงมาอ่านเวลาบนแกนนอน อยู่ระหว่างเส้นตารางสองเส้นใด"
    misconceptions:
      - { match: 10, feedback: "ที่นาทีที่ 10 น้ำเหลือประมาณ $39^\\circ\\mathrm{C}$ แล้ว ซึ่งเย็นกว่า $50^\\circ\\mathrm{C}$ อุณหภูมิไม่ได้ลดเป็นเส้นตรง" }
    solution: "เส้นแนวนอนที่ $50^\\circ\\mathrm{C}$ ชนกราฟระหว่างนาทีที่ 6 กับ 7 ใกล้ 6 มากกว่า ประมาณ 6 ถึง 6.5 นาที (ค่าจากสูตรที่ใช้วาดกราฟคือ 6.3 นาที)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.functions.comparing-representations.p013
    topics: [math.functions.comparing-representations]
    difficulty: 4
    type: numeric
    stem: "รถทัวร์ต้องเดินทาง 120 km เวลาที่ใช้ $t = \\dfrac{120}{v}$ ชั่วโมง เมื่อ $v$ เป็นอัตราเร็ว (km/h) ถ้าขับด้วยอัตราเร็ว 80 km/h จะใช้เวลากี่ชั่วโมง (ตอบในหน่วยชั่วโมง)"
    answer: { value: 1.5, tolerance: 0.01, unit: ชั่วโมง }
    hints:
      - "แทน $v = 80$"
      - "$t = 120 \\div 80$"
    misconceptions:
      - { match: 0.67, feedback: "หารกลับด้าน $80 \\div 120$ เวลา = ระยะทาง ÷ อัตราเร็ว" }
      - { match: 40, feedback: "ลบแทนการหาร ระยะทางกับอัตราเร็วสัมพันธ์กันแบบหาร" }
    solution: "$t = \\dfrac{120}{80} = 1.5$ ชั่วโมง (1 ชั่วโมง 30 นาที)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.functions.comparing-representations.p014
    topics: [math.functions.comparing-representations]
    difficulty: 4
    type: mcq
    stem: "ถังน้ำถูกเติมด้วยอัตราคงที่ 10 นาที จากนั้นหยุดเติม 5 นาที แล้วเปิดก๊อกปล่อยน้ำออกจนหมดด้วยอัตราที่เร็วกว่าตอนเติม กราฟปริมาณน้ำในถังกับเวลามีลักษณะใด"
    choices:
      - { id: a, text: "ขึ้นเป็นเส้นตรง แล้วราบ แล้วลงเป็นเส้นตรงที่ชันกว่าช่วงแรก", correct: true }
      - { id: b, text: "ขึ้นเป็นเส้นตรง แล้วราบ แล้วลงเป็นเส้นตรงที่ชันน้อยกว่าช่วงแรก", feedback: "ปล่อยน้ำออกเร็วกว่าตอนเติม ช่วงลงจึงต้องชันกว่า" }
      - { id: c, text: "ขึ้นเป็นเส้นโค้ง แล้วลงทันที", feedback: "เติมด้วยอัตราคงที่จึงเป็นเส้นตรง และมีช่วงหยุดเติมที่ปริมาณน้ำคงที่" }
      - { id: d, text: "ขึ้นเป็นเส้นตรง แล้วลงเป็นเส้นตรง แล้วราบ", feedback: "ลำดับผิด ช่วงหยุดเติม (ราบ) มาก่อนช่วงปล่อยน้ำ" }
    hints:
      - "อัตราคงที่ให้เส้นตรง ความชันคืออัตรา"
      - "หยุดเติมแต่ไม่ปล่อยน้ำ ปริมาณน้ำเป็นอย่างไร"
    solution: "เติมด้วยอัตราคงที่ → เส้นตรงขึ้น หยุดเติม → ปริมาณคงที่ เส้นราบ ปล่อยน้ำเร็วกว่าตอนเติม → เส้นตรงลงที่ชันกว่าช่วงแรก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.functions.comparing-representations.p015
    topics: [math.functions.comparing-representations]
    difficulty: 4
    type: numeric
    stem: "จากกราฟระยะทางจากบ้านของยาย (ไปตลาด 800 m แล้วกลับถึงบ้านนาทีที่ 33) ขากลับยายเดินด้วยอัตราเร็วกี่เมตรต่อนาที (ตอบในหน่วย m/min)"
    figure: { src: distance-time.svg, alt: "กราฟระยะทางจากบ้าน (เมตร) กับเวลา (นาที) เป็นเส้นตรงจาก (0, 0) ขึ้นไปถึง (10, 800) จากนั้นราบที่ 800 เมตรจนถึงนาทีที่ 25 แล้วลงเป็นเส้นตรงถึง (33, 0)" }
    answer: { value: 100, unit: m/min }
    hints:
      - "ขากลับเริ่มนาทีที่ 25 ถึงบ้านนาทีที่ 33 ใช้เวลากี่นาที"
      - "อัตราเร็ว = 800 ÷ เวลาขากลับ"
    misconceptions:
      - { match: 24.24, feedback: "หารด้วย 33 นาทีทั้งหมด ขากลับใช้เวลาเฉพาะนาทีที่ 25 ถึง 33" }
      - { match: -100, feedback: "ความชันเป็นลบเพราะระยะจากบ้านลดลง แต่อัตราเร็วเป็นขนาดจึงเป็นบวก" }
    solution: "ขากลับใช้เวลา $33 - 25 = 8$ นาที อัตราเร็ว $= 800 \\div 8 = 100$ เมตรต่อนาที เร็วกว่าขาไป (80) เส้นขากลับจึงชันกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.functions.comparing-representations.p016
    topics: [math.functions.comparing-representations]
    difficulty: 5
    type: numeric
    stem: "แบคทีเรียในจานเพาะเชื้อ A มีจำนวน $100 \\times 2^t$ ตัว ส่วนจาน B มี $1{,}000 + 500t$ ตัว เมื่อ $t$ เป็นจำนวนชั่วโมง ชั่วโมงเต็มแรกที่จาน A มีแบคทีเรียมากกว่าจาน B คือชั่วโมงที่เท่าใด"
    answer: { value: 6, unit: ชั่วโมง }
    hints:
      - "ทำตารางค่าของทั้งสองจานที่ $t = 0, 1, 2, \\ldots$"
      - "หาค่า $t$ แรกที่ $100 \\times 2^t > 1{,}000 + 500t$"
    misconceptions:
      - { match: 5, feedback: "ที่ $t = 5$ จาน A มี 3,200 ตัว จาน B มี 3,500 ตัว A ยังน้อยกว่า" }
      - { match: 4, feedback: "ที่ $t = 4$ จาน A มี 1,600 ตัว ซึ่งมากกว่าค่าเริ่มต้นของ B แต่ B มี 3,000 ตัวแล้ว" }
    solution: "$t = 4$: 1,600 กับ 3,000 $t = 5$: 3,200 กับ 3,500 $t = 6$: 6,400 กับ 4,000 จาน A แซงจาน B ครั้งแรกที่ชั่วโมงที่ 6 ฟังก์ชันเอกซ์โพเนนเชียลที่เพิ่มขึ้นแซงฟังก์ชันเชิงเส้นได้เสมอในที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.functions.comparing-representations.p017
    topics: [math.functions.comparing-representations]
    difficulty: 5
    type: numeric
    stem: "ฟังก์ชัน $f$ ให้เป็นตาราง: $x = 0, 1, 2, 3, 4$ ได้ $f(x) = 1, 4, 5, 4, 1$ (กราฟเป็นพาราโบลาที่สมมาตรรอบ $x = 2$) ส่วน $g(x) = -x^2 + 6x - 2$ ค่าสูงสุดของ $g$ มากกว่าค่าสูงสุดของ $f$ อยู่เท่าใด"
    answer: { value: 2 }
    hints:
      - "ค่าสูงสุดของ $f$ อ่านได้จากตารางที่จุดสมมาตร"
      - "ค่าสูงสุดของ $g$ อยู่ที่ $x = -\\tfrac{b}{2a} = 3$"
    misconceptions:
      - { match: 5, feedback: "5 คือค่าสูงสุดของ $f$ ข้อนี้ถามผลต่างของค่าสูงสุดทั้งสอง" }
      - { match: 1, feedback: "อาจแทน $x = 2$ ใน $g$ ได้ 6 แต่ค่าสูงสุดของ $g$ อยู่ที่ $x = 3$" }
    solution: "ค่าสูงสุดของ $f$ คือ 5 (ที่ $x = 2$) ค่าสูงสุดของ $g$ อยู่ที่ $x = \\tfrac{-6}{2(-1)} = 3$ ได้ $g(3) = -9 + 18 - 2 = 7$ ผลต่าง $7 - 5 = 2$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.functions.comparing-representations.p018
    topics: [math.functions.comparing-representations]
    difficulty: 5
    type: mcq
    stem: "กราฟของ $y = 2x + 1$ และ $y = -x + 7$ ตัดกันที่จุด $(2, 5)$ ข้อใดอธิบายจุดนี้ได้ถูกต้อง"
    choices:
      - { id: a, text: "$x = 2, y = 5$ ทำให้สมการทั้งสองเป็นจริงพร้อมกัน", correct: true }
      - { id: b, text: "$x = 2, y = 5$ ทำให้สมการแรกเป็นจริงเท่านั้น", feedback: "แทนในสมการที่สองก็ได้ $-2 + 7 = 5$ จริงเช่นกัน จุดตัดอยู่บนกราฟทั้งสองเส้น" }
      - { id: c, text: "จุดนี้เป็นจุดเดียวที่อยู่บนกราฟของ $y = 2x + 1$", feedback: "กราฟของสมการเป็นเซตของคำตอบทั้งหมด มีจุดนับไม่ถ้วน เช่น $(0, 1)$ ก็อยู่บนกราฟ" }
      - { id: d, text: "จุดนี้คือจุดที่ความชันของทั้งสองเส้นเท่ากัน", feedback: "ความชันเป็น 2 กับ $-1$ ไม่เท่ากัน ถ้าความชันเท่ากันเส้นจะขนานและไม่ตัดกัน" }
    hints:
      - "จุดบนกราฟคือคำตอบของสมการนั้น"
      - "จุดตัดอยู่บนกราฟทั้งสองเส้น"
    solution: "จุดตัดอยู่บนกราฟทั้งสอง จึงเป็นคำตอบของทั้งสองสมการพร้อมกัน ตรวจ: $2(2) + 1 = 5$ และ $-2 + 7 = 5$"
    license: CC-BY-SA-4.0
    ai_assisted: true
