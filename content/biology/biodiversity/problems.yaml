  - id: biology.diversity.biodiversity.p014
    topics: [biology.diversity.biodiversity]
    difficulty: 4
    type: mcq
    stem: "ถนนสายหนึ่งตัดผ่านผืนป่า มีสัตว์ป่าถูกรถชนบ่อย กรมทางหลวงเสนอ 3 ทางเลือก เกณฑ์คือ ลดการตายของสัตว์ และให้สัตว์ยังเดินไปมาระหว่างป่าสองฝั่งได้ ทางเลือกใดผ่านทั้งสองเกณฑ์"
    choices:
      - { id: a, text: "สร้างทางลอดหรือสะพานให้สัตว์ข้ามพร้อมรั้วนำทางเข้าสู่ทางข้าม", correct: true }
      - { id: b, text: "สร้างรั้วสูงกั้นตลอดแนวถนนโดยไม่มีทางข้าม", feedback: "ลดการตายได้ แต่ป่าถูกแบ่งเป็นสองผืน สัตว์ข้ามไปหาอาหารหรือคู่ผสมพันธุ์ไม่ได้ จึงไม่ผ่านเกณฑ์ที่สอง" }
      - { id: c, text: "ติดป้ายเตือนให้ผู้ขับขี่ระวังสัตว์ข้ามถนนเท่านั้น", feedback: "สัตว์ยังข้ามได้ แต่ป้ายอย่างเดียวลดการตายได้น้อย จึงไม่ผ่านเกณฑ์แรก" }
    hints:
      - "ตรวจทีละทางเลือกกับเกณฑ์ทั้งสองข้อ"
      - "การแบ่งป่าเป็นผืนเล็ก ๆ ทำให้ประชากรสัตว์แยกจากกัน"
    solution: "ทางเชื่อมป่า (ทางลอดหรือสะพาน) กับรั้วนำทางช่วยให้สัตว์ไม่ขึ้นมาบนถนน และยังเดินไปมาระหว่างป่าสองฝั่งได้ จึงผ่านทั้งสองเกณฑ์ แม้ค่าก่อสร้างสูงกว่า"
