<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" font-family="sans-serif">
<title>แจกลูกพยางค์ ข้าว และ กลาง เป็นพยัญชนะต้น สระ วรรณยุกต์ และตัวสะกด</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
</defs>
<rect x="0" y="0" width="640" height="250" fill="#fff"/>
<text x="20.0" y="34.0" font-size="30" text-anchor="start" fill="#111" font-weight="bold" >ข้าว</text>
<text x="95.0" y="34.0" font-size="24" text-anchor="start" fill="#111" font-weight="normal" >=</text>
<rect x="125.0" y="8.0" width="90.0" height="60.0" fill="#cfe3f7" stroke="#1f4e9c" stroke-width="1.5" rx="8"/><text x="170.0" y="50.0" font-size="32" text-anchor="middle" fill="#1f4e9c" font-weight="bold" >ข</text><text x="170.0" y="92.0" font-size="13" text-anchor="middle" fill="#222" font-weight="normal" >พยัญชนะต้น</text>
<text x="230.0" y="46.0" font-size="22" text-anchor="middle" fill="#111" font-weight="normal" >+</text>
<rect x="245.0" y="8.0" width="90.0" height="60.0" fill="#f8cfc9" stroke="#a32a1c" stroke-width="1.5" rx="8"/><text x="290.0" y="50.0" font-size="32" text-anchor="middle" fill="#a32a1c" font-weight="bold" >◌้</text><text x="290.0" y="92.0" font-size="13" text-anchor="middle" fill="#222" font-weight="normal" >วรรณยุกต์</text>
<text x="350.0" y="46.0" font-size="22" text-anchor="middle" fill="#111" font-weight="normal" >+</text>
<rect x="365.0" y="8.0" width="90.0" height="60.0" fill="#d6efd0" stroke="#2a6a2a" stroke-width="1.5" rx="8"/><text x="410.0" y="50.0" font-size="32" text-anchor="middle" fill="#2a6a2a" font-weight="bold" >◌า</text><text x="410.0" y="92.0" font-size="13" text-anchor="middle" fill="#222" font-weight="normal" >สระ</text>
<text x="470.0" y="46.0" font-size="22" text-anchor="middle" fill="#111" font-weight="normal" >+</text>
<rect x="485.0" y="8.0" width="90.0" height="60.0" fill="#fbeeb0" stroke="#7a5a00" stroke-width="1.5" rx="8"/><text x="530.0" y="50.0" font-size="32" text-anchor="middle" fill="#7a5a00" font-weight="bold" >ว</text><text x="530.0" y="92.0" font-size="13" text-anchor="middle" fill="#222" font-weight="normal" >ตัวสะกด</text>
<text x="20.0" y="140.0" font-size="30" text-anchor="start" fill="#111" font-weight="bold" >กลาง</text>
<text x="103.0" y="140.0" font-size="24" text-anchor="start" fill="#111" font-weight="normal" >=</text>
<rect x="125.0" y="114.0" width="130.0" height="60.0" fill="#cfe3f7" stroke="#1f4e9c" stroke-width="1.5" rx="8"/><text x="190.0" y="156.0" font-size="32" text-anchor="middle" fill="#1f4e9c" font-weight="bold" >กล</text><text x="190.0" y="198.0" font-size="13" text-anchor="middle" fill="#222" font-weight="normal" >พยัญชนะต้นควบกล้ำ</text>
<text x="270.0" y="152.0" font-size="22" text-anchor="middle" fill="#111" font-weight="normal" >+</text>
<rect x="285.0" y="114.0" width="90.0" height="60.0" fill="#d6efd0" stroke="#2a6a2a" stroke-width="1.5" rx="8"/><text x="330.0" y="156.0" font-size="32" text-anchor="middle" fill="#2a6a2a" font-weight="bold" >◌า</text><text x="330.0" y="198.0" font-size="13" text-anchor="middle" fill="#222" font-weight="normal" >สระ</text>
<text x="390.0" y="152.0" font-size="22" text-anchor="middle" fill="#111" font-weight="normal" >+</text>
<rect x="405.0" y="114.0" width="110.0" height="60.0" fill="#fbeeb0" stroke="#7a5a00" stroke-width="1.5" rx="8"/><text x="460.0" y="156.0" font-size="32" text-anchor="middle" fill="#7a5a00" font-weight="bold" >ง</text><text x="460.0" y="198.0" font-size="13" text-anchor="middle" fill="#222" font-weight="normal" >ตัวสะกด (แม่กง)</text>
<text x="20.0" y="240.0" font-size="13" text-anchor="start" fill="#444" font-weight="normal" >อ่าน: ข + อา + ว = ขาว เติมไม้โท ได้ ข้าว · กล + อา + ง = กลาง (ออกเสียง ก และ ล ควบกัน)</text>
</svg>
