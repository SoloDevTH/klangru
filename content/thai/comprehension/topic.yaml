id: thai.reading.comprehension
subject: thai
title: { th: การอ่านจับใจความและตอบคำถาม, en: "Reading for main ideas and answering questions" }
summary: ตั้งและตอบคำถาม 5W1H ระบุใจความสำคัญและรายละเอียดสนับสนุน เล่าเรื่องย่อ สรุปความรู้และข้อคิด และอ่านจับเวลาเพื่อตอบคำถามภายในเวลาที่กำหนด
difficulty: 3
minutes: 30
prerequisites: [thai.reading.word-meaning-in-context]
encompasses:
  - { id: thai.reading.word-meaning-in-context, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: main-idea-positions.svg
    alt: "ย่อหน้า 4 แบบ แต่ละแบบมีแถบแทนประโยค 5 แถบ แถบสีแดงคือประโยคใจความสำคัญ แถบสีเทาคือรายละเอียดสนับสนุน แบบที่ 1 ต้นย่อหน้า แถบแรกเป็นสีแดง แบบที่ 2 ท้ายย่อหน้า แถบสุดท้ายเป็นสีแดง แบบที่ 3 กลางย่อหน้า แถบที่สามเป็นสีแดง แบบที่ 4 ต้นและท้าย แถบแรกและแถบสุดท้ายเป็นสีแดง"
    caption: "ประโยคใจความสำคัญอยู่ได้หลายตำแหน่ง"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: หาใจความสำคัญและรายละเอียด
    problem: "ย่อหน้า: \"ต้นไม้ใหญ่ในชุมชนมีประโยชน์มาก ร่มเงาช่วยให้บ้านเย็นลง รากช่วยยึดดินไม่ให้พังทลาย และยังเป็นที่อยู่ของนกหลายชนิด\" หาใจความสำคัญและรายละเอียดสนับสนุน"
    steps:
      - text: "แบ่งประโยค: (1) ต้นไม้ใหญ่มีประโยชน์มาก (2) ร่มเงาทำให้บ้านเย็น (3) รากยึดดิน (4) เป็นที่อยู่ของนก"
      - text: "ทดสอบการคลุม: ประโยค (1) คลุม (2) (3) (4) ได้ทั้งหมด เพราะทั้งสามข้อเป็นประโยชน์ของต้นไม้"
        why: "ประโยคใดคลุมประโยคอื่นได้ทั้งหมด ประโยคนั้นคือใจความสำคัญ"
      - text: "ประโยค (2) (3) (4) แต่ละข้อคลุมกันเองไม่ได้ จึงเป็นรายละเอียดสนับสนุน"
      - text: "ตำแหน่ง: ใจความอยู่ต้นย่อหน้า"
    answer: "ใจความสำคัญ: ต้นไม้ใหญ่ในชุมชนมีประโยชน์มาก (ต้นย่อหน้า) รายละเอียด: ร่มเงา ยึดดิน ที่อยู่ของนก"
  - { type: check, problem: thai.reading.comprehension.p004, prompt: "ประโยคใดคลุมประโยคอื่นทั้งหมด" }
  - type: worked-example
    title: คำนวณความเร็วในการอ่าน
    problem: "อ่านบทความ 360 คำ ใช้เวลา 2 นาที 30 วินาที อ่านได้กี่คำต่อนาที"
    steps:
      - text: "แปลงเวลาเป็นนาที: 30 วินาที = 0.5 นาที รวม 2.5 นาที"
        why: "หน่วยคำตอบเป็นคำต่อนาที เวลาจึงต้องเป็นนาที"
      - text: "หาร: 360 ÷ 2.5 = 144"
      - text: "ตรวจความเข้าใจด้วย ตอบคำถามจากเรื่องได้ถูกหรือไม่"
    answer: "144 คำต่อนาที"
  - { type: check, problem: thai.reading.comprehension.p009, prompt: "แปลงวินาทีเป็นนาทีก่อน" }
glossary:
  - { term: ใจความสำคัญ, definition: "ข้อความหลักของย่อหน้าหรือเรื่อง คลุมรายละเอียดทั้งหมด" }
  - { term: รายละเอียดสนับสนุน, definition: "ข้อความที่อธิบาย ยกตัวอย่าง ให้ตัวเลขหรือเหตุผลประกอบใจความสำคัญ" }
  - { term: 5W1H, definition: "คำถาม ใคร ทำอะไร ที่ไหน เมื่อไร ทำไม อย่างไร" }
  - { term: เรื่องย่อ, definition: "การเล่าเฉพาะส่วนสำคัญของเรื่องด้วยคำของตนเอง" }
  - { term: ข้อคิด, definition: "สิ่งที่ได้จากเรื่องและนำไปใช้ในชีวิตได้" }
flashcards:
  - { front: "ใจความสำคัญอยู่ตรงไหนได้บ้าง", back: "ต้น กลาง ท้าย ต้นและท้ายย่อหน้า หรือไม่เขียนไว้ต้องสรุปเอง" }
  - { front: "ทดสอบว่าเป็นใจความสำคัญ", back: "ถามว่าประโยคนี้คลุมประโยคอื่นทั้งหมดได้หรือไม่" }
  - { front: "เรื่องย่อต้องมีอะไร", back: "ใคร อยู่ที่ไหน เกิดอะไร ทำอย่างไร และจบอย่างไร" }
  - { front: "ความเร็วในการอ่าน", back: "จำนวนคำ ÷ เวลาเป็นนาที = คำต่อนาที" }
