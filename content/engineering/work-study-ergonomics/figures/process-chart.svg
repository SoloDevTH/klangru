<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 706" width="720" height="706" font-family="sans-serif" font-size="14">
<title>แผนภูมิกระบวนการบรรจุน้ำพริกแกง</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15211e"/></marker></defs>
<rect x="0" y="0" width="720" height="706" fill="#ffffff"/>
<text x="360.0" y="32.0" text-anchor="middle" font-size="16" fill="#15211e" font-weight="bold">แผนภูมิกระบวนการ: บรรจุน้ำพริกแกงในถุง (ข้อมูลสมมติ)</text>
<text x="70.0" y="62.0" text-anchor="middle" font-size="13" fill="#15211e" font-weight="bold">ขั้น</text>
<text x="120.0" y="62.0" text-anchor="start" font-size="13" fill="#15211e" font-weight="bold">สัญลักษณ์และกิจกรรม</text>
<text x="70.0" y="113.0" text-anchor="middle" font-size="14" fill="#15211e" font-weight="bold">1</text>
<polygon points="106.0,96.0 134.0,96.0 120.0,121.0" fill="#6a4c93" stroke="#6a4c93" stroke-width="2"/>
<text x="160.0" y="113.0" text-anchor="start" font-size="15" fill="#15211e">เก็บวัตถุดิบไว้ในชั้นพัก</text>
<line x1="120.0" y1="124.0" x2="120.0" y2="150.0" stroke="#555555" stroke-width="1.5" stroke-dasharray="4 3"/>
