id: math.number.place-value
subject: math
title: { th: ค่าประจำหลัก, en: Place value }
summary: อ่านค่าของเลขโดดตามตำแหน่งหลัก เขียนจำนวนในรูปกระจาย เปรียบเทียบจำนวน และปัดเศษเป็นหลักสิบ ร้อย พัน หรือทศนิยมได้ถูกต้อง
difficulty: 1
minutes: 25
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: รวมกลุ่มสิบให้เป็นจำนวนเดียว
    problem: "4 ร้อย 23 สิบ 18 หน่วย คือจำนวนใด"
    steps:
      - text: "18 หน่วย = 1 สิบ กับ 8 หน่วย"
        why: "10 หน่วยรวมเป็น 1 สิบ หลักหน่วยเก็บได้มากที่สุด 9"
      - text: "สิบทั้งหมดคือ $23 + 1 = 24$ สิบ ซึ่ง 24 สิบ = 2 ร้อย กับ 4 สิบ"
      - text: "ร้อยทั้งหมดคือ $4 + 2 = 6$ ร้อย"
      - text: "เขียนตามหลัก: 6 ร้อย 4 สิบ 8 หน่วย คือ 648"
      - text: "ตรวจด้วยรูปกระจาย: $400 + 230 + 18 = 648$ ✓"
    answer: "648"
  - { type: check, problem: math.pv.p014, prompt: "นับบล็อกแล้วรวมกลุ่มสิบก่อนตอบ" }
  - type: worked-example
    title: คูณและหารด้วย 10, 100, 1,000 ด้วยการเลื่อนหลัก
    problem: "ยาเม็ดหนึ่งหนัก $0.25$ กรัม ยา 1,000 เม็ดหนักกี่กรัม และเชือกยาว $3.6$ เมตร แบ่ง 100 ท่อนเท่ากัน ท่อนละกี่เมตร"
    figure: { src: shift-chart.svg, alt: "ตารางหลักมีหลักร้อย สิบ หน่วย ส่วนสิบ ส่วนร้อย แถวบนเป็น 0.25 คือ 0 ในหลักหน่วย 2 ในหลักส่วนสิบ 5 ในหลักส่วนร้อย ลูกศรพาเลข 2 และ 5 เลื่อนไปทางซ้าย 3 หลัก แถวล่างเป็น 250 คือ 2 ในหลักร้อย 5 ในหลักสิบ 0 ในหลักหน่วย" }
    steps:
      - text: "คูณด้วย 1,000 คือคูณด้วย 10 สามครั้ง เลขโดดแต่ละตัวมีค่ามากขึ้น 10 เท่าสามครั้ง จึงเลื่อนไปทางซ้าย 3 หลัก"
        why: "แต่ละหลักมีค่าเป็น 10 เท่าของหลักทางขวา"
      - text: "เลข 2 จากหลักส่วนสิบไปอยู่หลักร้อย เลข 5 จากหลักส่วนร้อยไปอยู่หลักสิบ หลักหน่วยว่างเติม 0 ได้ $0.25 \\times 1{,}000 = 250$ กรัม"
      - text: "หารด้วย 100 คือเลื่อนเลขโดดไปทางขวา 2 หลัก: $3.6$ มีเลข 3 ในหลักหน่วย เลื่อนไปอยู่หลักส่วนร้อย"
      - text: "เลข 6 จากหลักส่วนสิบไปอยู่หลักส่วนพัน ได้ $3.6 \\div 100 = 0.036$ เมตร"
      - text: "ตรวจขนาด: ยา 1,000 เม็ดต้องหนักกว่า 1 เม็ดมาก และเชือกหนึ่งท่อนต้องสั้นกว่า 3.6 เมตรมาก ✓"
    answer: "ยา 1,000 เม็ดหนัก 250 กรัม เชือกท่อนละ 0.036 เมตร (3.6 เซนติเมตร)"
  - { type: check, problem: math.pv.p016, prompt: "เทียบค่าของเลข 7 ในสองหลักที่อยู่ติดกัน" }
  - type: interactive
    title: ปัด 3,476 เป็นหลักร้อยบนเส้นจำนวน
    caption: จุด A อยู่ระหว่าง 3,400 กับ 3,500 และเลยจุดกึ่งกลาง 3,450 ไปแล้ว จึงอยู่ใกล้ 3,500 มากกว่า ลองนึกว่าถ้าเป็น 3,449 จุดจะอยู่ฝั่งไหนของจุดกึ่งกลาง
    widget:
      kind: number-line
      min: 3400
      max: 3500
      points:
        - { value: 3476, label: "A = 3,476" }
        - { value: 3450, label: กึ่งกลาง }
      jumps:
        - { from: 3476, to: 3500, label: "ห่าง 24" }
        - { from: 3476, to: 3400, label: "ห่าง 76" }
  - type: simulation
    title: เปรียบเทียบจำนวน (PhET Number Compare)
    url: https://phet.colorado.edu/en/simulations/number-compare
    provider: phet
    note: ลองสร้างจำนวนสองจำนวนด้วยบล็อกหลักสิบและหลักหน่วย แล้วสังเกตว่าจำนวนที่มีหลักสิบมากกว่าจะมากกว่าเสมอ ไม่ว่าหลักหน่วยจะเป็นเท่าใด
glossary:
  - { term: เลขโดด, definition: "สัญลักษณ์ 0 ถึง 9 ที่ใช้เขียนจำนวน เช่น 3,476 ประกอบด้วยเลขโดด 3, 4, 7 และ 6" }
  - { term: ค่าประจำหลัก, definition: "ค่าของตำแหน่งแต่ละหลัก เช่น หลักร้อยมีค่าประจำหลัก 100 หลักส่วนสิบมีค่าประจำหลัก 0.1" }
  - { term: รูปกระจาย, definition: "การเขียนจำนวนเป็นผลบวกของค่าของเลขโดดแต่ละหลัก เช่น 3,476 = 3,000 + 400 + 70 + 6" }
  - { term: การปัดเศษ, definition: "การประมาณจำนวนให้เป็นค่าที่ใกล้ที่สุดของหลักที่ต้องการ โดยดูเลขโดดในหลักถัดไปทางขวา" }
flashcards:
  - { front: "ค่าของเลขโดด 4 ใน 3,476 คือเท่าใด", back: "4 อยู่ในหลักร้อย จึงมีค่า 400" }
  - { front: "กติกาการปัดเศษคืออะไร", back: "ดูเลขโดดในหลักถัดไปทางขวาของหลักที่จะปัด ถ้าเป็น 5 ขึ้นไปให้ปัดขึ้น ถ้าน้อยกว่า 5 ให้ปัดลง ดูเพียงหลักเดียว" }
  - { front: "0.5 กับ 0.45 จำนวนใดมากกว่า", back: "0.5 มากกว่า เพราะเทียบหลักส่วนสิบก่อน 5 มากกว่า 4 จำนวนหลักหลังจุดไม่ได้บอกว่าใครมากกว่า" }
  - { front: "เขียน สามหมื่นสี่สิบ เป็นตัวเลข", back: "30,040 ต้องใส่ 0 ในหลักพัน หลักร้อย และหลักหน่วยที่ไม่มีค่า" }
