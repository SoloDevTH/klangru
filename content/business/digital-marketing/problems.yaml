  stem: ร้านอยากได้ลูกค้าใหม่ $300$ รายต่อเดือนจากโฆษณา (สมมติ) คาดว่า CTR $2\%$ อัตราการเปลี่ยนเป็นผู้ซื้อ $4\%$ ของผู้คลิก และค่าโฆษณาคิด $50$ บาทต่อการแสดง $1{,}000$ ครั้ง ต้องใช้งบโฆษณาประมาณกี่บาท (ตอบเป็นบาท)
  answer:
    value: 18750
    unit: บาท
  misconceptions:
  - match: 18750000
    feedback: ลืมว่าราคาคิดต่อ 1,000 ครั้ง
  - match: 375
    feedback: นั่นคือจำนวนชุดละพันครั้ง ยังไม่ได้คูณราคา
  hints:
  - 'ย้อนกรวย: ต้องการผู้คลิกกี่คนจึงได้ผู้ซื้อ $300$ คน'
  - จำนวนครั้งที่แสดง $=$ คลิก $\div$ CTR แล้วคิดค่าโฆษณาต่อ $1{,}000$ ครั้ง
  solution: คลิกที่ต้องการ $= 300 \div 0.04 = 7{,}500$ คลิก จำนวนครั้งที่แสดง $= 7{,}500 \div 0.02 = 375{,}000$ ครั้ง งบ $= 375 \times 50 = 18{,}750$ บาท (CAC ที่คาด $= 62.50$ บาท)
