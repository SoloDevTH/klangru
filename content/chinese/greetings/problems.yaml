- id: chinese.vocab.greetings.p018
  topics:
  - chinese.vocab.greetings
  difficulty: 5
  type: mcq
  stem: บทสนทนาข้อใด **ใช้คำตอบผิดสถานการณ์**
  choices:
  - id: a
    text: A：谢谢你的帮助！ B：不用谢。
    feedback: ถูกต้องแล้ว 不用谢 ใช้ตอบคำขอบคุณ
  - id: b
    text: A：王老师好！ B：你好！
    feedback: ถูกต้องแล้ว ครูตอบคำทักทายของนักเรียน
  - id: c
    text: A：明天见！ B：明天见！
    feedback: ถูกต้องแล้ว 明天见 แปลว่า พรุ่งนี้เจอกัน ตอบด้วยคำเดิมได้
  - id: d
    text: A：对不起，我来晚了。 B：不客气。
    correct: true
    feedback: ถูก A ขอโทษที่มาสาย B ควรตอบ 没关系 ไม่ใช่ 不客气 ซึ่งใช้ตอบคำขอบคุณ
  hints:
  - หาคำว่า ขอโทษ ขอบคุณ ทักทาย และลา ในแต่ละข้อ
  - 'จับคู่: ขอบคุณ ↔ 不客气/不用谢 · ขอโทษ ↔ 没关系'
  solution: 'ข้อ A: 对不起，我来晚了 (ขอโทษที่มาสาย) ต้องตอบ **没关系** การตอบ 不客气 ผิดสถานการณ์ ส่วนข้ออื่นถูกต้อง'
