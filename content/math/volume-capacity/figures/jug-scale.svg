<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320" font-family="sans-serif" font-size="16">
  <title>เหยือกตวงขนาด 1 ลิตร มีน้ำ 700 มิลลิลิตร</title>
  <rect x="0" y="0" width="520" height="320" fill="#ffffff"/>
  <rect x="70.0" y="136.0" width="140.0" height="154.0" rx="0" fill="#bfdbfe" stroke="none" stroke-width="0"/>
  <line x1="70.0" y1="136.0" x2="210.0" y2="136.0" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 70 30 L 70 282 Q 70 290 78 290 L 202 290 Q 210 290 210 282 L 210 30" fill="none" stroke="#15211e" stroke-width="2.5"/>
  <path d="M 210 50 C 260 50 260 177.5 210 190.0" fill="none" stroke="#15211e" stroke-width="6"/>
  <line x1="70.0" y1="268.0" x2="86.0" y2="268.0" stroke="#15211e" stroke-width="1.4" stroke-linecap="butt"/>
  <line x1="70.0" y1="246.0" x2="98.0" y2="246.0" stroke="#15211e" stroke-width="2" stroke-linecap="butt"/>
  <text x="104.0" y="251.0" font-size="14" text-anchor="start" fill="#15211e">200</text>
  <line x1="70.0" y1="224.0" x2="86.0" y2="224.0" stroke="#15211e" stroke-width="1.4" stroke-linecap="butt"/>
  <line x1="70.0" y1="202.0" x2="98.0" y2="202.0" stroke="#15211e" stroke-width="2" stroke-linecap="butt"/>
  <text x="104.0" y="207.0" font-size="14" text-anchor="start" fill="#15211e">400</text>
  <line x1="70.0" y1="180.0" x2="86.0" y2="180.0" stroke="#15211e" stroke-width="1.4" stroke-linecap="butt"/>
  <line x1="70.0" y1="158.0" x2="98.0" y2="158.0" stroke="#15211e" stroke-width="2" stroke-linecap="butt"/>
  <text x="104.0" y="163.0" font-size="14" text-anchor="start" fill="#15211e">600</text>
  <line x1="70.0" y1="136.0" x2="86.0" y2="136.0" stroke="#15211e" stroke-width="1.4" stroke-linecap="butt"/>
  <line x1="70.0" y1="114.0" x2="98.0" y2="114.0" stroke="#15211e" stroke-width="2" stroke-linecap="butt"/>
  <text x="104.0" y="119.0" font-size="14" text-anchor="start" fill="#15211e">800</text>
  <line x1="70.0" y1="92.0" x2="86.0" y2="92.0" stroke="#15211e" stroke-width="1.4" stroke-linecap="butt"/>
  <line x1="70.0" y1="70.0" x2="98.0" y2="70.0" stroke="#15211e" stroke-width="2" stroke-linecap="butt"/>
  <text x="104.0" y="75.0" font-size="14" text-anchor="start" fill="#15211e">1,000</text>
  <text x="140.0" y="22.0" font-size="14" text-anchor="middle" fill="#6b7a76">มล.</text>
  <text x="300.0" y="100.0" font-size="15" text-anchor="start" fill="#15211e">ระหว่าง 200 กับ 400 มี 2 ช่อง</text>
  <text x="300.0" y="128.0" font-size="15" text-anchor="start" fill="#15211e">1 ช่อง = 100 มิลลิลิตร</text>
  <text x="300.0" y="170.0" font-size="15" text-anchor="start" fill="#15211e">ระดับน้ำอยู่ที่ขีดเหนือ 600</text>
  <text x="300.0" y="198.0" font-size="15" text-anchor="start" fill="#15211e">ไป 1 ช่อง</text>
  <text x="300.0" y="240.0" font-size="17" text-anchor="start" fill="#0a6b60" font-weight="bold">น้ำ 700 มิลลิลิตร</text>
</svg>
