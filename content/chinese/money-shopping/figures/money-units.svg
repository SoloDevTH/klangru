<text x="360.0" y="362.0" font-size="15" text-anchor="middle" fill="#b3261e" font-weight="normal">หน่วยสุดท้ายละได้ · 2 หยวน = 两块 · ช่องว่างใช้ 零: ¥3.05 = 三块零五 (分)</text>
