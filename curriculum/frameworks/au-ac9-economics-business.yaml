          - { id: "AC9HE10S05", level: "10", text: "create descriptions, explanations and arguments, using economic and business knowledge, concepts and terms that incorporate and acknowledge research findings", note: "ข้อความตามเอกสาร curriculum content (Word) เว็บไซต์ ACARA พิมพ์ว่า \"create descriptions, explanations and arguments, using economic and business knowledge, concepts and terms that incorporate and acknowledge and research findings\" (มีคำว่า and เกิน)" }
