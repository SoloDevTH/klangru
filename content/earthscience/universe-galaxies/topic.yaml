id: earthscience.astronomy.universe-galaxies
subject: earthscience
title: { th: กำเนิดเอกภพและกาแล็กซี, en: "The origin of the universe and galaxies" }
summary: ทฤษฎีบิกแบงและการเปลี่ยนแปลงพลังงาน สสาร ขนาด และอุณหภูมิของเอกภพ กฎของฮับเบิล ไมโครเวฟพื้นหลัง องค์ประกอบของสสาร โครงสร้างทางช้างเผือก และปีแสง
difficulty: 6
minutes: 40
prerequisites: [physics.waves.electromagnetic-waves, earthscience.astronomy.space-exploration]
encompasses:
  - { id: physics.waves.electromagnetic-waves, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: โครงสร้างของกาแล็กซีทางช้างเผือก
    src: milky-way.svg
    alt: "สองภาพ ซ้าย มองจากด้านบน กาแล็กซีกังหันมีคานสีเหลืองที่ใจกลาง แขนกังหันเป็นจุดดาวสีขาว ระบบสุริยะเป็นจุดสีเหลืองบนแขนห่างใจกลางราว 26,000 ปีแสง เส้นผ่านศูนย์กลางราว 100,000 ปีแสง ขวา มองจากด้านข้าง จานบางแบนยาว มีส่วนป่องใจกลางรูปไข่ ฮาโลเป็นวงรีเส้นประล้อมรอบ มีกระจุกดาวทรงกลมเป็นจุดส้มกระจายในฮาโล ระบบสุริยะอยู่ในจานค่อนไปทางซ้าย ลูกศรสีแดงชี้ไปตามแนวจานทั้งสองทาง เขียนว่ามองตามแนวจานเห็นดาวหนาแน่น จึงเห็นทางช้างเผือกเป็นแถบ จานหนาราว 1,000 ปีแสง"
    caption: "ภาพแบบง่าย ภาพด้านข้างไม่ได้ตามมาตราส่วน (วาดโดยทีมคลังรู้)"
  - { type: check, problem: earthscience.astronomy.universe-galaxies.p005, prompt: "เราอยู่ในส่วนใดของกาแล็กซี" }
  - type: figure
    title: วิวัฒนาการของเอกภพ
    src: timeline.svg
    alt: "เส้นเวลาหลังบิกแบงแบบลอการิทึม จาก 10 ยกกำลังลบ 43 วินาทีถึงปัจจุบัน แถบสีจากเหลืองอ่อนเป็นส้มแล้วเป็นน้ำเงินเข้ม แสดงว่าเอกภพเย็นลง เหตุการณ์เรียงกัน ยุคพลังค์ราว 10^-43 s การพองตัวราว 10^-36 ถึง 10^-32 s ควาร์กรวมเป็นโปรตอนและนิวตรอนราว 10^-6 s เกิดนิวเคลียส H และ He ราว 3–20 นาที อะตอมเกิด แสงเดินทางอิสระราว 380,000 ปี อุณหภูมิราว 3,000 K ดาวและกาแล็กซีแรกราว 100–200 ล้านปี ระบบสุริยะเกิดราว 9,200 ล้านปี ปัจจุบัน 13,800 ล้านปี อุณหภูมิ 2.7 K"
    caption: "ค่าเวลาเป็นค่าประมาณ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: จากการเลื่อนไปทางแดงถึงระยะทาง
    problem: "เส้น H-alpha ($\\lambda_0 = 656.3$ nm) ในสเปกตรัมของกาแล็กซีหนึ่งวัดได้ 669.4 nm ใช้ $c = 3.00 \\times 10^5$ km/s และ $H_0 = 70$ km/s/Mpc หาระยะทางของกาแล็กซี"
    steps:
      - text: "$z = \\dfrac{669.4 - 656.3}{656.3} = \\dfrac{13.1}{656.3} = 0.0200$"
        why: "ความยาวคลื่นยาวขึ้น แปลว่ากาแล็กซีถอยห่าง"
      - text: "$z$ น้อย จึงใช้ $v \\approx cz = 3.00 \\times 10^5 \\times 0.0200 = 6{,}000$ km/s"
      - text: "จากกฎของฮับเบิล $d = v/H_0 = 6{,}000/70 \\approx 86$ Mpc"
      - text: "แปลงเป็นปีแสง $86 \\times 3.26 \\approx 280$ ล้านปีแสง แสงที่เห็นจึงออกเดินทางมาราว 280 ล้านปีก่อน"
    answer: "ประมาณ 86 Mpc หรือราว 280 ล้านปีแสง"
  - type: interactive
    title: กฎของฮับเบิล
    caption: "เส้นคือ $v = H_0 d$ เมื่อ $x$ คือระยะทาง (Mpc) และแกนตั้งคือความเร็วถอยห่าง (km/s) ลองเปลี่ยน $H$ ระหว่าง 67 กับ 73 ซึ่งเป็นช่วงที่วิธีวัดต่างกันให้ แล้วดูว่ากาแล็กซีที่ 150 Mpc ถอยห่างเร็วต่างกันเท่าใด"
    widget:
      kind: function-plot
      functions: ["H x"]
      sliders:
        - { name: H, min: 50, max: 90, step: 1, value: 70, label: ค่าคงตัวของฮับเบิล (km/s/Mpc) }
      x: [0, 200]
      y: [0, 16000]
  - { type: check, problem: earthscience.astronomy.universe-galaxies.p007, prompt: "ใช้ $v = H_0 d$" }
  - type: worked-example
    title: เอกภพเย็นลงเมื่อขยายตัว
    problem: "เมื่อเอกภพมีอายุราว 380,000 ปี อุณหภูมิราว 3,000 K แสงจากตอนนั้นมีความยาวคลื่นที่เข้มสุดเท่าใด และตอนนี้เป็นเท่าใด"
    steps:
      - text: "กฎของวีน $\\lambda_{\\max} = 2.898 \\times 10^{-3}/T$"
      - text: "ตอนนั้น: $\\lambda_{\\max} = 2.898 \\times 10^{-3}/3{,}000 = 9.7 \\times 10^{-7}$ m หรือ 970 nm เป็นอินฟราเรดใกล้ ติดกับแสงสีแดง"
      - text: "ปัจจุบัน $T = 2.725$ K: $\\lambda_{\\max} = 1.06 \\times 10^{-3}$ m หรือ 1.06 mm เป็นไมโครเวฟ"
        why: "อวกาศขยายตัว ความยาวคลื่นถูกยืดตาม อุณหภูมิจึงลดลงในอัตราส่วนเดียวกัน"
      - text: "อัตราส่วน $1.06 \\times 10^{-3} / 9.7 \\times 10^{-7} \\approx 1{,}100$ เอกภพขยายตัวมาแล้วราว 1,100 เท่า"
    answer: "จากราว 970 nm เป็นราว 1.06 mm ยืดออกราว 1,100 เท่า"
  - type: simulation
    title: "สเปกตรัมของวัตถุดำ (PhET Blackbody Spectrum)"
    url: https://phet.colorado.edu/en/simulations/blackbody-spectrum
    provider: phet
    note: "ลดอุณหภูมิลงแล้วสังเกตว่ายอดของสเปกตรัมเลื่อนไปทางความยาวคลื่นยาว และความเข้มรวมลดลง ใช้อธิบายว่าทำไมแสงจากเอกภพยุคร้อนกลายเป็นไมโครเวฟเมื่อเอกภพเย็นลง"
glossary:
  - { term: ปีแสง, definition: "ระยะที่แสงเดินทางได้ใน 1 ปี ประมาณ 9.46 × 10¹² กิโลเมตร เป็นหน่วยระยะทาง" }
  - { term: กาแล็กซี, definition: "ระบบของดาวฤกษ์ แก๊ส ฝุ่น และสสารมืดจำนวนมหาศาลที่ยึดกันด้วยแรงโน้มถ่วง" }
  - { term: ทฤษฎีบิกแบง, definition: "ทฤษฎีที่ว่าเอกภพเริ่มจากสภาพร้อนและหนาแน่นมากเมื่อราว 13,800 ล้านปีก่อน แล้วขยายตัวและเย็นลง" }
  - { term: การเลื่อนไปทางแดง, definition: "การที่เส้นสเปกตรัมของวัตถุมีความยาวคลื่นยาวขึ้น z = (λ วัด − λ0)/λ0 บอกว่าวัตถุถอยห่าง" }
  - { term: กฎของฮับเบิล, definition: "ความเร็วถอยห่างของกาแล็กซีแปรผันตรงกับระยะทาง v = H0 d" }
  - { term: ไมโครเวฟพื้นหลังจากอวกาศ, definition: "รังสีอุณหภูมิ 2.725 K ที่มาจากทุกทิศ เป็นแสงจากเอกภพเมื่ออายุราว 380,000 ปีที่ถูกยืดความยาวคลื่น" }
flashcards:
  - { front: "หลักฐานสามข้อของบิกแบง", back: "กฎของฮับเบิล (การขยายตัว) ไมโครเวฟพื้นหลัง 2.7 K และสัดส่วน H ราว 75% He ราว 25% โดยมวล" }
  - { front: "กฎของฮับเบิล", back: "$v = H_0 d$ โดย $H_0 \\approx 70$ km/s/Mpc" }
  - { front: "ระบบสุริยะอยู่ตรงไหนในทางช้างเผือก", back: "ในจาน บนแขนย่อยนายพราน ห่างใจกลางราว 26,000 ปีแสง" }
  - { front: "ทำไมเห็นทางช้างเผือกเป็นแถบ", back: "เราอยู่ในจานที่แบน มองตามแนวจานจึงเห็นดาวซ้อนกันหนาแน่น" }
  - { front: "อะตอมแรกเกิดเมื่อใด", back: "ราว 380,000 ปีหลังบิกแบง อุณหภูมิราว 3,000 K แสงจึงเดินทางได้อิสระ" }
