problems:
  - id: business.econ.scarcity-choice.p001
    topics: [business.econ.scarcity-choice]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็น **บริการ**"
    choices:
      - { id: a, text: "ช่างตัดผมให้ลูกค้าที่ร้านในตลาด", correct: true }
      - { id: b, text: "ข้าวสารหนึ่งถุง", feedback: "ข้าวสารจับต้องได้ เป็นสินค้า" }
      - { id: c, text: "สมุดการบ้าน", feedback: "สมุดจับต้องได้ เป็นสินค้า" }
      - { id: d, text: "รองเท้านักเรียน", feedback: "รองเท้าจับต้องได้ เป็นสินค้า" }
    hints:
      - "บริการคือการกระทำที่คนอื่นทำให้เรา"
      - "หาข้อที่จับต้องไม่ได้"
    solution: "การตัดผมเป็นการกระทำที่ช่างทำให้ลูกค้า จับต้องไม่ได้ จึงเป็นบริการ ส่วนข้าวสาร สมุด และรองเท้าเป็นสินค้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.scarcity-choice.p002
    topics: [business.econ.scarcity-choice]
    difficulty: 1
    type: match
    stem: "จับคู่ตัวอย่างกับคำที่ถูกต้อง"
    pairs:
      - { left: "ขนมปังหนึ่งถุง", right: "สินค้า" }
      - { left: "หมอตรวจรักษาคนไข้", right: "บริการ" }
      - { left: "ยารักษาโรคเมื่อไม่สบาย", right: "ความจำเป็น" }
      - { left: "ตุ๊กตาตัวที่สิบ", right: "ความต้องการ" }
    hints:
      - "สินค้าจับต้องได้ บริการเป็นการกระทำที่คนอื่นทำให้"
      - "ความจำเป็นคือสิ่งที่ขาดไม่ได้ ความต้องการคือสิ่งที่อยากได้เพิ่ม"
    solution: "ขนมปัง → สินค้า · หมอตรวจรักษา → บริการ · ยาเมื่อป่วย → ความจำเป็น (ปัจจัย 4) · ตุ๊กตาตัวที่สิบ → ความต้องการ (ไม่มีก็อยู่ได้)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.scarcity-choice.p003
    topics: [business.econ.scarcity-choice]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็น **ความจำเป็น** ในการดำรงชีวิต"
    choices:
      - { id: a, text: "บ้านที่กันแดดกันฝนได้", correct: true }
      - { id: b, text: "โทรศัพท์รุ่นใหม่ล่าสุด", feedback: "โทรศัพท์รุ่นเดิมก็ใช้ได้ รุ่นใหม่เป็นความต้องการ" }
      - { id: c, text: "ชานมไข่มุกแก้วใหญ่", feedback: "ไม่มีก็ยังอยู่ได้ เป็นความต้องการ" }
      - { id: d, text: "รองเท้ากีฬาคู่ที่สาม", feedback: "มีรองเท้าใช้แล้ว คู่ที่สามเป็นความต้องการ" }
    hints:
      - "ความจำเป็นคือสิ่งที่ขาดแล้วใช้ชีวิตลำบาก"
      - "นึกถึงปัจจัย 4: อาหาร เครื่องนุ่งห่ม ที่อยู่อาศัย ยารักษาโรค"
    solution: "ที่อยู่อาศัยเป็นหนึ่งในปัจจัย 4 จึงเป็นความจำเป็น ข้ออื่นเป็นสิ่งที่อยากได้เพิ่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.scarcity-choice.p004
    topics: [business.econ.scarcity-choice]
    difficulty: 1
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นการใช้ทรัพยากรอย่าง **ประหยัด** (เลือกได้มากกว่าหนึ่งข้อ)"
    choices:
      - { id: a, text: "ปิดน้ำขณะแปรงฟัน", correct: true }
      - { id: b, text: "เขียนกระดาษทั้งสองหน้า", correct: true }
      - { id: c, text: "ปิดไฟและพัดลมเมื่อออกจากห้อง", correct: true }
      - { id: d, text: "เปิดแอร์ทิ้งไว้ให้ห้องเย็นรอตอนกลับมา", feedback: "เปิดทิ้งไว้ตอนไม่มีคนใช้ไฟฟ้าโดยไม่จำเป็น" }
      - { id: e, text: "ตักอาหารมาเยอะแล้วกินไม่หมด", feedback: "อาหารที่เหลือทิ้งคือทรัพยากรที่เสียเปล่า" }
    hints:
      - "ประหยัดคือใช้เท่าที่จำเป็น ไม่ทิ้งให้เสียเปล่า"
      - "ดูว่าข้อใดใช้น้ำ ไฟ กระดาษ อาหาร โดยไม่มีใครได้ประโยชน์"
    solution: "ปิดน้ำขณะแปรงฟัน ใช้กระดาษสองหน้า และปิดไฟเมื่อออกจากห้อง เป็นการใช้อย่างประหยัด ส่วนเปิดแอร์ทิ้งไว้และตักอาหารเกินแล้วทิ้ง เป็นการใช้ทรัพยากรสูญเปล่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.scarcity-choice.p005
    topics: [business.econ.scarcity-choice]
    difficulty: 2
    type: numeric
    stem: "วันอาทิตย์ ต้นมีเวลาว่างครึ่งวัน ทำได้อย่างเดียว คือ ช่วยแม่ขายของได้ค่าขนม 100 บาท รับจ้างล้างรถได้ 80 บาท หรือไปเล่นฟุตบอลกับเพื่อน ต้นเลือกไปเล่นฟุตบอล ค่าเสียโอกาสของการเล่นฟุตบอลเท่ากับกี่บาท (ตอบเป็นบาท)"
    answer: { value: 100, unit: บาท }
    hints:
      - "ค่าเสียโอกาสคือคุณค่าของทางเลือกที่ดีที่สุดที่ไม่ได้เลือก"
      - "ทางที่ไม่ได้เลือกมีสองทาง ให้ดูว่าทางใดให้ค่ามากกว่า แล้วนับเพียงทางเดียว"
    misconceptions:
      - { match: 180, feedback: "บวกสองทางเลือกเข้าด้วยกัน แต่ต้นทำได้อย่างเดียว จึงนับเฉพาะทางที่ดีที่สุดที่สละไป" }
      - { match: 80, feedback: "ล้างรถได้ 80 บาท แต่ช่วยแม่ขายของได้ 100 บาท ซึ่งดีกว่า ทางที่ดีที่สุดที่สละไปคือช่วยแม่" }
    solution: "ทางที่ไม่ได้เลือกคือ ช่วยแม่ (100 บาท) และล้างรถ (80 บาท) ทางที่ดีที่สุดคือช่วยแม่ ค่าเสียโอกาสจึงเท่ากับ 100 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.scarcity-choice.p006
    topics: [business.econ.scarcity-choice]
    difficulty: 2
    type: mcq
    stem: "ทำไมคนและสังคมจึงต้อง **เลือก** ว่าจะใช้ทรัพยากรทำอะไร"
    choices:
      - { id: a, text: "เพราะความต้องการมีไม่จำกัด แต่ทรัพยากรมีจำกัด", correct: true }
      - { id: b, text: "เพราะทรัพยากรมีมากเกินไปจนใช้ไม่หมด", feedback: "ถ้าทรัพยากรมีมากพอทุกอย่าง ก็ไม่ต้องเลือก" }
      - { id: c, text: "เพราะคนมีความต้องการจำกัด", feedback: "ความต้องการของคนไม่จำกัด ได้แล้วก็อยากได้อีก" }
      - { id: d, text: "เพราะรัฐบาลสั่งให้เลือก", feedback: "การเลือกเกิดขึ้นทุกวันในชีวิตของทุกคน ไม่ใช่เพราะมีคำสั่ง" }
    hints:
      - "นึกถึงคำว่า ความขาดแคลน"
      - "เปรียบเทียบสิ่งที่อยากได้กับสิ่งที่มี"
    solution: "ความต้องการไม่จำกัดแต่ทรัพยากรมีจำกัด จึงเกิดความขาดแคลน ทำให้ต้องเลือก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.scarcity-choice.p007
    topics: [business.econ.scarcity-choice]
    difficulty: 2
    type: match
    stem: "ร้านข้าวมันไก่ของป้าแดงที่เชียงใหม่ใช้ทรัพยากรต่อไปนี้ จับคู่กับกลุ่มของทรัพยากร"
    pairs:
      - { left: "ข้าวสารและน้ำ", right: "ทรัพยากรธรรมชาติ" }
      - { left: "ป้าแดงและลูกจ้างที่สับไก่", right: "ทรัพยากรมนุษย์ (แรงงาน)" }
      - { left: "หม้อหุงข้าวและตู้กระจกโชว์ไก่", right: "ทุน" }
    hints:
      - "ทรัพยากรธรรมชาติมาจากธรรมชาติ แรงงานคือคน"
      - "ทุนคือสิ่งที่คนสร้างขึ้นเพื่อใช้ผลิตต่อ"
    solution: "ข้าวสารและน้ำ → ทรัพยากรธรรมชาติ · คนทำงาน → ทรัพยากรมนุษย์ · หม้อและตู้ → ทุน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.scarcity-choice.p008
    topics: [business.econ.scarcity-choice]
    difficulty: 3
    type: numeric
    stem: "ชาวนาที่สุพรรณบุรีมีที่นา 8 ไร่ ถ้าปลูกข้าวได้กำไรไร่ละ 3,000 บาท ถ้าปลูกข้าวโพดได้กำไรไร่ละ 2,500 บาท (ตัวเลขสมมติ) ชาวนาเลือกปลูกข้าวเต็มทั้ง 8 ไร่ ค่าเสียโอกาสของการเลือกนี้เท่ากับกี่บาท (ตอบเป็นบาท)"
    answer: { value: 20000, unit: บาท }
    hints:
      - "ทางเลือกที่ไม่ได้เลือกคือปลูกข้าวโพด"
      - "หาว่าถ้าปลูกข้าวโพดทั้ง 8 ไร่จะได้กำไรเท่าใด"
    misconceptions:
      - { match: 24000, feedback: "นั่นคือกำไรจากข้าวที่เลือก ค่าเสียโอกาสคือกำไรจากทางที่ไม่ได้เลือก" }
      - { match: 44000, feedback: "บวกกำไรทั้งสองทาง แต่ที่นาปลูกได้อย่างเดียว ค่าเสียโอกาสคือข้าวโพดอย่างเดียว" }
      - { match: 2500, feedback: "นั่นคือกำไรต่อไร่ ต้องคูณด้วยจำนวนไร่ทั้งหมด" }
    solution: "ถ้าปลูกข้าวโพดทั้ง 8 ไร่ ได้กำไร $8 \\times 2{,}500 = 20{,}000$ บาท ค่าเสียโอกาสจึงเท่ากับ $20{,}000$ บาท (ส่วนข้าวได้ $24{,}000$ บาท จึงเป็นการเลือกที่คุ้ม)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.scarcity-choice.p009
    topics: [business.econ.scarcity-choice]
    difficulty: 3
    type: mcq
    stem: "ปีหนึ่งฝนแล้งมาก แหล่งน้ำในหมู่บ้านแห้ง ข้อใดอธิบายผลต่อ **การผลิตและการบริโภค** ได้ถูกต้องที่สุด"
    choices:
      - { id: a, text: "ชาวนาปลูกข้าวได้น้อยลง คนในหมู่บ้านอาจต้องซื้อข้าวแพงขึ้นหรือซื้อได้น้อยลง", correct: true }
      - { id: b, text: "ชาวนาปลูกข้าวได้มากขึ้นเพราะมีแดดมาก", feedback: "ข้าวต้องใช้น้ำมาก เมื่อน้ำขาดแคลนการผลิตจะลดลง" }
      - { id: c, text: "มีผลต่อชาวนาเท่านั้น ไม่มีผลต่อผู้ซื้อข้าว", feedback: "เมื่อผลิตได้น้อย ผู้ซื้อก็ได้ข้าวน้อยลงหรือต้องจ่ายมากขึ้น" }
      - { id: d, text: "ไม่มีผลอะไร เพราะความต้องการกินข้าวของคนเท่าเดิม", feedback: "ความต้องการเท่าเดิม แต่ทรัพยากรน้อยลง จึงยิ่งขาดแคลน" }
    hints:
      - "น้ำเป็นทรัพยากรที่ใช้ผลิตข้าว"
      - "คิดทั้งฝั่งคนปลูก (ผลิต) และฝั่งคนซื้อ (บริโภค)"
    solution: "น้ำซึ่งเป็นทรัพยากรธรรมชาติมีน้อยลง การผลิตข้าวจึงลดลง ข้าวในตลาดมีน้อย ผู้บริโภคจึงได้น้อยลงหรือต้องจ่ายแพงขึ้น ทรัพยากรที่มีจำกัดจึงมีผลทั้งต่อการผลิตและการบริโภค"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.scarcity-choice.p010
    topics: [business.econ.scarcity-choice]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการตัดสินใจเลือกอย่างมีเหตุผล เมื่อมีเงินหรือเวลาจำกัด"
    items:
      - "บอกให้ได้ว่าเราต้องการอะไร และสิ่งใดจำเป็นจริง"
      - "ดูว่าเรามีทรัพยากรอะไรบ้าง เช่น เงิน เวลา"
      - "เขียนทางเลือกที่ทำได้ทั้งหมด"
      - "เปรียบเทียบประโยชน์ของแต่ละทางและค่าเสียโอกาส"
      - "เลือกทางที่คุ้มที่สุด แล้วดูผลที่เกิดขึ้น"
    hints:
      - "ต้องรู้ก่อนว่าต้องการอะไรและมีอะไร จึงจะคิดทางเลือกได้"
      - "การเปรียบเทียบทำได้เมื่อมีรายการทางเลือกแล้ว"
    solution: "ระบุความต้องการ → ดูทรัพยากรที่มี → เขียนทางเลือก → เปรียบเทียบประโยชน์และค่าเสียโอกาส → เลือกและติดตามผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.scarcity-choice.p011
    topics: [business.econ.scarcity-choice]
    difficulty: 3
    type: numeric
    stem: "ป้านิดมีห้องหน้าบ้านหนึ่งห้อง ทางเลือกและประโยชน์ต่อเดือนแสดงในตาราง (ตัวเลขสมมติ) ป้านิดเลือกให้คนอื่นเช่าทำร้านตัดผม ค่าเสียโอกาสต่อเดือนเท่ากับกี่บาท (ตอบเป็นบาท)"
    figure: { src: room-options.svg, alt: "ตารางสองคอลัมน์ ทางเลือกการใช้ห้องหน้าบ้านกับประโยชน์ที่ได้ต่อเดือน เปิดร้านกาแฟเล็ก ๆ ได้กำไร 9,000 บาท ให้คนอื่นเช่าทำร้านตัดผมได้ค่าเช่า 7,000 บาท ใช้เก็บของไม่ได้เงิน ใต้ตารางเขียนว่าป้านิดเลือกให้เช่าทำร้านตัดผม" }
    answer: { value: 9000, unit: บาท }
    hints:
      - "ตัดทางที่ป้านิดเลือกออกก่อน"
      - "จากทางที่เหลือ เลือกทางที่ให้ประโยชน์มากที่สุด"
    misconceptions:
      - { match: 7000, feedback: "7,000 บาทคือสิ่งที่ป้านิดได้ ไม่ใช่สิ่งที่สละไป" }
      - { match: 0, feedback: "ใช้เก็บของไม่ได้เงิน แต่ยังมีทางที่ดีกว่าที่สละไป คือเปิดร้านกาแฟ" }
    solution: "ทางที่ไม่ได้เลือกคือ เปิดร้านกาแฟ (9,000 บาท) และเก็บของ (0 บาท) ทางที่ดีที่สุดคือร้านกาแฟ ค่าเสียโอกาสจึงเท่ากับ 9,000 บาทต่อเดือน (ซึ่งมากกว่าค่าเช่าที่ได้ ป้านิดอาจมีเหตุผลอื่น เช่น ไม่มีเวลาดูแลร้านเอง)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.scarcity-choice.p012
    topics: [business.econ.scarcity-choice]
    difficulty: 3
    type: mcq
    stem: "ข้อใดอธิบายความหมายของ **เศรษฐศาสตร์** ได้ดีที่สุด"
    choices:
