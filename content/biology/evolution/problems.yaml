  - id: biology.evolution.evolution.p016
    topics: [biology.evolution.evolution]
    difficulty: 4
    type: numeric
    stem: "โรคพันธุกรรมลักษณะด้อยบนออโตโซมโรคหนึ่งพบในทารก 1 ใน 10,000 คน ถ้าประชากรอยู่ในสมดุลฮาร์ดี-ไวน์เบิร์ก มีผู้เป็นพาหะร้อยละเท่าใด (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 1.98, tolerance: 0.02, unit: "%" }
    misconceptions:
      - { match: 1, feedback: "1% คือความถี่ของแอลลีล q ไม่ใช่ความถี่ของพาหะ 2pq" }
      - { match: 0.01, feedback: "0.01% คือความถี่ของผู้ป่วย q² ซึ่งโจทย์ให้มาแล้ว" }
      - { match: 0.99, feedback: "ลืมคูณ 2 ใน 2pq" }
    hints:
      - "q² = 1/10,000 จึงได้ q = 0.01"
      - "พาหะ = 2pq โดย p = 1 − q"
    solution: "$q = \\sqrt{0.0001} = 0.01$ $p = 0.99$ พาหะ $2pq = 2(0.99)(0.01) = 0.0198$ หรือร้อยละ 1.98 ราว 1 ใน 50 คน แม้ผู้ป่วยมีเพียง 1 ใน 10,000 คน"
