    ai_assisted: true

  - id: math.stats.statistical-investigation.p017
    topics: [math.stats.statistical-investigation]
    difficulty: 5
    type: numeric
    stem: "โรงเรียนมีนักเรียน 800 คน สภานักเรียนสุ่มถามนักเรียน 50 คนจากทุกชั้น พบว่า 18 คนปั่นจักรยานมาโรงเรียน ประมาณว่านักเรียนทั้งโรงเรียนปั่นจักรยานมากี่คน (ตอบเป็นจำนวนคน)"
    answer: { value: 288, tolerance: 1, unit: คน }
    hints:
      - "หาสัดส่วนในกลุ่มตัวอย่างก่อน: 18 จาก 50"
      - "ถ้ากลุ่มตัวอย่างเป็นตัวแทนที่ดี สัดส่วนในทั้งโรงเรียนก็ใกล้เคียงกัน คูณสัดส่วนนั้นกับ 800"
    misconceptions:
      - { match: 18, feedback: "นั่นคือจำนวนในกลุ่มตัวอย่าง 50 คน ข้อนี้ถามประมาณการทั้งโรงเรียน 800 คน" }
      - { match: 36, feedback: "นั่นคือร้อยละในกลุ่มตัวอย่าง ยังต้องคิดเป็นจำนวนคนจาก 800 คน" }
    solution: "สัดส่วน $\\tfrac{18}{50} = 0.36$ ประมาณทั้งโรงเรียน $0.36 \\times 800 = 288$ คน (เป็นค่าประมาณ ค่าจริงอาจต่างไปบ้าง)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.statistical-investigation.p018
