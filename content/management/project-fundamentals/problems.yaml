problems:
  - id: management.project.project-fundamentals.p001
    topics: [management.project.project-fundamentals]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นโครงการ ไม่ใช่งานประจำ"
    choices:
      - { id: a, text: "ย้ายระบบเวชระเบียนของโรงพยาบาลจากกระดาษไปเป็นระบบอิเล็กทรอนิกส์ภายใน 8 เดือน", correct: true }
      - { id: b, text: "ทำความสะอาดห้องผ่าตัดหลังผ่าตัดทุกครั้ง", feedback: "ทำซ้ำทุกวันตามขั้นตอนเดิม จึงเป็นงานประจำ" }
      - { id: c, text: "จ่ายเงินเดือนพนักงานทุกสิ้นเดือน", feedback: "ทำซ้ำต่อเนื่องไม่มีวันจบ จึงเป็นงานประจำ" }
      - { id: d, text: "รับผู้ป่วยนอกที่เคาน์เตอร์ทุกเช้า", feedback: "เป็นงานบริการที่ทำซ้ำทุกวัน จึงเป็นงานประจำ" }
    hints:
      - "โครงการมีวันเริ่ม วันจบ และผลงานที่ไม่ซ้ำแบบเดิม"
      - "งานประจำทำซ้ำต่อเนื่อง"
    solution: "การย้ายระบบเวชระเบียนทำครั้งเดียว มีกำหนดเสร็จ และสร้างสิ่งใหม่ จึงเป็นโครงการ เมื่อเสร็จแล้วการใช้ระบบทุกวันจะกลายเป็นงานประจำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.project-fundamentals.p002
    topics: [management.project.project-fundamentals]
    difficulty: 1
    type: match
    stem: "จับคู่ข้อความในกฎบัตรโครงการปรับปรุงตลาดสดเทศบาล (สมมติ) กับหัวข้อของกฎบัตร"
    pairs:
      - { left: "ตลาดเดิมน้ำท่วมขังทุกฤดูฝน ผู้ค้าขาดรายได้", right: "เหตุผลของโครงการ" }
      - { left: "ลดจำนวนวันที่น้ำท่วมขังเหลือ 0 วันในฤดูฝนปีหน้า", right: "วัตถุประสงค์ที่วัดได้" }
      - { left: "ปรับปรุงทางระบายน้ำและพื้นตลาด ไม่รวมการสร้างลานจอดรถ", right: "ขอบเขตกว้าง ๆ" }
      - { left: "แต่งตั้งวิศวกรโยธาเป็นผู้จัดการโครงการ อนุมัติค่าใช้จ่ายได้ไม่เกิน 50,000 บาทต่อรายการ", right: "ผู้จัดการโครงการและอำนาจ" }
    hints:
      - "วัตถุประสงค์ที่ดีมีตัวเลขและกรอบเวลา"
      - "ขอบเขตบอกทั้งสิ่งที่ทำและไม่ทำ"
    solution: "ปัญหาน้ำท่วมคือเหตุผล จำนวนวันท่วมเป็นวัตถุประสงค์ที่วัดได้ งานที่ทำและไม่ทำคือขอบเขต และการแต่งตั้งพร้อมวงเงินอนุมัติคืออำนาจของผู้จัดการโครงการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.project-fundamentals.p003
    topics: [management.project.project-fundamentals]
    difficulty: 1
    type: mcq
    stem: "กฎ 100% ของโครงสร้างการแบ่งงาน (WBS) หมายความว่าอย่างไร"
    choices:
      - { id: a, text: "งานย่อยภายใต้งานแม่ต้องรวมกันได้งานแม่ครบพอดี ไม่ขาดและไม่ซ้ำ", correct: true }
      - { id: b, text: "ทุกชุดงานต้องเสร็จ 100% ก่อนเริ่มชุดงานถัดไป", feedback: "WBS บอกว่างานมีอะไรบ้าง ไม่ได้บอกลำดับการทำ" }
      - { id: c, text: "ทีมต้องทำงานเต็มเวลา 100% ตลอดโครงการ", feedback: "กฎนี้เกี่ยวกับความครบถ้วนของงาน ไม่เกี่ยวกับเวลาทำงานของคน" }
      - { id: d, text: "งบของโครงการต้องใช้ให้หมด 100%", feedback: "กฎนี้ไม่ได้บังคับให้ใช้งบหมด" }
    hints:
      - "WBS แตกงานแม่เป็นงานลูก"
      - "ถ้ารวมงานลูกแล้วได้มากหรือน้อยกว่างานแม่ จะเกิดอะไรขึ้นกับงบ"
    solution: "กฎ 100% บอกว่างานลูกต้องครอบคลุมงานแม่ครบพอดี งบที่รวมจากล่างขึ้นบนจึงถูกต้อง และไม่มีงานตกหล่นหรือนับซ้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.project-fundamentals.p004
    topics: [management.project.project-fundamentals]
    difficulty: 2
    type: numeric
    stem: "ทีมโครงการมี 8 คน จะมีช่องทางการสื่อสารระหว่างคนสองคนทั้งหมดกี่ช่อง"
    answer: { value: 28, unit: ช่อง }
    hints:
      - "ใช้สูตร $\\dfrac{n(n-1)}{2}$"
      - "แทน $n = 8$"
    misconceptions:
      - { match: 56, feedback: "ลืมหารด้วย 2 ช่องทาง A–B กับ B–A เป็นช่องเดียวกัน" }
      - { match: 64, feedback: "ใช้ $n^2$ ต้องเป็น $n(n-1)/2$ เพราะไม่นับการคุยกับตัวเอง และไม่นับซ้ำ" }
    solution: "$\\dfrac{8 \\times 7}{2} = 28$ ช่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.project-fundamentals.p005
    topics: [management.project.project-fundamentals]
    difficulty: 2
    type: numeric
    stem: "งานเทพื้นคอนกรีตของศูนย์พัฒนาเด็กเล็กมีพื้นที่ 480 ตารางเมตร คนงานหนึ่งคนเทได้วันละ 20 ตารางเมตร ถ้าจัดคนงาน 6 คน งานนี้ใช้เวลากี่วัน"
    answer: { value: 4, unit: วัน }
    hints:
      - "ทีม 6 คนเทได้วันละ 6 × 20 ตารางเมตร"
      - "จำนวนวัน = พื้นที่ ÷ อัตราของทั้งทีม"
    misconceptions:
      - { match: 24, feedback: "นั่นคือจำนวนวันถ้ามีคนงานคนเดียว ต้องหารด้วยอัตราของทั้งทีม" }
      - { match: 144, feedback: "คูณแทนที่จะหาร จำนวนวัน = พื้นที่ ÷ (จำนวนคน × อัตราต่อคน)" }
    solution: "อัตราของทีม $6 \\times 20 = 120$ ตารางเมตรต่อวัน ใช้เวลา $480 \\div 120 = 4$ วัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.project-fundamentals.p006
    topics: [management.project.project-fundamentals]
    difficulty: 2
    type: match
    stem: "จากตารางอำนาจกับความสนใจในภาพ จับคู่ผู้มีส่วนได้ส่วนเสียกับวิธีบริหารที่เหมาะสม"
    figure:
      src: p-stakeholder.svg
      alt: "ตารางสองแกน แกนนอนความสนใจ แกนตั้งอำนาจ จุด A ผู้บริหารเทศบาล (ผู้สนับสนุนโครงการ) อำนาจสูง ความสนใจสูง จุด B ผู้ปกครองเด็ก อำนาจต่ำ ความสนใจสูง จุด C หน่วยงานที่อนุญาตการระบายน้ำ อำนาจสูง ความสนใจต่ำ จุด D ร้านค้าห่างออกไปสองซอย อำนาจต่ำ ความสนใจต่ำ"
    pairs:
      - { left: "A ผู้บริหารเทศบาล", right: "บริหารใกล้ชิด ประชุมและรายงานสม่ำเสมอ" }
      - { left: "B ผู้ปกครองเด็ก", right: "แจ้งข่าวความคืบหน้าสม่ำเสมอ" }
      - { left: "C หน่วยงานที่อนุญาตการระบายน้ำ", right: "ทำให้พอใจ ส่งเอกสารครบตามที่กำหนด" }
      - { left: "D ร้านค้าห่างออกไปสองซอย", right: "ติดตามดูเป็นระยะ" }
    hints:
      - "ดูว่าแต่ละจุดอยู่ช่องอำนาจสูงหรือต่ำ และความสนใจสูงหรือต่ำ"
      - "อำนาจสูงต้องไม่ทำให้ไม่พอใจ ความสนใจสูงต้องได้ข่าวสม่ำเสมอ"
    solution: "A อำนาจสูงสนใจมาก บริหารใกล้ชิด · B อำนาจต่ำสนใจมาก แจ้งข่าวสม่ำเสมอ · C อำนาจสูงสนใจน้อย ทำให้พอใจ · D ต่ำทั้งคู่ ติดตามดู"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.project-fundamentals.p007
    topics: [management.project.project-fundamentals]
    difficulty: 3
    type: numeric
    stem: "จาก WBS โครงการศูนย์พัฒนาเด็กเล็กในภาพ เทศบาลกันเงินสำรองเผื่อเหตุไม่คาดคิด 10% ของงบรวมทุกชุดงาน งบรวมเงินสำรองเป็นกี่พันบาท"
    figure:
      src: wbs.svg
      alt: "WBS งบเป็นพันบาท 1.1 แบบสถาปัตย์และวิศวกรรม 120, 1.2 ขออนุญาตก่อสร้าง 30, 2.1 ฐานราก 850, 2.2 โครงสร้างและผนัง 1,600, 2.3 หลังคา 540, 2.4 ระบบไฟฟ้าและประปา 420, 3.1 โต๊ะ เก้าอี้ ที่นอน 180, 3.2 ของเล่นเสริมพัฒนาการ 95, 4.1 ควบคุมงานและรายงาน 210"
    answer: { value: 4449.5, unit: พันบาท, tolerance: 0.5 }
    hints:
      - "รวมงบของชุดงานทั้งเก้าชุดก่อน"
      - "คูณผลรวมด้วย 1.10"
    misconceptions:
      - { match: 4045, feedback: "นั่นคืองบก่อนกันเงินสำรอง ยังไม่ได้บวก 10%" }
      - { match: 4386, feedback: "คิดเงินสำรองเฉพาะงานก่อสร้าง โจทย์ให้คิด 10% ของงบรวมทุกชุดงาน" }
    solution: "งบรวม $120 + 30 + 850 + 1{,}600 + 540 + 420 + 180 + 95 + 210 = 4{,}045$ พันบาท รวมเงินสำรอง $4{,}045 \\times 1.10 = 4{,}449.5$ พันบาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.project-fundamentals.p008
    topics: [management.project.project-fundamentals]
    difficulty: 3
    type: numeric
    stem: "ทีมพัฒนาแอปจองคิวของโรงพยาบาล (สมมติ) มีงานค้าง 150 แต้ม สามรอบที่ผ่านมาทำได้ 18, 21 และ 24 แต้ม ถ้าใช้ความเร็วเฉลี่ย ต้องใช้อีกอย่างน้อยกี่รอบ"
    answer: { value: 8, unit: รอบ }
    hints:
      - "ความเร็วเฉลี่ย = (18 + 21 + 24) ÷ 3"
      - "จำนวนรอบ = งานค้าง ÷ ความเร็วเฉลี่ย แล้วปัดขึ้น"
    misconceptions:
      - { match: 7, feedback: "ปัดลงจาก 7.14 รอบ ถ้าทำแค่ 7 รอบจะเหลืองานค้าง ต้องปัดขึ้น" }
      - { match: 9, feedback: "ใช้ความเร็วต่ำสุด (18) โจทย์ให้ใช้ความเร็วเฉลี่ย" }
    solution: "ความเร็วเฉลี่ย $63 \\div 3 = 21$ แต้มต่อรอบ จำนวนรอบ $150 \\div 21 \\approx 7.14$ ปัดขึ้นเป็น 8 รอบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.project-fundamentals.p009
    topics: [management.project.project-fundamentals]
    difficulty: 3
    type: mcq
    stem: "สำนักงานจังหวัดแห่งหนึ่ง (สมมติ) จะพัฒนาระบบออนไลน์ให้ประชาชนแจ้งเรื่องร้องเรียน แต่ยังไม่รู้ว่าประชาชนต้องการฟังก์ชันใดบ้าง และผู้บริหารอยากเห็นตัวอย่างเร็ว ๆ วงจรชีวิตแบบใดเหมาะที่สุด"
    choices:
      - { id: a, text: "แบบปรับตัว ส่งมอบฟังก์ชันหลักก่อนแล้วปรับตามข้อมูลป้อนกลับทุกรอบ", correct: true }
      - { id: b, text: "แบบพยากรณ์ เขียนความต้องการให้ครบทุกข้อก่อนเริ่มพัฒนา", feedback: "ความต้องการยังไม่ชัด การเขียนให้ครบตั้งแต่ต้นจะเดาผิดและต้องแก้มากภายหลัง" }
      - { id: c, text: "ไม่ต้องวางแผนเลย ให้นักพัฒนาทำตามที่คิด", feedback: "แบบปรับตัวยังมีการวางแผนทุกรอบ มีรายการงานค้าง และมีเจ้าของผลิตภัณฑ์จัดลำดับ" }
      - { id: d, text: "แบบพยากรณ์ เพราะเป็นหน่วยงานรัฐ", feedback: "การเลือกวงจรชีวิตขึ้นกับลักษณะงาน ไม่ใช่ประเภทขององค์การ" }
    hints:
      - "ความต้องการชัดหรือยังไม่ชัด"
      - "ผู้ใช้ต้องการเห็นชิ้นงานจริงเร็วแค่ไหน"
    solution: "เมื่อความต้องการยังไม่ชัดและต้องการข้อมูลป้อนกลับเร็ว แบบปรับตัวเหมาะที่สุด ส่งมอบชิ้นงานที่ใช้ได้ทุกรอบแล้วปรับตามผู้ใช้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.project-fundamentals.p010
    topics: [management.project.project-fundamentals]
    difficulty: 3
    type: mcq
    stem: "ตาราง RACI ของงาน \"ตรวจรับงานหลังคา\" ระบุว่า วิศวกรควบคุมงาน = A, ผู้อำนวยการกองช่าง = A, ผู้รับเหมา = R, ครูประจำศูนย์ = I ปัญหาของตารางนี้คืออะไร"
    choices:
      - { id: a, text: "มีผู้รับผิดชอบสุดท้าย (A) สองคน ทำให้ไม่ชัดว่าใครตัดสินใจขั้นสุดท้าย", correct: true }
      - { id: b, text: "ผู้รับเหมาไม่ควรเป็น R", feedback: "ผู้รับเหมาลงมือแก้ไขและเตรียมงานให้ตรวจ จึงเป็น R ได้" }
      - { id: c, text: "ครูประจำศูนย์ไม่ควรถูกแจ้งให้ทราบ", feedback: "ครูเป็นผู้ใช้อาคาร การแจ้งให้ทราบ (I) จึงเหมาะสม" }
      - { id: d, text: "ไม่มีปัญหา ตารางนี้ถูกต้องแล้ว", feedback: "งานหนึ่งควรมี A เพียงคนเดียว" }
    hints:
      - "นับจำนวน A ของงานนี้"
      - "A คือผู้ที่ต้องรับผลของการตัดสินใจขั้นสุดท้าย"
    solution: "งานหนึ่งต้องมี A คนเดียว ถ้ามีสองคน อาจโยนกันหรือขัดกันเอง ควรให้ผู้อำนวยการกองช่างเป็น A และวิศวกรควบคุมงานเป็น R หรือ C ตามจริง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.project-fundamentals.p011
    topics: [management.project.project-fundamentals]
    difficulty: 3
    type: mcq
    stem: "ระหว่างก่อสร้าง ครูขอเพิ่มห้องเก็บของซึ่งต้องใช้งบเพิ่ม 180,000 บาท เกินวงเงินที่ผู้จัดการโครงการอนุมัติได้ (50,000 บาท) ผู้จัดการโครงการควรทำอย่างไร"
    choices:
      - { id: a, text: "บันทึกคำขอเปลี่ยนแปลง วิเคราะห์ผลต่องบ เวลา และความเสี่ยง แล้วเสนอผู้มีอำนาจอนุมัติตามโครงสร้างธรรมาภิบาล", correct: true }
      - { id: b, text: "ให้ผู้รับเหมาสร้างไปก่อน แล้วค่อยขออนุมัติภายหลัง", feedback: "การทำก่อนอนุมัติข้ามธรรมาภิบาลโครงการ และอาจทำให้งบเกินโดยไม่มีใครรับผิดชอบ" }
      - { id: c, text: "ปฏิเสธทันทีเพราะไม่อยู่ในขอบเขตเดิม", feedback: "คำขออาจมีคุณค่าจริง ควรวิเคราะห์และเสนอผู้มีอำนาจตัดสินใจ ไม่ใช่ปฏิเสธเอง" }
      - { id: d, text: "แบ่งเป็นสี่รายการ รายการละ 45,000 บาท เพื่อให้อนุมัติเองได้", feedback: "การแบ่งเพื่อหลบวงเงินอนุมัติเป็นการหลีกเลี่ยงการควบคุม ซึ่งผิดหลักธรรมาภิบาล" }
    hints:
      - "เกินวงเงินที่ตนมีอำนาจ"
      - "การเปลี่ยนขอบเขตต้องผ่านกระบวนการควบคุมการเปลี่ยนแปลง"
    solution: "การเปลี่ยนขอบเขตที่เกินอำนาจต้องบันทึก วิเคราะห์ผลกระทบ และเสนอผู้มีอำนาจ (เช่น ผู้สนับสนุนหรือคณะกรรมการกำกับ) ตามโครงสร้างธรรมาภิบาลของโครงการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.project-fundamentals.p012
    topics: [management.project.project-fundamentals]
    difficulty: 4
    type: numeric
    stem: "ทีมโครงการเพิ่มจาก 6 คนเป็น 10 คน จำนวนช่องทางการสื่อสารเพิ่มขึ้นกี่ช่อง"
    answer: { value: 30, unit: ช่อง }
    hints:
      - "หาช่องทางของทีม 6 คนและ 10 คนแยกกัน"
      - "$\\dfrac{n(n-1)}{2}$ แล้วลบกัน"
    misconceptions:
      - { match: 4, feedback: "นั่นคือจำนวนคนที่เพิ่ม ช่องทางการสื่อสารเพิ่มเร็วกว่าจำนวนคนมาก" }
      - { match: 6, feedback: "ดูเหมือนคิดช่องทางระหว่างสมาชิกใหม่ 4 คนเท่านั้น ต้องรวมช่องทางระหว่างคนใหม่กับคนเดิมด้วย" }
    solution: "ทีม 6 คน $\\dfrac{6 \\times 5}{2} = 15$ ช่อง ทีม 10 คน $\\dfrac{10 \\times 9}{2} = 45$ ช่อง เพิ่มขึ้น $45 - 15 = 30$ ช่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.project-fundamentals.p013
    topics: [management.project.project-fundamentals]
    difficulty: 4
    type: order
    stem: "เรียงขั้นตอนการปิดโครงการก่อสร้างศูนย์พัฒนาเด็กเล็ก"
    items:
      - "ตรวจรับงานตามเกณฑ์การยอมรับ"
      - "ส่งมอบอาคาร คู่มือ และใบรับประกันให้ศูนย์พัฒนาเด็กเล็ก"
      - "ปิดสัญญาและจ่ายเงินงวดสุดท้าย"
      - "ประชุมสรุปบทเรียนและบันทึกไว้"
      - "คืนทรัพยากรและเก็บเอกสารโครงการ"
    hints:
      - "ต้องตรวจรับก่อนจึงส่งมอบและจ่ายเงินงวดสุดท้ายได้"
      - "สรุปบทเรียนขณะที่ทีมยังอยู่ แล้วจึงคืนทรัพยากร"
    solution: "ตรวจรับ → ส่งมอบ → ปิดสัญญาและจ่ายเงิน → สรุปบทเรียน → คืนทรัพยากรและเก็บเอกสาร ถ้าคืนทีมก่อนสรุปบทเรียน ความรู้จากโครงการจะหายไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.project-fundamentals.p014
    topics: [management.project.project-fundamentals]
    difficulty: 4
    type: mcq
    stem: "โครงการติดตั้งตู้บริการอัตโนมัติ 20 ตู้ในสำนักงานเขต (สมมติ) เสร็จตรงเวลาและในงบ แต่หกเดือนต่อมามีผู้ใช้วันละไม่ถึง 5 คน และเวลารอที่เคาน์เตอร์ไม่ลดลง ข้อใดสรุปได้ถูกต้องที่สุดตามหลักการมุ่งคุณค่า"
    choices:
      - { id: a, text: "โครงการยังไม่สำเร็จในแง่คุณค่า เพราะผลลัพธ์ที่ตั้งใจ (ลดเวลารอ) ยังไม่เกิด ควรหาสาเหตุ เช่น ประชาชนไม่รู้จักหรือใช้ยาก", correct: true }
      - { id: b, text: "โครงการสำเร็จแล้ว เพราะส่งมอบครบ ตรงเวลา และในงบ", feedback: "เวลา งบ และสิ่งส่งมอบเป็นแค่ส่วนหนึ่ง ความสำเร็จวัดจากประโยชน์ที่เกิดจริง" }
      - { id: c, text: "ควรติดตั้งตู้เพิ่มอีก 20 ตู้ เพื่อให้ประชาชนเห็นมากขึ้น", feedback: "ยังไม่รู้สาเหตุที่คนไม่ใช้ การเพิ่มตู้อาจเพิ่มต้นทุนโดยไม่เพิ่มคุณค่า" }
      - { id: d, text: "ผู้จัดการโครงการไม่ต้องรับผิดชอบ เพราะโครงการปิดไปแล้ว", feedback: "องค์การยังต้องวัดประโยชน์หลังปิดโครงการ และใช้ผลไปปรับปรุง" }
    hints:
      - "ความสำเร็จวัดจากผลผลิตหรือจากประโยชน์"
      - "เป้าหมายจริงของโครงการคืออะไร"
    solution: "ตามหลักการมุ่งคุณค่า ความสำเร็จวัดจากประโยชน์ที่เกิดจริง ตู้ที่ติดตั้งครบแต่ไม่ได้ลดเวลารอยังไม่สร้างคุณค่า ต้องหาสาเหตุและแก้ เช่น ประชาสัมพันธ์ มีเจ้าหน้าที่ช่วยสอน หรือปรับหน้าจอให้ใช้ง่าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.project-fundamentals.p015
    topics: [management.project.project-fundamentals]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "ข้อใดควรอยู่ในกฎบัตรโครงการ (เลือกได้หลายข้อ)"
    choices:
      - { id: a, text: "วัตถุประสงค์ที่วัดได้และประโยชน์ที่คาดหวัง", correct: true }
      - { id: b, text: "หมุดหมายสำคัญและงบโดยประมาณ", correct: true }
      - { id: c, text: "ชื่อผู้จัดการโครงการและอำนาจในการตัดสินใจ", correct: true }
      - { id: d, text: "ตารางงานรายวันของคนงานทุกคน", feedback: "รายละเอียดระดับรายวันอยู่ในแผนโครงการภายหลัง กฎบัตรเป็นเอกสารระดับสูงที่สั้น" }
      - { id: e, text: "รายการวัสดุทุกชิ้นพร้อมราคาต่อหน่วย", feedback: "รายละเอียดวัสดุอยู่ในการประมาณราคาและแผนจัดซื้อ ไม่ใช่กฎบัตร" }
    hints:
      - "กฎบัตรทำตอนเริ่มโครงการ ก่อนวางแผนละเอียด"
      - "กฎบัตรตอบว่าทำไม ทำอะไรกว้าง ๆ ใครรับผิดชอบ และมีอำนาจแค่ไหน"
    solution: "กฎบัตรมีวัตถุประสงค์และประโยชน์ (a) หมุดหมายและงบโดยประมาณ (b) และผู้จัดการโครงการพร้อมอำนาจ (c) ส่วนตารางงานรายวันและรายการวัสดุ (d, e) เป็นรายละเอียดของแผนที่ทำภายหลัง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.project-fundamentals.p016
    topics: [management.project.project-fundamentals]
    difficulty: 5
    type: numeric
    stem: "ทีมพัฒนาแบบปรับตัวมีงานค้าง 180 แต้ม ความเร็วเฉลี่ย 24 แต้มต่อรอบ รอบละ 2 สัปดาห์ แต่ระบบต้องเปิดใช้ในอีก 12 สัปดาห์ เจ้าของผลิตภัณฑ์ต้องตัดงานที่สำคัญน้อยออกจากรุ่นแรกอย่างน้อยกี่แต้ม"
    answer: { value: 36, unit: แต้ม }
    hints:
      - "12 สัปดาห์มีกี่รอบ"
      - "งานที่ทำได้ = จำนวนรอบ × ความเร็ว แล้วเทียบกับงานค้าง"
    misconceptions:
      - { match: 0, feedback: "ดูเหมือนคิดว่า 12 สัปดาห์คือ 12 รอบ แต่รอบละ 2 สัปดาห์จึงมีแค่ 6 รอบ" }
      - { match: 144, feedback: "นั่นคือแต้มที่ทำได้ใน 6 รอบ โจทย์ถามแต้มที่ต้องตัดออก" }
    solution: "12 สัปดาห์ = 6 รอบ ทำได้ $6 \\times 24 = 144$ แต้ม ต้องตัด $180 - 144 = 36$ แต้ม โดยเลือกงานที่มีคุณค่าน้อยที่สุดออกไปก่อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.project-fundamentals.p017
    topics: [management.project.project-fundamentals]
    difficulty: 5
    type: mcq
    stem: "ทีมออกแบบศูนย์พัฒนาเด็กเล็กมีหลังคาสามแบบ แบบ 1 ราคาถูกที่สุดแต่ห้องร้อนจนต้องเปิดเครื่องปรับอากาศทั้งวัน แบบ 2 แพงกว่าแบบ 1 ราว 8% มีฉนวนและชายคายาว ค่าไฟลดลงมากตลอดอายุอาคาร แบบ 3 แพงกว่าแบบ 1 ราว 40% ใช้วัสดุนำเข้าที่ช่างในพื้นที่ซ่อมไม่ได้ ข้อใดสอดคล้องกับหลักความยั่งยืนและการมุ่งคุณค่ามากที่สุด"
    choices:
      - { id: a, text: "เลือกแบบ 2 และแสดงต้นทุนตลอดอายุการใช้งานให้ผู้สนับสนุนเห็นประกอบการตัดสินใจ", correct: true }
      - { id: b, text: "เลือกแบบ 1 เพราะงบก่อสร้างต่ำที่สุด", feedback: "ต้นทุนค่าไฟและความสบายของเด็กตลอดอายุอาคารสูงกว่า การดูแค่ค่าก่อสร้างขัดกับการมุ่งคุณค่าระยะยาว" }
      - { id: c, text: "เลือกแบบ 3 เพราะแพงที่สุดจึงน่าจะดีที่สุด", feedback: "ราคาสูงไม่ได้แปลว่าคุณค่าสูง แบบนี้ยังซ่อมในพื้นที่ไม่ได้ ซึ่งไม่ยั่งยืน" }
      - { id: d, text: "ให้ผู้รับเหมาเลือกเองเพราะไม่เกี่ยวกับการจัดการโครงการ", feedback: "การเลือกแบบที่กระทบต้นทุนตลอดอายุและผู้ใช้เป็นการตัดสินใจสำคัญของเจ้าของโครงการ" }
    hints:
      - "ความยั่งยืนดูทั้งสังคม สิ่งแวดล้อม และเศรษฐกิจตลอดอายุการใช้งาน"
      - "ต้นทุนก่อสร้างเป็นแค่ส่วนหนึ่งของต้นทุนทั้งหมด"
    solution: "แบบ 2 เพิ่มค่าก่อสร้างเล็กน้อยแต่ลดค่าไฟ ทำให้ห้องเย็นสบายสำหรับเด็ก และซ่อมได้ในพื้นที่ จึงสร้างคุณค่าสูงสุดตลอดอายุอาคาร ผู้จัดการโครงการควรนำข้อมูลต้นทุนตลอดอายุเสนอให้ผู้มีอำนาจตัดสินใจ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.project-fundamentals.p018
    topics: [management.project.project-fundamentals]
    difficulty: 5
    type: numeric
    stem: "ทีมแบบปรับตัวเริ่มต้นด้วยงานค้าง 180 แต้ม ทำเสร็จไปแล้ว 3 รอบรวม 72 แต้ม แล้วผู้ใช้ขอฟังก์ชันใหม่ที่เจ้าของผลิตภัณฑ์อนุมัติเพิ่มเข้ามา 30 แต้ม ถ้าความเร็วเฉลี่ยยังเป็น 24 แต้มต่อรอบ ต้องใช้อีกอย่างน้อยกี่รอบ"
    answer: { value: 6, unit: รอบ }
    hints:
      - "งานค้างที่เหลือ = งานเริ่มต้น − งานที่เสร็จ + งานที่เพิ่ม"
      - "หารด้วยความเร็วแล้วปัดขึ้น"
    misconceptions:
      - { match: 5, feedback: "ลืมบวกงานที่เพิ่ม 30 แต้ม งานค้างเหลือ 138 แต้ม ไม่ใช่ 108 แต้ม" }
      - { match: 8, feedback: "นั่นคือจำนวนรอบเมื่อเริ่มต้น ต้องหักงานที่ทำเสร็จแล้วและบวกงานที่เพิ่ม" }
    solution: "งานค้าง $180 - 72 + 30 = 138$ แต้ม $138 \\div 24 = 5.75$ ปัดขึ้นเป็น 6 รอบ การรับงานเพิ่มต้องผ่านเจ้าของผลิตภัณฑ์และแจ้งผลต่อกำหนดเสร็จให้ผู้มีส่วนได้ส่วนเสียทราบ"
    license: CC-BY-SA-4.0
    ai_assisted: true
