<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="sans-serif">
<title>สำนวน คำพังเพย และสุภาษิต</title>
<defs></defs>
<rect x="0" y="0" width="860" height="400" fill="#fff"/>
<text x="20.0" y="32.0" font-size="19" text-anchor="start" fill="#1f5fbf" font-weight="bold">สำนวน (ความหมายกว้าง): ถ้อยคำสืบต่อกันมา ความหมายไม่ตรงตามตัว</text>
<rect x="20.0" y="50.0" width="820.0" height="330.0" rx="16" fill="#f4f8fd" stroke="#1f5fbf" stroke-width="2"/>
<rect x="40.0" y="70.0" width="245.0" height="290.0" rx="12" fill="#fff" stroke="#1e8449" stroke-width="2.2"/>
<text x="162.0" y="108.0" font-size="24" text-anchor="middle" fill="#1e8449" font-weight="bold">สำนวน</text>
<text x="162.0" y="138.0" font-size="15" text-anchor="middle" fill="#444" font-weight="normal">วลีสั้น บอกลักษณะ</text>
<line x1="60.0" y1="155.0" x2="265.0" y2="155.0" stroke="#ddd" stroke-width="1.5" stroke-linecap="round"/>
<text x="162.0" y="192.0" font-size="18" text-anchor="middle" fill="#111" font-weight="normal">ไก่อ่อน</text>
<text x="162.0" y="232.0" font-size="18" text-anchor="middle" fill="#111" font-weight="normal">ผักชีโรยหน้า</text>
<text x="162.0" y="272.0" font-size="18" text-anchor="middle" fill="#111" font-weight="normal">ปิดทองหลังพระ</text>
<text x="162.0" y="312.0" font-size="18" text-anchor="middle" fill="#111" font-weight="normal">คมในฝัก</text>
<rect x="308.0" y="70.0" width="245.0" height="290.0" rx="12" fill="#fff" stroke="#b9770e" stroke-width="2.2"/>
<text x="430.0" y="108.0" font-size="24" text-anchor="middle" fill="#b9770e" font-weight="bold">คำพังเพย</text>
<text x="430.0" y="138.0" font-size="15" text-anchor="middle" fill="#444" font-weight="normal">เปรียบเหตุการณ์ ให้คิดเอง</text>
<line x1="328.0" y1="155.0" x2="533.0" y2="155.0" stroke="#ddd" stroke-width="1.5" stroke-linecap="round"/>
<text x="430.0" y="192.0" font-size="18" text-anchor="middle" fill="#111" font-weight="normal">รำไม่ดีโทษปี่โทษกลอง</text>
<text x="430.0" y="232.0" font-size="18" text-anchor="middle" fill="#111" font-weight="normal">ขี่ช้างจับตั๊กแตน</text>
<text x="430.0" y="272.0" font-size="18" text-anchor="middle" fill="#111" font-weight="normal">หนีเสือปะจระเข้</text>
<rect x="576.0" y="70.0" width="245.0" height="290.0" rx="12" fill="#fff" stroke="#8e44ad" stroke-width="2.2"/>
<text x="698.0" y="108.0" font-size="24" text-anchor="middle" fill="#8e44ad" font-weight="bold">สุภาษิต</text>
<text x="698.0" y="138.0" font-size="15" text-anchor="middle" fill="#444" font-weight="normal">สอนตรง ๆ ควร / อย่า</text>
<line x1="596.0" y1="155.0" x2="801.0" y2="155.0" stroke="#ddd" stroke-width="1.5" stroke-linecap="round"/>
<text x="698.0" y="192.0" font-size="18" text-anchor="middle" fill="#111" font-weight="normal">น้ำเชี่ยวอย่าขวางเรือ</text>
<text x="698.0" y="232.0" font-size="18" text-anchor="middle" fill="#111" font-weight="normal">น้ำขึ้นให้รีบตัก</text>
</svg>
