  - ใครควรเป็นคนบอกว่าเกณฑ์ใดสำคัญ
  solution: ผลที่ **พลิกได้ง่าย** แปลว่าทางเลือกสูสี ต้องให้ **ผู้ใช้ช่วยกำหนดน้ำหนัก** และอาจรวมจุดเด่นของทั้งสองแบบ
