id: biology.ecology.biomes-succession
subject: biology
title: { th: ไบโอมและการเปลี่ยนแปลงแทนที่, en: "Biomes and ecological succession" }
summary: ไบโอมบนบกและในน้ำตามอุณหภูมิ ปริมาณฝน ละติจูด และความสูง ไบโอมในประเทศไทย การเปลี่ยนแปลงแทนที่แบบปฐมภูมิและทุติยภูมิ และระบบนิเวศเมื่อสภาพแวดล้อมคงที่หรือเปลี่ยนไป
difficulty: 4.5
minutes: 40
prerequisites: [biology.ecology.ecosystems]
encompasses:
  - { id: biology.ecology.ecosystems, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ไบโอมบนบกกับอุณหภูมิและปริมาณฝน
    src: biome-climate.svg
    alt: "แผนภาพอย่างง่าย แกนนอนคือปริมาณฝนเฉลี่ยต่อปี 0 ถึง 4,500 มิลลิเมตร แกนตั้งคืออุณหภูมิเฉลี่ยต่อปี −15 ถึง 30 องศาเซลเซียส ฝนน้อยกว่า 400 มิลลิเมตรเป็นทะเลทรายทุกช่วงอุณหภูมิ อุณหภูมิต่ำกว่า −5 องศาและฝน 400 ถึง 1,000 มิลลิเมตรเป็นทุนดรา อุณหภูมิ −5 ถึง 5 องศาและฝน 400 ถึง 2,000 มิลลิเมตรเป็นป่าสนหรือไทกา อุณหภูมิ 5 ถึง 20 องศา ฝน 400 ถึง 1,000 มิลลิเมตรเป็นทุ่งหญ้าเขตอบอุ่น ฝน 1,000 ถึง 2,500 มิลลิเมตรเป็นป่าผลัดใบเขตอบอุ่น อุณหภูมิ 20 ถึง 30 องศา ฝน 400 ถึง 1,500 มิลลิเมตรเป็นสะวันนา ฝน 1,500 ถึง 2,500 มิลลิเมตรเป็นป่าเขตร้อนผลัดใบตามฤดู และฝนมากกว่า 2,500 มิลลิเมตรเป็นป่าดิบชื้นเขตร้อน บริเวณหนาวแต่ฝนมากเขียนว่าไม่ค่อยพบบนโลก"
    caption: "ขอบเขตจริงไม่ได้เป็นเส้นตรงชัดเจน ภาพนี้แสดงแนวโน้มเท่านั้น (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ทำนายไบโอมจากข้อมูลภูมิอากาศ
    problem: "พื้นที่หนึ่งมีอุณหภูมิเฉลี่ย 27 °C ฝนรวม 1,300 มม. ต่อปี และฝนเกือบทั้งหมดตกในช่วงพฤษภาคมถึงตุลาคม พื้นที่นี้น่าจะเป็นไบโอมใด และพืชปรับตัวอย่างไร"
    steps:
      - text: "อุณหภูมิ 27 °C อยู่ในแถบร้อน ตัดทุนดรา ไทกา และไบโอมเขตอบอุ่นออก"
      - text: "ฝน 1,300 มม. ต่อปี มากกว่าทะเลทราย แต่น้อยกว่าป่าดิบชื้น"
      - text: "ฝนตกเพียงครึ่งปี มีฤดูแล้งยาว ตรงกับป่าเขตร้อนผลัดใบตามฤดูหรือสะวันนา"
        why: "ปริมาณฝนรวมอย่างเดียวไม่พอ การกระจายของฝนตลอดปีก็สำคัญ"
      - text: "ต้นไม้ทิ้งใบในหน้าแล้งเพื่อลดการสูญเสียน้ำ ถ้ามีไฟบ่อยจะเป็นป่าโปร่งที่มีหญ้ามาก เช่น ป่าเต็งรัง"
    answer: "ป่าเขตร้อนผลัดใบตามฤดู (หรือสะวันนาถ้าไฟบ่อย) ต้นไม้ทิ้งใบในหน้าแล้ง"
  - { type: check, problem: biology.ecology.biomes-succession.p006, prompt: "ใช้ทั้งอุณหภูมิและปริมาณฝน" }
  - type: figure
    title: การเปลี่ยนแปลงแทนที่แบบปฐมภูมิและทุติยภูมิ
    src: succession.svg
    alt: "สองแถว แถวบนคือแบบปฐมภูมิ เริ่มจากพื้นที่ไม่มีดินและไม่มีสิ่งมีชีวิต ใช้เวลาหลายร้อยถึงหลายพันปี ลำดับคือ หินเปล่าเช่นลาวาเย็นตัว → ไลเคนซึ่งเป็นผู้บุกเบิก → มอสและดินชั้นบาง → หญ้าและดินหนาขึ้น → ไม้พุ่ม → ป่าซึ่งเป็นสังคมสมบูรณ์ แถวล่างคือแบบทุติยภูมิ เริ่มจากพื้นที่ที่ยังมีดินและเมล็ด ใช้เวลาหลายสิบถึงร้อยกว่าปี ลำดับคือ ไร่ร้างหรือพื้นที่หลังไฟป่า → หญ้าและวัชพืช → ไม้พุ่ม → ไม้เบิกนำที่โตเร็วและชอบแสง → ป่า"
    caption: "แบบทุติยภูมิเร็วกว่าเพราะไม่ต้องรอให้เกิดดินใหม่ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ไร่ร้างกลายเป็นป่าได้อย่างไร
    problem: "ไร่ข้าวโพดบนเขาถูกทิ้งร้างและไม่มีไฟไหม้ซ้ำ อธิบายลำดับการเปลี่ยนแปลงแทนที่และเหตุผลที่แต่ละกลุ่มเข้ามาแทนที่กลุ่มเดิม"
    steps:
      - text: "ดินและเมล็ดในดินยังอยู่ จึงเป็นการเปลี่ยนแปลงแทนที่แบบทุติยภูมิ"
      - text: "ปีแรก ๆ หญ้าและวัชพืชที่โตเร็วและชอบแสงขึ้นก่อน คลุมดินและเพิ่มอินทรียวัตถุ"
      - text: "ไม้พุ่มและไม้เบิกนำเติบโตแซงหญ้า บังแสงจนหญ้าลดลง"
        why: "ผู้มาก่อนเปลี่ยนสภาพแวดล้อม เช่น แสงและความชื้นในดิน จนเหมาะกับชนิดอื่นมากกว่าตัวเอง"
      - text: "ใต้ร่มไม้เบิกนำ ต้นกล้าของไม้ป่าที่ทนร่มเติบโตได้ จนกลายเป็นป่าที่มีหลายชั้นในหลายสิบปี"
    answer: "หญ้าและวัชพืช → ไม้พุ่มและไม้เบิกนำ → ไม้ป่าทนร่ม เพราะแต่ละกลุ่มเปลี่ยนแสงและดินจนกลุ่มต่อไปเข้ามาได้"
  - { type: check, problem: biology.ecology.biomes-succession.p009, prompt: "แบบใดไม่ต้องรอให้เกิดดิน" }
glossary:
  - { term: ไบโอม, definition: "กลุ่มระบบนิเวศขนาดใหญ่ที่มีภูมิอากาศและพืชพรรณเด่นคล้ายกัน" }
  - { term: ป่าเขตร้อนผลัดใบตามฤดู, definition: "ป่าในเขตร้อนที่มีฤดูแล้งชัด ต้นไม้ทิ้งใบในหน้าแล้ง เช่น ป่าเบญจพรรณ" }
  - { term: การเปลี่ยนแปลงแทนที่, definition: "การที่กลุ่มสิ่งมีชีวิตในพื้นที่หนึ่งค่อย ๆ เปลี่ยนชนิดไปตามเวลา" }
  - { term: แบบปฐมภูมิ, definition: "การเปลี่ยนแปลงแทนที่ที่เริ่มจากพื้นที่ไม่มีดินและไม่มีสิ่งมีชีวิต" }
  - { term: แบบทุติยภูมิ, definition: "การเปลี่ยนแปลงแทนที่ที่เริ่มจากพื้นที่ที่ถูกรบกวนแต่ยังมีดินเหลือ" }
  - { term: ผู้บุกเบิก, definition: "สิ่งมีชีวิตกลุ่มแรกที่เข้าไปอยู่ในพื้นที่ใหม่ เช่น ไลเคนบนหิน" }
  - { term: สังคมสมบูรณ์, definition: "กลุ่มสิ่งมีชีวิตที่ค่อนข้างคงที่ในช่วงท้ายของการเปลี่ยนแปลงแทนที่ภายใต้ภูมิอากาศนั้น" }
flashcards:
  - { front: "ปัจจัยหลักที่กำหนดไบโอมบนบก", back: "อุณหภูมิและปริมาณฝน ซึ่งขึ้นกับละติจูด ความสูง และระยะห่างจากทะเล" }
  - { front: "ป่าที่พบมากในภาคเหนือและภาคตะวันตกของไทย", back: "ป่าผลัดใบ เช่น ป่าเบญจพรรณและป่าเต็งรัง เพราะมีฤดูแล้งยาว" }
  - { front: "ผู้บุกเบิกบนหินเปล่า", back: "ไลเคนและมอส ช่วยผุกร่อนหินจนเกิดดิน" }
  - { front: "ปฐมภูมิกับทุติยภูมิต่างกันอย่างไร", back: "ปฐมภูมิเริ่มโดยไม่มีดิน ช้ามาก ทุติยภูมิยังมีดินและเมล็ด เร็วกว่า" }
