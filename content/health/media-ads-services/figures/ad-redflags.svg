<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" font-family="sans-serif">
<title>โฆษณาสมมติของแคปซูลลดน้ำหนักพร้อมจุดน่าสงสัย</title>
<rect x="0" y="0" width="840" height="470" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="420.0" y="24.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">ตรวจโฆษณา: โฆษณาสมมติ "ฟิตไวไว" (ชื่อสมมติ)</text>
<rect x="250.0" y="45.0" width="320.0" height="385.0" rx="12" fill="#fff8e6" stroke="#c58b00" stroke-width="2"/>
<text x="410.0" y="81.0" font-size="28" text-anchor="middle" font-weight="bold" fill="#c0392b">ฟิตไวไว</text>
<text x="410.0" y="105.0" font-size="12" text-anchor="middle" fill="#555">แคปซูลสมุนไพร (ชื่อสมมติ)</text>
<text x="410.0" y="135.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">ลด 10 กิโลใน 7 วัน!</text>
<text x="410.0" y="170.0" font-size="14" text-anchor="middle" fill="#222">ไม่ต้องคุมอาหาร ไม่ต้องออกกำลังกาย</text>
<text x="410.0" y="205.0" font-size="14" text-anchor="middle" fill="#222">ช่วยรักษาเบาหวานและความดัน</text>
<text x="410.0" y="240.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">ธรรมชาติ ปลอดภัย 100%</text>
<text x="410.0" y="275.0" font-size="14" text-anchor="middle" fill="#222">ดาราดังกินเองรีวิวเอง ★★★★★</text>
<text x="410.0" y="310.0" font-size="14" text-anchor="middle" fill="#222">[ภาพก่อน] → [ภาพหลัง]</text>
<text x="410.0" y="345.0" font-size="14" text-anchor="middle" fill="#222">เหลือ 20 กล่องสุดท้าย! โปรวันนี้วันเดียว</text>
<text x="410.0" y="380.0" font-size="13" text-anchor="middle" fill="#222">สั่งเลย ทักแชต</text>
<rect x="280.0" y="395.0" width="260.0" height="22.0" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1"/>
<text x="410.0" y="411.0" font-size="12" text-anchor="middle" fill="#555">ไม่มีเลข อย. และเลขอนุญาตโฆษณา</text>
<text x="10.0" y="134.0" font-size="12" text-anchor="start" fill="#a00">สัญญาเห็นผลเร็วเกินจริง</text>
<line x1="224.0" y1="130.0" x2="246.0" y2="130.0" stroke="#a00" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="10.0" y="169.0" font-size="12" text-anchor="start" fill="#a00">ไม่ต้องทำอะไรเลย</text>
<line x1="224.0" y1="165.0" x2="246.0" y2="165.0" stroke="#a00" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="10.0" y="204.0" font-size="12" text-anchor="start" fill="#a00">อ้างรักษาโรค (อาหารห้ามโฆษณา)</text>
<line x1="224.0" y1="200.0" x2="246.0" y2="200.0" stroke="#a00" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="600.0" y="239.0" font-size="12" text-anchor="start" fill="#a00">"ธรรมชาติ" ไม่ได้แปลว่าปลอดภัย</text>
<line x1="596.0" y1="235.0" x2="574.0" y2="235.0" stroke="#a00" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="600.0" y="274.0" font-size="12" text-anchor="start" fill="#a00">คำรีวิวไม่ใช่หลักฐาน</text>
<line x1="596.0" y1="270.0" x2="574.0" y2="270.0" stroke="#a00" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="600.0" y="309.0" font-size="12" text-anchor="start" fill="#a00">ภาพก่อน-หลังตกแต่งได้</text>
<line x1="596.0" y1="305.0" x2="574.0" y2="305.0" stroke="#a00" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="10.0" y="344.0" font-size="12" text-anchor="start" fill="#a00">เร่งให้รีบตัดสินใจ</text>
<line x1="224.0" y1="340.0" x2="246.0" y2="340.0" stroke="#a00" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="600.0" y="410.0" font-size="12" text-anchor="start" fill="#a00">ตรวจเลขไม่ได้</text>
<line x1="596.0" y1="406.0" x2="574.0" y2="406.0" stroke="#a00" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="420.0" y="458.0" font-size="11" text-anchor="middle" fill="#555">โฆษณาสมมติเพื่อฝึกวิเคราะห์ ไม่ใช่สินค้าจริง</text>
</svg>
