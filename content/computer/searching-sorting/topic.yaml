id: computer.algorithms.searching-sorting
subject: computer
title: { th: อัลกอริทึมการค้นหาและการเรียงลำดับ, en: "Searching and sorting algorithms" }
summary: ค้นหาแบบลำดับและแบบทวิภาค เรียงแบบเลือก แบบแทรก และแบบผสาน กลยุทธ์ลองทุกทางกับแบ่งแยกและเอาชนะ การนับขั้นและสัญกรณ์บิ๊กโอ และการเลือกโดยชั่งความอ่านง่ายกับประสิทธิภาพ
difficulty: 5
minutes: 50
prerequisites: [computer.programming.lists-strings]
encompasses:
  - { id: computer.programming.lists-strings, weight: 0.3 }
  - { id: computer.programming.functions, weight: 0.2 }
  - { id: computer.algorithms.computational-thinking, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: binary-search.svg
    alt: "ค้นหาแบบทวิภาคหา 23 ในลิสต์ 15 ตัว 2, 5, 8, 12, 16, 23, 38, 45, 56, 61, 72, 77, 81, 90, 95 ดัชนี 0 ถึง 14 รอบที่ 1 ช่วงทั้งลิสต์ ตัวกลางดัชนี 7 คือ 45 มากกว่า 23 จึงตัดครึ่งขวา รอบที่ 2 ช่วงดัชนี 0 ถึง 6 ตัวกลางดัชนี 3 คือ 12 น้อยกว่า 23 จึงตัดครึ่งซ้าย รอบที่ 3 ช่วงดัชนี 4 ถึง 6 ตัวกลางดัชนี 5 คือ 23 เจอ ส่วนที่ตัดทิ้งแล้วเป็นสีเทา เทียบทั้งหมด 3 ครั้ง"
    caption: "ทวิภาคตัดช่วงที่ค้นลงครึ่งหนึ่งทุกรอบ"
  - type: worked-example
    title: เทียบการค้นหาสองแบบกับรายชื่อนักเรียน
    problem: "รายชื่อนักเรียน 1,200 คน ต้องค้นหาชื่อ ให้เทียบจำนวนครั้งที่เทียบในกรณีแย่ที่สุดระหว่างค้นหาแบบลำดับกับทวิภาค และบอกว่าทวิภาคต้องมีเงื่อนไขอะไร"
    steps:
      - text: "แบบลำดับ: กรณีแย่ที่สุดต้องเทียบครบ 1,200 ครั้ง (ชื่ออยู่ท้ายสุดหรือไม่มี)"
      - text: "ทวิภาค: ช่วงหดลงครึ่งหนึ่งทุกรอบ 1200 → 600 → 300 → 150 → 75 → 37 → 18 → 9 → 4 → 2 → 1"
        why: "นับจำนวนครั้งที่ต้องตัดครึ่งจนเหลือหนึ่งตัว คือการหา log₂ n"
      - text: "ใช้สูตร ⌊log₂ 1200⌋ + 1 = 10 + 1 = 11 ครั้ง (เพราะ 2¹⁰ = 1,024 ≤ 1,200 < 2,048 = 2¹¹)"
      - text: "เงื่อนไข: รายชื่อต้องเรียงตามตัวอักษรก่อน ถ้ายังไม่เรียงต้องเสียเวลาเรียงอีกครั้งหนึ่ง"
        why: "ถ้าค้นครั้งเดียว การเรียงก่อนอาจไม่คุ้ม แต่ถ้าค้นบ่อย เรียงครั้งเดียวแล้วใช้ทวิภาคคุ้มมาก"
    answer: "แบบลำดับ 1,200 ครั้ง ทวิภาค 11 ครั้ง แต่ทวิภาคใช้ได้เมื่อรายชื่อเรียงแล้วเท่านั้น"
  - { type: check, problem: computer.algorithms.searching-sorting.p006, prompt: "ลองคำนวณจำนวนครั้งที่ทวิภาคเทียบมากที่สุด" }
  - type: figure
    src: merge-sort.svg
    alt: "การเรียงแบบผสานของลิสต์ 5, 2, 8, 6, 1, 9, 3, 7 แถวบนแบ่งครึ่งเป็น 5, 2, 8, 6 กับ 1, 9, 3, 7 แล้วแบ่งเป็น 5, 2 / 8, 6 / 1, 9 / 3, 7 แล้วเหลือตัวเดียวแปดตัว (สีเหลือง) จากนั้นผสานเป็น 2, 5 / 6, 8 / 1, 9 / 3, 7 แล้วผสานเป็น 2, 5, 6, 8 กับ 1, 3, 7, 9 และผสานสุดท้ายได้ 1, 2, 3, 5, 6, 7, 8, 9 (สีเขียว)"
    caption: "แบ่งครึ่งจนเหลือตัวเดียว แล้วผสานลิสต์ที่เรียงแล้วกลับขึ้นมา"
  - type: figure
    src: growth.svg
    alt: "กราฟจำนวนขั้นเทียบกับขนาดข้อมูล n ตั้งแต่ 1 ถึง 40 แกนตั้ง 0 ถึง 400 เส้น O(log n) สีเขียวแทบแบนอยู่ใกล้ศูนย์ เส้น O(n) สีน้ำเงินเป็นเส้นตรงถึง 40 เส้น O(n log n) สีส้มโค้งขึ้นถึงราว 213 ที่ n = 40 เส้น O(n²) สีแดงโค้งชันขึ้นถึง 400 ตั้งแต่ n = 20"
    caption: "ยิ่ง n ใหญ่ ความต่างของอัตราการโตยิ่งชัด"
  - type: worked-example
    title: เลือกวิธีเรียงคะแนนสอบของทั้งจังหวัด
    problem: "สำนักงานเขตต้องเรียงคะแนนสอบของนักเรียน 50,000 คนทุกปี ข้อมูลมาแบบไม่เรียง ให้เทียบเรียงแบบเลือกกับแบบผสาน และเลือกพร้อมเหตุผล"
    steps:
      - text: "แบบเลือก: เทียบ n(n − 1)/2 = 50,000 × 49,999 ÷ 2 ≈ 1.25 × 10⁹ ครั้ง"
      - text: "แบบผสาน: ราว n log₂ n = 50,000 × log₂ 50,000 ≈ 50,000 × 15.6 ≈ 7.8 × 10⁵ ขั้น"
        why: "บิ๊กโอใช้ประมาณ เราสนใจลำดับขนาด ไม่ใช่ค่าเป๊ะ"
      - text: "เทียบ: แบบผสานใช้ขั้นน้อยกว่าราว 1,600 เท่า"
      - text: "ชั่งความอ่านง่าย: แบบเลือกโค้ดสั้นกว่า แต่ข้อมูลขนาดนี้ความเร็วสำคัญกว่า และในงานจริงควรใช้ sorted() ของ Python ซึ่งเป็น O(n log n) และผ่านการทดสอบมาแล้ว"
        why: "การเลือกอัลกอริทึมต้องอธิบายได้ว่าได้อะไรและเสียอะไร ไม่ใช่เลือกแบบที่คุ้นที่สุด"
    answer: "เลือกแบบผสานหรือ sorted() เพราะใช้ราว 7.8 × 10⁵ ขั้น เทียบกับแบบเลือก 1.25 × 10⁹ ครั้ง แม้แบบเลือกจะเขียนง่ายกว่า"
  - { type: check, problem: computer.algorithms.searching-sorting.p009, prompt: "นับการเทียบของการเรียงแบบเลือก" }
glossary:
  - { term: การค้นหาแบบลำดับ (linear search), definition: "การเทียบข้อมูลทีละตัวตั้งแต่ตัวแรกจนเจอหรือหมด ใช้ได้กับข้อมูลที่ไม่เรียง เป็น O(n)" }
  - { term: การค้นหาแบบทวิภาค (binary search), definition: "การค้นในข้อมูลที่เรียงแล้วโดยดูตัวกลางและตัดครึ่งที่ไม่มีเป้าหมายทิ้ง เป็น O(log n)" }
  - { term: การเรียงแบบเลือก (selection sort), definition: "หาตัวน้อยที่สุดของส่วนที่เหลือแล้วสลับมาไว้ข้างหน้าทีละรอบ เทียบ n(n − 1)/2 ครั้ง" }
  - { term: การเรียงแบบแทรก (insertion sort), definition: "หยิบทีละตัวไปแทรกในส่วนที่เรียงแล้ว เร็วมากเมื่อข้อมูลเกือบเรียง" }
  - { term: การเรียงแบบผสาน (merge sort), definition: "แบ่งครึ่งจนเหลือตัวเดียวแล้วผสานลิสต์ที่เรียงแล้วกลับขึ้นมา ใช้ราว n log n ขั้น" }
  - { term: ลองทุกทาง (brute force), definition: "กลยุทธ์ที่ลองทุกความเป็นไปได้ ง่ายแต่ช้าเมื่อจำนวนทางเลือกมาก" }
  - { term: แบ่งแยกและเอาชนะ (divide and conquer), definition: "กลยุทธ์ที่แบ่งปัญหาเป็นส่วนเล็กแบบเดียวกัน แก้แต่ละส่วนแล้วรวมผล" }
  - { term: สัญกรณ์บิ๊กโอ (Big-O notation), definition: "การบอกอัตราการโตของจำนวนขั้นเมื่อข้อมูลใหญ่ขึ้น โดยเก็บเฉพาะพจน์ที่โตเร็วที่สุด" }
flashcards:
  - { front: "ทวิภาคค้น 1,000,000 ตัวเทียบมากที่สุดกี่ครั้ง", back: "20 ครั้ง (⌊log₂ 10⁶⌋ + 1)" }
  - { front: "เรียงแบบเลือก n ตัวเทียบกี่ครั้ง", back: "n(n − 1)/2 ครั้งเสมอ เป็น O(n²)" }
  - { front: "อัลกอริทึมเรียงแบบใดเร็วเมื่อข้อมูลเกือบเรียง", back: "การเรียงแบบแทรก" }
  - { front: "ข้อมูลเพิ่ม 4 เท่า อัลกอริทึม O(n²) ช้าลงกี่เท่า", back: "ราว 16 เท่า" }
  - { front: "เมื่อใดไม่คุ้มที่จะเรียงก่อนค้น", back: "เมื่อค้นเพียงครั้งเดียว ค้นแบบลำดับ O(n) ถูกกว่าการเรียง O(n log n)" }
