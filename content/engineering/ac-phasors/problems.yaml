  - id: engineering.circuits.ac-phasors.p018
    topics: [engineering.circuits.ac-phasors]
    difficulty: 5
    type: numeric
    stem: "ต่อจากร้านกลึงโลหะ (โหลด $10\\ \\mathrm{kW}$ ตัวประกอบกำลัง $0.75$ ตามหลัง แก้เป็น $0.95$ ที่ $230\\ \\mathrm{V}$ $50\\ \\mathrm{Hz}$) ต้องใช้ตัวเก็บประจุขนานกับโหลดกี่ไมโครฟารัด"
    answer: { value: 333, tolerance: 3, unit: "μF" }
    misconceptions:
      - { match: 2092, feedback: "ใช้ $f$ แทน $\\omega$ ใน $C = Q_C/(\\omega V^2)$" }
      - { match: 166.4, feedback: "ใช้แรงดันยอด $325\\ \\mathrm{V}$ แต่สูตรกำลังใช้ค่า rms" }
    hints:
      - "จากโจทย์ก่อน $Q_C = 5532\\ \\mathrm{var}$"
      - "ตัวเก็บประจุที่แรงดัน $V$ ให้ $Q_C = V^2/X_C = \\omega CV^2$"
    solution: "$C = \\dfrac{5532}{2\\pi(50)(230^2)} = 3.33 \\times 10^{-4}\\ \\mathrm{F} = 333\\ \\mu\\mathrm{F}$ หลังแก้ กระแสลดจาก $10{,}000/(230 \\times 0.75) = 58.0\\ \\mathrm{A}$ เหลือ $45.8\\ \\mathrm{A}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

