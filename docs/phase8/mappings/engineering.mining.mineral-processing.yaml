rows:
  - { framework: th-coe-engineering-basics, indicators: ["MIN-2.3"], coverage: partial, note: "สอนหลักเคมีของการลอยแร่ในระดับแนวคิด (สารเก็บ สารทำให้ฟองเสถียร สารกด) และพลังงานบดตามกฎของบอนด์ แต่ยังไม่สอนเคมีไฟฟ้าหรือจลนพลศาสตร์ของผิวแร่ และการทำงานกับระบบก๊าซและของไหลอย่างละเอียด" }
  - { framework: th-coe-engineering-basics, indicators: ["MIN-2.5"], coverage: partial, note: "สอนการคำนวณดุลมวลของวงจรแต่งแร่ การเก็บกู้ อัตราส่วนความเข้มข้น การวิเคราะห์ขนาดและ F80 การแยกด้วยความถ่วง แม่เหล็ก และไฟฟ้าสถิตในระดับหลักการ การจัดการหาง และหลักการนำโลหะกลับจากของเสียอิเล็กทรอนิกส์ในบทเรียน (ยังไม่มีโจทย์) แต่ยังไม่สอนการออกแบบเครื่องจักรและการควบคุมวงจรเชิงระบบอย่างเต็มรูปแบบ" }
