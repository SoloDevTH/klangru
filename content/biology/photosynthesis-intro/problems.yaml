      - { id: d, text: "ทำให้พืชไม่ต้องหายใจ", feedback: "พืชหายใจระดับเซลล์ตลอดเวลา การสังเคราะห์ด้วยแสงไม่ได้ทดแทนการหายใจ" }
      - { id: e, text: "สร้างธาตุอาหารให้ดิน", feedback: "ธาตุอาหารในดินมาจากหินผุและการย่อยสลายซาก ไม่ได้เกิดจากการสังเคราะห์ด้วยแสงโดยตรง" }
    hints:
      - "นึกถึงผลผลิตสองอย่าง และวัตถุดิบที่พืชดึงจากอากาศ"
      - "พืชหายใจหรือไม่"
    solution: "การสังเคราะห์ด้วยแสงเก็บพลังงานแสงไว้ในน้ำตาล เป็นอาหารเริ่มต้นของโซ่อาหาร ผลิตออกซิเจน และดึงแก๊สคาร์บอนไดออกไซด์ออกจากอากาศ ช่วยรักษาสมดุลแก๊ส แต่พืชยังต้องหายใจ และไม่ได้สร้างธาตุอาหารให้ดิน"
