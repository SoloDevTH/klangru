problems:
- id: business.finance.time-value-of-money.p001
  topics:
  - business.finance.time-value-of-money
  difficulty: 1
  type: mcq
  stem: ทำไมเงิน $10{,}000$ บาทวันนี้จึงมีค่ามากกว่าเงิน $10{,}000$ บาทที่จะได้ในอีก 3 ปี เลือกทุกข้อที่ถูก
  multiple: true
  choices:
  - id: a
    text: เงินวันนี้นำไปฝากหรือลงทุนให้งอกเงยได้
    correct: true
  - id: b
    text: ราคาสินค้าอาจสูงขึ้น เงินในอนาคตซื้อของได้น้อยลง
    correct: true
  - id: c
    text: เงินในอนาคตมีความเสี่ยงว่าอาจไม่ได้รับจริง
    correct: true
  - id: d
    text: เพราะธนบัตรในอนาคตจะเปลี่ยนแบบ
    feedback: แบบธนบัตรไม่เกี่ยวกับมูลค่าของเงินตามเวลา
  - id: e
    text: ไม่จริง เงินจำนวนเท่ากันมีค่าเท่ากันเสมอ
    feedback: นี่คือความเข้าใจผิดที่ทำให้ตัดสินใจทางการเงินพลาด
  hints:
  - คิดถึงดอกเบี้ย เงินเฟ้อ และความไม่แน่นอน
  - ถ้าให้เลือกได้ เราอยากได้เงินวันนี้หรืออีก 3 ปี
  solution: เงินวันนี้มีค่ามากกว่าเพราะ (1) ค่าเสียโอกาส นำไปลงทุนได้ผลตอบแทน (2) เงินเฟ้อลดอำนาจซื้อในอนาคต (3) ความเสี่ยงที่อาจไม่ได้รับเงินในอนาคต จึงต้องคิดลดเงินในอนาคตกลับมาเป็นมูลค่าปัจจุบันก่อนเปรียบเทียบ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.time-value-of-money.p002
  topics:
  - business.finance.time-value-of-money
  difficulty: 2
  type: numeric
  stem: บัตรเงินสดแห่งหนึ่งคิดดอกเบี้ย $12\%$ ต่อปี ทบต้นรายเดือน (เดือนละ $1\%$) อัตราดอกเบี้ยที่แท้จริงต่อปี (EAR) เป็นกี่เปอร์เซ็นต์ (ตอบเป็น % ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 12.682503
    tolerance: 0.03
    unit: '%'
  misconceptions:
  - match: 12
    feedback: นั่นคืออัตราที่ประกาศ ยังไม่รวมผลการทบต้นรายเดือน
  - match: 1
    feedback: นั่นคืออัตราต่อเดือน
  hints:
  - EAR $= (1 + i)^{12} - 1$ เมื่อ $i$ คืออัตราต่อเดือน
  - $(1.01)^{12} \approx 1.1268$
  solution: EAR $= (1.01)^{12} - 1 \approx 0.1268$ หรือ $12.68\%$ สูงกว่า $12\%$ เพราะดอกเบี้ยแต่ละเดือนถูกคิดดอกเบี้ยต่อ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.time-value-of-money.p003
  topics:
  - business.finance.time-value-of-money
  difficulty: 2
  type: match
  stem: จับคู่แนวคิดกับความหมาย
  pairs:
  - left: มูลค่าปัจจุบันสุทธิ (NPV) มากกว่า 0
    right: โครงการให้ผลตอบแทนสูงกว่าอัตราที่ต้องการ ควรพิจารณาลงทุน
  - left: อัตราผลตอบแทนภายใน (IRR)
    right: อัตราคิดลดที่ทำให้ NPV เท่ากับศูนย์
  - left: เงินงวดต้นงวด
    right: จ่ายหรือรับต้นแต่ละงวด เช่น ค่าเช่าจ่ายล่วงหน้า
  - left: อัตราคิดลด
    right: ผลตอบแทนที่ต้องการ ใช้ย้ายเงินในอนาคตกลับมาเป็นมูลค่าปัจจุบัน
  hints:
  - NPV คือผลรวมมูลค่าปัจจุบันของเงินเข้าลบเงินออก
  - IRR เป็นอัตรา ไม่ใช่จำนวนเงิน
  solution: NPV > 0 → คุ้ม · IRR → อัตราที่ทำให้ NPV = 0 · เงินงวดต้นงวด → จ่ายต้นงวด · อัตราคิดลด → ผลตอบแทนที่ต้องการ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.time-value-of-money.p004
  topics:
  - business.finance.time-value-of-money
  difficulty: 3
  type: numeric
  stem: ตามภาพเส้นเวลา จะได้รับเงินปลายปีที่ 1, 2, 3 เป็น $30{,}000$, $40{,}000$, $50{,}000$ บาท ถ้าอัตราคิดลด $8\%$ ต่อปี มูลค่าปัจจุบันรวมเป็นกี่บาท (ตอบเป็นบาท)
  answer:
    value: 101762.942641
    tolerance: 5
    unit: บาท
  misconceptions:
  - match: 120000
    feedback: รวมเงินโดยไม่คิดลด
  - match: 95259.868922
    feedback: คิดลดทุกก้อนด้วย 3 ปี แต่ละก้อนได้รับต่างเวลากัน
  figure:
    src: p-timeline.svg
    alt: เส้นเวลาแสดงกระแสเงินสดที่จะได้รับ (สมมติ) ปีที่ 0 ไม่มีเงิน ปลายปีที่ 1 ได้ 30,000 บาท ปลายปีที่ 2 ได้ 40,000 บาท ปลายปีที่ 3 ได้ 50,000 บาท อัตราคิดลด 8% ต่อปี
  hints:
  - 'คิดลดทีละก้อน: ก้อนปีที่ $t$ หารด้วย $(1.08)^t$'
  - รวมมูลค่าปัจจุบันของทั้งสามก้อน
  solution: $\dfrac{30{,}000}{1.08} + \dfrac{40{,}000}{1.08^2} + \dfrac{50{,}000}{1.08^3} = 27{,}777.78 + 34{,}293.55 + 39{,}691.61 \approx 101{,}762.94$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.time-value-of-money.p005
  topics:
  - business.finance.time-value-of-money
  difficulty: 3
  type: numeric
  stem: ร้านเช่าแผงในตลาด จ่ายค่าเช่าปีละ $10{,}000$ บาท **ต้นปี** เป็นเวลา $5$ ปี ถ้าอัตราคิดลด $5\%$ ต่อปี มูลค่าปัจจุบันของค่าเช่าทั้งหมดเป็นกี่บาท (ตอบเป็นบาท)
  answer:
    value: 45459.505042
    tolerance: 5
    unit: บาท
  misconceptions:
  - match: 43294.766706
    feedback: ใช้สูตรปลายงวด แต่ค่าเช่าจ่ายต้นปี
  - match: 50000
    feedback: รวมโดยไม่คิดลด
  hints:
  - 'เงินงวดต้นงวด: งวดแรกจ่ายวันนี้ ไม่ต้องคิดลด'
  - PV ต้นงวด $=$ PV ปลายงวด $\times (1 + r)$
  solution: PV ปลายงวด $= 10{,}000 \times \dfrac{1 - 1.05^{-5}}{0.05} \approx 43{,}294.77$ บาท ต้นงวดคูณ $1.05$ ได้ $\approx 45{,}459.51$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.time-value-of-money.p006
  topics:
  - business.finance.time-value-of-money
  difficulty: 3
  type: numeric
  stem: ผู้ชนะรางวัลเลือกได้ระหว่างเงินก้อน $900{,}000$ บาทวันนี้ หรือรับปีละ $120{,}000$ บาท ปลายปี $10$ ปี ถ้าอัตราคิดลด $5\%$ ต่อปี **มูลค่าปัจจุบัน** ของการรับรายปีเป็นกี่บาท (ตอบเป็นบาท)
  answer:
    value: 926608.191502
    tolerance: 5
    unit: บาท
  misconceptions:
  - match: 1200000
    feedback: รวมเงินทุกปีโดยไม่คิดลด
  - match: 736695.904249
    feedback: คิดลดทุกก้อนด้วย 10 ปี
  hints:
  - ใช้สูตรมูลค่าปัจจุบันของเงินงวด $R \cdot \dfrac{1 - (1 + r)^{-n}}{r}$
  - $R = 120{,}000$, $r = 0.05$, $n = 10$
  solution: PV $= 120{,}000 \times \dfrac{1 - 1.05^{-10}}{0.05} = 120{,}000 \times 7.7217 \approx 926{,}608.19$ บาท มากกว่าเงินก้อน $900{,}000$ บาท ถ้าอัตรา $5\%$ เหมาะกับผู้รับ การรับรายปีจึงคุ้มกว่า
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.time-value-of-money.p007
  topics:
  - business.finance.time-value-of-money
  difficulty: 3
  type: mcq
  stem: ต่อจากข้อที่แล้ว ถ้าผู้ชนะรางวัลมีหนี้บัตรเครดิตดอกเบี้ย $16\%$ ต่อปีที่ต้องปิด ข้อใดเป็นเหตุผลที่ดีที่สุด
  choices:
  - id: a
    text: รับเงินก้อน เพราะสำหรับเขา ค่าเสียโอกาสของเงินคือ 16% ใช้คิดลดแล้วเงินรายปีมีมูลค่าปัจจุบันต่ำกว่า 900,000 บาทมาก
    correct: true
  - id: b
    text: รับรายปีเสมอ เพราะรวมแล้วได้ 1,200,000 บาท
    feedback: การรวมตัวเลขต่างเวลาโดยไม่คิดลดทำให้ตัดสินใจผิด
  - id: c
    text: ไม่ต่างกัน เพราะได้เงินทั้งสองแบบ
    feedback: มูลค่าปัจจุบันต่างกันมากเมื่ออัตราคิดลดสูง
  - id: d
    text: รับรายปี เพราะอัตราคิดลดไม่เกี่ยวกับหนี้
    feedback: อัตราคิดลดควรสะท้อนค่าเสียโอกาสของผู้ตัดสินใจเอง
  hints:
  - อัตราคิดลดควรเท่ากับผลตอบแทนที่ดีที่สุดที่เขาได้ หรือดอกเบี้ยที่เขาประหยัดได้
  - ยิ่งอัตราคิดลดสูง เงินในอนาคตยิ่งมีค่าปัจจุบันต่ำ
  solution: ที่ $16\%$ PV ของ $120{,}000$ บาท $10$ ปี $\approx 579{,}987$ บาท ต่ำกว่า $900{,}000$ บาทมาก การรับเงินก้อนไปปิดหนี้ดอกเบี้ยสูงจึงดีกว่า การตัดสินใจทางการเงินครั้งใหญ่ขึ้นกับสถานการณ์ของแต่ละคนและผลระยะยาว
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.time-value-of-money.p008
  topics:
  - business.finance.time-value-of-money
  difficulty: 4
  type: numeric
  stem: ร้านเบเกอรี่พิจารณาซื้อเตาอบใหม่ราคา $200{,}000$ บาท (จ่ายวันนี้) ประหยัดค่าไฟและเพิ่มยอดขายได้ปีละ $60{,}000$ บาท ปลายปี $5$ ปี และเมื่อครบ $5$ ปีขายเตานี้เป็นเศษได้ $20{,}000$ บาท (ปลายปีที่ $5$) ถ้าอัตราผลตอบแทนที่ต้องการ $10\%$ ต่อปี **NPV** เป็นกี่บาท (ตอบเป็นบาท)
  answer:
    value: 39865.632626
    tolerance: 10
    unit: บาท
  misconceptions:
  - match: 120000
    feedback: รวมเงินโดยไม่คิดลด
  - match: 239865.64
    feedback: ลืมหักเงินลงทุน 200,000 บาท
  hints:
  - NPV $=$ PV ของเงินเข้าทั้งหมด $-$ เงินลงทุน
  - PV ของเงินงวด $60{,}000 \times 3.7908$ และ PV ของ $20{,}000$ ปลายปีที่ 5
  solution: PV เงินงวด $= 60{,}000 \times \dfrac{1 - 1.1^{-5}}{0.1} \approx 227{,}447.21$ PV มูลค่าซาก $= 20{,}000 \div 1.1^5 \approx 12{,}418.43$ NPV $\approx 227{,}447.21 + 12{,}418.43 - 200{,}000 \approx 39{,}865.63$ บาท มากกว่าศูนย์ จึงคุ้มค่าที่จะลงทุน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.time-value-of-money.p009
  topics:
  - business.finance.time-value-of-money
  difficulty: 4
  type: numeric
  stem: กู้ซื้อบ้าน $1{,}000{,}000$ บาท ดอกเบี้ย $6\%$ ต่อปี คิดแบบลดต้นลดดอกรายเดือน ($0.5\%$ ต่อเดือน) ผ่อน $20$ ปี ($240$ งวด) ค่างวดเดือนละกี่บาท (ตอบเป็นบาท ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 7164.310585
    tolerance: 1
    unit: บาท
  misconceptions:
  - match: 9166.666667
    feedback: คิดดอกเบี้ยแบบเงินต้นคงที่ทั้ง 20 ปี ซึ่งไม่ใช่ลดต้นลดดอก
  - match: 4166.666667
    feedback: ลืมดอกเบี้ย
  hints:
  - $R = \dfrac{P \cdot i}{1 - (1 + i)^{-n}}$
  - $i = 0.005$, $n = 240$
  solution: $R = \dfrac{1{,}000{,}000 \times 0.005}{1 - 1.005^{-240}} \approx 7{,}164.31$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.time-value-of-money.p010
  topics:
  - business.finance.time-value-of-money
  difficulty: 4
  type: numeric
  stem: ต่อจากข้อที่แล้ว (ค่างวด $7{,}164.31$ บาท อัตรา $0.5\%$ ต่อเดือน) งวดแรกเป็น **เงินต้น** กี่บาท (ตอบเป็นบาท ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 2164.310585
    tolerance: 0.5
    unit: บาท
  misconceptions:
  - match: 5000
    feedback: นั่นคือดอกเบี้ย
  - match: 4166.666667
    feedback: คิดว่าเงินต้นลดเท่ากันทุกงวด
  hints:
  - ดอกเบี้ยงวดแรก $=$ เงินต้นคงเหลือ $\times 0.5\%$
  - เงินต้นที่ลด $=$ ค่างวด $-$ ดอกเบี้ย
  solution: ดอกเบี้ยงวดแรก $= 1{,}000{,}000 \times 0.005 = 5{,}000$ บาท เงินต้น $= 7{,}164.31 - 5{,}000 = 2{,}164.31$ บาท ช่วงแรกค่างวดส่วนใหญ่เป็นดอกเบี้ย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.time-value-of-money.p011
  topics:
  - business.finance.time-value-of-money
  difficulty: 4
  type: numeric
  stem: เช่าซื้อรถยนต์ ยอดจัด $400{,}000$ บาท ดอกเบี้ยแบบเงินต้นคงที่ $3\%$ ต่อปี ผ่อน $48$ งวด (4 ปี) ค่างวดเดือนละกี่บาท (ตอบเป็นบาท ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 9333.333333
    tolerance: 0.5
    unit: บาท
  misconceptions:
  - match: 8583.333333
    feedback: คิดดอกเบี้ยแค่ปีเดียว
  - match: 8333.333333
    feedback: ลืมดอกเบี้ย
  hints:
  - ดอกเบี้ยรวม $= 400{,}000 \times 3\% \times 4$
  - ค่างวด $=$ (ยอดจัด $+$ ดอกเบี้ยรวม) $\div 48$
  solution: ดอกเบี้ยรวม $= 48{,}000$ บาท ค่างวด $= 448{,}000 \div 48 \approx 9{,}333.33$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.time-value-of-money.p012
  topics:
  - business.finance.time-value-of-money
  difficulty: 5
  type: numeric
  stem: ต่อจากข้อที่แล้ว (ยอดจัด $400{,}000$ บาท ผ่อนเดือนละ $9{,}333.33$ บาท $48$ งวด) หาอัตราดอกเบี้ยรายเดือน $i$ ที่ทำให้มูลค่าปัจจุบันของค่างวดเท่ากับ $400{,}000$ บาท แล้วตอบเป็น **อัตราต่อปี** ($i \times 12$) กี่เปอร์เซ็นต์ (ตอบเป็น % ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 5.668475
    tolerance: 0.05
    unit: '%'
  misconceptions:
  - match: 3
    feedback: นั่นคืออัตราที่ประกาศแบบเงินต้นคงที่ ไม่ใช่อัตราที่แท้จริง
  - match: 6
    feedback: ประมาณสองเท่าแบบหยาบ ต้องคำนวณจากค่างวดจริง
  hints:
  - ลองแทนค่า $i$ แล้วคำนวณ $9{,}333.33 \times \dfrac{1 - (1 + i)^{-48}}{i}$ ให้ใกล้ $400{,}000$
  - ลองแบ่งครึ่งช่วง เช่น เริ่มที่ $i = 0.4\%$ และ $0.6\%$
  solution: ที่ $i = 0.4\%$ PV $\approx 406,879.66$ (มากกว่า $400{,}000$) ที่ $i = 0.5\%$ PV $\approx 397,416.30$ (น้อยกว่า) แบ่งครึ่งช่วงต่อไปได้ $i \approx 0.4724\%$ ต่อเดือน หรือประมาณ $5.67\%$ ต่อปี เกือบสองเท่าของ $3\%$ ที่ประกาศ เพราะดอกเบี้ยแบบเงินต้นคงที่คิดจากยอดจัดเต็มตลอด แม้ผ่อนคืนไปแล้ว
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.time-value-of-money.p013
  topics:
  - business.finance.time-value-of-money
