problems:
  - id: chemistry.bonding.hybridization.p001
    topics: [chemistry.bonding.hybridization]
    difficulty: 1
    type: mcq
    stem: "ในโมเลกุลมีเทน CH₄ อะตอมคาร์บอนมีไฮบริดแบบใด"
    choices:
      - { id: a, text: "sp", feedback: "sp ใช้เมื่อคาร์บอนมีเพียง 2 กลุ่มอิเล็กตรอน เช่นใน CO₂ มีเทนมี 4 พันธะ" }
      - { id: b, text: "sp²", feedback: "sp² มี 3 กลุ่มอิเล็กตรอน เช่นในเอทีน มีเทนไม่มีพันธะคู่" }
      - { id: c, text: "sp³", correct: true, feedback: "ถูก มีเทนมีพันธะ C–H สี่พันธะเดี่ยว จึงมี 4 กลุ่มอิเล็กตรอน" }
      - { id: d, text: "sp³d", feedback: "sp³d ใช้กับ 5 กลุ่มอิเล็กตรอน เช่น PCl₅ ไม่ใช่มีเทน" }
    hints:
      - "นับว่าคาร์บอนสร้างพันธะกับ H กี่พันธะ"
      - "จำนวนกลุ่มอิเล็กตรอน 4 กลุ่มสอดคล้องกับไฮบริดแบบใด"
    solution: "มีเทนมีพันธะ C–H สี่พันธะเดี่ยวและไม่มีคู่โดดเดี่ยว รวมเป็น 4 กลุ่มอิเล็กตรอน จึงเป็น **sp³**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.hybridization.p002
    topics: [chemistry.bonding.hybridization]
    difficulty: 1
    type: numeric
    stem: "อะเซทิลีน C₂H₂ (เอไทน์) มีพันธะซิกมาทั้งหมดกี่พันธะ"
    answer: { value: 3, tolerance: 0, unit: "พันธะ" }
    misconceptions:
      - { match: 2, feedback: "นับเฉพาะ C–H ลืมพันธะ C≡C ซึ่งมีพันธะซิกมาหนึ่งพันธะ" }
      - { match: 5, feedback: "นับพันธะพายรวมเข้าไปด้วย แต่พายไม่ใช่ซิกมา" }
    hints:
      - "วาดโครงสร้าง H–C≡C–H ก่อน"
      - "พันธะสามประกอบด้วยพันธะซิกมากี่พันธะ"
    solution: "พันธะ C–H สองพันธะเป็นซิกมา และพันธะสาม C≡C มีซิกมาหนึ่งพันธะ รวมเป็น **3 พันธะซิกมา**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.hybridization.p003
    topics: [chemistry.bonding.hybridization]
    difficulty: 1
    type: numeric
    stem: "เอทิลีน C₂H₄ มีพันธะพายกี่พันธะ"
    answer: { value: 1, tolerance: 0, unit: "พันธะ" }
    misconceptions:
      - { match: 2, feedback: "พันธะคู่มีพายหนึ่งพันธะ ไม่ใช่สองพันธะ (พันธะคู่ = σ 1 + π 1)" }
      - { match: 4, feedback: "พันธะ C–H ทั้งสี่เป็นซิกมาทั้งหมด จึงไม่นับเป็นพาย" }
    hints:
      - "พันธะคู่ประกอบด้วยซิกมากี่พันธะและพายกี่พันธะ"
      - "พันธะเดี่ยวทั้งหมดเป็นพันธะซิกมา"
    solution: "พันธะ C=C มีซิกมา 1 และพาย 1 ส่วนพันธะ C–H ทั้งสี่เป็นซิกมา จึงมีพันธะพายเพียง **1 พันธะ**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.hybridization.p004
    topics: [chemistry.bonding.hybridization]
    difficulty: 2
    type: mcq
    stem: "แก๊สอะเซทิลีน (C₂H₂) ที่ใช้ในงานเชื่อมโลหะ มีมุม H–C–C เท่าไร"
    choices:
      - { id: a, text: "90°", feedback: "90° ไม่ใช่มุมของโมเลกุลนี้ เป็นมุมของโครงสร้างแบบอื่น" }
      - { id: b, text: "109.5°", feedback: "109.5° คือมุมของ sp³ เช่นในมีเทน" }
      - { id: c, text: "120°", feedback: "120° คือมุมของ sp² เช่นในเอทีน" }
      - { id: d, text: "180°", correct: true, feedback: "ถูก คาร์บอนแต่ละตัวมี 2 กลุ่มอิเล็กตรอน (พันธะ C–H และพันธะสามที่นับเป็นหนึ่งกลุ่ม) จึงเป็น sp และเรียงเป็นเส้นตรง" }
    hints:
      - "นึกถึงไฮบริดของคาร์บอนที่มี 2 กลุ่มอิเล็กตรอน"
      - "โมเลกุลเส้นตรงมีมุมเท่าไร"
    solution: "คาร์บอนใน C₂H₂ มี 2 กลุ่มอิเล็กตรอนต่ออะตอม จึงเป็น sp และโมเลกุลเป็นเส้นตรง มุม H–C–C = **180°**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.hybridization.p005
    topics: [chemistry.bonding.hybridization]
    difficulty: 2
    type: numeric
    stem: "ออร์บิทัลไฮบริด sp² มีลักษณะ s อยู่กี่เปอร์เซ็นต์ (ตอบเป็นร้อยละ โดยนับตามสัดส่วนออร์บิทัลที่นำมาผสม)"
    answer: { value: 33.3, tolerance: 0.1, unit: "%" }
    misconceptions:
      - { match: 25, feedback: "25% คือ 1 ใน 4 ซึ่งเป็นสัดส่วนของ sp³" }
      - { match: 50, feedback: "50% คือ 1 ใน 2 ซึ่งเป็นสัดส่วนของ sp" }
    hints:
      - "sp² ผสม s หนึ่งออร์บิทัลกับ p กี่ออร์บิทัล"
      - "สัดส่วนของ s คือ 1 ส่วนจากทั้งหมดกี่ส่วน"
    solution: "sp² มี 1 s และ 2 p รวม 3 ออร์บิทัล สัดส่วน s = 1/3 = **33.3%**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.hybridization.p006
    topics: [chemistry.bonding.hybridization]
    difficulty: 2
    type: text
    stem: "ชนิดไฮบริดของคาร์บอนแต่ละตัวใน C₂H₄ คืออะไร (ตอบ sp, sp² หรือ sp³)"
    accepted: ["sp2", "sp²"]
    misconceptions:
      - { match: "sp3", feedback: "sp³ ใช้เมื่อคาร์บอนมี 4 กลุ่มอิเล็กตรอน แต่ C ในเอทีนมีเพียง 3 กลุ่ม (พันธะ C–H สองพันธะและพันธะคู่ C=C หนึ่งกลุ่ม)" }
      - { match: "sp", feedback: "sp ใช้เมื่อมี 2 กลุ่มอิเล็กตรอน C ในเอทีนมี 3 กลุ่ม" }
    hints:
      - "นับกลุ่มอิเล็กตรอนรอบคาร์บอนหนึ่งตัวใน C₂H₄"
      - "พันธะคู่นับเป็นกี่กลุ่ม"
    solution: "C แต่ละตัวมีพันธะ C–H สองพันธะและพันธะคู่ C=C หนึ่งกลุ่ม รวม 3 กลุ่ม จึงเป็น **sp²**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.hybridization.p007
    topics: [chemistry.bonding.hybridization]
    difficulty: 2
    type: order
    stem: "เรียงอะตอมคาร์บอนต่อไปนี้ตามมุมพันธะที่คาร์บอนนั้นทำ จากน้อยไปมาก"
    items: ["CH₄ (sp³)", "C₂H₄ (sp²)", "C₂H₂ (sp)"]
    hints:
      - "แต่ละไฮบริดมีมุมประจำตัว"
      - "sp³ มีมุมเล็กที่สุดในสามแบบนี้"
    solution: "sp³ ≈ 109.5°, sp² ≈ 120° และ sp = 180° จึงเรียงได้ CH₄ < C₂H₄ < C₂H₂"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.hybridization.p008
    topics: [chemistry.bonding.hybridization]
    difficulty: 2
    type: match
    stem: "จับคู่โมเลกุลกับชนิดไฮบริดของอะตอมกลาง"
    pairs:
      - { left: "BF₃", right: "sp²" }
      - { left: "CO₂", right: "sp" }
      - { left: "CH₄", right: "sp³" }
      - { left: "PCl₅", right: "sp³d" }
    hints:
      - "นับกลุ่มอิเล็กตรอนรอบอะตอมกลางของแต่ละโมเลกุล"
      - "BF₃ มีพันธะ B–F สามพันธะและไม่มีคู่โดดเดี่ยว"
    solution: "BF₃ มี 3 กลุ่ม (sp²) CO₂ มี 2 กลุ่ม (sp) CH₄ มี 4 กลุ่ม (sp³) และ PCl₅ มี 5 กลุ่ม (sp³d)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.hybridization.p009
    topics: [chemistry.bonding.hybridization]
    difficulty: 3
    type: numeric
    stem: "ในโมเลกุล NH₃ อะตอมไนโตรเจนมีกลุ่มอิเล็กตรอนรอบตัวทั้งหมดกี่กลุ่ม (นับทั้งพันธะและคู่โดดเดี่ยว)"
    answer: { value: 4, tolerance: 0, unit: "กลุ่ม" }
    misconceptions:
      - { match: 3, feedback: "ลืมนับคู่โดดเดี่ยวที่อยู่บนอะตอม N" }
    hints:
      - "NH₃ มีพันธะ N–H กี่พันธะ"
      - "N มีอิเล็กตรอนวงนอก 5 ตัว ใช้ 3 ตัวทำพันธะ เหลือ 2 ตัวเป็นคู่โดดเดี่ยวหนึ่งคู่"
    solution: "พันธะ N–H สามพันธะและคู่โดดเดี่ยวหนึ่งคู่ รวมเป็น **4 กลุ่ม** จึงเป็น sp³"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.hybridization.p010
    topics: [chemistry.bonding.hybridization]
    difficulty: 3
    type: mcq
    stem: "ข้อใดเป็นโมเลกุลที่อะตอมกลางเป็น sp³d"
    choices:
      - { id: a, text: "SF₆", feedback: "SF₆ มี 6 กลุ่มอิเล็กตรอน จึงเป็น sp³d²" }
      - { id: b, text: "BF₃", feedback: "BF₃ มี 3 กลุ่มอิเล็กตรอน จึงเป็น sp²" }
      - { id: c, text: "PCl₅", correct: true, feedback: "ถูก PCl₅ มี 5 พันธะรอบ P ไม่มีคู่โดดเดี่ยว จึงเป็น sp³d" }
      - { id: d, text: "SiH₄", feedback: "SiH₄ มี 4 กลุ่มอิเล็กตรอน จึงเป็น sp³" }
    hints:
      - "นับจำนวนพันธะรอบอะตอมกลางของแต่ละตัวเลือก"
      - "sp³d มีกี่กลุ่มอิเล็กตรอน"
    solution: "sp³d มี 5 กลุ่มอิเล็กตรอน ตรงกับ PCl₅ ซึ่งมีพันธะ P–Cl ห้าพันธะ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.hybridization.p011
    topics: [chemistry.bonding.hybridization]
    difficulty: 3
    type: numeric
    stem: "โมเลกุล CO₂ มีจำนวนพันธะซิกมาและพันธะพายรวมกันเท่าไร"
    answer: { value: 4, tolerance: 0, unit: "พันธะ" }
    misconceptions:
      - { match: 2, feedback: "นับเฉพาะพันธะซิกมา ต้องรวมพันธะพายด้วย" }
    hints:
      - "CO₂ เป็น O=C=O มีพันธะคู่กี่พันธะ"
      - "พันธะคู่แต่ละพันธะมีซิกมากี่พันธะและพายกี่พันธะ"
    solution: "CO₂ มีพันธะคู่สองพันธะ แต่ละพันธะมี σ 1 และ π 1 รวม σ 2 + π 2 = **4 พันธะ**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.hybridization.p012
    topics: [chemistry.bonding.hybridization]
    difficulty: 3
    type: numeric
    stem: "ในโมเลกุล XeF₄ อะตอมซีนอนมีกลุ่มอิเล็กตรอนรอบตัวทั้งหมดกี่กลุ่ม (รวมคู่โดดเดี่ยว)"
    answer: { value: 6, tolerance: 0, unit: "กลุ่ม" }
    misconceptions:
      - { match: 4, feedback: "ลืมนับคู่โดดเดี่ยวสองคู่ของ Xe" }
    hints:
      - "XeF₄ มีพันธะ Xe–F กี่พันธะ"
      - "Xe มีอิเล็กตรอนวงนอก 8 ตัว ใช้ 4 ตัวทำพันธะ ที่เหลือเป็นคู่โดดเดี่ยวกี่คู่"
    solution: "พันธะ Xe–F สี่พันธะและคู่โดดเดี่ยวสองคู่ รวมเป็น **6 กลุ่ม** จึงเป็น sp³d²"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.hybridization.p013
    topics: [chemistry.bonding.hybridization]
    difficulty: 4
    type: numeric
    stem: "น้ำส้มสายชูมีกรดแอซีติก CH₃COOH โมเลกุลนี้มีพันธะซิกมาทั้งหมดกี่พันธะ"
    answer: { value: 7, tolerance: 0, unit: "พันธะ" }
    misconceptions:
      - { match: 6, feedback: "ลืมนับพันธะ O–H ของหมู่คาร์บอกซิล" }
      - { match: 8, feedback: "นับพันธะคู่ C=O เป็นซิกมาสองพันธะ แต่พันธะคู่มีซิกมาเพียงหนึ่งพันธะ" }
    hints:
      - "เขียนโครงสร้าง CH₃–C(=O)–OH แล้วนับพันธะทุกพันธะ"
      - "พันธะคู่หนึ่งพันธะมีซิกมาหนึ่งพันธะเสมอ"
    solution: "C–H สามพันธะ + C–C หนึ่ง + C=O (σ หนึ่ง) + C–O หนึ่ง + O–H หนึ่ง รวมเป็น **7 พันธะซิกมา** (และมีพายอีก 1 พันธะ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.hybridization.p014
    topics: [chemistry.bonding.hybridization]
    difficulty: 4
    type: numeric
    stem: "โมเลกุล CH₂=CH–C≡CH มีพันธะพายรวมกันกี่พันธะ"
    answer: { value: 3, tolerance: 0, unit: "พันธะ" }
    misconceptions:
      - { match: 2, feedback: "นับพันธะสามเป็นพายหนึ่งพันธะ แต่พันธะสามมีพายสองพันธะ" }
    hints:
      - "พันธะคู่มีพายกี่พันธะ และพันธะสามมีพายกี่พันธะ"
      - "รวมพายจากทุกพันธะที่มีในโมเลกุล"
    solution: "C=C มีพาย 1 พันธะ และ C≡C มีพาย 2 พันธะ รวมเป็น **3 พันธะพาย**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.hybridization.p015
    topics: [chemistry.bonding.hybridization]
    difficulty: 4
    type: mcq
    stem: "เหตุใดการหมุนรอบพันธะคู่ C=C จึงทำได้ยากกว่าการหมุนรอบพันธะเดี่ยว"
    choices:
      - { id: a, text: "เพราะพันธะคู่สั้นกว่าพันธะเดี่ยว", feedback: "ความยาวพันธะไม่ใช่สาเหตุหลักของการหมุนที่ยาก" }
      - { id: b, text: "เพราะพันธะพายเกิดจากการซ้อนเหลื่อมด้านข้างของออร์บิทัล p การหมุนต้องทำลายการซ้อนเหลื่อมนี้", correct: true, feedback: "ถูก พันธะพายมีทิศทางตายตัว การหมุนจึงต้องใช้พลังงานเพื่อทำลายการซ้อนเหลื่อมชั่วคราว" }
      - { id: c, text: "เพราะพันธะคู่มีพันธะซิกมาสองพันธะ", feedback: "พันธะคู่มีพันธะซิกมาเพียงหนึ่งพันธะ" }
      - { id: d, text: "เพราะคาร์บอนในพันธะคู่เป็น sp³", feedback: "คาร์บอนในพันธะคู่เป็น sp² ไม่ใช่ sp³" }
    hints:
      - "นึกถึงออร์บิทัล p ที่อยู่ด้านข้างของแกนพันธะ"
      - "ถ้าหมุนพันธะ ออร์บิทัล p ของสองอะตอมจะเคลื่อนออกจากกัน"
    solution: "พันธะพายซ้อนเหลื่อมกันด้านข้าง การหมุนรอบ C=C ต้องทำให้การซ้อนเหลื่อมขาดออกจากกัน ซึ่งต้องใช้พลังงาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.hybridization.p016
    topics: [chemistry.bonding.hybridization]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "ข้อใดถูกต้อง (เลือกทุกข้อที่ถูก)"
