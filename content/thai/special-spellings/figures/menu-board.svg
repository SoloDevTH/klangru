<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="620" height="380" font-family="sans-serif">
<title>ป้ายเมนูร้านป้าแดง</title>
<defs></defs>
<rect x="0" y="0" width="620" height="380" fill="#fff"/>
<rect x="10.0" y="10.0" width="600.0" height="360.0" rx="8" fill="#1f3b2c" stroke="#7a5c00" stroke-width="6"/>
<text x="310.0" y="62.0" font-size="28" text-anchor="middle" fill="#fff" font-weight="bold">ร้านป้าแดง  เมนูวันนี้</text>
<line x1="60.0" y1="82.0" x2="560.0" y2="82.0" stroke="#e0d7a8" stroke-width="1.5" stroke-linecap="round"/>
<text x="60.0" y="128.0" font-size="24" text-anchor="start" fill="#fff" font-weight="normal">1. ข้าวผัดกะเพราไก่</text>
<text x="560.0" y="128.0" font-size="24" text-anchor="end" fill="#f7dc6f" font-weight="normal">50 บาท</text>
<text x="60.0" y="176.0" font-size="24" text-anchor="start" fill="#fff" font-weight="normal">2. แกงเขียวหวานไก่</text>
<text x="560.0" y="176.0" font-size="24" text-anchor="end" fill="#f7dc6f" font-weight="normal">45 บาท</text>
<text x="60.0" y="224.0" font-size="24" text-anchor="start" fill="#fff" font-weight="normal">3. ไอศครีมกะทิ</text>
<text x="560.0" y="224.0" font-size="24" text-anchor="end" fill="#f7dc6f" font-weight="normal">20 บาท</text>
<text x="60.0" y="272.0" font-size="24" text-anchor="start" fill="#fff" font-weight="normal">4. ขนมบัวลอย</text>
<text x="560.0" y="272.0" font-size="24" text-anchor="end" fill="#f7dc6f" font-weight="normal">25 บาท</text>
<text x="60.0" y="320.0" font-size="24" text-anchor="start" fill="#fff" font-weight="normal">5. น้ำตะไคร้</text>
<text x="560.0" y="320.0" font-size="24" text-anchor="end" fill="#f7dc6f" font-weight="normal">15 บาท</text>
</svg>
