id: health.consumer.consumer-rights
subject: health
title: { th: "สิทธิผู้บริโภคด้านสุขภาพ", en: "Consumer rights in health" }
summary: สิทธิพื้นฐานของผู้บริโภค 5 ประการตามกฎหมายไทย หน้าที่ของผู้บริโภค สิทธิของผู้ป่วยและ UCEP หน่วยงานที่รับเรื่อง เช่น สคบ. 1166 อย. 1556 สปสช. 1330 และขั้นตอนการร้องเรียน
difficulty: 4
minutes: 30
prerequisites: [health.consumer.media-ads-services]
encompasses:
  - { id: health.consumer.media-ads-services, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ปัญหาแบบนี้ติดต่อหน่วยงานใด
    src: agencies.svg
    alt: "แผนผังห้าแถว ซ้ายคือปัญหา ขวาคือหน่วยงาน สินค้าหรือบริการทั่วไปไม่เป็นธรรม สัญญาเอาเปรียบ โฆษณาหลอกลวง ไม่ส่งของ ไปที่ สคบ. โทร 1166 อาหาร ยา เครื่องสำอาง เครื่องมือแพทย์ ไม่ปลอดภัย ไม่มีเลข อย. โฆษณาเกินจริง ไปที่ อย. โทร 1556 สิทธิหลักประกันสุขภาพ (บัตรทอง) ถูกเรียกเก็บเงิน ใช้สิทธิไม่ได้ ไปที่ สปสช. โทร 1330 เจ็บป่วยฉุกเฉินวิกฤต แจ้งเหตุและใช้สิทธิ UCEP 72 ชั่วโมงแรก ไปที่ สพฉ. โทร 1669 ถูกหลอกขายที่เป็นความผิดอาญา ของปลอม หลอกโอนเงิน ไปที่ บก.ปคบ. โทร 1135 ด้านล่างเขียนว่าถ้าบาดเจ็บหรือแพ้รุนแรง ไปพบแพทย์หรือโทร 1669 ก่อน แล้วจึงร้องเรียน"
  - type: figure
    title: สี่ขั้นการร้องเรียน
    src: complaint-steps.svg
    alt: "ผังสี่ขั้นเรียงจากซ้ายไปขวา 1 หยุดใช้ ดูแลสุขภาพก่อน ถ้าบาดเจ็บไปพบแพทย์ 2 เก็บหลักฐาน ใบเสร็จ ฉลาก ภาพถ่าย แชตและโฆษณา 3 ติดต่อผู้ขาย บอกปัญหาและสิ่งที่ต้องการ 4 ร้องเรียนหน่วยงาน ระบุชื่อ เหตุการณ์ หลักฐาน แล้วติดตามผล ด้านล่างเขียนว่าผู้ที่อายุไม่ถึง 18 ปี ให้ผู้ปกครองช่วยดำเนินการ"
  - type: worked-example
    title: ระบุสิทธิที่ถูกละเมิดและหน่วยงาน
    problem: "ลุงของต้นซื้อ \"น้ำสมุนไพรรักษาเบาหวานหายขาด\" จากรถเร่ขายของในหมู่บ้าน ขวดไม่มีเลข อย. ลุงหยุดยาเบาหวานแล้วดื่มน้ำนี้แทนจนน้ำตาลในเลือดสูงต้องเข้าโรงพยาบาล ระบุสิทธิที่ถูกละเมิดและวิธีใช้สิทธิ"
    steps:
      - text: "สิทธิได้รับข่าวสารที่ถูกต้อง: อ้างว่ารักษาเบาหวานหายขาด ซึ่งเป็นการโฆษณาเกินจริง"
      - text: "สิทธิได้รับความปลอดภัย: สินค้าไม่มีเลข อย. และทำให้ลุงหยุดยาจนเกิดอันตราย"
      - text: "สิทธิได้รับการพิจารณาและชดเชยความเสียหาย: ลุงเจ็บป่วยและเสียค่าใช้จ่าย"
      - text: "ดูแลสุขภาพก่อน: กลับไปกินยาตามที่แพทย์สั่ง"
        why: "การเรียกร้องสิทธิไม่ควรมาก่อนความปลอดภัยของผู้ป่วย"
      - text: "เก็บขวด ฉลาก และข้อมูลผู้ขาย แล้วแจ้ง อย. 1556 เพราะเป็นผลิตภัณฑ์อาหารหรือยาที่ไม่ได้รับอนุญาตและโฆษณาว่ารักษาโรค"
    answer: "ละเมิดสิทธิข้อ 1 3 และ 5 ให้ลุงกลับไปรักษาตามแพทย์ เก็บหลักฐาน และร้องเรียน อย. 1556"
  - { type: check, problem: health.consumer.consumer-rights.p004, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: worked-example
    title: ใช้สิทธิ UCEP
    problem: "ระหว่างไปเที่ยวต่างจังหวัด แม่ของแนนเจ็บหน้าอกเฉียบพลันรุนแรงและเหงื่อแตก โรงพยาบาลที่ใกล้ที่สุดเป็นโรงพยาบาลเอกชน ส่วนโรงพยาบาลตามสิทธิบัตรทองอยู่อีกจังหวัด ครอบครัวควรทำอย่างไร"
    steps:
      - text: "อาการเจ็บหน้าอกเฉียบพลันรุนแรงเข้าข่ายเจ็บป่วยฉุกเฉินวิกฤต โทร 1669 ทันที"
      - text: "ไปโรงพยาบาลที่ใกล้ที่สุดได้ แม้เป็นโรงพยาบาลเอกชน และแจ้งว่าขอใช้สิทธิ UCEP"
        why: "เวลาสำคัญต่อชีวิต สิทธินี้มีไว้เพื่อไม่ให้ต้องเลือกโรงพยาบาลตามสิทธิก่อน"
      - text: "ผู้ป่วยไม่ต้องสำรองจ่ายใน 72 ชั่วโมงแรกหรือจนพ้นวิกฤต"
      - text: "ญาติแจ้งโรงพยาบาลตามสิทธิโดยเร็ว เพื่อเตรียมย้ายไปรักษาต่อเมื่อพ้นวิกฤต ถ้ามีปัญหาการใช้สิทธิบัตรทองติดต่อ สปสช. 1330"
    answer: "โทร 1669 ไปโรงพยาบาลที่ใกล้ที่สุด แจ้งใช้สิทธิ UCEP และประสานโรงพยาบาลตามสิทธิเพื่อรักษาต่อ"
  - { type: check, problem: health.consumer.consumer-rights.p010 }
glossary:
  - { term: ผู้บริโภค, definition: "ผู้ซื้อหรือได้รับบริการจากผู้ประกอบธุรกิจ รวมทั้งผู้ป่วยที่รับบริการสุขภาพ" }
  - { term: สิทธิผู้บริโภค, definition: "สิทธิที่กฎหมายรับรอง 5 ประการ คือ ได้รับข่าวสาร มีอิสระในการเลือก ได้รับความปลอดภัย ได้รับความเป็นธรรมในการทำสัญญา และได้รับการพิจารณาและชดเชยความเสียหาย" }
  - { term: สคบ., definition: "สำนักงานคณะกรรมการคุ้มครองผู้บริโภค รับเรื่องร้องเรียนสินค้าและบริการทั่วไป สายด่วน 1166" }
  - { term: UCEP, definition: "สิทธิเจ็บป่วยฉุกเฉินวิกฤต มีสิทธิทุกที่ เข้ารักษาโรงพยาบาลที่ใกล้ที่สุดโดยไม่ต้องสำรองจ่ายใน 72 ชั่วโมงแรกหรือจนพ้นวิกฤต" }
flashcards:
  - { front: "สิทธิผู้บริโภค 5 ประการ", back: "ข่าวสารถูกต้อง เลือกอย่างอิสระ ปลอดภัย สัญญาเป็นธรรม ได้รับการพิจารณาชดเชยความเสียหาย" }
  - { front: "สคบ. / อย. / สปสช.", back: "1166 สินค้าบริการทั่วไป / 1556 อาหาร ยา เครื่องสำอาง / 1330 สิทธิบัตรทอง" }
  - { front: "ผู้ป่วยอายุไม่เกิน 18 ปี", back: "บิดา มารดา หรือผู้แทนโดยชอบธรรมใช้สิทธิแทนได้ (คำประกาศสิทธิผู้ป่วย 2558)" }
  - { front: "ก่อนร้องเรียนต้องเก็บอะไร", back: "ใบเสร็จ ฉลาก สินค้าที่เหลือ ภาพถ่าย แชต โฆษณา และหลักฐานการรักษา" }
