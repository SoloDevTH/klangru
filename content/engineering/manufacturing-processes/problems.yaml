  - id: engineering.manufacturing.manufacturing-processes.p015
    topics:
      - engineering.manufacturing.manufacturing-processes
    difficulty: 4
    type: code
    stem: เขียนฟังก์ชัน `cutting_speed_mpm(diameter_mm, rpm)` ที่รับเส้นผ่านศูนย์กลางชิ้นงานเป็นมิลลิเมตรและความเร็วรอบ แล้วคืนความเร็วตัดเป็นเมตรต่อนาที โดย V = π × D × N ÷ 1000
    starter: "import math\n\ndef cutting_speed_mpm(diameter_mm, rpm):\n    pass\n"
    tests: 'r = cutting_speed_mpm(50, 500)

      assert r is not None, "ฟังก์ชันยังไม่ได้คืนค่า ให้ใช้ return ไม่ใช่ print"

      assert abs(r - 78.54) < 0.01, f"cutting_speed_mpm(50, 500) ควรได้ประมาณ 78.54 แต่ได้ {r} (ตรวจว่าใช้ D ไม่ใช่รัศมี)"

      assert abs(cutting_speed_mpm(100, 1000) - 314.16) < 0.01, f"cutting_speed_mpm(100, 1000) ควรได้ประมาณ 314.16 แต่ได้ {cutting_speed_mpm(100, 1000)}"

      assert abs(cutting_speed_mpm(0, 500)) < 1e-9, "เส้นผ่านศูนย์กลางเป็นศูนย์ควรได้ความเร็วตัดเป็นศูนย์"

      '
    reference: "import math\n\ndef cutting_speed_mpm(diameter_mm, rpm):\n    return math.pi * diameter_mm * rpm / 1000\n"
    hints:
      - ใช้ math.pi สำหรับค่า π
      - คืนค่า π × D × N หารด้วย 1000 ด้วย return
    solution: คืนค่า math.pi * diameter_mm * rpm / 1000 เช่น D = 50, N = 500 ได้ประมาณ 78.54 เมตรต่อนาที
