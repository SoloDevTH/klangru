<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" font-family="sans-serif" font-size="14">
  <title>แท่งกราฟเปรียบเทียบเงินรวมหลัง 15 ปี ระหว่างไม่มีค่าธรรมเนียมกับมีค่าธรรมเนียม 1.5 เปอร์เซ็นต์ต่อปี ส่วนต่างจากค่าธรรมเนียมเห็นชัด</title>
  <rect x="0" y="0" width="780" height="360" fill="#ffffff"/>
  <rect x="170" y="80.0" width="150" height="240.0" fill="#1d4ed8" opacity="0.85"/>
  <text x="245" y="72.0" text-anchor="middle" font-size="14" fill="#1f2937">623,678</text>
  <text x="245" y="342" text-anchor="middle" font-size="13" fill="#1f2937">ไม่มีค่าธรรมเนียม (5%)</text>
  <rect x="430" y="126.6" width="150" height="193.4" fill="#dc2626" opacity="0.85"/>
  <text x="505" y="118.6" text-anchor="middle" font-size="14" fill="#1f2937">502,605</text>
  <text x="505" y="342" text-anchor="middle" font-size="13" fill="#1f2937">มีค่าธรรมเนียม 1.5% (สุทธิ 3.5%)</text>
  <line x1="130" y1="320" x2="640" y2="320" stroke="#1f2937" stroke-width="1.5"/>
  <text x="390" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">เงินรวมหลัง 15 ปี จากเงินลงทุน 300,000 บาท (ภาพประกอบ)</text>
</svg>
