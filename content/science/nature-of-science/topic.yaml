id: science.nature.nature-of-science
subject: science
title:
  th: ธรรมชาติของวิทยาศาสตร์และพัฒนาการของความรู้
  en: Nature of science and how scientific knowledge develops
summary: การสร้างคำอธิบายจากหลักฐาน ทฤษฎี กฎ และแบบจำลอง ความรู้ที่เปลี่ยนตามหลักฐานใหม่ ความร่วมมือ การทบทวนโดยผู้ทรงคุณวุฒิ ภูมิปัญญาท้องถิ่น หน่วยมาตรฐาน และเทคโนโลยี
difficulty: 3
minutes: 30
prerequisites:
- science.inquiry.investigation-design
encompasses:
- id: science.inquiry.investigation-design
  weight: 0.2
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  title: ความรู้ที่เปลี่ยนเมื่อมีหลักฐานใหม่
  src: changes.svg
  alt: 'ตารางสามแถว แผลในกระเพาะ: เชื่อว่าเกิดจากความเครียดและอาหาร → พ.ศ. 2525 พบเชื้อ H. pylori → 2548 รางวัลโนเบล รักษาด้วยยาฆ่าเชื้อ ทวีป: เชื่อว่าทวีปอยู่กับที่ → 2455 เวเกเนอร์เสนอทวีปเลื่อน → 2503–2512 หลักฐานพื้นสมุทร นำไปสู่ธรณีแปรสัณฐาน ดาวพลูโต: 2473 ค้นพบ นับเป็นดาวเคราะห์ → พบวัตถุขนาดใกล้เคียงหลายดวง → 2549 นิยามใหม่ เป็นดาวเคราะห์แคระ'
- type: worked-example
  title: วิเคราะห์ว่าความรู้เปลี่ยนเพราะอะไร
  problem: อธิบายว่าทำไมแนวคิดทวีปเลื่อนของเวเกเนอร์ (พ.ศ. 2455) จึงไม่ได้รับการยอมรับในตอนแรก แต่ได้รับการยอมรับในอีกราว 50 ปีต่อมา
  steps:
  - text: 'หลักฐานของเวเกเนอร์: รูปขอบทวีปที่ต่อกันได้ ฟอสซิลและหินชนิดเดียวกันบนทวีปที่อยู่ห่างกัน'
  - text: 'ข้อโต้แย้งตอนนั้น: ยังอธิบายไม่ได้ว่าแรงอะไรทำให้ทวีปขนาดใหญ่เคลื่อนที่'
    why: คำอธิบายที่ดีต้องบอกได้ทั้งว่าเกิดอะไรและเกิดได้อย่างไร
  - text: เทคโนโลยีใหม่หลังสงครามโลก เช่น การหยั่งความลึกและวัดสนามแม่เหล็กของหินพื้นสมุทร ให้หลักฐานว่าพื้นมหาสมุทรขยายตัว
  - text: หลักฐานใหม่และกลไกที่อธิบายได้รวมกันเป็นทฤษฎีธรณีแปรสัณฐาน นักวิทยาศาสตร์จึงเปลี่ยนความคิด
  answer: ตอนแรกขาดกลไกและหลักฐานบางส่วน เมื่อเทคโนโลยีให้หลักฐานใหม่ ความรู้จึงเปลี่ยน
- type: check
  problem: science.nature.nature-of-science.p008
  prompt: ลองตอบก่อนอ่านต่อ
- type: figure
  title: การตีพิมพ์และการทบทวนโดยผู้ทรงคุณวุฒิ
  src: peer-review.svg
  alt: ผังงานหกกล่อง ทำวิจัย (เก็บข้อมูล วิเคราะห์) → เขียนบทความ (ส่งวารสารวิชาการ) → ผู้ทรงคุณวุฒิตรวจ (วิธีการ ข้อมูล เหตุผล) ถ้าไม่ผ่านมีลูกศรสีแดงกลับไปที่เขียนบทความ เขียนว่าแก้ไขแล้วส่งใหม่ หรือถูกปฏิเสธ ถ้าผ่าน → ตีพิมพ์ (เผยแพร่ให้ทุกคนตรวจสอบ) → คนอื่นทำซ้ำ (ได้ผลเหมือนเดิมหรือไม่) → ยอมรับหรือปรับปรุง (ความรู้เปลี่ยนได้เสมอ) และมีลูกศรสีเขียวว่าหลักฐานใหม่ทำให้เกิดคำถามใหม่
- type: worked-example
  title: ประเมินข้อกล่าวอ้างด้วยธรรมชาติของวิทยาศาสตร์
  problem: คลิปหนึ่งอ้างว่า "นักวิจัยค้นพบสมุนไพรรักษามะเร็งได้ 100% แต่วงการแพทย์ปิดข่าว" ใช้ความรู้เรื่องธรรมชาติของวิทยาศาสตร์ประเมินข้อกล่าวอ้างนี้
  steps:
  - text: 'ถาม: ผลงานตีพิมพ์ในวารสารที่ผ่านการทบทวนโดยผู้ทรงคุณวุฒิหรือไม่'
    why: การทบทวนช่วยกรองวิธีการและข้อมูลที่ผิดพลาด
  - text: 'ถาม: มีนักวิจัยกลุ่มอื่นทำซ้ำและได้ผลเหมือนกันหรือไม่'
  - text: 'สังเกต: คำว่า "100%" และ "ปิดข่าว" เป็นสัญญาณเตือน เพราะวิทยาศาสตร์รายงานผลพร้อมความไม่แน่นอน และการค้นพบสำคัญย่อมถูกตรวจสอบโดยคนจำนวนมาก'
  - text: ภูมิปัญญาเรื่องสมุนไพรเป็นจุดเริ่มต้นของงานวิจัยได้ แต่ต้องผ่านการทดลองทางคลินิกก่อนนำไปใช้รักษา
  answer: ยังเชื่อไม่ได้จนกว่าจะมีผลตีพิมพ์ที่ผ่านการทบทวนและทำซ้ำได้ และควรปรึกษาแพทย์ก่อนใช้
- type: check
  problem: science.nature.nature-of-science.p004
glossary:
- term: การสังเกตและการลงความเห็น
  definition: การสังเกตคือการรับรู้ด้วยประสาทสัมผัสหรือเครื่องมือ การลงความเห็นคือการอธิบายหรือสรุปจากสิ่งที่สังเกต
- term: ทฤษฎี
  definition: คำอธิบายว่าทำไมปรากฏการณ์จึงเกิด ซึ่งผ่านการทดสอบด้วยหลักฐานจำนวนมาก และปรับได้เมื่อมีหลักฐานใหม่
- term: แบบจำลอง
  definition: สิ่งที่ใช้แทนของจริงเพื่อช่วยคิด อธิบาย และทำนาย ทุกแบบมีข้อจำกัด
- term: การทบทวนโดยผู้ทรงคุณวุฒิ
  definition: การให้ผู้เชี่ยวชาญในสาขาเดียวกันตรวจผลงานก่อนตีพิมพ์ (peer review)
- term: ภูมิปัญญาท้องถิ่น
  definition: ความรู้ที่คนในท้องถิ่นสะสมจากการสังเกตและประสบการณ์ ส่งต่อกันมาหลายรุ่น
flashcards:
- front: กฎ กับ ทฤษฎี
  back: กฎบอกว่าอะไรเกิดขึ้น ทฤษฎีอธิบายว่าทำไม ทฤษฎีไม่ได้กลายเป็นกฎ
- front: ทำไมความรู้วิทยาศาสตร์จึงเปลี่ยนได้
  back: เพราะมีหลักฐานใหม่หรือมุมมองใหม่ ซึ่งผ่านการตรวจสอบและทำซ้ำ
- front: ผลงานจะได้รับการยอมรับเมื่อใด
  back: ผ่านการทบทวนโดยผู้ทรงคุณวุฒิ ตีพิมพ์ และผู้อื่นทำซ้ำได้ผลเหมือนกัน
- front: 18 สิงหาคม
  back: วันวิทยาศาสตร์แห่งชาติ รัชกาลที่ 4 ทอดพระเนตรสุริยุปราคาที่หว้ากอ พ.ศ. 2411
