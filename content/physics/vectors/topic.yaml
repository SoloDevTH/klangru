id: physics.units.vectors
subject: physics
title: { th: เวกเตอร์ในฟิสิกส์, en: Vectors in physics }
summary: รวมปริมาณเวกเตอร์แบบหางต่อหัว แยกเวกเตอร์เป็นองค์ประกอบตามแกน x และ y ด้วยไซน์และโคไซน์ แล้วรวมองค์ประกอบกลับเป็นเวกเตอร์ลัพธ์
difficulty: 5.2
minutes: 40
prerequisites: [physics.kinematics.velocity, math.geometry.trig-ratios]
encompasses:
  - { id: physics.kinematics.velocity, weight: 0.3 }
  - { id: math.geometry.trig-ratios, weight: 0.5 }
  - { id: math.geometry.pythagoras, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: tail-to-head.svg
    alt: "ตารางช่องละ 1 เมตร เวกเตอร์ A ยาว 8 m ชี้ไปทางขวาตามแนวราบ ต่อจากหัวของ A คือเวกเตอร์ B ยาว 10 m ทำมุม 60 องศากับแนวราบ เวกเตอร์ลัพธ์ R ลากจากหางของ A ถึงหัวของ B ยาวประมาณ 15.6 m ทำมุม 33.7 องศากับแนวราบ เส้นประแสดงองค์ประกอบของ R คือแนวราบ 13 m และแนวดิ่ง 8.66 m"
    caption: "ภาพของตัวอย่างที่ 3 วาดตามมาตราส่วน วัดความยาวของ $\\vec{R}$ บนตารางได้ใกล้ $15.6$ ช่อง ตรงกับที่คำนวณ"
  - type: worked-example
    title: แยกแรงลากกระเป๋าเป็นองค์ประกอบ
    problem: "นักท่องเที่ยวลากกระเป๋าเดินทางที่สนามบินด้วยแรง $60\\ \\mathrm{N}$ ตามแนวด้ามจับ ซึ่งทำมุม $40^\\circ$ กับพื้น แรงนี้มีองค์ประกอบตามแนวพื้นและแนวดิ่งเท่าใด"
    steps:
      - text: "วาดแรงเป็นลูกศรเฉียงขึ้น $40^\\circ$ จากแนวพื้น องค์ประกอบแนวพื้นคือด้านประชิดมุม องค์ประกอบแนวดิ่งคือด้านตรงข้ามมุม"
        why: "มุมวัดจากแนวพื้น ด้านที่ติดมุมจึงใช้ cos และด้านตรงข้ามใช้ sin"
      - text: "แนวพื้น: $F_x = 60\\cos 40^\\circ \\approx 60 \\times 0.766 = 46.0\\ \\mathrm{N}$"
      - text: "แนวดิ่ง: $F_y = 60\\sin 40^\\circ \\approx 60 \\times 0.643 = 38.6\\ \\mathrm{N}$"
      - text: "ตรวจ: $\\sqrt{46.0^2 + 38.6^2} \\approx 60\\ \\mathrm{N}$ ✓"
        why: "องค์ประกอบสองตัวตั้งฉากกัน รวมกลับด้วยทฤษฎีบทพีทาโกรัสต้องได้แรงเดิม"
    answer: "ประมาณ $46.0\\ \\mathrm{N}$ ตามแนวพื้น (ส่วนที่ทำให้กระเป๋าเคลื่อนไปข้างหน้า) และ $38.6\\ \\mathrm{N}$ แนวดิ่ง (ช่วยยกกระเป๋า)"
  - { type: check, problem: phy.vec.p014, prompt: "ลองรวมเวกเตอร์บนตาราง" }
  - type: figure
    src: forces-parallelogram.svg
    alt: "เรือถูกดึงด้วยเชือกสองเส้นจากจุดเดียวกัน แรง F1 = 60 N ชี้ไปทางขวาตามแนวราบ แรง F2 = 80 N ทำมุม 60 องศากับ F1 เส้นประเติมเป็นสี่เหลี่ยมด้านขนาน เส้นทแยงมุมจากเรือคือแรงลัพธ์ R ความยาวลูกศรตามมาตราส่วนของแรง"
    caption: "วิธีสี่เหลี่ยมด้านขนาน: แรงลัพธ์คือเส้นทแยงมุมที่ออกจากจุดที่แรงกระทำ"
  - type: worked-example
    title: แรงลัพธ์ของเชือกสองเส้นที่ดึงเรือ
    problem: "เชือกสองเส้นดึงเรือจากจุดเดียวกัน เส้นแรกออกแรง $60\\ \\mathrm{N}$ ไปทางทิศตะวันออก เส้นที่สองออกแรง $80\\ \\mathrm{N}$ ทำมุม $60^\\circ$ ไปทางเหนือของทิศตะวันออก หาแรงลัพธ์ และแรงที่ทำให้สมดุล"
    steps:
      - text: "แยกองค์ประกอบ: $F_{1x} = 60$, $F_{1y} = 0$ และ $F_{2x} = 80\\cos 60^\\circ = 40$, $F_{2y} = 80\\sin 60^\\circ \\approx 69.3\\ \\mathrm{N}$"
      - text: "รวมองค์ประกอบ: $R_x = 60 + 40 = 100\\ \\mathrm{N}$ และ $R_y = 69.3\\ \\mathrm{N}$"
      - text: "ขนาด: $R = \\sqrt{100^2 + 69.3^2} \\approx 121.7\\ \\mathrm{N}$ ตรวจด้วยสูตร $\\sqrt{60^2 + 80^2 + 2(60)(80)\\cos 60^\\circ} = \\sqrt{14{,}800} \\approx 121.7\\ \\mathrm{N}$ ✓"
        why: "แรงทั้งสองไม่ตั้งฉากกัน จึงใช้ $\\sqrt{A^2 + B^2}$ ตรง ๆ ไม่ได้"
      - text: "ทิศ: $\\tan\\theta = \\dfrac{69.3}{100}$ ได้ $\\theta \\approx 34.7^\\circ$ ไปทางเหนือของทิศตะวันออก"
      - text: "แรงที่ทำให้สมดุลมีขนาด $121.7\\ \\mathrm{N}$ ทิศตรงข้าม คือ $34.7^\\circ$ ไปทางใต้ของทิศตะวันตก"
        why: "แรงที่ทำให้สมดุลต้องหักล้างแรงลัพธ์พอดี แรงรวมทั้งหมดจึงเป็นศูนย์"
    answer: "แรงลัพธ์ประมาณ $121.7\\ \\mathrm{N}$ ทำมุม $34.7^\\circ$ เหนือทิศตะวันออก (น้อยกว่า $60 + 80 = 140\\ \\mathrm{N}$)"
  - { type: check, problem: phy.vec.p021 }
  - type: interactive
    title: ลากเวกเตอร์แล้วดูเวกเตอร์ลัพธ์
    caption: ลากหัวลูกศรของเวกเตอร์ a และ b สังเกตว่าเวกเตอร์ลัพธ์ยาวเท่ากับผลบวกของความยาวก็ต่อเมื่อสองเวกเตอร์ชี้ทิศเดียวกัน และสั้นที่สุดเมื่อชี้ทิศตรงข้าม ลองจัดให้ตั้งฉากกันแล้วตรวจด้วยทฤษฎีบทพีทาโกรัส
    widget: { kind: vector-add, a: [4, 0], b: [0, 3], draggable: true }
  - type: simulation
    title: การบวกเวกเตอร์ (PhET Vector Addition)
    url: https://phet.colorado.edu/en/simulations/vector-addition
    provider: phet
    note: เปิดหน้าจอ Explore 2D ลากเวกเตอร์สองตัวลงบนตาราง ติ๊กแสดงผลรวม (Sum) แล้วเลือกแสดงองค์ประกอบ เปรียบเทียบองค์ประกอบ x และ y ของเวกเตอร์ลัพธ์กับผลบวกขององค์ประกอบของแต่ละตัว
glossary:
  - { term: ปริมาณเวกเตอร์, definition: "ปริมาณที่มีทั้งขนาดและทิศทาง เช่น การกระจัด ความเร็ว ความเร่ง วาดแทนด้วยลูกศร" }
  - { term: เวกเตอร์ลัพธ์, definition: "เวกเตอร์ที่ได้จากการรวมเวกเตอร์หลายตัว วาดแบบหางต่อหัวแล้วลากจากหางตัวแรกไปหัวตัวสุดท้าย" }
  - { term: องค์ประกอบของเวกเตอร์, definition: "ส่วนของเวกเตอร์ตามแกน $x$ และ $y$ ที่ตั้งฉากกัน $A_x = A\\cos\\theta$ และ $A_y = A\\sin\\theta$ เมื่อ $\\theta$ วัดจากแกน $+x$" }
flashcards:
  - { front: "รวมสองเวกเตอร์ที่ตั้งฉากกันอย่างไร", back: "ขนาด $R = \\sqrt{A^2 + B^2}$ และทิศ $\\tan\\theta = \\dfrac{B}{A}$" }
  - { front: "องค์ประกอบของเวกเตอร์ขนาด $A$ ที่ทำมุม $\\theta$ กับแกน $+x$", back: "$A_x = A\\cos\\theta$ และ $A_y = A\\sin\\theta$" }
  - { front: "ขนาดของผลรวมสองเวกเตอร์เท่ากับผลบวกของขนาดเมื่อใด", back: "เมื่อสองเวกเตอร์ชี้ทิศเดียวกันเท่านั้น กรณีอื่นจะน้อยกว่าเสมอ" }
  - { front: "$A_x < 0$ แต่เครื่องคิดเลขให้ $\\tan^{-1}$ เป็นมุมในจตุภาคที่ 1 หรือ 4 ต้องทำอย่างไร", back: "บวก $180^\\circ$ เพราะเวกเตอร์ที่มี $A_x$ เป็นลบชี้ไปทางซ้าย" }
