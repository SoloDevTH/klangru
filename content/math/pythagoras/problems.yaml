    answer: { value: 39, unit: m }
    hints:
      - "ลวดแต่ละเส้น เสา และพื้นเป็นสามเหลี่ยมมุมฉาก ลวดเป็นด้านตรงข้ามมุมฉาก"
      - "หาความยาวลวดหนึ่งเส้นด้วย $\\sqrt{12^2 + 5^2}$"
      - "มีลวด 3 เส้นที่ยาวเท่ากัน"
    misconceptions:
      - { match: 13, feedback: "นั่นคือลวดหนึ่งเส้น โจทย์ถามความยาวรวมของลวด 3 เส้น" }
      - { match: 51, feedback: "ดูเหมือนใช้ $12 + 5 = 17$ เป็นความยาวลวดหนึ่งเส้น ต้องใช้ทฤษฎีบทพีทาโกรัส" }
    solution: "ลวดหนึ่งเส้น $= \\sqrt{12^2 + 5^2} = \\sqrt{169} = 13\\ \\mathrm{m}$ ลวด 3 เส้นยาวรวม $3 \\times 13 = 39\\ \\mathrm{m}$"
