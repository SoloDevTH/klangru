    ai_assisted: true

  - id: business.entrepreneurship.careers.p016
    topics: [business.entrepreneurship.careers]
    difficulty: 5
    type: mcq
    stem: "เจได้เกรดคณิตศาสตร์และคอมพิวเตอร์ดีมาก ชอบแก้ปัญหาและนั่งทำงานคนเดียวนาน ๆ ได้ แต่ไม่ชอบพูดต่อหน้าคนมาก ๆ เพื่อนชวนไปเรียนสายการตลาดที่ต้องนำเสนองานบ่อย เพราะ \"ได้เงินดี\" ทางเลือกใด **สอดคล้องกับความรู้ ความถนัด และความสนใจของเจ** มากที่สุด"
    choices:
      - { id: a, text: "ศึกษาอาชีพนักพัฒนาซอฟต์แวร์หรือนักวิเคราะห์ข้อมูล แล้วลองเข้าค่ายเขียนโปรแกรมก่อนตัดสินใจ", correct: true }
      - { id: b, text: "เรียนการตลาดตามเพื่อน เพราะรายได้ดี", feedback: "เลือกตามเพื่อนและรายได้อย่างเดียว ไม่ตรงกับความถนัดและความสนใจของเจ" }
      - { id: c, text: "เป็นพิธีกรรายการโทรทัศน์", feedback: "ต้องพูดต่อหน้าคนจำนวนมาก ซึ่งเจไม่ชอบ" }
      - { id: d, text: "ไม่ต้องเลือกตอนนี้และไม่ต้องหาข้อมูล รอให้จบ ม.6 ก่อน", feedback: "ยิ่งหาข้อมูลและประสบการณ์เร็ว ยิ่งเลือกได้ดี" }
    hints:
      - "เขียนรายการว่าเจรู้อะไร ถนัดอะไร สนใจอะไร"
      - "ทางเลือกที่ดีควรมีการทดลองหาประสบการณ์ก่อนตัดสินใจด้วย"
    solution: "อาชีพด้านซอฟต์แวร์และข้อมูลใช้คณิตศาสตร์ คอมพิวเตอร์ และการแก้ปัญหา ตรงกับความรู้ ความถนัด และความสนใจ การเข้าค่ายเป็นการหาประสบการณ์เพื่อประเมินตัวเองอีกครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

