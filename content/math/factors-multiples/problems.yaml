    ai_assisted: true

  - id: math.fm.p019
    topics: [math.number.factors-multiples]
    difficulty: 4
    type: numeric
    stem: "ช่างจะปูกระเบื้องรูปสี่เหลี่ยมจัตุรัสบนพื้นห้องเรียนขนาด 360 เซนติเมตร × 420 เซนติเมตร โดยใช้กระเบื้องขนาดเดียวกันทั้งห้อง แผ่นใหญ่ที่สุดที่ไม่ต้องตัดเลย ต้องใช้กระเบื้องกี่แผ่น (ตอบเป็นจำนวนแผ่น)"
    answer: { value: 42, unit: แผ่น }
    hints:
      - "ด้านของกระเบื้องต้องหารทั้ง 360 และ 420 ลงตัว และต้องยาวที่สุด"
      - "หา ห.ร.ม. ของ 360 และ 420 เพื่อได้ความยาวด้านกระเบื้อง"
      - "นับว่าแต่ละด้านของห้องวางกระเบื้องได้กี่แผ่น แล้วคูณกัน"
    misconceptions:
      - { match: 60, feedback: "60 เซนติเมตรคือความยาวด้านของกระเบื้อง โจทย์ถามจำนวนแผ่น" }
      - { match: 13, feedback: "$6 + 7 = 13$ คือจำนวนแผ่นตามขอบสองด้านรวมกัน พื้นเป็นตาราง ต้องคูณ $6 \\times 7$" }
    solution: "ห.ร.ม. ของ 360 และ 420 คือ 60 กระเบื้องจึงมีด้าน 60 cm วางตามด้าน 360 cm ได้ $360 \\div 60 = 6$ แผ่น ตามด้าน 420 cm ได้ $420 \\div 60 = 7$ แผ่น รวม $6 \\times 7 = 42$ แผ่น"
