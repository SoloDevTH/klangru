    ai_assisted: true

  - id: biology.ecology.populations.p017
    topics: [biology.ecology.populations]
    difficulty: 5
    type: numeric
    stem: "ประชากรหนึ่งมี r = 0.4 ต่อปี K = 1,200 ตัว ขณะนี้มี N = 900 ตัว อัตราการเพิ่มตามแบบเอ็กซ์โพเนนเชียล (rN) มากกว่าอัตราตามแบบลอจิสติกกี่เท่า"
    answer: { value: 4, unit: "เท่า" }
    misconceptions:
      - { match: 1.33, feedback: "หาร K ด้วย N ต้องเทียบ rN กับ rN(K − N)/K ซึ่งได้ K ÷ (K − N)" }
      - { match: 0.25, feedback: "หารกลับด้าน อัตราแบบเอ็กซ์โพเนนเชียลต้องมากกว่า" }
    hints:
      - "แบบเอ็กซ์โพเนนเชียล $0.4 \\times 900$ แบบลอจิสติก $0.4 \\times 900 \\times \\frac{300}{1{,}200}$"
      - "อัตราส่วนเท่ากับ $\\frac{K}{K - N}$"
    solution: "แบบเอ็กซ์โพเนนเชียล $0.4 \\times 900 = 360$ ตัวต่อปี แบบลอจิสติก $360 \\times \\frac{300}{1{,}200} = 90$ ตัวต่อปี ต่างกัน $360 \\div 90 = 4$ เท่า เพราะเมื่อ N ใกล้ K ทรัพยากรที่เหลือเพียงหนึ่งในสี่ ทำให้การเพิ่มช้าลงมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true
