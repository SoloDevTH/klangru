      - { match: 0.5314, feedback: "นี่คือความน่าจะเป็นที่ไม่มีหลอดเสียเลย ต้องนำไปลบออกจาก 1" }
    solution: "$1 - (0.9)^6 = 1 - 0.531441 \\approx 0.4686$"
