problems:
  - id: english.grammar.be-have-there.p001
    topics: [english.grammar.be-have-there]
    difficulty: 1
    type: text
    stem: "เติม verb to be: *I ___ a student.*"
    accepted: ["am"]
    misconceptions:
      - { match: "is", feedback: "is ใช้กับ he, she, it ส่วน I ใช้ am" }
      - { match: "are", feedback: "are ใช้กับ you, we, they ส่วน I ใช้ am" }
      - { match: "be", feedback: "be เป็นรูปเดิม ในประโยคต้องเปลี่ยนตามประธาน I → am" }
    hints:
      - "ประธานคือ I"
      - "I → am · he/she/it → is · you/we/they → are"
    solution: "*I **am** a student.* (ย่อเป็น I'm a student.)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.be-have-there.p002
    topics: [english.grammar.be-have-there]
    difficulty: 1
    type: mcq
    stem: "เลือกคำที่ถูกต้อง: *She ___ my sister.*"
    choices:
      - { id: a, text: "is", correct: true, feedback: "ถูก she ใช้ is" }
      - { id: b, text: "am", feedback: "am ใช้กับ I เท่านั้น" }
      - { id: c, text: "are", feedback: "are ใช้กับ you, we, they" }
      - { id: d, text: "be", feedback: "ในประโยคต้องเปลี่ยน be ตามประธาน" }
    hints:
      - "ประธานคือ she"
      - "he, she, it ใช้ be รูปไหน"
    solution: "*She **is** my sister.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.be-have-there.p003
    topics: [english.grammar.be-have-there]
    difficulty: 1
    type: match
    stem: "จับคู่รูปเต็มกับรูปย่อ"
    pairs:
      - { left: "I am", right: "I'm" }
      - { left: "you are", right: "you're" }
      - { left: "he is", right: "he's" }
      - { left: "is not", right: "isn't" }
      - { left: "are not", right: "aren't" }
    hints:
      - "รูปย่อตัดสระตัวแรกของคำหลังแล้วใส่ ' แทน"
      - "ปฏิเสธย่อ not เป็น n't"
    solution: "I am → I'm · you are → you're · he is → he's · is not → isn't · are not → aren't"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.be-have-there.p004
    topics: [english.grammar.be-have-there]
    difficulty: 2
    type: text
    stem: "เติม have หรือ has: *My father ___ a pickup truck.*"
    accepted: ["has"]
    misconceptions:
      - { match: "have", feedback: "my father = he ประธานเอกพจน์บุรุษที่ 3 ใช้ has" }
      - { match: "is have", feedback: "ไม่ต้องมี is หน้า have ใช้ has คำเดียว" }
      - { match: "haves", feedback: "have เปลี่ยนรูปพิเศษเป็น has ไม่ใช่ haves" }
    hints:
      - "my father แทนด้วยสรรพนามอะไร"
      - "he, she, it ใช้ has"
    solution: "my father = he จึงใช้ **has**: *My father has a pickup truck.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.be-have-there.p005
    topics: [english.grammar.be-have-there]
    difficulty: 2
    type: mcq
    stem: "ข้อใดแปลว่า \"เธอมีความสุข\" ได้ถูกต้อง"
    choices:
      - { id: a, text: "She is happy.", correct: true, feedback: "ถูก คำคุณศัพท์ happy ต้องมี be (is) นำหน้า" }
      - { id: b, text: "She happy.", feedback: "ภาษาไทยไม่มีคำว่า เป็น แต่ภาษาอังกฤษต้องมี is หน้าคำคุณศัพท์" }
      - { id: c, text: "She has happy.", feedback: "แปลตามคำว่า มี ไม่ได้ happy เป็นคำคุณศัพท์ ใช้กับ be" }
      - { id: d, text: "She is happiness.", feedback: "happiness เป็นคำนาม (ความสุข) She is happiness แปลว่า เธอคือความสุข" }
    hints:
      - "happy เป็นคำคุณศัพท์"
      - "ประธาน + be + คำคุณศัพท์"
    solution: "**She is happy.** ภาษาอังกฤษต้องมี be หน้าคำคุณศัพท์เสมอ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.be-have-there.p006
    topics: [english.grammar.be-have-there]
    difficulty: 2
    type: text
    stem: "เติม is หรือ are: *There ___ three books on the table.*"
    accepted: ["are"]
    misconceptions:
      - { match: "is", feedback: "three books เป็นพหูพจน์ ใช้ there are" }
      - { match: "have", feedback: "บอกว่ามีอะไรอยู่ที่ไหนใช้ there is/are ไม่ใช่ have" }
    hints:
      - "ดูคำนามหลัง there: three books"
      - "สิ่งเดียวใช้ is หลายสิ่งใช้ are"
    solution: "three books เป็นพหูพจน์: *There **are** three books on the table.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.be-have-there.p007
    topics: [english.grammar.be-have-there]
    difficulty: 2
    type: mcq
    stem: "ข้อใดแปลว่า \"มีวัดอยู่ใกล้บ้านฉัน\" ได้ถูกต้อง"
    choices:
      - { id: a, text: "There is a temple near my house.", correct: true, feedback: "ถูก บอกว่ามีอะไรอยู่ที่ไหน ใช้ there is" }
      - { id: b, text: "Have a temple near my house.", feedback: "แปลคำว่า มี ตรง ๆ ไม่ได้ ประโยคภาษาอังกฤษต้องมีประธาน ใช้ There is ..." }
      - { id: c, text: "There are a temple near my house.", feedback: "a temple เป็นเอกพจน์ ใช้ there is" }
      - { id: d, text: "My house is have a temple.", feedback: "ไม่ใช้ is กับ have พร้อมกัน และประโยคนี้ผิดความหมาย" }
    hints:
      - "มี ในประโยคนี้ไม่ได้หมายถึงเป็นเจ้าของ"
      - "วัดมีหนึ่งแห่ง ใช้ there is หรือ there are"
    solution: "**There is a temple near my house.** ใช้ there is กับสิ่งเดียวที่มีอยู่ในที่หนึ่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.be-have-there.p008
    topics: [english.grammar.be-have-there]
    difficulty: 2
    type: text
    stem: "ป้าถามอายุ เติมคำ: *I ___ nine years old.* (หนูอายุเก้าขวบ)"
    accepted: ["am"]
    misconceptions:
      - { match: "have", feedback: "ภาษาไทยพูดว่า มีอายุ แต่ภาษาอังกฤษบอกอายุด้วย am" }
      - { match: "is", feedback: "ประธาน I ใช้ am" }
    hints:
      - "อายุบอกด้วย verb to be"
      - "ประธานคือ I"
    solution: "*I **am** nine years old.* บอกอายุด้วย be ไม่ใช้ have"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.be-have-there.p009
    topics: [english.grammar.be-have-there]
    difficulty: 3
    type: text
    stem: "เติมคำให้เป็นประโยคปฏิเสธ \"ฉันไม่หิว\": *I ___ hungry.* (พิมพ์สองคำ)"
    accepted: ["am not"]
    misconceptions:
      - { match: "don't", feedback: "hungry เป็นคำคุณศัพท์ ใช้กับ be ปฏิเสธจึงเป็น am not" }
      - { match: "not", feedback: "ต้องมี am ก่อน not: I am not hungry." }
      - { match: "amn't", feedback: "am not ไม่ย่อเป็น amn't ถ้าจะย่อให้ย่อ I am เป็น I'm: I'm not hungry." }
      - { match: "isn't", feedback: "isn't ใช้กับ he, she, it ส่วน I ใช้ am not" }
    hints:
      - "hungry เป็นคำคุณศัพท์ ต้องมี be"
      - "ปฏิเสธของ be ใส่ not ไว้หลัง be"
    solution: "*I **am not** hungry.* (ย่อเป็น I'm not hungry.)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.be-have-there.p010
    topics: [english.grammar.be-have-there]
    difficulty: 3
    type: text
    stem: "เติมคำขึ้นต้นคำถาม: *___ you from Chiang Mai?*"
    accepted: ["Are", "are"]
    misconceptions:
      - { match: "do", feedback: "ประโยคนี้ไม่มีกริยาอื่น be from ใช้ be สร้างคำถาม ไม่ใช้ do" }
      - { match: "is", feedback: "you ใช้ are" }
    hints:
      - "ประโยคบอกเล่าคือ You are from Chiang Mai."
      - "คำถามของ verb to be ย้าย be ขึ้นหน้าประธาน"
    solution: "*You are from Chiang Mai.* → ***Are** you from Chiang Mai?*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.be-have-there.p011
    topics: [english.grammar.be-have-there]
    difficulty: 3
    type: text
    stem: "เติมคำขึ้นต้นคำถาม: *___ your brother have a bike?*"
    accepted: ["Does", "does"]
    misconceptions:
      - { match: "has", feedback: "have/has ไม่ย้ายขึ้นหน้าประโยค คำถามใช้ Does + ประธาน + have" }
      - { match: "do", feedback: "your brother = he ใช้ Does" }
      - { match: "is", feedback: "ประโยคมีกริยา have อยู่แล้ว คำถามใช้ Does ไม่ใช่ Is" }
    hints:
      - "have เป็นกริยาทั่วไป คำถามต้องใช้ do หรือ does"
      - "your brother แทนด้วย he"
    solution: "***Does** your brother have a bike?* สังเกตว่าหลัง does ใช้ have"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.be-have-there.p012
    topics: [english.grammar.be-have-there]
    difficulty: 3
    type: mcq
    stem: "ดูภาพตู้เย็น แล้วเลือกประโยคที่บรรยายภาพได้ **ถูกต้อง**"
    figure: { src: fridge-quiz.svg, alt: "ตู้เย็นที่เปิดอยู่ มีสามชั้น ชั้นบนมีไข่ 4 ฟอง ชั้นกลางมีขวดนมหนึ่งขวดเขียนว่า MILK ชั้นล่างมีแอปเปิลสีแดง 2 ลูก" }
    choices:
      - { id: a, text: "There are four eggs and there is a bottle of milk.", correct: true, feedback: "ถูก ไข่ 4 ฟองใช้ there are และนมหนึ่งขวดใช้ there is" }
      - { id: b, text: "There is four eggs and there is a bottle of milk.", feedback: "four eggs เป็นพหูพจน์ต้องใช้ there are" }
      - { id: c, text: "There are four eggs and there are two bottles of milk.", feedback: "ลองนับขวดนมอีกครั้ง มีขวดเดียว" }
      - { id: d, text: "There are two eggs and there is an apple.", feedback: "ลองนับไข่และแอปเปิลในภาพอีกครั้ง" }
    hints:
      - "นับไข่ ขวดนม และแอปเปิลในภาพ"
      - "จำนวนหนึ่งใช้ there is มากกว่าหนึ่งใช้ there are"
    solution: "ในภาพมีไข่ 4 ฟอง นม 1 ขวด และแอปเปิล 2 ลูก ประโยคที่ถูกคือ *There are four eggs and there is a bottle of milk.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.be-have-there.p013
    topics: [english.grammar.be-have-there]
    difficulty: 3
    type: order
    stem: "เรียงคำให้เป็นคำถาม \"แถวนี้มีธนาคารไหม\""
    items: ["Is", "there", "a bank", "near here?"]
    hints:
      - "คำถามของ there is ย้าย is ขึ้นหน้า there"
      - "Is there + สิ่งของ + สถานที่?"
    solution: "*Is there a bank near here?* (บอกเล่าคือ There is a bank near here.)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.be-have-there.p014
    topics: [english.grammar.be-have-there]
    difficulty: 4
    type: text
    stem: "ตอบสั้นแบบบอกรับ: *Is Nida your cousin?* — *Yes, ___ ___.* (พิมพ์สองคำ)"
    accepted: ["she is", "she is."]
    misconceptions:
      - { match: "she's", feedback: "คำตอบสั้นแบบบอกรับห้ามย่อ ต้องเป็น Yes, she is." }
      - { match: "she's.", feedback: "คำตอบสั้นแบบบอกรับห้ามย่อ ต้องเป็น Yes, she is." }
      - { match: "she does", feedback: "คำถามใช้ Is คำตอบจึงใช้ is ไม่ใช่ does" }
      - { match: "he is", feedback: "Nida เป็นชื่อผู้หญิง ใช้ she" }
    hints:
      - "คำตอบสั้นใช้สรรพนาม + be ตัวเดียวกับคำถาม"
      - "Nida แทนด้วย she และห้ามย่อในคำตอบบอกรับ"
    solution: "*Yes, **she is**.* (ปฏิเสธคือ No, she isn't.)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.be-have-there.p015
    topics: [english.grammar.be-have-there]
    difficulty: 4
    type: mcq
    stem: "เลือกคำที่ถูกต้อง: *There ___ some milk in the glass.*"
    choices:
      - { id: a, text: "is", correct: true, feedback: "ถูก milk เป็นคำนามนับไม่ได้ ใช้ there is" }
      - { id: b, text: "are", feedback: "some ไม่ได้ทำให้เป็นพหูพจน์เสมอ milk นับไม่ได้จึงใช้ is" }
      - { id: c, text: "has", feedback: "บอกว่ามีอะไรอยู่ที่ไหน ใช้ there is/are ไม่ใช้ has" }
      - { id: d, text: "have", feedback: "บอกว่ามีอะไรอยู่ที่ไหน ใช้ there is/are ไม่ใช้ have" }
    hints:
      - "milk นับเป็นชิ้นได้หรือไม่"
      - "คำนามนับไม่ได้ใช้ there is"
    solution: "milk เป็นคำนามนับไม่ได้ จึงใช้ *There **is** some milk in the glass.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.be-have-there.p016
    topics: [english.grammar.be-have-there]
    difficulty: 4
    type: text
    stem: "เติมคำ: *There aren't ___ chairs in the room.* (ในห้องไม่มีเก้าอี้เลย)"
    accepted: ["any"]
    misconceptions:
      - { match: "some", feedback: "some ใช้ในประโยคบอกเล่า ประโยคปฏิเสธใช้ any" }
      - { match: "no", feedback: "aren't เป็นปฏิเสธแล้ว ถ้าใส่ no ซ้ำจะเป็นปฏิเสธซ้อน (There are no chairs. ใช้ no กับ are)" }
    hints:
      - "ประโยคปฏิเสธของ there are มักตามด้วยคำหนึ่งก่อนคำนาม"
      - "some ใช้กับบอกเล่า ส่วนปฏิเสธและคำถามใช้คำใด"
    solution: "*There aren't **any** chairs in the room.* (หรือ There are no chairs in the room.)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.be-have-there.p017
    topics: [english.grammar.be-have-there]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "เลือกประโยคที่ **ถูกต้อง** ทั้งหมด"
    choices:
      - { id: a, text: "There is a cat under the table.", correct: true }
      - { id: b, text: "My parents have a small shop in Lampang.", correct: true }
      - { id: c, text: "Do you have a pencil?", correct: true }
      - { id: d, text: "She doesn't has a phone.", feedback: "หลัง doesn't ใช้ have: She doesn't have a phone." }
      - { id: e, text: "Are there a post office near here?", feedback: "a post office เป็นเอกพจน์: Is there a post office near here?" }
      - { id: f, text: "I'm not have a pet.", feedback: "have เป็นกริยาทั่วไป ปฏิเสธใช้ don't: I don't have a pet." }
    hints:
      - "ตรวจ has/have หลัง does และ doesn't"
      - "there is/are ต้องตรงกับจำนวนของคำนาม และ be ไม่ใช้ปฏิเสธ have"
    solution: "ถูก: There is a cat under the table. · My parents have a small shop in Lampang. · Do you have a pencil? ผิด: doesn't has → doesn't have · Are there a → Is there a · I'm not have → I don't have"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.be-have-there.p018
    topics: [english.grammar.be-have-there]
    difficulty: 5
    type: text
    stem: "เปลี่ยนเป็นคำถาม แล้วพิมพ์ประโยคเต็ม: *There are two bathrooms in your house.*"
    accepted:
      - "Are there two bathrooms in your house?"
      - "Are there two bathrooms in your house"
    misconceptions:
      - { match: "There are two bathrooms in your house?", feedback: "คำถามต้องย้าย are ขึ้นหน้า there" }
      - { match: "Is there two bathrooms in your house?", feedback: "two bathrooms เป็นพหูพจน์ ใช้ Are there" }
      - { match: "Do there are two bathrooms in your house?", feedback: "there are สร้างคำถามเองได้ ไม่ต้องมี do" }
      - { match: "Have two bathrooms in your house?", feedback: "บอกว่ามีอยู่ที่ไหนใช้ there are และคำถามคือ Are there ...?" }
    hints:
      - "คำถามของ there are ไม่ใช้ do"
      - "สลับ there กับ are"
    solution: "**Are there two bathrooms in your house?** ตอบสั้นว่า Yes, there are. หรือ No, there aren't."
    license: CC-BY-SA-4.0
    ai_assisted: true
