  solution: ค่าเฉพาะจริงบวกให้การโต ค่าเฉพาะจริงลบให้การลด ส่วนจริงลบของคู่เชิงซ้อนให้การแกว่งที่ลด และค่าเฉพาะที่มีเครื่องหมายต่างกันให้จุดสมดุลแบบอานม้า
