problems:
  - id: zh.tone.p001
    topics: [chinese.pinyin.tones]
    difficulty: 1
    type: mcq
    stem: "พยางค์ใดเป็นวรรณยุกต์เสียงที่ 4 (เสียงตกจากสูงลงต่ำ)"
    choices:
      - { id: a, text: "mà", correct: true, feedback: "ถูก เครื่องหมายเอียงลงจากซ้ายไปขวา เหมือนเสียงที่ตกลง" }
      - { id: b, text: "má", feedback: "เครื่องหมายเอียงขึ้นคือเสียง 2 (เสียงขึ้น) ดูทิศของขีด: ขีดชี้ขึ้นเสียงก็ขึ้น" }
      - { id: c, text: "mǎ", feedback: "เครื่องหมายรูปตัว v คือเสียง 3 ซึ่งลงต่ำแล้วขึ้น" }
      - { id: d, text: "mā", feedback: "ขีดแนวนอนคือเสียง 1 ระดับสูงคงที่" }
    hints:
      - "รูปเครื่องหมายวรรณยุกต์พินอินวาดตามทิศทางของเสียง"
      - "เสียงตกลงจึงใช้ขีดที่เอียงลงจากซ้ายไปขวา"
    solution: "ā = เสียง 1 (ระดับ) · á = เสียง 2 (ขึ้น) · ǎ = เสียง 3 (ลงแล้วขึ้น) · à = เสียง 4 (ตก) คำตอบคือ mà (骂 ด่า)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: zh.tone.p002
    topics: [chinese.pinyin.tones]
    difficulty: 1
    type: match
    stem: "จับคู่เสียงวรรณยุกต์ภาษาจีนกลางกับลักษณะเสียง"
    pairs:
      - { left: "เสียง 1 (ā)", right: "สูงและระดับคงที่" }
      - { left: "เสียง 2 (á)", right: "ขึ้นจากกลางไปสูง" }
      - { left: "เสียง 3 (ǎ)", right: "ต่ำ ลงแล้วขึ้น" }
      - { left: "เสียง 4 (à)", right: "ตกจากสูงลงต่ำ" }
      - { left: "เสียงเบา (a)", right: "สั้นและเบา ไม่มีเครื่องหมาย" }
    hints:
      - "รูปของเครื่องหมายบอกทิศทางของเสียง"
      - "เครื่องหมายรูปตัว v แปลว่าเสียงลงก่อนแล้วขึ้น"
    solution: "ā ระดับสูง · á ขึ้น · ǎ ลงแล้วขึ้น · à ตก · ไม่มีเครื่องหมาย = เสียงเบา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: zh.tone.p003
    topics: [chinese.pinyin.tones]
    difficulty: 1
    type: text
    stem: "เขียนพินอินของพยางค์ที่มีพยัญชนะต้น m สระ a และวรรณยุกต์เสียงที่ 3 (ใส่เครื่องหมาย หรือพิมพ์เลขเสียงต่อท้าย เช่น ma1)"
    accepted: ["mǎ", "ma3"]
    misconceptions:
      - { match: "mà", feedback: "à คือเสียง 4 (ตก) เสียง 3 ใช้เครื่องหมายรูปตัว v" }
      - { match: "ma4", feedback: "เลข 4 คือเสียงตก โจทย์ต้องการเสียง 3" }
      - { match: "má", feedback: "á คือเสียง 2 (ขึ้น) เสียง 3 ใช้เครื่องหมายรูปตัว v" }
    hints:
      - "เสียง 3 เป็นเสียงต่ำที่ลงแล้วขึ้น"
      - "เครื่องหมายของเสียง 3 มีรูปเหมือนตัว v วางบนสระ"
    solution: "m + a + เสียง 3 = **mǎ** (หรือ ma3) เช่น 马 mǎ แปลว่าม้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: zh.tone.p004
    topics: [chinese.pinyin.tones]
    difficulty: 2
    type: mcq
    stem: "hao3 (好 ดี) เขียนด้วยเครื่องหมายวรรณยุกต์อย่างไร"
    choices:
      - { id: a, text: "hǎo", correct: true, feedback: "ถูก มีสระ a จึงวางเครื่องหมายบน a" }
      - { id: b, text: "haǒ", feedback: "ถ้าพยางค์มี a ต้องวางเครื่องหมายบน a เสมอ ไม่ใช่บนสระตัวสุดท้าย" }
      - { id: c, text: "hào", feedback: "วางบนสระถูกตัวแล้ว แต่ à คือเสียง 4 เลข 3 ต้องใช้เครื่องหมายรูปตัว v" }
    hints:
      - "เลข 3 หมายถึงเสียงที่ 3"
      - "ถ้าในพยางค์มี a ให้วางเครื่องหมายบน a ก่อนสระตัวอื่น"
    solution: "เลข 3 = เครื่องหมายรูปตัว v และมี a จึงวางบน a ได้ **hǎo**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: zh.tone.p005
    topics: [chinese.pinyin.tones]
    difficulty: 2
    type: match
    stem: "จับคู่พยัญชนะต้นพินอินกับพยัญชนะไทยที่มีเสียงใกล้เคียงที่สุด"
    pairs:
      - { left: "b", right: "ป" }
      - { left: "p", right: "พ" }
      - { left: "d", right: "ต" }
      - { left: "t", right: "ท" }
      - { left: "g", right: "ก" }
      - { left: "k", right: "ค" }
    hints:
      - "ภาษาจีนแยกพยัญชนะคู่ด้วยลมที่พ่นออกมา ไม่ได้แยกด้วยเสียงก้อง"
      - "b, d, g ไม่มีลม ส่วน p, t, k มีลม ลองเอามือป้องปากแล้วพูด ป กับ พ ดูว่าตัวไหนมีลมออก"
    solution: "b ≈ ป · p ≈ พ · d ≈ ต · t ≈ ท · g ≈ ก · k ≈ ค (b, d, g ไม่ใช่ บ, ด ของไทย)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: zh.tone.p006
    topics: [chinese.pinyin.tones]
    difficulty: 2
    type: mcq
    stem: "你好 สะกดว่า nǐ hǎo เวลาพูดจริงออกเสียงอย่างไร"
    choices:
      - { id: a, text: "ní hǎo", correct: true, feedback: "ถูก เสียง 3 ที่ตามด้วยเสียง 3 พยางค์แรกเปลี่ยนเป็นเสียง 2" }
      - { id: b, text: "nǐ hǎo", feedback: "นั่นคือรูปที่เขียน แต่เวลาพูด เสียง 3 สองพยางค์ติดกันจะเปลี่ยนพยางค์แรกเป็นเสียง 2" }
      - { id: c, text: "nǐ háo", feedback: "เปลี่ยนผิดพยางค์ พยางค์ที่เปลี่ยนคือพยางค์แรก ส่วนพยางค์หลังยังเป็นเสียง 3" }
      - { id: d, text: "nì hǎo", feedback: "พยางค์แรกเปลี่ยนเป็นเสียง 2 (ขึ้น) ไม่ใช่เสียง 4 (ตก)" }
    hints:
      - "ทั้ง nǐ และ hǎo เป็นเสียง 3"
      - "เมื่อเสียง 3 ตามด้วยเสียง 3 พยางค์ใดเปลี่ยน และเปลี่ยนเป็นเสียงอะไร"
    solution: "เสียง 3 + เสียง 3 → เสียง 2 + เสียง 3 จึงพูดว่า **ní hǎo** แม้จะเขียนว่า nǐ hǎo"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: zh.tone.p007
    topics: [chinese.pinyin.tones]
    difficulty: 3
    type: text
    stem: "谢 (ขอบคุณ ใน 谢谢) ประกอบด้วย x + ie + เสียง 4 เขียนพินอินอย่างไร (ใส่เครื่องหมาย หรือพิมพ์เลขเสียงต่อท้าย เช่น xie1)"
    accepted: ["xiè", "xie4"]
    misconceptions:
      - { match: "xìe", feedback: "ไม่มี a แต่มี e จึงต้องวางเครื่องหมายบน e ไม่ใช่บน i" }
      - { match: "xié", feedback: "วางบนสระถูกตัวแล้ว แต่ é คือเสียง 2 เสียง 4 ใช้ขีดที่เอียงลง" }
    hints:
      - "เสียง 4 ใช้ขีดที่เอียงลงจากซ้ายไปขวา"
      - "พยางค์นี้ไม่มี a ดูว่ามี o หรือ e หรือไม่"
    solution: "ไม่มี a แต่มี e จึงวางบน e: **xiè** (xie4) คำว่า 谢谢 เขียนว่า xièxie โดยพยางค์หลังเป็นเสียงเบา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: zh.tone.p008
    topics: [chinese.pinyin.tones]
    difficulty: 3
    type: mcq
    stem: "ครูภาษาจีนที่โรงเรียนในเชียงใหม่สอนว่า 买 mǎi แปลว่า ซื้อ และ 卖 mài แปลว่า ขาย ถ้าแม่ค้าที่ตลาดวโรรสบอกลูกค้าชาวจีนว่า wǒ mài shuǐguǒ เธอหมายความว่าอย่างไร (wǒ = ฉัน, shuǐguǒ = ผลไม้)"
    choices:
      - { id: a, text: "ฉันขายผลไม้", correct: true, feedback: "ถูก mài เสียง 4 (ตก) แปลว่าขาย" }
      - { id: b, text: "ฉันซื้อผลไม้", feedback: "ซื้อคือ mǎi เสียง 3 (ต่ำ) แต่ประโยคนี้ใช้ mài เสียง 4 (ตก) เสียงต่างกันความหมายก็ต่างกัน" }
    hints:
      - "สองคำนี้ต่างกันแค่วรรณยุกต์"
      - "ดูเครื่องหมายบนสระ a ในประโยค: เป็นรูปตัว v หรือขีดเอียงลง"
    solution: "ประโยคใช้ mài (เสียง 4) = ขาย จึงแปลว่า **ฉันขายผลไม้** ถ้าเป็น mǎi (เสียง 3) จะแปลว่าฉันซื้อผลไม้ ตัวอย่างนี้แสดงว่าวรรณยุกต์เปลี่ยนความหมายได้จริง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: zh.tone.p009
    topics: [chinese.pinyin.tones]
    difficulty: 3
    type: mcq
    stem: "ในเมนูร้านติ่มซำย่านเยาวราชมีคำว่า 包子 bāozi (ซาลาเปา) ตัว b ในพินอินออกเสียงใกล้กับพยัญชนะไทยตัวใดที่สุด"
    choices:
      - { id: a, text: "ป", correct: true, feedback: "ถูก b ในพินอินไม่มีลมและไม่ก้อง ใกล้ ป ของไทย bāozi จึงอ่านใกล้ \"เปาจือ\"" }
      - { id: b, text: "บ", feedback: "บ ของไทยเป็นเสียงก้อง (สั่นเส้นเสียง) ซึ่งภาษาจีนกลางไม่มี b ในพินอินใกล้ ป มากกว่า" }
      - { id: c, text: "พ", feedback: "พ มีลมพ่นออกมา ซึ่งตรงกับ p ในพินอิน ไม่ใช่ b" }
    hints:
      - "พินอินแยก b กับ p ด้วยลมที่พ่นออกมา"
      - "b ไม่มีลม p มีลม ลองหาพยัญชนะไทยที่ไม่มีลมและไม่ก้อง"
    solution: "พินอิน b = ไม่มีลม ไม่ก้อง ≈ **ป** ส่วน p = มีลม ≈ พ (คำว่า เปา ในซาลาเปาก็มาจาก 包 ตัวนี้ ผ่านภาษาจีนถิ่น)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: zh.tone.p010
    topics: [chinese.pinyin.tones]
    difficulty: 4
    type: numeric
    stem: "พนักงานร้านขายยาในเยาวราชตอบลูกค้าชาวจีนว่า 不是 (ไม่ใช่) ซึ่งสะกดว่า bù + shì (shì เป็นเสียง 4) เวลาพูดจริง 不 ออกเสียงเป็นวรรณยุกต์เสียงที่เท่าใด (ตอบเลข 1–4)"
    answer: { value: 2 }
    hints:
      - "不 ปกติเป็นเสียง 4 คือ bù"
      - "ดูว่าพยางค์ที่ตามมาเป็นเสียงอะไร แล้วใช้กฎการเปลี่ยนเสียงของ 不"
    misconceptions:
      - { match: 4, feedback: "เสียง 4 คือเสียงเดิมของ 不 แต่เมื่อตามด้วยเสียง 4 อีกตัว 不 จะเปลี่ยนเสียง" }
    solution: "不 bù (เสียง 4) ตามด้วย shì (เสียง 4) จึงเปลี่ยนเป็นเสียง **2**: bú shì"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: zh.tone.p011
    topics: [chinese.pinyin.tones]
    difficulty: 4
    type: text
    stem: "流 (ไหล) ประกอบด้วย l + iu + เสียง 2 เขียนพินอินอย่างไร (ใส่เครื่องหมาย หรือพิมพ์เลขเสียงต่อท้าย เช่น liu1)"
    accepted: ["liú", "liu2"]
    misconceptions:
      - { match: "líu", feedback: "สระ iu เป็นกรณีพิเศษ ให้วางเครื่องหมายบนตัวหลัง คือ u" }
      - { match: "liù", feedback: "วางบนสระถูกตัวแล้ว แต่ ù คือเสียง 4 เสียง 2 ใช้ขีดที่เอียงขึ้น" }
    hints:
      - "พยางค์นี้ไม่มี a, o หรือ e"
      - "เมื่อสระเป็น iu หรือ ui ให้วางเครื่องหมายบนสระตัวหลัง"
    solution: "ไม่มี a, o, e และเป็นสระ iu จึงวางบนตัวหลัง (u) เสียง 2 จึงได้ **liú** (liu2)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: zh.tone.p012
    topics: [chinese.pinyin.tones]
    difficulty: 4
    type: text
    stem: "句 (ประโยค) ประกอบด้วยพยัญชนะต้น j สระ ü และเสียง 4 เขียนพินอินอย่างไร (ใส่เครื่องหมาย หรือพิมพ์เลขเสียงต่อท้าย เช่น ju1)"
    accepted: ["jù", "ju4"]
    misconceptions:
      - { match: "jǜ", feedback: "หลัง j, q, x และ y สระ ü เขียนเป็น u โดยไม่มีจุด เพราะพยัญชนะเหล่านี้ไม่ตามด้วย u ธรรมดาอยู่แล้ว" }
      - { match: "jv4", feedback: "v ใช้แทน ü ตอนพิมพ์เฉพาะหลัง n และ l เช่น nv3 หลัง j เขียนเป็น u ได้เลย" }
    hints:
      - "เสียง 4 ใช้ขีดที่เอียงลง"
      - "ดูกฎการเขียน ü หลังพยัญชนะ j, q, x, y"
    solution: "หลัง j สระ ü เขียนเป็น u (ไม่มีจุด) และเสียง 4 วางบน u ได้ **jù** (ju4) แต่ยังออกเสียงเป็น ü (ทำปากจู๋แล้วออกเสียง อี)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: zh.tone.p013
    topics: [chinese.pinyin.tones]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นการเทียบวรรณยุกต์ภาษาจีนกลางกับภาษาไทยที่ใช้เป็นจุดเริ่มต้นได้อย่างสมเหตุสมผล (เลือกได้หลายข้อ)"
    choices:
      - { id: a, text: "เสียง 4 ใกล้เคียงเสียงโทของไทย", correct: true, feedback: "ถูก ทั้งสองเป็นเสียงตกจากสูง แม้รูปเสียงจะไม่เหมือนกันทุกประการ" }
      - { id: b, text: "เสียง 3 ในประโยคมักออกเป็นเสียงต่ำ คล้ายเสียงเอก", correct: true, feedback: "ถูก ในการพูดต่อเนื่อง เสียง 3 มักออกแค่ช่วงต่ำ ไม่เชิดขึ้นท้าย" }
      - { id: c, text: "เสียง 2 ใกล้เคียงเสียงจัตวา", correct: true, feedback: "ถูก ทั้งสองเป็นเสียงขึ้น ใช้เป็นจุดเริ่มต้นได้" }
      - { id: d, text: "เสียง 1 เหมือนเสียงสามัญของไทยทุกประการ", feedback: "เสียง 1 ระดับเหมือนสามัญ แต่สูงกว่าชัดเจน ถ้าพูดระดับเดียวกับสามัญจะฟังไม่เป็นธรรมชาติ" }
      - { id: e, text: "ภาษาไทยกับภาษาจีนกลางมีวรรณยุกต์ตรงกันครบทุกเสียง", feedback: "ไม่ตรงกันครบ เช่น เสียงตรีของไทยไม่มีคู่ที่ตรงกัน และรูปเสียงของแต่ละภาษาต่างกันในรายละเอียด การเทียบจึงเป็นเพียงการประมาณ" }
    hints:
      - "นึกถึงทิศทางของแต่ละเสียง: ระดับ ขึ้น ต่ำ ตก"
