<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei','Noto Sans Thai',sans-serif">
<title>ประกาศชมรมภาษาจีนของโรงเรียน (สมมติ) เรื่องไปเที่ยวเยาวราช</title>
<defs></defs>
<rect x="0" y="0" width="640" height="430" fill="#fff"/>
<rect x="20.0" y="15.0" width="600.0" height="400.0" rx="6" fill="#fffdf5" stroke="#7a5a00" stroke-width="2.5"/>
<text x="320.0" y="58.0" font-size="28" text-anchor="middle" fill="#b3261e" font-weight="bold">通知</text>
<text x="50.0" y="105.0" font-size="20" text-anchor="start" fill="#1a1a1a" font-weight="normal">中文俱乐部的同学们：</text>
<text x="50.0" y="143.0" font-size="20" text-anchor="start" fill="#1a1a1a" font-weight="normal">　　这个星期六（11月14日）我们去</text>
<text x="50.0" y="181.0" font-size="20" text-anchor="start" fill="#1a1a1a" font-weight="normal">唐人街参观。早上八点在学校门口集合，</text>
<text x="50.0" y="219.0" font-size="20" text-anchor="start" fill="#1a1a1a" font-weight="normal">八点半出发，下午四点回学校。每个人</text>
<text x="50.0" y="257.0" font-size="20" text-anchor="start" fill="#1a1a1a" font-weight="normal">交一百五十泰铢。请带水、帽子和笔记本。</text>
<text x="50.0" y="295.0" font-size="20" text-anchor="start" fill="#1a1a1a" font-weight="normal">如果下雨，我们就去博物馆。</text>
<text x="590.0" y="345.0" font-size="19" text-anchor="end" fill="#1a1a1a" font-weight="normal">中文俱乐部</text>
<text x="590.0" y="378.0" font-size="19" text-anchor="end" fill="#1a1a1a" font-weight="normal">11月9日</text>
<text x="50.0" y="400.0" font-size="13" text-anchor="start" fill="#666" font-weight="normal">唐人街 = ไชน่าทาวน์ (เยาวราช) · 笔记本 = สมุดจด · 博物馆 = พิพิธภัณฑ์</text>
</svg>
