  - id: computer.programming.lists-strings.p016
    topics: [computer.programming.lists-strings]
    difficulty: 5
    type: numeric
    stem: |
      สหกรณ์โรงเรียนใช้โปรแกรมนี้ตัดสต็อกหลังขายของ แล้วหาสินค้าที่ต้องสั่งเพิ่ม (เหลือ 0 หรือติดลบ) โปรแกรมแสดงตัวเลขใด

      ```python
      stock = {"ปากกา": 10, "ดินสอ": 5}
      sold = [("ปากกา", 3), ("ยางลบ", 2), ("ดินสอ", 5), ("ปากกา", 4)]
      for item, n in sold:
          stock[item] = stock.get(item, 0) - n
      low = []
      for item in stock:
          if stock[item] <= 0:
              low.append(item)
      print(len(low))
      ```
    answer: { value: 2 }
    hints:
      - "ไล่ค่าใน stock หลังแต่ละรายการขาย ยางลบไม่มีในสต็อกตอนแรก get จะให้ค่าใด"
      - "หลังวงวนแรก ดูว่าสินค้าใดมีค่าน้อยกว่าหรือเท่ากับ 0"
    misconceptions:
      - { match: 1, feedback: "ยางลบไม่มีในสต็อกตอนแรก stock.get(\"ยางลบ\", 0) - 2 จึงสร้างคีย์ใหม่ค่า -2 ซึ่งต้องนับด้วย" }
      - { match: 3, feedback: "ปากกาเหลือ 10 − 3 − 4 = 3 ยังไม่ต้องสั่ง" }
    solution: "ปากกา 10 − 3 − 4 = 3, ยางลบ 0 − 2 = −2 (เพิ่มคีย์ใหม่), ดินสอ 5 − 5 = 0 สินค้าที่ ≤ 0 คือยางลบและดินสอ len(low) = 2 ค่าติดลบของยางลบยังบอกด้วยว่าข้อมูลสต็อกไม่ตรงกับของจริง ควรตรวจ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.lists-strings.p017
    topics: [computer.programming.lists-strings]
    difficulty: 5
    type: numeric
    stem: |
      ดิกชันนารีเก็บลิสต์คะแนนของนักเรียนแต่ละคน (จำนวนครั้งที่สอบไม่เท่ากัน) โปรแกรมนี้แสดงค่าเฉลี่ยของคะแนน **ทุกครั้ง** รวมกันเท่าใด

      ```python
      students = {"ฟ้า": [80, 90], "ต้น": [50, 60, 70]}
      total = 0
      n = 0
      for name in students:
          for s in students[name]:
              total = total + s
              n = n + 1
      print(total / n)
      ```
    answer: { value: 70 }
    hints:
      - "วงวนนอกไล่ชื่อ วงวนในไล่คะแนนในลิสต์ของชื่อนั้น"
      - "total คือผลรวมคะแนนทั้ง 5 ครั้ง n คือจำนวนครั้ง"
    misconceptions:
      - { match: 72.5, feedback: "นี่คือค่าเฉลี่ยของค่าเฉลี่ยรายคน (85 และ 60) แต่โปรแกรมรวมทุกคะแนนแล้วหารด้วยจำนวนครั้งทั้งหมด" }
      - { match: 175, feedback: "หารด้วยจำนวนนักเรียน 2 คน แต่ n นับทุกคะแนน ได้ 5" }
    solution: "total = 80 + 90 + 50 + 60 + 70 = 350 และ n = 5 ได้ 350 / 5 = 70.0 ต่างจากค่าเฉลี่ยของค่าเฉลี่ยรายคน (85 + 60) / 2 = 72.5 เพราะต้นสอบมากครั้งกว่า"
