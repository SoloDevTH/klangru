    type: mcq
    stem: "ทำไมจึงเดินข้ามสะพานทั้ง 7 แห่งของเมืองเคอนิกส์แบร์กครั้งเดียวพอดีไม่ได้"
    choices:
      - { id: a, text: "เมื่อแทนแผ่นดินด้วยจุดยอดและสะพานด้วยเส้นเชื่อม ทั้ง 4 จุดมีดีกรีคี่", correct: true }
      - { id: b, text: "เพราะสะพานมีจำนวนคี่ (7 แห่ง)", feedback: "จำนวนเส้นเชื่อมไม่ใช่เกณฑ์ กราฟที่มีเส้นเชื่อม 7 เส้นหลายแบบลากครั้งเดียวได้ เกณฑ์คือจำนวนจุดดีกรีคี่" }
      - { id: c, text: "เพราะเกาะอยู่ตรงกลางและมีสะพานมากที่สุด", feedback: "ตำแหน่งในแผนที่ไม่สำคัญ สิ่งที่สำคัญคือดีกรีของทุกจุด" }
      - { id: d, text: "เพราะแผ่นดินบางส่วนไม่เชื่อมโยงกัน", feedback: "แผ่นดินทั้ง 4 ส่วนเดินถึงกันได้ผ่านสะพาน กราฟจึงเชื่อมโยง" }
    hints:
      - "นับสะพานที่ต่อกับแผ่นดินแต่ละส่วน"
      - "ดีกรีคือ 3, 5, 3, 3"
    solution: "ดีกรีของฝั่งเหนือ เกาะ ฝั่งใต้ และฝั่งตะวันออกคือ 3, 5, 3, 3 มีจุดดีกรีคี่ 4 จุด แต่แนวเดินที่ใช้ทุกเส้นครั้งเดียวมีจุดดีกรีคี่ได้ไม่เกิน 2 จุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.discrete.networks.p015
    topics: [math.discrete.networks]
    difficulty: 5
    type: numeric
    stem: "ในปัญหาสะพานเคอนิกส์แบร์ก (ดีกรีของแผ่นดินทั้ง 4 ส่วนคือ 3, 5, 3, 3) ต้องสร้างสะพานเพิ่มอย่างน้อยกี่แห่ง จึงจะเดินข้ามทุกสะพานครั้งเดียวพอดีแล้ว **กลับมาที่จุดเริ่มต้น** ได้"
    answer: { value: 2, unit: แห่ง }
    hints:
      - "การกลับมาที่จุดเริ่ม (วงจรออยเลอร์) ต้องการให้ทุกจุดมีดีกรีคู่"
      - "สะพานใหม่ 1 แห่งเปลี่ยนดีกรีของแผ่นดิน 2 ส่วน ส่วนละ 1"
    misconceptions:
      - { match: 1, feedback: "สะพาน 1 แห่งทำให้เหลือจุดดีกรีคี่ 2 จุด เดินผ่านทุกสะพานได้แต่จบคนละที่ ถ้าจะกลับมาที่เดิมต้องไม่มีจุดดีกรีคี่เลย" }
      - { match: 4, feedback: "สะพานแต่ละแห่งแก้จุดดีกรีคี่ได้ 2 จุดพร้อมกัน (ปลายสองข้าง) จึงไม่ต้องสร้าง 4 แห่ง" }
    solution: "มีจุดดีกรีคี่ 4 จุด สะพานใหม่แต่ละแห่งเปลี่ยนดีกรีของปลายทั้งสองข้าง จับคู่จุดดีกรีคี่เป็น 2 คู่ สร้าง 2 สะพาน เช่น A–C และ B–D ทุกจุดจะมีดีกรีคู่ (4, 6, 4, 4) จึงมีวงจรออยเลอร์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.discrete.networks.p016
    topics: [math.discrete.networks]
    difficulty: 5
    type: mcq
    stem: "ในกราฟตามภาพ ถ้าตัดเส้นเชื่อมเส้นใดทิ้งแล้วกราฟจะไม่เชื่อมโยง"
    figure:
      src: p-bridge.svg
      alt: "กราฟมีจุดยอด 6 จุด A B C ต่อกันเป็นสามเหลี่ยม D E F ต่อกันเป็นสามเหลี่ยม และมีเส้นเชื่อม C–D เส้นเดียวเชื่อมสามเหลี่ยมทั้งสอง"
    choices:
      - { id: a, text: "C–D", correct: true }
      - { id: b, text: "A–C", feedback: "ตัด A–C แล้ว A ยังไปถึง C ผ่าน B ได้" }
      - { id: c, text: "E–F", feedback: "ตัด E–F แล้ว E กับ F ยังถึงกันผ่าน D ได้" }
      - { id: d, text: "ไม่มีเส้นใด เพราะทุกจุดมีดีกรีอย่างน้อย 2", feedback: "ดีกรีอย่างน้อย 2 ไม่ได้รับประกัน เส้น C–D เป็นทางเดียวระหว่างสองสามเหลี่ยม" }
    hints:
      - "เส้นที่อยู่ในวงจรตัดแล้วยังมีทางอ้อม"
      - "หาเส้นที่เป็นทางเดียวระหว่างสองส่วนของกราฟ"
    solution: "เส้น A–C, B–C, A–B อยู่ในสามเหลี่ยม ตัดแล้วยังมีทางอ้อม เช่นเดียวกับ D–E, D–F, E–F ส่วน C–D เป็นทางเดียวระหว่าง {A, B, C} กับ {D, E, F} จึงเป็นสะพานของกราฟ เหมือนถนนสายเดียวเข้าหมู่บ้าน"
    license: CC-BY-SA-4.0
