  - id: earthscience.systems.computational-models.p018
    topics: [earthscience.systems.computational-models]
    difficulty: 5
    type: mcq
    stem: "กรมประมงต้องตั้งโควตาจับปลาชนิดหนึ่ง ข้อมูลบอกว่า $K \\approx 1{,}000$ ตัน แต่ $r$ อยู่ระหว่าง 0.4 ถึง 0.6 ต่อปี (ไม่แน่นอน) และประชากรตอนนี้ราว 800 ตัน ควรตั้งโควตาเท่าใดจึงยั่งยืนที่สุดเมื่อคิดถึงความไม่แน่นอน"
    choices:
      - { id: a, text: "90 ตันต่อปี ต่ำกว่าผลผลิตสูงสุดที่ยั่งยืนแม้ในกรณีที่ r ต่ำที่สุด (100 ตัน)", correct: true }
      - { id: b, text: "150 ตันต่อปี เท่ากับผลผลิตสูงสุดที่ยั่งยืนเมื่อ r = 0.6", feedback: "ถ้า r จริงเป็น 0.4 ผลผลิตสูงสุดที่ยั่งยืนเหลือ 100 ตัน การจับ 150 ตันจะทำให้ปลาหมด" }
      - { id: c, text: "125 ตันต่อปี ใช้ค่า r กลาง 0.5", feedback: "ถ้า r ต่ำกว่าค่ากลาง การจับ 125 ตันจะเกินผลผลิตสูงสุดที่ยั่งยืน และไม่มีส่วนเผื่อเลย" }
      - { id: d, text: "0 ตันต่อปี ห้ามจับเลยตลอดไป", feedback: "ประชากรอยู่ในระดับที่จับได้อย่างยั่งยืน การห้ามจับทั้งหมดไม่จำเป็นและกระทบอาชีพชาวประมง" }
    hints:
      - "หาผลผลิตสูงสุดที่ยั่งยืน rK/4 ที่ r ต่ำสุดและสูงสุด"
      - "เมื่อไม่แน่ใจ ควรเผื่อไว้ทางที่ปลอดภัยกว่า"
    solution: "ผลผลิตสูงสุดที่ยั่งยืน $rK/4$ อยู่ระหว่าง $0.4 \\times 1{,}000/4 = 100$ ถึง $0.6 \\times 1{,}000/4 = 150$ ตัน โควตา 90 ตันต่ำกว่าค่าที่น้อยที่สุด จึงยั่งยืนแม้ r จะต่ำ แล้วติดตามปริมาณปลาทุกปีเพื่อปรับโควตา"
    license: CC-BY-SA-4.0
    ai_assisted: true
