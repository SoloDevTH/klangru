    ai_assisted: true

  - id: management.public.public-policy.p015
    topics: [management.public.public-policy]
    difficulty: 5
    type: numeric
    stem: "สะพานข้ามแม่น้ำ (สมมติ) ลงทุน 50 ล้านบาทในปีที่ 0 อายุใช้งานที่คิด 10 ปี อัตราคิดลด 5% ผลประโยชน์สุทธิต่อปี (เท่ากันทุกปี ตั้งแต่ปีที่ 1 ถึง 10) อย่างน้อยกี่ล้านบาทจึงทำให้ NPV ไม่ติดลบ"
    answer: { value: 6.475, unit: ล้านบาท, tolerance: 0.02 }
    hints:
      - "ตั้ง NPV = 0 แล้วแก้หาผลประโยชน์ต่อปี"
      - "ผลประโยชน์ต่อปี = 50 ÷ $\\sum_{t=1}^{10} 1/1.05^t$"
    misconceptions:
      - { match: 5, feedback: "หาร 50 ด้วย 10 ปีตรง ๆ โดยไม่คิดลด ผลประโยชน์ในอนาคตมีค่าน้อยลงจึงต้องการมากกว่านี้" }
      - { match: 6.167, feedback: "คิดลดปีที่ 0 ถึง 9 แทนปีที่ 1 ถึง 10 ผลประโยชน์เริ่มปีที่ 1 จึงต้องหารด้วย 1.05 ตั้งแต่ปีแรก" }
    solution: "ตัวคูณ $\\sum_{t=1}^{10} 1/1.05^t \\approx 7.7217$ ผลประโยชน์ขั้นต่ำ $50 \\div 7.7217 \\approx 6.475$ ล้านบาทต่อปี ถ้าการศึกษาคาดว่าได้น้อยกว่านี้ โครงการไม่คุ้ม"
