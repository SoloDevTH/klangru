  - { framework: us-ngss, indicators: ["K-2-ETS1-1", "K-2-ETS1-3", "3-5-ETS1-1", "3-5-ETS1-2", "MS-ETS1-1", "MS-ETS1-2", "MS-ETS1-3"], coverage: full, note: "กำหนดปัญหา เกณฑ์และข้อจำกัด เปรียบเทียบทางเลือกด้วยเมทริกซ์ และวิเคราะห์ข้อมูลผลทดสอบต้นแบบหลายแบบเพื่อรวมจุดเด่น ตัวชี้วัดเหล่านี้เป็นการวิเคราะห์และกำหนดปัญหา ไม่ได้บังคับให้สร้างชิ้นงาน" }
