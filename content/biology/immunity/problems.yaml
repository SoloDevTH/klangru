      - { id: b, text: "กรีดแผลแล้วดูดพิษออก จากนั้นฉีดวัคซีนป้องกันพิษงู", feedback: "ห้ามกรีดหรือดูดแผล และวัคซีนสร้างภูมิคุ้มกันช้าเกินไปสำหรับพิษที่เข้าสู่ร่างกายแล้ว" }
      - { id: c, text: "ให้วิ่งไปโรงพยาบาลเองให้เร็วที่สุด", feedback: "การเคลื่อนไหวมากทำให้พิษกระจายเร็วขึ้น ควรให้อยู่นิ่งและเรียกความช่วยเหลือ" }
      - { id: d, text: "รอดูอาการที่บ้าน เพราะร่างกายจะสร้างแอนติบอดีต่อพิษงูได้ทันเอง", feedback: "การตอบสนองปฐมภูมิใช้เวลาหลายวัน แต่พิษงูเห่าออกฤทธิ์ภายในไม่กี่ชั่วโมง" }
    hints:
