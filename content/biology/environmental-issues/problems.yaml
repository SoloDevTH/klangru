problems:
  - id: biology.ecology.environmental-issues.p001
    topics: [biology.ecology.environmental-issues]
    difficulty: 1
    type: mcq
    stem: "สาเหตุใดทำให้สัตว์ป่าจำนวนมากที่สุดลดลง"
    choices:
      - { id: a, text: "การสูญเสียแหล่งที่อยู่ เช่น ป่าถูกเปลี่ยนเป็นพื้นที่เกษตรหรือถูกถนนตัดเป็นหย่อม", correct: true }
      - { id: b, text: "สัตว์ป่าแก่ตายตามธรรมชาติ", feedback: "การตายตามธรรมชาติมีอยู่เสมอและถูกชดเชยด้วยการเกิด ไม่ได้ทำให้ประชากรลดลงต่อเนื่อง" }
      - { id: c, text: "สัตว์ป่าอพยพไปต่างประเทศ", feedback: "การอพยพตามฤดูไม่ใช่สาเหตุหลักที่ทำให้ประชากรลดลง" }
      - { id: d, text: "สัตว์ป่ากินอาหารมากเกินไป", feedback: "ไม่ใช่สาเหตุที่ทำให้สัตว์ป่าหลายชนิดลดลงพร้อมกัน" }
    hints:
      - "สัตว์ต้องการพื้นที่หาอาหาร ที่หลบภัย และที่ผสมพันธุ์"
      - "ถ้าพื้นที่เหล่านั้นหายไป จะเกิดอะไรขึ้น"
    solution: "การสูญเสียแหล่งที่อยู่เป็นสาเหตุใหญ่ที่สุด เมื่อป่าถูกเปลี่ยนการใช้หรือแบ่งเป็นหย่อม สัตว์ขาดอาหาร ที่หลบภัย และคู่ผสมพันธุ์ ประชากรจึงลดลง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.environmental-issues.p002
    topics: [biology.ecology.environmental-issues]
    difficulty: 1
    type: match
    stem: "จับคู่มลพิษทางอากาศกับแหล่งที่มาสำคัญ"
    pairs:
      - { left: "ซัลเฟอร์ไดออกไซด์ (SO₂)", right: "การเผาถ่านหินที่มีกำมะถัน" }
      - { left: "ไนโตรเจนออกไซด์ (NOx)", right: "การเผาไหม้อุณหภูมิสูงในเครื่องยนต์" }
      - { left: "ฝุ่น PM2.5", right: "การเผาเศษวัสดุเกษตรและไฟป่า" }
    hints:
      - "ชื่อสารบอกธาตุที่มาจากเชื้อเพลิงหรืออากาศ"
      - "NOx เกิดเมื่อไนโตรเจนในอากาศรวมกับออกซิเจนที่อุณหภูมิสูง"
    solution: "SO₂ มาจากกำมะถันในถ่านหิน NOx เกิดจากการเผาไหม้อุณหภูมิสูง เช่น เครื่องยนต์ และ PM2.5 มีแหล่งสำคัญคือการเผาในที่โล่ง (และไอเสียรถยนต์)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.environmental-issues.p003
    topics: [biology.ecology.environmental-issues]
    difficulty: 1
    type: text
    stem: "ภาวะที่ไนเตรตและฟอสเฟตจากปุ๋ยไหลลงแหล่งน้ำจนสาหร่ายเพิ่มจำนวนมาก แล้วน้ำขาดออกซิเจน เรียกว่าอะไร"
    accepted: ["ยูโทรฟิเคชัน", "eutrophication", "ยูโทรฟิเคชั่น"]
    misconceptions:
      - { match: "ไบโอแมกนิฟิเคชัน", feedback: "ไบโอแมกนิฟิเคชันคือการสะสมสารพิษเพิ่มขึ้นตามโซ่อาหาร" }
      - { match: "ฝนกรด", feedback: "ฝนกรดเกิดจาก SO₂ และ NOx ในอากาศ" }
    hints:
      - "เกิดจากธาตุอาหารที่มากเกินไป"
      - "ชื่อภาษาอังกฤษขึ้นต้นด้วย eutro-"
    solution: "ยูโทรฟิเคชัน ธาตุอาหารที่มากเกินทำให้สาหร่ายเพิ่ม เมื่อสาหร่ายตาย ผู้ย่อยสลายใช้ออกซิเจนมากจนปลาขาดออกซิเจน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.environmental-issues.p004
    topics: [biology.ecology.environmental-issues]
    difficulty: 2
    type: numeric
    stem: "ค่าเฉลี่ยรายปีของ PM2.5 ทั้งประเทศลดจาก 26 ไมโครกรัมต่อลูกบาศก์เมตรในปี พ.ศ. 2566 เป็น 24 ในปี พ.ศ. 2567 ลดลงร้อยละเท่าใด (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 7.7, unit: "%", tolerance: 0.1 }
    misconceptions:
      - { match: 8.3, feedback: "หารด้วยค่าปีหลัง (24) ต้องหารด้วยค่าเริ่มต้น (26)" }
      - { match: 2, feedback: "2 คือผลต่างเป็นไมโครกรัมต่อลูกบาศก์เมตร ยังไม่ได้คิดเป็นร้อยละ" }
    hints:
      - "ร้อยละที่ลดลง = (ค่าเดิม − ค่าใหม่) ÷ ค่าเดิม × 100"
      - "$\\frac{26 - 24}{26} \\times 100$"
    solution: "$\\frac{26 - 24}{26} \\times 100 \\approx 7.7\\%$ ซึ่งกรมควบคุมมลพิษปัดเป็นราวร้อยละ 8"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.environmental-issues.p005
    topics: [biology.ecology.environmental-issues]
    difficulty: 2
    type: order
    stem: "เรียงลำดับเหตุการณ์ของยูโทรฟิเคชันในบึงที่รับน้ำจากนาข้าว"
    items:
      - "ปุ๋ยไนเตรตและฟอสเฟตไหลลงบึง"
      - "สาหร่ายเพิ่มจำนวนจนน้ำเขียว"
      - "สาหร่ายจำนวนมากตาย"
      - "ผู้ย่อยสลายใช้ออกซิเจนในน้ำขณะย่อยซาก"
      - "ปลาขาดออกซิเจนและตาย"
    hints:
      - "เริ่มจากธาตุอาหารที่เข้ามา"
      - "ออกซิเจนลดลงเพราะผู้ย่อยสลาย ไม่ใช่เพราะสาหร่ายมีชีวิต"
    solution: "ปุ๋ยลงบึง → สาหร่ายเพิ่ม → สาหร่ายตาย → ผู้ย่อยสลายใช้ออกซิเจน → ปลาตาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.environmental-issues.p006
    topics: [biology.ecology.environmental-issues]
    difficulty: 2
    type: mcq
    stem: "เกษตรกรบนพื้นที่ลาดชันในภาคเหนือพบว่าหน้าดินถูกน้ำฝนชะไปทุกปี วิธีใดช่วยลดการชะล้างพังทลายของดินได้ตรงสาเหตุที่สุด"
    choices:
      - { id: a, text: "ปลูกหญ้าแฝกเป็นแนวขวางความลาดชันและปลูกพืชคลุมดิน", correct: true }
      - { id: b, text: "เผาเศษพืชให้หมดก่อนฤดูฝน", feedback: "การเผาทำให้ดินโล่ง ยิ่งถูกชะล้างง่าย และเกิดฝุ่น" }
      - { id: c, text: "ไถพรวนตามแนวขึ้นลงของเนินให้ลึก", feedback: "การไถตามแนวขึ้นลงทำให้เกิดร่องน้ำไหลแรง ต้องไถขวางแนวลาดชัน" }
      - { id: d, text: "ใส่ปุ๋ยเคมีเพิ่มทุกปี", feedback: "ปุ๋ยชดเชยธาตุอาหารบางส่วน แต่ไม่หยุดการพังทลายของหน้าดิน" }
    hints:
      - "ดินถูกชะเพราะน้ำไหลแรงบนดินที่ไม่มีอะไรคลุม"
      - "อะไรช่วยชะลอน้ำและยึดดิน"
    solution: "รากหญ้าแฝกลึกและแน่น เมื่อปลูกเป็นแนวขวางความลาดชันจะชะลอน้ำและดักตะกอน พืชคลุมดินกันเม็ดฝนกระแทกดินโดยตรง จึงลดการชะล้างได้ตรงสาเหตุ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.environmental-issues.p007
    topics: [biology.ecology.environmental-issues]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "นักเรียนในเชียงใหม่ต้องการช่วยลด PM2.5 ในชุมชน ข้อใดเป็นการกระทำที่ช่วยลดที่แหล่งกำเนิดได้ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ทำปุ๋ยหมักจากใบไม้แทนการเผาขยะในบ้าน", correct: true }
      - { id: b, text: "ใช้รถสาธารณะหรือเดินทางร่วมกันแทนการขับรถคนละคัน", correct: true }
      - { id: c, text: "ช่วยเผยแพร่วิธีแจ้งเหตุไฟป่าและข้อมูลค่าฝุ่นให้คนในชุมชน", correct: true }
      - { id: d, text: "สวมหน้ากากเมื่อออกนอกบ้าน", feedback: "หน้ากากช่วยป้องกันสุขภาพตัวเอง แต่ไม่ได้ลดฝุ่นที่แหล่งกำเนิด" }
      - { id: e, text: "เปิดเครื่องฟอกอากาศในห้องตลอดวัน", feedback: "ลดฝุ่นในห้อง แต่ไม่ลดฝุ่นที่ปล่อยออกสู่ชุมชน" }
    hints:
      - "แยกการป้องกันตัวเองออกจากการลดที่แหล่งกำเนิด"
      - "แหล่งกำเนิดสำคัญคือการเผาและไอเสียรถ"
    solution: "การทำปุ๋ยหมักแทนการเผา ลดการใช้รถส่วนตัว และช่วยให้แจ้งเหตุไฟป่าได้เร็ว ลดฝุ่นที่แหล่งกำเนิด ส่วนหน้ากากและเครื่องฟอกอากาศเป็นการป้องกันตัวเอง ซึ่งจำเป็นเช่นกันแต่คนละประเภท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.environmental-issues.p008
    topics: [biology.ecology.environmental-issues]
    difficulty: 3
    type: numeric
    stem: "จากข้อมูลของ NOAA เหตุการณ์ปะการังฟอกขาวทั่วโลกครั้งที่ 4 (ค.ศ. 2023–2025) ครอบคลุมพื้นที่แนวปะการังราวร้อยละ 84 ส่วนครั้งที่ 1 (ค.ศ. 1998) ราวร้อยละ 21 ครั้งที่ 4 กว้างกว่าครั้งที่ 1 กี่เท่า"
    figure: { src: coral-bleaching.svg, alt: "กราฟแท่ง ร้อยละของพื้นที่แนวปะการังโลกที่เจอความร้อนระดับทำให้ฟอกขาว ครั้งที่ 1 ค.ศ. 1998 ร้อยละ 21 ครั้งที่ 2 ค.ศ. 2010 ร้อยละ 37 ครั้งที่ 3 ค.ศ. 2014–2017 ร้อยละ 68 ครั้งที่ 4 ค.ศ. 2023–2025 ร้อยละ 84" }
    answer: { value: 4, unit: "เท่า" }
    misconceptions:
      - { match: 63, feedback: "63 คือผลต่างเป็นจุดร้อยละ โจทย์ถามว่ากี่เท่า ต้องหาร" }
      - { match: 0.25, feedback: "หารกลับด้าน ต้องเอาครั้งที่ 4 หารด้วยครั้งที่ 1" }
    hints:
      - "กี่เท่า = ค่าหลัง ÷ ค่าแรก"
      - "$84 \\div 21$"
    solution: "$84 \\div 21 = 4$ เท่า พื้นที่ที่เจอน้ำร้อนถึงระดับฟอกขาวขยายกว้างขึ้นมากในราว 25 ปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.environmental-issues.p009
    topics: [biology.ecology.environmental-issues]
    difficulty: 3
    type: mcq
    stem: "คลองแห่งหนึ่งรับน้ำทิ้งจากชุมชนโดยไม่บำบัด ผลตรวจพบค่า BOD สูงมาก และออกซิเจนละลายในน้ำต่ำ ข้อใดอธิบายความสัมพันธ์ได้ถูกต้อง"
    choices:
      - { id: a, text: "สารอินทรีย์ในน้ำทิ้งมาก จุลินทรีย์ย่อยสลายโดยใช้ออกซิเจนมาก ค่า BOD จึงสูงและออกซิเจนในน้ำลดลง", correct: true }
      - { id: b, text: "BOD สูงแปลว่าน้ำมีออกซิเจนมาก น้ำจึงสะอาด", feedback: "BOD คือออกซิเจนที่จุลินทรีย์ต้องใช้ ยิ่งสูงยิ่งแสดงว่ามีสารอินทรีย์มากและน้ำเสีย" }
      - { id: c, text: "น้ำทิ้งทำให้น้ำเย็นลง ออกซิเจนจึงละลายได้น้อย", feedback: "น้ำเย็นละลายออกซิเจนได้มากกว่าน้ำร้อน และสาเหตุหลักคือจุลินทรีย์ใช้ออกซิเจน" }
      - { id: d, text: "ปลาในคลองหายใจมากเกินไปจนออกซิเจนหมด", feedback: "ปลาใช้ออกซิเจนเพียงเล็กน้อยเมื่อเทียบกับจุลินทรีย์ที่ย่อยสารอินทรีย์จำนวนมาก" }
    hints:
      - "BOD ย่อมาจากความต้องการออกซิเจนทางชีวเคมี"
      - "ใครใช้ออกซิเจนเมื่อมีสารอินทรีย์มาก"
    solution: "น้ำทิ้งที่มีสารอินทรีย์มากเป็นอาหารของจุลินทรีย์ จุลินทรีย์หายใจใช้ออกซิเจนมาก BOD จึงสูง ออกซิเจนในน้ำลดลงจนสัตว์น้ำอยู่ไม่ได้ การบำบัดน้ำเสียก่อนปล่อยจึงจำเป็น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.environmental-issues.p010
    topics: [biology.ecology.environmental-issues]
    difficulty: 3
    type: numeric
    stem: "ค่าเฉลี่ยรายปีของ PM2.5 ทั้งประเทศปี พ.ศ. 2567 คือ 24 ไมโครกรัมต่อลูกบาศก์เมตร มาตรฐานรายปีของไทยคือ 15 ค่าที่วัดได้เป็นกี่เท่าของมาตรฐาน"
    figure: { src: pm25-thailand.svg, alt: "กราฟแท่ง ค่าเฉลี่ยรายปีของ PM2.5 ทั้งประเทศ ปี 2566 เท่ากับ 26 และปี 2567 เท่ากับ 24 ไมโครกรัมต่อลูกบาศก์เมตร เส้นประที่ 15 คือมาตรฐานรายปีของไทย เส้นประที่ 5 คือแนวทางขององค์การอนามัยโลกปี 2021" }
    answer: { value: 1.6, unit: "เท่า", tolerance: 0.02 }
    misconceptions:
      - { match: 4.8, feedback: "เทียบกับแนวทางของ WHO (5) โจทย์ถามเทียบกับมาตรฐานของไทย (15)" }
      - { match: 9, feedback: "9 คือผลต่าง โจทย์ถามว่ากี่เท่า ต้องหาร" }
    hints:
      - "กี่เท่า = ค่าที่วัดได้ ÷ มาตรฐาน"
      - "$24 \\div 15$"
    solution: "$24 \\div 15 = 1.6$ เท่า แม้ค่าเฉลี่ยลดลงจากปีก่อน ก็ยังสูงกว่ามาตรฐานรายปีของไทย และสูงกว่าแนวทางของ WHO ถึง 4.8 เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.environmental-issues.p011
    topics: [biology.ecology.environmental-issues]
    difficulty: 3
    type: mcq
    stem: "ปี พ.ศ. 2567 นักสำรวจพบปะการังรอบเกาะตอรินลาฟอกขาวราวร้อยละ 50 ข้อใดอธิบายได้ถูกต้อง"
    choices:
      - { id: a, text: "น้ำทะเลร้อนผิดปกติทำให้ปะการังขับสาหร่ายที่อยู่ร่วมกันออก ปะการังยังมีชีวิต ถ้าน้ำเย็นลงเร็วอาจฟื้นได้ แต่ถ้าร้อนนานจะตาย", correct: true }
      - { id: b, text: "ปะการังที่ฟอกขาวตายทั้งหมดแล้ว", feedback: "ฟอกขาวยังไม่ใช่ตาย ปะการังยังมีชีวิตแต่ขาดอาหารจากสาหร่าย" }
      - { id: c, text: "ปะการังฟอกขาวเพราะน้ำทะเลเย็นลง", feedback: "สาเหตุหลักของการฟอกขาวในวงกว้างคือน้ำทะเลร้อนผิดปกติ" }
      - { id: d, text: "สาหร่ายในปะการังเพิ่มมากเกินไปจนปะการังเป็นสีขาว", feedback: "สีขาวเกิดเพราะสาหร่ายลดลง จึงเห็นโครงหินปูนสีขาว" }
    hints:
      - "สีของปะการังมาจากสาหร่ายที่อยู่ในเนื้อเยื่อ"
      - "ฟอกขาวกับตายต่างกันอย่างไร"
    solution: "น้ำทะเลที่ร้อนผิดปกติทำให้ปะการังขับสาหร่ายที่อาศัยอยู่ด้วยออก จึงเห็นโครงหินปูนสีขาว ปะการังยังไม่ตายทันทีแต่ขาดอาหารหลัก ถ้าน้ำเย็นลงเร็วสาหร่ายอาจกลับมา ถ้าร้อนนานหรือฟอกขาวซ้ำบ่อยจะตาย"
