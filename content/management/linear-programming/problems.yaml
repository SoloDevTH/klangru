  - id: management.operations.linear-programming.p016
    topics: [management.operations.linear-programming]
    difficulty: 5
    type: mcq
    stem: "กลุ่มจักสานในบทเรียนมีราคาเงาของแรงงาน 45 บาทต่อชั่วโมง และของเส้นกก 10 บาทต่อกิโลกรัม มีข้อเสนอสองข้อ (1) จ้างแรงงานเพิ่มชั่วโมงละ 55 บาท (2) ซื้อเส้นกกเพิ่มกิโลกรัมละ 7 บาท โดยราคาเหล่านี้เป็นค่าใช้จ่ายส่วนเพิ่มที่ยังไม่ได้หักในกำไร ควรรับข้อเสนอใด (ถ้าเพิ่มทีละเล็กน้อยในช่วงที่ราคาเงายังใช้ได้)"
    choices:
      - { id: a, text: "รับเฉพาะข้อเสนอ (2) ซื้อเส้นกกเพิ่ม", correct: true }
      - { id: b, text: "รับเฉพาะข้อเสนอ (1) จ้างแรงงานเพิ่ม", feedback: "แรงงานเพิ่มหนึ่งชั่วโมงเพิ่มกำไร 45 บาท แต่จ่าย 55 บาท ขาดทุนชั่วโมงละ 10 บาท" }
      - { id: c, text: "รับทั้งสองข้อ เพราะทรัพยากรทั้งสองตึงอยู่", feedback: "ตึงอยู่แปลว่าเพิ่มแล้วกำไรเพิ่ม แต่ต้องเทียบกับราคาที่ต้องจ่ายด้วย" }
      - { id: d, text: "ไม่รับทั้งสองข้อ", feedback: "เส้นกกเพิ่ม 1 กิโลกรัมเพิ่มกำไร 10 บาทแต่จ่ายแค่ 7 บาท จึงคุ้ม" }
    hints:
      - "ราคาเงาคือกำไรที่เพิ่มต่อหน่วยทรัพยากร"
      - "คุ้มเมื่อราคาเงามากกว่าราคาที่ต้องจ่าย"
    solution: "แรงงาน: ได้ 45 จ่าย 55 ไม่คุ้ม เส้นกก: ได้ 10 จ่าย 7 คุ้ม กิโลกรัมละ 3 บาท แต่เมื่อซื้อเพิ่มมากจนจุดมุมที่ดีที่สุดเปลี่ยนชุดข้อจำกัดที่ตึง ต้องคำนวณราคาเงาใหม่"
