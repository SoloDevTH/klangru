  difficulty: 4
  type: numeric
  stem: ศักย์ไฟฟ้าในบริเวณหนึ่งเป็น $V(x,y) = 4xy + 2x^2$ (หน่วย V เมื่อ $x,y$ เป็นเมตร) จงหาขนาดของสนามไฟฟ้าที่จุด $(1.0\,\mathrm{m},\,2.0\,\mathrm{m})$ จาก $\vec E = -\nabla V$ ตอบเป็น V/m
  hints:
  - หาอนุพันธ์ย่อย $E_x = -\dfrac{\partial V}{\partial x}$ และ $E_y = -\dfrac{\partial V}{\partial y}$ แยกกัน
  - $\dfrac{\partial V}{\partial x} = 4y + 4x$ และ $\dfrac{\partial V}{\partial y} = 4x$
  - ขนาดของสนามคือ $\sqrt{E_x^2 + E_y^2}$
  answer:
    value: 12.65
    tolerance: 0.03
    unit: V/m
  misconceptions:
