<text x="143.3" y="126.0" text-anchor="middle" font-size="12" fill="#15211e">ระยะตอบสนอง vt</text>
<rect x="226.7" y="80.0" width="163.4" height="22.0" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="308.4" y="96.0" text-anchor="middle" font-size="12" fill="#15211e">ระยะเบรก v²/2a</text>
