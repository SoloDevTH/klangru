problems:
  - id: biology.cells.diffusion-osmosis.p001
    topics: [biology.cells.diffusion-osmosis]
    difficulty: 1
    type: mcq
    stem: "การแพร่คือการเคลื่อนที่ของอนุภาคของสารในทิศทางใด"
    choices:
      - { id: a, text: "จากบริเวณที่มีความเข้มข้นสูงไปยังบริเวณที่มีความเข้มข้นต่ำ", correct: true }
      - { id: b, text: "จากบริเวณที่มีความเข้มข้นต่ำไปยังบริเวณที่มีความเข้มข้นสูง", feedback: "กลับทิศ อนุภาคกระจายออกจากที่ที่มีมากไปยังที่ที่มีน้อย" }
      - { id: c, text: "จากที่สูงลงสู่ที่ต่ำตามแรงโน้มถ่วง", feedback: "กลิ่นลอยขึ้นและไปด้านข้างได้ การแพร่ไม่ได้ขึ้นกับที่สูงต่ำ แต่ขึ้นกับความเข้มข้น" }
      - { id: d, text: "ไปทางที่มีคนคนหรือเขย่า", feedback: "การคนช่วยให้เร็วขึ้น แต่การแพร่เกิดเองได้แม้วางนิ่ง ๆ" }
    hints:
      - "นึกถึงกลิ่นไข่เจียวที่ลอยจากครัวไปห้องอื่น"
      - "ในครัวกลิ่นแรง (มาก) ในห้องอื่นกลิ่นอ่อน (น้อย)"
    solution: "การแพร่คือการเคลื่อนที่ของอนุภาคจากบริเวณที่มีความเข้มข้นสูงไปต่ำ จนกระจายเท่ากันทุกที่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.diffusion-osmosis.p002
    topics: [biology.cells.diffusion-osmosis]
    difficulty: 1
    type: text
    stem: "การแพร่ของน้ำผ่านเยื่อเลือกผ่าน เรียกว่าอะไร"
    accepted: ["ออสโมซิส", "osmosis", "การออสโมซิส"]
    hints:
      - "เป็นการแพร่แบบพิเศษที่เกิดกับน้ำ"
      - "ทำให้ผักที่แช่น้ำเกลือเหี่ยว"
    misconceptions:
      - { match: "การแพร่", feedback: "ถูกบางส่วน แต่การแพร่ของน้ำผ่านเยื่อเลือกผ่านมีชื่อเฉพาะ" }
    solution: "ออสโมซิส คือการแพร่ของน้ำผ่านเยื่อเลือกผ่าน จากด้านที่มีน้ำมาก (เจือจาง) ไปด้านที่มีน้ำน้อย (เข้มข้น)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.diffusion-osmosis.p003
    topics: [biology.cells.diffusion-osmosis]
    difficulty: 1
    type: mcq
    stem: "จุ่มชาซองแบบเดียวกันในน้ำร้อนแก้วหนึ่ง และน้ำเย็นอีกแก้วหนึ่ง โดยไม่คน แก้วใดสีชากระจายทั่วแก้วเร็วกว่า"
    choices:
      - { id: a, text: "น้ำร้อน", correct: true }
      - { id: b, text: "น้ำเย็น", feedback: "ในน้ำเย็นอนุภาคเคลื่อนที่ช้ากว่า สีจึงกระจายช้ากว่า" }
      - { id: c, text: "เร็วเท่ากัน", feedback: "อุณหภูมิมีผลต่อความเร็วของการเคลื่อนที่ของอนุภาค" }
    hints:
      - "อุณหภูมิสูงทำให้อนุภาคเคลื่อนที่เร็วขึ้นหรือช้าลง"
      - "อนุภาคเคลื่อนที่เร็ว การแพร่ก็เร็ว"
    solution: "ในน้ำร้อนอนุภาคเคลื่อนที่เร็วกว่า สีชาจึงแพร่ไปทั่วแก้วเร็วกว่าในน้ำเย็น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.diffusion-osmosis.p004
    topics: [biology.cells.diffusion-osmosis]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นตัวอย่างของการแพร่ในชีวิตประจำวัน (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ได้กลิ่นน้ำหอมของเพื่อนที่เดินเข้ามาในห้อง", correct: true }
      - { id: b, text: "สีแดงของน้ำหวานค่อย ๆ กระจายไปทั่วน้ำแข็งใส", correct: true }
      - { id: c, text: "ลูกเหม็นทำให้ทั้งตู้เสื้อผ้ามีกลิ่น", correct: true }
      - { id: d, text: "น้ำในลำธารไหลจากภูเขาลงสู่ที่ราบ", feedback: "น้ำไหลลงเพราะแรงโน้มถ่วง ไม่ใช่การกระจายของอนุภาคจากที่เข้มข้นไปที่เจือจาง" }
      - { id: e, text: "ลมพัดใบไม้ปลิวไปตามถนน", feedback: "ใบไม้ปลิวเพราะลมพัด ไม่ใช่อนุภาคของสารเคลื่อนที่ไปเองตามความเข้มข้น" }
    hints:
      - "หาเหตุการณ์ที่อนุภาคของสารกระจายออกจากที่ที่มีมากไปที่ที่มีน้อย"
      - "สิ่งที่ถูกผลักด้วยลมหรือแรงโน้มถ่วงไม่ใช่การแพร่"
    solution: "กลิ่นน้ำหอม สีน้ำหวาน และกลิ่นลูกเหม็นเป็นการแพร่ของอนุภาคจากบริเวณที่เข้มข้นไปบริเวณที่เจือจาง ส่วนน้ำไหลลงเขาและใบไม้ปลิวเกิดจากแรงโน้มถ่วงและลม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.diffusion-osmosis.p005
    topics: [biology.cells.diffusion-osmosis]
    difficulty: 2
    type: mcq
    stem: "นำใบสาหร่ายหางกระรอกแช่ในน้ำกลั่น น้ำเกลือเข้มข้น และสารละลายที่เข้มข้นเท่ากับในเซลล์ แล้วส่องกล้องจุลทรรศน์ เซลล์ใดในภาพน่าจะมาจากใบที่แช่ในน้ำเกลือเข้มข้น"
    figure: { src: p-three-cells.svg, alt: "เซลล์พืชรูปสี่เหลี่ยม 3 เซลล์ ผนังเซลล์สีเขียวเข้มขนาดเท่ากันทุกเซลล์ เซลล์ ก ไซโทพลาซึมหดเป็นก้อนกลมเล็กอยู่กลางเซลล์ แยกห่างจากผนังเซลล์ เซลล์ ข ไซโทพลาซึมเกือบเต็มผนังเซลล์ มีแวคิวโอลขนาดกลาง เซลล์ ค ไซโทพลาซึมแนบชิดผนังเซลล์ทุกด้าน แวคิวโอลใหญ่เต็มเซลล์" }
    choices:
      - { id: a, text: "เซลล์ ก", correct: true }
      - { id: b, text: "เซลล์ ข", feedback: "เซลล์ ข ยังเกือบเต็มผนังเซลล์ น้ำเข้าออกพอ ๆ กัน น่าจะมาจากสารละลายที่เข้มข้นเท่ากับในเซลล์" }
      - { id: c, text: "เซลล์ ค", feedback: "เซลล์ ค เต่งเต็มผนัง แสดงว่าน้ำเข้าเซลล์ น่าจะมาจากน้ำกลั่น" }
    hints:
      - "ในน้ำเกลือเข้มข้น น้ำเคลื่อนเข้าหรือออกจากเซลล์"
      - "เซลล์ที่เสียน้ำ ส่วนใดหด ส่วนใดคงรูป"
    solution: "น้ำเกลือเข้มข้นกว่าในเซลล์ น้ำจึงออสโมซิสออกจากเซลล์ ไซโทพลาซึมหดเป็นก้อนแยกจากผนังเซลล์ที่คงรูปอยู่ คือเซลล์ ก ส่วนเซลล์ ค มาจากน้ำกลั่น และเซลล์ ข มาจากสารละลายที่เข้มข้นเท่ากับในเซลล์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.diffusion-osmosis.p006
    topics: [biology.cells.diffusion-osmosis]
    difficulty: 2
    type: match
    stem: "จับคู่สถานการณ์กับสิ่งที่เกิดขึ้นกับเซลล์"
    pairs:
      - { left: "แม่ค้าพรมน้ำบนผักกาด", right: "น้ำเข้าเซลล์ เซลล์เต่ง ผักกรอบ" }
      - { left: "คลุกแตงกวากับเกลือทำผักดอง", right: "น้ำออกจากเซลล์ แตงกวานิ่มและมีน้ำซึมออกมา" }
      - { left: "หยดเลือดลงในน้ำกลั่น", right: "เซลล์เม็ดเลือดแดงบวมจนแตก" }
      - { left: "แช่เซลล์ในสารละลายที่เข้มข้นเท่ากับในเซลล์", right: "น้ำเข้าและออกเท่ากัน เซลล์คงรูป" }
    hints:
      - "ถามตัวเองว่า ด้านไหนเข้มข้นกว่า น้ำไปทางนั้น"
      - "เซลล์เม็ดเลือดแดงไม่มีผนังเซลล์คอยต้าน"
    solution: "น้ำเปล่าเจือจางกว่าในเซลล์ น้ำจึงเข้าเซลล์ ผักเต่ง ส่วนเซลล์เม็ดเลือดแดงบวมจนแตก เกลือทำให้นอกเซลล์เข้มข้นกว่า น้ำจึงออกจากเซลล์ และถ้าความเข้มข้นเท่ากัน น้ำเข้าออกเท่ากัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.diffusion-osmosis.p007
    topics: [biology.cells.diffusion-osmosis]
    difficulty: 2
    type: numeric
    stem: "แท่งมันฝรั่งหนัก 4.0 กรัม แช่ในน้ำกลั่น 30 นาที แล้วหนัก 4.4 กรัม มวลเพิ่มขึ้นร้อยละเท่าไร"
    answer: { value: 10, tolerance: 0.1, unit: "%" }
    hints:
      - "หามวลที่เพิ่มขึ้นก่อน"
      - "นำมวลที่เพิ่มหารด้วยมวลก่อนแช่ แล้วคูณ 100"
    misconceptions:
      - { match: 9.09, feedback: "หารด้วยมวลหลังแช่ ต้องหารด้วยมวลก่อนแช่ (4.0 กรัม)" }
      - { match: 0.4, feedback: "นี่คือมวลที่เพิ่มขึ้นเป็นกรัม ต้องเปลี่ยนเป็นร้อยละของมวลก่อนแช่" }
    solution: "มวลเพิ่ม $4.4 - 4.0 = 0.4$ กรัม ร้อยละ $= \\frac{0.4}{4.0} \\times 100 = 10\\%$ น้ำกลั่นเจือจางกว่าในเซลล์ น้ำจึงออสโมซิสเข้าเซลล์มันฝรั่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.diffusion-osmosis.p008
    topics: [biology.cells.diffusion-osmosis]
    difficulty: 3
    type: mcq
    stem: "ใส่น้ำเชื่อมเข้มข้นในถุงเซลโลเฟน ต่อปากถุงกับหลอดแก้ว แล้วจุ่มลงในบีกเกอร์น้ำเปล่า ผ่านไป 30 นาทีจะเห็นอะไร"
    choices:
      - { id: a, text: "ระดับของเหลวในหลอดแก้วสูงขึ้น และน้ำในบีกเกอร์ไม่มีรสหวาน", correct: true }
      - { id: b, text: "ระดับของเหลวในหลอดแก้วลดลง เพราะน้ำเชื่อมไหลออกจากถุง", feedback: "น้ำตาลมีอนุภาคใหญ่ ผ่านถุงเซลโลเฟนได้ยาก ส่วนน้ำเคลื่อนเข้าถุงที่เข้มข้นกว่า" }
      - { id: c, text: "ระดับเท่าเดิม แต่น้ำในบีกเกอร์มีรสหวาน", feedback: "ถุงเซลโลเฟนเป็นเยื่อเลือกผ่าน น้ำตาลไม่ผ่านออกมา แต่น้ำผ่านเข้าไปได้" }
      - { id: d, text: "ไม่มีอะไรเปลี่ยน เพราะถุงมัดปากไว้", feedback: "น้ำผ่านเนื้อถุงได้ ไม่ต้องผ่านทางปากถุง" }
    hints:
      - "ด้านในถุงกับด้านนอกถุง ด้านใดเข้มข้นกว่า"
      - "อนุภาคใดผ่านถุงเซลโลเฟนได้ อนุภาคใดผ่านไม่ได้"
    solution: "ในถุงเข้มข้นกว่า น้ำจึงออสโมซิสจากบีกเกอร์เข้าถุง ของเหลวในหลอดแก้วถูกดันสูงขึ้น น้ำตาลมีอนุภาคใหญ่ผ่านเยื่อเลือกผ่านไม่ได้ น้ำในบีกเกอร์จึงไม่หวาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.diffusion-osmosis.p009
    topics: [biology.cells.diffusion-osmosis]
    difficulty: 3
    type: mcq
    stem: "ลุงใส่ปุ๋ยเคมีรอบโคนต้นพริกมากเกินไป วันรุ่งขึ้นต้นพริกเหี่ยวทั้งที่ดินยังชื้น ข้อใดอธิบายได้ดีที่สุด"
    choices:
      - { id: a, text: "น้ำในดินเข้มข้นกว่าในเซลล์ราก น้ำจึงออสโมซิสออกจากราก รากดูดน้ำไม่ได้", correct: true }
      - { id: b, text: "ปุ๋ยแพร่เข้ารากมากเกินไปจนรากอุดตัน", feedback: "ปัญหาหลักคือทิศของน้ำ ไม่ใช่ปุ๋ยอุดราก" }
      - { id: c, text: "ดินชื้นเกินไปจนรากเน่า", feedback: "รากเน่าใช้เวลานานกว่าหนึ่งวัน และเรื่องนี้เกิดหลังใส่ปุ๋ยมาก" }
      - { id: d, text: "ต้นพริกได้อาหารมากเกินไปจึงไม่ต้องการน้ำ", feedback: "ต้นพริกยังต้องการน้ำเสมอ แต่ดึงน้ำเข้ารากไม่ได้" }
    hints:
      - "ปุ๋ยละลายน้ำแล้ว ทำให้น้ำในดินเจือจางลงหรือเข้มข้นขึ้น"
      - "น้ำเคลื่อนไปหาด้านที่เข้มข้นกว่า"
    solution: "ปุ๋ยที่ละลายมากทำให้น้ำในดินเข้มข้นกว่าสารละลายในเซลล์ราก น้ำจึงออสโมซิสออกจากราก ต้นพริกขาดน้ำและเหี่ยว ควรใส่ปุ๋ยตามปริมาณที่ฉลากแนะนำแล้วรดน้ำตาม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.diffusion-osmosis.p010
    topics: [biology.cells.diffusion-osmosis]
    difficulty: 3
    type: order
    stem: "จุ่มชาซองแบบเดียวกันในน้ำ 4 แก้ว ปริมาตรเท่ากัน โดยไม่คน เรียงแก้วที่สีชากระจายทั่วแก้วเร็วที่สุดไปช้าที่สุด"
    items:
      - "น้ำอุณหภูมิ 80 °C"
      - "น้ำอุณหภูมิ 50 °C"
      - "น้ำอุณหภูมิ 25 °C"
      - "น้ำอุณหภูมิ 5 °C"
    hints:
      - "อุณหภูมิมีผลต่อการเคลื่อนที่ของอนุภาคอย่างไร"
      - "ยิ่งร้อน อนุภาคยิ่งเคลื่อนที่เร็ว"
    solution: "อุณหภูมิสูงทำให้อนุภาคเคลื่อนที่เร็ว การแพร่จึงเร็วตามลำดับ 80 °C → 50 °C → 25 °C → 5 °C"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.diffusion-osmosis.p011
    topics: [biology.cells.diffusion-osmosis]
    difficulty: 3
    type: numeric
    stem: "แท่งมันฝรั่งหนัก 6.25 กรัม แช่ในน้ำเกลือเข้มข้นแล้วหนัก 5.75 กรัม มวลเปลี่ยนไปร้อยละเท่าไร (ถ้ามวลลดลงให้ตอบเป็นค่าลบ)"
    answer: { value: -8, tolerance: 0.1, unit: "%" }
    hints:
      - "มวลที่เปลี่ยน = มวลหลังแช่ − มวลก่อนแช่"
      - "หารด้วยมวลก่อนแช่ แล้วคูณ 100"
    misconceptions:
      - { match: 8, feedback: "มวลลดลง ต้องตอบเป็นค่าลบ" }
      - { match: -8.7, feedback: "หารด้วยมวลหลังแช่ ต้องหารด้วยมวลก่อนแช่ (6.25 กรัม)" }
