      - { match: 40, feedback: "จำนวนเซลล์ไม่เท่าเดิม เพราะเมื่อขยายมากขึ้นเราเห็นพื้นที่แคบลง" }
    solution: "กำลังขยายเพิ่ม $\\frac{400}{100} = 4$ เท่า เส้นผ่านศูนย์กลางของวงกลมที่มองเห็นแคบลง 4 เท่า เห็นเซลล์ $\\frac{40}{4} = 10$ เซลล์"
