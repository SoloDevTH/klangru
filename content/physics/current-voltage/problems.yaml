    solution: "จาก $I = \\dfrac{V}{R}$ เมื่อ $V$ เท่ากัน วัสดุที่ความต้านทานน้อยที่สุดให้กระแสมากที่สุด ทองแดงเป็นตัวนำที่ดี ส่วนยาง แก้ว และพลาสติกเป็นฉนวน"
