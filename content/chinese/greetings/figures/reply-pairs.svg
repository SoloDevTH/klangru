<text x="340.0" y="412.0" font-size="15" text-anchor="middle" fill="#666" font-weight="normal">ขอบคุณ ตอบ 不客气 · ขอโทษ ตอบ 没关系 (ภาษาไทยใช้ ไม่เป็นไร ทั้งสองกรณี)</text>
