      - { id: c, text: "นิวคลีโอลัสเป็นที่เก็บ DNA ทั้งหมดของเซลล์", feedback: "DNA อยู่ในโครมาทินทั่วนิวเคลียส นิวคลีโอลัสเป็นบริเวณที่สร้าง RNA ของไรโบโซม" }
