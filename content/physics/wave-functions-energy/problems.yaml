- id: physics.waves.wave-functions-energy.p017
  topics:
  - physics.waves.wave-functions-energy
  difficulty: 2
  type: code
  stem: เขียนฟังก์ชัน `wave_y(A, k, w, x, t)` ที่คืนค่าการกระจัด $y = A\sin(kx - \omega t)$ ของคลื่นไซน์ ตามพารามิเตอร์ที่รับเข้ามา ใช้ไลบรารี `math` ได้
  hints:
  - ฟังก์ชัน `math.sin` รับอาร์กิวเมนต์เป็นเรเดียน
  - อาร์กิวเมนต์ของไซน์คือ `k * x - w * t` ต้องมีเครื่องหมายลบหน้า `w * t`
  - คืนค่าด้วย `return` ไม่ใช่ `print`
  language: python
  starter: |
    import math

    def wave_y(A, k, w, x, t):
        pass
  tests: |
    import math
    r = wave_y(0.02, 4 * math.pi, 100 * math.pi, 0.0, 0.0)
    assert r is not None, "ยังไม่ได้คืนค่า (ได้ None) ต้องใช้ return ไม่ใช่ print"
    assert abs(r) < 1e-12, f"wave_y(0.02, 4pi, 100pi, 0, 0) ควรได้ 0 แต่ได้ {r}"
    r2 = wave_y(0.02, 4 * math.pi, 100 * math.pi, 0.125, 0.0)
    assert abs(r2 - 0.02) < 1e-9, f"wave_y ที่ x = 0.125 m และ t = 0 ควรได้ 0.02 แต่ได้ {r2} (ตรวจว่าใช้ sin ของ kx จริงหรือไม่)"
    r3 = wave_y(0.02, 4 * math.pi, 100 * math.pi, 0.0, 0.005)
    assert abs(r3 + 0.02) < 1e-9, f"wave_y ที่ x = 0 และ t = 0.005 s ควรได้ -0.02 แต่ได้ {r3} (ตรวจเครื่องหมายหน้า w * t)"
  reference: |
    import math

    def wave_y(A, k, w, x, t):
        return A * math.sin(k * x - w * t)
  solution: ฟังก์ชันคืน `A * math.sin(k * x - w * t)` ตัวอย่าง wave_y(0.02, 4*math.pi, 100*math.pi, 0.0, 0.0) = 0
