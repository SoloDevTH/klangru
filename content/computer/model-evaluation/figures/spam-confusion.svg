<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="sans-serif" font-size="15">
<title>เมทริกซ์ความสับสนของตัวกรองสแปมสมมติ</title>
<rect x="0" y="0" width="640" height="330" fill="#ffffff"/>
<text x="370" y="66" text-anchor="middle" fill="#111827" font-weight="bold">ผลจริง</text>
<text x="285.0" y="94" text-anchor="middle" fill="#374151">เป็นสแปม</text>
<text x="455.0" y="94" text-anchor="middle" fill="#374151">ไม่ใช่สแปม</text>
<text x="184" y="157.5" text-anchor="end" fill="#374151" transform="rotate(-90 184 157.5)"></text>
<text x="184" y="163.5" text-anchor="end" fill="#374151">ตัวกรองทาย</text>
<text x="184" y="183.5" text-anchor="end" fill="#374151">"สแปม"</text>
<text x="184" y="258.5" text-anchor="end" fill="#374151">ทาย</text>
<text x="184" y="278.5" text-anchor="end" fill="#374151">"ไม่ใช่"</text>
<rect x="204" y="114" width="162" height="87" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="285.0" y="151.5" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">TP = 8</text>
<text x="285.0" y="173.5" text-anchor="middle" font-size="13" fill="#374151">ทายสแปม ถูกเป็นสแปม</text>
<rect x="374" y="114" width="162" height="87" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="455.0" y="151.5" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">FP = 2</text>
<text x="455.0" y="173.5" text-anchor="middle" font-size="13" fill="#374151">ทายสแปม แต่เป็นเมลปกติ</text>
<rect x="204" y="209" width="162" height="87" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="285.0" y="246.5" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">FN = 4</text>
<text x="285.0" y="268.5" text-anchor="middle" font-size="13" fill="#374151">ทายไม่ใช่ แต่เป็นสแปม</text>
<rect x="374" y="209" width="162" height="87" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="455.0" y="246.5" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">TN = 6</text>
<text x="455.0" y="268.5" text-anchor="middle" font-size="13" fill="#374151">ทายไม่ใช่ ถูกเป็นเมลปกติ</text>
<text x="320.0" y="316" text-anchor="middle" fill="#475569" font-size="13">ตัวเลขเป็นผลสมมติสำหรับ 20 ฉบับ (ข้อมูลสมมติ)</text>
</svg>
