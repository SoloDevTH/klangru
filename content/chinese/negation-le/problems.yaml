problems:
- id: chinese.grammar.negation-le.p001
  topics:
  - chinese.grammar.negation-le
  difficulty: 1
  type: mcq
  stem: 我不喝咖啡。 (Wǒ bù hē kāfēi.) แปลว่าอะไร
  choices:
  - id: a
    text: อย่าดื่มกาแฟ
    feedback: ห้ามใช้ 别
  - id: b
    text: ฉันยังไม่ได้ดื่มกาแฟ
    feedback: ยังไม่ได้ ใช้ 还没
  - id: c
    text: ฉันไม่ดื่มกาแฟ (เป็นปกติ)
    correct: true
    feedback: ถูก 不 บอกนิสัยหรือความตั้งใจ ฉันไม่ดื่มกาแฟเลย
  - id: d
    text: ฉันดื่มกาแฟแล้ว
    feedback: ประโยคนี้มี 不 จึงเป็นปฏิเสธ
  hints:
  - 喝 = ดื่ม 咖啡 = กาแฟ
  - 不 bù = ไม่ ใช้กับนิสัย ความตั้งใจ และอนาคต
  solution: '**ฉันไม่ดื่มกาแฟ** 不 บอกว่าโดยปกติไม่ทำ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.negation-le.p002
  topics:
  - chinese.grammar.negation-le
  difficulty: 1
  type: match
  stem: จับคู่ภาษาจีนกับความหมาย
  pairs:
  - left: 不去
    right: ไม่ไป (ไม่ตั้งใจจะไป)
  - left: 没去
    right: ไม่ได้ไป (ที่ผ่านมา)
  - left: 别去
    right: อย่าไป
  - left: 去了
    right: ไปแล้ว
  hints:
  - 不 = ไม่ (ปกติ อนาคต) 没 = ไม่ได้ (ไม่ได้เกิดขึ้น)
  - 别 = อย่า 了 หลังกริยา = ทำแล้ว
  solution: 不去 ไม่ไป · 没去 ไม่ได้ไป · 别去 อย่าไป · 去了 ไปแล้ว
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.negation-le.p003
  topics:
  - chinese.grammar.negation-le
  difficulty: 2
  type: hanzi
  stem: เขียนอักษร 没 (méi) ที่ใช้ปฏิเสธว่า ไม่ได้ ไม่มี ตามลำดับขีด
  character: 没
  pinyin: méi
  meaning: ไม่ได้ ไม่มี
  hints:
  - 没 = 氵 (น้ำ 3 ขีด) ทางซ้าย + ส่วนขวา 4 ขีด รวม 7 ขีด
  - เขียน 氵 ก่อน (点 点 提) แล้วจึงเขียนส่วนขวาจากบนลงล่าง
  solution: 点 → 点 → 提 → 撇 → 横折弯 → 横撇 → 捺 รวม 7 ขีด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.negation-le.p004
  topics:
  - chinese.grammar.negation-le
  difficulty: 2
  type: mcq
  stem: '"ฉันไม่มีพี่สาว" ประโยคใดถูกต้อง (姐姐 jiějie = พี่สาว)'
  choices:
  - id: a
    text: 我有没姐姐。
    feedback: 'คำปฏิเสธอยู่หน้ากริยา: 没有'
  - id: b
    text: 我没有姐姐。
    correct: true
    feedback: ถูก ปฏิเสธ 有 ต้องใช้ 没有
  - id: c
    text: 我不有姐姐。
    feedback: 有 ปฏิเสธด้วย 不 ไม่ได้
  - id: d
    text: 我没姐姐有。
    feedback: '没 ต้องติดกับ 有: 没有'
  hints:
  - กริยาในประโยคคือ 有 (มี)
  - 有 มีรูปปฏิเสธเพียงแบบเดียว
  solution: '**我没有姐姐。** Wǒ méiyǒu jiějie. (ภาษาพูดใช้ 我没姐姐 ก็ได้ แต่ไม่ใช้ 不有)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.negation-le.p005
  topics:
  - chinese.grammar.negation-le
  difficulty: 2
  type: mcq
  stem: 不 ใน 不去 (ไม่ไป) ออกเสียงอย่างไร (去 = qù เสียง 4)
  choices:
  - id: a
    text: bǔ qù
    feedback: 不 ไม่เปลี่ยนเป็นเสียง 3
  - id: b
    text: bū qù
    feedback: 不 ไม่ออกเสียง 1
  - id: c
    text: bú qù
    correct: true
    feedback: ถูก 不 หน้าเสียง 4 เปลี่ยนเป็นเสียง 2
  - id: d
    text: bù qù
    feedback: 不 หน้าเสียง 4 ไม่ออกเสียง 4 แต่เปลี่ยนเป็นเสียง 2
  hints:
  - 不 ปกติเป็นเสียง 4 (bù)
  - เสียง 4 ติดกันสองพยางค์ 不 จะเปลี่ยนเสียง
  solution: '**bú qù** (เช่นเดียวกับ 不是 bú shì 不要 bú yào) ส่วน 不喝 bù hē 不来 bù lái 不好 bù hǎo ยังเป็นเสียง 4'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.negation-le.p006
  topics:
  - chinese.grammar.negation-le
  difficulty: 2
  type: order
  stem: เรียงคำเป็นประโยค "เมื่อวานฉันไม่ได้ไปโรงเรียน"
  items:
  - 我
  - 昨天
  - 没
  - 去
  - 学校
  hints:
  - เมื่อวาน (昨天) วางหลังประธาน หน้ากริยา
  - เรื่องที่ไม่ได้เกิดขึ้นในอดีตใช้ 没 หน้ากริยา
  solution: '**我昨天没去学校。** Wǒ zuótiān méi qù xuéxiào.'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.negation-le.p007
  topics:
  - chinese.grammar.negation-le
  difficulty: 3
  type: mcq
  stem: '"ฉันยังไม่ได้กินข้าว" ประโยคใดถูกต้อง'
  choices:
  - id: a
    text: 我还没吃饭呢。
    correct: true
    feedback: ถูก 还没…呢 = ยังไม่ได้… (แต่อาจจะทำ)
  - id: b
    text: 我没吃饭了。
    feedback: ปฏิเสธด้วย 没 แล้วต้องตัด 了 ออก
  - id: c
    text: 我不吃饭了。
    feedback: 不…了 แปลว่า ไม่กินแล้ว (เปลี่ยนใจ) ไม่ใช่ ยังไม่ได้กิน
  - id: d
    text: 我还不吃饭呢。
    feedback: ยังไม่ได้ทำ ใช้ 还没 ไม่ใช่ 还不
  hints:
  - ยังไม่ได้ = ยัง (还) + ไม่ได้ (没)
  - ประโยคที่มี 没 ไม่ใช้ 了 ร่วมด้วย
  solution: '**我还没吃饭呢。** Wǒ hái méi chīfàn ne. (呢 ท้ายประโยคละได้)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.negation-le.p008
  topics:
  - chinese.grammar.negation-le
  difficulty: 3
  type: mcq
  stem: ระหว่างเดินเที่ยว เพื่อนชาวจีนมองฟ้าแล้วพูดว่า 下雨了！ (xià yǔ le) หมายความว่าอะไร
  choices:
  - id: a
    text: อย่าให้ฝนตก
    feedback: ไม่มี 别 ในประโยค
  - id: b
    text: ฝนตกแล้ว (เพิ่งเริ่มตก)
    correct: true
    feedback: ถูก 了 ท้ายประโยคบอกการเปลี่ยนสภาพ ก่อนหน้านี้ไม่ตก ตอนนี้ตก
  - id: c
    text: ฝนหยุดตกแล้ว
    feedback: ฝนหยุดใช้ 雨停了 (停 tíng = หยุด)
  - id: d
    text: ฝนจะไม่ตก
    feedback: ไม่มีคำปฏิเสธในประโยค
  hints:
  - 下雨 = ฝนตก
  - 了 ท้ายประโยคบอกว่าสถานการณ์ต่างจากเมื่อก่อน
  solution: '**ฝนตกแล้ว** 了 ท้ายประโยคบอกสภาพใหม่ เหมือน แล้ว ในภาษาไทย'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.negation-le.p009
  topics:
  - chinese.grammar.negation-le
  difficulty: 3
  type: mcq
  stem: ในวัดแห่งหนึ่งในอยุธยา ไกด์ต้องการบอกนักท่องเที่ยวชาวจีนว่า "อย่าพูดเสียงดัง" ควรพูดว่าอะไร (大声说话 dàshēng shuōhuà = พูดเสียงดัง)
  choices:
  - id: a
    text: 大声说话别。
    feedback: 别 ต้องอยู่หน้ากริยา
  - id: b
    text: 不大声说话了。
    feedback: 不…了 = ไม่…แล้ว เป็นการบอกเล่า ไม่ใช่คำห้าม
  - id: c
    text: 别大声说话。
    correct: true
    feedback: ถูก 别 + กริยา = อย่า…
  - id: d
    text: 没大声说话。
    feedback: 没 บอกว่าไม่ได้ทำ ไม่ใช่การห้าม
  hints:
  - คำห้ามในภาษาไทยใช้ อย่า
  - ภาษาจีนใช้ 别 bié หรือ 不要 วางหน้ากริยา
  solution: '**别大声说话。** Bié dàshēng shuōhuà. (สุภาพขึ้นด้วย 请 qǐng: 请别大声说话)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.negation-le.p010
  topics:
  - chinese.grammar.negation-le
  difficulty: 3
  type: mcq
  stem: 'เติมคำในช่องว่าง: 明天我＿＿去学校，昨天我也＿＿去。 (พรุ่งนี้ฉันจะไม่ไปโรงเรียน เมื่อวานฉันก็ไม่ได้ไป)'
  choices:
  - id: a
    text: 没 · 不
    feedback: สลับกัน พรุ่งนี้ยังไม่เกิด ใช้ 不
  - id: b
    text: 不 · 不
    feedback: เมื่อวานเป็นเรื่องที่ไม่ได้เกิดขึ้น ใช้ 没
  - id: c
    text: 没 · 没
    feedback: พรุ่งนี้เป็นความตั้งใจในอนาคต ใช้ 不
  - id: d
    text: 不 · 没
    correct: true
    feedback: ถูก อนาคต (พรุ่งนี้) ใช้ 不 เรื่องที่ไม่ได้เกิดเมื่อวานใช้ 没
  hints:
  - ดูคำบอกเวลา 明天 กับ 昨天
  - อนาคต ความตั้งใจ ใช้ 不 · สิ่งที่ไม่ได้เกิดขึ้นแล้ว ใช้ 没
  solution: 明天我**不**去学校，昨天我也**没**去。
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.negation-le.p011
  topics:
  - chinese.grammar.negation-le
  difficulty: 3
  type: text
  stem: เปลี่ยน 我去了曼谷。 (ฉันไปกรุงเทพฯ แล้ว) ให้เป็นประโยคปฏิเสธ "ฉันไม่ได้ไปกรุงเทพฯ" (พิมพ์อักษรจีน)
  accepted:
  - 我没去曼谷
  - 我没去曼谷。
  - 我没去曼谷.
  - 我没去曼谷？
  - 我没去曼谷?
  - 我没有去曼谷
  - 我没有去曼谷。
  - 我没有去曼谷.
  - 我没有去曼谷？
  - 我没有去曼谷?
  - 我沒去曼谷
  - 我沒去曼谷。
  - 我沒去曼谷.
  - 我沒去曼谷？
  - 我沒去曼谷?
  - 我沒有去曼谷
  - 我沒有去曼谷。
  - 我沒有去曼谷.
  - 我沒有去曼谷？
  - 我沒有去曼谷?
  misconceptions:
  - match: 我没去了曼谷
    feedback: ปฏิเสธด้วย 没 แล้วต้องตัด 了 ออก
  - match: 我没去了曼谷。
    feedback: ปฏิเสธด้วย 没 แล้วต้องตัด 了 ออก
  - match: 我没去了曼谷？
    feedback: ปฏิเสธด้วย 没 แล้วต้องตัด 了 ออก
  - match: 我不去曼谷
    feedback: 不 แปลว่า ไม่ไป (ไม่ตั้งใจจะไป) ไม่ใช่ ไม่ได้ไป
  - match: 我不去曼谷。
    feedback: 不 แปลว่า ไม่ไป (ไม่ตั้งใจจะไป) ไม่ใช่ ไม่ได้ไป
  - match: 我不去曼谷？
    feedback: 不 แปลว่า ไม่ไป (ไม่ตั้งใจจะไป) ไม่ใช่ ไม่ได้ไป
  - match: 我没去曼谷了
    feedback: ตัด 了 ออกเมื่อใช้ 没
  - match: 我没去曼谷了。
    feedback: ตัด 了 ออกเมื่อใช้ 没
  - match: 我没去曼谷了？
    feedback: ตัด 了 ออกเมื่อใช้ 没
  hints:
  - เรื่องที่ไม่ได้เกิดขึ้นใช้ 没 (หรือ 没有) หน้ากริยา
  - ประโยคปฏิเสธด้วย 没 ไม่มี 了
  solution: '**我没去曼谷。** Wǒ méi qù Màngǔ. (หรือ 我没有去曼谷) ตัด 了 ออก'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.negation-le.p012
  topics:
  - chinese.grammar.negation-le
  difficulty: 4
  type: mcq
  stem: 他二十岁了。 (Tā èrshí suì le.) หมายความว่าอะไร
  choices:
  - id: a
    text: เขาจะอายุ 20 ปีปีหน้า
    feedback: ประโยคไม่มีคำบอกอนาคต
  - id: b
    text: ตอนนี้เขาอายุ 20 ปีแล้ว
    correct: true
    feedback: ถูก 了 ท้ายประโยคบอกสภาพใหม่ที่เพิ่งเปลี่ยน
  - id: c
    text: เขาอายุ 20 ปีเมื่อนานมาแล้ว
    feedback: 了 ไม่ได้หมายถึงอดีตที่ผ่านไปนาน แต่บอกว่าตอนนี้เป็นแบบนี้แล้ว
  - id: d
    text: เขายังไม่ถึง 20 ปี
    feedback: ไม่มีคำปฏิเสธ
  hints:
  - 了 ในตำแหน่งนี้อยู่ท้ายประโยค ไม่ได้อยู่หลังกริยาที่เป็นการกระทำ
  - เทียบกับภาษาไทย อายุ 20 แล้ว
  solution: '**ตอนนี้เขาอายุ 20 ปีแล้ว** 了 ท้ายประโยคบอกการเปลี่ยนแปลง (เพิ่งถึง 20 ปี)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.negation-le.p013
  topics:
  - chinese.grammar.negation-le
  difficulty: 4
  type: match
  stem: จับคู่ประโยคกับความหมาย
  pairs:
  - left: 我吃了。
    right: ฉันกินแล้ว
  - left: 我不吃了。
    right: ฉันไม่กินแล้ว (เปลี่ยนใจ หรืออิ่ม)
  - left: 我没吃。
    right: ฉันไม่ได้กิน
  - left: 我还没吃呢。
    right: ฉันยังไม่ได้กิน
  - left: 别吃！
    right: อย่ากิน
  hints:
  - 不…了 = ไม่…แล้ว (เปลี่ยนจากเดิม)
  - 还没…呢 = ยังไม่ได้…
  solution: 我吃了 กินแล้ว · 我不吃了 ไม่กินแล้ว · 我没吃 ไม่ได้กิน · 我还没吃呢 ยังไม่ได้กิน · 别吃 อย่ากิน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.negation-le.p014
  topics:
  - chinese.grammar.negation-le
  difficulty: 4
  type: mcq
  stem: เพื่อนชาวจีนนัดกันไปตลาดนัดจตุจักร แต่ฝนตกหนัก เพื่อนพิมพ์มาว่า "ฝนตกแล้ว ฉันไม่ไปแล้ว" ข้อความใดถูกต้อง
  choices:
  - id: a
    text: 下雨了，我没去了。
    feedback: 没 ใช้กับเรื่องที่ไม่ได้เกิด และไม่ใช้คู่กับ 了
  - id: b
    text: 下雨，我不去。
    feedback: ขาด 了 จึงไม่ได้บอกว่าสถานการณ์เพิ่งเปลี่ยน
  - id: c
    text: 下雨了，我别去了。
    feedback: 别 ใช้ห้ามผู้อื่น ไม่ใช้บอกการตัดสินใจของตัวเอง
  - id: d
    text: 下雨了，我不去了。
    correct: true
    feedback: ถูก 下雨了 = ฝนตกแล้ว (สภาพใหม่) 不去了 = ไม่ไปแล้ว (เปลี่ยนใจ)
  hints:
  - 'สองส่วนบอกการเปลี่ยนแปลงทั้งคู่: ฝนเริ่มตก และเปลี่ยนใจ'
  - ไม่…แล้ว = 不…了
  solution: '**下雨了，我不去了。** Xià yǔ le, wǒ bú qù le.'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.negation-le.p015
  topics:
  - chinese.grammar.negation-le
  difficulty: 4
  type: mcq
  stem: 我吃了三个包子。 กับ 我饿了。 ใช้ 了 ต่างกันอย่างไร (包子 bāozi = ซาลาเปา, 饿 è = หิว)
  choices:
  - id: a
    text: ประโยคแรก 了 หลังกริยา บอกว่าการกระทำเสร็จ ประโยคที่สอง 了 ท้ายประโยค บอกสภาพที่เปลี่ยน (ตอนนี้หิวแล้ว)
    correct: true
    feedback: ถูก 了 มีสองตำแหน่งและสองหน้าที่หลัก
  - id: b
