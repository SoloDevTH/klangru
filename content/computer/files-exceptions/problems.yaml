    type: numeric
    stem: |
      รายการคะแนนในไฟล์มี 6 บรรทัดข้อมูล ในนั้นมี 2 บรรทัดที่คะแนนไม่ใช่ตัวเลข ถ้าโปรแกรมข้ามบรรทัดที่ผิดด้วยการจับ `ValueError` แล้วนับบรรทัดที่เหลือ จะได้จำนวนที่นับได้เท่ากับเท่าไร (ตอบเป็นจำนวนเต็ม)
    answer: { value: 4, unit: บรรทัด }
    hints:
