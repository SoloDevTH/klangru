topic: computer.data.databases
rows:
  - { framework: csta-k12-cs, indicators: ["3A-DA-10"], coverage: full, note: "ชั่งการจัดข้อมูล (ตารางเดียวที่ซ้ำซ้อนกับการแยกตารางที่ต้อง JOIN) และที่เก็บข้อมูล (ในเครื่องกับคลาวด์: อินเทอร์เน็ต การสำรอง ค่าบริการ ความเป็นส่วนตัว) พร้อมกรณีร้านสหกรณ์บนดอย" }
  - { framework: acm-cs2023, indicators: ["DM-Core"], coverage: full, note: "จุดประสงค์ของ DBMS การแยกข้อมูลออกจากโปรแกรม การใช้ร่วมกัน ธุรกรรมที่สำเร็จทั้งหมดหรือไม่เกิดเลย และข้อมูลมีโครงสร้างกับไม่มีโครงสร้าง" }
  - { framework: acm-cs2023, indicators: ["DM-Modeling", "DM-Relational"], coverage: full, note: "หาสิ่งและเหตุการณ์ที่ข้อมูลพูดถึง แยกเป็นตาราง ความสัมพันธ์หนึ่งต่อหลายและหลายต่อหลายผ่านตารางกลาง คีย์หลัก คีย์นอก และความถูกต้องของการอ้างอิง (ตรวจด้วย SQLite) สอนการลดข้อมูลซ้ำแบบไม่เป็นทางการ ยังไม่ใช้ชื่อรูปแบบบรรทัดฐาน (normal form)" }
  - { framework: acm-cs2023, indicators: ["DM-Security"], coverage: full, note: "ความต่างของความปลอดภัยกับความเป็นส่วนตัว การป้องกันการแทรกคำสั่ง SQL สิทธิ์เท่าที่จำเป็น และการคุ้มครองข้อมูลบัญชีผู้ใช้ด้วยการเก็บรหัสผ่านเป็นค่าแฮชที่ช้าพร้อมซอลต์ (ระดับแนวคิด ตามข้อเสนอของ computer-16)" }
  - { framework: acm-cs2023, indicators: ["DM-Querying"], coverage: partial, note: "SELECT WHERE ORDER BY COUNT และ JOIN สามตาราง ทุกคำสั่งตรวจด้วย sqlite3 ของ Python ยังไม่มี GROUP BY และคำสั่ง UPDATE DELETE และผู้เรียนไม่ได้รันคำสั่งเองในแอป" }
  - { framework: acm-cs2023, indicators: ["SEC-Coding"], coverage: partial, note: "การแทรกคำสั่ง SQL การป้องกันด้วยตัวยึดตำแหน่ง และการตรวจข้อมูลรับเข้า ยังไม่มีช่องโหว่ชนิดอื่น (เช่น buffer overflow, XSS)" }
  - { framework: au-ac9-digital-technologies, indicators: ["AC9TDI8P03", "AC9TDI10P03"], coverage: partial, note: "แบบจำลองคุณสมบัติของสิ่ง (นักเรียน หนังสือ) และเหตุการณ์ (การยืม) เป็นตาราง ความสัมพันธ์ระหว่างเอนทิตี และการสืบค้นด้วย SQL ผู้เรียนออกแบบตารางและอ่านผลคำสั่ง แต่ไม่ได้สร้างและสืบค้นฐานข้อมูลเองในเครื่องมือจริง" }
not_taught: []
