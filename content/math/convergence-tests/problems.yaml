- id: math.calculus.convergence-tests.p017
  topics:
  - math.calculus.convergence-tests
  difficulty: 4
  type: order
  stem: 'เรียงขั้นตอนการใช้การทดสอบอัตราส่วนกับ $\sum a_n$ ตามลำดับที่ถูกต้อง'
  items:
  - คำนวณ $\left|\dfrac{a_{n+1}}{a_n}\right|$ แล้วตัดตัวประกอบร่วมให้เหลือพจน์ของ $n$
  - หาลิมิต $L = \lim_{n\to\infty}\left|\dfrac{a_{n+1}}{a_n}\right|$
  - ตัดสินตามค่า $L$ คือ $L<1$ ลู่เข้าสัมบูรณ์ $L>1$ ลู่ออก และ $L=1$ สรุปไม่ได้
  hints:
  - ก่อนหาลิมิตต้องได้นิพจน์ของอัตราส่วนก่อน
  - ขั้นสุดท้ายเป็นการตัดสินจากค่าลิมิตที่ได้
  solution: ขั้นแรกหาอัตราส่วนและจัดรูป ขั้นที่สองหาลิมิต $L$ ขั้นสุดท้ายตัดสินตามค่าของ $L$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: math.calculus.convergence-tests.p018
  topics:
  - math.calculus.convergence-tests
  difficulty: 5
  type: numeric
  stem: 'ให้ $a_n = \left(1+\dfrac{1}{n}\right)^{n^2}\cdot\dfrac{1}{3^n}$ จงหา $\displaystyle\lim_{n\to\infty}\sqrt[n]{a_n}$ (ตอบทศนิยม 4 ตำแหน่ง)'
  answer:
    value: 0.9061
    tolerance: 0.0001
  hints:
  - ถอดรากที่ $n$ ออกจากผลคูณ ตัวประกอบแต่ละตัวจะถูกยกกำลัง $\frac{1}{n}$
  - เมื่อยกกำลัง $\frac{1}{n}$ แล้ว $\left(1+\frac1n\right)^{n^2}$ จะเหลือ $\left(1+\frac1n\right)^n$
  - ลิมิตของ $\left(1+\frac1n\right)^n$ เมื่อ $n\to\infty$ เป็นค่าคงที่ที่รู้จักกันดี
  misconceptions:
  - match: 0.3333
    feedback: ลืมส่วน $\left(1+\frac1n\right)^n$ ซึ่งลิมิตไม่ใช่ $1$ จึงได้เพียง $\frac13$
  - match: 2.7183
    feedback: ลืมตัวหาร $3^n$ จึงได้ค่าลิมิตของ $\left(1+\frac1n\right)^n$ เท่านั้น
  solution: $\sqrt[n]{a_n} = \left(1+\frac1n\right)^n\cdot\frac13 \to \frac{e}{3} \approx 0.9061$ ซึ่งน้อยกว่า $1$ จึงลู่เข้าสัมบูรณ์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: math.calculus.convergence-tests.p019
  topics:
  - math.calculus.convergence-tests
  difficulty: 5
  type: mcq
  stem: 'อนุกรม $\displaystyle\sum_{n=2}^{\infty}\frac{(-1)^n \ln n}{n}$ ลู่เข้าในลักษณะใด'
  choices:
  - id: a
    text: ลู่เข้าแบบมีเงื่อนไข
    correct: true
  - id: b
    text: ลู่เข้าสัมบูรณ์
    correct: false
    feedback: เมื่อ $n \ge 3$ จะได้ $\frac{\ln n}{n} \ge \frac{1}{n}$ ผลบวกของค่าสัมบูรณ์จึงลู่ออกเหมือน $\sum \frac{1}{n}$
  - id: c
    text: ลู่ออก เพราะพจน์ไม่เข้าหาศูนย์
    correct: false
    feedback: $\frac{\ln n}{n}\to 0$ จึงการทดสอบพจน์ที่ n ไม่ให้ข้อสรุปว่าลู่ออก
  - id: d
    text: ตัดสินไม่ได้ด้วยวิธีใดเลย
    correct: false
    feedback: การทดสอบของไลบ์นิซใช้ได้ เพราะ $\frac{\ln n}{n}$ ลดลงเมื่อ $n \ge 3$ และเข้าหาศูนย์
  hints:
  - ตรวจค่าสัมบูรณ์ของพจน์ก่อนว่าลู่เข้าหรือไม่ โดยเปรียบเทียบกับ $\sum \frac{1}{n}$
  - ตรวจว่าพจน์ $\frac{\ln n}{n}$ เข้าหาศูนย์และลดลงเมื่อ $n$ มากพอ
  solution: เมื่อ $n\ge 3$ จะได้ $\ln n \ge 1$ จึง $\frac{\ln n}{n}\ge\frac1n$ ผลบวกค่าสัมบูรณ์จึงลู่ออก แต่ $\frac{\ln n}{n}$ เข้าหาศูนย์และลดลงเมื่อ $n\ge 3$ ตามการทดสอบของไลบ์นิซ อนุกรมจึงลู่เข้าแบบมีเงื่อนไข
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: math.calculus.convergence-tests.p020
  topics:
  - math.calculus.convergence-tests
  difficulty: 4
  type: mcq
  stem: 'ร้านกาแฟแห่งหนึ่งประมาณยอดขายวันที่ $n$ เป็น $\frac{n}{4^n}$ พันบาท (ข้อมูลสมมติ) ถ้ารวมยอดขายทุกวันไปเรื่อย ๆ ยอดรวมเป็นจำนวนจำกัดหรือไม่ และควรใช้การทดสอบใด'
  choices:
  - id: a
    text: ไม่จำกัด ด้วยการทดสอบพจน์ที่ n
    correct: false
    feedback: $\frac{n}{4^n}\to 0$ การทดสอบพจน์ที่ n จึงไม่ให้ข้อสรุป
  - id: b
    text: ไม่จำกัด ด้วยอนุกรมฮาร์มอนิก
    correct: false
    feedback: พจน์นี้เป็นกำลัง $n$ ในตัวส่วน ไม่ใช่อนุกรมฮาร์มอนิก
  - id: c
    text: จำกัด ด้วยการทดสอบอัตราส่วน เพราะอัตราส่วนเข้าใกล้ $\frac14$
    correct: true
  - id: d
    text: ไม่สรุปได้ ต้องคำนวณทุกวัน
    correct: false
    feedback: การทดสอบอัตราส่วนให้ข้อสรุปได้เพราะอัตราส่วนเข้าใกล้ค่าที่น้อยกว่า $1$
  hints:
  - หาอัตราส่วนของพจน์ที่ต่อกัน $\frac{a_{n+1}}{a_n}$
  - ถ้าลิมิตของอัตราส่วนน้อยกว่า $1$ อนุกรมลู่เข้า
  solution: $\frac{a_{n+1}}{a_n} = \frac{n+1}{4n} \to \frac{1}{4} < 1$ จึงยอดรวมเป็นจำนวนจำกัดตามการทดสอบอัตราส่วน
  license: CC-BY-SA-4.0
  ai_assisted: true
