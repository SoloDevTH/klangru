problems:
- id: chinese.grammar.measure-words.p001
  topics:
  - chinese.grammar.measure-words
  difficulty: 1
  type: mcq
  stem: 三本书 (sān běn shū) ลักษณนาม 本 ใช้กับสิ่งใด
  choices:
  - id: a
    text: ปลา (ตัว)
    feedback: ปลาใช้ 条 tiáo
  - id: b
    text: เสื้อ (ตัว)
    feedback: เสื้อใช้ 件 jiàn
  - id: c
    text: หนังสือ (เล่ม)
    correct: true
    feedback: ถูก 本 běn ใช้กับหนังสือ สมุด เหมือน เล่ม ในภาษาไทย
  - id: d
    text: ชา กาแฟ (แก้ว)
    feedback: แก้วใช้ 杯 bēi
  hints:
  - 书 shū แปลว่า หนังสือ
  - 三本书 แปลว่า หนังสือสามเล่ม
  solution: 本 běn = ลักษณนามของ **หนังสือ สมุด** (เล่ม) 三本书 = หนังสือสามเล่ม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.measure-words.p002
  topics:
  - chinese.grammar.measure-words
  difficulty: 1
  type: match
  stem: จับคู่ลักษณนามกับคำนามที่ใช้ด้วยกัน
  pairs:
  - left: 本
    right: 书 (หนังสือ)
  - left: 杯
    right: 茶 (ชา)
  - left: 件
    right: 衣服 (เสื้อผ้า)
  - left: 条
    right: 鱼 (ปลา)
  - left: 位
    right: 老师 (ครู)
  hints:
  - 杯 คือแก้ว 条 ใช้กับของยาว ๆ
  - 位 ใช้กับคนอย่างสุภาพ
  solution: 本书 หนังสือ · 杯茶 ชา (แก้ว) · 件衣服 เสื้อ (ตัว) · 条鱼 ปลา (ตัว) · 位老师 ครู (ท่าน)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.measure-words.p003
  topics:
  - chinese.grammar.measure-words
  difficulty: 2
  type: mcq
  stem: นักท่องเที่ยวชาวจีนที่ตลาดนัดจตุจักรอยากสั่ง "ชาไทย 3 แก้ว" ประโยคใดถูกต้องตามโครงสร้าง ตัวเลข + ลักษณนาม + คำนาม (奶茶 nǎichá = ชานม)
  choices:
  - id: a
    text: 三杯奶茶
    correct: true
    feedback: ถูก 三 (สาม) + 杯 (แก้ว) + 奶茶 (ชานม)
  - id: b
    text: 奶茶三杯
    feedback: เรียงตามภาษาไทย (นาม + จำนวน + ลักษณนาม) ประโยคภาษาจีนทั่วไปวางจำนวนและลักษณนามไว้หน้าคำนาม
  - id: c
    text: 三奶茶
    feedback: ภาษาจีนไม่วางตัวเลขหน้าคำนามโดยตรง ต้องมีลักษณนาม
  - id: d
    text: 杯三奶茶
    feedback: ตัวเลขต้องมาก่อนลักษณนาม
  hints:
  - 'ภาษาไทย: ชา + สาม + แก้ว'
  - 'ภาษาจีน: ตัวเลข + ลักษณนาม + คำนาม'
  solution: '**三杯奶茶** sān bēi nǎichá ลำดับกลับกับภาษาไทย คำนามอยู่ท้ายสุด'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.measure-words.p004
  topics:
  - chinese.grammar.measure-words
  difficulty: 2
  type: order
  stem: เรียงคำให้เป็นประโยค "ฉันมีหนังสือสองเล่ม" (有 yǒu = มี)
  items:
  - 我
  - 有
  - 两
  - 本
  - 书
  hints:
  - 'เริ่มด้วยประธานและกริยา: ฉัน มี'
  - จำนวนสองหน้าลักษณนามใช้ 两 แล้วตามด้วย 本 และ 书
  solution: '**我有两本书。** Wǒ yǒu liǎng běn shū.'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.measure-words.p005
  topics:
  - chinese.grammar.measure-words
  difficulty: 2
  type: hanzi
  stem: เขียนอักษร 本 (běn) ลักษณนามของหนังสือ ตามลำดับขีด
  character: 本
  pinyin: běn
  meaning: เล่ม (ลักษณนามของหนังสือ)
  hints:
  - 本 คือ 木 (ต้นไม้) ที่มีขีดนอนสั้นด้านล่าง รวม 5 ขีด
  - 'เขียน 木 ให้ครบก่อน: 横 竖 撇 捺 แล้วจึงเขียนขีดนอนสั้นเป็นขีดสุดท้าย'
  solution: 横 → 竖 → 撇 → 捺 → 横 (ขีดสั้นที่โคน) รวม 5 ขีด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.measure-words.p006
  topics:
  - chinese.grammar.measure-words
  difficulty: 3
  type: mcq
  stem: จะพูดว่า "12 อัน" เป็นภาษาจีน ข้อใดถูกต้อง
  choices:
  - id: a
    text: 十两个
    feedback: 两 ใช้แทน 2 เฉพาะเมื่อ 2 อยู่ตัวเดียวหน้าลักษณนาม (两个) ไม่ใช้ในหลักหน่วยของ 12
  - id: b
    text: 两十个
    feedback: 20 คือ 二十 และ 12 คือ 十二
  - id: c
    text: 十二
    feedback: ขาดลักษณนาม 个
  - id: d
    text: 十二个
    correct: true
    feedback: ถูก เลขสองที่อยู่ในหลักหน่วยของเลขหลายหลักใช้ 二 เสมอ
  hints:
  - 两 ใช้แทน 二 เมื่อ 2 อยู่ลำพังหน้าลักษณนาม
  - 12, 22, 32 ลงท้ายด้วย 二 เสมอ
  solution: '**十二个** shí''èr gè · เปรียบเทียบ 两个 (2 อัน) · 二十个 (20 อัน)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.measure-words.p007
  topics:
  - chinese.grammar.measure-words
  difficulty: 3
  type: mcq
  stem: ครอบครัวนักท่องเที่ยวชาวจีนเดินเข้าร้านอาหารในกรุงเทพฯ พนักงานต้องการถามอย่างสุภาพว่า "กี่ท่านคะ" ควรพูดว่าอะไร
  choices:
  - id: a
    text: 几位？ jǐ wèi
    correct: true
    feedback: ถูก 位 เป็นลักษณนามของคนแบบสุภาพ ใช้กับลูกค้าและแขก
  - id: b
    text: 几本？ jǐ běn
    feedback: 本 ใช้กับหนังสือ
  - id: c
    text: 几口？ jǐ kǒu
    feedback: 口 ใช้นับสมาชิกในครอบครัว เช่น 你家有几口人 ไม่ใช้ถามจำนวนลูกค้า
  - id: d
    text: 几条？ jǐ tiáo
    feedback: 条 ใช้กับของยาว ๆ เช่น ปลา ถนน
  hints:
  - ภาษาไทยใช้ ท่าน กับลูกค้า
  - 'ลักษณนามของคนมี 2 แบบ: 个 (ทั่วไป) และ 位 (สุภาพ)'
  solution: '**几位？** jǐ wèi (กี่ท่าน) สุภาพกว่า 几个人 ซึ่งใช้ได้เช่นกันแต่ไม่เป็นทางการ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.measure-words.p008
  topics:
  - chinese.grammar.measure-words
  difficulty: 3
  type: mcq
  stem: 我家有四口人。 (Wǒ jiā yǒu sì kǒu rén.) คำว่า 口 ในประโยคนี้ทำหน้าที่อะไร
  choices:
  - id: a
    text: เป็นคำถาม
    feedback: ประโยคนี้เป็นประโยคบอกเล่า
  - id: b
    text: ลักษณนามที่ใช้นับสมาชิกในครอบครัว
    correct: true
    feedback: ถูก ประโยคนี้แปลว่า บ้านฉันมีสมาชิก 4 คน
  - id: c
    text: แปลว่า ปาก บ้านมี 4 ปาก
    feedback: 口 แปลว่าปากได้ แต่ในที่นี้เป็นลักษณนาม
  - id: d
    text: แปลว่า ประตูบ้าน
    feedback: ประตูคือ 门 mén
  hints:
  - 'ดูตำแหน่ง: 四 + 口 + 人'
  - คำที่อยู่ระหว่างตัวเลขกับคำนามคือลักษณนาม
  solution: 口 kǒu เป็น **ลักษณนามของสมาชิกในครอบครัว** 我家有四口人 = บ้านฉันมี 4 คน (คนทั่วไปนอกครอบครัวใช้ 个)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.measure-words.p009
  topics:
  - chinese.grammar.measure-words
  difficulty: 3
  type: numeric
  stem: ดูเมนูในภาพ ลูกค้าชาวจีนสั่งว่า 两杯泰式奶茶，一条柠檬鱼 ต้องจ่ายทั้งหมดกี่บาท
  figure: &id001
    src: menu-bangkok.svg
    alt: 'เมนูร้านอาหารไทยในกรุงเทพฯ สำหรับลูกค้าชาวจีน 4 รายการ ราคาเป็นบาท (块): 泰式奶茶 ชาไทย 一杯 แก้วละ 30 块 · 咖啡 กาแฟ 一杯 แก้วละ 40 块 · 柠檬鱼 ปลานึ่งมะนาว 一条 ตัวละ 250 块 · 椰子蛋糕 เค้กมะพร้าว 一块 ชิ้นละ 45 块'
    caption: เมนูร้านอาหาร (块 ในที่นี้หมายถึง บาท)
  answer:
    value: 310
    unit: บาท
  misconceptions:
  - match: 280
    feedback: สั่งชาไทย 两杯 คือ 2 แก้ว ไม่ใช่ 1 แก้ว
  - match: 560
    feedback: 两 ใช้กับชาไทยเท่านั้น ปลาสั่ง 一条 คือ 1 ตัว
  hints:
  - 两杯 = 2 แก้ว และ 一条 = 1 ตัว
  - คูณราคาต่อหน่วยกับจำนวน แล้วบวกกัน
  solution: 'ชาไทย 2 แก้ว: $2 \times 30 = 60$ บาท · ปลา 1 ตัว: 250 บาท · รวม $60 + 250 = 310$ บาท'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.measure-words.p010
  topics:
  - chinese.grammar.measure-words
  difficulty: 3
  type: text
  stem: เขียน "เสื้อตัวนี้" เป็นภาษาจีน (这 = นี้, 衣服 = เสื้อผ้า; พิมพ์อักษรจีน)
  accepted:
  - 这件衣服
  - 這件衣服
  misconceptions:
  - match: 衣服这件
    feedback: เรียงแบบภาษาไทย ภาษาจีนวาง 这 + ลักษณนาม ไว้หน้าคำนาม
  - match: 这个衣服
    feedback: ภาษาพูดบางคนใช้ 个 แต่ลักษณนามของเสื้อผ้าที่ถูกต้องคือ 件
  - match: 这衣服
    feedback: ควรมีลักษณนาม 件 ระหว่าง 这 กับ 衣服
  hints:
  - 'ภาษาจีน: 这 + ลักษณนาม + คำนาม'
  - ลักษณนามของเสื้อผ้าคือ 件 jiàn
  solution: '**这件衣服** zhè jiàn yīfu (นี้ + ตัว + เสื้อ) ลำดับกลับกับภาษาไทย'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.measure-words.p011
  topics:
  - chinese.grammar.measure-words
  difficulty: 4
  type: mcq
  stem: ข้อใดอ่านเสียงวรรณยุกต์ของ 一 ได้ถูกต้อง (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: 一杯 yì bēi
    correct: true
    feedback: ถูก 杯 เป็นเสียง 1 一 จึงเป็นเสียง 4
  - id: b
    text: 一位 yí wèi
    correct: true
    feedback: ถูก 位 เป็นเสียง 4 一 จึงเป็นเสียง 2
  - id: c
    text: 一本 yí běn
    feedback: '本 เป็นเสียง 3 一 ต้องเป็นเสียง 4: yì běn'
  - id: d
    text: 一条 yí tiáo
    feedback: '条 เป็นเสียง 2 一 ต้องเป็นเสียง 4: yì tiáo'
  - id: e
    text: 一件 yì jiàn
    feedback: '件 เป็นเสียง 4 一 ต้องเป็นเสียง 2: yí jiàn'
  hints:
  - 一 หน้าเสียง 4 อ่านเป็นเสียง 2
  - 一 หน้าเสียง 1 2 3 อ่านเป็นเสียง 4
  solution: 'ถูก: **yì bēi** และ **yí wèi** · ที่ถูกของข้ออื่น: yì běn, yì tiáo, yí jiàn'
  license: CC-BY-SA-4.0
  ai_assisted: true
