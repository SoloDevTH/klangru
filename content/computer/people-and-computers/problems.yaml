problems:
  - id: computer.society.people-and-computers.p001
    topics: [computer.society.people-and-computers]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นเทคโนโลยีที่มีคนออกแบบขึ้นเพื่อแก้ปัญหาของคน"
    choices:
      - { id: a, text: "ไม้เท้าที่มีเซนเซอร์คอยเตือนเมื่อมีสิ่งกีดขวางข้างหน้า", correct: true }
      - { id: b, text: "ก้อนหินที่กลิ้งลงจากภูเขาหลังฝนตก", feedback: "ก้อนหินกลิ้งเองตามธรรมชาติ ไม่มีคนออกแบบให้เกิด" }
      - { id: c, text: "ต้นมะม่วงที่งอกขึ้นมาริมรั้วบ้าน", feedback: "ต้นไม้งอกเองตามธรรมชาติ ไม่มีคนสร้างขึ้นมา" }
      - { id: d, text: "สายรุ้งที่ปรากฏหลังฝนตก", feedback: "สายรุ้งเกิดจากแสงกับละอองน้ำในอากาศ ไม่มีคนสร้าง" }
    hints:
      - "ลองถามว่าสิ่งนั้นมีคนคิดและสร้างขึ้นมาหรือไม่"
      - "เทคโนโลยีคือสิ่งที่คนออกแบบให้ใช้งานได้จริง"
    solution: "ไม้เท้าที่มีเซนเซอร์เป็นเทคโนโลยีที่คนออกแบบขึ้นเพื่อช่วยคนตาบอดเดินหลบสิ่งกีดขวาง ส่วนก้อนหิน ต้นไม้ และสายรุ้งเกิดขึ้นเองตามธรรมชาติ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.people-and-computers.p002
    topics: [computer.society.people-and-computers]
    difficulty: 1
    type: match
    stem: "จับคู่เทคโนโลยีกับปัญหาที่มันช่วยแก้"
    pairs:
      - { left: "ไม้เท้าอัจฉริยะ", right: "ช่วยให้คนตาบอดรู้ว่ามีสิ่งกีดขวางอยู่ข้างหน้า" }
      - { left: "แอปแจ้งเตือนน้ำท่วม", right: "บอกคนล่วงหน้าเมื่อระดับน้ำกำลังสูงขึ้น" }
      - { left: "ตู้กดบัตรคิวอัตโนมัติ", right: "ลดการยืนรอเพื่อเรียงคิวที่เคาน์เตอร์" }
    hints:
      - "ดูว่าแต่ละเทคโนโลยีถูกคิดขึ้นเพื่อคนกลุ่มไหนหรือเพื่อสถานการณ์ใด"
      - "ถามตัวเองว่าก่อนมีเทคโนโลยีนี้ คนต้องเจอความลำบากเรื่องอะไร"
    solution: "ไม้เท้าอัจฉริยะช่วยคนตาบอดหลบสิ่งกีดขวาง แอปแจ้งเตือนน้ำท่วมบอกล่วงหน้าเมื่อน้ำขึ้น และตู้กดบัตรคิวช่วยลดการยืนรอ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.people-and-computers.p003
    topics: [computer.society.people-and-computers]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นงานที่ควรให้คอมพิวเตอร์ช่วยทำ"
    choices:
      - { id: a, text: "นับคะแนนของนักเรียน 400 คนที่ทำแบบทดสอบ", correct: true }
      - { id: b, text: "ปลอบเพื่อนที่เสียใจด้วยข้อความที่ตั้งไว้ล่วงหน้า", feedback: "เพื่อนต้องการความใส่ใจจากคนจริง ๆ คอมพิวเตอร์แทนความรู้สึกนี้ไม่ได้" }
      - { id: c, text: "ติดตามตำแหน่งของเพื่อนโดยที่เพื่อนไม่รู้ตัว", feedback: "เป็นการละเมิดความเป็นส่วนตัวของเพื่อน" }
      - { id: d, text: "ตัดสินว่าจะเป็นเพื่อนกับใครโดยไม่เคยรู้จักเขาเลย", feedback: "ความสัมพันธ์ต้องเกิดจากการรู้จักและเลือกกันของคนสองฝ่าย" }
    hints:
      - "งานไหนซ้ำ ๆ จำนวนมาก และต้องถูกต้องรวดเร็ว"
      - "งานไหนที่เกี่ยวกับความรู้สึกหรือความเป็นส่วนตัวของคน"
    solution: "การนับคะแนนนักเรียนจำนวนมากเป็นงานซ้ำ ๆ ที่ต้องถูกต้องและเร็ว คอมพิวเตอร์เหมาะกับงานแบบนี้ ส่วนข้ออื่นเกี่ยวกับความรู้สึกหรือความเป็นส่วนตัวของคน ไม่ควรให้คอมพิวเตอร์ตัดสินแทน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.people-and-computers.p004
    topics: [computer.society.people-and-computers]
    difficulty: 1
    type: order
    stem: "เรียงขั้นตอนการตัดสินใจรับเทคโนโลยีใหม่ให้ถูกต้อง"
    items:
      - "ตั้งคำถามและกำหนดให้ชัดว่าปัญหาคืออะไร"
      - "ทดลองใช้ในวงเล็ก ๆ ก่อน"
      - "ดูว่าใครได้ประโยชน์และใครได้รับผลกระทบ"
      - "ตัดสินใจ แล้วทบทวนเมื่อเห็นผลจริง"
    hints:
      - "ต้องรู้ปัญหาก่อนจึงจะรู้ว่าเทคโนโลยีช่วยได้หรือไม่"
      - "ควรลองเล็ก ๆ ก่อนตัดสินใจให้ทั้งโรงเรียนใช้"
    solution: "ต้องนิยามปัญหาก่อน แล้วทดลองเล็ก ๆ ดูผลกับทุกคนที่เกี่ยวข้อง จากนั้นจึงตัดสินใจและทบทวนเมื่อใช้จริง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.people-and-computers.p005
    topics: [computer.society.people-and-computers]
    difficulty: 2
    type: numeric
    stem: "ร้านก๋วยเตี๋ยวในโรงอาหารมีลูกค้า 3 คนเข้าคิวตามลำดับ A B C ใช้เวลาทำอาหารให้แต่ละคน A 4 นาที B 1 นาที C 3 นาที ถ้าทำตามลำดับเข้าคิว เวลารอเฉลี่ยของทั้ง 3 คนกี่นาที (คนแรกไม่ต้องรอ)"
    answer: { value: 3, tolerance: 0, unit: "นาที" }
    hints:
      - "คนแรกไม่ต้องรอ คนที่สองต้องรอเท่ากับเวลาทำของคนแรก"
      - "คนที่สามต้องรอเวลาทำของคนก่อนหน้าทั้งสองคนรวมกัน แล้วหาค่าเฉลี่ยด้วยการหารด้วยจำนวนคน"
    solution: "A รอ 0 นาที B รอ 4 นาที C รอ 4 + 1 = 5 นาที รวมเวลารอ 0 + 4 + 5 = 9 นาที เฉลี่ย 9 ÷ 3 = 3 นาที"
    misconceptions:
      - { match: 8, feedback: "8 คือเวลาทำอาหารของทั้ง 3 คนรวมกัน (4 + 1 + 3) ซึ่งไม่ใช่เวลารอ" }
      - { match: 9, feedback: "9 คือผลรวมของเวลารอทั้ง 3 คน ต้องหารด้วย 3 ก่อนจึงได้ค่าเฉลี่ย" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.people-and-computers.p006
    topics: [computer.society.people-and-computers]
    difficulty: 2
    type: numeric
    stem: "จากร้านก๋วยเตี๋ยวในข้อก่อน (A 4 นาที B 1 นาที C 3 นาที) ถ้าจัดคิวใหม่ให้ B ได้ก่อน แล้วตามด้วย C และ A เวลารอเฉลี่ยของทั้ง 3 คนกี่นาที ตอบเป็นทศนิยม 2 ตำแหน่ง"
    answer: { value: 1.67, tolerance: 0.01, unit: "นาที" }
    hints:
      - "หาก่อนว่าแต่ละคนต้องรอนานเท่าไร แล้วค่อยรวมเวลารอ"
      - "C รอเท่ากับเวลาทำของ B ส่วน A ต้องรอเวลาทำของ B และ C รวมกัน"
    solution: "B รอ 0 นาที C รอ 1 นาที A รอ 1 + 3 = 4 นาที รวมเวลารอ 0 + 1 + 4 = 5 นาที เฉลี่ย 5 ÷ 3 ≈ 1.67 นาที"
    misconceptions:
      - { match: 2.67, feedback: "2.67 คือค่าเฉลี่ยของเวลาทำอาหาร (8 ÷ 3) ไม่ใช่เวลารอ" }
      - { match: 3, feedback: "3 คือเวลารอเฉลี่ยของลำดับเดิม การสลับลำดับทำให้ค่านี้เปลี่ยน" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.people-and-computers.p007
    topics: [computer.society.people-and-computers]
    difficulty: 2
    type: mcq
    stem: "ร้านข้าวมันไก่ในบทเรียนมีคิว A B C ใช้เวลาทำอาหาร A 5 นาที B 2 นาที C 3 นาที ถ้าสลับให้ B ไปอยู่หน้า A โดยคนอื่นยังเหมือนเดิม ผลที่เกิดขึ้นคือข้อใด"
    choices:
      - { id: a, text: "เวลารอเฉลี่ยลดจาก 4 นาทีเป็น 3 นาที", correct: true }
      - { id: b, text: "เวลารอเฉลี่ยไม่เปลี่ยนเลย เพราะทั้งสามคนยังอยู่ในคิวเดิม", feedback: "ลำดับมีผลต่อเวลาที่แต่ละคนต้องรอ การสลับเพียงสองคนก็ทำให้ผลรวมเวลารอเปลี่ยนไป" }
      - { id: c, text: "เวลาให้บริการรวมลดจาก 10 นาทีเป็น 9 นาที", feedback: "เวลาทำอาหารของแต่ละคนไม่เปลี่ยน ผลรวมยังเป็น 10 นาทีเท่าเดิม" }
      - { id: d, text: "คนที่ใช้เวลามากจะรอน้อยลงทุกคน", feedback: "ไม่จริง A ต้องรอเพิ่มจาก 0 เป็น 2 นาที การเปลี่ยนลำดับไม่ได้ทำให้ทุกคนดีขึ้น" }
    hints:
      - "นับเวลารอของทั้งสามคนทั้งก่อนและหลังการสลับ"
      - "คนที่ได้ก่อนจะไม่ต้องรอ ส่วนคนที่อยู่หลังจะรอเท่ากับเวลาทำของทุกคนที่อยู่ข้างหน้า"
    solution: "ลำดับใหม่คือ B A C รอ 0 + 2 + 7 = 9 นาที เฉลี่ย 3 นาที ต่างจากลำดับเดิมที่รวมรอ 12 นาที เฉลี่ย 4 นาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.people-and-computers.p008
    topics: [computer.society.people-and-computers]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "เลือกทุกข้อที่เป็นประโยชน์ของการใช้อุปกรณ์ดิจิทัลอย่างเหมาะสม"
    choices:
      - { id: a, text: "ค้นหาความรู้เพื่อทำการบ้านได้เร็วขึ้น", correct: true }
      - { id: b, text: "ติดต่อครอบครัวได้ทันทีแม้อยู่คนละที่", correct: true }
      - { id: c, text: "ฝึกทำแบบฝึกหัดที่ปรับให้เหมาะกับระดับของเราได้", correct: true }
      - { id: d, text: "เล่นเกมจนดึกทุกคืนจนนอนไม่พอ", feedback: "เป็นโทษ ทำให้ร่างกายและการเรียนแย่ลง" }
    hints:
      - "คิดว่าอุปกรณ์ช่วยให้เราทำอะไรได้บ้างโดยไม่เสียสุขภาพ"
      - "ตัวเลือกที่ทำให้นอนไม่พอ ไม่ใช่การใช้อย่างเหมาะสม"
    solution: "การค้นหาความรู้ การติดต่อครอบครัว และการฝึกที่ปรับระดับได้เป็นประโยชน์ ส่วนการเล่นจนดึกทุกคืนเป็นโทษต่อการนอนและการเรียน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.people-and-computers.p009
    topics: [computer.society.people-and-computers]
    difficulty: 3
    type: numeric
    stem: "โรงเรียนมีเส้นทางบันได 120 เมตร และทางลาด 150 เมตรไปห้องสมุด นักเรียนรถเข็นคนหนึ่งไปห้องสมุดและกลับวันละ 1 รอบ และต้องใช้ทางลาดทุกวัน ใน 5 วันทำการ เขาต้องเดินเพิ่มกี่เมตรเมื่อเทียบกับการใช้เส้นทางบันได"
    answer: { value: 300, tolerance: 0, unit: "เมตร" }
    hints:
      - "หาก่อนว่าทางลาดยาวกว่าบันไดเท่าไรในการเดินหนึ่งครั้ง"
      - "หนึ่งรอบมีการเดินสองครั้ง คือไปและกลับ แล้วคูณด้วยจำนวนวัน"
    solution: "ต่างกัน 150 − 120 = 30 เมตรต่อการเดินหนึ่งครั้ง ไปกลับหนึ่งรอบคือ 2 ครั้ง ได้ 30 × 2 = 60 เมตรต่อวัน ใน 5 วันได้ 60 × 5 = 300 เมตร"
    misconceptions:
      - { match: 30, feedback: "30 คือส่วนต่างเฉพาะการเดินหนึ่งครั้ง ยังไม่ได้คิดไปกลับและจำนวนวัน" }
      - { match: 60, feedback: "60 คือส่วนต่างต่อวัน ยังไม่ได้คูณด้วย 5 วัน" }
      - { match: 150, feedback: "150 คือระยะทางของทางลาดทั้งหมด ไม่ใช่ส่วนที่เพิ่มขึ้นเมื่อเทียบกับบันได" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.people-and-computers.p010
    topics: [computer.society.people-and-computers]
    difficulty: 3
    type: order
    stem: "เรียงลำดับวงจรการเกิดเทคโนโลยีใหม่ตั้งแต่ต้นจนจบ"
    items:
      - "คนเห็นปัญหาในชีวิตประจำวัน"
      - "เทคโนโลยีเดิมแก้ได้บางส่วนแต่มีข้อจำกัด"
      - "คนออกแบบและทดลองเทคโนโลยีใหม่"
      - "คนตัดสินใจรับหรือไม่รับ แล้วปรับปรุงต่อ"
    hints:
      - "เทคโนโลยีจะเกิดขึ้นได้ก็ต่อเมื่อมีปัญหาให้แก้ก่อน"
      - "เทคโนโลยีใหม่มักเกิดขึ้นเพราะสิ่งเดิมมีข้อจำกัด"
    solution: "เริ่มจากคนเห็นปัญหา แล้วเทคโนโลยีเดิมมีข้อจำกัด จึงมีการออกแบบและทดลองของใหม่ และสุดท้ายคนตัดสินใจรับหรือไม่รับ แล้วปรับปรุงต่อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.people-and-computers.p011
    topics: [computer.society.people-and-computers]
    difficulty: 3
    type: match
    stem: "จับคู่ข้อจำกัดของเทคโนโลยีเดิมกับเทคโนโลยีใหม่ที่เกิดตามมา"
    pairs:
      - { left: "โทรศัพท์บ้านต้องอยู่กับที่", right: "โทรศัพท์มือถือที่พกไปได้" }
      - { left: "เช็กชื่อด้วยกระดาษต้องนับและรวมผลเอง", right: "แอปแบบฟอร์มที่ส่งข้อมูลถึงครูทันที" }
      - { left: "ต้องไปยืนซื้อตั๋วที่หน้าเคาน์เตอร์เท่านั้น", right: "ซื้อตั๋วออนไลน์ผ่านแอปได้จากที่ไหนก็ได้" }
    hints:
      - "ถามว่าเทคโนโลยีเดิมทำอะไรไม่ได้ แล้วเทคโนโลยีใหม่แก้ตรงนั้นอย่างไร"
      - "มองหาคำที่บอกว่าทำได้เฉพาะที่หรือต้องทำด้วยมือ"
    solution: "โทรศัพท์บ้านอยู่กับที่ จึงเกิดมือถือ การเช็กชื่อด้วยกระดาษต้องนับเอง จึงเกิดแอปแบบฟอร์ม และการต้องยืนซื้อตั๋วจึงเกิดการซื้อออนไลน์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.people-and-computers.p012
    topics: [computer.society.people-and-computers]
    difficulty: 3
    type: mcq
    stem: "โรงเรียนตั้งเกณฑ์ให้เช็กชื่อผ่านแอปที่ต้องใช้โทรศัพท์มือถือของตัวเอง ใครจะเสียเปรียบมากที่สุด"
    choices:
