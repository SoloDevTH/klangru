problems:
  - id: management.quality.six-sigma-dmaic.p001
    topics: [management.quality.six-sigma-dmaic]
    difficulty: 1
    type: order
    stem: "เรียงขั้นของวงจร DMAIC จากก่อนไปหลัง"
    items:
      - "นิยามปัญหา เป้าหมาย และขอบเขตในกฎบัตร"
      - "วัดผลงานปัจจุบันหลังตรวจระบบการวัด"
      - "วิเคราะห์และยืนยันสาเหตุรากด้วยข้อมูล"
      - "ปรับปรุงด้วยการทดลองและนำร่อง"
      - "ควบคุมด้วยแผนควบคุมและส่งมอบเจ้าของกระบวนการ"
    hints:
      - "D M A I C"
      - "ต้องยืนยันสาเหตุก่อนลงมือปรับปรุง"
    solution: "นิยาม → วัด → วิเคราะห์ → ปรับปรุง → ควบคุม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.six-sigma-dmaic.p002
    topics: [management.quality.six-sigma-dmaic]
    difficulty: 1
    type: match
    stem: "จับคู่ตัวอักษรของ SIPOC กับรายการของโรงงานถุงมือยาง (สมมติ)"
    pairs:
      - { left: "S ผู้ส่งมอบ", right: "สหกรณ์ผู้ผลิตน้ำยางข้น" }
      - { left: "I ปัจจัยนำเข้า", right: "น้ำยางข้น สารจับตัว แม่พิมพ์เซรามิก" }
      - { left: "P กระบวนการ", right: "จุ่ม อบ ถอด ตรวจ บรรจุ" }
      - { left: "O ผลผลิต", right: "ถุงมือบรรจุกล่องละ 100 ชิ้น" }
      - { left: "C ลูกค้า", right: "ผู้จัดจำหน่ายเวชภัณฑ์ต่างประเทศ" }
    hints:
      - "ผู้ส่งมอบคือผู้ให้ปัจจัยนำเข้า"
      - "ลูกค้าคือผู้รับผลผลิต"
    solution: "สหกรณ์คือผู้ส่งมอบ น้ำยางและแม่พิมพ์คือปัจจัยนำเข้า ขั้นตอนผลิตคือกระบวนการ ถุงมือบรรจุกล่องคือผลผลิต และผู้จัดจำหน่ายคือลูกค้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.six-sigma-dmaic.p003
    topics: [management.quality.six-sigma-dmaic]
    difficulty: 1
    type: match
    stem: "จับคู่บทบาทในโครงการซิกซ์ซิกมากับหน้าที่"
    pairs:
      - { left: "ผู้สนับสนุน (champion)", right: "อนุมัติโครงการ จัดทรัพยากร และแก้อุปสรรคข้ามฝ่าย" }
      - { left: "แบล็กเบลต์", right: "นำโครงการใหญ่เต็มเวลาและเป็นพี่เลี้ยงด้านสถิติ" }
      - { left: "กรีนเบลต์", right: "นำโครงการในงานของตนควบคู่กับงานประจำ" }
      - { left: "เจ้าของกระบวนการ", right: "รับช่วงดูแลกระบวนการและแผนควบคุมหลังปิดโครงการ" }
    hints:
      - "ผู้ที่มีอำนาจจัดสรรทรัพยากรคือผู้สนับสนุน"
      - "ผู้ที่อยู่กับกระบวนการต่อไปหลังโครงการจบคือเจ้าของกระบวนการ"
    solution: "ผู้สนับสนุนเปิดทาง แบล็กเบลต์นำโครงการใหญ่ กรีนเบลต์นำโครงการในงานตน และเจ้าของกระบวนการรักษาผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.six-sigma-dmaic.p004
    topics: [management.quality.six-sigma-dmaic]
    difficulty: 2
    type: numeric
    stem: "ฝ่ายบัญชีของโรงพยาบาลเอกชน (สมมติ) ตรวจใบแจ้งหนี้ 2,000 ใบ แต่ละใบมีโอกาสผิด 5 จุด (ชื่อ รหัสสิทธิ ยอดเงิน วันที่ ลายมือชื่อ) พบข้อผิดพลาดรวม 37 จุด DPMO เป็นเท่าไร"
    answer: { value: 3700 }
    hints:
      - "DPMO = ข้อบกพร่อง ÷ (หน่วย × โอกาสต่อหน่วย) × 1,000,000"
      - "จำนวนโอกาสทั้งหมด = 2,000 × 5"
    misconceptions:
      - { match: 18500, feedback: "ไม่ได้คูณจำนวนโอกาสต่อหน่วย นั่นคือข้อบกพร่องต่อล้านหน่วย (DPU × 10⁶)" }
      - { match: 0.0037, feedback: "นั่นคือ DPO ยังไม่ได้คูณ 1,000,000" }
    solution: "$37 \\div (2{,}000 \\times 5) \\times 10^6 = 37 \\div 10{,}000 \\times 10^6 = 3{,}700$ DPMO"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.six-sigma-dmaic.p005
    topics: [management.quality.six-sigma-dmaic]
    difficulty: 3
    type: numeric
    stem: "จากข้อก่อน DPMO = 3,700 ถ้าใช้ข้อตกลงการเลื่อนค่าเฉลี่ย 1.5σ ระดับซิกมาของกระบวนการเป็นเท่าไร"
    answer: { value: 4.18, tolerance: 0.02 }
    hints:
      - "หา z ที่พื้นที่หางขวาเท่ากับ 0.0037"
      - "แล้วบวก 1.5"
    misconceptions:
      - { match: 2.68, feedback: "ยังไม่ได้บวก 1.5 ตามข้อตกลงการเลื่อน ค่านี้คือ z ระยะยาว" }
      - { match: 1.18, feedback: "ลบ 1.5 แทนการบวก" }
    solution: "$P(Z > z) = 0.0037 \\Rightarrow z \\approx 2.68$ ระดับซิกมา $\\approx 2.68 + 1.5 = 4.18$ (ถ้าไม่ใช้ข้อตกลงนี้ต้องรายงาน 2.68 และบอกให้ชัด)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.six-sigma-dmaic.p006
    topics: [management.quality.six-sigma-dmaic]
    difficulty: 2
    type: numeric
    stem: "สายประกอบพัดลม (สมมติ) มีข้อบกพร่องเฉลี่ย 0.12 จุดต่อเครื่อง (DPU) ข้อบกพร่องเกิดแบบสุ่มตามการแจกแจงปัวซอง ร้อยละของเครื่องที่ไม่มีข้อบกพร่องเลยเป็นเท่าไร"
    answer: { value: 88.69, unit: "%", tolerance: 0.05 }
    hints:
      - "สัดส่วนที่ไม่มีข้อบกพร่อง $\\approx e^{-DPU}$"
      - "$e^{-0.12}$"
    misconceptions:
      - { match: 88, feedback: "ใช้ 1 − DPU ซึ่งเป็นค่าประมาณ ไม่คิดว่าเครื่องหนึ่งมีข้อบกพร่องได้หลายจุด" }
    solution: "$e^{-0.12} \\approx 0.8869$ หรือ $88.69\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.six-sigma-dmaic.p007
    topics: [management.quality.six-sigma-dmaic]
    difficulty: 2
    type: mcq
    stem: "ลูกค้าบอกว่า \"ถุงมือต้องไม่รั่ว ใส่แล้วมั่นใจ\" ข้อใดเป็น CTQ ที่ดีที่สุด"
    choices:
      - { id: a, text: "ไม่พบรูรั่วเมื่อทดสอบด้วยน้ำตามวิธีที่ตกลงกับลูกค้า โดยสัดส่วนไม่ผ่านไม่เกินค่าที่กำหนดต่อล็อต", correct: true }
      - { id: b, text: "ถุงมือมีคุณภาพดี", feedback: "ยังเป็นคำกว้าง ๆ วัดไม่ได้" }
      - { id: c, text: "พนักงานตั้งใจทำงาน", feedback: "เป็นพฤติกรรมของพนักงาน ไม่ใช่ลักษณะของผลิตภัณฑ์ที่ลูกค้ารับรู้" }
      - { id: d, text: "ลดต้นทุนการผลิต 10%", feedback: "เป็นเป้าหมายของธุรกิจ ไม่ใช่สิ่งที่ลูกค้าต้องการจากถุงมือ" }
    hints:
      - "CTQ ต้องวัดได้และมาจากเสียงลูกค้า"
      - "มีวิธีวัดและเกณฑ์ผ่านไม่ผ่าน"
    solution: "CTQ ที่ดีแปลงความต้องการของลูกค้าเป็นสิ่งที่วัดได้ มีวิธีทดสอบและเกณฑ์ชัดเจน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.six-sigma-dmaic.p008
    topics: [management.quality.six-sigma-dmaic]
    difficulty: 3
    type: numeric
    stem: "จากผังกระบวนการผลิตถุงมือในภาพ ผลได้ตลอดกระบวนการ (RTY) เป็นกี่เปอร์เซ็นต์"
    figure:
      src: p-rty.svg
      alt: "ผังกระบวนการสี่ขั้น จุ่มแม่พิมพ์ ผลได้ครั้งแรก 98% อบ 95% ถอดและตรวจ 99% นับและบรรจุ 97%"
    answer: { value: 89.4, unit: "%", tolerance: 0.05 }
    hints:
      - "RTY = ผลคูณของผลได้ครั้งแรกทุกขั้น"
      - "0.98 × 0.95 × 0.99 × 0.97"
    misconceptions:
      - { match: 97.25, feedback: "เฉลี่ยผลได้สี่ขั้น ต้องคูณกันเพราะชิ้นงานต้องผ่านทุกขั้น" }
      - { match: 95, feedback: "ใช้ขั้นที่แย่ที่สุด แต่ความสูญเสียของขั้นอื่นก็ลด RTY ด้วย" }
    solution: "$0.98 \\times 0.95 \\times 0.99 \\times 0.97 \\approx 0.8940$ หรือ $89.40\\%$ ราว 10.6% ของชิ้นงานต้องแก้หรือทิ้งอย่างน้อยหนึ่งครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.six-sigma-dmaic.p009
    topics: [management.quality.six-sigma-dmaic]
    difficulty: 3
    type: mcq
    stem: "ทีมทดสอบว่าเครื่องจุ่มสองเครื่องมีสัดส่วนรูรั่วต่างกันหรือไม่ ได้ค่า $p = 0.31$ ที่ระดับนัยสำคัญ 0.05 ข้อสรุปใดถูกต้อง"
    choices:
      - { id: a, text: "ไม่มีหลักฐานเพียงพอว่าสองเครื่องต่างกัน ควรมองหาสาเหตุอื่นหรือเก็บข้อมูลเพิ่มถ้าสงสัยว่าตัวอย่างน้อยไป", correct: true }
      - { id: b, text: "พิสูจน์แล้วว่าสองเครื่องเหมือนกันทุกประการ", feedback: "การไม่ปฏิเสธ $H_0$ ไม่ได้พิสูจน์ว่า $H_0$ จริง แค่ยังไม่มีหลักฐานพอ" }
      - { id: c, text: "สองเครื่องต่างกันอย่างมีนัยสำคัญ", feedback: "$0.31 > 0.05$ จึงไม่ปฏิเสธ $H_0$" }
      - { id: d, text: "มีโอกาส 31% ที่สองเครื่องเหมือนกัน", feedback: "ค่า p คือความน่าจะเป็นที่จะได้ข้อมูลอย่างนี้หรือสุดโต่งกว่าเมื่อ $H_0$ จริง ไม่ใช่ความน่าจะเป็นที่ $H_0$ จริง" }
    hints:
      - "เทียบค่า p กับระดับนัยสำคัญ"
      - "ไม่ปฏิเสธ $H_0$ ไม่เท่ากับยอมรับว่าจริง"
    solution: "$0.31 > 0.05$ จึงไม่ปฏิเสธ $H_0$ ข้อมูลยังไม่พอบอกว่าต่างกัน ไม่ได้พิสูจน์ว่าเหมือนกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.six-sigma-dmaic.p010
    topics: [management.quality.six-sigma-dmaic]
    difficulty: 4
    type: numeric
    stem: "โรงงานขนมปัง (สมมติ) ก่อนปรับปรุงพบขนมปังเสียรูป 60 จาก 1,500 ก้อน หลังปรับปรุงพบ 30 จาก 1,500 ก้อน คำนวณสถิติทดสอบ $z$ ของการทดสอบผลต่างสองสัดส่วนแบบรวมสัดส่วน (ก่อน − หลัง)"
    answer: { value: 3.21, tolerance: 0.02 }
    hints:
      - "$\\hat p = (60 + 30)/(1{,}500 + 1{,}500)$"
      - "$z = (\\hat p_1 - \\hat p_2) / \\sqrt{\\hat p(1-\\hat p)(1/n_1 + 1/n_2)}$"
    misconceptions:
      - { match: -3.21, feedback: "ลบกลับด้าน โจทย์ให้ใช้ก่อนลบหลัง" }
      - { match: 0.02, feedback: "นั่นคือผลต่างของสัดส่วน ยังไม่ได้หารด้วยความคลาดเคลื่อนมาตรฐาน" }
    solution: "$\\hat p_1 = 0.04$, $\\hat p_2 = 0.02$, $\\hat p = 0.03$ $SE = \\sqrt{0.03 \\times 0.97 \\times (2/1{,}500)} \\approx 0.00623$ $z = 0.02/0.00623 \\approx 3.21$ ค่า $p$ ทางเดียวราว 0.0007 จึงสรุปได้ว่าลดลงจริง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.six-sigma-dmaic.p011
    topics: [management.quality.six-sigma-dmaic]
    difficulty: 4
    type: numeric
    stem: "ทีมเก็บข้อมูลความเข้มข้นสารจับตัว $x$ (%) กับรูรั่วต่อ 1,000 ชิ้น $y$ ได้ (8, 9.1), (10, 7.4), (12, 6.2), (14, 4.8), (16, 3.1) ใช้เส้นถดถอยกำลังสองน้อยที่สุดทำนาย $y$ เมื่อ $x = 15$"
    answer: { value: 3.93, unit: "ต่อ 1,000 ชิ้น", tolerance: 0.02 }
    hints:
      - "$b = \\sum (x - \\bar x)(y - \\bar y) / \\sum (x - \\bar x)^2$ โดย $\\bar x = 12$, $\\bar y = 6.12$"
      - "$a = \\bar y - b\\bar x$ แล้วแทน $x = 15$"
    misconceptions:
      - { match: 3.85, feedback: "ใช้ความชันจากจุดแรกกับจุดสุดท้ายเท่านั้น เส้นถดถอยต้องใช้ทุกจุด" }
      - { match: 4.8, feedback: "ใช้ค่าที่ $x = 14$ ในตาราง ไม่ได้ใช้สมการ" }
    solution: "$\\sum(x-\\bar x)(y-\\bar y) = -29.2$ $\\sum(x-\\bar x)^2 = 40$ $b = -0.73$ $a = 6.12 + 0.73(12) = 14.88$ $\\hat y = 14.88 - 0.73(15) \\approx 3.93$ ($R^2 \\approx 0.997$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.six-sigma-dmaic.p012
    topics: [management.quality.six-sigma-dmaic]
    difficulty: 4
    type: mcq
    stem: "ต่อจากข้อก่อน สมการ $\\hat y = 14.88 - 0.73x$ มี $R^2 \\approx 0.997$ หัวหน้ากะเสนอให้ใช้ความเข้มข้น 22% เพราะสมการทำนายว่ารูรั่วจะติดลบ ข้อใดเป็นข้อโต้แย้งที่ดีที่สุด"
    choices:
      - { id: a, text: "ข้อมูลเก็บในช่วง 8–16% การทำนายที่ 22% อยู่นอกช่วงจึงเชื่อไม่ได้ และค่าติดลบเป็นไปไม่ได้ ควรทดลองยืนยันและดูผลข้างเคียงก่อน", correct: true }
      - { id: b, text: "$R^2$ สูงมาก จึงใช้ทำนายได้ทุกค่า", feedback: "$R^2$ บอกว่าเส้นเข้ากับข้อมูลในช่วงที่เก็บ ไม่ได้รับรองนอกช่วง" }
      - { id: c, text: "ความสัมพันธ์สูงพิสูจน์ว่าสารจับตัวเป็นสาเหตุเดียวของรูรั่ว", feedback: "สหสัมพันธ์ไม่ใช่หลักฐานของเหตุผลเพียงพอ และอาจมีปัจจัยอื่นร่วม" }
      - { id: d, text: "ควรเปลี่ยนเป็นสมการกำลังสองเพื่อให้ได้ค่าบวก", feedback: "การเปลี่ยนรูปสมการไม่แก้ปัญหาการทำนายนอกช่วงข้อมูล" }
    hints:
      - "ข้อมูลอยู่ในช่วงใด"
      - "รูรั่วติดลบได้หรือไม่"
    solution: "การถดถอยใช้ทำนายได้ในช่วงข้อมูลเท่านั้น นอกช่วงความสัมพันธ์อาจเปลี่ยน และสารจับตัวที่มากเกินอาจทำให้เกิดปัญหาอื่น ต้องทดลองยืนยัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.six-sigma-dmaic.p013
    topics: [management.quality.six-sigma-dmaic]
    difficulty: 4
    type: numeric
    stem: "โรงงานขนมปัง (สมมติ) ทดลอง 2² ปัจจัย A อุณหภูมิเตา B ความชื้นห้องหมัก ค่าเฉลี่ยก้อนเสียรูปต่อ 1,000 ก้อน (A, B) = (−, −) 20, (+, −) 14, (−, +) 18, (+, +) 6 ผลหลักของ A เป็นเท่าไร"
    answer: { value: -9 }
    hints:
      - "ผลหลัก A = ค่าเฉลี่ยเมื่อ A สูง − ค่าเฉลี่ยเมื่อ A ต่ำ"
