id: physics.kinematics.speed
subject: physics
title: { th: ระยะทางและอัตราเร็ว, en: Distance and speed }
summary: อัตราเร็วบอกว่าวัตถุเคลื่อนที่ได้ระยะทางเท่าใดในหนึ่งหน่วยเวลา และอัตราเร็วเฉลี่ยคือระยะทางรวมหารด้วยเวลารวม ไม่ใช่ค่าเฉลี่ยของอัตราเร็ว
difficulty: 3
minutes: 25
prerequisites: [physics.units.si, math.algebra.linear-eq]
encompasses:
  - { id: physics.units.si, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: cyclist-distance-time.svg
    alt: "กราฟระยะทาง (กิโลเมตร) กับเวลา (นาที) ของคนขี่จักรยาน ช่วง 1 จากนาทีที่ 0 ถึง 10 เส้นตรงชันขึ้นจาก 0 ถึง 3 km ช่วง 2 จากนาทีที่ 10 ถึง 15 เส้นราบที่ 3 km แปลว่าหยุด ช่วง 3 จากนาทีที่ 15 ถึง 25 เส้นตรงชันน้อยกว่าจาก 3 ถึง 5 km"
    caption: "ความชันของกราฟระยะทางกับเวลาคืออัตราเร็ว เส้นราบคือหยุดนิ่ง"
  - type: worked-example
    title: อ่านอัตราเร็วจากกราฟระยะทางกับเวลา
    problem: "จากกราฟของคนขี่จักรยานด้านบน จงหาอัตราเร็วในช่วง 1 และช่วง 3 และอัตราเร็วเฉลี่ยตลอด 25 นาที ในหน่วย km/h"
    steps:
      - text: "ช่วง 1: ไปได้ $3\\ \\mathrm{km}$ ใน $10$ นาที $= \\tfrac{10}{60}\\ \\mathrm{h}$ ได้ $v_1 = \\dfrac{3}{1/6} = 18\\ \\mathrm{km/h}$"
        why: "อัตราเร็วคือความชัน $\\dfrac{\\Delta s}{\\Delta t}$ ต้องเปลี่ยนนาทีเป็นชั่วโมงก่อน เพราะต้องการคำตอบเป็น km/h"
      - text: "ช่วง 2: เส้นราบ ระยะทางไม่เพิ่ม อัตราเร็วเป็น $0$ (หยุดพัก 5 นาที)"
      - text: "ช่วง 3: ไปได้ $5 - 3 = 2\\ \\mathrm{km}$ ใน $10$ นาที ได้ $v_3 = \\dfrac{2}{1/6} = 12\\ \\mathrm{km/h}$"
      - text: "อัตราเร็วเฉลี่ย: ระยะทางรวม $5\\ \\mathrm{km}$ เวลารวม $25$ นาที $= \\tfrac{25}{60}\\ \\mathrm{h}$ ได้ $v_{\\mathrm{av}} = \\dfrac{5}{25/60} = 12\\ \\mathrm{km/h}$"
        why: "ต้องนับเวลาที่หยุดพักด้วย เพราะอัตราเร็วเฉลี่ยใช้เวลารวมทั้งเที่ยว"
    answer: "ช่วง 1: $18\\ \\mathrm{km/h}$ · ช่วง 3: $12\\ \\mathrm{km/h}$ · เฉลี่ยตลอดทาง: $12\\ \\mathrm{km/h}$"
  - { type: check, problem: phy.speed.p013, prompt: "ลองอ่านความชันจากกราฟอีกกราฟหนึ่ง" }
  - type: worked-example
    title: รถยนต์แซงรถบรรทุกใช้เวลาเท่าใด
    problem: "รถยนต์ยาว $4.5\\ \\mathrm{m}$ วิ่ง $90\\ \\mathrm{km/h}$ แซงรถบรรทุกยาว $15.5\\ \\mathrm{m}$ ที่วิ่ง $72\\ \\mathrm{km/h}$ ทางเดียวกัน รถยนต์เริ่มแซงเมื่อหน้ารถยนต์อยู่หลังท้ายรถบรรทุก $10\\ \\mathrm{m}$ และแซงเสร็จเมื่อท้ายรถยนต์อยู่หน้ารถบรรทุก $10\\ \\mathrm{m}$ การแซงใช้เวลาเท่าใด และรถยนต์วิ่งไปได้ไกลเท่าใดในช่วงนั้น"
    steps:
      - text: "แปลงหน่วย: $90\\ \\mathrm{km/h} = 25\\ \\mathrm{m/s}$ และ $72\\ \\mathrm{km/h} = 20\\ \\mathrm{m/s}$"
      - text: "วิ่งทางเดียวกัน อัตราเร็วสัมพัทธ์ $= 25 - 20 = 5\\ \\mathrm{m/s}$"
        why: "เทียบกับรถบรรทุก รถยนต์ขยับไปข้างหน้าเพียงวินาทีละ $5\\ \\mathrm{m}$"
      - text: "ระยะที่รถยนต์ต้องขยับเทียบกับรถบรรทุก: $10 + 15.5 + 10 + 4.5 = 40\\ \\mathrm{m}$"
        why: "นับตั้งแต่หน้ารถยนต์อยู่หลังรถบรรทุก จนท้ายรถยนต์พ้นหน้ารถบรรทุกไปอีก $10\\ \\mathrm{m}$ จึงต้องรวมความยาวของรถทั้งสองคัน"
      - text: "เวลา: $t = \\dfrac{40\\ \\mathrm{m}}{5\\ \\mathrm{m/s}} = 8\\ \\mathrm{s}$"
      - text: "ระยะที่รถยนต์วิ่งบนถนน: $s = 25 \\times 8 = 200\\ \\mathrm{m}$"
    answer: "ใช้เวลา $8\\ \\mathrm{s}$ และรถยนต์วิ่งไป $200\\ \\mathrm{m}$ ถนนข้างหน้าจึงต้องโล่งมากกว่านั้นมากก่อนแซง"
  - { type: check, problem: phy.speed.p015 }
glossary:
  - { term: ระยะทาง, definition: "ความยาวของเส้นทางที่วัตถุเคลื่อนที่ไปจริง ไม่สนทิศทาง มีหน่วยเมตร (m)" }
  - { term: อัตราเร็ว, definition: "ระยะทางที่เคลื่อนที่ได้ในหนึ่งหน่วยเวลา $v = s/t$ มีหน่วยเมตรต่อวินาที (m/s)" }
  - { term: อัตราเร็วเฉลี่ย, definition: "ระยะทางรวมหารด้วยเวลารวมของการเดินทางทั้งหมด" }
  - { term: อัตราเร็วขณะหนึ่ง, definition: "อัตราเร็ว ณ เวลาใดเวลาหนึ่ง เช่น ค่าที่เข็มมาตรวัดบนหน้าปัดรถชี้อยู่" }
flashcards:
  - { front: "สูตรอัตราเร็ว", back: "$v = \\dfrac{s}{t}$ เมื่อ $s$ คือระยะทาง (m) และ $t$ คือเวลา (s)" }
  - { front: "อัตราเร็วเฉลี่ยหาอย่างไร", back: "ระยะทางรวม ÷ เวลารวม ห้ามเอาอัตราเร็วแต่ละช่วงมาบวกแล้วหาร 2" }
  - { front: "วิ่ง 400 m ใน 80 s มีอัตราเร็วเฉลี่ยเท่าใด", back: "$400\\ \\mathrm{m} \\div 80\\ \\mathrm{s} = 5\\ \\mathrm{m/s}$" }
  - { front: "มาตรวัดบนหน้าปัดรถบอกอัตราเร็วแบบไหน", back: "อัตราเร็วขณะหนึ่ง ไม่ใช่อัตราเร็วเฉลี่ยตลอดทาง" }
