  - id: engineering.mechanics.shear-moment.p016
    topics: [engineering.mechanics.shear-moment]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการวาดแผนภาพแรงเฉือนและโมเมนต์ดัดด้วยวิธีพื้นที่"
    items:
      - "วาดแผนภาพวัตถุอิสระและหาแรงปฏิกิริยา"
      - "เริ่มแผนภาพ V จากปลายซ้าย ใส่การกระโดดที่แรงจุด และความชันเท่ากับ −w ในช่วงแรงกระจาย"
      - "หาตำแหน่งที่ V = 0"
      - "สร้างแผนภาพ M โดยบวกพื้นที่ใต้กราฟ V ทีละช่วง และใส่การกระโดดที่คู่ควบ"
      - "ตรวจว่า M ที่ปลายขวาตรงกับเงื่อนไขของฐานรองรับ"
    hints:
      - "แผนภาพ $V$ ต้องมาก่อน $M$"
      - "การตรวจที่ปลายขวาบอกว่าคำนวณสะสมมาถูกหรือไม่"
    solution: "แรงปฏิกิริยา → แผนภาพ $V$ (กระโดดที่แรงจุด ความชัน $-w$) → ตำแหน่ง $V = 0$ → แผนภาพ $M$ จากพื้นที่ใต้ $V$ → ตรวจค่าที่ปลาย (ฐานหมุนหรือปลายอิสระ $M = 0$)"
