topic: computer.networks.addressing-routing
rows:
  - { framework: csta-k12-cs-2026, indicators: ["S1-CYB-ND-02"], coverage: full, note: "แบบจำลอง OSI เจ็ดชั้นและหน้าที่ของอุปกรณ์ชั้นลิงก์ข้อมูลและชั้นเครือข่าย (สวิตช์ เราเตอร์) บทเรียนและโจทย์ p002 p003" }
  - { framework: csta-k12-cs-2026, indicators: ["S1-CYB-ND-03"], coverage: partial, note: "แยกเครือข่ายตามที่อยู่ (IPv4 ส่วนตัวกับสาธารณะ ลิงก์โลคัล IPv6) และตามโพรโทคอล (DHCP NAT RIP OSPF แบบภาพรวม) แต่ยังไม่สอนโทโพโลยี (ดาว บัส ตาข่าย) จึงเป็นบางส่วน" }
  - { framework: csta-k12-cs-2026, indicators: ["S1-CYB-NO-05"], coverage: partial, note: "สอนลำดับการวินิจฉัยด้วย ipconfig ping traceroute nslookup และตรวจทีละชั้น แต่ผู้เรียนไม่ได้ลงมือกับเครือข่ายจริงในแอป" }
  - { framework: csta-k12-cs-2026, indicators: ["HS-SYS-NT-34"], coverage: partial, note: "อ่านและวิเคราะห์แผนผังเครือข่ายโรงเรียนสองซับเน็ต (ภาพ school-network) แต่ไม่ได้วาดแผนผังเอง เพราะแอปไม่มีตัวแก้ไขแผนผัง" }
  - { framework: acm-cs2023, indicators: ["NC-Routing"], coverage: partial, note: "สอน CIDR การคำนวณซับเน็ต การเลือกเส้นทางแบบ longest prefix match และแนวคิดเวกเตอร์ระยะทางกับสถานะลิงก์ ระดับแนะนำ ไม่รวมอัลกอริทึมเส้นทางเชิงลึกและการกำหนดค่าโพรโทคอลจริง" }
