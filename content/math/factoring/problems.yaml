problems:
  - id: math.fac.p001
    topics: [ math.algebra.factoring ]
    difficulty: 1
    type: expression
    stem: "แยกตัวประกอบ $6x + 9$ โดยดึงตัวร่วมออก"
    hints:
      - "หา ห.ร.ม. ของ 6 กับ 9"
      - "ห.ร.ม. คือ 3 ให้หารทั้ง $6x$ และ $9$ ด้วย 3 แล้วเขียนผลไว้ในวงเล็บ"
    misconceptions:
      - { match: "3(2x+9)", feedback: "ดึง 3 ออกจาก $6x$ แล้ว แต่ต้องดึงออกจาก 9 ด้วย $9 \\div 3 = 3$ ลองกระจายกลับดู $3(2x + 9) = 6x + 27$" }
    solution: "ห.ร.ม. ของ 6 และ 9 คือ 3 จึงได้ $6x + 9 = 3(2x) + 3(3) = 3(2x + 3)$ ตรวจ: $3 \\cdot 2x + 3 \\cdot 3 = 6x + 9$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true
    factored: true
    answer: { latex: 3(2x+3), variables: [ x ] }

  - id: math.fac.p002
    topics: [ math.algebra.factoring ]
    difficulty: 1
    type: mcq
    stem: "ตัวร่วมที่มากที่สุด (ห.ร.ม.) ของ $12x^2$ และ $18x$ คือข้อใด"
    choices:
      - { id: a, text: "$6x$", correct: true }
      - { id: b, text: "$6$", feedback: "6 หารทั้งสองพจน์ลงตัวจริง แต่ทั้งสองพจน์ยังมี $x$ ร่วมกันอีกอย่างน้อยหนึ่งตัว ต้องดึง $x$ ออกมาด้วย" }
      - { id: c, text: "$3x$", feedback: "$3x$ เป็นตัวร่วม แต่ไม่ใช่ตัวร่วมที่มากที่สุด เพราะ 6 ก็หาร 12 และ 18 ลงตัว" }
      - { id: d, text: "$36x^2$", feedback: "นั่นคือ ค.ร.น. (ตัวคูณร่วมน้อย) ตัวร่วมต้องหารทุกพจน์ลงตัว จึงต้องไม่ใหญ่กว่าพจน์ใด" }
    hints:
      - "แยกเป็นส่วนตัวเลขกับส่วนตัวแปร"
      - "หา ห.ร.ม. ของ 12 กับ 18 แล้วดูว่า $x$ ซ้ำกันกี่ตัวในทั้งสองพจน์"
    solution: "ห.ร.ม. ของ 12 และ 18 คือ 6 ส่วนตัวแปร $x^2$ กับ $x$ มี $x$ ร่วมกัน 1 ตัว จึงได้ $6x$ และ $12x^2 + 18x = 6x(2x + 3)$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.fac.p003
    topics: [ math.algebra.factoring ]
    difficulty: 2
    type: expression
    stem: "แยกตัวประกอบ $x^2 + 7x + 12$"
    hints:
      - "หาจำนวนสองจำนวนที่คูณกันได้ 12 และบวกกันได้ 7"
      - "ไล่คู่ที่คูณกันได้ 12: 1 กับ 12, 2 กับ 6, 3 กับ 4 แล้วดูว่าคู่ไหนบวกกันได้ 7"
    misconceptions:
      - { match: "(x+2)(x+6)", feedback: "2 กับ 6 คูณกันได้ 12 ถูก แต่บวกกันได้ 8 ไม่ใช่ 7 กระจายกลับจะได้ $x^2 + 8x + 12$" }
      - { match: "(x+1)(x+12)", feedback: "1 กับ 12 คูณกันได้ 12 แต่บวกกันได้ 13 ต้องหาคู่ที่บวกกันได้ 7" }
    solution: "3 กับ 4 คูณกันได้ 12 และบวกกันได้ 7 จึงได้ $x^2 + 7x + 12 = (x + 3)(x + 4)$ ตรวจ: $x^2 + 4x + 3x + 12$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true
    factored: true
    answer: { latex: (x+3)(x+4), variables: [ x ] }

  - id: math.fac.p004
    topics: [ math.algebra.factoring ]
    difficulty: 2
    type: match
    stem: "จับคู่พหุนามกับผลการแยกตัวประกอบ"
    pairs:
      - { left: "$x^2 - 9$", right: "$(x + 3)(x - 3)$" }
      - { left: "$x^2 + 6x + 9$", right: "$(x + 3)^2$" }
      - { left: "$x^2 - 6x + 9$", right: "$(x - 3)^2$" }
      - { left: "$x^2 + 2x - 3$", right: "$(x + 3)(x - 1)$" }
    hints:
      - "พหุนามที่มีแค่สองพจน์และเป็นการลบ ให้นึกถึงผลต่างกำลังสอง"
      - "ดูเครื่องหมายของพจน์กลาง: $+6x$ มาจาก $(x + 3)^2$ ส่วน $-6x$ มาจาก $(x - 3)^2$"
      - "ถ้ายังไม่แน่ใจ ให้กระจายตัวเลือกทางขวาแต่ละตัวแล้วเทียบกับทางซ้าย"
    solution: "$x^2 - 9 = (x + 3)(x - 3)$ (ผลต่างกำลังสอง) · $x^2 + 6x + 9 = (x + 3)^2$ · $x^2 - 6x + 9 = (x - 3)^2$ · $x^2 + 2x - 3 = (x + 3)(x - 1)$ เพราะ $3 \\times (-1) = -3$ และ $3 + (-1) = 2$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.fac.p005
    topics: [ math.algebra.factoring ]
    difficulty: 3
    type: expression
    stem: "แยกตัวประกอบ $x^2 - 2x - 15$"
    hints:
      - "หาจำนวนสองจำนวนที่คูณกันได้ $-15$ และบวกกันได้ $-2$"
      - "ผลคูณเป็นลบ แปลว่าสองจำนวนมีเครื่องหมายต่างกัน"
      - "ไล่คู่ 1 กับ 15 และ 3 กับ 5 แล้วเลือกว่าตัวไหนเป็นลบเพื่อให้ผลบวกเป็น $-2$"
    misconceptions:
      - { match: "(x+5)(x-3)", feedback: "ตัวเลขถูกแล้วแต่เครื่องหมายสลับ $(x + 5)(x - 3)$ กระจายได้ $x^2 + 2x - 15$ ต้องให้ตัวที่ใหญ่กว่าเป็นลบ" }
      - { match: "(x-5)(x-3)", feedback: "$(-5)(-3) = +15$ ไม่ใช่ $-15$ ผลคูณเป็นลบ สองจำนวนต้องมีเครื่องหมายต่างกัน" }
    solution: "$3 \\times (-5) = -15$ และ $3 + (-5) = -2$ จึงได้ $x^2 - 2x - 15 = (x + 3)(x - 5)$ ตรวจ: $x^2 - 5x + 3x - 15 = x^2 - 2x - 15$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true
    factored: true
    answer: { latex: (x-5)(x+3), variables: [ x ] }

  - id: math.fac.p006
    topics: [ math.algebra.factoring ]
    difficulty: 3
    type: expression
    stem: "แยกตัวประกอบ $4x^2 - 25$"
    hints:
      - "นิพจน์นี้อยู่ในรูป $a^2 - b^2$"
      - "เขียน $4x^2$ และ $25$ เป็นกำลังสองของอะไร"
      - "ใช้ $a^2 - b^2 = (a + b)(a - b)$ โดย $a$ คือรากที่สองของ $4x^2$"
    misconceptions:
      - { match: "(4x+5)(4x-5)", feedback: "$(4x)^2 = 16x^2$ ไม่ใช่ $4x^2$ ต้องหารากที่สองของสัมประสิทธิ์ด้วย $\\sqrt{4} = 2$" }
      - { match: "(2x-5)^2", feedback: "$(2x - 5)^2 = 4x^2 - 20x + 25$ มีพจน์กลางเกินมา ผลต่างกำลังสองแยกเป็นวงเล็บบวกหนึ่งวงและลบหนึ่งวง" }
    solution: "$4x^2 - 25 = (2x)^2 - 5^2 = (2x + 5)(2x - 5)$ ตรวจ: $4x^2 - 10x + 10x - 25 = 4x^2 - 25$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true
    factored: true
    answer: { latex: (2x+5)(2x-5), variables: [ x ] }

  - id: math.fac.p007
    topics: [ math.algebra.factoring ]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นกำลังสองสมบูรณ์ (เลือกได้มากกว่าหนึ่งข้อ)"
    choices:
      - { id: a, text: "$x^2 + 10x + 25$", correct: true }
      - { id: b, text: "$4x^2 - 12x + 9$", correct: true }
      - { id: c, text: "$x^2 + 6x + 36$", feedback: "$36 = 6^2$ ก็จริง แต่พจน์กลางต้องเป็น $2 \\times x \\times 6 = 12x$ ไม่ใช่ $6x$" }
      - { id: d, text: "$x^2 - 8x - 16$", feedback: "พจน์สุดท้ายของกำลังสองสมบูรณ์ต้องเป็นบวกเสมอ เพราะ $b^2 \\geq 0$ ส่วน $(x - 4)^2 = x^2 - 8x + 16$" }
    hints:
      - "กำลังสองสมบูรณ์มีรูป $a^2 \\pm 2ab + b^2$"
      - "ตรวจว่าพจน์แรกและพจน์สุดท้ายเป็นกำลังสองที่เป็นบวก แล้วตรวจว่าพจน์กลางเท่ากับ $2ab$ หรือไม่"
    solution: "$x^2 + 10x + 25 = (x + 5)^2$ เพราะ $2(x)(5) = 10x$ · $4x^2 - 12x + 9 = (2x - 3)^2$ เพราะ $2(2x)(3) = 12x$ · $x^2 + 6x + 36$ ต้องมีพจน์กลาง $12x$ · $x^2 - 8x - 16$ มีพจน์สุดท้ายเป็นลบ จึงไม่ใช่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.fac.p008
    topics: [ math.algebra.factoring ]
    difficulty: 4
    type: expression
    stem: "แยกตัวประกอบ $2x^2 + 7x + 3$"
    hints:
      - "คูณ $a \\times c = 2 \\times 3$ แล้วหาจำนวนสองจำนวนที่คูณกันได้ผลนั้นและบวกกันได้ 7"
      - "แยกพจน์กลาง $7x$ ออกเป็นสองพจน์ตามคู่จำนวนที่ได้"
      - "จับกลุ่มทีละสองพจน์ ดึงตัวร่วมของแต่ละกลุ่ม แล้วดึงวงเล็บที่เหมือนกันออก"
    misconceptions:
      - { match: "(2x+3)(x+1)", feedback: "ลองกระจายดู $(2x + 3)(x + 1) = 2x^2 + 5x + 3$ พจน์กลางเป็น $5x$ ตำแหน่งของ 3 กับ 1 สลับกัน" }
      - { match: "(x+1)(x+6)", feedback: "1 กับ 6 คือคู่ที่ใช้แยกพจน์กลาง ไม่ใช่ตัวประกอบโดยตรง เมื่อ $a \\neq 1$ ต้องจับกลุ่มต่ออีกขั้น" }
    solution: "$2 \\times 3 = 6$ หาคู่ที่คูณได้ 6 บวกได้ 7 คือ 1 กับ 6 · $2x^2 + x + 6x + 3 = x(2x + 1) + 3(2x + 1) = (2x + 1)(x + 3)$ ตรวจ: $2x^2 + 6x + x + 3 = 2x^2 + 7x + 3$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true
    factored: true
    answer: { latex: (2x+1)(x+3), variables: [ x ] }

  - id: math.fac.p009
    topics: [ math.algebra.factoring ]
    difficulty: 4
    type: order
    stem: "เรียงขั้นตอนการแยกตัวประกอบ $6x^2 + 11x + 4$ ให้ถูกต้อง"
    items:
      - "คูณ $a \\times c = 6 \\times 4 = 24$"
      - "หาคู่ที่คูณได้ 24 และบวกได้ 11 ได้ 3 กับ 8"
      - "แยกพจน์กลาง: $6x^2 + 3x + 8x + 4$"
      - "ดึงตัวร่วมทีละกลุ่ม: $3x(2x + 1) + 4(2x + 1)$"
      - "ดึง $(2x + 1)$ ออก: $(2x + 1)(3x + 4)$"
    hints:
      - "วิธีแยกพจน์กลางเริ่มจากหาผลคูณของสัมประสิทธิ์ตัวแรกกับค่าคงตัว"
      - "ต้องรู้คู่จำนวนก่อน จึงจะแยกพจน์กลางได้ และต้องแยกพจน์กลางก่อน จึงจะจับกลุ่มได้"
    solution: "$6 \\times 4 = 24$ → คู่ 3 กับ 8 ($3 \\times 8 = 24$, $3 + 8 = 11$) → $6x^2 + 3x + 8x + 4$ → $3x(2x + 1) + 4(2x + 1)$ → $(2x + 1)(3x + 4)$ ตรวจ: $6x^2 + 8x + 3x + 4$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.fac.p010
    topics: [ math.algebra.factoring ]
    difficulty: 4
    type: numeric
    stem: "ที่ดินแปลงหนึ่งในจังหวัดนครปฐมเป็นรูปสี่เหลี่ยมผืนผ้า มีพื้นที่ $x^2 + 9x + 20$ ตารางเมตร และกว้าง $x + 4$ เมตร ถ้า $x = 6$ ที่ดินแปลงนี้ยาวกี่เมตร (ตอบเป็นตัวเลขในหน่วยเมตร)"
    answer: { value: 11, unit: m }
    hints:
      - "พื้นที่ = กว้าง × ยาว ให้แยกตัวประกอบพื้นที่เพื่อหาด้านอีกด้าน"
      - "หาคู่ที่คูณได้ 20 บวกได้ 9 ตัวประกอบตัวหนึ่งต้องเป็น $x + 4$"
      - "เมื่อได้นิพจน์ของความยาวแล้ว จึงแทน $x = 6$"
    misconceptions:
      - { match: 10, feedback: "10 เมตรคือความกว้าง $x + 4$ โจทย์ถามความยาว ซึ่งเป็นตัวประกอบอีกตัว" }
      - { match: 110, feedback: "110 คือพื้นที่เป็นตารางเมตร โจทย์ถามความยาวของด้าน ให้แยกตัวประกอบก่อนแล้วจึงแทนค่า" }
    solution: "$x^2 + 9x + 20 = (x + 4)(x + 5)$ ความกว้างคือ $x + 4$ ความยาวจึงเป็น $x + 5 = 6 + 5 = 11$ เมตร ตรวจ: กว้าง 10 m ยาว 11 m พื้นที่ $110\\ \\mathrm{m^2}$ และ $6^2 + 9(6) + 20 = 110$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.fac.p011
    topics: [ math.algebra.factoring ]
    difficulty: 4
    type: numeric
    stem: "ร้านทำป้ายตัดแผ่นอะคริลิกรูปสี่เหลี่ยมจัตุรัสด้านยาว 87 เซนติเมตร แล้วเจาะช่องสี่เหลี่ยมจัตุรัสด้านยาว 13 เซนติเมตรออกตรงกลาง เหลือพื้นที่อะคริลิกกี่ตารางเซนติเมตร ลองใช้ผลต่างกำลังสองคิดในใจ (ตอบเป็นตัวเลขในหน่วยตารางเซนติเมตร)"
    answer: { value: 7400, unit: "cm^2" }
    hints:
      - "พื้นที่ที่เหลือคือ $87^2 - 13^2$"
      - "ใช้ $a^2 - b^2 = (a + b)(a - b)$ โดย $a = 87$ และ $b = 13$"
    misconceptions:
      - { match: 5476, feedback: "นั่นคือ $(87 - 13)^2 = 74^2$ แต่ $a^2 - b^2$ ไม่เท่ากับ $(a - b)^2$ ต้องใช้ $(a + b)(a - b)$" }
      - { match: 74, feedback: "74 คือ $87 - 13$ ซึ่งเป็นแค่ตัวประกอบตัวหนึ่ง ยังต้องคูณด้วย $87 + 13$" }
    solution: "$87^2 - 13^2 = (87 + 13)(87 - 13) = 100 \\times 74 = 7400$ ตารางเซนติเมตร ตรวจ: $7569 - 169 = 7400$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.fac.p012
    topics: [ math.algebra.factoring ]
    difficulty: 5
    type: numeric
    stem: "บ่อเลี้ยงปลานิลรูปสี่เหลี่ยมจัตุรัสมีพื้นที่ $x^2 + 14x + 49$ ตารางเมตร ถ้า $x = 5$ ต้องใช้ตาข่ายล้อมรอบบ่อยาวกี่เมตร (ตอบเป็นตัวเลขในหน่วยเมตร)"
    answer: { value: 48, unit: m }
    hints:
      - "พื้นที่ของสี่เหลี่ยมจัตุรัสคือ (ด้าน)$^2$ ให้เขียนพื้นที่เป็นกำลังสองสมบูรณ์"
      - "$49 = 7^2$ และ $14x = 2 \\times x \\times 7$"
      - "ได้ความยาวด้านแล้ว แทน $x = 5$ แล้วคูณ 4 เพื่อหาความยาวรอบรูป"
    misconceptions:
      - { match: 12, feedback: "12 เมตรคือความยาวด้านเดียว ตาข่ายต้องล้อมครบ 4 ด้าน" }
      - { match: 144, feedback: "144 คือพื้นที่เป็นตารางเมตร โจทย์ถามความยาวรอบบ่อ" }
    solution: "$x^2 + 14x + 49 = (x + 7)^2$ ด้านยาว $x + 7 = 12$ เมตร ความยาวรอบรูป $4 \\times 12 = 48$ เมตร ตรวจ: พื้นที่ $12^2 = 144$ และ $25 + 70 + 49 = 144$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.fac.p013
    topics: [ math.algebra.factoring ]
    difficulty: 5
    type: text
    stem: "แยกตัวประกอบ $3x^3 - 12x$ ให้ละเอียดที่สุด (พิมพ์ เช่น 2x(x+1)(x-1))"
    accepted: [ "3x(x+2)(x-2)", "3x(x-2)(x+2)", "3(x+2)(x-2)x", "3x(x+2)(-2+x)" ]
    hints:
      - "เริ่มจากดึงตัวร่วมของทั้งสองพจน์ออกก่อน"
      - "หลังดึงตัวร่วม สิ่งที่อยู่ในวงเล็บยังแยกต่อได้อีก"
      - "ใช้ผลต่างกำลังสองกับนิพจน์ในวงเล็บ"
    misconceptions:
      - { match: "3x(x^2-4)", feedback: "ดึงตัวร่วมถูกแล้ว แต่ $x^2 - 4$ เป็นผลต่างกำลังสอง ยังแยกต่อได้อีก" }
      - { match: "3(x^3-4x)", feedback: "ทั้งสองพจน์ยังมี $x$ ร่วมกัน ต้องดึง $3x$ ออก ไม่ใช่แค่ 3" }
      - { match: "3x(x-2)^2", feedback: "$(x - 2)^2 = x^2 - 4x + 4$ ไม่ใช่ $x^2 - 4$ ผลต่างกำลังสองแยกเป็นวงเล็บบวกหนึ่งวงและลบหนึ่งวง" }
    solution: "$3x^3 - 12x = 3x(x^2 - 4) = 3x(x + 2)(x - 2)$ ตรวจด้วย $x = 1$: $3 - 12 = -9$ และ $3(1)(3)(-1) = -9$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.fac.p014
    topics: [ math.algebra.factoring ]
    difficulty: 2
    type: expression
    stem: "แยกตัวประกอบ $xy + 3x + 2y + 6$ โดยจับกลุ่มทีละสองพจน์"
    hints:
      - "สี่พจน์นี้ไม่มีตัวร่วมของทุกพจน์ ลองจับ $xy + 3x$ เป็นกลุ่มหนึ่ง และ $2y + 6$ เป็นอีกกลุ่ม"
      - "ดึง $x$ ออกจากกลุ่มแรกและดึง $2$ ออกจากกลุ่มหลัง วงเล็บที่เหลือควรเหมือนกัน"
      - "ดึงวงเล็บที่เหมือนกันออกมาเป็นตัวประกอบร่วม"
    misconceptions:
      - { match: "(x+3)(y+2)", feedback: "ลองกระจายดู $(x + 3)(y + 2) = xy + 2x + 3y + 6$ ไม่ตรงกับโจทย์ ตัวที่คูณ $x$ คือ $(y + 3)$ ไม่ใช่ $(y + 2)$" }
    solution: "$xy + 3x + 2y + 6 = x(y + 3) + 2(y + 3) = (x + 2)(y + 3)$ ตรวจ: $(x + 2)(y + 3) = xy + 3x + 2y + 6$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true
    factored: true
    answer: { latex: (x+2)(y+3), variables: [ x, y ] }

  - id: math.fac.p015
    topics: [ math.algebra.factoring ]
    difficulty: 2
    type: expression
    stem: "นำแผ่นพื้นที่ในภาพทั้งหมด (สี่เหลี่ยมจัตุรัส $x \\times x$ 1 แผ่น แผ่นยาว $x \\times 1$ 4 แผ่น และสี่เหลี่ยมจัตุรัส $1 \\times 1$ 3 แผ่น) มาเรียงต่อกันเป็นสี่เหลี่ยมผืนผ้าได้พอดี เขียนพื้นที่รวมในรูปผลคูณของด้านกว้างกับด้านยาว"
    figure: { src: tiles.svg, alt: "แผ่นพื้นที่สามชนิด: สี่เหลี่ยมจัตุรัสใหญ่ด้าน x หนึ่งแผ่น แผ่นยาวขนาด x คูณ 1 สี่แผ่น และสี่เหลี่ยมจัตุรัสเล็กด้าน 1 สามแผ่น วางแยกกันยังไม่ได้เรียงเป็นรูปสี่เหลี่ยม" }
    hints:
      - "พื้นที่รวมคือ $x^2 + 4x + 3$"
      - "แผ่น $1 \\times 1$ ทั้ง 3 แผ่นต้องอยู่มุมเดียวกัน เรียงเป็นสี่เหลี่ยมขนาด $1 \\times 3$ หรือ $3 \\times 1$ ได้เท่านั้น"
      - "หาสองจำนวนที่คูณกันได้ 3 และบวกกันได้ 4 แล้วเขียน $(x + p)(x + q)$"
    misconceptions:
      - { match: "(x+2)^2", feedback: "แบ่งแผ่นยาวข้างละ 2 แผ่นจะได้มุมที่ต้องใช้แผ่นเล็ก $2 \\times 2 = 4$ แผ่น แต่มีแค่ 3 แผ่น $(x + 2)^2 = x^2 + 4x + 4$" }
    solution: "พื้นที่รวม $x^2 + 4x + 3$ หาคู่ที่คูณได้ 3 และบวกได้ 4 คือ 1 กับ 3 จึงเรียงได้สี่เหลี่ยมกว้าง $x + 1$ ยาว $x + 3$ (แผ่นยาว 1 แผ่นด้านหนึ่ง 3 แผ่นอีกด้าน แผ่นเล็ก 3 แผ่นเติมมุม) พื้นที่ $= (x + 1)(x + 3)$"
    license: CC-BY-SA-4.0
    ai_assisted: true
    factored: true
    answer: { latex: (x+1)(x+3), variables: [ x ] }

  - id: math.fac.p016
    topics: [ math.algebra.factoring ]
    difficulty: 3
    type: expression
    stem: "แยกตัวประกอบ $-x^2 + x + 12$"
    hints:
      - "สัมประสิทธิ์ของ $x^2$ เป็นลบ ให้ดึง $-1$ ออกก่อน"
      - "ดึง $-1$ ออกแล้วทุกพจน์ในวงเล็บเปลี่ยนเครื่องหมาย ได้ $-(x^2 - x - 12)$"
      - "หาคู่ที่คูณได้ $-12$ และบวกได้ $-1$ แล้วอย่าลืมเครื่องหมายลบหน้าวงเล็บ"
    misconceptions:
      - { match: "(x-4)(x+3)", feedback: "$(x - 4)(x + 3) = x^2 - x - 12$ เป็นนิพจน์ตรงข้ามกับโจทย์ ต้องคงเครื่องหมายลบที่ดึงออกมาไว้ด้านหน้า" }
      - { match: "-(x+4)(x-3)", feedback: "เครื่องหมายสลับ $(x + 4)(x - 3) = x^2 + x - 12$ แต่ในวงเล็บต้องเป็น $x^2 - x - 12$ ตัวที่ใหญ่กว่าจึงเป็นลบ" }
    solution: "$-x^2 + x + 12 = -(x^2 - x - 12)$ หาคู่ที่คูณได้ $-12$ บวกได้ $-1$ คือ $-4$ กับ $3$ จึงได้ $-(x - 4)(x + 3)$ ตรวจด้วย $x = 0$: เดิมได้ $12$ และ $-(-4)(3) = 12$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true
    factored: true
    answer: { latex: "-(x-4)(x+3)", variables: [ x ] }

  - id: math.fac.p017
    topics: [ math.algebra.factoring ]
    difficulty: 3
    type: mcq
    stem: "กราฟของ $y = x^2 + 2x - 8$ ตัดแกน $x$ ที่จุดใด"
    choices:
      - { id: a, text: "$x = -4$ และ $x = 2$", correct: true }
      - { id: b, text: "$x = 4$ และ $x = -2$", feedback: "แยกตัวประกอบได้ $(x + 4)(x - 2)$ ถูกแล้ว แต่ต้องหาค่าที่ทำให้วงเล็บเป็นศูนย์ $x + 4 = 0$ ให้ $x = -4$ ไม่ใช่ $4$" }
      - { id: c, text: "$x = -8$ เท่านั้น", feedback: "$-8$ คือค่า $y$ เมื่อ $x = 0$ ซึ่งเป็นจุดตัดแกน $y$ จุดตัดแกน $x$ คือที่ $y = 0$" }
      - { id: d, text: "$x = 2$ และ $x = 4$", feedback: "$2 \\times 4 = 8$ แต่ค่าคงตัวเป็น $-8$ คู่จำนวนต้องมีเครื่องหมายต่างกัน ลองแทน $x = 4$: $16 + 8 - 8 = 16 \\ne 0$" }
    hints:
      - "จุดตัดแกน $x$ คือจุดที่ $y = 0$"
      - "แยกตัวประกอบ $x^2 + 2x - 8$ ให้เป็นผลคูณของสองวงเล็บ"
      - "ใช้สมบัติผลคูณเป็นศูนย์ ให้แต่ละวงเล็บเท่ากับศูนย์ แล้วแก้หา $x$"
    solution: "$x^2 + 2x - 8 = (x + 4)(x - 2)$ เพราะ $4 \\times (-2) = -8$ และ $4 + (-2) = 2$ ให้ $y = 0$: $x + 4 = 0$ หรือ $x - 2 = 0$ ได้ $x = -4$ หรือ $x = 2$ ตรวจ: $16 - 8 - 8 = 0$ และ $4 + 4 - 8 = 0$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.fac.p018
    topics: [ math.algebra.factoring ]
    difficulty: 4
    type: text
    stem: "แยกตัวประกอบ $x^4 - 16$ ให้ละเอียดที่สุดในจำนวนจริง (พิมพ์ เช่น (x^2+1)(x+1)(x-1))"
    accepted: [ "(x^2+4)(x+2)(x-2)", "(x^2+4)(x-2)(x+2)", "(x+2)(x-2)(x^2+4)", "(x-2)(x+2)(x^2+4)", "(x+2)(x^2+4)(x-2)", "(x-2)(x^2+4)(x+2)" ]
    hints:
      - "มอง $x^4$ เป็น $(x^2)^2$ และ $16$ เป็น $4^2$"
      - "ใช้ผลต่างกำลังสองครั้งแรกได้สองวงเล็บ แล้วดูว่าวงเล็บไหนยังเป็นผลต่างกำลังสองอีก"
      - "$x^2 + 4$ เป็นผลบวก แยกต่อในจำนวนจริงไม่ได้"
    misconceptions:
      - { match: "(x^2+4)(x^2-4)", feedback: "ขั้นแรกถูกแล้ว แต่ $x^2 - 4$ ยังเป็นผลต่างกำลังสอง แยกต่อเป็น $(x + 2)(x - 2)$ ได้" }
      - { match: "(x^2-4)(x^2+4)", feedback: "ขั้นแรกถูกแล้ว แต่ $x^2 - 4$ ยังเป็นผลต่างกำลังสอง แยกต่อเป็น $(x + 2)(x - 2)$ ได้" }
      - { match: "(x+2)^2(x-2)^2", feedback: "นั่นคือ $(x^2 - 4)^2 = x^4 - 8x^2 + 16$ มีพจน์กลางเกินมา" }
    solution: "$x^4 - 16 = (x^2)^2 - 4^2 = (x^2 + 4)(x^2 - 4) = (x^2 + 4)(x + 2)(x - 2)$ ส่วน $x^2 + 4 > 0$ เสมอ จึงไม่มีตัวประกอบเชิงเส้น ตรวจด้วย $x = 1$: $1 - 16 = -15$ และ $(5)(3)(-1) = -15$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.fac.p019
    topics: [ math.algebra.factoring ]
    difficulty: 4
    type: numeric
    stem: "นักเรียนโยนลูกบอลขึ้นจากดาดฟ้าอาคารเรียนที่สูง 15 เมตร ความสูงของลูกบอลจากพื้นคือ $h = -5t^2 + 10t + 15$ เมตร เมื่อเวลาผ่านไป $t$ วินาที ลูกบอลตกถึงพื้นเมื่อเวลาผ่านไปกี่วินาที (ตอบในหน่วยวินาที)"
    answer: { value: 3, unit: s }
    hints:
      - "ตกถึงพื้นแปลว่า $h = 0$"
      - "ดึงตัวร่วม $-5$ ออกก่อน แล้วแยกตัวประกอบนิพจน์ในวงเล็บ"
      - "ใช้สมบัติผลคูณเป็นศูนย์ แล้วเลือกเฉพาะคำตอบที่เวลาเป็นบวก"
    misconceptions:
      - { match: -1, feedback: "$t = -1$ ทำให้ $h = 0$ ก็จริง แต่เป็นเวลาก่อนโยน ซึ่งไม่มีความหมายในโจทย์นี้" }
      - { match: 2, feedback: "ที่ $t = 2$ ลูกบอลกลับมาอยู่ระดับดาดฟ้า ($h = 15$) ยังไม่ถึงพื้น ต้องแก้ $h = 0$" }
    solution: "$-5t^2 + 10t + 15 = 0$ → $-5(t^2 - 2t - 3) = 0$ → $-5(t - 3)(t + 1) = 0$ ได้ $t = 3$ หรือ $t = -1$ เวลาต้องเป็นบวก ลูกบอลถึงพื้นเมื่อ $t = 3$ วินาที ตรวจ: $-45 + 30 + 15 = 0$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.fac.p020
    topics: [ math.algebra.factoring ]
    difficulty: 2
    type: numeric
    stem: "ครูซื้อสมุดให้นักเรียน 52 เล่ม ราคาเล่มละ 48 บาท ใช้ $(50 + 2)(50 - 2)$ คิดในใจ ต้องจ่ายเงินกี่บาท (ตอบในหน่วยบาท)"
    answer: { value: 2496, unit: บาท }
    hints:
      - "$52 \\times 48 = (50 + 2)(50 - 2)$ อยู่ในรูป $(a + b)(a - b)$"
      - "$(a + b)(a - b) = a^2 - b^2$ หา $50^2$ กับ $2^2$ แล้วลบกัน"
    misconceptions:
      - { match: 2500, feedback: "$50^2 = 2500$ ถูกแล้ว แต่ยังต้องลบ $2^2 = 4$ ออก" }
      - { match: 2504, feedback: "$(a + b)(a - b) = a^2 - b^2$ ต้องลบ $b^2$ ไม่ใช่บวก" }
    solution: "$52 \\times 48 = (50 + 2)(50 - 2) = 50^2 - 2^2 = 2500 - 4 = 2496$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.fac.p021
    topics: [ math.algebra.factoring ]
    difficulty: 5
    type: mcq
    stem: "ข้อใดคือการแยกตัวประกอบ $x^4 - 5x^2 + 4$ ที่ละเอียดที่สุด"
    choices:
      - { id: a, text: "$(x + 1)(x - 1)(x + 2)(x - 2)$", correct: true }
      - { id: b, text: "$(x^2 - 1)(x^2 - 4)$", feedback: "ถูกต้องแต่ยังไม่ละเอียดที่สุด ทั้ง $x^2 - 1$ และ $x^2 - 4$ เป็นผลต่างกำลังสอง แยกต่อได้อีก" }
      - { id: c, text: "$(x^2 + 1)(x^2 + 4)$", feedback: "กระจายได้ $x^4 + 5x^2 + 4$ พจน์กลางเป็นบวก แต่โจทย์เป็น $-5x^2$ คู่จำนวนต้องเป็น $-1$ กับ $-4$" }
      - { id: d, text: "$(x - 1)^2(x - 2)^2$", feedback: "$(x - 1)^2(x - 2)^2$ มีพจน์ $x^3$ ด้วย (ลองแทน $x = -1$: ได้ $4 \\times 9 = 36$ แต่นิพจน์เดิมได้ $1 - 5 + 4 = 0$)" }
    hints:
      - "นิพจน์มีแค่ $x^4$, $x^2$ และค่าคงตัว ลองให้ $u = x^2$"
      - "$u^2 - 5u + 4$ แยกได้ด้วยคู่จำนวนที่คูณได้ 4 บวกได้ $-5$"
      - "แทน $u = x^2$ กลับ แล้วดูว่าแต่ละวงเล็บยังแยกต่อได้หรือไม่"
    solution: "ให้ $u = x^2$: $u^2 - 5u + 4 = (u - 1)(u - 4)$ แทนกลับ $(x^2 - 1)(x^2 - 4) = (x + 1)(x - 1)(x + 2)(x - 2)$ ตรวจด้วย $x = 3$: $81 - 45 + 4 = 40$ และ $(4)(2)(5)(1) = 40$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true
