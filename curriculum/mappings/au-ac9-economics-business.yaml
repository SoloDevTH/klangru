# หัวข้อในคลังกับ Australian Curriculum: Economics and Business V9.0 (ปี 7–10 และ sub-strand ของ HASS ปี 5–6)
# จับคู่จากเนื้อหาใน lesson.md และ problems.yaml จริง (ตรวจ 2026-10-24)
# หัวข้อที่มีไฟล์ครบ ณ วันที่จับคู่: business.accounting.equation, business.finance.break-even, management.principles.functions,
#   management.operations.lean, management.quality.qc-tools, management.quality.concepts
# business.accounting.equation และ management.quality.* ไม่มีแถว เพราะ AC9 ไม่มีเนื้อหาการบัญชีและการจัดการคุณภาพ
framework: au-ac9-economics-business
mappings:
  - topic: business.finance.break-even
    indicators: ["AC9HE8K05"]
    coverage: partial
    note: "ต้นทุนคงที่ ต้นทุนผันแปร จุดคุ้มทุน และกำไรเป้าหมาย ใช้วางแผนให้ธุรกิจบรรลุเป้าหมายทางการเงิน ยังไม่มีการทำงบประมาณของบุคคล"
  - topic: management.principles.functions
    indicators: ["AC9HE7K02"]
    coverage: partial
    note: "ธุรกิจคืออะไร รูปแบบการเป็นเจ้าของธุรกิจ และผู้มีส่วนได้ส่วนเสีย (ใช้กฎหมายไทย) ยังไม่อธิบายเหตุผลที่ธุรกิจมีอยู่ในระบบเศรษฐกิจ"
  - topic: management.operations.lean
    indicators: ["AC9HE10K05"]
    coverage: partial
    note: "ความสูญเปล่า 5ส ไคเซ็น เวลาแท็กต์ และผลิตภาพ เป็นกระบวนการที่ธุรกิจใช้เพิ่มผลิตภาพ ยังไม่มีการจัดการแรงงาน"
  - topic: business.econ.personal-budget
    indicators: [AC9HE8K05]
    coverage: full
    note: กระบวนการวางแผนและทำงบประมาณของบุคคลและครอบครัวแบบออมก่อนใช้ และแบ่งเป้าหมายการออมระยะสั้นและระยะยาวเป็นเป้ารายเดือน ฝั่งธุรกิจมีบางส่วนใน business.finance.break-even
  - topic: business.econ.scarcity-choice
    indicators: [AC9HS5K08, AC9HE7K01]
    coverage: full
    note: ทรัพยากรธรรมชาติ มนุษย์ และทุน และการใช้สนองความจำเป็นและความต้องการ
  - topic: business.stats.descriptive
    indicators: [AC9HE9S03]
    coverage: partial
    note: ตีความข้อมูลยอดขาย ราคา และดัชนี อธิบายแนวโน้มและผลของราคาต่อยอดขาย (p014) และใช้การกระจายประเมินความเสี่ยงต่อคำรับประกัน (p018) ยังไม่มีการพยากรณ์อย่างเป็นระบบ
  - topic: business.econ.consumer-rights
    indicators: [AC9HS6K08, AC9HE7K05]
    coverage: full
    note: ปัจจัยที่มีผลต่อการเลือกของผู้บริโภค และกลยุทธ์ตัดสินใจอย่างมีข้อมูลทั้งสินค้าและการเงิน (ราคาต่อหน่วย ส่วนลด การผ่อน ซื้อก่อนจ่ายทีหลัง)
  - topic: business.econ.money-banking
    indicators: [AC9HE9K01]
    coverage: partial
    note: บทบาทของภาคการเงิน (ตัวกลาง ระบบชำระเงิน การกำกับดูแล) และผลของอัตราดอกเบี้ยต่อการตัดสินใจของครัวเรือนและธุรกิจ (p014 p017) ใช้ระบบการเงินไทยแทนออสเตรเลีย ยังไม่ครอบคลุมผลต่อตลาดโลก
  - topic: business.entrepreneurship.business-plan
    indicators: [AC9HE7K03, AC9HE8K02, AC9HE9K04]
    coverage: full
    note: ลักษณะของผู้ประกอบการ (สร้างสรรค์ กล้าเสี่ยงอย่างมีเหตุผล มุ่งมั่น ซื่อสัตย์ บริหารเงิน) และผลต่อความสำเร็จของธุรกิจ (p001 p016)
  - topic: business.econ.circular-flow
    indicators: [AC9HE7K04, AC9HE9K02]
    coverage: full
    note: เหตุผลที่คนทำงาน ประเภทงาน (ลูกจ้าง ธุรกิจส่วนตัว รับจ้างอิสระ งานไม่ได้ค่าจ้าง) และแหล่งรายได้จากปัจจัยการผลิตและเงินโอน (p002 p003 p005)
  - topic: business.econ.saving-investment
    indicators: [AC9HE9K05]
    coverage: full
    note: "บุคคลและธุรกิจจัดการความเสี่ยงและผลตอบแทน: ผลตอบแทนที่คาดหวังและพิสัย การกระจายความเสี่ยง เงินสำรองฉุกเฉิน ประกันภัย สัญญาณการหลอกลวง และร้านกาแฟกระจายลูกค้าและผู้ขาย (p011 p012 p013 p014 p016 p018 p019)"
  - topic: management.hr.human-resource-management
    indicators: [AC9HE10K05]
    coverage: partial
    note: กระบวนการจัดการกำลังคนและผลิตภาพ ยังไม่ได้สอนบทบาทของผู้ประกอบการ
  - topic: management.strategy.strategic-management
    indicators: [AC9HE9K04]
    coverage: full
    note: ความได้เปรียบในการแข่งขัน กลยุทธ์ทั่วไปของพอร์เตอร์ VRIO และบทบาทผู้ประกอบการ (p008 p018)
  - topic: business.econ.demand-supply
    indicators: [AC9HE8K01]
    coverage: full
    note: ราคาเป็นสัญญาณจัดสรรทรัพยากรไปสู่การผลิต (p019 บทเรียนส่วนกลไกราคา)
  - topic: business.econ.government-taxes
    indicators: [AC9HE8K04]
    coverage: partial
    note: ความสำคัญของระบบภาษีและผลต่อการตัดสินใจของบุคคลและธุรกิจ (p011 p014 p016) ใช้ระบบภาษีไทยแทนออสเตรเลีย
  - topic: business.finance.time-value-of-money
    indicators: [AC9HE10K03]
    coverage: partial
    note: ปัจจัยในการตัดสินใจทางการเงินครั้งใหญ่ (รับเงินก้อนหรือรายปี กู้ซื้อบ้าน เช่าซื้อรถ เริ่มออมเร็ว) และผลระยะสั้นระยะยาว (p006 p007 p009 p013 p016 p018) เน้นมิติการเงิน ยังไม่ครอบคลุมปัจจัยด้านผู้บริโภคอื่น
  - topic: business.international.trade
    indicators: [AC9HE9K03]
    coverage: partial
    note: เหตุผลที่ประเทศค้าขายกันและรูปแบบการค้ากับเอเชีย (p001 p004 p016 p019) ใช้มุมมองของไทยแทนออสเตรเลีย
