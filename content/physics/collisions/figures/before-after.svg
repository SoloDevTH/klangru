<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="520" height="250" font-family="sans-serif" font-size="15">
  <title>ก่อนชน รถ A มวล 2 kg วิ่ง 3 m/s รถ B มวล 1 kg จอดนิ่ง หลังชน A วิ่ง 1 m/s และ B วิ่ง 4 m/s ไปทางเดิม</title>
  <rect x="0" y="0" width="520" height="250" fill="#ffffff"/>
  <text x="20.0" y="35.0" fill="#15211e" font-size="15" text-anchor="start" font-weight="bold">ก่อนชน</text>
  <line x1="20.0" y1="106.0" x2="500.0" y2="106.0" stroke="#6b7672" stroke-width="1.5" stroke-linecap="round"/>
  <text x="20.0" y="145.0" fill="#15211e" font-size="15" text-anchor="start" font-weight="bold">หลังชน</text>
  <line x1="20.0" y1="216.0" x2="500.0" y2="216.0" stroke="#6b7672" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="60.0" y="60.0" width="80.0" height="34.0" rx="5" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <circle cx="70.0" cy="100.0" r="6.0" fill="#444" stroke="#15211e" stroke-width="1.5"/>
  <circle cx="130.0" cy="100.0" r="6.0" fill="#444" stroke="#15211e" stroke-width="1.5"/>
  <text x="100.0" y="82.0" fill="#15211e" font-size="13" text-anchor="middle" font-weight="bold">A (2 kg)</text>
  <rect x="260.0" y="60.0" width="64.0" height="34.0" rx="5" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <circle cx="270.0" cy="100.0" r="6.0" fill="#444" stroke="#15211e" stroke-width="1.5"/>
  <circle cx="314.0" cy="100.0" r="6.0" fill="#444" stroke="#15211e" stroke-width="1.5"/>
  <text x="292.0" y="82.0" fill="#15211e" font-size="13" text-anchor="middle" font-weight="bold">B (1 kg)</text>
  <line x1="140.0" y1="52.0" x2="220.0" y2="52.0" stroke="#0a6b60" stroke-width="3" stroke-linecap="butt"/>
  <polygon points="230.0,52.0 220.0,56.5 220.0,47.5" fill="#0a6b60"/>
  <text x="236.0" y="57.0" fill="#0a6b60" font-size="13" text-anchor="start">3 m/s</text>
  <text x="292.0" y="50.0" fill="#6b7672" font-size="13" text-anchor="middle">นิ่ง</text>
  <rect x="120.0" y="170.0" width="80.0" height="34.0" rx="5" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <circle cx="130.0" cy="210.0" r="6.0" fill="#444" stroke="#15211e" stroke-width="1.5"/>
  <circle cx="190.0" cy="210.0" r="6.0" fill="#444" stroke="#15211e" stroke-width="1.5"/>
  <text x="160.0" y="192.0" fill="#15211e" font-size="13" text-anchor="middle" font-weight="bold">A (2 kg)</text>
  <rect x="300.0" y="170.0" width="64.0" height="34.0" rx="5" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <circle cx="310.0" cy="210.0" r="6.0" fill="#444" stroke="#15211e" stroke-width="1.5"/>
  <circle cx="354.0" cy="210.0" r="6.0" fill="#444" stroke="#15211e" stroke-width="1.5"/>
  <text x="332.0" y="192.0" fill="#15211e" font-size="13" text-anchor="middle" font-weight="bold">B (1 kg)</text>
  <line x1="200.0" y1="162.0" x2="220.0" y2="162.0" stroke="#0a6b60" stroke-width="3" stroke-linecap="butt"/>
  <polygon points="230.0,162.0 220.0,166.5 220.0,157.5" fill="#0a6b60"/>
  <text x="236.0" y="167.0" fill="#0a6b60" font-size="13" text-anchor="start">1 m/s</text>
  <line x1="364.0" y1="162.0" x2="474.0" y2="162.0" stroke="#0a6b60" stroke-width="3" stroke-linecap="butt"/>
  <polygon points="484.0,162.0 474.0,166.5 474.0,157.5" fill="#0a6b60"/>
  <text x="454.0" y="152.0" fill="#0a6b60" font-size="13" text-anchor="start">4 m/s</text>
</svg>
