id: computer.design.user-centred-design
subject: computer
title: { th: ออกแบบระบบดิจิทัลจากความต้องการของผู้ใช้, en: User-centred design of digital systems }
summary: เข้าใจผู้ใช้ด้วยการสังเกตและสัมภาษณ์ เขียน user story และเกณฑ์การออกแบบ ออกแบบ UI และ UX สร้างและเปรียบเทียบหลายทางเลือก แล้วประเมินผลกับผู้ใช้จริงและชุมชน
difficulty: 3
minutes: 40
prerequisites: [computer.algorithms.intro]
encompasses:
  - { id: computer.algorithms.intro, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: design-cycle.svg
    alt: "วงจร 5 ขั้นเรียงตามเข็มนาฬิกา มีลูกศรต่อกันเป็นวง ขั้น 1 เข้าใจผู้ใช้ (สังเกต สัมภาษณ์) ขั้น 2 นิยามปัญหา (user story เกณฑ์) ขั้น 3 สร้างทางเลือก (หลายแบบ เปรียบเทียบ) ขั้น 4 ทำต้นแบบ (ภาพร่าง ต้นแบบ) ขั้น 5 ทดสอบและประเมินกับผู้ใช้จริง แล้ววนกลับไปขั้น 1 ตรงกลางวงเขียนว่า ผู้ใช้ อยู่กลางทุกขั้น"
    caption: "การออกแบบที่ยึดผู้ใช้เป็นศูนย์กลางวนซ้ำหลายรอบ ทุกรอบกลับไปถามผู้ใช้"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: computer.design.user-centred-design.p003, prompt: "เกณฑ์ข้อใดวัดได้จริง" }
  - type: worked-example
    title: จาก user story ถึงเกณฑ์ที่วัดได้
    problem: "ห้องสมุดโรงเรียนอยากทำระบบจองหนังสือออนไลน์ บรรณารักษ์บอกว่านักเรียนมักมาเอาหนังสือแล้วพบว่าถูกยืมไปแล้ว จงเขียน user story หนึ่งข้อ และเกณฑ์การออกแบบที่วัดได้สองข้อ"
    steps:
      - text: "ระบุผู้ใช้และปัญหา: ผู้ใช้คือนักเรียนที่จะยืมหนังสือ ปัญหาคือเดินมาแล้วไม่ได้หนังสือ"
        why: "user story ต้องเริ่มจากผู้ใช้จริงและปัญหาที่เขาเจอ ไม่ใช่จากเทคโนโลยีที่เราอยากใช้"
      - text: "เขียน user story: ในฐานะนักเรียน ฉันต้องการดูว่าหนังสือว่างหรือไม่และจองไว้ได้ เพื่อไม่ต้องเดินมาห้องสมุดเปล่า ๆ"
      - text: "แปลงความต้องการเป็นเกณฑ์ที่วัดได้: (1) นักเรียนรู้สถานะว่าง หรือ ถูกยืม ของหนังสือภายใน 3 ครั้งที่กด"
        why: "ตัวเลขทำให้ทดสอบได้ว่าผ่านหรือไม่ผ่าน"
      - text: "(2) เมื่อจองแล้ว ระบบเก็บหนังสือไว้ให้ 2 วัน และแสดงข้อความยืนยันการจองทุกครั้ง"
    answer: "user story: ในฐานะนักเรียน ฉันต้องการดูสถานะและจองหนังสือได้ เพื่อไม่ต้องเดินมาเปล่า ๆ เกณฑ์: ดูสถานะได้ภายใน 3 ครั้งที่กด และจองแล้วได้ข้อความยืนยันและเก็บหนังสือไว้ 2 วัน"
  - type: figure
    src: wireframes-ab.svg
    alt: "ภาพร่างหน้าจอสั่งอาหารกลางวันสองแบบ แบบ ก มีปุ่มใหญ่ 4 ปุ่มเรียงเป็นตาราง 2 คูณ 2 แต่ละปุ่มมีรูปอาหารและชื่อเมนูตัวหนา ได้แก่ ข้าวมันไก่ ข้าวผัด ก๋วยเตี๋ยว ข้าวไข่เจียว ด้านล่างมีปุ่มสีเขียวเข้มขนาดใหญ่เขียนว่า สั่งเลย แบบ ข เป็นรายการตัวหนังสือสีเทาอ่อนขนาดเล็ก 8 เมนูพร้อมราคา หน้าแต่ละเมนูมีช่องติ๊กเล็ก ๆ และมีปุ่ม ตกลง ขนาดเล็กสีจางด้านล่าง"
    caption: "ทางเลือกสองแบบสำหรับระบบเดียวกัน ลองเทียบกับ user story ของนักเรียน ป.1"
  - type: worked-example
    title: เปรียบเทียบสองทางเลือกด้วยคะแนนถ่วงน้ำหนัก
    problem: "ใช้เกณฑ์ เด็ก ป.1 ใช้ง่าย (น้ำหนัก 3) สั่งได้เร็ว (น้ำหนัก 2) และต้นทุนต่ำ (น้ำหนัก 1) แบบ ก ได้คะแนน 4, 3, 5 แบบ ข ได้ 2, 5, 4 ควรเลือกแบบใด"
    steps:
      - text: "แบบ ก: 4 × 3 + 3 × 2 + 5 × 1 = 12 + 6 + 5 = 23"
        why: "คูณคะแนนกับน้ำหนักก่อน เกณฑ์ที่สำคัญกว่าจึงมีผลกับผลรวมมากกว่า"
      - text: "แบบ ข: 2 × 3 + 5 × 2 + 4 × 1 = 6 + 10 + 4 = 20"
      - text: "เทียบผลรวม 23 > 20 เลือกแบบ ก"
        why: "ถ้ารวมโดยไม่ถ่วงน้ำหนักจะได้ 12 กับ 11 ผลออกมาใกล้กันจนดูเหมือนเลือกแบบใดก็ได้ ทั้งที่แบบ ข ไม่เหมาะกับผู้ใช้กลุ่มที่สำคัญที่สุด"
      - text: "นำจุดเด่นของแบบ ข (สั่งได้เร็ว) ไปปรับแบบ ก เช่น ปุ่ม สั่งซ้ำเมนูเดิม แล้วทดสอบกับผู้ใช้อีกรอบ"
    answer: "เลือกแบบ ก (23 คะแนน ต่อ 20 คะแนน) แล้วปรับปรุงต่อ"
  - { type: check, problem: computer.design.user-centred-design.p006, prompt: "ใช้ภาพร่างสองแบบด้านบนตอบ" }
glossary:
  - { term: การออกแบบที่ยึดผู้ใช้เป็นศูนย์กลาง (user-centred design), definition: "การออกแบบที่เริ่มจากความต้องการของผู้ใช้ และทดสอบกับผู้ใช้จริงซ้ำหลายรอบ" }
  - { term: user story, definition: "ประโยคบอกความต้องการจากมุมผู้ใช้ รูปแบบ ในฐานะ…ฉันต้องการ…เพื่อ…" }
  - { term: เกณฑ์การออกแบบ (design criteria), definition: "ข้อกำหนดที่วัดได้ ใช้ตัดสินว่าผลงานตอบความต้องการแล้วหรือยัง" }
  - { term: ส่วนต่อประสานกับผู้ใช้ (UI), definition: "ส่วนที่ผู้ใช้เห็นและโต้ตอบ เช่น ปุ่ม เมนู ข้อความ" }
  - { term: ประสบการณ์ผู้ใช้ (UX), definition: "ความรู้สึกและความง่ายของการใช้ระบบตั้งแต่ต้นจนจบ" }
  - { term: ต้นแบบ (prototype), definition: "แบบจำลองของระบบที่ทำได้เร็วและราคาถูก ใช้ทดลองกับผู้ใช้ก่อนสร้างจริง" }
  - { term: ผู้มีส่วนได้ส่วนเสีย (stakeholder), definition: "ทุกคนที่ใช้หรือได้รับผลจากระบบ" }
flashcards:
  - { front: "รูปแบบของ user story", back: "ในฐานะ [ผู้ใช้] ฉันต้องการ [ทำสิ่งใด] เพื่อ [ได้ประโยชน์อะไร]" }
  - { front: "เกณฑ์การออกแบบที่ดีต้องเป็นอย่างไร", back: "วัดได้ เช่น 80% ของผู้ใช้ทำงานเสร็จใน 60 วินาที" }
  - { front: "UI ต่างจาก UX อย่างไร", back: "UI คือสิ่งที่เห็นและกด UX คือประสบการณ์การใช้งานทั้งหมด" }
  - { front: "ตารางให้คะแนนถ่วงน้ำหนักคิดอย่างไร", back: "คูณคะแนนแต่ละเกณฑ์กับน้ำหนัก แล้วรวม ผลรวมมากกว่าคือแบบที่เหมาะกว่า" }
  - { front: "ประเมินผลงานต้องดูอะไรนอกจากเกณฑ์", back: "ผลกระทบต่อชุมชน ผลในอนาคต และโอกาสทางธุรกิจ" }
