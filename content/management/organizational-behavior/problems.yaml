    ai_assisted: true

  - id: management.org.organizational-behavior.p016
    topics: [management.org.organizational-behavior]
    difficulty: 5
    type: mcq
    stem: "สำนักงานที่ดินแห่งหนึ่ง (สมมติ) ทดลองระบบจองคิวออนไลน์สามเดือน เวลารอลดลงครึ่งหนึ่ง ผู้บริหารจัดงานฉลองแล้วยุบทีมงาน ไม่ได้แก้คำสั่งเดิมที่ให้รับบัตรคิวหน้างาน และไม่มีตัวชี้วัดเวลารอในแผนปีต่อไป อีกหกเดือนเวลารอกลับไปเท่าเดิม ตามแบบจำลองของเลวิน ขั้นใดบกพร่องมากที่สุด"
    choices:
      - { id: a, text: "ตรึง (Refreeze)", correct: true }
      - { id: b, text: "ละลาย (Unfreeze)", feedback: "การทดลองได้รับความร่วมมือจนเวลารอลดลงครึ่งหนึ่ง แสดงว่าคนยอมรับว่าต้องเปลี่ยนแล้ว" }
      - { id: c, text: "เปลี่ยน (Change)", feedback: "การทดลองได้ผลดี ขั้นเปลี่ยนจึงสำเร็จ ปัญหาเกิดหลังจากนั้น" }
      - { id: d, text: "ไม่มีขั้นใดบกพร่อง เป็นเรื่องปกติที่ผลจะลดลง", feedback: "ผลที่หายไปทั้งหมดเป็นสัญญาณว่าไม่ได้ทำให้วิธีใหม่กลายเป็นวิธีปกติ" }
    hints:
      - "ขั้นใดทำให้วิธีใหม่คงอยู่หลังโครงการจบ"
      - "ดูว่ามีมาตรฐาน คำสั่ง หรือตัวชี้วัดใหม่หรือไม่"
    solution: "ขั้นละลายและเปลี่ยนสำเร็จ แต่ไม่ได้ตรึง คำสั่งเดิมยังอยู่ ไม่มีตัวชี้วัด และทีมถูกยุบ คนจึงกลับไปทำแบบเดิม ควรแก้คำสั่งให้ระบบจองเป็นวิธีหลัก ใส่เวลารอในตัวชี้วัด และมีเจ้าของกระบวนการดูแลต่อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.organizational-behavior.p017
    topics: [management.org.organizational-behavior]
    difficulty: 5
    type: numeric
    stem: "วิสาหกิจชุมชนผลิตน้ำพริก (สมมติ) จะขายสินค้าล็อตหนึ่งให้ร้านค้าปลีก ถ้าตกลงไม่ได้ วิสาหกิจมีผู้ซื้ออีกรายให้ 45,000 บาท แต่ต้องเสียค่าขนส่งเอง 2,000 บาท ร้านค้าปลีกมีผู้ขายอีกรายเสนอ 50,000 บาท แต่ต้องตรวจคุณภาพเองเสียค่าใช้จ่าย 1,500 บาท ข้อตกลงกับรายนี้ไม่มีค่าใช้จ่ายเพิ่ม ช่วงที่ตกลงกันได้ (ZOPA) กว้างกี่บาท"
    answer: { value: 8500, unit: บาท }
    hints:
      - "หาราคาต่ำสุดที่วิสาหกิจรับได้จาก BATNA สุทธิหลังหักค่าขนส่ง"
      - "หาราคาสูงสุดที่ร้านยอมจ่ายจาก BATNA รวมค่าตรวจคุณภาพ แล้วหาผลต่าง"
    misconceptions:
      - { match: 5000, feedback: "ใช้ราคาที่เสนอโดยไม่ปรับค่าใช้จ่ายเพิ่ม BATNA ต้องคิดเป็นมูลค่าสุทธิ" }
      - { match: 6500, feedback: "ปรับเฉพาะฝั่งร้านค้า ฝั่งวิสาหกิจต้องหักค่าขนส่งด้วย ราคาต่ำสุดที่รับได้จึงเป็น 43,000 บาท" }
      - { match: 7000, feedback: "ปรับเฉพาะฝั่งวิสาหกิจ ฝั่งร้านต้องบวกค่าตรวจคุณภาพด้วย ราคาสูงสุดที่ยอมจ่ายจึงเป็น 51,500 บาท" }
    solution: "วิสาหกิจได้สุทธิจาก BATNA $45{,}000 - 2{,}000 = 43{,}000$ บาท ร้านต้องจ่ายจริงถ้าซื้อรายอื่น $50{,}000 + 1{,}500 = 51{,}500$ บาท ZOPA คือ 43,000 ถึง 51,500 บาท กว้าง $51{,}500 - 43{,}000 = 8{,}500$ บาท"
