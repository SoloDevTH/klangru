      - "ช้า ๆ ขยายคำใด และ ที่ มีคำนามตามหลังหรือไม่"
    solution: "เขา แทนคนที่พูดถึง (สรรพนาม) · เดิน เป็นการกระทำ (กริยา) · ช้า ๆ ขยาย เดิน (วิเศษณ์) · ที่ นำหน้าคำนาม ตลาด (บุพบท)"
