  - id: business.accounting.financial-statements.p013
    topics: [business.accounting.financial-statements]
    difficulty: 4
    type: numeric
    stem: "ทุนต้นปีของร้านซ่อมมือถือ $150{,}000$ บาท ระหว่างปีเจ้าของนำเงินมาลงทุนเพิ่ม $10{,}000$ บาท ถอนใช้ส่วนตัว $18{,}000$ บาท และกำไรสุทธิของปี $45{,}000$ บาท ทุนปลายปีเป็นกี่บาท (ตอบเป็นบาท)"
    answer: { value: 187000, unit: บาท }
    hints:
      - "ทุนปลายงวด $=$ ต้นงวด $+$ ลงทุนเพิ่ม $+$ กำไรสุทธิ $-$ ถอนใช้ส่วนตัว"
      - "ถอนใช้ส่วนตัวลดทุน แต่ไม่ได้อยู่ในงบกำไรขาดทุน"
    misconceptions:
      - { match: 223000, feedback: "บวกถอนใช้ส่วนตัว ต้องลบ" }
      - { match: 177000, feedback: "ลืมเงินลงทุนเพิ่ม $10{,}000$ บาท" }
    solution: "$150{,}000 + 10{,}000 + 45{,}000 - 18{,}000 = 187{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.financial-statements.p014
    topics: [business.accounting.financial-statements]
    difficulty: 4
    type: numeric
    stem: "ระหว่างปี บริษัทหนึ่ง (สมมติ) รับเงินสดจากลูกค้า $380{,}000$ บาท จ่ายเงินให้ผู้ขายสินค้า $210{,}000$ บาท จ่ายเงินเดือน $90{,}000$ บาท จ่ายค่าเช่า $36{,}000$ บาท และจ่ายซื้อเครื่องจักร $50{,}000$ บาท เงินสดสุทธิจาก **กิจกรรมดำเนินงาน** เป็นกี่บาท (ตอบเป็นบาท ถ้าติดลบให้ใส่เครื่องหมายลบ)"
    answer: { value: 44000, unit: บาท }
    hints:
      - "แยกรายการซื้อเครื่องจักรออก เพราะเป็นกิจกรรมลงทุน"
      - "ดำเนินงาน $=$ เงินรับจากลูกค้า $-$ เงินจ่ายค่าสินค้าและค่าใช้จ่าย"
    misconceptions:
      - { match: -6000, feedback: "รวมการซื้อเครื่องจักรไว้ด้วย ซึ่งเป็นกิจกรรมลงทุน ไม่ใช่ดำเนินงาน" }
    solution: "$380{,}000 - 210{,}000 - 90{,}000 - 36{,}000 = 44{,}000$ บาท ส่วนเครื่องจักร $-50{,}000$ บาทอยู่ในกิจกรรมลงทุน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.financial-statements.p015
    topics: [business.accounting.financial-statements]
    difficulty: 4
    type: mcq
    stem: "ร้านขายวัสดุก่อสร้าง (สมมติ) มีกำไรสุทธิปีนี้ $120{,}000$ บาท แต่เงินสดลดลงจากต้นปี ข้อใด **เป็นไปได้มากที่สุด**"
    choices:
      - { id: a, text: "ร้านขายเชื่อมากขึ้น (ลูกหนี้เพิ่ม) ซื้อสินค้ามาเก็บเพิ่ม และจ่ายคืนเงินกู้ เงินจึงไปอยู่ในสินทรัพย์อื่นหรือออกไปทางกิจกรรมจัดหาเงิน", correct: true }
      - { id: b, text: "งบการเงินต้องผิดแน่นอน เพราะกำไรต้องเท่ากับเงินสดที่เพิ่ม", feedback: "กำไรใช้เกณฑ์คงค้าง เงินสดดูเฉพาะเงินเข้าออก สองตัวจึงต่างกันได้" }
      - { id: c, text: "ร้านบันทึกค่าเสื่อมราคามากเกินไป", feedback: "ค่าเสื่อมราคาไม่ได้จ่ายเป็นเงินสด จึงไม่ได้ทำให้เงินสดลด" }
      - { id: d, text: "ร้านมีรายได้รับล่วงหน้ามาก", feedback: "รายได้รับล่วงหน้าคือรับเงินมาก่อน ทำให้เงินสดเพิ่ม ไม่ใช่ลด" }
    hints:
      - "เงินจากกำไรอาจไปอยู่ที่ไหนได้บ้างนอกจากเงินสด"
      - "ดูทั้งสามกิจกรรมในงบกระแสเงินสด"
    solution: "กำไรไม่เท่ากับเงินสด เมื่อขายเชื่อ ลูกหนี้เพิ่มแต่เงินยังไม่เข้า ซื้อสินค้าเก็บ เงินกลายเป็นสินค้าคงเหลือ และจ่ายคืนเงินกู้ เงินออกทางกิจกรรมจัดหาเงิน เงินสดจึงลดได้แม้มีกำไร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.financial-statements.p016
    topics: [business.accounting.financial-statements]
    difficulty: 5
    type: numeric
    stem: "กำไรสุทธิก่อนปรับปรุงของร้านซักรีด (สมมติ) เท่ากับ $80{,}000$ บาท สิ้นปีมีรายการที่ยังไม่ได้ปรับปรุง (1) ค่าเสื่อมราคาเครื่องซักผ้า $12{,}000$ บาท (2) ค่าจ้างพนักงานค้างจ่าย $4{,}000$ บาท (3) จากเงินรับล่วงหน้าค่าซักรายเดือนที่บันทึกเป็นหนี้สินไว้ ร้านให้บริการไปแล้ว $6{,}000$ บาท กำไรสุทธิหลังปรับปรุงเป็นกี่บาท (ตอบเป็นบาท)"
    answer: { value: 70000, unit: บาท }
    hints:
      - "ค่าใช้จ่ายที่ปรับปรุงเพิ่มทำให้กำไรลด รายได้ที่ปรับปรุงเพิ่มทำให้กำไรเพิ่ม"
      - "ส่วนที่ให้บริการแล้วโอนจากรายได้รับล่วงหน้าไปเป็นรายได้"
    misconceptions:
      - { match: 58000, feedback: "นำรายได้ที่ให้บริการแล้วไปหักออก ส่วนนี้เป็นรายได้ที่เพิ่มขึ้น ต้องบวก" }
      - { match: 64000, feedback: "ไม่ได้บวกรายได้ $6{,}000$ บาทที่ให้บริการแล้ว" }
    solution: "$80{,}000 - 12{,}000 - 4{,}000 + 6{,}000 = 70{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.financial-statements.p017
    topics: [business.accounting.financial-statements]
    difficulty: 5
    type: numeric
    stem: "บริษัทหนึ่ง (สมมติ) มีเงินสดต้นปี $25{,}000$ บาท ระหว่างปีเงินสดสุทธิจากกิจกรรมดำเนินงาน $+44{,}000$ บาท กิจกรรมลงทุน $-50{,}000$ บาท และกิจกรรมจัดหาเงิน $+30{,}000$ บาท เงินสดในงบแสดงฐานะการเงิน ณ สิ้นปีต้องเป็นกี่บาท (ตอบเป็นบาท)"
    answer: { value: 49000, unit: บาท }
    hints:
      - "หาเงินสดเพิ่มขึ้น (ลดลง) สุทธิจากสามกิจกรรมก่อน"
      - "เงินสดปลายปี $=$ เงินสดต้นปี $+$ เงินสดเพิ่มขึ้นสุทธิ"
    misconceptions:
      - { match: 24000, feedback: "นั่นคือเงินสดเพิ่มขึ้นสุทธิ ยังต้องบวกเงินสดต้นปี" }
      - { match: 149000, feedback: "บวกกิจกรรมลงทุนทั้งที่ติดลบ ต้องลบ $50{,}000$ บาท" }
    solution: "เงินสดเพิ่มขึ้นสุทธิ $= 44{,}000 - 50{,}000 + 30{,}000 = 24{,}000$ บาท เงินสดปลายปี $= 25{,}000 + 24{,}000 = 49{,}000$ บาท ซึ่งต้องตรงกับเงินสดในงบแสดงฐานะการเงิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.financial-statements.p018
    topics: [business.accounting.financial-statements]
    difficulty: 4
    type: mcq
    stem: "บริษัทจำกัดขนาดเล็กที่ไม่ได้จดทะเบียนในตลาดหลักทรัพย์และใช้ TFRS for NPAEs ข้อใดถูกต้องเกี่ยวกับงบการเงินของบริษัท"
    choices:
      - { id: a, text: "ต้องมีงบแสดงฐานะการเงิน งบกำไรขาดทุน งบแสดงการเปลี่ยนแปลงส่วนของผู้ถือหุ้น และหมายเหตุ ส่วนงบกระแสเงินสดเลือกจัดทำได้", correct: true }
      - { id: b, text: "ต้องมีงบกระแสเงินสดเท่านั้น งบอื่นไม่จำเป็น", feedback: "งบหลักที่ต้องมีคืองบแสดงฐานะการเงินและงบกำไรขาดทุน ส่วนงบกระแสเงินสดเป็นทางเลือกสำหรับ NPAEs" }
      - { id: c, text: "ไม่ต้องจัดทำงบการเงินเลย เพราะไม่ได้อยู่ในตลาดหลักทรัพย์", feedback: "บริษัทจำกัดทุกแห่งต้องจัดทำงบการเงิน NPAEs เพียงใช้มาตรฐานที่ง่ายกว่า" }
      - { id: d, text: "ต้องใช้ TFRS ฉบับเต็มเหมือนบริษัทจดทะเบียน", feedback: "TFRS ฉบับเต็มใช้กับกิจการที่มีส่วนได้เสียสาธารณะ เช่น บริษัทจดทะเบียน" }
    hints:
      - "NPAEs คือกิจการที่ไม่มีส่วนได้เสียสาธารณะ"
      - "มาตรฐาน NPAEs ลดภาระบางอย่าง แต่ยังต้องรายงานฐานะการเงินและผลการดำเนินงาน"
    solution: "กิจการที่ใช้ TFRS for NPAEs ต้องมีงบแสดงฐานะการเงิน งบกำไรขาดทุน งบแสดงการเปลี่ยนแปลงส่วนของผู้ถือหุ้น และหมายเหตุประกอบงบการเงิน โดยไม่ถูกบังคับให้จัดทำงบกระแสเงินสด"
    license: CC-BY-SA-4.0
    ai_assisted: true
