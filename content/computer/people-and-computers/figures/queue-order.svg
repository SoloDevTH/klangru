<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="520" height="250" font-family="sans-serif" font-size="14">
<title>แผนภาพเวลาการให้บริการลูกค้า 3 คนสองลำดับ แกนนอนคือเวลาเป็นนาที</title>
<rect x="0" y="0" width="520" height="250" fill="#ffffff"/>
<text x="260" y="26" text-anchor="middle" font-weight="bold" fill="#1f2937">ลูกค้า 3 คน: A ใช้ 5 นาที B ใช้ 2 นาที C ใช้ 3 นาที</text>
<text x="18" y="58" fill="#1f2937" font-weight="bold">ลำดับ 1: ใครมาก่อนได้ก่อน</text>
<rect x="100.0" y="70" width="200.0" height="44" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
<text x="200.0" y="97" text-anchor="middle" fill="#1f2937">A (5 นาที)</text>
<rect x="300.0" y="70" width="80.0" height="44" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
<text x="340.0" y="97" text-anchor="middle" fill="#1f2937">B (2 นาที)</text>
<rect x="380.0" y="70" width="120.0" height="44" fill="#bbf7d0" stroke="#166534" stroke-width="2"/>
<text x="440.0" y="97" text-anchor="middle" fill="#1f2937">C (3 นาที)</text>
<text x="18" y="153" fill="#1f2937" font-weight="bold">ลำดับ 2: ใครใช้เวลาน้อยได้ก่อน</text>
<rect x="100.0" y="165" width="80.0" height="44" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
<text x="140.0" y="192" text-anchor="middle" fill="#1f2937">B (2 นาที)</text>
<rect x="180.0" y="165" width="120.0" height="44" fill="#bbf7d0" stroke="#166534" stroke-width="2"/>
<text x="240.0" y="192" text-anchor="middle" fill="#1f2937">C (3 นาที)</text>
<rect x="300.0" y="165" width="200.0" height="44" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
<text x="400.0" y="192" text-anchor="middle" fill="#1f2937">A (5 นาที)</text>
<line x1="100" y1="228" x2="500" y2="228" stroke="#374151" stroke-width="1.5"/>
<line x1="100.0" y1="228" x2="100.0" y2="234" stroke="#374151" stroke-width="1.5"/>
<text x="100.0" y="248" text-anchor="middle" fill="#374151">0</text>
<line x1="180.0" y1="228" x2="180.0" y2="234" stroke="#374151" stroke-width="1.5"/>
<text x="180.0" y="248" text-anchor="middle" fill="#374151">2</text>
<line x1="260.0" y1="228" x2="260.0" y2="234" stroke="#374151" stroke-width="1.5"/>
<text x="260.0" y="248" text-anchor="middle" fill="#374151">4</text>
<line x1="340.0" y1="228" x2="340.0" y2="234" stroke="#374151" stroke-width="1.5"/>
<text x="340.0" y="248" text-anchor="middle" fill="#374151">6</text>
<line x1="420.0" y1="228" x2="420.0" y2="234" stroke="#374151" stroke-width="1.5"/>
<text x="420.0" y="248" text-anchor="middle" fill="#374151">8</text>
<line x1="500.0" y1="228" x2="500.0" y2="234" stroke="#374151" stroke-width="1.5"/>
<text x="500.0" y="248" text-anchor="middle" fill="#374151">10</text>
<text x="18" y="248" fill="#374151">นาที</text>
</svg>