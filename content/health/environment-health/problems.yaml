problems:
- id: health.environment.environment-health.p001
  topics:
  - health.environment.environment-health
  difficulty: 1
  type: mcq
  stem: ถ่านไฟฉายที่ใช้หมดแล้วควรทิ้งลงถังขยะสีใด
  choices:
  - id: a
    text: สีแดง (ขยะอันตราย)
    correct: true
  - id: b
    text: สีเขียว (ขยะอินทรีย์)
    feedback: ถังสีเขียวสำหรับเศษอาหารที่ย่อยสลายได้
  - id: c
    text: สีน้ำเงิน (ขยะทั่วไป)
    feedback: ถ่านไฟฉายมีสารอันตราย ต้องแยกไปกำจัดอย่างถูกวิธี ไม่ใช่ขยะทั่วไป
  hints:
  - ถ่านไฟฉายมีสารเคมีที่รั่วซึมลงดินและน้ำได้
  - ขยะที่มีสารพิษเป็นขยะประเภทใด
  solution: ถ่านไฟฉายเป็นขยะอันตราย ต้องทิ้งในถังสีแดงเพื่อแยกไปกำจัดอย่างถูกวิธี ไม่ให้สารพิษรั่วลงดินและแหล่งน้ำ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.environment.environment-health.p002
  topics:
  - health.environment.environment-health
  difficulty: 1
  type: mcq
  stem: ดัชนีคุณภาพอากาศเป็นสีฟ้า หมายความว่าอย่างไร
  choices:
  - id: a
    text: คุณภาพอากาศดีมาก ทำกิจกรรมได้ตามปกติ
    correct: true
  - id: b
    text: ฝุ่นสูงมาก ต้องงดออกนอกบ้าน
    feedback: ระดับที่ต้องงดกิจกรรมกลางแจ้งคือสีแดง
  - id: c
    text: คุณภาพอากาศปานกลาง
    feedback: ระดับปานกลางคือสีเหลือง
  hints:
  - "ระดับ AQI เรียงจากดีที่สุดไปแย่ที่สุด: ฟ้า เขียว เหลือง ส้ม แดง"
  - สีฟ้าอยู่ลำดับแรก
  solution: สีฟ้า (AQI 0–25) คือคุณภาพอากาศดีมาก ทุกคนทำกิจกรรมได้ตามปกติ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.environment.environment-health.p003
  topics:
  - health.environment.environment-health
  difficulty: 2
  type: order
  stem: เรียงสีของดัชนีคุณภาพอากาศของประเทศไทย จากอากาศดีที่สุดไปแย่ที่สุด
  items:
  - ฟ้า
  - เขียว
  - เหลือง
  - ส้ม
  - แดง
  hints:
  - สีแดงคือระดับที่มีผลกระทบต่อสุขภาพมากที่สุด
  - สีเขียวคืออากาศดี สีเหลืองคือปานกลาง
  solution: ฟ้า (ดีมาก) → เขียว (ดี) → เหลือง (ปานกลาง) → ส้ม (เริ่มมีผลกระทบต่อสุขภาพ) → แดง (มีผลกระทบต่อสุขภาพ)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.environment.environment-health.p004
  topics:
  - health.environment.environment-health
  difficulty: 2
  type: match
  stem: จับคู่ขยะกับถังที่ควรทิ้ง
  pairs:
  - left: เปลือกส้มและเศษข้าว
    right: ถังสีเขียว
  - left: ขวดน้ำพลาสติกเปล่า
    right: ถังสีเหลือง
  - left: ซองขนมเปื้อนน้ำมัน
    right: ถังสีน้ำเงิน
  - left: กระป๋องสเปรย์กันยุงที่ใช้หมด
    right: ถังสีแดง
  hints:
  - เขียว = อินทรีย์ เหลือง = รีไซเคิล น้ำเงิน = ทั่วไป แดง = อันตราย
  - ซองขนมเปื้อนน้ำมันนำไปรีไซเคิลได้ยาก
  solution: เศษอาหารเป็นขยะอินทรีย์ (เขียว) ขวดพลาสติกรีไซเคิลได้ (เหลือง) ซองขนมเปื้อนเป็นขยะทั่วไป (น้ำเงิน) กระป๋องสเปรย์เป็นขยะอันตราย (แดง)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.environment.environment-health.p005
  topics:
  - health.environment.environment-health
  difficulty: 2
  type: mcq
  stem: วันแข่งกีฬาสีที่เชียงใหม่ แอปรายงาน AQI สีส้ม โรงเรียนควรทำอย่างไรจึงเหมาะสมที่สุด
  choices:
  - id: a
    text: ย้ายการแข่งขันที่ใช้แรงมากเข้าในอาคาร หรือเลื่อน และให้คนที่ต้องอยู่กลางแจ้งสวมหน้ากากกัน PM2.5
    correct: true
  - id: b
    text: แข่งตามเดิมเพราะสีส้มยังไม่ใช่สีแดง
    feedback: สีส้มคือเกินมาตรฐานแล้ว ต้องลดกิจกรรมกลางแจ้งที่ใช้แรงมาก
  - id: c
    text: ให้นักเรียนสวมหน้ากากผ้าบางแล้ววิ่งแข่งตามปกติ
    feedback: การวิ่งทำให้หายใจแรงและสูดฝุ่นมาก และหน้ากากผ้าบางกันฝุ่นละเอียดได้น้อย
  hints:
  - AQI สีส้มคือ 101–200
  - ระดับนี้ควรจำกัดกิจกรรมกลางแจ้งที่ใช้แรงมาก
  solution: AQI สีส้มหมายถึงฝุ่นเกินมาตรฐานและเริ่มมีผลต่อสุขภาพ ควรลดหรือย้ายกิจกรรมที่ใช้แรงมากเข้าในอาคาร และใช้หน้ากากกัน PM2.5 เมื่ออยู่นอกอาคาร
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.environment.environment-health.p006
  topics:
  - health.environment.environment-health
  difficulty: 2
  type: numeric
  stem: ค่ามาตรฐาน PM2.5 เฉลี่ย 24 ชั่วโมงของประเทศไทยที่ใช้ตั้งแต่ 1 มิถุนายน 2566 คือไม่เกินกี่ไมโครกรัมต่อลูกบาศก์เมตร (ตอบเป็น มคก./ลบ.ม.)
  answer:
    value: 37.5
    tolerance: 0.01
    unit: มคก./ลบ.ม.
  misconceptions:
  - match: 50
    feedback: 50 คือค่ามาตรฐานเดิมก่อนปี 2566
  - match: 2.5
    feedback: 2.5 คือขนาดของฝุ่น (ไมโครเมตร) ไม่ใช่ค่ามาตรฐาน
  hints:
  - ค่านี้เท่ากับ AQI 100
  - อยู่ระหว่างระดับสีเหลืองกับสีส้ม
  solution: ค่ามาตรฐานใหม่คือ 37.5 มคก./ลบ.ม. (เดิม 50) ถ้าเกินค่านี้จะอยู่ในระดับสีส้มขึ้นไป
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.environment.environment-health.p007
  topics:
  - health.environment.environment-health
  difficulty: 2
  type: mcq
  stem: ข้อใดเป็นผลเสียต่อสุขภาพจากการฟังหูฟังด้วยเสียงดังมากเป็นเวลานานทุกวัน
  choices:
  - id: a
    text: การได้ยินเสื่อมลงอย่างถาวร
    correct: true
  - id: b
    text: ตาพร่ามัว
    feedback: เสียงมีผลต่อหู ไม่ได้ทำให้ตาพร่า
  - id: c
    text: ไม่มีผลเพราะเป็นเสียงเพลง ไม่ใช่เสียงเครื่องจักร
    feedback: เสียงดังทำร้ายหูได้ไม่ว่าจะเป็นเสียงชนิดใด
  hints:
  - เสียงเป็นมลพิษชนิดหนึ่ง
  - องค์การอนามัยโลกเตือนเรื่องการฟังเสียงดังเกินไปในคนหนุ่มสาว
  solution: การฟังเสียงดังนาน ๆ ทำลายเซลล์รับเสียงในหู ทำให้การได้ยินเสื่อมแบบถาวร ควรลดเสียงและพักหูเป็นระยะ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.environment.environment-health.p008
  topics:
  - health.environment.environment-health
  difficulty: 3
  type: numeric
  stem: จากแผนภูมิ มีกี่วันที่ค่า PM2.5 เฉลี่ยเกินค่ามาตรฐาน 37.5 มคก./ลบ.ม. (ตอบเป็นจำนวนวัน)
  figure: &id001
    src: pm25-week.svg
    alt: แผนภูมิแท่ง ค่า PM2.5 เฉลี่ยรายวันหน้าโรงเรียน 7 วัน ข้อมูลสมมติ หน่วย มคก./ลบ.ม. วันจันทร์ 28 อังคาร 35 พุธ 42 พฤหัสบดี 51 ศุกร์ 39 เสาร์ 33 อาทิตย์ 24
  answer:
    value: 3
    unit: วัน
  misconceptions:
  - match: 2
    feedback: อย่าลืมวันศุกร์ (39) ซึ่งเกิน 37.5 เล็กน้อย
  - match: 4
    feedback: วันอังคาร (35) ยังไม่เกิน 37.5
  hints:
  - อ่านค่าทีละวันแล้วเทียบกับ 37.5
  - เกินคือมากกว่า 37.5
  solution: วันที่เกิน 37.5 คือ พุธ 42 พฤหัสบดี 51 และศุกร์ 39 รวม 3 วัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.environment.environment-health.p009
  topics:
  - health.environment.environment-health
  difficulty: 3
  type: numeric
  stem: จากแผนภูมิ วันที่ค่าฝุ่นสูงที่สุด ค่า PM2.5 เกินมาตรฐาน 37.5 มคก./ลบ.ม. อยู่เท่าไร (ตอบเป็น มคก./ลบ.ม.)
  figure: *id001
  answer:
    value: 13.5
    tolerance: 0.01
    unit: มคก./ลบ.ม.
  misconceptions:
  - match: 51
    feedback: 51 คือค่าของวันนั้น โจทย์ถามว่าเกินมาตรฐานเท่าไร
  - match: 1
    feedback: ค่าที่ใช้เทียบคือมาตรฐาน 37.5 ไม่ใช่ 50
  hints:
  - หาวันที่แท่งสูงที่สุด
  - นำค่านั้นลบด้วย 37.5
  solution: วันพฤหัสบดีสูงสุด 51 มคก./ลบ.ม. เกินมาตรฐาน 51 − 37.5 = 13.5 มคก./ลบ.ม.
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.environment.environment-health.p010
  topics:
  - health.environment.environment-health
  difficulty: 3
  type: mcq
  stem: ชุมชนแห่งหนึ่งมีฝุ่นควันทุกปีเพราะชาวบ้านเผาใบไม้และขยะ ข้อใดเป็นการแก้ปัญหาที่ต้นเหตุ
  choices:
  - id: a
    text: ชวนกันเลิกเผา นำใบไม้ไปทำปุ๋ยหมัก และคัดแยกขยะส่งให้เทศบาล
    correct: true
  - id: b
    text: แจกหน้ากากกันฝุ่นให้ทุกบ้าน
    feedback: หน้ากากเป็นการป้องกันตัวเอง ช่วยได้ แต่ฝุ่นยังเกิดขึ้นเหมือนเดิม
  - id: c
    text: ปิดหน้าต่างและอยู่ในบ้านช่วงที่มีควัน
    feedback: เป็นการหลบเลี่ยง ไม่ได้ลดควันที่เกิดขึ้น
  hints:
  - ต้นเหตุของฝุ่นในชุมชนนี้คืออะไร
  - การแก้ที่ต้นเหตุคือทำให้ฝุ่นไม่เกิดขึ้นตั้งแต่แรก
  solution: ต้นเหตุคือการเผา การเลิกเผาและจัดการใบไม้กับขยะด้วยวิธีอื่นทำให้ควันไม่เกิดขึ้น ส่วนหน้ากากและการปิดหน้าต่างเป็นการป้องกันตัวเองซึ่งควรทำควบคู่กัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.environment.environment-health.p011
  topics:
  - health.environment.environment-health
  difficulty: 3
  type: mcq
  stem: ข้อใดแสดงความรับผิดชอบต่อสุขภาพของส่วนรวม (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: คว่ำกะลาและยางรถเก่ารอบบ้านไม่ให้มีน้ำขัง
    correct: true
  - id: b
    text: สวมหน้ากากและพักอยู่บ้านเมื่อเป็นไข้หวัดใหญ่
    correct: true
  - id: c
    text: แยกขยะในห้องเรียนตามสีของถัง
    correct: true
  - id: d
    text: เผาขยะหลังบ้านเพื่อให้บ้านสะอาด
    feedback: ควันจากการเผาขยะทำร้ายสุขภาพของเพื่อนบ้านและเพิ่มฝุ่น PM2.5
  - id: e
    text: เปิดลำโพงเสียงดังตอนกลางคืน
    feedback: เสียงดังรบกวนการนอนและสุขภาพของคนรอบข้าง
  hints:
  - ความรับผิดชอบต่อส่วนรวมคือทำแล้วคนอื่นปลอดภัยด้วย
  - ลองคิดว่าแต่ละข้อส่งผลต่อเพื่อนบ้านอย่างไร
  solution: การกำจัดแหล่งน้ำขัง การป้องกันการแพร่เชื้อ และการคัดแยกขยะช่วยให้ทุกคนปลอดภัย ส่วนการเผาขยะและเปิดเสียงดังทำร้ายสุขภาพของผู้อื่น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.environment.environment-health.p012
  topics:
  - health.environment.environment-health
  difficulty: 3
  type: text
  stem: หลัก 3R ประกอบด้วย ลดการใช้ ใช้ซ้ำ และการนำขวดพลาสติกไปแปรรูปเป็นของใหม่ ซึ่งเรียกว่าอะไร (ตอบเป็นคำภาษาไทยหรืออังกฤษ)
  accepted:
  - รีไซเคิล
  - Recycle
  - นำกลับมาใช้ใหม่
  - การนำกลับมาใช้ใหม่
  misconceptions:
  - match: ใช้ซ้ำ
    feedback: ใช้ซ้ำ (Reuse) คือใช้ของเดิมอีกครั้งโดยไม่แปรรูป เช่น ใช้ถุงผ้าซ้ำ
  hints:
  - ขวดถูกส่งไปหลอมแล้วทำเป็นของชิ้นใหม่
  - ภาษาอังกฤษขึ้นต้นด้วย Re และทิ้งลงถังสีเหลือง
  solution: การนำวัสดุไปแปรรูปเป็นผลิตภัณฑ์ใหม่คือ รีไซเคิล (Recycle) ขยะประเภทนี้ทิ้งในถังสีเหลือง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.environment.environment-health.p013
  topics:
  - health.environment.environment-health
  difficulty: 4
  type: numeric
  stem: จากแผนภูมิ ค่า PM2.5 เฉลี่ยของทั้ง 7 วันเท่ากับเท่าไร (ตอบเป็น มคก./ลบ.ม.)
  figure: *id001
  answer:
    value: 36
    tolerance: 0.1
    unit: มคก./ลบ.ม.
  misconceptions:
  - match: 252
    feedback: 252 คือผลรวม ต้องหารด้วยจำนวนวัน 7
  - match: 37.5
    feedback: 37.5 คือค่ามาตรฐาน ไม่ใช่ค่าเฉลี่ยของสัปดาห์นี้
  hints:
  - บวกค่าทั้ง 7 วัน
  - นำผลรวมหารด้วย 7
  solution: ผลรวม 28 + 35 + 42 + 51 + 39 + 33 + 24 = 252 ค่าเฉลี่ย 252 ÷ 7 = 36 มคก./ลบ.ม. ค่าเฉลี่ยทั้งสัปดาห์ต่ำกว่ามาตรฐาน แต่ยังมี 3 วันที่เกิน จึงต้องดูค่ารายวันด้วย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.environment.environment-health.p014
  topics:
  - health.environment.environment-health
  difficulty: 4
  type: mcq
  stem: ค่า PM2.5 เฉลี่ย 24 ชั่วโมงวัดได้ 40 มคก./ลบ.ม. ควรแปลผลอย่างไร
  choices:
  - id: a
    text: สีส้ม เริ่มมีผลกระทบต่อสุขภาพ เพราะเกิน 37.5
    correct: true
  - id: b
    text: สีเหลือง ปานกลาง เพราะยังไม่ถึง 50
    feedback: 50 เป็นเกณฑ์เก่า เกณฑ์ปัจจุบันระดับสีเหลืองสิ้นสุดที่ 37.5
  - id: c
    text: สีแดง เพราะเกิน 37.5
    feedback: สีแดงเริ่มที่ 75.1 มคก./ลบ.ม.
  hints:
