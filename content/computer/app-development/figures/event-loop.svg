  <line x1="192.0" y1="177.0" x2="238.0" y2="110.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah6b7280)"/>
  <line x1="192.0" y1="239.0" x2="238.0" y2="110.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah6b7280)"/>
  <rect x="420.0" y="90.0" width="170.0" height="90.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
