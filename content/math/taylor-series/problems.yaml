- id: math.calculus.taylor-series.p012
  topics:
  - math.calculus.taylor-series
  difficulty: 3
  type: order
  stem: 'เรียงขั้นตอนการสร้างอนุกรมแมคลอรินของฟังก์ชัน $f$ ตามลำดับที่ถูกต้อง'
  items:
  - หาอนุพันธ์ $f^{(n)}(x)$ ของ $f$ ทีละอันดับ
  - แทนค่า $x = 0$ ลงในอนุพันธ์แต่ละอันดับ
  - หารค่า $f^{(n)}(0)$ ด้วย $n!$ เป็นสัมประสิทธิ์ของ $x^n$
  - เขียนผลรวม $\sum \frac{f^{(n)}(0)}{n!}x^n$ เป็นอนุกรม
  - ตรวจว่าเศษเหลือของการประมาณเข้าใกล้ $0$ ภายในช่วงที่สนใจ
  hints:
  - ขั้นแรกต้องได้อนุพันธ์ก่อนจึงแทนค่าได้
  - ขั้นสุดท้ายเป็นการตรวจว่าอนุกรมแทนฟังก์ชันจริงหรือไม่
  solution: หาอนุพันธ์ แทนค่า $0$ หารด้วยแฟกทอเรียล รวมเป็นอนุกรม แล้วตรวจเศษเหลือ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: math.calculus.taylor-series.p013
  topics:
