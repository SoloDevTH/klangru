id: computer.data.exploratory-analysis
subject: computer
title: { th: "วิเคราะห์ข้อมูลเชิงสำรวจ: สรุป เปรียบเทียบ และหาความสัมพันธ์", en: "Exploratory data analysis: summarising, comparing and finding relationships" }
summary: สรุปข้อมูลด้วยค่ากลางและการกระจาย ตรวจค่าผิดปกติ สร้างตารางความถี่และตารางไขว้ อ่านข้อมูลซ้อน และหาความสัมพันธ์ระหว่างตัวแปรก่อนตีความ
difficulty: 6
minutes: 40
prerequisites: [computer.data.data-preparation, math.stats.dispersion, math.stats.bivariate-data]
encompasses:
  - { id: math.stats.dispersion, weight: 0.3 }
  - { id: math.stats.bivariate-data, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: reading-boxplot.svg
    alt: "แผนภาพกล่องแนวนอนบนแกนชั่วโมง 0 ถึง 40 กล่องอยู่ระหว่างประมาณ 5 ถึง 9.25 มีเส้นกลางที่ 7 หนวดซ้ายถึง 4 และหนวดขวาถึง 10 มีจุดสีแดงที่ 35 อยู่นอกหนวดและมีป้ายว่า ค่านอกหนวด 35"
    caption: "ค่า 35 ชั่วโมงอยู่นอกหนวดของกล่อง จึงควรตรวจก่อนสรุป (ข้อมูลสมมติ)"
  - type: worked-example
    title: ค่ากลางกับค่าผิดปกติจากข้อมูลห้าคน
    problem: "นักเรียนห้าคนอ่านหนังสือนอกเวลาเรียนต่อสัปดาห์ (นาที) คือ 20, 25, 25, 30 และ 90 ค่าเฉลี่ยและมัธยฐานเป็นเท่าใด และค่า 90 เป็นค่าผิดปกติตามกฎ 1.5 IQR หรือไม่"
    steps:
      - text: "ค่าเฉลี่ยคือ (20 + 25 + 25 + 30 + 90) ÷ 5 = 190 ÷ 5 = 38 นาที"
      - text: "มัธยฐาน เรียงข้อมูลได้ 20, 25, 25, 30, 90 ค่าตรงกลางคือ 25 นาที"
        why: "ค่า 90 ดึงค่าเฉลี่ยขึ้น แต่ไม่ได้เปลี่ยนมัธยฐาน"
      - text: "statistics.quantiles(data, n=4) ให้ Q1 = 22.5 และ Q3 = 60 จึงได้ IQR = 60 − 22.5 = 37.5"
      - text: "ขอบบน 60 + 1.5 × 37.5 = 116.25 นาที และขอบล่าง 22.5 − 1.5 × 37.5 = −33.75 นาที ค่า 90 อยู่ในช่วงนี้ จึงไม่เป็นค่าผิดปกติตามกฎนี้"
        why: "กฎ 1.5 IQR ไม่ไวต่อข้อมูลที่มีน้อยมาก ต้องดูบริบทประกอบ เช่น ตรวจว่า 90 นาทีต่อสัปดาห์เป็นไปได้หรือไม่"
    answer: "ค่าเฉลี่ย 38 นาทีถูกดึงขึ้นด้วยค่า 90 มัธยฐาน 25 นาทีตรงกับค่าส่วนใหญ่มากกว่า ค่า 90 ไม่ถูกจัดเป็นค่าผิดปกติตามกฎ 1.5 IQR แต่ควรตรวจว่ากรอกถูกต้องหรือไม่"
  - { type: check, problem: computer.data.exploratory-analysis.p001, prompt: "ลองนึกว่าค่าเฉลี่ยกับมัธยฐานต่างกันตรงไหน" }
  - type: figure
    src: study-score-scatter.svg
    alt: "กราฟกระจายแกนนอนคือชั่วโมงอ่านต่อสัปดาห์ 1 ถึง 8 แกนตั้งคือคะแนนสอบสมมติ 40 ถึง 90 มีจุดแปดจุดที่เรียงขึ้นจากซ้ายล่างไปขวาบน และมีเส้นประเอียงขึ้นแสดงแนวโน้มโดยประมาณ"
    caption: "จุดเรียงใกล้เส้นประ แต่การเห็นแนวโน้มไม่ได้พิสูจน์สาเหตุ (ข้อมูลสมมติ)"
  - type: worked-example
    title: ตารางไขว้ของชั้นเรียน และเลือกตัวหารให้ถูก
    problem: "ชั้นเรียนสมมติ 24 คนแบ่งตามการเล่นกีฬาและการอ่านหนังสือ: เล่นกีฬาและอ่านมาก 5 คน เล่นกีฬาแต่อ่านน้อย 7 คน ไม่เล่นกีฬาแต่อ่านมาก 4 คน ไม่เล่นกีฬาและอ่านน้อย 8 คน ในกลุ่มที่อ่านมาก สัดส่วนของคนที่เล่นกีฬาเป็นเท่าใด และต่างจากทั้งชั้นมากหรือไม่"
    steps:
      - text: "รวมแถวและคอลัมน์ให้ครบ คนที่อ่านมาก 5 + 4 = 9 คน คนที่เล่นกีฬา 5 + 7 = 12 คน และ 9 + 15 = 24 ครบทั้งชั้น"
      - text: "ในกลุ่มที่อ่านมาก มี 5 คนที่เล่นกีฬา คิดเป็น 5 ÷ 9 × 100 ≈ 55.6 เปอร์เซ็นต์"
        why: "ตัวหารต้องเป็นกลุ่มที่เราสนใจ คือคนที่อ่านมาก ถ้าหารด้วย 24 จะได้ค่าของทั้งชั้น ไม่ใช่ของกลุ่มนี้"
      - text: "ทั้งชั้นมี 12 ใน 24 คนที่เล่นกีฬา คิดเป็น 50 เปอร์เซ็นต์"
      - text: "ต่างกันราว 5.6 จุดร้อยละ จากข้อมูลตัวอย่างขนาดเล็กเช่นนี้ยังสรุปความสัมพันธ์ที่แรงไม่ได้"
        why: "ความต่างที่ดูมีนัยจะต้องใหญ่พอเมื่อเทียบกับความไม่แน่นอนของตัวอย่าง"
    answer: "ประมาณ 55.6 เปอร์เซ็นต์ เทียบกับทั้งชั้น 50 เปอร์เซ็นต์ ความต่างเล็ก จึงยังสรุปไม่ได้ว่าการอ่านกับการเล่นกีฬาเกี่ยวข้องกันมาก"
  - { type: check, problem: computer.data.exploratory-analysis.p012, prompt: "ลองตีความค่า r ด้วยตัวเอง" }
glossary:
  - { term: การวิเคราะห์ข้อมูลเชิงสำรวจ (exploratory data analysis), definition: "การดูข้อมูลเพื่อสรุปรูปร่าง ค่ากลาง การกระจาย ค่าผิดปกติ และความสัมพันธ์ ก่อนสร้างข้อสรุปหรือแบบจำลอง" }
  - { term: ควอร์ไทล์ (quartile), definition: "ค่าที่แบ่งข้อมูลที่เรียงแล้วเป็นสี่ส่วนเท่า ๆ กัน Q1 อยู่ที่ 25 เปอร์เซ็นต์ และ Q3 อยู่ที่ 75 เปอร์เซ็นต์" }
  - { term: พิสัยระหว่างควอร์ไทล์ (IQR), definition: "ผลต่าง Q3 − Q1 ซึ่งวัดการกระจายของครึ่งกลางข้อมูล" }
  - { term: ค่าผิดปกติ (outlier), definition: "ค่าที่อยู่นอกช่วง Q1 − 1.5 × IQR ถึง Q3 + 1.5 × IQR ต้องตรวจสาเหตุก่อนตัดสินใจ" }
  - { term: ตารางไขว้ (cross-tabulation), definition: "ตารางที่นับจำนวนสมาชิกในแต่ละคู่ของค่าของตัวแปรสองตัวพร้อมกัน" }
  - { term: สหสัมพันธ์ (correlation), definition: "ค่าที่อยู่ระหว่าง −1 ถึง 1 บอกทิศทางและความแรงของความสัมพันธ์เชิงเส้น ไม่ได้บอกสาเหตุ" }
flashcards:
  - { front: "มัธยฐานกับค่าเฉลี่ยต่างกันอย่างไรเมื่อมีค่าสุดขั้ว", back: "ค่าเฉลี่ยถูกดึงไปตามค่าสุดขั้ว ส่วนมัธยฐานแทบไม่เปลี่ยน" }
  - { front: "กฎ 1.5 IQR ใช้ตรวจอะไร", back: "ค่าที่อยู่นอกช่วง Q1 − 1.5 × IQR ถึง Q3 + 1.5 × IQR ซึ่งต้องตรวจสาเหตุก่อนตัดสินใจ" }
  - { front: "r ใกล้ 1 บอกอะไร", back: "สองตัวแปรเพิ่มขึ้นพร้อมกันอย่างแรงตามแนวเส้นตรง แต่ไม่ได้บอกสาเหตุ" }
  - { front: "ร้อยละในตารางไขว้ควรหารด้วยอะไร", back: "หารด้วยจำนวนของกลุ่มที่เราสนใจ เช่น ทั้งหมดของกลุ่มนั้น ไม่ใช่จำนวนทั้งตาราง" }
