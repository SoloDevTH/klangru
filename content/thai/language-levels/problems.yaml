problems:
- id: thai.grammar.language-levels.p001
  topics:
  - thai.grammar.language-levels
  difficulty: 1
  type: mcq
  stem: คำว่า **เยอะ** เป็นภาษาพูด ถ้าเขียนรายงานควรใช้คำใด
  choices:
  - id: a
    text: มาก
    correct: true
    feedback: ถูก มาก เป็นภาษาเขียน
  - id: b
    text: เยอะแยะ
    feedback: ยังเป็นภาษาพูด
  - id: c
    text: สุด ๆ
    feedback: เป็นภาษาปาก ใช้ในรายงานไม่ได้
  - id: d
    text: หลาย
    feedback: หลาย ใช้กับจำนวนนับ เช่น หลายคน ใช้แทน เยอะ ในทุกประโยคไม่ได้
  hints:
  - หาคำที่ใช้ในหนังสือและข่าว
  - คำที่ใช้ได้ทุกที่ ไม่ใช่คำแสลง
  solution: ภาษาเขียนของ เยอะ คือ **มาก**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.language-levels.p002
  topics:
  - thai.grammar.language-levels
  difficulty: 1
  type: match
  stem: จับคู่คำที่ใช้กันเองกับคำที่สุภาพหรือเป็นทางการกว่า
  pairs:
  - left: กิน
    right: รับประทาน
  - left: หัว
    right: ศีรษะ
  - left: หมา
    right: สุนัข
  - left: มหาลัย
    right: มหาวิทยาลัย
  hints:
  - คำทางการมักยาวกว่าและพบในหนังสือ
  - มหาลัย เป็นคำที่ตัดให้สั้นลง
  solution: กิน → รับประทาน · หัว → ศีรษะ · หมา → สุนัข · มหาลัย → มหาวิทยาลัย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.language-levels.p003
  topics:
  - thai.grammar.language-levels
  difficulty: 2
  type: text
  stem: เปลี่ยนคำภาษาพูด **ยังไง** ให้เป็นภาษาเขียน (พิมพ์หนึ่งคำ)
  accepted:
  - อย่างไร
  misconceptions:
  - match: ยังงัย
    feedback: ยังเป็นภาษาพูด แค่สะกดต่างไป
  - match: ยังไง
    feedback: นี่คือคำเดิมที่เป็นภาษาพูด
  - match: อย่างไง
    feedback: ไม่มีคำนี้ ภาษาเขียนคือ อย่างไร
  hints:
  - คำนี้ใช้ถามวิธีการ
  - ภาษาเขียนขึ้นต้นด้วย อย่าง
  solution: ยังไง → **อย่างไร**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.language-levels.p004
  topics:
  - thai.grammar.language-levels
  difficulty: 2
  type: match
  stem: จับคู่คำภาษาถิ่นกับคำในภาษาไทยมาตรฐาน
  pairs:
  - left: อู้ (ถิ่นเหนือ)
    right: พูด
  - left: แซ่บ (ถิ่นอีสาน)
    right: อร่อย
  - left: อะหยัง (ถิ่นเหนือ)
    right: อะไร
  - left: บ่ (ถิ่นเหนือและอีสาน)
    right: ไม่
  hints:
  - ลองนึกประโยคที่ได้ยินบ่อย เช่น บ่เป็นหยัง
  - แซ่บ ใช้กับอาหาร
  solution: อู้ = พูด · แซ่บ = อร่อย · อะหยัง = อะไร · บ่ = ไม่
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.language-levels.p005
  topics:
  - thai.grammar.language-levels
  difficulty: 2
  type: mcq
  stem: สถานการณ์ใด **ควรใช้ภาษาไทยมาตรฐาน** มากที่สุด
  choices:
  - id: a
    text: รายงานหน้าชั้นเรียนเรื่องการปลูกข้าว
    correct: true
    feedback: ถูก ห้องเรียนเป็นโอกาสที่ต้องให้ทุกคนเข้าใจตรงกัน
  - id: b
    text: คุยกับยายที่บ้านในจังหวัดขอนแก่น
    feedback: คุยกับคนในครอบครัวใช้ภาษาถิ่นได้ และยายอาจคุ้นภาษาถิ่นมากกว่า
  - id: c
    text: เล่นกับเพื่อนบ้านในหมู่บ้าน
    feedback: ใช้ภาษาถิ่นได้ตามธรรมชาติ
  - id: d
    text: ร้องเพลงพื้นบ้านในงานบุญประจำหมู่บ้าน
    feedback: เพลงพื้นบ้านใช้ภาษาถิ่นจึงจะได้ความงามแบบท้องถิ่น
  hints:
  - ภาษาไทยมาตรฐานใช้เมื่อผู้ฟังมาจากหลายที่ หรือเป็นงานทางการ
  - ภาษาถิ่นเหมาะกับครอบครัว ชุมชน และประเพณี
  solution: '**รายงานหน้าชั้นเรียน** ควรใช้ภาษาไทยมาตรฐาน'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.language-levels.p006
  topics:
  - thai.grammar.language-levels
  difficulty: 3
  type: mcq
  stem: ดูข้อความที่นักเรียนส่งถึงครู คำใด **ไม่เหมาะ** จะใช้กับครู (เลือกทุกข้อที่ถูก)
  figure: &id001
    src: chat-teacher.svg
    alt: 'หน้าจอแชตถึง ครูวิภา (ครูประจำชั้น) นักเรียนส่งข้อความ 3 บรรทัด: ครูคะ พรุ่งนี้หนูไม่ไปโรงเรียนนะ / ไม่สบายอ่ะ เป็นไข้ / ขอส่งงานวันศุกร์แทนได้ป่ะคะ ส่งเมื่อ 19:42'
  multiple: true
  choices:
  - id: a
    text: อ่ะ
    correct: true
    feedback: เป็นคำลงท้ายแบบกันเอง ควรตัดออก
  - id: b
    text: ป่ะ
    correct: true
    feedback: เป็นภาษาพูดแบบกันเอง ควรเป็น ไหม
  - id: c
    text: ครูคะ
    feedback: เรียกครูพร้อมคำลงท้ายสุภาพ เหมาะสมแล้ว
  - id: d
    text: หนู
    feedback: นักเรียนหญิงใช้ หนู แทนตัวเองกับครูได้
  hints:
  - หาคำลงท้ายที่ใช้กับเพื่อนสนิท
  - ข้อความถึงครูควรใช้ระดับสนทนาที่สุภาพ
  solution: คำที่ไม่เหมาะคือ **อ่ะ** และ **ป่ะ**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.language-levels.p007
  topics:
  - thai.grammar.language-levels
  difficulty: 3
  type: mcq
  stem: ดูข้อความที่นักเรียนส่งถึงครู ข้อใดแก้ให้เหมาะสมที่สุด
  figure: *id001
  choices:
  - id: a
    text: ครูคะ พรุ่งนี้หนูขอลาหยุดหนึ่งวัน เพราะเป็นไข้ค่ะ ขอส่งงานวันศุกร์แทนได้ไหมคะ
    correct: true
    feedback: ถูก สุภาพ บอกเหตุผล และขออนุญาตชัดเจน
  - id: b
    text: ครูคะ พรุ่งนี้ไม่ไปนะ ไข้ขึ้น ส่งศุกร์นะคะ
    feedback: ห้วนเกินไป และเป็นการบอกไม่ใช่การขออนุญาต
  - id: c
    text: เรียนคุณครูที่เคารพ ข้าพเจ้ามีความประสงค์จะขอลาป่วยตามระเบียบ
    feedback: ทางการเกินไปสำหรับแชตถึงครูประจำชั้น เหมาะกับใบลาที่เขียนเป็นทางการ
  - id: d
    text: ครูจ๋า พรุ่งนี้หนูไม่ไปโรงเรียนน้า ป่วยอ่ะ
    feedback: ยังใช้ภาษากันเอง (จ๋า น้า อ่ะ)
  hints:
  - ระดับที่เหมาะกับแชตถึงครูคือสนทนาที่สุภาพ
  - ต้องบอกเหตุผลและขออนุญาต ไม่ใช่แค่บอก
  solution: '**ครูคะ พรุ่งนี้หนูขอลาหยุดหนึ่งวัน เพราะเป็นไข้ค่ะ ขอส่งงานวันศุกร์แทนได้ไหมคะ**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.language-levels.p008
  topics:
  - thai.grammar.language-levels
  difficulty: 3
  type: order
  stem: เรียงโอกาสจาก **เป็นทางการมากที่สุด** ไปถึง **กันเองที่สุด** (ตามการแบ่ง 5 ระดับ)
  items:
  - กล่าวเปิดงานในพิธี
  - เขียนหนังสือราชการ
  - ประชุมกลุ่มทำโครงงาน
  - ถามทางคนที่ไม่รู้จัก
  - คุยกับเพื่อนสนิท
  hints:
  - '5 ระดับ: พิธีการ ทางการ กึ่งทางการ สนทนา กันเอง'
  - ดูว่าผู้ฟังสนิทกับเราแค่ไหน และเป็นงานพิธีหรือไม่
  solution: พิธีการ (เปิดงาน) → ทางการ (หนังสือราชการ) → กึ่งทางการ (ประชุมกลุ่ม) → สนทนา (ถามทาง) → กันเอง (เพื่อนสนิท)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.language-levels.p009
  topics:
  - thai.grammar.language-levels
  difficulty: 3
  type: mcq
  stem: '"โรงเรียนขอเชิญผู้ปกครองเข้าร่วมประชุม ณ หอประชุม ในวันเสาร์ที่ 5 ธันวาคม เวลา 09.00 น." ข้อความนี้ใช้ภาษาระดับใด (แบบ 3 ระดับ)'
  choices:
  - id: a
    text: ทางการ
    correct: true
    feedback: ถูก ใช้คำทางการ (ขอเชิญ ณ) ประโยคครบ และเป็นหนังสือจากหน่วยงาน
  - id: b
    text: กึ่งทางการ
    feedback: กึ่งทางการผ่อนคลายกว่านี้ เช่น การคุยในที่ประชุมกลุ่ม
  - id: c
    text: ไม่เป็นทางการ
    feedback: ไม่มีคำภาษาพูดหรือคำลงท้ายเลย
  hints:
  - ดูคำ ขอเชิญ และ ณ
  - ดูว่าใครส่งถึงใคร
  solution: '**ทางการ** เพราะใช้คำทางการ ประโยคครบ และเป็นประกาศของหน่วยงาน'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.language-levels.p010
  topics:
  - thai.grammar.language-levels
  difficulty: 4
  type: mcq
  stem: ข้อใด **ไม่ใช่** ลักษณะของภาษาพูด
  choices:
  - id: a
    text: เรียงประโยคครบถ้วนและใช้เครื่องหมายวรรคตอนช่วยสื่อความ
    correct: true
    feedback: ถูก นี่คือลักษณะของภาษาเขียน
  - id: b
    text: มีคำลงท้าย เช่น นะ จ้ะ
    feedback: เป็นลักษณะของภาษาพูด
  - id: c
    text: ละประธานได้เพราะผู้ฟังรู้อยู่แล้ว
    feedback: เป็นลักษณะของภาษาพูด
  - id: d
    text: ใช้น้ำเสียงและสีหน้าช่วยบอกความหมาย
    feedback: เป็นลักษณะของภาษาพูด
  hints:
  - ภาษาพูดมีผู้ฟังอยู่ตรงหน้า
  - ภาษาเขียนต้องสื่อด้วยตัวอักษรอย่างเดียว
  solution: '**การเรียงประโยคครบและใช้เครื่องหมายวรรคตอน** เป็นลักษณะของภาษาเขียน'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.language-levels.p011
  topics:
  - thai.grammar.language-levels
  difficulty: 4
  type: mcq
  stem: นักเรียนจะไปขออนุญาตผู้อำนวยการใช้ห้องประชุม ควรพูดว่าอย่างไร
  choices:
  - id: a
    text: ท่านผู้อำนวยการครับ ผมขออนุญาตใช้ห้องประชุมวันศุกร์นี้ เพื่อซ้อมการแสดงครับ
    correct: true
    feedback: ถูก เรียกตำแหน่งอย่างสุภาพ บอกสิ่งที่ขอและเหตุผล
  - id: b
    text: ผอ.ครับ ขอห้องประชุมหน่อยดิ
    feedback: ดิ เป็นภาษากันเอง และไม่บอกเหตุผล
  - id: c
    text: ผู้อำนวยการ เราจะใช้ห้องประชุมนะ
    feedback: เป็นการบอก ไม่ใช่การขออนุญาต และสรรพนาม เรา ไม่เหมาะ
  - id: d
    text: ข้าพเจ้าใคร่ขอประทานอนุญาตใช้ห้องประชุม
    feedback: ทางการเกินไปสำหรับการพูดต่อหน้า และคำว่า ประทาน ใช้ผิดระดับ
  hints:
  - พูดกับผู้ใหญ่ในโรงเรียนใช้ระดับสนทนาที่สุภาพ
  - มีคำเรียก สรรพนาม คำลงท้าย และเหตุผล
  solution: '**ท่านผู้อำนวยการครับ ผมขออนุญาตใช้ห้องประชุมวันศุกร์นี้ เพื่อซ้อมการแสดงครับ**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.language-levels.p012
  topics:
  - thai.grammar.language-levels
  difficulty: 4
  type: mcq
  stem: ประโยคใดใช้ในรายงานผลการทดลอง **ได้เหมาะสม**
  choices:
  - id: a
    text: ต้นถั่วที่ได้รับแสงแดดเจริญเติบโตเร็วที่สุด
    correct: true
    feedback: ถูก ใช้ภาษาเขียนระดับทางการ
  - id: b
    text: ต้นถั่วที่โดนแดดโตไวสุด ๆ
    feedback: โดน ไว สุด ๆ เป็นภาษาพูด
  - id: c
    text: ต้นถั่วที่ได้แดดโตเร็วเวอร์
    feedback: เวอร์ เป็นคำแสลง
  - id: d
    text: แดดเยอะ ต้นถั่วก็โตเยอะนะ
    feedback: เยอะ และ นะ เป็นภาษาพูด
  hints:
  - รายงานเป็นภาษาเขียนระดับทางการ
  - หาคำภาษาพูดในแต่ละตัวเลือก
  solution: '**ต้นถั่วที่ได้รับแสงแดดเจริญเติบโตเร็วที่สุด**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.language-levels.p013
  topics:
  - thai.grammar.language-levels
  difficulty: 4
  type: match
  stem: จับคู่สถานการณ์กับระดับภาษาที่เหมาะ (แบบ 3 ระดับ)
  pairs:
  - left: เขียนหนังสือขออนุญาตถึงผู้อำนวยการ
    right: ทางการ
  - left: อภิปรายแสดงความเห็นในชั้นเรียน
    right: กึ่งทางการ
  - left: แชตนัดเพื่อนสนิทไปเตะฟุตบอล
    right: ไม่เป็นทางการ
  hints:
  - ดูว่าใครเป็นผู้รับสาร และเป็นงานเขียนหรือพูด
  - กึ่งทางการอยู่ระหว่างงานทางการกับการคุยกันเอง
  solution: หนังสือถึงผู้อำนวยการ → ทางการ · อภิปรายในชั้น → กึ่งทางการ · แชตกับเพื่อน → ไม่เป็นทางการ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.language-levels.p014
  topics:
  - thai.grammar.language-levels
  difficulty: 5
  type: mcq
  stem: ข้อใดกล่าวถึงภาษาไทยมาตรฐานกับภาษาถิ่น **ถูกต้อง**
  choices:
  - id: a
