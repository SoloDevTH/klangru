id: management.principles.organizing
subject: management
title: { th: การจัดองค์การและการออกแบบโครงสร้าง, en: Organizing and organizational design }
summary: แบ่งงานและจัดแผนก สายและช่วงการบังคับบัญชา การรวมและกระจายอำนาจ โครงสร้างตามหน้าที่ ผลิตภัณฑ์ พื้นที่ และเมทริกซ์ และอ่านแผนผังองค์การ
difficulty: 4
minutes: 35
prerequisites: [management.principles.functions]
encompasses:
  - { id: management.principles.functions, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: structures.svg
    alt: "สี่แผนผังย่อย ก. ตามหน้าที่: กรรมการผู้จัดการ แตกเป็นฝ่ายผลิต ฝ่ายการตลาด ฝ่ายบัญชี ฝ่ายบุคคล ข. ตามผลิตภัณฑ์: กรรมการผู้จัดการ แตกเป็นกลุ่มน้ำพริก กลุ่มขนมไทย กลุ่มเครื่องดื่ม แต่ละกลุ่มมีหน่วยผลิตและหน่วยขายของตัวเอง ค. ตามพื้นที่: กรรมการผู้จัดการ แตกเป็นภาคเหนือ ภาคอีสาน ภาคกลาง ภาคใต้ ง. แบบเมทริกซ์: ฝ่ายวิศวกรรม จัดซื้อ การเงิน เป็นคอลัมน์ โครงการ ก และ ข เป็นแถว พนักงานแต่ละคนอยู่ที่จุดตัด รายงานทั้งหัวหน้าฝ่ายและผู้จัดการโครงการ"
    caption: "รูปแบบโครงสร้างองค์การสี่แบบ แบบเมทริกซ์ทำให้พนักงานมีหัวหน้าสองคน"
  - type: worked-example
    title: ช่วงการบังคับบัญชากับจำนวนผู้จัดการ
    problem: "โรงงานตัดเย็บแห่งหนึ่งมีพนักงานระดับปฏิบัติ 1,000 คน เปรียบเทียบจำนวนหัวหน้าทุกระดับและจำนวนระดับการบังคับบัญชา ถ้าหัวหน้าทุกคนดูแลลูกน้องโดยตรง 10 คน กับ 5 คน"
    steps:
      - text: "ช่วง 10: ระดับแรกเหนือพนักงาน $1{,}000 \\div 10 = 100$ คน ระดับถัดไป $100 \\div 10 = 10$ คน แล้ว $10 \\div 10 = 1$ คน"
      - text: "รวมหัวหน้า $100 + 10 + 1 = 111$ คน มี 3 ระดับ"
      - text: "ช่วง 5: $1{,}000 \\div 5 = 200$, $200 \\div 5 = 40$, $40 \\div 5 = 8$, $8 \\div 5 = 1.6$ ปัดขึ้นเป็น 2, แล้ว 1"
        why: "หัวหน้าเป็นคนเต็มคน ถ้าหารไม่ลงตัวต้องปัดขึ้น เพราะคนที่เหลือก็ต้องมีหัวหน้า"
      - text: "รวมหัวหน้า $200 + 40 + 8 + 2 + 1 = 251$ คน มี 5 ระดับ"
      - text: "ผลต่าง $251 - 111 = 140$ คน และข้อมูลจากผู้บริหารสูงสุดต้องผ่านเพิ่มอีก 2 ระดับ"
    answer: "ช่วง 10 ใช้หัวหน้า 111 คน 3 ระดับ ช่วง 5 ใช้ 251 คน 5 ระดับ ช่วงแคบดูแลใกล้ชิดกว่าแต่ใช้ผู้จัดการมากกว่า 140 คนและสื่อสารช้ากว่า"
  - { type: check, problem: management.principles.organizing.p007, prompt: "หารแล้วอย่าลืมว่าหัวหน้าต้องเป็นจำนวนเต็ม" }
  - type: worked-example
    title: เลือกโครงสร้างให้บริษัทที่ขยายตัว
    problem: "บริษัทขนมไทยแห่งหนึ่ง (สมมติ) เดิมจัดโครงสร้างตามหน้าที่ ตอนนี้ขายสินค้าสามกลุ่มที่ลูกค้าต่างกันมาก คือ ขนมสดส่งร้านกาแฟ ขนมแห้งส่งห้างสรรพสินค้า และของฝากส่งร้านในแหล่งท่องเที่ยว ฝ่ายขายฝ่ายเดียวดูแลไม่ทั่วถึงและไม่มีใครรับผิดชอบกำไรของแต่ละกลุ่ม ควรปรับเป็นโครงสร้างแบบใด"
    steps:
      - text: "ระบุปัญหา: ลูกค้าและสินค้าแต่ละกลุ่มต่างกัน และไม่มีผู้รับผิดชอบผลงานของแต่ละกลุ่ม"
      - text: "พิจารณาโครงสร้างตามพื้นที่: ปัญหาไม่ได้อยู่ที่ภาค เพราะลูกค้าทั้งสามกลุ่มอยู่ทั่วประเทศ จึงไม่ตรงจุด"
      - text: "พิจารณาโครงสร้างตามผลิตภัณฑ์: แต่ละกลุ่มมีผู้จัดการรับผิดชอบการผลิต การขาย และกำไรของตัวเอง ตรงกับปัญหา"
      - text: "ชั่งข้อเสีย: งานบางอย่างจะซ้ำกัน จึงคงบัญชีและบุคคลเป็นฝ่ายกลางตามหน้าที่ไว้"
        why: "งานสนับสนุนที่ทุกกลุ่มใช้เหมือนกันไม่จำเป็นต้องแยก แยกแล้วต้นทุนเพิ่มโดยไม่ได้ประโยชน์"
    answer: "ปรับเป็นโครงสร้างตามผลิตภัณฑ์สามกลุ่ม โดยคงฝ่ายบัญชีและฝ่ายบุคคลเป็นหน่วยกลาง (โครงสร้างผสม)"
  - type: figure
    src: p-orgchart.svg
    alt: "แผนผังองค์การบริษัทนาคราชอาหารแช่แข็ง จำกัด (สมมติ) กรรมการผู้จัดการอยู่บนสุด มีที่ปรึกษากฎหมายต่อด้วยเส้นประด้านข้าง ใต้กรรมการผู้จัดการมีเส้นทึบลงไปยังผู้จัดการฝ่ายผลิต ฝ่ายขาย ฝ่ายบัญชี และฝ่ายบุคคล ใต้ผู้จัดการฝ่ายผลิตมีหัวหน้าแผนกแปรรูป แผนกบรรจุ และแผนกซ่อมบำรุง ใต้ผู้จัดการฝ่ายขายมีทีมขายภาคเหนือและทีมขายภาคใต้ ใต้หัวหน้าแผนกบรรจุมีพนักงานบรรจุ 2 คน"
    caption: "แผนผังองค์การที่ใช้ในโจทย์ ข้อ p004–p006"
  - { type: check, problem: management.principles.organizing.p004 }
glossary:
  - { term: การจัดองค์การ, definition: "หน้าที่การจัดการที่แบ่งงาน จัดกลุ่มงาน มอบหมายคน และกำหนดอำนาจและสายการรายงาน" }
  - { term: สายการบังคับบัญชา, definition: "เส้นอำนาจต่อเนื่องจากผู้บริหารสูงสุดถึงพนักงานระดับล่าง บอกว่าใครรายงานต่อใคร" }
  - { term: ช่วงการบังคับบัญชา, definition: "จำนวนผู้ใต้บังคับบัญชาที่รายงานต่อหัวหน้าหนึ่งคนโดยตรง" }
  - { term: เอกภาพการบังคับบัญชา, definition: "หลักที่ให้พนักงานหนึ่งคนมีหัวหน้าโดยตรงคนเดียว" }
  - { term: การกระจายอำนาจ, definition: "การให้ผู้บริหารระดับล่างหรือผู้ที่อยู่ใกล้ปัญหามีอำนาจตัดสินใจ" }
  - { term: โครงสร้างแบบเมทริกซ์, definition: "โครงสร้างที่พนักงานสังกัดฝ่ายตามหน้าที่และทำงานให้โครงการไปพร้อมกัน จึงมีหัวหน้าสองสาย" }
flashcards:
  - { front: "ช่วงการบังคับบัญชาแคบ vs กว้าง", back: "แคบ: ดูแลใกล้ชิด ผู้จัดการมาก หลายระดับ (แบบสูง) · กว้าง: ผู้จัดการน้อย ระดับน้อย (แบบแบน) สื่อสารเร็ว" }
  - { front: "จำนวนหัวหน้าเมื่อพนักงาน N คน ช่วง s", back: "รวม N/s + N/s² + ... (ปัดขึ้นทีละระดับ) จนเหลือ 1 คน" }
  - { front: "สี่รูปแบบโครงสร้าง", back: "ตามหน้าที่ · ตามผลิตภัณฑ์ · ตามพื้นที่ · แบบเมทริกซ์" }
  - { front: "ข้อเสียหลักของแบบเมทริกซ์", back: "มีหัวหน้าสองคน ขัดกับเอกภาพการบังคับบัญชา อาจได้คำสั่งขัดกัน" }
  - { front: "เส้นทึบกับเส้นประในแผนผังองค์การ", back: "เส้นทึบ = สายการบังคับบัญชา · เส้นประ = หน่วยที่ปรึกษาหรือความสัมพันธ์ที่ไม่ได้สั่งงาน" }
