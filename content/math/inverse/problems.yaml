    stem: "เรียงขั้นตอนการหาฟังก์ชันผกผันของ $f(x) = \\dfrac{x - 1}{x + 2}$"
    items:
      - "เขียน $y = \\dfrac{x - 1}{x + 2}$"
      - "คูณไขว้: $y(x + 2) = x - 1$"
      - "จัดพจน์ที่มี $x$ ไว้ข้างเดียว: $xy - x = -1 - 2y$"
      - "ดึงตัวร่วม: $x(y - 1) = -(1 + 2y)$ จึง $x = \\dfrac{1 + 2y}{1 - y}$"
      - "สลับชื่อตัวแปร: $f^{-1}(x) = \\dfrac{1 + 2x}{1 - x}$"
    hints:
      - "เริ่มจากการกำจัดตัวส่วน"
      - "ดึงตัวร่วม $x$ ได้เมื่อพจน์ที่มี $x$ อยู่ข้างเดียวกันแล้ว"
    solution: "เขียนเป็น $y$ → คูณไขว้ → รวมพจน์ $x$ → ดึงตัวร่วมแล้วหาร → สลับตัวแปร ตรวจ: $f(0) = -\\tfrac12$ และ $f^{-1}\\left(-\\tfrac12\\right) = \\tfrac{0}{1.5} = 0$"
