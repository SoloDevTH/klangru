  - id: computer.systems.operating-systems.p014
    topics: [computer.systems.operating-systems]
    difficulty: 4
    type: mcq
    stem: "โน้ตบุ๊กมี RAM 4 GB นักเรียนเปิดเบราว์เซอร์ 40 แท็บพร้อมโปรแกรมตัดต่อวิดีโอ เครื่องช้ามาก ไฟแสดงการทำงานของดิสก์กะพริบตลอด สาเหตุที่น่าจะเป็นที่สุดคืออะไร"
    choices:
      - { id: a, text: "RAM ไม่พอ ระบบปฏิบัติการจึงย้ายหน้าหน่วยความจำไปพักในดิสก์และสลับกลับบ่อย ซึ่งช้ากว่า RAM มาก", correct: true }
      - { id: b, text: "ดิสก์เต็มจึงหยุดทำงาน", feedback: "ไฟดิสก์กะพริบตลอดแสดงว่าดิสก์ยังทำงานหนัก สาเหตุคือการสลับหน้าหน่วยความจำ" }
      - { id: c, text: "หน่วยประมวลผลร้อนเกินไป", feedback: "อาจทำให้ช้าได้ แต่ไม่ได้อธิบายว่าทำไมดิสก์ทำงานตลอด" }
      - { id: d, text: "อินเทอร์เน็ตช้า", feedback: "อินเทอร์เน็ตช้าไม่ทำให้โปรแกรมตัดต่อวิดีโอในเครื่องช้า และไม่เกี่ยวกับไฟดิสก์" }
    hints:
      - "เมื่อ RAM ไม่พอ ระบบปฏิบัติการใช้อะไรช่วย"
      - "ดิสก์ช้ากว่า RAM หลายเท่า"
    solution: "หน่วยความจำเสมือนให้เปิดโปรแกรมได้เกิน RAM โดยพักหน้าที่ไม่ใช้ไว้ในดิสก์ แต่เมื่อทุกโปรแกรมต้องใช้หน่วยความจำจริงพร้อมกัน หน้าถูกสลับเข้าออกตลอด เครื่องจึงช้ามาก วิธีแก้คือปิดแท็บหรือแอปที่ไม่ใช้ หรือเพิ่ม RAM"
