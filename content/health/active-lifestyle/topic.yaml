id: health.fitness.active-lifestyle
subject: health
title: { th: "วิถีชีวิตกระฉับกระเฉง: คำแนะนำกิจกรรมทางกาย พฤติกรรมเนือยนิ่ง และกลยุทธ์เพิ่มการเคลื่อนไหว", en: "An active lifestyle: physical activity guidance, sedentary behaviour and ways to move more" }
summary: รู้คำแนะนำกิจกรรมทางกายของ WHO สำหรับวัย 5–17 ปี ลดการนั่งนานโดยไม่จำเป็น เลือกกิจกรรมที่สนุกและปลอดภัย และวางแผนเพิ่มการเคลื่อนไหวของตนเอง
difficulty: 3
minutes: 35
prerequisites: [health.fitness.fitness-components]
encompasses:
  - { id: health.fitness.fitness-components, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ระดับความหนักตามการทดสอบการพูด
    src: activity-levels.svg
    alt: "แถบสี่ช่อง จากซ้ายไปขวา: เนือยนิ่ง (นั่ง เอน หรือนอนตื่นอยู่), เบา (ร้องเพลงได้สบาย ๆ), ปานกลาง (พูดได้เป็นประโยคแต่ร้องเพลงไม่ได้), หนัก (พูดได้เป็นคำ ๆ)"
    caption: "ใช้การพูดคุยเป็นเกณฑ์คร่าว ๆ เพื่อดูว่ากิจกรรมหนักเบาแค่ไหน"
  - { type: check, problem: health.fitness.active-lifestyle.p005, prompt: "ลองคิดก่อนอ่านต่อ: WHO แนะนำกิจกรรมที่หนักอย่างน้อยกี่วันต่อสัปดาห์" }
  - type: worked-example
    title: อ่านค่าเฉลี่ยจากกราฟกิจกรรมหนึ่งสัปดาห์
    problem: "กราฟแท่งแสดงเวลากิจกรรมปานกลางถึงหนักของเด็กตัวอย่าง (ข้อมูลสมมติ) ค่าเฉลี่ยต่อวันต่ำกว่าเป้า 60 นาทีกี่นาที และทั้งสัปดาห์ขาดกี่นาที"
    steps:
      - text: "รวมเวลาทั้ง 7 วัน: 65 + 30 + 70 + 50 + 40 + 90 + 20 = 365 นาที"
      - text: "หาค่าเฉลี่ยต่อวัน: 365 ÷ 7 ≈ 52.1 นาที"
        why: "ค่าเฉลี่ยใช้เทียบกับเป้า 60 นาทีต่อวัน ซึ่ง WHO กำหนดเป็นค่าเฉลี่ยตลอดทั้งสัปดาห์"
      - text: "เทียบกับเป้า: 60 − 52.1 ≈ 7.9 นาทีต่อวัน"
      - text: "ทั้งสัปดาห์ เป้า 60 × 7 = 420 นาที ขาดไป 420 − 365 = 55 นาที"
        why: "วันที่ทำได้มากบางวันไม่ได้ลบล้างผลรวมทั้งสัปดาห์ จึงต้องดูทั้งค่าเฉลี่ยและผลรวม"
    answer: "เฉลี่ยวันละประมาณ 52.1 นาที ต่ำกว่าเป้า 7.9 นาทีต่อวัน ทั้งสัปดาห์ขาด 55 นาที"
  - type: figure
    title: กราฟเวลากิจกรรมตัวอย่างหนึ่งสัปดาห์
    src: weekly-minutes.svg
    alt: "กราฟแท่งแสดงเวลากิจกรรมปานกลางถึงหนักของเด็กตัวอย่าง จันทร์ 65 อังคาร 30 พุธ 70 พฤหัสบดี 50 ศุกร์ 40 เสาร์ 90 อาทิตย์ 20 นาที มีเส้นประระดับ 60 นาทีเป็นเป้า"
    caption: "ข้อมูลตัวอย่างสมมติ เพื่อให้เห็นว่าเป้าเฉลี่ยทั้งสัปดาห์ต่างจากการดูแค่วันที่ดีที่สุด"
  - type: worked-example
    title: เดินไปโรงเรียนช่วยเพิ่มกิจกรรมได้เท่าไร
    problem: "น้องเดินเร็วไปกลับโรงเรียนวันละ 25 นาที 5 วันต่อสัปดาห์ ถ้าการเดินนี้เพียงพอชดเชยเวลาที่ขาดจากตัวอย่างในกราฟหรือไม่"
    steps:
      - text: "คำนวณเวลาเดินต่อสัปดาห์: 25 × 5 = 125 นาที"
      - text: "เวลาที่ขาดจากตัวอย่างทั้งสัปดาห์คือ 55 นาที"
        why: "ต้องรู้จำนวนที่ขาดก่อนจึงจะประเมินได้ว่าการเดินพอหรือไม่"
      - text: "125 มากกว่า 55 จึงพอชดเชยได้ แต่ต้องเป็นการเดินเร็วที่หายใจแรงขึ้น ไม่ใช่เดินช้า ๆ"
        why: "การเดินช้า ๆ อาจยังไม่เข้าระดับปานกลาง จึงไม่นับเป็นกิจกรรมที่ตรงตามคำแนะนำ"
    answer: "ได้ เพราะ 125 นาทีมากกว่าเวลาที่ขาด 55 นาที (เมื่อเป็นการเดินเร็ว)"
  - { type: check, problem: health.fitness.active-lifestyle.p011, prompt: "ลองคิดก่อนอ่านต่อ: การพูดได้เป็นประโยคแต่ร้องเพลงไม่ได้ อยู่ระดับใด" }
glossary:
  - { term: กิจกรรมทางกาย, definition: "การเคลื่อนไหวของร่างกายที่ใช้พลังงาน เช่น เดิน ปั่นจักรยาน เล่นกีฬา หรือเล่นกลางแจ้ง" }
  - { term: พฤติกรรมเนือยนิ่ง, definition: "การนั่ง เอน หรือนอนตื่นอยู่ที่ใช้พลังงานต่ำ เช่น การนั่งดูจอนาน ๆ" }
  - { term: ปานกลางถึงหนัก, definition: "ระดับความหนักที่ทำให้หายใจเร็วและแรงขึ้น พูดได้เป็นประโยคแต่ร้องเพลงไม่ได้ในระดับปานกลาง" }
  - { term: เป้าหมาย SMART, definition: "เป้าหมายที่เฉพาะเจาะจง วัดได้ ทำได้จริง เกี่ยวข้องกับเรา และมีกำหนดเวลา" }
flashcards:
  - { front: "WHO แนะนำให้เด็กและวัยรุ่น 5–17 ปี ทำกิจกรรมปานกลางถึงหนักเฉลี่ยกี่นาทีต่อวัน", back: "อย่างน้อยเฉลี่ย 60 นาทีต่อวันตลอดสัปดาห์" }
  - { front: "กิจกรรมที่หนักและเสริมกล้ามเนื้อกระดูกควรทำอย่างน้อยกี่วันต่อสัปดาห์", back: "อย่างน้อย 3 วันต่อสัปดาห์" }
  - { front: "พฤติกรรมเนือยนิ่งคืออะไร", back: "การนั่ง เอน หรือนอนตื่นอยู่ที่ใช้พลังงานต่ำ" }
  - { front: "ทดสอบความหนักของกิจกรรมด้วยการพูดอย่างไร", back: "พูดได้เป็นประโยคแต่ร้องเพลงไม่ได้ = ปานกลาง พูดได้เป็นคำ ๆ = หนัก" }
