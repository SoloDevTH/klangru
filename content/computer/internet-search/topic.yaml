id: computer.data.internet-search
subject: computer
title: { th: การค้นหาข้อมูลและประเมินความน่าเชื่อถือ, en: Searching for information and evaluating credibility }
summary: เลือกคำค้นและตัวช่วยค้นหา เข้าใจว่าผลการค้นหาถูกจัดอันดับอย่างไร ประเมินแหล่งที่มา ผู้เขียน และวันที่ รู้ทันข่าวปลอมและเหตุผลวิบัติ และใช้อินเทอร์เน็ตทำงานร่วมกัน
difficulty: 2
minutes: 35
prerequisites: [computer.data.digital-data-basics]
encompasses:
  - { id: computer.data.digital-data-basics, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: credibility-check.svg
    alt: "การ์ดห้าใบเรียงกัน ใคร: ผู้เขียนหรือหน่วยงานรู้จริงเรื่องนี้ไหม เมื่อไร: เขียนหรือแก้ไขล่าสุดเมื่อไร ที่ไหน: เว็บไซต์อะไร ชื่อเว็บน่าสงสัยไหม ทำไม: เขียนเพื่อให้ความรู้หรือขายของ ปลุกปั่น หลักฐาน: อ้างแหล่งที่มาไหม แหล่งอื่นยืนยันไหม ใต้การ์ดเขียนว่าข้อมูลที่ผ่านหลายข้อและตรงกับแหล่งอื่นที่ไม่เกี่ยวข้องกันน่าเชื่อถือมากขึ้น"
    caption: "ห้าคำถามก่อนเชื่อหรือแชร์ข้อมูล"
  - { type: check, problem: computer.data.internet-search.p004, prompt: "ดูป้ายกำกับในผลการค้นหาให้ดี" }
  - type: worked-example
    title: สร้างคำค้นให้แคบลงทีละขั้น
    problem: "ภูมิต้องการหาประวัติของประเพณีลอยกระทงจากเว็บไซต์ของสถานศึกษาไทย แต่เมื่อค้นคำว่า ลอยกระทง ผลส่วนใหญ่เป็นเนื้อเพลงและโปรโมชันร้านอาหาร ควรปรับคำค้นอย่างไร"
    steps:
      - text: "เพิ่มคำสำคัญที่บอกสิ่งที่ต้องการ: `ประวัติ ลอยกระทง`"
        why: "คำค้นสั้นเกินไปทำให้ได้ทุกเรื่องที่เกี่ยวกับลอยกระทง การเพิ่มคำช่วยให้ระบบเลือกหน้าที่ตรงขึ้น"
      - text: "ตัดผลที่เป็นเพลงออก: `ประวัติ ลอยกระทง -เพลง`"
      - text: "จำกัดเฉพาะเว็บสถานศึกษาไทย: `ประวัติ ลอยกระทง -เพลง site:ac.th`"
        why: "โดเมน ac.th ใช้กับสถานศึกษาในไทย จึงได้แหล่งที่มีแนวโน้มเป็นบทความวิชาการมากขึ้น แต่ยังต้องตรวจผู้เขียนและการอ้างอิงเหมือนเดิม"
      - text: "เปิดอ่านอย่างน้อย 2–3 แหล่ง แล้วเทียบว่าให้ข้อมูลตรงกันหรือไม่ และจดชื่อเว็บกับวันที่ไว้อ้างอิง"
    answer: "ใช้คำค้น `ประวัติ ลอยกระทง -เพลง site:ac.th` แล้วเทียบหลายแหล่ง"
  - type: worked-example
    title: ตรวจโพสต์ที่ถูกแชร์ในกลุ่มครอบครัว
    problem: "มีคนส่งโพสต์ในกลุ่มแชทครอบครัวว่า \"ด่วน!!! ดื่มน้ำมะนาวร้อนวันละแก้วฆ่าเชื้อไวรัสได้ 100% หมอยืนยันแล้ว แชร์ด่วนก่อนถูกลบ\" มีคนแชร์ 25,000 ครั้ง ควรเชื่อหรือแชร์ต่อหรือไม่"
    steps:
      - text: "ถาม ใคร: เป็นเพจที่เพิ่งสร้าง ไม่ระบุชื่อแพทย์ที่ยืนยัน"
      - text: "ถาม ทำไม: ใช้คำเกินจริง 100% และเร่งให้แชร์ด่วน เป็นสัญญาณของข่าวปลอม"
        why: "ข้อมูลทางการแพทย์ที่ถูกต้องแทบไม่เคยอ้างว่าได้ผล 100% และไม่ต้องรีบแชร์ก่อนถูกลบ"
      - text: "ถาม หลักฐาน: ไม่มีลิงก์งานวิจัยหรือหน่วยงานสาธารณสุข ค้นต่อจากเว็บไซต์ของหน่วยงานด้านสุขภาพแล้วไม่พบการยืนยัน"
      - text: "จำนวนแชร์ 25,000 ครั้งไม่ใช่หลักฐาน การเชื่อเพราะคนแชร์มากคือเหตุผลวิบัติแบบอ้างคนส่วนใหญ่"
    answer: "ไม่ควรเชื่อและไม่ควรแชร์ต่อ ควรบอกครอบครัวอย่างสุภาพว่ายังไม่มีหลักฐาน และให้ปรึกษาแพทย์หรือดูข้อมูลจากหน่วยงานสาธารณสุข"
  - { type: check, problem: computer.data.internet-search.p011, prompt: "ใช้แนวคิดเทียบหลายแหล่ง" }
glossary:
  - { term: โปรแกรมค้นหา (search engine), definition: "บริการที่ทำดัชนีหน้าเว็บไว้ล่วงหน้า แล้วเลือกและจัดอันดับหน้าที่ตรงกับคำค้น" }
  - { term: คำค้น (keyword), definition: "คำสำคัญที่พิมพ์ลงในโปรแกรมค้นหาเพื่อบอกสิ่งที่ต้องการ" }
  - { term: ความน่าเชื่อถือ (credibility), definition: "ระดับที่ข้อมูลน่าจะถูกต้อง พิจารณาจากผู้เขียน วันที่ แหล่งที่มา จุดประสงค์ และหลักฐาน" }
  - { term: ข่าวปลอม (fake news), definition: "ข้อมูลเท็จหรือบิดเบือนที่ทำให้ดูเหมือนข่าวจริง" }
  - { term: เหตุผลวิบัติ (fallacy), definition: "การให้เหตุผลที่ฟังดูดีแต่ผิดหลักตรรกะ จึงสรุปไม่ได้จริง" }
flashcards:
  - { front: "ตัวช่วยค้นหา \"...\" -คำ site: ทำอะไร", back: "\"...\" หาวลีตรงตัว, -คำ ตัดผลที่มีคำนั้น, site: ค้นเฉพาะเว็บหรือโดเมนที่ระบุ" }
  - { front: "ผลอันดับแรกถูกต้องที่สุดเสมอหรือไม่", back: "ไม่ อันดับมาจากความตรงกับคำค้นและความนิยม อาจเป็นโฆษณาด้วย" }
  - { front: "ห้าคำถามประเมินความน่าเชื่อถือ", back: "ใคร เมื่อไร ที่ไหน ทำไม หลักฐาน" }
  - { front: "คนแชร์เยอะจึงเป็นเรื่องจริง ผิดอย่างไร", back: "เป็นเหตุผลวิบัติแบบอ้างคนส่วนใหญ่ จำนวนคนเชื่อไม่ได้พิสูจน์ความจริง" }
