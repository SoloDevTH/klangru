problems:
  - id: phy.circuit.p001
    topics: [physics.electricity.circuits]
    difficulty: 1
    type: numeric
    stem: "ตัวต้านทาน $4\\ \\Omega$ และ $6\\ \\Omega$ ต่อกันแบบอนุกรม ความต้านทานรวมเป็นกี่โอห์ม (ตอบเป็นตัวเลขในหน่วย Ω)"
    answer: { value: 10, unit: Ω }
    hints:
      - "แบบอนุกรม กระแสต้องผ่านตัวต้านทานทั้งสองตัวตามลำดับ"
      - "ความต้านทานรวมแบบอนุกรมคือ $R = R_1 + R_2$"
    misconceptions:
      - { match: 2.4, feedback: "นั่นคือความต้านทานรวมแบบ **ขนาน** ข้อนี้ต่ออนุกรม ให้นำค่ามาบวกกัน" }
      - { match: 24, feedback: "ความต้านทานแบบอนุกรมนำมาบวกกัน ไม่ใช่คูณกัน" }
    solution: "$R = R_1 + R_2 = 4\\ \\Omega + 6\\ \\Omega = 10\\ \\Omega$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.circuit.p002
    topics: [physics.electricity.circuits]
    difficulty: 2
    type: numeric
    stem: "ตัวต้านทาน $6\\ \\Omega$ และ $3\\ \\Omega$ ต่อกันแบบขนาน ความต้านทานรวมเป็นกี่โอห์ม (ตอบเป็นตัวเลขในหน่วย Ω)"
    answer: { value: 2, unit: Ω }
    hints:
      - "แบบขนานใช้ $\\dfrac{1}{R} = \\dfrac{1}{R_1} + \\dfrac{1}{R_2}$"
      - "บวกเศษส่วนโดยใช้ตัวส่วนร่วม 6 แล้วอย่าลืมกลับเศษส่วนในขั้นสุดท้าย"
      - "หรือใช้สูตรลัดสำหรับสองตัว $R = \\dfrac{R_1 R_2}{R_1 + R_2}$"
    misconceptions:
      - { match: 9, feedback: "นั่นคือความต้านทานรวมแบบอนุกรม แบบขนานความต้านทานรวมต้องน้อยกว่าตัวที่น้อยที่สุด ($3\\ \\Omega$)" }
      - { match: 0.5, feedback: "$\\tfrac{1}{6} + \\tfrac{1}{3} = \\tfrac{1}{2}$ คือค่าของ $\\tfrac{1}{R}$ ยังต้องกลับเศษส่วนจึงจะได้ $R$" }
    solution: "$\\dfrac{1}{R} = \\dfrac{1}{6} + \\dfrac{1}{3} = \\dfrac{1}{6} + \\dfrac{2}{6} = \\dfrac{3}{6} = \\dfrac{1}{2}$ → $R = 2\\ \\Omega$ (ตรวจด้วยสูตรลัด: $\\dfrac{6 \\times 3}{6 + 3} = \\dfrac{18}{9} = 2\\ \\Omega$ ✓)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.circuit.p003
    topics: [physics.electricity.circuits]
    difficulty: 2
    type: mcq
    stem: "เหตุผลหลักที่เต้ารับและเครื่องใช้ไฟฟ้าในบ้านเรือนของไทยต่อกันแบบขนานคือข้อใด"
    choices:
      - { id: a, text: "ทุกเครื่องได้ความต่างศักย์ $220\\ \\mathrm{V}$ เต็ม และเปิดปิดแต่ละเครื่องได้อิสระ", correct: true }
      - { id: b, text: "ทำให้กระแสรวมที่ไหลเข้าบ้านน้อยลงเมื่อเปิดเครื่องเพิ่ม", feedback: "ตรงกันข้าม ยิ่งเปิดเครื่องเพิ่ม ความต้านทานรวมแบบขนานยิ่งลดลง กระแสรวมจึงเพิ่มขึ้น" }
      - { id: c, text: "ทำให้ทุกเครื่องได้กระแสเท่ากัน", feedback: "แบบขนาน ความต่างศักย์เท่ากัน ไม่ใช่กระแส เครื่องที่ความต้านทานน้อย (เช่น เครื่องทำน้ำอุ่น) ได้กระแสมากกว่า" }
      - { id: d, text: "ทำให้ความต่างศักย์แบ่งกันไปตามจำนวนเครื่อง", feedback: "นั่นคือลักษณะของการต่ออนุกรม ถ้าต่ออนุกรม แต่ละเครื่องจะได้ไม่ถึง $220\\ \\mathrm{V}$ และเครื่องหนึ่งดับทุกเครื่องจะดับ" }
    hints:
      - "ในวงจรขนาน ปริมาณใดเท่ากันทุกทาง"
      - "นึกถึงสิ่งที่เกิดขึ้นเมื่อปิดพัดลม ทีวีที่เปิดอยู่ยังทำงานไหม"
    solution: "การต่อขนานทำให้ทุกเครื่องได้ความต่างศักย์เท่ากับแหล่งจ่าย ($220\\ \\mathrm{V}$) ตามที่เครื่องออกแบบไว้ และแต่ละเครื่องมีทางเดินกระแสของตัวเอง จึงเปิดปิดหรือเสียได้โดยไม่กระทบเครื่องอื่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.circuit.p004
    topics: [physics.electricity.circuits]
    difficulty: 3
    type: numeric
    stem: "ตัวต้านทาน $2\\ \\Omega$ และ $4\\ \\Omega$ ต่ออนุกรมกับแบตเตอรี่ $12\\ \\mathrm{V}$ ความต่างศักย์คร่อมตัวต้านทาน $4\\ \\Omega$ เป็นกี่โวลต์ (ตอบเป็นตัวเลขในหน่วย V)"
    answer: { value: 8, unit: V }
    hints:
      - "หาความต้านทานรวมและกระแสในวงจรก่อน กระแสเท่ากันทุกตัวในวงจรอนุกรม"
      - "ความต่างศักย์คร่อมตัวต้านทานแต่ละตัวคือ $V = IR$ ของตัวนั้น"
    misconceptions:
      - { match: 6, feedback: "ความต่างศักย์ไม่ได้แบ่งครึ่งเท่ากัน ตัวต้านทานที่มากกว่าได้ความต่างศักย์มากกว่า ใช้ $V = IR$ กับแต่ละตัว" }
      - { match: 4, feedback: "นั่นคือความต่างศักย์คร่อมตัว $2\\ \\Omega$ โจทย์ถามตัว $4\\ \\Omega$" }
    solution: "$R = 2 + 4 = 6\\ \\Omega$ → $I = \\dfrac{12\\ \\mathrm{V}}{6\\ \\Omega} = 2\\ \\mathrm{A}$ → $V_{4\\Omega} = (2\\ \\mathrm{A})(4\\ \\Omega) = 8\\ \\mathrm{V}$ (ตรวจ: ตัว $2\\ \\Omega$ ได้ $4\\ \\mathrm{V}$ รวม $12\\ \\mathrm{V}$ ✓)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.circuit.p005
    topics: [physics.electricity.circuits]
    difficulty: 3
    type: numeric
    stem: "ตัวต้านทาน $3\\ \\Omega$ และ $6\\ \\Omega$ ต่อขนานกันแล้วต่อกับแบตเตอรี่ $12\\ \\mathrm{V}$ กระแสรวมที่ออกจากแบตเตอรี่เป็นกี่แอมแปร์ (ตอบเป็นตัวเลขในหน่วย A)"
    answer: { value: 6, unit: A }
    hints:
      - "ในวงจรขนาน ตัวต้านทานแต่ละตัวได้ความต่างศักย์เท่ากับแบตเตอรี่"
      - "หากระแสในแต่ละทางด้วย $I = \\dfrac{V}{R}$ แล้วนำมารวมกัน"
    misconceptions:
      - { match: 1.333, feedback: "ดูเหมือนรวมความต้านทานแบบอนุกรม ($9\\ \\Omega$) ข้อนี้ต่อขนาน ความต้านทานรวมคือ $2\\ \\Omega$" }
      - { match: 4, feedback: "นั่นคือกระแสในตัว $3\\ \\Omega$ เพียงทางเดียว กระแสรวมต้องบวกกระแสในตัว $6\\ \\Omega$ ด้วย" }
    solution: "$I_1 = \\dfrac{12}{3} = 4\\ \\mathrm{A}$, $I_2 = \\dfrac{12}{6} = 2\\ \\mathrm{A}$ → $I = 4 + 2 = 6\\ \\mathrm{A}$ (ตรวจ: $R = \\dfrac{3 \\times 6}{3 + 6} = 2\\ \\Omega$ และ $\\dfrac{12}{2} = 6\\ \\mathrm{A}$ ✓)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.circuit.p006
    topics: [physics.electricity.circuits]
    difficulty: 2
    type: match
    stem: "จับคู่ข้อความกับสมบัติที่ถูกต้องของวงจร"
    pairs:
      - { left: "ปริมาณที่เท่ากันทุกตัวในวงจรอนุกรม", right: "กระแสไฟฟ้า" }
      - { left: "ปริมาณที่เท่ากันทุกตัวในวงจรขนาน", right: "ความต่างศักย์" }
      - { left: "ความต้านทานรวมแบบอนุกรม", right: "มากกว่าตัวที่มากที่สุด" }
      - { left: "ความต้านทานรวมแบบขนาน", right: "น้อยกว่าตัวที่น้อยที่สุด" }
    hints:
      - "อนุกรมมีทางเดินกระแสทางเดียว ขนานแต่ละตัวต่อคร่อมจุดสองจุดเดียวกัน"
      - "ลองคิดกับตัวอย่าง $6\\ \\Omega$ สองตัว: อนุกรมได้ $12\\ \\Omega$ ขนานได้ $3\\ \\Omega$"
    solution: "อนุกรม: กระแสเท่ากัน ความต้านทานรวมมากกว่าตัวที่มากที่สุด · ขนาน: ความต่างศักย์เท่ากัน ความต้านทานรวมน้อยกว่าตัวที่น้อยที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.circuit.p007
    topics: [physics.electricity.circuits]
    difficulty: 4
    type: numeric
    stem: "ตัวต้านทาน $2\\ \\Omega$ ต่ออนุกรมกับกลุ่มที่ประกอบด้วยตัวต้านทาน $6\\ \\Omega$ และ $3\\ \\Omega$ ต่อขนานกัน ทั้งหมดต่อกับแบตเตอรี่ $12\\ \\mathrm{V}$ กระแสรวมในวงจรเป็นกี่แอมแปร์ (ตอบเป็นตัวเลขในหน่วย A)"
    answer: { value: 3, unit: A }
    hints:
      - "ยุบกลุ่มขนานให้เป็นตัวต้านทานตัวเดียวก่อน"
      - "นำความต้านทานของกลุ่มขนานบวกกับ $2\\ \\Omega$ ที่ต่ออนุกรม"
      - "ใช้ $I = \\dfrac{V}{R}$ กับความต้านทานรวมทั้งวงจร"
    misconceptions:
      - { match: 1.091, feedback: "ดูเหมือนรวมทั้งสามตัวแบบอนุกรม ($11\\ \\Omega$) แต่ $6\\ \\Omega$ กับ $3\\ \\Omega$ ต่อขนานกัน ต้องรวมแบบขนานก่อน" }
      - { match: 4.8, feedback: "ดูเหมือนลืมกลับเศษส่วน ใช้ $\\tfrac{1}{6} + \\tfrac{1}{3} = 0.5$ เป็นความต้านทาน ความต้านทานของกลุ่มขนานคือ $2\\ \\Omega$" }
    solution: "กลุ่มขนาน: $\\dfrac{6 \\times 3}{6 + 3} = 2\\ \\Omega$ → รวมทั้งวงจร $R = 2 + 2 = 4\\ \\Omega$ → $I = \\dfrac{12\\ \\mathrm{V}}{4\\ \\Omega} = 3\\ \\mathrm{A}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.circuit.p008
    topics: [physics.electricity.circuits]
    difficulty: 4
    type: numeric
    stem: "กระแสรวม $3\\ \\mathrm{A}$ ไหลเข้าสู่ตัวต้านทาน $6\\ \\Omega$ และ $3\\ \\Omega$ ที่ต่อขนานกัน กระแสที่ไหลผ่านตัวต้านทาน $6\\ \\Omega$ เป็นกี่แอมแปร์ (ตอบเป็นตัวเลขในหน่วย A)"
    answer: { value: 1, unit: A }
    hints:
      - "กระแสเลือกไหลผ่านทางที่ความต้านทานน้อยกว่ามากกว่า ตัว $6\\ \\Omega$ จึงได้กระแสน้อยกว่าครึ่ง"
      - "หาความต่างศักย์คร่อมกลุ่มขนานจาก $V = IR_{\\text{รวม}}$ ก่อน"
      - "หรือใช้สูตรแบ่งกระแส $I_1 = \\dfrac{R_2}{R_1 + R_2}\\,I$ ซึ่งตัวเศษเป็นความต้านทานของอีกทางหนึ่ง"
    misconceptions:
      - { match: 2, feedback: "นั่นคือกระแสในตัว $3\\ \\Omega$ ทางที่ความต้านทานมากกว่าได้กระแสน้อยกว่า" }
      - { match: 1.5, feedback: "กระแสไม่ได้แบ่งเท่ากัน เพราะตัวต้านทานสองทางมีค่าไม่เท่ากัน" }
    solution: "$R_{\\text{รวม}} = \\dfrac{6 \\times 3}{9} = 2\\ \\Omega$ → $V = (3\\ \\mathrm{A})(2\\ \\Omega) = 6\\ \\mathrm{V}$ → $I_{6\\Omega} = \\dfrac{6\\ \\mathrm{V}}{6\\ \\Omega} = 1\\ \\mathrm{A}$ (ตัว $3\\ \\Omega$ ได้ $2\\ \\mathrm{A}$ รวม $3\\ \\mathrm{A}$ ✓)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.circuit.p009
    topics: [physics.electricity.circuits]
    difficulty: 4
    type: expression
    stem: "ตัวต้านทาน $R_1$ และ $R_2$ ต่ออนุกรมกับแหล่งจ่ายความต่างศักย์ $V$ จงเขียนสูตรของความต่างศักย์คร่อม $R_2$ (ใช้ตัวแปร $V$, $R_1$, $R_2$ พิมพ์ตัวห้อยเป็น R_1 และ R_2)"
    prefix: "V_2 ="
    answer: { latex: "\\frac{VR_2}{R_1+R_2}", variables: [V, R_1, R_2] }
    hints:
      - "กระแสในวงจรอนุกรมคือ $I = \\dfrac{V}{R_1 + R_2}$"
      - "ความต่างศักย์คร่อม $R_2$ คือ $V_2 = IR_2$ แทนค่า $I$ ลงไป"
    misconceptions:
      - { match: "\\frac{VR_1}{R_1+R_2}", feedback: "นั่นคือความต่างศักย์คร่อม $R_1$ ตัวที่ถามคือ $R_2$ ตัวเศษจึงต้องเป็น $R_2$" }
      - { match: "\\frac{V}{R_1+R_2}", feedback: "นั่นคือกระแสในวงจร ยังต้องคูณด้วย $R_2$ จึงจะได้ความต่างศักย์คร่อม $R_2$" }
    solution: "$I = \\dfrac{V}{R_1 + R_2}$ → $V_2 = IR_2 = \\dfrac{VR_2}{R_1 + R_2}$ (สูตรแบ่งแรงดัน: ตัวต้านทานที่มากกว่าได้ส่วนแบ่งที่มากกว่า)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.circuit.p010
    topics: [physics.electricity.circuits]
    difficulty: 4
    type: numeric
    stem: "บ้านหลังหนึ่งในเชียงใหม่ใช้ไฟ $220\\ \\mathrm{V}$ เปิดเตารีด (ความต้านทาน $44\\ \\Omega$) หม้อหุงข้าว ($55\\ \\Omega$) และเครื่องทำน้ำอุ่น ($20\\ \\Omega$) พร้อมกันบนวงจรเดียวกัน ซึ่งทุกเครื่องต่อขนานกัน กระแสรวมในสายเมนเป็นกี่แอมแปร์ (ตอบเป็นตัวเลขในหน่วย A)"
    answer: { value: 20, unit: A }
    hints:
      - "เครื่องใช้ไฟฟ้าที่ต่อขนาน แต่ละเครื่องได้ $220\\ \\mathrm{V}$ เต็ม"
      - "หากระแสของแต่ละเครื่องด้วย $I = \\dfrac{V}{R}$ แล้วรวมกัน"
    misconceptions:
      - { match: 1.849, feedback: "ดูเหมือนรวมความต้านทานแบบอนุกรม ($119\\ \\Omega$) แต่เครื่องใช้ไฟฟ้าในบ้านต่อขนาน แต่ละเครื่องได้ $220\\ \\mathrm{V}$" }
      - { match: 9, feedback: "นั่นคือกระแสของเตารีดกับหม้อหุงข้าวเท่านั้น ยังขาดเครื่องทำน้ำอุ่นอีกเครื่อง" }
    solution: "เตารีด $\\dfrac{220}{44} = 5\\ \\mathrm{A}$ · หม้อหุงข้าว $\\dfrac{220}{55} = 4\\ \\mathrm{A}$ · เครื่องทำน้ำอุ่น $\\dfrac{220}{20} = 11\\ \\mathrm{A}$ → รวม $5 + 4 + 11 = 20\\ \\mathrm{A}$ ถ้าวงจรนี้มีเบรกเกอร์ขนาด $16\\ \\mathrm{A}$ เบรกเกอร์จะตัดไฟ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.circuit.p011
    topics: [physics.electricity.circuits]
    difficulty: 5
    type: numeric
    stem: "ตัวต้านทาน $1\\ \\Omega$ ต่ออนุกรมกับกลุ่มที่ประกอบด้วยตัวต้านทาน $6\\ \\Omega$ และ $3\\ \\Omega$ ต่อขนานกัน ทั้งหมดต่อกับแบตเตอรี่ $9\\ \\mathrm{V}$ กระแสที่ไหลผ่านตัวต้านทาน $6\\ \\Omega$ เป็นกี่แอมแปร์ (ตอบเป็นตัวเลขในหน่วย A)"
    answer: { value: 1, unit: A }
    hints:
      - "ยุบวงจร: กลุ่มขนานเป็นตัวต้านทานตัวเดียว แล้วรวมกับ $1\\ \\Omega$ หากระแสรวม"
      - "ความต่างศักย์คร่อมกลุ่มขนานไม่ใช่ $9\\ \\mathrm{V}$ เพราะส่วนหนึ่งตกคร่อมตัว $1\\ \\Omega$"
      - "หาความต่างศักย์คร่อมกลุ่มขนานด้วย $V = IR_{\\text{ขนาน}}$ แล้วหารด้วย $6\\ \\Omega$"
    misconceptions:
      - { match: 1.5, feedback: "ดูเหมือนใช้ความต่างศักย์ $9\\ \\mathrm{V}$ ทั้งหมดกับตัว $6\\ \\Omega$ แต่ตัว $1\\ \\Omega$ ที่ต่ออนุกรมรับความต่างศักย์ไปส่วนหนึ่งแล้ว" }
      - { match: 2, feedback: "นั่นคือกระแสในตัว $3\\ \\Omega$ ทางที่ความต้านทานมากกว่า ($6\\ \\Omega$) ได้กระแสน้อยกว่า" }
