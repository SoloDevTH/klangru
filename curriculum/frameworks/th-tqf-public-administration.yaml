completeness: full-text
strands:
  - id: "5"
    title: มาตรฐานผลการเรียนรู้
    standards:
      - id: "5.1"
        text: "มาตรฐานการเรียนรู้ด้านคุณธรรมและจริยธรรม (Ethics and Moral)"
        indicators:
          - { id: "5.1(1)", text: "พัฒนานิสัยและประพฤติตนอย่างมีคุณธรรม จริยธรรม และด้วยความรับผิดชอบทั้งในส่วนตนและส่วนรวม" }
          - { id: "5.1(2)", text: "สามารถปรับวิถีชีวิตในความขัดแย้งทางค่านิยม และจัดการปัญหาทางคุณธรรมจริยธรรม โดยใช้ดุลยพินิจทางค่านิยมพื้นฐานและความรู้สึกของผู้อื่น" }
      - id: "5.2"
        text: "มาตรฐานการเรียนรู้ด้านความรู้ (Knowledge)"
        indicators:
          - { id: "5.2(1)", text: "เข้าใจความรู้และหลักการของแนวคิดและทฤษฎีทางรัฐประศาสนศาสตร์" }
          - { id: "5.2(2)", text: "รู้และเข้าใจถึงความก้าวหน้าของความรู้ตลอดจนธรรมเนียมปฏิบัติ กฎระเบียบและข้อบังคับที่เปลี่ยนไปตามสถานการณ์ในสาขาวิชารัฐประศาสนศาสตร์" }
          - { id: "5.2(3)", text: "ตระหนักรู้ถึงงานวิจัยในปัจจุบันที่เกี่ยวข้องกับการแก้ปัญหาและการต่อยอดองค์ความรู้ในสาขาวิชารัฐประศาสนศาสตร์" }
      - id: "5.3"
        text: "มาตรฐานการเรียนรู้ด้านทักษะทางปัญญา (Cognitive Skills)"
        indicators:
          - { id: "5.3(1)", text: "สามารถค้นหาข้อเท็จจริงและทำความเข้าใจปรากฏการณ์ที่เกี่ยวข้องกับรัฐประศาสนศาสตร์ จากแหล่งข้อมูลที่หลากหลาย" }
          - { id: "5.3(2)", text: "สามารถศึกษาและวิเคราะห์สถานการณ์หรือสภาพปัญหาที่ซับซ้อน โดยใช้ความรู้ แนวคิดและทฤษฎีทางรัฐประศาสนศาสตร์เพื่อเสนอแนะแนวทางในการแก้ไขได้อย่างสร้างสรรค์" }
      - id: "5.4"
        text: "มาตรฐานการเรียนรู้ด้านทักษะความสัมพันธ์ระหว่างบุคคลและความรับผิดชอบ (Interpersonal Skills and Responsibility)"
        indicators:
          - { id: "5.4(1)", text: "มีความรับผิดชอบในการพัฒนาตนเองและแสดงออกซึ่งภาวะผู้นำและสมาชิกที่ดีของกลุ่ม" }
          - { id: "5.4(2)", text: "สามารถปรับตัวได้ในสังคมที่มีความหลากหลาย รับฟังความเห็นที่แตกต่างและแสดงความเห็นที่เกี่ยวข้องกับประเด็นทางรัฐประศาสนศาสตร์ได้อย่างสร้างสรรค์" }
          - { id: "5.4(3)", text: "มีความคิดริเริ่มในการวิเคราะห์และแก้ไขปัญหาได้อย่างเหมาะสมกับพื้นฐานของตนเองและบริบทของกลุ่ม" }
      - id: "5.5"
        text: "มาตรฐานการเรียนรู้ด้านทักษะการวิเคราะห์เชิงตัวเลข การสื่อสาร และการใช้เทคโนโลยีสารสนเทศ (Numerical Analysis, Communication and Information Technology Skills)"
        indicators:
          - { id: "5.5(1)", text: "มีทักษะในการใช้เทคโนโลยีสารสนเทศเพื่อเป็นเครื่องมือในการค้นคว้าหาความรู้และการนำเสนอข้อมูลทางรัฐประศาสนศาสตร์ในรูปแบบที่หลากหลายได้อย่างเหมาะสมกับกลุ่มบุคคลต่างๆ" }
          - { id: "5.5(2)", text: "สามารถใช้เครื่องมือทางสถิติขั้นพื้นฐานได้อย่างถูกต้อง เหมาะสมกับประเด็นปัญหาทางการวิจัยทางรัฐประศาสนศาสตร์" }
          - { id: "5.5(3)", text: "สามารถสื่อสารประเด็นทางรัฐประศาสนศาสตร์ได้อย่างมีประสิทธิภาพ" }
  - id: "8"
    title: เนื้อหาสาระสำคัญของสาขาวิชา
    standards:
      - id: "8"
        text: "กลุ่มองค์ความรู้ที่แสดงถึงอัตลักษณ์ของหลักสูตรรัฐประศาสนศาสตร์ ๕ กลุ่ม"
        indicators:
          - { id: "8.1", text: "กลุ่มองค์ความรู้ด้านองค์การและการจัดการ (Organization and Management): เป็นกลุ่มวิชาที่มีความครอบคลุมเกี่ยวกับองค์การไม่ว่าจะเป็นการเกิดขึ้นขององค์การ รูปแบบ โครงสร้าง สายการบังคับบัญชาขององค์การ ทั้งองค์การภาครัฐ ภาคเอกชน หรือองค์การที่ไม่ใช่ทั้งภาครัฐและเอกชน การออกแบบองค์การ ทั้งนี้ กลุ่มวิชานี้ยังครอบคลุมถึงการศึกษาพฤติกรรมมนุษย์ในองค์การ การพัฒนาองค์การ เทคนิคและการบริหารจัดการภาครัฐ การบริหารงานพัสดุ การบริหารจัดการคุณภาพ การจัดการความรู้และองค์การแห่งการเรียนรู้ การควบคุมและตรวจสอบภายใน การบริหารความเสี่ยง ภาวะผู้นำและการทำงานเป็นทีมและนวัตกรรมการบริหารจัดการ เป็นต้น" }
          - { id: "8.2", text: "กลุ่มองค์ความรู้ด้านนโยบายสาธารณะ (Public Policy): เป็นกลุ่มวิชาที่มีความครอบคลุมเกี่ยวกับกระบวนการนโยบายสาธารณะ การกำหนดทางเลือกสาธารณะ การศึกษาและวิเคราะห์นโยบายสาธารณะด้านต่างๆ การนำนโยบายสาธารณะไปปฏิบัติ การวิเคราะห์และประเมินความเป็นไปได้ของโครงการสาธารณะ การจัดทำโครงการสาธารณะ การวางแผนและการบริหารโครงการสาธารณะ และการวิเคราะห์และประเมินผลกระทบโครงการสาธารณะ เป็นต้น" }
          - { id: "8.3", text: "กลุ่มองค์ความรู้ด้านการบริหารทรัพยากรมนุษย์ (Human Resource Management): เป็นกลุ่มวิชาที่มีความครอบคลุมเกี่ยวกับ การวางแผนทรัพยากรมนุษย์ในองค์การ การบริหารจัดการทรัพยากรมนุษย์ในองค์การ การพัฒนาทรัพยากรมนุษย์ในองค์การ การบริหารค่าจ้างเงินเดือนและประโยชน์ตอบแทนอื่นๆ การประเมินผลการปฏิบัติงานและการบริหารผลการปฏิบัติงาน การบริหารจัดการสวัสดิการ นันทนาการและพนักงานสัมพันธ์ กฎหมายเกี่ยวกับการบริหารทรัพยากรมนุษย์ภาครัฐ และการจัดการความขัดแย้งในองค์การ ทั้งนี้ องค์การหมายรวมทั้งองค์การภาครัฐ ภาคเอกชน หรือองค์การที่ไม่ใช่ทั้งภาครัฐและภาคเอกชน" }
          - { id: "8.4", text: "กลุ่มองค์ความรู้ด้านแนวคิดและทฤษฎีทางรัฐประศาสนศาสตร์ (Public Administrative Concepts and Theories): เป็นกลุ่มวิชาที่มีความครอบคลุมเกี่ยวกับทฤษฎีทางรัฐประศาสนศาสตร์ ปรัชญาการเมือง ความรู้ทางการเมือง เศรษฐกิจ และสังคมทั้งระดับชาติ ระดับภูมิภาคและระดับระหว่างประเทศ กฎหมายมหาชน แนวคิดและทฤษฎีว่าด้วยการบริหารจัดการภาครัฐ การคลังและการเงินภาครัฐ ระเบียบวิธีวิจัยทางรัฐประศาสนศาสตร์ การจัดการวิสาหกิจชุมชน ความรู้เบื้องต้นเกี่ยวกับการเป็นผู้ประกอบการกับการจัดบริการสาธารณะ มิติทางเศรษฐกิจกับการบริหารภาครัฐ การตลาดสำหรับรัฐประศาสนศาสตร์ การบริหารเชิงกลยุทธ์การบริหารสาธารณะแนวใหม่ การจัดทำและการส่งมอบบริการสาธารณะ ธรรมาภิบาล จริยธรรมนักบริหาร การปกครองและการบริหารท้องถิ่น เป็นต้น" }
          - { id: "8.5", text: "กลุ่มองค์ความรู้ด้านการคลังและงบประมาณ (Public Finance and Budgeting): เป็นกลุ่มวิชาที่มีความครอบคลุมเกี่ยวกับการบริหารการคลังและงบประมาณภาครัฐทั้งในส่วนกลางและท้องถิ่น การจัดการด้านทรัพยากรด้านการเงิน การวิเคราะห์การลงทุน การเป็นผู้ประกอบการภาครัฐ การบริหารการเงินขององค์การภาครัฐ การบริหารรายได้ภาครัฐ การบริหารรายจ่ายภาครัฐ การคลังและงบประมาณท้องถิ่น การบริหารรายได้และรายจ่ายของท้องถิ่น เศรษฐกิจชุมชนท้องถิ่น เป็นต้น" }
