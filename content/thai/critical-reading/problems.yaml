    alt: กราฟแท่งสมมติจากเพจของโรงเรียน ข คะแนนเฉลี่ยวิชาภาษาไทย แกนตั้งเริ่มที่ 90 และสิ้นสุดที่ 96 แท่งโรงเรียน ก สูงถึง 92 แท่งโรงเรียน ข สูงถึง 95 ทำให้แท่งของโรงเรียน ข ดูสูงกว่าแท่งของโรงเรียน ก มาก
