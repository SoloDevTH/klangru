      - { match: 32, feedback: 'นั่นคือค่าไฟของวันเดียว ต้องคูณ $30$ วัน' }
    solution: 'พลังงาน $= (1\ \mathrm{kW})(8 \times 30\ \mathrm{h}) = 240\ \mathrm{kWh}$ ค่าไฟ $= 240 \times 4 = 960$ บาท'
