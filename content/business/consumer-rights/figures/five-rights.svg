<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" font-family="sans-serif" font-size="14">
  <title>สิทธิของผู้บริโภค 5 ประการตาม พ.ร.บ.คุ้มครองผู้บริโภค</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="780" height="330" fill="#ffffff"/>
  <text x="390.0" y="28.0" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="bold">สิทธิของผู้บริโภค 5 ประการ (พ.ร.บ.คุ้มครองผู้บริโภค พ.ศ. 2522)</text>
  <rect x="16.0" y="50.0" width="140.0" height="170.0" rx="10" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/>
  <circle cx="86.0" cy="82.0" r="18" fill="#1f2937" stroke="none" stroke-width="1"/>
  <text x="86.0" y="88.0" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">1</text>
  <text x="86.0" y="128.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">ได้รับข่าวสาร</text>
  <text x="86.0" y="160.0" text-anchor="middle" fill="#1f2937" font-size="12.5">ฉลากและโฆษณา</text>
  <text x="86.0" y="180.0" text-anchor="middle" fill="#1f2937" font-size="12.5">บอกความจริงครบถ้วน</text>
  <rect x="168.0" y="50.0" width="140.0" height="170.0" rx="10" fill="#dcfce7" stroke="#1f2937" stroke-width="1"/>
  <circle cx="238.0" cy="82.0" r="18" fill="#1f2937" stroke="none" stroke-width="1"/>
  <text x="238.0" y="88.0" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">2</text>
  <text x="238.0" y="128.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">เลือกซื้ออย่างอิสระ</text>
  <text x="238.0" y="160.0" text-anchor="middle" fill="#1f2937" font-size="12.5">สมัครใจ ไม่ถูกบังคับ</text>
  <text x="238.0" y="180.0" text-anchor="middle" fill="#1f2937" font-size="12.5">หรือชักจูงไม่เป็นธรรม</text>
  <rect x="320.0" y="50.0" width="140.0" height="170.0" rx="10" fill="#ffedd5" stroke="#1f2937" stroke-width="1"/>
  <circle cx="390.0" cy="82.0" r="18" fill="#1f2937" stroke="none" stroke-width="1"/>
  <text x="390.0" y="88.0" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">3</text>
  <text x="390.0" y="128.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">ได้รับความปลอดภัย</text>
  <text x="390.0" y="160.0" text-anchor="middle" fill="#1f2937" font-size="12.5">สินค้าได้มาตรฐาน</text>
  <text x="390.0" y="180.0" text-anchor="middle" fill="#1f2937" font-size="12.5">ใช้แล้วไม่เป็นอันตราย</text>
  <rect x="472.0" y="50.0" width="140.0" height="170.0" rx="10" fill="#ede9fe" stroke="#1f2937" stroke-width="1"/>
  <circle cx="542.0" cy="82.0" r="18" fill="#1f2937" stroke="none" stroke-width="1"/>
  <text x="542.0" y="88.0" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">4</text>
  <text x="542.0" y="128.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">เป็นธรรมในสัญญา</text>
  <text x="542.0" y="160.0" text-anchor="middle" fill="#1f2937" font-size="12.5">ข้อสัญญา</text>
  <text x="542.0" y="180.0" text-anchor="middle" fill="#1f2937" font-size="12.5">ไม่เอารัดเอาเปรียบ</text>
  <rect x="624.0" y="50.0" width="140.0" height="170.0" rx="10" fill="#fef9c3" stroke="#1f2937" stroke-width="1"/>
  <circle cx="694.0" cy="82.0" r="18" fill="#1f2937" stroke="none" stroke-width="1"/>
  <text x="694.0" y="88.0" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">5</text>
  <text x="694.0" y="128.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">ได้รับการชดเชย</text>
  <text x="694.0" y="160.0" text-anchor="middle" fill="#1f2937" font-size="12.5">เมื่อถูกละเมิดสิทธิ</text>
  <text x="694.0" y="180.0" text-anchor="middle" fill="#1f2937" font-size="12.5">ข้อ 1–4</text>
  <rect x="16.0" y="240.0" width="748.0" height="72.0" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
  <text x="390.0" y="268.0" text-anchor="middle" fill="#1f2937" font-size="14">ถูกละเมิดสิทธิ: เก็บหลักฐาน → ติดต่อผู้ขาย → ร้องเรียน</text>
  <text x="390.0" y="294.0" text-anchor="middle" fill="#1f2937" font-size="12.5">สคบ. สายด่วน 1166 · อาหาร ยา เครื่องสำอาง: อย. · บริการการเงิน: ธปท. 1213</text>
</svg>
