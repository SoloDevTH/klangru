id: english.grammar.nouns-articles
subject: english
title: { th: "คำนาม a/an/the และรูปพหูพจน์", en: "Nouns, a/an/the and plurals" }
summary: แยกคำนามนับได้และนับไม่ได้ เลือก a an the ตามเสียงและความหมาย ทำพหูพจน์ -s -es -ies -ves และรูปไม่ตามกฎ ออกเสียง s ท้ายคำ และใช้ some any
difficulty: 2
minutes: 35
prerequisites: [english.grammar.be-have-there]
encompasses:
  - { id: english.grammar.be-have-there, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: plural-rules.svg
    alt: "ผังการทำพหูพจน์ ถามทีละข้อจากบนลงล่าง ข้อแรก ลงท้าย s ss sh ch x หรือ o (บางคำ) ถ้าใช่ เติม -es เช่น box เป็น boxes tomato เป็น tomatoes ถ้าไม่ ถามต่อว่าลงท้าย พยัญชนะ + y หรือไม่ ถ้าใช่ เปลี่ยน y เป็น -ies เช่น baby เป็น babies city เป็น cities ถ้าไม่ ถามต่อว่าลงท้าย f หรือ fe หรือไม่ ถ้าใช่ เปลี่ยนเป็น -ves เกือบทุกคำ เช่น knife เป็น knives leaf เป็น leaves ถ้าไม่ เป็นคำทั่วไป เติม -s เช่น cat เป็น cats day เป็น days กล่องด้านขวาล่างคือคำไม่ตามกฎที่ต้องจำ man men, woman women, child children, person people, foot feet, tooth teeth, mouse mice, fish fish"
    caption: "ถามทีละข้อจากบนลงล่าง ถ้าไม่เข้ากฎข้อใดเลยให้เติม -s"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.grammar.nouns-articles.p006, prompt: "ตัว h ใน hour ออกเสียงหรือไม่" }
  - type: worked-example
    title: เลือก a, an, the หรือไม่ใส่
    problem: "เติมคำนำหน้านามหรือไม่ใส่ (–): *There is ___ old temple near my school. ___ temple is beautiful. ___ tourists like it.*"
    steps:
      - text: "ช่องแรก พูดถึงวัดครั้งแรก เป็นเอกพจน์นับได้ old ขึ้นต้นด้วยเสียงสระ: ***an** old temple*"
        why: "ดูเสียงของคำที่อยู่ติดกัน (old) ไม่ใช่คำนาม temple"
      - text: "ช่องที่สอง วัดนี้พูดถึงแล้ว ผู้ฟังรู้ว่าเป็นวัดไหน: ***The** temple*"
      - text: "ช่องที่สาม พูดถึงนักท่องเที่ยวทั่วไปเป็นพหูพจน์ ไม่ต้องใส่คำนำหน้า: ***–** Tourists like it.*"
    answer: "*There is **an** old temple near my school. **The** temple is beautiful. Tourists like it.*"
  - { type: check, problem: english.grammar.nouns-articles.p010, prompt: "ประโยคนี้เป็นปฏิเสธ" }
  - type: worked-example
    title: ทำรายการซื้อของ
    problem: "แม่ให้ซื้อ ไข่ 10 ฟอง มีด 2 เล่ม นม 2 ขวด และข้าวสาร 1 ถุง เขียนรายการเป็นภาษาอังกฤษ"
    steps:
      - text: "ไข่นับได้ เติม s: *ten eggs*"
      - text: "knife ลงท้าย fe เปลี่ยนเป็น -ves: *two knives*"
      - text: "นมนับไม่ได้ นับขวดแทน และเติม s ที่ bottle: *two bottles of milk*"
        why: "milk ไม่เติม s แต่ bottle นับได้จึงเติม s"
      - text: "ข้าวนับไม่ได้ นับถุง: *a bag of rice*"
    answer: "*ten eggs, two knives, two bottles of milk, a bag of rice*"
glossary:
  - { term: article (คำนำหน้านาม), definition: "a, an, the ใช้หน้าคำนาม ภาษาไทยไม่มีคำชนิดนี้" }
  - { term: countable noun, definition: "คำนามนับได้ มีรูปเอกพจน์และพหูพจน์ เช่น an egg, two eggs" }
  - { term: uncountable noun, definition: "คำนามนับไม่ได้ ไม่เติม s และไม่ใช้ a/an เช่น water, rice, milk" }
  - { term: plural (พหูพจน์), definition: "รูปคำนามที่หมายถึงมากกว่าหนึ่ง ส่วนใหญ่เติม -s หรือ -es" }
  - { term: some / any, definition: "จำนวนหนึ่ง ใช้กับพหูพจน์และคำนามนับไม่ได้ some ในประโยคบอกเล่า any ในปฏิเสธและคำถาม" }
flashcards:
