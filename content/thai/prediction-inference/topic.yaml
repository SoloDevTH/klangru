id: thai.reading.prediction-inference
subject: thai
title: { th: การคาดคะเนเหตุการณ์และอนุมานจากเรื่องที่อ่าน, en: "Predicting and inferring from what you read" }
summary: ลำดับเหตุการณ์รวมถึงเรื่องที่เล่าย้อน อนุมานจากหลักฐานในเรื่องกับความรู้เดิม คาดคะเนเหตุการณ์พร้อมเหตุผล ปรับการคาดคะเนเมื่อพบข้อมูลใหม่ และประเมินค่าเพื่อตัดสินใจ
difficulty: 4
minutes: 30
prerequisites: [thai.reading.comprehension]
encompasses:
  - { id: thai.reading.comprehension, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: inference.svg
    alt: "แผนภาพ อนุมาน เท่ากับ หลักฐานในเรื่อง บวก ความรู้เดิม กล่องหลักฐานในเรื่อง: รองเท้าเปียกโคลน ร่มยังมีน้ำหยด บวก กล่องความรู้เดิม: ฝนตกทำให้พื้นเป็นโคลน คนกางร่มเมื่อฝนตก เท่ากับ กล่องข้อสรุป (อนุมาน): ข้างนอกฝนเพิ่งตก ซึ่งเรื่องไม่ได้บอกตรง ๆ ข้อความด้านล่าง: ถ้าไม่มีหลักฐานในเรื่องรองรับ คือการเดา ไม่ใช่การอนุมาน"
    caption: "อนุมาน = หลักฐานในเรื่อง + ความรู้เดิม"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: คาดคะเนเหตุการณ์พร้อมเหตุผล
    problem: "เรื่อง: \"กบเป็นคนขี้ลืม เช้านี้แม่เตือนว่า อย่าลืมเอาชุดพละไปนะ วันนี้มีสอบวิ่ง กบรีบวิ่งออกจากบ้าน ชุดพละยังพับอยู่บนเก้าอี้\" คาดคะเนว่าจะเกิดอะไรต่อ พร้อมเหตุผล"
    steps:
      - text: "ลำดับสิ่งที่เกิดแล้ว: แม่เตือน → กบรีบออกจากบ้าน → ชุดพละยังอยู่บนเก้าอี้"
      - text: "หาเบาะแส: นิสัยขี้ลืม คำเตือนของแม่ ชุดพละยังอยู่ที่บ้าน"
        why: "ผู้เขียนเล่าคำเตือนไว้ก่อน มักเป็นเบาะแสของปัญหาที่จะเกิด"
      - text: "รวมกับความรู้เดิม: สอบวิ่งต้องใส่ชุดพละ"
      - text: "เขียนการคาดคะเน: ฉันคาดว่ากบจะไม่มีชุดพละใส่สอบวิ่ง เพราะในเรื่องชุดพละยังพับอยู่บนเก้าอี้ และกบเป็นคนขี้ลืม"
    answer: "ฉันคาดว่ากบจะไม่มีชุดพละใส่สอบวิ่ง (อาจต้องโทรขอให้แม่นำมาให้) เพราะชุดยังอยู่บนเก้าอี้และกบเป็นคนขี้ลืม"
  - { type: check, problem: thai.reading.prediction-inference.p002, prompt: "ดูประโยค (4) และ (6)" }
  - type: worked-example
    title: แยกสิ่งที่เรื่องบอก อนุมาน และการเดา
    problem: "\"ป้าแดงปิดร้านก๋วยเตี๋ยวเร็วกว่าทุกวัน หน้าร้านติดป้าย งดขาย 3 วัน กลับบ้านต่างจังหวัด\" แยกข้อความ (ก) ป้าแดงปิดร้านเร็วกว่าทุกวัน (ข) ป้าแดงจะเดินทางไกล (ค) ป้าแดงไปงานแต่งงานลูกสาว"
    steps:
      - text: "(ก) มีอยู่ในเรื่องตรง ๆ → เรื่องบอกตรง ๆ"
      - text: "(ข) ป้ายบอกกลับบ้านต่างจังหวัด + ความรู้เดิม ต่างจังหวัดอยู่ไกล → อนุมาน"
        why: "อนุมานต้องชี้หลักฐานในเรื่องได้"
      - text: "(ค) เรื่องไม่ได้พูดถึงงานแต่งงานหรือลูกสาว → การเดา"
    answer: "(ก) เรื่องบอกตรง ๆ (ข) อนุมาน (ค) การเดา"
  - { type: check, problem: thai.reading.prediction-inference.p004, prompt: "หาข้อความที่อยู่ในเรื่องตรง ๆ" }
glossary:
  - { term: อนุมาน, definition: "คาดคะเนหรือสรุปตามหลักเหตุผล จากหลักฐานในเรื่องรวมกับความรู้เดิม" }
  - { term: คาดคะเนเหตุการณ์, definition: "บอกล่วงหน้าว่าเรื่องจะเป็นอย่างไรต่อ โดยมีเหตุผลจากเรื่อง" }
  - { term: เบาะแส, definition: "ร่องรอยหรือเค้าเงื่อนในเรื่องที่ช่วยให้อนุมานหรือคาดคะเนได้" }
  - { term: เล่าย้อน, definition: "การเล่าเหตุการณ์ที่เกิดก่อนหลังจากเล่าเหตุการณ์ปัจจุบันแล้ว" }
  - { term: ประเมินค่า, definition: "ชั่งข้อดี ข้อเสีย ความเสี่ยง และความน่าเชื่อถือของข้อมูล ก่อนตัดสินใจ" }
flashcards:
  - { front: "อนุมาน", back: "หลักฐานในเรื่อง + ความรู้เดิม = ข้อสรุปที่เรื่องไม่ได้บอกตรง ๆ" }
  - { front: "คาดคะเนให้มีเหตุผล", back: "ฉันคาดว่า... เพราะในเรื่อง..." }
  - { front: "พบข้อมูลใหม่ที่ขัดกับการคาดคะเน", back: "ปรับการคาดคะเนให้สอดคล้องกับหลักฐานใหม่" }
  - { front: "ประเมินค่าเพื่อตัดสินใจ 4 ขั้น", back: "สรุปข้อมูล → คาดคะเนผล → ชั่งข้อดีข้อเสีย → ตัดสินใจพร้อมเหตุผล" }
