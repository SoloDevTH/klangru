<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" width="780" height="450" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei','Noto Sans Thai',sans-serif">
<title>ส่วนเติมเต็ม 4 แบบที่วางหลังกริยา</title>
<defs></defs>
<rect x="0" y="0" width="780" height="450" fill="#fff"/>
<text x="390.0" y="30.0" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="bold">ส่วนเติมเต็ม (补语) อยู่หลังกริยา บอกผล ทิศทาง ระดับ หรือความเป็นไปได้</text>
<rect x="20.0" y="52.0" width="740.0" height="88.0" rx="10" fill="#dbe8f8" stroke="#1f4e9c" stroke-width="1.8"/>
<text x="36.0" y="82.0" font-size="18" text-anchor="start" fill="#1f4e9c" font-weight="bold">ผลลัพธ์</text>
<text x="36.0" y="108.0" font-size="15" text-anchor="start" fill="#1a1a1a" font-weight="normal">กริยา + ผล</text>
<rect x="250.0" y="66.0" width="40.0" height="40.0" rx="6" fill="#fff" stroke="#666" stroke-width="1.2"/>
<text x="270.0" y="94.0" font-size="22" text-anchor="middle" fill="#1a1a1a" font-weight="normal">看</text>
<rect x="294.0" y="66.0" width="42.0" height="40.0" rx="6" fill="#fff" stroke="#1f4e9c" stroke-width="2"/>
<text x="315.0" y="94.0" font-size="22" text-anchor="middle" fill="#1f4e9c" font-weight="normal">懂</text>
<rect x="366.0" y="66.0" width="40.0" height="40.0" rx="6" fill="#fff" stroke="#666" stroke-width="1.2"/>
<text x="386.0" y="94.0" font-size="22" text-anchor="middle" fill="#1a1a1a" font-weight="normal">写</text>
<rect x="410.0" y="66.0" width="42.0" height="40.0" rx="6" fill="#fff" stroke="#1f4e9c" stroke-width="2"/>
<text x="431.0" y="94.0" font-size="22" text-anchor="middle" fill="#1f4e9c" font-weight="normal">错</text>
<rect x="482.0" y="66.0" width="40.0" height="40.0" rx="6" fill="#fff" stroke="#666" stroke-width="1.2"/>
<text x="502.0" y="94.0" font-size="22" text-anchor="middle" fill="#1a1a1a" font-weight="normal">做</text>
<rect x="526.0" y="66.0" width="42.0" height="40.0" rx="6" fill="#fff" stroke="#1f4e9c" stroke-width="2"/>
<text x="547.0" y="94.0" font-size="22" text-anchor="middle" fill="#1f4e9c" font-weight="normal">完</text>
<text x="250.0" y="130.0" font-size="15" text-anchor="start" fill="#666" font-weight="normal">ปฏิเสธ: 没看懂</text>
<rect x="20.0" y="150.0" width="740.0" height="88.0" rx="10" fill="#dcefd6" stroke="#2a6a2a" stroke-width="1.8"/>
<text x="36.0" y="180.0" font-size="18" text-anchor="start" fill="#2a6a2a" font-weight="bold">ทิศทาง</text>
<text x="36.0" y="206.0" font-size="15" text-anchor="start" fill="#1a1a1a" font-weight="normal">กริยา + ทิศ (+来/去)</text>
<rect x="250.0" y="164.0" width="40.0" height="40.0" rx="6" fill="#fff" stroke="#666" stroke-width="1.2"/>
<text x="270.0" y="192.0" font-size="22" text-anchor="middle" fill="#1a1a1a" font-weight="normal">走</text>
<rect x="294.0" y="164.0" width="68.0" height="40.0" rx="6" fill="#fff" stroke="#2a6a2a" stroke-width="2"/>
<text x="328.0" y="192.0" font-size="22" text-anchor="middle" fill="#2a6a2a" font-weight="normal">进来</text>
<rect x="392.0" y="164.0" width="40.0" height="40.0" rx="6" fill="#fff" stroke="#666" stroke-width="1.2"/>
<text x="412.0" y="192.0" font-size="22" text-anchor="middle" fill="#1a1a1a" font-weight="normal">跑</text>
<rect x="436.0" y="164.0" width="68.0" height="40.0" rx="6" fill="#fff" stroke="#2a6a2a" stroke-width="2"/>
<text x="470.0" y="192.0" font-size="22" text-anchor="middle" fill="#2a6a2a" font-weight="normal">出去</text>
<rect x="534.0" y="164.0" width="40.0" height="40.0" rx="6" fill="#fff" stroke="#666" stroke-width="1.2"/>
<text x="554.0" y="192.0" font-size="22" text-anchor="middle" fill="#1a1a1a" font-weight="normal">站</text>
<rect x="578.0" y="164.0" width="68.0" height="40.0" rx="6" fill="#fff" stroke="#2a6a2a" stroke-width="2"/>
<text x="612.0" y="192.0" font-size="22" text-anchor="middle" fill="#2a6a2a" font-weight="normal">起来</text>
<text x="250.0" y="228.0" font-size="15" text-anchor="start" fill="#666" font-weight="normal">来 เข้าหาผู้พูด · 去 ออกจากผู้พูด</text>
<rect x="20.0" y="248.0" width="740.0" height="88.0" rx="10" fill="#fbe0dc" stroke="#b3261e" stroke-width="1.8"/>
<text x="36.0" y="278.0" font-size="18" text-anchor="start" fill="#b3261e" font-weight="bold">ระดับ/สภาพ</text>
<text x="36.0" y="304.0" font-size="15" text-anchor="start" fill="#1a1a1a" font-weight="normal">กริยา + 得 + คุณศัพท์</text>
<rect x="250.0" y="262.0" width="40.0" height="40.0" rx="6" fill="#fff" stroke="#666" stroke-width="1.2"/>
<text x="270.0" y="290.0" font-size="22" text-anchor="middle" fill="#1a1a1a" font-weight="normal">跑</text>
<rect x="294.0" y="262.0" width="94.0" height="40.0" rx="6" fill="#fff" stroke="#b3261e" stroke-width="2"/>
<text x="341.0" y="290.0" font-size="22" text-anchor="middle" fill="#b3261e" font-weight="normal">得很快</text>
<rect x="418.0" y="262.0" width="40.0" height="40.0" rx="6" fill="#fff" stroke="#666" stroke-width="1.2"/>
<text x="438.0" y="290.0" font-size="22" text-anchor="middle" fill="#1a1a1a" font-weight="normal">说</text>
<rect x="462.0" y="262.0" width="94.0" height="40.0" rx="6" fill="#fff" stroke="#b3261e" stroke-width="2"/>
<text x="509.0" y="290.0" font-size="22" text-anchor="middle" fill="#b3261e" font-weight="normal">得很好</text>
<text x="250.0" y="326.0" font-size="15" text-anchor="start" fill="#666" font-weight="normal">ปฏิเสธ: 跑得不快</text>
<rect x="20.0" y="346.0" width="740.0" height="88.0" rx="10" fill="#e6dcf5" stroke="#5b3a8c" stroke-width="1.8"/>
<text x="36.0" y="376.0" font-size="18" text-anchor="start" fill="#5b3a8c" font-weight="bold">ความเป็นไปได้</text>
<text x="36.0" y="402.0" font-size="15" text-anchor="start" fill="#1a1a1a" font-weight="normal">กริยา + 得/不 + ผล</text>
<rect x="250.0" y="360.0" width="40.0" height="40.0" rx="6" fill="#fff" stroke="#666" stroke-width="1.2"/>
<text x="270.0" y="388.0" font-size="22" text-anchor="middle" fill="#1a1a1a" font-weight="normal">看</text>
<rect x="294.0" y="360.0" width="68.0" height="40.0" rx="6" fill="#fff" stroke="#5b3a8c" stroke-width="2"/>
<text x="328.0" y="388.0" font-size="22" text-anchor="middle" fill="#5b3a8c" font-weight="normal">得懂</text>
<rect x="392.0" y="360.0" width="40.0" height="40.0" rx="6" fill="#fff" stroke="#666" stroke-width="1.2"/>
<text x="412.0" y="388.0" font-size="22" text-anchor="middle" fill="#1a1a1a" font-weight="normal">听</text>
<rect x="436.0" y="360.0" width="68.0" height="40.0" rx="6" fill="#fff" stroke="#5b3a8c" stroke-width="2"/>
<text x="470.0" y="388.0" font-size="22" text-anchor="middle" fill="#5b3a8c" font-weight="normal">不懂</text>
<rect x="534.0" y="360.0" width="40.0" height="40.0" rx="6" fill="#fff" stroke="#666" stroke-width="1.2"/>
<text x="554.0" y="388.0" font-size="22" text-anchor="middle" fill="#1a1a1a" font-weight="normal">买</text>
<rect x="578.0" y="360.0" width="68.0" height="40.0" rx="6" fill="#fff" stroke="#5b3a8c" stroke-width="2"/>
<text x="612.0" y="388.0" font-size="22" text-anchor="middle" fill="#5b3a8c" font-weight="normal">不到</text>
<text x="250.0" y="424.0" font-size="15" text-anchor="start" fill="#666" font-weight="normal">ทำได้ / ทำไม่ได้</text>
</svg>
