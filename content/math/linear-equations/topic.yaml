id: math.algebra.linear-eq
subject: math
title: { th: สมการเชิงเส้นตัวแปรเดียว, en: Linear equations in one variable }
summary: แก้สมการรูป ax + b = c โดยทำสิ่งเดียวกันกับทั้งสองข้างของสมการจนเหลือตัวแปรตัวเดียว
difficulty: 3
minutes: 25
prerequisites: [math.algebra.expressions]
encompasses:
  - { id: math.algebra.expressions, weight: 0.4 }
  - { id: math.number.integers, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: แก้สมการจากตาชั่ง
    problem: "ตาชั่งในภาพสมดุล กล่องทุกกล่องหนักเท่ากัน กล่องหนึ่งหนักกี่กิโลกรัม"
    figure: { src: balance-example.svg, alt: "ตาชั่งสองแขนอยู่ในสมดุล จานซ้ายมีกล่อง x สามกล่องกับตุ้มน้ำหนัก 1 กิโลกรัม จานขวามีกล่อง x หนึ่งกล่องกับตุ้มน้ำหนัก 9 กิโลกรัม" }
    steps:
      - text: "เขียนสิ่งที่เห็นเป็นสมการ: $3x + 1 = x + 9$"
      - text: "ยกกล่องออกข้างละ 1 กล่อง (ลบ $x$ ทั้งสองข้าง) ได้ $2x + 1 = 9$"
        why: "เอาของหนักเท่ากันออกจากทั้งสองจาน ตาชั่งยังสมดุล"
      - text: "ยกตุ้ม 1 กิโลกรัมออกทั้งสองข้าง (ลบ 1) ได้ $2x = 8$"
      - text: "แบ่งทั้งสองข้างเป็นสองส่วนเท่ากัน (หาร 2) ได้ $x = 4$"
      - text: "ตรวจ: ซ้าย $3(4) + 1 = 13$ ขวา $4 + 9 = 13$ ✓"
    answer: "กล่องหนึ่งหนัก 4 กิโลกรัม"
  - { type: check, problem: math.lineq.p013, prompt: "เขียนสมการจากตาชั่งดู" }
  - type: worked-example
    title: สมการที่ไม่มีคำตอบ กับสมการที่เป็นจริงทุกค่า
    problem: "แก้สมการ ก) $3(x - 2) + 4 = 3x - 2$ และ ข) $3(x - 2) + 4 = 3x + 1$"
    steps:
      - text: "กระจายและรวมพจน์ข้างซ้ายของทั้งสองข้อ: $3x - 6 + 4 = 3x - 2$"
      - text: "ข้อ ก) ได้ $3x - 2 = 3x - 2$ ลบ $3x$ ทั้งสองข้าง เหลือ $-2 = -2$ ซึ่งจริงเสมอ"
        why: "ตัวแปรหายไปและเหลือประโยคที่จริง แปลว่าแทนจำนวนใดก็ได้ สองข้างเป็นนิพจน์เดียวกัน"
      - text: "ข้อ ก) จึงเป็นจริงสำหรับทุกจำนวนจริง $x$ (เป็นเอกลักษณ์) ลองแทน $x = 10$: $3(8) + 4 = 28$ และ $30 - 2 = 28$ ✓"
      - text: "ข้อ ข) ได้ $3x - 2 = 3x + 1$ ลบ $3x$ ทั้งสองข้าง เหลือ $-2 = 1$ ซึ่งเป็นเท็จ"
        why: "สองข้างมี $3x$ เท่ากัน แต่ค่าคงตัวต่างกัน ข้างขวาจึงมากกว่าข้างซ้ายอยู่ 3 เสมอ"
      - text: "ข้อ ข) จึงไม่มีคำตอบ ไม่ว่าแทน $x$ เท่าใดก็ไม่เท่ากัน"
    answer: "ก) เป็นจริงทุกค่าของ $x$ · ข) ไม่มีคำตอบ"
  - { type: check, problem: math.lineq.p014, prompt: "ลองกระจายแล้วดูว่าตัวแปรหายไปหรือไม่" }
  - type: simulation
    title: เครื่องชั่งสองแขนกับสมการ (PhET Equality Explorer)
    url: https://phet.colorado.edu/en/simulations/equality-explorer
    provider: phet
    note: ลองวางกล่อง x และลูกตุ้มให้ตาชั่งสมดุล แล้วเอาของออกจากทั้งสองข้างเท่ากัน
glossary:
  - { term: สมการ, definition: ประโยคที่บอกว่าสองนิพจน์มีค่าเท่ากัน โดยใช้เครื่องหมาย = }
  - { term: คำตอบของสมการ, definition: จำนวนที่แทนตัวแปรแล้วทำให้สมการเป็นจริง }
  - { term: สมการเชิงเส้น, definition: สมการที่ตัวแปรมีเลขชี้กำลังเป็น 1 เท่านั้น เช่น 3x + 2 = 11 }
flashcards:
  - { front: "หลักการแก้สมการคืออะไร", back: "ทำสิ่งเดียวกันกับทั้งสองข้าง (บวก ลบ คูณ หรือหารด้วยจำนวนที่ไม่ใช่ 0) สมการยังเป็นจริงเสมอ" }
  - { front: "ตรวจคำตอบของสมการอย่างไร", back: "แทนค่าที่ได้กลับเข้าไปในสมการเดิม ถ้าสองข้างเท่ากัน คำตอบถูก" }
  - { front: "แก้ $5x = 20$", back: "หารทั้งสองข้างด้วย 5 ได้ $x = 4$" }
