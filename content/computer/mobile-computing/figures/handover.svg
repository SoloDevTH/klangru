<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="sans-serif" font-size="15">
  <title>การส่งต่อระหว่างสองเซลล์ที่ซ้อนทับกัน</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5562b"/></marker></defs>
  <rect x="0" y="0" width="640" height="330" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#15211e">การส่งต่อ (handover) เมื่ออุปกรณ์เคลื่อนที่ผ่านพื้นที่ซ้อนทับ</text>
  <circle cx="220" cy="160" r="120" fill="#e2f0ed" fill-opacity="0.7" stroke="#15211e" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="420" cy="160" r="120" fill="#f6e7df" fill-opacity="0.7" stroke="#15211e" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="220,146 232,168 208,168" fill="#15211e"/>
  <text x="220" y="194" text-anchor="middle" font-size="13" font-weight="normal" fill="#15211e">สถานีฐาน A</text>
  <polygon points="420,146 432,168 408,168" fill="#15211e"/>
  <text x="420" y="194" text-anchor="middle" font-size="13" font-weight="normal" fill="#15211e">สถานีฐาน B</text>
  <text x="175" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#15211e">เซลล์ A</text>
  <text x="465" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#15211e">เซลล์ B</text>
  <rect x="302" y="100" width="36" height="60" rx="6" fill="#ffffff" stroke="#15211e" stroke-width="2.5"/>
  <circle cx="320" cy="150" r="3" fill="#15211e"/>
  <text x="320" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#15211e" stroke="#ffffff" stroke-width="4" paint-order="stroke">อุปกรณ์</text>
  <line x1="260" y1="226" x2="380" y2="226" stroke="#b5562b" stroke-width="3" marker-end="url(#arr)"/>
  <text x="320" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#b5562b" stroke="#ffffff" stroke-width="4" paint-order="stroke">ทิศทางการเคลื่อนที่</text>
  <text x="320" y="300" text-anchor="middle" font-size="13" font-weight="normal" fill="#4a5a55">เมื่อสัญญาณจากเซลล์ A อ่อนลงและเซลล์ B แรงขึ้น เครือข่ายจะย้ายการเชื่อมต่อไป B</text>
</svg>
