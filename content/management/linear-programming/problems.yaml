      - "มีอะไรหยุดไม่ให้ x เพิ่มไปเรื่อย ๆ หรือไม่"
    solution: "ข้อจำกัดเดียวคือขั้นต่ำ 50 ชิ้น จึงเพิ่ม x และ y ได้ไม่จำกัด กำไรเพิ่มไม่สิ้นสุด แบบจำลองไม่มีขอบเขต ซึ่งในชีวิตจริงแปลว่าลืมข้อจำกัด เช่น แรงงาน วัตถุดิบ หรือความต้องการของตลาด"
