<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="sans-serif" font-size="14">
<title>วัฏจักรไนโตรเจน</title>
<rect x="0" y="0" width="860" height="470" fill="#ffffff"/>
<rect x="330.0" y="20.0" width="200.0" height="56.0" rx="8" fill="#eef4fb" stroke="#2c4a7a" stroke-width="1.5"/>
<text x="430.0" y="44.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">N₂ ในบรรยากาศ</text>
<text x="430.0" y="61.5" text-anchor="middle" font-size="13" fill="#222">ราวร้อยละ 78 ของอากาศ</text>
<rect x="40.0" y="200.0" width="190.0" height="56.0" rx="8" fill="#e9f5e9" stroke="#2a7a3a" stroke-width="1.5"/>
<text x="135.0" y="224.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">สิ่งมีชีวิต</text>
<text x="135.0" y="241.5" text-anchor="middle" font-size="13" fill="#222">โปรตีน กรดนิวคลีอิก</text>
<rect x="330.0" y="380.0" width="200.0" height="56.0" rx="8" fill="#fbf3e6" stroke="#8a5a1a" stroke-width="1.5"/>
<text x="430.0" y="404.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">แอมโมเนียม NH₄⁺</text>
<text x="430.0" y="421.5" text-anchor="middle" font-size="13" fill="#222">ในดิน</text>
<rect x="630.0" y="380.0" width="190.0" height="56.0" rx="8" fill="#fbf3e6" stroke="#8a5a1a" stroke-width="1.5"/>
<text x="725.0" y="413.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">ไนไตรต์ NO₂⁻</text>
<rect x="630.0" y="200.0" width="190.0" height="56.0" rx="8" fill="#fbf3e6" stroke="#8a5a1a" stroke-width="1.5"/>
<text x="725.0" y="224.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">ไนเตรต NO₃⁻</text>
<text x="725.0" y="241.5" text-anchor="middle" font-size="13" fill="#222">ในดินและน้ำ</text>
<line x1="410.0" y1="78.0" x2="410.0" y2="376.0" stroke="#555" stroke-width="2.5"/>
<polygon points="410.0,376.0 406.5,367.7 413.5,367.7" fill="#555"/>
<text x="404.0" y="110.0" text-anchor="end" font-size="12" fill="#a22">การตรึงไนโตรเจน</text>
<text x="404.0" y="126.0" text-anchor="end" font-size="12" fill="#a22">ไรโซเบียมในปมรากถั่ว</text>
<text x="404.0" y="142.0" text-anchor="end" font-size="12" fill="#a22">ไซยาโนแบคทีเรีย ฟ้าผ่า</text>
<text x="404.0" y="158.0" text-anchor="end" font-size="12" fill="#a22">และปุ๋ยจากโรงงาน</text>
<line x1="532.0" y1="408.0" x2="626.0" y2="408.0" stroke="#555" stroke-width="2.5"/>
<polygon points="626.0,408.0 617.7,411.5 617.7,404.5" fill="#555"/>
<text x="580.0" y="398.0" text-anchor="middle" font-size="12" fill="#a22">ไนตริฟิเคชัน</text>
<text x="580.0" y="450.0" text-anchor="middle" font-size="12" fill="#a22">แบคทีเรียไนโตรโซโมแนส</text>
<line x1="725.0" y1="378.0" x2="725.0" y2="260.0" stroke="#555" stroke-width="2.5"/>
<polygon points="725.0,260.0 728.5,268.3 721.5,268.3" fill="#555"/>
<text x="717.0" y="310.0" text-anchor="end" font-size="12" fill="#a22">ไนตริฟิเคชัน</text>
<text x="717.0" y="326.0" text-anchor="end" font-size="12" fill="#a22">แบคทีเรียไนโตรแบคเตอร์</text>
<line x1="628.0" y1="214.0" x2="234.0" y2="214.0" stroke="#2a7a3a" stroke-width="2.5"/>
<polygon points="234.0,214.0 242.3,210.5 242.3,217.5" fill="#2a7a3a"/>
<text x="318.0" y="205.0" text-anchor="middle" font-size="12" fill="#2a7a3a">พืชดูดซึม สัตว์กินพืช</text>
<line x1="150.0" y1="258.0" x2="326.0" y2="400.0" stroke="#555" stroke-width="2.5"/>
<polygon points="326.0,400.0 317.3,397.5 321.7,392.1" fill="#555"/>
<text x="50.0" y="310.0" text-anchor="start" font-size="12" fill="#a22">การย่อยสลาย</text>
<text x="50.0" y="326.0" text-anchor="start" font-size="12" fill="#a22">ซากและของเสีย → NH₄⁺</text>
<text x="50.0" y="342.0" text-anchor="start" font-size="12" fill="#a22">โดยผู้ย่อยสลาย</text>
<line x1="725.0" y1="198.0" x2="532.0" y2="60.0" stroke="#555" stroke-width="2.5"/>
<polygon points="532.0,60.0 540.8,62.0 536.7,67.7" fill="#555"/>
<text x="650.0" y="110.0" text-anchor="start" font-size="12" fill="#a22">ดีไนตริฟิเคชัน</text>
<text x="650.0" y="126.0" text-anchor="start" font-size="12" fill="#a22">แบคทีเรียในดินที่ขาด O₂</text>
</svg>