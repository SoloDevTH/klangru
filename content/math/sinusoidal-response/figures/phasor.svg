<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" font-family="sans-serif">
<title>เวกเตอร์ของ p(iω) บนระนาบเชิงซ้อน ความยาวให้ตัวหารของเกน มุมคือเฟสล้า</title>
<rect width="480" height="320" fill="#ffffff"/>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1f5fa8"/></marker></defs>
<line x1="30" y1="230" x2="420" y2="230" stroke="#444" stroke-width="1.5"/>
<line x1="150" y1="30" x2="150" y2="300" stroke="#444" stroke-width="1.5"/>
<text x="412" y="222" font-size="13" fill="#333">Re</text>
<text x="158" y="36" font-size="13" fill="#333">Im</text>
<line x1="150" y1="230" x2="230" y2="110" stroke="#1f5fa8" stroke-width="3" marker-end="url(#a)"/>
<circle cx="230" cy="110" r="4" fill="#1f5fa8"/>
<path d="M198,230 A48,48 0 0 0 176.6,190.1" fill="none" stroke="#d35400" stroke-width="2"/>
<text x="204" y="222" font-size="14" fill="#d35400">arg p(iω)</text>
<text x="240" y="104" font-size="14" fill="#1f5fa8">p(iω) = 2 + 3i</text>
<text x="132.0" y="174.0" font-size="13" fill="#1f5fa8">|p(iω)|</text>
<text x="300" y="290" font-size="13" fill="#444">เกน = 1/|p|  เฟสล้า = arg p</text>
</svg>
