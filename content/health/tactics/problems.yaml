problems:
- id: health.sport.tactics.p001
  topics:
  - health.sport.tactics
  difficulty: 1
  type: mcq
  stem: การที่ผู้เล่นฝ่ายรุกยืนกระจายชิดเส้นข้างทั้งสองฝั่ง มีจุดประสงค์หลักเพื่ออะไร
  choices:
  - id: a
    text: ดึงผู้ป้องกันให้แยกกัน เกิดช่องว่างตรงกลาง
    correct: true
  - id: b
    text: พักให้หายเหนื่อย
    feedback: การยืนกว้างเป็นกลวิธีการรุก ไม่ใช่การพัก
  - id: c
    text: ให้ผู้ป้องกันรวมตัวกันง่ายขึ้น
    feedback: ตรงข้าม การยืนกว้างทำให้ผู้ป้องกันรวมตัวกันยาก
  hints:
  - หลักการนี้เรียกว่าความกว้าง
  - ผู้ป้องกันต้องตามไปดูแลผู้เล่นที่อยู่ริมเส้น
  solution: ความกว้างทำให้ผู้ป้องกันต้องแยกกันออกไป เกิดช่องว่างตรงกลางให้ส่งหรือเจาะเข้าไป
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sport.tactics.p002
  topics:
  - health.sport.tactics
  difficulty: 1
  type: mcq
  stem: การป้องกันแบบประกบตัวต่อตัวคืออะไร
  choices:
  - id: a
    text: ผู้ป้องกันแต่ละคนดูแลคู่แข่ง 1 คน
    correct: true
  - id: b
    text: ผู้ป้องกันแต่ละคนดูแลพื้นที่ของตน
    feedback: นี่คือการป้องกันพื้นที่หรือโซน
  - id: c
    text: ผู้ป้องกันทุกคนวิ่งเข้าแย่งลูกพร้อมกัน
    feedback: ทำให้เกิดช่องว่างให้คู่แข่งส่งออกไปหาคนที่ว่าง
  hints:
  - ชื่อบอกอยู่แล้วว่า "ตัวต่อตัว"
  - ต่างจากโซนที่ดูแลพื้นที่
  solution: การประกบตัวต่อตัวคือผู้ป้องกันแต่ละคนรับผิดชอบคู่แข่ง 1 คนและตามไปทุกที่
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sport.tactics.p003
  topics:
  - health.sport.tactics
  difficulty: 2
  type: numeric
  stem: จากแผนภาพ ระยะส่งลูกจาก A ไป C เป็นกี่เมตร (ตอบเป็นเมตร)
  figure: &id001
    src: play-grid.svg
    alt: แผนภาพครึ่งสนามฟุตซอลบนตารางช่องละ 1 เมตร แกนนอน 0 ถึง 20 เมตร แกนตั้ง 0 ถึง 20 เมตร ประตูอยู่ด้านบน ฝ่ายรุก A ที่ (6, 4) ครองลูก B ที่ (14, 4) C ที่ (9, 8) D ที่ (17, 13) ฝ่ายป้องกัน X1 ที่ (6, 6) X2 ที่ (14, 6) X3 ที่ (16, 14) และผู้รักษาประตูที่ (10, 19)
  answer:
    value: 5
    unit: เมตร
  misconceptions:
  - match: 7
    feedback: บวกระยะแนวนอน 3 กับแนวตั้ง 4 ตรง ๆ ต้องใช้ทฤษฎีบทพีทาโกรัส
  - match: 25
    feedback: 25 คือ 3² + 4² ยังไม่ได้ถอดรากที่สอง
  hints:
  - หาระยะตามแนวนอน (9 − 6) และแนวตั้ง (8 − 4)
  - ระยะตรง = √(แนวนอน² + แนวตั้ง²)
  solution: แนวนอน $9 - 6 = 3$ เมตร แนวตั้ง $8 - 4 = 4$ เมตร ระยะส่ง $\sqrt{3^2 + 4^2} = \sqrt{25} = 5$ เมตร
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sport.tactics.p004
  topics:
  - health.sport.tactics
  difficulty: 2
  type: mcq
  stem: จากแผนภาพ ผู้เล่นฝ่ายรุกคนใดว่างที่สุด คือไม่มีผู้ป้องกันอยู่ห่างไม่เกิน 3 เมตร
  figure: *id001
  choices:
  - id: a
    text: C
    correct: true
  - id: b
    text: B
    feedback: X2 อยู่ห่าง B เพียง 2 เมตร
  - id: c
    text: D
    feedback: X3 อยู่ห่าง D เพียงราว 1.4 เมตร
  hints:
  - หาผู้ป้องกันที่ใกล้ที่สุดของผู้เล่นแต่ละคน
  - X1 อยู่ห่าง C ประมาณ 3.6 เมตร
  solution: ผู้ป้องกันที่ใกล้ C ที่สุดคือ X1 ห่าง $\sqrt{3^2 + 2^2} \approx 3.6$ เมตร ส่วน B มี X2 ห่าง 2 เมตร และ D มี X3 ห่างราว 1.4 เมตร C จึงว่างที่สุด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sport.tactics.p005
  topics:
  - health.sport.tactics
  difficulty: 2
  type: match
  stem: จับคู่หลักการกับคำอธิบาย
  pairs:
  - left: ความกว้าง
    right: ยืนกระจายใช้สนามทั้งกว้างเพื่อเปิดช่องตรงกลาง
  - left: ความลึก
    right: มีผู้เล่นทั้งหน้าและหลังผู้ครองลูก
  - left: ส่งแล้ววิ่ง
    right: ส่งให้เพื่อนแล้ววิ่งเข้าที่ว่างเพื่อรับลูกคืน
  - left: ระวังหลัง
    right: ผู้ป้องกันคนที่สองยืนเยื้องด้านหลังพร้อมช่วยเพื่อน
  hints:
  - สามข้อแรกเป็นหลักการรุก
  - ข้อสุดท้ายเป็นหลักการป้องกัน
  solution: ความกว้างเปิดช่องตรงกลาง ความลึกให้ทางส่งหลายทิศ ส่งแล้ววิ่งทำให้รับลูกคืนในที่ว่าง และการระวังหลังช่วยเมื่อเพื่อนถูกผ่าน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sport.tactics.p006
  topics:
  - health.sport.tactics
  difficulty: 2
  type: mcq
  stem: ทีมวอลเลย์บอลของโรงเรียนพบคู่แข่งที่ตบลูกจากหัวเสาด้านซ้ายแม่นมาก กลวิธีป้องกันใดเหมาะสมที่สุด
  choices:
  - id: a
    text: ให้ผู้เล่นแถวหน้า 2 คนไปบล็อกฝั่งนั้น และจัดคนรับลูกหลังบล็อกให้ครอบคลุมทิศที่เขาชอบตบ
    correct: true
  - id: b
    text: ให้ทุกคนยืนเรียงแถวกลางสนาม
    feedback: ไม่ได้ปิดทิศทางที่คู่แข่งตบได้ผล
  - id: c
    text: ไม่ต้องบล็อก รอรับอย่างเดียว
    feedback: การบล็อกช่วยลดมุมตบและทำให้ลูกช้าลง
  hints:
  - ป้องกันจุดแข็งของคู่แข่ง
  - ในวอลเลย์บอล การป้องกันมีทั้งบล็อกและการรับ
  solution: เมื่อรู้จุดแข็งของคู่แข่ง ให้เพิ่มคนบล็อกฝั่งนั้นและจัดตำแหน่งรับลูกให้คลุมทิศที่เขาตบบ่อย เป็นการวางแผนป้องกันจากการวิเคราะห์คู่แข่ง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sport.tactics.p007
  topics:
  - health.sport.tactics
  difficulty: 3
  type: numeric
  stem: จากแผนภาพ ฝ่ายรุกมีผู้เล่นในสนาม (ไม่นับผู้รักษาประตู) มากกว่าผู้ป้องกันในสนาม (ไม่นับผู้รักษาประตู) กี่คน (ตอบเป็นจำนวนคน)
  figure: *id001
  answer:
    value: 1
    unit: คน
  misconceptions:
  - match: 0
    feedback: ฝ่ายป้องกันในสนามมี 3 คน ไม่ใช่ 4 อย่านับผู้รักษาประตู
  - match: 2
    feedback: นับผู้เล่นฝ่ายรุกได้ 4 คน (A B C D) และผู้ป้องกันในสนาม 3 คน (X1 X2 X3)
  hints:
  - นับวงกลม A ถึง D
  - นับกากบาท X1 ถึง X3 ไม่รวมผู้รักษาประตู
  solution: ฝ่ายรุกมี 4 คน ฝ่ายป้องกันในสนามมี 3 คน ฝ่ายรุกได้เปรียบ $4 - 3 = 1$ คน ต้องหาว่าใครว่างแล้วส่งให้คนนั้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sport.tactics.p008
  topics:
  - health.sport.tactics
  difficulty: 3
  type: numeric
  stem: จากแผนภาพ ระยะส่งลูกจาก A ไป D เป็นกี่เมตร (ตอบเป็นเมตร ทศนิยม 1 ตำแหน่ง)
  figure: *id001
  answer:
    value: 14.2
    tolerance: 0.15
    unit: เมตร
  misconceptions:
  - match: 20
    feedback: บวกระยะแนวนอน 11 กับแนวตั้ง 9 ตรง ๆ ต้องใช้ทฤษฎีบทพีทาโกรัส
  - match: 202
    feedback: 202 คือ 11² + 9² ยังไม่ได้ถอดรากที่สอง
  hints:
  - แนวนอน 17 − 6 แนวตั้ง 13 − 4
  - ระยะตรง = √(11² + 9²)
  solution: แนวนอน 11 เมตร แนวตั้ง 9 เมตร ระยะส่ง $\sqrt{11^2 + 9^2} = \sqrt{202} \approx 14.2$ เมตร ซึ่งยาวเกือบสามเท่าของการส่งให้ C และ D ยังมี X3 ประกบอยู่
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sport.tactics.p009
  topics:
  - health.sport.tactics
  difficulty: 3
  type: mcq
  stem: คู่แข่งบาสเกตบอลมีผู้เล่นที่ยิงสามคะแนนแม่นมากถึง 3 คน ส่วนการเล่นใต้แป้นไม่เด่น ทีมเราควรเลือกป้องกันแบบใด
  choices:
  - id: a
    text: ประกบตัวต่อตัว เพื่อกดดันผู้ยิงไกลไม่ให้มีจังหวะยิงสบาย
    correct: true
  - id: b
    text: โซน 2-3 ที่รวมคนไว้ใต้แป้น
    feedback: โซนที่รวมคนใต้แป้นจะเปิดพื้นที่ยิงไกลให้คู่แข่งที่ยิงไกลแม่น
  - id: c
    text: ไม่ต้องป้องกัน รอแย่งรีบาวด์อย่างเดียว
    feedback: ถ้าคู่แข่งยิงไกลแม่น การปล่อยให้ยิงสบายทำให้เสียคะแนนมาก
  hints:
  - ดูจุดแข็งของคู่แข่งก่อนเลือก
  - โซนที่รวมคนใต้แป้นมีข้อควรระวังอะไร
  solution: คู่แข่งเก่งการยิงไกล จึงควรประกบตัวต่อตัวเพื่อกดดันผู้ยิง ส่วนโซน 2-3 เหมาะกับคู่แข่งที่เน้นเล่นใต้แป้นและยิงไกลไม่แม่น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sport.tactics.p010
  topics:
  - health.sport.tactics
  difficulty: 3
  type: order
  stem: เรียงขั้นการวางแผนการรุกและการป้องกันของทีม
  items:
  - วิเคราะห์จุดแข็งและจุดอ่อนของทีมเรากับคู่แข่ง
  - เลือกกลวิธีให้ใช้จุดแข็งของเราและโจมตีจุดอ่อนของคู่แข่ง
  - ซ้อมและตกลงสัญญาณร่วมกัน
  - ใช้ในเกมและปรับตามคะแนนและเวลา
  - ประเมินผลหลังเกม
  hints:
  - ต้องรู้ข้อมูลก่อนจึงเลือกแผนได้
  - ขั้นสุดท้ายคือดูว่าแผนได้ผลแค่ไหน
  solution: วิเคราะห์ → เลือกกลวิธี → ซ้อมและตกลงสัญญาณ → ใช้และปรับระหว่างเกม → ประเมินผล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sport.tactics.p011
  topics:
  - health.sport.tactics
  difficulty: 3
  type: text
  stem: การป้องกันที่ผู้เล่นแต่ละคนดูแลพื้นที่ของตนแทนการตามคู่แข่ง เรียกว่าการป้องกันแบบใด (ตอบเป็นคำ)
  accepted:
  - โซน
  - แบบโซน
  - ป้องกันแบบโซน
  - การป้องกันแบบโซน
  - พื้นที่
  - ป้องกันพื้นที่
  - การป้องกันพื้นที่
  - แบบพื้นที่
  misconceptions:
  - match: ประกบตัวต่อตัว
    feedback: ประกบตัวต่อตัวคือดูแลคู่แข่งคนละคน ไม่ใช่ดูแลพื้นที่
  - match: ตัวต่อตัว
    feedback: ตัวต่อตัวคือดูแลคู่แข่งคนละคน
  hints:
  - ตรงข้ามกับการประกบตัวต่อตัว
  - เช่น 2-3 ในบาสเกตบอล
  solution: การป้องกันที่แต่ละคนดูแลพื้นที่ของตนเรียกว่าการป้องกันพื้นที่หรือแบบโซน เช่น โซน 2-3 ในบาสเกตบอล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sport.tactics.p012
  topics:
  - health.sport.tactics
  difficulty: 4
  type: mcq
  stem: ทีมฟุตซอลของเรานำอยู่ 1 ประตู เหลือเวลา 1 นาที ข้อใดเป็นกลวิธีที่เหมาะสมที่สุด
  choices:
  - id: a
    text: ครองลูกให้นานด้วยการส่งสั้นที่ปลอดภัย และเมื่อเสียลูกให้รีบกลับมาป้องกันแบบกระชับหน้าประตู
    correct: true
  - id: b
    text: ทุกคนบุกขึ้นไปยิงเพิ่ม
    feedback: ถ้าเสียลูก คู่แข่งจะสวนกลับได้ง่ายเพราะไม่มีคนอยู่หลัง
  - id: c
    text: เตะลูกออกนอกสนามแรง ๆ ทุกครั้ง
    feedback: ทำให้คู่แข่งได้ครองลูกบ่อยขึ้น และอาจขัดน้ำใจนักกีฬาถ้าตั้งใจถ่วงเวลาเกินควร
  hints:
  - คิดถึงคะแนนและเวลาที่เหลือ
  - ทีมที่ครองลูกอยู่ คู่แข่งยิงประตูไม่ได้
  solution: เมื่อนำและเหลือเวลาน้อย การครองลูกด้วยการส่งที่ปลอดภัยลดโอกาสคู่แข่งได้ยิง และการป้องกันแบบกระชับช่วยปิดช่องหน้าประตู
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sport.tactics.p013
  topics:
  - health.sport.tactics
  difficulty: 4
  type: mcq
  stem: ในการแข่งฟุตบอลระหว่างห้องที่โรงเรียน ผู้เล่นทั้งทีมของเราวิ่งตามลูกเป็นกลุ่มเดียวกัน ส่งต่อไม่ได้ และถูกสวนกลับบ่อย ข้อใดแก้ได้ดีที่สุด
  choices:
  - id: a
    text: แบ่งตำแหน่งให้มีความกว้างและความลึก ให้บางคนอยู่หลังเพื่อระวังหลัง และฝึกสื่อสารเรียกชื่อ
    correct: true
  - id: b
    text: ให้ทุกคนวิ่งเร็วขึ้นเพื่อแย่งลูกให้ได้
    feedback: ถ้ายังรวมเป็นกลุ่มเดียว แม้วิ่งเร็วก็ยังส่งต่อไม่ได้และเปิดช่องด้านหลัง
  - id: c
    text: เปลี่ยนผู้รักษาประตู
    feedback: ปัญหาอยู่ที่การยืนตำแหน่งของทั้งทีม ไม่ใช่ผู้รักษาประตู
  hints:
  - ปัญหาคือทุกคนอยู่ที่เดียวกัน
  - หลักการรุกและการป้องกันข้อใดแก้ปัญหานี้
