    solution: "รอบบานพับ: $T(2.0)\\sin 30^\\circ = (10)(9.8)(1.0) + (20)(9.8)(2.0)$ จึงได้ $T(1.0) = 98 + 392 = 490$ และ $T = 490\\ \\mathrm{N}$ มากกว่าน้ำหนักป้ายถึง 2.5 เท่า เพราะลวดเอียงน้อย"
