problems:
- id: english.grammar.english-vs-thai.p001
  topics:
  - english.grammar.english-vs-thai
  difficulty: 1
  type: mcq
  stem: '"บ้านใหญ่" ภาษาอังกฤษคือข้อใด'
  choices:
  - id: a
    text: a big house
    correct: true
    feedback: ถูก ภาษาอังกฤษวางคุณศัพท์ไว้หน้าคำนาม
  - id: b
    text: a house big
    feedback: เรียงแบบภาษาไทย ภาษาอังกฤษต้องวางคุณศัพท์หน้าคำนาม
  - id: c
    text: a big houses
    feedback: a ใช้กับเอกพจน์ ไม่เติม s
  - id: d
    text: big a house
    feedback: a ต้องอยู่หน้าสุดของกลุ่มคำ
  hints:
  - 'ภาษาไทย: คำนาม + คุณศัพท์'
  - 'ภาษาอังกฤษ: คุณศัพท์ + คำนาม'
  solution: '***a big house*** คุณศัพท์ big อยู่หน้าคำนาม house'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.english-vs-thai.p002
  topics:
  - english.grammar.english-vs-thai
  difficulty: 1
  type: text
  stem: 'แปลเป็นภาษาอังกฤษ (สองคำ): "แมวสามตัว"'
  accepted:
  - three cats
  misconceptions:
  - match: three cat
    feedback: 'ภาษาอังกฤษต้องเติม s ให้คำนามพหูพจน์: cats'
  - match: cat three
    feedback: 'จำนวนอยู่หน้าคำนาม: three cats'
  - match: cats three
    feedback: 'จำนวนอยู่หน้าคำนาม: three cats'
  hints:
  - ภาษาอังกฤษไม่มีลักษณนาม (ตัว)
  - จำนวน + คำนามเติม s
  solution: '***three cats*** จำนวนอยู่หน้า คำนามเติม -s และไม่มีลักษณนาม'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.english-vs-thai.p003
  topics:
  - english.grammar.english-vs-thai
  difficulty: 1
  type: text
  stem: 'พิมพ์เครื่องหมายวรรคตอนที่ต้องใส่ท้ายประโยคนี้: *Where do you live___*'
  accepted:
  - '?'
  misconceptions:
  - match: .
    feedback: ประโยคนี้เป็นคำถาม (Where) ภาษาอังกฤษต้องจบด้วย ?
  - match: '!'
    feedback: '! ใช้กับประโยคอุทาน ประโยคนี้เป็นคำถาม'
  hints:
  - ภาษาไทยไม่ต้องใส่ ? เพราะมีคำถามอย่าง ไหน อยู่แล้ว
  - ภาษาอังกฤษ คำถามทุกประโยคจบด้วยเครื่องหมายใด
  solution: '*Where do you live**?*** คำถามภาษาอังกฤษต้องมีเครื่องหมายคำถาม'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.english-vs-thai.p004
  topics:
  - english.grammar.english-vs-thai
  difficulty: 2
  type: text
  stem: '"เขาสูงมาก" เติมคำที่ขาด: *He ___ very tall.*'
  accepted:
  - is
  misconceptions:
  - match: very
    feedback: very อยู่ในประโยคแล้ว ที่ขาดคือ verb to be
  - match: are
    feedback: He ใช้ is
  - match: tall
    feedback: tall อยู่ในประโยคแล้ว ที่ขาดคือ verb to be
  hints:
  - ภาษาไทยพูด เขาสูง ไม่มีกริยา แต่ภาษาอังกฤษต้องมีกริยาหน้าคุณศัพท์
  - He + verb to be (am/is/are)
  solution: '*He **is** very tall.* ภาษาอังกฤษต้องมี verb to be หน้าคุณศัพท์'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.english-vs-thai.p005
  topics:
  - english.grammar.english-vs-thai
  difficulty: 2
  type: mcq
  stem: '"คุณกำลังจะไปไหน" ภาษาอังกฤษคือข้อใด'
  choices:
  - id: a
    text: Where are you going?
    correct: true
    feedback: ถูก คำถาม wh- อยู่หน้า ตามด้วยกริยาช่วย are และประธาน
  - id: b
    text: Where you are going?
    feedback: ต้องสลับกริยาช่วย are ไว้หน้าประธาน you
  - id: c
    text: Are you going where?
    feedback: where ต้องอยู่ต้นประโยค ไม่อยู่ท้ายแบบภาษาไทย
  - id: d
    text: Where going you?
    feedback: ขาดกริยาช่วย are และเรียงคำผิด
  hints:
  - ภาษาไทยวาง ไหน ท้ายประโยค แต่ภาษาอังกฤษวาง Where ไว้หน้า
  - Wh- + กริยาช่วย + ประธาน + กริยาหลัก
  solution: '***Where are you going?***'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.english-vs-thai.p006
  topics:
  - english.grammar.english-vs-thai
  difficulty: 2
  type: text
  stem: '"เธอชอบผลไม้อะไร" เติมกริยาช่วยหนึ่งคำ: *What fruit ___ you like?*'
  accepted:
  - do
  misconceptions:
  - match: are
    feedback: like เป็นกริยาแท้ คำถามใช้กริยาช่วย do ไม่ใช่ are
  - match: does
    feedback: ประธานคือ you ใช้ do
  - match: you
    feedback: you อยู่ในประโยคแล้ว ช่องว่างต้องเป็นกริยาช่วย
  hints:
  - ภาษาไทยไม่มีกริยาช่วยในคำถาม แต่ภาษาอังกฤษต้องมี
  - What fruit + do/does + ประธาน + like
  solution: '*What fruit **do** you like?*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.english-vs-thai.p007
  topics:
  - english.grammar.english-vs-thai
  difficulty: 3
  type: match
  stem: จับคู่สุภาษิตไทยกับสุภาษิตอังกฤษที่ความหมายใกล้กัน
  pairs:
  - left: ยิงปืนนัดเดียวได้นกสองตัว
    right: Kill two birds with one stone.
  - left: หนีเสือปะจระเข้
    right: Out of the frying pan into the fire.
  - left: พูดไปสองไพเบี้ย นิ่งเสียตำลึงทอง
    right: Speech is silver, silence is golden.
  - left: กำแพงมีหู ประตูมีช่อง
    right: Walls have ears.
  hints:
  - บางคู่ใช้ภาพเดียวกัน (นก กำแพง) บางคู่ใช้ภาพต่างกันแต่ความหมายเดียวกัน
  - หนีอันตรายหนึ่งไปเจออีกอันตรายหนึ่ง = กระทะร้อนกับไฟ
  solution: ยิงปืนนัดเดียว → Kill two birds · หนีเสือปะจระเข้ → Out of the frying pan · พูดไปสองไพเบี้ย → Speech is silver · กำแพงมีหู → Walls have ears
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.english-vs-thai.p008
  topics:
  - english.grammar.english-vs-thai
  difficulty: 3
  type: mcq
  stem: '"เมื่อวานฉันไปตลาด" ภาษาอังกฤษคือข้อใด'
  choices:
  - id: a
    text: I went to the market yesterday.
    correct: true
    feedback: ถูก เมื่อวานเป็นอดีต ต้องใช้กริยาช่อง 2 went
  - id: b
    text: I go to the market yesterday.
    feedback: ภาษาไทยไม่เปลี่ยนรูปกริยา แต่ภาษาอังกฤษต้องเปลี่ยน go เป็น went
  - id: c
    text: I goed to the market yesterday.
    feedback: go เป็นกริยาอปกติ อดีตคือ went
  - id: d
    text: Yesterday I am go to the market.
    feedback: ใช้ am ผิด และ go ต้องเป็น went
  hints:
  - เมื่อวาน = อดีต
  - ภาษาอังกฤษบอกเวลาด้วยรูปกริยา go → went
  solution: '***I went to the market yesterday.***'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.english-vs-thai.p009
  topics:
  - english.grammar.english-vs-thai
  difficulty: 3
  type: mcq
  stem: พูดคำถาม *Do you like som tam?* ตามทำนองเสียงที่พบบ่อยในภาษาอังกฤษ เสียงท้ายประโยคเป็นอย่างไร
  choices:
  - id: a
    text: ขึ้นเสียงท้าย ↗
    correct: true
    feedback: ถูก คำถาม yes/no มักขึ้นเสียงท้าย
  - id: b
    text: ลงเสียงท้าย ↘
    feedback: ลงเสียงท้ายใช้กับประโยคบอกเล่าและคำถาม wh-
  - id: c
    text: ต้องเติมคำว่า ไหม ท้ายประโยค
    feedback: ภาษาอังกฤษไม่มีคำลงท้ายแบบ ไหม ใช้การสลับ Do และทำนองเสียงแทน
  - id: d
    text: ทุกคำใช้ระดับเสียงเท่ากันหมด
    feedback: ภาษาอังกฤษใช้ทำนองเสียงขึ้นลงทั้งประโยค
  hints:
  - คำถามนี้ตอบได้ด้วย Yes หรือ No
  - คำถาม yes/no กับคำถาม wh- ใช้ทำนองต่างกัน
  solution: '*Do you like som tam?↗* คำถาม yes/no มักขึ้นเสียงท้าย ส่วนภาษาไทยบอกว่าเป็นคำถามด้วยคำว่า ไหม'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.english-vs-thai.p010
  topics:
  - english.grammar.english-vs-thai
  difficulty: 3
  type: text
  stem: '"ฉันมีพี่ชายสองคน" เติมคำนามหนึ่งคำ: *I have two ___.*'
  accepted:
  - brothers
  - older brothers
  - elder brothers
  misconceptions:
  - match: brother
    feedback: 'two เป็นพหูพจน์ ต้องเติม s: brothers'
  - match: brother two
    feedback: จำนวนอยู่หน้าคำนามแล้ว ให้เติมแค่คำนามพหูพจน์
  hints:
  - ภาษาไทยไม่เปลี่ยนรูปคำนาม แต่ภาษาอังกฤษเปลี่ยน
  - two + คำนามเติม s
  solution: '*I have two **brothers**.* (บอกว่าเป็นพี่ได้ด้วย older brothers)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.english-vs-thai.p011
  topics:
  - english.grammar.english-vs-thai
  difficulty: 3
  type: mcq
  stem: '"ฝนตก" ภาษาอังกฤษคือข้อใด'
  choices:
  - id: a
    text: It is raining.
    correct: true
    feedback: ถูก ภาษาอังกฤษต้องมีประธาน ใช้ It เป็นประธาน
  - id: b
    text: Is raining.
    feedback: ภาษาอังกฤษต้องมีประธานเสมอ ขาด It
  - id: c
    text: Rain falling.
    feedback: ขาดกริยาแท้ (is) และไม่ใช่สำนวนบอกฝนตก
  - id: d
    text: It raining.
    feedback: ขาด is ก่อน raining
  hints:
  - ภาษาไทยละประธานได้ ภาษาอังกฤษละไม่ได้
  - สภาพอากาศใช้ It เป็นประธาน
  solution: '***It is raining.*** (หรือ *It''s raining.*)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.english-vs-thai.p012
  topics:
  - english.grammar.english-vs-thai
  difficulty: 4
  type: order
  stem: เรียงคำแปลของ "เธอซื้อกระเป๋าใบใหม่สีแดง"
  items:
  - She
  - bought
  - a
  - new
  - red
  - bag.
  hints:
  - 'ลำดับคุณศัพท์ในภาษาอังกฤษ: ความเห็น → ขนาด → อายุ → สี → คำนาม'
  - new (อายุ) อยู่หน้า red (สี)
  solution: '*She bought a new red bag.* อายุ (new) มาก่อนสี (red) และทั้งสองอยู่หน้าคำนาม'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.english-vs-thai.p013
  topics:
  - english.grammar.english-vs-thai
  difficulty: 4
  type: mcq
  stem: '"ฉันเห็นช้างที่สวนสัตว์" ข้อใดถูกต้องที่สุด'
  choices:
  - id: a
    text: I saw an elephant at the zoo.
    correct: true
    feedback: ถูก มีคำนำหน้านาม an และ the และใช้กริยาอดีต saw
  - id: b
    text: I saw elephant at zoo.
    feedback: ภาษาไทยไม่มีคำนำหน้านาม แต่ภาษาอังกฤษต้องมี an elephant และ the zoo
  - id: c
    text: I saw a elephant at the zoo.
    feedback: elephant ขึ้นต้นด้วยเสียงสระ ใช้ an
  - id: d
    text: I see elephant at the zoo.
    feedback: ขาด an และต้องเป็นอดีต saw ถ้าเป็นเรื่องที่ผ่านมาแล้ว
  hints:
  - คำนามนับได้เอกพจน์ต้องมี a/an หรือ the
  - elephant ขึ้นต้นด้วยเสียงสระ
  solution: '***I saw an elephant at the zoo.***'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.english-vs-thai.p014
  topics:
  - english.grammar.english-vs-thai
  difficulty: 4
  type: match
  stem: จับคู่คำบอกเวลาหรือคำช่วยในภาษาไทยกับรูปกริยาภาษาอังกฤษ
  pairs:
  - left: กำลัง (กำลังกิน)
    right: am/is/are + V-ing (am eating)
  - left: จะ (จะกิน)
    right: will + V1 (will eat)
  - left: เคย (เคยกิน)
    right: have/has + V3 (have eaten)
  - left: เมื่อวาน (เมื่อวานกิน)
    right: V2 (ate)
  hints:
  - ภาษาไทยไม่เปลี่ยนรูปกริยา แต่ใช้คำช่วย
  - เคย = ประสบการณ์ ใช้ present perfect
  solution: กำลัง → present continuous · จะ → will · เคย → present perfect · เมื่อวาน → past simple
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.english-vs-thai.p015
  topics:
  - english.grammar.english-vs-thai
  difficulty: 4
  type: order
  stem: เรียงคำแปลของ "ข้าวเหนียวมะม่วงอร่อยกว่าไอศกรีม"
  items:
  - Mango sticky rice
  - is
  - more delicious
  - than
  - ice cream.
  hints:
  - ภาษาไทยไม่มีกริยาหน้า อร่อยกว่า แต่ภาษาอังกฤษต้องมี is
  - ประธาน + is + more + คุณศัพท์ + than + สิ่งที่เปรียบ
  solution: '*Mango sticky rice is more delicious than ice cream.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.english-vs-thai.p016
  topics:
  - english.grammar.english-vs-thai
  difficulty: 4
  type: mcq
  stem: '"เข้าเมืองตาหลิ่ว ต้องหลิ่วตาตาม" ตรงกับสุภาษิตอังกฤษข้อใด'
  choices:
  - id: a
    text: When in Rome, do as the Romans do.
    correct: true
    feedback: ถูก ทั้งสองหมายถึงทำตามธรรมเนียมของที่ที่เราไปอยู่
  - id: b
    text: Kill two birds with one stone.
    feedback: หมายถึง ยิงปืนนัดเดียวได้นกสองตัว
  - id: c
    text: Speech is silver, silence is golden.
    feedback: หมายถึง พูดไปสองไพเบี้ย นิ่งเสียตำลึงทอง
  - id: d
    text: Where there's a will, there's a way.
    feedback: หมายถึง ความพยายามอยู่ที่ไหน ความสำเร็จอยู่ที่นั่น
  hints:
  - 'ความหมายของสุภาษิตไทย: ไปอยู่ที่ไหนก็ทำตามคนที่นั่น'
  - หาสุภาษิตอังกฤษที่พูดถึงการทำตามคนในเมืองหนึ่ง
  solution: '***When in Rome, do as the Romans do.***'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.english-vs-thai.p017
  topics:
  - english.grammar.english-vs-thai
  difficulty: 5
  type: mcq
  stem: 'อ่านย่อหน้าที่นักเรียนไทยเขียน ประโยคใดมีข้อผิดพลาดที่เกิดจากการคิดแบบภาษาไทย (เลือกทุกข้อที่ผิด)


    *(1) Last weekend I go to Hua Hin with my family. (2) The beach was very beautiful. (3) My sister very happy. (4) We ate seafood at a small restaurant.*'
  multiple: true
  choices:
  - id: a
    text: (1) Last weekend I go to Hua Hin with my family.
    correct: true
    feedback: ผิดจริง ภาษาไทยไม่เปลี่ยนรูปกริยา แต่ last weekend ต้องใช้ went
  - id: b
    text: (2) The beach was very beautiful.
    feedback: ประโยคนี้ถูกต้อง มี was และคุณศัพท์อยู่หลัง
  - id: c
    text: (3) My sister very happy.
    correct: true
    feedback: ผิดจริง ขาด was แบบภาษาไทย (น้องสาวดีใจมาก) ต้องเป็น My sister was very happy.
  - id: d
    text: (4) We ate seafood at a small restaurant.
    feedback: ประโยคนี้ถูกต้อง ใช้ ate และ a small restaurant
  hints:
