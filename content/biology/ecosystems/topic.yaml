id: biology.ecology.ecosystems
subject: biology
title: { th: การถ่ายทอดพลังงานและวัฏจักรสารในระบบนิเวศ, en: "Energy flow and nutrient cycles in ecosystems" }
summary: ผลผลิตปฐมภูมิ ประสิทธิภาพการถ่ายทอดพลังงาน พีระมิดจำนวน มวลชีวภาพ และพลังงาน ไบโอแมกนิฟิเคชันและการลด วัฏจักรคาร์บอน ไนโตรเจน ฟอสฟอรัส และกำมะถัน
difficulty: 5
minutes: 45
prerequisites: [biology.plants.photosynthesis, biology.ecology.food-webs]
encompasses:
  - { id: biology.ecology.food-webs, weight: 0.4 }
  - { id: biology.plants.photosynthesis, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: พีระมิดนิเวศ 3 แบบ
    src: ecological-pyramids.svg
    alt: "พีระมิด 3 รูป ความกว้างของแต่ละชั้นเป็นสัดส่วนกับค่า ข้อมูลสมมติ รูปซ้ายพีระมิดจำนวนบนต้นมะม่วง 1 ต้น ชั้นล่างมะม่วง 1 ต้นแคบ ชั้นถัดไปเพลี้ย 5,000 ตัวกว้างที่สุด เต่าทอง 300 ตัว และนก 4 ตัว ฐานแคบเพราะผู้ผลิตตัวใหญ่ รูปกลางพีระมิดมวลชีวภาพในทะเลเปิด แพลงก์ตอนพืช 4 กรัมต่อตารางเมตรอยู่ล่างและแคบ แพลงก์ตอนสัตว์ 21 กรัมต่อตารางเมตรอยู่บนและกว้าง พีระมิดจึงกลับหัว รูปขวาพีระมิดพลังงาน ผู้ผลิต 15,000 ผู้บริโภคลำดับ 1 1,500 ลำดับ 2 120 ลำดับ 3 10 กิโลจูลต่อตารางเมตรต่อปี ฐานกว้างเสมอ"
    caption: "เฉพาะพีระมิดพลังงานที่ฐานกว้างเสมอ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: คำนวณประสิทธิภาพการถ่ายทอดพลังงาน
    problem: "จากพีระมิดพลังงาน ผู้ผลิตมีพลังงาน 15,000 ผู้บริโภคลำดับ 1 มี 1,500 และลำดับ 2 มี 120 kJ/m²/ปี จงหาประสิทธิภาพการถ่ายทอดพลังงานจากผู้ผลิตไปผู้บริโภคลำดับ 1 และจากลำดับ 1 ไปลำดับ 2"
    steps:
      - text: "ผู้ผลิต → ลำดับ 1: $\\frac{1{,}500}{15{,}000} \\times 100 = 10\\%$"
      - text: "ลำดับ 1 → ลำดับ 2: $\\frac{120}{1{,}500} \\times 100 = 8\\%$"
        why: "ตัวหารคือลำดับขั้นที่อยู่ติดกันด้านล่าง ไม่ใช่ผู้ผลิตเสมอไป"
      - text: "พลังงานที่ไม่ถูกส่งต่อ (90% และ 92%) ออกไปเป็นความร้อนจากการหายใจ หรืออยู่ในส่วนที่ไม่ถูกกินและของเสีย ซึ่งไปถึงผู้ย่อยสลาย"
    answer: "10% และ 8%"
  - { type: check, problem: biology.ecology.ecosystems.p008, prompt: "ตัวหารคือลำดับขั้นใด" }
  - type: figure
    title: วัฏจักรไนโตรเจน
    src: nitrogen-cycle.svg
    alt: "แผนภาพวัฏจักรไนโตรเจน กล่อง N₂ ในบรรยากาศ (ราวร้อยละ 78 ของอากาศ) อยู่บน ลูกศรการตรึงไนโตรเจนลงไปยังกล่องแอมโมเนียมในดิน โดยไรโซเบียมในปมรากถั่ว ไซยาโนแบคทีเรีย ฟ้าผ่า และปุ๋ยจากโรงงาน แอมโมเนียมเปลี่ยนเป็นไนไตรต์โดยแบคทีเรียไนโตรโซโมแนส แล้วเป็นไนเตรตโดยแบคทีเรียไนโตรแบคเตอร์ เรียกว่าไนตริฟิเคชัน ไนเตรตถูกพืชดูดซึมเข้าสู่สิ่งมีชีวิตในรูปโปรตีนและกรดนิวคลีอิก สัตว์กินพืช ซากและของเสียถูกผู้ย่อยสลายเปลี่ยนกลับเป็นแอมโมเนียม และไนเตรตถูกแบคทีเรียในดินที่ขาดออกซิเจนเปลี่ยนกลับเป็น N₂ เรียกว่าดีไนตริฟิเคชัน"
    caption: "จุลินทรีย์ทำงานเกือบทุกขั้นของวัฏจักรไนโตรเจน (วาดโดยทีมคลังรู้)"
  - type: figure
    title: งบคาร์บอนจากกิจกรรมของมนุษย์ ปี ค.ศ. 2022
    src: carbon-budget.svg
    alt: "แผนภาพกล่องบรรยากาศอยู่ตรงกลาง ระบุว่าเพิ่มขึ้น 4.6 GtC ต่อปี และ CO₂ 417 ppm ลูกศรเข้าจากเชื้อเพลิงฟอสซิลในธรณีภาคและซีเมนต์ 9.9 GtC ต่อปี และจากการเปลี่ยนการใช้ที่ดินเช่นตัดไม้ทำลายป่า 1.2 GtC ต่อปี ลูกศรออกไปยังมหาสมุทรซึ่งดูดซับ 2.8 GtC ต่อปี และพืชบนบกซึ่งดูดซับ 3.8 GtC ต่อปี ส่วนต่างเล็กน้อย −0.1 GtC คือความไม่สมดุลของการประมาณ ข้อมูลจาก Global Carbon Budget 2023"
    caption: "1 GtC เท่ากับคาร์บอนพันล้านตัน (ข้อมูล Global Carbon Budget 2023 วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: คาร์บอนจากมนุษย์ไปอยู่ที่ใด
    problem: "จากงบคาร์บอนปี ค.ศ. 2022 มนุษย์ปล่อยคาร์บอนทั้งหมดกี่ GtC และมหาสมุทรกับพืชบนบกดูดซับไว้ร้อยละเท่าใด"
    steps:
      - text: "ปล่อยทั้งหมด $9.9 + 1.2 = 11.1$ GtC"
      - text: "ดูดซับโดยมหาสมุทรและพืชบนบก $2.8 + 3.8 = 6.6$ GtC"
        why: "พืชบนบกดูดซับผ่านการสังเคราะห์ด้วยแสงที่มากกว่าการหายใจและการย่อยสลาย มหาสมุทรดูดซับโดยการละลายของ CO₂"
      - text: "คิดเป็น $\\frac{6.6}{11.1} \\times 100 \\approx 59\\%$"
      - text: "ส่วนที่เหลือราว 4.5 GtC อยู่ในบรรยากาศ ใกล้กับค่าที่วัดได้ 4.6 GtC"
    answer: "ปล่อย 11.1 GtC ดูดซับไว้ราวร้อยละ 59"
  - { type: check, problem: biology.ecology.ecosystems.p009, prompt: "เข้าบรรยากาศลบออกจากบรรยากาศ" }
glossary:
  - { term: ผลผลิตปฐมภูมิรวม (GPP), definition: "พลังงานทั้งหมดที่ผู้ผลิตตรึงไว้ในสารอินทรีย์ต่อพื้นที่ต่อเวลา" }
  - { term: ผลผลิตปฐมภูมิสุทธิ (NPP), definition: "GPP หักด้วยพลังงานที่ผู้ผลิตใช้หายใจ เป็นพลังงานที่ผู้บริโภคใช้ได้" }
  - { term: ประสิทธิภาพการถ่ายทอดพลังงาน, definition: "ร้อยละของพลังงานในลำดับขั้นหนึ่งที่ไปถึงลำดับขั้นถัดไป มักราวร้อยละ 10" }
  - { term: ไบโอแมกนิฟิเคชัน, definition: "การที่สารพิษซึ่งสลายตัวยากมีความเข้มข้นเพิ่มขึ้นตามลำดับขั้นในโซ่อาหาร" }
  - { term: การตรึงไนโตรเจน, definition: "การเปลี่ยน N₂ ในอากาศเป็นสารประกอบไนโตรเจนที่พืชใช้ได้ เช่น โดยไรโซเบียม" }
  - { term: ไนตริฟิเคชัน, definition: "การที่แบคทีเรียเปลี่ยนแอมโมเนียมเป็นไนไตรต์และไนเตรตในดินที่มีออกซิเจน" }
  - { term: ดีไนตริฟิเคชัน, definition: "การที่แบคทีเรียในที่ขาดออกซิเจนเปลี่ยนไนเตรตกลับเป็นแก๊สไนโตรเจน" }
flashcards:
  - { front: "NPP คืออะไร", back: "NPP = GPP − พลังงานที่ผู้ผลิตใช้หายใจ" }
  - { front: "พีระมิดแบบใดกลับหัวไม่ได้", back: "พีระมิดพลังงาน เพราะพลังงานสูญเสียทุกครั้งที่ส่งต่อ" }
  - { front: "ขั้นของวัฏจักรไนโตรเจน", back: "ตรึงไนโตรเจน → ไนตริฟิเคชัน → พืชดูดซึม → ย่อยสลายเป็นแอมโมเนียม → ดีไนตริฟิเคชัน" }
  - { front: "วัฏจักรใดไม่มีสถานะแก๊ส", back: "วัฏจักรฟอสฟอรัส ฟอสเฟตมาจากการผุพังของหินและตกตะกอนกลับเป็นหิน" }
  - { front: "ย่อยสลายแบบไม่ใช้ออกซิเจนในนาข้าวได้แก๊สอะไร", back: "มีเทน" }
