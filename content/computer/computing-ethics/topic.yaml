id: computer.society.computing-ethics
subject: computer
title: { th: การวิเคราะห์เชิงจริยธรรมและจรรยาบรรณวิชาชีพคอมพิวเตอร์, en: "Ethical analysis and professional ethics in computing" }
summary: วิเคราะห์ผลกระทบของเทคโนโลยีด้วยกรอบจริยธรรมหลายแบบ ระบุผู้มีส่วนได้เสีย ชั่งค่านิยมที่ขัดกัน และเห็นอคติที่แฝงในระบบและทีมพัฒนา
difficulty: 5.5
minutes: 45
prerequisites: [computer.society.responsible-ict, computer.society.computing-impacts, computer.ai.intro]
encompasses:
  - { id: computer.society.responsible-ict, weight: 0.3 }
  - { id: computer.society.computing-impacts, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: stakeholders.svg
    alt: "ระบบแนะนำเส้นทางอยู่ตรงกลาง รอบ ๆ มีห้ากลุ่มที่ต่อกันด้วยเส้นประ ได้แก่ ผู้ขับขี่ที่ได้ประโยชน์โดยตรง คนเดินเท้าในซอยที่ได้รับผลกระทบโดยอ้อม ผู้พัฒนาและทีมที่ตัดสินการออกแบบ ชุมชนท้องถิ่นที่ได้รับผลกระทบโดยอ้อม และหน่วยงานกำกับที่กำหนดกติกา"
    caption: "ผู้มีส่วนได้เสียทั้งทางตรงและทางอ้อมต้องถูกระบุก่อนวิเคราะห์"
  - type: figure
    src: route-tradeoff.svg
    alt: "จุดเริ่มทางซ้ายกับจุดหมายทางขวา เส้นโค้งสีน้ำเงินด้านบนคือถนนใหญ่ที่ยาวกว่า เส้นประสีแดงตรงกลางคือเส้นทางสั้นที่ผ่านซอยชุมชนแคบซึ่งมีเด็กและคนเดินเท้า"
    caption: "เส้นทางที่เร็วที่สุดอาจผ่านที่ที่ควรระวังที่สุด"
  - type: worked-example
    title: วิเคราะห์กรณีแอปนำทางผ่านซอยชุมชนด้วยสองกรอบคิด
    problem: "แอปนำทางเลือกเส้นทางสั้นผ่านซอยชุมชน ประหยัดเวลาผู้ขับขี่ได้มาก แต่เสี่ยงต่อเด็กและคนเดินเท้า ผู้ออกแบบควรตัดสินใจอย่างไร โดยใช้กรอบผลลัพธ์นิยมและหน้าที่นิยมประกอบกัน"
    steps:
      - text: "ระบุผู้มีส่วนได้เสีย ได้แก่ผู้ขับขี่ คนเดินเท้าและเด็กในซอย ทีมพัฒนา และหน่วยงานกำกับ"
        why: "การวิเคราะห์ที่ขาดผู้ได้รับผลกระทบจะให้คำตอบที่ลำเอียงตั้งแต่ต้น"
      - text: "กรอบผลลัพธ์นิยม: รวมเวลาที่ประหยัดได้ของผู้ขับขี่ แล้วเทียบกับความเสี่ยงต่ออุบัติเหตุของคนในซอย"
        why: "ถ้าความเสียหายต่อคนในซอยรุนแรงกว่า ผลรวมอาจไม่คุ้มแม้ประหยัดเวลาได้มาก"
      - text: "กรอบหน้าที่นิยม: ผู้ออกแบบมีหน้าที่ไม่ทำให้คนเดินเท้าเสี่ยงโดยไม่จำเป็น แม้จะเป็นส่วนน้อยของผู้ใช้"
        why: "หน้าที่ไม่ขึ้นกับจำนวนคนที่ได้ประโยชน์"
      - text: "เสนอทางเลือก เช่น แยกการเลือกซอยชุมชนออกจากค่าเริ่มต้น เลือกเส้นทางอื่นในช่วงเวลาที่มีเด็กมาก และบอกผู้ใช้ชัดเจนว่าเส้นทางผ่านพื้นที่ใด"
    answer: "ควรไม่ใช้เส้นทางซอยเป็นค่าเริ่มต้น และให้ทางเลือกที่ปลอดภัยกว่าพร้อมคำอธิบายแก่ผู้ใช้"
  - { type: check, problem: computer.society.computing-ethics.p001, prompt: "ลองนึกถึงกรอบคิดที่ถามว่าอะไรให้ผลรวมดีที่สุด" }
  - type: worked-example
    title: วัดการเข้าถึงของชุมชนด้วยสัดส่วน
    problem: "ชุมชนหนึ่งมี 40 ครัวเรือน และ 25 ครัวเรือนมีอินเทอร์เน็ต แอปต้องการให้ผู้ใช้เข้าถึงผ่านอินเทอร์เน็ตได้ ควรรายงานผลการเข้าถึงอย่างไร"
    steps:
      - text: "คำนวณสัดส่วนที่มีการเข้าถึง: $25 / 40 = 0.625$"
      - text: "แปลงเป็นเปอร์เซ็นต์: $0.625 \\times 100 = 62.5$ เปอร์เซ็นต์"
        why: "การรายงานเป็นเปอร์เซ็นต์ช่วยให้เปรียบเทียบกับชุมชนอื่นได้ง่าย"
      - text: "ครัวเรือนที่ไม่มีการเข้าถึงคือ $40 - 25 = 15$ หลัง ควรรายงานทั้งสองค่าเพื่อให้เห็นขนาดของกลุ่มที่ถูกกันออก"
    answer: "62.5 เปอร์เซ็นต์ของครัวเรือนเข้าถึงได้ และอีก 15 หลังยังถูกกันออก"
  - { type: check, problem: computer.society.computing-ethics.p008, prompt: "ทำไมทีมที่คิดเหมือนกันจึงมองไม่เห็นปัญหาบางอย่าง" }
glossary:
  - { term: ผู้มีส่วนได้เสีย (stakeholder), definition: "บุคคลหรือกลุ่มที่ได้รับผลกระทบจากระบบ ทั้งทางตรงและทางอ้อม รวมทั้งคนที่ไม่ได้ใช้ระบบ" }
  - { term: ผลลัพธ์นิยม (utilitarianism), definition: "กรอบจริยธรรมที่ตัดสินจากผลรวมของประโยชน์และความเสียหายที่เกิดขึ้น" }
  - { term: หน้าที่นิยม (deontology), definition: "กรอบจริยธรรมที่ยึดหน้าที่และกฎที่ยอมรับได้ ไม่ว่าผลรวมจะเป็นอย่างไร" }
  - { term: จรรยาบรรณวิชาชีพ (professional code of ethics), definition: "ชุดหลักการที่องค์กรวิชาชีพกำหนดให้สมาชิกปฏิบัติ เช่นความรับผิดชอบต่อสังคม" }
  - { term: อคติ (bias), definition: "ความลำเอียงของระบบหรือข้อมูลที่ทำให้บางกลุ่มได้ผลลัพธ์แย่กว่าอย่างเป็นระบบ" }
  - { term: ค่านิยมที่แฝงในระบบ (embedded values), definition: "ค่านิยมที่ผู้ออกแบบตัดสินใจไว้ในระบบ เช่นให้ความเร็วหรือความปลอดภัยเป็นอันดับแรก" }
flashcards:
  - { front: "ผลลัพธ์นิยมตัดสินจากอะไร", back: "ผลรวมของประโยชน์และความเสียหายที่เกิดขึ้น" }
  - { front: "หน้าที่นิยมต่างจากผลลัพธ์นิยมอย่างไร", back: "ยึดหน้าที่และกฎ ไม่ใช่แค่ผลรวม" }
  - { front: "ผู้มีส่วนได้เสียทางอ้อมคือใคร", back: "ผู้ที่ได้รับผลกระทบจากระบบโดยไม่ได้ใช้ระบบโดยตรง" }
  - { front: "ทำไมต้องทดสอบแยกตามกลุ่มผู้ใช้", back: "ค่าเฉลี่ยอาจซ่อนกลุ่มที่เดือดร้อนที่สุด" }
