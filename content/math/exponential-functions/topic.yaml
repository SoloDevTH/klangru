id: math.functions.exponential
subject: math
title: { th: ฟังก์ชันเอกซ์โพเนนเชียล, en: Exponential functions }
summary: ฟังก์ชันที่ตัวแปรอยู่ที่เลขชี้กำลัง ใช้อธิบายสิ่งที่เพิ่มหรือลดเป็นเท่าตัวทุกช่วงเวลา เช่น การเพิ่มของแบคทีเรีย ค่าเสื่อมราคา และดอกเบี้ยทบต้น
difficulty: 6
minutes: 35
prerequisites: [math.functions.functions-intro, math.algebra.exponent-laws]
encompasses:
  - { id: math.functions.functions-intro, weight: 0.3 }
  - { id: math.algebra.exponent-laws, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: linear-vs-exponential.svg
    alt: "กราฟสองเส้นบนแกน x ตั้งแต่ 0 ถึง 11 เส้นตรง y = 100x เพิ่มทีละ 100 และเส้นโค้ง y = 2 ยกกำลัง x ที่อยู่ต่ำกว่าเส้นตรงมากในช่วงแรก แล้วพุ่งขึ้นตัดเส้นตรงระหว่าง x = 9 กับ 10 ที่ x = 10 ค่า 1024 มากกว่า 1000"
    caption: "ฟังก์ชันที่ \"คูณ\" ทุกขั้นแซงฟังก์ชันที่ \"บวก\" ทุกขั้นได้เสมอในที่สุด"
  - { type: check, problem: math.ef.p014, prompt: "ดูผลต่างและอัตราส่วนของค่าที่อยู่ติดกัน" }
  - type: worked-example
    title: สร้างฟังก์ชันเอกซ์โพเนนเชียลจากสองจุดที่ไม่มีจุด x = 0
    problem: "ฟังก์ชัน $y = a \\cdot b^x$ ผ่านจุด $(1, 6)$ และ $(3, 54)$ โดย $b > 0$ จงหา $a$ และ $b$"
    steps:
      - text: "แทนจุดทั้งสอง: $a b = 6$ และ $a b^3 = 54$"
      - text: "หารสมการที่สองด้วยสมการแรก: $\\dfrac{a b^3}{a b} = b^2 = \\dfrac{54}{6} = 9$"
        why: "การหารตัด $a$ ทิ้ง เหลือแต่ $b$ ซึ่งเป็นตัวคูณต่อหนึ่งหน่วยของ $x$"
      - text: "$b^2 = 9$ และ $b > 0$ จึงได้ $b = 3$"
        why: "จาก $x = 1$ ไป $x = 3$ คือ 2 ขั้น จึงคูณด้วย $b$ สองครั้ง"
      - text: "แทนกลับ: $3a = 6$ ได้ $a = 2$ จึงได้ $y = 2 \\cdot 3^x$"
      - text: "ตรวจ: $x = 3$ ได้ $2 \\times 27 = 54$ ✓"
    answer: "$a = 2$, $b = 3$ ฟังก์ชันคือ $y = 2 \\cdot 3^x$"
  - type: figure
    src: half-life-decay.svg
    alt: "กราฟการสลายของยาเริ่มที่ 160 มิลลิกรัมเมื่อ t = 0 ลดลงเหลือ 80 ที่ 5 ชั่วโมง 40 ที่ 10 ชั่วโมง 20 ที่ 15 ชั่วโมง และ 10 ที่ 20 ชั่วโมง เส้นโค้งเข้าใกล้แกนนอนแต่ไม่แตะ"
    caption: "ครึ่งชีวิต 5 ชั่วโมง: $M = 160\\left(\\tfrac12\\right)^{t/5}$ ลดลงครึ่งหนึ่งทุก 5 ชั่วโมง แต่ไม่ถึงศูนย์"
  - type: worked-example
    title: เปรียบเทียบแผนเงินฝากเชิงเส้นกับทบต้น
    problem: "แผน ก ให้ดอกเบี้ยปีละ 600 บาทคงที่ (ไม่ทบต้น) แผน ข ให้ดอกเบี้ย 5% ต่อปีทบต้น ฝากเงินต้น 10,000 บาททั้งสองแผน หลัง 10 ปีแผนใดได้เงินมากกว่า และต่างกันเท่าใด"
    steps:
      - text: "แผน ก เป็นเชิงเส้น: $A = 10{,}000 + 600t$ เมื่อ $t = 10$ ได้ $16{,}000$ บาท"
      - text: "แผน ข เป็นเอกซ์โพเนนเชียล: $A = 10{,}000(1.05)^t$ เมื่อ $t = 10$ ได้ $10{,}000 \\times 1.62889 \\approx 16{,}288.95$ บาท"
        why: "$1.05^{10} \\approx 1.62889$ คำนวณด้วยเครื่องคิดเลข"
      - text: "แผน ข ได้มากกว่า $16{,}288.95 - 16{,}000 = 288.95$ บาท"
      - text: "ช่วงแรกแผน ก ได้มากกว่า (ปีแรกได้ 600 บาท ขณะที่แผน ข ได้ 500 บาท) แต่แผน ข ตามทันเพราะดอกเบี้ยคิดจากเงินที่โตขึ้นทุกปี"
        why: "ลองคำนวณที่ $t = 9$: แผน ก $15{,}400$ บาท แผน ข ประมาณ $15{,}513.28$ บาท แผน ข แซงแล้วตั้งแต่ปีที่ 9"
    answer: "แผน ข มากกว่าประมาณ 288.95 บาท"
  - { type: check, problem: math.ef.p015, prompt: "เพิ่ม 10% ต่อเดือนต่างจากเพิ่มเดือนละ 200 คนอย่างไร" }
  - type: interactive
    title: ลองเปลี่ยนค่า a และ b ในกราฟ y = a·bˣ
    caption: "เมื่อ b มากกว่า 1 กราฟเพิ่มขึ้นเร็วขึ้นเรื่อย ๆ (การเติบโต) เมื่อ b อยู่ระหว่าง 0 กับ 1 กราฟลดลงเข้าใกล้แกน x แต่ไม่แตะ (การสลาย) และกราฟตัดแกน y ที่ค่า a เสมอ"
    widget:
      kind: function-plot
      functions: ["a\\cdot b^{x}"]
      sliders:
        - { name: a, min: 0.5, max: 3, step: 0.5, value: 1, label: ค่าเริ่มต้น }
        - { name: b, min: 0.25, max: 3, step: 0.25, value: 2, label: ตัวคูณต่อหนึ่งหน่วย x }
      x: [-4, 4]
      y: [-1, 10]
glossary:
  - { term: ฟังก์ชันเอกซ์โพเนนเชียล, definition: "ฟังก์ชันรูป $f(x) = a \\cdot b^x$ เมื่อ $a \\ne 0$, $b > 0$ และ $b \\ne 1$" }
  - { term: การเติบโตแบบเอกซ์โพเนนเชียล, definition: "การเพิ่มขึ้นเป็นจำนวนเท่าเดิมทุกช่วงเวลาที่เท่ากัน เกิดเมื่อ $b > 1$" }
  - { term: การสลายแบบเอกซ์โพเนนเชียล, definition: "การลดลงเป็นสัดส่วนเท่าเดิมทุกช่วงเวลาที่เท่ากัน เกิดเมื่อ $0 < b < 1$" }
  - { term: ดอกเบี้ยทบต้น, definition: "ดอกเบี้ยที่คิดจากเงินต้นรวมดอกเบี้ยงวดก่อน ๆ เงินรวมคือ $P(1 + r)^n$" }
  - { term: ครึ่งชีวิต, definition: "เวลาที่ปริมาณของสารลดลงเหลือครึ่งหนึ่งของปริมาณเดิม" }
flashcards:
  - { front: "รูปทั่วไปของฟังก์ชันเอกซ์โพเนนเชียล", back: "$f(x) = a \\cdot b^x$ โดย $a$ คือค่าเริ่มต้น ($f(0) = a$) และ $b$ คือตัวคูณต่อหนึ่งหน่วยของ $x$" }
  - { front: "ดูอย่างไรว่าเป็นการเติบโตหรือการสลาย", back: "$b > 1$ เติบโต, $0 < b < 1$ สลาย" }
  - { front: "สูตรดอกเบี้ยทบต้นปีละครั้ง", back: "$A = P(1 + r)^n$ เมื่อ $P$ เงินต้น $r$ อัตราดอกเบี้ยต่อปี $n$ จำนวนปี" }
  - { front: "เพิ่มขึ้น 15% ต่อปี และลดลง 15% ต่อปี ใช้ตัวคูณเท่าใด", back: "เพิ่ม 15% คูณ 1.15 ทุกปี ลด 15% คูณ 0.85 ทุกปี" }
