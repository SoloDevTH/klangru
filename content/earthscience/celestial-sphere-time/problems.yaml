      - { id: b, text: "เฉพาะหัวค่ำทางทิศตะวันตก", feedback: "ดาวที่เห็นเฉพาะหัวค่ำทางตะวันตกอยู่ใกล้ดวงอาทิตย์ทางตะวันออก ดาวที่ตำแหน่งตรงข้ามอยู่ห่างดวงอาทิตย์ 180°" }
      - { id: c, text: "เฉพาะรุ่งเช้าทางทิศตะวันออก", feedback: "ดาวที่เห็นเฉพาะรุ่งเช้าอยู่ทางตะวันตกของดวงอาทิตย์ไม่มาก" }
