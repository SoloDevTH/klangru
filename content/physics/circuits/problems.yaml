      - "หาความต่างศักย์ที่ตกคร่อมตัวต้านทานตัวบนของแต่ละทางด้วยการแบ่งแรงดัน"
      - "ความต่างศักย์ระหว่าง P กับ Q คือผลต่างของความต่างศักย์ที่ตกคร่อมตัวบนของสองทาง"
