problems:
  - id: business.finance.financial-ratios.p001
    topics: [business.finance.financial-ratios]
    difficulty: 1
    type: match
    stem: "จับคู่อัตราส่วนกับกลุ่มที่อัตราส่วนนั้นวัด"
    pairs:
      - { left: "อัตราส่วนทุนหมุนเวียนเร็ว", right: "สภาพคล่อง" }
      - { left: "อัตราการหมุนของลูกหนี้", right: "ประสิทธิภาพในการใช้สินทรัพย์" }
      - { left: "อัตรากำไรสุทธิ", right: "ความสามารถในการทำกำไร" }
      - { left: "อัตราส่วนหนี้สินต่อส่วนของผู้ถือหุ้น", right: "โครงสร้างเงินทุน" }
    hints:
      - "สภาพคล่องเกี่ยวกับหนี้ระยะสั้น ประสิทธิภาพเกี่ยวกับการหมุนของสินทรัพย์"
      - "โครงสร้างเงินทุนเกี่ยวกับการกู้"
    solution: "ทุนหมุนเวียนเร็ว → สภาพคล่อง · อัตราการหมุนของลูกหนี้ → ประสิทธิภาพการใช้สินทรัพย์ · อัตรากำไรสุทธิ → ความสามารถทำกำไร · หนี้สินต่อส่วนของผู้ถือหุ้น → โครงสร้างเงินทุน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.finance.financial-ratios.p002
    topics: [business.finance.financial-ratios]
    difficulty: 2
    type: numeric
    stem: "จากงบในภาพ อัตราส่วนทุนหมุนเวียนของบริษัทข้าวทอง **ปี 2567** เป็นกี่เท่า (ตอบทศนิยม 2 ตำแหน่ง)"
    figure:
      src: statements.svg
      alt: "งบการเงินของบริษัท ข้าวทองแปรรูป จำกัด (สมมติ) หน่วยพันบาท งบแสดงฐานะการเงิน ณ 31 ธ.ค. ปี 2568 และ 2567 ตามลำดับ: เงินสด 300 และ 250 ลูกหนี้การค้า 900 และ 700 สินค้าคงเหลือ 1,200 และ 1,000 รวมสินทรัพย์หมุนเวียน 2,400 และ 1,950 ที่ดิน อาคาร อุปกรณ์สุทธิ 3,600 และ 3,550 รวมสินทรัพย์ 6,000 และ 5,500 เจ้าหนี้การค้า 800 และ 650 เงินกู้ระยะสั้น 400 และ 350 รวมหนี้สินหมุนเวียน 1,200 และ 1,000 เงินกู้ระยะยาว 1,800 และ 1,900 รวมหนี้สิน 3,000 และ 2,900 ส่วนของผู้ถือหุ้น 3,000 และ 2,600 รวมหนี้สินและส่วนของผู้ถือหุ้น 6,000 และ 5,500 งบกำไรขาดทุนปี 2568 และ 2567: ขาย 9,000 และ 8,000 ต้นทุนขาย 6,300 และ 5,440 กำไรขั้นต้น 2,700 และ 2,560 ค่าใช้จ่ายในการขายและบริหาร 1,500 และ 1,400 กำไรก่อนดอกเบี้ยและภาษี 1,200 และ 1,160 ดอกเบี้ยจ่าย 150 และ 160 กำไรก่อนภาษี 1,050 และ 1,000 ภาษีเงินได้ 210 และ 200 กำไรสุทธิ 840 และ 800 ข้อมูลเพิ่มเติมปี 2568: ค่าเสื่อมราคาทั้งปี 300 พันบาท ค่าเฉลี่ยอุตสาหกรรม (สมมติ) อัตราส่วนทุนหมุนเวียน 1.5 เท่า อัตรากำไรสุทธิ 7% หนี้สินต่อสินทรัพย์รวม 60%"
    answer: { value: 1.95, tolerance: 0.01, unit: "เท่า" }
    hints:
      - "ใช้คอลัมน์ปี 2567"
      - "สินทรัพย์หมุนเวียน $\\div$ หนี้สินหมุนเวียน"
    misconceptions:
      - { match: 2, feedback: "นั่นคือปี 2568 โจทย์ถามปี 2567" }
      - { match: 0.51, feedback: "หารกลับด้าน ต้องเป็นสินทรัพย์หมุนเวียน $\\div$ หนี้สินหมุนเวียน" }
    solution: "$1{,}950 \\div 1{,}000 = 1.95$ เท่า (ปี 2568 เท่ากับ $2{,}400 \\div 1{,}200 = 2.00$ เท่า สภาพคล่องดีขึ้นเล็กน้อย)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.finance.financial-ratios.p003
    topics: [business.finance.financial-ratios]
    difficulty: 2
    type: numeric
    stem: "จากงบในภาพ อัตรากำไรขั้นต้นของบริษัทข้าวทองปี 2568 เป็นกี่เปอร์เซ็นต์ (ตอบเป็น %)"
    figure:
      src: statements.svg
      alt: "งบการเงินของบริษัท ข้าวทองแปรรูป จำกัด (สมมติ) หน่วยพันบาท งบแสดงฐานะการเงิน ณ 31 ธ.ค. ปี 2568 และ 2567 ตามลำดับ: เงินสด 300 และ 250 ลูกหนี้การค้า 900 และ 700 สินค้าคงเหลือ 1,200 และ 1,000 รวมสินทรัพย์หมุนเวียน 2,400 และ 1,950 ที่ดิน อาคาร อุปกรณ์สุทธิ 3,600 และ 3,550 รวมสินทรัพย์ 6,000 และ 5,500 เจ้าหนี้การค้า 800 และ 650 เงินกู้ระยะสั้น 400 และ 350 รวมหนี้สินหมุนเวียน 1,200 และ 1,000 เงินกู้ระยะยาว 1,800 และ 1,900 รวมหนี้สิน 3,000 และ 2,900 ส่วนของผู้ถือหุ้น 3,000 และ 2,600 รวมหนี้สินและส่วนของผู้ถือหุ้น 6,000 และ 5,500 งบกำไรขาดทุนปี 2568 และ 2567: ขาย 9,000 และ 8,000 ต้นทุนขาย 6,300 และ 5,440 กำไรขั้นต้น 2,700 และ 2,560 ค่าใช้จ่ายในการขายและบริหาร 1,500 และ 1,400 กำไรก่อนดอกเบี้ยและภาษี 1,200 และ 1,160 ดอกเบี้ยจ่าย 150 และ 160 กำไรก่อนภาษี 1,050 และ 1,000 ภาษีเงินได้ 210 และ 200 กำไรสุทธิ 840 และ 800 ข้อมูลเพิ่มเติมปี 2568: ค่าเสื่อมราคาทั้งปี 300 พันบาท ค่าเฉลี่ยอุตสาหกรรม (สมมติ) อัตราส่วนทุนหมุนเวียน 1.5 เท่า อัตรากำไรสุทธิ 7% หนี้สินต่อสินทรัพย์รวม 60%"
    answer: { value: 30, tolerance: 0.1, unit: "%" }
    hints:
      - "กำไรขั้นต้น $=$ ขาย $-$ ต้นทุนขาย"
      - "หารด้วยยอดขายแล้วคูณ $100$"
    misconceptions:
      - { match: 42.86, feedback: "หารด้วยต้นทุนขาย ($2{,}700 \\div 6{,}300$) อัตรากำไรขั้นต้นต้องหารด้วยยอดขาย" }
      - { match: 9.33, feedback: "นั่นคืออัตรากำไรสุทธิ โจทย์ถามกำไรขั้นต้น" }
    solution: "อัตรากำไรขั้นต้น $= \\dfrac{2{,}700}{9{,}000} \\times 100 = 30\\%$ (ปี 2567 เท่ากับ $32\\%$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.finance.financial-ratios.p004
    topics: [business.finance.financial-ratios]
    difficulty: 2
    type: mcq
    stem: "ธนาคารที่จะให้บริษัทกู้เงินระยะสั้น 3 เดือน ควรให้ความสำคัญกับอัตราส่วนกลุ่มใดเป็นพิเศษ"
    choices:
      - { id: a, text: "สภาพคล่อง เช่น อัตราส่วนทุนหมุนเวียนเร็ว", correct: true }
      - { id: b, text: "ผลตอบแทนผู้ถือหุ้น (ROE)", feedback: "ROE สำคัญกับผู้ถือหุ้น แต่ไม่ได้บอกว่ามีเงินจ่ายหนี้ใน 3 เดือนหรือไม่" }
      - { id: c, text: "อัตราการหมุนของสินทรัพย์รวม", feedback: "บอกประสิทธิภาพการใช้สินทรัพย์ ไม่ใช่ความสามารถจ่ายหนี้ระยะสั้นโดยตรง" }
      - { id: d, text: "อัตราการเติบโตของยอดขาย 5 ปี", feedback: "เป็นข้อมูลระยะยาว เงินกู้ 3 เดือนต้องดูสภาพคล่องตอนนี้" }
    hints:
      - "เงินกู้ระยะสั้นต้องคืนจากเงินที่มีหรือจะได้ในไม่กี่เดือน"
      - "กลุ่มใดวัดความสามารถจ่ายหนี้ระยะสั้น"
    solution: "ผู้ให้กู้ระยะสั้นสนใจว่าบริษัทมีสินทรัพย์ที่เปลี่ยนเป็นเงินสดได้เร็วพอจ่ายหนี้หรือไม่ จึงดู **อัตราส่วนสภาพคล่อง** เช่น ทุนหมุนเวียนและทุนหมุนเวียนเร็ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.finance.financial-ratios.p005
    topics: [business.finance.financial-ratios]
    difficulty: 3
    type: numeric
    stem: "จากงบในภาพ อัตราส่วนทุนหมุนเวียนเร็วของบริษัทข้าวทองปี 2568 เป็นกี่เท่า"
    figure:
      src: statements.svg
      alt: "งบการเงินของบริษัท ข้าวทองแปรรูป จำกัด (สมมติ) หน่วยพันบาท งบแสดงฐานะการเงิน ณ 31 ธ.ค. ปี 2568 และ 2567 ตามลำดับ: เงินสด 300 และ 250 ลูกหนี้การค้า 900 และ 700 สินค้าคงเหลือ 1,200 และ 1,000 รวมสินทรัพย์หมุนเวียน 2,400 และ 1,950 ที่ดิน อาคาร อุปกรณ์สุทธิ 3,600 และ 3,550 รวมสินทรัพย์ 6,000 และ 5,500 เจ้าหนี้การค้า 800 และ 650 เงินกู้ระยะสั้น 400 และ 350 รวมหนี้สินหมุนเวียน 1,200 และ 1,000 เงินกู้ระยะยาว 1,800 และ 1,900 รวมหนี้สิน 3,000 และ 2,900 ส่วนของผู้ถือหุ้น 3,000 และ 2,600 รวมหนี้สินและส่วนของผู้ถือหุ้น 6,000 และ 5,500 งบกำไรขาดทุนปี 2568 และ 2567: ขาย 9,000 และ 8,000 ต้นทุนขาย 6,300 และ 5,440 กำไรขั้นต้น 2,700 และ 2,560 ค่าใช้จ่ายในการขายและบริหาร 1,500 และ 1,400 กำไรก่อนดอกเบี้ยและภาษี 1,200 และ 1,160 ดอกเบี้ยจ่าย 150 และ 160 กำไรก่อนภาษี 1,050 และ 1,000 ภาษีเงินได้ 210 และ 200 กำไรสุทธิ 840 และ 800 ข้อมูลเพิ่มเติมปี 2568: ค่าเสื่อมราคาทั้งปี 300 พันบาท ค่าเฉลี่ยอุตสาหกรรม (สมมติ) อัตราส่วนทุนหมุนเวียน 1.5 เท่า อัตรากำไรสุทธิ 7% หนี้สินต่อสินทรัพย์รวม 60%"
    answer: { value: 1, tolerance: 0.01, unit: "เท่า" }
    hints:
      - "ตัดสินค้าคงเหลือออกจากสินทรัพย์หมุนเวียน"
      - "หารด้วยหนี้สินหมุนเวียน"
    misconceptions:
      - { match: 2, feedback: "ยังไม่ได้ตัดสินค้าคงเหลือ นั่นคืออัตราส่วนทุนหมุนเวียน" }
      - { match: 0.25, feedback: "ใช้แค่เงินสด ($300 \\div 1{,}200$) อัตราส่วนเร็วรวมลูกหนี้ด้วย" }
    solution: "$\\dfrac{2{,}400 - 1{,}200}{1{,}200} = \\dfrac{1{,}200}{1{,}200} = 1.00$ เท่า แม้อัตราส่วนทุนหมุนเวียนเป็น $2$ เท่า แต่ครึ่งหนึ่งของสินทรัพย์หมุนเวียนเป็นสินค้าคงเหลือ"
    license: CC-BY-SA-4.0
    ai_assisted: true

