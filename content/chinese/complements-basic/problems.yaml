- id: chinese.grammar.complements-basic.p014
  topics:
  - chinese.grammar.complements-basic
  difficulty: 4
  type: mcq
  stem: '"เขาเดินเข้ามาในห้องเรียน" (教室 jiàoshì = ห้องเรียน) ประโยคใดถูกต้อง'
  choices:
  - id: a
    text: 他走进来教室了。
    feedback: สถานที่ห้ามวางหลัง 来/去
  - id: b
    text: 他走教室进来了。
    feedback: ทิศ 进 ต้องติดหลังกริยา 走
  - id: c
    text: 他进来走教室了。
    feedback: กริยาหลัก 走 ต้องมาก่อนส่วนเติมเต็ม
  - id: d
    text: 他走进教室来了。
    correct: true
    feedback: ถูก สถานที่วางระหว่าง 进 กับ 来
  hints:
  - 'รูป: กริยา + ทิศ + สถานที่ + 来/去'
  - กรรมที่เป็นสถานที่ต้องอยู่ก่อน 来
  solution: '**他走进教室来了。** Tā zǒu jìn jiàoshì lai le.'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.complements-basic.p015
  topics:
  - chinese.grammar.complements-basic
  difficulty: 5
  type: mcq
  stem: ประโยคใด **ผิด** (เลือกทุกข้อที่ผิด)
  multiple: true
