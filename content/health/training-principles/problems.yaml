problems:
- id: health.fitness.training-principles.p001
  topics:
  - health.fitness.training-principles
  difficulty: 1
  type: match
  stem: จับคู่ตัวอักษรในหลัก FITT กับความหมาย
  pairs:
  - left: F
    right: ความบ่อย กี่วันต่อสัปดาห์
  - left: I
    right: ความหนัก
  - left: T ตัวแรก (Time)
    right: ระยะเวลาต่อครั้ง
  - left: T ตัวที่สอง (Type)
    right: ชนิดของกิจกรรม
  hints:
  - F มาจาก Frequency
  - Time คือเวลา ส่วน Type คือชนิด
  solution: F = Frequency ความบ่อย, I = Intensity ความหนัก, T = Time ระยะเวลา, T = Type ชนิดของกิจกรรม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.fitness.training-principles.p002
  topics:
  - health.fitness.training-principles
  difficulty: 1
  type: mcq
  stem: ข้อใดคือจุดประสงค์หลักของการอบอุ่นร่างกายก่อนออกกำลังกาย
  choices:
  - id: a
    text: ให้หัวใจเต้นเร็วขึ้นทีละน้อยและให้กล้ามเนื้อกับข้อต่อพร้อม ลดโอกาสบาดเจ็บ
    correct: true
  - id: b
    text: ทำให้เหนื่อยมากที่สุดตั้งแต่ต้น
    feedback: การอบอุ่นต้องเบาและค่อยเพิ่ม ไม่ใช่หักโหม
  - id: c
    text: ใช้แทนการคลายอุ่นได้
    feedback: คลายอุ่นทำหลังฝึก ช่วยให้หัวใจกลับสู่ปกติ
  - id: d
    text: ช่วยให้ไม่ต้องดื่มน้ำระหว่างฝึก
    feedback: ยังต้องดื่มน้ำตามปกติ
  hints:
  - นึกถึงร่างกายที่เพิ่งตื่นจากการนั่งเรียน
  - ค่อย ๆ เพิ่มความหนัก
  solution: การอบอุ่นร่างกาย 5–10 นาทีเตรียมหัวใจ ปอด กล้ามเนื้อ และข้อต่อให้พร้อม จึงลดโอกาสบาดเจ็บ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.fitness.training-principles.p003
  topics:
  - health.fitness.training-principles
  difficulty: 2
  type: numeric
  stem: ใช้สูตรประมาณ $\text{HR}_{\max} \approx 220 - \text{อายุ}$ นักเรียนอายุ 13 ปีมีอัตราการเต้นของหัวใจสูงสุดโดยประมาณกี่ครั้งต่อนาที
  answer:
    value: 207
    unit: ครั้ง/นาที
  misconceptions:
  - match: 233
    feedback: ต้องลบอายุ ไม่ใช่บวก
  - match: 220
    feedback: ลืมลบอายุ
  hints:
  - แทนอายุลงในสูตร
  - 220 ลบ 13
  solution: $220 - 13 = 207$ ครั้ง/นาที เป็นค่าประมาณ ค่าจริงของแต่ละคนอาจต่างได้มากกว่า 10 ครั้ง/นาที
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.fitness.training-principles.p004
  topics:
  - health.fitness.training-principles
  difficulty: 2
  type: mcq
  stem: ต้นอยากว่ายน้ำได้นานขึ้นในการแข่งขันว่ายน้ำ 400 เมตรของโรงเรียน แต่ฝึกแค่ยกดัมเบลทุกวัน ต้นขาดหลักการฝึกข้อใดมากที่สุด
  choices:
  - id: a
    text: หลักความเฉพาะเจาะจง
    correct: true
  - id: b
    text: หลักการพักฟื้น
    feedback: ปัญหาหลักคือชนิดการฝึกไม่ตรงเป้าหมาย
  - id: c
    text: หลักการคืนกลับ
    feedback: หลักนี้พูดถึงการหยุดฝึกแล้วสมรรถภาพลดลง
  - id: d
    text: หลักความแตกต่างระหว่างบุคคล
    feedback: ไม่ได้เกี่ยวกับการเปรียบเทียบกับคนอื่น
  hints:
  - ดู T ตัวที่สองในหลัก FITT
  - อยากเก่งอะไรต้องฝึกสิ่งนั้น
  solution: การฝึกต้องตรงกับเป้าหมาย อยากว่ายน้ำได้นานต้องฝึกว่ายน้ำหรือกิจกรรมความอดทนของหัวใจและปอด นี่คือหลักความเฉพาะเจาะจง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.fitness.training-principles.p005
  topics:
  - health.fitness.training-principles
  difficulty: 2
  type: mcq
  stem: ระหว่างปั่นจักรยาน ฝนยังคุยกับเพื่อนเป็นประโยคได้ แต่ร้องเพลงไม่ไหว ตามการทดสอบการพูดของ CDC ฝนกำลังออกกำลังกายระดับใด
  choices:
  - id: a
    text: ปานกลาง
    correct: true
  - id: b
    text: เบามาก
    feedback: ถ้าเบามากจะร้องเพลงได้สบาย
  - id: c
    text: หนัก
    feedback: ระดับหนักพูดได้ไม่กี่คำก็ต้องหยุดหายใจ
  - id: d
    text: หนักที่สุด
    feedback: ระดับนี้พูดแทบไม่ได้เลย
  hints:
  - พูดได้แต่ร้องเพลงไม่ได้
  - ระดับหนักพูดได้แค่ไม่กี่คำ
  solution: พูดได้แต่ร้องเพลงไม่ได้คือระดับปานกลาง ตรงกับคะแนนความเหนื่อยราว 5–6 จาก 10
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.fitness.training-principles.p006
  topics:
  - health.fitness.training-principles
  difficulty: 2
  type: text
  stem: หลักการฝึกที่อธิบายว่า "ถ้าหยุดฝึกนาน สมรรถภาพที่ได้จะค่อย ๆ ลดลง" เรียกว่าหลักอะไร (ตอบชื่อหลักภาษาไทย)
  accepted:
  - หลักการคืนกลับ
  - การคืนกลับ
  - คืนกลับ
  - หลักการย้อนกลับ
  - reversibility
  misconceptions:
  - match: หลักความก้าวหน้า
    feedback: หลักความก้าวหน้าคือการค่อย ๆ เพิ่มความหนัก
  hints:
  - คำภาษาอังกฤษคือ reversibility
  - สมรรถภาพกลับคืนสู่ระดับเดิม
  solution: หลักการคืนกลับ (reversibility) จึงควรฝึกสม่ำเสมอ และถ้าต้องหยุดเพราะป่วย ให้กลับมาเริ่มที่ความหนักต่ำกว่าเดิมเล็กน้อย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.fitness.training-principles.p007
  topics:
  - health.fitness.training-principles
  difficulty: 3
  type: numeric
  stem: แพร อายุ 16 ปี ต้องการฝึกที่ขอบล่างของช่วงเป้าหมาย คือ 65% ของอัตราการเต้นของหัวใจสูงสุดโดยประมาณ ($220 - \text{อายุ}$) ชีพจรเป้าหมายคือกี่ครั้งต่อนาที (ตอบทศนิยม 1 ตำแหน่ง)
  answer:
    value: 132.6
    tolerance: 1
    unit: ครั้ง/นาที
  misconceptions:
  - match: 143.0
    feedback: ลืมลบอายุก่อนคูณ
  - match: 173.4
    feedback: นี่คือขอบบน 85%
  hints:
  - 'หาค่าสูงสุดก่อน: 220 − 16'
  - คูณด้วย 0.65
  solution: ค่าสูงสุด $220 - 16 = 204$ ครั้ง/นาที ขอบล่าง $0.65 \times 204 = 132.6$ ครั้ง/นาที
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.fitness.training-principles.p008
  topics:
  - health.fitness.training-principles
  difficulty: 3
  type: numeric
  stem: ภูมิ อายุ 15 ปี วัดชีพจรขณะพักตอนเช้าได้ 70 ครั้ง/นาที ใช้วิธีของคาร์โวเนนที่ความหนัก 60% ชีพจรเป้าหมายคือกี่ครั้งต่อนาที
  answer:
    value: 151.0
    tolerance: 1
    unit: ครั้ง/นาที
  misconceptions:
  - match: 81
    feedback: ลืมบวกชีพจรขณะพักกลับเข้าไป
  - match: 123
    feedback: นี่คือ 60% ของค่าสูงสุดโดยตรง ไม่ใช่วิธีของคาร์โวเนน
  hints:
  - ค่าสูงสุด = 220 − 15 จากนั้นหาส่วนต่างกับชีพจรขณะพัก
  - นำส่วนต่างคูณ 0.6 แล้วบวกชีพจรขณะพักกลับเข้าไป
  solution: $\text{HR}_{\max} = 205$, ส่วนต่าง $205 - 70 = 135$, $135 \times 0.6 = 81$, $81 + 70 = 151$ ครั้ง/นาที
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.fitness.training-principles.p009
  topics:
  - health.fitness.training-principles
  difficulty: 3
  type: order
  stem: เรียงลำดับกิจกรรมในการฝึกวิ่งหนึ่งครั้งให้ถูกต้อง
  items:
  - เดินเร็ว 5 นาที
  - ยืดเหยียดแบบเคลื่อนไหว เช่น แกว่งขา หมุนแขน
  - วิ่งเหยาะตามแผน 25 นาที
  - เดินช้าลง 5 นาที
  - ยืดเหยียดค้างไว้ข้างละ 15–30 วินาที
  hints:
  - เริ่มเบาและจบเบา
  - การยืดเหยียดค้างไว้นาน ๆ เหมาะกับช่วงท้าย
  solution: อบอุ่นร่างกาย (เดินเร็ว → ยืดแบบเคลื่อนไหว) → ช่วงฝึกหลัก (วิ่งเหยาะ) → คลายอุ่น (เดินช้าลง → ยืดค้าง)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.fitness.training-principles.p010
  topics:
  - health.fitness.training-principles
  difficulty: 3
  type: mcq
  stem: ดูกราฟบันทึกผลดันพื้นของภูมิ ผลที่ลดลงจาก 26 เป็น 23 ครั้งในสัปดาห์ที่ 8 อธิบายด้วยหลักการฝึกข้อใด
  choices:
  - id: a
    text: หลักการคืนกลับ เพราะหยุดฝึก 2 สัปดาห์
    correct: true
  - id: b
    text: หลักความก้าวหน้า
    feedback: ความก้าวหน้าอธิบายช่วงที่ผลเพิ่มขึ้นจากการค่อย ๆ เพิ่มงาน
  - id: c
    text: หลักความเฉพาะเจาะจง
    feedback: ภูมิยังฝึกท่าเดิม ปัญหาคือหยุดฝึก
  - id: d
    text: ภูมิทดสอบผิดวิธี
    feedback: กราฟบอกเหตุชัดเจนว่าหยุดฝึกเพราะป่วย
  hints:
  - ดูช่วงที่แรเงาในกราฟ
  - หยุดฝึกแล้วสมรรถภาพเป็นอย่างไร
  solution: ช่วงสัปดาห์ 6–8 ภูมิป่วยและหยุดฝึก ผลจึงลดลงตามหลักการคืนกลับ เมื่อกลับมาฝึกอีกสองสัปดาห์ผลก็เพิ่มเป็น 27 ครั้ง
  figure: &id001
    src: progress-log.svg
    alt: กราฟเส้นบันทึกผลดันพื้น 30 วินาทีของภูมิ ข้อมูลสมมติ แกนนอนคือสัปดาห์ที่ 0 ถึง 10 แกนตั้งคือจำนวนครั้ง สัปดาห์ 0 ได้ 18 ครั้ง สัปดาห์ 2 ได้ 20 สัปดาห์ 4 ได้ 23 สัปดาห์ 6 ได้ 26 ช่วงสัปดาห์ 6 ถึง 8 แรเงาเขียนว่าป่วย หยุดฝึก 2 สัปดาห์ สัปดาห์ 8 ได้ 23 สัปดาห์ 10 ได้ 27
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.fitness.training-principles.p011
  topics:
  - health.fitness.training-principles
  difficulty: 3
  type: numeric
  stem: จากกราฟบันทึกผลดันพื้นของภูมิ ผลสัปดาห์ที่ 10 เพิ่มขึ้นจากสัปดาห์ที่ 0 กี่เปอร์เซ็นต์
  answer:
    value: 50.0
    tolerance: 0.5
    unit: '%'
  misconceptions:
  - match: 9
    feedback: นี่คือจำนวนครั้งที่เพิ่ม ยังไม่ได้คิดเป็นร้อยละ
  - match: 33.3
    feedback: ต้องหารด้วยผลเดิม 18 ไม่ใช่ผลใหม่ 27
  hints:
  - ใช้ (ผลใหม่ − ผลเดิม) ÷ ผลเดิม × 100
  - ผลเดิมคือ 18 ผลใหม่คือ 27
  solution: $\frac{27 - 18}{18} \times 100 = 50\%$
  figure: *id001
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.fitness.training-principles.p012
  topics:
  - health.fitness.training-principles
  difficulty: 4
  type: numeric
  stem: แบมวางแผนกิจกรรมทางกายระดับปานกลางถึงหนักในหนึ่งสัปดาห์ จันทร์ 45 นาที อังคาร 60 พุธ 30 พฤหัสบดี 60 ศุกร์ 45 เสาร์ 90 อาทิตย์พัก ถ้าเทียบกับคำแนะนำของ WHO ที่เฉลี่ยวันละ 60 นาที แผนนี้ยังขาดอีกกี่นาทีต่อสัปดาห์
  answer:
    value: 90
    unit: นาที
  misconceptions:
  - match: 330
    feedback: นี่คือเวลารวมตามแผน คำถามถามส่วนที่ขาด
  - match: 30
    feedback: สัปดาห์มี 7 วัน คำแนะนำรวมคือ 420 นาที
  hints:
  - คำแนะนำรวมทั้งสัปดาห์คือ 60 × 7
  - รวมเวลาตามแผนแล้วนำไปลบ
  solution: คำแนะนำ $60 \times 7 = 420$ นาที แผนรวม $45 + 60 + 30 + 60 + 45 + 90 = 330$ นาที ยังขาด $420 - 330 = 90$ นาที อาจเพิ่มการเดินหรือปั่นจักรยานไปโรงเรียนในวันพุธและวันอาทิตย์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.fitness.training-principles.p013
  topics:
  - health.fitness.training-principles
  difficulty: 4
  type: match
  stem: จับคู่ผลของการออกกำลังกายเป็นประจำกับด้านที่ได้รับผล
  pairs:
  - left: หัวใจและปอดแข็งแรง ควบคุมน้ำหนักได้
    right: ร่างกาย
  - left: คลายเครียด อารมณ์แจ่มใส
    right: อารมณ์
  - left: ภูมิใจในตนเองที่ทำตามเป้าหมายได้
    right: จิตใจ
  - left: มีเพื่อนใหม่จากทีมกีฬาและเคารพกติกา
    right: สังคม
  - left: มีสมาธิในการเรียนดีขึ้น วางแผนเป็น
    right: สติปัญญา
  hints:
  - อารมณ์คือความรู้สึก จิตใจเกี่ยวกับความคิดต่อตัวเอง
  - สังคมเกี่ยวกับความสัมพันธ์กับคนอื่น
  solution: 'ร่างกาย: หัวใจปอดแข็งแรง อารมณ์: คลายเครียด จิตใจ: ภูมิใจในตนเอง สังคม: มีเพื่อนและเคารพกติกา สติปัญญา: สมาธิและการวางแผน'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.fitness.training-principles.p014
  topics:
  - health.fitness.training-principles
  difficulty: 4
  type: mcq
  stem: ฟ้าวิ่งเหยาะสัปดาห์ละ 3 วัน วันละ 20 นาทีมาได้ 2 สัปดาห์ ตอนนี้รู้สึกสบาย ให้คะแนนความเหนื่อยแค่ 4 จาก 10 ตามหลักความก้าวหน้า ขั้นต่อไปที่เหมาะสมที่สุดคือข้อใด
  choices:
  - id: a
    text: เพิ่มเวลาเป็นวันละ 25 นาที โดยยังวิ่ง 3 วันเท่าเดิม
    correct: true
  - id: b
    text: เพิ่มเป็นทุกวัน วันละ 60 นาที และวิ่งเร็วขึ้น
    feedback: เพิ่มหลายอย่างพร้อมกันมากเกินไป เสี่ยงบาดเจ็บ
  - id: c
    text: วิ่งแบบเดิมต่อไปตลอด
    feedback: ถ้าไม่เพิ่มงานเลย สมรรถภาพจะหยุดพัฒนา
  - id: d
    text: หยุดวิ่งเพราะสบายแล้วแปลว่าแข็งแรงพอ
