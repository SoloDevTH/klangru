- id: business.econ.inflation-unemployment.p016
  topics:
  - business.econ.inflation-unemployment
  difficulty: 5
  type: numeric
  stem: ดัชนีราคาผู้บริโภคเพิ่มจาก $100$ ในปีฐานเป็น $125$ ในปีนี้ เงิน $1{,}000$ บาทในปีนี้ซื้อของได้เท่ากับเงินกี่บาทในปีฐาน (ตอบเป็นบาท)
  answer:
    value: 800
    unit: บาท
  misconceptions:
  - match: 750
    feedback: ลบ 25% ออกจาก 1,000 บาท แต่ต้องหารด้วยระดับราคา 1.25
  - match: 1250
    feedback: คูณแทนการหาร
  hints:
  - ระดับราคาสูงขึ้นเป็น $1.25$ เท่าของปีฐาน
  - หารด้วย $1.25$ ไม่ใช่ลบ $25\%$
  solution: $1{,}000 \times \dfrac{100}{125} = 800$ บาทของปีฐาน อำนาจซื้อลดลง $20\%$
