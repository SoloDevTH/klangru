copyright: "สิ่งพิมพ์ของสถาบันเพิ่มผลผลิตแห่งชาติ (มูลนิธิภายใต้การกำกับของกระทรวงอุตสาหกรรม ไม่ใช่ประกาศของหน่วยงานรัฐตาม พ.ร.บ.ลิขสิทธิ์ มาตรา 7) อิงเกณฑ์ Baldrige 2023-2024 ไม่พบสัญญาอนุญาตให้นำไปใช้ซ้ำ จึงถือว่าสงวนลิขสิทธิ์ ไฟล์นี้เก็บเฉพาะรหัสหัวข้อ ชื่อหัวข้อ คะแนน และสรุปด้วยคำของคลังรู้ ใช้เป็นลิงก์อ้างอิงเท่านั้น"
completeness: structure-and-summary
strands:
  - id: "1"
    title: หมวด 1 การนำองค์กร (110 คะแนน)
    standards:
      - id: "1"
        text: "ผู้นำระดับสูงกำหนดทิศทางและดูแลองค์กร (สรุปความ)"
        indicators:
          - { id: "1.1", text: "การนำองค์กรโดยผู้นำระดับสูง (60): ผู้นำวางวิสัยทัศน์และค่านิยม สื่อสารสองทางกับบุคลากร สร้างสภาพแวดล้อมที่มุ่งความสำเร็จ นวัตกรรม และผลการดำเนินการ" }
          - { id: "1.2", text: "การกำกับดูแลและการตอบแทนสังคม (50): ระบบกำกับดูแลที่โปร่งใสและตรวจสอบได้ การทำตามกฎหมายและจริยธรรม และการสร้างประโยชน์ต่อสังคมและชุมชน" }
  - id: "2"
    title: หมวด 2 กลยุทธ์ (95 คะแนน)
    standards:
      - id: "2"
        text: "การจัดทำและนำกลยุทธ์ไปปฏิบัติ (สรุปความ)"
        indicators:
          - { id: "2.1", text: "การจัดทำกลยุทธ์ (45): กระบวนการวางแผนเชิงกลยุทธ์ การวิเคราะห์สภาพแวดล้อม ความท้าทายและความได้เปรียบ การกำหนดวัตถุประสงค์เชิงกลยุทธ์และกรอบเวลา" }
          - { id: "2.2", text: "การนำกลยุทธ์ไปปฏิบัติ (50): แปลงกลยุทธ์เป็นแผนปฏิบัติการ จัดสรรทรัพยากร กำหนดตัวชี้วัดและค่าคาดการณ์ และปรับแผนเมื่อสถานการณ์เปลี่ยน" }
  - id: "3"
    title: หมวด 3 ลูกค้า (95 คะแนน)
    standards:
      - id: "3"
        text: "การฟังเสียงและสร้างความผูกพันกับลูกค้า (สรุปความ)"
        indicators:
          - { id: "3.1", text: "ความคาดหวังของลูกค้า (45): รับฟังเสียงลูกค้าปัจจุบันและลูกค้าที่มีศักยภาพ จำแนกกลุ่มลูกค้า และกำหนดผลิตภัณฑ์และบริการให้ตรงความต้องการ" }
          - { id: "3.2", text: "ความผูกพันของลูกค้า (50): สร้างความสัมพันธ์ จัดการข้อร้องเรียน และวัดความพึงพอใจ ความไม่พึงพอใจ และความผูกพันของลูกค้า" }
  - id: "4"
    title: หมวด 4 การวัด การวิเคราะห์ และการจัดการความรู้ (100 คะแนน)
    standards:
      - id: "4"
        text: "การใช้ข้อมูลและความรู้บริหารองค์กร (สรุปความ)"
        indicators:
          - { id: "4.1", text: "การวัด การวิเคราะห์ และการปรับปรุงผลการดำเนินการขององค์กร (50): เลือกตัววัดและข้อมูลเชิงเปรียบเทียบ ทบทวนผลการดำเนินการ และใช้ผลทบทวนกำหนดสิ่งที่ต้องปรับปรุงและนวัตกรรม" }
          - { id: "4.2", text: "การจัดการสารสนเทศ และการจัดการความรู้ (50): ดูแลคุณภาพและความพร้อมใช้ของข้อมูลและสารสนเทศ รวบรวมและถ่ายทอดความรู้ขององค์กร และเรียนรู้ระดับองค์กร" }
  - id: "5"
    title: หมวด 5 บุคลากร (100 คะแนน)
    standards:
      - id: "5"
        text: "การดูแลและพัฒนาบุคลากร (สรุปความ)"
        indicators:
          - { id: "5.1", text: "สภาพแวดล้อมของบุคลากร (45): ประเมินขีดความสามารถและอัตรากำลัง จัดการการเปลี่ยนแปลงของกำลังคน ดูแลสุขภาพ ความปลอดภัย และสวัสดิการ" }
          - { id: "5.2", text: "ความผูกพันของบุคลากร (55): วัฒนธรรมองค์กร ปัจจัยที่ทำให้บุคลากรผูกพัน การจัดการผลการปฏิบัติงาน การเรียนรู้ การพัฒนาผู้นำ และความก้าวหน้าในอาชีพ" }
  - id: "6"
    title: หมวด 6 การปฏิบัติการ (100 คะแนน)
    standards:
      - id: "6"
        text: "การออกแบบและจัดการกระบวนการทำงาน (สรุปความ)"
        indicators:
          - { id: "6.1", text: "กระบวนการทำงาน (50): ออกแบบผลิตภัณฑ์และกระบวนการ จัดการและปรับปรุงกระบวนการ จัดการเครือข่ายอุปทาน และจัดการนวัตกรรม" }
          - { id: "6.2", text: "ประสิทธิผลของการปฏิบัติการ (50): ควบคุมต้นทุนและประสิทธิภาพของกระบวนการ ความมั่นคงปลอดภัยของสารสนเทศและไซเบอร์ ความปลอดภัยในที่ทำงาน และความต่อเนื่องเมื่อเกิดภาวะฉุกเฉิน" }
  - id: "7"
    title: หมวด 7 ผลลัพธ์ (400 คะแนน)
    standards:
      - id: "7"
        text: "ผลการดำเนินการและแนวโน้มเทียบคู่เปรียบเทียบ (สรุปความ)"
        indicators:
          - { id: "7.1", text: "ผลลัพธ์ด้านผลิตภัณฑ์และกระบวนการ (110): ผลด้านคุณภาพผลิตภัณฑ์และบริการ ประสิทธิภาพและประสิทธิผลของกระบวนการ เครือข่ายอุปทาน และความปลอดภัย" }
          - { id: "7.2", text: "ผลลัพธ์ด้านลูกค้า (75): ความพึงพอใจ ความไม่พึงพอใจ และความผูกพันของลูกค้าแยกตามกลุ่ม" }
          - { id: "7.3", text: "ผลลัพธ์ด้านบุคลากร (70): ขีดความสามารถ อัตรากำลัง สภาพแวดล้อมการทำงาน ความผูกพัน และการพัฒนาบุคลากรและผู้นำ" }
          - { id: "7.4", text: "ผลลัพธ์ด้านการนำองค์กรและการกำกับดูแลองค์กร (65): การสื่อสารของผู้นำ ความรับผิดชอบในการกำกับดูแล การทำตามกฎหมายและจริยธรรม และการตอบแทนสังคม" }
          - { id: "7.5", text: "ผลลัพธ์ด้านการเงิน ตลาด และกลยุทธ์ (80): ผลด้านการเงินและงบประมาณ ส่วนแบ่งตลาด และความสำเร็จของกลยุทธ์" }
