- id: health.fitness.active-lifestyle.p017
  topics:
  - health.fitness.active-lifestyle
  difficulty: 5
  type: numeric
  stem: วันแรกของสัปดาห์ทำกิจกรรมได้ 35 นาที ต้องการให้เฉลี่ยทั้ง 7 วันได้ 60 นาทีต่อวัน อีก 6 วันที่เหลือต้องทำเฉลี่ยวันละกี่นาที (ตอบทศนิยม 1 ตำแหน่ง)
  answer:
    value: 64.167
    tolerance: 0.05
    unit: นาที
  misconceptions:
  - match: 60
    feedback: นั่นคือเป้าต่อวัน แต่วันแรกทำไปแล้ว 35 นาที จึงต้องคิดส่วนที่เหลือใหม่
  hints:
  - เป้าทั้งสัปดาห์คือ 60 × 7 นาที
  - หักเวลาวันแรกออกก่อน แล้วหารด้วย 6 วัน
  solution: เป้าทั้งสัปดาห์ = 60 × 7 = 420 นาที ที่เหลือ = 420 − 35 = 385 นาที เฉลี่ยวันละ 385 ÷ 6 ≈ 64.2 นาที
