id: chinese.hanzi.basic-strokes
subject: chinese
title: { th: ขีดพื้นฐานและลำดับการเขียนอักษรจีน, en: Basic strokes and stroke order }
summary: อักษรจีนทุกตัวประกอบจากขีดพื้นฐานไม่กี่แบบ และเขียนตามกฎลำดับขีด เช่น บนลงล่าง ซ้ายไปขวา นอกก่อนใน ฝึกกับ 人 大 口
difficulty: 1.5
minutes: 25
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - type: figure
    src: basic-strokes.svg
    alt: "ขีดพื้นฐาน 8 แบบในตาราง 田字格 แต่ละช่องมีจุดแดงบอกจุดเริ่มและลูกศรบอกทิศ: 横 héng ขีดนอนจากซ้ายไปขวา, 竖 shù ขีดตั้งจากบนลงล่าง, 撇 piě ตวัดจากขวาบนลงซ้ายล่าง, 捺 nà ลากจากซ้ายบนลงขวาล่าง, 点 diǎn จุดสั้นเฉียงลงขวา, 提 tí ตวัดจากซ้ายล่างขึ้นขวาบน, 横折 héngzhé ลากนอนแล้วหักลงในครั้งเดียว, 竖钩 shùgōu ลากลงแล้วเกี่ยวไปทางซ้าย"
    caption: "ขีดพื้นฐานและทิศทางการลาก สังเกตว่ามีเพียง 提 ที่ลากขึ้น"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: stroke-order-tian.svg
    alt: "ลำดับขีดของ 天 tiān สี่ช่องต่อกัน ขีดที่ 1 ขีดนอนสั้นด้านบนลากซ้ายไปขวา ขีดที่ 2 ขีดนอนยาวด้านล่างลากซ้ายไปขวา ขีดที่ 3 撇 เริ่มที่กลางขีดนอนบน ลงผ่านขีดนอนยาวแล้วตวัดลงซ้าย ขีดที่ 4 捺 เริ่มจากจุดตัดกลางลากลงขวา ขีดที่เขียนแล้วเป็นสีเทา"
    caption: "天 เขียนขีดนอนจากบนลงล่างก่อน แล้ว 撇 ก่อน 捺"
  - type: worked-example
    title: นับขีดและเรียงลำดับขีดของ 王
    problem: "อักษร 王 มีกี่ขีด และเขียนตามลำดับอย่างไร"
    steps:
      - text: "王 ประกอบด้วยขีดนอน 3 ขีดกับขีดตั้ง 1 ขีด ไม่มีขีดหักมุม จึงมี 4 ขีด"
      - text: "ขีดนอนบนสุดเขียนก่อน (บนลงล่าง) ตามด้วยขีดนอนกลาง"
        why: "ขีดตั้งตัดผ่านขีดนอนทั้งสองนี้ จึงใช้กฎ 横 ก่อน 竖"
      - text: "เขียนขีดตั้งจากบนลงล่าง"
      - text: "ขีดนอนล่างสุดเป็นขีดสุดท้าย เพราะเป็นฐานรองรับขีดตั้ง"
    answer: "4 ขีด: 横 (บน) → 横 (กลาง) → 竖 → 横 (ล่าง)"
  - { type: check, problem: zh.stroke.p016, prompt: "ลองนับขีดของอักษรอีกตัว" }
  - type: worked-example
    title: ลำดับขีดของ 国 ซึ่งใช้หลายกฎพร้อมกัน
    problem: "เขียนลำดับขีดของ 国 (guó ประเทศ) และบอกว่าแต่ละช่วงใช้กฎข้อใด"
    steps:
      - text: "เริ่มที่กรอบ 囗: ขีดตั้งด้านซ้าย แล้ว 横折 ด้านบนหักลงเป็นด้านขวา"
        why: "นอกก่อนใน และนับ 横折 เป็นขีดเดียว"
      - text: "เขียน 王 ข้างใน: 横 → 横 → 竖 → 横"
        why: "บนลงล่าง และ 横 ก่อน 竖"
      - text: "เติมจุดที่มุมขวาล่างของ 王 ให้เป็น 玉"
      - text: "ปิดกรอบด้วยขีดนอนล่างเป็นขีดสุดท้าย"
        why: "เข้าบ้านก่อนปิดประตู"
      - text: "นับรวม: กรอบ 3 ขีด + 玉 5 ขีด = 8 ขีด"
    answer: "竖 → 横折 → 横 → 横 → 竖 → 横 → 点 → 横 (8 ขีด)"
  - { type: check, problem: zh.stroke.p018, prompt: "ใช้กฎนอกก่อนในกับ 月" }
glossary:
  - { term: ขีด (笔画 bǐhuà), definition: เส้นที่ลากต่อเนื่องโดยไม่ยกปากกา เป็นหน่วยเล็กที่สุดของการเขียนอักษรจีน }
  - { term: ลำดับขีด (笔顺 bǐshùn), definition: ลำดับและทิศทางมาตรฐานในการเขียนขีดแต่ละขีดของอักษรตัวหนึ่ง }
  - { term: 横折 héngzhé, definition: ขีดนอนที่หักลงที่มุมขวาโดยไม่ยกปากกา นับเป็น 1 ขีด เช่น มุมขวาบนของ 口 }
flashcards:
  - { front: "横 竖 撇 捺 点 คือขีดแบบใด", back: "横 ขีดนอน (ซ้าย→ขวา) · 竖 ขีดตั้ง (บน→ล่าง) · 撇 ตวัดลงซ้าย · 捺 ลากลงขวา · 点 จุด" }
  - { front: "ลำดับขีดของ 人 และ 大", back: "人: 撇 แล้ว 捺 · 大: 横 撇 捺" }
  - { front: "口 มีกี่ขีด เขียนอย่างไร", back: "3 ขีด: 竖 (ซ้าย) → 横折 (บนแล้วหักลงขวา) → 横 (ล่าง ปิดกรอบ)" }
  - { front: "กฎ \"เข้าบ้านก่อนปิดประตู\" ใช้กับอักษรแบบใด", back: "อักษรที่มีกรอบล้อม เช่น 日 回 เขียนกรอบด้านซ้ายและบน แล้วเขียนข้างใน จึงปิดกรอบด้านล่างเป็นขีดสุดท้าย" }
