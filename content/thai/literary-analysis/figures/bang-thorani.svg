<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 294" width="900" height="294" font-family="'Sarabun','Noto Sans Thai','Noto Sans Thai UI','Leelawadee UI','Tahoma','Loma',sans-serif">
<title>ตัวบทนิราศภูเขาทอง ตอนบางธรณี 4 บรรทัด</title>
<defs></defs>
<rect x="0" y="0" width="900" height="294" fill="#fff"/>
<rect x="10.0" y="10.0" width="880.0" height="274.0" rx="10" fill="#fffaf0" stroke="#8d6e63" stroke-width="2"/>
<text x="30.0" y="46.0" font-size="18" text-anchor="start" fill="#5d4037" font-weight="bold">ตัวบท: ผ่านบางธรณี</text>
<text x="30.0" y="92.0" font-size="15" text-anchor="start" fill="#8d6e63" font-weight="bold">1</text>
<text x="60.0" y="92.0" font-size="19" text-anchor="start" fill="#111" font-weight="normal">มาถึงบางธรณีทวีโศก</text>
<text x="470.0" y="92.0" font-size="19" text-anchor="start" fill="#111" font-weight="normal">ยามวิโยคยากใจให้สะอื้น</text>
<text x="30.0" y="138.0" font-size="15" text-anchor="start" fill="#8d6e63" font-weight="bold">2</text>
<text x="60.0" y="138.0" font-size="19" text-anchor="start" fill="#111" font-weight="normal">โอ้สุธาหนาแน่นเป็นแผ่นพื้น</text>
<text x="470.0" y="138.0" font-size="19" text-anchor="start" fill="#111" font-weight="normal">ถึงสี่หมื่นสองแสนทั้งแดนไตร</text>
<text x="30.0" y="184.0" font-size="15" text-anchor="start" fill="#8d6e63" font-weight="bold">3</text>
<text x="60.0" y="184.0" font-size="19" text-anchor="start" fill="#111" font-weight="normal">เมื่อเคราะห์ร้ายกายเราก็เท่านี้</text>
<text x="470.0" y="184.0" font-size="19" text-anchor="start" fill="#111" font-weight="normal">ไม่มีที่พสุธาจะอาศัย</text>
<text x="30.0" y="230.0" font-size="15" text-anchor="start" fill="#8d6e63" font-weight="bold">4</text>
<text x="60.0" y="230.0" font-size="19" text-anchor="start" fill="#111" font-weight="normal">ล้วนหนามเหน็บเจ็บแสบคับแคบใจ</text>
<text x="470.0" y="230.0" font-size="19" text-anchor="start" fill="#111" font-weight="normal">เหมือนนกไร้รังเร่อยู่เอกา</text>
<text x="870.0" y="268.0" font-size="14" text-anchor="end" fill="#555" font-weight="normal">สุนทรภู่ นิราศภูเขาทอง (ตามวิกิซอร์ซ)</text>
</svg>
