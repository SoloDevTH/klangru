  description: จำนวน พีชคณิต ฟังก์ชัน เรขาคณิต ไปจนถึงแคลคูลัส เรียงจากพื้นฐานขึ้นไป
  color: "#2f5fb3"
- id: physics
  title: { th: ฟิสิกส์, en: Physics }
  description: หน่วยและการวัด การเคลื่อนที่ แรง พลังงาน ไปจนถึงไฟฟ้าและคลื่น
  color: "#b4521f"
- id: thai
  title: { th: ภาษาไทย, en: Thai language }
  description: ตัวอักษร การผันวรรณยุกต์ หลักภาษา การอ่านและการเขียน
  color: "#7a3fa0"
- id: english
  title: { th: ภาษาอังกฤษ, en: English }
