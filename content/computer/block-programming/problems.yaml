      - { id: c, text: "ต้องเพิ่มบล็อก ทำซ้ำ", feedback: "โปรแกรมนี้ไม่มีอะไรต้องทำซ้ำ ปัญหาอยู่ที่ทิศการเลี้ยว" }
      - { id: d, text: "เมื่อกดปุ่มเริ่ม ควรอยู่ท้ายสุด", feedback: "บล็อกเหตุการณ์ต้องอยู่บนสุดเพื่อเริ่มสคริปต์" }
