# - ตัวชี้วัดที่หัวข้อในแผนไฟล์อื่นสอนอยู่แล้วใช้ extend: ผูกเข้าหัวข้อนั้น ไม่สร้างหัวข้อซ้ำ (หัวข้อจากหลักสูตรไทยหลายหัวข้อจึงรับตัวชี้วัดต่างประเทศเพิ่ม)
# - สร้างหัวข้อใหม่ใน topics: เฉพาะเนื้อหาที่ไม่มีทั้งในคลังและในแผน เรียงตาม prerequisite
# - extend: ผูกได้เฉพาะหัวข้อที่เสนอในแผน ไม่ผูกกับหัวข้อที่เขียนแล้วในคลัง (ตัวตรวจไม่รับ) ตัวชี้วัดที่หัวข้อในคลังสอนแล้วต้องเพิ่มใน curriculum/mappings
#   ตัวชี้วัดต่างประเทศระดับประถมที่หัวข้อในคลังสอนเพียงบางส่วน (เช่น ทศนิยมกับเศษส่วน) จึงผูกกับหัวข้อในแผนที่ใกล้ที่สุด (math.number.rationals, math.number.fraction-compare)
# - วิชา science ใหม่ใช้กับทักษะกระบวนการทางวิทยาศาสตร์ที่ใช้ร่วมกันทุกสาขา (การออกแบบการทดลอง การวิเคราะห์ข้อมูล การประเมินหลักฐาน ธรรมชาติของวิทยาศาสตร์)
#   หัวข้อเหล่านี้สอนการวางแผนและการคิด ส่วนการลงมือทดลองจริงอยู่นอกแอป
