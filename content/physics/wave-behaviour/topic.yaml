id: physics.waves.wave-behaviour
subject: physics
title: { th: พฤติกรรมของคลื่น, en: Wave behaviour }
summary: การสะท้อน การหักเห การแทรกสอด และการเลี้ยวเบนของคลื่น อธิบายด้วยหลักของฮอยเกนส์ และคำนวณความยาวคลื่นกับผลต่างระยะทางอย่างง่าย
difficulty: 5
minutes: 35
prerequisites: [physics.waves.wave-basics]
encompasses:
  - { id: physics.waves.wave-basics, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: refraction-wavefronts.svg
    alt: "หน้าคลื่นน้ำเป็นเส้นตรงขนานกัน เคลื่อนจากเขตน้ำลึกทางซ้าย (v = 0.6 m/s ความยาวคลื่น 0.30 m) เข้าสู่เขตน้ำตื้นทางขวา (v = 0.3 m/s ความยาวคลื่น 0.15 m) ในเขตน้ำตื้นหน้าคลื่นชิดกันขึ้นครึ่งหนึ่งและเอียงน้อยลง หน้าคลื่นต่อกันพอดีที่รอยต่อ ลูกศรแสดงทิศคลื่นทำมุม 30 องศากับเส้นปกติในเขตน้ำลึก และ 14.5 องศาในเขตน้ำตื้น"
    caption: "ภาพของตัวอย่างที่ 1 วาดตามสเกล คลื่นช้าลง ความยาวคลื่นสั้นลง และเบนเข้าหาเส้นปกติ"
  - type: worked-example
    title: คลื่นดลสองลูกซ้อนทับกัน
    problem: "คลื่นดลลูกหนึ่งในเชือกสูง $3\\ \\mathrm{cm}$ วิ่งไปทางขวา อีกลูกวิ่งสวนมาทางซ้าย ทั้งสองกว้างเท่ากัน ขณะที่ทั้งสองซ้อนกันพอดี เชือกตรงกลางมีการกระจัดเท่าใด ถ้าลูกที่สอง (ก) สูง $2\\ \\mathrm{cm}$ (ข) คว่ำลง ลึก $2\\ \\mathrm{cm}$ และหลังจากผ่านกันไปแล้ว คลื่นดลแต่ละลูกเป็นอย่างไร"
    steps:
      - text: "ใช้หลักการซ้อนทับ: การกระจัดรวม = ผลบวกของการกระจัดจากแต่ละคลื่น โดยคิดเครื่องหมาย (ขึ้นเป็นบวก ลงเป็นลบ)"
      - text: "(ก) $3 + 2 = 5\\ \\mathrm{cm}$ เสริมกัน"
      - text: "(ข) $3 + (-2) = 1\\ \\mathrm{cm}$ หักล้างกันบางส่วน"
        why: "ถ้าลูกที่สองลึก $3\\ \\mathrm{cm}$ พอดี เชือกตรงนั้นจะแบนชั่วขณะ แต่พลังงานไม่ได้หายไป ส่วนของเชือกยังเคลื่อนที่อยู่"
      - text: "หลังผ่านกันไป คลื่นดลแต่ละลูกกลับมามีรูปร่างและขนาดเดิม วิ่งต่อไปในทิศเดิม"
        why: "คลื่นไม่ได้ชนกันแบบวัตถุ การซ้อนทับเกิดเฉพาะช่วงที่คลื่นอยู่ตำแหน่งเดียวกัน"
    answer: "(ก) $5\\ \\mathrm{cm}$ (ข) $1\\ \\mathrm{cm}$ และหลังผ่านกัน ทั้งสองลูกกลับเป็นเหมือนเดิม"
  - { type: check, problem: phy.wbeh.p016, prompt: "ลองกับคลื่นดลในภาพ" }
  - type: figure
    src: interference-pattern.svg
    alt: "แหล่งกำเนิดคลื่นน้ำ S1 และ S2 ห่างกัน 4.5 cm (3 ความยาวคลื่น เมื่อความยาวคลื่น 1.5 cm) วงกลมทึบสีเทาคือสันคลื่นจากแต่ละแหล่ง วงกลมประจางคือท้องคลื่น เส้นสีส้มคือแนวปฏิบัพ A0 ตรงกลางตั้งฉากกับเส้นที่ต่อ S1 กับ S2 และ A1, A2 ข้างละสองเส้น ผ่านจุดที่สันพบสัน เส้นประสีน้ำเงินคือแนวบัพ N1, N2, N3 ข้างละสามเส้น อยู่ระหว่างแนวปฏิบัพ ผ่านจุดที่สันพบท้อง"
    caption: "แนวปฏิบัพมีผลต่างระยะทาง $0, \\lambda, 2\\lambda$ ส่วนแนวบัพมีผลต่างระยะทาง $0.5\\lambda, 1.5\\lambda, 2.5\\lambda$"
  - type: worked-example
    title: นับแนวบัพและแนวปฏิบัพในถาดคลื่น
    problem: "แหล่งกำเนิดคลื่นน้ำอาพันธ์สองแหล่ง เฟสตรงกัน สั่นด้วยความถี่ $10\\ \\mathrm{Hz}$ คลื่นมีอัตราเร็ว $20\\ \\mathrm{cm/s}$ แหล่งทั้งสองห่างกัน $7\\ \\mathrm{cm}$ (ก) จุด P อยู่ห่าง $S_1$ และ $S_2$ เป็น $9\\ \\mathrm{cm}$ และ $12\\ \\mathrm{cm}$ อยู่บนแนวใด (ข) ระหว่างแหล่งทั้งสองมีแนวปฏิบัพกี่แนว"
    steps:
      - text: "ความยาวคลื่น: $\\lambda = \\dfrac{v}{f} = \\dfrac{20}{10} = 2\\ \\mathrm{cm}$"
      - text: "(ก) ผลต่างระยะทาง $= 12 - 9 = 3\\ \\mathrm{cm} = 1.5\\lambda = (2 - \\tfrac{1}{2})\\lambda$ จุด P จึงอยู่บนแนวบัพที่ 2"
      - text: "(ข) ผลต่างระยะทางของจุดใด ๆ มากที่สุดไม่เกินระยะระหว่างแหล่ง $7\\ \\mathrm{cm}$ แนวปฏิบัพต้องมี $n\\lambda < 7$ คือ $n = 0, 1, 2, 3$"
        why: "จุดที่ผลต่างระยะทางเท่ากับ $7\\ \\mathrm{cm}$ พอดีอยู่บนเส้นตรงที่ต่อแหล่งทั้งสองออกไปด้านนอก ไม่ได้อยู่ระหว่างแหล่ง"
      - text: "นับทั้งสองข้าง: แนวกลาง $A_0$ หนึ่งแนว และ $A_1, A_2, A_3$ ข้างละสามแนว รวม $1 + 2 \\times 3 = 7$ แนว"
    answer: "(ก) แนวบัพที่ 2 (ข) 7 แนวปฏิบัพ"
  - { type: check, problem: phy.wbeh.p018 }
  - type: interactive
    title: ซ้อนคลื่นสองขบวนแล้วดูผลรวม
    caption: เส้นแรกคือคลื่นที่ 1 เส้นที่สองคือคลื่นที่ 2 ซึ่งมีแอมพลิจูด a และต่างเฟส p เรเดียน เส้นที่สามคือผลรวม ลองตั้ง p = 0 (เสริมกันสูงสุด) แล้วเลื่อน p ไปที่ประมาณ 3.14 (ครึ่งรอบ) ขณะ a = 1 คลื่นรวมจะหายไปเกือบหมด
    widget:
      kind: function-plot
      functions: ["\\sin(x)", "a\\sin(x+p)", "\\sin(x)+a\\sin(x+p)"]
      sliders:
        - { name: a, min: 0, max: 1.5, step: 0.1, value: 1, label: แอมพลิจูดคลื่นที่ 2 }
        - { name: p, min: 0, max: 6.3, step: 0.1, value: 0, label: ผลต่างเฟส (เรเดียน) }
      x: [-7, 7]
      y: [-3, 3]
  - type: simulation
    title: การแทรกสอดของคลื่น (PhET Wave Interference)
    url: https://phet.colorado.edu/en/simulations/wave-interference
    provider: phet
    note: เปิดแหล่งกำเนิดคลื่นน้ำสองแหล่งแล้วสังเกตแนวที่น้ำนิ่ง (แนวบัพ) สลับกับแนวที่กระเพื่อมแรง (แนวปฏิบัพ) จากนั้นลองหน้าจอช่องแคบ ปรับความกว้างของช่องให้แคบลงแล้วดูว่าคลื่นแผ่ออกด้านข้างมากขึ้น
glossary:
  - { term: หน้าคลื่น, definition: "เส้นที่ลากผ่านจุดบนคลื่นที่มีเฟสเดียวกัน เช่น แนวสันคลื่น ทิศการเคลื่อนที่ของคลื่นตั้งฉากกับหน้าคลื่น" }
  - { term: แหล่งกำเนิดอาพันธ์, definition: "แหล่งกำเนิดคลื่นสองแหล่งที่มีความถี่เท่ากันและผลต่างเฟสคงที่ จึงเกิดรูปแบบการแทรกสอดที่คงที่" }
  - { term: บัพ และ ปฏิบัพ, definition: "บัพคือตำแหน่งที่คลื่นหักล้างกันจนตัวกลางแทบไม่สั่น ปฏิบัพคือตำแหน่งที่คลื่นเสริมกันจนสั่นแรงที่สุด" }
  - { term: การเลี้ยวเบน, definition: "การที่คลื่นแผ่อ้อมขอบสิ่งกีดขวางหรือผ่านช่องแคบไปยังบริเวณด้านหลัง เห็นชัดเมื่อช่องกว้างใกล้เคียงหรือน้อยกว่าความยาวคลื่น" }
flashcards:
  - { front: "หลักของฮอยเกนส์", back: "ทุกจุดบนหน้าคลื่นเป็นแหล่งกำเนิดคลื่นย่อย เส้นที่สัมผัสคลื่นย่อยทุกวงคือหน้าคลื่นใหม่" }
  - { front: "คลื่นหักเหเข้าตัวกลางใหม่ ปริมาณใดไม่เปลี่ยน", back: "ความถี่ $f$ ส่วนอัตราเร็ว $v$ และความยาวคลื่น $\\lambda$ เปลี่ยน" }
  - { front: "กฎการหักเหของคลื่น", back: "$\\dfrac{\\sin\\theta_1}{\\sin\\theta_2} = \\dfrac{v_1}{v_2} = \\dfrac{\\lambda_1}{\\lambda_2}$" }
  - { front: "แหล่งกำเนิดเฟสตรงกัน จุดใดเสริมกัน จุดใดหักล้างกัน", back: "ผลต่างระยะทาง $n\\lambda$ เสริมกัน (ปฏิบัพ) ผลต่างระยะทาง $(n - \\tfrac{1}{2})\\lambda$ หักล้างกัน (บัพ)" }
  - { front: "การเลี้ยวเบนเห็นชัดเมื่อใด", back: "เมื่อความกว้างของช่องหรือสิ่งกีดขวางใกล้เคียงหรือน้อยกว่าความยาวคลื่น" }
