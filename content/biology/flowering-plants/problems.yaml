problems:
  - id: biology.plants.flowering-plants.p001
    topics: [biology.plants.flowering-plants]
    difficulty: 1
    type: mcq
    stem: "ส่วนใดของพืชดูดน้ำจากดิน"
    choices:
      - { id: a, text: "ราก", correct: true }
      - { id: b, text: "ใบ", feedback: "ใบใช้รับแสงสร้างอาหาร และคายน้ำออก ไม่ได้ดูดน้ำจากดิน" }
      - { id: c, text: "ดอก", feedback: "ดอกใช้สืบพันธุ์ ไม่ได้อยู่ในดิน" }
      - { id: d, text: "ผล", feedback: "ผลห่อหุ้มเมล็ด ไม่ได้ดูดน้ำจากดิน" }
    hints:
      - "ส่วนใดของพืชอยู่ในดิน"
      - "ส่วนนี้แตกแขนงเล็ก ๆ จำนวนมาก"
    solution: "รากอยู่ในดิน ดูดน้ำและธาตุอาหาร แล้วลำต้นส่งน้ำต่อไปยังใบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.flowering-plants.p002
    topics: [biology.plants.flowering-plants]
    difficulty: 1
    type: text
    stem: "ส่วนของพืชที่มักมีสีเขียวและแบน ใช้รับแสงเพื่อสร้างอาหาร เรียกว่าอะไร (ตอบเป็นคำเดียว)"
    accepted: ["ใบ", "ใบไม้"]
    hints:
      - "ส่วนนี้ร่วงลงมาเต็มสนามในหน้าแล้ง"
      - "ส่วนนี้แผ่กว้างเพื่อรับแสงได้มาก"
    misconceptions:
      - { match: "ราก", feedback: "รากอยู่ในดิน ไม่ได้รับแสง รากดูดน้ำ ส่วนที่สร้างอาหารคือใบ" }
      - { match: "ดอก", feedback: "ดอกใช้สืบพันธุ์ ส่วนที่รับแสงสร้างอาหารคือใบ" }
    solution: "ใบ รับแสงแดดแล้วสร้างอาหารจากน้ำและอากาศ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.flowering-plants.p003
    topics: [biology.plants.flowering-plants]
    difficulty: 1
    type: mcq
    multiple: true
    stem: "ต้นพริกในกระถางต้องการสิ่งใดในการเจริญเติบโต (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "แสงแดด", correct: true }
      - { id: b, text: "น้ำ", correct: true }
      - { id: c, text: "เสียงเพลง", feedback: "พืชไม่ได้ใช้เสียงเพลงในการเจริญเติบโต" }
      - { id: d, text: "น้ำอัดลม", feedback: "น้ำอัดลมมีน้ำตาลและกรด ไม่เหมาะกับพืช พืชต้องการน้ำสะอาด" }
    hints:
      - "ถ้าวางต้นพริกในตู้มืด หรือลืมรดน้ำ จะเป็นอย่างไร"
      - "พืชใช้สองอย่างนี้สร้างอาหาร"
    solution: "ต้นพริกต้องการแสงแดดและน้ำในการเจริญเติบโต ขาดแสงต้นจะซีดและผอม ขาดน้ำต้นจะเหี่ยว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.flowering-plants.p004
    topics: [biology.plants.flowering-plants]
    difficulty: 2
    type: match
    stem: "จับคู่ส่วนของพืชดอกกับหน้าที่"
    pairs:
      - { left: "ราก", right: "ดูดน้ำและธาตุอาหาร ยึดต้นไว้" }
      - { left: "ลำต้น", right: "ชูใบและดอก ลำเลียงน้ำและอาหาร" }
      - { left: "ใบ", right: "รับแสงเพื่อสร้างอาหาร" }
      - { left: "ดอก", right: "สืบพันธุ์ กลายเป็นผลและเมล็ด" }
    hints:
      - "ส่วนที่อยู่ในดินทำหน้าที่อะไร"
      - "ส่วนที่มีกลีบสีสวยเกี่ยวกับการมีต้นใหม่"
    solution: "ราก → ดูดน้ำและยึดต้น, ลำต้น → ชูใบและดอก ลำเลียงน้ำและอาหาร, ใบ → สร้างอาหาร, ดอก → สืบพันธุ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.flowering-plants.p005
    topics: [biology.plants.flowering-plants]
    difficulty: 2
    type: mcq
    stem: "จากภาพการทดลอง ต้องเทียบกระถางคู่ใดจึงบอกได้ว่าพืชต้องการแสง"
    figure: { src: light-water.svg, alt: "ต้นถั่วเขียว 3 กระถางเมื่อครบ 7 วัน กระถาง ก วางกลางแจ้ง รดน้ำทุกวัน ต้นตรง ใบเขียว กระถาง ข อยู่ในกล่องทึบไม่มีแสง รดน้ำทุกวัน ต้นสูงชะลูด ผอม ใบเล็กสีเหลืองซีด กระถาง ค วางกลางแจ้ง ไม่รดน้ำ ต้นเหี่ยวโค้งงอ" }
    choices:
      - { id: a, text: "กระถาง ก กับ กระถาง ข", correct: true }
      - { id: b, text: "กระถาง ก กับ กระถาง ค", feedback: "ก กับ ค ได้แสงเท่ากัน ต่างกันที่น้ำ คู่นี้จึงบอกว่าพืชต้องการน้ำ" }
      - { id: c, text: "กระถาง ข กับ กระถาง ค", feedback: "ข กับ ค ต่างกันทั้งแสงและน้ำ จึงบอกไม่ได้ว่าผลมาจากอะไร" }
    hints:
      - "หาคู่ที่ต่างกันเพียงอย่างเดียว คือแสง"
      - "ทั้งสองกระถางต้องได้น้ำเท่ากัน"
    solution: "กระถาง ก กับ ข ได้น้ำเท่ากัน ต่างกันเฉพาะแสง ต้นในกล่องทึบซีดและอ่อนแอ จึงสรุปได้ว่าพืชต้องการแสง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.flowering-plants.p006
    topics: [biology.plants.flowering-plants]
    difficulty: 2
    type: mcq
    stem: "ต้นถั่วเขียวที่ปลูกในกล่องทึบ 7 วัน โดยรดน้ำทุกวัน จะมีลักษณะอย่างไร"
    choices:
      - { id: a, text: "ลำต้นสูงชะลูด ผอม ใบเล็กสีเหลืองซีด", correct: true }
      - { id: b, text: "ต้นเตี้ย ใบเขียวเข้มและใหญ่", feedback: "ใบเขียวเข้มต้องได้แสง ต้นที่อยู่ในที่มืดจะซีดและยืดยาวหาแสง" }
      - { id: c, text: "เมล็ดไม่งอกเลย", feedback: "เมล็ดงอกได้ด้วยอาหารที่สะสมในเมล็ด แม้ไม่มีแสง แต่ต้นที่งอกจะซีดและอ่อนแอ" }
      - { id: d, text: "แข็งแรงเหมือนต้นที่อยู่กลางแจ้ง", feedback: "ต้นที่ไม่ได้แสงสร้างอาหารได้น้อย จึงไม่แข็งแรงเท่าต้นที่ได้แสง" }
    hints:
      - "ใบสีเขียวต้องได้อะไร"
      - "ต้นที่อยู่ในที่มืดจะพยายามยืดไปหาแสง"
    solution: "ในที่มืด ต้นถั่วใช้อาหารที่สะสมในเมล็ดยืดลำต้นยาวหาแสง จึงสูงชะลูดและผอม ใบเล็กและซีดเหลืองเพราะไม่ได้แสง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.flowering-plants.p007
    topics: [biology.plants.flowering-plants]
    difficulty: 2
    type: order
    stem: "เรียงวัฏจักรชีวิตของต้นมะม่วงตั้งแต่เมล็ด"
    items:
      - "เมล็ดมะม่วงในดิน"
      - "เมล็ดงอกรากและยอด"
      - "ต้นอ่อนมีใบไม่กี่ใบ"
      - "ต้นมะม่วงโตเต็มที่"
      - "ออกดอกเป็นช่อ"
      - "เกิดผลมะม่วงที่มีเมล็ดข้างใน"
    hints:
      - "ต้นต้องโตเต็มที่ก่อนจึงออกดอก"
      - "ผลเกิดหลังจากดอก"
    solution: "เมล็ด → เมล็ดงอก → ต้นอ่อน → ต้นโตเต็มที่ → ออกดอก → เกิดผลที่มีเมล็ด แล้วเมล็ดก็เริ่มวัฏจักรใหม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.flowering-plants.p008
    topics: [biology.plants.flowering-plants]
    difficulty: 3
    type: match
    stem: "จับคู่ส่วนของดอกกับหน้าที่"
    pairs:
      - { left: "กลีบเลี้ยง", right: "หุ้มดอกตอนยังตูม" }
      - { left: "กลีบดอก", right: "มีสีสดล่อแมลง" }
      - { left: "อับเรณู", right: "สร้างละอองเรณู" }
      - { left: "ยอดเกสรเพศเมีย", right: "รับละอองเรณู" }
      - { left: "รังไข่", right: "เจริญเป็นผล" }
    hints:
      - "อับเรณูเป็นส่วนของเกสรเพศผู้ ยอดเกสรและรังไข่เป็นส่วนของเกสรเพศเมีย"
      - "กลีบสีเขียวอยู่ด้านนอกสุด"
    solution: "กลีบเลี้ยง → หุ้มดอกตอนตูม, กลีบดอก → ล่อแมลง, อับเรณู → สร้างละอองเรณู, ยอดเกสรเพศเมีย → รับละอองเรณู, รังไข่ → เจริญเป็นผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.flowering-plants.p009
    topics: [biology.plants.flowering-plants]
    difficulty: 3
    type: numeric
    stem: "นักเรียนวัดความสูงต้นข้าวโพดทุกสัปดาห์ได้ดังนี้ สัปดาห์ที่ 0 สูง 2 cm สัปดาห์ที่ 1 สูง 5 cm สัปดาห์ที่ 2 สูง 9 cm สัปดาห์ที่ 3 สูง 14 cm สัปดาห์ที่ 4 สูง 20 cm จากสัปดาห์ที่ 2 ถึงสัปดาห์ที่ 4 ต้นข้าวโพดสูงขึ้นกี่เซนติเมตร"
    answer: { value: 11, unit: cm }
    hints:
      - "อ่านความสูงที่สัปดาห์ที่ 2 และสัปดาห์ที่ 4"
      - "สูงขึ้นเท่าไร ให้นำค่าหลังลบด้วยค่าก่อน"
    misconceptions:
      - { match: 20, feedback: "20 คือความสูงที่สัปดาห์ที่ 4 โจทย์ถามว่าสูงขึ้นเท่าไร ต้องลบความสูงที่สัปดาห์ที่ 2" }
      - { match: 6, feedback: "6 คือความสูงที่เพิ่มเฉพาะสัปดาห์สุดท้าย (14 ถึง 20) โจทย์ถามตั้งแต่สัปดาห์ที่ 2" }
    solution: "สัปดาห์ที่ 4 สูง 20 cm สัปดาห์ที่ 2 สูง 9 cm สูงขึ้น $20 - 9 = 11$ cm"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.flowering-plants.p010
    topics: [biology.plants.flowering-plants]
    difficulty: 3
    type: mcq
    stem: "ห้องเรียนมีกระถางผักบุ้งที่นักเรียนปลูกไว้ ก่อนปิดภาคเรียน 2 สัปดาห์ ควรทำอย่างไรจึงดูแลผักบุ้งได้ดีที่สุด"
    choices:
      - { id: a, text: "ฝากครูหรือเพื่อนที่อยู่ใกล้ช่วยรดน้ำสม่ำเสมอ และวางกระถางในที่ที่ได้แสง", correct: true }
      - { id: b, text: "รดน้ำให้ท่วมกระถางครั้งเดียวก่อนปิดภาคเรียน", feedback: "น้ำที่ขังมากทำให้รากขาดอากาศและเน่า และน้ำจะแห้งก่อน 2 สัปดาห์" }
      - { id: c, text: "เก็บกระถางไว้ในตู้ปิดทึบเพื่อไม่ให้ใครทำหล่น", feedback: "ในตู้ทึบไม่มีแสง ผักบุ้งจะสร้างอาหารไม่ได้และอ่อนแอ" }
      - { id: d, text: "ไม่ต้องทำอะไร เพราะพืชอยู่ได้เองโดยไม่ต้องใช้น้ำ", feedback: "พืชต้องการน้ำ ขาดน้ำ 2 สัปดาห์ผักบุ้งจะเหี่ยวตาย" }
    hints:
      - "พืชต้องการทั้งน้ำและแสงอย่างพอเหมาะ"
      - "มากเกินไปหรือน้อยเกินไปก็ไม่ดี"
    solution: "ผักบุ้งต้องได้น้ำสม่ำเสมอและได้แสง จึงควรฝากให้มีคนรดน้ำและวางในที่ได้แสง การรดน้ำท่วมครั้งเดียว ปิดในที่มืด หรือปล่อยทิ้งไว้ ทำให้พืชเสียหาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.flowering-plants.p011
    topics: [biology.plants.flowering-plants]
    difficulty: 3
    type: mcq
    stem: "เมล็ดของต้นยางนามีปีกยาว เวลาร่วงจากต้นจะหมุนลอยไปไกล ปีกนี้ช่วยกระจายเมล็ดด้วยวิธีใด"
    choices:
      - { id: a, text: "ลม", correct: true }
      - { id: b, text: "น้ำ", feedback: "เมล็ดที่กระจายด้วยน้ำมักลอยน้ำได้ เช่น มะพร้าว ปีกของยางนาช่วยให้ลอยในอากาศ" }
      - { id: c, text: "สัตว์กินผลแล้วถ่ายเมล็ด", feedback: "เมล็ดที่กระจายด้วยสัตว์มักอยู่ในผลที่กินได้ หรือมีขอเกี่ยวติดขน ปีกช่วยให้ลอยตามลม" }
      - { id: d, text: "ฝักแตกดีดเมล็ด", feedback: "ฝักที่แตกดีดเมล็ด เช่น ต้อยติ่ง ไม่มีปีก ปีกช่วยให้ลมพาไป" }
    hints:
      - "ปีกช่วยให้เมล็ดลอยอยู่ในอะไรได้นาน"
      - "ยิ่งลอยนาน ยิ่งถูกพัดไปไกล"
    solution: "ปีกทำให้เมล็ดยางนาหมุนและลอยอยู่ในอากาศนาน ลมจึงพัดไปไกลจากต้นแม่ เมล็ดได้พื้นที่ใหม่ที่ไม่ต้องแย่งแสงกับต้นแม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.flowering-plants.p012
    topics: [biology.plants.flowering-plants]
    difficulty: 4
    type: mcq
    stem: "เมื่อผ่าผลมะม่วง เราเห็นเนื้อมะม่วงและเมล็ดข้างใน ข้อใดบอกที่มาของทั้งสองส่วนได้ถูกต้อง"
    choices:
      - { id: a, text: "ผลเจริญมาจากรังไข่ เมล็ดเจริญมาจากออวุลในรังไข่", correct: true }
      - { id: b, text: "ผลเจริญมาจากกลีบดอก เมล็ดเจริญมาจากอับเรณู", feedback: "กลีบดอกร่วงไปหลังการถ่ายละอองเรณู อับเรณูสร้างละอองเรณู ผลมาจากรังไข่และเมล็ดมาจากออวุล" }
      - { id: c, text: "ผลเจริญมาจากใบ เมล็ดเจริญมาจากราก", feedback: "ผลและเมล็ดเกิดจากดอก ไม่ใช่ใบหรือราก" }
      - { id: d, text: "ผลเจริญมาจากออวุล เมล็ดเจริญมาจากรังไข่", feedback: "สลับกัน รังไข่ซึ่งหุ้มอยู่ด้านนอกเจริญเป็นผล ออวุลข้างในเจริญเป็นเมล็ด" }
    hints:
      - "ส่วนใดของดอกหุ้มอีกส่วนหนึ่งไว้ข้างใน เหมือนผลหุ้มเมล็ด"
      - "รังไข่หุ้มออวุลไว้ข้างใน"
    solution: "หลังการถ่ายละอองเรณู รังไข่เจริญเป็นผล และออวุลข้างในเจริญเป็นเมล็ด ผลจึงหุ้มเมล็ดไว้เหมือนรังไข่หุ้มออวุล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.flowering-plants.p013
    topics: [biology.plants.flowering-plants]
    difficulty: 4
    type: mcq
    stem: "นักเรียนต้องการทดสอบว่าต้นดาวเรืองต้องการน้ำในการเจริญเติบโตหรือไม่ ควรจัดการทดลองแบบใด"
    choices:
