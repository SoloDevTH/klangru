id: business.entrepreneurship.business-plan
subject: business
title: { th: "การเป็นผู้ประกอบการและแผนธุรกิจ", en: "Entrepreneurship and business plans" }
summary: "ลักษณะของผู้ประกอบการ การหาโอกาสและปรับตัว องค์ประกอบของแผนธุรกิจ การประมาณยอดขาย ต้นทุน จุดคุ้มทุน ระยะคืนทุน และความได้เปรียบในการแข่งขัน"
difficulty: 4
minutes: 40
prerequisites: [business.entrepreneurship.careers, management.principles.functions, business.finance.break-even]
encompasses:
  - { id: business.finance.break-even, weight: 0.4 }
  - { id: business.entrepreneurship.careers, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: plan-parts.svg
    alt: "แผนภาพแปดกล่อง องค์ประกอบของแผนธุรกิจ 1 บทสรุป (ธุรกิจอะไร ใช้เงินเท่าไร) 2 สินค้าหรือบริการ (แก้ปัญหาอะไรให้ลูกค้า) 3 ลูกค้าและตลาด (ใคร กี่คน ซื้อบ่อยแค่ไหน) 4 คู่แข่งและความได้เปรียบ (ทำไมลูกค้าเลือกเรา) 5 แผนการตลาด (ราคา ช่องทาง การส่งเสริม) 6 แผนการดำเนินงาน (วัตถุดิบ คน เวลา สถานที่) 7 แผนการเงิน (ลงทุน ยอดขาย ต้นทุน คุ้มทุน) 8 ความเสี่ยง (ถ้าไม่เป็นตามแผน ทำอย่างไร) ด้านล่างมีกล่องเส้นประ ทดลองขายจริง เก็บข้อมูล ปรับแผน"
    caption: "แผนธุรกิจแปดส่วน และการปรับแผนจากข้อมูลจริง"
  - { type: check, problem: business.entrepreneurship.business-plan.p006, prompt: "ลองประมาณยอดขายจากลูกค้าเป้าหมาย" }
  - type: worked-example
    title: "แผนการเงินของร้านข้าวเหนียวมะม่วงในโรงเรียน"
    problem: "ฟ้าคาดว่านักเรียน $1{,}200$ คน จะซื้อ $15\\%$ คนละ $2$ กล่องต่อสัปดาห์ (เดือนละ $4$ สัปดาห์) ราคากล่องละ $35$ บาท ต้นทุนผันแปรกล่องละ $20$ บาท ต้นทุนคงที่เดือนละ $9{,}000$ บาท และลงทุนอุปกรณ์ครั้งแรก $45{,}000$ บาท หายอดขาย กำไรต่อเดือน จุดคุ้มทุน และระยะคืนทุน"
    steps:
      - { text: "จำนวนขาย $= 1{,}200 \\times 0.15 \\times 2 \\times 4 = 1{,}440$ กล่องต่อเดือน ยอดขาย $= 1{,}440 \\times 35 = 50{,}400$ บาท", why: "ประมาณจากจำนวนลูกค้าที่คาดว่าจะซื้อจริง ไม่ใช่จากนักเรียนทั้งหมด" }
      - { text: "กำไรส่วนเกิน $35 - 20 = 15$ บาทต่อกล่อง กำไร $= 1{,}440 \\times 15 - 9{,}000 = 12{,}600$ บาทต่อเดือน" }
      - { text: "จุดคุ้มทุน $= 9{,}000 \\div 15 = 600$ กล่องต่อเดือน ยอดที่คาดสูงกว่าจุดคุ้มทุน $840$ กล่อง", why: "ส่วนต่างนี้บอกว่ายอดขายลดลงได้อีกเท่าไรก่อนจะขาดทุน" }
      - { text: "ระยะคืนทุน $= 45{,}000 \\div 12{,}600 \\approx 3.6$ เดือน" }
      - { text: "ตรวจสมมติฐาน: ทดลองขาย $1$–$2$ สัปดาห์ แล้วดูว่าสัดส่วนผู้ซื้อใกล้ $15\\%$ หรือไม่ ถ้าน้อยกว่า ให้ปรับแผน" }
    answer: "ยอดขาย $50{,}400$ บาท กำไร $12{,}600$ บาทต่อเดือน คุ้มทุนที่ $600$ กล่อง คืนทุนประมาณ $3.6$ เดือน"
  - type: worked-example
    title: "สร้างความได้เปรียบเมื่อคู่แข่งลดราคา"
    problem: "ร้านข้าวเหนียวมะม่วงของฟ้าขายดี แต่ร้านข้างโรงเรียนลดราคาเหลือกล่องละ $30$ บาท ฟ้าควรลดราคาตามหรือไม่ และมีทางเลือกอื่นอย่างไร"
    steps:
      - { text: "ถ้าลดเหลือ $30$ บาท กำไรส่วนเกินเหลือ $10$ บาท จุดคุ้มทุนเพิ่มเป็น $9{,}000 \\div 10 = 900$ กล่อง", why: "ดูผลของการลดราคาต่อจุดคุ้มทุนก่อนตัดสินใจ" }
      - { text: "แข่งด้วยราคา (ต้นทุนต่ำ) ได้ก็ต่อเมื่อลดต้นทุนได้จริง เช่น ซื้อมะม่วงตรงจากสวน" }
      - { text: "หรือสร้างความแตกต่าง เช่น มะม่วงหลายพันธุ์ กล่องย่อยสลายได้ สั่งล่วงหน้าแล้วส่งถึงห้อง" }
      - { text: "หรือมุ่งกลุ่มเฉพาะ เช่น ชุดเล็กหวานน้อยสำหรับครูและผู้ปกครอง แล้วทดลองดูว่าลูกค้าตอบรับแบบใด" }
    answer: "ไม่จำเป็นต้องลดราคาตาม เลือกแนวทางความได้เปรียบที่ร้านทำได้จริงและคู่แข่งลอกยาก"
  - { type: check, problem: business.entrepreneurship.business-plan.p009, prompt: "ธุรกิจแต่ละร้านแข่งด้วยอะไร" }
glossary:
  - { term: "ผู้ประกอบการ", definition: "ผู้ที่มองเห็นโอกาส รวบรวมทรัพยากรมาสร้างสินค้าหรือบริการ และยอมรับความเสี่ยงเพื่อผลตอบแทน" }
  - { term: "แผนธุรกิจ", definition: "เอกสารที่อธิบายสินค้า ลูกค้า การตลาด การดำเนินงาน การเงิน และความเสี่ยงของธุรกิจ ใช้วางแผนและขอเงินทุน" }
  - { term: "เงินลงทุนเริ่มต้น", definition: "เงินที่จ่ายครั้งเดียวก่อนเปิดกิจการ เช่น อุปกรณ์ การตกแต่ง สินค้าล็อตแรก" }
  - { term: "ระยะคืนทุน", definition: "เวลาที่กำไรสะสมเท่ากับเงินลงทุนเริ่มต้น = เงินลงทุนเริ่มต้น ÷ กำไรต่อช่วงเวลา" }
  - { term: "ส่วนแบ่งตลาด", definition: "ร้อยละของยอดขายของกิจการเทียบกับยอดขายรวมของตลาด" }
  - { term: "ความได้เปรียบในการแข่งขัน", definition: "เหตุผลที่ลูกค้าเลือกกิจการเราแทนคู่แข่ง เช่น ต้นทุนต่ำ ความแตกต่าง หรือการมุ่งกลุ่มเฉพาะ" }
  - { term: SWOT, definition: "การวิเคราะห์จุดแข็ง จุดอ่อน (ภายใน) โอกาส และอุปสรรค (ภายนอก) ของกิจการ" }
flashcards:
  - { front: "ประมาณจำนวนขาย", back: "ลูกค้าเป้าหมาย × สัดส่วนที่คาดว่าจะซื้อ × ความถี่ในการซื้อ" }
  - { front: "ระยะคืนทุน", back: "เงินลงทุนเริ่มต้น ÷ กำไรต่อเดือน (อุปกรณ์ที่ซื้อครั้งเดียวไม่ใช่ต้นทุนคงที่รายเดือน)" }
  - { front: "ความได้เปรียบในการแข่งขันสามแนวทาง", back: "ต้นทุนต่ำ · ความแตกต่าง · มุ่งกลุ่มเฉพาะ" }
  - { front: "SWOT แยกภายในกับภายนอกอย่างไร", back: "ภายใน: จุดแข็ง (S) จุดอ่อน (W) · ภายนอก: โอกาส (O) อุปสรรค (T)" }
