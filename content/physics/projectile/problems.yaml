    solution: "ลูกบอลมีความเร็วแนวราบเท่ากับรถตั้งแต่ก่อนโยน และความเร็วแนวราบคงตัวระหว่างลอย ลูกบอลกับรถ (และมือ) จึงเคลื่อนไปข้างหน้าเท่ากันตลอดเวลา ลูกบอลตกกลับมาที่มือ คนบนรถเห็นลูกบอลขึ้นลงตรง ๆ ส่วนคนข้างถนนเห็นเป็นพาราโบลา"
