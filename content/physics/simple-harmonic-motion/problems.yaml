    choices:
      - { id: a, text: "คาบเท่ากัน", correct: true }
      - { id: b, text: "ลูกเหล็กมีคาบยาวกว่า เพราะหนักกว่าจึงแกว่งช้ากว่า", feedback: "ความรู้สึกนี้มาจากสปริง ($T = 2\\pi\\sqrt{m/k}$) แต่สำหรับลูกตุ้ม แรงดึงกลับก็มากขึ้นตามมวลด้วย มวลจึงหักล้างกันหมด" }
      - { id: c, text: "ลูกเหล็กมีคาบสั้นกว่า เพราะถูกแรงโน้มถ่วงดึงแรงกว่า", feedback: "แรงมากขึ้นจริง แต่มวล (ความเฉื่อย) ก็มากขึ้นในสัดส่วนเดียวกัน ความเร่งจึงเท่าเดิม" }
      - { id: d, text: "ลูกไม้มีคาบยาวกว่า เพราะเบาจึงลอยค้างนานกว่า", feedback: "เมื่อไม่คิดแรงต้านอากาศ วัตถุเบาและหนักตกด้วยความเร่งเท่ากัน คาบของลูกตุ้มจึงไม่ขึ้นกับมวล" }
    hints:
