<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="sans-serif">
<title>คำทักทายตามช่วงเวลาของวัน</title>
<rect x="0" y="0" width="760" height="250" fill="#fff"/>
<text x="380.0" y="32.0" font-size="19" text-anchor="middle" fill="#111" font-weight="bold">ทักทายตามช่วงเวลา (เวลาโดยประมาณ)</text>
<rect x="40.0" y="70.0" width="250.5" height="60.0" rx="0" fill="#fff3c4" stroke="#111" stroke-width="1.5"/>
<text x="165.3" y="97.0" font-size="18" text-anchor="middle" fill="#1f4e9c" font-weight="bold">Good morning</text>
<text x="165.3" y="119.0" font-size="13" text-anchor="middle" fill="#555">เช้า ถึงเที่ยง</text>
<rect x="290.5" y="70.0" width="214.7" height="60.0" rx="0" fill="#ffd9a8" stroke="#111" stroke-width="1.5"/>
<text x="397.9" y="97.0" font-size="18" text-anchor="middle" fill="#1f4e9c" font-weight="bold">Good afternoon</text>
<text x="397.9" y="119.0" font-size="13" text-anchor="middle" fill="#555">เที่ยง ถึงราว 6 โมงเย็น</text>
<rect x="505.3" y="70.0" width="214.7" height="60.0" rx="0" fill="#c9d6f2" stroke="#111" stroke-width="1.5"/>
<text x="612.6" y="97.0" font-size="18" text-anchor="middle" fill="#1f4e9c" font-weight="bold">Good evening</text>
<text x="612.6" y="119.0" font-size="13" text-anchor="middle" fill="#555">ตั้งแต่ราว 6 โมงเย็น</text>
<line x1="75.8" y1="130.0" x2="75.8" y2="138.0" stroke="#111" stroke-width="1.5" stroke-linecap="round"/>
<text x="75.8" y="154.0" font-size="13" text-anchor="middle" fill="#555">06:00</text>
<line x1="183.2" y1="130.0" x2="183.2" y2="138.0" stroke="#111" stroke-width="1.5" stroke-linecap="round"/>
<text x="183.2" y="154.0" font-size="13" text-anchor="middle" fill="#555">09:00</text>
<line x1="290.5" y1="130.0" x2="290.5" y2="138.0" stroke="#111" stroke-width="1.5" stroke-linecap="round"/>
<text x="290.5" y="154.0" font-size="13" text-anchor="middle" fill="#555">12:00</text>
<line x1="397.9" y1="130.0" x2="397.9" y2="138.0" stroke="#111" stroke-width="1.5" stroke-linecap="round"/>
<text x="397.9" y="154.0" font-size="13" text-anchor="middle" fill="#555">15:00</text>
<line x1="505.3" y1="130.0" x2="505.3" y2="138.0" stroke="#111" stroke-width="1.5" stroke-linecap="round"/>
<text x="505.3" y="154.0" font-size="13" text-anchor="middle" fill="#555">18:00</text>
<line x1="612.6" y1="130.0" x2="612.6" y2="138.0" stroke="#111" stroke-width="1.5" stroke-linecap="round"/>
<text x="612.6" y="154.0" font-size="13" text-anchor="middle" fill="#555">21:00</text>
<line x1="720.0" y1="130.0" x2="720.0" y2="138.0" stroke="#111" stroke-width="1.5" stroke-linecap="round"/>
<text x="720.0" y="154.0" font-size="13" text-anchor="middle" fill="#555">24:00</text>
<circle cx="147.4" cy="52.0" r="9.0" fill="#f6c343" stroke="#b35900" stroke-width="1.5"/>
<circle cx="612.6" cy="52.0" r="9.0" fill="#f2f2f2" stroke="#555" stroke-width="1.5"/>
<circle cx="617.6" cy="49.0" r="8.0" fill="#fff" stroke="none" stroke-width="0"/>
<text x="40.0" y="205.0" font-size="15" text-anchor="start" fill="#c0392b" font-weight="bold">Good night = ใช้ตอน "ลา" ตอนกลางคืนหรือก่อนเข้านอน ไม่ใช้ทักทายตอนพบกัน</text>
<text x="40.0" y="232.0" font-size="15" text-anchor="start" fill="#111">Hello / Hi ใช้ทักได้ทุกเวลา · Goodbye / Bye / See you ใช้ตอนลา</text>
</svg>
