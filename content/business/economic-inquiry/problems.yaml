problems:
- id: business.econ.economic-inquiry.p001
  topics:
  - business.econ.economic-inquiry
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็นคำถามเชิงประเมิน
  choices:
  - id: a
    text: ราคาทุเรียนในตลาดตอนนี้เท่ากับเท่าไร
    feedback: เป็นคำถามเชิงพรรณนา ถามให้บอกค่าที่วัดได้
  - id: b
    text: ทำไมราคาไข่ไก่เพิ่มขึ้นในหน้าฝน
    feedback: เป็นคำถามเชิงเหตุผล ถามหาสาเหตุ
  - id: c
    text: นโยบายพักชำระหนี้ช่วยเกษตรกรได้จริงหรือไม่ และควรปรับอย่างไร
    correct: true
  - id: d
    text: ในตลาดนี้มีแผงขายผักกี่แผง
    feedback: เป็นคำถามเชิงพรรณนา ถามจำนวน
  hints:
  - คำถามเชิงประเมินถามว่า "ดีหรือไม่ ควรทำอย่างไร" และต้องตัดสินโดยใช้หลักฐาน
  - ดูว่าคำถามให้ตัดสินคุณค่าหรือแค่บอกข้อเท็จจริง
  solution: คำถามเชิงประเมินให้พิจารณาคุณค่าหรือผลของนโยบายหรือการกระทำ และต้องใช้ข้อมูลและเกณฑ์มาตัดสิน ส่วนอีกสามข้อเป็นการถามข้อเท็จจริงหรือหาสาเหตุ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.economic-inquiry.p002
  topics:
  - business.econ.economic-inquiry
  difficulty: 1
  type: mcq
  stem: การเดินสำรวจราคาผักในตลาดสด 10 แห่งด้วยตนเอง เป็นข้อมูลประเภทใด
  choices:
  - id: a
    text: ข้อมูลปฐมภูมิ
    correct: true
  - id: b
    text: ข้อมูลทุติยภูมิ
    feedback: ทุติยภูมิคือข้อมูลที่คนอื่นเก็บและเผยแพร่ไว้แล้ว
  - id: c
    text: ไม่ใช่ข้อมูล เพราะไม่มีตัวเลข
    feedback: การสำรวจด้วยตนเองให้ได้ข้อมูลตัวเลขได้เช่นกัน
  - id: d
    text: ข้อมูลที่ผ่านการประมวลผลจากหน่วยงานรัฐ
    feedback: นั่นเป็นข้อมูลทุติยภูมิ
  hints:
  - ถามว่าผู้วิเคราะห์เป็นคนเก็บข้อมูลเองหรือไม่
  - ข้อมูลที่เก็บเองจากต้นทางเรียกว่าปฐมภูมิ
  solution: ข้อมูลปฐมภูมิคือข้อมูลที่ผู้ศึกษาเก็บเองจากต้นทาง เช่น การสำรวจราคาในตลาด การสัมภาษณ์ หรือการทำแบบสอบถาม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.economic-inquiry.p003
  topics:
  - business.econ.economic-inquiry
  difficulty: 2
  type: mcq
  multiple: true
  stem: ข้อใดเป็นแหล่งทุติยภูมิที่น่าเชื่อถือ (เลือกทุกข้อที่ถูก)
  choices:
  - id: a
    text: รายงานประจำปีของธนาคารแห่งประเทศไทย
    correct: true
  - id: b
    text: ข้อความไม่ระบุชื่อผู้โพสต์ในสื่อสังคมออนไลน์
    feedback: ไม่ระบุผู้จัดทำ วันที่ และวิธีเก็บข้อมูล จึงประเมินไม่ได้
  - id: c
    text: สถิติที่สำนักงานสถิติแห่งชาติเผยแพร่พร้อมระบุปีและวิธีเก็บข้อมูล
    correct: true
  - id: d
    text: ตัวเลขในคลิปที่ไม่ระบุแหล่งที่มา
    feedback: ตัวเลขที่ไม่มีแหล่งอ้างอิงตรวจสอบไม่ได้
  hints:
  - แหล่งที่น่าเชื่อถือระบุผู้จัดทำ ปี และวิธีเก็บข้อมูลได้
  - หน่วยงานทางการที่เผยแพร่รายงานประจำก็มักมีรายละเอียดเหล่านี้
  solution: รายงานของธนาคารกลางและสถิติของหน่วยงานรัฐที่ระบุปีและวิธีเก็บข้อมูลเป็นแหล่งทุติยภูมิที่ตรวจสอบได้ ส่วนข้อความไม่ระบุชื่อหรือตัวเลขไม่มีแหล่งอ้างอิงควรระวังหรือไม่นำมาใช้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.economic-inquiry.p004
  topics:
  - business.econ.economic-inquiry
  difficulty: 2
  type: numeric
  stem: จากกราฟราคาผักคะน้า (ข้อมูลสมมติ) เดือนมกราคมเป็น 30 บาท และเดือนเมษายนเป็น 40 บาท ราคาเพิ่มขึ้นกี่เปอร์เซ็นต์เมื่อเทียบกับเดือนมกราคม (ตอบเป็นเปอร์เซ็นต์ ทศนิยม 2 ตำแหน่ง)
  figure:
    src: price-trend.svg
    alt: กราฟเส้นราคาผักคะน้าหกเดือนจากข้อมูลสมมติ เดือนมกราคม 30 บาท เดือนกุมภาพันธ์ 32 บาท เดือนมีนาคม 36 บาท เดือนเมษายน 40 บาท เดือนพฤษภาคม 38 บาท เดือนมิถุนายน 35 บาท
    caption: ข้อมูลสมมติ
  answer:
    value: 33.33
    tolerance: 0.1
    unit: '%'
  misconceptions:
  - match: 10
    feedback: นั่นคือผลต่างเป็นบาท ไม่ใช่เปอร์เซ็นต์ ต้องหารด้วยราคาเดิม
  - match: 25.0
    feedback: หารด้วยราคาใหม่ (เมษายน) แทนราคาเดิม (มกราคม)
  hints:
  - หาผลต่างของราคาก่อน แล้วเทียบกับราคาเดิม
  - คำนวณ (40 − 30) ÷ 30 × 100
  solution: (40 − 30) ÷ 30 × 100 = 33.33% ราคาเพิ่มขึ้นประมาณหนึ่งในสามจากเดือนมกราคมถึงเดือนเมษายน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.economic-inquiry.p005
  topics:
  - business.econ.economic-inquiry
  difficulty: 2
  type: numeric
  stem: ราคาผักคะน้าต่อกิโลกรัมหกเดือน (ข้อมูลสมมติ) คือ มกราคม 30 บาท กุมภาพันธ์ 32 บาท มีนาคม 36 บาท เมษายน 40 บาท พฤษภาคม 38 บาท และมิถุนายน 35 บาท ราคาเฉลี่ยตลอดหกเดือนเป็นเท่าไร (ตอบเป็นบาทต่อกิโลกรัม ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 35.17
    tolerance: 0.05
    unit: บาทต่อกิโลกรัม
  misconceptions:
  - match: 35.5
    feedback: นั่นคือค่ากลางแบบมัธยฐาน ไม่ใช่ค่าเฉลี่ย ให้รวมทุกค่าแล้วหารด้วยจำนวนเดือน
  hints:
  - รวมราคาทั้งหกเดือนก่อน
  - หารผลรวมด้วย 6 (จำนวนเดือน)
  solution: (30 + 32 + 36 + 40 + 38 + 35) ÷ 6 = 211 ÷ 6 ≈ 35.17 บาทต่อกิโลกรัม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.economic-inquiry.p006
  topics:
  - business.econ.economic-inquiry
  difficulty: 2
  type: mcq
  stem: ร้านค้าชุมชนแห่งหนึ่งพบว่าในเดือนที่ขายร่มได้มาก ก็ขายยาแก้หวัดได้มากด้วย (ข้อมูลสมมติ) ข้อสรุปใดเหมาะที่สุด
  choices:
  - id: a
    text: การซื้อร่มทำให้คนเป็นหวัดมากขึ้น
    feedback: เป็นการสรุปเหตุและผลที่ไม่มีหลักฐานรองรับ
  - id: b
    text: ทั้งสองอย่างสัมพันธ์กัน แต่ควรหาตัวแปรร่วม เช่น ฤดูฝน ก่อนสรุปเหตุและผล
    correct: true
  - id: c
    text: ทั้งสองอย่างเป็นความบังเอิญและไม่มีความสัมพันธ์กันเลย
    feedback: การเพิ่มขึ้นพร้อมกันซ้ำ ๆ เป็นความสัมพันธ์ที่ควรพิจารณา
  - id: d
    text: การเป็นหวัดทำให้คนต้องซื้อร่มมากขึ้น
    feedback: เป็นการกลับทิศของเหตุและผลโดยไม่มีหลักฐาน
  hints:
  - ถามตัวเองว่ามีอะไรที่ทำให้ทั้งสองอย่างเพิ่มพร้อมกันได้หรือไม่
  - ความสัมพันธ์ไม่ได้แปลว่าอย่างหนึ่งทำให้อีกอย่างเกิด
  solution: สหสัมพันธ์ไม่ใช่เหตุและผล ฤดูฝนทำให้ทั้งคนซื้อร่มและคนเป็นหวัดมากขึ้น (ตัวแปรร่วม) การสรุปเหตุและผลต้องมีการควบคุมหรือหลักฐานเพิ่มเติม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.economic-inquiry.p007
  topics:
  - business.econ.economic-inquiry
  difficulty: 3
  type: numeric
  stem: ราคาผักคะน้า (ข้อมูลสมมติ) จากจุดสูงสุดที่ 40 บาท (เมษายน) ลดลงเหลือ 35 บาท (มิถุนายน) ราคาเปลี่ยนแปลงกี่เปอร์เซ็นต์เทียบกับจุดสูงสุด (ตอบเป็นเปอร์เซ็นต์ ใส่เครื่องหมายลบถ้าลดลง ทศนิยม 2 ตำแหน่ง)
  answer:
    value: -12.5
    tolerance: 0.05
    unit: '%'
  misconceptions:
  - match: 14.29
    feedback: หารด้วยราคาใหม่ (35) แทนราคาเดิม (40) ต้องหารด้วยราคาที่ใช้เป็นฐานคือจุดสูงสุด
  hints:
  - การเปลี่ยนแปลงเทียบกับฐานเดิมคือ 40 บาท
  - คำนวณ (35 − 40) ÷ 40 × 100
  solution: (35 − 40) ÷ 40 × 100 = −12.5% ราคาลดลง 12.5% จากจุดสูงสุด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.economic-inquiry.p008
  topics:
  - business.econ.economic-inquiry
  difficulty: 3
  type: numeric
  stem: โครงการติดตั้งระบบจองออนไลน์ของร้านค้าชุมชน (ข้อมูลสมมติ) มีต้นทุนครั้งเดียว 60,000 บาท และให้ผลประโยชน์ปีละ 25,000 บาท เป็นเวลา 3 ปี ผลประโยชน์สุทธิรวมหลังหักต้นทุนเป็นกี่บาท (ตอบเป็นบาท)
  answer:
    value: 15000
    tolerance: 1
    unit: บาท
  misconceptions:
  - match: 135000
    feedback: บวกต้นทุนเข้าไปแทนการหัก ต้นทุนต้องนำมาหักจากผลประโยชน์
  - match: 75000
    feedback: ลืมนำต้นทุนมาหัก
  hints:
  - รวมผลประโยชน์ทั้งสามปีก่อน
  - หักต้นทุนครั้งเดียวออกจากผลรวมผลประโยชน์
  solution: ผลประโยชน์รวม 25,000 × 3 = 75,000 บาท หักต้นทุน 60,000 บาท เหลือ 15,000 บาท ผลเป็นบวก จึงคุ้มค่าตามหลักการวิเคราะห์ต้นทุนผลประโยชน์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.economic-inquiry.p009
  topics:
  - business.econ.economic-inquiry
  difficulty: 3
  type: numeric
  stem: ตารางให้คะแนนเลือกผู้ขาย (ข้อมูลสมมติ) มี 3 เกณฑ์ ได้แก่ ราคา (น้ำหนัก 0.5 ได้ 4 คะแนน) ความเร็วในการส่ง (น้ำหนัก 0.3 ได้ 3 คะแนน) และความปลอดภัยของสินค้า (น้ำหนัก 0.2 ได้ 5 คะแนน) คะแนนรวมถ่วงน้ำหนักเป็นเท่าไร (ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 3.9
    tolerance: 0.05
    unit: คะแนน
  misconceptions:
  - match: 4.0
    feedback: หาค่าเฉลี่ยธรรมดาโดยไม่ถ่วงน้ำหนัก ต้องคูณคะแนนของแต่ละเกณฑ์ด้วยน้ำหนักก่อนรวม
  hints:
  - คูณคะแนนแต่ละเกณฑ์ด้วยน้ำหนักของเกณฑ์นั้นก่อน
  - 'รวมผลคูณทั้งสามเกณฑ์: 0.5 × 4 + 0.3 × 3 + 0.2 × 5'
  solution: 0.5 × 4 + 0.3 × 3 + 0.2 × 5 = 2.0 + 0.9 + 1.0 = 3.90 คะแนน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.economic-inquiry.p010
  topics:
  - business.econ.economic-inquiry
  difficulty: 3
  type: numeric
  stem: ครอบครัวหนึ่ง (ข้อมูลสมมติ) มีค่าใช้จ่ายรวม 15,000 บาทต่อเดือน ในนั้นค่าอาหารคิดเป็น 40% ถ้าราคาอาหารเพิ่ม 10% โดยครอบครัวไม่เปลี่ยนพฤติกรรม ค่าใช้จ่ายรวมจะเพิ่มขึ้นกี่บาทต่อเดือน (ตอบเป็นบาท)
  answer:
    value: 600.0
    tolerance: 0.5
    unit: บาท
  misconceptions:
  - match: 1500.0
    feedback: คิดว่าราคาที่เพิ่มขึ้นกระทบค่าใช้จ่ายทั้งหมด ทั้งที่กระทบเฉพาะส่วนที่เป็นค่าอาหาร
  hints:
  - หาค่าอาหารต่อเดือนก่อน
  - 'ราคาที่เพิ่ม 10% กระทบเฉพาะค่าอาหาร: 15,000 × 40% × 10%'
  solution: ค่าอาหาร 15,000 × 0.4 = 6,000 บาท เพิ่มขึ้น 10% = 600 บาทต่อเดือน ผลกระทบต่อการเงินครัวเรือนจึงเป็นเพียงส่วนหนึ่งของรายจ่าย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.economic-inquiry.p011
  topics:
  - business.econ.economic-inquiry
  difficulty: 4
  type: mcq
  stem: เดือนที่ราคาข้าวสารสูงขึ้น ยอดขายน้ำอัดลมในร้านค้าชุมชนก็สูงขึ้นด้วย ข้อสรุปใดเหมาะที่สุดในการรายงานผล
  choices:
  - id: a
    text: ราคาข้าวสารทำให้คนดื่มน้ำอัดลมมากขึ้น
    feedback: เป็นการอ้างเหตุและผลที่แรงเกินข้อมูล
  - id: b
    text: ความสัมพันธ์นี้ยังไม่พอสรุปเหตุและผล ควรหาตัวแปรร่วม เช่น เทศกาลหรือฤดูกาล ก่อนสรุป
    correct: true
  - id: c
    text: ราคาข้าวสารกับยอดขายไม่เกี่ยวข้องกันเลย
    feedback: การเคลื่อนไหวพร้อมกันเป็นสิ่งที่ควรพิจารณา
  - id: d
    text: ควรตัดข้อมูลนี้ออกเพราะไม่มีประโยชน์
    feedback: ข้อมูลนี้ให้ประเด็นให้ตรวจสอบต่อได้
  hints:
  - ถามว่ามีเหตุการณ์อื่นที่ทำให้ทั้งสองอย่างเพิ่มขึ้นพร้อมกันหรือไม่
  - การรายงานที่ดีบอกทั้งสิ่งที่พบและสิ่งที่ยังไม่รู้
  solution: ความสัมพันธ์ที่เกิดพร้อมกันอาจมาจากตัวแปรร่วม เช่น เทศกาลที่ทั้งคนซื้อข้าวและซื้อเครื่องดื่มมากขึ้น ควรเก็บข้อมูลเพิ่มก่อนอ้างเหตุและผล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.economic-inquiry.p012
  topics:
  - business.econ.economic-inquiry
  difficulty: 4
  type: numeric
