<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="sans-serif">
<title>เส้นทางของผลงานวิจัยก่อนเป็นความรู้ที่ยอมรับ</title>
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="360.0" y="28.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">เส้นทางของผลงานวิจัยจนเป็นความรู้ที่ยอมรับ</text>
<rect x="40.0" y="85.0" width="180.0" height="70.0" rx="8" fill="#e6f4f1" stroke="#333" stroke-width="1.5"/>
<text x="130.0" y="114.0" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#111">ทำวิจัย</text>
<text x="130.0" y="137.0" font-size="12" text-anchor="middle" fill="#111">เก็บข้อมูล วิเคราะห์</text>
<rect x="270.0" y="85.0" width="180.0" height="70.0" rx="8" fill="#e6f4f1" stroke="#333" stroke-width="1.5"/>
<text x="360.0" y="114.0" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#111">เขียนบทความ</text>
<text x="360.0" y="137.0" font-size="12" text-anchor="middle" fill="#111">ส่งวารสารวิชาการ</text>
<rect x="500.0" y="85.0" width="180.0" height="70.0" rx="8" fill="#e6f4f1" stroke="#333" stroke-width="1.5"/>
<text x="590.0" y="114.0" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#111">ผู้ทรงคุณวุฒิตรวจ</text>
<text x="590.0" y="137.0" font-size="12" text-anchor="middle" fill="#111">วิธีการ ข้อมูล เหตุผล</text>
<rect x="500.0" y="230.0" width="180.0" height="70.0" rx="8" fill="#e6f4f1" stroke="#333" stroke-width="1.5"/>
<text x="590.0" y="259.0" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#111">ตีพิมพ์</text>
<text x="590.0" y="282.0" font-size="12" text-anchor="middle" fill="#111">เผยแพร่ให้ทุกคนตรวจสอบ</text>
<rect x="270.0" y="230.0" width="180.0" height="70.0" rx="8" fill="#e6f4f1" stroke="#333" stroke-width="1.5"/>
<text x="360.0" y="259.0" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#111">คนอื่นทำซ้ำ</text>
<text x="360.0" y="282.0" font-size="12" text-anchor="middle" fill="#111">ได้ผลเหมือนเดิมหรือไม่</text>
<rect x="40.0" y="230.0" width="180.0" height="70.0" rx="8" fill="#e6f4f1" stroke="#333" stroke-width="1.5"/>
<text x="130.0" y="259.0" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#111">ยอมรับหรือปรับปรุง</text>
<text x="130.0" y="282.0" font-size="12" text-anchor="middle" fill="#111">ความรู้เปลี่ยนได้เสมอ</text>
<line x1="220.0" y1="120.0" x2="268.0" y2="120.0" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<line x1="450.0" y1="120.0" x2="498.0" y2="120.0" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<line x1="590.0" y1="155.0" x2="590.0" y2="228.0" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<text x="600.0" y="197.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#0f766e">ผ่าน</text>
<line x1="498.0" y1="265.0" x2="452.0" y2="265.0" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<line x1="268.0" y1="265.0" x2="222.0" y2="265.0" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 590 85 C 590 52, 360 52, 360 83" fill="none" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="475.0" y="52.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#b91c1c">แก้ไขแล้วส่งใหม่ หรือถูกปฏิเสธ</text>
<path d="M 130 302 C 130 360, 360 380, 360 302" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="245.0" y="372.0" font-size="12.5" text-anchor="middle" fill="#0f766e">หลักฐานใหม่ทำให้เกิดคำถามใหม่</text>
</svg>
