  - id: health.safety.home-school-play.p013
    topics: [health.safety.home-school-play]
    difficulty: 4
    type: mcq
    stem: "เพื่อนล้มที่บันไดตึก 2 ข้อเท้าบวมมาก เดินไม่ได้ ประโยคใดเป็นการขอความช่วยเหลือจากครูที่ดีที่สุด"
    choices:
      - { id: a, text: "\"ครูครับ ช่วยด้วยครับ มิ้นท์ตกบันไดตึก 2 ข้อเท้าบวมมาก เดินไม่ได้ครับ\"", correct: true }
      - { id: b, text: "\"ครูครับ มีเรื่องครับ\"", feedback: "ครูยังไม่รู้ว่าเกิดอะไรและที่ไหน ทำให้ช่วยได้ช้า" }
      - { id: c, text: "\"ครูครับ มิ้นท์ซนอีกแล้วครับ\"", feedback: "ประโยคนี้ไม่ได้บอกว่าเพื่อนบาดเจ็บ และเป็นการกล่าวโทษเพื่อน" }
      - { id: d, text: "\"ช่วยด้วย!\" แล้ววิ่งกลับไปเฉย ๆ", feedback: "ควรบอกให้ครบว่าเกิดอะไร ที่ไหน และพาครูไปที่เกิดเหตุ" }
    hints:
      - "ประโยคที่ดีบอก ใคร เกิดอะไร ที่ไหน และอาการ"
      - "พูดสุภาพและชัดเจน"
    solution: "ประโยคแรกบอกครบว่าใครบาดเจ็บ เกิดอะไร ที่ไหน และอาการเป็นอย่างไร ครูจึงเตรียมการช่วยได้ทันที"
