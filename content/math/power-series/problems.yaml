  stem: 'นักวิทยาศาสตร์ในนครปฐมจำลองความเข้มสัญญาณด้วยอนุกรมกำลัง $\sum c_n x^n$ ซึ่งลู่เข้าเมื่อ $|x|<3$ (ข้อมูลสมมติ) ถ้าต้องการหาอนุพันธ์ของแบบจำลองนี้ทีละพจน์ รัศมีการลู่เข้าของอนุกรมอนุพันธ์จะเป็นเท่าใด'
