problems:
- id: thai.reading.word-meaning-in-context.p001
  topics:
  - thai.reading.word-meaning-in-context
  difficulty: 1
  type: mcq
  stem: '"ไก่**ขัน**ตอนเช้าทุกวัน" คำว่า ขัน ในประโยคนี้หมายถึงอะไร'
  choices:
  - id: a
    text: เสียงร้องของไก่
    correct: true
    feedback: ถูก ไก่ขันคือไก่ร้องเสียงดัง
  - id: b
    text: ภาชนะสำหรับตักน้ำ
    feedback: เป็นความหมายหนึ่งของ ขัน แต่ไก่ไม่ได้ทำภาชนะ
  - id: c
    text: น่าหัวเราะ
    feedback: ใช้ในประโยค "เรื่องนี้น่าขัน" ไม่ใช่กับไก่
  - id: d
    text: หมุนให้แน่น
    feedback: ใช้กับน็อตหรือเกลียว ไม่ใช่กับไก่
  hints:
  - ใครเป็นผู้ทำ ขัน ในประโยค
  - ไก่ทำอะไรตอนเช้า
  solution: ประโยคพูดถึงไก่ตอนเช้า ขัน จึงหมายถึง **เสียงร้องของไก่**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.word-meaning-in-context.p002
  topics:
  - thai.reading.word-meaning-in-context
  difficulty: 1
  type: match
  stem: จับคู่ประโยคกับความหมายของคำว่า **ตา**
  pairs:
  - left: ฝุ่นเข้าตาจนแสบ
    right: อวัยวะที่ใช้มอง
  - left: ตาของฉันเป็นพ่อของแม่
    right: ญาติผู้ชายฝ่ายแม่
  - left: ตานี้ถึงฉันเดินหมาก
    right: รอบหรือครั้งในการเล่น
  hints:
  - อ่านคำรอบ ๆ คำว่า ตา
  - ฝุ่น พ่อของแม่ เดินหมาก บอกอะไร
  solution: ฝุ่นเข้าตา = อวัยวะ · ตาเป็นพ่อของแม่ = ญาติ · ตานี้ถึงฉันเดิน = รอบในการเล่น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.word-meaning-in-context.p003
  topics:
  - thai.reading.word-meaning-in-context
  difficulty: 2
  type: mcq
  stem: '"พี่ชายเป็น**หนอนหนังสือ** วันหยุดอยู่แต่ในห้องสมุด" คำว่า หนอนหนังสือ หมายถึงอะไร'
  choices:
  - id: a
    text: คนที่ชอบอ่านหนังสือมาก
    correct: true
    feedback: ถูก เป็นความหมายโดยนัย บริบทบอกว่าอยู่แต่ในห้องสมุด
  - id: b
    text: หนอนที่กัดกินกระดาษ
    feedback: เป็นความหมายโดยตรง แต่พี่ชายเป็นคน ไม่ใช่หนอน
  - id: c
    text: คนที่ทำหนังสือขาด
    feedback: ประโยคไม่ได้พูดถึงการทำหนังสือเสีย
  - id: d
    text: คนขี้เกียจ
    feedback: อยู่ในห้องสมุดทั้งวันไม่ได้บอกว่าขี้เกียจ
  hints:
  - พี่ชายเป็นหนอนจริงได้ไหม
  - ถ้าเป็นไปไม่ได้ แปลว่าใช้ความหมายโดยนัย ดูว่าพี่ทำอะไร
  solution: คนเป็นหนอนไม่ได้ จึงเป็นความหมายโดยนัย บริบท "อยู่แต่ในห้องสมุด" บอกว่าหมายถึง **คนที่ชอบอ่านหนังสือมาก**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.word-meaning-in-context.p004
  topics:
  - thai.reading.word-meaning-in-context
  difficulty: 2
  type: mcq
  stem: ประโยคใดใช้การเปรียบเทียบแบบ **อุปมา**
  choices:
  - id: a
    text: น้ำในบึงใสราวกับกระจก
    correct: true
    feedback: ถูก มีคำว่า ราวกับ เปรียบว่าเหมือน
  - id: b
    text: ครูคือแม่พิมพ์ของชาติ
    feedback: ใช้คำว่า คือ เป็นอุปลักษณ์
  - id: c
    text: สายลมกระซิบแผ่วเบา
    feedback: ลมกระซิบเหมือนคน เป็นบุคคลวัต
  - id: d
    text: น้ำในบึงใสมาก
    feedback: บอกตรง ๆ ไม่มีการเปรียบเทียบ
  hints:
  - อุปมาเปรียบว่า "เหมือน" อีกสิ่งหนึ่ง
  - หาคำ เหมือน ดุจ ราวกับ
  solution: '**น้ำในบึงใสราวกับกระจก** ใช้คำ ราวกับ เปรียบน้ำว่าใสเหมือนกระจก จึงเป็นอุปมา'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.word-meaning-in-context.p005
  topics:
  - thai.reading.word-meaning-in-context
  difficulty: 2
  type: text
  stem: '"ดวงตาของน้องเป็นประกายดุจดวงดาว" พิมพ์ **คำเชื่อม** ที่แสดงการเปรียบเทียบในประโยคนี้'
  accepted:
  - ดุจ
  misconceptions:
  - match: เป็นประกาย
    feedback: เป็นประกาย บอกลักษณะของดวงตา ไม่ใช่คำเชื่อมการเปรียบเทียบ
  - match: ดวงดาว
    feedback: ดวงดาวคือสิ่งที่นำมาเปรียบ คำเชื่อมอยู่หน้าคำนี้
  hints:
  - อะไรเปรียบกับอะไร
  - หาคำที่อยู่ระหว่าง ดวงตา กับ ดวงดาว ที่มีความหมายว่า เหมือน
  solution: คำเชื่อมคือ **ดุจ** (แปลว่า เหมือน) เป็นอุปมา เปรียบดวงตากับดวงดาว
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.word-meaning-in-context.p006
  topics:
  - thai.reading.word-meaning-in-context
  difficulty: 3
  type: mcq
  stem: '"หมู่บ้านบนดอยแห่งนี้**ทุรกันดาร** ถนนเป็นดินลูกรัง ไม่มีไฟฟ้า หน้าฝนรถเข้าไม่ถึง" คำว่า ทุรกันดาร น่าจะหมายถึงอะไร'
  choices:
  - id: a
    text: ไปมาลำบากและห่างไกลความเจริญ
    correct: true
    feedback: ถูก ทุกข้อความที่ตามมาบอกความลำบาก
  - id: b
    text: มีอากาศหนาวเย็น
    feedback: บนดอยอาจหนาว แต่บริบทพูดถึงถนนและไฟฟ้า
  - id: c
    text: มีธรรมชาติสวยงาม
    feedback: ข้อความไม่ได้ชมความสวยงาม
  - id: d
    text: มีคนอาศัยหนาแน่น
    feedback: ไม่มีข้อความใดพูดถึงจำนวนคน
  hints:
  - อ่านข้อความหลังคำว่า ทุรกันดาร
  - ถนนลูกรัง ไม่มีไฟฟ้า รถเข้าไม่ถึง บอกลักษณะอะไรร่วมกัน
  solution: รายละเอียดทุกข้อบอกว่าเดินทางยากและไม่มีสาธารณูปโภค ทุรกันดาร จึงหมายถึง **ไปมาลำบาก ห่างไกลความเจริญ** (ตรงกับพจนานุกรมฉบับราชบัณฑิตยสถาน)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.word-meaning-in-context.p007
  topics:
  - thai.reading.word-meaning-in-context
  difficulty: 3
  type: match
  stem: จับคู่ข้อความกับ **โวหาร**
  pairs:
  - left: เช้านี้ฝนตก น้องจึงกางร่มเดินไปโรงเรียน
    right: บรรยายโวหาร
  - left: ทุ่งข้าวสีทองไหวเอนตามลม กลิ่นรวงข้าวหอมอ่อน ๆ ลอยมาทั่วหมู่บ้าน
    right: พรรณนาโวหาร
  - left: เราควรปิดน้ำทุกครั้งหลังใช้ เพราะน้ำจืดมีจำกัด
    right: เทศนาโวหาร
  - left: ความเพียรทำให้สำเร็จ ดูอย่างเต่าที่เดินช้าแต่ไม่หยุดจนชนะกระต่าย
    right: สาธกโวหาร
  hints:
  - ถามว่าข้อความต้องการทำอะไร เล่า ให้เห็นภาพ สั่งสอน หรือยกตัวอย่าง
  - ข้อความที่มี "ดูอย่าง..." กำลังยกตัวอย่าง
  solution: เล่าเหตุการณ์ = **บรรยาย** · ให้เห็นภาพและได้กลิ่น = **พรรณนา** · สั่งสอนว่าควรทำ = **เทศนา** · ยกนิทานเต่ามาประกอบ = **สาธก**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.word-meaning-in-context.p008
  topics:
  - thai.reading.word-meaning-in-context
  difficulty: 3
  type: mcq
  stem: ข้อความใดเป็น **พรรณนาโวหาร**
  choices:
  - id: a
    text: ตลาดน้ำยามเช้าคึกคัก เรือบรรทุกผลไม้สีสดเบียดกันเต็มคลอง เสียงแม่ค้าร้องเรียกลูกค้าดังแข่งกับเสียงพาย
    correct: true
    feedback: ถูก ให้เห็นภาพ สี และเสียง
  - id: b
    text: ตลาดน้ำเปิดตั้งแต่เจ็ดโมงเช้าถึงเที่ยง
    feedback: บอกข้อมูลตรง ๆ เป็นการบรรยาย
  - id: c
    text: เราควรช่วยกันรักษาความสะอาดของคลอง
    feedback: เป็นการสั่งสอน (เทศนาโวหาร)
  - id: d
    text: ตลาดน้ำมีหลายแห่ง เช่น ดำเนินสะดวก อัมพวา
    feedback: ยกตัวอย่างสั้น ๆ ไม่ได้ให้เห็นภาพ
  hints:
  - พรรณนาทำให้ผู้อ่านเห็นภาพหรือได้ยินเสียงตาม
  - หาข้อความที่มีรายละเอียดเรื่องสี เสียง หรือบรรยากาศ
  solution: ข้อความแรกบรรยายสีผลไม้ เรือที่เบียดกัน และเสียงแม่ค้า ทำให้เห็นภาพตลาดน้ำ จึงเป็น **พรรณนาโวหาร**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.word-meaning-in-context.p009
  topics:
  - thai.reading.word-meaning-in-context
  difficulty: 3
  type: mcq
  stem: ประโยคใดใช้คำว่า **เสือ** ในความหมายโดยนัย
  choices:
  - id: a
    text: พี่ตูนเป็นเสือว่ายน้ำของโรงเรียน ได้เหรียญทองทุกปี
    correct: true
    feedback: ถูก หมายถึงคนเก่ง
  - id: b
    text: เสือในสวนสัตว์นอนอยู่ใต้ต้นไม้
    feedback: เป็นสัตว์จริง ความหมายโดยตรง
  - id: c
    text: ลายของเสือโคร่งเป็นสีส้มสลับดำ
    feedback: พูดถึงสัตว์ ความหมายโดยตรง
  - id: d
    text: ป่าแห่งนี้มีเสืออาศัยอยู่หลายตัว
    feedback: พูดถึงสัตว์จริง
  hints:
  - ความหมายโดยตรงของเสือคือสัตว์
  - ประโยคใดที่ เสือ ไม่ใช่สัตว์จริง
  solution: พี่ตูนเป็นคน จึงไม่ใช่เสือจริง **เสือว่ายน้ำ** หมายถึงคนที่ว่ายน้ำเก่งมาก (พจนานุกรมให้ความหมายโดยปริยายว่าคนเก่ง)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.word-meaning-in-context.p010
  topics:
  - thai.reading.word-meaning-in-context
  difficulty: 3
  type: mcq
  stem: อ่านบทความในภาพ คำว่า **คายน้ำ** น่าจะหมายถึงอะไร
  figure:
    src: desert-plants.svg
    alt: 'บทความสั้นเรื่องพืชในทะเลทราย 4 บรรทัด: ทะเลทรายมีฝนตกน้อยมาก พืชที่อยู่ได้จึงต้องปรับตัวให้ทนแล้ง / กระบองเพชรเก็บน้ำไว้ในลำต้นที่อวบหนา และมีหนามแทนใบ / ใบที่แผ่กว้างทำให้น้ำในต้นระเหยออกไปเป็นไอได้มาก / หนามช่วยลดการคายน้ำ พืชจึงเก็บน้ำไว้ได้นานในหน้าแล้ง'
  choices:
  - id: a
    text: การที่น้ำในต้นออกไปเป็นไอ
    correct: true
    feedback: ถูก บรรทัดก่อนหน้าบอกว่าใบทำให้น้ำระเหยออกไปเป็นไอ หนามจึงช่วยลดสิ่งนี้
  - id: b
    text: การดูดน้ำจากดิน
    feedback: ถ้าเป็นการดูดน้ำ พืชคงไม่ต้องการลด
  - id: c
    text: การเก็บน้ำไว้ในลำต้น
    feedback: เป็นวิธีที่กระบองเพชรใช้ แต่ไม่ใช่สิ่งที่หนามช่วยลด
  - id: d
    text: การรดน้ำต้นไม้
    feedback: บทความไม่ได้พูดถึงคนรดน้ำ
  hints:
  - หนามช่วย "ลด" อะไร ถ้าลดแล้วพืชเก็บน้ำได้นาน
  - ย้อนอ่านบรรทัดที่ 3 ว่าใบที่แผ่กว้างทำให้เกิดอะไร
  solution: บรรทัดที่ 3 บอกว่าใบกว้างทำให้น้ำระเหยออกเป็นไอมาก กระบองเพชรจึงมีหนามแทนใบเพื่อ **ลดการที่น้ำออกจากต้นเป็นไอ** ซึ่งคือการคายน้ำ (ตัวช่วยแบบเหตุและผล)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.word-meaning-in-context.p011
  topics:
  - thai.reading.word-meaning-in-context
  difficulty: 4
  type: mcq
  stem: '"พี่เป็นคนประหยัด **แต่** น้อง**สุรุ่ยสุร่าย** ได้เงินมาเท่าไรก็ใช้หมด" ตัวช่วยใดบอกความหมายของ สุรุ่ยสุร่าย ได้ดีที่สุด'
  choices:
  - id: a
    text: 'คำตรงข้าม: แต่ กับ ประหยัด และข้อความที่ตามมา'
    correct: true
    feedback: ถูก แต่ บอกว่าน้องตรงข้ามกับพี่ที่ประหยัด และ "ใช้หมด" ยืนยัน
  - id: b
    text: คำอธิบายในวงเล็บ
    feedback: ประโยคนี้ไม่มีวงเล็บหรือคำว่า คือ
  - id: c
    text: ตัวอย่างที่ขึ้นต้นด้วย เช่น
    feedback: ประโยคนี้ไม่มีคำว่า เช่น
  - id: d
    text: ไม่มีตัวช่วย ต้องเปิดพจนานุกรมอย่างเดียว
    feedback: บริบทให้ตัวช่วยไว้แล้ว
  hints:
  - ดูคำเชื่อมระหว่างพี่กับน้อง
  - แต่ บอกว่าสองอย่างตรงข้ามกัน
  solution: คำว่า **แต่** บอกว่าน้องตรงข้ามกับพี่ที่ประหยัด และ "ได้เงินเท่าไรก็ใช้หมด" ยืนยัน สุรุ่ยสุร่าย จึงหมายถึงใช้เงินสิ้นเปลือง (ตัวช่วยแบบคำตรงข้าม)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.word-meaning-in-context.p012
  topics:
  - thai.reading.word-meaning-in-context
  difficulty: 4
  type: match
  stem: จับคู่ประโยคกับชนิดของ **การเปรียบเทียบ**
  pairs:
  - left: ใจของแม่ดุจน้ำเย็น
    right: อุปมา
  - left: ห้องสมุดคือขุมทรัพย์ของนักเรียน
    right: อุปลักษณ์
  - left: ดวงจันทร์ยิ้มให้เราอยู่บนฟ้า
    right: บุคคลวัต
