problems:
- id: chinese.vocab.greetings.p001
  topics:
  - chinese.vocab.greetings
  difficulty: 1
  type: mcq
  stem: 谢谢 (xièxie) แปลว่าอะไร
  choices:
  - id: a
    text: ลาก่อน
    feedback: ลาก่อนคือ 再见 zàijiàn
  - id: b
    text: ไม่เป็นไร
    feedback: ไม่เป็นไรคือ 没关系 méi guānxi ใช้ตอบคำขอโทษ
  - id: c
    text: ขอบคุณ
    correct: true
    feedback: ถูก 谢谢 xièxie คือคำขอบคุณ
  - id: d
    text: ขอโทษ
    feedback: ขอโทษคือ 对不起 duìbuqǐ
  hints:
  - คำนี้ใช้เมื่อมีคนช่วยเราหรือให้ของเรา
  - คำตอบของคำนี้คือ 不客气 bú kèqi
  solution: 谢谢 xièxie = **ขอบคุณ** (พยางค์ที่สองเป็นเสียงเบา) ตอบด้วย 不客气 bú kèqi
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.greetings.p002
  topics:
  - chinese.vocab.greetings
  difficulty: 1
  type: match
  stem: จับคู่คำภาษาจีนกับความหมาย
  pairs:
  - left: 你好 nǐ hǎo
    right: สวัสดี
  - left: 谢谢 xièxie
    right: ขอบคุณ
  - left: 对不起 duìbuqǐ
    right: ขอโทษ
  - left: 没关系 méi guānxi
    right: ไม่เป็นไร
  - left: 再见 zàijiàn
    right: ลาก่อน
  hints:
  - 'เริ่มจากคำที่รู้จักแล้ว: 你好 คือคำทักทาย'
  - 对不起 กับ 没关系 เป็นคู่กัน คนหนึ่งขอโทษ อีกคนตอบ
  solution: 你好 สวัสดี · 谢谢 ขอบคุณ · 对不起 ขอโทษ · 没关系 ไม่เป็นไร · 再见 ลาก่อน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.greetings.p003
  topics:
  - chinese.vocab.greetings
  difficulty: 1
  type: mcq
  stem: เพื่อนชาวจีนพูดกับเราว่า 谢谢！ เราควรตอบว่าอะไร
  choices:
  - id: a
    text: 不客气！ bú kèqi
    correct: true
    feedback: ถูก แปลว่า ไม่ต้องเกรงใจ ใช้ตอบคำขอบคุณ
  - id: b
    text: 没关系！ méi guānxi
    feedback: 没关系 ใช้ตอบคำขอโทษ 对不起
  - id: c
    text: 对不起！ duìbuqǐ
    feedback: 对不起 คือขอโทษ เพื่อนไม่ได้ทำอะไรผิด
  - id: d
    text: 再见！ zàijiàn
    feedback: 再见 ใช้ตอนแยกจากกัน
  hints:
  - คนไทยตอบคำขอบคุณว่า ไม่เป็นไร หรือ ยินดี แต่ภาษาจีนมีคำเฉพาะ
  - คำตอบแปลตรงตัวว่า ไม่ต้องเกรงใจ
  solution: 谢谢 → **不客气** bú kèqi (ไม่ต้องเกรงใจ) หรือ 不用谢 bú yòng xiè
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.greetings.p004
  topics:
  - chinese.vocab.greetings
  difficulty: 1
  type: hanzi
  stem: เขียนอักษร 好 (hǎo) ที่แปลว่า ดี ตามลำดับขีด อักษรนี้อยู่ใน 你好 และ 您好
  character: 好
  pinyin: hǎo
  meaning: ดี
  hints:
  - '好 มี 2 ส่วน: 女 ทางซ้าย และ 子 ทางขวา รวม 6 ขีด'
  - 'เขียนซ้ายก่อนขวา: 女 3 ขีด (撇点 撇 提) แล้วจึงเขียน 子 3 ขีด (横撇 竖钩 横)'
  solution: 'ซ้าย 女: 撇点 → 撇 → 提 (ขีดนอนของ 女 เปลี่ยนเป็นขีดตวัดขึ้นเมื่ออยู่ทางซ้าย) · ขวา 子: 横撇 → 竖钩 → 横 รวม 6 ขีด'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.greetings.p005
  topics:
  - chinese.vocab.greetings
  difficulty: 2
  type: mcq
  stem: ตอนเช้า คุณครูภาษาจีนเดินเข้าห้องเรียน นักเรียนทั้งห้องควรทักทายว่าอะไร
  choices:
  - id: a
    text: 谢谢老师！
    feedback: ใช้เมื่อครูช่วยหรือให้ของ ไม่ใช่การทักทาย
  - id: b
    text: 没关系，老师！
    feedback: 没关系 ใช้ตอบคำขอโทษ
  - id: c
    text: 老师好！ lǎoshī hǎo
    correct: true
    feedback: ถูก คนจีนทักผู้ใหญ่ด้วยตำแหน่งหรือคำเรียก + 好 ครูมักตอบว่า 同学们好
  - id: d
    text: 再见，老师！
    feedback: 再见 ใช้ตอนเลิกเรียนหรือแยกจากกัน
  hints:
  - นักเรียนจีนทักผู้ใหญ่โดยเรียกตำแหน่งแล้วตามด้วยคำว่า ดี
  - 老师 lǎoshī แปลว่า ครู
  solution: '**老师好！** lǎoshī hǎo (สวัสดีครับ/ค่ะคุณครู) ครูตอบว่า 同学们好 tóngxuémen hǎo'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.greetings.p006
  topics:
  - chinese.vocab.greetings
  difficulty: 2
  type: match
  stem: จับคู่คำพูดกับคำตอบที่เหมาะสม
  pairs:
  - left: 谢谢！
    right: 不客气！
  - left: 对不起！
    right: 没关系！
  - left: 你好！
    right: 你好！
  - left: 再见！
    right: 再见！
  hints:
  - คำทักทายและคำลาตอบด้วยคำเดิมได้
  - คำขอบคุณกับคำขอโทษมีคำตอบเฉพาะ
  solution: 谢谢 → 不客气 · 对不起 → 没关系 · 你好 → 你好 · 再见 → 再见
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.greetings.p007
  topics:
  - chinese.vocab.greetings
  difficulty: 2
  type: text
  stem: พนักงานร้านอาหารในเยาวราชอยากพูดว่า **ลาก่อน** กับลูกค้าชาวจีนที่กำลังออกจากร้าน ต้องพูดคำใด (พิมพ์อักษรจีน 2 ตัว)
  accepted:
  - 再见
  - 再見
  - 再见！
  - 再见!
  misconceptions:
  - match: 谢谢
    feedback: 谢谢 คือขอบคุณ ส่วนลาก่อนคือ 再 (อีก) + 见 (พบ)
  - match: 你好
    feedback: 你好 ใช้ตอนพบกัน ไม่ใช่ตอนลา
  hints:
  - คำลาก่อนแปลตรงตัวว่า พบกันอีก
  - อักษรตัวแรกแปลว่า อีกครั้ง อ่านว่า zài ตัวที่สองแปลว่า พบ อ่านว่า jiàn
  solution: '**再见** zàijiàn (再 อีก + 见 พบ) พนักงานอาจพูดเพิ่มว่า 慢走 mànzǒu (เดินทางดี ๆ นะ)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.greetings.p008
  topics:
  - chinese.vocab.greetings
  difficulty: 2
  type: mcq
  stem: พินอินของ 对不起 (ขอโทษ) ข้อใดถูกต้อง
  choices:
  - id: a
    text: duìbuqì
    feedback: 起 เป็นเสียง 3 ไม่ใช่เสียง 4
  - id: b
    text: duìbuqǐ
    correct: true
    feedback: ถูก 不 ในคำนี้เป็นเสียงเบา
  - id: c
    text: tuìbuqǐ
    feedback: เสียง ต ไม่มีลมเขียนด้วย d ส่วน t ใกล้เสียง ท
  - id: d
    text: duìbuxǐ
    feedback: พยางค์สุดท้ายขึ้นต้นด้วย q (ใกล้ ช มีลม) ไม่ใช่ x (ใกล้ ซ)
  hints:
  - ตุ้ย ในคำอ่านภาษาไทยเป็นเสียง ต ซึ่งไม่มีลม
  - 起 qǐ แปลว่า ลุกขึ้น เป็นเสียง 3
  solution: 对不起 = **duìbuqǐ** (d ไม่มีลม ใกล้ ต · 不 เสียงเบา · 起 qǐ เสียง 3) คำอ่านไทยโดยประมาณ ตุ้ยปู้ฉี่
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.greetings.p009
  topics:
  - chinese.vocab.greetings
  difficulty: 2
  type: mcq
  stem: พนักงานโรงแรมในพัทยาต้อนรับคุณยายชาวจีนวัย 70 ปี ควรทักทายแบบใดจึงสุภาพที่สุด
  choices:
  - id: a
    text: 拜拜！
    feedback: 拜拜 ใช้ตอนลา และเป็นภาษาไม่เป็นทางการ
  - id: b
    text: 你好！ nǐ hǎo
    feedback: ใช้ได้ แต่ 您好 สุภาพกว่าเมื่อพูดกับผู้สูงอายุหรือลูกค้า
  - id: c
    text: 您好！ nín hǎo
    correct: true
    feedback: ถูก 您 เป็นสรรพนาม คุณ แบบสุภาพ ใช้กับผู้สูงอายุ ลูกค้า และคนที่ไม่สนิท
  - id: d
    text: 你好吗？ nǐ hǎo ma
    feedback: เป็นคำถามว่าสบายดีไหม ใช้กับคนรู้จัก ไม่ใช่คำต้อนรับแขกครั้งแรก
  hints:
  - ภาษาจีนมีคำว่า คุณ 2 แบบ แบบธรรมดาและแบบสุภาพ
  - แบบสุภาพเขียน 你 แล้วมี 心 (หัวใจ) อยู่ข้างล่าง
  solution: '**您好** nín hǎo สุภาพกว่า 你好 เหมาะกับผู้สูงอายุ ลูกค้า และผู้ใหญ่ที่ไม่สนิท'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.greetings.p010
  topics:
  - chinese.vocab.greetings
  difficulty: 3
  type: mcq
  stem: บนรถไฟฟ้า BTS เราเดินชนนักท่องเที่ยวชาวจีนเบา ๆ เขาพูดว่า 对不起！ เราควรตอบว่าอะไร
  choices:
  - id: a
    text: 不客气！
    feedback: 不客气 ใช้ตอบคำขอบคุณ ไม่ใช่คำขอโทษ
  - id: b
    text: 谢谢！
    feedback: เขาไม่ได้ช่วยอะไรเรา จึงไม่ต้องขอบคุณ
  - id: c
    text: 你好！
    feedback: 你好 เป็นคำทักทาย ไม่ใช่คำตอบคำขอโทษ
  - id: d
    text: 没关系！ méi guānxi
    correct: true
    feedback: ถูก แปลว่า ไม่เป็นไร ใช้ตอบคำขอโทษ
  hints:
  - คนไทยตอบคำขอโทษว่า ไม่เป็นไร
  - ในภาษาจีน คำนี้แปลตรงตัวว่า ไม่มีความเกี่ยวข้อง
  solution: 对不起 → **没关系** méi guānxi (ไม่เป็นไร) คนไทยมักใช้ ไม่เป็นไร ทั้งตอบคำขอบคุณและคำขอโทษ แต่ภาษาจีนแยกกัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.greetings.p011
  topics:
  - chinese.vocab.greetings
  difficulty: 3
  type: order
  stem: เรียงบทสนทนาในร้านขายของฝากที่สำเพ็งให้ถูกลำดับ ตั้งแต่ลูกค้าชาวจีนเดินเข้าร้านจนออกจากร้าน
  items:
  - 店员 (พนักงาน)：欢迎光临！
  - 顾客 (ลูกค้า)：你好！
  - 顾客 (ลูกค้า)：谢谢！
  - 店员 (พนักงาน)：不客气。
  - 顾客 (ลูกค้า)：再见！
  hints:
  - 欢迎光临 huānyíng guānglín แปลว่า ยินดีต้อนรับ พนักงานพูดเมื่อลูกค้าเดินเข้าร้าน
  - ขอบคุณมาก่อนคำตอบ 不客气 และคำลามาท้ายสุด
  solution: 欢迎光临 (ยินดีต้อนรับ) → 你好 (สวัสดี) → 谢谢 (ขอบคุณ หลังได้ของ) → 不客气 (ไม่ต้องเกรงใจ) → 再见 (ลาก่อน)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.greetings.p012
  topics:
  - chinese.vocab.greetings
  difficulty: 3
  type: mcq
  stem: นักเรียนไทยไปรับแขกชาวจีนจากโรงเรียนพี่น้องที่สนามบิน ควรทำท่าทางใดคู่กับคำว่า 您好 จึงเหมาะกับวัฒนธรรมจีน
  choices:
  - id: a
    text: ไม่ต้องมองหน้า แล้วเดินนำไปเลย
    feedback: ไม่สุภาพ ควรสบตา ยิ้ม และทักทายก่อน
  - id: b
    text: ยิ้ม พยักหน้าเล็กน้อย และจับมือถ้าอีกฝ่ายยื่นมือมา
    correct: true
    feedback: ถูก คนจีนทักทายด้วยการยิ้ม พยักหน้า และจับมือ ผู้ใหญ่มักเป็นฝ่ายยื่นมือก่อน
  - id: c
    text: กอดและหอมแก้ม
    feedback: เป็นธรรมเนียมของบางประเทศในยุโรป คนจีนส่วนใหญ่ไม่ทำกับคนที่เพิ่งพบ
  - id: d
    text: โค้งตัวลึก 90 องศา
    feedback: การโค้งลึกพบในวัฒนธรรมญี่ปุ่นมากกว่า
  hints:
  - คนจีนไม่ไหว้แบบไทย
  - นึกถึงท่าทางทักทายที่คนจีนทำในการพบกันครั้งแรก
  solution: ทักว่า 您好 พร้อม **ยิ้ม พยักหน้า และจับมือ** (ผู้ใหญ่มักยื่นมือก่อน) การไหว้ไม่ผิด แต่ไม่ใช่ธรรมเนียมจีน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.greetings.p013
  topics:
  - chinese.vocab.greetings
  difficulty: 3
  type: mcq
  stem: เวลา 7 โมงเช้า เราพบเพื่อนชาวจีนหน้าโรงเรียน คำทักทายข้อใดเหมาะที่สุด
  choices:
  - id: a
    text: 晚安！ wǎn'ān
    feedback: 晚安 แปลว่า ราตรีสวัสดิ์ ใช้ก่อนเข้านอน
  - id: b
    text: 再见！ zàijiàn
    feedback: 再见 ใช้ตอนแยกจากกัน ไม่ใช่ตอนพบกัน
  - id: c
    text: 早上好！ zǎoshang hǎo
    correct: true
    feedback: ถูก 早上 แปลว่า ตอนเช้า ใช้ทักทายในตอนเช้า
  - id: d
    text: 晚上好！ wǎnshang hǎo
    feedback: 晚上 แปลว่า ตอนเย็นหรือกลางคืน
  hints:
  - 早 zǎo แปลว่า เช้า
  - 晚 wǎn แปลว่า เย็นหรือดึก
  solution: '**早上好** zǎoshang hǎo = สวัสดีตอนเช้า (พูดสั้น ๆ ว่า 早！ zǎo ก็ได้) · 晚上好 = สวัสดีตอนเย็น · 晚安 = ราตรีสวัสดิ์'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.greetings.p014
  topics:
  - chinese.vocab.greetings
  difficulty: 3
  type: hanzi
  stem: เขียนอักษร 见 (jiàn) ที่แปลว่า พบ เห็น ตามลำดับขีด อักษรนี้อยู่ใน 再见 (ลาก่อน)
  character: 见
  pinyin: jiàn
  meaning: พบ เห็น
  hints:
  - 见 มี 4 ขีด เริ่มจากกรอบด้านบน
  - ขีดตั้งซ้าย → 横折 ด้านบนขวา → 撇 ตวัดลงซ้าย → ขีดสุดท้ายลากลงแล้วโค้งไปขวาและเกี่ยวขึ้น
  solution: 竖 → 横折 → 撇 → 竖弯钩 (ลากลง โค้งไปทางขวา แล้วเกี่ยวขึ้น) รวม 4 ขีด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.greetings.p015
  topics:
  - chinese.vocab.greetings
  difficulty: 4
  type: mcq
  stem: 不客气 สะกดเสียงเดิมว่า bù + kèqi แต่ในหนังสือเรียนส่วนใหญ่เขียนว่า bú kèqi เพราะอะไร
  choices:
  - id: a
    text: 不 อยู่หน้าพยางค์เสียง 4 (客 kè) จึงเปลี่ยนเป็นเสียง 2
    correct: true
    feedback: ถูก กฎ 不 + เสียง 4 → bú
  - id: b
    text: 不 ในคำนี้เป็นเสียงเบา
    feedback: เสียงเบาในคำนี้คือ 气 qi ไม่ใช่ 不
  - id: c
    text: คำว่า 客气 เป็นเสียง 3 ติดกัน
    feedback: 客 kè เป็นเสียง 4 และ 气 เป็นเสียงเบา ไม่มีเสียง 3
  - id: d
    text: 不 เปลี่ยนเป็นเสียง 2 ทุกครั้ง
    feedback: 不 เปลี่ยนเฉพาะเมื่ออยู่หน้าเสียง 4 เช่น 不好 ยังอ่าน bù hǎo
  hints:
  - ดูเสียงวรรณยุกต์ของพยางค์ที่อยู่หลัง 不
  - ทบทวนกฎเปลี่ยนเสียงของ 不 ในบทพินอินและวรรณยุกต์
  solution: 客 kè เป็น **เสียง 4** และ 不 ที่อยู่หน้าเสียง 4 อ่านเป็นเสียง 2 จึงได้ **bú kèqi** (气 เป็นเสียงเบา)
