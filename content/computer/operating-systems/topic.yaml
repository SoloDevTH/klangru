id: computer.systems.operating-systems
subject: computer
title: { th: ระบบปฏิบัติการและชั้นของซอฟต์แวร์, en: "Operating systems and software layers" }
summary: ชั้นของฮาร์ดแวร์ ซอฟต์แวร์ระบบ และซอฟต์แวร์ประยุกต์ หน้าที่ของระบบปฏิบัติการ การเรียกใช้บริการของระบบ สถานะของกระบวนการ การจัดคิวแบบมาก่อนได้ก่อน งานสั้นก่อน และวนรอบ
difficulty: 4.5
minutes: 45
prerequisites: [computer.systems.computer-systems]
encompasses:
  - { id: computer.systems.computer-systems, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: layers.svg
    alt: "สี่ชั้นเรียงจากบนลงล่าง ผู้ใช้ แตะจอ พิมพ์ พูด ซอฟต์แวร์ประยุกต์ เบราว์เซอร์ เกม แอปแชต แอปจดบันทึก ทำงานในโหมดผู้ใช้ ระบบปฏิบัติการ เคอร์เนลและไดรเวอร์ จัดการกระบวนการ หน่วยความจำ อุปกรณ์ ไฟล์ ผู้ใช้ ทำงานในโหมดเคอร์เนล และฮาร์ดแวร์ หน่วยประมวลผล RAM ดิสก์ จอ ลำโพง การ์ดเครือข่าย ระหว่างชั้นมีลูกศรขึ้นลง ป้ายว่า ส่วนติดต่อผู้ใช้ การเรียกใช้บริการของระบบ (system call) และคำสั่งผ่านไดรเวอร์ ด้านขวามีลูกศรชี้ขึ้น บนสุดเขียนว่า ยิ่งสูงยิ่งซ่อนรายละเอียด ล่างสุดเขียนว่า ยิ่งต่ำยิ่งใกล้ฮาร์ดแวร์"
    caption: "ชั้นของระบบคอมพิวเตอร์ แต่ละชั้นใช้บริการของชั้นล่าง"
  - type: figure
    src: states.svg
    alt: "แผนภาพสถานะของกระบวนการ ใหม่ ไปที่ พร้อม เมื่อโหลดเข้า RAM พร้อม ไปที่ กำลังทำงาน เมื่อได้คิวใช้ CPU กำลังทำงาน กลับไปที่ พร้อม เมื่อหมดเวลาหรือถูกสลับ กำลังทำงาน ไปที่ รอ เมื่อรอดิสก์ เครือข่าย หรือการกดปุ่ม รอ กลับไปที่ พร้อม เมื่อข้อมูลที่รอมาถึง และกำลังทำงาน ไปที่ สิ้นสุด เมื่อทำเสร็จ"
    caption: "สถานะของกระบวนการ"
  - type: worked-example
    title: ตามคำสั่งพิมพ์รายงานลงไปทุกชั้น
    problem: "ปลายกด \"พิมพ์\" ในโปรแกรมพิมพ์งานเพื่อพิมพ์รายงานที่บันทึกไว้ในไฟล์ จงบอกว่าเกิดอะไรขึ้นในแต่ละชั้น และระบบปฏิบัติการใช้หน้าที่ใดบ้าง"
    steps:
      - text: "ชั้นผู้ใช้ → ซอฟต์แวร์ประยุกต์: ส่วนติดต่อผู้ใช้รับการคลิก โปรแกรมพิมพ์งานจัดหน้ารายงานเป็นข้อมูลสำหรับพิมพ์"
      - text: "ซอฟต์แวร์ประยุกต์ → เคอร์เนล: โปรแกรมเรียกใช้บริการของระบบ ขออ่านไฟล์ภาพที่แทรกในรายงาน และขอส่งงานไปยังเครื่องพิมพ์"
        why: "แอปทำงานในโหมดผู้ใช้ จึงสั่งเครื่องพิมพ์เองไม่ได้ ต้องขอผ่านเคอร์เนล"
      - text: "เคอร์เนล: ใช้หน้าที่ **จัดการไฟล์** หาไฟล์และตรวจสิทธิ์ว่าปลายอ่านไฟล์นี้ได้ (**จัดการผู้ใช้และความปลอดภัย**)"
      - text: "เคอร์เนล: ใช้หน้าที่ **จัดการอุปกรณ์** ใส่งานในคิวการพิมพ์ เพราะเพื่อนอีกเครื่องก็กำลังพิมพ์อยู่ แล้วส่งให้ไดรเวอร์ของเครื่องพิมพ์รุ่นนั้น"
        why: "เครื่องพิมพ์ใช้ได้ทีละงาน ระบบปฏิบัติการต้องจัดคิว ไม่ให้สองงานพิมพ์ปนกัน"
      - text: "ระหว่างรอเครื่องพิมพ์ กระบวนการของโปรแกรมพิมพ์งานอยู่สถานะ **รอ** ระบบปฏิบัติการจึงให้แอปอื่นใช้หน่วยประมวลผลไปก่อน (**จัดการกระบวนการ**)"
      - text: "ไดรเวอร์ → ฮาร์ดแวร์: แปลงข้อมูลเป็นคำสั่งเฉพาะของเครื่องพิมพ์รุ่นนั้นแล้วส่งผ่านสายหรือเครือข่าย"
    answer: "คำสั่งผ่านชั้นผู้ใช้ → แอป → (system call) → เคอร์เนลซึ่งใช้หน้าที่จัดการไฟล์ ผู้ใช้ อุปกรณ์ และกระบวนการ → ไดรเวอร์ → เครื่องพิมพ์"
  - { type: check, problem: computer.systems.operating-systems.p006, prompt: "จับคู่สถานการณ์กับหน้าที่ของระบบปฏิบัติการ" }
  - type: figure
    src: gantt.svg
    alt: "แผนภูมิแกนต์สองแถว งานมาถึงเวลา 0 ตามลำดับ P1 ใช้ 8 หน่วย P2 ใช้ 4 หน่วย P3 ใช้ 2 หน่วย แถว FCFS P1 จาก 0 ถึง 8 P2 จาก 8 ถึง 12 P3 จาก 12 ถึง 14 รอเฉลี่ย (0 + 8 + 12) ÷ 3 ประมาณ 6.67 แถว SJF P3 จาก 0 ถึง 2 P2 จาก 2 ถึง 6 P1 จาก 6 ถึง 14 รอเฉลี่ย (0 + 2 + 6) ÷ 3 ประมาณ 2.67"
    caption: "งานชุดเดียวกัน จัดคิวต่างกัน เวลารอเฉลี่ยต่างกันมาก"
  - type: worked-example
    title: เทียบเวลารอแบบมาก่อนได้ก่อนกับงานสั้นที่สุดก่อน
    problem: "งาน P1 ใช้หน่วยประมวลผล 8 หน่วยเวลา P2 ใช้ 4 และ P3 ใช้ 2 ทั้งหมดมาถึงเวลา 0 ตามลำดับ P1, P2, P3 จงหาเวลารอเฉลี่ยแบบ FCFS และ SJF"
    steps:
      - text: "FCFS ทำตามลำดับที่มา: P1 ทำ 0–8, P2 ทำ 8–12, P3 ทำ 12–14"
      - text: "เวลารอ = เวลาที่เริ่มทำ − เวลามาถึง: P1 รอ 0, P2 รอ 8, P3 รอ 12 เฉลี่ย (0 + 8 + 12) ÷ 3 ≈ 6.67"
        why: "ทุกงานมาถึงเวลา 0 และทำรวดเดียวจนเสร็จ เวลารอจึงเท่ากับเวลาเริ่ม"
      - text: "SJF เรียงจากสั้นไปยาว: P3 ทำ 0–2, P2 ทำ 2–6, P1 ทำ 6–14"
      - text: "เวลารอ: P3 รอ 0, P2 รอ 2, P1 รอ 6 เฉลี่ย (0 + 2 + 6) ÷ 3 ≈ 2.67"
      - text: "เทียบ: ทั้งสองแบบเสร็จทุกงานที่เวลา 14 เท่ากัน แต่ SJF ให้งานสั้นไม่ต้องรองานยาว เวลารอเฉลี่ยจึงน้อยกว่ามาก"
        why: "งานที่ทำก่อนทำให้ทุกงานที่ตามหลังต้องรอ การเอางานสั้นขึ้นก่อนจึงลดเวลารอรวม แต่ถ้างานสั้นมาเรื่อย ๆ งานยาวอาจไม่ได้ทำเลย"
    answer: "FCFS รอเฉลี่ยราว 6.67 หน่วยเวลา SJF รอเฉลี่ยราว 2.67 หน่วยเวลา"
  - { type: check, problem: computer.systems.operating-systems.p009, prompt: "ลองคำนวณเวลารอแบบ FCFS กับงานชุดใหม่" }
glossary:
  - { term: ระบบปฏิบัติการ (operating system), definition: "ซอฟต์แวร์ระบบที่เป็นตัวกลางระหว่างฮาร์ดแวร์กับแอป จัดการกระบวนการ หน่วยความจำ อุปกรณ์ ไฟล์ และผู้ใช้" }
  - { term: เคอร์เนล (kernel), definition: "แกนกลางของระบบปฏิบัติการ ทำงานในโหมดเคอร์เนลซึ่งสั่งฮาร์ดแวร์ได้โดยตรง" }
  - { term: ไดรเวอร์ (driver), definition: "ซอฟต์แวร์ที่แปลงคำสั่งทั่วไปของระบบปฏิบัติการเป็นคำสั่งเฉพาะของอุปกรณ์แต่ละรุ่น" }
  - { term: การเรียกใช้บริการของระบบ (system call), definition: "คำขอที่แอปส่งให้เคอร์เนลทำแทน เช่น เปิดไฟล์ อ่าน เขียน ขอหน่วยความจำ" }
  - { term: กระบวนการ (process), definition: "โปรแกรมที่กำลังรันอยู่ในหน่วยความจำ มีสถานะ พร้อม กำลังทำงาน และรอ" }
  - { term: นามธรรม (abstraction), definition: "การซ่อนรายละเอียดของชั้นล่าง ให้ชั้นบนใช้งานผ่านคำสั่งง่าย ๆ" }
  - { term: วนรอบ (round robin), definition: "การจัดคิวที่ให้แต่ละงานใช้หน่วยประมวลผลคราวละควอนตัม แล้วไปต่อท้ายคิวถ้ายังไม่เสร็จ" }
  - { term: ภาวะติดตาย (deadlock), definition: "สภาพที่กระบวนการตั้งแต่สองตัวต่างถือทรัพยากรและรอทรัพยากรของอีกฝ่าย จึงรอกันตลอดไป" }
flashcards:
  - { front: "สามชั้นของระบบคอมพิวเตอร์", back: "ฮาร์ดแวร์ ซอฟต์แวร์ระบบ (เคอร์เนล ไดรเวอร์) ซอฟต์แวร์ประยุกต์" }
  - { front: "หน้าที่หลักของระบบปฏิบัติการ", back: "จัดการกระบวนการ หน่วยความจำ อุปกรณ์ ไฟล์ ผู้ใช้และความปลอดภัย และส่วนติดต่อผู้ใช้" }
  - { front: "โปรแกรมต่างจากกระบวนการอย่างไร", back: "โปรแกรมคือไฟล์คำสั่งในดิสก์ กระบวนการคือโปรแกรมที่กำลังรันในหน่วยความจำ" }
  - { front: "เวลารอ กับ เวลาตลอดงาน", back: "เวลารอ = เวลาอยู่ในคิวพร้อม เวลาตลอดงาน = เวลาเสร็จ − เวลามาถึง" }
  - { front: "จุดเด่นของ FCFS SJF และวนรอบ", back: "FCFS ง่าย ยุติธรรม SJF รอเฉลี่ยน้อยสุด วนรอบตอบสนองทุกงานเป็นระยะ" }
