problems:
  - id: chemistry.organic.reactions.p001
    topics: [chemistry.organic.reactions]
    difficulty: 1
    type: mcq
    stem: "สารใดเป็นไฮโดรคาร์บอนอิ่มตัว"
    choices:
      - { id: a, text: "$\\mathrm{C_6H_{14}}$ (เฮกเซน)", correct: true, feedback: "ถูก แอลเคนมีแต่พันธะเดี่ยว สูตรทั่วไป CₙH₂ₙ₊₂" }
      - { id: b, text: "$\\mathrm{C_6H_{12}}$ (เฮกซ์-1-อีน)", feedback: "มีพันธะคู่ C=C จึงไม่อิ่มตัว" }
      - { id: c, text: "$\\mathrm{C_2H_2}$ (เอไทน์)", feedback: "มีพันธะสาม จึงไม่อิ่มตัว" }
      - { id: d, text: "$\\mathrm{C_6H_6}$ (เบนซีน)", feedback: "เบนซีนเป็นอะโรมาติก มีพันธะในวงที่ไม่ใช่พันธะเดี่ยวทั้งหมด" }
    hints:
      - "ไฮโดรคาร์บอนอิ่มตัวมีแต่พันธะเดี่ยว"
      - "แอลเคนมีสูตร CₙH₂ₙ₊₂"
    solution: "**C₆H₁₄** เป็นแอลเคน ($2 \\times 6 + 2 = 14$) มีแต่พันธะเดี่ยว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.organic.reactions.p002
    topics: [chemistry.organic.reactions]
    difficulty: 2
    type: numeric
    stem: "ดุลสมการการเผาไหม้สมบูรณ์ของโพรเพนในแก๊สหุงต้ม $\\mathrm{C_3H_8 + {?}O_2 \\to 3CO_2 + 4H_2O}$ สัมประสิทธิ์ของ $\\mathrm{O_2}$ เป็นเท่าใด"
    answer: { value: 5 }
    misconceptions:
      - { match: 7, feedback: "นับ O ด้านขวาได้ 6 + 4 = 10 อะตอม แต่ O₂ หนึ่งโมเลกุลมี O 2 อะตอม ต้องหารด้วย 2" }
      - { match: 10, feedback: "10 คือจำนวนอะตอม O ต้องหารด้วย 2 เพราะ O₂ มี 2 อะตอม" }
    hints:
      - "นับอะตอม O ทางขวา: ใน 3CO₂ และ 4H₂O"
      - "O₂ หนึ่งโมเลกุลให้ O 2 อะตอม"
    solution: "O ด้านขวา $= 3(2) + 4(1) = 10$ อะตอม ใช้ $\\mathrm{O_2}$ **5** โมเลกุล: $\\mathrm{C_3H_8 + 5O_2 \\to 3CO_2 + 4H_2O}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.organic.reactions.p003
    topics: [chemistry.organic.reactions]
    difficulty: 2
    type: mcq
    stem: "หยดสารละลายโบรมีน (สีน้ำตาลแดง) ลงในเฮกซ์-1-อีนในที่มืด จะสังเกตเห็นอะไร"
    choices:
      - { id: a, text: "สีน้ำตาลแดงหายไปทันที", correct: true, feedback: "ถูก แอลคีนเกิดปฏิกิริยาการเติมกับ Br₂ ได้ทันทีโดยไม่ต้องมีแสง" }
      - { id: b, text: "สีไม่เปลี่ยน ต้องรอให้มีแสง", feedback: "แอลเคนต่างหากที่ต้องมีแสง แอลคีนเกิดได้ในที่มืด" }
      - { id: c, text: "สีจางช้า ๆ และมีแก๊สที่ทำให้ลิตมัสสีน้ำเงินเป็นแดง", feedback: "นี่คือการแทนที่ของแอลเคนในที่สว่าง ซึ่งได้ HBr" }
    hints:
      - "เฮกซ์-1-อีนมีพันธะคู่หรือไม่"
      - "พันธะคู่ทำปฏิกิริยาการเติมกับ Br₂"
    solution: "แอลคีนเกิด **ปฏิกิริยาการเติม** กับ Br₂ ทันที สีน้ำตาลแดงหายไป ได้ 1,2-ไดโบรโมเฮกเซน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.organic.reactions.p004
    topics: [chemistry.organic.reactions]
    difficulty: 3
    type: mcq
    stem: "ใส่สารละลายโบรมีนในเฮกเซนแล้ววางไว้กลางแดด ข้อใดเป็นผลที่สังเกตได้และคำอธิบายที่ถูกต้อง"
    choices:
      - { id: a, text: "สีน้ำตาลแดงจางลงช้า ๆ และมีแก๊ส HBr ที่ทำให้กระดาษลิตมัสสีน้ำเงินชื้นเป็นสีแดง เพราะเกิดการแทนที่", correct: true, feedback: "ถูก H ของเฮกเซนถูกแทนที่ด้วย Br ได้ HBr เป็นผลพลอยได้" }
      - { id: b, text: "สีหายทันทีเพราะเกิดการเติมที่พันธะคู่", feedback: "เฮกเซนไม่มีพันธะคู่ จึงเกิดการเติมไม่ได้" }
      - { id: c, text: "ไม่เกิดอะไรเลย แม้มีแสง", feedback: "แสงทำให้แอลเคนเกิดการแทนที่กับโบรมีนได้" }
    hints:
      - "เฮกเซนเป็นแอลเคน"
      - "แอลเคนกับ Br₂ เมื่อมีแสงเกิดปฏิกิริยาแบบใด และได้ผลพลอยได้อะไร"
    solution: "แอลเคนเกิด **การแทนที่** เมื่อมีแสง: $\\mathrm{C_6H_{14} + Br_2 \\to C_6H_{13}Br + HBr}$ สีจางช้า และ HBr ทำให้ลิตมัสสีน้ำเงินชื้นเป็นแดง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.organic.reactions.p005
    topics: [chemistry.organic.reactions]
    difficulty: 3
    type: match
    stem: "ผลการทดสอบไฮโดรคาร์บอน 3 ชนิดเป็นดังตาราง จับคู่สารกับประเภท"
    figure:
      src: p-test-results.svg
      alt: "ตาราง 3 แถว สาร A: Br₂ ในที่มืดสีน้ำตาลแดงไม่จาง KMnO₄ สีม่วงไม่จาง เผาแล้วเปลวไฟสว่าง เขม่าน้อย สาร B: Br₂ สีน้ำตาลแดงจางทันที KMnO₄ สีม่วงจาง มีตะกอนสีน้ำตาล เผาแล้วมีเขม่าบ้าง สาร C: Br₂ สีน้ำตาลแดงไม่จาง KMnO₄ สีม่วงไม่จาง เผาแล้วเขม่ามาก ควันดำ"
    pairs:
      - { left: "สาร A", right: "แอลเคน (เช่น เฮกเซน)" }
      - { left: "สาร B", right: "แอลคีน (เช่น เฮกซ์-1-อีน)" }
      - { left: "สาร C", right: "อะโรมาติก (เช่น โทลูอีน)" }
    hints:
      - "สารใดฟอกสีทั้ง Br₂ และ KMnO₄ ได้"
      - "สารที่ไม่ฟอกสีทั้งสองแบบ แยกกันด้วยปริมาณเขม่า อะโรมาติกมีสัดส่วน C ต่อ H สูง"
    solution: "B ฟอกสีทั้ง Br₂ และ KMnO₄ จึงเป็น **แอลคีน** A และ C ไม่ฟอกสีในที่มืด C มีเขม่ามากเพราะสัดส่วนคาร์บอนสูง จึงเป็น **อะโรมาติก** ส่วน A เป็น **แอลเคน**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.organic.reactions.p006
    topics: [chemistry.organic.reactions]
    difficulty: 3
    type: text
    stem: "กรดเอทาโนอิกทำปฏิกิริยากับเมทานอล โดยมีกรดซัลฟิวริกเข้มข้นเป็นตัวเร่ง ได้เอสเทอร์ชื่อ IUPAC ว่าอะไร"
    accepted: ["เมทิลเอทาโนเอต", "เมทิลแอซีเทต", "methyl ethanoate", "methyl acetate", "เมทิลอะซิเตต", "เมทิลอะซีเตต"]
    misconceptions:
      - { match: "เอทิลเมทาโนเอต", feedback: "สลับส่วนกัน ส่วนแอลกอฮอล์ (เมทิล) ขึ้นต้น ส่วนกรด (เอทาโนเอต) ตามหลัง" }
      - { match: "เอทิลเอทาโนเอต", feedback: "เอทิลเอทาโนเอตได้จากเอทานอล แต่โจทย์ใช้เมทานอล" }
    hints:
      - "ชื่อเอสเทอร์ = ชื่อหมู่จากแอลกอฮอล์ + ชื่อกรดที่ลงท้าย -โอเอต"
      - "เมทานอลให้หมู่เมทิล กรดเอทาโนอิกให้ส่วนเอทาโนเอต"
    solution: "$\\mathrm{CH_3COOH + CH_3OH \\rightleftharpoons CH_3COOCH_3 + H_2O}$ ได้ **เมทิลเอทาโนเอต** (เมทิลแอซีเทต)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.organic.reactions.p007
    topics: [chemistry.organic.reactions]
    difficulty: 3
    type: mcq
    stem: "ในปฏิกิริยาเอสเทอริฟิเคชัน $\\mathrm{CH_3COOH + C_2H_5OH \\rightleftharpoons CH_3COOC_2H_5 + H_2O}$ โมเลกุลน้ำเกิดจากอะตอมใด"
    choices:
      - { id: a, text: "–OH จากกรด และ H จากหมู่ –OH ของแอลกอฮอล์", correct: true, feedback: "ถูก ออกซิเจนของแอลกอฮอล์จึงอยู่ในเอสเทอร์" }
      - { id: b, text: "–OH จากแอลกอฮอล์ และ H จากหมู่ –COOH ของกรด", feedback: "การทดลองใช้ไอโซโทปพบว่าออกซิเจนของแอลกอฮอล์อยู่ในเอสเทอร์ ไม่ได้อยู่ในน้ำ" }
      - { id: c, text: "H₂ จากแอลกอฮอล์รวมกับ O จากอากาศ", feedback: "ปฏิกิริยานี้ไม่ใช้ออกซิเจนจากอากาศ" }
    hints:
      - "ดูภาพปฏิกิริยาเอสเทอริฟิเคชันในบทเรียน"
      - "พันธะเอสเทอร์คือ C(=O)–O–C ออกซิเจนตรงกลางมาจากสารใด"
    solution: "น้ำเกิดจาก **–OH ของกรดกับ H ของแอลกอฮอล์** ส่วน O ของแอลกอฮอล์เชื่อมกับ C=O ของกรดเป็นพันธะเอสเทอร์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.organic.reactions.p008
    topics: [chemistry.organic.reactions]
    difficulty: 4
    type: numeric
    stem: "นำกรดเอทาโนอิก 6.0 g ทำปฏิกิริยากับเอทานอลมากเกินพอ ได้เอทิลเอทาโนเอตร้อยละ 67 ของผลได้ตามทฤษฎี ได้เอสเทอร์กี่กรัม (มวลโมเลกุล กรดเอทาโนอิก 60.05 เอทิลเอทาโนเอต 88.11)"
    answer: { value: 5.9, unit: g, tolerance: 0.06 }
    misconceptions:
      - { match: 8.8, feedback: "นี่คือผลได้ตามทฤษฎี ต้องคูณด้วย 0.67" }
      - { match: 4.02, feedback: "คูณมวลกรดด้วย 0.67 ตรง ๆ ต้องเปลี่ยนเป็นโมลแล้วใช้มวลโมเลกุลของเอสเทอร์" }
    hints:
      - "หาโมลกรดเอทาโนอิก อัตราส่วนกรด : เอสเทอร์ = 1 : 1"
      - "ผลได้จริง = ผลได้ตามทฤษฎี × 67/100"
    solution: "กรด $= 6.0/60.05 = 0.0999$ mol ผลได้ตามทฤษฎี $= 0.0999 \\times 88.11 = 8.80$ g ผลได้จริง $= 8.80 \\times 0.67 \\approx$ **5.9 g**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.organic.reactions.p009
    topics: [chemistry.organic.reactions]
    difficulty: 4
    type: numeric
    stem: "ไฮโดรคาร์บอนไม่อิ่มตัว 0.010 mol ทำปฏิกิริยาการเติมกับ $\\mathrm{Br_2}$ ได้พอดี 3.20 g (มวลโมเลกุล Br₂ 159.8) โมเลกุลนี้มีพันธะคู่ C=C กี่พันธะ (ไม่มีพันธะสาม)"
    answer: { value: 2 }
    misconceptions:
      - { match: 1, feedback: "Br₂ 3.20 g คือ 0.020 mol มากกว่าโมลของไฮโดรคาร์บอนสองเท่า" }
      - { match: 4, feedback: "ใช้มวลอะตอม Br (79.9) แทนมวลโมเลกุล Br₂ ทำให้ได้โมลมากเกินไปสองเท่า" }
    hints:
      - "หาโมลของ Br₂"
      - "พันธะคู่ 1 พันธะใช้ Br₂ 1 โมเลกุล"
    solution: "Br₂ $= 3.20/159.8 = 0.0200$ mol ต่อไฮโดรคาร์บอน 0.010 mol คิดเป็น 2 : 1 จึงมีพันธะคู่ **2** พันธะ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.organic.reactions.p010
    topics: [chemistry.organic.reactions]
    difficulty: 4
    type: mcq
    stem: "กลุ่มแม่บ้านในชุมชนทำสบู่ก้อนจากน้ำมันมะพร้าวกับสารละลายโซดาไฟ ข้อใดถูกต้องทั้งเรื่องปฏิกิริยาและความปลอดภัย"
    choices:
      - { id: a, text: "เป็นสะปอนนิฟิเคชัน ได้สบู่ (เกลือโซเดียมของกรดไขมัน) และกลีเซอรอล ต้องสวมแว่นตาและถุงมือ และค่อย ๆ ใส่โซดาไฟลงในน้ำ", correct: true, feedback: "ถูก โซดาไฟกัดผิวและการละลายคายความร้อนมาก" }
      - { id: b, text: "เป็นเอสเทอริฟิเคชัน ได้เอสเทอร์และน้ำ ไม่มีอันตรายเพราะใช้ของจากธรรมชาติ", feedback: "นี่คือการแยกเอสเทอร์ด้วยเบส ไม่ใช่การสร้างเอสเทอร์ และโซดาไฟอันตรายมาก" }
      - { id: c, text: "เป็นสะปอนนิฟิเคชัน ได้สบู่และเมทานอล", feedback: "ไขมันเป็นเอสเทอร์ของกลีเซอรอล จึงได้กลีเซอรอล ไม่ใช่เมทานอล" }
    hints:
      - "น้ำมันมะพร้าวเป็นไตรกลีเซอไรด์ (เอสเทอร์ของกลีเซอรอล)"
      - "เอสเทอร์ + เบส เรียกว่าปฏิกิริยาอะไร"
    solution: "ไขมัน + NaOH → **สบู่ + กลีเซอรอล** (สะปอนนิฟิเคชัน) โซดาไฟกัดผิวหนังและตา ต้องสวมอุปกรณ์ป้องกันและใส่โซดาไฟลงในน้ำช้า ๆ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.organic.reactions.p011
    topics: [chemistry.organic.reactions]
    difficulty: 4
    type: mcq
    stem: "เมื่อให้ความร้อนกรดเอทาโนอิกกับเมทิลเอมีน ($\\mathrm{CH_3NH_2}$) ผลิตภัณฑ์คือข้อใด"
    choices:
      - { id: a, text: "$\\mathrm{CH_3CONHCH_3 + H_2O}$", correct: true, feedback: "ถูก เกิดพันธะเอไมด์ –CO–NH– และน้ำ" }
      - { id: b, text: "$\\mathrm{CH_3COOCH_3 + NH_3}$", feedback: "นี่คือเอสเทอร์ แต่ N ต้องอยู่ในผลิตภัณฑ์หลักเชื่อมกับ C=O" }
      - { id: c, text: "$\\mathrm{CH_3CONH_2 + CH_3OH}$", feedback: "หมู่ CH₃ ของเมทิลเอมีนยังติดอยู่กับ N ไม่ได้หลุดเป็นเมทานอล" }
    hints:
      - "คล้ายเอสเทอริฟิเคชัน แต่ใช้ N–H แทน O–H"
      - "–OH ของกรดรวมกับ H ของเอมีนเป็นน้ำ"
    solution: "$\\mathrm{CH_3COOH + CH_3NH_2 \\to}$ **$\\mathrm{CH_3CONHCH_3 + H_2O}$** (N-เมทิลเอทานาไมด์) พันธะเอไมด์แบบเดียวกันเชื่อมกรดแอมิโนในโปรตีน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.organic.reactions.p012
    topics: [chemistry.organic.reactions]
    difficulty: 3
    type: mcq
    stem: "หยดสารละลาย $\\mathrm{KMnO_4}$ สีม่วงลงในไซโคลเฮกซีน (มีพันธะคู่ในวง) จะสังเกตเห็นอะไร"
    choices:
      - { id: a, text: "สีม่วงจางหายและเกิดตะกอนสีน้ำตาล", correct: true, feedback: "ถูก พันธะคู่ถูกออกซิไดซ์ และ MnO₄⁻ ถูกรีดิวซ์เป็น MnO₂ สีน้ำตาล" }
      - { id: b, text: "สีม่วงเข้มขึ้น", feedback: "KMnO₄ ถูกใช้ไปในปฏิกิริยา สีจึงจางลง" }
      - { id: c, text: "ไม่เปลี่ยนแปลง เพราะสารเป็นวง", feedback: "การเป็นวงไม่สำคัญ สิ่งที่ทำปฏิกิริยาคือพันธะคู่" }
    hints:
      - "ไซโคลเฮกซีนมีพันธะคู่"
      - "KMnO₄ ใช้ทดสอบพันธะคู่แบบเดียวกับ Br₂"
