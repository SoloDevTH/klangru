id: biology.plants.reproduction-propagation
subject: biology
title: { th: การสืบพันธุ์และการขยายพันธุ์พืชดอก, en: "Reproduction and propagation of flowering plants" }
summary: การสืบพันธุ์แบบอาศัยเพศและไม่อาศัยเพศ โครงสร้างดอกกับการถ่ายเรณู การปฏิสนธิซ้อน การเกิดผลและเมล็ด การกระจายและการงอก การขยายพันธุ์ และการเพาะเลี้ยงเนื้อเยื่อพืช
difficulty: 3
minutes: 40
prerequisites: [biology.plants.flowering-plants, biology.cells.cell-basics]
encompasses:
  - { id: biology.plants.flowering-plants, weight: 0.3 }
  - { id: biology.cells.cell-basics, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: การถ่ายเรณูและการปฏิสนธิซ้อน
    src: double-fertilization.svg
    alt: "ด้านซ้ายเป็นดอกผ่าครึ่ง มีป้าย ยอดเกสรเพศเมียที่มีละอองเรณูเกาะ 3 เม็ด ก้านเกสรเพศเมีย หลอดละอองเรณูเป็นเส้นประงอกจากยอดเกสรลงไปถึงออวุล รังไข่ → ผล ออวุล → เมล็ด อับเรณู กลีบดอก และกลีบเลี้ยง ด้านกลางเป็นภาพขยายภายในออวุล หลอดละอองเรณูเข้ามาจากด้านล่าง นำสเปิร์มนิวเคลียส 2 นิวเคลียส ลูกศรหนึ่งไปที่เซลล์ไข่ อีกลูกศรไปที่โพลาร์นิวคลีไอ 2 นิวเคลียสตรงกลาง ด้านขวาเป็นกล่องสรุป สเปิร์ม 1 + เซลล์ไข่ → ไซโกต → เอ็มบริโอ และสเปิร์ม 2 + โพลาร์นิวคลีไอ → เอนโดสเปิร์ม (อาหาร)"
    caption: "การปฏิสนธิสองครั้งพร้อมกันในออวุลเดียวพบเฉพาะในพืชดอก (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: worked-example
    title: อ่านลักษณะดอกแล้วบอกวิธีถ่ายเรณู
    problem: "ดอกชนิดหนึ่งมีกลีบดอกสีแดงสด มีกลิ่นหอมและน้ำหวานที่โคนกลีบ ละอองเรณูเหนียว ยอดเกสรเพศเมียอยู่ภายในดอก ดอกนี้น่าจะถ่ายเรณูด้วยอะไร"
    steps:
      - text: "สีสด กลิ่นหอม และน้ำหวาน เป็นสิ่งที่ล่อสัตว์ ลมไม่ต้องการสิ่งเหล่านี้"
      - text: "ละอองเรณูเหนียวติดตัวสัตว์ได้ดี ถ้าเป็นดอกที่อาศัยลม ละอองเรณูต้องเบาและแห้ง"
        why: "โครงสร้างของดอกเหมาะกับตัวช่วยถ่ายเรณูที่ดอกนั้นอาศัย"
      - text: "ยอดเกสรอยู่ในดอก สัตว์ที่เข้ามาดูดน้ำหวานจะเฉี่ยวผ่านพอดี"
    answer: "ถ่ายเรณูด้วยสัตว์ เช่น แมลงหรือนกกินปลี"
  - { type: check, problem: biology.plants.reproduction-propagation.p005, prompt: "ใช้เหตุผลเดียวกัน แต่ดอกนี้ลักษณะตรงข้าม" }
  - type: figure
    title: วิธีขยายพันธุ์พืชแบบไม่อาศัยเพศ
    src: propagation-methods.svg
    alt: "ภาพ 3 ช่อง ปักชำ กิ่งที่มีใบ 3 ใบปักอยู่ในกระถางดิน มีรากสีขาวงอกที่โคนกิ่ง ตอนกิ่ง กิ่งที่ยังติดกับลำต้นแม่มีก้อนขุยมะพร้าวชื้นหุ้มรอยควั่น มีรากงอกอยู่ในก้อนนั้น ติดตา ลำต้นของต้นตอมีแผ่นเปลือกสีเขียวที่มีตาจากต้นพันธุ์ดีเสียบอยู่ พันด้วยผ้าพลาสติกให้แนบ"
    caption: "ทั้งสามวิธีได้ต้นที่มีลักษณะเหมือนต้นแม่ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: หาร้อยละการงอกแล้วตัดสินใจ
    problem: "ร้านขายเมล็ดพันธุ์ผักบุ้งสองยี่ห้อ ทดลองเพาะยี่ห้อ ก 80 เมล็ด งอก 68 เมล็ด ยี่ห้อ ข 120 เมล็ด งอก 96 เมล็ด ยี่ห้อใดงอกดีกว่า"
    steps:
      - text: "ยี่ห้อ ก: $\\frac{68}{80} \\times 100 = 85\\%$"
      - text: "ยี่ห้อ ข: $\\frac{96}{120} \\times 100 = 80\\%$"
        why: "จำนวนเมล็ดที่เพาะไม่เท่ากัน จึงต้องเทียบเป็นร้อยละ ไม่ใช่เทียบจำนวนที่งอก"
      - text: "แม้ยี่ห้อ ข งอกมากกว่าเป็นจำนวน แต่เมื่อคิดเป็นร้อยละ ยี่ห้อ ก สูงกว่า"
    answer: "ยี่ห้อ ก งอก 85% ดีกว่ายี่ห้อ ข ที่งอก 80%"
  - { type: check, problem: biology.plants.reproduction-propagation.p010, prompt: "ต้องการต้นที่เหมือนต้นแม่ทุกอย่าง ใช้การสืบพันธุ์แบบใด" }
glossary:
  - { term: การถ่ายเรณู, definition: "การที่ละอองเรณูไปตกบนยอดเกสรเพศเมีย" }
  - { term: การปฏิสนธิซ้อน, definition: "การปฏิสนธิสองครั้งพร้อมกันในออวุลของพืชดอก ได้ไซโกตและเอนโดสเปิร์ม" }
  - { term: เอนโดสเปิร์ม, definition: "เนื้อเยื่อสะสมอาหารในเมล็ด เกิดจากสเปิร์มนิวเคลียสรวมกับโพลาร์นิวคลีไอ" }
  - { term: เอ็มบริโอ, definition: "ต้นอ่อนในเมล็ด เจริญมาจากไซโกต" }
  - { term: ดอกสมบูรณ์เพศ, definition: "ดอกที่มีทั้งเกสรเพศผู้และเกสรเพศเมียในดอกเดียวกัน" }
  - { term: การเพาะเลี้ยงเนื้อเยื่อพืช, definition: "การนำเนื้อเยื่อพืชชิ้นเล็กไปเลี้ยงบนอาหารสังเคราะห์ที่ปลอดเชื้อ ให้เจริญเป็นต้นใหม่จำนวนมาก" }
flashcards:
  - { front: "รังไข่และออวุลเจริญเป็นอะไร", back: "รังไข่ → ผล ออวุล → เมล็ด" }
  - { front: "การปฏิสนธิซ้อนได้อะไรบ้าง", back: "สเปิร์ม + เซลล์ไข่ → ไซโกต (เอ็มบริโอ) และสเปิร์ม + โพลาร์นิวคลีไอ → เอนโดสเปิร์ม" }
  - { front: "ปัจจัยการงอกของเมล็ด", back: "น้ำ แก๊สออกซิเจน อุณหภูมิที่เหมาะสม" }
  - { front: "ข้อดีของการเพาะเลี้ยงเนื้อเยื่อ", back: "ได้ต้นจำนวนมากในเวลาสั้น เหมือนต้นแม่ ปลอดโรค และอนุรักษ์พืชหายาก" }
  - { front: "ดอกที่อาศัยลมถ่ายเรณู", back: "กลีบเล็ก ไม่มีกลิ่น ละอองเรณูเบาและมาก ยอดเกสรยาวฟู เช่น ข้าวโพด ข้าว" }
