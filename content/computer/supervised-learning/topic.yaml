id: computer.ai.supervised-learning
subject: computer
title: { th: "การเรียนรู้แบบมีผู้สอน: ถดถอยและต้นไม้ตัดสินใจ", en: "Supervised learning: regression and decision trees" }
summary: ใช้ตัวอย่างที่มีคำตอบเพื่อสร้างแบบจำลองทำนาย ทั้งเส้นถดถอยเชิงเส้น ต้นไม้ตัดสินใจที่เลือกจุดแบ่งด้วยจินี และ k-NN พร้อมเทียบความแม่น ความตีความได้ และการใช้กับข้อมูลใหม่
difficulty: 7
minutes: 45
prerequisites: [computer.ai.intro, math.stats.regression, computer.programming.collections]
encompasses:
  - { id: math.stats.regression, weight: 0.3 }
  - { id: computer.ai.intro, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: regression-line.svg
    alt: "กราฟกระจายของจุดสี่จุดบนแกนนอน x ตั้งแต่ 1 ถึง 4 และแกนตั้ง y มีเส้นตรงสีแดงพาดผ่านจุดส่วนใหญ่อย่างใกล้ชิด และมีเส้นประสีเทาแนวตั้งจากแต่ละจุดไปยังเส้น แสดงระยะคลาดเคลื่อน"
    caption: "เส้นถดถอยคือเส้นที่ทำให้ผลรวมของกำลังสองของระยะคลาดเคลื่อนน้อยที่สุด (ข้อมูลสมมติ)"
  - type: worked-example
    title: หาเส้นถดถอยจากข้อมูลสี่จุด
    problem: "เมื่อ x เป็น 1, 2, 3, 4 ค่า y ที่วัดได้คือ 2, 3, 5, 6 หาเส้น y = ax + b ด้วยกำลังสองน้อยที่สุด และทำนายค่า y เมื่อ x = 5"
    steps:
      - text: "หาค่าเฉลี่ย x̄ = (1 + 2 + 3 + 4) ÷ 4 = 2.5 และ ȳ = (2 + 3 + 5 + 6) ÷ 4 = 4"
      - text: "หาตัวเศษของ a: Σ(x − x̄)(y − ȳ) = (−1.5)(−2) + (−0.5)(−1) + (0.5)(1) + (1.5)(2) = 7"
        why: "ค่าที่อยู่เหนือค่าเฉลี่ยทั้งสองแกนเป็นบวก จึงช่วยให้ความชันเป็นบวก"
      - text: "หาตัวส่วนของ a: Σ(x − x̄)² = 2.25 + 0.25 + 0.25 + 2.25 = 5 จึงได้ a = 7 ÷ 5 = 1.4"
      - text: "หาจุดตัด b = ȳ − a x̄ = 4 − 1.4 × 2.5 = 0.5 เส้นคือ y = 1.4x + 0.5"
      - text: "ทำนาย y เมื่อ x = 5 ได้ 1.4 × 5 + 0.5 = 7.5"
        why: "การทำนายนอกช่วงข้อมูลฝึกเชื่อถือได้น้อยกว่าการทำนายภายในช่วง"
    answer: "เส้นถดถอยคือ y = 1.4x + 0.5 และเมื่อ x = 5 จะทำนาย y ได้ 7.5"
  - type: interactive
    title: ลองปรับเส้นให้เข้ากับแนวโน้ม
    caption: "ลองปรับ a (ความชัน) และ b (จุดตัดแกน y) แล้วสังเกตว่าเส้นเปลี่ยนอย่างไร"
    widget:
      kind: function-plot
      functions: ["a x + b"]
      sliders:
        - { name: a, min: -2, max: 3, step: 0.1, value: 1, label: ความชัน }
        - { name: b, min: -5, max: 5, step: 0.5, value: 0, label: จุดตัดแกน y }
      x: [0, 6]
      y: [-2, 10]
  - { type: check, problem: computer.ai.supervised-learning.p001, prompt: "ลองแยกการเรียนรู้แบบมีผู้สอนออกจากแบบไม่มีผู้สอน" }
  - type: figure
    src: weather-tree.svg
    alt: "ต้นไม้ตัดสินใจสมมติ รากถามว่าฝนตกหรือไม่ ถ้าใช่ไปยังปลายกิ่งขายไม่ดี ถ้าไม่ไปยังโหนดถามว่าอุณหภูมิมากกว่าหรือเท่ากับ 30 องศาหรือไม่ ถ้าใช่ได้ขายดี ถ้าไม่ได้ขายไม่ดี"
    caption: "ต้นไม้สมมติ ทุกเส้นทางจากรากถึงปลายกิ่งคือกฎที่อ่านได้"
  - type: worked-example
    title: เลือกจุดแบ่งด้วยค่าจินี (ข้อมูลสมมติ)
    problem: "มีหกวันที่อุณหภูมิ 24, 26, 28, 31, 33 และ 35 องศา ผลขายตามลำดับคือ ไม่ดี ไม่ดี ดี ไม่ดี ดี ดี ควรแบ่งที่อุณหภูมิเท่าใดโดยดูค่าจินีถ่วงน้ำหนักของสองกลุ่ม"
    steps:
      - text: "จินีของทั้งหกวันคือ 1 − (3/6)² − (3/6)² = 0.5 เพราะมีดีสามวันและไม่ดีสามวัน"
      - text: "แบ่งที่ 27 องศา กลุ่มซ้ายคือ 24 และ 26 องศา ทั้งสองไม่ดี จินีเป็น 0 กลุ่มขวาคือ 28, 31, 33 และ 35 องศา มีดีสามวันและไม่ดีหนึ่งวัน จินี 1 − (3/4)² − (1/4)² = 0.375"
      - text: "ค่าถ่วงน้ำหนักคือ (2/6) × 0 + (4/6) × 0.375 = 0.25"
        why: "กลุ่มที่ใหญ่กว่าควรมีน้ำหนักมากกว่า จึงต้องถ่วงด้วยจำนวนสมาชิกของแต่ละกลุ่ม"
      - text: "แบ่งที่ 29.5 องศา ทั้งสองกลุ่มมีจินี 4/9 ค่าถ่วงน้ำหนักเป็น 4/9 ซึ่งสูงกว่า 0.25 ส่วนการแบ่งที่ 32 องศาได้ 0.25 เท่ากับ 27 องศา เมื่อค่าเท่ากันให้เลือกจุดที่เล็กกว่า"
        why: "ต้องลองจุดแบ่งที่เป็นไปได้ทุกจุด ไม่ควรเลือกจุดที่คิดว่าดูเหมาะสมเอง"
    answer: "แบ่งที่ 27 องศาให้ค่าถ่วงน้ำหนักต่ำที่สุด 0.25 ร่วมกับ 32 องศา และเลือก 27 องศาตามกติกาที่เลือกจุดเล็กกว่า"
  - { type: check, problem: computer.ai.supervised-learning.p008, prompt: "ลองตอบเรื่องความตีความได้ของต้นไม้ตัดสินใจ" }
glossary:
  - { term: การเรียนรู้แบบมีผู้สอน (supervised learning), definition: "การสร้างแบบจำลองจากตัวอย่างที่มีทั้งอินพุตและคำตอบ เพื่อทำนายคำตอบของข้อมูลใหม่" }
  - { term: การถดถอย (regression), definition: "การทำนายค่าตัวเลขต่อเนื่อง เช่น จำนวนแก้วที่ขายได้" }
  - { term: การจำแนก (classification), definition: "การทำนายว่าข้อมูลอยู่ในหมวดหมู่ใด เช่น ขายดีหรือขายไม่ดี" }
  - { term: กำลังสองน้อยที่สุด (least squares), definition: "วิธีเลือกพารามิเตอร์ของเส้นตรงให้ผลรวมของกำลังสองของระยะคลาดเคลื่อนน้อยที่สุด" }
  - { term: เกรเดียนต์ลงเขา (gradient descent), definition: "วิธีปรับพารามิเตอร์ทีละน้อยไปในทิศที่ทำให้ฟังก์ชันสูญเสียลดลง" }
  - { term: จินี (Gini impurity), definition: "ค่าที่วัดความไม่บริสุทธิ์ของกลุ่ม คำนวณจาก 1 − Σ(สัดส่วนของแต่ละคลาส)² ยิ่งผสมมากยิ่งสูง" }
  - { term: เพื่อนบ้านใกล้ที่สุด (k-NN), definition: "วิธีทำนายโดยดูตัวอย่างฝึกที่ใกล้ที่สุด k ตัวแล้วเลือกคลาสที่พบมากที่สุด" }
flashcards:
  - { front: "ต่างกันอย่างไรระหว่างการถดถอยกับการจำแนก", back: "ถดถอยทำนายค่าตัวเลขต่อเนื่อง จำแนกทำนายหมวดหมู่" }
  - { front: "ความชันของเส้นถดถอยคำนวณอย่างไร", back: "ผลรวมของ (x − x̄)(y − ȳ) หารด้วยผลรวมของ (x − x̄)²" }
  - { front: "จินีคืออะไร", back: "1 − Σ(สัดส่วนของแต่ละคลาส)² ยิ่งสูงยิ่งผสมกันมาก" }
  - { front: "ทำไมแบบจำลองที่จำข้อมูลฝึกได้เกือบสมบูรณ์จึงทำนายข้อมูลใหม่แย่", back: "เพราะไปเรียนเสียงรบกวนและรายละเอียดเฉพาะของข้อมูลฝึกมากเกินไป จนไม่จับรูปแบบทั่วไป" }
