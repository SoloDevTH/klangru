    hints:
      - "ให้ $x$ แทนคะแนนครั้งที่สี่ ค่าเฉลี่ยคือ $\\frac{72 + 65 + 80 + x}{4}$"
      - "ตั้งอสมการค่าเฉลี่ย $\\ge 75$ แล้วคูณ 4 ทั้งสองข้าง"
    misconceptions:
      - { match: 75, feedback: "75 คือค่าเฉลี่ยที่ต้องการ ครั้งก่อน ๆ ได้คะแนนรวมต่ำกว่าเกณฑ์ ครั้งที่สี่จึงต้องได้มากกว่า 75" }
      - { match: 300, feedback: "300 คือคะแนนรวมที่ต้องมีทั้ง 4 ครั้ง ยังต้องลบคะแนนสามครั้งแรกออก" }
    solution: "$\\frac{217 + x}{4} \\ge 75$ → $217 + x \\ge 300$ → $x \\ge 83$ ครั้งที่สี่ต้องได้อย่างน้อย 83 คะแนน ตรวจ: $(72 + 65 + 80 + 83) \\div 4 = 75$ ✓"
