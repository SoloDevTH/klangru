    solution: "$0.8^4 = 0.4096$ พนักงานได้รับราว 41.0% ของเนื้อหาเดิม ตัวเลขสมมตินี้แสดงว่าทำไมข่าวสำคัญควรสื่อสารตรงจากผู้บริหาร หรือใช้หลายช่องทางพร้อมกัน"
