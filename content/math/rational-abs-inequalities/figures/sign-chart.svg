<line x1="510.0" y1="22.0" x2="510.0" y2="140.0" stroke="#bbb" stroke-width="1.6" stroke-dasharray="4,4"/>
<line x1="110.0" y1="175.0" x2="590.0" y2="175.0" stroke="#222" stroke-width="1.8" marker-end="url(#arr222)"/>
