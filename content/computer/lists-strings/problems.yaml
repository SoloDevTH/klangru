  - id: computer.programming.lists-strings.p006
    topics: [computer.programming.lists-strings]
    difficulty: 3
    type: mcq
    stem: |
      โปรแกรมนี้แสดงอะไร

      ```python
      nums = [4, 7, 4, 9]
      nums.append(2)
      nums.remove(4)
      nums[0] = 10
      print(nums)
      ```
    choices:
      - { id: a, text: "[10, 4, 9, 2]", correct: true }
      - { id: b, text: "[10, 9, 2]", feedback: "remove(4) ลบเฉพาะ 4 ตัวแรกที่พบ ไม่ได้ลบทุกตัว" }
      - { id: c, text: "[10, 7, 4, 9]", feedback: "remove(4) ลบค่า 4 ไม่ใช่ลบสมาชิกที่ดัชนี 4" }
      - { id: d, text: "[10, 7, 4, 9, 2]", feedback: "ลืมว่า remove ลบ 4 ตัวแรกออกไปแล้ว" }
    hints:
      - "เขียนลิสต์ใหม่ทุกครั้งที่ทำแต่ละบรรทัด"
      - "remove(x) ลบค่า x ตัวแรกที่พบเท่านั้น"
    solution: "append(2) ได้ [4, 7, 4, 9, 2] → remove(4) ลบ 4 ตัวแรก ได้ [7, 4, 9, 2] → nums[0] = 10 แทนตัวแรก ได้ [10, 4, 9, 2]"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.lists-strings.p007
    topics: [computer.programming.lists-strings]
    difficulty: 3
    type: numeric
    stem: |
      ร้านส้มตำใช้โปรแกรมนี้คิดเงิน ลูกค้าโต๊ะนี้ต้องจ่ายกี่บาท

      ```python
      price = {"ส้มตำ": 50, "ไก่ย่าง": 120, "ข้าวเหนียว": 10}
      order = ["ส้มตำ", "ข้าวเหนียว", "ข้าวเหนียว", "ไก่ย่าง"]
      total = 0
      for food in order:
          total = total + price[food]
      print(total)
      ```
    answer: { value: 190, unit: "บาท" }
    hints:
      - "วงวนไล่รายการใน order ทีละรายการ แล้วใช้ชื่อเป็นคีย์ไปหาราคา"
      - "ข้าวเหนียวอยู่ใน order สองครั้ง"
    misconceptions:
      - { match: 180, feedback: "นับข้าวเหนียวครั้งเดียว แต่ order มีข้าวเหนียวสองรายการ วงวนจึงบวกสองครั้ง" }
      - { match: 4, feedback: "4 คือจำนวนรายการ แต่ total บวกราคาของแต่ละรายการ" }
    solution: "50 (ส้มตำ) + 10 + 10 (ข้าวเหนียว 2 รายการ) + 120 (ไก่ย่าง) = 190 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.lists-strings.p008
    topics: [computer.programming.lists-strings]
    difficulty: 3
    type: numeric
    stem: |
      โปรแกรมนับคำนี้แสดงตัวเลขใด

      ```python
      text = "แมว หมา แมว ปลา แมว หมา"
      count = {}
      for w in text.split():
          count[w] = count.get(w, 0) + 1
      print(len(count))
      ```
    answer: { value: 3 }
    hints:
      - "count เป็นดิกชันนารี คำเดิมใช้คีย์เดิม"
      - "len ของดิกชันนารีคือจำนวนคีย์ ไม่ใช่ผลรวมของค่า"
    misconceptions:
      - { match: 6, feedback: "6 คือจำนวนคำทั้งหมด แต่คำที่ซ้ำใช้คีย์เดิม แค่เพิ่มค่าที่นับ" }
    solution: "หลังวงวน count = {\"แมว\": 3, \"หมา\": 2, \"ปลา\": 1} มีคีย์ 3 ตัว len(count) จึงได้ 3 (ผลรวมของค่าคือ 6 เท่ากับจำนวนคำทั้งหมด)"
    license: CC-BY-SA-4.0
    ai_assisted: true

