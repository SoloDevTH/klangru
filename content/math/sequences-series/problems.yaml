  - id: math.algebra.sequences-series.p019
    topics: [math.algebra.sequences-series]
    difficulty: 3
    type: order
    stem: "เรียงขั้นการพิสูจน์สูตรผลบวก $n$ พจน์แรกของอนุกรมเรขาคณิต ($r \\ne 1$)"
    items:
      - "$S_n = a_1 + a_1r + a_1r^2 + \\dots + a_1r^{n-1}$"
      - "$rS_n = a_1r + a_1r^2 + \\dots + a_1r^{n-1} + a_1r^n$"
      - "นำมาลบกัน พจน์ตรงกลางหักล้างกันหมด: $S_n - rS_n = a_1 - a_1r^n$"
      - "$S_n(1 - r) = a_1(1 - r^n)$"
      - "$S_n = \\dfrac{a_1(1 - r^n)}{1 - r}$ เพราะ $r \\ne 1$ จึงหารด้วย $1 - r$ ได้"
    hints:
      - "เริ่มจากการเขียน $S_n$ ให้ครบ แล้วคูณทั้งสองข้างด้วย $r$"
      - "ขั้นสุดท้ายต้องหาร จึงต้องดึงตัวร่วมก่อน"
    solution: "เขียน $S_n$ → คูณด้วย $r$ → ลบกัน → ดึงตัวร่วม $S_n$ และ $a_1$ → หารด้วย $1 - r$"
    license: CC-BY-SA-4.0
    ai_assisted: true
