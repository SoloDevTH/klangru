id: chemistry.bonding.covalent
subject: chemistry
title: { th: พันธะโคเวเลนต์และรูปร่างโมเลกุล, en: Covalent bonds and molecular shape }
summary: อโลหะใช้เวเลนซ์อิเล็กตรอนร่วมกันเพื่อให้ครบแปดตามกฎออกเตต เกิดพันธะเดี่ยว คู่ หรือสาม และคู่อิเล็กตรอนที่ผลักกันกำหนดรูปร่างของโมเลกุล
difficulty: 4
minutes: 35
prerequisites: [chemistry.matter.periodic-table]
encompasses:
  - { id: chemistry.matter.periodic-table, weight: 0.4 }
  - { id: chemistry.matter.atoms, weight: 0.1 }
curriculum_tags: []
lessons:
  - type: figure
    src: lewis-structures.svg
    alt: "โครงสร้างลิวอิส 4 โมเลกุล: น้ำ O อยู่กลางต่อกับ H สองอะตอมด้วยเส้นเดี่ยว มีคู่อิเล็กตรอนโดดเดี่ยว 2 คู่บน O; แอมโมเนีย N ต่อกับ H สามอะตอมด้วยเส้นเดี่ยว มีคู่โดดเดี่ยว 1 คู่บน N; คาร์บอนไดออกไซด์ O=C=O พันธะคู่ 2 พันธะ O แต่ละอะตอมมีคู่โดดเดี่ยว 2 คู่; ไนโตรเจน N≡N พันธะสาม N แต่ละอะตอมมีคู่โดดเดี่ยว 1 คู่"
    caption: "โครงสร้างลิวอิส: เส้นแทนคู่อิเล็กตรอนร่วมพันธะ จุดคู่แทนคู่อิเล็กตรอนโดดเดี่ยว"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: polarity.svg
    alt: "เปรียบเทียบสภาพขั้ว ซ้าย: น้ำรูปมุมงอ O มีประจุลบบางส่วน H สองอะตอมมีประจุบวกบางส่วน ลูกศรขั้วของพันธะ O–H ทั้งสองชี้เข้าหา O และผลรวมชี้ขึ้นหา O จึงมีขั้ว ขวา: CO2 เส้นตรง ลูกศรขั้วของพันธะ C=O สองอันยาวเท่ากันแต่ชี้ไปทางตรงข้าม หักล้างกันหมด จึงไม่มีขั้ว"
    caption: "พันธะมีขั้วเหมือนกัน แต่รูปร่างตัดสินว่าโมเลกุลมีขั้วหรือไม่"
  - { type: check, problem: chem.cov.p014, prompt: "ลองนับจากสูตรโครงสร้างก่อนดูตัวอย่างถัดไป" }
  - type: worked-example
    title: เขียนโครงสร้างลิวอิสของกรดไฮโปคลอรัส (HOCl)
    problem: "กรดไฮโปคลอรัส ($\\mathrm{HOCl}$) เป็นสารฆ่าเชื้อที่เกิดเมื่อเติมคลอรีนลงในสระว่ายน้ำ อะตอมต่อกันเป็น H–O–Cl จงเขียนโครงสร้างลิวอิส และบอกว่าแต่ละอะตอมมีคู่อิเล็กตรอนโดดเดี่ยวกี่คู่"
    steps:
      - text: "นับเวเลนซ์อิเล็กตรอนรวม: H 1 + O 6 + Cl 7 $= 14$ ตัว"
      - text: "ต่อพันธะเดี่ยว H–O และ O–Cl ใช้ไป $2 \\times 2 = 4$ ตัว เหลือ $14 - 4 = 10$ ตัว หรือ 5 คู่"
        why: "เริ่มด้วยพันธะเดี่ยวก่อนเสมอ ถ้าอะตอมยังไม่ครบออกเตตค่อยเปลี่ยนเป็นพันธะคู่ภายหลัง"
      - text: "เติมคู่โดดเดี่ยวให้อะตอมปลายก่อน: Cl มีพันธะ 1 พันธะ (2 ตัว) ต้องการอีก 6 ตัว คือ 3 คู่"
        why: "H อยู่ปลายแต่ครบ 2 แล้ว จึงไม่ต้องเติม"
      - text: "ที่เหลืออีก 2 คู่วางบน O: O มีพันธะ 2 พันธะ (4 ตัว) + คู่โดดเดี่ยว 2 คู่ (4 ตัว) $= 8$"
      - text: "ตรวจ: ใช้อิเล็กตรอนไป $4 + 6 + 4 = 14$ ตัวครบ H มี 2 O มี 8 Cl มี 8"
    answer: "H–O–Cl พันธะเดี่ยวทั้งหมด O มีคู่โดดเดี่ยว 2 คู่ Cl มี 3 คู่ H ไม่มี"
  - type: worked-example
    title: คลอโรฟอร์มกับคาร์บอนเตตระคลอไรด์ ตัวไหนมีขั้ว
    problem: "$\\mathrm{CHCl_3}$ (คลอโรฟอร์ม) และ $\\mathrm{CCl_4}$ ต่างก็มี C เป็นอะตอมกลางต่อกับ 4 อะตอมด้วยพันธะเดี่ยว โมเลกุลใดมีขั้ว (อิเล็กโทรเนกาติวิตี H 2.20, C 2.55, Cl 3.16)"
    steps:
      - text: "รอบ C มี 4 พันธะและไม่มีคู่โดดเดี่ยว ทั้งสองโมเลกุลจึงเป็นทรงสี่หน้า"
        why: "คู่อิเล็กตรอน 4 คู่ผลักกันให้ห่างที่สุดในสามมิติ ได้มุมราว 109.5°"
      - text: "พันธะ C–Cl มีขั้ว เพราะ Cl ดึงอิเล็กตรอนแรงกว่า C ($3.16 - 2.55 = 0.61$) ส่วน C–H ต่างกันเพียง $2.55 - 2.20 = 0.35$ และขั้วชี้ไปทาง C"
      - text: "$\\mathrm{CCl_4}$: พันธะ C–Cl สี่พันธะเหมือนกันทุกทิศของทรงสี่หน้า ขั้วหักล้างกันหมด จึงไม่มีขั้ว"
      - text: "$\\mathrm{CHCl_3}$: มุมหนึ่งเป็น H แทน Cl ขั้วจึงไม่สมดุล ผลรวมชี้ไปทางฝั่ง Cl ทั้งสาม โมเลกุลมีขั้ว"
        why: "รูปร่างเหมือนกันไม่ได้แปลว่าสภาพขั้วเหมือนกัน ต้องดูว่าอะตอมรอบอะตอมกลางเหมือนกันทั้งหมดหรือไม่"
    answer: "$\\mathrm{CHCl_3}$ มีขั้ว ส่วน $\\mathrm{CCl_4}$ ไม่มีขั้ว"
  - { type: check, problem: chem.cov.p017, prompt: "ใช้หลักเดียวกันกับโมเลกุลอื่น" }
  - type: molecule
    title: น้ำ (H₂O) รูปร่างมุมงอ
    cid: 962
    name: water
    caption: หมุนดูว่าไฮโดรเจนสองอะตอมไม่ได้อยู่ตรงข้ามกัน เพราะคู่อิเล็กตรอนโดดเดี่ยว 2 คู่บนออกซิเจนดันพันธะให้งอ มุมราว 104.5°
  - type: molecule
    title: มีเทน (CH₄) ทรงสี่หน้า
    cid: 297
    name: methane
    caption: พันธะ C–H ทั้งสี่ชี้ไปยังมุมของทรงสี่หน้า ห่างกันเท่า ๆ กันที่มุมราว 109.5°
  - type: molecule
    title: แอมโมเนีย (NH₃) พีระมิดฐานสามเหลี่ยม
    cid: 222
    name: ammonia
    caption: ไนโตรเจนอยู่ยอดพีระมิด มีคู่อิเล็กตรอนโดดเดี่ยว 1 คู่อยู่ด้านบน ทำให้มุม H–N–H ราว 107° เล็กกว่ามีเทนเล็กน้อย
  - type: molecule
    title: คาร์บอนไดออกไซด์ (CO₂) เส้นตรง
    cid: 280
    name: carbon dioxide
    caption: พันธะคู่ C=O สองพันธะชี้ไปคนละทางพอดี คาร์บอนไม่มีคู่อิเล็กตรอนโดดเดี่ยว โมเลกุลจึงเป็นเส้นตรง 180°
  - type: molecule
    title: ไนโตรเจน (N₂) พันธะสาม
    cid: 947
    name: nitrogen
    caption: ไนโตรเจนสองอะตอมใช้อิเล็กตรอนร่วมกัน 3 คู่ เป็นพันธะที่แข็งแรงมาก แก๊สไนโตรเจนจึงไม่ค่อยทำปฏิกิริยา
  - type: simulation
    title: ลองสร้างรูปร่างโมเลกุล (PhET Molecule Shapes Basics)
    url: https://phet.colorado.edu/en/simulations/molecule-shapes-basics
    provider: phet
    note: เพิ่มพันธะและคู่อิเล็กตรอนโดดเดี่ยวรอบอะตอมกลาง แล้วสังเกตว่ารูปร่างและมุมพันธะเปลี่ยนอย่างไร
glossary:
  - { term: พันธะโคเวเลนต์, definition: พันธะที่เกิดจากอะตอมสองอะตอมใช้คู่อิเล็กตรอนร่วมกัน มักเกิดระหว่างอโลหะกับอโลหะ }
  - { term: กฎออกเตต, definition: อะตอมมักเกิดพันธะจนมีอิเล็กตรอนชั้นนอกสุด 8 ตัวเหมือนแก๊สมีตระกูล (ไฮโดรเจนต้องการ 2 ตัว) }
  - { term: คู่อิเล็กตรอนโดดเดี่ยว, definition: คู่อิเล็กตรอนชั้นนอกสุดที่ไม่ได้ใช้สร้างพันธะ แต่ยังผลักคู่อิเล็กตรอนอื่นและมีผลต่อรูปร่างโมเลกุล }
  - { term: สูตรโครงสร้าง, definition: สูตรที่แสดงว่าอะตอมใดต่อกับอะตอมใด โดยใช้เส้นแทนพันธะ เช่น H–O–H }
flashcards:
  - { front: "พันธะเดี่ยว คู่ และสาม ใช้อิเล็กตรอนร่วมกันกี่ตัว", back: "เดี่ยว 2 ตัว (1 คู่) · คู่ 4 ตัว (2 คู่) · สาม 6 ตัว (3 คู่)" }
  - { front: "H, O, N, C มักสร้างพันธะกี่พันธะ", back: "H 1 · O 2 · N 3 · C 4 (เท่ากับจำนวนอิเล็กตรอนที่ขาดไปจากออกเตต หรือจาก 2 สำหรับ H)" }
  - { front: "รูปร่างของ $\\mathrm{CH_4}$, $\\mathrm{NH_3}$, $\\mathrm{H_2O}$, $\\mathrm{CO_2}$", back: "ทรงสี่หน้า · พีระมิดฐานสามเหลี่ยม · มุมงอ · เส้นตรง" }
  - { front: "โมเลกุลมีขั้วเมื่อใด", back: "เมื่อมีพันธะมีขั้วและรูปร่างไม่สมมาตร ขั้วจึงไม่หักล้างกัน เช่น $\\mathrm{H_2O}$, $\\mathrm{NH_3}$ ส่วน $\\mathrm{CO_2}$, $\\mathrm{CH_4}$ ไม่มีขั้ว" }
  - { front: "ทำไมน้ำเป็นมุมงอแต่ $\\mathrm{CO_2}$ เป็นเส้นตรง", back: "ออกซิเจนในน้ำมีคู่อิเล็กตรอนโดดเดี่ยว 2 คู่ดันพันธะให้งอ ส่วนคาร์บอนใน $\\mathrm{CO_2}$ ไม่มีคู่โดดเดี่ยว" }
