    ai_assisted: true

  - id: management.quality.spc.p015
    topics: [management.quality.spc]
    difficulty: 5
    type: mcq
    stem: "โรงงานน้ำดื่มเก็บกลุ่มย่อยโดยหยิบหัวบรรจุละ 1 ขวดจาก 4 หัวมารวมเป็นกลุ่มละ 4 ขวด แผนภูมิ x̄ แทบไม่มีจุดเข้าใกล้เส้นควบคุมเลย ทั้งที่ลูกค้าร้องเรียนว่าบางขวดไม่เต็ม สาเหตุที่น่าจะเป็นที่สุดคืออะไร"
    choices:
      - { id: a, text: "หัวบรรจุแต่ละหัวมีค่าเฉลี่ยต่างกัน ความต่างนี้ทำให้ R̄ ใหญ่และเส้นควบคุมของ x̄ กว้างเกินไป ควรแยกแผนภูมิตามหัว", correct: true }
      - { id: b, text: "กระบวนการดีมากจนไม่ต้องใช้แผนภูมิ", feedback: "ข้อร้องเรียนแสดงว่ามีปัญหา แผนภูมิที่ \"ดีเกินไป\" มักบอกว่ากลุ่มย่อยไม่มีเหตุผล" }
      - { id: c, text: "ควรเปลี่ยนเป็นแผนภูมิ c", feedback: "ปริมาตรเป็นข้อมูลแบบวัด แผนภูมิ c ใช้กับการนับจุดบกพร่อง" }
      - { id: d, text: "ควรเพิ่มกฎ Western Electric ให้ครบสี่ข้อ", feedback: "กฎเพิ่มเติมช่วยได้บ้าง แต่ไม่แก้ต้นเหตุ คือเส้นควบคุมกว้างเกินเพราะการแบ่งกลุ่มผิด" }
    hints:
      - "อะไรอยู่ในพิสัยภายในกลุ่มเมื่อปนสี่หัว"
      - "จุดที่กอดเส้นกลางมากผิดปกติเป็นสัญญาณของการแบ่งชั้นปนกันในกลุ่มย่อย"
    solution: "การปนหลายแหล่งในกลุ่มเดียวทำให้พิสัยรวมความต่างระหว่างหัว R̄ จึงใหญ่ เส้นของ x̄ กว้าง จุดกอดเส้นกลาง และจับหัวที่บรรจุไม่เต็มไม่ได้ ควรเก็บกลุ่มย่อยแยกต่อหัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.spc.p016
    topics: [management.quality.spc]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการเริ่มใช้แผนภูมิ x̄–R ในระยะที่ 1 ให้ถูกต้อง"
    items:
      - "เลือกคุณลักษณะสำคัญและวางแผนกลุ่มย่อยที่มีเหตุผล"
      - "เก็บข้อมูลอย่างน้อย 20–25 กลุ่มย่อย"
      - "คำนวณ R̄ และตรวจแผนภูมิ R"
      - "คำนวณเส้นควบคุมของแผนภูมิ x̄ และตรวจหาจุดที่หลุด"
      - "หาสาเหตุของจุดที่หลุด ตัดจุดที่รู้สาเหตุออก แล้วคำนวณเส้นใหม่"
      - "ใช้เส้นควบคุมที่ได้เฝ้าดูข้อมูลใหม่ในระยะที่ 2"
    hints:
      - "แผนภูมิ R ต้องตรวจก่อนแผนภูมิ x̄"
      - "ระยะที่ 2 เริ่มหลังได้เส้นควบคุมของกระบวนการที่เสถียร"
    solution: "วางแผน → เก็บข้อมูล → แผนภูมิ R → แผนภูมิ x̄ → หาสาเหตุและคำนวณใหม่ → ใช้เฝ้าดูในระยะที่ 2"
