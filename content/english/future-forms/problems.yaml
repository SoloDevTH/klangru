    stem: "ดูตารางของนิดา เติมสี่คำโดยใช้ be going to (เป็นแผนที่เขียนไว้ก่อน): *On Sunday morning, Nida ___ football.*"
    figure: { src: weekend-planner.svg, alt: "ตารางวันหยุดของนิดา หัวข้อ Nida's weekend plans ช่อง Saturday: morning visit Grandma in Ayutthaya, afternoon buy fruit at the market with Mum ช่อง Sunday: morning play football (9:00), evening do maths homework" }
