id: earthscience.astronomy.stellar-properties
subject: earthscience
title: { th: สมบัติและวิวัฒนาการของดาวฤกษ์, en: "Stellar properties and evolution" }
summary: กำลังส่องสว่าง ความส่องสว่าง โชติมาตรปรากฏและสัมบูรณ์ สี อุณหภูมิผิว และสเปกตรัม การหาระยะทางด้วยแพรัลแลกซ์ แผนภาพเฮิร์ซปรุง-รัสเซลล์ และวิวัฒนาการตามมวลตั้งต้นกับการสร้างธาตุ
difficulty: 6.5
minutes: 45
prerequisites: [earthscience.astronomy.star-formation-energy, physics.modern.quantum-atom, math.functions.logarithms]
encompasses:
  - { id: earthscience.astronomy.star-formation-energy, weight: 0.2 }
  - { id: math.functions.logarithms, weight: 0.15 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: สีของดาวกับอุณหภูมิ
    src: planck.svg
    alt: "กราฟความเข้มของรังสีจากวัตถุดำเทียบกับความยาวคลื่น 0–2,000 nm สามเส้น แต่ละเส้นปรับให้ยอดสูงเท่ากัน เส้นสีน้ำเงิน 12,000 K ยอดอยู่ที่ราว 242 nm ในช่วงอัลตราไวโอเลต เส้นสีเหลืองเข้ม 6,000 K ยอดราว 483 nm ในช่วงแสงที่ตามองเห็น เส้นสีแดง 3,000 K ยอดราว 966 nm ในช่วงอินฟราเรด แถบสีจางแสดงช่วงแสงที่ตามองเห็นราว 380–750 nm หมายเหตุบอกว่าดาวที่ร้อนกว่าแผ่รังสีต่อพื้นที่มากกว่ามาก แปรตาม T⁴"
    caption: "ยิ่งร้อน ความยาวคลื่นที่เข้มที่สุดยิ่งสั้น (วาดโดยทีมคลังรู้ คำนวณจากสูตรของพลังค์ ปรับยอดแต่ละเส้นให้เท่ากัน)"
  - type: worked-example
    title: หากำลังส่องสว่างของดาวจากโชติมาตรและระยะทาง
    problem: "ดาวซิริอัสมีโชติมาตรปรากฏ −1.46 และมุมแพรัลแลกซ์ 0.379 ฟิลิปดา กำลังส่องสว่างเป็นกี่เท่าของดวงอาทิตย์ (โชติมาตรสัมบูรณ์ของดวงอาทิตย์ 4.83)"
    steps:
      - text: "ระยะทาง $d = 1/0.379 \\approx 2.64$ พาร์เซก"
      - text: "$M = m - 5\\log_{10}(d/10) = -1.46 - 5\\log_{10}(0.264) = -1.46 + 2.89 = 1.43$"
        why: "ซิริอัสอยู่ใกล้กว่า 10 pc ถ้าย้ายไปที่ 10 pc จะดูสลัวลง M จึงมากกว่า m"
      - text: "ต่างจากดวงอาทิตย์ $4.83 - 1.43 = 3.40$ โชติมาตร"
      - text: "$\\dfrac{L}{L_\\odot} = 10^{0.4 \\times 3.40} \\approx 22.9$"
    answer: "ราว 23 เท่าของดวงอาทิตย์ (ค่าที่วัดละเอียดราว 25 เท่า เพราะโชติมาตรวัดเฉพาะแสงที่ตามองเห็น)"
  - { type: check, problem: earthscience.astronomy.stellar-properties.p003, prompt: "ต่างกัน 5 โชติมาตร = 100 เท่า" }
  - type: figure
    title: แพรัลแลกซ์ของดาวฤกษ์
    src: parallax.svg
    alt: "ดวงอาทิตย์อยู่ทางซ้าย วงโคจรโลกเป็นวงรีเส้นประ โลกเดือนมกราคมอยู่ด้านบน โลกเดือนกรกฎาคมอยู่ด้านล่าง ห่างดวงอาทิตย์ 1 AU ทั้งคู่ เส้นจากโลกทั้งสองตำแหน่งลากไปยังดาวใกล้ทางขวา ระยะจากดวงอาทิตย์ถึงดาวคือ d มุม p ที่ดาวคือมุมที่รองรับรัศมีวงโคจรโลก 1 AU เส้นที่ต่อเลยดาวไปชี้ดาวพื้นหลังที่อยู่ไกลมากคนละดวง แสดงว่าดาวใกล้ดูเลื่อนตำแหน่ง สูตร d (พาร์เซก) = 1/p (ฟิลิปดา)"
    caption: "ดาวที่อยู่ไกลกว่าเลื่อนน้อยกว่า (วาดโดยทีมคลังรู้ มุมในภาพขยายมาก)"
  - type: figure
    title: แผนภาพเฮิร์ซปรุง-รัสเซลล์
    src: hr.svg
    alt: "แผนภาพพื้นสีเข้ม แกนนอนอุณหภูมิผิว 40,000 ถึง 3,000 K ลดลงไปทางขวาแบบลอการิทึม ด้านบนเขียนชนิดสเปกตรัม O B A F G K M แกนตั้งกำลังส่องสว่าง 10⁻⁴ ถึง 10⁶ เท่าของดวงอาทิตย์ แถบลำดับหลักลาดจากบนซ้าย (ร้อน สว่าง สีฟ้า) ลงล่างขวา (เย็น สลัว สีแดง) ดวงอาทิตย์อยู่กลางแถบที่ 5,772 K และ 1 เท่า ซิริอัส A อยู่บนแถบที่ราว 9,900 K และ 25 เท่า พร็อกซิมาคนครึ่งม้าอยู่ล่างขวาที่ราว 3,000 K และ 0.002 เท่า ดาวยักษ์อยู่เหนือแถบลำดับหลักด้านขวา มีอัลเดบาแรน ดาวยักษ์ใหญ่อยู่บนสุดเป็นแถบแนวนอน มีไรเจล (ราว 12,000 K) และบีเทลจุส (ราว 3,600 K) ดาวแคระขาวอยู่ล่างซ้าย มีซิริอัส B เส้นประเทาแสดงรัศมีเท่ากัน 0.01, 1, 100 และ 1,000 เท่าของดวงอาทิตย์ ลาดขึ้นไปทางซ้าย เส้นประสีเหลืองแสดงเส้นทางโดยประมาณของดาวมวล 1 เท่าของดวงอาทิตย์ จากลำดับหลักขึ้นไปเป็นดาวยักษ์แดงทางขวาบน แล้วข้ามไปทางซ้ายเป็นเนบิวลาดาวเคราะห์ และลงไปเป็นดาวแคระขาว"
    caption: "ตำแหน่งบนแผนภาพบอกขนาดและช่วงชีวิตของดาว (วาดโดยทีมคลังรู้ แถบลำดับหลักจากค่าอุณหภูมิและกำลังส่องสว่างโดยประมาณของดาวแต่ละชนิดสเปกตรัม)"
  - type: worked-example
    title: ดาวดวงนี้ใหญ่แค่ไหน
    problem: "ดาวยักษ์ดวงหนึ่งมีอุณหภูมิผิว 4,000 K และกำลังส่องสว่าง 400 เท่าของดวงอาทิตย์ (5,772 K) รัศมีเป็นกี่เท่าของดวงอาทิตย์"
    steps:
      - text: "จาก $\\dfrac{L}{L_\\odot} = \\left(\\dfrac{R}{R_\\odot}\\right)^2\\left(\\dfrac{T}{T_\\odot}\\right)^4$ จัดใหม่ได้ $\\dfrac{R}{R_\\odot} = \\sqrt{\\dfrac{L}{L_\\odot}}\\left(\\dfrac{T_\\odot}{T}\\right)^2$"
      - text: "$\\sqrt{400} = 20$"
      - text: "$\\left(\\dfrac{5772}{4000}\\right)^2 = (1.443)^2 \\approx 2.08$"
        why: "ดาวเย็นกว่าแผ่พลังงานต่อพื้นที่น้อยกว่า จึงต้องมีพื้นที่มากกว่าเพื่อให้สว่างเท่าเดิม"
      - text: "$R \\approx 20 \\times 2.08 \\approx 41.6\\,R_\\odot$"
    answer: "ราว 42 เท่าของดวงอาทิตย์ อยู่บริเวณดาวยักษ์บนแผนภาพ H–R"
  - { type: check, problem: earthscience.astronomy.stellar-properties.p010 }
glossary:
  - { term: กำลังส่องสว่าง, definition: "พลังงานทั้งหมดที่ดาวแผ่ออกมาต่อวินาที L = 4πR²σT⁴" }
  - { term: ความส่องสว่าง, definition: "พลังงานจากดาวที่มาถึงพื้นที่ 1 ตารางเมตรบนโลก ลดลงตามกำลังสองของระยะทาง" }
  - { term: โชติมาตรปรากฏ, definition: "ตัวเลขบอกความสว่างที่เห็นจากโลก ยิ่งน้อยยิ่งสว่าง ต่างกัน 5 โชติมาตร = 100 เท่า" }
  - { term: โชติมาตรสัมบูรณ์, definition: "โชติมาตรที่ดาวจะมีถ้าอยู่ห่าง 10 พาร์เซก ใช้เทียบกำลังส่องสว่างจริง" }
  - { term: กฎของวีน, definition: "ความยาวคลื่นที่เข้มที่สุดแปรผกผันกับอุณหภูมิ λmax = 2.898 × 10⁻³ m·K / T" }
  - { term: แพรัลแลกซ์, definition: "การเลื่อนตำแหน่งปรากฏของดาวใกล้เมื่อโลกโคจรไปอีกฟาก มุม p (ฟิลิปดา) ให้ระยะ d = 1/p พาร์เซก" }
  - { term: พาร์เซก, definition: "ระยะที่ทำให้มุมแพรัลแลกซ์เท่ากับ 1 ฟิลิปดา ราว 3.26 ปีแสง" }
  - { term: แถบลำดับหลัก, definition: "แถบบนแผนภาพ H–R ที่ดาวหลอมไฮโดรเจนในแกน ดาวราว 90% อยู่ในแถบนี้" }
  - { term: ดาวแคระขาว, definition: "แกนที่เหลือของดาวมวลน้อยถึงปานกลางหลังสิ้นอายุ ร้อนแต่เล็กราวโลก ไม่มีการหลอมนิวเคลียส" }
  - { term: ซูเปอร์โนวา, definition: "การระเบิดของดาวมวลมากเมื่อแกนเหล็กยุบตัว เหลือดาวนิวตรอนหรือหลุมดำ และกระจายธาตุหนักสู่อวกาศ" }
flashcards:
  - { front: "กำลังส่องสว่างขึ้นกับอะไร", back: "รัศมีและอุณหภูมิผิว L ∝ R²T⁴" }
  - { front: "m − M", back: "5 log₁₀(d / 10 pc) ต่างกัน 5 โชติมาตร สว่างต่างกัน 100 เท่า" }
  - { front: "แพรัลแลกซ์ 0.5 ฟิลิปดา", back: "d = 1/0.5 = 2 พาร์เซก ราว 6.5 ปีแสง" }
  - { front: "ลำดับชนิดสเปกตรัมจากร้อนไปเย็น", back: "O B A F G K M (น้ำเงิน → แดง)" }
  - { front: "จุดจบของดาวตามมวล", back: "มวลน้อยถึงปานกลาง: ดาวยักษ์แดง → เนบิวลาดาวเคราะห์ → ดาวแคระขาว มวลมาก: ดาวยักษ์ใหญ่ → ซูเปอร์โนวา → ดาวนิวตรอนหรือหลุมดำ" }
