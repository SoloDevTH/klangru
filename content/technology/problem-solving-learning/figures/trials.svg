<text x="80" y="286.6666666666667" text-anchor="end" font-size="13" fill="#374151">1</text>
<line x1="90" y1="243.33333333333334" x2="570" y2="243.33333333333334" stroke="#e5e7eb" stroke-width="1"/>
<text x="80" y="248.33333333333334" text-anchor="end" font-size="13" fill="#374151">2</text>
<line x1="90" y1="205.0" x2="570" y2="205.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="80" y="210.0" text-anchor="end" font-size="13" fill="#374151">3</text>
<line x1="90" y1="166.66666666666669" x2="570" y2="166.66666666666669" stroke="#e5e7eb" stroke-width="1"/>
<text x="80" y="171.66666666666669" text-anchor="end" font-size="13" fill="#374151">4</text>
<line x1="90" y1="128.33333333333331" x2="570" y2="128.33333333333331" stroke="#e5e7eb" stroke-width="1"/>
<text x="80" y="133.33333333333331" text-anchor="end" font-size="13" fill="#374151">5</text>
<line x1="90" y1="90.0" x2="570" y2="90.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="80" y="95.0" text-anchor="end" font-size="13" fill="#374151">6</text>
<text x="26" y="205.0" transform="rotate(-90 26 205.0)" text-anchor="middle" font-size="14" fill="#374151">ความสูง (เซนติเมตร)</text>
<rect x="150" y="151.33333333333331" width="80" height="168.66666666666669" fill="#bfdbfe" stroke="#334155" stroke-width="1.5"/>
<text x="190.0" y="143.33333333333331" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">4.4</text>
<text x="190.0" y="344" text-anchor="middle" font-size="14" fill="#111827">ครั้งที่ 1</text>
<rect x="290" y="143.66666666666669" width="80" height="176.33333333333331" fill="#bfdbfe" stroke="#334155" stroke-width="1.5"/>
<text x="330.0" y="135.66666666666669" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">4.6</text>
<text x="330.0" y="344" text-anchor="middle" font-size="14" fill="#111827">ครั้งที่ 2</text>
<rect x="430" y="147.5" width="80" height="172.5" fill="#bfdbfe" stroke="#334155" stroke-width="1.5"/>
<text x="470.0" y="139.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">4.5</text>
<text x="470.0" y="344" text-anchor="middle" font-size="14" fill="#111827">ครั้งที่ 3</text>
<text x="310.0" y="374" text-anchor="middle" font-size="14" fill="#374151">ทดลองทั้งสามครั้งใช้ส่วนผสมและเตาเดียวกัน ต่างกันเฉพาะการทดลองซ้ำ</text>
