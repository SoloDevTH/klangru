id: health.disease.illness-symptoms-care
subject: health
title: { th: "อาการเจ็บป่วยและการบาดเจ็บ: การบอกอาการและการปฏิบัติตน", en: "Illness and injury: describing symptoms and what to do" }
summary: อาการเจ็บป่วยที่พบบ่อย การวัดไข้ การบอกอาการให้ผู้ใหญ่เข้าใจ การปฏิบัติตนตามคำแนะนำเมื่อเจ็บป่วยหรือบาดเจ็บเล็กน้อย อาการที่ต้องรีบพบแพทย์ และการป้องกัน
difficulty: 1.5
minutes: 30
prerequisites: [health.hygiene.national-health-rules]
encompasses:
  - { id: health.hygiene.national-health-rules, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: บอกอาการให้ครบ 5 ข้อ
    src: tell-symptoms.svg
    alt: "บัตรห้าแถวบอกวิธีเล่าอาการ 1 เป็นอะไร เช่น ปวดท้อง ตัวร้อน ไอ คัน ตัวอย่าง หนูปวดท้องค่ะ 2 ตรงไหน ชี้หรือบอกตำแหน่ง ตัวอย่าง ตรงรอบสะดือ 3 เป็นตั้งแต่เมื่อไร ตัวอย่าง ตั้งแต่หลังกินข้าวกลางวัน 4 มากแค่ไหน ให้คะแนนความเจ็บ 0–10 ตัวอย่าง เจ็บประมาณ 6 5 มีอาการอื่นไหม เช่น อาเจียน ท้องเสีย ไข้ ผื่น ตัวอย่าง ถ่ายเหลว 2 ครั้ง"
    caption: "ยิ่งบอกครบ ผู้ใหญ่และหมอยิ่งช่วยได้ถูกต้องและรวดเร็ว"
  - type: worked-example
    title: เล่าอาการให้ครูห้องพยาบาลฟัง
    problem: "ระหว่างเรียน แก้วรู้สึกเจ็บคอเวลากลืน ตัวรุม ๆ และไอมาตั้งแต่เมื่อวานเย็น แก้วจึงไปห้องพยาบาล ควรเล่าอาการอย่างไร"
    steps:
      - text: "เป็นอะไร: \"หนูเจ็บคอ ไอ และรู้สึกตัวร้อนค่ะ\""
      - text: "ตรงไหน: ชี้ที่คอ \"เจ็บตรงนี้เวลากลืน\""
      - text: "ตั้งแต่เมื่อไร: \"ไอตั้งแต่เมื่อวานเย็น\""
        why: "ระยะเวลาช่วยให้ผู้ใหญ่ตัดสินใจว่าจะดูแลเองหรือต้องพาไปหาหมอ"
      - text: "มากแค่ไหน: \"เจ็บคอประมาณ 4 จาก 10\""
      - text: "อาการอื่น: \"มีน้ำมูกนิดหน่อย ไม่อาเจียน\" แล้วให้ครูวัดไข้"
        why: "การบอกว่าไม่มีอาการอะไรก็สำคัญ ช่วยตัดโรคที่รุนแรงออกได้"
    answer: "\"หนูเจ็บคอเวลากลืน ไอตั้งแต่เมื่อวานเย็น เจ็บประมาณ 4 รู้สึกตัวร้อน มีน้ำมูกนิดหน่อย ไม่อาเจียนค่ะ\""
  - { type: check, problem: health.disease.illness-symptoms-care.p004, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: worked-example
    title: อ่านกราฟอุณหภูมิ
    problem: "แม่วัดไข้น้องเก่งทุก 4 ชั่วโมงแล้วบันทึกเป็นกราฟ ช่วงเวลาใดที่น้องเก่งมีไข้ (ตั้งแต่ 37.5 องศาเซลเซียส) และอุณหภูมิสูงสุดกับต่ำสุดต่างกันเท่าไร"
    figure:
      src: temperature-chart.svg
      alt: "กราฟเส้นอุณหภูมิร่างกายของน้องเก่ง วัดทางรักแร้ เวลา 06:00 37.0 องศาเซลเซียส 10:00 37.8 14:00 38.6 18:00 38.2 22:00 37.4 มีเส้นประสีแดงที่ 37.5 องศาเซลเซียส"
    steps:
      - text: "เทียบแต่ละจุดกับเส้นประ 37.5: 10:00 (37.8) 14:00 (38.6) 18:00 (38.2) อยู่เหนือเส้น จึงมีไข้ 3 ครั้งที่วัด"
      - text: "06:00 (37.0) และ 22:00 (37.4) อยู่ใต้เส้น จึงยังไม่ถือว่ามีไข้ตามเกณฑ์นี้"
        why: "37.4 ใกล้เส้นมาก แต่ยังน้อยกว่า 37.5"
      - text: "สูงสุด 38.6 ต่ำสุด 37.0 ต่างกัน 38.6 − 37.0 = 1.6 องศาเซลเซียส"
      - text: "แม่ควรให้น้องพัก ดื่มน้ำ และปรึกษาแพทย์หรือเภสัชกร ถ้าไข้สูงหลายวันหรือซึมมากต้องพาไปพบแพทย์"
    answer: "มีไข้ช่วง 10:00–18:00 (วัดได้ 3 ครั้ง) และต่างกัน 1.6 องศาเซลเซียส"
  - { type: check, problem: health.disease.illness-symptoms-care.p007 }
glossary:
  - { term: อาการ, definition: "สิ่งที่ร่างกายแสดงหรือรู้สึกเมื่อผิดปกติ เช่น ไข้ ไอ ปวดท้อง" }
  - { term: ไข้, definition: "อุณหภูมิร่างกายสูงกว่าปกติ หน่วยงานสาธารณสุขไทยมักใช้เกณฑ์ตั้งแต่ 37.5 องศาเซลเซียส" }
  - { term: เทอร์โมมิเตอร์, definition: "เครื่องวัดอุณหภูมิ ใช้วัดไข้ทางรักแร้ ปาก หรือหู" }
  - { term: ผงเกลือแร่ (ORS), definition: "ผงผสมน้ำตามฉลาก ใช้ทดแทนน้ำและเกลือแร่เมื่อท้องเสีย" }
  - { term: เลือดกำเดา, definition: "เลือดที่ไหลออกจากจมูก" }
flashcards:
  - { front: "บอกอาการให้ครบ 5 ข้อ มีอะไรบ้าง", back: "เป็นอะไร ตรงไหน ตั้งแต่เมื่อไร มากแค่ไหน มีอาการอื่นไหม" }
  - { front: "อุณหภูมิเท่าไรถือว่ามีไข้", back: "หน่วยงานสาธารณสุขไทยมักใช้ตั้งแต่ 37.5 องศาเซลเซียสขึ้นไป" }
  - { front: "เลือดกำเดาไหลทำอย่างไร", back: "นั่ง ก้มหน้าไปข้างหน้า บีบปีกจมูก 10–15 นาที หายใจทางปาก ไม่เงยหน้า" }
  - { front: "อาการใดต้องโทร 1669", back: "หายใจลำบาก หมดสติ ชัก ไข้สูงร่วมกับซึมมาก ปวดท้องรุนแรง" }
