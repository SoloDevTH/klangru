problems:
  - id: biology.animals.nervous-system.p001
    topics: [biology.animals.nervous-system]
    difficulty: 1
    type: mcq
    stem: "สัตว์ชนิดใดมีระบบประสาทแบบร่างแหประสาท ไม่มีศูนย์กลาง"
    choices:
      - { id: a, text: "ไฮดรา", correct: true }
      - { id: b, text: "พลานาเรีย", feedback: "พลานาเรียมีปมประสาทที่หัวและเส้นประสาทเป็นขั้นบันได" }
      - { id: c, text: "ไส้เดือนดิน", feedback: "ไส้เดือนดินมีเส้นประสาทใหญ่ด้านท้องและปมประสาททุกปล้อง" }
      - { id: d, text: "กบ", feedback: "กบเป็นสัตว์มีกระดูกสันหลัง มีสมองและไขสันหลัง" }
    hints:
      - "สัตว์นี้มีลำตัวเป็นทรงกระบอก ไม่มีหัวชัดเจน"
      - "ร่างแหประสาทพบในไนดาเรียน"
    solution: "ไฮดรามีร่างแหประสาทกระจายทั่วลำตัว ไม่มีปมประสาทที่เป็นศูนย์กลาง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.nervous-system.p002
    topics: [biology.animals.nervous-system]
    difficulty: 1
    type: match
    stem: "จับคู่ส่วนของเซลล์ประสาทกับหน้าที่"
    pairs:
      - { left: "เดนไดรต์", right: "รับสัญญาณเข้าสู่ตัวเซลล์" }
      - { left: "แอกซอน", right: "นำกระแสประสาทออกจากตัวเซลล์" }
      - { left: "เยื่อไมอีลิน", right: "เป็นฉนวนทำให้นำกระแสประสาทได้เร็ว" }
      - { left: "ปลายแอกซอน", right: "หลั่งสารสื่อประสาทที่ไซแนปส์" }
    hints:
      - "สัญญาณเข้าทางเดนไดรต์และออกทางแอกซอน"
      - "เยื่อไมอีลินเกิดจากเซลล์ชวันน์พันรอบแอกซอน"
    solution: "เดนไดรต์รับสัญญาณ แอกซอนส่งสัญญาณออก เยื่อไมอีลินเป็นฉนวนเร่งการนำกระแส และปลายแอกซอนหลั่งสารสื่อประสาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.nervous-system.p003
    topics: [biology.animals.nervous-system]
    difficulty: 1
    type: numeric
    stem: "ศักย์พักของเซลล์ประสาทโดยทั่วไปประมาณกี่มิลลิโวลต์ (ระบุเครื่องหมายบวกหรือลบ)"
    answer: { value: -70, tolerance: 5, unit: mV }
    misconceptions:
      - { match: 70, feedback: "ด้านในของเยื่อหุ้มเซลล์เป็นลบเมื่อเทียบกับด้านนอก ต้องเป็นค่าลบ" }
      - { match: -55, feedback: "−55 mV คือระดับขีดเริ่ม ไม่ใช่ศักย์พัก" }
      - { match: 30, feedback: "+30 mV คือค่าสูงสุดของศักย์งาน" }
    hints:
      - "ขณะพัก ด้านในเยื่อหุ้มเซลล์เป็นบวกหรือลบ"
      - "ค่านี้ต่ำกว่าระดับขีดเริ่ม −55 mV"
    solution: "ศักย์พักประมาณ −70 mV ด้านในเป็นลบ เพราะปั๊มขน Na⁺ ออกมากกว่าขน K⁺ เข้า และ K⁺ รั่วออกได้มาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.nervous-system.p004
    topics: [biology.animals.nervous-system]
    difficulty: 2
    type: mcq
    stem: "โซเดียม-โพแทสเซียมปั๊มที่เยื่อหุ้มเซลล์ประสาททำงานอย่างไรใน 1 รอบ"
    choices:
      - { id: a, text: "ขน Na⁺ ออก 3 ไอออน และขน K⁺ เข้า 2 ไอออน โดยใช้ ATP", correct: true }
      - { id: b, text: "ขน Na⁺ เข้า 3 ไอออน และขน K⁺ ออก 2 ไอออน โดยใช้ ATP", feedback: "สลับทิศ ปั๊มรักษาให้ Na⁺ ข้างนอกสูงและ K⁺ ข้างในสูง" }
      - { id: c, text: "ขน Na⁺ ออก 2 ไอออน และขน K⁺ เข้า 2 ไอออน โดยไม่ใช้พลังงาน", feedback: "จำนวนไม่เท่ากัน และเป็นแอกทีฟทรานสปอร์ตที่ต้องใช้ ATP" }
      - { id: d, text: "ปล่อยให้ Na⁺ และ K⁺ แพร่ตามความเข้มข้น", feedback: "การแพร่ไม่ใช้ปั๊ม ปั๊มขนสวนความเข้มข้นจึงใช้ ATP" }
    hints:
      - "ปั๊มเป็นแอกทีฟทรานสปอร์ต"
      - "ขณะพัก Na⁺ อยู่ด้านนอกมากและ K⁺ อยู่ด้านในมาก"
    solution: "ปั๊มใช้ ATP ขน Na⁺ ออก 3 ไอออน และ K⁺ เข้า 2 ไอออน ประจุบวกออกมากกว่าเข้า ช่วยให้ด้านในเป็นลบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.nervous-system.p005
    topics: [biology.animals.nervous-system]
    difficulty: 2
    type: order
    stem: "เรียงเหตุการณ์ของศักย์งานหนึ่งครั้งที่ตำแหน่งหนึ่งบนแอกซอน"
    items:
      - "เยื่อหุ้มเซลล์อยู่ที่ศักย์พักประมาณ −70 mV"
      - "สิ่งเร้าทำให้ศักย์ถึงระดับขีดเริ่ม"
      - "ช่อง Na⁺ เปิด Na⁺ ไหลเข้า ด้านในเป็นบวก"
      - "ช่อง Na⁺ ปิด ช่อง K⁺ เปิด K⁺ ไหลออก"
      - "ศักย์ต่ำกว่าศักย์พักชั่วครู่ แล้วกลับสู่ศักย์พัก"
    hints:
      - "ต้องถึงระดับขีดเริ่มก่อน ช่อง Na⁺ จึงเปิดมาก"
      - "Na⁺ เข้าก่อน K⁺ ออกทีหลัง"
    solution: "ศักย์พัก → ถึงขีดเริ่ม → ดีโพลาไรเซชัน (Na⁺ เข้า) → รีโพลาไรเซชัน (K⁺ ออก) → ไฮเพอร์โพลาไรเซชันแล้วกลับสู่ศักย์พัก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.nervous-system.p006
    topics: [biology.animals.nervous-system]
    difficulty: 2
    type: match
    stem: "จับคู่ส่วนของสมองกับหน้าที่"
    pairs:
      - { left: "เมดัลลาออบลองกาตา", right: "ควบคุมการหายใจ การเต้นของหัวใจ และการกลืน" }
      - { left: "ซีรีเบลลัม", right: "การทรงตัวและประสานการเคลื่อนไหว" }
      - { left: "ไฮโพทาลามัส", right: "ควบคุมอุณหภูมิ ความหิว และต่อมใต้สมอง" }
      - { left: "ทาลามัส", right: "ถ่ายทอดกระแสประสาทรับความรู้สึกไปยังซีรีบรัม" }
      - { left: "สมองส่วนกลาง (ในคน)", right: "ศูนย์รีเฟล็กซ์ของลูกตาและม่านตา" }
    hints:
      - "เมดัลลาออบลองกาตาต่อกับไขสันหลัง ควบคุมการทำงานที่ทำให้มีชีวิตอยู่"
      - "ทาลามัสอยู่เหนือไฮโพทาลามัส ทำหน้าที่เป็นสถานีถ่ายทอด"
    solution: "เมดัลลาฯ ควบคุมการหายใจและหัวใจ ซีรีเบลลัมทรงตัว ไฮโพทาลามัสควบคุมอุณหภูมิและต่อมใต้สมอง ทาลามัสถ่ายทอดสัญญาณรับความรู้สึก และสมองส่วนกลางเป็นศูนย์รีเฟล็กซ์ของลูกตา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.nervous-system.p007
    topics: [biology.animals.nervous-system]
    difficulty: 2
    type: text
    stem: "ช่วงบนแอกซอนที่ไม่มีเยื่อไมอีลินหุ้ม และเป็นตำแหน่งที่เกิดศักย์งานในการนำกระแสประสาทแบบกระโดด เรียกว่าอะไร"
    accepted: ["โนดออฟแรนเวียร์", "โหนดออฟแรนเวียร์", "node of Ranvier", "nodes of Ranvier", "โนดแรนเวียร์"]
    misconceptions:
      - { match: "เซลล์ชวันน์", feedback: "เซลล์ชวันน์คือเซลล์ที่สร้างเยื่อไมอีลิน ไม่ใช่ช่องว่างระหว่างปล้อง" }
      - { match: "ไซแนปส์", feedback: "ไซแนปส์คือรอยต่อระหว่างเซลล์ ไม่ใช่ช่วงบนแอกซอน" }
    hints:
      - "ตั้งชื่อตามนักวิทยาศาสตร์ชาวฝรั่งเศส"
      - "ขึ้นต้นด้วยคำว่า โนด"
    solution: "โนดออฟแรนเวียร์ ศักย์งานเกิดที่โนดเท่านั้น กระแสประสาทจึงกระโดดจากโนดหนึ่งไปอีกโนด และเร็วกว่าแอกซอนที่ไม่มีไมอีลิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.nervous-system.p008
    topics: [biology.animals.nervous-system]
    difficulty: 3
    type: mcq
    stem: "จากกราฟศักย์งาน ตำแหน่งใดที่ช่อง Na⁺ เปิดและ Na⁺ ไหลเข้าเซลล์มากที่สุด"
    figure: { src: action-potential-letters.svg, alt: "กราฟศักย์เยื่อเซลล์กับเวลา 0 ถึง 6 มิลลิวินาที มีเส้นประระดับขีดเริ่ม −55 mV เส้นกราฟเริ่มที่ −70 mV พุ่งขึ้นถึง +30 mV ราวมิลลิวินาทีที่ 1.5 แล้วลดลงถึง −80 mV ราวมิลลิวินาทีที่ 2.8 แล้วกลับสู่ −70 mV มีจุด 4 จุด ก อยู่ที่ −70 mV ช่วงก่อนกระตุ้น (0.4 มิลลิวินาที) ข อยู่บนช่วงที่กราฟพุ่งขึ้นที่ −15 mV ค อยู่บนช่วงที่กราฟลดลงที่ −35 mV ง อยู่ที่จุดต่ำสุด −80 mV" }
    choices:
      - { id: a, text: "ก", feedback: "ก เป็นศักย์พัก ช่อง Na⁺ ที่เปิดตามศักย์ไฟฟ้ายังปิดอยู่" }
      - { id: b, text: "ข", correct: true }
      - { id: c, text: "ค", feedback: "ค เป็นช่วงรีโพลาไรเซชัน ช่อง Na⁺ ปิดแล้ว K⁺ ไหลออก" }
      - { id: d, text: "ง", feedback: "ง เป็นช่วงไฮเพอร์โพลาไรเซชัน K⁺ ออกมากเกิน" }
    hints:
      - "Na⁺ ไหลเข้าทำให้ด้านในเป็นบวกมากขึ้น"
      - "หาช่วงที่ศักย์เพิ่มขึ้นอย่างรวดเร็ว"
    solution: "ข อยู่ในช่วงดีโพลาไรเซชัน ศักย์เพิ่มขึ้นเร็วเพราะช่อง Na⁺ เปิดและ Na⁺ ไหลเข้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.nervous-system.p009
    topics: [biology.animals.nervous-system]
    difficulty: 3
    type: numeric
    stem: "แอกซอนของเซลล์ประสาทสั่งการที่ไปยังกล้ามเนื้อน่องยาว 0.9 m นำกระแสประสาทด้วยอัตราเร็ว 90 m/s กระแสประสาทใช้เวลากี่มิลลิวินาทีจากต้นถึงปลายแอกซอน"
    answer: { value: 10, unit: ms }
    misconceptions:
      - { match: 0.01, feedback: "0.01 เป็นหน่วยวินาที โจทย์ถามเป็นมิลลิวินาที" }
      - { match: 81, feedback: "คูณระยะทางกับอัตราเร็ว ต้องหาร" }
    hints:
      - "เวลา = ระยะทาง ÷ อัตราเร็ว"
      - "1 วินาที = 1,000 มิลลิวินาที"
    solution: "$\\tfrac{0.9}{90} = 0.01$ s $= 10$ มิลลิวินาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.nervous-system.p010
    topics: [biology.animals.nervous-system]
    difficulty: 3
    type: mcq
    stem: "เมื่อกระแสประสาทมาถึงปลายแอกซอน ไอออนใดไหลเข้าเซลล์แล้วกระตุ้นให้ถุงหลั่งสารสื่อประสาท"
    choices:
      - { id: a, text: "Ca²⁺", correct: true }
      - { id: b, text: "Na⁺", feedback: "Na⁺ ทำให้เกิดดีโพลาไรเซชัน แต่การหลั่งสารสื่อประสาทกระตุ้นโดย Ca²⁺" }
      - { id: c, text: "K⁺", feedback: "K⁺ ไหลออกตอนรีโพลาไรเซชัน" }
      - { id: d, text: "Cl⁻", feedback: "Cl⁻ ไม่ได้กระตุ้นการหลั่งสารสื่อประสาท" }
    hints:
      - "เป็นไอออนที่มีประจุ +2"
      - "ไอออนนี้สำคัญต่อการหดตัวของกล้ามเนื้อด้วย"
    solution: "ศักย์งานทำให้ช่อง Ca²⁺ ที่ปลายแอกซอนเปิด Ca²⁺ เข้าเซลล์ กระตุ้นให้ถุงรวมกับเยื่อหุ้มเซลล์และปล่อยสารสื่อประสาทแบบเอกโซไซโทซิส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.nervous-system.p011
    topics: [biology.animals.nervous-system]
    difficulty: 3
    type: mcq
    stem: "เกษตรกรที่ฉีดพ่นสารฆ่าแมลงกลุ่มออร์แกโนฟอสเฟตโดยไม่สวมอุปกรณ์ป้องกัน มีอาการกล้ามเนื้อกระตุก น้ำลายและเหงื่อออกมาก ข้อใดอธิบายกลไกได้ถูกต้อง"
    choices:
      - { id: a, text: "สารยับยั้งแอซิทิลโคลีนเอสเทอเรส แอซิทิลโคลีนจึงค้างที่ไซแนปส์และกระตุ้นต่อเนื่อง", correct: true }
      - { id: b, text: "สารทำลายเยื่อไมอีลินทันที กระแสประสาทจึงหยุด", feedback: "ถ้ากระแสประสาทหยุด กล้ามเนื้อจะไม่กระตุก อาการแสดงว่าถูกกระตุ้นมากเกิน" }
      - { id: c, text: "สารขัดขวางการหลั่งแอซิทิลโคลีน", feedback: "ถ้าไม่หลั่ง กล้ามเนื้อจะอ่อนแรง ไม่กระตุก" }
      - { id: d, text: "สารทำให้ศักย์พักเป็นลบมากขึ้น", feedback: "ศักย์ที่ลบมากขึ้นทำให้กระตุ้นยากขึ้น ขัดกับอาการ" }
    hints:
      - "แอซิทิลโคลีนเอสเทอเรสทำหน้าที่อะไรที่ไซแนปส์"
      - "อาการแสดงว่าถูกกระตุ้นมากเกินหรือน้อยเกิน"
    solution: "ออร์แกโนฟอสเฟตยับยั้งเอนไซม์ที่สลายแอซิทิลโคลีน สารสื่อประสาทจึงค้างและกระตุ้นกล้ามเนื้อและต่อมต่อเนื่อง ผู้มีอาการต้องล้างสารออกจากผิวและโทร 1669"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.nervous-system.p012
    topics: [biology.animals.nervous-system]
    difficulty: 3
    type: mcq
    stem: "นักเรียนถูกสุนัขเห่าไล่กะทันหัน หัวใจเต้นแรง ข้อใดเป็นผลของระบบประสาทซิมพาเทติกทั้งหมด"
    choices:
      - { id: a, text: "หัวใจเต้นเร็วขึ้น รูม่านตาขยาย การย่อยอาหารลดลง", correct: true }
      - { id: b, text: "หัวใจเต้นช้าลง รูม่านตาหด การย่อยอาหารเพิ่มขึ้น", feedback: "เป็นผลของพาราซิมพาเทติกขณะพัก" }
