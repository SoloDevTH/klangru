id: earthscience.astronomy.celestial-sphere-time
subject: earthscience
title: { th: ทรงกลมฟ้าและเวลา, en: "The celestial sphere and time" }
summary: แบบจำลองทรงกลมฟ้า ระบบพิกัดขอบฟ้าและศูนย์สูตร เส้นทางขึ้นตกของดวงอาทิตย์และดาวฤกษ์ เวลาสุริยคติปรากฏและปานกลาง เขตเวลาและลองจิจูด และมุมห่างกับตำแหน่งปรากฏของดาวเคราะห์
difficulty: 6
minutes: 45
prerequisites: [math.geometry.angles, math.geometry.trig-ratios, earthscience.astronomy.seasons-moon-tides]
encompasses:
  - { id: math.geometry.angles, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ทรงกลมฟ้าของผู้สังเกตที่เชียงใหม่
    src: sphere.svg
    alt: "ทรงกลมฟ้า ผู้สังเกตอยู่ที่จุดศูนย์กลาง วงกลมสีเขียวคือขอบฟ้า มีทิศ N เหนือทางขวา S ใต้ทางซ้าย E ตะวันออกด้านหน้า W ตะวันตกด้านหลัง จุดเหนือศีรษะอยู่บนสุด วงกลมสีเทาคือเส้นเมริเดียนผ่าน N จุดเหนือศีรษะ และ S เส้นสีม่วงจากผู้สังเกตชี้ไปขั้วฟ้าเหนือ ซึ่งอยู่เหนือทิศเหนือ ทำมุม 18.79° กับขอบฟ้า วงกลมสีแดงคือเส้นศูนย์สูตรฟ้า ตัดขอบฟ้าที่ทิศตะวันออกและตะวันตกพอดี และเอียงขึ้นไปทางทิศใต้ ดาว X มีมุมเงย 38° (ส่วนโค้งสีส้มจากขอบฟ้าขึ้นไปถึงดาว) และมุมทิศ 125° (ส่วนโค้งสีฟ้าตามขอบฟ้าจากทิศเหนือผ่านทิศตะวันออก)"
    caption: "มุมเงยของขั้วฟ้าเหนือเท่ากับละติจูด (วาดโดยทีมคลังรู้ ฉายภาพจากพิกัดสามมิติ เส้นประคือด้านหลังทรงกลม)"
  - type: worked-example
    title: ดาวดวงนี้ขึ้นสูงเท่าใดและเห็นได้หรือไม่
    problem: "ดาวคาโนปุสมีเดคลิเนชัน −52.70° ผู้สังเกตที่เชียงใหม่ (18.79° เหนือ) และกรุงเทพฯ (13.75° เหนือ) เห็นดาวนี้สูงสุดกี่องศา"
    steps:
      - text: "ตรวจก่อนว่าขึ้นได้หรือไม่: ดาวขึ้นได้เมื่อ $\\delta > -(90^\\circ - \\varphi)$ ที่เชียงใหม่ขีดจำกัดคือ −71.21° ที่กรุงเทพฯ −76.25° คาโนปุส (−52.70°) ขึ้นได้ทั้งสองที่"
      - text: "เชียงใหม่: $h = 90 - 18.79 + (-52.70) = 18.51^\\circ$"
        why: "ดาวขึ้นสูงสุดเมื่อผ่านเส้นเมริเดียนทางทิศใต้"
      - text: "กรุงเทพฯ: $h = 90 - 13.75 - 52.70 = 23.55^\\circ$"
      - text: "ยิ่งอยู่ใต้ ดาวทางใต้ของท้องฟ้ายิ่งขึ้นสูง"
    answer: "เชียงใหม่ราว 18.5° กรุงเทพฯ ราว 23.6° เหนือขอบฟ้าทิศใต้"
  - { type: check, problem: earthscience.astronomy.celestial-sphere-time.p003 }
  - type: figure
    title: เส้นทางของดวงอาทิตย์ในระนาบเมริเดียนที่เชียงใหม่
    src: meridian.svg
    alt: "ภาพตัดตามเส้นเมริเดียนของผู้สังเกตที่เชียงใหม่ ละติจูด 18.79° เหนือ เส้นขอบฟ้าแนวนอน S ใต้ทางซ้าย N เหนือทางขวา ครึ่งวงกลมบนคือท้องฟ้า ครึ่งล่างเส้นประคือใต้ขอบฟ้า เส้นประสีม่วงคือแกนฟ้าชี้ไปขั้วฟ้าเหนือที่มุมเงย 18.79° เหนือทิศเหนือ เส้นทางของดวงอาทิตย์เป็นเส้นตรงตั้งฉากกับแกนฟ้าสามเส้น เส้นสีแดงวันที่ราว 21 มิถุนายน (δ = +23.44°) ผ่านเมริเดียนที่มุมเงย 85.35° ทางทิศเหนือ เส้นสีส้มเส้นศูนย์สูตรฟ้าวันวิษุวัต (δ = 0°) ผ่านที่ 71.21° ทางทิศใต้ เส้นสีน้ำเงินวันที่ราว 21 ธันวาคม (δ = −23.44°) ผ่านที่ 47.77° ทางทิศใต้ ส่วนเหนือขอบฟ้าเป็นเส้นทึบ ส่วนใต้ขอบฟ้าเป็นเส้นประ เส้นสีม่วงใกล้ทิศเหนือบอกว่าดาวที่ δ > +71.21° ไม่ตกลับขอบฟ้า"
    caption: "วงกลมรายวันของดาวขนานกับเส้นศูนย์สูตรฟ้า จึงเห็นเป็นเส้นตั้งฉากกับแกนฟ้าในภาพตัดนี้ (วาดโดยทีมคลังรู้ มุมคำนวณจาก h = 90° − φ + δ)"
  - type: worked-example
    title: ดวงอาทิตย์ผ่านเมริเดียนที่กรุงเทพฯ กี่โมง
    problem: "ต้นเดือนพฤศจิกายน สมการเวลา (เวลาปรากฏ − เวลาปานกลาง) ราว +16.5 นาที กรุงเทพฯ อยู่ที่ลองจิจูด 100.5° ตะวันออก ดวงอาทิตย์ผ่านเมริเดียนเวลาใดตามเวลาประเทศไทย"
    steps:
      - text: "เวลาประเทศไทย (UTC+7) เป็นเวลาปานกลางของเส้น 105° ตะวันออก"
      - text: "กรุงเทพฯ อยู่ทางตะวันตกของเส้นนี้ $105 - 100.5 = 4.5^\\circ$ เที่ยงปานกลางจึงช้ากว่า $4.5 \\times 4 = 18$ นาที คือ 12:18 น."
        why: "โลกหมุน 360° ใน 24 ชั่วโมง คือ 1° ต่อ 4 นาที ที่ทางตะวันตกเห็นดวงอาทิตย์ผ่านเมริเดียนทีหลัง"
      - text: "สมการเวลาเป็นบวก ดวงอาทิตย์จริงนำหน้าดวงอาทิตย์ปานกลาง จึงผ่านเมริเดียนเร็วกว่า 12:18 น. ไป 16.5 นาที"
      - text: "$12{:}18 - 16.5\\ \\text{นาที} \\approx 12{:}01.5$ น."
    answer: "ราว 12:02 น. ส่วนกลางเดือนกุมภาพันธ์ (สมการเวลา −14.1 นาที) ผ่านราว 12:32 น."
  - type: figure
    title: มุมห่างและตำแหน่งของดาวเคราะห์
    src: elongation.svg
    alt: "มองลงมาจากเหนือระนาบวงโคจร ดาวเคราะห์โคจรทวนเข็มนาฬิกา ดวงอาทิตย์อยู่ตรงกลาง วงโคจรดาวศุกร์ โลก และดาวอังคารเป็นวงกลมซ้อนกัน โลกอยู่ด้านล่าง ดาวศุกร์ระหว่างโลกกับดวงอาทิตย์คือร่วมทิศแนววงใน ด้านหลังดวงอาทิตย์คือร่วมทิศแนววงนอก เส้นจากโลกสัมผัสวงโคจรดาวศุกร์ทางซ้าย ทำมุม 46° กับแนวโลก–ดวงอาทิตย์ คือดาวศุกร์มุมห่างมากที่สุดทางตะวันออก เป็นดาวประจำเมือง เห็นหัวค่ำ จุดสัมผัสทางขวาคือมุมห่างมากที่สุดทางตะวันตก เป็นดาวประกายพรึก เห็นรุ่งเช้า ดาวอังคารด้านบนหลังดวงอาทิตย์คือร่วมทิศ มุมห่าง 0° ดาวอังคารด้านล่างนอกโลกคือตำแหน่งตรงข้าม มุมห่าง 180° และดาวอังคารทางขวาของโลกในแนวตั้งฉากกับแนวโลก–ดวงอาทิตย์คือมุมห่าง 90° หมายเหตุบอกว่าเมื่อมองจากโลกไปทางดวงอาทิตย์ ด้านซ้ายของภาพคือทางทิศตะวันออกของดวงอาทิตย์"
    caption: "มุมห่างมากที่สุดของดาวศุกร์ sin e = 0.723 ได้ราว 46° (วาดโดยทีมคลังรู้ รัศมีวงโคจรตามมาตราส่วน วงโคจรวาดเป็นวงกลม)"
  - { type: check, problem: earthscience.astronomy.celestial-sphere-time.p009 }
glossary:
  - { term: ทรงกลมฟ้า, definition: "แบบจำลองท้องฟ้าเป็นทรงกลมใหญ่มีผู้สังเกตอยู่ตรงกลาง ดาวทุกดวงดูเหมือนติดอยู่บนผิวทรงกลม" }
  - { term: มุมเงย, definition: "มุมจากขอบฟ้าขึ้นไปถึงวัตถุบนท้องฟ้า 0°–90°" }
  - { term: มุมทิศ, definition: "มุมตามขอบฟ้าจากทิศเหนือไปทางตะวันออกถึงแนวใต้วัตถุ 0°–360°" }
  - { term: เดคลิเนชัน, definition: "มุมจากเส้นศูนย์สูตรฟ้าไปทางเหนือ (+) หรือใต้ (−) ของวัตถุ คล้ายละติจูด" }
  - { term: ไรต์แอสเซนชัน, definition: "มุมตามเส้นศูนย์สูตรฟ้าไปทางตะวันออกจากจุดวสันตวิษุวัต วัดเป็นชั่วโมง 0–24 h" }
  - { term: วันดาราคติ, definition: "เวลาที่โลกหมุนรอบตัวเองครบรอบเทียบกับดาวฤกษ์ 23 ชั่วโมง 56 นาที 4 วินาที" }
  - { term: เวลาสุริยคติปรากฏ, definition: "เวลาที่ยึดดวงอาทิตย์จริง เที่ยงวันคือเมื่อดวงอาทิตย์ผ่านเส้นเมริเดียน" }
  - { term: เวลาสุริยคติปานกลาง, definition: "เวลาที่ยึดดวงอาทิตย์สมมติซึ่งเคลื่อนสม่ำเสมอ ทุกวันยาว 24 ชั่วโมงเท่ากัน" }
  - { term: สมการเวลา, definition: "ผลต่างระหว่างเวลาสุริยคติปรากฏกับเวลาสุริยคติปานกลาง ราว −14 ถึง +16 นาที" }
  - { term: มุมห่าง, definition: "มุมระหว่างดวงอาทิตย์กับดาวเคราะห์เมื่อมองจากโลก" }
flashcards:
  - { front: "มุมเงยของขั้วฟ้าเหนือ", back: "เท่ากับละติจูดของผู้สังเกต เช่น เชียงใหม่ 18.79° กรุงเทพฯ 13.75°" }
  - { front: "มุมเงยเมื่อดาวผ่านเมริเดียน", back: "h = 90° − φ + δ (ถ้าเกิน 90° ผ่านทางเหนือ ใช้ 180° − h)" }
  - { front: "ลองจิจูดกับเวลา", back: "1° = 4 นาที 15° = 1 ชั่วโมง ไทยใช้เส้น 105° ตะวันออก (UTC+7)" }
  - { front: "ทำไมดาวขึ้นเร็วขึ้นวันละราว 4 นาที", back: "วันดาราคติ 23 ชม. 56 นาที สั้นกว่าวันสุริยะ เพราะโลกโคจรรอบดวงอาทิตย์ไปด้วย" }
  - { front: "ดาวประจำเมือง กับ ดาวประกายพรึก", back: "ดาวศุกร์ทางตะวันออกของดวงอาทิตย์ (เห็นหัวค่ำ) กับทางตะวันตก (เห็นรุ่งเช้า) มุมห่างไม่เกินราว 46°" }
