<text x="250.0" y="268.0" text-anchor="middle" fill="#15211e" font-size="12">หน้าวงที่หันหาแม่เหล็กเป็นขั้วเหนือ</text>
<text x="250.0" y="288.0" text-anchor="middle" fill="#15211e" font-size="12">ผลักแม่เหล็ก ต้านการเข้าใกล้</text>
<text x="250.0" y="312.0" text-anchor="middle" fill="#c26a00" font-size="12">มองจากฝั่งแม่เหล็ก กระแสวนทวนเข็มนาฬิกา</text>
<text x="580.0" y="30.0" text-anchor="middle" fill="#15211e" font-size="15" font-weight="bold">ขั้วเหนือเคลื่อนออกจากวง</text>
<rect x="420.0" y="140.0" width="60.0" height="40.0" rx="0" fill="#5b8fd6" stroke="#15211e" stroke-width="2"/>
<rect x="480.0" y="140.0" width="60.0" height="40.0" rx="0" fill="#d9534f" stroke="#15211e" stroke-width="2"/>
<text x="450.0" y="166.0" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">S</text>
<text x="510.0" y="166.0" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">N</text>
<line x1="480.0" y1="205.0" x2="443.5" y2="205.0" stroke="#15211e" stroke-width="2.5"/>
<polygon points="435.0,205.0 445.0,209.5 445.0,200.5" fill="#15211e" stroke="#15211e" stroke-width="1" stroke-linejoin="round"/>
<text x="480.0" y="230.0" text-anchor="middle" fill="#777" font-size="12">การเคลื่อนที่ของแม่เหล็ก</text>
<ellipse cx="670" cy="160" rx="22" ry="75" fill="none" stroke="#c26a00" stroke-width="5"/>
<line x1="610.0" y1="160.0" x2="669.8" y2="160.0" stroke="#7b3fa0" stroke-width="3"/>
<polygon points="680.0,160.0 668.0,154.6 668.0,165.4" fill="#7b3fa0" stroke="#7b3fa0" stroke-width="1" stroke-linejoin="round"/>
<text x="600.0" y="145.0" text-anchor="middle" fill="#7b3fa0" font-size="13">B เหนี่ยวนำ</text>
<text x="650.0" y="268.0" text-anchor="middle" fill="#15211e" font-size="12">หน้าวงที่หันหาแม่เหล็กเป็นขั้วใต้</text>
<text x="650.0" y="288.0" text-anchor="middle" fill="#15211e" font-size="12">ดูดแม่เหล็ก ต้านการออกห่าง</text>
<text x="650.0" y="312.0" text-anchor="middle" fill="#c26a00" font-size="12">มองจากฝั่งแม่เหล็ก กระแสวนตามเข็มนาฬิกา</text>
<text x="400.0" y="348.0" text-anchor="middle" fill="#777" font-size="13">ฟลักซ์เพิ่ม: สนามเหนี่ยวนำต้านทิศสนามเดิม   ฟลักซ์ลด: สนามเหนี่ยวนำเสริมทิศสนามเดิม</text>
</svg>
