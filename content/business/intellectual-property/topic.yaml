id: business.law.intellectual-property
subject: business
title:
  th: ทรัพย์สินทางปัญญาในธุรกิจ
  en: Intellectual property in business
summary: ลิขสิทธิ์ สิทธิบัตร อนุสิทธิบัตร เครื่องหมายการค้า สิ่งบ่งชี้ทางภูมิศาสตร์ และความลับทางการค้าตามกฎหมายไทย ผลของการคุ้มครอง และการละเมิดในการขายของออนไลน์
difficulty: 4
minutes: 40
prerequisites:
- business.econ.consumer-rights
encompasses:
- id: business.econ.consumer-rights
  weight: 0.2
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  src: ip-durations.svg
  alt: แผนภูมิแท่งแนวนอนเทียบระยะเวลาคุ้มครอง ช่องละ 5 ปี ถึง 40 ปี สิทธิบัตรการประดิษฐ์ 20 ปีนับแต่วันยื่นคำขอ ต่ออายุไม่ได้ สิทธิบัตรการออกแบบผลิตภัณฑ์ 10 ปีนับแต่วันยื่นคำขอ อนุสิทธิบัตร 6 ปี ต่ออายุได้ 2 ครั้ง ครั้งละ 2 ปี รวม 10 ปี เครื่องหมายการค้า 10 ปี ต่ออายุได้คราวละ 10 ปีเรื่อย ๆ ลิขสิทธิ์ของบุคคล ตลอดชีวิตผู้สร้างสรรค์บวก 50 ปีหลังเสียชีวิต สิ่งบ่งชี้ทางภูมิศาสตร์คุ้มครองตราบที่สินค้ายังมีคุณลักษณะตามที่ขึ้นทะเบียน หมายเหตุว่าลิขสิทธิ์ไม่ต้องจดทะเบียน ส่วนสิทธิบัตร อนุสิทธิบัตร และเครื่องหมายการค้าต้องยื่นคำขอที่กรมทรัพย์สินทางปัญญา
  caption: แต่ละประเภทคุ้มครองนานไม่เท่ากัน และบางประเภทต้องจดทะเบียนก่อน
- type: check
  problem: business.law.intellectual-property.p001
  prompt: แต่ละสิ่งเป็นทรัพย์สินทางปัญญาประเภทใด
- type: worked-example
  title: คำนวณปีที่ความคุ้มครองสิ้นสุด
  problem: วิสาหกิจชุมชน (สมมติ) ยื่นขออนุสิทธิบัตรเครื่องคั่วกาแฟแบบใหม่เมื่อปี พ.ศ. $2566$ และยื่นจดเครื่องหมายการค้าของแบรนด์ในปีเดียวกัน ถ้าต่ออายุทุกครั้งที่ทำได้ ความคุ้มครองของอนุสิทธิบัตรสิ้นสุดเมื่อใด และถึงปี พ.ศ. $2600$ เครื่องหมายการค้าต้องต่ออายุไปแล้วกี่ครั้ง
  steps:
  - text: 'อนุสิทธิบัตร: $6$ ปี ต่ออายุได้ $2$ ครั้ง ครั้งละ $2$ ปี รวม $10$ ปี'
    why: นับจากวันยื่นคำขอ
  - text: อนุสิทธิบัตรสิ้นสุดราวปี $2566 + 10 = 2576$ หลังจากนั้นผู้อื่นผลิตเครื่องแบบนี้ได้
  - text: 'เครื่องหมายการค้า: ช่วงแรกถึงปี $2576$ ต่ออายุครั้งที่ 1 ถึง $2586$ ครั้งที่ 2 ถึง $2596$ ครั้งที่ 3 ถึง $2606$'
    why: ต่ออายุได้คราวละ 10 ปีไม่จำกัดจำนวนครั้ง
  - text: ถึงปี $2600$ จึงต้องต่ออายุไปแล้ว $3$ ครั้ง
  answer: อนุสิทธิบัตรสิ้นสุดราวปี พ.ศ. $2576$ เครื่องหมายการค้าต่ออายุ $3$ ครั้ง
- type: check
  problem: business.law.intellectual-property.p004
  prompt: สิทธิบัตรนับอายุจากวันไหน
- type: worked-example
  title: สิทธิบัตรหรือความลับทางการค้า
  problem: นักเรียนประดิษฐ์ที่ปอกมะพร้าวแบบใหม่ซึ่งคนเห็นแล้วลอกแบบได้ทันที และเพื่อนอีกกลุ่มคิดสูตรซอสที่ไม่มีใครแกะสูตรได้ แต่ละกลุ่มควรคุ้มครองด้วยวิธีใด
  steps:
  - text: 'ที่ปอกมะพร้าว: ใครซื้อไปก็เห็นกลไกทันที เก็บเป็นความลับไม่ได้'
    why: ความลับทางการค้าใช้ได้เฉพาะสิ่งที่ยังเป็นความลับ
  - text: จึงควรยื่นขอสิทธิบัตรหรืออนุสิทธิบัตร (ถ้าใหม่และใช้ในอุตสาหกรรมได้) ก่อนนำออกขายหรือเผยแพร่ เพราะการเปิดเผยก่อนยื่นทำให้ไม่ใหม่
  - text: 'สูตรซอส: แกะยาก จึงเก็บเป็นความลับทางการค้าได้นานตราบที่รักษาความลับ'
    why: สิทธิบัตรต้องเปิดเผยรายละเอียดและคุ้มครองเพียงช่วงเวลาหนึ่ง
  - text: ทั้งสองกลุ่มควรจดเครื่องหมายการค้าให้ชื่อแบรนด์ด้วย
  answer: ที่ปอกมะพร้าว → สิทธิบัตร/อนุสิทธิบัตร · สูตรซอส → ความลับทางการค้า · ชื่อแบรนด์ → เครื่องหมายการค้า
glossary:
- term: ทรัพย์สินทางปัญญา
  definition: ผลงานที่เกิดจากความคิดสร้างสรรค์ของมนุษย์ ซึ่งกฎหมายให้สิทธิแก่เจ้าของในการใช้ประโยชน์
- term: ลิขสิทธิ์
  definition: สิทธิของผู้สร้างสรรค์งาน เช่น วรรณกรรม ศิลปกรรม ดนตรี ภาพยนตร์ โปรแกรมคอมพิวเตอร์ เกิดขึ้นทันทีโดยไม่ต้องจดทะเบียน
- term: สิทธิบัตร
  definition: หนังสือสำคัญที่รัฐออกให้คุ้มครองการประดิษฐ์หรือการออกแบบผลิตภัณฑ์ที่ใหม่ ภายในระยะเวลาที่กำหนด
- term: อนุสิทธิบัตร
  definition: การคุ้มครองการประดิษฐ์ที่ใหม่และใช้ในอุตสาหกรรมได้ แต่ไม่ต้องมีขั้นการประดิษฐ์สูงเท่าสิทธิบัตร
- term: เครื่องหมายการค้า
  definition: ชื่อ โลโก้ หรือเครื่องหมายที่ใช้แยกสินค้าหรือบริการของผู้ประกอบการหนึ่งจากผู้อื่น
- term: สิ่งบ่งชี้ทางภูมิศาสตร์ (GI)
  definition: ชื่อหรือสัญลักษณ์ที่บอกแหล่งผลิต ซึ่งทำให้สินค้ามีคุณภาพหรือชื่อเสียงเฉพาะ เช่น ข้าวหอมมะลิทุ่งกุลาร้องไห้
- term: ความลับทางการค้า
  definition: ข้อมูลทางการค้าที่ยังไม่รู้กันทั่วไป มีมูลค่าเพราะเป็นความลับ และเจ้าของมีมาตรการรักษาความลับ
- term: สมบัติสาธารณะ
  definition: งานที่หมดอายุความคุ้มครองหรือไม่ได้รับความคุ้มครอง ใครก็นำไปใช้ได้
flashcards:
- front: สิทธิบัตรการประดิษฐ์
  back: 20 ปี นับแต่วันยื่นคำขอ ต่ออายุไม่ได้
- front: อนุสิทธิบัตร
  back: 6 ปี ต่ออายุได้ 2 ครั้ง ครั้งละ 2 ปี รวมไม่เกิน 10 ปี
- front: เครื่องหมายการค้า
  back: คราวละ 10 ปีนับแต่วันยื่นคำขอ ต่ออายุได้ไม่จำกัดครั้ง
- front: ลิขสิทธิ์ของบุคคล
  back: ตลอดชีวิตผู้สร้างสรรค์ + 50 ปี ไม่ต้องจดทะเบียน
- front: หน่วยงานที่รับจดทะเบียน
  back: กรมทรัพย์สินทางปัญญา กระทรวงพาณิชย์
