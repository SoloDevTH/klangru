<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 250" width="330" height="250" font-family="sans-serif" font-size="15">
  <title>แบบจำลองพื้นที่ของ (x + 2)(x + 3) = x² + 5x + 6</title>
  <rect x="0" y="0" width="330" height="250" fill="#ffffff"/>
  <rect x="100.0" y="50.0" width="130.0" height="130.0" rx="0" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="165.0" y="122.0" font-size="20" text-anchor="middle" fill="#15211e" font-weight="bold" font-style="normal">x²</text>
  <rect x="230.0" y="50.0" width="78.0" height="130.0" rx="0" fill="#fbe7da" stroke="#15211e" stroke-width="2"/>
  <text x="269.0" y="122.0" font-size="20" text-anchor="middle" fill="#15211e" font-weight="bold" font-style="normal">3x</text>
  <rect x="100.0" y="180.0" width="130.0" height="52.0" rx="0" fill="#fbe7da" stroke="#15211e" stroke-width="2"/>
  <text x="165.0" y="213.0" font-size="20" text-anchor="middle" fill="#15211e" font-weight="bold" font-style="normal">2x</text>
  <rect x="230.0" y="180.0" width="78.0" height="52.0" rx="0" fill="#e3e7f6" stroke="#15211e" stroke-width="2"/>
  <text x="269.0" y="213.0" font-size="20" text-anchor="middle" fill="#15211e" font-weight="bold" font-style="normal">6</text>
  <text x="165.0" y="38.0" font-size="18" text-anchor="middle" fill="#0a6b60" font-weight="normal" font-style="italic">x</text>
  <text x="269.0" y="38.0" font-size="18" text-anchor="middle" fill="#0a6b60" font-weight="normal" font-style="normal">3</text>
  <text x="86.0" y="121.0" font-size="18" text-anchor="middle" fill="#b4521f" font-weight="normal" font-style="italic">x</text>
  <text x="86.0" y="212.0" font-size="18" text-anchor="middle" fill="#b4521f" font-weight="normal" font-style="normal">2</text>
  <line x1="100.0" y1="20.0" x2="308.0" y2="20.0" stroke="#0a6b60" stroke-width="1.5" stroke-linecap="round"/>
  <text x="204.0" y="14.0" font-size="16" text-anchor="middle" fill="#0a6b60" font-weight="normal" font-style="normal">x + 3</text>
  <line x1="66.0" y1="50.0" x2="66.0" y2="232.0" stroke="#b4521f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="58.0" y="147.0" font-size="16" text-anchor="end" fill="#b4521f" font-weight="normal" font-style="normal">x + 2</text>
</svg>
