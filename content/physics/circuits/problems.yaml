  - id: phy.circuit.p022
    topics: [physics.electricity.circuits]
    difficulty: 3
    type: numeric
    stem: "นักเรียนชุมนุมหุ่นยนต์มีตัวต้านทาน $12\\ \\Omega$ หนึ่งตัว แต่ต้องการความต้านทานรวม $4\\ \\Omega$ ต้องนำตัวต้านทานค่ากี่โอห์มมาต่อขนานกับตัว $12\\ \\Omega$ (ตอบเป็นตัวเลขในหน่วย Ω)"
    answer: { value: 6, tolerance: 0.05, unit: Ω }
    hints:
      - "เขียน $\\dfrac{1}{4} = \\dfrac{1}{12} + \\dfrac{1}{R_2}$"
      - "ย้าย $\\dfrac{1}{12}$ ไปลบออกจาก $\\dfrac{1}{4}$ แล้วกลับเศษส่วน"
    misconceptions:
      - { match: 8, feedback: "ดูเหมือนคิดแบบอนุกรม $12 - 4$ แบบขนานต้องคิดด้วยส่วนกลับ" }
      - { match: 3, feedback: "ดูเหมือนบวก $\\tfrac{1}{4} + \\tfrac{1}{12}$ ต้องลบ เพราะ $\\tfrac{1}{R_2} = \\tfrac{1}{4} - \\tfrac{1}{12}$" }
    solution: "$\\dfrac{1}{R_2} = \\dfrac{1}{4} - \\dfrac{1}{12} = \\dfrac{3 - 1}{12} = \\dfrac{2}{12}$ ดังนั้น $R_2 = 6\\ \\Omega$ ตรวจ: $\\dfrac{12 \\times 6}{12 + 6} = 4\\ \\Omega$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true
