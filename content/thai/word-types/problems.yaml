    ai_assisted: true

  - id: thai.word.p019
    topics: [thai.grammar.word-types]
    difficulty: 4
    type: mcq
    stem: "คำว่า **แต่** ในสองประโยคนี้เป็นคำชนิดใด (1) \"ฉันอยากไปเที่ยว **แต่** ฝนตก\" (2) \"น้องกิน **แต่** ผัก\""
    choices:
      - { id: a, text: "(1) สันธาน (2) วิเศษณ์", correct: true, feedback: "ถูก ประโยคแรก แต่ เชื่อมสองข้อความที่ขัดกัน ประโยคที่สอง แต่ มีความหมายว่า เท่านั้น ขยายความการกิน" }
      - { id: b, text: "สันธานทั้งสองประโยค", feedback: "ประโยคที่สองไม่มีข้อความสองส่วนให้เชื่อม แต่ ในที่นี้หมายถึง เพียงอย่างเดียว" }
      - { id: c, text: "(1) บุพบท (2) สันธาน", feedback: "แต่ ในประโยคแรกตามด้วยข้อความ ฝนตก ไม่ใช่คำนามเดี่ยว จึงไม่ใช่บุพบท" }
      - { id: d, text: "(1) วิเศษณ์ (2) บุพบท", feedback: "สลับกัน และ แต่ ในประโยคที่สองไม่ได้บอกความสัมพันธ์ เช่น ตำแหน่งหรือความเป็นเจ้าของ" }
    hints:
      - "ประโยคแรกมีข้อความกี่ส่วน"
      - "ประโยคที่สอง ลองแทน แต่ ด้วยคำว่า เท่านั้น หรือ อย่างเดียว"
    solution: "(1) แต่ เชื่อม ฉันอยากไปเที่ยว กับ ฝนตก ซึ่งขัดแย้งกัน จึงเป็น **คำสันธาน** (2) กินแต่ผัก = กินผักอย่างเดียว แต่ ขยายความการกิน จึงเป็น **คำวิเศษณ์** คำเดียวกันจึงเป็นคนละชนิดได้ตามหน้าที่"
