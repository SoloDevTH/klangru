problems:
  - id: management.public.public-administration.p001
    topics: [management.public.public-administration]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นลักษณะของระบบราชการตามแนวคิดของเวเบอร์"
    choices:
      - { id: a, text: "คัดเลือกคนเข้ารับราชการด้วยการสอบแข่งขันตามความรู้ความสามารถ", correct: true }
      - { id: b, text: "ให้ผู้บริหารแต่งตั้งญาติที่ไว้ใจได้เข้าทำงาน", feedback: "เวเบอร์เน้นระบบคุณธรรมและการไม่ใช้ความสัมพันธ์ส่วนตัว การแต่งตั้งญาติคือระบบอุปถัมภ์" }
      - { id: c, text: "ตัดสินใจแต่ละเรื่องตามดุลพินิจโดยไม่ต้องมีกฎเกณฑ์", feedback: "ระบบราชการของเวเบอร์ใช้กฎระเบียบที่เขียนไว้ เพื่อให้คาดการณ์ได้และเป็นธรรม" }
      - { id: d, text: "ให้ทุกคนมีอำนาจเท่ากัน ไม่มีสายบังคับบัญชา", feedback: "ระบบราชการของเวเบอร์มีลำดับขั้นการบังคับบัญชาที่ชัดเจน" }
    hints:
      - "เวเบอร์ต้องการให้องค์การเป็นธรรมและคาดการณ์ได้"
      - "การคัดเลือกคนใช้หลักความรู้ความสามารถ ไม่ใช่ความสัมพันธ์"
    solution: "ระบบราชการในอุดมคติของเวเบอร์คัดเลือกและเลื่อนตำแหน่งตามความรู้ความสามารถ (ระบบคุณธรรม) มีกฎเป็นลายลักษณ์อักษร และมีสายการบังคับบัญชาชัดเจน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-administration.p002
    topics: [management.public.public-administration]
    difficulty: 1
    type: match
    stem: "จับคู่ส่วนของการบริหารราชการไทยกับหลักการจัดระเบียบ"
    pairs:
      - { left: "ราชการส่วนกลาง", right: "หลักการรวมอำนาจ" }
      - { left: "ราชการส่วนภูมิภาค", right: "หลักการแบ่งอำนาจ" }
      - { left: "ราชการส่วนท้องถิ่น", right: "หลักการกระจายอำนาจ" }
    hints:
      - "ส่วนภูมิภาคยังเป็นเจ้าหน้าที่ของส่วนกลางที่ไปประจำในพื้นที่"
      - "ส่วนท้องถิ่นมีผู้บริหารที่ประชาชนในพื้นที่เลือกเอง"
    solution: "ส่วนกลางรวมอำนาจไว้ที่กระทรวง ทบวง กรม ส่วนภูมิภาคได้รับการแบ่งอำนาจจากส่วนกลาง ส่วนท้องถิ่นได้รับการกระจายอำนาจให้ตัดสินใจเอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-administration.p003
    topics: [management.public.public-administration]
    difficulty: 1
    type: mcq
    stem: "หน่วยงานใดเป็นราชการส่วนท้องถิ่น"
    choices:
      - { id: a, text: "องค์การบริหารส่วนตำบล", correct: true }
      - { id: b, text: "ที่ว่าการอำเภอ", feedback: "อำเภอเป็นราชการส่วนภูมิภาค นายอำเภอได้รับแต่งตั้งจากส่วนกลาง" }
      - { id: c, text: "สำนักงานจังหวัด", feedback: "จังหวัดเป็นราชการส่วนภูมิภาค ต่างจากองค์การบริหารส่วนจังหวัดซึ่งเป็นส่วนท้องถิ่น" }
      - { id: d, text: "กรมการปกครอง", feedback: "กรมเป็นราชการส่วนกลาง" }
    hints:
      - "ส่วนท้องถิ่นมีผู้บริหารและสภาที่ประชาชนในพื้นที่เลือกตั้ง"
      - "อำเภอและจังหวัดเป็นราชการส่วนภูมิภาค"
    solution: "องค์การบริหารส่วนตำบลเป็นราชการส่วนท้องถิ่น ส่วนอำเภอและจังหวัดเป็นส่วนภูมิภาค และกรมเป็นส่วนกลาง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-administration.p004
    topics: [management.public.public-administration]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นแนวทางของการบริหารภาครัฐแนวใหม่ (NPM) ชัดเจนที่สุด"
    choices:
      - { id: a, text: "ทำสัญญาผลงานกับผู้บริหารหน่วยงาน และจ้างเอกชนเก็บขยะโดยวัดผลตามตัวชี้วัด", correct: true }
      - { id: b, text: "เพิ่มขั้นตอนการอนุมัติให้ทุกเรื่องผ่านผู้บริหารสูงสุด", feedback: "การรวมอำนาจและเพิ่มขั้นตอนตรงข้ามกับ NPM ที่ให้ผู้บริหารมีอิสระแลกกับความรับผิดชอบต่อผลงาน" }
      - { id: c, text: "ใช้ความอาวุโสเป็นเกณฑ์หลักในการเลื่อนตำแหน่ง", feedback: "NPM เน้นผลงาน ไม่ใช่ความอาวุโส" }
      - { id: d, text: "ให้หน่วยงานรัฐผูกขาดการให้บริการทุกประเภท", feedback: "NPM สนับสนุนการแข่งขันและการจ้างเอกชน ไม่ใช่การผูกขาด" }
    hints:
      - "NPM นำวิธีของธุรกิจมาใช้"
      - "คำสำคัญคือ ผลงาน ตัวชี้วัด การแข่งขัน การจ้างเอกชน"
    solution: "สัญญาผลงาน ตัวชี้วัด และการจ้างเอกชนเป็นเครื่องมือหลักของ NPM ซึ่งเน้นผลลัพธ์มากกว่าการทำตามขั้นตอน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-administration.p005
    topics: [management.public.public-administration]
    difficulty: 2
    type: match
    stem: "จับคู่การกระทำของหน่วยงานรัฐกับหลักธรรมาภิบาลที่ตรงที่สุด"
    pairs:
      - { left: "ประกาศผลการจัดซื้อจัดจ้างพร้อมราคาบนเว็บไซต์", right: "ความโปร่งใส" }
      - { left: "จัดเวทีรับฟังความเห็นชาวบ้านก่อนสร้างถนน", right: "การมีส่วนร่วม" }
      - { left: "ออกคำสั่งตามที่กฎหมายให้อำนาจ และใช้กับทุกคนเท่าเทียมกัน", right: "นิติธรรม" }
      - { left: "ผู้บริหารชี้แจงต่อสภาเมื่อโครงการไม่บรรลุเป้า", right: "ความรับผิดชอบ" }
      - { left: "เลือกวิธีที่ได้ผลเท่ากันแต่ใช้งบน้อยกว่า", right: "ความคุ้มค่า" }
      - { left: "เจ้าหน้าที่ปฏิเสธของขวัญมูลค่าสูงจากผู้รับเหมา", right: "คุณธรรม" }
    hints:
      - "ความโปร่งใสเน้นการเปิดเผยข้อมูล การมีส่วนร่วมเน้นการรับฟังประชาชน"
      - "ความรับผิดชอบคือพร้อมให้ตรวจสอบและชี้แจงผลการกระทำ"
    solution: "เปิดเผยข้อมูลคือความโปร่งใส เวทีรับฟังคือการมีส่วนร่วม ทำตามกฎหมายอย่างเท่าเทียมคือนิติธรรม ชี้แจงต่อสภาคือความรับผิดชอบ ใช้งบน้อยลงได้ผลเท่ากันคือความคุ้มค่า และปฏิเสธของขวัญคือคุณธรรม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-administration.p006
    topics: [management.public.public-administration]
    difficulty: 2
    type: numeric
    stem: "ศูนย์บริการประชาชนของอำเภอแห่งหนึ่ง (สมมติ) แจกแบบสอบถาม 450 ชุด ได้คืน 380 ชุด ในจำนวนนี้ตอบว่าพอใจหรือพอใจมาก 342 ชุด ร้อยละความพึงพอใจ (คิดจากผู้ตอบ) เป็นเท่าใด"
    answer: { value: 90, unit: "%" }
    hints:
      - "ตัวหารคือแบบสอบถามที่ได้คืน"
      - "342 ÷ 380 × 100"
    misconceptions:
      - { match: 76, feedback: "หารด้วยแบบสอบถามที่แจกทั้งหมด 450 ชุด ร้อยละความพึงพอใจคิดจากผู้ที่ตอบกลับ" }
      - { match: 84.44, feedback: "นั่นคืออัตราการตอบกลับ (380 ÷ 450) ไม่ใช่ร้อยละความพึงพอใจ" }
    solution: "$342 \\div 380 \\times 100 = 90\\%$ และควรรายงานอัตราการตอบกลับ $380 \\div 450 \\approx 84.4\\%$ คู่กัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-administration.p007
    topics: [management.public.public-administration]
    difficulty: 2
    type: numeric
    stem: "จากผังขั้นตอนการขออนุญาตก่อสร้างอาคารในภาพ ถ้าไม่มีงานค้างเลย ผู้ยื่นคำขอต้องรอทั้งหมดกี่วันทำการ"
    figure:
      src: p-permit.svg
      alt: "ผังขั้นตอนห้าขั้น 1 ยื่นคำขอ 1 วันทำการ 2 ตรวจเอกสาร 3 วันทำการ 3 ตรวจพื้นที่ 5 วันทำการ 4 พิจารณาแบบแปลน 7 วันทำการ 5 ลงนามออกใบอนุญาต 2 วันทำการ แต่ละขั้นเริ่มได้เมื่อขั้นก่อนหน้าเสร็จ"
    answer: { value: 18, unit: วันทำการ }
    hints:
      - "ทุกขั้นต่อกันเป็นลำดับ"
      - "รวมเวลาของทั้งห้าขั้น"
    misconceptions:
      - { match: 7, feedback: "นั่นคือเวลาของขั้นที่นานที่สุด เมื่อทำต่อกันเป็นลำดับต้องรวมทุกขั้น" }
      - { match: 3.6, feedback: "นั่นคือเวลาเฉลี่ยต่อขั้น โจทย์ถามเวลารวม" }
    solution: "$1 + 3 + 5 + 7 + 2 = 18$ วันทำการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-administration.p008
    topics: [management.public.public-administration]
    difficulty: 3
    type: numeric
    stem: "จากภาพเดิม เทศบาลตั้งศูนย์บริการเบ็ดเสร็จ ให้ตรวจเอกสาร (ขั้น 2) และตรวจพื้นที่ (ขั้น 3) เริ่มพร้อมกันทันทีหลังยื่นคำขอ เพราะไม่ต้องใช้ผลของกันและกัน ขั้น 4 เริ่มได้เมื่อทั้งสองขั้นเสร็จ เวลารวมใหม่เป็นกี่วันทำการ"
    figure:
      src: p-permit.svg
      alt: "ผังขั้นตอนห้าขั้น 1 ยื่นคำขอ 1 วันทำการ 2 ตรวจเอกสาร 3 วันทำการ 3 ตรวจพื้นที่ 5 วันทำการ 4 พิจารณาแบบแปลน 7 วันทำการ 5 ลงนามออกใบอนุญาต 2 วันทำการ"
    answer: { value: 15, unit: วันทำการ }
    hints:
      - "สองขั้นที่ทำพร้อมกันจะเสร็จเมื่อขั้นที่นานกว่าเสร็จ"
      - "เวลารวม = 1 + max(3, 5) + 7 + 2"
    misconceptions:
      - { match: 13, feedback: "ใช้เวลาของขั้นที่สั้นกว่า (3 วัน) ขั้น 4 ต้องรอให้ทั้งสองขั้นเสร็จ จึงต้องใช้ขั้นที่นานกว่า" }
      - { match: 18, feedback: "นั่นคือเวลาเดิม เมื่อทำสองขั้นพร้อมกันไม่ต้องรวมเวลาทั้งสองขั้น" }
    solution: "$1 + \\max(3, 5) + 7 + 2 = 1 + 5 + 7 + 2 = 15$ วันทำการ ยังตรวจครบทุกขั้นเหมือนเดิม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-administration.p009
    topics: [management.public.public-administration]
    difficulty: 4
    type: numeric
    stem: "จากข้อก่อน เวลารวมลดจาก 18 เป็น 15 วันทำการ เวลารอของประชาชนลดลงร้อยละเท่าใดของเวลาเดิม (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 16.7, unit: "%", tolerance: 0.1 }
    hints:
      - "ร้อยละที่ลดลง = (เดิม − ใหม่) ÷ เดิม × 100"
      - "ตัวหารคือเวลาเดิม 18 วัน"
    misconceptions:
      - { match: 20, feedback: "หารด้วยเวลาใหม่ 15 วัน การคิดร้อยละที่ลดลงต้องเทียบกับค่าเดิม" }
      - { match: 3, feedback: "นั่นคือจำนวนวันที่ลดลง โจทย์ถามเป็นร้อยละ" }
    solution: "$(18 - 15) \\div 18 \\times 100 \\approx 16.7\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-administration.p010
    topics: [management.public.public-administration]
    difficulty: 3
    type: numeric
    stem: "เทศบาลแห่งหนึ่ง (สมมติ) เก็บขยะเองปีละ 6,000 ตัน ใช้งบ 4.2 ล้านบาท เอกชนเสนอรับจ้าง 3.9 ล้านบาทต่อปี และเทศบาลต้องใช้งบตรวจงานและควบคุมสัญญาอีก 0.15 ล้านบาทต่อปี ต้นทุนต่อตันของทางเลือกจ้างเอกชนเป็นกี่บาท"
    answer: { value: 675, unit: บาทต่อตัน }
    hints:
      - "ต้นทุนรวมของการจ้าง = ค่าจ้าง + ค่าควบคุมสัญญา"
      - "หารด้วย 6,000 ตัน"
    misconceptions:
      - { match: 650, feedback: "ลืมค่าตรวจงานและควบคุมสัญญาที่เทศบาลยังต้องจ่าย" }
      - { match: 700, feedback: "นั่นคือต้นทุนต่อตันเมื่อเทศบาลทำเอง" }
    solution: "$(3{,}900{,}000 + 150{,}000) \\div 6{,}000 = 675$ บาทต่อตัน ถูกกว่าทำเอง (700 บาทต่อตัน) 25 บาทต่อตัน แต่ต้องเทียบคุณภาพบริการด้วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-administration.p011
    topics: [management.public.public-administration]
    difficulty: 3
    type: mcq
    stem: "กระทรวงแห่งหนึ่งส่งเจ้าหน้าที่ของกระทรวงไปประจำสำนักงานในจังหวัด และมอบอำนาจให้อนุมัติเรื่องที่มีวงเงินไม่เกินที่กำหนด โดยเจ้าหน้าที่ยังขึ้นกับกระทรวง นี่คือหลักการใด"
    choices:
      - { id: a, text: "หลักการแบ่งอำนาจ", correct: true }
      - { id: b, text: "หลักการกระจายอำนาจ", feedback: "การกระจายอำนาจให้องค์กรที่ประชาชนในพื้นที่เลือกตั้งตัดสินใจเอง แต่ในข้อนี้เจ้าหน้าที่ยังเป็นของกระทรวง" }
      - { id: c, text: "หลักการรวมอำนาจโดยสมบูรณ์", feedback: "มีการมอบอำนาจอนุมัติบางส่วนให้เจ้าหน้าที่ในพื้นที่แล้ว จึงไม่ใช่การรวมอำนาจทั้งหมด" }
      - { id: d, text: "การจ้างเอกชน", feedback: "ผู้ปฏิบัติงานเป็นเจ้าหน้าที่รัฐ ไม่ใช่เอกชน" }
    hints:
      - "ใครเป็นเจ้าของอำนาจและเจ้าหน้าที่"
      - "ส่งคนของส่วนกลางไปพื้นที่พร้อมมอบอำนาจบางส่วน"
    solution: "การส่งเจ้าหน้าที่ของส่วนกลางไปประจำพื้นที่และมอบอำนาจบางส่วนคือการแบ่งอำนาจ ซึ่งเป็นหลักของราชการส่วนภูมิภาค"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-administration.p012
    topics: [management.public.public-administration]
    difficulty: 4
    type: mcq
    stem: "หัวหน้าเจ้าหน้าที่พัสดุของโรงพยาบาลรัฐ (สมมติ) เป็นกรรมการตรวจรับเวชภัณฑ์ และพบว่าบริษัทที่ส่งของเป็นของภรรยาตน การกระทำใดถูกต้องที่สุด"
    choices:
      - { id: a, text: "แจ้งความสัมพันธ์เป็นลายลักษณ์อักษร และขอถอนตัวจากการเป็นกรรมการตรวจรับรายการนี้", correct: true }
      - { id: b, text: "ตรวจรับตามปกติ เพราะตนตรวจอย่างเข้มงวดเท่ากับบริษัทอื่น", feedback: "แม้จะตรวจเข้มงวดจริง แต่ผลประโยชน์ทับซ้อนทำให้คนอื่นสงสัยความเป็นกลางได้ ต้องเปิดเผยและถอนตัว" }
      - { id: c, text: "ไม่บอกใคร แต่ให้กรรมการคนอื่นเซ็นแทน", feedback: "การไม่เปิดเผยขัดกับความโปร่งใส ต้องแจ้งอย่างเป็นทางการ" }
      - { id: d, text: "ยกเลิกการสั่งซื้อจากบริษัทนี้ทั้งหมดทันที", feedback: "การสั่งซื้อทำตามกระบวนการแล้ว ปัญหาอยู่ที่ผู้ตรวจรับ ไม่ใช่ตัวบริษัท" }
    hints:
      - "นี่คือผลประโยชน์ทับซ้อน"
      - "หลักคือเปิดเผยและไม่เข้าร่วมตัดสินใจในเรื่องนั้น"
    solution: "ผลประโยชน์ทับซ้อนต้องเปิดเผยเป็นลายลักษณ์อักษรและถอนตัวจากการพิจารณา ให้กรรมการที่ไม่มีส่วนได้เสียทำหน้าที่แทน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-administration.p013
    topics: [management.public.public-administration]
    difficulty: 4
    type: numeric
    stem: "หน่วยงานแห่งหนึ่ง (สมมติ) ประเมินตนเองสามด้าน น้ำหนักและคะแนนดังนี้ การเปิดเผยข้อมูล 30% ได้ 88 คะแนน การรับรู้ของบุคลากรภายใน 30% ได้ 76 คะแนน การรับรู้ของผู้รับบริการ 40% ได้ 92 คะแนน คะแนนรวมแบบถ่วงน้ำหนักเป็นเท่าใด"
    answer: { value: 86, unit: คะแนน }
    hints:
      - "คูณคะแนนแต่ละด้านด้วยน้ำหนักแล้วรวมกัน"
      - "0.3 × 88 + 0.3 × 76 + 0.4 × 92"
    misconceptions:
      - { match: 85.33, feedback: "นั่นคือค่าเฉลี่ยธรรมดา แต่ละด้านมีน้ำหนักไม่เท่ากัน" }
      - { match: 256, feedback: "นั่นคือผลรวมคะแนนโดยไม่ถ่วงน้ำหนัก" }
    solution: "$0.3(88) + 0.3(76) + 0.4(92) = 26.4 + 22.8 + 36.8 = 86$ คะแนน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-administration.p014
    topics: [management.public.public-administration]
    difficulty: 4
    type: mcq
    stem: "ชาวบ้านมาขอรับเบี้ยยังชีพ แต่สำเนาบัตรประชาชนไม่ได้ลงชื่อรับรอง เจ้าหน้าที่ปฏิเสธและให้กลับไปทำมาใหม่ ทั้งที่ผู้ขอยืนอยู่ตรงหน้าพร้อมบัตรตัวจริง และระเบียบให้เจ้าหน้าที่รับรองสำเนาให้ได้ ปรากฏการณ์นี้ตรงกับแนวคิดใด"
    choices:
      - { id: a, text: "การเบี่ยงเบนเป้าหมาย คือยึดขั้นตอนเป็นเป้าหมายจนลืมจุดประสงค์ของบริการ", correct: true }
      - { id: b, text: "ระบบคุณธรรม", feedback: "ระบบคุณธรรมเกี่ยวกับการคัดเลือกคนตามความสามารถ ไม่เกี่ยวกับกรณีนี้" }
      - { id: c, text: "การกระจายอำนาจ", feedback: "การกระจายอำนาจเป็นหลักการจัดโครงสร้าง ไม่ได้อธิบายพฤติกรรมของเจ้าหน้าที่ในกรณีนี้" }
      - { id: d, text: "ความโปร่งใส", feedback: "ปัญหาไม่ได้อยู่ที่การเปิดเผยข้อมูล แต่อยู่ที่การยึดขั้นตอนเกินจำเป็น" }
    hints:
      - "จุดประสงค์ของการรับรองสำเนาคือยืนยันตัวตน"
      - "ตัวตนยืนยันได้แล้ว แต่เจ้าหน้าที่ยังยึดขั้นตอน"
    solution: "จุดประสงค์ของการรับรองสำเนาคือยืนยันตัวตนซึ่งทำได้แล้ว การปฏิเสธจึงเป็นการเบี่ยงเบนเป้าหมาย ซึ่งเป็นข้อเสียของระบบราชการที่เข้มงวดเกินไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-administration.p015
    topics: [management.public.public-administration]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "เทศบาลแห่งหนึ่ง (สมมติ) ประเมินความเสี่ยงการทุจริตแล้วพบว่างานจัดซื้อวัสดุก่อสร้างเสี่ยงสูงสุด มาตรการใดช่วยป้องกันการทุจริตได้จริง (เลือกได้หลายข้อ)"
    choices:
      - { id: a, text: "แยกคนกำหนดคุณลักษณะ คนจัดซื้อ และคนตรวจรับไม่ให้เป็นคนเดียวกัน", correct: true }
      - { id: b, text: "เผยแพร่แผนจัดซื้อ ราคากลาง และผลการพิจารณาต่อสาธารณะ", correct: true }
      - { id: c, text: "มีช่องทางแจ้งเบาะแสที่ปกปิดชื่อผู้แจ้งและคุ้มครองผู้แจ้ง", correct: true }
      - { id: d, text: "ให้ผู้รับเหมารายเดิมทำงานต่อเนื่องเพื่อความคุ้นเคย โดยไม่ต้องเปิดให้รายอื่นแข่ง", feedback: "การไม่เปิดให้แข่งขันลดความโปร่งใสและเพิ่มโอกาสสมยอมราคา" }
      - { id: e, text: "กำหนดคุณลักษณะวัสดุให้ตรงกับยี่ห้อที่ผู้บริหารคุ้นเคย", feedback: "การล็อกสเปกเป็นรูปแบบการทุจริตที่พบบ่อย ทำให้มีผู้เสนอราคาได้น้อยราย" }
    hints:
      - "แบ่งหน้าที่ เปิดเผยข้อมูล และให้คนภายนอกตรวจสอบได้"
      - "มาตรการใดลดการแข่งขัน มาตรการนั้นเพิ่มความเสี่ยง"
    solution: "การแบ่งแยกหน้าที่ (a) การเปิดเผยข้อมูล (b) และช่องทางแจ้งเบาะแส (c) ลดโอกาสและเพิ่มโอกาสถูกตรวจพบ ส่วนการไม่เปิดแข่งขัน (d) และการล็อกสเปก (e) เพิ่มความเสี่ยงการทุจริต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-administration.p016
    topics: [management.public.public-administration]
    difficulty: 5
    type: numeric
    stem: "สำนักงานทะเบียนแห่งหนึ่ง (สมมติ) ปีก่อนให้บริการ 4,500 เรื่อง ใช้งบดำเนินการ 1.35 ล้านบาท ปีนี้เปิดบริการออนไลน์ ให้บริการ 6,000 เรื่อง ใช้งบ 1.62 ล้านบาท ต้นทุนต่อเรื่องเปลี่ยนไปร้อยละเท่าใด (ลดลงให้ตอบเป็นค่าลบ)"
    answer: { value: -10, unit: "%" }
    hints:
      - "หาต้นทุนต่อเรื่องของแต่ละปีก่อน"
      - "ร้อยละที่เปลี่ยน = (ใหม่ − เดิม) ÷ เดิม × 100"
    misconceptions:
      - { match: 20, feedback: "นั่นคือร้อยละที่งบรวมเพิ่มขึ้น ความคุ้มค่าต้องดูต้นทุนต่อหน่วยบริการ" }
      - { match: 10, feedback: "ทิศทางผิด ต้นทุนต่อเรื่องลดลง ต้องตอบเป็นค่าลบ" }
    solution: "ปีก่อน $1{,}350{,}000 \\div 4{,}500 = 300$ บาทต่อเรื่อง ปีนี้ $1{,}620{,}000 \\div 6{,}000 = 270$ บาทต่อเรื่อง เปลี่ยนไป $(270 - 300) \\div 300 \\times 100 = -10\\%$ แม้งบรวมเพิ่มขึ้น 20% แต่ให้บริการได้มากขึ้นจนต้นทุนต่อเรื่องลดลง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-administration.p017
    topics: [management.public.public-administration]
    difficulty: 5
    type: mcq
    stem: "หมู่บ้านบนดอยแห่งหนึ่งอยู่ห่างไกล ระบบประปาเสียบ่อย องค์การบริหารส่วนตำบลมีช่างเพียงคนเดียวและต้องใช้เวลาเดินทางครึ่งวัน เอกชนไม่สนใจรับจ้างเพราะไม่คุ้มทุน รูปแบบการจัดบริการใดน่าจะเหมาะที่สุด"
    choices:
      - { id: a, text: "ร่วมผลิตบริการกับชุมชน อบรมคนในหมู่บ้านให้ดูแลเบื้องต้น ตั้งกองทุนค่าน้ำ และให้ช่างของ อบต. ดูแลงานใหญ่", correct: true }
      - { id: b, text: "จ้างเอกชนรายใหญ่จากตัวเมืองทำสัญญาระยะยาว", feedback: "เอกชนไม่สนใจเพราะไม่คุ้มทุน ถ้าจ่ายแพงจนเอกชนรับ ต้นทุนต่อครัวเรือนจะสูงมาก" }
      - { id: c, text: "ยุบระบบประปาและให้ชาวบ้านหาน้ำเอง", feedback: "ขัดกับความเป็นธรรมในการเข้าถึงบริการสาธารณะพื้นฐาน" }
      - { id: d, text: "ให้ส่วนกลางส่งช่างจากกรุงเทพฯ มาซ่อมทุกครั้ง", feedback: "ช้าและแพงกว่าทุกทางเลือก ไม่ตอบสนองความต้องการเร่งด่วน" }
    hints:
      - "ดูทั้งต้นทุน ความรวดเร็ว และความเป็นธรรม"
      - "ใครอยู่ใกล้ปัญหาที่สุดและมีแรงจูงใจให้น้ำไหล"
    solution: "การร่วมผลิตบริการกับชุมชนใช้ความรู้และแรงงานในพื้นที่ แก้ปัญหาเล็กได้เร็ว ต้นทุนต่ำ และ อบต. ยังรับผิดชอบงานใหญ่และมาตรฐานน้ำ จึงตอบทั้งประสิทธิภาพ ประสิทธิผล และความเป็นธรรม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-administration.p018
    topics: [management.public.public-administration]
    difficulty: 2
    type: order
    stem: "เรียงแนวคิดการบริหารภาครัฐตามช่วงเวลาที่เกิดขึ้นจากก่อนไปหลัง"
    items:
      - "ระบบราชการตามแนวคิดของเวเบอร์ (ต้นศตวรรษที่ 20)"
      - "การบริหารภาครัฐแนวใหม่ (NPM) เน้นผลงานแบบธุรกิจ"
      - "การบริการสาธารณะแนวใหม่และการอภิบาลแบบเครือข่าย"
    hints:
      - "NPM เกิดขึ้นเพื่อแก้ความล่าช้าของระบบราชการ"
      - "แนวคิดล่าสุดเกิดจากข้อวิจารณ์ว่าประชาชนเป็นมากกว่าลูกค้า"
    solution: "ระบบราชการของเวเบอร์มาก่อน NPM เกิดช่วงทศวรรษ 1980 เพื่อแก้ความล่าช้า และการบริการสาธารณะแนวใหม่กับการอภิบาลแบบเครือข่ายตามมาเพื่อแก้ข้อจำกัดของการมองประชาชนเป็นลูกค้า"
    license: CC-BY-SA-4.0
    ai_assisted: true
