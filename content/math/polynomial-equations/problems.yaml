  - id: math.algebra.polynomial-equations.p017
    topics: [math.algebra.polynomial-equations]
    difficulty: 5
    type: expression
    stem: "พหุนาม $P(x)$ หารด้วย $x - 1$ เหลือเศษ 3 และหารด้วย $x + 2$ เหลือเศษ $-6$ จงหาเศษเมื่อหาร $P(x)$ ด้วย $(x - 1)(x + 2)$"
    prefix: "เศษ ="
    answer: { latex: "3x", variables: [x] }
    hints:
      - "ตัวหารดีกรีสอง เศษจึงอยู่ในรูป $ax + b$: $P(x) = (x - 1)(x + 2)Q(x) + ax + b$"
      - "แทน $x = 1$ และ $x = -2$ ได้ $a + b = 3$ และ $-2a + b = -6$"
    misconceptions:
      - { match: "-9x+12", feedback: "ใช้ $P(2) = -6$ แต่ตัวหาร $x + 2$ ให้ $P(-2) = -6$" }
      - { match: "-3", feedback: "เศษจากตัวหารดีกรีสองเป็นพหุนามดีกรีไม่เกินหนึ่ง $ax + b$ ไม่ใช่การนำเศษสองตัวมาคูณหรือบวกกัน" }
    solution: "$P(1) = a + b = 3$ และ $P(-2) = -2a + b = -6$ ลบกันได้ $3a = 9$, $a = 3$, $b = 0$ เศษคือ $3x$"
