    hints:
      - "$V = \\displaystyle\\int_0^1\\!\\!\\int_0^{1 - x}\\!\\!\\int_0^{1 - x - y} dz\\,dy\\,dx$"
      - "ชั้นในได้ $1 - x - y$ ชั้นกลางได้ $\\tfrac{(1 - x)^2}{2}$"
    misconceptions:
      - { match: 0.5, feedback: "นี่คือปริมาตรของปริซึมที่มีฐานสามเหลี่ยมพื้นที่ $\\tfrac12$ สูง 1 แต่ทรงสี่หน้าบางลงเมื่อขึ้นสูง" }
      - { match: 1, feedback: "ใช้ขอบเขตคงที่ 0 ถึง 1 ทั้งสามตัวแปรได้ลูกบาศก์ ขอบบนของ $y$ และ $z$ ต้องขึ้นกับตัวแปรชั้นนอก" }
    solution: "$\\int_0^{1 - x - y}dz = 1 - x - y$, $\\int_0^{1 - x}(1 - x - y)\\,dy = \\tfrac{(1 - x)^2}{2}$, $\\int_0^1 \\tfrac{(1 - x)^2}{2}\\,dx = \\tfrac16 \\approx 0.167$ ตรงกับสูตร $\\tfrac13 \\times$ พื้นที่ฐาน $\\times$ สูง $= \\tfrac13 \\cdot \\tfrac12 \\cdot 1$"
