id: physics.magnetism.magnets
subject: physics
title: { th: แม่เหล็กและขั้วแม่เหล็ก, en: Magnets and magnetic poles }
summary: วัตถุที่ถูกแม่เหล็กดูดและไม่ถูกดูด ขั้วเหนือขั้วใต้ ขั้วเหมือนกันผลัก ขั้วต่างกันดูด การพยากรณ์ผล และการใช้แม่เหล็กแก้ปัญหา
difficulty: 1.5
minutes: 25
prerequisites: [physics.dynamics.forces-intro]
encompasses:
  - { id: physics.dynamics.forces-intro, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: แรงแม่เหล็กแรงที่สุดที่ขั้ว
    src: clips.svg
    alt: "แม่เหล็กแท่ง ครึ่งซ้ายสีแดงเขียน N ครึ่งขวาสีน้ำเงินเขียน S คลิปหนีบกระดาษจำนวนมากเกาะเป็นกระจุกที่ปลายซ้ายและปลายขวา ตรงกลางแท่งมีคลิปเพียงตัวเดียว ป้ายด้านล่างเขียนว่า ขั้วเหนือ: คลิปเกาะมาก ตรงกลาง: แทบไม่มี ขั้วใต้: คลิปเกาะมาก"
    caption: "คลิปเกาะที่ปลายทั้งสองข้างซึ่งเป็นขั้วแม่เหล็ก ทั้งขั้วเหนือและขั้วใต้ดูดเหล็กได้"
  - type: figure
    title: ขั้วต่างกันดูด ขั้วเหมือนกันผลัก
    src: poles.svg
    alt: "แม่เหล็กแท่งสามคู่ ขั้ว N สีแดง ขั้ว S สีน้ำเงิน คู่ที่ 1 แท่งซ้ายเรียง S N แท่งขวาเรียง S N ขั้วเหนือของแท่งซ้ายหันหาขั้วใต้ของแท่งขวา ลูกศรชี้เข้าหากัน เขียนว่าดูดกัน คู่ที่ 2 แท่งซ้าย S N แท่งขวา N S ขั้วเหนือหันหาขั้วเหนือ ลูกศรชี้ออกจากกัน เขียนว่าผลักกัน คู่ที่ 3 แท่งซ้าย N S แท่งขวา S N ขั้วใต้หันหาขั้วใต้ ลูกศรชี้ออกจากกัน เขียนว่าผลักกัน"
    caption: "ดูเฉพาะขั้วที่หันเข้าหากัน ขั้วต่างกันดูด ขั้วเหมือนกันผลัก"
  - type: worked-example
    title: หาขั้วของแม่เหล็กที่ป้ายหลุด
    problem: "แม่เหล็กแท่งหนึ่งป้ายบอกขั้วหลุดหาย ใช้แม่เหล็กอีกแท่งที่รู้ขั้วแล้วหาว่าปลายไหนเป็นขั้วเหนือ"
    steps:
      - text: "นำขั้วเหนือของแม่เหล็กที่รู้ขั้วเข้าใกล้ปลายที่ 1 ปรากฏว่าดูดกัน"
        why: "การดูดยังบอกไม่ได้แน่ เพราะถ้าเป็นเหล็กธรรมดาก็ถูกดูดได้เหมือนกัน"
      - text: "นำขั้วเหนือเข้าใกล้ปลายที่ 2 ปรากฏว่าผลักกัน"
      - text: "ผลักกันได้เฉพาะขั้วที่เหมือนกัน ปลายที่ 2 จึงเป็นขั้วเหนือ"
        why: "การผลักเกิดระหว่างแม่เหล็กสองแท่งเท่านั้น จึงบอกได้แน่ทั้งว่าเป็นแม่เหล็กและเป็นขั้วอะไร"
      - text: "แม่เหล็กมีสองขั้วเสมอ ปลายที่ 1 จึงเป็นขั้วใต้ ซึ่งตรงกับที่ดูดกับขั้วเหนือ"
    answer: "ปลายที่ 2 เป็นขั้วเหนือ ปลายที่ 1 เป็นขั้วใต้"
  - { type: check, problem: physics.magnetism.magnets.p008, prompt: "ลองใช้การผลักบอกขั้วด้วยตัวเอง" }
  - type: worked-example
    title: พยากรณ์แม่เหล็กสามแท่ง
    problem: "วางแม่เหล็กสามแท่งเรียงกัน แท่ง A เรียงขั้วจากซ้ายไปขวาเป็น N S แท่ง B เรียงเป็น N S และแท่ง C เรียงเป็น S N ถ้าดันให้ทั้งสามแท่งเข้าใกล้กัน คู่ใดดูดกัน คู่ใดผลักกัน"
    steps:
      - text: "ดูคู่ A กับ B: ปลายขวาของ A คือ S หันหาปลายซ้ายของ B คือ N"
      - text: "S กับ N เป็นขั้วต่างกัน A กับ B จึงดูดกัน"
      - text: "ดูคู่ B กับ C: ปลายขวาของ B คือ S หันหาปลายซ้ายของ C คือ S"
        why: "ดูเฉพาะขั้วที่หันเข้าหากัน ขั้วที่อยู่ปลายอีกด้านอยู่ไกลกว่า มีผลน้อยกว่า"
      - text: "S กับ S เป็นขั้วเหมือนกัน B กับ C จึงผลักกัน"
    answer: "A กับ B ดูดกัน ส่วน B กับ C ผลักกัน"
  - { type: check, problem: physics.magnetism.magnets.p011, prompt: "ระยะห่างมีผลต่อแรงแม่เหล็กอย่างไร" }
  - type: simulation
    title: แม่เหล็กและเข็มทิศ (PhET Magnets and Electromagnets)
    url: https://phet.colorado.edu/en/simulations/magnets-and-electromagnets
    provider: phet
    note: "เลือกหน้า Bar Magnet ลากเข็มทิศไปรอบแม่เหล็กแท่ง สังเกตว่าปลายสีแดง (ขั้วเหนือ) ของเข็มทิศหันไปทางไหนเมื่ออยู่ใกล้ขั้ว N และขั้ว S ลองกดกลับขั้วแม่เหล็กแล้วดูว่าเข็มทิศเปลี่ยนอย่างไร"
glossary:
  - { term: แม่เหล็ก, definition: "วัตถุที่ดูดเหล็กได้และมีสองขั้ว คือขั้วเหนือและขั้วใต้" }
  - { term: สารแม่เหล็ก, definition: "วัสดุที่ถูกแม่เหล็กดูด เช่น เหล็ก นิกเกิล โคบอลต์" }
  - { term: ขั้วแม่เหล็ก, definition: "บริเวณที่แรงแม่เหล็กมากที่สุด แม่เหล็กแท่งมีขั้วอยู่ที่ปลายทั้งสองข้าง" }
  - { term: ขั้วเหนือ, definition: "ปลายของแม่เหล็กที่หันไปทางทิศเหนือเมื่อแขวนให้หมุนได้อิสระ ใช้อักษร N" }
  - { term: ขั้วใต้, definition: "ปลายของแม่เหล็กที่หันไปทางทิศใต้เมื่อแขวนให้หมุนได้อิสระ ใช้อักษร S" }
  - { term: เข็มทิศ, definition: "เครื่องมือบอกทิศ ภายในมีเข็มแม่เหล็กเล็ก ๆ ที่หมุนได้ ขั้วเหนือของเข็มชี้ไปทางทิศเหนือ" }
flashcards:
  - { front: "แม่เหล็กดูดวัสดุอะไร", back: "เหล็ก นิกเกิล และโคบอลต์ แต่ไม่ดูดอะลูมิเนียม ทองแดง ไม้ พลาสติก แก้ว" }
  - { front: "ขั้วเหมือนกันหรือต่างกันที่ผลักกัน", back: "ขั้วเหมือนกันผลักกัน (N กับ N, S กับ S) ขั้วต่างกันดูดกัน (N กับ S)" }
  - { front: "หักแม่เหล็กแท่งเป็นสองท่อน ได้อะไร", back: "แม่เหล็กสองแท่ง แต่ละแท่งมีทั้งขั้วเหนือและขั้วใต้" }
  - { front: "ทำไมต้องใช้การผลักบอกว่าเป็นแม่เหล็ก", back: "เพราะเหล็กธรรมดาก็ถูกดูดได้ แต่การผลักเกิดเฉพาะระหว่างแม่เหล็กสองแท่ง" }
