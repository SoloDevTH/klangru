<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="sans-serif" font-size="14">
  <title>ตารางเปรียบเทียบความคุ้มครองของ Institute Cargo Clauses A B และ C ICC A คุ้มครองการลักขโมยและการสูญหาย ICC B ไม่คุ้มครองการลักขโมย ICC C คุ้มครองเฉพาะภัยสำคัญขั้นต่ำ</title>
  <rect x="0" y="0" width="800" height="320" fill="#ffffff"/>
  <rect x="40" y="76" width="280" height="34" fill="#e5e7eb" stroke="#1f2937"/>
  <text x="180.0" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">ภัยที่เกิดกับสินค้า</text>
  <rect x="320" y="76" width="130" height="34" fill="#e5e7eb" stroke="#1f2937"/>
  <text x="385.0" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">ICC (A)</text>
  <rect x="450" y="76" width="130" height="34" fill="#e5e7eb" stroke="#1f2937"/>
  <text x="515.0" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">ICC (B)</text>
  <rect x="580" y="76" width="130" height="34" fill="#e5e7eb" stroke="#1f2937"/>
  <text x="645.0" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">ICC (C)</text>
  <rect x="40" y="110" width="280" height="58" fill="#ffffff" stroke="#1f2937"/>
  <text x="52" y="144.0" font-size="13" fill="#1f2937">ไฟไหม้ เรือล่ม เรือชน</text>
  <rect x="320" y="110" width="130" height="58" fill="#dcfce7" stroke="#1f2937"/>
  <text x="385.0" y="144.0" text-anchor="middle" font-size="14" fill="#1f2937">มี</text>
  <rect x="450" y="110" width="130" height="58" fill="#dcfce7" stroke="#1f2937"/>
  <text x="515.0" y="144.0" text-anchor="middle" font-size="14" fill="#1f2937">มี</text>
  <rect x="580" y="110" width="130" height="58" fill="#dcfce7" stroke="#1f2937"/>
  <text x="645.0" y="144.0" text-anchor="middle" font-size="14" fill="#1f2937">มี</text>
  <rect x="40" y="168" width="280" height="58" fill="#ffffff" stroke="#1f2937"/>
  <text x="52" y="202.0" font-size="13" fill="#1f2937">น้ำทะเลเข้า คลื่นพัดสินค้าตกเรือ แผ่นดินไหว</text>
  <rect x="320" y="168" width="130" height="58" fill="#dcfce7" stroke="#1f2937"/>
  <text x="385.0" y="202.0" text-anchor="middle" font-size="14" fill="#1f2937">มี</text>
  <rect x="450" y="168" width="130" height="58" fill="#dcfce7" stroke="#1f2937"/>
  <text x="515.0" y="202.0" text-anchor="middle" font-size="14" fill="#1f2937">มี</text>
  <rect x="580" y="168" width="130" height="58" fill="#fee2e2" stroke="#1f2937"/>
  <text x="645.0" y="202.0" text-anchor="middle" font-size="14" fill="#1f2937">ไม่มี</text>
  <rect x="40" y="226" width="280" height="58" fill="#ffffff" stroke="#1f2937"/>
  <text x="52" y="260.0" font-size="13" fill="#1f2937">ลักขโมย สูญหายระหว่างทาง</text>
  <rect x="320" y="226" width="130" height="58" fill="#dcfce7" stroke="#1f2937"/>
  <text x="385.0" y="260.0" text-anchor="middle" font-size="14" fill="#1f2937">มี</text>
  <rect x="450" y="226" width="130" height="58" fill="#fee2e2" stroke="#1f2937"/>
  <text x="515.0" y="260.0" text-anchor="middle" font-size="14" fill="#1f2937">ไม่มี</text>
  <rect x="580" y="226" width="130" height="58" fill="#fee2e2" stroke="#1f2937"/>
  <text x="645.0" y="260.0" text-anchor="middle" font-size="14" fill="#1f2937">ไม่มี</text>
  <text x="40" y="310" font-size="12" fill="#1f2937">ตารางย่อเพื่อการเรียนรู้ ไม่ใช่ข้อความกรมธรรม์ฉบับเต็ม ดูข้อยกเว้นในฉบับจริงเสมอ</text>
</svg>
