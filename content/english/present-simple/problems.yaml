problems:
  - id: eng.pres.p001
    topics: [english.grammar.present-simple]
    difficulty: 1
    type: text
    stem: "เติมกริยาในรูปที่ถูกต้อง: *She ___ (walk) to school every day.*"
    accepted: ["walks"]
    misconceptions:
      - { match: "walk", feedback: "ประธาน she เป็นเอกพจน์บุรุษที่ 3 กริยาในประโยคบอกเล่าต้องเติม s" }
      - { match: "walking", feedback: "present simple ไม่ใช้รูป -ing ใช้กริยาช่องที่ 1 และเติม s เมื่อประธานเป็น she" }
    hints:
      - "ประธานของประโยคคือ she"
      - "ประธาน he, she, it ในประโยคบอกเล่า กริยาต้องเติม s หรือ es"
    solution: "she เป็นเอกพจน์บุรุษที่ 3 และ walk เป็นกริยาทั่วไป จึงเติม s: *She **walks** to school every day.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.pres.p002
    topics: [english.grammar.present-simple]
    difficulty: 1
    type: mcq
    stem: "เลือกคำที่เติมแล้วถูกต้อง: *I ___ rice every day.*"
    choices:
      - { id: a, text: "eat", correct: true, feedback: "ถูก ประธาน I ใช้กริยารูปเดิม" }
      - { id: b, text: "eats", feedback: "เติม s เฉพาะประธาน he, she, it ส่วน I ใช้รูปเดิม" }
      - { id: c, text: "am eat", feedback: "present simple ไม่ต้องมี am นำหน้ากริยาอื่น ภาษาไทยพูดว่า \"ฉันกิน\" ได้เลย ภาษาอังกฤษก็เช่นกัน" }
      - { id: d, text: "eating", feedback: "รูป -ing ใช้กับ am/is/are ใน present continuous ไม่ใช่ present simple" }
    hints:
      - "ประธานคือ I"
      - "ประธาน I, you, we, they ใช้กริยาช่องที่ 1 โดยไม่เติมอะไร"
    solution: "ประธาน I ใช้กริยารูปเดิม: *I **eat** rice every day.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.pres.p003
    topics: [english.grammar.present-simple]
    difficulty: 2
    type: match
    stem: "จับคู่กริยากับรูปที่ใช้กับประธาน he / she / it"
    pairs:
      - { left: "watch", right: "watches" }
      - { left: "study", right: "studies" }
      - { left: "play", right: "plays" }
      - { left: "go", right: "goes" }
      - { left: "have", right: "has" }
    hints:
      - "ดูตัวอักษรท้ายคำ: ch และ o เติม es"
      - "พยัญชนะ + y เปลี่ยน y เป็น ies ส่วนสระ + y เติม s เฉย ๆ และ have เปลี่ยนรูปพิเศษ"
    solution: "watch → watches (ลงท้าย ch) · study → studies (d + y) · play → plays (a + y) · go → goes (ลงท้าย o) · have → has (คำพิเศษ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.pres.p004
    topics: [english.grammar.present-simple]
    difficulty: 2
    type: text
    stem: "เติมกริยาในรูปที่ถูกต้อง: *My father ___ (fix) cars at his garage.*"
    accepted: ["fixes"]
    misconceptions:
      - { match: "fixs", feedback: "กริยาที่ลงท้ายด้วย x ต้องเติม es ไม่ใช่ s" }
      - { match: "fix", feedback: "my father เท่ากับ he ต้องเติม es ที่กริยา" }
    hints:
      - "my father เป็นคนคนเดียว ใช้แทนด้วย he"
      - "fix ลงท้ายด้วย x ดูตารางการเติม s หรือ es"
    solution: "ประธานเป็นบุรุษที่ 3 เอกพจน์ และ fix ลงท้ายด้วย x จึงเติม es: *My father **fixes** cars at his garage.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.pres.p005
    topics: [english.grammar.present-simple]
    difficulty: 2
    type: mcq
    stem: "เลือกคำที่ถูกต้อง: *He ___ like durian.* (เขาไม่ชอบทุเรียน)"
    choices:
      - { id: a, text: "doesn't", correct: true, feedback: "ถูก ประธาน he ใช้ does not หรือ doesn't" }
      - { id: b, text: "don't", feedback: "don't ใช้กับ I, you, we, they ส่วน he ต้องใช้ doesn't" }
      - { id: c, text: "isn't", feedback: "isn't ใช้กับ verb to be แต่ประโยคนี้มีกริยาหลักคือ like จึงต้องใช้ doesn't" }
      - { id: d, text: "not", feedback: "ภาษาอังกฤษวาง not หน้ากริยาเฉย ๆ ไม่ได้ ต้องมีกริยาช่วย does" }
    hints:
      - "ประโยคปฏิเสธของ present simple ใช้ don't หรือ doesn't"
      - "เลือกตามประธาน: he, she, it ใช้ตัวที่มาจาก does"
    solution: "ประธาน he ใช้ doesn't (does not) แล้วตามด้วยกริยารูปเดิม: *He **doesn't** like durian.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.pres.p006
    topics: [english.grammar.present-simple]
    difficulty: 3
    type: text
    stem: "เติมคำให้เป็นประโยคปฏิเสธ: *Tom ___ (not / play) football on Mondays.* (ตอบเฉพาะคำในช่องว่าง)"
    accepted: ["doesn't play", "doesn’t play", "does not play"]
    misconceptions:
      - { match: "doesn't plays", feedback: "เมื่อมี does แล้ว กริยาหลักต้องเป็นรูปเดิม ไม่เติม s ซ้ำ" }
      - { match: "doesn’t plays", feedback: "เมื่อมี does แล้ว กริยาหลักต้องเป็นรูปเดิม ไม่เติม s ซ้ำ" }
      - { match: "don't play", feedback: "Tom เป็นเอกพจน์บุรุษที่ 3 (he) ต้องใช้ doesn't" }
      - { match: "don’t play", feedback: "Tom เป็นเอกพจน์บุรุษที่ 3 (he) ต้องใช้ doesn't" }
    hints:
      - "Tom แทนด้วย he ประโยคปฏิเสธใช้ doesn't"
      - "ตัว s ย้ายไปอยู่ที่ does แล้ว กริยา play จึงกลับเป็นรูปเดิม"
    solution: "*Tom **doesn't play** (does not play) football on Mondays.* ใช้ doesn't กับประธานบุรุษที่ 3 เอกพจน์ แล้วตามด้วยกริยารูปเดิม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.pres.p007
    topics: [english.grammar.present-simple]
    difficulty: 3
    type: mcq
    stem: "เลือกคำที่ถูกต้อง: *___ your sister live in Chiang Mai?*"
    choices:
      - { id: a, text: "Does", correct: true, feedback: "ถูก your sister เป็นเอกพจน์บุรุษที่ 3 ใช้ Does" }
      - { id: b, text: "Do", feedback: "Do ใช้กับ I, you, we, they แต่ประธานคือ your sister ไม่ใช่ you" }
      - { id: c, text: "Is", feedback: "Is ใช้กับ verb to be แต่ประโยคมีกริยาหลักคือ live จึงใช้ Does" }
      - { id: d, text: "Are", feedback: "Are ใช้กับ verb to be และประธานพหูพจน์ แต่ประโยคมีกริยาหลัก live" }
    hints:
      - "ประธานของคำถามคือ your sister ไม่ใช่ your"
      - "คำถาม present simple ใช้ Do หรือ Does ขึ้นต้น เลือกตามประธาน"
    solution: "ประธานคือ your sister (= she) จึงใช้ Does: ***Does** your sister live in Chiang Mai?* สังเกตว่า live ไม่เติม s"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.pres.p008
    topics: [english.grammar.present-simple]
    difficulty: 3
    type: order
    stem: "เรียงคำให้เป็นคำถามที่ถูกต้อง (สมชายนั่งรถไฟฟ้าไปทำงานไหม)"
    items: ["Does", "Somchai", "take", "the BTS", "to work?"]
    hints:
      - "คำถาม present simple ขึ้นต้นด้วย Do หรือ Does"
      - "โครงสร้างคือ Does + ประธาน + กริยารูปเดิม + ส่วนที่เหลือ"
    solution: "*Does Somchai take the BTS to work?* (Does + ประธาน Somchai + กริยารูปเดิม take + กรรม the BTS + to work)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.pres.p009
    topics: [english.grammar.present-simple]
    difficulty: 3
    type: text
    stem: "เติมกริยาในรูปที่ถูกต้อง: *The 7-Eleven near my house ___ (open) 24 hours a day.*"
    accepted: ["opens"]
    misconceptions:
      - { match: "open", feedback: "ประธานคือร้าน 7-Eleven หนึ่งร้าน (= it) จึงต้องเติม s" }
    hints:
      - "ประธานคือ the 7-Eleven ไม่ใช่ my house"
      - "ร้านหนึ่งร้านแทนด้วย it ประโยคบอกเล่าต้องเติม s"
    solution: "ประธานคือร้าน 7-Eleven ร้านเดียว เท่ากับ it และนี่เป็นความจริงที่เกิดเป็นประจำ จึงใช้ **opens**: *The 7-Eleven near my house opens 24 hours a day.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.pres.p010
    topics: [english.grammar.present-simple]
    difficulty: 4
    type: mcq
    stem: "ประโยค *My mother don't drink coffee, but she drinks tea every morning.* มีส่วนใดผิด"
    choices:
      - { id: a, text: "don't ควรเป็น doesn't", correct: true, feedback: "ถูก my mother เท่ากับ she ต้องใช้ doesn't" }
      - { id: b, text: "drinks ควรเป็น drink", feedback: "drinks ถูกแล้ว เพราะประธานคือ she และเป็นประโยคบอกเล่า" }
      - { id: c, text: "every morning ควรเป็น every mornings", feedback: "every ตามด้วยคำนามเอกพจน์เสมอ every morning จึงถูกแล้ว" }
      - { id: d, text: "ไม่มีส่วนใดผิด", feedback: "ลองดูประธาน my mother กับคำปฏิเสธที่ใช้อีกครั้ง" }
    hints:
      - "ตรวจประธานของแต่ละส่วนของประโยค"
      - "my mother แทนด้วย she แล้วดูว่าประโยคปฏิเสธใช้ don't หรือ doesn't"
    solution: "my mother = she ต้องใช้ doesn't: *My mother **doesn't** drink coffee, but she drinks tea every morning.* ส่วนหลังใช้ drinks ถูกแล้วเพราะเป็นประโยคบอกเล่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.pres.p011
    topics: [english.grammar.present-simple]
    difficulty: 4
    type: text
    stem: "ตอบสั้นแบบบอกรับ: *Does Mali speak Chinese?* — *Yes, ___.*"
    accepted: ["she does", "she does."]
    misconceptions:
      - { match: "she do", feedback: "she ใช้ does ไม่ใช่ do" }
      - { match: "she speaks", feedback: "ความหมายถูก แต่คำตอบสั้นใช้กริยาช่วยตัวเดียวกับคำถาม คือ she does" }
      - { match: "she is", feedback: "คำถามขึ้นต้นด้วย Does จึงตอบด้วย does ไม่ใช่ is" }
    hints:
      - "คำตอบสั้นใช้สรรพนามแทนชื่อ แล้วตามด้วยกริยาช่วยตัวเดียวกับคำถาม"
      - "Mali เป็นผู้หญิง แทนด้วย she และคำถามใช้ Does"
    solution: "Mali แทนด้วย she และคำถามใช้ Does จึงตอบว่า *Yes, **she does**.* (ปฏิเสธคือ *No, she doesn't.*)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.pres.p012
    topics: [english.grammar.present-simple]
    difficulty: 5
    type: mcq
    stem: "ประโยคใดวางคำบอกความถี่ถูกตำแหน่ง"
    choices:
      - { id: a, text: "She is always late for class.", correct: true, feedback: "ถูก คำบอกความถี่วางหลัง verb to be" }
      - { id: b, text: "She always is late for class.", feedback: "เมื่อกริยาเป็น verb to be ให้วาง always ไว้หลัง is" }
      - { id: c, text: "She always late for class.", feedback: "ขาด verb to be ภาษาอังกฤษต้องมี is ก่อนคำคุณศัพท์ late" }
      - { id: d, text: "She is late always for class.", feedback: "always ไม่วางหลังคำคุณศัพท์ ให้วางหลัง is ทันที" }
    hints:
      - "ประโยคนี้มีกริยาหลักเป็น verb to be (is) ไม่ใช่กริยาแสดงการกระทำ"
      - "คำบอกความถี่วางหน้ากริยาหลัก แต่วางหลัง am, is, are"
    solution: "กริยาของประโยคคือ is จึงวาง always หลัง is: *She is **always** late for class.* (ถ้าเป็นกริยาอื่น เช่น walk จะวางหน้ากริยา: *She always walks.*)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.pres.p013
    topics: [english.grammar.present-simple]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "เลือกประโยคที่ถูกต้องทั้งหมด"
    choices:
      - { id: a, text: "Water boils at 100 °C.", correct: true }
      - { id: b, text: "The train to Hat Yai leaves at 8:30 tomorrow.", correct: true }
      - { id: c, text: "Does he works here?", feedback: "มี Does แล้ว กริยาหลักต้องเป็นรูปเดิม: Does he work here?" }
      - { id: d, text: "She studys English every evening.", feedback: "study ลงท้ายด้วยพยัญชนะ + y ต้องเป็น studies" }
      - { id: e, text: "They doesn't eat pork.", feedback: "they ใช้ don't: They don't eat pork." }
      - { id: f, text: "My brother watches TV every night.", correct: true }
    hints:
      - "ตรวจสามเรื่องในแต่ละประโยค: ประธาน การเติม s/es และ do/does"
      - "present simple ใช้กับตารางเวลาในอนาคตได้ เช่น เวลารถไฟออก"
    solution: "ถูก: Water boils at 100 °C. (ความจริง) · The train to Hat Yai leaves at 8:30 tomorrow. (ตารางเวลา) · My brother watches TV every night. (กิจวัตร) ผิด: Does he works → Does he work · studys → studies · They doesn't → They don't"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.pres.p014
    topics: [english.grammar.present-simple]
    difficulty: 2
    type: mcq
    stem: "เส้นเวลาใดตรงกับประโยค *I jog every morning.*"
    figure: { src: tense-timelines-quiz.svg, alt: "เส้นเวลา 3 เส้น จากอดีตทางซ้ายไปอนาคตทางขวา มีขีดแดงบอกตอนนี้: A มีเครื่องหมายกากบาทเว้นระยะเท่ากันตลอดเส้น ทั้งก่อนและหลังตอนนี้ B มีกากบาทจุดเดียวในอดีต C มีแถบทึบเริ่มจากจุดหนึ่งในอดีตยาวต่อเนื่องมาถึงตอนนี้" }
    choices:
      - { id: a, text: "A", correct: true, feedback: "ถูก every morning คือทำซ้ำเป็นประจำ เกิดหลายครั้งทั้งก่อนหน้าและต่อจากนี้" }
      - { id: b, text: "B", feedback: "B คือเหตุการณ์ครั้งเดียวที่จบไปแล้วในอดีต ซึ่งใช้ past simple เช่น I jogged yesterday." }
      - { id: c, text: "C", feedback: "C คือสิ่งที่เริ่มในอดีตและต่อเนื่องมาถึงตอนนี้ ซึ่งมักใช้ present perfect เช่น I have lived here since 2020." }
    hints:
      - "every morning บอกว่าเกิดครั้งเดียวหรือหลายครั้ง"
      - "present simple ใช้กับกิจวัตรที่ทำซ้ำ"
    solution: "*I jog every morning.* เป็นกิจวัตรที่ทำซ้ำทุกเช้า จึงตรงกับเส้นเวลา A ที่มีเหตุการณ์ซ้ำ ๆ ตลอดเส้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.pres.p015
    topics: [english.grammar.present-simple]
    difficulty: 1
    type: text
    stem: "เติม verb to be ให้ถูกต้อง: *Pim and Joe ___ my classmates.*"
    accepted: ["are"]
    misconceptions:
      - { match: "is", feedback: "Pim and Joe มีสองคน เท่ากับ they จึงใช้ are" }
      - { match: "am", feedback: "am ใช้กับ I เท่านั้น" }
    hints:
      - "ประธานมีกี่คน แทนด้วยสรรพนามอะไร"
      - "I → am · he/she/it → is · you/we/they → are"
    solution: "Pim and Joe = they จึงใช้ **are**: *Pim and Joe are my classmates.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.pres.p016
    topics: [english.grammar.present-simple]
    difficulty: 2
    type: text
    stem: "เติมคำในช่องว่าง: *What time ___ the school bus arrive?* (รถโรงเรียนมาถึงกี่โมง)"
    accepted: ["does"]
    misconceptions:
      - { match: "do", feedback: "the school bus เป็นสิ่งเดียว เท่ากับ it จึงใช้ does" }
      - { match: "is", feedback: "ประโยคนี้มีกริยาหลัก arrive อยู่แล้ว คำถามของกริยาทั่วไปใช้ do หรือ does ไม่ใช่ is" }
    hints:
      - "คำถามแบบ wh- เรียงเป็น คำแสดงคำถาม + do/does + ประธาน + กริยารูปเดิม"
      - "the school bus แทนด้วยสรรพนามใด"
    solution: "*What time **does** the school bus arrive?* ประธานเป็นเอกพจน์ (it) จึงใช้ does และกริยา arrive อยู่ในรูปเดิม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.pres.p017
    topics: [english.grammar.present-simple]
    difficulty: 2
    type: mcq
    stem: "ตัว -es ในคำว่า *watches* ออกเสียงอย่างไร"
    choices:
      - { id: a, text: "/ɪz/ (อิซ) เป็นพยางค์เพิ่ม", correct: true, feedback: "ถูก กริยาที่ลงท้ายด้วยเสียง ช ซ ส ฉ (เช่น ch, sh, s, x) เติมแล้วได้พยางค์ใหม่ /ɪz/ watch-es" }
      - { id: b, text: "/s/ (ส)", feedback: "/s/ ใช้หลังเสียงไม่ก้อง เช่น walks, eats ถ้าออกเสียง /s/ หลัง ch จะได้เสียงที่ฟังไม่ชัด จึงต้องเพิ่มพยางค์" }
      - { id: c, text: "/z/ (ซ) ไม่เพิ่มพยางค์", feedback: "/z/ ใช้หลังเสียงก้องและสระ เช่น plays, goes แต่หลังเสียง ch ต้องเพิ่มพยางค์" }
      - { id: d, text: "ไม่ออกเสียง", feedback: "ตัว -s และ -es ต้องออกเสียงเสมอ ผู้ฟังใช้เสียงนี้รู้ว่าประธานเป็นเอกพจน์" }
    hints:
      - "ลองนับพยางค์ของ watch กับ watches"
      - "หลังเสียงคล้าย ช ซ ส ต้องเติมสระเข้าไปจึงจะออกเสียง s ได้"
    solution: "เสียง -s/-es มี 3 แบบ: /s/ หลังเสียงไม่ก้อง (walks) · /z/ หลังเสียงก้องและสระ (plays) · /ɪz/ หลังเสียง s, z, sh, ch, x (watches, washes, fixes) คำว่า watches จึงอ่าน **/ɪz/** เป็นสองพยางค์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.pres.p018
    topics: [english.grammar.present-simple]
    difficulty: 3
    type: mcq
    stem: "อ่านข้อความแล้วตอบคำถาม\n\n*Ploy is a student in Khon Kaen. She gets up at six every day. She usually goes to school by songthaew, but on Fridays her father drives her. She doesn't eat breakfast at home. She buys sticky rice and grilled pork near the school.*\n\nHow does Ploy go to school on Fridays?"
    choices:
      - { id: a, text: "Her father drives her.", correct: true, feedback: "ถูก ประโยค but on Fridays her father drives her. บอกข้อยกเว้นของวันศุกร์" }
      - { id: b, text: "She goes by songthaew.", feedback: "usually goes by songthaew คือวันปกติ แต่คำว่า but on Fridays บอกว่าวันศุกร์ไม่เหมือนวันอื่น" }
      - { id: c, text: "She walks to school.", feedback: "ข้อความไม่ได้บอกว่าพลอยเดินไปโรงเรียน" }
      - { id: d, text: "She buys sticky rice.", feedback: "ข้อนี้บอกว่าซื้ออาหารเช้าอะไร ไม่ได้ตอบว่าไปโรงเรียนอย่างไร" }
    hints:
      - "หาประโยคที่มีคำว่า Fridays"
      - "but ใช้บอกสิ่งที่ต่างจากประโยคก่อนหน้า"
    solution: "ข้อความบอกว่าพลอยมักนั่งสองแถว **แต่** วันศุกร์พ่อขับรถไปส่ง คำตอบคือ *Her father drives her.* (drives เติม s เพราะประธาน her father = he)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.pres.p019
    topics: [english.grammar.present-simple]
    difficulty: 3
    type: text
    stem: "เติมคำเชื่อมหนึ่งคำให้ได้ความว่า นกไม่ดื่มกาแฟ **เพราะ** กาแฟทำให้ใจสั่น: *Nok doesn't drink coffee ___ it makes her heart beat fast.*"
    accepted: ["because"]
    misconceptions:
      - { match: "but", feedback: "but ใช้เชื่อมความที่ขัดแย้งกัน แต่ประโยคนี้บอกเหตุผล" }
      - { match: "and", feedback: "and เชื่อมความที่ไปด้วยกัน ไม่ได้บอกเหตุผล" }
      - { match: "so", feedback: "so บอกผลลัพธ์ ถ้าใช้ so ต้องสลับลำดับความ: Coffee makes her heart beat fast, so she doesn't drink it." }
    hints:
      - "ข้อความหลังช่องว่างเป็นเหตุผลของข้อความแรก"
      - "คำเชื่อมพื้นฐาน and, but, because, so มีความหมายต่างกัน"
    solution: "*Nok doesn't drink coffee **because** it makes her heart beat fast.* because นำเหตุผล (สังเกตว่า makes เติม s เพราะประธาน it)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.pres.p020
    topics: [english.grammar.present-simple]
    difficulty: 4
    type: mcq
    stem: "ประโยคใดใช้ present simple เพื่อบอก **ตารางเวลาที่กำหนดไว้**"
    choices:
      - { id: a, text: "The last BTS train leaves Mo Chit at midnight.", correct: true, feedback: "ถูก เวลาออกของรถไฟฟ้าเป็นตารางที่กำหนดไว้แล้ว" }
      - { id: b, text: "My grandmother waters her plants every evening.", feedback: "ประโยคนี้บอกกิจวัตร (every evening) ไม่ใช่ตารางเวลา" }
      - { id: c, text: "The sun rises in the east.", feedback: "ประโยคนี้บอกความจริงทั่วไปทางธรรมชาติ" }
      - { id: d, text: "Durian smells very strong.", feedback: "ประโยคนี้บอกลักษณะที่เป็นจริงทั่วไป ไม่ใช่ตารางเวลา" }
    hints:
      - "present simple ใช้ได้ 3 แบบ: กิจวัตร ความจริงทั่วไป และตารางเวลา"
      - "ตารางเวลามักเป็นของขนส่ง โรงเรียน หรืองานที่มีกำหนดแน่นอน"
    solution: "รถไฟฟ้าขบวนสุดท้ายออกตามตารางที่กำหนดไว้ จึงเป็นการใช้ present simple บอก **ตารางเวลา** ส่วนข้ออื่นเป็นกิจวัตรและความจริงทั่วไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.pres.p021
    topics: [english.grammar.present-simple]
    difficulty: 4
    type: text
    stem: "ตั้งคำถามที่คำตอบคือ *She studies English on Tuesdays.* โดยถามว่าเรียน **เมื่อไร**: *When ___ she ___ English?* (พิมพ์สองคำคั่นด้วยเว้นวรรค)"
    accepted: ["does study", "does, study", "does / study"]
    misconceptions:
      - { match: "does studies", feedback: "มี does แล้ว กริยาหลักต้องเป็นรูปเดิม study" }
      - { match: "do study", feedback: "she เป็นบุรุษที่ 3 เอกพจน์ ใช้ does" }
      - { match: "is study", feedback: "study เป็นกริยาทั่วไป ใช้ does ในคำถาม ไม่ใช่ is" }
    hints:
      - "คำถาม wh-: When + does/do + ประธาน + กริยารูปเดิม"
      - "studies ในคำตอบมี s เพราะประธานเป็น she ตอนเปลี่ยนเป็นคำถาม s ย้ายไปที่ does"
    solution: "*When **does** she **study** English?* — *She studies English on Tuesdays.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.pres.p022
    topics: [english.grammar.present-simple]
    difficulty: 5
    type: text
    stem: "เปลี่ยนประโยคเป็นเรื่องของ **เพื่อนผู้หญิง** (she): *I wash my uniform and I don't watch TV.* → *She ___ her uniform and she ___ TV.* (พิมพ์คำในช่องว่างทั้งสองช่องตามลำดับ คั่นด้วยเครื่องหมายจุลภาค)"
    accepted: ["washes, doesn't watch", "washes, doesn’t watch", "washes, does not watch", "washes doesn't watch", "washes does not watch"]
    misconceptions:
      - { match: "washs, doesn't watch", feedback: "wash ลงท้ายด้วย sh ต้องเติม es เป็น washes" }
      - { match: "washes, doesn't watches", feedback: "หลัง doesn't กริยาต้องเป็นรูปเดิม watch" }
      - { match: "washes, don't watch", feedback: "she ต้องใช้ doesn't ไม่ใช่ don't" }
      - { match: "wash, doesn't watch", feedback: "ประโยคบอกเล่ากับ she ต้องเติม es ที่ wash" }
    hints:
      - "ช่องแรกเป็นประโยคบอกเล่า ช่องที่สองเป็นประโยคปฏิเสธ"
      - "ตรวจการเติม es กับคำที่ลงท้ายด้วย sh และจำว่าหลัง doesn't ใช้กริยารูปเดิม"
    solution: "*She **washes** her uniform and she **doesn't watch** TV.* บอกเล่าเติม es (sh + es) ส่วนปฏิเสธใช้ doesn't + กริยารูปเดิม"
    license: CC-BY-SA-4.0
    ai_assisted: true
