      - { left: "เนื้อหัวมันเทศที่สะสมแป้ง", right: "พาเรงคิมา" }
    hints:
      - "เซลล์ที่ผนังหนามากและแข็งเป็นสเกลอเรงคิมา แบ่งเป็นแบบยาวและแบบสั้น"
      - "ส่วนที่ยังอ่อนแต่ต้องการการค้ำจุนใช้เซลล์ที่ผนังหนาเฉพาะมุม"
    solution: "ความสากของฝรั่งมาจากสเกลอรีด เส้นในก้านขึ้นฉ่ายคือคอลเลงคิมา ใยมะพร้าวคือเส้นใยสเกลอเรงคิมา และแป้งในหัวมันเทศเก็บในพาเรงคิมา"
