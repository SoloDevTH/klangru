  difficulty: 5
  type: numeric
  stem: ADC 12 บิตรับช่วง 0 ถึง $10\ \mathrm{V}$ ค่าความคลาดเคลื่อนจากการปัดเศษ (quantization) มีค่าสูงสุด $\pm\mathrm{LSB}/2$ และค่ารากกำลังสองเฉลี่ย (RMS) คือ $\mathrm{LSB}/\sqrt{12}$ จงหาค่า RMS ของความคลาดเคลื่อนนี้เป็นกี่มิลลิโวลต์ (ตอบทศนิยม 3 ตำแหน่ง)
  answer:
    value: 0.705
    tolerance: 0.01
    unit: mV
  misconceptions:
  - match: 2.441
    feedback: ใช้ LSB ทั้งขั้นเป็นค่า RMS
  - match: 1.221
    feedback: ใช้ LSB/2 ซึ่งเป็นค่าสูงสุด ไม่ใช่ค่า RMS
  hints:
  - คำนวณ LSB ของ ADC 12 บิตช่วง 10 V ก่อน
  - ค่า RMS คือ LSB หารด้วยรากของ 12
  - ค่า RMS ไม่ใช่ค่าสูงสุด
  solution: LSB $= 2.4414\ \mathrm{mV}$ จึงได้ RMS $= 2.4414 \div \sqrt{12} \approx 0.705\ \mathrm{mV}$
