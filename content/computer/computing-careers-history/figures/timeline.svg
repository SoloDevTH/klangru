<text x="198.0" y="130" text-anchor="middle" fill="#6b7280" font-size="12">1890</text>
<line x1="256.0" y1="108" x2="256.0" y2="116" stroke="#374151" stroke-width="1.5"/>
<text x="256.0" y="130" text-anchor="middle" fill="#6b7280" font-size="12">1910</text>
<line x1="314.0" y1="108" x2="314.0" y2="116" stroke="#374151" stroke-width="1.5"/>
<text x="314.0" y="130" text-anchor="middle" fill="#6b7280" font-size="12">1930</text>
<line x1="372.0" y1="108" x2="372.0" y2="116" stroke="#374151" stroke-width="1.5"/>
<text x="372.0" y="130" text-anchor="middle" fill="#6b7280" font-size="12">1950</text>
<line x1="430.0" y1="108" x2="430.0" y2="116" stroke="#374151" stroke-width="1.5"/>
<text x="430.0" y="130" text-anchor="middle" fill="#6b7280" font-size="12">1970</text>
