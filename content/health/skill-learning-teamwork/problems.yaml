problems:
  - id: health.movement.skill-learning-teamwork.p001
    topics: [health.movement.skill-learning-teamwork]
    difficulty: 1
    type: mcq
    stem: "ผู้เริ่มหัดเลี้ยงลูกบาสเกตบอลต้องก้มดูลูกตลอด คิดทุกจังหวะ และลูกหลุดมือบ่อย อยู่ในขั้นใดของการเรียนรู้ทักษะ"
    choices:
      - { id: a, text: "ขั้นทำความเข้าใจ", correct: true }
      - { id: b, text: "ขั้นฝึกฝน", feedback: "ขั้นฝึกฝนทำได้คล่องขึ้นและผิดน้อยลงแล้ว ผู้ที่ต้องคิดทุกจังหวะและผิดบ่อยยังอยู่ขั้นแรก" }
      - { id: c, text: "ขั้นอัตโนมัติ", feedback: "ขั้นอัตโนมัติเลี้ยงลูกได้โดยไม่ต้องมองลูก" }
    hints:
      - "ต้องคิดทุกจังหวะและผิดบ่อยเป็นลักษณะของผู้เริ่มต้น"
      - "เป็นขั้นที่ 1"
    solution: "ขั้นทำความเข้าใจ ผู้เรียนรู้ว่าต้องทำอะไร แต่ยังต้องคิดทุกจังหวะและผิดบ่อย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.skill-learning-teamwork.p002
    topics: [health.movement.skill-learning-teamwork]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นพฤติกรรมของสมาชิกทีมที่ดี"
    choices:
      - { id: a, text: "เรียกชื่อเพื่อนและให้กำลังใจเมื่อเพื่อนพลาด", correct: true }
      - { id: b, text: "ต่อว่าเพื่อนเมื่อทีมเสียคะแนน", feedback: "การต่อว่าทำให้ทีมเสียกำลังใจ และไม่ได้แก้ปัญหา" }
      - { id: c, text: "ไม่ส่งบอลให้ใครเพราะอยากทำคะแนนเอง", feedback: "การเล่นคนเดียวทำให้ทีมเสียโอกาส ควรส่งให้เพื่อนที่อยู่ในตำแหน่งดีกว่า" }
    hints:
      - "ทีมเข้มแข็งเมื่อสมาชิกสื่อสารและช่วยกัน"
      - "ข้อที่ถูกช่วยให้ทั้งทีมดีขึ้น"
    solution: "สื่อสารและให้กำลังใจกันเป็นพฤติกรรมที่ช่วยเพิ่มศักยภาพของทีม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.skill-learning-teamwork.p003
    topics: [health.movement.skill-learning-teamwork]
    difficulty: 1
    type: text
    stem: "รายการพฤติกรรมที่ใช้ติ๊กว่าผู้เล่นทำได้หรือยังไม่ได้ทีละข้อ เพื่อประเมินการเล่น เรียกว่าแบบอะไร (ตอบชื่อเครื่องมือ)"
    accepted: ["แบบสังเกต", "แบบสังเกตพฤติกรรม", "แบบสังเกตการเล่น", "checklist", "แบบตรวจสอบรายการ"]
    misconceptions:
      - { match: "ข้อสอบ", feedback: "ข้อสอบวัดความรู้ แต่การเล่นจริงประเมินด้วยแบบสังเกต" }
    hints:
      - "ผู้ประเมินใช้ตาดูการเล่นแล้วติ๊ก"
      - "ชื่อขึ้นต้นด้วย แบบสัง..."
    solution: "แบบสังเกต (checklist) ใช้ประเมินตนเองและผู้อื่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.skill-learning-teamwork.p004
    topics: [health.movement.skill-learning-teamwork]
    difficulty: 2
    type: numeric
    stem: "จากกราฟบันทึกพัฒนาการของน้ำ สัปดาห์ที่ 5 น้ำเล่นลูกสองมือบนสำเร็จคิดเป็นร้อยละเท่าไรของ 20 ครั้ง (ตอบเป็นร้อยละ)"
    figure:
      src: progress-log.svg
      alt: "กราฟเส้นบันทึกพัฒนาการของน้ำ จำนวนครั้งที่เล่นลูกสองมือบนข้ามตาข่ายสำเร็จจาก 20 ครั้ง สัปดาห์ 1 ได้ 6 สัปดาห์ 2 ได้ 8 สัปดาห์ 3 ได้ 11 สัปดาห์ 4 ได้ 12 สัปดาห์ 5 ได้ 15 มีเส้นประเป้าหมายที่ 15 ครั้ง"
    answer: { value: 75, unit: "%" }
    misconceptions:
      - { match: 15, feedback: "15 คือจำนวนครั้ง ต้องหารด้วย 20 แล้วคูณ 100" }
      - { match: 25, feedback: "25 คือร้อยละของครั้งที่ไม่สำเร็จ (5 จาก 20)" }
    hints:
      - "อ่านค่าสัปดาห์ที่ 5 จากกราฟ"
      - "ร้อยละ = สำเร็จ ÷ ทั้งหมด × 100"
    solution: "15 ÷ 20 × 100 = 75 คือร้อยละ 75"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.skill-learning-teamwork.p005
    topics: [health.movement.skill-learning-teamwork]
    difficulty: 2
    type: order
    stem: "เรียงขั้นของการเรียนรู้ทักษะกลไก จากเริ่มต้นไปจนชำนาญ"
    items:
      - "ขั้นทำความเข้าใจ"
      - "ขั้นฝึกฝน"
      - "ขั้นอัตโนมัติ"
    hints:
      - "เริ่มจากรู้ว่าต้องทำอะไร"
      - "สุดท้ายทำได้โดยไม่ต้องคิด"
    solution: "ขั้นทำความเข้าใจ → ขั้นฝึกฝน → ขั้นอัตโนมัติ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.skill-learning-teamwork.p006
    topics: [health.movement.skill-learning-teamwork]
    difficulty: 2
    type: match
    stem: "จับคู่ลักษณะของผู้เล่นกับขั้นของการเรียนรู้ทักษะ"
    pairs:
      - { left: "ฟังครูอธิบายและดูตัวอย่าง ยังเตะลูกไม่เข้าเป้า", right: "ขั้นทำความเข้าใจ" }
      - { left: "เตะเข้าเป้าบ่อยขึ้น รู้ตัวว่าเตะพลาดเพราะวางเท้าผิด", right: "ขั้นฝึกฝน" }
      - { left: "เตะส่งแม่นโดยไม่ต้องคิด ขณะมองหาเพื่อนที่ว่าง", right: "ขั้นอัตโนมัติ" }
    hints:
      - "ดูว่าผู้เล่นต้องใช้ความคิดกับท่ามากน้อยเพียงใด"
      - "ขั้นฝึกฝนเริ่มรู้สึกเองว่าทำถูกหรือผิด"
    solution: "ฟังและดูตัวอย่าง-ทำความเข้าใจ, รู้ตัวว่าผิดเพราะอะไร-ฝึกฝน, ไม่ต้องคิดและมองเกมได้-อัตโนมัติ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.skill-learning-teamwork.p007
    topics: [health.movement.skill-learning-teamwork]
    difficulty: 2
    type: mcq
    stem: "เป้าหมายการฝึกข้อใดดีที่สุด"
    choices:
      - { id: a, text: "\"ภายใน 4 สัปดาห์ จะเสิร์ฟลูกแบดมินตันลงแดนให้ได้ 8 จาก 10 ครั้ง\"", correct: true }
      - { id: b, text: "\"จะเล่นแบดมินตันให้เก่งเหมือนนักกีฬาทีมชาติ\"", feedback: "ไม่เจาะจงว่าทักษะใด วัดไม่ได้ และไม่มีกำหนดเวลา" }
      - { id: c, text: "\"จะฝึกเสิร์ฟเยอะ ๆ\"", feedback: "วัดไม่ได้ว่าเยอะแค่ไหนและสำเร็จเมื่อไร" }
    hints:
      - "เป้าหมายที่ดีเจาะจง วัดได้ และมีกำหนดเวลา"
      - "ข้อใดบอกตัวเลขและเวลาไว้ชัดเจน"
    solution: "ข้อ a เจาะจง (เสิร์ฟ) วัดได้ (8 จาก 10) ทำได้จริง และมีกำหนดเวลา (4 สัปดาห์)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.skill-learning-teamwork.p008
    topics: [health.movement.skill-learning-teamwork]
    difficulty: 3
    type: mcq
    stem: "ในการแข่งเซปักตะกร้อ ฟ้าเป็นตัวฟาดที่เก่งที่สุด แต่ลูกที่เพื่อนตั้งมาไม่ดี ฟ้ามักบ่นใส่เพื่อนกลางสนาม ข้อใดเป็นการใช้ความสามารถของตนเพื่อเพิ่มศักยภาพของทีมได้ดีที่สุด"
    choices:
      - { id: a, text: "ปรับการเคลื่อนที่ไปหาลูกที่ตั้งมาให้ดีที่สุด ให้กำลังใจเพื่อน และช่วงพักช่วยฝึกการตั้งลูกกับเพื่อน", correct: true }
      - { id: b, text: "ขอให้ครูเปลี่ยนเพื่อนออกจากทีม", feedback: "การตัดเพื่อนออกไม่ได้ช่วยให้ทีมเรียนรู้ร่วมกัน และไม่คำนึงถึงความรู้สึกของผู้อื่น" }
      - { id: c, text: "ไปเล่นตั้งลูกเอง แล้วให้คนอื่นฟาดแทน", feedback: "การทิ้งตำแหน่งที่ตนถนัดทำให้ทีมเสียจุดแข็ง และไม่ได้แก้ปัญหาร่วมกัน" }
    hints:
      - "ใช้จุดเด่นของตนให้ทีมได้ประโยชน์"
      - "ลดความเป็นตัวตนและคำนึงถึงความรู้สึกของเพื่อน"
    solution: "ฟ้าใช้ความสามารถในการฟาดโดยปรับตัวให้เข้ากับลูกที่ได้ ไม่บ่นเพื่อน และช่วยเพื่อนพัฒนา ทีมทั้งทีมจึงดีขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.skill-learning-teamwork.p009
    topics: [health.movement.skill-learning-teamwork]
    difficulty: 3
    type: numeric
    stem: "จากกราฟบันทึกพัฒนาการของน้ำ ตั้งแต่สัปดาห์ที่ 1 ถึงสัปดาห์ที่ 5 จำนวนครั้งที่สำเร็จเพิ่มขึ้นเฉลี่ยสัปดาห์ละกี่ครั้ง (ตอบเป็นครั้งต่อสัปดาห์)"
    figure:
      src: progress-log.svg
      alt: "กราฟเส้นบันทึกพัฒนาการของน้ำ จำนวนครั้งที่เล่นลูกสองมือบนข้ามตาข่ายสำเร็จจาก 20 ครั้ง สัปดาห์ 1 ได้ 6 สัปดาห์ 2 ได้ 8 สัปดาห์ 3 ได้ 11 สัปดาห์ 4 ได้ 12 สัปดาห์ 5 ได้ 15 มีเส้นประเป้าหมายที่ 15 ครั้ง"
    answer: { value: 2.25, tolerance: 0.02, unit: ครั้ง/สัปดาห์ }
    misconceptions:
      - { match: 1.8, feedback: "หารด้วย 5 ไม่ถูก จากสัปดาห์ 1 ถึง 5 มีช่วงเปลี่ยน 4 ช่วง" }
      - { match: 9, feedback: "9 คือที่เพิ่มขึ้นทั้งหมด ต้องหารด้วยจำนวนช่วงสัปดาห์" }
    hints:
      - "หาที่เพิ่มขึ้นทั้งหมดจากสัปดาห์ 1 ถึง 5"
      - "จากสัปดาห์ 1 ไป 5 มี 4 ช่วง"
    solution: "เพิ่มขึ้น 15 − 6 = 9 ครั้ง ใน 4 ช่วงสัปดาห์ เฉลี่ย 9 ÷ 4 = 2.25 ครั้งต่อสัปดาห์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.skill-learning-teamwork.p010
    topics: [health.movement.skill-learning-teamwork]
    difficulty: 3
    type: numeric
    stem: "แก้มใช้แบบสังเกตการเล่นลูกสองมือบน 4 รายการ สังเกตเพื่อน 3 ครั้ง รวมเป็น 12 ช่อง เพื่อนทำได้ 8 ช่อง คิดเป็นร้อยละเท่าไร (ตอบเป็นร้อยละ ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 66.7, tolerance: 0.1, unit: "%" }
    misconceptions:
      - { match: 200, feedback: "นำ 8 ÷ 4 × 100 ไม่ถูก ทั้งหมดมี 12 ช่อง (4 รายการ × 3 ครั้ง)" }
      - { match: 33.3, feedback: "33.3 คือร้อยละของช่องที่ยังทำไม่ได้ (4 จาก 12)" }
    hints:
      - "จำนวนช่องทั้งหมด = 4 × 3"
      - "ร้อยละ = 8 ÷ 12 × 100"
    solution: "ทั้งหมด 4 × 3 = 12 ช่อง, 8 ÷ 12 × 100 ≈ 66.7 คือร้อยละ 66.7"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.skill-learning-teamwork.p011
    topics: [health.movement.skill-learning-teamwork]
    difficulty: 3
    type: mcq
    stem: "หลังสังเกตเพื่อนเล่นลูกสองมือบน ข้อใดเป็นการให้ข้อมูลย้อนกลับที่ดีที่สุด"
    choices:
      - { id: a, text: "\"เธอเข้าไปอยู่ใต้ลูกได้เร็วดีมาก ครั้งหน้าลองย่อเข่าแล้วเหยียดขาพร้อมแขน ลูกจะลอยสูงขึ้น\"", correct: true }
      - { id: b, text: "\"เล่นแย่มาก ทำไมไม่ตั้งใจ\"", feedback: "ไม่ได้บอกว่าต้องแก้อะไร และทำให้เพื่อนเสียกำลังใจ" }
      - { id: c, text: "\"ดีแล้ว ไม่ต้องแก้อะไร\" ทั้งที่ลูกยังไม่ข้ามตาข่าย", feedback: "ชมอย่างเดียวโดยไม่ตรงความจริง เพื่อนจะไม่รู้ว่าต้องพัฒนาตรงไหน" }
    hints:
      - "ข้อมูลย้อนกลับที่ดีบอกตามสิ่งที่เห็นจริง"
      - "ชมสิ่งที่ทำได้ แล้วบอกสิ่งที่ควรแก้อย่างเจาะจง"
    solution: "ข้อ a ชมสิ่งที่ทำได้จริง และบอกสิ่งที่ควรแก้อย่างเจาะจงพร้อมเหตุผล ตามรายการในแบบสังเกต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.skill-learning-teamwork.p012
    topics: [health.movement.skill-learning-teamwork]
    difficulty: 3
    type: mcq
    stem: "บีมตัวเล็กแต่ว่องไว ส่วนโอมตัวสูงแต่เคลื่อนที่ช้ากว่า ทั้งสองเล่นวอลเลย์บอลในทีมเดียวกัน ข้อใดเป็นการวิเคราะห์และยอมรับความแตกต่างที่เหมาะสม"
    choices:
      - { id: a, text: "บีมเหมาะกับการรับลูกในแดนหลัง โอมเหมาะกับการบล็อกที่หน้าตาข่าย ทั้งคู่ฝึกจุดที่ยังอ่อนเพิ่มเติม", correct: true }
      - { id: b, text: "บีมไม่ควรเล่นวอลเลย์บอลเพราะตัวเล็ก", feedback: "ความแตกต่างของร่างกายไม่ได้ทำให้ใครเล่นไม่ได้ ทุกตำแหน่งต้องการจุดเด่นต่างกัน" }
      - { id: c, text: "โอมต้องฝึกจนเร็วเท่าบีมก่อนจึงลงแข่งได้", feedback: "แต่ละคนพัฒนาได้ แต่ไม่จำเป็นต้องเหมือนกัน ควรใช้จุดเด่นของแต่ละคนให้เกิดประโยชน์" }
    hints:
      - "แต่ละคนมีจุดเด่นต่างกัน"
      - "ตำแหน่งใดได้ประโยชน์จากความว่องไว ตำแหน่งใดจากความสูง"
    solution: "วิเคราะห์จุดเด่นของแต่ละคน เลือกบทบาทให้เหมาะ ยอมรับความแตกต่าง และใช้เป็นแนวทางพัฒนาตนเอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.skill-learning-teamwork.p013
    topics: [health.movement.skill-learning-teamwork]
    difficulty: 4
    type: numeric
    stem: "ในครึ่งแรกของการแข่งฟุตบอลระหว่างห้อง ทีม ม.1/3 ส่งบอล 40 ครั้ง ถึงเพื่อนร่วมทีม 28 ครั้ง อัตราการส่งบอลสำเร็จเป็นร้อยละเท่าไร (ตอบเป็นร้อยละ)"
    answer: { value: 70, unit: "%" }
    misconceptions:
      - { match: 30, feedback: "30 คือร้อยละของการส่งที่พลาด (12 จาก 40)" }
      - { match: 142.86, feedback: "นำ 40 ÷ 28 กลับด้าน ต้องนำครั้งที่สำเร็จหารด้วยครั้งทั้งหมด" }
    hints:
      - "ร้อยละ = สำเร็จ ÷ ทั้งหมด × 100"
      - "นำ 28 หารด้วย 40 แล้วคูณ 100"
    solution: "28 ÷ 40 × 100 = 70 คือร้อยละ 70 ทีมสามารถตั้งเป้าเพิ่มอัตรานี้ในครึ่งหลัง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.skill-learning-teamwork.p014
    topics: [health.movement.skill-learning-teamwork]
    difficulty: 4
    type: mcq
    stem: "ในการแข่งบาสเกตบอล ทีมคู่แข่งมีผู้เล่นตัวสูงคนหนึ่งที่ทำคะแนนใต้แป้นได้เกือบทั้งหมด ส่วนคนอื่นยิงไกลไม่ค่อยลง ทีมของเราควรเลือกกลวิธีป้องกันแบบใด"
    choices:
      - { id: a, text: "ป้องกันพื้นที่ใต้แป้นให้แน่น หรือประกบผู้เล่นตัวสูงเป็นพิเศษ ยอมให้คู่แข่งยิงไกล", correct: true }
      - { id: b, text: "ทุกคนวิ่งออกไปกดดันผู้เล่นที่ยืนไกลแป้น", feedback: "จะเหลือพื้นที่ใต้แป้นให้ผู้เล่นตัวสูงทำคะแนนได้ง่าย" }
      - { id: c, text: "ไม่ต้องป้องกัน ใช้ทุกคนรุกอย่างเดียว", feedback: "คู่แข่งจะทำคะแนนได้ง่าย การเลือกกลวิธีต้องดูทั้งรุกและป้องกัน" }
    hints:
      - "คู่แข่งทำคะแนนจากจุดใดมากที่สุด"
      - "ป้องกันจุดแข็งของคู่แข่ง และยอมเสี่ยงที่จุดอ่อนของเขา"
    solution: "เลือกกลวิธีตามสถานการณ์: ปิดพื้นที่ใต้แป้นหรือประกบผู้เล่นตัวสูง เพราะเป็นจุดแข็งของคู่แข่ง ส่วนการยิงไกลเป็นจุดอ่อนของเขา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.skill-learning-teamwork.p015
    topics: [health.movement.skill-learning-teamwork]
    difficulty: 4
    type: mcq
    stem: "ภูมิฝึกยิงลูกโทษบาสเกตบอลทุกวัน 3 สัปดาห์แล้ว แต่บันทึกผลยังได้ 4 จาก 10 ลูกเท่าเดิมทุกสัปดาห์ ภูมิควรทำอย่างไรต่อ"
    choices:
      - { id: a, text: "ให้ครูหรือเพื่อนดูด้วยแบบสังเกต หรือถ่ายวิดีโอเทียบกับท่าตัวอย่าง แล้วปรับจุดที่ผิดทีละข้อ", correct: true }
      - { id: b, text: "เลิกเล่นบาสเกตบอล เพราะไม่มีพรสวรรค์", feedback: "ผลที่นิ่งเป็นสัญญาณให้เปลี่ยนวิธีฝึก ไม่ได้แปลว่าพัฒนาไม่ได้" }
      - { id: c, text: "ฝึกแบบเดิมให้มากขึ้นเป็นสองเท่า", feedback: "ถ้าท่ายังผิดอยู่ การฝึกซ้ำแบบเดิมจะทำให้ท่าผิดติดเป็นนิสัย" }
    hints:
      - "ฝึกซ้ำโดยไม่รู้ว่าผิดตรงไหน ผลจะไม่ดีขึ้น"
      - "ข้อมูลย้อนกลับได้มาจากที่ใดบ้าง"
    solution: "เมื่อผลนิ่ง ต้องหาข้อมูลย้อนกลับจากครู เพื่อน หรือวิดีโอ แล้วปรับวิธีฝึก จากนั้นบันทึกผลต่อเพื่อดูว่าได้ผลหรือไม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.skill-learning-teamwork.p016
    topics: [health.movement.skill-learning-teamwork]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "ทีมฟุตซอลโรงเรียนชนะติดต่อกันหลายนัด แต่มีผู้เล่นบางคนล้อเลียนคู่แข่งที่แพ้ และโพสต์คลิปเยาะเย้ยลงโซเชียลมีเดีย ข้อใดเป็นแนวปฏิบัติที่คำนึงถึงผลต่อผู้อื่นและสังคม (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ลบคลิปที่เยาะเย้ย และขอโทษคู่แข่ง", correct: true }
      - { id: b, text: "ทีมตกลงกันว่าจะจับมือและขอบคุณคู่แข่งทุกนัดไม่ว่าแพ้หรือชนะ", correct: true }
      - { id: c, text: "กัปตันเตือนเพื่อนร่วมทีม และเป็นแบบอย่างให้รุ่นน้อง", correct: true }
      - { id: d, text: "ปล่อยไว้ เพราะทีมชนะจึงมีสิทธิ์", feedback: "การชนะไม่ได้ให้สิทธิ์ทำร้ายจิตใจผู้อื่น และภาพของทีมและโรงเรียนจะเสียหาย" }
      - { id: e, text: "ยิงประตูเพิ่มให้มากที่สุดเพื่อให้คู่แข่งอาย", feedback: "การเล่นเพื่อทำให้คู่แข่งอับอายขัดกับน้ำใจนักกีฬา" }
    hints:
      - "ผลของการกระทำไปถึงคู่แข่ง ทีม โรงเรียน และผู้ชม"
      - "ข้อที่ถูกมีสามข้อ"
    solution: "ลบคลิปและขอโทษ ตกลงแนวปฏิบัติร่วมกันในทีม และกัปตันเป็นแบบอย่าง เป็นการใช้ความสามารถของทีมโดยคำนึงถึงผลต่อผู้อื่นและสังคม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.skill-learning-teamwork.p017
    topics: [health.movement.skill-learning-teamwork]
    difficulty: 5
    type: numeric
    stem: "จากกราฟบันทึกพัฒนาการของน้ำ ตลอด 5 สัปดาห์ น้ำเล่นลูกสองมือบนสำเร็จเฉลี่ยสัปดาห์ละกี่ครั้ง (ตอบเป็นครั้ง ทศนิยม 1 ตำแหน่ง)"
    figure:
      src: progress-log.svg
      alt: "กราฟเส้นบันทึกพัฒนาการของน้ำ จำนวนครั้งที่เล่นลูกสองมือบนข้ามตาข่ายสำเร็จจาก 20 ครั้ง สัปดาห์ 1 ได้ 6 สัปดาห์ 2 ได้ 8 สัปดาห์ 3 ได้ 11 สัปดาห์ 4 ได้ 12 สัปดาห์ 5 ได้ 15 มีเส้นประเป้าหมายที่ 15 ครั้ง"
    answer: { value: 10.4, tolerance: 0.05, unit: ครั้ง }
    misconceptions:
      - { match: 52, feedback: "52 คือผลรวม ต้องหารด้วย 5 สัปดาห์" }
      - { match: 10.5, feedback: "10.5 คือค่ากึ่งกลางของ 6 กับ 15 ไม่ใช่ค่าเฉลี่ยของทั้ง 5 สัปดาห์" }
    hints:
      - "อ่านค่าทั้ง 5 สัปดาห์แล้วรวมกัน"
      - "ผลรวมหารด้วย 5"
    solution: "(6 + 8 + 11 + 12 + 15) ÷ 5 = 52 ÷ 5 = 10.4 ครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.skill-learning-teamwork.p018
    topics: [health.movement.skill-learning-teamwork]
    difficulty: 5
    type: mcq
    stem: "มิ้นท์ชอบกีฬาแต่ไม่ชอบการปะทะ ว่ายน้ำได้ดี มีความอดทนสูง และชอบฝึกคนเดียวในตอนเช้า ส่วนเพื่อนสนิทชวนเข้าชมรมรักบี้ ข้อใดเป็นการเลือกที่วิเคราะห์ความถนัด ความสนใจ และความแตกต่างระหว่างบุคคลได้ดีที่สุด"
    choices:
      - { id: a, text: "เลือกกีฬาที่ใช้ความอดทนและไม่ปะทะ เช่น ว่ายน้ำระยะไกลหรือวิ่ง และอาจลองรักบี้เป็นครั้งคราวกับเพื่อนโดยไม่บังคับตัวเอง", correct: true }
      - { id: b, text: "เข้าชมรมรักบี้เพราะเพื่อนสนิทอยู่ที่นั่น", feedback: "เพื่อนเป็นแรงจูงใจได้ แต่ควรคำนึงถึงความถนัดและความชอบของตนเองด้วย" }
      - { id: c, text: "เลือกกีฬาที่กำลังเป็นที่นิยมที่สุด", feedback: "ความนิยมไม่ได้บอกว่าเหมาะกับร่างกายและความสนใจของเรา" }
    hints:
      - "รวมข้อมูลทั้งความถนัด ความชอบ และสิ่งที่ไม่ชอบ"
      - "กีฬาที่เหมาะทำให้เล่นได้สม่ำเสมอและมีความสุข"
    solution: "มิ้นท์ถนัดความอดทนและการว่ายน้ำ ไม่ชอบปะทะ จึงเหมาะกับกีฬาประเภทความอดทนที่ไม่ปะทะ การเลือกตามความถนัดและความสนใจช่วยให้ออกกำลังกายได้สม่ำเสมอ"
    license: CC-BY-SA-4.0
    ai_assisted: true
