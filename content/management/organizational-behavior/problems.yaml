problems:
  - id: management.org.organizational-behavior.p001
    topics: [management.org.organizational-behavior]
    difficulty: 1
    type: mcq
    stem: "บริษัทแห่งหนึ่งติดป้าย \"ลูกค้าคือหัวใจ\" ทุกชั้น และให้พนักงานใส่เสื้อสีเดียวกันทุกวันจันทร์ สิ่งเหล่านี้เป็นวัฒนธรรมองค์การระดับใดตามแนวคิดของชายน์"
    choices:
      - { id: a, text: "สิ่งที่มองเห็นได้", correct: true }
      - { id: b, text: "ค่านิยมที่ประกาศ", feedback: "ข้อความบนป้ายสื่อค่านิยม แต่ตัวป้ายและเสื้อเป็นสิ่งที่จับต้องได้ จึงอยู่ระดับสิ่งที่มองเห็น" }
      - { id: c, text: "ฐานคติที่ฝังลึก", feedback: "ฐานคติเป็นความเชื่อที่ไม่มีใครพูดออกมา ดูได้จากพฤติกรรมจริง ไม่ใช่ป้ายหรือเครื่องแบบ" }
      - { id: d, text: "ไม่ใช่วัฒนธรรมองค์การ เป็นแค่การตกแต่ง", feedback: "ป้ายและเครื่องแบบเป็นส่วนหนึ่งของวัฒนธรรมในระดับที่มองเห็นได้" }
    hints:
      - "ชายน์แบ่งวัฒนธรรมเป็นสามระดับจากผิวไปลึก"
      - "ป้ายและเสื้อเป็นสิ่งที่คนนอกเดินเข้ามาก็เห็นได้ทันที"
    solution: "ป้าย เครื่องแบบ และพิธีการเป็นระดับสิ่งที่มองเห็นได้ ซึ่งเปลี่ยนง่ายที่สุด ต้องดูพฤติกรรมจริงจึงจะรู้ว่าฐานคติตรงกับป้ายหรือไม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.organizational-behavior.p002
    topics: [management.org.organizational-behavior]
    difficulty: 1
    type: match
    stem: "เทศบาลแห่งหนึ่ง (สมมติ) เปลี่ยนมารับชำระภาษีผ่านคิวอาร์โค้ด จับคู่กิจกรรมกับขั้นในแบบจำลองของเลวิน"
    pairs:
      - { left: "ประชุมชี้แจงว่าผู้มาชำระภาษีต้องรอนานเท่าใดเมื่อรับเงินสด", right: "ละลาย (Unfreeze)" }
      - { left: "ทดลองรับชำระด้วยคิวอาร์โค้ดที่ช่องบริการหนึ่งช่อง และอบรมเจ้าหน้าที่", right: "เปลี่ยน (Change)" }
      - { left: "เขียนคู่มือขั้นตอนใหม่และใส่เวลารอไว้ในตัวชี้วัดของกอง", right: "ตรึง (Refreeze)" }
    hints:
      - "ขั้นแรกทำให้คนเห็นว่าทำไมต้องเปลี่ยน"
      - "ขั้นสุดท้ายทำให้วิธีใหม่กลายเป็นวิธีปกติ"
    solution: "ชี้ปัญหาของวิธีเดิมคือการละลาย ทดลองและอบรมคือการเปลี่ยน เขียนมาตรฐานและผูกกับตัวชี้วัดคือการตรึง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.organizational-behavior.p003
    topics: [management.org.organizational-behavior]
    difficulty: 1
    type: mcq
    stem: "หัวหน้างานต้องแจ้งพนักงานคนหนึ่งว่าจะถูกย้ายไปสาขาอื่น ช่องทางใดเหมาะที่สุด"
    choices:
      - { id: a, text: "คุยต่อหน้าเป็นการส่วนตัว แล้วตามด้วยหนังสือแจ้ง", correct: true }
      - { id: b, text: "ส่งอีเมลแจ้งพร้อมกันทั้งแผนก", feedback: "เรื่องอ่อนไหวที่กระทบชีวิตคนควรใช้ช่องทางที่สมบูรณ์และเป็นส่วนตัว อีเมลถึงทั้งแผนกทั้งไม่ส่วนตัวและถามกลับไม่ได้ทันที" }
      - { id: c, text: "ติดประกาศที่บอร์ดหน้าห้อง", feedback: "ประกาศเป็นช่องทางที่ข้อมูลน้อยที่สุด เหมาะกับข้อมูลง่าย ๆ ที่ไม่อ่อนไหว" }
      - { id: d, text: "ฝากเพื่อนร่วมงานไปบอก", feedback: "ข้อความจะถูกกรองหรือบิดเบือน และผู้รับถามหัวหน้าโดยตรงไม่ได้" }
    hints:
      - "เรื่องนี้อ่อนไหวและผู้รับน่าจะมีคำถาม"
      - "ช่องทางใดเห็นสีหน้า น้ำเสียง และตอบคำถามได้ทันที"
    solution: "การย้ายงานเป็นเรื่องอ่อนไหวและกำกวม ควรใช้ช่องทางที่สมบูรณ์ที่สุดคือคุยต่อหน้าเป็นการส่วนตัว แล้วจึงยืนยันเป็นลายลักษณ์อักษร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.organizational-behavior.p004
    topics: [management.org.organizational-behavior]
    difficulty: 2
    type: match
    stem: "จับคู่สถานการณ์กับวิธีรับมือความขัดแย้งที่เหมาะสมที่สุด"
    pairs:
      - { left: "พบสารเคมีรั่วในโรงงาน ต้องสั่งหยุดเครื่องทันทีแม้หัวหน้าสายผลิตไม่เห็นด้วย", right: "แข่งขัน" }
      - { left: "สองแผนกต้องออกแบบขั้นตอนรับผู้ป่วยร่วมกันที่จะใช้ไปอีกหลายปี", right: "ร่วมมือ" }
      - { left: "สองฝ่ายมีอำนาจเท่ากัน เวลาจำกัด และยอมได้คนละครึ่งทาง", right: "ประนีประนอม" }
      - { left: "เรื่องเล็กมาก และทั้งสองฝ่ายกำลังอารมณ์ร้อน", right: "หลีกเลี่ยง" }
      - { left: "อีกฝ่ายมีเหตุผลดีกว่า และเรื่องนี้สำคัญกับเขามากกว่าเรา", right: "ยอมตาม" }
    hints:
      - "ดูว่าเรื่องสำคัญกับเราแค่ไหน และความสัมพันธ์ระยะยาวสำคัญแค่ไหน"
      - "เรื่องเร่งด่วนด้านความปลอดภัยไม่มีเวลาหาข้อตกลง"
    solution: "ความปลอดภัยเร่งด่วนใช้การแข่งขัน งานระยะยาวที่สำคัญกับทั้งคู่ใช้การร่วมมือ อำนาจเท่ากันและเวลาจำกัดใช้การประนีประนอม เรื่องเล็กตอนอารมณ์ร้อนใช้การหลีกเลี่ยงชั่วคราว และเมื่ออีกฝ่ายถูกกว่าใช้การยอมตาม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.organizational-behavior.p005
    topics: [management.org.organizational-behavior]
    difficulty: 2
    type: mcq
    stem: "พนักงานคลังสินค้าคนหนึ่งส่งของผิดในเดือนนี้ หัวหน้าพบว่าพนักงานคนอื่นทุกคนก็ส่งของผิดในเดือนนี้ (ความเห็นพ้องสูง) เขาไม่เคยส่งผิดในงานอื่น (ความเฉพาะเจาะจงสูง) และเดือนก่อน ๆ เขาแทบไม่เคยผิด (ความสม่ำเสมอต่ำ) ตามทฤษฎีของเคลลีย์ หัวหน้าควรสรุปอย่างไร"
    choices:
      - { id: a, text: "สาเหตุน่าจะอยู่ภายนอก เช่น ระบบรหัสสินค้าใหม่ ควรตรวจระบบก่อน", correct: true }
      - { id: b, text: "สาเหตุอยู่ที่ตัวพนักงาน ควรตักเตือนเป็นลายลักษณ์อักษร", feedback: "นี่คือความคลาดเคลื่อนพื้นฐานในการอนุมานสาเหตุ ทุกคนผิดเหมือนกันและเขาไม่เคยผิดมาก่อน แสดงว่าสาเหตุน่าจะอยู่ที่สถานการณ์" }
      - { id: c, text: "สรุปไม่ได้เลยจนกว่าจะผิดซ้ำอีกหลายเดือน", feedback: "ข้อมูลสามด้านเพียงพอให้เริ่มตรวจสอบสาเหตุภายนอกได้แล้ว" }
      - { id: d, text: "สาเหตุอยู่ที่ทั้งทีมขาดความรับผิดชอบ", feedback: "การโทษนิสัยของทั้งทีมยังเป็นการมองข้ามสถานการณ์ เช่น ระบบหรือขั้นตอนที่เปลี่ยน" }
    hints:
      - "ถ้าทุกคนผิดเหมือนกัน สาเหตุน่าจะเป็นของร่วม"
      - "ความเห็นพ้องสูง ความเฉพาะเจาะจงสูง ความสม่ำเสมอต่ำ ชี้ไปที่สาเหตุภายนอก"
    solution: "รูปแบบ สูง สูง ต่ำ ชี้ไปที่สาเหตุภายนอก หัวหน้าควรตรวจสิ่งที่เปลี่ยนในเดือนนี้ เช่น ระบบรหัสหรือป้ายชั้นวาง ก่อนจะโทษตัวบุคคล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.organizational-behavior.p006
    topics: [management.org.organizational-behavior]
    difficulty: 2
    type: numeric
    stem: "ร้านกาแฟแห่งหนึ่งจะซื้อเครื่องชงกาแฟมือสอง ผู้ขายตั้งใจไว้ว่าจะไม่ขายต่ำกว่า 41,500 บาท ส่วนร้านกาแฟยอมจ่ายได้สูงสุด 48,000 บาท ช่วงที่ตกลงกันได้ (ZOPA) กว้างกี่บาท"
    answer: { value: 6500, unit: บาท }
    hints:
      - "ZOPA อยู่ระหว่างราคาต่ำสุดที่ผู้ขายรับได้กับราคาสูงสุดที่ผู้ซื้อยอมจ่าย"
      - "ความกว้างของช่วง = ค่าบน − ค่าล่าง"
    misconceptions:
      - { match: 89500, feedback: "นั่นคือผลบวกของสองค่า ความกว้างของช่วงคือผลต่าง" }
      - { match: 44750, feedback: "นั่นคือจุดกึ่งกลางของช่วง ซึ่งเป็นราคาที่อาจตกลงกัน ไม่ใช่ความกว้างของช่วง" }
    solution: "ZOPA คือ 41,500 ถึง 48,000 บาท กว้าง $48{,}000 - 41{,}500 = 6{,}500$ บาท ราคาใดในช่วงนี้ทำให้ทั้งสองฝ่ายดีกว่าการไม่ตกลง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.organizational-behavior.p007
    topics: [management.org.organizational-behavior]
    difficulty: 3
    type: numeric
    stem: "จากภาพสนามแรงของการเปลี่ยนมาใช้ระบบสารบรรณอิเล็กทรอนิกส์ คะแนนแรงผลักดันรวมมากกว่าแรงต้านรวมกี่คะแนน (ถ้าแรงต้านมากกว่าให้ตอบเป็นค่าลบ)"
    figure:
      src: p-forcefield.svg
      alt: "แผนภาพสนามแรง แรงผลักดัน: นโยบายรัฐบาลดิจิทัล 5 ลดค่ากระดาษและหมึก 4 ค้นหาเอกสารได้เร็ว 3 หน่วยงานข้างเคียงใช้แล้ว 2 แรงต้าน: ไม่คุ้นกับลายมือชื่อดิจิทัล 4 กลัวเอกสารหาย 4 คอมพิวเตอร์เครื่องเก่า 3"
    answer: { value: 3, unit: คะแนน }
    hints:
      - "รวมคะแนนแรงผลักดันทั้งสี่ และแรงต้านทั้งสาม แยกกัน"
      - "ผลต่าง = แรงผลักรวม − แรงต้านรวม"
    misconceptions:
      - { match: 25, feedback: "นั่นคือผลรวมของแรงทั้งสองฝั่ง แรงต้านต้องหักออก ไม่ใช่บวก" }
      - { match: -3, feedback: "ลบสลับข้าง โจทย์ถามแรงผลักดันลบแรงต้าน" }
    solution: "แรงผลักดัน $5 + 4 + 3 + 2 = 14$ แรงต้าน $4 + 4 + 3 = 11$ ผลต่าง $14 - 11 = 3$ คะแนน แรงผลักมากกว่าเล็กน้อย จึงควรวางแผนลดแรงต้านด้วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.organizational-behavior.p008
    topics: [management.org.organizational-behavior]
    difficulty: 3
    type: numeric
    stem: "จากภาพสนามแรงเดิม สำนักงานจัดอบรมการใช้ลายมือชื่อดิจิทัลพร้อมคู่มือ ทำให้คะแนนแรงต้าน \"ไม่คุ้นกับลายมือชื่อดิจิทัล\" ลดจาก 4 เหลือ 1 โดยแรงอื่นเท่าเดิม ผลต่างระหว่างแรงผลักดันรวมกับแรงต้านรวมจะเป็นเท่าใด"
    figure:
      src: p-forcefield.svg
      alt: "แผนภาพสนามแรง แรงผลักดัน: นโยบายรัฐบาลดิจิทัล 5 ลดค่ากระดาษและหมึก 4 ค้นหาเอกสารได้เร็ว 3 หน่วยงานข้างเคียงใช้แล้ว 2 แรงต้าน: ไม่คุ้นกับลายมือชื่อดิจิทัล 4 กลัวเอกสารหาย 4 คอมพิวเตอร์เครื่องเก่า 3"
    answer: { value: 6, unit: คะแนน }
    hints:
      - "แรงผลักดันรวมยังเท่าเดิม"
      - "แรงต้านรวมใหม่ = 1 + 4 + 3"
    misconceptions:
      - { match: 3, feedback: "นั่นคือผลต่างก่อนอบรม ต้องปรับคะแนนแรงต้านตัวที่ลดลงก่อน" }
      - { match: 0, feedback: "ดูเหมือนตัดแรงต้านตัวที่สามออกแทนตัวแรก อ่านชื่อแรงในภาพอีกครั้ง" }
    solution: "แรงผลักดัน 14 เท่าเดิม แรงต้านใหม่ $1 + 4 + 3 = 8$ ผลต่าง $14 - 8 = 6$ คะแนน การลดแรงต้านหนึ่งตัวเพิ่มผลต่างได้เท่ากับการเพิ่มแรงผลักใหม่ 3 คะแนน โดยไม่สร้างแรงกดดันเพิ่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.organizational-behavior.p009
    topics: [management.org.organizational-behavior]
    difficulty: 3
    type: match
    stem: "จับคู่สาเหตุของแรงต้านการเปลี่ยนแปลงกับวิธีลดแรงต้านที่ตรงที่สุด"
    pairs:
      - { left: "พนักงานไม่รู้ว่าทำไมต้องเปลี่ยน ได้ยินแต่ข่าวลือ", right: "สื่อสารเหตุผลและให้ข้อมูลที่ถูกต้อง" }
      - { left: "พนักงานกลัวว่าจะใช้เครื่องมือใหม่ไม่เป็น", right: "อบรม มีพี่เลี้ยง และให้เวลาปรับตัว" }
      - { left: "หัวหน้าแผนกจะเสียอำนาจอนุมัติบางส่วน", right: "เจรจาและหาสิ่งตอบแทนที่เหมาะสม" }
      - { left: "ผู้ปฏิบัติงานรู้ปัญหาหน้างานดีกว่าผู้ออกแบบระบบ", right: "ให้มีส่วนร่วมออกแบบตั้งแต่ต้น" }
    hints:
      - "แต่ละสาเหตุต้องแก้ที่ต้นเหตุของมันเอง"
      - "ขาดข้อมูลแก้ด้วยข้อมูล กลัวทำไม่ได้แก้ด้วยการพัฒนาทักษะ"
    solution: "ขาดข้อมูลแก้ด้วยการสื่อสาร กลัวทำไม่ได้แก้ด้วยการอบรมและสนับสนุน เสียประโยชน์แก้ด้วยการเจรจา และคนที่มีความรู้หน้างานควรได้ร่วมออกแบบ ซึ่งยังช่วยให้เขารู้สึกเป็นเจ้าของด้วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.organizational-behavior.p010
    topics: [management.org.organizational-behavior]
    difficulty: 3
    type: mcq
    stem: "พนักงานคนหนึ่งเชื่อว่าการกรอกแบบบันทึกความเสี่ยงเสียเวลา แต่ถูกสั่งให้กรอกทุกวัน ผ่านไปหนึ่งเดือนเขาเริ่มพูดว่า \"จริง ๆ ก็มีประโยชน์ เห็นปัญหาเร็วขึ้น\" ปรากฏการณ์นี้อธิบายด้วยแนวคิดใดได้ดีที่สุด"
    choices:
      - { id: a, text: "การลดความไม่สอดคล้องทางความคิด", correct: true }
      - { id: b, text: "ผลรัศมี", feedback: "ผลรัศมีคือการประทับใจเรื่องหนึ่งแล้วมองดีไปทุกเรื่อง ไม่เกี่ยวกับการปรับความเชื่อให้ตรงกับการกระทำ" }
      - { id: c, text: "การเลือกรับรู้", feedback: "การเลือกรับรู้คือการสนใจเฉพาะข้อมูลที่ตรงความเชื่อเดิม แต่ในข้อนี้ความเชื่อเปลี่ยนไป" }
      - { id: d, text: "ภาพเหมารวม", feedback: "ภาพเหมารวมคือการตัดสินคนจากกลุ่มที่เขาสังกัด ไม่เกี่ยวกับกรณีนี้" }
    hints:
      - "ความเชื่อเดิมขัดกับสิ่งที่เขาต้องทำทุกวัน"
      - "คนมักลดความอึดอัดด้วยการปรับความเชื่อให้เข้ากับพฤติกรรม"
    solution: "เมื่อการกระทำ (กรอกทุกวัน) ขัดกับความเชื่อ (เสียเวลา) เกิดความไม่สอดคล้องทางความคิด เขาลดความอึดอัดโดยเปลี่ยนความเชื่อให้สอดคล้องกับการกระทำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.organizational-behavior.p011
    topics: [management.org.organizational-behavior]
    difficulty: 3
    type: numeric
    stem: "โรงพยาบาลแห่งหนึ่ง (สมมติ) มีพยาบาล 150 คน ส่งแบบสำรวจความผูกพันต่อองค์การกลับมา 120 คน ในข้อ \"ฉันภูมิใจที่ได้ทำงานที่นี่\" มีผู้ตอบเห็นด้วยและเห็นด้วยอย่างยิ่งรวม 78 คน ร้อยละของคำตอบเชิงบวก (คิดจากผู้ตอบ) เป็นเท่าใด"
    answer: { value: 65, unit: "%" }
    hints:
      - "ร้อยละเชิงบวก = จำนวนคำตอบเชิงบวก ÷ จำนวนผู้ตอบ × 100"
      - "ตัวหารคือผู้ที่ส่งแบบสำรวจกลับ ไม่ใช่พยาบาลทั้งหมด"
    misconceptions:
      - { match: 52, feedback: "หารด้วยพยาบาลทั้งหมด 150 คน ร้อยละเชิงบวกคิดจากผู้ตอบ ส่วน 150 ใช้คิดอัตราการตอบกลับ" }
      - { match: 80, feedback: "นั่นคืออัตราการตอบกลับ (120 ÷ 150) ไม่ใช่ร้อยละเชิงบวก" }
    solution: "$78 \\div 120 \\times 100 = 65\\%$ ควรรายงานคู่กับอัตราการตอบกลับ $120 \\div 150 = 80\\%$ เพราะถ้าคนที่ไม่พอใจไม่ตอบ ผลอาจดีเกินจริง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.organizational-behavior.p012
    topics: [management.org.organizational-behavior]
    difficulty: 4
    type: order
    stem: "เรียงขั้นของกระบวนการสื่อสารเมื่อหัวหน้าเวรต้องการแจ้งพยาบาลให้เปลี่ยนวิธีวัดสัญญาณชีพ"
    items:
      - "หัวหน้าเวรมีความคิดที่ต้องการสื่อ"
      - "เข้ารหัสเป็นคำพูดและตัวอย่างที่พยาบาลเข้าใจ"
      - "ส่งผ่านช่องทาง คือประชุมสั้นตอนรับเวร"
      - "พยาบาลถอดรหัสและตีความข้อความ"
      - "พยาบาลถามทวนหรือสาธิต เป็นข้อมูลป้อนกลับ"
    hints:
      - "ผู้ส่งต้องแปลงความคิดเป็นข้อความก่อนส่ง"
      - "ข้อมูลป้อนกลับทำให้ผู้ส่งรู้ว่าผู้รับเข้าใจตรงกันหรือไม่"
    solution: "ความคิด → เข้ารหัส → ช่องทาง → ถอดรหัส → ข้อมูลป้อนกลับ ถ้าไม่มีขั้นสุดท้าย หัวหน้าเวรจะไม่รู้ว่าพยาบาลเข้าใจตรงกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.organizational-behavior.p013
    topics: [management.org.organizational-behavior]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "โรงงานอาหารแห่งหนึ่ง (สมมติ) ทำโครงการลดของเสียได้ผลดีช่วงแรก แต่หกเดือนต่อมาของเสียกลับมาเท่าเดิม พบข้อเท็จจริงต่อไปนี้ ข้อใดเป็นอุปสรรคของการปรับปรุงคุณภาพ (เลือกได้หลายข้อ)"
    choices:
      - { id: a, text: "ผู้จัดการโรงงานไม่เคยเข้าประชุมทีม ส่งแต่ผู้แทน", correct: true }
      - { id: b, text: "ใครรายงานของเสียมากจะถูกตำหนิในที่ประชุม", correct: true }
      - { id: c, text: "เมื่อโครงการจบ ไม่ได้เขียนขั้นตอนใหม่เป็นมาตรฐาน", correct: true }
      - { id: d, text: "ทีมใช้แผนภูมิพาเรโตเลือกปัญหาที่จะแก้ก่อน", feedback: "การใช้ข้อมูลเลือกปัญหาเป็นวิธีที่ดี ไม่ใช่อุปสรรค" }
      - { id: e, text: "พนักงานหน้างานได้ร่วมเสนอวิธีแก้", feedback: "การมีส่วนร่วมของพนักงานช่วยลดแรงต้าน ไม่ใช่อุปสรรค" }
    hints:
      - "อุปสรรคมักเกี่ยวกับผู้บริหาร วัฒนธรรม และการทำให้ผลคงอยู่"
      - "ทำไมผลดีในช่วงแรกจึงหายไป"
    solution: "ผู้บริหารไม่ลงมือเอง (a) วัฒนธรรมกลัวความผิดทำให้คนซ่อนปัญหา (b) และไม่มีขั้นตรึงทำให้คนกลับไปทำแบบเดิม (c) ส่วนการใช้ข้อมูลและการมีส่วนร่วม (d, e) เป็นปัจจัยที่ช่วยให้สำเร็จ"
