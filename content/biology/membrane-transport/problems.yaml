problems:
  - id: biology.cells.membrane-transport.p001
    topics: [biology.cells.membrane-transport]
    difficulty: 1
    type: match
    stem: "จับคู่วิธีลำเลียงสารกับคำอธิบาย"
    pairs:
      - { left: "การแพร่ธรรมดา", right: "สารเคลื่อนจากความเข้มข้นสูงไปต่ำผ่านชั้นลิพิดโดยตรง" }
      - { left: "ออสโมซิส", right: "น้ำเคลื่อนผ่านเยื่อเลือกผ่านไปยังด้านที่มีตัวถูกละลายมากกว่า" }
      - { left: "การแพร่แบบฟาซิลิเทต", right: "สารแพร่ตามความเข้มข้นผ่านโปรตีนช่องหรือโปรตีนตัวพา ไม่ใช้ ATP" }
      - { left: "แอกทีฟทรานสปอร์ต", right: "สารถูกลำเลียงจากความเข้มข้นต่ำไปสูง ใช้ ATP" }
      - { left: "เอกโซไซโทซิส", right: "เวสิเคิลรวมกับเยื่อหุ้มเซลล์แล้วปล่อยสารออก" }
      - { left: "เอนโดไซโทซิส", right: "เยื่อหุ้มเซลล์โอบสารแล้วคอดเป็นเวสิเคิลเข้ามา" }
    hints:
      - "แบ่งก่อนว่าวิธีใดใช้พลังงาน วิธีใดไม่ใช้"
      - "เอกโซ แปลว่าออก เอนโด แปลว่าเข้า"
    solution: "การแพร่ธรรมดา ออสโมซิส และการแพร่แบบฟาซิลิเทตไปตามเกรเดียนต์ไม่ใช้ ATP ส่วนแอกทีฟทรานสปอร์ตสวนเกรเดียนต์ใช้ ATP เอกโซไซโทซิสนำสารออก เอนโดไซโทซิสนำสารเข้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.membrane-transport.p002
    topics: [biology.cells.membrane-transport]
    difficulty: 1
    type: mcq
    stem: "การลำเลียงสารผ่านเยื่อหุ้มเซลล์แบบใดที่เซลล์ต้องใช้พลังงานจาก ATP"
    choices:
      - { id: a, text: "แอกทีฟทรานสปอร์ต", correct: true }
      - { id: b, text: "ออสโมซิส", feedback: "ออสโมซิสเป็นการแพร่ของน้ำตามความต่างของความเข้มข้น ไม่ใช้ ATP" }
      - { id: c, text: "การแพร่แบบฟาซิลิเทต", feedback: "ใช้โปรตีนช่วย แต่สารยังไปจากความเข้มข้นสูงไปต่ำ จึงไม่ใช้ ATP" }
      - { id: d, text: "การแพร่ธรรมดา", feedback: "การแพร่เกิดจากการเคลื่อนที่แบบสุ่มของโมเลกุล ไม่ต้องใช้พลังงานจากเซลล์" }
    hints:
      - "การลำเลียงที่ต้องใช้พลังงานคือการลำเลียงที่สวนอะไร"
      - "เหมือนการเข็นของขึ้นเนิน ต้องออกแรง"
    solution: "แอกทีฟทรานสปอร์ตลำเลียงสารจากความเข้มข้นต่ำไปสูง จึงต้องใช้พลังงานจาก ATP"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.membrane-transport.p003
    topics: [biology.cells.membrane-transport]
    difficulty: 2
    type: text
    stem: "การแพร่ของน้ำผ่านเยื่อเลือกผ่าน จากสารละลายที่มีตัวถูกละลายน้อยไปยังสารละลายที่มีตัวถูกละลายมาก เรียกว่าอะไร"
    accepted: ["ออสโมซิส", "osmosis"]
    hints:
      - "เป็นการแพร่แบบหนึ่งที่เฉพาะกับน้ำ"
      - "ทำให้ผักที่พรมน้ำกรอบเต่ง"
    misconceptions:
      - { match: "การแพร่", feedback: "ถูกบางส่วน แต่การแพร่ของน้ำผ่านเยื่อเลือกผ่านมีชื่อเฉพาะ" }
      - { match: "แอกทีฟทรานสปอร์ต", feedback: "น้ำเคลื่อนตามความต่างของความเข้มข้นเอง ไม่ต้องใช้ ATP" }
    solution: "ออสโมซิส คือการแพร่ของน้ำผ่านเยื่อเลือกผ่าน ไปยังด้านที่มีตัวถูกละลายมากกว่า (มีน้ำน้อยกว่า)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.membrane-transport.p004
    topics: [biology.cells.membrane-transport]
    difficulty: 2
    type: mcq
    stem: "หยดเลือดลงในน้ำกลั่น แล้วส่องกล้องจุลทรรศน์ทันที เซลล์เม็ดเลือดแดงจะเป็นอย่างไร"
    choices:
      - { id: a, text: "บวมขึ้นจนแตก เพราะน้ำออสโมซิสเข้าเซลล์", correct: true }
      - { id: b, text: "เหี่ยวย่น เพราะน้ำออกจากเซลล์", feedback: "น้ำกลั่นมีตัวถูกละลายน้อยกว่าในเซลล์ น้ำจึงเข้าเซลล์ ไม่ใช่ออก" }
      - { id: c, text: "เหมือนเดิม เพราะน้ำกลั่นไม่มีสารใด ๆ", feedback: "ความต่างของความเข้มข้นระหว่างในเซลล์กับน้ำกลั่นทำให้น้ำเคลื่อนเข้าเซลล์" }
      - { id: d, text: "เต่งแต่ไม่แตก เหมือนเซลล์พืช", feedback: "เซลล์เม็ดเลือดแดงไม่มีผนังเซลล์ต้านไว้ จึงบวมจนแตกได้" }
    hints:
      - "น้ำกลั่นเป็นสารละลายไฮโพโทนิกหรือไฮเปอร์โทนิกเมื่อเทียบกับในเซลล์"
      - "เซลล์สัตว์มีอะไรต้านแรงดันน้ำหรือไม่"
    solution: "น้ำกลั่นเป็นไฮโพโทนิก น้ำเข้าเซลล์ด้วยออสโมซิส เซลล์เม็ดเลือดแดงไม่มีผนังเซลล์ จึงบวมจนแตก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.membrane-transport.p005
    topics: [biology.cells.membrane-transport]
    difficulty: 2
    type: mcq
    stem: "แก๊สออกซิเจนผ่านเยื่อหุ้มเซลล์เข้าสู่เซลล์ด้วยวิธีใด"
    choices:
      - { id: a, text: "แพร่ผ่านชั้นฟอสโฟลิพิดได้โดยตรง เพราะเป็นโมเลกุลเล็กไม่มีขั้ว", correct: true }
      - { id: b, text: "ผ่านโปรตีนตัวพาโดยใช้ ATP", feedback: "ออกซิเจนผ่านชั้นลิพิดได้เองและไปตามความเข้มข้น ไม่ต้องใช้โปรตีนหรือ ATP" }
      - { id: c, text: "เอนโดไซโทซิส", feedback: "เอนโดไซโทซิสใช้กับสารโมเลกุลใหญ่หรือของแข็ง ออกซิเจนเล็กมาก" }
      - { id: d, text: "ผ่านโปรตีนช่องไอออน", feedback: "ออกซิเจนไม่ใช่ไอออน และละลายในชั้นลิพิดที่ไม่มีขั้วได้ดี" }
    hints:
      - "ชั้นกลางของเยื่อหุ้มเซลล์ไม่มีขั้ว สารแบบใดผ่านได้ง่าย"
      - "O₂ เป็นโมเลกุลเล็กและมีขั้วหรือไม่"
    solution: "O₂ เป็นโมเลกุลเล็กไม่มีขั้ว ละลายในชั้นหางกรดไขมันได้ จึงแพร่ผ่านชั้นฟอสโฟลิพิดโดยตรงจากด้านที่มีความเข้มข้นสูงไปต่ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.membrane-transport.p006
    topics: [biology.cells.membrane-transport]
    difficulty: 2
    type: numeric
    stem: "แท่งมันฝรั่งหนัก 2.50 กรัม หลังแช่ในสารละลายซูโครสเข้มข้น 1 ชั่วโมงหนัก 2.20 กรัม มวลเปลี่ยนไปร้อยละเท่าไร (ถ้ามวลลดลงให้ตอบเป็นค่าลบ)"
    answer: { value: -12, tolerance: 0.2, unit: "%" }
    hints:
      - "หาการเปลี่ยนแปลงก่อน: มวลหลัง − มวลก่อน"
      - "นำการเปลี่ยนแปลงหารด้วยมวลก่อน แล้วคูณ 100"
    misconceptions:
      - { match: 12, feedback: "มวลลดลง จึงต้องตอบเป็นค่าลบ" }
      - { match: -13.64, feedback: "หารด้วยมวลหลังแช่ ต้องหารด้วยมวลก่อนแช่ (2.50 กรัม)" }
    solution: "การเปลี่ยนแปลง $= 2.20 - 2.50 = -0.30$ กรัม ร้อยละ $= \\frac{-0.30}{2.50} \\times 100 = -12\\%$ น้ำออสโมซิสออกจากเซลล์มันฝรั่ง แสดงว่าสารละลายเป็นไฮเปอร์โทนิก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.membrane-transport.p007
    topics: [biology.cells.membrane-transport]
    difficulty: 3
    type: mcq
    stem: "แม่คลุกแตงกวาหั่นกับเกลือเพื่อทำผักดอง ไม่นานมีน้ำซึมออกมาและแตงกวานิ่มลง ถ้าส่องเซลล์แตงกวาจะเห็นอะไร"
    choices:
      - { id: a, text: "ไซโทพลาซึมหดตัวจนเยื่อหุ้มเซลล์หลุดออกจากผนังเซลล์ (พลาสโมไลซิส)", correct: true }
      - { id: b, text: "เซลล์บวมแตกเพราะได้รับเกลือ", feedback: "เกลือรอบเซลล์ทำให้น้ำออกจากเซลล์ เซลล์จึงหด ไม่ใช่บวม" }
      - { id: c, text: "ผนังเซลล์หดตัวเล็กลงพร้อมกับเยื่อหุ้มเซลล์", feedback: "ผนังเซลล์แข็งและคงรูป ส่วนที่หดคือไซโทพลาซึมกับเยื่อหุ้มเซลล์ ทำให้เกิดช่องระหว่างผนังกับเยื่อหุ้ม" }
      - { id: d, text: "เซลล์เต่งขึ้นเพราะเกลือดูดซึมเข้าไปพร้อมน้ำ", feedback: "สารละลายเกลือเข้มข้นเป็นไฮเปอร์โทนิก น้ำออกจากเซลล์มากกว่าเข้า" }
    hints:
      - "เกลือที่คลุกทำให้ด้านนอกเซลล์มีตัวถูกละลายมากหรือน้อย"
      - "น้ำเคลื่อนออกจากเซลล์ ส่วนใดหด ส่วนใดคงรูป"
    solution: "เกลือทำให้นอกเซลล์เป็นไฮเปอร์โทนิก น้ำออสโมซิสออก แวคิวโอลและไซโทพลาซึมหดจนเยื่อหุ้มเซลล์หลุดจากผนังเซลล์ เรียกว่าพลาสโมไลซิส แตงกวาจึงนิ่มและมีน้ำซึมออก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.membrane-transport.p008
    topics: [biology.cells.membrane-transport]
    difficulty: 4
    type: numeric
    stem: "จากกราฟ ความเข้มข้นของสารละลายซูโครสที่ไอโซโทนิกกับเซลล์มันฝรั่ง (มวลไม่เปลี่ยน) ประมาณกี่โมลต่อลิตร (ตอบทศนิยม 2 ตำแหน่ง)"
    figure: { src: potato-graph.svg, alt: "กราฟเส้น (ข้อมูลสมมติ) แกนนอนเป็นความเข้มข้นของสารละลายซูโครส 0 ถึง 0.8 โมลต่อลิตร แกนตั้งเป็นร้อยละการเปลี่ยนแปลงมวลของแท่งมันฝรั่ง จุดข้อมูล: 0 โมลต่อลิตร +18%, 0.2 โมลต่อลิตร +8%, 0.4 โมลต่อลิตร −3%, 0.6 โมลต่อลิตร −12%, 0.8 โมลต่อลิตร −19% ลากเส้นตรงเชื่อมจุดต่อกัน เส้นตัดแกนศูนย์ระหว่าง 0.2 กับ 0.4 โมลต่อลิตร" }
    answer: { value: 0.35, tolerance: 0.02, unit: mol/L }
    hints:
      - "หาว่าเส้นกราฟตัดแนวร้อยละศูนย์ระหว่างจุดใดกับจุดใด"
      - "ระหว่าง 0.2 ถึง 0.4 โมลต่อลิตร มวลเปลี่ยนจาก +8% เป็น −3% (ลดลง 11) ต้องเลื่อนไปกี่ส่วนจาก 0.2 จึงจะลดลง 8"
    misconceptions:
      - { match: 0.4, feedback: "ที่ 0.4 โมลต่อลิตร มวลยังลดลง 3% จุดที่มวลไม่เปลี่ยนอยู่ก่อนหน้านั้น" }
      - { match: 0.3, feedback: "อ่านกึ่งกลางระหว่าง 0.2 กับ 0.4 แต่ +8 อยู่ห่างจากศูนย์มากกว่า −3 จุดตัดจึงใกล้ 0.4 มากกว่า" }
    solution: "ระหว่าง 0.2 กับ 0.4 โมลต่อลิตร เส้นลดลง 11 หน่วย ต้องลด 8 หน่วยจาก +8 ถึงศูนย์ ความเข้มข้น $= 0.2 + 0.2 \\times \\frac{8}{11} \\approx 0.35$ โมลต่อลิตร ที่ความเข้มข้นนี้น้ำเข้าและออกจากเซลล์มันฝรั่งเท่ากัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.membrane-transport.p009
    topics: [biology.cells.membrane-transport]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "กลูโคสเข้าสู่เซลล์เม็ดเลือดแดงด้วยการแพร่แบบฟาซิลิเทต ข้อใดถูกต้อง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "กลูโคสเคลื่อนจากความเข้มข้นสูงในเลือดไปต่ำในเซลล์", correct: true }
      - { id: b, text: "ต้องอาศัยโปรตีนตัวพาที่จำเพาะกับกลูโคส", correct: true }
      - { id: c, text: "เมื่อโปรตีนตัวพาทำงานเต็มที่ อัตราจะไม่เพิ่มอีกแม้ความเข้มข้นจะสูงขึ้น", correct: true }
      - { id: d, text: "เซลล์ต้องใช้ ATP", feedback: "การแพร่แบบฟาซิลิเทตไปตามเกรเดียนต์ ไม่ใช้ ATP" }
      - { id: e, text: "กลูโคสผ่านชั้นฟอสโฟลิพิดได้โดยตรงเพราะโมเลกุลเล็ก", feedback: "กลูโคสมีขั้วและค่อนข้างใหญ่ ผ่านชั้นลิพิดที่ไม่มีขั้วได้ยาก จึงต้องใช้โปรตีน" }
    hints:
      - "ฟาซิลิเทต แปลว่า ช่วยให้สะดวก ใครช่วย"
      - "จำนวนโปรตีนตัวพามีจำกัดหรือไม่จำกัด"
    solution: "กลูโคสแพร่ตามเกรเดียนต์ผ่านโปรตีนตัวพาที่จำเพาะ ไม่ใช้ ATP และเพราะโปรตีนมีจำกัด อัตราจึงถึงค่าสูงสุดเมื่อโปรตีนทำงานเต็มที่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.membrane-transport.p010
    topics: [biology.cells.membrane-transport]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนที่เซลล์ตับอ่อนสร้างเอนไซม์แล้วหลั่งออกนอกเซลล์ด้วยเอกโซไซโทซิส"
    items:
      - "ไรโบโซมบนร่างแหเอนโดพลาซึมผิวขรุขระสร้างโปรตีน"
      - "โปรตีนถูกบรรจุในเวสิเคิลส่งไปกอลจิบอดี"
      - "กอลจิบอดีดัดแปลงและบรรจุโปรตีนในเวสิเคิลใหม่"
      - "เวสิเคิลเคลื่อนไปรวมกับเยื่อหุ้มเซลล์"
      - "เอนไซม์ถูกปล่อยออกนอกเซลล์"
    hints:
      - "เริ่มจากที่สร้างโปรตีน"
      - "กอลจิบอดีอยู่ระหว่างร่างแหเอนโดพลาซึมกับเยื่อหุ้มเซลล์"
