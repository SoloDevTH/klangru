problems:
  - id: english.grammar.past-continuous.p001
    topics: [english.grammar.past-continuous]
    difficulty: 1
    type: text
    stem: "เติม was หรือ were: *I ___ watching TV at eight o'clock last night.*"
    accepted: ["was"]
    misconceptions:
      - { match: "were", feedback: "ประธาน I ใช้ was" }
      - { match: "am", feedback: "last night เป็นอดีต ใช้ was ไม่ใช่ am" }
    hints:
      - "last night = อดีต"
      - "I / he / she / it ใช้ was"
    solution: "*I **was** watching TV at eight o'clock last night.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.past-continuous.p002
    topics: [english.grammar.past-continuous]
    difficulty: 1
    type: text
    stem: "เติม was หรือ were: *At 4 p.m. yesterday, the boys ___ playing takraw.*"
    accepted: ["were"]
    misconceptions:
      - { match: "was", feedback: "the boys เป็นพหูพจน์ (= they) ใช้ were" }
      - { match: "are", feedback: "yesterday เป็นอดีต ใช้ were ไม่ใช่ are" }
    hints:
      - "the boys = they"
      - "you / we / they ใช้ were"
    solution: "*At 4 p.m. yesterday, the boys **were** playing takraw.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.past-continuous.p003
    topics: [english.grammar.past-continuous]
    difficulty: 1
    type: mcq
    stem: "ประโยคใดเป็น past continuous"
    choices:
      - { id: a, text: "She was reading a book.", correct: true, feedback: "ถูก was + reading (V-ing)" }
      - { id: b, text: "She is reading a book.", feedback: "is + V-ing เป็น present continuous (ตอนนี้)" }
      - { id: c, text: "She read a book.", feedback: "read ในประโยคนี้เป็น past simple (อ่านแล้ว)" }
      - { id: d, text: "She reads a book.", feedback: "reads เป็น present simple" }
    hints:
      - "past continuous = was/were + V-ing"
      - "หาประโยคที่มีทั้ง was/were และ -ing"
    solution: "***She was reading a book.***"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.past-continuous.p004
    topics: [english.grammar.past-continuous]
    difficulty: 2
    type: text
    stem: "เปลี่ยน swim เป็นรูป -ing: *We were ___ in the sea when it started to rain.*"
    accepted: ["swimming"]
    misconceptions:
      - { match: "swiming", feedback: "swim สระเสียงสั้นตัวเดียวตามด้วยพยัญชนะตัวเดียว ต้องเพิ่ม m: swimming" }
      - { match: "swim", feedback: "หลัง were ในประโยคนี้ต้องเป็นรูป -ing" }
      - { match: "swam", feedback: "หลัง were ใช้ V-ing ไม่ใช่กริยาช่อง 2" }
    hints:
      - "past continuous = were + V-ing"
      - "swim ต้องเพิ่มพยัญชนะท้ายก่อนเติม -ing เหมือน run → running"
    solution: "*We were **swimming** in the sea when it started to rain.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.past-continuous.p005
    topics: [english.grammar.past-continuous]
    difficulty: 2
    type: mcq
    stem: "ดูตาราง *Who was sleeping at 8:30 p.m.?*"
    figure: { src: last-night-table.svg, alt: "ตาราง Last night: What were they doing? คอลัมน์ Name, 7:00 – 8:00 p.m., 8:00 – 9:00 p.m. Grandma: watching TV, sleeping. Dad: cooking dinner, washing the dishes. Mum: reading the news, talking on the phone. Mook: doing her homework, playing the guitar. Ben: playing football, taking a shower." }
    choices:
      - { id: a, text: "Grandma", correct: true, feedback: "ถูก ช่วง 8:00 – 9:00 p.m. Grandma กำลังนอน" }
      - { id: b, text: "Ben", feedback: "Ben กำลังอาบน้ำ (taking a shower)" }
      - { id: c, text: "Mum", feedback: "Mum กำลังคุยโทรศัพท์" }
      - { id: d, text: "Dad", feedback: "Dad กำลังล้างจาน" }
    hints:
      - "8:30 p.m. อยู่ในคอลัมน์ 8:00 – 9:00 p.m."
      - "หาคำว่า sleeping"
    solution: "***Grandma** was sleeping at 8:30 p.m.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.past-continuous.p006
    topics: [english.grammar.past-continuous]
    difficulty: 2
    type: text
    stem: "ดูตาราง *What was Mook doing at 7:30 p.m.?* เติมสองคำ: *She ___ her homework.*"
    figure: { src: last-night-table.svg, alt: "ตาราง Last night: What were they doing? คอลัมน์ Name, 7:00 – 8:00 p.m., 8:00 – 9:00 p.m. Grandma: watching TV, sleeping. Dad: cooking dinner, washing the dishes. Mum: reading the news, talking on the phone. Mook: doing her homework, playing the guitar. Ben: playing football, taking a shower." }
    accepted: ["was doing"]
    misconceptions:
      - { match: "did", feedback: "did บอกว่าทำเสร็จแล้ว คำถามถามว่ากำลังทำอะไร ใช้ was doing" }
      - { match: "is doing", feedback: "เหตุการณ์เมื่อคืน ใช้ was ไม่ใช่ is" }
      - { match: "were doing", feedback: "She ใช้ was" }
      - { match: "was do", feedback: "หลัง was ต้องเป็น V-ing: doing" }
    hints:
      - "ตอบด้วยรูปเดียวกับคำถาม: was + V-ing"
      - "7:30 p.m. อยู่ในคอลัมน์ 7:00 – 8:00 p.m."
    solution: "*She **was doing** her homework.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.past-continuous.p007
    topics: [english.grammar.past-continuous]
    difficulty: 2
    type: match
    stem: "ดูตาราง จับคู่คนกับสิ่งที่กำลังทำตอน 8:30 p.m."
    figure: { src: last-night-table.svg, alt: "ตาราง Last night: What were they doing? คอลัมน์ Name, 7:00 – 8:00 p.m., 8:00 – 9:00 p.m. Grandma: watching TV, sleeping. Dad: cooking dinner, washing the dishes. Mum: reading the news, talking on the phone. Mook: doing her homework, playing the guitar. Ben: playing football, taking a shower." }
    pairs:
      - { left: "Dad", right: "was washing the dishes." }
      - { left: "Mum", right: "was talking on the phone." }
      - { left: "Mook", right: "was playing the guitar." }
      - { left: "Ben", right: "was taking a shower." }
    hints:
      - "ดูเฉพาะคอลัมน์ 8:00 – 9:00 p.m."
      - "อย่าสับสนกับคอลัมน์ 7:00 – 8:00 p.m."
    solution: "Dad was washing the dishes. · Mum was talking on the phone. · Mook was playing the guitar. · Ben was taking a shower."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.past-continuous.p008
    topics: [english.grammar.past-continuous]
    difficulty: 3
    type: mcq
    stem: "เลือกคำที่ถูก: *I ___ a shower when the lights went out.*"
    choices:
      - { id: a, text: "was having", correct: true, feedback: "ถูก กำลังอาบน้ำอยู่แล้วไฟดับมาแทรก" }
      - { id: b, text: "were having", feedback: "ประธาน I ใช้ was" }
      - { id: c, text: "am having", feedback: "เหตุการณ์ในอดีต (went out) ใช้ was" }
      - { id: d, text: "was have", feedback: "หลัง was ต้องเป็น V-ing: having" }
    hints:
      - "การกระทำยาวที่ถูกแทรกใช้ past continuous"
      - "I + was + V-ing"
    solution: "*I **was having** a shower when the lights went out.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.past-continuous.p009
    topics: [english.grammar.past-continuous]
    difficulty: 3
    type: text
    stem: "เติมกริยา walk ในรูปที่ถูก (สองคำ): *While I ___ home, it started to rain.*"
    accepted: ["was walking"]
    misconceptions:
      - { match: "walked", feedback: "หลัง while ใช้การกระทำที่ยาว (past continuous): was walking" }
      - { match: "were walking", feedback: "ประธาน I ใช้ was" }
      - { match: "am walking", feedback: "เรื่องในอดีต (started) ใช้ was" }
      - { match: "walking", feedback: "ขาด was: was walking" }
    hints:
      - "while + การกระทำที่กำลังเกิดอยู่"
      - "I + was + V-ing"
    solution: "*While I **was walking** home, it started to rain.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.past-continuous.p010
    topics: [english.grammar.past-continuous]
    difficulty: 3
    type: mcq
    stem: "ประโยคใดถูกต้อง"
    choices:
      - { id: a, text: "While I was cooking, the phone rang.", correct: true, feedback: "ถูก while + past continuous, เหตุการณ์สั้นใช้ past simple" }
      - { id: b, text: "While I was cook, the phone rang.", feedback: "หลัง was ต้องเป็น V-ing: cooking" }
      - { id: c, text: "While I cooking, the phone rang.", feedback: "ขาด was: I was cooking" }
      - { id: d, text: "While I was cooking, the phone was rang.", feedback: "was + กริยาช่อง 2 ใช้ไม่ได้ ใช้ rang (past simple)" }
    hints:
      - "past continuous ต้องมีทั้ง was/were และ -ing"
      - "เหตุการณ์สั้นใช้ past simple อย่างเดียว"
    solution: "***While I was cooking, the phone rang.***"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.past-continuous.p011
    topics: [english.grammar.past-continuous]
    difficulty: 3
    type: order
    stem: "เรียงเป็นประโยคที่ถูกต้อง"
    items:
      - "When Dad came home,"
      - "we were"
      - "eating"
      - "dinner."
    hints:
      - "ประโยคขึ้นต้นด้วย When และมีจุลภาคคั่น"
      - "หลังจุลภาคเป็นการกระทำที่กำลังเกิด: ประธาน + were + V-ing"
    solution: "*When Dad came home, we were eating dinner.* (กำลังกินอยู่แล้วตอนพ่อกลับมา)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.past-continuous.p012
    topics: [english.grammar.past-continuous]
    difficulty: 3
    type: mcq
    stem: "*Were you sleeping when I called you at 10 p.m.?* ตอบปฏิเสธสั้นอย่างไร"
    choices:
      - { id: a, text: "No, I wasn't.", correct: true, feedback: "ถูก คำถามใช้ Were you ตอบด้วย I wasn't" }
      - { id: b, text: "No, I didn't.", feedback: "คำถามขึ้นต้นด้วย Were ไม่ใช่ Did ตอบด้วย wasn't" }
      - { id: c, text: "No, I weren't.", feedback: "ประธาน I ใช้ wasn't" }
      - { id: d, text: "No, I wasn't sleep.", feedback: "คำตอบสั้นจบที่ wasn't ถ้าตอบยาวต้องเป็น I wasn't sleeping" }
    hints:
      - "ตอบสั้นใช้กริยาช่วยตัวเดียวกับคำถาม"
      - "I + wasn't"
    solution: "***No, I wasn't.*** (รูปเต็ม *No, I was not.*)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.past-continuous.p013
    topics: [english.grammar.past-continuous]
    difficulty: 4
    type: text
    stem: "เติมคำเดียวให้เป็นคำถาม: *___ they playing football at five o'clock yesterday?*"
    accepted: ["Were"]
    misconceptions:
      - { match: "Was", feedback: "they ใช้ were" }
      - { match: "Did", feedback: "หลังช่องว่างเป็น V-ing (playing) ต้องใช้ Were ไม่ใช่ Did" }
      - { match: "Are", feedback: "yesterday เป็นอดีต ใช้ Were" }
    hints:
      - "คำถาม past continuous ย้าย was/were ไว้หน้าประธาน"
      - "they ใช้ was หรือ were"
    solution: "***Were** they playing football at five o'clock yesterday?*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.past-continuous.p014
    topics: [english.grammar.past-continuous]
    difficulty: 4
    type: mcq
    stem: "ประโยคใดถูกต้อง"
    choices:
      - { id: a, text: "When the teacher asked the question, I knew the answer.", correct: true, feedback: "ถูก know เป็นกริยาบอกสภาวะ ใช้ past simple: knew" }
      - { id: b, text: "When the teacher asked the question, I was knowing the answer.", feedback: "know ไม่ใช้รูป -ing" }
      - { id: c, text: "When the teacher was ask the question, I knew the answer.", feedback: "was ask ผิด ใช้ asked หรือ was asking" }
      - { id: d, text: "When the teacher asked the question, I was knew the answer.", feedback: "was + กริยาช่อง 2 ใช้ไม่ได้" }
    hints:
      - "กริยา know like want ไม่ใช้รูป -ing"
      - "ตรวจว่าหลัง was มี V-ing ทุกครั้ง"
    solution: "***When the teacher asked the question, I knew the answer.***"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.past-continuous.p015
    topics: [english.grammar.past-continuous]
    difficulty: 4
    type: order
    stem: "เรียงประโยคให้เป็นเรื่องเล่าวันสงกรานต์ (ฉาก → เหตุการณ์ → ความรู้สึก)"
    items:
      - "It was a hot afternoon during Songkran in Chiang Mai."
      - "People were throwing water and music was playing."
      - "Suddenly, a little boy fell over in front of me."
      - "I helped him up and took him to his mother."
      - "I felt happy because he was OK."
    hints:
      - "เปิดเรื่องด้วยเวลาและสถานที่ ตามด้วยฉาก (past continuous)"
      - "Suddenly บอกเหตุการณ์ที่แทรกเข้ามา ความรู้สึกอยู่ท้ายเรื่อง"
    solution: "เวลาและสถานที่ → ฉาก (were throwing, was playing) → เหตุการณ์ (fell over) → การกระทำต่อมา (helped, took) → ความรู้สึกและเหตุผล (felt happy because ...)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.past-continuous.p016
    topics: [english.grammar.past-continuous]
    difficulty: 5
    type: mcq
    stem: "ข้อใดบอกความรู้สึกต่อเหตุการณ์พร้อมเหตุผล และใช้ไวยากรณ์ถูกต้องทั้งประโยค"
    choices:
      - { id: a, text: "I was scared because the lights went out while we were watching a horror film.", correct: true, feedback: "ถูก บอกความรู้สึก (scared) เหตุผล (because ...) และใช้ while + past continuous ถูก" }
      - { id: b, text: "I was scared because the lights were go out while we watched a horror film.", feedback: "were go ผิด เหตุการณ์สั้นใช้ went out" }
      - { id: c, text: "I scared because the lights went out while we were watching a horror film.", feedback: "ขาด was: I was scared" }
      - { id: d, text: "I was scared because the lights went out while we was watching a horror film.", feedback: "we ใช้ were ไม่ใช่ was" }
    hints:
      - "ตรวจทุกกริยา: was/were ตรงกับประธานไหม หลัง was/were มี V-ing ไหม"
      - "ความรู้สึก: I was + adjective"
    solution: "***I was scared because the lights went out while we were watching a horror film.***"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.past-continuous.p017
    topics: [english.grammar.past-continuous]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "ดูตาราง ประโยคใดถูกต้องทั้งข้อมูลและไวยากรณ์ (เลือกทุกข้อที่ถูก)"
    figure: { src: last-night-table.svg, alt: "ตาราง Last night: What were they doing? คอลัมน์ Name, 7:00 – 8:00 p.m., 8:00 – 9:00 p.m. Grandma: watching TV, sleeping. Dad: cooking dinner, washing the dishes. Mum: reading the news, talking on the phone. Mook: doing her homework, playing the guitar. Ben: playing football, taking a shower." }
    choices:
      - { id: a, text: "At 7:30 p.m., Dad was cooking dinner.", correct: true, feedback: "ถูก ตรงกับตารางและไวยากรณ์ถูก" }
      - { id: b, text: "At 8:30 p.m., Ben was taking a shower.", correct: true, feedback: "ถูก ตรงกับตาราง" }
      - { id: c, text: "At 7:30 p.m., Mum was talking on the phone.", feedback: "ตอน 7:30 Mum กำลังอ่านข่าว (reading the news)" }
      - { id: d, text: "At 8:30 p.m., Grandma were sleeping.", feedback: "ข้อมูลถูก แต่ Grandma (she) ใช้ was" }
      - { id: e, text: "While Grandma was watching TV, Ben was playing football.", correct: true, feedback: "ถูก ทั้งสองอยู่ในช่วง 7:00 – 8:00 p.m. พร้อมกัน" }
    hints:
      - "ตรวจทั้งเวลาในตารางและ was/were"
      - "while ใช้กับสองการกระทำที่เกิดพร้อมกัน"
    solution: "ถูก: **a**, **b**, **e** · ข้อ c ข้อมูลผิดช่วงเวลา · ข้อ d ต้องเป็น Grandma was sleeping"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.past-continuous.p018
    topics: [english.grammar.past-continuous]
    difficulty: 5
    type: text
    stem: "รวมสองประโยคเป็นประโยคเดียวด้วย when หรือ while แล้วพิมพ์ทั้งประโยค: *I was riding my bike in Ayutthaya. I saw an elephant.*"
    accepted: ["I was riding my bike in Ayutthaya when I saw an elephant.", "I was riding my bike in Ayutthaya when I saw an elephant", "While I was riding my bike in Ayutthaya, I saw an elephant.", "While I was riding my bike in Ayutthaya, I saw an elephant", "When I was riding my bike in Ayutthaya, I saw an elephant.", "When I was riding my bike in Ayutthaya, I saw an elephant", "I saw an elephant while I was riding my bike in Ayutthaya.", "I saw an elephant while I was riding my bike in Ayutthaya", "I saw an elephant when I was riding my bike in Ayutthaya.", "I saw an elephant when I was riding my bike in Ayutthaya", "While I was riding my bike in Ayutthaya I saw an elephant.", "When I was riding my bike in Ayutthaya I saw an elephant."]
    misconceptions:
      - { match: "I rode my bike in Ayutthaya when I saw an elephant.", feedback: "การปั่นจักรยานเป็นการกระทำยาวที่กำลังเกิด ต้องคง was riding" }
      - { match: "I was riding my bike in Ayutthaya while I saw an elephant.", feedback: "while มักตามด้วยการกระทำที่ยาว เหตุการณ์สั้น (saw) ใช้ when" }
      - { match: "While I was riding my bike in Ayutthaya, I was seeing an elephant.", feedback: "เห็นช้างเป็นเหตุการณ์สั้น ใช้ past simple: saw" }
    hints:
      - "การกระทำยาว (was riding) + when + เหตุการณ์สั้น (saw)"
      - "ถ้าขึ้นต้นด้วย While ให้ใส่จุลภาคก่อนประโยคที่สอง"
    solution: "***I was riding my bike in Ayutthaya when I saw an elephant.*** หรือ ***While I was riding my bike in Ayutthaya, I saw an elephant.***"
    license: CC-BY-SA-4.0
    ai_assisted: true
