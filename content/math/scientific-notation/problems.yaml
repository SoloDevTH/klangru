    ai_assisted: true

  - id: math.sci.p018
    topics: [math.number.scientific-notation]
    difficulty: 4
    type: numeric
    stem: "แสงเดินทางด้วยอัตราเร็ว $3 \\times 10^{8}\\ \\mathrm{m/s}$ ระยะจากดวงอาทิตย์ถึงโลกประมาณ $1.5 \\times 10^{11}\\ \\mathrm{m}$ แสงแดดที่ตกกระทบนาข้าวเมื่อครู่นี้ออกจากดวงอาทิตย์มาแล้วกี่วินาที (ตอบในหน่วยวินาที)"
    answer: { value: 500, unit: s }
    hints:
      - "เวลา = ระยะทาง ÷ อัตราเร็ว"
      - "หารสัมประสิทธิ์ $\\tfrac{1.5}{3}$ และลบเลขชี้กำลัง $11 - 8$ แล้วปรับรูป"
    misconceptions:
      - { match: 0.002, feedback: "หารกลับด้าน ($\\tfrac{3 \\times 10^8}{1.5 \\times 10^{11}}$) เวลาต้องเป็นระยะทางหารด้วยอัตราเร็ว" }
      - { match: 5000, feedback: "$0.5 \\times 10^{3} = 5 \\times 10^{2}$ ไม่ใช่ $5 \\times 10^{3}$ เมื่อสัมประสิทธิ์ใหญ่ขึ้น 10 เท่า เลขชี้กำลังต้องลดลง 1" }
    solution: "$\\dfrac{1.5 \\times 10^{11}}{3 \\times 10^{8}} = 0.5 \\times 10^{3} = 5 \\times 10^{2} = 500$ วินาที (ประมาณ 8 นาที 20 วินาที)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.sci.p019
    topics: [math.number.scientific-notation]
    difficulty: 3
    type: mcq
    stem: "นักเรียนหารตัวเลขด้วยเครื่องคิดเลขแล้วหน้าจอแสดงดังภาพ ค่านี้เท่ากับข้อใด"
    figure: { src: calculator-e-notation.svg, alt: "หน้าจอเครื่องคิดเลขแสดงข้อความ 4.2E-5" }
    choices:
      - { id: a, text: "$0.000042$", correct: true }
      - { id: b, text: "$4.2^{-5}$", feedback: "E ไม่ได้หมายถึงยกกำลังของ 4.2 แต่หมายถึง \"คูณ 10 ยกกำลัง\"" }
      - { id: c, text: "$-420{,}000$", feedback: "เลขชี้กำลังลบไม่ได้ทำให้จำนวนติดลบ และเลื่อนจุดผิดทิศ $10^{-5}$ ทำให้จำนวนเล็กลง" }
      - { id: d, text: "$0.0000042$", feedback: "เลื่อนจุดไป 6 ตำแหน่ง $10^{-5}$ ต้องเลื่อนไปทางซ้าย 5 ตำแหน่ง" }
    hints:
      - "E บนเครื่องคิดเลขอ่านว่า \"คูณ 10 ยกกำลัง\""
      - "$4.2 \\times 10^{-5}$ เลื่อนจุดไปทางซ้าย 5 ตำแหน่ง"
    solution: "$4.2\\mathrm{E}{-5} = 4.2 \\times 10^{-5} = 0.000042$"
