id: physics.electricity.simple-circuits
subject: physics
title: { th: วงจรไฟฟ้าอย่างง่าย, en: Simple electric circuits }
summary: ส่วนประกอบของวงจรไฟฟ้า วงจรปิดและวงจรเปิด การเขียนแผนภาพวงจร การต่อเซลล์ไฟฟ้าแบบอนุกรม และการต่อหลอดไฟแบบอนุกรมกับแบบขนาน
difficulty: 2
minutes: 30
prerequisites: [physics.energy.energy-electricity-intro]
encompasses:
  - { id: physics.energy.energy-electricity-intro, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: จากของจริงเป็นแผนภาพวงจร
    src: picture-diagram.svg
    alt: "ภาพซ้ายเป็นของจริง ถ่านไฟฉายวางนอน มีขั้วลบอยู่ซ้าย ขั้วบวกอยู่ขวา สายไฟสีแดงจากขั้วบวกไปที่สวิตช์ จากสวิตช์มีสายสีแดงไปที่หลอดไฟ และสายสีดำจากหลอดไฟกลับมาที่ขั้วลบ ภาพขวาเป็นแผนภาพวงจรของวงจรเดียวกัน เป็นสี่เหลี่ยม เส้นด้านบนมีสัญลักษณ์หลอดไฟ (วงกลมมีกากบาท) ด้านขวามีสัญลักษณ์สวิตช์ที่ยกขึ้น ด้านล่างมีสัญลักษณ์เซลล์ไฟฟ้า (เส้นยาวกับเส้นสั้นหนา) ด้านซ้ายเป็นสายไฟ"
    caption: "แผนภาพวงจรใช้สัญลักษณ์แทนของจริง สายไฟเขียนเป็นเส้นตรง สวิตช์ในภาพเปิดอยู่ หลอดไฟจึงยังไม่สว่าง"
  - type: worked-example
    title: ไฟฉายไม่สว่าง หาสาเหตุ
    problem: "ไฟฉายใส่ถ่าน 1.5 V สองก้อน กดสวิตช์แล้วไม่สว่าง พบว่าก้อนที่สองใส่ให้ขั้วบวกชนขั้วบวก ความต่างศักย์รวมเป็นเท่าไร และต้องแก้อย่างไร"
    steps:
      - text: "ถ้าใส่ถูก (ขั้วบวกต่อขั้วลบ) ความต่างศักย์รวมเป็น 1.5 + 1.5 = 3 V"
      - text: "ก้อนที่ใส่กลับด้านดันสวนทางกับก้อนแรก ความต่างศักย์จึงหักล้างกัน 1.5 − 1.5 = 0 V"
        why: "ถ่านแต่ละก้อนดันกระแสออกจากขั้วบวก ถ้าหันขั้วบวกเข้าหากัน แรงดันจะสวนทางกัน"
      - text: "กลับก้อนที่สองให้ขั้วบวกของก้อนแรกแตะขั้วลบของก้อนที่สอง ตามเครื่องหมายในช่องใส่ถ่าน"
    answer: "ใส่ผิดได้ 0 V หลอดจึงไม่สว่าง เมื่อใส่ถูกได้ 3 V"
  - { type: check, problem: physics.electricity.simple-circuits.p005, prompt: "ลองรวมความต่างศักย์ของถ่านที่ต่ออนุกรม" }
  - type: figure
    title: หลอดไฟต่อแบบอนุกรมและแบบขนาน
    src: series-parallel.svg
    alt: "แผนภาพวงจรสองวงจร วงจร ก ต่อแบบอนุกรม หลอดไฟ A และ B อยู่บนสายเส้นเดียวกันเรียงกัน แล้วกลับมาที่แบตเตอรี่ ทางเดินของกระแสมีทางเดียว วงจร ข ต่อแบบขนาน หลอด A อยู่สายด้านบน หลอด B อยู่สายที่แยกออกมาตรงกลาง สองทางรวมกันที่จุดต่อทั้งสองข้าง แล้วกลับมาที่แบตเตอรี่ แยกเป็นสองทาง ทางละหนึ่งดวง"
    caption: "อนุกรม: หลอดหนึ่งขาด ดับหมด ขนาน: หลอดหนึ่งขาด อีกหลอดยังสว่าง"
  - type: figure
    title: ใส่ถ่านให้ถูกด้าน
    src: cells-series.svg
    alt: "ภาพซ้าย ถ่านสองก้อนวางเรียงกัน ขั้วบวกของก้อนแรกแตะขั้วลบของก้อนที่สอง เขียนว่ารวมกันได้ 1.5 V + 1.5 V = 3 V ภาพขวา ถ่านก้อนที่สองหันกลับ ขั้วบวกชนขั้วบวก เขียนว่าหักล้างกัน หลอดไฟไม่สว่าง"
  - type: worked-example
    title: หลอดไฟดวงไหนสว่าง
    problem: "วงจรมีแบตเตอรี่ หลอด A อยู่ทางหลัก แล้วแยกเป็นสองทาง ทางที่ 1 มีหลอด B ทางที่ 2 มีสวิตช์ S ต่อกับหลอด C ถ้าปิดสวิตช์ S แล้วไส้หลอด B ขาด หลอดใดสว่าง"
    steps:
      - text: "ไล่ทางเดินของกระแสจากแบตเตอรี่ ผ่านหลอด A ไปถึงจุดแยก"
      - text: "ทางที่ 1 ขาดเพราะไส้หลอด B ขาด กระแสผ่านทางนี้ไม่ได้ B ดับ"
      - text: "ทางที่ 2 สวิตช์ S ปิดอยู่ ทางนี้ครบรอบ กระแสผ่านหลอด C แล้วกลับแบตเตอรี่"
        why: "ทางแยกที่ต่อขนานกันทำงานแยกกัน ทางหนึ่งขาดไม่ทำให้อีกทางขาด"
      - text: "กระแสที่ผ่าน C ต้องผ่าน A ก่อน หลอด A จึงสว่างด้วย"
    answer: "หลอด A และ C สว่าง หลอด B ดับ"
  - { type: check, problem: physics.electricity.simple-circuits.p011, prompt: "ไล่ทางเดินของกระแสในวงจรที่มีทางแยก" }
  - type: simulation
    title: "ต่อวงจรเอง (PhET Circuit Construction Kit: DC)"
    url: https://phet.colorado.edu/en/simulations/circuit-construction-kit-dc
    provider: phet
    note: "เลือกหน้า Intro ลากถ่าน สายไฟ หลอดไฟ และสวิตช์มาต่อให้ครบรอบ ลองต่อถ่านเพิ่มแบบอนุกรมแล้วดูว่าหลอดสว่างขึ้นไหม จากนั้นต่อหลอดสองดวงแบบอนุกรมและแบบขนาน แล้วลองตัดสายที่หลอดดวงหนึ่ง (คลิกขวาที่จุดต่อ) ดูว่าอีกดวงยังสว่างหรือไม่ กดปุ่มแผนภาพ (Schematic) เพื่อดูวงจรเป็นสัญลักษณ์"
glossary:
  - { term: วงจรไฟฟ้า, definition: "ทางเดินของกระแสไฟฟ้าที่ต่อจากขั้วบวกของแหล่งกำเนิดไฟฟ้า ผ่านเครื่องใช้ไฟฟ้า แล้วกลับมาที่ขั้วลบ" }
  - { term: เซลล์ไฟฟ้า, definition: "แหล่งกำเนิดไฟฟ้าขนาดเล็ก เช่น ถ่านไฟฉาย มีขั้วบวกและขั้วลบ ถ่านไฟฉายหนึ่งก้อนมีค่า 1.5 V" }
  - { term: วงจรปิด, definition: "วงจรที่ทางเดินของกระแสต่อกันครบรอบ กระแสไหลได้" }
  - { term: วงจรเปิด, definition: "วงจรที่ทางเดินของกระแสขาดตรงใดตรงหนึ่ง กระแสไหลไม่ได้" }
  - { term: การต่อแบบอนุกรม, definition: "การต่อเรียงกันเป็นทางเดียว เซลล์ไฟฟ้าต่ออนุกรมให้ขั้วบวกต่อกับขั้วลบ ความต่างศักย์จึงรวมกัน" }
  - { term: การต่อแบบขนาน, definition: "การต่อที่แยกทางเดินของกระแสออกเป็นหลายทาง แต่ละทางทำงานแยกกัน" }
  - { term: แผนภาพวงจรไฟฟ้า, definition: "ภาพที่ใช้สัญลักษณ์แทนส่วนประกอบของวงจร และใช้เส้นตรงแทนสายไฟ" }
flashcards:
  - { front: "วงจรไฟฟ้าอย่างง่ายมีส่วนประกอบอะไรบ้าง", back: "แหล่งกำเนิดไฟฟ้า สายไฟ สวิตช์ และเครื่องใช้ไฟฟ้า เช่น หลอดไฟ" }
  - { front: "ปิดสวิตช์หรือเปิดสวิตช์ที่ทำให้หลอดไฟสว่าง", back: "ปิดสวิตช์ (วางสะพานลง) วงจรครบรอบ หลอดไฟสว่าง" }
  - { front: "ถ่าน 1.5 V สามก้อนต่ออนุกรมได้กี่โวลต์", back: "4.5 V (1.5 + 1.5 + 1.5)" }
  - { front: "ต่อหลอดไฟอนุกรม หลอดหนึ่งขาดเกิดอะไรขึ้น", back: "ดับหมดทุกหลอด เพราะทางเดินของกระแสมีทางเดียว" }
  - { front: "ทำไมไฟในบ้านต่อแบบขนาน", back: "เปิดปิดแต่ละเครื่องแยกกันได้ และเครื่องหนึ่งเสีย เครื่องอื่นยังทำงาน" }
