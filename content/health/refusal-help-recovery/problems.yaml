problems:
- id: health.substances.refusal-help-recovery.p001
  topics:
  - health.substances.refusal-help-recovery
  difficulty: 1
  type: match
  stem: จับคู่หมายเลขสายด่วนกับบริการ
  pairs:
  - left: '1165'
    right: ปรึกษาการบำบัดยาเสพติด 24 ชั่วโมง
  - left: '1600'
    right: สายเลิกบุหรี่ ฟรีทุกเครือข่าย
  - left: '1413'
    right: สายด่วนเลิกเหล้า
  - left: '1323'
    right: สายด่วนสุขภาพจิต
  - left: '1669'
    right: เจ็บป่วยฉุกเฉิน เช่น หมดสติ หายใจผิดปกติ
  hints:
  - 1669 เป็นเบอร์ฉุกเฉินทางการแพทย์
  - เบอร์เลิกบุหรี่ขึ้นต้นด้วย 16
  solution: 1165 บำบัดยาเสพติด 1600 เลิกบุหรี่ 1413 เลิกเหล้า 1323 สุขภาพจิต 1669 เหตุฉุกเฉินทางการแพทย์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.refusal-help-recovery.p002
  topics:
  - health.substances.refusal-help-recovery
  difficulty: 1
  type: mcq
  stem: รุ่นพี่ชวนดื่มเบียร์หลังเลิกเรียน ปอตอบว่า "ไม่ล่ะ ไปกินน้ำแข็งใสหน้าโรงเรียนกันดีกว่า" ปอใช้เทคนิคการปฏิเสธแบบใด
  choices:
  - id: a
    text: เสนอทางเลือก
    correct: true
  - id: b
    text: ผัดผ่อน
    feedback: ผัดผ่อนคือขอเลื่อนหรือขอตัว เช่น แม่โทรตามแล้ว
  - id: c
    text: ขอความช่วยเหลือ
    feedback: ปอไม่ได้บอกผู้ใหญ่
  - id: d
    text: ปฏิเสธโดยไม่พูดอะไร
    feedback: ปอพูดชัดและเสนอกิจกรรมอื่น
  hints:
  - ดูส่วนที่สองของประโยค
  - ปอชวนทำอะไรแทน
  solution: ปอปฏิเสธแล้วเสนอกิจกรรมที่ปลอดภัยแทน เป็นเทคนิคเสนอทางเลือก ซึ่งช่วยรักษาความสัมพันธ์กับรุ่นพี่
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.refusal-help-recovery.p003
  topics:
  - health.substances.refusal-help-recovery
  difficulty: 2
  type: mcq
  stem: ข้อใดเป็นประโยคชวนเพื่อนให้เลิกบุหรี่ไฟฟ้าที่ **เหมาะสมที่สุด**
  choices:
  - id: a
    text: '"เราเป็นห่วงนะ ช่วงนี้เห็นนายไอบ่อยและวิ่งไม่ไหว ถ้าอยากลองเลิก เราช่วยหาข้อมูลกับโทร 1600 ด้วยกันได้"'
    correct: true
  - id: b
    text: '"นายมันติดงอมแงม น่าอายจริง ๆ"'
    feedback: การตีตราทำให้อายและปิดบัง
  - id: c
    text: '"ถ้าไม่เลิกจะไปฟ้องครูให้ทั้งโรงเรียนรู้"'
    feedback: การขู่และประจานทำลายความไว้ใจ
  - id: d
    text: '"สูบไปเถอะ ไม่ใช่เรื่องของเรา"'
    feedback: เพื่อนช่วยได้มาก การชวนอย่างห่วงใยเป็นปัจจัยปกป้อง
  hints:
  - ขึ้นต้นด้วยความรู้สึกของเรา
  - บอกสิ่งที่เห็นจริงและเสนอความช่วยเหลือ
  solution: ประโยคที่ดีขึ้นต้นด้วยความห่วงใยของเรา บอกสิ่งที่เห็นโดยไม่ตัดสิน และเสนอช่วยอย่างเป็นรูปธรรม เช่น โทร 1600 ด้วยกัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.refusal-help-recovery.p004
  topics:
  - health.substances.refusal-help-recovery
  difficulty: 2
  type: order
  stem: เรียงขั้นตอนการบำบัดและฟื้นฟูผู้ติดยาเสพติดตามที่ สบยช. อธิบาย
  items:
  - คัดกรองและประเมินโรคร่วม
  - บำบัดด้วยยา
  - ฟื้นฟูราว 4–6 เดือน
  - ติดตามต่อเนื่องอย่างน้อย 1 ปี
  hints:
  - ต้องประเมินก่อนรักษา
  - การติดตามทำหลังกลับสู่ชุมชนแล้ว
  solution: คัดกรองและประเมิน → บำบัดด้วยยา → ฟื้นฟู → ติดตามต่อเนื่อง และประสานให้กลับคืนสู่สังคม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.refusal-help-recovery.p005
  topics:
  - health.substances.refusal-help-recovery
  difficulty: 2
  type: mcq
  stem: ระหว่างรอรถหน้าตลาด ชายที่ไม่รู้จักเสนอเงิน 500 บาทให้เก่ง (อายุ 14 ปี) นำห่อของที่ปิดมิดชิดไปส่งที่ร้านเกมในซอย เก่งควรทำอย่างไร
  choices:
  - id: a
    text: ปฏิเสธชัดเจน ไม่รับห่อ เดินไปที่มีคนเยอะ แล้วบอกผู้ปกครองหรือครู
    correct: true
  - id: b
    text: รับไปส่งเพราะไม่ได้เปิดดูจึงไม่ผิด
    feedback: ถ้าในห่อเป็นยาเสพติด ผู้ส่งอาจถูกดำเนินคดีฐานจำหน่ายหรือครอบครอง
  - id: c
    text: รับห่อแล้วเปิดดูก่อนว่ามีอะไร
    feedback: การจับต้องห่อทำให้ตัวเองเสี่ยง และอาจเป็นอันตราย
  - id: d
    text: ตามชายคนนั้นไปถามเหตุผล
    feedback: การเข้าไปใกล้คนแปลกหน้าที่เสนอเงินเป็นสถานการณ์เสี่ยง
  hints:
  - งานง่ายได้เงินมากจากคนแปลกหน้าเป็นสัญญาณเตือน
  - ใครช่วยเก่งได้
  solution: ขบวนการค้ายาเสพติดมักจ้างเด็กส่งของ ผู้ส่งอาจถูกดำเนินคดีแม้ไม่รู้ว่าข้างในคืออะไร จึงต้องปฏิเสธ ไม่รับห่อ ไปที่ปลอดภัย และบอกผู้ใหญ่ให้แจ้งตำรวจ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.refusal-help-recovery.p006
  topics:
  - health.substances.refusal-help-recovery
  difficulty: 2
  type: match
  stem: จับคู่คำพูดของผู้ที่ใช้สารเสพติดกับช่วงของการเปลี่ยนพฤติกรรม
  pairs:
  - left: '"ไม่เห็นเป็นไร ใคร ๆ ก็ใช้"'
    right: ยังไม่คิดจะเลิก
  - left: '"บางทีก็อยากเลิกนะ แต่ไม่รู้จะไหวไหม"'
    right: ลังเล
  - left: '"เดือนหน้าจะไปปรึกษาที่โรงพยาบาลชุมชน"'
    right: เตรียมตัว
  - left: '"สัปดาห์นี้เริ่มเข้าโปรแกรมบำบัดแล้ว"'
    right: ลงมือเลิก
  - left: '"เลิกมาได้ 8 เดือน ตอนนี้ไปซ้อมบอลแทน"'
    right: รักษาการเลิกไว้
  hints:
  - ดูว่าเขายังไม่เห็นปัญหา กำลังชั่งใจ วางแผน หรือทำแล้ว
  - ช่วงสุดท้ายคือรักษาสิ่งที่ทำได้ไว้นาน ๆ
  solution: ไม่เห็นปัญหา = ยังไม่คิดจะเลิก, อยากแต่ไม่แน่ใจ = ลังเล, มีแผน = เตรียมตัว, เริ่มบำบัด = ลงมือ, เลิกได้นานและมีกิจกรรมทดแทน = รักษาการเลิกไว้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.refusal-help-recovery.p007
  topics:
  - health.substances.refusal-help-recovery
  difficulty: 3
  type: mcq
  stem: ประมวลกฎหมายยาเสพติดที่ใช้ตั้งแต่ 9 ธันวาคม 2564 มองผู้เสพอย่างไร (ข้อมูล ณ ตุลาคม 2569)
  choices:
  - id: a
    text: เป็นผู้ป่วยที่ควรได้รับการบำบัดรักษา
    correct: true
  - id: b
    text: เป็นอาชญากรที่ต้องจำคุกทุกกรณี
    feedback: กฎหมายฉบับนี้เน้นนำผู้เสพเข้าสู่การบำบัด
  - id: c
    text: การเสพไม่ผิดกฎหมายแล้ว
    feedback: การเสพและครอบครองยังเป็นความผิด แต่มีทางเลือกเข้ารับการบำบัด
  - id: d
    text: ผู้เสพกับผู้ค้ามีโทษเท่ากัน
    feedback: การจำหน่าย ผลิต และนำเข้ามีโทษหนักกว่ามาก
  hints:
  - กฎหมายใหม่แยกผู้เสพกับผู้ค้า
  - แนวคิดคือรักษามากกว่าลงโทษ
  solution: ประมวลกฎหมายยาเสพติดมองว่าผู้เสพคือผู้ป่วย เน้นการบำบัด ส่วนผู้ผลิต นำเข้า และจำหน่ายมีโทษหนักและอาจถูกยึดทรัพย์สิน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.refusal-help-recovery.p008
  topics:
  - health.substances.refusal-help-recovery
  difficulty: 3
  type: numeric
  stem: ตามที่ สบยช. อธิบาย ช่วงฟื้นฟูใช้เวลาราว 4–6 เดือน และติดตามต่อเนื่องอย่างน้อย 1 ปี ถ้าฟื้นฟูใช้เวลาสั้นที่สุด ช่วงฟื้นฟูรวมกับการติดตามใช้เวลาอย่างน้อยกี่เดือน
  answer:
    value: 16
    unit: เดือน
  misconceptions:
  - match: 5
    feedback: ต้องแปลง 1 ปีเป็น 12 เดือนก่อนบวก
  - match: 18
    feedback: คำถามให้ใช้เวลาฟื้นฟูสั้นที่สุด คือ 4 เดือน
  hints:
  - ใช้ค่าต่ำสุดของการฟื้นฟูคือ 4 เดือน
  - 1 ปีเท่ากับ 12 เดือน
  solution: $4 + 12 = 16$ เดือน การเลิกสารเสพติดเป็นการดูแลระยะยาว ครอบครัวและชุมชนจึงสำคัญมาก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.refusal-help-recovery.p009
  topics:
  - health.substances.refusal-help-recovery
  difficulty: 3
  type: mcq
  stem: ข้อใดเป็นปัจจัยที่ช่วยให้ผู้ผ่านการบำบัดเลิกได้ต่อเนื่อง (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: ครอบครัวเข้าใจและให้กำลังใจ
    correct: true
    feedback: ถูก
  - id: b
    text: มีงานหรือได้กลับไปเรียน
    correct: true
    feedback: ถูก
  - id: c
    text: ชุมชนยอมรับ ไม่ตีตรา
    correct: true
    feedback: ถูก
  - id: d
    text: กลับไปอยู่กับกลุ่มเพื่อนที่ยังใช้
    feedback: เพิ่มโอกาสกลับไปใช้ซ้ำ
  - id: e
    text: ถูกเรียกว่าขี้ยาทุกครั้งที่ออกจากบ้าน
    feedback: การตีตราเป็นสาเหตุสำคัญของการใช้ซ้ำ
  hints:
  - นึกถึงสิ่งที่ทำให้มีที่ยืนในสังคม
  - สบยช. ระบุว่าการถูกตีตราและไม่มีงานทำทำให้ใช้ซ้ำ
  solution: ปัจจัยที่ช่วย ได้แก่ ครอบครัว งานหรือการเรียน และชุมชนที่ยอมรับ ส่วนเพื่อนที่ยังใช้และการตีตราทำให้เสี่ยงกลับไปใช้ซ้ำ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.refusal-help-recovery.p010
  topics:
  - health.substances.refusal-help-recovery
  difficulty: 3
  type: mcq
  stem: พี่ชายของฝ้ายผ่านการบำบัดยาบ้ามา 6 เดือน แล้วกลับไปใช้ซ้ำหนึ่งครั้งหลังตกงาน ครอบครัวควรมองเรื่องนี้อย่างไร
  choices:
  - id: a
    text: เป็นสัญญาณให้กลับไปรับคำปรึกษาอีกครั้ง การติดเป็นโรคเรื้อรังที่กลับเป็นซ้ำได้ และยังเลิกได้
    correct: true
  - id: b
    text: แปลว่าการบำบัดล้มเหลวถาวร ไม่ต้องพยายามอีก
    feedback: การใช้ซ้ำพบได้บ่อยในโรคเรื้อรัง ไม่ใช่จุดจบ
  - id: c
    text: ไล่ออกจากบ้านเพื่อให้รู้สำนึก
    feedback: การตัดขาดเพิ่มปัจจัยเสี่ยงและทำให้เขาไม่มีที่พึ่ง
  - id: d
    text: ปิดเป็นความลับ ไม่ต้องปรึกษาใคร
    feedback: การปรึกษา 1165 หรือโรงพยาบาลช่วยวางแผนดูแลได้ดีกว่า
  hints:
  - การติดเป็นโรคแบบไหน
  - การตกงานเป็นปัจจัยอะไร
  solution: การใช้ซ้ำเป็นเรื่องที่เกิดได้ในโรคเรื้อรังของสมอง ครอบครัวควรสนับสนุนให้กลับไปรับการรักษา ปรึกษา 1165 และช่วยแก้ปัจจัยกระตุ้น เช่น การตกงาน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.refusal-help-recovery.p011
  topics:
  - health.substances.refusal-help-recovery
  difficulty: 4
  type: mcq
  stem: ข้อใดเป็นผลกระทบของการค้ายาเสพติดในระดับ **ชุมชนและสังคม** (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: อาชญากรรมและความรุนแรงในชุมชนเพิ่มขึ้น
    correct: true
    feedback: ถูก
  - id: b
    text: อุบัติเหตุจากผู้ที่ขับรถขณะเมายา
    correct: true
    feedback: ถูก
  - id: c
    text: ผู้คนรู้สึกไม่ปลอดภัย เด็กถูกชักชวนง่าย
    correct: true
    feedback: ถูก
  - id: d
    text: ผู้ค้ามีประวัติคดีและถูกจำคุก
    feedback: เป็นผลต่อตัวผู้กระทำ
  - id: e
    text: รัฐใช้งบประมาณบำบัดและปราบปรามสูง
    feedback: เป็นผลระดับประเทศ
  hints:
  - แยกระดับตนเอง ครอบครัว ชุมชน ประเทศ
  - ชุมชนคือคนที่อยู่รอบ ๆ ในพื้นที่
  solution: ระดับชุมชนและสังคม ได้แก่ อาชญากรรม ความรุนแรง อุบัติเหตุ และความไม่ปลอดภัย ส่วนประวัติคดีเป็นผลต่อตัวผู้กระทำ และงบประมาณเป็นผลระดับประเทศ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.refusal-help-recovery.p012
  topics:
  - health.substances.refusal-help-recovery
  difficulty: 4
  type: numeric
  stem: สบยช. ระบุว่าแต่ละปีมีผู้เข้ารับการบำบัดยาเสพติดทั่วประเทศกว่า 220,000 คน เฉลี่ยวันละประมาณกี่คน (ใช้ 1 ปี = 365 วัน ตอบทศนิยม 1 ตำแหน่ง)
  answer:
    value: 602.7
    tolerance: 1
    unit: คน/วัน
  misconceptions:
  - match: 18333.3
