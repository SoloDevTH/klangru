problems:
- id: thai.writing.special-spellings.p001
  topics:
  - thai.writing.special-spellings
  difficulty: 1
  type: mcq
  stem: คำใดเป็น **คำควบกล้ำแท้** (ออกเสียงพยัญชนะต้นทั้งสองตัว)
  choices:
  - id: a
    text: ปลา
    correct: true
    feedback: ถูก ออกเสียง ป และ ล พร้อมกัน
  - id: b
    text: จริง
    feedback: จร เป็นควบกล้ำไม่แท้ อ่าน จิง
  - id: c
    text: ทราย
    feedback: ทร ออกเสียงเป็น ซ
  - id: d
    text: หมา
    feedback: ห นำ ม เป็นอักษรนำ ไม่ใช่ควบกล้ำ
  hints:
  - ควบกล้ำแท้ตัวหลังเป็น ร ล ว และออกเสียงทั้งสองตัว
  - ลองอ่านช้า ๆ ว่าได้ยินทั้งสองเสียงไหม
  solution: '**ปลา** ออกเสียง ป กับ ล พร้อมกัน เป็นควบกล้ำแท้'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.special-spellings.p002
  topics:
  - thai.writing.special-spellings
  difficulty: 1
  type: mcq
  stem: คำใด **สะกดถูก** ตามพจนานุกรมฉบับราชบัณฑิตยสถาน
  choices:
  - id: a
    text: อนุญาต
    correct: true
    feedback: ถูก
  - id: b
    text: อนุญาติ
    feedback: เติมสระอิเกิน
  - id: c
    text: อนุญาตย์
    feedback: ไม่มีการันต์
  - id: d
    text: อนุยาต
    feedback: ใช้ ญ ไม่ใช่ ย
  hints:
  - คำนี้แปลว่า ยินยอม
  - ท้ายคำเป็น ต ไม่มีสระ
  solution: เขียนว่า **อนุญาต**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.special-spellings.p003
  topics:
  - thai.writing.special-spellings
  difficulty: 2
  type: match
  stem: จับคู่คำกับคำอ่าน
  pairs:
  - left: ทราบ
    right: ซาบ
  - left: สร้าง
    right: ส้าง
  - left: ขนม
    right: ขะ-หนม
  - left: ชนิด
    right: ชะ-นิด
  hints:
  - ทร อ่านเป็น ซ ส่วน สร ไม่ออกเสียง ร
  - ข เป็นอักษรสูงนำ น ส่วน ช เป็นอักษรต่ำ ไม่นำ
  solution: ทราบ = ซาบ · สร้าง = ส้าง · ขนม = ขะ-หนม (อักษรนำ) · ชนิด = ชะ-นิด (ไม่เป็นอักษรนำ)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.special-spellings.p004
  topics:
  - thai.writing.special-spellings
  difficulty: 2
  type: mcq
  stem: คำใด **ไม่มี** ตัวการันต์
  choices:
  - id: a
    text: ผูกพัน
    correct: true
    feedback: ถูก ผูกพัน ไม่มีการันต์ (ไม่ใช่ ผูกพันธ์)
  - id: b
    text: สัตว์
    feedback: มี ว์ เป็นการันต์
  - id: c
    text: จันทร์
    feedback: มี ทร์ เป็นการันต์
  - id: d
    text: องค์
    feedback: มี ค์ เป็นการันต์
  hints:
  - การันต์มีเครื่องหมาย ์ กำกับ
  - ระวังคำที่คนมักเติมการันต์เกิน
  solution: '**ผูกพัน** ไม่มีการันต์ คนมักเขียนผิดเป็น ผูกพันธ์'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.special-spellings.p005
  topics:
  - thai.writing.special-spellings
  difficulty: 2
  type: text
  stem: 'เติมคำให้ถูก: "เด็ก ๆ เดินขึ้น ___ ไปชั้นสอง" (คำที่หมายถึงสิ่งที่ทำเป็นขั้น ๆ สำหรับขึ้นลง)'
  accepted:
  - บันได
  misconceptions:
  - match: บรรได
    feedback: บันได เขียนด้วย บัน ไม่ใช่ บรร
  hints:
  - คำนี้ออกเสียง บัน-ได
  - จำว่าใช้ บัน หรือ บรร
  solution: เขียนว่า **บันได**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.special-spellings.p006
  topics:
  - thai.writing.special-spellings
  difficulty: 3
  type: mcq
  stem: ดูป้ายเมนูในภาพ รายการใด **สะกดผิด**
  figure:
    src: menu-board.svg
    alt: 'ป้ายเมนูร้านป้าแดง เมนูวันนี้ 5 รายการ: 1. ข้าวผัดกะเพราไก่ 50 บาท 2. แกงเขียวหวานไก่ 45 บาท 3. ไอศครีมกะทิ 20 บาท 4. ขนมบัวลอย 25 บาท 5. น้ำตะไคร้ 15 บาท'
  choices:
  - id: a
    text: ไอศครีมกะทิ
    correct: true
    feedback: ถูก ต้องเขียน ไอศกรีม (ไม่มี ค)
  - id: b
    text: ข้าวผัดกะเพราไก่
    feedback: กะเพรา เขียนถูกแล้ว
  - id: c
    text: ขนมบัวลอย
    feedback: สะกดถูก
  - id: d
    text: น้ำตะไคร้
    feedback: สะกดถูก
  hints:
  - ตรวจทีละคำกับคำที่มักเขียนผิด
  - คำที่มาจาก ice-cream เขียนอย่างไรตามพจนานุกรม
  solution: '**ไอศครีม** ผิด ต้องเขียน **ไอศกรีม** ส่วน กะเพรา กะทิ ตะไคร้ สะกดถูก'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.special-spellings.p007
  topics:
  - thai.writing.special-spellings
  difficulty: 3
  type: match
  stem: จับคู่คำที่มี ฤ กับคำอ่าน
  pairs:
  - left: ฤดู
    right: รึ-ดู
  - left: ฤทธิ์
    right: ริด
  - left: ฤกษ์
    right: เริก
  - left: ฤๅษี
    right: รือ-สี
  hints:
  - ฤ อ่านได้ รึ ริ เรอ
  - ฤๅ อ่าน รือ
  solution: ฤดู = รึ-ดู · ฤทธิ์ = ริด · ฤกษ์ = เริก · ฤๅษี = รือ-สี
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.special-spellings.p008
  topics:
  - thai.writing.special-spellings
  difficulty: 3
  type: mcq
  stem: คำว่า **บรรจุ** อ่านอย่างไร
  choices:
  - id: a
    text: บัน-จุ
    correct: true
    feedback: ถูก รร ไม่มีตัวสะกด ออกเสียง อัน
  - id: b
    text: บอ-ระ-จุ
    feedback: อ่านตามรูปทีละตัว
  - id: c
    text: บำ-จุ
    feedback: รร + ม จึงอ่าน อำ (เช่น ธรรม) คำนี้ไม่มี ม
  - id: d
    text: บะ-ระ-จุ
    feedback: รร ไม่ได้อ่านเป็นสองพยางค์
  hints:
  - รร ใน บรรจุ มีตัวสะกดตามหรือไม่
  - รร ไม่มีตัวสะกดออกเสียง อัน
  solution: '**บัน-จุ** เพราะ รร ไม่มีตัวสะกดตาม จึงออกเสียง อัน'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.special-spellings.p009
  topics:
  - thai.writing.special-spellings
  difficulty: 3
  type: order
  stem: เรียงคำตามจำนวน **พยัญชนะที่ไม่ออกเสียง** จากน้อยไปมาก
  items:
  - ขนม
  - สัตว์
  - จันทร์
  hints:
  - การันต์อาจมีหนึ่งหรือสองตัว
  - ขนม ทุกตัวออกเสียง
  solution: ขนม 0 ตัว → สัตว์ 1 ตัว (ว์) → จันทร์ 2 ตัว (ทร์)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.special-spellings.p010
  topics:
  - thai.writing.special-spellings
  difficulty: 4
  type: mcq
  stem: ประโยคใดใช้คำ **ถูกความหมายและสะกดถูก**
  choices:
  - id: a
    text: เขาประสบความสำเร็จในการแข่งขัน
    correct: true
    feedback: ถูก ประสบ แปลว่า พบ
  - id: b
    text: เขาประสพความสำเร็จในการแข่งขัน
    feedback: ประสพ แปลว่า การเกิดผล อ่านเหมือนกันแต่ใช้ในความหมายนี้ไม่ได้
  - id: c
    text: เขาประสบความสำเหร็จในการแข่งขัน
    feedback: สำเร็จ ไม่มี ห
  - id: d
    text: เขาประสบความสัมเร็จในการแข่งขัน
    feedback: สำเร็จ ใช้สระอำ
  hints:
  - ประสบ กับ ประสพ อ่านเหมือนกัน ความหมายต่างกัน
  - ความสำเร็จเป็นสิ่งที่เรา พบ
  solution: '**เขาประสบความสำเร็จในการแข่งขัน** ประสบ = พบ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.special-spellings.p011
  topics:
  - thai.writing.special-spellings
  difficulty: 4
  type: mcq
  stem: คำใด **สะกดถูก** (เลือกได้มากกว่า 1 ข้อ)
  multiple: true
  choices:
  - id: a
    text: กะทันหัน
    correct: true
    feedback: ถูก
  - id: b
    text: ทะเลสาบ
    correct: true
    feedback: ถูก
  - id: c
    text: ศรีษะ
    feedback: ผิด ต้องเป็น ศีรษะ
  - id: d
    text: อานิสงค์
    feedback: ผิด ต้องเป็น อานิสงส์
  hints:
  - ตรวจทีละคำกับตารางคำที่มักเขียนผิด
  - ศีรษะ สระอี อยู่ที่ ศ
  solution: 'ถูก: **กะทันหัน ทะเลสาบ** · ผิด: ศรีษะ (→ ศีรษะ) อานิสงค์ (→ อานิสงส์)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.special-spellings.p012
  topics:
  - thai.writing.special-spellings
  difficulty: 4
  type: mcq
  stem: '"เกวียน**เพลา**หักกลางทาง" คำว่า เพลา ในประโยคนี้อ่านและหมายความอย่างไร'
  choices:
  - id: a
    text: อ่าน เพฺลา (ควบกล้ำ) หมายถึงแกนที่สอดในดุมล้อ
    correct: true
    feedback: ถูก ประโยคพูดถึงส่วนของเกวียนที่หัก
  - id: b
    text: อ่าน เพ-ลา หมายถึงเวลา
    feedback: เวลาหักไม่ได้ ไม่เข้ากับประโยค
  - id: c
    text: อ่าน เพ-ลา หมายถึงแกนล้อ
    feedback: ความหมายถูกแต่อ่านผิด แกนล้ออ่านเป็นควบกล้ำ
  - id: d
    text: อ่าน เพฺลา หมายถึงเวลา
    feedback: อ่านเพฺลาแต่ความหมายผิด
  hints:
  - เพลา เป็นคำพ้องรูป
  - อะไรของเกวียนที่หักได้
  solution: เพลา เป็นคำพ้องรูป ในประโยคนี้อ่าน **เพฺลา** หมายถึง **แกนล้อ** (ถ้าอ่าน เพ-ลา หมายถึงเวลา)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.special-spellings.p013
  topics:
  - thai.writing.special-spellings
  difficulty: 4
  type: match
  stem: จับคู่คำพ้องเสียง /พัก/ กับความหมาย
  pairs:
  - left: พัก
    right: หยุดเพื่อให้หายเหนื่อย
  - left: พรรค
    right: พวก หมู่คณะ
  - left: พักตร์
    right: หน้า (ราชาศัพท์ใช้ว่า พระพักตร์)
  hints:
  - สามคำอ่านเหมือนกัน
  - พรรค ใช้ในคำว่า พรรคการเมือง
  solution: พัก = หยุดพัก · พรรค = พวก หมู่คณะ · พักตร์ = หน้า
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.special-spellings.p014
  topics:
  - thai.writing.special-spellings
  difficulty: 5
  type: text
  stem: 'ข้อความมีคำสะกดผิด 1 คำ พิมพ์คำนั้นใน **รูปที่ถูก**: "ขอเชิญนักเรียนไปปิกนิกที่ทะเลสาบ หากมีเหตุกะทันหันให้แจ้งครู และขอให้ทุกคนสังเกตุป้ายบอกทาง"'
  accepted:
  - สังเกต
  misconceptions:
  - match: สังเกตุ
    feedback: นี่คือรูปที่ผิด ให้พิมพ์รูปที่ถูก
  - match: ปิคนิค
    feedback: ปิกนิก ในข้อความเขียนถูกแล้ว
  - match: กระทันหัน
    feedback: กะทันหัน ในข้อความเขียนถูกแล้ว
  hints:
  - ไล่ตรวจ ปิกนิก ทะเลสาบ กะทันหัน สังเกต
  - คำใดมีสระเกินมา
  solution: คำที่ผิดคือ สังเกตุ เขียนถูกว่า **สังเกต** (ไม่มีสระอุ)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.special-spellings.p015
  topics:
  - thai.writing.special-spellings
  difficulty: 5
  type: mcq
  stem: ข้อใดอธิบาย **ถูกต้อง** ทุกส่วน
  choices:
  - id: a
    text: ธรรม อ่าน ทำ เพราะ รร มีตัวสะกด ม และ บรรทุก เขียนด้วย บรร
    correct: true
    feedback: ถูก
  - id: b
    text: ธรรม อ่าน ทัน เพราะ รร ออกเสียง อัน เสมอ
    feedback: รร ออกเสียง อัน เฉพาะเมื่อไม่มีตัวสะกด
  - id: c
    text: ฤกษ์ อ่าน รึก เพราะ ฤ อ่าน รึ เสมอ
    feedback: ฤ อ่านได้ รึ ริ เรอ ฤกษ์ อ่าน เริก
  - id: d
    text: ชนิด อ่าน ชะ-หนิด เพราะเป็นอักษรนำ
    feedback: ช เป็นอักษรต่ำ จึงไม่เป็นอักษรนำ อ่าน ชะ-นิด
  hints:
  - ตรวจทีละส่วนของแต่ละข้อ
  - รร มีตัวสะกดหรือไม่ · ฤ อ่านได้กี่แบบ · ตัวหน้าเป็นอักษรอะไร
  solution: 'ข้อแรกถูกทั้งหมด: ธรรม = ทำ (รร + ม) และ บรรทุก ใช้ บรร'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.special-spellings.p016
  topics:
  - thai.writing.special-spellings
  difficulty: 5
  type: mcq
  stem: คำในข้อใด **เขียนถูกทุกคำ**
  choices:
  - id: a
    text: ไอศกรีม คลินิก บิณฑบาต ผาสุก
    correct: true
    feedback: ถูกทั้งสี่คำ
  - id: b
    text: ไอศครีม คลินิก บิณฑบาต ผาสุก
    feedback: ไอศครีม ผิด ต้องเป็น ไอศกรีม
  - id: c
    text: ไอศกรีม คลีนิก บิณฑบาต ผาสุก
    feedback: คลีนิก ผิด ต้องเป็น คลินิก
  - id: d
    text: ไอศกรีม คลินิก บิณฑบาตร ผาสุข
    feedback: บิณฑบาตร และ ผาสุข ผิด
  hints:
  - ตรวจทีละคำ อย่าดูแค่คำแรก
  - ระวังสระ ร และ ข ที่เติมเกิน
  solution: '**ไอศกรีม คลินิก บิณฑบาต ผาสุก** เขียนถูกทั้งหมด'
  license: CC-BY-SA-4.0
  ai_assisted: true
