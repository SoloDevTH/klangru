<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="sans-serif" font-size="14">
<title>วิวัฒนาการของเอกภพหลังบิกแบง</title>
<rect x="0" y="0" width="820" height="400" fill="#ffffff"/>
<defs><linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="0.35" stop-color="#fb923c"/><stop offset="0.75" stop-color="#7c2d12"/><stop offset="1" stop-color="#0f172a"/></linearGradient></defs>
<rect x="40" y="188" width="750" height="24" fill="url(#tg)" stroke="#111"/>
<line x1="77.1" y1="212" x2="77.1" y2="220" stroke="#111"/>
<text x="77.1" y="236" text-anchor="middle" font-size="12" fill="#222">10<tspan dy="-6" font-size="9">−40</tspan><tspan dy="6"> s</tspan></text>
<line x1="200.8" y1="212" x2="200.8" y2="220" stroke="#111"/>
<text x="200.8" y="236" text-anchor="middle" font-size="12" fill="#222">10<tspan dy="-6" font-size="9">−30</tspan><tspan dy="6"> s</tspan></text>
<line x1="324.5" y1="212" x2="324.5" y2="220" stroke="#111"/>
<text x="324.5" y="236" text-anchor="middle" font-size="12" fill="#222">10<tspan dy="-6" font-size="9">−20</tspan><tspan dy="6"> s</tspan></text>
<line x1="448.2" y1="212" x2="448.2" y2="220" stroke="#111"/>
<text x="448.2" y="236" text-anchor="middle" font-size="12" fill="#222">10<tspan dy="-6" font-size="9">−10</tspan><tspan dy="6"> s</tspan></text>
<line x1="571.8" y1="212" x2="571.8" y2="220" stroke="#111"/>
<text x="571.8" y="234.0" text-anchor="middle" font-size="11" fill="#222">1 s</text>
<line x1="695.5" y1="212" x2="695.5" y2="220" stroke="#111"/>
<text x="695.5" y="236" text-anchor="middle" font-size="12" fill="#222">10<tspan dy="-6" font-size="9">10</tspan><tspan dy="6"> s</tspan></text>
<line x1="40.0" y1="188" x2="40.0" y2="168.0" stroke="#6b7280"/>
<circle cx="40.0" cy="200" r="4" fill="#111"/>
<text x="40.0" y="152.0" text-anchor="start" font-size="12" font-weight="bold" fill="#222">ยุคพลังค์</text>
<text x="40.0" y="167.0" text-anchor="start" font-size="11" fill="#374151">~10⁻⁴³ s</text>
<line x1="151.3" y1="212" x2="151.3" y2="244.0" stroke="#6b7280"/>
<circle cx="151.3" cy="200" r="4" fill="#111"/>
<text x="151.3" y="260.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">การพองตัว</text>
<text x="151.3" y="275.0" text-anchor="middle" font-size="11" fill="#374151">~10⁻³⁶–10⁻³² s</text>
<line x1="497.6" y1="188" x2="497.6" y2="120.0" stroke="#6b7280"/>
<circle cx="497.6" cy="200" r="4" fill="#111"/>
<text x="497.6" y="104.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">ควาร์กรวมเป็นโปรตอน</text>
<text x="497.6" y="119.0" text-anchor="middle" font-size="11" fill="#374151">และนิวตรอน ~10⁻⁶ s</text>
<line x1="599.7" y1="212" x2="599.7" y2="292.0" stroke="#6b7280"/>
<circle cx="599.7" cy="200" r="4" fill="#111"/>
<text x="599.7" y="308.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">เกิดนิวเคลียส H และ He</text>
<text x="599.7" y="323.0" text-anchor="middle" font-size="11" fill="#374151">~3–20 นาที</text>
<line x1="733.6" y1="188" x2="733.6" y2="168.0" stroke="#6b7280"/>
<circle cx="733.6" cy="200" r="4" fill="#111"/>
<text x="733.6" y="152.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">อะตอมเกิด แสงเดินทางอิสระ</text>
<text x="733.6" y="167.0" text-anchor="middle" font-size="11" fill="#374151">~380,000 ปี T ~3,000 K</text>
<line x1="767.3" y1="212" x2="767.3" y2="244.0" stroke="#6b7280"/>
<circle cx="767.3" cy="200" r="4" fill="#111"/>
<text x="767.3" y="260.0" text-anchor="end" font-size="12" font-weight="bold" fill="#222">ดาวและกาแล็กซีแรก</text>
<text x="767.3" y="275.0" text-anchor="end" font-size="11" fill="#374151">~100–200 ล้านปี</text>
<line x1="787.8" y1="212" x2="787.8" y2="292.0" stroke="#6b7280"/>
<circle cx="787.8" cy="200" r="4" fill="#111"/>
<text x="787.8" y="308.0" text-anchor="end" font-size="12" font-weight="bold" fill="#222">ระบบสุริยะเกิด</text>
<text x="787.8" y="323.0" text-anchor="end" font-size="11" fill="#374151">~9,200 ล้านปี</text>
<line x1="790.0" y1="212" x2="790.0" y2="340.0" stroke="#6b7280"/>
<circle cx="790.0" cy="200" r="4" fill="#111"/>
<text x="790.0" y="356.0" text-anchor="end" font-size="12" font-weight="bold" fill="#222">ปัจจุบัน</text>
<text x="790.0" y="371.0" text-anchor="end" font-size="11" fill="#374151">13,800 ล้านปี T = 2.7 K</text>
<text x="410.0" y="390.0" text-anchor="middle" font-size="12" fill="#475569">เวลาหลังบิกแบง มาตราส่วนลอการิทึม สีแถบแสดงว่าเอกภพเย็นลงเมื่อขยายตัว</text>
</svg>