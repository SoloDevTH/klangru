      - "ตรงข้ามกับ fail open"
    solution: "ล้มเหลวอย่างปลอดภัย (fail secure หรือ fail closed) หมายถึงเมื่อส่วนตรวจสิทธิ์พัง ระบบจะปฏิเสธการเข้าถึงไว้ก่อน"
