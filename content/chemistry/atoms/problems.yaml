problems:
  - id: chem.atom.p001
    topics: [chemistry.matter.atoms]
    difficulty: 1
    type: mcq
    stem: "อนุภาคใดในอะตอมมีประจุไฟฟ้าเป็นบวก"
    choices:
      - { id: a, text: "โปรตอน", correct: true, feedback: "ถูก โปรตอนมีประจุ $+1$ และอยู่ในนิวเคลียส" }
      - { id: b, text: "นิวตรอน", feedback: "นิวตรอนอยู่ในนิวเคลียสเหมือนโปรตอน แต่ไม่มีประจุ (เป็นกลาง)" }
      - { id: c, text: "อิเล็กตรอน", feedback: "อิเล็กตรอนมีประจุ $-1$ ตรงข้ามกับโปรตอน" }
      - { id: d, text: "นิวเคลียส", feedback: "นิวเคลียสมีประจุบวกก็จริง แต่ไม่ใช่อนุภาคเดี่ยว นิวเคลียสประกอบด้วยโปรตอนและนิวตรอน ตัวที่ทำให้นิวเคลียสเป็นบวกคือโปรตอน" }
    hints:
      - "ในอะตอมมีอนุภาค 3 ชนิด คือ โปรตอน นิวตรอน และอิเล็กตรอน"
      - "นึกถึงตารางสรุปอนุภาค แล้วดูคอลัมน์ประจุว่าตัวใดเป็น $+1$"
    solution: "โปรตอนมีประจุ $+1$ นิวตรอนมีประจุ $0$ และอิเล็กตรอนมีประจุ $-1$ คำตอบจึงเป็นโปรตอน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.atom.p002
    topics: [chemistry.matter.atoms]
    difficulty: 1
    type: text
    stem: "อนุภาคในนิวเคลียสที่ไม่มีประจุไฟฟ้าเรียกว่าอะไร (ตอบเป็นภาษาไทยหรืออังกฤษ)"
    accepted: ["นิวตรอน", "neutron", "ตัวนิวตรอน"]
    misconceptions:
      - { match: "โปรตอน", feedback: "โปรตอนอยู่ในนิวเคลียสก็จริง แต่มีประจุ $+1$ ลองนึกถึงอนุภาคอีกตัวที่อยู่ในนิวเคลียสด้วยกัน" }
      - { match: "อิเล็กตรอน", feedback: "อิเล็กตรอนมีประจุ $-1$ และอยู่รอบนิวเคลียส ไม่ได้อยู่ในนิวเคลียส" }
    hints:
      - "ในนิวเคลียสมีอนุภาค 2 ชนิด"
      - "ชื่อของอนุภาคนี้มาจากคำว่า neutral ที่แปลว่าเป็นกลาง"
    solution: "นิวเคลียสมีโปรตอน (ประจุ $+1$) และนิวตรอน (ประจุ $0$) อนุภาคที่ไม่มีประจุจึงเป็น **นิวตรอน** (neutron)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.atom.p003
    topics: [chemistry.matter.atoms]
    difficulty: 2
    type: numeric
    stem: "อะตอมออกซิเจน ${}^{16}_{8}\\mathrm{O}$ ที่เป็นกลางทางไฟฟ้ามีอิเล็กตรอนกี่ตัว (ตอบเป็นจำนวนตัว)"
    answer: { value: 8, unit: ตัว }
    hints:
      - "อะตอมที่เป็นกลาง ประจุบวกต้องหักล้างกับประจุลบพอดี"
      - "จำนวนอิเล็กตรอนของอะตอมที่เป็นกลางเท่ากับจำนวนโปรตอน ดูว่าเลขใดในสัญลักษณ์บอกจำนวนโปรตอน"
    misconceptions:
      - { match: 16, feedback: "16 คือเลขมวล (โปรตอน + นิวตรอน) จำนวนอิเล็กตรอนของอะตอมที่เป็นกลางเท่ากับเลขอะตอม ซึ่งเป็นเลขมุมล่าง" }
    solution: "เลขอะตอม (มุมล่าง) $Z = 8$ จึงมีโปรตอน 8 ตัว อะตอมเป็นกลางจึงมีอิเล็กตรอนเท่ากับโปรตอน คือ **8 ตัว**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.atom.p004
    topics: [chemistry.matter.atoms]
    difficulty: 2
    type: numeric
    stem: "อะตอม ${}^{23}_{11}\\mathrm{Na}$ มีนิวตรอนกี่ตัว (ตอบเป็นจำนวนตัว)"
    answer: { value: 12, unit: ตัว }
    hints:
      - "เลขมุมบนคือเลขมวล เลขมุมล่างคือเลขอะตอม"
      - "เลขมวลคือโปรตอนรวมกับนิวตรอน"
      - "นำเลขมวลลบด้วยเลขอะตอม"
    misconceptions:
      - { match: 23, feedback: "23 คือเลขมวล ซึ่งรวมโปรตอนไว้ด้วย ต้องลบจำนวนโปรตอน (เลขอะตอม) ออกก่อน" }
      - { match: 34, feedback: "ดูเหมือนนำเลขมวลบวกเลขอะตอม จำนวนนิวตรอนคือเลขมวล **ลบ** เลขอะตอม" }
    solution: "นิวตรอน $= A - Z = 23 - 11 = 12$ ตัว ตรวจ: โปรตอน 11 + นิวตรอน 12 = 23 ตรงกับเลขมวล ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.atom.p005
    topics: [chemistry.matter.atoms]
    difficulty: 2
    type: match
    stem: "จับคู่คำกับความหมายให้ถูกต้อง"
    pairs:
      - { left: "โปรตอน", right: "ประจุ $+1$ อยู่ในนิวเคลียส" }
      - { left: "นิวตรอน", right: "ไม่มีประจุ อยู่ในนิวเคลียส" }
      - { left: "อิเล็กตรอน", right: "ประจุ $-1$ มวลน้อยมาก อยู่รอบนิวเคลียส" }
      - { left: "เลขอะตอม", right: "จำนวนโปรตอนในนิวเคลียส" }
      - { left: "เลขมวล", right: "จำนวนโปรตอนรวมกับนิวตรอน" }
    hints:
      - "อนุภาคในนิวเคลียสมี 2 ชนิด แยกกันด้วยประจุ"
      - "เลขอะตอมบอกชนิดธาตุ ส่วนเลขมวลนับทุกอนุภาคที่หนักในนิวเคลียส"
    solution: "โปรตอน: $+1$ ในนิวเคลียส · นิวตรอน: ไม่มีประจุ ในนิวเคลียส · อิเล็กตรอน: $-1$ มวลน้อยมาก รอบนิวเคลียส · เลขอะตอม: จำนวนโปรตอน · เลขมวล: โปรตอน + นิวตรอน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.atom.p006
    topics: [chemistry.matter.atoms]
    difficulty: 3
    type: numeric
    stem: "ทองคำแท่งที่ขายในร้านทองทำจากธาตุทองคำ ซึ่งพบในธรรมชาติเป็นไอโซโทปเดียว คือ ${}^{197}_{79}\\mathrm{Au}$ อะตอมทองคำหนึ่งอะตอมมีนิวตรอนกี่ตัว (ตอบเป็นจำนวนตัว)"
    answer: { value: 118, unit: ตัว }
    hints:
      - "หาว่าเลขใดเป็นเลขมวล และเลขใดเป็นเลขอะตอม"
      - "จำนวนนิวตรอนเท่ากับเลขมวลลบเลขอะตอม"
    misconceptions:
      - { match: 197, feedback: "197 คือเลขมวล ซึ่งรวมโปรตอนไว้ด้วย ต้องลบเลขอะตอมออก" }
      - { match: 276, feedback: "ดูเหมือนนำ 197 บวก 79 จำนวนนิวตรอนคือเลขมวล **ลบ** เลขอะตอม" }
    solution: "นิวตรอน $= A - Z = 197 - 79 = 118$ ตัว อะตอมทองคำจึงมีโปรตอน 79 ตัว นิวตรอน 118 ตัว และ (เมื่อเป็นกลาง) อิเล็กตรอน 79 ตัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.atom.p007
    topics: [chemistry.matter.atoms]
    difficulty: 3
    type: mcq
    stem: "คู่ใดเป็นไอโซโทปกัน"
    choices:
      - { id: a, text: "${}^{12}_{6}\\mathrm{C}$ และ ${}^{14}_{6}\\mathrm{C}$", correct: true, feedback: "ถูก เลขอะตอมเท่ากัน (6) จึงเป็นธาตุเดียวกัน แต่เลขมวลต่างกัน เพราะนิวตรอนต่างกัน 2 ตัว" }
      - { id: b, text: "${}^{14}_{6}\\mathrm{C}$ และ ${}^{14}_{7}\\mathrm{N}$", feedback: "สองอะตอมนี้มีเลขมวลเท่ากัน แต่เลขอะตอมต่างกัน จึงเป็นคนละธาตุ ไอโซโทปต้องเป็นธาตุเดียวกัน" }
      - { id: c, text: "${}^{40}_{18}\\mathrm{Ar}$ และ ${}^{40}_{20}\\mathrm{Ca}$", feedback: "เลขมวลเท่ากันไม่ได้แปลว่าเป็นไอโซโทป อาร์กอนกับแคลเซียมมีโปรตอนต่างกัน จึงเป็นคนละธาตุ" }
      - { id: d, text: "${}^{23}_{11}\\mathrm{Na}$ และ ${}^{23}_{11}\\mathrm{Na}^{+}$", feedback: "สองตัวนี้มีนิวเคลียสเหมือนกันทุกอย่าง ต่างกันแค่อิเล็กตรอน 1 ตัว จึงเป็นอะตอมกับไอออน ไม่ใช่ไอโซโทป" }
    hints:
      - "ไอโซโทปคืออะตอมของธาตุเดียวกัน"
      - "ธาตุเดียวกันต้องมีเลขอะตอม (เลขล่าง) เท่ากัน แต่เลขมวล (เลขบน) ต่างกัน"
    solution: "ไอโซโทปต้องมีเลขอะตอมเท่ากันแต่เลขมวลต่างกัน มีเพียง ${}^{12}_{6}\\mathrm{C}$ กับ ${}^{14}_{6}\\mathrm{C}$ ที่เข้าเงื่อนไข (นิวตรอน 6 และ 8 ตัว)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.atom.p008
    topics: [chemistry.matter.atoms]
    difficulty: 3
    type: numeric
    stem: "เกลือจากนาเกลือที่สมุทรสาครคือโซเดียมคลอไรด์ ในเกลือโซเดียมอยู่ในรูปไอออน ${}^{23}_{11}\\mathrm{Na}^{+}$ ไอออนนี้มีอิเล็กตรอนกี่ตัว (ตอบเป็นจำนวนตัว)"
    answer: { value: 10, unit: ตัว }
    hints:
      - "เริ่มจากจำนวนโปรตอน ซึ่งเท่ากับเลขอะตอม"
      - "ประจุ $+$ แปลว่าอิเล็กตรอนน้อยกว่าโปรตอน"
      - "จำนวนอิเล็กตรอน = เลขอะตอม − ประจุ"
    misconceptions:
      - { match: 12, feedback: "ดูเหมือนบวกอิเล็กตรอนเพิ่ม 1 ตัว ประจุบวกแปลว่าอะตอม **เสีย** อิเล็กตรอนไป จึงต้องลบ 1" }
      - { match: 11, feedback: "11 คือจำนวนอิเล็กตรอนของอะตอมโซเดียมที่เป็นกลาง แต่ไอออน $\\mathrm{Na^+}$ เสียอิเล็กตรอนไปแล้ว 1 ตัว" }
    solution: "โปรตอน $= 11$ ประจุ $+1$ แปลว่าเสียอิเล็กตรอน 1 ตัว อิเล็กตรอน $= 11 - 1 = 10$ ตัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.atom.p009
    topics: [chemistry.matter.atoms]
    difficulty: 4
    type: numeric
    stem: "นักโบราณคดีหาอายุเศษถ่านจากแหล่งโบราณคดีในภาคอีสานด้วยคาร์บอน-14 (C-14) ถ้าคาร์บอนมีเลขอะตอม 6 อะตอม C-14 หนึ่งอะตอมมีนิวตรอนกี่ตัว (ตอบเป็นจำนวนตัว)"
    answer: { value: 8, unit: ตัว }
    hints:
      - "ตัวเลขหลังชื่อธาตุ (คาร์บอน-14) คือเลขมวล"
      - "เขียนเป็นสัญลักษณ์นิวเคลียร์ได้ ${}^{14}_{6}\\mathrm{C}$"
      - "จำนวนนิวตรอนคือเลขมวลลบเลขอะตอม"
    misconceptions:
      - { match: 14, feedback: "14 คือเลขมวล ซึ่งนับโปรตอนรวมไว้ด้วย ต้องลบโปรตอน 6 ตัวออก" }
      - { match: 6, feedback: "6 คือจำนวนนิวตรอนของคาร์บอน-12 ไอโซโทปที่พบมากที่สุด แต่ C-14 มีเลขมวล 14" }
    solution: "C-14 คือ ${}^{14}_{6}\\mathrm{C}$ นิวตรอน $= 14 - 6 = 8$ ตัว มากกว่า C-12 อยู่ 2 ตัว แต่ยังเป็นคาร์บอนเพราะมีโปรตอน 6 ตัวเท่ากัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.atom.p010
    topics: [chemistry.matter.atoms]
    difficulty: 4
    type: mcq
    stem: "อะตอมของธาตุ X ที่เป็นกลางมีนิวตรอน 20 ตัว และมีเลขมวล 39 สัญลักษณ์นิวเคลียร์ใดถูกต้อง"
    choices:
      - { id: a, text: "${}^{39}_{19}\\mathrm{X}$", correct: true, feedback: "ถูก โปรตอน $= 39 - 20 = 19$ จึงเขียนเลขมวล 39 ไว้บน และเลขอะตอม 19 ไว้ล่าง (ธาตุนี้คือโพแทสเซียม)" }
      - { id: b, text: "${}^{39}_{20}\\mathrm{X}$", feedback: "เลขล่างต้องเป็นจำนวนโปรตอน ไม่ใช่จำนวนนิวตรอน หาโปรตอนจาก $39 - 20$" }
      - { id: c, text: "${}^{19}_{39}\\mathrm{X}$", feedback: "หาจำนวนโปรตอนถูกแล้ว แต่วางสลับที่ เลขมวล (ตัวที่มากกว่า) ต้องอยู่มุมบน" }
      - { id: d, text: "${}^{59}_{20}\\mathrm{X}$", feedback: "เลขมวล 39 รวมนิวตรอนไว้แล้ว ไม่ต้องบวก 20 เพิ่ม" }
    hints:
      - "เลขมวล = โปรตอน + นิวตรอน"
      - "หาจำนวนโปรตอนก่อน แล้วจำว่าเลขใดอยู่มุมบน เลขใดอยู่มุมล่าง"
    solution: "โปรตอน $= A - N = 39 - 20 = 19$ เลขอะตอมจึงเป็น 19 สัญลักษณ์คือ ${}^{39}_{19}\\mathrm{X}$ (เลขมวลบน เลขอะตอมล่าง)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.atom.p011
    topics: [chemistry.matter.atoms]
    difficulty: 4
    type: numeric
    stem: "น้ำมวลหนัก ($\\mathrm{D_2O}$) ใช้ในเครื่องปฏิกรณ์นิวเคลียร์บางแบบ แต่ละโมเลกุลมีดิวทีเรียม ${}^{2}_{1}\\mathrm{H}$ 2 อะตอม และออกซิเจน ${}^{16}_{8}\\mathrm{O}$ 1 อะตอม หนึ่งโมเลกุลมีนิวตรอนรวมกี่ตัว (ตอบเป็นจำนวนตัว)"
    answer: { value: 10, unit: ตัว }
    hints:
      - "หาจำนวนนิวตรอนของแต่ละอะตอมก่อน"
      - "ดิวทีเรียมมีนิวตรอน $2 - 1$ ตัว ออกซิเจนมีนิวตรอน $16 - 8$ ตัว"
      - "อย่าลืมว่าในโมเลกุลมีดิวทีเรียม 2 อะตอม"
    misconceptions:
      - { match: 8, feedback: "นั่นคือนิวตรอนของออกซิเจนเท่านั้น ดิวทีเรียมแต่ละอะตอมมีนิวตรอน 1 ตัว ต้องนับเพิ่มด้วย" }
      - { match: 9, feedback: "ดูเหมือนนับดิวทีเรียมแค่อะตอมเดียว สูตร $\\mathrm{D_2O}$ มีดิวทีเรียม 2 อะตอม" }
    solution: "ดิวทีเรียม: นิวตรอน $2 - 1 = 1$ ตัว มี 2 อะตอม ได้ 2 ตัว ออกซิเจน: $16 - 8 = 8$ ตัว รวม $2 + 8 = 10$ ตัว (น้ำธรรมดา $\\mathrm{H_2O}$ ที่ใช้ ${}^{1}_{1}\\mathrm{H}$ มีนิวตรอนเพียง 8 ตัว)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.atom.p012
    topics: [chemistry.matter.atoms]
    difficulty: 5
    type: numeric
    stem: "คลอรีนในธรรมชาติมี Cl-35 อยู่ 75% และ Cl-37 อยู่ 25% ถ้าถือว่ามวลของแต่ละไอโซโทปเท่ากับเลขมวล มวลอะตอมเฉลี่ยของคลอรีนเป็นเท่าใด (ตอบในหน่วย u)"
    answer: { value: 35.5, tolerance: 0.05, unit: u }
    hints:
      - "มวลเฉลี่ยต้องถ่วงด้วยสัดส่วนที่พบ ไม่ใช่หาค่ากลางธรรมดา"
      - "เปลี่ยนร้อยละเป็นทศนิยม: 75% = 0.75 และ 25% = 0.25"
      - "คูณมวลของแต่ละไอโซโทปกับสัดส่วนของมัน แล้วนำมาบวกกัน"
    misconceptions:
      - { match: 36, feedback: "นั่นคือค่ากลางของ 35 กับ 37 ซึ่งใช้ได้เมื่อมีอย่างละครึ่งเท่านั้น ต้องถ่วงด้วย 75% และ 25%" }
