  solution: ทางลาดและราวจับ = ลดอุปสรรคทางกายภาพ, ป้ายหลายภาษาพร้อมภาพ = ลดอุปสรรคทางภาษา, จัดหลายช่วงเวลา = ลดอุปสรรคด้านเวลา, ถามความเห็นกลุ่มต่าง ๆ ก่อนตัดสินใจ = การประเมินผลต่อทุกกลุ่ม
