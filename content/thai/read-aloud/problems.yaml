problems:
- id: thai.reading.read-aloud.p001
  topics:
  - thai.reading.read-aloud
  difficulty: 1
  type: mcq
  stem: คำว่า **ตลาด** อ่านออกเสียงอย่างไร
  choices:
  - id: a
    text: ตะ-หลาด
    correct: true
    feedback: ถูก ต นำ ล ทำให้ ลาด ออกเสียงเป็น หลาด
  - id: b
    text: ตลาด (ควบกล้ำ ตล)
    feedback: ตล ไม่ใช่คำควบกล้ำในภาษาไทย
  - id: c
    text: ตะ-ลาด
    feedback: ลืมเสียงอักษรนำ ล ต้องออกเสียงสูงเป็น หลาด
  - id: d
    text: ตา-ลาด
    feedback: ต ออกเสียงสั้นเป็น ตะ
  hints:
  - ตลาด มีสองพยางค์
  - พยางค์ที่สองออกเสียงตามอักษรนำ
  solution: ตลาด อ่านว่า **ตะ-หลาด**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.read-aloud.p002
  topics:
  - thai.reading.read-aloud
  difficulty: 1
  type: mcq
  stem: คำว่า **จริง** อ่านออกเสียงอย่างไร
  choices:
  - id: a
    text: จิง
    correct: true
    feedback: ถูก จร เป็นควบกล้ำไม่แท้ ไม่ออกเสียง ร
  - id: b
    text: จะ-ริง
    feedback: จริง มีพยางค์เดียว
  - id: c
    text: จริง (ออกเสียง ร)
    feedback: จร ไม่ใช่ควบกล้ำแท้ ไม่ออกเสียง ร
  - id: d
    text: ซิง
    feedback: จ ไม่ได้เปลี่ยนเป็น ซ (ทร จึงจะออกเสียง ซ)
  hints:
  - จร เป็นควบกล้ำแท้หรือไม่แท้
  - ควบกล้ำไม่แท้ออกเสียงตัวหน้าตัวเดียว
  solution: จริง อ่านว่า **จิง**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.read-aloud.p003
  topics:
  - thai.reading.read-aloud
  difficulty: 2
  type: match
  stem: จับคู่คำกับวิธีอ่านออกเสียง
  pairs:
  - left: สมุด
    right: สะ-หมุด
  - left: ทราย
    right: ซาย
  - left: ผลไม้
    right: ผน-ละ-ไม้
  - left: ธรรมชาติ
    right: ทำ-มะ-ชาด
  hints:
  - บางคำมีอักษรนำ บางคำ ทร ออกเสียง ซ
  - บางคำอ่านเชื่อมพยางค์
  solution: สมุด สะ-หมุด · ทราย ซาย · ผลไม้ ผน-ละ-ไม้ · ธรรมชาติ ทำ-มะ-ชาด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.read-aloud.p004
  topics:
  - thai.reading.read-aloud
  difficulty: 2
  type: mcq
  stem: ประโยค "เสื้อที่ตากลมไว้แห้งแล้ว" ควรอ่านคำว่า ตากลม อย่างไร
  choices:
  - id: a
    text: ตาก-ลม (นำไปผึ่งลม)
    correct: true
    feedback: ถูก เสื้อถูกนำไปตากให้โดนลม
  - id: b
    text: ตา-กลม (ดวงตากลม)
    feedback: เสื้อไม่มีดวงตา ความหมายไม่เข้ากับประโยค
  - id: c
    text: อ่านแบบใดก็ได้ ความหมายเหมือนกัน
    feedback: อ่านต่างกัน ความหมายต่างกัน
  hints:
  - ดูว่าประโยคพูดถึงอะไร
  - เสื้อทำอะไรได้บ้าง
  solution: อ่านว่า **ตาก-ลม** เพราะพูดถึงการผึ่งเสื้อ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.read-aloud.p005
  topics:
  - thai.reading.read-aloud
  difficulty: 2
  type: mcq
  stem: ข้อใดแบ่งวรรคตอนเวลาอ่าน "ยานี้ดีกินแล้วแข็งแรงไม่มีโรค" ได้ถูกต้อง
  choices:
  - id: a
    text: ยานี้ดี / กินแล้วแข็งแรง / ไม่มีโรค
    correct: true
    feedback: ถูก ได้ความว่ากินยาแล้วแข็งแรง
  - id: b
    text: ยานี้ดีกิน / แล้วแข็งแรง / ไม่มีโรค
    feedback: ดีกิน ไม่ได้ความตามที่ตั้งใจ
  - id: c
    text: ยานี้ดี / กินแล้วแข็ง / แรงไม่มีโรค
    feedback: แบ่ง แข็งแรง ออกจากกัน ความหมายผิด
  - id: d
    text: ยานี้ / ดีกินแล้ว / แข็งแรงไม่ / มีโรค
    feedback: ความหมายกลับเป็นมีโรค
  hints:
  - อย่าหยุดกลางคำ
  - หาคำ แข็งแรง และ ไม่มีโรค ให้อยู่ครบ
  solution: '**ยานี้ดี / กินแล้วแข็งแรง / ไม่มีโรค**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.read-aloud.p006
  topics:
  - thai.reading.read-aloud
  difficulty: 2
  type: order
  stem: เรียงขั้นการเตรียมอ่านออกเสียงให้ถูกลำดับ
  items:
  - อ่านในใจให้รู้เรื่อง
  - หาคำยากและคำที่อ่านไม่ตรงรูป
  - ขีดแบ่งวรรคตอน
  - ฝึกอ่านออกเสียง
  - อ่านให้ผู้ฟังฟัง
  hints:
  - ต้องรู้เรื่องก่อนจึงรู้ว่าจะใช้น้ำเสียงอย่างไร
  - อ่านจริงเป็นขั้นสุดท้าย
  solution: อ่านในใจ → หาคำยาก → แบ่งวรรคตอน → ฝึกอ่าน → อ่านจริง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.read-aloud.p007
  topics:
  - thai.reading.read-aloud
  difficulty: 3
  type: mcq
  stem: วรรคกลอนสุภาพ "ฝนพรำพรำฉ่ำเย็นทั่วทุ่งนา" ควรแบ่งจังหวะอ่านอย่างไร
  choices:
  - id: a
    text: ฝนพรำพรำ / ฉ่ำเย็น / ทั่วทุ่งนา
    correct: true
    feedback: ถูก กลอนสุภาพ 8 คำ อ่าน 3 / 2 / 3
  - id: b
    text: ฝนพรำ / พรำฉ่ำเย็น / ทั่วทุ่งนา
    feedback: แบ่งเป็น 2 / 3 / 3 ไม่ตรงจังหวะกลอนสุภาพ
  - id: c
    text: ฝนพรำพรำฉ่ำ / เย็นทั่ว / ทุ่งนา
    feedback: แบ่งเป็น 4 / 2 / 2 และแยก ฉ่ำเย็น ออกจากกัน
  - id: d
    text: ฝน / พรำพรำฉ่ำเย็น / ทั่วทุ่งนา
    feedback: แบ่งเป็น 1 / 4 / 3 ไม่ตรงจังหวะ
  hints:
  - 'นับคำ: ฝน พรำ พรำ ฉ่ำ เย็น ทั่ว ทุ่ง นา'
  - กลอนสุภาพอ่าน 3 / 2 / 3
  solution: '**ฝนพรำพรำ / ฉ่ำเย็น / ทั่วทุ่งนา**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.read-aloud.p008
  topics:
  - thai.reading.read-aloud
  difficulty: 3
  type: numeric
  stem: กาพย์ยานี 11 **วรรคหน้า** มีกี่คำ
  answer:
    value: 5
    tolerance: 0
    unit: คำ
  misconceptions:
  - match: 6
    feedback: 6 คำคือวรรคหลัง
  - match: 11
    feedback: 11 คือจำนวนคำของทั้งบาท (วรรคหน้า + วรรคหลัง)
  hints:
  - ชื่อ ยานี 11 บอกจำนวนคำในหนึ่งบาท
  - หนึ่งบาทมีวรรคหน้ากับวรรคหลัง วรรคหลังมี 6 คำ
  solution: วรรคหน้า **5 คำ** วรรคหลัง 6 คำ รวม 11 คำ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.read-aloud.p009
  topics:
  - thai.reading.read-aloud
  difficulty: 3
  type: mcq
  stem: วรรคหลังของกาพย์ยานี "ลมโชยไกลพาชื่นบาน" ควรแบ่งจังหวะอย่างไร
  choices:
  - id: a
    text: ลมโชยไกล / พาชื่นบาน
    correct: true
    feedback: ถูก วรรคหลัง 6 คำ อ่าน 3 / 3
  - id: b
    text: ลมโชย / ไกลพาชื่นบาน
    feedback: แบ่ง 2 / 4 ไม่ตรงจังหวะ
  - id: c
    text: ลมโชยไกลพา / ชื่นบาน
    feedback: แบ่ง 4 / 2 และแยก พา ออกจากความหมาย
  - id: d
    text: ลม / โชยไกล / พาชื่นบาน
    feedback: วรรคหลังแบ่งสองช่วง ไม่ใช่สามช่วง
  hints:
  - วรรคหลังกาพย์ยานีมี 6 คำ
  - แบ่งครึ่งเท่ากัน
  solution: '**ลมโชยไกล / พาชื่นบาน** (3 / 3)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.read-aloud.p010
  topics:
  - thai.reading.read-aloud
  difficulty: 3
  type: match
  stem: จับคู่คำที่อ่านไม่ตรงรูปกับวิธีอ่าน
  pairs:
  - left: ปรารถนา
    right: ปราด-ถะ-หนา
  - left: กรรไกร
    right: กัน-ไกร
  - left: ประวัติศาสตร์
    right: ประ-หวัด-ติ-สาด
  - left: คุณภาพ
    right: คุน-นะ-พาบ
  hints:
