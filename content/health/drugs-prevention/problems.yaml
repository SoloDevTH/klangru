  difficulty: 4
  type: mcq
  stem: เพื่อนในกลุ่มคนหนึ่งบอกว่าอยากลองขนมผสมกัญชาที่มีคนขายในโซเชียล วิธีชักชวนให้เพื่อนหลีกเลี่ยงข้อใดได้ผลและให้เกียรติเพื่อนที่สุด
  choices:
  - id: a
    text: บอกด้วยความห่วงใยว่ากัญชามีผลต่อความจำและสมาธิของวัยรุ่น การขายออนไลน์ผิดกฎหมาย และชวนทำกิจกรรมที่สนุกด้วยกันแทน
    correct: true
  - id: b
    text: ขู่ว่าจะประจานในกลุ่มแชตถ้าเพื่อนลอง
    feedback: การขู่และประจานทำลายความสัมพันธ์และอาจทำให้เพื่อนไม่ฟัง
  - id: c
    text: บอกว่า "แล้วแต่เธอ" แล้วเปลี่ยนเรื่อง
    feedback: เพื่อนอาจตัดสินใจจากข้อมูลผิด การให้ข้อเท็จจริงด้วยความห่วงใยช่วยได้มากกว่า
  hints:
  - การชักชวนที่ดีใช้ข้อเท็จจริงและความห่วงใย
  - เสนอทางเลือกที่ทำด้วยกันได้
  solution: ชักชวนด้วยความห่วงใย ให้ข้อเท็จจริงทั้งผลต่อสมองวัยรุ่นและกฎหมาย และเสนอกิจกรรมอื่น ถ้าเพื่อนมีท่าทีไม่ปลอดภัยให้บอกผู้ใหญ่ที่ไว้ใจ
