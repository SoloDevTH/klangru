  difficulty: 4
  type: mcq
  stem: ทำไมควร **ทำซ้ำ** การทดลองหลายครั้งหรือใช้ต้นพืชหลายต้นในแต่ละชุด
  choices:
  - id: a
    text: เพื่อให้รู้ว่าผลเกิดซ้ำได้ ไม่ใช่ความบังเอิญ และหาค่าเฉลี่ยที่น่าเชื่อถือขึ้น
    correct: true
  - id: b
    text: เพื่อให้ได้ผลตรงกับสมมติฐาน
    feedback: การทำซ้ำไม่ได้ทำเพื่อให้ได้ผลที่เราอยากได้
  - id: c
    text: เพื่อให้รายงานดูยาวขึ้น
    feedback: ไม่ใช่เหตุผลทางวิทยาศาสตร์
  - id: d
    text: เพราะครั้งแรกทำผิดเสมอ
    feedback: ครั้งแรกไม่จำเป็นต้องผิด แต่ผลครั้งเดียวอาจคลาดเคลื่อน
  hints:
