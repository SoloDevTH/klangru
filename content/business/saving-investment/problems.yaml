problems:
- id: business.econ.saving-investment.p001
  topics:
  - business.econ.saving-investment
  difficulty: 1
  type: mcq
  stem: ข้อใดคือ **การออม**
  choices:
  - id: a
    text: เก็บรายได้ส่วนที่ไม่ได้ใช้จ่ายไว้ใช้ในอนาคต
    correct: true
  - id: b
    text: ใช้เงินทั้งหมดซื้อของที่อยากได้
    feedback: นั่นคือการใช้จ่ายเพื่อการบริโภค
  - id: c
    text: กู้เงินมาซื้อโทรศัพท์
    feedback: การกู้เป็นการก่อหนี้ ตรงข้ามกับการออม
  - id: d
    text: ซื้อขนมลดราคา
    feedback: การซื้อของลดราคาช่วยประหยัด แต่ยังเป็นการใช้จ่าย
  hints:
  - การออมคือส่วนที่เหลือจากอะไร
  - ออม $=$ รายได้ $-$ รายจ่ายเพื่อการบริโภค
  solution: การออมคือรายได้ส่วนที่ไม่ได้ใช้จ่ายในปัจจุบัน เก็บไว้ใช้ในอนาคต เช่น ฝากธนาคาร
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.saving-investment.p002
  topics:
  - business.econ.saving-investment
  difficulty: 1
  type: match
  stem: จับคู่ทางเลือกการออมและการลงทุนกับลักษณะ
  pairs:
  - left: เงินฝากออมทรัพย์
    right: ถอนได้ทุกเมื่อ ดอกเบี้ยต่ำ
  - left: พันธบัตรรัฐบาล
    right: ให้รัฐบาลกู้เงิน ได้ดอกเบี้ยตามกำหนด
  - left: หุ้นสามัญ
    right: เป็นเจ้าของส่วนหนึ่งของบริษัท ราคาขึ้นลงได้มาก
  - left: กองทุนรวม
    right: ผู้จัดการกองทุนนำเงินของคนจำนวนมากไปลงทุนรวมกัน
  hints:
  - 'ใครเป็นผู้รับเงินของเราไปใช้: ธนาคาร รัฐบาล บริษัท หรือกองทุน'
  - ทางเลือกใดทำให้เราเป็นเจ้าของบริษัท
  solution: ออมทรัพย์ → ถอนได้ทันที ดอกเบี้ยต่ำ · พันธบัตรรัฐบาล → ให้รัฐกู้ · หุ้นสามัญ → เป็นเจ้าของบางส่วนของบริษัท · กองทุนรวม → รวมเงินหลายคนให้ผู้จัดการลงทุน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.saving-investment.p003
  topics:
  - business.econ.saving-investment
  difficulty: 2
  type: numeric
  stem: มายได้ค่าขนมเดือนละ $3{,}000$ บาท ใช้จ่ายจริง $2{,}250$ บาท ที่เหลือฝากธนาคารทั้งหมด มายออมกี่เปอร์เซ็นต์ของรายได้ (ตอบเป็น %)
  answer:
    value: 25
    unit: '%'
  misconceptions:
  - match: 33.333333
    feedback: หารด้วยรายจ่าย ต้องหารด้วยรายได้
  - match: 75
    feedback: นั่นคือสัดส่วนรายจ่าย
  hints:
  - 'หาเงินออมก่อน: รายได้ $-$ รายจ่าย'
  - ร้อยละ $= \dfrac{\text{เงินออม}}{\text{รายได้}} \times 100$
  solution: เงินออม $= 3{,}000 - 2{,}250 = 750$ บาท คิดเป็น $\dfrac{750}{3{,}000} \times 100 = 25\%$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.saving-investment.p004
  topics:
  - business.econ.saving-investment
  difficulty: 2
  type: numeric
  stem: ฝากเงิน $10{,}000$ บาท ดอกเบี้ย $3\%$ ต่อปี **ทบต้น** ปีละครั้ง (สมมติ ไม่คิดภาษี) เมื่อครบ $2$ ปีจะมีเงินรวมกี่บาท (ตอบเป็นบาท)
  answer:
    value: 10609
    unit: บาท
  misconceptions:
  - match: 10600
    feedback: คิดแบบดอกเบี้ยอย่างง่าย ปีที่สองต้องคิดดอกเบี้ยจากดอกเบี้ยของปีแรกด้วย
  - match: 609
    feedback: ตอบเฉพาะดอกเบี้ย โจทย์ถามเงินรวม
  hints:
  - ปีแรก ดอกเบี้ยคิดจาก $10{,}000$ บาท
  - ปีที่สองคิดดอกเบี้ยจากยอดเงินต้นปีที่สอง (รวมดอกเบี้ยปีแรกแล้ว)
  solution: 'สิ้นปีที่ 1: $10{,}000 \times 1.03 = 10{,}300$ บาท · สิ้นปีที่ 2: $10{,}300 \times 1.03 = 10{,}609$ บาท หรือ $10{,}000(1.03)^2$'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.saving-investment.p005
  topics:
  - business.econ.saving-investment
  difficulty: 2
  type: numeric
  stem: ครอบครัวหนึ่งมีรายจ่ายจำเป็นเดือนละ $12{,}000$ บาท ถ้าต้องการมีเงินสำรองฉุกเฉินเท่ากับรายจ่าย $6$ เดือน ต้องมีเงินสำรองกี่บาท (ตอบเป็นบาท)
  answer:
    value: 72000
    unit: บาท
  misconceptions:
  - match: 36000
    feedback: ใช้ 3 เดือน โจทย์กำหนด 6 เดือน
  hints:
  - เงินสำรองฉุกเฉินคิดจากรายจ่าย ไม่ใช่รายได้
  - คูณจำนวนเดือน
  solution: เงินสำรอง $= 12{,}000 \times 6 = 72{,}000$ บาท ควรเก็บในที่ถอนได้เร็วและไม่เสี่ยง เช่น เงินฝากออมทรัพย์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.saving-investment.p006
  topics:
  - business.econ.saving-investment
  difficulty: 2
  type: mcq
  stem: ถ้าธนาคารขึ้นอัตราดอกเบี้ยเงินฝากจาก $1\%$ เป็น $3\%$ ต่อปี โดยปัจจัยอื่นไม่เปลี่ยน คนส่วนใหญ่น่าจะทำอย่างไร
  choices:
  - id: a
    text: ออมมากขึ้น เพราะผลตอบแทนของการออมสูงขึ้น
    correct: true
  - id: b
    text: ออมน้อยลง เพราะได้ดอกเบี้ยมากแล้ว
    feedback: ดอกเบี้ยสูงขึ้นเป็นแรงจูงใจให้ออมมากขึ้น
  - id: c
    text: กู้เงินมากขึ้น เพราะดอกเบี้ยสูง
    feedback: ดอกเบี้ยเงินกู้มักสูงขึ้นตาม การกู้จึงแพงขึ้น
  - id: d
    text: ไม่มีผลต่อการออมเลย
    feedback: อัตราดอกเบี้ยเป็นปัจจัยสำคัญของการออม
  hints:
  - ดอกเบี้ยคือรางวัลของการออม
  - รางวัลสูงขึ้น คนอยากทำสิ่งนั้นมากขึ้นหรือน้อยลง
  solution: อัตราดอกเบี้ยสูงขึ้นทำให้การออมได้ผลตอบแทนมากขึ้น และทำให้การกู้แพงขึ้น คนจึงมักออมมากขึ้นและกู้น้อยลง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.saving-investment.p007
  topics:
  - business.econ.saving-investment
  difficulty: 3
  type: numeric
  stem: ฝากเงิน $20{,}000$ บาท ดอกเบี้ย $4\%$ ต่อปีทบต้นปีละครั้ง (สมมติ ไม่คิดภาษี) เมื่อครบ $5$ ปีจะมีเงินรวมกี่บาท (ตอบเป็นบาท ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 24333.058048
    tolerance: 1
    unit: บาท
  misconceptions:
  - match: 24000
    feedback: คิดแบบดอกเบี้ยอย่างง่าย ($20{,}000 \times 1.2$) ไม่ได้ทบต้น
  - match: 4333.058048
    feedback: ตอบเฉพาะดอกเบี้ย โจทย์ถามเงินรวม
  hints:
  - ใช้สูตร $FV = P(1+r)^n$
  - $(1.04)^5 \approx 1.2167$
  solution: $FV = 20{,}000 \times (1.04)^5 = 20{,}000 \times 1.216653 = 24{,}333.06$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.saving-investment.p008
  topics:
  - business.econ.saving-investment
  difficulty: 3
  type: numeric
  stem: ใช้ **กฎ 72** ประมาณว่าเงินลงทุนที่ได้ผลตอบแทนทบต้นเฉลี่ย $6\%$ ต่อปี จะเพิ่มเป็น $2$ เท่าในกี่ปี (ตอบเป็นปี)
  answer:
    value: 12
    unit: ปี
  misconceptions:
  - match: 4.32
    feedback: คูณแทนการหาร
  - match: 16.666667
    feedback: ใช้ 100 หาร กฎ 72 ใช้ตัวเลข 72
  hints:
  - 'กฎ 72: จำนวนปี $\approx 72 \div$ อัตราผลตอบแทนเป็นร้อยละ'
  - ใส่ $6$ ไม่ใช่ $0.06$
  solution: 'จำนวนปี $\approx 72 \div 6 = 12$ ปี (ตรวจ: $(1.06)^{12} \approx 2.01$)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.saving-investment.p009
  topics:
  - business.econ.saving-investment
  difficulty: 3
  type: mcq
  stem: ข้อใดเป็นปัจจัยที่ทำให้ธุรกิจตัดสินใจ **ลงทุน** ซื้อเครื่องจักรใหม่มากขึ้น (เลือกได้มากกว่าหนึ่งข้อ)
  multiple: true
  choices:
  - id: a
    text: อัตราดอกเบี้ยเงินกู้ลดลง
    correct: true
  - id: b
    text: คาดว่ายอดขายในอนาคตจะเพิ่มขึ้น
    correct: true
  - id: c
    text: มีเทคโนโลยีใหม่ที่ช่วยลดต้นทุนการผลิต
    correct: true
  - id: d
    text: สถานการณ์การเมืองไม่แน่นอนอย่างมาก
    feedback: ความไม่แน่นอนทำให้ธุรกิจชะลอการลงทุน
  - id: e
    text: รัฐขึ้นภาษีกำไรของธุรกิจ
    feedback: ภาษีสูงขึ้นทำให้ผลตอบแทนจากการลงทุนลดลง
  hints:
  - การลงทุนคุ้มเมื่อผลตอบแทนที่คาดว่าจะได้สูงกว่าต้นทุน
  - ดอกเบี้ยเงินกู้คือต้นทุนของการลงทุน
  solution: ดอกเบี้ยต่ำลด (ต้นทุนเงินกู้ลดลง) ยอดขายในอนาคตที่ดีขึ้น และเทคโนโลยีที่ลดต้นทุน ทำให้การลงทุนคุ้มค่าขึ้น ส่วนความไม่แน่นอนทางการเมืองและภาษีสูงทำให้ธุรกิจลงทุนน้อยลง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.saving-investment.p010
  topics:
  - business.econ.saving-investment
  difficulty: 3
  type: order
  stem: เรียงทางเลือกต่อไปนี้จาก **ความเสี่ยงต่ำไปสูง** (โดยทั่วไป)
  items:
  - เงินฝากออมทรัพย์ในธนาคารพาณิชย์
  - พันธบัตรรัฐบาลไทย
  - หุ้นกู้ของบริษัทเอกชน
  - หุ้นสามัญของบริษัทเดียว
  hints:
  - 'ใครมีโอกาสผิดนัดน้อยที่สุด: ธนาคารที่มีการคุ้มครองเงินฝาก รัฐบาล หรือบริษัท'
  - ผู้ถือหุ้นได้เงินคืนหลังเจ้าหนี้ทุกราย ราคาหุ้นผันผวนมาก
  solution: เงินฝาก (คุ้มครองไม่เกิน 1 ล้านบาทต่อผู้ฝากต่อสถาบัน) → พันธบัตรรัฐบาล (รัฐบาลค้ำ) → หุ้นกู้เอกชน (บริษัทอาจผิดนัด) → หุ้นบริษัทเดียว (ราคาผันผวน ไม่มีผลตอบแทนแน่นอน) ลำดับนี้เป็นภาพรวมโดยทั่วไป แต่ละตัวยังต้องดูรายละเอียด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.saving-investment.p011
  topics:
  - business.econ.saving-investment
  difficulty: 3
  type: match
  stem: จับคู่ข้อความชักชวนลงทุนกับสัญญาณอันตรายที่ควรสังเกต
  pairs:
  - left: '"การันตีกำไร 10% ทุกเดือน ไม่มีขาดทุน"'
    right: ผลตอบแทนสูงผิดปกติและรับประกันว่าไม่เสี่ยง
  - left: '"ชวนเพื่อนมาลงทุน ได้ค่าแนะนำเพิ่ม"'
    right: รายได้มาจากการหาสมาชิกใหม่ (ลักษณะแชร์ลูกโซ่)
  - left: '"รีบโอนวันนี้ พรุ่งนี้ปิดรับ"'
    right: เร่งให้ตัดสินใจโดยไม่มีเวลาตรวจสอบ
  - left: '"ไม่ต้องถามมาก ไม่มีเอกสาร โอนเข้าบัญชีส่วนตัวได้เลย"'
    right: ไม่มีข้อมูลและตรวจสอบใบอนุญาตไม่ได้
  hints:
  - การลงทุนจริงต้องมีความเสี่ยงเสมอ
  - ผู้ให้บริการที่ถูกกฎหมายต้องมีใบอนุญาตที่ตรวจสอบได้ เช่น กับ ก.ล.ต.
  solution: 'ทั้งสี่ข้อเป็นสัญญาณของการหลอกลวง: ผลตอบแทนสูงแบบการันตี รายได้จากการหาสมาชิก เร่งให้ตัดสินใจ และไม่มีเอกสารหรือใบอนุญาต ควรตรวจสอบรายชื่อผู้ได้รับอนุญาตกับสำนักงาน ก.ล.ต. ก่อน'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.saving-investment.p012
  topics:
  - business.econ.saving-investment
  difficulty: 4
  type: numeric
  stem: จากตารางในภาพ ผลตอบแทนที่คาดหวัง (ค่าเฉลี่ยถ่วงน้ำหนักด้วยโอกาสเกิด) ของทางเลือก ข เป็นกี่เปอร์เซ็นต์ (ตอบเป็น %)
  figure:
    src: p-scenarios.svg
    alt: ตารางผลตอบแทนใน 1 ปีของทางเลือกลงทุน (สมมติ) สามสถานการณ์ เศรษฐกิจดี โอกาสเกิด 30% ทางเลือก ก 2% ทางเลือก ข +15% ปกติ โอกาสเกิด 50% ทางเลือก ก 2% ทางเลือก ข +6% ถดถอย โอกาสเกิด 20% ทางเลือก ก 2% ทางเลือก ข −10% ทางเลือก ก คือเงินฝากประจำ ทางเลือก ข คือกองทุนรวมหุ้น
  answer:
    value: 5.5
    tolerance: 0.055
    unit: '%'
  misconceptions:
  - match: 3.666667
    feedback: เฉลี่ยธรรมดาโดยไม่ถ่วงด้วยโอกาสเกิด
  - match: 9.5
    feedback: ลืมเครื่องหมายลบของสถานการณ์ถดถอย
  hints:
  - คูณผลตอบแทนแต่ละสถานการณ์ด้วยโอกาสเกิด
  - รวมผลคูณทั้งสามสถานการณ์ ระวังเครื่องหมายลบ
  solution: $E = 0.3(15) + 0.5(6) + 0.2(-10) = 4.5 + 3 - 2 = 5.5\%$ สูงกว่าทางเลือก ก ($2\%$) แต่มีโอกาสขาดทุน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.saving-investment.p013
  topics:
  - business.econ.saving-investment
  difficulty: 4
  type: numeric
  stem: จากตารางเดียวกัน ทางเลือก ข มี **พิสัย** ของผลตอบแทน (ค่าสูงสุดลบค่าต่ำสุด) กี่จุดเปอร์เซ็นต์ (ตอบเป็นจุดเปอร์เซ็นต์)
  figure:
    src: p-scenarios.svg
