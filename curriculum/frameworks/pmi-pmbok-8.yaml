# A Guide to the Project Management Body of Knowledge (PMBOK® Guide) Eighth Edition (PMI, พฤศจิกายน 2025) โครงเท่านั้น
#
# ที่มา (ตรวจเมื่อ 2026-10-24)
# - คำสั่งงานขอฉบับที่ 7 แต่ PMI ออกฉบับที่ 8 แล้วเมื่อพฤศจิกายน 2025 (หลักการ 6 ข้อ แทน 12 ข้อ, โดเมนผลการดำเนินงาน 7 โดเมน แทน 8)
#   ไฟล์นี้จึงเก็บฉบับที่ 8 และบันทึกโดเมนของฉบับที่ 7 ไว้ในหมายเหตุด้านล่างเพื่อเทียบ
# - www.pmi.org ใช้ระบบกันบอต (Cloudflare) ตอบ HTTP 403 จากเครือข่ายของเรา ชื่อหลักการ โดเมน และกลุ่มงาน (focus areas)
#   จึงตรวจจากแหล่งรองสองแห่งที่ตรงกัน (PM Study Circle และ 4PMTI) ชื่อหลักการข้อ 4 สองแหล่งเขียนต่างกัน
#   ("Lead accountably" / "Be an Accountable Leader") ต้องตรวจกับหนังสือจริงก่อนอ้างชื่อภาษาอังกฤษ
# - ฉบับที่ 7 (2021) มีโดเมน 8 โดเมน ได้แก่ Stakeholder, Team, Development Approach and Life Cycle, Planning,
#   Project Work, Delivery, Measurement, Uncertainty (ตามแหล่งรองเดียวกัน)
#
# รหัส (เราตั้งเอง): "PR1"-"PR6" หลักการ, "PD1"-"PD7" โดเมนผลการดำเนินงาน, "FA1"-"FA5" กลุ่มงาน เรียงตามลำดับในแหล่งที่ใช้
# ข้อความเป็นชื่อแปลและสรุปด้วยคำของคลังรู้
id: pmi-pmbok-8
title: "A Guide to the Project Management Body of Knowledge (PMBOK Guide), Eighth Edition"
short: PMBOK 8
kind: body-of-knowledge
subjects: [management]
language: th
sources:
  - { title: "PMBOK Guide (หน้าทางการของ PMI ตอบ HTTP 403 จากเครือข่ายของเรา)", url: "https://www.pmi.org/standards/pmbok", publisher: "Project Management Institute (PMI)", retrieved: "2026-10-24" }
  - { title: "What is New in the PMBOK Guide 8th Edition?", url: "https://pmstudycircle.com/pmbok-guide-8th-edition/", publisher: "PM Study Circle", retrieved: "2026-10-24" }
  - { title: "What Is the PMBOK 8th Edition? Principles, Domains, Focus Areas, and What Changed", url: "https://www.4pmti.com/?p=1006110", publisher: "4PMTI", retrieved: "2026-10-24" }
copyright: "© Project Management Institute สงวนสิทธิ์ (PMBOK เป็นเครื่องหมายการค้าจดทะเบียนของ PMI) หนังสือขายและแจกเฉพาะสมาชิก ไม่มีสัญญาอนุญาตให้นำไปใช้ซ้ำ ไฟล์นี้เก็บเฉพาะชื่อโครงและสรุปด้วยคำของคลังรู้"
completeness: structure-and-summary
strands:
  - id: PR
    title: หลักการ (Principles)
    standards:
      - id: PR
        text: "หลักการ 6 ข้อที่ใช้ตัดสินใจในทุกโครงการ (สรุปความ)"
        indicators:
          - { id: PR1, text: "มองภาพรวมทั้งระบบ: โครงการเป็นส่วนหนึ่งขององค์กรและสภาพแวดล้อมที่ใหญ่กว่า" }
          - { id: PR2, text: "มุ่งเน้นคุณค่า: วัดความสำเร็จจากคุณค่าที่ส่งมอบ ไม่ใช่แค่ผลผลิต" }
          - { id: PR3, text: "ฝังคุณภาพไว้ในกระบวนการและผลลัพธ์" }
          - { id: PR4, text: "เป็นผู้นำที่รับผิดชอบต่อผลการตัดสินใจ" }
          - { id: PR5, text: "บูรณาการความยั่งยืน ทั้งด้านสังคม สิ่งแวดล้อม และเศรษฐกิจ" }
          - { id: PR6, text: "สร้างวัฒนธรรมที่ให้อำนาจและความไว้วางใจแก่ทีม" }
  - id: PD
    title: โดเมนผลการดำเนินงาน (Performance Domains)
    standards:
      - id: PD
        text: "เจ็ดด้านของงานที่ต้องจัดการให้โครงการสำเร็จ (สรุปความ)"
        indicators:
          - { id: PD1, text: "ธรรมาภิบาล: โครงสร้างการตัดสินใจ อำนาจอนุมัติ และความสอดคล้องกับนโยบายองค์กร" }
          - { id: PD2, text: "ขอบเขต: กำหนดขอบเขต สิ่งส่งมอบ และความคาดหวังด้านคุณภาพ" }
          - { id: PD3, text: "กำหนดการ: ลำดับงาน ความสัมพันธ์ระหว่างงาน และกรอบเวลา" }
          - { id: PD4, text: "การเงิน: ประมาณต้นทุน งบประมาณ และติดตามค่าใช้จ่าย" }
          - { id: PD5, text: "ผู้มีส่วนได้ส่วนเสีย: ระบุ วิเคราะห์ และสร้างการมีส่วนร่วม" }
          - { id: PD6, text: "ทรัพยากร: ทีมงาน วัสดุ อุปกรณ์ และการจัดหา" }
          - { id: PD7, text: "ความเสี่ยง: ระบุ วิเคราะห์ ตอบสนอง และติดตามความเสี่ยงและโอกาส" }
  - id: FA
    title: กลุ่มงาน (Focus Areas)
    standards:
      - id: FA
        text: "ช่วงของงานตลอดอายุโครงการ (สรุปความ)"
        indicators:
          - { id: FA1, text: "การริเริ่มโครงการ" }
          - { id: FA2, text: "การวางแผน" }
          - { id: FA3, text: "การดำเนินงาน" }
          - { id: FA4, text: "การติดตามและควบคุม" }
          - { id: FA5, text: "การปิดโครงการ" }
