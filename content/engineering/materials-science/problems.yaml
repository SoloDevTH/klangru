      - { id: d, text: "บอกไม่ได้ ต้องใช้รังสีเอกซ์เท่านั้น", feedback: "การเทียบความหนาแน่นทางทฤษฎีกับค่าที่วัดได้ช่วยคัดโครงสร้างที่เป็นไปได้ได้" }
    hints:
      - "คำนวณ $\\rho = nA/(a^3 N_A)$ ของแต่ละโครงสร้าง แล้วเทียบกับค่าที่วัดได้"
      - "BCC: $n = 2$, $a = 4R/\\sqrt3$ · FCC: $n = 4$, $a = 2\\sqrt2\\,R$"
