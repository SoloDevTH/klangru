  - { title: "Date and time notation in China", url: "https://en.wikipedia.org/wiki/Date_and_time_notation_in_China", source: wikipedia-en, lang: en, license: CC-BY-SA-4.0 }
  - { title: "点", url: "https://en.wiktionary.org/wiki/点", source: wiktionary, lang: en, license: CC-BY-SA-4.0 }
