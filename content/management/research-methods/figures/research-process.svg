<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="920" height="380" font-family="sans-serif">
  <title>ลำดับการวิจัยแปดขั้น เรียงสองแถวจากซ้ายไปขวา เริ่มจากเลือกปัญหาและจบด้วยการสรุปผลพร้อมข้อจำกัด</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15211e"/></marker></defs>
<rect x="20" y="40" width="200" height="100" rx="8" fill="#eef6f3" stroke="#2f6b5e" stroke-width="2"/>
<text x="120.0" y="70.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="bold" fill="#15211e">ขั้นที่ 1</text>
<text x="120.0" y="90.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="normal" fill="#15211e">เลือกปัญหา</text>
<text x="120.0" y="110.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="normal" fill="#15211e">ที่ชัดเจนและสำคัญ</text>
<rect x="240" y="40" width="200" height="100" rx="8" fill="#eef6f3" stroke="#2f6b5e" stroke-width="2"/>
<text x="340.0" y="70.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="bold" fill="#15211e">ขั้นที่ 2</text>
<text x="340.0" y="90.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="normal" fill="#15211e">ทบทวนวรรณกรรม</text>
<text x="340.0" y="110.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="normal" fill="#15211e">และงานวิจัยที่เกี่ยวข้อง</text>
<rect x="460" y="40" width="200" height="100" rx="8" fill="#eef6f3" stroke="#2f6b5e" stroke-width="2"/>
<text x="560.0" y="70.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="bold" fill="#15211e">ขั้นที่ 3</text>
<text x="560.0" y="90.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="normal" fill="#15211e">ตั้งคำถามและ</text>
<text x="560.0" y="110.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="normal" fill="#15211e">วัตถุประสงค์</text>
<rect x="680" y="40" width="200" height="100" rx="8" fill="#eef6f3" stroke="#2f6b5e" stroke-width="2"/>
<text x="780.0" y="70.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="bold" fill="#15211e">ขั้นที่ 4</text>
<text x="780.0" y="90.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="normal" fill="#15211e">กำหนดกรอบแนวคิด</text>
<text x="780.0" y="110.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="normal" fill="#15211e">และตัวแปร</text>
<rect x="20" y="220" width="200" height="100" rx="8" fill="#eef6f3" stroke="#2f6b5e" stroke-width="2"/>
<text x="120.0" y="250.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="bold" fill="#15211e">ขั้นที่ 5</text>
<text x="120.0" y="270.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="normal" fill="#15211e">เลือกกลุ่มตัวอย่าง</text>
<text x="120.0" y="290.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="normal" fill="#15211e">และสร้างเครื่องมือ</text>
<rect x="240" y="220" width="200" height="100" rx="8" fill="#eef6f3" stroke="#2f6b5e" stroke-width="2"/>
<text x="340.0" y="250.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="bold" fill="#15211e">ขั้นที่ 6</text>
<text x="340.0" y="270.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="normal" fill="#15211e">ทดสอบเครื่องมือ</text>
<text x="340.0" y="290.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="normal" fill="#15211e">ความตรงและความเชื่อถือได้</text>
<rect x="460" y="220" width="200" height="100" rx="8" fill="#eef6f3" stroke="#2f6b5e" stroke-width="2"/>
<text x="560.0" y="250.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="bold" fill="#15211e">ขั้นที่ 7</text>
<text x="560.0" y="270.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="normal" fill="#15211e">เก็บและวิเคราะห์</text>
<text x="560.0" y="290.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="normal" fill="#15211e">ข้อมูลด้วยสถิติ</text>
<rect x="680" y="220" width="200" height="100" rx="8" fill="#eef6f3" stroke="#2f6b5e" stroke-width="2"/>
<text x="780.0" y="250.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="bold" fill="#15211e">ขั้นที่ 8</text>
<text x="780.0" y="270.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="normal" fill="#15211e">สรุปผลและ</text>
<text x="780.0" y="290.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="normal" fill="#15211e">ข้อจำกัดของการศึกษา</text>
<line x1="224" y1="90.0" x2="234" y2="90.0" stroke="#15211e" stroke-width="2" marker-end="url(#ah)"/>
<line x1="444" y1="90.0" x2="454" y2="90.0" stroke="#15211e" stroke-width="2" marker-end="url(#ah)"/>
<line x1="664" y1="90.0" x2="674" y2="90.0" stroke="#15211e" stroke-width="2" marker-end="url(#ah)"/>
<line x1="224" y1="270.0" x2="234" y2="270.0" stroke="#15211e" stroke-width="2" marker-end="url(#ah)"/>
<line x1="444" y1="270.0" x2="454" y2="270.0" stroke="#15211e" stroke-width="2" marker-end="url(#ah)"/>
<line x1="664" y1="270.0" x2="674" y2="270.0" stroke="#15211e" stroke-width="2" marker-end="url(#ah)"/>
<path d="M780.0,143 V180.0 H120.0 V214" fill="none" stroke="#15211e" stroke-width="2" marker-end="url(#ah)"/>
<text x="450.0" y="172.0" text-anchor="middle" font-size="13" fill="#4a5b56">จากกรอบแนวคิดสู่การเลือกกลุ่มตัวอย่างและเครื่องมือ</text>
</svg>
