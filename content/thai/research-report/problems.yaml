problems:
- id: thai.composition.research-report.p001
  topics:
  - thai.composition.research-report
  difficulty: 1
  type: order
  stem: เรียงขั้นตอนการศึกษาค้นคว้าเพื่อทำรายงาน
  items:
  - เลือกเรื่องและตั้งคำถามให้แคบ
  - วางโครงเรื่อง
  - ค้นและประเมินแหล่งข้อมูล
  - บันทึกการศึกษาค้นคว้าพร้อมที่มา
  - เขียนร่างด้วยภาษาของตนเอง
  - อ้างอิง ตรวจทาน และจัดรูปเล่ม
  hints:
  - ต้องรู้ว่าจะตอบคำถามอะไรก่อนค้น
  - บันทึกก่อนเขียน อ้างอิงและตรวจทานเป็นขั้นท้าย
  solution: ตั้งคำถาม → วางโครงเรื่อง → ค้นและประเมินแหล่ง → บันทึก → เขียนร่าง → อ้างอิงและตรวจทาน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.research-report.p002
  topics:
  - thai.composition.research-report
  difficulty: 1
  type: match
  stem: จับคู่ส่วนประกอบของรายงานกับสิ่งที่อยู่ในส่วนนั้น
  pairs:
  - left: คำนำ
    right: จุดประสงค์และขอบเขตของรายงาน
  - left: สารบัญ
    right: หัวข้อและเลขหน้า
  - left: บรรณานุกรม
    right: รายการแหล่งข้อมูลที่อ้างอิงในเนื้อหา
  - left: ภาคผนวก
    right: แบบสำรวจ ภาพ และตารางข้อมูลเพิ่มเติม
  hints:
  - คำนำอยู่ส่วนนำ บอกว่ารายงานนี้ทำเพื่ออะไร
  - ส่วนท้ายมีสองอย่าง แหล่งอ้างอิงกับเอกสารประกอบ
  solution: คำนำ → จุดประสงค์และขอบเขต · สารบัญ → หัวข้อและเลขหน้า · บรรณานุกรม → แหล่งที่อ้างอิง · ภาคผนวก → เอกสารประกอบ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.research-report.p003
  topics:
  - thai.composition.research-report
  difficulty: 1
  type: text
  stem: การนำงานหรือความคิดของผู้อื่นมาเสนอเหมือนเป็นของตนเอง โดยไม่บอกที่มา เรียกว่าอะไร
  accepted:
  - การลอกเลียนวรรณกรรม
  - ลอกเลียนวรรณกรรม
  - โจรกรรมทางวรรณกรรม
  - การลอกเลียนผลงาน
  - ลอกเลียนผลงาน
  - การลอกเลียนข้อมูลวิชาการ
  - plagiarism
  misconceptions:
  - match: การถอดความ
    feedback: การถอดความที่บอกที่มาเป็นวิธีที่ถูกต้อง
  - match: การอ้างอิง
    feedback: การอ้างอิงคือการบอกที่มา ซึ่งเป็นทางป้องกัน
  hints:
  - เป็นการกระทำที่ต้องหลีกเลี่ยง
  - ขึ้นต้นด้วย การลอก...
  solution: เรียกว่า **การลอกเลียนวรรณกรรม** (โจรกรรมทางวรรณกรรม plagiarism)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.research-report.p004
  topics:
  - thai.composition.research-report
  difficulty: 2
  type: mcq
  stem: ทำรายงานเรื่องป่าชายเลนในตำบลของตน (สมมติ) ข้อใดเป็น **แหล่งข้อมูลปฐมภูมิ**
  choices:
  - id: a
    text: หนังสือเรื่องป่าชายเลนของไทย
    feedback: เป็นแหล่งทุติยภูมิ ผู้เขียนเรียบเรียงจากแหล่งอื่น
  - id: b
    text: บทความสารานุกรมออนไลน์
    feedback: เป็นแหล่งทุติยภูมิ
  - id: c
    text: รายงานของรุ่นพี่ที่สรุปจากหนังสือ
    feedback: เป็นแหล่งที่เรียบเรียงจากแหล่งอื่นอีกทอดหนึ่ง
  - id: d
    text: สัมภาษณ์ผู้ใหญ่บ้านที่ดูแลการปลูกป่าชายเลนในตำบล
    correct: true
    feedback: ถูก เป็นข้อมูลจากต้นทางที่ผู้จัดทำเก็บเอง
  hints:
  - ปฐมภูมิ = ข้อมูลจากต้นทาง
  - ใครเป็นคนเก็บข้อมูลนี้โดยตรง
  solution: '**การสัมภาษณ์ผู้ใหญ่บ้าน** เป็นข้อมูลปฐมภูมิ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.research-report.p005
  topics:
  - thai.composition.research-report
  difficulty: 2
  type: mcq
  stem: คำถามการศึกษาค้นคว้าข้อใด **เหมาะ** ที่สุดสำหรับรายงานความยาว 8 หน้า
  choices:
  - id: a
    text: สิ่งแวดล้อมของโลก
    feedback: กว้างเกินไปสำหรับ 8 หน้า
  - id: b
    text: พลาสติก
    feedback: เป็นหัวข้อ ไม่ใช่คำถาม และกว้างมาก
  - id: c
    text: ขยะพลาสติกในคลองหน้าโรงเรียนมาจากแหล่งใดมากที่สุด
    correct: true
    feedback: ถูก แคบ ตอบได้ด้วยการสำรวจและค้นคว้า
  - id: d
    text: ทำไมทุกคนไม่รักษ์โลก
    feedback: เหมารวม ตอบด้วยหลักฐานไม่ได้
  hints:
  - คำถามที่ดีแคบพอจะตอบได้
  - ตอบได้ด้วยข้อมูลหรือไม่
  solution: คำถามเรื่อง **แหล่งที่มาของขยะในคลองหน้าโรงเรียน** แคบและตอบได้ด้วยข้อมูล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.research-report.p006
  topics:
  - thai.composition.research-report
  difficulty: 2
  type: mcq
  stem: ข้อใดเขียนด้วย **ภาษาเชิงวิชาการ** เหมาะกับรายงานมากที่สุด
  choices:
  - id: a
    text: ขยะในคลองเยอะมากกก ดูแล้วเศร้าเลย
    feedback: ภาษาพูดและอารมณ์
  - id: b
    text: จากการสำรวจ 5 วัน ผู้จัดทำพบขวดพลาสติกในคลองเฉลี่ยวันละ 42 ขวด
    correct: true
    feedback: ถูก ภาษาทางการ มีตัวเลขและที่มาของข้อมูล
  - id: c
    text: พวกเราไปดูมา ขวดเพียบเลยจ้า
    feedback: ภาษาพูด ไม่มีข้อมูลที่ชัด
  - id: d
    text: ใคร ๆ ก็รู้ว่าคลองสกปรก
    feedback: เหมารวม ไม่มีหลักฐาน
  hints:
  - ภาษาวิชาการไม่ใช้คำสแลงและคำแสดงอารมณ์
  - ข้อมูลควรมีตัวเลขและที่มา
  solution: ข้อแรก **ภาษาทางการ มีตัวเลข และบอกที่มา**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.research-report.p007
  topics:
  - thai.composition.research-report
  difficulty: 3
  type: mcq
  stem: ดูบัตรบันทึกในภาพ ต้องเพิ่มอะไรเพื่อให้อ้างอิงข้อความนี้ได้ถูกต้อง
  figure:
    src: note-card.svg
    alt: บัตรบันทึกสมมติ หัวข้อ รากของต้นโกงกาง ข้อความในเครื่องหมายอัญประกาศ รากค้ำยันช่วยดักตะกอนและลดความแรงของคลื่นที่ซัดเข้าฝั่ง ที่มา หนังสือ ป่าชายเลนกับชายฝั่งไทย สำนักพิมพ์สมมติ ไม่มีชื่อผู้แต่ง ไม่มีปีที่พิมพ์ และไม่มีเลขหน้า
  choices:
  - id: a
    text: ชื่อผู้แต่ง ปีที่พิมพ์ และเลขหน้า
    correct: true
    feedback: ถูก เป็นข้อความที่คัดลอกมา จึงต้องมีเลขหน้าด้วย
  - id: b
    text: ไม่ต้องเพิ่ม เพราะมีชื่อหนังสือแล้ว
    feedback: อ้างอิงแบบนาม-ปีต้องมีชื่อผู้แต่งและปี
  - id: c
    text: ลบเครื่องหมายอัญประกาศออก
    feedback: ข้อความคัดลอกต้องมีอัญประกาศ
  - id: d
    text: ความเห็นของผู้จัดทำเกี่ยวกับรากโกงกาง
    feedback: ความเห็นเขียนแยกได้ แต่ไม่ช่วยให้อ้างอิงได้
  hints:
  - อ้างอิงในเนื้อหาแบบนาม-ปีต้องมีอะไรบ้าง
  - ข้อความในอัญประกาศเป็นการคัดลอก ต้องบอกตำแหน่งในหนังสือ
  solution: ต้องเพิ่ม **ชื่อผู้แต่ง ปีที่พิมพ์ และเลขหน้า** จึงอ้างได้ เช่น (ชื่อ นามสกุล, ปี, น. ...)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.research-report.p008
  topics:
  - thai.composition.research-report
  difficulty: 3
  type: mcq
  stem: ต้นฉบับ (สมมติ) "ป่าชายเลนเป็นแหล่งอนุบาลสัตว์น้ำวัยอ่อน เพราะรากที่ซับซ้อนเป็นที่หลบภัยจากผู้ล่า" ข้อใดเป็น **การถอดความ** ที่ถูกต้อง
  choices:
  - id: a
    text: ป่าชายเลนเป็นแหล่งอนุบาลสัตว์น้ำวัยอ่อน เพราะรากที่ซับซ้อนเป็นที่หลบภัยจากศัตรู
    feedback: เปลี่ยนคำเดียว ยังเป็นการลอกเลียน และไม่อ้างที่มา
  - id: b
    text: ลูกสัตว์น้ำจำนวนมากเติบโตในป่าชายเลน เพราะซ่อนตัวจากผู้ล่าระหว่างรากไม้ได้
    feedback: ถอดความดี แต่ไม่บอกที่มา จึงยังเป็นการลอกเลียนความคิด
  - id: c
    text: ป่าชายเลนสำคัญที่สุดในโลก (มาลี ทะเลงาม, 2565)
    feedback: ความหมายเปลี่ยนและเกินต้นฉบับ
  - id: d
    text: ลูกสัตว์น้ำจำนวนมากเติบโตในป่าชายเลน เพราะซ่อนตัวจากผู้ล่าระหว่างรากไม้ได้ (มาลี ทะเลงาม, 2565)
    correct: true
    feedback: ถูก เรียบเรียงใหม่ทั้งประโยค ความหมายเท่าเดิม และอ้างที่มา
  hints:
  - ถอดความต้องเปลี่ยนรูปประโยคจริง ๆ
  - ถอดความแล้วต้องอ้างที่มาด้วยหรือไม่
  solution: การถอดความที่ถูก **เรียบเรียงใหม่ ความหมายเท่าเดิม และอ้างที่มา**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.research-report.p009
  topics:
  - thai.composition.research-report
  difficulty: 3
  type: order
  stem: เรียงรายการบรรณานุกรม (แหล่งสมมติ) ตามหลักที่เรียนมา
  items:
  - กมล ป่าใหญ่. (2566).
  - ชนิดา รักษ์น้ำ. (2564).
  - เด่นชัย ชายหาด. (2563).
  - ปรีดา ใบเขียว. (2565).
  - Smith, J. (2020).
  hints:
  - ภาษาไทยก่อน ภาษาอังกฤษทีหลัง
  - เรียงตามพยัญชนะต้น ไม่นับสระหน้า เด่นชัย อยู่หมวด ด
  solution: กมล (ก) → ชนิดา (ช) → เด่นชัย (ด) → ปรีดา (ป) → Smith (ภาษาอังกฤษไว้ท้าย) ไม่เรียงตามปี
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.research-report.p010
  topics:
  - thai.composition.research-report
  difficulty: 3
  type: numeric
  stem: บทที่ 4 ของรายงานโครงงาน (สมมติ) สำรวจนักเรียน 120 คน มี 84 คนนำกล่องข้าวมาเอง คิดเป็นร้อยละเท่าไร
  answer:
    value: 70
    unit: '%'
  misconceptions:
  - match: 142.86
    feedback: หารกลับด้าน ต้องเป็น 84 ÷ 120
  - match: 84
    feedback: เป็นจำนวนคน ยังไม่ได้คิดเป็นร้อยละ
  hints:
  - ร้อยละ = ส่วน ÷ ทั้งหมด × 100
  - 84 ÷ 120 × 100
  solution: $84 \div 120 \times 100 = 70$ ร้อยละ ในรายงานเขียนว่า "ร้อยละ 70 ของผู้ตอบ (84 จาก 120 คน)"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.research-report.p011
  topics:
  - thai.composition.research-report
  difficulty: 3
  type: mcq
  stem: ข้อใดเป็น **บันทึกการศึกษาค้นคว้าเพื่อพัฒนาตนเอง** ที่ดีที่สุด
  choices:
  - id: a
    text: 12 ก.ค. อ่านเรื่องการกัดเซาะชายฝั่งจากหนังสือของกมล ป่าใหญ่ (สมมติ) ได้รู้ว่ารากค้ำยันลดแรงคลื่น สงสัยว่าป่าต้องกว้างเท่าไรจึงได้ผล พรุ่งนี้จะหาข้อมูลเรื่องนี้
    correct: true
    feedback: ถูก มีวันที่ แหล่ง สิ่งที่ได้เรียนรู้ คำถามใหม่ และสิ่งที่จะทำต่อ
  - id: b
    text: วันนี้อ่านหนังสือ
    feedback: ไม่บอกเรื่อง แหล่ง หรือสิ่งที่ได้เรียนรู้
  - id: c
    text: ป่าชายเลนดีมาก
    feedback: เป็นความเห็นสั้น ๆ ไม่มีรายละเอียด
  - id: d
    text: คัดลอกบทที่ 1 ของหนังสือมาทั้งบท
    feedback: เป็นการคัดลอก ไม่ใช่การบันทึกการเรียนรู้ของตน
  hints:
  - บันทึกเพื่อพัฒนาตนเองช่วยวางแผนครั้งต่อไป
  - มีคำถามใหม่และสิ่งที่จะทำต่อหรือไม่
  solution: ข้อแรกมี **วันที่ แหล่ง สิ่งที่ได้เรียนรู้ คำถามใหม่ และแผนต่อไป**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.research-report.p012
  topics:
  - thai.composition.research-report
  difficulty: 4
  type: mcq
  stem: ดูบรรณานุกรมในภาพ รายการใด **ไม่ครบ** ตามรูปแบบในบทเรียน
  figure:
    src: bib-draft.svg
    alt: บรรณานุกรมฉบับร่าง แหล่งข้อมูลสมมติ 4 รายการ 1 กมล ป่าใหญ่. (2566). การกัดเซาะชายฝั่ง. สำนักพิมพ์สมมติ. 2 ชนิดา รักษ์น้ำ. นกในป่าชายเลน. สำนักพิมพ์สมมติ. (ไม่มีวงเล็บปี) 3 เด่นชัย ชายหาด. (2563). ปูแสมกับระบบนิเวศ. สำนักพิมพ์สมมติ. 4 Lee, A. (2021). Mangrove forests. Example Press. ชื่อหนังสือทุกรายการเป็นตัวเอียง
  choices:
  - id: a
    text: รายการที่ 3 เพราะ เด่นชัย ต้องอยู่หมวด เ
    feedback: เรียงตามพยัญชนะต้น เด่นชัย อยู่หมวด ด ถูกแล้ว
  - id: b
    text: รายการที่ 4 เพราะภาษาอังกฤษต้องอยู่ก่อน
    feedback: แหล่งภาษาไทยอยู่ก่อนภาษาอังกฤษ
  - id: c
    text: รายการที่ 1 เพราะชื่อหนังสือเป็นตัวเอียง
    feedback: ชื่อหนังสือเป็นตัวเอียงถูกแล้ว
  - id: d
