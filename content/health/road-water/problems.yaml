      - { id: b, text: "สวมหมวกนิรภัยขณะปั่นจักรยาน และขี่ชิดซ้ายเป็นแถวเดียว", correct: true }
      - { id: c, text: "เปลี่ยนไปเล่นน้ำในสระที่มีเจ้าหน้าที่ดูแล หรือถ้าลงน้ำต้องสวมเสื้อชูชีพและมีผู้ใหญ่เฝ้า", correct: true }
      - { id: d, text: "ให้คนที่ว่ายน้ำเก่งที่สุดในกลุ่มคอยช่วยคนอื่นแทนผู้ใหญ่", feedback: "เด็กที่ว่ายน้ำเก่งก็จมน้ำได้เมื่อลงไปช่วย ต้องมีผู้ใหญ่ดูแล" }
      - { id: e, text: "ไปตอนเย็นใกล้ค่ำ จะได้ไม่ร้อน", feedback: "ตอนใกล้ค่ำมองเห็นยาก ทั้งบนถนนและในน้ำ และกลับบ้านในที่มืด" }
    hints:
