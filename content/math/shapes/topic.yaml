id: math.geometry.shapes
subject: math
title: { th: รูปเรขาคณิตสองมิติและสามมิติ, en: 2-D and 3-D shapes }
summary: จำแนกรูปสามเหลี่ยม สี่เหลี่ยม รูปหลายเหลี่ยม วงกลม วงรี และรูปสามมิติ เช่น ทรงกระบอก กรวย ปริซึม พีระมิด พร้อมบอกหน้า สัน จุดยอด และฐาน
difficulty: 1
minutes: 30
prerequisites: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: solids-gallery.svg
    alt: "รูปสามมิติเจ็ดรูปพร้อมชื่อ: ทรงสี่เหลี่ยมมุมฉาก ลูกบาศก์ ทรงกระบอกที่มีหน้าวงกลมบนและล่าง ทรงกลม กรวยที่มีฐานวงกลมและยอดแหลม ปริซึมสามเหลี่ยมที่มีหน้าสามเหลี่ยมหน้าและหลัง และพีระมิดฐานสี่เหลี่ยมจัตุรัสที่มีหน้าข้างสามเหลี่ยมพบกันที่ยอด สันที่ซ่อนอยู่ด้านหลังวาดเป็นเส้นประ"
    caption: "รูปสามมิติที่พบบ่อย เส้นประคือสันหรือขอบที่ซ่อนอยู่ด้านหลัง"
  - type: figure
    src: cuboid-parts.svg
    alt: "ทรงสี่เหลี่ยมมุมฉากมีลูกศรชี้ส่วนประกอบสามอย่าง: หน้า คือผิวแบนด้านหน้า สัน คือเส้นขอบด้านบนของหน้าด้านหน้า และจุดยอด คือมุมบนขวาด้านหลัง"
    caption: "หน้าคือผิวแบน สันคือเส้นที่หน้าสองหน้ามาพบกัน จุดยอดคือมุมที่สันมาพบกัน"
  - { type: check, problem: math.geometry.shapes.p005, prompt: "ลองนับสันจากภาพ" }
  - type: worked-example
    title: บรรยายกระป๋องนมด้วยภาษาเรขาคณิต
    problem: "กระป๋องนมเป็นรูปสามมิติชนิดใด มีหน้า สัน และจุดยอดเท่าไร และถ้ากดด้านล่างลงบนหมึกแล้วประทับบนกระดาษ จะได้รูปอะไร"
    steps:
      - text: "กระป๋องกลิ้งได้และวางตั้งได้ ด้านบนและด้านล่างแบน ส่วนรอบข้างโค้ง จึงเป็นทรงกระบอก"
      - text: "หน้าแบนมี 2 หน้า คือฝาบนและก้นกระป๋อง ส่วนรอบข้างเป็นผิวโค้ง 1 ผิว"
        why: "หน้าต้องแบนราบ ผิวที่โค้งไม่นับเป็นหน้า"
      - text: "สันคือขอบที่หน้าแบนพบกับผิวโค้ง มี 2 เส้น และเป็นเส้นโค้ง"
      - text: "ไม่มีมุมแหลมที่ใดเลย จึงไม่มีจุดยอด"
      - text: "ก้นกระป๋องเป็นหน้าวงกลม รอยที่ประทับจึงเป็นวงกลม"
    answer: "ทรงกระบอก มีหน้า 2 หน้า (และผิวโค้ง 1 ผิว) สัน 2 เส้น ไม่มีจุดยอด รอยประทับเป็นวงกลม"
  - type: worked-example
    title: นับส่วนประกอบของปริซึมห้าเหลี่ยม
    problem: "ปริซึมห้าเหลี่ยมมีหน้า สัน และจุดยอดอย่างละกี่"
    steps:
      - text: "ฐานเป็นรูปห้าเหลี่ยม จึงมี $n = 5$"
      - text: "หน้า: ฐาน 2 ฐาน กับหน้าข้างหนึ่งหน้าต่อหนึ่งด้านของฐาน ได้ $5 + 2 = 7$ หน้า"
        why: "ด้านแต่ละด้านของฐานล่างเชื่อมกับด้านที่ตรงกันของฐานบน เกิดเป็นหน้าข้างหนึ่งหน้า"
      - text: "สัน: รอบฐานบน 5 รอบฐานล่าง 5 และสันแนวตั้ง 5 รวม $3 \\times 5 = 15$ สัน"
      - text: "จุดยอด: มุมของฐานบน 5 กับฐานล่าง 5 รวม $2 \\times 5 = 10$ จุด"
    answer: "7 หน้า 15 สัน 10 จุดยอด"
  - { type: check, problem: math.geometry.shapes.p013, prompt: "อะไรเปลี่ยนชนิดของรูปได้บ้าง" }
glossary:
  - { term: รูปเรขาคณิตสองมิติ, definition: "รูปแบนราบที่วาดบนกระดาษได้ มีแค่ความกว้างและความยาว" }
  - { term: รูปเรขาคณิตสามมิติ, definition: "รูปที่มีความกว้าง ความยาว และความสูง (ความหนา)" }
  - { term: รูปหลายเหลี่ยม, definition: "รูปปิดที่ทุกด้านเป็นส่วนของเส้นตรง เรียกชื่อตามจำนวนด้าน" }
  - { term: หน้า, definition: "ผิวแบนราบของรูปสามมิติ" }
  - { term: สัน, definition: "เส้นที่หน้าสองหน้า (หรือหน้ากับผิวโค้ง) มาพบกัน" }
  - { term: จุดยอด, definition: "จุดที่ด้านหรือสันมาพบกันเป็นมุม" }
  - { term: ปริซึม, definition: "รูปสามมิติที่มีฐานสองฐานเป็นรูปหลายเหลี่ยมเท่ากันทุกประการและขนานกัน หน้าข้างเป็นรูปสี่เหลี่ยม" }
  - { term: พีระมิด, definition: "รูปสามมิติที่มีฐานเป็นรูปหลายเหลี่ยม หน้าข้างเป็นรูปสามเหลี่ยมที่มาพบกันที่ยอดจุดเดียว" }
flashcards:
  - { front: "ทรงสี่เหลี่ยมมุมฉากมีหน้า สัน จุดยอดเท่าไร", back: "6 หน้า 12 สัน 8 จุดยอด" }
  - { front: "ปริซึมกับพีระมิดต่างกันอย่างไร", back: "ปริซึมมีฐานสองฐาน หน้าข้างเป็นสี่เหลี่ยม พีระมิดมีฐานเดียว หน้าข้างเป็นสามเหลี่ยมพบกันที่ยอด" }
  - { front: "ปริซึมฐาน $n$ เหลี่ยม", back: "หน้า $n + 2$ สัน $3n$ จุดยอด $2n$" }
  - { front: "พีระมิดฐาน $n$ เหลี่ยม", back: "หน้า $n + 1$ สัน $2n$ จุดยอด $n + 1$" }
  - { front: "สิ่งใดไม่เปลี่ยนชนิดของรูป", back: "สี ขนาด และการหมุน" }
