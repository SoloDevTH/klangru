# หัวข้อในคลังที่สอนหัวข้อย่อยของ BoK ของ ASQ บางส่วน ทุกแถวเป็น partial เพราะ BoK ระดับวิชาชีพลึกกว่าบทเรียนแนะนำ
framework: asq-quality-bok
mappings:
  - topic: management.quality.concepts
    indicators: ["CQE I.A", "CQE II.C", "CQE II.E", "CQE V.C"]
    coverage: partial
    note: "I.A: ความหมายคุณภาพตาม Juran และ Crosby และวงจรเดมมิง II.C: ภาพรวม ISO 9001 และหลักการ ISO 9000 (ยังไม่มีเกณฑ์ Baldrige) II.E: ต้นทุนคุณภาพสี่กลุ่ม ร้อยละของยอดขาย และการเทียบทางเลือก ยังไม่มีการเก็บข้อมูลและรายงานต้นทุนคุณภาพ V.C: TQM และ PDCA (ไคเซ็นอยู่ใน management.operations.lean ยังไม่มีซิกซ์ซิกมา)"
  - topic: management.quality.qc-tools
    indicators: ["CQE V.A", "CQE VI.F", "CSSGB VI.A", "CMQOE IV.A"]
    coverage: partial
    note: "สอนใบตรวจสอบ พาเรโต ก้างปลา ฮิสโทแกรม แผนภาพการกระจาย การแบ่งชั้น และแผนภูมิควบคุมค่าเดี่ยว x-bar และ p ระดับแนะนำ ยังไม่มีผังงาน (flowchart) แผนภูมิ R, s, c, u กฎการอ่านแผนภูมิครบชุด และการศึกษาความสามารถของกระบวนการ"
  - topic: management.operations.lean
    indicators: ["CQE V.D", "CSSGB I.B", "CSSGB V.C"]
    coverage: partial
    note: "สอน 5ส แผนผังสายธารคุณค่าอย่างง่าย ความสูญเปล่า 8 ประการ เวลาแท็กต์ สมดุลสาย ไคเซ็น และผลิตภาพ ยังไม่มีคัมบัง การควบคุมด้วยสายตา งานมาตรฐาน SMED และไคเซ็นแบบเร่งรัด (kaizen blitz)"
  - topic: management.operations.maintenance-reliability
    indicators: [CQE III.E]
    coverage: full
    note: ความเชื่อถือได้ เส้นโค้งอ่างอาบน้ำ R(t) MTBF MTTR ความพร้อมใช้ ระบบอนุกรมและขนาน และรูปแบบการบำรุงรักษา
  - topic: management.operations.maintenance-reliability
    indicators: [CSSGB VI.C]
    coverage: partial
    note: TPM การควบคุมด้วยสายตา งานมาตรฐาน และ OEE ส่วนเครื่องมือลีนอื่น (คัมบัง SMED ป้องกันความผิดพลาดแบบละเอียด) ยังไม่ได้สอน
  - topic: management.org.leadership-motivation
    indicators: [CMQOE I.B]
    coverage: partial
    note: บทบาทของผู้นำและการสร้างแรงจูงใจ ส่วนการจัดการการเปลี่ยนแปลงอยู่ใน organizational-behavior
  - topic: management.org.leadership-motivation
    indicators: [CMQOE I.C, CQE I.D, CQE I.E]
    coverage: full
    note: ขั้นพัฒนาการของทีม บทบาทในทีม และเทคนิคการทำงานของทีม
  - topic: management.principles.organizing
    indicators: [CMQOE I.A]
    coverage: full
    note: การแบ่งงาน การจัดแผนก สายและช่วงการบังคับบัญชา การรวมและกระจายอำนาจ หน่วยหลักและที่ปรึกษา และโครงสร้างตามหน้าที่ ผลิตภัณฑ์ พื้นที่ เมทริกซ์ พร้อมการเลือกโครงสร้าง (p015 p018)
  - topic: management.principles.planning-decision
    indicators: [CMQOE III.A]
    coverage: partial
    note: สอนทักษะการวางแผน (ประเภทแผน SMART) และการตัดสินใจเชิงปริมาณ ส่วนทักษะการจัดการอื่น เช่น การจัดการทรัพยากร การเจรจา อยู่ในหัวข้ออื่น
  - topic: management.quality.acceptance-sampling
    indicators: [CQE IV.C]
    coverage: full
    note: แผนเชิงเดี่ยว Pa จากทวินาม ปัวซง ไฮเพอร์จีโอเมตริก เส้นโค้ง OC AQL LTPD α β AOQ AOQL ATI แผนเชิงคู่และแผนมาตรฐาน (กล่าวถึง)
  - topic: management.quality.acceptance-sampling
    indicators: [CQE IV.A, CQE IV.B, CMQOE VI.G]
    coverage: partial
    note: สอนองค์ประกอบของแผนควบคุมและแผนรับมือ (p018) วิธีควบคุมอื่นอยู่ใน spc
  - topic: management.quality.iso-management-systems
    indicators: [CQE I.B, CQE II.C, CMQOE III.D, CMQOE III.E, CQE II.D]
    coverage: partial
    note: สอนนโยบายและวัตถุประสงค์คุณภาพของระบบ ยังไม่ได้สอนการถ่ายทอดแผนกลยุทธ์และระบบสารสนเทศคุณภาพ
  - topic: management.quality.iso-management-systems
    indicators: [CQE II.A, CQE II.B, CQE V.E, CQE V.F]
    coverage: full
    note: องค์ประกอบของระบบบริหารคุณภาพตามข้อ 4–10
  - topic: management.quality.quality-planning
    indicators: [CQE III.A, CMQOE V.B]
    coverage: partial
    note: สอน CTQ และการจัดความต้องการตามแบบจำลองคาโน ยังไม่ได้สอนการจัดระดับความรุนแรงของคุณลักษณะ (critical/major/minor)
  - topic: management.quality.quality-planning
    indicators: [CQE III.B, CQE III.D, CQE I.G, CSSGB II.B, CMQOE V.A]
    coverage: full
    note: ข้อมูลนำเข้าการออกแบบ QFD/บ้านแห่งคุณภาพ ข้อกำหนดและพิกัดความเผื่อ และการทบทวนการออกแบบ (p014)
  - topic: management.quality.spc
    indicators: [CQE VI.F, CSSGB VI.A, CSSGB VI.B]
    coverage: full
