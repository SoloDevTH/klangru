id: physics.dynamics.inclined-plane
subject: physics
title: { th: วัตถุบนพื้นเอียง, en: Objects on an inclined plane }
summary: แยกน้ำหนักเป็นองค์ประกอบขนานและตั้งฉากกับพื้นเอียง หาแรงปฏิกิริยาตั้งฉาก ความเร่งของวัตถุที่ไถลลงทั้งแบบไม่มีและมีแรงเสียดทาน และมุมที่วัตถุเริ่มไถล
difficulty: 6
minutes: 40
prerequisites: [physics.dynamics.friction, physics.units.vectors]
encompasses:
  - { id: physics.dynamics.friction, weight: 0.5 }
  - { id: physics.units.vectors, weight: 0.4 }
  - { id: physics.dynamics.weight-normal, weight: 0.3 }
  - { id: math.geometry.trig-ratios, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: incline-fbd.svg
    alt: "กล่องบนพื้นเอียงมุม θ ที่ลาดลงไปทางขวา กำลังไถลลง มีแรงจริงสามแรงจากจุดกลางกล่อง: น้ำหนัก mg ชี้ลงในแนวดิ่ง แรงปฏิกิริยาตั้งฉาก N ชี้ออกจากผิวพื้นตั้งฉากกับพื้น และแรงเสียดทานจลน์ f_k ชี้ขึ้นตามพื้น น้ำหนักแยกเป็นองค์ประกอบเส้นประสองเส้น คือ mg sin θ ชี้ลงตามพื้น และ mg cos θ ชี้เข้าหาพื้น โดยมุมระหว่าง mg กับองค์ประกอบ mg cos θ เท่ากับมุม θ ของพื้นเอียง ลูกศร N ยาวเท่ากับ mg cos θ"
    caption: "เอียงแกนตามพื้น: $N$ และ $f_k$ อยู่บนแกนพอดี เหลือแค่ $mg$ ที่ต้องแยกเป็น $mg\\sin\\theta$ กับ $mg\\cos\\theta$"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: กล่องไถลลงพื้นเอียงลื่นใช้เวลาเท่าใด
    problem: "กล่องมวล $6\\ \\mathrm{kg}$ เริ่มไถลจากหยุดนิ่งที่ด้านบนของพื้นเอียงลื่นมุม $35^\\circ$ ยาว $2.5\\ \\mathrm{m}$ กล่องใช้เวลากี่วินาทีจึงถึงปลายล่าง ($g = 9.8\\ \\mathrm{m/s^2}$)"
    steps:
      - text: "แรงที่ทำให้กล่องเร่งตามพื้นมีแค่ $mg\\sin 35^\\circ$ จึงได้ $a = g\\sin 35^\\circ = 9.8 \\times 0.5736 \\approx 5.62\\ \\mathrm{m/s^2}$"
        why: "พื้นลื่นไม่มีแรงเสียดทาน ส่วน $N$ กับ $mg\\cos\\theta$ อยู่ในแนวตั้งฉากและหักล้างกัน มวล $6\\ \\mathrm{kg}$ จึงไม่ต้องใช้"
      - text: "การเคลื่อนที่ตามพื้นเป็นแนวตรงด้วยความเร่งคงตัว รู้ $u = 0$, $s = 2.5\\ \\mathrm{m}$ และ $a$ ต้องการ $t$ ใช้ $s = ut + \\tfrac12 at^2$"
      - text: "$2.5 = \\tfrac12 (5.62)\\,t^2$ → $t^2 = \\dfrac{5}{5.62} \\approx 0.890$ → $t \\approx 0.943\\ \\mathrm{s}$"
        why: "ระยะ $s$ ต้องวัดตามแนวพื้นเอียง ซึ่งเป็นแนวเดียวกับความเร่ง ไม่ใช่ความสูงของพื้นเอียง"
    answer: "ประมาณ $0.94\\ \\mathrm{s}$ (กล่องหนักหรือเบาก็ใช้เวลาเท่ากัน)"
  - { type: check, problem: phy.incl.p002, prompt: "ลองแยกน้ำหนักเองก่อนอ่านตัวอย่างถัดไป" }
  - type: worked-example
    title: ไถลขึ้นไปได้ไกลเท่าใด แล้วจะไถลกลับหรือไม่
    problem: "ผลักกล่องให้ไถลขึ้นพื้นเอียงมุม $25^\\circ$ ด้วยอัตราเร็วต้น $5\\ \\mathrm{m/s}$ สัมประสิทธิ์ความเสียดทานจลน์ $\\mu_k = 0.3$ และสถิต $\\mu_s = 0.4$ กล่องไถลขึ้นไปได้ไกลเท่าใดตามพื้น และเมื่อหยุดแล้วจะไถลกลับลงมาหรือไม่"
    steps:
      - text: "ขณะไถลขึ้น ทั้ง $mg\\sin\\theta$ และแรงเสียดทาน $\\mu_k mg\\cos\\theta$ ชี้ลงตามพื้น"
        why: "แรงเสียดทานต้านการเคลื่อนที่ กล่องกำลังขึ้น แรงเสียดทานจึงชี้ลง"
      - text: "ความหน่วง $a = g(\\sin 25^\\circ + 0.3\\cos 25^\\circ) = 9.8\\,(0.4226 + 0.2719) \\approx 6.81\\ \\mathrm{m/s^2}$"
      - text: "หยุดเมื่อ $v = 0$: $0 = 5^2 - 2(6.81)s$ → $s = \\dfrac{25}{13.61} \\approx 1.84\\ \\mathrm{m}$"
      - text: "เมื่อหยุด เทียบ $\\tan 25^\\circ \\approx 0.466$ กับ $\\mu_s = 0.4$ เพราะ $\\tan\\theta > \\mu_s$ แรงเสียดทานสถิตสูงสุดรับ $mg\\sin\\theta$ ไม่ไหว กล่องจึงไถลกลับลง"
        why: "เงื่อนไขวางนิ่งได้คือ $mg\\sin\\theta \\le \\mu_s mg\\cos\\theta$ หรือ $\\tan\\theta \\le \\mu_s$"
      - text: "ขาลงแรงเสียดทานกลับทิศมาชี้ขึ้น: $a = 9.8\\,(0.4226 - 0.2719) \\approx 1.48\\ \\mathrm{m/s^2}$ น้อยกว่าขาขึ้นมาก"
    answer: "ไถลขึ้นได้ประมาณ $1.84\\ \\mathrm{m}$ แล้วไถลกลับลงด้วยความเร่งประมาณ $1.48\\ \\mathrm{m/s^2}$"
  - { type: check, problem: phy.incl.p005, prompt: "กล่องหนักกับกล่องเบา ใครถึงก่อน" }
  - type: interactive
    title: แยกน้ำหนักบนพื้นเอียง 30° เป็นสององค์ประกอบ
    caption: "พื้นเอียงทำมุม 30° ลาดลงไปทางขวา ลูกศร a คือองค์ประกอบของน้ำหนักที่ขนานกับพื้นเอียง (mg sin 30° = 2 หน่วย ชี้ลงตามพื้น) ลูกศร b คือองค์ประกอบที่ตั้งฉากกับพื้นเอียง (mg cos 30° ≈ 3.46 หน่วย ชี้เข้าหาพื้น) ผลรวมของสองลูกศรคือน้ำหนัก mg = 4 หน่วย ชี้ลงตรง ๆ สังเกตว่าลูกศร a กับ b ตั้งฉากกัน"
    widget: { kind: vector-add, a: [1.732, -1], b: [-1.732, -3], draggable: false }
  - type: interactive
    title: ความเร่งตามพื้นเอียงเมื่อเปลี่ยนมุม
    caption: แกนนอนคือมุมของพื้นเอียง (องศา) แกนตั้งคือความเร่งของวัตถุที่ไถลลง (m/s²) เส้นบนคือพื้นลื่น a = g sin θ และเส้นล่างคือพื้นที่มีสัมประสิทธิ์ความเสียดทานจลน์ μk = k คือ a = g(sin θ − μk cos θ) เมื่อ g = 9.8 m/s² ที่ 90° พื้นลื่นให้ความเร่งเท่ากับการตกอิสระ ลองเพิ่ม k แล้วดูว่าต้องเอียงพื้นชันขึ้นเท่าใดวัตถุจึงจะมีความเร่ง
    widget:
      kind: function-plot
      functions: ["9.8\\sin(\\frac{\\pi x}{180})", "9.8\\sin(\\frac{\\pi x}{180}) - 9.8 k\\cos(\\frac{\\pi x}{180})"]
      sliders:
        - { name: k, min: 0, max: 1, step: 0.05, value: 0.3, label: μk }
      x: [0, 90]
      y: [0, 10]
glossary:
  - { term: พื้นเอียง, definition: "ผิวเรียบที่ทำมุม $\\theta$ กับแนวระดับ เช่น ทางลาด สไลเดอร์ ถนนขึ้นเขา" }
  - { term: องค์ประกอบขนานพื้นเอียง, definition: "ส่วนของน้ำหนักในแนวพื้นเอียง มีขนาด $mg\\sin\\theta$ ชี้ลงตามพื้น เป็นตัวทำให้วัตถุไถลลง" }
  - { term: องค์ประกอบตั้งฉากพื้นเอียง, definition: "ส่วนของน้ำหนักที่กดวัตถุเข้าหาพื้น มีขนาด $mg\\cos\\theta$ ถูกหักล้างด้วยแรงปฏิกิริยาตั้งฉาก" }
flashcards:
  - { front: "บนพื้นเอียงมุม $\\theta$ น้ำหนัก $mg$ แยกเป็นองค์ประกอบใดบ้าง", back: "ขนานพื้น $mg\\sin\\theta$ (ลงตามพื้น) และตั้งฉากพื้น $mg\\cos\\theta$ (เข้าหาพื้น)" }
  - { front: "ความเร่งของวัตถุที่ไถลลงพื้นเอียงลื่น", back: "$a = g\\sin\\theta$ ไม่ขึ้นกับมวล" }
  - { front: "ความเร่งเมื่อไถลลงพื้นเอียงที่มีแรงเสียดทานจลน์", back: "$a = g(\\sin\\theta - \\mu_k\\cos\\theta)$" }
  - { front: "วัตถุวางนิ่งบนพื้นเอียงจะเริ่มไถลที่มุมเท่าใด", back: "เมื่อ $\\tan\\theta = \\mu_s$ ถ้าไถลลงด้วยความเร็วคงตัวจะได้ $\\tan\\theta = \\mu_k$" }
