      - { id: b, text: "สีขาวเหมือนต้นพ่อ", feedback: "สเปิร์มจากต้นพ่อไม่ได้รวมกับเยื่อหุ้มออวุล จึงไม่มีผลต่อเปลือกเมล็ดรุ่นนี้" }
      - { id: c, text: "สีผสมระหว่างน้ำตาลกับขาว", feedback: "เปลือกเมล็ดไม่ได้เกิดจากการปฏิสนธิ จึงไม่ได้ผสมลักษณะของพ่อ" }
