    type: mcq
    stem: "ในถ้ำหินปูนทางภาคตะวันตกของไทย น้ำใต้ดินที่ละลาย $\\mathrm{CO_2}$ ไหลผ่านหินปูนตามสมดุล $\\mathrm{CaCO_3(s) + CO_2(aq) + H_2O(l) \\rightleftharpoons Ca^{2+}(aq) + 2HCO_3^-(aq)}$ ทำไมหยดน้ำที่เพดานถ้ำจึงทิ้งตะกอนหินปูนไว้เป็นหินย้อย"
    choices:
      - { id: a, text: "CO₂ หนีออกจากหยดน้ำสู่อากาศในถ้ำ สมดุลเลื่อนไปทางซ้าย CaCO₃ จึงตกตะกอน", correct: true, feedback: "ถูก การลด CO₂ (สารตั้งต้น) ทำให้ระบบเลื่อนไปทางที่สร้าง CO₂ กลับ คือทางซ้าย" }
      - { id: b, text: "น้ำในถ้ำมี CO₂ มากขึ้น สมดุลเลื่อนไปทางขวา", feedback: "ถ้าเลื่อนไปทางขวา หินปูนจะละลายมากขึ้น ไม่ใช่ตกตะกอน" }
      - { id: c, text: "หินปูนเป็นของแข็ง จึงไม่เกี่ยวกับสมดุล", feedback: "ของแข็งไม่อยู่ในสูตร K แต่ยังเกิดหรือละลายได้เมื่อสมดุลเลื่อน" }
    hints:
      - "อากาศในถ้ำมี CO₂ น้อยกว่าน้ำใต้ดินที่อยู่ใต้ดิน"
      - "ถ้า CO₂ ลดลง สมดุลจะเลื่อนไปทางใด"
    solution: "เมื่อหยดน้ำสัมผัสอากาศในถ้ำ **CO₂ หนีออก** สมดุลเลื่อนไปทางซ้ายเพื่อสร้าง CO₂ ทดแทน จึงเกิด CaCO₃ ตกตะกอนสะสมเป็นหินย้อยและหินงอก"
