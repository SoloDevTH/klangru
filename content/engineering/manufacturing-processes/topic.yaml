id: engineering.manufacturing.manufacturing-processes
subject: engineering
title: { th: กระบวนการผลิต, en: Manufacturing processes }
summary: กระบวนการหล่อ ขึ้นรูป ตัดเฉือน เชื่อม ขึ้นรูปพลาสติก และการพิมพ์ 3 มิติ พร้อมการคำนวณความเร็วตัด เวลาตัด ค่าเผื่อการหดตัว จุดคุ้มทุน และการเลือกกระบวนการ
difficulty: 6.5
minutes: 40
prerequisites: [engineering.materials.materials-science]
encompasses:
  - { id: engineering.materials.materials-science, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - { type: check, problem: engineering.manufacturing.manufacturing-processes.p001, prompt: "ลองคิดก่อนอ่านต่อ: กระบวนการหล่อแบบทรายเหมาะกับงานแบบใด" }
  - type: figure
    title: การจำแนกกระบวนการผลิตหลัก
    src: process-map.svg
    alt: "แผนภูมิต้นไม้มีกล่องกระบวนการผลิตอยู่ด้านบน แตกออกเป็นหกกลุ่มคือ การหล่อ การขึ้นรูป การตัดเฉือน การเชื่อมและบัดกรี การขึ้นรูปพลาสติก และการเติมเนื้อวัสดุ แต่ละกลุ่มมีกระบวนการย่อยอยู่ด้านล่าง"
    caption: "กระบวนการเติมเนื้อวัสดุต่างจากกลุ่มอื่นเพราะเพิ่มวัสดุทีละชั้น ไม่ได้ทำให้รูปร่างเปลี่ยนด้วยแรงหรือการตัดเอาออก"
  - type: figure
    title: ภาพกลึงทรงกระบอก
    src: turning.svg
    alt: "ชิ้นงานทรงกระบอกวางในแนวนอน ปลายซ้ายยึดกับหัวจับ ลูกศรโค้งสีส้มที่ปลายขวาแสดงการหมุน N รอบต่อนาที มีดกลึงอยู่ใต้ชิ้นงานแตะผิวด้านนอก ลูกศรสีแดงแสดงการป้อน f ขนานกับแกนชิ้นงานไปทางหัวจับ และมีลูกศรสองหัวบอกเส้นผ่านศูนย์กลาง D"
    caption: "เส้นผ่านศูนย์กลาง D ใช้ในสูตรความเร็วตัด ส่วนอัตราป้อนกำหนดระยะที่มีดเคลื่อนต่อรอบ"
  - type: worked-example
    title: หาความเร็วรอบจากความเร็วตัดที่ต้องการ
    problem: "ต้องการกลึงชิ้นงานเส้นผ่านศูนย์กลาง 50 มิลลิเมตรด้วยความเร็วตัด 100 เมตรต่อนาที เครื่องควรตั้งความเร็วรอบเท่าใด"
    steps:
      - text: "จากสูตร $V = \\frac{\\pi D N}{1000}$ จัดรูปได้ $N = \\frac{1000 V}{\\pi D}$"
        why: "สูตรนี้มาจากการพิจารณาระยะทางที่ผิวชิ้นงานเคลื่อนที่ในหนึ่งรอบ คือ $\\pi D$"
      - text: "แทนค่า $N = \\frac{1000 \\times 100}{\\pi \\times 50} = \\frac{100000}{157.08} \\approx 636.6$ รอบต่อนาที"
        why: "ใช้เส้นผ่านศูนย์กลางเต็ม 50 มม. ไม่ใช่รัศมี 25 มม."
    answer: "ตั้งความเร็วรอบประมาณ 637 รอบต่อนาที"
  - type: worked-example
    title: หาจุดคุ้มทุนระหว่างการหล่อสองแบบ
    problem: "(ข้อมูลสมมติ) การหล่อทรายมีต้นทุนคงที่ 10,000 บาท ต้นทุนผันแปร 80 บาทต่อชิ้น การหล่อแบบแม่พิมพ์ถาวรมีต้นทุนคงที่ 130,000 บาท ต้นทุนผันแปร 20 บาทต่อชิ้น ที่ปริมาณเท่าใดทั้งสองแบบมีต้นทุนเท่ากัน"
    steps:
      - text: "ตั้งสมการ $10{,}000 + 80Q = 130{,}000 + 20Q$"
        why: "จุดคุ้มทุนคือจุดที่ต้นทุนรวมของทั้งสองกระบวนการเท่ากัน"
      - text: "จัดรูป $60Q = 120{,}000$ จึง $Q = 2{,}000$ ชิ้น"
        why: "ต้นทุนผันแปรของการหล่อทรายแพงกว่าต่อชิ้น ส่วนแม่พิมพ์ถาวรช่วยลดต้นทุนต่อชิ้นเมื่อปริมาณเพิ่ม"
      - text: "ถ้าผลิตมากกว่า 2,000 ชิ้น การหล่อแบบแม่พิมพ์ถาวรจะถูกกว่า"
    answer: "จุดคุ้มทุนอยู่ที่ 2,000 ชิ้น ควรเลือกกระบวนการตามปริมาณการผลิตที่คาดไว้"
  - type: check
    problem: engineering.manufacturing.manufacturing-processes.p011
    prompt: "ลองคำนวณปริมาณความร้อนที่ป้อนในการเชื่อมด้วยตัวเอง"
glossary:
  - { term: การหล่อทราย, definition: "การหล่อโลหะโดยใช้แม่พิมพ์ทราย เหมาะกับชิ้นงานขนาดใหญ่และปริมาณน้อยถึงปานกลาง (sand casting)" }
  - { term: การหล่อแบบแม่พิมพ์ถาวร, definition: "การหล่อโลหะโดยใช้แม่พิมพ์โลหะที่ใช้ซ้ำได้ เหมาะกับปริมาณมาก (die casting)" }
  - { term: การตัดเฉือน, definition: "กระบวนการเอาเนื้อวัสดุออกเป็นเศษ เช่น กลึง กัด เจาะ (machining)" }
  - { term: ความเร็วตัด, definition: "ความเร็วที่ผิวชิ้นงานเคลื่อนที่เทียบกับมีดตัด หน่วยเมตรต่อนาที (cutting speed)" }
  - { term: อัตราป้อน, definition: "ระยะที่มีดเคลื่อนที่ต่อการหมุนหนึ่งรอบ หน่วยมิลลิเมตรต่อรอบ (feed rate)" }
  - { term: heat input, definition: "ปริมาณความร้อนที่ป้อนต่อหน่วยความยาวรอยเชื่อม หน่วยกิโลจูลต่อมิลลิเมตร" }
  - { term: ค่าเผื่อการหดตัว, definition: "ส่วนที่เพิ่มให้แบบจำลองเพื่อชดเชยการหดตัวของโลหะเมื่อเย็นตัว (shrinkage allowance)" }
  - { term: ความหยาบผิว (Ra), definition: "ค่าเฉลี่ยความสูงของความขรุขระของผิวงานตามแนวที่วัด ใช้กำหนดคุณภาพผิว (surface roughness)" }
flashcards:
  - { front: "ความเร็วตัดคำนวณอย่างไร", back: "V = π × D × N ÷ 1000 เมตรต่อนาที เมื่อ D เป็นมิลลิเมตร" }
  - { front: "เวลาตัดหนึ่งรอบประมาณได้อย่างไร", back: "t = L ÷ (f × N) นาที" }
  - { front: "แบบจำลองการหล่อต้องใหญ่กว่าชิ้นงานสุดท้ายเพราะอะไร", back: "โลหะหดตัวเมื่อเย็นตัวจากของเหลวสู่ของแข็ง" }
  - { front: "จุดคุ้มทุนระหว่างสองกระบวนการคำนวณอย่างไร", back: "F₁ + v₁Q = F₂ + v₂Q แล้วแก้หา Q" }
  - { front: "การขึ้นรูปต่างจากการตัดเฉือนอย่างไร", back: "การขึ้นรูปเปลี่ยนรูปด้วยแรงโดยไม่มีเศษ ส่วนการตัดเฉือนเอาเนื้อออกเป็นเศษ" }
