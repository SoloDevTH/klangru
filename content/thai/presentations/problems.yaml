problems:
- id: thai.speaking.presentations.p001
  topics:
  - thai.speaking.presentations
  difficulty: 1
  type: mcq
  stem: นิดลืมดินสอ จะขอยืมจากเพื่อน ข้อใดพูดได้ **ตรงวัตถุประสงค์** และสุภาพที่สุด
  choices:
  - id: a
    text: ดินสอ!
    feedback: สั้นเกินไปและไม่สุภาพ
  - id: b
    text: วันนี้อากาศร้อนจังเลย
    feedback: ไม่ได้บอกจุดประสงค์
  - id: c
    text: ขอยืมดินสอหน่อยนะ จะใช้ทำแบบฝึกหัดคาบนี้ เดี๋ยวคืนตอนพักเที่ยง
    correct: true
    feedback: ถูก บอกว่าขออะไร ใช้ทำอะไร และคืนเมื่อไร
  - id: d
    text: เธอมีดินสอกี่แท่ง
    feedback: ถามแต่ไม่ได้ขอยืม
  hints:
  - พูดเพื่ออะไร
  - 'ครบ: ขออะไร ใช้ทำอะไร คืนเมื่อไร'
  solution: พูดให้ **ตรงจุดประสงค์** ครบ และสุภาพ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.speaking.presentations.p002
  topics:
  - thai.speaking.presentations
  difficulty: 1
  type: match
  stem: จับคู่โอกาสกับสิ่งที่ควรพูด
  pairs:
  - left: กล่าวต้อนรับ
    right: ยินดีที่ผู้มาเยือนมา และบอกกิจกรรมสั้น ๆ
  - left: แนะนำวิทยากร
    right: ชื่อ ตำแหน่ง และความรู้ที่เกี่ยวกับหัวข้อ
  - left: ขอบคุณวิทยากร
    right: ขอบคุณ และบอกประโยชน์ที่ผู้ฟังได้รับ
  - left: อวยพรวันเกิดครู
    right: กล่าวถึงโอกาส แล้วอวยพรให้มีความสุข แข็งแรง
  hints:
  - แนะนำ คือบอกว่าวิทยากรเป็นใคร
  - ขอบคุณ ทำหลังวิทยากรพูดจบ
  solution: ต้อนรับ = ยินดีที่มา · แนะนำ = ชื่อ ตำแหน่ง ความรู้ · ขอบคุณ = ขอบคุณและบอกประโยชน์ · อวยพร = กล่าวถึงโอกาสและอวยพร
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.speaking.presentations.p003
  topics:
  - thai.speaking.presentations
  difficulty: 2
  type: order
  stem: เรียงโครงสร้างการพูดรายงาน
  items:
  - ทักทายผู้ฟังและบอกหัวข้อ
  - บอกว่าศึกษาอย่างไร
  - นำเสนอสิ่งที่พบพร้อมแหล่งที่มา
  - สรุปสิ่งที่พบและข้อคิด
  - เชิญผู้ฟังถามและตอบคำถาม
  hints:
  - บทนำ เนื้อหา สรุป แล้วจึงถามตอบ
  - วิธีศึกษาบอกก่อนผลที่พบ
  solution: ทักทายและหัวข้อ → วิธีศึกษา → สิ่งที่พบพร้อมแหล่ง → สรุป → ถามตอบ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.speaking.presentations.p004
  topics:
  - thai.speaking.presentations
  difficulty: 2
  type: mcq
  stem: ข้อใด **บอกแหล่งที่มา** ในการพูดรายงานได้ดีที่สุด
  choices:
  - id: a
    text: มีคนบอกมาว่า...
    feedback: ไม่รู้ว่าใคร ตรวจสอบไม่ได้
  - id: b
    text: ได้ยินมาจากอินเทอร์เน็ต
    feedback: กว้างเกินไป ไม่บอกแหล่งชัด
  - id: c
    text: ผมคิดว่าน่าจะเป็นอย่างนี้
    feedback: เป็นความเห็น ไม่ใช่แหล่งที่มา
  - id: d
    text: จากการสัมภาษณ์คุณป้าสมใจ เจ้าของร้านขนมหน้าโรงเรียน เมื่อวันที่ 10 กรกฎาคม ป้าเล่าว่า...
    correct: true
    feedback: ถูก บอกผู้ให้ข้อมูล วิธี และวันที่
  hints:
  - แหล่งที่ดีบอกใคร อย่างไร เมื่อไร
  - ผู้ฟังตามไปตรวจได้หรือไม่
  solution: บอก **ผู้ให้ข้อมูล วิธีที่ได้มา และวันที่** ผู้ฟังจึงตรวจสอบได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.speaking.presentations.p005
  topics:
  - thai.speaking.presentations
  difficulty: 2
  type: mcq
  stem: นักเรียนต้อง **แนะนำวิทยากร** ที่มาสอนเรื่องการปลูกผักไร้ดิน ข้อใดควรพูด
  choices:
  - id: a
    text: คุณสมชายชอบกินส้มตำและเลี้ยงแมวสามตัว
    feedback: ไม่เกี่ยวกับหัวข้อ
  - id: b
    text: คุณสมชายอายุเท่าไรและมีเบอร์โทรอะไร
    feedback: เป็นข้อมูลส่วนตัว ไม่ควรประกาศ
  - id: c
    text: คุณสมชาย ใจดี เกษตรกรผู้ปลูกผักไร้ดินมา 10 ปี และเป็นวิทยากรให้ศูนย์เกษตรของอำเภอ
    correct: true
    feedback: ถูก บอกชื่อและความรู้ที่ตรงกับหัวข้อ
  - id: d
    text: ขอเชิญใครก็ไม่รู้ขึ้นมาพูดครับ
    feedback: ไม่สุภาพและไม่ได้แนะนำ
  hints:
  - แนะนำวิทยากรเพื่อให้ผู้ฟังเชื่อถือในหัวข้อ
  - ข้อมูลส่วนตัวไม่ควรประกาศ
  solution: บอก **ชื่อ และความรู้หรือผลงานที่เกี่ยวกับหัวข้อ** สั้น ๆ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.speaking.presentations.p006
  topics:
  - thai.speaking.presentations
  difficulty: 3
  type: mcq
  stem: ดูบทพูดรายงานในภาพ ก่อน "ขอบคุณครับ" ยังขาดส่วนใด
  figure:
    src: report-script.svg
    alt: บทพูดรายงานสมมติของกลุ่มที่ 3 เรื่อง ร้านค้าในชุมชนรอบโรงเรียน มี 5 ส่วน (1) สวัสดีครับ คุณครูและเพื่อน ๆ ทุกคน กลุ่มของผมจะรายงานเรื่อง ร้านค้าในชุมชนรอบโรงเรียน (2) เราศึกษาโดยสัมภาษณ์เจ้าของร้าน 5 ร้าน และดูรายการข่าวท้องถิ่น 1 ตอน (3) พบว่าร้านส่วนใหญ่ขายอาหารและเครื่องเขียน ร้านที่เปิดนานที่สุดเปิดมาแล้ว 30 ปี (4) เจ้าของร้านเล่าว่าช่วงปิดภาคเรียนรายได้ลดลงเกือบครึ่ง (5) ขอบคุณครับ
  choices:
  - id: a
    text: การทักทายผู้ฟัง
    feedback: มีแล้วใน (1)
  - id: b
    text: สรุปสิ่งที่พบและข้อคิด แล้วเชิญผู้ฟังถาม
    correct: true
    feedback: ถูก บทพูดจบทันทีหลังเนื้อหา
  - id: c
    text: วิธีการศึกษา
    feedback: มีแล้วใน (2)
  - id: d
    text: สิ่งที่พบจากการศึกษา
    feedback: มีแล้วใน (3) และ (4)
  hints:
  - ตรวจทีละส่วน บทนำ วิธีศึกษา ผลที่พบ สรุป ถามตอบ
  - ส่วนใดยังไม่มี
  solution: ขาด **สรุปและการเชิญถาม** ก่อนกล่าวขอบคุณ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.speaking.presentations.p007
  topics:
  - thai.speaking.presentations
  difficulty: 3
  type: order
  stem: เรียงขั้นการพูดโน้มน้าวให้เพื่อนร่วมปลูกต้นไม้ในโรงเรียน
  items:
  - รู้ไหมว่าบ่ายวันนี้ลานหน้าเสาธงร้อนถึง 38 องศา
  - ลานไม่มีร่มไม้ นักเรียนจึงไม่อยากออกมาเล่น
  - เราช่วยกันปลูกต้นไม้รอบลานคนละหนึ่งต้นได้
  - อีกสามปี ลานจะร่มรื่นจนนั่งอ่านหนังสือได้
  - วันเสาร์นี้มาปลูกต้นไม้ด้วยกันนะ
  hints:
  - เริ่มด้วยการเร้าความสนใจ
  - จบด้วยการเรียกร้องให้ทำ
  solution: เร้าความสนใจ → ชี้ปัญหา → เสนอทางแก้ → ให้เห็นภาพ → เรียกร้องให้ทำ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.speaking.presentations.p008
  topics:
  - thai.speaking.presentations
  difficulty: 3
  type: mcq
  stem: จะพูดโน้มน้าวว่า "โรงเรียนควรติดตั้งจุดเติมน้ำดื่ม" หลักฐานใด **หนักแน่นที่สุด**
  choices:
  - id: a
    text: ผมชอบดื่มน้ำเย็น
    feedback: เป็นความชอบส่วนตัว
  - id: b
    text: ดาราคนหนึ่งบอกว่าน้ำดื่มสำคัญ
    feedback: อ้างคนมีชื่อเสียง ไม่ใช่หลักฐานเรื่องโรงเรียน
  - id: c
    text: ทุกโรงเรียนในโลกมีจุดเติมน้ำ
    feedback: อ้างเกินจริงและตรวจไม่ได้
  - id: d
    text: ผลสำรวจของสภานักเรียนว่าแต่ละวันโรงเรียนทิ้งขวดพลาสติกประมาณกี่ขวด พร้อมราคาค่าน้ำขวดที่นักเรียนจ่าย
    correct: true
    feedback: ถูก เป็นข้อเท็จจริงในพื้นที่ บอกที่มา และเกี่ยวกับข้อเสนอตรง ๆ
  hints:
  - หลักฐานที่ดีเป็นข้อเท็จจริงที่ตรวจได้
  - เกี่ยวกับโรงเรียนของเราโดยตรงหรือไม่
  solution: '**ผลสำรวจในโรงเรียน** ที่บอกที่มาและเกี่ยวกับปัญหาโดยตรงหนักแน่นที่สุด'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.speaking.presentations.p009
  topics:
  - thai.speaking.presentations
  difficulty: 3
  type: mcq
  stem: นักเรียนกล่าวขอบคุณวิทยากรในพิธีของโรงเรียน ข้อใดใช้ **ระดับภาษา** เหมาะสมที่สุด
  choices:
  - id: a
    text: ขอบคุณมากเลยนะคะพี่ เจ๋งมาก
    feedback: เป็นภาษากันเอง
  - id: b
    text: แต๊งกิ้วค่ะ
    feedback: เป็นภาษาปากที่ไม่เหมาะกับพิธี
  - id: c
    text: กระผมในนามของนักเรียนทุกคน ขอขอบพระคุณคุณสมชายเป็นอย่างสูงที่กรุณาสละเวลามาให้ความรู้ในวันนี้
    correct: true
    feedback: ถูก เป็นภาษาทางการเหมาะกับพิธี
  - id: d
    text: โอเค จบแล้วครับ ขอบคุณ
    feedback: ห้วนและไม่เป็นทางการ
  hints:
  - งานพิธีใช้ภาษาระดับใด
  - ใช้คำยกย่องผู้ฟังที่อาวุโสกว่า
  solution: งานพิธีใช้ **ภาษาทางการ** เช่น ขอขอบพระคุณเป็นอย่างสูง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.speaking.presentations.p010
  topics:
  - thai.speaking.presentations
  difficulty: 4
  type: mcq
  stem: ในการพูดแสดงทรรศนะเรื่องการใช้โทรศัพท์ในห้องเรียน ประโยค "ผลสำรวจของโรงเรียนพบว่านักเรียนร้อยละ 70 ใช้โทรศัพท์ค้นข้อมูลประกอบการเรียน" เป็นส่วนใดของทรรศนะ
  choices:
  - id: a
    text: ที่มา
    feedback: ที่มาคือเรื่องหรือปัญหาที่ยกขึ้นมาพูด
  - id: b
    text: ข้อสนับสนุน
    correct: true
    feedback: ถูก เป็นหลักฐานที่ใช้หนุนความเห็น
  - id: c
    text: ข้อสรุป
    feedback: ข้อสรุปคือความเห็นหรือข้อเสนอสุดท้าย
  - id: d
    text: คำทักทาย
    feedback: ไม่ใช่
  hints:
  - ทรรศนะมี ที่มา ข้อสนับสนุน ข้อสรุป
  - ตัวเลขจากการสำรวจทำหน้าที่อะไร
  solution: ผลสำรวจเป็น **ข้อสนับสนุน** ของทรรศนะ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.speaking.presentations.p011
  topics:
  - thai.speaking.presentations
  difficulty: 4
  type: mcq
  stem: เพื่อนพูดว่า "ไม่ควรให้ใช้โทรศัพท์ในห้องเรียนเลย เพราะนักเรียนจะเล่นเกม" ข้อใดเป็น **การโต้แย้ง** ที่สร้างสรรค์ที่สุด
  choices:
  - id: a
    text: เห็นด้วยว่ามีคนเล่นเกมจริง แต่ผลสำรวจพบว่าส่วนใหญ่ใช้ค้นข้อมูล จึงเสนอให้ใช้เฉพาะช่วงที่ครูอนุญาต
    correct: true
    feedback: ถูก ยอมรับส่วนที่ถูก ใช้หลักฐาน และเสนอทางออก
  - id: b
    text: เธอพูดแบบนี้เพราะเธอไม่มีโทรศัพท์ใช่ไหม
    feedback: โจมตีตัวบุคคล
  - id: c
    text: ผิด! ไม่มีใครเล่นเกมเลย
    feedback: ปฏิเสธโดยไม่มีหลักฐานและเกินจริง
  - id: d
    text: ช่างเถอะ ใครอยากทำอะไรก็ทำ
    feedback: ไม่ได้โต้แย้งด้วยเหตุผล
  hints:
  - โต้แย้งที่ดียอมรับส่วนที่อีกฝ่ายพูดถูก
  - ใช้หลักฐานและไม่โจมตีตัวบุคคล
  solution: ยอมรับส่วนที่ถูก **ชี้จุดต่างด้วยหลักฐาน** และ **เสนอทางออก** โดยไม่โจมตีบุคคล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.speaking.presentations.p012
  topics:
  - thai.speaking.presentations
  difficulty: 4
  type: numeric
  stem: ครูให้พูดรายงานไม่เกิน 3 นาที ถ้านักเรียนพูดได้ประมาณนาทีละ 120 คำ บทพูดควรยาว **ไม่เกิน** ประมาณกี่คำ
  answer:
    value: 360
    unit: คำ
  misconceptions:
  - match: 40
    feedback: หาร 120 ด้วย 3 ต้องคูณ
  - match: 123
    feedback: บวกกัน ต้องคูณเวลาด้วยความเร็ว
  hints:
  - จำนวนคำ = ความเร็ว × เวลา
  - 120 × 3
  solution: $120 \times 3 = 360$ คำ (ควรเผื่อเวลาหายใจและตอบคำถาม จึงเขียนให้สั้นกว่านี้เล็กน้อย)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.speaking.presentations.p013
  topics:
  - thai.speaking.presentations
  difficulty: 4
  type: mcq
  stem: จะพูดโน้มน้าวให้เพื่อนแยกขยะ มีหลักฐาน 3 อย่าง (ก) วิธีแยกขยะ 3 ถัง (ข) ภาพถังขยะล้นหลังโรงอาหาร (ค) ขยะล้นเพราะขวดพลาสติกปนกับเศษอาหาร ควร **เรียงหลักฐาน** อย่างไรจึงเป็นเหตุเป็นผล
  choices:
  - id: a
    text: (ก) → (ข) → (ค)
