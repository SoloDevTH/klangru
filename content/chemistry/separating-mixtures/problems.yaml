  - id: chemistry.mixtures.separating-mixtures.p015
    topics: [chemistry.mixtures.separating-mixtures]
    difficulty: 5
    type: numeric
    stem: "สาร X มีค่า $R_f$ 0.62 ในระบบกระดาษและตัวทำละลายชุดหนึ่ง ถ้าทำการทดลองซ้ำด้วยระบบเดิม และหยุดเมื่อตัวทำละลายเคลื่อนที่ได้ 7.5 cm จุดของสาร X จะอยู่สูงจากเส้นเริ่มต้นกี่เซนติเมตร"
    answer: { value: 4.65, tolerance: 0.05, unit: cm }
    misconceptions:
      - { match: 12.1, feedback: "หาร 7.5 ด้วย 0.62 แต่ระยะของสาร = $R_f$ × ระยะของตัวทำละลาย และต้องน้อยกว่า 7.5 cm" }
    hints:
      - "จัดสูตร $R_f$ ให้ระยะของสารอยู่ข้างเดียว"
      - "ระยะของสาร = $R_f$ × ระยะของตัวทำละลาย"
    solution: "ระยะของสาร $= R_f \\times$ ระยะของตัวทำละลาย $= 0.62 \\times 7.5 = 4.65$ cm"
