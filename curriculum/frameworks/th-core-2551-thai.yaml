          - { id: "ท 4.1 ม.4-6/7", level: ม.4-6, text: "วิเคราะห์และประเมินการใช้ภาษาจากสื่อสิ่งพิมพ์ และสื่ออิเล็กทรอนิกส์" }
  - id: ท5
    title: วรรณคดีและวรรณกรรม
    standards:
      - id: ท 5.1
        text: "เข้าใจและแสดงความคิดเห็น วิจารณ์วรรณคดี และวรรณกรรมไทยอย่างเห็นคุณค่าและนำมาประยุกต์ใช้ในชีวิตจริง"
        indicators:
          - { id: "ท 5.1 ป.1/1", level: ป.1, text: "บอกข้อคิดที่ได้จากการอ่านหรือการฟังวรรณกรรมร้อยแก้ว และร้อยกรองสำหรับเด็ก", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “จากการอ่าน|หรือการฟัง” ไม่เว้นวรรค" }
          - { id: "ท 5.1 ป.1/2", level: ป.1, text: "ท่องจำบทอาขยานตามที่กำหนด และบทร้อยกรองตามความสนใจ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ตามที่กำหนด|และบทร้อยกรอง” เว้นวรรค" }
          - { id: "ท 5.1 ป.2/1", level: ป.2, text: "ระบุข้อคิดที่ได้จากการอ่านหรือการฟังวรรณกรรมสำหรับเด็กเพื่อนำไปใช้ในชีวิตประจำวัน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “สำหรับเด็ก|เพื่อนำไปใช้ใน” ไม่เว้นวรรค" }
          - { id: "ท 5.1 ป.2/2", level: ป.2, text: "ร้องบทร้องเล่นสำหรับเด็กในท้องถิ่น" }
          - { id: "ท 5.1 ป.2/3", level: ป.2, text: "ท่องจำบทอาขยานตามที่กำหนด และบทร้อยกรองที่มีคุณค่าตามความสนใจ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ตามที่กำหนด|และบทร้อยกรอง” เว้นวรรค; “ที่มีคุณค่า|ตามความสนใจ” ไม่เว้นวรรค" }
          - { id: "ท 5.1 ป.3/1", level: ป.3, text: "ระบุข้อคิดที่ได้จากการอ่านวรรณกรรมเพื่อนำไปใช้ในชีวิตประจำวัน" }
          - { id: "ท 5.1 ป.3/2", level: ป.3, text: "รู้จักเพลงพื้นบ้าน และเพลงกล่อมเด็ก เพื่อปลูกฝังความชื่นชมวัฒนธรรมท้องถิ่น" }
          - { id: "ท 5.1 ป.3/3", level: ป.3, text: "แสดงความคิดเห็นเกี่ยวกับวรรณคดีที่อ่าน" }
          - { id: "ท 5.1 ป.3/4", level: ป.3, text: "ท่องจำบทอาขยานตามที่กำหนด และบทร้อยกรองที่มีคุณค่าตามความสนใจ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ตามที่กำหนด|และบทร้อยกรอง” เว้นวรรค; “ที่มีคุณค่า|ตามความสนใจ” ไม่เว้นวรรค" }
          - { id: "ท 5.1 ป.4/1", level: ป.4, text: "ระบุข้อคิดจากนิทานพื้นบ้านหรือนิทานคติธรรม", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “นิทานพื้นบ้าน|หรือนิทาน” ไม่เว้นวรรค" }
          - { id: "ท 5.1 ป.4/2", level: ป.4, text: "อธิบายข้อคิดจากการอ่านเพื่อนำไปใช้ในชีวิตจริง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “จากการอ่าน|เพื่อนำไปใช้ใน” ไม่เว้นวรรค" }
          - { id: "ท 5.1 ป.4/3", level: ป.4, text: "ร้องเพลงพื้นบ้าน" }
          - { id: "ท 5.1 ป.4/4", level: ป.4, text: "ท่องจำบทอาขยานตามที่กำหนด และบทร้อยกรองที่มีคุณค่าตามความสนใจ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ตามที่กำหนด|และบทร้อยกรอง” เว้นวรรค; “ที่มีคุณค่า|ตามความสนใจ” ไม่เว้นวรรค" }
          - { id: "ท 5.1 ป.5/1", level: ป.5, text: "สรุปเรื่องจากวรรณคดีหรือวรรณกรรมที่อ่าน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “วรรณคดีหรือ|วรรณกรรม” ไม่เว้นวรรค" }
          - { id: "ท 5.1 ป.5/2", level: ป.5, text: "ระบุความรู้ และข้อคิดจากการอ่านวรรณคดีและวรรณกรรมที่สามารถนำไปใช้ในชีวิตจริง" }
          - { id: "ท 5.1 ป.5/3", level: ป.5, text: "อธิบายคุณค่าของวรรณคดีและวรรณกรรม" }
          - { id: "ท 5.1 ป.5/4", level: ป.5, text: "ท่องจำบทอาขยานตามที่กำหนด และบทร้อยกรองที่มีคุณค่าตามความสนใจ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ตามที่กำหนด|และบทร้อยกรอง” เว้นวรรค; “ที่มีคุณค่า|ตามความสนใจ” ไม่เว้นวรรค" }
          - { id: "ท 5.1 ป.6/1", level: ป.6, text: "แสดงความคิดเห็นจากวรรณคดี หรือวรรณกรรมที่อ่าน" }
          - { id: "ท 5.1 ป.6/2", level: ป.6, text: "เล่านิทานพื้นบ้านท้องถิ่นตนเอง และนิทานพื้นบ้านของท้องถิ่นอื่น" }
          - { id: "ท 5.1 ป.6/3", level: ป.6, text: "อธิบายคุณค่าของวรรณคดีและวรรณกรรมที่อ่าน และนำไปประยุกต์ใช้ในชีวิตจริง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ของวรรณคดี|และวรรณกรรม” ไม่เว้นวรรค" }
          - { id: "ท 5.1 ป.6/4", level: ป.6, text: "ท่องจำบทอาขยานตามที่กำหนด และบทร้อยกรองที่มีคุณค่าตามความสนใจ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ตามที่กำหนด|และบทร้อยกรอง” เว้นวรรค; “ที่มีคุณค่า|ตามความสนใจ” ไม่เว้นวรรค" }
          - { id: "ท 5.1 ม.1/1", level: ม.1, text: "สรุปเนื้อหาวรรณคดีและวรรณกรรมที่อ่าน" }
          - { id: "ท 5.1 ม.1/2", level: ม.1, text: "วิเคราะห์วรรณคดีและวรรณกรรมที่อ่านพร้อมยกเหตุผลประกอบ" }
          - { id: "ท 5.1 ม.1/3", level: ม.1, text: "อธิบายคุณค่าของวรรณคดี และวรรณกรรมที่อ่าน" }
          - { id: "ท 5.1 ม.1/4", level: ม.1, text: "สรุปความรู้ และข้อคิดจากการอ่าน เพื่อประยุกต์ใช้ในชีวิตจริง" }
          - { id: "ท 5.1 ม.1/5", level: ม.1, text: "ท่องจำบทอาขยานตามที่กำหนด และบทร้อยกรองที่มีคุณค่าตามความสนใจ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “…ทร้อยกรองที่มีคุณค่า|ตามความสนใจ” ไม่เว้นวรรค" }
          - { id: "ท 5.1 ม.2/1", level: ม.2, text: "สรุปเนื้อหาวรรณคดีและวรรณกรรมที่อ่านในระดับที่ยากขึ้น" }
          - { id: "ท 5.1 ม.2/2", level: ม.2, text: "วิเคราะห์และวิจารณ์วรรณคดี วรรณกรรม และวรรณกรรมท้องถิ่นที่อ่าน พร้อมยกเหตุผลประกอบ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และวรรณกรรมท้องถิ่น|ที่อ่าน” ไม่เว้นวรรค" }
          - { id: "ท 5.1 ม.2/3", level: ม.2, text: "อธิบายคุณค่าของวรรณคดี และวรรณกรรมที่อ่าน" }
          - { id: "ท 5.1 ม.2/4", level: ม.2, text: "สรุปความรู้และข้อคิดจากการอ่านไปประยุกต์ใช้ในชีวิตจริง" }
          - { id: "ท 5.1 ม.2/5", level: ม.2, text: "ท่องจำบทอาขยานตามที่กำหนด และบทร้อยกรองที่มีคุณค่าตามความสนใจ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “…ทร้อยกรองที่มีคุณค่า|ตามความสนใจ” ไม่เว้นวรรค" }
          - { id: "ท 5.1 ม.3/1", level: ม.3, text: "สรุปเนื้อหาวรรณคดี วรรณกรรม และวรรณกรรมท้องถิ่นในระดับที่ยากยิ่งขึ้น" }
          - { id: "ท 5.1 ม.3/2", level: ม.3, text: "วิเคราะห์วิถีไทย และคุณค่าจากวรรณคดีและวรรณกรรมที่อ่าน" }
          - { id: "ท 5.1 ม.3/3", level: ม.3, text: "สรุปความรู้ และข้อคิดจากการอ่านเพื่อนำไปประยุกต์ใช้ในชีวิตจริง" }
          - { id: "ท 5.1 ม.3/4", level: ม.3, text: "ท่องจำและบอกคุณค่าบทอาขยานตามที่กำหนด และบทร้อยกรองที่มีคุณค่าตามความสนใจ และนำไปใช้อ้างอิง" }
          - { id: "ท 5.1 ม.4-6/1", level: ม.4-6, text: "วิเคราะห์และวิจารณ์วรรณคดี และวรรณกรรมตามหลักการวิจารณ์เบื้องต้น" }
          - { id: "ท 5.1 ม.4-6/2", level: ม.4-6, text: "วิเคราะห์ลักษณะเด่นของวรรณคดีเชื่อมโยงกับการเรียนรู้ทางประวัติศาสตร์ และวิถีชีวิตของสังคมในอดีต" }
          - { id: "ท 5.1 ม.4-6/3", level: ม.4-6, text: "วิเคราะห์และประเมินคุณค่าด้านวรรณศิลป์ของวรรณคดี และวรรณกรรมในฐานะที่เป็นมรดกทางวัฒนธรรมของชาติ" }
          - { id: "ท 5.1 ม.4-6/4", level: ม.4-6, text: "สังเคราะห์ข้อคิดจากวรรณคดี และวรรณกรรมเพื่อนำไปประยุกต์ใช้ในชีวิตจริง" }
          - { id: "ท 5.1 ม.4-6/5", level: ม.4-6, text: "รวบรวมวรรณกรรมพื้นบ้าน และอธิบายภูมิปัญญาทางภาษา" }
          - { id: "ท 5.1 ม.4-6/6", level: ม.4-6, text: "ท่องจำและบอกคุณค่าบทอาขยานตามที่กำหนด และบทร้อยกรองที่มีคุณค่าตามความสนใจ และนำไปใช้อ้างอิง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “…และบอกคุณค่าบทอาขยาน|ตามที่กำหนด” ไม่เว้นวรรค" }
