  - id: management.project.risk-management.p015
    topics: [management.project.risk-management]
    difficulty: 5
    type: mcq
    stem: "สหกรณ์ออมทรัพย์แห่งหนึ่ง (สมมติ) มีเงินทุนสำรอง 3 ล้านบาท กำลังพิจารณาลงทุนในโครงการที่มีโอกาส 0.9 ได้กำไร 2 ล้านบาท และโอกาส 0.1 ขาดทุน 8 ล้านบาท ข้อใดเป็นการตัดสินใจที่สมเหตุสมผลที่สุด"
    choices:
      - { id: a, text: "ไม่ลงทุนในรูปแบบนี้ แม้ EMV เป็นบวก เพราะกรณีขาดทุน 8 ล้านบาทเกินเงินสำรองและเกินระดับความเสี่ยงที่รับได้ ควรหาทางลดหรือถ่ายโอนส่วนขาดทุนก่อน", correct: true }
      - { id: b, text: "ลงทุนทันทีเพราะ EMV เป็นบวก 1 ล้านบาท", feedback: "EMV เป็นบวกจริง แต่กรณีเลวร้ายทำให้สหกรณ์อยู่รอดไม่ได้ ต้องดูระดับความเสี่ยงที่รับได้ด้วย" }
      - { id: c, text: "ลงทุนเพราะโอกาสได้กำไรสูงถึง 90%", feedback: "ความน่าจะเป็นสูงไม่พอ ต้องดูขนาดของความเสียหายในกรณีที่เหลือด้วย" }
      - { id: d, text: "ไม่ลงทุนเพราะ EMV ติดลบ", feedback: "EMV = 0.9 × 2 + 0.1 × (−8) = +1 ล้านบาท ไม่ได้ติดลบ" }
    hints:
      - "คำนวณ EMV ก่อน"
      - "แล้วเทียบกรณีเลวร้ายที่สุดกับเงินสำรองขององค์กร"
    solution: "EMV $= 0.9(2) + 0.1(-8) = +1$ ล้านบาท แต่ถ้าขาดทุน 8 ล้านบาท สหกรณ์มีสำรองเพียง 3 ล้านบาทจะเสียหายร้ายแรง การตัดสินใจจึงต้องดูทั้ง EMV และระดับความเสี่ยงที่รับได้"
