  - { front: "เล่นฟุตบอล / เล่นบาสเกตบอล", back: "踢足球 / 打篮球" }
  - { front: "ฉันหิวแล้ว / ฉันเหนื่อยมาก", back: "我饿了。 / 我很累。 (ไม่ใช้ 是)" }
  - { front: "数学 科学 历史 体育", back: "คณิตศาสตร์ · วิทยาศาสตร์ · ประวัติศาสตร์ · พลศึกษา" }
  - { front: "พนักงานคะ ขอบะหมี่หนึ่งชาม", back: "服务员，我要一碗面条。" }
