id: english.reading.argumentative-texts
subject: english
title: { th: "การอ่านบทความแสดงความคิดเห็นและข้อโต้แย้ง (ระดับ B2)", en: "Reading opinion articles and arguments (B2)" }
summary: อ่านบทความแสดงความคิดเห็นให้ระบุจุดยืน ข้อกล่าวอ้าง เหตุผล และข้อโต้แย้งฝ่ายตรงข้าม รวมถึงคำบอกความมั่นใจ คำเชื่อม และความหมายแฝงของผู้เขียน
difficulty: 6
minutes: 50
prerequisites: [english.reading.main-idea, english.grammar.sentence-types]
encompasses:
  - { id: english.reading.main-idea, weight: 0.3 }
  - { id: english.grammar.sentence-types, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: argument-map.svg
    alt: "แผนผังข้อโต้แย้งมีกล่องข้อกล่าวอ้าง Schools should start later. อยู่ด้านบน มีกล่องเหตุผล Students need more sleep to learn well. อยู่ซ้ายกลาง และกล่องฝ่ายตรงข้าม Later starts may disrupt bus schedules and family routines. อยู่ขวากลาง กล่องหลักฐาน A survey found most students sleep under 7 hours on weeknights. อยู่ซ้ายล่างเชื่อมกับเหตุผล และกล่องการตอบโต้ Bus companies can adjust their routes to fit a later start. อยู่ขวาล่างเชื่อมกับฝ่ายตรงข้าม มีลูกศรสีเขียว แดง และเทาตามลำดับ"
    caption: "แผนผังข้อโต้แย้งพื้นฐานในบทความแสดงความคิดเห็น"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.reading.argumentative-texts.p001, prompt: "ข้อกล่าวอ้างหลักของบทความคืออะไร" }
  - type: worked-example
    title: อ่านระดับความมั่นใจจากคำบอกความไม่แน่นอน
    problem: "ประโยคนี้บอกว่าผู้เขียนมั่นใจเพียงใด: Arguably, the government's plan could damage local markets."
    steps:
      - text: "หาคำบอกระดับความมั่นใจ: *arguably* แปลว่า อาจกล่าวได้ว่า"
        why: "คำนี้ขึ้นต้นประโยค ทำให้เห็นทันทีว่าเป็นความเห็น ไม่ใช่ข้อเท็จจริง"
      - text: "ดูคำกริยาช่วย: *could* บอกความเป็นไปได้ ไม่ใช่ความแน่นอน"
        why: "could อ่อนกว่า will ซึ่งบอกความมั่นใจสูงกว่า"
      - text: "รวมความหมาย: ผู้เขียนเสนอว่านโยบายอาจทำร้ายตลาดท้องถิ่น แต่ไม่ได้ยืนยันเต็มที่"
        why: "ใช้คำบอกความมั่นใจทั้งสองคำร่วมกันเพื่อประเมินระดับความมั่นใจ"
      - text: "เทียบกับประโยคที่มั่นใจกว่า: *The government's plan clearly damages local markets.*"
        why: "การเทียบช่วยให้เห็นว่าคำบอกความมั่นใจเปลี่ยนความหมายของประโยคอย่างไร"
    answer: "ผู้เขียนเสนอความเป็นไปได้ที่ยังไม่ยืนยันเต็มที่ว่านโยบายอาจทำร้ายตลาดท้องถิ่น"
  - { type: check, problem: english.reading.argumentative-texts.p003, prompt: "คำใดบอกว่าผู้เขียนยังไม่แน่ใจเต็มที่" }
  - type: worked-example
    title: ติดตามความสัมพันธ์ของข้อความด้วยคำเชื่อม
    problem: "อ่านสองประโยคนี้แล้วอธิบายว่าคำเชื่อมบอกความสัมพันธ์อะไร: The plan is popular with parents. Nevertheless, teachers are concerned that it adds to their workload."
    steps:
      - text: "หาประโยคแรกที่บอกสิ่งที่ฝ่ายหนึ่งคิด: *The plan is popular with parents.*"
        why: "ประโยคแรกบอกจุดยืนของฝ่ายที่เห็นด้วย"
      - text: "จับคำเชื่อม: *Nevertheless* แปลว่า ถึงอย่างนั้น"
        why: "คำนี้บอกว่าประโยคหลังขัดกับประโยคก่อน"
      - text: "ระบุฝ่ายที่แย้ง: *teachers are concerned that it adds to their workload.*"
        why: "ประโยคหลังให้ข้อกังวลของอีกฝ่ายซึ่งเป็นข้อโต้แย้ง"
      - text: "สรุปโครงข้อโต้แย้งให้ชัด: ผู้ปกครองชอบแผนนี้ แต่ครูกังวลว่าจะเพิ่มภาระงาน"
        why: "การสรุปให้เห็นว่าข้อความมีสองฝ่ายที่ต่างกัน"
    answer: "ผู้ปกครองสนับสนุนแผนนี้ แต่ครูกังวลว่าจะเพิ่มภาระงาน คำเชื่อม Nevertheless บอกการแย้ง"
glossary:
  - { term: claim, definition: "ข้อกล่าวอ้าง จุดยืนหลักที่ผู้เขียนต้องการให้ผู้อ่านเห็นด้วย" }
  - { term: counter-argument, definition: "ข้อโต้แย้งฝ่ายตรงข้าม ความเห็นที่ขัดกับจุดยืนของผู้เขียน" }
  - { term: rebuttal, definition: "การตอบโต้ การอธิบายว่าทำไมข้อโต้แย้งฝ่ายตรงข้ามจึงไม่หนักแน่นเท่าที่คิด" }
  - { term: hedging, definition: "การใช้คำที่ลดความมั่นใจ เช่น may, might, arguably เพื่อไม่ยืนยันเกินหลักฐาน" }
  - { term: collocation, definition: "คอลโลเคชัน คำที่มักเข้าคู่กันตามธรรมเนียม เช่น pose a threat" }
  - { term: skimming, definition: "อ่านกวาด อ่านอย่างรวดเร็วเพื่อจับใจความและจุดยืนของข้อความ" }
flashcards:
  - { front: "คำที่บอกว่าผู้เขียนไม่ยืนยันเต็มที่", back: "may, might, could, arguably, appears to" }
  - { front: "Admittedly มักตามด้วยอะไร", back: "but หรือ however เพราะยอมรับข้อโต้แย้งก่อนแย้ง" }
  - { front: "Nevertheless / Consequently ต่างกันอย่างไร", back: "Nevertheless = แย้ง · Consequently = ผลที่ตามมา" }
  - { front: "un- + sustain + -able", back: "unsustainable หมายถึงไม่สามารถรักษาไว้ได้ในระยะยาว" }
