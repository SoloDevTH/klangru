  - ถูกกฎหมายไม่ได้แปลว่าปลอดภัย
  solution: "โพสต์นี้ผิดหลายจุด: ประกาศ พ.ศ. 2568 ห้ามขายช่อดอกกัญชาและสินค้าที่แปรรูปจากช่อดอกผ่านช่องทางออนไลน์ การขายต้องมีใบอนุญาตและใบสั่งจ่าย และกัญชามีผลต่อสมองวัยรุ่น ไม่ควรส่งต่อโพสต์และควรแจ้งครู"
