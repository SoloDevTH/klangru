topic: computer.data.sql-advanced
rows:
  - { framework: acm-cs2023, indicators: ["DM-Querying"], coverage: partial, note: "สอนการสร้างคำสั่งสืบค้นด้วย GROUP BY HAVING ฟังก์ชันรวม LEFT JOIN และการจัดการ NULL (บทเรียนและโจทย์ p001 ถึง p010) แต่ผู้เรียนเลือกคำสั่ง ไล่ผล และจำลองด้วย Python เท่านั้น ไม่ได้เขียนคำสั่ง SQL เองเพราะแอปไม่มีตัวรัน SQL" }
  - { framework: acm-cs2023, indicators: ["DM-Processing"], coverage: partial, note: "สอนลำดับการประมวลผลเชิงตรรกะ การสแกนทั้งตารางกับการใช้ดัชนี JOIN แบบวงวนซ้อนกับแบบแฮช (p007 p017 p018) แต่ไม่ได้รันแผนการทำงานจริง ใช้แนวคิดและแผนผังเท่านั้น" }
  - { framework: acm-cs2023, indicators: ["DM-Internals"], coverage: partial, note: "สอนดัชนีแบบต้นไม้ B ระดับแนวคิด ธุรกรรม ACID การล็อก และบันทึกล่วงหน้า (p017 p019 p020) แต่ยังไม่ลงลึกรายละเอียดการทำงานภายในของระบบจัดการฐานข้อมูล" }
