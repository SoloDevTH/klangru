  - id: biology.animals.homeostasis.p016
    topics: [biology.animals.homeostasis]
    difficulty: 5
    type: mcq
    stem: "ผู้ป่วยเบาหวานที่ขาดอินซูลินรุนแรงมีกรดคีโตนคั่งในเลือด แพทย์สังเกตว่าผู้ป่วยหายใจเร็วและลึก และปัสสาวะเป็นกรดมาก ข้อใดอธิบายได้ถูกต้องที่สุด"
    choices:
      - { id: a, text: "กรดคีโตนเพิ่ม H⁺ ทำให้ pH ของเลือดลดลง ปอดชดเชยโดยขับ CO₂ มากขึ้น และไตชดเชยโดยขับ H⁺ ออกทางปัสสาวะ", correct: true }
      - { id: b, text: "การหายใจเร็วเป็นสาเหตุให้เลือดเป็นกรด", feedback: "หายใจเร็วขับ CO₂ ทำให้เลือดเป็นกรดน้อยลง จึงเป็นการชดเชย ไม่ใช่สาเหตุ" }
      - { id: c, text: "เลือดเป็นเบส ไตจึงขับ H⁺ ออกเพื่อให้เลือดเป็นเบสมากขึ้น", feedback: "กรดคีโตนทำให้เลือดเป็นกรด ไม่ใช่เบส" }
      - { id: d, text: "ปอดขับกรดคีโตนออกทางลมหายใจโดยตรงจน pH กลับปกติทันที", feedback: "ปอดขับ CO₂ เป็นหลัก การชดเชยช่วยได้บางส่วน ภาวะนี้ยังอันตรายและต้องได้รับการรักษา" }
    hints:
      - "กรดคีโตนปล่อย H⁺ ออกมา"
      - "แยกให้ออกว่าอะไรคือสาเหตุและอะไรคือการชดเชย"
    solution: "H⁺ จากกรดคีโตนทำให้ pH ลดลง ศูนย์หายใจเร่งการหายใจเพื่อขับ CO₂ ซึ่งลด H⁺ ได้บางส่วน และไตขับ H⁺ ออกทางปัสสาวะพร้อมดูดกลับ HCO₃⁻ แต่การชดเชยแก้สาเหตุไม่ได้ ผู้ป่วยต้องได้รับการรักษาโดยแพทย์ทันที"
