problems:
  - id: business.stats.descriptive.p001
    topics: [business.stats.descriptive]
    difficulty: 1
    type: numeric
    stem: "ร้านขายผลไม้ในตลาดไทบ้านแห่งหนึ่งมียอดขายจันทร์ถึงศุกร์ $4{,}200,\\ 3{,}850,\\ 5{,}100,\\ 4{,}650,\\ 6{,}300$ บาท ยอดขายรวมห้าวันเป็นกี่บาท (ตอบเป็นบาท)"
    answer: { value: 24100, unit: บาท }
    hints:
      - "ยอดขายรวมคือผลบวกของทุกวัน"
      - "บวกทีละสองจำนวนเพื่อลดความผิดพลาด หรือใช้ `=SUM()` ในสเปรดชีต"
    misconceptions:
      - { match: 4820, feedback: "นั่นคือค่าเฉลี่ยต่อวัน โจทย์ถามยอดรวม" }
    solution: "$4{,}200 + 3{,}850 + 5{,}100 + 4{,}650 + 6{,}300 = 24{,}100$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.stats.descriptive.p002
    topics: [business.stats.descriptive]
    difficulty: 1
    type: mcq
    stem: "ร้านเสื้อผ้าออนไลน์อยากรู้ว่าควรสต็อกเสื้อ **ไซซ์ใดมากที่สุด** ควรดูค่าใดจากข้อมูลไซซ์ที่ลูกค้าสั่ง"
    choices:
      - { id: a, text: "ฐานนิยม (ไซซ์ที่ถูกสั่งบ่อยที่สุด)", correct: true }
      - { id: b, text: "ค่าเฉลี่ย", feedback: "ไซซ์เป็นข้อมูลกลุ่ม (S M L XL) หาค่าเฉลี่ยไม่ได้" }
      - { id: c, text: "พิสัย", feedback: "พิสัยบอกความกว้างของข้อมูล ไม่ได้บอกว่าไซซ์ใดขายดี" }
      - { id: d, text: "ส่วนเบี่ยงเบนมาตรฐาน", feedback: "SD ใช้กับข้อมูลตัวเลข และบอกการกระจาย ไม่ได้บอกไซซ์ขายดี" }
    hints:
      - "ไซซ์เสื้อเป็นข้อมูลตัวเลขหรือข้อมูลกลุ่ม"
      - "ค่ากลางใดใช้กับข้อมูลกลุ่มได้"
    solution: "ไซซ์เป็นข้อมูลกลุ่ม ค่ากลางที่ใช้ได้คือฐานนิยม ซึ่งบอกไซซ์ที่ถูกสั่งบ่อยที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.stats.descriptive.p003
    topics: [business.stats.descriptive]
    difficulty: 2
    type: numeric
    stem: "ยอดขายเดือนพฤษภาคมของร้านเครื่องเขียน $80{,}000$ บาท เดือนมิถุนายน (เปิดเทอม) $92{,}000$ บาท ยอดขายเพิ่มขึ้นกี่เปอร์เซ็นต์ (ตอบเป็นเปอร์เซ็นต์)"
    answer: { value: 15, unit: "%" }
    hints:
      - "ร้อยละการเปลี่ยนแปลง $= \\dfrac{\\text{ใหม่} - \\text{เดิม}}{\\text{เดิม}} \\times 100$"
      - "ค่าเดิมคือเดือนพฤษภาคม"
    misconceptions:
      - { match: 13.04, feedback: "หารด้วยค่าใหม่ (92,000) ต้องหารด้วยค่าเดิม (80,000)" }
      - { match: 12000, feedback: "นั่นคือผลต่างเป็นบาท ต้องหารด้วยค่าเดิมแล้วคูณ 100" }
    solution: "$\\dfrac{92{,}000 - 80{,}000}{80{,}000} \\times 100 = \\dfrac{12{,}000}{80{,}000} \\times 100 = 15\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.stats.descriptive.p004
    topics: [business.stats.descriptive]
    difficulty: 2
    type: numeric
    stem: "ร้านสะดวกซื้อเล็ก ๆ ในขอนแก่น (ร้านสมมติ) วันหนึ่งขายได้ $45{,}600$ บาท จาก $380$ บิล ยอดขายเฉลี่ยต่อบิลเป็นกี่บาท (ตอบเป็นบาท)"
    answer: { value: 120, unit: บาท }
    hints:
      - "ยอดขายเฉลี่ยต่อบิล $=$ ยอดขายรวม $\\div$ จำนวนบิล"
      - "หาร $45{,}600$ ด้วย $380$"
    misconceptions:
      - { match: 0.0083, feedback: "หารกลับด้าน ต้องเอายอดขายตั้ง หารด้วยจำนวนบิล" }
    solution: "$45{,}600 \\div 380 = 120$ บาทต่อบิล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.stats.descriptive.p005
    topics: [business.stats.descriptive]
    difficulty: 2
    type: numeric
    stem: "ปีฐานไข่ไก่ราคาฟองละ $3.50$ บาท ปีนี้ราคาฟองละ $4.20$ บาท (ราคาสมมติ) ดัชนีราคาไข่ไก่ปีนี้เท่าใด (ปีฐาน $= 100$)"
    answer: { value: 120 }
    hints:
      - "ดัชนีราคาอย่างง่าย $= \\dfrac{p_1}{p_0} \\times 100$"
      - "$p_0$ คือราคาปีฐาน $p_1$ คือราคาปีนี้"
    misconceptions:
      - { match: 20, feedback: "20 คือร้อยละที่เพิ่มขึ้น ดัชนีต้องรวมฐาน 100 ด้วย จึงเป็น 120" }
      - { match: 83.33, feedback: "หารกลับด้าน ต้องเอาราคาปีนี้เป็นตัวตั้ง" }
    solution: "ดัชนี $= \\dfrac{4.20}{3.50} \\times 100 = 120$ แปลว่าแพงกว่าปีฐาน $20\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.stats.descriptive.p006
    topics: [business.stats.descriptive]
    difficulty: 2
    type: match
    stem: "จับคู่คำถามของเจ้าของร้านกับค่าสถิติที่เหมาะสมที่สุด"
    pairs:
      - { left: "ลูกค้าจ่ายเฉลี่ยบิลละเท่าใด", right: "ค่าเฉลี่ย" }
      - { left: "ยอดขายของวันปกติ เมื่อมีบางวันที่มีออร์เดอร์จัดเลี้ยงก้อนใหญ่", right: "มัธยฐาน" }
      - { left: "เมนูใดขายดีที่สุด", right: "ฐานนิยม" }
      - { left: "สาขาใหญ่กับสาขาเล็ก สาขาใดยอดขายสม่ำเสมอกว่า", right: "สัมประสิทธิ์การแปรผัน" }
    hints:
      - "ค่าผิดปกติก้อนใหญ่ดึงค่าเฉลี่ยแต่ไม่ค่อยกระทบมัธยฐาน"
      - "เทียบการแกว่งของข้อมูลที่ขนาดต่างกันต้องหารด้วยค่าเฉลี่ย"
    solution: "บิลเฉลี่ย → ค่าเฉลี่ย · วันปกติเมื่อมีค่าผิดปกติ → มัธยฐาน · เมนูขายดี → ฐานนิยม · ความสม่ำเสมอของสาขาต่างขนาด → CV"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.stats.descriptive.p007
    topics: [business.stats.descriptive]
    difficulty: 3
    type: numeric
    stem: "ยอดขายเจ็ดวันของร้านกาแฟ (บาท) คือ $3{,}200,\\ 2{,}900,\\ 3{,}500,\\ 3{,}100,\\ 15{,}800,\\ 3{,}300,\\ 3{,}000$ วันที่ห้ามีลูกค้าสั่งกาแฟจัดงานประชุม ค่ากลางที่บอก \"ยอดขายของวันปกติ\" ได้ดีที่สุดเท่ากับกี่บาท (ตอบเป็นบาท)"
    answer: { value: 3200, unit: บาท }
    hints:
      - "มีค่าผิดปกติก้อนใหญ่ ค่ากลางใดไม่ถูกดึง"
      - "เรียงข้อมูลจากน้อยไปมาก แล้วหาค่าตรงกลาง"
    misconceptions:
      - { match: 4971.43, feedback: "นั่นคือค่าเฉลี่ย ซึ่งถูกวันที่ห้าดึงให้สูงกว่าวันปกติทุกวัน" }
      - { match: 3100, feedback: "นั่นคือค่าตรงกลางก่อนเรียงข้อมูล ต้องเรียงก่อน" }
    solution: "เรียงได้ $2{,}900, 3{,}000, 3{,}100, 3{,}200, 3{,}300, 3{,}500, 15{,}800$ มัธยฐานคือตัวที่ 4 $= 3{,}200$ บาท ส่วนค่าเฉลี่ย $\\approx 4{,}971$ บาท สูงกว่าวันปกติทุกวัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.stats.descriptive.p008
    topics: [business.stats.descriptive]
    difficulty: 3
    type: numeric
    stem: "ฝ่ายขายนำแผนภูมินี้ไปรายงานว่า \"สาขาบางนาขายได้มากกว่าสาขาลาดพร้าวหลายเท่า\" อ่านค่าจากแกนตั้ง แล้วหาว่าสาขาบางนาขายได้มากกว่าสาขาลาดพร้าวกี่เปอร์เซ็นต์ (ตอบเป็นเปอร์เซ็นต์ ทศนิยม 1 ตำแหน่ง)"
    figure: { src: branch-truncated.svg, alt: "แผนภูมิแท่งยอดขายเดือนนี้หน่วยพันบาท แกนตั้งเริ่มที่ 100 ถึง 109 ขีดละ 1 แท่งสาขาลาดพร้าวสูงถึงเส้น 102 แท่งสาขาบางนาสูงถึงเส้น 108 แท่งบางนาดูสูงกว่าลาดพร้าวประมาณสี่เท่า" }
    answer: { value: 5.9, tolerance: 0.1, unit: "%" }
    hints:
      - "อ่านค่าจริงของแต่ละแท่งจากแกนตั้ง ไม่ใช่จากความสูงของแท่ง"
      - "หาร้อยละที่มากกว่า โดยใช้ลาดพร้าวเป็นค่าฐาน"
    misconceptions:
      - { match: 300, feedback: "นั่นคือการเทียบความสูงของแท่งที่แกนไม่เริ่มที่ศูนย์ (8 ช่อง กับ 2 ช่อง) ต้องใช้ค่าจริงจากแกน" }
      - { match: 5.6, feedback: "หารด้วยค่าของบางนา ต้องหารด้วยค่าของลาดพร้าวซึ่งเป็นฐานเปรียบเทียบ" }
    solution: "ลาดพร้าว $102$ พันบาท บางนา $108$ พันบาท มากกว่า $\\dfrac{108 - 102}{102} \\times 100 \\approx 5.9\\%$ ไม่ได้มากกว่าหลายเท่า แท่งดูต่างมากเพราะแกนตั้งเริ่มที่ 100"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.stats.descriptive.p009
    topics: [business.stats.descriptive]
    difficulty: 3
    type: mcq
    stem: "ส่วนแบ่งตลาดของน้ำดื่มยี่ห้อหนึ่ง (สมมติ) เพิ่มจาก $20\\%$ เป็น $25\\%$ ข้อใดอธิบายถูกต้อง"
    choices:
      - { id: a, text: "เพิ่มขึ้น 5 จุดร้อยละ ซึ่งเท่ากับเพิ่มขึ้น 25% ของส่วนแบ่งเดิม", correct: true }
      - { id: b, text: "เพิ่มขึ้น 5% ของส่วนแบ่งเดิม", feedback: "5 คือผลต่างของร้อยละสองค่า (จุดร้อยละ) ถ้าเทียบกับค่าเดิม 20 จะเป็น 25%" }
      - { id: c, text: "เพิ่มขึ้น 20% ของส่วนแบ่งเดิม", feedback: "หารผลต่าง 5 ด้วยค่าใหม่ 25 ต้องหารด้วยค่าเดิม 20" }
      - { id: d, text: "เพิ่มขึ้น 25 จุดร้อยละ", feedback: "ผลต่างของร้อยละคือ $25 - 20 = 5$ จุดร้อยละ" }
    hints:
      - "จุดร้อยละ คือผลลบของค่าร้อยละสองค่า"
      - "ร้อยละการเปลี่ยนแปลงต้องหารด้วยค่าเดิม"
    solution: "ผลต่าง $25 - 20 = 5$ จุดร้อยละ และเมื่อเทียบกับค่าเดิม $\\dfrac{5}{20} \\times 100 = 25\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.stats.descriptive.p010
    topics: [business.stats.descriptive]
    difficulty: 3
    type: numeric
    stem: "แม่ค้าข้าวแกงซื้อของสามอย่างอย่างละหนึ่งหน่วยทุกวัน ราคาปีฐานคือ ไก่ $32$ บาท หมู $45$ บาท ผัก $28$ บาท ปีนี้ราคา $36, 50, 35$ บาท (ราคาสมมติ) ดัชนีราคาแบบรวมของปีนี้เท่าใด (ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 115.2, tolerance: 0.1 }
    hints:
      - "ซื้ออย่างละหนึ่งหน่วย ดัชนีแบบรวม $= \\dfrac{\\sum p_1}{\\sum p_0} \\times 100$"
      - "รวมราคาปีนี้และปีฐานก่อนแล้วจึงหารกัน"
    misconceptions:
      - { match: 15.2, feedback: "นั่นคือร้อยละที่เพิ่มขึ้น ดัชนีต้องรวมฐาน 100" }
      - { match: 86.8, feedback: "หารกลับด้าน ต้องเอาราคาปีนี้เป็นตัวตั้ง" }
    solution: "$\\sum p_0 = 32 + 45 + 28 = 105$ บาท $\\sum p_1 = 36 + 50 + 35 = 121$ บาท ดัชนี $= \\dfrac{121}{105} \\times 100 \\approx 115.2$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.stats.descriptive.p011
    topics: [business.stats.descriptive]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนสรุปยอดขายรายบิลทั้งปีด้วยสเปรดชีต เพื่อนำเสนอเจ้าของร้าน"
    items:
      - "ตรวจข้อมูล ลบบิลซ้ำ แก้วันที่หรือตัวเลขที่พิมพ์ผิด"
      - "รวมยอดขายตามเดือนด้วย Pivot Table หรือ SUMIF"
      - "หาค่าเฉลี่ย มัธยฐาน SD และร้อยละการเปลี่ยนแปลงของยอดรายเดือน"
      - "วาดแผนภูมิแท่งหรือกราฟเส้นโดยให้แกนตั้งเริ่มที่ศูนย์"
      - "เขียนข้อสรุปสั้น ๆ ว่าตัวเลขบอกอะไรและควรทำอะไรต่อ"
    hints:
      - "ข้อมูลผิดตั้งแต่ต้นทำให้ทุกขั้นต่อไปผิด"
      - "ต้องมียอดรายเดือนก่อนจึงจะหาค่าสถิติและวาดกราฟได้"
    solution: "ตรวจและทำความสะอาดข้อมูล → รวมยอดตามเดือน → หาค่าสถิติ → วาดแผนภาพ → เขียนข้อสรุป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.stats.descriptive.p012
    topics: [business.stats.descriptive]
    difficulty: 4
    type: numeric
    stem: "ยอดขายรายวันของสาขาใหญ่มีค่าเฉลี่ย $50{,}000$ บาท SD $4{,}000$ บาท สาขาเล็กมีค่าเฉลี่ย $20{,}000$ บาท SD $2{,}400$ บาท สัมประสิทธิ์การแปรผัน (CV) ของสาขาเล็กเป็นกี่เปอร์เซ็นต์ (ตอบเป็นเปอร์เซ็นต์)"
    answer: { value: 12, unit: "%" }
    hints:
      - "$CV = \\dfrac{SD}{\\bar{x}} \\times 100\\%$"
      - "ใช้ SD และค่าเฉลี่ยของสาขาเล็กเท่านั้น แล้วเทียบกับ CV ของสาขาใหญ่ $8\\%$"
    misconceptions:
      - { match: 8, feedback: "นั่นคือ CV ของสาขาใหญ่ $4{,}000 \\div 50{,}000$ โจทย์ถามสาขาเล็ก" }
      - { match: 833.33, feedback: "หารกลับด้าน ต้องเอา SD หารด้วยค่าเฉลี่ย" }
    solution: "$CV = \\dfrac{2{,}400}{20{,}000} \\times 100 = 12\\%$ สาขาใหญ่ $= 8\\%$ แม้ SD ของสาขาเล็กต่ำกว่า แต่เมื่อเทียบกับขนาดแล้วสาขาเล็กแกว่งมากกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.stats.descriptive.p013
    topics: [business.stats.descriptive]
    difficulty: 4
    type: numeric
    stem: "ครอบครัวหนึ่งซื้อของต่อเดือน ข้าวสาร $15$ กก. น้ำมันพืช $2$ ขวด ไข่ไก่ $30$ ฟอง ราคาปีฐานคือ กิโลกรัมละ $30$ บาท ขวดละ $50$ บาท ฟองละ $3.50$ บาท ปีนี้ราคา $34$ บาท $60$ บาท และ $4$ บาท (ราคาสมมติ) ดัชนีราคาแบบรวมถ่วงน้ำหนักด้วยปริมาณที่ซื้อเท่าใด (ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 114.5, tolerance: 0.1 }
    hints:
      - "หาค่าตะกร้าปีฐาน $\\sum p_0 q_0$ และค่าตะกร้าเดิมด้วยราคาปีนี้ $\\sum p_1 q_0$"
      - "ดัชนี $= \\dfrac{\\sum p_1 q_0}{\\sum p_0 q_0} \\times 100$"
    misconceptions:
      - { match: 117.4, feedback: "รวมราคาต่อหน่วยโดยไม่คูณปริมาณ ทำให้น้ำมันซึ่งซื้อแค่ 2 ขวดมีน้ำหนักมากเกินจริง" }
    solution: "$\\sum p_0 q_0 = 15(30) + 2(50) + 30(3.5) = 450 + 100 + 105 = 655$ บาท $\\sum p_1 q_0 = 15(34) + 2(60) + 30(4) = 510 + 120 + 120 = 750$ บาท ดัชนี $= \\dfrac{750}{655} \\times 100 \\approx 114.5$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.stats.descriptive.p014
    topics: [business.stats.descriptive]
    difficulty: 4
    type: numeric
