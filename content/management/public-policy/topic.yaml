id: management.public.public-policy
subject: management
title: { th: นโยบายสาธารณะและโครงการภาครัฐ, en: Public policy and public projects }
summary: วงจรนโยบาย เครื่องมือและเกณฑ์เลือกทางเลือก ความเป็นไปได้และการวิเคราะห์ต้นทุนผลประโยชน์ (NPV, B/C) การนำนโยบายไปปฏิบัติ และการประเมินผลกระทบด้วยตัวชี้วัด
difficulty: 6
minutes: 40
prerequisites: [management.public.public-administration, management.principles.planning-decision]
encompasses:
  - { id: management.principles.planning-decision, weight: 0.3 }
  - { id: management.public.public-administration, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: policy-cycle.svg
    alt: "แผนภาพวงจรหกขั้นต่อกันด้วยลูกศรตามเข็มนาฬิกา 1 ก่อตัวของปัญหาและกำหนดวาระ 2 กำหนดทางเลือกและวิเคราะห์ความเป็นไปได้ 3 ตัดสินใจรับรองนโยบาย 4 นำนโยบายไปปฏิบัติ 5 ติดตามและประเมินผลกระทบ 6 ปรับปรุง ขยาย หรือยุติ แล้ววนกลับขั้นที่ 1 กลางวงเขียนว่าผู้มีส่วนได้ส่วนเสียและข้อมูลเข้ามาได้ทุกขั้น"
    caption: "วงจรนโยบายสาธารณะ"
  - type: worked-example
    title: NPV ของถนนเลี่ยงเมือง
    problem: "จังหวัดแห่งหนึ่ง (สมมติ) จะสร้างถนนเลี่ยงเมือง ค่าก่อสร้าง 120 ล้านบาทจ่ายปีที่ 0 ผลประโยชน์ (เวลาเดินทางและอุบัติเหตุที่ลดลง) ปีละ 30 ล้านบาท ค่าบำรุงรักษาปีละ 3 ล้านบาท ตั้งแต่ปีที่ 1 ถึง 6 อัตราคิดลด 5% ต่อปี NPV เป็นเท่าไร"
    steps:
      - text: "ผลประโยชน์สุทธิต่อปี $30 - 3 = 27$ ล้านบาท"
      - text: "ตัวคูณมูลค่าปัจจุบันของเงินเท่ากัน 6 ปี $\\sum_{t=1}^{6} \\frac{1}{1.05^t} \\approx 5.0757$"
        why: "เงินปีที่ 1 มีค่าวันนี้ $1/1.05$ ปีที่ 2 มีค่า $1/1.05^2$ ไปเรื่อย ๆ รวมหกปีได้ราว 5.08 ไม่ใช่ 6"
      - text: "มูลค่าปัจจุบันของผลประโยชน์สุทธิ $27 \\times 5.0757 \\approx 137.04$ ล้านบาท"
      - text: "$NPV = 137.04 - 120 \\approx 17.04$ ล้านบาท มากกว่า 0 จึงคุ้มค่าทางสังคม"
      - text: "ถ้าไม่คิดลดจะได้ $27 \\times 6 - 120 = 42$ ล้านบาท ซึ่งดูดีเกินจริงเกือบสามเท่า"
    answer: "NPV ประมาณ 17.04 ล้านบาท"
  - { type: check, problem: management.public.public-policy.p005 }
  - type: figure
    src: logic-model.svg
    alt: "ห้ากล่องเรียงต่อกันด้วยลูกศร ปัจจัยนำเข้า: งบ 3 ล้านบาท ถังแยกขยะ เจ้าหน้าที่ → กิจกรรม: อบรมชุมชน เก็บขยะแยกประเภท → ผลผลิต: 2,000 ครัวเรือนได้รับถังและอบรม → ผลลัพธ์: ขยะเข้าหลุมฝังกลบลดลง 30% → ผลกระทบ: น้ำชะขยะลดลง สุขภาพชุมชนดีขึ้น ใต้สามกล่องแรกเขียนว่าหน่วยงานควบคุมได้มาก ใต้สองกล่องหลังเขียนว่ามีปัจจัยภายนอกร่วมกำหนด"
    caption: "ตัวแบบตรรกะของโครงการคัดแยกขยะต้นทาง (สมมติ)"
  - type: worked-example
    title: ผลต่างของผลต่าง
    problem: "อำเภอ ก (สมมติ) เริ่มโครงการรถรับส่งผู้สูงอายุไปโรงพยาบาล อัตราผู้สูงอายุที่ขาดนัดลดจาก 18% เป็น 10% ส่วนอำเภอ ข ที่คล้ายกันแต่ไม่มีโครงการลดจาก 17% เป็น 14% ผลของโครงการโดยประมาณเป็นกี่จุดเปอร์เซ็นต์"
    steps:
      - text: "อำเภอที่ทำโครงการเปลี่ยน $10 - 18 = -8$ จุด"
      - text: "อำเภอเปรียบเทียบเปลี่ยน $14 - 17 = -3$ จุด"
        why: "อำเภอที่ไม่มีโครงการก็ลดลง แปลว่ามีเหตุอื่น เช่น ระบบนัดหมายทางโทรศัพท์ ที่ทำให้ลดลงอยู่แล้ว"
      - text: "ผลของโครงการ $\\approx -8 - (-3) = -5$ จุดเปอร์เซ็นต์"
      - text: "ถ้าดูก่อนกับหลังอย่างเดียวจะสรุปว่าโครงการลดได้ 8 จุด ซึ่งมากเกินจริง"
    answer: "โครงการลดการขาดนัดได้ประมาณ 5 จุดเปอร์เซ็นต์"
  - { type: check, problem: management.public.public-policy.p009 }
  - type: figure
    src: p-did.svg
    alt: "กราฟเส้นสองเส้น ผู้เสียชีวิตจากอุบัติเหตุทางถนนต่อประชากรแสนคน (สมมติ) จังหวัดที่ทำโครงการ (เส้นทึบสีน้ำเงิน) ปีก่อนโครงการ 30 ปีหลังโครงการ 22 จังหวัดเปรียบเทียบ (เส้นประสีส้ม) ปีก่อน 28 ปีหลัง 25"
    caption: "อัตราผู้เสียชีวิตก่อนและหลังโครงการ (ข้อมูลสมมติ ใช้ในโจทย์ข้อ 8)"
glossary:
  - { term: นโยบายสาธารณะ, definition: "สิ่งที่รัฐเลือกทำหรือไม่ทำเพื่อแก้ปัญหาหรือสร้างประโยชน์ส่วนรวม" }
  - { term: เครื่องมือนโยบาย, definition: "วิธีที่รัฐใช้ให้เกิดผล เช่น กฎระเบียบ ภาษีและเงินอุดหนุน การจัดบริการเอง การให้ข้อมูล" }
  - { term: มูลค่าปัจจุบันสุทธิ (NPV), definition: "ผลรวมของผลประโยชน์ลบต้นทุนในแต่ละปีที่คิดลดเป็นมูลค่าวันนี้" }
  - { term: อัตราส่วนผลประโยชน์ต่อต้นทุน, definition: "มูลค่าปัจจุบันของผลประโยชน์หารด้วยมูลค่าปัจจุบันของต้นทุน มากกว่า 1 คือคุ้ม" }
  - { term: ตัวแบบตรรกะ, definition: "แผนภาพที่เชื่อมปัจจัยนำเข้า กิจกรรม ผลผลิต ผลลัพธ์ และผลกระทบของโครงการ" }
  - { term: ผลต่างของผลต่าง, definition: "การประเมินผลโดยเทียบการเปลี่ยนแปลงของพื้นที่ที่ทำโครงการกับพื้นที่เปรียบเทียบ" }
  - { term: การนำนโยบายไปปฏิบัติ, definition: "การแปลงนโยบายเป็นโครงการ งบประมาณ ระเบียบ และการให้บริการจริง" }
flashcards:
  - { front: "วงจรนโยบายหกขั้น", back: "กำหนดวาระ → กำหนดทางเลือก → ตัดสินใจ → นำไปปฏิบัติ → ประเมินผล → ปรับ ขยาย หรือยุติ" }
  - { front: "มูลค่าปัจจุบันของเงิน X ในปีที่ t", back: "X ÷ (1 + r)^t" }
  - { front: "เลือกโครงการเดียวจากหลายโครงการที่ทดแทนกัน", back: "ดู NPV สูงสุด ไม่ใช่ B/C สูงสุด" }
  - { front: "ผลต่างของผลต่าง", back: "(หลัง − ก่อน) พื้นที่ทำ − (หลัง − ก่อน) พื้นที่เทียบ" }
  - { front: "ตัวชี้วัดผลกระทบสี่ด้าน", back: "เศรษฐกิจ · สังคม · สาธารณสุข · สิ่งแวดล้อม" }
