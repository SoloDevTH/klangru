      และถ้าบริการต้องเข้าสู่ระบบ ต้องแสดงข้อความนี้ก่อนหน้าเข้าสู่ระบบ
      หน้า Terms of Service (khanacademy.org/about/tos) แสดงผลด้วย JavaScript อ่านจากเครื่องมือไม่ได้ ต้องเปิดอ่านด้วยเบราว์เซอร์อีกครั้งก่อนดัดแปลง
      หน้า Help Center ตอบ 403 กับบอต จึงตรวจผ่าน Zendesk API https://support.khanacademy.org/api/v2/help_center/en-us/articles/202262954.json
    evidence_url: https://support.khanacademy.org/hc/en-us/articles/202262954-Can-I-use-Khan-Academy-s-videos-name-materials-links-in-my-project

