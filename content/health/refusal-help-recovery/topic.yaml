id: health.substances.refusal-help-recovery
subject: health
title:
  th: ทักษะการปฏิเสธ การชักชวนให้เลิก แหล่งช่วยเหลือ และกฎหมายเกี่ยวกับสารเสพติด
  en: Refusal skills, helping others quit, treatment services and drug law
summary: ทักษะปฏิเสธเมื่อถูกกดดันซ้ำ การชวนคนใกล้ตัวให้ลด ละ เลิก ขั้นตอนและแหล่งบำบัดฟื้นฟู สายด่วน 1165 1600 1413 ผลกระทบตามกฎหมาย และการมีส่วนร่วมป้องกัน
difficulty: 4
minutes: 35
prerequisites:
- health.substances.drugs-prevention
- health.safety.risk-behaviour-life-skills
encompasses:
- id: health.substances.drugs-prevention
  weight: 0.3
- id: health.substances.tobacco-alcohol
  weight: 0.1
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  title: เทคนิคการปฏิเสธ
  src: refusal.svg
  alt: การ์ดหกใบ ปฏิเสธชัดและซ้ำ พูดว่าไม่เอาด้วยประโยคเดิมน้ำเสียงหนักแน่น บอกความรู้สึกและเหตุผล เราไม่สบายใจ เราอยากเตะบอลให้ไหว เสนอทางเลือก ไปกินน้ำแข็งใสกันดีกว่า ผัดผ่อนหรือขอตัว แม่โทรตามแล้ว ไปก่อนนะ หลีกเลี่ยงและออกไป เลี่ยงที่และเวลาเสี่ยง กลับไปหาเพื่อนที่ปลอดภัย ขอความช่วยเหลือ บอกผู้ปกครองหรือครูเมื่อถูกขู่หรือถูกจ้าง ด้านล่างเขียนว่าภาษากาย สบตา ยืนตรง พูดเสียงชัด ไม่หัวเราะตามเมื่อพูดว่าไม่
- type: worked-example
  title: ปฏิเสธเมื่อถูกชวนซ้ำและถูกจ้าง
  problem: เย็นวันศุกร์ รุ่นพี่ยื่นบุหรี่ไฟฟ้าให้ออมเป็นครั้งที่สาม พูดว่า "ไม่กล้าเหรอ" แล้วเสนอเงิน 300 บาทให้ช่วยถือกระเป๋าไปส่งเพื่อนที่ท้ายซอย ออมควรพูดและทำอย่างไร
  steps:
  - text: 'ปฏิเสธชัดและซ้ำ: "ไม่เอา" ด้วยน้ำเสียงหนักแน่น สบตา'
    why: ไม่ต้องหาเหตุผลใหม่ทุกครั้ง การพูดซ้ำแสดงว่าตัดสินใจแล้ว
  - text: 'รู้ทันแรงกดดัน: คำว่า "ไม่กล้าเหรอ" คือการยั่วให้ทำตาม การไม่ทำตามคือความกล้า'
  - text: 'ไม่รับกระเป๋าหรือเงิน: ของที่ไม่รู้ว่าข้างในคืออะไรอาจเป็นยาเสพติด ผู้ถือไปส่งอาจถูกดำเนินคดี'
  - text: 'ขอตัวและออกจากที่นั่น: "แม่โทรตามแล้ว ไปก่อนนะ" แล้วกลับบ้านทางที่มีคน'
  - text: บอกผู้ปกครองหรือครู และเลี่ยงการไปนั่งที่เดิมในเวลาเดิม
  answer: ปฏิเสธซ้ำ ไม่รับของ ขอตัวออกมา และบอกผู้ใหญ่
- type: check
  problem: health.substances.refusal-help-recovery.p002
  prompt: ลองตอบก่อนอ่านต่อ
- type: figure
  title: ช่วงของการเปลี่ยนพฤติกรรม
  src: change-stages.svg
  alt: วงจรห้ากล่องเรียงตามเข็มนาฬิกา ยังไม่คิดจะเลิก ให้ข้อมูล ไม่ตัดสิน → ลังเล ถามเหตุผลที่อยากเลิก → เตรียมตัว ช่วยวางเป้าหมายเล็ก ๆ → ลงมือเลิก พาไปบำบัด อยู่ข้างเขา → รักษาการเลิกไว้ ชวนทำกิจกรรมทดแทน และมีเส้นประสีแดงจากรักษาการเลิกไว้กลับไปยังไม่คิดจะเลิก กลางวงเขียนว่าเส้นประ อาจกลับไปใช้ซ้ำ แล้วเริ่มใหม่ได้
  caption: ดัดแปลงจากแนวคิดขั้นของการเปลี่ยนแปลงพฤติกรรม (transtheoretical model)
- type: worked-example
  title: ชวนลูกพี่ลูกน้องให้ไปบำบัด
  problem: ลูกพี่ลูกน้องของออมใช้ยาบ้ามาหลายเดือน บอกว่าอยากเลิกแต่กลัวถูกจับ ออมกับครอบครัวจะช่วยอย่างไร
  steps:
  - text: 'เขาอยู่ช่วงลังเลถึงเตรียมตัว: รับฟังความกลัวโดยไม่ตำหนิ'
  - text: 'ให้ข้อเท็จจริง: กฎหมายมองว่าผู้เสพคือผู้ป่วย การสมัครใจเข้ารับการบำบัดเป็นทางที่กฎหมายเปิดไว้'
    why: ความกลัวถูกจับเป็นเหตุผลหลักที่คนไม่กล้าขอความช่วยเหลือ
  - text: โทร 1165 ด้วยกันเพื่อสอบถามจุดบริการใกล้บ้าน เช่น โรงพยาบาลชุมชน
  - text: 'วางแผนครอบครัว: ไปส่งตามนัด ช่วยหางานหรือกิจกรรม และเตรียมรับมือถ้ามีการใช้ซ้ำโดยไม่ตีตรา'
  answer: รับฟัง ให้ข้อมูลที่ถูกต้อง ช่วยเชื่อมกับ 1165 และสนับสนุนระยะยาว
- type: figure
  title: ขั้นตอนการบำบัดและฟื้นฟู
  src: recovery-path.svg
  alt: ผังสี่กล่องเรียงจากซ้ายไปขวา 1 คัดกรอง ประเมินโรคร่วม → 2 บำบัดด้วยยา ดูแลอาการทางกาย → 3 ฟื้นฟู ราว 4 ถึง 6 เดือน → 4 ติดตาม อย่างน้อย 1 ปี ด้านล่างเขียนว่าสถานที่ รพ.สต. → โรงพยาบาลชุมชน → โรงพยาบาลจังหวัด → สบยช. สำหรับอาการรุนแรง และปรึกษาได้ที่ 1165 ตลอด 24 ชั่วโมง ฉุกเฉินโทร 1669
- type: check
  problem: health.substances.refusal-help-recovery.p009
glossary:
- term: แรงกดดันจากกลุ่ม
  definition: ความรู้สึกว่าต้องทำตามเพื่อนเพื่อให้ได้รับการยอมรับ แม้จะไม่อยากทำ
- term: การบำบัดฟื้นฟู
  definition: กระบวนการรักษาผู้ติดสารเสพติดทั้งทางร่างกาย จิตใจ และสังคม ตั้งแต่ประเมิน รักษา ฟื้นฟู จนติดตามหลังกลับสู่ชุมชน
- term: การใช้ซ้ำ
  definition: การกลับไปใช้สารเสพติดหลังเลิกได้ระยะหนึ่ง พบได้ในโรคเรื้อรัง และเป็นสัญญาณให้กลับไปรับการรักษา
- term: ประมวลกฎหมายยาเสพติด
  definition: กฎหมายที่รวมกฎหมายยาเสพติดหลายฉบับ ใช้บังคับตั้งแต่ 9 ธันวาคม 2564 มองผู้เสพเป็นผู้ป่วยและลงโทษผู้ค้าหนัก
flashcards:
- front: เทคนิคปฏิเสธเมื่อถูกกดดันซ้ำ
  back: ปฏิเสธชัดและซ้ำ บอกเหตุผล เสนอทางเลือก ผัดผ่อน หลีกเลี่ยงและออกไป ขอความช่วยเหลือ
- front: ขั้นตอนบำบัดของ สบยช. (ก.พ. 2569)
  back: คัดกรองและประเมิน → บำบัดด้วยยา → ฟื้นฟู 4–6 เดือน → ติดตามอย่างน้อย 1 ปี
- front: ผู้เสพกับผู้ค้าตามประมวลกฎหมายยาเสพติด
  back: ผู้เสพคือผู้ป่วย เน้นบำบัด ส่วนการมีไว้เพื่อจำหน่าย ผลิต นำเข้า มีโทษหนักและอาจถูกยึดทรัพย์สิน
- front: ถูกจ้างให้ส่งของที่ไม่รู้ว่าข้างในคืออะไร
  back: ปฏิเสธ ไม่รับของ ออกไปที่ปลอดภัย และบอกผู้ใหญ่ ผู้ส่งอาจถูกดำเนินคดีได้
