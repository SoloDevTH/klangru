<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 300" width="790" height="300" font-family="sans-serif">
<title>ฟังอย่างไรให้ทำตามได้ถูก</title>
<rect x="0" y="0" width="790" height="300" fill="#fff"/>
<rect x="20.0" y="20.0" width="236.0" height="260.0" rx="12" fill="#fff" stroke="#1f5fbf" stroke-width="3"/>
<rect x="20.0" y="20.0" width="236.0" height="50.0" rx="12" fill="#1f5fbf" stroke="#1f5fbf" stroke-width="3"/>
<rect x="20.0" y="50.0" width="236.0" height="20.0" rx="0" fill="#1f5fbf" stroke="none" stroke-width="0"/>
<text x="138.0" y="54.0" font-size="22" text-anchor="middle" fill="#fff" font-weight="bold">1. ก่อนฟัง</text>
<text x="34.0" y="110.0" font-size="15.5" text-anchor="start" fill="#111" font-weight="normal">• วางของในมือ</text>
<text x="34.0" y="152.0" font-size="15.5" text-anchor="start" fill="#111" font-weight="normal">• มองผู้พูด</text>
<text x="34.0" y="194.0" font-size="15.5" text-anchor="start" fill="#111" font-weight="normal">• ตั้งใจฟังให้จบ</text>
<line x1="260.0" y1="150.0" x2="282.0" y2="150.0" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="282.0,150.0 273.0,154.3 273.0,145.7" fill="#555" stroke="#555" stroke-width="1" stroke-linejoin="round"/>
<rect x="286.0" y="20.0" width="236.0" height="260.0" rx="12" fill="#fff" stroke="#1e8449" stroke-width="3"/>
<rect x="286.0" y="20.0" width="236.0" height="50.0" rx="12" fill="#1e8449" stroke="#1e8449" stroke-width="3"/>
<rect x="286.0" y="50.0" width="236.0" height="20.0" rx="0" fill="#1e8449" stroke="none" stroke-width="0"/>
<text x="404.0" y="54.0" font-size="22" text-anchor="middle" fill="#fff" font-weight="bold">2. ขณะฟัง</text>
<text x="300.0" y="110.0" font-size="15.5" text-anchor="start" fill="#111" font-weight="normal">• จับคำสำคัญ ใคร ทำอะไร</text>
<text x="300.0" y="152.0" font-size="15.5" text-anchor="start" fill="#111" font-weight="normal">• ที่ไหน เมื่อไร อย่างไร</text>
<text x="300.0" y="194.0" font-size="15.5" text-anchor="start" fill="#111" font-weight="normal">• คำบอกลำดับ ก่อน แล้ว สุดท้าย</text>
<text x="300.0" y="236.0" font-size="15.5" text-anchor="start" fill="#111" font-weight="normal">• ตัวเลข และคำว่า ห้าม อย่า</text>
<line x1="526.0" y1="150.0" x2="548.0" y2="150.0" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="548.0,150.0 539.0,154.3 539.0,145.7" fill="#555" stroke="#555" stroke-width="1" stroke-linejoin="round"/>
<rect x="552.0" y="20.0" width="236.0" height="260.0" rx="12" fill="#fff" stroke="#c0392b" stroke-width="3"/>
<rect x="552.0" y="20.0" width="236.0" height="50.0" rx="12" fill="#c0392b" stroke="#c0392b" stroke-width="3"/>
<rect x="552.0" y="50.0" width="236.0" height="20.0" rx="0" fill="#c0392b" stroke="none" stroke-width="0"/>
<text x="670.0" y="54.0" font-size="22" text-anchor="middle" fill="#fff" font-weight="bold">3. หลังฟัง</text>
<text x="566.0" y="110.0" font-size="15.5" text-anchor="start" fill="#111" font-weight="normal">• ทวนในใจหรือพูดทวน</text>
<text x="566.0" y="152.0" font-size="15.5" text-anchor="start" fill="#111" font-weight="normal">• ไม่เข้าใจ ยกมือถาม</text>
<text x="566.0" y="194.0" font-size="15.5" text-anchor="start" fill="#111" font-weight="normal">• ทำตามทีละขั้น</text>
</svg>
