<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="sans-serif"><title>สามเหลี่ยมอ้างอิงของการแทนค่า x = a sin θ, x = a tan θ และ x = a sec θ</title><defs></defs><rect width="900" height="330" fill="#fff"/><polygon points="40.0,260.0 230.0,260.0 230.0,110.0" fill="#eef4fb" fill-opacity="1" stroke="#1d3557" stroke-width="2.4" stroke-linejoin="round"/>
<polyline points="216.0,260.0 216.0,246.0 230.0,246.0" fill="none" fill-opacity="1" stroke="#1d3557" stroke-width="1.4" stroke-linejoin="round"/>
<polyline points="74.0,260.0 74.0,258.9 73.9,257.7 73.8,256.6 73.7,255.5 73.5,254.3 73.3,253.2 73.1,252.1 72.8,251.0 72.5,249.9 72.1,248.8 71.7,247.8 71.3,246.7 70.8,245.7 70.3,244.7 69.8,243.7 69.3,242.7 68.7,241.7 68.0,240.8 67.4,239.8 66.7,238.9" fill="none" fill-opacity="1" stroke="#c1121f" stroke-width="2" stroke-linejoin="round"/>
<text x="86.0" y="252.0" font-size="16" fill="#c1121f" text-anchor="middle" font-style="italic">θ</text>
<text x="240.0" y="190.0" font-size="15" fill="#222" text-anchor="start">x</text>
<text x="135.0" y="284.0" font-size="15" fill="#222" text-anchor="middle">√(a² − x²)</text>
<text x="115.4" y="171.7" font-size="15" fill="#222" text-anchor="end">a</text>
<text x="135.0" y="40.0" font-size="16" fill="#1d3557" text-anchor="middle" font-weight="bold">x = a sin θ</text>
<text x="135.0" y="62.0" font-size="14" fill="#444" text-anchor="middle">sin θ = x/a</text>
<polygon points="340.0,260.0 530.0,260.0 530.0,110.0" fill="#eef4fb" fill-opacity="1" stroke="#1d3557" stroke-width="2.4" stroke-linejoin="round"/>
<polyline points="516.0,260.0 516.0,246.0 530.0,246.0" fill="none" fill-opacity="1" stroke="#1d3557" stroke-width="1.4" stroke-linejoin="round"/>
<polyline points="374.0,260.0 374.0,258.9 373.9,257.7 373.8,256.6 373.7,255.5 373.5,254.3 373.3,253.2 373.1,252.1 372.8,251.0 372.5,249.9 372.1,248.8 371.7,247.8 371.3,246.7 370.8,245.7 370.3,244.7 369.8,243.7 369.3,242.7 368.7,241.7 368.0,240.8 367.4,239.8 366.7,238.9" fill="none" fill-opacity="1" stroke="#c1121f" stroke-width="2" stroke-linejoin="round"/>
<text x="386.0" y="252.0" font-size="16" fill="#c1121f" text-anchor="middle" font-style="italic">θ</text>
<text x="540.0" y="190.0" font-size="15" fill="#222" text-anchor="start">x</text>
<text x="435.0" y="284.0" font-size="15" fill="#222" text-anchor="middle">a</text>
<text x="415.4" y="171.7" font-size="15" fill="#222" text-anchor="end">√(a² + x²)</text>
<text x="435.0" y="40.0" font-size="16" fill="#1d3557" text-anchor="middle" font-weight="bold">x = a tan θ</text>
<text x="435.0" y="62.0" font-size="14" fill="#444" text-anchor="middle">tan θ = x/a</text>
<polygon points="640.0,260.0 830.0,260.0 830.0,110.0" fill="#eef4fb" fill-opacity="1" stroke="#1d3557" stroke-width="2.4" stroke-linejoin="round"/>
<polyline points="816.0,260.0 816.0,246.0 830.0,246.0" fill="none" fill-opacity="1" stroke="#1d3557" stroke-width="1.4" stroke-linejoin="round"/>
