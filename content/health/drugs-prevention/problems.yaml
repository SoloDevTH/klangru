- id: health.substances.drugs-prevention.p016
  topics:
  - health.substances.drugs-prevention
  difficulty: 5
  type: mcq
  stem: ลูกพี่ลูกน้องของปิ่นอายุ 19 ปี ใช้ยาบ้ามาหลายเดือน ช่วงนี้ระแวงและนอนไม่หลับ ครอบครัวโกรธและอยากไล่ออกจากบ้าน ปิ่นควรเสนอแนวทางใดต่อครอบครัว
  choices:
  - id: a
    text: มองว่าการติดเป็นโรคที่รักษาได้ ปรึกษาสายด่วน 1165 หรือโรงพยาบาลของรัฐเพื่อเข้ารับการบำบัด พูดด้วยความห่วงใย และถ้ามีพฤติกรรมก้าวร้าวจนไม่ปลอดภัยให้รักษาระยะห่างและขอความช่วยเหลือจากเจ้าหน้าที่
    correct: true
  - id: b
    text: ไล่ออกจากบ้านเพื่อให้รู้สำนึก
    feedback: การตัดขาดทำให้ผู้ป่วยขาดที่พึ่งและอาจใช้มากขึ้น การบำบัดได้ผลดีกว่าเมื่อครอบครัวช่วยเหลือ
  - id: c
    text: ซ่อนเรื่องนี้ไว้ ไม่ให้ใครรู้ และรอให้เลิกเอง
    feedback: การติดเปลี่ยนการทำงานของสมองจนเลิกเองได้ยาก ควรได้รับคำปรึกษาจากผู้เชี่ยวชาญ
  hints:
  - การติดสารเสพติดเป็นโรคเรื้อรังของสมองที่รักษาได้
  - ดูทั้งการรักษาและความปลอดภัยของทุกคนในบ้าน
  solution: การติดเป็นโรคที่รักษาได้ ครอบครัวช่วยได้ด้วยการพูดด้วยความห่วงใยและพาเข้าสู่การบำบัด (1165 หรือโรงพยาบาลของรัฐ) โดยคำนึงถึงความปลอดภัย ถ้ามีอาการหนัก เช่น ระแวงจนอาจทำร้ายตัวเองหรือผู้อื่น ให้ขอความช่วยเหลือทันที (1669 หรือ 191)
