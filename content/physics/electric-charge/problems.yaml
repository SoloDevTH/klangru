    ai_assisted: true

  - id: phy.chg.p012
    topics: [physics.electricity.charge]
    difficulty: 5
    type: numeric
    stem: "ประจุ $+4\\ \\mathrm{\\mu C}$ และ $+1\\ \\mathrm{\\mu C}$ อยู่ห่างกัน $60\\ \\mathrm{cm}$ ระหว่างประจุทั้งสองมีจุดหนึ่งที่สนามไฟฟ้าลัพธ์เป็นศูนย์ จุดนั้นอยู่ห่างจากประจุ $+4\\ \\mathrm{\\mu C}$ กี่เซนติเมตร (ตอบเป็นตัวเลขในหน่วย cm)"
    answer: { value: 40, tolerance: 0.4, unit: cm }
    hints:
      - "ระหว่างประจุบวกสองตัว สนามจากแต่ละตัวชี้ในทิศตรงข้ามกัน จุดที่สนามเป็นศูนย์คือจุดที่สนามทั้งสองมีขนาดเท่ากัน"
      - "ให้จุดนั้นห่างจากประจุ $+4\\ \\mathrm{\\mu C}$ เป็น $x$ จะห่างจากอีกตัวเป็น $60 - x$ ตั้งสมการ $\\dfrac{k(4)}{x^2} = \\dfrac{k(1)}{(60 - x)^2}$"
      - "ถอดรากที่สองทั้งสองข้างก่อน จะได้สมการเชิงเส้นที่แก้ง่าย"
    misconceptions:
      - { match: 48, feedback: "ดูเหมือนตั้งสมการโดยไม่ยกกำลังสองระยะห่าง ($\\tfrac{4}{x} = \\tfrac{1}{60 - x}$) สนามแปรผกผันกับ $r^2$ ต้องใช้ $\\tfrac{4}{x^2} = \\tfrac{1}{(60 - x)^2}$" }
      - { match: 20, feedback: "นั่นคือระยะจากประจุ $+1\\ \\mathrm{\\mu C}$ จุดที่สนามเป็นศูนย์ต้องอยู่ใกล้ประจุที่ **เล็กกว่า** เพราะต้องเข้าใกล้มากขึ้นสนามของมันจึงเท่ากับของประจุใหญ่" }
    solution: "$\\dfrac{4}{x^2} = \\dfrac{1}{(60 - x)^2}$ ถอดรากที่สอง: $\\dfrac{2}{x} = \\dfrac{1}{60 - x}$ → $2(60 - x) = x$ → $120 = 3x$ → $x = 40\\ \\mathrm{cm}$ ตรวจ: $\\dfrac{4}{40^2} = \\dfrac{1}{400}$ และ $\\dfrac{1}{20^2} = \\dfrac{1}{400}$ ✓ (ค่า $k$ และ $10^{-6}$ ตัดกันไปทั้งสองข้าง จึงใช้หน่วย cm ได้เลย)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.chg.p013
    topics: [physics.electricity.charge]
