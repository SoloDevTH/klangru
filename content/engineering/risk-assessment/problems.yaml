problems:
  - id: engineering.safety.risk-assessment.p001
    topics:
      - engineering.safety.risk-assessment
    difficulty: 1
    type: mcq
    stem: ความแตกต่างระหว่างอันตรายกับความเสี่ยงคืออะไร
    choices:
      - id: a
        text: อันตรายคือแหล่งที่อาจก่อให้เกิดอันตราย ส่วนความเสี่ยงคือโอกาสที่จะเกิดเหตุร่วมกับความรุนแรงของผลที่ตามมา
        correct: true
      - id: b
        text: อันตรายและความเสี่ยงคือคำพ้องความหมาย
        feedback: สองคำนี้ต่างกันตรงที่ความเสี่ยงต้องคิดถึงโอกาสและความรุนแรงด้วย
      - id: c
        text: อันตรายคือผลที่เกิดขึ้นแล้ว ส่วนความเสี่ยงคือความเชื่อของผู้ปฏิบัติงาน
        feedback: ความเสี่ยงคือการประเมินโอกาสและความรุนแรง ไม่ได้ขึ้นกับความเชื่อ
      - id: d
        text: ความเสี่ยงมีค่าเท่ากับศูนย์เมื่อมีการอบรมแล้ว
        feedback: การอบรมช่วยลดโอกาสได้ แต่ไม่ได้ทำให้ความเสี่ยงเป็นศูนย์เสมอไป
    hints:
      - อันตรายคือสิ่งที่มีศักยภาพก่อให้เกิดอันตราย เช่น สารไวไฟ หรือเครื่องจักรที่ไม่มีการ์ดกัน
      - ความเสี่ยงต้องพิจารณาทั้งโอกาสที่จะเกิดและความรุนแรงของผลที่ตามมา
    solution: อันตรายคือแหล่งหรือสภาวะที่อาจก่อให้เกิดอันตราย ส่วนความเสี่ยงคือการรวมกันของโอกาสที่เหตุการณ์จะเกิดขึ้นกับความรุนแรงของผลที่ตามมา อันตรายเดียวกันจึงมีความเสี่ยงต่างกันได้ตามสถานการณ์
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.safety.risk-assessment.p002
    topics:
      - engineering.safety.risk-assessment
    difficulty: 1
    type: mcq
    stem: ข้อใดอยู่ในลำดับชั้นการควบคุมอันตราย (เลือกทุกข้อที่ถูก)
    multiple: true
    choices:
      - id: a
        text: การกำจัดอันตรายออกจากกระบวนการ
        correct: true
      - id: b
        text: การทดแทนสารอันตรายด้วยสารที่อันตรายน้อยกว่า
        correct: true
      - id: c
        text: การใช้อุปกรณ์ป้องกันส่วนบุคคลเป็นด่านสุดท้าย
        correct: true
      - id: d
        text: การออกใบรับรองประจำปีเพียงอย่างเดียว
        feedback: ใบรับรองไม่ได้ลดอันตรายที่หน้างาน จึงไม่อยู่ในลำดับชั้นการควบคุม
    hints:
      - ลำดับชั้นเริ่มจากการกำจัดอันตรายที่ต้นทาง ไปจนถึงอุปกรณ์ที่ผู้ปฏิบัติงานสวมใส่
      - การตรวจประจำปีอย่างเดียวไม่ได้ลดอันตรายที่หน้างาน
    solution: ลำดับชั้นมีการกำจัด การทดแทน การควบคุมทางวิศวกรรม การควบคุมทางบริหาร และอุปกรณ์ป้องกันส่วนบุคคล การออกใบรับรองประจำปีเพียงอย่างเดียวไม่ได้เป็นมาตรการควบคุมอันตรายที่หน้างาน
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.safety.risk-assessment.p003
    topics:
      - engineering.safety.risk-assessment
    difficulty: 1
    type: match
    stem: จับคู่มาตรการควบคุมกับตัวอย่างที่ตรงที่สุด
    pairs:
      - left: การควบคุมทางวิศวกรรม
        right: ติดการ์ดกันเครื่องจักรที่จุดหมุนของสายพาน
      - left: การควบคุมทางบริหาร
        right: กำหนดเวลาพักและหมุนเวียนงานเพื่อลดการสัมผัสสาร
      - left: การทดแทน
        right: เปลี่ยนตัวทำละลายเป็นสารที่มีความเป็นพิษต่ำกว่า
      - left: อุปกรณ์ป้องกันส่วนบุคคล (PPE)
        right: หน้ากากและถุงมือที่ผู้ปฏิบัติงานสวมเป็นด่านสุดท้าย
    hints:
      - การควบคุมทางวิศวกรรมมักเป็นการเปลี่ยนที่ตัวอุปกรณ์หรือแหล่งกำเนิด
      - การควบคุมทางบริหารเกี่ยวข้องกับระเบียบและการจัดการคน
    solution: การควบคุมทางวิศวกรรมเปลี่ยนที่แหล่งกำเนิด เช่น การ์ดกันเครื่องจักร การควบคุมทางบริหารคือระเบียบและการฝึกอบรม การทดแทนคือการเปลี่ยนสารให้อันตรายน้อยลง และอุปกรณ์ป้องกันส่วนบุคคลคือด่านสุดท้ายที่ผู้ปฏิบัติงานสวมใส่
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.safety.risk-assessment.p004
    topics:
      - engineering.safety.risk-assessment
    difficulty: 2
    type: numeric
    stem: ความเสี่ยงคำนวณจาก โอกาส (L) × ความรุนแรง (S) โดยใช้ตาราง 5 × 5 ถ้าโอกาสเป็น 4 และความรุนแรงเป็น 3 ค่าความเสี่ยงเท่ากับเท่าไร (ตอบตัวเลขอย่างเดียว)
    answer:
      value: 12
      tolerance: 0.01
    hints:
      - ค่าความเสี่ยงคือผลคูณของสองค่า ไม่ใช่ผลบวก
      - คูณ 4 × 3 แล้วดูว่าอยู่ในแถบใดของตาราง
    misconceptions:
      - match: 7
        feedback: นี่คือผลบวก 4 + 3 ไม่ใช่ผลคูณ ตารางความเสี่ยงใช้ผลคูณเพื่อให้ค่าที่สูงขึ้นเมื่อทั้งสองปัจจัยรุนแรงพร้อมกันเร็วกว่า
    solution: ค่าความเสี่ยง = L × S = 4 × 3 = 12 อยู่ในแถบสูง (10–16) ตามขอบเขตที่สมมติไว้ในบทเรียน ต้องดำเนินการลดความเสี่ยง
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.safety.risk-assessment.p005
    topics:
      - engineering.safety.risk-assessment
    difficulty: 2
    type: mcq
    stem: 'ตามอัตราส่วนของไฮน์ริช (1 : 29 : 300) ซึ่งเป็นที่อ้างกันทั่วไป ถ้ามีอุบัติเหตุที่บาดเจ็บรุนแรง 1 ครั้ง อุบัติเหตุที่ไม่มีการบาดเจ็บโดยประมาณกี่ครั้ง'
    choices:
      - id: a
        text: 29 ครั้ง
        feedback: 29 คือจำนวนอุบัติเหตุที่บาดเจ็บเล็กน้อย ไม่ใช่กลุ่มที่ไม่มีการบาดเจ็บ
      - id: b
        text: 300 ครั้ง
        correct: true
      - id: c
        text: 1 ครั้ง
        feedback: 1 คือจำนวนอุบัติเหตุรุนแรงที่เป็นฐานของอัตราส่วน
      - id: d
        text: 330 ครั้ง
        feedback: การรวม 29 กับ 300 เข้าด้วยกันไม่ใช่ตัวเลขที่อัตราส่วนระบุ
    hints:
      - อัตราส่วนนี้เรียงตามความรุนแรง จากบาดเจ็บรุนแรงไปหาไม่บาดเจ็บ
      - หาตัวเลขที่ตรงกับกลุ่มไม่มีการบาดเจ็บ ไม่ใช่กลุ่มบาดเจ็บเล็กน้อย
    solution: 'อัตราส่วน 1 : 29 : 300 หมายถึง บาดเจ็บรุนแรง 1 ต่ออุบัติเหตุบาดเจ็บเล็กน้อย 29 และอุบัติเหตุที่ไม่บาดเจ็บ 300 อัตราส่วนนี้เป็นการสังเกตที่อ้างกันทั่วไป ไม่ใช่กฎตายตัว จึงใช้เป็นแนวคิดเรื่องการรายงาน near miss ได้ดีกว่าใช้เป็นตัวเลขทำนาย'
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.safety.risk-assessment.p006
    topics:
      - engineering.safety.risk-assessment
    difficulty: 2
    type: numeric
    stem: (ข้อมูลสมมติ) โรงงานน้ำตาลในจังหวัดนครสวรรค์มีอุบัติเหตุที่ต้องหยุดงาน 3 ครั้งในรอบปี และชั่วโมงทำงานรวม 500,000 ชั่วโมง อัตราการหยุดงานต่อ 1,000,000 ชั่วโมง (LTIFR) เท่ากับเท่าไร (ตอบทศนิยมหนึ่งตำแหน่ง)
    answer:
      value: 6.0
      tolerance: 0.05
    hints:
      - LTIFR = จำนวนอุบัติเหตุที่หยุดงาน × 1,000,000 ÷ ชั่วโมงทำงานรวม
      - ชั่วโมงทำงานรวม 500,000 ชั่วโมง แต่ละ 1,000,000 ชั่วโมงเป็นฐานของอัตรา
    misconceptions:
      - match: 1.5
        feedback: คิดกลับด้านเป็น 3 × 500,000 ÷ 1,000,000 ต้องคูณจำนวนเหตุด้วย 1,000,000 แล้วหารด้วยชั่วโมงทำงานรวม
    solution: LTIFR = 3 × 1,000,000 ÷ 500,000 = 6.0 ต่อหนึ่งล้านชั่วโมงทำงาน ตัวเลขนี้ใช้เปรียบเทียบแนวโน้มระหว่างช่วงเวลาหรือหน่วยงานได้ แต่ไม่ได้บอกความรุนแรงของแต่ละเหตุ
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.safety.risk-assessment.p007
    topics:
      - engineering.safety.risk-assessment
    difficulty: 2
    type: order
    stem: เรียงลำดับขั้นตอนการวิเคราะห์ความปลอดภัยของงาน (JSA) อย่างเหมาะสม
    items:
      - แบ่งงานออกเป็นขั้นตอนย่อยตามลำดับการทำจริง
      - ระบุอันตรายและเหตุการณ์ที่อาจเกิดในแต่ละขั้นตอน
      - กำหนดมาตรการควบคุมตามลำดับชั้นการควบคุม
      - ทบทวนกับผู้ปฏิบัติงานและให้ผู้มีอำนาจอนุมัติ
    hints:
      - ต้องรู้ว่างานทำอะไรก่อนจะหาอันตรายได้
      - มาตรการควบคุมมาหลังจากรู้อันตรายแล้วเสมอ
    solution: JSA เริ่มจากการแบ่งงานเป็นขั้นตอน ระบุอันตรายในแต่ละขั้น กำหนดมาตรการควบคุมตามลำดับชั้น แล้วทบทวนกับผู้ปฏิบัติงานก่อนอนุมัติ
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.safety.risk-assessment.p008
    topics:
      - engineering.safety.risk-assessment
    difficulty: 3
    type: numeric
    stem: (ข้อมูลสมมติ) ระบบปั๊มน้ำระบายความร้อนของโรงไฟฟ้าขนาดเล็กในจังหวัดระยองมีสองเหตุการณ์ที่อาจทำให้การไหลหยุด คือไฟฟ้าขัดข้อง (ความน่าจะเป็น 0.03) และวาล์วติด (ความน่าจะเป็น 0.06) ถ้าเหตุการณ์ทั้งสองเป็นอิสระต่อกัน และการไหลหยุดเกิดเมื่อเหตุการณ์ใดเกิดขึ้นก็ได้ (ประตู OR) ความน่าจะเป็นของการไหลหยุดเป็นกี่เปอร์เซ็นต์ (ตอบทศนิยมหนึ่งตำแหน่ง)
    answer:
      value: 8.8
      tolerance: 0.05
      unit: '%'
    hints:
      - 'ประตู OR: P = 1 − (1 − p₁)(1 − p₂)'
      - คำนวณ (1 − 0.03) × (1 − 0.06) ก่อน แล้วลบจาก 1
    misconceptions:
      - match: 9.0
        feedback: บวกความน่าจะเป็นตรง ๆ ได้ 0.09 ซึ่งเกินจริงเล็กน้อยเพราะนับกรณีที่เกิดพร้อมกันซ้ำ ต้องใช้ 1 − (1 − p₁)(1 − p₂)
      - match: 0.18
        feedback: คูณความน่าจะเป็นแบบประตู AND แต่โจทย์เป็นประตู OR ที่เหตุการณ์ใดเกิดก็ได้
    solution: P = 1 − (1 − 0.03)(1 − 0.06) = 1 − 0.97 × 0.94 = 1 − 0.9118 = 0.0882 ≈ 8.8%
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.safety.risk-assessment.p009
    topics:
      - engineering.safety.risk-assessment
    difficulty: 3
    type: numeric
    stem: ความถี่ของเหตุการณ์เริ่มต้นการรั่วของถังเป็น 0.5 ครั้งต่อปี เป้าหมายความเสี่ยงให้เกิดเหตุร้ายแรงไม่เกิน 1 ครั้งต่อ 10,000 ปี (1 × 10⁻⁴ ต่อปี) ชั้นป้องกันแรกคือระบบเตือนที่มี PFD = 0.1 ชั้นป้องกันที่สองต้องมี PFD ไม่เกินเท่าไร (ตอบทศนิยมสามตำแหน่ง ตัวเลขอย่างเดียว)
    answer:
      value: 0.002
      tolerance: 0.0001
    hints:
      - ความถี่ที่ผ่านชั้นป้องกันทั้งหมด = ความถี่เริ่มต้น × PFD₁ × PFD₂
      - จัดสมการให้ PFD₂ = เป้าหมาย ÷ (ความถี่เริ่มต้น × PFD₁)
    misconceptions:
      - match: 0.001
        feedback: ลืมนำความถี่ของเหตุการณ์เริ่มต้น 0.5 ต่อปีมาคิดด้วย
    solution: PFD₂ ≤ 1 × 10⁻⁴ ÷ (0.5 × 0.1) = 1 × 10⁻⁴ ÷ 0.05 = 0.002 ชั้นที่สองต้องมีความน่าเชื่อถือสูงกว่า 0.002 (หรือเท่ากับ) เช่น วาล์วปิดอัตโนมัติที่ทดสอบตามกำหนด
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.safety.risk-assessment.p010
    topics:
      - engineering.safety.risk-assessment
    difficulty: 3
    type: mcq
    stem: ในการวิเคราะห์ HAZOP คำนำ (guide word) 'NO' สำหรับเส้นท่อส่งสารเคมีหมายความว่าอย่างไร
    choices:
      - id: a
        text: ไม่มีการไหลเลยในท่อที่ควรมีการไหล
        correct: true
      - id: b
        text: การไหลมากกว่าค่าปกติ
        feedback: นั่นคือคำนำ More
      - id: c
        text: การไหลย้อนทิศทาง
        feedback: นั่นคือคำนำ Reverse
      - id: d
        text: มีสิ่งเจือปนเพิ่มเข้ามาในการไหล
        feedback: นั่นคือคำนำ As well as
    hints:
      - คำนำ 'NO' ใช้กับพารามิเตอร์กระบวนการ เช่น การไหล ความดัน หรืออุณหภูมิ
      - ลองนึกถึงสถานการณ์ที่ไม่มีสิ่งที่ควรมีเลย
    solution: คำนำ NO หมายถึงไม่มีตัวแปรกระบวนการนั้นเลยเมื่อควรมี เช่น ไม่มีการไหลในท่อที่ควรส่งสารเคมีไปยังถังปฏิกรณ์ ส่วน More และ Less หมายถึงปริมาณที่มากหรือน้อยกว่าปกติ
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.safety.risk-assessment.p011
    topics:
      - engineering.safety.risk-assessment
    difficulty: 3
    type: mcq
    stem: (ข้อมูลสมมติ) โรงงานทำตู้ในจังหวัดสมุทรปราการทาสีผลิตภัณฑ์ในห้องปิดที่ระบายอากาศได้ไม่ดี ซึ่งมีตัวทำละลายระเหยสูง ควรเลือกมาตรการใดเป็นอันดับแรกตามลำดับชั้นการควบคุม
    choices:
      - id: a
        text: ให้ผู้ปฏิบัติงานสวมหน้ากากอย่างเดียว
