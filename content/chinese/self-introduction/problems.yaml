problems:
- id: chinese.vocab.self-introduction.p001
  topics:
  - chinese.vocab.self-introduction
  difficulty: 1
  type: mcq
  stem: 我叫王小龙。 (Wǒ jiào Wáng Xiǎolóng.) แปลว่าอะไร
  choices:
  - id: a
    text: คุณชื่อหวังเสี่ยวหลง
    feedback: 我 = ฉัน ไม่ใช่ คุณ
  - id: b
    text: ฉันเป็นคนจีน
    feedback: ไม่มีคำว่า 中国人 ในประโยค
  - id: c
    text: ฉันชื่อหวังเสี่ยวหลง
    correct: true
    feedback: ถูก 我叫 + ชื่อ = ฉันชื่อ…
  - id: d
    text: ฉันเรียกหวังเสี่ยวหลง
    feedback: 叫 แปลว่า เรียก ได้ แต่ 我叫 + ชื่อ ใช้บอกชื่อตัวเอง
  hints:
  - 我 = ฉัน
  - 叫 jiào ตามด้วยชื่อ ใช้บอกว่าชื่ออะไร
  solution: '**ฉันชื่อหวังเสี่ยวหลง** 王 Wáng เป็นแซ่ (นามสกุล) 小龙 Xiǎolóng เป็นชื่อ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.self-introduction.p002
  topics:
  - chinese.vocab.self-introduction
  difficulty: 1
  type: match
  stem: จับคู่คำเรียกสมาชิกในครอบครัวกับความหมาย
  pairs:
  - left: 爸爸 bàba
    right: พ่อ
  - left: 妈妈 māma
    right: แม่
  - left: 哥哥 gēge
    right: พี่ชาย
  - left: 姐姐 jiějie
    right: พี่สาว
  - left: 弟弟 dìdi
    right: น้องชาย
  - left: 妹妹 mèimei
    right: น้องสาว
  hints:
  - 哥哥 弟弟 เป็นผู้ชาย 姐姐 妹妹 เป็นผู้หญิง
  - อักษร 女 (ผู้หญิง) อยู่ใน 妈 姐 妹
  solution: 爸爸 พ่อ · 妈妈 แม่ · 哥哥 พี่ชาย · 姐姐 พี่สาว · 弟弟 น้องชาย · 妹妹 น้องสาว
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.self-introduction.p003
  topics:
  - chinese.vocab.self-introduction
  difficulty: 2
  type: hanzi
  stem: เขียนอักษร 叫 (jiào) ที่ใช้ในประโยค 我叫… (ฉันชื่อ…) ตามลำดับขีด
  character: 叫
  pinyin: jiào
  meaning: ชื่อ เรียก ร้อง
  hints:
  - 叫 = 口 ทางซ้าย + ส่วนขวา 2 ขีด รวม 5 ขีด
  - เขียน 口 ให้เสร็จก่อน ส่วนขวาเขียนขีดตั้งที่หักขึ้นก่อน แล้วจึงเขียนขีดตั้งยาว
  solution: 竖 → 横折 → 横 (口) → 竖提 → 竖 รวม 5 ขีด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.self-introduction.p004
  topics:
  - chinese.vocab.self-introduction
  difficulty: 2
  type: order
  stem: เรียงคำเป็นประโยค "ปีนี้ฉันอายุ 13 ปี"
  items:
  - 我
  - 今年
  - 十三
  - 岁
  hints:
  - ประธานขึ้นก่อน แล้วตามด้วยคำบอกเวลา 今年 (ปีนี้)
  - จำนวน + 岁 วางท้าย ไม่ต้องมีกริยา
  solution: '**我今年十三岁。** Wǒ jīnnián shísān suì.'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.self-introduction.p005
  topics:
  - chinese.vocab.self-introduction
  difficulty: 2
  type: mcq
  stem: '"ฉันอายุ 12 ปี" ประโยคใดถูกต้อง'
  choices:
  - id: a
    text: 我有十二岁。
    feedback: ภาษาไทยพูดว่า มีอายุ ได้ แต่ภาษาจีนไม่ใช้ 有 บอกอายุ
  - id: b
    text: 我十二年。
    feedback: 年 nián = ปี (ระยะเวลา) อายุใช้ 岁 suì
  - id: c
    text: 我十二岁。
    correct: true
    feedback: 'ถูก บอกอายุไม่ต้องมีกริยา: ประธาน + จำนวน + 岁'
  - id: d
    text: 我是十二岁。
    feedback: บอกอายุทั่วไปไม่ใช้ 是
  hints:
  - คำบอกอายุคือ 岁 suì
  - ภาษาจีนวางตัวเลข + 岁 ต่อจากประธานได้เลย
  solution: '**我十二岁。** Wǒ shí''èr suì. (ปฏิเสธจึงจะใช้ 不是 เช่น 我不是十二岁)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.self-introduction.p006
  topics:
  - chinese.vocab.self-introduction
  difficulty: 2
  type: mcq
  stem: นักเรียนแลกเปลี่ยนชาวจีนที่โรงเรียนในอุดรธานีถามว่า 你叫什么名字？ ถ้าเราชื่อมะลิ (玛丽 Mǎlì) ควรตอบว่าอะไร
  choices:
  - id: a
    text: 我名字玛丽。
    feedback: ขาดกริยา ต้องเป็น 我叫玛丽 หรือ 我的名字是玛丽
  - id: b
    text: 你叫玛丽。
    feedback: 你 = คุณ ต้องบอกชื่อตัวเองด้วย 我
  - id: c
    text: 我叫什么玛丽。
    feedback: 什么 เป็นคำถาม ใช้ในประโยคตอบไม่ได้
  - id: d
    text: 我叫玛丽。
    correct: true
    feedback: ถูก 我叫 + ชื่อ
  hints:
  - คำถามคือ คุณชื่ออะไร
  - แทน 你 ด้วย 我 และแทน 什么名字 ด้วยชื่อของเรา
  solution: '**我叫玛丽。** Wǒ jiào Mǎlì.'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.self-introduction.p007
  topics:
  - chinese.vocab.self-introduction
  difficulty: 3
  type: mcq
  stem: ดูบัตรในภาพ มะลิควรแนะนำตัวว่าอย่างไร
  figure:
    src: profile-card.svg
    alt: 'บัตรนักเรียนแลกเปลี่ยน มีกรอบรูปคนด้านซ้าย ข้อมูล: ชื่อจีน 玛丽 (Mǎlì) · สัญชาติ ไทย · อายุ 13 ปี · ครอบครัว พ่อ แม่ พี่สาว 1 คน และตัวเอง · เมือง กรุงเทพฯ'
    caption: บัตรข้อมูลของมะลิ
  choices:
  - id: a
    text: 我叫玛丽，我是泰国人，今年十三岁。我家有四口人：爸爸、妈妈、姐姐和我。
    correct: true
    feedback: ถูก ตรงกับบัตรทุกข้อ ครอบครัวมี 4 คน
  - id: b
    text: 我叫玛丽，我是泰国人，今年十三岁。我家有四口人：爸爸、妈妈、哥哥和我。
    feedback: บัตรบอกว่ามีพี่สาว (姐姐) ไม่ใช่พี่ชาย (哥哥)
  - id: c
    text: 我叫玛丽，我是泰国人，今年十三岁。我家有三口人：爸爸、妈妈、姐姐。
    feedback: ต้องนับตัวเองด้วย ครอบครัวจึงมี 4 คน
  - id: d
    text: 我叫玛丽，我是中国人，今年十三岁。我家有四口人：爸爸、妈妈、姐姐和我。
    feedback: บัตรบอกสัญชาติไทย 泰国人
  hints:
  - 'ตรวจทีละเรื่อง: ชื่อ สัญชาติ อายุ ครอบครัว'
  - นับคนในครอบครัวรวมตัวเองด้วย
  solution: '**我叫玛丽，我是泰国人，今年十三岁。我家有四口人：爸爸、妈妈、姐姐和我。**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.self-introduction.p008
  topics:
  - chinese.vocab.self-introduction
  difficulty: 3
  type: text
  stem: เขียน "ฉันไม่มีพี่ชาย" เป็นภาษาจีน (พิมพ์อักษรจีน)
  accepted:
  - 我没有哥哥
  - 我没有哥哥。
  - 我没有哥哥.
  - 我没有哥哥？
  - 我没有哥哥?
  - 我没哥哥
  - 我没哥哥。
  - 我没哥哥.
  - 我没哥哥？
  - 我没哥哥?
  - 我沒有哥哥
  - 我沒有哥哥。
  - 我沒有哥哥.
  - 我沒有哥哥？
  - 我沒有哥哥?
  - 我沒哥哥
  - 我沒哥哥。
  - 我沒哥哥.
  - 我沒哥哥？
  - 我沒哥哥?
  misconceptions:
  - match: 我不有哥哥
    feedback: 有 ปฏิเสธด้วย 没 ไม่ใช่ 不
  - match: 我不有哥哥。
    feedback: 有 ปฏิเสธด้วย 没 ไม่ใช่ 不
  - match: 我不有哥哥？
    feedback: 有 ปฏิเสธด้วย 没 ไม่ใช่ 不
  - match: 我没有弟弟
    feedback: 弟弟 คือ น้องชาย พี่ชายคือ 哥哥
  - match: 我没有弟弟。
    feedback: 弟弟 คือ น้องชาย พี่ชายคือ 哥哥
  - match: 我没有弟弟？
    feedback: 弟弟 คือ น้องชาย พี่ชายคือ 哥哥
  - match: 我没有姐姐
    feedback: 姐姐 คือ พี่สาว พี่ชายคือ 哥哥
  - match: 我没有姐姐。
    feedback: 姐姐 คือ พี่สาว พี่ชายคือ 哥哥
  - match: 我没有姐姐？
    feedback: 姐姐 คือ พี่สาว พี่ชายคือ 哥哥
  hints:
  - ไม่มี = 没有
  - พี่ชาย = 哥哥
  solution: '**我没有哥哥。** Wǒ méiyǒu gēge.'
