problems:
  - id: physics.energy.simple-machines.p001
    topics: [physics.energy.simple-machines]
    difficulty: 1
    type: mcq
    stem: "ทางลาดสำหรับเข็นรถเข็นขึ้นอาคารเป็นเครื่องกลอย่างง่ายชนิดใด"
    choices:
      - { id: a, text: "พื้นเอียง", correct: true }
      - { id: b, text: "รอก", feedback: "รอกเป็นล้อที่มีร่องให้เชือกพาด ทางลาดไม่มีเชือกหรือล้อ" }
      - { id: c, text: "คาน", feedback: "คานเป็นแท่งที่หมุนรอบจุดหมุน ทางลาดไม่ได้หมุน" }
    hints:
      - "ทางลาดเป็นพื้นที่สูงขึ้นทีละน้อย"
      - "ชื่อเครื่องกลชนิดนี้บอกลักษณะของพื้น"
    solution: "ทางลาดคือพื้นเอียง ช่วยให้ใช้แรงน้อยลงเพื่อขึ้นที่สูง แต่ต้องเคลื่อนที่เป็นระยะทางไกลขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.simple-machines.p002
    topics: [physics.energy.simple-machines]
    difficulty: 1
    type: text
    stem: "เครื่องกลที่เป็นล้อมีร่องให้เชือกพาด ใช้ยกของขึ้นที่สูง เช่น ที่ใช้ชักธงขึ้นเสา เรียกว่าอะไร"
    accepted: ["รอก", "pulley", "รอกเดี่ยว", "รอกเดี่ยวตายตัว"]
    misconceptions:
      - { match: "คาน", feedback: "คานเป็นแท่งที่หมุนรอบจุดหมุน ไม่มีเชือกพาดบนล้อ" }
      - { match: "ล้อกับเพลา", feedback: "ล้อกับเพลาเป็นล้อที่ยึดติดกับแกนหมุนไปด้วยกัน แต่ล้อที่มีร่องให้เชือกพาดมีชื่อเฉพาะ" }
    hints:
      - "ที่ยอดเสาธงมีล้อเล็ก ๆ ให้เชือกพาด"
      - "ชื่อเครื่องกลนี้มีสามตัวอักษร"
    solution: "รอก ที่ยอดเสาธงเป็นรอกเดี่ยวตายตัว ช่วยให้ดึงเชือกลงเพื่อให้ธงขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.simple-machines.p003
    topics: [physics.energy.simple-machines]
    difficulty: 2
    type: match
    stem: "จับคู่เครื่องมือกับชนิดของเครื่องกลอย่างง่าย"
    pairs:
      - { left: "ขวานผ่าฟืน", right: "ลิ่ม" }
      - { left: "พวงมาลัยรถ", right: "ล้อกับเพลา" }
      - { left: "แม่แรงแบบเกลียว", right: "สกรู" }
      - { left: "ครกกระเดื่อง", right: "คาน" }
      - { left: "ทางลาดขึ้นสะพาน", right: "พื้นเอียง" }
      - { left: "อุปกรณ์ชักธงบนยอดเสา", right: "รอก" }
    hints:
      - "เครื่องมือใดมีเกลียว เครื่องมือใดมีจุดหมุน"
      - "ลิ่มคือพื้นเอียงสองด้านที่คม"
    solution: "ขวานเป็นลิ่ม พวงมาลัยเป็นล้อกับเพลา แม่แรงเกลียวเป็นสกรู ครกกระเดื่องเป็นคาน ทางลาดเป็นพื้นเอียง และอุปกรณ์ชักธงเป็นรอก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.simple-machines.p004
    topics: [physics.energy.simple-machines]
    difficulty: 2
    type: mcq
    stem: "รอกเดี่ยวตายตัวบนยอดเสาธงช่วยเราอย่างไร"
    choices:
      - { id: a, text: "เปลี่ยนทิศของแรง ให้ดึงลงเพื่อยกธงขึ้น แต่ไม่ช่วยลดแรง", correct: true }
      - { id: b, text: "ลดแรงที่ใช้ลงครึ่งหนึ่ง", feedback: "รอกที่ลดแรงลงครึ่งหนึ่งคือรอกเดี่ยวเคลื่อนที่ ซึ่งมีเชือกรับภาระสองเส้น รอกตายตัวมีเส้นเดียว" }
      - { id: c, text: "ทำให้งานที่ใช้น้อยลง", feedback: "เครื่องกลไม่ลดงาน รอกตายตัวยังต้องดึงเชือกยาวเท่ากับระยะที่ธงขึ้น ด้วยแรงเท่าเดิม" }
    hints:
      - "ดึงเชือกลง 1 m ธงขึ้นกี่เมตร"
      - "ถ้าระยะเท่ากัน แรงต้องเท่าเดิมหรือไม่"
    solution: "รอกตายตัวมีเชือกรับภาระเส้นเดียว ดึงลงเท่าใดธงขึ้นเท่านั้น จึงไม่ลดแรง (MA = 1) แต่เปลี่ยนทิศ ทำให้ยืนที่พื้นแล้วดึงลงได้สะดวก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.simple-machines.p005
    topics: [physics.energy.simple-machines]
    difficulty: 2
    type: numeric
    stem: "ใช้รอกเดี่ยวเคลื่อนที่ยกถังปูนหนัก $300\\ \\mathrm{N}$ ถ้ารอกเบาและลื่น ต้องดึงเชือกด้วยแรงเท่าใด (ตอบในหน่วย N)"
    answer: { value: 150, tolerance: 1.5, unit: N }
    misconceptions:
      - { match: 300, feedback: "รอกเดี่ยวเคลื่อนที่มีเชือกรับภาระสองเส้น แต่ละเส้นรับครึ่งหนึ่ง" }
      - { match: 600, feedback: "รอกช่วยลดแรง ไม่ได้เพิ่มแรง ต้องหารด้วยจำนวนเส้นเชือกที่รับภาระ" }
    hints:
      - "รอกเดี่ยวเคลื่อนที่มีเชือกรับภาระกี่เส้น"
      - "แรงดึง = น้ำหนัก ÷ จำนวนเส้นเชือกที่รับภาระ"
    solution: "เชือกรับภาระสองเส้น $F = \\dfrac{300}{2} = 150\\ \\mathrm{N}$ แต่ต้องดึงเชือกยาวเป็นสองเท่าของระยะที่ถังขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.simple-machines.p006
    topics: [physics.energy.simple-machines]
    difficulty: 3
    type: numeric
    stem: "กลิ้งถังน้ำมันหนัก $600\\ \\mathrm{N}$ ขึ้นกระบะรถตามไม้กระดานยาว $3.0\\ \\mathrm{m}$ กระบะสูง $0.75\\ \\mathrm{m}$ ถ้าไม่มีแรงเสียดทาน ต้องออกแรงตามแนวไม้กระดานเท่าใด (ตอบในหน่วย N)"
    answer: { value: 150, tolerance: 1.5, unit: N }
    misconceptions:
      - { match: 2400, feedback: "กลับเศษส่วน ต้องคูณด้วย $h/L$ (น้อยกว่า 1) ไม่ใช่ $L/h$ พื้นเอียงช่วยลดแรง" }
      - { match: 600, feedback: "นี่คือแรงที่ใช้ยกตรง ๆ พื้นเอียงทำให้ใช้แรงน้อยลงเพราะระยะยาวขึ้น" }
    hints:
      - "งานที่ใส่ = งานที่ได้: $F \\times L = W \\times h$"
      - "$F = W \\times \\dfrac{h}{L}$"
    solution: "$F = \\dfrac{W h}{L} = \\dfrac{600 \\times 0.75}{3.0} = 150\\ \\mathrm{N}$ น้อยกว่าน้ำหนักถัง 4 เท่า เพราะไม้กระดานยาวเป็น 4 เท่าของความสูง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.simple-machines.p007
    topics: [physics.energy.simple-machines]
    difficulty: 3
    type: numeric
    stem: "ช่างกดปลายชะแลงลงด้วยแรง $120\\ \\mathrm{N}$ เป็นระยะ $0.60\\ \\mathrm{m}$ อีกปลายหนึ่งงัดก้อนหินขึ้นได้ $0.15\\ \\mathrm{m}$ ถ้าไม่มีการสูญเสีย ก้อนหินหนักเท่าใด (ตอบในหน่วย N)"
    answer: { value: 480, tolerance: 4.8, unit: N }
    misconceptions:
      - { match: 30, feedback: "คูณกับอัตราส่วนกลับด้าน ภาระเคลื่อนที่น้อยกว่า จึงต้องหนักกว่าแรงที่ใช้" }
      - { match: 120, feedback: "ถ้าแรงเท่ากับภาระ ระยะทั้งสองข้างต้องเท่ากัน แต่ที่นี่มือเคลื่อนที่ไกลกว่า 4 เท่า" }
    hints:
      - "งานที่ใส่ = งานที่ได้"
      - "$120 \\times 0.60 = W \\times 0.15$"
    solution: "งานที่ใส่ $= 120 \\times 0.60 = 72\\ \\mathrm{J}$ เท่ากับงานยกหิน $W \\times 0.15$ ได้ $W = \\dfrac{72}{0.15} = 480\\ \\mathrm{N}$ ได้แรงมากขึ้น 4 เท่า แลกกับระยะที่น้อยลง 4 เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.simple-machines.p008
    topics: [physics.energy.simple-machines]
    difficulty: 3
    type: numeric
    stem: "พวงมาลัยรถมีรัศมี $20\\ \\mathrm{cm}$ ยึดกับแกนพวงมาลัยรัศมี $2.5\\ \\mathrm{cm}$ การได้เปรียบเชิงกลในอุดมคติเป็นเท่าใด"
    answer: { value: 8, tolerance: 0.08 }
    misconceptions:
      - { match: 0.125, feedback: "กลับเศษส่วน ออกแรงที่ขอบล้อรัศมีใหญ่ MA $= R/r$ ซึ่งมากกว่า 1" }
      - { match: 17.5, feedback: "นำรัศมีมาลบกัน MA เป็นอัตราส่วน ต้องหาร" }
    hints:
      - "ล้อกับเพลา: $F \\times R = W \\times r$"
      - "MA $= \\dfrac{R}{r}$"
    solution: "MA $= \\dfrac{R}{r} = \\dfrac{20}{2.5} = 8$ ออกแรงที่พวงมาลัยน้อยกว่าแรงที่แกนต้องหมุน 8 เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.simple-machines.p009
    topics: [physics.energy.simple-machines]
    difficulty: 3
    type: numeric
    stem: "ระบบรอกในภาพยกภาระหนัก $360\\ \\mathrm{N}$ ถ้ารอกเบาและลื่น ต้องดึงเชือกด้วยแรงเท่าใด (ตอบในหน่วย N)"
    figure: { src: p-pulley.svg, alt: "ระบบรอก มีรอกตายตัวสองตัวแขวนจากเพดาน และรอกเคลื่อนที่หนึ่งตัวอยู่ด้านล่างติดกับคานสั้นที่แขวนภาระ 360 N ปลายเชือกด้านหนึ่งผูกกับคานของชุดรอกเคลื่อนที่ ขึ้นไปพาดรอกตายตัวตัวซ้าย ลงมาอ้อมใต้รอกเคลื่อนที่ ขึ้นไปพาดรอกตายตัวตัวขวา แล้วลงมาถึงมือที่ดึงลงด้วยแรง F ที่ไม่ทราบค่า" }
    answer: { value: 120, tolerance: 1.2, unit: N }
    misconceptions:
      - { match: 180, feedback: "นับเชือกรับภาระได้ 2 เส้น ลองนับใหม่ เส้นที่ผูกกับคานของชุดรอกเคลื่อนที่ก็รับภาระด้วย" }
      - { match: 90, feedback: "นับเส้นที่ลงมาถึงมือด้วย เส้นนั้นมาจากรอกตายตัว ไม่ได้ต่อกับชุดรอกเคลื่อนที่" }
    hints:
      - "นับเส้นเชือกที่ต่อกับชุดรอกเคลื่อนที่ (รอกล่างและคานที่แขวนภาระ)"
      - "แรงดึง = น้ำหนัก ÷ จำนวนเส้นที่รับภาระ"
    solution: "ชุดรอกเคลื่อนที่ถูกรับด้วยเชือก 3 เส้น (เส้นที่ผูกกับคาน และสองข้างของรอกล่าง) $F = \\dfrac{360}{3} = 120\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.simple-machines.p010
    topics: [physics.energy.simple-machines]
    difficulty: 3
    type: order
    stem: "ต้องการเข็นรถเข็นหนักเท่าเดิมขึ้นชานบ้านสูง 0.5 m ด้วยทางลาดที่ยาวต่างกัน (ไม่มีแรงเสียดทาน) เรียงทางลาดจากที่ต้องใช้แรงมากที่สุดไปน้อยที่สุด"
    items:
      - "ทางลาดยาว 1 m"
      - "ทางลาดยาว 2 m"
      - "ทางลาดยาว 4 m"
      - "ทางลาดยาว 6 m"
    hints:
      - "ความสูงเท่ากัน งานที่ต้องทำเท่ากัน"
      - "$F = W h / L$ ถ้า $L$ ยาวขึ้น แรงเป็นอย่างไร"
    solution: "งาน $Wh$ เท่ากันทุกทาง แรง $F = Wh/L$ จึงลดลงเมื่อทางลาดยาวขึ้น ทางยาว 1 m ใช้แรงมากที่สุด ทางยาว 6 m ใช้แรงน้อยที่สุด แต่ต้องเข็นไกลที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.simple-machines.p011
    topics: [physics.energy.simple-machines]
    difficulty: 4
    type: numeric
    stem: "ร้านกาแฟต้องการสร้างทางลาดให้รถเข็นผู้พิการขึ้นพื้นร้านที่สูงจากทางเท้า $0.60\\ \\mathrm{m}$ ตามเกณฑ์ความชันไม่เกิน 1 ต่อ 12 ทางลาดต้องมีระยะตามแนวราบอย่างน้อยเท่าใด (ตอบในหน่วย m)"
    answer: { value: 7.2, tolerance: 0.07, unit: m }
    misconceptions:
      - { match: 0.05, feedback: "นำความสูงหารด้วย 12 ความชัน 1 ต่อ 12 แปลว่าสูง 1 ส่วน ต้องยาว 12 ส่วน จึงต้องคูณ" }
      - { match: 12, feedback: "12 m ใช้กับความสูง 1 m ความสูงจริงคือ 0.60 m" }
    hints:
      - "ความชัน 1 ต่อ 12 แปลว่าสูงขึ้น 1 ส่วน ระยะตามแนวราบ 12 ส่วน"
      - "ระยะตามแนวราบ = ความสูง × 12"
    solution: "ระยะตามแนวราบ $= 0.60 \\times 12 = 7.2\\ \\mathrm{m}$ ทางลาดที่ยาวพอทำให้แรงที่ใช้เข็นขึ้นเหลือราวหนึ่งในสิบสองของน้ำหนักรถเข็นกับผู้นั่ง (ไม่คิดแรงเสียดทาน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.simple-machines.p012
    topics: [physics.energy.simple-machines]
    difficulty: 4
    type: numeric
    stem: "ในการทดลองระบบรอก ออกแรง $200\\ \\mathrm{N}$ ดึงเชือกยาว $1.6\\ \\mathrm{m}$ ยกภาระ $600\\ \\mathrm{N}$ ขึ้นสูง $0.40\\ \\mathrm{m}$ ระบบรอกนี้มีประสิทธิภาพกี่เปอร์เซ็นต์ (ตอบในหน่วย %)"
    answer: { value: 75, tolerance: 0.75, unit: "%" }
    misconceptions:
      - { match: 133.3, feedback: "กลับเศษส่วน ประสิทธิภาพ = งานที่ได้ ÷ งานที่ใส่ และไม่เกิน 100% เสมอ" }
      - { match: 300, feedback: "นี่คือการได้เปรียบเชิงกลจริง $600/200 = 3$ คูณ 100 ประสิทธิภาพต้องเทียบงาน ไม่ใช่เทียบแรงอย่างเดียว" }
    hints:
      - "งานที่ได้ = ภาระ × ระยะที่ภาระขึ้น งานที่ใส่ = แรงพยายาม × ระยะที่ดึง"
      - "ประสิทธิภาพ = งานที่ได้ ÷ งานที่ใส่ × 100%"
    solution: "งานที่ได้ $600 \\times 0.40 = 240\\ \\mathrm{J}$ งานที่ใส่ $200 \\times 1.6 = 320\\ \\mathrm{J}$ ประสิทธิภาพ $= \\dfrac{240}{320} \\times 100\\% = 75\\%$ (MA ในอุดมคติ $= 1.6/0.40 = 4$ แต่ MA จริง $= 3$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.simple-machines.p013
    topics: [physics.energy.simple-machines]
    difficulty: 4
    type: mcq
    stem: "ข้อความใดถูกต้องเกี่ยวกับเครื่องกลอย่างง่ายในอุดมคติ (ไม่มีแรงเสียดทาน)"
    choices:
      - { id: a, text: "ช่วยให้ออกแรงน้อยลงได้ แต่ต้องออกแรงเป็นระยะไกลขึ้น ผลคูณของแรงกับระยะเท่าเดิม", correct: true }
      - { id: b, text: "ช่วยลดทั้งแรงและระยะทาง จึงประหยัดงาน", feedback: "ถ้าลดทั้งแรงและระยะ งานที่ใส่จะน้อยกว่างานที่ได้ ซึ่งขัดกับการอนุรักษ์พลังงาน" }
      - { id: c, text: "ทำให้งานที่ได้มากกว่างานที่ใส่", feedback: "เครื่องกลไม่สร้างพลังงาน งานที่ได้มากที่สุดเท่ากับงานที่ใส่ (ในอุดมคติ)" }
    hints:
      - "งานที่ใส่กับงานที่ได้ของเครื่องกลในอุดมคติเป็นอย่างไร"
      - "ถ้าแรงลดลง อะไรต้องเพิ่มขึ้น"
    solution: "เครื่องกลในอุดมคติ $F_{\\text{พยายาม}} s_{\\text{พยายาม}} = W s_{\\text{ภาระ}}$ ได้แรงมากขึ้นต้องแลกกับระยะที่มากขึ้น (หรือกลับกัน) งานไม่เพิ่มและไม่ลด"
