<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="sans-serif">
<title>ค่าใช้จ่ายหลอดไฟ 10,000 ชั่วโมง</title>
<rect width="760" height="440" fill="#ffffff"/>
<text x="380.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">ค่าใช้จ่ายหลอดไฟเมื่อใช้ 10,000 ชั่วโมง (บาท)</text>
<line x1="110" y1="330.0" x2="670" y2="330.0" stroke="#334155" stroke-width="1.5"/>
<text x="100" y="335.0" text-anchor="end" font-size="13" fill="#374151">0</text>
<line x1="110" y1="287.1428571428571" x2="670" y2="287.1428571428571" stroke="#e5e7eb" stroke-width="1"/>
<text x="100" y="292.1428571428571" text-anchor="end" font-size="13" fill="#374151">500</text>
<line x1="110" y1="244.28571428571428" x2="670" y2="244.28571428571428" stroke="#e5e7eb" stroke-width="1"/>
<text x="100" y="249.28571428571428" text-anchor="end" font-size="13" fill="#374151">1,000</text>
<line x1="110" y1="201.42857142857144" x2="670" y2="201.42857142857144" stroke="#e5e7eb" stroke-width="1"/>
<text x="100" y="206.42857142857144" text-anchor="end" font-size="13" fill="#374151">1,500</text>
<line x1="110" y1="158.57142857142856" x2="670" y2="158.57142857142856" stroke="#e5e7eb" stroke-width="1"/>
<text x="100" y="163.57142857142856" text-anchor="end" font-size="13" fill="#374151">2,000</text>
<line x1="110" y1="115.7142857142857" x2="670" y2="115.7142857142857" stroke="#e5e7eb" stroke-width="1"/>
<text x="100" y="120.7142857142857" text-anchor="end" font-size="13" fill="#374151">2,500</text>
<rect x="200" y="312.85714285714283" width="130" height="17.142857142857167" fill="#fde68a" stroke="#334155" stroke-width="1.2"/>
<rect x="200" y="107.14285714285714" width="130" height="205.7142857142857" fill="#93c5fd" stroke="#334155" stroke-width="1.2"/>
<text x="340" y="315.85714285714283" font-size="14" fill="#111827">ค่าหลอด 200</text>
<text x="340" y="215.0" font-size="14" fill="#111827">ค่าไฟ 2,400</text>
<text x="265.0" y="97.14285714285714" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">รวม 2,600</text>
<text x="265.0" y="356" text-anchor="middle" font-size="15" fill="#111827">หลอดไส้ 60 W</text>
<rect x="440" y="319.7142857142857" width="130" height="10.285714285714278" fill="#fde68a" stroke="#334155" stroke-width="1.2"/>
<rect x="440" y="288.85714285714283" width="130" height="30.85714285714289" fill="#93c5fd" stroke="#334155" stroke-width="1.2"/>
<text x="580" y="322.7142857142857" font-size="14" fill="#111827">ค่าหลอด 120</text>
<text x="580" y="309.2857142857143" font-size="14" fill="#111827">ค่าไฟ 360</text>
<text x="505.0" y="278.85714285714283" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">รวม 480</text>
<text x="505.0" y="356" text-anchor="middle" font-size="15" fill="#111827">หลอด LED 9 W</text>
<line x1="110" y1="330" x2="670" y2="330" stroke="#334155" stroke-width="1.5"/>
<text x="380.0" y="400" text-anchor="middle" font-size="14" fill="#374151">ค่าสมมติ: ค่าไฟ 4 บาทต่อหน่วย หลอดไส้ 20 บาท อายุ 1,000 ชม. หลอด LED 120 บาท อายุ 10,000 ชม.</text>
<text x="380.0" y="424" text-anchor="middle" font-size="14" fill="#374151">ตัวเลขใช้ฝึกเปรียบเทียบเท่านั้น ราคาและอายุจริงต้องตรวจจากฉลาก ร้านค้า และการไฟฟ้า</text>
</svg>
