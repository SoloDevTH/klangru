  - id: engineering.environmental.wastewater-treatment.p018
    topics: [engineering.environmental.wastewater-treatment]
    difficulty: 5
    type: numeric
    stem: "ระบบแอกทิเวเต็ดสลัดจ์มี $Y = 0.5$ $\\mu_{max} = 2.0\\ \\mathrm{d^{-1}}$ $K_s = 20\\ \\mathrm{mg/L}$ $k_d = 0.05\\ \\mathrm{d^{-1}}$ และ $\\theta_c = 10\\ \\mathrm{d}$ ที่สภาวะคงที่ สารอาหารที่เหลือ $S$ ในน้ำทิ้งเท่ากับกี่ $\\mathrm{mg/L}$ (ใช้ $1/\\theta_c = Y\\mu_{max}S/(K_s+S) - k_d$ ทศนิยม 2 ตำแหน่ง) (ค่าสมมติ)"
    answer: { value: 3.53, tolerance: 0.02, unit: mg/L }
    hints:
      - "แทนค่าลงในสมการสภาวะคงที่แล้วจัดรูปให้ $S$ อยู่ข้างเดียว"
      - "$1/\\theta_c + k_d$ เท่ากับ $Y\\mu_{max}S/(K_s+S)$"
    misconceptions:
      - { match: 2.22, feedback: "ค่านี้ลืมพจน์ $k_d$ ในสมการสภาวะคงที่" }
    solution: "$0.1 + 0.05 = 0.5 \\times 2 \\times S/(20+S)$ จึงได้ $0.15(20+S) = S$ และ $S = 3/0.85 \\approx 3.53\\ \\mathrm{mg/L}$"
