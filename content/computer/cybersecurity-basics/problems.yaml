  - id: computer.security.cybersecurity-basics.p016
    topics: [computer.security.cybersecurity-basics]
    difficulty: 4
    type: mcq
    stem: |
      นักเรียนเขียนโปรแกรมเครื่องคิดเลขให้เพื่อนใช้บนเครื่องแม่ข่ายของชมรม ดังนี้

      ```python
      expr = input("พิมพ์โจทย์ เช่น 3 + 4: ")
      print(eval(expr))
      ```

      ข้อใดอธิบาย **ปัญหาด้านความปลอดภัย** และวิธีแก้ได้ถูกต้องที่สุด
    choices:
      - { id: a, text: "eval ทำงานข้อความที่ผู้ใช้พิมพ์เหมือนเป็นโค้ด Python ผู้ใช้จึงสั่งคำสั่งอื่นบนเครื่องแม่ข่ายได้ ควรตรวจข้อมูลเข้าให้รับเฉพาะตัวเลขกับเครื่องหมาย + − × ÷ แล้วคำนวณเอง", correct: true }
      - { id: b, text: "ไม่มีปัญหา เพราะ input รับได้แค่ข้อความ", feedback: "input รับข้อความ แต่ eval นำข้อความนั้นไปทำงานเป็นโค้ด ข้อความจึงกลายเป็นคำสั่งได้" }
      - { id: c, text: "ปัญหาคือโปรแกรมช้า ควรเปลี่ยนเป็น print(expr)", feedback: "print(expr) แค่แสดงข้อความกลับ ไม่คำนวณ และปัญหาหลักไม่ใช่ความเร็ว แต่คือการทำข้อมูลเข้าเป็นโค้ด" }
      - { id: d, text: "ปัญหาคือผู้ใช้อาจพิมพ์ผิด ควรเพิ่มคำแนะนำในข้อความ input", feedback: "คำแนะนำช่วยผู้ใช้ที่หวังดี แต่ไม่ได้กันผู้ใช้ที่จงใจพิมพ์สิ่งอื่น ต้องตรวจข้อมูลเข้าในโปรแกรม" }
    hints:
      - "eval ทำอะไรกับข้อความที่ได้รับ"
      - "หลักสำคัญของผู้เขียนโปรแกรม: อย่าไว้ใจข้อมูลเข้า ตรวจก่อนใช้เสมอ"
    solution: "eval แปลข้อความเป็นโค้ดแล้วทำงานทันที ผู้ใช้จึงพิมพ์โค้ดใด ๆ ให้เครื่องแม่ข่ายทำได้ นี่คือช่องโหว่จากการไว้ใจข้อมูลเข้า วิธีแก้คือรับเฉพาะรูปแบบที่อนุญาต (ตัวเลขและเครื่องหมาย) แล้วคำนวณด้วยโค้ดของเราเอง และให้โปรแกรมรันด้วยสิทธิ์น้อยที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

