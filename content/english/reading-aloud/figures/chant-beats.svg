<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 190" width="700" height="190" font-family="sans-serif">
<title>จังหวะของบทพูดเข้าจังหวะ One, two, buckle my shoe</title>
<rect x="0" y="0" width="700" height="190" fill="#fff"/>
<text x="20.0" y="30.0" font-size="15" text-anchor="start" fill="#444" font-weight="normal">ปรบมือที่วงใหญ่ (beat) ทุกบรรทัดมีจังหวะเท่ากัน</text>
<circle cx="87.5" cy="75.0" r="16.0" fill="#1f4e9c" stroke="#111" stroke-width="2"/>
<text x="87.5" y="81.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal"></text>
<text x="87.5" y="130.0" font-size="26" text-anchor="middle" fill="#111" font-weight="bold">ONE,</text>
<circle cx="182.5" cy="75.0" r="16.0" fill="#1f4e9c" stroke="#111" stroke-width="2"/>
<text x="182.5" y="81.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal"></text>
<text x="182.5" y="130.0" font-size="26" text-anchor="middle" fill="#111" font-weight="bold">TWO,</text>
<circle cx="277.5" cy="75.0" r="16.0" fill="#1f4e9c" stroke="#111" stroke-width="2"/>
<text x="277.5" y="81.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal"></text>
<text x="277.5" y="130.0" font-size="26" text-anchor="middle" fill="#111" font-weight="bold">BUCK</text>
<circle cx="355.0" cy="75.0" r="6.0" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="355.0" y="130.0" font-size="20" text-anchor="middle" fill="#111" font-weight="normal">le</text>
<circle cx="415.0" cy="75.0" r="6.0" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="415.0" y="130.0" font-size="20" text-anchor="middle" fill="#111" font-weight="normal">my</text>
<circle cx="492.5" cy="75.0" r="16.0" fill="#1f4e9c" stroke="#111" stroke-width="2"/>
<text x="492.5" y="81.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal"></text>
<text x="492.5" y="130.0" font-size="26" text-anchor="middle" fill="#111" font-weight="bold">SHOE.</text>
<text x="350.0" y="172.0" font-size="18" text-anchor="middle" fill="#555" font-weight="normal" font-style="italic">ONE, TWO, BUCK-le my SHOE.</text>
</svg>
