    stem: "ร้านค้าออนไลน์ของชมรมเก็บรหัสผ่านด้วย MD5 โดยไม่มีซอลต์ ควรปรับปรุงอย่างไรก่อนข้อใดเป็นอันดับแรก"
    choices:
