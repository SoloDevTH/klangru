<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300"><title>สามด้านของ CIA ได้แก่ การรักษาความลับ ความถูกต้องครบถ้วน และความพร้อมใช้งาน พร้อมตัวอย่าง</title><rect width="720" height="300" fill="#ffffff"/><rect x="10" y="60" width="220" height="160" rx="10" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/><text x="120" y="98" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">ความลับ</text><text x="120" y="118" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal">(Confidentiality)</text><text x="120" y="150" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle" font-weight="normal">เฉพาะคนที่มีสิทธิ์</text><text x="120" y="170" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle" font-weight="normal">อ่านผลสอบได้</text><rect x="250" y="60" width="220" height="160" rx="10" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/><text x="360" y="98" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">ความถูกต้องครบถ้วน</text><text x="360" y="118" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal">(Integrity)</text><text x="360" y="150" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle" font-weight="normal">คะแนนไม่ถูกแก้</text><text x="360" y="170" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle" font-weight="normal">ระหว่างทาง</text><rect x="490" y="60" width="220" height="160" rx="10" fill="#fef3c7" stroke="#1f2937" stroke-width="1.5"/><text x="600" y="98" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">ความพร้อมใช้งาน</text><text x="600" y="118" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal">(Availability)</text><text x="600" y="150" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle" font-weight="normal">ระบบลงทะเบียนเปิด</text><text x="600" y="170" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle" font-weight="normal">ให้ใช้ตอนเปิดเทอม</text><text x="360" y="252" font-family="sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="normal">การป้องกันที่ดีต้องครอบคลุมทั้งสามด้าน ไม่ใช่เพียงด้านใดด้านหนึ่ง</text><text x="360" y="40" font-family="sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">CIA triad: สามเป้าหมายของความมั่นคงปลอดภัยข้อมูล</text></svg>
