<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" font-family="sans-serif" font-size="16">
  <title>แถวลำดับ 3 แถว แถวละ 5</title>
  <rect x="0" y="0" width="720" height="230" fill="#ffffff"/>
  <circle cx="80.0" cy="60.0" r="15.0" fill="#fde7c8" stroke="#c2410c" stroke-width="2"/>
  <circle cx="130.0" cy="60.0" r="15.0" fill="#fde7c8" stroke="#c2410c" stroke-width="2"/>
  <circle cx="180.0" cy="60.0" r="15.0" fill="#fde7c8" stroke="#c2410c" stroke-width="2"/>
  <circle cx="230.0" cy="60.0" r="15.0" fill="#fde7c8" stroke="#c2410c" stroke-width="2"/>
  <circle cx="280.0" cy="60.0" r="15.0" fill="#fde7c8" stroke="#c2410c" stroke-width="2"/>
  <circle cx="80.0" cy="110.0" r="15.0" fill="#fde7c8" stroke="#c2410c" stroke-width="2"/>
  <circle cx="130.0" cy="110.0" r="15.0" fill="#fde7c8" stroke="#c2410c" stroke-width="2"/>
  <circle cx="180.0" cy="110.0" r="15.0" fill="#fde7c8" stroke="#c2410c" stroke-width="2"/>
  <circle cx="230.0" cy="110.0" r="15.0" fill="#fde7c8" stroke="#c2410c" stroke-width="2"/>
  <circle cx="280.0" cy="110.0" r="15.0" fill="#fde7c8" stroke="#c2410c" stroke-width="2"/>
  <circle cx="80.0" cy="160.0" r="15.0" fill="#fde7c8" stroke="#c2410c" stroke-width="2"/>
  <circle cx="130.0" cy="160.0" r="15.0" fill="#fde7c8" stroke="#c2410c" stroke-width="2"/>
  <circle cx="180.0" cy="160.0" r="15.0" fill="#fde7c8" stroke="#c2410c" stroke-width="2"/>
  <circle cx="230.0" cy="160.0" r="15.0" fill="#fde7c8" stroke="#c2410c" stroke-width="2"/>
  <circle cx="280.0" cy="160.0" r="15.0" fill="#fde7c8" stroke="#c2410c" stroke-width="2"/>
  <text x="180.0" y="200.0" font-size="16" text-anchor="middle" fill="#15211e">3 แถว แถวละ 5</text>
  <text x="380.0" y="80.0" font-size="18" text-anchor="start" fill="#15211e">5 + 5 + 5 = 15</text>
  <text x="380.0" y="115.0" font-size="18" text-anchor="start" fill="#0a6b60" font-weight="bold">3 × 5 = 15</text>
  <text x="380.0" y="150.0" font-size="16" text-anchor="start" fill="#15211e">15 ÷ 3 = 5   (แบ่ง 3 แถว ได้แถวละ 5)</text>
  <text x="380.0" y="182.0" font-size="16" text-anchor="start" fill="#15211e">15 ÷ 5 = 3   (จัดกลุ่มละ 5 ได้ 3 กลุ่ม)</text>
</svg>
