  difficulty: 5
  type: numeric
  stem: ร้านกาแฟอบครัวซองต์เองเดือนละ $3{,}000$ ชิ้น ต้นทุนผันแปรชิ้นละ $18$ บาท ต้นทุนคงที่ของครัวที่ปันส่วนมาเดือนละ $40{,}000$ บาท ในจำนวนนี้ $15{,}000$ บาทเป็นค่าจ้างคนอบขนมที่จะไม่ต้องจ่ายถ้าเลิกอบ (ค่าเช่าและเตาอบยังต้องจ่าย) ถ้าซื้อจากร้านเบเกอรี่ชิ้นละ $25$ บาท การ **อบเอง** ถูกกว่าการซื้อเดือนละกี่บาท (ถ้าซื้อถูกกว่าให้ตอบติดลบ หน่วยบาท)
  answer:
