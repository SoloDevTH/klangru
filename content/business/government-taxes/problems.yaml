problems:
- id: business.econ.government-taxes.p001
  topics:
  - business.econ.government-taxes
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็น **บริการที่รัฐจัดให้ประชาชน** โดยใช้เงินภาษี
  choices:
  - id: a
    text: ไฟจราจรและถนนในเมือง
    correct: true
  - id: b
    text: ร้านก๋วยเตี๋ยวหน้าโรงเรียน
    feedback: ร้านก๋วยเตี๋ยวเป็นธุรกิจของเอกชน ขายเพื่อหากำไร
  - id: c
    text: โทรศัพท์มือถือที่ซื้อจากร้าน
    feedback: โทรศัพท์เป็นสินค้าที่เอกชนผลิตและขาย
  - id: d
    text: ร้านตัดผมในหมู่บ้าน
    feedback: ร้านตัดผมเป็นบริการของเอกชน
  hints:
  - คิดว่าใครเป็นผู้จัดหาและจ่ายเงินสร้าง
  - สิ่งที่ทุกคนใช้ร่วมกันและไม่ต้องจ่ายเงินทุกครั้งที่ใช้ มักเป็นของรัฐ
  solution: ไฟจราจรและถนนในเมืองเป็นบริการสาธารณะที่รัฐสร้างและดูแลด้วยเงินภาษี ทุกคนใช้ร่วมกัน ส่วนตัวเลือกอื่นเป็นสินค้าและบริการของเอกชน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.government-taxes.p002
  topics:
  - business.econ.government-taxes
  difficulty: 1
  type: match
  stem: จับคู่ภาษีกับตัวอย่างที่เสียภาษีนั้น
  pairs:
  - left: ภาษีเงินได้บุคคลธรรมดา
    right: พนักงานบริษัทเสียจากเงินเดือน
  - left: ภาษีมูลค่าเพิ่ม
    right: บวกอยู่ในราคาสินค้าที่ซื้อจากร้านที่จดทะเบียน
  - left: ภาษีสรรพสามิต
    right: เก็บจากสินค้าบางชนิด เช่น น้ำมัน สุรา ยาสูบ
  - left: อากรขาเข้า
    right: เก็บเมื่อนำสินค้าจากต่างประเทศเข้ามา
  - left: ภาษีที่ดินและสิ่งปลูกสร้าง
    right: เจ้าของที่ดินและบ้านจ่ายให้ท้องถิ่น
  hints:
  - 'ดูว่าภาษีแต่ละชนิดเก็บจากอะไร: รายได้ การซื้อของ สินค้าพิเศษ การนำเข้า หรือทรัพย์สิน'
  - ภาษีที่ดินเป็นรายได้ของ อบต. เทศบาล หรือ กทม.
  solution: เงินได้บุคคลธรรมดา → เงินเดือน · มูลค่าเพิ่ม → บวกในราคาสินค้า · สรรพสามิต → น้ำมัน สุรา ยาสูบ · อากรขาเข้า → สินค้านำเข้า · ที่ดินและสิ่งปลูกสร้าง → เจ้าของทรัพย์สินจ่ายให้ท้องถิ่น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.government-taxes.p003
  topics:
  - business.econ.government-taxes
  difficulty: 2
  type: mcq
  stem: ถ้าไม่มีใครเสียภาษีเลย ข้อใด **น่าจะเกิดขึ้นมากที่สุด**
  choices:
  - id: a
    text: รัฐไม่มีเงินสร้างถนน จ้างครู หรือดูแลโรงพยาบาลรัฐ
    correct: true
  - id: b
    text: ทุกคนรวยขึ้นและบริการสาธารณะดีขึ้น
    feedback: บริการสาธารณะใช้เงินจากภาษี ไม่มีภาษีก็ไม่มีเงินจ่าย
  - id: c
    text: ราคาสินค้าทุกอย่างลดลงเหลือศูนย์
    feedback: ภาษีเป็นเพียงส่วนหนึ่งของราคา ไม่ใช่ทั้งหมด
  - id: d
    text: ไม่มีผลอะไรเพราะรัฐพิมพ์เงินเองได้ไม่จำกัด
    feedback: พิมพ์เงินมากเกินไปทำให้ของแพงขึ้น ไม่ใช่ทางแก้
  hints:
  - รัฐเอาเงินจากไหนมาจ่ายเงินเดือนครูและสร้างถนน
  - ภาษีเป็นรายได้หลักของรัฐ
  solution: ภาษีเป็นรายได้หลักของรัฐ ถ้าไม่มีภาษี รัฐจะไม่มีเงินจัดการศึกษา สาธารณสุข ถนน ความปลอดภัย ประชาชนทุกคนจึงมีหน้าที่เสียภาษีให้ถูกต้องเพื่อประโยชน์ร่วมกัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.government-taxes.p004
  topics:
  - business.econ.government-taxes
  difficulty: 2
  type: match
  stem: จับคู่ระบบเศรษฐกิจกับลักษณะเด่น
  pairs:
  - left: ระบบทุนนิยม
    right: เอกชนเป็นเจ้าของปัจจัยการผลิต ใช้กลไกราคาตัดสินใจ
  - left: ระบบสังคมนิยมแบบวางแผนจากส่วนกลาง
    right: รัฐเป็นเจ้าของปัจจัยการผลิตหลักและวางแผนว่าจะผลิตอะไร
  - left: ระบบเศรษฐกิจแบบผสม
    right: เอกชนผลิตเป็นส่วนใหญ่ รัฐดูแลสาธารณูปโภคและกำกับตลาด
  hints:
  - ถามว่าใครเป็นเจ้าของปัจจัยการผลิต และใครตัดสินใจว่าจะผลิตอะไร
  - ระบบผสมมีทั้งสองแบบรวมกัน
  solution: 'ทุนนิยม: เอกชนเป็นเจ้าของ ตลาดตัดสิน · สังคมนิยมแบบวางแผน: รัฐเป็นเจ้าของและวางแผน · ผสม: เอกชนผลิตเป็นหลัก รัฐเข้ามาจัดบริการสาธารณะและกำกับ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.government-taxes.p005
  topics:
  - business.econ.government-taxes
  difficulty: 2
  type: numeric
  stem: ร้านค้าที่จดทะเบียนภาษีมูลค่าเพิ่มขายพัดลมราคา $800$ บาท **ยังไม่รวม** ภาษีมูลค่าเพิ่ม $7\%$ ลูกค้าต้องจ่ายทั้งหมดกี่บาท (ตอบเป็นบาท)
  answer:
    value: 856
    unit: บาท
  misconceptions:
  - match: 56
    feedback: นั่นคือเฉพาะภาษี โจทย์ถามเงินทั้งหมดที่จ่าย
  - match: 744
    feedback: ภาษีมูลค่าเพิ่มบวกเพิ่ม ไม่ใช่หักออก
  hints:
  - ภาษีมูลค่าเพิ่ม $= 800 \times 7\%$
  - ราคาที่ลูกค้าจ่าย $=$ ราคาก่อนภาษี $+$ ภาษี
  solution: ภาษี $= 800 \times 0.07 = 56$ บาท ลูกค้าจ่าย $800 + 56 = 856$ บาท (หรือ $800 \times 1.07$)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.government-taxes.p006
  topics:
  - business.econ.government-taxes
  difficulty: 3
  type: numeric
  stem: ใบเสร็จร้านสะดวกซื้อแห่งหนึ่งเขียนว่า ราคาสินค้า **รวม** ภาษีมูลค่าเพิ่ม $7\%$ แล้ว $535$ บาท ในราคานี้มีภาษีมูลค่าเพิ่มกี่บาท (ตอบเป็นบาท)
  answer:
    value: 35
    unit: บาท
  misconceptions:
  - match: 37.45
    feedback: คิด 7% ของราคาที่รวมภาษีแล้ว ต้องคิด 7% ของราคาก่อนภาษี
  - match: 500
    feedback: นั่นคือราคาก่อนภาษี โจทย์ถามตัวภาษี
  hints:
  - ราคารวมภาษี $=$ ราคาก่อนภาษี $\times 1.07$
  - ภาษี $=$ ราคารวม $\times \dfrac{7}{107}$
  solution: ราคาก่อนภาษี $= 535 \div 1.07 = 500$ บาท ภาษี $= 535 - 500 = 35$ บาท หรือ $535 \times \dfrac{7}{107} = 35$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.government-taxes.p007
  topics:
  - business.econ.government-taxes
  difficulty: 3
  type: mcq
  stem: ไฟถนนในซอยของหมู่บ้านเป็น **สินค้าสาธารณะ** เพราะเหตุใด
  choices:
  - id: a
    text: กันไม่ให้ใครใช้แสงไฟได้ยาก และคนหนึ่งใช้แล้วคนอื่นยังใช้ได้เท่าเดิม
    correct: true
  - id: b
    text: เพราะราคาถูก ใคร ๆ ก็ซื้อได้
    feedback: ราคาไม่ได้เป็นเกณฑ์ ของถูกหลายอย่างเป็นสินค้าเอกชน
  - id: c
    text: เพราะรัฐเป็นผู้ผลิตหลอดไฟ
    feedback: หลอดไฟผลิตโดยเอกชนได้ เกณฑ์อยู่ที่ลักษณะการใช้
  - id: d
    text: เพราะใช้ได้คนเดียว คนอื่นต้องรอ
    feedback: ถ้าคนหนึ่งใช้แล้วคนอื่นใช้ไม่ได้ แปลว่าแย่งกันใช้ ซึ่งตรงข้ามกับสินค้าสาธารณะ
  hints:
  - สินค้าสาธารณะมีลักษณะสองข้อ
  - คิดว่ากันคนที่ไม่จ่ายเงินออกไปได้ไหม และการใช้ของคนหนึ่งลดส่วนของคนอื่นไหม
  solution: สินค้าสาธารณะ (1) กีดกันผู้ไม่จ่ายเงินได้ยาก และ (2) ไม่แย่งกันใช้ คนหนึ่งใช้แล้วคนอื่นยังใช้ได้ ไฟถนนมีทั้งสองลักษณะ เอกชนจึงเก็บเงินได้ยาก รัฐต้องจัดหาด้วยเงินภาษี
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.government-taxes.p008
  topics:
  - business.econ.government-taxes
  difficulty: 3
  type: numeric
  stem: 'ประเทศสมมติเก็บภาษีเงินได้แบบขั้นบันได: $100{,}000$ บาทแรกยกเว้น ส่วนที่เกิน $100{,}000$ ถึง $300{,}000$ บาท เสีย $10\%$ ส่วนที่เกิน $300{,}000$ บาท เสีย $20\%$ ถ้าเงินได้สุทธิ $400{,}000$ บาท ต้องเสียภาษีกี่บาท (ตอบเป็นบาท)'
  answer:
    value: 40000.0
    unit: บาท
  misconceptions:
  - match: 80000
    feedback: คิด 20% กับเงินได้ทั้งหมด อัตราสูงใช้เฉพาะส่วนที่เกินขั้นเท่านั้น
  - match: 60000
    feedback: ลืมยกเว้น 100,000 บาทแรก
  hints:
  - แบ่งเงินได้เป็นช่วงตามขั้น แล้วคิดภาษีแต่ละช่วงแยกกัน
  - ช่วง $100{,}001$–$300{,}000$ มี $200{,}000$ บาท ช่วงเกิน $300{,}000$ มี $100{,}000$ บาท
  solution: ช่วงแรก $100{,}000 \times 0 = 0$ · ช่วงที่สอง $200{,}000 \times 10\% = 20{,}000$ · ช่วงที่สาม $100{,}000 \times 20\% = 20{,}000$ รวม $40{,}000$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.government-taxes.p009
  topics:
  - business.econ.government-taxes
  difficulty: 3
  type: numeric
  stem: จากข้อที่แล้ว (เงินได้สุทธิ $400{,}000$ บาท เสียภาษี $40{,}000$ บาท) **อัตราภาษีเฉลี่ย** คือกี่เปอร์เซ็นต์ (ตอบเป็น %)
  answer:
    value: 10
    unit: '%'
  misconceptions:
  - match: 20
    feedback: 20% คืออัตราขั้นสุดท้าย (อัตราส่วนเพิ่ม) ไม่ใช่อัตราเฉลี่ย
  hints:
  - อัตราภาษีเฉลี่ย $=$ ภาษีทั้งหมด $\div$ เงินได้ $\times 100$
  - อย่าสับสนกับอัตราภาษีขั้นสุดท้าย
  solution: อัตราเฉลี่ย $= \dfrac{40{,}000}{400{,}000} \times 100 = 10\%$ ต่ำกว่าอัตราขั้นสุดท้าย ($20\%$) เพราะเงินส่วนแรก ๆ เสียภาษีน้อยกว่า
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.government-taxes.p010
  topics:
  - business.econ.government-taxes
  difficulty: 3
  type: mcq
  stem: ข้อใดเป็น **ภาษีทางอ้อม** (ผู้เสียภาษีผลักภาระไปให้ผู้อื่นได้) เลือกทุกข้อที่ถูก
  multiple: true
  choices:
  - id: a
    text: ภาษีมูลค่าเพิ่ม
    correct: true
  - id: b
    text: ภาษีสรรพสามิต
    correct: true
  - id: c
    text: อากรขาเข้า
    correct: true
  - id: d
    text: ภาษีเงินได้บุคคลธรรมดา
    feedback: ผู้มีเงินได้เสียเองโดยตรง ผลักภาระไม่ได้ จึงเป็นภาษีทางตรง
  - id: e
    text: ภาษีเงินได้นิติบุคคล
    feedback: บริษัทเสียจากกำไรของตนเอง จัดเป็นภาษีทางตรง
  hints:
  - ภาษีทางอ้อมมักเก็บจากการซื้อขายสินค้า
  - ผู้ขายส่งภาษีให้รัฐ แต่บวกไว้ในราคาให้ผู้ซื้อจ่าย
  solution: ภาษีทางอ้อมเก็บจากการบริโภคหรือการค้า ผู้ขายหรือผู้นำเข้าผลักภาระไปไว้ในราคาได้ ได้แก่ ภาษีมูลค่าเพิ่ม สรรพสามิต อากรขาเข้า ส่วนภาษีเงินได้ทั้งของบุคคลและนิติบุคคลเป็นภาษีทางตรง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.government-taxes.p011
  topics:
  - business.econ.government-taxes
  difficulty: 4
  type: numeric
  stem: ครอบครัว ก รายได้เดือนละ $10{,}000$ บาท ซื้อของใช้ $8{,}000$ บาท (ราคาก่อนภาษี) ครอบครัว ข รายได้เดือนละ $50{,}000$ บาท ซื้อของใช้ $20{,}000$ บาท (ก่อนภาษี) ทุกอย่างเสียภาษีมูลค่าเพิ่ม $7\%$ ภาษีที่ **ครอบครัว ก** จ่ายคิดเป็นร้อยละเท่าใดของรายได้ (ตอบเป็น %)
  answer:
    value: 5.6
    tolerance: 0.05
    unit: '%'
  misconceptions:
  - match: 7
    feedback: 7% คืออัตราภาษีต่อราคาสินค้า โจทย์ถามเทียบกับรายได้
  - match: 2.8
    feedback: นั่นคือของครอบครัว ข
  hints:
  - 'หาภาษีที่ครอบครัว ก จ่ายก่อน: $8{,}000 \times 7\%$'
  - เทียบกับรายได้ ไม่ใช่รายจ่าย
  solution: ครอบครัว ก จ่ายภาษี $8{,}000 \times 0.07 = 560$ บาท คิดเป็น $\dfrac{560}{10{,}000} \times 100 = 5.6\%$ ของรายได้ ส่วนครอบครัว ข จ่าย $1{,}400$ บาท เท่ากับ $2.8\%$ ของรายได้ ภาษีการบริโภคอัตราเดียวจึงเป็นภาระต่อรายได้ของคนรายได้น้อยมากกว่า (ลักษณะถดถอยเมื่อเทียบกับรายได้)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.government-taxes.p012
  topics:
  - business.econ.government-taxes
  difficulty: 4
  type: mcq
  stem: ภาพแสดงอัตราภาษีเฉลี่ยต่อรายได้ของคนสามกลุ่มภายใต้ภาษีแบบ A, B, C (ข้อมูลสมมติ) ภาษีแบบใด **ถดถอย**
  choices:
  - id: a
    text: แบบ A
    feedback: แบบ A อัตราเพิ่มขึ้นตามรายได้ คือภาษีก้าวหน้า
  - id: b
    text: แบบ B
    feedback: แบบ B อัตราเท่ากันทุกกลุ่ม คือภาษีตามสัดส่วน
  - id: c
    text: แบบ C
    correct: true
  figure:
    src: p-tax-patterns.svg
    alt: แผนภูมิแท่งสามกลุ่ม ชื่อ แบบ A แบบ B แบบ C แต่ละแบบมีแท่งสามแท่งสำหรับรายได้น้อย ปานกลาง สูง แบบ A แท่งสูงขึ้นจาก 2% เป็น 8% และ 15% แบบ B สูงเท่ากัน 10% ทั้งสามแท่ง แบบ C แท่งลดลงจาก 9% เป็น 5% และ 2%
  hints:
  - ภาษีถดถอยคือคนรายได้น้อยเสียเป็นสัดส่วนของรายได้มากกว่า
  - ดูว่าแท่งของกลุ่มรายได้น้อยสูงที่สุดในแบบใด
  solution: แบบ C อัตราภาษีเฉลี่ยลดลงเมื่อรายได้สูงขึ้น (กลุ่มรายได้น้อยเสียสัดส่วนมากที่สุด) จึงเป็นภาษีถดถอย แบบ A เป็นก้าวหน้า แบบ B เป็นตามสัดส่วน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.government-taxes.p013
  topics:
  - business.econ.government-taxes
  difficulty: 4
  type: order
  stem: เรียงขั้นตอนการใช้เงินภาษีของรัฐจากแรกไปหลัง
  items:
  - รัฐบาลจัดทำร่างงบประมาณรายจ่ายประจำปี
  - รัฐสภาพิจารณาและอนุมัติเป็นกฎหมายงบประมาณ
  - หน่วยงานรัฐเบิกจ่ายเงินไปจัดบริการ เช่น โรงเรียน ถนน
  - หน่วยงานตรวจสอบตรวจการใช้เงินและรายงานต่อสาธารณะ
  hints:
  - เงินภาษีจะใช้ได้ต้องผ่านการอนุมัติก่อน
  - การตรวจสอบเกิดหลังการใช้จ่าย
  solution: ร่างงบประมาณ → รัฐสภาอนุมัติ → หน่วยงานใช้จ่ายตามงบ → ตรวจสอบและรายงาน ขั้นตอนนี้ทำให้ประชาชนติดตามได้ว่าเงินภาษีถูกใช้อย่างไร
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.government-taxes.p014
  topics:
  - business.econ.government-taxes
  difficulty: 4
  type: mcq
  stem: ประเทศสมมติขึ้นภาษีสรรพสามิตเครื่องดื่มที่มีน้ำตาลสูง ข้อใดเป็น **ผลที่น่าจะเกิด** เลือกทุกข้อที่ถูก
  multiple: true
  choices:
  - id: a
    text: ราคาเครื่องดื่มหวานสูงขึ้น คนบางส่วนซื้อน้อยลง
    correct: true
  - id: b
    text: ผู้ผลิตบางรายปรับสูตรลดน้ำตาลเพื่อเสียภาษีน้อยลง
    correct: true
  - id: c
    text: รัฐมีรายได้ภาษีจากสินค้านี้ แม้ยอดขายลดลงบ้าง
    correct: true
  - id: d
    text: ทุกคนเลิกดื่มน้ำหวานทันที
    feedback: ภาษีทำให้ซื้อน้อยลง แต่ไม่ได้ทำให้ทุกคนเลิกซื้อ
  - id: e
    text: ร้านค้าไม่ได้รับผลกระทบเลย
    feedback: ยอดขายสินค้าที่แพงขึ้นอาจลดลง ร้านค้าจึงได้รับผลกระทบ
  hints:
  - ภาษีทำให้ต้นทุนและราคาสูงขึ้น
  - คิดถึงผู้บริโภค ผู้ผลิต และรัฐ แยกกัน
  solution: ภาษีสรรพสามิตทำให้ราคาสูงขึ้น ผู้บริโภคบางส่วนซื้อลดลง ผู้ผลิตมีแรงจูงใจปรับสูตร และรัฐได้รายได้ นี่คือตัวอย่างที่ภาษีเปลี่ยนการตัดสินใจของบุคคลและธุรกิจ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.government-taxes.p015
  topics:
  - business.econ.government-taxes
  difficulty: 4
  type: numeric
  stem: ซอยหนึ่งมี $400$ ครัวเรือน ต้องการติดไฟถนน ค่าไฟและค่าดูแลปีละ $120{,}000$ บาท (สมมติ) ถ้าให้ครัวเรือนสมัครใจจ่าย แต่มีเพียง $150$ ครัวเรือนยอมจ่าย ครัวเรือนที่จ่ายต้องจ่ายคนละกี่บาทต่อปี (ตอบเป็นบาท)
  answer:
    value: 800
    unit: บาท
  misconceptions:
  - match: 300
    feedback: หารด้วยทุกครัวเรือน แต่จ่ายจริงเพียง 150 ครัวเรือน
  hints:
  - หารค่าใช้จ่ายด้วยจำนวนครัวเรือนที่ยอมจ่ายจริง
  - ครัวเรือนที่ไม่จ่ายก็ยังได้แสงไฟเหมือนกัน
  solution: คนละ $120{,}000 \div 150 = 800$ บาท ถ้าทุกครัวเรือนจ่ายจะเหลือคนละ $300$ บาท ครัวเรือนที่ไม่จ่ายแต่ได้ใช้เรียกว่า **ผู้ตีตั๋วฟรี** ทำให้สินค้าสาธารณะเก็บเงินแบบสมัครใจได้ยาก รัฐหรือท้องถิ่นจึงใช้ภาษีจัดหาแทน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.government-taxes.p016
  topics:
  - business.econ.government-taxes
  difficulty: 5
  type: numeric
  stem: ใช้ภาษีขั้นบันไดของประเทศสมมติในข้อ 8 ($100{,}000$ บาทแรกยกเว้น ส่วนเกินถึง $300{,}000$ เสีย $10\%$ ส่วนเกิน $300{,}000$ เสีย $20\%$) แก้วมีเงินได้สุทธิ $300{,}000$ บาท ได้ขึ้นเงินเดือนจนเงินได้สุทธิเป็น $330{,}000$ บาท เงิน **หลังหักภาษี** ของแก้วเพิ่มขึ้นกี่บาท (ตอบเป็นบาท)
  answer:
    value: 24000.0
    unit: บาท
  misconceptions:
  - match: -16000.0
    feedback: คิด 20% กับเงินได้ทั้งหมดหลังขึ้นเงินเดือน ทำให้ดูเหมือนเงินลดลง อัตราสูงใช้เฉพาะส่วนที่เกินขั้น
  - match: 30000
    feedback: ลืมคิดภาษีของเงินที่เพิ่มขึ้น
  hints:
  - ภาษีขั้น $20\%$ คิดเฉพาะส่วนที่เกิน $300{,}000$ บาท
  - ภาษีเพิ่ม $=$ ภาษีที่ $330{,}000$ $-$ ภาษีที่ $300{,}000$
  solution: ภาษีที่ $300{,}000$ บาท $= 200{,}000 \times 10\% = 20{,}000$ บาท · ภาษีที่ $330{,}000$ บาท $= 20{,}000 + 30{,}000 \times 20\% = 26{,}000$ บาท ภาษีเพิ่ม $6{,}000$ บาท เงินหลังภาษีเพิ่ม $30{,}000 - 6{,}000 = 24{,}000$ บาท การขึ้นขั้นภาษีไม่ทำให้เงินหลังภาษีลดลง เพราะอัตราสูงใช้เฉพาะส่วนที่เกิน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.government-taxes.p017
  topics:
  - business.econ.government-taxes
  difficulty: 5
  type: mcq
  stem: ประเทศสมมติเสนอนโยบาย "ลดภาษีน้ำมันลง 2 บาทต่อลิตรเป็นเวลา 6 เดือน" ข้อใดเป็น **การแสดงความคิดเห็นต่อนโยบายที่มีเหตุผลรอบด้านที่สุด**
  choices:
  - id: a
    text: ช่วยลดต้นทุนการเดินทางและขนส่งในระยะสั้น แต่รัฐเก็บภาษีได้น้อยลง ต้องดูว่าจะชดเชยรายได้อย่างไร และใครได้ประโยชน์มากน้อยต่างกัน
    correct: true
  - id: b
    text: ดีมาก เพราะน้ำมันถูกลง
    feedback: บอกผลดีด้านเดียว ไม่พิจารณาต้นทุนของรัฐและผลระยะยาว
  - id: c
    text: ไม่ดี เพราะรัฐบาลทำ
    feedback: เป็นความรู้สึกต่อผู้ทำ ไม่ได้วิเคราะห์ผลของนโยบาย
  - id: d
    text: ไม่มีผลกับใครเลย เพราะลดแค่ 2 บาท
    feedback: ราคาน้ำมันมีผลต่อค่าขนส่งและราคาสินค้า จึงมีผลต่อหลายกลุ่ม
  hints:
  - การวิเคราะห์นโยบายควรดูทั้งผลดีและต้นทุน
  - ถามว่าใครได้ ใครเสีย ระยะสั้นและระยะยาว
  solution: ความคิดเห็นที่ดีต่อนโยบายเศรษฐกิจของรัฐควรพิจารณาผลต่อบุคคล กลุ่มคน และประเทศ ทั้งผลดี ต้นทุน (รายได้ภาษีที่หายไป) และการกระจายประโยชน์ โดยใช้เหตุผลและข้อมูล ไม่ใช่ตัดสินจากความชอบหรือไม่ชอบผู้เสนอ
