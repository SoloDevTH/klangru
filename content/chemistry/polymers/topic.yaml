id: chemistry.organic.polymers
subject: chemistry
title: { th: พอลิเมอร์, en: Polymers }
summary: ปฏิกิริยาการเกิดพอลิเมอร์แบบเติมและแบบควบแน่น ความสัมพันธ์ระหว่างโครงสร้างกับสมบัติ การระบุชนิดพลาสติกและยาง การปรับโครงสร้าง และผลกระทบจากการใช้และกำจัดพอลิเมอร์
difficulty: 6.6
minutes: 45
prerequisites: [chemistry.organic.reactions]
encompasses:
  - { id: chemistry.organic.reactions, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: polymerization-types.svg
    alt: "แผนภาพ 2 แถว แถวบน แบบเติม: มอนอเมอร์เอทีนแสดงเป็นวงกลมสองวงต่อด้วยเส้นคู่หลายคู่ ลูกศรชี้ไปที่สายวงกลมยาวต่อด้วยเส้นเดี่ยว เขียนว่า n CH₂=CH₂ (เอทีน) ได้ –[CH₂–CH₂]ₙ– พอลิเอทิลีน ไม่มีโมเลกุลเล็กหลุดออก แถวล่าง แบบควบแน่น: มอนอเมอร์ A มีหมู่ COOH สองปลาย (กรดไดคาร์บอกซิลิก) + มอนอเมอร์ B มีหมู่ OH สองปลาย (ไดออล) ลูกศรชี้ไปที่สาย A–B–A–B ต่อกันด้วยพันธะ –COO– และมีลูกศรสีแดงชี้ลงจากแต่ละรอยต่อไปที่ H₂O ได้พอลิเอสเทอร์ เช่น PET ถ้าใช้ไดเอมีนแทนไดออลได้พอลิเอไมด์ (ไนลอน พันธะ –CONH–)"
    caption: "แบบเติมไม่มีสารหลุดออก แบบควบแน่นมีโมเลกุลเล็กหลุดออกทุกครั้งที่เกิดพันธะใหม่"
  - { type: check, problem: chemistry.organic.polymers.p005, prompt: "มอนอเมอร์แต่ละตัวต้องมีหมู่ฟังก์ชันสองหมู่" }
  - type: worked-example
    title: หามอนอเมอร์และประเภทจากหน่วยซ้ำ
    problem: "ส่วนหนึ่งของสายพอลิเมอร์คือ $\\mathrm{-CH_2-CHCl-CH_2-CHCl-CH_2-CHCl-}$ จงหามอนอเมอร์และประเภทของปฏิกิริยา"
    steps:
      - text: "สายหลักมีแต่ C ต่อ C ไม่มีพันธะเอสเทอร์หรือเอไมด์ จึงเป็นการเกิดพอลิเมอร์แบบเติม"
      - text: "หาหน่วยที่ซ้ำ: $\\mathrm{-CH_2-CHCl-}$ มีคาร์บอนสายหลัก 2 อะตอม"
        why: "มอนอเมอร์แบบเติมมาจาก C=C หนึ่งพันธะ ซึ่งให้คาร์บอน 2 อะตอมในสายหลัก"
      - text: "ใส่พันธะคู่กลับระหว่างคาร์บอนสองตัว: $\\mathrm{CH_2{=}CHCl}$ คือไวนิลคลอไรด์ (คลอโรเอทีน)"
    answer: "มอนอเมอร์คือไวนิลคลอไรด์ CH₂=CHCl เกิดแบบเติม ได้ PVC"
  - type: figure
    src: ldpe-hdpe.svg
    alt: "แผนภาพสองกรอบ กรอบซ้าย HDPE: สายซิกแซก 9 สายวางขนานชิดกันอย่างเป็นระเบียบ ใต้กรอบเขียนว่า แรงระหว่างสายมาก หนาแน่นกว่า แข็งกว่า เช่น แกลลอนนม ขวดน้ำยา กรอบขวา LDPE: สายซิกแซก 5 สายสีต่างกันมีกิ่งแตกออกขึ้นลง วางห่างกันไม่เป็นระเบียบ ใต้กรอบเขียนว่า แรงระหว่างสายน้อย หนาแน่นน้อย นิ่มกว่า เช่น ถุงพลาสติก ฟิล์มห่ออาหาร"
    caption: "พอลิเอทิลีนชนิดเดียวกัน แต่สายตรงกับสายมีกิ่งให้สมบัติต่างกัน"
  - type: worked-example
    title: จำนวนหน่วยซ้ำของ PET
    problem: "PET มีหน่วยซ้ำ $\\mathrm{C_{10}H_8O_4}$ เกิดจากกรดเทเรฟทาลิก ($\\mathrm{C_8H_6O_4}$ 166.13) กับเอทิลีนไกลคอล ($\\mathrm{C_2H_6O_2}$ 62.07) ถ้าสาย PET มีมวลโมเลกุลราว 38,000 g/mol มีหน่วยซ้ำราวกี่หน่วย"
    steps:
      - text: "มวลหน่วยซ้ำ = มวลมอนอเมอร์สองตัว − น้ำ 2 โมเลกุล $= 166.13 + 62.07 - 2(18.02) = 192.16$"
        why: "แต่ละหน่วยซ้ำเกิดพันธะเอสเทอร์ 2 พันธะ จึงเสียน้ำ 2 โมเลกุลต่อหน่วย"
      - text: "ตรวจกับสูตร $\\mathrm{C_{10}H_8O_4}$: $10(12.01) + 8(1.008) + 4(16.00) = 192.16$ ตรงกัน"
      - text: "$n = 38000 / 192.16 \\approx 198$ หน่วย"
    answer: "ราว 198 หน่วยซ้ำ"
  - { type: check, problem: chemistry.organic.polymers.p009, prompt: "สายตรงเรียงชิดกันได้มากกว่า" }
glossary:
  - { term: มอนอเมอร์, definition: โมเลกุลเล็กที่ต่อกันเป็นพอลิเมอร์ }
  - { term: หน่วยซ้ำ, definition: ส่วนของโครงสร้างที่ซ้ำกันตลอดสายพอลิเมอร์ }
  - { term: การเกิดพอลิเมอร์แบบเติม, definition: มอนอเมอร์ที่มีพันธะคู่ต่อกันโดยพันธะคู่เปิดออก ไม่มีสารอื่นหลุดออก }
  - { term: การเกิดพอลิเมอร์แบบควบแน่น, definition: มอนอเมอร์ที่มีหมู่ฟังก์ชันสองหมู่ต่อกัน และมีโมเลกุลเล็ก เช่น น้ำ หลุดออก }
  - { term: พลาสติไซเซอร์, definition: สารที่แทรกระหว่างสายพอลิเมอร์ ลดแรงระหว่างสาย ทำให้พลาสติกนิ่ม }
  - { term: โคพอลิเมอร์, definition: พอลิเมอร์ที่เกิดจากมอนอเมอร์มากกว่าหนึ่งชนิด }
flashcards:
  - { front: "แบบเติม / แบบควบแน่น", back: "มอนอเมอร์มี C=C ไม่มีสารหลุดออก / มีสองหมู่ฟังก์ชัน มีน้ำหรือโมเลกุลเล็กหลุดออก" }
  - { front: "PET และไนลอนเกิดแบบใด", back: "ควบแน่น PET มีพันธะเอสเทอร์ ไนลอนมีพันธะเอไมด์" }
  - { front: "HDPE ต่างจาก LDPE อย่างไร", back: "HDPE สายตรง หนาแน่นและแข็งกว่า LDPE มีกิ่ง นิ่มกว่า" }
  - { front: "พลาสติกที่ลอยน้ำ", back: "PE และ PP (ความหนาแน่นน้อยกว่า 1 g/cm³)" }
  - { front: "จำนวนหน่วยซ้ำ n", back: "มวลโมเลกุลพอลิเมอร์ ÷ มวลหน่วยซ้ำ" }
