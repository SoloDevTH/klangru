    ai_assisted: true

  - id: phy.n1.p017
    topics: [physics.dynamics.newton-first]
    difficulty: 5
    type: numeric
    stem: "ป้ายหนัก $120\\ \\mathrm{N}$ แขวนนิ่งด้วยเชือกสองเส้น เส้นซ้ายทำมุม $30^\\circ$ และเส้นขวาทำมุม $60^\\circ$ กับเพดาน ดังภาพ เชือกเส้นขวามีแรงตึงเท่าใด (ตอบเป็นตัวเลขในหน่วย N ทศนิยม 1 ตำแหน่ง)"
    figure: { src: sign-two-ropes-problem.svg, alt: "ป้ายห้อยจากปมเชือก ปมต่อกับเพดานด้วยเชือกสองเส้น เส้นซ้าย T₁ ทำมุม 30° กับเพดาน เส้นขวา T₂ ทำมุม 60° กับเพดาน" }
    answer: { value: 103.92, tolerance: 1, unit: N }
    hints:
      - "แนวราบ: $T_1\\cos 30^\\circ = T_2\\cos 60^\\circ$"
      - "แนวดิ่ง: $T_1\\sin 30^\\circ + T_2\\sin 60^\\circ = 120$"
      - "เชือกสองเส้นตั้งฉากกัน จึงใช้สามเหลี่ยมแรงมุมฉากได้ด้วย"
    misconceptions:
      - { match: 60, feedback: "นั่นคือแรงตึงของเส้นซ้าย (เส้นที่เอียงมาก) เส้นที่ชันกว่ารับแรงมากกว่า" }
      - { match: 69.28, feedback: "ดูเหมือนสลับ sin กับ cos ($120\\cos 60^\\circ / \\cos 30^\\circ$) ลองตรวจด้วยสามเหลี่ยมแรง: เชือกสองเส้นตั้งฉากกัน $T_2 = 120\\cos 30^\\circ$" }
    solution: "จากแนวราบ $T_1 = T_2\\dfrac{\\cos 60^\\circ}{\\cos 30^\\circ} = 0.577\\,T_2$ แทนในแนวดิ่ง $0.577\\,T_2(0.5) + 0.866\\,T_2 = 1.155\\,T_2 = 120$ → $T_2 \\approx 103.9\\ \\mathrm{N}$ (และ $T_1 = 60\\ \\mathrm{N}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

