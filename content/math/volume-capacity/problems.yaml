problems:
  - id: math.measure.volume-capacity.p001
    topics: [math.measure.volume-capacity]
    difficulty: 1
    type: mcq
    stem: "ขวดใบหนึ่งจุน้ำได้ 600 มิลลิลิตร ตอนนี้มีน้ำ 300 มิลลิลิตร คำใดบอกปริมาณน้ำในขวดได้ถูกต้อง"
    choices:
      - { id: a, text: "ครึ่งขวด", correct: true }
      - { id: b, text: "เต็มขวด", feedback: "เต็มขวดต้องมีน้ำ 600 มิลลิลิตร" }
      - { id: c, text: "ขวดว่าง", feedback: "ขวดว่างคือไม่มีน้ำเลย แต่ขวดนี้มีน้ำ 300 มิลลิลิตร" }
      - { id: d, text: "เศษหนึ่งส่วนสี่ขวด", feedback: "หนึ่งในสี่ของ 600 คือ 150 มิลลิลิตร แต่มีน้ำ 300 มิลลิลิตร" }
    hints:
      - "300 เป็นกี่ส่วนของ 600"
      - "$300 + 300 = 600$"
    solution: "$300 + 300 = 600$ น้ำ 300 มิลลิลิตรจึงเป็นครึ่งหนึ่งของความจุ คือครึ่งขวด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.volume-capacity.p002
    topics: [math.measure.volume-capacity]
    difficulty: 1
    type: numeric
    stem: "1 ลิตร เท่ากับกี่มิลลิลิตร"
    answer: { value: 1000, unit: mL }
    hints:
      - "คำว่า มิลลิ แปลว่าหนึ่งในพัน"
      - "1 ลิตรแบ่งเป็นมิลลิลิตรได้หนึ่งพันส่วน"
    misconceptions:
      - { match: 100, feedback: "1 ลิตรเท่ากับ 1,000 มิลลิลิตร ไม่ใช่ 100" }
      - { match: 10, feedback: "1 ลิตรเท่ากับ 1,000 มิลลิลิตร ไม่ใช่ 10" }
    solution: "1 ลิตร = 1,000 มิลลิลิตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.volume-capacity.p003
    topics: [math.measure.volume-capacity]
    difficulty: 2
    type: numeric
    stem: "เทน้ำจากเหยือก A ที่เต็มลงแก้วได้ 6 แก้วพอดี เทน้ำจากเหยือก B ที่เต็มลงแก้วใบเดียวกันได้ 4 แก้วพอดี เหยือก A จุมากกว่าเหยือก B กี่แก้ว"
    answer: { value: 2, unit: แก้ว }
    hints:
      - "ใช้แก้วใบเดียวกันจึงเทียบกันได้"
      - "มากกว่ากันเท่าไร ใช้การลบ"
    misconceptions:
      - { match: 10, feedback: "บวกกัน แต่โจทย์ถามว่ามากกว่ากันเท่าไร ต้องลบ" }
    solution: "$6 - 4 = 2$ แก้ว เหยือก A จุมากกว่า 2 แก้ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.volume-capacity.p004
    topics: [math.measure.volume-capacity]
    difficulty: 2
    type: match
    stem: "จับคู่สิ่งที่ต้องการตวงกับเครื่องตวงหรือหน่วยที่เหมาะสมที่สุด"
    pairs:
      - { left: "น้ำปลาใส่แกงจืด 1 หม้อเล็ก", right: "ช้อนโต๊ะ" }
      - { left: "ผงฟูในสูตรขนมเล็กน้อย", right: "ช้อนชา" }
      - { left: "แป้งสำหรับทำขนมปัง 2 ก้อน", right: "ถ้วยตวง" }
      - { left: "น้ำในถังรดน้ำต้นไม้", right: "ลิตร" }
    hints:
      - "ช้อนชาเล็กที่สุด ช้อนโต๊ะใหญ่กว่า ถ้วยตวงใหญ่กว่านั้น"
      - "ของเหลวปริมาณมากใช้ลิตร"
    solution: "ผงฟูใช้น้อยมากตวงด้วยช้อนชา น้ำปลาใส่แกงตวงด้วยช้อนโต๊ะ แป้งปริมาณมากตวงด้วยถ้วยตวง และน้ำในถังวัดเป็นลิตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.volume-capacity.p005
    topics: [math.measure.volume-capacity]
    difficulty: 2
    type: numeric
    stem: "อ่านปริมาตรน้ำในเหยือกตวง มีน้ำกี่มิลลิลิตร"
    figure: { src: jug-problem.svg, alt: "เหยือกตวงมีตัวเลข 100, 200, 300, 400 และ 500 มิลลิลิตร ระหว่างตัวเลขสองตัวติดกันมีขีดสั้น 1 ขีด แบ่งเป็น 2 ช่องเท่ากัน ระดับน้ำอยู่ที่ขีดสั้นระหว่าง 300 กับ 400" }
    answer: { value: 350, unit: mL }
    hints:
      - "ระหว่าง 300 กับ 400 แบ่งเป็นกี่ช่อง"
      - "100 มิลลิลิตรแบ่ง 2 ช่อง ช่องละ 50 มิลลิลิตร"
    misconceptions:
      - { match: 310, feedback: "นับขีดสั้นเป็น 10 มิลลิลิตร แต่ 1 ช่องในเหยือกนี้คือ 50 มิลลิลิตร" }
      - { match: 400, feedback: "ระดับน้ำยังไม่ถึงขีด 400 อยู่ที่ขีดสั้นตรงกลาง" }
    solution: "ระหว่าง 300 กับ 400 มี 2 ช่อง ช่องละ $100 \\div 2 = 50$ มิลลิลิตร น้ำอยู่เหนือ 300 ไป 1 ช่อง ได้ $300 + 50 = 350$ มิลลิลิตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.volume-capacity.p006
    topics: [math.measure.volume-capacity]
    difficulty: 2
    type: mcq
    stem: "ขวดน้ำดื่มขวดเล็กที่ขายในร้านสะดวกซื้อ จุน้ำประมาณเท่าใด"
    choices:
      - { id: a, text: "600 มิลลิลิตร", correct: true }
      - { id: b, text: "6 มิลลิลิตร", feedback: "6 มิลลิลิตรน้อยกว่าหนึ่งช้อนชากับอีกนิดหน่อย น้อยเกินไปสำหรับขวดน้ำ" }
      - { id: c, text: "60 มิลลิลิตร", feedback: "60 มิลลิลิตรเท่ากับ 4 ช้อนโต๊ะ ดื่มอึกเดียวก็หมด น้อยเกินไป" }
      - { id: d, text: "6 ลิตร", feedback: "6 ลิตรเท่ากับขวดใหญ่หลายขวด หนักเกินกว่าจะถือดื่ม" }
    hints:
      - "นมกล่องเล็กประมาณ 200 มิลลิลิตร"
      - "ขวดน้ำเล็กใหญ่กว่านมกล่องเล็กประมาณ 3 เท่า"
    solution: "ขวดน้ำดื่มขวดเล็กจุประมาณ 600 มิลลิลิตร (ราว 3 เท่าของนมกล่องเล็ก)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.volume-capacity.p007
    topics: [math.measure.volume-capacity]
    difficulty: 3
    type: numeric
    stem: "2 ลิตร 300 มิลลิลิตร เท่ากับกี่มิลลิลิตร"
    answer: { value: 2300, unit: mL }
    hints:
      - "เปลี่ยน 2 ลิตรเป็นมิลลิลิตรก่อน"
      - "2 ลิตร = 2,000 มิลลิลิตร แล้วบวก 300"
    misconceptions:
      - { match: 2030, feedback: "300 มิลลิลิตรอยู่ในหลักร้อย ไม่ใช่หลักสิบ ต้องได้ $2{,}000 + 300$" }
      - { match: 500, feedback: "บวก 2 กับ 300 ไม่ได้เพราะเป็นคนละหน่วย ต้องเปลี่ยน 2 ลิตรเป็น 2,000 มิลลิลิตรก่อน" }
    solution: "2 ลิตร $= 2{,}000$ มิลลิลิตร รวม $2{,}000 + 300 = 2{,}300$ มิลลิลิตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.volume-capacity.p008
    topics: [math.measure.volume-capacity]
    difficulty: 3
    type: mcq
    stem: "เติมเครื่องหมาย: 1 ลิตร 50 มิลลิลิตร ___ 1,500 มิลลิลิตร"
    choices:
      - { id: a, text: "$<$", correct: true }
      - { id: b, text: "$>$", feedback: "1 ลิตร 50 มิลลิลิตร = 1,050 มิลลิลิตร ซึ่งน้อยกว่า 1,500" }
      - { id: c, text: "$=$", feedback: "เขียน 1 กับ 50 ติดกันเป็น 150_ แต่ 50 อยู่ในหลักสิบ 1 ลิตร 50 มิลลิลิตร = 1,050 มิลลิลิตร" }
    hints:
      - "เปลี่ยนให้เป็นมิลลิลิตรทั้งสองข้าง"
      - "$1{,}000 + 50$"
    solution: "1 ลิตร 50 มิลลิลิตร $= 1{,}050$ มิลลิลิตร และ $1{,}050 < 1{,}500$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.volume-capacity.p009
    topics: [math.measure.volume-capacity]
    difficulty: 3
    type: numeric
    stem: "แม่ซื้อนมถุงละ 200 มิลลิลิตร มา 5 ถุง นมทั้งหมดมีกี่มิลลิลิตร"
    answer: { value: 1000, unit: mL }
    hints:
      - "ทุกถุงเท่ากัน ใช้การคูณ"
      - "$5 \\times 200$"
    misconceptions:
      - { match: 205, feedback: "บวก 5 กับ 200 แต่มีนม 5 ถุง ถุงละ 200 ต้องคูณ" }
      - { match: 40, feedback: "หาร 200 ด้วย 5 แต่โจทย์ให้รวมนมทั้ง 5 ถุง ต้องคูณ" }
    solution: "$5 \\times 200 = 1{,}000$ มิลลิลิตร ซึ่งเท่ากับ 1 ลิตรพอดี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.volume-capacity.p010
    topics: [math.measure.volume-capacity]
    difficulty: 3
    type: numeric
    stem: "ถังมีน้ำ 5 ลิตร น้องใช้รดน้ำต้นไม้ไป 1 ลิตร 400 มิลลิลิตร เหลือน้ำในถังกี่มิลลิลิตร"
    answer: { value: 3600, unit: mL }
    hints:
      - "เปลี่ยนทั้งสองจำนวนเป็นมิลลิลิตร"
      - "$5{,}000 - 1{,}400$"
    misconceptions:
      - { match: 4400, feedback: "ลบมิลลิลิตรกลับข้าง (400 − 0 = 400) ที่ถูกต้องกระจาย 1 ลิตรเป็น 1,000 มิลลิลิตรก่อน แล้ว 1,000 − 400 = 600" }
      - { match: 4600, feedback: "ลบแค่ 400 มิลลิลิตร ลืมลบ 1 ลิตร" }
    solution: "$5{,}000 - 1{,}400 = 3{,}600$ มิลลิลิตร (3 ลิตร 600 มิลลิลิตร)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.volume-capacity.p011
    topics: [math.measure.volume-capacity]
    difficulty: 3
    type: numeric
    stem: "สูตรแกงจืดใช้น้ำปลา 2 ช้อนโต๊ะ ถ้ามีแต่ช้อนชา ต้องตวงกี่ช้อนชา (1 ช้อนโต๊ะ = 3 ช้อนชา)"
    answer: { value: 6, unit: ช้อนชา }
    hints:
      - "1 ช้อนโต๊ะเท่ากับ 3 ช้อนชา"
      - "2 ช้อนโต๊ะ คือ 3 สองครั้ง"
    misconceptions:
      - { match: 5, feedback: "บวก 2 กับ 3 แต่ต้องคูณ: 2 ช้อนโต๊ะ ช้อนละ 3 ช้อนชา" }
      - { match: 30, feedback: "30 คือจำนวนมิลลิลิตร โจทย์ถามจำนวนช้อนชา" }
    solution: "$2 \\times 3 = 6$ ช้อนชา (หรือ $2 \\times 15 = 30$ มิลลิลิตร $= 30 \\div 5 = 6$ ช้อนชา)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.volume-capacity.p012
    topics: [math.measure.volume-capacity]
    difficulty: 3
    type: numeric
    stem: "ทรงสี่เหลี่ยมมุมฉากในภาพต่อจากลูกบาศก์หน่วย มีปริมาตรกี่ลูกบาศก์หน่วย"
    figure: { src: cubes-problem.svg, alt: "ทรงสี่เหลี่ยมมุมฉากต่อจากลูกบาศก์ ด้านยาวมี 5 ลูก ด้านกว้างมี 2 ลูก สูง 3 ชั้น เห็นด้านบนและด้านข้างสองด้าน" }
    answer: { value: 30, unit: ลูกบาศก์หน่วย }
    hints:
      - "นับลูกในหนึ่งชั้นก่อน"
      - "ชั้นหนึ่งมี 2 แถว แถวละ 5 ลูก แล้วคูณด้วยจำนวนชั้น"
    misconceptions:
      - { match: 10, feedback: "10 คือจำนวนลูกในชั้นเดียว ต้องคูณด้วย 3 ชั้น" }
      - { match: 22, feedback: "นับเฉพาะลูกที่มองเห็น ยังมีลูกที่ซ่อนอยู่ข้างในและด้านหลังอีก 8 ลูก" }
    solution: "ชั้นละ $2 \\times 5 = 10$ ลูก มี 3 ชั้น ปริมาตร $= 10 \\times 3 = 30$ ลูกบาศก์หน่วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.volume-capacity.p013
    topics: [math.measure.volume-capacity]
    difficulty: 4
    type: numeric
    stem: "รูปในภาพประกอบด้วยทรงสี่เหลี่ยมมุมฉากสองก้อน ก้อนล่างยาว 8 ซม. กว้าง 4 ซม. สูง 2 ซม. ก้อนบนวางชิดด้านซ้าย ยาว 3 ซม. กว้าง 4 ซม. สูง 3 ซม. รูปนี้มีปริมาตรกี่ลูกบาศก์เซนติเมตร"
    figure: { src: composite-problem.svg, alt: "รูปสามมิติรูปตัวแอล ก้อนล่างเป็นทรงสี่เหลี่ยมมุมฉากยาว 8 ซม. กว้าง 4 ซม. สูง 2 ซม. ก้อนบนวางบนก้อนล่างชิดด้านซ้าย ยาว 3 ซม. กว้าง 4 ซม. สูง 3 ซม." }
    answer: { value: 100, unit: cm³ }
    hints:
      - "หาปริมาตรของแต่ละก้อนแยกกัน"
      - "ก้อนล่าง $4 \\times 8$ ต่อชั้น สูง 2 ชั้น ก้อนบน $4 \\times 3$ ต่อชั้น สูง 3 ชั้น แล้วบวก"
    misconceptions:
      - { match: 160, feedback: "คิดเป็นกล่องใหญ่ $8 \\times 4 \\times 5$ แต่ด้านขวาบนเป็นที่ว่าง ต้องแบ่งเป็นสองก้อน" }
      - { match: 124, feedback: "ใช้ความสูง 5 ซม. กับก้อนบน แต่ก้อนบนสูงแค่ 3 ซม. (อีก 2 ซม. เป็นของก้อนล่าง)" }
    solution: "ก้อนล่าง $4 \\times 8 \\times 2 = 64$ ลูกบาศก์เซนติเมตร ก้อนบน $4 \\times 3 \\times 3 = 36$ ลูกบาศก์เซนติเมตร รวม $64 + 36 = 100$ ลูกบาศก์เซนติเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.volume-capacity.p014
    topics: [math.measure.volume-capacity]
    difficulty: 4
    type: numeric
    stem: "ตู้ปลาจุน้ำ 30 ลิตร พ่อใช้ขันที่จุ 1 ลิตร 500 มิลลิลิตร ตักน้ำใส่ตู้ปลาที่ว่างจนเต็ม ต้องตักกี่ขัน"
    answer: { value: 20, unit: ขัน }
    hints:
      - "เปลี่ยนเป็นมิลลิลิตรทั้งสองจำนวน"
      - "$30{,}000 \\div 1{,}500$"
    misconceptions:
      - { match: 2, feedback: "หาร 30 ด้วย 15 โดยไม่ได้เปลี่ยนหน่วยให้ตรงกัน ขันละ 1,500 มิลลิลิตร ตู้ 30,000 มิลลิลิตร" }
      - { match: 30, feedback: "นับขันละ 1 ลิตร แต่ขันจุ 1 ลิตรครึ่ง จึงใช้น้อยกว่า 30 ขัน" }
    solution: "ตู้ปลา $30$ ลิตร $= 30{,}000$ มิลลิลิตร ขัน $= 1{,}500$ มิลลิลิตร ต้องตัก $30{,}000 \\div 1{,}500 = 20$ ขัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.volume-capacity.p015
    topics: [math.measure.volume-capacity]
    difficulty: 4
    type: order
    stem: "เรียงปริมาตรจากน้อยที่สุดไปมากที่สุด"
    items:
      - "950 มิลลิลิตร"
      - "1 ลิตร 5 มิลลิลิตร"
      - "1,050 มิลลิลิตร"
      - "1 ลิตร 500 มิลลิลิตร"
    hints:
      - "เปลี่ยนทุกจำนวนเป็นมิลลิลิตร"
      - "1 ลิตร 5 มิลลิลิตร $= 1{,}005$ มิลลิลิตร และ 1 ลิตร 500 มิลลิลิตร $= 1{,}500$ มิลลิลิตร"
    solution: "เป็นมิลลิลิตร: 950, 1,005, 1,050, 1,500 เรียงจากน้อยไปมาก: 950 มล. < 1 ลิตร 5 มล. < 1,050 มล. < 1 ลิตร 500 มล."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.volume-capacity.p016
    topics: [math.measure.volume-capacity]
    difficulty: 4
    type: mcq
    stem: "ข้อใดหาปริมาตรด้วย กว้าง × ยาว × สูง ได้ทันทีโดยไม่ต้องแบ่งหรือวัดวิธีอื่น"
    choices:
      - { id: a, text: "กล่องนมรูปทรงสี่เหลี่ยมมุมฉาก", correct: true }
      - { id: b, text: "ก้อนหินจากลำธาร", feedback: "ก้อนหินรูปร่างไม่แน่นอน ใช้สูตรไม่ได้ ต้องหย่อนลงน้ำแล้วดูว่าระดับน้ำสูงขึ้นเท่าไร" }
      - { id: c, text: "บันไดคอนกรีตสามขั้น", feedback: "บันไดเป็นรูปประกอบ ต้องแบ่งเป็นทรงสี่เหลี่ยมมุมฉากหลายก้อนก่อน แล้วบวกปริมาตร" }
