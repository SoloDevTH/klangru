id: biology.foundations.life-and-science
subject: biology
title: { th: สมบัติของสิ่งมีชีวิตและวิธีการทางวิทยาศาสตร์, en: Properties of life and the scientific method }
summary: สมบัติร่วมของสิ่งมีชีวิต การจัดระบบตั้งแต่อะตอมถึงโลกของสิ่งมีชีวิต การตั้งปัญหาและสมมติฐาน การออกแบบการทดลองด้วยตัวแปร และชีวจริยธรรม
difficulty: 3
minutes: 35
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ระดับการจัดระบบของสิ่งมีชีวิต
    src: levels.svg
    alt: "แผนภาพลำดับขั้น 12 ระดับจากเล็กไปใหญ่ พร้อมตัวอย่าง: อะตอม (อะตอมออกซิเจน คาร์บอน), โมเลกุล (น้ำ กลูโคส โปรตีน), ออร์แกเนลล์ (ไมโทคอนเดรีย นิวเคลียส) สามระดับนี้ยังไม่มีชีวิต; เซลล์ (เซลล์กล้ามเนื้อหัวใจ), เนื้อเยื่อ (เนื้อเยื่อกล้ามเนื้อหัวใจ), อวัยวะ (หัวใจ), ระบบอวัยวะ (ระบบหมุนเวียนเลือด), สิ่งมีชีวิต (ช้างหนึ่งตัว) ห้าระดับนี้อยู่ภายในสิ่งมีชีวิตหนึ่งตัว; ประชากร (ช้างทั้งฝูงในป่าเดียวกัน), กลุ่มสิ่งมีชีวิต (ช้าง กวาง ต้นไม้ เห็ดราในป่านั้น), ระบบนิเวศ (กลุ่มสิ่งมีชีวิตรวมกับดิน น้ำ อากาศ แสง), โลกของสิ่งมีชีวิต (ทุกระบบนิเวศบนโลก) สี่ระดับนี้เป็นสิ่งมีชีวิตหลายตัวร่วมกัน"
    caption: "เซลล์เป็นระดับแรกที่มีชีวิต แต่ละระดับเกิดจากระดับที่เล็กกว่าทำงานร่วมกัน (วาดโดยทีมคลังรู้)"
  - { type: check, problem: biology.foundations.life-and-science.p004, prompt: "ใช้แผนภาพข้างบนตอบ" }
  - type: figure
    title: ขั้นตอนของวิธีการทางวิทยาศาสตร์
    src: scientific-method.svg
    alt: "ผังงานห้าขั้นเรียงจากบนลงล่าง: 1 สังเกต เห็นปรากฏการณ์ที่น่าสงสัย, 2 ระบุปัญหา ตั้งคำถามที่ตรวจสอบได้, 3 ตั้งสมมติฐาน ถ้า... ดังนั้น..., 4 ตรวจสอบสมมติฐาน ออกแบบการทดลอง กำหนดตัวแปร ชุดควบคุม, 5 วิเคราะห์และสรุปผล ว่าข้อมูลสนับสนุนสมมติฐานหรือไม่ ถ้าไม่สนับสนุนมีลูกศรวนกลับไปขั้นที่ 3 ตั้งสมมติฐานใหม่ ถ้าสนับสนุนไปต่อที่ สื่อสารผลให้ผู้อื่นตรวจซ้ำ"
    caption: "เมื่อข้อมูลไม่สนับสนุนสมมติฐาน นักวิทยาศาสตร์ตั้งสมมติฐานใหม่แล้วตรวจสอบอีกครั้ง (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ออกแบบการทดลองเรื่องปุ๋ยหมักกับผักบุ้ง
    problem: "นักเรียนกลุ่มหนึ่งได้ยินว่าปุ๋ยหมักจากเศษอาหารในโรงอาหารช่วยให้ผักบุ้งโตเร็ว จงตั้งปัญหา สมมติฐาน กำหนดตัวแปร และออกแบบชุดการทดลอง"
    steps:
      - text: "ตั้งปัญหาที่ตรวจสอบได้: ปุ๋ยหมักจากเศษอาหารมีผลต่อความสูงของผักบุ้งหรือไม่"
        why: "ปัญหาบอกชัดว่าจะเปลี่ยนอะไร (ปุ๋ย) และวัดอะไร (ความสูง) จึงออกแบบการทดลองได้"
      - text: "ตั้งสมมติฐาน: ถ้าดินผสมปุ๋ยหมัก ดังนั้นผักบุ้งจะสูงกว่าผักบุ้งที่ปลูกในดินไม่ผสมปุ๋ยหมัก"
      - text: "ตัวแปรต้น: การผสมหรือไม่ผสมปุ๋ยหมัก ตัวแปรตาม: ความสูงของผักบุ้งเมื่อครบ 14 วัน"
      - text: "ตัวแปรควบคุม: พันธุ์และจำนวนเมล็ด ชนิดและปริมาณดิน ขนาดกระถาง ปริมาณน้ำที่รด แสง และระยะเวลา"
        why: "ถ้าสิ่งเหล่านี้ต่างกัน ผลที่ได้อาจเกิดจากสิ่งนั้นแทนปุ๋ย"
      - text: "จัดชุดควบคุม (ดินไม่ผสมปุ๋ย) และชุดทดลอง (ดินผสมปุ๋ย) ชุดละ 3 กระถาง วางเรียงกันในที่เดียวกัน"
        why: "ทำซ้ำหลายกระถางแล้วหาค่าเฉลี่ย เพื่อลดผลของกระถางใดกระถางหนึ่งที่ผิดปกติ"
      - text: "วัดความสูง หาค่าเฉลี่ยแต่ละชุด แล้วสรุปว่าข้อมูลสนับสนุนสมมติฐานหรือไม่"
    answer: "ตัวแปรต้นคือปุ๋ยหมัก ตัวแปรตามคือความสูง ตัวแปรอื่นต้องเท่ากันทุกชุด และต้องมีชุดควบคุมที่ไม่ใส่ปุ๋ย"
  - { type: check, problem: biology.foundations.life-and-science.p007, prompt: "ดูกราฟการทดลองเรื่องน้ำเกลือในโจทย์ข้อนี้" }
glossary:
  - { term: เมแทบอลิซึม, definition: "ปฏิกิริยาเคมีทั้งหมดที่เกิดในเซลล์ของสิ่งมีชีวิต ทั้งการสลายสารเพื่อให้ได้พลังงานและการสร้างสาร" }
  - { term: ดุลยภาพของร่างกาย (โฮมีโอสเตซิส), definition: "การรักษาสภาพภายในร่างกาย เช่น อุณหภูมิ น้ำ และระดับน้ำตาลในเลือด ให้อยู่ในช่วงที่เหมาะสม" }
  - { term: สมมติฐาน, definition: "คำตอบที่คาดไว้ล่วงหน้าของปัญหา ซึ่งตรวจสอบได้ด้วยการทดลองหรือการเก็บข้อมูล มักเขียนว่า ถ้า... ดังนั้น..." }
  - { term: ตัวแปรต้น ตัวแปรตาม ตัวแปรควบคุม, definition: "ตัวแปรต้นคือสิ่งที่ผู้ทดลองตั้งใจเปลี่ยน ตัวแปรตามคือผลที่วัด ตัวแปรควบคุมคือสิ่งที่ต้องให้เท่ากันทุกชุด" }
  - { term: ชุดควบคุม, definition: "ชุดการทดลองที่ไม่ได้รับตัวแปรต้นหรือได้รับในระดับปกติ ใช้เทียบกับชุดทดลอง" }
  - { term: ชีวจริยธรรม, definition: "หลักความถูกต้องในการศึกษาและใช้ประโยชน์จากสิ่งมีชีวิต เช่น ความยินยอมของผู้เข้าร่วมวิจัย และการดูแลสัตว์ทดลอง" }
flashcards:
  - { front: "สมบัติที่สำคัญของสิ่งมีชีวิตมีอะไรบ้าง", back: "ประกอบด้วยเซลล์และจัดระบบ ต้องการสารอาหารและพลังงาน (เมแทบอลิซึม) ตอบสนองต่อสิ่งเร้า รักษาดุลยภาพ สืบพันธุ์ เจริญเติบโตและมีอายุขัย ปรับตัวและวิวัฒนาการ" }
  - { front: "เรียงระดับการจัดระบบจากเซลล์ถึงสิ่งมีชีวิต", back: "เซลล์ → เนื้อเยื่อ → อวัยวะ → ระบบอวัยวะ → สิ่งมีชีวิต" }
  - { front: "ประชากร ต่างจาก กลุ่มสิ่งมีชีวิต อย่างไร", back: "ประชากรคือสิ่งมีชีวิตชนิดเดียวกันในที่เดียวกัน กลุ่มสิ่งมีชีวิตคือประชากรหลายชนิดรวมกัน" }
  - { front: "ตัวแปรต้นกับตัวแปรตามต่างกันอย่างไร", back: "ตัวแปรต้นคือสิ่งที่เราตั้งใจเปลี่ยน ตัวแปรตามคือผลที่เราวัด" }
  - { front: "ผลการทดลองที่ตรงกับที่คาด แปลว่าอะไร", back: "ข้อมูลสนับสนุนสมมติฐาน (ไม่ได้พิสูจน์ว่าจริงตลอดไป)" }
