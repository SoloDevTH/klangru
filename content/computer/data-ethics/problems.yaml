    ai_assisted: true

  - id: computer.society.data-ethics.p015
    topics: [computer.society.data-ethics]
    difficulty: 4
    type: mcq
    stem: "นโยบายใดช่วยให้การใช้ข้อมูลเป็นไปอย่างรับผิดชอบได้ดีที่สุดในระยะยาว"
    choices:
      - { id: b, text: "เก็บทุกอย่างไว้ตลอดไปเพื่อความพร้อมใช้งาน", feedback: "การเก็บตลอดไปเพิ่มความเสี่ยงและขัดกับหลักการเก็บเท่าที่จำเป็น" }
      - { id: c, text: "ให้ทุกคนในองค์กรเข้าถึงข้อมูลได้เพื่อความรวดเร็ว", feedback: "การเปิดให้ทุกคนเข้าถึงทำให้ควบคุมการใช้งานและตรวจสอบได้ยาก" }
      - { id: a, text: "กำหนดวัตถุประสงค์ มีบันทึกการเข้าถึงที่ตรวจสอบได้ จำกัดสิทธิ์ผู้เข้าถึง และกำหนดระยะเวลาเก็บที่ชัดเจน", correct: true }
      - { id: d, text: "ไม่กำหนดนโยบายจนกว่าจะเกิดปัญหา", feedback: "การรอให้เกิดปัญหาก่อนจึงกำหนดนโยบายทำให้ความเสียหายมากกว่าที่ควรจะเป็น" }
    hints:
      - "นโยบายที่ดีต้องตรวจสอบได้และจำกัดการใช้ให้อยู่ในขอบเขต"
      - "ตัวเลือกที่มีการเก็บตลอดไปหรือเปิดให้ทุกคนเข้าถึงขัดกับหลักการพื้นฐาน"
    solution: "นโยบายที่ดีกำหนดวัตถุประสงค์ จำกัดสิทธิ์เข้าถึง มีการตรวจสอบได้ และกำหนดระยะเวลาเก็บที่ชัดเจน ซึ่งช่วยให้ใช้ข้อมูลได้โดยลดความเสี่ยงต่อผู้เกี่ยวข้อง"
