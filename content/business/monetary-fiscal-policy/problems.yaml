problems:
- id: business.econ.monetary-fiscal-policy.p001
  topics:
  - business.econ.monetary-fiscal-policy
  difficulty: 1
  type: mcq
  stem: ในประเทศไทย ใครเป็นผู้ตัดสินใจกำหนด **อัตราดอกเบี้ยนโยบาย**
  choices:
  - id: a
    text: คณะกรรมการนโยบายการเงิน (กนง.) ของธนาคารแห่งประเทศไทย
    correct: true
  - id: b
    text: กระทรวงการคลัง
    feedback: กระทรวงการคลังดูแลนโยบายการคลัง (ภาษี รายจ่าย หนี้สาธารณะ) ไม่ได้กำหนดดอกเบี้ยนโยบาย
  - id: c
    text: ธนาคารพาณิชย์แต่ละแห่ง
    feedback: ธนาคารพาณิชย์กำหนดดอกเบี้ยเงินฝากและเงินกู้ของตัวเอง โดยดูดอกเบี้ยนโยบายประกอบ
  - id: d
    text: สภาผู้แทนราษฎร
    feedback: รัฐสภาพิจารณาร่างกฎหมายงบประมาณ ซึ่งเป็นนโยบายการคลัง
  hints:
  - นโยบายการเงินเป็นหน้าที่ของธนาคารกลาง
  - ธนาคารกลางมีคณะกรรมการที่ลงมติเรื่องดอกเบี้ย
  solution: กนง. ซึ่งมีกรรมการ 7 คน (ผู้บริหาร ธปท. 3 คน และผู้ทรงคุณวุฒิภายนอก 4 คน) ลงมติกำหนดอัตราดอกเบี้ยนโยบาย ปกติประชุมปีละ 6 ครั้ง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.monetary-fiscal-policy.p002
  topics:
  - business.econ.monetary-fiscal-policy
  difficulty: 1
  type: match
  stem: จับคู่การกระทำกับประเภทของนโยบาย
  pairs:
  - left: กนง. ลดอัตราดอกเบี้ยนโยบาย
    right: นโยบายการเงินแบบผ่อนคลาย
  - left: รัฐเพิ่มงบสร้างถนนและระบบน้ำ
    right: นโยบายการคลังแบบขยายตัว
  - left: รัฐขึ้นอัตราภาษีและลดรายจ่าย
    right: นโยบายการคลังแบบหดตัว
  - left: กนง. ขึ้นอัตราดอกเบี้ยนโยบาย
    right: นโยบายการเงินแบบเข้มงวด
  hints:
  - ดอกเบี้ยและปริมาณเงินเป็นเครื่องมือของธนาคารกลาง
  - ภาษีและรายจ่ายเป็นเครื่องมือของรัฐบาล
  solution: เรื่องดอกเบี้ยเป็นนโยบายการเงิน (ลด = ผ่อนคลาย ขึ้น = เข้มงวด) เรื่องรายจ่ายและภาษีเป็นนโยบายการคลัง (เพิ่มรายจ่าย/ลดภาษี = ขยายตัว ขึ้นภาษี/ลดรายจ่าย = หดตัว)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.monetary-fiscal-policy.p003
  topics:
  - business.econ.monetary-fiscal-policy
  difficulty: 2
  type: mcq
  stem: ประเทศสมมติเศรษฐกิจชะลอตัว เงินเฟ้อต่ำกว่าเป้าหมาย ธนาคารกลางควรใช้นโยบายการเงินแบบใด
  choices:
  - id: a
    text: ลดอัตราดอกเบี้ยนโยบาย เพื่อให้ต้นทุนการกู้ลดลง กระตุ้นการใช้จ่ายและการลงทุน
    correct: true
  - id: b
    text: ขึ้นอัตราดอกเบี้ยนโยบาย
    feedback: การขึ้นดอกเบี้ยทำให้การใช้จ่ายลดลง ใช้เมื่อเงินเฟ้อสูงเกินเป้า
  - id: c
    text: ขึ้นภาษีเงินได้
    feedback: ภาษีเป็นเครื่องมือการคลังของรัฐบาล ไม่ใช่ของธนาคารกลาง และการขึ้นภาษียิ่งทำให้เศรษฐกิจชะลอ
  - id: d
    text: พิมพ์ธนบัตรแจกประชาชนโดยตรง
    feedback: ไม่ใช่เครื่องมือปกติของนโยบายการเงิน และเสี่ยงต่อเงินเฟ้อและความเชื่อมั่น
  hints:
  - เงินเฟ้อต่ำและเศรษฐกิจชะลอ ต้องการให้ใช้จ่ายมากขึ้นหรือน้อยลง
  - ดอกเบี้ยต่ำทำให้กู้ง่ายขึ้น
  solution: เมื่อเศรษฐกิจชะลอและเงินเฟ้อต่ำกว่าเป้า ธนาคารกลางมักผ่อนคลายนโยบายการเงินด้วยการลดดอกเบี้ยนโยบาย ดอกเบี้ยในตลาดลดลง ครัวเรือนและธุรกิจกู้และใช้จ่ายมากขึ้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.monetary-fiscal-policy.p004
  topics:
  - business.econ.monetary-fiscal-policy
  difficulty: 2
  type: numeric
  stem: ในแบบจำลองอย่างง่าย ธนาคารต้องสำรองเงินฝาก $10\%$ และปล่อยกู้ส่วนที่เหลือทั้งหมด ผู้กู้นำเงินกลับมาฝากทั้งหมด ถ้ามีเงินฝากใหม่ $1{,}000$ ล้านบาท เงินฝากรวมในระบบเพิ่มได้ **สูงสุด** กี่ล้านบาท
  answer:
    value: 10000.0
    unit: ล้านบาท
  misconceptions:
  - match: 900
    feedback: นั่นคือเงินที่ปล่อยกู้รอบแรกเท่านั้น
  - match: 100
    feedback: นั่นคือเงินสำรองรอบแรก
  hints:
  - ตัวทวีคูณเงินฝากอย่างง่าย $= \dfrac{1}{\text{อัตราสำรอง}}$
  - $\dfrac{1}{0.10} = 10$
  solution: เงินฝากสูงสุด $= 1{,}000 \times \dfrac{1}{0.10} = 10{,}000$ ล้านบาท ในความจริงต่ำกว่านี้ เพราะธนาคารสำรองเกิน คนถือเงินสด และการปล่อยกู้ขึ้นกับความต้องการกู้และความเสี่ยง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.monetary-fiscal-policy.p005
  topics:
  - business.econ.monetary-fiscal-policy
  difficulty: 2
  type: numeric
  stem: จากภาพงบประมาณของประเทศสมมติ ปีงบประมาณนี้ขาดดุลกี่พันล้านบาท (ตอบเป็นจำนวนบวก)
  answer:
    value: 550
    unit: พันล้านบาท
  misconceptions:
  - match: 6050
    feedback: บวกรายได้กับรายจ่าย
  - match: 83.333333
    feedback: หาร้อยละแทนผลต่าง
  figure:
    src: p-budget.svg
    alt: แผนภูมิแท่งงบประมาณของประเทศสมมติในปีงบประมาณหนึ่ง หน่วยพันล้านบาท รายได้รัฐบาล 2,750 รายจ่ายรัฐบาล 3,300
  hints:
  - ดุลงบประมาณ $=$ รายได้ $-$ รายจ่าย
  - ถ้าติดลบคือขาดดุล
  solution: ดุล $= 2{,}750 - 3{,}300 = -550$ ขาดดุล $550$ พันล้านบาท รัฐต้องกู้มาชดเชย หนี้สาธารณะจึงเพิ่มขึ้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.monetary-fiscal-policy.p006
  topics:
  - business.econ.monetary-fiscal-policy
  difficulty: 3
  type: numeric
  stem: แบบจำลองเศรษฐกิจปิดอย่างง่าย ความโน้มเอียงในการบริโภคหน่วยท้ายสุด (MPC) $= 0.8$ ถ้ารัฐเพิ่มรายจ่ายลงทุน $20$ พันล้านบาท GDP จะเพิ่มขึ้นกี่พันล้านบาท
  answer:
    value: 100
    unit: พันล้านบาท
  misconceptions:
  - match: 20
    feedback: ลืมผลทวีคูณ
  - match: 16
    feedback: คูณด้วย MPC แทนตัวทวีคูณ
  hints:
  - ตัวทวีคูณรายจ่าย $= \dfrac{1}{1 - \text{MPC}}$
  - $\dfrac{1}{1 - 0.8} = 5$
  solution: ตัวทวีคูณ $= 5$ GDP เพิ่ม $= 5 \times 20 = 100$ พันล้านบาท เพราะรายจ่ายรอบแรกกลายเป็นรายได้ของคนอื่นที่ใช้จ่ายต่อไปอีกหลายรอบ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.monetary-fiscal-policy.p007
  topics:
  - business.econ.monetary-fiscal-policy
  difficulty: 3
  type: numeric
  stem: ต่อจากภาพงบประมาณ ถ้า GDP ของประเทศสมมติเท่ากับ $18{,}500$ พันล้านบาท การขาดดุล $550$ พันล้านบาทคิดเป็นร้อยละเท่าใดของ GDP (ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 2.972973
    tolerance: 0.02
    unit: '%'
  misconceptions:
  - match: 16.666667
    feedback: หารด้วยรายจ่ายรัฐ ต้องหารด้วย GDP
  hints:
  - ร้อยละของ GDP $= \dfrac{\text{ขาดดุล}}{\text{GDP}} \times 100$
  - ใช้ GDP ไม่ใช่รายจ่ายรัฐเป็นตัวหาร
  solution: $\dfrac{550}{18{,}500} \times 100 \approx 2.97\%$ ของ GDP การวัดเทียบกับ GDP ช่วยเทียบขนาดการขาดดุลข้ามปีและข้ามประเทศ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.monetary-fiscal-policy.p008
  topics:
  - business.econ.monetary-fiscal-policy
  difficulty: 3
  type: mcq
  stem: เมื่อ กนง. **ลด** อัตราดอกเบี้ยนโยบาย ข้อใดเป็นผลที่คาดได้ตามช่องทางการส่งผ่าน เลือกทุกข้อที่ถูก
  multiple: true
  choices:
  - id: a
    text: ดอกเบี้ยเงินกู้และเงินฝากของธนาคารพาณิชย์มีแนวโน้มลดลง
    correct: true
  - id: b
    text: ธุรกิจมีแรงจูงใจลงทุนมากขึ้นเพราะต้นทุนการกู้ลดลง
    correct: true
  - id: c
    text: เงินบาทมีแนวโน้มอ่อนค่าลง ส่งออกได้เปรียบด้านราคา
    correct: true
  - id: d
    text: เงินเฟ้อลดลงทันทีในเดือนเดียวกัน
    feedback: การลดดอกเบี้ยกระตุ้นการใช้จ่าย จึงมักดันราคาขึ้น และผลใช้เวลานาน ราว 2 ปีจึงเต็มที่
  - id: e
    text: ผู้ฝากเงินได้ดอกเบี้ยมากขึ้น
    feedback: ดอกเบี้ยเงินฝากมีแนวโน้มลดลง ผู้ออมได้รับน้อยลง
  hints:
  - ดอกเบี้ยนโยบายส่งผลต่อดอกเบี้ยในตลาด สินเชื่อ ราคาสินทรัพย์ อัตราแลกเปลี่ยน และการคาดการณ์
  - ดอกเบี้ยในประเทศต่ำลงเมื่อเทียบกับต่างประเทศ เงินทุนอาจไหลออก
  solution: ดอกเบี้ยลด → ดอกเบี้ยตลาดลด การกู้และลงทุนเพิ่ม เงินบาทมีแนวโน้มอ่อน ส่งออกดีขึ้น ผลรวมทำให้ใช้จ่ายมากขึ้นและราคามีแนวโน้มสูงขึ้นภายหลัง ไม่ใช่ลดลงทันที
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.monetary-fiscal-policy.p009
  topics:
  - business.econ.monetary-fiscal-policy
  difficulty: 3
  type: numeric
  stem: ร้านอาหารแห่งหนึ่งในเชียงใหม่ (สมมติ) มีเงินกู้ดอกเบี้ยลอยตัว $10$ ล้านบาท ถ้าธนาคารปรับดอกเบี้ยขึ้น $0.25$ จุดร้อยละตามดอกเบี้ยนโยบาย ร้านต้องจ่ายดอกเบี้ยเพิ่มปีละกี่บาท
  answer:
    value: 25000.0
    unit: บาท
  misconceptions:
  - match: 2500000
    feedback: ใช้ 0.25 แทน 0.0025 (ลืมว่าเป็นร้อยละ)
  - match: 250000
    feedback: ใช้ 2.5% แทน 0.25%
  hints:
  - $0.25$ จุดร้อยละ $= 0.0025$
  - ดอกเบี้ยเพิ่ม $=$ เงินต้น $\times 0.0025$
  solution: $10{,}000{,}000 \times 0.0025 = 25{,}000$ บาทต่อปี การเปลี่ยนดอกเบี้ยเพียงเล็กน้อยกระทบต้นทุนของธุรกิจที่มีหนี้มาก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.monetary-fiscal-policy.p010
  topics:
  - business.econ.monetary-fiscal-policy
  difficulty: 3
  type: order
  stem: เรียงลำดับการส่งผ่านเมื่อธนาคารกลางลดอัตราดอกเบี้ยนโยบาย
  items:
  - กนง. ลดอัตราดอกเบี้ยนโยบาย
  - ดอกเบี้ยระยะสั้นในตลาดเงินลดลง
  - ธนาคารพาณิชย์ลดดอกเบี้ยเงินกู้
  - ครัวเรือนและธุรกิจกู้เพื่อใช้จ่ายและลงทุนมากขึ้น
  - ผลผลิตและการจ้างงานเพิ่ม ราคามีแนวโน้มสูงขึ้น
  hints:
  - เริ่มจากการตัดสินใจของธนาคารกลาง
  - ผลต่อ GDP และเงินเฟ้อเกิดเป็นอันดับท้าย
  solution: ดอกเบี้ยนโยบาย → ตลาดเงิน → ดอกเบี้ยของธนาคาร → การใช้จ่ายและการลงทุน → ผลผลิต การจ้างงาน และราคา แต่ละขั้นใช้เวลา ผลเต็มที่ราว 2 ปี
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.monetary-fiscal-policy.p011
  topics:
  - business.econ.monetary-fiscal-policy
  difficulty: 4
  type: numeric
  stem: ในแบบจำลองอย่างง่าย MPC $= 0.75$ ถ้ารัฐ **ลดภาษี** $10$ พันล้านบาท GDP จะเพิ่มขึ้นกี่พันล้านบาท
  answer:
    value: 30
    unit: พันล้านบาท
  misconceptions:
  - match: 40
    feedback: ใช้ตัวทวีคูณรายจ่าย $1/(1 - \text{MPC})$ แต่การลดภาษีส่งผลผ่านการบริโภคเท่านั้น
  - match: -30
    feedback: เครื่องหมายผิด ลดภาษีทำให้ GDP เพิ่ม
  hints:
  - ตัวทวีคูณภาษี $= \dfrac{-\text{MPC}}{1 - \text{MPC}}$
  - ภาษีลดคือ $\Delta T = -10$
  solution: ตัวทวีคูณภาษี $= -0.75 / 0.25 = -3$ GDP เปลี่ยน $= -3 \times (-10) = +30$ พันล้านบาท น้อยกว่าการเพิ่มรายจ่ายรัฐ $10$ (ได้ $40$) เพราะประชาชนออมส่วนหนึ่งของเงินที่ได้จากการลดภาษีตั้งแต่รอบแรก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.monetary-fiscal-policy.p012
  topics:
  - business.econ.monetary-fiscal-policy
  difficulty: 4
  type: numeric
  stem: เศรษฐกิจเปิดอย่างไทยมีการนำเข้ามาก สมมติ MPC $= 0.8$ และความโน้มเอียงในการนำเข้าหน่วยท้ายสุด (MPM) $= 0.3$ ตัวทวีคูณ $= \dfrac{1}{1 - \text{MPC} + \text{MPM}}$ ถ้ารัฐเพิ่มรายจ่าย $20$ พันล้านบาท GDP จะเพิ่มกี่พันล้านบาท
  answer:
    value: 40.0
    unit: พันล้านบาท
  misconceptions:
  - match: 100
    feedback: ลืมการรั่วไหลไปยังสินค้านำเข้า
  - match: -200.0
    feedback: ใช้ $1/(1 - \text{MPC} - \text{MPM})$ เครื่องหมายของ MPM ผิด การนำเข้าเป็นการรั่วไหลจึงต้องบวกในตัวส่วน
  hints:
  - $1 - 0.8 + 0.3 = 0.5$
  - ตัวทวีคูณ $= 2$
  solution: ตัวทวีคูณ $= 1 / 0.5 = 2$ GDP เพิ่ม $40$ พันล้านบาท น้อยกว่าเศรษฐกิจปิด ($100$) เพราะเงินส่วนหนึ่งรั่วไหลไปซื้อสินค้านำเข้า
