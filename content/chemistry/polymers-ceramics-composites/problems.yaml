    difficulty: 4
    type: mcq
    stem: "นักเรียนต้องการทดสอบว่าจานพลาสติก PP จานเมลามีน หรือจานกระเบื้อง ทนความร้อนได้ดีที่สุด การทดลองแบบใดยุติธรรมที่สุด"
    choices:
      - { id: a, text: "ใช้จานขนาดและความหนาเท่ากัน วางบนแผ่นให้ความร้อนอุณหภูมิเดียวกันเป็นเวลาเท่ากัน แล้วสังเกตการเสียรูป", correct: true, feedback: "ถูก ควบคุมทุกตัวแปรให้เหมือนกัน เปลี่ยนเพียงชนิดวัสดุ" }
      - { id: b, text: "ใช้จานที่บ้านมีอยู่ ขนาดไม่เท่ากัน ให้ความร้อนพร้อมกัน", feedback: "ขนาดและความหนาต่างกันมีผลต่อผล จึงสรุปไม่ได้ว่าต่างเพราะวัสดุ" }
      - { id: c, text: "ให้ความร้อนจาน PP นาน 1 นาที จานอื่นนาน 5 นาที", feedback: "เวลาต่างกันทำให้การทดลองไม่ยุติธรรม" }
      - { id: d, text: "ลนไฟโดยตรงด้วยไฟแช็กทีละใบในห้องปิด", feedback: "ไม่ปลอดภัย พลาสติกที่ไหม้ปล่อยควันพิษ และควบคุมความร้อนไม่ได้" }
    hints:
      - "ตัวแปรต้นคือชนิดของวัสดุ"
      - "ตัวแปรอื่นต้องเหมือนกันทุกจาน และการทดลองต้องปลอดภัย"
    solution: "ควบคุมขนาด ความหนา อุณหภูมิ และเวลาให้เท่ากัน เปลี่ยนเฉพาะ **ชนิดวัสดุ** และทดลองอย่างปลอดภัยในที่อากาศถ่ายเท"
