problems:
  - id: health.disease.illness-symptoms-care.p001
    topics: [health.disease.illness-symptoms-care]
    difficulty: 1
    type: mcq
    stem: "ใบตองรู้สึกตัวร้อน หนาวสั่น และอ่อนเพลีย ใบตองน่าจะมีอาการใด"
    choices:
      - { id: a, text: "มีไข้", correct: true }
      - { id: b, text: "ฟกช้ำ", feedback: "ฟกช้ำเกิดจากการกระแทก ผิวเป็นรอยเขียว ไม่ทำให้ตัวร้อน" }
      - { id: c, text: "ตาแดง", feedback: "ตาแดงเป็นอาการที่ตา ไม่ใช่ตัวร้อนทั้งตัว" }
    hints:
      - "ตัวร้อนกว่าปกติเรียกว่าอะไร"
      - "วัดได้ด้วยเทอร์โมมิเตอร์"
    solution: "ตัวร้อน หนาวสั่น อ่อนเพลีย เป็นอาการของไข้ ควรบอกผู้ใหญ่ให้วัดไข้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.disease.illness-symptoms-care.p002
    topics: [health.disease.illness-symptoms-care]
    difficulty: 1
    type: mcq
    stem: "ระหว่างเรียน ภูมิปวดท้องมาก ภูมิควรทำอย่างไร"
    choices:
      - { id: a, text: "บอกครูทันทีว่าปวดท้อง", correct: true }
      - { id: b, text: "ทนเงียบไว้จนเลิกเรียน", feedback: "การทนเงียบทำให้อาการอาจแย่ลงโดยไม่มีใครช่วย" }
      - { id: c, text: "ขอยาจากเพื่อนมากิน", feedback: "ไม่ควรกินยาเองหรือกินยาของคนอื่น ครูจะพาไปห้องพยาบาล" }
    hints:
      - "ใครอยู่ใกล้และช่วยเราได้ที่โรงเรียน"
      - "เมื่อเจ็บป่วยต้องบอกผู้ใหญ่"
    solution: "บอกครูทันที ครูจะพาไปห้องพยาบาลหรือติดต่อผู้ปกครอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.disease.illness-symptoms-care.p003
    topics: [health.disease.illness-symptoms-care]
    difficulty: 1
    type: text
    stem: "ถ้ามีคนเจ็บป่วยฉุกเฉิน เช่น หายใจลำบากหรือหมดสติ ผู้ใหญ่ควรโทรเบอร์ใด (ตอบเป็นตัวเลข)"
    accepted: ["1669"]
    misconceptions:
      - { match: "199", feedback: "199 ใช้แจ้งไฟไหม้ เจ็บป่วยฉุกเฉินโทร 1669" }
      - { match: "191", feedback: "191 ใช้แจ้งเหตุร้ายกับตำรวจ เจ็บป่วยฉุกเฉินโทร 1669" }
    hints:
      - "เป็นเลขสี่หลัก"
      - "เบอร์ของการแพทย์ฉุกเฉิน"
    solution: "1669 เบอร์การแพทย์ฉุกเฉิน โทรฟรีทั่วประเทศ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.disease.illness-symptoms-care.p004
    topics: [health.disease.illness-symptoms-care]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นการบอกอาการแก่ผู้ใหญ่ได้ครบและชัดเจนที่สุด"
    choices:
      - { id: a, text: "\"หนูปวดหัวตรงขมับตั้งแต่ตื่นนอน ปวดประมาณ 5 และเวียนหัวนิดหน่อยค่ะ\"", correct: true }
      - { id: b, text: "\"หนูไม่สบายค่ะ\"", feedback: "ผู้ใหญ่ไม่รู้ว่าเป็นอะไร ตรงไหน ตั้งแต่เมื่อไร ควรบอกให้ครบ" }
      - { id: c, text: "\"หนูปวดค่ะ\"", feedback: "ยังไม่บอกตำแหน่ง เวลา และความรุนแรง" }
    hints:
      - "บอกอาการให้ครบ 5 ข้อ"
      - "เป็นอะไร ตรงไหน ตั้งแต่เมื่อไร มากแค่ไหน มีอาการอื่นไหม"
    solution: "ข้อ a บอกครบว่าเป็นอะไร (ปวดหัว) ตรงไหน (ขมับ) เมื่อไร (ตั้งแต่ตื่นนอน) มากแค่ไหน (5) และอาการอื่น (เวียนหัว)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.disease.illness-symptoms-care.p005
    topics: [health.disease.illness-symptoms-care]
    difficulty: 2
    type: match
    stem: "จับคู่อาการกับการปฏิบัติตนที่เหมาะสมที่สุด"
    pairs:
      - { left: "ไอ จาม มีน้ำมูก", right: "ใส่หน้ากากอนามัยและปิดปากเวลาไอจาม" }
      - { left: "ถ่ายเหลวหลายครั้ง", right: "จิบผงเกลือแร่ที่ผู้ใหญ่ผสมให้" }
      - { left: "ล้มแล้วหัวเข่าถลอก", right: "ล้างแผลด้วยน้ำสะอาดแล้วบอกผู้ใหญ่" }
      - { left: "ชนโต๊ะแล้วแขนฟกช้ำ", right: "ประคบเย็นด้วยผ้าห่อน้ำแข็ง" }
    hints:
      - "นึกว่าอาการแต่ละอย่างทำให้ร่างกายเสียอะไรหรือแพร่เชื้อทางไหน"
      - "ท้องเสียทำให้เสียน้ำ ส่วนหวัดแพร่ทางละอองไอจาม"
    solution: "หวัด-หน้ากาก, ท้องเสีย-ผงเกลือแร่, แผลถลอก-ล้างแผล, ฟกช้ำ-ประคบเย็น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.disease.illness-symptoms-care.p006
    topics: [health.disease.illness-symptoms-care]
    difficulty: 2
    type: order
    stem: "เลือดกำเดาไหลขณะนั่งเรียน เรียงสิ่งที่ควรทำ"
    items:
      - "นั่งลงและโน้มตัวก้มหน้าไปข้างหน้าเล็กน้อย"
      - "บีบปีกจมูกส่วนนิ่มไว้ และหายใจทางปาก"
      - "บีบต่อเนื่องประมาณ 10–15 นาที"
      - "ถ้าเลือดยังไหลนานกว่า 15 นาที ให้ผู้ใหญ่พาไปพบแพทย์"
    hints:
      - "จัดท่าก่อน แล้วจึงห้ามเลือด"
      - "ไม่เงยหน้า เพราะเลือดจะไหลลงคอ"
    solution: "นั่งก้มหน้า → บีบปีกจมูกและหายใจทางปาก → บีบ 10–15 นาที → ถ้ายังไม่หยุดไปพบแพทย์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.disease.illness-symptoms-care.p007
    topics: [health.disease.illness-symptoms-care]
    difficulty: 2
    type: numeric
    stem: "จากกราฟอุณหภูมิของน้องเก่ง มีกี่ครั้งที่วัดได้ตั้งแต่ 37.5 องศาเซลเซียสขึ้นไป (ตอบเป็นครั้ง)"
    figure:
      src: temperature-chart.svg
      alt: "กราฟเส้นอุณหภูมิร่างกายของน้องเก่ง วัดทางรักแร้ เวลา 06:00 37.0 องศาเซลเซียส 10:00 37.8 14:00 38.6 18:00 38.2 22:00 37.4 มีเส้นประสีแดงที่ 37.5 องศาเซลเซียส"
    answer: { value: 3, unit: ครั้ง }
    misconceptions:
      - { match: 4, feedback: "37.4 ยังน้อยกว่า 37.5 จึงไม่นับ" }
      - { match: 5, feedback: "5 คือจำนวนครั้งที่วัดทั้งหมด ต้องนับเฉพาะจุดที่อยู่บนหรือเหนือเส้นประ" }
    hints:
      - "ดูว่าจุดใดอยู่เหนือเส้นประสีแดง"
      - "เทียบตัวเลขแต่ละจุดกับ 37.5"
    solution: "37.8 38.6 และ 38.2 ตั้งแต่ 37.5 ขึ้นไป รวม 3 ครั้ง ส่วน 37.0 และ 37.4 ต่ำกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.disease.illness-symptoms-care.p008
    topics: [health.disease.illness-symptoms-care]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "หมอบอกว่าแพรเป็นหวัด ข้อใดเป็นการปฏิบัติตนที่ถูกต้อง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "นอนพักให้เพียงพอ", correct: true }
      - { id: b, text: "ดื่มน้ำสะอาดบ่อย ๆ", correct: true }
      - { id: c, text: "ใส่หน้ากากอนามัยและล้างมือบ่อย ๆ", correct: true }
      - { id: d, text: "ใช้แก้วน้ำร่วมกับน้อง", feedback: "การใช้แก้วร่วมกันทำให้เชื้อหวัดแพร่ไปสู่คนอื่น" }
      - { id: e, text: "ออกไปวิ่งเล่นกลางแดดให้เหงื่อออกเพื่อให้หายเร็ว", feedback: "ขณะป่วยควรพักผ่อน การเล่นหนักทำให้อ่อนเพลียมากขึ้น" }
    hints:
      - "ดูแลตัวเองให้หาย และไม่แพร่เชื้อให้คนอื่น"
      - "ข้อที่ถูกมีสามข้อ"
    solution: "พักผ่อน ดื่มน้ำ ใส่หน้ากากและล้างมือ ช่วยให้หายและไม่แพร่เชื้อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.disease.illness-symptoms-care.p009
    topics: [health.disease.illness-symptoms-care]
    difficulty: 3
    type: numeric
    stem: "จากกราฟอุณหภูมิของน้องเก่ง อุณหภูมิสูงสุดกับต่ำสุดของวันต่างกันกี่องศาเซลเซียส (ตอบเป็นองศาเซลเซียส)"
    figure:
      src: temperature-chart.svg
      alt: "กราฟเส้นอุณหภูมิร่างกายของน้องเก่ง วัดทางรักแร้ เวลา 06:00 37.0 องศาเซลเซียส 10:00 37.8 14:00 38.6 18:00 38.2 22:00 37.4 มีเส้นประสีแดงที่ 37.5 องศาเซลเซียส"
    answer: { value: 1.6, tolerance: 0.02, unit: "°C" }
    misconceptions:
      - { match: 1.2, feedback: "1.2 คือ 38.6 − 37.4 แต่ค่าต่ำสุดคือ 37.0 ตอน 06:00" }
      - { match: 0.8, feedback: "0.8 คือ 38.6 − 37.8 ค่าต่ำสุดของวันคือ 37.0" }
    hints:
      - "หาค่าสูงสุดและค่าต่ำสุดจากทั้ง 5 จุด"
      - "นำค่าสูงสุดลบค่าต่ำสุด"
    solution: "สูงสุด 38.6 ต่ำสุด 37.0 ต่างกัน 38.6 − 37.0 = 1.6 องศาเซลเซียส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.disease.illness-symptoms-care.p010
    topics: [health.disease.illness-symptoms-care]
    difficulty: 3
    type: mcq
    stem: "พี่สาวเคยกินยาแก้ไอขวดหนึ่งตอนเป็นหวัด ตอนนี้ต้นไอบ้าง จึงจะหยิบยาขวดนั้นมากินเอง ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "ไม่กินเอง ให้บอกพ่อแม่เพื่อปรึกษาเภสัชกรหรือแพทย์", correct: true }
      - { id: b, text: "กินได้ เพราะเป็นอาการไอเหมือนกัน", feedback: "อาการคล้ายกันอาจเกิดจากสาเหตุต่างกัน และยาอาจหมดอายุหรือขนาดไม่เหมาะกับเรา" }
      - { id: c, text: "กินครึ่งหนึ่งของที่พี่เคยกิน", feedback: "การแบ่งขนาดยาเองไม่ปลอดภัย ขนาดยาต้องให้ผู้ใหญ่ เภสัชกร หรือแพทย์ตัดสิน" }
    hints:
      - "ยาของคนอื่นอาจไม่ถูกกับโรคของเรา"
      - "ใครควรตัดสินเรื่องยาของเด็ก"
    solution: "ไม่กินยาของคนอื่นหรือกินยาเอง ให้ผู้ใหญ่ปรึกษาเภสัชกรหรือแพทย์ และใช้ยาตามฉลากหรือคำสั่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.disease.illness-symptoms-care.p011
    topics: [health.disease.illness-symptoms-care]
    difficulty: 3
    type: mcq
    stem: "หลังกินส้มตำจากรถเข็นริมทาง ฟ้าถ่ายเหลว 3 ครั้ง ปวดท้องเล็กน้อย ยังเดินได้และไม่มีไข้ ข้อใดเป็นการปฏิบัติตนที่เหมาะสม"
    choices:
      - { id: a, text: "บอกผู้ใหญ่ จิบผงเกลือแร่ที่ผสมตามฉลากบ่อย ๆ และพักผ่อน ถ้าอาการไม่ดีขึ้นหรือมีเลือดปนให้ไปพบแพทย์", correct: true }
      - { id: b, text: "งดดื่มน้ำ จะได้ไม่ถ่ายอีก", feedback: "ท้องเสียทำให้ร่างกายเสียน้ำ การงดน้ำทำให้ขาดน้ำมากขึ้น" }
      - { id: c, text: "กินส้มตำร้านเดิมอีกเพื่อให้ร่างกายชิน", feedback: "อาหารที่ไม่สะอาดทำให้ท้องเสียซ้ำ ไม่ได้ทำให้ร่างกายชิน" }
    hints:
      - "ท้องเสียทำให้ร่างกายเสียอะไร"
      - "ผงเกลือแร่ช่วยทดแทนน้ำและเกลือแร่"
    solution: "บอกผู้ใหญ่ ดื่มผงเกลือแร่ที่ผสมถูกสัดส่วนทีละน้อยบ่อย ๆ และพักผ่อน ถ้าอาเจียนมาก ถ่ายเป็นน้ำมาก มีไข้สูง หรืออ่อนเพลียมากต้องไปพบแพทย์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.disease.illness-symptoms-care.p012
    topics: [health.disease.illness-symptoms-care]
    difficulty: 3
    type: numeric
    stem: "หมอสั่งยาให้น้ำหวาน ฉลากเขียนว่า \"กินครั้งละ 1 ช้อนชา วันละ 3 ครั้ง หลังอาหารเช้า กลางวัน เย็น กินติดต่อกัน 5 วัน\" น้ำหวานต้องกินยาทั้งหมดกี่ครั้ง (ตอบเป็นครั้ง)"
    answer: { value: 15, unit: ครั้ง }
    misconceptions:
      - { match: 8, feedback: "นำ 3 + 5 ไม่ถูก ต้องคูณจำนวนครั้งต่อวันกับจำนวนวัน" }
      - { match: 3, feedback: "3 คือจำนวนครั้งใน 1 วัน ต้องกิน 5 วัน" }
    hints:
      - "1 วันกินกี่ครั้ง"
      - "คูณด้วยจำนวนวัน"
    solution: "3 ครั้งต่อวัน × 5 วัน = 15 ครั้ง (ทำตามที่หมอสั่ง ไม่หยุดเองเมื่อรู้สึกดีขึ้นโดยไม่ถามหมอหรือเภสัชกร)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.disease.illness-symptoms-care.p013
    topics: [health.disease.illness-symptoms-care]
    difficulty: 3
    type: mcq
    stem: "ปั่นจักรยานล้มในซอยหน้าบ้าน หัวเข่าถลอก มีเศษดินติดแผลและเลือดซึมเล็กน้อย ควรทำอย่างไรก่อน"
    choices:
      - { id: a, text: "ล้างแผลด้วยน้ำสะอาดให้เศษดินออก แล้วบอกผู้ใหญ่ให้ช่วยดูแลต่อ", correct: true }
      - { id: b, text: "ใช้ใบไม้หรือยาสีฟันทาแผล", feedback: "สิ่งเหล่านี้ไม่สะอาดหรือไม่ใช่ยาใส่แผล อาจทำให้แผลติดเชื้อ" }
      - { id: c, text: "ปล่อยไว้ไม่ต้องทำอะไร เดี๋ยวก็หาย", feedback: "เศษดินในแผลทำให้ติดเชื้อได้ ต้องล้างให้สะอาด" }
    hints:
      - "แผลสกปรกเสี่ยงติดเชื้อ"
      - "ขั้นแรกคือทำความสะอาดแผล"
    solution: "ล้างแผลด้วยน้ำสะอาดไหลผ่านให้เศษดินออก แล้วให้ผู้ใหญ่ดูแลต่อ ถ้าแผลลึก เลือดไม่หยุด หรือบวมแดงเป็นหนองในวันต่อมา ต้องไปพบแพทย์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.disease.illness-symptoms-care.p014
    topics: [health.disease.illness-symptoms-care]
    difficulty: 4
    type: mcq
    multiple: true
