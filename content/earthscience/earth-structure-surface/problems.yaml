  - id: earthscience.geology.earth-structure-surface.p013
    topics: [earthscience.geology.earth-structure-surface]
    difficulty: 4
    type: numeric
    stem: "นักธรณีวิทยาขุดดินที่ราบลุ่มแห่งหนึ่ง พบตะกอนแม่น้ำหนา 1.5 m ที่สะสมตัวในเวลา 500 ปี (ข้อมูลสมมติ) อัตราการสะสมตัวเฉลี่ยกี่มิลลิเมตรต่อปี"
    answer: { value: 3, tolerance: 0.05, unit: mm/ปี }
    misconceptions:
      - { match: 0.003, feedback: "0.003 คือเมตรต่อปี ต้องแปลงเป็นมิลลิเมตรต่อปีโดยคูณ 1,000" }
      - { match: 333.3, feedback: "นำเวลาหารด้วยความหนา อัตราต้องเป็นความหนาหารด้วยเวลา" }
    hints:
