id: earthscience.atmosphere.air-wind
subject: earthscience
title: { th: อากาศและลม, en: "Air and wind" }
summary: ส่วนประกอบและความสำคัญของอากาศ มลพิษทางอากาศและฝุ่น PM2.5 วิธีช่วยลดมลพิษ ลมเกิดจากอากาศร้อนและเย็น การดูแรงลมด้วยถุงลม และประโยชน์กับโทษของลม
difficulty: 1.2
minutes: 25
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ส่วนประกอบของอากาศ
    src: air-parts.svg
    alt: "ตาราง 100 ช่อง สีฟ้า 78 ช่องคือไนโตรเจน สีแดง 21 ช่องคือออกซิเจน สีเทา 1 ช่องคือแก๊สอื่น ๆ เช่น อาร์กอน ข้อความว่า คาร์บอนไดออกไซด์มีน้อยมาก ไม่ถึง 1 ช่อง (ไม่นับไอน้ำ)"
    caption: "อากาศแห้ง 100 ส่วน มีไนโตรเจนมากที่สุด (วาดโดยทีมคลังรู้)"
  - { type: check, problem: earthscience.atmosphere.air-wind.p004, prompt: "นับช่องสีฟ้า" }
  - type: figure
    title: ลมเกิดจากอากาศร้อนและอากาศเย็น
    src: wind-forms.svg
    alt: "พื้นด้านซ้ายเป็นลานคอนกรีตกลางแดด ร้อน พื้นด้านขวาเป็นใต้ร่มไม้ เย็นกว่า ลูกศรสีแดงชี้ขึ้นเหนือลานคอนกรีต อากาศร้อนลอยขึ้น ลูกศรด้านบนชี้ไปทางขวา ลูกศรสีน้ำเงินชี้ลงที่ร่มไม้ อากาศเย็นจมลง ลูกศรสีน้ำเงินใหญ่ใกล้พื้นชี้จากร่มไม้ไปลานคอนกรีต เขียนว่า ลม อากาศเย็นเคลื่อนเข้าแทนที่"
    caption: "ลมใกล้พื้นพัดจากที่เย็นไปหาที่ร้อน (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: worked-example
    title: ลมในสนามโรงเรียนพัดไปทางไหน
    problem: "ตอนเที่ยง ลานคอนกรีตกลางสนามโดนแดดจนร้อน ส่วนสวนต้นไม้ข้างอาคารมีร่มเงาและเย็น ลมใกล้พื้นน่าจะพัดจากที่ไหนไปที่ไหน"
    steps:
      - text: "หาที่ร้อน ลานคอนกรีตกลางแดดร้อนกว่า อากาศเหนือลานจึงร้อนขึ้น"
      - text: "อากาศร้อนเบากว่า จึงลอยสูงขึ้น"
        why: "เหมือนควันธูปที่ลอยขึ้นเหนือเปลวเทียน"
      - text: "อากาศเย็นจากสวนต้นไม้เคลื่อนเข้าไปแทนที่ อากาศที่เคลื่อนที่นี้คือลม"
    answer: "ลมใกล้พื้นพัดจากสวนต้นไม้ที่เย็นไปหาลานคอนกรีตที่ร้อน"
  - { type: check, problem: earthscience.atmosphere.air-wind.p015, prompt: "ที่ไหนร้อนกว่า อากาศที่นั่นจะลอยขึ้น" }
  - type: figure
    title: ถุงลมบอกแรงและทิศของลม
    src: windsock.svg
    alt: "ถุงลมลายส้มสลับขาวสามอัน อันแรกห้อยลงแนบเสา เขียนว่า ลมสงบ ถุงลมห้อยลง อันที่สองยกขึ้นเอียงประมาณครึ่งทาง เขียนว่า ลมอ่อน ถุงลมยกขึ้นครึ่งหนึ่ง อันที่สามพองตั้งตรงขนานพื้น เขียนว่า ลมแรง ถุงลมพองตั้งตรง ลูกศรด้านบนบอกว่าลมพัดไปทางขวา ถุงลมชี้ไปทางเดียวกับลม"
    caption: "ปลายถุงลมชี้ไปทางที่ลมพัดไป (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: อ่านถุงลม
    problem: "ถุงลมที่สนามบินยกขึ้นประมาณครึ่งหนึ่ง และปลายถุงชี้ไปทางทิศเหนือ ลมแรงแค่ไหน และพัดมาจากทิศใด"
    steps:
      - text: "ดูความพอง ถุงลมยกขึ้นเพียงครึ่งหนึ่ง แปลว่าลมอ่อน"
      - text: "ดูทิศ ปลายถุงชี้ไปทางที่ลมพัดไป ลมจึงพัดไปทางทิศเหนือ"
      - text: "ลมพัดมาจากทิศตรงข้าม คือทิศใต้"
        why: "ทิศเหนือกับทิศใต้อยู่ตรงข้ามกัน"
    answer: "ลมอ่อน พัดมาจากทิศใต้"
  - { type: check, problem: earthscience.atmosphere.air-wind.p013, prompt: "ทิศที่ลมพัดมาอยู่ตรงข้ามกับทิศที่ถุงลมชี้" }
glossary:
  - { term: อากาศ, definition: "ของผสมของแก๊สที่ห่อหุ้มโลก มีไนโตรเจนมากที่สุด รองลงมาคือออกซิเจน" }
  - { term: มลพิษทางอากาศ, definition: "สภาพที่อากาศมีสิ่งที่เป็นอันตรายปนอยู่มาก เช่น ฝุ่น ควัน และแก๊สพิษ" }
  - { term: ฝุ่น PM2.5, definition: "ฝุ่นละอองขนาดเล็กมาก มองไม่เห็นทีละเม็ด เข้าไปในปอดได้ลึก" }
  - { term: ลม, definition: "อากาศที่เคลื่อนที่ เกิดเมื่อที่สองแห่งร้อนไม่เท่ากัน" }
  - { term: ถุงลม, definition: "ถุงผ้ารูปกรวยบนเสา ใช้ดูแรงลมและทิศของลม พบที่สนามบิน" }
flashcards:
  - { front: "อากาศมีแก๊สใดมากที่สุด", back: "ไนโตรเจน ประมาณ 78 ส่วนใน 100 ส่วน (ออกซิเจนประมาณ 21 ส่วน)" }
  - { front: "ลมเกิดได้อย่างไร", back: "อากาศร้อนลอยขึ้น อากาศเย็นเคลื่อนเข้าแทนที่ อากาศที่เคลื่อนที่คือลม" }
  - { front: "ฝุ่น PM2.5 มาจากไหน", back: "การเผาขยะ เผาไร่ เผาป่า ควันรถ และควันโรงงาน" }
  - { front: "ถุงลมพองตั้งตรงแปลว่าอะไร", back: "ลมแรง ปลายถุงชี้ไปทางที่ลมพัดไป" }
