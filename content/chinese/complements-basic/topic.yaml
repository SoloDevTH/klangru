id: chinese.grammar.complements-basic
subject: chinese
title: { th: "ส่วนเติมเต็มผลลัพธ์ ทิศทาง และ 得", en: "Result and direction complements, and complements with 得" }
summary: ส่วนเติมเต็มหลังกริยาบอกผล (看懂 做完) ทิศทาง (进来 跑出去) ระดับด้วย 得 (跑得很快) และความเป็นไปได้ (看得懂 听不懂) พร้อมรูปปฏิเสธและตำแหน่งกรรม
difficulty: 4.5
minutes: 40
prerequisites: [chinese.grammar.guo-zhe-shi-de]
encompasses:
  - { id: chinese.grammar.guo-zhe-shi-de, weight: 0.2 }
  - { id: chinese.grammar.negation-le, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: complement-types.svg
    alt: "ผังส่วนเติมเต็ม 4 แบบที่วางหลังกริยา ผลลัพธ์ (กริยา + ผล): 看懂 写错 做完 ปฏิเสธ 没看懂 · ทิศทาง (กริยา + ทิศ + 来/去): 走进来 跑出去 站起来 来 เข้าหาผู้พูด 去 ออกจากผู้พูด · ระดับ/สภาพ (กริยา + 得 + คุณศัพท์): 跑得很快 说得很好 ปฏิเสธ 跑得不快 · ความเป็นไปได้ (กริยา + 得/不 + ผล): 看得懂 听不懂 买不到 ทำได้/ทำไม่ได้"
    caption: "ส่วนเติมเต็มทุกแบบอยู่หลังกริยา"
  - type: figure
    src: direction-arrows.svg
    alt: "ภาพซ้าย: ผู้พูดอยู่ในห้อง ลูกศรเข้าห้องเขียน 进来 ลูกศรออกจากห้องเขียน 出去 ใต้ภาพเขียนว่า ถ้าผู้พูดอยู่นอกห้อง สลับเป็น 进去/出来 ภาพขวา: บันไดระหว่าง 楼下 ชั้นล่าง กับ 楼上 ชั้นบน ผู้พูดอยู่ชั้นบน ลูกศรขึ้นบันไดเขียน 上来 ลูกศรลงบันไดเขียน 下去 ข้อความล่าง: ทิศย่อย 上 下 进 出 回 过 起 + 来/去 วางหลังกริยาได้ เช่น 走进来 跑出去 站起来"
    caption: "来 เข้าหาผู้พูด 去 ออกห่างจากผู้พูด"
  - { type: check, problem: chinese.grammar.complements-basic.p003, prompt: "ปฏิเสธผลใช้ 不 หรือ 没" }
  - type: worked-example
    title: บอกระดับเมื่อมีกรรม
    problem: "แปล \"พี่สาวทำอาหารอร่อยมาก\" (做饭 zuò fàn = ทำอาหาร, 好吃 = อร่อย)"
    steps:
      - text: "โครงพื้นฐาน: ประธาน + กริยา + 得 + คำบอกระดับ → 姐姐做得很好吃"
      - text: "มีกรรม 饭 ด้วย จึงซ้ำกริยา: 姐姐做饭做得很好吃。"
        why: "กริยาตัวเดียวรับทั้งกรรมและ 得 ไม่ได้ จึงต้องซ้ำกริยาหรือยกกรรมขึ้นหน้า"
      - text: "หรือยกกรรมขึ้นหน้า: 姐姐的饭做得很好吃。"
    answer: "姐姐做饭做得很好吃。"
  - type: worked-example
    title: เลือก 没看懂 หรือ 看不懂
    problem: "(ก) เมื่อวานอ่านข่าวภาษาจีนข่าวหนึ่ง แต่ไม่เข้าใจ (ข) เด็กเล็กยังอ่านหนังสือพิมพ์จีนไม่ออก (报纸 bàozhǐ = หนังสือพิมพ์)"
    steps:
      - text: "(ก) เป็นผลของเหตุการณ์ครั้งหนึ่งในอดีต ใช้ 没 + กริยา + ผล: 昨天那个新闻我没看懂。 (新闻 xīnwén = ข่าว)"
      - text: "(ข) เป็นเรื่องความสามารถ ใช้รูปความเป็นไปได้: 小孩子看不懂中文报纸。"
        why: "看不懂 = ไม่มีความสามารถจะอ่านเข้าใจ ส่วน 没看懂 = อ่านแล้วแต่ครั้งนั้นไม่เข้าใจ"
    answer: "(ก) 我没看懂。 (ข) 小孩子看不懂中文报纸。"
  - { type: check, problem: chinese.grammar.complements-basic.p006, prompt: "来 หรือ 去 ดูจากผู้พูด" }
glossary:
  - { term: "补语 bǔyǔ", definition: "ส่วนเติมเต็ม คำที่ตามหลังกริยาบอกผล ทิศทาง ระดับ หรือความเป็นไปได้" }
  - { term: "看懂 / 写错 / 做完 / 找到", definition: "อ่านเข้าใจ / เขียนผิด / ทำเสร็จ / หาเจอ ปฏิเสธด้วย 没" }
  - { term: "来 lái / 去 qù (ทิศทาง)", definition: "เข้าหาผู้พูด / ออกห่างจากผู้พูด เช่น 进来 出去 上来 下去" }
  - { term: "得 de (ระดับ)", definition: "กริยา + 得 + คุณศัพท์ เช่น 跑得很快 ถ้ามีกรรมให้ซ้ำกริยา" }
  - { term: "看得懂 / 看不懂", definition: "อ่านออก / อ่านไม่ออก (รูปความเป็นไปได้)" }
flashcards:
  - { front: "ฉันฟังไม่เข้าใจ (ครั้งนั้น) / ฉันฟังไม่ออก", back: "我没听懂。 / 我听不懂。" }
  - { front: "เขาเดินเข้ามา (ผู้พูดอยู่ข้างใน)", back: "他走进来了。" }
  - { front: "เขาพูดภาษาจีนเก่ง", back: "他说汉语说得很好。 / 他汉语说得很好。" }
  - { front: "หาซื้อไม่ได้", back: "买不到 mǎi bu dào" }
  - { front: "กลับบ้านไป (มีสถานที่)", back: "回家去 (สถานที่อยู่ก่อน 来/去)" }
