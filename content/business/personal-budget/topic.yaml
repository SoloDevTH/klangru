id: business.econ.personal-budget
subject: business
title: { th: รายรับรายจ่ายส่วนตัว งบประมาณ และการออม, en: "Personal income and spending, budgeting and saving" }
summary: ที่มาของรายรับรายจ่ายของตนเองและครอบครัว การบันทึกและวิเคราะห์การใช้จ่าย การทำงบประมาณแบบออมก่อนใช้ และการตั้งเป้าหมายการออมระยะสั้นและระยะยาว
difficulty: 2
minutes: 30
prerequisites: [business.econ.scarcity-choice, math.number.decimals]
encompasses:
  - { id: math.number.decimals, weight: 0.2 }
  - { id: business.econ.scarcity-choice, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: record-book.svg
    alt: "ตารางบัญชีรายรับรายจ่ายของน้องมิว ห้าคอลัมน์ วันที่ รายการ รายรับ รายจ่าย คงเหลือ วันจันทร์ได้ค่าขนมทั้งสัปดาห์ 250 คงเหลือ 250 วันจันทร์ข้าวกลางวัน จ่าย 30 คงเหลือ 220 วันอังคารขนม จ่าย 15 คงเหลือ 205 วันพุธปากกา จ่าย 12 คงเหลือ 193 วันพฤหัสบดีช่วยยายเก็บผักขาย รับ 40 คงเหลือ 233 วันศุกร์ชานมไข่มุก จ่าย 35 คงเหลือ 198"
    caption: "บันทึกรายรับรายจ่ายหนึ่งสัปดาห์"
  - { type: check, problem: business.econ.personal-budget.p004, prompt: "ลองหาเงินคงเหลือ" }
  - type: worked-example
    title: ทำงบประมาณแบบออมก่อนใช้
    problem: "พี่ฝนเรียน ม.2 ได้เงินจากพ่อแม่เดือนละ $1{,}500$ บาท และได้ค่าช่วยร้านป้าวันเสาร์อีกเดือนละ $400$ บาท เธออยากเก็บเงินซื้อจักรยานมือสองราคา $2{,}400$ บาทภายใน $6$ เดือน รายจ่ายจำเป็น (ข้าวกลางวันและค่ารถ) เดือนละ $1{,}200$ บาท เธอเหลือเงินใช้กับสิ่งที่อยากได้เดือนละเท่าไร"
    steps:
      - text: "รายรับต่อเดือน $= 1{,}500 + 400 = 1{,}900$ บาท"
      - text: "เงินออมต่อเดือนตามเป้า $= 2{,}400 \\div 6 = 400$ บาท"
        why: "แบ่งเป้าใหญ่เป็นเป้ารายเดือน จะรู้ว่าต้องกันเงินไว้เท่าไรทุกเดือน"
      - text: "ออมก่อนใช้: เงินที่ใช้จ่ายได้ $= 1{,}900 - 400 = 1{,}500$ บาท"
      - text: "หักรายจ่ายจำเป็น: $1{,}500 - 1{,}200 = 300$ บาท เป็นงบสำหรับสิ่งที่อยากได้"
        why: "จ่ายสิ่งจำเป็นก่อนสิ่งที่อยากได้เสมอ"
      - text: "ตรวจ: $400 + 1{,}200 + 300 = 1{,}900$ บาท เท่ากับรายรับพอดี"
    answer: "ออมเดือนละ $400$ บาท ใช้กับสิ่งจำเป็น $1{,}200$ บาท เหลือใช้กับสิ่งที่อยากได้เดือนละ $300$ บาท"
  - type: figure
    src: family-budget.svg
    alt: "แผนภูมิแท่งแนวนอนงบประมาณรายเดือนของครอบครัวที่มีรายได้ 25,000 บาท ค่าอาหาร 7,500 บาท 30% ค่าบ้าน ค่าน้ำ ค่าไฟ 5,000 บาท 20% ค่าเดินทาง 3,000 บาท 12% ค่าเรียนของลูก 2,500 บาท 10% ของใช้และอื่น ๆ 2,000 บาท 8% เงินออม 5,000 บาท 20% ด้านล่างเขียนว่า ออมก่อนใช้ รายได้ลบเงินออมเท่ากับเงินที่ใช้จ่ายได้ 25,000 ลบ 5,000 เท่ากับ 20,000 บาท"
    caption: "งบประมาณของครอบครัวที่กันเงินออมไว้ก่อน"
  - { type: check, problem: business.econ.personal-budget.p009, prompt: "ออมก่อนแล้วเหลือใช้เท่าไร" }
glossary:
  - { term: รายรับ, definition: "เงินที่ได้รับเข้ามา เช่น ค่าขนม เงินเดือน ค่าจ้าง เงินจากการขายของ" }
  - { term: รายจ่าย, definition: "เงินที่จ่ายออกไป แบ่งเป็นรายจ่ายที่จำเป็นและไม่จำเป็น" }
  - { term: บัญชีรายรับรายจ่าย, definition: "ตารางบันทึกวันที่ รายการ รายรับ รายจ่าย และเงินคงเหลือ" }
  - { term: งบประมาณ, definition: "แผนการใช้เงินที่ทำไว้ล่วงหน้า บอกว่าจะได้เงินเท่าไรและจะแบ่งใช้อย่างไร" }
  - { term: การออม, definition: "การกันรายรับบางส่วนไว้ไม่ใช้ในตอนนี้ เพื่อใช้ในอนาคตหรือยามจำเป็น" }
  - { term: เป้าหมายการออม, definition: "จำนวนเงินที่ต้องการออม เพื่ออะไร และภายในเมื่อไร แบ่งเป็นระยะสั้นและระยะยาว" }
flashcards:
  - { front: "ออมก่อนใช้", back: "รายรับ − เงินออม = เงินที่ใช้จ่ายได้" }
  - { front: "เงินคงเหลือในบัญชีรายรับรายจ่าย", back: "คงเหลือเดิม + รายรับ หรือ คงเหลือเดิม − รายจ่าย" }
  - { front: "เป้าหมายการออมที่ดีต้องบอกอะไร", back: "ออมเพื่ออะไร จำนวนเท่าไร และภายในเมื่อไร" }
  - { front: "ผลดีของการออม", back: "มีเงินสำรองยามฉุกเฉิน ได้ของที่ต้องการ ไม่ต้องเป็นหนี้" }
