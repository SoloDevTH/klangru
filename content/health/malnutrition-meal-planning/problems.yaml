- id: health.nutrition.malnutrition-meal-planning.p015
  topics:
  - health.nutrition.malnutrition-meal-planning
  difficulty: 5
  type: mcq
  stem: จากตารางรายการอาหารของภูมิ (ระดับ 1,600 กิโลแคลอรี) ข้อใดเป็นการปรับปรุงที่เหมาะสมที่สุด
  figure: *id001
  choices:
  - id: a
    text: เพิ่มผลไม้ เช่น ฝรั่งหรือมะละกอ เพิ่มผักในมื้อกลางวัน และลดน้ำมันโดยเปลี่ยนไข่ดาวเป็นไข่ต้ม เพราะทั้งวันไม่มีผลไม้และได้พลังงานเกินเล็กน้อย
    correct: true
  - id: b
    text: ตัดมื้อเช้าออกเพื่อลดพลังงาน
    feedback: การข้ามมื้อเช้าไม่เหมาะกับเด็กวัยเรียน และไม่ได้แก้ปัญหาการขาดผลไม้
  - id: c
    text: เพิ่มนมอีก 2 กล่องโดยไม่ปรับอย่างอื่น
    feedback: เด็กวัยเรียนควรดื่มนมวันละ 2 แก้ว การเพิ่ม 2 กล่องโดยไม่ปรับทำให้พลังงานเกินมากขึ้นและยังไม่มีผลไม้
  hints:
  - ตรวจว่าครบ 5 หมู่หรือไม่ หมู่ใดหายไป
  - พลังงานรวม 1,754 เทียบกับ 1,600
  solution: รายการนี้ไม่มีผลไม้ ผักมีแค่มื้อเย็น และได้พลังงานเกิน 154 กิโลแคลอรีส่วนใหญ่จากไขมันมื้อกลางวัน การเพิ่มผักผลไม้และลดน้ำมันจึงแก้ตรงจุด สำหรับนม เด็กวัยเรียนควรได้วันละ 2 แก้ว จึงอาจเพิ่มนมอีก 1 กล่องแทนขนมได้
