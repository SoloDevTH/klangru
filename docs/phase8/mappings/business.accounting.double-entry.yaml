  - { framework: th-tqf-accounting, indicators: ["8.1.1"], coverage: partial, note: "หลักการบัญชีส่วนการบันทึกรายการค้า: ผังบัญชี เดบิตเครดิต สมุดรายวันทั่วไป บัญชีแยกประเภท งบทดลอง และข้อผิดพลาดที่งบทดลองหาไม่พบ ยังไม่มีมาตรฐานการรายงาน งบการเงิน (อยู่ใน business.accounting.financial-statements) งบการเงินรวม และการเปิดเผยข้อมูล" }
