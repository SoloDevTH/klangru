      - "หน่วยขนส่งคือการรวมหลายชิ้นเป็นหน่วยเดียวเพื่อให้ขนถ่ายได้สะดวก"
    solution: "พาเลทที่มีขนาดเข้ากับพื้นที่ภายในตู้หรือรถบรรทุกช่วยลดช่องว่าง ได้จำนวนหน่วยต่อเที่ยวมากขึ้น และลดการจับต้องสินค้าทีละชิ้น"
