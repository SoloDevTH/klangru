    answer: { value: 25, unit: "%" }
    hints:
      - "ร้อยละที่ลด = (ค่าเดิม − ค่าใหม่) ÷ ค่าเดิม × 100"
      - "ตัวหารคือค่าเดิม 48"
    misconceptions:
      - { match: 33.33, feedback: "หารด้วยค่าใหม่ (36) ต้องหารด้วยค่าเดิม" }
      - { match: 12, feedback: "นั่นคือจำนวนวันที่ลดลง ยังไม่ได้คิดเป็นร้อยละ" }
    solution: "$(48 - 36) \\div 48 \\times 100 = 25\\%$ (ผลนี้ยังเป็นก่อนกับหลัง ควรดูสภาพอากาศของปีนั้นและเทียบกับจังหวัดใกล้เคียงด้วย)"
