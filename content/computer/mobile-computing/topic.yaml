id: computer.systems.mobile-computing
subject: computer
title: { th: เครือข่ายเคลื่อนที่และแพลตฟอร์มแอปบนมือถือ, en: "Mobile networks and mobile app platforms" }
summary: เครือข่ายเซลลูลาร์และการส่งต่อระหว่างเซลล์ การเปลี่ยนเครือข่ายกับที่อยู่ IP แพลตฟอร์มแอปและข้อจำกัดของมือถือ วงจรชีวิตของแอป สิทธิ์การเข้าถึง การทำงานออฟไลน์ และเรื่องที่ต้องคิดทุกแพลตฟอร์ม
difficulty: 5
minutes: 40
prerequisites: [computer.networks.performance, computer.projects.app-development]
encompasses:
  - { id: computer.networks.performance, weight: 0.3 }
  - { id: computer.projects.app-development, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: handover.svg
    alt: "วงกลมสองวงซ้อนทับกันบางส่วน วงซ้ายชื่อเซลล์ A มีสถานีฐาน A ตรงกลาง วงขวาชื่อเซลล์ B มีสถานีฐาน B ตรงกลาง ตรงกลางพื้นที่ซ้อนทับมีรูปโทรศัพท์และลูกศรชี้ไปทางขวาแสดงทิศทางการเคลื่อนที่"
    caption: "เซลล์ที่ซ้อนทับกันทำให้เครือข่ายส่งต่อการเชื่อมต่อได้ขณะอุปกรณ์เคลื่อนที่"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: ประมาณค่าใช้ข้อมูลของแอปตลอดเดือน
    problem: "แอปสั่งอาหารโหลดข้อมูล 3 MB ทุกครั้งที่เปิดแอป ผู้ใช้เปิดแอป 20 ครั้งต่อวัน เดือนหนึ่งมี 31 วัน แอปนี้ใช้ข้อมูลรวมประมาณกี่ MB และคิดเป็นกี่ GB (ค่าสมมติ; 1 GB = 1,000 MB)"
    steps:
      - text: "จำนวนครั้งที่เปิดแอปทั้งเดือน = 20 × 31 = 620 ครั้ง"
      - text: "ข้อมูลรวม = 620 × 3 = 1,860 MB"
        why: "ต้องคูณทั้งจำนวนครั้งและขนาดต่อครั้ง ไม่ใช่คูณแค่จำนวนวันหรือแค่ขนาด"
      - text: "แปลงเป็น GB = 1,860 ÷ 1,000 = 1.86 GB"
        why: "การประมาณค่าใช้จ่ายข้อมูลมักต้องเทียบกับโควตาของแพ็กเกจในหน่วย GB"
    answer: "แอปใช้ข้อมูลประมาณ 1,860 MB หรือ 1.86 GB ต่อเดือน ควรตรวจกับโควตาของแพ็กเกจก่อนตัดสินใจ"
  - { type: check, problem: computer.systems.mobile-computing.p004, prompt: "ทำไมการเปลี่ยนเครือข่ายจึงทำให้การเชื่อมต่อขาดได้" }
  - type: worked-example
    title: แอปที่ถูกพักกลางคันควรคืนสถานะอย่างไร
    problem: "ผู้ใช้กรอกที่อยู่จัดส่งอาหารครึ่งหนึ่งแล้วสลับไปตอบข้อความ ระบบพักแอปไว้ ต่อมาผู้ใช้กลับมาเปิดแอป แอปควรทำอย่างไร"
    steps:
      - text: "ก่อนแอปถูกพัก ให้บันทึกข้อความที่กรอกค้างไว้ในที่เก็บข้อมูลของแอป"
        why: "เมื่อแอปถูกพักหรือถูกปิด หน่วยความจำที่ไม่ได้บันทึกอาจหายไป"
      - text: "เมื่อผู้ใช้กลับมา แอปอ่านสถานะที่บันทึกไว้และแสดงฟอร์มพร้อมข้อความเดิม"
      - text: "ถ้าการเชื่อมต่อยังไม่พร้อม แอปแสดงสถานะรอและทำงานต่อเมื่อพร้อม โดยไม่ให้ผู้ใช้ต้องกรอกใหม่"
        why: "การรอและคืนสถานะช่วยให้ผู้ใช้ไม่ต้องเริ่มงานใหม่แม้สัญญาณจะขาดช่วง"
    answer: "บันทึกสถานะไว้ก่อนแอปถูกพัก แล้วคืนสถานะเมื่อกลับมา ผู้ใช้จึงทำงานต่อจากจุดเดิมได้"
  - { type: check, problem: computer.systems.mobile-computing.p010, prompt: "การประหยัดแบตเตอรี่ทำได้อย่างไรโดยยังให้บริการเต็มที่" }
glossary:
  - { term: เซลล์ (cell), definition: "พื้นที่หนึ่งในเครือข่ายเซลลูลาร์ที่สถานีฐานหนึ่งดูแลการเชื่อมต่อ" }
  - { term: สถานีฐาน (base station), definition: "อุปกรณ์ที่รับส่งสัญญาณไร้สายกับอุปกรณ์เคลื่อนที่ในเซลล์ของตน และเชื่อมต่อกับเครือข่ายหลัก" }
  - { term: การส่งต่อ (handover), definition: "การย้ายการเชื่อมต่อของอุปกรณ์ไปยังเซลล์หรือสถานีฐานอื่นขณะเคลื่อนที่โดยไม่ตัดการเชื่อมต่อ" }
  - { term: แอปเนทีฟ (native app), definition: "แอปที่เขียนสำหรับระบบปฏิบัติการใดระบบปฏิบัติการหนึ่งโดยเฉพาะ" }
  - { term: ซิงก์ (sync), definition: "การทำให้ข้อมูลในเครื่องและบนเซิร์ฟเวอร์ตรงกันเมื่อกลับมาเชื่อมต่อ รวมถึงการแก้ความขัดแย้งของค่า" }
flashcards:
  - { front: "handover คืออะไร", back: "การย้ายการเชื่อมต่อระหว่างเซลล์เมื่ออุปกรณ์เคลื่อนที่ โดยพยายามให้ผู้ใช้ไม่รู้สึกว่าขาด" }
  - { front: "ทำไมเปลี่ยนจาก Wi-Fi ไปมือถือแล้วการเชื่อมต่อบางอย่างขาด", back: "อุปกรณ์ได้ที่อยู่ IP ใหม่จากเครือข่ายใหม่ การเชื่อมต่อเดิมที่ผูกกับที่อยู่เดิมจึงอาจขาด" }
  - { front: "แอปเนทีฟต่างจากเว็บแอปอย่างไร", back: "แอปเนทีฟติดตั้งและเขียนสำหรับระบบปฏิบัติการหนึ่ง ส่วนเว็บแอปทำงานผ่านเบราว์เซอร์" }
  - { front: "ทำไมต้องขอสิทธิ์เข้าถึงให้น้อยที่สุด", back: "เพื่อให้เข้าถึงเฉพาะข้อมูลที่งานต้องใช้ ลดความเสี่ยงและเคารพความเป็นส่วนตัวของผู้ใช้" }
