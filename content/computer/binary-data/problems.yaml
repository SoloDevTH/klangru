problems:
  - id: com.bin.p001
    topics: [computer.data.binary]
    difficulty: 1
    type: mcq
    stem: "บิต (bit) หนึ่งบิตมีค่าที่เป็นไปได้กี่แบบ"
    choices:
      - { id: a, text: "2 แบบ คือ 0 หรือ 1", correct: true }
      - { id: b, text: "1 แบบ", feedback: "บิตไม่ได้มีค่าเดียวตายตัว มันเปลี่ยนได้ระหว่าง 0 กับ 1 จึงมี 2 แบบ" }
      - { id: c, text: "8 แบบ", feedback: "8 คือจำนวนบิตใน 1 ไบต์ ไม่ใช่จำนวนค่าของบิตเดียว" }
      - { id: d, text: "10 แบบ คือ 0 ถึง 9", feedback: "0 ถึง 9 คือเลขโดดของฐานสิบ เลขฐานสองมีเลขโดดแค่ 0 กับ 1" }
    hints:
      - "คำว่า bit ย่อมาจาก binary digit (เลขโดดฐานสอง)"
      - "เลขฐานสองมีเลขโดดกี่ตัว"
    solution: "บิตเป็นเลขโดดของฐานสอง มีได้ 2 ค่าคือ 0 กับ 1 (เหมือนสวิตช์ที่ปิดหรือเปิด)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.bin.p002
    topics: [computer.data.binary]
    difficulty: 1
    type: numeric
    stem: "บิต 3 บิตเรียงกัน เช่น 000, 001, … สร้างรูปแบบที่ต่างกันได้ทั้งหมดกี่แบบ (ตอบเป็นจำนวนแบบ)"
    answer: { value: 8, unit: แบบ }
    hints:
      - "ลองเขียนทุกแบบออกมา เริ่มจาก 000 แล้วนับขึ้นไปทีละหนึ่งในฐานสอง"
      - "บิตแต่ละตัวมี 2 ทางเลือก เมื่อมีหลายบิตให้คูณจำนวนทางเลือกกัน"
    misconceptions:
      - { match: 6, feedback: "นั่นคือ $2 \\times 3$ ทางเลือกของแต่ละบิตต้องคูณกัน ($2 \\times 2 \\times 2$) ไม่ใช่คูณ 2 ด้วยจำนวนบิต" }
      - { match: 7, feedback: "7 คือค่ามากที่สุด ($111_2$) แต่ยังมีแบบ 000 ที่มีค่าเป็นศูนย์อีกแบบ จำนวนแบบจึงมากกว่าค่ามากสุดอยู่ 1" }
      - { match: 9, feedback: "นั่นคือ $3^2$ ต้องเป็น 2 (ทางเลือกต่อบิต) ยกกำลัง 3 (จำนวนบิต) คือ $2^3$" }
    solution: "แต่ละบิตเป็น 0 หรือ 1 ได้ 2 แบบ สามบิตจึงได้ $2 \\times 2 \\times 2 = 2^3 = 8$ แบบ คือ 000, 001, 010, 011, 100, 101, 110, 111"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.bin.p003
    topics: [computer.data.binary]
    difficulty: 2
    type: numeric
    stem: "เลขฐานสอง $1011_2$ มีค่าเท่าใดในฐานสิบ"
    answer: { value: 11 }
    hints:
      - "เขียนค่าประจำหลักของฐานสองใต้เลขโดดแต่ละตัว เริ่มจากขวาสุด"
      - "ค่าประจำหลักจากขวาไปซ้ายคือ 1, 2, 4, 8 แล้วบวกเฉพาะหลักที่เป็น 1"
    misconceptions:
      - { match: 13, feedback: "ดูเหมือนอ่านเลขกลับด้านเป็น $1101_2$ หลักขวาสุดมีค่า 1 ส่วนหลักซ้ายสุดของเลข 4 หลักมีค่า 8" }
      - { match: 3, feedback: "นั่นคือจำนวนเลข 1 แต่เลข 1 แต่ละตัวมีค่าตามหลักที่อยู่ ต้องบวกค่าประจำหลัก ไม่ใช่นับจำนวน" }
      - { match: 1011, feedback: "$1011$ ที่เขียนไว้เป็นเลขฐานสอง ต้องแปลงโดยใช้ค่าประจำหลัก 8, 4, 2, 1 ไม่ใช่อ่านเป็นหนึ่งพันสิบเอ็ด" }
    solution: "หลักจากซ้ายไปขวามีค่า 8, 4, 2, 1 หลักที่เป็น 1 คือ 8, 2 และ 1 จึงได้ $8 + 2 + 1 = 11$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.bin.p004
    topics: [computer.data.binary]
    difficulty: 2
    type: text
    stem: "เขียน $25_{10}$ เป็นเลขฐานสอง (พิมพ์เฉพาะเลข 0 และ 1 ไม่ต้องเติม 0 ข้างหน้า)"
    accepted: ["11001"]
    hints:
      - "หาร 25 ด้วย 2 ไปเรื่อย ๆ และจดเศษทุกครั้ง จนผลหารเป็น 0"
      - "เศษตัวสุดท้ายคือหลักซ้ายสุด ให้อ่านเศษจากล่างขึ้นบน"
    misconceptions:
      - { match: "10011", feedback: "อ่านเศษจากบนลงล่าง ได้เลขที่กลับด้าน ($10011_2 = 19$) เศษแรกคือหลักหน่วย ต้องอ่านจากล่างขึ้นบน" }
      - { match: "00011001", feedback: "ถูกต้องในรูป 8 บิต แต่โจทย์ขอไม่ให้เติม 0 ข้างหน้า ตอบ 11001" }
    solution: "25÷2 = 12 เศษ 1, 12÷2 = 6 เศษ 0, 6÷2 = 3 เศษ 0, 3÷2 = 1 เศษ 1, 1÷2 = 0 เศษ 1 อ่านเศษจากล่างขึ้นบนได้ $11001_2$ ตรวจ: $16 + 8 + 1 = 25$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.bin.p005
    topics: [computer.data.binary]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการแปลง $13_{10}$ เป็นเลขฐานสองด้วยการหารด้วย 2"
    items:
      - "13 ÷ 2 ได้ 6 เศษ 1"
      - "6 ÷ 2 ได้ 3 เศษ 0"
      - "3 ÷ 2 ได้ 1 เศษ 1"
      - "1 ÷ 2 ได้ 0 เศษ 1 (ผลหารเป็น 0 จึงหยุด)"
      - "อ่านเศษจากล่างขึ้นบน ได้ $1101_2$"
    hints:
      - "แต่ละขั้นนำผลหารของขั้นก่อนมาหารด้วย 2 ต่อ"
      - "หยุดหารเมื่อผลหารเป็น 0 แล้วจึงอ่านคำตอบ"
    solution: "หาร 13, 6, 3, 1 ด้วย 2 ตามลำดับ ได้เศษ 1, 0, 1, 1 อ่านจากล่างขึ้นบนได้ $1101_2$ ตรวจ: $8 + 4 + 1 = 13$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.bin.p006
    topics: [computer.data.binary]
    difficulty: 2
    type: match
    stem: "จับคู่เลขฐานสอง 4 บิตกับค่าในฐานสิบ"
    pairs:
      - { left: "0001", right: "1" }
      - { left: "0100", right: "4" }
      - { left: "0110", right: "6" }
      - { left: "1001", right: "9" }
      - { left: "1111", right: "15" }
    hints:
      - "ค่าประจำหลักของ 4 บิตจากซ้ายไปขวาคือ 8, 4, 2, 1"
      - "บวกค่าของหลักที่เป็น 1 เช่น 0110 มี 1 ที่หลัก 4 และหลัก 2"
    solution: "0001 = 1, 0100 = 4, 0110 = 4 + 2 = 6, 1001 = 8 + 1 = 9, 1111 = 8 + 4 + 2 + 1 = 15"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.bin.p007
    topics: [computer.data.binary]
    difficulty: 1
    type: numeric
    stem: "ข้อมูลขนาด 4 ไบต์มีกี่บิต (ตอบเป็นจำนวนบิต)"
    answer: { value: 32, unit: บิต }
    hints:
      - "1 ไบต์มีกี่บิต"
      - "แปลงไบต์เป็นบิตให้คูณด้วยจำนวนบิตต่อไบต์"
    misconceptions:
      - { match: 0.5, feedback: "หาร 4 ด้วย 8 คือการแปลงบิตเป็นไบต์ ในข้อนี้เปลี่ยนไบต์เป็นบิต ซึ่งต้องคูณด้วย 8" }
    solution: "1 ไบต์ = 8 บิต ดังนั้น 4 ไบต์ = $4 \\times 8 = 32$ บิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.bin.p008
    topics: [computer.data.binary]
    difficulty: 3
    type: numeric
    stem: "ถ้าใช้ 8 บิตเก็บจำนวนนับที่เริ่มจาก 0 จำนวนที่มากที่สุดที่เก็บได้คือเท่าใด"
    answer: { value: 255 }
    hints:
      - "จำนวนที่มากที่สุดเกิดเมื่อทุกบิตเป็น 1 คือ $11111111_2$"
      - "บวกค่าประจำหลัก 128 + 64 + … + 1 หรือใช้ว่า 8 บิตมี $2^8$ แบบและเริ่มนับที่ 0"
    misconceptions:
      - { match: 256, feedback: "256 คือจำนวนแบบทั้งหมด ($2^8$) แต่เริ่มนับที่ 0 ค่าที่มากที่สุดจึงเป็น $256 - 1$" }
      - { match: 128, feedback: "128 คือค่าของหลักซ้ายสุดหลักเดียว ต้องบวกค่าของทุกหลักเมื่อทุกบิตเป็น 1" }
    solution: "$11111111_2 = 128 + 64 + 32 + 16 + 8 + 4 + 2 + 1 = 255$ หรือ $2^8 - 1 = 255$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.bin.p009
    topics: [computer.data.binary]
    difficulty: 3
    type: numeric
    stem: "ในรหัส ASCII ตัวอักษร `A` มีรหัส 65 และตัวพิมพ์ใหญ่เรียงรหัสต่อกันตามลำดับตัวอักษร (`B` = 66, …) ตัวอักษร `D` มีรหัสเท่าใด"
    answer: { value: 68 }
    hints:
      - "D อยู่ถัดจาก A ไปกี่ตัว (A, B, C, D)"
      - "บวกจำนวนตัวที่ถัดไปเข้ากับ 65"
    misconceptions:
      - { match: 69, feedback: "D เป็นตัวที่ 4 แต่ห่างจาก A เพียง 3 ตัว เพราะ A เองมีรหัส 65 อยู่แล้ว จึงต้องบวก 3 ไม่ใช่ 4" }
      - { match: 4, feedback: "4 คือลำดับของ D ในตัวอักษร แต่ ASCII ไม่ได้เริ่มที่ 1 ต้องนับต่อจากรหัสของ A ที่เป็น 65" }
    solution: "A = 65, B = 66, C = 67, D = 68"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.bin.p010
    topics: [computer.data.binary]
    difficulty: 3
    type: numeric
    stem: "ไอคอนแบตเตอรี่บนหน้าจอนาฬิกาข้อมือเป็นภาพขาวดำขนาด $16 \\times 16$ พิกเซล ใช้ 1 บิตต่อพิกเซล ภาพนี้ใช้ข้อมูลกี่ไบต์"
    answer: { value: 32, unit: ไบต์ }
    hints:
      - "หาจำนวนพิกเซลทั้งหมดก่อน แล้วหาจำนวนบิต"
      - "เปลี่ยนบิตเป็นไบต์โดยหารด้วย 8"
    misconceptions:
      - { match: 256, feedback: "256 คือจำนวนบิต โจทย์ถามเป็นไบต์ ต้องหารด้วย 8" }
      - { match: 2048, feedback: "คูณ 8 คือการเปลี่ยนไบต์เป็นบิต ในข้อนี้มีหน่วยเป็นบิตอยู่แล้ว ต้องหาร 8 จึงได้ไบต์" }
    solution: "$16 \\times 16 = 256$ พิกเซล × 1 บิต = 256 บิต = $256 \\div 8 = 32$ ไบต์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.bin.p011
    topics: [computer.data.binary]
    difficulty: 3
    type: mcq
    stem: "เติม 0 หนึ่งตัวต่อท้ายเลขฐานสอง เช่น เปลี่ยน $101_2$ เป็น $1010_2$ ค่าของจำนวนเปลี่ยนไปอย่างไร"
    choices:
      - { id: a, text: "เพิ่มเป็น 2 เท่า", correct: true }
      - { id: b, text: "เพิ่มเป็น 10 เท่า", feedback: "เติม 0 ท้ายเลขฐานสิบได้ 10 เท่า แต่ในฐานสอง ทุกหลักเลื่อนไปอยู่หลักที่มีค่ามากขึ้น 2 เท่า" }
      - { id: c, text: "เท่าเดิม เพราะ 0 ไม่มีค่า", feedback: "0 ที่เติมท้ายไม่ได้มีค่าเอง แต่ทำให้เลขโดดเดิมทุกตัวเลื่อนไปอยู่หลักที่สูงขึ้น" }
      - { id: d, text: "ลดลงครึ่งหนึ่ง", feedback: "การลบหลักขวาสุดออกต่างหากที่ทำให้ค่าลดลงประมาณครึ่งหนึ่ง การเติมหลักทำให้ค่าเพิ่ม" }
    hints:
      - "ลองคำนวณ $101_2$ และ $1010_2$ เป็นฐานสิบแล้วเปรียบเทียบ"
      - "หลักทุกตัวเลื่อนไปทางซ้ายหนึ่งตำแหน่ง ค่าประจำหลักใหม่เป็นกี่เท่าของเดิม"
    solution: "$101_2 = 5$ และ $1010_2 = 10$ เลขโดดทุกตัวเลื่อนไปหลักที่มีค่าเป็น 2 เท่า ค่าทั้งจำนวนจึงเป็น 2 เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.bin.p012
    topics: [computer.data.binary]
    difficulty: 4
    type: text
    stem: "บวกเลขฐานสอง $1011_2 + 0110_2$ แล้วตอบเป็นเลขฐานสอง (พิมพ์เฉพาะ 0 และ 1)"
    accepted: ["10001", "010001"]
    hints:
      - "บวกทีละหลักจากขวาไปซ้ายเหมือนการบวกเลขฐานสิบ"
      - "ในฐานสอง $1 + 1 = 10_2$ เขียน 0 แล้วทด 1 ไปหลักถัดไป และ $1 + 1 + 1 = 11_2$ เขียน 1 ทด 1"
    misconceptions:
      - { match: "1101", feedback: "ดูเหมือนบวกทีละหลักโดยไม่ทด ($1 + 1$ ได้ 0 แล้วทิ้งตัวทด) ต้องทด 1 ไปหลักถัดไปทุกครั้งที่ผลรวมเป็น 2 ขึ้นไป" }
      - { match: "1121", feedback: "นั่นคือการบวกแบบเลขฐานสิบ ในฐานสองไม่มีเลขโดด 2 เมื่อได้ 2 ต้องเขียน 0 แล้วทด 1" }
    solution: "หลักหน่วย $1 + 0 = 1$, หลักสอง $1 + 1 = 10_2$ เขียน 0 ทด 1, หลักสี่ $0 + 1 + 1 = 10_2$ เขียน 0 ทด 1, หลักแปด $1 + 0 + 1 = 10_2$ เขียน 0 ทด 1 ได้ $10001_2$ ตรวจ: $11 + 6 = 17 = 16 + 1$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.bin.p013
    topics: [computer.data.binary]
    difficulty: 4
    type: numeric
    stem: "สติกเกอร์รูปภาพสีขนาด $100 \\times 50$ พิกเซล เก็บแบบ RGB สีละ 1 ไบต์ โดยไม่บีบอัด ใช้ข้อมูลกี่ไบต์"
    answer: { value: 15000, unit: ไบต์ }
    hints:
      - "หาจำนวนพิกเซลก่อน"
      - "แต่ละพิกเซลเก็บค่าสีกี่ค่า แต่ละค่าใช้กี่ไบต์"
    misconceptions:
      - { match: 5000, feedback: "5,000 คือจำนวนพิกเซล แต่ละพิกเซลเก็บ 3 ค่า (R, G, B) จึงต้องคูณ 3" }
      - { match: 120000, feedback: "นั่นคือจำนวนบิต (คูณ 8 เพิ่ม) โจทย์ถามเป็นไบต์" }
    solution: "$100 \\times 50 = 5{,}000$ พิกเซล × 3 ไบต์ = $15{,}000$ ไบต์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.bin.p014
    topics: [computer.data.binary]
    difficulty: 4
    type: numeric
    stem: "ห้องเรียนมีนักเรียน 40 คน ครูต้องการให้รหัสเลขฐานสองที่ไม่ซ้ำกันแก่นักเรียนทุกคน โดยทุกรหัสยาวเท่ากัน ต้องใช้อย่างน้อยกี่บิต"
    answer: { value: 6, unit: บิต }
    hints:
      - "$n$ บิตสร้างรหัสได้ $2^n$ แบบ"
      - "หา $n$ ที่น้อยที่สุดที่ $2^n$ ไม่น้อยกว่า 40"
    misconceptions:
      - { match: 5, feedback: "5 บิตได้เพียง $2^5 = 32$ แบบ ไม่พอสำหรับ 40 คน" }
      - { match: 40, feedback: "ไม่ต้องใช้บิตละคน เพราะบิตหลายตัวรวมกันสร้างรหัสได้หลายแบบมาก ($2^n$)" }
    solution: "$2^5 = 32 < 40$ แต่ $2^6 = 64 \\ge 40$ จึงต้องใช้อย่างน้อย 6 บิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.bin.p015
    topics: [computer.data.binary]
    difficulty: 4
    type: numeric
    stem: "ข้อความ \"สวัสดี\" ประกอบด้วยอักขระ ส ว ั ส ด ี (สระและไม้หันอากาศนับเป็นอักขระแยก) ถ้าบันทึกแบบ UTF-8 ซึ่งอักษรไทยใช้ 3 ไบต์ต่ออักขระ ข้อความนี้ใช้กี่ไบต์"
    answer: { value: 18, unit: ไบต์ }
    hints:
      - "นับจำนวนอักขระให้ครบ รวมสระที่อยู่บนพยัญชนะด้วย"
      - "คูณจำนวนอักขระด้วยจำนวนไบต์ต่ออักขระ"
    misconceptions:
