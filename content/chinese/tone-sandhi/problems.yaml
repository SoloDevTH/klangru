problems:
- id: chinese.pinyin.tone-sandhi.p001
  topics:
  - chinese.pinyin.tone-sandhi
  difficulty: 1
  type: mcq
  stem: 朋友 (péngyou เพื่อน) พยางค์ใดเป็น **เสียงเบา**
  choices:
  - id: a
    text: ทั้งสองพยางค์
    feedback: péng มีเครื่องหมายวรรณยุกต์ จึงไม่ใช่เสียงเบา
  - id: b
    text: ไม่มีพยางค์ใดเป็นเสียงเบา
    feedback: you ไม่มีเครื่องหมาย จึงเป็นเสียงเบา
  - id: c
    text: 友 you
    correct: true
    feedback: ถูก พินอินของ 友 ในคำนี้ไม่มีเครื่องหมายวรรณยุกต์
  - id: d
    text: 朋 péng
    feedback: péng มีเครื่องหมายเสียง 2 ไม่ใช่เสียงเบา
  hints:
  - เสียงเบาไม่ใส่เครื่องหมายวรรณยุกต์
  - ดูว่าพยางค์ใดไม่มีเครื่องหมาย
  solution: 'péngyou: **友 you** ไม่มีเครื่องหมาย จึงเป็นเสียงเบา อ่านสั้นและเบา'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.pinyin.tone-sandhi.p002
  topics:
  - chinese.pinyin.tone-sandhi
  difficulty: 1
  type: mcq
  stem: 哪儿 (ที่ไหน) ในภาษาพูดของคนปักกิ่ง เขียนพินอินอย่างไร
  choices:
  - id: a
    text: nǎ ér
    feedback: 儿 ในคำนี้ไม่ได้อ่านเป็นพยางค์ ér แยกต่างหาก
  - id: b
    text: nǎli
    feedback: nǎli คือ 哪里 ซึ่งเป็นอีกคำที่แปลว่า ที่ไหน
  - id: c
    text: ná'ér
    feedback: ไม่มีการเปลี่ยนเสียงแบบนี้
  - id: d
    text: nǎr
    correct: true
    feedback: ถูก 儿 ไม่ได้เป็นพยางค์แยก แต่เติมเสียงม้วนลิ้น r ท้ายพยางค์
  hints:
  - 儿化 คือการเติมเสียงม้วนลิ้นท้ายพยางค์
  - พยางค์ยังมีแค่หนึ่งพยางค์
  solution: 哪儿 = **nǎr** (儿化 เติม r ท้ายพยางค์) คนจีนตอนใต้และไต้หวันนิยมพูด 哪里 nǎlǐ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.pinyin.tone-sandhi.p003
  topics:
  - chinese.pinyin.tone-sandhi
  difficulty: 2
  type: mcq
  stem: แม่ค้าที่ตลาดผลไม้ในจันทบุรีได้ยินลูกค้าชาวจีนพูด 水果 (shuǐguǒ ผลไม้) ซึ่งเป็นเสียง 3 ติดกัน เวลาพูดจริงออกเสียงอย่างไร
  choices:
  - id: a
    text: shuíguǒ
    correct: true
    feedback: ถูก เสียง 3 ที่ตามด้วยเสียง 3 เปลี่ยนเป็นเสียง 2
  - id: b
    text: shuǐguó
    feedback: พยางค์ที่เปลี่ยนคือพยางค์แรก ไม่ใช่พยางค์หลัง
  - id: c
    text: shuíguó
    feedback: พยางค์หลังยังคงเป็นเสียง 3
  - id: d
    text: shuǐguǒ (ไม่เปลี่ยน)
    feedback: เสียง 3 ติดกันต้องเปลี่ยนพยางค์แรก
  hints:
  - ทบทวนกฎเสียง 3 + เสียง 3
  - พยางค์ใดเปลี่ยน พยางค์แรกหรือพยางค์หลัง
  solution: 水果 shuǐguǒ อ่านจริงว่า **shuíguǒ** (ในหนังสือยังเขียน shuǐguǒ)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.pinyin.tone-sandhi.p004
  topics:
  - chinese.pinyin.tone-sandhi
  difficulty: 2
  type: mcq
  stem: 一定 (แน่นอน) 一 อยู่หน้า 定 dìng ซึ่งเป็นเสียง 4 เวลาพูด 一 ออกเสียงอย่างไร
  choices:
  - id: a
    text: yi (เสียงเบา)
    feedback: 一 เป็นเสียงเบาเมื่ออยู่กลางกริยาซ้ำ เช่น 看一看
  - id: b
    text: yí
    correct: true
    feedback: 'ถูก 一 หน้าเสียง 4 เปลี่ยนเป็นเสียง 2: yídìng'
  - id: c
    text: yī
    feedback: yī ใช้เมื่ออ่านเดี่ยว นับเลข หรือเป็นเลขลำดับ
  - id: d
    text: yì
    feedback: yì ใช้หน้าเสียง 1 2 3
  hints:
  - ดูเสียงของพยางค์ที่ตามหลัง 一
  - 一 หน้าเสียง 4 ใช้กฎเดียวกับ 不
  solution: '定 เป็นเสียง 4 → 一 อ่าน **yí**: yídìng'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.pinyin.tone-sandhi.p005
  topics:
  - chinese.pinyin.tone-sandhi
  difficulty: 2
  type: match
  stem: จับคู่คำที่มีพยางค์เสียงเบากับพินอิน
  pairs:
  - left: 桌子 (โต๊ะ)
    right: zhuōzi
  - left: 东西 (ของ สิ่งของ)
    right: dōngxi
  - left: 衣服 (เสื้อผ้า)
    right: yīfu
  - left: 喜欢 (ชอบ)
    right: xǐhuan
  - left: 木头 (ไม้)
    right: mùtou
  hints:
  - 子 และ 头 ที่เป็นคำต่อท้ายคำนามมักเป็นเสียงเบา
  - ดูพยางค์แรกของแต่ละคำว่าตรงกับคำจีนตัวใด
  solution: 桌子 zhuōzi · 东西 dōngxi · 衣服 yīfu · 喜欢 xǐhuan · 木头 mùtou (พยางค์ที่สองเป็นเสียงเบาทุกคำ)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.pinyin.tone-sandhi.p006
  topics:
  - chinese.pinyin.tone-sandhi
  difficulty: 2
  type: text
  stem: 可以 (kěyǐ ได้ สามารถ) เป็นเสียง 3 ติดกัน เขียนพินอินตาม **เสียงที่พูดจริง** (ใส่เครื่องหมาย หรือพิมพ์เลขเสียง เช่น ma1 แทน mā)
  accepted:
  - kéyǐ
  - ke2yi3
  - ké yǐ
  - ke2 yi3
  misconceptions:
  - match: kěyǐ
    feedback: นี่คือรูปที่เขียนในหนังสือ ข้อนี้ถามเสียงที่พูดจริง พยางค์แรกต้องเปลี่ยน
  - match: ke3yi3
    feedback: นี่คือรูปที่เขียนในหนังสือ ข้อนี้ถามเสียงที่พูดจริง พยางค์แรกต้องเปลี่ยน
  - match: kěyí
    feedback: พยางค์ที่เปลี่ยนคือพยางค์แรก ไม่ใช่พยางค์หลัง
  - match: ke3yi2
    feedback: พยางค์ที่เปลี่ยนคือพยางค์แรก ไม่ใช่พยางค์หลัง
  hints:
  - เสียง 3 + เสียง 3 → พยางค์แรกเปลี่ยน
  - พยางค์แรกเปลี่ยนเป็นเสียงใด
  solution: 可以 kěyǐ → พูดจริง **kéyǐ** (ke2yi3)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.pinyin.tone-sandhi.p007
  topics:
  - chinese.pinyin.tone-sandhi
  difficulty: 3
  type: mcq
  stem: ลูกค้าชาวจีนในร้านเสื้อผ้าที่ประตูน้ำถามเพื่อนว่า 好不好？ (ดีไหม) 不 ในรูปถาม A不A แบบนี้ออกเสียงอย่างไร
  choices:
  - id: a
    text: hǎo bu hǎo (不 เป็นเสียงเบา)
    correct: true
    feedback: ถูก 不 ที่อยู่กลางรูปถาม A不A มักอ่านเป็นเสียงเบา
  - id: b
    text: hǎo bú hǎo
    feedback: 不 เปลี่ยนเป็นเสียง 2 เฉพาะหน้าเสียง 4 ส่วน 好 เป็นเสียง 3
  - id: c
    text: háo bù hǎo
    feedback: 好 แรกไม่ได้อยู่หน้าเสียง 3 จึงไม่เปลี่ยนเป็นเสียง 2
  - id: d
    text: hǎo bì hǎo
    feedback: ไม่มีเสียง bì ในคำนี้
  hints:
  - รูปถาม A不A เช่น 去不去 是不是
  - 不 ตรงกลางพูดเร็วและเบา
  solution: 好不好 = **hǎo bu hǎo** 不 กลางรูปถาม A不A เป็นเสียงเบา เช่นเดียวกับ 是不是 shì bu shì
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.pinyin.tone-sandhi.p008
  topics:
  - chinese.pinyin.tone-sandhi
  difficulty: 3
  type: mcq
  stem: 看一看 (ลองดู) ซึ่งเป็นกริยาซ้ำที่มี 一 อยู่ตรงกลาง ออกเสียงอย่างไร
  choices:
  - id: a
    text: kán yi kàn
    feedback: 看 ไม่เปลี่ยนเสียง
  - id: b
    text: kàn yi kàn
    correct: true
    feedback: ถูก 一 ที่อยู่ระหว่างกริยาซ้ำเป็นเสียงเบา
  - id: c
    text: kàn yí kàn
    feedback: กฎ 一 หน้าเสียง 4 ไม่ใช้กับ 一 ที่อยู่กลางกริยาซ้ำ
  - id: d
    text: kàn yī kàn
    feedback: 一 ในที่นี้ไม่ได้เป็นตัวเลขนับ จึงไม่อ่านเสียง 1 เต็ม
  hints:
  - รูป กริยา + 一 + กริยา แปลว่า ลองทำ…ดู
  - 一 ในรูปนี้พูดสั้นและเบามาก
  solution: 看一看 = **kàn yi kàn** (一 เสียงเบา) เช่นเดียวกับ 试一试 shì yi shì (ลองดู)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.pinyin.tone-sandhi.p009
  topics:
  - chinese.pinyin.tone-sandhi
  difficulty: 3
  type: mcq
  stem: นักท่องเที่ยวชาวจีนถามเบอร์โทรฉุกเฉินทางการแพทย์ของไทย 1669 คนจีนอ่านเลข 1 ในเบอร์โทรศัพท์ว่าอะไร
  choices:
  - id: a
    text: yì
    feedback: ไม่ใช้ การอ่านเลขทีละตัวไม่เปลี่ยนเสียง
  - id: b
    text: shí
    feedback: shí คือ 10
  - id: c
    text: yāo
    correct: true
    feedback: ถูก ในเบอร์โทร ห้อง และรหัส คนจีนมักอ่าน 1 ว่า yāo เพื่อไม่ให้สับสนกับ 7 qī
  - id: d
    text: yí
    feedback: ไม่ใช้ กฎ 一 หน้าเสียง 4 ใช้กับคำ ไม่ใช้กับการอ่านตัวเลขทีละตัว
  hints:
  - เมื่ออ่านตัวเลขทีละตัว 一 ไม่เปลี่ยนเสียงตามกฎ
  - ในเบอร์โทรมีคำอ่านพิเศษเพื่อไม่ให้ yī กับ qī ฟังคล้ายกัน
  solution: 1669 อ่าน **yāo liù liù jiǔ** (เลข 1 ในเบอร์โทรอ่าน yāo)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.pinyin.tone-sandhi.p010
  topics:
  - chinese.pinyin.tone-sandhi
  difficulty: 3
  type: mcq
  stem: 老师 (lǎoshī ครู) 老 เป็นเสียง 3 ที่ตามด้วยเสียง 1 เวลาพูดจริง 老 ออกเสียงอย่างไร
  choices:
  - id: a
    text: เสียง 3 เต็ม ลงแล้วเชิดขึ้นสูง
    feedback: ลากเต็มเฉพาะเมื่ออ่านเดี่ยวหรืออยู่ท้ายวลี
  - id: b
    text: เปลี่ยนเป็นเสียง 2
    feedback: เสียง 3 เปลี่ยนเป็นเสียง 2 เฉพาะหน้าเสียง 3
  - id: c
    text: เปลี่ยนเป็นเสียง 4
    feedback: ไม่มีกฎนี้
  - id: d
    text: 'เสียง 3 ครึ่ง: ต่ำลงแล้วไม่เชิดขึ้น'
    correct: true
    feedback: ถูก เสียง 3 ที่ไม่ได้อยู่ท้ายวลีมักออกแค่ช่วงต่ำ
  hints:
  - ดูว่าพยางค์ถัดไปเป็นเสียงอะไร
  - เสียง 3 หน้าเสียง 1 2 4 และเสียงเบา
  solution: 老 หน้าเสียง 1 ออกเป็น **เสียง 3 ครึ่ง** (半三声) คือต่ำแล้วจบ ไม่เชิดขึ้น ฟังคล้ายเสียงเอกของไทย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.pinyin.tone-sandhi.p011
  topics:
  - chinese.pinyin.tone-sandhi
  difficulty: 3
  type: text
  stem: เพื่อนชาวจีนชมอาหารไทยว่า 不错 (ไม่เลว ดีทีเดียว) 错 cuò เป็นเสียง 4 เขียนพินอินตาม **เสียงที่พูดจริง** (ใส่เครื่องหมาย หรือพิมพ์เลขเสียง เช่น bu1cuo1)
  accepted:
  - búcuò
  - bu2cuo4
  - bú cuò
  - bu2 cuo4
  misconceptions:
  - match: bùcuò
    feedback: 不 หน้าเสียง 4 ต้องเปลี่ยนเป็นเสียง 2
  - match: bu4cuo4
    feedback: 不 หน้าเสียง 4 ต้องเปลี่ยนเป็นเสียง 2
  - match: bùcuó
    feedback: พยางค์ที่เปลี่ยนคือ 不 ไม่ใช่ 错
  hints:
  - 不 เปลี่ยนเสียงเมื่ออยู่หน้าเสียงใด
  - 错 เป็นเสียง 4
  solution: '不 + เสียง 4 → **bú**: 不错 = **búcuò**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.pinyin.tone-sandhi.p012
  topics:
  - chinese.pinyin.tone-sandhi
  difficulty: 4
  type: mcq
  stem: นักท่องเที่ยวชาวจีนที่ตลาดนัดจตุจักรพูดว่า 我想买东西 ถ้าออกเสียง 东西 เป็น dōngxi (西 เสียงเบา) หมายความว่าอะไร
  choices:
  - id: a
    text: ฉันอยากกินขนม
    feedback: 东西 ไม่ได้แปลว่าขนม
  - id: b
    text: ฉันอยากซื้อของ
    correct: true
    feedback: ถูก dōngxi (西 เสียงเบา) แปลว่า สิ่งของ
  - id: c
    text: ฉันอยากซื้อทิศตะวันออกและตะวันตก
    feedback: ความหมายนี้คือ dōngxī ที่ 西 เป็นเสียง 1 ใช้ในบริบทอื่น เช่น บอกทิศ
  - id: d
    text: ฉันอยากขายของ
    feedback: ขายคือ 卖 mài ส่วน 买 mǎi คือซื้อ
  hints:
  - เสียงเบาบางครั้งทำให้ความหมายเปลี่ยน
  - 东 = ตะวันออก 西 = ตะวันตก แต่เมื่อ 西 เป็นเสียงเบา…
  solution: '**dōngxi** (เสียงเบา) = สิ่งของ · **dōngxī** = ตะวันออกและตะวันตก ประโยคนี้แปลว่า **ฉันอยากซื้อของ**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.pinyin.tone-sandhi.p013
  topics:
  - chinese.pinyin.tone-sandhi
  difficulty: 4
  type: order
  stem: เรียงขั้นตอนการตัดสินว่า 一 ในคำหนึ่งออกเสียงอย่างไร
  items:
  - ดูว่า 一 เป็นการนับเลข เลขลำดับ หรืออยู่ท้ายคำหรือไม่ ถ้าใช่อ่าน yī
  - ถ้าไม่ใช่ ดูเสียงเดิมของพยางค์ที่ตามหลัง 一
  - ถ้าพยางค์ถัดไปเป็นเสียง 4 อ่าน yí
  - ถ้าพยางค์ถัดไปเป็นเสียง 1 2 หรือ 3 อ่าน yì
  hints:
  - ขั้นแรกคัดกรณีที่ไม่ต้องเปลี่ยนออกก่อน
  - จากนั้นดูเสียงเดิมของพยางค์ถัดไป
  solution: คัดกรณีที่อ่าน yī (นับเลข ลำดับ ท้ายคำ) → ดูเสียงเดิมของพยางค์ถัดไป → หน้าเสียง 4 อ่าน yí → หน้าเสียง 1 2 3 อ่าน yì
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.pinyin.tone-sandhi.p014
  topics:
  - chinese.pinyin.tone-sandhi
  difficulty: 4
  type: mcq
  stem: ข้อใดถูกต้องเกี่ยวกับเสียง 儿化 (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: 一点儿 yìdiǎnr เวลาพูดเสียง n หายไป ฟังคล้าย yìdiǎr
    correct: true
