  - { framework: university-foundations, indicators: ["STAT 5.1", "STAT 5.3", "STAT 6.1", "STAT 6.2"], coverage: full, note: "ฟังก์ชันความหนาแน่นและความน่าจะเป็นเป็นพื้นที่ การแจกแจงเอกรูปต่อเนื่อง การแจกแจงเอกซ์โพเนนเชียล (ค่าเฉลี่ย 1/λ, P(X > x), ไม่มีความจำ, มัธยฐาน) การแจกแจงปกติมาตรฐาน คะแนน z และการใช้การแจกแจงปกติทั้งไปและย้อนกลับ (เปอร์เซ็นไทล์ หา σ หรือ μ จากความน่าจะเป็น)" }
  - { framework: us-ngss, indicators: ["HS-LS3-3"], coverage: partial, note: "ใช้การแจกแจงปกติอธิบายการกระจายของลักษณะในประชากร (ส่วนสูง ความยาวฝักถั่ว) และกล่าวถึงยีนหลายคู่กับสิ่งแวดล้อม แต่ไม่ได้ใช้ความน่าจะเป็นทางพันธุศาสตร์ (เช่น ตารางพันเนตต์) อธิบายสัดส่วนของลักษณะ" }
