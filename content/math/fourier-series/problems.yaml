problems:
- id: math.de.fourier-series.p001
  topics:
  - math.de.fourier-series
  difficulty: 1
  type: numeric
  stem: 'จงหาสัมประสิทธิ์ $b_1$ ของอนุกรมฟูเรียร์ของ $f(t)=t$ บนช่วง $(-\pi,\pi)$ ที่ขยายเป็นฟังก์ชันคาบ $2\pi$ (ตอบจำนวนเต็ม)'
  answer:
    value: 2
    tolerance: 0
  hints:
  - เนื่องจาก $f$ เป็นฟังก์ชันคี่ มีเฉพาะพจน์ $\sin nt$ ใช้สูตร $b_n = \frac{1}{\pi}\int_{-\pi}^{\pi} f(t)\sin nt\,dt$
  - ใช้การปริพันธ์โดยส่วนกับ $\int_{-\pi}^{\pi} t\sin t\,dt$
  misconceptions:
  - match: -2
    feedback: เครื่องหมายผิด $b_n$ ของฟังก์ชันนี้คือ $\frac{2(-1)^{n+1}}{n}$ ซึ่งเป็นบวกเมื่อ $n=1$
  solution: $b_n = \frac{2(-1)^{n+1}}{n}$ จึงได้ $b_1 = 2$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: math.de.fourier-series.p002
  topics:
  - math.de.fourier-series
  difficulty: 1
  type: mcq
  stem: 'ค่าของ $\displaystyle\int_{-\pi}^{\pi}\sin 2t\,\cos 3t\,dt$ คือข้อใด'
  choices:
  - id: a
    text: $\pi$
    correct: false
    feedback: ฟังก์ชันสองตัวมีความถี่ต่างกันจึงตั้งฉากกันบนช่วงหนึ่งคาบ ค่าปริพันธ์ไม่ใช่ $\pi$
  - id: b
    text: $-\pi$
    correct: false
    feedback: ค่าปริพันธ์ของผลคูณ sin และ cos ที่ความถี่ต่างกันเป็นศูนย์ ไม่ใช่ $-\pi$
  - id: c
    text: $0$
    correct: true
  - id: d
    text: $2\pi$
    correct: false
    feedback: $2\pi$ เป็นความยาวของช่วงหนึ่งคาบ แต่ผลคูณของ sin และ cos ที่ความถี่ต่างกันหักล้างกันเป็นศูนย์
  hints:
  - ใช้สูตรผลคูณ $\sin A \cos B = \frac12[\sin(A+B) + \sin(A-B)]$
  - ปริพันธ์ของ $\sin$ ที่ความถี่จำนวนเต็มบนช่วง $[-\pi,\pi]$ เป็นศูนย์
  solution: $\sin 2t\cos 3t = \frac12(\sin 5t - \sin t)$ และปริพันธ์ของแต่ละพจน์บนช่วง $[-\pi,\pi]$ เป็นศูนย์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: math.de.fourier-series.p003
  topics:
  - math.de.fourier-series
  difficulty: 2
  type: numeric
  stem: 'จงหาค่าเฉลี่ยของ $f(t)=|t|$ บนช่วง $(-\pi,\pi)$ (ตอบทศนิยม 4 ตำแหน่ง)'
  answer:
    value: 1.5708
    tolerance: 0.0001
  hints:
  - ค่าเฉลี่ยคือปริพันธ์ของ $f$ หารด้วยความยาวของช่วง $2\pi$
  - ปริพันธ์ของ $|t|$ บนช่วง $(-\pi,\pi)$ มีค่าเท่ากับ $2\cdot\frac{\pi^2}{2}$
  misconceptions:
  - match: 3.1416
    feedback: หารด้วย $\pi$ แทนที่จะหารด้วยความยาวช่วง $2\pi$ ค่าที่ได้จึงเป็นสองเท่า
  solution: $\frac{1}{2\pi}\int_{-\pi}^{\pi}|t|\,dt = \frac{1}{2\pi}\cdot\pi^2 = \frac{\pi}{2} \approx 1.5708$ ซึ่งเป็น $\frac{a_0}{2}$ ของอนุกรมฟูเรียร์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: math.de.fourier-series.p004
  topics:
  - math.de.fourier-series
  difficulty: 3
  type: numeric
  stem: 'ให้ $f(t)=t$ บนช่วง $(-1,1)$ ขยายเป็นฟังก์ชันคาบ $2$ (นั่นคือ $L=1$) จงหาสัมประสิทธิ์ $b_2$ ของพจน์ $\sin(2\pi t)$ (ตอบทศนิยม 4 ตำแหน่ง)'
  answer:
    value: -0.3183
    tolerance: 0.0001
  hints:
  - เมื่อคาบเป็น $2L$ ใช้ $b_n = \frac{1}{L}\int_{-L}^{L} f(t)\sin\frac{n\pi t}{L}\,dt$
  - ฟังก์ชันเป็นคี่ จึงได้ $b_n = 2\int_0^{1} t\sin(n\pi t)\,dt$ แล้วปริพันธ์โดยส่วน
  - ผลที่ได้คือ $b_n = \frac{2(-1)^{n+1}}{n\pi}$
  misconceptions:
  - match: -1
    feedback: ใช้สูตรของคาบ $2\pi$ คือ $\frac{2(-1)^{n+1}}{n}$ ตรง ๆ เมื่อคาบเป็น $2$ ต้องแทน $nt$ ด้วย $n\pi t$ ทำให้มีตัวหาร $\pi$ เพิ่ม
  - match: 0.3183
    feedback: เครื่องหมายผิด เมื่อ $n=2$ จะได้ $(-1)^{3} = -1$
  solution: $b_n = 2\int_0^1 t\sin(n\pi t)\,dt = \frac{2(-1)^{n+1}}{n\pi}$ จึงได้ $b_2 = -\frac{1}{\pi} \approx -0.3183$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: math.de.fourier-series.p005
  topics:
  - math.de.fourier-series
  difficulty: 2
  type: mcq
  multiple: true
  stem: 'ข้อความใดเกี่ยวกับอนุกรมฟูเรียร์ของฟังก์ชันคาบเป็นจริง (เลือกทุกข้อที่ถูก)'
  choices:
  - id: a
    text: ถ้า $f$ เป็นฟังก์ชันคู่ อนุกรมฟูเรียร์มีเฉพาะพจน์ $\cos nt$ และค่าคงที่
    correct: true
  - id: b
    text: ถ้า $f$ เป็นฟังก์ชันคี่ อนุกรมฟูเรียร์มีเฉพาะพจน์ $\sin nt$
    correct: true
  - id: c
    text: ผลคูณของฟังก์ชันคู่กับฟังก์ชันคี่เป็นฟังก์ชันคู่
    correct: false
    feedback: คู่คูณคี่ได้คี่ ไม่ใช่คู่
  - id: d
    text: ถ้า $f(t) = \cos t + \sin t$ สัมประสิทธิ์ $b_1$ เท่ากับ $1$
    correct: true
  hints:
  - นึกถึงสมมาตรของ $\cos nt$ และ $\sin nt$ ภายใต้การแทน $t$ ด้วย $-t$
  - ตรวจว่า $\sin t$ และ $\cos t$ เองเป็นคู่หรือคี่
  solution: ฟังก์ชันคู่ทำให้พจน์ $\sin$ หายไป ฟังก์ชันคี่ทำให้พจน์ $\cos$ และค่าคงที่หายไป ผลคูณคู่กับคี่เป็นคี่ และ $\cos t + \sin t$ มี $b_1=1$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: math.de.fourier-series.p006
  topics:
  - math.de.fourier-series
  difficulty: 2
  type: expression
  stem: 'ให้ $f(t)=1$ เมื่อ $0<t<\pi$ และ $f(t)=-1$ เมื่อ $-\pi<t<0$ ขยายเป็นคาบ $2\pi$ จงหา $b_1$'
  prefix: 'b_1 ='
  answer:
    latex: '\frac{4}{\pi}'
    variables: []
  misconceptions:
  - match: '\frac{2}{\pi}'
    feedback: ค่าปริพันธ์ $\int_0^\pi \sin t\,dt$ เท่ากับ $2$ ไม่ใช่ $1$ ถ้าได้ $1$ จะได้ $\frac{2}{\pi}$ ซึ่งผิด
  hints:
  - ฟังก์ชันนี้เป็นฟังก์ชันคี่ มีเฉพาะพจน์ $\sin nt$
  - คำนวณ $b_1 = \frac{2}{\pi}\int_0^{\pi} \sin t\,dt$ โดยใช้สมมาตรของฟังก์ชัน
  solution: $b_1 = \frac{2}{\pi}\int_0^\pi 1\cdot\sin t\,dt = \frac{2}{\pi}\cdot 2 = \frac{4}{\pi}$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: math.de.fourier-series.p007
  topics:
  - math.de.fourier-series
  difficulty: 2
  type: numeric
  stem: 'ฟังก์ชันคาบมีคาบ $6$ หน่วยเวลา ความถี่เชิงมุมพื้นฐานของฟังก์ชันนี้มีค่าเท่าใดในหน่วยเรเดียนต่อหน่วยเวลา (ตอบทศนิยม 4 ตำแหน่ง)'
  answer:
    value: 1.0472
    tolerance: 0.0001
  hints:
  - ความถี่เชิงมุมพื้นฐานคือ $\omega = \frac{2\pi}{T}$ เมื่อ $T$ คือคาบ
  - แทนค่า $T = 6$ แล้วคำนวณ
  misconceptions:
  - match: 0.1667
    feedback: ได้ความถี่ในหน่วยรอบต่อหน่วยเวลา ($\frac{1}{T}$) ซึ่งไม่ใช่ความถี่เชิงมุมในหน่วยเรเดียน
  solution: $\omega = \frac{2\pi}{6} = \frac{\pi}{3} \approx 1.0472$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: math.de.fourier-series.p008
  topics:
  - math.de.fourier-series
  difficulty: 3
  type: numeric
  stem: 'ไซเรนเตือนภัยในเมืองสร้างสัญญาณเป็นคาบ มีรูปคลื่นตามฟังก์ชัน $f(t)=t$ บนช่วง $(-\pi,\pi)$ (ข้อมูลสมมติ) ขนาดของฮาร์มอนิกลำดับที่ $4$ คือ $|b_4|$ เท่าใด (ตอบทศนิยม 4 ตำแหน่ง)'
  answer:
    value: 0.5
    tolerance: 0.0001
  hints:
  - ใช้สูตร $b_n = \frac{2(-1)^{n+1}}{n}$ ของฟังก์ชันนี้
  - ขนาดคือค่าสัมบูรณ์ของ $b_4$
  misconceptions:
  - match: 2
    feedback: ลืมหารด้วย $n$ จึงได้ค่า $\frac{2}{1}$ ซึ่งไม่ใช่สัมประสิทธิ์ที่ลำดับ $4$
  solution: $b_4 = \frac{2(-1)^{5}}{4} = -\frac{1}{2}$ จึงมีขนาด $0.5$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: math.de.fourier-series.p009
  topics:
  - math.de.fourier-series
  difficulty: 3
  type: numeric
  stem: 'สำหรับคลื่นสี่เหลี่ยม $f(t)=1$ เมื่อ $0<t<\pi$ และ $f(t)=-1$ เมื่อ $-\pi<t<0$ คาบ $2\pi$ จงหาสัมประสิทธิ์ $b_3$ (ตอบทศนิยม 4 ตำแหน่ง)'
  answer:
    value: 0.4244
    tolerance: 0.0001
  hints:
  - ฟังก์ชันคี่ ใช้ $b_n = \frac{2}{\pi}\int_0^\pi \sin nt\,dt$
  - ปริพันธ์ของ $\sin nt$ บน $(0,\pi)$ คือ $\frac{1-\cos n\pi}{n}$ ซึ่งเป็นศูนย์เมื่อ $n$ เป็นเลขคู่
  misconceptions:
  - match: 1.2732
    feedback: ลืมหารด้วย $n$ ค่าที่ได้คือ $\frac{4}{\pi}$ ซึ่งเป็น $b_1$ ไม่ใช่ $b_3$
  solution: $b_3 = \frac{4}{3\pi} \approx 0.4244$ เพราะ $n=3$ เป็นเลขคี่
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: math.de.fourier-series.p010
  topics:
