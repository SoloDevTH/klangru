    choices:
      - { id: a, text: "เมื่อสภาพแวดล้อมเปลี่ยนต่อเนื่อง ระบบนิเวศอาจเปลี่ยนไปเป็นแบบใหม่ที่มีชนิดและจำนวนสิ่งมีชีวิตต่างจากเดิม", correct: true }
      - { id: b, text: "แนวปะการังจะกลับเป็นแบบเดิมเองในปีถัดไปเสมอ", feedback: "ถ้าสภาพยังเปลี่ยนต่อเนื่อง การฟื้นตัวอาจไม่เกิดหรือใช้เวลานานมาก หลักฐานไม่ได้บอกว่ากลับเป็นแบบเดิมเสมอ" }
      - { id: c, text: "สาหร่ายเป็นสาเหตุที่ทำให้ปะการังฟอกขาว", feedback: "ตามหลักฐาน สาหร่ายขึ้นหลังจากปะการังตาย จึงเป็นผลที่ตามมามากกว่าสาเหตุ" }
      - { id: d, text: "ปลาที่หายไปไม่เกี่ยวกับการเปลี่ยนแปลงของปะการัง", feedback: "ปลาที่กินปะการังขาดอาหารเมื่อปะการังตาย จึงเกี่ยวข้องโดยตรง" }
    hints:
      - "เทียบลำดับเหตุการณ์ อะไรเกิดก่อน อะไรเกิดหลัง"
      - "สภาพที่คงที่กับสภาพที่เปลี่ยนต่อเนื่องให้ผลต่างกันอย่างไร"
    solution: "ปะการังตายเพราะน้ำร้อนต่อเนื่อง สาหร่ายเข้ามาใช้พื้นที่ว่าง และสัตว์ที่พึ่งปะการังหายไป แสดงว่าเมื่อสภาพเปลี่ยนไปมาก ระบบนิเวศอาจเปลี่ยนเป็นแบบใหม่ ไม่ได้รักษาจำนวนและชนิดเดิมไว้"
