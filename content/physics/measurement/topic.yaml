id: physics.units.measurement
subject: physics
title: { th: การวัดและเลขนัยสำคัญ, en: Measurement and significant figures }
summary: อ่านค่าจากเครื่องมือวัดตามความละเอียด นับเลขนัยสำคัญ ปัดเศษ คำนวณกับผลการวัด และบอกความคลาดเคลื่อนของผลการวัด
difficulty: 3
minutes: 35
prerequisites: [physics.units.si, math.number.scientific-notation]
encompasses:
  - { id: physics.units.si, weight: 0.3 }
  - { id: math.number.scientific-notation, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: อ่านเวอร์เนียร์คาลิเปอร์
    problem: "วัดเส้นผ่านศูนย์กลางของท่อพีวีซีด้วยเวอร์เนียร์คาลิเปอร์ (ความละเอียด $0.1\\ \\mathrm{mm}$) ได้สเกลดังภาพ อ่านค่าได้เท่าใด"
    figure:
      src: vernier-23-4.svg
      alt: "สเกลหลักของเวอร์เนียร์คาลิเปอร์มีขีดทุก 1 มิลลิเมตร มีตัวเลข 2, 3, 4 เซนติเมตร ขีด 0 ของสเกลเวอร์เนียร์อยู่เลยขีด 23 มิลลิเมตรไปเล็กน้อยก่อนถึง 24 มิลลิเมตร ขีดที่ 4 ของสเกลเวอร์เนียร์ (ระบายสีส้ม) ตรงกับขีดหนึ่งของสเกลหลักพอดี"
    steps:
      - text: "ขีด 0 ของเวอร์เนียร์อยู่เลยขีด $2.3\\ \\mathrm{cm} = 23\\ \\mathrm{mm}$ แต่ยังไม่ถึง $24\\ \\mathrm{mm}$ อ่านส่วนเต็มได้ $23\\ \\mathrm{mm}$"
      - text: "ขีดที่ 4 ของเวอร์เนียร์ตรงกับขีดของสเกลหลักพอดี จึงบวกเพิ่ม $4 \\times 0.1 = 0.4\\ \\mathrm{mm}$"
        why: "ช่องเวอร์เนียร์สั้นกว่าช่องหลักช่องละ $0.1\\ \\mathrm{mm}$ ถ้าขีดที่ 4 ตรงกัน แปลว่าขีด 0 เลยขีดหลักมา $4 \\times 0.1\\ \\mathrm{mm}$ พอดี"
      - text: "ผลการวัด $23 + 0.4 = 23.4\\ \\mathrm{mm}$ เขียนพร้อมความคลาดเคลื่อน $(23.4 \\pm 0.1)\\ \\mathrm{mm}$"
    answer: "$23.4\\ \\mathrm{mm}$ หรือ $2.34\\ \\mathrm{cm}$"
  - { type: check, problem: phy.meas.p002, prompt: "ทบทวนการนับเลขนัยสำคัญ" }
  - type: worked-example
    title: อ่านความชันและจุดตัดแกนของกราฟสปริง
    problem: "แขวนตุ้มน้ำหนักกับสปริงแล้ววัดความยาวสปริง ได้กราฟดังภาพ จงหาความยาวเดิมของสปริง และค่านิจสปริง ($g = 9.8\\ \\mathrm{m/s^2}$)"
    figure:
      src: spring-length-graph.svg
      alt: "กราฟความยาวสปริง (cm) แกนตั้ง 8 ถึง 18 กับมวลที่แขวน (g) แกนนอน 0 ถึง 250 จุดข้อมูลหกจุดเรียงเกือบเป็นเส้นตรง มีเส้นตรงที่เหมาะสมที่สุดตัดแกนตั้งที่ประมาณ 10.1 cm มีสามเหลี่ยมเส้นประบนเส้นตรงจาก 50 g ถึง 250 g แสดง Δx = 200 g และ Δy ประมาณ 5.2 cm"
    steps:
      - text: "จุดตัดแกนตั้ง (มวล 0 g) อ่านได้ประมาณ $10.1\\ \\mathrm{cm}$ คือความยาวเดิมของสปริง"
      - text: "เลือกสองจุดบนเส้นตรงที่ห่างกัน: ที่ $50\\ \\mathrm{g}$ และ $250\\ \\mathrm{g}$ ความยาวต่างกันประมาณ $5.2\\ \\mathrm{cm}$ ความชัน $= \\dfrac{5.2\\ \\mathrm{cm}}{200\\ \\mathrm{g}} = 0.026\\ \\mathrm{cm/g}$"
        why: "ใช้จุดบนเส้นตรงที่เหมาะสมที่สุด ไม่ใช่จุดข้อมูล เพราะเส้นเฉลี่ยความคลาดเคลื่อนแบบสุ่มของทุกจุดแล้ว"
      - text: "แปลงเป็นแรง: มวลเพิ่ม $200\\ \\mathrm{g} = 0.2\\ \\mathrm{kg}$ คือแรงเพิ่ม $0.2 \\times 9.8 = 1.96\\ \\mathrm{N}$ ทำให้ยืดเพิ่ม $0.052\\ \\mathrm{m}$"
      - text: "$k = \\dfrac{\\Delta F}{\\Delta x} = \\dfrac{1.96}{0.052} \\approx 38\\ \\mathrm{N/m}$"
    answer: "ความยาวเดิมประมาณ $10.1\\ \\mathrm{cm}$ และ $k \\approx 38\\ \\mathrm{N/m}$"
  - { type: check, problem: phy.meas.p005, prompt: "ปัดครั้งเดียวจากตัวเลขเดิม" }
  - type: interactive
    title: อ่านค่าระหว่างขีดสเกลของไม้บรรทัด
    caption: ขยายช่วง 12.3 ถึง 12.4 cm ของไม้บรรทัดที่มีขีดทุก 1 mm ปลายดินสออยู่กลางช่อง จึงอ่านได้ 12.35 cm และค่าจริงน่าจะอยู่ระหว่าง 12.30 ถึง 12.40 cm คือคลาดเคลื่อนได้ครึ่งช่อง (±0.05 cm)
    widget:
      kind: number-line
      min: 12.25
      max: 12.45
      points:
        - { value: 12.3, label: "12.30" }
        - { value: 12.35, label: "อ่านได้ 12.35" }
        - { value: 12.4, label: "12.40" }
      jumps:
        - { from: 12.35, to: 12.3, label: "−0.05" }
        - { from: 12.35, to: 12.4, label: "+0.05" }
glossary:
  - { term: ความละเอียดของเครื่องมือ, definition: "ค่าที่เล็กที่สุดที่เครื่องมือแยกได้ คือค่าของช่องสเกลเล็กที่สุด หรือค่าของหลักสุดท้ายบนจอเครื่องมือแบบตัวเลข" }
  - { term: เลขนัยสำคัญ, definition: "หลักของตัวเลขที่ได้จากการวัดจริง รวมหลักสุดท้ายที่ประมาณ ไม่นับศูนย์ข้างหน้าที่บอกแค่ตำแหน่งจุดทศนิยม" }
  - { term: ความคลาดเคลื่อน, definition: "ขนาดของความไม่แน่นอนของผลการวัด เขียนเป็น ค่าที่อ่านได้ ± ความคลาดเคลื่อน เช่น $(12.35 \\pm 0.05)\\ \\mathrm{cm}$" }
  - { term: ความแม่นและความเที่ยง, definition: "ความแม่นคือผลการวัดใกล้ค่าจริง ความเที่ยงคือวัดซ้ำแล้วได้ค่าใกล้เคียงกัน" }
flashcards:
  - { front: "อ่านค่าจากเครื่องมือแบบสเกลอย่างไร", back: "อ่านให้ถึงช่องสเกลเล็กที่สุด แล้วประมาณเพิ่มอีก 1 ตำแหน่ง เช่น ไม้บรรทัดขีดละ 1 mm อ่านได้ $12.35\\ \\mathrm{cm}$" }
  - { front: "$0.00520$ มีเลขนัยสำคัญกี่ตัว", back: "3 ตัว คือ 5, 2 และ 0 ตัวท้าย ศูนย์ข้างหน้าไม่นับ" }
  - { front: "คูณหารผลการวัด ผลลัพธ์มีเลขนัยสำคัญกี่ตัว", back: "เท่ากับตัวที่มีเลขนัยสำคัญน้อยที่สุด" }
  - { front: "บวกลบผลการวัด ผลลัพธ์ละเอียดถึงหลักใด", back: "มีตำแหน่งทศนิยมเท่ากับตัวที่มีตำแหน่งทศนิยมน้อยที่สุด" }
  - { front: "ความคลาดเคลื่อนเชิงระบบกับแบบสุ่มต่างกันอย่างไร", back: "เชิงระบบเบี่ยงไปทางเดียวทุกครั้ง (เช่น ตาชั่งไม่ตั้งศูนย์) วัดซ้ำไม่ช่วย แบบสุ่มแกว่งทั้งมากและน้อย ลดได้ด้วยการวัดซ้ำแล้วหาค่าเฉลี่ย" }
