id: computer.design.usability-evaluation
subject: computer
title: { th: ประเมินความใช้งานง่ายและปรับปรุงจากผลทดสอบ, en: "Evaluating usability and improving from test results" }
summary: องค์ประกอบของความใช้งานได้ เพอร์โซนาและการเดินทางของผู้ใช้ ปัจจัยมนุษย์ การประเมินเชิงฮิวริสติก การทดสอบกับผู้ใช้ด้วย SUS และ A/B รอบการปรับปรุง การเข้าถึงได้ และรูปแบบหลอกล่อ
difficulty: 5
minutes: 40
prerequisites: [computer.design.user-centred-design, computer.programming.development-process]
encompasses:
  - { id: computer.design.user-centred-design, weight: 0.3 }
  - { id: computer.programming.development-process, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: iteration-cycle.svg
    alt: "วงรอบห้าขั้นตอนที่ต่อกันด้วยลูกศร เริ่มจากวางแผนการทดสอบ แล้วทดสอบกับผู้ใช้ วิเคราะห์และจัดลำดับปัญหา แก้ปัญหาสำคัญก่อน และทดสอบซ้ำ ลูกศรสุดท้ายกลับไปยังขั้นแรกเพื่อเริ่มรอบถัดไป"
    caption: "การปรับปรุงทำเป็นรอบ ๆ แต่ละรอบแก้ปัญหาที่สำคัญที่สุดก่อนแล้วทดสอบซ้ำ"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: ให้คะแนน SUS จากคำตอบของผู้ตอบหนึ่งคน
    problem: "ผู้ตอบ SUS คนหนึ่งให้คำตอบข้อ 1 ถึง 10 เป็น 5, 1, 4, 2, 5, 1, 4, 2, 5, 1 (แต่ละข้อในระดับ 1 ถึง 5) คะแนน SUS ของผู้ตอบคนนี้เท่ากับเท่าใด"
    steps:
      - text: "ข้อคี่ (1, 3, 5, 7, 9) ได้คะแนนเท่ากับค่าที่ตอบลบ 1: 4, 3, 4, 3, 4 รวม 18"
        why: "ข้อคี่เป็นประโยคเชิงบวก ค่าที่สูงแปลว่าดี จึงใช้ค่าตอบลบหนึ่ง"
      - text: "ข้อคู่ (2, 4, 6, 8, 10) ได้คะแนนเท่ากับ 5 ลบค่าที่ตอบ: 4, 3, 4, 3, 4 รวม 18"
        why: "ข้อคู่เป็นประโยคเชิงลบ จึงกลับทิศทางด้วยการลบจาก 5 เพื่อให้ค่าสูงแปลว่าดีเหมือนกัน"
      - text: "ผลรวมทั้งสิบข้อ = 18 + 18 = 36"
      - text: "คะแนน SUS = 36 × 2.5 = 90 จากคะแนนเต็ม 100"
        why: "การคูณ 2.5 ทำให้ผลรวมสูงสุด 40 กลายเป็นคะแนนเต็ม 100"
    answer: "คะแนน SUS ของผู้ตอบคนนี้เท่ากับ 90 ซึ่งสูงกว่าค่าเฉลี่ยที่มักอ้างอิง"
  - { type: check, problem: computer.design.usability-evaluation.p004, prompt: "การคิดดังๆ คือการทดสอบแบบใด" }
  - type: worked-example
    title: เลือกปัญหาที่แก้ก่อนจากผลทดสอบ 12 คน
    problem: |
      ทดสอบแอปสั่งอาหารกับผู้ใช้ 12 คน พบปัญหาสามข้อ

      | ปัญหา | ความรุนแรง (0–4) | จำนวนผู้ใช้ที่เจอ (จาก 12 คน) |
      |---|---|---|
      | ปุ่มยกเลิกซ่อนอยู่ในเมนูย่อย | 4 | 9 |
      | สีตัวอักษรบนปุ่มสั่งซื้ออ่านยาก | 2 | 10 |
      | ข้อความผิดพลาดไม่บอกสาเหตุ | 3 | 5 |

      ควรแก้ปัญหาใดก่อน
    steps:
      - text: "คำนวณคะแนนรวมของแต่ละปัญหาด้วย ความรุนแรง × จำนวนผู้ใช้ที่เจอ"
        why: "ใช้ทั้งความรุนแรงและความถี่ เพื่อไม่ให้ปัญหาที่รุนแรงแต่พบน้อยหรือพบบ่อยแต่เล็กน้อยถูกมองข้าม"
      - text: "ปุ่มยกเลิก: 4 × 9 = 36, สีตัวอักษร: 2 × 10 = 20, ข้อความผิดพลาด: 3 × 5 = 15"
      - text: "เรียงจากคะแนนสูงไปต่ำ ได้ปุ่มยกเลิกก่อน แล้วสีตัวอักษร แล้วข้อความผิดพลาด"
        why: "ปุ่มยกเลิกที่ซ่อนอยู่ทำให้ผู้ใช้ติดงานที่ทำไปแล้วกลับไม่ได้ จึงมีผลรุนแรงที่สุด"
      - text: "หลังแก้ปุ่มยกเลิกแล้วต้องทดสอบซ้ำ เพราะการแก้ไขอาจกระทบส่วนอื่น"
    answer: "แก้ปุ่มยกเลิกที่ซ่อนอยู่ก่อน แล้วทดสอบซ้ำก่อนไปแก้สีตัวอักษรและข้อความผิดพลาด"
  - { type: check, problem: computer.design.usability-evaluation.p010, prompt: "ทำไมทีมจึงมองไม่เห็นปัญหาของตนเอง" }
glossary:
  - { term: ประสิทธิผล (effectiveness), definition: "ระดับที่ผู้ใช้ทำงานให้สำเร็จตามเป้าหมาย" }
  - { term: ประสิทธิภาพ (efficiency), definition: "ระดับของเวลาและความพยายามที่ผู้ใช้ต้องใช้เพื่อทำงานให้สำเร็จ" }
  - { term: เพอร์โซนา (persona), definition: "ตัวแทนผู้ใช้กลุ่มหนึ่งที่สร้างจากข้อมูลจริง ใช้ช่วยตัดสินใจในการออกแบบ" }
  - { term: การประเมินเชิงฮิวริสติก (heuristic evaluation), definition: "การให้ผู้เชี่ยวชาญตรวจการออกแบบเทียบกับหลักการใช้งานที่ยอมรับกันอย่างแพร่หลาย" }
  - { term: รูปแบบหลอกล่อ (dark pattern), definition: "การออกแบบที่ทำให้ผู้ใช้ทำสิ่งที่ไม่ได้ตั้งใจหรือเสียเปรียบ โดยเจตนาหรือโดยผลของการออกแบบ" }
flashcards:
  - { front: "ความใช้งานได้มีกี่องค์ประกอบ และคืออะไร", back: "สามองค์ประกอบ คือ ประสิทธิผล ประสิทธิภาพ และความพึงพอใจ" }
  - { front: "คำนวณคะแนน SUS อย่างไร", back: "ข้อคี่ได้ค่าตอบลบ 1 ข้อคู่ได้ 5 ลบค่าตอบ รวมสิบข้อแล้วคูณ 2.5" }
  - { front: "การคิดดังๆ (think-aloud) ทำอย่างไร", back: "ให้ผู้ใช้พูดความคิดขณะทำงาน ผู้สังเกตจดจุดที่สับสนหรือทำผิด" }
  - { front: "ควรจัดลำดับปัญหาอย่างไร", back: "ตามความรุนแรงและความถี่ แก้ปัญหาที่กระทบมากก่อนแล้วทดสอบซ้ำ" }
