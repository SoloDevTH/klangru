id: physics.dynamics.free-body-practice
subject: physics
title: { th: แผนภาพแรงในสถานการณ์ต่าง ๆ, en: Free-body diagram practice }
summary: ฝึกเขียนแผนภาพแรงเมื่อมีแรงเสียดทานร่วมกับแรงอื่น วัตถุในของเหลว และวัตถุสองชิ้นที่ชนกัน แล้วใช้แผนภาพหาแรงลัพธ์และบอกการเคลื่อนที่
difficulty: 5
minutes: 35
prerequisites: [physics.dynamics.friction, physics.matter.pressure-fluids]
encompasses:
  - { id: physics.dynamics.friction, weight: 0.4 }
  - { id: physics.matter.pressure-fluids, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: แผนภาพแรงสี่สถานการณ์
    src: fbd-cases.svg
    alt: "สี่ภาพ ลูกศรยาวตามขนาดแรง ก. กล่องบนพื้นถูกผลักให้เลื่อนด้วยความเร็วคงตัว มีน้ำหนัก W = 100 N ลง แรงปฏิกิริยาตั้งฉาก N = 100 N ขึ้น แรงผลัก 40 N ไปทางขวา แรงเสียดทาน f = 40 N ไปทางซ้าย ข. ลังบนกระบะรถที่เร่งไปทางขวา มี W = 200 N ลง N = 200 N ขึ้น และแรงเสียดทาน f = 60 N ไปทางขวาซึ่งเป็นทิศเดียวกับความเร่งของรถ ค. ลูกบอลลอยนิ่งบนผิวน้ำ มี W = 5 N ลง และแรงลอยตัว FB = 5 N ขึ้น ยาวเท่ากัน ง. ก้อนหินแขวนกับเครื่องชั่งสปริงจมในน้ำ มี W = 20 N ลง แรงตึง T = 12 N ขึ้น และแรงลอยตัว FB = 8 N ขึ้น"
    caption: "ทุกภาพแรงลัพธ์ในแนวดิ่งเป็นศูนย์ ภาพ ข เท่านั้นที่มีแรงลัพธ์แนวระดับ (แรงเสียดทาน) ทำให้ลังเร่งตามรถ"
  - type: worked-example
    title: ผลักกล่องบนพื้นที่มีแรงเสียดทาน
    problem: "ผลักกล่องมวล 20 kg ด้วยแรง 100 N ตามแนวระดับ สัมประสิทธิ์ความเสียดทานจลน์ 0.30 เขียนแผนภาพแรงและหาความเร่ง (g = 9.8 m/s²)"
    steps:
      - text: "แผนภาพแรง: น้ำหนัก $W$ ลง แรงปฏิกิริยาตั้งฉาก $N$ ขึ้น แรงผลัก $100\\ \\mathrm{N}$ ไปข้างหน้า แรงเสียดทาน $f$ ไปข้างหลัง"
      - text: "แนวดิ่งสมดุล $N = W = (20)(9.8) = 196\\ \\mathrm{N}$"
        why: "กล่องไม่ลอยขึ้นหรือจมลงพื้น ความเร่งแนวดิ่งเป็นศูนย์"
      - text: "$f = \\mu_k N = 0.30 \\times 196 = 58.8\\ \\mathrm{N}$"
      - text: "แรงลัพธ์แนวระดับ $100 - 58.8 = 41.2\\ \\mathrm{N}$ ได้ $a = \\dfrac{41.2}{20} = 2.06\\ \\mathrm{m/s^2}$"
    answer: "ความเร่ง 2.06 m/s² ไปทางที่ผลัก"
  - { type: check, problem: physics.dynamics.free-body-practice.p006, prompt: "แผนภาพไหนไม่มีแรงที่ไม่มีผู้ออกแรง" }
  - type: worked-example
    title: ก้อนหินบนก้นตู้ปลา
    problem: "ก้อนหินหนัก 15 N จมวางอยู่บนก้นตู้ปลา แรงลอยตัว 6 N พื้นตู้ดันก้อนหินขึ้นด้วยแรงเท่าใด"
    steps:
      - text: "แผนภาพแรง: น้ำหนัก $15\\ \\mathrm{N}$ ลง แรงลอยตัว $6\\ \\mathrm{N}$ ขึ้น แรงปฏิกิริยาตั้งฉากจากพื้นตู้ $N$ ขึ้น"
        why: "ก้อนหินแตะทั้งน้ำและพื้นตู้ จึงได้แรงจากทั้งสองอย่าง"
      - text: "ก้อนหินนิ่ง แรงขึ้น = แรงลง: $N + 6 = 15$"
      - text: "$N = 9\\ \\mathrm{N}$ น้อยกว่าตอนวางบนพื้นแห้ง เพราะน้ำช่วยพยุงอยู่ส่วนหนึ่ง"
    answer: "พื้นตู้ดันขึ้น 9 N"
  - { type: check, problem: physics.dynamics.free-body-practice.p008, prompt: "เขียนแผนภาพแรงของก้อนหินในน้ำก่อนคำนวณ" }
  - type: figure
    title: แรงคู่กิริยา–ปฏิกิริยาเมื่อชนกัน
    src: collision.svg
    alt: "รถเข็น A มวล 50 kg วิ่งไปทางขวาชนรถเข็น B มวล 150 kg ด้านล่างแยกแผนภาพแรงในแนวระดับของแต่ละคัน แรงที่ B ทำต่อ A ขนาด 600 N ชี้ไปทางซ้าย แรงที่ A ทำต่อ B ขนาด 600 N ชี้ไปทางขวา ลูกศรยาวเท่ากัน"
    caption: "แรงคู่นี้ขนาดเท่ากันเสมอ แต่กระทำต่อคนละคัน จึงอยู่ในแผนภาพแรงคนละภาพ"
  - type: simulation
    title: "แรงลอยตัว (PhET Buoyancy: Basics)"
    url: https://phet.colorado.edu/en/simulations/buoyancy-basics
    provider: phet
    note: "เปิดการแสดงแรง (Forces) แล้วหย่อนก้อนวัตถุชนิดต่าง ๆ ลงในน้ำ สังเกตลูกศรน้ำหนัก แรงลอยตัว และแรงจากพื้นสระ ลองดูว่าวัตถุที่ลอยนิ่งมีลูกศรน้ำหนักกับแรงลอยตัวยาวเท่ากันหรือไม่ และวัตถุที่จมมีแรงจากพื้นสระเท่าใด"
glossary:
  - { term: แผนภาพแรง, definition: "ภาพที่แยกวัตถุชิ้นเดียวออกมา แล้วเขียนลูกศรแทนแรงทุกแรงที่สิ่งอื่นกระทำต่อวัตถุนั้น" }
  - { term: แรงลัพธ์, definition: "ผลรวมของแรงทั้งหมดที่กระทำต่อวัตถุโดยคิดทิศด้วย กำหนดความเร่ง $a = \\Sigma F / m$" }
  - { term: แรงลอยตัว, definition: "แรงที่ของเหลวดันวัตถุขึ้น เท่ากับน้ำหนักของของเหลวที่ถูกแทนที่" }
  - { term: แรงตึง, definition: "แรงที่เชือก สาย หรือเครื่องชั่งสปริงดึงวัตถุ มีทิศตามแนวเชือก" }
  - { term: น้ำหนักปรากฏ, definition: "ค่าที่เครื่องชั่งอ่านได้เมื่อวัตถุจมในของเหลว เท่ากับน้ำหนักลบแรงลอยตัว" }
  - { term: คู่กิริยา–ปฏิกิริยา, definition: "แรงสองแรงที่วัตถุสองชิ้นกระทำต่อกัน ขนาดเท่ากัน ทิศตรงข้าม กระทำต่อวัตถุคนละชิ้น" }
flashcards:
  - { front: "แรงใดที่ไม่ควรอยู่ในแผนภาพแรง", back: "แรงที่วัตถุนั้นกระทำต่อสิ่งอื่น และ \"แรงของการเคลื่อนที่\" ซึ่งไม่มีผู้ออกแรง" }
  - { front: "ลังบนรถที่เร่งไปข้างหน้า แรงเสียดทานชี้ไปทางใด", back: "ไปข้างหน้า เป็นแรงที่ทำให้ลังเร่งตามรถ" }
  - { front: "วัตถุแขวนกับเครื่องชั่งสปริงจมในน้ำ สมการแรงคืออะไร", back: "$T + F_B = W$ เครื่องชั่งอ่านได้ $T = W - F_B$" }
  - { front: "วัตถุลอยนิ่ง แรงลอยตัวเทียบกับน้ำหนักอย่างไร", back: "เท่ากันพอดี" }
  - { front: "รถใหญ่ชนรถเล็ก แรงที่กระทำต่อกันเป็นอย่างไร", back: "เท่ากัน ทิศตรงข้าม แต่รถเล็กมีความเร่งมากกว่าเพราะมวลน้อยกว่า" }
