      - { match: "\\frac{44}{100}", feedback: "$\\tfrac{44}{100} = 0.44$ เป็นแค่ค่าประมาณ $0.444\\ldots$ ยังมีเลข 4 ต่อไปไม่รู้จบ" }
    solution: "ให้ $x = 0.444\\ldots$ จะได้ $10x = 4.444\\ldots$ ลบกัน: $10x - x = 4$ จึงได้ $9x = 4$ และ $x = \\tfrac{4}{9}$ ตรวจ: $4 \\div 9 = 0.444\\ldots$ ✓"
