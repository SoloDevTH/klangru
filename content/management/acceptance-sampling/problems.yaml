  - id: management.quality.acceptance-sampling.p013
    topics: [management.quality.acceptance-sampling]
    difficulty: 4
    type: numeric
    stem: "จากข้อก่อน ($N = 1{,}000$, $n = 80$, $P_a = 0.5681$ และคัดทุกชิ้นของล็อตที่ถูกปฏิเสธ) จำนวนชิ้นที่ต้องตรวจเฉลี่ยต่อล็อต (ATI) เป็นเท่าใด (ตอบเป็นจำนวนชิ้น ปัดเป็นจำนวนเต็ม)"
    answer: { value: 477, unit: ชิ้น, tolerance: 1 }
    hints:
      - "$\\text{ATI} = n + (1 - P_a)(N - n)$"
      - "$80 + 0.4319 \\times 920$"
    misconceptions:
      - { match: 80, feedback: "80 คือจำนวนตรวจเมื่อยอมรับล็อต ล็อตที่ถูกปฏิเสธต้องตรวจเพิ่มส่วนที่เหลือ" }
      - { match: 603, feedback: "ดูเหมือนคูณ $(N - n)$ ด้วย $P_a$ แทน $(1 - P_a)$ การคัดทั้งล็อตเกิดเมื่อถูกปฏิเสธ" }
    solution: "$\\text{ATI} = 80 + (1 - 0.5681)(1000 - 80) = 80 + 0.4319 \\times 920 \\approx 80 + 397.3 \\approx 477$ ชิ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.acceptance-sampling.p014
    topics: [management.quality.acceptance-sampling]
    difficulty: 5
    type: numeric
    stem: "ผู้ซื้อต้องการแผน $c = 0$ ที่ทำให้ล็อตที่มีของเสีย 5% ถูกยอมรับได้ไม่เกิน 10% ($\\beta \\le 0.10$) ขนาดตัวอย่าง $n$ ที่น้อยที่สุดคือเท่าใด (ล็อตใหญ่มาก)"
    answer: { value: 45 }
    hints:
      - "$P_a = 0.95^n \\le 0.10$"
      - "แก้ $n \\ge \\dfrac{\\ln 0.10}{\\ln 0.95}$ แล้วปัดขึ้น"
    misconceptions:
      - { match: 44, feedback: "$0.95^{44} \\approx 0.105$ ยังเกิน 0.10 ต้องปัดขึ้น" }
      - { match: 20, feedback: "นั่นคือ $1/0.05$ ซึ่งให้ $P_a = 0.95^{20} \\approx 0.36$ ยังสูงมาก" }
    solution: "$n \\ge \\dfrac{\\ln 0.10}{\\ln 0.95} = \\dfrac{-2.3026}{-0.0513} \\approx 44.9$ ปัดขึ้นเป็น 45 ตรวจ: $0.95^{45} \\approx 0.0994 \\le 0.10$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.acceptance-sampling.p015
    topics: [management.quality.acceptance-sampling]
    difficulty: 5
    type: numeric
    stem: "ล็อตอะไหล่ราคาสูงมี 40 ชิ้น ในนั้นมีชิ้นบกพร่อง 4 ชิ้น สุ่มตรวจ 5 ชิ้นโดยไม่ใส่คืน แผนคือ $c = 0$ ความน่าจะเป็นที่จะยอมรับล็อตเป็นเท่าใด (ใช้การแจกแจงไฮเพอร์จีโอเมตริก ตอบเป็นทศนิยม 4 ตำแหน่ง)"
    answer: { value: 0.5729, tolerance: 0.002 }
    hints:
      - "ต้องได้ชิ้นดีทั้ง 5 ชิ้นจากชิ้นดี 36 ชิ้น"
      - "$P_a = \\dfrac{\\binom{36}{5}}{\\binom{40}{5}}$"
    misconceptions:
      - { match: 0.5905, feedback: "นั่นคือค่าจากทวินาม ($0.9^5$) ซึ่งถือว่าหยิบแบบใส่คืน ล็อตเล็กควรใช้ไฮเพอร์จีโอเมตริก" }
      - { match: 0.4271, feedback: "นั่นคือความน่าจะเป็นที่จะปฏิเสธ" }
    solution: "$P_a = \\dfrac{\\binom{36}{5}}{\\binom{40}{5}} = \\dfrac{376{,}992}{658{,}008} \\approx 0.5729$"
