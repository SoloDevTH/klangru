<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 400" width="870" height="400" font-family="sans-serif" font-size="14">
  <title>กระบวนการจัดซื้อถึงจ่ายเงินที่แบ่งแยกหน้าที่ พร้อมจุดควบคุม</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="870" height="400" fill="#ffffff"/>
  <rect x="12.0" y="40.0" width="128.0" height="70.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="76.0" y="70.2" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">ผู้ขอซื้อ</text>
  <text x="76.0" y="88.2" text-anchor="middle" fill="#1f2937" font-size="12">ใบขอซื้อ</text>
  <line x1="140.0" y1="75.0" x2="154.0" y2="75.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="156.0" y="40.0" width="128.0" height="70.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="220.0" y="70.2" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">ผู้อนุมัติ</text>
  <text x="220.0" y="88.2" text-anchor="middle" fill="#1f2937" font-size="12">อนุมัติตามวงเงิน</text>
  <line x1="284.0" y1="75.0" x2="298.0" y2="75.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="300.0" y="40.0" width="128.0" height="70.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="364.0" y="70.2" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">ฝ่ายจัดซื้อ</text>
  <text x="364.0" y="88.2" text-anchor="middle" fill="#1f2937" font-size="12">ใบสั่งซื้อเลขเรียง</text>
  <line x1="428.0" y1="75.0" x2="442.0" y2="75.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="444.0" y="40.0" width="128.0" height="70.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="508.0" y="70.2" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">ฝ่ายรับของ</text>
  <text x="508.0" y="88.2" text-anchor="middle" fill="#1f2937" font-size="12">ใบรับของ</text>
  <line x1="572.0" y1="75.0" x2="586.0" y2="75.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="588.0" y="40.0" width="128.0" height="70.0" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="652.0" y="70.2" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">ฝ่ายบัญชี</text>
  <text x="652.0" y="88.2" text-anchor="middle" fill="#1f2937" font-size="12">จับคู่ 3 เอกสาร</text>
  <line x1="716.0" y1="75.0" x2="730.0" y2="75.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="732.0" y="40.0" width="128.0" height="70.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="796.0" y="70.2" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">ฝ่ายการเงิน</text>
  <text x="796.0" y="88.2" text-anchor="middle" fill="#1f2937" font-size="12">โอนเงินให้ผู้ขาย</text>
  <text x="76.0" y="130.0" text-anchor="middle" fill="#6b7280" font-size="12">อนุมัติ</text>
  <text x="220.0" y="130.0" text-anchor="middle" fill="#6b7280" font-size="12">อนุมัติ</text>
  <text x="364.0" y="130.0" text-anchor="middle" fill="#6b7280" font-size="12">ดูแลทรัพย์สิน</text>
  <text x="508.0" y="130.0" text-anchor="middle" fill="#6b7280" font-size="12">ดูแลทรัพย์สิน</text>
  <text x="652.0" y="130.0" text-anchor="middle" fill="#6b7280" font-size="12">บันทึก</text>
  <text x="796.0" y="130.0" text-anchor="middle" fill="#6b7280" font-size="12">ดูแลเงิน</text>
  <text x="435.0" y="24.0" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">หน้าที่ต่างกันทำโดยคนต่างกัน: อนุมัติ · ดูแลทรัพย์สิน · บันทึกบัญชี · กระทบยอด</text>
  <rect x="175.0" y="165.0" width="520.0" height="92.0" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="435.0" y="190.0" text-anchor="middle" fill="#1f2937" font-size="13.5" font-weight="bold">จับคู่ 3 เอกสารก่อนตั้งหนี้</text>
  <text x="435.0" y="214.0" text-anchor="middle" fill="#1f2937" font-size="12.5">ใบสั่งซื้อ (สั่งอะไร ราคาเท่าไร) · ใบรับของ (ได้รับจริงเท่าไร)</text>
  <text x="435.0" y="236.0" text-anchor="middle" fill="#1f2937" font-size="12.5">ใบแจ้งหนี้ของผู้ขาย (เรียกเก็บเท่าไร) ต้องตรงกันทั้งสามใบ</text>
  <path d="M702,110 L702,150 L690,165" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <rect x="40.0" y="285.0" width="250.0" height="92.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="165.0" y="317.2" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">กระทบยอดอิสระ</text>
  <text x="165.0" y="335.2" text-anchor="middle" fill="#1f2937" font-size="12">ผู้ที่ไม่ได้จ่ายเงินและไม่ได้บันทึก</text>
  <text x="165.0" y="353.2" text-anchor="middle" fill="#1f2937" font-size="12">เทียบบัญชีกับรายการเดินบัญชีธนาคาร</text>
  <rect x="310.0" y="285.0" width="250.0" height="92.0" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="435.0" y="317.2" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">ผู้ขายรายใหม่</text>
  <text x="435.0" y="335.2" text-anchor="middle" fill="#1f2937" font-size="12">ต้องอนุมัติก่อนเพิ่มในระบบ</text>
  <text x="435.0" y="353.2" text-anchor="middle" fill="#1f2937" font-size="12">ตรวจเลขบัญชีกับเอกสารจริง</text>
  <rect x="580.0" y="285.0" width="250.0" height="92.0" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="705.0" y="317.2" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">สิทธิในระบบ</text>
  <text x="705.0" y="335.2" text-anchor="middle" fill="#1f2937" font-size="12">ผู้สั่งซื้อแก้ข้อมูลผู้ขายไม่ได้</text>
  <text x="705.0" y="353.2" text-anchor="middle" fill="#1f2937" font-size="12">ผู้จ่ายเงินแก้บัญชีไม่ได้</text>
</svg>
