<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="sans-serif">
<title>อนุมาน หลักฐานในเรื่องรวมกับความรู้เดิม ได้ข้อสรุป</title>
<defs></defs>
<rect x="0" y="0" width="860" height="300" fill="#fff"/>
<text x="20.0" y="32.0" font-size="20" text-anchor="start" fill="#1f5fbf" font-weight="bold">อนุมาน = หลักฐานในเรื่อง + ความรู้เดิม</text>
<rect x="20.0" y="60.0" width="220.0" height="170.0" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="130.0" y="94.0" font-size="19" text-anchor="middle" fill="#1565c0" font-weight="bold">หลักฐานในเรื่อง</text>
<text x="130.0" y="140.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">รองเท้าเปียกโคลน</text>
<text x="130.0" y="174.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">ร่มยังมีน้ำหยด</text>
<rect x="320.0" y="60.0" width="220.0" height="170.0" rx="12" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
<text x="430.0" y="94.0" font-size="19" text-anchor="middle" fill="#e65100" font-weight="bold">ความรู้เดิม</text>
<text x="430.0" y="140.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">ฝนตกทำให้พื้นเป็นโคลน</text>
<text x="430.0" y="174.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">คนกางร่มเมื่อฝนตก</text>
<rect x="620.0" y="60.0" width="220.0" height="170.0" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="730.0" y="94.0" font-size="19" text-anchor="middle" fill="#2e7d32" font-weight="bold">ข้อสรุป (อนุมาน)</text>
<text x="730.0" y="140.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">ข้างนอกฝนเพิ่งตก</text>
<text x="730.0" y="174.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">(เรื่องไม่ได้บอกตรง ๆ)</text>
<text x="280.0" y="155.0" font-size="40" text-anchor="middle" fill="#111" font-weight="bold">+</text>
<text x="580.0" y="155.0" font-size="40" text-anchor="middle" fill="#111" font-weight="bold">=</text>
<text x="430.0" y="272.0" font-size="16" text-anchor="middle" fill="#c62828" font-weight="normal">ถ้าไม่มีหลักฐานในเรื่องรองรับ = การเดา ไม่ใช่การอนุมาน</text>
</svg>
