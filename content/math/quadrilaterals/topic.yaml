id: math.geometry.quadrilaterals
subject: math
title: { th: รูปสี่เหลี่ยมชนิดต่าง ๆ, en: Types of quadrilaterals }
summary: จำแนกสี่เหลี่ยมจัตุรัส ผืนผ้า ด้านขนาน ขนมเปียกปูน รูปว่าว และคางหมูจากด้าน มุม และเส้นทแยงมุม แล้วหาความยาวรอบรูปและพื้นที่
difficulty: 2.5
minutes: 35
prerequisites: [math.geometry.angles, math.geometry.area-perimeter]
encompasses:
  - { id: math.geometry.area-perimeter, weight: 0.3 }
  - { id: math.geometry.angles, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: quad-family.svg
    alt: "แผนผังครอบครัวของรูปสี่เหลี่ยม รูปสี่เหลี่ยมอยู่บนสุด มีลูกศรไปยังสี่เหลี่ยมคางหมู สี่เหลี่ยมด้านขนาน และรูปว่าว สี่เหลี่ยมด้านขนานมีลูกศรไปยังสี่เหลี่ยมผืนผ้าและสี่เหลี่ยมขนมเปียกปูน รูปว่าวมีลูกศรไปยังสี่เหลี่ยมขนมเปียกปูนด้วย สี่เหลี่ยมผืนผ้าและสี่เหลี่ยมขนมเปียกปูนมีลูกศรมาพบกันที่สี่เหลี่ยมจัตุรัสด้านล่างสุด"
    caption: "ชนิดที่อยู่ล่างมีสมบัติทุกข้อของชนิดที่ลูกศรชี้มาหา จัตุรัสจึงเป็นทั้งผืนผ้า ขนมเปียกปูน ด้านขนาน และว่าว"
  - { type: check, problem: math.geometry.quadrilaterals.p005, prompt: "ลองหาตัวอย่างค้าน" }
  - type: figure
    src: diagonal-area.svg
    alt: "สี่เหลี่ยมขนมเปียกปูนและรูปว่าว แต่ละรูปมีเส้นทแยงมุม d1 แนวนอนและ d2 แนวตั้งตัดกันเป็นมุมฉาก และมีกรอบสี่เหลี่ยมผืนผ้าเส้นประกว้าง d1 สูง d2 ล้อมรอบ รูปแต่ละรูปกินพื้นที่ครึ่งหนึ่งของกรอบ"
    caption: "รูปขนมเปียกปูนและรูปว่าวกินพื้นที่ครึ่งหนึ่งของกรอบ $d_1 \\times d_2$ จึงได้พื้นที่ $\\tfrac12 d_1 d_2$"
  - type: worked-example
    title: จำแนกรูปสี่เหลี่ยมจากสมบัติ
    problem: "รูปสี่เหลี่ยมรูปหนึ่งมีด้านยาว 5, 5, 5, 5 cm และมีมุม $60^\\circ, 120^\\circ, 60^\\circ, 120^\\circ$ ตามลำดับ บอกชื่อทุกชนิดที่รูปนี้เป็น"
    steps:
      - text: "มุมตรงข้ามเท่ากันทั้งสองคู่ และมุมที่อยู่ติดกันรวมกันได้ $180^\\circ$ จึงเป็นสี่เหลี่ยมด้านขนาน"
        why: "เมื่อมุมที่ติดกันรวมกันได้ $180^\\circ$ ด้านตรงข้ามจะขนานกัน (มุมภายในบนข้างเดียวกันของเส้นตัด)"
      - text: "ด้านยาวเท่ากันทั้งสี่ด้าน จึงเป็นสี่เหลี่ยมขนมเปียกปูน และเป็นรูปว่าวด้วย"
      - text: "ไม่มีมุมฉาก จึงไม่ใช่สี่เหลี่ยมผืนผ้าและไม่ใช่จัตุรัส"
      - text: "มีด้านขนานสองคู่ จึงไม่ใช่คางหมูตามนิยาม \"ขนานเพียงคู่เดียว\""
    answer: "สี่เหลี่ยมขนมเปียกปูน ซึ่งเป็นสี่เหลี่ยมด้านขนานและรูปว่าวด้วย"
  - type: worked-example
    title: พื้นที่สี่เหลี่ยมขนมเปียกปูนสองวิธี
    problem: "สี่เหลี่ยมขนมเปียกปูนมีเส้นทแยงมุมยาว $6\\ \\mathrm{cm}$ และ $8\\ \\mathrm{cm}$ และยาวด้านละ $5\\ \\mathrm{cm}$ หาความยาวรอบรูป พื้นที่ และความสูงเมื่อใช้ด้านหนึ่งเป็นฐาน"
    steps:
      - text: "ความยาวรอบรูป $= 4 \\times 5 = 20\\ \\mathrm{cm}$"
      - text: "พื้นที่จากเส้นทแยงมุม $= \\tfrac12 \\times 6 \\times 8 = 24\\ \\mathrm{cm^2}$"
      - text: "ขนมเปียกปูนเป็นสี่เหลี่ยมด้านขนาน จึงมีพื้นที่ $=$ ฐาน $\\times$ สูง ด้วย: $5 \\times h = 24$"
        why: "พื้นที่ของรูปเดียวกันต้องเท่ากันไม่ว่าคิดด้วยวิธีใด"
      - text: "$h = 24 \\div 5 = 4.8\\ \\mathrm{cm}$"
    answer: "ความยาวรอบรูป $20\\ \\mathrm{cm}$ พื้นที่ $24\\ \\mathrm{cm^2}$ ความสูง $4.8\\ \\mathrm{cm}$"
  - { type: check, problem: math.geometry.quadrilaterals.p009, prompt: "ใช้สมบัติของเส้นทแยงมุม" }
glossary:
  - { term: สี่เหลี่ยมด้านขนาน, definition: "รูปสี่เหลี่ยมที่มีด้านตรงข้ามขนานกันสองคู่" }
  - { term: สี่เหลี่ยมขนมเปียกปูน, definition: "สี่เหลี่ยมด้านขนานที่มีด้านยาวเท่ากันทั้งสี่ด้าน" }
  - { term: รูปว่าว, definition: "รูปสี่เหลี่ยมที่มีด้านที่อยู่ติดกันยาวเท่ากันสองคู่ เส้นทแยงมุมตั้งฉากกัน" }
  - { term: สี่เหลี่ยมคางหมู, definition: "รูปสี่เหลี่ยมที่มีด้านขนานกันเพียงคู่เดียว (บางตำรานิยามว่าอย่างน้อยหนึ่งคู่)" }
  - { term: เส้นทแยงมุม, definition: "ส่วนของเส้นตรงที่เชื่อมจุดยอดสองจุดที่ไม่อยู่ติดกัน" }
flashcards:
  - { front: "พื้นที่สี่เหลี่ยมขนมเปียกปูนและรูปว่าว", back: "$\\tfrac12 \\times d_1 \\times d_2$ (ครึ่งหนึ่งของผลคูณเส้นทแยงมุม)" }
  - { front: "พื้นที่สี่เหลี่ยมด้านขนาน", back: "ฐาน × ความสูง (ความสูงตั้งฉากกับฐาน ไม่ใช่ด้านเอียง)" }
  - { front: "สี่เหลี่ยมจัตุรัสเป็นสี่เหลี่ยมผืนผ้าหรือไม่", back: "เป็น เพราะมีมุมฉากสี่มุมและด้านตรงข้ามขนาน ครบทุกสมบัติของผืนผ้า" }
  - { front: "เส้นทแยงมุมของสี่เหลี่ยมด้านขนาน ผืนผ้า ขนมเปียกปูน", back: "ด้านขนาน: แบ่งครึ่งกัน ผืนผ้า: แบ่งครึ่งกันและยาวเท่ากัน ขนมเปียกปูน: แบ่งครึ่งกันและตั้งฉาก" }
