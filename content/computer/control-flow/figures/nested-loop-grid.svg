<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="680" height="310" font-family="sans-serif" font-size="15">
  <title>ลำดับการทำงานของลูปซ้อนเป็นตาราง 3 แถว 4 คอลัมน์</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15211e"/></marker></defs>
  <rect x="0" y="0" width="680" height="310" fill="#ffffff"/>
  <text x="340" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#15211e">ลำดับการทำงานของลูปซ้อน 3 × 4</text>
  <text x="192.0" y="58" text-anchor="middle" font-size="14" font-weight="normal" fill="#15211e">j = 1</text>
  <text x="276.0" y="58" text-anchor="middle" font-size="14" font-weight="normal" fill="#15211e">j = 2</text>
  <text x="360.0" y="58" text-anchor="middle" font-size="14" font-weight="normal" fill="#15211e">j = 3</text>
  <text x="444.0" y="58" text-anchor="middle" font-size="14" font-weight="normal" fill="#15211e">j = 4</text>
  <text x="136" y="101.0" text-anchor="end" font-size="14" font-weight="normal" fill="#15211e">i = 1</text>
  <rect x="150" y="70" width="84" height="52" fill="#b5562b" stroke="#15211e" stroke-width="2"/>
