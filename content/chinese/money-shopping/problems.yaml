- id: chinese.vocab.money-shopping.p013
  topics:
  - chinese.vocab.money-shopping
  difficulty: 4
  type: numeric
  stem: ร้านทุเรียนในจันทบุรีติดป้ายสำหรับลูกค้าชาวจีนว่า 榴莲一斤八十块 (ราคาสมมติ 80 บาทต่อ 斤 และ 1 斤 = 500 กรัม) ลูกค้าซื้อทุเรียนหนัก 3 กิโลกรัม ต้องจ่ายกี่บาท
  answer:
    value: 480
    unit: บาท
  misconceptions:
  - match: 240
    feedback: 1 斤 = ครึ่งกิโลกรัม ไม่ใช่ 1 กิโลกรัม 3 กิโลกรัมจึงเท่ากับ 6 斤
  hints:
  - 1 กิโลกรัม = 1000 กรัม = 2 斤
  - เปลี่ยน 3 กิโลกรัมเป็น 斤 ก่อน แล้วคูณราคาต่อ 斤
  solution: 3 กิโลกรัม = $3 \times 2 = 6$ 斤 · ราคา $6 \times 80 = 480$ บาท
