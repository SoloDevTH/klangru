    stem: "นักสเกต ก (มวล $60\\ \\mathrm{kg}$) ผลักนักสเกต ข (มวล $40\\ \\mathrm{kg}$) ด้วยแรง $120\\ \\mathrm{N}$ บนลานน้ำแข็งลื่น ขณะผลัก นักสเกต ข มีความเร่งเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s²)"
    answer: { value: 3, tolerance: 0.03, unit: m/s² }
    hints:
      - "แรงที่กระทำต่อ ข คือ $120\\ \\mathrm{N}$"
      - "ใช้มวลของ ข เอง $a = \\dfrac{F}{m_ข}$"
    misconceptions:
      - { match: 2, feedback: "นั่นคือความเร่งของ ก ($\\tfrac{120}{60}$) ข ได้รับแรงเท่ากันแต่มวลน้อยกว่า ความเร่งจึงมากกว่า" }
      - { match: 1.2, feedback: "ดูเหมือนหารด้วยมวลรวม แต่ทั้งสองไม่ได้เคลื่อนที่ไปด้วยกัน แต่ละคนเร่งไปคนละทางตามแรงที่ได้รับ" }
    solution: "$a_ข = \\dfrac{120}{40} = 3\\ \\mathrm{m/s^2}$ ส่วน ก ได้รับแรง $120\\ \\mathrm{N}$ ทิศตรงข้าม จึงมี $a_ก = \\dfrac{120}{60} = 2\\ \\mathrm{m/s^2}$"
