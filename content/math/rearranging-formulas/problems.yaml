problems:
  - id: math.rearr.p001
    topics: [math.algebra.rearrange-formula]
    difficulty: 1
    type: mcq
    stem: "จัดสูตร $v = \\dfrac{s}{t}$ ให้ $s$ อยู่ข้างเดียว ได้ข้อใด"
    choices:
      - { id: a, text: "$s = vt$", correct: true }
      - { id: b, text: "$s = \\dfrac{v}{t}$", feedback: "$s$ ถูก **หาร** ด้วย $t$ อยู่ จึงต้อง **คูณ** $t$ ทั้งสองข้าง ไม่ใช่หาร" }
      - { id: c, text: "$s = \\dfrac{t}{v}$", feedback: "ลองตรวจด้วยตัวเลข: วิ่ง 60 กม. ใน 2 ชม. ได้ $v = 30$ แต่ $\\tfrac{t}{v} = \\tfrac{2}{30}$ ไม่ใช่ 60" }
      - { id: d, text: "$s = v + t$", feedback: "ตรงข้ามของการหารคือการคูณ ไม่ใช่การบวก" }
    hints:
      - "$s$ ถูกทำอะไรอยู่ในสูตรนี้"
      - "$s$ ถูกหารด้วย $t$ การดำเนินการผกผันของการหารคือการคูณ ให้คูณ $t$ ทั้งสองข้าง"
    solution: "คูณ $t$ ทั้งสองข้าง: $v \\times t = \\dfrac{s}{t} \\times t$ จึงได้ $s = vt$ ตรวจ: $v = 30$, $t = 2$ ได้ $s = 60$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rearr.p002
    topics: [math.algebra.rearrange-formula]
    difficulty: 2
    type: numeric
    stem: "รถไฟวิ่งระยะทาง 72 กิโลเมตร ด้วยอัตราเร็วเฉลี่ย 48 กิโลเมตรต่อชั่วโมง ใช้เวลากี่ชั่วโมง (ใช้สูตร $v = \\dfrac{s}{t}$)"
    answer: { value: 1.5, tolerance: 0.01, unit: ชั่วโมง }
    hints:
      - "โจทย์ถามเวลา จึงต้องจัดสูตรให้ $t$ อยู่ข้างเดียวก่อน"
      - "คูณ $t$ ทั้งสองข้างได้ $vt = s$ แล้วหาร $v$ ทั้งสองข้าง"
      - "ได้ $t = \\dfrac{s}{v}$ แทน $s$ ด้วยระยะทาง และ $v$ ด้วยอัตราเร็ว"
    misconceptions:
      - { match: 3456, feedback: "ดูเหมือนนำระยะทางคูณอัตราเร็ว ลองจัดสูตรให้ $t$ อยู่ข้างเดียวก่อน จะได้ $t = \\tfrac{s}{v}$" }
      - { match: 0.667, feedback: "ดูเหมือนคิด $\\tfrac{v}{s}$ กลับด้าน ที่ถูกคือ $t = \\tfrac{s}{v}$ ตรวจหน่วย: กิโลเมตร ÷ (กิโลเมตรต่อชั่วโมง) = ชั่วโมง" }
    solution: "จัดรูป: $v = \\dfrac{s}{t}$ → $vt = s$ → $t = \\dfrac{s}{v}$ แทนค่า $t = \\dfrac{72}{48} = 1.5$ ชั่วโมง (1 ชั่วโมง 30 นาที) ตรวจ: $48 \\times 1.5 = 72$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rearr.p003
    topics: [math.algebra.rearrange-formula]
    difficulty: 2
    type: expression
    stem: "สูตรพื้นที่สามเหลี่ยมคือ $A = \\tfrac{1}{2}bh$ จัดสูตรให้ $h$ อยู่ข้างเดียว"
    prefix: "h ="
    answer: { latex: "\\frac{2A}{b}", variables: [A, b] }
    hints:
      - "เริ่มจากกำจัดเศษส่วน $\\tfrac{1}{2}$ ออกก่อน"
      - "คูณ 2 ทั้งสองข้าง ได้ $2A = bh$"
      - "ตอนนี้ $h$ ถูกคูณด้วย $b$ ให้ทำตรงข้ามกับการคูณทั้งสองข้าง"
    misconceptions:
      - { match: "\\frac{A}{2b}", feedback: "ดูเหมือนหาร 2 แทนการคูณ 2 ตรงข้ามของการคูณ $\\tfrac{1}{2}$ คือการคูณ 2 ทั้งสองข้าง" }
      - { match: "2Ab", feedback: "$h$ ถูกคูณด้วย $b$ จึงต้อง **หาร** $b$ ทั้งสองข้าง ไม่ใช่คูณ" }
    solution: "คูณ 2 ทั้งสองข้าง: $2A = bh$ แล้วหาร $b$ ทั้งสองข้าง: $h = \\dfrac{2A}{b}$ ตรวจ: ฐาน 6 สูง 4 พื้นที่ 12 แทนได้ $h = \\tfrac{24}{6} = 4$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rearr.p004
    topics: [math.algebra.rearrange-formula]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการจัดสูตร $F = \\dfrac{9C}{5} + 32$ ให้ $C$ อยู่ข้างเดียว"
    items:
      - "ลบ 32 ทั้งสองข้าง: $F - 32 = \\dfrac{9C}{5}$"
      - "คูณ 5 ทั้งสองข้าง: $5(F - 32) = 9C$"
      - "หาร 9 ทั้งสองข้าง: $C = \\dfrac{5(F - 32)}{9}$"
      - "ตรวจ: แทน $F = 212$ ได้ $C = \\dfrac{5(180)}{9} = 100$ ✓"
    hints:
      - "ไล่ดูว่า $C$ ถูกทำอะไรบ้างตามลำดับ: คูณ 9 → หาร 5 → บวก 32"
      - "ชั้นที่ทำทีหลังสุดต้องแกะออกก่อน"
      - "ขั้นแรกจึงเป็นการกำจัด $+32$ และขั้นสุดท้ายคือตรวจคำตอบด้วยตัวเลข"
    solution: "แกะย้อนจากชั้นนอกสุด: ลบ 32 → คูณ 5 → หาร 9 ได้ $C = \\dfrac{5(F - 32)}{9}$ แล้วตรวจด้วยจุดเดือดของน้ำ $212$ °F $= 100$ °C"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rearr.p005
    topics: [math.algebra.rearrange-formula]
    difficulty: 3
    type: numeric
    stem: "วันที่อากาศร้อนจัดในกรุงเทพฯ แอปพยากรณ์อากาศของนักท่องเที่ยวแสดงอุณหภูมิ $95$ °F อุณหภูมินี้เท่ากับกี่องศาเซลเซียส (สูตร $F = \\dfrac{9C}{5} + 32$)"
    answer: { value: 35, unit: "°C" }
    hints:
      - "จัดสูตรให้ $C$ อยู่ข้างเดียวก่อน แล้วค่อยแทนค่า"
      - "ได้ $C = \\dfrac{5(F - 32)}{9}$"
      - "ลบ 32 ออกจาก 95 ก่อน แล้วคูณ 5 และหาร 9"
    misconceptions:
      - { match: 52.778, feedback: "ดูเหมือนลืมลบ 32 ก่อนคูณ $\\tfrac{5}{9}$ ต้องคำนวณ $95 - 32$ ก่อน" }
      - { match: 20.778, feedback: "ดูเหมือนคูณ $\\tfrac{5}{9}$ ก่อนแล้วค่อยลบ 32 ลำดับผิด ต้องลบ 32 ก่อนเพราะเป็นชั้นนอกสุด" }
    solution: "$C = \\dfrac{5(F - 32)}{9} = \\dfrac{5(95 - 32)}{9} = \\dfrac{5 \\times 63}{9} = \\dfrac{315}{9} = 35$ °C ตรวจ: $\\tfrac{9(35)}{5} + 32 = 63 + 32 = 95$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rearr.p006
    topics: [math.algebra.rearrange-formula]
    difficulty: 4
    type: numeric
    stem: "รถกระบะวิ่งบนถนนด้วยอัตราเร็ว $u = 5$ m/s แล้วเร่งเครื่องด้วยความเร่ง $a = 4$ m/s² จนมีอัตราเร็ว $v = 25$ m/s ใช้เวลากี่วินาที (สูตร $v = u + at$)"
    answer: { value: 5, unit: วินาที }
    hints:
      - "จัดสูตรให้ $t$ อยู่ข้างเดียว: $t$ ถูกคูณด้วย $a$ แล้วบวก $u$"
      - "แกะชั้นนอกก่อน: ลบ $u$ ทั้งสองข้าง ได้ $v - u = at$"
      - "จากนั้นหาร $a$ ทั้งสองข้าง ได้ $t = \\dfrac{v - u}{a}$ แล้วแทนค่า"
    misconceptions:
      - { match: 1.25, feedback: "ดูเหมือนหาร $a$ ก่อนลบ $u$ (คิด $\\tfrac{v}{a} - u$) ต้องลบ $u$ ทั้งสองข้างก่อน แล้วจึงหาร $a$ ทั้งก้อน $v - u$" }
      - { match: 7.5, feedback: "ดูเหมือนบวก $u$ แทนที่จะลบ จาก $v = u + at$ ต้องลบ $u$ ทั้งสองข้าง ได้ $v - u = at$" }
    solution: "$v = u + at$ → ลบ $u$: $v - u = at$ → หาร $a$: $t = \\dfrac{v - u}{a} = \\dfrac{25 - 5}{4} = \\dfrac{20}{4} = 5$ วินาที ตรวจ: $5 + 4(5) = 25$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rearr.p007
    topics: [math.algebra.rearrange-formula]
    difficulty: 4
    type: expression
    stem: "เส้นรอบรูปของแปลงผักรูปสี่เหลี่ยมผืนผ้าคือ $P = 2(l + w)$ เมื่อ $l$ คือความยาว และ $w$ คือความกว้าง จัดสูตรให้ $w$ อยู่ข้างเดียว"
    prefix: "w ="
    answer: { latex: "\\frac{P}{2} - l", variables: [P, l] }
    hints:
      - "$w$ อยู่ในวงเล็บที่ถูกคูณด้วย 2 ให้แกะการคูณ 2 ออกก่อน"
      - "หาร 2 ทั้งสองข้าง ได้ $\\dfrac{P}{2} = l + w$"
      - "ตอนนี้ $w$ ถูกบวกด้วย $l$ ให้ทำตรงข้ามกับการบวกทั้งสองข้าง"
    misconceptions:
      - { match: "\\frac{P - l}{2}", feedback: "ดูเหมือนลบ $l$ ก่อนหาร 2 แต่ $l$ อยู่ในวงเล็บที่ถูกคูณ 2 จึงลบ $l$ ตรง ๆ ไม่ได้ ให้หาร 2 ทั้งสองข้างก่อน" }
      - { match: "P - 2l", feedback: "ใกล้แล้ว แต่ $P - 2l$ คือ $2w$ ยังต้องหาร 2 อีกครั้ง" }
      - { match: "\\frac{P}{2} + l", feedback: "จาก $\\tfrac{P}{2} = l + w$ ต้อง **ลบ** $l$ ทั้งสองข้าง ไม่ใช่บวก" }
    solution: "หาร 2 ทั้งสองข้าง: $\\dfrac{P}{2} = l + w$ แล้วลบ $l$ ทั้งสองข้าง: $w = \\dfrac{P}{2} - l$ (หรือเขียนเป็น $w = \\dfrac{P - 2l}{2}$ ก็ถูกเช่นกัน) ตรวจ: แปลงยาว 7 กว้าง 5 มี $P = 24$ แทนได้ $w = 12 - 7 = 5$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rearr.p008
    topics: [math.algebra.rearrange-formula]
    difficulty: 5
    type: numeric
    stem: "ในวงจรไฟฟ้าที่ต่อแบตเตอรี่กับหลอดไฟ กระแสไฟฟ้าหาได้จากสูตร $I = \\dfrac{V}{R + r}$ เมื่อ $V$ คือแรงเคลื่อนไฟฟ้าของแบตเตอรี่ $R$ คือความต้านทานของหลอดไฟ และ $r$ คือความต้านทานภายในแบตเตอรี่ ถ้า $V = 12$ V, $I = 2$ A และ $r = 0.5$ Ω หลอดไฟมีความต้านทาน $R$ กี่โอห์ม"
    answer: { value: 5.5, tolerance: 0.01, unit: "Ω" }
    hints:
      - "$R$ อยู่ในตัวส่วน ให้คูณ $(R + r)$ ทั้งสองข้างเพื่อนำออกจากตัวส่วนก่อน"
      - "ได้ $I(R + r) = V$ แล้วหาร $I$ ทั้งสองข้าง ได้ $R + r = \\dfrac{V}{I}$"
      - "ขั้นสุดท้ายแกะ $r$ ที่บวกอยู่ออก แล้วแทนค่าตัวเลข"
    misconceptions:
      - { match: 6.5, feedback: "จาก $R + r = \\tfrac{V}{I}$ ต้อง **ลบ** $r$ ทั้งสองข้าง ไม่ใช่บวก" }
      - { match: 6, feedback: "$\\tfrac{V}{I} = 6$ คือความต้านทานรวม $R + r$ ยังต้องลบความต้านทานภายใน $r$ ออกอีก" }
    solution: "คูณ $(R + r)$: $I(R + r) = V$ → หาร $I$: $R + r = \\dfrac{V}{I}$ → ลบ $r$: $R = \\dfrac{V}{I} - r = \\dfrac{12}{2} - 0.5 = 6 - 0.5 = 5.5$ Ω ตรวจ: $\\dfrac{12}{5.5 + 0.5} = \\dfrac{12}{6} = 2$ A ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rearr.p009
    topics: [math.algebra.rearrange-formula]
    difficulty: 4
    type: expression
    stem: "ในฟิสิกส์มีสูตร $v^2 = u^2 + 2as$ จัดสูตรให้ $s$ อยู่ข้างเดียว"
    prefix: "s ="
    answer: { latex: "\\frac{v^2 - u^2}{2a}", variables: [v, u, a] }
    hints:
      - "$s$ ถูกคูณด้วย $2a$ แล้วบวกด้วย $u^2$ ให้แกะชั้นนอกสุดออกก่อน"
      - "ลบ $u^2$ ทั้งสองข้าง ได้ $v^2 - u^2 = 2as$"
      - "จากนั้นหารทั้งสองข้างด้วย $2a$ ทั้งก้อน"
    misconceptions:
      - { match: "\\frac{v^2 - u^2}{a}", feedback: "ลืมหารด้วย 2 สังเกตว่า $s$ ถูกคูณด้วย $2a$ ไม่ใช่แค่ $a$" }
      - { match: "\\frac{v^2 + u^2}{2a}", feedback: "ตอนย้าย $u^2$ ต้อง **ลบ** $u^2$ ทั้งสองข้าง ไม่ใช่บวก" }
      - { match: "\\frac{v^2}{2a} - u^2", feedback: "ดูเหมือนหาร $2a$ ก่อนลบ $u^2$ ต้องลบ $u^2$ ทั้งสองข้างก่อน แล้วจึงหาร $2a$ ทั้งก้อน $v^2 - u^2$" }
    solution: "ลบ $u^2$ ทั้งสองข้าง: $v^2 - u^2 = 2as$ แล้วหาร $2a$ ทั้งสองข้าง: $s = \\dfrac{v^2 - u^2}{2a}$ ตรวจ: $u = 10$, $v = 30$, $a = 4$ ได้ $s = \\dfrac{900 - 100}{8} = 100$ และ $10^2 + 2(4)(100) = 900 = 30^2$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rearr.p010
    topics: [math.algebra.rearrange-formula]
    difficulty: 3
    type: numeric
    stem: "สมมติว่าการไฟฟ้าคิดค่าไฟของบ้านหลังหนึ่งแบบง่าย ๆ ด้วยสูตร $C = 4n + 38$ เมื่อ $C$ คือค่าไฟ (บาท) และ $n$ คือจำนวนหน่วยที่ใช้ เดือนนี้ค่าไฟ 618 บาท บ้านนี้ใช้ไฟกี่หน่วย"
    answer: { value: 145, unit: หน่วย }
    hints:
      - "โจทย์ถามจำนวนหน่วย จัดสูตรให้ $n$ อยู่ข้างเดียวก่อน"
      - "ลบ 38 ทั้งสองข้าง ได้ $C - 38 = 4n$"
      - "หาร 4 ทั้งสองข้าง ได้ $n = \\dfrac{C - 38}{4}$ แล้วแทน $C = 618$"
    misconceptions:
      - { match: 164, feedback: "ดูเหมือนบวก 38 แทนที่จะลบ ค่าบริการ 38 บาทรวมอยู่ใน 618 บาทแล้ว จึงต้องลบออก" }
      - { match: 116.5, feedback: "ดูเหมือนหาร 4 ก่อนแล้วค่อยลบ 38 ต้องลบ 38 ทั้งสองข้างก่อน แล้วหาร 4 ทั้งก้อน $C - 38$" }
    solution: "$n = \\dfrac{C - 38}{4} = \\dfrac{618 - 38}{4} = \\dfrac{580}{4} = 145$ หน่วย ตรวจ: $4(145) + 38 = 580 + 38 = 618$ บาท ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rearr.p011
    topics: [math.algebra.rearrange-formula]
    difficulty: 1
    type: expression
    stem: "เส้นรอบรูปของสี่เหลี่ยมจัตุรัสคือ $P = 4s$ เมื่อ $s$ คือความยาวด้าน จัดสูตรให้ $s$ อยู่ข้างเดียว"
    prefix: "s ="
    answer: { latex: "\\frac{P}{4}", variables: [P] }
    hints:
      - "$s$ ถูกคูณด้วย 4"
      - "แกะการคูณด้วยการหาร 4 ทั้งสองข้าง"
    misconceptions:
      - { match: "4P", feedback: "$s$ ถูกคูณด้วย 4 จึงต้องหารด้วย 4 ไม่ใช่คูณ ลองตรวจ: ด้าน 5 ได้ $P = 20$ แต่ $4 \\times 20 = 80$ ไม่ใช่ 5" }
      - { match: "P-4", feedback: "4 คูณอยู่กับ $s$ ไม่ได้บวกอยู่ จึงแกะด้วยการหาร ไม่ใช่การลบ" }
    solution: "$P = 4s$ หาร 4 ทั้งสองข้าง ได้ $s = \\dfrac{P}{4}$ ตรวจ: ด้าน 5 ได้ $P = 20$ และ $\\tfrac{20}{4} = 5$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rearr.p012
    topics: [math.algebra.rearrange-formula]
    difficulty: 1
    type: mcq
    stem: "กฎข้อที่สองของนิวตันคือ $F = ma$ จัดสูตรให้ความเร่ง $a$ อยู่ข้างเดียว ได้ข้อใด"
    choices:
      - { id: a, text: "$a = \\dfrac{F}{m}$", correct: true }
      - { id: b, text: "$a = Fm$", feedback: "$a$ ถูกคูณด้วย $m$ จึงต้องหารด้วย $m$ ไม่ใช่คูณ" }
      - { id: c, text: "$a = \\dfrac{m}{F}$", feedback: "กลับเศษกับส่วน หาร $m$ ทั้งสองข้างของ $F = ma$ ได้ $\\tfrac{F}{m} = a$" }
      - { id: d, text: "$a = F - m$", feedback: "$m$ คูณอยู่กับ $a$ ไม่ได้บวกอยู่ จึงแกะด้วยการหาร" }
    hints:
      - "ใน $F = ma$ ตัวแปร $a$ ถูกคูณด้วยอะไร"
      - "หารสิ่งนั้นทั้งสองข้าง"
    solution: "หาร $m$ ทั้งสองข้าง: $\\dfrac{F}{m} = a$ ตรวจ: $m = 2$, $a = 3$ ได้ $F = 6$ และ $\\tfrac{6}{2} = 3$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rearr.p013
    topics: [math.algebra.rearrange-formula]
    difficulty: 2
    type: expression
    stem: "กฎของโอห์มคือ $V = IR$ เมื่อ $V$ คือความต่างศักย์ $I$ คือกระแสไฟฟ้า และ $R$ คือความต้านทาน จัดสูตรให้ $R$ อยู่ข้างเดียว"
    prefix: "R ="
    answer: { latex: "\\frac{V}{I}", variables: [V, I] }
    hints:
      - "$R$ ถูกคูณด้วย $I$"
      - "หาร $I$ ทั้งสองข้าง"
    misconceptions:
      - { match: "VI", feedback: "$R$ ถูกคูณด้วย $I$ จึงต้องหารด้วย $I$ ไม่ใช่คูณ" }
      - { match: "\\frac{I}{V}", feedback: "กลับเศษกับส่วน หาร $I$ ทั้งสองข้างของ $V = IR$ ได้ $\\tfrac{V}{I} = R$" }
    solution: "หาร $I$ ทั้งสองข้าง: $R = \\dfrac{V}{I}$ ตรวจ: $I = 2\\ \\mathrm{A}$, $R = 6\\ \\Omega$ ได้ $V = 12\\ \\mathrm{V}$ และ $\\tfrac{12}{2} = 6$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rearr.p014
    topics: [math.algebra.rearrange-formula]
    difficulty: 2
    type: numeric
    stem: "ในการตรวจสุขภาพประจำปีของโรงเรียน ดัชนีมวลกายคำนวณจาก $\\text{BMI} = \\dfrac{m}{h^2}$ เมื่อ $m$ คือมวล (kg) และ $h$ คือส่วนสูง (m) นักเรียนคนหนึ่งสูง $1.6\\ \\mathrm{m}$ และมี BMI เท่ากับ $22$ นักเรียนคนนี้มีมวลกี่กิโลกรัม (ตอบทศนิยม 2 ตำแหน่ง ในหน่วย kg)"
    answer: { value: 56.32, tolerance: 0.05, unit: kg }
    hints:
      - "จัดสูตรให้ $m$ อยู่ข้างเดียว: $m$ ถูกหารด้วย $h^2$"
      - "$m = \\text{BMI} \\times h^2$ อย่าลืมยกกำลังสองส่วนสูงก่อน"
    misconceptions:
      - { match: 35.2, feedback: "ดูเหมือนคูณด้วย $h = 1.6$ ครั้งเดียว สูตรหารด้วย $h^2$ จึงต้องคูณด้วย $1.6^2 = 2.56$" }
      - { match: 8.59, feedback: "ดูเหมือนหาร $22$ ด้วย $h^2$ แต่ $m$ ถูกหารด้วย $h^2$ ต้องแกะด้วยการคูณ" }
    solution: "$m = \\text{BMI} \\times h^2 = 22 \\times 1.6^2 = 22 \\times 2.56 = 56.32\\ \\mathrm{kg}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rearr.p015
    topics: [math.algebra.rearrange-formula]
    difficulty: 3
    type: expression
    stem: "พื้นที่วงกลมคือ $A = \\pi r^2$ จัดสูตรให้รัศมี $r$ อยู่ข้างเดียว (รัศมีเป็นบวก)"
    prefix: "r ="
    answer: { latex: "\\sqrt{\\frac{A}{\\pi}}", variables: [A] }
    hints:
      - "หาร $\\pi$ ทั้งสองข้างก่อน จะได้ $r^2$ อยู่ข้างเดียว"
      - "แกะกำลังสองด้วยการถอดรากที่สองทั้งสองข้าง"
    misconceptions:
      - { match: "\\frac{A}{\\pi}", feedback: "นั่นคือ $r^2$ ยังต้องถอดรากที่สองอีกครั้ง" }
      - { match: "\\frac{\\sqrt{A}}{\\pi}", feedback: "ต้องถอดรากทั้ง $\\tfrac{A}{\\pi}$ ไม่ใช่เฉพาะ $A$ เพราะ $\\pi$ อยู่ใต้รากด้วยตอนที่หารแล้ว" }
    solution: "$A = \\pi r^2$ → $r^2 = \\dfrac{A}{\\pi}$ → $r = \\sqrt{\\dfrac{A}{\\pi}}$ ตรวจ: $r = 2$ ได้ $A = 4\\pi$ และ $\\sqrt{\\tfrac{4\\pi}{\\pi}} = 2$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rearr.p016
    topics: [math.algebra.rearrange-formula]
    difficulty: 3
    type: expression
    stem: "สมการเส้นตรงคือ $y = mx + c$ จัดสูตรให้ $x$ อยู่ข้างเดียว"
    prefix: "x ="
    answer: { latex: "\\frac{y-c}{m}", variables: [y, m, c] }
    hints:
      - "ชั้นนอกสุดคือการบวก $c$ แกะก่อนด้วยการลบ $c$ ทั้งสองข้าง"
      - "จากนั้นหาร $m$ ทั้งข้าง (ทั้งก้อน $y - c$)"
    misconceptions:
      - { match: "\\frac{y}{m}-c", feedback: "แกะผิดลำดับ ต้องลบ $c$ ก่อนหาร $m$ ถ้าหารก่อน ต้องหาร $c$ ด้วย ได้ $\\tfrac{y}{m} - \\tfrac{c}{m}$" }
      - { match: "\\frac{y+c}{m}", feedback: "$c$ ถูกบวกอยู่ จึงต้องลบ $c$ ทั้งสองข้าง ไม่ใช่บวก" }
    solution: "$y = mx + c$ → $y - c = mx$ → $x = \\dfrac{y - c}{m}$ ตรวจ: $m = 2$, $c = 1$, $x = 3$ ได้ $y = 7$ และ $\\tfrac{7 - 1}{2} = 3$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rearr.p017
    topics: [math.algebra.rearrange-formula]
    difficulty: 4
    type: expression
    stem: "จัดสมการ $kx + 3 = 2x + p$ ให้ $x$ อยู่ข้างเดียว (เมื่อ $k \\ne 2$)"
    prefix: "x ="
    answer: { latex: "\\frac{p-3}{k-2}", variables: [k, p] }
    hints:
      - "$x$ อยู่ทั้งสองข้าง ย้ายพจน์ที่มี $x$ ไปข้างซ้าย และพจน์ที่ไม่มี $x$ ไปข้างขวา"
      - "ได้ $kx - 2x = p - 3$ แล้วดึง $x$ เป็นตัวร่วม"
      - "หารด้วย $k - 2$ ทั้งสองข้าง"
    misconceptions:
      - { match: "\\frac{p-3}{k}", feedback: "ยังไม่ได้ย้าย $2x$ มารวมกัน $x$ อยู่ทั้งสองข้าง ต้องรวมพจน์ $kx - 2x = x(k - 2)$ ก่อนหาร" }
      - { match: "\\frac{p+3}{k-2}", feedback: "ย้าย $+3$ ไปอีกข้างต้องเป็น $-3$" }
    solution: "$kx - 2x = p - 3$ → $x(k - 2) = p - 3$ → $x = \\dfrac{p - 3}{k - 2}$ ตรวจ: $k = 5$, $p = 9$ ได้ $x = 2$ และ $5(2) + 3 = 13 = 2(2) + 9$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rearr.p018
    topics: [math.algebra.rearrange-formula]
    difficulty: 5
    type: expression
    stem: "จัดสูตร $y = \\dfrac{x + 2}{x}$ ให้ $x$ อยู่ข้างเดียว (เมื่อ $y \\ne 1$)"
    prefix: "x ="
    answer: { latex: "\\frac{2}{y-1}", variables: [y] }
    hints:
      - "คูณ $x$ ทั้งสองข้างเพื่อกำจัดตัวส่วน"
      - "ย้ายพจน์ที่มี $x$ ไปข้างเดียวกัน แล้วดึง $x$ เป็นตัวร่วม"
      - "หารด้วยวงเล็บที่เหลือ"
    misconceptions:
      - { match: "\\frac{2}{y}", feedback: "ดูเหมือนตัด $x$ ทิ้งจาก $\\tfrac{x + 2}{x}$ ไม่ได้ ต้องคูณ $x$ ได้ $xy = x + 2$ แล้วรวมพจน์ $x(y - 1) = 2$" }
      - { match: "\\frac{2}{y+1}", feedback: "ย้าย $x$ จากข้างขวามาข้างซ้ายต้องเป็น $xy - x$ ได้ตัวร่วม $(y - 1)$ ไม่ใช่ $(y + 1)$" }
    solution: "$xy = x + 2$ → $xy - x = 2$ → $x(y - 1) = 2$ → $x = \\dfrac{2}{y - 1}$ ตรวจ: $x = 2$ ได้ $y = \\tfrac{4}{2} = 2$ และ $\\tfrac{2}{2 - 1} = 2$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rearr.p019
    topics: [math.algebra.rearrange-formula]
    difficulty: 4
    type: numeric
    stem: "ช่างซ่อมนาฬิกาลูกตุ้มต้องการให้ลูกตุ้มแกว่งไปกลับหนึ่งรอบใช้เวลา $T = 2\\ \\mathrm{s}$ พอดี สูตรคาบคือ $T = 2\\pi\\sqrt{\\dfrac{L}{g}}$ เมื่อ $g = 9.8\\ \\mathrm{m/s^2}$ ก้านลูกตุ้มต้องยาวกี่เมตร (ตอบทศนิยม 2 ตำแหน่ง ในหน่วย m)"
    answer: { value: 0.99, tolerance: 0.01, unit: m }
    hints:
      - "หาร $2\\pi$ ทั้งสองข้างให้รากอยู่ข้างเดียว แล้วยกกำลังสอง"
      - "จะได้ $L = \\dfrac{gT^2}{4\\pi^2}$"
    misconceptions:
      - { match: 3.12, feedback: "ดูเหมือนลืมยกกำลังสอง ได้ $\\tfrac{gT}{2\\pi}$ การแกะรากที่สองต้องยกกำลังสองทั้ง $\\tfrac{T}{2\\pi}$" }
      - { match: 3.97, feedback: "ดูเหมือนยกกำลังสองแค่ $T$ แต่ไม่ยกกำลังสอง $2$ ของ $2\\pi$ ตัวส่วนต้องเป็น $(2\\pi)^2 = 4\\pi^2$" }
    solution: "$L = \\dfrac{gT^2}{4\\pi^2} = \\dfrac{9.8 \\times 4}{4\\pi^2} = \\dfrac{9.8}{\\pi^2} \\approx 0.99\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rearr.p020
    topics: [math.algebra.rearrange-formula]
    difficulty: 3
    type: numeric
    stem: "ที่นาแปลงหนึ่งเป็นรูปสี่เหลี่ยมคางหมู มีพื้นที่ 1 ไร่ ($1{,}600\\ \\mathrm{m^2}$) ด้านคู่ขนานด้านหนึ่งยาว $30\\ \\mathrm{m}$ และระยะห่างระหว่างด้านคู่ขนานคือ $40\\ \\mathrm{m}$ ด้านคู่ขนานอีกด้าน $b$ ยาวกี่เมตร (สูตร $A = \\tfrac12(a + b)h$ ตอบในหน่วย m)"
    figure: { src: trapezoid-field.svg, alt: "รูปสี่เหลี่ยมคางหมู ด้านขนานด้านบนยาว 30 m ด้านขนานด้านล่างยาว b ซึ่งไม่ทราบค่า เส้นประแสดงความสูง 40 m ตั้งฉากกับฐาน ข้างในเขียนพื้นที่ 1,600 ตารางเมตร" }
    answer: { value: 50, unit: m }
    hints:
      - "จัดสูตรให้ $b$ อยู่ข้างเดียว: คูณ 2 แล้วหาร $h$ ก่อน"
      - "ได้ $a + b = \\dfrac{2A}{h}$ แล้วลบ $a$"
    misconceptions:
      - { match: 80, feedback: "นั่นคือ $a + b$ ยังต้องลบด้าน $a = 30\\ \\mathrm{m}$ ออก" }
      - { match: 10, feedback: "ดูเหมือนลืมคูณ 2 (ได้ $\\tfrac{A}{h} - a$) ต้องแกะ $\\tfrac12$ ด้วยการคูณ 2 ทั้งสองข้าง" }
    solution: "$2A = (a + b)h$ → $a + b = \\dfrac{2A}{h}$ → $b = \\dfrac{2A}{h} - a = \\dfrac{3{,}200}{40} - 30 = 80 - 30 = 50\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true
