    ai_assisted: true

  - id: earthscience.systems.computational-models.p013
    topics: [earthscience.systems.computational-models]
    difficulty: 4
    type: numeric
    stem: "แบบจำลองประชากรปลา $r = 0.5$ ต่อปี $K = 1{,}000$ ตัน จับปีละ $H = 100$ ตัน เริ่มจาก 800 ตัน ประชากรจะเข้าสู่สมดุลที่กี่ตัน (สมดุลคือ $rN(1 - N/K) = H$ ใช้รากที่มากกว่า ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 723.6, tolerance: 1, unit: ตัน }
    misconceptions:
      - { match: 276.4, feedback: "276.4 ตันเป็นรากที่น้อยกว่า ซึ่งเป็นสมดุลไม่เสถียร ประชากรที่เริ่มจาก 800 ตันจะลดลงไปหารากที่มากกว่า" }
      - { match: 500, feedback: "500 ตันคือ K/2 ซึ่งเป็นสมดุลเมื่อจับเท่าผลผลิตสูงสุดที่ยั่งยืน 125 ตันต่อปี" }
    hints:
      - "จัดรูปเป็น 0.0005N² − 0.5N + 100 = 0"
      - "ใช้สูตร N = (K/2)(1 ± √(1 − 4H/(rK)))"
    solution: "$N = \\dfrac{K}{2}\\left(1 + \\sqrt{1 - \\dfrac{4H}{rK}}\\right) = 500(1 + \\sqrt{1 - 0.8}) = 500(1 + 0.4472) \\approx 723.6$ ตัน ตรงกับผลจำลองที่ปลาลดลงจาก 800 แล้วคงที่ราว 724 ตัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.systems.computational-models.p014
    topics: [earthscience.systems.computational-models]
    difficulty: 4
    type: mcq
    stem: "แบบจำลองกล่องคาร์บอน $A_{\\text{ใหม่}} = A + E - k(A - A_0)$ ที่ใช้ $k$ คงที่ บอกว่าถ้าหยุดปล่อยทันที CO₂ จะลดจาก 420 ppm เหลือราว 308 ppm ใน 80 ปี ข้อวิจารณ์ใดถูกต้องที่สุด"
    choices:
      - { id: a, text: "น่าจะลดเร็วเกินจริง เพราะในความจริงมหาสมุทรชั้นบนอิ่มตัวและดูด CO₂ ได้น้อยลง k จึงไม่คงที่", correct: true }
      - { id: b, text: "น่าจะลดช้าเกินจริง เพราะต้นไม้จะดูด CO₂ ได้มากขึ้นเรื่อย ๆ ไม่มีขีดจำกัด", feedback: "พืชบนบกดูดได้มีขีดจำกัดตามพื้นที่ น้ำ และธาตุอาหาร และยังได้รับผลจากภัยแล้งและไฟป่า" }
      - { id: c, text: "ถูกต้องแน่นอน เพราะคำนวณด้วยคอมพิวเตอร์", feedback: "ผลของแบบจำลองถูกได้ไม่เกินข้อสมมติ ข้อสมมติ k คงที่ไม่เป็นจริงในระยะยาว" }
      - { id: d, text: "ผิดทั้งหมด เพราะ CO₂ ในอากาศไม่มีวันลดลง", feedback: "มหาสมุทรและพืชยังดูด CO₂ ต่อไป CO₂ จะลดลง แต่ช้ากว่าที่แบบจำลองนี้บอก" }
    hints:
      - "ข้อสมมติใดของแบบจำลองนี้อาจไม่จริงในระยะยาว"
      - "มหาสมุทรที่ดูด CO₂ ไปมากแล้วยังดูดได้เร็วเท่าเดิมหรือไม่"
    solution: "แบบจำลองปรับ k ให้ตรงกับปัจจุบันแล้วถือว่าคงที่ แต่มหาสมุทรชั้นบนอิ่มตัวและผสมกับน้ำลึกช้า การดูดกลับจึงช้าลงเมื่อเวลาผ่านไป CO₂ จริงจะลดช้ากว่านี้มาก และส่วนหนึ่งค้างในอากาศนานหลายร้อยถึงหลายพันปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.systems.computational-models.p015
    topics: [earthscience.systems.computational-models]
    difficulty: 5
    type: numeric
    stem: "ในแบบจำลองกล่องคาร์บอน ถ้าปล่อยคงที่ $E = 10$ GtC ต่อปี และ $k = 0.02$ ต่อปี $A_0 = 593.6$ GtC CO₂ จะเข้าสู่สมดุลที่กี่ ppm (1 ppm = 2.12 GtC ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 515.8, tolerance: 0.5, unit: ppm }
    misconceptions:
      - { match: 500, feedback: "500 คือ E/k เป็นส่วนเกินในหน่วย GtC ต้องบวก A₀ แล้วแปลงเป็น ppm" }
      - { match: 780, feedback: "780 มาจาก 280 + 500 ต้องแปลง 500 GtC เป็น ppm ก่อนบวก" }
    hints:
      - "สมดุลเมื่อ E = k(A − A₀)"
      - "A = A₀ + E/k แล้วหารด้วย 2.12"
    solution: "ที่สมดุล $E = k(A - A_0)$ ได้ $A = 593.6 + 10/0.02 = 1{,}093.6$ GtC หรือ $1{,}093.6 / 2.12 \\approx 515.8$ ppm การปล่อยคงที่จึงทำให้ CO₂ ขึ้นไปค้างที่ระดับสูง ไม่ใช่คงที่ที่ระดับปัจจุบัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.systems.computational-models.p016
    topics: [earthscience.systems.computational-models]
    difficulty: 5
    type: numeric
    stem: "ในแบบจำลองสมดุลพลังงาน $T_{\\text{eq}} = \\left(\\dfrac{S(1-\\alpha) + 4F}{4\\varepsilon\\sigma}\\right)^{1/4}$ ใช้ $S = 1361$, $\\alpha = 0.30$, $\\varepsilon = 0.612$, $\\sigma = 5.67 \\times 10^{-8}$ ถ้าเพิ่มแรงบังคับ $F$ จาก 0 เป็น $3.7\\ \\mathrm{W/m^2}$ อุณหภูมิสมดุลเพิ่มขึ้นกี่เคลวิน (ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 1.11, tolerance: 0.02, unit: K }
    misconceptions:
      - { match: 0.28, feedback: "0.28 K ได้จากการใส่ F โดยไม่คูณ 4 แรงบังคับเป็นค่าเฉลี่ยต่อตารางเมตรของผิวโลกทั้งหมด จึงต้องคูณ 4 ให้หน่วยเดียวกับ S" }
      - { match: 3.7, feedback: "3.7 คิดว่า 1 W/m² ทำให้ร้อนขึ้น 1 K การตอบสนองจริงราว 0.3 K ต่อ W/m² เมื่อไม่มีการป้อนกลับ" }
    hints:
      - "คำนวณ T_eq สองครั้ง ที่ F = 0 และ F = 3.7"
      - "นำค่าที่สองลบค่าแรก"
    solution: "$F = 0$: $T_{\\text{eq}} \\approx 287.83$ K $F = 3.7$: $T_{\\text{eq}} \\approx 288.94$ K เพิ่มขึ้นราว 1.11 K ซึ่งเป็นการตอบสนองเมื่อไม่มีการป้อนกลับ ความไวจริงราว 3 K เพราะการป้อนกลับขยายผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.systems.computational-models.p017
    topics: [earthscience.systems.computational-models]
    difficulty: 5
    type: numeric
    stem: "วิเคราะห์ความไวของแบบจำลองสมดุลพลังงาน ($S = 1361$, $\\varepsilon = 0.612$, $\\sigma = 5.67 \\times 10^{-8}$, $F = 0$) ถ้าอัลบีโดเพิ่มจาก 0.30 เป็น 0.32 เช่น จากละอองลอยหรือเมฆต่ำที่มากขึ้น อุณหภูมิสมดุลลดลงกี่เคลวิน (ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 2.08, tolerance: 0.03, unit: K }
    misconceptions:
      - { match: 0.02, feedback: "0.02 คือการเปลี่ยนของอัลบีโด ต้องคำนวณอุณหภูมิสมดุลทั้งสองกรณีแล้วลบกัน" }
      - { match: 285.75, feedback: "285.75 K คืออุณหภูมิสมดุลใหม่ โจทย์ถามว่าลดลงกี่เคลวิน" }
    hints:
      - "คำนวณ T_eq ที่ α = 0.30 และ α = 0.32"
      - "ผลต่างคือคำตอบ"
    solution: "$\\alpha = 0.30$: 287.83 K $\\alpha = 0.32$: 285.75 K ลดลงราว 2.08 K อัลบีโดเปลี่ยนเพียง 0.02 แต่อุณหภูมิเปลี่ยนราว 2 K พารามิเตอร์นี้จึงไวมาก และเป็นเหตุที่เมฆและละอองลอยเป็นแหล่งความไม่แน่นอนสำคัญ"
