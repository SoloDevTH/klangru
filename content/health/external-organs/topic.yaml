id: health.body.external-organs
subject: health
title: { th: อวัยวะภายนอกและการดูแลรักษา, en: "External body parts and how to care for them" }
summary: ลักษณะและหน้าที่ของตา หู จมูก ปาก ลิ้น ฟัน ผม ผิวหนัง มือ เท้า และเล็บ วิธีรักษาความสะอาด และการป้องกันอันตรายต่ออวัยวะภายนอก
difficulty: 1
minutes: 20
prerequisites: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: อวัยวะภายนอกและหน้าที่
    src: external-organs.svg
    alt: "ภาพเด็กยืนตรง มีเส้นชี้ไปที่อวัยวะภายนอกพร้อมหน้าที่: ผม ปกป้องหนังศีรษะจากแดด, ตา มองเห็น, จมูก หายใจ ดมกลิ่น, ปาก ลิ้น ฟัน กิน เคี้ยว รับรส พูด, มือ หยิบ จับ เขียน, เท้า ยืน เดิน รับน้ำหนัก, หู ได้ยิน ช่วยทรงตัว, คอ หันศีรษะ ต่อศีรษะกับลำตัว, ผิวหนัง ห่อหุ้มร่างกาย รับสัมผัส, เล็บ ปกป้องปลายนิ้ว"
    caption: "อวัยวะภายนอกคือส่วนที่มองเห็นได้จากข้างนอกร่างกาย แต่ละส่วนมีหน้าที่ต่างกัน"
  - type: worked-example
    title: น้ำสกปรกกระเด็นเข้าตา
    problem: "วันสงกรานต์ น้ำสกปรกกระเด็นเข้าตาเพื่อน เพื่อนรู้สึกเคืองตาและอยากขยี้ตา เราควรแนะนำเพื่อนอย่างไร"
    steps:
      - text: "บอกเพื่อนว่าอย่าขยี้ตา"
        why: "มือมักมีเชื้อโรค และเศษฝุ่นที่ถูกขยี้อาจขูดผิวตาจนเป็นแผล"
      - text: "ให้เพื่อนกะพริบตาหลาย ๆ ครั้ง แล้วล้างตาด้วยน้ำสะอาด"
        why: "น้ำตาและน้ำสะอาดช่วยพาสิ่งสกปรกออกจากตาได้โดยไม่ทำร้ายตา"
      - text: "ใช้ผ้าหรือกระดาษที่สะอาดซับรอบตา ไม่ใช้ผ้าที่คนอื่นใช้แล้ว"
      - text: "ถ้ายังเจ็บ ตาแดงมาก หรือมองไม่ชัด ให้พาเพื่อนไปบอกผู้ใหญ่เพื่อพบแพทย์"
    answer: "ไม่ขยี้ตา กะพริบตาหรือล้างด้วยน้ำสะอาด และบอกผู้ใหญ่ถ้าอาการไม่ดีขึ้น"
  - { type: check, problem: health.body.external-organs.p003, prompt: "ลองตอบดูก่อนอ่านต่อ" }
  - type: worked-example
    title: เลือกวิธีดูแลอวัยวะให้ตรงกับหน้าที่
    problem: "หลังเลิกเรียน ภูมิวิ่งเล่นฟุตบอลกลางแดด เหงื่อออกมาก เท้าเปียก และมือเปื้อนดิน ก่อนกินข้าวเย็น ภูมิควรดูแลอวัยวะใดบ้าง อย่างไร"
    steps:
      - text: "ดูว่าอวัยวะใดสกปรก: มือเปื้อนดิน ผิวหนังมีเหงื่อ เท้าเปียก"
      - text: "มือ: ล้างมือด้วยสบู่ก่อนกินข้าว"
        why: "มือหยิบอาหารเข้าปาก เชื้อโรคบนมือจึงเข้าสู่ร่างกายได้ง่าย"
      - text: "ผิวหนัง: อาบน้ำฟอกสบู่ แล้วเช็ดตัวให้แห้ง"
        why: "เหงื่อและฝุ่นที่ค้างบนผิวทำให้คันและมีกลิ่น"
      - text: "เท้า: ล้างเท้าและเช็ดซอกนิ้วให้แห้ง"
        why: "ซอกนิ้วที่เปียกนาน ๆ เกิดเชื้อราได้ง่าย"
    answer: "ล้างมือ อาบน้ำ และเช็ดเท้ากับซอกนิ้วให้แห้ง"
  - { type: check, problem: health.body.external-organs.p012, prompt: "ทบทวนว่าอวัยวะภายนอกต่างจากอวัยวะภายในอย่างไร" }
glossary:
  - { term: อวัยวะภายนอก, definition: "ส่วนของร่างกายที่มองเห็นได้จากข้างนอก เช่น ตา หู จมูก ปาก ผม ผิวหนัง มือ เท้า เล็บ" }
  - { term: อวัยวะภายใน, definition: "ส่วนของร่างกายที่อยู่ข้างในและมองไม่เห็น เช่น หัวใจ ปอด กระเพาะอาหาร" }
  - { term: อวัยวะรับความรู้สึก, definition: "อวัยวะที่รับรู้สิ่งรอบตัว ได้แก่ ตา หู จมูก ลิ้น และผิวหนัง" }
  - { term: เหงือก, definition: "เนื้อเยื่อสีชมพูที่หุ้มรอบโคนฟันและยึดฟันไว้" }
  - { term: เหงื่อ, definition: "ของเหลวที่ผิวหนังขับออกมา ช่วยระบายความร้อนออกจากร่างกาย" }
flashcards:
  - { front: "อวัยวะรับความรู้สึกมีอะไรบ้าง", back: "ตา (มองเห็น) หู (ได้ยิน) จมูก (ดมกลิ่น) ลิ้น (รับรส) ผิวหนัง (รับสัมผัส ร้อน เย็น เจ็บ)" }
  - { front: "หูมีหน้าที่อะไรนอกจากได้ยินเสียง", back: "ช่วยให้ร่างกายทรงตัว" }
  - { front: "ฝุ่นเข้าตาควรทำอย่างไร", back: "ไม่ขยี้ตา กะพริบตาหรือล้างตาด้วยน้ำสะอาด ถ้ายังเจ็บให้บอกผู้ใหญ่" }
  - { front: "ทำไมไม่ควรใช้หวีหรือผ้าเช็ดตัวร่วมกับคนอื่น", back: "เชื้อโรค เชื้อรา และเหาติดต่อผ่านของใช้ส่วนตัวได้" }
