# หัวข้อที่เสนอให้เขียนใหม่ เพื่อให้คลังครอบคลุมตัวชี้วัดแกนกลาง กลุ่มสาระการเรียนรู้วิทยาศาสตร์และเทคโนโลยี
# (ฉบับปรับปรุง พ.ศ. 2560) ป.1–ม.6 ตาม curriculum/frameworks/th-core-2560-science.yaml
#
# - ณ วันที่เสนอ คลังสอนตัวชี้วัดแกนกลางครบ 16 ข้อ บางส่วน 45 ข้อ และยังไม่มีหัวข้อสอน 354 จาก 415 ข้อ
#   (ดู curriculum/mappings/th-core-2560-science.yaml) ชีววิทยา โลกและอวกาศ และเทคโนโลยียังไม่มีหัวข้อเลย
# - topics: 83 หัวข้อใหม่ (biology 24, chemistry 11, physics 13, earthscience 16, technology 19)
#   รวมตัวชี้วัดที่ยังไม่มีหัวข้อสอนทุกข้อ และตัวชี้วัดที่หัวข้อเดิมสอนเพียงบางส่วนเมื่อหัวข้อใหม่สอนส่วนที่ขาด
# - extend: ตัวชี้วัด ม.4–6 ที่เนื้อหาตรงกับหัวข้อซึ่งเสนอไว้แล้วใน docs/phase6/proposals-science-additional.yaml
#   (รายวิชาเพิ่มเติม) ให้แนบตัวชี้วัดเหล่านี้กับหัวข้อนั้นแทนการเขียนหัวข้อซ้ำ เพราะคลังไม่แบ่งตามระดับชั้น
#   หัวข้อในไฟล์นี้ที่เป็นพื้นฐานของหัวข้อเหล่านั้น เช่น biology.ecology.food-webs ก่อน biology.ecology.ecosystems
#   หรือ biology.cells.cell-basics ก่อน biology.cells.cell-structure ควรเพิ่มเป็น prereq ตอนรวมไฟล์
# - เรียงตาม prerequisite: prereq ทุกตัวเป็นหัวข้อที่มีในคลังแล้ว หัวข้อที่อยู่ก่อนหน้าในไฟล์นี้ หรือหัวข้อใน
#   proposals-science-additional.yaml (ใช้กับ biology.animals.homeostasis เท่านั้น) วิชาเรียงเป็น ชีววิทยา เคมี ฟิสิกส์
#   โลกและอวกาศ เทคโนโลยี เพราะโลกฯ และเทคโนโลยีอ้างหัวข้อฟิสิกส์และเคมี
# - difficulty เทียบกับหัวข้อเดิม (math.number.place-value 1, physics.units.si 2, physics.dynamics.forces 3,
#   chemistry.bonding.covalent 4, physics.thermal.phase-change 4.5) ประถมราว 1–2.2 มัธยมต้นราว 2.5–5
#   และไม่ต่ำกว่า prereq ทุกตัว scope เป็นคำของเรา ไม่ใช่ข้อความจากหลักสูตร
# - ตัวชี้วัดที่ควรเติมในหัวข้อเดิมมากกว่าแยกหัวข้อใหม่ (ยังนับเป็น "บางส่วน" อยู่):
#   ว 3.1 ม.3/1 (การโคจรของดาวเคราะห์ด้วย F = Gm₁m₂/r²) เติมใน physics.dynamics.gravitation
#   ว 2.3 ม.3/2 (กราฟ I–V) เติมใน physics.electricity.current-voltage
#   ว 2.3 ม.2/6 (การเปลี่ยนและถ่ายโอนพลังงานรูปอื่น) เติมใน physics.energy.conservation
#   ว 2.2 ม.5/2 (แรงลัพธ์ของแรงในระนาบ) เติมใน physics.units.vectors หรือ physics.rotation.static-equilibrium
#   หัวข้อ physics.waves.sound-intro ควรเป็น prereq ของ physics.waves.sound
