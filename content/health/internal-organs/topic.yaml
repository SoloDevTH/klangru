id: health.body.internal-organs
subject: health
title: { th: อวัยวะภายในและการดูแลรักษา, en: "Internal organs and how to care for them" }
summary: ตำแหน่ง ลักษณะ และหน้าที่ของสมอง หัวใจ ปอด ตับ กระเพาะอาหาร ลำไส้ และไต การทำงานร่วมกัน และวิธีดูแลอวัยวะภายในในชีวิตประจำวัน
difficulty: 1.5
minutes: 25
prerequisites: [health.body.external-organs]
encompasses:
  - { id: health.body.external-organs, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: อวัยวะภายในอยู่ตรงไหน
    src: organs.svg
    alt: "ภาพร่างกายคนหันหน้าเข้าหาผู้ดู แสดงอวัยวะภายใน สมองอยู่ในศีรษะ ปอดสองข้างอยู่ในทรวงอก หัวใจอยู่ระหว่างปอดค่อนไปทางซ้ายของเจ้าของร่างกาย (ทางขวามือของผู้ดู) ตับอยู่ใต้ปอดทางขวาของเจ้าของร่างกาย กระเพาะอาหารอยู่ทางซ้ายของเจ้าของร่างกายใต้หัวใจ ไตสองข้างวาดเส้นประเพราะอยู่ด้านหลังใกล้แนวเอว ลำไส้เล็กขดอยู่กลางท้อง และลำไส้ใหญ่เป็นกรอบล้อมรอบลำไส้เล็ก"
    caption: "ภาพนี้หันหน้าเข้าหาเรา ด้านซ้ายของเจ้าของร่างกายจึงอยู่ทางขวามือของเรา"
  - type: worked-example
    title: ติดตามอาหารหนึ่งคำ
    problem: "ข้าวผัดหนึ่งคำผ่านอวัยวะภายในใดบ้างตามลำดับ และแต่ละอวัยวะทำอะไร"
    steps:
      - text: "กระเพาะอาหาร: เก็บอาหารไว้ชั่วคราวและย่อยด้วยน้ำย่อย"
        why: "ก่อนถึงกระเพาะ อาหารผ่านปากและหลอดอาหารแล้ว แต่สองอย่างนั้นไม่ใช่เรื่องหลักของบทนี้"
      - text: "ลำไส้เล็ก: ย่อยต่อจนอาหารเล็กพอ แล้วดูดซึมสารอาหารเข้าสู่เลือด ตับช่วยโดยส่งน้ำดีมาช่วยย่อยไขมัน"
      - text: "ลำไส้ใหญ่: ดูดน้ำกลับจากกากอาหาร แล้วเก็บกากไว้ก่อนขับถ่ายเป็นอุจจาระ"
      - text: "สารอาหารในเลือดถูกหัวใจสูบฉีดไปทั่วร่างกาย ของเสียในเลือดถูกไตกรองออกเป็นปัสสาวะ"
        why: "แสดงว่าระบบย่อยอาหาร หัวใจ และไต ทำงานร่วมกัน"
    answer: "กระเพาะอาหาร → ลำไส้เล็ก (ตับช่วยด้วยน้ำดี) → ลำไส้ใหญ่ ส่วนสารอาหารเข้าเลือดแล้วหัวใจส่งไปทั่วร่างกาย"
  - { type: check, problem: health.body.internal-organs.p002, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: worked-example
    title: วัดชีพจรก่อนและหลังวิ่ง
    problem: "ตอนนั่งพัก ข้าวหอมนับชีพจรได้ 20 ครั้งใน 15 วินาที หลังวิ่งรอบสนาม นับได้ 32 ครั้งใน 15 วินาที ชีพจรเพิ่มขึ้นกี่ครั้งต่อนาที และเพราะอะไร"
    steps:
      - text: "เปลี่ยนเป็นครั้งต่อนาที: 1 นาทีมี 4 ช่วง 15 วินาที จึงคูณ 4"
      - text: "ตอนพัก 20 × 4 = 80 ครั้งต่อนาที หลังวิ่ง 32 × 4 = 128 ครั้งต่อนาที"
      - text: "เพิ่มขึ้น 128 − 80 = 48 ครั้งต่อนาที"
      - text: "ตอนวิ่ง กล้ามเนื้อขาต้องการออกซิเจนมากขึ้น หัวใจจึงเต้นเร็วขึ้นเพื่อส่งเลือดไปมากขึ้น และปอดก็หายใจเร็วขึ้น"
        why: "แสดงว่าหัวใจและปอดทำงานร่วมกับกล้ามเนื้อ"
    answer: "เพิ่มขึ้น 48 ครั้งต่อนาที เพราะกล้ามเนื้อต้องการออกซิเจนมากขึ้น"
  - { type: check, problem: health.body.internal-organs.p009 }
glossary:
  - { term: อวัยวะภายใน, definition: "อวัยวะที่อยู่ข้างในร่างกาย มองไม่เห็นจากภายนอก เช่น สมอง หัวใจ ปอด ตับ ไต" }
  - { term: ชีพจร, definition: "จังหวะการเต้นของหัวใจที่คลำได้ที่ข้อมือหรือคอ นับเป็นครั้งต่อนาที" }
  - { term: ทรวงอก, definition: "ส่วนของลำตัวที่มีกระดูกซี่โครงล้อมรอบ ข้างในมีหัวใจและปอด" }
  - { term: น้ำดี, definition: "ของเหลวที่ตับสร้าง ช่วยย่อยไขมันในลำไส้เล็ก" }
flashcards:
  - { front: "หัวใจมีหน้าที่อะไร", back: "สูบฉีดเลือดไปทั่วร่างกาย" }
  - { front: "อวัยวะใดกรองของเสียออกจากเลือดเป็นปัสสาวะ", back: "ไต (มี 2 ข้าง อยู่ด้านหลังใกล้แนวเอว)" }
  - { front: "อวัยวะภายในที่ใหญ่ที่สุดคืออะไร", back: "ตับ อยู่ช่องท้องด้านขวาบน ใต้กระดูกซี่โครง" }
  - { front: "กระดูกใดปกป้องหัวใจและปอด", back: "กระดูกซี่โครง" }
  - { front: "นับชีพจร 15 วินาที แล้วทำอย่างไรต่อ", back: "คูณ 4 จะได้จำนวนครั้งต่อนาที" }
