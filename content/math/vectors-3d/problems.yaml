  - id: math.calculus.vectors-3d.p017
    topics: [math.calculus.vectors-3d]
    difficulty: 4
    type: expression
    stem: "จงหาพื้นที่ของสี่เหลี่ยมด้านขนานที่มี $\\mathbf{u} = \\langle 1, 1, 0 \\rangle$ และ $\\mathbf{v} = \\langle 0, 2, 2 \\rangle$ เป็นด้าน ตอบในรูปกรณฑ์อย่างง่าย"
    prefix: "พื้นที่ ="
    answer: { latex: "2\\sqrt{3}", variables: [] }
