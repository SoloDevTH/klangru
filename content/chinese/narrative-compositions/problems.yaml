problems:
- type: match
  difficulty: 1
  stem: จับคู่คำบรรยายความรู้สึกและลักษณะกับความหมายในภาษาไทย
  pairs:
  - left: 高兴 (gāoxìng)
    right: ดีใจ
  - left: 难过 (nánguò)
    right: เสียใจ เศร้า
  - left: 紧张 (jǐnzhāng)
    right: ประหม่า ตื่นเต้น
  - left: 友好 (yǒuhǎo)
    right: เป็นมิตร
  - left: 干净 (gānjìng)
    right: สะอาด
  hints:
  - 高 แปลว่าสูง แต่ 高兴 หมายถึงความรู้สึกดี
  - 难 แปลว่ายาก และ 过 บอกการผ่านไป
  - 友 แปลว่าเพื่อน
  solution: 高兴 (gāoxìng) ดีใจ · 难过 (nánguò) เสียใจ เศร้า · 紧张 (jǐnzhāng) ประหม่า ตื่นเต้น · 友好 (yǒuhǎo) เป็นมิตร · 干净 (gānjìng) สะอาด
  id: chinese.writing.narrative-compositions.p001
  topics:
  - chinese.writing.narrative-compositions
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: text
  difficulty: 1
  stem: 'เติมคำบอกลำดับเหตุการณ์แรกของเรื่อง (ตอบเป็นคำเดียว 2 ตัวอักษร)


    ___，我们去了动物园 (wǒmen qù le dòngwùyuán)。'
  accepted:
  - 首先
  misconceptions:
  - match: 最后
    feedback: 最后 (zuìhòu) บอกเหตุการณ์สุดท้ายของเรื่อง จึงไม่ใช้เปิดเรื่อง
  - match: 后来
    feedback: 后来 (hòulái) บอกว่าเกิดขึ้นทีหลัง จึงไม่เหมาะกับจุดเริ่มต้น
  hints:
  - ประโยคนี้เป็นจุดเริ่มต้นของเรื่อง
  - ต้องใช้คำที่บอกว่า ‘ขั้นแรก’
  - คำนี้ขึ้นต้นด้วย 首
  solution: '**首先 (shǒuxiān)** เขียนว่า 首先 (shǒuxiān)，我们去了动物园 (wǒmen qù le dòngwùyuán)。 (ขั้นแรก เราไปสวนสัตว์)'
  id: chinese.writing.narrative-compositions.p002
  topics:
  - chinese.writing.narrative-compositions
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: order
  difficulty: 2
  stem: 'เรียงคำต่อไปนี้ให้เป็นประโยคที่ถูกต้อง (ความหมาย: เมื่อวานฉันไปร้านหนังสือและซื้อหนังสือหนึ่งเล่ม)'
  items:
  - 昨天我 (zuótiān wǒ)
  - 去 (qù)
  - 书店 (shūdiàn)
  - 买了 (mǎi le)
  - 一本书 (yì běn shū)。
  hints:
  - ประโยคเริ่มด้วยคำบอกเวลาและประธาน (昨天我)
  - หลังประธานเป็นกริยาเคลื่อนที่ 去 แล้วตามด้วยสถานที่
  - กริยา 买了 และสิ่งที่ซื้อ 一本书 ตามหลังสถานที่
  solution: 昨天我去书店买了一本书 (zuótiān wǒ qù shūdiàn mǎi le yì běn shū)。 (เวลา → ประธาน → 去 (qù) → สถานที่ → 买了 (mǎi le) → สิ่งที่ซื้อ)
  id: chinese.writing.narrative-compositions.p003
  topics:
  - chinese.writing.narrative-compositions
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: mcq
  difficulty: 2
  stem: เรื่องเล่าเกี่ยวกับตลาดเช้าในเชียงใหม่ ข้อใดเรียงลำดับเหตุการณ์ได้ถูกต้อง
  choices:
  - id: a
    text: 首先我们去了早市 (shǒuxiān wǒmen qù le zǎoshì)，然后吃了早饭 (ránhòu chī le zǎofàn)，最后回家了 (zuìhòu huíjiā le)。
    correct: true
    feedback: ถูก 首先 (shǒuxiān) อยู่หน้าเหตุการณ์แรก และ 最后 (zuìhòu) อยู่หน้าเหตุการณ์สุดท้าย
  - id: b
    text: 最后我们去了早市 (zuìhòu wǒmen qù le zǎoshì)，然后吃了早饭 (ránhòu chī le zǎofàn)，首先回家了 (shǒuxiān huíjiā le)。
    feedback: ลำดับกลับด้าน 最后 (zuìhòu) และ 首先 (shǒuxiān) วางผิดตำแหน่ง
  - id: c
    text: 然后我们吃了早饭 (ránhòu wǒmen chī le zǎofàn)，首先去了早市 (shǒuxiān qù le zǎoshì)，最后回家了 (zuìhòu huíjiā le)。
    feedback: 然后 (ránhòu) ไม่ควรเป็นเหตุการณ์แรก ประโยคนี้เริ่มด้วย 然后 (ránhòu) จึงผิด
  - id: d
    text: 首先我们回家了 (shǒuxiān wǒmen huíjiā le)，最后去了早市 (zuìhòu qù le zǎoshì)，然后吃了早饭 (ránhòu chī le zǎofàn)。
    feedback: ลำดับไม่สมเหตุสมผล เพราะกลับบ้านก่อนไปตลาดไม่ได้
  hints:
  - ดูคำบอกลำดับแต่ละคำว่าควรอยู่ตำแหน่งใด
  - 首先 ต้องอยู่หน้าเหตุการณ์แรกเสมอ
  - เหตุการณ์ที่ควรเกิดก่อนคือไปตลาดก่อนกินข้าว
  solution: '**a.** ไปตลาดเช้าก่อน จากนั้นกินข้าว แล้วจึงกลับบ้าน'
  id: chinese.writing.narrative-compositions.p004
  topics:
  - chinese.writing.narrative-compositions
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: mcq
  difficulty: 2
  stem: เรื่องเล่าเริ่มด้วยประโยค ‘那天下午 (nàtiān xiàwǔ)，我和朋友去了公园 (wǒ hé péngyou qù le gōngyuán)。’ ประโยคต่อไปใดเหมาะที่สุด
  choices:
  - id: a
    text: 公园里有很多花 (gōngyuán lǐ yǒu hěn duō huā)，我们拍了很多照片 (wǒmen pāi le hěn duō zhàopiàn)。
    correct: true
    feedback: ถูก ประโยคนี้ต่อเนื่องจากการไปสวนสาธารณะ
  - id: b
    text: 我的电脑坏了 (wǒ de diànnǎo huài le)，我很着急 (wǒ hěn zháojí)。
    feedback: ไม่เกี่ยวกับการไปสวนสาธารณะ
  - id: c
    text: 这本书是我朋友送的 (zhè běn shū shì wǒ péngyou sòng de)。
    feedback: ไม่เกี่ยวกับการไปสวนสาธารณะ
  - id: d
    text: 那家公司在曼谷 (nà jiā gōngsī zài Màngǔ)。
    feedback: ไม่เกี่ยวกับเหตุการณ์ที่เพิ่งเล่าไป
  hints:
  - ประโยคแรกบอกว่าไปที่ไหน
  - ประโยคต่อไปควรเล่าสิ่งที่เกิดขึ้นที่นั่น
  - เลือกประโยคที่พูดถึงสถานที่หรือการกระทำในสวนสาธารณะ
  solution: '**a.** ประโยคต่อไปควรเล่าสิ่งที่เกิดในสวนสาธารณะ เช่น ดอกไม้และการถ่ายรูป'
  id: chinese.writing.narrative-compositions.p005
  topics:
  - chinese.writing.narrative-compositions
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: mcq
  difficulty: 2
  stem: เลือกเครื่องหมายคั่นรายการที่ถูกต้องในการเขียนภาษาจีน
  choices:
  - id: a
    text: 苹果 (píngguǒ)、香蕉和橘子 (xiāngjiāo hé júzi)
    correct: true
    feedback: ถูก ใช้ 、 คั่นรายการ และใช้ 和 (hé) ก่อนรายการสุดท้าย
  - id: b
    text: 苹果 (píngguǒ)，香蕉 (xiāngjiāo)，和橘子 (hé júzi)
    feedback: ใช้ ， คั่นรายการไม่ถูกต้อง และไม่ควรมี ， ก่อน 和 (hé)
  - id: c
    text: 苹果 (píngguǒ)。香蕉 (xiāngjiāo)。橘子 (júzi)
    feedback: 。 ใช้จบประโยค ไม่ใช้คั่นรายการ
  - id: d
    text: 苹果 (píngguǒ)、香蕉 (xiāngjiāo)、和橘子 (hé júzi)
    feedback: ไม่ควรมี 、 ก่อน 和 (hé) ในรายการสุดท้าย
  hints:
  - เครื่องหมายคั่นรายการในจีนไม่ใช่ ， ทั้งหมด
  - เครื่องหมายที่ใช้คั่นคำนามหลายคำคือ 、
  - คำว่า 和 ใช้ก่อนรายการสุดท้าย
  solution: '**a. 苹果 (píngguǒ)、香蕉和橘子 (xiāngjiāo hé júzi)** (แอปเปิล กล้วย และส้ม)'
  id: chinese.writing.narrative-compositions.p006
  topics:
  - chinese.writing.narrative-compositions
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: text
  difficulty: 3
  stem: 'เติมคำที่ขาดให้ประโยคบรรยายคนถูกต้อง (ตอบอักษรหนึ่งตัว)


    那个穿红衣服 (nàge chuān hóng yīfu)___女孩是我的同学 (nǚhái shì wǒ de tóngxué)。'
  accepted:
  - 的
  misconceptions:
  - match: 了
    feedback: 了 (le) บอกการเปลี่ยนแปลงหรือเหตุการณ์ที่เกิดแล้ว ไม่ได้ใช้เชื่อมคำขยายกับคำนาม
  hints:
  - คำขยาย 穿红衣服 ต้องมีตัวเชื่อมก่อนคำนาม
  - คำเชื่อมนี้ใช้ทั่วไปเมื่อคำขยายยาวกว่าหนึ่งคำ
  - เป็นอักษรที่ออกเสียง de ใช้ต่อท้ายคำขยาย
  solution: '**的 (de)** เขียนว่า 那个穿红衣服的女孩是我的同学 (nàge chuān hóng yīfu de nǚhái shì wǒ de tóngxué)。 (เด็กผู้หญิงที่ใส่เสื้อแดงคนนั้นเป็นเพื่อนของฉัน)'
  id: chinese.writing.narrative-compositions.p007
  topics:
  - chinese.writing.narrative-compositions
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: order
  difficulty: 3
  stem: เรียงประโยคให้ได้ย่อหน้าที่ขยายความจากประโยคแรกอย่างมีเหตุผล
  items:
  - 他很喜欢画画 (tā hěn xǐhuan huàhuà)，
  - 因为画画让他很开心 (yīnwèi huàhuà ràng tā hěn kāixīn)，
  - 所以每天放学后 (suǒyǐ měitiān fàngxué hòu)，他都去美术班 (tā dōu qù měishù bān)。
  hints:
  - ประโยคแรกบอกความชอบ
  - 因为 ต้องตามด้วยเหตุผลของความชอบนั้น
  - 所以 บอกผลที่ตามมาจากเหตุผล
  solution: 他很喜欢画画 (tā hěn xǐhuan huàhuà)，因为画画让他很开心 (yīnwèi huàhuà ràng tā hěn kāixīn)，所以每天放学后 (suǒyǐ měitiān fàngxué hòu)，他都去美术班 (tā dōu qù měishù bān)。 (ชอบ → เหตุผล → ผลที่ตามมา)
  id: chinese.writing.narrative-compositions.p008
  topics:
  - chinese.writing.narrative-compositions
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: mcq
  difficulty: 3
  stem: ประโยคใดบอกว่า ‘แม้อากาศหนาว เราก็ยังไปปีนเขา’
  choices:
  - id: a
    text: 虽然天很冷 (suīrán tiān hěn lěng)，我们还是去爬山了 (wǒmen háishi qù páshān le)。
    correct: true
    feedback: ถูก 虽然 (suīrán)…还是 (háishi) บอกว่าเรื่องจริงคืออากาศหนาว แต่ยังทำต่อ
  - id: b
    text: 因为天很冷 (yīnwèi tiān hěn lěng)，我们不去爬山了 (wǒmen bú qù páshān le)。
    feedback: ประโยคนี้บอกว่าไม่ไป ตรงข้ามกับโจทย์
  - id: c
    text: 只要天很冷 (zhǐyào tiān hěn lěng)，我们就去爬山 (wǒmen jiù qù páshān)。
    feedback: 只要 (zhǐyào)…就 (jiù) บอกเงื่อนไขที่ทำให้เกิดผล ไม่ได้บอกว่ายังไปทั้งที่หนาว
  - id: d
    text: 即使天很冷 (jíshǐ tiān hěn lěng)，我们不去爬山 (wǒmen bú qù páshān)。
    feedback: ประโยคนี้บอกว่าไม่ไป จึงตรงข้ามกับโจทย์
  hints:
  - โจทย์บอกว่าอากาศหนาว แต่ยังไปปีนเขา
  - ต้องใช้คู่ที่ยอมรับเรื่องจริงและบอกว่ายังทำต่อ
  - เลือกประโยคที่มี 还是 และแสดงว่าไปปีนเขาจริง
  solution: '**a.** 虽然 (suīrán) ยอมรับว่าอากาศหนาว และ 还是 (háishi) บอกว่ายังไปปีนเขา'
