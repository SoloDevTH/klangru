<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" font-family="sans-serif" font-size="14">
<title>ชั้นหน้าตัดดิน</title>
<rect x="0" y="0" width="640" height="440" fill="#ffffff"/>
<rect x="40" y="30" width="200" height="30" fill="#3f2a14" stroke="#1f2937"/>
<text x="140.0" y="51.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">ชั้น O</text>
<text x="260.0" y="50.0" text-anchor="start" font-size="13" fill="#222">ชั้นอินทรียวัตถุ ใบไม้และซากพืชที่ผุพัง</text>
<rect x="40" y="60" width="200" height="70" fill="#5b3a1e" stroke="#1f2937"/>
<path d="M70,30 q-6,30 4,80" stroke="#d9f99d" fill="none" stroke-width="1.5"/>
<path d="M105,30 q-6,30 4,80" stroke="#d9f99d" fill="none" stroke-width="1.5"/>
<path d="M140,30 q-6,30 4,80" stroke="#d9f99d" fill="none" stroke-width="1.5"/>
<path d="M175,30 q-6,30 4,80" stroke="#d9f99d" fill="none" stroke-width="1.5"/>
<path d="M210,30 q-6,30 4,80" stroke="#d9f99d" fill="none" stroke-width="1.5"/>
<text x="140.0" y="101.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">ชั้น A</text>
<text x="260.0" y="100.0" text-anchor="start" font-size="13" fill="#222">ดินบน สีเข้ม มีฮิวมัสและรากพืชมาก</text>
<rect x="40" y="130" width="200" height="40" fill="#c8a97e" stroke="#1f2937"/>
<text x="140.0" y="156.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">ชั้น E</text>
<text x="260.0" y="155.0" text-anchor="start" font-size="13" fill="#222">ชั้นที่น้ำชะแร่ธาตุลงไป สีจาง</text>
<rect x="40" y="170" width="200" height="90" fill="#a0522d" stroke="#1f2937"/>
<text x="140.0" y="221.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">ชั้น B</text>
<text x="260.0" y="220.0" text-anchor="start" font-size="13" fill="#222">ดินล่าง สะสมดินเหนียวและเหล็ก</text>
<rect x="40" y="260" width="200" height="80" fill="#b8a07a" stroke="#1f2937"/>
<ellipse cx="62" cy="278" rx="12" ry="8" fill="#8b7355" stroke="#3f3f46"/>
<ellipse cx="100" cy="320" rx="12" ry="8" fill="#8b7355" stroke="#3f3f46"/>
<ellipse cx="215" cy="280" rx="12" ry="8" fill="#8b7355" stroke="#3f3f46"/>
<ellipse cx="190" cy="322" rx="12" ry="8" fill="#8b7355" stroke="#3f3f46"/>
<ellipse cx="70" cy="318" rx="12" ry="8" fill="#8b7355" stroke="#3f3f46"/>
<ellipse cx="220" cy="315" rx="12" ry="8" fill="#8b7355" stroke="#3f3f46"/>
<ellipse cx="100" cy="278" rx="12" ry="8" fill="#8b7355" stroke="#3f3f46"/>
<text x="140.0" y="306.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">ชั้น C</text>
<text x="260.0" y="305.0" text-anchor="start" font-size="13" fill="#222">หินที่ผุพังบางส่วน เป็นก้อน</text>
<rect x="40" y="340" width="200" height="60" fill="#6b7280" stroke="#1f2937"/>
<line x1="60" y1="345" x2="75" y2="395" stroke="#374151" stroke-width="2"/>
<line x1="110" y1="345" x2="125" y2="395" stroke="#374151" stroke-width="2"/>
<line x1="160" y1="345" x2="175" y2="395" stroke="#374151" stroke-width="2"/>
<line x1="210" y1="345" x2="225" y2="395" stroke="#374151" stroke-width="2"/>
<text x="140.0" y="376.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">ชั้น R</text>
<text x="260.0" y="375.0" text-anchor="start" font-size="13" fill="#222">หินพื้น ยังไม่ผุพัง</text>
<path d="M60,30 l6,-14 l6,14" fill="#16a34a"/>
<path d="M95,30 l6,-14 l6,14" fill="#16a34a"/>
<path d="M130,30 l6,-14 l6,14" fill="#16a34a"/>
<path d="M165,30 l6,-14 l6,14" fill="#16a34a"/>
<path d="M200,30 l6,-14 l6,14" fill="#16a34a"/>
<path d="M235,30 l6,-14 l6,14" fill="#16a34a"/>
<line x1="22.0" y1="40.0" x2="22.0" y2="390.0" stroke="#475569" stroke-width="2"/>
<polygon points="22.0,390.0 18.5,381.7 25.5,381.7" fill="#475569"/>
<text x="18" y="215.0" transform="rotate(-90 18 215.0)" text-anchor="middle" font-size="12" fill="#475569">ลึกลงไป</text>
<text x="630.0" y="432.0" text-anchor="end" font-size="11" fill="#64748b">แผนภาพทั่วไป ดินจริงบางที่ไม่มีครบทุกชั้น</text>
</svg>