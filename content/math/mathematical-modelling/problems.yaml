problems:
  - id: math.modelling.mathematical-modelling.p001
    topics: [math.modelling.mathematical-modelling]
    difficulty: 1
    type: mcq
    stem: "นักเรียนสร้างแบบจำลองเปรียบเทียบความแออัดของจังหวัดต่าง ๆ ด้วยความหนาแน่นประชากร หน่วยใดเหมาะสม"
    choices:
      - { id: a, text: "คนต่อตารางกิโลเมตร", correct: true }
      - { id: b, text: "ตารางกิโลเมตรต่อคน", feedback: "หน่วยนี้คือพื้นที่เฉลี่ยต่อคน ยิ่งแออัดยิ่งได้ค่าน้อย กลับด้านกับความหมายของความหนาแน่น" }
      - { id: c, text: "คนต่อกิโลเมตร", feedback: "พื้นที่ต้องใช้หน่วยตารางกิโลเมตร ไม่ใช่กิโลเมตร" }
      - { id: d, text: "คน", feedback: "จำนวนคนอย่างเดียวไม่บอกความแออัด จังหวัดใหญ่อาจมีคนมากแต่ไม่แออัด" }
    hints:
      - "ความหนาแน่นคือปริมาณต่อหน่วยพื้นที่"
      - "ปริมาณที่สนใจคือจำนวนคน"
    solution: "ความหนาแน่นประชากร $= \\dfrac{\\text{จำนวนคน}}{\\text{พื้นที่}}$ มีหน่วยคนต่อตารางกิโลเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.modelling.mathematical-modelling.p002
    topics: [math.modelling.mathematical-modelling]
    difficulty: 1
    type: numeric
    stem: "โรงเรียนพานักเรียน 250 คนไปทัศนศึกษาที่อยุธยา รถบัสหนึ่งคันนั่งได้ 40 คน ต้องเช่ารถบัสอย่างน้อยกี่คัน"
    answer: { value: 7, unit: คัน }
    hints:
      - "คำนวณ $250 \\div 40$"
      - "ตีความคำตอบ: จำนวนรถต้องเป็นจำนวนเต็ม และทุกคนต้องมีที่นั่ง"
    misconceptions:
      - { match: 6, feedback: "6 คันนั่งได้ 240 คน ยังเหลือนักเรียน 10 คน ต้องปัดขึ้น" }
      - { match: 6.25, feedback: "เช่ารถ 0.25 คันไม่ได้ ต้องตีความคำตอบในสถานการณ์จริง" }
    solution: "$250 \\div 40 = 6.25$ ต้องปัดขึ้นเป็น 7 คัน (นั่งได้ 280 คน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.modelling.mathematical-modelling.p003
    topics: [math.modelling.mathematical-modelling]
    difficulty: 2
    type: mcq
    stem: "ข้อมูล $x = 0, 1, 2, 3$ ให้ $y = 5, 8, 11, 14$ แบบจำลองใดเหมาะที่สุด"
    choices:
      - { id: a, text: "เชิงเส้น $y = 3x + 5$", correct: true }
      - { id: b, text: "เอกซ์โพเนนเชียล $y = 5(1.6)^x$", feedback: "อัตราส่วน $\\tfrac85 = 1.6$ แต่ $\\tfrac{11}{8} = 1.375$ ไม่คงที่" }
      - { id: c, text: "แปรผันตรง $y = 5x$", feedback: "ที่ $x = 0$ ได้ $y = 5$ ไม่ผ่านจุดกำเนิด" }
      - { id: d, text: "กำลังสอง $y = x^2 + 5$", feedback: "ที่ $x = 2$ ได้ 9 ไม่ใช่ 11 และผลต่างของข้อมูลคงที่อยู่แล้ว" }
    hints:
      - "หาผลต่างของ $y$ ที่อยู่ติดกัน"
      - "ผลต่างคงที่แปลว่าเชิงเส้น"
    solution: "ผลต่าง $3, 3, 3$ คงที่ จุดตัดแกน $y$ คือ 5 จึงได้ $y = 3x + 5$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.modelling.mathematical-modelling.p004
    topics: [math.modelling.mathematical-modelling]
    difficulty: 2
    type: mcq
    stem: "จำนวนเชื้อแบคทีเรียในจานเพาะเชื้อ (ข้อมูลสมมติ) เมื่อเวลา 0, 1, 2, 3 ชั่วโมง เป็น 300, 600, 1,200, 2,400 ตัว แบบจำลองใดเหมาะที่สุด ($t$ เป็นชั่วโมง)"
    choices:
      - { id: a, text: "$N = 300 \\cdot 2^t$", correct: true }
      - { id: b, text: "$N = 300 + 300t$", feedback: "ที่ $t = 2$ ได้ 900 ไม่ใช่ 1,200 ผลต่างไม่คงที่ (300, 600, 1,200)" }
      - { id: c, text: "$N = 300t^2$", feedback: "ที่ $t = 0$ ได้ 0 ไม่ใช่ 300" }
      - { id: d, text: "$N = 600t$", feedback: "ที่ $t = 0$ ได้ 0 และที่ $t = 3$ ได้ 1,800 ไม่ใช่ 2,400" }
    hints:
      - "หาอัตราส่วนของค่าที่อยู่ติดกัน"
      - "อัตราส่วนคงที่แปลว่าเอกซ์โพเนนเชียล"
    solution: "$\\tfrac{600}{300} = \\tfrac{1200}{600} = \\tfrac{2400}{1200} = 2$ เพิ่มเป็นสองเท่าทุกชั่วโมง ได้ $N = 300 \\cdot 2^t$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.modelling.mathematical-modelling.p005
    topics: [math.modelling.mathematical-modelling]
    difficulty: 2
    type: expression
    stem: "แท็กซี่ในเมืองหนึ่ง (อัตราสมมติ) คิดค่าเริ่มต้น 35 บาท และกิโลเมตรละ 6 บาท จงเขียนค่าโดยสาร $C$ (บาท) เมื่อเดินทาง $d$ กิโลเมตร"
    prefix: "C ="
    answer: { latex: "35+6d", variables: [d] }
    hints:
      - "ค่าโดยสาร = ค่าเริ่มต้น + (ค่าต่อกิโลเมตร × จำนวนกิโลเมตร)"
      - "ค่าเริ่มต้นไม่ขึ้นกับ $d$"
    misconceptions:
      - { match: "6+35d", feedback: "สลับกัน 35 บาทจ่ายครั้งเดียว ส่วน 6 บาทจ่ายทุกกิโลเมตร" }
      - { match: "41d", feedback: "ค่าเริ่มต้นจ่ายครั้งเดียว ไม่ได้คูณกับระยะทาง" }
    solution: "$C = 35 + 6d$ บาท เป็นแบบจำลองเชิงเส้น (ผลต่างคงที่ 6 บาทต่อกิโลเมตร)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.modelling.mathematical-modelling.p006
    topics: [math.modelling.mathematical-modelling]
    difficulty: 2
    type: numeric
    stem: "จังหวัดหนึ่ง (ข้อมูลสมมติ) มีประชากร 900,000 คน พื้นที่ 7,500 ตารางกิโลเมตร จงหาความหนาแน่นประชากร (คนต่อตารางกิโลเมตร)"
    answer: { value: 120, unit: คนต่อตารางกิโลเมตร }
    hints:
      - "ความหนาแน่น = จำนวนคน ÷ พื้นที่"
      - "$900{,}000 \\div 7{,}500$"
    misconceptions:
      - { match: 0.0083, feedback: "หารกลับด้าน ได้ตารางกิโลเมตรต่อคน" }
    solution: "$\\dfrac{900{,}000}{7{,}500} = 120$ คนต่อตารางกิโลเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.modelling.mathematical-modelling.p007
    topics: [math.modelling.mathematical-modelling]
    difficulty: 3
    type: numeric
    stem: "เจ้าหน้าที่ป่าไม้ประมาณปริมาตรเนื้อไม้ของต้นยางนาต้นหนึ่งโดยถือว่าลำต้นเป็นทรงกระบอก เส้นผ่านศูนย์กลาง 0.6 เมตร สูง 8 เมตร (ไม่รวมกิ่ง) จงหาปริมาตรโดยประมาณ (ลูกบาศก์เมตร ทศนิยมสองตำแหน่ง)"
    answer: { value: 2.26, tolerance: 0.02, unit: ลูกบาศก์เมตร }
    hints:
      - "ปริมาตรทรงกระบอก $V = \\pi r^2h$"
      - "รัศมีคือครึ่งหนึ่งของเส้นผ่านศูนย์กลาง $r = 0.3$ เมตร"
    misconceptions:
      - { match: 9.05, feedback: "ใช้เส้นผ่านศูนย์กลาง 0.6 เป็นรัศมี ต้องใช้ $r = 0.3$" }
      - { match: 0.72, feedback: "ลืมคูณ $\\pi$" }
    solution: "$V = \\pi(0.3)^2(8) = 0.72\\pi \\approx 2.26$ ลูกบาศก์เมตร (ลำต้นจริงเรียวขึ้นด้านบน ปริมาตรจริงจึงน้อยกว่านี้เล็กน้อย)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.modelling.mathematical-modelling.p008
    topics: [math.modelling.mathematical-modelling]
    difficulty: 3
    type: numeric
    stem: "ข้อมูล $x = 0, 1, 2, 3, 4$ ให้ $y = 2, 5, 10, 17, 26$ ใช้แบบจำลองที่เหมาะสมทำนายค่า $y$ เมื่อ $x = 6$"
    answer: { value: 50 }
    hints:
      - "ผลต่างครั้งแรกคือ 3, 5, 7, 9 ไม่คงที่ แต่ผลต่างครั้งที่สองคงที่"
      - "แบบจำลองกำลังสอง ลองต่อผลต่าง: 11, 13 หรือหาสูตร $y = x^2 + 2x + 2$"
    misconceptions:
      - { match: 44, feedback: "ต่อด้วยผลต่างคงที่ 9 (แบบเชิงเส้น) แต่ผลต่างเพิ่มขึ้นทีละ 2" }
      - { match: 37, feedback: "37 คือค่าที่ $x = 5$ โจทย์ถาม $x = 6$" }
    solution: "ผลต่างครั้งที่สองคงที่ 2 จึงเป็นกำลังสอง: $y = x^2 + 2x + 2$ (ตรวจ $x = 3$: $9 + 6 + 2 = 17$ ✓) ที่ $x = 6$: $36 + 12 + 2 = 50$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.modelling.mathematical-modelling.p009
    topics: [math.modelling.mathematical-modelling]
    difficulty: 4
    type: numeric
    stem: "งานสองแห่งเริ่มเงินเดือน 20,000 บาทเท่ากัน (ตัวเลขสมมติ) งาน A ขึ้นปีละ 2,000 บาท งาน B ขึ้นปีละ 8% ของเงินเดือนปีก่อน หลังผ่านไปกี่ปีเต็ม เงินเดือนของงาน B จึงมากกว่างาน A เป็นครั้งแรก"
    answer: { value: 7, unit: ปี }
    hints:
      - "แบบจำลอง: $A(n) = 20000 + 2000n$ และ $B(n) = 20000(1.08)^n$"
      - "ทำตารางเทียบปีที่ 5, 6, 7, 8"
    misconceptions:
      - { match: 6, feedback: "ปีที่ 6: $B \\approx 31{,}737$ ยังน้อยกว่า $A = 32{,}000$" }
      - { match: 1, feedback: "ปีแรก B ขึ้นแค่ 1,600 บาท น้อยกว่า A ช่วงแรกเชิงเส้นนำอยู่" }
    solution: "ปีที่ 6: $A = 32{,}000$, $B \\approx 31{,}737$ ปีที่ 7: $A = 34{,}000$, $B \\approx 34{,}276$ B แซงในปีที่ 7 และทิ้งห่างขึ้นเรื่อย ๆ (เอกซ์โพเนนเชียลแซงเชิงเส้นในที่สุด)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.modelling.mathematical-modelling.p010
    topics: [math.modelling.mathematical-modelling]
    difficulty: 3
    type: numeric
    stem: "ช่างผสมคอนกรีตด้วยอัตราส่วนปูน : ทราย : หิน $= 1 : 2 : 4$ (โดยปริมาตร) ถ้าต้องการวัสดุรวม 21 ถัง ต้องใช้ทรายกี่ถัง"
    answer: { value: 6, unit: ถัง }
    hints:
      - "อัตราส่วนรวม $1 + 2 + 4 = 7$ ส่วน"
      - "ทรายคือ 2 ส่วนจาก 7 ส่วน"
    misconceptions:
      - { match: 7, feedback: "แบ่ง 21 ถังเท่ากันสามวัสดุ แต่ต้องแบ่งตามอัตราส่วน 1 : 2 : 4 รวม 7 ส่วน" }
      - { match: 10.5, feedback: "ใช้ $\\tfrac12$ ของทั้งหมด แต่ทรายคือ $\\tfrac27$" }
    solution: "หนึ่งส่วน $= 21 \\div 7 = 3$ ถัง ทราย $= 2 \\times 3 = 6$ ถัง (ปูน 3 หิน 12)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.modelling.mathematical-modelling.p011
    topics: [math.modelling.mathematical-modelling]
    difficulty: 3
    type: numeric
    stem: "แผนที่เดินป่าอุทยานแห่งชาติเขาใหญ่ฉบับหนึ่งใช้มาตราส่วน 1 : 50,000 เส้นทางเดินบนแผนที่ยาว 4.6 เซนติเมตร ระยะจริงกี่กิโลเมตร"
    answer: { value: 2.3, tolerance: 0.01, unit: กิโลเมตร }
    hints:
      - "ระยะจริง $= 4.6 \\times 50{,}000$ เซนติเมตร"
      - "1 กิโลเมตร $= 100{,}000$ เซนติเมตร"
    misconceptions:
      - { match: 230, feedback: "230,000 เซนติเมตรเท่ากับ 2,300 เมตร ไม่ใช่ 230 กิโลเมตร ต้องหารด้วย 100,000" }
      - { match: 23, feedback: "แปลงหน่วยไม่ครบ 230,000 เซนติเมตร = 2.3 กิโลเมตร" }
    solution: "$4.6 \\times 50{,}000 = 230{,}000$ เซนติเมตร $= 2{,}300$ เมตร $= 2.3$ กิโลเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.modelling.mathematical-modelling.p012
    topics: [math.modelling.mathematical-modelling]
    difficulty: 4
    type: numeric
    stem: "โมเดลจำลองเจดีย์องค์หนึ่งย่อส่วน 1 : 100 (ทุกความยาว) โมเดลมีปริมาตร 0.02 ลูกบาศก์เมตร เจดีย์จริงมีปริมาตรประมาณกี่ลูกบาศก์เมตร"
    answer: { value: 20000, unit: ลูกบาศก์เมตร }
    hints:
      - "ความยาวคูณ 100 ปริมาตรคูณ $100^3$"
      - "$0.02 \\times 1{,}000{,}000$"
    misconceptions:
      - { match: 2, feedback: "คูณ 100 ซึ่งใช้กับความยาวเท่านั้น ปริมาตรต้องคูณ $100^3$" }
      - { match: 200, feedback: "คูณ $100^2$ ซึ่งใช้กับพื้นที่ ปริมาตรต้องคูณ $100^3$" }
    solution: "ปริมาตรคูณ $100^3 = 1{,}000{,}000$ จึงได้ $0.02 \\times 1{,}000{,}000 = 20{,}000$ ลูกบาศก์เมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.modelling.mathematical-modelling.p013
    topics: [math.modelling.mathematical-modelling]
    difficulty: 5
    type: numeric
    stem: "ต้องการทำแปลงผักรูปสี่เหลี่ยมผืนผ้าพื้นที่ 200 ตารางเมตร ติดกำแพงหนึ่งด้านดังภาพ ล้อมรั้วอีกสามด้าน ต้องใช้รั้วอย่างน้อยกี่เมตร"
    figure:
      src: fence-wall.svg
      alt: "แปลงผักรูปสี่เหลี่ยมผืนผ้าติดกำแพงด้านบน ด้านที่ติดกำแพงยาว x เมตรไม่มีรั้ว เส้นสีส้มคือรั้วสามด้าน ได้แก่ สองด้านที่ตั้งฉากกับกำแพงยาว y เมตร และด้านตรงข้ามกำแพงยาว x เมตร ในแปลงเขียนว่าพื้นที่ 200 m²"
    answer: { value: 40, unit: เมตร }
    hints:
      - "ความยาวรั้ว $F = x + 2y$ และ $xy = 200$ จึง $F = \\dfrac{200}{y} + 2y$"
      - "ลองทำตาราง $y = 5, 8, 10, 12, 20$ หรือใช้ว่า $F$ น้อยที่สุดเมื่อ $\\tfrac{200}{y} = 2y$"
    misconceptions:
      - { match: 56.57, feedback: "นี่คือรั้วรอบจัตุรัสสี่ด้าน ($4\\sqrt{200}$) แต่ด้านที่ติดกำแพงไม่ต้องล้อม" }
      - { match: 42.43, feedback: "คิดว่าแปลงจัตุรัส ($x = y = \\sqrt{200}$) ใช้รั้วน้อยที่สุด แต่มีรั้วแค่สามด้าน ด้านที่ขนานกับกำแพงควรยาวเป็นสองเท่าของ $y$" }
    solution: "$F(y) = \\dfrac{200}{y} + 2y$ ตาราง: $y = 5 \\to 50$, $y = 8 \\to 41$, $y = 10 \\to 40$, $y = 12 \\to 40.67$ น้อยที่สุดที่ $y = 10$, $x = 20$ ใช้รั้ว $20 + 2(10) = 40$ เมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.modelling.mathematical-modelling.p014
    topics: [math.modelling.mathematical-modelling]
    difficulty: 4
    type: numeric
    stem: "ร้านน้ำผลไม้ปั่นของสหกรณ์โรงเรียนสร้างแบบจำลองกำไรต่อวัน $P(x) = -2x^2 + 80x - 600$ บาท เมื่อขายแก้วละ $x$ บาท (แบบจำลองสมมติ) ควรตั้งราคาแก้วละกี่บาทจึงได้กำไรมากที่สุด"
    answer: { value: 20, unit: บาท }
    hints:
      - "$P$ เป็นพาราโบลาคว่ำ ค่าสูงสุดอยู่ที่จุดยอด"
      - "$x = -\\dfrac{b}{2a} = -\\dfrac{80}{2(-2)}$"
    misconceptions:
      - { match: 200, feedback: "200 บาทคือกำไรสูงสุด โจทย์ถามราคาที่ทำให้ได้กำไรสูงสุด" }
      - { match: 10, feedback: "ที่ราคา 10 บาท กำไรเป็นศูนย์ (เป็นรากของสมการ) ไม่ใช่จุดสูงสุด" }
    solution: "$x = \\dfrac{-80}{-4} = 20$ บาท ได้กำไร $P(20) = -800 + 1600 - 600 = 200$ บาทต่อวัน (ราคา 10 หรือ 30 บาทเท่าทุน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.modelling.mathematical-modelling.p015
    topics: [math.modelling.mathematical-modelling]
    difficulty: 4
    type: mcq
    stem: "ร้านข้าวเหนียวมะม่วงสร้างแบบจำลองยอดขาย $S = 120 - 8x$ กล่องต่อวัน เมื่อขึ้นราคาจาก 60 บาทไป $x$ บาท แบบจำลองนี้ทำนายว่าถ้าขึ้นราคา 20 บาท ยอดขายจะเป็น $-40$ กล่อง ข้อสรุปใดเหมาะสมที่สุด"
    choices:
      - { id: a, text: "แบบจำลองใช้ได้เฉพาะช่วง $0 \\le x \\le 15$ นอกช่วงนี้ต้องปรับแบบจำลอง", correct: true }
      - { id: b, text: "ร้านจะต้องรับคืนข้าวเหนียวมะม่วง 40 กล่อง", feedback: "ยอดขายติดลบไม่มีความหมายในสถานการณ์จริง แสดงว่าใช้แบบจำลองนอกช่วงที่ใช้ได้" }
      - { id: c, text: "แบบจำลองผิดทั้งหมด ใช้ไม่ได้เลย", feedback: "แบบจำลองอาจใช้ได้ดีในช่วงราคาที่มีข้อมูล ปัญหาคือนำไปใช้นอกช่วง" }
      - { id: d, text: "ต้องเปลี่ยนเป็นแบบจำลองเอกซ์โพเนนเชียลทันที", feedback: "ยังไม่มีข้อมูลบอกว่าเป็นเอกซ์โพเนนเชียล สิ่งแรกคือระบุช่วงที่แบบจำลองใช้ได้ แล้วเก็บข้อมูลเพิ่ม" }
    hints:
      - "ยอดขายต้องไม่ติดลบ"
      - "หาค่า $x$ ที่ทำให้ $S = 0$"
    solution: "$S = 0$ เมื่อ $x = 15$ แบบจำลองจึงสมเหตุสมผลเฉพาะ $0 \\le x \\le 15$ การประเมินแบบจำลองรวมถึงการบอกช่วงที่ใช้ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.modelling.mathematical-modelling.p016
    topics: [math.modelling.mathematical-modelling]
    difficulty: 4
    type: numeric
    stem: "ก๊อกน้ำในห้องน้ำโรงเรียนรั่วหยดละ 1 วินาที ถ้า 20 หยดเท่ากับ 1 มิลลิลิตร (สมมติฐาน) ใน 1 วันน้ำรั่วไปกี่ลิตร"
    answer: { value: 4.32, tolerance: 0.01, unit: ลิตร }
    hints:
      - "1 วัน $= 24 \\times 60 \\times 60 = 86{,}400$ วินาที"
      - "หยด → มิลลิลิตร (หาร 20) → ลิตร (หาร 1,000)"
    misconceptions:
      - { match: 4320, feedback: "4,320 คือมิลลิลิตร ต้องหารด้วย 1,000 เป็นลิตร" }
      - { match: 0.072, feedback: "คิดแค่ 1 ชั่วโมง (3,600 วินาที) ต้องคิด 24 ชั่วโมง" }
    solution: "$86{,}400$ หยด $\\div 20 = 4{,}320$ มิลลิลิตร $= 4.32$ ลิตรต่อวัน (ประมาณ 1,577 ลิตรต่อปี)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.modelling.mathematical-modelling.p017
    topics: [math.modelling.mathematical-modelling]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการสร้างแบบจำลองเพื่อตอบคำถาม \"ร้านควรสั่งแก้วกระดาษสัปดาห์ละกี่ใบ\""
    items:
      - "ตั้งสมมติฐาน: ยอดขายแต่ละวันใกล้เคียงกับเดือนที่ผ่านมา"
      - "เลือกตัวแปรและหน่วย: จำนวนแก้วที่ขายต่อวัน (ใบ)"
      - "สร้างแบบจำลอง: แก้วต่อสัปดาห์ = ค่าเฉลี่ยต่อวัน × 7 + ส่วนเผื่อ"
      - "คำนวณจากข้อมูลยอดขาย"
      - "ตีความและปัดขึ้นเป็นจำนวนแพ็กที่ร้านสั่งได้"
      - "ประเมินกับยอดขายจริงสัปดาห์ถัดไป แล้วปรับส่วนเผื่อ"
    hints:
      - "เริ่มจากสมมติฐานและตัวแปร"
      - "ประเมินและปรับเป็นขั้นสุดท้าย"
    solution: "สมมติฐาน → ตัวแปรและหน่วย → สร้างแบบจำลอง → คำนวณ → ตีความ → ประเมินและปรับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.modelling.mathematical-modelling.p018
    topics: [math.modelling.mathematical-modelling]
    difficulty: 5
    type: numeric
    stem: "บ่อเลี้ยงปลานิลมีปลา 200 ตัว หนึ่งเดือนต่อมามี 260 ตัว (ข้อมูลสมมติ) ถ้าใช้แบบจำลองที่จำนวนปลาเพิ่มเป็นร้อยละคงที่ทุกเดือน หลังกี่เดือนเต็มจำนวนปลาจะเกิน 1,000 ตัวเป็นครั้งแรก"
    answer: { value: 7, unit: เดือน }
    hints:
      - "อัตราส่วน $\\tfrac{260}{200} = 1.3$ แบบจำลอง $N = 200(1.3)^t$"
      - "ต้องการ $(1.3)^t > 5$ ใช้ลอการิทึมหรือทำตาราง"
    misconceptions:
      - { match: 6, feedback: "$200(1.3)^6 \\approx 965$ ยังไม่เกิน 1,000" }
      - { match: 14, feedback: "ใช้แบบจำลองเชิงเส้น (เพิ่มเดือนละ 60 ตัว) แต่โจทย์ให้เพิ่มเป็นร้อยละคงที่" }
    solution: "$(1.3)^t > 5 \\Rightarrow t > \\dfrac{\\log 5}{\\log 1.3} \\approx 6.13$ จึงเป็นเดือนที่ 7 ($200(1.3)^7 \\approx 1{,}255$ ตัว)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.modelling.mathematical-modelling.p019
    topics: [math.modelling.mathematical-modelling]
    difficulty: 5
    type: mcq
    stem: "จากแบบจำลอง $N = 200(1.3)^t$ ของบ่อปลาในข้อก่อน ทำนายได้ว่าเดือนที่ 30 จะมีปลาประมาณ 520,000 ตัว ข้อใดเป็นการประเมินและปรับแบบจำลองที่เหมาะสมที่สุด"
    choices:
      - { id: a, text: "บ่อมีพื้นที่และอาหารจำกัด การเพิ่มต้องช้าลงเมื่อปลามาก ควรใช้แบบจำลองที่มีจำนวนสูงสุด และใช้แบบจำลองเดิมเฉพาะช่วงแรก", correct: true }
      - { id: b, text: "เชื่อแบบจำลองได้ เพราะใช้ข้อมูลจริงสองเดือน", feedback: "ข้อมูลสองจุดไม่พอยืนยันว่าจะเพิ่ม 30% ไปตลอด และสมมติฐานนี้ขัดกับขนาดบ่อ" }
      - { id: c, text: "เปลี่ยนเป็นแบบจำลองเชิงเส้น เพราะเชิงเส้นให้ค่าน้อยกว่าเสมอ", feedback: "การเลือกแบบจำลองต้องอิงสาเหตุและข้อมูล ไม่ใช่เลือกเพราะให้ค่าน้อย และเชิงเส้นก็โตไม่จำกัดเหมือนกัน" }
      - { id: d, text: "ปัดคำตอบเป็น 500,000 ตัวเพื่อให้ดูสมเหตุสมผล", feedback: "การปัดเลขไม่ได้แก้สมมติฐานที่ผิด" }
    hints:
      - "สมมติฐาน 'เพิ่ม 30% ทุกเดือน' เป็นจริงได้นานแค่ไหน"
      - "ปัจจัยจริงใดที่จำกัดจำนวนปลา"
    solution: "แบบจำลองเอกซ์โพเนนเชียลไม่มีขีดจำกัด แต่บ่อจริงมีขีดจำกัด จึงต้องสะท้อนว่าสมมติฐานส่งผลต่อคำตอบ แล้วปรับแบบจำลองให้การเพิ่มช้าลงเมื่อใกล้ความจุของบ่อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.modelling.mathematical-modelling.p020
    topics: [math.modelling.mathematical-modelling]
    difficulty: 3
    type: match
    stem: "จับคู่สถานการณ์กับชนิดของแบบจำลอง"
    pairs:
      - { left: "ค่าจ้างรายวัน ชั่วโมงละ 50 บาท (ไม่มีค่าแรกเข้า)", right: "แปรผันตรง $y = kx$" }
      - { left: "ค่าโทรศัพท์รายเดือน 100 บาท บวกนาทีละ 1 บาท", right: "เชิงเส้น $y = mx + c$" }
      - { left: "ราคารถมือสองลดลง 15% ทุกปี", right: "เอกซ์โพเนนเชียล $y = ab^x$" }
      - { left: "พื้นที่จัตุรัสเมื่อด้านยาว $x$", right: "กำลังสอง $y = ax^2$" }
    hints:
      - "เพิ่มเป็นจำนวนคงที่ = เชิงเส้น เพิ่มหรือลดเป็นร้อยละคงที่ = เอกซ์โพเนนเชียล"
      - "เชิงเส้นที่ผ่านจุดกำเนิดคือแปรผันตรง"
    solution: "ค่าจ้าง $= 50x$ (แปรผันตรง); ค่าโทร $= 100 + x$ (เชิงเส้น); ราคารถ $= P(0.85)^x$ (เอกซ์โพเนนเชียล); พื้นที่ $= x^2$ (กำลังสอง)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.modelling.mathematical-modelling.p021
    topics: [math.modelling.mathematical-modelling]
    difficulty: 2
    type: numeric
    stem: "สหกรณ์โรงเรียนซื้อน้ำมะพร้าวมาแก้วละ 15 บาท ขายแก้วละ 25 บาท สมาชิกสหกรณ์ได้ส่วนลด 10% จากราคาขาย สหกรณ์ได้กำไรกี่บาทต่อแก้วเมื่อขายให้สมาชิก"
    answer: { value: 7.5, tolerance: 0.01, unit: บาท }
    hints:
      - "ราคาหลังลด 10% คือ $25 \\times 0.9$"
      - "กำไร = ราคาขาย − ต้นทุน"
    misconceptions:
      - { match: 10, feedback: "ลืมหักส่วนลดของสมาชิก" }
      - { match: 9, feedback: "ลด 10% จากราคาขาย 25 บาท ไม่ใช่จากกำไร 10 บาท" }
    solution: "ราคาสมาชิก $25 \\times 0.9 = 22.5$ บาท กำไร $22.5 - 15 = 7.5$ บาทต่อแก้ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.modelling.mathematical-modelling.p022
    topics: [math.modelling.mathematical-modelling]
    difficulty: 3
    type: expression
    stem: "ราคารถจักรยานยนต์มือสองคันหนึ่ง (สมมติ) ตอนนี้ 50,000 บาท ลดลงปีละ 15% ของราคาปีก่อน จงเขียนราคา $V$ (บาท) หลังผ่านไป $t$ ปี"
    prefix: "V ="
    answer: { latex: "50000\\cdot 0.85^t", variables: [t] }
    hints:
      - "ลด 15% คือคูณ 0.85 ทุกปี"
      - "คูณ $t$ ครั้งคือยกกำลัง $t$"
    misconceptions:
      - { match: "50000\\cdot 0.15^t", feedback: "0.15 คือส่วนที่ลด ราคาที่เหลือคือ 85%" }
      - { match: "50000-7500t", feedback: "นี่คือแบบลดเท่ากันทุกปี (เชิงเส้น) แต่โจทย์ลดเป็นร้อยละของราคาปีก่อน" }
    solution: "$V = 50000(0.85)^t$ บาท เช่น หลัง 2 ปี $50000 \\times 0.7225 = 36{,}125$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true
