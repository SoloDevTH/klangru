<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="520" height="330" font-family="sans-serif" font-size="15">
  <title>กล่อง 4 kg บนพื้นเอียง 30° ต่อเชือกข้ามรอกไปยังกล่อง 3 kg ที่แขวนอยู่</title>
  <rect x="0" y="0" width="520" height="330" fill="#ffffff"/>
  <polygon points="30,300 390,300 390,92.2" fill="#f3f1ea" stroke="#15211e" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="151" y="150.9" width="58" height="58" rx="0" fill="#e2f0ed" stroke="#15211e" stroke-width="2" transform="rotate(-30 180 179.9)"/>
  <text x="180" y="185.9" font-size="15" text-anchor="middle" font-weight="bold">4 kg</text>
  <line x1="390" y1="92.2" x2="396" y2="72.2" stroke="#15211e" stroke-width="3" stroke-linecap="round"/>
  <circle cx="396" cy="72.2" r="16" fill="#ffffff" stroke="#15211e" stroke-width="2.5"/>
  <circle cx="396" cy="72.2" r="3" fill="#15211e" stroke="#15211e" stroke-width="1"/>
  <line x1="205.2" y1="165.4" x2="388" y2="58.3" stroke="#6b7472" stroke-width="2" stroke-linecap="round"/>
  <line x1="412" y1="72.2" x2="412" y2="215" stroke="#6b7472" stroke-width="2" stroke-linecap="round"/>
  <rect x="386" y="215" width="52" height="52" rx="0" fill="#dbe8f7" stroke="#15211e" stroke-width="2"/>
  <text x="412" y="247" font-size="15" text-anchor="middle" font-weight="bold">3 kg</text>
  <path d="M 80 300 A 50 50 0 0 0 73.3 275" fill="none" stroke="#15211e" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="88" y="291" font-size="15">30°</text>
  <text x="40" y="40" font-size="14" fill="#6b7472">พื้นเอียงลื่น รอกเบาและลื่น</text>
</svg>
