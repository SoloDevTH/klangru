  - id: math.dec.p021
    topics: [math.number.decimals]
    difficulty: 4
    type: numeric
    stem: "น้ำปลาขวดใหญ่ 700 มล. ราคา 32.50 บาท ขวดเล็ก 300 มล. ราคา 15 บาท ถ้าคิดราคาต่อ 100 มล. ขวดใหญ่ถูกกว่าขวดเล็กกี่บาท (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 0.36, tolerance: 0.01, unit: บาท }
    hints:
      - "ราคาต่อ 100 มล. = ราคา ÷ (ปริมาตร ÷ 100)"
      - "ขวดใหญ่: $32.50 \\div 7$ ขวดเล็ก: $15 \\div 3$ แล้วนำมาลบกัน"
    misconceptions:
      - { match: 17.5, feedback: "นั่นคือผลต่างของราคาขวด แต่สองขวดมีปริมาตรต่างกัน ต้องเทียบราคาต่อปริมาตรเท่ากัน" }
    solution: "ขวดใหญ่ $32.50 \\div 7 \\approx 4.64$ บาทต่อ 100 มล. ขวดเล็ก $15 \\div 3 = 5.00$ บาทต่อ 100 มล. ขวดใหญ่ถูกกว่าประมาณ $5.00 - 4.64 = 0.36$ บาทต่อ 100 มล."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.dec.p022
    topics: [math.number.decimals]
    difficulty: 5
    type: numeric
    stem: "หาค่า $-2.5 \\times 0.4 - (-0.36) \\div 0.12$"
    answer: { value: 2, tolerance: 0.001 }
    hints:
      - "ทำคูณและหารก่อน แล้วค่อยลบ"
      - "$(-0.36) \\div 0.12$ ได้จำนวนลบ และลบด้วยจำนวนลบคือการบวก"
    misconceptions:
      - { match: -4, feedback: "ลืมว่า $-(-3) = +3$ ลบด้วยจำนวนลบคือบวก" }
      - { match: -5.33, feedback: "ลบก่อนแล้วจึงหาร ($(-1 + 0.36) \\div 0.12$) แต่ต้องหาร $(-0.36) \\div 0.12 = -3$ ก่อนลบ" }
    solution: "$-2.5 \\times 0.4 = -1$ และ $(-0.36) \\div 0.12 = -36 \\div 12 = -3$ จึงได้ $-1 - (-3) = -1 + 3 = 2$"
