    answer: { value: 7.5, tolerance: 0.05, unit: J }
    hints:
      - "แรงไม่คงที่ วาดกราฟแรงกับระยะยืดแล้วหาพื้นที่ใต้กราฟ"
      - "กราฟเป็นสามเหลี่ยม พื้นที่ $= \\tfrac{1}{2} \\times$ ฐาน $\\times$ สูง"
    misconceptions:
      - { match: 15, feedback: "ดูเหมือนใช้แรงสูงสุด $60\\ \\mathrm{N}$ คูณระยะทั้งหมด แต่แรงเริ่มจากศูนย์ แรงเฉลี่ยจึงเป็นเพียง $30\\ \\mathrm{N}$" }
      - { match: 240, feedback: "ดูเหมือนนำแรงหารด้วยระยะ ซึ่งได้ค่าความแข็งของยาง ($\\mathrm{N/m}$) ไม่ใช่งาน" }
    solution: "งาน = พื้นที่สามเหลี่ยมใต้กราฟ $= \\tfrac{1}{2}(0.25)(60) = 7.5\\ \\mathrm{J}$ (เท่ากับแรงเฉลี่ย $30\\ \\mathrm{N}$ คูณ $0.25\\ \\mathrm{m}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.work.p021
    topics: [physics.energy.work]
