  solution: ไม่ร่วมล้อ ช่วยเพื่อนอย่างปลอดภัย บอกผู้ใหญ่ที่ไว้ใจ และเก็บหลักฐานไว้อย่างปลอดภัย สำหรับเด็กโทร 1387 สายเด็ก หรือโทร 1300 ศูนย์ช่วยเหลือสังคมเมื่อต้องการความช่วยเหลือจากหน่วยงานรัฐ
