    stem: "ในประเทศหนาว ผิวหน้าของทะเลสาบเป็นน้ำแข็ง แต่ปลาด้านล่างยังมีชีวิตอยู่ในน้ำที่ไม่แข็ง ข้อใดอธิบายได้ถูกต้องที่สุด"
