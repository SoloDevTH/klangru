    ai_assisted: true

  - id: health.fitness.fitness-components.p013
    topics: [health.fitness.fitness-components]
    difficulty: 4
    type: mcq
    stem: "เด็กชายอายุ 12 ปีมีผลทดสอบ: นั่งงอตัวไปข้างหน้า 5 เซนติเมตร ลุก-นั่ง 36 ครั้ง ดันพื้น 21 ครั้ง ใช้ตารางเกณฑ์อายุ 12 ปี ข้อใดเป็นแผนปรับปรุงที่เหมาะสมที่สุด"
    figure:
      src: norms-age12.svg
      alt: "ตารางเกณฑ์สมรรถภาพทางกายเด็กอายุ 12 ปี กรมพลศึกษา 2555 ห้าระดับ ต่ำมาก ต่ำ ปานกลาง ดี ดีมาก ลุก-นั่ง 60 วินาที ชาย: 13 ลงมา, 14–23, 24–33, 34–43, 44 ขึ้นไป หญิง: 12 ลงมา, 13–22, 23–32, 33–42, 43 ขึ้นไป ดันพื้น 30 วินาที ชาย: 11 ลงมา, 12–19, 20–27, 28–35, 36 ขึ้นไป หญิง: 9 ลงมา, 10–17, 18–25, 26–33, 34 ขึ้นไป นั่งงอตัวไปข้างหน้า (เซนติเมตร) ชาย: 3 ลงมา, 4–7, 8–11, 12–15, 16 ขึ้นไป หญิง: 4 ลงมา, 5–9, 10–14, 15–19, 20 ขึ้นไป"
    choices:
      - { id: a, text: "เน้นยืดเหยียดกล้ามเนื้อหลังและต้นขาด้านหลังทุกวัน และฝึกดันพื้นเพิ่ม รักษาการฝึกกล้ามเนื้อท้องไว้", correct: true }
      - { id: b, text: "ฝึกลุก-นั่งอย่างเดียวให้ถึงดีมาก", feedback: "ลุก-นั่งอยู่ระดับดีแล้ว ด้านที่ต่ำที่สุดคือความอ่อนตัว" }
      - { id: c, text: "ไม่ต้องปรับอะไร เพราะมีบางรายการได้ระดับดี", feedback: "ความอ่อนตัวอยู่ระดับต่ำ ควรพัฒนา" }
      - { id: d, text: "หยุดออกกำลังกายทุกอย่างจนกว่าจะทดสอบครั้งต่อไป", feedback: "การหยุดทำให้สมรรถภาพลดลง ต้องฝึกสม่ำเสมอ" }
    hints:
      - "แปลผลทีละรายการ: นั่งงอตัว 5, ลุก-นั่ง 36, ดันพื้น 21"
      - "ด้านที่ได้ระดับต่ำที่สุดควรพัฒนาก่อน"
    solution: "นั่งงอตัว 5 ซม. = ต่ำ ลุก-นั่ง 36 = ดี ดันพื้น 21 = ปานกลาง จึงควรเน้นความอ่อนตัวเป็นอันดับแรก เสริมกล้ามเนื้อแขน และรักษาระดับกล้ามเนื้อท้องไว้"
