    solution: "เมื่อหลอดไฟใกล้ สาหร่ายได้แสงเข้มขึ้น จำนวนฟองออกซิเจนต่อนาทีเพิ่มขึ้น แสดงว่าความเข้มของแสงมีผลต่ออัตราการสังเคราะห์ด้วยแสง"
