      - { id: c, text: "เมือง C ซึ่งอยู่หลังแนวปะทะอากาศเย็น", feedback: "หลังแนวปะทะอากาศเย็น อากาศเย็นและแห้งเข้ามาแทน ท้องฟ้ามักโปร่ง" }
