    choices:
      - { id: a, text: "ข้ออ้างใช้ไม่ได้กับทุกแปลง หลักฐานชี้ว่าไฟที่ไหม้ซ้ำทำให้การเปลี่ยนแปลงแทนที่ไม่ก้าวไปเป็นป่า ควรแก้เป็น 'ไร่ร้างที่ไม่ถูกไฟไหม้ซ้ำมักกลายเป็นป่า'", correct: true }
