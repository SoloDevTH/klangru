<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="sans-serif" font-size="14">
  <title>แผนภูมิแกนต์ของงาน P1 8 หน่วย P2 4 หน่วย P3 2 หน่วย ที่มาถึงพร้อมกัน แบบมาก่อนได้ก่อน และแบบงานสั้นที่สุดก่อน</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="860" height="300" fill="#ffffff"/>
  <text x="430.0" y="26.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">งานมาถึงเวลา 0 ตามลำดับ P1 (8), P2 (4), P3 (2)</text>
  <text x="138.0" y="77.0" font-size="14" text-anchor="end" fill="#1f2937" font-weight="bold" xml:space="preserve">FCFS</text>
  <rect x="150.0" y="50.0" width="256.0" height="40.0" rx="0" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.2"/>
  <text x="278.0" y="76.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">P1</text>
  <rect x="406.0" y="50.0" width="128.0" height="40.0" rx="0" fill="#bbf7d0" stroke="#1f2937" stroke-width="1.2"/>
  <text x="470.0" y="76.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">P2</text>
  <rect x="534.0" y="50.0" width="64.0" height="40.0" rx="0" fill="#fde68a" stroke="#1f2937" stroke-width="1.2"/>
  <text x="566.0" y="76.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">P3</text>
  <text x="150.0" y="108.0" font-size="12" text-anchor="middle" fill="#6b7280" xml:space="preserve">0</text>
  <text x="406.0" y="108.0" font-size="12" text-anchor="middle" fill="#6b7280" xml:space="preserve">8</text>
  <text x="534.0" y="108.0" font-size="12" text-anchor="middle" fill="#6b7280" xml:space="preserve">12</text>
  <text x="598.0" y="108.0" font-size="12" text-anchor="middle" fill="#6b7280" xml:space="preserve">14</text>
  <text x="614.0" y="77.0" font-size="13" text-anchor="start" fill="#1f2937" xml:space="preserve">รอเฉลี่ย (0 + 8 + 12) ÷ 3 ≈ 6.67</text>
  <text x="138.0" y="177.0" font-size="14" text-anchor="end" fill="#1f2937" font-weight="bold" xml:space="preserve">SJF</text>
  <rect x="150.0" y="150.0" width="64.0" height="40.0" rx="0" fill="#fde68a" stroke="#1f2937" stroke-width="1.2"/>
  <text x="182.0" y="176.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">P3</text>
  <rect x="214.0" y="150.0" width="128.0" height="40.0" rx="0" fill="#bbf7d0" stroke="#1f2937" stroke-width="1.2"/>
  <text x="278.0" y="176.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">P2</text>
  <rect x="342.0" y="150.0" width="256.0" height="40.0" rx="0" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.2"/>
  <text x="470.0" y="176.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">P1</text>
  <text x="150.0" y="208.0" font-size="12" text-anchor="middle" fill="#6b7280" xml:space="preserve">0</text>
  <text x="214.0" y="208.0" font-size="12" text-anchor="middle" fill="#6b7280" xml:space="preserve">2</text>
  <text x="342.0" y="208.0" font-size="12" text-anchor="middle" fill="#6b7280" xml:space="preserve">6</text>
  <text x="598.0" y="208.0" font-size="12" text-anchor="middle" fill="#6b7280" xml:space="preserve">14</text>
  <text x="614.0" y="177.0" font-size="13" text-anchor="start" fill="#1f2937" xml:space="preserve">รอเฉลี่ย (0 + 2 + 6) ÷ 3 ≈ 2.67</text>
  <text x="150.0" y="260.0" font-size="12" text-anchor="start" fill="#6b7280" xml:space="preserve">หน่วยเวลา</text>
</svg>
