  ai_assisted: true
- id: business.accounting.budgeting-variance.p015
  topics:
  - business.accounting.budgeting-variance
  difficulty: 4
  type: order
  stem: เรียงลำดับการจัดทำงบประมาณหลัก (master budget) ของกิจการผลิต
  items:
  - พยากรณ์ยอดขายและทำงบประมาณขาย
  - ทำงบประมาณการผลิตจากยอดขายและสินค้าคงเหลือที่ต้องการ
  - ทำงบประมาณวัตถุดิบ ค่าแรง และค่าใช้จ่ายการผลิต
  - ทำงบประมาณเงินสดจากเงินรับและเงินจ่ายทั้งหมด
  - ทำงบการเงินประมาณการ (กำไรขาดทุนและฐานะการเงิน)
  hints:
  - ทุกงบเริ่มจากยอดขายที่คาดไว้
  - งบเงินสดต้องใช้ตัวเลขจากงบอื่นทั้งหมด
  solution: งบขาย → งบการผลิต → งบวัตถุดิบ ค่าแรง ค่าใช้จ่ายการผลิต → งบเงินสด → งบการเงินประมาณการ ยอดขายที่พยากรณ์ (ดู [การพยากรณ์](/topic/business.stats.forecasting/)) จึงสำคัญที่สุด ถ้าพยากรณ์ผิด งบทั้งหมดผิดตาม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.budgeting-variance.p016
  topics:
  - business.accounting.budgeting-variance
  difficulty: 4
  type: numeric
  stem: โรงงานผลิตกระเป๋า (สมมติ) ขายปกติใบละ $250$ บาท ต้นทุนผันแปรใบละ $150$ บาท ต้นทุนคงที่ปันส่วนใบละ $60$ บาท และยังมีกำลังการผลิตว่าง ลูกค้ารายใหม่ขอซื้อพิเศษ $1{,}000$ ใบ ในราคาใบละ $190$ บาท โดยโรงงานต้องจ่ายค่าขนส่งเพิ่ม $5{,}000$ บาท ถ้ารับคำสั่งซื้อนี้ กำไรจะเปลี่ยนไปกี่บาท (ตอบเป็นบาท ถ้ากำไรลดลงให้ใส่เครื่องหมายลบ)
  answer:
    value: 35000
    unit: บาท
  misconceptions:
  - match: -25000
    feedback: หักต้นทุนคงที่ปันส่วน ซึ่งไม่ได้เพิ่มขึ้นจริงเมื่อรับคำสั่งซื้อ
  - match: 40000
    feedback: ลืมค่าขนส่งที่เพิ่มขึ้น
  hints:
  - ต้นทุนคงที่ต้องจ่ายอยู่แล้วไม่ว่าจะรับหรือไม่ จึงไม่เกี่ยวข้อง
  - กำไรเพิ่ม $=$ (ราคาพิเศษ $-$ ต้นทุนผันแปร) $\times$ จำนวน $-$ ค่าใช้จ่ายเพิ่ม
  solution: กำไรส่วนเกินเพิ่ม $= (190 - 150) \times 1{,}000 = 40{,}000$ บาท หักค่าขนส่ง $5{,}000$ บาท กำไรเพิ่ม $35{,}000$ บาท จึงควรรับ (ถ้าไม่กระทบราคาขายให้ลูกค้าเดิม)
