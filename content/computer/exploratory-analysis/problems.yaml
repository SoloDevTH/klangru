problems:
  - id: computer.data.exploratory-analysis.p001
    topics: [computer.data.exploratory-analysis]
    difficulty: 1
    type: mcq
    stem: "ข้อใดอธิบายความต่างระหว่าง **ค่าเฉลี่ย** กับ **มัธยฐาน** ได้ถูกต้อง"
    choices:
      - { id: a, text: "ค่าเฉลี่ยคือค่าที่พบบ่อยที่สุด ส่วนมัธยฐานคือค่าต่ำสุด", feedback: "ค่าที่พบบ่อยที่สุดคือฐานนิยม ส่วนค่าต่ำสุดไม่ใช่ค่ากลาง" }
      - { id: b, text: "ค่าเฉลี่ยคือผลรวมหารจำนวน ส่วนมัธยฐานคือค่าตรงกลางของข้อมูลที่เรียงแล้ว", correct: true }
      - { id: c, text: "ค่าเฉลี่ยกับมัธยฐานเป็นค่าเดียวกันเสมอ", feedback: "ค่าทั้งสองตรงกันได้บางกรณี แต่ไม่ใช่เสมอ โดยเฉพาะเมื่อมีค่าสุดขั้ว" }
      - { id: d, text: "มัธยฐานคือผลต่างระหว่างค่าสูงสุดกับต่ำสุด", feedback: "นั่นคือพิสัย (range) ไม่ใช่มัธยฐาน" }
    hints:
      - "ลองนึกว่าค่าเฉลี่ยคำนวณจากอะไร"
      - "มัธยฐานต้องเรียงข้อมูลก่อนจึงหาได้"
      - "เลือกข้อที่บอกวิธีหาทั้งสองค่าได้ถูกต้อง"
    solution: "ค่าเฉลี่ยได้จากผลรวมหารด้วยจำนวนข้อมูล ส่วนมัธยฐานคือค่าที่อยู่ตรงกลางเมื่อเรียงข้อมูลแล้ว ทั้งสองไม่เท่ากันเสมอไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.exploratory-analysis.p002
    topics: [computer.data.exploratory-analysis]
    difficulty: 1
    type: order
    stem: "เรียงขั้นตอนของการวิเคราะห์ข้อมูลเชิงสำรวจ จากขั้นแรกไปขั้นสุดท้าย"
    items:
      - "ตั้งคำถามให้ชัดว่าต้องการรู้อะไร"
      - "ตรวจว่าข้อมูลมีค่าที่หายไปหรือค่าผิดปกติหรือไม่"
      - "สรุปข้อมูลเชิงปริมาณด้วยค่ากลางและการกระจาย"
      - "ดูความสัมพันธ์หรือความต่างระหว่างกลุ่มด้วยตารางและกราฟ"
      - "ตีความผลและโยงกลับไปยังคำถามเดิม"
    hints:
      - "ก่อนคำนวณอะไรควรรู้ก่อนว่าจะตอบคำถามอะไร"
      - "ก่อนสรุปค่ากลาง ต้องรู้ว่าข้อมูลสะอาดพอหรือยัง"
      - "ขั้นสุดท้ายคือการเชื่อมผลกลับไปยังคำถามที่ตั้งไว้"
    solution: "เริ่มจากตั้งคำถาม แล้วตรวจข้อมูล สรุปเชิงปริมาณ ดูความสัมพันธ์หรือความต่างระหว่างกลุ่ม และสุดท้ายตีความเพื่อตอบคำถามเดิม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.exploratory-analysis.p003
    topics: [computer.data.exploratory-analysis]
    difficulty: 1
    type: numeric
    stem: "นักเรียนคนหนึ่งอ่านหนังสือนอกเวลาในเจ็ดวันสมมติ ได้นาทีดังนี้ 30, 45, 60, 25, 40, 50, 50 ค่าเฉลี่ยต่อวันคือกี่นาที (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 42.86, tolerance: 0.01, unit: "นาที" }
    misconceptions:
      - { match: 45, feedback: "45 คือมัธยฐาน (ค่ากลางของข้อมูลที่เรียงแล้ว) ไม่ใช่ค่าเฉลี่ย" }
    hints:
      - "ค่าเฉลี่ยคือผลรวมหารด้วยจำนวนวัน"
      - "หาผลรวมของทั้งเจ็ดวันก่อน"
      - "นำผลรวมมาหารด้วย 7 แล้วปัดเป็นทศนิยม 2 ตำแหน่ง"
    solution: "ผลรวมคือ 30 + 45 + 60 + 25 + 40 + 50 + 50 = 300 นาที หารด้วย 7 ได้ประมาณ 42.86 นาทีต่อวัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.exploratory-analysis.p004
    topics: [computer.data.exploratory-analysis]
    difficulty: 2
    type: mcq
    stem: "รายได้ของพนักงานในร้านสมมติ 5 คนคือ 15,000 15,000 16,000 17,000 และ 120,000 บาท เหตุผลใดอธิบายได้ดีที่สุดว่าทำไมค่าเฉลี่ยสูงกว่ารายได้ที่คนส่วนใหญ่ได้"
    choices:
      - { id: a, text: "พนักงานทุกคนได้รับเงินเท่ากัน", feedback: "ข้อมูลแสดงว่าไม่เท่ากัน" }
      - { id: b, text: "มีการพิมพ์ค่าผิดในข้อมูลทั้งหมด", feedback: "ไม่มีหลักฐานว่าข้อมูลทั้งหมดผิด" }
      - { id: c, text: "ค่าสูงสุดหนึ่งค่าดึงค่าเฉลี่ยขึ้น ขณะที่มัธยฐานไม่ถูกดึงมากนัก", correct: true }
      - { id: d, text: "ค่าเฉลี่ยคำนวณจากจำนวนคนเท่านั้น จึงไม่ได้รับผลจากตัวเลขรายได้", feedback: "ค่าเฉลี่ยใช้ผลรวมของตัวเลขทุกค่า" }
    hints:
      - "ลองคำนวณค่าเฉลี่ยกับมัธยฐานของข้อมูลนี้ดู"
      - "ค่าเฉลี่ยใช้ผลรวมของทุกค่า ค่าที่สูงมากจะมีผลต่อผลรวมอย่างไร"
      - "เลือกข้อที่บอกว่าค่าสุดขั้วมีผลต่อค่าเฉลี่ยมากกว่ามัธยฐาน"
    solution: "ค่าเฉลี่ยของข้อมูลนี้ประมาณ 36,600 บาท ถูกดึงขึ้นด้วยค่า 120,000 บาท ส่วนมัธยฐาน 16,000 บาทใกล้ค่าส่วนใหญ่มากกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.exploratory-analysis.p005
    topics: [computer.data.exploratory-analysis]
    difficulty: 2
    type: numeric
    stem: "ยอดขายน้ำของแผงสมมติในแปดวันคือ 3, 9, 4, 7, 10, 6, 5, 12 แก้ว มัธยฐานของยอดขายคือกี่แก้ว"
    answer: { value: 6.5, tolerance: 0, unit: "แก้ว" }
    misconceptions:
      - { match: 7, feedback: "เมื่อจำนวนข้อมูลเป็นคู่ ต้องเฉลี่ยค่าสองตัวที่อยู่ตรงกลาง ไม่ใช่เลือกเพียงตัวเดียว" }
    hints:
      - "เรียงข้อมูลจากน้อยไปมากก่อน"
      - "จำนวนข้อมูลเป็นเลขคู่ จึงมีค่าตรงกลางสองค่า"
      - "หาค่าเฉลี่ยของสองค่าที่อยู่ตรงกลาง"
    solution: "เรียงได้ 3, 4, 5, 6, 7, 9, 10, 12 ค่าตรงกลางคือ 6 และ 7 มัธยฐานจึงเป็น (6 + 7) ÷ 2 = 6.5 แก้ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.exploratory-analysis.p006
    topics: [computer.data.exploratory-analysis]
    difficulty: 2
    type: text
    stem: "ค่าที่ต่ำกว่า Q1 − 1.5 × IQR หรือสูงกว่า Q3 + 1.5 × IQR เรียกว่าอะไร (ตอบเป็นภาษาไทยหรืออังกฤษก็ได้)"
    accepted: ["ค่าผิดปกติ", "outlier", "ค่าผิดปกติ (outlier)"]
    hints:
      - "เป็นคำที่ใช้เรียกค่าที่อยู่ห่างจากกลุ่มข้อมูลส่วนใหญ่มาก"
      - "คำนี้ไม่ได้แปลว่าค่านั้นผิดเสมอไป"
      - "ขึ้นต้นด้วยคำว่า ค่า และหมายถึงค่าที่ต้องตรวจเป็นพิเศษ"
    solution: "ค่าที่อยู่นอกช่วง Q1 − 1.5 × IQR ถึง Q3 + 1.5 × IQR เรียกว่าค่าผิดปกติ (outlier) ซึ่งต้องตรวจหาสาเหตุก่อนตัดสินใจ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.exploratory-analysis.p007
    topics: [computer.data.exploratory-analysis]
    difficulty: 2
    type: match
    stem: "จับคู่ค่าสถิติกับความหมายที่ถูกต้อง"
    pairs:
      - { left: "ค่าเฉลี่ย (mean)", right: "ผลรวมของทุกค่าหารด้วยจำนวนค่า ได้รับผลจากค่าสุดขั้ว" }
      - { left: "มัธยฐาน (median)", right: "ค่าที่อยู่ตรงกลางเมื่อเรียงข้อมูลแล้ว ไม่ถูกดึงด้วยค่าสุดขั้วมาก" }
      - { left: "พิสัย (range)", right: "ผลต่างระหว่างค่าสูงสุดกับค่าต่ำสุด" }
      - { left: "ฐานนิยม (mode)", right: "ค่าที่ปรากฏบ่อยที่สุดในข้อมูล" }
    hints:
      - "ดูว่าแต่ละค่าคำนวณจากอะไร"
      - "ค่าที่ใช้ตำแหน่งเมื่อเรียงข้อมูลไม่ได้ใช้ผลรวม"
      - "ค่าที่บอกช่วงกว้างทั้งหมดใช้เพียงค่าสูงสุดและต่ำสุด"
    solution: "ค่าเฉลี่ยใช้ผลรวม มัธยฐานใช้ตำแหน่งกลาง พิสัยใช้ค่าสูงสุดลบต่ำสุด และฐานนิยมคือค่าที่พบบ่อยที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.exploratory-analysis.p008
    topics: [computer.data.exploratory-analysis]
    difficulty: 2
    type: mcq
    stem: "**ตารางไขว้** คืออะไร"
    choices:
      - { id: a, text: "ตารางที่นับจำนวนสมาชิกในแต่ละคู่ของค่าของตัวแปรสองตัวพร้อมกัน", correct: true }
      - { id: b, text: "ตารางที่เรียงข้อมูลจากมากไปน้อยตามตัวแปรเดียว", feedback: "นั่นคือการเรียงลำดับ ไม่ได้นับจำนวนคู่ของค่า" }
      - { id: c, text: "ตารางที่สรุปค่าเฉลี่ยของทุกคอลัมน์ไว้ในแถวเดียว", feedback: "นั่นคือการสรุปค่าเฉลี่ย ไม่ได้แสดงการนับร่วมของตัวแปรสองตัว" }
      - { id: d, text: "ตารางที่สลับแถวกับคอลัมน์ของตารางเดิม", feedback: "การสลับแถวกับคอลัมน์ไม่ได้ทำให้เกิดตารางไขว้" }
    hints:
      - "ตารางไขว้มีทั้งแถวและคอลัมน์ที่แทนตัวแปรสองตัว"
      - "เซลล์ในตารางไขว้บอกว่ามีกี่คนที่อยู่ในทั้งสองค่าพร้อมกัน"
      - "เลือกข้อที่บอกว่านับอะไรในแต่ละเซลล์"
    solution: "ตารางไขว้นับจำนวนสมาชิกที่มีค่าของตัวแปรแถวและตัวแปรคอลัมน์พร้อมกัน ใช้ดูความสัมพันธ์ระหว่างสองตัวแปรเชิงคุณภาพ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.exploratory-analysis.p009
    topics: [computer.data.exploratory-analysis]
    difficulty: 3
    type: numeric
    stem: "คะแนนสอบ 10 คนสมมติคือ 30, 45, 60, 25, 40, 50, 50, 70, 55, 65 เมื่อคำนวณ Q1 และ Q3 ด้วย statistics.quantiles(n=4) (วิธีค่าเริ่มต้น) แล้วหาพิสัยระหว่างควอร์ไทล์ (Q3 − Q1) ได้เท่าใด (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 23.75, tolerance: 0.01, unit: "คะแนน" }
    misconceptions:
      - { match: 20, feedback: "วิธีแบ่งครึ่งข้อมูลด้วยมัธยฐานของแต่ละครึ่งให้ค่าต่างออกไป โจทย์กำหนดให้ใช้ statistics.quantiles" }
    hints:
      - "เรียงข้อมูลจากน้อยไปมากก่อน แล้วคำนวณ statistics.quantiles(data, n=4)"
      - "ผลที่ได้มีสามค่า ค่าแรกคือ Q1 และค่าที่สามคือ Q3"
      - "นำ Q3 ลบด้วย Q1"
    solution: "statistics.quantiles ให้ Q1 = 37.5 และ Q3 = 61.25 จึงได้ IQR = 61.25 − 37.5 = 23.75 คะแนน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.exploratory-analysis.p010
    topics: [computer.data.exploratory-analysis]
    difficulty: 3
    type: numeric
    stem: "เวลาอ่านต่อสัปดาห์ของนักเรียนสิบคนสมมติคือ 3, 4, 6, 6, 7, 8, 8, 9, 11, 30 ชั่วโมง ค่าขอบบน Q3 + 1.5 × IQR โดยใช้ statistics.quantiles(n=4) (วิธีค่าเริ่มต้น) เท่ากับเท่าไร (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 15.5, tolerance: 0.01, unit: "ชั่วโมง" }
    misconceptions:
      - { match: 30, feedback: "ค่าขอบคำนวณจาก Q3 และ IQR ไม่ใช่ค่าสูงสุดของข้อมูล" }
    hints:
      - "หา Q1 และ Q3 ด้วย statistics.quantiles ก่อน"
      - "IQR คือ Q3 ลบ Q1 แล้วนำไปคูณ 1.5"
      - "นำผลคูณที่ได้ไปบวกกับ Q3"
    solution: "Q1 = 5.5, Q3 = 9.5, IQR = 4 จึงได้ขอบบน 9.5 + 1.5 × 4 = 15.5 ชั่วโมง ค่า 30 ที่สูงกว่าขอบนี้จึงเป็นค่าผิดปกติ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.exploratory-analysis.p011
    topics: [computer.data.exploratory-analysis]
    difficulty: 3
    type: numeric
    stem: "ตารางไขว้สมมติของชั้น ม.5 มีนักเรียน 30 คน ในนั้น 14 คนตอบว่าชอบคณิตศาสตร์ ส่วนที่เหลือไม่ชอบ ร้อยละของนักเรียนทั้งชั้นที่ชอบคณิตศาสตร์เท่าใด (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 46.67, tolerance: 0.01, unit: "%" }
    misconceptions:
      - { match: 87.5, feedback: "หารด้วยจำนวนคนที่ไม่ชอบ (16 คน) แทนจำนวนนักเรียนทั้งหมด (30 คน)" }
    hints:
      - "ตัวหารต้องเป็นจำนวนนักเรียนทั้งหมดของชั้น"
      - "ร้อยละคือ จำนวนที่สนใจ หารด้วยทั้งหมด แล้วคูณด้วย 100"
      - "นำ 14 หารด้วย 30 แล้วคูณด้วย 100"
    solution: "14 ÷ 30 × 100 ≈ 46.67 เปอร์เซ็นต์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.exploratory-analysis.p012
    topics: [computer.data.exploratory-analysis]
    difficulty: 3
    type: mcq
    stem: "สหสัมพันธ์ r = 0.95 ระหว่างจำนวนชั่วโมงอ่านกับคะแนนสอบของนักเรียนกลุ่มหนึ่ง หมายความว่าอย่างไร"
    choices:
      - { id: a, text: "สองตัวแปรเพิ่มหรือลดไปทางเดียวกันอย่างแรง แต่ไม่ได้บอกว่าอันหนึ่งเป็นสาเหตุของอีกอันหนึ่ง", correct: true }
      - { id: b, text: "การอ่านเพิ่มขึ้นร้อยละ 95 ทำให้คะแนนเพิ่มขึ้นตามทันที", feedback: "ค่า r ไม่ใช่ร้อยละของการเพิ่มขึ้น" }
      - { id: c, text: "ข้อมูลทั้งสองชุดไม่มีความสัมพันธ์กันเลย", feedback: "ค่า 0.95 ใกล้ 1 แสดงความสัมพันธ์ที่แรง ไม่ใช่ไม่มีความสัมพันธ์" }
      - { id: d, text: "ค่าเฉลี่ยของชั่วโมงอ่านกับคะแนนเท่ากัน", feedback: "ค่า r ไม่ได้วัดว่าค่าเฉลี่ยสองชุดเท่ากันหรือไม่" }
    hints:
      - "ค่า r อยู่ระหว่าง −1 ถึง 1"
      - "ค่าใกล้ 1 บอกทิศทางและความแรงของความสัมพันธ์เชิงเส้น"
      - "สหสัมพันธ์ไม่ได้บอกเรื่องสาเหตุ"
