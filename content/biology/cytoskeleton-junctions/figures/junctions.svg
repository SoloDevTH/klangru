<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="sans-serif" font-size="14">
<title>รอยต่อระหว่างเซลล์สัตว์สามแบบ: รอยต่อแน่นปิดช่องว่าง เดสโมโซมยึดเซลล์ และแกปจังก์ชันให้สารเล็กผ่าน</title>
<rect x="0" y="0" width="880" height="330" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1565c0"/></marker></defs>
<rect x="30" y="40" width="120" height="170" rx="26" fill="#e8f5e9" stroke="#37474f" stroke-width="2"/>
<rect x="150" y="40" width="120" height="170" rx="26" fill="#e8f5e9" stroke="#37474f" stroke-width="2"/>
<line x1="150" y1="70" x2="150" y2="180" stroke="#4e342e" stroke-width="7" stroke-linecap="round"/>
<line x1="144" y1="70" x2="144" y2="180" stroke="#ff8f00" stroke-width="2" stroke-dasharray="4 4"/>
<text x="162" y="98" fill="#4e342e" font-size="12">แถบสีเข้ม = เยื่อหุ้ม</text>
<text x="162" y="114" fill="#4e342e" font-size="12">สองเซลล์ติดกัน</text>
<rect x="320" y="40" width="120" height="170" rx="26" fill="#e8f5e9" stroke="#37474f" stroke-width="2"/>
<rect x="440" y="40" width="120" height="170" rx="26" fill="#e8f5e9" stroke="#37474f" stroke-width="2"/>
<ellipse cx="440" cy="125" rx="11" ry="9" fill="#6d4c41" stroke="#3e2723" stroke-width="1.5"/>
<line x1="440" y1="115" x2="345" y2="77" stroke="#2e7d32" stroke-width="2"/>
<line x1="440" y1="115" x2="535" y2="77" stroke="#2e7d32" stroke-width="2"/>
<line x1="440" y1="120" x2="345" y2="101" stroke="#2e7d32" stroke-width="2"/>
<line x1="440" y1="120" x2="535" y2="101" stroke="#2e7d32" stroke-width="2"/>
<line x1="440" y1="125" x2="345" y2="125" stroke="#2e7d32" stroke-width="2"/>
<line x1="440" y1="125" x2="535" y2="125" stroke="#2e7d32" stroke-width="2"/>
<line x1="440" y1="130" x2="345" y2="149" stroke="#2e7d32" stroke-width="2"/>
<line x1="440" y1="130" x2="535" y2="149" stroke="#2e7d32" stroke-width="2"/>
<line x1="440" y1="135" x2="345" y2="173" stroke="#2e7d32" stroke-width="2"/>
<line x1="440" y1="135" x2="535" y2="173" stroke="#2e7d32" stroke-width="2"/>
<rect x="610" y="40" width="120" height="170" rx="26" fill="#e8f5e9" stroke="#37474f" stroke-width="2"/>
<rect x="730" y="40" width="120" height="170" rx="26" fill="#e8f5e9" stroke="#37474f" stroke-width="2"/>
<rect x="721" y="94" width="18" height="12" rx="3" fill="#90caf9" stroke="#1565c0" stroke-width="1.5"/>
<rect x="721" y="119" width="18" height="12" rx="3" fill="#90caf9" stroke="#1565c0" stroke-width="1.5"/>
<rect x="721" y="144" width="18" height="12" rx="3" fill="#90caf9" stroke="#1565c0" stroke-width="1.5"/>
<circle cx="650" cy="112" r="4" fill="#1565c0"/>
<circle cx="675" cy="137" r="4" fill="#1565c0"/>
<circle cx="800" cy="112" r="4" fill="#1565c0"/>
<circle cx="780" cy="137" r="4" fill="#1565c0"/>
<line x1="640" y1="162" x2="700" y2="162" stroke="#1565c0" stroke-width="2" marker-end="url(#ar)"/>
<line x1="790" y1="162" x2="730" y2="162" stroke="#1565c0" stroke-width="2" marker-end="url(#ar)"/>
<text x="652" y="92" fill="#0d47a1" font-size="12">ช่องต่อ</text>
<text x="150" y="250" text-anchor="middle" font-weight="bold" fill="#263238">รอยต่อแน่น (tight junction)</text>
<text x="150" y="272" text-anchor="middle" fill="#455a64" font-size="13">ปิดช่องว่างระหว่างเซลล์ สารไม่รั่วผ่าน</text>
<text x="440" y="250" text-anchor="middle" font-weight="bold" fill="#263238">เดสโมโซม (desmosome)</text>
<text x="440" y="272" text-anchor="middle" fill="#455a64" font-size="13">จุดยึดกับเส้นใยอินเตอร์มีเดียต ทนแรงดึง</text>
<text x="730" y="250" text-anchor="middle" font-weight="bold" fill="#263238">แกปจังก์ชัน (gap junction)</text>
<text x="730" y="272" text-anchor="middle" fill="#455a64" font-size="13">ช่องต่อให้ไอออนและสารขนาดเล็กผ่านได้</text>
<text x="10" y="318" fill="#555" font-size="12">ภาพเป็นแผนภาพสมมติ ไม่ได้วาดตามสัดส่วนจริง เซลล์ทั้งสองเป็นเซลล์สัตว์ที่อยู่ติดกัน</text>
</svg>