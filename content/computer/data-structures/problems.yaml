problems:
  - id: computer.algorithms.data-structures.p001
    topics: [computer.algorithms.data-structures]
    difficulty: 1
    type: mcq
    stem: "โครงสร้างข้อมูลใดทำงานแบบ **เข้าทีหลัง ออกก่อน** (LIFO)"
    choices:
      - { id: a, text: "สแตก", correct: true }
      - { id: b, text: "คิว", feedback: "คิวเป็นแบบเข้าก่อนออกก่อน (FIFO) เหมือนแถวรอซื้ออาหาร" }
      - { id: c, text: "ตารางแฮช", feedback: "ตารางแฮชเก็บตามช่องที่ได้จากฟังก์ชันแฮช ไม่ได้เรียงตามลำดับที่ใส่" }
      - { id: d, text: "กราฟ", feedback: "กราฟแสดงความสัมพันธ์ระหว่างจุด ไม่มีลำดับการเข้าออก" }
    hints:
      - "นึกถึงกองจาน วางใบใหม่ไว้ที่ไหน หยิบใบไหนออกก่อน"
      - "push และ pop ทำที่ด้านบนด้านเดียว"
    solution: "สแตกใส่และเอาออกที่ด้านบนเท่านั้น ตัวที่ใส่ล่าสุดจึงออกก่อน (LIFO)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.data-structures.p002
    topics: [computer.algorithms.data-structures]
    difficulty: 1
    type: match
    stem: "จับคู่งานกับโครงสร้างข้อมูลที่เหมาะที่สุด"
    pairs:
      - { left: "ปุ่มยกเลิกการพิมพ์ครั้งล่าสุด (undo)", right: "สแตก" }
      - { left: "เรียกคิวผู้ป่วยตามลำดับที่มาถึงโรงพยาบาล", right: "คิว" }
      - { left: "ค้นชื่อนักเรียนจากรหัสประจำตัวทันที", right: "ตารางแฮช" }
      - { left: "หาเส้นทางระหว่างสถานีรถไฟฟ้า", right: "กราฟ" }
      - { left: "เก็บคะแนนให้ไล่จากน้อยไปมากและค้นเป็นช่วงได้", right: "ต้นไม้ค้นหาแบบทวิภาค" }
    hints:
      - "undo ต้องยกเลิกสิ่งที่ทำล่าสุดก่อน คิวผู้ป่วยต้องเรียกคนที่มาก่อน"
      - "การค้นด้วยคีย์ทันทีใช้แฮช ส่วนข้อมูลที่ต้องเรียงและค้นเป็นช่วงใช้ต้นไม้"
    solution: "undo ใช้สแตก คิวผู้ป่วยใช้คิว ค้นด้วยรหัสใช้ตารางแฮช เส้นทางระหว่างสถานีใช้กราฟ และข้อมูลที่ต้องเรียงและค้นเป็นช่วงใช้ต้นไม้ค้นหาแบบทวิภาค"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.data-structures.p003
    topics: [computer.algorithms.data-structures]
    difficulty: 2
    type: numeric
    stem: "เริ่มจากสแตกว่าง ทำคำสั่งตามลำดับ push 4, push 9, push 1, pop, push 6, pop, pop ค่าที่ได้จาก pop **ครั้งสุดท้าย** คือเท่าใด"
    answer: { value: 9, unit: "" }
    hints:
      - "เขียนสแตกจากล่างขึ้นบนหลังแต่ละคำสั่ง"
      - "pop เอาตัวบนสุดออกเสมอ"
    misconceptions:
      - { match: 1, feedback: "ทำแบบคิว (เอาตัวที่ใส่ก่อนออก) pop ของสแตกเอาตัวบนสุดออก" }
      - { match: 4, feedback: "4 ยังอยู่ก้นสแตก ไม่ได้ถูก pop" }
    solution: "[4] → [4, 9] → [4, 9, 1] → pop ได้ 1 → [4, 9, 6] → pop ได้ 6 → pop ได้ 9 เหลือ [4] ครั้งสุดท้ายได้ 9"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.data-structures.p004
    topics: [computer.algorithms.data-structures]
    difficulty: 2
    type: order
    stem: "นักเรียนส่งสมุดวางซ้อนบนโต๊ะครูเป็นกอง ครูหยิบเล่มบนสุดมาตรวจทุกครั้ง ลำดับเหตุการณ์: ก ส่ง, ข ส่ง, ค ส่ง, ครูตรวจ 1 เล่ม, ง ส่ง, ครูตรวจ 2 เล่ม, จ ส่ง, ครูตรวจ 2 เล่ม เรียงสมุดตามลำดับที่ครูตรวจ"
    items:
      - "สมุดของ ค"
      - "สมุดของ ง"
      - "สมุดของ ข"
      - "สมุดของ จ"
      - "สมุดของ ก"
    hints:
      - "กองสมุดคือสแตก เล่มที่วางล่าสุดอยู่บนสุด"
      - "เขียนกองสมุดหลังแต่ละเหตุการณ์ แล้วหยิบเล่มบนสุดออก"
    solution: "กอง [ก, ข, ค] ตรวจ ค → [ก, ข] ง ส่ง → [ก, ข, ง] ตรวจ ง แล้ว ข → [ก] จ ส่ง → [ก, จ] ตรวจ จ แล้ว ก ลำดับคือ ค ง ข จ ก (ถ้าเป็นคิวจะได้ ก ข ค ง จ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.data-structures.p005
    topics: [computer.algorithms.data-structures]
    difficulty: 2
    type: numeric
    stem: "ตารางแฮชของห้องสมุดมี 7 ช่อง (ดัชนี 0–6) ใช้ฟังก์ชันแฮช h(k) = k mod 7 หนังสือรหัส 2567 จะถูกเก็บในช่องดัชนีใด"
    answer: { value: 5, unit: "" }
    hints:
      - "mod คือเศษจากการหาร"
      - "หาร 2567 ด้วย 7 แล้วดูเศษ"
    misconceptions:
      - { match: 366, feedback: "366 คือผลหาร (2567 // 7) แต่ฟังก์ชันแฮชใช้เศษ" }
      - { match: 7, feedback: "เศษจากการหารด้วย 7 อยู่ระหว่าง 0 ถึง 6 เท่านั้น" }
    solution: "2567 = 7 × 366 + 5 เศษ 5 จึงเก็บในช่อง 5"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.data-structures.p006
    topics: [computer.algorithms.data-structures]
    difficulty: 3
    type: numeric
    stem: "ใส่ค่า 45, 25, 60, 15, 35, 50, 70, 30 ลงต้นไม้ค้นหาแบบทวิภาคที่ว่างตามลำดับ แล้วค้นหา 30 ต้องเทียบกับโหนดกี่โหนด (นับโหนดที่เจอด้วย)"
    answer: { value: 4, unit: "โหนด" }
    hints:
      - "วาดต้นไม้: 45 เป็นราก 25 ไปซ้าย 60 ไปขวา แล้วใส่ตัวต่อไปทีละตัว"
      - "30 น้อยกว่า 45 ไปซ้าย มากกว่า 25 ไปขวา ..."
    misconceptions:
      - { match: 8, feedback: "8 คือการค้นทีละตัวแบบลิสต์ ต้นไม้ค้นหาเทียบเฉพาะโหนดบนเส้นทางจากรากลงไป" }
      - { match: 3, feedback: "30 อยู่ใต้ 35 (เป็นลูกซ้ายของ 35) ต้องเทียบ 45, 25, 35 แล้วจึงเจอ 30 ที่โหนดที่ 4" }
    solution: "ต้นไม้: 45 ซ้าย 25 (ซ้าย 15 ขวา 35 ซึ่งมีลูกซ้าย 30) ขวา 60 (ซ้าย 50 ขวา 70) ค้น 30: 45 → ซ้าย 25 → ขวา 35 → ซ้าย 30 เจอ เทียบ 4 โหนด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.data-structures.p007
    topics: [computer.algorithms.data-structures]
    difficulty: 3
    type: order
    stem: "ใช้ bfs แบบในบทเรียนกับกราฟในภาพ เริ่มที่ A โดยลิสต์เพื่อนบ้านของทุกจุดเรียงตามตัวอักษร เรียงจุดตามลำดับที่ถูกใส่เข้าคิว (A เป็นจุดแรก)"
    figure:
      src: graph-question.svg
      alt: "กราฟไม่มีทิศทาง 7 จุด A ถึง G เส้นเชื่อม A–B, A–D, B–C, B–E, C–D, C–F, D–G, E–F, F–G"
    items: ["A", "B", "D", "C", "E", "G", "F"]
    hints:
      - "เพื่อนบ้านของ A คือ B, D ใส่คิวทั้งคู่ แล้วนำ B ออกก่อน"
      - "จุดที่เคยใส่คิวแล้วไม่ใส่ซ้ำ"
    solution: "คิว [A] → ออก A ใส่ B, D → ออก B ใส่ C, E → ออก D ใส่ G (C เจอแล้ว) → ออก C ใส่ F → ที่เหลือไม่มีจุดใหม่ ลำดับ A, B, D, C, E, G, F ซึ่งเรียงตามระยะ 0, 1, 1, 2, 2, 2, 3"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.data-structures.p008
    topics: [computer.algorithms.data-structures]
    difficulty: 3
    type: mcq
    stem: "แผนที่ถนนของจังหวัดมีทางแยก 10,000 จุด แต่ละจุดเชื่อมกับจุดอื่นเฉลี่ยราว 3 เส้น ควรแทนกราฟแบบใด เพราะอะไร"
    choices:
      - { id: a, text: "ลิสต์ประชิด เพราะใช้ที่ราวจำนวนจุดบวกจำนวนเส้นเชื่อม ส่วนเมทริกซ์ต้องใช้ 10⁸ ช่องที่เกือบทั้งหมดเป็น 0", correct: true }
      - { id: b, text: "เมทริกซ์ประชิด เพราะใช้ที่น้อยกว่าเสมอ", feedback: "เมทริกซ์ใช้ V² = 10⁸ ช่องเสมอ ไม่ว่าจะมีเส้นเชื่อมน้อยแค่ไหน" }
      - { id: c, text: "สแตก เพราะถนนเข้าทีหลังออกก่อน", feedback: "สแตกไม่ได้เก็บความสัมพันธ์ระหว่างจุด จึงแทนกราฟไม่ได้" }
      - { id: d, text: "ลิสต์ธรรมดาของชื่อทางแยกเรียงตามตัวอักษร", feedback: "ลิสต์ชื่อไม่ได้บอกว่าทางแยกใดเชื่อมกับทางแยกใด" }
    hints:
      - "คำนวณจำนวนช่องของเมทริกซ์ V × V"
      - "กราฟนี้มีเส้นเชื่อมน้อยเมื่อเทียบกับจำนวนคู่ทั้งหมด"
    solution: "เมทริกซ์ 10,000 × 10,000 = 10⁸ ช่อง แต่มีเส้นเชื่อมแค่ราว 15,000 เส้น (10,000 × 3 ÷ 2) ลิสต์ประชิดเก็บราว 10,000 + 30,000 รายการ ประหยัดกว่ามาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.data-structures.p009
    topics: [computer.algorithms.data-structures]
    difficulty: 3
    type: text
    stem: "แอปวาดภาพบันทึกทุกการกระทำของผู้ใช้ เมื่อกดปุ่มย้อนกลับ (undo) ต้องยกเลิกการกระทำล่าสุดก่อนเสมอ ควรเก็บการกระทำในโครงสร้างข้อมูลใด (ภาษาไทยหรืออังกฤษ)"
    accepted: ["สแตก", "stack", "สเตก", "แสตก"]
    misconceptions:
      - { match: "คิว", feedback: "คิวเอาตัวที่ใส่ก่อนสุดออก จะยกเลิกการกระทำแรกสุดแทนการกระทำล่าสุด" }
      - { match: "queue", feedback: "queue เอาตัวที่ใส่ก่อนสุดออก undo ต้องเอาตัวล่าสุดออก" }
    hints:
      - "การกระทำล่าสุดต้องออกก่อน"
      - "เข้าทีหลังออกก่อน (LIFO)"
    solution: "สแตก ทุกการกระทำ push ลงสแตก กด undo ก็ pop การกระทำบนสุดซึ่งเป็นการกระทำล่าสุดออกมายกเลิก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.data-structures.p010
    topics: [computer.algorithms.data-structures]
    difficulty: 4
    type: numeric
    stem: |
      ฟังก์ชันนี้หาความลึกสูงสุดของวงเล็บซ้อน `print(max_depth("(()(()))"))` แสดงตัวเลขใด

      ```python
      def max_depth(text):
          stack = []
          deepest = 0
          for ch in text:
              if ch == "(":
                  stack.append(ch)
                  deepest = max(deepest, len(stack))
              elif ch == ")":
                  stack.pop()
          return deepest
      ```
    answer: { value: 3, unit: "" }
    hints:
      - "ไล่ขนาดของสแตกหลังแต่ละตัวอักษร"
      - "deepest เก็บขนาดสแตกที่มากที่สุดที่เคยเห็น"
    misconceptions:
      - { match: 4, feedback: "4 คือจำนวนวงเล็บเปิดทั้งหมด แต่บางคู่ปิดไปก่อนที่คู่ถัดไปจะเปิด สแตกจึงไม่ถึง 4" }
      - { match: 2, feedback: "ตัวอักษรที่ 4 และ 5 เปิดวงเล็บซ้อนอีกสองชั้นภายในวงนอก สแตกจึงมี 3 ตัว" }
    solution: "ขนาดสแตก: ( 1, ( 2, ) 1, ( 2, ( 3, ) 2, ) 1, ) 0 มากที่สุด 3"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.data-structures.p011
    topics: [computer.algorithms.data-structures]
    difficulty: 4
    type: numeric
    stem: "ใส่ค่า 1, 2, 3, 4, 5, 6, 7 ลงต้นไม้ค้นหาแบบทวิภาคที่ว่างตามลำดับนี้ แล้วค้นหา 7 ต้องเทียบกับโหนดกี่โหนด"
    answer: { value: 7, unit: "โหนด" }
    hints:
      - "ทุกค่าที่ใส่มากกว่าค่าก่อนหน้า จึงไปทางขวาเสมอ"
      - "ต้นไม้หน้าตาเป็นอย่างไร สูงเท่าใด"
    misconceptions:
      - { match: 3, feedback: "3 คือความสูงของต้นไม้ 7 โหนดที่สมดุล แต่ใส่ข้อมูลที่เรียงแล้วทำให้ต้นไม้เอียง" }
      - { match: 1, feedback: "7 ไม่ได้อยู่ที่ราก รากคือค่าแรกที่ใส่ คือ 1" }
    solution: "ต้นไม้เอียงเป็นเส้นตรง 1 → 2 → ... → 7 ทางขวาทั้งหมด ค้น 7 ต้องเทียบทั้ง 7 โหนด ช้าเท่าค้นหาแบบลำดับ ถ้าใส่เป็น 4, 2, 6, 1, 3, 5, 7 จะได้ต้นไม้สมดุลที่เทียบไม่เกิน 3 โหนด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.data-structures.p012
    topics: [computer.algorithms.data-structures]
    difficulty: 4
    type: numeric
    stem: "จากกราฟในภาพ ทางเดินจาก A ไป F ที่ผ่านเส้นเชื่อมน้อยที่สุดต้องผ่านกี่เส้น"
    figure:
      src: graph-question.svg
      alt: "กราฟไม่มีทิศทาง 7 จุด A ถึง G เส้นเชื่อม A–B, A–D, B–C, B–E, C–D, C–F, D–G, E–F, F–G"
    answer: { value: 3, unit: "เส้น" }
    hints:
      - "ใช้ BFS จาก A: จุดที่ห่าง 1 เส้น แล้วจุดที่ห่าง 2 เส้น ..."
      - "F อยู่ในชั้นที่เท่าใด"
    misconceptions:
      - { match: 5, feedback: "5 เส้นคือเส้นทางตามลำดับของ DFS (A, B, C, D, G, F) ซึ่งไม่รับประกันว่าสั้นที่สุด" }
      - { match: 2, feedback: "ไม่มีจุดที่เป็นเพื่อนบ้านทั้งของ A และ F จึงไปถึงใน 2 เส้นไม่ได้" }
    solution: "ระยะจาก A: B, D = 1 แล้ว C, E, G = 2 แล้ว F = 3 เช่น A → B → C → F หรือ A → B → E → F หรือ A → D → G → F"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.data-structures.p013
    topics: [computer.algorithms.data-structures]
    difficulty: 4
    type: mcq
    stem: "ระบบคิวรับวัคซีนของเทศบาลมีผู้รอ 100,000 คน นักเรียนเขียนด้วยลิสต์ใช้ `queue.append(คน)` และ `queue.pop(0)` แล้วระบบช้ามาก ข้อใดอธิบายและแก้ได้ถูกต้อง"
    choices:
      - { id: a, text: "pop(0) ต้องเลื่อนสมาชิกที่เหลือทุกตัวมาข้างหน้า ใช้ O(n) ต่อครั้ง ควรใช้ collections.deque กับ popleft() ซึ่งเป็น O(1)", correct: true }
      - { id: b, text: "append ช้า ควรเปลี่ยนเป็น insert(0, คน)", feedback: "append ที่ท้ายลิสต์เร็วอยู่แล้ว insert(0, ...) ต้องเลื่อนทุกตัวเช่นกัน" }
      - { id: c, text: "ควรเปลี่ยนเป็นสแตก ใช้ pop() แทน", feedback: "pop() เร็วแต่เอาคนที่มาล่าสุดออก ผิดหลักคิวที่ต้องเรียกคนที่มาก่อน" }
      - { id: d, text: "ควรเรียงลิสต์ก่อนทุกครั้งที่เรียกคิว", feedback: "การเรียงไม่ได้แก้การเลื่อนสมาชิก และเพิ่มเวลาอีก" }
    hints:
