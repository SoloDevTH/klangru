  - { front: "อักษรสูง 11 ตัวมีอะไรบ้าง", back: "ข ฃ ฉ ฐ ถ ผ ฝ ศ ษ ส ห (ผี ฝาก ถุง ข้าว สาร ให้ ฉัน)" }
