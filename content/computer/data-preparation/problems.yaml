  - id: computer.data.data-preparation.p013
    topics: [computer.data.data-preparation]
    difficulty: 4
    type: code
    stem: "เขียนฟังก์ชัน `parse_scores(text)` ที่รับข้อความ CSV ซึ่งมีหัวคอลัมน์ `id,score` และคืนค่าเป็นดิกชันนารี `{id: คะแนนเป็นจำนวนเต็ม}` โดย id เป็นข้อความ แถวที่ช่องคะแนนว่างให้ข้ามไป ใช้โมดูล `csv` และ `io` ได้"
    starter: |
      def parse_scores(text):
          pass
    tests: |
      r = parse_scores("id,score\n101,15\n102,\n103,18\n")
      assert isinstance(r, dict), f"ควรคืนค่าเป็น dict แต่ได้ {type(r).__name__}"
      assert r == {"101": 15, "103": 18}, f"parse_scores ควรได้ {{'101': 15, '103': 18}} แต่ได้ {r}"
      r2 = parse_scores("id,score\n")
      assert r2 == {}, f"ไฟล์ที่มีแต่หัวคอลัมน์ควรได้ dict ว่าง แต่ได้ {r2}"
      r3 = parse_scores("id,score\n201,0\n")
