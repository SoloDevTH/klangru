    stem: "เขียนสูตร **ยอดขายเป็นเงิน** $S$ (บาท) ที่จุดคุ้มทุน ในรูปของต้นทุนคงที่ $F$ ราคาต่อหน่วย $p$ และต้นทุนผันแปรต่อหน่วย $v$"
    prefix: "S ="
    answer: { latex: "\\frac{F p}{p-v}", variables: [F, p, v] }
    hints:
      - "ยอดขายเป็นเงิน = ราคา × จำนวนหน่วยที่จุดคุ้มทุน"
      - "แทนจำนวนหน่วย $\\dfrac{F}{p - v}$ แล้วคูณด้วย $p$ (เขียนเป็น $\\dfrac{F}{1 - v/p}$ ก็ได้)"
    misconceptions:
      - { match: "\\frac{F}{p-v}", feedback: "นั่นคือจุดคุ้มทุนเป็นจำนวนหน่วย ต้องคูณด้วยราคา $p$ จึงเป็นเงิน" }
      - { match: "\\frac{F v}{p-v}", feedback: "คูณด้วยต้นทุนผันแปรได้ต้นทุนผันแปรรวม ยอดขายต้องคูณด้วยราคา $p$" }
    solution: "$S = p \\cdot \\dfrac{F}{p - v} = \\dfrac{F\\,p}{p - v} = \\dfrac{F}{1 - \\frac{v}{p}}$ เช่น $F = 9{,}000$, $p = 50$, $v = 20$ ได้ $S = 15{,}000$ บาท"
