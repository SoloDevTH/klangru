id: health.movement.recreation
subject: health
title: { th: "นันทนาการ: หลักการ ประเภท และการนำไปใช้ในชีวิต", en: "Recreation: principles, types and use in daily life" }
summary: ความหมายและหลักการของกิจกรรมนันทนาการ ประเภทของกิจกรรม ประโยชน์ต่อคุณภาพชีวิต การเลือกและจัดกิจกรรมให้ผู้อื่น และการเชื่อมโยงกับวิชาอื่นและชีวิตประจำวัน
difficulty: 2.5
minutes: 30
prerequisites: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ตัวอย่างประเภทของกิจกรรมนันทนาการ
    src: recreation-types.svg
    alt: "แผนภาพสิบช่อง ประเภทของกิจกรรมนันทนาการพร้อมตัวอย่าง: 1 ศิลปหัตถกรรม เช่น วาดภาพ จักสาน พับกระดาษ 2 เกมและกีฬา เช่น ฟุตบอล หมากรุก ตะกร้อ 3 ดนตรีและการร้องเพลง เช่น เล่นอังกะลุง ร้องประสานเสียง 4 เต้นรำและนาฏศิลป์ เช่น รำวง เต้นแอโรบิก 5 การละครและการแสดง เช่น ละครหุ่น แสดงละครสั้น 6 กิจกรรมกลางแจ้ง เช่น เดินป่า ตั้งแคมป์ ดูนก 7 ภาษาและวรรณกรรม เช่น อ่านนิทาน เขียนกลอน 8 งานอดิเรก เช่น ปลูกผัก สะสมแสตมป์ ทำอาหาร 9 กิจกรรมทางสังคม เช่น ชมรม งานประเพณี 10 อาสาสมัคร เช่น เก็บขยะชายหาด อ่านหนังสือให้น้องฟัง"
    caption: "การแบ่งประเภทนี้เป็นแบบหนึ่งที่ตำราไทยใช้บ่อย กิจกรรมหนึ่งอาจอยู่ได้หลายประเภท"
  - type: worked-example
    title: ตรวจว่ากิจกรรมนี้เป็นนันทนาการหรือไม่
    problem: "วันอาทิตย์ แบงก์ไปช่วยเพื่อนบ้านทาสีรั้วโรงเรียนเพราะอยากช่วย ทำแล้วภูมิใจและได้รู้จักเพื่อนใหม่ กิจกรรมนี้เป็นนันทนาการหรือไม่ ใช้หลักการตรวจทีละข้อ"
    steps:
      - text: "สมัครใจหรือไม่: แบงก์อยากช่วยเอง ไม่มีใครบังคับ ผ่าน"
      - text: "ทำในเวลาว่างหรือไม่: ทำในวันอาทิตย์ ไม่เบียดเวลาเรียน ผ่าน"
      - text: "ได้ความพึงพอใจหรือไม่: แบงก์รู้สึกภูมิใจ ผ่าน"
      - text: "เป็นภัยต่อสังคมหรือไม่: เป็นประโยชน์ต่อส่วนรวม ไม่เป็นภัย ผ่าน"
        why: "นิยามของ สพฐ. ต้องครบทั้งความสมัครใจ เวลาว่าง ความพึงพอใจ และไม่เป็นภัยต่อสังคม"
      - text: "สรุป: เป็นนันทนาการประเภทอาสาสมัคร และยังได้ประโยชน์ด้านสังคม"
    answer: "เป็นนันทนาการประเภทอาสาสมัคร เพราะผ่านทุกหลักการ"
  - { type: check, problem: health.movement.recreation.p001 }
  - type: worked-example
    title: วางแผนใช้เวลาว่างให้สมดุล
    problem: "จากกราฟเวลาว่างของเจได ช่วยเจไดวางแผนให้เวลาดูจอลดลงเหลือไม่เกินหนึ่งในสี่ของเวลาว่างทั้งหมด โดยเวลาว่างรวมเท่าเดิม"
    figure:
      src: free-time.svg
      alt: "กราฟแท่งแนวนอน เวลาว่างใน 1 สัปดาห์ของเจได เป็นชั่วโมง ดูจอเพื่อความบันเทิง 14 เล่นกีฬากับเพื่อน 4 ช่วยงานบ้าน 3 อ่านการ์ตูนและนิทาน 2 ฝึกเล่นดนตรี 1"
    steps:
      - text: "เวลาว่างรวม $14 + 4 + 3 + 2 + 1 = 24$ ชั่วโมงต่อสัปดาห์"
      - text: "หนึ่งในสี่ของเวลาว่าง $= 24 \\div 4 = 6$ ชั่วโมง จึงดูจอได้ไม่เกิน 6 ชั่วโมง"
      - text: "ต้องลดเวลาดูจอ $14 - 6 = 8$ ชั่วโมง"
      - text: "แบ่ง 8 ชั่วโมงให้กิจกรรมอื่น เช่น เล่นกีฬาเพิ่ม 4 ชั่วโมง ฝึกดนตรีเพิ่ม 2 ชั่วโมง ปลูกผักกับยาย 2 ชั่วโมง"
        why: "ควรเพิ่มทั้งกิจกรรมแบบใช้แรงและแบบนั่งพักที่เจไดชอบ เพื่อให้ทำได้ต่อเนื่องด้วยความสมัครใจ"
    answer: "ดูจอไม่เกิน 6 ชั่วโมง ลดลง 8 ชั่วโมงแล้วนำไปทำกิจกรรมที่ชอบและได้ขยับร่างกาย"
  - { type: check, problem: health.movement.recreation.p004 }
glossary:
  - { term: กิจกรรมนันทนาการ, definition: "กิจกรรมที่บุคคลเลือกทำหรือเข้าร่วมด้วยความสมัครใจในเวลาว่าง ได้ความพึงพอใจ และไม่เป็นภัยต่อสังคม" }
  - { term: เวลาว่าง, definition: "เวลาที่เหลือจากการเรียน การทำงาน และกิจวัตรที่จำเป็น เช่น กิน นอน" }
  - { term: นันทนาการแบบใช้แรง, definition: "นันทนาการที่ได้เคลื่อนไหวร่างกายมาก เช่น เล่นกีฬา รำวง ปั่นจักรยาน" }
  - { term: นันทนาการแบบนั่งพัก, definition: "นันทนาการที่ใช้แรงน้อย เช่น อ่านหนังสือ วาดรูป ฟังเพลง" }
  - { term: อาสาสมัคร, definition: "การทำประโยชน์ให้ผู้อื่นหรือส่วนรวมด้วยความสมัครใจโดยไม่หวังค่าตอบแทน" }
flashcards:
  - { front: "นันทนาการต้องมีลักษณะอย่างไร", back: "สมัครใจ ทำในเวลาว่าง ได้ความพึงพอใจ และไม่เป็นภัยต่อสังคม" }
  - { front: "ตัวอย่างประเภทของนันทนาการ", back: "ศิลปหัตถกรรม เกมและกีฬา ดนตรี เต้นรำ ละคร กิจกรรมกลางแจ้ง ภาษาและวรรณกรรม งานอดิเรก กิจกรรมทางสังคม อาสาสมัคร" }
  - { front: "นันทนาการให้ประโยชน์ด้านใดบ้าง", back: "ร่างกาย จิตใจและอารมณ์ สังคม สติปัญญา และชุมชน" }
  - { front: "ขั้นตอนจัดกิจกรรมนันทนาการให้ผู้อื่น", back: "กำหนดเป้าหมาย เลือกกิจกรรม เตรียมความพร้อมและความปลอดภัย ดำเนินกิจกรรม ประเมินผล" }
