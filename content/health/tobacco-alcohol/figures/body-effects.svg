<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="sans-serif">
<title>ผลของบุหรี่ บุหรี่ไฟฟ้า และแอลกอฮอล์ต่อร่างกาย</title>
<rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="380.0" y="26.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">บุหรี่ บุหรี่ไฟฟ้า และแอลกอฮอล์ ทำร้ายร่างกายตรงไหนบ้าง</text>
<circle cx="380.0" cy="80.0" r="30" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<path d="M325,120 Q380,105 435,120 L450,250 L425,252 L420,170 L418,300 L422,410 L392,410 L380,310 L368,410 L338,410 L342,300 L340,170 L335,252 L310,250 Z" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<circle cx="380.0" cy="74.0" r="9" fill="#c9a0dc" stroke="#555" stroke-width="1.5"/>
<rect x="355.0" y="148.0" width="20.0" height="40.0" rx="8" fill="#9cc7ec" stroke="#555" stroke-width="1.5"/>
<rect x="385.0" y="148.0" width="20.0" height="40.0" rx="8" fill="#9cc7ec" stroke="#555" stroke-width="1.5"/>
<circle cx="392.0" cy="175.0" r="8" fill="#e57373" stroke="#555" stroke-width="1.5"/>
<rect x="346.0" y="205.0" width="36.0" height="18.0" rx="6" fill="#a1887f" stroke="#555" stroke-width="1.5"/>
<circle cx="396.0" cy="225.0" r="9" fill="#ffcc80" stroke="#555" stroke-width="1.5"/>
<text x="110.0" y="60.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f5d99">บุหรี่และบุหรี่ไฟฟ้า</text>
<text x="640.0" y="60.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#9c2b2b">แอลกอฮอล์</text>
<text x="20.0" y="85.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1f5d99">สมอง</text>
<text x="20.0" y="103.0" font-size="12" text-anchor="start" fill="#111">นิโคตินทำให้ติด รบกวนสมองวัยรุ่น</text>
<line x1="240.0" y1="89.0" x2="368.0" y2="74.0" stroke="#1f5d99" stroke-width="1"/>
<text x="20.0" y="125.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1f5d99">ปากและฟัน</text>
<text x="20.0" y="143.0" font-size="12" text-anchor="start" fill="#111">ฟันเหลือง กลิ่นปาก มะเร็งช่องปาก</text>
<line x1="240.0" y1="129.0" x2="368.0" y2="98.0" stroke="#1f5d99" stroke-width="1"/>
<text x="20.0" y="175.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1f5d99">ปอด</text>
<text x="20.0" y="193.0" font-size="12" text-anchor="start" fill="#111">ไอเรื้อรัง ถุงลมโป่งพอง มะเร็งปอด</text>
<line x1="240.0" y1="179.0" x2="354.0" y2="160.0" stroke="#1f5d99" stroke-width="1"/>
<text x="20.0" y="225.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1f5d99">หัวใจและหลอดเลือด</text>
<text x="20.0" y="243.0" font-size="12" text-anchor="start" fill="#111">เสี่ยงหัวใจขาดเลือด อัมพาต</text>
<line x1="240.0" y1="229.0" x2="380.0" y2="175.0" stroke="#1f5d99" stroke-width="1"/>
<text x="530.0" y="85.0" font-size="13" text-anchor="start" font-weight="bold" fill="#9c2b2b">สมอง</text>
<text x="530.0" y="103.0" font-size="12" text-anchor="start" fill="#111">ตัดสินใจช้า เสียการทรงตัว</text>
<line x1="525.0" y1="89.0" x2="392.0" y2="74.0" stroke="#9c2b2b" stroke-width="1"/>
<text x="530.0" y="175.0" font-size="13" text-anchor="start" font-weight="bold" fill="#9c2b2b">หัวใจ</text>
<text x="530.0" y="193.0" font-size="12" text-anchor="start" fill="#111">ความดันสูง หัวใจเต้นผิดจังหวะ</text>
<line x1="525.0" y1="179.0" x2="404.0" y2="175.0" stroke="#9c2b2b" stroke-width="1"/>
<text x="530.0" y="225.0" font-size="13" text-anchor="start" font-weight="bold" fill="#9c2b2b">ตับ</text>
<text x="530.0" y="243.0" font-size="12" text-anchor="start" fill="#111">ตับอักเสบ ตับแข็ง</text>
<line x1="525.0" y1="229.0" x2="378.0" y2="215.0" stroke="#9c2b2b" stroke-width="1"/>
<text x="530.0" y="275.0" font-size="13" text-anchor="start" font-weight="bold" fill="#9c2b2b">กระเพาะอาหาร</text>
<text x="530.0" y="293.0" font-size="12" text-anchor="start" fill="#111">อักเสบ เป็นแผล</text>
<line x1="525.0" y1="279.0" x2="408.0" y2="225.0" stroke="#9c2b2b" stroke-width="1"/>
<text x="20.0" y="300.0" font-size="12" text-anchor="start" fill="#333">ควันมือสองทำร้ายคนรอบข้าง</text>
<text x="530.0" y="330.0" font-size="12" text-anchor="start" fill="#333">เมาแล้วขับ: อุบัติเหตุ</text>
<text x="380.0" y="425.0" font-size="11" text-anchor="middle" fill="#555">แผนภาพอย่างง่าย ตำแหน่งอวัยวะโดยประมาณ</text>
</svg>
