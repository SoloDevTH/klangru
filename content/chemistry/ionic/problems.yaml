    stem: "ผสมสารละลายแบเรียมคลอไรด์กับสารละลายโซเดียมซัลเฟต เกิดตะกอนขาวของแบเรียมซัลเฟต สมการไอออนิกสุทธิคือข้อใด"
    choices:
      - { id: a, text: "$\\mathrm{Ba^{2+}(aq) + SO_4^{2-}(aq) \\to BaSO_4(s)}$", correct: true, feedback: "ถูก ตัด $\\mathrm{Na^+}$ และ $\\mathrm{Cl^-}$ ซึ่งไม่เปลี่ยนแปลงออก" }
      - { id: b, text: "$\\mathrm{BaCl_2(aq) + Na_2SO_4(aq) \\to BaSO_4(s) + 2NaCl(aq)}$", feedback: "นี่คือสมการเคมีรวม ยังไม่ได้เขียนเป็นไอออนและตัดไอออนที่ไม่เปลี่ยนแปลง" }
      - { id: c, text: "$\\mathrm{2Na^+(aq) + 2Cl^-(aq) \\to 2NaCl(s)}$", feedback: "NaCl ละลายน้ำได้ดี ไม่ได้เป็นตะกอน $\\mathrm{Na^+}$ และ $\\mathrm{Cl^-}$ อยู่ในสารละลายทั้งก่อนและหลัง" }
      - { id: d, text: "$\\mathrm{Ba^{2+} + 2Cl^- + 2Na^+ + SO_4^{2-} \\to BaSO_4(s) + 2Na^+ + 2Cl^-}$", feedback: "นี่คือสมการไอออนิกเต็ม ต้องตัดไอออนที่อยู่ทั้งสองข้างออก" }
    hints:
      - "เขียนสารที่ละลายน้ำเป็นไอออน ตะกอนเขียนเป็นสูตรเต็ม"
      - "ตัดไอออนที่ปรากฏเหมือนกันทั้งสองข้าง"
    solution: "สมการไอออนิกเต็ม: $\\mathrm{Ba^{2+} + 2Cl^- + 2Na^+ + SO_4^{2-} \\to BaSO_4(s) + 2Na^+ + 2Cl^-}$ ตัด $\\mathrm{Na^+}$ และ $\\mathrm{Cl^-}$ ได้ $\\mathrm{Ba^{2+}(aq) + SO_4^{2-}(aq) \\to BaSO_4(s)}$"
