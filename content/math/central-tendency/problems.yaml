  - id: math.ctr.p016
    topics: [math.stats.central-tendency]
    difficulty: 2
    type: numeric
    stem: "ข้อมูล 4, 7, 9, 12 ถ้าเพิ่มข้อมูลตัวที่ห้าเข้าไปแล้วต้องการให้ค่าเฉลี่ยเท่าเดิม ข้อมูลตัวที่ห้าต้องเป็นเท่าใด"
    answer: { value: 8 }
    hints:
      - "หาค่าเฉลี่ยของสี่ตัวเดิมก่อน"
      - "ค่าเฉลี่ยเป็นจุดสมดุล ถ้าเพิ่มข้อมูลที่อยู่ตรงจุดสมดุลพอดี คานจะยังสมดุลเหมือนเดิม"
    misconceptions:
      - { match: 0, feedback: "เพิ่ม 0 เข้าไปทำให้ผลรวมเท่าเดิม แต่จำนวนข้อมูลเพิ่มเป็น 5 ค่าเฉลี่ยจึงลดลงเหลือ $32 \\div 5 = 6.4$" }
    solution: "ค่าเฉลี่ยเดิม $= \\dfrac{4 + 7 + 9 + 12}{4} = \\dfrac{32}{4} = 8$ ถ้าเพิ่ม 8: $\\dfrac{32 + 8}{5} = 8$ เท่าเดิม ✓ ข้อมูลที่เท่ากับค่าเฉลี่ยพอดีไม่เปลี่ยนค่าเฉลี่ย"
