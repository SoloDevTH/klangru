  - { front: "พหูพจน์ของ baby, box, knife", back: "babies, boxes, knives" }
  - { front: "พหูพจน์ของ child, foot, person", back: "children, feet, people" }
  - { front: "\"น้ำหนึ่งแก้ว\" ภาษาอังกฤษ", back: "a glass of water (water นับไม่ได้)" }
  - { front: "There isn't ___ milk. (some/any)", back: "any (ประโยคปฏิเสธ)" }
