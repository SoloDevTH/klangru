# หัวข้อในคลังที่สอนเนื้อหาสาระสำคัญ (ข้อ ๘) หรือผลลัพธ์การเรียนรู้ (ข้อ ๕) ของ มคอ.1 สาขาวิชาการบัญชี พ.ศ. 2562 บางส่วน
# ทุกแถวเป็น partial เพราะ มคอ.1 อธิบายเนื้อหาระดับปริญญาตรีทั้งกลุ่ม หัวข้อในคลังเป็นเพียงจุดเริ่มต้นของกลุ่มนั้น
framework: th-tqf-accounting
mappings:
  - topic: business.accounting.equation
    indicators: ["8.1.1"]
    coverage: partial
    note: "สมการบัญชี ผลของรายการค้า และงบกำไรขาดทุนอย่างง่าย ยังไม่มีมาตรฐานการรายงานทางการเงิน การบันทึกบัญชีคู่ งบแสดงฐานะการเงินฉบับเต็ม งบการเงินรวม และการเปิดเผยข้อมูล"
  - topic: business.finance.break-even
    indicators: ["8.1.2", "5.2.3"]
    coverage: partial
    note: "8.1.2: พฤติกรรมต้นทุน (คงที่/ผันแปร) และการวิเคราะห์ต้นทุน-ปริมาณ-กำไรเพื่อการตัดสินใจ ยังไม่มีต้นทุนผลิตภัณฑ์ งบประมาณ การวิเคราะห์ผลต่าง 5.2.3: ใช้สมการและกราฟเส้นตรงแก้ปัญหาธุรกิจ ยังไม่มีสถิติ"
  - topic: management.principles.functions
    indicators: ["8.2.3"]
    coverage: partial
    note: "หน้าที่ของการจัดการ การจัดรูปแบบองค์กร (แผนผังองค์การ) และรูปแบบการเป็นเจ้าของธุรกิจ ยังไม่มีกลยุทธ์และพฤติกรรมองค์กร"
  - topic: business.accounting.double-entry
    indicators: [8.1.1]
    coverage: partial
    note: "หลักการบัญชีส่วนการบันทึกรายการค้า: ผังบัญชี เดบิตเครดิต สมุดรายวันทั่วไป บัญชีแยกประเภท งบทดลอง และข้อผิดพลาดที่งบทดลองหาไม่พบ ยังไม่มีมาตรฐานการรายงาน งบการเงิน (อยู่ใน business.accounting.financial-statements) งบการเงินรวม และการเปิดเผยข้อมูล"
  - topic: business.accounting.financial-statements
    indicators: [8.1.1]
    coverage: partial
    note: เกณฑ์คงค้าง รายการปรับปรุง (ค่าเสื่อมราคาเส้นตรง ค่าใช้จ่ายค้างจ่าย รายได้รับล่วงหน้า) ต้นทุนขายแบบสิ้นงวด การจัดทำงบแสดงฐานะการเงิน งบกำไรขาดทุน งบแสดงการเปลี่ยนแปลงส่วนของเจ้าของ งบกระแสเงินสดอย่างง่าย ความเชื่อมโยงของงบ และขอบเขตของ TFRS for NPAEs กับ TFRS ฉบับเต็ม ยังไม่มีงบการเงินรวม นโยบายการบัญชีและการเปิดเผยข้อมูลในหมายเหตุ รายงานความยั่งยืนและรายงานฉบับบูรณาการ
  - topic: business.ethics.business-ethics
    indicators: [5.1.1]
    coverage: full
    note: หลักการพื้นฐาน 6 ข้อและอุปสรรค 5 ประเภทตามคู่มือประมวลจรรยาบรรณของผู้ประกอบวิชาชีพบัญชี (ฉบับแปลของสภาวิชาชีพบัญชีฯ 2564) ความขัดแย้งทางผลประโยชน์ และจริยธรรมกับกฎหมาย
  - topic: business.ethics.business-ethics
    indicators: [5.1.2, 5.1.3]
    coverage: partial
    note: ขั้นตอนตัดสินใจเชิงจริยธรรมและกรณีศึกษา (เลื่อนบันทึกค่าใช้จ่าย รับรู้รายได้ก่อนงวด ของขวัญจากผู้ขาย ถูกข่มขู่) ฝึกได้ในรูปตัวเลือก การแก้ปัญหาในการปฏิบัติงานจริงต้องฝึกนอกแอป
  - topic: business.stats.descriptive
    indicators: [5.2.3, 5.3.1]
    coverage: partial
    note: ใช้สถิติเชิงพรรณนากับข้อมูลธุรกิจ (ยอดขายเฉลี่ยต่อบิล มัธยฐานเมื่อมีค่าผิดปกติ CV ร้อยละการเปลี่ยนแปลง ดัชนีราคาแบบรวมถ่วงน้ำหนัก ยอดขายที่แท้จริง) ยังไม่มีสถิติอนุมานและการพยากรณ์ (business.stats.forecasting)
  - topic: management.principles.organizing
    indicators: [8.2.3]
    coverage: partial
    note: สอนวิธีออกแบบและจัดรูปแบบองค์กรและหน้าที่ภายในองค์กร ส่วนปัจจัยที่มีผลต่อกลยุทธ์ การดำเนินกลยุทธ์ และพฤติกรรมองค์กรอยู่ใน strategic-management และ organizational-behavior
  - topic: business.accounting.information-systems
    indicators: ["8.3", 5.5.3]
    coverage: partial
    note: ส่วนประกอบและการไหลของข้อมูลใน AIS แฟ้มข้อมูลหลักและแฟ้มรายการ วงจรธุรกิจในโปรแกรมบัญชี สมุดรายวันและงบทดลองในสเปรดชีต (VLOOKUP SUMIF การอ้างอิงสัมบูรณ์) การควบคุมทั่วไปและการควบคุมระบบงาน (ตรวจขอบเขต ยอดรวมควบคุม หลักตรวจสอบ แบ่งแยกหน้าที่ กระทบยอด) และรายงานช่วยตัดสินใจ (อายุลูกหนี้ กำไรขั้นต้นรายสินค้า) ยังไม่มีการออกแบบฐานข้อมูล ERP การตรวจสอบระบบสารสนเทศ และเครื่องมือวิเคราะห์ข้อมูลขั้นสูง
  - topic: business.accounting.product-costing
    indicators: [8.1.2]
    coverage: partial
    note: "ส่วนต้นทุนผลิตภัณฑ์: ส่วนประกอบของต้นทุน ต้นทุนเบื้องต้นและแปรสภาพ ต้นทุนการผลิต อัตราค่าใช้จ่ายการผลิตกำหนดล่วงหน้า ปันส่วนเกินขาด ต้นทุนงานสั่งทำ ต้นทุนช่วงแบบถัวเฉลี่ยถ่วงน้ำหนัก การเลือกฐานปันส่วน และการตั้งราคาแบบต้นทุนบวกส่วนเพิ่ม ยังไม่มีงบประมาณ การพยากรณ์เชิงบัญชี การวิเคราะห์ผลต่าง การวัดผลส่วนงาน และต้นทุนฐานกิจกรรม (อยู่ใน business.accounting.budgeting-variance ตามแผน)"
  - topic: business.finance.financial-ratios
    indicators: [8.1.3]
    coverage: partial
    note: การวิเคราะห์ฐานะการเงินด้วยอัตราส่วนสี่กลุ่ม ดูปองท์ การวิเคราะห์แนวโน้มตามแนวนอนและแนวดิ่ง การเทียบค่าเฉลี่ยอุตสาหกรรม กระแสเงินสดจากการดำเนินงานแบบทางอ้อม เงินทุนหมุนเวียน และวงจรเงินสด ยังไม่มีแหล่งเงินทุนและตลาดการเงิน ต้นทุนเงินทุน งบประมาณการลงทุน การประเมินมูลค่ากิจการ และการวางแผนการเงินระยะยาว (อยู่ใน business.finance.sources-of-funds และ business.finance.capital-budgeting ตามแผน)
  - topic: business.stats.forecasting
    indicators: [5.5.1]
    coverage: partial
    note: "การวิเคราะห์เชิงปริมาณเพื่อวางแผน: ค่าเฉลี่ยเคลื่อนที่ เส้นแนวโน้มกำลังสองน้อยสุด สหสัมพันธ์ ดัชนีฤดูกาล MAD MAPE และการคำนึงถึงผลกระทบของการตัดสินใจจากค่าพยากรณ์ (p016) ส่วนการควบคุม การประเมินผล และการรายงานผลอยู่ในหัวข้ออื่นของวิชา"
  - topic: business.accounting.audit-internal-control
    indicators: [8.1.5]
    coverage: partial
    note: วัตถุประสงค์และขั้นตอนการสอบบัญชี มาตรฐานการสอบบัญชีไทยที่ยึด ISA ความมีสาระสำคัญ แบบจำลองความเสี่ยง หลักฐานและความน่าเชื่อถือ การสุ่มตัวอย่างแบบมีระบบ อัตราเบี่ยงเบน การขยายผลแบบอัตราส่วน และความเห็นสี่แบบในรายงานผู้สอบบัญชี ยังไม่ได้ลงรายละเอียดกฎหมายวิชาชีพบัญชี ข้อความในรายงานแต่ละส่วน (เช่น เรื่องสำคัญในการตรวจสอบ) และงานให้ความเชื่อมั่นอื่นนอกจากการตรวจสอบงบการเงิน
  - topic: business.accounting.audit-internal-control
    indicators: [8.1.6]
    coverage: full
    note: หลักการกำกับดูแลที่ดี สิทธิของผู้ถือหุ้น คณะกรรมการและคณะกรรมการตรวจสอบ บทบาทผู้มีส่วนได้ส่วนเสีย การเปิดเผยข้อมูล ความเสี่ยงและโอกาส วงจรบริหารความเสี่ยงองค์กรและตารางความเสี่ยง องค์ประกอบห้าประการของการควบคุมภายในตาม COSO (p001 p002 p009 p010 p015 p018)
  - topic: business.accounting.budgeting-variance
    indicators: [8.1.2]
    coverage: partial
    note: งบประมาณหลัก (ขาย การผลิต วัตถุดิบ เงินสด) จากการพยากรณ์ งบยืดหยุ่น ผลต่างปริมาณขายและงบยืดหยุ่น ผลต่างราคาและปริมาณของวัตถุดิบ ผลต่างอัตราและประสิทธิภาพแรงงาน กำไรส่วนงาน คำสั่งซื้อพิเศษ ผลิตเองหรือซื้อ ร่วมกับหัวข้อ product-costing ที่สอนพฤติกรรมต้นทุนและต้นทุนผลิตภัณฑ์ ยังไม่มีการบริหารสินค้าคงเหลือ (EOQ) ผลต่างค่าใช้จ่ายการผลิต การเทียบเคียงสมรรถนะ และ balanced scorecard
  - topic: business.law.contracts
    indicators: [8.1.7]
    coverage: partial
    note: หลักนิติกรรมสัญญา โมฆะ โมฆียะ แบบและหลักฐาน ซื้อขาย เช่า เช่าซื้อ กู้ยืม (เพดานดอกเบี้ย ดอกเบี้ยผิดนัด) ค้ำประกัน รูปแบบธุรกิจและการจดทะเบียน ภาษีมูลค่าเพิ่ม และกฎหมายการขายออนไลน์ ยังไม่มีกฎหมายวิชาชีพบัญชี กฎหมายการบัญชี กฎหมายแรงงาน กฎหมายบริษัทมหาชนและหลักทรัพย์โดยละเอียด และตั๋วเงิน
  - topic: management.org.organizational-behavior
    indicators: [8.2.3]
    coverage: partial
    note: ส่วนทฤษฎีพฤติกรรมองค์การ (การรับรู้ ทัศนคติ วัฒนธรรม ความขัดแย้ง การเปลี่ยนแปลง) ส่วนการออกแบบองค์กรอยู่ใน organizing และกลยุทธ์อยู่ใน strategic-management
  - topic: management.strategy.strategic-management
    indicators: [8.2.3]
    coverage: partial
    note: ปัจจัยภายนอกและภายในที่มีผลต่อกลยุทธ์ กระบวนการนำกลยุทธ์ไปปฏิบัติ กลยุทธ์ระดับหน้าที่ (p003 p009 p014) การออกแบบองค์กรและพฤติกรรมองค์การอยู่ใน organizing และ organizational-behavior
  - topic: business.law.thai-taxation
    indicators: [8.1.4]
    coverage: partial
    note: คำนวณภาษีเงินได้บุคคลธรรมดา ภาษีหัก ณ ที่จ่าย ภาษีเงินได้นิติบุคคล (รวม SME และการปรับกำไรทางภาษี) ภาษีมูลค่าเพิ่ม แบบแสดงรายการหลัก ภาษีมูลค่าเพิ่มการนำเข้าและส่งออก (p003–p017) ยังไม่มีภาษีธุรกิจเฉพาะ อากรแสตมป์ อนุสัญญาภาษีซ้อน การกำหนดราคาโอน และรายละเอียดวิธีปฏิบัติเชิงลึก
  - topic: business.econ.macro-indicators
    indicators: [8.2.2]
    coverage: full
    note: ตัวชี้วัดมหภาค (GDP ด้านรายจ่าย GDP ที่แท้จริงและตัวปรับค่า อัตราการเติบโต GDP ต่อหัว ดัชนีราคา อัตราดอกเบี้ยที่แท้จริง) ผลต่อการตัดสินใจทางธุรกิจ (p011 p016) และโครงสร้างตลาดสี่แบบพร้อม CR4/HHI (p002 p012–p014 p017) หลักจุลภาคพื้นฐานอยู่ใน demand-supply ซึ่งเป็น prerequisite
  - topic: business.finance.capital-budgeting
    indicators: [8.1.3]
    coverage: partial
    note: เทคนิคการจัดทำงบประมาณการลงทุน (กระแสเงินสดส่วนเพิ่ม ระยะคืนทุนและแบบคิดลด NPV IRR PI ความขัดแย้งของเกณฑ์ การจำกัดเงินลงทุน ความไว) การประเมินมูลค่าด้วยวิธีรายได้ วิธีสินทรัพย์ และวิธีมูลค่าตลาด (p006 p007 p011) และการวางแผนการเงินระยะยาวเชิงหลักการ ส่วนแหล่งเงินทุนและต้นทุนเงินทุนอยู่ใน sources-of-funds และการวิเคราะห์อัตราส่วนอยู่ใน financial-ratios
  - topic: business.finance.sources-of-funds
    indicators: [8.1.3]
    coverage: partial
    note: แหล่งเงินทุนขององค์กร การจัดหาเงินทุนจากธนาคาร เครื่องมือทางการเงิน ตลาดหุ้นกู้ ตลาดหุ้นทุน ตลาดพันธบัตรรัฐบาล ความต้องการเงินทุนหมุนเวียนและหลักการจับคู่ (p012 p013) และการคำนวณต้นทุนเงินทุน (ต้นทุนหนี้หลังภาษี CAPM กอร์ดอน หุ้นบุริมสิทธิ WACC) ส่วนการวิเคราะห์อัตราส่วน/แนวโน้ม/กระแสเงินสดอยู่ใน financial-ratios และงบประมาณการลงทุน การประเมินมูลค่า และการวางแผนระยะยาวอยู่ใน capital-budgeting
  - topic: business.international.global-business
    indicators: [8.2.1]
    coverage: full
    note: สภาพแวดล้อมทางธุรกิจแบบ PESTEL และปัจจัยต่างประเทศ (p001) สภาพแวดล้อมโลกที่กระทบการค้าและการเงินระหว่างประเทศ (อัตราแลกเปลี่ยน ความเสี่ยงค่าเงิน p002–p012 p016) โลกาภิวัตน์และบทบาทธุรกิจข้ามชาติ (p013 p010) การพาณิชย์อิเล็กทรอนิกส์ข้ามพรมแดน (p014 p015) และตลาดเกิดใหม่ (p017)
