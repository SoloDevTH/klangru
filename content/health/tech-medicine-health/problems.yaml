problems:
- id: health.technology.tech-medicine-health.p001
  topics:
  - health.technology.tech-medicine-health
  difficulty: 1
  type: mcq
  stem: ขณะจ้องจอนาน ๆ ตามักแห้งและล้า สาเหตุสำคัญคือข้อใด
  choices:
  - id: a
    text: กะพริบตาน้อยลง
    correct: true
  - id: b
    text: จอทำลายจอประสาทตาอย่างถาวร
    feedback: สมาคมจักษุแพทย์อเมริกันระบุว่าการจ้องจอไม่ได้ทำลายดวงตาอย่างถาวร แต่ทำให้ตาล้าชั่วคราว
  - id: c
    text: กะพริบตามากเกินไป
    feedback: ขณะจ้องจอเรากะพริบตาน้อยลง ไม่ใช่มากขึ้น
  hints:
  - การกะพริบตาช่วยเคลือบผิวตาให้ชุ่มชื้น
  - ปกติกะพริบราว 15 ครั้งต่อนาที
  solution: ขณะจ้องจอเรากะพริบตาเหลือราว 5–7 ครั้งต่อนาที จากปกติราว 15 ครั้ง ผิวตาจึงแห้ง ควรตั้งใจกะพริบตาและพักสายตาโดยมองไกล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.technology.tech-medicine-health.p002
  topics:
  - health.technology.tech-medicine-health
  difficulty: 1
  type: mcq
  stem: CDC แนะนำให้ปิดอุปกรณ์อิเล็กทรอนิกส์ก่อนนอนอย่างน้อยกี่นาที
  choices:
  - id: a
    text: 30 นาที
    correct: true
  - id: b
    text: 5 นาที
    feedback: สั้นเกินไป CDC แนะนำอย่างน้อย 30 นาที
  - id: c
    text: ไม่ต้องปิด ใช้จนหลับได้
    feedback: การใช้จนหลับทำให้นอนดึกและหลับยาก
  hints:
  - ให้สมองได้ผ่อนคลายก่อนนอน
  - ครึ่งชั่วโมง
  solution: ปิดอุปกรณ์อิเล็กทรอนิกส์อย่างน้อย 30 นาทีก่อนนอนช่วยให้หลับง่ายและนอนได้มากขึ้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.technology.tech-medicine-health.p003
  topics:
  - health.technology.tech-medicine-health
  difficulty: 2
  type: match
  stem: จับคู่การใช้เทคโนโลยีกับวิธีลดผลเสียต่อสุขภาพ
  pairs:
  - left: ฟังเพลงผ่านหูฟังนาน ๆ
    right: ตั้งเสียงไม่เกิน 60% ของระดับสูงสุดและพักหู
  - left: จ้องจอทำการบ้านทั้งเย็น
    right: กะพริบตาบ่อย ๆ และมองไกลเป็นระยะ
  - left: ก้มดูโทรศัพท์นานจนปวดคอ
    right: ยกจอให้อยู่ระดับสายตาหรือต่ำกว่าเล็กน้อยและนั่งหลังตรง
  - left: เล่นโทรศัพท์บนเตียงจนดึก
    right: ปิดอุปกรณ์อย่างน้อย 30 นาทีก่อนนอน
  hints:
  - แต่ละข้อกระทบอวัยวะหรือพฤติกรรมคนละเรื่อง
  - หู ตา คอ และการนอน
  solution: หูฟัง → ลดเสียงและพักหู จอ → กะพริบตาและมองไกล ก้มดูโทรศัพท์ → ปรับระดับจอและท่านั่ง ใช้บนเตียง → ปิดก่อนนอน 30 นาที
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.technology.tech-medicine-health.p004
  topics:
  - health.technology.tech-medicine-health
  difficulty: 2
  type: mcq
  stem: กรณีใดเหมาะกับการปรึกษาแพทย์ทางไกลผ่านวิดีโอคอลมากที่สุด
  choices:
  - id: a
    text: ผู้ป่วยความดันโลหิตสูงที่อาการคงที่ ติดตามผลและสอบถามการกินยาตามนัด
    correct: true
  - id: b
    text: คนที่เจ็บหน้าอกรุนแรงและหายใจไม่ออกกะทันหัน
    feedback: เป็นเหตุฉุกเฉิน ต้องโทร 1669 ทันที ไม่ใช่รอวิดีโอคอล
  - id: c
    text: คนที่ถูกรถชนและมีเลือดออกมาก
    feedback: การบาดเจ็บรุนแรงต้องได้รับการช่วยเหลือทันที โทร 1669
  hints:
  - การแพทย์ทางไกลมีข้อจำกัดเรื่องการตรวจร่างกาย
  - เหตุฉุกเฉินต้องใช้ช่องทางใด
  solution: การแพทย์ทางไกลเหมาะกับการติดตามโรคเรื้อรังที่อาการคงที่หรืออาการไม่รุนแรง ส่วนเหตุฉุกเฉินต้องโทร 1669 หรือไปโรงพยาบาลทันที
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.technology.tech-medicine-health.p005
  topics:
  - health.technology.tech-medicine-health
  difficulty: 2
  type: mcq
  stem: นักเรียนหญิงชั้น ป.5 ในไทยได้รับวัคซีนเอชพีวีที่โรงเรียน วัคซีนนี้ช่วยป้องกันโรคใดเป็นหลัก
  choices:
  - id: a
    text: มะเร็งปากมดลูก
    correct: true
  - id: b
    text: ไข้หวัดใหญ่
    feedback: ไข้หวัดใหญ่ป้องกันด้วยวัคซีนไข้หวัดใหญ่ ซึ่งเป็นคนละชนิด
  - id: c
    text: ไข้เลือดออก
    feedback: ไข้เลือดออกเกิดจากไวรัสที่ยุงลายเป็นพาหะ ไม่ได้ป้องกันด้วยวัคซีนเอชพีวี
  hints:
  - เอชพีวีเป็นไวรัสที่ทำให้เกิดมะเร็งบางชนิด
  - มะเร็งที่พบบ่อยในผู้หญิง
  solution: วัคซีนเอชพีวีป้องกันการติดเชื้อไวรัสเอชพีวี ซึ่งเป็นสาเหตุหลักของมะเร็งปากมดลูก การให้วัคซีนตั้งแต่วัยเด็กจึงเป็นตัวอย่างของความก้าวหน้าทางการแพทย์ที่ป้องกันโรคได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.technology.tech-medicine-health.p006
  topics:
  - health.technology.tech-medicine-health
  difficulty: 2
  type: text
  stem: เชื้อแบคทีเรียที่ยาปฏิชีวนะใช้ไม่ได้ผลแล้ว ซึ่งเกิดจากการใช้ยาปฏิชีวนะผิดวิธีหรือเกินจำเป็น เรียกว่าอะไร (ตอบเป็นคำ)
  accepted:
  - เชื้อดื้อยา
  - ดื้อยา
  - เชื้อแบคทีเรียดื้อยา
  - แบคทีเรียดื้อยา
  misconceptions:
  - match: ภูมิแพ้
    feedback: ภูมิแพ้เป็นปฏิกิริยาของร่างกายผู้ป่วย ไม่ใช่การที่เชื้อทนต่อยา
  hints:
  - เชื้อทนต่อยาจนยารักษาไม่ได้
  - คำนี้มีคำว่า "ยา" อยู่ด้วย
  solution: เชื้อที่ทนต่อยาจนยาไม่ได้ผลเรียกว่าเชื้อดื้อยา WHO ระบุว่าการใช้ยาปฏิชีวนะผิดวิธีและเกินจำเป็นเป็นสาเหตุหลัก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.technology.tech-medicine-health.p007
  topics:
  - health.technology.tech-medicine-health
  difficulty: 3
  type: numeric
  stem: ขณะทำการบ้านบนแท็บเล็ต 30 นาที ต้นกะพริบตาเพียง 6 ครั้งต่อนาที ถ้าปกติกะพริบ 15 ครั้งต่อนาที ต้นกะพริบตาน้อยกว่าปกติกี่ครั้งใน 30 นาที (ตอบเป็นจำนวนครั้ง)
  answer:
    value: 270
    unit: ครั้ง
  misconceptions:
  - match: 9
    feedback: 9 คือส่วนต่างต่อนาที ต้องคูณด้วย 30 นาที
  - match: 180
    feedback: 180 คือจำนวนครั้งที่ต้นกะพริบจริง ไม่ใช่ส่วนที่น้อยกว่าปกติ
  hints:
  - หาส่วนต่างต่อนาทีก่อน
  - คูณส่วนต่างด้วยจำนวนนาที
  solution: ส่วนต่างต่อนาที $15 - 6 = 9$ ครั้ง ใน 30 นาที $9 \times 30 = 270$ ครั้ง หรือ $450 - 180 = 270$ ครั้ง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.technology.tech-medicine-health.p008
  topics:
  - health.technology.tech-medicine-health
  difficulty: 3
  type: numeric
  stem: จากแผนภูมิของ WHO ถ้าบีมฟังเพลงที่ความดังเฉลี่ย 90 dB วันละ 1 ชั่วโมงทุกวันเป็นเวลา 1 สัปดาห์ บีมฟังเกินเวลาที่ปลอดภัยไปกี่ชั่วโมง (ตอบเป็นชั่วโมง)
  figure: &id001
    src: safe-listening.svg
    alt: แผนภูมิแท่งแนวนอนสเกลลอการิทึม เวลาฟังที่ปลอดภัยต่อสัปดาห์ตามระดับเสียง (WHO) 80 dB 40 ชั่วโมง ตัวอย่างเสียงกริ่งประตู 85 dB 12 ชั่วโมง 30 นาที รถติดหนาแน่น (ในรถ) 90 dB 4 ชั่วโมง ตะโกนคุยกัน 95 dB 1 ชั่วโมง 15 นาที รถจักรยานยนต์ 100 dB 20 นาที ไดร์เป่าผม หมายเหตุตั้งเสียงไม่เกิน 60% ของระดับสูงสุด
  answer:
    value: 3
    unit: ชั่วโมง
  misconceptions:
  - match: 7
    feedback: 7 คือเวลาฟังทั้งสัปดาห์ ต้องลบเวลาที่ปลอดภัยออก
  - match: 33
    feedback: ใช้ค่าของ 80 dB (40 ชั่วโมง) แต่บีมฟังที่ 90 dB
  hints:
  - อ่านเวลาที่ปลอดภัยต่อสัปดาห์ของ 90 dB จากแผนภูมิ
  - เวลาฟังจริงทั้งสัปดาห์ = 1 × 7
  solution: ฟังจริง $1 \times 7 = 7$ ชั่วโมงต่อสัปดาห์ เวลาที่ปลอดภัยที่ 90 dB คือ 4 ชั่วโมง เกินไป $7 - 4 = 3$ ชั่วโมง ควรลดเสียงหรือลดเวลาฟัง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.technology.tech-medicine-health.p009
  topics:
  - health.technology.tech-medicine-health
  difficulty: 3
  type: order
  stem: เรียงความก้าวหน้าทางการแพทย์ต่อไปนี้จากเกิดก่อนไปเกิดหลัง
  items:
  - เจนเนอร์พัฒนาวัคซีนชนิดแรก
  - ค้นพบรังสีเอกซ์
  - ค้นพบเพนิซิลลิน
  - WHO ประกาศกวาดล้างไข้ทรพิษสำเร็จ
  hints:
  - วัคซีนป้องกันฝีดาษเกิดขึ้นตั้งแต่ปลายคริสต์ศตวรรษที่ 18
  - การกวาดล้างไข้ทรพิษต้องอาศัยวัคซีนหลายสิบปี
  solution: วัคซีนของเจนเนอร์ (ค.ศ. 1796) → รังสีเอกซ์ (ค.ศ. 1895) → เพนิซิลลิน (ค.ศ. 1928) → WHO ประกาศกวาดล้างไข้ทรพิษ (ค.ศ. 1980)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.technology.tech-medicine-health.p010
  topics:
  - health.technology.tech-medicine-health
  difficulty: 3
  type: mcq
  stem: ข้อใดเป็นการใช้ยาปฏิชีวนะที่ช่วยลดปัญหาเชื้อดื้อยา
  choices:
  - id: a
    text: ใช้เมื่อแพทย์หรือเภสัชกรสั่ง และใช้ตามขนาดและระยะเวลาที่สั่ง
    correct: true
  - id: b
    text: ซื้อยาปฏิชีวนะกินเองทุกครั้งที่เป็นหวัด
    feedback: หวัดส่วนใหญ่เกิดจากไวรัส ยาปฏิชีวนะไม่ช่วย และการใช้เกินจำเป็นทำให้เกิดเชื้อดื้อยา
  - id: c
    text: เก็บยาที่เหลือไว้กินครั้งหน้าหรือแบ่งให้คนอื่น
    feedback: ยาที่เหลืออาจไม่ใช่ยาที่เหมาะกับโรคครั้งต่อไป และเป็นการใช้ผิดวิธี
  hints:
  - WHO ระบุว่าการใช้ผิดวิธีและเกินจำเป็นทำให้เกิดเชื้อดื้อยา
  - ยาปฏิชีวนะใช้กับการติดเชื้อแบคทีเรีย
  solution: การใช้ยาปฏิชีวนะเฉพาะเมื่อจำเป็นและตามที่แพทย์หรือเภสัชกรสั่ง ช่วยรักษาประสิทธิภาพของยาสำหรับทุกคน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.technology.tech-medicine-health.p011
  topics:
  - health.technology.tech-medicine-health
  difficulty: 3
  type: numeric
  stem: โทรศัพท์ของฝนปรับระดับเสียงได้ 15 ขั้น ถ้าทำตามคำแนะนำของ WHO ให้ตั้งเสียงไม่เกิน 60% ของระดับสูงสุด ฝนควรตั้งเสียงได้สูงสุดกี่ขั้น (ตอบเป็นจำนวนขั้น)
  answer:
    value: 9
    unit: ขั้น
  misconceptions:
  - match: 60
    feedback: 60 คือร้อยละ ต้องคิดเป็นจำนวนขั้นจาก 15 ขั้น
  - match: 6
    feedback: 6 คือ 40% ของ 15 ขั้น โจทย์ถาม 60%
  hints:
  - หา 60% ของ 15
  - คูณ 15 ด้วย 0.6
  solution: $15 \times 0.6 = 9$ ขั้น ตั้งเสียงไม่เกิน 9 ขั้น และใช้หูฟังที่กันเสียงรอบข้างจะได้ไม่ต้องเพิ่มเสียง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.technology.tech-medicine-health.p012
  topics:
  - health.technology.tech-medicine-health
  difficulty: 4
  type: mcq
  stem: กรณีใดตรงกับคำอธิบาย "ภาวะติดเกม" ของ WHO มากที่สุด
  choices:
  - id: a
    text: เล่นเกมจนควบคุมไม่ได้มานานกว่าหนึ่งปี ไม่ทำการบ้าน ไม่กินข้าวพร้อมครอบครัว และยังเล่นต่อแม้ผลการเรียนตก
    correct: true
  - id: b
    text: เล่นเกมวันเสาร์ 2 ชั่วโมงกับเพื่อน แล้วไปเตะบอลต่อ
    feedback: เป็นการเล่นเป็นงานอดิเรกที่ยังควบคุมได้ ไม่ตรงกับภาวะติดเกม
  - id: c
    text: ดาวน์โหลดเกมใหม่ 1 เกมเพราะเพื่อนชวน
    feedback: การเล่นเกมไม่ได้แปลว่าติดเกม ต้องดูการควบคุมตนเองและผลกระทบต่อชีวิต
  hints:
  - ICD-11 ดูการควบคุมการเล่น ลำดับความสำคัญ และการเล่นต่อแม้เกิดผลเสีย
  - ผลกระทบต้องรุนแรงต่อการเรียน ครอบครัว หรือสังคม และโดยทั่วไปนานอย่างน้อย 12 เดือน
  solution: ภาวะติดเกมตาม ICD-11 คือควบคุมการเล่นไม่ได้ ให้เกมมาก่อนกิจกรรมอื่น และเล่นต่อแม้เกิดผลเสีย จนกระทบชีวิตอย่างมาก โดยทั่วไปนานอย่างน้อย 12 เดือน ผู้ที่กังวลควรปรึกษาบุคลากรสุขภาพ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.technology.tech-medicine-health.p013
  topics:
  - health.technology.tech-medicine-health
  difficulty: 4
  type: mcq
  stem: โฆษณาออนไลน์ขาย "นาฬิกาอัจฉริยะ วัดน้ำตาลไม่ต้องเจาะเลือด รักษาเบาหวานหายขาด ไม่ต้องกินยา" ควรประเมินอย่างไร
  choices:
  - id: a
