problems:
  - id: biology.animals.homeostasis.p001
    topics: [biology.animals.homeostasis]
    difficulty: 1
    type: mcq
    stem: "pH ของเลือดคนปกติอยู่ในช่วงใด"
    choices:
      - { id: a, text: "7.35–7.45", correct: true }
      - { id: b, text: "6.35–6.45", feedback: "ช่วงนี้เป็นกรดเกินไปสำหรับเลือด" }
      - { id: c, text: "7.00 พอดี", feedback: "7.00 เป็นกลางพอดี เลือดปกติเป็นเบสอ่อน ๆ" }
      - { id: d, text: "1.5–3.5", feedback: "ช่วงนี้เป็นของน้ำย่อยในกระเพาะอาหาร ไม่ใช่เลือด" }
    hints:
      - "เลือดเป็นเบสอ่อน ๆ"
      - "ช่วงปกติแคบมาก กว้างไม่ถึง 0.1"
    solution: "pH ของเลือดปกติอยู่ระหว่าง 7.35–7.45 ซึ่งเป็นเบสอ่อน ๆ ร่างกายรักษาช่วงนี้ด้วยบัฟเฟอร์ ปอด และไต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.homeostasis.p002
    topics: [biology.animals.homeostasis]
    difficulty: 1
    type: match
    stem: "จับคู่ส่วนของการป้อนกลับเชิงลบกับตัวอย่างในการควบคุมอุณหภูมิเมื่ออากาศร้อน"
    pairs:
      - { left: "สิ่งเร้า", right: "อุณหภูมิร่างกายสูงขึ้น" }
      - { left: "ตัวรับรู้", right: "ปลายประสาทรับความร้อนที่ผิวหนัง" }
      - { left: "ศูนย์ควบคุม", right: "ไฮโพทาลามัส" }
      - { left: "หน่วยปฏิบัติงาน", right: "ต่อมเหงื่อ" }
    hints:
      - "ศูนย์ควบคุมอยู่ในสมอง"
      - "หน่วยปฏิบัติงานคืออวัยวะที่ทำให้เกิดการตอบสนอง"
    solution: "อุณหภูมิที่สูงขึ้นเป็นสิ่งเร้า ปลายประสาทที่ผิวหนังเป็นตัวรับรู้ ไฮโพทาลามัสเป็นศูนย์ควบคุม และต่อมเหงื่อเป็นหน่วยปฏิบัติงาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.homeostasis.p003
    topics: [biology.animals.homeostasis]
    difficulty: 1
    type: text
    stem: "ฮอร์โมนจากต่อมใต้สมองส่วนหลังที่เพิ่มการดูดน้ำกลับที่ท่อรวมของไตชื่ออะไร (ตอบชื่อย่อหรือชื่อเต็ม)"
    accepted: ["ADH", "แอนติไดยูเรติก", "ฮอร์โมนแอนติไดยูเรติก", "antidiuretic hormone", "วาโซเพรสซิน", "vasopressin"]
    misconceptions:
      - { match: "แอลโดสเตอโรน", feedback: "แอลโดสเตอโรนมาจากต่อมหมวกไตและเพิ่มการดูดกลับ Na⁺" }
      - { match: "อินซูลิน", feedback: "อินซูลินควบคุมระดับน้ำตาลในเลือด" }
    hints:
      - "ชื่อแปลว่าต้านการขับปัสสาวะ"
      - "ชื่อย่อมี 3 ตัวอักษร"
    solution: "ฮอร์โมนแอนติไดยูเรติก (ADH หรือวาโซเพรสซิน) ทำให้ท่อรวมยอมให้น้ำผ่านได้มาก น้ำจึงถูกดูดกลับเข้าเลือด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.homeostasis.p004
    topics: [biology.animals.homeostasis]
    difficulty: 2
    type: mcq
    stem: "ช่างก่อสร้างทำงานกลางแดดทั้งวัน เหงื่อออกมาก แต่ดื่มน้ำน้อย ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "ADH ในเลือดเพิ่มขึ้น ปัสสาวะน้อยและสีเข้ม", correct: true }
      - { id: b, text: "ADH ในเลือดลดลง ปัสสาวะมากและใส", feedback: "เป็นผลเมื่อดื่มน้ำมาก ไม่ใช่เมื่อร่างกายขาดน้ำ" }
      - { id: c, text: "ADH ในเลือดเพิ่มขึ้น ปัสสาวะมากและใส", feedback: "ADH เพิ่มการดูดน้ำกลับ ปัสสาวะจึงน้อยลง ไม่ใช่มากขึ้น" }
      - { id: d, text: "ไตหยุดสร้างปัสสาวะทั้งหมด", feedback: "ไตยังต้องขับของเสีย ปัสสาวะน้อยลงแต่ไม่หยุด" }
    hints:
      - "เหงื่อออกมากและดื่มน้ำน้อยทำให้เลือดเข้มข้นขึ้น"
      - "ADH ทำให้ดูดน้ำกลับมากหรือน้อย"
    solution: "เลือดเข้มข้นขึ้น ไฮโพทาลามัสกระตุ้นให้หลั่ง ADH มากขึ้น ท่อรวมดูดน้ำกลับมาก ปัสสาวะจึงน้อยและเข้มข้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.homeostasis.p005
    topics: [biology.animals.homeostasis]
    difficulty: 2
    type: order
    stem: "เรียงเหตุการณ์ตั้งแต่ร่างกายขาดน้ำจนเลือดกลับสู่ความเข้มข้นปกติ"
    items:
      - "เลือดมีความเข้มข้นสูงขึ้น"
      - "ไฮโพทาลามัสรับรู้การเปลี่ยนแปลง"
      - "ต่อมใต้สมองส่วนหลังหลั่ง ADH มากขึ้น"
      - "ท่อรวมของไตดูดน้ำกลับเข้าเลือดมากขึ้น"
      - "เลือดเจือจางลงจนใกล้ระดับปกติ"
    hints:
      - "เริ่มจากสิ่งเร้า แล้วตามด้วยตัวรับรู้"
      - "ADH ต้องหลั่งก่อนจึงไปออกฤทธิ์ที่ไต"
    solution: "เลือดเข้มข้น → ไฮโพทาลามัสรับรู้ → ต่อมใต้สมองส่วนหลังหลั่ง ADH → ท่อรวมดูดน้ำกลับ → เลือดเจือจางลง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.homeostasis.p006
    topics: [biology.animals.homeostasis]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "เมื่ออยู่ในที่อากาศหนาว ร่างกายตอบสนองอย่างไร (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "หลอดเลือดที่ผิวหนังหดตัว", correct: true }
      - { id: b, text: "กล้ามเนื้อโครงร่างหดตัวถี่ ๆ จนตัวสั่น", correct: true }
      - { id: c, text: "หลอดเลือดที่ผิวหนังขยายตัว", feedback: "หลอดเลือดขยายทำให้เสียความร้อนที่ผิวมากขึ้น เป็นการตอบสนองเมื่อร้อน" }
      - { id: d, text: "ต่อมเหงื่อหลั่งเหงื่อมากขึ้น", feedback: "เหงื่อระเหยพาความร้อนออก ร่างกายจึงลดการหลั่งเหงื่อเมื่อหนาว" }
    hints:
      - "เมื่อหนาว ร่างกายต้องลดการเสียความร้อนและเพิ่มการสร้างความร้อน"
      - "แต่ละข้อลดหรือเพิ่มการเสียความร้อน"
    solution: "หลอดเลือดที่ผิวหนังหดตัวลดการเสียความร้อน และกล้ามเนื้อโครงร่างสั่นสร้างความร้อน ส่วนการขยายหลอดเลือดและการหลั่งเหงื่อเป็นการตอบสนองเมื่อร้อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.homeostasis.p007
    topics: [biology.animals.homeostasis]
    difficulty: 2
    type: numeric
    stem: "วันที่ร้อนมาก ร่างกายได้น้ำจากเครื่องดื่ม 1,800 mL จากอาหาร 800 mL และจากการหายใจระดับเซลล์ 300 mL เสียน้ำทางเหงื่อและผิวหนัง 1,100 mL ลมหายใจ 400 mL อุจจาระ 100 mL ถ้าน้ำในร่างกายคงที่ วันนั้นขับปัสสาวะกี่มิลลิลิตร"
    answer: { value: 1300, unit: mL }
    misconceptions:
      - { match: 1000, feedback: "ลืมนับน้ำ 300 mL ที่ได้จากการหายใจระดับเซลล์" }
      - { match: 500, feedback: "ลืมนับน้ำที่ได้จากอาหาร" }
    hints:
      - "น้ำเข้าทั้งหมด = น้ำออกทั้งหมด"
      - "รวมน้ำเข้าทั้ง 3 ทาง แล้วลบด้วยน้ำออกทางอื่นที่ไม่ใช่ปัสสาวะ"
    solution: "น้ำเข้า $1{,}800 + 800 + 300 = 2{,}900$ mL น้ำออกทางอื่น $1{,}100 + 400 + 100 = 1{,}600$ mL ปัสสาวะ $2{,}900 - 1{,}600 = 1{,}300$ mL"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.homeostasis.p008
    topics: [biology.animals.homeostasis]
    difficulty: 3
    type: mcq
    stem: "นักเรียนกลั้นหายใจใต้น้ำนานเท่าที่ทำได้ เมื่อโผล่ขึ้นมาจะหายใจเร็วและลึก ข้อใดอธิบายได้ถูกต้อง"
    choices:
      - { id: a, text: "CO₂ ในเลือดสะสม H⁺ เพิ่ม pH ลดลง ศูนย์หายใจในเมดัลลาออบลองกาตาจึงเร่งการหายใจเพื่อขับ CO₂", correct: true }
      - { id: b, text: "CO₂ ในเลือดลดลง pH สูงขึ้น ร่างกายจึงหายใจเร็วเพื่อรับ CO₂", feedback: "ขณะกลั้นหายใจ CO₂ สะสมมากขึ้น ไม่ได้ลดลง" }
      - { id: c, text: "ไตขับ H⁺ ออกไม่ทัน จึงต้องให้ปอดขับ H⁺ ออกทางลมหายใจโดยตรง", feedback: "ปอดขับ CO₂ ไม่ได้ขับ H⁺ โดยตรง แต่การขับ CO₂ ทำให้ H⁺ ลดลง" }
      - { id: d, text: "ไฮโพทาลามัสรับรู้ว่าอุณหภูมิสูงขึ้นจึงสั่งให้หอบ", feedback: "การหายใจหอบหลังกลั้นหายใจเกิดจาก CO₂ และ pH ไม่ใช่อุณหภูมิ" }
    hints:
      - "ขณะกลั้นหายใจ เซลล์ยังผลิต CO₂ แต่ไม่ได้ขับออก"
      - "CO₂ + H₂O ⇌ H⁺ + HCO₃⁻"
    solution: "CO₂ สะสมทำให้ปฏิกิริยาเลื่อนไปสร้าง H⁺ มากขึ้น pH ลดลง ศูนย์ควบคุมการหายใจรับรู้แล้วเร่งการหายใจ ขับ CO₂ ออกจน pH กลับสู่ปกติ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.homeostasis.p009
    topics: [biology.animals.homeostasis]
    difficulty: 3
    type: numeric
    stem: "อาสาสมัครดื่มน้ำเปล่า 1 L แล้วเก็บปัสสาวะทุก 15 นาที ตามกราฟ ตลอด 120 นาทีหลังดื่ม กลุ่มที่ดื่มน้ำเปล่าขับปัสสาวะรวมกี่มิลลิลิตร"
    figure: { src: urine-after-drinking.svg, alt: "กราฟเส้นชื่อปริมาณปัสสาวะทุก 15 นาที (ข้อมูลสมมติ) แกนนอนคือเวลาหลังดื่ม 0 ถึง 120 นาที แกนตั้งคือปัสสาวะใน 15 นาที หน่วยมิลลิลิตร เส้นสีน้ำเงินจุดกลมคือดื่มน้ำเปล่า 1 ลิตร มีค่าที่นาทีที่ 15, 30, 45, 60, 75, 90, 105, 120 เท่ากับ 40, 120, 260, 220, 130, 70, 50, 40 มิลลิลิตร ตามลำดับ เส้นสีส้มจุดสี่เหลี่ยมคือดื่มน้ำเกลือ 0.9% 1 ลิตร มีค่า 40, 45, 50, 45, 40, 40, 35, 35 มิลลิลิตร ตามลำดับ" }
    answer: { value: 930, unit: mL }
    misconceptions:
      - { match: 260, feedback: "260 mL คือค่าสูงสุดในช่วงเดียว โจทย์ถามผลรวมทุกช่วง" }
      - { match: 330, feedback: "330 mL เป็นผลรวมของกลุ่มที่ดื่มน้ำเกลือ" }
    hints:
      - "แต่ละจุดคือปริมาณปัสสาวะในช่วง 15 นาทีนั้น"
      - "อ่านค่าของเส้นสีน้ำเงินทั้ง 8 จุดแล้วบวกกัน"
    solution: "$40 + 120 + 260 + 220 + 130 + 70 + 50 + 40 = 930$ mL"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.homeostasis.p010
    topics: [biology.animals.homeostasis]
    difficulty: 3
    type: mcq
    stem: "จากกราฟในข้อก่อน ทำไมกลุ่มที่ดื่มน้ำเกลือ 0.9% ปริมาณเท่ากันจึงไม่ปัสสาวะเพิ่มขึ้นมาก"
    figure: { src: urine-after-drinking.svg, alt: "กราฟเส้นชื่อปริมาณปัสสาวะทุก 15 นาที (ข้อมูลสมมติ) เส้นสีน้ำเงินของกลุ่มดื่มน้ำเปล่า 1 ลิตรเพิ่มจาก 40 ขึ้นไปสูงสุด 260 มิลลิลิตรที่นาทีที่ 45 แล้วลดลงเหลือ 40 ที่นาทีที่ 120 เส้นสีส้มของกลุ่มดื่มน้ำเกลือ 0.9% 1 ลิตรอยู่ระหว่าง 35 ถึง 50 มิลลิลิตรตลอด" }
    choices:
      - { id: a, text: "น้ำเกลือ 0.9% มีความเข้มข้นใกล้เคียงเลือด เลือดจึงไม่เจือจาง ADH ไม่ลดลงมาก", correct: true }
      - { id: b, text: "เกลือทำให้ไตหยุดทำงานชั่วคราว", feedback: "ไตยังทำงาน ปัสสาวะยังออกราว 40 mL ทุก 15 นาที" }
      - { id: c, text: "น้ำเกลือถูกดูดซึมช้ากว่าน้ำเปล่ามากจนไม่เข้าสู่เลือดเลย", feedback: "น้ำเกลือถูกดูดซึมได้ ประเด็นคือมันไม่ทำให้เลือดเจือจาง" }
      - { id: d, text: "น้ำเกลือทำให้ ADH ลดลงมากกว่าน้ำเปล่า", feedback: "ถ้า ADH ลดลงมาก ปัสสาวะจะเพิ่มขึ้น ซึ่งขัดกับกราฟ" }
    hints:
      - "สิ่งเร้าที่ทำให้ ADH ลดลงคือเลือดเจือจาง"
      - "น้ำเกลือ 0.9% เป็นสารละลายไอโซโทนิกกับเลือด"
    solution: "น้ำเปล่าทำให้เลือดเจือจาง ADH ลดลง ไตจึงดูดน้ำกลับน้อยและขับปัสสาวะมาก ส่วนน้ำเกลือ 0.9% มีความเข้มข้นใกล้เลือด เลือดไม่เจือจาง ADH จึงไม่ลดลงมาก ปัสสาวะแทบไม่เพิ่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.homeostasis.p011
    topics: [biology.animals.homeostasis]
    difficulty: 3
    type: mcq
    stem: "เมื่อเลือดเป็นกรดมากกว่าปกติ ไตช่วยรักษาดุลยภาพกรด-เบสอย่างไร"
    choices:
      - { id: a, text: "ขับ H⁺ ออกทางปัสสาวะและดูดกลับ HCO₃⁻ เข้าเลือดมากขึ้น", correct: true }
      - { id: b, text: "ดูดกลับ H⁺ เข้าเลือดและขับ HCO₃⁻ ออกทางปัสสาวะ", feedback: "แบบนี้ทำให้เลือดเป็นกรดมากขึ้น เป็นการตอบสนองเมื่อเลือดเป็นเบส" }
      - { id: c, text: "ขับ CO₂ ออกทางปัสสาวะ", feedback: "CO₂ ถูกขับออกทางปอดเป็นหลัก" }
      - { id: d, text: "หยุดกรองเลือดชั่วคราว", feedback: "การหยุดกรองไม่ได้แก้ความเป็นกรด และไตไม่ได้ทำงานแบบนั้น" }
    hints:
      - "H⁺ ทำให้เป็นกรด HCO₃⁻ เป็นเบสที่จับ H⁺"
      - "ไตต้องเอาสิ่งใดออกและเก็บสิ่งใดไว้"
    solution: "ไตขับ H⁺ ออกไปกับปัสสาวะ และดูดกลับ HCO₃⁻ ซึ่งจับ H⁺ ในเลือด pH จึงกลับสูงขึ้นสู่ปกติ"
    license: CC-BY-SA-4.0
    ai_assisted: true

