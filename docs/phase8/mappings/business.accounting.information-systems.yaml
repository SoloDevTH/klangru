topic: business.accounting.information-systems
rows:
  - { framework: th-tqf-accounting, indicators: ["8.3"], coverage: partial, note: "ส่วนประกอบและการไหลของข้อมูลใน AIS แฟ้มข้อมูลหลักและแฟ้มรายการ วงจรธุรกิจในโปรแกรมบัญชี สมุดรายวันและงบทดลองในสเปรดชีต (VLOOKUP SUMIF การอ้างอิงสัมบูรณ์) การควบคุมทั่วไปและการควบคุมระบบงาน (ตรวจขอบเขต ยอดรวมควบคุม หลักตรวจสอบ แบ่งแยกหน้าที่ กระทบยอด) และรายงานช่วยตัดสินใจ (อายุลูกหนี้ กำไรขั้นต้นรายสินค้า) ยังไม่มีการออกแบบฐานข้อมูล ERP การตรวจสอบระบบสารสนเทศ และเครื่องมือวิเคราะห์ข้อมูลขั้นสูง" }
  - { framework: th-tqf-accounting, indicators: ["5.5.3"], coverage: partial, note: "รู้จักเทคโนโลยีดิจิทัลที่ใช้ในงานบัญชี (e-Tax Invoice ดึงรายการธนาคาร OCR คลาวด์) และใช้สูตรสเปรดชีต แต่ทักษะการใช้โปรแกรมจริงต้องฝึกนอกแอป" }
