<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="sans-serif">
<title>ระบบอวัยวะทำงานร่วมกันขณะวิ่ง</title>
<rect x="0" y="0" width="780" height="400" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="390.0" y="28.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">เมื่อวิ่ง ระบบอวัยวะทำงานร่วมกันเพื่อรักษาสมดุล</text>
<rect x="290.0" y="165.0" width="200.0" height="76.0" rx="8" fill="#fdebd0" stroke="#333" stroke-width="1.5"/>
<text x="390.0" y="196.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">ระบบประสาทและต่อมไร้ท่อ</text>
<text x="390.0" y="220.0" font-size="13" text-anchor="middle" fill="#111">รับรู้และสั่งการ</text>
<rect x="15.0" y="57.0" width="190.0" height="76.0" rx="8" fill="#fadbd8" stroke="#333" stroke-width="1.5"/>
<text x="110.0" y="83.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">กล้ามเนื้อ</text>
<text x="110.0" y="103.0" font-size="12.5" text-anchor="middle" fill="#111">ต้องการออกซิเจน</text>
<text x="110.0" y="121.0" font-size="12.5" text-anchor="middle" fill="#111">และพลังงานมากขึ้น</text>
<rect x="575.0" y="57.0" width="190.0" height="76.0" rx="8" fill="#d6eaf8" stroke="#333" stroke-width="1.5"/>
<text x="670.0" y="83.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">ระบบหายใจ</text>
<text x="670.0" y="103.0" font-size="12.5" text-anchor="middle" fill="#111">หายใจเร็วและลึกขึ้น</text>
<text x="670.0" y="121.0" font-size="12.5" text-anchor="middle" fill="#111">รับออกซิเจนมากขึ้น</text>
<rect x="15.0" y="282.0" width="190.0" height="76.0" rx="8" fill="#fcf3cf" stroke="#333" stroke-width="1.5"/>
<text x="110.0" y="308.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">ผิวหนัง</text>
<text x="110.0" y="328.0" font-size="12.5" text-anchor="middle" fill="#111">ขับเหงื่อ</text>
<text x="110.0" y="346.0" font-size="12.5" text-anchor="middle" fill="#111">ระบายความร้อน</text>
<rect x="295.0" y="292.0" width="190.0" height="76.0" rx="8" fill="#f5b7b1" stroke="#333" stroke-width="1.5"/>
<text x="390.0" y="318.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">ระบบหมุนเวียนเลือด</text>
<text x="390.0" y="338.0" font-size="12.5" text-anchor="middle" fill="#111">หัวใจเต้นเร็วขึ้น</text>
<text x="390.0" y="356.0" font-size="12.5" text-anchor="middle" fill="#111">ส่งเลือดไปกล้ามเนื้อ</text>
<rect x="575.0" y="282.0" width="190.0" height="76.0" rx="8" fill="#d5f5e3" stroke="#333" stroke-width="1.5"/>
<text x="670.0" y="308.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">ระบบขับถ่าย (ไต)</text>
<text x="670.0" y="328.0" font-size="12.5" text-anchor="middle" fill="#111">ลดการขับน้ำ</text>
<text x="670.0" y="346.0" font-size="12.5" text-anchor="middle" fill="#111">ไม่ให้ขาดน้ำ</text>
<line x1="288.0" y1="163.7" x2="207.0" y2="132.4" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="492.0" y1="163.7" x2="573.0" y2="132.4" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="294.3" y1="243.0" x2="205.7" y2="280.0" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="390.0" y1="243.0" x2="390.0" y2="290.0" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="485.7" y1="243.0" x2="574.3" y2="280.0" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="390.0" y="140.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#922b21">อุณหภูมิ น้ำ และออกซิเจนในร่างกายจึงคงที่</text>
</svg>
