id: physics.energy.conservation
subject: physics
title: { th: การอนุรักษ์พลังงานกล, en: Conservation of mechanical energy }
summary: พลังงานจลน์และพลังงานศักย์เปลี่ยนรูปไปมาโดยผลรวมคงตัว ใช้กับลูกตุ้ม รางลื่น และสไลเดอร์ และคิดพลังงานที่สูญเสียไปเพราะแรงเสียดทาน
difficulty: 5
minutes: 35
prerequisites: [physics.energy.kinetic-potential]
encompasses:
  - { id: physics.energy.kinetic-potential, weight: 0.5 }
  - { id: physics.energy.work, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: energy-bars.svg
    alt: "แผนภูมิแท่งพลังงานของเด็กมวล 20 กิโลกรัมบนสไลเดอร์สูง 3 เมตร สามคอลัมน์ ที่ยอดมีพลังงานศักย์ 588 J ด้านล่างถ้าไม่มีแรงเสียดทานมีพลังงานจลน์ 588 J ด้านล่างจริงมีพลังงานจลน์ 360 J ซ้อนกับความร้อน 228 J ความสูงรวมของทุกคอลัมน์เท่ากันที่ 588 J"
    caption: "พลังงานรวมเท่าเดิมทุกตำแหน่ง แรงเสียดทานเปลี่ยนพลังงานกลบางส่วนเป็นความร้อน"
  - type: worked-example
    title: รถไฟเหาะผ่านจุดต่ำและจุดสูง
    problem: "รถไฟเหาะเริ่มจากหยุดนิ่งที่จุด A สูง $20\\ \\mathrm{m}$ บนรางลื่นดังรูป หาอัตราเร็วที่จุด B (สูง $5\\ \\mathrm{m}$) และบอกว่ารถไปถึงจุด C (สูง $22\\ \\mathrm{m}$) ได้หรือไม่ ใช้ $g = 9.8\\ \\mathrm{m/s^2}$"
    figure:
      src: we-track.svg
      alt: "รางรถไฟเหาะเป็นเส้นโค้งตามมาตราส่วน เริ่มที่จุด A สูง 20 m ลงไปจุดต่ำสุด B สูง 5 m แล้วขึ้นไปยอดเนิน C สูง 22 m ซึ่งสูงกว่า A"
    steps:
      - text: "พลังงานกลที่ A: $E_k = 0$ และ $E_p = mg(20)$"
      - text: "ที่ B: $mg(20) = \\tfrac12 mv^2 + mg(5)$ ได้ $v^2 = 2g(20 - 5) = 2(9.8)(15) = 294$"
        why: "ใช้ความสูงที่ลดลง $15\\ \\mathrm{m}$ ไม่ใช่ความสูงของจุดใดจุดหนึ่ง"
      - text: "$v_B = \\sqrt{294} \\approx 17.1\\ \\mathrm{m/s}$"
      - text: "ถ้าจะถึง C ต้องมีพลังงานศักย์ $mg(22)$ ซึ่งมากกว่าพลังงานรวม $mg(20)$ ที่มีอยู่ รถจึงขึ้นไปได้สูงสุด $20\\ \\mathrm{m}$ แล้วไหลกลับ"
        why: "บนรางลื่นพลังงานกลคงตัว รถขึ้นไปสูงกว่าจุดที่ปล่อยจากหยุดนิ่งไม่ได้"
    answer: "$v_B \\approx 17.1\\ \\mathrm{m/s}$ และรถไปไม่ถึง C"
  - { type: check, problem: phy.cons.p016, prompt: "ลองกับรางอีกรูปหนึ่ง" }
  - type: worked-example
    title: บัญชีพลังงานเมื่อรถเบรก
    problem: "รถยนต์มวล $1200\\ \\mathrm{kg}$ วิ่งด้วยความเร็ว $20\\ \\mathrm{m/s}$ แล้วเบรกจนหยุดในระยะ $40\\ \\mathrm{m}$ บนถนนราบ หาแรงเฉลี่ยที่ทำให้รถหยุด และพลังงานที่เก็บคืนได้ถ้าเป็นรถไฮบริดที่เบรกแบบคืนพลังงานได้ $30\\%$"
    steps:
      - text: "พลังงานจลน์ต้น $= \\tfrac12(1200)(20)^2 = 240\\,000\\ \\mathrm{J}$ พลังงานจลน์ปลาย $= 0$"
      - text: "พลังงานทั้งหมดถูกแรงต้านเปลี่ยนไป: $F \\times 40 = 240\\,000$ ได้ $F = 6000\\ \\mathrm{N}$"
        why: "งานของแรงต้าน (แรง × ระยะ) เท่ากับพลังงานจลน์ที่หายไป ถนนราบ พลังงานศักย์จึงไม่เปลี่ยน"
      - text: "รถธรรมดา: $240\\,000\\ \\mathrm{J}$ กลายเป็นความร้อนที่จานเบรกทั้งหมด"
      - text: "รถไฮบริด: เก็บคืน $0.30 \\times 240\\,000 = 72\\,000\\ \\mathrm{J}$ เป็นพลังงานไฟฟ้าในแบตเตอรี่ ที่เหลือ $168\\,000\\ \\mathrm{J}$ เป็นความร้อน"
    answer: "แรงเฉลี่ย $6000\\ \\mathrm{N}$ รถไฮบริดเก็บคืนได้ $72\\,000\\ \\mathrm{J}$"
  - { type: check, problem: phy.cons.p022, prompt: "ทำบัญชีพลังงานของรถเข็น" }
  - type: interactive
    title: พลังงานศักย์ พลังงานจลน์ และพลังงานรวมของวัตถุที่ตกลงมา
    caption: 'ปล่อยวัตถุมวล m จากความสูง H (ใช้ g = 9.8 m/s²) แกนนอนคือความสูงขณะหนึ่ง x (m) แกนตั้งคือพลังงาน (J) เส้นที่ขึ้นตาม x คือพลังงานศักย์ mgx เส้นที่ลดลงคือพลังงานจลน์ mg(H − x) และเส้นแนวนอนคือพลังงานรวม ลองเลื่อน m และ H แล้วสังเกตว่าทุกความสูง สองเส้นแรกบวกกันได้เส้นที่สามเสมอ (ดูเฉพาะช่วง 0 ≤ x ≤ H)'
    widget:
      kind: function-plot
      functions: ['9.8 m x', '9.8 m \cdot (H - x)', '9.8 m H']
      sliders:
        - { name: m, min: 1, max: 5, step: 0.5, value: 2, label: มวล m (kg) }
        - { name: H, min: 2, max: 10, step: 1, value: 8, label: ความสูงที่ปล่อย H (m) }
      x: [0, 10]
      y: [0, 500]
  - type: simulation
    title: สเกตบอร์ดกับพลังงาน (PhET Energy Skate Park Basics)
    url: https://phet.colorado.edu/en/simulations/energy-skate-park-basics
    provider: phet
    note: เปิดกราฟแท่งพลังงาน แล้วปล่อยนักสเกตจากความสูงต่าง ๆ สังเกตว่าพลังงานจลน์กับพลังงานศักย์สลับกันเพิ่มลด แต่พลังงานรวมคงตัว จากนั้นเปิดแรงเสียดทานในหน้าจอแรงเสียดทาน (Friction) จะเห็นพลังงานความร้อนเพิ่มขึ้นและพลังงานกลลดลง
  - type: simulation
    title: ห้องทดลองลูกตุ้ม (PhET Pendulum Lab)
    url: https://phet.colorado.edu/en/simulations/pendulum-lab
    provider: phet
    note: ในหน้าจอพลังงาน (Energy) ลองดึงลูกตุ้มขึ้นแล้วปล่อย สังเกตว่าพลังงานจลน์มากที่สุดที่จุดต่ำสุด และพลังงานศักย์มากที่สุดที่ปลายการแกว่ง
glossary:
  - { term: พลังงานกล, definition: 'ผลรวมของพลังงานจลน์และพลังงานศักย์ $E = \tfrac{1}{2}mv^2 + mgh\ (+\ \tfrac{1}{2}kx^2)$' }
  - { term: กฎการอนุรักษ์พลังงานกล, definition: 'ถ้ามีเพียงแรงโน้มถ่วงและแรงสปริงที่ทำงาน พลังงานกลของระบบจะคงตัว' }
  - { term: พลังงานที่สูญเสีย, definition: 'พลังงานกลที่เปลี่ยนเป็นความร้อนและเสียงเพราะแรงเสียดทานหรือแรงต้าน มีค่าเท่ากับขนาดของงานที่แรงเหล่านั้นทำ' }
flashcards:
  - { front: 'สมการอนุรักษ์พลังงานกลระหว่างสองตำแหน่ง', back: '$\tfrac{1}{2}mu^2 + mgh_1 = \tfrac{1}{2}mv^2 + mgh_2$ ใช้ได้เมื่อไม่มีแรงเสียดทานและแรงต้าน' }
  - { front: 'ปล่อยวัตถุจากหยุดนิ่ง ลงมาได้ความสูง $h$ โดยไม่มีแรงเสียดทาน มีอัตราเร็วเท่าใด', back: '$v = \sqrt{2gh}$ ไม่ขึ้นกับมวล' }
  - { front: 'ลูกตุ้มมีพลังงานจลน์มากที่สุดที่ตำแหน่งใด', back: 'ที่จุดต่ำสุด ซึ่งพลังงานศักย์น้อยที่สุด' }
  - { front: 'มีแรงเสียดทาน พลังงานกลที่หายไปไปอยู่ที่ใด', back: 'เปลี่ยนเป็นพลังงานความร้อนและเสียง พลังงานรวมทุกรูปแบบยังคงตัว' }
  - { front: 'บัญชีพลังงานของระบบ', back: '$E_{\text{ต้น}} + W_{\text{เข้า}} = E_{\text{ปลาย}} + E_{\text{สูญเสีย}}$ ประสิทธิภาพ = พลังงานที่ได้เป็นประโยชน์ ÷ พลังงานที่ใส่ × 100%' }
