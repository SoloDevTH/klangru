<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" font-family="sans-serif">
<title>เรื่องสั้นสมมุติ ว่าวของน้ำฝน</title>
<defs></defs>
<rect x="0" y="0" width="860" height="360" fill="#fff"/>
<rect x="10.0" y="10.0" width="840.0" height="340.0" rx="10" fill="#fffdf5" stroke="#8d6e63" stroke-width="2"/>
<text x="30.0" y="46.0" font-size="22" text-anchor="start" fill="#5d4037" font-weight="bold">ว่าวของน้ำฝน</text>
<text x="830.0" y="46.0" font-size="14" text-anchor="end" fill="#777" font-weight="normal">(เรื่องสมมุติ)</text>
<text x="30.0" y="94.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">(1) บ่ายวันเสาร์ น้ำฝนกับพี่ชายนำว่าวตัวใหม่ไปเล่นที่ทุ่งนาหลังบ้าน</text>
<text x="30.0" y="138.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">(2) พี่ชายเตือนว่า "อย่าพาว่าวเข้าใกล้เสาไฟฟ้าตรงคันนานะ"</text>
<text x="30.0" y="182.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">(3) ลมแรงขึ้นเรื่อย ๆ ว่าวลอยสูงจนเห็นเป็นจุดเล็ก ๆ</text>
<text x="30.0" y="226.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">(4) น้ำฝนสังเกตว่าเชือกเริ่มเป็นขุยตรงที่ผูกกับไม้หลอด</text>
<text x="30.0" y="270.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">(5) ทางทิศตะวันตก เมฆดำก้อนใหญ่ลอยใกล้เข้ามา</text>
<text x="30.0" y="314.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">(6) น้ำฝนกระตุกเชือกแรงขึ้น เพราะอยากให้ว่าวสูงกว่าว่าวของเด็กบ้านข้าง ๆ</text>
</svg>
