    type: mcq
    stem: "ใยอาหารย่อยไม่ได้ แต่ทำไมจึงช่วยให้ขับถ่ายดี"
    choices:
      - { id: a, text: "เพราะใยอาหารทำให้กากอาหารมีปริมาณมากขึ้นและอุจจาระนุ่ม ลำไส้จึงขับออกได้ง่าย", correct: true }
      - { id: b, text: "เพราะใยอาหารถูกดูดซึมเป็นพลังงานให้ลำไส้", feedback: "ร่างกายย่อยและดูดซึมใยอาหารไม่ได้ ใยอาหารจึงอยู่ในกากอาหาร" }
      - { id: c, text: "เพราะใยอาหารทำให้ไม่ต้องดื่มน้ำ", feedback: "ใยอาหารทำงานได้ดีเมื่อดื่มน้ำเพียงพอ" }
    hints:
      - "สิ่งที่ย่อยไม่ได้จะเหลือเป็นกากอาหาร"
      - "อุจจาระที่นุ่มและมีปริมาณพอขับออกง่าย"
    solution: "ใยอาหารย่อยไม่ได้ จึงเพิ่มปริมาณกากอาหารและช่วยให้อุจจาระนุ่ม ร่วมกับการดื่มน้ำ ลำไส้จึงขับถ่ายได้ง่าย"
