problems:
  - id: math.geometry.symmetry-transformations.p001
    topics: [math.geometry.symmetry-transformations]
    difficulty: 1
    type: numeric
    stem: "สี่เหลี่ยมจัตุรัสมีแกนสมมาตรกี่แกน (ตอบเป็นจำนวนแกน)"
    answer: { value: 4, unit: แกน }
    hints:
      - "ลองพับกระดาษรูปจัตุรัสให้สองข้างทับกันสนิท พับได้กี่แบบ"
      - "นอกจากแนวตั้งและแนวนอนแล้ว ลองพับตามเส้นทแยงมุม"
    misconceptions:
      - { match: 2, feedback: "นับแค่แนวตั้งกับแนวนอน จัตุรัสพับตามเส้นทแยงมุมทั้งสองเส้นแล้วทับกันสนิทด้วย" }
    solution: "แกนสมมาตรของจัตุรัสมี 4 แกน คือ เส้นแนวตั้งและแนวนอนที่ผ่านจุดกึ่งกลางของด้าน 2 เส้น และเส้นทแยงมุม 2 เส้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.symmetry-transformations.p002
    topics: [math.geometry.symmetry-transformations]
    difficulty: 1
    type: mcq
    stem: "รูปใด **ไม่มี** แกนสมมาตร"
    choices:
      - { id: a, text: "สี่เหลี่ยมด้านขนานที่ไม่ใช่สี่เหลี่ยมผืนผ้าหรือขนมเปียกปูน", correct: true }
      - { id: b, text: "สามเหลี่ยมหน้าจั่ว", feedback: "เส้นจากยอดลงมาตั้งฉากกับฐานเป็นแกนสมมาตร 1 แกน" }
      - { id: c, text: "สี่เหลี่ยมผืนผ้า", feedback: "สี่เหลี่ยมผืนผ้ามีแกนสมมาตร 2 แกน ผ่านจุดกึ่งกลางของด้านตรงข้าม" }
      - { id: d, text: "วงกลม", feedback: "วงกลมมีแกนสมมาตรนับไม่ถ้วน ทุกเส้นผ่านศูนย์กลางเป็นแกน" }
    hints:
      - "ลองนึกพับแต่ละรูป มีเส้นใดบ้างที่พับแล้วทับกันสนิท"
      - "สี่เหลี่ยมด้านขนานพับตามเส้นทแยงมุมหรือเส้นกลางแล้วทับกันสนิทหรือไม่"
    solution: "สี่เหลี่ยมด้านขนานทั่วไปพับตามเส้นใดก็ไม่ทับกันสนิท จึงไม่มีแกนสมมาตร (แต่มีสมมาตรแบบหมุนอันดับ 2)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.symmetry-transformations.p003
    topics: [math.geometry.symmetry-transformations]
    difficulty: 2
    type: numeric
    stem: "ธงชาติไทยเป็นรูปสี่เหลี่ยมผืนผ้า มีแถบแนวนอนสีแดง ขาว น้ำเงิน ขาว แดง โดยแถบน้ำเงินอยู่ตรงกลางและกว้างเป็นสองเท่าของแถบอื่น ธงชาติไทยมีแกนสมมาตรกี่แกน (ตอบเป็นจำนวนแกน)"
    answer: { value: 2, unit: แกน }
    hints:
      - "พับครึ่งตามแนวนอนผ่านกลางแถบน้ำเงิน สีทับกันตรงหรือไม่"
      - "พับครึ่งตามแนวตั้ง แถบทุกแถบยาวตลอดผืน สีทับกันตรงหรือไม่"
    misconceptions:
      - { match: 1, feedback: "นับแค่แนวนอน พับแนวตั้งผ่านกลางธงสีก็ทับกันตรงด้วย เพราะแถบเป็นแนวนอนยาวตลอดผืน" }
      - { match: 4, feedback: "ธงเป็นสี่เหลี่ยมผืนผ้า ไม่ใช่จัตุรัส พับตามเส้นทแยงมุมแล้วไม่ทับกัน" }
    solution: "แถบสีเรียงสมมาตรบนล่าง (แดง ขาว น้ำเงิน ขาว แดง) จึงพับแนวนอนผ่านกลางแถบน้ำเงินได้ และแถบทุกแถบยาวตลอดจึงพับแนวตั้งผ่านกลางได้ เส้นทแยงมุมใช้ไม่ได้ รวม 2 แกน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.symmetry-transformations.p004
    topics: [math.geometry.symmetry-transformations]
    difficulty: 2
    type: match
    stem: "จับคู่รูปกับจำนวนแกนสมมาตร"
    pairs:
      - { left: "สามเหลี่ยมด้านเท่า", right: "3 แกน" }
      - { left: "สี่เหลี่ยมขนมเปียกปูน (ไม่ใช่จัตุรัส)", right: "2 แกน" }
      - { left: "หกเหลี่ยมด้านเท่ามุมเท่า", right: "6 แกน" }
      - { left: "สี่เหลี่ยมคางหมูหน้าจั่ว", right: "1 แกน" }
      - { left: "สี่เหลี่ยมด้านขนาน (ทั่วไป)", right: "ไม่มีแกนสมมาตร" }
    hints:
      - "รูป n เหลี่ยมด้านเท่ามุมเท่ามี n แกน"
      - "ขนมเปียกปูนพับตามเส้นทแยงมุมได้ แต่พับผ่านจุดกึ่งกลางด้านไม่ได้"
    solution: "สามเหลี่ยมด้านเท่า 3 แกน ขนมเปียกปูน 2 แกน (เส้นทแยงมุม) หกเหลี่ยมด้านเท่า 6 แกน คางหมูหน้าจั่ว 1 แกน สี่เหลี่ยมด้านขนานทั่วไปไม่มี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.symmetry-transformations.p005
    topics: [math.geometry.symmetry-transformations]
    difficulty: 2
    type: mcq
    stem: "เลื่อนขนานจุด $A(5, 1)$ ด้วยเวกเตอร์ $(-3, 4)$ จะได้ $A'$ ที่จุดใด"
    choices:
      - { id: a, text: "$(2, 5)$", correct: true }
      - { id: b, text: "$(8, -3)$", feedback: "เครื่องหมายกลับกัน $-3$ แปลว่าไปทางซ้าย 3 และ $4$ แปลว่าขึ้น 4" }
      - { id: c, text: "$(9, -2)$", feedback: "จับคู่ผิดพิกัด บวก 4 กับพิกัด $x$ และบวก $-3$ กับพิกัด $y$ ต้องใช้ตัวแรกของเวกเตอร์กับพิกัด $x$" }
      - { id: d, text: "$(-15, 4)$", feedback: "คูณพิกัดกับเวกเตอร์ การเลื่อนขนานใช้การบวก" }
    hints:
      - "เวกเตอร์ $(a, b)$ บอกว่าไปทางขวา $a$ และขึ้น $b$"
      - "$(x, y) \\to (x + a, y + b)$"
    solution: "$A' = (5 + (-3),\\ 1 + 4) = (2, 5)$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.symmetry-transformations.p006
    topics: [math.geometry.symmetry-transformations]
    difficulty: 2
    type: numeric
    stem: "หมุนหกเหลี่ยมด้านเท่ามุมเท่ารอบจุดศูนย์กลางเป็นมุมเล็กที่สุดกี่องศา (มากกว่า $0^\\circ$) จึงทับรูปเดิมพอดี (ตอบในหน่วยองศา)"
    answer: { value: 60, unit: องศา }
    hints:
      - "หกเหลี่ยมด้านเท่ามีสมมาตรแบบหมุนอันดับ 6"
      - "แบ่งหนึ่งรอบ $360^\\circ$ เป็น 6 ส่วนเท่ากัน"
    misconceptions:
      - { match: 120, feedback: "$120^\\circ$ ก็ทับรูปเดิม แต่ยังไม่ใช่มุมที่เล็กที่สุด หมุนครึ่งหนึ่งของมุมนี้ก็ทับแล้ว" }
      - { match: 6, feedback: "6 คืออันดับของสมมาตรแบบหมุน ข้อนี้ถามมุมเป็นองศา" }
    solution: "อันดับ 6 จึงหมุนทีละ $360^\\circ \\div 6 = 60^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.symmetry-transformations.p007
    topics: [math.geometry.symmetry-transformations]
    difficulty: 3
    type: mcq
    stem: "สะท้อนจุด $(5, 3)$ ในเส้น $x = 2$ จะได้จุดใด"
    choices:
      - { id: a, text: "$(-1, 3)$", correct: true }
      - { id: b, text: "$(-5, 3)$", feedback: "นั่นคือการสะท้อนในแกน $y$ (เส้น $x = 0$) เส้นกระจกข้อนี้คือ $x = 2$" }
      - { id: c, text: "$(5, 1)$", feedback: "เปลี่ยนพิกัด $y$ แต่เส้น $x = 2$ เป็นเส้นแนวตั้ง จุดต้องพลิกซ้ายขวา" }
      - { id: d, text: "$(2, 3)$", feedback: "นั่นคือจุดบนเส้นกระจก ภาพสะท้อนต้องอยู่อีกฝั่ง ห่างจากเส้นเท่าเดิม" }
    hints:
      - "จุด $(5, 3)$ อยู่ห่างจากเส้น $x = 2$ ทางขวากี่หน่วย"
      - "ภาพสะท้อนอยู่ทางซ้ายของเส้นเป็นระยะเท่ากัน พิกัด $y$ เท่าเดิม"
    solution: "จุดอยู่ทางขวาของเส้น $5 - 2 = 3$ หน่วย ภาพอยู่ทางซ้าย 3 หน่วย คือ $x = 2 - 3 = -1$ ได้ $(-1, 3)$ (ตรงกับสูตร $2k - x = 4 - 5 = -1$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.symmetry-transformations.p008
    topics: [math.geometry.symmetry-transformations]
    difficulty: 3
    type: numeric
    stem: "ภาพแสดงครึ่งหนึ่งของรูปทางซ้ายของแกนสมมาตร ถ้าวาดอีกครึ่งให้สมมาตรครบ รูปเต็มจะมีพื้นที่กี่ตารางหน่วย (ช่องตารางละ 1 ตารางหน่วย)"
    figure: { src: half-figure.svg, alt: "ตารางสี่เหลี่ยมจัตุรัส มีเส้นประแนวตั้งเป็นแกนสมมาตร ทางซ้ายของแกนมีรูปหกเหลี่ยมมุมฉากชิดแกน รูปนี้ประกอบด้วยส่วนล่างกว้าง 3 ช่องสูง 2 ช่อง และส่วนบนกว้าง 2 ช่องสูง 2 ช่องชิดแกน" }
    answer: { value: 20, unit: ตารางหน่วย }
    hints:
      - "นับช่องในครึ่งที่เห็นก่อน"
      - "อีกครึ่งเป็นภาพสะท้อน มีพื้นที่เท่ากัน"
    misconceptions:
      - { match: 10, feedback: "นั่นคือพื้นที่ของครึ่งเดียว ต้องรวมอีกครึ่งที่สะท้อนออกไปด้วย" }
    solution: "ครึ่งที่เห็น: ส่วนล่าง $3 \\times 2 = 6$ ช่อง ส่วนบน $2 \\times 2 = 4$ ช่อง รวม 10 ตารางหน่วย การสะท้อนรักษาพื้นที่ รูปเต็มจึงมี $2 \\times 10 = 20$ ตารางหน่วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.symmetry-transformations.p009
    topics: [math.geometry.symmetry-transformations]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "เมื่อแปลงรูปด้วยการเลื่อนขนาน การสะท้อน หรือการหมุน สิ่งใด **คงเดิมเสมอ** (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ความยาวของด้าน", correct: true }
      - { id: b, text: "ขนาดของมุม", correct: true }
      - { id: c, text: "เส้นที่ขนานกันยังขนานกัน", correct: true }
      - { id: d, text: "ตำแหน่งของรูป", feedback: "การแปลงย้ายรูปไปที่ใหม่ ตำแหน่งจึงเปลี่ยน" }
      - { id: e, text: "ทิศการเรียงจุดยอดตามเข็มนาฬิกา", feedback: "การสะท้อนกลับทิศ จุดที่เรียงตามเข็มจะกลายเป็นทวนเข็ม" }
    hints:
      - "รูปที่ได้เท่ากันทุกประการกับรูปเดิม"
      - "ลองนึกภาพในกระจก มือขวากลายเป็นมือซ้าย"
    solution: "การแปลงทั้งสามแบบรักษาความยาว ขนาดของมุม และการขนาน จึงได้รูปที่เท่ากันทุกประการ แต่ตำแหน่งเปลี่ยน และการสะท้อนกลับทิศการเรียงจุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.symmetry-transformations.p010
    topics: [math.geometry.symmetry-transformations]
    difficulty: 3
    type: mcq
    stem: "การแปลงใดส่งธง F ไปเป็นธง G ในภาพ"
    figure: { src: flags.svg, alt: "ระนาบพิกัด ธง F มีเสาแนวตั้งจาก (1, 3) ถึง (1, 6) ผืนธงเป็นสามเหลี่ยมจุดยอด (1, 6), (3, 5.5), (1, 5) ธง G มีเสาแนวนอนจาก (3, 1) ถึง (6, 1) ผืนธงเป็นสามเหลี่ยมจุดยอด (6, 1), (5.5, 3), (5, 1)" }
    choices:
      - { id: a, text: "สะท้อนในเส้น $y = x$", correct: true }
      - { id: b, text: "หมุน $90^\\circ$ ตามเข็มนาฬิการอบจุดกำเนิด", feedback: "หมุนแบบนี้ $(x, y) \\to (y, -x)$ ส่งโคนเสา $(1, 3)$ ไปที่ $(3, -1)$ ไม่ใช่ $(3, 1)$" }
      - { id: c, text: "สะท้อนในแกน $x$", feedback: "สะท้อนในแกน $x$ ส่ง $(1, 3)$ ไปที่ $(1, -3)$ เสายังตั้งอยู่ แต่ธง G มีเสานอน" }
      - { id: d, text: "เลื่อนขนานด้วยเวกเตอร์ $(2, -2)$", feedback: "การเลื่อนขนานไม่เปลี่ยนทิศของเสา เสาของ F ตั้ง แต่เสาของ G นอน" }
    hints:
      - "เทียบพิกัดจุดที่สมนัยกัน เช่น โคนเสา $(1, 3)$ กับ $(3, 1)$ และยอดเสา $(1, 6)$ กับ $(6, 1)$"
      - "สังเกตว่าพิกัด $x$ กับ $y$ สลับที่กันทุกจุด"
    solution: "ทุกจุดของ F สลับพิกัดได้จุดของ G เช่น $(1, 3) \\to (3, 1)$, $(1, 6) \\to (6, 1)$, $(3, 5.5) \\to (5.5, 3)$ ซึ่งคือ $(x, y) \\to (y, x)$ การสะท้อนในเส้น $y = x$ (ธงพลิกด้าน การหมุนจึงทำไม่ได้)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.symmetry-transformations.p011
    topics: [math.geometry.symmetry-transformations]
    difficulty: 3
    type: mcq
    stem: "หมุนสามเหลี่ยม $PQR$ ในภาพรอบจุด $C(2, 1)$ เป็นมุม $90^\\circ$ ตามเข็มนาฬิกา จุด $R$ จะไปอยู่ที่ใด"
    figure: { src: rotate-question.svg, alt: "ระนาบพิกัด สามเหลี่ยม PQR มีจุดยอด P(3, 1), Q(5, 1) และ R(3, 4) และมีจุด C(2, 1) ทางซ้ายของ P" }
    choices:
      - { id: a, text: "$(5, 0)$", correct: true }
      - { id: b, text: "$(-1, 2)$", feedback: "นั่นคือการหมุนทวนเข็มนาฬิกา ข้อนี้หมุนตามเข็มนาฬิกา" }
      - { id: c, text: "$(4, -3)$", feedback: "นั่นคือการหมุนรอบจุดกำเนิด ต้องหมุนรอบจุด $C(2, 1)$" }
      - { id: d, text: "$(3, -2)$", feedback: "ระยะจาก $C$ ถึง $R$ คือขวา 1 ขึ้น 3 เมื่อหมุนตามเข็ม $90^\\circ$ จะเป็นขวา 3 ลง 1 จาก $C$" }
    hints:
      - "หาตำแหน่งของ $R$ เทียบกับ $C$: ไปทางขวากี่หน่วย ขึ้นกี่หน่วย"
      - "หมุนตามเข็ม $90^\\circ$ ส่ง (ขวา $a$, ขึ้น $b$) ไปเป็น (ขวา $b$, ลง $a$)"
    solution: "$R$ อยู่ห่างจาก $C$ ขวา 1 ขึ้น 3 หมุนตามเข็ม $90^\\circ$ ได้ ขวา 3 ลง 1 จาก $C$ คือ $(2 + 3,\\ 1 - 1) = (5, 0)$ ตรวจ: $CR = CR' = \\sqrt{10}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.symmetry-transformations.p012
    topics: [math.geometry.symmetry-transformations]
    difficulty: 4
    type: mcq
    stem: "ช่างปูกระเบื้องในศาลาวัดต้องการใช้กระเบื้องรูปหลายเหลี่ยมด้านเท่ามุมเท่าแบบเดียวปูให้เต็มพื้นโดยไม่เว้นช่อง กระเบื้องแบบใด **ใช้ไม่ได้**"
    choices:
      - { id: a, text: "ห้าเหลี่ยมด้านเท่า (มุมภายใน $108^\\circ$)", correct: true }
      - { id: b, text: "หกเหลี่ยมด้านเท่า (มุมภายใน $120^\\circ$)", feedback: "สามรูปมาพบกันที่จุดหนึ่งได้ $3 \\times 120^\\circ = 360^\\circ$ พอดี จึงปูได้ เหมือนรังผึ้ง" }
      - { id: c, text: "สามเหลี่ยมด้านเท่า (มุมภายใน $60^\\circ$)", feedback: "หกรูปมาพบกันได้ $6 \\times 60^\\circ = 360^\\circ$ จึงปูได้" }
      - { id: d, text: "สี่เหลี่ยมจัตุรัส (มุมภายใน $90^\\circ$)", feedback: "สี่รูปมาพบกันได้ $4 \\times 90^\\circ = 360^\\circ$ จึงปูได้" }
    hints:
      - "ที่จุดที่มุมกระเบื้องมาพบกัน มุมรวมต้องเป็น $360^\\circ$ พอดี"
      - "ตรวจว่า $360$ หารด้วยมุมภายในลงตัวหรือไม่"
    solution: "$360 \\div 108 \\approx 3.33$ ไม่ลงตัว สามรูปได้ $324^\\circ$ เหลือช่อง สี่รูปเกิน $360^\\circ$ จึงซ้อนกัน ห้าเหลี่ยมด้านเท่าจึงปูเองไม่ได้ ส่วน $360 \\div 60 = 6$, $360 \\div 90 = 4$, $360 \\div 120 = 3$ ลงตัวทั้งหมด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.symmetry-transformations.p013
    topics: [math.geometry.symmetry-transformations]
    difficulty: 4
    type: numeric
    stem: "สะท้อนจุด $(2, 5)$ ในเส้น $x = 1$ แล้วสะท้อนภาพที่ได้ในเส้น $x = 4$ ต่อ จุดสุดท้ายมีพิกัด $x$ เท่าใด"
    answer: { value: 8 }
    hints:
      - "สะท้อนในเส้น $x = k$: $(x, y) \\to (2k - x, y)$ ทำทีละครั้ง"
      - "สะท้อนครั้งแรกได้ $(0, 5)$ แล้วสะท้อน $(0, 5)$ ในเส้น $x = 4$"
    misconceptions:
      - { match: 2, feedback: "สะท้อนสองครั้งในเส้นเดียวกันจึงจะกลับที่เดิม ข้อนี้เป็นเส้นสองเส้นที่ขนานกัน ผลคือการเลื่อนขนาน" }
      - { match: 5, feedback: "เลื่อนไปแค่ระยะระหว่างเส้น (3 หน่วย) การสะท้อนในเส้นขนานสองเส้นเลื่อนจุดไปเป็นสองเท่าของระยะนั้น" }
    solution: "ครั้งแรก $x = 2(1) - 2 = 0$ ได้ $(0, 5)$ ครั้งที่สอง $x = 2(4) - 0 = 8$ ได้ $(8, 5)$ ผลรวมคือเลื่อนขนานไปทางขวา $2 \\times (4 - 1) = 6$ หน่วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.symmetry-transformations.p014
    topics: [math.geometry.symmetry-transformations]
    difficulty: 4
    type: mcq
    stem: "ผ้าซิ่นผืนหนึ่งมีลายแถบ ลายที่ 2 เป็นภาพสะท้อนของลายที่ 1 ในเส้นแนวตั้ง $m_1$ และลายที่ 3 เป็นภาพสะท้อนของลายที่ 2 ในเส้นแนวตั้ง $m_2$ ซึ่งขนานกับ $m_1$ และห่าง 5 cm การแปลงใดส่งลายที่ 1 ไปเป็นลายที่ 3 ได้ในครั้งเดียว"
    choices:
      - { id: a, text: "เลื่อนขนานในแนวนอน 10 cm", correct: true }
      - { id: b, text: "เลื่อนขนานในแนวนอน 5 cm", feedback: "การสะท้อนในเส้นขนานสองเส้นเลื่อนไปเป็นสองเท่าของระยะระหว่างเส้น" }
      - { id: c, text: "สะท้อนในเส้นแนวตั้งเส้นเดียว", feedback: "สะท้อนสองครั้งทำให้ทิศกลับไปกลับมา ลายที่ 3 หันทางเดียวกับลายที่ 1 จึงไม่ใช่การสะท้อนครั้งเดียว" }
      - { id: d, text: "หมุน $180^\\circ$", feedback: "การหมุนเกิดจากการสะท้อนในสองเส้นที่ตัดกัน แต่ $m_1$ ขนานกับ $m_2$" }
    hints:
      - "ทิศของลายกลับสองครั้ง ลายที่ 3 จึงหันทางเดียวกับลายที่ 1"
      - "ถ้าจุดอยู่บนเส้น $m_1$ หลังสะท้อนสองครั้งจะไปไกลเท่าไร"
    solution: "สะท้อนในเส้นขนานสองเส้นที่ห่างกัน $d$ ได้ผลเท่ากับเลื่อนขนาน $2d$ ในแนวตั้งฉากกับเส้น คือเลื่อนในแนวนอน $2 \\times 5 = 10$ cm"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.symmetry-transformations.p015
    topics: [math.geometry.symmetry-transformations]
    difficulty: 4
    type: mcq
    stem: "ขยายจุด $(4, -6)$ จากจุดกำเนิดด้วยตัวประกอบสเกล $-\\tfrac{1}{2}$ จะได้จุดใด"
    choices:
      - { id: a, text: "$(-2, 3)$", correct: true }
      - { id: b, text: "$(2, -3)$", feedback: "นั่นคือตัวประกอบสเกล $\\tfrac12$ เครื่องหมายลบทำให้ภาพไปอยู่อีกฝั่งของจุดกำเนิด" }
      - { id: c, text: "$(-8, 12)$", feedback: "คูณด้วย $-2$ แทน $-\\tfrac12$ ตัวประกอบสเกลนี้ทำให้ระยะเหลือครึ่งหนึ่ง" }
      - { id: d, text: "$(3.5, -6.5)$", feedback: "บวก $-\\tfrac12$ เข้าไป การขยายใช้การคูณพิกัดทั้งสอง" }
    hints:
      - "ขยายจากจุดกำเนิดด้วยตัวประกอบสเกล $k$: $(x, y) \\to (kx, ky)$"
      - "$k$ เป็นลบ ภาพจะอยู่อีกฝั่งของจุดกำเนิด"
    solution: "$\\left(-\\tfrac12 \\times 4,\\ -\\tfrac12 \\times (-6)\\right) = (-2, 3)$ ภาพอยู่อีกฝั่งของจุดกำเนิด ห่างเป็นครึ่งหนึ่งของระยะเดิม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.symmetry-transformations.p016
    topics: [math.geometry.symmetry-transformations]
    difficulty: 4
    type: numeric
    stem: "ด้าน $AB$ ของสามเหลี่ยมยาว $5\\ \\mathrm{cm}$ ขยายสามเหลี่ยมจากจุด $O$ ด้วยตัวประกอบสเกล $-2$ ด้าน $A'B'$ ยาวกี่เซนติเมตร (ตอบในหน่วย cm)"
    answer: { value: 10, unit: cm }
    hints:
      - "ความยาวทุกด้านคูณด้วย $|k|$"
      - "เครื่องหมายลบบอกแค่ว่าภาพอยู่อีกฝั่งของ $O$"
    misconceptions:
      - { match: -10, feedback: "ความยาวติดลบไม่ได้ ใช้ $|k| = 2$" }
      - { match: 2.5, feedback: "หารด้วย 2 แทนการคูณ ตัวประกอบสเกล $-2$ ทำให้ภาพใหญ่ขึ้นสองเท่า" }
    solution: "$A'B' = |{-2}| \\times 5 = 10\\ \\mathrm{cm}$ และ $A'B'$ ขนานกับ $AB$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.symmetry-transformations.p017
    topics: [math.geometry.symmetry-transformations]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "สี่เหลี่ยมผืนผ้า (ที่ไม่ใช่จัตุรัส) ทับรูปเดิมพอดีหลังการแปลงใด (เลือกทุกข้อที่ถูก การหมุนใช้จุดตัดของเส้นทแยงมุมเป็นจุดหมุน)"
    choices:
      - { id: a, text: "หมุน $180^\\circ$", correct: true }
      - { id: b, text: "สะท้อนในเส้นที่ผ่านจุดกึ่งกลางของด้านยาวทั้งสอง", correct: true }
      - { id: c, text: "สะท้อนในเส้นที่ผ่านจุดกึ่งกลางของด้านสั้นทั้งสอง", correct: true }
      - { id: d, text: "หมุน $90^\\circ$", feedback: "หมุน $90^\\circ$ ด้านยาวจะไปอยู่แนวเดียวกับด้านสั้นเดิม ไม่ทับกัน (ได้เฉพาะจัตุรัส)" }
      - { id: e, text: "สะท้อนในเส้นทแยงมุม", feedback: "เส้นทแยงมุมไม่ตั้งฉากกับด้าน มุมของผืนผ้าจะไม่ไปทับมุมเดิม" }
    hints:
      - "สี่เหลี่ยมผืนผ้ามีแกนสมมาตร 2 แกน"
      - "สมมาตรแบบหมุนอันดับ 2 หมุนทีละกี่องศา"
    solution: "ผืนผ้ามีแกนสมมาตร 2 แกน (ผ่านจุดกึ่งกลางของด้านคู่ตรงข้าม) และสมมาตรแบบหมุนอันดับ 2 ($180^\\circ$) ส่วนหมุน $90^\\circ$ และสะท้อนในเส้นทแยงมุมใช้ได้กับจัตุรัสเท่านั้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.symmetry-transformations.p018
    topics: [math.geometry.symmetry-transformations]
    difficulty: 5
    type: mcq
    stem: "การแปลงใด **ไม่** รักษาระยะทางระหว่างจุด"
    choices:
      - { id: a, text: "$(x, y) \\to (2x, y)$", correct: true }
      - { id: b, text: "$(x, y) \\to (x + 3, y - 1)$", feedback: "นี่คือการเลื่อนขนาน ทุกจุดเลื่อนเท่ากัน ระยะระหว่างจุดเท่าเดิม" }
      - { id: c, text: "$(x, y) \\to (-y, x)$", feedback: "นี่คือการหมุน $90^\\circ$ ทวนเข็มนาฬิการอบจุดกำเนิด ซึ่งรักษาระยะ" }
      - { id: d, text: "$(x, y) \\to (x, -y)$", feedback: "นี่คือการสะท้อนในแกน $x$ ซึ่งรักษาระยะ" }
    hints:
      - "ลองใช้จุด $(0, 0)$ และ $(1, 0)$ ซึ่งห่างกัน 1 หน่วย แล้วแปลงทั้งสองจุด"
      - "ดูว่าหลังแปลงยังห่างกัน 1 หน่วยหรือไม่"
    solution: "$(0, 0) \\to (0, 0)$ และ $(1, 0) \\to (2, 0)$ ระยะเปลี่ยนจาก 1 เป็น 2 การยืดในแนวนอนจึงไม่รักษาระยะ ส่วนอีกสามข้อเป็นการเลื่อนขนาน การหมุน และการสะท้อน ซึ่งรักษาระยะ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.symmetry-transformations.p019
    topics: [math.geometry.symmetry-transformations]
    difficulty: 5
    type: numeric
    stem: "สามเหลี่ยมมีพื้นที่ $4\\ \\mathrm{cm^2}$ ขยายจากจุด $O$ ด้วยตัวประกอบสเกล $-3$ สามเหลี่ยมภาพมีพื้นที่กี่ตารางเซนติเมตร (ตอบในหน่วย cm²)"
    answer: { value: 36, unit: "cm²" }
    hints:
      - "ความยาวทุกด้านคูณ $|k| = 3$"
      - "พื้นที่คูณ $k^2$"
    misconceptions:
      - { match: 12, feedback: "คูณพื้นที่ด้วย 3 แต่ความยาวคูณ 3 ทั้งฐานและสูง พื้นที่จึงคูณ $3^2 = 9$" }
      - { match: -36, feedback: "พื้นที่ติดลบไม่ได้ $k^2 = (-3)^2 = 9$ เป็นบวก" }
    solution: "พื้นที่ใหม่ $= k^2 \\times 4 = (-3)^2 \\times 4 = 9 \\times 4 = 36\\ \\mathrm{cm^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true
