id: health.safety.medicine-use
subject: health
title: { th: ยาสามัญประจำบ้านและการใช้ยาอย่างถูกวิธี, en: "Household remedies and using medicines safely" }
summary: ยาสามัญประจำบ้านคืออะไร การอ่านฉลากยาและวันสิ้นอายุ ยาเสื่อมสภาพ การเก็บยา หลักใช้ยา 5 ถูก และการใช้ยาตามคำแนะนำของผู้ใหญ่ แพทย์ หรือเภสัชกร
difficulty: 2
minutes: 30
prerequisites: [health.safety.signs-fire, health.disease.illness-symptoms-care]
encompasses:
  - { id: health.safety.signs-fire, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: อ่านฉลากยาสามัญประจำบ้าน
    src: medicine-label.svg
    alt: "ฉลากยาตัวอย่างสมมติ แถบสีเขียวด้านบนเขียนว่า ยาสามัญประจำบ้าน ชื่อยา ยาเม็ดแก้แพ้ ลดน้ำมูก คลอร์เฟนิรามีน ตัวยาสำคัญ คลอร์เฟนิรามีน มาลีเอต 2 มิลลิกรัมต่อ 1 เม็ด สรรพคุณ บรรเทาอาการแพ้ เช่น ลมพิษ น้ำมูกไหล ขนาดและวิธีใช้ อ่านในเอกสารกำกับยาหรือถามเภสัชกร คำเตือน 1 ไม่ควรใช้ติดต่อกันนานเกิน 7 วัน 2 ยานี้อาจทำให้ง่วงซึม ไม่ควรขับขี่ยานพาหนะ การเก็บรักษา เก็บในที่แห้ง ไม่โดนแสงแดด ไม่เกิน 30 องศาเซลเซียส เก็บให้พ้นมือเด็ก กรอบล่างมี Reg. No. 1A 0000/69 (เลขสมมติ) Lot No. 2690315 MFG. 03/2569 และ EXP. 08/2571"
    caption: "ฉลากสมมติสำหรับฝึกอ่าน คำเตือนและวิธีเก็บนำมาจากประกาศกระทรวงสาธารณสุขเรื่องยาสามัญประจำบ้าน พ.ศ. 2568"
  - type: worked-example
    title: ยากล่องนี้ใช้ได้ไหม
    problem: "วันนี้วันที่ 20 สิงหาคม 2571 น้องมีน้ำมูกไหลจากการแพ้ฝุ่น แม่หยิบยาตามฉลากในภาพขึ้นมา ยานี้ใช้ได้หรือไม่ และต้องตรวจอะไรบ้าง"
    steps:
      - text: "ตรวจว่าเป็นยาที่ตรงอาการ: สรรพคุณเขียนว่าบรรเทาอาการแพ้ เช่น น้ำมูกไหล จึงตรงอาการ"
        why: "หลักถูกโรค"
      - text: "ตรวจวันสิ้นอายุ: EXP. 08/2571 บอกเฉพาะเดือนและปี จึงใช้ได้ถึงวันสุดท้ายของเดือน คือ 31 สิงหาคม 2571"
      - text: "เทียบกับวันนี้: 20 สิงหาคม 2571 ยังไม่ถึง 31 สิงหาคม จึงยังไม่หมดอายุ"
      - text: "สังเกตลักษณะยา: เม็ดยาต้องสีสม่ำเสมอ ไม่มีจุดด่าง ไม่แตก ไม่ติดกัน"
        why: "ยาอาจเสื่อมก่อนวันหมดอายุถ้าเก็บไม่ดี"
      - text: "แม่อ่านขนาดและวิธีใช้สำหรับเด็กในเอกสารกำกับยาหรือถามเภสัชกร และจำคำเตือนว่ายาอาจทำให้ง่วง"
    answer: "ใช้ได้ ถ้ายาไม่มีลักษณะเสื่อม โดยแม่เป็นคนอ่านขนาดยาสำหรับเด็กและให้ยาเอง"
  - { type: check, problem: health.safety.medicine-use.p005, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: figure
    title: สังเกตยาก่อนใช้
    src: medicine-check.svg
    alt: "ภาพสามช่องเปรียบเทียบยาปกติกับยาเสื่อมสภาพ ช่องยาเม็ด ยาปกติสีสม่ำเสมอ ผิวเรียบ ยาเสื่อมสีเปลี่ยน มีจุดด่าง แตกร้าว ช่องยาแคปซูล ยาปกติเปลือกเรียบ ยาเสื่อมบวม เยิ้ม ติดกัน ช่องยาน้ำใส ยาปกติใส ไม่มีตะกอน ยาเสื่อมขุ่น มีตะกอน"
    caption: "ลักษณะยาเสื่อมตามคำแนะนำของคณะเภสัชศาสตร์ มหาวิทยาลัยมหิดล"
  - type: worked-example
    title: นับวันตามคำเตือน
    problem: "ฉลากเตือนว่า \"ไม่ควรใช้ติดต่อกันนานเกิน 7 วัน\" ถ้าเริ่มใช้ยาวันที่ 3 และใช้ทุกวัน วันสุดท้ายที่ยังไม่เกิน 7 วันคือวันที่เท่าไร"
    steps:
      - text: "นับวันที่ใช้ยา: วันที่ 3 เป็นวันแรก (วันที่ 1 ของการใช้)"
      - text: "วันที่ 7 ของการใช้ยาคือ 3 + 7 − 1 = 9"
        why: "ต้องลบ 1 เพราะนับวันที่ 3 เป็นวันแรกไปแล้ว ถ้าบวก 7 ตรง ๆ จะได้วันที่ 10 ซึ่งเป็นวันที่ 8 ของการใช้"
      - text: "ตรวจด้วยการนับ: 3, 4, 5, 6, 7, 8, 9 รวม 7 วัน"
      - text: "ถ้าใช้ครบแล้วอาการยังไม่ดีขึ้น ให้ผู้ใหญ่พาไปพบแพทย์หรือเภสัชกร ไม่ใช้ยาต่อเอง"
    answer: "วันที่ 9"
  - { type: check, problem: health.safety.medicine-use.p011 }
glossary:
  - { term: ยาสามัญประจำบ้าน, definition: "ยาที่กระทรวงสาธารณสุขประกาศให้ประชาชนใช้บรรเทาอาการเจ็บป่วยเล็กน้อยได้เอง ฉลากมีคำว่า ยาสามัญประจำบ้าน ในกรอบสีเขียว" }
  - { term: สรรพคุณ, definition: "ประโยชน์ของยา บอกว่ายาใช้บรรเทาหรือรักษาอาการอะไร" }
  - { term: วันสิ้นอายุ (EXP.), definition: "วันสุดท้ายที่ยายังมีคุณภาพตามมาตรฐาน ถ้าบอกเฉพาะเดือนและปี ให้นับวันสุดท้ายของเดือนนั้น" }
  - { term: ยาเสื่อมสภาพ, definition: "ยาที่รูปร่าง สี กลิ่น หรือคุณภาพเปลี่ยนไป อาจไม่ได้ผลหรือเป็นอันตราย แม้ยังไม่ถึงวันหมดอายุ" }
  - { term: เภสัชกร, definition: "ผู้เชี่ยวชาญด้านยา อยู่ประจำร้านยาและโรงพยาบาล ให้คำแนะนำการใช้ยา" }
flashcards:
  - { front: "หลักใช้ยา 5 ถูกมีอะไรบ้าง", back: "ถูกคน ถูกโรค ถูกขนาด ถูกเวลา ถูกวิธี" }
  - { front: "EXP. 08/2571 หมายความว่าอย่างไร", back: "ยาใช้ได้ถึงวันที่ 31 สิงหาคม 2571" }
  - { front: "ไม่ควรเก็บยาไว้ที่ไหน", back: "ในรถ ห้องน้ำ ห้องครัว ที่โดนแดด และที่เด็กหยิบถึง" }
  - { front: "ใช้ยาแล้วผื่นขึ้น ปากบวม หายใจลำบาก ทำอย่างไร", back: "หยุดยา บอกผู้ใหญ่ รีบไปพบแพทย์ อาการหนักโทร 1669" }
