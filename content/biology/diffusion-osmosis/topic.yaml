id: biology.cells.diffusion-osmosis
subject: biology
title: { th: การแพร่และออสโมซิส, en: "Diffusion and osmosis" }
summary: การแพร่ของอนุภาคจากความเข้มข้นสูงไปต่ำ ปัจจัยที่ทำให้แพร่เร็วขึ้น ออสโมซิสของน้ำผ่านเยื่อเลือกผ่าน หลักฐานจากการทดลอง และตัวอย่างในเซลล์และชีวิตประจำวัน
difficulty: 2.8
minutes: 30
prerequisites: [biology.cells.cell-basics]
encompasses:
  - { id: biology.cells.cell-basics, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: การแพร่ของด่างทับทิมในน้ำ
    src: diffusion.svg
    alt: "บีกเกอร์น้ำ 3 ใบเรียงตามเวลา ใบที่ 1 เริ่มต้น อนุภาคสีม่วงรวมกันเป็นกองที่ก้นบีกเกอร์ ใบที่ 2 ผ่านไปสักพัก อนุภาคกระจายขึ้นมาจากก้น ยังหนาแน่นที่ก้นมากกว่าด้านบน ใบที่ 3 สมดุลของการแพร่ อนุภาคกระจายเท่า ๆ กันทั่วทั้งบีกเกอร์"
    caption: "อนุภาคเคลื่อนจากบริเวณที่มีความเข้มข้นสูงไปต่ำ จนกระจายเท่ากันทุกที่ (วาดโดยทีมคลังรู้)"
  - type: figure
    title: การทดลองออสโมซิสด้วยถุงเซลโลเฟน
    src: osmosis-bag.svg
    alt: "ภาพ 2 ช่อง ถุงเซลโลเฟนบรรจุน้ำเชื่อม (อนุภาคน้ำตาลสีส้มขนาดใหญ่) ต่อกับหลอดแก้วตั้งขึ้น จุ่มอยู่ในบีกเกอร์น้ำเปล่าที่มีอนุภาคน้ำสีน้ำเงินขนาดเล็ก ช่องที่ 1 เริ่มต้น ระดับของเหลวในหลอดแก้วอยู่ที่เส้นประระดับเริ่มต้น ช่องที่ 2 ผ่านไป 30 นาที ลูกศรสีน้ำเงินแสดงน้ำเคลื่อนเข้าถุง ถุงพองขึ้นเล็กน้อย และระดับของเหลวในหลอดแก้วสูงกว่าเส้นระดับเริ่มต้นมาก อนุภาคน้ำตาลยังอยู่ในถุงทั้งหมด"
    caption: "น้ำเคลื่อนเข้าถุงที่เข้มข้นกว่า ส่วนน้ำตาลผ่านเยื่อเลือกผ่านออกมาไม่ได้ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ทำนายทิศทางของน้ำ
    problem: "หั่นมะละกอดิบเป็นแท่งยาวเท่ากัน 2 แท่ง แท่ง ก แช่น้ำเปล่า แท่ง ข แช่น้ำเกลือเข้มข้น ผ่านไป 1 ชั่วโมง แต่ละแท่งจะเปลี่ยนไปอย่างไร"
    steps:
      - text: "เทียบความเข้มข้น: น้ำเปล่าเจือจางกว่าในเซลล์มะละกอ ส่วนน้ำเกลือเข้มข้นกว่าในเซลล์"
      - text: "แท่ง ก: น้ำเคลื่อนไปหาด้านที่เข้มข้นกว่า คือเข้าเซลล์ เซลล์เต่ง แท่งแข็งกรอบขึ้นและหนักขึ้นเล็กน้อย"
        why: "ออสโมซิสคือน้ำเคลื่อนผ่านเยื่อหุ้มเซลล์ไปหาด้านที่เข้มข้นกว่า"
      - text: "แท่ง ข: น้ำออกจากเซลล์ไปหาน้ำเกลือ เซลล์หดตัว แท่งนิ่ม งอได้ และเบาลง"
    answer: "แท่ง ก แข็งกรอบและหนักขึ้น แท่ง ข นิ่มลงและเบาลง"
  - { type: check, problem: biology.cells.diffusion-osmosis.p005, prompt: "ใช้เหตุผลเดียวกัน ถามว่าน้ำเข้าหรือออกจากเซลล์" }
  - type: worked-example
    title: คำนวณร้อยละการเปลี่ยนแปลงมวล
    problem: "แท่งมันฝรั่งหนัก 3.20 กรัม แช่ในสารละลายหนึ่ง 30 นาที แล้วหนัก 3.52 กรัม มวลเปลี่ยนไปร้อยละเท่าไร และสารละลายนี้เข้มข้นกว่าหรือเจือจางกว่าในเซลล์"
    steps:
      - text: "มวลเปลี่ยน $= 3.52 - 3.20 = 0.32$ กรัม (เพิ่มขึ้น)"
      - text: "ร้อยละ $= \\frac{0.32}{3.20} \\times 100 = 10\\%$"
        why: "หารด้วยมวลก่อนแช่ เพื่อเทียบแท่งที่มีมวลเริ่มต้นต่างกันได้"
      - text: "มวลเพิ่ม แปลว่าน้ำเข้าเซลล์ สารละลายจึงเจือจางกว่าในเซลล์"
    answer: "มวลเพิ่มขึ้น 10% สารละลายเจือจางกว่าในเซลล์มันฝรั่ง"
  - { type: check, problem: biology.cells.diffusion-osmosis.p008, prompt: "ถามว่าอนุภาคใดผ่านถุงได้ และน้ำไปทางไหน" }
glossary:
  - { term: การแพร่, definition: "การเคลื่อนที่ของอนุภาคของสารจากบริเวณที่มีความเข้มข้นสูงไปยังบริเวณที่มีความเข้มข้นต่ำ" }
  - { term: สมดุลของการแพร่, definition: "สภาพที่ความเข้มข้นเท่ากันทุกที่ อนุภาคยังเคลื่อนที่แต่ไปทุกทิศเท่ากัน" }
  - { term: ออสโมซิส, definition: "การแพร่ของน้ำผ่านเยื่อเลือกผ่าน จากด้านที่เจือจาง (น้ำมาก) ไปด้านที่เข้มข้น (น้ำน้อย)" }
  - { term: เยื่อเลือกผ่าน, definition: "เยื่อที่ยอมให้อนุภาคบางชนิด เช่น น้ำ ผ่านได้ แต่อนุภาคใหญ่ เช่น น้ำตาล ผ่านไม่ได้ เช่น เยื่อหุ้มเซลล์ ถุงเซลโลเฟน" }
  - { term: ความเข้มข้น, definition: "ปริมาณของสารที่ละลายอยู่ในสารละลายปริมาณหนึ่ง" }
flashcards:
  - { front: "การแพร่ไปทิศใด", back: "จากความเข้มข้นสูงไปต่ำ จนถึงสมดุล" }
  - { front: "ออสโมซิสคืออะไร", back: "การแพร่ของน้ำผ่านเยื่อเลือกผ่าน ไปหาด้านที่เข้มข้นกว่า" }
  - { front: "ผักแช่น้ำเกลือเข้มข้นจะเป็นอย่างไร", back: "น้ำออกจากเซลล์ เซลล์หด ผักเหี่ยวนิ่ม" }
  - { front: "3 สิ่งที่ทำให้การแพร่เร็วขึ้น", back: "อุณหภูมิสูง ความเข้มข้นต่างกันมาก ระยะทางสั้น" }
