  - id: phy.fric.p019
    topics: [physics.dynamics.friction]
    difficulty: 4
    type: numeric
    stem: "รถกระบะบรรทุกลังผลไม้ไว้ที่กระบะท้ายโดยไม่ได้ผูก สัมประสิทธิ์ความเสียดทานสถิตระหว่างลังกับพื้นกระบะเป็น $0.3$ รถเร่งได้มากที่สุดเท่าใดโดยลังไม่ไถล ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย m/s²)"
    answer: { value: 2.94, tolerance: 0.02, unit: m/s² }
    hints:
      - "แรงเสียดทานสถิตเป็นแรงเดียวในแนวราบที่ทำให้ลังเร่งตามรถ"
      - "$\\mu_s mg = ma_{\\max}$"
    misconceptions:
      - { match: 0.3, feedback: "นั่นคือสัมประสิทธิ์ ยังต้องคูณ $g$" }
      - { match: 32.67, feedback: "ดูเหมือนนำ $g$ หารด้วย $\\mu_s$ ต้องคูณ $a_{\\max} = \\mu_s g$" }
    solution: "$a_{\\max} = \\mu_s g = 0.3 \\times 9.8 = 2.94\\ \\mathrm{m/s^2}$ ไม่ขึ้นกับมวลของลัง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.fric.p020
    topics: [physics.dynamics.friction]
    difficulty: 5
    type: numeric
    stem: "ผลักกล่องให้ไถลบนพื้นราบแล้วปล่อยมือ กล่องไถลไปได้ $4\\ \\mathrm{m}$ ในเวลา $2\\ \\mathrm{s}$ จนหยุด สมมติว่ากล่องหน่วงด้วยความเร่งคงตัว สัมประสิทธิ์ความเสียดทานจลน์เป็นเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลข ไม่มีหน่วย ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 0.204, tolerance: 0.005 }
    hints:
      - "หาความเร็วต้นจาก $s = \\dfrac{(u + v)t}{2}$ โดย $v = 0$"
      - "หาขนาดความเร่ง $a = \\dfrac{u}{t}$"
      - "ขณะไถลเอง $a = \\mu_k g$"
    misconceptions:
      - { match: 0.102, feedback: "ดูเหมือนใช้ $a = \\tfrac{s}{t^2}$ ลืมว่า $s = \\tfrac12 at^2$ ต้องได้ $a = \\tfrac{2s}{t^2}$" }
      - { match: 2, feedback: "นั่นคือขนาดของความเร่ง ($\\mathrm{m/s^2}$) ยังต้องหารด้วย $g$" }
    solution: "$4 = \\dfrac{u \\times 2}{2}$ ได้ $u = 4\\ \\mathrm{m/s}$ ความเร่ง $a = \\dfrac{4}{2} = 2\\ \\mathrm{m/s^2}$ ดังนั้น $\\mu_k = \\dfrac{a}{g} = \\dfrac{2}{9.8} \\approx 0.20$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.fric.p021
    topics: [physics.dynamics.friction]
