  - id: math.roc.p020
    topics: [math.calculus.rate-of-change]
    difficulty: 5
    type: numeric
    stem: "คราบน้ำมันบนผิวน้ำแผ่เป็นวงกลม พื้นที่คือ $A(r) = \\pi r^2$ ตารางเซนติเมตร เมื่อรัศมี $r$ เซนติเมตร หาอัตราการเปลี่ยนแปลงขณะหนึ่งของพื้นที่เทียบกับรัศมีเมื่อ $r = 3$ (ตอบทศนิยม 2 ตำแหน่ง ในหน่วยตารางเซนติเมตรต่อเซนติเมตร)"
    answer: { value: 18.85, tolerance: 0.1, unit: cm²/cm }
    hints:
      - "ใช้ $\\displaystyle\\lim_{h \\to 0} \\frac{A(3 + h) - A(3)}{h}$"
      - "$A(3 + h) - A(3) = \\pi(6h + h^2)$ หารด้วย $h$ แล้วให้ $h \\to 0$"
    misconceptions:
      - { match: 28.27, feedback: "นั่นคือพื้นที่ $A(3) = 9\\pi$ โจทย์ถามว่าพื้นที่เปลี่ยนเร็วแค่ไหน ไม่ใช่พื้นที่เท่าไร" }
      - { match: 9.42, feedback: "ดูเหมือนได้ $\\pi r = 3\\pi$ ลองกระจาย $(3 + h)^2 = 9 + 6h + h^2$ อีกครั้ง พจน์ที่เหลือคือ $6\\pi$" }
    solution: "$\\dfrac{\\pi(3 + h)^2 - 9\\pi}{h} = \\dfrac{\\pi(6h + h^2)}{h} = \\pi(6 + h) \\to 6\\pi \\approx 18.85$ ตารางเซนติเมตรต่อเซนติเมตร (เท่ากับเส้นรอบวง $2\\pi r$ พอดี)"
    license: CC-BY-SA-4.0
    ai_assisted: true
