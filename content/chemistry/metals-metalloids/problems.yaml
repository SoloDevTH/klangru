problems:
  - id: chemistry.descriptive.metals-metalloids.p001
    topics: [chemistry.descriptive.metals-metalloids]
    difficulty: 1
    type: mcq
    stem: 'โลหะแอลคาไลในหมู่ 1 ชนิดใดทำปฏิกิริยากับน้ำรุนแรงที่สุดในบรรดาตัวเลือก'
    choices:
      - { id: a, text: 'ลิเทียม (Li)', feedback: 'ลิเทียมทำปฏิกิริยากับน้ำได้ แต่ช้ากว่าโลหะที่อยู่ล่างลงไปในหมู่เดียวกัน' }
      - { id: b, text: 'โซเดียม (Na)', feedback: 'โซเดียมรุนแรงกว่าลิเทียม แต่ยังไม่รุนแรงที่สุดในตัวเลือก' }
      - { id: c, text: 'โพแทสเซียม (K)', correct: true, feedback: 'ถูก ในหมู่ 1 ยิ่งลงล่างโลหะยิ่งว่องไว อิเล็กตรอนวงนอกสุดอยู่ไกลนิวเคลียสจึงหลุดได้ง่าย' }
      - { id: d, text: 'เฮเลียม (He)', feedback: 'เฮเลียมเป็นแก๊สมีตระกูล ไม่ใช่โลหะแอลคาไลและไม่ทำปฏิกิริยากับน้ำ' }
    hints:
      - 'ดูว่าธาตุใดอยู่ต่ำที่สุดในหมู่ 1 ของตัวเลือก'
      - 'ยิ่งอยู่ล่างลงไปในหมู่ อิเล็กตรอนวงนอกสุดยิ่งอยู่ห่างนิวเคลียสและหลุดง่าย'
    solution: 'ความว่องไวของโลหะแอลคาไลเพิ่มขึ้นตามหมู่ลงไป โพแทสเซียมอยู่ต่ำกว่าโซเดียมและลิเทียม จึงทำปฏิกิริยากับน้ำรุนแรงกว่า โลหะเหล่านี้ต้องเก็บในน้ำมันและไม่สัมผัสน้ำโดยตรง'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.metals-metalloids.p002
    topics: [chemistry.descriptive.metals-metalloids]
    difficulty: 1
    type: mcq
    stem: 'กระป๋องเครื่องดื่มอะลูมิเนียมส่วนใหญ่ผลิตจากวัสดุใดเพื่อประหยัดพลังงานมากที่สุด'
    choices:
      - { id: a, text: 'การถลุงแร่บอกไซต์ใหม่ทุกครั้ง', feedback: 'การผลิตจากแร่ใหม่ต้องใช้ไฟฟ้ามาก เพราะต้องแยกออกซิเจนออกจาก Al₂O₃ ก่อน' }
      - { id: b, text: 'การรีไซเคิลอะลูมิเนียมที่ใช้แล้ว', correct: true, feedback: 'ถูก หลอมโลหะที่ใช้แล้วใช้พลังงานน้อยกว่าการแยกอะลูมิเนียมจากแร่มาก' }
      - { id: c, text: 'การนำเหล็กมาชุบอะลูมิเนียม', feedback: 'การชุบไม่ได้ผลิตอะลูมิเนียม และไม่ประหยัดพลังงานเป็นพิเศษ' }
      - { id: d, text: 'การนำซิลิคอนมาผสม', feedback: 'ซิลิคอนไม่ใช่วัตถุดิบหลักของอะลูมิเนียมกระป๋อง' }
    hints:
      - 'คิดว่าวิธีใดต้องใช้ไฟฟ้าน้อยที่สุดเมื่อเทียบกับการสกัดจากแร่'
      - 'โลหะที่ผ่านการใช้งานแล้วยังคงเป็นอะลูมิเนียมอยู่ จึงหลอมใหม่ได้'
    solution: 'การแยกอะลูมิเนียมจากแร่ด้วยอิเล็กโทรไลซิสใช้พลังงานไฟฟ้ามาก ส่วนการหลอมเศษอะลูมิเนียมใช้พลังงานน้อยกว่ามากจึงนิยมรีไซเคิล'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.metals-metalloids.p003
    topics: [chemistry.descriptive.metals-metalloids]
    difficulty: 2
    type: numeric
    stem: 'โรงหลอมอะลูมิเนียมแห่งหนึ่งใช้อิเล็กโทรไลซิส $\mathrm{Al_2O_3}$ ที่ละลายในคริโอไลต์ ไฟฟ้าที่ผ่านเซลล์มีประจุรวม $1.00 \times 10^{5}$ C ได้อะลูมิเนียมกี่กรัม กำหนด $F = 96485$ C/mol และ $M(\mathrm{Al}) = 26.98$ g/mol (ตอบเป็นกรัม)'
    answer: { value: 9.32, tolerance: 0.02, unit: g }
    hints:
      - 'หาจำนวนโมลของอิเล็กตรอนจากประจุรวม $n_e = Q / F$'
      - 'ปฏิกิริยาที่แคโทดคือ $\mathrm{Al^{3+} + 3e^{-} \rightarrow Al}$ ต้องใช้อิเล็กตรอน 3 โมลต่ออะลูมิเนียม 1 โมล'
    misconceptions:
      - { match: 27.96, feedback: 'คิดว่า Al ใช้อิเล็กตรอนเพียง 1 โมลต่อโมล ทั้งที่ Al³⁺ รับอิเล็กตรอน 3 ตัว' }
    solution: '$n_e = 1.00 \times 10^5 \div 96485 = 1.036$ mol $n(\mathrm{Al}) = 1.036 \div 3 = 0.3455$ mol มวล $= 0.3455 \times 26.98 = 9.32$ g'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.metals-metalloids.p004
    topics: [chemistry.descriptive.metals-metalloids]
    difficulty: 2
    type: match
    stem: 'จับคู่โลหะกับแร่หลักที่ใช้ผลิตโลหะนั้น'
    pairs:
      - { left: 'โซเดียม', right: 'เกลือแกง (NaCl) ในน้ำทะเลหรือเกลือหิน' }
      - { left: 'อะลูมิเนียม', right: 'บอกไซต์ (แร่ที่มี Al₂O₃)' }
      - { left: 'เหล็ก', right: 'เฮมาไทต์ (แร่ที่มี Fe₂O₃)' }
      - { left: 'ดีบุก', right: 'แคสซิเทอไรต์ (แร่ที่มี SnO₂)' }
    hints:
      - 'ดูว่าแร่ที่ใช้ผลิตโซเดียมคือสารประกอบชนิดใดที่คุ้นเคยในชีวิตประจำวัน'
      - 'ดูสูตรของแร่ว่ามีโลหะนั้นอยู่กับออกซิเจนหรือไม่'
    solution: 'โซเดียมได้จาก NaCl อะลูมิเนียมจากบอกไซต์ที่มี Al₂O₃ เหล็กจากเฮมาไทต์ Fe₂O₃ และดีบุกจากแคสซิเทอไรต์ SnO₂'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.metals-metalloids.p005
    topics: [chemistry.descriptive.metals-metalloids]
    difficulty: 2
    type: mcq
    stem: 'ซิลิคอน (Si) ซึ่งเป็นกึ่งโลหะ มีสมบัติเด่นในการนำไปใช้ทำชิปคอมพิวเตอร์อย่างไร'
    choices:
      - { id: a, text: 'เป็นสารกึ่งตัวนำ นำไฟฟ้าได้มากขึ้นเมื่ออุณหภูมิสูงขึ้น และควบคุมได้ด้วยการเติมสารเจือปน', correct: true, feedback: 'ถูก สมบัติกึ่งกลางระหว่างโลหะกับอโลหะทำให้ควบคุมการนำไฟฟ้าได้' }
      - { id: b, text: 'นำไฟฟ้าได้ดีเท่าทองแดงทุกสภาวะ', feedback: 'ซิลิคอนนำไฟฟ้าได้น้อยกว่าโลหะทั่วไปมาก ที่อุณหภูมิห้องเป็นกึ่งตัวนำ' }
      - { id: c, text: 'เป็นฉนวนที่ไม่นำไฟฟ้าเลยที่อุณหภูมิใดก็ตาม', feedback: 'ซิลิคอนไม่ใช่ฉนวนอย่างแท้จริง จึงจัดเป็นกึ่งตัวนำ' }
      - { id: d, text: 'เป็นโลหะที่ทำปฏิกิริยากับน้ำรุนแรง', feedback: 'ซิลิคอนไม่ทำปฏิกิริยากับน้ำรุนแรงและไม่ใช่โลหะแอลคาไล' }
    hints:
      - 'ซิลิคอนอยู่ระหว่างโลหะกับอโลหะในตารางธาตุ'
      - 'ลองนึกถึงสมบัติที่ทำให้ควบคุมกระแสไฟฟ้าในทรานซิสเตอร์ได้'
    solution: 'กึ่งโลหะนำไฟฟ้าได้ปานกลาง การเติมธาตุอื่นเล็กน้อยเปลี่ยนการนำไฟฟ้าได้มาก จึงใช้ทำทรานซิสเตอร์และชิปได้'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.metals-metalloids.p006
    topics: [chemistry.descriptive.metals-metalloids]
    difficulty: 3
    type: mcq
    stem: 'ในการผลิตอะลูมิเนียมจาก $\mathrm{Al_2O_3}$ ด้วยอิเล็กโทรไลซิส ทำไมต้องละลาย $\mathrm{Al_2O_3}$ ในคริโอไลต์ก่อน'
    choices:
      - { id: a, text: 'เพื่อลดจุดหลอมเหลวของ Al₂O₃ ทำให้ทำงานได้ที่อุณหภูมิต่ำลงและประหยัดพลังงาน', correct: true, feedback: 'ถูก Al₂O₃ หลอมที่อุณหภูมิสูงมากถ้าไม่มีคริโอไลต์' }
      - { id: b, text: 'เพื่อให้อะลูมิเนียมละลายในน้ำได้ทันที', feedback: 'อะลูมิเนียมไม่ละลายน้ำ และเป้าหมายคือการแยกอะลูมิเนียมโลหะออกมา' }
      - { id: c, text: 'เพื่อเพิ่มออกซิเจนให้แก่อะลูมิเนียม', feedback: 'ออกซิเจนถูกปล่อยออกที่ขั้วบวก ไม่ได้ถูกเติมเข้าไปในอะลูมิเนียม' }
      - { id: d, text: 'เพื่อเปลี่ยน Al₂O₃ เป็น Al₂S₃', feedback: 'ไม่มีการเปลี่ยนเป็นซัลไฟด์ในกระบวนการนี้' }
    hints:
      - 'คิดว่าสารเติมนี้ช่วยเรื่องอุณหภูมิหรือพลังงานของกระบวนการ'
      - 'Al₂O₃ มีจุดหลอมเหลวสูงมาก'
    solution: 'คริโอไลต์ช่วยลดอุณหภูมิที่ทำให้สารละลายหลอมเหลวและนำไฟฟ้าได้ ทำให้ใช้พลังงานน้อยลงมาก'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.metals-metalloids.p007
    topics: [chemistry.descriptive.metals-metalloids]
    difficulty: 2
    type: text
    stem: 'เขียนสูตรเคมีของแร่แคสซิเทอไรต์ ซึ่งเป็นแร่หลักของดีบุก (พิมพ์ตัวเลขห้อยเป็นตัวเลขปกติ เช่น CO2)'
    accepted: ['SnO2', 'SnO₂']
    misconceptions:
      - { match: 'SnO', feedback: 'SnO ไม่ใช่แคสซิเทอไรต์ แร่นี้มีออกซิเจน 2 อะตอมต่อดีบุก 1 อะตอม' }
    hints:
      - 'แร่นี้เป็นออกไซด์ของดีบุก'
      - 'ดีบุกในสถานะ +4 รวมกับออกซิเจน 2 อะตอม'
    solution: 'แคสซิเทอไรต์คือดีบุก(IV)ออกไซด์ มีสูตร SnO₂ พบมากที่สุดในแหล่งดีบุกทั่วโลก'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.metals-metalloids.p008
    topics: [chemistry.descriptive.metals-metalloids]
    difficulty: 3
    type: numeric
    stem: 'ถลุงดีบุกจากแคสซิเทอไรต์ $\mathrm{SnO_2}$ 100.0 g ด้วยคาร์บอนเกินพอตามสมการ $\mathrm{SnO_2 + 2C \rightarrow Sn + 2CO}$ ได้ดีบุกสูงสุดกี่กรัม กำหนด $M(\mathrm{Sn}) = 118.71$ g/mol และ $M(\mathrm{SnO_2}) = 150.71$ g/mol (ตอบเป็นกรัม)'
    answer: { value: 78.77, tolerance: 0.05, unit: g }
    hints:
      - 'หาจำนวนโมลของ $\mathrm{SnO_2}$ จากมวลและมวลโมลาร์'
      - 'ตามสมการ $\mathrm{SnO_2}$ 1 โมลให้ Sn 1 โมล'
    misconceptions:
      - { match: 157.54, feedback: 'คิดว่า SnO₂ 1 โมลให้ Sn 2 โมล แต่สมการให้ Sn 1 โมลต่อ SnO₂ 1 โมล' }
    solution: '$n(\mathrm{SnO_2}) = 100.0 \div 150.71 = 0.6635$ mol $n(\mathrm{Sn}) = 0.6635$ mol มวล $= 0.6635 \times 118.71 = 78.77$ g'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.metals-metalloids.p009
    topics: [chemistry.descriptive.metals-metalloids]
    difficulty: 3
    type: numeric
    stem: 'โซเดียมผลิตจากอิเล็กโทรไลซิสเกลือ $\mathrm{NaCl}$ หลอมเหลว ถ้าประจุไฟฟ้ารวมที่ผ่านเซลล์มี $5.00 \times 10^{4}$ C จะได้โซเดียมกี่กรัม กำหนด $F = 96485$ C/mol และ $M(\mathrm{Na}) = 22.99$ g/mol (ตอบเป็นกรัม)'
    answer: { value: 11.91, tolerance: 0.02, unit: g }
    hints:
      - 'คำนวณจำนวนโมลของอิเล็กตรอนจาก $Q / F$'
      - 'ปฏิกิริยาที่แคโทดคือ $\mathrm{Na^{+} + e^{-} \rightarrow Na}$ ใช้อิเล็กตรอน 1 โมลต่อ Na 1 โมล'
    misconceptions:
      - { match: 5.96, feedback: 'ใช้อิเล็กตรอน 2 โมลต่อ Na ทั้งที่ Na⁺ รับอิเล็กตรอนเพียงตัวเดียว' }
    solution: '$n_e = 5.00 \times 10^4 \div 96485 = 0.5182$ mol ได้ $n(\mathrm{Na}) = 0.5182$ mol มวล $= 0.5182 \times 22.99 = 11.91$ g'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.metals-metalloids.p010
    topics: [chemistry.descriptive.metals-metalloids]
    difficulty: 3
    type: numeric
    stem: 'ในโรงถลุงสังกะสีแห่งหนึ่ง ซิงก์ออกไซด์ ZnO มวล 1.00 kg ถูกรีดิวซ์ด้วยคาร์บอนตามสมการ $\mathrm{ZnO + C \rightarrow Zn + CO}$ ได้สังกะสีสูงสุดกี่กรัม กำหนด $M(\mathrm{ZnO}) = 81.38$ และ $M(\mathrm{Zn}) = 65.38$ g/mol (ตอบเป็นกรัม)'
    answer: { value: 803.4, tolerance: 0.5, unit: g }
    hints:
      - 'หาจำนวนโมลของ ZnO จากมวลที่กำหนด (แปลง kg เป็น g ก่อน)'
      - 'สมการให้ Zn 1 โมลต่อ ZnO 1 โมล แล้วแปลงเป็นกรัมด้วยมวลโมลาร์ของ Zn'
    misconceptions:
      - { match: 1244.7, feedback: 'สลับมวลโมลาร์ของ ZnO กับ Zn ทำให้ได้ค่าสูงเกินจริง' }
    solution: '$n(\mathrm{ZnO}) = 1000 \div 81.38 = 12.29$ mol $n(\mathrm{Zn}) = 12.29$ mol มวล $= 12.29 \times 65.38 = 803.4$ g'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.metals-metalloids.p011
    topics: [chemistry.descriptive.metals-metalloids]
    difficulty: 4
    type: numeric
    stem: 'ถลุงเหล็กจากเฮมาไทต์ $\mathrm{Fe_2O_3}$ 750 g ด้วยแก๊ส CO ได้ตามสมการ $\mathrm{Fe_2O_3 + 3CO \rightarrow 2Fe + 3CO_2}$ หากได้ผลผลิตเต็มร้อยละร้อย จะได้เหล็กกี่กรัม กำหนด $M(\mathrm{Fe_2O_3}) = 159.69$ และ $M(\mathrm{Fe}) = 55.85$ g/mol (ตอบเป็นกรัม)'
    answer: { value: 524.6, tolerance: 0.2, unit: g }
    hints:
      - 'หาจำนวนโมลของ $\mathrm{Fe_2O_3}$ ก่อน'
      - 'ใน $\mathrm{Fe_2O_3}$ 1 โมลมีเหล็ก 2 อะตอม จึงได้ Fe 2 โมลต่อ $\mathrm{Fe_2O_3}$ 1 โมล'
    misconceptions:
      - { match: 786.9, feedback: 'คิดว่า Fe₂O₃ 1 โมลให้ Fe 3 โมล แต่มีเหล็ก 2 อะตอมต่อโมเลกุล' }
    solution: '$n(\mathrm{Fe_2O_3}) = 750 \div 159.69 = 4.697$ mol ได้ $n(\mathrm{Fe}) = 2 \times 4.697 = 9.393$ mol มวล $= 9.393 \times 55.85 = 524.6$ g'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.metals-metalloids.p012
    topics: [chemistry.descriptive.metals-metalloids]
    difficulty: 4
    type: mcq
    stem: 'ข้อใดอธิบายสมบัติของโลหะแทรนซิชันได้ถูกต้อง'
    choices:
      - { id: a, text: 'มีเลขออกซิเดชันได้หลายค่า และสารประกอบมักมีสี', correct: true, feedback: 'ถูก เช่น Fe²⁺ และ Fe³⁺ หรือ Cu⁺ และ Cu²⁺ และสารประกอบของ Cu²⁺ มักเป็นสีฟ้า' }
      - { id: b, text: 'มีประจุบวกคงที่ +1 เสมอ', feedback: 'ผิด โลหะแทรนซิชันมีประจุบวกหลายค่าขึ้นอยู่กับสภาวะ' }
