  - id: health.family.friendships-relationships.p016
    topics: [health.family.friendships-relationships]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "แป้งยืมหนังสือการ์ตูนของบัวไปแล้วทำเปียกน้ำ บทสนทนาเป็นดังนี้ บัว: \"เรารู้สึกเสียดายที่หนังสือเปียก เพราะเป็นของขวัญจากยาย\" แป้ง: \"ก็แค่หนังสือเอง\" บัว: \"เธอนี่ไม่เคยดูแลของใครเลย\" ข้อใดวิเคราะห์ได้ถูกต้อง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ประโยคแรกของบัวเป็นการพูดแบบใช้ \"ฉัน\" ที่บอกความรู้สึกและเหตุผล", correct: true }
      - { id: b, text: "คำตอบของแป้งไม่ให้เกียรติความรู้สึกของบัว ควรขอโทษและเสนอทางแก้", correct: true }
      - { id: c, text: "ประโยคสุดท้ายของบัวเป็นการต่อว่านิสัย ทำให้ทะเลาะกันมากขึ้น", correct: true }
      - { id: d, text: "แป้งพูดถูก เพราะหนังสือซื้อใหม่ได้ บัวไม่ควรเสียใจ", feedback: "ของบางอย่างมีความหมายทางใจ การรับฟังความรู้สึกของเพื่อนสำคัญกว่าราคาของ" }
    hints:
      - "ตรวจทีละประโยคว่าเป็นการบอกความรู้สึกหรือการต่อว่า"
      - "คนทำของเพื่อนเสียหายควรทำอะไรก่อน"
    solution: "บัวเริ่มต้นดีด้วยการพูดแบบใช้ ฉัน แป้งควรขอโทษและเสนอทางแก้ เช่น ช่วยตากให้แห้งหรือหาเล่มใหม่ ส่วนบัวไม่ควรต่อว่านิสัยในประโยคสุดท้าย แต่บอกสิ่งที่อยากให้แป้งทำแทน"
