id: math.prob.counting
subject: math
title: { th: หลักการนับเบื้องต้น, en: Basic counting principles }
summary: นับจำนวนวิธีโดยไม่ต้องเขียนทุกแบบ ด้วยหลักการบวก หลักการคูณ แฟกทอเรียล การเรียงสับเปลี่ยน และการจัดหมู่
difficulty: 4
minutes: 30
prerequisites: [math.number.integers]
encompasses:
  - { id: math.number.integers, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: tree-diagram.svg
    alt: "แผนภาพต้นไม้เริ่มจากจุดเดียว แตกเป็นสองกิ่งคือข้าวสวยและข้าวเหนียว แต่ละกิ่งแตกต่อเป็นสามกิ่งคือไก่ทอด หมูปิ้ง ไข่เจียว ปลายกิ่งทั้งหมดมี 6 แบบ เขียนว่า ทั้งหมด 2 × 3 = 6 แบบ"
    caption: "ข้าวแต่ละแบบแตกกิ่งเป็นกับข้าว 3 แบบเท่ากัน จำนวนปลายกิ่งจึงเป็น $2 \\times 3$"
  - { type: check, problem: math.cnt.p015, prompt: "ลองวาดแผนภาพต้นไม้ในใจ" }
  - type: figure
    src: two-dice-table.svg
    alt: "ตาราง 6 แถว 6 คอลัมน์ แถวคือแต้มลูกเต๋าสีแดง 1 ถึง 6 คอลัมน์คือแต้มลูกเต๋าสีน้ำเงิน 1 ถึง 6 แต่ละช่องเขียนคู่อันดับ เช่น (2,5) รวม 36 ช่อง ช่องในแนวทแยงจาก (1,1) ถึง (6,6) ระบายสีเหลืองแทนผลลัพธ์ที่ได้แต้มเหมือนกัน 6 ผลลัพธ์"
    caption: "ปริภูมิตัวอย่างของการทอดลูกเต๋าสองลูกมี 36 ผลลัพธ์ เหตุการณ์ \"ได้แต้มเหมือนกัน\" มี 6 ผลลัพธ์"
  - type: worked-example
    title: นับด้วยตารางผลลัพธ์
    problem: "ทอดลูกเต๋าสีแดงและสีน้ำเงิน มีผลลัพธ์กี่แบบที่แต้มสีแดงมากกว่าแต้มสีน้ำเงิน"
    steps:
      - text: "ผลลัพธ์ทั้งหมดคือ $6 \\times 6 = 36$ แบบ แบ่งเป็นสามกลุ่ม: แดงมากกว่า แต้มเท่ากัน และน้ำเงินมากกว่า"
      - text: "แต้มเท่ากันมี 6 แบบ (แนวทแยงของตาราง)"
      - text: "ที่เหลือ $36 - 6 = 30$ แบบ แบ่งเป็นแดงมากกว่าและน้ำเงินมากกว่าเท่า ๆ กัน"
        why: "ทุกผลลัพธ์ที่แดงมากกว่า เช่น (5, 2) จับคู่ได้พอดีกับผลลัพธ์ที่น้ำเงินมากกว่า คือ (2, 5) ตารางจึงสมมาตรข้ามแนวทแยง"
      - text: "แดงมากกว่า $= 30 \\div 2 = 15$ แบบ ตรวจด้วยการไล่: แดง 2 ได้ 1 แบบ แดง 3 ได้ 2 แบบ ... แดง 6 ได้ 5 แบบ รวม $1 + 2 + 3 + 4 + 5 = 15$ ✓"
    answer: "15 แบบ"
  - type: worked-example
    title: นับกรณีตรงข้าม
    problem: "เด็ก 4 คนถูกจัดให้นั่งเก้าอี้ 4 ตัวเรียงเป็นแถว มีกี่แบบที่น้ำกับฟ้า **ไม่** นั่งติดกัน"
    steps:
      - text: "นับทุกแบบก่อน: เรียงเด็ก 4 คน $= 4! = 24$ แบบ"
      - text: "นับแบบที่น้ำกับฟ้านั่งติดกัน: มัดสองคนเป็นก้อนเดียว เหลือ 3 ก้อน เรียงได้ $3! = 6$ แบบ"
      - text: "ในก้อนนั้นน้ำกับฟ้าสลับที่กันได้ $2! = 2$ แบบ จึงนั่งติดกัน $6 \\times 2 = 12$ แบบ"
        why: "น้ำ–ฟ้า กับ ฟ้า–น้ำ เป็นการนั่งต่างกัน"
      - text: "ไม่ติดกัน $=$ ทั้งหมด $-$ ติดกัน $= 24 - 12 = 12$ แบบ"
        why: "การนับตรง ๆ ต้องแยกหลายกรณีตามตำแหน่งที่นั่ง การนับกรณีตรงข้ามแล้วลบออกจึงง่ายกว่า"
    answer: "12 แบบ"
  - { type: check, problem: math.cnt.p017, prompt: "ใส่คืนหรือไม่ใส่คืนให้ผลต่างกันอย่างไร" }
glossary:
  - { term: หลักการคูณ, definition: "ถ้างานมีหลายขั้นต่อกัน ขั้นแรกมี m วิธี และแต่ละวิธีมีขั้นถัดไป n วิธี จะมีทั้งหมด m × n วิธี" }
  - { term: แฟกทอเรียล, definition: "ผลคูณของจำนวนเต็มบวกตั้งแต่ 1 ถึง n เขียนว่า $n!$ และกำหนดให้ $0! = 1$" }
  - { term: การเรียงสับเปลี่ยน, definition: "การเลือกของมาเรียงโดยลำดับมีความหมาย จำนวนวิธีคือ $P(n, r) = \\frac{n!}{(n-r)!}$" }
  - { term: การจัดหมู่, definition: "การเลือกของเป็นกลุ่มโดยไม่สนลำดับ จำนวนวิธีคือ $C(n, r) = \\frac{n!}{r!(n-r)!}$" }
flashcards:
  - { front: "เมื่อไรใช้หลักการบวก เมื่อไรใช้หลักการคูณ", back: "เลือกทางใดทางหนึ่ง (หรือ) ให้บวก ทำหลายขั้นต่อกัน (และ) ให้คูณ" }
  - { front: "$5!$ เท่ากับเท่าใด", back: "$5 \\times 4 \\times 3 \\times 2 \\times 1 = 120$" }
  - { front: "$0!$ เท่ากับเท่าใด", back: "$0! = 1$ (ไม่ใช่ 0)" }
  - { front: "การเรียงสับเปลี่ยนต่างจากการจัดหมู่อย่างไร", back: "การเรียงสับเปลี่ยนสนลำดับ การจัดหมู่ไม่สนลำดับ จึงหารด้วย $r!$ : $C(n, r) = \\frac{P(n, r)}{r!}$" }
