problems:
- id: chinese.vocab.time-dates.p001
  topics:
  - chinese.vocab.time-dates
  difficulty: 1
  type: mcq
  stem: 星期一 (xīngqīyī) คือวันอะไร
  choices:
  - id: a
    text: วันอังคาร
    feedback: วันอังคารคือ 星期二
  - id: b
    text: วันที่ 1 ของเดือน
    feedback: วันที่ 1 คือ 一号 ส่วน 星期一 เป็นวันในสัปดาห์
  - id: c
    text: วันจันทร์
    correct: true
    feedback: ถูก 星期 + เลข 1 = วันแรกของสัปดาห์ทำงาน คือวันจันทร์
  - id: d
    text: วันอาทิตย์
    feedback: วันอาทิตย์คือ 星期天 หรือ 星期日
  hints:
  - 星期 แปลว่า สัปดาห์ และตามด้วยตัวเลข
  - นับวันจันทร์เป็นวันที่ 1
  solution: 星期一 = **วันจันทร์** (星期二 อังคาร ... 星期六 เสาร์ · 星期天/星期日 อาทิตย์)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.time-dates.p002
  topics:
  - chinese.vocab.time-dates
  difficulty: 1
  type: match
  stem: จับคู่วันในสัปดาห์ภาษาจีนกับภาษาไทย
  pairs:
  - left: 星期二
    right: วันอังคาร
  - left: 星期三
    right: วันพุธ
  - left: 星期五
    right: วันศุกร์
  - left: 星期六
    right: วันเสาร์
  - left: 星期天
    right: วันอาทิตย์
  hints:
  - ตัวเลขหลัง 星期 คือลำดับวันนับจากวันจันทร์
  - วันอาทิตย์ไม่ใช้ตัวเลข ใช้ 天 หรือ 日
  solution: 星期二 อังคาร · 星期三 พุธ · 星期五 ศุกร์ · 星期六 เสาร์ · 星期天 อาทิตย์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.time-dates.p003
  topics:
  - chinese.vocab.time-dates
  difficulty: 2
  type: hanzi
  stem: เขียนอักษร 年 (nián) ที่แปลว่า ปี ตามลำดับขีด
  character: 年
  pinyin: nián
  meaning: ปี
  hints:
  - 年 มี 6 ขีด เริ่มด้วย 撇 สั้นด้านบนซ้าย
  - 'ลำดับ: 撇 → 横 → 横 → 竖 (ขีดตั้งสั้นด้านซ้าย) → 横 (ยาว) → 竖 (ยาวลงตรงกลาง)'
  solution: 撇 → 横 → 横 → 竖 → 横 → 竖 รวม 6 ขีด ขีดตั้งยาวเขียนเป็นขีดสุดท้าย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.time-dates.p004
  topics:
  - chinese.vocab.time-dates
  difficulty: 2
  type: mcq
  stem: 三月 กับ 三个月 ต่างกันอย่างไร
  choices:
  - id: a
    text: 三个月 คือวันที่ 3
    feedback: วันที่ 3 คือ 三号
  - id: b
    text: 三月 คือเดือนมีนาคม ส่วน 三个月 คือระยะเวลา 3 เดือน
    correct: true
    feedback: ถูก ชื่อเดือนคือ ตัวเลข + 月 ส่วนจำนวนเดือนต้องมีลักษณนาม 个
  - id: c
    text: เหมือนกัน แปลว่า 3 เดือน
    feedback: 三月 เป็นชื่อเดือน ไม่ใช่ระยะเวลา
  - id: d
    text: 三月 คือ 3 เดือน ส่วน 三个月 คือเดือนมีนาคม
    feedback: สลับกัน
  hints:
  - ชื่อเดือนในภาษาจีนเป็นเลขลำดับเดือน
  - 个 เป็นลักษณนาม ใช้เมื่อนับจำนวน
  solution: '**三月** sānyuè = มีนาคม · **三个月** sān ge yuè = 3 เดือน (ระยะเวลา)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.time-dates.p005
  topics:
  - chinese.vocab.time-dates
  difficulty: 2
  type: text
  stem: เขียน "5 ธันวาคม" (วันพ่อแห่งชาติของไทย) เป็นภาษาจีน (พิมพ์อักษรจีน ใช้ 月 กับ 号 หรือ 日)
  accepted:
  - 十二月五号
  - 十二月五日
  - 12月5号
  - 12月5日
  misconceptions:
  - match: 五号十二月
    feedback: 'เรียงตามภาษาไทย ภาษาจีนเรียงจากใหญ่ไปเล็ก: เดือนก่อนวัน'
  - match: 五日十二月
    feedback: 'เรียงตามภาษาไทย ภาษาจีนเรียงจากใหญ่ไปเล็ก: เดือนก่อนวัน'
  - match: 十二月五
    feedback: ต้องมี 号 หรือ 日 ต่อท้ายวันที่
  hints:
  - ภาษาจีนเรียง ปี → เดือน → วัน
  - ธันวาคมคือเดือนที่ 12
  solution: '**十二月五号** shí''èr yuè wǔ hào (ภาษาเขียนใช้ 十二月五日)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.time-dates.p006
  topics:
  - chinese.vocab.time-dates
  difficulty: 2
  type: mcq
  stem: นักท่องเที่ยวชาวจีนถามว่า 现在几点？ (ตอนนี้กี่โมง) นาฬิกาแสดงเวลาตามภาพ ควรตอบว่าอะไร
  figure:
    src: clock-quiz.svg
    alt: นาฬิกาเข็มหน้าปัดมีเลข 1 ถึง 12 เข็มสั้นอยู่กึ่งกลางระหว่างเลข 2 กับ 3 เข็มยาวชี้ที่เลข 6 เป็นเวลาบ่าย (มีรูปดวงอาทิตย์)
    caption: ตอนบ่ายวันหนึ่ง
  choices:
  - id: a
    text: 二点半
    feedback: เลข 2 หน้า 点 ใช้ 两 ไม่ใช่ 二
  - id: b
    text: 三点半
    feedback: เข็มสั้นยังไม่ถึงเลข 3 จึงยังเป็นสองโมงกว่า
  - id: c
    text: 半两点
    feedback: '半 วางหลัง 点: 两点半'
  - id: d
    text: 两点半
    correct: true
    feedback: ถูก บ่ายสองโมงครึ่ง เลข 2 หน้า 点 ใช้ 两
  hints:
  - เข็มสั้นอยู่ระหว่าง 2 กับ 3 เข็มยาวชี้ 6 คือครึ่งชั่วโมง
  - 2 โมงใช้ 两点 และครึ่งชั่วโมงคือ 半
  solution: เวลา 2:30 = **两点半** liǎng diǎn bàn (ตอนบ่ายพูดเต็มว่า 下午两点半)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.time-dates.p007
  topics:
  - chinese.vocab.time-dates
  difficulty: 3
  type: order
  stem: 'เรียงส่วนของวันที่ให้ถูกตามแบบภาษาจีน: วันจันทร์ที่ 2 พฤศจิกายน 2026'
  items:
  - 二〇二六年
  - 十一月
  - 二号
  - 星期一
  hints:
  - ภาษาจีนเรียงจากหน่วยใหญ่ไปหน่วยเล็ก
  - วันในสัปดาห์วางท้ายสุด
  solution: '**二〇二六年十一月二号星期一** (ปี → เดือน → วันที่ → วันในสัปดาห์) ตรงข้ามกับภาษาไทยที่ขึ้นต้นด้วยวัน'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.time-dates.p008
  topics:
  - chinese.vocab.time-dates
  difficulty: 3
  type: numeric
  stem: เพื่อนชาวจีนนัดว่า 差五分十点 เจอกัน เวลานี้คือ 9 นาฬิกากี่นาที (ตอบเฉพาะจำนวนนาที)
  answer:
    value: 55
    unit: นาที
  misconceptions:
  - match: 5
    feedback: 差 แปลว่า ขาด คือ อีก 5 นาทีจะถึงสิบโมง ไม่ใช่สิบโมงห้านาที
  - match: 50
    feedback: ขาด 5 นาที ไม่ใช่ 10 นาที
  hints:
  - 差 chà แปลว่า ขาด หรือ ยังไม่ถึง
  - ขาดอีก 5 นาทีจะถึง 10 โมง
  solution: 差五分十点 = อีก 5 นาทีจะ 10 โมง = $60 - 5 = 55$ นาที คือ **9:55**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.time-dates.p009
  topics:
  - chinese.vocab.time-dates
  difficulty: 3
  type: mcq
  stem: ไกด์ชาวไทยบอกนักท่องเที่ยวชาวจีนว่า "รถออกบ่ายสามโมง" ควรพูดว่าอะไร
  choices:
  - id: a
    text: 晚上三点
    feedback: 晚上 = ตอนเย็นและกลางคืน
  - id: b
    text: 三点下午
    feedback: ช่วงของวันต้องวางหน้าเวลา
  - id: c
    text: 下午三点
    correct: true
    feedback: ถูก 下午 xiàwǔ = ตอนบ่าย วางหน้าเวลา
  - id: d
    text: 上午三点
    feedback: 上午 = ตอนเช้า (ก่อนเที่ยง)
  hints:
  - 上 = บน ก่อน · 下 = ล่าง หลัง · 午 = เที่ยง
  - 'ภาษาจีนเรียงหน่วยใหญ่ก่อน: ช่วงของวัน แล้วจึงเป็นชั่วโมง'
  solution: '**下午三点** xiàwǔ sān diǎn (บ่าย + สาม + โมง) = 15:00'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.time-dates.p010
  topics:
  - chinese.vocab.time-dates
  difficulty: 3
  type: numeric
  stem: เอกสารภาษาไทยลงวันที่ปี พ.ศ. 2569 นักท่องเที่ยวชาวจีนใช้ปีคริสต์ศักราช ต้องเขียนว่าปีใด (ตอบตัวเลข 4 หลัก)
  answer:
    value: 2026
  misconceptions:
  - match: 3112
    feedback: ต้องลบ 543 ไม่ใช่บวก เพราะ พ.ศ. มากกว่า ค.ศ.
  - match: 2025
    feedback: 'ลบ 543 ให้ถูก: 2569 − 543'
  hints:
  - พ.ศ. มากกว่า ค.ศ. อยู่ 543 ปี
  - ค.ศ. = พ.ศ. − 543
  solution: $2569 - 543 = 2026$ เขียนว่า **2026年** หรือ 二〇二六年 (อ่าน èr líng èr liù nián)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.time-dates.p011
  topics:
  - chinese.vocab.time-dates
  difficulty: 3
  type: text
  stem: เขียน "บ่ายสองโมงครึ่ง" เป็นภาษาจีน (พิมพ์อักษรจีน)
  accepted:
  - 下午两点半
  - 下午两点三十
  - 下午两点三十分
  - 下午两点半。
  misconceptions:
  - match: 下午二点半
    feedback: เลข 2 หน้า 点 ใช้ 两
  - match: 两点半下午
    feedback: 下午 ต้องวางหน้าเวลา
  - match: 上午两点半
    feedback: 上午 คือก่อนเที่ยง บ่ายต้องเป็น 下午
  hints:
  - ตอนบ่าย = 下午 วางหน้า
  - สองโมง = 两点 ครึ่ง = 半
  solution: '**下午两点半** xiàwǔ liǎng diǎn bàn (หรือ 下午两点三十分)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.time-dates.p012
  topics:
  - chinese.vocab.time-dates
  difficulty: 4
  type: numeric
  stem: ไกด์บอกนักท่องเที่ยวชาวจีนที่โรงแรมในเชียงใหม่ว่า 上午八点半 ขึ้นรถ ตอนนี้ 七点五十分 เหลือเวลาอีกกี่นาที
  answer:
    value: 40
    unit: นาที
  misconceptions:
  - match: 20
    feedback: ลบเฉพาะนาที 50 − 30 ไม่ได้ ต้องนับข้ามชั่วโมง
  - match: 80
    feedback: ตั้งแต่ 7:50 ถึง 8:30 ไม่ถึงชั่วโมงครึ่ง
  hints:
  - 八点半 = 8:30 และ 七点五十分 = 7:50
  - จาก 7:50 ถึง 8:00 กี่นาที แล้วบวกกับ 8:00 ถึง 8:30
  solution: 7:50 → 8:00 = 10 นาที · 8:00 → 8:30 = 30 นาที · รวม $10 + 30 = 40$ นาที
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.time-dates.p013
  topics:
  - chinese.vocab.time-dates
  difficulty: 4
  type: mcq
  stem: ดูปฏิทินในภาพ 十一月二十号 (20 พฤศจิกายน) เป็นวันอะไร
  figure:
    src: calendar-nov-2026.svg
    alt: ปฏิทินเดือน 2026年11月 หัวคอลัมน์จากซ้ายไปขวาคือ 一 二 三 四 五 六 日 (จันทร์ถึงอาทิตย์) วันที่ 1 อยู่ในคอลัมน์ 日 แถวแรก วันที่ 2 ถึง 8 อยู่แถวที่สองเริ่มที่คอลัมน์ 一 วันที่ 9 ถึง 15 แถวที่สาม วันที่ 16 ถึง 22 แถวที่สี่ วันที่ 23 ถึง 29 แถวที่ห้า และวันที่ 30 อยู่คอลัมน์ 一 แถวสุดท้าย
    caption: ปฏิทินเดือนพฤศจิกายน 2026 (พ.ศ. 2569)
  choices:
  - id: a
    text: 星期六
    feedback: คอลัมน์ 六 ของแถวนั้นคือวันที่ 21
  - id: b
    text: 星期天
    feedback: วันอาทิตย์ของสัปดาห์นั้นคือวันที่ 22
  - id: c
    text: 星期五
    correct: true
    feedback: ถูก วันที่ 20 อยู่ในคอลัมน์ 五
  - id: d
    text: 星期四
    feedback: คอลัมน์ 四 ของแถวนั้นคือวันที่ 19
  hints:
  - หัวคอลัมน์ 一 ถึง 六 คือวันจันทร์ถึงเสาร์ และ 日 คือวันอาทิตย์
  - หาเลข 20 แล้วดูหัวคอลัมน์
  solution: วันที่ 20 อยู่ในคอลัมน์ **五** จึงเป็น **星期五** (วันศุกร์)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.time-dates.p014
  topics:
  - chinese.vocab.time-dates
  difficulty: 4
  type: mcq
  stem: 今天是十月三十一号，星期六。 后天 (hòutiān มะรืนนี้) คือวันที่เท่าไร
  choices:
  - id: a
    text: 十月三十三号，星期一
    feedback: ตุลาคมมี 31 วัน จึงต้องขึ้นเดือนใหม่
  - id: b
    text: 十一月一号，星期天
    feedback: 1 พ.ย. คือ 明天 (พรุ่งนี้) ไม่ใช่มะรืน
  - id: c
    text: 十一月二号，星期二
    feedback: เสาร์ + 2 วัน = จันทร์ ไม่ใช่อังคาร
  - id: d
    text: 十一月二号，星期一
    correct: true
    feedback: ถูก 31 ต.ค. + 2 วัน = 2 พ.ย. และเสาร์ + 2 วัน = จันทร์
  hints:
  - 后天 = อีก 2 วัน
  - เดือนตุลาคมมี 31 วัน
  solution: '31 ต.ค. → (明天) 1 พ.ย. → (后天) **2 พ.ย.** และ เสาร์ → อาทิตย์ → **จันทร์**: 十一月二号，星期一'
  license: CC-BY-SA-4.0
  ai_assisted: true
