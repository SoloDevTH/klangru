<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" font-family="sans-serif" font-size="14">
<title>พีระมิดพลังงาน</title>
<rect x="0" y="0" width="860" height="420" fill="#ffffff"/>
<text x="430.0" y="30.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">พีระมิดพลังงาน: ส่งต่อได้ประมาณร้อยละ 10 ในแต่ละลำดับขั้น</text>
<polygon points="40.0,360 560.0,360 500.9,290 99.1,290" fill="#a5d6a7" stroke="#333" stroke-width="2"/>
<text x="300.0" y="331.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">10,000 kJ</text>
<text x="590.0" y="331.0" text-anchor="start" font-size="14" fill="#222">ผู้ผลิต (ข้าว)</text>
<text x="590.0" y="353.0" text-anchor="start" font-size="12" fill="#c62828">ความร้อนและการหายใจ ประมาณ 90%</text>
<polygon points="99.1,290 500.9,290 441.8,220 158.2,220" fill="#fff59d" stroke="#333" stroke-width="2"/>
<text x="300.0" y="261.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">1,000 kJ</text>
<text x="590.0" y="261.0" text-anchor="start" font-size="14" fill="#222">ผู้บริโภคลำดับที่ 1 (ตั๊กแตน)</text>
<text x="590.0" y="283.0" text-anchor="start" font-size="12" fill="#c62828">ความร้อนและการหายใจ ประมาณ 90%</text>
<polygon points="158.2,220 441.8,220 382.7,150 217.3,150" fill="#ffcc80" stroke="#333" stroke-width="2"/>
<text x="300.0" y="191.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">100 kJ</text>
<text x="590.0" y="191.0" text-anchor="start" font-size="14" fill="#222">ผู้บริโภคลำดับที่ 2 (กบ)</text>
<text x="590.0" y="213.0" text-anchor="start" font-size="12" fill="#c62828">ความร้อนและการหายใจ ประมาณ 90%</text>
<polygon points="217.3,150 382.7,150 323.6,80 276.4,80" fill="#ef9a9a" stroke="#333" stroke-width="2"/>
<text x="300.0" y="121.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">10 kJ</text>
<text x="590.0" y="121.0" text-anchor="start" font-size="14" fill="#222">ผู้บริโภคลำดับที่ 3 (งู)</text>
<text x="430.0" y="400.0" text-anchor="middle" font-size="12" fill="#666">ตัวเลขเป็นค่าตัวอย่าง ประสิทธิภาพจริงแตกต่างไปตามระบบนิเวศ</text>
</svg>