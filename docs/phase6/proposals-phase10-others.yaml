  - { id: chinese.grammar.complex-connectives, title: "คำเชื่อมประโยคซับซ้อนระดับ HSK 4", difficulty: 5, prereq: [chinese.grammar.compound-sentences], indicators: ["hsk-3-0:HSK3.0-L4"], scope: "คู่คำเชื่อมระดับ 4 不仅…而且/还 即使…也 只要…就 只有…才 无论/不管…都 既然…就 一…就 连…都/也 越…越 除了…以外…都/还 ความหมายเชิงตรรกะ (เพิ่มเติม ยอมรับ เงื่อนไขพอเพียงกับจำเป็น ไม่มีเงื่อนไข) ตำแหน่งของคำเชื่อมเมื่อประธานเหมือนหรือต่างกัน ความต่างระหว่าง 只要…就 กับ 只有…才 และระหว่าง 虽然…但是 กับ 即使…也 แปลไทย–จีน เรียงประโยค และเลือกคำเชื่อมในข้อความสั้น ตามรายการไวยากรณ์ระดับ 4 ของ GF 0025—2021 (ตรวจรายการจริงก่อนเขียน)" }
  # ลำดับ 2
  - { id: chinese.reading.longer-passages, title: "การอ่านเรื่องเล่าและบทความสั้นภาษาจีนราว 500 ตัวอักษร", difficulty: 5.5, prereq: [chinese.reading.short-texts, chinese.grammar.complex-connectives], indicators: ["hsk-3-0:HSK3.0-L4"], scope: "อ่านเรื่องเล่าและข้อความอธิบายความยาวไม่เกิน 500 ตัวอักษรในหัวข้อระดับ 4 (ชุมชน สุขภาพ ชีวิตในโรงเรียน งานสำนักงาน สัตว์และพืช) กลยุทธ์ อ่านคำถามก่อน หาคำสำคัญ ใช้คำเชื่อมตามลำดับความคิด เดาความหมายคำจากส่วนประกอบอักษรและคำประสม แยกใจความสำคัญกับรายละเอียด ลำดับเหตุการณ์ และหาความหมายของสำนวนจากบริบท ข้อความมีพินอินเฉพาะคำนอกระดับ ตอบคำถามแบบเลือกตอบ เรียงประโยค และเติมคำ แอปวัดความเร็วในการอ่าน 140 ตัวต่อนาทีตามเกณฑ์ไม่ได้" }
  # ลำดับ 3
  - { id: chinese.writing.narrative-compositions, title: "การเขียนเล่าเรื่องและบรรยายภาษาจีนราว 300 ตัวอักษร", difficulty: 5.5, prereq: [chinese.writing.short-messages, chinese.grammar.complex-connectives], indicators: ["hsk-3-0:HSK3.0-L4"], scope: "รูปแบบเรียงความภาษาจีน (เว้นสองช่องต้นย่อหน้า กระดาษตาราง 方格纸 เครื่องหมายวรรคตอนจีน) โครงเรื่องเล่า (เวลา สถานที่ ตัวละคร เหตุการณ์ ความรู้สึก) และการบรรยายคน สถานที่ สิ่งของ คำบอกลำดับ 首先 然后 后来 最后 คำบอกเวลา และคำเชื่อมระดับ 4 การขยายประโยคสั้นให้เป็นย่อหน้า การเขียนตามภาพหรือคำที่กำหนด ฝึกด้วยการเรียงประโยค หาที่ผิด และเลือกประโยคขยาย เพราะแอปตรวจงานเขียนอิสระไม่ได้" }
  # ลำดับ 3
  - { id: chinese.reading.opinion-texts, title: "การอ่านข้อความแสดงความคิดเห็นภาษาจีน (ระดับ HSK 5)", difficulty: 6.5, prereq: [chinese.reading.longer-passages], indicators: ["hsk-3-0:HSK3.0-L5"], scope: "อ่านข้อความแสดงความคิดเห็นและบทความสั้น (议论文) ไม่เกิน 700 ตัวอักษรในหัวข้อระดับ 5 (ความสัมพันธ์ระหว่างคน วิถีชีวิต วิธีเรียน ธรรมชาติ ปรากฏการณ์สังคม) ระบุความคิดเห็นหลัก (观点) เหตุผลและตัวอย่าง (论据) คำแสดงความเห็น 我认为 在我看来 คำเชื่อมเชิงโต้แย้ง 一方面…另一方面 不是…而是 与其…不如 总之 由此可见 แยกข้อเท็จจริงกับความคิดเห็น สรุปใจความ และหาข้อสรุปที่ผู้เขียนต้องการ ตามรายการไวยากรณ์ระดับ 5 ของ GF 0025—2021 (ตรวจรายการจริงก่อนเขียน)" }
