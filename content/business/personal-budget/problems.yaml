problems:
  - id: business.econ.personal-budget.p001
    topics: [business.econ.personal-budget]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็น **รายรับ** ของนักเรียน"
    choices:
      - { id: a, text: "ได้อั่งเปาจากคุณยายวันตรุษจีน", correct: true }
      - { id: b, text: "ซื้อข้าวกลางวันที่โรงเรียน", feedback: "จ่ายเงินออกไป เป็นรายจ่าย" }
      - { id: c, text: "ซื้อดินสอสี", feedback: "จ่ายเงินออกไป เป็นรายจ่าย" }
      - { id: d, text: "จ่ายค่ารถโรงเรียน", feedback: "จ่ายเงินออกไป เป็นรายจ่าย" }
    hints:
      - "รายรับคือเงินที่ได้เข้ามา"
      - "หาข้อที่เงินเพิ่มขึ้น"
    solution: "อั่งเปาเป็นเงินที่ได้รับเข้ามา จึงเป็นรายรับ ข้ออื่นเป็นการจ่ายเงินออก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.personal-budget.p002
    topics: [business.econ.personal-budget]
    difficulty: 1
    type: mcq
    multiple: true
    stem: "ข้อใดเป็น **รายจ่ายที่จำเป็น** ของครอบครัว (เลือกได้มากกว่าหนึ่งข้อ)"
    choices:
      - { id: a, text: "ค่าอาหาร", correct: true }
      - { id: b, text: "ค่าน้ำค่าไฟ", correct: true }
      - { id: c, text: "ค่าเรียนของลูก", correct: true }
      - { id: d, text: "ซื้อโทรศัพท์รุ่นใหม่ทั้งที่เครื่องเดิมยังใช้ได้", feedback: "เครื่องเดิมยังใช้ได้ รุ่นใหม่จึงเป็นสิ่งที่อยากได้ ไม่ใช่สิ่งจำเป็น" }
      - { id: e, text: "ซื้อตุ๊กตาตัวใหม่", feedback: "ไม่มีก็ใช้ชีวิตได้ เป็นรายจ่ายที่ไม่จำเป็น" }
    hints:
      - "รายจ่ายที่จำเป็นคือสิ่งที่ขาดแล้วใช้ชีวิตลำบาก"
      - "นึกถึงปัจจัย 4 และการศึกษา"
    solution: "ค่าอาหาร ค่าน้ำค่าไฟ และค่าเรียน เป็นรายจ่ายที่จำเป็น ส่วนโทรศัพท์รุ่นใหม่และตุ๊กตาเป็นสิ่งที่อยากได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.personal-budget.p003
    topics: [business.econ.personal-budget]
    difficulty: 1
    type: numeric
    stem: "น้องฟ้าได้ค่าขนมวันละ $50$ บาท ไปโรงเรียน $5$ วัน สัปดาห์นี้น้องฟ้ามีรายรับจากค่าขนมกี่บาท (ตอบเป็นบาท)"
    answer: { value: 250, unit: บาท }
    hints:
      - "ได้เท่ากันทุกวัน ใช้การคูณ"
      - "นำค่าขนมต่อวันคูณจำนวนวัน"
    misconceptions:
      - { match: 55, feedback: "นำ 50 บวก 5 ต้องคูณ เพราะได้ 50 บาททุกวัน 5 วัน" }
    solution: "$50 \\times 5 = 250$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.personal-budget.p004
    topics: [business.econ.personal-budget]
    difficulty: 2
    type: numeric
    stem: "ตอนเช้าบอสมีเงิน $100$ บาท ซื้อข้าวมันไก่ $35$ บาท และซื้อน้ำ $20$ บาท บอสเหลือเงินกี่บาท (ตอบเป็นบาท)"
    answer: { value: 45, unit: บาท }
    hints:
      - "รายจ่ายทำให้เงินคงเหลือลดลง"
      - "นำเงินตอนเช้าลบรายจ่ายทีละรายการ"
    misconceptions:
      - { match: 155, feedback: "บวกรายจ่ายเข้าไป รายจ่ายต้องลบออก" }
      - { match: 55, feedback: "รวมรายจ่ายได้ 55 บาท นั่นคือเงินที่ใช้ไป ไม่ใช่เงินที่เหลือ" }
    solution: "$100 - 35 - 20 = 45$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.personal-budget.p005
    topics: [business.econ.personal-budget]
    difficulty: 2
    type: numeric
    stem: "แป้งอยากซื้อกระเป๋านักเรียนใบใหม่ราคา $450$ บาท ถ้าออมวันละ $25$ บาท ต้องออมกี่วันจึงจะพอ (ตอบเป็นวัน)"
    answer: { value: 18, unit: วัน }
    hints:
      - "ถามว่า 25 บาทกี่ครั้งจึงได้ 450 บาท"
      - "ใช้การหาร $450 \\div 25$"
    misconceptions:
      - { match: 11250, feedback: "คูณกัน แต่ต้องหารเพื่อหาว่าต้องออมกี่วัน" }
      - { match: 425, feedback: "นำ 450 ลบ 25 ต้องหาร" }
    solution: "$450 \\div 25 = 18$ วัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.personal-budget.p006
    topics: [business.econ.personal-budget]
    difficulty: 2
    type: mcq
    stem: "ข้อใด **ไม่ใช่** ผลดีของการใช้จ่ายให้พอดีกับรายได้และการออม"
    choices:
      - { id: a, text: "ได้ซื้อของทุกอย่างที่อยากได้ทันที", correct: true, feedback: "ถูกต้อง การออมหมายถึงยอมรอ ไม่ได้ซื้อทุกอย่างทันที" }
      - { id: b, text: "มีเงินสำรองเมื่อเจ็บป่วยหรือมีเรื่องฉุกเฉิน", feedback: "นี่คือผลดีข้อสำคัญของการออม" }
      - { id: c, text: "ไม่ต้องยืมเงินคนอื่นเมื่อปลายเดือน", feedback: "ใช้จ่ายพอดีกับรายได้ทำให้มีเงินพอใช้ตลอดเดือน เป็นผลดี" }
      - { id: d, text: "เก็บเงินได้ครบแล้วซื้อของที่ต้องการจริง", feedback: "นี่คือผลดีของการตั้งเป้าหมายการออม" }
    hints:
      - "การออมคือการกันเงินไว้ใช้ในอนาคต"
      - "หาข้อที่ขัดกับการกันเงินไว้"
    solution: "การออมทำให้มีเงินสำรอง ไม่ต้องยืม และได้ของที่ต้องการจริงเมื่อออมครบ แต่ไม่ได้ทำให้ซื้อทุกอย่างได้ทันที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.personal-budget.p007
    topics: [business.econ.personal-budget]
    difficulty: 2
    type: numeric
    stem: "จากบัญชีรายรับรายจ่ายของน้องเก่งในภาพ สิ้นวันที่ 5 น้องเก่งมีเงินคงเหลือกี่บาท (ตอบเป็นบาท)"
    figure: { src: record-missing.svg, alt: "ตารางบัญชีรายรับรายจ่ายของน้องเก่ง วันที่ 1 ได้ค่าขนมจากแม่ รายรับ 300 คงเหลือ 300 วันที่ 2 ข้าวกลางวัน รายจ่าย 40 วันที่ 3 สมุดวาดเขียน รายจ่าย 25 วันที่ 4 ช่วยแม่ขายของที่ตลาดนัด รายรับ 50 วันที่ 5 ไอศกรีม รายจ่าย 15 ช่องคงเหลือของวันที่ 2 ถึง 5 เป็นเครื่องหมายคำถาม" }
    answer: { value: 270, unit: บาท }
    hints:
      - "เติมช่องคงเหลือทีละแถว รายรับบวก รายจ่ายลบ"
      - "เริ่มจาก 300 บาทในวันที่ 1"
    misconceptions:
      - { match: 170, feedback: "ลบเงินที่ได้จากการช่วยแม่ขายของ 50 บาท ซึ่งเป็นรายรับ ต้องบวก" }
      - { match: 220, feedback: "ไม่ได้นับรายรับ 50 บาทของวันที่ 4" }
    solution: "$300 - 40 = 260$, $260 - 25 = 235$, $235 + 50 = 285$, $285 - 15 = 270$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.personal-budget.p008
    topics: [business.econ.personal-budget]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการทำงบประมาณรายเดือนแบบออมก่อนใช้"
    items:
      - "ประมาณรายรับทั้งหมดของเดือน"
      - "กันเงินออมไว้ตามเป้าหมาย"
      - "แบ่งเงินสำหรับรายจ่ายที่จำเป็น"
      - "แบ่งเงินที่เหลือสำหรับสิ่งที่อยากได้"
      - "จดรายจ่ายจริงแล้วเทียบกับแผน"
    hints:
      - "ต้องรู้ก่อนว่ามีเงินเท่าไร"
      - "ออมก่อนใช้ และจ่ายสิ่งจำเป็นก่อนสิ่งที่อยากได้"
    solution: "ประมาณรายรับ → กันเงินออม → รายจ่ายจำเป็น → สิ่งที่อยากได้ → จดและเทียบกับแผน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.personal-budget.p009
    topics: [business.econ.personal-budget]
    difficulty: 3
    type: numeric
    stem: "พี่บีมทำงานพิเศษช่วงปิดเทอมได้เดือนละ $2{,}000$ บาท เขาตั้งใจออมก่อนใช้ $20\\%$ ของรายรับ พี่บีมเหลือเงินใช้จ่ายเดือนละกี่บาท (ตอบเป็นบาท)"
    answer: { value: 1600, unit: บาท }
    hints:
      - "หาเงินออมก่อน: $20\\%$ ของ $2{,}000$"
      - "เงินที่ใช้จ่ายได้ $=$ รายรับ $-$ เงินออม"
    misconceptions:
      - { match: 400, feedback: "นั่นคือเงินออม โจทย์ถามเงินที่เหลือใช้จ่าย" }
      - { match: 1980, feedback: "ลบ 20 บาท แต่ต้องลบ 20% ของ 2,000 บาท" }
    solution: "เงินออม $= 2{,}000 \\times 0.20 = 400$ บาท ใช้จ่ายได้ $= 2{,}000 - 400 = 1{,}600$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.personal-budget.p010
    topics: [business.econ.personal-budget]
    difficulty: 3
    type: numeric
    stem: "เดือนนี้ต้นจดรายจ่ายรวม $420$ บาท ในนั้นเป็นค่าขนมและน้ำหวาน $84$ บาท ค่าขนมและน้ำหวานคิดเป็นกี่เปอร์เซ็นต์ของรายจ่ายทั้งหมด (ตอบเป็นเปอร์เซ็นต์)"
    answer: { value: 20, unit: "%" }
    hints:
      - "ร้อยละ $= \\dfrac{\\text{ส่วนที่สนใจ}}{\\text{ทั้งหมด}} \\times 100$"
      - "นำ 84 หารด้วย 420 แล้วคูณ 100"
    misconceptions:
      - { match: 500, feedback: "หารกลับด้าน ต้องเอาค่าขนมเป็นตัวตั้ง หารด้วยรายจ่ายทั้งหมด" }
    solution: "$\\dfrac{84}{420} \\times 100 = 20\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.personal-budget.p011
    topics: [business.econ.personal-budget]
    difficulty: 3
    type: mcq
    stem: "ข้อใดเป็น **เป้าหมายการออมระยะยาว** ที่เขียนได้ชัดเจนที่สุด"
    choices:
      - { id: a, text: "ออมเดือนละ 500 บาท ให้ได้ 30,000 บาทภายใน 5 ปี เป็นทุนเรียนต่อมหาวิทยาลัย", correct: true }
      - { id: b, text: "ออม 300 บาทภายในสัปดาห์หน้าเพื่อซื้อหนังสือการ์ตูน", feedback: "เป็นเป้าหมายที่ชัดเจน แต่เป็นระยะสั้น" }
      - { id: c, text: "อยากมีเงินเยอะ ๆ ในอนาคต", feedback: "ไม่บอกจำนวน ไม่บอกเวลา และไม่บอกว่าเพื่ออะไร" }
      - { id: d, text: "จะออมเงินถ้าเดือนไหนมีเงินเหลือ", feedback: "ไม่มีจำนวนและเวลา และเป็นการใช้ก่อนออม ซึ่งมักไม่เหลือ" }
    hints:
      - "เป้าหมายที่ดีบอก เพื่ออะไร เท่าไร ภายในเมื่อไร"
      - "ระยะยาวคือใช้เวลาหลายปี"
    solution: "ข้อ ก บอกจำนวน ($30{,}000$ บาท) เวลา (5 ปี) จุดประสงค์ (ทุนเรียนต่อ) และแบ่งเป็นเป้ารายเดือน จึงเป็นเป้าหมายระยะยาวที่ชัดเจน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.personal-budget.p012
    topics: [business.econ.personal-budget]
    difficulty: 4
    type: numeric
    stem: "ครอบครัวหนึ่งในจังหวัดนครปฐมมีรายได้เดือนละ $28{,}000$ บาท รายจ่ายแต่ละเดือนคือ ค่าเช่าบ้าน $6{,}500$ ค่าอาหาร $8{,}000$ ค่าน้ำค่าไฟ $2{,}500$ ค่าเดินทาง $1{,}800$ ค่าเรียนของลูก $3{,}200$ และของใช้อื่น ๆ $2{,}000$ บาท ถ้าใช้ตามนี้ ครอบครัวนี้จะเหลือเงินออมเดือนละกี่บาท (ตอบเป็นบาท)"
    answer: { value: 4000, unit: บาท }
    hints:
      - "รวมรายจ่ายทุกรายการก่อน"
      - "เงินที่เหลือ $=$ รายได้ $-$ รายจ่ายรวม"
    misconceptions:
      - { match: 24000, feedback: "นั่นคือรายจ่ายรวม ต้องนำไปลบจากรายได้" }
      - { match: 52000, feedback: "นำรายได้บวกรายจ่าย ต้องลบ" }
    solution: "รายจ่ายรวม $= 6{,}500 + 8{,}000 + 2{,}500 + 1{,}800 + 3{,}200 + 2{,}000 = 24{,}000$ บาท เหลือ $28{,}000 - 24{,}000 = 4{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.personal-budget.p013
    topics: [business.econ.personal-budget]
    difficulty: 4
    type: numeric
    stem: "นุ่นตั้งเป้าเก็บเงิน $18{,}000$ บาทภายใน $2$ ปี เพื่อเป็นทุนเรียนพิเศษตอน ม.6 ถ้าออมเท่ากันทุกเดือน ต้องออมเดือนละกี่บาท (ตอบเป็นบาท)"
    answer: { value: 750, unit: บาท }
    hints:
      - "2 ปีมีกี่เดือน"
      - "นำเป้าหมายหารด้วยจำนวนเดือน"
    misconceptions:
      - { match: 9000, feedback: "หารด้วย 2 ได้เงินออมต่อปี โจทย์ถามต่อเดือน" }
      - { match: 1500, feedback: "หารด้วย 12 คือคิดเหมือนมีเวลาแค่ 1 ปี แต่มีเวลา 2 ปี หรือ 24 เดือน" }
    solution: "$2$ ปี $= 24$ เดือน ออมเดือนละ $18{,}000 \\div 24 = 750$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.personal-budget.p014
    topics: [business.econ.personal-budget]
    difficulty: 4
    type: mcq
    stem: "ภูมิได้ค่าขนมสัปดาห์ละ 300 บาท แต่จดแล้วพบว่าใช้ไป 360 บาท โดยเป็นข้าวกลางวัน 150 บาท ค่ารถ 60 บาท ชานมไข่มุก 100 บาท และเติมเกมออนไลน์ 50 บาท ภูมิต้องยืมเพื่อนทุกสัปดาห์ ข้อใดเป็นการปรับที่เหมาะสมที่สุด"
    choices:
      - { id: a, text: "ลดชานมไข่มุกและเลิกเติมเกม ให้รายจ่ายไม่เกิน 300 บาท และกันเงินออมไว้บ้าง", correct: true }
      - { id: b, text: "งดข้าวกลางวันเพื่อประหยัด 150 บาท", feedback: "ข้าวกลางวันเป็นรายจ่ายที่จำเป็น ควรลดรายจ่ายที่ไม่จำเป็นก่อน" }
      - { id: c, text: "ยืมเพื่อนต่อไปทุกสัปดาห์ แล้วค่อยคืนตอนได้อั่งเปา", feedback: "หนี้จะสะสมขึ้นทุกสัปดาห์ เป็นการใช้จ่ายเกินตัว" }
      - { id: d, text: "เลิกจดรายจ่าย เพราะจดแล้วไม่สบายใจ", feedback: "การจดช่วยให้รู้ว่าเงินไปไหน เลิกจดไม่ได้แก้ปัญหา" }
    hints:
      - "แยกรายจ่ายจำเป็นกับไม่จำเป็นก่อน"
      - "รายจ่ายจำเป็นรวมเท่าไร และต้องลดส่วนไหนจึงไม่เกินรายรับ"
