id: management.research.research-methods
subject: management
title: { th: ระเบียบวิธีวิจัยทางบริหารธุรกิจและรัฐประศาสนศาสตร์, en: Research methods for business and public administration }
summary: ตั้งคำถามวิจัยที่วัดได้ ทบทวนวรรณกรรม เลือกรูปแบบการวิจัยและกลุ่มตัวอย่าง ตรวจแบบสอบถามให้ตรงและเชื่อถือได้ และเลือกสถิติพื้นฐานให้ตรงกับคำถาม
difficulty: 6
minutes: 40
prerequisites: [math.stats.sampling-surveys, business.stats.descriptive]
encompasses:
  - { id: math.stats.sampling-surveys, weight: 0.3 }
  - { id: business.stats.descriptive, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: research-process.svg
    alt: "แผนภาพลำดับการวิจัยแปดขั้นเรียงจากซ้ายไปขวาและลงแถวล่าง เริ่มจากเลือกปัญหา ทบทวนวรรณกรรม ตั้งคำถามและวัตถุประสงค์ กำหนดกรอบแนวคิดและตัวแปร เลือกกลุ่มตัวอย่างและสร้างเครื่องมือ ทดสอบเครื่องมือ เก็บและวิเคราะห์ข้อมูล และสรุปผลพร้อมข้อจำกัด"
    caption: "ลำดับนี้เป็นแบบที่ใช้กันทั่วไป การวิจัยจริงอาจย้อนกลับไปปรับขั้นก่อนหน้าได้"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: likert-scale.svg
    alt: "มาตรลิเคิร์ตห้าระดับเป็นกล่องเรียงจากซ้ายไปขวา ระดับ 1 น้อยที่สุด ระดับ 2 น้อย ระดับ 3 ปานกลาง ระดับ 4 มาก ระดับ 5 มากที่สุด"
    caption: "ข้อคำถามความพึงพอใจมักใช้มาตรห้าระดับ คะแนนเป็นข้อมูลเชิงลำดับ จึงอ่านค่าเฉลี่ยอย่างระมัดระวัง"
  - type: worked-example
    title: หาขนาดกลุ่มตัวอย่างด้วยสูตร Yamane
    problem: "ศูนย์สุขภาพชุมชนแห่งหนึ่ง (สมมติ) มีผู้ใช้บริการ 1,500 คนในหนึ่งเดือน ต้องการสำรวจความพึงพอใจ โดยยอมให้ค่าคลาดเคลื่อนได้ 5% ควรเก็บแบบสอบถามจากกี่คน"
    steps:
      - text: "กำหนดค่า $N = 1500$ และ $d = 0.05$"
        why: "$d$ คือระดับความคลาดเคลื่อนที่ยอมรับได้ ต้องใส่เป็นทศนิยม 0.05 ไม่ใช่ 5"
      - text: "คำนวณตัวส่วน $1 + Nd^2 = 1 + 1500 \\times 0.0025 = 1 + 3.75 = 4.75$"
        why: "ยกกำลังสอง $d$ ก่อนคูณด้วย $N$ แล้วจึงบวก 1"
      - text: "คำนวณ $n = \\dfrac{1500}{4.75} \\approx 315.79$"
      - text: "ปัดขึ้นเป็นจำนวนเต็ม เพราะต้องการอย่างน้อยเท่านี้"
        why: "การปัดลงจะได้ 315 ซึ่งทำให้ค่าคลาดเคลื่อนเกินที่ตั้งไว้เล็กน้อย"
    answer: "ควรเก็บแบบสอบถามอย่างน้อย 316 คน"
  - { type: check, problem: management.research.research-methods.p005, prompt: "ลองใช้สูตรเดิมกับประชากรขนาดใหม่" }
  - type: worked-example
    title: คำนวณค่าสัมประสิทธิ์แอลฟาของครอนบาค
    problem: "แบบสอบถามความพึงพอใจมี 5 ข้อ ผลรวมความแปรปรวนของแต่ละข้อเท่ากับ 4.2 และความแปรปรวนของคะแนนรวมทั้งฉบับเท่ากับ 10.5 จงหาค่าความเชื่อถือได้"
    steps:
      - text: "ใช้สูตร $\\alpha = \\dfrac{k}{k-1}\\left(1 - \\dfrac{\\sum \\sigma_i^2}{\\sigma_X^2}\\right)$ โดย $k = 5$"
        why: "สูตรนี้เทียบความแปรปรวนรายข้อกับความแปรปรวนรวม ถ้าข้อต่าง ๆ ไปในทิศเดียวกัน ความแปรปรวนรวมจะใหญ่กว่าผลรวมรายข้อมาก"
      - text: "คำนวณ $\\dfrac{k}{k-1} = \\dfrac{5}{4} = 1.25$"
      - text: "คำนวณ $\\dfrac{\\sum \\sigma_i^2}{\\sigma_X^2} = \\dfrac{4.2}{10.5} = 0.4$"
      - text: "แทนค่า $\\alpha = 1.25 \\times (1 - 0.4) = 1.25 \\times 0.6 = 0.75$"
    answer: "ค่าแอลฟาเท่ากับ 0.75 ซึ่งอยู่เหนือเกณฑ์ทั่วไปที่ 0.70 แปลว่าข้อคำถามให้ผลค่อนข้างสม่ำเสมอ"
  - { type: check, problem: management.research.research-methods.p009, prompt: "ลองคิดว่าถ้าลืมตัวคูณ k/(k−1) ค่าที่ได้จะเป็นเท่าไร" }
  - type: interactive
    title: ขนาดกลุ่มตัวอย่างเพิ่มช้าลงเมื่อประชากรใหญ่ขึ้น
    caption: "แกนนอนคือขนาดประชากร N แกนตั้งคือขนาดกลุ่มตัวอย่าง n ลากแถบเลื่อนความคลาดเคลื่อน d แล้วสังเกตว่าเมื่อ N มากขึ้น n จะเข้าใกล้ค่าเพดาน 1/d²"
    widget:
      kind: function-plot
      functions: ["\\frac{x}{1+a^2 x}"]
      sliders:
        - { name: a, min: 0.02, max: 0.1, step: 0.01, value: 0.05, label: ความคลาดเคลื่อน d }
      x: [0, 2000]
      y: [0, 1200]
glossary:
  - { term: ประชากร, definition: "กลุ่มทั้งหมดที่งานวิจัยต้องการอธิบาย" }
  - { term: กลุ่มตัวอย่าง, definition: "ส่วนหนึ่งของประชากรที่เลือกมาเก็บข้อมูลจริง" }
  - { term: ตัวแปรอิสระ, definition: "ปัจจัยที่ผู้วิจัยคิดว่าเป็นสาเหตุหรือส่งผลต่อสิ่งที่วัด" }
  - { term: ตัวแปรตาม, definition: "ผลที่วัดได้ ซึ่งคาดว่าจะเปลี่ยนไปเมื่อตัวแปรอิสระเปลี่ยน" }
  - { term: มาตรลิเคิร์ต, definition: "มาตรวัดความเห็นเป็นระดับ เช่น 1 ถึง 5 จากน้อยที่สุดถึงมากที่สุด ซึ่งเป็นข้อมูลเชิงลำดับ" }
  - { term: ค่า p, definition: "ความน่าจะเป็นที่จะได้ข้อมูลเท่านี้หรือมากกว่า เมื่อสมมติว่าสมมติฐานว่างเป็นจริง" }
flashcards:
  - { front: "ปัญหาวิจัยต่างจากคำถามวิจัยอย่างไร", back: "ปัญหาคือช่องว่างระหว่างสภาพจริงกับที่ควรเป็น ส่วนคำถามวิจัยเป็นประโยคที่ตอบได้ด้วยการเก็บและวิเคราะห์ข้อมูล" }
  - { front: "สูตร Yamane สำหรับขนาดกลุ่มตัวอย่าง", back: "$n = \\dfrac{N}{1 + Nd^2}$ โดย $N$ คือขนาดประชากร และ $d$ คือระดับความคลาดเคลื่อนที่ยอมรับได้" }
  - { front: "สัมประสิทธิ์แอลฟาของครอนบาควัดอะไร", back: "ความเชื่อถือได้ของแบบสอบถามที่มีหลายข้อ ว่าให้ผลสม่ำเสมอแค่ไหน" }
  - { front: "ค่า p = 0.03 หมายความว่าอย่างไร", back: "ถ้าสมมติฐานว่างเป็นจริง โอกาสได้ผลเท่านี้หรือมากกว่าประมาณ 3% ไม่ใช่โอกาสที่สมมติฐานวิจัยเป็นจริง" }
  - { front: "เลือกสถิติตามคำถามอย่างไร", back: "บรรยายด้วยร้อยละและค่าเฉลี่ย · เทียบสัดส่วนของตัวแปรเป็นหมวดด้วยไคสแควร์ · ดูความสัมพันธ์ของตัวแปรเชิงปริมาณสองตัวด้วยสหสัมพันธ์" }
