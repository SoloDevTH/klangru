  - id: earthscience.ocean.ocean-circulation.p016
    topics: [earthscience.ocean.ocean-circulation]
    difficulty: 5
    type: numeric
    stem: "ช่วงเอลนีโญ น้ำทะเลชั้นบนหนา 100 m บนพื้นที่ $10^7\\ \\mathrm{km^2}$ ของแปซิฟิกเขตร้อนอุ่นขึ้นเฉลี่ย 1 °C พลังงานความร้อนที่น้ำได้รับเพิ่มขึ้นกี่ $\\times 10^{21}$ J (น้ำทะเลความหนาแน่น $1025\\ \\mathrm{kg/m^3}$ ความจุความร้อนจำเพาะ $3990\\ \\mathrm{J/(kg\\cdot K)}$)"
    answer: { value: 4.09, tolerance: 0.05, unit: "×10²¹ J" }
    misconceptions:
      - { match: 0.00409, feedback: "แปลง $\\mathrm{km^2}$ เป็น $\\mathrm{m^2}$ ผิด $1\\ \\mathrm{km^2} = 10^6\\ \\mathrm{m^2}$ ไม่ใช่ $10^3$" }
      - { match: 0.0409, feedback: "ลืมคูณความหนาของชั้นน้ำ 100 m จึงได้แค่พื้นที่ ไม่ใช่ปริมาตร" }
    hints:
      - "ปริมาตร = พื้นที่ × ความหนา โดย $10^7\\ \\mathrm{km^2} = 10^{13}\\ \\mathrm{m^2}$"
      - "$Q = \\rho V c \\Delta T$"
    solution: "$V = 10^{13} \\times 100 = 10^{15}\\ \\mathrm{m^3}$ มวล $= 1.025 \\times 10^{18}\\ \\mathrm{kg}$ $Q = 1.025 \\times 10^{18} \\times 3990 \\times 1 \\approx 4.09 \\times 10^{21}\\ \\mathrm{J}$ พลังงานจำนวนมหาศาลนี้ถ่ายให้บรรยากาศ จึงเปลี่ยนรูปแบบลมและฝนได้ทั่วโลก"
