  <rect x="0" y="0" width="420" height="320" fill="#ffffff"/>
  <polygon points="82.0,270.0 118.0,270.0 118.0,250.0 100.0,238.0 82.0,250.0" fill="#d9e8f5" stroke="#15211e" stroke-width="2" stroke-linejoin="round"/>
  <line x1="190.0" y1="260.0" x2="190.0" y2="140.0" stroke="#6b7672" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
