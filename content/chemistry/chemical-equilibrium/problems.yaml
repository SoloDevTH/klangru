    solution: "เลือก **อุณหภูมิประนีประนอม ตัวเร่ง V₂O₅ อากาศเกินพอ และดึง SO₃ ออก** เป็นการปรับระบบเคมีด้วยหลักของเลอชาเตอลิเอร่วมกับความรู้เรื่องอัตรา"
