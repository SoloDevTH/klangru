    ai_assisted: true

  - id: phy.n3.p014
    topics: [physics.dynamics.newton-third]
    difficulty: 3
    type: numeric
    stem: "แม่ค้าที่ตลาดน้ำพายเรือ ไม้พายดันน้ำไปข้างหลังด้วยแรง $150\\ \\mathrm{N}$ เรือรวมแม่ค้าและสินค้ามีมวล $200\\ \\mathrm{kg}$ และน้ำมีแรงต้านเรือ $50\\ \\mathrm{N}$ เรือมีความเร่งเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s²)"
    answer: { value: 0.5, tolerance: 0.01, unit: m/s² }
    hints:
      - "ไม้พายดันน้ำไปข้างหลัง น้ำจึงดันไม้พาย (และเรือ) ไปข้างหน้าด้วยแรงเท่าใด"
      - "แรงลัพธ์ต่อเรือ $=$ แรงที่น้ำดันไปข้างหน้า $-$ แรงต้าน"
    misconceptions:
      - { match: 0.75, feedback: "ดูเหมือนลืมแรงต้านของน้ำ $50\\ \\mathrm{N}$ ที่ต้านเรืออยู่" }
      - { match: 0, feedback: "แรงที่ไม้พายดันน้ำกับแรงที่น้ำดันไม้พายกระทำต่อวัตถุคนละก้อน จึงไม่หักล้างกัน แรงที่กระทำต่อเรือคือแรงที่น้ำดันไปข้างหน้า" }
    solution: "น้ำดันไม้พายไปข้างหน้า $150\\ \\mathrm{N}$ แรงลัพธ์ต่อเรือ $= 150 - 50 = 100\\ \\mathrm{N}$ จึงได้ $a = \\dfrac{100}{200} = 0.5\\ \\mathrm{m/s^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.n3.p015
    topics: [physics.dynamics.newton-third]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "หนังสือวางนิ่งบนโต๊ะ ภาพแสดงแรงสี่แรง: $P$ โลกดึงหนังสือ $Q$ โต๊ะดันหนังสือ $R$ หนังสือกดโต๊ะ และ $S$ หนังสือดึงโลก คู่ใดเป็นคู่กิริยา–ปฏิกิริยาตามกฎข้อที่ 3 (เลือกทุกข้อที่ถูก)"
    figure: { src: book-table-pqrs.svg, alt: "หนังสือบนโต๊ะซึ่งตั้งบนพื้นโลก ลูกศร P ชี้ลงจากหนังสือ ลูกศร Q ชี้ขึ้นจากหนังสือ ลูกศร R ชี้ลงจากผิวโต๊ะใต้หนังสือ และลูกศร S ชี้ขึ้นจากพื้นโลกใต้โต๊ะ" }
    choices:
      - { id: a, text: "$P$ กับ $Q$", feedback: "ทั้งสองกระทำต่อหนังสือก้อนเดียวกันและเป็นแรงคนละชนิด จึงเป็นแรงที่สมดุลกัน ไม่ใช่คู่ตามกฎข้อที่ 3" }
      - { id: b, text: "$P$ กับ $S$", correct: true }
      - { id: c, text: "$Q$ กับ $R$", correct: true }
      - { id: d, text: "$P$ กับ $R$", feedback: "$P$ เป็นแรงโน้มถ่วงจากโลก $R$ เป็นแรงสัมผัสที่หนังสือกดโต๊ะ เป็นแรงคนละชนิดและคนละคู่วัตถุ" }
    hints:
      - "คู่ตามกฎข้อที่ 3 เกิดจากวัตถุสองชิ้นเดียวกัน ทำต่อกันกลับไปกลับมา"
      - "สลับประธานกับกรรม: \"โลกดึงหนังสือ\" คู่กับอะไร \"โต๊ะดันหนังสือ\" คู่กับอะไร"
    solution: "\"โลกดึงหนังสือ\" ($P$) คู่กับ \"หนังสือดึงโลก\" ($S$) และ \"โต๊ะดันหนังสือ\" ($Q$) คู่กับ \"หนังสือกดโต๊ะ\" ($R$) ส่วน $P$ กับ $Q$ เท่ากันเพราะหนังสือสมดุล ไม่ใช่เพราะกฎข้อที่ 3"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.n3.p016
    topics: [physics.dynamics.newton-third]
    difficulty: 3
    type: numeric
    stem: "ดันกล่อง A มวล $5\\ \\mathrm{kg}$ ด้วยแรง $24\\ \\mathrm{N}$ บนพื้นลื่น กล่อง A ดันกล่อง B มวล $3\\ \\mathrm{kg}$ ที่วางชิดอยู่ ดังภาพ กล่อง B ดันกล่อง A กลับด้วยแรงเท่าใด (ตอบเป็นตัวเลขในหน่วย N)"
    figure: { src: blocks-contact-5-3.svg, alt: "กล่อง A มวล 5 kg และกล่อง B มวล 3 kg วางชิดกันบนพื้นลื่น มีแรง 24 N ดันกล่อง A จากด้านซ้ายไปทางขวา" }
    answer: { value: 9, tolerance: 0.09, unit: N }
    hints:
      - "หาความเร่งของทั้งสองกล่องก่อน โดยมองเป็นก้อนเดียว"
      - "แรงที่ A ดัน B คือแรงลัพธ์ของ B $= m_B a$"
      - "แรงที่ B ดัน A เท่ากับแรงที่ A ดัน B ตามกฎข้อที่ 3"
    misconceptions:
      - { match: 24, feedback: "แรง $24\\ \\mathrm{N}$ กระทำต่อกล่อง A กล่อง B ต้องการแรงแค่พอให้มวล $3\\ \\mathrm{kg}$ เร่งไปด้วยกัน" }
      - { match: 15, feedback: "นั่นคือแรงลัพธ์ของกล่อง A ($m_A a$) แรงระหว่างกล่องหาจากกล่อง B ($m_B a$)" }
    solution: "$a = \\dfrac{24}{5 + 3} = 3\\ \\mathrm{m/s^2}$ แรงที่ A ดัน B $= 3 \\times 3 = 9\\ \\mathrm{N}$ ดังนั้น B ดัน A กลับ $9\\ \\mathrm{N}$ (ตรวจ: $24 - 9 = 15 = 5 \\times 3$ ✓)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.n3.p017
    topics: [physics.dynamics.newton-third]
    difficulty: 4
    type: numeric
    stem: "จรวดมวล $2000\\ \\mathrm{kg}$ ขณะขึ้นจากฐานปล่อย เครื่องยนต์ดันแก๊สพุ่งลงด้วยแรง $30000\\ \\mathrm{N}$ จรวดมีความเร่งขึ้นเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย m/s²)"
    answer: { value: 5.2, tolerance: 0.05, unit: m/s² }
    hints:
      - "จรวดดันแก๊สลง แก๊สจึงดันจรวดขึ้นด้วยแรงเท่าใด"
      - "แรงที่กระทำต่อจรวด: แรงจากแก๊สขึ้น และน้ำหนักลง"
    misconceptions:
      - { match: 15, feedback: "ดูเหมือนลืมน้ำหนักของจรวด $2000 \\times 9.8 = 19600\\ \\mathrm{N}$ ที่ดึงลง" }
      - { match: 0, feedback: "แรงที่จรวดดันแก๊สกับแรงที่แก๊สดันจรวดกระทำต่อวัตถุคนละก้อน จึงไม่หักล้างกัน" }
    solution: "แก๊สดันจรวดขึ้น $30000\\ \\mathrm{N}$ (กฎข้อที่ 3) แรงลัพธ์ $= 30000 - 19600 = 10400\\ \\mathrm{N}$ จึงได้ $a = \\dfrac{10400}{2000} = 5.2\\ \\mathrm{m/s^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

