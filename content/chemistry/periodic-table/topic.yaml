id: chemistry.matter.periodic-table
subject: chemistry
title: { th: ตารางธาตุและการจัดเรียงอิเล็กตรอน, en: The periodic table and electron arrangement }
summary: ธาตุในตารางธาตุเรียงตามเลขอะตอม คาบบอกจำนวนชั้นของอิเล็กตรอน หมู่บอกจำนวนเวเลนซ์อิเล็กตรอน และสมบัติของธาตุเปลี่ยนอย่างมีแบบแผน
difficulty: 3.5
minutes: 30
prerequisites: [chemistry.matter.atoms]
encompasses:
  - { id: chemistry.matter.atoms, weight: 0.4 }
curriculum_tags: []
lessons:
  - type: figure
    src: periodic-map.svg
    alt: "ตารางธาตุ 118 ธาตุ คาบ 1–7 หมู่ 1–18 พร้อมแถวแลนทาไนด์และแอกทิไนด์ด้านล่าง ระบายสีสี่กลุ่ม: โลหะกลุ่มเรพรีเซนเททีฟสีฟ้าอยู่หมู่ 1–2 และล่างซ้ายของหมู่ 13–16, โลหะแทรนซิชันสีส้มอยู่หมู่ 3–12, กึ่งโลหะสีเขียวคือ B Si Ge As Sb Te เรียงเป็นขั้นบันได, อโลหะสีเหลืองอยู่บนขวาและหมู่ 18 รวมทั้ง H ลูกศรด้านบนชี้ไปทางขวา: อะตอมเล็กลง พลังงานไอออไนเซชันและอิเล็กโทรเนกาติวิตีสูงขึ้น ความเป็นโลหะลดลง ลูกศรด้านซ้ายชี้ลง: อะตอมใหญ่ขึ้น ความเป็นโลหะเพิ่มขึ้น"
    caption: "ตารางธาตุแบ่งตามสมบัติ และทิศทางของแนวโน้มสำคัญ"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: ionization-energy.svg
    alt: "กราฟเส้นพลังงานไอออไนเซชันลำดับที่ 1 ของธาตุ Z = 1 ถึง 20 ค่าสูงขึ้นเป็นขั้นตามคาบ ยอดอยู่ที่แก๊สมีตระกูล He 2372, Ne 2081, Ar 1521 kJ/mol และตกต่ำสุดทันทีที่โลหะแอลคาไล Li 520, Na 496, K 419 kJ/mol"
    caption: "พลังงานไอออไนเซชันเพิ่มตามคาบ แล้วตกลงทุกครั้งที่เริ่มชั้นใหม่"
  - { type: check, problem: chem.pt.p014, prompt: "ใช้แนวโน้มขนาดอะตอมตอบคำถามนี้" }
  - type: worked-example
    title: ทำนายสูตรสารประกอบของแคลเซียมกับฟลูออรีน
    problem: "แคลเซียม ($Z = 20$) รวมกับฟลูออรีน ($Z = 9$) เป็นแร่ฟลูออไรต์ จงทำนายสูตรของสารประกอบนี้"
    steps:
      - text: "จัดเรียงอิเล็กตรอน: Ca เป็น 2, 8, 8, 2 และ F เป็น 2, 7"
      - text: "Ca เป็นโลหะหมู่ 2 เสียเวเลนซ์อิเล็กตรอน 2 ตัว ได้ $\\mathrm{Ca^{2+}}$"
        why: "เสีย 2 ตัวง่ายกว่ารับเพิ่ม 6 ตัว และเหลือ 2, 8, 8 ที่เต็มเหมือนอาร์กอน"
      - text: "F เป็นอโลหะหมู่ 17 รับอิเล็กตรอน 1 ตัว ได้ $\\mathrm{F^-}$"
      - text: "จัดให้ประจุรวมเป็นศูนย์: $\\mathrm{Ca^{2+}}$ 1 ไอออนต้องคู่กับ $\\mathrm{F^-}$ 2 ไอออน เพราะ $(+2) + 2(-1) = 0$"
        why: "อิเล็กตรอน 2 ตัวที่ Ca เสียต้องมีที่ไป F หนึ่งอะตอมรับได้ตัวเดียว จึงต้องใช้ F สองอะตอม"
    answer: "$\\mathrm{CaF_2}$"
  - type: worked-example
    title: เรียงพลังงานไอออไนเซชันของ Na, Mg และ K
    problem: "เรียงธาตุ Na (คาบ 3 หมู่ 1), Mg (คาบ 3 หมู่ 2) และ K (คาบ 4 หมู่ 1) ตามพลังงานไอออไนเซชันลำดับที่ 1 จากน้อยไปมาก พร้อมเหตุผล"
    steps:
      - text: "เทียบ Na กับ Mg ซึ่งอยู่คาบเดียวกัน: Mg อยู่ทางขวา มีโปรตอนมากกว่า 1 ตัว แต่เวเลนซ์อิเล็กตรอนอยู่ชั้นเดียวกัน จึงถูกดึงแรงกว่า"
        why: "ในคาบเดียวกัน จำนวนชั้นเท่ากัน สิ่งที่เปลี่ยนคือแรงดึงของนิวเคลียส"
      - text: "สรุปคู่แรก: พลังงานไอออไนเซชัน Na < Mg"
      - text: "เทียบ Na กับ K ซึ่งอยู่หมู่เดียวกัน: K มี 4 ชั้น เวเลนซ์อิเล็กตรอนอยู่ไกลกว่าและมีชั้นในบังมากกว่า จึงดึงออกง่ายกว่า"
      - text: "สรุปคู่ที่สอง: K < Na แล้วรวมสองข้อสรุปเข้าด้วยกัน"
      - text: "ตรวจกับข้อมูลจริง: K 419, Na 496, Mg 738 kJ/mol"
    answer: "K < Na < Mg"
  - { type: check, problem: chem.pt.p017, prompt: "ลองทำนายสูตรด้วยวิธีเดียวกัน" }
  - type: simulation
    title: เติมอิเล็กตรอนทีละชั้น (PhET Build an Atom)
    url: https://phet.colorado.edu/en/simulations/build-an-atom
    provider: phet
    note: สร้างอะตอมตั้งแต่ไฮโดรเจนถึงนีออน สังเกตว่าอิเล็กตรอนเต็มชั้นในสุด 2 ตัวก่อน แล้วจึงไปอยู่ชั้นถัดไปได้อีก 8 ตัว
glossary:
  - { term: คาบ, definition: แถวแนวนอนของตารางธาตุ ธาตุในคาบเดียวกันมีจำนวนชั้นของอิเล็กตรอนเท่ากัน }
  - { term: หมู่, definition: แถวแนวตั้งของตารางธาตุ ธาตุหมู่เดียวกันมีเวเลนซ์อิเล็กตรอนเท่ากันและมีสมบัติทางเคมีคล้ายกัน }
  - { term: เวเลนซ์อิเล็กตรอน, definition: อิเล็กตรอนในชั้นนอกสุดของอะตอม เป็นตัวกำหนดว่าธาตุเกิดปฏิกิริยาอย่างไร }
  - { term: แก๊สมีตระกูล, definition: ธาตุหมู่ 18 ชั้นนอกสุดมีอิเล็กตรอนเต็ม จึงแทบไม่ทำปฏิกิริยากับธาตุอื่น }
flashcards:
  - { front: "จำนวนอิเล็กตรอนสูงสุดในชั้นที่ 1, 2, 3 (แบบง่ายสำหรับธาตุลำดับ 1–20)", back: "2, 8, 8 เช่น แคลเซียม ($Z = 20$) จัดเป็น 2, 8, 8, 2" }
  - { front: "คาบและหมู่บอกอะไรเกี่ยวกับการจัดเรียงอิเล็กตรอน", back: "คาบ = จำนวนชั้นที่มีอิเล็กตรอน · หมู่ 1–2 = จำนวนเวเลนซ์อิเล็กตรอน · หมู่ 13–18 = เวเลนซ์อิเล็กตรอน + 10 (ยกเว้นฮีเลียม)" }
  - { front: "ขนาดอะตอมเปลี่ยนอย่างไรในตารางธาตุ", back: "ใหญ่ขึ้นเมื่อลงล่างในหมู่เดียวกัน (ชั้นเพิ่ม) และเล็กลงเมื่อไปทางขวาในคาบเดียวกัน (โปรตอนดึงแรงขึ้น)" }
  - { front: "ชื่อหมู่ 1, 2, 17 และ 18", back: "โลหะแอลคาไล · โลหะแอลคาไลน์เอิร์ท · แฮโลเจน · แก๊สมีตระกูล" }
  - { front: "พลังงานไอออไนเซชันและอิเล็กโทรเนกาติวิตีเปลี่ยนอย่างไร", back: "สูงขึ้นเมื่อไปทางขวาในคาบ และลดลงเมื่อลงล่างในหมู่ (ตรงข้ามกับขนาดอะตอม)" }
