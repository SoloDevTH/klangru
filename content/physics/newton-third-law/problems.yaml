      - { match: 4, feedback: "ดูเหมือนนำแรงกดของมือไปลบออกจากน้ำหนัก แต่ทั้งน้ำหนักและแรงจากมือชี้ลงทั้งคู่ จึงต้องบวกกัน" }
    solution: "หนังสือนิ่ง ให้ทิศขึ้นเป็นบวก: $N + (-12) + (-8) = 0$ ได้แรงตั้งฉากที่โต๊ะดันหนังสือ $N = 20\\ \\mathrm{N}$ ตามกฎข้อที่ 3 หนังสือกดโต๊ะลงด้วยแรง $20\\ \\mathrm{N}$ เท่ากัน"
