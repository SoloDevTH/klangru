<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="sans-serif" font-size="13">
<title>แผนภาพกรอบเกณฑ์คุณภาพการบริหารจัดการแบบทั่วไป วาดตามความเข้าใจของคลังรู้ โครงร่างองค์กรอยู่ด้านบน หมวดกระบวนการหกหมวดเชื่อมไปสู่ผลลัพธ์</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
<text x="450.0" y="26.0" text-anchor="middle" font-size="16" fill="#222" font-weight="bold">โครงของเกณฑ์คุณภาพการบริหารจัดการ (วาดใหม่ในแบบของคลังรู้)</text>
<rect x="40.0" y="44.0" width="820.0" height="52.0" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
<text x="450.0" y="66.0" text-anchor="middle" font-size="14" fill="#4527a0" font-weight="bold">โครงร่างองค์กร: ลักษณะองค์กร สภาวการณ์ ความท้าทาย และความได้เปรียบเชิงกลยุทธ์</text>
<text x="450.0" y="86.0" text-anchor="middle" font-size="12" fill="#4527a0">ไม่ให้คะแนน แต่ใช้ตีความทุกหมวด</text>
<rect x="60.0" y="130.0" width="200.0" height="56.0" rx="8" fill="#e3f2fd" stroke="#1f5fa8" stroke-width="2"/>
<text x="160.0" y="163.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">1 การนำองค์กร</text>
<rect x="60.0" y="210.0" width="200.0" height="56.0" rx="8" fill="#e3f2fd" stroke="#1f5fa8" stroke-width="2"/>
<text x="160.0" y="243.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">2 กลยุทธ์</text>
<rect x="60.0" y="290.0" width="200.0" height="56.0" rx="8" fill="#e3f2fd" stroke="#1f5fa8" stroke-width="2"/>
<text x="160.0" y="323.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">3 ลูกค้า</text>
<rect x="560.0" y="130.0" width="200.0" height="56.0" rx="8" fill="#e3f2fd" stroke="#1f5fa8" stroke-width="2"/>
<text x="660.0" y="163.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">5 บุคลากร</text>
<rect x="560.0" y="210.0" width="200.0" height="56.0" rx="8" fill="#e3f2fd" stroke="#1f5fa8" stroke-width="2"/>
<text x="660.0" y="243.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">6 การปฏิบัติการ</text>
<rect x="330.0" y="150.0" width="170.0" height="150.0" rx="10" fill="#fff3e0" stroke="#b26a00" stroke-width="2.5"/>
<text x="415.0" y="205.0" text-anchor="middle" font-size="17" fill="#b26a00" font-weight="bold">ผลลัพธ์</text>
<text x="415.0" y="230.0" text-anchor="middle" font-size="12" fill="#222">ผลิตภัณฑ์ ลูกค้า บุคลากร</text>
<text x="415.0" y="248.0" text-anchor="middle" font-size="12" fill="#222">การนำ การเงิน กลยุทธ์</text>
<line x1="260.0" y1="158.0" x2="328.0" y2="225.0" stroke="#555" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="260.0" y1="238.0" x2="328.0" y2="225.0" stroke="#555" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="260.0" y1="318.0" x2="328.0" y2="225.0" stroke="#555" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="560.0" y1="158.0" x2="502.0" y2="225.0" stroke="#555" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="560.0" y1="238.0" x2="502.0" y2="225.0" stroke="#555" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40.0" y="370.0" width="820.0" height="52.0" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="450.0" y="392.0" text-anchor="middle" font-size="14" fill="#1b5e20" font-weight="bold">4 การวัด การวิเคราะห์ และการจัดการความรู้ (ฐานข้อมูลของทุกหมวด)</text>
<text x="450.0" y="412.0" text-anchor="middle" font-size="12" fill="#1b5e20">ข้อมูลถูกต้อง ปลอดภัย พร้อมใช้ ความรู้ถูกแบ่งปัน</text>
<line x1="160.0" y1="368.0" x2="160.0" y2="350.0" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="415.0" y1="368.0" x2="415.0" y2="302.0" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="660.0" y1="368.0" x2="660.0" y2="350.0" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="450.0" y="452.0" text-anchor="middle" font-size="12" fill="#444">TQA 2567–2568 และ PMQA 4.0 แยกผลลัพธ์เป็นหมวด 7 · Baldrige 2026 รวมคำถามผลลัพธ์ไว้ในแต่ละหมวดและเหลือหกหมวด</text>
</svg>
