<text x="304.0" y="240" font-size="20" fill="#222" text-anchor="middle" font-weight="normal">清迈的老街</text>
<line x1="392" y1="205.0" x2="414" y2="205.0" stroke="#555" stroke-width="3" stroke-linecap="round"/>
<rect x="418" y="90" width="168" height="230" rx="12" fill="#fff" stroke="#8a5a00" stroke-width="3"/>
