id: health.body.circulatory-respiratory-reproductive-care
subject: health
title: { th: "ระบบไหลเวียนโลหิต ระบบหายใจ และระบบสืบพันธุ์: ความสำคัญและการดูแล", en: "The circulatory, respiratory and reproductive systems: why they matter and how to care for them" }
summary: ความสำคัญของระบบไหลเวียนโลหิต ระบบหายใจ และระบบสืบพันธุ์ต่อสุขภาพและการเติบโต การออกกำลังกาย การเลี่ยงควันบุหรี่และฝุ่น สุขอนามัยของอวัยวะสืบพันธุ์ และอาการที่ต้องพบแพทย์
difficulty: 3
minutes: 30
prerequisites: [health.body.internal-organs]
encompasses:
  - { id: health.body.internal-organs, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: สามระบบทำงานร่วมกัน
    src: three-systems.svg
    alt: "แผนภาพกล่องเชื่อมด้วยลูกศร ระบบหายใจ (จมูก หลอดลม ปอด) รับออกซิเจนเข้าและขับคาร์บอนไดออกไซด์ออก ส่งออกซิเจนให้ระบบไหลเวียนโลหิต (หัวใจ หลอดเลือด เลือด) ซึ่งลำเลียงออกซิเจน สารอาหาร และของเสีย ไปยังเซลล์ทั่วร่างกายที่ใช้สร้างพลังงานเพื่อเคลื่อนไหวและเติบโต ระบบสืบพันธุ์สร้างเซลล์สืบพันธุ์และฮอร์โมนเพศ ฮอร์โมนเดินทางไปกับเลือด ทำให้ร่างกายเปลี่ยนแปลงในวัยรุ่น กล่องการดูแลทั้งสามระบบ ออกกำลังกาย ไม่สูบบุหรี่ เลี่ยงฝุ่นควัน นอนพอ รักษาความสะอาด"
    caption: "แผนภาพอย่างง่าย ไม่ใช่ภาพกายวิภาค"
  - type: worked-example
    title: อ่านกราฟชีพจรหลังออกกำลังกาย
    problem: "ภูผากระโดดเชือก 2 นาที แล้วนับชีพจรเป็นระยะ (ข้อมูลสมมติ) ชีพจรเพิ่มขึ้นเท่าไร และหลังหยุด 4 นาทีกลับใกล้ค่าขณะพักหรือยัง"
    figure:
      src: pulse-log.svg
      alt: "กราฟเส้น ชีพจรของภูผาก่อนและหลังกระโดดเชือก 2 นาที ข้อมูลสมมติ หน่วยครั้งต่อนาที ขณะพัก 84 ทันทีหลังกระโดด 148 หลังหยุด 1 นาที 124 2 นาที 104 3 นาที 92 4 นาที 86"
    steps:
      - text: "ขณะพัก 84 ครั้งต่อนาที ทันทีหลังกระโดด 148 ครั้งต่อนาที เพิ่มขึ้น 148 − 84 = 64 ครั้งต่อนาที"
        why: "กล้ามเนื้อต้องการออกซิเจนมากขึ้น หัวใจจึงเต้นเร็วขึ้นเพื่อส่งเลือด และเราหายใจเร็วขึ้นเพื่อรับออกซิเจน"
      - text: "หลังหยุด 4 นาที ชีพจร 86 ต่างจากขณะพัก 86 − 84 = 2 ครั้งต่อนาที"
      - text: "ชีพจรลดลงเร็วในนาทีแรก (148 → 124) แล้วค่อย ๆ ช้าลงจนใกล้ค่าขณะพัก"
        why: "ร่างกายที่ออกกำลังกายสม่ำเสมอมักฟื้นตัวได้เร็ว"
    answer: "เพิ่มขึ้น 64 ครั้งต่อนาที และหลัง 4 นาทีกลับมาใกล้ค่าขณะพักแล้ว (ต่างกัน 2 ครั้งต่อนาที)"
  - { type: check, problem: health.body.circulatory-respiratory-reproductive-care.p005, prompt: "ลองนับชีพจรของตัวเองดู" }
  - { type: check, problem: health.body.circulatory-respiratory-reproductive-care.p009 }
glossary:
  - { term: ชีพจร, definition: "จังหวะการเต้นของหัวใจที่คลำได้ตามหลอดเลือดแดง เช่น ที่ข้อมือ นับเป็นครั้งต่อนาที" }
  - { term: ถุงลม, definition: "ถุงเล็ก ๆ ในปอด เป็นที่แลกเปลี่ยนออกซิเจนและคาร์บอนไดออกไซด์กับเลือด" }
  - { term: ฮอร์โมนเพศ, definition: "สารที่อวัยวะสืบพันธุ์สร้าง เดินทางไปกับเลือด ทำให้ร่างกายเปลี่ยนแปลงในวัยรุ่น" }
  - { term: ควันบุหรี่มือสอง, definition: "ควันบุหรี่ที่คนไม่ได้สูบหายใจเข้าไปจากคนรอบข้าง" }
flashcards:
  - { front: "หน้าที่ของระบบไหลเวียนโลหิต", back: "หัวใจสูบฉีดเลือดพาออกซิเจนและสารอาหารไปเซลล์ และพาของเสียไปกำจัด" }
  - { front: "ดูแลหัวใจและปอด", back: "ขยับร่างกายวันละ 60 นาที ไม่สูบบุหรี่ เลี่ยงควันและฝุ่น กินอาหารครบหมู่ นอนพอ" }
  - { front: "ดูแลอวัยวะสืบพันธุ์", back: "ล้างภายนอกด้วยน้ำสะอาด ซับแห้ง เปลี่ยนชุดชั้นในทุกวัน เช็ดหน้าไปหลัง ไม่ฉีดล้างภายใน" }
  - { front: "อาการที่ต้องไปโรงพยาบาลทันที", back: "เจ็บหน้าอก หายใจไม่ได้ เป็นลมขณะออกกำลังกาย ปวดอัณฑะรุนแรงทันที" }
