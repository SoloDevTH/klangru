  - id: chemistry.descriptive.metals-metalloids.p016
    topics: [chemistry.descriptive.metals-metalloids]
    difficulty: 5
    type: numeric
    stem: 'โรงงานทำทองแดงให้บริสุทธิ์ด้วยการอิเล็กโทรไลซิสในสารละลาย $\mathrm{CuSO_4}$ โดยใช้กระแส 2.00 A เป็นเวลา 1.00 ชั่วโมง ทองแดงที่เคลือบบนแคโทดได้กี่กรัม กำหนด $F = 96485$ C/mol และ $M(\mathrm{Cu}) = 63.55$ g/mol (ตอบเป็นกรัม)'
    answer: { value: 2.371, tolerance: 0.005, unit: g }
    hints:
      - 'ประจุรวม $Q = I \times t$ โดยแปลงชั่วโมงเป็นวินาทีก่อน'
      - 'ปฏิกิริยาที่แคโทดคือ $\mathrm{Cu^{2+} + 2e^{-} \rightarrow Cu}$ ใช้อิเล็กตรอน 2 โมลต่อ Cu 1 โมล'
    misconceptions:
      - { match: 4.742, feedback: 'ใช้อิเล็กตรอน 1 โมลต่อ Cu ทั้งที่ Cu²⁺ ต้องการ 2 โมล' }
