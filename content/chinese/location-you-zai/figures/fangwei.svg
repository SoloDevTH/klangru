<text x="505.0" y="169.0" font-size="14" text-anchor="middle" fill="#7a5a00" font-weight="normal">qiánbian · หน้า</text>
<line x1="505.0" y1="176.0" x2="505.0" y2="270.0" stroke="#7a5a00" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a7a5a00)"/>
