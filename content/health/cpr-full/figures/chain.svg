<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" width="780" height="230" font-family="sans-serif">
<title>ห่วงโซ่การรอดชีวิต</title>
<rect x="0" y="0" width="780" height="230" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="390.0" y="28.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">ห่วงโซ่การรอดชีวิตเมื่อหัวใจหยุดเต้นนอกโรงพยาบาล</text>
<ellipse cx="85" cy="115" rx="80" ry="48" fill="#fadbd8" stroke="#333" stroke-width="3"/>
<text x="85.0" y="110.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">1 รู้และโทร</text>
<text x="85.0" y="132.0" font-size="12" text-anchor="middle" fill="#111">1669</text>
<ellipse cx="237" cy="115" rx="80" ry="48" fill="#fcf3cf" stroke="#333" stroke-width="3"/>
<text x="237.0" y="110.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">2 CPR ทันที</text>
<text x="237.0" y="132.0" font-size="12" text-anchor="middle" fill="#111">กดหน้าอกคุณภาพสูง</text>
<ellipse cx="389" cy="115" rx="80" ry="48" fill="#d5f5e3" stroke="#333" stroke-width="3"/>
<text x="389.0" y="110.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">3 AED</text>
<text x="389.0" y="132.0" font-size="12" text-anchor="middle" fill="#111">ช็อกให้เร็วที่สุด</text>
<ellipse cx="541" cy="115" rx="80" ry="48" fill="#d6eaf8" stroke="#333" stroke-width="3"/>
<text x="541.0" y="110.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">4 ทีมแพทย์ฉุกเฉิน</text>
<text x="541.0" y="132.0" font-size="12" text-anchor="middle" fill="#111">รักษาขั้นสูง</text>
<ellipse cx="693" cy="115" rx="80" ry="48" fill="#e8daef" stroke="#333" stroke-width="3"/>
<text x="693.0" y="110.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">5 โรงพยาบาล</text>
<text x="693.0" y="132.0" font-size="12" text-anchor="middle" fill="#111">ดูแลและฟื้นฟู</text>
<text x="390.0" y="200.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#922b21">ห่วงที่ 1–3 ทำได้โดยคนที่อยู่ในที่เกิดเหตุ ก่อนรถพยาบาลมาถึง</text>
</svg>
