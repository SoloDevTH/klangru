problems:
  - id: management.quality.quality-planning.p001
    topics: [management.quality.quality-planning]
    difficulty: 1
    type: match
    stem: "โรงแรมแห่งหนึ่งในเชียงใหม่ (สมมติ) จัดความต้องการของแขกตามแบบจำลองคาโน จับคู่ให้ถูกต้อง"
    pairs:
      - { left: "ผ้าปูที่นอนสะอาด ไม่มีคราบ", right: "พื้นฐานที่ต้องมี" }
      - { left: "ความเร็วของอินเทอร์เน็ตในห้องพัก", right: "มิติเดียว" }
      - { left: "การ์ดเขียนมือต้อนรับพร้อมขนมพื้นเมือง", right: "สร้างความประทับใจ" }
      - { left: "สีของปากกาที่วางในห้อง", right: "ไม่มีผล" }
    hints:
      - "ถ้าขาดสิ่งนั้น แขกจะไม่พอใจมากหรือไม่ ถ้ามี แขกจะพอใจเพิ่มหรือไม่"
      - "สิ่งที่ยิ่งดียิ่งพอใจเป็นเส้นตรงคือมิติเดียว"
    solution: "ผ้าปูสะอาดเป็นสิ่งที่แขกคาดหวังอยู่แล้ว (พื้นฐาน) อินเทอร์เน็ตยิ่งเร็วยิ่งพอใจ (มิติเดียว) การ์ดและขนมไม่มีก็ไม่บ่นแต่มีแล้วประทับใจ และสีปากกาแขกไม่สนใจ (ไม่มีผล)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.quality-planning.p002
    topics: [management.quality.quality-planning]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นการเก็บเสียงของลูกค้าแบบเชิงรุก"
    choices:
      - { id: a, text: "ทีมออกแบบไปสังเกตชาวสวนใช้เครื่องพ่นยาในสวนจริงและสัมภาษณ์หลังใช้งาน", correct: true }
      - { id: b, text: "รวบรวมข้อร้องเรียนที่ลูกค้าโทรมาที่ศูนย์บริการ", feedback: "ข้อร้องเรียนเป็นข้อมูลที่ลูกค้าส่งมาเอง จึงเป็นเชิงรับ" }
      - { id: c, text: "นับจำนวนสินค้าที่ลูกค้าส่งคืน", feedback: "สินค้าคืนเป็นข้อมูลที่เกิดขึ้นเองหลังลูกค้าไม่พอใจ จึงเป็นเชิงรับ" }
      - { id: d, text: "อ่านรีวิวที่ลูกค้าเขียนในร้านค้าออนไลน์", feedback: "รีวิวที่ลูกค้าเขียนเองเป็นข้อมูลเชิงรับ องค์กรไม่ได้เป็นฝ่ายเริ่มถาม" }
    hints:
      - "เชิงรุกคือองค์กรเป็นฝ่ายออกไปถามหรือสังเกต"
      - "ข้อใดที่องค์กรเริ่มกิจกรรมเอง ไม่ได้รอให้ลูกค้าส่งมา"
    solution: "การสังเกตการใช้งานจริงและสัมภาษณ์เป็นการเก็บข้อมูลเชิงรุก ส่วนข้อร้องเรียน สินค้าคืน และรีวิวเป็นข้อมูลเชิงรับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.quality-planning.p003
    topics: [management.quality.quality-planning]
    difficulty: 1
    type: mcq
    stem: "บริษัทผลิตรถเข็นผู้ป่วยทดสอบในห้องปฏิบัติการว่ารับน้ำหนักได้ 120 kg ตามสเปก กิจกรรมนี้คืออะไร"
    choices:
      - { id: a, text: "การทวนสอบการออกแบบ", correct: true }
      - { id: b, text: "การยืนยันความใช้ได้ของการออกแบบ", feedback: "การยืนยันความใช้ได้ตรวจว่าตอบความต้องการของผู้ใช้ในสภาพจริง เช่น ให้ผู้ป่วยและผู้ดูแลทดลองใช้ ไม่ใช่การทดสอบตามสเปกในห้องแล็บ" }
      - { id: c, text: "การรับฟังเสียงลูกค้า", feedback: "เป็นการทดสอบผลิตภัณฑ์ ไม่ได้เก็บความต้องการจากลูกค้า" }
      - { id: d, text: "การจัดการข้อร้องเรียน", feedback: "ไม่มีข้อร้องเรียนในสถานการณ์นี้" }
    hints:
      - "ทดสอบเทียบกับอะไร: สเปกที่เขียนไว้ หรือความต้องการในการใช้งานจริง"
      - "ทวนสอบ = ตรงสเปกไหม"
    solution: "การทดสอบว่าผลิตภัณฑ์เป็นไปตามข้อกำหนดที่เขียนไว้ (120 kg) คือการทวนสอบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.quality-planning.p004
    topics: [management.quality.quality-planning]
    difficulty: 2
    type: numeric
    stem: "สถานีบริการน้ำมันแห่งหนึ่งถามลูกค้า 200 คนว่าจะแนะนำร้านให้คนอื่นหรือไม่ (0–10) ได้คะแนน 9–10 จำนวน 110 คน 7–8 จำนวน 60 คน และ 0–6 จำนวน 30 คน NPS เป็นเท่าใด"
    answer: { value: 40 }
    hints:
      - "NPS = ร้อยละผู้ให้ 9–10 − ร้อยละผู้ให้ 0–6"
      - "ร้อยละผู้ให้ 9–10 คือ $110/200 \\times 100$"
    misconceptions:
      - { match: 55, feedback: "นั่นคือร้อยละผู้แนะนำอย่างเดียว ต้องลบร้อยละผู้ไม่แนะนำ (0–6) ออก" }
      - { match: 80, feedback: "ดูเหมือนลบด้วยจำนวนคน (110 − 30) ต้องแปลงเป็นร้อยละก่อน" }
    solution: "ร้อยละผู้แนะนำ $= 110/200 = 55\\%$ ร้อยละผู้ไม่แนะนำ $= 30/200 = 15\\%$ NPS $= 55 - 15 = 40$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.quality-planning.p005
    topics: [management.quality.quality-planning]
    difficulty: 2
    type: numeric
    stem: "สำนักงานเขตแห่งหนึ่ง (สมมติ) สำรวจผู้รับบริการ 400 คน ให้คะแนน 1–5 มีผู้ให้ 4 หรือ 5 รวม 340 คน ร้อยละความพึงพอใจ (สัดส่วนผู้ให้ 4–5) เป็นเท่าใด (ตอบในหน่วย %)"
    answer: { value: 85, unit: "%" }
    hints:
      - "ร้อยละ = จำนวนผู้ให้ 4–5 ÷ ผู้ตอบทั้งหมด × 100"
      - "$340/400 \\times 100$"
    misconceptions:
      - { match: 15, feedback: "นั่นคือร้อยละของผู้ที่ไม่ได้ให้ 4–5" }
    solution: "$\\dfrac{340}{400} \\times 100 = 85\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.quality-planning.p006
    topics: [management.quality.quality-planning]
    difficulty: 2
    type: mcq
    stem: "แบบสอบถามคาโนถามเรื่องการแจ้งเตือนนัดทางแอปของโรงพยาบาล ผู้ป่วยส่วนใหญ่ตอบว่า \"ถ้ามี: ชอบ\" และ \"ถ้าไม่มี: เฉย ๆ\" ความต้องการนี้จัดอยู่ในกลุ่มใด"
    choices:
      - { id: a, text: "สร้างความประทับใจ", correct: true }
      - { id: b, text: "พื้นฐานที่ต้องมี", feedback: "พื้นฐานที่ต้องมีคือไม่มีแล้วไม่พอใจ แต่ผู้ป่วยตอบว่าไม่มีก็เฉย ๆ" }
      - { id: c, text: "มิติเดียว", feedback: "มิติเดียวคือมีแล้วชอบ และไม่มีแล้วไม่ชอบ แต่คำตอบนี้ไม่มีก็เฉย ๆ" }
      - { id: d, text: "ไม่มีผล", feedback: "ไม่มีผลคือเฉย ๆ ทั้งสองกรณี แต่คำตอบนี้มีแล้วชอบ" }
    hints:
      - "ดูคำตอบทั้งสองคำถามคู่กัน"
      - "มีแล้วชอบ แต่ไม่มีก็ไม่บ่น ตรงกับเส้นใดในแบบจำลองคาโน"
    solution: "มีแล้วชอบแต่ไม่มีก็ไม่ได้ไม่พอใจ คือคุณสมบัติที่สร้างความประทับใจ เมื่อทุกโรงพยาบาลมีกันหมด อาจกลายเป็นพื้นฐานที่ต้องมีในอนาคต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.quality-planning.p007
    topics: [management.quality.quality-planning]
    difficulty: 3
    type: numeric
    stem: "จากบ้านแห่งคุณภาพของกระติกน้ำในภาพ ข้อกำหนดทางเทคนิค \"ความแน่นของซีลฝา\" มีความสำคัญทางเทคนิคเท่าใด"
    figure:
      src: hoq.svg
      alt: "ตารางบ้านแห่งคุณภาพ ความต้องการของลูกค้าและความสำคัญ: เก็บความเย็นได้นาน 5, ฝาไม่รั่วซึม 4, ถือสบาย น้ำหนักเบา 3, ราคาไม่แพง 2 ข้อกำหนดทางเทคนิค: ความหนาฉนวน ความแน่นของซีลฝา น้ำหนักรวม ต้นทุนวัสดุ คะแนนความสัมพันธ์ แถวเก็บความเย็น: 9, 3, ว่าง, 1 แถวฝาไม่รั่ว: ว่าง, 9, ว่าง, 1 แถวถือสบาย: 3, ว่าง, 9, ว่าง แถวราคาไม่แพง: 3, 1, 1, 9"
    answer: { value: 53 }
    hints:
      - "ความสำคัญทางเทคนิค = ผลรวมของ (ความสำคัญของแถว × คะแนนในช่อง)"
      - "คอลัมน์ซีลฝามีคะแนน 3, 9, ว่าง, 1 ในแถวที่มีความสำคัญ 5, 4, 3, 2"
    misconceptions:
      - { match: 13, feedback: "นั่นคือผลรวมคะแนนความสัมพันธ์ ยังไม่ได้คูณความสำคัญของลูกค้า" }
      - { match: 44, feedback: "ดูเหมือนคูณ 9 กับความสำคัญ 5 ของแถวแรก ตรวจว่าเลข 9 อยู่ในแถวฝาไม่รั่ว (ความสำคัญ 4)" }
    solution: "$5(3) + 4(9) + 3(0) + 2(1) = 15 + 36 + 0 + 2 = 53$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.quality-planning.p008
    topics: [management.quality.quality-planning]
    difficulty: 4
    type: numeric
    stem: "จากบ้านแห่งคุณภาพของกระติกน้ำในภาพ \"น้ำหนักรวม\" มีความสำคัญทางเทคนิคคิดเป็นร้อยละเท่าใดของผลรวมความสำคัญทางเทคนิคทั้งสี่คอลัมน์ (ตอบในหน่วย % ทศนิยม 1 ตำแหน่ง)"
    figure:
      src: hoq.svg
      alt: "ตารางบ้านแห่งคุณภาพ ความต้องการของลูกค้าและความสำคัญ: เก็บความเย็นได้นาน 5, ฝาไม่รั่วซึม 4, ถือสบาย น้ำหนักเบา 3, ราคาไม่แพง 2 ข้อกำหนดทางเทคนิค: ความหนาฉนวน ความแน่นของซีลฝา น้ำหนักรวม ต้นทุนวัสดุ คะแนนความสัมพันธ์ แถวเก็บความเย็น: 9, 3, ว่าง, 1 แถวฝาไม่รั่ว: ว่าง, 9, ว่าง, 1 แถวถือสบาย: 3, ว่าง, 9, ว่าง แถวราคาไม่แพง: 3, 1, 1, 9"
    answer: { value: 17.2, unit: "%", tolerance: 0.15 }
    hints:
      - "คำนวณความสำคัญทางเทคนิคทั้งสี่คอลัมน์ แล้วหาผลรวม"
      - "คอลัมน์น้ำหนักรวม $= 3(9) + 2(1)$ แล้วหารด้วยผลรวมทั้งหมด"
    misconceptions:
      - { match: 25, feedback: "ดูเหมือนแบ่งเท่ากันสี่คอลัมน์ ต้องใช้คะแนนที่คำนวณจริง" }
      - { match: 29, feedback: "29 คือคะแนนของน้ำหนักรวม ต้องหารด้วยผลรวม 169 แล้วคูณ 100" }
    solution: "ฉนวน $45 + 9 + 6 = 60$ ซีล $15 + 36 + 2 = 53$ น้ำหนัก $27 + 2 = 29$ ต้นทุน $5 + 4 + 18 = 27$ รวม 169 ร้อยละของน้ำหนัก $= 29/169 \\times 100 \\approx 17.2\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.quality-planning.p009
    topics: [management.quality.quality-planning]
    difficulty: 3
    type: numeric
    stem: "แผ่นไม้สามแผ่นซ้อนกันเป็นชั้นวาง หนา $18.0 \\pm 0.20$, $12.0 \\pm 0.15$ และ $18.0 \\pm 0.20$ mm ถ้าคิดแบบกรณีแย่ที่สุด ความหนารวมมากที่สุดเป็นเท่าใด (ตอบในหน่วย mm)"
    answer: { value: 48.55, unit: mm, tolerance: 0.005 }
    hints:
      - "ความหนารวมตามแบบคือผลรวมของค่าเป้าหมาย"
      - "กรณีแย่ที่สุดบวกพิกัดทุกชิ้นเข้าไปพร้อมกัน"
    misconceptions:
      - { match: 48.0, feedback: "นั่นคือความหนาตามแบบ ยังไม่ได้บวกพิกัด" }
      - { match: 48.32, feedback: "นั่นคือแบบ RSS ($\\sqrt{0.2^2 + 0.15^2 + 0.2^2} \\approx 0.32$) โจทย์ถามกรณีแย่ที่สุด" }
    solution: "ตามแบบ $18 + 12 + 18 = 48.0$ mm พิกัดกรณีแย่ที่สุด $0.20 + 0.15 + 0.20 = 0.55$ mm ความหนามากที่สุด $48.0 + 0.55 = 48.55$ mm"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.quality-planning.p010
    topics: [management.quality.quality-planning]
    difficulty: 4
    type: numeric
    stem: "ชิ้นส่วนสี่ชิ้นต่อกันเป็นแนวเดียว แต่ละชิ้นมีพิกัด $\\pm 0.06$ mm และผันแปรอิสระต่อกัน พิกัดของความยาวรวมแบบ RSS เป็น ± เท่าใด (ตอบในหน่วย mm)"
    answer: { value: 0.12, unit: mm, tolerance: 0.002 }
    hints:
      - "RSS: $\\sqrt{t_1^2 + t_2^2 + t_3^2 + t_4^2}$"
      - "ชิ้นเท่ากันทั้งสี่ จึงได้ $\\sqrt{4 \\times 0.06^2} = 2 \\times 0.06$"
    misconceptions:
      - { match: 0.24, feedback: "นั่นคือแบบกรณีแย่ที่สุด ($4 \\times 0.06$) RSS รวมกำลังสองแล้วถอดราก" }
      - { match: 0.0144, feedback: "ลืมถอดรากที่สอง" }
    solution: "$\\sqrt{4 \\times 0.06^2} = \\sqrt{0.0144} = 0.12$ mm ครึ่งหนึ่งของแบบกรณีแย่ที่สุด (0.24 mm)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.quality-planning.p011
    topics: [management.quality.quality-planning]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการจัดการข้อร้องเรียนของศูนย์บริการประชาชนให้ถูกต้อง"
    items:
      - "รับเรื่องและบันทึกในระบบ"
      - "ตอบรับผู้ร้องเรียนและแจ้งกำหนดเวลาดำเนินการ"
      - "ตรวจสอบข้อเท็จจริง"
      - "แก้ไขปัญหาให้ผู้ร้องเรียน"
      - "แจ้งผลและติดตามความพอใจ"
      - "วิเคราะห์สาเหตุและปรับกระบวนการเพื่อป้องกันการเกิดซ้ำ"
    hints:
      - "ต้องบันทึกก่อนจึงติดตามได้ และต้องตรวจข้อเท็จจริงก่อนแก้"
      - "การป้องกันไม่ให้เกิดซ้ำทำหลังจากเข้าใจปัญหาและแก้รายกรณีแล้ว"
    solution: "รับและบันทึก → ตอบรับและแจ้งกำหนดเวลา → ตรวจข้อเท็จจริง → แก้ไข → แจ้งผลและติดตามความพอใจ → วิเคราะห์สาเหตุและป้องกันการเกิดซ้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.quality-planning.p012
    topics: [management.quality.quality-planning]
    difficulty: 3
    type: mcq
    stem: "ผู้ป่วยนอกของโรงพยาบาลบอกว่า \"อยากได้ผลตรวจเลือดเร็ว ๆ\" ข้อใดเป็น CTQ ที่ดีที่สุด"
    choices:
      - { id: a, text: "เวลาตั้งแต่เจาะเลือดถึงผลออกในระบบ ไม่เกิน 60 นาที สำหรับอย่างน้อย 95% ของรายการตรวจ", correct: true }
      - { id: b, text: "ห้องแล็บทำงานให้เร็วขึ้น", feedback: "ไม่ได้ระบุว่าวัดอะไรและเกณฑ์เท่าใด จึงไม่ใช่ CTQ" }
      - { id: c, text: "ซื้อเครื่องตรวจอัตโนมัติเพิ่ม 1 เครื่อง", feedback: "นี่คือวิธีแก้ ไม่ใช่คุณลักษณะที่วัดได้จากมุมของผู้ป่วย" }
      - { id: d, text: "ผู้ป่วยพึงพอใจต่อห้องแล็บ 90%", feedback: "เป็นผลลัพธ์รวม ไม่ได้แปลงความต้องการเรื่องความเร็วเป็นค่าที่วัดได้โดยตรง" }
    hints:
      - "CTQ ต้องวัดได้และมีเกณฑ์"
      - "วัดจากสิ่งที่ผู้ป่วยรู้สึก คือเวลารอผล"
    solution: "CTQ ที่ดีแปลงคำพูดของลูกค้าเป็นตัววัดที่ชัด (เวลาจากเจาะถึงผลออก) พร้อมเกณฑ์ (60 นาที, 95%) ส่วนการซื้อเครื่องเป็นวิธีแก้ ไม่ใช่ข้อกำหนด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.quality-planning.p013
    topics: [management.quality.quality-planning]
    difficulty: 3
    type: mcq
    stem: "เมื่อสิบปีก่อน โทรศัพท์ที่ชาร์จเร็วทำให้ลูกค้าประทับใจ แต่ปัจจุบันถ้าชาร์จช้าลูกค้าจะไม่พอใจทันที ปรากฏการณ์นี้อธิบายด้วยแนวคิดใด"
    choices:
      - { id: a, text: "คุณสมบัติที่สร้างความประทับใจเปลี่ยนเป็นพื้นฐานที่ต้องมีเมื่อเวลาผ่านไป", correct: true }
      - { id: b, text: "คุณสมบัติพื้นฐานกลายเป็นคุณสมบัติที่ไม่มีผล", feedback: "ลูกค้ายังสนใจเรื่องการชาร์จมาก ไม่ได้กลายเป็นไม่มีผล" }
      - { id: c, text: "ลูกค้าเปลี่ยนจากลูกค้าภายนอกเป็นลูกค้าภายใน", feedback: "ไม่เกี่ยวกับประเภทลูกค้า" }
      - { id: d, text: "พิกัดความเผื่อสะสมของแบตเตอรี่", feedback: "พิกัดความเผื่อเป็นเรื่องขนาดชิ้นส่วน ไม่เกี่ยวกับความคาดหวังที่เปลี่ยนไป" }
    hints:
      - "สมัยก่อน: ไม่มีก็ไม่บ่น มีแล้วประทับใจ"
      - "ปัจจุบัน: ไม่มีแล้วไม่พอใจ"
    solution: "ตามแบบจำลองคาโน สิ่งที่เคยสร้างความประทับใจจะกลายเป็นสิ่งที่ลูกค้าคาดหวังเมื่อทุกคนมี องค์กรจึงต้องฟังเสียงลูกค้าใหม่อย่างต่อเนื่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.quality-planning.p014
    topics: [management.quality.quality-planning]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นแนวปฏิบัติที่ดีของการทบทวนการออกแบบ เลือกทุกข้อที่ถูก"
    choices:
      - { id: a, text: "ทำหลายครั้งตามระยะของงานออกแบบ ไม่ใช่ครั้งเดียวตอนจบ", correct: true }
      - { id: b, text: "เชิญผู้แทนจากฝ่ายผลิต จัดซื้อ คุณภาพ และบริการหลังการขายร่วมทบทวน", correct: true }
      - { id: c, text: "บันทึกประเด็นที่พบและติดตามว่าแก้ไขแล้ว", correct: true }
      - { id: d, text: "ให้เฉพาะผู้ออกแบบคนเดิมตรวจงานของตัวเอง เพื่อความรวดเร็ว", feedback: "ผู้ออกแบบมักมองไม่เห็นจุดอ่อนของงานตัวเอง ควรมีมุมมองจากสายงานอื่น" }
      - { id: e, text: "รอทบทวนหลังเริ่มผลิตจำนวนมากแล้ว จะได้มีข้อมูลจริง", feedback: "ยิ่งพบปัญหาช้า ต้นทุนการแก้ยิ่งสูง ควรทบทวนก่อนผลิตจริง" }
    hints:
      - "เป้าหมายคือพบปัญหาให้เร็วที่สุดจากหลายมุมมอง"
      - "ผลการทบทวนต้องนำไปสู่การแก้ไขที่ตรวจสอบได้"
    solution: "ก ข ค ถูก การทบทวนที่ดีทำเป็นระยะ ใช้ทีมข้ามสายงาน และบันทึกติดตามผล ส่วนการตรวจงานตัวเองคนเดียวหรือรอหลังผลิตแล้วทำให้พบปัญหาช้าและแพง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.quality-planning.p015
    topics: [management.quality.quality-planning]
    difficulty: 4
    type: mcq
    stem: "สำนักงานประกันสังคมจังหวัดแห่งหนึ่ง (สมมติ) พบว่าความพึงพอใจรวมสูง 90% แต่ผู้ประกันตนสูงอายุร้องเรียนว่าใช้แอปยื่นเรื่องไม่ได้ ข้อสรุปใดถูกต้องที่สุด"
    choices:
      - { id: a, text: "ควรจำแนกผลตามกลุ่มผู้รับบริการ เพราะค่ารวมที่สูงอาจซ่อนกลุ่มที่ได้รับบริการไม่เท่าเทียม", correct: true }
      - { id: b, text: "ความพึงพอใจ 90% แปลว่าบริการดีแล้ว ไม่ต้องทำอะไรเพิ่ม", feedback: "ค่ารวมไม่ได้แสดงว่าทุกกลุ่มพอใจ กลุ่มสูงอายุอาจเป็นส่วนน้อยของผู้ตอบ" }
      - { id: c, text: "ควรเลิกให้บริการผ่านแอป", feedback: "กลุ่มอื่นอาจพอใจกับแอปมาก ควรเพิ่มช่องทางหรือช่วยเหลือกลุ่มที่ใช้ไม่ได้มากกว่า" }
      - { id: d, text: "ข้อร้องเรียนจากกลุ่มเล็กไม่ใช่เสียงของลูกค้า", feedback: "ข้อร้องเรียนเป็นเสียงของลูกค้าเชิงรับที่สำคัญ และหน่วยงานรัฐต้องดูแลทุกกลุ่มอย่างเท่าเทียม" }
    hints:
      - "ค่าเฉลี่ยรวมบอกอะไรเกี่ยวกับกลุ่มย่อยได้บ้าง"
      - "การจำแนกกลุ่มลูกค้าช่วยเห็นความต้องการที่ต่างกัน"
    solution: "ค่ารวมสูงอาจซ่อนปัญหาของกลุ่มเล็ก ควรแยกผลตามกลุ่ม (เช่น อายุ ช่องทาง) แล้วออกแบบบริการเสริม เช่น จุดช่วยกรอกหรือช่องทางโทรศัพท์ สำหรับกลุ่มที่ใช้แอปไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.quality-planning.p016
    topics: [management.quality.quality-planning]
    difficulty: 5
    type: mcq
    stem: "จากบ้านแห่งคุณภาพของกระติกน้ำ (ฉนวน 60 ซีล 53 น้ำหนัก 29 ต้นทุน 27) ทีมพบว่าการเพิ่มความหนาฉนวนทำให้น้ำหนักรวมเพิ่มขึ้น ทีมควรทำอย่างไร"
    choices:
      - { id: a, text: "ปรับปรุงฉนวนเป็นลำดับแรก แต่หาวัสดุหรือโครงสร้างที่เก็บความเย็นดีขึ้นโดยไม่เพิ่มน้ำหนักมาก และตั้งเกณฑ์น้ำหนักสูงสุดไว้", correct: true }
      - { id: b, text: "เพิ่มความหนาฉนวนให้มากที่สุดเพราะคะแนนสูงสุด ไม่ต้องสนใจน้ำหนัก", feedback: "น้ำหนักยังสำคัญ (29 คะแนน) และลูกค้ากลุ่มถือสบายจะไม่พอใจ ต้องจัดการข้อขัดกันที่หลังคาแสดง" }
      - { id: c, text: "ลดความหนาฉนวนเพื่อให้เบาที่สุด", feedback: "ขัดกับความต้องการที่สำคัญที่สุดของลูกค้า (เก็บความเย็นนาน ความสำคัญ 5)" }
      - { id: d, text: "ทิ้งบ้านแห่งคุณภาพเพราะข้อมูลขัดกันเอง", feedback: "การพบข้อขัดกันคือประโยชน์ของ QFD ช่วยให้ทีมหาทางออกเชิงออกแบบก่อนผลิต" }
    hints:
      - "หลังคาของบ้านแห่งคุณภาพแสดงข้อกำหนดทางเทคนิคที่ขัดกัน"
      - "ทางออกที่ดีพยายามได้ทั้งสองอย่าง พร้อมเกณฑ์ที่ชัด"
    solution: "ฉนวนสำคัญที่สุดจึงควรปรับก่อน แต่ข้อขัดกับน้ำหนักต้องหาทางออก เช่น ฉนวนสุญญากาศที่บางแต่ดี และกำหนดน้ำหนักสูงสุดเป็นข้อกำหนด การจัดการข้อขัดกันคือจุดประสงค์ของหลังคาในบ้านแห่งคุณภาพ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.quality-planning.p017
    topics: [management.quality.quality-planning]
    difficulty: 5
    type: numeric
    stem: "ชุดประกอบสามชิ้นต้องมีความยาวรวม $70.00 \\pm 0.25$ mm (คิดแบบกรณีแย่ที่สุด) ชิ้นแรกมีพิกัด $\\pm 0.10$ mm ชิ้นที่สองมีพิกัด $\\pm 0.08$ mm พิกัดของชิ้นที่สามต้องไม่เกิน ± เท่าใด (ตอบในหน่วย mm)"
    answer: { value: 0.07, unit: mm, tolerance: 0.001 }
    hints:
      - "กรณีแย่ที่สุด: พิกัดรวม = ผลรวมพิกัดทุกชิ้น"
      - "$0.10 + 0.08 + t_3 \\le 0.25$"
    misconceptions:
      - { match: 0.215, feedback: "นั่นคือการแก้แบบ RSS ($\\sqrt{0.25^2 - 0.10^2 - 0.08^2}$) โจทย์กำหนดให้คิดแบบกรณีแย่ที่สุด" }
      - { match: 0.43, feedback: "ต้องลบพิกัดของสองชิ้นแรกออกจาก 0.25 ไม่ใช่บวก" }
    solution: "$t_3 \\le 0.25 - 0.10 - 0.08 = 0.07$ mm"
