    ai_assisted: true

  - id: mgt.qt.p020
    topics: [management.quality.concepts]
    difficulty: 5
    type: mcq
    stem: "จากสองข้อก่อน ทางเลือก ก ซื้อเครื่องทดสอบ (ตรวจพบ 95% ต้นทุนเพิ่ม 15,000 บาท) ทางเลือก ข ลงทุนป้องกัน (ของเสีย 0.6% ต้นทุนเพิ่ม 10,000 บาท) ทางเลือก ค ทำทั้งสองอย่าง (ของเสีย 0.6% ตรวจพบ 95% ต้นทุนเพิ่ม 25,000 บาท) ทางเลือกใดทำให้ต้นทุนคุณภาพรวมต่อเดือนต่ำที่สุด"
    choices:
      - { id: a, text: "ทางเลือก ข ลงทุนป้องกันอย่างเดียว", correct: true }
      - { id: b, text: "ทางเลือก ก ซื้อเครื่องทดสอบอย่างเดียว", feedback: "ทางเลือก ก ประหยัดได้ 15,000 บาท แต่ทางเลือก ข ประหยัดได้ 23,250 บาท เพราะลดของเสียตั้งแต่ต้น" }
      - { id: c, text: "ทางเลือก ค ทำทั้งสองอย่าง", feedback: "ลองคิด: ของเสีย 60 เครื่อง ตรวจพบ 57 หลุด 3 ต้นทุนความล้มเหลว $57 \\times 50 + 3 \\times 800 = 5{,}250$ บาท บวกต้นทุนที่เพิ่ม 25,000 บาท ได้ 30,250 บาท ประหยัดเพียง 17,250 บาท เพราะเมื่อของเสียเหลือน้อย เครื่องทดสอบราคาแพงจับเพิ่มได้ไม่กี่เครื่อง" }
      - { id: d, text: "ต้นทุนเท่ากันทุกทางเลือก", feedback: "คำนวณเทียบกัน: ก เหลือ 32,500 บาท ข เหลือ 24,250 บาท ค เหลือ 30,250 บาท ไม่เท่ากัน" }
    hints:
      - "หาต้นทุนคุณภาพที่เกี่ยวข้อง (ความล้มเหลว + ต้นทุนที่เพิ่ม) ของแต่ละทางเลือก"
      - "ทางเลือก ค: ของเสีย 60 เครื่อง ตรวจพบ 95%"
      - "เลือกทางที่ผลรวมต่ำสุด"
    solution: "ก: $17{,}500 + 15{,}000 = 32{,}500$ บาท ข: $14{,}250 + 10{,}000 = 24{,}250$ บาท ค: ของเสีย 60 ตรวจพบ 57 หลุด 3 ต้นทุนความล้มเหลว $2{,}850 + 2{,}400 = 5{,}250$ บาท รวม $5{,}250 + 25{,}000 = 30{,}250$ บาท ทางเลือก ข ต่ำที่สุด การป้องกันไม่ให้เกิดของเสียคุ้มกว่าการลงทุนตรวจจับให้มากขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qt.p021
    topics: [management.quality.concepts]
    difficulty: 2
    type: mcq
    stem: "ห้องปฏิบัติการของโรงพยาบาลจ่ายค่าสอบเทียบเครื่องวัดระดับน้ำตาลในเลือดทุก 6 เดือน ค่าใช้จ่ายนี้เป็นต้นทุนคุณภาพกลุ่มใด"
    choices:
      - { id: a, text: "ต้นทุนประเมิน", correct: true }
      - { id: b, text: "ต้นทุนป้องกัน", feedback: "การสอบเทียบไม่ได้ทำให้กระบวนการเกิดของเสียน้อยลงโดยตรง แต่ทำให้การวัดและตรวจสอบถูกต้อง จึงจัดเป็นต้นทุนประเมิน" }
      - { id: c, text: "ต้นทุนความล้มเหลวภายใน", feedback: "ความล้มเหลวภายในคือค่าใช้จ่ายจากของเสียที่เกิดแล้ว เช่น ต้องตรวจเลือดซ้ำ ส่วนการสอบเทียบเป็นการเตรียมเครื่องมือให้วัดถูก" }
      - { id: d, text: "ต้นทุนความล้มเหลวภายนอก", feedback: "ความล้มเหลวภายนอกเกิดเมื่อผลผิดพลาดไปถึงผู้ป่วยแล้ว การสอบเทียบเป็นงานตามรอบปกติที่ยังไม่มีความผิดพลาดเกิดขึ้น" }
    hints:
      - "การสอบเทียบทำเพื่ออะไร: ป้องกันไม่ให้เกิดของเสีย หรือทำให้การตรวจวัดเชื่อถือได้"
      - "ค่าใช้จ่ายที่เกี่ยวกับการตรวจ วัด และทดสอบ จัดอยู่ในกลุ่มเดียวกัน"
    solution: "การสอบเทียบเครื่องมือวัดเป็นส่วนหนึ่งของการตรวจวัด จึงเป็น **ต้นทุนประเมิน** เช่นเดียวกับการตรวจรับวัตถุดิบและการทดสอบสินค้า"
