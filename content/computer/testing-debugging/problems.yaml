problems:
  - id: computer.programming.testing-debugging.p001
    topics: [computer.programming.testing-debugging]
    difficulty: 1
    type: numeric
    stem: |
      ฟังก์ชันรับคะแนนสอบที่ต้องอยู่ระหว่าง 0 ถึง 100 ถ้าแบ่งข้อมูลเข้าเป็นกลุ่มสมมูลเพื่อออกแบบการทดสอบ โดยให้แต่ละกลุ่มควรได้ผลแบบเดียวกัน ควรแบ่งได้อย่างน้อยกี่กลุ่ม (ตอบเป็นจำนวนเต็ม)
    answer: { value: 4, unit: กลุ่ม }
    hints:
      - "พิจารณาช่วงที่ถูกต้อง และข้อมูลที่ผิดในแต่ละลักษณะ"
      - "ลองแยกตามว่าค่านั้นต่ำกว่า 0, สูงกว่า 100, อยู่ในช่วง หรือไม่ใช่ตัวเลขเลย"
    misconceptions:
      - { match: 3, feedback: "ลืมกลุ่มข้อมูลที่ไม่ใช่ตัวเลข ซึ่งควรถูกปฏิเสธด้วยวิธีเฉพาะ" }
    solution: "กลุ่มคือ ช่วง 0 ถึง 100 ต่ำกว่า 0 สูงกว่า 100 และไม่ใช่ตัวเลข รวมเป็น 4 กลุ่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.testing-debugging.p002
    topics: [computer.programming.testing-debugging]
    difficulty: 1
    type: mcq
    stem: |
      ข้อใดเป็นตัวอย่างของการทดสอบหน่วย (unit test)
    choices:
      - { id: a, text: 'ให้ทีมขายลองสั่งอาหารผ่านแอปทั้งระบบ', feedback: "นี่คือการทดสอบยอมรับหรือการทดสอบระบบ ไม่ได้แยกทดสอบฟังก์ชันเดียว" }
      - { id: b, text: 'ทดสอบว่าโมดูลคิดเงินเชื่อมกับฐานข้อมูลออเดอร์ได้ถูกต้อง', feedback: "การทดสอบที่ดูการเชื่อมต่อหลายส่วนคือการทดสอบบูรณาการ" }
      - { id: c, text: 'ทดสอบฟังก์ชัน `calc_tax` เพียงตัวเดียวด้วยค่าที่กำหนด', correct: true }
      - { id: d, text: 'ให้ลูกค้าจริงทดลองใช้เมนูใหม่และยืนยันว่าใช้ได้', feedback: "นี่คือการทดสอบยอมรับ ไม่ใช่การทดสอบหน่วย" }
    hints:
      - "การทดสอบหน่วยแยกส่วนที่เล็กที่สุดออกมาทดสอบ"
      - "ดูว่าการทดสอบนั้นทดสอบฟังก์ชันเดียวหรือหลายส่วนประกอบกัน"
    solution: "การทดสอบหน่วยตรวจฟังก์ชันหรือคลาสเล็ก ๆ หนึ่งชิ้นแยกจากส่วนอื่น เช่น calc_tax กับค่าที่กำหนด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.testing-debugging.p003
    topics: [computer.programming.testing-debugging]
    difficulty: 2
    type: numeric
    stem: |
      ระบบตัดเกรดใช้เกณฑ์ที่ 50, 60, 70 และ 80 คะแนน ถ้าต้องการทดสอบค่าขอบของทุกเกณฑ์ โดยเลือกค่าที่เป็นเกณฑ์เองและค่าที่ต่ำกว่าเกณฑ์หนึ่งหน่วย ต้องมีค่าทดสอบอย่างน้อยกี่ค่า (ไม่นับค่าซ้ำ และตอบเป็นจำนวนเต็ม)
    answer: { value: 8, unit: ค่า }
    hints:
      - "แต่ละเกณฑ์ให้ค่าทดสอบสองค่า คือค่าเกณฑ์กับค่าที่น้อยกว่าเกณฑ์หนึ่งหน่วย"
      - "เกณฑ์ทั้งสี่ไม่ซ้อนกัน ดังนั้นค่าทดสอบที่ได้แต่ละคู่ไม่ซ้ำกัน"
    misconceptions:
      - { match: 4, feedback: "ทดสอบเฉพาะค่าที่เป็นเกณฑ์ แต่ไม่ได้ทดสอบค่าที่ต่ำกว่าเกณฑ์หนึ่งหน่วย ซึ่งเป็นจุดที่บั๊ก > กับ >= มักเผยออก" }
    solution: "ค่าทดสอบคือ 49, 50, 59, 60, 69, 70, 79, 80 รวม 8 ค่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.testing-debugging.p004
    topics: [computer.programming.testing-debugging]
    difficulty: 2
    type: mcq
    stem: |
      ข้อใดเป็นการเขียน `assert` ที่ดีที่สุดสำหรับฟังก์ชัน `grade(score)` ที่ควรได้ "A" เมื่อคะแนนเป็น 80
    choices:
      - { id: a, text: 'assert True', feedback: "เงื่อนไขนี้เป็นจริงเสมอ จึงไม่ทดสอบอะไรเลย" }
      - { id: b, text: 'assert grade(80) == "A", "80 ควรได้ A"', correct: true }
      - { id: c, text: 'print(grade(80))', feedback: "การพิมพ์ผลไม่ได้ตรวจว่าผลถูกหรือไม่ ต้องเทียบกับค่าที่คาดไว้" }
      - { id: d, text: 'assert grade(80)', feedback: "ค่า \"A\" เป็นสตริงที่ไม่ว่าง จึงเป็นจริงเสมอ ไม่ได้เทียบว่าเป็นค่าที่ถูกต้อง" }
    hints:
      - "การทดสอบที่ดีต้องเทียบผลที่ได้กับผลที่คาดไว้"
      - "ข้อความอธิบายช่วยให้รู้ว่าล้มเหลวเพราะอะไร"
    solution: "`assert grade(80) == \"A\", \"80 ควรได้ A\"` เทียบค่าที่ได้กับค่าที่คาดไว้ และมีข้อความบอกกรณีที่ทดสอบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.testing-debugging.p005
    topics: [computer.programming.testing-debugging]
    difficulty: 2
    type: text
    stem: |
      แนวคิดของการทดสอบที่รันชุดทดสอบเดิมซ้ำหลังแก้โค้ด เพื่อตรวจว่าสิ่งที่เคยทำงานได้ไม่พังลง มีชื่อว่าอะไร (ตอบชื่อภาษาอังกฤษ)
    accepted: ["regression testing", "regression test", "regression", "การทดสอบถดถอย"]
    misconceptions:
      - { match: "unit test", feedback: "การทดสอบหน่วยทดสอบส่วนเล็ก แต่ชื่อที่ต้องการคือการทดสอบที่ตรวจว่าของเดิมไม่พัง" }
    hints:
      - "คำนี้มาจากคำว่า regress ที่แปลว่าถอยกลับ"
      - "คำตอบขึ้นต้นด้วย regression"
    solution: "การทดสอบถดถอย (regression testing) รันชุดทดสอบเดิมหลังการเปลี่ยนแปลงเพื่อกันไม่ให้ฟังก์ชันที่เคยทำงานได้เสียไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.testing-debugging.p006
    topics: [computer.programming.testing-debugging]
    difficulty: 2
    type: order
    stem: |
      โปรแกรมมีบั๊กที่เกิดเฉพาะบางครั้ง ต้องการหาสาเหตุและแก้ไขอย่างเป็นระบบ เรียงขั้นตอนจากขั้นแรกถึงขั้นสุดท้าย
    items:
      - "ทำให้บั๊กเกิดซ้ำได้ด้วยข้อมูลเข้าที่แน่นอน"
      - "แบ่งครึ่งโค้ดด้วยการพิมพ์ค่าตรงกลางเพื่อหาช่วงที่เริ่มผิด"
      - "ตั้งจุดพักในช่วงนั้นใน IDE แล้วดูค่าตัวแปรทีละขั้น"
      - "แก้โค้ดแล้วเพิ่มกรณีทดสอบที่จับบั๊กนี้ไว้"
    hints:
      - "ถ้าทำให้เกิดซ้ำไม่ได้ ก็ตรวจสอบได้ยากว่าแก้สำเร็จหรือไม่"
      - "การหาช่วงที่ผิดควรทำก่อนการตั้งจุดพักละเอียด และการแก้ควรตามด้วยการเพิ่มกรณีทดสอบ"
    solution: "ต้องทำให้เกิดซ้ำได้ก่อน แล้วแบ่งครึ่งหาช่วงผิด จากนั้นใช้ตัวดีบักดูค่าในช่วงนั้น และสุดท้ายแก้พร้อมเพิ่มกรณีทดสอบกันบั๊กกลับมา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.testing-debugging.p007
    topics: [computer.programming.testing-debugging]
    difficulty: 3
    type: match
    stem: |
      จับคู่แนวคิดการทดสอบกับคำอธิบายที่ถูกต้อง
    pairs:
      - { left: "ค่าขอบ (boundary value)", right: "ค่าที่อยู่ตรงรอยต่อของช่วงที่ควรได้ผลต่างกัน" }
      - { left: "ข้อมูลผิดรูป", right: "ข้อมูลที่ไม่ตรงกับชนิดหรือรูปแบบที่คาดไว้ เช่น ข้อความแทนตัวเลข" }
      - { left: "การทดสอบกล่องดำ", right: "ทดสอบจากข้อกำหนดและผลลัพธ์ โดยไม่ดูโครงสร้างภายใน" }
      - { left: "การครอบคลุมโค้ด (coverage)", right: "สัดส่วนของคำสั่งที่ถูกรันจากชุดทดสอบ" }
    hints:
      - "ค่าขอบอยู่ตรงรอยต่อ ไม่ใช่กลางช่วง"
      - "กล่องดำคือการมองโปรแกรมจากภายนอก ส่วนการครอบคลุมวัดว่ารันอะไรไปบ้าง"
    solution: "ค่าขอบอยู่ตรงรอยต่อของกลุ่ม ข้อมูลผิดรูปคือชนิดหรือรูปแบบที่ไม่ตรงกัน กล่องดำดูจากข้อกำหนด และ coverage วัดสัดส่วนคำสั่งที่รัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.testing-debugging.p008
    topics: [computer.programming.testing-debugging]
    difficulty: 3
    type: numeric
    stem: |
      โปรแกรมมีโค้ดทั้งหมด 128 บรรทัด และมีบั๊กอยู่ในบรรทัดเดียว ถ้าใช้การแบ่งครึ่งเพื่อหาบรรทัดนั้น โดยแต่ละครั้งตรวจว่าค่าที่จุดกึ่งกลางผิดหรือถูก ต้องตรวจอย่างน้อยกี่ครั้งเพื่อแน่ใจว่าได้บรรทัดที่ผิด (ตอบเป็นจำนวนเต็ม)
    answer: { value: 7, unit: ครั้ง }
    hints:
      - "ทุกครั้งที่ตรวจ ช่วงที่ต้องค้นจะเหลือครึ่งหนึ่ง"
      - "ดูว่าต้องหารกี่ครั้งด้วย 2 จึงเหลือหนึ่งบรรทัด"
    misconceptions:
      - { match: 64, feedback: "ตรวจเพียงครั้งเดียวแล้วคิดว่าเหลือครึ่งหนึ่งของบรรทัดทั้งหมดเป็นคำตอบ การแบ่งครึ่งต้องทำซ้ำจนเหลือบรรทัดเดียว" }
    solution: "128 → 64 → 32 → 16 → 8 → 4 → 2 → 1 ต้องแบ่งครึ่ง 7 ครั้ง (log₂ 128 = 7)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.testing-debugging.p009
    topics: [computer.programming.testing-debugging]
    difficulty: 3
    type: numeric
    stem: |
      ฟังก์ชัน `average(nums)` ควรคืนค่าเฉลี่ยของลิสต์ แต่ผู้เขียนพิมพ์โค้ดเป็น `sum(nums) / (len(nums) + 1)` ถ้าเรียก `average([2, 4, 6])` จะได้ค่าเท่าไร (ตอบเป็นจำนวนเต็ม)
    answer: { value: 3, unit: "" }
    hints:
      - "คำนวณผลรวมของลิสต์ก่อน"
      - "ตัวหารของโค้ดที่ผิดคือจำนวนสมาชิกบวกหนึ่ง"
    misconceptions:
      - { match: 12, feedback: "ลืมหารด้วยตัวหาร ได้เพียงผลรวม" }
    solution: "ผลรวม 2 + 4 + 6 = 12 หารด้วย (3 + 1) = 4 ได้ 3 แต่ค่าเฉลี่ยที่ถูกต้องคือ 12 ÷ 3 = 4 โค้ดจึงผิด และชุดทดสอบที่มีกรณีนี้ควรจับบั๊กได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.testing-debugging.p010
    topics: [computer.programming.testing-debugging]
    difficulty: 3
    type: mcq
    stem: |
      ฟังก์ชันตรวจอายุผู้สมัครสมาชิกต้องรับเฉพาะ 0 ถึง 120 ปี ชุดกรณีทดสอบใดจับค่าขอบของช่วงนี้ได้ดีที่สุด
    choices:
      - { id: a, text: 'ทดสอบเฉพาะ 25 เพราะเป็นอายุที่พบบ่อย', feedback: "ค่าที่อยู่กลางช่วงมักไม่เผยบั๊กที่รอยต่อ" }
      - { id: b, text: 'ทดสอบเฉพาะ 0, 60 และ 120', feedback: "ทดสอบค่าขอบเพียงด้านเดียว เช่น 120 แต่ไม่ได้ทดสอบ 121 ที่ควรถูกปฏิเสธ" }
      - { id: c, text: 'ทดสอบ -1, 0, 1, 119, 120, 121', correct: true }
      - { id: d, text: 'ทดสอบค่าสุ่มพันค่าในช่วงที่ไม่รู้ขอบเขต', feedback: "การสุ่มไม่ได้เลือกค่าขอบโดยตรง อาจไม่ครอบคลุมรอยต่อเลย" }
    hints:
      - "ค่าขอบมีทั้งด้านที่ถูกต้องและด้านที่ผิด"
      - "ค่าที่ควรทดสอบอยู่ทั้งสองข้างของแต่ละรอยต่อ"
    solution: "ค่า -1 และ 121 ควรถูกปฏิเสธ ค่า 0, 1, 119 และ 120 ควรรับ จึงจับบั๊กทั้งสองด้านของรอยต่อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.testing-debugging.p011
    topics: [computer.programming.testing-debugging]
    difficulty: 3
    type: mcq
    stem: |
      ทีมแก้บั๊กการคิดยอดในระบบแล้ว ข้อใดคือการทดสอบถดถอยที่ควรทำ
    choices:
      - { id: a, text: 'เขียนกรณีทดสอบใหม่สำหรับฟีเจอร์ใหม่ที่ยังไม่ได้เริ่มทำ', feedback: "นี่คือการเพิ่มการทดสอบฟีเจอร์ใหม่ ไม่ได้ตรวจว่าของเดิมยังทำงานได้" }
      - { id: b, text: 'รันชุดทดสอบเดิมทั้งหมดอีกครั้งเพื่อดูว่ามีส่วนใดพังจากการแก้ไข', correct: true }
      - { id: c, text: 'วัดเวลาตอบสนองเมื่อผู้ใช้จำนวนมากเข้าพร้อมกัน', feedback: "นี่คือการทดสอบประสิทธิภาพ" }
      - { id: d, text: 'ให้ผู้จัดการอ่านโค้ดแล้วอนุมัติ', feedback: "การตรวจโค้ดด้วยสายตาไม่ใช่การทดสอบถดถอย" }
    hints:
      - "ประเด็นคือการยืนยันว่าสิ่งเดิมยังทำงานเหมือนเดิม"
      - "ชุดทดสอบเดิมที่มีอยู่แล้วคือเครื่องมือที่ช่วยตรวจเรื่องนี้"
    solution: "การรันชุดทดสอบเดิมซ้ำหลังการแก้ไขเป็นการทดสอบถดถอย เพื่อจับผลข้างเคียงที่ไม่ได้ตั้งใจ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.testing-debugging.p012
    topics: [computer.programming.testing-debugging]
    difficulty: 4
    type: mcq
    multiple: true
    stem: |
      ข้อใดเป็นประโยชน์ของตัวดีบักใน IDE (เลือกทุกข้อที่ถูก)
    choices:
      - { id: a, text: 'ตั้งจุดพักเพื่อหยุดโปรแกรมตรงบรรทัดที่สนใจ', correct: true }
      - { id: b, text: 'ดูค่าของตัวแปรขณะที่โปรแกรมหยุดอยู่', correct: true }
      - { id: c, text: 'ดูกองการเรียก (call stack) ว่าฟังก์ชันใดเรียกมาถึงจุดนี้', correct: true }
      - { id: d, text: 'ลบ traceback ออกจากโปรแกรมโดยอัตโนมัติ', feedback: "traceback เป็นข้อมูลที่ Python สร้างเพื่อช่วยหาสาเหตุ ตัวดีบักไม่ได้ลบมันออก" }
    hints:
      - "ตัวดีบักเหมาะกับการหยุดดูและไล่ทีละขั้น"
      - "ตัวเลือกที่พูดถึงการลบข้อมูลการวินิจฉัยไม่ใช่หน้าที่ของตัวดีบัก"
    solution: "จุดพัก การดูค่าตัวแปร และการดูกองการเรียกเป็นหน้าที่ของตัวดีบัก ส่วน traceback เป็นข้อมูลที่ช่วยดีบักไม่ได้ถูกลบ"
    license: CC-BY-SA-4.0
