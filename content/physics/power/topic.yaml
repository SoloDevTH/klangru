id: physics.energy.power
subject: physics
title: { th: กำลัง, en: Power }
summary: กำลังคืองานที่ทำได้ในหนึ่งหน่วยเวลา หน่วยวัตต์ ความสัมพันธ์ระหว่างกำลัง แรง และความเร็ว ประสิทธิภาพของเครื่องจักร ตัวอย่างลิฟต์และมอเตอร์
difficulty: 4.5
minutes: 30
prerequisites: [physics.energy.work]
encompasses:
  - { id: physics.energy.work, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: sankey-lift-motor.svg
    alt: "แผนภาพแซงคีย์ แถบซ้ายกว้างแทนกำลังไฟฟ้าที่ใส่ 12 kW แยกเป็นแถบตรงไปทางขวากว้างแทนงานยกลิฟต์ 9.8 kW และแถบแคบโค้งลงแทนความร้อนและเสียง 2.2 kW ความกว้างของแถบเป็นสัดส่วนกับกำลัง"
    caption: "มอเตอร์ลิฟต์ในตัวอย่างที่ 2: ประสิทธิภาพ $\\tfrac{9.8}{12} \\approx 82\\%$ ความกว้างของสองแถบขาออกรวมกันเท่าแถบขาเข้า"
  - type: worked-example
    title: ค่าไฟของหม้อหุงข้าว
    problem: "หม้อหุงข้าวไฟฟ้ากำลัง $700\\ \\mathrm{W}$ หุงข้าววันละ $30$ นาที ใน $30$ วันใช้พลังงานกี่หน่วย (kWh) และเสียค่าไฟเท่าใด ถ้าค่าไฟหน่วยละ $4$ บาท"
    steps:
      - text: "แปลงหน่วยให้เข้ากับ kWh: $P = 0.7\\ \\mathrm{kW}$ และเวลาทั้งเดือน $= 0.5\\ \\mathrm{h} \\times 30 = 15\\ \\mathrm{h}$"
        why: "หน่วยในบิลค่าไฟคือกิโลวัตต์-ชั่วโมง จึงใช้กำลังเป็น kW และเวลาเป็นชั่วโมง ไม่ใช่วัตต์กับวินาที"
      - text: "พลังงาน $E = Pt = 0.7 \\times 15 = 10.5\\ \\mathrm{kWh}$ (เท่ากับ $10.5 \\times 3.6 \\times 10^6 \\approx 3.8 \\times 10^7\\ \\mathrm{J}$)"
      - text: "ค่าไฟ $= 10.5 \\times 4 = 42$ บาท"
    answer: "$10.5$ หน่วย ค่าไฟ $42$ บาท"
  - { type: check, problem: phy.pow.p007, prompt: "งานเท่ากัน เวลาต่างกัน กำลังเป็นอย่างไร" }
  - type: worked-example
    title: ระบบรอกช่วยยกของ แลกแรงกับระยะ
    problem: "ช่างใช้ระบบรอกในภาพยกถังปูนหนัก $600\\ \\mathrm{N}$ ขึ้น $2\\ \\mathrm{m}$ ต้องดึงเชือกด้วยแรง $400\\ \\mathrm{N}$ เป็นระยะ $4\\ \\mathrm{m}$ จงหาการได้เปรียบเชิงกลและประสิทธิภาพ"
    figure:
      src: pulley-two-strands.svg
      alt: "ระบบรอกมีรอกคงที่หนึ่งตัวติดเพดาน และรอกเคลื่อนที่หนึ่งตัวที่ภาระห้อยอยู่ เชือกปลายหนึ่งผูกเพดาน ลงไปอ้อมใต้รอกเคลื่อนที่ ขึ้นไปพาดรอกคงที่ แล้วลงมาเป็นปลายที่ผู้ดึงออกแรงพยายามลง รอกเคลื่อนที่ถูกเชือกสองเส้นรับไว้"
    steps:
      - text: "การได้เปรียบเชิงกล $= \\dfrac{600}{400} = 1.5$ ระบบนี้ขยายแรงได้ 1.5 เท่า"
      - text: "งานที่ใส่ $W_{\\text{เข้า}} = 400 \\times 4 = 1600\\ \\mathrm{J}$ งานที่ได้ $W_{\\text{ออก}} = 600 \\times 2 = 1200\\ \\mathrm{J}$"
        why: "เชือกสองเส้นรับรอกเคลื่อนที่ ภาระขึ้น $2\\ \\mathrm{m}$ เชือกแต่ละเส้นต้องสั้นลง $2\\ \\mathrm{m}$ ปลายที่ดึงจึงต้องเคลื่อน $4\\ \\mathrm{m}$"
      - text: "ประสิทธิภาพ $= \\dfrac{1200}{1600} \\times 100\\% = 75\\%$ อีก $400\\ \\mathrm{J}$ ใช้ยกรอกตัวล่างและสู้แรงเสียดทาน"
      - text: "ถ้าไม่มีการสูญเสีย จะใช้แรงเพียง $\\dfrac{1200}{4} = 300\\ \\mathrm{N}$ (ได้เปรียบเชิงกล 2 เท่าพอดี)"
    answer: "การได้เปรียบเชิงกล $1.5$ ประสิทธิภาพ $75\\%$"
  - { type: check, problem: phy.pow.p006, prompt: "ประสิทธิภาพ = ได้ออกหารด้วยใส่เข้า" }
  - type: interactive
    title: งานเท่าเดิม ใช้เวลาต่างกัน กำลังต่างกันอย่างไร
    caption: 'แกนนอนคือเวลาที่ใช้ทำงาน t (s) แกนตั้งคือกำลัง P = W/t (วัตต์) เลื่อนแถบ W เพื่อเปลี่ยนงานที่ต้องทำ แล้วสังเกตว่าทำงานเท่าเดิมให้เสร็จในเวลาครึ่งหนึ่ง ต้องใช้กำลังเป็นสองเท่า'
    widget:
      kind: function-plot
      functions: ['\frac{W}{x}']
      sliders:
        - { name: W, min: 500, max: 3000, step: 250, value: 1500, label: งาน W (J) }
      x: [0, 30]
      y: [0, 600]
  - type: interactive
    title: กำลังที่ต้องใช้เมื่อวิ่งเร็วขึ้น (P = Fv)
    caption: 'แกนนอนคือความเร็วคงตัว v (m/s) แกนตั้งคือกำลัง (วัตต์) ที่ต้องใช้เพื่อเอาชนะแรงต้าน F ลองเพิ่มแรงต้าน F แล้วดูว่าเส้นชันขึ้น และที่ความเร็วเท่ากัน แรงต้านสองเท่าต้องใช้กำลังสองเท่า'
    widget:
      kind: function-plot
      functions: ['F x']
      sliders:
        - { name: F, min: 100, max: 1000, step: 100, value: 400, label: แรงต้าน F (N) }
      x: [0, 30]
      y: [0, 30000]
glossary:
  - { term: กำลัง (P), definition: 'งานที่ทำได้ในหนึ่งหน่วยเวลา $P = \tfrac{W}{t}$ หรือ $P = Fv$ เมื่อแรงขนานกับความเร็ว' }
  - { term: วัตต์ (W), definition: 'หน่วยของกำลัง $1\ \mathrm{W} = 1\ \mathrm{J/s}$ และ $1\ \mathrm{kW} = 1000\ \mathrm{W}$' }
  - { term: ประสิทธิภาพ, definition: 'ร้อยละของกำลังหรืองานที่ได้ออกมาเป็นประโยชน์ เทียบกับที่ใส่เข้าไป $\eta = \tfrac{P_{\text{ออก}}}{P_{\text{เข้า}}} \times 100\%$' }
flashcards:
  - { front: 'สูตรของกำลังสองแบบ', back: '$P = \tfrac{W}{t}$ และ $P = Fv$ (แรงขนานกับความเร็ว) หน่วยวัตต์' }
  - { front: 'คนสองคนมวลเท่ากันขึ้นบันไดเดียวกัน คนหนึ่งใช้เวลาครึ่งหนึ่งของอีกคน เปรียบเทียบงานและกำลัง', back: 'งานเท่ากัน แต่คนที่เร็วกว่ามีกำลังเป็น 2 เท่า' }
  - { front: '$\mathrm{kW}$ กับ $\mathrm{kWh}$ ต่างกันอย่างไร', back: '$\mathrm{kW}$ เป็นหน่วยกำลัง ส่วน $\mathrm{kWh}$ เป็นหน่วยพลังงาน $1\ \mathrm{kWh} = 3.6 \times 10^6\ \mathrm{J}$' }
  - { front: 'มอเตอร์รับกำลังไฟฟ้า $2000\ \mathrm{W}$ ให้กำลังกล $1500\ \mathrm{W}$ ประสิทธิภาพเท่าใด', back: '$\tfrac{1500}{2000} \times 100\% = 75\%$' }
