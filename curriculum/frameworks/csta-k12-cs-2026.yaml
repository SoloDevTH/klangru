          - { id: "S1-CYB-CP-12", level: "Specialty I", text: "Explain key components of effective security policies.", note: "Practice ESR1, CT6" }
          - { id: "S2-CYB-CP-09", level: "Specialty II", text: "Debate how various regulations impact organizational security policies, procedures, and compliance.", note: "Practice ESR1, IC5" }
      - id: "CYB-PP"
        text: "Professional Practice"
        indicators:
