  stem: 'ใช้สามพจน์แรกของอนุกรมแมคลอรินของ $\ln(1+x)$ ประมาณค่าที่ $x=0.5$ ค่าคลาดเคลื่อนไม่เกินเท่าใด (ตอบทศนิยม 4 ตำแหน่ง)'
  answer:
