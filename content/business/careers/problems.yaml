problems:
  - id: business.entrepreneurship.careers.p001
    topics: [business.entrepreneurship.careers]
    difficulty: 1
    type: mcq
    stem: "ข้อใดอธิบายความหมายของ **อาชีพ** ได้ถูกต้อง"
    choices:
      - { id: a, text: "งานที่ทำอย่างสุจริตเป็นประจำเพื่อให้ได้รายได้มาเลี้ยงชีพ", correct: true }
      - { id: b, text: "งานอดิเรกที่ทำเมื่อว่าง", feedback: "งานอดิเรกทำเพื่อความสุข ไม่ได้ทำเป็นประจำเพื่อเลี้ยงชีพ" }
      - { id: c, text: "งานอะไรก็ได้ที่ได้เงินเร็ว แม้จะผิดกฎหมาย", feedback: "อาชีพต้องสุจริต งานผิดกฎหมายไม่ใช่อาชีพ" }
      - { id: d, text: "งานที่ทำในสำนักงานเท่านั้น", feedback: "อาชีพมีหลายแบบ ทั้งในไร่นา ในตลาด ในโรงงาน และในสำนักงาน" }
    hints:
      - "อาชีพต้องสุจริตและให้รายได้"
      - "ทำครั้งเดียวหรือทำเป็นประจำ"
    solution: "อาชีพคืองานที่ทำอย่างสุจริตเป็นประจำเพื่อให้ได้รายได้มาเลี้ยงชีพ ทำได้ทุกที่ ไม่จำกัดแค่ในสำนักงาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.careers.p002
    topics: [business.entrepreneurship.careers]
    difficulty: 1
    type: match
    stem: "จับคู่อาชีพในชุมชนกับกลุ่มของอาชีพ"
    pairs:
      - { left: "ชาวสวนทุเรียนที่จันทบุรี", right: "เกษตรกรรม" }
      - { left: "แม่ค้าขายผลไม้ในตลาดสด", right: "ค้าขาย" }
      - { left: "ช่างเชื่อมเหล็กในอู่ซ่อมรถ", right: "ช่างและอุตสาหกรรม" }
      - { left: "ช่างตัดผมและพนักงานโรงแรม", right: "บริการ" }
    hints:
      - "เกษตรกรรมคือการปลูกพืชเลี้ยงสัตว์ ค้าขายคือการซื้อมาขายไป"
      - "บริการคือการทำงานให้ผู้อื่นโดยไม่ได้ผลิตสิ่งของ"
    solution: "ชาวสวน → เกษตรกรรม · แม่ค้า → ค้าขาย · ช่างเชื่อม → ช่างและอุตสาหกรรม · ช่างตัดผมและพนักงานโรงแรม → บริการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.careers.p003
    topics: [business.entrepreneurship.careers]
    difficulty: 1
    type: mcq
    multiple: true
    stem: "อาชีพมีความสำคัญอย่างไร (เลือกได้มากกว่าหนึ่งข้อ)"
    choices:
      - { id: a, text: "ทำให้มีรายได้ซื้อสิ่งที่จำเป็นในชีวิต", correct: true }
      - { id: b, text: "ช่วยดูแลครอบครัว", correct: true }
      - { id: c, text: "ผลิตสินค้าและบริการที่คนอื่นในสังคมต้องใช้", correct: true }
      - { id: d, text: "ทำให้ได้ดูถูกคนที่ทำอาชีพอื่น", feedback: "ทุกอาชีพสุจริตมีคุณค่า เราควรเคารพทุกอาชีพ" }
    hints:
      - "คิดถึงประโยชน์ต่อตนเอง ครอบครัว และสังคม"
      - "หาข้อที่ไม่ใช่ประโยชน์"
    solution: "อาชีพสำคัญต่อตนเอง (มีรายได้) ครอบครัว (ดูแลคนในบ้าน) และสังคม (ผลิตสิ่งที่คนอื่นต้องใช้) ส่วนการดูถูกอาชีพอื่นเป็นเจตคติที่ไม่ดี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.careers.p004
    topics: [business.entrepreneurship.careers]
    difficulty: 2
    type: mcq
    stem: "ป้าแดงเปิดร้านขายส้มตำของตัวเอง ส่วนพี่เอทำงานเป็นพนักงานบริษัทได้เงินเดือนทุกเดือน ข้อใดเปรียบเทียบได้ถูกต้อง"
    choices:
      - { id: a, text: "ป้าแดงทำอาชีพอิสระ รายได้ขึ้นกับยอดขาย พี่เอทำอาชีพรับจ้าง รายได้ค่อนข้างแน่นอน", correct: true }
      - { id: b, text: "ทั้งสองคนทำอาชีพรับจ้าง เพราะได้เงินทั้งคู่", feedback: "ป้าแดงเป็นเจ้าของร้านเอง ไม่มีนายจ้าง จึงเป็นอาชีพอิสระ" }
      - { id: c, text: "ป้าแดงมีรายได้แน่นอนกว่า เพราะขายทุกวัน", feedback: "รายได้ของร้านขึ้นกับจำนวนลูกค้าแต่ละวัน ไม่แน่นอนเท่าเงินเดือน" }
      - { id: d, text: "พี่เอเลือกเวลาทำงานเองได้ทั้งหมด", feedback: "พนักงานบริษัทต้องทำตามเวลาและกฎขององค์กร" }
    hints:
      - "ใครมีนายจ้าง ใครเป็นเจ้าของงานเอง"
      - "รายได้ของใครขึ้นกับยอดขาย"
    solution: "ป้าแดงเป็นเจ้าของร้าน (อาชีพอิสระ) รายได้ขึ้นกับยอดขาย พี่เอมีนายจ้าง (อาชีพรับจ้าง) ได้เงินเดือนค่อนข้างแน่นอนแต่ต้องทำตามเวลาของบริษัท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.careers.p005
    topics: [business.entrepreneurship.careers]
    difficulty: 2
    type: match
    stem: "จับคู่อาชีพกับความรู้ ความสามารถ และคุณธรรมที่สำคัญมากที่สุด"
    pairs:
      - { left: "พยาบาล", right: "รู้วิทยาศาสตร์สุขภาพ ใจเย็น และมีเมตตา" }
      - { left: "นักบัญชี", right: "คิดเลขแม่น ละเอียด และซื่อสัตย์" }
      - { left: "ช่างไฟฟ้า", right: "รู้เรื่องไฟฟ้า ระวังความปลอดภัย และรับผิดชอบ" }
      - { left: "มัคคุเทศก์", right: "รู้ประวัติสถานที่ สื่อสารภาษาต่างประเทศ และสุภาพ" }
    hints:
      - "นึกว่าแต่ละอาชีพทำงานอะไรในแต่ละวัน"
      - "งานที่จับเงินของคนอื่นต้องการคุณธรรมข้อใดมากที่สุด"
    solution: "พยาบาล → วิทยาศาสตร์สุขภาพและเมตตา · นักบัญชี → คิดเลขแม่นและซื่อสัตย์ · ช่างไฟฟ้า → ความรู้ไฟฟ้าและความปลอดภัย · มัคคุเทศก์ → ความรู้สถานที่ ภาษา และความสุภาพ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.careers.p006
    topics: [business.entrepreneurship.careers]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนตั้งแต่เริ่มคิดเรื่องอาชีพจนเข้าสู่อาชีพ"
    items:
      - "สำรวจตนเองว่าสนใจ ถนัด และรู้อะไร"
      - "หาข้อมูลอาชีพที่สนใจ"
      - "ประเมินทางเลือกแล้วเลือกอาชีพ"
      - "เตรียมตัว เรียน ฝึก และหาประสบการณ์"
      - "หางานหรือสร้างอาชีพของตนเอง"
    hints:
      - "ต้องรู้จักตัวเองก่อนจึงจะรู้ว่าควรหาข้อมูลอาชีพใด"
      - "การเตรียมตัวทำหลังจากเลือกอาชีพแล้ว"
    solution: "สำรวจตนเอง → หาข้อมูลอาชีพ → เลือกอาชีพ → เตรียมตัวและหาประสบการณ์ → เข้าสู่อาชีพ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.careers.p007
    topics: [business.entrepreneurship.careers]
    difficulty: 2
    type: mcq
    stem: "นักเรียน ป.5 ได้รับงานให้ **สำรวจข้อมูลอาชีพในชุมชน** วิธีใดได้ข้อมูลตรงที่สุด"
    choices:
      - { id: a, text: "สัมภาษณ์คนที่ทำอาชีพนั้นจริงว่าทำงานอะไร ใช้ความรู้อะไร และลำบากเรื่องอะไร", correct: true }
      - { id: b, text: "เดาจากละครโทรทัศน์", feedback: "ละครแต่งเพื่อความบันเทิง อาจไม่ตรงกับงานจริง" }
      - { id: c, text: "ถามเพื่อนในห้องที่ไม่เคยทำอาชีพนั้น", feedback: "เพื่อนอาจไม่รู้ข้อมูลจริง ควรถามคนที่ทำงานนั้น" }
      - { id: d, text: "ดูแค่ว่าอาชีพไหนมีรายได้มากที่สุด", feedback: "รายได้เป็นข้อมูลเดียว ยังขาดลักษณะงาน ความรู้ และความยากง่าย" }
    hints:
      - "ใครรู้เรื่องงานนี้ดีที่สุด"
      - "การสำรวจที่ดีต้องได้ข้อมูลหลายด้าน"
    solution: "การสัมภาษณ์คนที่ทำอาชีพนั้นจริงได้ข้อมูลตรงและครบหลายด้าน ทั้งลักษณะงาน ความรู้ที่ต้องใช้ และปัญหาที่พบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.careers.p008
    topics: [business.entrepreneurship.careers]
    difficulty: 3
    type: numeric
    stem: "พี่ต้นเลือกงานได้สองแบบ (ตัวเลขสมมติ) แบบแรกรับจ้างรายวันวันละ $380$ บาท ทำงานเดือนละ $24$ วัน แบบที่สองเป็นพนักงานรายเดือนได้เงินเดือน $9{,}000$ บาท ถ้าทำงานครบทุกวัน งานรายวันได้เงินมากกว่างานรายเดือนเดือนละกี่บาท (ตอบเป็นบาท)"
    answer: { value: 120, unit: บาท }
    hints:
      - "หารายได้ต่อเดือนของงานรายวันก่อน"
      - "นำรายได้งานรายวันลบเงินเดือน"
    misconceptions:
      - { match: 9120, feedback: "นั่นคือรายได้ต่อเดือนของงานรายวัน ต้องลบเงินเดือนด้วย" }
      - { match: 8620, feedback: "ลบ 380 จาก 9,000 ต้องคูณ 380 ด้วยจำนวนวันก่อน" }
    solution: "งานรายวัน $380 \\times 24 = 9{,}120$ บาท มากกว่างานรายเดือน $9{,}120 - 9{,}000 = 120$ บาท แต่ถ้าเดือนไหนหยุดงานหรือไม่มีงาน รายได้รายวันจะลดลง จึงต้องคิดเรื่องความแน่นอนด้วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.careers.p009
    topics: [business.entrepreneurship.careers]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "พี่สาวเพิ่งเรียนจบ ปวส. สาขาช่างไฟฟ้า วิธีใดเป็นการหางานที่เหมาะสม (เลือกได้มากกว่าหนึ่งข้อ)"
    choices:
      - { id: a, text: "ไปงานนัดพบแรงงานหรือสำนักงานจัดหางานของรัฐ", correct: true }
      - { id: b, text: "ค้นประกาศรับสมัครงานในเว็บไซต์หางานที่เชื่อถือได้", correct: true }
      - { id: c, text: "ส่งประวัติย่อไปที่บริษัทรับเหมาไฟฟ้าโดยตรง", correct: true }
      - { id: d, text: "โอนเงินค่าสมัคร 3,000 บาทให้คนในโซเชียลที่บอกว่าจะหางานเงินเดือนสูงให้", feedback: "การให้จ่ายเงินก่อนเป็นสัญญาณของงานหลอกลวง" }
    hints:
      - "การหางานทำได้หลายช่องทาง"
      - "ระวังช่องทางที่ให้จ่ายเงินก่อน"
    solution: "งานนัดพบแรงงาน สำนักงานจัดหางาน เว็บไซต์หางานที่น่าเชื่อถือ และการติดต่อบริษัทโดยตรง เป็นวิธีที่เหมาะสม ส่วนการโอนเงินให้คนแปลกหน้าก่อนเสี่ยงถูกหลอก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.careers.p010
    topics: [business.entrepreneurship.careers]
    difficulty: 3
    type: mcq
    stem: "ประกาศในโซเชียลเขียนว่า \"รับสมัครด่วน งานกดไลก์ที่บ้าน วันละ 1,500 บาท ไม่ต้องมีประสบการณ์ แค่โอนค่าลงทะเบียน 500 บาท และส่งรหัส ATM มา\" ข้อใดเป็นการตัดสินใจที่ดีที่สุด"
    choices:
      - { id: a, text: "ไม่สมัคร เพราะมีสัญญาณงานหลอกลวงหลายข้อ และบอกผู้ปกครองหรือครู", correct: true }
      - { id: b, text: "สมัคร เพราะรายได้สูงและทำที่บ้านได้", feedback: "รายได้สูงผิดปกติสำหรับงานง่าย และให้จ่ายเงินก่อน เป็นสัญญาณอันตราย" }
      - { id: c, text: "โอนเงินแต่ไม่ส่งรหัส ATM", feedback: "การให้จ่ายเงินก่อนเริ่มงานก็เป็นสัญญาณหลอกลวงแล้ว" }
      - { id: d, text: "ส่งรหัส ATM แต่ไม่โอนเงิน", feedback: "ห้ามให้รหัส ATM หรือรหัสผ่านกับใครเด็ดขาด" }
    hints:
      - "นับสัญญาณอันตรายในประกาศ"
      - "งานจริงไม่ให้ผู้สมัครจ่ายเงินหรือบอกรหัส"
    solution: "ประกาศนี้มีสัญญาณหลอกลวงสามข้อ คือ รายได้สูงผิดปกติ ให้จ่ายเงินก่อน และขอรหัส ATM ควรไม่สมัครและบอกผู้ใหญ่ที่ไว้ใจ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.careers.p011
    topics: [business.entrepreneurship.careers]
    difficulty: 3
    type: mcq
    stem: "ลุงชมปลูกผักขายที่ลำพูน มีปัญหาว่าผักเสียหายบ่อยเพราะฝนตกหนักโดยไม่รู้ตัว ข้อใดเป็นการ **เลือกใช้เทคโนโลยีอย่างเหมาะสม** ที่สุด"
    choices:
      - { id: a, text: "ใช้แอปพยากรณ์อากาศในโทรศัพท์ที่มีอยู่ แล้วคลุมแปลงผักก่อนฝนตก", correct: true }
      - { id: b, text: "กู้เงินซื้อโดรนพ่นยาราคาแพง", feedback: "โดรนพ่นยาไม่ได้แก้ปัญหาฝน และแพงเกินกำลัง" }
      - { id: c, text: "ซื้อหุ่นยนต์เก็บผักเพราะทันสมัยที่สุด", feedback: "ทันสมัยแต่ไม่ได้แก้ปัญหาที่เกิดขึ้น" }
      - { id: d, text: "ไม่ใช้เทคโนโลยีใดเลย เพราะเกษตรกรไม่จำเป็นต้องใช้", feedback: "เทคโนโลยีราคาถูกช่วยเกษตรกรได้มาก" }
    hints:
      - "เทคโนโลยีที่เหมาะสมต้องแก้ปัญหาของงานจริง"
      - "คิดถึงความคุ้มค่าและการใช้เป็นด้วย"
    solution: "แอปพยากรณ์อากาศแก้ปัญหาตรงจุด ราคาถูกเพราะใช้โทรศัพท์ที่มีอยู่ และลุงชมใช้เป็น จึงเหมาะสมที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.careers.p012
    topics: [business.entrepreneurship.careers]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "เมย์อายุ 13 ปี สนใจอาชีพเชฟ กิจกรรมใด **เสริมสร้างประสบการณ์อาชีพ** ได้เหมาะสมกับวัยของเมย์ (เลือกได้มากกว่าหนึ่งข้อ)"
    choices:
      - { id: a, text: "ช่วยแม่ทำอาหารและจดสูตรที่ทำสำเร็จ", correct: true }
      - { id: b, text: "เข้าชมรมคหกรรมและทำโครงงานขนมไทยกับเพื่อน", correct: true }
      - { id: c, text: "ไปเยี่ยมชมครัวของโรงแรมกับโรงเรียน และถามคำถามเชฟ", correct: true }
      - { id: d, text: "สมัครเป็นลูกจ้างร้านอาหารทำงานกะดึก", feedback: "อายุ 13 ปียังเป็นลูกจ้างไม่ได้ตามกฎหมาย (ต่ำกว่า 15 ปี) และงานกะดึกไม่เหมาะกับวัย" }
    hints:
      - "ประสบการณ์อาชีพหาได้จากที่บ้าน โรงเรียน และการเยี่ยมชม"
      - "นึกถึงอายุขั้นต่ำของการเป็นลูกจ้างตามกฎหมาย"
    solution: "ช่วยงานบ้าน ทำโครงงานในชมรม และเยี่ยมชมสถานประกอบการ เหมาะกับวัย ส่วนการเป็นลูกจ้างทำไม่ได้เพราะกฎหมายห้ามจ้างเด็กอายุต่ำกว่า 15 ปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.careers.p013
    topics: [business.entrepreneurship.careers]
    difficulty: 4
    type: numeric
    stem: "โอ๊ตใช้ตารางในภาพให้คะแนนสามอาชีพ แต่ละเกณฑ์คูณด้วยน้ำหนักในวงเล็บ แล้วรวมกัน อาชีพ **นักออกแบบกราฟิก** ได้คะแนนรวมเท่าใด"
    figure: { src: career-matrix.svg, alt: "ตารางคะแนนที่โอ๊ตให้แต่ละอาชีพ 1 ถึง 5 เกณฑ์และน้ำหนัก ความสนใจคูณ 3 ความถนัดคูณ 2 โอกาสมีงานทำคูณ 2 รายได้คูณ 1 ช่างซ่อมรถยนต์ไฟฟ้าได้ 4, 5, 4, 3 นักออกแบบกราฟิกได้ 5, 3, 3, 3 พนักงานบัญชีได้ 2, 4, 4, 3" }
    answer: { value: 30 }
    hints:
      - "คูณคะแนนของแต่ละเกณฑ์ด้วยน้ำหนักของเกณฑ์นั้น"
      - "นำผลคูณทั้งสี่มารวมกัน"
    misconceptions:
      - { match: 14, feedback: "รวมคะแนนโดยไม่คูณน้ำหนัก ต้องคูณก่อนรวม" }
      - { match: 33, feedback: "นั่นคือคะแนนของช่างซ่อมรถยนต์ไฟฟ้า ดูให้ถูกคอลัมน์" }
    solution: "$3 \\times 5 + 2 \\times 3 + 2 \\times 3 + 1 \\times 3 = 15 + 6 + 6 + 3 = 30$ คะแนน (ช่างซ่อมรถยนต์ไฟฟ้าได้ 33 พนักงานบัญชีได้ 25)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.careers.p014
    topics: [business.entrepreneurship.careers]
    difficulty: 4
    type: mcq
    stem: "ข้อความใดแสดง **เจตคติที่ดีต่อการประกอบอาชีพ**"
    choices:
      - { id: a, text: "\"ทุกอาชีพที่สุจริตมีคุณค่า ไม่ว่าเราจะทำอะไรก็ควรตั้งใจทำให้ดีที่สุด\"", correct: true }
      - { id: b, text: "\"งานที่ใช้แรงกายเป็นงานของคนที่เรียนไม่เก่ง\"", feedback: "เป็นการดูถูกอาชีพ งานใช้แรงกายต้องใช้ทักษะและสังคมขาดไม่ได้" }
      - { id: c, text: "\"ทำงานแค่พอให้ผ่านไปวัน ๆ ก็พอ\"", feedback: "ขาดความรับผิดชอบและความตั้งใจในงาน" }
      - { id: d, text: "\"ถ้าไม่ได้เป็นเจ้านายก็ไม่ต้องตั้งใจทำงาน\"", feedback: "ทุกตำแหน่งมีความสำคัญ และความตั้งใจคือคุณลักษณะที่ดีต่ออาชีพ" }
    hints:
      - "เจตคติที่ดีคือมองอาชีพในทางที่ให้เกียรติ"
      - "หาข้อที่เคารพทุกอาชีพและตั้งใจทำงาน"
    solution: "การเห็นคุณค่าของทุกอาชีพที่สุจริตและตั้งใจทำงานให้ดี คือเจตคติที่ดีต่อการประกอบอาชีพ ข้ออื่นเป็นการดูถูกหรือขาดความรับผิดชอบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.careers.p015
    topics: [business.entrepreneurship.careers]
    difficulty: 4
    type: order
    stem: "ปลาอยู่ ม.3 อยากเป็นพยาบาลวิชาชีพ เรียงแนวทางเข้าสู่อาชีพนี้"
    items:
      - "เรียนต่อ ม.ปลาย สายวิทยาศาสตร์"
      - "สอบเข้าเรียนหลักสูตรพยาบาลศาสตรบัณฑิต"
      - "เรียนและฝึกปฏิบัติงานในโรงพยาบาลจนจบหลักสูตร"
      - "สอบขึ้นทะเบียนรับใบอนุญาตประกอบวิชาชีพการพยาบาล"
      - "สมัครงานเป็นพยาบาลในโรงพยาบาลหรือสถานพยาบาล"
    hints:
      - "การเรียนต่อมหาวิทยาลัยต้องจบ ม.6 ก่อน"
      - "ใบอนุญาตสอบได้หลังเรียนจบ และต้องมีใบอนุญาตก่อนทำงานเป็นพยาบาลวิชาชีพ"
    solution: "ม.ปลายสายวิทย์ → พยาบาลศาสตรบัณฑิต → เรียนและฝึกปฏิบัติจนจบ → สอบใบอนุญาตประกอบวิชาชีพ → สมัครงาน"
