id: physics.light.optics-eye
subject: physics
title: { th: ปรากฏการณ์ของแสง ทัศนอุปกรณ์ และความสว่าง, en: "Light phenomena, optical instruments and illuminance" }
summary: การมองเห็น ภาพบนจอตาและการแก้สายตาสั้นสายตายาว แว่นขยาย กล้องถ่ายรูป กล้องจุลทรรศน์ กล้องโทรทรรศน์ การกระจายแสง ความสว่างในหน่วยลักซ์ และการจัดแสงให้เหมาะกับงาน
difficulty: 5.5
minutes: 40
prerequisites: [physics.light.refraction, physics.light.reflection]
encompasses:
  - { id: physics.light.refraction, weight: 0.4 }
  - { id: physics.light.reflection, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: โครงสร้างของตาและภาพบนจอตา
    src: eye.svg
    alt: "ภาพตัดขวางของลูกตา ด้านหน้ามีกระจกตาโค้ง ม่านตาและรูม่านตา และเลนส์ตารูปไข่ ด้านหลังมีจอตาเป็นเส้นโค้งสีส้มและประสาทตา วัตถุเป็นลูกศรตั้งอยู่ทางซ้ายนอกตา รังสีสองเส้นจากปลายวัตถุ เส้นหนึ่งขนานแกนแล้วหักเหที่เลนส์ อีกเส้นผ่านกลางเลนส์ตรงไป ทั้งสองไปพบกันบนจอตาเกิดภาพลูกศรชี้ลง เป็นภาพจริง หัวกลับ ย่อ"
  - type: figure
    title: สายตาสั้นและสายตายาว
    src: vision-correction.svg
    alt: "สี่ภาพ ก. สายตาสั้นมองวัตถุไกล รังสีขนานเข้าตาแล้วรวมกันก่อนถึงจอตา ข. ใส่แว่นเลนส์เว้าหน้าตา รังสีขนานกระจายออกเล็กน้อยก่อนเข้าตา แล้วรวมกันบนจอตาพอดี ค. สายตายาวมองวัตถุใกล้ รังสีจากจุดวัตถุเข้าตาแล้วยังไม่รวมกันเมื่อถึงจอตา เส้นประต่อไปพบกันหลังจอตา ง. ใส่แว่นเลนส์นูน รังสีจากวัตถุใกล้ถูกบีบเข้าก่อนเข้าตาแล้วรวมกันบนจอตาพอดี"
  - type: worked-example
    title: แว่นสายตาสั้น "200"
    problem: "นักเรียนคนหนึ่งมองเห็นชัดได้ไกลที่สุดเพียง $50\\ \\mathrm{cm}$ ต้องใช้แว่นชนิดใด ความยาวโฟกัสและกำลังของเลนส์เท่าใด"
    steps:
      - text: "มองไกลไม่ชัด คือสายตาสั้น ใช้เลนส์เว้า"
      - text: "แว่นต้องทำให้วัตถุที่อยู่ไกลมาก ($s \\to \\infty$) เกิดภาพเสมือนที่จุดไกล $s' = -50\\ \\mathrm{cm}$"
        why: "ภาพเสมือนอยู่ด้านเดียวกับวัตถุ จึงมี $s'$ เป็นลบ และตาของเขามองภาพที่ระยะ 50 cm ได้ชัด"
      - text: "$\\dfrac{1}{f} = \\dfrac{1}{\\infty} + \\dfrac{1}{-50} \\Rightarrow f = -50\\ \\mathrm{cm} = -0.50\\ \\mathrm{m}$"
      - text: "$P = \\dfrac{1}{f} = \\dfrac{1}{-0.50\\ \\mathrm{m}} = -2.0\\ \\mathrm{D}$"
        why: "ต้องใช้ $f$ เป็นเมตร ร้านแว่นเรียกค่านี้ว่าสายตาสั้น 200"
    answer: "เลนส์เว้า f = −50 cm กำลัง −2.0 ไดออปเตอร์"
  - { type: check, problem: physics.light.optics-eye.p007, prompt: "แสงรวมกันก่อนหรือหลังจอตา" }
  - type: figure
    title: กล้องจุลทรรศน์
    src: microscope.svg
    alt: "แผนภาพรังสีของกล้องจุลทรรศน์ เลนส์ใกล้วัตถุอยู่ทางซ้าย วัตถุลูกศรเล็กอยู่ไกลกว่าจุดโฟกัสของเลนส์นี้เล็กน้อย รังสีสองเส้นจากปลายวัตถุผ่านเลนส์ไปเกิดภาพจริงหัวกลับขยาย I₁ ใต้แกนทางขวา ซึ่งอยู่ใกล้เลนส์ใกล้ตามากกว่าจุดโฟกัส Fₑ ของเลนส์ใกล้ตา รังสีจาก I₁ ผ่านเลนส์ใกล้ตาแล้วกระจายออก เส้นประต่อย้อนกลับไปพบกันทางซ้ายล่างเกิดภาพเสมือน I₂ ขนาดใหญ่มาก หัวกลับเมื่อเทียบกับวัตถุ"
    caption: "เลนส์ใกล้ตาทำหน้าที่เป็นแว่นขยายส่องภาพ I₁ อีกครั้ง"
  - type: worked-example
    title: จัดไฟห้องเรียนให้สว่างพอ
    problem: "ห้องเรียนพื้นที่ $60\\ \\mathrm{m^2}$ ต้องการความสว่างบนโต๊ะ $400\\ \\mathrm{lx}$ หลอด LED แต่ละหลอดให้ $2000\\ \\mathrm{lm}$ แต่แสงไปถึงโต๊ะได้เพียงครึ่งหนึ่ง (ที่เหลือตกบนผนัง เพดาน และถูกดูดกลืน) ต้องใช้กี่หลอด"
    steps:
      - text: "ฟลักซ์ที่ต้องตกบนโต๊ะ $F = EA = (400)(60) = 24000\\ \\mathrm{lm}$"
      - text: "หลอดหนึ่งส่งแสงถึงโต๊ะได้ $0.5 \\times 2000 = 1000\\ \\mathrm{lm}$"
        why: "ใช้เฉพาะแสงที่ถึงพื้นที่ทำงานจริงในการคำนวณความสว่าง"
      - text: "จำนวนหลอด $= \\dfrac{24000}{1000} = 24$ หลอด"
    answer: "ใช้ 24 หลอด"
  - { type: check, problem: physics.light.optics-eye.p004, prompt: "ความสว่างคือฟลักซ์ต่อพื้นที่" }
  - type: simulation
    title: "เลนส์และภาพ (PhET Geometric Optics)"
    url: https://phet.colorado.edu/en/simulations/geometric-optics
    provider: phet
    note: "เลือกเลนส์นูน ลากวัตถุเข้าใกล้เลนส์จนใกล้กว่าจุดโฟกัสเพื่อดูภาพเสมือนแบบแว่นขยาย แล้วลากออกไปไกลกว่า 2F เพื่อดูภาพจริงย่อแบบกล้องถ่ายรูป ลองเปลี่ยนความโค้งของเลนส์เหมือนที่ตาปรับเลนส์ตา"
glossary:
  - { term: จอตา, definition: "ชั้นในสุดด้านหลังลูกตา มีเซลล์รูปแท่งและรูปกรวยที่เปลี่ยนพลังงานแสงเป็นสัญญาณประสาท" }
  - { term: จุดใกล้, definition: "ระยะใกล้ที่สุดที่ตามองเห็นชัด ตาปกติประมาณ 25 cm" }
  - { term: กำลังของเลนส์, definition: "P = 1/f เมื่อ f เป็นเมตร หน่วยไดออปเตอร์ เลนส์นูนเป็นบวก เลนส์เว้าเป็นลบ" }
  - { term: เลนส์ใกล้วัตถุ, definition: "เลนส์ของกล้องจุลทรรศน์หรือกล้องโทรทรรศน์ที่อยู่ด้านวัตถุ ทำให้เกิดภาพจริงก่อน" }
  - { term: เลนส์ใกล้ตา, definition: "เลนส์ที่ผู้ดูมองผ่าน ทำหน้าที่เหมือนแว่นขยายส่องภาพจากเลนส์ใกล้วัตถุ" }
  - { term: ความสว่าง, definition: "ฟลักซ์การส่องสว่างที่ตกตั้งฉากบนพื้นที่หนึ่งหน่วย E = F/A หน่วยลักซ์" }
  - { term: ลักซ์มิเตอร์, definition: "เครื่องวัดความสว่างบนพื้นที่ในหน่วยลักซ์" }
flashcards:
  - { front: "ภาพบนจอตาเป็นภาพแบบใด", back: "ภาพจริง หัวกลับ ขนาดเล็ก สมองแปลให้เป็นหัวตั้ง" }
  - { front: "สายตาสั้นแก้ด้วยเลนส์อะไร", back: "เลนส์เว้า ความยาวโฟกัสเท่ากับลบของระยะจุดไกล" }
  - { front: "กำลังขยายของกล้องโทรทรรศน์", back: "$M = f_o / f_e$" }
  - { front: "ความสว่าง", back: "$E = F/A$ หน่วยลักซ์ (lm/m²)" }
  - { front: "กำลังขยายรวมของกล้องจุลทรรศน์", back: "ผลคูณของกำลังขยายเลนส์ใกล้วัตถุกับเลนส์ใกล้ตา" }
