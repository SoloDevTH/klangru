id: english.grammar.questions
subject: english
title: { th: คำถาม Yes/No และ Wh-, en: "Yes/No questions and Wh- questions" }
summary: สร้างคำถาม Yes/No ด้วย be do does ตอบสั้นให้ถูก ใช้คำแสดงคำถาม what who where when why how how many how much ถามแบบให้เลือกด้วย or และตอบคำถามจากเรื่องที่อ่าน
difficulty: 2
minutes: 35
prerequisites: [english.grammar.present-simple]
encompasses:
  - { id: english.grammar.present-simple, weight: 0.4 }
curriculum_tags: []
lessons:
  - type: figure
    src: question-flow.svg
    alt: "ตารางสามคอลัมน์: ประโยคบอกเล่า คำถาม Yes/No และคำถาม Wh- แถวแรก (verb to be): She is at school. ลูกศรไป Is she at school? (ย้าย is ขึ้นหน้าประธาน) ลูกศรไป Where is she? (ใส่ Where หน้าสุด) แถวที่สอง (กริยาทั่วไป): She works at a bank. ลูกศรไป Does she work at a bank? (ใส่ Does + กริยารูปเดิม) ลูกศรไป Where does she work? ด้านล่างเขียนคำตอบสั้น Yes, she is. / No, she isn't. และ Yes, she does. / No, she doesn't."
    caption: "คำถาม Wh- คือคำถาม Yes/No ที่มีคำแสดงคำถามอยู่หน้าสุด"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.grammar.questions.p004, prompt: "คำตอบบอกสถานที่ ใช้คำแสดงคำถามใด" }
  - type: worked-example
    title: สร้างคำถาม Wh- จากส่วนที่ขีดเส้นใต้
    problem: "ตั้งคำถามถามส่วนที่เป็นตัวหนา: *Nok's brother has **two** guitars.*"
    steps:
      - text: "ส่วนที่ถามคือจำนวน (two) ของกีตาร์ซึ่งนับได้ ใช้ **How many** + คำนามพหูพจน์: How many guitars"
        why: "how much ใช้กับราคาหรือของที่นับไม่ได้"
      - text: "ประธานคือ Nok's brother = he กริยาหลักคือ has จึงใช้ **does**"
      - text: "หลัง does กริยากลับเป็นรูปเดิม has → **have**"
      - text: "เรียง: How many guitars + does + Nok's brother + have?"
    answer: "***How many guitars does Nok's brother have?*** — *He has two.*"
  - { type: check, problem: english.grammar.questions.p010, prompt: "คำถามมี or ให้เลือก ควรตอบอย่างไร" }
  - type: worked-example
    title: อ่านบัตรข้อมูลแล้วถามตอบ
    problem: "ดูบัตรนักเรียนของมิ้นท์ (Name: Mint, Age: 11, From: Nakhon Ratchasima, Lives in: Bangkok, Likes: badminton, Pets: two cats) แล้วตอบ *Does Mint have a dog?*"
    figure: { src: student-card.svg, alt: "บัตรนักเรียน STUDENT CARD มีรูปหน้าเด็กยิ้ม และข้อมูล Name: Mint, Age: 11, From: Nakhon Ratchasima, Lives in: Bangkok, Likes: badminton, Pets: two cats" }
    steps:
      - text: "คำถามขึ้นต้นด้วย Does จึงเป็นคำถาม Yes/No ต้องตอบ Yes หรือ No แล้วตามด้วยคำตอบสั้น"
      - text: "หาในบัตรช่อง Pets: two cats มีแมวสองตัว ไม่มีสุนัข"
      - text: "Mint แทนด้วย she และคำถามใช้ does จึงตอบ *No, she doesn't.*"
        why: "คำตอบสั้นใช้กริยาช่วยตัวเดียวกับคำถาม"
      - text: "เพิ่มข้อมูลที่ถูกได้: *She has two cats.*"
    answer: "*No, she doesn't. She has two cats.*"
glossary:
  - { term: คำถาม Yes/No, definition: "คำถามที่ตอบด้วย Yes หรือ No ขึ้นต้นด้วย be, do, does หรือ can" }
  - { term: คำถาม Wh-, definition: "คำถามที่ขึ้นต้นด้วยคำแสดงคำถาม เช่น what, where, who, when, why, how เพื่อขอข้อมูล" }
  - { term: or-question, definition: "คำถามที่มี or ให้ผู้ตอบเลือกหนึ่งอย่าง เช่น Tea or coffee? ไม่ตอบด้วย Yes/No" }
  - { term: คำตอบสั้น (short answer), definition: "Yes/No + สรรพนาม + กริยาช่วยตัวเดียวกับคำถาม เช่น Yes, I do. / No, she isn't." }
flashcards:
  - { front: "คำถามของ He plays football.", back: "Does he play football? (Does + ประธาน + กริยารูปเดิม)" }
  - { front: "how many กับ how much ต่างกันอย่างไร", back: "how many กับของนับได้ (How many pens?) how much กับราคาหรือของนับไม่ได้ (How much is it? / How much water?)" }
  - { front: "Do you want rice or noodles? ตอบอย่างไร", back: "เลือกหนึ่งอย่าง เช่น Noodles, please. (ไม่ตอบ Yes)" }
  - { front: "Where does she lives? ผิดตรงไหน", back: "หลัง does ใช้กริยารูปเดิม: Where does she live?" }
  - { front: "Who ___ next door? (live)", back: "Who lives next door? (who เป็นประธาน ไม่ใช้ do)" }
