  ai_assisted: true
- id: chinese.grammar.word-order.p014
  topics:
  - chinese.grammar.word-order
  difficulty: 5
  type: mcq
  stem: 我们不都是泰国人。 หมายความว่าอะไร
  choices:
  - id: a
    text: พวกเราทุกคนไม่ใช่คนไทย
    feedback: ทุกคนไม่ใช่ = 都不是 (都 อยู่หน้า 不)
  - id: b
    text: พวกเราทุกคนเป็นคนไทย
    feedback: มี 不 อยู่ จึงไม่ใช่ประโยคบอกเล่า
  - id: c
    text: พวกเราก็ไม่ใช่คนไทย
    feedback: ก็ = 也
  - id: d
    text: พวกเราไม่ได้เป็นคนไทยทุกคน (บางคนเป็น บางคนไม่เป็น)
    correct: true
    feedback: ถูก 不都 = ไม่ใช่ทั้งหมด
  hints:
  - ลำดับของ 不 กับ 都 เปลี่ยนความหมาย
  - 不都 = ไม่ทั้งหมด · 都不 = ทั้งหมดไม่
  solution: '**不都** = ไม่ใช่ทุกคน (บางคน) · **都不** = ทุกคนไม่'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.word-order.p015
  topics:
  - chinese.grammar.word-order
  difficulty: 5
  type: match
  stem: จับคู่ประโยคกับความหมาย
  pairs:
  - left: 他们都去。
    right: พวกเขาไปทุกคน
  - left: 他们都不去。
    right: พวกเขาไม่ไปสักคน
  - left: 他们不都去。
    right: พวกเขาไม่ได้ไปทุกคน (บางคนไป)
  - left: 他们也不去。
    right: พวกเขาก็ไม่ไปเหมือนกัน
  hints:
  - 都不 = ทุกคนไม่ · 不都 = ไม่ใช่ทุกคน
  - 也 = ก็ เหมือนกัน
  solution: 都去 ไปทุกคน · 都不去 ไม่ไปสักคน · 不都去 ไม่ได้ไปทุกคน · 也不去 ก็ไม่ไป
  license: CC-BY-SA-4.0
  ai_assisted: true
