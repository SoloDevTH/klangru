<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="sans-serif" font-size="14">
  <title>สามเป้าหมายของความมั่นคงปลอดภัย การรักษาความลับ ความถูกต้องครบถ้วน และความพร้อมใช้ พร้อมตัวอย่างระบบคะแนนของโรงเรียน</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="860" height="430" fill="#ffffff"/>
  <path d="M430.0,85.0 L559.9,310.0 L300.1,310.0 Z" stroke="#9ca3af" stroke-width="2" fill="#f9fafb"/>
  <text x="430.0" y="229.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ข้อมูลคะแนน</text>
  <text x="430.0" y="251.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ของนักเรียน</text>
  <rect x="270.0" y="12.0" width="320.0" height="100.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="430.0" y="48.6" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ความลับ (Confidentiality)</text>
  <text x="430.0" y="73.8" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">เฉพาะคนที่มีสิทธิ์เห็น</text>
  <text x="430.0" y="91.4" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">เสียหาย: คะแนนรั่วออกไป</text>
  <rect x="560.0" y="290.0" width="280.0" height="100.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="700.0" y="326.6" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ความถูกต้องครบถ้วน (Integrity)</text>
  <text x="700.0" y="351.8" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">ข้อมูลไม่ถูกแก้โดยไม่ได้รับอนุญาต</text>
  <text x="700.0" y="369.4" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">เสียหาย: มีคนแอบแก้เกรด</text>
  <rect x="20.0" y="290.0" width="280.0" height="100.0" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="160.0" y="326.6" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ความพร้อมใช้ (Availability)</text>
  <text x="160.0" y="351.8" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">ใช้ได้เมื่อต้องการ</text>
  <text x="160.0" y="369.4" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">เสียหาย: ระบบล่มวันประกาศผล</text>
</svg>
