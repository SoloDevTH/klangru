# หลักสูตรแกนกลางการศึกษาขั้นพื้นฐาน พุทธศักราช 2551 กลุ่มสาระการเรียนรู้ภาษาต่างประเทศ
#
# ขอบเขต
# - เล่มหลักสูตร (หน้า 220) ระบุว่าภาษาต่างประเทศที่เป็นสาระการเรียนรู้พื้นฐานคือภาษาอังกฤษ ส่วนภาษาอื่น เช่น จีน ญี่ปุ่น
#   ให้อยู่ในดุลยพินิจของสถานศึกษา มาตรฐานและตัวชี้วัดเขียนเป็นกลางสำหรับ "ภาษาต่างประเทศ" แต่ตัวอย่างในสาระการเรียนรู้แกนกลาง
#   (เอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง) เป็นภาษาอังกฤษ ไฟล์นี้จึงใช้กับทั้ง english และ chinese
#
# การปรับปรุงภายหลัง (ตรวจเมื่อ 2026-10-24)
# - ฉบับปรับปรุง พ.ศ. 2560 (คำสั่งกระทรวงศึกษาธิการ ที่ สพฐ 1239/2560 และคำสั่ง สพฐ. ที่ 30/2561 ตามรายการเอกสารที่ kruprem.com คัดจากเว็บ สพฐ.) ปรับเฉพาะคณิตศาสตร์ วิทยาศาสตร์ และสาระภูมิศาสตร์
#   ไม่ได้แตะภาษาต่างประเทศ (ดูชื่อเอกสารฉบับปรับปรุงและหนังสือ สพฐ. ปี 2566 ใน sources)
# - ปี 2566 สพฐ. แบ่งตัวชี้วัดเดิมเป็นตัวชี้วัดระหว่างทางและปลายทาง โดยไม่เปลี่ยนข้อความ (ไฟล์นี้ยังไม่ได้เก็บการแบ่งนั้น)
# - นโยบายภาษาอังกฤษตามกรอบ CEFR: ประกาศกระทรวงศึกษาธิการ เรื่อง นโยบายการปฏิรูปการเรียนการสอนภาษาอังกฤษ (14 มกราคม 2557)
#   ให้ใช้ CEFR เป็นกรอบหลักของการเรียน การสอน การทดสอบ และการพัฒนาครู และ สพฐ. ออกประกาศเรื่องแนวทางการนำผลการประเมินตาม
#   กรอบ CEFR ไปใช้ในสถานศึกษา (ลงนาม 9 กันยายน 2568) ทั้งสองฉบับไม่ได้แก้ข้อความตัวชี้วัดในไฟล์นี้
#   หลักฐาน: ข่าวแนวหน้า 18 ก.ย. 2568 https://www.naewna.com/local/915273 (เราไม่ได้เปิดตัวบทประกาศปี 2557 เอง
#   จึงไม่ได้บันทึกเป้าหมายระดับ CEFR รายชั้นไว้ที่นี่)
# - หลักสูตรประถมศึกษาตอนต้น (ป.1–3) พ.ศ. 2568 ฐานสมรรถนะ ใช้กับโรงเรียนที่สมัครใจ (https://www.naewna.com/local/880644)
#
# วิธีคัดข้อความ
# - ต้นฉบับคือตาราง "ตัวชี้วัดชั้นปี" ในเล่มหลักสูตร (หน้า 228–243 ของเล่ม) และมาตรฐานจากหน้า "สาระและมาตรฐานการเรียนรู้" (หน้า 19–20)
#   รหัสตัวชี้วัดสร้างจากโครงตารางตามที่เล่มอธิบายในหน้า 9 เลขในรหัสเขียนเป็นเลขอารบิก
# - วิธีถอดรหัสฟอนต์ MacThai เว้นวรรค และการตัดสินรอยต่อบรรทัด เหมือนไฟล์ th-core-2551-thai (ดูคำอธิบายในไฟล์นั้น)
# - จำนวนตัวชี้วัด 193 ตรงกับตาราง "สรุปตัวชี้วัด" กลุ่มสาระภาษาต่างประเทศ (ภาษาอังกฤษ) ของ สพฐ. (15 ส.ค. 2559):
#   ป.1 16, ป.2 16, ป.3 18, ป.4 20, ป.5 20, ป.6 20, ม.1 20, ม.2 21, ม.3 21, ม.4-6 21
# - เอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง (สพฐ. 2551) พิมพ์ไม้ยมกแบบเว้นวรรค ("ง่าย ๆ") ส่วนเล่มหลักสูตรพิมพ์ "ง่ายๆ"
#   ไฟล์นี้ยึดเล่มหลักสูตร
