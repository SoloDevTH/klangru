problems:
- id: thai.reading.prediction-inference.p001
  topics:
  - thai.reading.prediction-inference
  difficulty: 1
  type: mcq
  stem: '"ยายยกจานขนมออกมาจากครัว ขนมยังมีควันลอยขึ้น" อนุมานได้ว่าอย่างไร'
  choices:
  - id: a
    text: ขนมเพิ่งทำเสร็จและยังร้อน
    correct: true
    feedback: ถูก ควันลอยเป็นหลักฐาน และรู้ว่าของร้อนมีไอลอย
  - id: b
    text: ขนมเย็นชืด
    feedback: ขัดกับหลักฐานเรื่องควัน
  - id: c
    text: ขนมไหม้
    feedback: ควันจากของร้อนไม่ได้แปลว่าไหม้ เรื่องไม่ได้บอกกลิ่นไหม้
  - id: d
    text: ยายซื้อขนมมาจากตลาด
    feedback: เรื่องบอกว่ายกออกมาจากครัว
  hints:
  - หลักฐานในเรื่องคืออะไร
  - ของที่มีควันลอยขึ้นมักเป็นอย่างไร
  solution: 'หลักฐาน: มีควันลอย + ความรู้เดิม: ของร้อนมีไอ → **ขนมเพิ่งทำเสร็จและยังร้อน**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.prediction-inference.p002
  topics:
  - thai.reading.prediction-inference
  difficulty: 1
  type: mcq
  stem: อ่านเรื่องในภาพ ถ้าน้ำฝนยังกระตุกเชือกแรง ๆ ต่อไป คาดคะเนได้ว่าจะเกิดอะไรขึ้น
  figure: &id001
    src: kite-story.svg
    alt: เรื่องสั้นสมมุติ ว่าวของน้ำฝน 6 ประโยค (1) บ่ายวันเสาร์ น้ำฝนกับพี่ชายนำว่าวตัวใหม่ไปเล่นที่ทุ่งนาหลังบ้าน (2) พี่ชายเตือนว่า อย่าพาว่าวเข้าใกล้เสาไฟฟ้าตรงคันนานะ (3) ลมแรงขึ้นเรื่อย ๆ ว่าวลอยสูงจนเห็นเป็นจุดเล็ก ๆ (4) น้ำฝนสังเกตว่าเชือกเริ่มเป็นขุยตรงที่ผูกกับไม้หลอด (5) ทางทิศตะวันตก เมฆดำก้อนใหญ่ลอยใกล้เข้ามา (6) น้ำฝนกระตุกเชือกแรงขึ้น เพราะอยากให้ว่าวสูงกว่าว่าวของเด็กบ้านข้าง ๆ
  choices:
  - id: a
    text: เชือกขาด ว่าวหลุดลอยไป
    correct: true
    feedback: ถูก เชือกเริ่มเป็นขุย (4) และกระตุกแรงขึ้น (6)
  - id: b
    text: ว่าวลอยต่ำลงเอง
    feedback: ลมแรงขึ้นเรื่อย ๆ ไม่มีเบาะแสว่าวจะลง
  - id: c
    text: ว่าวของเด็กบ้านข้าง ๆ ตกลงมา
    feedback: ไม่มีเบาะแสในเรื่อง
  - id: d
    text: พี่ชายซื้อว่าวตัวใหม่ให้
    feedback: ไม่มีเบาะแสในเรื่อง
  hints:
  - ดูประโยค (4) และ (6)
  - เชือกที่เป็นขุยถูกดึงแรง ๆ จะเป็นอย่างไร
  solution: ฉันคาดว่า **เชือกจะขาด** เพราะเชือกเริ่มเป็นขุยและน้ำฝนกระตุกแรงขึ้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.prediction-inference.p003
  topics:
  - thai.reading.prediction-inference
  difficulty: 2
  type: order
  stem: '"ตอนนี้ต้นนั่งกินข้าวกล่องใต้ต้นไม้ที่โรงเรียน เขานึกถึงตอนเช้าที่แม่ตื่นแต่มืดมาทำข้าวกล่องให้ เมื่อคืนเขายังบอกแม่ว่าไม่ต้องทำก็ได้" เรียงเหตุการณ์ตาม **ลำดับที่เกิดจริง**'
  items:
  - ต้นบอกแม่ว่าไม่ต้องทำข้าวกล่อง
  - แม่ตื่นแต่มืดมาทำข้าวกล่อง
  - ต้นกินข้าวกล่องใต้ต้นไม้ที่โรงเรียน
  hints:
  - หาคำบอกเวลา เมื่อคืน ตอนเช้า ตอนนี้
  - ลำดับที่เล่าไม่ใช่ลำดับที่เกิด
  solution: เมื่อคืน → ตอนเช้า → ตอนนี้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.prediction-inference.p004
  topics:
  - thai.reading.prediction-inference
  difficulty: 2
  type: mcq
  stem: อ่านเรื่องในภาพ ข้อใดเป็นสิ่งที่เรื่อง **บอกไว้ตรง ๆ** ไม่ใช่การอนุมาน
  figure: *id001
  choices:
  - id: a
    text: เมฆดำก้อนใหญ่ลอยใกล้เข้ามาทางทิศตะวันตก
    correct: true
    feedback: ถูก เขียนไว้ในประโยค (5)
  - id: b
    text: อีกไม่นานฝนจะตก
    feedback: เป็นการอนุมานจากเมฆดำ
  - id: c
    text: น้ำฝนอยากเอาชนะเด็กบ้านข้าง ๆ
    feedback: เป็นการอนุมานจากประโยค (6)
  - id: d
    text: พี่ชายเป็นห่วงความปลอดภัยของน้องสาว
    feedback: เป็นการอนุมานจากคำเตือน
  hints:
  - หาข้อความที่อยู่ในภาพเกือบคำต่อคำ
  - อนุมานคือสิ่งที่เราสรุปเอง
  solution: '**เมฆดำลอยใกล้เข้ามา** อยู่ในประโยค (5) ตรง ๆ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.prediction-inference.p005
  topics:
  - thai.reading.prediction-inference
  difficulty: 2
  type: text
  stem: '"เช้านี้ชาวบ้านบนดอยสวมเสื้อกันหนาวหนา ๆ ล้อมวงผิงไฟ พูดแล้วมีไอขาวออกจากปาก" อนุมานว่าเป็นฤดูใด (พิมพ์ชื่อฤดู)'
  accepted:
  - ฤดูหนาว
  - หน้าหนาว
  - หนาว
  misconceptions:
  - match: ฤดูร้อน
    feedback: ขัดกับหลักฐาน คนไม่ผิงไฟและสวมเสื้อหนาในฤดูร้อน
  - match: ฤดูฝน
    feedback: เรื่องไม่มีหลักฐานเรื่องฝน
  hints:
  - หลักฐานในเรื่องมีอะไรบ้าง
  - ไอขาวจากปากเกิดเมื่ออากาศเป็นอย่างไร
  solution: เสื้อกันหนาว ผิงไฟ ไอขาวจากปาก + ความรู้เดิม → **ฤดูหนาว**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.prediction-inference.p006
  topics:
  - thai.reading.prediction-inference
  difficulty: 3
  type: mcq
  stem: อ่านเรื่องในภาพ ประโยคใดเป็น **เบาะแส** ที่ทำให้คาดคะเนว่า "อีกไม่นานต้องเลิกเล่นเพราะฝนตก"
  figure: *id001
  choices:
  - id: a
    text: (5)
    correct: true
    feedback: ถูก เมฆดำก้อนใหญ่ลอยใกล้เข้ามา มักตามด้วยฝน
  - id: b
    text: (1)
    feedback: บอกเวลาและสถานที่เท่านั้น
  - id: c
    text: (4)
    feedback: เป็นเบาะแสเรื่องเชือกขาด ไม่ใช่ฝน
  - id: d
    text: (6)
    feedback: เป็นเบาะแสเรื่องเชือกขาด
  hints:
  - 'ความรู้เดิม: ฝนมักมากับอะไร'
  - หาประโยคที่พูดถึงท้องฟ้า
  solution: ประโยค **(5)** เมฆดำ + ความรู้เดิม → ฝนจะตก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.prediction-inference.p007
  topics:
  - thai.reading.prediction-inference
  difficulty: 3
  type: mcq
  stem: อ่านเรื่องในภาพ การคาดคะเนข้อใด **ไม่มีหลักฐาน** ในเรื่องเลย (เป็นการเดา)
  figure: *id001
  choices:
  - id: a
    text: ว่าวของน้ำฝนจะได้รางวัลการประกวดว่าวระดับประเทศ
    correct: true
    feedback: ถูก เรื่องไม่ได้พูดถึงการประกวดเลย
  - id: b
    text: ว่าวอาจลอยไปติดสายไฟ
    feedback: 'มีหลักฐาน: คำเตือนเรื่องเสาไฟฟ้า (2) และลมแรง (3)'
  - id: c
    text: ฝนอาจตกในไม่ช้า
    feedback: 'มีหลักฐาน: เมฆดำ (5)'
  - id: d
    text: เชือกอาจขาด
    feedback: 'มีหลักฐาน: เชือกเป็นขุย (4) และกระตุกแรง (6)'
  hints:
  - การคาดคะเนที่ดีชี้ได้ว่ามาจากประโยคใด
  - ข้อใดชี้ไม่ได้เลย
  solution: '**การประกวดระดับประเทศ** ไม่มีในเรื่อง จึงเป็นการเดา'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.prediction-inference.p008
  topics:
  - thai.reading.prediction-inference
  difficulty: 3
  type: match
  stem: จับคู่หลักฐานกับสิ่งที่อนุมานได้
  pairs:
  - left: มือเปื้อนแป้ง ในครัวมีกลิ่นหอมเนย
    right: กำลังทำขนม
  - left: ตาแดง จมูกแดง กอดตุ๊กตาแน่น
    right: เพิ่งร้องไห้
  - left: กระเป๋าวางอยู่หน้าประตู ใส่รองเท้าแล้ว
    right: กำลังจะออกจากบ้าน
  - left: หาวบ่อย ตาปรือ ฟุบโต๊ะ
    right: ง่วงนอน
  hints:
  - รวมหลักฐานกับความรู้เดิม
  - ถามว่าคนที่เป็นแบบนี้มักกำลังทำอะไรหรือรู้สึกอย่างไร
  solution: แป้งและกลิ่นเนย → ทำขนม · ตาแดงจมูกแดง → เพิ่งร้องไห้ · กระเป๋าและรองเท้า → จะออกจากบ้าน · หาวและตาปรือ → ง่วง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.prediction-inference.p009
  topics:
  - thai.reading.prediction-inference
  difficulty: 3
  type: mcq
  stem: '"แป้งยืนหน้าห้อง กำมือแน่น ก้มหน้า ไม่ยอมมองครู เมื่อครูเรียกชื่อให้ออกมาพูดหน้าชั้น" อนุมานความรู้สึกของแป้งได้อย่างไร'
  choices:
  - id: a
    text: กังวลหรือประหม่า
    correct: true
    feedback: ถูก กำมือแน่นและก้มหน้าเป็นอาการของความกังวล
  - id: b
    text: ดีใจมาก
    feedback: คนดีใจมักยิ้ม สบตา ไม่กำมือแน่นก้มหน้า
  - id: c
    text: โกรธครู
    feedback: เรื่องไม่มีหลักฐานว่าโกรธ
  - id: d
    text: ง่วงนอน
    feedback: ไม่มีอาการง่วง
  hints:
  - ดูการกระทำและท่าทางของตัวละคร
  - คนที่ประหม่ามักทำท่าอย่างไร
  solution: กำมือแน่น ก้มหน้า ไม่สบตา → **กังวลหรือประหม่า**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.prediction-inference.p010
  topics:
  - thai.reading.prediction-inference
  difficulty: 4
  type: mcq
  stem: อ่านเรื่องในภาพ ข้อใดเขียนการคาดคะเน **พร้อมเหตุผล** ได้ดีที่สุด
  figure: *id001
  choices:
  - id: a
    text: ฉันคาดว่าว่าวอาจไปติดสายไฟ เพราะพี่ชายเตือนเรื่องเสาไฟฟ้าที่คันนา และลมแรงขึ้นเรื่อย ๆ
    correct: true
    feedback: ถูก บอกการคาดคะเนและชี้หลักฐานสองข้อจากเรื่อง
  - id: b
    text: ฉันคาดว่าว่าวจะติดสายไฟ
    feedback: ไม่บอกเหตุผล
  - id: c
    text: ฉันคาดว่าน้ำฝนจะชนะ เพราะฉันชอบน้ำฝน
    feedback: ใช้ความชอบของตนเป็นเหตุผล
  - id: d
    text: ว่าวติดสายไฟเพราะว่าวสีแดง
    feedback: เรื่องไม่ได้บอกสีว่าว และสีไม่เกี่ยว
  hints:
  - 'รูปที่ดี: ฉันคาดว่า... เพราะในเรื่อง...'
  - เหตุผลต้องมาจากประโยคในเรื่อง
  solution: ข้อแรกมีทั้ง **การคาดคะเน** และ **หลักฐาน (2) (3)**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.prediction-inference.p011
  topics:
  - thai.reading.prediction-inference
  difficulty: 4
  type: mcq
  stem: นักเรียนคาดว่า "ตัวเอกจะชนะการแข่งวิ่ง เพราะเขาซ้อมทุกวัน" อ่านต่อพบว่า "ก่อนแข่งหนึ่งวัน เขาข้อเท้าแพลงจนเดินกะเผลก" ควรทำอย่างไร
  choices:
  - id: a
    text: ปรับการคาดคะเนใหม่ เช่น เขาอาจไม่ได้แข่งหรือแพ้ เพราะข้อเท้าแพลง
    correct: true
    feedback: ถูก ข้อมูลใหม่เปลี่ยนเหตุผล ต้องปรับตาม
  - id: b
    text: ยืนยันคำตอบเดิม เพราะคาดไว้แล้ว
    feedback: ไม่สนใจหลักฐานใหม่
  - id: c
    text: ไม่ต้องคาดคะเนอีก
    feedback: การคาดคะเนทำได้ตลอดการอ่าน
  - id: d
    text: ข้ามตอนนี้ไปอ่านตอนจบเลย
    feedback: ไม่ได้ฝึกคิดจากหลักฐาน
  hints:
  - หลักฐานใหม่ขัดกับเหตุผลเดิมหรือไม่
  - นักอ่านที่ดีทำอย่างไรเมื่อข้อมูลเปลี่ยน
  solution: เมื่อพบหลักฐานใหม่ **ปรับการคาดคะเน** ให้สอดคล้อง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.prediction-inference.p012
  topics:
  - thai.reading.prediction-inference
  difficulty: 4
  type: order
  stem: เรียงขั้นการ **คาดคะเนเหตุการณ์** อย่างมีเหตุผล
  items:
  - อ่านและลำดับเหตุการณ์ที่เกิดแล้ว
  - หาปัญหาที่ค้างอยู่และเบาะแสในเรื่อง
  - รวมเบาะแสกับความรู้เดิม
  - บอกการคาดคะเนพร้อมเหตุผล
  - อ่านต่อเพื่อตรวจและปรับการคาดคะเน
  hints:
  - เริ่มจากรู้ว่าเกิดอะไรขึ้นแล้ว
  - ขั้นสุดท้ายคือตรวจกับเรื่อง
  solution: ลำดับเหตุการณ์ → หาเบาะแส → รวมกับความรู้เดิม → คาดคะเนพร้อมเหตุผล → อ่านต่อและปรับ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.prediction-inference.p013
  topics:
  - thai.reading.prediction-inference
  difficulty: 4
  type: numeric
  stem: 'อ่าน: "ประตูโรงเรียนปิดเวลา 07.30 น. วันนี้ต้นออกจากบ้านเวลา 07.10 น. ทางเดินไปโรงเรียนใช้เวลา 25 นาทีทุกวัน" คาดคะเนว่าต้นจะมาถึงหลังประตูปิดกี่นาที'
  answer:
    value: 5
    unit: นาที
  misconceptions:
  - match: 20
    feedback: คำนวณเวลาจาก 07.10 ถึง 07.30 แต่ยังไม่ได้เทียบกับเวลาเดิน
  - match: 45
    feedback: บวก 20 กับ 25 ต้องลบ
  hints:
  - หาเวลาที่ต้นจะถึงโรงเรียนก่อน
  - เวลาที่ถึง − 07.30
