    answer: { value: 0.4226, tolerance: 0.0005 }
    hints:
      - "$25° + 65° = 90°$ เป็นมุมที่ประกอบกันเป็นมุมฉาก"
      - "$\\cos(90° - x) = \\sin x$"
    misconceptions:
      - { match: 0.5774, feedback: "คิดว่า $\\cos 65° = 1 - \\sin 25°$ แต่ความสัมพันธ์ที่ถูกคือ $\\cos(90° - x) = \\sin x$" }
    solution: "$\\cos 65° = \\cos(90° - 25°) = \\sin 25° \\approx 0.4226$ เพราะในสามเหลี่ยมมุมฉาก ด้านตรงข้ามมุม 25° คือด้านประชิดมุม 65°"
