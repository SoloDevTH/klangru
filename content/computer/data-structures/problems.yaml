    type: mcq
    stem: "ระบบบันทึกคะแนนสอบของโรงเรียนต้อง (1) ค้นคะแนนของนักเรียนจากเลขประจำตัวบ่อยมาก และ (2) วันละครั้งแสดงรายชื่อคนที่ได้คะแนนระหว่าง 40 ถึง 49 คะแนนเรียงจากน้อยไปมาก ข้อใดเลือกได้เหมาะสมที่สุด"
    choices:
      - { id: a, text: "ใช้ดิกชันนารีจากเลขประจำตัวไปคะแนนสำหรับงาน (1) และต้นไม้ค้นหาแบบทวิภาคที่สมดุลซึ่งใช้คะแนนเป็นคีย์สำหรับงาน (2)", correct: true }
      - { id: b, text: "ใช้ดิกชันนารีอย่างเดียวสำหรับทั้งสองงาน เพราะเร็วที่สุด", feedback: "ดิกชันนารีเร็วสำหรับค้นด้วยคีย์ แต่ไม่ได้เรียงตามคะแนน งาน (2) ต้องไล่ทุกคนแล้วเรียงใหม่ทุกครั้ง" }
      - { id: c, text: "ใช้สแตกเก็บคะแนนทั้งหมด", feedback: "สแตกเข้าถึงได้เฉพาะตัวบนสุด ค้นด้วยเลขประจำตัวต้องรื้อทั้งกอง" }
      - { id: d, text: "ใช้ต้นไม้ค้นหาแบบทวิภาคโดยใส่คะแนนที่เรียงแล้วตามลำดับ", feedback: "ใส่ข้อมูลที่เรียงแล้วตามลำดับทำให้ต้นไม้เอียง ช้าเท่าลิสต์ และไม่ได้ช่วยงาน (1)" }
    hints:
