  choices:
  - id: a
    text: สุนทรภู่เป็นกวีเอก จึงทำอะไรก็ถูก
    feedback: อ้างชื่อเสียงแทนเหตุผล
  - id: b
    text: การคร่ำครวญถึงหญิงเป็นขนบของนิราศ สุนทรภู่อธิบายเองท้ายเรื่องว่าเหมือนพริกไทยใบผักชีที่โรยหน้าอาหาร จึงควรพิจารณาขนบก่อนตัดสิน
    correct: true
    feedback: ถูก อ้างขนบและตัวบท
  - id: c
    text: เห็นด้วย ควรห้ามเรียนเรื่องนี้
    feedback: ตัดสินด้วยค่านิยมปัจจุบันโดยไม่ดูขนบ
  - id: d
    text: นิราศไม่มีเนื้อหาเรื่องผู้หญิงเลย
    feedback: ขัดกับตัวบท
  hints:
  - นิราศมีแบบแผนอะไร
  - สุนทรภู่อธิบายเรื่องนี้ไว้ตอนท้ายอย่างไร
  solution: การคร่ำครวญเป็น **ขนบของนิราศ** และกวี **อธิบายไว้เองด้วยอุปมาแม่ครัวโรยผักชี**
