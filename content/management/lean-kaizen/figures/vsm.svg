<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" font-family="sans-serif" font-size="15">
  <title>แผนผังสายธารคุณค่าอย่างง่ายของโรงงานตัดเย็บเสื้อ สี่ขั้นตอน พร้อมเส้นเวลาเปรียบเทียบเวลารอกับเวลาเพิ่มคุณค่า</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15211e"/></marker></defs>
  <polygon points="32.0,120.0 64.0,120.0 48.0,92.0" fill="#f6d36b" stroke="#15211e" stroke-width="1.5"/>
  <text x="48.0" y="111.0" text-anchor="middle" dominant-baseline="middle" fill="#15211e" font-size="12" font-weight="bold">I</text>
  <text x="48.0" y="138.0" text-anchor="middle" dominant-baseline="middle" fill="#b4521f" font-size="12" font-weight="bold">2 วัน</text>
  <rect x="80" y="60" width="96" height="78" rx="4" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="128.0" y="82.0" text-anchor="middle" dominant-baseline="middle" fill="#15211e" font-size="14" font-weight="bold">ตัดผ้า</text>
  <text x="128.0" y="110.0" text-anchor="middle" dominant-baseline="middle" fill="#15211e" font-size="12">CT = 40 s</text>
  <line x1="178.0" y1="100.0" x2="218.0" y2="100.0" stroke="#15211e" stroke-width="1.5" marker-end="url(#ah)"/>
  <polygon points="222.0,120.0 254.0,120.0 238.0,92.0" fill="#f6d36b" stroke="#15211e" stroke-width="1.5"/>
  <text x="238.0" y="111.0" text-anchor="middle" dominant-baseline="middle" fill="#15211e" font-size="12" font-weight="bold">I</text>
  <text x="238.0" y="138.0" text-anchor="middle" dominant-baseline="middle" fill="#b4521f" font-size="12" font-weight="bold">1.5 วัน</text>
  <rect x="270" y="60" width="96" height="78" rx="4" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="318.0" y="82.0" text-anchor="middle" dominant-baseline="middle" fill="#15211e" font-size="14" font-weight="bold">เย็บ</text>
  <text x="318.0" y="110.0" text-anchor="middle" dominant-baseline="middle" fill="#15211e" font-size="12">CT = 90 s</text>
  <line x1="368.0" y1="100.0" x2="408.0" y2="100.0" stroke="#15211e" stroke-width="1.5" marker-end="url(#ah)"/>
  <polygon points="412.0,120.0 444.0,120.0 428.0,92.0" fill="#f6d36b" stroke="#15211e" stroke-width="1.5"/>
  <text x="428.0" y="111.0" text-anchor="middle" dominant-baseline="middle" fill="#15211e" font-size="12" font-weight="bold">I</text>
  <text x="428.0" y="138.0" text-anchor="middle" dominant-baseline="middle" fill="#b4521f" font-size="12" font-weight="bold">1 วัน</text>
  <rect x="460" y="60" width="96" height="78" rx="4" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="508.0" y="82.0" text-anchor="middle" dominant-baseline="middle" fill="#15211e" font-size="14" font-weight="bold">ตรวจ</text>
  <text x="508.0" y="110.0" text-anchor="middle" dominant-baseline="middle" fill="#15211e" font-size="12">CT = 20 s</text>
  <line x1="558.0" y1="100.0" x2="598.0" y2="100.0" stroke="#15211e" stroke-width="1.5" marker-end="url(#ah)"/>
  <polygon points="602.0,120.0 634.0,120.0 618.0,92.0" fill="#f6d36b" stroke="#15211e" stroke-width="1.5"/>
  <text x="618.0" y="111.0" text-anchor="middle" dominant-baseline="middle" fill="#15211e" font-size="12" font-weight="bold">I</text>
  <text x="618.0" y="138.0" text-anchor="middle" dominant-baseline="middle" fill="#b4521f" font-size="12" font-weight="bold">0.5 วัน</text>
  <rect x="650" y="60" width="96" height="78" rx="4" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="698.0" y="82.0" text-anchor="middle" dominant-baseline="middle" fill="#15211e" font-size="14" font-weight="bold">แพ็ก</text>
  <text x="698.0" y="110.0" text-anchor="middle" dominant-baseline="middle" fill="#15211e" font-size="12">CT = 30 s</text>
  <line x1="0.0" y1="100.0" x2="30.0" y2="100.0" stroke="#15211e" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="748.0" y1="100.0" x2="786.0" y2="100.0" stroke="#15211e" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="808.0" y="100.0" text-anchor="middle" dominant-baseline="middle" fill="#15211e" font-size="13" font-weight="bold">ลูกค้า</text>
  <text x="50.0" y="186.0" text-anchor="middle" dominant-baseline="middle" fill="#b4521f" font-size="12">2 วัน</text>
  <text x="128.0" y="251.0" text-anchor="middle" dominant-baseline="middle" fill="#0a6b60" font-size="12" font-weight="bold">40 s</text>
  <text x="223.0" y="186.0" text-anchor="middle" dominant-baseline="middle" fill="#b4521f" font-size="12">1.5 วัน</text>
  <text x="318.0" y="251.0" text-anchor="middle" dominant-baseline="middle" fill="#0a6b60" font-size="12" font-weight="bold">90 s</text>
  <text x="413.0" y="186.0" text-anchor="middle" dominant-baseline="middle" fill="#b4521f" font-size="12">1 วัน</text>
  <text x="508.0" y="251.0" text-anchor="middle" dominant-baseline="middle" fill="#0a6b60" font-size="12" font-weight="bold">20 s</text>
  <text x="603.0" y="186.0" text-anchor="middle" dominant-baseline="middle" fill="#b4521f" font-size="12">0.5 วัน</text>
  <text x="698.0" y="251.0" text-anchor="middle" dominant-baseline="middle" fill="#0a6b60" font-size="12" font-weight="bold">30 s</text>
  <polyline points="20.0,200.0 80.0,200.0 80.0,235.0 176.0,235.0 176.0,200.0 270.0,200.0 270.0,235.0 366.0,235.0 366.0,200.0 460.0,200.0 460.0,235.0 556.0,235.0 556.0,200.0 650.0,200.0 650.0,235.0 746.0,235.0" fill="none" stroke="#15211e" stroke-width="2"/>
  <text x="20.0" y="275.0" text-anchor="start" dominant-baseline="middle" fill="#b4521f" font-size="13" font-weight="bold">รวม: เวลานำ ≈ 5 วัน</text>
  <text x="200.0" y="275.0" text-anchor="start" dominant-baseline="middle" fill="#0a6b60" font-size="13" font-weight="bold">เวลาเพิ่มคุณค่า 40 + 90 + 20 + 30 = 180 s</text>
  <text x="20.0" y="302.0" text-anchor="start" dominant-baseline="middle" fill="#6b7a76" font-size="12">ด้านบนของเส้นเวลาคือเวลาที่งานรออยู่ในคลัง ด้านล่างคือเวลาที่ลงมือทำจริง (CT = รอบเวลา)</text>
</svg>
