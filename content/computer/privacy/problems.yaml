      - { match: 216, feedback: "คูณ 12 แทนการหาร รายได้ต่อเดือนต้องน้อยกว่ารายได้ต่อปี" }
    solution: "รายได้ต่อคนต่อปี = 36,000,000 ÷ 2,000,000 = 18 บาท ต่อเดือน = 18 ÷ 12 = 1.5 บาท ตัวเลขต่อคนดูน้อย แต่รวมผู้ใช้จำนวนมากเป็นรายได้หลายสิบล้าน นี่คือเหตุผลที่บริการฟรีอยากเก็บข้อมูลมาก และเป็นผลทางเศรษฐกิจของความเป็นส่วนตัว"
