<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" font-family="sans-serif" font-size="14">
  <title>ตารางจัดลำดับความเห็น ผลต่อผู้ใช้มากและแรงน้อยทำก่อน ผลมากแรงมากวางแผนทำ ผลน้อยแรงน้อยทำถ้ามีเวลา ผลน้อยแรงมากพักไว้</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="640" height="430" fill="#ffffff"/>
  <rect x="90.0" y="30.0" width="250.0" height="165.0" rx="0" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <text x="215.0" y="58.0" font-size="16" text-anchor="middle" fill="#15803d" font-weight="bold" xml:space="preserve">ทำก่อน</text>
  <rect x="340.0" y="30.0" width="250.0" height="165.0" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="465.0" y="58.0" font-size="16" text-anchor="middle" fill="#2563eb" font-weight="bold" xml:space="preserve">วางแผนทำ</text>
  <rect x="90.0" y="195.0" width="250.0" height="165.0" rx="0" fill="#f3f4f6" stroke="#4b5563" stroke-width="1"/>
  <text x="215.0" y="223.0" font-size="16" text-anchor="middle" fill="#4b5563" font-weight="bold" xml:space="preserve">ทำถ้ามีเวลา</text>
  <rect x="340.0" y="195.0" width="250.0" height="165.0" rx="0" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>
  <text x="465.0" y="223.0" font-size="16" text-anchor="middle" fill="#b91c1c" font-weight="bold" xml:space="preserve">พักไว้</text>
  <line x1="90.0" y1="360.0" x2="610.0" y2="360.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="90.0" y1="360.0" x2="90.0" y2="18.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="340.0" y="390.0" font-size="14" text-anchor="middle" fill="#6b7280" xml:space="preserve">แรงที่ต้องใช้  →  มาก</text>
  <text x="90.0" y="390.0" font-size="13" text-anchor="middle" fill="#6b7280" xml:space="preserve">น้อย</text>
  <text x="30" y="195.0" font-size="14" fill="#6b7280" text-anchor="middle" transform="rotate(-90 30 195.0)">ผลต่อผู้ใช้  →  มาก</text>
  <circle cx="200.0" cy="122.4" r="15.0" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="200.0" y="127.4" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">1</text>
  <text x="200.0" y="158.4" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">ขยายปุ่มยืนยัน</text>
  <circle cx="465.0" cy="122.4" r="15.0" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="465.0" y="127.4" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">2</text>
  <text x="465.0" y="158.4" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">ให้ผู้ปกครองจ่ายเงินแทน</text>
  <circle cx="215.0" cy="287.4" r="15.0" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="215.0" y="292.4" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">3</text>
  <text x="215.0" y="323.4" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">เปลี่ยนสีธีม</text>
  <circle cx="465.0" cy="287.4" r="15.0" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="465.0" y="292.4" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">4</text>
  <text x="465.0" y="323.4" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">แนะนำเมนูด้วย AI</text>
</svg>
