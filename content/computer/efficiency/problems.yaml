    answer: { value: 201, unit: "" }
    hints:
      - "แก้อสมการ 100n < n²/2"
      - "หารด้วย n (ที่เป็นบวก) แล้วระวังเครื่องหมายน้อยกว่าแท้"
    misconceptions:
      - { match: 200, feedback: "ที่ n = 200 ทั้งสองแบบใช้ 20,000 ขั้นเท่ากัน ยังไม่น้อยกว่า" }
      - { match: 100, feedback: "ลืมตัวหาร 2 ใน n²/2 (100n < n² ได้ n > 100)" }
    solution: "100n < n²/2 ⇔ 200 < n จึงต้อง n ≥ 201 ตรวจ n = 201: A = 20,100 B = 20,200.5 แบบ A (O(n)) จึงชนะเมื่อข้อมูลใหญ่พอ แต่ข้อมูลไม่ถึง 200 ตัว แบบ B (O(n²)) ใช้ขั้นน้อยกว่า"
