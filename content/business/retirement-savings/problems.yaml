problems:
- id: business.econ.retirement-savings.p001
  topics:
  - business.econ.retirement-savings
  difficulty: 1
  type: mcq
  stem: ข้อใดอธิบาย **บำนาญ** ได้ถูกต้องที่สุด
  choices:
  - id: a
    text: เงินก้อนที่ได้รับครั้งเดียวเมื่อลาออกจากงาน
    feedback: นั่นคือเงินก้อนครั้งเดียว ซึ่งต่างจากบำนาญที่จ่ายเป็นงวด
  - id: b
    text: เงินที่จ่ายเป็นงวด ๆ ตลอดช่วงหลังเกษียณ
    correct: true
  - id: c
    text: เงินที่รัฐแจกให้ทุกคนเมื่ออายุครบ 60 ปีโดยไม่มีเงื่อนไข
    feedback: ความช่วยเหลือจากรัฐมีเกณฑ์และเงื่อนไข ไม่ได้แจกทุกคนโดยไม่มีเงื่อนไข
  - id: d
    text: ดอกเบี้ยที่ได้จากเงินฝากประจำทุกเดือน
    feedback: ดอกเบี้ยเป็นผลตอบแทนจากเงินต้น ไม่ใช่ความหมายของบำนาญ
  hints:
  - 'เทียบกับเงินก้อนที่ได้ครั้งเดียว: บำนาญต่างจากนั้นอย่างไร'
  - ดูว่าเงินถูกจ่ายครั้งเดียวหรือหลายครั้ง และจ่ายเมื่อไร
  solution: บำนาญคือเงินที่จ่ายเป็นงวดตลอดช่วงหลังเกษียณ เช่นทุกเดือน เพื่อให้มีรายได้ใช้ชีวิตต่อเนื่อง ส่วนเงินก้อนครั้งเดียวเรียกว่าบำเหน็จ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.retirement-savings.p002
  topics:
  - business.econ.retirement-savings
  difficulty: 1
  type: match
  stem: จับคู่ระบบเงินออมเพื่อวัยเกษียณกับลักษณะของระบบ
  pairs:
  - left: ประกันสังคม มาตรา 33
    right: ระบบบังคับสำหรับลูกจ้างที่มีนายจ้าง ทั้งลูกจ้างและนายจ้างจ่ายสมทบ
  - left: กองทุนการออมแห่งชาติ (กอช.)
    right: ระบบสมัครใจ รัฐร่วมสมทบตามเงื่อนไข
  - left: กองทุนสำรองเลี้ยงชีพ
    right: นายจ้างตั้งกองทุน ลูกจ้างและนายจ้างสมทบตามข้อตกลง
  - left: Superannuation ของออสเตรเลีย
    right: นายจ้างต้องจ่ายสมทบเข้ากองทุนตามอัตราที่กฎหมายกำหนด
  hints:
  - ดูว่าใครเป็นผู้จ่ายสมทบ และการจ่ายนั้นบังคับหรือสมัครใจ
  - กองทุนของนายจ้างกับกองทุนของรัฐต่างกันที่ผู้ตั้งและผู้ร่วมจ่าย
  solution: ประกันสังคม มาตรา 33 เป็นระบบบังคับของลูกจ้าง · กอช. เป็นระบบสมัครใจที่รัฐร่วมสมทบ · กองทุนสำรองเลี้ยงชีพเกิดจากการตกลงของนายจ้างกับลูกจ้าง · Superannuation ของออสเตรเลียให้นายจ้างจ่ายสมทบตามกฎหมาย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.retirement-savings.p003
  topics:
  - business.econ.retirement-savings
  difficulty: 1
  type: numeric
  stem: ลูกจ้างมาตรา 33 มีเงินเดือน 12,000 บาท จ่ายเงินสมทบร้อยละ 5 ของค่าจ้างทุกเดือน ลูกจ้างจ่ายเงินสมทบเดือนละกี่บาท (ตอบเป็นบาท)
  answer:
    value: 600.0
    tolerance: 0.5
    unit: บาท
  misconceptions:
  - match: 60
    feedback: 0.5% ไม่ใช่ 5% ให้เอา 5 หารด้วย 100 ก่อนคูณ
  - match: 1200
    feedback: คิดเป็น 10% ไม่ใช่ 5%
  hints:
  - เงินสมทบคิดเป็นร้อยละของค่าจ้าง
  - คำนวณ 12,000 คูณ 5 แล้วหารด้วย 100
  solution: 12,000 × 0.05 = 600 บาทต่อเดือน (ยังไม่ถึงเพดาน 15,000 บาทของฐานค่าจ้าง)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.retirement-savings.p004
  topics:
  - business.econ.retirement-savings
  difficulty: 2
  type: numeric
  stem: ลูกจ้างมาตรา 33 มีเงินเดือน 20,000 บาท ลูกจ้างจ่ายเงินสมทบเดือนละกี่บาท โดยใช้เพดานฐานค่าจ้าง 15,000 บาท (ตอบเป็นบาท)
  answer:
    value: 750.0
    tolerance: 0.5
    unit: บาท
  misconceptions:
  - match: 1000
    feedback: ลืมเพดาน ฐานค่าจ้างคิดได้ไม่เกิน 15,000 บาท ไม่ใช่ 20,000 บาท
  hints:
  - ตรวจก่อนว่าค่าจ้างเกินเพดานฐานค่าจ้างหรือไม่
  - คิดเงินสมทบจากฐานที่ถูกจำกัด แล้วคูณด้วย 5%
  solution: ฐานค่าจ้างถูกจำกัดที่ 15,000 บาท จึงได้ 15,000 × 0.05 = 750 บาทต่อเดือน ซึ่งเป็นเพดานสูงสุดของลูกจ้างฝ่ายละ 750 บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.retirement-savings.p005
  topics:
  - business.econ.retirement-savings
  difficulty: 2
  type: numeric
  stem: ลูกจ้างมาตรา 33 ที่มีฐานค่าจ้าง 15,000 บาท ทั้งลูกจ้างและนายจ้างจ่ายสมทบฝ่ายละ 5% เท่ากัน ตลอด 12 เดือน ยอดรวมเงินสมทบของทั้งสองฝ่ายในหนึ่งปีเป็นกี่บาท (ตอบเป็นบาท)
  answer:
    value: 18000.0
    tolerance: 0.5
    unit: บาท
  misconceptions:
  - match: 9000.0
    feedback: ลืมนับเงินสมทบของนายจ้าง ต้องรวมทั้งสองฝ่าย
  - match: 750
    feedback: นั่นคือของเดือนเดียว ต้องคูณ 12 เดือนและคูณ 2 ฝ่าย
  hints:
  - คำนวณเงินสมทบของลูกจ้างหนึ่งเดือนก่อน
  - ต้องนับทั้งลูกจ้างและนายจ้าง แล้วคูณด้วย 12 เดือน
  solution: ฝ่ายละ 750 บาทต่อเดือน × 2 ฝ่าย × 12 เดือน = 18,000 บาทต่อปี
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.retirement-savings.p006
  topics:
  - business.econ.retirement-savings
  difficulty: 1
  type: text
  stem: กอช. ย่อมาจากชื่อเต็มว่าอะไร (ตอบเป็นภาษาไทย)
  accepted:
  - กองทุนการออมแห่งชาติ
  - กองทุนการออมแห่งชาติ (กอช.)
  hints:
  - ชื่อกองทุนมีคำว่า "การออม" อยู่ด้วย
  - เป็นกองทุนที่รัฐตั้งขึ้นเพื่อให้ประชาชนออมเพื่อวัยเกษียณ
  solution: กองทุนการออมแห่งชาติ ก่อตั้ง พ.ศ. 2554 เป็นระบบออมเพื่อวัยเกษียณแบบสมัครใจ โดยรัฐร่วมสมทบตามเงื่อนไขที่กำหนดในกฎกระทรวง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.retirement-savings.p007
  topics:
  - business.econ.retirement-savings
  difficulty: 2
  type: numeric
  stem: ฝากเงิน 10,000 บาท ดอกเบี้ยอัตรา 4% ต่อปี ทบต้นทุกปี ทิ้งไว้ 10 ปี จะได้เงินรวมเท่าไร (ตอบเป็นบาท ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 14802.44
    tolerance: 0.5
    unit: บาท
  misconceptions:
  - match: 14000.0
    feedback: คิดดอกเบี้ยอย่างง่าย (ไม่ทบต้น) ดอกเบี้ยปีที่สองต้องคิดจากเงินต้นรวมดอกเบี้ยที่สะสมแล้ว
  hints:
  - ทบต้นหมายถึงดอกเบี้ยของปีก่อนได้ดอกเบี้ยต่อในปีถัดไป
  - ใช้สูตร P(1+r)^n โดย r = 0.04 และ n = 10
  solution: 10,000 × (1.04)^10 = 14,802.44 บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.retirement-savings.p008
  topics:
  - business.econ.retirement-savings
  difficulty: 3
  type: numeric
  stem: ออมปีละ 10,000 บาท ทุกสิ้นปี เป็นเวลา 30 ปี ดอกเบี้ย 5% ต่อปี ทบต้นทุกปี เงินรวมเมื่อสิ้นปีที่ 30 เท่าไร (ตอบเป็นบาท ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 664388.48
    tolerance: 1
    unit: บาท
  misconceptions:
  - match: 300000
    feedback: ลืมดอกเบี้ย การรวมเงินฝากอย่างเดียวได้ 300,000 บาท
  - match: 43219.42
    feedback: ฝากครั้งเดียวแล้วทบต้น ไม่ใช่ฝากทุกปี
  hints:
  - ทุกก้อนที่ฝากแต่ละปีโตไม่เท่ากัน ตามจำนวนปีที่ฝาก
  - 'ใช้สูตรอนุกรมเรขาคณิต: 10,000 × ((1.05)^30 − 1) ÷ 0.05'
  solution: 10,000 × ((1.05)^30 − 1) ÷ 0.05 = 664,388.48 บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.retirement-savings.p009
  topics:
  - business.econ.retirement-savings
  difficulty: 3
  type: numeric
  stem: สองคนออมปีละ 10,000 บาท ทุกสิ้นปี ดอกเบี้ย 5% ต่อปี ทบต้น คนแรกเริ่มออมตอนอายุ 25 ออมครบ 30 ครั้งจนถึงอายุ 55 คนที่สองเริ่มตอนอายุ 35 ออมครบ 20 ครั้งจนถึงอายุ 55 เมื่ออายุ 55 คนแรกมีเงินมากกว่าคนที่สองกี่บาท (ตอบเป็นบาท)
  answer:
    value: 333728.93
    tolerance: 1
    unit: บาท
  misconceptions:
  - match: 100000
    feedback: ไม่คิดดอกเบี้ย เงินต่างกันเพียงจำนวนครั้งที่ออม ต้องคิดการทบต้นด้วย
  hints:
  - หาเงินรวมของแต่ละคนเมื่ออายุ 55 แยกกันก่อน
  - คนแรกออม 30 ครั้ง คนที่สองออม 20 ครั้ง ใช้สูตรอนุกรมกับทั้งสองคน
  solution: คนแรก 10,000 × ((1.05)^30 − 1) ÷ 0.05 = 664,388.48 บาท คนที่สอง 10,000 × ((1.05)^20 − 1) ÷ 0.05 = 330,659.54 บาท ต่างกัน 333,728.93 บาท ส่วนต่างมาจากการเริ่มออมเร็ว 10 ปี
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.retirement-savings.p010
  topics:
  - business.econ.retirement-savings
  difficulty: 3
  type: numeric
  stem: ลงทุน 500,000 บาท ได้ผลตอบแทนก่อนค่าธรรมเนียม 5% ต่อปี ทบต้น แต่มีค่าธรรมเนียม 1% ต่อปีหักจากเงินลงทุน 20 ปี เทียบกับไม่มีค่าธรรมเนียม ปลายทางต่างกันกี่บาท (ใช้ผลตอบแทนสุทธิ 4% ต่อปี และตอบเป็นบาท)
  answer:
    value: 231087.28
    tolerance: 1
    unit: บาท
  misconceptions:
  - match: 100000.0
    feedback: รวมค่าธรรมเนียมแบบไม่ทบต้น 1% × 500,000 × 20 ปี ได้ 100,000 บาท แต่จริงต้องคิดจากเงินที่ลดลงทุกปี
  hints:
  - ค่าธรรมเนียมหักทุกปี ทำให้ผลตอบแทนสุทธิเป็น 5% − 1% = 4%
  - เทียบ 500,000 × (1.05)^20 กับ 500,000 × (1.04)^20
  solution: 500,000 × 1.05^20 = 1,326,648.85 และ 500,000 × 1.04^20 = 1,095,561.57 ต่างกัน 231,087.28 บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.retirement-savings.p011
  topics:
  - business.econ.retirement-savings
  difficulty: 3
  type: numeric
  stem: ถ้าเงินเฟ้อเฉลี่ย 3% ต่อปี เงิน 1,000,000 บาทที่จะได้รับในอีก 20 ปีข้างหน้า มีอำนาจซื้อเท่ากับเงินกี่บาทในวันนี้ (ตอบเป็นบาท ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 553675.75
    tolerance: 1
    unit: บาท
  misconceptions:
  - match: 400000.0
    feedback: เงินเฟ้อทบต้น ค่าเงินลดลงเป็นสัดส่วนทุกปี ไม่ได้ลดแบบเส้นตรง
  hints:
  - อำนาจซื้อลดลงทุกปีด้วยอัตราเดิมจากค่าเดิม
  - หารด้วย (1.03)^20 เพื่อแปลงเป็นมูลค่าของวันนี้
  solution: 1,000,000 ÷ 1.03^20 = 553,675.75 บาท ของวันนี้ ซึ่งลดลงประมาณ 446,324 บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.retirement-savings.p012
  topics:
  - business.econ.retirement-savings
  difficulty: 2
  type: mcq
  multiple: true
  stem: ปัจจัยใดช่วยให้เงินออมเพื่อวัยเกษียณเติบโตมากขึ้น (เลือกทุกข้อที่ถูก)
  choices:
  - id: a
    text: เริ่มออมตั้งแต่อายุน้อย
    correct: true
  - id: b
    text: ค่าธรรมเนียมกองทุนต่ำลง
    correct: true
  - id: c
    text: นายจ้างร่วมสมทบตามระบบที่กำหนด
    correct: true
  - id: d
    text: ถอนเงินออกทุกครั้งที่ราคาสินทรัพย์ลดลง
    feedback: การถอนบ่อยทำให้เสียโอกาสที่เงินจะทบต้นต่อ
  hints:
  - ดูว่าปัจจัยไหนทำให้เงินต้นมากขึ้นหรือเวลาทบต้นนานขึ้น
  - ปัจจัยที่เพิ่มเงินเข้าหรือลดการสูญเสียจะช่วยให้เงินโต
  solution: เริ่มออมเร็วให้เวลาทบต้นนานขึ้น ค่าธรรมเนียมต่ำทำให้ผลตอบแทนสุทธิสูงขึ้น และการสมทบจากนายจ้างเป็นเงินเพิ่มที่ไม่ต้องออมเอง ส่วนการถอนบ่อยทำให้ขาดช่วงการทบต้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.retirement-savings.p013
  topics:
  - business.econ.retirement-savings
  difficulty: 2
  type: mcq
  stem: ตามกฎหมายของออสเตรเลีย ตั้งแต่ 1 กรกฎาคม 2568 นายจ้างต้องจ่ายเงินสมทบ superannuation เท่ากับกี่เปอร์เซ็นต์ของค่าจ้างปกติ
  choices:
  - id: a
    text: 12%
    correct: true
  - id: b
    text: 11.5%
    feedback: อัตรานี้ใช้จนถึง 30 มิถุนายน 2568 ก่อนปรับเป็นอัตราปัจจุบัน
  - id: c
    text: 9.5%
    feedback: เป็นอัตราในอดีต ไม่ใช่อัตราของปี 2568
  - id: d
    text: 15%
    feedback: ไม่ใช่อัตรา superannuation guarantee
  hints:
  - อัตรานี้ปรับขึ้นเป็นระยะ ให้ดูว่าอัตราใดมีผลตั้งแต่ 1 กรกฎาคม 2568
  - ตัวเลือกที่เป็นอัตราของปีก่อนหน้าก็ปรากฏอยู่ด้วย ให้ระวัง
  solution: นายจ้างต้องจ่ายเงินสมทบ 12% ของค่าจ้างปกติให้กองทุน superannuation ตั้งแต่ 1 กรกฎาคม 2568 (เพิ่มจาก 11.5%) ตรวจอัตราอีกครั้งกับหน่วยงานของออสเตรเลียก่อนเผยแพร่
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.retirement-savings.p014
  topics:
  - business.econ.retirement-savings
  difficulty: 4
  type: numeric
  stem: ต้องการเงิน 1,000,000 บาทเมื่ออายุ 60 ปี เริ่มออมตั้งแต่อายุ 25 ปี (รวม 35 ครั้ง ออมทุกสิ้นปี) ดอกเบี้ย 5% ต่อปี ทบต้น ต้องออมปีละกี่บาท (ตอบเป็นบาท ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 11071.71
    tolerance: 1
