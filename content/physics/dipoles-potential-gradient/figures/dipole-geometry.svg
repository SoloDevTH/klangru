<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="sans-serif">
  <title>ไดโพลไฟฟ้าที่ประจุบวกและลบห่างกันเล็กน้อย พร้อมจุดที่อยู่บนแกนและตั้งฉากกับแกน</title>
  <rect width="640" height="340" fill="#ffffff"/>
  <line x1="230.0" y1="170.0" x2="410.0" y2="170.0" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="260.0" y1="320.0" x2="260.0" y2="270.0" stroke="#333" stroke-width="0"/>
  <defs><marker id="m5" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7a4b00"/></marker>
  <marker id="e5" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2a9d5c"/></marker></defs>
  <line x1="274.0" y1="124.0" x2="366.0" y2="124.0" stroke="#7a4b00" stroke-width="3" marker-end="url(#m5)"/>
  <text x="320.0" y="232.0" font-size="16" text-anchor="middle" fill="#7a4b00">p ชี้จากประจุลบไปประจุบวก</text>
  <circle cx="380.0" cy="170.0" r="16" fill="#c0392b"/>
  <text x="380.0" y="176.0" font-size="20" text-anchor="middle" fill="#ffffff">+</text>
  <circle cx="260.0" cy="170.0" r="16" fill="#1d4f91"/>
  <text x="260.0" y="176.0" font-size="20" text-anchor="middle" fill="#ffffff">−</text>
  <line x1="320.0" y1="170.0" x2="470.0" y2="170.0" stroke="#333" stroke-width="0"/>
  <circle cx="520.0" cy="170.0" r="4" fill="#2a9d5c"/>
  <text x="520.0" y="194.0" font-size="14" text-anchor="middle" fill="#2a9d5c">จุด A (บนแกน)</text>
  <line x1="320.0" y1="170.0" x2="520.0" y2="170.0" stroke="#2a9d5c" stroke-width="0"/>
  <circle cx="320.0" cy="50.0" r="4" fill="#2a9d5c"/>
  <text x="330.0" y="54.0" font-size="14" fill="#2a9d5c">จุด B (ตั้งฉากกับแกน)</text>
  <line x1="320.0" y1="170.0" x2="320.0" y2="50.0" stroke="#2a9d5c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="332.0" y="108.0" font-size="15" fill="#2a9d5c">r</text>
  <text x="420.0" y="160.0" font-size="15" fill="#2a9d5c">r</text>
  <text x="320.0" y="326.0" font-size="14" text-anchor="middle" fill="#555">บนแกนไดโพล E = 2kp/r³ ตั้งฉากกับแกน E = kp/r³ (ขนาด)</text>
</svg>
