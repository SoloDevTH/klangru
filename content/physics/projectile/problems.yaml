problems:
  - id: phy.proj.p001
    topics: [physics.kinematics.projectile]
    difficulty: 1
    type: mcq
    stem: "เตะลูกฟุตบอลขึ้นไปในแนวเฉียง ไม่คิดแรงต้านอากาศ ที่จุดสูงสุดของแนวการเคลื่อนที่ ความเร็วของลูกบอลเป็นอย่างไร"
    choices:
      - { id: a, text: "เท่ากับองค์ประกอบแนวราบของความเร็วต้น ทิศขนานกับพื้น", correct: true }
      - { id: b, text: "เป็นศูนย์ เพราะลูกบอลหยุดชั่วขณะก่อนตกลง", feedback: "ลูกบอลหยุดชั่วขณะเฉพาะเมื่อโยนขึ้นตรง ๆ เมื่อเตะเฉียง ที่จุดสูงสุดเฉพาะความเร็วแนวดิ่งที่เป็นศูนย์ ความเร็วแนวราบยังอยู่" }
      - { id: c, text: "มีเฉพาะความเร็วแนวดิ่งชี้ลง", feedback: "ที่จุดสูงสุดความเร็วแนวดิ่งเป็นศูนย์พอดี กำลังจะเปลี่ยนจากขึ้นเป็นลง ส่วนที่เหลืออยู่คือความเร็วแนวราบ" }
      - { id: d, text: "เท่ากับความเร็วตอนเตะ", feedback: "ความเร็วแนวดิ่งลดลงจนเป็นศูนย์ที่จุดสูงสุด ความเร็วรวมจึงน้อยกว่าตอนเตะ เหลือเพียงองค์ประกอบแนวราบ" }
    hints:
      - "แยกคิดความเร็วแนวราบและแนวดิ่ง แต่ละแนวเปลี่ยนไปอย่างไรระหว่างลอย"
      - "ที่จุดสูงสุด ลูกบอลหยุดขึ้นในแนวดิ่ง แต่ยังเคลื่อนที่ไปข้างหน้าหรือไม่"
    solution: "แนวราบไม่มีความเร่ง $v_x = u\\cos\\theta$ คงตัวตลอด แนวดิ่งความเร็วลดลงจนเป็นศูนย์ที่จุดสูงสุด ความเร็วที่จุดสูงสุดจึงเท่ากับ $u\\cos\\theta$ ทิศขนานกับพื้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.proj.p002
    topics: [physics.kinematics.projectile]
    difficulty: 1
    type: mcq
    stem: "จากโต๊ะสูงเท่ากัน ปล่อยลูกแก้วลูกที่ 1 ให้ตกลงตรง ๆ และดีดลูกแก้วลูกที่ 2 ออกไปในแนวราบในขณะเดียวกัน ไม่คิดแรงต้านอากาศ ลูกใดถึงพื้นก่อน"
    choices:
      - { id: a, text: "ถึงพื้นพร้อมกัน", correct: true }
      - { id: b, text: "ลูกที่ 1 ถึงก่อน เพราะเดินทางระยะสั้นกว่า", feedback: "ลูกที่ 2 เดินทางไกลกว่าก็จริง แต่ระยะแนวราบไม่มีผลต่อการตกในแนวดิ่ง ทั้งสองลูกตกในแนวดิ่งแบบเดียวกันทุกประการ" }
      - { id: c, text: "ลูกที่ 2 ถึงก่อน เพราะมีความเร็วมากกว่า", feedback: "ความเร็วที่ลูกที่ 2 มีมากกว่าเป็นความเร็วแนวราบ ไม่ได้ช่วยให้ตกในแนวดิ่งเร็วขึ้น" }
    hints:
      - "เวลาที่ใช้ตกถึงพื้นขึ้นกับการเคลื่อนที่แนวใด"
      - "เปรียบเทียบความเร็วต้นแนวดิ่งและความเร่งแนวดิ่งของทั้งสองลูก"
    solution: "ทั้งสองลูกมีความเร็วต้นแนวดิ่งเป็นศูนย์และความเร่งแนวดิ่ง $g$ เท่ากัน ตกจากความสูงเท่ากัน จึงใช้เวลา $t = \\sqrt{2h/g}$ เท่ากัน การเคลื่อนที่แนวราบเป็นอิสระจากแนวดิ่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.proj.p003
    topics: [physics.kinematics.projectile]
    difficulty: 2
    type: numeric
    stem: "ลูกแก้วกลิ้งออกจากขอบโต๊ะสูง $0.784\\ \\mathrm{m}$ ในแนวราบ ใช้เวลานานเท่าใดจึงตกถึงพื้น ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ และไม่คิดแรงต้านอากาศ (ตอบเป็นตัวเลขในหน่วย s)"
    answer: { value: 0.4, tolerance: 0.01, unit: s }
    hints:
      - "เวลาตกขึ้นกับการเคลื่อนที่แนวดิ่งเท่านั้น ความเร็วต้นแนวดิ่งเป็นเท่าใด"
      - "ใช้ $h = \\tfrac{1}{2}gt^2$ แล้วจัดรูปหา $t$"
      - "$t = \\sqrt{\\dfrac{2h}{g}}$ อย่าลืมถอดรากที่สอง"
    misconceptions:
      - { match: 0.16, feedback: "นั่นคือ $\\dfrac{2h}{g}$ ซึ่งเป็น $t^2$ ยังต้องถอดรากที่สองอีกขั้น" }
      - { match: 0.283, feedback: "ดูเหมือนลืมเลข 2 จาก $h = \\tfrac{1}{2}gt^2$ จะได้ $t = \\sqrt{\\dfrac{2h}{g}}$ ไม่ใช่ $\\sqrt{\\dfrac{h}{g}}$" }
    solution: "แนวดิ่ง $u_y = 0$: $h = \\tfrac{1}{2}gt^2$ → $t = \\sqrt{\\dfrac{2(0.784\\ \\mathrm{m})}{9.8\\ \\mathrm{m/s^2}}} = \\sqrt{0.16\\ \\mathrm{s^2}} = 0.4\\ \\mathrm{s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.proj.p004
    topics: [physics.kinematics.projectile]
    difficulty: 3
    type: numeric
    stem: "เด็กยืนบนสะพานข้ามแม่น้ำ ขว้างก้อนกรวดออกไปในแนวราบด้วยความเร็ว $8\\ \\mathrm{m/s}$ จากความสูง $19.6\\ \\mathrm{m}$ เหนือผิวน้ำ ก้อนกรวดตกถึงน้ำห่างจากจุดขว้างในแนวราบกี่เมตร ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ และไม่คิดแรงต้านอากาศ (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 16, unit: m }
    hints:
      - "หาเวลาที่ก้อนกรวดอยู่ในอากาศจากการเคลื่อนที่แนวดิ่งก่อน"
      - "แนวดิ่ง: $t = \\sqrt{\\dfrac{2h}{g}}$ แนวราบ: $x = u t$"
    misconceptions:
      - { match: 32, feedback: "ดูเหมือนใช้ $t = \\dfrac{2h}{g}$ โดยลืมถอดรากที่สอง เวลาจริงคือ $\\sqrt{\\dfrac{2h}{g}}$" }
      - { match: 11.31, feedback: "ดูเหมือนลืมเลข 2 ใน $h = \\tfrac{1}{2}gt^2$ จึงได้เวลาสั้นเกินไป" }
    solution: "แนวดิ่ง: $t = \\sqrt{\\dfrac{2(19.6\\ \\mathrm{m})}{9.8\\ \\mathrm{m/s^2}}} = \\sqrt{4\\ \\mathrm{s^2}} = 2\\ \\mathrm{s}$ แนวราบ: $x = (8\\ \\mathrm{m/s})(2\\ \\mathrm{s}) = 16\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.proj.p005
    topics: [physics.kinematics.projectile]
    difficulty: 2
    type: numeric
    stem: "นักกีฬาเซปักตะกร้อเตะลูกขึ้นด้วยความเร็ว $16\\ \\mathrm{m/s}$ ทำมุม $60^\\circ$ กับแนวราบ องค์ประกอบ **แนวดิ่ง** ของความเร็วต้นเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 13.86, tolerance: 0.14, unit: m/s }
    hints:
      - "มุมวัดจากแนวราบ องค์ประกอบแนวดิ่งอยู่ตรงข้ามกับมุม"
      - "ใช้ $u_y = u\\sin\\theta$"
    misconceptions:
      - { match: 8, feedback: "นั่นคือ $u\\cos 60^\\circ$ ซึ่งเป็นองค์ประกอบแนวราบ เมื่อมุมวัดจากแนวราบ องค์ประกอบแนวดิ่งใช้ $\\sin$" }
      - { match: -4.88, feedback: "ดูเหมือนเครื่องคิดเลขอยู่ในโหมดเรเดียน ($\\sin 60$ เรเดียน) ให้ตั้งเป็นโหมดองศา (DEG) ก่อน" }
    solution: "$u_y = u\\sin\\theta = (16\\ \\mathrm{m/s})\\sin 60^\\circ = 16 \\times 0.866 \\approx 13.86\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.proj.p006
    topics: [physics.kinematics.projectile]
    difficulty: 3
    type: numeric
    stem: "เตะลูกบอลจากพื้นราบด้วยความเร็ว $19.6\\ \\mathrm{m/s}$ ทำมุม $30^\\circ$ กับพื้น ลูกบอลลอยอยู่ในอากาศนานเท่าใดจึงตกถึงพื้น ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ และไม่คิดแรงต้านอากาศ (ตอบเป็นตัวเลขในหน่วย s)"
    answer: { value: 2, tolerance: 0.02, unit: s }
    hints:
      - "เวลาลอยขึ้นกับความเร็วต้นแนวดิ่ง $u_y = u\\sin\\theta$"
      - "หาเวลาขึ้นถึงจุดสูงสุดจาก $0 = u_y - gt$ แล้วคิดเวลาขาลงด้วย"
      - "บนพื้นราบ เวลาลอยทั้งหมด $T = \\dfrac{2u_y}{g}$"
    misconceptions:
      - { match: 1, feedback: "นั่นคือเวลาขึ้นถึงจุดสูงสุดเท่านั้น ลูกบอลยังต้องใช้เวลาเท่ากันในการตกกลับลงมา" }
      - { match: 3.46, feedback: "ดูเหมือนใช้ $u\\cos 30^\\circ$ ซึ่งเป็นองค์ประกอบแนวราบ เวลาลอยขึ้นกับองค์ประกอบแนวดิ่ง $u\\sin\\theta$" }
    solution: "$u_y = 19.6\\sin 30^\\circ = 9.8\\ \\mathrm{m/s}$ เวลาขาขึ้น $\\dfrac{9.8}{9.8} = 1\\ \\mathrm{s}$ เวลาลอยทั้งหมด $T = \\dfrac{2u_y}{g} = \\dfrac{2(9.8\\ \\mathrm{m/s})}{9.8\\ \\mathrm{m/s^2}} = 2\\ \\mathrm{s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.proj.p007
    topics: [physics.kinematics.projectile]
    difficulty: 3
    type: numeric
    stem: "ลูกบอลจากข้อที่แล้ว (เตะจากพื้นด้วยความเร็ว $19.6\\ \\mathrm{m/s}$ ทำมุม $30^\\circ$ กับพื้น) ขึ้นไปได้สูงสุดกี่เมตร ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ และไม่คิดแรงต้านอากาศ (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 4.9, tolerance: 0.05, unit: m }
    hints:
      - "ที่จุดสูงสุด ความเร็วแนวดิ่งเป็นศูนย์"
      - "ใช้ $v_y^2 = u_y^2 - 2gH$ โดยใช้เฉพาะองค์ประกอบแนวดิ่ง $u_y = u\\sin\\theta$"
    misconceptions:
      - { match: 19.6, feedback: "ดูเหมือนใช้ความเร็วต้นทั้งก้อน $19.6\\ \\mathrm{m/s}$ ซึ่งจะถูกเฉพาะเมื่อเตะขึ้นตรง ๆ ความสูงขึ้นกับองค์ประกอบแนวดิ่ง $u\\sin\\theta$ เท่านั้น" }
      - { match: 9.8, feedback: "ดูเหมือนลืมเลข 2 ใน $2gH$ จาก $0 = u_y^2 - 2gH$ ได้ $H = \\dfrac{u_y^2}{2g}$" }
    solution: "$u_y = 19.6\\sin 30^\\circ = 9.8\\ \\mathrm{m/s}$ ที่จุดสูงสุด $v_y = 0$: $H = \\dfrac{u_y^2}{2g} = \\dfrac{(9.8\\ \\mathrm{m/s})^2}{2(9.8\\ \\mathrm{m/s^2})} = 4.9\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.proj.p008
    topics: [physics.kinematics.projectile]
    difficulty: 4
    type: numeric
    stem: "นักกีฬาเปตองโยนลูกด้วยความเร็ว $14\\ \\mathrm{m/s}$ ทำมุม $30^\\circ$ กับแนวราบ สมมติว่าลูกออกจากมือที่ระดับพื้นและตกที่ระดับเดียวกัน ลูกเปตองตกห่างจากจุดโยนในแนวราบกี่เมตร ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ และไม่คิดแรงต้านอากาศ (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 17.32, tolerance: 0.17, unit: m }
    hints:
      - "แยกความเร็วต้นเป็น $u_x = u\\cos\\theta$ และ $u_y = u\\sin\\theta$"
      - "หาเวลาลอย $T = \\dfrac{2u_y}{g}$ แล้วคูณด้วย $u_x$"
      - "หรือใช้ $R = \\dfrac{u^2\\sin 2\\theta}{g}$ ระวังว่าต้องใช้ $\\sin$ ของมุม $2\\theta$"
    misconceptions:
      - { match: 10, feedback: "ดูเหมือนใช้ $\\sin 30^\\circ$ ในสูตรระยะทาง ซึ่งต้องเป็น $\\sin 2\\theta = \\sin 60^\\circ$" }
      - { match: 8.66, feedback: "ดูเหมือนใช้เวลาขึ้นถึงจุดสูงสุดแทนเวลาลอยทั้งหมด ระยะนี้คือระยะแนวราบถึงจุดสูงสุด ต้องคูณ 2" }
    solution: "$u_x = 14\\cos 30^\\circ \\approx 12.12\\ \\mathrm{m/s}$, $u_y = 14\\sin 30^\\circ = 7\\ \\mathrm{m/s}$ เวลาลอย $T = \\dfrac{2(7)}{9.8} \\approx 1.429\\ \\mathrm{s}$ ระยะทาง $R = u_x T \\approx 12.12 \\times 1.429 \\approx 17.32\\ \\mathrm{m}$ ตรวจ: $R = \\dfrac{14^2\\sin 60^\\circ}{9.8} = 20 \\times 0.866 \\approx 17.32\\ \\mathrm{m}$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.proj.p009
    topics: [physics.kinematics.projectile]
    difficulty: 4
    type: mcq
    stem: "ยิงลูกบอลจากพื้นราบด้วยอัตราเร็วเท่าเดิมทุกครั้ง ไม่คิดแรงต้านอากาศ ถ้ายิงทำมุม $30^\\circ$ กับพื้นแล้วตกห่างออกไประยะหนึ่ง ต้องยิงที่มุมใดจึงตกที่ระยะ **เท่าเดิม** อีกครั้ง"
    choices:
      - { id: a, text: "$60^\\circ$", correct: true }
      - { id: b, text: "$45^\\circ$", feedback: "มุม $45^\\circ$ ให้ระยะไกลที่สุด จึงไกลกว่ามุม $30^\\circ$ ไม่ใช่เท่ากัน" }
      - { id: c, text: "$15^\\circ$", feedback: "ลองแทนในสูตร: $\\sin(2 \\times 15^\\circ) = \\sin 30^\\circ = 0.5$ แต่ $\\sin 60^\\circ \\approx 0.866$ ระยะจึงไม่เท่ากัน" }
      - { id: d, text: "$90^\\circ$", feedback: "ยิงตรงขึ้นที่ $90^\\circ$ ลูกบอลจะตกลงที่เดิม ระยะทางแนวราบเป็นศูนย์" }
    hints:
      - "ระยะทางแนวราบบนพื้นราบคือ $R = \\dfrac{u^2\\sin 2\\theta}{g}$"
      - "หามุม $\\theta$ อีกค่าหนึ่งที่ทำให้ $\\sin 2\\theta$ เท่ากับ $\\sin 60^\\circ$"
    solution: "$R \\propto \\sin 2\\theta$ ที่ $30^\\circ$ ได้ $\\sin 60^\\circ$ ส่วนที่ $60^\\circ$ ได้ $\\sin 120^\\circ = \\sin 60^\\circ$ เท่ากัน มุมที่รวมกันได้ $90^\\circ$ จึงให้ระยะเท่ากัน แต่มุม $60^\\circ$ ขึ้นสูงกว่าและลอยนานกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.proj.p010
    topics: [physics.kinematics.projectile]
    difficulty: 4
    type: expression
    stem: "ยิงวัตถุในแนวราบด้วยความเร็ว $u$ จากความสูง $h$ เหนือพื้น ในบริเวณที่มีความเร่งโน้มถ่วง $g$ ไม่คิดแรงต้านอากาศ เขียนระยะทางแนวราบที่วัตถุตกห่างจากจุดใต้ตำแหน่งยิงในรูปของ $u$, $h$ และ $g$"
    prefix: "R ="
    answer: { latex: "u\\sqrt{\\frac{2h}{g}}", variables: [u, h, g] }
    hints:
      - "หาเวลาตกจากแนวดิ่งก่อน โดย $u_y = 0$"
      - "จาก $h = \\tfrac{1}{2}gt^2$ จัดรูปหา $t$ แล้วนำไปคูณกับความเร็วแนวราบ"
    misconceptions:
      - { match: "\\frac{2uh}{g}", feedback: "ดูเหมือนใช้ $t = \\dfrac{2h}{g}$ ซึ่งเป็น $t^2$ ต้องถอดรากที่สองก่อน ลองตรวจหน่วย: $\\dfrac{2h}{g}$ มีหน่วย $\\mathrm{s^2}$" }
      - { match: "u\\sqrt{\\frac{h}{g}}", feedback: "ดูเหมือนลืมเลข 2 จาก $h = \\tfrac{1}{2}gt^2$ จะได้ $t^2 = \\dfrac{2h}{g}$" }
    solution: "แนวดิ่ง: $h = \\tfrac{1}{2}gt^2$ → $t = \\sqrt{\\dfrac{2h}{g}}$ แนวราบ: $R = ut = u\\sqrt{\\dfrac{2h}{g}}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.proj.p011
    topics: [physics.kinematics.projectile]
    difficulty: 5
    type: numeric
