  stem: พี่สาวของมายด์ใช้ครีมที่สั่งออนไลน์แล้วหน้าแดงแสบมาก ฉลากไม่มีภาษาไทยและไม่มีเลขจดแจ้ง ข้อใดควรทำเป็นอันดับแรก
  choices:
  - id: a
    text: หยุดใช้ ล้างหน้าด้วยน้ำสะอาด และไปพบแพทย์ แล้วจึงเก็บหลักฐานร้องเรียน อย. 1556
    correct: true
  - id: b
    text: รีบโพสต์ประจานร้านในโซเชียลมีเดียก่อน
    feedback: สุขภาพมาก่อน และการโพสต์ประจานอาจมีปัญหาทางกฎหมายถ้าข้อมูลไม่ครบหรือไม่ถูกต้อง
  - id: c
    text: ใช้ต่ออีก 2–3 วันเผื่ออาการหายเอง
