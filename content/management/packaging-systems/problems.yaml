      - { id: b, text: "ผู้ผลิตหรือผู้นำเข้าที่นำบรรจุภัณฑ์เข้าสู่ตลาดรับผิดชอบค่าใช้จ่ายและการจัดการบรรจุภัณฑ์หลังใช้งานบางส่วน", correct: true }
