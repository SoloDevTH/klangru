problems:
  - id: business.econ.sufficiency-economy.p001
    topics: [business.econ.sufficiency-economy]
    difficulty: 1
    type: match
    stem: "จับคู่หลักการหรือเงื่อนไขของปรัชญาของเศรษฐกิจพอเพียงกับความหมาย"
    pairs:
      - { left: "ความพอประมาณ", right: "ความพอดี ไม่มากและไม่น้อยเกินไป ไม่เบียดเบียนตนเองและผู้อื่น" }
      - { left: "ความมีเหตุผล", right: "ตัดสินใจโดยพิจารณาเหตุปัจจัยและผลที่จะตามมาอย่างรอบคอบ" }
      - { left: "การมีภูมิคุ้มกันที่ดีในตัว", right: "เตรียมตัวให้พร้อมรับผลกระทบจากการเปลี่ยนแปลง" }
      - { left: "เงื่อนไขความรู้", right: "รอบรู้ รอบคอบ และระมัดระวังในการปฏิบัติ" }
      - { left: "เงื่อนไขคุณธรรม", right: "ซื่อสัตย์สุจริต อดทน มีความเพียร และแบ่งปัน" }
    hints:
      - "สามห่วงคือพอประมาณ มีเหตุผล มีภูมิคุ้มกัน"
      - "สองเงื่อนไขคือความรู้และคุณธรรม"
    solution: "พอประมาณ → พอดี ไม่มากไม่น้อยเกินไป · มีเหตุผล → พิจารณาเหตุปัจจัยและผลที่จะตามมา · ภูมิคุ้มกัน → เตรียมพร้อมรับความเปลี่ยนแปลง · ความรู้ → รอบรู้ รอบคอบ ระมัดระวัง · คุณธรรม → ซื่อสัตย์ อดทน เพียร แบ่งปัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.sufficiency-economy.p002
    topics: [business.econ.sufficiency-economy]
    difficulty: 1
    type: mcq
    stem: "น้องแก้มได้ค่าขนมวันละ $60$ บาท พฤติกรรมใดแสดง **ความพอประมาณ** มากที่สุด"
    choices:
      - { id: a, text: "ซื้อข้าวกลางวันและน้ำดื่ม ใช้ไม่เกินเงินที่มี และเหลือเก็บวันละเล็กน้อย", correct: true }
      - { id: b, text: "ยืมเงินเพื่อนเพิ่มเพื่อซื้อของเล่นตามเพื่อนทุกวัน", feedback: "ใช้เกินกำลังและเป็นหนี้ ไม่พอประมาณ" }
      - { id: c, text: "ไม่กินข้าวกลางวันเลยเพื่อเก็บเงินทั้งหมด", feedback: "น้อยเกินไปจนเบียดเบียนตนเอง ความพอประมาณไม่ใช่การอดจนลำบาก" }
      - { id: d, text: "ใช้เงินหมดทุกวัน เพราะพรุ่งนี้ก็ได้ใหม่", feedback: "ไม่เหลือเผื่อยามจำเป็น ขาดทั้งความพอประมาณและภูมิคุ้มกัน" }
    hints:
      - "พอประมาณคือใช้ให้พอดีกับกำลังที่มี"
      - "ข้อใดไม่ใช้เกินเงินที่มี และไม่อดจนลำบาก"
    solution: "ซื้ออาหารกลางวันและน้ำตามที่จำเป็น ใช้ไม่เกินเงินที่มีและเหลือเก็บบ้าง คือความพอดี ข้อที่ยืมเพื่อนเป็นการใช้เกินตัว ข้อที่อดข้าวเป็นการเบียดเบียนตนเอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.sufficiency-economy.p003
    topics: [business.econ.sufficiency-economy]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นตัวอย่างของ **การมีภูมิคุ้มกันที่ดีในตัว** (เลือกได้มากกว่าหนึ่งข้อ)"
    multiple: true
    choices:
      - { id: a, text: "ครอบครัวเก็บเงินสำรองไว้ใช้ยามเจ็บป่วยหรือตกงาน", correct: true }
      - { id: b, text: "เกษตรกรปลูกพืชหลายชนิดแทนพืชเดียว", correct: true }
      - { id: c, text: "ร้านค้ากู้เงินก้อนใหญ่เปิดห้าสาขาพร้อมกันเพราะเชื่อว่าขายดีแน่", feedback: "ไม่ได้เตรียมรับความเสี่ยง ถ้าขายไม่ได้ตามคาดจะเป็นหนี้มาก" }
      - { id: d, text: "ร้านอาหารหาผู้ส่งวัตถุดิบสำรองไว้มากกว่าหนึ่งราย", correct: true }
    hints:
      - "ภูมิคุ้มกันคือการเตรียมพร้อมรับเหตุการณ์ที่อาจเกิดในอนาคต"
      - "ข้อใดช่วยให้ไม่ลำบากเมื่อเกิดเรื่องไม่คาดคิด"
    solution: "ข้อ ก ข และ ง เป็นการเตรียมรับความเปลี่ยนแปลง (เงินสำรอง รายได้หลายทาง วัตถุดิบหลายแหล่ง) ข้อ ค เป็นการกู้ลงทุนเกินตัว ทำให้เปราะบางยิ่งขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.sufficiency-economy.p004
    topics: [business.econ.sufficiency-economy]
    difficulty: 2
    type: match
    stem: "จับคู่กิจกรรมกับระดับที่นำปรัชญาของเศรษฐกิจพอเพียงไปใช้"
    pairs:
      - { left: "พ่อแม่ลูกช่วยกันจดบัญชีรายรับรายจ่ายในบ้าน", right: "ครอบครัว" }
      - { left: "นักเรียนตั้งธนาคารขยะรับซื้อขวดพลาสติกจากเพื่อน", right: "โรงเรียน" }
      - { left: "ชาวบ้านหลายครอบครัวตั้งกลุ่มออมทรัพย์เพื่อให้สมาชิกกู้ยืม", right: "ชุมชน" }
    hints:
      - "ดูว่าใครเป็นคนทำกิจกรรม"
      - "ครอบครัวคือคนในบ้าน โรงเรียนคือนักเรียนและครู ชุมชนคือคนหลายครอบครัวรวมกัน"
    solution: "บัญชีครัวเรือน → ครอบครัว · ธนาคารขยะของนักเรียน → โรงเรียน · กลุ่มออมทรัพย์หมู่บ้าน → ชุมชน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.sufficiency-economy.p005
    topics: [business.econ.sufficiency-economy]
    difficulty: 2
    type: numeric
    stem: "ลุงสมมีที่ดิน $15$ ไร่ ต้องการแบ่งตามทฤษฎีใหม่ในสัดส่วน $30:30:30:10$ (สระน้ำ : นาข้าว : พืชไร่พืชสวน : ที่อยู่อาศัย) พื้นที่สระน้ำเป็นกี่ไร่ (ตอบเป็นไร่)"
    answer: { value: 4.5, tolerance: 0.01, unit: "ไร่" }
    hints:
      - "สระน้ำคือ $30\\%$ ของพื้นที่ทั้งหมด"
      - "$15 \\times 0.30$"
    misconceptions:
      - { match: 1.5, feedback: "นั่นคือส่วน $10\\%$ ของที่อยู่อาศัย สระน้ำคือ $30\\%$" }
      - { match: 0.5, feedback: "หาร $15$ ด้วย $30$ ต้องคิด $30\\%$ คือคูณ $0.30$" }
    solution: "สระน้ำ $= 15 \\times 0.30 = 4.5$ ไร่ (นาข้าวและพืชไร่พืชสวนอย่างละ $4.5$ ไร่ ที่อยู่อาศัย $1.5$ ไร่)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.sufficiency-economy.p006
    topics: [business.econ.sufficiency-economy]
    difficulty: 2
    type: mcq
    stem: "ข้อใดอธิบายปรัชญาของเศรษฐกิจพอเพียงได้ **ถูกต้อง**"
    choices:
      - { id: a, text: "เป็นแนวทางสายกลางที่ใช้ได้กับบุคคล ครอบครัว ชุมชน ธุรกิจ และประเทศ", correct: true }
      - { id: b, text: "ใช้ได้เฉพาะเกษตรกรในชนบทเท่านั้น", feedback: "คนเมือง พนักงาน และธุรกิจก็ใช้หลักนี้ได้" }
      - { id: c, text: "ห้ามกู้เงินทุกกรณี", feedback: "การกู้อย่างมีเหตุผลและผ่อนไหวไม่ขัดกับหลักความพอประมาณ" }
      - { id: d, text: "ห้ามขยายธุรกิจหรือหารายได้เพิ่ม", feedback: "ขยายได้ แต่ให้เป็นไปตามกำลังและลำดับขั้น" }
    hints:
      - "นึกถึงคำว่าทางสายกลาง"
      - "ปรัชญานี้ใช้ได้กับคนทุกระดับหรือไม่"
    solution: "ปรัชญาของเศรษฐกิจพอเพียงเป็นแนวทางดำเนินชีวิตตามทางสายกลางสำหรับคนทุกระดับ ไม่ได้ห้ามกู้ ห้ามรวย หรือจำกัดเฉพาะเกษตรกร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.sufficiency-economy.p007
    topics: [business.econ.sufficiency-economy]
    difficulty: 3
    type: numeric
    stem: "ครอบครัวหนึ่งในสุพรรณบุรีซื้อผักวันละ $60$ บาท ถ้าปลูกผักสวนครัวเองได้ $40\\%$ ของที่กิน โดยเสียค่าเมล็ดพันธุ์และปุ๋ยหมักทุก $3$ เดือน ครั้งละ $300$ บาท ใน $1$ ปี ($365$ วัน) ครอบครัวนี้ประหยัดเงินได้สุทธิกี่บาท (ตอบเป็นบาท)"
    answer: { value: 7560, unit: "บาท" }
    hints:
      - "หาเงินค่าผักที่ไม่ต้องซื้อต่อปี: $60 \\times 0.4 \\times 365$"
      - "หักค่าเมล็ดพันธุ์และปุ๋ย $4$ ครั้งต่อปี"
    misconceptions:
      - { match: 8760, feedback: "ลืมหักค่าเมล็ดพันธุ์และปุ๋ยหมัก $1{,}200$ บาท" }
      - { match: 8460, feedback: "หักค่าเมล็ดพันธุ์แค่ครั้งเดียว แต่ $1$ ปีมี $4$ รอบ ($3$ เดือนต่อรอบ)" }
    solution: "ค่าผักที่ไม่ต้องซื้อ $60 \\times 0.4 \\times 365 = 8{,}760$ บาท ค่าเมล็ดพันธุ์และปุ๋ย $300 \\times 4 = 1{,}200$ บาท ประหยัดสุทธิ $= 7{,}560$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.sufficiency-economy.p008
    topics: [business.econ.sufficiency-economy]
    difficulty: 3
    type: match
    stem: "ร้านขนมไทย (สมมติ) ในอยุธยาทำสิ่งต่อไปนี้ จับคู่กับหลักการหรือเงื่อนไขที่ตรงที่สุด"
    pairs:
      - { left: "เปิดสาขาที่สองเมื่อมีเงินเก็บพอ ไม่กู้เกินกำลังผ่อน", right: "ความพอประมาณ" }
      - { left: "ดูยอดขายย้อนหลัง 6 เดือนก่อนตัดสินใจเพิ่มเมนู", right: "ความมีเหตุผล" }
      - { left: "กันเงินสำรองไว้จ่ายค่าใช้จ่าย 3 เดือนเผื่อยอดขายตก", right: "การมีภูมิคุ้มกันที่ดีในตัว" }
      - { left: "ส่งลูกจ้างไปอบรมการขายออนไลน์", right: "เงื่อนไขความรู้" }
      - { left: "ไม่ใช้กะทิที่ใกล้เสียแม้ราคาถูกกว่า", right: "เงื่อนไขคุณธรรม" }
    hints:
      - "ถามว่าสิ่งที่ทำช่วยเรื่องใด: ทำตามกำลัง ใช้ข้อมูล เตรียมรับความเสี่ยง หาความรู้ หรือซื่อสัตย์"
      - "ความรู้และคุณธรรมเป็นเงื่อนไข"
    solution: "ขยายเมื่อเงินเก็บพอ → พอประมาณ · ดูยอดขายก่อนเพิ่มเมนู → มีเหตุผล · สำรองเงินทุน 3 เดือน → ภูมิคุ้มกัน · อบรมการขายออนไลน์ → ความรู้ · ไม่ใช้วัตถุดิบเก่าแม้ต้นทุนถูกกว่า → คุณธรรม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.sufficiency-economy.p009
    topics: [business.econ.sufficiency-economy]
    difficulty: 3
    type: numeric
    stem: "ครอบครัวหนึ่งมีรายจ่ายจำเป็นเดือนละ $12{,}500$ บาท ตั้งเป้ามีเงินสำรองฉุกเฉินเท่ากับรายจ่ายจำเป็น $6$ เดือน ตอนนี้มีเงินสำรอง $30{,}000$ บาท และออมเพิ่มได้เดือนละ $2{,}500$ บาท ต้องออมอีกกี่เดือนจึงถึงเป้า (ตอบเป็นเดือน)"
    answer: { value: 18, unit: "เดือน" }
    hints:
      - "เป้าหมาย $= 12{,}500 \\times 6$"
      - "ส่วนที่ยังขาด หารด้วยเงินออมต่อเดือน"
    misconceptions:
      - { match: 30, feedback: "ลืมหักเงินสำรอง $30{,}000$ บาทที่มีอยู่แล้ว" }
      - { match: 12, feedback: "หาร $30{,}000$ ด้วย $2{,}500$ ต้องใช้ส่วนที่ยังขาด" }
    solution: "เป้า $= 12{,}500 \\times 6 = 75{,}000$ บาท ยังขาด $75{,}000 - 30{,}000 = 45{,}000$ บาท ต้องออม $45{,}000 \\div 2{,}500 = 18$ เดือน เงินสำรองนี้คือภูมิคุ้มกันของครอบครัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.sufficiency-economy.p010
    topics: [business.econ.sufficiency-economy]
    difficulty: 3
    type: mcq
    stem: "กลุ่มทอผ้าฝ้ายในน่าน (สมมติ) อยากพัฒนาการผลิตให้มีรายได้มากขึ้น ข้อเสนอใด **สอดคล้อง** กับปรัชญาของเศรษฐกิจพอเพียง (เลือกได้มากกว่าหนึ่งข้อ)"
    multiple: true
    choices:
      - { id: a, text: "ปลูกฝ้ายและพืชให้สีธรรมชาติเอง ลดการซื้อวัตถุดิบจากนอกชุมชน", correct: true }
      - { id: b, text: "อบรมสมาชิกเรื่องลายใหม่และการขายออนไลน์", correct: true }
      - { id: c, text: "กู้เงินห้าล้านบาทสร้างโรงงานใหญ่ทันที โดยยังไม่ได้สำรวจตลาด", feedback: "ขาดทั้งความพอประมาณและความมีเหตุผล" }
      - { id: d, text: "ทดลองขายลายใหม่ในงานเทศกาลก่อน แล้วค่อยเพิ่มการผลิตตามยอดสั่งซื้อ", correct: true }
    hints:
      - "ดูว่าข้อเสนอทำตามกำลัง ใช้ความรู้และทรัพยากรท้องถิ่นหรือไม่"
      - "ข้อใดเสี่ยงเกินกำลังของกลุ่ม"
    solution: "ข้อ ก ข และ ง ใช้ทรัพยากรและภูมิปัญญาท้องถิ่น เพิ่มความรู้ และขยายทีละขั้น ข้อ ค กู้ก้อนใหญ่สร้างโรงงานทันทีโดยยังไม่รู้ว่าตลาดรับได้หรือไม่ เป็นการเสี่ยงเกินกำลัง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.sufficiency-economy.p011
    topics: [business.econ.sufficiency-economy]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการวิเคราะห์และแก้ปัญหาเศรษฐกิจของชุมชน"
    items:
      - "เก็บข้อมูลรายได้ รายจ่าย หนี้ และทรัพยากรของชุมชน"
      - "วิเคราะห์หาสาเหตุที่แท้จริงของปัญหา"
      - "เสนอแนวทางแก้ไขตามหลักสามห่วงสองเงื่อนไข"
      - "ชาวชุมชนลงมือทำร่วมกัน"
      - "ติดตามผลและปรับแผน"
    hints:
      - "ต้องรู้ข้อเท็จจริงก่อนหาสาเหตุ"
      - "ลงมือแล้วต้องวัดผล"
    solution: "เก็บข้อมูล → หาสาเหตุที่แท้จริง → เสนอทางแก้ตามหลักสามห่วงสองเงื่อนไข → ลงมือร่วมกัน → ติดตามผลและปรับแผน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.sufficiency-economy.p012
    topics: [business.econ.sufficiency-economy]
    difficulty: 4
    type: numeric
    stem: "จากตารางในภาพ ในปีที่ราคาข้าวโพดลดลง $40\\%$ (พืชอื่นได้เท่าเดิม) ลุงจันทร์มีรายได้มากกว่าลุงคำกี่บาท (ตอบเป็นบาท)"
    figure:
      src: two-farms.svg
      alt: "ตารางข้อมูลการปลูกพืช (สมมติ) ลุงคำปลูกข้าวโพด 20 ไร่ รายได้ปีปกติ 4,000 บาทต่อไร่ ปีราคาข้าวโพดตกราคาลดลง 40% ลุงจันทร์ปลูกข้าวโพด 10 ไร่ รายได้ 4,000 บาทต่อไร่ ราคาลดลง 40% ผักหลายชนิด 6 ไร่ 5,000 บาทต่อไร่ เท่าเดิม และไม้ผล 4 ไร่ 3,500 บาทต่อไร่ เท่าเดิม รายได้ต่อไร่หลังหักต้นทุนแล้ว"
    answer: { value: 20000, unit: "บาท" }
    hints:
      - "ปีราคาตก รายได้ข้าวโพดต่อไร่เหลือ $4{,}000 \\times 0.6$"
      - "รวมรายได้ทุกพืชของแต่ละคนแล้วนำมาลบกัน"
    misconceptions:
      - { match: 4000, feedback: "นั่นคือส่วนต่างในปีปกติ ($84{,}000 - 80{,}000$) โจทย์ถามปีที่ราคาข้าวโพดตก" }
      - { match: 32000, feedback: "นั่นคือรายได้ที่ลุงคำเสียไปเมื่อราคาตก ($80{,}000 - 48{,}000$) ยังไม่ได้เทียบกับลุงจันทร์" }
    solution: "ข้าวโพดต่อไร่เหลือ $4{,}000 \\times 0.6 = 2{,}400$ บาท ลุงคำ: $20 \\times 2{,}400 = 48{,}000$ บาท ลุงจันทร์: $10 \\times 2{,}400 + 6 \\times 5{,}000 + 4 \\times 3{,}500 = 24{,}000 + 30{,}000 + 14{,}000 = 68{,}000$ บาท ต่างกัน $20{,}000$ บาท (ปีปกติต่างกันแค่ $4{,}000$ บาท) การปลูกพืชหลายชนิดจึงเป็นภูมิคุ้มกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.sufficiency-economy.p013
    topics: [business.econ.sufficiency-economy]
    difficulty: 4
    type: numeric
    stem: "ครอบครัวหนึ่งตั้งกติกาว่า ค่างวดหนี้ทั้งหมดต้องไม่เกิน $\\tfrac{1}{3}$ ของรายได้ ครอบครัวมีรายได้เดือนละ $25{,}000$ บาท และผ่อนหนี้อยู่แล้วเดือนละ $5{,}000$ บาท ถ้าจะกู้ซื้อรถจักรยานยนต์ ค่างวดใหม่ได้ไม่เกินเดือนละกี่บาท (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 3333.33, tolerance: 0.05, unit: "บาท" }
    hints:
      - "หาค่างวดรวมสูงสุด $= 25{,}000 \\div 3$"
      - "หักค่างวดที่ผ่อนอยู่แล้ว"
    misconceptions:
      - { match: 8333.33, feedback: "ลืมหักค่างวดเดิม $5{,}000$ บาทที่ผ่อนอยู่" }
      - { match: 6666.67, feedback: "หักหนี้เดิมก่อนแล้วหาร $3$ ($20{,}000 \\div 3$) กติกาคือค่างวดรวมทั้งหมดไม่เกิน $\\tfrac{1}{3}$ ของรายได้" }
    solution: "ค่างวดรวมสูงสุด $25{,}000 \\div 3 \\approx 8{,}333.33$ บาท หักที่ผ่อนอยู่ $5{,}000$ บาท ค่างวดใหม่ไม่เกิน $\\approx 3{,}333.33$ บาท การกำหนดเพดานหนี้ตามรายได้คือความพอประมาณและความมีเหตุผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.sufficiency-economy.p014
    topics: [business.econ.sufficiency-economy]
    difficulty: 4
    type: mcq
    stem: "หมู่บ้านแห่งหนึ่ง (สมมติ) พบว่าครัวเรือนกว่าครึ่งกู้เงินนอกระบบดอกเบี้ยสูงมาซื้อปุ๋ยเคมีทุกฤดู แต่ราคาผลผลิตไม่แน่นอน ข้อใดเป็นแนวทางแก้ไขที่ **ตรงสาเหตุ** และสอดคล้องกับปรัชญาของเศรษฐกิจพอเพียง (เลือกได้มากกว่าหนึ่งข้อ)"
    multiple: true
    choices:
      - { id: a, text: "รวมกลุ่มทำปุ๋ยหมักจากเศษพืชและมูลสัตว์ในชุมชน ใช้แทนปุ๋ยเคมีบางส่วน", correct: true }
      - { id: b, text: "ตั้งกลุ่มออมทรัพย์ให้สมาชิกกู้ดอกเบี้ยต่ำแทนเงินกู้นอกระบบ", correct: true }
      - { id: c, text: "ให้ทุกครัวเรือนทำบัญชีต้นทุนการผลิตเพื่อรู้ว่าแต่ละรอบได้กำไรจริงเท่าไร", correct: true }
      - { id: d, text: "กู้เงินนอกระบบเพิ่มเพื่อซื้อปุ๋ยมากขึ้นให้ผลผลิตสูงขึ้น", feedback: "เพิ่มหนี้ดอกเบี้ยสูงในขณะที่ราคาผลผลิตไม่แน่นอน ขาดภูมิคุ้มกัน" }
    hints:
      - "สาเหตุมีสองส่วน: ต้นทุนปุ๋ยสูง และแหล่งเงินกู้ดอกเบี้ยสูง"
      - "ข้อใดแก้ทั้งต้นทุนและหนี้ ข้อใดเพิ่มหนี้"
    solution: "ข้อ ก ลดต้นทุนปุ๋ยด้วยความรู้และวัตถุดิบในชุมชน ข้อ ข ให้มีแหล่งเงินดอกเบี้ยต่ำที่ชุมชนดูแลกันเอง ข้อ ค ช่วยรู้ต้นทุนจริงก่อนตัดสินใจ ข้อ ง ทำให้หนี้เพิ่มโดยไม่แก้สาเหตุ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.sufficiency-economy.p015
    topics: [business.econ.sufficiency-economy]
    difficulty: 5
    type: numeric
    stem: "กลุ่มแม่บ้านในเพชรบูรณ์ (สมมติ) ทำน้ำพริกขายเดือนละ $300$ กระปุก ราคากระปุกละ $50$ บาท ต้นทุนกระปุกละ $32$ บาท ในนั้นเป็นค่าพริกที่ซื้อจากนอกชุมชน $18$ บาท ถ้ากลุ่มปลูกพริกเอง ค่าพริกจะเหลือกระปุกละ $10$ บาท (ต้นทุนอื่นเท่าเดิม) กำไรต่อเดือนจะเพิ่มขึ้นกี่เปอร์เซ็นต์ (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 44.44, tolerance: 0.1, unit: "%" }
    hints:
      - "ต้นทุนใหม่ต่อกระปุก $= 32 - 18 + 10$"
      - "หากำไรเดิมและกำไรใหม่ต่อเดือน แล้วคิดร้อยละการเปลี่ยนแปลงจากกำไรเดิม"
    misconceptions:
      - { match: 2400, feedback: "นั่นคือกำไรที่เพิ่มเป็นบาท โจทย์ถามเป็นร้อยละ" }
      - { match: 25, feedback: "คิดร้อยละที่ต้นทุนลดลง ($8 \\div 32$) ไม่ใช่ร้อยละที่กำไรเพิ่ม" }
    solution: "กำไรเดิม $= 300 \\times (50 - 32) = 5{,}400$ บาท ต้นทุนใหม่ $= 32 - 18 + 10 = 24$ บาท กำไรใหม่ $= 300 \\times (50 - 24) = 7{,}800$ บาท เพิ่มขึ้น $\\dfrac{2{,}400}{5{,}400} \\times 100 \\approx 44.44\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.sufficiency-economy.p016
    topics: [business.econ.sufficiency-economy]
    difficulty: 5
    type: mcq
    stem: "ข้อใดอธิบาย **ความสำคัญของปรัชญาของเศรษฐกิจพอเพียงต่อสังคมไทย** โดยเชื่อมกับบทเรียนจากวิกฤตเศรษฐกิจ พ.ศ. 2540 ได้สมเหตุสมผล (เลือกได้มากกว่าหนึ่งข้อ)"
    multiple: true
    choices:
      - { id: a, text: "การกู้เงินลงทุนเกินกำลังและเก็งกำไรตามกระแสทำให้ธุรกิจล้มเมื่อเศรษฐกิจเปลี่ยน หลักพอประมาณและมีเหตุผลช่วยลดความเสี่ยงนี้", correct: true }
      - { id: b, text: "การมีภูมิคุ้มกัน เช่น เงินสำรองและรายได้หลายทาง ช่วยให้ครัวเรือนและธุรกิจรับแรงกระแทกจากวิกฤตได้ดีขึ้น", correct: true }
      - { id: c, text: "ปรัชญานี้สอนให้ประเทศเลิกค้าขายกับต่างประเทศทั้งหมด", feedback: "ปรัชญานี้ไม่ได้ปฏิเสธการค้า แต่ให้พัฒนาตามกำลังและไม่ประมาท" }
      - { id: d, text: "ปรัชญานี้ใช้เฉพาะตอนเกิดวิกฤตเท่านั้น ยามปกติไม่จำเป็น", feedback: "ใช้ได้ตลอดเวลา และยามปกติคือเวลาที่ควรสร้างภูมิคุ้มกัน" }
    hints:
      - "ก่อนวิกฤต ธุรกิจจำนวนมากกู้เงินลงทุนเกินตัว"
      - "คิดว่าหลักข้อใดช่วยป้องกันปัญหาแบบนั้น"
    solution: "ข้อ ก และ ข เชื่อมสาเหตุของวิกฤต (กู้เกินตัว ลงทุนตามกระแส) กับหลักพอประมาณ มีเหตุผล และภูมิคุ้มกัน ข้อ ค เป็นการสรุปเกินจริง ปรัชญานี้ไม่ได้ให้เลิกค้าขายกับต่างประเทศ ข้อ ง ผิดเพราะปรัชญานี้ใช้ได้ทั้งในยามปกติและยามวิกฤต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.sufficiency-economy.p017
    topics: [business.econ.sufficiency-economy]
    difficulty: 4
    type: numeric
    stem: "เกษตรกรคนหนึ่งแบ่งที่ดินตามทฤษฎีใหม่ ได้พื้นที่สระน้ำ $4.5$ ไร่ ถ้าขุดสระลึกเฉลี่ย $4$ เมตร และ $1$ ไร่ $= 1{,}600$ ตารางเมตร สระจะเก็บน้ำได้ประมาณกี่ลูกบาศก์เมตร (ตอบเป็นลูกบาศก์เมตร)"
    answer: { value: 28800, unit: "ลูกบาศก์เมตร" }
    hints:
      - "แปลงพื้นที่สระเป็นตารางเมตรก่อน"
      - "ปริมาตร $=$ พื้นที่ $\\times$ ความลึก"
    misconceptions:
      - { match: 7200, feedback: "นั่นคือพื้นที่ (ตารางเมตร) ยังไม่ได้คูณความลึก" }
      - { match: 18, feedback: "คูณไร่กับเมตรตรง ๆ ต้องแปลงไร่เป็นตารางเมตรก่อน" }
    solution: "พื้นที่ $4.5 \\times 1{,}600 = 7{,}200$ ตารางเมตร ปริมาตร $= 7{,}200 \\times 4 = 28{,}800$ ลูกบาศก์เมตร (ประมาณ เพราะสระจริงมีขอบลาด)"
    license: CC-BY-SA-4.0
    ai_assisted: true
