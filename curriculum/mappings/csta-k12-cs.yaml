    coverage: partial
    note: บทบาทในทีม (ผู้แทนผู้ใช้ ผู้ออกแบบ นักพัฒนา ผู้ทดสอบ ผู้ประสานงาน) การสลับบทบาท และเครื่องมือทำงานร่วมกัน แต่การรับบทบาทและสร้างชิ้นงานร่วมกับทีมจริงทำนอกแอป
  - topic: computer.projects.app-development
