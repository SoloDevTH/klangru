<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 330" width="430" height="330" font-family="sans-serif" font-size="16">
  <title>ห้องรูปตัว L จากสี่เหลี่ยม 10 m คูณ 8 m ที่ตัดมุมขวาบนออก 4 m คูณ 3 m</title>
  <polygon points="60,40 240,40 240,130 360,130 360,280 60,280" fill="#e2f0ed" stroke="#15211e" stroke-width="2.5" stroke-linejoin="round" />
  <rect x="240" y="40" width="120" height="90" fill="none" stroke="#6b7672" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="300" y="90" text-anchor="middle" fill="#6b7672" font-size="12" >ส่วนที่ตัดออก</text>
  <line x1="60" y1="298" x2="360" y2="298" stroke="#b4521f" stroke-width="1.5" />
  <line x1="60" y1="292" x2="60" y2="304" stroke="#b4521f" stroke-width="1.5" />
  <line x1="360" y1="292" x2="360" y2="304" stroke="#b4521f" stroke-width="1.5" />
  <text x="210" y="316" text-anchor="middle" fill="#b4521f" font-size="15" font-weight="bold">10 m</text>
  <line x1="42" y1="40" x2="42" y2="280" stroke="#b4521f" stroke-width="1.5" />
  <line x1="36" y1="40" x2="48" y2="40" stroke="#b4521f" stroke-width="1.5" />
  <line x1="36" y1="280" x2="48" y2="280" stroke="#b4521f" stroke-width="1.5" />
  <text x="34" y="165" text-anchor="end" fill="#b4521f" font-size="15" font-weight="bold">8 m</text>
  <line x1="240" y1="26" x2="360" y2="26" stroke="#b4521f" stroke-width="1.5" />
  <line x1="240" y1="20" x2="240" y2="32" stroke="#b4521f" stroke-width="1.5" />
  <line x1="360" y1="20" x2="360" y2="32" stroke="#b4521f" stroke-width="1.5" />
  <text x="300" y="18" text-anchor="middle" fill="#b4521f" font-size="15" font-weight="bold">4 m</text>
  <line x1="376" y1="40" x2="376" y2="130" stroke="#b4521f" stroke-width="1.5" />
  <line x1="370" y1="40" x2="382" y2="40" stroke="#b4521f" stroke-width="1.5" />
  <line x1="370" y1="130" x2="382" y2="130" stroke="#b4521f" stroke-width="1.5" />
  <text x="384" y="90" text-anchor="start" fill="#b4521f" font-size="15" font-weight="bold">3 m</text>
</svg>
