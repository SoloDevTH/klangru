    solution: "ข้อมูลที่ระบุตัวตนได้ต้องได้รับอนุญาต ใช้เฉพาะที่จำเป็น และแยกหรือปิดบังตัวตนก่อนวิเคราะห์ ตามหลักการเคารพบุคคลและการรักษาความลับ การตรวจโดยคณะกรรมการจริยธรรมของสถาบันอาจจำเป็นด้วย"
