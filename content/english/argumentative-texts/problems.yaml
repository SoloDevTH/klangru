  - จุดยืนมักอยู่ในประโยคสรุปของย่อหน้า
  solution: ข้อ c ถูก เพราะผู้เขียนชั่งน้ำหนักทั้งสองฝ่ายและเสนอให้ทดลองก่อนตัดสินระดับประเทศ
