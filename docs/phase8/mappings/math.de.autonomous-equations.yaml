  - { framework: university-foundations, indicators: ["MIT18.03 L1"], coverage: full, note: "สนามทิศทางของ y' = f(t,y) และทฤษฎีบทการมีอยู่และความเป็นหนึ่งเดียว (กล่าวเงื่อนไขและผล ไม่ได้พิสูจน์ทฤษฎีบท)" }
  - { framework: university-foundations, indicators: ["MIT18.03 R2"], coverage: full, note: "เส้นโค้งปริพันธ์ ไอโซไคลน์ แนวแบ่ง (separatrix) และกรวย (funnel) พร้อมตัวอย่างจากสนามทิศทางของสมการลอจิสติกส์ และโจทย์จับคู่คำศัพท์" }
  - { framework: university-foundations, indicators: ["MIT18.03 L8"], coverage: full, note: "สมการอัตโนมัติ y' = f(y) จุดวิกฤต เส้นเฟส และความเสถียรแบบเสถียร ไม่เสถียร และกึ่งเสถียร พร้อมตัวแบบลอจิสติกส์ที่มีการเก็บเกี่ยว" }
  - { framework: university-foundations, indicators: ["MIT18.03 L9"], coverage: full, note: "ความต่างระหว่างเชิงเส้นกับไม่เชิงเส้น คุณสมบัติซ้อนทับ และผลเฉลยที่ระเบิดในเวลาจำกัดของ y' = y^2" }
