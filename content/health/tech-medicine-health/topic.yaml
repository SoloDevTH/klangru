id: health.technology.tech-medicine-health
subject: health
title: { th: "เทคโนโลยี ความก้าวหน้าทางการแพทย์ และสุขภาพ", en: "Technology, medical advances and health" }
summary: ผลดีและผลเสียของการใช้เทคโนโลยีต่อตา ท่าทาง การนอน การได้ยิน และจิตใจ ความก้าวหน้าทางการแพทย์ เช่น วัคซีน การตรวจคัดกรอง ยาปฏิชีวนะ และการแพทย์ทางไกล และการประเมินอย่างมีเหตุผล
difficulty: 3.5
minutes: 30
prerequisites: [health.disease.communicable]
encompasses:
  - { id: health.disease.communicable, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: เวลาฟังที่ปลอดภัยต่อสัปดาห์
    src: safe-listening.svg
    alt: "แผนภูมิแท่งแนวนอนสเกลลอการิทึม เวลาฟังที่ปลอดภัยต่อสัปดาห์ตามระดับเสียง (WHO) 80 dB 40 ชั่วโมง ตัวอย่างเสียงกริ่งประตู 85 dB 12 ชั่วโมง 30 นาที รถติดหนาแน่น (ในรถ) 90 dB 4 ชั่วโมง ตะโกนคุยกัน 95 dB 1 ชั่วโมง 15 นาที รถจักรยานยนต์ 100 dB 20 นาที ไดร์เป่าผม หมายเหตุตั้งเสียงไม่เกิน 60% ของระดับสูงสุด"
    caption: "ข้อมูลจากองค์การอนามัยโลก (WHO)"
  - type: figure
    title: เส้นเวลาความก้าวหน้าทางการแพทย์
    src: medical-timeline.svg
    alt: "เส้นเวลา ค.ศ. 1796 เจนเนอร์พัฒนาวัคซีนชนิดแรกป้องกันฝีดาษ ค.ศ. 1895 เรินต์เกนค้นพบรังสีเอกซ์ ใช้ถ่ายภาพกระดูก ค.ศ. 1928 เฟลมมิงค้นพบเพนิซิลลิน ยาปฏิชีวนะ ค.ศ. 1980 WHO ประกาศกวาดล้างไข้ทรพิษสำเร็จ ค.ศ. 1988 เริ่มโครงการกวาดล้างโปลิโอ ผู้ป่วยลดลงกว่า 99% ปัจจุบัน การแพทย์ทางไกล แอปสุขภาพ พบแพทย์ออนไลน์"
  - type: worked-example
    title: ฟังเพลงแบบนี้ปลอดภัยไหม
    problem: "ปลาฟังเพลงผ่านหูฟังที่ความดังเฉลี่ยราว 85 dB วันละ 2 ชั่วโมง 5 วันต่อสัปดาห์ ใช้แผนภูมิของ WHO ตรวจว่าเกินเวลาที่ปลอดภัยหรือไม่"
    steps:
      - text: "เวลาฟังจริงต่อสัปดาห์ $2 \\times 5 = 10$ ชั่วโมง"
      - text: "จากแผนภูมิ ที่ 85 dB ฟังได้อย่างปลอดภัย 12 ชั่วโมง 30 นาที หรือ 12.5 ชั่วโมงต่อสัปดาห์"
      - text: "$10 < 12.5$ จึงยังไม่เกิน เหลืออีก $12.5 - 10 = 2.5$ ชั่วโมง"
      - text: "แต่ถ้าเพิ่มเสียงเป็น 90 dB เวลาที่ปลอดภัยเหลือ 4 ชั่วโมง 10 ชั่วโมงจะเกินไป 6 ชั่วโมง"
        why: "ความดังเพิ่มขึ้นเพียงเล็กน้อยทำให้เวลาที่ปลอดภัยลดลงมาก การลดเสียงจึงสำคัญพอ ๆ กับการลดเวลา"
    answer: "10 ชั่วโมงต่อสัปดาห์ที่ 85 dB ยังไม่เกิน 12.5 ชั่วโมง แต่ไม่ควรเพิ่มเสียง"
  - { type: check, problem: health.technology.tech-medicine-health.p004, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: worked-example
    title: ประเมินแอปสุขภาพก่อนเชื่อ
    problem: "แอปหนึ่งโฆษณาว่า \"วางนิ้วบนกล้องโทรศัพท์ 10 วินาที รู้ค่าความดันแม่นยำเท่าโรงพยาบาล ไม่ต้องพบแพทย์อีกต่อไป\" ลุงของต้นซึ่งเป็นความดันโลหิตสูงอยากใช้แทนการไปตามนัด ต้นควรช่วยประเมินอย่างไร"
    steps:
      - text: "มีหลักฐานหรือไม่: โฆษณาไม่ได้อ้างการทดสอบหรือหน่วยงานที่ตรวจสอบได้"
      - text: "ได้รับอนุญาตหรือไม่: เครื่องมือที่ใช้วินิจฉัยหรือติดตามโรคควรได้รับอนุญาตจาก อย. ต้องตรวจสอบก่อน"
      - text: "ผลดีคุ้มกับความเสี่ยงหรือไม่: ถ้าค่าที่ได้ผิด ลุงอาจหยุดยาหรือไม่ไปพบแพทย์จนความดันสูงอันตราย"
        why: "เทคโนโลยีที่ให้ผลผิดอาจทำร้ายมากกว่าไม่ใช้เลย"
      - text: "ควรปรึกษาใคร: ถามแพทย์หรือพยาบาลที่ดูแลลุงว่าควรวัดความดันที่บ้านด้วยเครื่องแบบใด"
    answer: "ยังไม่ควรเชื่อหรือใช้แทนการพบแพทย์ ให้ตรวจหลักฐานและการอนุญาต และปรึกษาแพทย์ผู้ดูแล"
  - { type: check, problem: health.technology.tech-medicine-health.p010 }
glossary:
  - { term: การแพทย์ทางไกล, definition: "การให้คำปรึกษาหรือติดตามการรักษาผ่านวิดีโอหรือช่องทางสื่อสาร โดยผู้ป่วยไม่ต้องเดินทางไปสถานพยาบาล" }
  - { term: การตรวจคัดกรอง, definition: "การตรวจหาโรคหรือความเสี่ยงในคนที่ยังไม่มีอาการ เพื่อพบและรักษาได้เร็ว" }
  - { term: เชื้อดื้อยา, definition: "เชื้อโรคที่ยาซึ่งเคยรักษาได้ใช้ไม่ได้ผลแล้ว เกิดจากการใช้ยาผิดวิธีหรือเกินจำเป็น" }
  - { term: เดซิเบล (dB), definition: "หน่วยวัดความดังของเสียง ยิ่งดังมาก เวลาฟังที่ปลอดภัยยิ่งสั้น" }
  - { term: ภาวะติดเกม, definition: "ภาวะที่ WHO จัดไว้ใน ICD-11 คือควบคุมการเล่นเกมไม่ได้ ให้เกมมาก่อนกิจกรรมอื่น และเล่นต่อแม้เกิดผลเสียจนกระทบชีวิต" }
flashcards:
  - { front: "ฟังเพลงอย่างปลอดภัย (WHO)", back: "ตั้งเสียงไม่เกิน 60% ที่ 80 dB ได้ 40 ชม./สัปดาห์ ที่ 90 dB ได้แค่ 4 ชม./สัปดาห์" }
  - { front: "จ้องจอแล้วตาแห้ง", back: "กะพริบตาน้อยลง (15 → 5–7 ครั้ง/นาที) ให้ตั้งใจกะพริบและมองไกลเป็นระยะ" }
  - { front: "ไข้ทรพิษ", back: "WHO ประกาศกวาดล้างสำเร็จในปี ค.ศ. 1980 (พ.ศ. 2523) ด้วยวัคซีน" }
  - { front: "คำถามประเมินเทคโนโลยีสุขภาพ", back: "มีหลักฐานไหม ได้รับอนุญาตไหม คุ้มความเสี่ยงไหม ใครได้ประโยชน์ ควรปรึกษาใคร" }
