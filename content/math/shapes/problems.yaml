problems:
  - id: math.geometry.shapes.p001
    topics: [math.geometry.shapes]
    difficulty: 1
    type: mcq
    multiple: true
    stem: "รูปใดเป็นรูปสามเหลี่ยม (เลือกทุกข้อที่ถูก)"
    figure: { src: shapes-abcdef.svg, alt: "รูป A สามเหลี่ยมยอดชี้ขึ้น รูป B สามเหลี่ยมผอมยอดชี้ลง รูป C เส้นตรงสามเส้นต่อกันแต่ปลายไม่บรรจบ เป็นรูปเปิด รูป D มีด้านตรงสองด้านและด้านโค้งหนึ่งด้าน รูป E สี่เหลี่ยมจัตุรัสที่หมุนเอียง รูป F สามเหลี่ยมใหญ่สีส้ม" }
    choices:
      - { id: a, text: "A", correct: true }
      - { id: b, text: "B", correct: true }
      - { id: c, text: "C", feedback: "C มีเส้นตรงสามเส้นก็จริง แต่ไม่ต่อกันเป็นรูปปิด จึงไม่ใช่สามเหลี่ยม" }
      - { id: d, text: "D", feedback: "D มีด้านหนึ่งโค้ง สามเหลี่ยมต้องมีด้านตรงทั้งสามด้าน" }
      - { id: e, text: "E", feedback: "E มีสี่ด้าน เป็นสี่เหลี่ยมจัตุรัสที่หมุนเอียง" }
      - { id: f, text: "F", correct: true }
    hints:
      - "สามเหลี่ยมคือรูปปิดที่มีด้านตรง 3 ด้าน"
      - "สี ขนาด และทิศที่รูปหันไป ไม่เปลี่ยนชนิดของรูป"
    solution: "A, B และ F เป็นรูปปิดที่มีด้านตรง 3 ด้าน จึงเป็นสามเหลี่ยม (B หันยอดลงและ F ใหญ่และมีสีต่าง แต่ยังเป็นสามเหลี่ยม) C ไม่ปิด D มีด้านโค้ง E มี 4 ด้าน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.shapes.p002
    topics: [math.geometry.shapes]
    difficulty: 1
    type: match
    stem: "จับคู่ของใช้กับรูปเรขาคณิตสามมิติที่ใกล้เคียงที่สุด"
    pairs:
      - { left: "ลูกตะกร้อ", right: "ทรงกลม" }
      - { left: "กระป๋องนมข้นหวาน", right: "ทรงกระบอก" }
      - { left: "กรวยจราจรสีส้ม", right: "กรวย" }
      - { left: "กล่องนม UHT", right: "ทรงสี่เหลี่ยมมุมฉาก" }
      - { left: "ลูกเต๋า", right: "ลูกบาศก์" }
    hints:
      - "ดูว่าของนั้นมีผิวโค้งหรือไม่ และมีหน้าแบนกี่หน้า"
      - "ลูกบาศก์ทุกหน้าเป็นสี่เหลี่ยมจัตุรัสที่เท่ากัน"
    solution: "ลูกตะกร้อกลมทุกทิศ → ทรงกลม กระป๋องมีหน้าวงกลม 2 หน้า → ทรงกระบอก กรวยจราจรมีฐานกลมและยอดแหลม → กรวย กล่องนมมีหน้าสี่เหลี่ยม 6 หน้า → ทรงสี่เหลี่ยมมุมฉาก ลูกเต๋าทุกหน้าเป็นสี่เหลี่ยมจัตุรัส → ลูกบาศก์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.shapes.p003
    topics: [math.geometry.shapes]
    difficulty: 1
    type: numeric
    stem: "รูปหกเหลี่ยมมีกี่ด้าน (ตอบเป็นจำนวนด้าน)"
    answer: { value: 6, unit: ด้าน }
    hints:
      - "ชื่อของรูปหลายเหลี่ยมบอกจำนวนด้าน"
      - "\"หก\" เหลี่ยม"
    misconceptions:
      - { match: 8, feedback: "8 ด้านคือรูปแปดเหลี่ยม เช่น ป้ายหยุด" }
      - { match: 5, feedback: "5 ด้านคือรูปห้าเหลี่ยม" }
    solution: "รูปหกเหลี่ยมมี 6 ด้าน และมีจุดยอด 6 จุด เช่น ช่องรังผึ้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.shapes.p004
    topics: [math.geometry.shapes]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นรูปเรขาคณิตสองมิติ"
    choices:
      - { id: a, text: "วงกลมที่วาดบนกระดาษ", correct: true }
      - { id: b, text: "ลูกปิงปอง", feedback: "ลูกปิงปองจับถือได้และมีความหนา เป็นทรงกลม ซึ่งเป็นรูปสามมิติ" }
      - { id: c, text: "กล่องดินสอ", feedback: "กล่องมีความกว้าง ยาว และสูง เป็นรูปสามมิติ" }
    hints:
      - "รูปสองมิติแบนราบ วาดบนกระดาษได้"
      - "รูปสามมิติมีความหนา จับถือได้"
    solution: "วงกลมที่วาดบนกระดาษแบนราบ จึงเป็นรูปสองมิติ ส่วนลูกปิงปองและกล่องดินสอมีความหนา เป็นรูปสามมิติ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.shapes.p005
    topics: [math.geometry.shapes]
    difficulty: 2
    type: numeric
    stem: "ทรงสี่เหลี่ยมมุมฉากมีสันทั้งหมดกี่สัน (ตอบเป็นจำนวนสัน)"
    answer: { value: 12, unit: สัน }
    hints:
      - "สันคือเส้นที่หน้าสองหน้ามาพบกัน"
      - "นับสันของหน้าด้านหน้า หน้าด้านหลัง แล้วนับสันที่เชื่อมระหว่างสองหน้านี้"
    misconceptions:
      - { match: 6, feedback: "6 คือจำนวนหน้า สันคือเส้นขอบ ไม่ใช่ผิวแบน" }
      - { match: 8, feedback: "8 คือจำนวนจุดยอด หรือนับแค่สันของหน้าด้านหน้าและด้านหลัง ยังขาดสัน 4 เส้นที่เชื่อมระหว่างกัน" }
    solution: "หน้าด้านหน้ามีสัน 4 เส้น หน้าด้านหลัง 4 เส้น และสันที่เชื่อมด้านหน้ากับด้านหลังอีก 4 เส้น รวม 12 สัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.shapes.p006
    topics: [math.geometry.shapes]
    difficulty: 2
    type: text
    stem: "รูปปิดที่มีด้านตรง 5 ด้านเรียกว่ารูปอะไร"
    accepted: ["รูปห้าเหลี่ยม", "ห้าเหลี่ยม"]
    hints:
      - "รูปหลายเหลี่ยมเรียกชื่อตามจำนวนด้าน"
      - "3 ด้านคือสามเหลี่ยม 4 ด้านคือสี่เหลี่ยม"
    misconceptions:
      - { match: "รูปหกเหลี่ยม", feedback: "หกเหลี่ยมมี 6 ด้าน ลองนับใหม่" }
    solution: "รูปปิดที่มีด้านตรง 5 ด้านคือ รูปห้าเหลี่ยม มีจุดยอด 5 จุดด้วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.shapes.p007
    topics: [math.geometry.shapes]
    difficulty: 2
    type: mcq
    stem: "รูปสามมิติใดมีหน้าแบน 2 หน้า แต่ไม่มีจุดยอดเลย"
    choices:
      - { id: a, text: "ทรงกระบอก", correct: true }
      - { id: b, text: "กรวย", feedback: "กรวยมีหน้าแบนแค่ 1 หน้า (ฐาน) และมียอดแหลม 1 จุด" }
      - { id: c, text: "ทรงกลม", feedback: "ทรงกลมมีแต่ผิวโค้ง ไม่มีหน้าแบนเลย" }
      - { id: d, text: "ปริซึมสามเหลี่ยม", feedback: "ปริซึมสามเหลี่ยมมีหน้า 5 หน้า และจุดยอด 6 จุด" }
    hints:
      - "นึกถึงกระป๋อง"
      - "รูปที่ไม่มีจุดยอดต้องมีผิวโค้ง"
    solution: "ทรงกระบอกมีหน้าวงกลม 2 หน้า (บนและล่าง) กับผิวโค้ง 1 ผิว สันเป็นเส้นโค้ง ไม่มีมุมแหลม จึงไม่มีจุดยอด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.shapes.p008
    topics: [math.geometry.shapes]
    difficulty: 2
    type: mcq
    stem: "ต้นจุ่มหน้าข้างหน้าหนึ่งของพีระมิดฐานสี่เหลี่ยมจัตุรัสลงในสี แล้วกดลงบนกระดาษ จะได้รอยเป็นรูปอะไร"
    choices:
      - { id: a, text: "รูปสามเหลี่ยม", correct: true }
      - { id: b, text: "รูปสี่เหลี่ยมจัตุรัส", feedback: "สี่เหลี่ยมจัตุรัสคือฐานของพีระมิด ข้อนี้กดหน้าข้าง" }
      - { id: c, text: "วงกลม", feedback: "พีระมิดไม่มีผิวโค้งหรือหน้าวงกลม วงกลมได้จากฐานของกรวยหรือทรงกระบอก" }
    hints:
      - "หน้าข้างของพีระมิดทุกหน้ามาพบกันที่ยอดจุดเดียว"
      - "หน้าข้างแต่ละหน้ามีขอบกี่เส้น"
    solution: "หน้าข้างของพีระมิดมีขอบล่างหนึ่งเส้น (ด้านของฐาน) และขอบสองเส้นที่วิ่งขึ้นไปพบกันที่ยอด จึงเป็นรูปสามเหลี่ยม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.shapes.p009
    topics: [math.geometry.shapes]
    difficulty: 2
    type: mcq
    stem: "รางรถไฟสองเส้นที่วิ่งไปเชียงใหม่ อยู่ห่างกันเท่าเดิมตลอดทาง รางสองเส้นนี้เป็นเส้นแบบใด"
    choices:
      - { id: a, text: "เส้นขนาน", correct: true }
      - { id: b, text: "เส้นตั้งฉาก", feedback: "เส้นตั้งฉากต้องตัดกันเป็นมุมฉาก รางสองเส้นไม่ตัดกันเลย (หมอนรองรางกับรางต่างหากที่ตั้งฉากกัน)" }
      - { id: c, text: "เส้นที่ตัดกัน", feedback: "ถ้ารางตัดกัน รถไฟจะวิ่งไม่ได้ เส้นที่ห่างกันเท่าเดิมตลอดไม่มีวันตัดกัน" }
    hints:
      - "เส้นที่ห่างกันเท่าเดิมตลอด จะมาพบกันได้หรือไม่"
      - "ทบทวนคำว่า เส้นขนาน และ เส้นตั้งฉาก"
    solution: "เส้นสองเส้นที่ห่างกันเท่าเดิมตลอดและไม่ตัดกัน เรียกว่าเส้นขนาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.shapes.p010
    topics: [math.geometry.shapes]
    difficulty: 3
    type: numeric
    stem: "ปริซึมในภาพมีจุดยอดกี่จุด (ตอบเป็นจำนวนจุด)"
    figure: { src: prism-count.svg, alt: "ปริซึมสามเหลี่ยมวาดแบบสามมิติ หน้าด้านหน้าเป็นสามเหลี่ยม หน้าด้านหลังเป็นสามเหลี่ยมที่เท่ากัน มีสันสามเส้นเชื่อมมุมของสามเหลี่ยมทั้งสอง เส้นประแสดงสันที่ซ่อนอยู่ด้านหลัง" }
    answer: { value: 6, unit: จุด }
    hints:
      - "จุดยอดคือมุมที่สันมาพบกัน อย่าลืมมุมที่ซ่อนอยู่ด้านหลัง"
      - "นับมุมของสามเหลี่ยมด้านหน้า แล้วนับมุมของสามเหลี่ยมด้านหลัง"
    misconceptions:
      - { match: 5, feedback: "5 คือจำนวนหน้าของปริซึมสามเหลี่ยม หรือลืมนับมุมที่ซ่อนอยู่ด้านหลัง" }
      - { match: 9, feedback: "9 คือจำนวนสัน จุดยอดคือมุม ไม่ใช่เส้น" }
    solution: "สามเหลี่ยมด้านหน้ามีมุม 3 จุด สามเหลี่ยมด้านหลังมีมุมอีก 3 จุด รวม 6 จุดยอด (ปริซึมฐาน $n$ เหลี่ยมมีจุดยอด $2n$ จุด)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.shapes.p011
    topics: [math.geometry.shapes]
    difficulty: 3
    type: order
    stem: "เรียงรูปสามมิติตามจำนวนจุดยอด จากน้อยไปมาก"
    items:
      - "ทรงกระบอก"
      - "กรวย"
      - "พีระมิดฐานสามเหลี่ยม"
      - "พีระมิดฐานสี่เหลี่ยมจัตุรัส"
      - "ปริซึมสามเหลี่ยม"
      - "ทรงสี่เหลี่ยมมุมฉาก"
    hints:
      - "รูปที่มีผิวโค้งมีจุดยอดน้อย ทรงกระบอกไม่มีเลย กรวยมีที่ยอด 1 จุด"
      - "พีระมิดมีจุดยอดเท่ากับมุมของฐานบวกยอด 1 จุด ปริซึมมีจุดยอดเป็นสองเท่าของมุมของฐาน"
    solution: "ทรงกระบอก 0 จุด, กรวย 1, พีระมิดฐานสามเหลี่ยม $3 + 1 = 4$, พีระมิดฐานสี่เหลี่ยม $4 + 1 = 5$, ปริซึมสามเหลี่ยม $2 \\times 3 = 6$, ทรงสี่เหลี่ยมมุมฉาก 8"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.shapes.p012
    topics: [math.geometry.shapes]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นลักษณะของปริซึม ทุกรูป (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "มีฐานสองฐานที่เป็นรูปหลายเหลี่ยมเท่ากันทุกประการและขนานกัน", correct: true }
      - { id: b, text: "หน้าข้างทุกหน้าเป็นรูปสี่เหลี่ยม", correct: true }
      - { id: c, text: "ฐานเป็นรูปสี่เหลี่ยมเสมอ", feedback: "ฐานเป็นรูปหลายเหลี่ยมใดก็ได้ เช่น ปริซึมสามเหลี่ยม ปริซึมหกเหลี่ยม" }
      - { id: d, text: "หน้าข้างทุกหน้ามาพบกันที่ยอดจุดเดียว", feedback: "นั่นคือลักษณะของพีระมิด หน้าข้างของปริซึมเชื่อมฐานบนกับฐานล่าง ไม่มาพบกันที่ยอด" }
    hints:
      - "นึกถึงปริซึมสามเหลี่ยมและทรงสี่เหลี่ยมมุมฉาก ข้อที่ถูกต้องจริงกับทั้งสองรูป"
      - "เทียบกับพีระมิดว่าต่างกันอย่างไร"
    solution: "ปริซึมทุกรูปมีฐานสองฐานที่เท่ากันทุกประการและขนานกัน หน้าข้างเชื่อมด้านของฐานบนกับฐานล่างจึงเป็นรูปสี่เหลี่ยม (ปริซึมตรงเป็นสี่เหลี่ยมมุมฉาก) ฐานไม่จำเป็นต้องเป็นสี่เหลี่ยม และหน้าข้างไม่มาพบกันที่ยอด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.shapes.p013
    topics: [math.geometry.shapes]
    difficulty: 3
    type: mcq
    stem: "ปุ้ยวาดรูปสามเหลี่ยม แล้วหมุนให้ยอดชี้ลง ระบายสีแดง และขยายให้ใหญ่ขึ้นสองเท่า รูปใหม่เป็นรูปอะไร"
    choices:
      - { id: a, text: "ยังเป็นรูปสามเหลี่ยม", correct: true }
      - { id: b, text: "ไม่ใช่สามเหลี่ยมแล้ว เพราะยอดชี้ลง", feedback: "การหมุนไม่เปลี่ยนจำนวนด้านหรือความตรงของด้าน จึงยังเป็นสามเหลี่ยม" }
      - { id: c, text: "กลายเป็นรูปสี่เหลี่ยม เพราะใหญ่ขึ้น", feedback: "ขนาดไม่เปลี่ยนจำนวนด้าน รูปยังมีด้านตรง 3 ด้าน" }
    hints:
      - "อะไรบ้างที่ใช้ตัดสินชนิดของรูป"
      - "การหมุน สี และขนาด เปลี่ยนจำนวนด้านหรือไม่"
    solution: "ชนิดของรูปตัดสินจากความเป็นรูปปิด ด้านตรง และจำนวนด้าน ซึ่งไม่เปลี่ยน รูปจึงยังเป็นสามเหลี่ยม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.shapes.p014
    topics: [math.geometry.shapes]
    difficulty: 3
    type: numeric
    stem: "ตัดกระดาษรูปสี่เหลี่ยมจัตุรัสตามเส้นทแยงมุมทั้งสองเส้น จะได้รูปสามเหลี่ยมกี่รูป"
    answer: { value: 4, unit: รูป }
    hints:
      - "เส้นทแยงมุมเชื่อมมุมตรงข้ามของสี่เหลี่ยม สี่เหลี่ยมจัตุรัสมีสองเส้น"
      - "ตัดเส้นแรกได้สามเหลี่ยม 2 รูป เส้นที่สองตัดผ่านทั้งสองรูปนั้น"
