problems:
  - id: biology.animals.hormones.p001
    topics: [biology.animals.hormones]
    difficulty: 1
    type: mcq
    stem: "ฮอร์โมนใดทำให้ระดับน้ำตาลในเลือดลดลง"
    choices:
      - { id: a, text: "อินซูลิน", correct: true }
      - { id: b, text: "กลูคากอน", feedback: "กลูคากอนเพิ่มน้ำตาลในเลือดโดยให้ตับสลายไกลโคเจน" }
      - { id: c, text: "อะดรีนาลีน", feedback: "อะดรีนาลีนเพิ่มน้ำตาลในเลือดเพื่อเตรียมพลังงานให้สู้หรือหนี" }
      - { id: d, text: "ไทรอกซิน", feedback: "ไทรอกซินเพิ่มอัตราเมแทบอลิซึม ไม่ได้มีหน้าที่หลักในการลดน้ำตาล" }
    hints:
      - "ฮอร์โมนนี้มาจากตับอ่อน"
      - "ถ้าขาดฮอร์โมนนี้จะเป็นเบาหวาน"
    solution: "อินซูลินจากตับอ่อนทำให้เซลล์นำกลูโคสไปใช้และตับเก็บกลูโคสเป็นไกลโคเจน น้ำตาลในเลือดจึงลดลง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.hormones.p002
    topics: [biology.animals.hormones]
    difficulty: 1
    type: text
    stem: "ชุดตรวจการตั้งครรภ์ตรวจหาฮอร์โมนที่สร้างจากรกในปัสสาวะ ฮอร์โมนนี้ชื่อย่อว่าอะไร"
    accepted: ["hCG", "เอชซีจี", "human chorionic gonadotropin"]
    misconceptions:
      - { match: "LH", feedback: "LH มาจากต่อมใต้สมองส่วนหน้า กระตุ้นการตกไข่" }
      - { match: "โพรเจสเทอโรน", feedback: "โพรเจสเทอโรนสำคัญต่อการตั้งครรภ์ แต่ชุดตรวจครรภ์ทั่วไปตรวจหา hCG" }
    hints:
      - "เป็นฮอร์โมนจากเนื้อเยื่อที่เกิดขึ้นเฉพาะเมื่อตั้งครรภ์"
      - "ชื่อย่อมี 3 ตัวอักษร ขึ้นต้นด้วย h"
    solution: "รกสร้าง hCG ตั้งแต่ระยะแรกของการตั้งครรภ์ hCG ถูกขับออกทางปัสสาวะ ชุดตรวจครรภ์จึงตรวจหาฮอร์โมนนี้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.hormones.p003
    topics: [biology.animals.hormones]
    difficulty: 1
    type: match
    stem: "จับคู่ต่อมไร้ท่อกับฮอร์โมนที่สร้าง"
    pairs:
      - { left: "ต่อมไทรอยด์", right: "ไทรอกซิน" }
      - { left: "ต่อมพาราไทรอยด์", right: "พาราทอร์โมน" }
      - { left: "ต่อมหมวกไตส่วนใน", right: "อะดรีนาลีน" }
      - { left: "ต่อมไพเนียล", right: "เมลาโทนิน" }
      - { left: "ต่อมใต้สมองส่วนหน้า", right: "โกรทฮอร์โมน" }
    hints:
      - "ฮอร์โมนที่หลั่งมากตอนมืดมาจากต่อมในสมอง"
      - "พาราทอร์โมนมีชื่อคล้ายต่อมที่สร้าง"
    solution: "ไทรอยด์–ไทรอกซิน พาราไทรอยด์–พาราทอร์โมน หมวกไตส่วนใน–อะดรีนาลีน ไพเนียล–เมลาโทนิน ต่อมใต้สมองส่วนหน้า–โกรทฮอร์โมน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.hormones.p004
    topics: [biology.animals.hormones]
    difficulty: 2
    type: mcq
    stem: "ต่อมไร้ท่อต่างจากต่อมมีท่ออย่างไร"
    choices:
      - { id: a, text: "ต่อมไร้ท่อปล่อยสารเข้าสู่เลือดโดยตรง ต่อมมีท่อปล่อยสารผ่านท่อไปยังตำแหน่งเฉพาะ", correct: true }
      - { id: b, text: "ต่อมไร้ท่อไม่มีเลือดมาเลี้ยง", feedback: "ต่อมไร้ท่อมีเลือดมาเลี้ยงมาก เพราะต้องปล่อยฮอร์โมนเข้าสู่เลือด" }
      - { id: c, text: "ต่อมมีท่อสร้างฮอร์โมน ต่อมไร้ท่อสร้างน้ำย่อย", feedback: "กลับกัน ต่อมมีท่อ เช่น ต่อมน้ำลาย สร้างน้ำย่อยหรือเหงื่อ ต่อมไร้ท่อสร้างฮอร์โมน" }
      - { id: d, text: "ต่อมไร้ท่อส่งสารผ่านเส้นประสาท", feedback: "ฮอร์โมนเดินทางไปกับเลือด ไม่ใช่เส้นประสาท" }
    hints:
      - "ดูจากชื่อ 'ไร้ท่อ'"
      - "ฮอร์โมนเดินทางไปทั่วร่างกายด้วยวิธีใด"
    solution: "ต่อมไร้ท่อปล่อยฮอร์โมนเข้าสู่เลือดโดยตรงแล้วไปทั่วร่างกาย ต่อมมีท่อ เช่น ต่อมน้ำลายและต่อมเหงื่อ ปล่อยสารผ่านท่อไปยังตำแหน่งเฉพาะ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.hormones.p005
    topics: [biology.animals.hormones]
    difficulty: 2
    type: order
    stem: "เรียงลำดับการควบคุมตั้งแต่สมองสั่งจนเซลล์ทั่วร่างกายมีเมแทบอลิซึมเพิ่มขึ้น"
    items:
      - "ไฮโพทาลามัสหลั่ง TRH"
      - "ต่อมใต้สมองส่วนหน้าหลั่ง TSH"
      - "ต่อมไทรอยด์หลั่งไทรอกซิน"
      - "เซลล์ทั่วร่างกายเพิ่มอัตราเมแทบอลิซึม"
    hints:
      - "ไฮโพทาลามัสสั่งต่อมใต้สมอง ต่อมใต้สมองสั่งต่อมอื่น"
      - "TSH ย่อมาจากฮอร์โมนกระตุ้นต่อมไทรอยด์"
    solution: "ไฮโพทาลามัส (TRH) → ต่อมใต้สมองส่วนหน้า (TSH) → ต่อมไทรอยด์ (ไทรอกซิน) → เซลล์ทั่วร่างกาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.hormones.p006
    topics: [biology.animals.hormones]
    difficulty: 2
    type: mcq
    stem: "ในอดีต คนในพื้นที่ภูเขาห่างทะเลของไทยเป็นคอพอกมาก เพราะอาหารมีไอโอดีนน้อย ข้อใดอธิบายได้ถูกต้อง"
    choices:
      - { id: a, text: "ไทรอกซินต่ำ จึงไม่ยับยั้งต่อมใต้สมอง TSH สูงอยู่ตลอดและกระตุ้นต่อมไทรอยด์จนโต", correct: true }
      - { id: b, text: "ไทรอกซินสูงเกินไปจนต่อมไทรอยด์บวม", feedback: "ขาดไอโอดีนทำให้สร้างไทรอกซินได้น้อย ไม่ใช่มาก" }
      - { id: c, text: "TSH ต่ำ ต่อมไทรอยด์จึงโตเพื่อชดเชย", feedback: "เมื่อไทรอกซินต่ำ TSH จะสูง ไม่ใช่ต่ำ" }
      - { id: d, text: "ไอโอดีนที่ขาดไปทำให้เซลล์ไทรอยด์ตายแล้วบวม", feedback: "ต่อมโตเพราะ TSH กระตุ้นให้เซลล์เพิ่มจำนวนและขนาด" }
    hints:
      - "ไอโอดีนเป็นวัตถุดิบของฮอร์โมนใด"
      - "ฮอร์โมนนั้นต่ำแล้ว TSH เปลี่ยนอย่างไรตามการป้อนกลับเชิงลบ"
    solution: "ขาดไอโอดีน ไทรอกซินต่ำ ไม่มีสัญญาณยับยั้งย้อนกลับ ต่อมใต้สมองส่วนหน้าหลั่ง TSH มาก TSH กระตุ้นต่อมไทรอยด์จนโตเป็นคอพอก การใช้เกลือเสริมไอโอดีนจึงช่วยป้องกันได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.hormones.p007
    topics: [biology.animals.hormones]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นตัวอย่างของการป้อนกลับเชิงบวก"
    choices:
      - { id: a, text: "ขณะคลอด มดลูกหดตัวดันทารก กระตุ้นการหลั่งออกซิโทซินมากขึ้น มดลูกจึงหดตัวแรงขึ้นอีก", correct: true }
      - { id: b, text: "น้ำตาลในเลือดสูง ตับอ่อนหลั่งอินซูลิน น้ำตาลลดลง", feedback: "ผลของอินซูลินลบล้างการเปลี่ยนแปลง จึงเป็นการป้อนกลับเชิงลบ" }
      - { id: c, text: "ไทรอกซินสูงยับยั้งการหลั่ง TSH", feedback: "เป็นการป้อนกลับเชิงลบ" }
      - { id: d, text: "แคลเซียมในเลือดต่ำ ต่อมพาราไทรอยด์หลั่ง PTH จนแคลเซียมกลับสู่ปกติ", feedback: "ค่ากลับเข้าหาปกติ จึงเป็นการป้อนกลับเชิงลบ" }
    hints:
      - "เชิงบวกคือผลไปเสริมสิ่งเร้าให้แรงขึ้น"
      - "หาเหตุการณ์ที่แรงขึ้นเรื่อย ๆ จนจบ"
    solution: "การคลอดเป็นการป้อนกลับเชิงบวก ออกซิโทซินทำให้มดลูกหดตัว ยิ่งดันทารกยิ่งกระตุ้นออกซิโทซิน จนคลอดเสร็จวงจรจึงหยุด ข้ออื่นเป็นการป้อนกลับเชิงลบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.hormones.p008
    topics: [biology.animals.hormones]
    difficulty: 3
    type: numeric
    stem: "จากกราฟ (ข้อมูลสมมติ) ระดับน้ำตาลในเลือดสูงสุดหลังกินอาหารเพิ่มขึ้นจากก่อนกินกี่ mg/dL"
    figure: { src: glucose-insulin.svg, alt: "กราฟเส้นสามเส้น แกนนอนคือเวลาหลังกินอาหาร 0 ถึง 180 นาที ทุก 30 นาที น้ำตาลในเลือดเป็นเส้นสีแดงทึบ ค่า 90, 150, 130, 105, 90, 85, 88 มิลลิกรัมต่อเดซิลิตร อินซูลินเป็นเส้นประสีน้ำเงิน ค่า 10, 60, 45, 25, 12, 8, 9 กลูคากอนเป็นเส้นจุดสีเขียว ค่า 60, 30, 35, 45, 58, 65, 62" }
    answer: { value: 60, unit: "mg/dL" }
    misconceptions:
      - { match: 150, feedback: "150 คือค่าสูงสุด โจทย์ถามว่าเพิ่มขึ้นจากก่อนกินเท่าใด" }
      - { match: 50, feedback: "อ่านค่าอินซูลินแทน ต้องใช้เส้นน้ำตาลสีแดง" }
    hints:
      - "อ่านค่าของเส้นสีแดงที่ 0 นาทีและที่จุดสูงสุด"
      - "เพิ่มขึ้น = ค่าสูงสุด − ค่าก่อนกิน"
    solution: "ก่อนกิน 90 mg/dL สูงสุดที่ 30 นาที 150 mg/dL เพิ่มขึ้น $150 - 90 = 60$ mg/dL"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.hormones.p009
    topics: [biology.animals.hormones]
    difficulty: 3
    type: mcq
    stem: "จากกราฟเดียวกัน ทำไมกลูคากอนลดลงในช่วง 0–30 นาทีหลังกินอาหาร"
    figure: { src: glucose-insulin.svg, alt: "กราฟเส้นสามเส้น ในช่วง 0 ถึง 30 นาที น้ำตาลในเลือดเพิ่มจาก 90 เป็น 150 อินซูลินเพิ่มจาก 10 เป็น 60 และกลูคากอนลดจาก 60 เป็น 30 หลังจากนั้นน้ำตาลและอินซูลินค่อย ๆ ลดลง ส่วนกลูคากอนค่อย ๆ เพิ่มขึ้นจนถึงราว 65 ที่ 150 นาที" }
    choices:
      - { id: a, text: "น้ำตาลในเลือดสูงขึ้น ร่างกายไม่ต้องการให้ตับปล่อยกลูโคสเพิ่ม จึงลดกลูคากอนพร้อมกับเพิ่มอินซูลิน", correct: true }
      - { id: b, text: "อินซูลินทำลายกลูคากอนในเลือด", feedback: "อินซูลินไม่ได้ทำลายกลูคากอน ตับอ่อนหลั่งกลูคากอนน้อยลงเพราะน้ำตาลสูง" }
      - { id: c, text: "ตับอ่อนหยุดทำงานชั่วคราวหลังกินอาหาร", feedback: "ตับอ่อนยังหลั่งอินซูลินเพิ่มขึ้นในช่วงเดียวกัน" }
      - { id: d, text: "กลูคากอนถูกใช้หมดในการย่อยอาหาร", feedback: "กลูคากอนเป็นฮอร์โมนควบคุมน้ำตาล ไม่ได้ใช้ย่อยอาหาร" }
    hints:
      - "กลูคากอนทำให้น้ำตาลในเลือดเพิ่มหรือลด"
      - "ตอนนั้นร่างกายต้องการให้น้ำตาลเพิ่มหรือลด"
    solution: "กลูคากอนเพิ่มน้ำตาล เมื่อน้ำตาลสูงหลังกินอาหาร ตับอ่อนจึงลดกลูคากอนและเพิ่มอินซูลินพร้อมกัน ฮอร์โมนคู่ตรงข้ามนี้ช่วยให้น้ำตาลกลับสู่ปกติเร็วขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.hormones.p010
    topics: [biology.animals.hormones]
    difficulty: 3
    type: mcq
    stem: "คอร์ติซอลเป็นฮอร์โมนสเตียรอยด์ ส่วนอินซูลินเป็นโปรตีน ข้อใดเปรียบเทียบการออกฤทธิ์ได้ถูกต้อง"
    choices:
      - { id: a, text: "คอร์ติซอลผ่านเยื่อหุ้มเซลล์ไปจับตัวรับภายในเซลล์และควบคุมการแสดงออกของยีน อินซูลินจับตัวรับที่เยื่อหุ้มเซลล์", correct: true }
      - { id: b, text: "อินซูลินผ่านเยื่อหุ้มเซลล์เข้าไปในนิวเคลียสโดยตรง", feedback: "อินซูลินเป็นโปรตีนละลายน้ำ ผ่านชั้นลิพิดของเยื่อหุ้มเซลล์ไม่ได้" }
      - { id: c, text: "ทั้งสองจับตัวรับที่เยื่อหุ้มเซลล์เหมือนกัน", feedback: "สเตียรอยด์ละลายในลิพิด จึงผ่านเยื่อหุ้มเซลล์ไปจับตัวรับภายในได้" }
      - { id: d, text: "คอร์ติซอลออกฤทธิ์เร็วกว่าอินซูลินเสมอ เพราะเข้าเซลล์ได้", feedback: "การควบคุมยีนต้องสร้างโปรตีนใหม่ จึงมักช้ากว่า แต่ผลอยู่นานกว่า" }
    hints:
      - "เยื่อหุ้มเซลล์เป็นชั้นลิพิด"
      - "สารใดละลายในลิพิดได้"
    solution: "สเตียรอยด์ละลายในลิพิด ผ่านเยื่อหุ้มเซลล์ไปจับตัวรับในเซลล์แล้วควบคุมยีน ออกฤทธิ์ช้าแต่นาน ส่วนอินซูลินละลายน้ำ จับตัวรับที่เยื่อหุ้มเซลล์แล้วส่งสัญญาณต่อภายในเซลล์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.hormones.p011
    topics: [biology.animals.hormones]
    difficulty: 3
    type: mcq
    stem: "เมื่อแคลเซียมในเลือดต่ำกว่าปกติ ร่างกายตอบสนองอย่างไร"
    choices:
      - { id: a, text: "ต่อมพาราไทรอยด์หลั่งพาราทอร์โมน กระตุ้นการสลายกระดูกและการดูดกลับแคลเซียมที่ไต", correct: true }
      - { id: b, text: "ต่อมไทรอยด์หลั่งแคลซิโทนินเพิ่มขึ้น", feedback: "แคลซิโทนินลดแคลเซียมในเลือด จะหลั่งเมื่อแคลเซียมสูง" }
