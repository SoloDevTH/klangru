<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="700" height="230" font-family="sans-serif">
<title>สี่ขั้นการปฏิเสธ</title>
<rect x="0" y="0" width="700" height="230" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="350.0" y="28.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">ปฏิเสธอย่างไรให้ได้ผลและยังเป็นเพื่อนกัน</text>
<rect x="20.0" y="55.0" width="150.0" height="130.0" rx="10" fill="#f9dede" stroke="#333" stroke-width="1.5"/>
<text x="95.0" y="88.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">1 ปฏิเสธชัด</text>
<text x="95.0" y="122.0" font-size="12" text-anchor="middle" fill="#222">"ไม่เอา ขอบใจ"</text>
<line x1="173.0" y1="120.0" x2="187.0" y2="120.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="190.0" y="55.0" width="150.0" height="130.0" rx="10" fill="#fff4d6" stroke="#333" stroke-width="1.5"/>
<text x="265.0" y="88.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">2 บอกเหตุผล</text>
<text x="265.0" y="122.0" font-size="12" text-anchor="middle" fill="#222">"ฉันไม่อยากให้ปอด</text>
<text x="265.0" y="140.0" font-size="12" text-anchor="middle" fill="#222">พังตั้งแต่อายุ 14"</text>
<line x1="343.0" y1="120.0" x2="357.0" y2="120.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="360.0" y="55.0" width="150.0" height="130.0" rx="10" fill="#eaf6e3" stroke="#333" stroke-width="1.5"/>
<text x="435.0" y="88.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">3 เสนอทางเลือก</text>
<text x="435.0" y="122.0" font-size="12" text-anchor="middle" fill="#222">"ไปเตะบอลกันดีกว่า"</text>
<line x1="513.0" y1="120.0" x2="527.0" y2="120.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="530.0" y="55.0" width="150.0" height="130.0" rx="10" fill="#dcecf9" stroke="#333" stroke-width="1.5"/>
<text x="605.0" y="88.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">4 ออกจากที่นั่น</text>
<text x="605.0" y="122.0" font-size="12" text-anchor="middle" fill="#222">ถ้ายังถูกตื๊อ</text>
<text x="605.0" y="140.0" font-size="12" text-anchor="middle" fill="#222">เดินออกมาเลย</text>
<text x="350.0" y="214.0" font-size="12" text-anchor="middle" fill="#333">ไม่ต้องตำหนิหรือดูถูกคนที่สูบหรือดื่ม บอกการตัดสินใจของเราเท่านั้น</text>
</svg>
