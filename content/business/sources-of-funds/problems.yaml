problems:
- id: business.finance.sources-of-funds.p001
  topics:
  - business.finance.sources-of-funds
  difficulty: 1
  type: match
  stem: จับคู่แหล่งเงินทุนกับประเภท
  pairs:
  - left: กำไรสะสมที่ไม่ได้จ่ายเป็นเงินปันผล
    right: แหล่งภายใน (ส่วนของเจ้าของ)
  - left: เงินเบิกเกินบัญชี (OD)
    right: หนี้ระยะสั้น
  - left: หุ้นกู้อายุ 7 ปีที่เสนอขายนักลงทุน
    right: หนี้ระยะยาวจากตลาดตราสารหนี้
  - left: หุ้นสามัญที่เสนอขายครั้งแรกในตลาดหลักทรัพย์
    right: ส่วนของเจ้าของจากตลาดทุน
  hints:
  - แยกก่อนว่าเป็นหนี้ (ต้องจ่ายคืน) หรือส่วนของเจ้าของ
  - แล้วดูว่าระยะสั้นหรือยาว มาจากภายในหรือภายนอก
  solution: กำไรสะสม = แหล่งภายใน OD = หนี้ระยะสั้นจากธนาคาร หุ้นกู้ = หนี้ระยะยาวที่ระดมจากตลาดตราสารหนี้ หุ้นสามัญ IPO = ส่วนของเจ้าของจากตลาดทุน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.sources-of-funds.p002
  topics:
  - business.finance.sources-of-funds
  difficulty: 1
  type: mcq
  stem: ผู้ให้เงินทุนกลุ่มใดรับความเสี่ยงสูงที่สุด จึงต้องการผลตอบแทนสูงที่สุด
  choices:
  - id: a
    text: ผู้ถือหุ้นสามัญ
    correct: true
  - id: b
    text: ธนาคารที่ให้กู้โดยมีหลักประกัน
    feedback: ธนาคารได้ดอกเบี้ยตามสัญญาและมีหลักประกัน ความเสี่ยงต่ำกว่าผู้ถือหุ้น
  - id: c
    text: ผู้ถือหุ้นกู้
    feedback: ผู้ถือหุ้นกู้ได้ดอกเบี้ยตามสัญญาและได้รับชำระก่อนผู้ถือหุ้นเมื่อเลิกกิจการ
  - id: d
    text: ผู้ถือหุ้นบุริมสิทธิ
    feedback: ได้รับเงินปันผลและเงินคืนก่อนผู้ถือหุ้นสามัญ
  hints:
  - ใครได้รับเงินเป็นลำดับสุดท้าย
  - ใครไม่มีผลตอบแทนที่สัญญาไว้แน่นอน
  solution: ผู้ถือหุ้นสามัญได้รับเงินปันผลเมื่อมีกำไรและบริษัทตัดสินใจจ่าย และได้คืนเป็นลำดับสุดท้ายเมื่อเลิกกิจการ จึงเสี่ยงที่สุดและต้องการผลตอบแทนสูงที่สุด ต้นทุนส่วนของเจ้าของจึงสูงกว่าต้นทุนหนี้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.sources-of-funds.p003
  topics:
  - business.finance.sources-of-funds
  difficulty: 2
  type: numeric
  stem: บริษัทกู้ธนาคารดอกเบี้ย $6\%$ ต่อปี อัตราภาษีเงินได้นิติบุคคล $20\%$ ต้นทุนหนี้หลังภาษีเป็นกี่เปอร์เซ็นต์
  answer:
    value: 4.8
    tolerance: 0.01
    unit: '%'
  misconceptions:
  - match: 6
    feedback: ยังไม่หักผลประหยัดภาษี
  - match: 1.2
    feedback: นั่นคือส่วนที่ประหยัดภาษี ไม่ใช่ต้นทุนหลังภาษี
  hints:
  - ดอกเบี้ยหักเป็นค่าใช้จ่ายทางภาษีได้ จึงประหยัดภาษี
  - $k_d(1 - t) = 6\% \times (1 - 0.2)$
  solution: $6\% \times 0.8 = 4.8\%$ ทุก 100 บาทของดอกเบี้ย ประหยัดภาษีได้ 20 บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.sources-of-funds.p004
  topics:
  - business.finance.sources-of-funds
  difficulty: 2
  type: mcq
  stem: ข้อใดเปรียบเทียบเงินกู้กับการออกหุ้นสามัญได้ **ถูกต้อง**
  choices:
  - id: a
    text: ดอกเบี้ยต้องจ่ายตามสัญญาและหักภาษีได้ ส่วนเงินปันผลไม่บังคับจ่ายและหักภาษีไม่ได้
    correct: true
  - id: b
    text: การออกหุ้นสามัญไม่มีต้นทุน เพราะไม่ต้องจ่ายดอกเบี้ย
    feedback: ผู้ถือหุ้นคาดหวังผลตอบแทน และผู้ถือหุ้นเดิมถูกลดสัดส่วนความเป็นเจ้าของ ต้นทุนส่วนของเจ้าของจึงสูงกว่าหนี้
  - id: c
    text: เงินกู้ทำให้ผู้ให้กู้มีสิทธิออกเสียงในที่ประชุมผู้ถือหุ้น
    feedback: เจ้าหนี้ไม่มีสิทธิออกเสียง แต่อาจกำหนดเงื่อนไขในสัญญากู้
  - id: d
    text: หนี้มากขึ้นทำให้ความเสี่ยงของบริษัทลดลง
    feedback: ภาระดอกเบี้ยคงที่ทำให้ความเสี่ยงทางการเงินสูงขึ้น
  hints:
  - คิดถึงภาระที่ต้องจ่ายและผลทางภาษี
  - ผู้ถือหุ้นใหม่ได้อะไร
  solution: หนี้มีภาระจ่ายแน่นอน ดอกเบี้ยหักภาษีได้ ไม่ลดสัดส่วนความเป็นเจ้าของ แต่เพิ่มความเสี่ยง หุ้นสามัญไม่มีภาระจ่ายแน่นอน แต่ต้นทุนสูงกว่าและผู้ถือหุ้นเดิมถูกลดสัดส่วน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.sources-of-funds.p005
  topics:
  - business.finance.sources-of-funds
  difficulty: 2
  type: order
  stem: เรียงลำดับสิทธิได้รับชำระคืนเมื่อบริษัทเลิกกิจการ จาก **ได้ก่อน** ไป **ได้หลัง**
  items:
  - เจ้าหนี้ที่มีหลักประกัน
  - ผู้ถือหุ้นกู้ที่ไม่มีหลักประกัน
  - ผู้ถือหุ้นบุริมสิทธิ
  - ผู้ถือหุ้นสามัญ
  hints:
  - เจ้าหนี้ได้ก่อนเจ้าของเสมอ
  - ในกลุ่มเจ้าหนี้ ผู้มีหลักประกันได้ก่อน
  solution: เจ้าหนี้มีหลักประกัน → เจ้าหนี้ไม่มีหลักประกัน (หุ้นกู้) → ผู้ถือหุ้นบุริมสิทธิ → ผู้ถือหุ้นสามัญ ยิ่งได้หลัง ยิ่งเสี่ยง และยิ่งต้องการผลตอบแทนสูง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.sources-of-funds.p006
  topics:
  - business.finance.sources-of-funds
  difficulty: 3
  type: numeric
  stem: 'ใช้แบบจำลอง CAPM: อัตราผลตอบแทนพันธบัตรรัฐบาล (ไม่มีความเสี่ยง) $2.5\%$ ผลตอบแทนตลาดที่คาด $8\%$ เบตาของหุ้นบริษัท $1.2$ ต้นทุนส่วนของผู้ถือหุ้นเป็นกี่เปอร์เซ็นต์'
  answer:
    value: 9.1
    tolerance: 0.02
    unit: '%'
  misconceptions:
  - match: 9.6
    feedback: คูณเบตากับผลตอบแทนตลาดทั้งหมด ลืมหักอัตราไม่มีความเสี่ยง
  - match: 12.1
    feedback: ใช้ $r_m$ แทน $r_m - r_f$
  hints:
  - $k_e = r_f + \beta(r_m - r_f)$
  - ส่วนชดเชยความเสี่ยงตลาด $= 8 - 2.5 = 5.5\%$
  solution: $k_e = 2.5 + 1.2 \times 5.5 = 9.1\%$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.sources-of-funds.p007
  topics:
  - business.finance.sources-of-funds
  difficulty: 3
  type: numeric
  stem: หุ้นบริษัทสมมติราคา $40$ บาท คาดว่าจ่ายเงินปันผลปีหน้า $D_1 = 2$ บาท และเงินปันผลโตคงที่ $4\%$ ต่อปี ใช้แบบจำลองการเติบโตของเงินปันผล (กอร์ดอน) ต้นทุนส่วนของผู้ถือหุ้นเป็นกี่เปอร์เซ็นต์
  answer:
    value: 9.0
    tolerance: 0.02
    unit: '%'
  misconceptions:
  - match: 5
    feedback: ลืมบวกอัตราการเติบโต
  - match: 9.2
    feedback: คูณ $D_1$ ด้วย $1 + g$ อีกครั้ง $D_1$ เป็นเงินปันผลปีหน้าอยู่แล้ว
  hints:
  - $k_e = \dfrac{D_1}{P_0} + g$
  - อัตราผลตอบแทนจากเงินปันผล $= 2 / 40 = 5\%$
  solution: $k_e = 5\% + 4\% = 9\%$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.sources-of-funds.p008
  topics:
  - business.finance.sources-of-funds
  difficulty: 3
  type: numeric
  stem: หุ้นกู้มูลค่าที่ตราไว้ $1{,}000$ บาท ดอกเบี้ยหน้าตั๋ว $4\%$ จ่ายปีละครั้ง ครบกำหนด 5 ปี ถ้าอัตราผลตอบแทนในตลาดสำหรับหุ้นกู้ความเสี่ยงเดียวกันเป็น $5\%$ ราคาที่เหมาะสมเป็นกี่บาท (ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 956.705233
    tolerance: 0.5
    unit: บาท
  misconceptions:
  - match: 1000
    feedback: คิดลดด้วย 4% เท่ากับดอกเบี้ยหน้าตั๋ว ได้ราคาที่ตราไว้
  - match: 1200
    feedback: รวมเงินโดยไม่คิดลด
  hints:
  - ราคา = PV ของดอกเบี้ยรายปี $40$ บาท 5 งวด + PV ของเงินต้น $1{,}000$ ปีที่ 5
  - คิดลดด้วยอัตราตลาด $5\%$ ไม่ใช่ $4\%$
  solution: PV ดอกเบี้ย $= 40 \times \dfrac{1 - 1.05^{-5}}{0.05} \approx 173.18$ PV เงินต้น $= 1{,}000 / 1.05^5 \approx 783.53$ ราคา $\approx 956.71$ บาท ต่ำกว่าราคาที่ตราไว้ เพราะดอกเบี้ยหน้าตั๋วต่ำกว่าอัตราตลาด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.sources-of-funds.p009
  topics:
  - business.finance.sources-of-funds
  difficulty: 3
  type: mcq
  stem: ถ้าอัตราดอกเบี้ยในตลาดสูงขึ้น ราคาของหุ้นกู้หรือพันธบัตรที่ออกไปแล้วและจ่ายดอกเบี้ยคงที่จะเป็นอย่างไร
  choices:
  - id: a
    text: ลดลง เพราะดอกเบี้ยคงที่เดิมด้อยกว่าตราสารใหม่ และกระแสเงินสดถูกคิดลดด้วยอัตราที่สูงขึ้น
    correct: true
  - id: b
    text: สูงขึ้น เพราะดอกเบี้ยสูงขึ้น
    feedback: ดอกเบี้ยหน้าตั๋วของตราสารเดิมไม่เปลี่ยน ที่สูงขึ้นคืออัตราที่ใช้คิดลด
  - id: c
    text: ไม่เปลี่ยน เพราะยังได้เงินต้นคืนเท่าเดิม
    feedback: ถ้าขายก่อนครบกำหนด ราคาขึ้นกับอัตราตลาด
  - id: d
    text: ลดลงเฉพาะพันธบัตรรัฐบาล ไม่เกี่ยวกับหุ้นกู้เอกชน
    feedback: ตราสารหนี้อัตราคงที่ทุกประเภทมีความสัมพันธ์ผกผันกับอัตราตลาด
  hints:
  - ราคา = มูลค่าปัจจุบันของกระแสเงินสด
  - อัตราคิดลดสูงขึ้น มูลค่าปัจจุบันเป็นอย่างไร
  solution: ราคาตราสารหนี้แปรผกผันกับอัตราดอกเบี้ยตลาด นี่คือความเสี่ยงจากอัตราดอกเบี้ยของผู้ถือตราสารหนี้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.sources-of-funds.p010
  topics:
  - business.finance.sources-of-funds
  difficulty: 3
  type: numeric
  stem: หุ้นบุริมสิทธิจ่ายเงินปันผลคงที่ปีละ $5$ บาท ราคาตลาด $62.50$ บาท ต้นทุนหุ้นบุริมสิทธิเป็นกี่เปอร์เซ็นต์
  answer:
    value: 8.0
    tolerance: 0.01
    unit: '%'
  misconceptions:
  - match: 12.5
    feedback: กลับเศษกับส่วน
  - match: 6.4
    feedback: หักภาษี แต่เงินปันผลไม่ใช่ค่าใช้จ่ายทางภาษี
  hints:
  - $k_p = \dfrac{D_p}{P_p}$
  - เงินปันผลบุริมสิทธิไม่หักภาษี
  solution: $k_p = 5 / 62.5 = 8\%$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.sources-of-funds.p011
  topics:
  - business.finance.sources-of-funds
  difficulty: 4
  type: numeric
  stem: จากภาพโครงสร้างเงินทุนของบริษัท ก (สมมติ) จงหาต้นทุนเงินทุนถัวเฉลี่ยถ่วงน้ำหนัก (WACC) เป็นกี่เปอร์เซ็นต์
  answer:
    value: 7.92
    tolerance: 0.02
    unit: '%'
  misconceptions:
  - match: 8.4
    feedback: ลืมหักภาษีของต้นทุนหนี้
  - match: 8
    feedback: เฉลี่ยแบบไม่ถ่วงน้ำหนัก (10 + 6)/2
  figure:
    src: p-structure.svg
    alt: โครงสร้างเงินทุนของบริษัท ก (สมมติ) ตามมูลค่าตลาด ส่วนของผู้ถือหุ้น 60 ล้านบาท ผลตอบแทนที่ต้องการ 10% หนี้ 40 ล้านบาท ดอกเบี้ย 6% ต่อปี อัตราภาษีเงินได้นิติบุคคล 20% ดอกเบี้ยหักเป็นค่าใช้จ่ายทางภาษีได้
  hints:
  - 'น้ำหนัก: ส่วนของผู้ถือหุ้น $60/100$ หนี้ $40/100$'
  - WACC $= w_e k_e + w_d k_d(1 - t)$
  solution: WACC $= 0.6(10\%) + 0.4(6\%)(0.8) = 6\% + 1.92\% = 7.92\%$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.sources-of-funds.p012
  topics:
  - business.finance.sources-of-funds
  difficulty: 4
  type: numeric
  stem: ผู้ขายวัตถุดิบเสนอเงื่อนไข 2/10, net 30 (จ่ายภายใน 10 วันลด 2% มิฉะนั้นจ่ายเต็มภายใน 30 วัน) ถ้าไม่รับส่วนลดและจ่ายวันที่ 30 ต้นทุนของเครดิตการค้านี้คิดเป็นอัตราต่อปีประมาณกี่เปอร์เซ็นต์ (ใช้ $\dfrac{2}{98} \times \dfrac{365}{20}$ ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 37.244898
    tolerance: 0.05
    unit: '%'
  misconceptions:
  - match: 2
    feedback: นั่นคือส่วนลดต่อครั้ง ยังไม่แปลงเป็นต่อปี
  - match: 24.333333
    feedback: ใช้ 100 และ 30 วัน ส่วนที่ยืมจริงคือ 98 บาท นาน 20 วัน
  hints:
  - การไม่รับส่วนลดเท่ากับยืมเงิน 98 บาทนาน 20 วัน โดยจ่ายดอกเบี้ย 2 บาท
  - 'แปลงเป็นต่อปี: คูณ $365 / 20$'
  solution: $\dfrac{2}{98} \times \dfrac{365}{20} \approx 37.24\%$ ต่อปี สูงกว่าดอกเบี้ย OD ทั่วไปมาก ถ้ากู้ระยะสั้นได้ถูกกว่า ควรกู้มาจ่ายเพื่อรับส่วนลด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.sources-of-funds.p013
  topics:
  - business.finance.sources-of-funds
  difficulty: 4
  type: mcq
  stem: โรงงานในชลบุรี (สมมติ) จะซื้อเครื่องจักรอายุใช้งาน 10 ปี ควรจัดหาเงินจากแหล่งใดตามหลักการจับคู่ระยะเวลา
  choices:
  - id: a
    text: เงินกู้ระยะยาวหรือหุ้นกู้ ร่วมกับส่วนของเจ้าของ
    correct: true
  - id: b
    text: เงินเบิกเกินบัญชี (OD) ทั้งหมด
    feedback: OD เป็นหนี้ระยะสั้นที่ธนาคารเรียกคืนหรือปรับดอกเบี้ยได้ ใช้กับสินทรัพย์ 10 ปีเสี่ยงขาดสภาพคล่อง
  - id: c
    text: เครดิตการค้าจากผู้ขายวัตถุดิบ
    feedback: เครดิตการค้ามีอายุเพียงไม่กี่สิบวัน เหมาะกับเงินทุนหมุนเวียน
  - id: d
    text: ยืดการจ่ายเงินเดือนพนักงาน
    feedback: ไม่ใช่แหล่งเงินทุนที่ถูกกฎหมายและเหมาะสม
  hints:
  - สินทรัพย์ระยะยาวควรใช้เงินทุนระยะยาว
  - เงินทุนหมุนเวียนใช้แหล่งระยะสั้น
  solution: 'หลักการจับคู่: สินทรัพย์ที่ให้ประโยชน์นานควรใช้แหล่งเงินทุนระยะยาว ส่วนความต้องการเงินทุนหมุนเวียนตามฤดูกาลใช้แหล่งระยะสั้น ช่วยลดความเสี่ยงที่ต้องหาเงินมาคืนก่อนสินทรัพย์สร้างกระแสเงินสด'
