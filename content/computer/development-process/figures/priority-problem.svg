<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" font-family="sans-serif" font-size="14">
  <title>ตารางสองแกนว่าง มีความเห็น P Q R S วางตามผลต่อผู้ใช้และแรงที่ต้องใช้</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="640" height="430" fill="#ffffff"/>
  <rect x="90.0" y="30.0" width="250.0" height="165.0" rx="0" fill="#f3f4f6" stroke="#4b5563" stroke-width="1"/>
  <rect x="340.0" y="30.0" width="250.0" height="165.0" rx="0" fill="#f3f4f6" stroke="#4b5563" stroke-width="1"/>
  <rect x="90.0" y="195.0" width="250.0" height="165.0" rx="0" fill="#f3f4f6" stroke="#4b5563" stroke-width="1"/>
  <rect x="340.0" y="195.0" width="250.0" height="165.0" rx="0" fill="#f3f4f6" stroke="#4b5563" stroke-width="1"/>
  <line x1="90.0" y1="360.0" x2="610.0" y2="360.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="90.0" y1="360.0" x2="90.0" y2="18.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="340.0" y="390.0" font-size="14" text-anchor="middle" fill="#6b7280" xml:space="preserve">แรงที่ต้องใช้  →  มาก</text>
  <text x="90.0" y="390.0" font-size="13" text-anchor="middle" fill="#6b7280" xml:space="preserve">น้อย</text>
  <text x="30" y="195.0" font-size="14" fill="#6b7280" text-anchor="middle" transform="rotate(-90 30 195.0)">ผลต่อผู้ใช้  →  มาก</text>
  <circle cx="200.0" cy="112.5" r="15.0" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="200.0" y="117.5" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">P</text>
  <text x="200.0" y="148.5" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">ยอดรวมรายเมนูให้แม่ค้า</text>
  <circle cx="470.0" cy="102.6" r="15.0" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="470.0" y="107.6" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">Q</text>
  <text x="470.0" y="138.6" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">แจ้งเตือนผ่านแอปแชท</text>
  <circle cx="210.0" cy="287.4" r="15.0" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="210.0" y="292.4" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">R</text>
  <text x="210.0" y="323.4" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">อีโมจิในเมนู</text>
  <circle cx="470.0" cy="294.0" r="15.0" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="470.0" y="299.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">S</text>
  <text x="470.0" y="330.0" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">เปลี่ยนเป็นแอปเฉพาะระบบ</text>
</svg>
