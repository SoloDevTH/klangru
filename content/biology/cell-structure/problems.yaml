problems:
  - id: biology.cells.cell-structure.p001
    topics: [biology.cells.cell-structure]
    difficulty: 1
    type: numeric
    stem: "นักเรียนใช้เลนส์ใกล้ตากำลังขยาย 10 เท่า และเลนส์ใกล้วัตถุกำลังขยาย 40 เท่า ภาพที่เห็นมีกำลังขยายรวมกี่เท่า"
    answer: { value: 400, unit: เท่า }
    hints:
      - "กำลังขยายรวมได้จากกำลังขยายของเลนส์ทั้งสอง"
      - "นำกำลังขยายทั้งสองมาคูณกัน"
    misconceptions:
      - { match: 50, feedback: "นำกำลังขยายมาบวกกัน เลนส์ใกล้วัตถุขยายภาพก่อน แล้วเลนส์ใกล้ตาขยายภาพนั้นอีก จึงต้องคูณ" }
      - { match: 4, feedback: "นำมาหารกัน กำลังขยายรวมคือผลคูณของเลนส์ทั้งสอง" }
    solution: "กำลังขยายรวม $= 10 \\times 40 = 400$ เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-structure.p002
    topics: [biology.cells.cell-structure]
    difficulty: 1
    type: match
    stem: "จับคู่ออร์แกเนลล์กับหน้าที่"
    pairs:
      - { left: "ไมโทคอนเดรีย", right: "หายใจระดับเซลล์ สร้าง ATP" }
      - { left: "คลอโรพลาสต์", right: "สังเคราะห์ด้วยแสง" }
      - { left: "ไรโบโซม", right: "สร้างโปรตีน" }
      - { left: "ไลโซโซม", right: "ย่อยสลายสารและออร์แกเนลล์ที่เสื่อม" }
      - { left: "นิวเคลียส", right: "เก็บ DNA และควบคุมการทำงานของเซลล์" }
    hints:
      - "ออร์แกเนลล์ที่มีสีเขียวพบในพืช"
      - "ไลโซโซมมีเอนไซม์ย่อยอยู่ข้างใน"
    solution: "ไมโทคอนเดรีย → หายใจระดับเซลล์, คลอโรพลาสต์ → สังเคราะห์ด้วยแสง, ไรโบโซม → สร้างโปรตีน, ไลโซโซม → ย่อยสลาย, นิวเคลียส → เก็บ DNA และควบคุมเซลล์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-structure.p003
    topics: [biology.cells.cell-structure]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "โครงสร้างใดพบในเซลล์ใบสาหร่ายหางกระรอก แต่ไม่พบในเซลล์เยื่อบุข้างแก้มของคน (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ผนังเซลล์", correct: true }
      - { id: b, text: "คลอโรพลาสต์", correct: true }
      - { id: c, text: "แวคิวโอลขนาดใหญ่", correct: true }
      - { id: d, text: "ไมโทคอนเดรีย", feedback: "ทั้งเซลล์พืชและเซลล์สัตว์มีไมโทคอนเดรีย เพราะทั้งสองต้องหายใจระดับเซลล์" }
      - { id: e, text: "เยื่อหุ้มเซลล์", feedback: "ทุกเซลล์มีเยื่อหุ้มเซลล์ เซลล์พืชมีเยื่อหุ้มเซลล์อยู่ด้านในผนังเซลล์" }
    hints:
      - "สาหร่ายหางกระรอกเป็นพืช เซลล์เยื่อบุข้างแก้มเป็นเซลล์สัตว์"
      - "หาโครงสร้างที่เกี่ยวกับการสร้างอาหาร ความแข็งแรง และการเก็บน้ำของพืช"
    solution: "เซลล์พืชมีผนังเซลล์ คลอโรพลาสต์ และแวคิวโอลขนาดใหญ่ ซึ่งเซลล์สัตว์ไม่มี ส่วนไมโทคอนเดรียและเยื่อหุ้มเซลล์พบในทั้งสองชนิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-structure.p004
    topics: [biology.cells.cell-structure]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการใช้กล้องจุลทรรศน์ดูสไลด์เซลล์หอมหัวใหญ่ให้ถูกต้อง"
    items:
      - "หมุนเลนส์ใกล้วัตถุกำลังขยายต่ำสุดเข้าตรงลำกล้อง เปิดไฟ"
      - "วางสไลด์บนแท่นและใช้ที่หนีบยึด"
      - "มองด้านข้าง หมุนปุ่มปรับภาพหยาบให้เลนส์ใกล้สไลด์"
      - "มองผ่านเลนส์ใกล้ตา หมุนปุ่มปรับภาพหยาบให้เลนส์ห่างออกจนเห็นภาพ"
      - "เปลี่ยนเป็นกำลังขยายสูงแล้วใช้ปุ่มปรับภาพละเอียด"
    hints:
      - "เริ่มจากกำลังขยายต่ำเสมอ"
      - "ปุ่มปรับภาพหยาบใช้ก่อนที่กำลังขยายต่ำ ปุ่มปรับภาพละเอียดใช้ที่กำลังขยายสูง"
    solution: "เลนส์กำลังขยายต่ำและเปิดไฟ → วางสไลด์ → มองด้านข้างแล้วลดระยะเลนส์ → มองผ่านเลนส์ใกล้ตาแล้วปรับภาพหยาบ → เปลี่ยนกำลังขยายสูงและปรับภาพละเอียด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-structure.p005
    topics: [biology.cells.cell-structure]
    difficulty: 2
    type: mcq
    stem: "นักเรียนตัดตัวอักษร F จากหนังสือพิมพ์มาทำสไลด์ วางให้อ่านได้ตามปกติ เมื่อดูผ่านกล้องจุลทรรศน์ใช้แสงจะเห็นภาพเป็นอย่างไร"
    choices:
      - { id: a, text: "F กลับหัวและกลับซ้ายขวา (หมุนไปครึ่งรอบ)", correct: true }
      - { id: b, text: "F ตามปกติ", feedback: "เลนส์ของกล้องจุลทรรศน์ใช้แสงทำให้ภาพกลับทั้งบนล่างและซ้ายขวา" }
      - { id: c, text: "F กลับซ้ายขวาอย่างเดียว เหมือนส่องกระจก", feedback: "ภาพกลับทั้งบนล่างด้วย ไม่ได้กลับแค่ซ้ายขวา" }
      - { id: d, text: "F กลับหัวอย่างเดียว", feedback: "ภาพกลับทั้งบนล่างและซ้ายขวา จึงเหมือนหมุนตัวอักษรไปครึ่งรอบ" }
    hints:
      - "ภาพจากกล้องจุลทรรศน์ใช้แสงกลับกี่ทิศ"
      - "ลองหมุนกระดาษที่เขียน F ไปครึ่งรอบ"
    solution: "ภาพที่เห็นกลับหัวและกลับซ้ายขวา เท่ากับหมุนตัวอักษร F ไป 180 องศา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-structure.p006
    topics: [biology.cells.cell-structure]
    difficulty: 2
    type: text
    stem: "ส่วนที่ห่อหุ้มเซลล์ทุกชนิด เป็นฟอสโฟลิพิดสองชั้นที่มีโปรตีนแทรก และควบคุมการผ่านเข้าออกของสาร เรียกว่าอะไร"
    accepted: ["เยื่อหุ้มเซลล์", "cell membrane", "plasma membrane"]
    hints:
      - "เซลล์สัตว์ไม่มีผนังเซลล์ แต่มีส่วนนี้"
      - "ส่วนนี้ยอมให้สารบางชนิดผ่านเท่านั้น"
    misconceptions:
      - { match: "ผนังเซลล์", feedback: "ผนังเซลล์พบเฉพาะในพืช เห็ดรา และแบคทีเรีย และสารผ่านได้เกือบทั้งหมด ส่วนที่มีในทุกเซลล์และคัดเลือกสารคือเยื่อหุ้มเซลล์" }
      - { match: "เยื่อหุ้มนิวเคลียส", feedback: "เยื่อหุ้มนิวเคลียสห่อหุ้มนิวเคลียส ไม่ใช่ทั้งเซลล์ และไม่มีในแบคทีเรีย" }
    solution: "เยื่อหุ้มเซลล์ เป็นฟอสโฟลิพิดสองชั้นที่มีโปรตีนแทรก (แบบจำลองฟลูอิดโมเซก) ยอมให้บางสารผ่าน จึงควบคุมสารที่เข้าออกเซลล์ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-structure.p007
    topics: [biology.cells.cell-structure]
    difficulty: 3
    type: numeric
    stem: "ที่กำลังขยาย 40 เท่า วงกลมที่มองเห็นกว้าง 4.5 มิลลิเมตร ถ้าเปลี่ยนเป็นกำลังขยาย 400 เท่า วงกลมที่มองเห็นจะกว้างกี่มิลลิเมตร"
    answer: { value: 0.45, tolerance: 0.01, unit: mm }
    hints:
      - "กำลังขยายเพิ่มขึ้นกี่เท่า"
      - "ยิ่งขยายมาก ยิ่งเห็นพื้นที่น้อยลง ให้หารด้วยจำนวนเท่าที่เพิ่ม"
    misconceptions:
      - { match: 45, feedback: "คูณด้วย 10 แต่กำลังขยายสูงขึ้นทำให้เห็นพื้นที่แคบลง ต้องหารด้วย 10" }
      - { match: 4.5, feedback: "วงกลมที่มองเห็นไม่ได้กว้างเท่าเดิม เมื่อขยายมากขึ้นจะเห็นพื้นที่แคบลง" }
    solution: "กำลังขยายเพิ่ม $\\frac{400}{40} = 10$ เท่า วงกลมที่มองเห็นจึงแคบลง 10 เท่า $\\frac{4.5}{10} = 0.45$ มิลลิเมตร ($450\\ \\mu\\mathrm{m}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-structure.p008
    topics: [biology.cells.cell-structure]
    difficulty: 3
    type: numeric
    stem: "ที่กำลังขยาย 400 เท่า วงกลมที่มองเห็นกว้าง 450 ไมโครเมตร นักเรียนเห็นเซลล์เยื่อบุข้างแก้มเรียงตามเส้นผ่านศูนย์กลางดังภาพ เซลล์หนึ่งกว้างประมาณกี่ไมโครเมตร (ตอบทศนิยม 2 ตำแหน่ง)"
    figure: { src: field-of-view.svg, alt: "วงกลมที่มองเห็นผ่านกล้อง มีเส้นสีแดงบอกเส้นผ่านศูนย์กลาง ตามแนวเส้นผ่านศูนย์กลางมีเซลล์เยื่อบุข้างแก้มเรียงชิดกันพอดีจากขอบถึงขอบ 8 เซลล์ แต่ละเซลล์มีนิวเคลียสเป็นจุดสีเข้ม เหนือและใต้แถวมีเซลล์อื่นกระจายอยู่" }
    answer: { value: 56.25, tolerance: 0.5, unit: µm }
    hints:
      - "นับจำนวนเซลล์ที่เรียงพอดีเส้นผ่านศูนย์กลาง"
      - "นำความกว้างของวงกลมหารด้วยจำนวนเซลล์"
    misconceptions:
      - { match: 3600, feedback: "นำ 450 คูณจำนวนเซลล์ ต้องหาร เพราะเซลล์ 8 เซลล์รวมกันยาวเท่ากับวงกลม" }
      - { match: 0.05625, feedback: "นี่คือคำตอบในหน่วยมิลลิเมตร โจทย์ให้ตอบเป็นไมโครเมตร" }
    solution: "มีเซลล์เรียงพอดีเส้นผ่านศูนย์กลาง 8 เซลล์ เซลล์หนึ่งกว้าง $\\frac{450}{8} = 56.25\\ \\mu\\mathrm{m}$ ซึ่งใกล้กับขนาดจริงของเซลล์เยื่อบุข้างแก้มราว 50–60 ไมโครเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-structure.p009
    topics: [biology.cells.cell-structure]
    difficulty: 3
    type: mcq
    stem: "ขณะทำสไลด์เยื่อหอมหัวใหญ่ ทำไมจึงต้องค่อย ๆ วางกระจกปิดสไลด์โดยเอียงทำมุมประมาณ 45 องศากับสไลด์"
    choices:
      - { id: a, text: "เพื่อไล่อากาศออก ไม่ให้เกิดฟองอากาศบังเซลล์", correct: true }
      - { id: b, text: "เพื่อให้เซลล์ติดสีย้อมเร็วขึ้น", feedback: "การติดสีขึ้นกับสีย้อมและเวลา ไม่ได้ขึ้นกับมุมที่วางกระจกปิดสไลด์" }
      - { id: c, text: "เพื่อให้ภาพไม่กลับหัว", feedback: "ภาพกลับหัวเพราะเลนส์ของกล้อง การวางกระจกปิดสไลด์แก้ไม่ได้" }
      - { id: d, text: "เพื่อให้กำลังขยายเพิ่มขึ้น", feedback: "กำลังขยายขึ้นกับเลนส์ ไม่ได้ขึ้นกับการวางกระจกปิดสไลด์" }
    hints:
      - "ถ้าวางกระจกลงตรง ๆ ทั้งแผ่น อะไรจะติดอยู่ใต้กระจก"
      - "ฟองอากาศดูเป็นวงกลมขอบดำในกล้อง"
    solution: "การค่อย ๆ ลดกระจกปิดสไลด์จากด้านหนึ่งช่วยไล่อากาศออกไปทางอีกด้าน ไม่เกิดฟองอากาศที่บังหรือถูกเข้าใจผิดว่าเป็นเซลล์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-structure.p010
    topics: [biology.cells.cell-structure]
    difficulty: 3
    type: mcq
    stem: "นักเรียนส่องน้ำจากบ่อปลาในโรงเรียน เห็นพารามีเซียมอยู่ทางขวาบนของวงกลมที่มองเห็น ต้องเลื่อนสไลด์ไปทางใดเพื่อให้พารามีเซียมมาอยู่กลางวง"
    choices:
      - { id: a, text: "ไปทางขวาบน", correct: true }
      - { id: b, text: "ไปทางซ้ายล่าง", feedback: "ภาพกลับทั้งบนล่างและซ้ายขวา เมื่อเลื่อนสไลด์ไปทางซ้ายล่าง ภาพจะเคลื่อนไปทางขวาบน ออกห่างจากกลางวงยิ่งขึ้น" }
      - { id: c, text: "ไปทางซ้ายบน", feedback: "ต้องเลื่อนไปทางเดียวกับที่ภาพอยู่ทั้งแนวตั้งและแนวนอน คือขวาบน" }
      - { id: d, text: "ไม่ต้องเลื่อน ใช้ปุ่มปรับภาพละเอียดแทน", feedback: "ปุ่มปรับภาพละเอียดปรับความคมชัด ไม่ได้ย้ายตำแหน่งภาพ" }
    hints:
      - "ภาพกลับทั้งบนล่างและซ้ายขวา เมื่อเลื่อนสไลด์ไปทางหนึ่ง ภาพจะเคลื่อนไปทางตรงข้าม"
      - "อยากให้ภาพเคลื่อนไปทางซ้ายล่าง ต้องเลื่อนสไลด์ไปทางใด"
    solution: "ภาพอยู่ขวาบน ต้องการให้ภาพเคลื่อนไปทางซ้ายล่าง เนื่องจากภาพเคลื่อนตรงข้ามกับสไลด์ จึงต้องเลื่อนสไลด์ไปทางขวาบน สรุปง่าย ๆ คือ เลื่อนสไลด์ไปทางเดียวกับที่ภาพอยู่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-structure.p011
    topics: [biology.cells.cell-structure]
    difficulty: 4
    type: mcq
    stem: "ข้อใดเปรียบเทียบเซลล์แบคทีเรียกับเซลล์ใบพืชได้ถูกต้อง"
    choices:
      - { id: a, text: "ทั้งสองมีเยื่อหุ้มเซลล์ ผนังเซลล์ และไรโบโซม แต่แบคทีเรียไม่มีเยื่อหุ้มนิวเคลียสและไม่มีคลอโรพลาสต์หรือไมโทคอนเดรีย", correct: true }
      - { id: b, text: "แบคทีเรียไม่มี DNA เพราะไม่มีนิวเคลียส", feedback: "แบคทีเรียมี DNA อยู่ในไซโทพลาซึมบริเวณนิวคลีออยด์ เพียงแต่ไม่มีเยื่อหุ้มนิวเคลียส" }
