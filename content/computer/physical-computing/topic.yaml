id: computer.systems.physical-computing
subject: computer
title: { th: ระบบสมองกลฝังตัวและอุปกรณ์ที่เก็บและส่งข้อมูล, en: "Embedded systems and devices that collect and exchange data" }
summary: ไมโครคอนโทรลเลอร์ เซนเซอร์และตัวขับเคลื่อน การปรับเทียบค่าจาก ADC โปรแกรมวงวนอ่านค่า ตัดสินใจ และส่งข้อมูลผ่านเครือข่าย และนามธรรมที่ซ่อนรายละเอียดของคอมพิวเตอร์ในสิ่งของรอบตัว
difficulty: 4.5
minutes: 45
prerequisites: [computer.systems.computer-systems, computer.programming.functions]
encompasses:
  - { id: computer.systems.computer-systems, weight: 0.3 }
  - { id: computer.programming.functions, weight: 0.2 }
  - { id: computer.programming.basics, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: system.svg
    alt: "แผนภาพระบบรดน้ำอัตโนมัติ คอลัมน์รับเข้ามีเซนเซอร์ความชื้นในดินและปุ่มรดน้ำทันที ลูกศรป้ายว่าแรงดันชี้ไปที่ไมโครคอนโทรลเลอร์ตรงกลาง ซึ่งอ่านค่า ตัดสินใจ และสั่งงาน ลูกศรป้ายว่าคำสั่งชี้ไปทางขวาที่คอลัมน์ส่งออก คือรีเลย์กับปั๊มน้ำ (ตัวขับเคลื่อน) และ LED แสดงสถานะ ด้านล่างไมโครคอนโทรลเลอร์มีลูกศรลงไปที่โมดูล Wi-Fi ซึ่งส่งข้อความ moisture 42 ต่อไปที่เซิร์ฟเวอร์หรือคลาวด์ แล้วไปเป็นกราฟบนโทรศัพท์"
    caption: "รับเข้า ประมวลผล ส่งออก และส่งข้อมูลออกไปทางเครือข่าย"
  - type: worked-example
    title: ปรับเทียบเซนเซอร์แล้วตัดสินใจรดน้ำ
    problem: "เซนเซอร์ความชื้นดินต่อกับ ADC 10 บิต ปรับเทียบได้ค่าแห้ง 800 และค่าเปียก 300 ระบบเปิดปั๊มเมื่อความชื้นต่ำกว่า 30% ถ้าอ่านค่าดิบได้ 700, 520 และ 350 ตามลำดับ แต่ละครั้งความชื้นเท่าไรและต้องเปิดปั๊มหรือไม่"
    steps:
      - text: "เขียนสูตรเป็นฟังก์ชัน: `def to_percent(raw, dry=800, wet=300): return (dry - raw) / (dry - wet) * 100`"
        why: "ค่าดิบ 0–1023 ไม่มีหน่วย และเซนเซอร์แต่ละตัวให้ค่าต่างกัน การปรับเทียบด้วยค่าแห้งและค่าเปียกของตัวที่ใช้จริงทำให้แปลงเป็นเปอร์เซ็นต์ได้ถูก"
      - text: "700: (800 − 700) ÷ 500 × 100 = 20% ต่ำกว่า 30% จึงเปิดปั๊ม"
      - text: "520: (800 − 520) ÷ 500 × 100 = 56% ไม่ต่ำกว่า 30% ไม่ต้องเปิด"
      - text: "350: (800 − 350) ÷ 500 × 100 = 90% ดินชื้นมาก ไม่ต้องเปิด"
      - text: "ตรวจความสมเหตุสมผล: ค่าดิบยิ่งน้อยดินยิ่งชื้น 700 จึงแห้งที่สุด และ 350 ชื้นที่สุด ตรงกับผล"
        why: "ถ้าสลับลำดับในสูตรเป็น (raw − wet) ผลจะกลับทาง การเทียบกับความรู้เรื่องเซนเซอร์ช่วยจับข้อผิดพลาดนี้"
    answer: "ความชื้น 20%, 56% และ 90% เปิดปั๊มเฉพาะครั้งแรก"
  - { type: check, problem: computer.systems.physical-computing.p007, prompt: "ลองแปลงค่าดิบเป็นเปอร์เซ็นต์ด้วยค่าที่ปรับเทียบ" }
  - type: figure
    src: abstraction-layers.svg
    alt: "สี่ชั้นเรียงจากบนลงล่าง ชั้นผู้ใช้ กดปุ่มหุงแล้วรอไฟเปลี่ยนเป็นอุ่น ชั้นโปรแกรมหลัก t = read_temperature() ถ้า t มากกว่า 100 ลดไฟ ชั้นไลบรารีของบอร์ด สั่ง ADC อ่านแรงดันแล้วแปลงเป็นองศา ชั้นวงจรอิเล็กทรอนิกส์ เซนเซอร์เปลี่ยนความร้อนเป็นแรงดันไฟฟ้า ลูกศรด้านขวาชี้ลง บนสุดเขียนว่าซ่อนรายละเอียด ล่างสุดเขียนว่ารายละเอียดมากขึ้น ใต้ภาพเขียนว่าแต่ละชั้นเรียกใช้ชั้นล่างโดยไม่ต้องรู้ว่าชั้นนั้นทำงานอย่างไร"
    caption: "นามธรรมซ้อนเป็นชั้นในหม้อหุงข้าวดิจิทัล"
  - type: worked-example
    title: ออกแบบระบบนับคนเข้าห้องสมุดที่ส่งข้อมูลได้
    problem: "ห้องสมุดโรงเรียนอยากรู้ว่าช่วงเวลาใดมีคนเข้ามาก เพื่อจัดเวรบรรณารักษ์ ให้ออกแบบระบบที่รวมฮาร์ดแวร์และซอฟต์แวร์เพื่อเก็บและส่งข้อมูล"
    steps:
      - text: "กำหนดข้อมูลที่ต้องการ: จำนวนคนที่เดินเข้าในแต่ละชั่วโมง"
        why: "เริ่มจากคำถามของผู้ใช้ จึงรู้ว่าต้องวัดอะไร ละเอียดแค่ไหน และไม่ต้องเก็บข้อมูลเกินจำเป็น เช่น ไม่ต้องถ่ายภาพหน้าคน"
      - text: "เลือกฮาร์ดแวร์: เซนเซอร์อินฟราเรดหรืออัลตราโซนิกที่ประตู บอร์ดที่มี Wi-Fi และไฟเลี้ยงจากปลั๊กเพราะติดอยู่กับที่"
      - text: "ออกแบบซอฟต์แวร์บนบอร์ด: วงวนอ่านเซนเซอร์ นับเมื่อมีคนผ่าน (ค่าเปลี่ยนจากไม่มีเป็นมี) และเก็บยอดของแต่ละชั่วโมงในตัวแปร"
        why: "นับตอนสถานะเปลี่ยน ไม่ใช่ทุกรอบที่อ่านแล้วพบคน มิฉะนั้นคนที่ยืนที่ประตูนานจะถูกนับหลายครั้ง"
      - text: "ออกแบบการส่งข้อมูล: ทุกต้นชั่วโมงส่งข้อความ เช่น {\"hour\": 10, \"count\": 37} ไปยังตารางคำนวณออนไลน์ แล้วตั้งยอดเป็น 0"
      - text: "ทดสอบ: ให้เพื่อนเดินผ่าน 20 ครั้งแล้วเทียบกับยอดที่นับได้ ลองเดินพร้อมกันสองคนเพื่อดูข้อจำกัด แล้วปรับตำแหน่งเซนเซอร์"
    answer: "ระบบประกอบด้วยเซนเซอร์ที่ประตู บอร์ดที่นับเมื่อสถานะเปลี่ยนและสรุปยอดรายชั่วโมง และการส่งข้อมูลผ่าน Wi-Fi ไปยังตารางออนไลน์ ทดสอบกับการนับจริงก่อนใช้"
  - { type: check, problem: computer.systems.physical-computing.p010, prompt: "นับครั้งที่ระบบสั่งเปิดปั๊มด้วยเงื่อนไข m < 30" }
glossary:
  - { term: ระบบสมองกลฝังตัว (embedded system), definition: "คอมพิวเตอร์ที่ฝังอยู่ในสิ่งของเพื่อทำงานเฉพาะอย่าง เช่น หม้อหุงข้าว ไฟจราจร" }
  - { term: ไมโครคอนโทรลเลอร์ (microcontroller), definition: "ชิปเดียวที่รวมหน่วยประมวลผล หน่วยความจำ และขาเชื่อมต่อ ใช้ควบคุมอุปกรณ์" }
  - { term: เซนเซอร์ (sensor), definition: "อุปกรณ์ที่แปลงปริมาณทางกายภาพ เช่น อุณหภูมิ แสง ความชื้น เป็นสัญญาณไฟฟ้า" }
  - { term: ตัวขับเคลื่อน (actuator), definition: "อุปกรณ์ที่เปลี่ยนคำสั่งเป็นการกระทำ เช่น มอเตอร์ เซอร์โว รีเลย์ LED" }
  - { term: ตัวแปลงแอนะล็อกเป็นดิจิทัล (ADC), definition: "วงจรที่แปลงแรงดันไฟฟ้าเป็นตัวเลข ADC 10 บิตให้ค่า 0 ถึง 1023" }
  - { term: การปรับเทียบ (calibration), definition: "การวัดค่าที่รู้คำตอบ เช่น ดินแห้งและดินเปียก เพื่อแปลงค่าดิบเป็นหน่วยที่ถูกต้อง" }
  - { term: ฮิสเทอรีซิส (hysteresis), definition: "การใช้เกณฑ์เปิดและเกณฑ์ปิดต่างกัน เพื่อไม่ให้อุปกรณ์สลับสถานะถี่เมื่อค่าแกว่งรอบเกณฑ์" }
  - { term: อินเทอร์เน็ตของสรรพสิ่ง (IoT), definition: "การเชื่อมสิ่งของที่มีเซนเซอร์และคอมพิวเตอร์ฝังตัวเข้ากับอินเทอร์เน็ตเพื่อส่งและรับข้อมูล" }
flashcards:
  - { front: "เซนเซอร์กับตัวขับเคลื่อนต่างกันอย่างไร", back: "เซนเซอร์รับรู้และแปลงเป็นสัญญาณไฟฟ้า ตัวขับเคลื่อนเปลี่ยนคำสั่งเป็นการกระทำ" }
  - { front: "ADC 10 บิตให้ค่าช่วงใด", back: "0 ถึง 1023 (1024 ระดับ)" }
  - { front: "ทำไมต้องปรับเทียบเซนเซอร์", back: "ค่าดิบไม่มีหน่วยและต่างกันในแต่ละตัว ต้องเทียบกับค่าที่รู้คำตอบ" }
  - { front: "ระบบที่ใช้สองเกณฑ์ (ฮิสเทอรีซิส) ช่วยอะไร", back: "กันไม่ให้อุปกรณ์เปิดปิดถี่เมื่อค่าแกว่งรอบเกณฑ์" }
  - { front: "นามธรรมในอุปกรณ์รอบตัวคืออะไร", back: "การซ่อนรายละเอียดเป็นชั้น ผู้ใช้กดปุ่มโดยไม่ต้องรู้ว่าเซนเซอร์และโปรแกรมข้างในทำงานอย่างไร" }
