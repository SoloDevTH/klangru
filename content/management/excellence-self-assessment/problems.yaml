      - { id: b, text: "จำนวนครั้งที่ประชุมคณะกรรมการการเงิน", feedback: "เป็นกิจกรรมของกระบวนการ ไม่ใช่ผลลัพธ์ด้านความมั่นคงทางการเงิน" }
      - { id: c, text: "ยอดขายของเดือนที่ดีที่สุด", feedback: "เลือกเฉพาะเดือนที่ดีไม่บอกความมั่นคง และไม่มีแนวโน้มหรือการเปรียบเทียบ" }
      - { id: d, text: "จำนวนโครงการที่เสนอขอทุน", feedback: "เป็นกิจกรรม ไม่ได้บอกว่าองค์กรมีเงินรองรับช่วงวิกฤตหรือไม่" }
    hints:
      - "ความมั่นคงทางการเงินดูจากสภาพคล่องและเงินสำรอง"
      - "ผลลัพธ์ที่ดีมีแนวโน้มและการเปรียบเทียบ"
    solution: "จำนวนเดือนที่เงินสำรองรองรับได้บอกสภาพคล่องเมื่อรายได้หยุด และการแสดงแนวโน้มกับการเปรียบเทียบทำให้ประเมินด้วย LeTCI ได้"
