id: biology.cells.cell-basics
subject: biology
title: { th: เซลล์และการจัดระบบของสิ่งมีชีวิต, en: "Cells and levels of organisation" }
summary: สิ่งมีชีวิตประกอบด้วยเซลล์ การใช้กล้องจุลทรรศน์ใช้แสงดูเซลล์ โครงสร้างและหน้าที่ของเซลล์พืชและเซลล์สัตว์ รูปร่างกับหน้าที่ของเซลล์ และลำดับเซลล์ เนื้อเยื่อ อวัยวะ ระบบอวัยวะ
difficulty: 2.5
minutes: 40
prerequisites: [biology.humans.body-parts, biology.plants.flowering-plants]
encompasses:
  - { id: biology.humans.body-parts, weight: 0.2 }
  - { id: biology.plants.flowering-plants, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: เซลล์สัตว์และเซลล์พืช
    src: plant-animal-cells.svg
    alt: "ซ้ายคือเซลล์สัตว์ (เซลล์เยื่อบุข้างแก้ม) รูปร่างไม่แน่นอน มีเยื่อหุ้มเซลล์ล้อมรอบ ข้างในเป็นไซโทพลาซึม มีนิวเคลียสกลมตรงกลาง ไมโทคอนเดรียรูปรีสามอัน และแวคิวโอลขนาดเล็กสองอัน ขวาคือเซลล์พืช (เซลล์ใบ) รูปสี่เหลี่ยม มีผนังเซลล์หนาด้านนอกสุด เยื่อหุ้มเซลล์อยู่ด้านใน ไซโทพลาซึม แวคิวโอลขนาดใหญ่กลางเซลล์ นิวเคลียสถูกดันไปที่มุม คลอโรพลาสต์สีเขียวห้าอัน และไมโทคอนเดรีย"
    caption: "เซลล์พืชมีผนังเซลล์ คลอโรพลาสต์ และแวคิวโอลขนาดใหญ่ ส่วนเยื่อหุ้มเซลล์ ไซโทพลาซึม นิวเคลียส และไมโทคอนเดรียพบในทั้งสองเซลล์ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: หาขนาดจริงของเซลล์จากภาพวาด
    problem: "นักเรียนวาดเซลล์เยื่อหอมหัวใหญ่ที่เห็นจากกล้องกำลังขยาย 100 เท่า ภาพวาดยาว 25 มิลลิเมตร เซลล์จริงยาวกี่ไมโครเมตร"
    steps:
      - text: "ใช้ความสัมพันธ์ $\\text{ขนาดจริง} = \\frac{\\text{ขนาดของภาพ}}{\\text{กำลังขยาย}}$"
        why: "ภาพที่วาดถูกขยายมาแล้ว 100 เท่า ขนาดจริงจึงเล็กกว่า ต้องหาร"
      - text: "แทนค่า $\\frac{25}{100} = 0.25\\ \\mathrm{mm}$"
      - text: "เปลี่ยนหน่วย $0.25 \\times 1000 = 250\\ \\mu\\mathrm{m}$"
    answer: "เซลล์ยาวประมาณ $250\\ \\mu\\mathrm{m}$"
  - { type: check, problem: biology.cells.cell-basics.p004, prompt: "ใช้ภาพเซลล์ด้านบนช่วยตอบ" }
  - type: figure
    title: เซลล์ที่มีรูปร่างเหมาะกับหน้าที่
    src: specialised-cells.svg
    alt: "ภาพ 6 ช่อง: เซลล์เม็ดเลือดแดงเป็นแผ่นกลมสีแดงตรงกลางสีจางเพราะเว้า ไม่มีนิวเคลียส; เซลล์ประสาทมีตัวเซลล์กลมพร้อมแขนงสั้นหลายแขนง และแขนงยาวเส้นเดียวที่ปลายแตกแขนง; เซลล์กล้ามเนื้อเป็นเซลล์ยาวหัวท้ายแหลมเรียงขนานกัน; เซลล์ขนรากมีส่วนยื่นยาวแทรกออกไปข้างเม็ดดิน; เซลล์คุมรูปถั่วสองเซลล์ประกบกันล้อมรูปากใบ; เซลล์อสุจิมีหัวกลมรีและหางยาว"
    caption: "รูปร่างที่ต่างกันช่วยให้เซลล์แต่ละชนิดทำหน้าที่ของตัวเองได้ดี (วาดโดยทีมคลังรู้ ไม่ได้ใช้มาตราส่วนเดียวกัน)"
  - type: figure
    title: จากเซลล์ถึงสิ่งมีชีวิต
    src: organisation.svg
    alt: "แผนภาพลูกศรจากซ้ายไปขวา 5 ขั้น: เซลล์ (เซลล์กล้ามเนื้อเรียบยาวหัวท้ายแหลม) → เนื้อเยื่อ (เซลล์กล้ามเนื้อเรียบหลายเซลล์เรียงเป็นแผ่น) → อวัยวะ (กระเพาะอาหาร) → ระบบอวัยวะ (ระบบย่อยอาหารที่มีหลอดอาหาร กระเพาะ ตับ และลำไส้) → สิ่งมีชีวิต (คน)"
    caption: "เซลล์ชนิดเดียวกันรวมเป็นเนื้อเยื่อ เนื้อเยื่อหลายชนิดรวมเป็นอวัยวะ อวัยวะหลายอย่างทำงานร่วมกันเป็นระบบ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: จัดระดับการจัดระบบของพืช
    problem: "จัดเรียงสิ่งต่อไปนี้จากระดับเล็กไปใหญ่: ใบมะม่วง ต้นมะม่วง เซลล์ที่มีคลอโรพลาสต์ในใบ ระบบยอด (ลำต้น ใบ ดอก) และกลุ่มเซลล์ที่สร้างอาหารในใบ"
    steps:
      - text: "หน่วยเล็กที่สุดคือเซลล์: เซลล์ที่มีคลอโรพลาสต์ในใบ"
      - text: "เซลล์ชนิดเดียวกันหลายเซลล์ทำหน้าที่ร่วมกันเป็นเนื้อเยื่อ: กลุ่มเซลล์ที่สร้างอาหาร"
      - text: "ใบประกอบด้วยเนื้อเยื่อหลายชนิด (ผิวใบ เนื้อเยื่อสร้างอาหาร ท่อลำเลียง) จึงเป็นอวัยวะ"
        why: "ตรวจว่ามีเนื้อเยื่อหลายชนิดหรือไม่ ถ้ามีจึงเป็นอวัยวะ"
      - text: "ลำต้น ใบ และดอกทำงานร่วมกันเป็นระบบยอด แล้วระบบยอดกับระบบรากรวมกันเป็นต้นมะม่วง"
    answer: "เซลล์ที่มีคลอโรพลาสต์ → กลุ่มเซลล์สร้างอาหาร (เนื้อเยื่อ) → ใบ (อวัยวะ) → ระบบยอด → ต้นมะม่วง"
  - { type: check, problem: biology.cells.cell-basics.p005, prompt: "ทบทวนลำดับการจัดระบบ" }
glossary:
  - { term: เซลล์, definition: "หน่วยที่เล็กที่สุดที่มีชีวิต สิ่งมีชีวิตทุกชนิดประกอบด้วยเซลล์" }
  - { term: เนื้อเยื่อ, definition: "กลุ่มเซลล์ชนิดเดียวกันที่ทำหน้าที่ร่วมกัน" }
  - { term: อวัยวะ, definition: "ส่วนของร่างกายที่ประกอบด้วยเนื้อเยื่อหลายชนิดทำหน้าที่ร่วมกัน เช่น หัวใจ ใบ" }
  - { term: ระบบอวัยวะ, definition: "กลุ่มอวัยวะที่ทำงานร่วมกัน เช่น ระบบย่อยอาหาร ระบบหายใจ" }
  - { term: ออร์แกเนลล์, definition: "โครงสร้างในไซโทพลาซึมที่ทำหน้าที่เฉพาะ เช่น ไมโทคอนเดรีย คลอโรพลาสต์" }
  - { term: สิ่งมีชีวิตเซลล์เดียว, definition: "สิ่งมีชีวิตที่ทั้งตัวมีเพียงเซลล์เดียว เช่น อะมีบา พารามีเซียม ยีสต์ แบคทีเรีย" }
flashcards:
  - { front: "โครงสร้างที่มีในเซลล์พืชแต่ไม่มีในเซลล์สัตว์", back: "ผนังเซลล์ คลอโรพลาสต์ และแวคิวโอลขนาดใหญ่" }
  - { front: "กำลังขยายของกล้องจุลทรรศน์คำนวณอย่างไร", back: "กำลังขยายเลนส์ใกล้ตา × กำลังขยายเลนส์ใกล้วัตถุ" }
  - { front: "ขนาดจริงหาจากภาพวาดอย่างไร", back: "ขนาดจริง = ขนาดของภาพ ÷ กำลังขยาย" }
  - { front: "ลำดับการจัดระบบของสิ่งมีชีวิต", back: "เซลล์ → เนื้อเยื่อ → อวัยวะ → ระบบอวัยวะ → สิ่งมีชีวิต" }
  - { front: "ทำไมเซลล์ขนรากจึงมีส่วนยื่นยาว", back: "เพิ่มพื้นที่ผิวสัมผัสน้ำในดิน ดูดน้ำและธาตุอาหารได้มากขึ้น" }
