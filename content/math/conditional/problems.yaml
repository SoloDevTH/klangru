  - id: math.prob.conditional.p014
    topics: [math.prob.conditional]
    difficulty: 4
    type: numeric
    stem: "โรงเรียนมีนักเรียน 800 คน 30% ขี่จักรยานมาโรงเรียน ในกลุ่มที่ขี่จักรยาน $\\tfrac14$ สวมหมวกกันน็อก คาดว่ามีนักเรียนที่ขี่จักรยานและสวมหมวกกันน็อกกี่คน"
    answer: { value: 60, unit: คน }
    hints:
      - "หาจำนวนคนขี่จักรยานก่อน"
      - "$\\tfrac14$ ของคนขี่จักรยาน ไม่ใช่ของทั้งโรงเรียน"
    misconceptions:
      - { match: 200, feedback: "คิด $\\tfrac14$ ของนักเรียนทั้งหมด 800 คน แต่ $\\tfrac14$ เป็นสัดส่วนในกลุ่มที่ขี่จักรยาน" }
      - { match: 240, feedback: "นี่คือจำนวนคนขี่จักรยานทั้งหมด ยังต้องคูณ $\\tfrac14$" }
    solution: "ขี่จักรยาน $800 \\times 0.3 = 240$ คน สวมหมวก $240 \\times \\tfrac14 = 60$ คน (ความถี่ที่คาดหวัง $= 800 \\times 0.3 \\times \\tfrac14$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.conditional.p015
    topics: [math.prob.conditional]
    difficulty: 4
    type: mcq
    stem: "ถ้า $P(A) = 0.5$, $P(B) = 0.4$ และ $P(A \\cap B) = 0.2$ ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "$A$ กับ $B$ เป็นอิสระต่อกัน", correct: true }
      - { id: b, text: "$A$ กับ $B$ ไม่เกิดร่วมกัน", feedback: "ไม่เกิดร่วมกันหมายถึง $P(A \\cap B) = 0$ แต่ที่นี่เป็น 0.2" }
      - { id: c, text: "$P(A \\mid B) = 0.2$", feedback: "$P(A \\mid B) = \\tfrac{0.2}{0.4} = 0.5$ ไม่ใช่ 0.2" }
      - { id: d, text: "$P(A \\cup B) = 0.9$", feedback: "ลืมลบส่วนซ้อน $P(A \\cup B) = 0.5 + 0.4 - 0.2 = 0.7$" }
    hints:
      - "ตรวจว่า $P(A)P(B)$ เท่ากับ $P(A \\cap B)$ หรือไม่"
      - "หรือหา $P(A \\mid B)$ แล้วเทียบกับ $P(A)$"
    solution: "$P(A)P(B) = 0.5 \\times 0.4 = 0.2 = P(A \\cap B)$ จึงอิสระต่อกัน และ $P(A \\mid B) = 0.5 = P(A)$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.conditional.p016
    topics: [math.prob.conditional]
    difficulty: 5
    type: numeric
    stem: "การตรวจคัดกรองโรคหนึ่ง (ตัวเลขสมมติ) ใช้กับคน 1,000 คนตามแผนภาพ โรคพบ 2% ผู้ป่วยตรวจได้ผลบวก 90% คนไม่ป่วยตรวจได้ผลบวกผิด 5% ถ้าคนหนึ่งได้ผลบวก ความน่าจะเป็นที่เขาป่วยจริงเป็นเท่าใด (ตอบทศนิยม 2 ตำแหน่ง)"
    figure:
      src: p-test-tree.svg
      alt: "แผนภาพต้นไม้เริ่มจาก 1,000 คน แยกเป็นป่วย 2% และไม่ป่วย 98% กิ่งป่วยแยกเป็นผลบวก 90% และผลลบ 10% กิ่งไม่ป่วยแยกเป็นผลบวก 5% และผลลบ 95% ปลายกิ่งทุกกิ่งเขียนว่า ? คน"
    answer: { value: 0.27, tolerance: 0.01 }
    hints:
      - "เปลี่ยนเป็นจำนวนคน: ป่วย 20 คน ไม่ป่วย 980 คน"
      - "นับคนที่ได้ผลบวกทั้งหมด (ทั้งป่วยและไม่ป่วย) เป็นตัวส่วน"
    misconceptions:
      - { match: 0.9, feedback: "0.9 คือ $P(\\text{บวก} \\mid \\text{ป่วย})$ โจทย์ถาม $P(\\text{ป่วย} \\mid \\text{บวก})$ ซึ่งสลับเงื่อนไข" }
      - { match: 0.018, feedback: "นี่คือ $P(\\text{ป่วย} \\cap \\text{บวก})$ จากทั้ง 1,000 คน ต้องหารด้วยจำนวนคนที่ได้ผลบวก" }
    solution: "ป่วย 20 คน ผลบวก $20 \\times 0.9 = 18$ คน ไม่ป่วย 980 คน ผลบวกผิด $980 \\times 0.05 = 49$ คน ผลบวกทั้งหมด 67 คน $P(\\text{ป่วย} \\mid \\text{บวก}) = \\tfrac{18}{67} \\approx 0.27$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.conditional.p017
    topics: [math.prob.conditional]
    difficulty: 5
    type: numeric
    stem: "ความน่าจะเป็นที่ฝนตกตอนเช้าคือ 0.3 ถ้าฝนตก รถติดด้วยความน่าจะเป็น 0.8 ถ้าฝนไม่ตก รถติดด้วยความน่าจะเป็น 0.4 เช้าวันหนึ่งรถติด ความน่าจะเป็นที่ฝนตกในเช้านั้นเป็นเท่าใด (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 0.46, tolerance: 0.01 }
    hints:
      - "หา $P(\\text{ฝน} \\cap \\text{ติด})$ และ $P(\\text{ติด})$ จากแผนภาพต้นไม้"
      - "$P(\\text{ฝน} \\mid \\text{ติด}) = \\dfrac{P(\\text{ฝน} \\cap \\text{ติด})}{P(\\text{ติด})}$"
    misconceptions:
      - { match: 0.8, feedback: "0.8 คือ $P(\\text{ติด} \\mid \\text{ฝน})$ ซึ่งสลับเงื่อนไข" }
      - { match: 0.24, feedback: "นี่คือ $P(\\text{ฝน} \\cap \\text{ติด})$ ต้องหารด้วย $P(\\text{ติด}) = 0.52$" }
    solution: "$P(\\text{ฝน} \\cap \\text{ติด}) = 0.24$ และ $P(\\text{ติด}) = 0.24 + 0.28 = 0.52$ จึงได้ $\\tfrac{0.24}{0.52} \\approx 0.46$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.conditional.p018
    topics: [math.prob.conditional]
    difficulty: 5
    type: numeric
    stem: "ทอยลูกเต๋าสองลูก (ลูกแรกและลูกที่สอง) รู้ว่าลูกแรกได้แต้มคู่ ความน่าจะเป็นที่ผลรวมเป็น 8 เป็นเท่าใด (ตอบทศนิยม 3 ตำแหน่ง)"
    answer: { value: 0.167, tolerance: 0.005 }
    hints:
      - "เงื่อนไข: ลูกแรกเป็น 2, 4 หรือ 6 ปริภูมิตัวอย่างเหลือ $3 \\times 6 = 18$ แบบ"
      - "ในนั้น คู่ใดรวมได้ 8"
    misconceptions:
      - { match: 0.139, feedback: "นี่คือ $P(\\text{ผลรวม } 8) = \\tfrac{5}{36}$ โดยไม่ใช้เงื่อนไข" }
      - { match: 0.083, feedback: "นับคู่ที่ถูกต้อง 3 คู่ แต่หารด้วย 36 ทั้งหมด ต้องหารด้วย 18" }
    solution: "ลูกแรกคู่มี 18 แบบ ผลรวม 8 ได้ $(2, 6), (4, 4), (6, 2)$ 3 แบบ จึงได้ $\\tfrac{3}{18} = \\tfrac16 \\approx 0.167$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.conditional.p019
    topics: [math.prob.conditional]
    difficulty: 5
    type: mcq
    stem: "ถ้า $P(A \\mid B) = P(A)$ โดย $P(A) > 0$ และ $P(B) > 0$ ข้อใดสรุปได้"
    choices:
      - { id: a, text: "$P(B \\mid A) = P(B)$ ด้วย และ $P(A \\cap B) = P(A)P(B)$", correct: true }
      - { id: b, text: "$A$ กับ $B$ ไม่เกิดร่วมกัน", feedback: "ถ้าไม่เกิดร่วมกัน $P(A \\mid B) = 0 \\ne P(A)$ ซึ่งขัดกับที่กำหนด" }
      - { id: c, text: "$A$ ต้องเป็นสาเหตุของ $B$", feedback: "ตรงข้ามกัน การรู้ $B$ ไม่เปลี่ยนโอกาสของ $A$ แสดงว่าไม่มีความสัมพันธ์ทางความน่าจะเป็น" }
      - { id: d, text: "$P(A) = P(B)$", feedback: "ความเป็นอิสระไม่ได้บอกว่าสองเหตุการณ์มีโอกาสเท่ากัน" }
    hints:
      - "ใช้กฎการคูณ $P(A \\cap B) = P(B)\\,P(A \\mid B)$"
      - "แทน $P(A \\mid B) = P(A)$ แล้วหา $P(B \\mid A)$"
    solution: "$P(A \\cap B) = P(B)P(A \\mid B) = P(B)P(A)$ แล้ว $P(B \\mid A) = \\tfrac{P(A \\cap B)}{P(A)} = P(B)$ ความเป็นอิสระจึงเป็นสมบัติที่สลับกันได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.conditional.p020
    topics: [math.prob.conditional]
    difficulty: 1
    type: numeric
    stem: "บัตรหมายเลข 1 ถึง 10 สุ่มหยิบ 1 ใบ เพื่อนแอบดูแล้วบอกว่าเป็นเลขคู่ ความน่าจะเป็นที่เป็นบัตรหมายเลข 8 เป็นเท่าใด (ตอบเป็นทศนิยม)"
