    stem: "จงหา $\\displaystyle\\int_0^{\\pi/4}\\sec^3 x\\,dx$ (ตอบทศนิยมสามตำแหน่ง)"
    answer: { value: 1.148, tolerance: 0.002 }
    misconceptions:
      - { match: 0.707, feedback: "นี่คือ $\\tfrac12\\sec x\\tan x$ ที่ปลายบน ลืมพจน์ $\\tfrac12\\ln|\\sec x + \\tan x|$ ที่มาจากการย้ายข้าง" }
    hints:
      - "ปริพันธ์ทีละส่วน $u = \\sec x$, $dv = \\sec^2 x\\,dx$ ได้ $\\sec x\\tan x - \\int \\sec x\\tan^2 x\\,dx$"
      - "แทน $\\tan^2 x = \\sec^2 x - 1$ จะได้ $\\int\\sec^3 x$ กลับมา ย้ายข้างแล้วหารด้วย 2"
    solution: "$\\int\\sec^3 x\\,dx = \\tfrac12\\big(\\sec x\\tan x + \\ln|\\sec x + \\tan x|\\big) + C$ แทนขอบเขต: $\\tfrac12\\big(\\sqrt2 + \\ln(1 + \\sqrt2)\\big) \\approx \\tfrac12(1.4142 + 0.8814) \\approx 1.148$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.calculus.trig-substitution.p018
    topics: [math.calculus.trig-substitution]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการหา $\\displaystyle\\int \\frac{dx}{\\sqrt{x^2 + 16}}$ ด้วยการแทนค่าด้วยตรีโกณมิติ"
    items:
      - "เลือก $x = 4\\tan\\theta$ ตามรูป $\\sqrt{a^2 + x^2}$"
      - "แทน $dx = 4\\sec^2\\theta\\,d\\theta$ และ $\\sqrt{x^2 + 16} = 4\\sec\\theta$"
      - "หาปริพันธ์ $\\int \\sec\\theta\\,d\\theta = \\ln|\\sec\\theta + \\tan\\theta| + C$"
      - "วาดสามเหลี่ยมอ้างอิงจาก $\\tan\\theta = \\tfrac{x}{4}$"
      - "เขียนคำตอบในตัวแปร $x$ แล้วตรวจด้วยการหาอนุพันธ์"
    hints:
      - "ต้องรู้ว่าแทนค่าอะไรก่อนจึงแทน $dx$ ได้"
      - "สามเหลี่ยมอ้างอิงใช้ตอนกลับเป็น $x$"
    solution: "เลือกการแทนค่า → แทน $dx$ และรากที่สอง → หาปริพันธ์ใน $\\theta$ → สามเหลี่ยมอ้างอิง → กลับเป็น $x$ และตรวจ ได้ $\\ln\\big|x + \\sqrt{x^2 + 16}\\big| + C$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.calculus.trig-substitution.p019
    topics: [math.calculus.trig-substitution]
    difficulty: 4
    type: mcq
    stem: "ตารางปริพันธ์ให้สูตร $\\displaystyle\\int \\frac{du}{a^2 - u^2} = \\frac{1}{2a}\\ln\\left|\\frac{a + u}{a - u}\\right| + C$ จงใช้สูตรนี้หา $\\displaystyle\\int \\frac{dx}{9 - 4x^2}$"
    choices:
      - { id: a, text: "$\\dfrac{1}{12}\\ln\\left|\\dfrac{3 + 2x}{3 - 2x}\\right| + C$", correct: true }
      - { id: b, text: "$\\dfrac{1}{6}\\ln\\left|\\dfrac{3 + 2x}{3 - 2x}\\right| + C$", feedback: "ให้ $u = 2x$ แล้วต้องแทน $dx = \\tfrac12du$ ด้วย ลืมตัวประกอบ $\\tfrac12$" }
      - { id: c, text: "$\\dfrac{1}{6}\\ln\\left|\\dfrac{3 + x}{3 - x}\\right| + C$", feedback: "นี่คือสูตรของ $\\int\\tfrac{dx}{9 - x^2}$ ตัวส่วนมี $4x^2 = (2x)^2$ จึงต้องให้ $u = 2x$" }
      - { id: d, text: "$\\dfrac{1}{4}\\ln\\left|\\dfrac{2 + 3x}{2 - 3x}\\right| + C$", feedback: "สลับบทบาทของ $a$ กับสัมประสิทธิ์ของ $x$: $a^2 = 9$ จึง $a = 3$ และ $u = 2x$" }
    hints:
      - "จัด $9 - 4x^2 = 3^2 - (2x)^2$ ให้ $a = 3$, $u = 2x$"
      - "$du = 2\\,dx$ จึง $dx = \\tfrac12du$"
    solution: "$\\int\\tfrac{dx}{9 - 4x^2} = \\tfrac12\\int\\tfrac{du}{9 - u^2} = \\tfrac12 \\cdot \\tfrac16\\ln\\left|\\tfrac{3 + u}{3 - u}\\right| + C = \\tfrac{1}{12}\\ln\\left|\\tfrac{3 + 2x}{3 - 2x}\\right| + C$ ตรวจ: อนุพันธ์คือ $\\tfrac{1}{12}\\big(\\tfrac{2}{3 + 2x} + \\tfrac{2}{3 - 2x}\\big) = \\tfrac{1}{12} \\cdot \\tfrac{12}{9 - 4x^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true
