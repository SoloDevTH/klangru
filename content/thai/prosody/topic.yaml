id: thai.poetry.prosody
subject: thai
title: { th: ฉันทลักษณ์และการแต่งบทร้อยกรอง, en: "Thai prosody and composing verse" }
summary: อ่านแผนผังและตำแหน่งสัมผัสของกลอนสุภาพ กาพย์ยานี กาพย์ฉบัง กาพย์สุรางคนางค์ และโคลงสี่สุภาพ คำเอกคำโท ตรวจและแต่งบทร้อยกรองให้ถูกฉันทลักษณ์
difficulty: 6
minutes: 40
prerequisites: [thai.poetry.rhymes-slogans, thai.writing.tone-rules]
encompasses:
  - { id: thai.poetry.rhymes-slogans, weight: 0.3 }
  - { id: thai.writing.tone-rules, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: klon-suphap.svg
    alt: "แผนผังกลอนสุภาพ วงกลมแทนคำ บาท 1 มีวรรคสดับและวรรครับ บาท 2 มีวรรครองและวรรคส่ง วรรคละ 8 วง เส้นสีแดงเชื่อม: คำที่ 8 วรรคสดับ กับคำที่ 3 วรรครับ · คำที่ 8 วรรครับ กับคำที่ 8 วรรครอง · คำที่ 8 วรรครอง กับคำที่ 3 วรรคส่ง ท้ายวรรครับเขียนว่า จัตวา (ห้ามสามัญ ตรี) ท้ายวรรครองและวรรคส่งเขียนว่า สามัญ/ตรี บทถัดไปสีเทา เส้นเทาเชื่อมคำที่ 8 วรรคส่ง กับคำที่ 8 วรรครับของบทใหม่ หมายเหตุ คำรับสัมผัสในวรรครับและวรรคส่งใช้คำที่ 3 หรือคำที่ 5 ก็ได้"
    caption: "แผนผังกลอนสุภาพ (กลอนแปด)"
  - type: figure
    src: kap-three.svg
    alt: "แผนผังกาพย์ 3 ชนิด กาพย์ยานี 11: บาทละ 2 วรรค 5 และ 6 คำ ท้ายวรรค 1 เชื่อมคำที่ 3 วรรค 2 ท้ายวรรค 2 เชื่อมท้ายวรรค 3 ท้ายบทเชื่อมท้ายวรรค 2 ของบทใหม่ กาพย์ฉบัง 16: วรรค 6 4 6 คำ ท้ายวรรค 1 เชื่อมท้ายวรรค 2 ท้ายวรรค 3 เชื่อมท้ายวรรค 1 ของบทใหม่ กาพย์สุรางคนางค์ 28: 7 วรรค วรรคละ 4 คำ ท้ายวรรค 1 เชื่อมท้ายวรรค 2 ท้ายวรรค 3 เชื่อมท้ายวรรค 5 ท้ายวรรค 5 เชื่อมท้ายวรรค 6 ท้ายวรรค 4 เชื่อมคำที่ 2 ของวรรค 5 ท้ายวรรค 7 เชื่อมท้ายวรรค 3 ของบทใหม่"
    caption: "แผนผังกาพย์ยานี 11 กาพย์ฉบัง 16 และกาพย์สุรางคนางค์ 28"
  - type: figure
    src: khlong-si-suphap.svg
    alt: "แผนผังโคลงสี่สุภาพ 4 บาท บาท 1: 5 คำ (คำที่ 4 เอก คำที่ 5 โท) วรรคหลัง 2 คำ และคำสร้อย 2 คำวงประ บาท 2: คำที่ 2 เอก วรรคหลัง เอก โท บาท 3: คำที่ 3 เอก วรรคหลังคำที่ 2 เอก และคำสร้อยวงประ บาท 4: คำที่ 2 เอก คำที่ 5 โท วรรคหลัง 4 คำ เอก โท และอีก 2 คำ เส้นสีแดง: ท้ายบาท 1 เชื่อมคำที่ 5 ของบาท 2 และคำที่ 5 ของบาท 3 ท้ายบาท 2 เชื่อมคำที่ 5 ของบาท 4 รวม 30 คำ เอก 7 โท 4"
    caption: "แผนผังโคลงสี่สุภาพ เอกใช้คำตายแทนได้"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: ตรวจกาพย์ยานีหนึ่งบท
    problem: "ตรวจกาพย์ยานี \"เช้านี้ฟ้าแจ่มใส · ลมโชยไกลพาชื่นบาน / นกน้อยร้องขับขาน · ทุกหัวใจสุขสดใส\""
    steps:
      - text: "นับคำ: เช้า นี้ ฟ้า แจ่ม ใส (5) · ลม โชย ไกล พา ชื่น บาน (6) · นก น้อย ร้อง ขับ ขาน (5) · ทุก หัว ใจ สุข สด ใส (6)"
      - text: "สัมผัสในบาท: ท้ายวรรค 1 ใส → คำที่ 3 วรรค 2 ไกล (สระไอ)"
      - text: "สัมผัสระหว่างบาท: ท้ายวรรค 2 บาน → ท้ายวรรค 3 ขาน (/อาน/)"
        why: "ต้องตรวจทั้งเสียงสระและตัวสะกด บาน กับ ขาน เป็นสระอาและแม่กนเหมือนกัน"
      - text: "ถ้าแต่งต่อ ท้ายวรรค 4 ใส ต้องส่งไปท้ายวรรค 2 ของบทถัดไป"
    answer: "ถูกฉันทลักษณ์: นับ 5/6/5/6 สัมผัส ใส–ไกล และ บาน–ขาน ครบ"
  - { type: check, problem: thai.poetry.prosody.p007, prompt: "ตรวจทั้งสัมผัสและเสียงวรรณยุกต์ท้ายวรรค" }
  - type: worked-example
    title: แต่งวรรคกลอนให้ลงสัมผัส
    problem: "แต่งวรรคส่งต่อจากวรรครอง \"ลมโชยพัดดอกไม้หอมทั่วลาน\" ให้ถูกฉันทลักษณ์"
    steps:
      - text: "ดูแผนผัง: ท้ายวรรครอง (ลาน) ต้องสัมผัสกับคำที่ 3 (หรือ 5) ของวรรคส่ง"
      - text: "หาคำ /อาน/: บาน ราญ ขาน หวาน ... เลือก สำราญ ให้ ราญ อยู่คำที่ 3: เด็ก สำ ราญ"
        why: "สำราญ มี 2 พยางค์ เมื่อวางหลัง เด็ก พยางค์ ราญ จะตกที่คำที่ 3 พอดี"
      - text: "เติมให้ครบ 8 คำและได้ความ: เด็กสำราญร่าเริงไปโรงเรียน"
      - text: "ตรวจท้ายวรรค: เรียน เป็นเสียงสามัญ ใช้ได้กับวรรคส่ง"
    answer: "เด็กสำราญร่าเริงไปโรงเรียน"
  - { type: check, problem: thai.poetry.prosody.p005, prompt: "ยานีรับสัมผัสที่คำที่เท่าไรของวรรคหลัง" }
glossary:
  - { term: ฉันทลักษณ์, definition: "ข้อบังคับในการแต่งร้อยกรอง เช่น จำนวนคำ สัมผัส และคำเอกคำโท" }
  - { term: แผนผัง, definition: "ภาพที่ใช้สัญลักษณ์แทนคำ แสดงจำนวนคำและตำแหน่งสัมผัสของร้อยกรองแต่ละชนิด" }
  - { term: สัมผัสนอก, definition: "สัมผัสบังคับระหว่างวรรค ระหว่างบาท หรือระหว่างบท" }
  - { term: สัมผัสใน, definition: "สัมผัสภายในวรรคเดียวกัน ไม่บังคับแต่ทำให้ไพเราะ" }
  - { term: คำเอก, definition: "คำที่มีรูปไม้เอก ในโคลงใช้คำตายแทนได้" }
  - { term: คำสร้อย, definition: "คำที่เติมท้ายบาทที่ 1 และ 3 ของโคลงสี่สุภาพ เช่น พี่เอย ไม่นับใน 30 คำ" }
flashcards:
  - { front: "สัมผัสบังคับของกลอนสุภาพ", back: "ท้ายสดับ → คำที่ 3 รับ · ท้ายรับ → ท้ายรอง · ท้ายรอง → คำที่ 3 ส่ง · ระหว่างบท ท้ายส่ง → ท้ายรับบทถัดไป" }
  - { front: "กาพย์ยานี 11", back: "5/6 คำ ท้ายวรรค 1 → คำที่ 3 วรรค 2 · ท้ายวรรค 2 → ท้ายวรรค 3" }
  - { front: "กาพย์ฉบัง 16", back: "6/4/6 คำ ท้ายวรรค 1 → ท้ายวรรค 2 · ท้ายบท → ท้ายวรรค 1 บทถัดไป" }
  - { front: "กาพย์สุรางคนางค์ 28", back: "7 วรรค วรรคละ 4 คำ 1→2 · 3→5→6 · 4 → คำที่ 2 ของวรรค 5" }
  - { front: "โคลงสี่สุภาพ", back: "4 บาท 30 คำ เอก 7 โท 4 ท้ายบาท 1 → คำที่ 5 บาท 2, 3 · ท้ายบาท 2 → คำที่ 5 บาท 4" }
