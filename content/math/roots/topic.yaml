id: math.number.roots
subject: math
title: { th: รากที่สอง รากที่สาม และจำนวนจริง, en: Square roots, cube roots and real numbers }
summary: หารากที่สองและรากที่สาม ประมาณค่ารากที่ไม่ลงตัว รู้จักจำนวนอตรรกยะ และวางจำนวนจริงทุกชนิดบนเส้นจำนวนเส้นเดียวกัน
difficulty: 3
minutes: 30
prerequisites: [math.number.exponents]
encompasses:
  - { id: math.number.exponents, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: interactive
    title: จำนวนอตรรกยะบนเส้นจำนวน
    caption: รากที่สองของจำนวนที่ไม่ใช่กำลังสองสมบูรณ์ก็มีตำแหน่งแน่นอนบนเส้นจำนวน สังเกตว่า √2 อยู่ระหว่าง 1 กับ 2 และ √5 อยู่ระหว่าง 2 กับ 3 เพราะ 5 อยู่ระหว่าง 4 กับ 9
    widget:
      kind: number-line
      min: 0
      max: 4
      points:
        - { value: 1, label: "√1 = 1" }
        - { value: 1.4142, label: "√2" }
        - { value: 1.7321, label: "√3" }
        - { value: 2, label: "√4 = 2" }
        - { value: 2.2361, label: "√5" }
        - { value: 3, label: "√9 = 3" }
        - { value: 3.1416, label: "π" }
glossary:
  - { term: รากที่สอง, definition: "รากที่สองของ $a$ คือจำนวนที่ยกกำลังสองแล้วได้ $a$ สัญลักษณ์ $\\sqrt{a}$ หมายถึงรากที่สองที่ไม่เป็นลบ เช่น $\\sqrt{49} = 7$" }
  - { term: รากที่สาม, definition: "รากที่สามของ $a$ คือจำนวนที่ยกกำลังสามแล้วได้ $a$ เขียนว่า $\\sqrt[3]{a}$ หาได้ทั้งจำนวนบวกและลบ เช่น $\\sqrt[3]{-8} = -2$" }
  - { term: จำนวนตรรกยะ, definition: "จำนวนที่เขียนเป็นเศษส่วน $\\dfrac{p}{q}$ ของจำนวนเต็มได้ ($q \\ne 0$) เขียนเป็นทศนิยมได้ทศนิยมรู้จบหรือทศนิยมซ้ำ" }
  - { term: จำนวนอตรรกยะ, definition: "จำนวนจริงที่เขียนเป็นเศษส่วนของจำนวนเต็มไม่ได้ ทศนิยมไม่รู้จบและไม่ซ้ำ เช่น $\\sqrt{2}$ และ $\\pi$" }
  - { term: จำนวนจริง, definition: "จำนวนตรรกยะและจำนวนอตรรกยะรวมกัน ทุกจุดบนเส้นจำนวนคือจำนวนจริงหนึ่งจำนวน" }
flashcards:
  - { front: "$\\sqrt{49}$ เท่ากับ $7$ หรือ $\\pm 7$", back: "$\\sqrt{49} = 7$ สัญลักษณ์ราก $\\sqrt{\\ }$ หมายถึงรากที่ไม่เป็นลบเท่านั้น แม้ $(-7)^2$ จะเท่ากับ 49 ก็ตาม" }
  - { front: "$\\sqrt[3]{-27}$ เท่ากับเท่าใด", back: "$-3$ เพราะ $(-3)^3 = -27$ รากที่สามของจำนวนลบหาได้" }
  - { front: "ประมาณ $\\sqrt{50}$", back: "$7^2 = 49 < 50 < 64 = 8^2$ จึงอยู่ระหว่าง 7 กับ 8 และใกล้ 7 มาก ประมาณ 7.07" }
  - { front: "$\\sqrt{a + b}$ เท่ากับ $\\sqrt{a} + \\sqrt{b}$ หรือไม่", back: "ไม่เท่า เช่น $\\sqrt{9 + 16} = \\sqrt{25} = 5$ แต่ $\\sqrt{9} + \\sqrt{16} = 7$" }
