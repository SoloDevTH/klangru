id: health.disease.communicable
subject: health
title: { th: โรคติดต่อ การแพร่กระจาย และการป้องกัน, en: "Communicable diseases: how they spread and how to prevent them" }
summary: เชื้อโรคและทางติดต่อ การตัดเส้นทางของเชื้อด้วยการล้างมือ ปิดปากจมูก และวัคซีน โรคที่พบบ่อยในไทย เช่น ไข้หวัดใหญ่ ไข้เลือดออก มือเท้าปาก และผลกระทบเมื่อโรคระบาด
difficulty: 2.5
minutes: 30
prerequisites: [health.disease.illness-symptoms-care]
encompasses:
  - { id: health.disease.illness-symptoms-care, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ตัดเส้นทางของเชื้อโรค
    src: chain-of-infection.svg
    alt: "แผนภาพห้าขั้นเรียงจากซ้ายไปขวาด้วยลูกศร 1 เชื้อโรค ไวรัส แบคทีเรีย ในตัวผู้ป่วย 2 ทางออก ไอ จาม น้ำมูก อุจจาระ เลือด 3 ทางแพร่ ละอองฝอย มือ อาหาร น้ำ ยุง 4 ทางเข้า จมูก ปาก ตา ผิวหนังที่ถูกกัด 5 คนต่อไป คนที่ยังไม่มีภูมิคุ้มกัน ใต้แต่ละขั้นมีกล่องสีเขียวบอกวิธีตัด ได้แก่ รักษาผู้ป่วยและพักที่บ้าน ปิดปากจมูกเวลาไอจาม ล้างมือ อาหารสุก กำจัดลูกน้ำยุง สวมหน้ากาก ไม่ขยี้ตา และวัคซีน กินดี นอนพอ"
    caption: "ถ้าตัดได้แม้ขั้นเดียว เชื้อก็ไปไม่ถึงคนต่อไป"
  - type: worked-example
    title: ใครป่วยมากที่สุด
    problem: "จากข้อมูลกรมควบคุมโรค ผู้ป่วยโรคมือ เท้า ปาก รายใหม่ 23–29 มีนาคม 2568 มี 695 ราย อายุ 0–4 ปี 513 ราย และ 5–9 ปี 152 ราย เด็กอายุต่ำกว่า 10 ปีคิดเป็นร้อยละเท่าไร และควรป้องกันอย่างไร"
    figure:
      src: hfmd-ages.svg
      alt: "แผนภูมิแท่งแนวนอน ผู้ป่วยโรคมือ เท้า ปาก รายใหม่ 23 ถึง 29 มีนาคม 2568 แยกตามกลุ่มอายุ ข้อมูลกรมควบคุมโรค รวมทุกอายุ 695 ราย อายุ 0 ถึง 4 ปี 513 ราย อายุ 5 ถึง 9 ปี 152 ราย อายุ 10 ถึง 14 ปี 21 ราย อายุอื่น 9 ราย"
    steps:
      - text: "รวมเด็กอายุต่ำกว่า 10 ปี: 513 + 152 = 665 ราย"
      - text: "คิดเป็นร้อยละ: 665 ÷ 695 × 100 ≈ 95.7"
      - text: "แปลผล: เกือบทั้งหมดเป็นเด็กเล็ก เพราะเด็กเล็กเล่นใกล้ชิดกัน ใช้ของเล่นร่วมกัน และยังล้างมือไม่เป็น"
        why: "โรคนี้ติดต่อทางการสัมผัส น้ำลาย และของใช้ร่วมกัน"
      - text: "ป้องกัน: สอนเด็กล้างมือ ทำความสะอาดของเล่น คัดกรองเด็กก่อนเข้าเรียน และให้เด็กป่วยหยุดเรียน 1 สัปดาห์"
    answer: "ราวร้อยละ 95.7 จึงต้องเน้นการป้องกันในบ้านที่มีเด็กเล็ก ศูนย์เด็กเล็ก และโรงเรียนอนุบาล"
  - { type: check, problem: health.disease.communicable.p003, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: worked-example
    title: ทำไมโรคระบาดเร็ว
    problem: "ในแบบจำลองอย่างง่าย ผู้ป่วย 1 คนแพร่เชื้อให้คนใหม่ 2 คนในแต่ละรอบ ถ้าห้องเรียนช่วยกันล้างมือและปิดปากจนผู้ป่วย 1 คนแพร่ให้คนใหม่เพียง 1 คน ในรอบที่ 4 จะมีผู้ป่วยใหม่ต่างกันกี่คน"
    steps:
      - text: "แพร่ให้ 2 คน: ผู้ป่วยใหม่แต่ละรอบเป็น 1, 2, 4, 8, 16 รอบที่ 4 มี 16 คน"
      - text: "แพร่ให้ 1 คน: ผู้ป่วยใหม่แต่ละรอบเป็น 1, 1, 1, 1, 1 รอบที่ 4 มี 1 คน"
      - text: "ต่างกัน 16 − 1 = 15 คน"
        why: "การลดจำนวนคนที่ผู้ป่วยแพร่ให้แม้เพียงเล็กน้อย ทำให้การระบาดช้าลงมาก"
      - text: "แบบจำลองนี้ง่ายกว่าความจริง แต่ช่วยให้เห็นว่าทำไมการป้องกันของทุกคนจึงสำคัญ"
    answer: "ต่างกัน 15 คน (16 คน เทียบกับ 1 คน)"
  - { type: check, problem: health.disease.communicable.p007 }
glossary:
  - { term: โรคติดต่อ, definition: "โรคที่เกิดจากเชื้อโรค และส่งต่อจากคนหรือสัตว์ไปสู่คนอื่นได้" }
  - { term: เชื้อโรค, definition: "สิ่งมีชีวิตขนาดเล็กที่ทำให้เกิดโรค เช่น ไวรัส แบคทีเรีย เชื้อรา พยาธิ" }
  - { term: พาหะนำโรค, definition: "สัตว์หรือแมลงที่นำเชื้อโรคจากคนหนึ่งไปสู่อีกคน เช่น ยุงลายนำไข้เลือดออก" }
  - { term: วัคซีน, definition: "สารที่ช่วยให้ร่างกายสร้างภูมิคุ้มกันต่อโรคไว้ก่อนเจอเชื้อจริง" }
  - { term: การระบาด, definition: "การที่โรคเกิดกับคนจำนวนมากกว่าปกติในพื้นที่และเวลาหนึ่ง" }
flashcards:
  - { front: "ล้างมือด้วยสบู่ ถูนานอย่างน้อยเท่าไร", back: "20 วินาที" }
  - { front: "3 เก็บ ป้องกัน 3 โรค", back: "เก็บบ้าน เก็บขยะ เก็บน้ำ ป้องกันไข้เลือดออก ไข้ปวดข้อยุงลาย ไวรัสซิกา" }
  - { front: "เด็กป่วยโรคมือ เท้า ปาก ควรหยุดเรียนนานเท่าไร", back: "ราว 1 สัปดาห์ หรือจนพ้นระยะแพร่เชื้อ 7 วันแรก" }
  - { front: "ทำไมต้องฉีดวัคซีนไข้หวัดใหญ่ทุกปี", back: "ภูมิคุ้มกันจากวัคซีนลดลงตามเวลา" }
  - { front: "เอชไอวีติดจากการกอดหรือกินข้าวด้วยกันไหม", back: "ไม่ติด องค์การอนามัยโลกยืนยันว่าไม่ติดจากการใช้ชีวิตประจำวันร่วมกัน" }
