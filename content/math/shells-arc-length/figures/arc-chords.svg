<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 310" width="340" height="310" font-family="sans-serif">
  <title>เส้นโค้ง y = x กำลังสอง หารสอง บน 0 ถึง 2 ถูกประมาณด้วยเส้นตรงสี่ช่วง ความยาวรวมของเส้นตรงใกล้เคียงความยาวส่วนโค้ง</title>
  <line x1="40" y1="255" x2="195.0" y2="255" stroke="#15211e" stroke-width="1.2"/>
  <line x1="40" y1="255" x2="40" y2="93.79999999999998" stroke="#15211e" stroke-width="1.2"/>
