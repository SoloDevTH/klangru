      - วิธีนี้ยืดหยุ่นและใช้ได้เมื่อมีการเปลี่ยนแปลงกระบวนการหรือไม่มีข้อมูลละเอียด
    solution: การวิเคราะห์ What-If ตั้งคำถามว่า 'ถ้า...จะเกิดอะไร' กับการเปลี่ยนแปลงหนึ่งอย่าง เช่น ถ้าเปลี่ยนวัตถุดิบ เหมาะกับการเปลี่ยนแปลงที่เกิดขึ้นบ่อยและเป็นวิธีที่เรียบง่ายกว่า HAZOP ซึ่งเป็นระบบที่เป็นทางการมากกว่า
