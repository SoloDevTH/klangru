id: math.functions.functions-intro
subject: math
title: { th: ความสัมพันธ์และฟังก์ชัน, en: Relations and functions }
summary: รู้จักฟังก์ชันว่าเป็นความสัมพันธ์ที่ค่าเข้าแต่ละค่าให้ค่าออกเพียงค่าเดียว อ่านสัญลักษณ์ f(x) หาโดเมน เรนจ์ และฟังก์ชันประกอบ
difficulty: 4.5
minutes: 30
prerequisites: [math.functions.linear-graphs]
encompasses:
  - { id: math.functions.linear-graphs, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: vertical-line-test.svg
    alt: "สองกราฟเทียบกัน กราฟซ้ายเป็นพาราโบลา y = x² − 2 เส้นประแนวตั้ง x = 1 ตัดกราฟเพียง 1 จุด จึงเป็นฟังก์ชัน กราฟขวาเป็นวงกลม x² + y² = 9 เส้นประ x = 1 ตัดกราฟ 2 จุด ด้านบนและด้านล่าง จึงไม่เป็นฟังก์ชัน"
    caption: "ถ้ามีเส้นแนวตั้งเส้นใดตัดกราฟเกิน 1 จุด แปลว่าค่า $x$ เดียวให้ค่า $y$ หลายค่า กราฟนั้นจึงไม่ใช่ฟังก์ชัน"
  - { type: check, problem: math.func.p015, prompt: "ดูลูกศรที่ออกจากค่าทางซ้ายแต่ละตัว" }
  - type: worked-example
    title: ความสัมพันธ์จากตารางเป็นฟังก์ชันหรือไม่
    problem: "ร้านส่งพัสดุคิดค่าส่งตามน้ำหนักดังตาราง น้ำหนัก (กก.) 1, 2, 3, 4 ค่าส่ง (บาท) 35, 35, 50, 65 ความสัมพันธ์นี้เป็นฟังก์ชันหรือไม่ และมีโดเมนกับเรนจ์อะไร"
    steps:
      - text: "เขียนเป็นคู่อันดับ (น้ำหนัก, ค่าส่ง): $(1, 35), (2, 35), (3, 50), (4, 65)$"
      - text: "ค่า $x$ ทั้งสี่ค่า 1, 2, 3, 4 ไม่ซ้ำกัน แต่ละค่าจึงมีค่า $y$ เพียงค่าเดียว ความสัมพันธ์นี้เป็นฟังก์ชัน"
        why: "ค่า $y = 35$ ซ้ำกันสองครั้งได้ เหมือนสองปุ่มในตู้กดน้ำที่ให้น้ำชนิดเดียวกัน สิ่งที่ห้ามคือ $x$ เดียวให้ $y$ สองค่า"
      - text: "โดเมนคือเซตของค่า $x$: $\\{1, 2, 3, 4\\}$"
      - text: "เรนจ์คือเซตของค่า $y$ โดยเขียนค่าที่ซ้ำเพียงครั้งเดียว: $\\{35, 50, 65\\}$"
    answer: "เป็นฟังก์ชัน โดเมน $\\{1, 2, 3, 4\\}$ เรนจ์ $\\{35, 50, 65\\}$"
  - type: worked-example
    title: อ่านกราฟอุณหภูมิตลอดวัน
    problem: "กราฟแสดงอุณหภูมิอากาศ (°C) ในวันหนึ่งตั้งแต่ 6:00 ถึง 18:00 น. อุณหภูมิเพิ่มขึ้นช่วงใด ลดลงช่วงใด สูงสุดเท่าใด และช่วงใดอุณหภูมิเพิ่มเร็วที่สุด"
    figure: { src: temperature.svg, alt: "กราฟเส้นอุณหภูมิกับเวลา จุดข้อมูลคือ 6:00 น. 26 องศา, 8:00 น. 28 องศา, 10:00 น. 31 องศา, 12:00 น. 33 องศา, 14:00 น. 34 องศา, 16:00 น. 32 องศา และ 18:00 น. 30 องศา แกนอุณหภูมิเริ่มที่ 24 องศา" }
    steps:
      - text: "อ่านจากซ้ายไปขวา กราฟขึ้นตั้งแต่ 6:00 ถึง 14:00 น. อุณหภูมิจึงเพิ่มขึ้นในช่วงนี้"
      - text: "หลัง 14:00 น. กราฟลง อุณหภูมิลดลงตั้งแต่ 14:00 ถึง 18:00 น."
      - text: "จุดสูงสุดของกราฟคือ 34 °C ที่เวลา 14:00 น."
        why: "จุดที่กราฟเปลี่ยนจากขึ้นเป็นลงคือค่าสูงสุดในช่วงนี้"
      - text: "ช่วงที่เส้นชันที่สุดคือ 8:00 ถึง 10:00 น. อุณหภูมิเพิ่ม $31 - 28 = 3$ องศาใน 2 ชั่วโมง มากกว่าทุกช่วงสองชั่วโมงอื่น (2, 2, 1 องศา)"
        why: "ทุกช่วงยาว 2 ชั่วโมงเท่ากัน ช่วงที่อุณหภูมิเปลี่ยนมากที่สุดจึงเปลี่ยนเร็วที่สุด"
      - text: "แกนตั้งเริ่มที่ 24 ไม่ใช่ 0 (มีเครื่องหมายตัดแกน) จึงห้ามเทียบความสูงของจุดเป็นสัดส่วนตรง ๆ"
    answer: "เพิ่มขึ้นช่วง 6:00–14:00 น. ลดลงช่วง 14:00–18:00 น. สูงสุด 34 °C เวลา 14:00 น. และเพิ่มเร็วที่สุดช่วง 8:00–10:00 น."
  - { type: check, problem: math.func.p017, prompt: "อ่านกราฟระยะทางกับเวลาดู" }
  - type: simulation
    title: เครื่องสร้างฟังก์ชัน (PhET Function Builder)
    url: https://phet.colorado.edu/en/simulations/function-builder
    provider: phet
    note: ลากตัวเลขเข้าเครื่องที่ทำงาน เช่น "×2" แล้ว "+3" ดูว่าค่าออกเป็นเท่าใด แล้วลองสลับลำดับเครื่อง ผลที่ได้มักไม่เท่าเดิม เหมือนฟังก์ชันประกอบที่สลับลำดับไม่ได้
glossary:
  - { term: ความสัมพันธ์, definition: "เซตของคู่อันดับ $(x, y)$ ที่จับคู่สมาชิกของเซตหนึ่งกับอีกเซตหนึ่ง" }
  - { term: ฟังก์ชัน, definition: "ความสัมพันธ์ที่ค่า $x$ แต่ละค่าจับคู่กับค่า $y$ ได้เพียงค่าเดียว" }
  - { term: โดเมน, definition: "เซตของค่า $x$ ทั้งหมดที่ใส่เข้าไปในฟังก์ชันได้" }
  - { term: เรนจ์, definition: "เซตของค่า $y$ ทั้งหมดที่ฟังก์ชันให้ออกมา" }
  - { term: ฟังก์ชันประกอบ, definition: "การนำผลของฟังก์ชันหนึ่งไปใส่ต่อในอีกฟังก์ชันหนึ่ง เขียนว่า $f(g(x))$" }
flashcards:
  - { front: "ความสัมพันธ์จะเป็นฟังก์ชันเมื่อใด", back: "เมื่อค่า $x$ แต่ละค่าจับคู่กับค่า $y$ เพียงค่าเดียว (ค่า $x$ ซ้ำกันแต่ $y$ ต่างกันไม่ได้)" }
  - { front: "$f(3)$ หมายถึงอะไร", back: "ค่าของฟังก์ชัน $f$ เมื่อแทน $x = 3$ ไม่ใช่ $f$ คูณ 3" }
  - { front: "ทดสอบด้วยเส้นตั้งทำอย่างไร", back: "ลากเส้นแนวตั้งผ่านกราฟ ถ้ามีเส้นใดตัดกราฟมากกว่า 1 จุด กราฟนั้นไม่ใช่ฟังก์ชัน" }
  - { front: "โดเมนของ $f(x) = \\sqrt{x}$ คืออะไร", back: "$x \\ge 0$ เพราะรากที่สองของจำนวนลบไม่เป็นจำนวนจริง" }
  - { front: "ถ้า $f(x) = x + 1$ และ $g(x) = 2x$ แล้ว $f(g(x))$ คืออะไร", back: "ทำ $g$ ก่อนแล้วจึงทำ $f$: $f(g(x)) = 2x + 1$" }
