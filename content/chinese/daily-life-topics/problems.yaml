- id: chinese.vocab.daily-life-topics.p002
  topics:
  - chinese.vocab.daily-life-topics
  difficulty: 1
  type: mcq
  stem: เพื่อนชาวจีนที่เรียนอยู่กรุงเทพฯ เขียนว่า 我坐地铁去学校。 (Wǒ zuò dìtiě qù xuéxiào.) แปลว่าอะไร
  choices:
  - id: a
    text: ฉันนั่งรถเมล์ไปโรงเรียน
    feedback: รถเมล์คือ 公共汽车
  - id: b
    text: ฉันเดินไปโรงเรียน
    feedback: เดินคือ 走路
  - id: c
    text: ฉันอยากไปโรงเรียน
    feedback: ไม่มี 想 ในประโยค
  - id: d
    text: ฉันนั่งรถไฟใต้ดินไปโรงเรียน
    correct: true
    feedback: ถูก 坐 = นั่ง (ยานพาหนะ) 地铁 = รถไฟใต้ดิน
  hints:
  - 地 = พื้นดิน 铁 = เหล็ก
  - 坐 + ยานพาหนะ + 去 + สถานที่
  solution: '**ฉันนั่งรถไฟใต้ดินไปโรงเรียน** (地铁 ในกรุงเทพฯ เช่น MRT)'
  license: CC-BY-SA-4.0
  ai_assisted: true
