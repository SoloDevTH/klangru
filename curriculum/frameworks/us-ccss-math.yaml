# - ไฟล์นี้เก็บเฉพาะโครง (domain → cluster → standard) รหัส ระดับชั้น และลำดับตามต้นฉบับ ข้อความทุกข้อเป็นสรุปภาษาไทย
#   ที่คลังรู้เรียบเรียงเองเพื่อให้ครูค้นหาและเข้าใจว่าแต่ละข้อสอนเรื่องอะไร ไม่ใช่คำแปลทีละประโยค และไม่คัดถ้อยคำ
#   หรือตัวอย่างจากต้นฉบับ ชื่อ domain ภาษาอังกฤษในวงเล็บคงไว้เพื่อให้ค้นด้วยชื่อเดิมได้
# - ข้อความเต็มของทุกข้อให้อ่านจาก PDF ทางการใน sources ถ้าจะจับคู่หัวข้อกับตัวชี้วัด ให้ตรวจกับข้อความเต็มใน PDF
#   ไม่ใช่กับสรุปในไฟล์นี้
#
# โครงในไฟล์นี้
# - strand = domain ในแต่ละชั้น รหัสตามที่พิมพ์ใน PDF ("K.CC", "3.NF", "N-RN", "G-SRT")
# - standard = cluster รหัส = domain + อักษร cluster ตามรหัสของ CCSS ("K.CC.A", "N-RN.B")
# - indicator = standard รหัสตามที่พิมพ์ใน PDF ("K.CC.4", "8.EE.1", "A-REI.4") ข้อย่อย a, b, c ... สรุปรวมไว้ในข้อหลัก
# - level: "K" (อนุบาล), "1" ... "8" (เกรด), "HS" (มัธยมปลาย)
# - โครงอ่านจากหน้า HTML ของ thecorestandards.org (เว็บสำเนาที่ไม่เป็นทางการ) แล้วตรวจกับ PDF ทางการเมื่อ 2026-10-24
# - ไม่รวม Standards for Mathematical Practice (MP.1-MP.8) เก็บเฉพาะ content standards
#
# เครื่องหมาย
# - "(การสร้างแบบจำลอง)" แทน ★ ของต้นฉบับ คือ modeling standard ถ้าอยู่ที่ชื่อ domain หมายถึงทั้ง domain
# - "(เกินแกนกลาง)" แทน (+) ของต้นฉบับ คือเนื้อหาเพิ่มเติมที่เกินกว่าที่ผู้เรียนทุกคนต้องเรียนเพื่อพร้อมเข้ามหาวิทยาลัยและอาชีพ
# - สัญลักษณ์คณิตศาสตร์เขียนเป็นข้อความบรรทัดเดียว เช่น x^2, 1/b
#
# จำนวน: 65 domain, 147 cluster, 385 standard (K-8: 229, HS: 156)
id: us-ccss-math
title: Common Core State Standards for Mathematics (โครงและสรุปภาษาไทย)
short: Common Core (US)
kind: international-standard
subjects: [math]
language: th
sources:
  - { title: "Common Core State Standards for Mathematics (PDF ทางการ ข้อความเต็ม)", url: "https://corestandards.org/wp-content/uploads/2023/09/Math_Standards1.pdf", publisher: "National Governors Association Center for Best Practices and Council of Chief State School Officers", retrieved: "2026-10-24", pages: "9-84 (content standards K-8 และมัธยมปลาย)" }
  - { title: "Common Core State Standards Initiative: Mathematics Standards (เว็บสำเนาที่ไม่เป็นทางการ ใช้ตรวจโครง)", url: "https://www.thecorestandards.org/Math/", publisher: "thecorestandards.org (not affiliated with NGA Center/CCSSO)", retrieved: "2026-10-24" }
  - { title: "Common Core State Standards Public License", url: "https://www.thecorestandards.org/public-license/", publisher: "NGA Center / CCSSO (license text as reproduced on thecorestandards.org)", retrieved: "2026-10-24" }
