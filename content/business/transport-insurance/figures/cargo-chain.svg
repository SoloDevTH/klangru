<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" font-family="sans-serif" font-size="14">
  <title>เส้นทางขนส่งจากผู้ส่งออกถึงผู้รับ ผ่านท่าต้นทาง ทางทะเล และท่าปลายทาง ช่วงผู้ขนส่งรับผิดชอบอยู่ตรงกลาง ช่วงประกันภัยครอบคลุมทั้งเส้นทาง และมีจุดโอนความเสี่ยงที่ท่าต้นทางตามตัวอย่าง CIF หรือ FOB</title>
  <rect x="0" y="0" width="780" height="330" fill="#ffffff"/>
  <line x1="90" y1="130" x2="690" y2="130" stroke="#1f2937" stroke-width="3"/>
  <circle cx="90" cy="130" r="12" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/>
  <text x="90" y="108" text-anchor="middle" font-size="13" fill="#1f2937">ผู้ส่งออก (ผู้ขาย)</text>
  <circle cx="240" cy="130" r="12" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/>
  <text x="240" y="108" text-anchor="middle" font-size="13" fill="#1f2937">ท่าต้นทาง</text>
  <circle cx="390" cy="130" r="12" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/>
  <text x="390" y="108" text-anchor="middle" font-size="13" fill="#1f2937">ทางทะเล</text>
  <circle cx="540" cy="130" r="12" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/>
  <text x="540" y="108" text-anchor="middle" font-size="13" fill="#1f2937">ท่าปลายทาง</text>
  <circle cx="690" cy="130" r="12" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/>
  <text x="690" y="108" text-anchor="middle" font-size="13" fill="#1f2937">ผู้รับ (ผู้ซื้อ)</text>
  <rect x="240" y="204" width="300" height="34" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="390" y="226" text-anchor="middle" font-size="13" fill="#1f2937">ผู้ขนส่งดูแลสินค้าตั้งแต่รับจนส่งมอบ</text>
  <rect x="90" y="256" width="600" height="34" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="390" y="278" text-anchor="middle" font-size="13" fill="#1f2937">ประกันภัยขนส่ง ผู้เอาประกันขึ้นอยู่กับข้อตกลงการค้า</text>
  <line x1="240" y1="148" x2="240" y2="182" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="252" y="190" text-anchor="start" font-size="12" fill="#dc2626">ตัวอย่าง CIF/FOB: โอนความเสี่ยงเมื่อขึ้นเรือ</text>
  <text x="380" y="60" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">เส้นทางขนส่งสินค้าส่งออกทางเรือ และช่วงความรับผิดชอบ</text>
</svg>
