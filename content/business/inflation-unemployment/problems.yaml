  - ต้นทุนการผลิตสูงขึ้น ผู้ผลิตขึ้นราคา
  solution: เมื่อต้นทุน เช่น น้ำมัน ค่าแรง วัตถุดิบ สูงขึ้น ผู้ผลิตขึ้นราคา เรียกว่าเงินเฟ้อจากต้นทุนผลักดัน ส่วนเงินเฟ้อจากอุปสงค์ดึงเกิดเมื่อความต้องการซื้อรวมสูงกว่าความสามารถในการผลิต
