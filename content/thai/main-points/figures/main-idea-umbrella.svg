<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="sans-serif">
<title>ร่มใจความสำคัญ</title>
<rect x="0" y="0" width="760" height="400" fill="#fff"/>
<path d="M80,170 Q380,-20 680,170 Z" fill="#e8f0fb" stroke="#1f5fbf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="380.0" y="102.0" font-size="22" text-anchor="middle" fill="#1f5fbf" font-weight="bold">ใจความสำคัญ</text>
<text x="380.0" y="140.0" font-size="26" text-anchor="middle" fill="#111" font-weight="bold">ผักบุ้งเป็นผักที่ปลูกง่าย</text>
<line x1="140.0" y1="170.0" x2="140.0" y2="245.0" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<rect x="28.0" y="245.0" width="224.0" height="70.0" rx="10" fill="#fff7e6" stroke="#b9770e" stroke-width="2"/>
<text x="140.0" y="275.0" font-size="16" text-anchor="middle" fill="#8a5a0b" font-weight="bold">รายละเอียด</text>
<text x="140.0" y="302.0" font-size="19" text-anchor="middle" fill="#111" font-weight="normal">โตเร็ว เก็บกินได้ไว</text>
<line x1="380.0" y1="170.0" x2="380.0" y2="245.0" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<rect x="268.0" y="245.0" width="224.0" height="70.0" rx="10" fill="#fff7e6" stroke="#b9770e" stroke-width="2"/>
<text x="380.0" y="275.0" font-size="16" text-anchor="middle" fill="#8a5a0b" font-weight="bold">รายละเอียด</text>
<text x="380.0" y="302.0" font-size="19" text-anchor="middle" fill="#111" font-weight="normal">ขึ้นได้ทั้งในดินและในน้ำ</text>
<line x1="620.0" y1="170.0" x2="620.0" y2="245.0" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<rect x="508.0" y="245.0" width="224.0" height="70.0" rx="10" fill="#fff7e6" stroke="#b9770e" stroke-width="2"/>
<text x="620.0" y="275.0" font-size="16" text-anchor="middle" fill="#8a5a0b" font-weight="bold">รายละเอียด</text>
<text x="620.0" y="302.0" font-size="19" text-anchor="middle" fill="#111" font-weight="normal">ใช้พื้นที่ปลูกน้อย</text>
<text x="380.0" y="370.0" font-size="18" text-anchor="middle" fill="#333" font-weight="normal">ใจความสำคัญคลุมรายละเอียดทุกข้อ เหมือนร่มที่คลุมคนทุกคนข้างใต้</text>
</svg>
