<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="sans-serif">
<title>บอกอาการให้ผู้ใหญ่เข้าใจด้วยคำถาม 5 ข้อ</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="0" y="0" width="640" height="400" fill="#ffffff"/>
<text x="320.0" y="30.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">บอกอาการให้ครบ 5 ข้อ</text>
<rect x="20.0" y="52.0" width="600.0" height="62.0" rx="8" fill="#f5f9ff" stroke="#7a9cc6" stroke-width="1.5" />
<text x="36.0" y="78.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">1 เป็นอะไร</text>
<text x="36.0" y="100.0" font-size="13" text-anchor="start" fill="#444">ปวดท้อง ตัวร้อน ไอ คัน</text>
<text x="600.0" y="90.0" font-size="15" text-anchor="end" fill="#1a3d7c">"หนูปวดท้องค่ะ"</text>
<rect x="20.0" y="120.0" width="600.0" height="62.0" rx="8" fill="#f5f9ff" stroke="#7a9cc6" stroke-width="1.5" />
<text x="36.0" y="146.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">2 ตรงไหน</text>
<text x="36.0" y="168.0" font-size="13" text-anchor="start" fill="#444">ชี้หรือบอกตำแหน่ง</text>
<text x="600.0" y="158.0" font-size="15" text-anchor="end" fill="#1a3d7c">"ตรงรอบสะดือ"</text>
<rect x="20.0" y="188.0" width="600.0" height="62.0" rx="8" fill="#f5f9ff" stroke="#7a9cc6" stroke-width="1.5" />
<text x="36.0" y="214.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">3 เป็นตั้งแต่เมื่อไร</text>
<text x="36.0" y="236.0" font-size="13" text-anchor="start" fill="#444">บอกเวลาหรือเหตุการณ์</text>
<text x="600.0" y="226.0" font-size="15" text-anchor="end" fill="#1a3d7c">"ตั้งแต่หลังกินข้าวกลางวัน"</text>
<rect x="20.0" y="256.0" width="600.0" height="62.0" rx="8" fill="#f5f9ff" stroke="#7a9cc6" stroke-width="1.5" />
<text x="36.0" y="282.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">4 มากแค่ไหน</text>
<text x="36.0" y="304.0" font-size="13" text-anchor="start" fill="#444">ให้คะแนนความเจ็บ 0–10</text>
<text x="600.0" y="294.0" font-size="15" text-anchor="end" fill="#1a3d7c">"เจ็บประมาณ 6"</text>
<rect x="20.0" y="324.0" width="600.0" height="62.0" rx="8" fill="#f5f9ff" stroke="#7a9cc6" stroke-width="1.5" />
<text x="36.0" y="350.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">5 มีอาการอื่นไหม</text>
<text x="36.0" y="372.0" font-size="13" text-anchor="start" fill="#444">อาเจียน ท้องเสีย ไข้ ผื่น</text>
<text x="600.0" y="362.0" font-size="15" text-anchor="end" fill="#1a3d7c">"ถ่ายเหลว 2 ครั้ง"</text>
</svg>
