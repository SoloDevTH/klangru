<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="sans-serif" font-size="15">
  <title>ซ้าย สแตกที่ใส่ 4, 9, 1 ตามลำดับ 1 อยู่บนสุด push และ pop ทำที่ด้านบน เข้าทีหลังออกก่อน ขวา คิวที่ใส่ A01, A02, A03 enqueue เข้าท้ายคิว dequeue ออกจากหัวคิว เข้าก่อนออกก่อน</title>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <rect x="0" y="0" width="800" height="380" fill="#ffffff"/>
  <text x="170.0" y="34.0" font-size="17" text-anchor="middle" fill="#1d4ed8" font-weight="bold" xml:space="preserve">สแตก (stack) — เข้าทีหลัง ออกก่อน</text>
  <rect x="110.0" y="246.0" width="120.0" height="54.0" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="170.0" y="281.0" font-size="22" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">4</text>
  <rect x="110.0" y="192.0" width="120.0" height="54.0" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="170.0" y="227.0" font-size="22" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">9</text>
  <rect x="110.0" y="138.0" width="120.0" height="54.0" rx="0" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
  <text x="170.0" y="173.0" font-size="22" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">1</text>
  <polyline points="104.0,120.0 104.0,304.0 236.0,304.0 236.0,120.0" fill="none" stroke="#374151" stroke-width="3"/>
  <line x1="135.0" y1="72.0" x2="135.0" y2="132.0" stroke="#15803d" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="128.0" y="66.0" font-size="15" text-anchor="end" fill="#15803d" font-weight="bold" xml:space="preserve">push</text>
  <line x1="205.0" y1="132.0" x2="205.0" y2="72.0" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="212.0" y="66.0" font-size="15" text-anchor="start" fill="#b91c1c" font-weight="bold" xml:space="preserve">pop</text>
  <text x="246.0" y="171.0" font-size="14" text-anchor="start" fill="#1d4ed8" xml:space="preserve">← บนสุด (top)</text>
  <text x="170.0" y="336.0" font-size="14" text-anchor="middle" fill="#4b5563" xml:space="preserve">ใช้: ปุ่มย้อนกลับ ยกเลิกการทำ (undo)</text>
  <text x="170.0" y="358.0" font-size="14" text-anchor="middle" fill="#4b5563" xml:space="preserve">ตรวจวงเล็บ กองการเรียกฟังก์ชัน</text>
  <text x="590.0" y="34.0" font-size="17" text-anchor="middle" fill="#15803d" font-weight="bold" xml:space="preserve">คิว (queue) — เข้าก่อน ออกก่อน</text>
  <line x1="415.0" y1="164.0" x2="705.0" y2="164.0" stroke="#374151" stroke-width="3"/>
  <line x1="415.0" y1="236.0" x2="705.0" y2="236.0" stroke="#374151" stroke-width="3"/>
  <rect x="429.0" y="170.0" width="82.0" height="60.0" rx="4" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <text x="470.0" y="207.0" font-size="19" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">A01</text>
  <rect x="519.0" y="170.0" width="82.0" height="60.0" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="560.0" y="207.0" font-size="19" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">A02</text>
  <rect x="609.0" y="170.0" width="82.0" height="60.0" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="650.0" y="207.0" font-size="19" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">A03</text>
  <line x1="411.0" y1="200.0" x2="355.0" y2="200.0" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="383.0" y="148.0" font-size="15" text-anchor="middle" fill="#b91c1c" font-weight="bold" xml:space="preserve">dequeue</text>
  <text x="383.0" y="260.0" font-size="14" text-anchor="middle" fill="#4b5563" xml:space="preserve">หัวคิว</text>
  <line x1="765.0" y1="200.0" x2="709.0" y2="200.0" stroke="#15803d" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="737.0" y="148.0" font-size="15" text-anchor="middle" fill="#15803d" font-weight="bold" xml:space="preserve">enqueue</text>
  <text x="737.0" y="260.0" font-size="14" text-anchor="middle" fill="#4b5563" xml:space="preserve">ท้ายคิว</text>
  <text x="590.0" y="336.0" font-size="14" text-anchor="middle" fill="#4b5563" xml:space="preserve">ใช้: คิวรับบริการ คิวพิมพ์งาน</text>
  <text x="590.0" y="358.0" font-size="14" text-anchor="middle" fill="#4b5563" xml:space="preserve">การท่องกราฟแบบกว้างก่อน</text>
</svg>
