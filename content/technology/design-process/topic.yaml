id: technology.design.design-process
subject: technology
title:
  th: กระบวนการออกแบบเชิงวิศวกรรม
  en: The engineering design process
summary: หกขั้นของการออกแบบเชิงวิศวกรรม กรอบปัญหา เกณฑ์ความสำเร็จและข้อจำกัด ระดมแนวคิด เมทริกซ์ตัดสินใจ สร้างต้นแบบ ทดสอบอย่างยุติธรรม ปรับปรุงซ้ำ และนำเสนอ
difficulty: 3
minutes: 35
prerequisites:
- technology.design.technology-concepts
encompasses:
- id: technology.design.technology-concepts
  weight: 0.2
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  title: กระบวนการออกแบบเชิงวิศวกรรม
  src: process.svg
  alt: ผังกระบวนการออกแบบเชิงวิศวกรรม 6 ขั้น 1 ระบุปัญหา (5W1H เกณฑ์ความสำเร็จ ข้อจำกัด) → 2 รวบรวมข้อมูล (ผู้ใช้ วิธีที่มีอยู่ ความรู้วิทยาศาสตร์) → 3 ออกแบบวิธีแก้ (หลายแบบ ภาพร่าง เมทริกซ์ตัดสินใจ) → 4 วางแผนและสร้าง (ขั้นตอน วัสดุ งบ สร้างต้นแบบ) → 5 ทดสอบ ปรับปรุง (ทดสอบยุติธรรม หาข้อบกพร่อง) → 6 นำเสนอ (ผลการแก้ปัญหาและชิ้นงาน) มีลูกศรจากขั้น 5 กลับไปขั้น 3 เขียนว่าไม่ผ่านเกณฑ์ กลับไปปรับแบบ
- type: figure
  title: เมทริกซ์ตัดสินใจ
  src: matrix.svg
  alt: 'ตารางเมทริกซ์ตัดสินใจกล่องเก็บน้ำแข็งสามแบบ คะแนน 1–5 เกณฑ์เก็บความเย็น น้ำหนัก 3: A 5, B 4, C 2 เกณฑ์ราคาถูก น้ำหนัก 2: A 2, B 4, C 5 เกณฑ์ยกง่าย น้ำหนัก 1: A 5, B 2, C 5 เกณฑ์ใช้วัสดุเหลือใช้ น้ำหนัก 2: A 2, B 4, C 3 (A กล่องโฟม B ลังใส่แกลบ C ถังห่อผ้าเปียก)'
- type: worked-example
  title: สรุปกรอบปัญหาด้วย 5W1H
  problem: นักเรียนเดินขึ้นบันไดอาคารเรียนตอนฝนตกแล้วลื่นบ่อย สรุปกรอบของปัญหา เกณฑ์ความสำเร็จ และข้อจำกัด
  steps:
  - text: 'ใคร: นักเรียนและครูที่ใช้บันได ที่ไหน: บันไดหน้าอาคาร 2 ซึ่งไม่มีหลังคา เมื่อไร: ช่วงฝนตก'
  - text: 'อะไรและทำไม: ขั้นบันไดกระเบื้องเปียกแล้วลื่น มีคนล้ม 3 ครั้งในเดือนที่แล้ว'
  - text: 'เกณฑ์ความสำเร็จ: เมื่อเปียก รองเท้านักเรียนไม่ลื่นไถลบนขั้นบันได และไม่มีคนล้มตลอดภาคเรียน'
    why: เกณฑ์ต้องวัดหรือตรวจได้
  - text: 'ข้อจำกัด: งบไม่เกิน 1,500 บาท ทำเสร็จในวันหยุด 2 วัน ไม่ทำให้เกิดขอบสะดุด และได้รับอนุญาตจากโรงเรียน'
  answer: กรอบปัญหาบอกผู้ใช้ สถานที่ เวลา สาเหตุ เกณฑ์ที่วัดได้ และข้อจำกัดครบ
- type: check
  problem: technology.design.design-process.p002
  prompt: ลองแยกเกณฑ์กับข้อจำกัด
- type: figure
  title: ผลทดสอบต้นแบบ
  src: ice-test.svg
  alt: แผนภูมิแท่งมวลน้ำแข็งที่เหลือหลัง 4 ชั่วโมง เริ่ม 500 g ทดสอบ 2 ครั้ง A กล่องโฟม 380 และ 370 g B ลังใส่แกลบ 360 และ 350 g C ถังห่อผ้าเปียก 240 และ 260 g เส้นประสีแดงที่ 350 g คือเกณฑ์ร้อยละ 70
- type: worked-example
  title: ใช้ผลทดสอบปรับปรุงแบบ
  problem: จากผลทดสอบ แบบ B เหลือน้ำแข็งเฉลี่ย 355 g (71%) ผ่านเกณฑ์แบบเฉียดฉิว และพบว่าฝาปิดไม่สนิท ควรทำอย่างไรต่อ
  steps:
  - text: 'ระบุข้อบกพร่อง: ฝามีช่อง อากาศร้อนเข้าได้ และผลสองครั้งอยู่ที่เส้นเกณฑ์พอดี'
  - text: 'หาแนวทาง: ทำฝาให้ซ้อนทับขอบ 2 cm และบุฟอยล์ที่ฝา (นำจุดเด่นของแบบ A มาใช้)'
    why: การรวมจุดเด่นของหลายแบบช่วยให้ได้แบบที่ดีขึ้น
  - text: 'ตรวจข้อจำกัด: ฟอยล์ราคา 15 บาท งบรวมยังไม่เกิน 150 บาท'
  - text: ทดสอบซ้ำแบบเดิม (500 g, 4 ชั่วโมง, ที่เดิม) สองครั้ง แล้วเทียบกับผลเดิม
  answer: แก้ฝาและบุฟอยล์ ตรวจงบ แล้วทดสอบซ้ำอย่างยุติธรรม
- type: check
  problem: technology.design.design-process.p011
glossary:
- term: กระบวนการออกแบบเชิงวิศวกรรม
  definition: ขั้นตอนแก้ปัญหาอย่างเป็นระบบ 6 ขั้น ตั้งแต่ระบุปัญหาจนถึงนำเสนอ และวนกลับเพื่อปรับปรุงได้
- term: เกณฑ์ความสำเร็จ
  definition: สิ่งที่วิธีแก้ปัญหาต้องทำได้ เขียนให้วัดหรือตรวจได้
- term: ข้อจำกัด
  definition: ขอบเขตที่งานต้องอยู่ภายใน เช่น งบ เวลา วัสดุ ความปลอดภัย และผลต่อคนและสิ่งแวดล้อม
- term: เมทริกซ์ตัดสินใจ
  definition: ตารางให้คะแนนทางเลือกตามเกณฑ์ที่มีน้ำหนักต่างกัน แล้วรวมคะแนนเพื่อเลือกอย่างเป็นระบบ
- term: ต้นแบบ
  definition: ชิ้นงานรุ่นทดลองที่สร้างเพื่อทดสอบว่าแนวคิดใช้ได้จริงหรือไม่ก่อนทำจริง
flashcards:
- front: 6 ขั้นของการออกแบบเชิงวิศวกรรม
  back: ระบุปัญหา → รวบรวมข้อมูล → ออกแบบ → วางแผนและสร้าง → ทดสอบและปรับปรุง → นำเสนอ
- front: เกณฑ์ความสำเร็จ กับ ข้อจำกัด
  back: เกณฑ์คือสิ่งที่ต้องทำได้ ข้อจำกัดคือขอบเขต เช่น งบ เวลา วัสดุ
- front: คะแนนรวมในเมทริกซ์ตัดสินใจ
  back: ผลรวมของ (น้ำหนักของเกณฑ์ × คะแนน)
- front: ต้นแบบไม่ผ่านเกณฑ์
  back: ระบุจุดที่ล้มเหลว ปรับปรุง แล้วทดสอบซ้ำอย่างยุติธรรม
