id: english.grammar.be-have-there
subject: english
title: { th: "verb to be, have/has และ there is/are", en: "Verb to be, have/has and there is/are" }
summary: ใช้ am is are บอกว่าเป็นอะไร อยู่ที่ไหน รู้สึกอย่างไร ใช้ have has บอกความเป็นเจ้าของ และ there is there are บอกว่ามีอะไรอยู่ที่ไหน
difficulty: 1.5
minutes: 30
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - type: figure
    src: room.svg
    alt: "ภาพห้อง มีโต๊ะหนึ่งตัว บนโต๊ะมีหนังสือสามเล่ม (ป้าย three books) และโคมไฟหนึ่งอัน (a lamp) ใต้โต๊ะมีแมวหนึ่งตัว (a cat) ข้างโต๊ะมีเก้าอี้สองตัว ซ้ายหนึ่งขวาหนึ่ง (two chairs) บนผนังมีนาฬิกาหนึ่งเรือน (a clock) และบนพื้นมีลูกบอลหนึ่งลูก (a ball)"
    caption: "There are three books on the table. There is a cat under the table."
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.grammar.be-have-there.p001, prompt: "ประธานคือ I ใช้ be ตัวไหน" }
  - type: worked-example
    title: เปลี่ยนเป็นประโยคปฏิเสธและคำถาม
    problem: "เปลี่ยนสองประโยคนี้เป็นปฏิเสธและคำถาม: *Mali is a nurse.* และ *Mali has a car.*"
    steps:
      - text: "ประโยคแรกมี is ปฏิเสธใส่ not หลัง is: *Mali **isn't** a nurse.*"
      - text: "คำถามย้าย is ขึ้นหน้าประธาน: ***Is** Mali a nurse?*"
        why: "verb to be สร้างคำถามเองได้ ไม่ต้องใช้ do หรือ does"
      - text: "ประโยคที่สองมีกริยา has ซึ่งเป็นกริยาทั่วไป ปฏิเสธต้องใช้ doesn't: *Mali **doesn't have** a car.*"
        why: "มี does แล้ว has จึงกลับเป็น have"
      - text: "คำถามใช้ Does ขึ้นต้น: ***Does** Mali **have** a car?*"
    answer: "*Mali isn't a nurse. / Is Mali a nurse?* และ *Mali doesn't have a car. / Does Mali have a car?*"
  - { type: check, problem: english.grammar.be-have-there.p006, prompt: "นับดูว่าหนังสือมีกี่เล่ม" }
  - type: worked-example
    title: เลือก have หรือ there is
    problem: "แปลเป็นภาษาอังกฤษ: \"บ้านฉันมีสวนเล็ก ๆ ในสวนมีต้นมะม่วงสองต้น\""
    steps:
      - text: "ประโยคแรกบอกว่าบ้านของฉัน **เป็นเจ้าของ** สวน ใช้ have/has ได้: *My house has a small garden.*"
        why: "ประธาน my house = it จึงใช้ has"
      - text: "ประโยคที่สองบอกว่ามีอะไร **อยู่ที่ไหน** ใช้ there is/are"
      - text: "ต้นมะม่วงมีสองต้นเป็นพหูพจน์ ใช้ there are: *There are two mango trees in the garden.*"
    answer: "*My house has a small garden. There are two mango trees in the garden.*"
glossary:
  - { term: verb to be, definition: "กริยา am, is, are ใช้บอกว่าเป็นอะไร อยู่ที่ไหน หรือรู้สึกอย่างไร" }
  - { term: have / has, definition: "กริยาบอกความเป็นเจ้าของ has ใช้กับ he, she, it" }
  - { term: there is / there are, definition: "ใช้บอกว่ามีสิ่งใดอยู่ที่ใด there is กับสิ่งเดียวหรือนับไม่ได้ there are กับหลายสิ่ง" }
  - { term: คำย่อ (contraction), definition: "การรวมสองคำเป็นคำเดียวด้วยเครื่องหมาย ' เช่น I'm = I am, isn't = is not" }
  - { term: คำตอบสั้น (short answer), definition: "คำตอบ Yes/No ที่ใช้กริยาช่วยตัวเดียวกับคำถาม เช่น Yes, I am. / No, she doesn't." }
flashcards:
  - { front: "I ___ / he, she, it ___ / you, we, they ___", back: "am / is / are" }
  - { front: "\"เธอมีความสุข\" ภาษาอังกฤษพูดว่าอย่างไร", back: "She is happy. (ต้องมี is หน้าคำคุณศัพท์)" }
  - { front: "She ___ (not / have) a phone.", back: "She doesn't have a phone. (หลัง doesn't ใช้ have)" }
  - { front: "\"มีวัดอยู่ใกล้บ้าน\" ใช้ have หรือ there is", back: "There is a temple near my house. (บอกว่ามีอยู่ที่ไหน ใช้ there is/are)" }
  - { front: "Are you a student? ตอบรับแบบสั้นอย่างไร", back: "Yes, I am. (ห้ามย่อเป็น Yes, I'm.)" }
