id: business.accounting.financial-statements
subject: business
title: { th: "งบการเงิน: งบแสดงฐานะการเงิน งบกำไรขาดทุน และงบกระแสเงินสด", en: "Financial statements: financial position, profit or loss, and cash flows" }
summary: รายการปรับปรุง (ค่าเสื่อมราคา ค่าใช้จ่ายค้างจ่าย รายได้รับล่วงหน้า) ต้นทุนขาย การจัดทำงบแสดงฐานะการเงิน งบกำไรขาดทุน งบกระแสเงินสดอย่างง่าย และความเชื่อมโยงของงบ
difficulty: 5
minutes: 40
prerequisites: [business.accounting.double-entry]
encompasses:
  - { id: business.accounting.double-entry, weight: 0.4 }
  - { id: business.accounting.equation, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - { type: check, problem: business.accounting.financial-statements.p003, prompt: "ลองคิดค่าเสื่อมราคาก่อนดูตัวอย่าง" }
  - type: worked-example
    title: ปรับปรุงรายการสิ้นปีของร้านรับพิมพ์งาน
    problem: "ร้านรับพิมพ์งาน (สมมติ) ปิดบัญชี 31 ธันวาคม (ก) เครื่องพิมพ์ราคาทุน $150{,}000$ บาท มูลค่าคงเหลือ $30{,}000$ บาท อายุการให้ประโยชน์ 5 ปี (ข) ค่าจ้างพนักงานเดือนธันวาคม $7{,}500$ บาทยังไม่ได้จ่าย (ค) วันที่ 1 พฤศจิกายน รับค่าพิมพ์ใบปลิวรายเดือนล่วงหน้า 6 เดือน $24{,}000$ บาท บันทึกเป็นรายได้รับล่วงหน้า หารายการปรับปรุงและผลต่อกำไรสุทธิ"
    steps:
      - text: "(ก) ค่าเสื่อมราคา $= \\dfrac{150{,}000 - 30{,}000}{5} = 24{,}000$ บาท: Dr. ค่าเสื่อมราคา $24{,}000$ / Cr. ค่าเสื่อมราคาสะสม $24{,}000$"
        why: "มูลค่าคงเหลือคือส่วนที่คาดว่าจะขายได้เมื่อเลิกใช้ ไม่ต้องตัดเป็นค่าใช้จ่าย"
      - text: "(ข) Dr. เงินเดือน $7{,}500$ / Cr. ค่าใช้จ่ายค้างจ่าย $7{,}500$"
        why: "พนักงานทำงานในปีนี้แล้ว ค่าใช้จ่ายจึงเป็นของปีนี้ แม้จะจ่ายเงินปีหน้า"
      - text: "(ค) ให้บริการแล้ว 2 เดือน (พ.ย. ธ.ค.) $= 24{,}000 \\times \\dfrac{2}{6} = 8{,}000$ บาท: Dr. รายได้รับล่วงหน้า $8{,}000$ / Cr. รายได้ค่าบริการ $8{,}000$"
      - text: "ผลต่อกำไร: $-24{,}000 - 7{,}500 + 8{,}000 = -23{,}500$ บาท กำไรหลังปรับปรุงน้อยกว่าก่อนปรับปรุง $23{,}500$ บาท"
      - text: "ผลต่องบแสดงฐานะการเงิน: เครื่องพิมพ์สุทธิ $126{,}000$ บาท ค่าใช้จ่ายค้างจ่าย $7{,}500$ บาท รายได้รับล่วงหน้าเหลือ $16{,}000$ บาท (หนี้สิน)"
    answer: "ปรับปรุงสามรายการ กำไรสุทธิลดลง $23{,}500$ บาท"
  - type: worked-example
    title: ต้นทุนขายและกำไรของมินิมาร์ต
    problem: "มินิมาร์ต (สมมติ) มีสินค้าคงเหลือต้นปี $55{,}000$ บาท ซื้อสุทธิระหว่างปี $240{,}000$ บาท สินค้าคงเหลือปลายปี $62{,}000$ บาท ขายได้ $360{,}000$ บาท ค่าใช้จ่ายในการขายและบริหาร $85{,}000$ บาท หาต้นทุนขาย กำไรขั้นต้น และกำไรสุทธิ"
    steps:
      - text: "ต้นทุนขาย $= 55{,}000 + 240{,}000 - 62{,}000 = 233{,}000$ บาท"
        why: "สินค้าที่มีให้ขายทั้งหมดคือต้นงวดบวกซื้อ ส่วนที่ยังเหลือปลายปียังไม่ได้ขาย จึงหักออก"
      - text: "กำไรขั้นต้น $= 360{,}000 - 233{,}000 = 127{,}000$ บาท"
      - text: "กำไรสุทธิ $= 127{,}000 - 85{,}000 = 42{,}000$ บาท"
      - text: "สินค้าคงเหลือ $62{,}000$ บาทไปแสดงเป็นสินทรัพย์หมุนเวียนในงบแสดงฐานะการเงิน"
    answer: "ต้นทุนขาย $233{,}000$ บาท กำไรขั้นต้น $127{,}000$ บาท กำไรสุทธิ $42{,}000$ บาท"
  - type: figure
    src: statements-link.svg
    alt: "แผนภาพงบการเงินสี่งบของร้านเครื่องเขียน งบกำไรขาดทุน รายได้ 450,000 ลบค่าใช้จ่าย 350,000 กำไรสุทธิ 100,000 มีลูกศรไปที่งบแสดงการเปลี่ยนแปลงส่วนของเจ้าของ ทุนต้นงวด 200,000 บวกกำไรสุทธิ 100,000 ลบถอนใช้ 24,000 เท่ากับ 276,000 มีลูกศรทุนปลายงวดไปที่งบแสดงฐานะการเงิน ณ 31 ธันวาคม เงินสด 225,000 สินทรัพย์อื่น 138,000 รวมสินทรัพย์ 363,000 หนี้สิน 87,000 ส่วนของเจ้าของ 276,000 รวม 363,000 และงบกระแสเงินสด ดำเนินงานบวก 59,000 ลงทุนลบ 60,000 จัดหาเงินบวก 226,000 เงินสดเพิ่มขึ้นสุทธิ 225,000 มีลูกศรเงินสดปลายงวดไปที่งบแสดงฐานะการเงิน"
    caption: "กำไรสุทธิไหลไปส่วนของเจ้าของ และเงินสดปลายงวดตรงกับงบแสดงฐานะการเงิน"
  - { type: check, problem: business.accounting.financial-statements.p010, prompt: "ลืมปรับปรุงแล้วงบผิดตรงไหน" }
glossary:
  - { term: เกณฑ์คงค้าง, definition: "การรับรู้รายได้เมื่อให้บริการหรือส่งมอบสินค้า และรับรู้ค่าใช้จ่ายเมื่อเกิดขึ้น ไม่ขึ้นกับวันที่รับหรือจ่ายเงิน" }
  - { term: รายการปรับปรุง, definition: "รายการที่บันทึกวันสิ้นงวดเพื่อให้รายได้ ค่าใช้จ่าย สินทรัพย์ และหนี้สินถูกต้องตามงวด" }
  - { term: ค่าเสื่อมราคา, definition: "การกระจายราคาทุนของสินทรัพย์ที่ใช้ได้หลายปีเป็นค่าใช้จ่ายในแต่ละปี" }
  - { term: ค่าเสื่อมราคาสะสม, definition: "ผลรวมค่าเสื่อมราคาที่ตัดไปแล้ว แสดงเป็นรายการหักจากราคาทุนของสินทรัพย์" }
  - { term: ค่าใช้จ่ายค้างจ่าย, definition: "ค่าใช้จ่ายที่เกิดขึ้นแล้วแต่ยังไม่ได้จ่าย เป็นหนี้สิน" }
  - { term: รายได้รับล่วงหน้า, definition: "เงินที่รับมาแล้วแต่ยังไม่ได้ส่งมอบสินค้าหรือบริการ เป็นหนี้สินจนกว่าจะส่งมอบ" }
  - { term: ต้นทุนขาย, definition: "สินค้าคงเหลือต้นงวด + ซื้อสุทธิ − สินค้าคงเหลือปลายงวด" }
  - { term: งบแสดงฐานะการเงิน, definition: "งบที่แสดงสินทรัพย์ หนี้สิน และส่วนของเจ้าของ ณ วันใดวันหนึ่ง" }
  - { term: งบกระแสเงินสด, definition: "งบที่แสดงเงินสดรับและจ่ายในช่วงเวลาหนึ่ง แยกเป็นกิจกรรมดำเนินงาน ลงทุน และจัดหาเงิน" }
  - { term: TFRS for NPAEs, definition: "มาตรฐานการรายงานทางการเงินสำหรับกิจการที่ไม่มีส่วนได้เสียสาธารณะ ใช้กับกิจการส่วนใหญ่ที่ไม่ได้จดทะเบียนในตลาดหลักทรัพย์" }
flashcards:
  - { front: "ค่าเสื่อมราคาแบบเส้นตรง", back: "(ราคาทุน − มูลค่าคงเหลือ) ÷ อายุการให้ประโยชน์" }
  - { front: "ต้นทุนขาย", back: "สินค้าคงเหลือต้นงวด + ซื้อสุทธิ − สินค้าคงเหลือปลายงวด" }
  - { front: "กิจกรรมสามกลุ่มในงบกระแสเงินสด", back: "ดำเนินงาน (ขาย จ่ายค่าใช้จ่าย) · ลงทุน (ซื้อขายสินทรัพย์ระยะยาว) · จัดหาเงิน (เงินลงทุนของเจ้าของ กู้ คืนเงินกู้ ถอนใช้)" }
  - { front: "งบทั้งสามเชื่อมกันอย่างไร", back: "กำไรสุทธิ → ส่วนของเจ้าของ → งบแสดงฐานะการเงิน และเงินสดปลายงวดในงบกระแสเงินสดเท่ากับเงินสดในงบแสดงฐานะการเงิน" }
  - { front: "รับเงินค่าบริการล่วงหน้า บันทึกอย่างไร", back: "ตอนรับเงินเป็นหนี้สิน (รายได้รับล่วงหน้า) เมื่อให้บริการแล้วจึงโอนเป็นรายได้" }
