  stem: 'แผนของปอ อายุ 15 ปี: จันทร์–อาทิตย์วิ่งเร็วเต็มที่ทุกวัน วันละ 60 นาที เริ่มวิ่งทันทีหลังลงจากรถ ไม่บันทึกผล และนอนตีหนึ่งเพื่อดูไฮไลต์ฟุตบอล แผนนี้มีจุดที่ควรแก้ข้อใด (เลือกทุกข้อที่ถูก)'
