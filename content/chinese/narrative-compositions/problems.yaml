  choices:
  - id: a
    text: เวลา (时间 (shíjiān))
    feedback: ประโยคนี้มี 这一天 (zhè yì tiān) แต่ประโยคนี้เน้นความรู้สึก
  - id: b
    text: สถานที่ (地点 (dìdiǎn))
