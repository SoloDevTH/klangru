id: business.stats.descriptive
subject: business
title: { th: สถิติเชิงพรรณนาสำหรับข้อมูลธุรกิจ, en: Descriptive statistics for business data }
summary: สรุปข้อมูลยอดขาย ราคา และลูกค้าด้วยค่ากลาง การกระจาย สัมประสิทธิ์การแปรผัน ร้อยละการเปลี่ยนแปลง ดัชนีราคา และอ่านกราฟที่ชวนเข้าใจผิด
difficulty: 4.5
minutes: 40
prerequisites: [math.stats.central-tendency, math.stats.dispersion, math.stats.data-display, math.number.ratio-percent]
encompasses:
  - { id: math.stats.central-tendency, weight: 0.4 }
  - { id: math.stats.dispersion, weight: 0.3 }
  - { id: math.stats.data-display, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: monthly-sales.svg
    alt: "แผนภูมิแท่งยอดขายรายเดือนของร้านกาแฟ หน่วยพันบาท มกราคม 120 กุมภาพันธ์ 135 มีนาคม 128 เมษายน 150 พฤษภาคม 142 มิถุนายน 165 มีเส้นประสีแดงแนวนอนที่ 140 คือค่าเฉลี่ย แกนตั้งเริ่มที่ 0 ถึง 180"
    caption: "ยอดขายหกเดือนแรกของร้านกาแฟ (ข้อมูลสมมติ)"
  - type: worked-example
    title: สรุปยอดขายหกเดือนของร้านกาแฟ
    problem: "ยอดขายเดือนมกราคมถึงมิถุนายนของร้านกาแฟ (พันบาท) คือ $120, 135, 128, 150, 142, 165$ หาค่าเฉลี่ย มัธยฐาน ร้อยละการเปลี่ยนแปลงจากมกราคมถึงมิถุนายน และ SD แบบกลุ่มตัวอย่าง (STDEV.S)"
    steps:
      - text: "ค่าเฉลี่ย $= \\dfrac{120 + 135 + 128 + 150 + 142 + 165}{6} = \\dfrac{840}{6} = 140$ พันบาท"
      - text: "เรียงข้อมูล $120, 128, 135, 142, 150, 165$ มัธยฐาน $= \\dfrac{135 + 142}{2} = 138.5$ พันบาท"
        why: "ข้อมูลมี 6 ตัว (จำนวนคู่) มัธยฐานจึงเป็นค่าเฉลี่ยของสองตัวกลาง"
      - text: "ร้อยละการเปลี่ยนแปลง $= \\dfrac{165 - 120}{120} \\times 100 = 37.5\\%$"
        why: "หารด้วยค่าเดิม (มกราคม) เพราะถามว่าโตขึ้นกี่เปอร์เซ็นต์จากจุดเริ่ม"
      - text: "SD แบบกลุ่มตัวอย่าง (หารด้วย $n - 1 = 5$) $\\approx 16.1$ พันบาท หรือในสเปรดชีตใช้ `=STDEV.S(B2:B7)`"
      - text: "CV $\\approx \\dfrac{16.1}{140} \\times 100 \\approx 11.5\\%$ ยอดขายแกว่งรอบค่าเฉลี่ยราว $11.5\\%$ ของค่าเฉลี่ย"
    answer: "ค่าเฉลี่ย $140$ พันบาท มัธยฐาน $138.5$ พันบาท โต $37.5\\%$ SD $\\approx 16.1$ พันบาท"
  - { type: check, problem: business.stats.descriptive.p003, prompt: "หารด้วยค่าเดิมหรือค่าใหม่" }
  - type: worked-example
    title: ดัชนีราคาวัตถุดิบของร้านก๋วยเตี๋ยว
    problem: "ร้านก๋วยเตี๋ยว (สมมติ) ซื้อวัตถุดิบต่อสัปดาห์ เส้น $20$ กก. หมู $10$ กก. ผัก $15$ กก. ราคาปีฐานกิโลกรัมละ $40, 140, 30$ บาท ปีนี้ $44, 168, 36$ บาท หาดัชนีราคาแบบรวมถ่วงน้ำหนัก"
    steps:
      - text: "ค่าตะกร้าปีฐาน $\\sum p_0 q_0 = 20(40) + 10(140) + 15(30) = 800 + 1{,}400 + 450 = 2{,}650$ บาท"
      - text: "ค่าตะกร้าเดิมด้วยราคาปีนี้ $\\sum p_1 q_0 = 20(44) + 10(168) + 15(36) = 880 + 1{,}680 + 540 = 3{,}100$ บาท"
        why: "ใช้ปริมาณเท่าเดิม เพื่อให้ความต่างเกิดจากราคาอย่างเดียว"
      - text: "ดัชนี $= \\dfrac{3{,}100}{2{,}650} \\times 100 \\approx 117.0$"
      - text: "แปลผล: ต้นทุนวัตถุดิบชุดเดิมแพงขึ้นราว $17\\%$ แม้ดัชนีของเส้นอย่างเดียวคือ $110$ เพราะหมูซึ่งมีน้ำหนักมากขึ้น $20\\%$"
    answer: "ดัชนีราคา $\\approx 117.0$ (แพงขึ้นราว $17\\%$ จากปีฐาน)"
  - type: figure
    src: axis-trick.svg
    alt: "แผนภูมิแท่งสองแผ่นแสดงข้อมูลชุดเดียวกัน สาขา ก 96 สาขา ข 104 แผ่นซ้ายแกนตั้งเริ่มที่ 90 ถึง 106 แท่งสาขา ข สูงเกือบสามเท่าของสาขา ก แผ่นขวาแกนตั้งเริ่มที่ 0 ถึง 120 แท่งทั้งสองสูงใกล้กัน"
    caption: "ข้อมูลเดียวกัน แกนต่างกัน ความต่างจริงคือประมาณ 8% เท่านั้น"
  - { type: check, problem: business.stats.descriptive.p008, prompt: "อย่าเชื่อความสูงของแท่ง ให้อ่านแกน" }
glossary:
  - { term: สถิติเชิงพรรณนา, definition: "การจัด สรุป และนำเสนอข้อมูลที่มีอยู่ด้วยตาราง แผนภาพ ค่ากลาง และการกระจาย โดยไม่สรุปเกินไปถึงประชากรที่ไม่ได้เก็บข้อมูล" }
  - { term: ยอดขายเฉลี่ยต่อบิล, definition: "ยอดขายรวมหารด้วยจำนวนบิล บอกว่าลูกค้าจ่ายเฉลี่ยครั้งละเท่าใด" }
  - { term: สัมประสิทธิ์การแปรผัน (CV), definition: "SD หารด้วยค่าเฉลี่ยคูณ 100% ใช้เทียบความแกว่งของข้อมูลที่ขนาดต่างกัน" }
  - { term: ร้อยละการเปลี่ยนแปลง, definition: "(ค่าใหม่ − ค่าเดิม) ÷ ค่าเดิม × 100" }
  - { term: จุดร้อยละ, definition: "ผลต่างของค่าที่เป็นร้อยละสองค่า เช่น 20% เป็น 25% เพิ่ม 5 จุดร้อยละ" }
  - { term: ดัชนีราคา, definition: "ราคาปีที่สนใจเทียบกับปีฐานซึ่งให้มีค่า 100 ไม่มีหน่วย" }
  - { term: ปีฐาน, definition: "ช่วงเวลาที่ใช้เป็นจุดเปรียบเทียบของดัชนี มีดัชนีเท่ากับ 100" }
flashcards:
  - { front: "ร้อยละการเปลี่ยนแปลง", back: "$\\dfrac{\\text{ใหม่} - \\text{เดิม}}{\\text{เดิม}} \\times 100$ หารด้วยค่าเดิมเสมอ" }
  - { front: "ดัชนีราคาแบบรวมถ่วงน้ำหนัก", back: "$\\dfrac{\\sum p_1 q_0}{\\sum p_0 q_0} \\times 100$ ราคาตะกร้าเดิมปีนี้เทียบปีฐาน" }
  - { front: "CV ใช้ทำอะไร", back: "เทียบความแกว่งของข้อมูลที่ค่าเฉลี่ยต่างกันมาก $CV = SD \\div \\bar{x} \\times 100\\%$" }
  - { front: "ขึ้น 20% แล้วลง 20%", back: "$1.2 \\times 0.8 = 0.96$ ลดลง 4% ไม่ได้กลับที่เดิม" }
  - { front: "กลเม็ดกราฟที่พบบ่อยที่สุด", back: "แกนตั้งของแผนภูมิแท่งไม่เริ่มที่ศูนย์ ทำให้ความต่างเล็กดูใหญ่" }
