<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="sans-serif" font-size="14">
<title>แผนผังกลไกต่อต้านสิ่งแปลกปลอมของร่างกาย</title>
<rect x="0" y="0" width="780" height="470" fill="#ffffff"/>
<rect x="290.0" y="14.0" width="200.0" height="46.0" rx="8" fill="#f2f2f2" stroke="#555" stroke-width="1.5"/>
<text x="390.0" y="33.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">สิ่งแปลกปลอม</text>
<text x="390.0" y="51.0" text-anchor="middle" font-size="13" fill="#222">แบคทีเรีย ไวรัส รา พิษ</text>
<text x="20.0" y="96.0" text-anchor="start" font-size="15" font-weight="bold" fill="#8a5a00">แบบไม่จำเพาะ</text>
<rect x="20.0" y="108.0" width="230.0" height="82.0" rx="8" fill="#fff4dc" stroke="#b07d1a" stroke-width="1.5"/>
<text x="135.0" y="136.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">ด่านที่ 1: สิ่งกีดขวาง</text>
<text x="135.0" y="154.0" text-anchor="middle" font-size="13" fill="#222">ผิวหนัง เยื่อเมือก ขนจมูก</text>
<text x="135.0" y="172.0" text-anchor="middle" font-size="13" fill="#222">น้ำตา (ไลโซไซม์) กรดในกระเพาะ</text>
<rect x="20.0" y="222.0" width="230.0" height="100.0" rx="8" fill="#fff4dc" stroke="#b07d1a" stroke-width="1.5"/>
<text x="135.0" y="250.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">ด่านที่ 2: ภายในร่างกาย</text>
<text x="135.0" y="268.0" text-anchor="middle" font-size="13" fill="#222">ฟาโกไซต์ (นิวโทรฟิล แมโครฟาจ)</text>
<text x="135.0" y="286.0" text-anchor="middle" font-size="13" fill="#222">การอักเสบ ไข้</text>
<text x="135.0" y="304.0" text-anchor="middle" font-size="13" fill="#222">เซลล์เอ็นเค อินเตอร์เฟอรอน</text>
<line x1="330.0" y1="62.0" x2="180.0" y2="104.0" stroke="#444" stroke-width="2"/>
<polygon points="180.0,104.0 187.0,98.4 188.9,105.1" fill="#444"/>
<line x1="135.0" y1="192.0" x2="135.0" y2="218.0" stroke="#444" stroke-width="2"/>
<polygon points="135.0,218.0 131.5,209.7 138.5,209.7" fill="#444"/>
<text x="530.0" y="96.0" text-anchor="start" font-size="15" font-weight="bold" fill="#2c4a7a">แบบจำเพาะ (ด่านที่ 3)</text>
<rect x="300.0" y="108.0" width="200.0" height="64.0" rx="8" fill="#e8f0fb" stroke="#2c4a7a" stroke-width="1.5"/>
<text x="400.0" y="136.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">แมโครฟาจนำเสนอแอนติเจน</text>
<text x="400.0" y="154.0" text-anchor="middle" font-size="13" fill="#222">ให้เซลล์ทีผู้ช่วย</text>
<line x1="252.0" y1="272.0" x2="300.0" y2="160.0" stroke="#2c4a7a" stroke-width="2"/>
<polygon points="300.0,160.0 300.0,169.0 293.5,166.2" fill="#2c4a7a"/>
<rect x="560.0" y="108.0" width="200.0" height="64.0" rx="8" fill="#e8f0fb" stroke="#2c4a7a" stroke-width="1.5"/>
<text x="660.0" y="136.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">เซลล์ทีผู้ช่วย</text>
<text x="660.0" y="154.0" text-anchor="middle" font-size="13" fill="#222">กระตุ้นเซลล์บีและเซลล์ทีพิฆาต</text>
<line x1="502.0" y1="140.0" x2="556.0" y2="140.0" stroke="#2c4a7a" stroke-width="2"/>
<polygon points="556.0,140.0 547.7,143.5 547.7,136.5" fill="#2c4a7a"/>
<rect x="300.0" y="230.0" width="200.0" height="90.0" rx="8" fill="#e8f0fb" stroke="#2c4a7a" stroke-width="1.5"/>
<text x="400.0" y="253.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">ภูมิคุ้มกันแบบสารน้ำ</text>
<text x="400.0" y="271.0" text-anchor="middle" font-size="13" fill="#222">เซลล์บี → เซลล์พลาสมา</text>
<text x="400.0" y="289.0" text-anchor="middle" font-size="13" fill="#222">สร้างแอนติบอดี</text>
<text x="400.0" y="307.0" text-anchor="middle" font-size="13" fill="#222">จับแอนติเจนในของเหลว</text>
<rect x="560.0" y="230.0" width="200.0" height="90.0" rx="8" fill="#e8f0fb" stroke="#2c4a7a" stroke-width="1.5"/>
<text x="660.0" y="253.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">ภูมิคุ้มกันแบบใช้เซลล์</text>
<text x="660.0" y="271.0" text-anchor="middle" font-size="13" fill="#222">เซลล์ทีพิฆาต</text>
<text x="660.0" y="289.0" text-anchor="middle" font-size="13" fill="#222">ทำลายเซลล์ที่ติดเชื้อ</text>
<text x="660.0" y="307.0" text-anchor="middle" font-size="13" fill="#222">และเซลล์มะเร็ง</text>
<line x1="610.0" y1="174.0" x2="430.0" y2="226.0" stroke="#2c4a7a" stroke-width="2"/>
<polygon points="430.0,226.0 437.0,220.3 438.9,227.1" fill="#2c4a7a"/>
<line x1="660.0" y1="174.0" x2="660.0" y2="226.0" stroke="#2c4a7a" stroke-width="2"/>
<polygon points="660.0,226.0 656.5,217.7 663.5,217.7" fill="#2c4a7a"/>
<rect x="390.0" y="360.0" width="280.0" height="60.0" rx="8" fill="#eef7ee" stroke="#2a7a3a" stroke-width="1.5"/>
<text x="530.0" y="386.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">เซลล์ความจำ (บีและที)</text>
<text x="530.0" y="404.0" text-anchor="middle" font-size="13" fill="#222">พบแอนติเจนเดิมอีก ตอบสนองเร็วและแรงกว่า</text>
<line x1="400.0" y1="322.0" x2="470.0" y2="356.0" stroke="#2a7a3a" stroke-width="2"/>
<polygon points="470.0,356.0 461.0,355.5 464.1,349.2" fill="#2a7a3a"/>
<line x1="660.0" y1="322.0" x2="600.0" y2="356.0" stroke="#2a7a3a" stroke-width="2"/>
<polygon points="600.0,356.0 605.5,348.9 608.9,355.0" fill="#2a7a3a"/>
<text x="135.0" y="350.0" text-anchor="middle" font-size="12" fill="#8a5a00">เกิดทันที ทำงานแบบเดียวกัน</text>
<text x="135.0" y="368.0" text-anchor="middle" font-size="12" fill="#8a5a00">กับสิ่งแปลกปลอมทุกชนิด</text>
<text x="390.0" y="452.0" text-anchor="middle" font-size="13" fill="#333">วัคซีนกระตุ้นให้เกิดเซลล์ความจำโดยไม่ต้องป่วยเป็นโรคก่อน</text>
</svg>