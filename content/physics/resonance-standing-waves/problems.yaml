  - id: physics.waves.resonance-standing-waves.p015
    topics: [physics.waves.resonance-standing-waves]
    difficulty: 2
    type: mcq
    stem: "นักเรียนเป่าลมผ่านปากขวดน้ำดื่มพลาสติกที่มีน้ำอยู่ครึ่งขวดจนได้ยินเสียงหวีด ถ้าเติมน้ำเพิ่มแล้วเป่าใหม่ เสียงจะเปลี่ยนไปอย่างไร"
    choices:
      - { id: a, text: "เสียงสูงขึ้น เพราะลำอากาศสั้นลง", correct: true }
      - { id: b, text: "เสียงต่ำลง เพราะขวดหนักขึ้น", feedback: "เสียงมาจากการสั่นของลำอากาศในขวด ไม่ใช่ตัวขวด ลำอากาศที่สั้นลงสั่นพ้องที่ความถี่สูงขึ้น" }
      - { id: c, text: "เสียงเท่าเดิม เพราะเป่าแรงเท่าเดิม", feedback: "แรงเป่าเปลี่ยนความดัง แต่ความถี่ที่สั่นพ้องขึ้นกับความยาวลำอากาศ" }
    hints:
      - "ส่วนใดของขวดสั่นจนเกิดเสียง"
      - "ลำอากาศเป็นท่อปลายเปิดหนึ่งด้าน $f_1 = \\dfrac{v}{4L}$"
    solution: "ลำอากาศเหนือน้ำเป็นท่อปลายเปิดหนึ่งด้าน (ผิวน้ำเป็นปลายปิด) เติมน้ำแล้ว $L$ สั้นลง ความถี่ $f_1 = \\dfrac{v}{4L}$ จึงสูงขึ้น"
