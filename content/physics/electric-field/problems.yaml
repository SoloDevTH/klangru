  - id: physics.electricity.electric-field.p014
    topics: [physics.electricity.electric-field]
    difficulty: 5
    type: expression
    stem: "วงแหวนรัศมี $R$ มีประจุ $Q$ จงเขียนขนาดของสนามไฟฟ้าที่จุดบนแกนห่างจากศูนย์กลาง $z$ ในรูปของ $k$, $Q$, $z$, $R$"
    prefix: "E ="
    answer: { latex: "\\frac{kQz}{(z^2+R^2)^{3/2}}", variables: [k, Q, z, R] }
    misconceptions:
      - { match: "\\frac{kQ}{z^2+R^2}", feedback: "ลืมคูณ $\\cos\\theta = z/\\sqrt{z^2 + R^2}$ องค์ประกอบตั้งฉากกับแกนหักล้างกัน เหลือเฉพาะส่วนตามแกน" }
      - { match: "\\frac{kQ}{z^2}", feedback: "ถือว่าประจุอยู่ที่ศูนย์กลาง ใช้ได้เฉพาะเมื่อ $z \\gg R$" }
    hints:
      - "ทุกชิ้น $dq$ อยู่ห่าง $r = \\sqrt{z^2 + R^2}$ ให้ $dE = k\\,dq/r^2$"
      - "องค์ประกอบตามแกน $dE\\cos\\theta$ เมื่อ $\\cos\\theta = z/r$ แล้วรวมทุก $dq$"
    solution: "$E_z = \\int \\dfrac{k\\,dq}{r^2}\\cdot\\dfrac{z}{r} = \\dfrac{kz}{r^3}\\int dq = \\dfrac{kQz}{(z^2 + R^2)^{3/2}}$ ตรวจ: $z = 0$ ได้ $0$ และ $z \\gg R$ ได้ $kQ/z^2$"
    license: CC-BY-SA-4.0
    ai_assisted: true

