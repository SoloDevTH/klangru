      - { match: 53.9, feedback: "ดูเหมือนใช้เครื่องหมายลบหน้า $2AB\\cos\\theta$ ($\\theta$ เป็นมุมระหว่างแรงที่ออกจากจุดเดียวกัน จึงใช้บวก) มุมเล็กต้องได้แรงลัพธ์มาก" }
    solution: "$R = \\sqrt{50^2 + 70^2 + 2(50)(70)\\cos 50^\\circ} = \\sqrt{2{,}500 + 4{,}900 + 4{,}499.5} \\approx \\sqrt{11{,}900} \\approx 109.1\\ \\mathrm{N}$"
