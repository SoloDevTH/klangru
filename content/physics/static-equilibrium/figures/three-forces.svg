<text x="640.0" y="150.0" text-anchor="middle" fill="#15211e" font-size="13">สามเหลี่ยมปิดพอดี</text>
<text x="640.0" y="170.0" text-anchor="middle" fill="#15211e" font-size="13">แรงลัพธ์ = 0</text>
<text x="640.0" y="215.0" text-anchor="middle" fill="#15211e" font-size="13" font-weight="bold">ทฤษฎีของลามี:</text>
<text x="640.0" y="237.0" text-anchor="middle" fill="#15211e" font-size="13">T₁/sin150° = T₂/sin120°</text>
<text x="640.0" y="257.0" text-anchor="middle" fill="#15211e" font-size="13">= W/sin90°</text>
