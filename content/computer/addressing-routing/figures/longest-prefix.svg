<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250"><title>ตารางเส้นทางสี่แถว แถวที่ prefix ยาวที่สุดที่ตรงกับปลายทาง 10.1.2.9 ถูกเลือก</title><rect width="720" height="250" fill="#ffffff"/><text x="40" y="40" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">เส้นทาง (prefix)</text><text x="250" y="40" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">ส่งต่อไปยัง</text><text x="420" y="40" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">ผล</text><rect x="30" y="60" width="660" height="36" rx="0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="40" y="84" font-family="sans-serif" font-size="15" fill="#1f2937" text-anchor="start" font-weight="normal">0.0.0.0/0</text><text x="250" y="84" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="normal">ทางออกอินเทอร์เน็ต</text><text x="420" y="84" font-family="sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal">ตรงกันได้ เป็นค่าเริ่มต้น</text><rect x="30" y="102" width="660" height="36" rx="0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="40" y="126" font-family="sans-serif" font-size="15" fill="#1f2937" text-anchor="start" font-weight="normal">10.0.0.0/8</text><text x="250" y="126" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="normal">ไปทาง R1</text><text x="420" y="126" font-family="sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal">ตรงกันได้</text><rect x="30" y="144" width="660" height="36" rx="0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="40" y="168" font-family="sans-serif" font-size="15" fill="#1f2937" text-anchor="start" font-weight="normal">10.1.0.0/16</text><text x="250" y="168" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="normal">ไปทาง R2</text><text x="420" y="168" font-family="sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal">ตรงกันได้</text><rect x="30" y="186" width="660" height="36" rx="0" fill="#bbf7d0" stroke="#9ca3af" stroke-width="1"/><text x="40" y="210" font-family="sans-serif" font-size="15" fill="#1f2937" text-anchor="start" font-weight="normal">10.1.2.0/24</text><text x="250" y="210" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="normal">ไปทาง R3</text><text x="420" y="210" font-family="sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal">ตรงกันและยาวที่สุด จึงถูกเลือก</text><text x="360" y="240" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle" font-weight="normal">ปลายทางของแพ็กเก็ต 10.1.2.9 ตรงกับ 4 แถว แถวที่ prefix ยาวที่สุดคือ /24</text></svg>
