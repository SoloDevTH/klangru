<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" width="460" height="330" font-family="sans-serif">
<title>โปสเตอร์ BOOK SWAP สำหรับโจทย์</title>
<rect x="0" y="0" width="460" height="330" fill="#fff"/>
<rect x="10.0" y="10.0" width="440.0" height="310.0" rx="10" fill="#fff4e0" stroke="#c46a12" stroke-width="3"/>
<text x="230.0" y="62.0" font-size="34" text-anchor="middle" fill="#b3261e" font-weight="bold">BOOK SWAP!</text>
<text x="230.0" y="96.0" font-size="18" text-anchor="middle" fill="#111" font-weight="normal" font-style="italic">Bring a book, take a book.</text>
<text x="70.0" y="148.0" font-size="18" text-anchor="start" fill="#7a3a12" font-weight="bold">Where:</text>
<text x="160.0" y="148.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">the school library</text>
<text x="70.0" y="184.0" font-size="18" text-anchor="start" fill="#7a3a12" font-weight="bold">When:</text>
<text x="160.0" y="184.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">Friday, 13 November</text>
<text x="70.0" y="220.0" font-size="18" text-anchor="start" fill="#7a3a12" font-weight="bold">Who:</text>
<text x="160.0" y="220.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">everyone is welcome</text>
<text x="70.0" y="256.0" font-size="18" text-anchor="start" fill="#7a3a12" font-weight="bold">Cost:</text>
<text x="160.0" y="256.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">free</text>
<text x="230.0" y="300.0" font-size="20" text-anchor="middle" fill="#b3261e" font-weight="bold">Don't miss it!</text>
</svg>
