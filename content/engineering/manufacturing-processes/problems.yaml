    type: numeric
    stem: (ข้อมูลสมมติ) ต้องการกลึงชิ้นงานเส้นผ่านศูนย์กลาง 80 มิลลิเมตรให้มีความเร็วตัด 120 เมตรต่อนาที ความเร็วรอบของเครื่องกลึงควรตั้งที่กี่รอบต่อนาที (ตอบทศนิยมหนึ่งตำแหน่ง)
    answer:
      value: 477.5
      tolerance: 0.5
      unit: rpm
    hints:
      - จากสูตร V = π × D × N ÷ 1000 จัดรูปหา N = 1000 × V ÷ (π × D)
      - D คือเส้นผ่านศูนย์กลาง ไม่ใช่รัศมี
    misconceptions:
      - match: 954.9
