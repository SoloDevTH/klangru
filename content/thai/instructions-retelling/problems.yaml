problems:
- id: thai.listening.instructions-retelling.p001
  topics:
  - thai.listening.instructions-retelling
  difficulty: 1
  type: mcq
  stem: 'ข้อความที่ได้ยิน: *"นักเรียนหยิบดินสอสีแดงขึ้นมา แล้ววาดวงกลมหนึ่งวง"* ข้อใดทำถูก'
  choices:
  - id: a
    text: หยิบดินสอสีแดง วาดวงกลม 1 วง
    correct: true
    feedback: ถูก ทำครบทั้งสองขั้น สีถูก จำนวนถูก
  - id: b
    text: หยิบดินสอสีแดง วาดสี่เหลี่ยม 1 รูป
    feedback: ฟังรูปทรงให้ดี ครูบอกว่า วงกลม
  - id: c
    text: หยิบดินสอสีน้ำเงิน วาดวงกลม 1 วง
    feedback: ครูบอกว่า สีแดง
  - id: d
    text: หยิบดินสอสีแดง วาดวงกลม 2 วง
    feedback: ครูบอกว่า หนึ่งวง ตัวเลขเป็นคำสำคัญ
  hints:
  - 'มีคำสำคัญอะไรบ้าง: สี อะไร กี่วง'
  - ทำครบทั้งสองขั้น หยิบ แล้ว วาด
  solution: คำสำคัญคือ **สีแดง วงกลม หนึ่งวง** ทำตามลำดับ หยิบดินสอสีแดง แล้ววาดวงกลม 1 วง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.instructions-retelling.p002
  topics:
  - thai.listening.instructions-retelling
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็น **คำสั่ง** ไม่ใช่คำแนะนำ
  choices:
  - id: a
    text: ห้ามวิ่งบนบันได
    correct: true
    feedback: ถูก ห้าม บอกสิ่งที่ต้องไม่ทำ เป็นคำสั่ง
  - id: b
    text: ควรดื่มน้ำหลังเล่นกีฬา
    feedback: ควร บอกวิธีที่ดี เป็นคำแนะนำ
  - id: c
    text: ลองอ่านออกเสียงจะจำได้ดีขึ้น
    feedback: ลอง บอกวิธีที่ดีให้เลือกทำ เป็นคำแนะนำ
  - id: d
    text: อ่านหนังสือก่อนนอนน่าจะช่วยให้หลับง่าย
    feedback: น่าจะ บอกวิธีที่ดี เป็นคำแนะนำ
  hints:
  - คำสั่งมักมีคำว่า จง ให้ ห้าม อย่า
  - คำแนะนำมักมีคำว่า ควร ลอง น่าจะ
  solution: '**ห้ามวิ่งบนบันได** เป็นคำสั่ง ส่วนอีกสามข้อมี ควร ลอง น่าจะ เป็นคำแนะนำ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.instructions-retelling.p003
  topics:
  - thai.listening.instructions-retelling
  difficulty: 1
  type: order
  stem: 'ข้อความที่ได้ยิน: *"ก่อนอื่นเปิดน้ำให้มือเปียก แล้วถูสบู่ให้ทั่วมือ จากนั้นล้างน้ำให้สะอาด สุดท้ายเช็ดมือให้แห้ง"* เรียงขั้นตอนตามที่ได้ยิน'
  items:
  - เปิดน้ำให้มือเปียก
  - ถูสบู่ให้ทั่วมือ
  - ล้างน้ำให้สะอาด
  - เช็ดมือให้แห้ง
  hints:
  - จับคำบอกลำดับ ก่อนอื่น แล้ว จากนั้น สุดท้าย
  - ขั้นที่ขึ้นต้นด้วย ก่อนอื่น มาก่อน สุดท้าย อยู่ท้าย
  solution: ก่อนอื่น เปิดน้ำ → แล้ว ถูสบู่ → จากนั้น ล้างน้ำ → สุดท้าย เช็ดมือ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.instructions-retelling.p004
  topics:
  - thai.listening.instructions-retelling
  difficulty: 2
  type: mcq
  stem: 'ดูแผนผัง ข้อความที่ได้ยิน: *"เดินเข้าประตูโรงเรียน ตรงไปถึงเสาธง เลี้ยวขวา แล้วเข้าอาคารหลังที่สองทางซ้ายมือ"* จะไปถึงที่ใด'
  figure: &id001
    src: school-map.svg
    alt: 'แผนผังโรงเรียน ทิศเหนืออยู่ด้านบน ประตูโรงเรียนอยู่ด้านล่างตรงกลาง ข้างประตูทางซ้ายมีป้อมยาม จากประตูมีทางเดินตรงขึ้นไปทางเหนือถึงเสาธงที่อยู่กลางผัง เสาธงอยู่บนทางเดินที่ตัดผ่านจากตะวันตกไปตะวันออก เหนือเสาธงคือสนามฟุตบอล ทางเดินฝั่งตะวันตก: ด้านเหนือคือห้องสมุด ด้านใต้คืออาคาร ๑ ทางเดินฝั่งตะวันออก ด้านเหนือเรียงจากเสาธงออกไปคือ โรงอาหาร (หลังแรก) ห้องพยาบาล (หลังที่สอง) ด้านใต้เรียงจากเสาธงออกไปคือ ห้องดนตรี (หลังแรก) ห้องคอม (หลังที่สอง)'
  choices:
  - id: a
    text: ห้องพยาบาล
    correct: true
    feedback: ถูก เลี้ยวขวาแล้วหันไปทางตะวันออก ซ้ายมือคือฝั่งเหนือ หลังที่สองคือห้องพยาบาล
  - id: b
    text: โรงอาหาร
    feedback: โรงอาหารเป็นหลังแรกทางซ้ายมือ ข้อความบอกว่าหลังที่สอง
  - id: c
    text: ห้องคอม
    feedback: ห้องคอมอยู่ทางขวามือเมื่อหันไปทางตะวันออก
  - id: d
    text: ห้องสมุด
    feedback: ห้องสมุดอยู่ฝั่งตะวันตก ต้องเลี้ยวซ้ายที่เสาธงจึงจะไป
  hints:
  - เดินจากประตูขึ้นไปทางเหนือ แล้วเลี้ยวขวาจะหันไปทางไหน
  - เมื่อหันไปทางตะวันออก ซ้ายมือคือฝั่งเหนือ นับหลังที่สอง
  solution: เดินขึ้นเหนือถึงเสาธง เลี้ยวขวาหันไปทางตะวันออก ซ้ายมือคือฝั่งเหนือ หลังแรกคือโรงอาหาร หลังที่สองคือ **ห้องพยาบาล**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.instructions-retelling.p005
  topics:
  - thai.listening.instructions-retelling
  difficulty: 2
  type: match
  stem: 'ข้อความที่ได้ยิน (ประกาศหน้าเสาธง): *"วันศุกร์นี้ นักเรียนชั้น ป.2 จะไปทัศนศึกษาที่สวนสัตว์ ให้มาถึงโรงเรียนเวลาเจ็ดโมงเช้า แต่งชุดพละ นำหมวก ขวดน้ำ และสมุดจดบันทึกมาด้วย ไม่ต้องนำขนมมา เพราะโรงเรียนเตรียมอาหารกลางวันไว้ให้แล้ว"*


    จับคู่คำถามกับคำตอบจากประกาศ'
  pairs:
  - left: ใคร
    right: นักเรียนชั้น ป.2
  - left: ไปที่ไหน
    right: สวนสัตว์
  - left: เมื่อไร
    right: วันศุกร์นี้
  - left: แต่งกายอย่างไร
    right: ชุดพละ
  hints:
  - ประกาศตอบคำถาม ใคร ที่ไหน เมื่อไร อย่างไร
  - ฟังคำที่อยู่หลัง ให้ แต่ง
  solution: ใคร → นักเรียนชั้น ป.2 · ที่ไหน → สวนสัตว์ · เมื่อไร → วันศุกร์นี้ · อย่างไร → แต่งชุดพละ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.instructions-retelling.p006
  topics:
  - thai.listening.instructions-retelling
  difficulty: 2
  type: numeric
  stem: 'ข้อความที่ได้ยิน (ประกาศหน้าเสาธง): *"วันศุกร์นี้ นักเรียนชั้น ป.2 จะไปทัศนศึกษาที่สวนสัตว์ ให้มาถึงโรงเรียนเวลาเจ็ดโมงเช้า แต่งชุดพละ นำหมวก ขวดน้ำ และสมุดจดบันทึกมาด้วย ไม่ต้องนำขนมมา เพราะโรงเรียนเตรียมอาหารกลางวันไว้ให้แล้ว"*


    นักเรียนต้อง **นำของมา** กี่อย่าง'
  answer:
    value: 3
    tolerance: 0
    unit: อย่าง
  misconceptions:
  - match: 4
    feedback: นับขนมรวมไปด้วย แต่ประกาศบอกว่า ไม่ต้องนำขนมมา
  - match: 5
    feedback: ชุดพละคือการแต่งกาย และขนมไม่ต้องนำมา นับเฉพาะของที่ให้นำมา
  hints:
  - ฟังคำว่า นำ ... มาด้วย
  - ระวังคำว่า ไม่ต้อง
  solution: ของที่ต้องนำมาคือ หมวก ขวดน้ำ สมุดจดบันทึก = **3 อย่าง** ขนมไม่ต้องนำมา
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.instructions-retelling.p007
  topics:
  - thai.listening.instructions-retelling
  difficulty: 2
  type: mcq
  stem: 'ข้อความที่ได้ยิน (ประกาศหน้าเสาธง): *"วันศุกร์นี้ นักเรียนชั้น ป.2 จะไปทัศนศึกษาที่สวนสัตว์ ให้มาถึงโรงเรียนเวลาเจ็ดโมงเช้า แต่งชุดพละ นำหมวก ขวดน้ำ และสมุดจดบันทึกมาด้วย ไม่ต้องนำขนมมา เพราะโรงเรียนเตรียมอาหารกลางวันไว้ให้แล้ว"*


    ทำไมจึง **ไม่ต้อง** นำขนมมา'
  choices:
  - id: a
    text: เพราะโรงเรียนเตรียมอาหารกลางวันไว้ให้แล้ว
    correct: true
    feedback: ถูก คำว่า เพราะ บอกเหตุผล
  - id: b
    text: เพราะสวนสัตว์ห้ามนำอาหารเข้า
    feedback: ประกาศไม่ได้พูดถึงกฎของสวนสัตว์ อย่าเติมเรื่องเอง
  - id: c
    text: เพราะต้องแต่งชุดพละ
    feedback: ชุดพละเป็นเรื่องการแต่งกาย ไม่ใช่เหตุผลเรื่องขนม
  - id: d
    text: เพราะไปแค่ครึ่งวัน
    feedback: ประกาศไม่ได้บอกว่าไปกี่ชั่วโมง
  hints:
  - หาคำว่า เพราะ ในประกาศ
  - ตอบจากสิ่งที่ได้ยินเท่านั้น
  solution: ประกาศบอกว่า ไม่ต้องนำขนมมา **เพราะโรงเรียนเตรียมอาหารกลางวันไว้ให้แล้ว**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.instructions-retelling.p008
  topics:
  - thai.listening.instructions-retelling
  difficulty: 3
  type: mcq
  stem: 'ดูแผนผัง ข้อความที่ได้ยิน: *"จากประตู เดินตรงไปถึงเสาธง เลี้ยวซ้าย อาคารที่อยู่ทางขวามือคือที่คืนหนังสือ"* ที่คืนหนังสืออยู่ที่ใด'
  figure: *id001
  choices:
  - id: a
    text: ห้องสมุด
    correct: true
    feedback: ถูก เลี้ยวซ้ายหันไปทางตะวันตก ขวามือคือฝั่งเหนือ คือห้องสมุด
  - id: b
    text: อาคาร ๑
    feedback: อาคาร ๑ อยู่ทางซ้ายมือเมื่อหันไปทางตะวันตก
  - id: c
    text: ห้องดนตรี
    feedback: ห้องดนตรีอยู่ฝั่งตะวันออก ต้องเลี้ยวขวาที่เสาธง
  - id: d
    text: ป้อมยาม
    feedback: ป้อมยามอยู่ข้างประตู ยังไม่ต้องเดินถึงเสาธง
  hints:
  - เลี้ยวซ้ายที่เสาธงจะหันไปทางทิศใด
  - หันไปทางตะวันตก ขวามือคือทิศเหนือ
  solution: เลี้ยวซ้ายที่เสาธง หันไปทางตะวันตก ขวามือคือฝั่งเหนือ = **ห้องสมุด**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.instructions-retelling.p009
  topics:
  - thai.listening.instructions-retelling
  difficulty: 3
  type: mcq
  stem: 'ข้อความที่ได้ยิน: *"ใครทำแบบฝึกหัดเสร็จแล้ว ให้นำสมุดมาส่งที่โต๊ะครู ใครยังไม่เสร็จ ให้นำกลับไปทำเป็นการบ้าน แล้วส่งพรุ่งนี้เช้า"* นิดยังทำไม่เสร็จ นิดควรทำอย่างไร'
  choices:
  - id: a
    text: นำสมุดกลับไปทำต่อที่บ้าน แล้วส่งพรุ่งนี้เช้า
    correct: true
    feedback: ถูก นิดอยู่ในกลุ่ม ยังไม่เสร็จ
  - id: b
    text: นำสมุดไปส่งที่โต๊ะครูเลย
    feedback: นี่คือคำสั่งสำหรับคนที่ทำเสร็จแล้ว
  - id: c
    text: ส่งพรุ่งนี้เย็น
    feedback: ฟังเวลาให้ดี ครูบอกว่า พรุ่งนี้เช้า
  - id: d
    text: ไม่ต้องทำต่อ
    feedback: ครูให้ทำเป็นการบ้าน ไม่ได้บอกให้หยุด
  hints:
  - คำสั่งนี้มีสองเงื่อนไข เสร็จแล้ว กับ ยังไม่เสร็จ
  - นิดอยู่เงื่อนไขไหน แล้วต้องทำอะไรบ้าง
  solution: นิดยังไม่เสร็จ จึงต้อง **นำกลับไปทำเป็นการบ้าน แล้วส่งพรุ่งนี้เช้า**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.instructions-retelling.p010
  topics:
  - thai.listening.instructions-retelling
  difficulty: 3
  type: order
  stem: 'นิทานที่ฟัง: *ราชสีห์ตัวหนึ่งจับหนูได้ หนูอ้อนวอนขอชีวิตและสัญญาว่าจะตอบแทนบุญคุณ ราชสีห์หัวเราะ แต่ก็ปล่อยหนูไป หลายวันต่อมา ราชสีห์ติดบ่วงของนายพราน ดิ้นเท่าไรก็ไม่หลุด หนูได้ยินเสียงร้องจึงวิ่งมากัดเชือกจนขาด ราชสีห์จึงรอดชีวิต*


    เรียงเหตุการณ์ตามลำดับในนิทาน'
  items:
  - ราชสีห์จับหนูได้
  - หนูขอชีวิตและสัญญาว่าจะตอบแทน
  - ราชสีห์ปล่อยหนูไป
  - ราชสีห์ติดบ่วงนายพราน
  - หนูกัดเชือกช่วยราชสีห์
  hints:
  - นิทานเล่าตามลำดับเวลา
  - หาคำบอกเวลา หลายวันต่อมา แยกตอนต้นกับตอนท้าย
  solution: จับหนู → หนูขอชีวิต → ปล่อยหนู → ติดบ่วง → หนูกัดเชือกช่วย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.instructions-retelling.p011
  topics:
  - thai.listening.instructions-retelling
  difficulty: 3
  type: mcq
  stem: 'นิทานที่ฟัง: *ราชสีห์ตัวหนึ่งจับหนูได้ หนูอ้อนวอนขอชีวิตและสัญญาว่าจะตอบแทนบุญคุณ ราชสีห์หัวเราะ แต่ก็ปล่อยหนูไป หลายวันต่อมา ราชสีห์ติดบ่วงของนายพราน ดิ้นเท่าไรก็ไม่หลุด หนูได้ยินเสียงร้องจึงวิ่งมากัดเชือกจนขาด ราชสีห์จึงรอดชีวิต*


    ข้อคิดของนิทานนี้คือข้อใด'
  choices:
  - id: a
    text: อย่าดูถูกผู้ที่ตัวเล็กกว่า เพราะวันหนึ่งเขาอาจช่วยเราได้
    correct: true
    feedback: ถูก ราชสีห์หัวเราะเยาะหนู แต่สุดท้ายหนูช่วยชีวิตราชสีห์
  - id: b
    text: ราชสีห์แข็งแรงที่สุดในป่า
    feedback: นี่ไม่ใช่ข้อคิด และเรื่องก็แสดงว่าราชสีห์ยังต้องพึ่งหนู
  - id: c
    text: ไม่ควรเข้าใกล้นายพราน
    feedback: นายพรานเป็นแค่ส่วนหนึ่งของเหตุการณ์ ไม่ใช่สิ่งที่นิทานต้องการสอน
  - id: d
    text: หนูชอบกัดเชือก
    feedback: นี่เป็นรายละเอียดของเรื่อง ไม่ใช่ข้อคิด
  hints:
