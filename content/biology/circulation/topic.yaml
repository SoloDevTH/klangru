id: biology.animals.circulation
subject: biology
title: { th: ระบบหมุนเวียนเลือดและน้ำเหลือง, en: "Circulatory and lymphatic systems" }
summary: ระบบหมุนเวียนเลือดแบบเปิดและแบบปิด หัวใจของสัตว์มีกระดูกสันหลัง การไหลของเลือดในหางปลา ลิ้นหัวใจและระบบนำไฟฟ้า ความดันเลือด ส่วนประกอบของเลือด หมู่เลือด ABO และ Rh และระบบน้ำเหลือง
difficulty: 5.5
minutes: 50
prerequisites: [biology.animals.gas-exchange, biology.humans.circulatory-system]
encompasses:
  - { id: biology.humans.circulatory-system, weight: 0.3 }
  - { id: biology.animals.gas-exchange, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ระบบหมุนเวียนเลือดแบบเปิดและแบบปิด
    src: open-closed.svg
    alt: "ภาพ 2 ช่อง ช่อง ก. แบบเปิด (แมลง) ลำตัววงรี มีหัวใจเป็นท่อยาวด้านหลังที่มีรูเปิดรับเลือด ลูกศรแสดงของเหลวออกจากปลายหัวใจไหลวนในช่องว่างในลำตัว (ฮีโมซีล) อาบเซลล์โดยตรง ข้อความ ไม่มีหลอดเลือดฝอย ความดันต่ำ ไหลช้า ช่อง ข. แบบปิด (ไส้เดือนดิน) ลำตัวยาว ด้านซ้ายคือด้านหน้า มีหลอดเลือดด้านหลังที่เลือดไหลไปด้านหน้า และหลอดเลือดด้านท้องที่เลือดไหลไปด้านท้าย เชื่อมกันด้วยหัวใจเทียม 5 คู่ทางด้านหน้า และหลอดเลือดฝอยทางด้านท้าย ข้อความ เลือดอยู่ในหลอดเลือดตลอดเวลา ความดันสูง ไหลเร็ว"
    caption: "ในระบบเปิด ของเหลวออกจากหลอดเลือดไปอาบเซลล์ ในระบบปิดเลือดแลกเปลี่ยนสารผ่านหลอดเลือดฝอย (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: worked-example
    title: ใช้ Q = Av อธิบายการไหลในหลอดเลือดฝอย
    problem: "หัวใจส่งเลือด 6,000 cm³ ต่อนาที เอออร์ตามีพื้นที่หน้าตัด 4 cm² และหลอดเลือดฝอยทั้งหมดมีพื้นที่หน้าตัดรวม 3,000 cm² เลือดในเอออร์ตาไหลเร็วกว่าในหลอดเลือดฝอยกี่เท่า"
    steps:
      - text: "ปริมาตรต่อวินาที $Q = 6{,}000 \\div 60 = 100\\ \\mathrm{cm^3/s}$ เท่ากันทุกระดับ"
        why: "เลือดไม่ได้หายไประหว่างทาง ปริมาตรที่ผ่านแต่ละระดับต่อวินาทีจึงเท่ากัน"
      - text: "เอออร์ตา $v = 100 \\div 4 = 25\\ \\mathrm{cm/s}$"
      - text: "หลอดเลือดฝอย $v = 100 \\div 3{,}000 \\approx 0.033\\ \\mathrm{cm/s}$"
      - text: "อัตราส่วน $= 25 \\div 0.0333 = 750$ เท่า ซึ่งเท่ากับอัตราส่วนพื้นที่ $3{,}000 \\div 4$"
    answer: "เลือดในเอออร์ตาไหลเร็วกว่าราว 750 เท่า"
  - { type: check, problem: biology.animals.circulation.p007, prompt: "ใช้หลักเดียวกันเปรียบเทียบความเร็วในหางปลา" }
  - type: figure
    title: ลิ้นหัวใจและระบบนำไฟฟ้าของหัวใจ
    src: heart-valves-conduction.svg
    alt: "แผนภาพหัวใจ 4 ห้องมองจากด้านหน้า ด้านซ้ายของภาพคือด้านขวาของร่างกาย จุดสีเหลืองในห้องบนขวาคือเอสเอโนด (ตัวกำหนดจังหวะ) เส้นประสีเหลืองนำสัญญาณไปยังจุดสีเหลืองอีกจุดตรงกลางระหว่างห้องบนกับห้องล่างคือเอวีโนด (หน่วงสัญญาณเล็กน้อย) จากนั้นเส้นสีเหลืองทึบลงตามผนังกั้นห้องแล้วแยกไปตามผนังห้องล่างทั้งสอง คือมัดใยกล้ามเนื้อหัวใจที่กระจายสัญญาณ ระหว่างห้องบนขวากับห้องล่างขวามีลิ้นไตรคัสปิด ระหว่างห้องบนซ้ายกับห้องล่างซ้ายมีลิ้นไบคัสปิด ใกล้ทางออกของห้องล่างขวามีลิ้นพัลโมนารีเซมิลูนาร์ (ทางออกไปปอด) และของห้องล่างซ้ายมีลิ้นเอออร์ติกเซมิลูนาร์ (ทางออกไปเอออร์ตา)"
    caption: "ตำแหน่งของลิ้นเซมิลูนาร์ในภาพเป็นตำแหน่งโดยประมาณ จริง ๆ อยู่ที่โคนหลอดเลือดแดงที่ออกจากห้องล่าง (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: worked-example
    title: อ่านผลการตรวจหมู่เลือด
    problem: "เลือดของนักเรียนคนหนึ่งตกตะกอนกับแอนติ-B แต่ไม่ตกตะกอนกับแอนติ-A และแอนติ-D นักเรียนคนนี้มีหมู่เลือดใด และมีแอนติบอดีใดในพลาสมา"
    steps:
      - text: "ตกตะกอนกับแอนติ-B แปลว่ามีแอนติเจน B ไม่ตกตะกอนกับแอนติ-A แปลว่าไม่มีแอนติเจน A จึงเป็นหมู่ B"
      - text: "ไม่ตกตะกอนกับแอนติ-D แปลว่าไม่มีแอนติเจน D จึงเป็น Rh ลบ"
      - text: "หมู่ B มีแอนติบอดี A ในพลาสมา ส่วนแอนติบอดีต่อ D จะมีก็ต่อเมื่อเคยได้รับเลือด Rh บวก"
        why: "แอนติบอดีในระบบ ABO มีตามธรรมชาติ แต่ระบบ Rh สร้างหลังได้รับแอนติเจน D"
    answer: "หมู่ B Rh ลบ มีแอนติบอดี A ในพลาสมา"
  - { type: check, problem: biology.animals.circulation.p009, prompt: "อ่านผลแบบเดียวกันสำหรับคนที่ 1" }
glossary:
  - { term: ระบบหมุนเวียนเลือดแบบเปิด, definition: "ระบบที่ของเหลวออกจากหลอดเลือดไปอาบเซลล์ในช่องว่างของลำตัวโดยตรง เช่น ในแมลง" }
  - { term: ระบบหมุนเวียนเลือดแบบปิด, definition: "ระบบที่เลือดอยู่ในหลอดเลือดตลอดเวลา แลกเปลี่ยนสารผ่านหลอดเลือดฝอย" }
  - { term: เอสเอโนด, definition: "กลุ่มเซลล์พิเศษในห้องบนขวา สร้างสัญญาณไฟฟ้ากำหนดจังหวะการเต้นของหัวใจ" }
  - { term: ความดันเลือด, definition: "แรงดันของเลือดต่อผนังหลอดเลือดแดง บอกเป็นค่าขณะหัวใจบีบตัว/คลายตัว เช่น 120/80 มิลลิเมตรปรอท" }
  - { term: แอนติเจน, definition: "สารบนผิวเซลล์ที่ร่างกายจดจำได้ เช่น แอนติเจน A B และ D บนเซลล์เม็ดเลือดแดง" }
  - { term: น้ำเหลือง, definition: "ของเหลวระหว่างเซลล์ที่เข้าสู่หลอดน้ำเหลืองและไหลกลับสู่หลอดเลือดดำ" }
  - { term: ต่อมน้ำเหลือง, definition: "อวัยวะเล็ก ๆ ตามทางเดินน้ำเหลือง กรองเชื้อโรคและมีลิมโฟไซต์มาก" }
flashcards:
  - { front: "ระบบเปิดกับระบบปิด ตัวอย่างสัตว์", back: "เปิด: แมลง กุ้ง หอยส่วนใหญ่ ปิด: ไส้เดือนดิน หมึก สัตว์มีกระดูกสันหลัง" }
  - { front: "ทำไมเลือดไหลช้าที่สุดในหลอดเลือดฝอย", back: "พื้นที่หน้าตัดรวมมากที่สุด v = Q/A จึงต่ำที่สุด" }
  - { front: "ลำดับการนำไฟฟ้าในหัวใจ", back: "เอสเอโนด → ห้องบน → เอวีโนด → มัดใยกล้ามเนื้อหัวใจ → ห้องล่าง" }
  - { front: "หมู่ O มีแอนติเจนและแอนติบอดีอะไร", back: "ไม่มีแอนติเจน A และ B มีแอนติบอดีทั้ง A และ B" }
  - { front: "หน้าที่ของระบบน้ำเหลือง", back: "นำของเหลวระหว่างเซลล์กลับสู่เลือด กรองเชื้อโรค ดูดซึมไขมันทางแลกทีล" }
