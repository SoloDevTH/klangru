<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" font-family="sans-serif" font-size="14">
<title>ผังมอร์โฟโลยีของระบบน้ำสะอาดหมู่บ้าน</title>
<rect x="0" y="0" width="680" height="280" fill="#ffffff"/>
<text x="80.0" y="22.0" text-anchor="middle" fill="#15211e" font-size="14" font-weight="bold">ฟังก์ชัน</text>
<text x="375.0" y="22.0" text-anchor="middle" fill="#15211e" font-size="14" font-weight="bold">วิธีที่เป็นไปได้</text>
<rect x="20.0" y="30.0" width="120.0" height="60.0" rx="6" fill="#eef3f8" stroke="#15211e" stroke-width="2"/>
<text x="80.0" y="65.0" text-anchor="middle" fill="#15211e" font-size="14" font-weight="bold">สูบน้ำ</text>
