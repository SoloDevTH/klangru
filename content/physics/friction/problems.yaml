  - id: phy.fric.p018
    topics: [physics.dynamics.friction]
    difficulty: 4
    type: numeric
    stem: "นักเรียน ม.4 ลากกล่องบนโต๊ะด้วยความเร็วคงตัว แล้วเพิ่มน้ำหนักบนกล่องทีละขั้น บันทึกแรงเสียดทานจลน์และแรงปฏิกิริยาตั้งฉาก ได้กราฟดังรูป สัมประสิทธิ์ความเสียดทานจลน์เป็นเท่าใด (ตอบเป็นตัวเลข ไม่มีหน่วย)"
    figure: { src: p-fk-n.svg, alt: "กราฟแรงเสียดทานจลน์ fk (นิวตัน) กับแรงปฏิกิริยาตั้งฉาก N (นิวตัน) จุดข้อมูล 5 จุดที่ N = 10, 20, 30, 40, 50 N มีแรงเสียดทานประมาณ 3.6, 6.9, 10.6, 13.9, 17.6 N เส้นตรงที่เหมาะสมผ่านจุดกำเนิดและจุด (60 N, 21 N)" }
