id: earthscience.astronomy.moon-solar-system
subject: earthscience
title: { th: ดวงจันทร์ ระบบสุริยะ และดาวฤกษ์บนท้องฟ้า, en: "The Moon, the solar system and the stars" }
summary: การขึ้นตกและข้างขึ้นข้างแรมของดวงจันทร์ ดาวเคราะห์ในระบบสุริยะและคาบการโคจร ความต่างของดาวเคราะห์กับดาวฤกษ์ และการใช้แผนที่ดาวหากลุ่มดาวในรอบปี
difficulty: 1.8
minutes: 30
prerequisites: [earthscience.astronomy.sky-day-night]
encompasses:
  - { id: earthscience.astronomy.sky-day-night, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ข้างขึ้นข้างแรมจากแบบจำลอง
    src: moon-phases.svg
    alt: "แสงอาทิตย์ส่องมาจากทางซ้าย โลกอยู่ตรงกลาง ซีกซ้ายสว่าง ดวงจันทร์ 8 ตำแหน่งบนวงโคจรรอบโลก ทุกตำแหน่งสว่างด้านซ้ายที่หันหาดวงอาทิตย์ วงนอกแสดงรูปร่างที่คนบนโลกเห็น ตำแหน่งระหว่างโลกกับดวงอาทิตย์คือเดือนดับ มองไม่เห็น ทวนเข็มนาฬิกาต่อไปคือขึ้น 4 ค่ำ เสี้ยวด้านขวา ขึ้น 8 ค่ำ ครึ่งดวงด้านขวา ขึ้น 11 ค่ำ เกือบเต็มดวง ขึ้น 15 ค่ำ วันเพ็ญ เต็มดวง อยู่ด้านตรงข้ามกับดวงอาทิตย์ แรม 4 ค่ำ เกือบเต็มดวง แรม 8 ค่ำ ครึ่งดวงด้านซ้าย และแรม 11 ค่ำ เสี้ยวด้านซ้าย"
    caption: "ดวงจันทร์สว่างครึ่งลูกเสมอ ที่เปลี่ยนคือส่วนสว่างที่หันมาทางโลก (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: worked-example
    title: พยากรณ์รูปร่างของดวงจันทร์
    problem: "คืนนี้เป็นวันขึ้น 8 ค่ำ ดวงจันทร์สว่างครึ่งดวงด้านขวา อีกประมาณ 7 วัน ดวงจันทร์จะมีรูปร่างอย่างไร และขึ้นเวลาใด"
    steps:
      - text: "นับวัน ขึ้น 8 ค่ำ บวก 7 วัน เป็นขึ้น 15 ค่ำ"
      - text: "ขึ้น 15 ค่ำคือวันเพ็ญ ดวงจันทร์สว่างเต็มดวง"
        why: "ข้างขึ้น ส่วนสว่างใหญ่ขึ้นทุกวันจนเต็มดวง"
      - text: "วันเพ็ญดวงจันทร์อยู่ตรงข้ามกับดวงอาทิตย์ จึงขึ้นทางทิศตะวันออกตอนพลบค่ำ ขณะดวงอาทิตย์ตกทางทิศตะวันตก"
    answer: "เต็มดวง ขึ้นทางทิศตะวันออกประมาณ 18.00 น."
  - { type: check, problem: earthscience.astronomy.moon-solar-system.p005, prompt: "ข้างขึ้น ส่วนสว่างใหญ่ขึ้นทุกวัน" }
  - type: figure
    title: ดาวเคราะห์ในระบบสุริยะและคาบการโคจร
    src: solar-system.svg
    alt: "ดวงอาทิตย์อยู่ซ้ายสุด ดาวเคราะห์เรียงไปทางขวา พุธ 88 วัน ศุกร์ 225 วัน โลก 1 ปี อังคาร 1.9 ปี เป็นดาวเคราะห์ชั้นในที่เป็นหิน ตามด้วยแถบดาวเคราะห์น้อย แล้วเป็นดาวเคราะห์ชั้นนอกที่ใหญ่ คือ พฤหัสบดี 12 ปี เสาร์ 29 ปี มีวงแหวน ยูเรนัส 84 ปี และเนปจูน 165 ปี ตัวเลขคือเวลาโคจรรอบดวงอาทิตย์หนึ่งรอบ"
    caption: "ยิ่งไกลดวงอาทิตย์ ยิ่งใช้เวลาโคจรรอบนาน (วาดโดยทีมคลังรู้ ขนาดและระยะไม่ได้ตามมาตราส่วน)"
  - type: worked-example
    title: เทียบคาบการโคจรของดาวเคราะห์
    problem: "ดาวพฤหัสบดีโคจรรอบดวงอาทิตย์รอบละประมาณ 12 ปี ในเวลา 36 ปี ดาวพฤหัสบดีโคจรครบกี่รอบ และโลกโคจรครบกี่รอบ"
    steps:
      - text: "ดาวพฤหัสบดี: $36 \\div 12 = 3$ รอบ"
      - text: "โลกโคจรปีละ 1 รอบ: 36 ปี ได้ 36 รอบ"
      - text: "โลกโคจรได้มากกว่า เพราะอยู่ใกล้ดวงอาทิตย์กว่า วงโคจรสั้นกว่า และเคลื่อนที่เร็วกว่า"
        why: "ดาวที่อยู่ไกลทั้งเดินทางไกลกว่าและเคลื่อนที่ช้ากว่า"
    answer: "ดาวพฤหัสบดี 3 รอบ โลก 36 รอบ"
  - { type: check, problem: earthscience.astronomy.moon-solar-system.p007, prompt: "เวลาโคจรขึ้นกับอะไร" }
  - type: simulation
    title: "แบบจำลองการโคจร (PhET My Solar System)"
    url: https://phet.colorado.edu/en/simulations/my-solar-system
    provider: phet
    note: "เลือกระบบดวงอาทิตย์กับดาวเคราะห์ แล้วเปิดเส้นทางโคจร ลองวางดาวเคราะห์ใกล้และไกลดวงอาทิตย์ สังเกตว่าดวงใดโคจรครบรอบเร็วกว่า"
glossary:
  - { term: ข้างขึ้นข้างแรม, definition: "รูปร่างปรากฏของดวงจันทร์ที่เปลี่ยนไปในรอบประมาณ 29.5 วัน เพราะเรามองเห็นด้านสว่างของดวงจันทร์มากน้อยต่างกัน" }
  - { term: วันเพ็ญ, definition: "วันขึ้น 15 ค่ำ ดวงจันทร์สว่างเต็มดวง อยู่ด้านตรงข้ามกับดวงอาทิตย์" }
  - { term: ระบบสุริยะ, definition: "ดวงอาทิตย์กับสมาชิกที่โคจรรอบ ได้แก่ ดาวเคราะห์ 8 ดวง ดวงจันทร์ ดาวเคราะห์แคระ ดาวเคราะห์น้อย และดาวหาง" }
  - { term: ดาวฤกษ์, definition: "ดาวที่มีแสงในตัวเอง เช่น ดวงอาทิตย์" }
  - { term: ดาวเคราะห์, definition: "ดาวที่โคจรรอบดาวฤกษ์ ไม่มีแสงในตัวเอง เราเห็นได้เพราะสะท้อนแสง" }
  - { term: แผนที่ดาว, definition: "แผนที่แสดงตำแหน่งกลุ่มดาวบนท้องฟ้าตามเดือนและเวลา ใช้ยกขึ้นเหนือศีรษะแล้วหันทิศให้ตรง" }
flashcards:
  - { front: "ดวงจันทร์ขึ้นช้าลงวันละประมาณเท่าไร", back: "ประมาณ 50 นาที เพราะดวงจันทร์โคจรไปทางทิศตะวันออกระหว่างที่โลกหมุน" }
  - { front: "ทำไมจึงมีข้างขึ้นข้างแรม", back: "ดวงจันทร์สว่างครึ่งลูกเสมอ แต่เมื่อโคจรรอบโลก เราเห็นด้านสว่างมากน้อยต่างกัน" }
  - { front: "เรียงดาวเคราะห์จากใกล้ดวงอาทิตย์", back: "พุธ ศุกร์ โลก อังคาร พฤหัสบดี เสาร์ ยูเรนัส เนปจูน" }
  - { front: "ดาวฤกษ์ต่างจากดาวเคราะห์อย่างไร", back: "ดาวฤกษ์มีแสงในตัวเองและมักกะพริบ ดาวเคราะห์สะท้อนแสงอาทิตย์ แสงนิ่ง และเปลี่ยนตำแหน่งเทียบกับดาวฤกษ์" }
  - { front: "กลุ่มดาวขึ้นเร็วขึ้นวันละเท่าไร", back: "ประมาณ 4 นาที หรือเดือนละประมาณ 2 ชั่วโมง" }
