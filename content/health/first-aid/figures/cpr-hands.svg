<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" font-family="sans-serif" font-size="14">
<title>ตำแหน่งวางมือเมื่อกดหน้าอก: กึ่งกลางหน้าอก ครึ่งล่างของกระดูกหน้าอก</title>
<rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
<defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<path d="M150,60 C120,62 70,75 60,110 L52,330 L248,330 L240,110 C230,75 180,62 150,60 Z" fill="#f4e6da" stroke="#333" stroke-width="2"/>
<circle cx="150" cy="38" r="28" fill="#f4e6da" stroke="#333" stroke-width="2"/>
<path d="M150,92 C125,84 100,84 78,92 M150,92 C175,84 200,84 222,92" fill="none" stroke="#8a6d5a" stroke-width="2"/>
<path d="M140,130 C115,138 92,148 75,164 M160,130 C185,138 208,148 225,164" fill="none" stroke="#c8ab96" stroke-width="1.5"/>
<path d="M140,160 C115,168 92,178 75,194 M160,160 C185,168 208,178 225,194" fill="none" stroke="#c8ab96" stroke-width="1.5"/>
<path d="M140,190 C115,198 92,208 75,224 M160,190 C185,198 208,208 225,224" fill="none" stroke="#c8ab96" stroke-width="1.5"/>
<rect x="141" y="96" width="18" height="128" rx="7" fill="#e9d2bf" stroke="#8a6d5a" stroke-width="2"/>
<line x1="138" y1="160" x2="162" y2="160" stroke="#8a6d5a" stroke-width="1.5" stroke-dasharray="3,2"/>
<circle cx="150" cy="190" r="22" fill="#d9483b" fill-opacity="0.25" stroke="#b02a1e" stroke-width="2.5"/>
<circle cx="150" cy="190" r="4" fill="#b02a1e"/>
<line x1="162" y1="120" x2="300" y2="110" stroke="#333"/>
<text x="305" y="104">กระดูกหน้าอก (ครึ่งบน)</text>
<line x1="174" y1="190" x2="300" y2="190" stroke="#b02a1e" stroke-width="1.5"/>
<text x="305" y="184" font-weight="bold" fill="#b02a1e">จุดวางส้นมือ</text>
<text x="305" y="204">กึ่งกลางหน้าอก ครึ่งล่างของกระดูกหน้าอก</text>
<rect x="290" y="240" width="355" height="122" rx="8" fill="#f7f7f7" stroke="#999"/>
<text x="300" y="266" font-size="13">1. วางส้นมือข้างหนึ่งที่จุดนี้ อีกมือวางทับ</text>
<text x="300" y="292" font-size="13">2. แขนตรง ไหล่อยู่เหนือมือ กดลงตรง ๆ</text>
<text x="300" y="318" font-size="13">3. ผู้ใหญ่: ลึก 5–6 ซม. อัตรา 100–120 ครั้ง/นาที</text>
<text x="300" y="344" font-size="13">4. ปล่อยให้หน้าอกคืนตัวสุดทุกครั้ง หยุดให้น้อยที่สุด</text>
<text x="20" y="386" font-size="12" fill="#444">ภาพจำลองอย่างง่าย ไม่ใช่สัดส่วนจริง ตามแนวทาง AHA 2025 ฝึกกับหุ่นจริงก่อนใช้</text>
</svg>
