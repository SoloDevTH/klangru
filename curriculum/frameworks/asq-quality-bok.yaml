# ASQ Bodies of Knowledge (โครงเท่านั้น): Certified Quality Engineer (CQE, BoK 2022),
# Certified Six Sigma Green Belt (CSSGB, BoK 2022) และ Certified Manager of Quality/Organizational Excellence (CMQ/OE, BoK 2019)
#
# ที่มา (ตรวจเมื่อ 2026-10-24): เอกสาร "cert insert" ของแต่ละใบรับรองบน asq.org (ท้ายเอกสารระบุ "2022 CQE BoK",
# "2022 CSSGB BoK", "2019 CMQ/OE BoK") ถอดด้วย pdftotext แบบไม่จัดหน้า (เอกสารเป็นสองคอลัมน์) แล้วตรวจลำดับหัวข้อ
# หน้าเว็บ asq.org ระบุ "© American Society for Quality. All rights reserved."
#
# โครงและรหัส
# - strand = ใบรับรอง, standard = หมวดเลขโรมันของ BoK (พร้อมจำนวนข้อสอบในวงเล็บตามต้นฉบับ), indicator = หัวข้อย่อยตัวอักษร
# - รหัส "<ใบรับรอง> <เลขโรมัน>.<ตัวอักษร>" เช่น "CQE VI.F" ตามเลขข้อของต้นฉบับ (เติมชื่อใบรับรองนำหน้าเพื่อไม่ให้ซ้ำกัน)
# - ข้อความเป็นชื่อหัวข้อแปลและสรุปด้วยคำของคลังรู้ ไม่เก็บคำอธิบาย (subtext) หรือระดับการรู้คิดรายข้อ
id: asq-quality-bok
title: "ASQ Bodies of Knowledge: Certified Quality Engineer (2022), Certified Six Sigma Green Belt (2022), Certified Manager of Quality/Organizational Excellence (2019)"
short: ASQ BoK (CQE/CSSGB/CMQ-OE)
kind: body-of-knowledge
subjects: [management]
language: th
sources:
  - { title: "Certified Quality Engineer (CQE) certification insert / Body of Knowledge", url: "https://www.asq.org/cert/resource/pdf/certification/cqe-cert-insert.pdf", publisher: "American Society for Quality (ASQ)", retrieved: "2026-10-24" }
  - { title: "Certified Six Sigma Green Belt (CSSGB) certification insert / Body of Knowledge", url: "https://www.asq.org/cert/resource/pdf/certification/cssgb-cert-insert.pdf", publisher: "American Society for Quality (ASQ)", retrieved: "2026-10-24" }
  - { title: "Certified Manager of Quality/Organizational Excellence (CMQ/OE) certification insert / Body of Knowledge", url: "https://www.asq.org/cert/resource/pdf/certification/cmq-oe-cert-insert.pdf", publisher: "American Society for Quality (ASQ)", retrieved: "2026-10-24" }
copyright: "© American Society for Quality สงวนสิทธิ์ทั้งหมด (ตามข้อความท้ายหน้าเว็บ asq.org) ไม่มีสัญญาอนุญาตให้นำไปใช้ซ้ำ ไฟล์นี้เก็บเฉพาะโครงหมวดและชื่อหัวข้อที่สรุปด้วยคำของคลังรู้"
completeness: structure-and-summary
strands:
  - id: CQE
    title: Certified Quality Engineer (BoK 2022)
    standards:
      - id: "CQE I"
        text: "การจัดการและภาวะผู้นำ (17 ข้อ)"
        indicators:
          - { id: "CQE I.A", text: "ปรัชญาและรากฐานของคุณภาพ" }
          - { id: "CQE I.B", text: "ระบบบริหารคุณภาพ: แผนกลยุทธ์ การถ่ายทอด และระบบสารสนเทศคุณภาพ" }
          - { id: "CQE I.C", text: "จรรยาบรรณวิชาชีพของ ASQ" }
          - { id: "CQE I.D", text: "หลักการและเทคนิคภาวะผู้นำ" }
          - { id: "CQE I.E", text: "หลักการและเทคนิคการเป็นผู้อำนวยความสะดวกของทีม" }
          - { id: "CQE I.F", text: "ทักษะการสื่อสาร" }
          - { id: "CQE I.G", text: "ความสัมพันธ์กับลูกค้าและการวัดความพึงพอใจ" }
          - { id: "CQE I.H", text: "การจัดการผู้ส่งมอบ" }
          - { id: "CQE I.I", text: "อุปสรรคของการปรับปรุงคุณภาพ" }
      - id: "CQE II"
        text: "ระบบคุณภาพ (18 ข้อ)"
        indicators:
          - { id: "CQE II.A", text: "องค์ประกอบของระบบคุณภาพ" }
          - { id: "CQE II.B", text: "เอกสารของระบบคุณภาพ" }
          - { id: "CQE II.C", text: "มาตรฐานคุณภาพและแนวทางอื่น เช่น ISO 9001 และเกณฑ์รางวัลคุณภาพ" }
          - { id: "CQE II.D", text: "การตรวจติดตามคุณภาพ" }
          - { id: "CQE II.E", text: "ต้นทุนคุณภาพ" }
          - { id: "CQE II.F", text: "การฝึกอบรมด้านคุณภาพ" }
      - id: "CQE III"
        text: "การออกแบบผลิตภัณฑ์ กระบวนการ และบริการ (21 ข้อ)"
        indicators:
          - { id: "CQE III.A", text: "การจำแนกคุณลักษณะด้านคุณภาพ" }
          - { id: "CQE III.B", text: "ข้อมูลนำเข้า เทคนิค และการทบทวนการออกแบบ" }
          - { id: "CQE III.C", text: "แบบทางเทคนิคและข้อกำหนด" }
          - { id: "CQE III.D", text: "การทวนสอบและการตรวจสอบความใช้ได้ของการออกแบบ" }
          - { id: "CQE III.E", text: "ความเชื่อถือได้และการบำรุงรักษา" }
      - id: "CQE IV"
        text: "การควบคุมผลิตภัณฑ์และกระบวนการ (23 ข้อ)"
        indicators:
          - { id: "CQE IV.A", text: "วิธีควบคุมผลิตภัณฑ์และกระบวนการ เช่น แผนควบคุม" }
          - { id: "CQE IV.B", text: "การควบคุมวัสดุ การชี้บ่งและสอบกลับ" }
          - { id: "CQE IV.C", text: "การชักตัวอย่างเพื่อการยอมรับ" }
          - { id: "CQE IV.D", text: "การวัดและการทดสอบ" }
          - { id: "CQE IV.E", text: "มาตรวิทยาและการสอบเทียบ" }
          - { id: "CQE IV.F", text: "การวิเคราะห์ระบบการวัด (MSA)" }
      - id: "CQE V"
        text: "การปรับปรุงอย่างต่อเนื่อง (26 ข้อ)"
        indicators:
          - { id: "CQE V.A", text: "เครื่องมือควบคุมคุณภาพ" }
          - { id: "CQE V.B", text: "เครื่องมือบริหารและวางแผนคุณภาพ" }
          - { id: "CQE V.C", text: "วิธีการปรับปรุงอย่างต่อเนื่อง" }
          - { id: "CQE V.D", text: "เครื่องมือแบบลีน" }
          - { id: "CQE V.E", text: "การปฏิบัติการแก้ไข" }
          - { id: "CQE V.F", text: "การปฏิบัติการป้องกัน" }
      - id: "CQE VI"
        text: "วิธีการและเครื่องมือเชิงปริมาณ (34 ข้อ)"
        indicators:
          - { id: "CQE VI.A", text: "การเก็บและสรุปข้อมูล" }
          - { id: "CQE VI.B", text: "แนวคิดเชิงปริมาณและความน่าจะเป็นพื้นฐาน" }
          - { id: "CQE VI.C", text: "การแจกแจงความน่าจะเป็น" }
          - { id: "CQE VI.D", text: "การตัดสินใจเชิงสถิติ: การประมาณค่าและการทดสอบสมมติฐาน" }
          - { id: "CQE VI.E", text: "ความสัมพันธ์ระหว่างตัวแปร: สหสัมพันธ์และการถดถอย" }
          - { id: "CQE VI.F", text: "การควบคุมกระบวนการเชิงสถิติ (SPC)" }
          - { id: "CQE VI.G", text: "ความสามารถของกระบวนการและสมรรถนะ" }
          - { id: "CQE VI.H", text: "การออกแบบและวิเคราะห์การทดลอง" }
      - id: "CQE VII"
        text: "การบริหารความเสี่ยง (21 ข้อ)"
        indicators:
          - { id: "CQE VII.A", text: "พื้นฐานของความเสี่ยง" }
          - { id: "CQE VII.B", text: "การวางแผนและประเมินความเสี่ยง" }
          - { id: "CQE VII.C", text: "การจัดการ การควบคุม และการติดตามความเสี่ยง" }
  - id: CSSGB
    title: Certified Six Sigma Green Belt (BoK 2022)
    standards:
      - id: "CSSGB I"
        text: "ภาพรวม: ซิกซ์ซิกมากับองค์กร (11 ข้อ)"
        indicators:
          - { id: "CSSGB I.A", text: "ซิกซ์ซิกมากับเป้าหมายขององค์กร" }
          - { id: "CSSGB I.B", text: "หลักการลีนในองค์กร" }
          - { id: "CSSGB I.C", text: "วิธีการออกแบบเพื่อซิกซ์ซิกมา (DfSS)" }
      - id: "CSSGB II"
        text: "ระยะนิยาม (Define) (20 ข้อ)"
        indicators:
          - { id: "CSSGB II.A", text: "การระบุและคัดเลือกโครงการ" }
          - { id: "CSSGB II.B", text: "เสียงของลูกค้า (VoC)" }
          - { id: "CSSGB II.C", text: "พื้นฐานการจัดการโครงการ" }
          - { id: "CSSGB II.D", text: "เครื่องมือบริหารและวางแผน" }
          - { id: "CSSGB II.E", text: "ผลลัพธ์ทางธุรกิจของโครงการ" }
          - { id: "CSSGB II.F", text: "พลวัตและผลงานของทีม" }
      - id: "CSSGB III"
        text: "ระยะวัด (Measure) (20 ข้อ)"
        indicators:
          - { id: "CSSGB III.A", text: "การวิเคราะห์และจัดทำเอกสารกระบวนการ" }
          - { id: "CSSGB III.B", text: "ความน่าจะเป็นและสถิติ" }
          - { id: "CSSGB III.C", text: "การแจกแจงทางสถิติ" }
          - { id: "CSSGB III.D", text: "การเก็บและสรุปข้อมูล" }
          - { id: "CSSGB III.E", text: "การวิเคราะห์ระบบการวัด (MSA)" }
          - { id: "CSSGB III.F", text: "ความสามารถของกระบวนการและสมรรถนะ" }
      - id: "CSSGB IV"
        text: "ระยะวิเคราะห์ (Analyze) (18 ข้อ)"
        indicators:
          - { id: "CSSGB IV.A", text: "การวิเคราะห์ข้อมูลเชิงสำรวจ" }
          - { id: "CSSGB IV.B", text: "การทดสอบสมมติฐาน" }
          - { id: "CSSGB IV.C", text: "วิธีวิเคราะห์เพิ่มเติม: การวิเคราะห์ช่องว่างและการหาสาเหตุราก" }
      - id: "CSSGB V"
        text: "ระยะปรับปรุง (Improve) (16 ข้อ)"
        indicators:
          - { id: "CSSGB V.A", text: "การออกแบบการทดลอง (DoE)" }
          - { id: "CSSGB V.B", text: "การวางแผนนำการปรับปรุงไปใช้" }
          - { id: "CSSGB V.C", text: "เครื่องมือลีน: การกำจัดความสูญเปล่า การลดรอบเวลา ไคเซ็น" }
      - id: "CSSGB VI"
        text: "ระยะควบคุม (Control) (15 ข้อ)"
        indicators:
          - { id: "CSSGB VI.A", text: "การควบคุมกระบวนการเชิงสถิติ (SPC)" }
          - { id: "CSSGB VI.B", text: "การรักษาผลการปรับปรุง" }
          - { id: "CSSGB VI.C", text: "เครื่องมือลีนเพื่อควบคุมกระบวนการ" }
  - id: CMQOE
    title: Certified Manager of Quality/Organizational Excellence (BoK 2019)
    standards:
      - id: "CMQOE I"
        text: "ภาวะผู้นำ (28 ข้อ)"
        indicators:
          - { id: "CMQOE I.A", text: "โครงสร้างองค์กร" }
          - { id: "CMQOE I.B", text: "ความท้าทายของผู้นำ: บทบาท การจัดการการเปลี่ยนแปลง การสร้างแรงจูงใจ" }
          - { id: "CMQOE I.C", text: "ทีมและกระบวนการของทีม" }
          - { id: "CMQOE I.D", text: "จรรยาบรรณวิชาชีพของ ASQ" }
      - id: "CMQOE II"
        text: "การจัดทำและถ่ายทอดแผนกลยุทธ์ (22 ข้อ)"
        indicators:
          - { id: "CMQOE II.A", text: "ตัวแบบการวางแผนเชิงกลยุทธ์" }
          - { id: "CMQOE II.B", text: "การวิเคราะห์สภาพแวดล้อมทางธุรกิจ" }
          - { id: "CMQOE II.C", text: "การถ่ายทอดแผนกลยุทธ์สู่แผนปฏิบัติ" }
      - id: "CMQOE III"
        text: "องค์ประกอบและวิธีการจัดการ (31 ข้อ)"
        indicators:
          - { id: "CMQOE III.A", text: "ทักษะและความสามารถในการจัดการ" }
          - { id: "CMQOE III.B", text: "ทักษะการสื่อสาร" }
          - { id: "CMQOE III.C", text: "การจัดการโครงการ" }
          - { id: "CMQOE III.D", text: "ระบบคุณภาพ" }
          - { id: "CMQOE III.E", text: "ตัวแบบและทฤษฎีคุณภาพ" }
      - id: "CMQOE IV"
        text: "เครื่องมือการจัดการคุณภาพ (30 ข้อ)"
        indicators:
          - { id: "CMQOE IV.A", text: "เครื่องมือแก้ปัญหา รวมถึงเครื่องมือคุณภาพ 7 อย่าง" }
          - { id: "CMQOE IV.B", text: "การจัดการกระบวนการ" }
          - { id: "CMQOE IV.C", text: "การวัด: การประเมินและตัวชี้วัด" }
      - id: "CMQOE V"
        text: "องค์กรที่มุ่งเน้นลูกค้า (21 ข้อ)"
        indicators:
          - { id: "CMQOE V.A", text: "การระบุและจำแนกกลุ่มลูกค้า" }
          - { id: "CMQOE V.B", text: "การบริหารความสัมพันธ์กับลูกค้า" }
      - id: "CMQOE VI"
        text: "การจัดการโซ่อุปทาน (17 ข้อ)"
        indicators:
          - { id: "CMQOE VI.A", text: "การคัดเลือกและอนุมัติผู้ส่งมอบ" }
          - { id: "CMQOE VI.B", text: "การบริหารความเสี่ยงของผู้ส่งมอบ" }
          - { id: "CMQOE VI.C", text: "การสื่อสารกับผู้ส่งมอบ" }
          - { id: "CMQOE VI.D", text: "ผลการดำเนินงานของผู้ส่งมอบ" }
          - { id: "CMQOE VI.E", text: "การพัฒนาผู้ส่งมอบ" }
          - { id: "CMQOE VI.F", text: "การรับรองผู้ส่งมอบ หุ้นส่วน และพันธมิตร" }
          - { id: "CMQOE VI.G", text: "โลจิสติกส์ของผู้ส่งมอบและการตรวจรับวัสดุ" }
      - id: "CMQOE VII"
        text: "การฝึกอบรมและพัฒนา (16 ข้อ)"
        indicators:
          - { id: "CMQOE VII.A", text: "แผนการฝึกอบรม" }
          - { id: "CMQOE VII.B", text: "การวิเคราะห์ความต้องการการฝึกอบรม" }
          - { id: "CMQOE VII.C", text: "สื่อ การพัฒนา และการจัดการฝึกอบรม" }
          - { id: "CMQOE VII.D", text: "ประสิทธิผลและการประเมินการฝึกอบรม" }
