  - id: biology.ecology.populations.p015
    topics: [biology.ecology.populations]
    difficulty: 4
    type: mcq
    stem: "นักเรียนใช้วิธีจับซ้ำกับปลาในบ่อ แต่พบภายหลังว่าเครื่องหมายสีที่ทาไว้หลุดจากปลาไปครึ่งหนึ่งก่อนการจับครั้งที่สอง ขนาดประชากรที่คำนวณได้จะเป็นอย่างไร"
    choices:
      - { id: a, text: "มากกว่าความจริง เพราะนับปลาที่มีเครื่องหมาย (R) ได้น้อยลง ทั้งที่ R อยู่ในตัวหาร", correct: true }
      - { id: b, text: "น้อยกว่าความจริง เพราะปลาที่มีเครื่องหมายน้อยลง", feedback: "R ที่น้อยลงอยู่ในตัวหาร ทำให้ N ที่คำนวณได้มากขึ้น" }
      - { id: c, text: "เท่ากับความจริง เพราะ M และ C ไม่เปลี่ยน", feedback: "R เปลี่ยน ค่า N จึงเปลี่ยน" }
      - { id: d, text: "คำนวณไม่ได้เลย", feedback: "คำนวณได้ แต่ค่าที่ได้คลาดเคลื่อน" }
    hints:
      - "$N = \\frac{M \\times C}{R}$ ค่าใดเปลี่ยนเมื่อเครื่องหมายหลุด"
      - "ตัวหารลดลง ผลหารเปลี่ยนอย่างไร"
    solution: "เครื่องหมายหลุดทำให้นับ R ได้น้อยกว่าที่ควร R อยู่ในตัวหาร N ที่คำนวณได้จึงมากกว่าความจริง เครื่องหมายจึงต้องติดทนจนถึงการจับครั้งที่สอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.populations.p016
    topics: [biology.ecology.populations]
    difficulty: 5
    type: mcq
    stem: "ปลาหมอคางดำซึ่งเป็นปลาต่างถิ่นแพร่กระจายในแหล่งน้ำชายฝั่งหลายจังหวัด ข้อใดอธิบายการเพิ่มของประชากรได้สอดคล้องกับหลักนิเวศวิทยามากที่สุด"
    choices:
      - { id: a, text: "ในแหล่งน้ำใหม่มีอาหารมากและมีผู้ล่าหรือโรคเฉพาะน้อย ประชากรจึงเพิ่มเกือบแบบเอ็กซ์โพเนนเชียลในช่วงแรก และจะช้าลงเมื่อเข้าใกล้ความสามารถในการรองรับ ซึ่งอาจสูงกว่าที่ปลาท้องถิ่นเคยมี", correct: true }
      - { id: b, text: "ประชากรจะเพิ่มแบบเอ็กซ์โพเนนเชียลตลอดไปไม่มีขีดจำกัด", feedback: "ทรัพยากรในแหล่งน้ำมีจำกัด ในที่สุดการแข่งขันจะทำให้การเพิ่มช้าลง" }
      - { id: c, text: "ประชากรไม่เพิ่ม เพราะเป็นปลาต่างถิ่นที่ไม่ปรับตัว", feedback: "การแพร่ระบาดในหลายจังหวัดเป็นหลักฐานว่าปรับตัวได้ดี" }
      - { id: d, text: "การกำจัดปลาที่จับได้ไม่มีผลต่อประชากร", feedback: "การจับออกเพิ่มอัตราการตาย ลดขนาดประชากรได้ โดยเฉพาะเมื่อทำต่อเนื่องและพร้อมกันหลายพื้นที่" }
    hints:
      - "ชนิดต่างถิ่นในที่ใหม่มักไม่มีศัตรูธรรมชาติ"
      - "การเพิ่มแบบใดเกิดได้ระยะสั้น และอะไรทำให้ช้าลง"
    solution: "ในที่ใหม่ ปัจจัยที่ขึ้นกับความหนาแน่น เช่น ผู้ล่าและโรค ยังมีน้อย ประชากรจึงเพิ่มเร็วเกือบแบบเอ็กซ์โพเนนเชียล เมื่อหนาแน่นขึ้น การแข่งขันทำให้ช้าลงเข้าหา K แต่ระหว่างนั้นปลาต่างถิ่นอาจแย่งอาหารและกินลูกปลาท้องถิ่น การจับออกต่อเนื่องจึงเป็นส่วนหนึ่งของการควบคุม"
