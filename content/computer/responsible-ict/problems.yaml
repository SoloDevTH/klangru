    difficulty: 5
    type: mcq
    stem: "ทีมของมายด์ทำเกมเผยแพร่ฟรี โดยนำภาพตัวละครที่ใช้สัญญา CC BY-SA 4.0 มาแก้สีและวาดชุดใหม่ ภาพตัวละครที่ดัดแปลงแล้วต้องเผยแพร่ภายใต้สัญญาแบบใด"
    choices:
      - { id: a, text: "CC BY-SA 4.0 (หรือสัญญาที่ครีเอทีฟคอมมอนส์ประกาศว่าเข้ากันได้) พร้อมให้เครดิตงานต้นฉบับและบอกว่าดัดแปลงอะไร", correct: true }
      - { id: b, text: "สัญญาใดก็ได้ที่ทีมต้องการ เพราะดัดแปลงจนเป็นงานใหม่แล้ว", feedback: "SA กำหนดให้งานดัดแปลงใช้สัญญาเดียวกัน ทีมเลือกสัญญาอื่นเองไม่ได้" }
      - { id: c, text: "CC BY-NC-ND เพื่อป้องกันคนอื่นนำภาพไปใช้ต่อ", feedback: "การเพิ่ม NC และ ND เป็นการจำกัดเพิ่ม ซึ่งขัดกับเงื่อนไข SA ที่ต้องให้สิทธิเท่าเดิม" }
      - { id: d, text: "ไม่ต้องระบุสัญญา เพราะเกมแจกฟรี", feedback: "แจกฟรีก็ยังต้องทำตามเงื่อนไข BY และ SA" }
    hints:
      - "SA ย่อมาจาก share-alike"
      - "งานดัดแปลงต้องให้สิทธิแก่ผู้อื่นแบบเดียวกับที่ทีมได้รับมา"
    solution: "CC BY-SA กำหนดให้ให้เครดิต (BY) และงานดัดแปลงต้องเผยแพร่ภายใต้สัญญาเดียวกันหรือที่เข้ากันได้ (SA) ทีมจึงต้องใช้ CC BY-SA 4.0 กับภาพที่ดัดแปลง ให้เครดิตต้นฉบับ และบอกสิ่งที่แก้ไข ส่วนโค้ดของเกมเลือกสัญญาแยกได้"
