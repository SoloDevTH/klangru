id: physics.electricity.electric-power
subject: physics
title: { th: กำลังไฟฟ้าและค่าไฟฟ้า, en: Electric power and energy cost }
summary: คำนวณกำลังไฟฟ้าของเครื่องใช้ไฟฟ้า พลังงานไฟฟ้าในหน่วยกิโลวัตต์-ชั่วโมง และประมาณค่าไฟฟ้าในบ้านจากจำนวนหน่วยที่ใช้
difficulty: 4.5
minutes: 35
prerequisites: [physics.electricity.current-voltage, physics.energy.power]
encompasses:
  - { id: physics.electricity.current-voltage, weight: 0.5 }
  - { id: physics.energy.power, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: หลอดไส้กับหลอด LED
    problem: "หลอดไส้ $60\\ \\mathrm{W}$ และหลอด LED $9\\ \\mathrm{W}$ ให้แสงเท่ากัน คือพลังงานแสงประมาณ $3\\ \\mathrm{J}$ ทุกวินาที หาประสิทธิภาพของแต่ละหลอด และพลังงานที่ประหยัดได้ในหนึ่งปีถ้าเปิดวันละ 5 ชั่วโมง"
    figure:
      src: energy-flow.svg
      alt: "แถบแนวนอนตามมาตราส่วนเทียบพลังงานที่ใช้ทุก 1 วินาที หลอดไส้ 60 W แบ่งเป็นแสง 3 J และความร้อน 57 J หลอด LED 9 W แบ่งเป็นแสง 3 J และความร้อน 6 J ส่วนแสงยาวเท่ากันทั้งสองแถบ"
    steps:
      - text: "หลอดไส้: ประสิทธิภาพ $= \\dfrac{3}{60} \\times 100\\% = 5\\%$"
      - text: "หลอด LED: ประสิทธิภาพ $= \\dfrac{3}{9} \\times 100\\% \\approx 33\\%$"
        why: "แสงเท่ากัน แต่ LED เสียพลังงานเป็นความร้อนน้อยกว่ามาก"
      - text: "กำลังที่ประหยัดได้ $60 - 9 = 51\\ \\mathrm{W} = 0.051\\ \\mathrm{kW}$"
      - text: "พลังงานที่ประหยัดใน 1 ปี $= 0.051 \\times 5 \\times 365 \\approx 93\\ \\mathrm{kWh}$"
        why: "แปลงเป็นกิโลวัตต์ก่อน แล้วคูณจำนวนชั่วโมงทั้งหมด จึงได้จำนวนหน่วย"
    answer: "ประสิทธิภาพ $5\\%$ กับประมาณ $33\\%$ เปลี่ยนหลอดหนึ่งดวงประหยัดได้ราว $93$ หน่วยต่อปี"
  - { type: check, problem: phy.epow.p017, prompt: "ลองหาประสิทธิภาพของกาต้มน้ำ" }
  - type: worked-example
    title: ทำไมสายส่งใช้ความต่างศักย์สูง
    problem: "โรงไฟฟ้าส่งกำลัง $1\\ \\mathrm{MW}$ ผ่านสายส่งที่มีความต้านทานรวม $5\\ \\Omega$ เทียบกำลังที่สูญเสียในสายเมื่อส่งที่ $22\\ \\mathrm{kV}$ กับ $115\\ \\mathrm{kV}$"
    figure:
      src: transmission.svg
      alt: "โรงไฟฟ้ากำลัง 1 MW ต่อสายส่งสองเส้นไปยังเมือง สายส่งมีความต้านทานรวม 5 โอห์มแทนด้วยสัญลักษณ์ตัวต้านทาน กระแส I ไหลผ่านสายส่งและเสียพลังงาน I²R เป็นความร้อน"
    steps:
      - text: "ที่ $22\\ \\mathrm{kV}$: $I = \\dfrac{P}{V} = \\dfrac{10^6}{22\\,000} \\approx 45.5\\ \\mathrm{A}$"
      - text: "กำลังสูญเสีย $= I^2R = (45.5)^2(5) \\approx 10\\,300\\ \\mathrm{W}$ ประมาณ $1\\%$ ของกำลังที่ส่ง"
        why: "ใช้ $I^2R$ ของสายส่ง ไม่ใช่ $V^2/R$ ที่ใช้ $22\\ \\mathrm{kV}$ เพราะความต่างศักย์ $22\\ \\mathrm{kV}$ ไม่ได้ตกคร่อมสายส่ง แต่ส่วนใหญ่ตกคร่อมเครื่องใช้ในเมือง"
      - text: "ที่ $115\\ \\mathrm{kV}$: $I = \\dfrac{10^6}{115\\,000} \\approx 8.7\\ \\mathrm{A}$ กำลังสูญเสีย $= (8.7)^2(5) \\approx 378\\ \\mathrm{W}$"
      - text: "ความต่างศักย์เพิ่มประมาณ 5.2 เท่า กระแสลดลง 5.2 เท่า การสูญเสียลดลง $5.2^2 \\approx 27$ เท่า"
    answer: "สูญเสียประมาณ $10.3\\ \\mathrm{kW}$ ที่ $22\\ \\mathrm{kV}$ แต่เพียงราว $378\\ \\mathrm{W}$ ที่ $115\\ \\mathrm{kV}$"
  - { type: check, problem: phy.epow.p016, prompt: "ค่าไฟของตู้เย็นเบอร์ 5" }
  - type: interactive
    title: ค่าไฟต่อเดือนของเครื่องใช้ไฟฟ้าหนึ่งเครื่อง
    caption: แกนนอนคือจำนวนชั่วโมงที่ใช้ต่อวัน แกนตั้งคือค่าไฟใน 30 วัน (บาท) คิดจาก ค่าไฟ = (p ÷ 1000) × ชั่วโมง × 30 × c โดย p คือกำลังไฟฟ้า (W) และ c คืออัตราค่าไฟสมมติ (บาทต่อหน่วย) ลองเทียบแอร์ 1000 W กับพัดลม 50 W ที่ใช้วันละ 8 ชั่วโมงเท่ากัน
    widget:
      kind: function-plot
      functions: ["\\frac{30 c p x}{1000}"]
      sliders:
        - { name: p, min: 10, max: 2000, step: 10, value: 1000, label: กำลังไฟฟ้า (W) }
        - { name: c, min: 3, max: 6, step: 0.5, value: 4, label: อัตราค่าไฟสมมติ (บาทต่อหน่วย) }
      x: [0, 24]
      y: [0, 2000]
  - type: interactive
    title: กำลังไฟฟ้าที่ตัวต้านทานกับกระแส
    caption: แกนนอนคือกระแส I (A) แกนตั้งคือกำลังไฟฟ้า P (W) จาก P = I²R กราฟเป็นพาราโบลา ลองดูที่ I = 1 A แล้วเลื่อนไปที่ I = 2 A กำลังเพิ่มเป็นสี่เท่า ไม่ใช่สองเท่า สายไฟที่มีกระแสมากจึงร้อนเร็ว
    widget:
      kind: function-plot
      functions: ["R x^2"]
      sliders:
        - { name: R, min: 1, max: 20, step: 1, value: 10, label: ความต้านทาน R (Ω) }
      x: [0, 5]
      y: [0, 250]
glossary:
  - { term: กำลังไฟฟ้า, definition: "พลังงานไฟฟ้าที่อุปกรณ์ใช้ต่อหนึ่งวินาที $P = VI$ หน่วยวัตต์ ($\\mathrm{W} = \\mathrm{J/s}$)" }
  - { term: กิโลวัตต์-ชั่วโมง, definition: "หน่วยของพลังงานไฟฟ้าที่ใช้คิดค่าไฟ เรียกว่า 1 หน่วย คือพลังงานที่อุปกรณ์ $1\\ \\mathrm{kW}$ ใช้ใน 1 ชั่วโมง เท่ากับ $3.6 \\times 10^6\\ \\mathrm{J}$" }
  - { term: ประสิทธิภาพ, definition: "สัดส่วนของพลังงานที่ได้เป็นประโยชน์ต่อพลังงานที่ใส่เข้าไป คิดเป็นร้อยละ ไม่เกิน 100%" }
  - { term: ค่าไฟฟ้า, definition: "จำนวนหน่วย (kWh) คูณอัตราต่อหน่วย ค่าไฟจริงมีอัตราขั้นบันไดและค่าใช้จ่ายอื่นรวมอยู่ด้วย" }
flashcards:
  - { front: "สูตรกำลังไฟฟ้า 3 แบบ", back: "$P = VI = I^2R = \\dfrac{V^2}{R}$" }
  - { front: "1 หน่วยไฟฟ้า เท่ากับเท่าใด", back: "$1\\ \\mathrm{kWh}$ = เครื่อง $1000\\ \\mathrm{W}$ ใช้ 1 ชั่วโมง $= 3.6 \\times 10^6\\ \\mathrm{J}$" }
  - { front: "เตารีด $1000\\ \\mathrm{W}$ ใช้ 30 นาที กินไฟกี่หน่วย", back: "$1\\ \\mathrm{kW} \\times 0.5\\ \\mathrm{h} = 0.5\\ \\mathrm{kWh}$ = 0.5 หน่วย" }
  - { front: "หลอด $40\\ \\mathrm{W}$ กับ $100\\ \\mathrm{W}$ (ไฟบ้านเดียวกัน) หลอดใดความต้านทานมากกว่า", back: "หลอด $40\\ \\mathrm{W}$ เพราะ $R = \\dfrac{V^2}{P}$ กำลังน้อยกว่าจึงความต้านทานมากกว่า" }
  - { front: "ประสิทธิภาพของเครื่องใช้ไฟฟ้า", back: "พลังงานที่ได้เป็นประโยชน์ ÷ พลังงานที่ใส่เข้าไป × 100% ส่วนที่เหลือส่วนใหญ่กลายเป็นความร้อน" }
