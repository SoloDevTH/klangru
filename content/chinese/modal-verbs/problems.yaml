problems:
- id: chinese.grammar.modal-verbs.p001
  topics:
  - chinese.grammar.modal-verbs
  difficulty: 1
  type: mcq
  stem: 我想喝水。 (Wǒ xiǎng hē shuǐ.) แปลว่าอะไร
  choices:
  - id: a
    text: ฉันคิดถึงน้ำ
    feedback: 想 แปลว่า คิดถึง ได้เมื่อตามด้วยคน เช่น 我想你 แต่ในที่นี้ตามด้วยกริยา 喝
  - id: b
    text: ฉันดื่มน้ำได้ไหม
    feedback: ขออนุญาตใช้ 可以…吗
  - id: c
    text: ฉันอยากดื่มน้ำ
    correct: true
    feedback: ถูก 想 + กริยา = อยาก…
  - id: d
    text: ฉันดื่มน้ำเป็น
    feedback: ทำเป็น (ทักษะ) ใช้ 会
  hints:
  - 喝水 = ดื่มน้ำ
  - 想 วางหน้ากริยาแปลว่า อยาก
  solution: '**ฉันอยากดื่มน้ำ** 想 xiǎng + กริยา = อยาก…'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.modal-verbs.p002
  topics:
  - chinese.grammar.modal-verbs
  difficulty: 1
  type: match
  stem: จับคู่กริยาช่วยกับความหมายที่ใกล้ที่สุด
  pairs:
  - left: 想 xiǎng
    right: อยาก
  - left: 会 huì
    right: ทำเป็น (ฝึกมาแล้ว)
  - left: 能 néng
    right: ทำได้ (มีความสามารถหรือสภาพพร้อม)
  - left: 可以 kěyǐ
    right: ทำได้ (ได้รับอนุญาต)
  hints:
  - 会 ใช้กับทักษะที่ต้องเรียน เช่น ว่ายน้ำ พูดภาษา
  - 可以 ใช้ขออนุญาต
  solution: 想 อยาก · 会 ทำเป็น · 能 ทำได้ (สามารถ) · 可以 ทำได้ (อนุญาต)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.modal-verbs.p003
  topics:
  - chinese.grammar.modal-verbs
  difficulty: 2
  type: hanzi
  stem: เขียนอักษร 会 (huì) ที่แปลว่า ทำเป็น ตามลำดับขีด
  character: 会
  pinyin: huì
  meaning: ทำเป็น สามารถ (ที่ฝึกมา)
  hints:
  - 会 มี 6 ขีด ส่วนบนเหมือนหลังคา (撇 捺)
  - 'ส่วนล่างคือ 云: ขีดนอน 2 ขีด แล้วขีดหักและจุด'
  solution: 撇 → 捺 → 横 → 横 → 撇折 → 点 รวม 6 ขีด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.modal-verbs.p004
  topics:
  - chinese.grammar.modal-verbs
  difficulty: 2
  type: mcq
  stem: '"ฉันว่ายน้ำเป็น" (游泳 yóuyǒng = ว่ายน้ำ) ประโยคใดเหมาะที่สุด'
  choices:
  - id: a
    text: 我可以游泳。
    feedback: 可以 เน้นการได้รับอนุญาตหรือโอกาส ไม่ใช่ทักษะที่ฝึกมา
  - id: b
    text: 我会游泳。
    correct: true
    feedback: ถูก ว่ายน้ำเป็นทักษะที่ต้องฝึก ใช้ 会
  - id: c
    text: 我想游泳。
    feedback: 想 = อยากว่ายน้ำ ไม่ได้บอกว่าว่ายเป็น
  - id: d
    text: 我游泳会。
    feedback: กริยาช่วยวางหน้ากริยาหลัก
  hints:
  - ภาษาไทยพูดว่า ว่ายน้ำ เป็น
  - ทักษะที่ต้องเรียนรู้ใช้กริยาช่วยตัวใด
  solution: '**我会游泳。** Wǒ huì yóuyǒng. 会 = ทำเป็น (เรียนมาแล้ว)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.modal-verbs.p005
  topics:
  - chinese.grammar.modal-verbs
  difficulty: 2
  type: order
  stem: เรียงคำเป็นประโยค "ฉันอยากไปเชียงใหม่" (清迈 Qīngmài = เชียงใหม่)
  items:
  - 我
  - 想
  - 去
  - 清迈
  hints:
  - กริยาช่วยวางหลังประธาน หน้ากริยาหลัก
  - 'ลำดับ: ประธาน + 想 + กริยา + สถานที่'
  solution: '**我想去清迈。** Wǒ xiǎng qù Qīngmài.'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.modal-verbs.p006
  topics:
  - chinese.grammar.modal-verbs
  difficulty: 3
  type: mcq
  stem: นักท่องเที่ยวชาวจีนที่วัดพระแก้วถามเจ้าหน้าที่ว่า 这儿可以拍照吗？ (ที่นี่ถ่ายรูปได้ไหม) ถ้าบริเวณนั้นห้ามถ่ายรูป เจ้าหน้าที่ควรตอบว่าอะไร
  choices:
  - id: a
    text: 不会。
    feedback: 不会 = ทำไม่เป็น ไม่ใช่ไม่อนุญาต
  - id: b
    text: 没可以。
    feedback: 可以 ปฏิเสธด้วย 不 ไม่ใช้ 没
  - id: c
    text: 不想。
    feedback: 不想 = ไม่อยาก ไม่ใช่ไม่อนุญาต
  - id: d
    text: 不可以。
    correct: true
    feedback: ถูก ตอบปฏิเสธคำขออนุญาตด้วย 不可以 (หรือ 不行 / 不能)
  hints:
  - คำถามนี้ขออนุญาต
  - ตอบสั้น ๆ ด้วยกริยาช่วยตัวเดิมในรูปปฏิเสธ
  solution: '**不可以。** Bù kěyǐ. (พูด 不行 bù xíng หรือ 不能拍照 ก็ได้) ถ้าถ่ายได้ตอบ 可以。'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.modal-verbs.p007
  topics:
  - chinese.grammar.modal-verbs
  difficulty: 3
  type: mcq
  stem: เพื่อนชวนว่า 我要去吃火锅，你去吗？ ถ้าเราไม่อยากไป ประโยคใดเป็นธรรมชาติที่สุด (火锅 huǒguō = สุกี้หม้อไฟ)
  choices:
  - id: a
    text: 我不想去。
    correct: true
    feedback: ถูก รูปปฏิเสธของ 要 ที่แปลว่า ต้องการ/จะ นิยมใช้ 不想
  - id: b
    text: 我不要去。
    feedback: ฟังแรงหรือเหมือนเด็กดื้อ และ 不要 มักใช้เป็นคำห้าม "อย่า"
  - id: c
    text: 我没想去。
    feedback: ความต้องการตอนนี้ปฏิเสธด้วย 不 ไม่ใช่ 没
  - id: d
    text: 我不会去。
    feedback: 不会去 = จะไม่ไปแน่ (คาดการณ์) ไม่ได้บอกว่าไม่อยาก
  hints:
  - 要 ในที่นี้แปลว่า จะ/ต้องการ
  - บอกความไม่อยากอย่างสุภาพใช้ 不 + กริยาช่วยที่แปลว่า อยาก
  solution: '**我不想去。** Wǒ bù xiǎng qù. (要 ปฏิเสธเป็น 不想 เมื่อหมายถึงไม่อยาก)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.modal-verbs.p008
  topics:
  - chinese.grammar.modal-verbs
  difficulty: 3
  type: mcq
  stem: 'เติมคำในช่องว่าง: 我＿＿开车，但是今天喝了酒，不＿＿开车。 (ฉันขับรถเป็น แต่วันนี้ดื่มเหล้า จึงขับไม่ได้; 开车 kāichē = ขับรถ)'
  choices:
  - id: a
    text: 会 · 会
    feedback: 不会开车 = ขับรถไม่เป็น ซึ่งขัดกับประโยคแรก
  - id: b
    text: 会 · 能
    correct: true
    feedback: ถูก ขับรถเป็นทักษะ (会) แต่วันนี้สภาพไม่พร้อม (不能)
  - id: c
    text: 能 · 会
    feedback: สลับกัน ทักษะใช้ 会 สภาพหรือเงื่อนไขใช้ 能
  - id: d
    text: 想 · 想
    feedback: ไม่ได้พูดถึงความอยาก
  hints:
  - ส่วนแรกบอกทักษะที่เรียนมา
  - ส่วนที่สองบอกว่าวันนี้มีเหตุทำให้ขับไม่ได้
  solution: 我**会**开车，但是今天喝了酒，不**能**开车。
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.modal-verbs.p009
  topics:
  - chinese.grammar.modal-verbs
  difficulty: 3
  type: mcq
  stem: '"พรุ่งนี้ไม่ต้องไปโรงเรียน" ประโยคใดถูกต้อง'
  choices:
  - id: a
    text: 明天不会去学校。
    feedback: 不会 = จะไม่ (คาดการณ์) หรือทำไม่เป็น
  - id: b
    text: 明天没要去学校。
    feedback: กริยาช่วยปฏิเสธด้วย 不 ไม่ใช่ 没
  - id: c
    text: 明天不用去学校。
    correct: true
    feedback: ถูก ไม่ต้อง = 不用 (รูปปฏิเสธของ 要 ที่แปลว่า ต้อง)
  - id: d
    text: 明天不要去学校。
    feedback: '不要 = อย่า เป็นคำห้าม: พรุ่งนี้อย่าไปโรงเรียน'
  hints:
  - 要 แปลว่า ต้อง ได้ด้วย
  - ไม่ต้อง ภาษาจีนใช้คำพิเศษ ไม่ใช่ 不要
  solution: '**明天不用去学校。** Míngtiān búyòng qù xuéxiào. (不用 = ไม่ต้อง · 不要 = อย่า)'
  license: CC-BY-SA-4.0
  ai_assisted: true
