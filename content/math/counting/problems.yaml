problems:
  - id: math.cnt.p001
    topics: [math.prob.counting]
    difficulty: 1
    type: numeric
    stem: "ร้านก๋วยเตี๋ยวมีเส้นให้เลือก 4 ชนิด (เส้นเล็ก เส้นใหญ่ บะหมี่ วุ้นเส้น) และน้ำซุป 3 แบบ (น้ำใส น้ำตก ต้มยำ) ถ้าสั่งเส้น 1 ชนิดและน้ำ 1 แบบ จะสั่งได้ทั้งหมดกี่แบบ"
    answer: { value: 12, unit: แบบ }
    hints:
      - "การสั่งหนึ่งชามมีสองขั้น คือ เลือกเส้น แล้วเลือกน้ำ"
      - "เส้นแต่ละชนิดจับคู่กับน้ำได้ทุกแบบ จึงใช้หลักการคูณ"
    misconceptions:
      - { match: 7, feedback: "ดูเหมือนนำ 4 + 3 แต่ชามหนึ่งต้องเลือกทั้งเส้น **และ** น้ำ จึงต้องคูณ ไม่ใช่บวก" }
    solution: "เลือกเส้นได้ 4 แบบ และเส้นแต่ละแบบเลือกน้ำได้ 3 แบบ ตามหลักการคูณได้ $4 \\times 3 = 12$ แบบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.cnt.p002
    topics: [math.prob.counting]
    difficulty: 1
    type: mcq
    stem: "จะเดินทางจากกรุงเทพฯ ไปเชียงใหม่ในวันเสาร์ โดยเลือกเครื่องบิน 3 เที่ยว หรือรถทัวร์ 5 เที่ยว หรือรถไฟ 2 เที่ยว ถ้าเลือกเดินทางเพียงเที่ยวเดียว มีวิธีเลือกกี่วิธี"
    choices:
      - { id: a, text: "10 วิธี", correct: true }
      - { id: b, text: "30 วิธี", feedback: "การคูณใช้เมื่อต้องทำทุกขั้นต่อกัน แต่ที่นี่เลือกเพียงเที่ยวเดียวจากทางใดทางหนึ่ง จึงต้องบวก" }
      - { id: c, text: "3 วิธี", feedback: "นั่นคือจำนวนชนิดของพาหนะ แต่พาหนะแต่ละชนิดมีหลายเที่ยวให้เลือก ต้องนับทุกเที่ยว" }
      - { id: d, text: "8 วิธี", feedback: "ดูเหมือนนับเฉพาะเครื่องบินกับรถทัวร์ ลืมรถไฟอีก 2 เที่ยว" }
    hints:
      - "เลือกเพียงเที่ยวเดียว หมายถึงเลือกทางใดทางหนึ่ง"
      - "ทางเลือกที่ไม่ซ้ำกันและเลือกเพียงอย่างเดียว ใช้หลักการบวก"
    solution: "เลือกได้เพียงเที่ยวเดียวจากเครื่องบิน หรือรถทัวร์ หรือรถไฟ ตามหลักการบวกได้ $3 + 5 + 2 = 10$ วิธี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.cnt.p003
    topics: [math.prob.counting]
    difficulty: 2
    type: numeric
    stem: "$5!$ มีค่าเท่าใด"
    answer: { value: 120 }
    hints:
      - "$n!$ คือผลคูณของจำนวนเต็มตั้งแต่ $n$ ลงไปจนถึง 1"
      - "คำนวณ $5 \\times 4 \\times 3 \\times 2 \\times 1$"
    misconceptions:
      - { match: 15, feedback: "ดูเหมือนนำ $5 + 4 + 3 + 2 + 1$ แฟกทอเรียลคือการ **คูณ** ไม่ใช่การบวก" }
      - { match: 20, feedback: "ดูเหมือนคูณแค่ $5 \\times 4$ ต้องคูณต่อลงไปจนถึง 1" }
    solution: "$5! = 5 \\times 4 \\times 3 \\times 2 \\times 1 = 120$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.cnt.p004
    topics: [math.prob.counting]
    difficulty: 2
    type: numeric
    stem: "แอปธนาคารให้ตั้งรหัส PIN 4 หลัก แต่ละหลักเป็นเลข 0–9 และใช้เลขซ้ำกันได้ ตั้งรหัสได้ทั้งหมดกี่แบบ"
    answer: { value: 10000, unit: แบบ }
    hints:
      - "รหัสมี 4 หลัก แต่ละหลักเลือกได้กี่แบบ"
      - "ใช้เลขซ้ำได้ ทุกหลักจึงเลือกได้ 10 แบบเท่ากัน แล้วใช้หลักการคูณ"
    misconceptions:
      - { match: 5040, feedback: "ดูเหมือนคิดแบบห้ามใช้เลขซ้ำ ($10 \\times 9 \\times 8 \\times 7$) แต่โจทย์บอกว่าใช้เลขซ้ำได้ ทุกหลักจึงมี 10 แบบ" }
      - { match: 40, feedback: "ดูเหมือนนำ $10 \\times 4$ แต่ต้องนำ 10 มาคูณกันทั้ง 4 หลัก คือ $10 \\times 10 \\times 10 \\times 10$" }
    solution: "แต่ละหลักเลือกได้ 10 แบบ มี 4 หลัก ตามหลักการคูณได้ $10 \\times 10 \\times 10 \\times 10 = 10^4 = 10\\,000$ แบบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.cnt.p005
    topics: [math.prob.counting]
    difficulty: 3
    type: numeric
    stem: "หาค่าของ $\\dfrac{8!}{6!}$"
    answer: { value: 56 }
    hints:
      - "อย่าคำนวณ $8!$ เต็ม ๆ ให้เขียน $8! = 8 \\times 7 \\times 6!$"
      - "แล้วตัด $6!$ ที่อยู่ทั้งเศษและส่วนออก"
    misconceptions:
      - { match: 1.333, feedback: "ดูเหมือนตัดเครื่องหมาย ! ทิ้งแล้วคิด $\\tfrac{8}{6}$ แต่ $\\tfrac{8!}{6!}$ ไม่เท่ากับ $\\tfrac{8}{6}$ ให้กระจาย $8!$ ออกมาก่อน" }
      - { match: 2, feedback: "ดูเหมือนคิด $(8 - 6)! = 2$ การหารแฟกทอเรียลไม่ได้ทำแบบนั้น ให้เขียน $8! = 8 \\times 7 \\times 6!$" }
    solution: "$\\dfrac{8!}{6!} = \\dfrac{8 \\times 7 \\times 6!}{6!} = 8 \\times 7 = 56$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.cnt.p006
    topics: [math.prob.counting]
    difficulty: 3
    type: numeric
    stem: "นักเรียน 7 คนลงสมัครคณะกรรมการห้อง ต้องเลือกประธาน รองประธาน และเลขานุการ คนละตำแหน่ง มีวิธีเลือกได้กี่วิธี"
    answer: { value: 210, unit: วิธี }
    hints:
      - "ตำแหน่งทั้งสามต่างกัน ถ้าสลับคนกันจะได้คณะกรรมการแบบใหม่หรือไม่"
      - "ลำดับมีความหมาย ใช้การเรียงสับเปลี่ยน: ประธานเลือกได้ 7 คน แล้วรองประธานเหลือกี่คน"
      - "คูณจำนวนคนที่เลือกได้ในแต่ละตำแหน่ง ลดลงทีละ 1"
    misconceptions:
      - { match: 35, feedback: "นั่นคือ $C(7, 3)$ ซึ่งใช้เมื่อทั้ง 3 คนมีหน้าที่เหมือนกัน แต่ตำแหน่งที่นี่ต่างกัน ลำดับจึงสำคัญ" }
      - { match: 343, feedback: "ดูเหมือนคิด $7^3$ ซึ่งให้คนเดียวได้หลายตำแหน่ง แต่หนึ่งคนรับได้ตำแหน่งเดียว คนที่เหลือจึงลดลงทีละ 1" }
    solution: "ลำดับมีความหมาย: $P(7, 3) = 7 \\times 6 \\times 5 = 210$ วิธี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.cnt.p007
    topics: [math.prob.counting]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "สถานการณ์ใดที่ **ลำดับมีความหมาย** (ต้องใช้การเรียงสับเปลี่ยน) เลือกทุกข้อที่ถูก"
    choices:
      - { id: a, text: "จัดอันดับที่ 1, 2, 3 ในการประกวดร้องเพลง", correct: true }
      - { id: b, text: "ตั้งรหัสผ่านตู้ล็อกเกอร์ 3 หลักที่ไม่ใช้เลขซ้ำ", correct: true }
      - { id: c, text: "เลือกผลไม้ 2 ชนิดจาก 5 ชนิดมาใส่ตะกร้าเดียวกัน", feedback: "ได้มะม่วงกับส้มก็คือตะกร้าเดียวกับส้มกับมะม่วง สลับลำดับแล้วไม่ได้แบบใหม่ จึงเป็นการจัดหมู่" }
      - { id: d, text: "เลือกตัวแทน 4 คนไปแข่งฟุตซอลโดยไม่แบ่งหน้าที่", feedback: "ทั้ง 4 คนมีหน้าที่เหมือนกัน สลับลำดับการเลือกก็ยังเป็นทีมเดิม จึงเป็นการจัดหมู่" }
    hints:
      - "ลองสลับลำดับของที่เลือกมา แล้วถามว่าได้ผลลัพธ์แบบใหม่หรือไม่"
      - "ถ้าสลับแล้วได้แบบใหม่ ลำดับมีความหมาย ถ้าสลับแล้วยังเหมือนเดิม ลำดับไม่มีความหมาย"
    solution: "อันดับในการประกวดและรหัสผ่าน ถ้าสลับลำดับจะได้ผลใหม่ (รหัส 123 ไม่ใช่ 321) จึงใช้การเรียงสับเปลี่ยน ส่วนผลไม้ในตะกร้าและตัวแทนทีมที่ไม่แบ่งหน้าที่ สลับแล้วเหมือนเดิม จึงใช้การจัดหมู่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.cnt.p008
    topics: [math.prob.counting]
    difficulty: 4
    type: numeric
    stem: "ชุมชนแห่งหนึ่งมีอาสาสมัคร 9 คน ต้องเลือก 4 คนเป็นคณะทำงานจัดงานลอยกระทง โดยทุกคนในคณะมีหน้าที่เหมือนกัน เลือกได้กี่วิธี"
    answer: { value: 126, unit: วิธี }
    hints:
      - "หน้าที่เหมือนกัน แปลว่าลำดับการเลือกไม่มีความหมาย"
      - "ใช้การจัดหมู่ $C(9, 4) = \\dfrac{9!}{4!\\,5!}$"
      - "คิดง่าย ๆ ได้ว่า $\\dfrac{9 \\times 8 \\times 7 \\times 6}{4 \\times 3 \\times 2 \\times 1}$"
    misconceptions:
      - { match: 3024, feedback: "นั่นคือ $P(9, 4)$ ซึ่งนับกลุ่มเดียวกันซ้ำ $4! = 24$ ครั้ง เพราะทุกคนมีหน้าที่เหมือนกัน ต้องหารด้วย $4!$" }
      - { match: 36, feedback: "ดูเหมือนนำ $9 \\times 4$ การเลือก 4 คนจาก 9 คนต้องใช้สูตรการจัดหมู่ $C(9, 4)$" }
    solution: "$C(9, 4) = \\dfrac{9 \\times 8 \\times 7 \\times 6}{4 \\times 3 \\times 2 \\times 1} = \\dfrac{3024}{24} = 126$ วิธี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.cnt.p009
    topics: [math.prob.counting]
    difficulty: 4
    type: match
    stem: "จับคู่สัญลักษณ์กับค่าของมัน"
    pairs:
      - { left: "$0!$", right: "1" }
      - { left: "$P(5, 2)$", right: "20" }
      - { left: "$C(5, 2)$", right: "10" }
      - { left: "$5!$", right: "120" }
    hints:
      - "จำไว้ว่า $0! = 1$ ตามนิยาม"
      - "$P(5, 2)$ คูณลดลงทีละ 1 จำนวน 2 ตัว ส่วน $C(5, 2)$ นำค่านั้นหารด้วย $2!$"
    solution: "$0! = 1$ · $P(5, 2) = 5 \\times 4 = 20$ · $C(5, 2) = \\tfrac{20}{2!} = 10$ · $5! = 120$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.cnt.p010
    topics: [math.prob.counting]
    difficulty: 4
    type: numeric
    stem: "เพื่อน 5 คนนั่งรถไฟฟ้าบนเก้าอี้ยาวเรียงกัน 5 ที่ ถ้าแป้งกับต้นต้องนั่งติดกันเสมอ จะจัดที่นั่งได้กี่แบบ"
    answer: { value: 48, unit: แบบ }
    hints:
      - "มัดแป้งกับต้นเป็น \"ก้อนเดียว\" ตอนนี้มีของให้เรียงกี่ก้อน"
      - "เรียง 4 ก้อนได้ $4!$ แบบ"
      - "อย่าลืมว่าในก้อนนั้น แป้งกับต้นสลับที่กันได้ด้วย"
    misconceptions:
      - { match: 24, feedback: "ใกล้แล้ว แต่ลืมว่าแป้งกับต้นสลับกันได้ (แป้ง-ต้น หรือ ต้น-แป้ง) ต้องคูณ $2!$ อีก" }
      - { match: 120, feedback: "นั่นคือ $5!$ ซึ่งรวมแบบที่แป้งกับต้นไม่ได้นั่งติดกันด้วย ให้มัดสองคนนี้เป็นก้อนเดียวก่อน" }
    solution: "มัดแป้งกับต้นเป็น 1 ก้อน เหลือ 4 ก้อน เรียงได้ $4! = 24$ แบบ ในก้อนสลับกันได้ $2! = 2$ แบบ รวม $24 \\times 2 = 48$ แบบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.cnt.p011
    topics: [math.prob.counting]
    difficulty: 4
    type: expression
    stem: "ในงานเลี้ยงรุ่นมีคนมา $n$ คน ทุกคนจับมือกับคนอื่นทุกคน คู่ละ 1 ครั้ง จำนวนครั้งของการจับมือทั้งหมดเขียนเป็นนิพจน์ของ $n$ ได้อย่างไร"
    prefix: "จำนวนครั้ง ="
    answer: { latex: "\\frac{n(n-1)}{2}", variables: [n] }
    hints:
      - "การจับมือหนึ่งครั้งคือการเลือกคน 2 คน ลำดับมีความหมายหรือไม่"
      - "ก จับมือ ข กับ ข จับมือ ก คือครั้งเดียวกัน จึงใช้การจัดหมู่ $C(n, 2)$"
      - "เขียน $C(n, 2) = \\dfrac{n!}{2!\\,(n-2)!}$ แล้วตัดทอน"
    misconceptions:
      - { match: "n(n-1)", feedback: "นับแบบนี้ ก จับมือ ข กับ ข จับมือ ก ถูกนับเป็น 2 ครั้ง ต้องหารด้วย 2" }
      - { match: "n^2", feedback: "นับแบบนี้รวมการจับมือกับตัวเองด้วย และนับแต่ละคู่ซ้ำ ลองเลือกคน 2 คนจาก $n$ คนด้วยการจัดหมู่" }
    solution: "การจับมือ 1 ครั้ง คือการเลือกคน 2 คนโดยไม่สนลำดับ: $C(n, 2) = \\dfrac{n!}{2!\\,(n-2)!} = \\dfrac{n(n-1)}{2}$ ตรวจ: 5 คน ได้ $\\tfrac{5 \\times 4}{2} = 10$ ครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.cnt.p012
    topics: [math.prob.counting]
    difficulty: 3
    type: order
    stem: "เรียงค่าต่อไปนี้จากน้อยไปมาก"
    items:
      - "$C(6, 2)$"
      - "$4!$"
      - "$P(5, 3)$"
      - "$5!$"
    hints:
      - "คำนวณค่าของแต่ละตัวก่อน แล้วค่อยเรียง"
      - "$P(5, 3)$ คูณลดลง 3 ตัวจาก 5 ส่วน $C(6, 2)$ คือ $P(6, 2)$ หารด้วย $2!$"
    solution: "$C(6, 2) = \\tfrac{6 \\times 5}{2} = 15$ · $4! = 24$ · $P(5, 3) = 5 \\times 4 \\times 3 = 60$ · $5! = 120$ จึงเรียงเป็น $15 < 24 < 60 < 120$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.cnt.p013
    topics: [math.prob.counting]
    difficulty: 5
    type: numeric
    stem: "ใช้เลขโดด 0, 1, 2, 3, 4, 5 สร้างจำนวนสามหลัก โดยห้ามใช้เลขซ้ำกัน สร้างได้กี่จำนวน"
    answer: { value: 100, unit: จำนวน }
    hints:
      - "เริ่มจากหลักที่มีเงื่อนไขมากที่สุดก่อน คือหลักร้อย"
      - "หลักร้อยเป็น 0 ไม่ได้ จึงเลือกได้ 5 ตัว"
      - "หลักสิบเลือกจากตัวที่เหลือ (รวม 0 ได้แล้ว) และหลักหน่วยเลือกจากที่เหลืออีก แล้วใช้หลักการคูณ"
    misconceptions:
      - { match: 120, feedback: "นั่นคือ $P(6, 3)$ ซึ่งรวมแบบที่ขึ้นต้นด้วย 0 เช่น 045 ซึ่งไม่ใช่จำนวนสามหลัก" }
      - { match: 60, feedback: "ดูเหมือนห้ามใช้ 0 ทุกหลัก ($5 \\times 4 \\times 3$) แต่ 0 อยู่ในหลักสิบหรือหลักหน่วยได้ เช่น 105" }
    solution: "หลักร้อยเลือกได้ 5 ตัว (ไม่ใช่ 0) หลักสิบเลือกจาก 5 ตัวที่เหลือ (รวม 0) หลักหน่วยเลือกจาก 4 ตัวที่เหลือ ได้ $5 \\times 5 \\times 4 = 100$ จำนวน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.cnt.p014
    topics: [math.prob.counting]
    difficulty: 5
    type: numeric
