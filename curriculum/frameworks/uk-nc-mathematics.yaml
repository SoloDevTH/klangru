strands:
  - id: "Y1"
    title: "Year 1 programme of study"
    standards:
      - id: "UKNC-MA-Y1-NPV"
        text: "Number – number and place value"
        indicators:
          - { id: "UKNC-MA-Y1-NPV-01", level: "Y1", text: "count to and across 100, forwards and backwards, beginning with 0 or 1, or from any given number" }
          - { id: "UKNC-MA-Y1-NPV-02", level: "Y1", text: "count, read and write numbers to 100 in numerals; count in multiples of twos, fives and tens" }
          - { id: "UKNC-MA-Y1-NPV-03", level: "Y1", text: "given a number, identify one more and one less" }
          - { id: "UKNC-MA-Y1-NPV-04", level: "Y1", text: "identify and represent numbers using objects and pictorial representations including the number line, and use the language of: equal to, more than, less than (fewer), most, least" }
          - { id: "UKNC-MA-Y1-NPV-05", level: "Y1", text: "read and write numbers from 1 to 20 in numerals and words." }
      - id: "UKNC-MA-Y1-NAS"
        text: "Number – addition and subtraction"
        indicators:
          - { id: "UKNC-MA-Y1-NAS-01", level: "Y1", text: "read, write and interpret mathematical statements involving addition (+), subtraction (–) and equals (=) signs" }
          - { id: "UKNC-MA-Y1-NAS-02", level: "Y1", text: "represent and use number bonds and related subtraction facts within 20" }
          - { id: "UKNC-MA-Y1-NAS-03", level: "Y1", text: "add and subtract one-digit and two-digit numbers to 20, including zero" }
          - { id: "UKNC-MA-Y1-NAS-04", level: "Y1", text: "solve one-step problems that involve addition and subtraction, using concrete objects and pictorial representations, and missing number problems such as 7 = – 9." }
      - id: "UKNC-MA-Y1-NMD"
        text: "Number – multiplication and division"
        indicators:
          - { id: "UKNC-MA-Y1-NMD-01", level: "Y1", text: "solve one-step problems involving multiplication and division, by calculating the answer using concrete objects, pictorial representations and arrays with the support of the teacher." }
      - id: "UKNC-MA-Y1-NF"
        text: "Number – fractions"
        indicators:
          - { id: "UKNC-MA-Y1-NF-01", level: "Y1", text: "recognise, find and name a half as one of two equal parts of an object, shape or quantity" }
          - { id: "UKNC-MA-Y1-NF-02", level: "Y1", text: "recognise, find and name a quarter as one of four equal parts of an object, shape or quantity." }
      - id: "UKNC-MA-Y1-M"
        text: "Measurement"
        indicators:
          - { id: "UKNC-MA-Y1-M-01", level: "Y1", text: "compare, describe and solve practical problems for: • lengths and heights [for example, long/short, longer/shorter, tall/short, double/half] • mass/weight [for example, heavy/light, heavier than, lighter than] • capacity and volume [for example, full/empty, more than, less than, half, half full, quarter] • time [for example, quicker, slower, earlier, later]" }
          - { id: "UKNC-MA-Y1-M-02", level: "Y1", text: "measure and begin to record the following: • lengths and heights • mass/weight • capacity and volume • time (hours, minutes, seconds) • recognise and know the value of different denominations of coins and notes • sequence events in chronological order using language [for example, before and after, next, first, today, yesterday, tomorrow, morning, afternoon and evening]" }
          - { id: "UKNC-MA-Y1-M-03", level: "Y1", text: "recognise and use language relating to dates, including days of the week, weeks, months and years" }
          - { id: "UKNC-MA-Y1-M-04", level: "Y1", text: "tell the time to the hour and half past the hour and draw the hands on a clock face to show these times." }
      - id: "UKNC-MA-Y1-GPS"
        text: "Geometry – properties of shapes"
        indicators:
          - { id: "UKNC-MA-Y1-GPS-01", level: "Y1", text: "recognise and name common 2-D and 3-D shapes, including: • 2-D shapes [for example, rectangles (including squares), circles and triangles] • 3-D shapes [for example, cuboids (including cubes), pyramids and spheres]." }
      - id: "UKNC-MA-Y1-GPD"
        text: "Geometry – position and direction"
        indicators:
          - { id: "UKNC-MA-Y1-GPD-01", level: "Y1", text: "describe position, direction and movement, including whole, half, quarter and three-quarter turns." }
  - id: "Y2"
    title: "Year 2 programme of study"
    standards:
      - id: "UKNC-MA-Y2-NPV"
        text: "Number – number and place value"
        indicators:
          - { id: "UKNC-MA-Y2-NPV-01", level: "Y2", text: "count in steps of 2, 3, and 5 from 0, and in tens from any number, forward and backward" }
          - { id: "UKNC-MA-Y2-NPV-02", level: "Y2", text: "recognise the place value of each digit in a two-digit number (tens, ones)" }
          - { id: "UKNC-MA-Y2-NPV-03", level: "Y2", text: "identify, represent and estimate numbers using different representations, including the number line" }
          - { id: "UKNC-MA-Y2-NPV-04", level: "Y2", text: "compare and order numbers from 0 up to 100; use <, > and = signs" }
          - { id: "UKNC-MA-Y2-NPV-05", level: "Y2", text: "read and write numbers to at least 100 in numerals and in words" }
          - { id: "UKNC-MA-Y2-NPV-06", level: "Y2", text: "use place value and number facts to solve problems." }
      - id: "UKNC-MA-Y2-NAS"
        text: "Number – addition and subtraction"
        indicators:
          - { id: "UKNC-MA-Y2-NAS-01", level: "Y2", text: "solve problems with addition and subtraction: • using concrete objects and pictorial representations, including those involving numbers, quantities and measures • applying their increasing knowledge of mental and written methods" }
          - { id: "UKNC-MA-Y2-NAS-02", level: "Y2", text: "recall and use addition and subtraction facts to 20 fluently, and derive and use related facts up to 100" }
          - { id: "UKNC-MA-Y2-NAS-03", level: "Y2", text: "add and subtract numbers using concrete objects, pictorial representations, and mentally, including: • a two-digit number and ones • a two-digit number and tens • two two-digit numbers • adding three one-digit numbers" }
          - { id: "UKNC-MA-Y2-NAS-04", level: "Y2", text: "show that addition of two numbers can be done in any order (commutative) and subtraction of one number from another cannot" }
          - { id: "UKNC-MA-Y2-NAS-05", level: "Y2", text: "recognise and use the inverse relationship between addition and subtraction and use this to check calculations and solve missing number problems." }
      - id: "UKNC-MA-Y2-NMD"
        text: "Number – multiplication and division"
        indicators:
          - { id: "UKNC-MA-Y2-NMD-01", level: "Y2", text: "recall and use multiplication and division facts for the 2, 5 and 10 multiplication tables, including recognising odd and even numbers" }
          - { id: "UKNC-MA-Y2-NMD-02", level: "Y2", text: "calculate mathematical statements for multiplication and division within the multiplication tables and write them using the multiplication (×), division (÷) and equals (=) signs" }
          - { id: "UKNC-MA-Y2-NMD-03", level: "Y2", text: "show that multiplication of two numbers can be done in any order (commutative) and division of one number by another cannot" }
          - { id: "UKNC-MA-Y2-NMD-04", level: "Y2", text: "solve problems involving multiplication and division, using materials, arrays, repeated addition, mental methods, and multiplication and division facts, including problems in contexts." }
      - id: "UKNC-MA-Y2-NF"
        text: "Number – fractions"
        indicators:
          - { id: "UKNC-MA-Y2-NF-01", level: "Y2", text: "recognise, find, name and write fractions 1/3, 1/4, 2/4 and 3/4 of a length, shape, set of objects or quantity" }
          - { id: "UKNC-MA-Y2-NF-02", level: "Y2", text: "write simple fractions for example, 1/2 of 6 = 3 and recognise the equivalence of 2/4 and 1/2." }
      - id: "UKNC-MA-Y2-M"
        text: "Measurement"
        indicators:
          - { id: "UKNC-MA-Y2-M-01", level: "Y2", text: "choose and use appropriate standard units to estimate and measure length/height in any direction (m/cm); mass (kg/g); temperature (°C); capacity (litres/ml) to the nearest appropriate unit, using rulers, scales, thermometers and measuring vessels" }
          - { id: "UKNC-MA-Y2-M-02", level: "Y2", text: "compare and order lengths, mass, volume/capacity and record the results using >, < and =" }
          - { id: "UKNC-MA-Y2-M-03", level: "Y2", text: "recognise and use symbols for pounds (£) and pence (p); combine amounts to make a particular value" }
          - { id: "UKNC-MA-Y2-M-04", level: "Y2", text: "find different combinations of coins that equal the same amounts of money" }
          - { id: "UKNC-MA-Y2-M-05", level: "Y2", text: "solve simple problems in a practical context involving addition and subtraction of money of the same unit, including giving change" }
          - { id: "UKNC-MA-Y2-M-06", level: "Y2", text: "compare and sequence intervals of time" }
          - { id: "UKNC-MA-Y2-M-07", level: "Y2", text: "tell and write the time to five minutes, including quarter past/to the hour and draw the hands on a clock face to show these times" }
          - { id: "UKNC-MA-Y2-M-08", level: "Y2", text: "know the number of minutes in an hour and the number of hours in a day." }
      - id: "UKNC-MA-Y2-GPS"
        text: "Geometry – properties of shapes"
        indicators:
          - { id: "UKNC-MA-Y2-GPS-01", level: "Y2", text: "identify and describe the properties of 2-D shapes, including the number of sides and line symmetry in a vertical line" }
          - { id: "UKNC-MA-Y2-GPS-02", level: "Y2", text: "identify and describe the properties of 3-D shapes, including the number of edges, vertices and faces" }
          - { id: "UKNC-MA-Y2-GPS-03", level: "Y2", text: "identify 2-D shapes on the surface of 3-D shapes, [for example, a circle on a cylinder and a triangle on a pyramid]" }
          - { id: "UKNC-MA-Y2-GPS-04", level: "Y2", text: "compare and sort common 2-D and 3-D shapes and everyday objects." }
      - id: "UKNC-MA-Y2-GPD"
        text: "Geometry – position and direction"
        indicators:
          - { id: "UKNC-MA-Y2-GPD-01", level: "Y2", text: "order and arrange combinations of mathematical objects in patterns and sequences" }
          - { id: "UKNC-MA-Y2-GPD-02", level: "Y2", text: "use mathematical vocabulary to describe position, direction and movement, including movement in a straight line and distinguishing between rotation as a turn and in terms of right angles for quarter, half and three-quarter turns (clockwise and anti-clockwise)." }
      - id: "UKNC-MA-Y2-S"
        text: "Statistics"
        indicators:
          - { id: "UKNC-MA-Y2-S-01", level: "Y2", text: "interpret and construct simple pictograms, tally charts, block diagrams and simple tables" }
          - { id: "UKNC-MA-Y2-S-02", level: "Y2", text: "ask and answer simple questions by counting the number of objects in each category and sorting the categories by quantity" }
          - { id: "UKNC-MA-Y2-S-03", level: "Y2", text: "ask and answer questions about totalling and comparing categorical data." }
  - id: "Y3"
    title: "Year 3 programme of study"
    standards:
      - id: "UKNC-MA-Y3-NPV"
        text: "Number – number and place value"
        indicators:
          - { id: "UKNC-MA-Y3-NPV-01", level: "Y3", text: "count from 0 in multiples of 4, 8, 50 and 100; find 10 or 100 more or less than a given number" }
          - { id: "UKNC-MA-Y3-NPV-02", level: "Y3", text: "recognise the place value of each digit in a three-digit number (hundreds, tens, ones)" }
          - { id: "UKNC-MA-Y3-NPV-03", level: "Y3", text: "compare and order numbers up to 1000" }
          - { id: "UKNC-MA-Y3-NPV-04", level: "Y3", text: "identify, represent and estimate numbers using different representations" }
          - { id: "UKNC-MA-Y3-NPV-05", level: "Y3", text: "read and write numbers up to 1000 in numerals and in words" }
          - { id: "UKNC-MA-Y3-NPV-06", level: "Y3", text: "solve number problems and practical problems involving these ideas." }
      - id: "UKNC-MA-Y3-NAS"
        text: "Number – addition and subtraction"
        indicators:
          - { id: "UKNC-MA-Y3-NAS-01", level: "Y3", text: "add and subtract numbers mentally, including: • a three-digit number and ones • a three-digit number and tens • a three-digit number and hundreds" }
          - { id: "UKNC-MA-Y3-NAS-02", level: "Y3", text: "add and subtract numbers with up to three digits, using formal written methods of columnar addition and subtraction" }
          - { id: "UKNC-MA-Y3-NAS-03", level: "Y3", text: "estimate the answer to a calculation and use inverse operations to check answers" }
          - { id: "UKNC-MA-Y3-NAS-04", level: "Y3", text: "solve problems, including missing number problems, using number facts, place value, and more complex addition and subtraction." }
      - id: "UKNC-MA-Y3-NMD"
        text: "Number – multiplication and division"
        indicators:
          - { id: "UKNC-MA-Y3-NMD-01", level: "Y3", text: "recall and use multiplication and division facts for the 3, 4 and 8 multiplication tables" }
          - { id: "UKNC-MA-Y3-NMD-02", level: "Y3", text: "write and calculate mathematical statements for multiplication and division using the multiplication tables that they know, including for two-digit numbers times one-digit numbers, using mental and progressing to formal written methods" }
          - { id: "UKNC-MA-Y3-NMD-03", level: "Y3", text: "solve problems, including missing number problems, involving multiplication and division, including positive integer scaling problems and correspondence problems in which n objects are connected to m objects." }
      - id: "UKNC-MA-Y3-NF"
        text: "Number – fractions"
        indicators:
          - { id: "UKNC-MA-Y3-NF-01", level: "Y3", text: "count up and down in tenths; recognise that tenths arise from dividing an object into 10 equal parts and in dividing one-digit numbers or quantities by 10" }
          - { id: "UKNC-MA-Y3-NF-02", level: "Y3", text: "recognise, find and write fractions of a discrete set of objects: unit fractions and non-unit fractions with small denominators" }
          - { id: "UKNC-MA-Y3-NF-03", level: "Y3", text: "recognise and use fractions as numbers: unit fractions and non-unit fractions with small denominators" }
          - { id: "UKNC-MA-Y3-NF-04", level: "Y3", text: "recognise and show, using diagrams, equivalent fractions with small denominators" }
          - { id: "UKNC-MA-Y3-NF-05", level: "Y3", text: "add and subtract fractions with the same denominator within one whole [for example, 5/7 + 1/7 = 6/7]" }
          - { id: "UKNC-MA-Y3-NF-06", level: "Y3", text: "compare and order unit fractions, and fractions with the same denominators" }
          - { id: "UKNC-MA-Y3-NF-07", level: "Y3", text: "solve problems that involve all of the above." }
      - id: "UKNC-MA-Y3-M"
        text: "Measurement"
        indicators:
          - { id: "UKNC-MA-Y3-M-01", level: "Y3", text: "measure, compare, add and subtract: lengths (m/cm/mm); mass (kg/g); volume/capacity (l/ml)" }
          - { id: "UKNC-MA-Y3-M-02", level: "Y3", text: "measure the perimeter of simple 2-D shapes" }
          - { id: "UKNC-MA-Y3-M-03", level: "Y3", text: "add and subtract amounts of money to give change, using both £ and p in practical contexts" }
          - { id: "UKNC-MA-Y3-M-04", level: "Y3", text: "tell and write the time from an analogue clock, including using Roman numerals from I to XII, and 12-hour and 24-hour clocks" }
          - { id: "UKNC-MA-Y3-M-05", level: "Y3", text: "estimate and read time with increasing accuracy to the nearest minute; record and compare time in terms of seconds, minutes and hours; use vocabulary such as o’clock, a.m./p.m., morning, afternoon, noon and midnight" }
          - { id: "UKNC-MA-Y3-M-06", level: "Y3", text: "know the number of seconds in a minute and the number of days in each month, year and leap year" }
          - { id: "UKNC-MA-Y3-M-07", level: "Y3", text: "compare durations of events [for example to calculate the time taken by particular events or tasks]." }
      - id: "UKNC-MA-Y3-GPS"
        text: "Geometry – properties of shapes"
        indicators:
          - { id: "UKNC-MA-Y3-GPS-01", level: "Y3", text: "draw 2-D shapes and make 3-D shapes using modelling materials; recognise 3-D shapes in different orientations and describe them" }
          - { id: "UKNC-MA-Y3-GPS-02", level: "Y3", text: "recognise angles as a property of shape or a description of a turn" }
          - { id: "UKNC-MA-Y3-GPS-03", level: "Y3", text: "identify right angles, recognise that two right angles make a half-turn, three make three quarters of a turn and four a complete turn; identify whether angles are greater than or less than a right angle" }
          - { id: "UKNC-MA-Y3-GPS-04", level: "Y3", text: "identify horizontal and vertical lines and pairs of perpendicular and parallel lines." }
      - id: "UKNC-MA-Y3-S"
        text: "Statistics"
        indicators:
          - { id: "UKNC-MA-Y3-S-01", level: "Y3", text: "interpret and present data using bar charts, pictograms and tables" }
          - { id: "UKNC-MA-Y3-S-02", level: "Y3", text: "solve one-step and two-step questions [for example, ‘How many more?’ and ‘How many fewer?’] using information presented in scaled bar charts and pictograms and tables." }
  - id: "Y4"
    title: "Year 4 programme of study"
    standards:
      - id: "UKNC-MA-Y4-NPV"
        text: "Number – number and place value"
        indicators:
          - { id: "UKNC-MA-Y4-NPV-01", level: "Y4", text: "count in multiples of 6, 7, 9, 25 and 1000" }
          - { id: "UKNC-MA-Y4-NPV-02", level: "Y4", text: "find 1000 more or less than a given number" }
          - { id: "UKNC-MA-Y4-NPV-03", level: "Y4", text: "count backwards through zero to include negative numbers" }
          - { id: "UKNC-MA-Y4-NPV-04", level: "Y4", text: "recognise the place value of each digit in a four-digit number (thousands, hundreds, tens, and ones)" }
          - { id: "UKNC-MA-Y4-NPV-05", level: "Y4", text: "order and compare numbers beyond 1000" }
          - { id: "UKNC-MA-Y4-NPV-06", level: "Y4", text: "identify, represent and estimate numbers using different representations" }
          - { id: "UKNC-MA-Y4-NPV-07", level: "Y4", text: "round any number to the nearest 10, 100 or 1000" }
          - { id: "UKNC-MA-Y4-NPV-08", level: "Y4", text: "solve number and practical problems that involve all of the above and with increasingly large positive numbers" }
          - { id: "UKNC-MA-Y4-NPV-09", level: "Y4", text: "read Roman numerals to 100 (I to C) and know that over time, the numeral system changed to include the concept of zero and place value." }
      - id: "UKNC-MA-Y4-NAS"
        text: "Number – addition and subtraction"
        indicators:
          - { id: "UKNC-MA-Y4-NAS-01", level: "Y4", text: "add and subtract numbers with up to 4 digits using the formal written methods of columnar addition and subtraction where appropriate" }
          - { id: "UKNC-MA-Y4-NAS-02", level: "Y4", text: "estimate and use inverse operations to check answers to a calculation" }
          - { id: "UKNC-MA-Y4-NAS-03", level: "Y4", text: "solve addition and subtraction two-step problems in contexts, deciding which operations and methods to use and why." }
      - id: "UKNC-MA-Y4-NMD"
        text: "Number – multiplication and division"
        indicators:
          - { id: "UKNC-MA-Y4-NMD-01", level: "Y4", text: "recall multiplication and division facts for multiplication tables up to 12 × 12" }
          - { id: "UKNC-MA-Y4-NMD-02", level: "Y4", text: "use place value, known and derived facts to multiply and divide mentally, including: multiplying by 0 and 1; dividing by 1; multiplying together three numbers" }
          - { id: "UKNC-MA-Y4-NMD-03", level: "Y4", text: "recognise and use factor pairs and commutativity in mental calculations" }
          - { id: "UKNC-MA-Y4-NMD-04", level: "Y4", text: "multiply two-digit and three-digit numbers by a one-digit number using formal written layout" }
          - { id: "UKNC-MA-Y4-NMD-05", level: "Y4", text: "solve problems involving multiplying and adding, including using the distributive law to multiply two digit numbers by one digit, integer scaling problems and harder correspondence problems such as n objects are connected to m objects." }
      - id: "UKNC-MA-Y4-NF"
        text: "Number – fractions (including decimals)"
        indicators:
          - { id: "UKNC-MA-Y4-NF-01", level: "Y4", text: "recognise and show, using diagrams, families of common equivalent fractions" }
          - { id: "UKNC-MA-Y4-NF-02", level: "Y4", text: "count up and down in hundredths; recognise that hundredths arise when dividing an object by one hundred and dividing tenths by ten." }
          - { id: "UKNC-MA-Y4-NF-03", level: "Y4", text: "solve problems involving increasingly harder fractions to calculate quantities, and fractions to divide quantities, including non-unit fractions where the answer is a whole number" }
          - { id: "UKNC-MA-Y4-NF-04", level: "Y4", text: "add and subtract fractions with the same denominator" }
          - { id: "UKNC-MA-Y4-NF-05", level: "Y4", text: "recognise and write decimal equivalents of any number of tenths or hundredths" }
          - { id: "UKNC-MA-Y4-NF-06", level: "Y4", text: "recognise and write decimal equivalents to 1/4, 1/2, 3/4" }
          - { id: "UKNC-MA-Y4-NF-07", level: "Y4", text: "find the effect of dividing a one- or two-digit number by 10 and 100, identifying the value of the digits in the answer as ones, tenths and hundredths" }
          - { id: "UKNC-MA-Y4-NF-08", level: "Y4", text: "round decimals with one decimal place to the nearest whole number" }
          - { id: "UKNC-MA-Y4-NF-09", level: "Y4", text: "compare numbers with the same number of decimal places up to two decimal places" }
          - { id: "UKNC-MA-Y4-NF-10", level: "Y4", text: "solve simple measure and money problems involving fractions and decimals to two decimal places." }
      - id: "UKNC-MA-Y4-M"
        text: "Measurement"
        indicators:
          - { id: "UKNC-MA-Y4-M-01", level: "Y4", text: "Convert between different units of measure [for example, kilometre to metre; hour to minute]" }
          - { id: "UKNC-MA-Y4-M-02", level: "Y4", text: "measure and calculate the perimeter of a rectilinear figure (including squares) in centimetres and metres" }
          - { id: "UKNC-MA-Y4-M-03", level: "Y4", text: "find the area of rectilinear shapes by counting squares" }
          - { id: "UKNC-MA-Y4-M-04", level: "Y4", text: "estimate, compare and calculate different measures, including money in pounds and pence" }
          - { id: "UKNC-MA-Y4-M-05", level: "Y4", text: "read, write and convert time between analogue and digital 12- and 24-hour clocks" }
          - { id: "UKNC-MA-Y4-M-06", level: "Y4", text: "solve problems involving converting from hours to minutes; minutes to seconds; years to months; weeks to days." }
      - id: "UKNC-MA-Y4-GPS"
        text: "Geometry – properties of shapes"
        indicators:
          - { id: "UKNC-MA-Y4-GPS-01", level: "Y4", text: "compare and classify geometric shapes, including quadrilaterals and triangles, based on their properties and sizes" }
          - { id: "UKNC-MA-Y4-GPS-02", level: "Y4", text: "identify acute and obtuse angles and compare and order angles up to two right angles by size" }
          - { id: "UKNC-MA-Y4-GPS-03", level: "Y4", text: "identify lines of symmetry in 2-D shapes presented in different orientations" }
          - { id: "UKNC-MA-Y4-GPS-04", level: "Y4", text: "complete a simple symmetric figure with respect to a specific line of symmetry." }
      - id: "UKNC-MA-Y4-GPD"
        text: "Geometry – position and direction"
        indicators:
          - { id: "UKNC-MA-Y4-GPD-01", level: "Y4", text: "describe positions on a 2-D grid as coordinates in the first quadrant" }
          - { id: "UKNC-MA-Y4-GPD-02", level: "Y4", text: "describe movements between positions as translations of a given unit to the left/right and up/down" }
          - { id: "UKNC-MA-Y4-GPD-03", level: "Y4", text: "plot specified points and draw sides to complete a given polygon." }
      - id: "UKNC-MA-Y4-S"
        text: "Statistics"
        indicators:
          - { id: "UKNC-MA-Y4-S-01", level: "Y4", text: "interpret and present discrete and continuous data using appropriate graphical methods, including bar charts and time graphs." }
          - { id: "UKNC-MA-Y4-S-02", level: "Y4", text: "solve comparison, sum and difference problems using information presented in bar charts, pictograms, tables and other graphs." }
  - id: "Y5"
    title: "Year 5 programme of study"
    standards:
      - id: "UKNC-MA-Y5-NPV"
        text: "Number – number and place value"
        indicators:
          - { id: "UKNC-MA-Y5-NPV-01", level: "Y5", text: "read, write, order and compare numbers to at least 1 000 000 and determine the value of each digit" }
          - { id: "UKNC-MA-Y5-NPV-02", level: "Y5", text: "count forwards or backwards in steps of powers of 10 for any given number up to 1 000 000" }
          - { id: "UKNC-MA-Y5-NPV-03", level: "Y5", text: "interpret negative numbers in context, count forwards and backwards with positive and negative whole numbers, including through zero" }
          - { id: "UKNC-MA-Y5-NPV-04", level: "Y5", text: "round any number up to 1 000 000 to the nearest 10, 100, 1000, 10 000 and 100 000" }
          - { id: "UKNC-MA-Y5-NPV-05", level: "Y5", text: "solve number problems and practical problems that involve all of the above" }
          - { id: "UKNC-MA-Y5-NPV-06", level: "Y5", text: "read Roman numerals to 1000 (M) and recognise years written in Roman numerals." }
      - id: "UKNC-MA-Y5-NAS"
        text: "Number – addition and subtraction"
        indicators:
          - { id: "UKNC-MA-Y5-NAS-01", level: "Y5", text: "add and subtract whole numbers with more than 4 digits, including using formal written methods (columnar addition and subtraction)" }
          - { id: "UKNC-MA-Y5-NAS-02", level: "Y5", text: "add and subtract numbers mentally with increasingly large numbers" }
          - { id: "UKNC-MA-Y5-NAS-03", level: "Y5", text: "use rounding to check answers to calculations and determine, in the context of a problem, levels of accuracy" }
          - { id: "UKNC-MA-Y5-NAS-04", level: "Y5", text: "solve addition and subtraction multi-step problems in contexts, deciding which operations and methods to use and why." }
      - id: "UKNC-MA-Y5-NMD"
        text: "Number – multiplication and division"
        indicators:
          - { id: "UKNC-MA-Y5-NMD-01", level: "Y5", text: "identify multiples and factors, including finding all factor pairs of a number, and common factors of two numbers" }
          - { id: "UKNC-MA-Y5-NMD-02", level: "Y5", text: "know and use the vocabulary of prime numbers, prime factors and composite (non-prime) numbers" }
          - { id: "UKNC-MA-Y5-NMD-03", level: "Y5", text: "establish whether a number up to 100 is prime and recall prime numbers up to 19" }
          - { id: "UKNC-MA-Y5-NMD-04", level: "Y5", text: "multiply numbers up to 4 digits by a one- or two-digit number using a formal written method, including long multiplication for two-digit numbers" }
          - { id: "UKNC-MA-Y5-NMD-05", level: "Y5", text: "multiply and divide numbers mentally drawing upon known facts" }
          - { id: "UKNC-MA-Y5-NMD-06", level: "Y5", text: "divide numbers up to 4 digits by a one-digit number using the formal written method of short division and interpret remainders appropriately for the context" }
          - { id: "UKNC-MA-Y5-NMD-07", level: "Y5", text: "multiply and divide whole numbers and those involving decimals by 10, 100 and 1000" }
          - { id: "UKNC-MA-Y5-NMD-08", level: "Y5", text: "recognise and use square numbers and cube numbers, and the notation for squared (²) and cubed (³)" }
          - { id: "UKNC-MA-Y5-NMD-09", level: "Y5", text: "solve problems involving multiplication and division including using their knowledge of factors and multiples, squares and cubes" }
          - { id: "UKNC-MA-Y5-NMD-10", level: "Y5", text: "solve problems involving addition, subtraction, multiplication and division and a combination of these, including understanding the meaning of the equals sign" }
          - { id: "UKNC-MA-Y5-NMD-11", level: "Y5", text: "solve problems involving multiplication and division, including scaling by simple fractions and problems involving simple rates." }
      - id: "UKNC-MA-Y5-NF"
        text: "Number – fractions (including decimals and percentages)"
        indicators:
          - { id: "UKNC-MA-Y5-NF-01", level: "Y5", text: "compare and order fractions whose denominators are all multiples of the same number" }
          - { id: "UKNC-MA-Y5-NF-02", level: "Y5", text: "identify, name and write equivalent fractions of a given fraction, represented visually, including tenths and hundredths" }
          - { id: "UKNC-MA-Y5-NF-03", level: "Y5", text: "recognise mixed numbers and improper fractions and convert from one form to the other and write mathematical statements > 1 as a mixed number [for example, 2/5 + 4/5 = 6/5 = 1 1/5]" }
          - { id: "UKNC-MA-Y5-NF-04", level: "Y5", text: "add and subtract fractions with the same denominator and denominators that are multiples of the same number" }
          - { id: "UKNC-MA-Y5-NF-05", level: "Y5", text: "multiply proper fractions and mixed numbers by whole numbers, supported by materials and diagrams" }
          - { id: "UKNC-MA-Y5-NF-06", level: "Y5", text: "read and write decimal numbers as fractions [for example, 0.71 = 71/100]" }
          - { id: "UKNC-MA-Y5-NF-07", level: "Y5", text: "recognise and use thousandths and relate them to tenths, hundredths and decimal equivalents" }
          - { id: "UKNC-MA-Y5-NF-08", level: "Y5", text: "round decimals with two decimal places to the nearest whole number and to one decimal place" }
          - { id: "UKNC-MA-Y5-NF-09", level: "Y5", text: "read, write, order and compare numbers with up to three decimal places" }
          - { id: "UKNC-MA-Y5-NF-10", level: "Y5", text: "solve problems involving number up to three decimal places" }
          - { id: "UKNC-MA-Y5-NF-11", level: "Y5", text: "recognise the per cent symbol (%) and understand that per cent relates to ‘number of parts per hundred’, and write percentages as a fraction with denominator 100, and as a decimal" }
          - { id: "UKNC-MA-Y5-NF-12", level: "Y5", text: "solve problems which require knowing percentage and decimal equivalents of 1/2, 1/4, 1/5, 2/5, 4/5 and those fractions with a denominator of a multiple of 10 or 25." }
      - id: "UKNC-MA-Y5-M"
        text: "Measurement"
        indicators:
          - { id: "UKNC-MA-Y5-M-01", level: "Y5", text: "convert between different units of metric measure (for example, kilometre and metre; centimetre and metre; centimetre and millimetre; gram and kilogram; litre and millilitre)" }
          - { id: "UKNC-MA-Y5-M-02", level: "Y5", text: "understand and use approximate equivalences between metric units and common imperial units such as inches, pounds and pints" }
          - { id: "UKNC-MA-Y5-M-03", level: "Y5", text: "measure and calculate the perimeter of composite rectilinear shapes in centimetres and metres" }
          - { id: "UKNC-MA-Y5-M-04", level: "Y5", text: "calculate and compare the area of rectangles (including squares), and including using standard units, square centimetres (cm²) and square metres (m²) and estimate the area of irregular shapes" }
          - { id: "UKNC-MA-Y5-M-05", level: "Y5", text: "estimate volume [for example, using 1 cm³ blocks to build cuboids (including cubes)] and capacity [for example, using water]" }
          - { id: "UKNC-MA-Y5-M-06", level: "Y5", text: "solve problems involving converting between units of time" }
          - { id: "UKNC-MA-Y5-M-07", level: "Y5", text: "use all four operations to solve problems involving measure [for example, length, mass, volume, money] using decimal notation, including scaling." }
      - id: "UKNC-MA-Y5-GPS"
        text: "Geometry – properties of shapes"
        indicators:
          - { id: "UKNC-MA-Y5-GPS-01", level: "Y5", text: "identify 3-D shapes, including cubes and other cuboids, from 2-D representations" }
          - { id: "UKNC-MA-Y5-GPS-02", level: "Y5", text: "know angles are measured in degrees: estimate and compare acute, obtuse and reflex angles" }
          - { id: "UKNC-MA-Y5-GPS-03", level: "Y5", text: "draw given angles, and measure them in degrees (°)" }
          - { id: "UKNC-MA-Y5-GPS-04", level: "Y5", text: "identify: • angles at a point and one whole turn (total 360°) • angles at a point on a straight line and 1/2 a turn (total 180°) • other multiples of 90° • use the properties of rectangles to deduce related facts and find missing lengths and angles • distinguish between regular and irregular polygons based on reasoning about equal sides and angles." }
      - id: "UKNC-MA-Y5-GPD"
        text: "Geometry – position and direction"
        indicators:
          - { id: "UKNC-MA-Y5-GPD-01", level: "Y5", text: "identify, describe and represent the position of a shape following a reflection or translation, using the appropriate language, and know that the shape has not changed." }
      - id: "UKNC-MA-Y5-S"
        text: "Statistics"
        indicators:
          - { id: "UKNC-MA-Y5-S-01", level: "Y5", text: "solve comparison, sum and difference problems using information presented in a line graph" }
          - { id: "UKNC-MA-Y5-S-02", level: "Y5", text: "complete, read and interpret information in tables, including timetables." }
  - id: "Y6"
    title: "Year 6 programme of study"
    standards:
      - id: "UKNC-MA-Y6-NPV"
        text: "Number – number and place value"
        indicators:
          - { id: "UKNC-MA-Y6-NPV-01", level: "Y6", text: "read, write, order and compare numbers up to 10 000 000 and determine the value of each digit" }
          - { id: "UKNC-MA-Y6-NPV-02", level: "Y6", text: "round any whole number to a required degree of accuracy" }
          - { id: "UKNC-MA-Y6-NPV-03", level: "Y6", text: "use negative numbers in context, and calculate intervals across zero" }
          - { id: "UKNC-MA-Y6-NPV-04", level: "Y6", text: "solve number and practical problems that involve all of the above." }
      - id: "UKNC-MA-Y6-NASMD"
        text: "Number – addition, subtraction, multiplication and division"
        indicators:
          - { id: "UKNC-MA-Y6-NASMD-01", level: "Y6", text: "multiply multi-digit numbers up to 4 digits by a two-digit whole number using the formal written method of long multiplication" }
          - { id: "UKNC-MA-Y6-NASMD-02", level: "Y6", text: "divide numbers up to 4 digits by a two-digit whole number using the formal written method of long division, and interpret remainders as whole number remainders, fractions, or by rounding, as appropriate for the context" }
          - { id: "UKNC-MA-Y6-NASMD-03", level: "Y6", text: "divide numbers up to 4 digits by a two-digit number using the formal written method of short division where appropriate, interpreting remainders according to the context" }
          - { id: "UKNC-MA-Y6-NASMD-04", level: "Y6", text: "perform mental calculations, including with mixed operations and large numbers" }
          - { id: "UKNC-MA-Y6-NASMD-05", level: "Y6", text: "identify common factors, common multiples and prime numbers" }
          - { id: "UKNC-MA-Y6-NASMD-06", level: "Y6", text: "use their knowledge of the order of operations to carry out calculations involving the four operations" }
          - { id: "UKNC-MA-Y6-NASMD-07", level: "Y6", text: "solve addition and subtraction multi-step problems in contexts, deciding which operations and methods to use and why" }
          - { id: "UKNC-MA-Y6-NASMD-08", level: "Y6", text: "solve problems involving addition, subtraction, multiplication and division" }
          - { id: "UKNC-MA-Y6-NASMD-09", level: "Y6", text: "use estimation to check answers to calculations and determine, in the context of a problem, an appropriate degree of accuracy." }
      - id: "UKNC-MA-Y6-NF"
        text: "Number – Fractions (including decimals and percentages)"
        indicators:
          - { id: "UKNC-MA-Y6-NF-01", level: "Y6", text: "use common factors to simplify fractions; use common multiples to express fractions in the same denomination" }
          - { id: "UKNC-MA-Y6-NF-02", level: "Y6", text: "compare and order fractions, including fractions > 1" }
          - { id: "UKNC-MA-Y6-NF-03", level: "Y6", text: "add and subtract fractions with different denominators and mixed numbers, using the concept of equivalent fractions" }
          - { id: "UKNC-MA-Y6-NF-04", level: "Y6", text: "multiply simple pairs of proper fractions, writing the answer in its simplest form [for example, 1/4 × 1/2 = 1/8]" }
          - { id: "UKNC-MA-Y6-NF-05", level: "Y6", text: "divide proper fractions by whole numbers [for example, 1/3 ÷ 2 = 1/6]" }
          - { id: "UKNC-MA-Y6-NF-06", level: "Y6", text: "associate a fraction with division and calculate decimal fraction equivalents [for example, 0.375] for a simple fraction [for example, 3/8]" }
          - { id: "UKNC-MA-Y6-NF-07", level: "Y6", text: "identify the value of each digit in numbers given to three decimal places and multiply and divide numbers by 10, 100 and 1000 giving answers up to three decimal places" }
          - { id: "UKNC-MA-Y6-NF-08", level: "Y6", text: "multiply one-digit numbers with up to two decimal places by whole numbers" }
          - { id: "UKNC-MA-Y6-NF-09", level: "Y6", text: "use written division methods in cases where the answer has up to two decimal places" }
          - { id: "UKNC-MA-Y6-NF-10", level: "Y6", text: "solve problems which require answers to be rounded to specified degrees of accuracy" }
          - { id: "UKNC-MA-Y6-NF-11", level: "Y6", text: "recall and use equivalences between simple fractions, decimals and percentages, including in different contexts." }
      - id: "UKNC-MA-Y6-RP"
        text: "Ratio and proportion"
        indicators:
          - { id: "UKNC-MA-Y6-RP-01", level: "Y6", text: "solve problems involving the relative sizes of two quantities where missing values can be found by using integer multiplication and division facts" }
          - { id: "UKNC-MA-Y6-RP-02", level: "Y6", text: "solve problems involving the calculation of percentages [for example, of measures, and such as 15% of 360] and the use of percentages for comparison" }
          - { id: "UKNC-MA-Y6-RP-03", level: "Y6", text: "solve problems involving similar shapes where the scale factor is known or can be found" }
          - { id: "UKNC-MA-Y6-RP-04", level: "Y6", text: "solve problems involving unequal sharing and grouping using knowledge of fractions and multiples." }
      - id: "UKNC-MA-Y6-A"
        text: "Algebra"
        indicators:
          - { id: "UKNC-MA-Y6-A-01", level: "Y6", text: "use simple formulae" }
          - { id: "UKNC-MA-Y6-A-02", level: "Y6", text: "generate and describe linear number sequences" }
          - { id: "UKNC-MA-Y6-A-03", level: "Y6", text: "express missing number problems algebraically" }
          - { id: "UKNC-MA-Y6-A-04", level: "Y6", text: "find pairs of numbers that satisfy an equation with two unknowns" }
          - { id: "UKNC-MA-Y6-A-05", level: "Y6", text: "enumerate possibilities of combinations of two variables." }
      - id: "UKNC-MA-Y6-M"
        text: "Measurement"
        indicators:
          - { id: "UKNC-MA-Y6-M-01", level: "Y6", text: "solve problems involving the calculation and conversion of units of measure, using decimal notation up to three decimal places where appropriate" }
          - { id: "UKNC-MA-Y6-M-02", level: "Y6", text: "use, read, write and convert between standard units, converting measurements of length, mass, volume and time from a smaller unit of measure to a larger unit, and vice versa, using decimal notation to up to three decimal places" }
          - { id: "UKNC-MA-Y6-M-03", level: "Y6", text: "convert between miles and kilometres" }
          - { id: "UKNC-MA-Y6-M-04", level: "Y6", text: "recognise that shapes with the same areas can have different perimeters and vice versa" }
          - { id: "UKNC-MA-Y6-M-05", level: "Y6", text: "recognise when it is possible to use formulae for area and volume of shapes" }
          - { id: "UKNC-MA-Y6-M-06", level: "Y6", text: "calculate the area of parallelograms and triangles" }
          - { id: "UKNC-MA-Y6-M-07", level: "Y6", text: "calculate, estimate and compare volume of cubes and cuboids using standard units, including cubic centimetres (cm³) and cubic metres (m³), and extending to other units [for example, mm³ and km³]." }
      - id: "UKNC-MA-Y6-GPS"
        text: "Geometry – properties of shapes"
        indicators:
          - { id: "UKNC-MA-Y6-GPS-01", level: "Y6", text: "draw 2-D shapes using given dimensions and angles" }
          - { id: "UKNC-MA-Y6-GPS-02", level: "Y6", text: "recognise, describe and build simple 3-D shapes, including making nets" }
          - { id: "UKNC-MA-Y6-GPS-03", level: "Y6", text: "compare and classify geometric shapes based on their properties and sizes and find unknown angles in any triangles, quadrilaterals, and regular polygons" }
          - { id: "UKNC-MA-Y6-GPS-04", level: "Y6", text: "illustrate and name parts of circles, including radius, diameter and circumference and know that the diameter is twice the radius" }
          - { id: "UKNC-MA-Y6-GPS-05", level: "Y6", text: "recognise angles where they meet at a point, are on a straight line, or are vertically opposite, and find missing angles." }
      - id: "UKNC-MA-Y6-GPD"
        text: "Geometry – position and direction"
        indicators:
          - { id: "UKNC-MA-Y6-GPD-01", level: "Y6", text: "describe positions on the full coordinate grid (all four quadrants)" }
          - { id: "UKNC-MA-Y6-GPD-02", level: "Y6", text: "draw and translate simple shapes on the coordinate plane, and reflect them in the axes." }
      - id: "UKNC-MA-Y6-S"
        text: "Statistics"
        indicators:
          - { id: "UKNC-MA-Y6-S-01", level: "Y6", text: "interpret and construct pie charts and line graphs and use these to solve problems" }
          - { id: "UKNC-MA-Y6-S-02", level: "Y6", text: "calculate and interpret the mean as an average." }
  - id: "KS3"
    title: "Key stage 3"
    standards:
      - id: "UKNC-MA-KS3-WF"
        text: "Working mathematically – Develop fluency"
        indicators:
          - { id: "UKNC-MA-KS3-WF-01", level: "KS3", text: "consolidate their numerical and mathematical capability from key stage 2 and extend their understanding of the number system and place value to include decimals, fractions, powers and roots" }
          - { id: "UKNC-MA-KS3-WF-02", level: "KS3", text: "select and use appropriate calculation strategies to solve increasingly complex problems" }
          - { id: "UKNC-MA-KS3-WF-03", level: "KS3", text: "use algebra to generalise the structure of arithmetic, including to formulate mathematical relationships" }
          - { id: "UKNC-MA-KS3-WF-04", level: "KS3", text: "substitute values in expressions, rearrange and simplify expressions, and solve equations" }
          - { id: "UKNC-MA-KS3-WF-05", level: "KS3", text: "move freely between different numerical, algebraic, graphical and diagrammatic representations [for example, equivalent fractions, fractions and decimals, and equations and graphs]" }
          - { id: "UKNC-MA-KS3-WF-06", level: "KS3", text: "develop algebraic and graphical fluency, including understanding linear and simple quadratic functions" }
          - { id: "UKNC-MA-KS3-WF-07", level: "KS3", text: "use language and properties precisely to analyse numbers, algebraic expressions, 2-D and 3-D shapes, probability and statistics." }
      - id: "UKNC-MA-KS3-WR"
        text: "Working mathematically – Reason mathematically"
        indicators:
          - { id: "UKNC-MA-KS3-WR-01", level: "KS3", text: "extend their understanding of the number system; make connections between number relationships, and their algebraic and graphical representations" }
          - { id: "UKNC-MA-KS3-WR-02", level: "KS3", text: "extend and formalise their knowledge of ratio and proportion in working with measures and geometry, and in formulating proportional relations algebraically" }
          - { id: "UKNC-MA-KS3-WR-03", level: "KS3", text: "identify variables and express relations between variables algebraically and graphically" }
          - { id: "UKNC-MA-KS3-WR-04", level: "KS3", text: "make and test conjectures about patterns and relationships; look for proofs or counter-examples" }
          - { id: "UKNC-MA-KS3-WR-05", level: "KS3", text: "begin to reason deductively in geometry, number and algebra, including using geometrical constructions" }
          - { id: "UKNC-MA-KS3-WR-06", level: "KS3", text: "interpret when the structure of a numerical problem requires additive, multiplicative or proportional reasoning" }
          - { id: "UKNC-MA-KS3-WR-07", level: "KS3", text: "explore what can and cannot be inferred in statistical and probabilistic settings, and begin to express their arguments formally." }
      - id: "UKNC-MA-KS3-WP"
        text: "Working mathematically – Solve problems"
        indicators:
          - { id: "UKNC-MA-KS3-WP-01", level: "KS3", text: "develop their mathematical knowledge, in part through solving problems and evaluating the outcomes, including multi-step problems" }
          - { id: "UKNC-MA-KS3-WP-02", level: "KS3", text: "develop their use of formal mathematical knowledge to interpret and solve problems, including in financial mathematics" }
          - { id: "UKNC-MA-KS3-WP-03", level: "KS3", text: "begin to model situations mathematically and express the results using a range of formal mathematical representations" }
          - { id: "UKNC-MA-KS3-WP-04", level: "KS3", text: "select appropriate concepts, methods and techniques to apply to unfamiliar and non-routine problems." }
      - id: "UKNC-MA-KS3-N"
        text: "Number"
        indicators:
          - { id: "UKNC-MA-KS3-N-01", level: "KS3", text: "understand and use place value for decimals, measures and integers of any size" }
          - { id: "UKNC-MA-KS3-N-02", level: "KS3", text: "order positive and negative integers, decimals and fractions; use the number line as a model for ordering of the real numbers; use the symbols =, ≠, <, >, ≤, ≥" }
          - { id: "UKNC-MA-KS3-N-03", level: "KS3", text: "use the concepts and vocabulary of prime numbers, factors (or divisors), multiples, common factors, common multiples, highest common factor, lowest common multiple, prime factorisation, including using product notation and the unique factorisation property" }
          - { id: "UKNC-MA-KS3-N-04", level: "KS3", text: "use the four operations, including formal written methods, applied to integers, decimals, proper and improper fractions, and mixed numbers, all both positive and negative" }
          - { id: "UKNC-MA-KS3-N-05", level: "KS3", text: "use conventional notation for the priority of operations, including brackets, powers, roots and reciprocals" }
          - { id: "UKNC-MA-KS3-N-06", level: "KS3", text: "recognise and use relationships between operations including inverse operations" }
          - { id: "UKNC-MA-KS3-N-07", level: "KS3", text: "use integer powers and associated real roots (square, cube and higher), recognise powers of 2, 3, 4, 5 and distinguish between exact representations of roots and their decimal approximations" }
          - { id: "UKNC-MA-KS3-N-08", level: "KS3", text: "interpret and compare numbers in standard form A x 10^n 1≤A<10, where n is a positive or negative integer or zero" }
          - { id: "UKNC-MA-KS3-N-09", level: "KS3", text: "work interchangeably with terminating decimals and their corresponding fractions (such as 3.5 and 7/2 or 0.375 and 3/8)" }
          - { id: "UKNC-MA-KS3-N-10", level: "KS3", text: "define percentage as ‘number of parts per hundred’, interpret percentages and percentage changes as a fraction or a decimal, interpret these multiplicatively, express one quantity as a percentage of another, compare two quantities using percentages, and work with percentages greater than 100%" }
          - { id: "UKNC-MA-KS3-N-11", level: "KS3", text: "interpret fractions and percentages as operators" }
          - { id: "UKNC-MA-KS3-N-12", level: "KS3", text: "use standard units of mass, length, time, money and other measures, including with decimal quantities" }
          - { id: "UKNC-MA-KS3-N-13", level: "KS3", text: "round numbers and measures to an appropriate degree of accuracy [for example, to a number of decimal places or significant figures]" }
          - { id: "UKNC-MA-KS3-N-14", level: "KS3", text: "use approximation through rounding to estimate answers and calculate possible resulting errors expressed using inequality notation a<x≤b" }
          - { id: "UKNC-MA-KS3-N-15", level: "KS3", text: "use a calculator and other technologies to calculate results accurately and then interpret them appropriately" }
          - { id: "UKNC-MA-KS3-N-16", level: "KS3", text: "appreciate the infinite nature of the sets of integers, real and rational numbers." }
      - id: "UKNC-MA-KS3-A"
        text: "Algebra"
        indicators:
          - { id: "UKNC-MA-KS3-A-01", level: "KS3", text: "use and interpret algebraic notation, including: • ab in place of a × b • 3y in place of y + y + y and 3 × y • a² in place of a × a, a³ in place of a × a × a; a²b in place of a × a × b • a/b in place of a ÷ b • coefficients written as fractions rather than as decimals • brackets" }
          - { id: "UKNC-MA-KS3-A-02", level: "KS3", text: "substitute numerical values into formulae and expressions, including scientific formulae" }
          - { id: "UKNC-MA-KS3-A-03", level: "KS3", text: "understand and use the concepts and vocabulary of expressions, equations, inequalities, terms and factors" }
          - { id: "UKNC-MA-KS3-A-04", level: "KS3", text: "simplify and manipulate algebraic expressions to maintain equivalence by: • collecting like terms • multiplying a single term over a bracket • taking out common factors • expanding products of two or more binomials" }
          - { id: "UKNC-MA-KS3-A-05", level: "KS3", text: "understand and use standard mathematical formulae; rearrange formulae to change the subject" }
          - { id: "UKNC-MA-KS3-A-06", level: "KS3", text: "model situations or procedures by translating them into algebraic expressions or formulae and by using graphs" }
          - { id: "UKNC-MA-KS3-A-07", level: "KS3", text: "use algebraic methods to solve linear equations in one variable (including all forms that require rearrangement)" }
          - { id: "UKNC-MA-KS3-A-08", level: "KS3", text: "work with coordinates in all four quadrants" }
          - { id: "UKNC-MA-KS3-A-09", level: "KS3", text: "recognise, sketch and produce graphs of linear and quadratic functions of one variable with appropriate scaling, using equations in x and y and the Cartesian plane" }
          - { id: "UKNC-MA-KS3-A-10", level: "KS3", text: "interpret mathematical relationships both algebraically and graphically" }
          - { id: "UKNC-MA-KS3-A-11", level: "KS3", text: "reduce a given linear equation in two variables to the standard form y = mx + c; calculate and interpret gradients and intercepts of graphs of such linear equations numerically, graphically and algebraically" }
          - { id: "UKNC-MA-KS3-A-12", level: "KS3", text: "use linear and quadratic graphs to estimate values of y for given values of x and vice versa and to find approximate solutions of simultaneous linear equations" }
          - { id: "UKNC-MA-KS3-A-13", level: "KS3", text: "find approximate solutions to contextual problems from given graphs of a variety of functions, including piece-wise linear, exponential and reciprocal graphs" }
          - { id: "UKNC-MA-KS3-A-14", level: "KS3", text: "generate terms of a sequence from either a term-to-term or a position-to-term rule" }
          - { id: "UKNC-MA-KS3-A-15", level: "KS3", text: "recognise arithmetic sequences and find the nth term" }
          - { id: "UKNC-MA-KS3-A-16", level: "KS3", text: "recognise geometric sequences and appreciate other sequences that arise." }
      - id: "UKNC-MA-KS3-R"
        text: "Ratio, proportion and rates of change"
        indicators:
          - { id: "UKNC-MA-KS3-R-01", level: "KS3", text: "change freely between related standard units [for example time, length, area, volume/capacity, mass]" }
          - { id: "UKNC-MA-KS3-R-02", level: "KS3", text: "use scale factors, scale diagrams and maps" }
          - { id: "UKNC-MA-KS3-R-03", level: "KS3", text: "express one quantity as a fraction of another, where the fraction is less than 1 and greater than 1" }
          - { id: "UKNC-MA-KS3-R-04", level: "KS3", text: "use ratio notation, including reduction to simplest form" }
          - { id: "UKNC-MA-KS3-R-05", level: "KS3", text: "divide a given quantity into two parts in a given part:part or part:whole ratio; express the division of a quantity into two parts as a ratio" }
          - { id: "UKNC-MA-KS3-R-06", level: "KS3", text: "understand that a multiplicative relationship between two quantities can be expressed as a ratio or a fraction" }
          - { id: "UKNC-MA-KS3-R-07", level: "KS3", text: "relate the language of ratios and the associated calculations to the arithmetic of fractions and to linear functions" }
          - { id: "UKNC-MA-KS3-R-08", level: "KS3", text: "solve problems involving percentage change, including: percentage increase, decrease and original value problems and simple interest in financial mathematics" }
          - { id: "UKNC-MA-KS3-R-09", level: "KS3", text: "solve problems involving direct and inverse proportion, including graphical and algebraic representations" }
          - { id: "UKNC-MA-KS3-R-10", level: "KS3", text: "use compound units such as speed, unit pricing and density to solve problems." }
      - id: "UKNC-MA-KS3-G"
        text: "Geometry and measures"
        indicators:
          - { id: "UKNC-MA-KS3-G-01", level: "KS3", text: "derive and apply formulae to calculate and solve problems involving: perimeter and area of triangles, parallelograms, trapezia, volume of cuboids (including cubes) and other prisms (including cylinders)" }
          - { id: "UKNC-MA-KS3-G-02", level: "KS3", text: "calculate and solve problems involving: perimeters of 2-D shapes (including circles), areas of circles and composite shapes" }
          - { id: "UKNC-MA-KS3-G-03", level: "KS3", text: "draw and measure line segments and angles in geometric figures, including interpreting scale drawings" }
          - { id: "UKNC-MA-KS3-G-04", level: "KS3", text: "derive and use the standard ruler and compass constructions (perpendicular bisector of a line segment, constructing a perpendicular to a given line from/at a given point, bisecting a given angle); recognise and use the perpendicular distance from a point to a line as the shortest distance to the line" }
          - { id: "UKNC-MA-KS3-G-05", level: "KS3", text: "describe, sketch and draw using conventional terms and notations: points, lines, parallel lines, perpendicular lines, right angles, regular polygons, and other polygons that are reflectively and rotationally symmetric" }
          - { id: "UKNC-MA-KS3-G-06", level: "KS3", text: "use the standard conventions for labelling the sides and angles of triangle ABC, and know and use the criteria for congruence of triangles" }
          - { id: "UKNC-MA-KS3-G-07", level: "KS3", text: "derive and illustrate properties of triangles, quadrilaterals, circles, and other plane figures [for example, equal lengths and angles] using appropriate language and technologies" }
          - { id: "UKNC-MA-KS3-G-08", level: "KS3", text: "identify properties of, and describe the results of, translations, rotations and reflections applied to given figures" }
          - { id: "UKNC-MA-KS3-G-09", level: "KS3", text: "identify and construct congruent triangles, and construct similar shapes by enlargement, with and without coordinate grids" }
          - { id: "UKNC-MA-KS3-G-10", level: "KS3", text: "apply the properties of angles at a point, angles at a point on a straight line, vertically opposite angles" }
          - { id: "UKNC-MA-KS3-G-11", level: "KS3", text: "understand and use the relationship between parallel lines and alternate and corresponding angles" }
          - { id: "UKNC-MA-KS3-G-12", level: "KS3", text: "derive and use the sum of angles in a triangle and use it to deduce the angle sum in any polygon, and to derive properties of regular polygons" }
          - { id: "UKNC-MA-KS3-G-13", level: "KS3", text: "apply angle facts, triangle congruence, similarity and properties of quadrilaterals to derive results about angles and sides, including Pythagoras’ Theorem, and use known results to obtain simple proofs" }
          - { id: "UKNC-MA-KS3-G-14", level: "KS3", text: "use Pythagoras’ Theorem and trigonometric ratios in similar triangles to solve problems involving right-angled triangles" }
          - { id: "UKNC-MA-KS3-G-15", level: "KS3", text: "use the properties of faces, surfaces, edges and vertices of cubes, cuboids, prisms, cylinders, pyramids, cones and spheres to solve problems in 3-D" }
          - { id: "UKNC-MA-KS3-G-16", level: "KS3", text: "interpret mathematical relationships both algebraically and geometrically." }
      - id: "UKNC-MA-KS3-P"
        text: "Probability"
        indicators:
          - { id: "UKNC-MA-KS3-P-01", level: "KS3", text: "record, describe and analyse the frequency of outcomes of simple probability experiments involving randomness, fairness, equally and unequally likely outcomes, using appropriate language and the 0-1 probability scale" }
          - { id: "UKNC-MA-KS3-P-02", level: "KS3", text: "understand that the probabilities of all possible outcomes sum to 1" }
          - { id: "UKNC-MA-KS3-P-03", level: "KS3", text: "enumerate sets and unions/intersections of sets systematically, using tables, grids and Venn diagrams" }
          - { id: "UKNC-MA-KS3-P-04", level: "KS3", text: "generate theoretical sample spaces for single and combined events with equally likely, mutually exclusive outcomes and use these to calculate theoretical probabilities." }
      - id: "UKNC-MA-KS3-S"
        text: "Statistics"
        indicators:
          - { id: "UKNC-MA-KS3-S-01", level: "KS3", text: "describe, interpret and compare observed distributions of a single variable through: appropriate graphical representation involving discrete, continuous and grouped data; and appropriate measures of central tendency (mean, mode, median) and spread (range, consideration of outliers)" }
          - { id: "UKNC-MA-KS3-S-02", level: "KS3", text: "construct and interpret appropriate tables, charts, and diagrams, including frequency tables, bar charts, pie charts, and pictograms for categorical data, and vertical line (or bar) charts for ungrouped and grouped numerical data" }
          - { id: "UKNC-MA-KS3-S-03", level: "KS3", text: "describe simple mathematical relationships between two variables (bivariate data) in observational and experimental contexts and illustrate using scatter graphs." }
  - id: "KS4"
    title: "Key stage 4"
    standards:
      - id: "UKNC-MA-KS4-WF"
        text: "Working mathematically – Develop fluency"
        indicators:
          - { id: "UKNC-MA-KS4-WF-01", level: "KS4", text: "consolidate their numerical and mathematical capability from key stage 3 and extend their understanding of the number system to include powers, roots {and fractional indices}" }
          - { id: "UKNC-MA-KS4-WF-02", level: "KS4", text: "select and use appropriate calculation strategies to solve increasingly complex problems, including exact calculations involving multiples of π {and surds}, use of standard form and application and interpretation of limits of accuracy" }
          - { id: "UKNC-MA-KS4-WF-03", level: "KS4", text: "consolidate their algebraic capability from key stage 3 and extend their understanding of algebraic simplification and manipulation to include quadratic expressions, {and expressions involving surds and algebraic fractions}" }
          - { id: "UKNC-MA-KS4-WF-04", level: "KS4", text: "extend fluency with expressions and equations from key stage 3, to include quadratic equations, simultaneous equations and inequalities" }
          - { id: "UKNC-MA-KS4-WF-05", level: "KS4", text: "move freely between different numerical, algebraic, graphical and diagrammatic representations, including of linear, quadratic, reciprocal, {exponential and trigonometric} functions" }
          - { id: "UKNC-MA-KS4-WF-06", level: "KS4", text: "use mathematical language and properties precisely." }
      - id: "UKNC-MA-KS4-WR"
        text: "Working mathematically – Reason mathematically"
        indicators:
          - { id: "UKNC-MA-KS4-WR-01", level: "KS4", text: "extend and formalise their knowledge of ratio and proportion, including trigonometric ratios, in working with measures and geometry, and in working with proportional relations algebraically and graphically" }
          - { id: "UKNC-MA-KS4-WR-02", level: "KS4", text: "extend their ability to identify variables and express relations between variables algebraically and graphically" }
          - { id: "UKNC-MA-KS4-WR-03", level: "KS4", text: "make and test conjectures about the generalisations that underlie patterns and relationships; look for proofs or counter-examples; begin to use algebra to support and construct arguments {and proofs}" }
          - { id: "UKNC-MA-KS4-WR-04", level: "KS4", text: "reason deductively in geometry, number and algebra, including using geometrical constructions" }
          - { id: "UKNC-MA-KS4-WR-05", level: "KS4", text: "interpret when the structure of a numerical problem requires additive, multiplicative or proportional reasoning" }
          - { id: "UKNC-MA-KS4-WR-06", level: "KS4", text: "explore what can and cannot be inferred in statistical and probabilistic settings, and express their arguments formally" }
          - { id: "UKNC-MA-KS4-WR-07", level: "KS4", text: "assess the validity of an argument and the accuracy of a given way of presenting information." }
      - id: "UKNC-MA-KS4-WP"
        text: "Working mathematically – Solve problems"
        indicators:
          - { id: "UKNC-MA-KS4-WP-01", level: "KS4", text: "develop their mathematical knowledge, in part through solving problems and evaluating the outcomes, including multi-step problems" }
          - { id: "UKNC-MA-KS4-WP-02", level: "KS4", text: "develop their use of formal mathematical knowledge to interpret and solve problems, including in financial contexts" }
          - { id: "UKNC-MA-KS4-WP-03", level: "KS4", text: "make and use connections between different parts of mathematics to solve problems" }
          - { id: "UKNC-MA-KS4-WP-04", level: "KS4", text: "model situations mathematically and express the results using a range of formal mathematical representations, reflecting on how their solutions may have been affected by any modelling assumptions" }
          - { id: "UKNC-MA-KS4-WP-05", level: "KS4", text: "select appropriate concepts, methods and techniques to apply to unfamiliar and non-routine problems; interpret their solution in the context of the given problem." }
      - id: "UKNC-MA-KS4-N"
        text: "Number"
        indicators:
          - { id: "UKNC-MA-KS4-N-01", level: "KS4", text: "apply systematic listing strategies, {including use of the product rule for counting}" }
          - { id: "UKNC-MA-KS4-N-02", level: "KS4", text: "{estimate powers and roots of any given positive number}" }
          - { id: "UKNC-MA-KS4-N-03", level: "KS4", text: "calculate with roots, and with integer {and fractional} indices" }
          - { id: "UKNC-MA-KS4-N-04", level: "KS4", text: "calculate exactly with fractions, {surds} and multiples of π; {simplify surd expressions involving squares [for example √12 = √(4 × 3) = √4 × √3 = 2√3] and rationalise denominators}" }
          - { id: "UKNC-MA-KS4-N-05", level: "KS4", text: "calculate with numbers in standard form A × 10^n, where 1 ≤ A < 10 and n is an integer" }
          - { id: "UKNC-MA-KS4-N-06", level: "KS4", text: "{change recurring decimals into their corresponding fractions and vice versa}" }
          - { id: "UKNC-MA-KS4-N-07", level: "KS4", text: "identify and work with fractions in ratio problems" }
          - { id: "UKNC-MA-KS4-N-08", level: "KS4", text: "apply and interpret limits of accuracy when rounding or truncating, {including upper and lower bounds}." }
      - id: "UKNC-MA-KS4-A"
        text: "Algebra"
        indicators:
          - { id: "UKNC-MA-KS4-A-01", level: "KS4", text: "simplify and manipulate algebraic expressions (including those involving surds {and algebraic fractions}) by: • factorising quadratic expressions of the form x^2 + bx + c, including the difference of two squares; {factorising quadratic expressions of the form ax^2 + bx + c} • simplifying expressions involving sums, products and powers, including the laws of indices" }
          - { id: "UKNC-MA-KS4-A-02", level: "KS4", text: "know the difference between an equation and an identity; argue mathematically to show algebraic expressions are equivalent, and use algebra to support and construct arguments {and proofs}" }
          - { id: "UKNC-MA-KS4-A-03", level: "KS4", text: "where appropriate, interpret simple expressions as functions with inputs and outputs; {interpret the reverse process as the ‘inverse function’; interpret the succession of two functions as a ‘composite function’}" }
          - { id: "UKNC-MA-KS4-A-04", level: "KS4", text: "use the form y = mx + c to identify parallel {and perpendicular} lines; find the equation of the line through two given points, or through one point with a given gradient" }
          - { id: "UKNC-MA-KS4-A-05", level: "KS4", text: "identify and interpret roots, intercepts and turning points of quadratic functions graphically; deduce roots algebraically {and turning points by completing the square}" }
          - { id: "UKNC-MA-KS4-A-06", level: "KS4", text: "recognise, sketch and interpret graphs of linear functions, quadratic functions, simple cubic functions, the reciprocal function y = 1/x with x ≠ 0, {the exponential function y = k^x for positive values of k, and the trigonometric functions (with arguments in degrees) y = sin x, y = cos x and y = tan x for angles of any size}" }
          - { id: "UKNC-MA-KS4-A-07", level: "KS4", text: "{sketch translations and reflections of the graph of a given function}" }
          - { id: "UKNC-MA-KS4-A-08", level: "KS4", text: "plot and interpret graphs (including reciprocal graphs {and exponential graphs}) and graphs of non-standard functions in real contexts, to find approximate solutions to problems such as simple kinematic problems involving distance, speed and acceleration" }
          - { id: "UKNC-MA-KS4-A-09", level: "KS4", text: "{calculate or estimate gradients of graphs and areas under graphs (including quadratic and other non-linear graphs), and interpret results in cases such as distance-time graphs, velocity-time graphs and graphs in financial contexts}" }
          - { id: "UKNC-MA-KS4-A-10", level: "KS4", text: "{recognise and use the equation of a circle with centre at the origin; find the equation of a tangent to a circle at a given point}" }
          - { id: "UKNC-MA-KS4-A-11", level: "KS4", text: "solve quadratic equations {including those that require rearrangement} algebraically by factorising, {by completing the square and by using the quadratic formula}; find approximate solutions using a graph" }
          - { id: "UKNC-MA-KS4-A-12", level: "KS4", text: "solve two simultaneous equations in two variables (linear/linear {or linear/quadratic}) algebraically; find approximate solutions using a graph" }
          - { id: "UKNC-MA-KS4-A-13", level: "KS4", text: "{find approximate solutions to equations numerically using iteration}" }
          - { id: "UKNC-MA-KS4-A-14", level: "KS4", text: "translate simple situations or procedures into algebraic expressions or formulae; derive an equation (or two simultaneous equations), solve the equation(s) and interpret the solution" }
          - { id: "UKNC-MA-KS4-A-15", level: "KS4", text: "solve linear inequalities in one {or two} variable{s}, {and quadratic inequalities in one variable}; represent the solution set on a number line, {using set notation and on a graph}" }
          - { id: "UKNC-MA-KS4-A-16", level: "KS4", text: "recognise and use sequences of triangular, square and cube numbers, simple arithmetic progressions, Fibonacci type sequences, quadratic sequences, and simple geometric progressions (r^n where n is an integer, and r is a positive rational number {or a surd}) {and other sequences}" }
          - { id: "UKNC-MA-KS4-A-17", level: "KS4", text: "deduce expressions to calculate the nth term of linear {and quadratic} sequences." }
      - id: "UKNC-MA-KS4-R"
        text: "Ratio, proportion and rates of change"
        indicators:
          - { id: "UKNC-MA-KS4-R-01", level: "KS4", text: "compare lengths, areas and volumes using ratio notation and/or scale factors; make links to similarity (including trigonometric ratios)" }
          - { id: "UKNC-MA-KS4-R-02", level: "KS4", text: "convert between related compound units (speed, rates of pay, prices, density, pressure) in numerical and algebraic contexts" }
          - { id: "UKNC-MA-KS4-R-03", level: "KS4", text: "understand that X is inversely proportional to Y is equivalent to X is proportional to 1/Y; {construct and} interpret equations that describe direct and inverse proportion" }
          - { id: "UKNC-MA-KS4-R-04", level: "KS4", text: "interpret the gradient of a straight line graph as a rate of change; recognise and interpret graphs that illustrate direct and inverse proportion" }
          - { id: "UKNC-MA-KS4-R-05", level: "KS4", text: "{interpret the gradient at a point on a curve as the instantaneous rate of change; apply the concepts of instantaneous and average rate of change (gradients of tangents and chords) in numerical, algebraic and graphical contexts}" }
          - { id: "UKNC-MA-KS4-R-06", level: "KS4", text: "set up, solve and interpret the answers in growth and decay problems, including compound interest {and work with general iterative processes}." }
      - id: "UKNC-MA-KS4-G"
        text: "Geometry and measures"
        indicators:
          - { id: "UKNC-MA-KS4-G-01", level: "KS4", text: "interpret and use fractional {and negative} scale factors for enlargements" }
          - { id: "UKNC-MA-KS4-G-02", level: "KS4", text: "{describe the changes and invariance achieved by combinations of rotations, reflections and translations}" }
          - { id: "UKNC-MA-KS4-G-03", level: "KS4", text: "identify and apply circle definitions and properties, including: centre, radius, chord, diameter, circumference, tangent, arc, sector and segment" }
          - { id: "UKNC-MA-KS4-G-04", level: "KS4", text: "{apply and prove the standard circle theorems concerning angles, radii, tangents and chords, and use them to prove related results}" }
          - { id: "UKNC-MA-KS4-G-05", level: "KS4", text: "construct and interpret plans and elevations of 3D shapes" }
          - { id: "UKNC-MA-KS4-G-06", level: "KS4", text: "interpret and use bearings" }
          - { id: "UKNC-MA-KS4-G-07", level: "KS4", text: "calculate arc lengths, angles and areas of sectors of circles" }
          - { id: "UKNC-MA-KS4-G-08", level: "KS4", text: "calculate surface areas and volumes of spheres, pyramids, cones and composite solids" }
          - { id: "UKNC-MA-KS4-G-09", level: "KS4", text: "apply the concepts of congruence and similarity, including the relationships between lengths, {areas and volumes} in similar figures" }
          - { id: "UKNC-MA-KS4-G-10", level: "KS4", text: "apply Pythagoras’ Theorem and trigonometric ratios to find angles and lengths in right-angled triangles {and, where possible, general triangles} in two {and three} dimensional figures" }
          - { id: "UKNC-MA-KS4-G-11", level: "KS4", text: "know the exact values of sin θ and cos θ for θ = 0°, 30°, 45°, 60° and 90°; know the exact value of tan θ for θ = 0°, 30°, 45° and 60°" }
          - { id: "UKNC-MA-KS4-G-12", level: "KS4", text: "{know and apply the sine rule, a/sin A = b/sin B = c/sin C, and cosine rule, a^2 = b^2 + c^2 − 2bc cos A, to find unknown lengths and angles}" }
          - { id: "UKNC-MA-KS4-G-13", level: "KS4", text: "{know and apply Area = 1/2 ab sin C to calculate the area, sides or angles of any triangle}" }
          - { id: "UKNC-MA-KS4-G-14", level: "KS4", text: "describe translations as 2D vectors" }
          - { id: "UKNC-MA-KS4-G-15", level: "KS4", text: "apply addition and subtraction of vectors, multiplication of vectors by a scalar, and diagrammatic and column representations of vectors; {use vectors to construct geometric arguments and proofs}." }
      - id: "UKNC-MA-KS4-P"
        text: "Probability"
        indicators:
          - { id: "UKNC-MA-KS4-P-01", level: "KS4", text: "apply the property that the probabilities of an exhaustive set of mutually exclusive events sum to one" }
          - { id: "UKNC-MA-KS4-P-02", level: "KS4", text: "use a probability model to predict the outcomes of future experiments; understand that empirical unbiased samples tend towards theoretical probability distributions, with increasing sample size" }
          - { id: "UKNC-MA-KS4-P-03", level: "KS4", text: "calculate the probability of independent and dependent combined events, including using tree diagrams and other representations, and know the underlying assumptions" }
          - { id: "UKNC-MA-KS4-P-04", level: "KS4", text: "{calculate and interpret conditional probabilities through representation using expected frequencies with two-way tables, tree diagrams and Venn diagrams}." }
      - id: "UKNC-MA-KS4-S"
        text: "Statistics"
        indicators:
          - { id: "UKNC-MA-KS4-S-01", level: "KS4", text: "infer properties of populations or distributions from a sample, whilst knowing the limitations of sampling" }
          - { id: "UKNC-MA-KS4-S-02", level: "KS4", text: "interpret and construct tables and line graphs for time series data" }
          - { id: "UKNC-MA-KS4-S-03", level: "KS4", text: "{construct and interpret diagrams for grouped discrete data and continuous data, i.e. histograms with equal and unequal class intervals and cumulative frequency graphs, and know their appropriate use}" }
          - { id: "UKNC-MA-KS4-S-04", level: "KS4", text: "interpret, analyse and compare the distributions of data sets from univariate empirical distributions through: • appropriate graphical representation involving discrete, continuous and grouped data, {including box plots} • appropriate measures of central tendency (including modal class) and spread {including quartiles and inter-quartile range}" }
          - { id: "UKNC-MA-KS4-S-05", level: "KS4", text: "apply statistics to describe a population" }
          - { id: "UKNC-MA-KS4-S-06", level: "KS4", text: "use and interpret scatter graphs of bivariate data; recognise correlation and know that it does not indicate causation; draw estimated lines of best fit; make predictions; interpolate and extrapolate apparent trends whilst knowing the dangers of so doing." }
