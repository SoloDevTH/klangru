<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="sans-serif" font-size="15">
  <title>วงจร PDCA สี่ขั้น วางแผน ลงมือทำ ตรวจสอบ ปรับปรุง หมุนตามเข็มนาฬิกา และการจับคู่กับข้อกำหนด 4 ถึง 10 ของ ISO 9001</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15211e"/></marker></defs>
  <path d="M230,200 L230.0,60.0 A140,140 0 0 1 370.0,200.0 Z" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="284.4" y="115.6" text-anchor="middle" dominant-baseline="middle" fill="#0a6b60" font-size="30" font-weight="bold">P</text>
  <text x="284.4" y="147.6" text-anchor="middle" dominant-baseline="middle" fill="#15211e" font-weight="bold">วางแผน</text>
  <text x="284.4" y="167.6" text-anchor="middle" dominant-baseline="middle" fill="#6b7a76" font-size="12">ตั้งเป้า หาสาเหตุ</text>
  <text x="284.4" y="183.6" text-anchor="middle" dominant-baseline="middle" fill="#6b7a76" font-size="12">วางวิธีแก้</text>
  <path d="M230,200 L370.0,200.0 A140,140 0 0 1 230.0,340.0 Z" fill="#e6edf8" stroke="#15211e" stroke-width="2"/>
  <text x="284.4" y="224.4" text-anchor="middle" dominant-baseline="middle" fill="#0a6b60" font-size="30" font-weight="bold">D</text>
  <text x="284.4" y="256.4" text-anchor="middle" dominant-baseline="middle" fill="#15211e" font-weight="bold">ลงมือทำ</text>
  <text x="284.4" y="276.4" text-anchor="middle" dominant-baseline="middle" fill="#6b7a76" font-size="12">ทดลองตามแผน</text>
  <text x="284.4" y="292.4" text-anchor="middle" dominant-baseline="middle" fill="#6b7a76" font-size="12">เก็บข้อมูล</text>
  <path d="M230,200 L230.0,340.0 A140,140 0 0 1 90.0,200.0 Z" fill="#fbe3d6" stroke="#15211e" stroke-width="2"/>
  <text x="175.6" y="224.4" text-anchor="middle" dominant-baseline="middle" fill="#0a6b60" font-size="30" font-weight="bold">C</text>
  <text x="175.6" y="256.4" text-anchor="middle" dominant-baseline="middle" fill="#15211e" font-weight="bold">ตรวจสอบ</text>
  <text x="175.6" y="276.4" text-anchor="middle" dominant-baseline="middle" fill="#6b7a76" font-size="12">เทียบผลกับเป้า</text>
  <path d="M230,200 L90.0,200.0 A140,140 0 0 1 230.0,60.0 Z" fill="#efe6f5" stroke="#15211e" stroke-width="2"/>
  <text x="175.6" y="115.6" text-anchor="middle" dominant-baseline="middle" fill="#0a6b60" font-size="30" font-weight="bold">A</text>
  <text x="175.6" y="147.6" text-anchor="middle" dominant-baseline="middle" fill="#15211e" font-weight="bold">ปรับปรุง</text>
  <text x="175.6" y="167.6" text-anchor="middle" dominant-baseline="middle" fill="#6b7a76" font-size="12">ทำเป็นมาตรฐาน</text>
  <text x="175.6" y="183.6" text-anchor="middle" dominant-baseline="middle" fill="#6b7a76" font-size="12">หรือแก้แล้ววนใหม่</text>
  <path d="M257.1,46.4 A156,156 0 0 1 383.6,172.9" fill="none" stroke="#b4521f" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M383.6,227.1 A156,156 0 0 1 257.1,353.6" fill="none" stroke="#b4521f" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M202.9,353.6 A156,156 0 0 1 76.4,227.1" fill="none" stroke="#b4521f" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M76.4,172.9 A156,156 0 0 1 202.9,46.4" fill="none" stroke="#b4521f" stroke-width="3" marker-end="url(#ah)"/>
  <text x="410.0" y="60.0" text-anchor="start" dominant-baseline="middle" fill="#15211e" font-size="14" font-weight="bold">ข้อกำหนด ISO 9001:2015</text>
  <text x="410.0" y="92.0" text-anchor="start" dominant-baseline="middle" fill="#15211e" font-size="13">ข้อ 4 บริบทขององค์กร</text>
  <text x="575.0" y="92.0" text-anchor="start" dominant-baseline="middle" fill="#0a6b60" font-size="13" font-weight="bold">ครอบทั้งวงจร</text>
  <text x="410.0" y="128.0" text-anchor="start" dominant-baseline="middle" fill="#15211e" font-size="13">ข้อ 5 ความเป็นผู้นำ</text>
  <text x="575.0" y="128.0" text-anchor="start" dominant-baseline="middle" fill="#0a6b60" font-size="13" font-weight="bold">อยู่กลางวงจร</text>
  <text x="410.0" y="164.0" text-anchor="start" dominant-baseline="middle" fill="#15211e" font-size="13">ข้อ 6 การวางแผน</text>
  <text x="575.0" y="164.0" text-anchor="start" dominant-baseline="middle" fill="#0a6b60" font-size="13" font-weight="bold">P</text>
  <text x="410.0" y="200.0" text-anchor="start" dominant-baseline="middle" fill="#15211e" font-size="13">ข้อ 7 การสนับสนุน</text>
  <text x="575.0" y="200.0" text-anchor="start" dominant-baseline="middle" fill="#0a6b60" font-size="13" font-weight="bold">D</text>
  <text x="410.0" y="236.0" text-anchor="start" dominant-baseline="middle" fill="#15211e" font-size="13">ข้อ 8 การดำเนินงาน</text>
  <text x="575.0" y="236.0" text-anchor="start" dominant-baseline="middle" fill="#0a6b60" font-size="13" font-weight="bold">D</text>
  <text x="410.0" y="272.0" text-anchor="start" dominant-baseline="middle" fill="#15211e" font-size="13">ข้อ 9 การประเมินผล</text>
  <text x="575.0" y="272.0" text-anchor="start" dominant-baseline="middle" fill="#0a6b60" font-size="13" font-weight="bold">C</text>
  <text x="410.0" y="308.0" text-anchor="start" dominant-baseline="middle" fill="#15211e" font-size="13">ข้อ 10 การปรับปรุง</text>
  <text x="575.0" y="308.0" text-anchor="start" dominant-baseline="middle" fill="#0a6b60" font-size="13" font-weight="bold">A</text>
  <text x="230.0" y="385.0" text-anchor="middle" dominant-baseline="middle" fill="#6b7a76" font-size="13">วนซ้ำทุกรอบ ผลจาก A เป็นจุดตั้งต้นของ P รอบถัดไป</text>
</svg>
