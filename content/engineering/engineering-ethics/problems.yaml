problems:
  - id: engineering.professional.engineering-ethics.p001
    topics:
      - engineering.professional.engineering-ethics
    difficulty: 1
    type: mcq
    stem: ตามจรรยาบรรณวิชาชีพวิศวกรรมสากล เมื่อผลประโยชน์ต่าง ๆ ขัดแย้งกัน หน้าที่อันดับแรกของวิศวกรคืออะไร
    choices:
      - id: a
        text: ความพอใจของลูกค้าที่เป็นผู้จ้าง
        feedback: ลูกค้าเป็นสิ่งสำคัญ แต่เมื่อขัดกับความปลอดภัยของสาธารณะ ความปลอดภัยต้องมาก่อน
      - id: b
        text: ความปลอดภัย สุขภาพ และสวัสดิการของสาธารณชน
        correct: true
      - id: c
        text: การส่งมอบงานให้ทันตามสัญญา
        feedback: กำหนดเวลาในสัญญาต้องอยู่ภายใต้หน้าที่ต่อความปลอดภัย ไม่ใช่กลับกัน
      - id: d
        text: ชื่อเสียงและกำไรของบริษัทนายจ้าง
        feedback: ชื่อเสียงและกำไรไม่ใช่เหตุผลที่จะละเลยความปลอดภัยของสาธารณะ
    hints:
      - คิดถึงคนที่จะได้รับผลกระทบถ้าอาคารหรือสะพานที่ตนออกแบบล้มเหลว
      - ตัวเลือกที่พูดถึงลูกค้า กำหนดเวลา หรือชื่อเสียงเป็นสิ่งสำคัญ แต่ไม่ใช่อันดับแรก
    solution: ประมวลจรรยาบรรณของ NSPE ในสหรัฐอเมริการะบุว่าวิศวกรต้อง hold paramount the safety, health, and welfare of the public คือถือความปลอดภัย สุขภาพ และสวัสดิการของสาธารณะเป็นอันดับแรก ความพอใจของลูกค้า กำหนดเวลา และชื่อเสียงสำคัญแต่ต้องอยู่ภายใต้หน้าที่ข้อนี้
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.professional.engineering-ethics.p002
    topics:
      - engineering.professional.engineering-ethics
    difficulty: 1
    type: mcq
    stem: ข้อใดเป็นผลประโยชน์ทับซ้อนที่วิศวกรควรเปิดเผยหรือพิจารณาถอนตัว (เลือกทุกข้อที่ถูก)
    multiple: true
    choices:
      - id: a
        text: ตรวจรับงานของบริษัทที่ตนถือหุ้นอยู่
        correct: true
      - id: b
        text: ทำงานในโครงการเดียวกับเพื่อนร่วมงานที่สนิท
        feedback: การทำงานร่วมกับเพื่อนไม่ใช่ผลประโยชน์ทับซ้อนโดยตัวมันเอง ถ้าไม่มีผลประโยชน์ส่วนตัวแอบแฝง
      - id: c
        text: รับของขวัญราคาสูงจากผู้รับเหมาที่ตนกำลังประเมินผลงานอยู่
        correct: true
      - id: d
        text: เป็นสมาชิกของสภาวิศวกร
        feedback: การเป็นสมาชิกสภาวิชาชีพคือการกำกับดูแลตามกฎหมาย ไม่ได้ทำให้เกิดความขัดแย้งโดยตัวมันเอง
    hints:
      - ผลประโยชน์ทับซ้อนคือภาวะที่ผลประโยชน์ส่วนตัวอาจทำให้การตัดสินใจทางวิชาชีพเอนเอียง
      - ถามตัวเองว่าใครได้ประโยชน์จากการตัดสินใจนั้น และผู้ตัดสินใจมีส่วนได้เสียหรือไม่
    solution: การตรวจรับงานของบริษัทที่ตนถือหุ้นและการรับของขวัญราคาสูงจากผู้รับเหมาที่ตนกำลังประเมินอยู่ ทำให้การตัดสินใจเอนเอียงได้ ต้องเปิดเผยและอาจต้องถอนตัว ส่วนการทำงานร่วมกับเพื่อนและการเป็นสมาชิกสภาวิศวกรไม่ได้ก่อให้เกิดความขัดแย้งโดยตรง
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.professional.engineering-ethics.p003
    topics:
      - engineering.professional.engineering-ethics
    difficulty: 1
    type: match
    stem: จับคู่คำศัพท์กับความหมายที่ถูกต้อง
    pairs:
      - left: ผลประโยชน์ทับซ้อน
        right: ผลประโยชน์ส่วนตัวขัดกับหน้าที่ที่ควรตัดสินใจอย่างเที่ยงธรรม
      - left: การแจ้งเบาะแส
        right: การรายงานการกระทำที่เสี่ยงต่ออันตรายหรือผิดกฎหมายต่อผู้มีอำนาจอย่างเป็นทางการ
      - left: การลงนามรับรองแบบ
        right: ผู้ลงนามรับผิดชอบด้วยวิชาชีพต่อความถูกต้องของงานในขอบเขตที่รับรอง
      - left: ใบอนุญาตวิศวกรรมควบคุม
        right: หลักฐานตามกฎหมายว่าได้รับอนุญาตให้ประกอบวิชาชีพวิศวกรรมควบคุม
    hints:
      - คำว่า 'เที่ยงธรรม' 'ผู้มีอำนาจ' 'รับผิดชอบ' และ 'กฎหมาย' เป็นเบาะแสสำคัญ
      - ลองจับคู่คำที่มีความหมายตรงกันเป็นคู่แรกก่อน แล้วค่อยหาคู่ที่เหลือ
    solution: ผลประโยชน์ทับซ้อนคือผลประโยชน์ส่วนตัวที่ขัดกับการตัดสินใจอย่างเที่ยงธรรม การแจ้งเบาะแสคือการรายงานต่อผู้มีอำนาจอย่างเป็นทางการ การลงนามรับรองแบบคือการยืนยันว่าตนรับผิดชอบด้วยวิชาชีพต่อความถูกต้องของงานในขอบเขตที่รับรอง และใบอนุญาตคือหลักฐานตามกฎหมายว่าได้รับอนุญาตให้ประกอบวิชาชีพวิศวกรรมควบคุม
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.professional.engineering-ethics.p004
    topics:
      - engineering.professional.engineering-ethics
    difficulty: 2
    type: mcq
    stem: (ข้อมูลสมมติ) โรงงานแห่งหนึ่งขอให้ลดความหนาของแผ่นพื้นคอนกรีตจากแบบที่คำนวณไว้เพื่อประหยัดงบ 15% โดยอ้างว่าเคยทำแบบนี้มาก่อน วิศวกรผู้ออกแบบควรทำอย่างไรเป็นลำดับแรก
    choices:
      - id: a
        text: ยอมลดความหนาตามคำขอ เพราะลูกค้าเป็นผู้จ่ายเงิน
        feedback: ความต้องการของลูกค้าไม่ทำให้ข้อกำหนดด้านความปลอดภัยหายไป
      - id: b
        text: ประเมินกำลังและความปลอดภัยใหม่ แล้วชี้แจงเป็นลายลักษณ์อักษรพร้อมทางเลือกที่ผ่านเกณฑ์
        correct: true
      - id: c
        text: ลงนามรับรองแบบเดิมแล้วให้ผู้รับเหมาแก้ไขเอง
        feedback: การลงนามทำให้ผู้ลงนามรับผิดชอบต่อความถูกต้องของแบบ จะโยนความรับผิดชอบไปให้ผู้อื่นไม่ได้
      - id: d
        text: ลดความหนาเองโดยไม่บันทึก เพราะคิดว่าการเปลี่ยนเล็กน้อยไม่กระทบโครงสร้าง
        feedback: ค่าที่คิดว่าเล็กน้อยต้องพิสูจน์ด้วยการคำนวณและบันทึกไว้ ห้ามตัดสินจากความรู้สึก
    hints:
      - ถามตัวเองก่อนว่าการเปลี่ยนแบบกระทบความปลอดภัยของผู้ใช้อาคารหรือไม่
      - การเปลี่ยนแปลงใด ๆ ต้องผ่านการคำนวณใหม่และบันทึกไว้เสมอ
      - ทางเลือกที่ดีคือรักษาเกณฑ์ความปลอดภัยไว้และหาทางประหยัดที่ไม่ลดความปลอดภัย
    solution: วิศวกรต้องประเมินใหม่ว่าการลดความหนากระทบกำลังและความปลอดภัยหรือไม่ แล้วชี้แจงลูกค้าเป็นลายลักษณ์อักษรพร้อมทางเลือกที่ยังผ่านเกณฑ์ เช่น ปรับวัสดุหรือการเสริมเหล็กให้ประหยัดขึ้น ไม่ควรตัดสินใจโดยไม่มีการคำนวณหรือปล่อยให้ผู้อื่นรับผิดชอบแทน
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.professional.engineering-ethics.p005
    topics:
      - engineering.professional.engineering-ethics
    difficulty: 2
    type: numeric
    stem: โครงค้ำของสะพานคนเดินข้ามคลองในกรุงเทพฯ ถูกออกแบบให้รับน้ำหนักใช้งาน 60 kN ด้วยค่าความปลอดภัย (factor of safety) 3.0 ต่อมาลูกค้าขอลดค่านี้เหลือ 1.8 เพื่อประหยัดเหล็ก ความสามารถรับแรงสูงสุดของโครงค้ำลดลงกี่เปอร์เซ็นต์ (ตอบเป็นร้อยละ ตัวเลขอย่างเดียว)
    answer:
      value: 40.0
      tolerance: 0.5
      unit: '%'
    hints:
      - ความสามารถรับแรงสูงสุด = ค่าความปลอดภัย × น้ำหนักใช้งาน
      - คำนวณความสามารถก่อนและหลังการลด แล้วหาส่วนที่หายไปเทียบกับค่าเดิม
    misconceptions:
      - match: 1.2
        feedback: ค่าความปลอดภัยเป็นอัตราส่วน การลบกันตรง ๆ ได้ 1.2 ซึ่งไม่ใช่ร้อยละของความสามารถที่หายไป
      - match: 72
        feedback: 72 kN คือแรงที่หายไป ยังไม่ได้เทียบกับความสามารถเดิม 180 kN เพื่อเป็นร้อยละ
      - match: 60
        feedback: 60% คือสัดส่วนที่เหลือ (108 ÷ 180) ไม่ใช่ส่วนที่ลดลง
    solution: ความสามารถก่อนลด = 60 × 3.0 = 180 kN ความสามารถหลังลด = 60 × 1.8 = 108 kN ส่วนที่หายไป = 180 − 108 = 72 kN คิดเป็น 72 ÷ 180 × 100 = 40% ของความสามารถเดิม
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.professional.engineering-ethics.p006
    topics:
      - engineering.professional.engineering-ethics
    difficulty: 2
    type: text
    stem: พระราชบัญญัติใดก่อตั้งสภาวิศวกรและกำหนดให้การประกอบวิชาชีพวิศวกรรมควบคุมต้องได้รับใบอนุญาตในประเทศไทย (ตอบชื่อกฎหมายและปี พ.ศ.)
    accepted:
      - พระราชบัญญัติวิศวกร พ.ศ. 2542
      - พ.ร.บ.วิศวกร พ.ศ. 2542
      - พ.ร.บ.วิศวกร พ.ศ.2542
      - พระราชบัญญัติวิศวกร พ.ศ.2542
    hints:
      - เป็นกฎหมายที่ตั้งองค์กรกำกับวิชาชีพวิศวกรในไทย
      - ชื่อกฎหมายมีคำว่า 'วิศวกร' และปีเป็นพุทธศักราช
    solution: พระราชบัญญัติวิศวกร พ.ศ. 2542 จัดตั้งสภาวิศวกรและกำหนดให้การประกอบวิชาชีพวิศวกรรมควบคุมต้องได้รับใบอนุญาต ควรตรวจชื่อและปีกับราชกิจจานุเบกษาก่อนอ้างอิงในงานทางการ
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.professional.engineering-ethics.p007
    topics:
      - engineering.professional.engineering-ethics
    difficulty: 2
    type: order
    stem: เรียงลำดับขั้นตอนการแจ้งความเสี่ยงที่เหมาะสมภายในองค์กร
    items:
      - บันทึกข้อเท็จจริง วันเวลา สถานที่ และหลักฐานที่พบ
      - แจ้งผู้รับผิดชอบภายในองค์กรเป็นลายลักษณ์อักษรและขอให้ตรวจสอบ
      - ติดตามผลเมื่อถึงกำหนดที่ระบุ และเก็บสำเนาการสื่อสารไว้
      - ถ้าไม่มีการแก้ไขที่เหมาะสมและความเสี่ยงยังอยู่ ให้แจ้งหน่วยงานกำกับตามช่องทางที่กฎหมายกำหนด
    hints:
      - ขั้นแรกต้องเป็นข้อเท็จจริงที่ตรวจสอบได้ ไม่ใช่การกล่าวหา
      - ช่องทางภายในควรลองก่อนช่องทางภายนอก เว้นแต่กฎหมายกำหนดเป็นอย่างอื่น
    solution: วิศวกรบันทึกข้อเท็จจริงก่อน แจ้งภายในเป็นลายลักษณ์อักษรเพื่อให้องค์กรแก้ไขได้ ติดตามผล และหากยังไม่มีการแก้ไขจึงแจ้งหน่วยงานกำกับ ทั้งนี้ต้องตรวจข้อกำหนดของหน่วยงานและกฎหมายที่เกี่ยวข้องด้วย
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.professional.engineering-ethics.p008
    topics:
      - engineering.professional.engineering-ethics
    difficulty: 3
    type: mcq
    stem: (ข้อมูลสมมติ) ระหว่างตรวจงานคานชั้นสอง วิศวกรพบรอยร้าวยาวประมาณ 30 ซม. ที่ตำแหน่งรับแรงเฉือนใกล้ฐานรับ ผู้จัดการโครงการบอกว่า 'ให้เสร็จงานก่อนแล้วค่อยดู' วิศวกรควรทำอย่างไร
    choices:
      - id: a
        text: ปล่อยไว้ก่อนเพื่อไม่ให้งานล่าช้า
        feedback: การเลื่อนการตรวจสอบอาจทำให้รอยร้าวขยายตัวและเกิดอันตรายต่อผู้ใช้อาคาร
      - id: b
        text: บันทึกรอยร้าวพร้อมภาพและการวัด แจ้งเป็นลายลักษณ์อักษร และขอให้หยุดหรือตรวจสอบก่อนดำเนินงานที่เกี่ยวข้อง
        correct: true
      - id: c
        text: ทาสีกลบรอยร้าวแล้วรายงานหลังงานเสร็จ
        feedback: การปิดบังปัญหาทำให้ผู้มีอำนาจตัดสินใจโดยไม่มีข้อมูลครบ
      - id: d
        text: ลงนามรับรองว่าโครงสร้างปลอดภัยเพื่อให้โครงการดำเนินต่อ
        feedback: ห้ามลงนามรับรองสิ่งที่ยังไม่ได้ตรวจด้วยตนเอง
    hints:
      - รอยร้าวที่ตำแหน่งรับแรงเฉือนอาจเป็นสัญญาณของปัญหาโครงสร้าง
      - วิศวกรต้องมีหลักฐานและการสื่อสารที่ตรวจสอบย้อนหลังได้
      - การปิดบังหรือรอให้เสร็จก่อน ไม่ใช่ทางแก้ปัญหาความปลอดภัย
