id: computer.society.inclusive-design
subject: computer
title: { th: การออกแบบเทคโนโลยีให้ทุกคนใช้ได้, en: "Inclusive and accessible design" }
summary: ข้อจำกัดถาวร ชั่วคราว และตามสถานการณ์ หลักการเข้าถึงได้สี่ข้อ ความต่างของสี อคติในเทคโนโลยีและข้อมูล และการสังเกต ปรับปรุง และทดสอบกับผู้ใช้ที่หลากหลาย
difficulty: 3.5
minutes: 40
prerequisites: [computer.society.computing-impacts, computer.design.user-centred-design]
encompasses:
  - { id: computer.society.computing-impacts, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: limitations.svg
    alt: "ตารางสามคอลัมน์ ถาวร ชั่วคราว ตามสถานการณ์ และสามแถว แถวการมองเห็น ตาบอด สายตาเลือนราง ตาพร่าหลังหยอดยาขยายม่านตา จอสะท้อนแดดจ้า แถวการได้ยิน หูหนวก หูตึง หูอื้อจากหวัด อยู่ในตลาดที่เสียงดัง แถวการใช้มือ แขนขาด มือสั่นจากโรค แขนหัก ใส่เฝือก มือหนึ่งอุ้มน้อง ใต้ตารางเขียนว่า ออกแบบให้คนที่มีข้อจำกัดถาวรใช้ได้ คนอีกจำนวนมากที่มีข้อจำกัดชั่วคราวหรือตามสถานการณ์ก็ได้ประโยชน์ด้วย"
    caption: "ข้อจำกัดในการใช้งานสามแบบ"
  - type: figure
    src: contrast.svg
    alt: "ตัวอย่างข้อความ ตารางสอบ ม.3 วันจันทร์ หกแบบ พร้อมอัตราส่วนความต่างของความสว่าง ตัวอักษรดำบนพื้นขาว 21.00 ต่อ 1 ผ่าน ตัวอักษรเทาเข้ม 595959 บนขาว 7.00 ต่อ 1 ผ่าน ตัวอักษรเทา 777777 บนขาว 4.48 ต่อ 1 ไม่ผ่าน ตัวอักษรเทาอ่อน AAAAAA บนขาว 2.32 ต่อ 1 ไม่ผ่าน ตัวอักษรขาวบนพื้นเขียวเข้ม 15803D 5.02 ต่อ 1 ผ่าน ตัวอักษรขาวบนพื้นเขียวสด 22C55E 2.28 ต่อ 1 ไม่ผ่าน เกณฑ์ WCAG ระดับ AA สำหรับข้อความขนาดปกติคืออย่างน้อย 4.5 ต่อ 1"
    caption: "สีที่ดูสวยอาจอ่านยาก วัดด้วยอัตราส่วนความต่างของความสว่าง"
  - type: worked-example
    title: สังเกตคุณตาใช้รีโมตทีวีแล้วเสนอการปรับปรุง
    problem: "เก่งสังเกตคุณตาวัย 78 ปีใช้รีโมตทีวีหนึ่งสัปดาห์ แล้วจดว่า (1) คุณตากดปุ่มปิดเครื่องแทนปุ่มลดเสียงบ่อย (2) ตอนกลางคืนอ่านตัวหนังสือบนปุ่มไม่เห็น (3) คุณตาใช้แค่ปุ่มเปิดปิด เปลี่ยนช่อง และเสียง จากทั้งหมด 45 ปุ่ม ให้เสนอการปรับปรุงการออกแบบรีโมต"
    steps:
      - text: "แปลงสิ่งที่สังเกตเป็นอุปสรรค: ปุ่มเล็กและหน้าตาเหมือนกันจึงกดผิด ตัวอักษรเล็กและสีกลืนกับพื้น ปุ่มที่ไม่ใช้ทำให้หาปุ่มที่ต้องการยาก"
        why: "ข้อเสนอที่ดีต้องมาจากสิ่งที่ผู้ใช้ทำจริง ไม่ใช่จากความชอบของผู้ออกแบบ"
      - text: "อุปสรรคที่ 1: ทำปุ่มที่ใช้บ่อยให้ใหญ่ขึ้น มีรูปทรงต่างกันจนคลำแยกได้ และแยกปุ่มปิดเครื่องไปไว้มุมบนห่างจากปุ่มเสียง"
      - text: "อุปสรรคที่ 2: ใช้ตัวอักษรใหญ่ สีขาวบนพื้นดำที่ต่างกันชัด และมีไฟส่องปุ่มเมื่อหยิบขึ้นมา"
      - text: "อุปสรรคที่ 3: ซ่อนปุ่มที่ใช้น้อยไว้ใต้ฝาเลื่อน เหลือด้านหน้าเฉพาะปุ่มหลัก"
      - text: "ทดสอบซ้ำกับคุณตาและผู้ใช้คนอื่น เช่น เด็ก และคนที่สายตาเลือนราง แล้วนับว่ายังกดผิดกี่ครั้งต่อวัน"
        why: "ต้องวัดว่าการปรับปรุงช่วยได้จริง และไม่ทำให้ผู้ใช้กลุ่มอื่นใช้ยากขึ้น"
    answer: "ปุ่มหลักใหญ่ รูปทรงต่างกัน แยกปุ่มปิดเครื่องให้ห่าง ตัวอักษรใหญ่ สีตัดกัน มีไฟส่อง ซ่อนปุ่มที่ใช้น้อย แล้วทดสอบซ้ำกับผู้ใช้หลากหลาย"
  - { type: check, problem: computer.society.inclusive-design.p004, prompt: "ลองวิเคราะห์ตู้กดบัตรคิวด้วยวิธีเดียวกัน" }
  - type: worked-example
    title: ปุ่มสีเขียวสดผ่านเกณฑ์ความต่างของสีหรือไม่
    problem: "ปุ่ม \"ส่งงาน\" ในเว็บของชมรมใช้ตัวอักษรสีขาว (ความสว่างสัมพัทธ์ $L = 1$) บนพื้นสีเขียวสด ($L = 0.41$) ผ่านเกณฑ์ 4.5 : 1 สำหรับข้อความขนาดปกติหรือไม่ ถ้าไม่ผ่าน สีเขียวเข้ม ($L = 0.16$) ผ่านหรือไม่"
    steps:
      - text: "ระบุสีที่สว่างกว่าและมืดกว่า: ขาว $L = 1$ สว่างกว่า เขียวสด $L = 0.41$ มืดกว่า"
        why: "สูตรเอาสีสว่างไว้เศษ จึงได้อัตราส่วนตั้งแต่ 1 ขึ้นไปเสมอ"
      - text: "แทนสูตร: $\\frac{1 + 0.05}{0.41 + 0.05} = \\frac{1.05}{0.46} \\approx 2.28$"
      - text: "เทียบเกณฑ์: 2.28 น้อยกว่า 4.5 จึงไม่ผ่าน คนสายตาเลือนรางหรือดูกลางแดดจะอ่านยาก"
      - text: "ลองสีเขียวเข้ม: $\\frac{1.05}{0.16 + 0.05} = \\frac{1.05}{0.21} = 5.0$ มากกว่า 4.5 จึงผ่าน"
    answer: "เขียวสดได้ราว 2.28 : 1 ไม่ผ่าน เปลี่ยนเป็นเขียวเข้มได้ 5.0 : 1 ผ่านเกณฑ์"
  - { type: check, problem: computer.society.inclusive-design.p010, prompt: "คำนวณกับตัวอักษรสีเทาอ่อน" }
glossary:
  - { term: การออกแบบให้ทุกคนใช้ได้ (inclusive design), definition: "การออกแบบที่คิดถึงผู้ใช้หลากหลายตั้งแต่ต้น ทั้งอายุ ความสามารถ ภาษา วัฒนธรรม และฐานะ" }
  - { term: การเข้าถึงได้ (accessibility), definition: "การที่ผู้พิการและผู้มีข้อจำกัดใช้เทคโนโลยีได้ เช่น ผ่านโปรแกรมอ่านหน้าจอหรือแป้นพิมพ์" }
  - { term: WCAG, definition: "แนวทางการเข้าถึงเนื้อหาเว็บ มาตรฐานสากลที่สรุปเป็นสี่หลัก รับรู้ได้ ใช้งานได้ เข้าใจได้ ทนทาน" }
  - { term: ข้อความแทนภาพ (alt text), definition: "ข้อความที่บอกสิ่งที่ภาพสื่อ ให้โปรแกรมอ่านหน้าจออ่านออกเสียงแทนภาพ" }
  - { term: อัตราส่วนความต่างของความสว่าง (contrast ratio), definition: "ค่า (L สว่าง + 0.05) หารด้วย (L มืด + 0.05) ตั้งแต่ 1 ถึง 21 ข้อความปกติควรได้อย่างน้อย 4.5" }
  - { term: อคติ (bias), definition: "การที่ระบบทำงานได้ดีกับคนบางกลุ่มแต่แย่กับอีกกลุ่มอย่างเป็นระบบ มักเกิดจากข้อมูลหรือทีมที่ไม่หลากหลาย" }
  - { term: โปรแกรมอ่านหน้าจอ (screen reader), definition: "ซอฟต์แวร์ที่อ่านข้อความบนจอออกเสียงหรือแสดงเป็นอักษรเบรลล์ ช่วยผู้พิการทางการเห็น" }
flashcards:
  - { front: "ข้อจำกัดในการใช้งานสามแบบ", back: "ถาวร (ตาบอด) ชั่วคราว (แขนหัก) ตามสถานการณ์ (จอสะท้อนแดด)" }
  - { front: "หลักการเข้าถึงได้สี่ข้อของ WCAG", back: "รับรู้ได้ ใช้งานได้ เข้าใจได้ ทนทาน" }
  - { front: "เกณฑ์ความต่างของสีระดับ AA", back: "ข้อความขนาดปกติอย่างน้อย 4.5 : 1 ข้อความตัวใหญ่อย่างน้อย 3 : 1" }
  - { front: "ทำไมต้องแยกผลทดสอบตามกลุ่ม", back: "ค่ารวมอาจสูงเพราะกลุ่มใหญ่ทำได้ดี แต่ซ่อนกลุ่มเล็กที่ระบบผิดบ่อย" }
  - { front: "สาเหตุของอคติในเทคโนโลยี", back: "ข้อมูลฝึกไม่หลากหลาย ทีมคิดจากประสบการณ์ตัวเอง และความเหลื่อมล้ำในการเข้าถึง" }
