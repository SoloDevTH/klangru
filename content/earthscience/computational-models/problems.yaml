problems:
  - id: earthscience.systems.computational-models.p001
    topics: [earthscience.systems.computational-models]
    difficulty: 1
    type: match
    stem: "จับคู่คำกับความหมายในแบบจำลองคอมพิวเตอร์"
    pairs:
      - { left: "สต็อก", right: "ปริมาณที่สะสมอยู่ เช่น คาร์บอนในบรรยากาศ ปลาในทะเล" }
      - { left: "การไหล", right: "อัตราที่ปริมาณเข้าหรือออกจากสต็อก เช่น ตันต่อปี" }
      - { left: "ก้าวเวลา", right: "ช่วงเวลาที่โปรแกรมคำนวณข้ามไปในแต่ละรอบ" }
      - { left: "สมดุล", right: "สภาวะที่อัตราเข้าเท่ากับอัตราออก สต็อกจึงไม่เปลี่ยน" }
    hints:
      - "สิ่งใดมีหน่วยเป็นปริมาณ สิ่งใดมีหน่วยต่อเวลา"
      - "เมื่อเข้าเท่ากับออก สต็อกเป็นอย่างไร"
    solution: "สต็อกคือปริมาณสะสม การไหลคืออัตราเข้าออก ก้าวเวลาคือช่วงเวลาที่ข้ามในแต่ละรอบ สมดุลคือเมื่อเข้าเท่ากับออก สต็อกจึงคงที่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.systems.computational-models.p002
    topics: [earthscience.systems.computational-models]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็น \"สต็อก\" ไม่ใช่ \"การไหล\""
    choices:
      - { id: a, text: "ปริมาณปลาทูในอ่าวไทยเป็นตัน", correct: true }
      - { id: b, text: "จำนวนปลาทูที่จับได้ต่อปี", feedback: "มีหน่วยต่อปี เป็นอัตราที่ปลาออกจากสต็อก จึงเป็นการไหล" }
      - { id: c, text: "คาร์บอนไดออกไซด์ที่ปล่อยจากโรงไฟฟ้าต่อปี", feedback: "มีหน่วยต่อปี เป็นอัตราที่เข้าสู่บรรยากาศ จึงเป็นการไหล" }
      - { id: d, text: "ปริมาณน้ำที่ไหลออกจากเขื่อนต่อวัน", feedback: "มีหน่วยต่อวัน เป็นการไหล ส่วนน้ำที่เก็บในเขื่อนคือสต็อก" }
    hints:
      - "ดูหน่วย การไหลมีคำว่า \"ต่อเวลา\""
      - "สต็อกคือสิ่งที่วัดได้ ณ เวลาหนึ่ง"
    solution: "ปริมาณปลาทูในอ่าวไทยเป็นปริมาณ ณ เวลาหนึ่ง จึงเป็นสต็อก ส่วนข้ออื่นมีหน่วยต่อเวลา เป็นการไหลเข้าหรือออก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.systems.computational-models.p003
    topics: [earthscience.systems.computational-models]
    difficulty: 2
    type: numeric
    stem: "อ่างเก็บน้ำของเขื่อนแห่งหนึ่งในภาคเหนือของไทยมีน้ำ 300 ล้าน m³ ช่วงหน้าแล้งน้ำไหลเข้า 12 ล้าน m³ ต่อวัน และปล่อยออก 20 ล้าน m³ ต่อวัน ใช้ ค่าใหม่ = ค่าเดิม + (เข้า − ออก) × Δt อีก 5 วันจะมีน้ำกี่ล้าน m³"
    answer: { value: 260, tolerance: 0, unit: "ล้าน m³" }
    misconceptions:
      - { match: 340, feedback: "สลับเข้ากับออก น้ำออกมากกว่าเข้า น้ำในอ่างต้องลดลง" }
      - { match: 292, feedback: "292 คิดเพียงวันเดียว ต้องคูณอัตราสุทธิด้วย 5 วัน" }
    hints:
      - "อัตราสุทธิต่อวัน = เข้า − ออก"
      - "คูณด้วยจำนวนวันแล้วบวกกับค่าเดิม"
    solution: "อัตราสุทธิ $12 - 20 = -8$ ล้าน m³ ต่อวัน ใน 5 วัน $-8 \\times 5 = -40$ น้ำเหลือ $300 - 40 = 260$ ล้าน m³"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.systems.computational-models.p004
    topics: [earthscience.systems.computational-models]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการสร้างและใช้แบบจำลองคอมพิวเตอร์ของระบบโลก"
    items:
      - "ระบุสต็อกและการไหลของระบบ"
      - "เขียนสมการว่าการไหลขึ้นกับสต็อกอย่างไร"
      - "กำหนดค่าเริ่มต้น พารามิเตอร์ และก้าวเวลา"
      - "เขียนลูปคำนวณทีละก้าวเวลา"
      - "เทียบผลกับข้อมูลในอดีตแล้วปรับแก้"
      - "ใช้เปรียบเทียบฉากทัศน์ในอนาคต พร้อมบอกข้อจำกัด"
    hints:
      - "ต้องรู้ว่าระบบมีอะไรบ้างก่อนเขียนสมการ"
      - "ต้องตรวจกับข้อมูลจริงก่อนนำไปใช้คาดการณ์"
    solution: "ระบุสต็อกและการไหล → เขียนสมการ → กำหนดค่าเริ่มต้นและพารามิเตอร์ → ลูปคำนวณ → เทียบกับข้อมูลในอดีต → ใช้เปรียบเทียบฉากทัศน์พร้อมบอกข้อจำกัด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.systems.computational-models.p005
    topics: [earthscience.systems.computational-models]
    difficulty: 2
    type: mcq
    stem: "ในแบบจำลองสมดุลพลังงานมิติศูนย์ ทำไมการใช้สภาพเปล่งรังสีที่มีผล $\\varepsilon < 1$ จึงแทนผลของปรากฏการณ์เรือนกระจกได้"
    choices:
      - { id: a, text: "เพราะทำให้อินฟราเรดที่ออกสู่อวกาศน้อยกว่าที่ผิวโลกแผ่ออกมา โลกจึงต้องอุ่นขึ้นจนสมดุล", correct: true }
      - { id: b, text: "เพราะทำให้แสงอาทิตย์ส่องเข้ามามากขึ้น", feedback: "ε อยู่ในพจน์ของรังสีที่ออก ไม่ได้เปลี่ยนแสงอาทิตย์ที่เข้า แสงที่เข้าขึ้นกับอัลบีโด" }
      - { id: c, text: "เพราะทำให้อัลบีโดของโลกลดลง", feedback: "อัลบีโดเป็นพารามิเตอร์อีกตัวหนึ่ง (α) ε ไม่ได้เปลี่ยนการสะท้อนแสง" }
      - { id: d, text: "เพราะทำให้ค่าคงตัวสุริยะเพิ่มขึ้น", feedback: "ค่าคงตัวสุริยะขึ้นกับดวงอาทิตย์ ไม่ขึ้นกับบรรยากาศของโลก" }
    hints:
      - "ε คูณกับพจน์ใดในสมการ"
      - "ถ้ารังสีออกได้น้อยลง อุณหภูมิต้องเปลี่ยนอย่างไรจึงจะสมดุล"
    solution: "พจน์รังสีที่ออกคือ εσT⁴ แก๊สเรือนกระจกดูดกลืนอินฟราเรดไว้บางส่วน รังสีที่ออกสู่อวกาศจึงน้อยกว่า σT⁴ ของผิวโลก แทนด้วย ε < 1 โลกต้องอุ่นขึ้นจนรังสีที่ออกเท่ากับแสงที่ดูดกลืน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.systems.computational-models.p006
    topics: [earthscience.systems.computational-models]
    difficulty: 3
    type: numeric
    stem: "ใช้ $T_{\\text{eq}} = \\left(\\dfrac{S(1-\\alpha)}{4\\varepsilon\\sigma}\\right)^{1/4}$ เมื่อ $S = 1361\\ \\mathrm{W/m^2}$, $\\alpha = 0.30$, $\\varepsilon = 0.60$ และ $\\sigma = 5.67 \\times 10^{-8}\\ \\mathrm{W/(m^2\\cdot K^4)}$ หาอุณหภูมิสมดุลเป็นเคลวิน (ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 289.3, tolerance: 0.3, unit: K }
    misconceptions:
      - { match: 254.6, feedback: "254.6 K คือกรณี ε = 1 ไม่มีปรากฏการณ์เรือนกระจก ต้องใส่ ε = 0.60" }
      - { match: 409.1, feedback: "ลืมหารด้วย 4 ซึ่งมาจากโลกรับแสงด้วยพื้นที่หน้าตัด πR² แต่แผ่รังสีจากผิวทั้งหมด 4πR²" }
    hints:
      - "คำนวณเศษ 1361 × 0.70 และส่วน 4 × 0.60 × 5.67 × 10⁻⁸ ก่อน"
      - "นำผลหารมายกกำลัง 1/4 (ถอดรากที่สองสองครั้ง)"
    solution: "เศษ $1361 \\times 0.70 = 952.7$ ส่วน $4 \\times 0.60 \\times 5.67 \\times 10^{-8} = 1.3608 \\times 10^{-7}$ ผลหาร $\\approx 7.001 \\times 10^{9}$ ยกกำลัง 1/4 ได้ราว 289.3 K"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.systems.computational-models.p007
    topics: [earthscience.systems.computational-models]
    difficulty: 3
    type: numeric
    stem: "แบบจำลองสมดุลพลังงานเริ่มที่ $T = 280$ K คำนวณได้ฟลักซ์สุทธิ (พลังงานเข้า − ออก) $= 24.9\\ \\mathrm{W/m^2}$ ใช้ $C = 4.2 \\times 10^8\\ \\mathrm{J/(m^2\\cdot K)}$ และก้าวเวลา 1 ปี $= 3.15 \\times 10^7$ s หาอุณหภูมิหลังก้าวแรกเป็นเคลวิน (ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 281.87, tolerance: 0.02, unit: K }
    misconceptions:
      - { match: 304.9, feedback: "บวกฟลักซ์เข้ากับอุณหภูมิตรง ๆ ต้องคูณ Δt แล้วหารด้วย C จึงได้การเปลี่ยนอุณหภูมิ" }
      - { match: 1.87, feedback: "1.87 K คือการเปลี่ยนแปลง ต้องบวกกับอุณหภูมิเดิม 280 K" }
    hints:
      - "การเปลี่ยนอุณหภูมิ ΔT = ฟลักซ์สุทธิ × Δt ÷ C"
      - "อุณหภูมิใหม่ = 280 + ΔT"
    solution: "$\\Delta T = 24.9 \\times 3.15 \\times 10^7 / 4.2 \\times 10^8 \\approx 1.87$ K อุณหภูมิใหม่ $280 + 1.87 = 281.87$ K"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.systems.computational-models.p008
    topics: [earthscience.systems.computational-models]
    difficulty: 3
    type: numeric
    stem: "แบบจำลองกล่องคาร์บอน $A_{\\text{ใหม่}} = A + E - k(A - A_0)$ เริ่มที่ 420 ppm ($A = 890.4$ GtC) $A_0 = 593.6$ GtC (280 ppm) $E = 10$ GtC ต่อปี $k = 0.02$ ต่อปี หลัง 1 ปี CO₂ เป็นกี่ ppm (1 ppm = 2.12 GtC ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 421.9, tolerance: 0.05, unit: ppm }
    misconceptions:
      - { match: 424.7, feedback: "ลืมหักส่วนที่มหาสมุทรและพืชดูดกลับ k(A − A₀)" }
      - { match: 894.5, feedback: "นี่คือค่าเป็น GtC ต้องหารด้วย 2.12 เพื่อแปลงเป็น ppm" }
    hints:
      - "หาส่วนที่ดูดกลับ 0.02 × (890.4 − 593.6)"
      - "A ใหม่ = 890.4 + 10 − ส่วนที่ดูดกลับ แล้วหารด้วย 2.12"
    solution: "ดูดกลับ $0.02 \\times (890.4 - 593.6) = 5.94$ GtC $A_{\\text{ใหม่}} = 890.4 + 10 - 5.94 = 894.46$ GtC หรือ $894.46 / 2.12 \\approx 421.9$ ppm"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.systems.computational-models.p009
    topics: [earthscience.systems.computational-models]
    difficulty: 3
    type: expression
    stem: "เขียนนิพจน์ของปริมาณปลาปีถัดไป เมื่อปีนี้มีปลา $N$ ตัน อัตราการเพิ่ม $r$ ความจุของสิ่งแวดล้อม $K$ และจับปลาปีละ $H$ ตัน ตามแบบจำลองลอจิสติก"
    prefix: "N_{t+1} ="
    answer: { latex: "N + rN\\cdot\\left(1-\\frac{N}{K}\\right) - H", variables: [N, r, K, H] }
    misconceptions:
      - { match: "N + rN\\cdot\\left(1-\\frac{N}{K}\\right) + H", feedback: "การจับปลาทำให้ปลาลดลง ต้องลบ H" }
      - { match: "rN\\cdot\\left(1-\\frac{N}{K}\\right) - H", feedback: "ลืมบวกปริมาณปลาเดิม N ส่วนนี้คือการเปลี่ยนแปลงเท่านั้น" }
    hints:
      - "ค่าใหม่ = ค่าเดิม + การเพิ่ม − การออก"
      - "การเพิ่มแบบลอจิสติกคือ rN(1 − N/K)"
    solution: "$N_{t+1} = N + rN\\left(1 - \\dfrac{N}{K}\\right) - H$ ค่าเดิมบวกการเพิ่มตามธรรมชาติ ลบปลาที่ถูกจับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.systems.computational-models.p010
    topics: [earthscience.systems.computational-models]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ภาพแสดงผลของแบบจำลองประชากรปลาที่ $r = 0.4$ ต่อปี $K = 2{,}000$ ตัน เริ่ม 1,500 ตัน เมื่อจับปลา 4 อัตรา คือ 60, 150, 210 และ 240 ตันต่อปี (ไม่ได้บอกว่าเส้นใดคืออัตราใด) เส้นใดเป็นการจับเกินผลผลิตสูงสุดที่ยั่งยืน (เลือกทุกข้อที่ถูก)"
    figure: { src: p-fish.svg, alt: "กราฟปริมาณปลา (ตัน) กับเวลา 0 ถึง 40 ปี ทุกเส้นเริ่มที่ 1,500 ตัน เส้น ข เพิ่มขึ้นแล้วคงที่ราว 1,840 ตัน เส้น ง คงที่ที่ 1,500 ตันตลอด เส้น ค ลดลงช้า ๆ ต่อเนื่องเหลือราว 820 ตันที่ปีที่ 40 เส้น ก ลดลงเร็วขึ้นเรื่อย ๆ จนเป็นศูนย์ราวปีที่ 23" }
    choices:
      - { id: a, text: "เส้น ก", correct: true }
      - { id: b, text: "เส้น ข", feedback: "เส้น ข ปลาเพิ่มขึ้นแล้วคงที่ เป็นการจับน้อยที่สุด 60 ตันต่อปี" }
      - { id: c, text: "เส้น ค", correct: true }
      - { id: d, text: "เส้น ง", feedback: "เส้น ง คงที่ที่ 1,500 ตัน แปลว่าการเพิ่มตามธรรมชาติเท่ากับที่จับพอดี จึงยังยั่งยืน" }
    hints:
      - "ผลผลิตสูงสุดที่ยั่งยืน = rK/4"
      - "ถ้าจับมากกว่าค่านี้ ปลาจะลดลงต่อเนื่องไม่หยุด"
    solution: "ผลผลิตสูงสุดที่ยั่งยืน $= 0.4 \\times 2{,}000 / 4 = 200$ ตันต่อปี การจับ 210 และ 240 ตันเกินค่านี้ ปลาจึงลดลงไม่หยุด เส้น ก (240 ตัน หมดเร็ว) และเส้น ค (210 ตัน ลดลงช้า ๆ) ส่วนเส้น ข (60 ตัน) และ ง (150 ตัน) ยั่งยืน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.systems.computational-models.p011
    topics: [earthscience.systems.computational-models]
    difficulty: 4
    type: numeric
    stem: "ประชากรปลาในแบบจำลองลอจิสติกมี $r = 0.4$ ต่อปี และ $K = 2{,}000$ ตัน ผลผลิตสูงสุดที่ยั่งยืนเป็นกี่ตันต่อปี"
    answer: { value: 200, tolerance: 0, unit: ตันต่อปี }
    misconceptions:
      - { match: 800, feedback: "800 คือ rK ต้องคูณด้วย (K/2)(1 − 1/2)/K หรือหาร rK ด้วย 4" }
      - { match: 1000, feedback: "1,000 ตันคือ K/2 ซึ่งเป็นปริมาณปลาที่เพิ่มเร็วที่สุด ไม่ใช่ผลผลิตต่อปี" }
    hints:
      - "การเพิ่มสูงสุดเกิดที่ N = K/2"
      - "แทน N = K/2 ใน rN(1 − N/K)"
    solution: "ที่ $N = K/2 = 1{,}000$ ตัน การเพิ่ม $= 0.4 \\times 1{,}000 \\times (1 - 0.5) = 200$ ตันต่อปี หรือ $rK/4 = 0.4 \\times 2{,}000 / 4 = 200$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.systems.computational-models.p012
    topics: [earthscience.systems.computational-models]
    difficulty: 4
    type: mcq
    stem: "นักเรียนรันแบบจำลองสมดุลพลังงานด้วยก้าวเวลา 10 ปี แล้วได้อุณหภูมิแกว่งขึ้นลงแรงขึ้นเรื่อย ๆ แทนที่จะเข้าสู่สมดุล ควรแก้อย่างไร"
    choices:
      - { id: a, text: "ลดก้าวเวลาให้เล็กกว่าเวลาตอบสนองของระบบ (ราว 4 ปี) เช่น 1 ปีหรือน้อยกว่า แล้วตรวจว่าผลไม่เปลี่ยนเมื่อลดลงอีก", correct: true }
      - { id: b, text: "เพิ่มก้าวเวลาเป็น 50 ปีเพื่อให้ถึงสมดุลเร็วขึ้น", feedback: "ก้าวที่ใหญ่ขึ้นทำให้การแกว่งรุนแรงขึ้น เพราะแต่ละก้าวกระโดดข้ามจุดสมดุลไปไกลกว่าเดิม" }
      - { id: c, text: "เปลี่ยนความจุความร้อน C ให้เป็นศูนย์", feedback: "C = 0 ทำให้หารด้วยศูนย์ และไม่มีความหมายทางกายภาพ" }
      - { id: d, text: "ไม่ต้องแก้ ผลแกว่งแปลว่าภูมิอากาศจริงแกว่ง", feedback: "การแกว่งนี้เกิดจากวิธีคำนวณ ไม่ใช่ระบบจริง ลดก้าวเวลาแล้วการแกว่งหายไป" }
    hints:
      - "วิธีออยเลอร์คิดว่าอัตราคงที่ตลอดก้าว"
      - "ถ้าก้าวยาวกว่าเวลาที่ระบบใช้ปรับตัว จะเกิดอะไรขึ้น"
    solution: "วิธีออยเลอร์ใช้อัตราตอนต้นก้าวตลอดทั้งก้าว ถ้าก้าวยาวกว่าเวลาตอบสนองของระบบมาก จะกระโดดเลยจุดสมดุลแล้วแกว่ง ต้องลดก้าวเวลาและตรวจว่าผลไม่เปลี่ยนเมื่อลดอีก"
