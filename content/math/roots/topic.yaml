id: math.number.roots
subject: math
title: { th: รากที่สอง รากที่สาม และจำนวนจริง, en: Square roots, cube roots and real numbers }
summary: หารากที่สองและรากที่สาม ประมาณค่ารากที่ไม่ลงตัว รู้จักจำนวนอตรรกยะ และวางจำนวนจริงทุกชนิดบนเส้นจำนวนเส้นเดียวกัน
difficulty: 3
minutes: 30
prerequisites: [math.number.exponents]
encompasses:
  - { id: math.number.exponents, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: square-cube-roots.svg
    alt: "ซ้าย: สี่เหลี่ยมจัตุรัสแบ่งเป็นตาราง 7 คูณ 7 ช่อง พื้นที่ 49 ตารางหน่วย ด้านยาว √49 = 7 ขวา: ลูกบาศก์แบ่งเป็นช่อง 4 คูณ 4 คูณ 4 ปริมาตร 64 ลูกบาศก์หน่วย ด้านยาว ∛64 = 4"
    caption: "รากที่สองย้อนจากพื้นที่ไปหาด้าน รากที่สามย้อนจากปริมาตรไปหาด้าน"
  - type: worked-example
    title: แก้สมการกำลังสองและกำลังสามอย่างง่าย
    problem: "แก้สมการ $x^2 = 81$ และ $x^3 = -8$ แล้วหาความยาวด้านของกล่องลูกบาศก์ที่มีปริมาตร $125\\ \\mathrm{cm^3}$"
    steps:
      - text: "$x^2 = 81$: จำนวนที่ยกกำลังสองได้ 81 มีสองตัว ได้ $x = 9$ หรือ $x = -9$"
        why: "$(-9)^2 = 81$ ด้วย สมการจึงมีสองคำตอบ ต่างจากสัญลักษณ์ $\\sqrt{81}$ ที่หมายถึง 9 อย่างเดียว"
      - text: "$x^3 = -8$: ได้ $x = \\sqrt[3]{-8} = -2$ เพราะ $(-2)^3 = -8$"
        why: "ยกกำลังสามรักษาเครื่องหมาย จึงมีคำตอบจริงเพียงหนึ่งเดียว"
      - text: "กล่อง: ด้าน $s$ สอดคล้องกับ $s^3 = 125$ จึงได้ $s = \\sqrt[3]{125} = 5\\ \\mathrm{cm}$"
      - text: "ตรวจ: $5 \\times 5 \\times 5 = 125$ ✓"
    answer: "$x = \\pm 9$ · $x = -2$ · กล่องยาวด้านละ $5\\ \\mathrm{cm}$"
  - { type: check, problem: math.root.p001, prompt: "ลองถอดรากก่อนอ่านต่อ" }
  - type: figure
    src: sqrt2-number-line.svg
    alt: "สี่เหลี่ยมจัตุรัสด้าน 1 หน่วยวางบนเส้นจำนวนจาก 0 ถึง 1 เส้นทแยงมุมจาก 0 ไปมุมขวาบนยาว √2 มีส่วนโค้งเส้นประหมุนจากปลายเส้นทแยงลงมาตัดเส้นจำนวนที่จุด √2 ประมาณ 1.414 ซึ่งอยู่ระหว่าง 1 กับ 2"
    caption: "จำนวนอตรรกยะ $\\sqrt{2}$ มีตำแหน่งแน่นอนบนเส้นจำนวน แม้เขียนเป็นทศนิยมได้ไม่จบ"
  - type: worked-example
    title: เปลี่ยนทศนิยมซ้ำเป็นเศษส่วน
    problem: "เขียน $0.363636\\ldots$ เป็นเศษส่วนอย่างต่ำ และบอกว่าเป็นจำนวนตรรกยะหรืออตรรกยะ"
    steps:
      - text: "ให้ $x = 0.363636\\ldots$ ส่วนที่ซ้ำคือ 36 ยาว 2 หลัก"
      - text: "คูณ 100: $100x = 36.363636\\ldots$"
        why: "คูณ $10^{\\text{จำนวนหลักที่ซ้ำ}}$ เพื่อให้หางทศนิยมของสองจำนวนตรงกันพอดี"
      - text: "ลบ: $100x - x = 36.3636\\ldots - 0.3636\\ldots = 36$ จึงได้ $99x = 36$"
        why: "หางทศนิยมที่ซ้ำไม่รู้จบหักล้างกันหมด"
      - text: "$x = \\dfrac{36}{99} = \\dfrac{4}{11}$ (หารเศษและส่วนด้วย 9)"
      - text: "ตรวจ: $4 \\div 11 = 0.3636\\ldots$ ✓ เขียนเป็นเศษส่วนของจำนวนเต็มได้ จึงเป็นจำนวนตรรกยะ"
    answer: "$0.\\overline{36} = \\dfrac{4}{11}$ เป็นจำนวนตรรกยะ"
  - { type: check, problem: math.root.p006, prompt: "แยกจำนวนตรรกยะกับอตรรกยะ" }
  - type: interactive
    title: จำนวนอตรรกยะบนเส้นจำนวน
    caption: รากที่สองของจำนวนที่ไม่ใช่กำลังสองสมบูรณ์ก็มีตำแหน่งแน่นอนบนเส้นจำนวน สังเกตว่า √2 อยู่ระหว่าง 1 กับ 2 และ √5 อยู่ระหว่าง 2 กับ 3 เพราะ 5 อยู่ระหว่าง 4 กับ 9
    widget:
      kind: number-line
      min: 0
      max: 4
      points:
        - { value: 1, label: "√1 = 1" }
        - { value: 1.4142, label: "√2" }
        - { value: 1.7321, label: "√3" }
        - { value: 2, label: "√4 = 2" }
        - { value: 2.2361, label: "√5" }
        - { value: 3, label: "√9 = 3" }
        - { value: 3.1416, label: "π" }
glossary:
  - { term: รากที่สอง, definition: "รากที่สองของ $a$ คือจำนวนที่ยกกำลังสองแล้วได้ $a$ สัญลักษณ์ $\\sqrt{a}$ หมายถึงรากที่สองที่ไม่เป็นลบ เช่น $\\sqrt{49} = 7$" }
  - { term: รากที่สาม, definition: "รากที่สามของ $a$ คือจำนวนที่ยกกำลังสามแล้วได้ $a$ เขียนว่า $\\sqrt[3]{a}$ หาได้ทั้งจำนวนบวกและลบ เช่น $\\sqrt[3]{-8} = -2$" }
  - { term: จำนวนตรรกยะ, definition: "จำนวนที่เขียนเป็นเศษส่วน $\\dfrac{p}{q}$ ของจำนวนเต็มได้ ($q \\ne 0$) เขียนเป็นทศนิยมได้ทศนิยมรู้จบหรือทศนิยมซ้ำ" }
  - { term: จำนวนอตรรกยะ, definition: "จำนวนจริงที่เขียนเป็นเศษส่วนของจำนวนเต็มไม่ได้ ทศนิยมไม่รู้จบและไม่ซ้ำ เช่น $\\sqrt{2}$ และ $\\pi$" }
  - { term: จำนวนจริง, definition: "จำนวนตรรกยะและจำนวนอตรรกยะรวมกัน ทุกจุดบนเส้นจำนวนคือจำนวนจริงหนึ่งจำนวน" }
flashcards:
  - { front: "$\\sqrt{49}$ เท่ากับ $7$ หรือ $\\pm 7$", back: "$\\sqrt{49} = 7$ สัญลักษณ์ราก $\\sqrt{\\ }$ หมายถึงรากที่ไม่เป็นลบเท่านั้น แม้ $(-7)^2$ จะเท่ากับ 49 ก็ตาม" }
  - { front: "$\\sqrt[3]{-27}$ เท่ากับเท่าใด", back: "$-3$ เพราะ $(-3)^3 = -27$ รากที่สามของจำนวนลบหาได้" }
  - { front: "ประมาณ $\\sqrt{50}$", back: "$7^2 = 49 < 50 < 64 = 8^2$ จึงอยู่ระหว่าง 7 กับ 8 และใกล้ 7 มาก ประมาณ 7.07" }
  - { front: "$\\sqrt{a + b}$ เท่ากับ $\\sqrt{a} + \\sqrt{b}$ หรือไม่", back: "ไม่เท่า เช่น $\\sqrt{9 + 16} = \\sqrt{25} = 5$ แต่ $\\sqrt{9} + \\sqrt{16} = 7$" }
