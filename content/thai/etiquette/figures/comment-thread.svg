<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470" font-family="sans-serif">
<title>ความคิดเห็นใต้โพสต์ของกลุ่มห้องเรียน</title>
<rect x="0" y="0" width="560" height="470" fill="#fff"/>
<rect x="10.0" y="10.0" width="540.0" height="450.0" rx="12" fill="#f5f6f8" stroke="#999" stroke-width="1.5"/>
<rect x="30.0" y="30.0" width="500.0" height="90.0" rx="10" fill="#fff" stroke="#ccc" stroke-width="1"/>
<text x="50.0" y="58.0" font-size="15" text-anchor="start" fill="#1f5fbf" font-weight="bold">กลุ่มห้อง ป.5/2</text>
<text x="50.0" y="86.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">ครูแพร: โพสต์ผลงานวาดภาพ "ทะเลบ้านเรา"</text>
<text x="50.0" y="108.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">ของนักเรียนทุกคน แสดงความคิดเห็นได้นะคะ</text>
<circle cx="52.0" cy="162.0" r="16.0" fill="#ddd" stroke="#888" stroke-width="1"/>
<text x="52.0" y="168.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">ก</text>
<rect x="78.0" y="140.0" width="452.0" height="74.0" rx="10" fill="#fff" stroke="#ccc" stroke-width="1"/>
<text x="92.0" y="162.0" font-size="14" text-anchor="start" fill="#555" font-weight="bold">ภูมิ</text>
<text x="92.0" y="184.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">ชอบสีฟ้าของน้ำทะเลมากครับ</text>
<text x="92.0" y="206.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">ถ้าเพิ่มเรือสักลำน่าจะสวยขึ้น</text>
<circle cx="52.0" cy="250.0" r="16.0" fill="#ddd" stroke="#888" stroke-width="1"/>
<text x="52.0" y="256.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">ข</text>
<rect x="78.0" y="228.0" width="452.0" height="52.0" rx="10" fill="#fff" stroke="#ccc" stroke-width="1"/>
<text x="92.0" y="250.0" font-size="14" text-anchor="start" fill="#555" font-weight="bold">เจน</text>
<text x="92.0" y="272.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">555 รูปของบีเหมือนเด็กอนุบาลวาด</text>
<circle cx="52.0" cy="316.0" r="16.0" fill="#ddd" stroke="#888" stroke-width="1"/>
<text x="52.0" y="322.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">ค</text>
<rect x="78.0" y="294.0" width="452.0" height="74.0" rx="10" fill="#fff" stroke="#ccc" stroke-width="1"/>
<text x="92.0" y="316.0" font-size="14" text-anchor="start" fill="#555" font-weight="bold">โอ๊ต</text>
<text x="92.0" y="338.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">ใครมีเบอร์บ้านกับที่อยู่ของครูแพร</text>
<text x="92.0" y="360.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">ส่งมาในนี้หน่อย</text>
<circle cx="52.0" cy="404.0" r="16.0" fill="#ddd" stroke="#888" stroke-width="1"/>
<text x="52.0" y="410.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">ง</text>
<rect x="78.0" y="382.0" width="452.0" height="74.0" rx="10" fill="#fff" stroke="#ccc" stroke-width="1"/>
<text x="92.0" y="404.0" font-size="14" text-anchor="start" fill="#555" font-weight="bold">มายด์</text>
<text x="92.0" y="426.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">ขอบคุณที่แบ่งปันค่ะ ภาพของทุกคน</text>
<text x="92.0" y="448.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">ทำให้อยากไปเที่ยวทะเลเลย</text>
</svg>
