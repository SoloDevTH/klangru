problems:
- id: business.accounting.activity-based-costing.p001
  topics:
  - business.accounting.activity-based-costing
  difficulty: 1
  type: mcq
  stem: '**ตัวผลักดันต้นทุน** (cost driver) หมายถึงอะไร'
  choices:
  - id: a
    text: ปัจจัยที่ทำให้ต้นทุนของกิจกรรมเพิ่มหรือลด และใช้วัดว่าผลิตภัณฑ์ใช้กิจกรรมนั้นมากเท่าใด
    correct: true
  - id: b
    text: ราคาขายต่อหน่วยของผลิตภัณฑ์
    feedback: ราคาขายเป็นด้านรายได้ ไม่ใช่สาเหตุของต้นทุน
  - id: c
    text: ต้นทุนวัตถุดิบทางตรง
    feedback: วัตถุดิบทางตรงระบุเข้าสินค้าได้โดยตรงอยู่แล้ว ไม่ต้องใช้ตัวผลักดัน
  - id: d
    text: ผู้จัดการที่อนุมัติค่าใช้จ่าย
    feedback: ตัวผลักดันต้นทุนเป็นปริมาณที่วัดได้ เช่น จำนวนครั้งที่ตั้งเครื่อง ไม่ใช่บุคคล
  hints:
  - ถามว่าอะไร 'ทำให้เกิด' ต้นทุนของกิจกรรม
  - 'ตัวอย่าง: จำนวนครั้งที่ตั้งเครื่อง จำนวนใบสั่งซื้อ'
  solution: ตัวผลักดันต้นทุนคือสาเหตุที่ทำให้ต้นทุนกิจกรรมเปลี่ยน เช่น ยิ่งตั้งเครื่องหลายครั้งต้นทุนการตั้งเครื่องยิ่งสูง ABC ใช้ปริมาณตัวผลักดันที่แต่ละผลิตภัณฑ์ใช้เป็นฐานปันส่วน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.activity-based-costing.p002
  topics:
  - business.accounting.activity-based-costing
  difficulty: 1
  type: match
  stem: จับคู่กิจกรรมกับลำดับชั้นกิจกรรม
  pairs:
  - left: ค่าไฟของเครื่องอบตามชั่วโมงที่อบ
    right: ระดับหน่วย
  - left: ตั้งเครื่องและล้างไลน์ก่อนผลิตแต่ละรุ่น
    right: ระดับรุ่น
  - left: ปรับปรุงสูตรและขึ้นทะเบียนผลิตภัณฑ์
    right: ระดับผลิตภัณฑ์
  - left: ค่าเช่าอาคารโรงงานและยามรักษาการณ์
    right: ระดับโรงงาน
  hints:
  - ระดับหน่วยเพิ่มตามจำนวนชิ้น ระดับรุ่นเพิ่มตามจำนวนครั้งที่ผลิต
  - ระดับโรงงานเกิดขึ้นไม่ว่าจะผลิตสินค้าอะไรเท่าไร
  solution: ระดับหน่วยเกิดทุกชิ้น ระดับรุ่นเกิดทุกครั้งที่เริ่มรุ่นการผลิตไม่ว่ารุ่นนั้นกี่ชิ้น ระดับผลิตภัณฑ์เกิดเพื่อให้มีผลิตภัณฑ์ชนิดนั้น ระดับโรงงานเกิดเพื่อให้โรงงานดำเนินงานได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.activity-based-costing.p003
  topics:
  - business.accounting.activity-based-costing
  difficulty: 2
  type: numeric
  stem: กิจกรรมตั้งเครื่องและล้างไลน์มีต้นทุน $300{,}000$ บาทต่อปี ตั้งเครื่องรวม $60$ ครั้ง อัตรากิจกรรมเป็นกี่บาทต่อครั้ง
  answer:
    value: 5000.0
    unit: บาท
  misconceptions:
  - match: 13.636364
    feedback: หารด้วยจำนวนกล่อง ซึ่งไม่ใช่ตัวผลักดันของการตั้งเครื่อง
  - match: 7500.0
    feedback: ใช้จำนวนครั้งของผลิตภัณฑ์ B อย่างเดียว ต้องใช้ทั้งหมด
  hints:
  - อัตรากิจกรรม = ต้นทุนของกลุ่ม ÷ ปริมาณตัวผลักดันทั้งหมด
  - $300{,}000 \div 60$
  solution: อัตรา $= 300{,}000/60 = 5{,}000$ บาทต่อครั้ง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.activity-based-costing.p004
  topics:
  - business.accounting.activity-based-costing
  difficulty: 2
  type: numeric
  stem: อัตรากิจกรรมตรวจคุณภาพ $2{,}000$ บาทต่อครั้ง ผลิตภัณฑ์ B ถูกตรวจ $80$ ครั้ง ปันส่วนค่าใช้จ่ายตรวจคุณภาพให้ B กี่บาท
  answer:
    value: 160000.0
    unit: บาท
  misconceptions:
  - match: 240000.0
    feedback: ใช้จำนวนครั้งรวมของทั้งสองผลิตภัณฑ์
  - match: 80.0
    feedback: หารด้วยจำนวนกล่องแล้ว นั่นคือต่อกล่อง
  hints:
  - ปันส่วน = อัตรากิจกรรม × ปริมาณตัวผลักดันที่ผลิตภัณฑ์ใช้
  - $2{,}000 \times 80$
  solution: $2{,}000 \times 80 = 160{,}000$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.activity-based-costing.p005
  topics:
  - business.accounting.activity-based-costing
  difficulty: 2
  type: mcq
  stem: โรงงานปันส่วนค่าใช้จ่ายการผลิตด้วยอัตราเดียวทั้งโรงงานตามชั่วโมงแรงงาน ผลิตภัณฑ์ที่ผลิตน้อย รุ่นเล็ก ตั้งเครื่องบ่อย มักได้ต้นทุนเป็นอย่างไร
  choices:
  - id: a
    text: ต่ำเกินจริง เพราะต้นทุนตั้งเครื่องและตรวจคุณภาพถูกเกลี่ยไปให้สินค้าปริมาณมาก
    correct: true
  - id: b
    text: สูงเกินจริง
    feedback: สินค้าปริมาณมากใช้ชั่วโมงแรงงานมาก จึงรับค่าใช้จ่ายไปมาก ส่วนสินค้าปริมาณน้อยรับน้อยกว่าที่ใช้ทรัพยากรจริง
  - id: c
    text: ถูกต้องพอดี เพราะชั่วโมงแรงงานสะท้อนทุกกิจกรรม
    feedback: ต้นทุนระดับรุ่นและระดับผลิตภัณฑ์ไม่แปรตามชั่วโมงแรงงาน
  - id: d
    text: ไม่มีผล เพราะยอดรวมค่าใช้จ่ายเท่าเดิม
    feedback: ยอดรวมเท่าเดิมจริง แต่การแบ่งระหว่างผลิตภัณฑ์ผิด ทำให้ตัดสินใจราคาผิด
  hints:
  - ต้นทุนตั้งเครื่องขึ้นกับจำนวนครั้ง ไม่ใช่ชั่วโมงแรงงาน
  - สินค้าใดใช้ชั่วโมงแรงงานรวมมากกว่า
  solution: อัตราเดียวตามชั่วโมงแรงงานเหมาะกับต้นทุนระดับหน่วยเท่านั้น สินค้าปริมาณน้อยที่ตั้งเครื่องบ่อยใช้กิจกรรมระดับรุ่นและระดับผลิตภัณฑ์มากกว่าส่วนแบ่งชั่วโมงแรงงานของมัน จึงได้ต้นทุนต่ำเกินจริง (และสินค้าปริมาณมากสูงเกินจริง) เรียกว่าการอุดหนุนข้ามผลิตภัณฑ์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.activity-based-costing.p006
  topics:
  - business.accounting.activity-based-costing
  difficulty: 2
  type: numeric
  stem: โรงงานขนมเปี๊ยะ (สมมติ ดูตาราง) ใช้วิธีดั้งเดิม ปันส่วนค่าใช้จ่ายการผลิต $1{,}200{,}000$ บาทตามชั่วโมงแรงงานทางตรง ขนมเปี๊ยะ B ได้รับค่าใช้จ่ายการผลิตกี่บาทต่อกล่อง
  answer:
    value: 100.0
    unit: บาท
  misconceptions:
  - match: 54.545455
    feedback: หารด้วยจำนวนกล่องรวม ไม่ได้ใช้ฐานชั่วโมงแรงงาน
  - match: 300.0
    feedback: แบ่งค่าใช้จ่ายครึ่งหนึ่งให้แต่ละผลิตภัณฑ์
  figure: &id001
    src: p-activity-table.svg
    alt: 'ตารางกลุ่มต้นทุนกิจกรรมของโรงงานขนมเปี๊ยะ (สมมติ) สี่แถว: ใช้เครื่องอบ ต้นทุน 480,000 บาท ตัวผลักดันชั่วโมงเครื่องจักร A ใช้ 8,000 B ใช้ 2,000 · ตั้งเครื่องและล้างไลน์ 300,000 บาท จำนวนครั้งที่ตั้งเครื่อง A 20 B 40 · ตรวจคุณภาพ 240,000 บาท จำนวนครั้งที่ตรวจ A 40 B 80 · ออกแบบและดูแลสูตร 180,000 บาท ชั่วโมงงานออกแบบ A 100 B 200 ใต้ตารางเขียนว่า ผลิต A 20,000 กล่อง ใช้แรงงานทางตรง 10,000 ชั่วโมง ผลิต B 2,000 กล่อง ใช้แรงงานทางตรง 2,000 ชั่วโมง'
  hints:
  - อัตราเดียว $= 1{,}200{,}000 \div 12{,}000$ ชั่วโมง
  - B ใช้ $2{,}000$ ชั่วโมงสำหรับ $2{,}000$ กล่อง
  solution: อัตรา $= 100$ บาทต่อชั่วโมง B รับ $100 \times 2{,}000 = 200{,}000$ บาท หรือ $100$ บาทต่อกล่อง (A ได้ $50$ บาทต่อกล่อง)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.activity-based-costing.p007
  topics:
  - business.accounting.activity-based-costing
  difficulty: 3
  type: numeric
  stem: จากตารางกิจกรรมของโรงงานขนมเปี๊ยะ (สมมติ) จงหาค่าใช้จ่ายการผลิตแบบ ABC ต่อกล่องของขนมเปี๊ยะมาตรฐาน A (บาท)
  answer:
    value: 31.2
    tolerance: 0.3
    unit: บาท
  misconceptions:
  - match: 50.0
    feedback: นั่นคือวิธีดั้งเดิม
  - match: 28.363636
    feedback: หารด้วยจำนวนกล่องรวมของสองผลิตภัณฑ์
  figure: *id001
  hints:
  - 'หาอัตราของแต่ละกิจกรรม: ต้นทุน ÷ ปริมาณรวมของ A และ B'
  - รวม (อัตรา × ปริมาณที่ A ใช้) ทุกกิจกรรม แล้วหารด้วย 20,000 กล่อง
  solution: 'อัตรา: เครื่องอบ $48$ บาท/ชม. ตั้งเครื่อง $5{,}000$ บาท/ครั้ง ตรวจ $2{,}000$ บาท/ครั้ง ออกแบบ $600$ บาท/ชม. A รับ $384{,}000 + 100{,}000 + 80{,}000 + 60{,}000 = 624{,}000$ บาท หรือ $31.2$ บาทต่อกล่อง'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.activity-based-costing.p008
  topics:
  - business.accounting.activity-based-costing
  difficulty: 3
  type: numeric
  stem: จากตารางเดียวกัน ค่าใช้จ่ายการผลิตแบบ ABC ต่อกล่องของขนมเปี๊ยะไส้ทุเรียน B เป็นกี่บาท
  answer:
    value: 288.0
    unit: บาท
  misconceptions:
  - match: 100.0
    feedback: นั่นคือวิธีดั้งเดิม
  - match: 26.181818
    feedback: หารด้วยจำนวนกล่องรวม
  figure: *id001
  hints:
  - ใช้อัตรากิจกรรมเดียวกับ A
  - B รับ $48(2{,}000) + 5{,}000(40) + 2{,}000(80) + 600(200)$ แล้วหารด้วย $2{,}000$ กล่อง
  solution: 'B รับ $96{,}000 + 200{,}000 + 160{,}000 + 120{,}000 = 576{,}000$ บาท หรือ $288$ บาทต่อกล่อง เกือบสามเท่าของวิธีดั้งเดิม (100 บาท) ตรวจ: $624{,}000 + 576{,}000 = 1{,}200{,}000$'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.activity-based-costing.p009
  topics:
  - business.accounting.activity-based-costing
  difficulty: 3
  type: order
  stem: เรียงขั้นตอนการคิดต้นทุนฐานกิจกรรม
  items:
  - ระบุกิจกรรมหลักที่ใช้ทรัพยากร
  - รวมค่าใช้จ่ายของทรัพยากรเข้ากลุ่มต้นทุนกิจกรรม
  - เลือกตัวผลักดันต้นทุนของแต่ละกิจกรรม
  - คำนวณอัตรากิจกรรม = ต้นทุนกลุ่ม ÷ ปริมาณตัวผลักดันทั้งหมด
  - ปันส่วนเข้าผลิตภัณฑ์ = อัตรา × ปริมาณตัวผลักดันที่ผลิตภัณฑ์ใช้ แล้วหารด้วยจำนวนหน่วย
  hints:
  - ต้องรู้ว่ามีกิจกรรมอะไรก่อนรวมต้นทุนเข้ากลุ่ม
  - อัตราคำนวณได้หลังรู้ตัวผลักดัน
  solution: กิจกรรม → กลุ่มต้นทุน → ตัวผลักดัน → อัตรากิจกรรม → ปันส่วนเข้าผลิตภัณฑ์ (ต้นทุนไหลจากทรัพยากร สู่กิจกรรม สู่ผลิตภัณฑ์)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.activity-based-costing.p010
  topics:
  - business.accounting.activity-based-costing
  difficulty: 3
  type: numeric
  stem: 'ข้อมูลกิจกรรมตั้งเครื่องรายเดือน (สมมติ): เดือนที่ตั้งเครื่องน้อยที่สุด $30$ ครั้ง ต้นทุน $180{,}000$ บาท เดือนที่มากที่สุด $50$ ครั้ง ต้นทุน $260{,}000$ บาท ใช้วิธีจุดสูงจุดต่ำหาต้นทุนผันแปรต่อการตั้งเครื่องหนึ่งครั้ง (บาท)'
  answer:
    value: 4000.0
    unit: บาท
  misconceptions:
  - match: 5200.0
    feedback: หารต้นทุนรวมด้วยจำนวนครั้ง ซึ่งรวมต้นทุนคงที่ไปด้วย
  - match: 6000.0
    feedback: ใช้จุดต่ำจุดเดียว
  hints:
  - ต้นทุนผันแปรต่อหน่วย = ผลต่างต้นทุน ÷ ผลต่างปริมาณตัวผลักดัน
  - $(260{,}000 - 180{,}000) \div (50 - 30)$
  solution: $\dfrac{80{,}000}{20} = 4{,}000$ บาทต่อครั้ง ต้นทุนคงที่ $= 260{,}000 - 4{,}000(50) = 60{,}000$ บาท ถ้าต้นทุนส่วนใหญ่แปรตามจำนวนครั้ง จำนวนครั้งที่ตั้งเครื่องเป็นตัวผลักดันที่ดี
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.activity-based-costing.p011
  topics:
  - business.accounting.activity-based-costing
  difficulty: 4
  type: numeric
  stem: ขนมเปี๊ยะไส้ทุเรียน B ขายกล่องละ $300$ บาท ต้นทุนวัตถุดิบและค่าแรงทางตรง $120$ บาทต่อกล่อง ถ้าคิดค่าใช้จ่ายการผลิตแบบ ABC ($288$ บาทต่อกล่อง) กำไรขั้นต้นต่อกล่องเป็นเท่าใด (บาท ตอบพร้อมเครื่องหมาย)
  answer:
    value: -108.0
    unit: บาท
  misconceptions:
  - match: 80.0
    feedback: ใช้ค่าใช้จ่ายการผลิตแบบดั้งเดิม
  - match: 12.0
    feedback: ลืมต้นทุนเบื้องต้น
  hints:
  - ต้นทุนผลิตต่อกล่อง = ต้นทุนเบื้องต้น + ค่าใช้จ่ายการผลิต
  - กำไรขั้นต้น = ราคาขาย − ต้นทุนผลิต
  solution: ต้นทุน $= 120 + 288 = 408$ บาท กำไร $= 300 - 408 = -108$ บาท (ขาดทุน) ขณะที่วิธีดั้งเดิมบอกว่ากำไร $300 - 220 = 80$ บาท ABC จึงอาจเปลี่ยนการตัดสินใจเรื่องราคาหรือขนาดรุ่นการผลิต
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.activity-based-costing.p012
  topics:
  - business.accounting.activity-based-costing
