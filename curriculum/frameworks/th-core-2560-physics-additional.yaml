copyright: "ต้นฉบับเป็นหนังสือที่ สพฐ. กระทรวงศึกษาธิการ จัดพิมพ์และเผยแพร่ (พ.ศ. 2560) ให้สถานศึกษาใช้เป็นกรอบพัฒนาหลักสูตร คำนำระบุว่ากระทรวงศึกษาธิการโดย สสวท. เป็นผู้จัดทำมาตรฐานการเรียนรู้และตัวชี้วัด คลังรู้ตีความว่าเป็นเอกสารของหน่วยงานรัฐที่ไม่เป็นงานอันมีลิขสิทธิ์ตาม พ.ร.บ.ลิขสิทธิ์ พ.ศ. 2537 มาตรา 7 (เป็นการตีความของเรา ไม่ใช่คำวินิจฉัยทางกฎหมาย) ไฟล์ Word ที่ใช้ตรวจทานเป็นสิ่งพิมพ์ของ สสวท. ไม่ใช่ประกาศของกระทรวง ใช้เทียบข้อความเท่านั้น ข้อความในไฟล์นี้คัดจากหนังสือ สพฐ."
