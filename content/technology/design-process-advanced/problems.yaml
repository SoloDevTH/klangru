    feedback: การคำนวณครั้งหลังใช้น้ำหนักที่ทีมตั้งเอง ไม่ได้ดีกว่าครั้งแรก
  - id: d
    text: ต้องเลือกแบบ B เพราะคำนวณก่อน
    feedback: ลำดับการคำนวณไม่ได้ทำให้ถูกกว่า
  hints:
