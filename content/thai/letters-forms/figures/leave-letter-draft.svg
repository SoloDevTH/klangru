<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="sans-serif">
<title>ใบลาป่วยสมมุติของนักเรียนที่ยังเขียนไม่ครบ</title>
<defs></defs>
<rect x="0" y="0" width="860" height="470" fill="#fff"/>
<rect x="10.0" y="10.0" width="840.0" height="450.0" rx="6" fill="#fff" stroke="#555" stroke-width="2"/>
<text x="830.0" y="44.0" font-size="17" text-anchor="end" fill="#111" font-weight="normal">บ้านเลขที่ 8 หมู่ 2 ต.บ้านสวน</text>
<text x="830.0" y="70.0" font-size="17" text-anchor="end" fill="#111" font-weight="normal">อ.เมือง จ.สุขสันต์ (สมมุติ)</text>
<text x="520.0" y="104.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">4 พฤศจิกายน 2569</text>
<text x="40.0" y="140.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">เรื่อง  ขอลาป่วย</text>
<text x="40.0" y="172.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">เรียน  คุณครูประจำชั้น ป.4/2</text>
<text x="90.0" y="212.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">ข้าพเจ้า เด็กชายต้นกล้า มีสุข นักเรียนชั้น ป.4/2 มีไข้และไอ</text>
<text x="40.0" y="242.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">แพทย์ให้พักที่บ้าน จึงขอลาป่วย เมื่อหายแล้วจะกลับมาเรียนตามปกติ</text>
<text x="90.0" y="282.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">จึงเรียนมาเพื่อโปรดพิจารณา</text>
<text x="520.0" y="326.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">ด้วยความคิดถึง</text>
<text x="500.0" y="368.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">ต้นกล้า มีสุข</text>
<text x="500.0" y="396.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">(เด็กชายต้นกล้า มีสุข)</text>
</svg>
