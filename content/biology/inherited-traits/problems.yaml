problems:
  - id: biology.genetics.inherited-traits.p001
    topics: [biology.genetics.inherited-traits]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นลักษณะทางพันธุกรรม"
    choices:
      - { id: a, text: "ติ่งหูติด", correct: true }
      - { id: b, text: "แผลเป็นที่เข่าจากการหกล้ม", feedback: "แผลเป็นเกิดจากอุบัติเหตุภายหลัง ไม่ได้ถ่ายทอดจากพ่อแม่" }
      - { id: c, text: "ผมสีน้ำตาลที่ย้อมมา", feedback: "สีผมที่ย้อมไม่ได้ถ่ายทอดไปถึงลูก" }
      - { id: d, text: "พูดภาษาอังกฤษได้", feedback: "ภาษาเป็นสิ่งที่ฝึกเรียนรู้ ไม่ได้ถ่ายทอดทางพันธุกรรม" }
    hints:
      - "ลักษณะทางพันธุกรรมถ่ายทอดจากพ่อแม่สู่ลูก"
      - "ตัดข้อที่เกิดขึ้นภายหลังหรือจากการฝึกออกไป"
    solution: "ติ่งหูติดเป็นลักษณะที่ถ่ายทอดจากพ่อแม่ ส่วนแผลเป็น ผมที่ย้อม และภาษาที่พูด เกิดภายหลังจากสิ่งแวดล้อมหรือการฝึก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.inherited-traits.p002
    topics: [biology.genetics.inherited-traits]
    difficulty: 1
    type: text
    stem: "ลักษณะที่ถ่ายทอดจากพ่อแม่ไปสู่ลูก เช่น ลักยิ้ม สีตา เรียกว่าอะไร"
    accepted: ["ลักษณะทางพันธุกรรม", "ลักษณะพันธุกรรม", "พันธุกรรม", "inherited trait", "inherited traits"]
    hints:
      - "เป็นลักษณะที่ส่งต่อจากรุ่นพ่อแม่ไปรุ่นลูก"
      - "ชื่อมีคำว่า พันธุกรรม"
    misconceptions:
      - { match: "ลักษณะภายนอก", feedback: "ลักษณะภายนอกบางอย่าง เช่น แผลเป็น ไม่ได้ถ่ายทอดจากพ่อแม่ ต้องใช้ชื่อที่บอกว่าถ่ายทอดได้" }
    solution: "ลักษณะทางพันธุกรรม คือลักษณะที่ถ่ายทอดจากพ่อแม่ไปสู่ลูก เช่น ลักยิ้ม ติ่งหู สีตา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.inherited-traits.p003
    topics: [biology.genetics.inherited-traits]
    difficulty: 1
    type: match
    stem: "จับคู่ลักษณะกับกลุ่มที่ถูกต้อง"
    pairs:
      - { left: "มีลักยิ้ม", right: "ลักษณะทางพันธุกรรมของคน" }
      - { left: "สีดอกชบา", right: "ลักษณะทางพันธุกรรมของพืช" }
      - { left: "สีขนของแมว", right: "ลักษณะทางพันธุกรรมของสัตว์" }
      - { left: "รอยสักที่แขน", right: "ไม่ใช่ลักษณะทางพันธุกรรม" }
    hints:
      - "ดูว่าลักษณะนั้นเป็นของคน พืช หรือสัตว์"
      - "สิ่งที่ทำขึ้นภายหลังไม่ถ่ายทอดไปถึงลูก"
    solution: "ลักยิ้มเป็นลักษณะทางพันธุกรรมของคน สีดอกชบาเป็นของพืช สีขนแมวเป็นของสัตว์ ส่วนรอยสักทำขึ้นภายหลัง จึงไม่ใช่ลักษณะทางพันธุกรรม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.inherited-traits.p004
    topics: [biology.genetics.inherited-traits]
    difficulty: 2
    type: mcq
    stem: "แม่แมวสีส้มมีลูก 4 ตัว ลูกทุกตัวเป็นแมว บางตัวสีส้ม บางตัวสีส้มลายขาว ข้อใดสรุปได้ถูกต้อง"
    choices:
      - { id: a, text: "ลูกเป็นชนิดเดียวกับแม่ และคล้ายพ่อแม่ แต่ไม่เหมือนทุกอย่าง", correct: true }
      - { id: b, text: "ลูกต้องเหมือนแม่ทุกตัว ตัวที่มีลายขาวจึงผิดปกติ", feedback: "ลูกได้ลักษณะจากทั้งพ่อและแม่ จึงต่างจากแม่ได้ ไม่ใช่ความผิดปกติ" }
      - { id: c, text: "ลูกได้ลักษณะจากแม่เท่านั้น", feedback: "ลูกได้ลักษณะจากทั้งพ่อและแม่ ลายขาวอาจมาจากพ่อแมว" }
      - { id: d, text: "ลูกแต่ละตัวเป็นสัตว์คนละชนิดกัน", feedback: "ลูกแมวทุกตัวยังเป็นแมว ชนิดเดียวกับพ่อแม่" }
    hints:
      - "สิ่งมีชีวิตมีลูกเป็นชนิดเดียวกับตัวเองเสมอ"
      - "ลูกได้ลักษณะจากใครบ้าง"
    solution: "ลูกแมวทุกตัวเป็นแมวเหมือนพ่อแม่ แต่สีขนต่างกันได้ เพราะแต่ละตัวได้ลักษณะจากพ่อและแม่คนละแบบ ลูกจึงคล้ายแต่ไม่เหมือนพ่อแม่ทุกอย่าง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.inherited-traits.p005
    topics: [biology.genetics.inherited-traits]
    difficulty: 2
    type: numeric
    stem: "จากแผนภูมิ ก. ลักษณะติ่งหูของนักเรียนห้องหนึ่ง มีนักเรียนที่มีติ่งหูติดกี่คน"
    figure: { src: p-class-data.svg, alt: "กราฟ 2 รูป รูป ก. ลักษณะติ่งหู เป็นแผนภูมิแท่งสองแท่งแยกกัน แกนตั้งคือจำนวนนักเรียน 0 ถึง 25 คน แท่งติ่งหูห้อยสูง 23 คน แท่งติ่งหูติดสูง 9 คน รูป ข. ความสูง เป็นฮิสโทแกรมแท่งติดกัน แกนนอนคือความสูง 130 ถึง 155 เซนติเมตร แบ่งช่วงละ 5 เซนติเมตร ช่วง 130–135 มี 3 คน 135–140 มี 7 คน 140–145 มี 11 คน 145–150 มี 8 คน และ 150–155 มี 3 คน" }
    answer: { value: 9, unit: คน }
    hints:
      - "หาแท่งที่เขียนว่า ติ่งหูติด"
      - "อ่านความสูงของแท่งจากแกนตั้ง"
    misconceptions:
      - { match: 23, feedback: "นี่คือจำนวนนักเรียนที่มีติ่งหูห้อย ดูแท่งอีกแท่งหนึ่ง" }
      - { match: 32, feedback: "นี่คือนักเรียนทั้งห้อง โจทย์ถามเฉพาะติ่งหูติด" }
    solution: "แท่งติ่งหูติดสูงถึง 9 จึงมีนักเรียนติ่งหูติด 9 คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.inherited-traits.p006
    topics: [biology.genetics.inherited-traits]
    difficulty: 2
    type: mcq
    stem: "น้องฟ้าสังเกตว่าตัวเองมีลักยิ้มเหมือนแม่ แต่พี่ชายไม่มี คำถามใดเหมาะที่สุดที่น้องฟ้าจะใช้สืบค้นต่อ"
    choices:
      - { id: a, text: "ในครอบครัวของเรา ใครมีลักยิ้มบ้าง และลักยิ้มถ่ายทอดจากพ่อแม่อย่างไร", correct: true }
      - { id: b, text: "ทำไมพี่ชายจึงไม่น่ารักเท่าฉัน", feedback: "คำถามนี้ไม่ได้ถามเรื่องการถ่ายทอดลักษณะ และไม่เคารพความแตกต่างของผู้อื่น" }
      - { id: c, text: "ลักยิ้มทำให้ยิ้มสวยกว่าหรือไม่", feedback: "ความสวยเป็นความเห็น ตรวจสอบด้วยการสังเกตลักษณะในครอบครัวไม่ได้" }
      - { id: d, text: "ถ้ายิ้มบ่อย ๆ จะมีลักยิ้มได้หรือไม่", feedback: "เป็นคำถามได้ แต่ไม่ได้ช่วยอธิบายว่าทำไมน้องฟ้ามีเหมือนแม่และพี่ไม่มี" }
    hints:
      - "คำถามที่ดีต้องเกี่ยวกับสิ่งที่สังเกตเห็น และหาคำตอบได้"
      - "น้องฟ้าสงสัยเรื่องลักษณะของตัวเองกับพ่อแม่และพี่"
    solution: "คำถามที่ถามว่าใครในครอบครัวมีลักยิ้ม และลักยิ้มถ่ายทอดอย่างไร ตรงกับสิ่งที่สังเกตและหาคำตอบได้ด้วยการสำรวจครอบครัวและสืบค้นข้อมูล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.inherited-traits.p007
    topics: [biology.genetics.inherited-traits]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการสำรวจลักษณะทางพันธุกรรมของตัวเองกับพ่อแม่"
    items:
      - "เลือกลักษณะที่สังเกตง่าย เช่น ติ่งหู ลักยิ้ม"
      - "สังเกตและบันทึกลักษณะของตัวเอง พ่อ และแม่ลงตาราง"
      - "เปรียบเทียบว่าลักษณะใดเหมือนใคร"
      - "สรุปผลและตั้งคำถามใหม่"
    hints:
      - "ต้องรู้ก่อนว่าจะดูลักษณะใด"
      - "สรุปได้หลังจากมีข้อมูลและเปรียบเทียบแล้ว"
    solution: "เลือกลักษณะ → สังเกตและบันทึก → เปรียบเทียบ → สรุปและตั้งคำถามใหม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.inherited-traits.p008
    topics: [biology.genetics.inherited-traits]
    difficulty: 3
    type: numeric
    stem: "จากฮิสโทแกรม ข. ความสูงของนักเรียน มีนักเรียนที่สูงตั้งแต่ 140 แต่ไม่ถึง 150 เซนติเมตร กี่คน"
    figure: { src: p-class-data.svg, alt: "กราฟ 2 รูป รูป ก. ลักษณะติ่งหู เป็นแผนภูมิแท่งสองแท่งแยกกัน แกนตั้งคือจำนวนนักเรียน 0 ถึง 25 คน แท่งติ่งหูห้อยสูง 23 คน แท่งติ่งหูติดสูง 9 คน รูป ข. ความสูง เป็นฮิสโทแกรมแท่งติดกัน แกนนอนคือความสูง 130 ถึง 155 เซนติเมตร แบ่งช่วงละ 5 เซนติเมตร ช่วง 130–135 มี 3 คน 135–140 มี 7 คน 140–145 มี 11 คน 145–150 มี 8 คน และ 150–155 มี 3 คน" }
    answer: { value: 19, unit: คน }
    hints:
      - "ช่วง 140 ถึงไม่ถึง 150 มีกี่แท่ง"
      - "บวกจำนวนนักเรียนของแท่ง 140–145 และ 145–150"
    misconceptions:
      - { match: 11, feedback: "นับเพียงแท่ง 140–145 ต้องรวมแท่ง 145–150 ด้วย" }
      - { match: 26, feedback: "รวมแท่ง 135–140 เข้าไปด้วย แท่งนั้นยังไม่ถึง 140" }
    solution: "แท่ง 140–145 มี 11 คน แท่ง 145–150 มี 8 คน รวม $11 + 8 = 19$ คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.inherited-traits.p009
    topics: [biology.genetics.inherited-traits]
    difficulty: 3
    type: mcq
    stem: "ทำไมกราฟความสูงของนักเรียนจึงเขียนเป็นฮิสโทแกรมที่แท่งติดกัน แต่กราฟติ่งหูเขียนเป็นแท่งแยกกัน"
    choices:
      - { id: a, text: "ความสูงเป็นความแปรผันแบบต่อเนื่อง มีค่าได้ทุกค่า ส่วนติ่งหูแบ่งเป็นกลุ่มชัดเจน", correct: true }
      - { id: b, text: "ความสูงไม่ใช่ลักษณะทางพันธุกรรม", feedback: "ความสูงเป็นลักษณะทางพันธุกรรมที่สิ่งแวดล้อม เช่น อาหาร มีผลด้วย" }
      - { id: c, text: "เพราะนักเรียนที่วัดความสูงมีมากกว่า", feedback: "นักเรียนกลุ่มเดียวกัน 32 คนทั้งสองกราฟ ความต่างอยู่ที่ชนิดของความแปรผัน" }
      - { id: d, text: "ติ่งหูมีค่าได้ทุกค่า ส่วนความสูงมีแค่สองแบบ", feedback: "กลับกัน ติ่งหูมีแค่ห้อยกับติด ส่วนความสูงมีค่าได้ทุกค่าในช่วงหนึ่ง" }
    hints:
      - "ติ่งหูมีค่ากลางระหว่างห้อยกับติดหรือไม่"
      - "ความสูง 141.5 เซนติเมตร เป็นไปได้หรือไม่"
    solution: "ความสูงเป็นความแปรผันแบบต่อเนื่อง มีค่าได้ทุกค่าในช่วงหนึ่ง จึงแบ่งเป็นช่วงแล้วเขียนฮิสโทแกรมแท่งติดกัน ส่วนติ่งหูเป็นแบบไม่ต่อเนื่อง มีแค่ห้อยหรือติด จึงใช้แท่งแยกกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.inherited-traits.p010
    topics: [biology.genetics.inherited-traits]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ลักษณะใดเป็นความแปรผันแบบไม่ต่อเนื่อง (เลือกได้หลายข้อ)"
    choices:
      - { id: a, text: "มีหรือไม่มีลักยิ้ม", correct: true }
      - { id: b, text: "หมู่เลือด A B AB หรือ O", correct: true }
      - { id: c, text: "ติ่งหูห้อยหรือติด", correct: true }
      - { id: d, text: "น้ำหนักตัว", feedback: "น้ำหนักมีค่าได้ทุกค่าในช่วงหนึ่ง จึงเป็นแบบต่อเนื่อง" }
      - { id: e, text: "ความยาวของใบมะม่วง", feedback: "ความยาวใบวัดได้หลายค่าต่อเนื่องกัน จึงเป็นแบบต่อเนื่อง" }
    hints:
      - "แบบไม่ต่อเนื่องแบ่งเป็นกลุ่มชัด ไม่มีค่ากลาง"
      - "ลักษณะที่ต้องวัดด้วยไม้บรรทัดหรือเครื่องชั่งมักเป็นแบบต่อเนื่อง"
    solution: "ลักยิ้ม หมู่เลือด และติ่งหู แบ่งเป็นกลุ่มชัดเจน เป็นแบบไม่ต่อเนื่อง ส่วนน้ำหนักและความยาวใบมีค่าได้ทุกค่าในช่วงหนึ่ง เป็นแบบต่อเนื่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.inherited-traits.p011
    topics: [biology.genetics.inherited-traits]
    difficulty: 3
    type: mcq
    stem: "สุนัขพันธุ์ชิวาวาตัวเล็กมาก ส่วนพันธุ์โกลเดนรีทรีฟเวอร์ตัวใหญ่ แต่นักวิทยาศาสตร์บอกว่าเป็นสิ่งมีชีวิตชนิดเดียวกัน ข้อใดเป็นเหตุผล"
    choices:
      - { id: a, text: "ผสมพันธุ์กันได้และมีลูกที่เติบโตมีลูกต่อได้", correct: true }
      - { id: b, text: "มีสี่ขาเหมือนกัน", feedback: "แมวและวัวก็มีสี่ขา แต่เป็นคนละชนิดกับสุนัข" }
      - { id: c, text: "เลี้ยงไว้ในบ้านเหมือนกัน", feedback: "แมวก็เลี้ยงในบ้าน แต่เป็นคนละชนิดกับสุนัข" }
      - { id: d, text: "มีขนาดตัวเท่ากัน", feedback: "สองพันธุ์นี้ขนาดต่างกันมาก ขนาดจึงไม่ใช่เหตุผล" }
    hints:
      - "สิ่งมีชีวิตชนิดเดียวกันทำอะไรร่วมกันได้"
      - "ขนาดต่างกันเป็นความแปรผันภายในชนิด"
    solution: "สิ่งมีชีวิตชนิดเดียวกันผสมพันธุ์กันได้และมีลูกที่มีลูกต่อได้ ขนาดที่ต่างกันมากเป็นความแปรผันภายในชนิดเดียวกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.inherited-traits.p012
    topics: [biology.genetics.inherited-traits]
    difficulty: 3
    type: mcq
    stem: "ชาวสวนตัดกิ่งชบาจากต้นเดียวกันไปปักชำ 2 กิ่ง ปลูกกลางแดด 1 กระถาง และในร่มใต้ชายคา 1 กระถาง 2 เดือนต่อมา ต้นในร่มสูงชะลูด ใบสีเขียวอ่อน ต้นกลางแดดเตี้ยกว่าแต่ใบเขียวเข้ม ข้อใดสรุปได้ถูกต้อง"
    choices:
      - { id: a, text: "สิ่งแวดล้อม (แสง) ทำให้ลักษณะต่างกัน เพราะสองต้นมีพันธุกรรมเหมือนกัน", correct: true }
      - { id: b, text: "สองต้นมีพันธุกรรมต่างกัน", feedback: "ต้นที่ได้จากการปักชำกิ่งของต้นเดียวกันมีพันธุกรรมเหมือนกัน" }
      - { id: c, text: "ต้นในร่มจะมีลูกที่สูงชะลูดเสมอ", feedback: "ลักษณะที่เกิดจากสิ่งแวดล้อมไม่ได้ถ่ายทอดไปถึงรุ่นต่อไป" }
      - { id: d, text: "แสงไม่มีผลต่อพืชเลย", feedback: "ผลการทดลองแสดงว่าแสงต่างกัน ต้นจึงต่างกัน" }
    hints:
      - "กิ่งปักชำจากต้นเดียวกันได้พันธุกรรมจากที่ใด"
      - "สิ่งเดียวที่ต่างกันในการทดลองนี้คืออะไร"
    solution: "สองต้นมาจากต้นเดียวกันจึงมีพันธุกรรมเหมือนกัน สิ่งที่ต่างคือแสง ลักษณะที่ต่างจึงเกิดจากสิ่งแวดล้อม แสดงว่าสิ่งแวดล้อมมีผลต่อลักษณะได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.inherited-traits.p013
    topics: [biology.genetics.inherited-traits]
    difficulty: 4
    type: numeric
    stem: "จากแผนภูมิ ก. ลักษณะติ่งหู นักเรียนที่มีติ่งหูติดคิดเป็นร้อยละเท่าใดของนักเรียนทั้งห้อง ตอบเป็นทศนิยม 1 ตำแหน่ง"
    figure: { src: p-class-data.svg, alt: "กราฟ 2 รูป รูป ก. ลักษณะติ่งหู เป็นแผนภูมิแท่งสองแท่งแยกกัน แกนตั้งคือจำนวนนักเรียน 0 ถึง 25 คน แท่งติ่งหูห้อยสูง 23 คน แท่งติ่งหูติดสูง 9 คน รูป ข. ความสูง เป็นฮิสโทแกรมแท่งติดกัน แกนนอนคือความสูง 130 ถึง 155 เซนติเมตร แบ่งช่วงละ 5 เซนติเมตร ช่วง 130–135 มี 3 คน 135–140 มี 7 คน 140–145 มี 11 คน 145–150 มี 8 คน และ 150–155 มี 3 คน" }
    answer: { value: 28.1, tolerance: 0.1, unit: "%" }
    hints:
      - "หาจำนวนนักเรียนทั้งห้องก่อน โดยรวมสองแท่ง"
      - "ร้อยละ = จำนวนที่สนใจ ÷ จำนวนทั้งหมด × 100"
    misconceptions:
      - { match: 39.1, feedback: "หาร 9 ด้วย 23 (จำนวนติ่งหูห้อย) ต้องหารด้วยนักเรียนทั้งห้อง" }
      - { match: 71.9, feedback: "นี่คือร้อยละของนักเรียนที่มีติ่งหูห้อย" }
    solution: "นักเรียนทั้งห้อง $23 + 9 = 32$ คน ร้อยละของติ่งหูติด $= \\frac{9}{32} \\times 100 = 28.125 \\approx 28.1$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.inherited-traits.p014
    topics: [biology.genetics.inherited-traits]
    difficulty: 4
    type: mcq
    stem: "ลุงปลูกต้นมะม่วงน้ำดอกไม้จากเมล็ด เมื่อต้นโตและออกผล รสชาติของผลไม่เหมือนต้นแม่ ข้อใดอธิบายได้ดีที่สุด"
    choices:
      - { id: a, text: "เมล็ดเกิดจากการผสมระหว่างละอองเรณูกับไข่ ต้นใหม่จึงได้ลักษณะจากทั้งต้นที่ให้ละอองเรณูและต้นแม่", correct: true }
      - { id: b, text: "เมล็ดได้ลักษณะจากต้นแม่เพียงต้นเดียว รสจึงต้องเหมือนเดิม ลุงจึงปลูกผิดวิธี", feedback: "เมล็ดได้ลักษณะจากสองต้น ผลจึงต่างจากต้นแม่ได้ แม้ปลูกถูกวิธี" }
      - { id: c, text: "ดินของลุงทำให้ยีนของต้นมะม่วงเปลี่ยน", feedback: "ดินมีผลต่อการเติบโต แต่คำอธิบายหลักคือเมล็ดได้ลักษณะจากสองต้น" }
      - { id: d, text: "ต้นมะม่วงจากเมล็ดเป็นมะม่วงคนละชนิด", feedback: "ต้นที่ได้ยังเป็นมะม่วงชนิดเดียวกัน เพียงลักษณะบางอย่างต่างไป" }
    hints:
      - "เมล็ดเกิดจากการปฏิสนธิ ต้องมีละอองเรณูมาผสม"
      - "ละอองเรณูอาจมาจากต้นมะม่วงพันธุ์อื่น"
    solution: "เมล็ดเกิดจากการรวมกันของเซลล์จากละอองเรณูกับเซลล์ไข่ ต้นใหม่จึงได้ลักษณะจากทั้งสองต้น ชาวสวนจึงนิยมตอนกิ่งหรือเสียบยอดเพื่อให้ได้ต้นที่เหมือนต้นแม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.inherited-traits.p015
    topics: [biology.genetics.inherited-traits]
    difficulty: 4
    type: mcq
    stem: "ฝาแฝดเหมือนคู่หนึ่งมีพันธุกรรมเหมือนกัน คนหนึ่งเป็นนักกีฬาว่ายน้ำ ซ้อมกลางแจ้งทุกวัน อีกคนชอบอ่านหนังสือในห้อง ผ่านไป 3 ปี ลักษณะใดน่าจะต่างกันมากที่สุด"
    choices:
      - { id: a, text: "สีผิวและขนาดกล้ามเนื้อ", correct: true }
      - { id: b, text: "ติ่งหู", feedback: "ติ่งหูเป็นลักษณะทางพันธุกรรมที่สิ่งแวดล้อมไม่ค่อยมีผล แฝดเหมือนจึงมีติ่งหูแบบเดียวกัน" }
      - { id: c, text: "หมู่เลือด", feedback: "หมู่เลือดกำหนดโดยพันธุกรรม ไม่เปลี่ยนตามการใช้ชีวิต" }
      - { id: d, text: "สีตา", feedback: "สีตากำหนดโดยพันธุกรรมเป็นหลัก การว่ายน้ำไม่ได้เปลี่ยนสีตา" }
    hints:
      - "แฝดเหมือนมีพันธุกรรมเหมือนกัน ความต่างจึงมาจากอะไร"
      - "การตากแดดและการออกกำลังกายเปลี่ยนอะไรในร่างกาย"
    solution: "พันธุกรรมเหมือนกัน ลักษณะที่ต่างจึงมาจากสิ่งแวดล้อมและการใช้ชีวิต การตากแดดทำให้ผิวคล้ำ และการว่ายน้ำทุกวันทำให้กล้ามเนื้อใหญ่ขึ้น ส่วนติ่งหู หมู่เลือด และสีตายังเหมือนกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.inherited-traits.p016
    topics: [biology.genetics.inherited-traits]
    difficulty: 5
    type: mcq
    stem: "ตารางบันทึกของน้องต้น: พ่อมีติ่งหูห้อย แม่มีติ่งหูห้อย พี่สาวมีติ่งหูห้อย น้องต้นมีติ่งหูติด และคุณยายมีติ่งหูติด ข้อสรุปใดมีข้อมูลรองรับดีที่สุด"
    choices:
      - { id: a, text: "ลักษณะติ่งหูติดอาจซ่อนอยู่ในพ่อแม่ที่มีติ่งหูห้อย แล้วปรากฏในรุ่นลูกได้ เหมือนที่น้องต้นมีลักษณะเหมือนคุณยาย", correct: true }
      - { id: b, text: "น้องต้นไม่ใช่ลูกของพ่อแม่ เพราะลักษณะไม่เหมือน", feedback: "ลูกอาจมีลักษณะที่พ่อแม่ไม่แสดงให้เห็นได้ ข้อมูลนี้ไม่ได้บอกเช่นนั้น" }
      - { id: c, text: "ติ่งหูติดเกิดจากการนอนทับหูบ่อย ๆ", feedback: "ติ่งหูเป็นลักษณะทางพันธุกรรม ไม่ได้เกิดจากท่านอน" }
      - { id: d, text: "ลูกทุกคนในครอบครัวนี้ต้องมีติ่งหูห้อย", feedback: "ข้อมูลแสดงว่าน้องต้นมีติ่งหูติด ข้อสรุปนี้จึงขัดกับข้อมูล" }
    hints:
      - "ใครในครอบครัวมีติ่งหูติดเหมือนน้องต้น"
      - "ลักษณะบางอย่างซ่อนอยู่ในพ่อแม่ได้ แล้วไปปรากฏในรุ่นลูก"
    solution: "คุณยายมีติ่งหูติด ลักษณะนี้ถ่ายทอดมาซ่อนอยู่ในแม่ที่มีติ่งหูห้อย และพ่อก็อาจมีลักษณะนี้ซ่อนอยู่ จึงปรากฏในน้องต้นได้ ลูกจึงอาจมีลักษณะเหมือนปู่ย่าตายายแม้ไม่เหมือนพ่อแม่ (ในชั้นที่สูงขึ้นจะได้เรียนว่าเป็นลักษณะด้อย)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.inherited-traits.p017
    topics: [biology.genetics.inherited-traits]
    difficulty: 5
    type: mcq
    stem: "นักเรียนต้องการรู้ว่าความสูงของต้นถั่วเขียวขึ้นกับพันธุกรรมหรือปุ๋ย จึงเพาะเมล็ดถั่วเขียวจากถุงเดียวกัน 20 ต้น แบ่งเป็นสองกลุ่ม กลุ่มละ 10 ต้น ควรออกแบบการทดลองอย่างไร"
    choices:
      - { id: a, text: "ให้ทั้งสองกลุ่มได้แสง น้ำ และดินเหมือนกัน กลุ่มหนึ่งใส่ปุ๋ย อีกกลุ่มไม่ใส่ แล้ววัดความสูงทุกต้นและหาค่าเฉลี่ย", correct: true }
      - { id: b, text: "กลุ่มหนึ่งใส่ปุ๋ยและวางกลางแดด อีกกลุ่มไม่ใส่ปุ๋ยและวางในร่ม", feedback: "เปลี่ยนทั้งปุ๋ยและแสง จะบอกไม่ได้ว่าความต่างเกิดจากปุ๋ยหรือแสง" }
      - { id: c, text: "วัดความสูงต้นเดียวในแต่ละกลุ่มก็พอ", feedback: "ความสูงแปรผันแบบต่อเนื่อง ต้นเดียวอาจไม่ใช่ตัวแทนที่ดี ต้องวัดหลายต้นแล้วหาค่าเฉลี่ย" }
      - { id: d, text: "ใช้เมล็ดถั่วต่างพันธุ์กันในแต่ละกลุ่ม", feedback: "ถ้าพันธุ์ต่างกัน จะแยกไม่ได้ว่าผลมาจากพันธุ์หรือปุ๋ย" }
    hints:
      - "การทดลองที่ดีเปลี่ยนเพียงสิ่งเดียว"
      - "ความสูงต่างกันได้แม้เป็นพันธุ์เดียวกัน จึงต้องใช้หลายต้น"
    solution: "ใช้เมล็ดจากถุงเดียวกันให้พันธุกรรมใกล้เคียงกัน ควบคุมแสง น้ำ และดินให้เหมือนกัน เปลี่ยนเพียงการใส่ปุ๋ย แล้ววัดความสูงทุกต้นและเทียบค่าเฉลี่ย จึงบอกได้ว่าปุ๋ย (สิ่งแวดล้อม) มีผลหรือไม่"
    license: CC-BY-SA-4.0
    ai_assisted: true
