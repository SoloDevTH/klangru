  difficulty: 5
  type: mcq
  stem: เพื่อนของบีมจะโพสต์ว่า "ร้านขายยาหน้าโรงเรียนขายยาปลอม คนกินตายแล้ว" ทั้งที่รู้เพียงว่ายาที่ซื้อมามีฉลากไม่ชัด ข้อใดเป็นคำแนะนำที่ถูกต้องที่สุด
  choices:
