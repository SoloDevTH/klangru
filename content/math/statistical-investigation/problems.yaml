problems:
  - id: math.stats.statistical-investigation.p001
    topics: [math.stats.statistical-investigation]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นคำถามเชิงสถิติ"
    choices:
      - { id: a, text: "นักเรียนห้อง ม.1/2 แต่ละคนมีพี่น้องกี่คน", correct: true }
      - { id: b, text: "ครูประจำชั้นของฉันชื่ออะไร", feedback: "มีคำตอบเดียว ไม่ต้องใช้ข้อมูลหลายค่า" }
      - { id: c, text: "ฉันสูงกี่เซนติเมตร", feedback: "ถามคนเดียว ได้คำตอบเดียว คำถามเชิงสถิติต้องคาดว่าคำตอบจะแตกต่างกัน" }
      - { id: d, text: "วันนี้วันที่เท่าไร", feedback: "มีคำตอบเดียวที่แน่นอน ไม่มีความแปรผัน" }
    hints:
      - "คำถามเชิงสถิติต้องใช้ข้อมูลหลายค่ามาตอบ"
      - "หาคำถามที่คาดว่าแต่ละคนจะตอบไม่เหมือนกัน"
    solution: "จำนวนพี่น้องของนักเรียนแต่ละคนในห้องแตกต่างกัน ต้องเก็บข้อมูลหลายค่ามาตอบ จึงเป็นคำถามเชิงสถิติ ข้ออื่นมีคำตอบเดียว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.statistical-investigation.p002
    topics: [math.stats.statistical-investigation]
    difficulty: 1
    type: match
    stem: "จับคู่ข้อมูลกับชนิดของข้อมูล"
    pairs:
      - { left: "ผลไม้ที่ชอบที่สุด", right: "เชิงคุณภาพ" }
      - { left: "จำนวนพี่น้อง", right: "เชิงปริมาณ แบบไม่ต่อเนื่อง (นับ)" }
      - { left: "เวลาที่ใช้วิ่ง 50 เมตร", right: "เชิงปริมาณ แบบต่อเนื่อง (วัด)" }
    hints:
      - "คำตอบเป็นคำหรือเป็นตัวเลข"
      - "ถ้าเป็นตัวเลข ได้จากการนับ (ค่าเต็ม) หรือการวัด (มีทศนิยมได้)"
    solution: "ผลไม้ที่ชอบตอบเป็นคำ → เชิงคุณภาพ จำนวนพี่น้องได้จากการนับ → ไม่ต่อเนื่อง เวลาได้จากการวัด เช่น 8.37 วินาที → ต่อเนื่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.statistical-investigation.p003
    topics: [math.stats.statistical-investigation]
    difficulty: 1
    type: order
    stem: "เรียงขั้นตอนของการสำรวจทางสถิติ"
    items:
      - "ตั้งคำถามเชิงสถิติ"
      - "เก็บข้อมูล"
      - "จัดระเบียบ นำเสนอ และหาค่าสรุป"
      - "ตีความและสื่อสารคำตอบของคำถาม"
    hints:
      - "ต้องรู้ก่อนว่าอยากรู้อะไร จึงจะรู้ว่าต้องเก็บข้อมูลอะไร"
      - "การตีความต้องทำหลังจากเห็นตารางหรือแผนภูมิแล้ว"
    solution: "ตั้งคำถาม → เก็บข้อมูล → วิเคราะห์ (จัดระเบียบ นำเสนอ หาค่าสรุป) → ตีความและสื่อสาร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.statistical-investigation.p004
    topics: [math.stats.statistical-investigation]
    difficulty: 2
    type: mcq
    stem: "นักเรียนอยากรู้ว่า ช่วง 7:00–8:00 น. มีรถผ่านหน้าโรงเรียนกี่คัน วิธีเก็บข้อมูลแบบใดเหมาะที่สุด"
    choices:
      - { id: a, text: "สังเกตและนับรถที่ผ่านในช่วงเวลานั้น", correct: true }
      - { id: b, text: "แจกแบบสอบถามให้ผู้ปกครอง", feedback: "ผู้ปกครองรู้แค่รถของตัวเอง ไม่รู้จำนวนรถทั้งหมดที่ผ่าน" }
      - { id: c, text: "ทำการทดลองโดยปิดถนนครึ่งหนึ่ง", feedback: "การทดลองใช้เมื่ออยากรู้ผลของการเปลี่ยนแปลง ข้อนี้แค่อยากนับสิ่งที่เกิดขึ้นตามปกติ" }
    hints:
      - "ข้อมูลที่ต้องการเป็นสิ่งที่เห็นและนับได้โดยตรง"
      - "การสำรวจเหมาะกับความชอบหรือความเห็น การทดลองเหมาะกับการหาผลของการเปลี่ยนแปลง"
    solution: "จำนวนรถเป็นสิ่งที่เห็นได้โดยตรง วิธีที่เหมาะคือยืนสังเกตและขีดรอยคะแนนนับรถในช่วงเวลานั้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.statistical-investigation.p005
    topics: [math.stats.statistical-investigation]
    difficulty: 2
    type: mcq
    stem: "ต้นอยากรู้ว่านักเรียนทั้งโรงเรียนชอบกีฬาอะไรมากที่สุด จึงถามเฉพาะนักฟุตบอลของโรงเรียน 30 คน วิธีนี้มีปัญหาอะไร"
    choices:
      - { id: a, text: "กลุ่มตัวอย่างไม่เป็นตัวแทน ผลจะเอียงไปทางฟุตบอล", correct: true }
      - { id: b, text: "30 คนมากเกินไป", feedback: "จำนวนไม่ใช่ปัญหาหลัก ต่อให้ถามนักฟุตบอล 300 คน ผลก็ยังเอียงไปทางฟุตบอล" }
      - { id: c, text: "ไม่มีปัญหา เพราะเป็นนักเรียนของโรงเรียนเดียวกัน", feedback: "เป็นนักเรียนจริง แต่เป็นกลุ่มที่ชอบฟุตบอลอยู่แล้ว ไม่ใช่ตัวแทนของทุกคน" }
    hints:
      - "คนกลุ่มนี้มีแนวโน้มจะตอบว่าอะไร"
      - "กลุ่มตัวอย่างที่ดีต้องคล้ายกับทั้งโรงเรียน"
    solution: "นักฟุตบอลส่วนใหญ่ชอบฟุตบอลอยู่แล้ว ผลจึงลำเอียง ควรสุ่มนักเรียนจากทุกชั้นและทุกห้องแทน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.statistical-investigation.p006
    topics: [math.stats.statistical-investigation]
    difficulty: 2
    type: numeric
    stem: "สำรวจวิธีมาโรงเรียนของนักเรียนกลุ่มหนึ่ง ได้ผลว่า เดิน 12 คน ปั่นจักรยาน 8 คน ผู้ปกครองขี่รถจักรยานยนต์มาส่ง 15 คน รถรับส่งนักเรียน 5 คน นักเรียนที่ผู้ปกครองขี่รถจักรยานยนต์มาส่งคิดเป็นร้อยละเท่าใดของกลุ่มนี้ (ตอบเป็นร้อยละ)"
    answer: { value: 37.5, tolerance: 0.4, unit: "%" }
    hints:
      - "หาจำนวนนักเรียนทั้งหมดก่อน"
      - "ร้อยละ = จำนวนในกลุ่ม ÷ จำนวนทั้งหมด × 100"
    misconceptions:
      - { match: 15, feedback: "นั่นคือจำนวนคน ยังต้องเทียบกับทั้งหมดแล้วคูณ 100" }
      - { match: 0.375, feedback: "นั่นคือสัดส่วน ต้องคูณ 100 เพื่อเป็นร้อยละ" }
    solution: "ทั้งหมด $12 + 8 + 15 + 5 = 40$ คน ร้อยละ $= \\tfrac{15}{40} \\times 100 = 37.5\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.statistical-investigation.p007
    topics: [math.stats.statistical-investigation]
    difficulty: 2
    type: mcq
    stem: "ต้องการนำเสนอผลการสำรวจในข้อที่แล้ว (วิธีมาโรงเรียน 4 แบบ) ควรใช้แผนภูมิแบบใด"
    choices:
      - { id: a, text: "แผนภูมิแท่ง", correct: true }
      - { id: b, text: "กราฟเส้น", feedback: "กราฟเส้นใช้กับข้อมูลที่เปลี่ยนตามเวลา วิธีมาโรงเรียนไม่ได้เรียงตามเวลา จึงไม่ควรลากเส้นเชื่อม" }
      - { id: c, text: "ฮิสโทแกรม", feedback: "ฮิสโทแกรมใช้กับข้อมูลเชิงปริมาณต่อเนื่องที่แบ่งเป็นช่วง วิธีมาโรงเรียนเป็นข้อมูลเชิงคุณภาพ" }
      - { id: d, text: "แผนภาพการกระจาย", feedback: "แผนภาพการกระจายใช้กับข้อมูลเชิงปริมาณสองตัวแปร" }
    hints:
      - "วิธีมาโรงเรียนเป็นข้อมูลชนิดใด"
      - "ข้อมูลเชิงคุณภาพนำเสนอด้วยแผนภูมิที่แยกเป็นกลุ่ม"
    solution: "วิธีมาโรงเรียนเป็นข้อมูลเชิงคุณภาพ 4 กลุ่ม แผนภูมิแท่ง (หรือแผนภูมิรูปภาพ แผนภูมิวงกลม) เปรียบเทียบความถี่ของแต่ละกลุ่มได้ชัด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.statistical-investigation.p008
    topics: [math.stats.statistical-investigation]
    difficulty: 2
    type: mcq
    stem: "สภานักเรียนอยากรู้ปริมาณฝนรายเดือนของจังหวัดในปีที่ผ่านมา เพื่อวางแผนกีฬาสี วิธีใดเหมาะที่สุด"
    choices:
      - { id: a, text: "ใช้ข้อมูลที่กรมอุตุนิยมวิทยาเก็บไว้แล้ว", correct: true }
      - { id: b, text: "ถามเพื่อน ๆ ว่าเดือนไหนฝนตกมาก", feedback: "ความจำของคนไม่แม่นยำ และไม่ได้บอกปริมาณฝนเป็นตัวเลข" }
      - { id: c, text: "ตั้งถ้วยรองน้ำฝนที่โรงเรียนตั้งแต่วันนี้", feedback: "ได้ข้อมูลของปีนี้ ไม่ใช่ปีที่ผ่านมา และต้องรอทั้งปี" }
    hints:
      - "ข้อมูลนี้เป็นเรื่องที่ผ่านไปแล้ว"
      - "มีหน่วยงานใดวัดและเก็บข้อมูลนี้ไว้ทุกวัน"
    solution: "ปริมาณฝนของปีที่แล้วเก็บย้อนหลังเองไม่ได้ แต่กรมอุตุนิยมวิทยาวัดไว้แล้ว ใช้ข้อมูลที่มีอยู่จึงเหมาะที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.statistical-investigation.p009
    topics: [math.stats.statistical-investigation]
    difficulty: 3
    type: mcq
    stem: "ข้อใดเป็นคำถามในแบบสอบถามที่ยุติธรรมที่สุด"
    choices:
      - { id: a, text: "ปกติคุณดื่มนมรสใดบ่อยที่สุด (จืด หวาน ช็อกโกแลต สตรอว์เบอร์รี อื่น ๆ ไม่ดื่มนม)", correct: true }
      - { id: b, text: "คุณชอบนมรสจืดใช่ไหม เพราะดีต่อสุขภาพ", feedback: "คำถามชี้นำ บอกเหตุผลให้ผู้ตอบเลือกนมจืด" }
      - { id: c, text: "คุณชอบนมรสจืดหรือรสหวาน", feedback: "ตัวเลือกไม่ครอบคลุม คนที่ชอบรสช็อกโกแลตหรือไม่ดื่มนมตอบไม่ได้" }
      - { id: d, text: "คุณดื่มนมมากแค่ไหน", feedback: "\"มากแค่ไหน\" คลุมเครือ แต่ละคนเข้าใจไม่เหมือนกัน ควรถามเป็นจำนวนกล่องต่อวัน" }
    hints:
      - "คำถามที่ดีไม่ชี้นำคำตอบ"
      - "ตัวเลือกต้องครอบคลุมทุกคน และความหมายชัด"
    solution: "ข้อแรกไม่ชี้นำ ตัวเลือกครอบคลุม มีทั้ง อื่น ๆ และ ไม่ดื่มนม ข้ออื่นชี้นำ ตัวเลือกไม่ครบ หรือคลุมเครือ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.statistical-investigation.p010
    topics: [math.stats.statistical-investigation]
    difficulty: 3
    type: numeric
    stem: "ครูสำรวจจำนวนหนังสือที่นักเรียน ป.6 จำนวน 20 คนอ่านในเดือนที่แล้ว ได้แผนภาพจุดดังภาพ มัธยฐานของข้อมูลคือกี่เล่ม"
    figure: { src: dotplot-books.svg, alt: "แผนภาพจุด แกนนอนคือจำนวนหนังสือ 0 ถึง 10 เล่ม จำนวนจุด: 0 เล่ม 2 คน, 1 เล่ม 4 คน, 2 เล่ม 6 คน, 3 เล่ม 4 คน, 4 เล่ม 2 คน, 5 เล่ม 1 คน, 9 เล่ม 1 คน รวม 20 คน" }
    answer: { value: 2, unit: เล่ม }
    hints:
      - "ข้อมูล 20 ค่า มัธยฐานคือค่าเฉลี่ยของค่าที่ 10 และ 11 เมื่อเรียงจากน้อยไปมาก"
      - "นับสะสมจากซ้าย: 0 เล่ม 2 คน, ถึง 1 เล่ม 6 คน, ถึง 2 เล่ม 12 คน"
    misconceptions:
      - { match: 2.5, feedback: "นั่นคือค่าเฉลี่ยเลขคณิต ($50 \\div 20$) ข้อนี้ถามมัธยฐาน คือค่าตรงกลาง" }
      - { match: 4.5, feedback: "นั่นคือกึ่งกลางระหว่างค่าน้อยสุดกับมากสุด มัธยฐานต้องหาจากการเรียงข้อมูลทุกค่า" }
    solution: "เรียงข้อมูล 20 ค่า ค่าที่ 1–2 เป็น 0 ค่าที่ 3–6 เป็น 1 ค่าที่ 7–12 เป็น 2 ค่าที่ 10 และ 11 จึงเป็น 2 ทั้งคู่ มัธยฐาน $= 2$ เล่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.statistical-investigation.p011
    topics: [math.stats.statistical-investigation]
    difficulty: 3
    type: mcq
    stem: "จากแผนภาพจุดจำนวนหนังสือในข้อที่แล้ว ข้อสรุปใดมีข้อมูลสนับสนุน"
    figure: { src: dotplot-books.svg, alt: "แผนภาพจุด แกนนอนคือจำนวนหนังสือ 0 ถึง 10 เล่ม จำนวนจุด: 0 เล่ม 2 คน, 1 เล่ม 4 คน, 2 เล่ม 6 คน, 3 เล่ม 4 คน, 4 เล่ม 2 คน, 5 เล่ม 1 คน, 9 เล่ม 1 คน รวม 20 คน" }
    choices:
      - { id: a, text: "นักเรียนส่วนใหญ่อ่าน 1–3 เล่ม และมีหนึ่งคนอ่าน 9 เล่ม ซึ่งอยู่ห่างจากกลุ่มมาก", correct: true }
      - { id: b, text: "นักเรียน ป.6 ทั่วประเทศอ่านหนังสือเดือนละ 2 เล่ม", feedback: "ข้อมูลมาจากนักเรียน 20 คนในห้องเดียว สรุปไปถึงทั้งประเทศไม่ได้" }
      - { id: c, text: "นักเรียนทุกคนอ่านหนังสืออย่างน้อย 1 เล่ม", feedback: "มีจุด 2 จุดที่ 0 เล่ม แปลว่ามี 2 คนที่ไม่ได้อ่านเลย" }
      - { id: d, text: "นักเรียนส่วนใหญ่อ่านหนังสือ 9 เล่ม", feedback: "9 เล่มมีแค่ 1 คน เป็นค่าที่อยู่ห่างจากกลุ่ม" }
    hints:
      - "ดูว่าจุดส่วนใหญ่กองอยู่ตรงไหน"
      - "ข้อสรุปต้องไม่เกินกลุ่มที่สำรวจ"
    solution: "จุด 14 จาก 20 จุดอยู่ที่ 1–3 เล่ม และมีหนึ่งจุดที่ 9 เล่มอยู่ห่างจากกลุ่ม ข้อสรุปแรกจึงตรงกับข้อมูล ข้ออื่นสรุปเกินหรือขัดกับข้อมูล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.statistical-investigation.p012
    topics: [math.stats.statistical-investigation]
    difficulty: 3
    type: mcq
    stem: "ฝ้ายตั้งคำถามว่า \"นักเรียนใช้โทรศัพท์มากไหม\" คำถามใดเป็นการปรับให้ดีขึ้นมากที่สุด"
    choices:
      - { id: a, text: "นักเรียน ม.1 ในโรงเรียนของเราใช้โทรศัพท์วันละกี่ชั่วโมงในวันเรียน", correct: true }
      - { id: b, text: "ฝ้ายใช้โทรศัพท์วันละกี่ชั่วโมง", feedback: "ถามคนเดียว ได้คำตอบเดียว ไม่ใช่คำถามเชิงสถิติแล้ว" }
      - { id: c, text: "นักเรียนติดโทรศัพท์ใช่ไหม", feedback: "ยังคลุมเครือ และชี้นำให้ตอบว่าใช่" }
    hints:
