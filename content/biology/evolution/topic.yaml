id: biology.evolution.evolution
subject: biology
title: { th: วิวัฒนาการ, en: "Evolution" }
summary: หลักฐานของวิวัฒนาการ แนวคิดของลามาร์กและทฤษฎีของดาร์วิน การคัดเลือกโดยธรรมชาติ 3 แบบ หลักฮาร์ดี-ไวน์เบิร์ก ปัจจัยที่เปลี่ยนความถี่แอลลีล การเกิดสปีชีส์ใหม่ และการสูญพันธุ์
difficulty: 6.5
minutes: 55
prerequisites: [biology.genetics.mendelian]
encompasses:
  - { id: biology.genetics.mendelian, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: โครงสร้างกำเนิดเดียวกันของขาหน้า
    src: homologous-forelimbs.svg
    alt: "แผนภาพกระดูกขาหน้าของคน แมว วาฬ และค้างคาวเรียงกัน แต่ละชนิดมีกระดูกชุดเดียวกันระบายสีเหมือนกัน กระดูกต้นแขน 1 ชิ้น (สีแดง) กระดูกแขนท่อนล่าง 2 ชิ้น (สีฟ้า) กระดูกข้อมือ (สีเหลือง) และกระดูกนิ้ว 5 นิ้ว (สีเขียว) สัดส่วนต่างกัน วาฬมีกระดูกต้นแขนและแขนท่อนล่างสั้นแต่นิ้วยาวเป็นครีบ ค้างคาวมีแขนท่อนล่างยาวและนิ้ว 4 นิ้วยาวมากกางออกเป็นโครงปีก คนและแมวมีนิ้วสั้นกว่า"
    caption: "กระดูกชุดเดียวกันแต่ใช้งานต่างกัน แสดงว่ามีบรรพบุรุษร่วมกัน (วาดโดยทีมคลังรู้ แผนภาพอย่างง่าย ไม่ได้ย่อส่วนตามจริง)"
  - type: figure
    title: การคัดเลือกโดยธรรมชาติ 3 แบบ
    src: selection-types.svg
    alt: "กราฟการกระจายของลักษณะ เช่น ขนาดลำตัว 3 กราฟ เส้นประสีเทาคือประชากรเดิมเป็นระฆังคว่ำ เส้นทึบสีน้ำเงินคือหลังการคัดเลือกหลายรุ่น แบบมีทิศทาง ระฆังทั้งใบเลื่อนไปทางขวา แบบเสถียร ระฆังอยู่ตำแหน่งเดิมแต่แคบและสูงขึ้น แบบแยกทาง เส้นกลายเป็นสองยอดที่ปลายทั้งสองข้าง ตรงกลางลดลง"
    caption: "แบบของการคัดเลือกขึ้นกับว่าลักษณะค่าใดได้เปรียบ (วาดโดยทีมคลังรู้)"
  - type: figure
    title: ความถี่จีโนไทป์ตามหลักฮาร์ดี-ไวน์เบิร์ก
    src: hardy-weinberg.svg
    alt: "สี่เหลี่ยมจัตุรัสแบ่งตามความถี่แอลลีล ด้านบนคือเซลล์สืบพันธุ์จากพ่อ A มีความถี่ p = 0.7 และ a มีความถี่ q = 0.3 ด้านซ้ายคือเซลล์สืบพันธุ์จากแม่แบ่งแบบเดียวกัน ช่อง AA มีพื้นที่ 0.49 ช่อง Aa สองช่องช่องละ 0.21 ช่อง aa มีพื้นที่ 0.09 ด้านล่างสรุปว่า p² = 0.49, 2pq = 0.42, q² = 0.09 รวมเท่ากับ 1"
    caption: "พื้นที่ของแต่ละช่องคือความถี่ของจีโนไทป์ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ประชากรอยู่ในสมดุลหรือไม่
    problem: "ประชากรหนึ่ง 1,000 ตัว มีจีโนไทป์ AA 500 ตัว Aa 200 ตัว aa 300 ตัว ประชากรนี้อยู่ในสมดุลฮาร์ดี-ไวน์เบิร์กหรือไม่"
    steps:
      - text: "นับแอลลีล A: $2(500) + 200 = 1{,}200$ จากทั้งหมด $2{,}000$ แอลลีล $p = 0.6$ และ $q = 0.4$"
        why: "ตัวที่เป็น AA มีแอลลีล A สองแอลลีล ตัวที่เป็น Aa มีหนึ่งแอลลีล"
      - text: "ถ้าอยู่ในสมดุล คาดว่าจะได้ AA $= 0.36 \\times 1{,}000 = 360$ Aa $= 0.48 \\times 1{,}000 = 480$ aa $= 0.16 \\times 1{,}000 = 160$"
      - text: "ค่าจริงมี Aa เพียง 200 น้อยกว่าคาดมาก และมีฮอมอไซกัสมากเกิน"
    answer: "ไม่อยู่ในสมดุล ฮอมอไซกัสมากเกินมักบอกว่ามีการผสมพันธุ์แบบไม่สุ่ม เช่น ผสมในเครือญาติ หรือมีการคัดเลือก"
  - { type: check, problem: biology.evolution.evolution.p005, prompt: "ร้อยละ 16 คือ q² ไม่ใช่ q" }
  - { type: check, problem: biology.evolution.evolution.p004, prompt: "ดาร์วินเริ่มจากความแปรผันที่มีอยู่ก่อนแล้ว" }
  - type: simulation
    title: การคัดเลือกโดยธรรมชาติ (PhET Natural Selection)
    url: https://phet.colorado.edu/en/simulations/natural-selection
    provider: phet
    note: เพิ่มมิวเทชันขนสีน้ำตาลให้กระต่าย แล้วเปิดหมาป่าในสภาพแวดล้อมที่เป็นทะเลทราย สังเกตสัดส่วนของกระต่ายแต่ละสีในรุ่นต่อ ๆ ไป
glossary:
  - { term: วิวัฒนาการ, definition: "การเปลี่ยนแปลงความถี่ของแอลลีลในประชากรจากรุ่นสู่รุ่น" }
  - { term: โครงสร้างกำเนิดเดียวกัน, definition: "โครงสร้างที่มีกำเนิดและแบบแผนเดียวกันแต่อาจทำหน้าที่ต่างกัน เช่น ขาหน้าของคนกับปีกค้างคาว" }
  - { term: การคัดเลือกโดยธรรมชาติ, definition: "กระบวนการที่ตัวที่มีลักษณะเหมาะกับสิ่งแวดล้อมรอดและสืบพันธุ์ได้มากกว่า ลักษณะนั้นจึงพบมากขึ้นในรุ่นต่อไป" }
  - { term: ภาวะสมดุลฮาร์ดี-ไวน์เบิร์ก, definition: "ภาวะที่ความถี่แอลลีลและจีโนไทป์คงที่จากรุ่นสู่รุ่นเมื่อไม่มีปัจจัยใดมาเปลี่ยน" }
  - { term: การเปลี่ยนแปลงแบบสุ่มทางพันธุกรรม, definition: "การเปลี่ยนความถี่แอลลีลโดยบังเอิญ เกิดชัดในประชากรขนาดเล็ก" }
  - { term: การแยกทางการสืบพันธุ์, definition: "กลไกที่ทำให้สองประชากรผสมพันธุ์กันไม่ได้หรือได้ลูกที่เป็นหมัน" }
  - { term: สปีชีส์, definition: "กลุ่มสิ่งมีชีวิตที่ผสมพันธุ์กันในธรรมชาติและได้ลูกที่ไม่เป็นหมัน" }
flashcards:
  - { front: "หลักฐานของวิวัฒนาการ 5 ด้าน", back: "ซากดึกดำบรรพ์ กายวิภาคเปรียบเทียบ คัพภะวิทยา ชีววิทยาโมเลกุล ชีวภูมิศาสตร์" }
  - { front: "ลามาร์กกับดาร์วินต่างกันอย่างไร", back: "ลามาร์ก: ลักษณะที่ได้มาระหว่างชีวิตถ่ายทอดได้ ดาร์วิน: ความแปรผันที่มีอยู่ถูกคัดเลือก" }
  - { front: "สมการฮาร์ดี-ไวน์เบิร์ก", back: "p + q = 1 และ p² + 2pq + q² = 1" }
  - { front: "เงื่อนไขของสมดุลฮาร์ดี-ไวน์เบิร์ก", back: "ประชากรใหญ่ ผสมแบบสุ่ม ไม่มีมิวเทชัน ไม่มีการอพยพ ไม่มีการคัดเลือก" }
  - { front: "ล่อเป็นตัวอย่างของอะไร", back: "การแยกทางการสืบพันธุ์หลังการปฏิสนธิ (ลูกผสมเป็นหมัน)" }
