problems:
- id: health.safety.cpr-full.p001
  topics:
  - health.safety.cpr-full
  difficulty: 1
  type: mcq
  stem: แนวทาง AHA ปี 2025 ให้กดหน้าอกด้วยอัตราเท่าใด
  choices:
  - id: a
    text: 100–120 ครั้งต่อนาที
    correct: true
  - id: b
    text: 60–80 ครั้งต่อนาที
    feedback: ช้าเกินไป เลือดไปเลี้ยงสมองไม่พอ
  - id: c
    text: 150–180 ครั้งต่อนาที
    feedback: เร็วเกินไป หน้าอกคืนตัวไม่ทันและกดได้ไม่ลึก
  - id: d
    text: ตามจังหวะหายใจของผู้ช่วย
    feedback: ต้องกดเร็วและสม่ำเสมอตามอัตราที่กำหนด
  hints:
  - เร็วกว่าชีพจรขณะพักของคนทั่วไป
  - ราวสองครั้งต่อวินาที
  solution: กดอัตรา 100–120 ครั้งต่อนาที เท่ากันทุกวัย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.cpr-full.p002
  topics:
  - health.safety.cpr-full
  difficulty: 1
  type: mcq
  stem: ในผู้ใหญ่ ควรกดหน้าอกลึกเท่าใด
  choices:
  - id: a
    text: 5–6 เซนติเมตร
    correct: true
  - id: b
    text: 1–2 เซนติเมตร
    feedback: ตื้นเกินไป หัวใจถูกบีบไม่พอ
  - id: c
    text: ประมาณ 4 เซนติเมตร
    feedback: เป็นความลึกโดยประมาณสำหรับทารก
  - id: d
    text: ลึกที่สุดเท่าที่ทำได้
    feedback: ลึกเกิน 6 ซม. เพิ่มโอกาสบาดเจ็บโดยไม่ได้ประโยชน์เพิ่ม
  hints:
  - มีทั้งค่าต่ำสุดและค่าสูงสุด
  - ประมาณความกว้างของนิ้วโป้งสองนิ้ว
  solution: ผู้ใหญ่กดลึก 5–6 เซนติเมตร และปล่อยให้หน้าอกคืนตัวสุดทุกครั้ง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.cpr-full.p003
  topics:
  - health.safety.cpr-full
  difficulty: 2
  type: order
  stem: เรียงห่วงโซ่การรอดชีวิตเมื่อหัวใจหยุดเต้นนอกโรงพยาบาล
  items:
  - รู้ว่าเป็นเหตุฉุกเฉินและโทร 1669
  - เริ่ม CPR ทันที
  - ใช้เครื่อง AED
  - ทีมแพทย์ฉุกเฉินให้การรักษาขั้นสูง
  - ดูแลในโรงพยาบาลและฟื้นฟู
  hints:
  - สามห่วงแรกทำได้โดยคนในที่เกิดเหตุ
  - AED มาหลังเริ่ม CPR เพราะต้องมีคนไปนำมา
  solution: โทร 1669 → CPR → AED → ทีมแพทย์ฉุกเฉิน → โรงพยาบาลและฟื้นฟู
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.cpr-full.p004
  topics:
  - health.safety.cpr-full
  difficulty: 2
  type: mcq
  stem: ตามแนวทาง AHA ปี 2025 ผู้ช่วยคนเดียวควรกดหน้าอกทารกด้วยวิธีใด
  choices:
  - id: a
    text: นิ้วโป้งสองข้างโอบรอบอก หรือส้นมือข้างเดียว
    correct: true
  - id: b
    text: สองนิ้ว (นิ้วชี้กับนิ้วกลาง)
    feedback: แนวทางปี 2025 ยกเลิกวิธีนี้เพราะมักกดได้ไม่ลึกพอ
  - id: c
    text: สองมือแบบผู้ใหญ่
    feedback: แรงมากเกินไปสำหรับทารก
  - id: d
    text: นิ้วเดียว
    feedback: ได้ความลึกไม่พอ
  hints:
  - มีการเปลี่ยนแปลงจากแนวทางเดิมในเรื่องนี้
  - ปัญหาของวิธีเดิมคือกดได้ไม่ลึก
  solution: แนวทาง AHA ปี 2025 ยกเลิกการกดด้วยสองนิ้ว ให้ใช้นิ้วโป้งสองข้างโอบรอบอกหรือส้นมือข้างเดียว กดลึกอย่างน้อย 1 ใน 3 ของความหนาหน้าอก ประมาณ 4 เซนติเมตร
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.cpr-full.p005
  topics:
  - health.safety.cpr-full
  difficulty: 2
  type: numeric
  stem: ผู้ช่วยคนเดียวทำ CPR ผู้ใหญ่ด้วยอัตรา 30:2 ครบ 5 รอบ กดหน้าอกไปทั้งหมดกี่ครั้ง
  answer:
    value: 150
    unit: ครั้ง
  misconceptions:
  - match: 160
    feedback: นับการเป่าลมรวมเข้าไปด้วย คำถามถามเฉพาะการกด
  - match: 75
    feedback: นี่คือ 15:2 ซึ่งใช้เมื่อบุคลากรทางการแพทย์สองคนช่วยเด็ก
  hints:
  - หนึ่งรอบกด 30 ครั้งและเป่า 2 ครั้ง
  - นับเฉพาะการกด
  solution: $30 \times 5 = 150$ ครั้ง (และเป่าลม $2 \times 5 = 10$ ครั้ง)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.cpr-full.p006
  topics:
  - health.safety.cpr-full
  difficulty: 2
  type: match
  stem: จับคู่ผู้ป่วยกับความลึกในการกดหน้าอกโดยประมาณ
  pairs:
  - left: ผู้ใหญ่
    right: 5–6 ซม.
  - left: เด็กอายุ 6 ปี
    right: ประมาณ 5 ซม. (อย่างน้อย 1 ใน 3 ของความหนาหน้าอก)
  - left: ทารกอายุ 4 เดือน
    right: ประมาณ 4 ซม. (อย่างน้อย 1 ใน 3 ของความหนาหน้าอก)
  hints:
  - เด็กและทารกใช้หลัก 1 ใน 3 ของความหนาหน้าอก
  - ทารกหน้าอกบางที่สุด
  solution: ผู้ใหญ่ 5–6 ซม. เด็กประมาณ 5 ซม. ทารกประมาณ 4 ซม. โดยเด็กและทารกกดอย่างน้อย 1 ใน 3 ของความหนาหน้าอก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.cpr-full.p007
  topics:
  - health.safety.cpr-full
  difficulty: 3
  type: numeric
  stem: ถ้ากดหน้าอกต่อเนื่องด้วยอัตรา 110 ครั้งต่อนาทีเป็นเวลา 2 นาที (ก่อนสลับคนกด) จะกดได้กี่ครั้ง
  answer:
    value: 220
    unit: ครั้ง
  misconceptions:
  - match: 55
    feedback: หารแทนที่จะคูณ
  - match: 112
    feedback: ต้องคูณกับเวลา ไม่ใช่บวก
  hints:
  - อัตราคือจำนวนครั้งต่อ 1 นาที
  - 110 × 2
  solution: $110 \times 2 = 220$ ครั้ง การกดเร็วและแรงต่อเนื่องเหนื่อยมาก จึงควรสลับคนกดราวทุก 2 นาที
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.cpr-full.p008
  topics:
  - health.safety.cpr-full
  difficulty: 3
  type: numeric
  stem: หน้าอกของเด็กคนหนึ่งหนา (จากหน้าไปหลัง) ประมาณ 15 ซม. ควรกดลึกอย่างน้อยกี่เซนติเมตร
  answer:
    value: 5.0
    unit: ซม.
  misconceptions:
  - match: 7.5
    feedback: ใช้ครึ่งหนึ่งซึ่งลึกเกินไป ต้องใช้ 1 ใน 3
  - match: 3
    feedback: หารด้วย 5 ไม่ถูก ต้องหารด้วย 3
  hints:
  - เด็กกดอย่างน้อย 1 ใน 3 ของความหนาหน้าอก
  - 15 ÷ 3
  solution: $15 \div 3 = 5$ ซม. ตรงกับค่าประมาณ 5 ซม. สำหรับเด็ก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.cpr-full.p009
  topics:
  - health.safety.cpr-full
  difficulty: 3
  type: numeric
  stem: จากกราฟบันทึกของหุ่นฝึก แพรกดได้ความลึกอยู่ในช่วง 5–6 ซม. (รวมค่า 5.0 และ 6.0) กี่ครั้งจาก 12 ครั้ง
  answer:
    value: 7
    unit: ครั้ง
  misconceptions:
  - match: 9
    feedback: นับค่าที่ลึกเกิน 6 ซม. รวมเข้าไปด้วย
  - match: 5
    feedback: อย่าลืมค่า 5.0 ซึ่งอยู่ในช่วงพอดี
  hints:
  - นับแท่งที่ปลายอยู่ในแถบเขียว
  - ค่าที่ต่ำกว่า 5 คือ 4.2, 4.6, 4.8 และที่เกิน 6 คือ 6.4, 6.2
  solution: ในช่วงมี 7 ครั้ง (5.1, 5.4, 5.8, 5.2, 5.5, 5.9, 5.0) ตื้นเกิน 3 ครั้ง และลึกเกิน 2 ครั้ง
  figure: &id001
    src: manikin-log.svg
    alt: กราฟแท่งความลึกการกดหน้าอก 12 ครั้งของแพรจากหุ่นฝึก ข้อมูลสมมติ มีแถบเขียวระหว่าง 5 ถึง 6 เซนติเมตร ความลึกครั้งที่ 1 ถึง 12 คือ 4.2, 5.1, 5.4, 4.6, 5.8, 6.4, 5.2, 5.5, 4.8, 5.9, 5.0, 6.2 เซนติเมตร
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.cpr-full.p010
  topics:
  - health.safety.cpr-full
  difficulty: 3
  type: mcq
  stem: ที่หาดบางแสน มีคนช่วยเด็กชายอายุ 8 ปีขึ้นจากน้ำ เด็กไม่หายใจ ผู้ใหญ่คนหนึ่งจะอุ้มเด็กพาดบ่าแล้ววิ่งเพื่อเอาน้ำออก ข้อใดถูกต้อง
  choices:
  - id: a
    text: ห้ามอุ้มพาดบ่า ให้วางบนพื้นแข็ง โทร 1669 และเริ่ม CPR โดยผู้ที่ฝึกแล้วช่วยหายใจร่วมด้วย
    correct: true
  - id: b
    text: อุ้มพาดบ่าก่อน 2–3 นาทีให้น้ำออกหมด แล้วค่อยกด
    feedback: ไม่ช่วยและเสียเวลาที่สมองขาดออกซิเจน
  - id: c
    text: จับห้อยหัวลงแล้วตบหลัง
    feedback: ไม่ช่วยเอาน้ำออกและเสียเวลา
  - id: d
    text: รอรถพยาบาลมาก่อนเพราะเป็นเด็ก
    feedback: ต้องเริ่ม CPR ทันที ทุกนาทีที่รอลดโอกาสรอด
  hints:
  - ปัญหาหลักของคนจมน้ำคือขาดออกซิเจน
  - ความเชื่อเรื่องอุ้มพาดบ่ายังพบบ่อย
  solution: คนจมน้ำขาดออกซิเจน ต้องเริ่ม CPR ทันที และการช่วยหายใจสำคัญมาก การอุ้มพาดบ่าหรือห้อยหัวไม่ช่วยและทำให้เสียเวลา
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.cpr-full.p011
  topics:
  - health.safety.cpr-full
  difficulty: 4
  type: order
  stem: เรียงขั้นตอนการช่วยผู้ใหญ่ที่ล้มลงหมดสติตามบทเรียน
  items:
  - ดูความปลอดภัยของที่เกิดเหตุ
  - ตบไหล่และเรียกดัง ๆ
  - โทร 1669 เปิดลำโพง และให้คนไปหา AED
  - ดูการหายใจไม่เกิน 10 วินาที
  - กดหน้าอก 30 ครั้ง
  - ช่วยหายใจ 2 ครั้งถ้าฝึกมาแล้ว
  hints:
  - ความปลอดภัยของผู้ช่วยมาก่อนเสมอ
  - เรียกความช่วยเหลือก่อนเริ่มกด
  solution: ปลอดภัย → ปลุกเรียก → โทร 1669 และหา AED → ดูการหายใจ → กด 30 ครั้ง → ช่วยหายใจ 2 ครั้ง แล้ววนต่อ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.cpr-full.p012
  topics:
  - health.safety.cpr-full
  difficulty: 4
  type: mcq
  stem: AED พูดว่า "ช็อกแล้ว" หลังจากกดปุ่มช็อก สิ่งที่ต้องทำต่อทันทีคืออะไร
  choices:
  - id: a
    text: กดหน้าอกต่อทันทีราว 2 นาทีจนเครื่องสั่งให้หยุดวิเคราะห์
    correct: true
  - id: b
    text: คลำชีพจรนาน ๆ ก่อน
    feedback: ผู้ช่วยทั่วไปไม่ต้องคลำชีพจร และการหยุดนานลดโอกาสรอด
  - id: c
    text: ถอดแผ่นออก
    feedback: ต้องติดแผ่นไว้ให้เครื่องวิเคราะห์รอบต่อไป
  - id: d
    text: รอดูว่าผู้ป่วยตื่นไหม 5 นาที
    feedback: หัวใจมักยังสูบฉีดได้ไม่ดีทันทีหลังช็อก ต้องกดต่อ
  hints:
  - หยุดกดให้น้อยที่สุด
  - เครื่องจะวิเคราะห์ใหม่ทุกราว 2 นาที
  solution: หลังช็อกให้กดหน้าอกต่อทันทีราว 2 นาที แล้วทำตามเสียงสั่งของเครื่อง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.cpr-full.p013
  topics:
  - health.safety.cpr-full
  difficulty: 4
  type: mcq
  stem: ทารกอายุ 10 เดือนหัวใจหยุดเต้น มีเครื่อง AED แต่มีเฉพาะแผ่นผู้ใหญ่ ควรทำอย่างไร
  choices:
  - id: a
    text: ใช้แผ่นผู้ใหญ่ได้ ติดแผ่นหนึ่งกลางหน้าอก อีกแผ่นกลางหลัง ไม่ให้แผ่นชนกัน
    correct: true
  - id: b
    text: ห้ามใช้ AED กับทารกเด็ดขาด
    feedback: AED ใช้กับทารกได้ แนวทางให้ใช้แผ่นเด็กถ้ามี ถ้าไม่มีใช้แผ่นผู้ใหญ่
  - id: c
    text: ตัดแผ่นผู้ใหญ่ให้เล็กลง
    feedback: ทำให้แผ่นเสียหายและใช้งานไม่ได้
  - id: d
    text: ติดแผ่นทั้งสองบนหน้าอกซ้อนกัน
    feedback: แผ่นต้องไม่สัมผัสกัน
  hints:
  - หน้าอกทารกเล็ก แผ่นผู้ใหญ่จะชนกันถ้าติดด้านหน้าทั้งคู่
  - ด้านหลังของทารกก็ติดแผ่นได้
  solution: ใช้แผ่นหรือตัวลดพลังงานสำหรับเด็กถ้ามี ถ้าไม่มีใช้แผ่นผู้ใหญ่ได้ โดยติดหน้า–หลังไม่ให้แผ่นชนกัน และกดหน้าอกต่อระหว่างเตรียมเครื่อง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.cpr-full.p014
  topics:
  - health.safety.cpr-full
  difficulty: 4
  type: numeric
  stem: ถ้ากดหน้าอกด้วยอัตรา 120 ครั้งต่อนาที การกด 30 ครั้งใช้เวลากี่วินาที
  answer:
    value: 15.0
    unit: วินาที
  misconceptions:
  - match: 4
    feedback: หาร 120 ด้วย 30 ไม่ถูก ต้องหาเวลาของ 30 ครั้ง
  - match: 0.25
    feedback: นี่คือหน่วยนาที ต้องแปลงเป็นวินาที
  hints:
  - 120 ครั้งต่อ 60 วินาที
  - เวลา = 30 ÷ 120 × 60
  solution: $\frac{30}{120} \times 60 = 15$ วินาที ที่อัตรา 100 ครั้งต่อนาทีจะใช้ 18 วินาที
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.cpr-full.p015
  topics:
  - health.safety.cpr-full
  difficulty: 5
  type: mcq
  stem: ในสนามฟุตซอล ครูพละล้มหมดสติ ไม่หายใจ มีเราที่ผ่านการอบรม CPR และเพื่อนอีกสองคนที่ไม่เคยฝึก การแบ่งหน้าที่ใดดีที่สุด
  choices:
  - id: a
