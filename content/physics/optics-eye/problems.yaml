problems:
  - id: physics.light.optics-eye.p001
    topics: [physics.light.optics-eye]
    difficulty: 1
    type: mcq
    stem: "ตอนกลางคืน เราเปิดไฟในห้องแล้วมองเห็นหนังสือบนโต๊ะ ข้อใดอธิบายการมองเห็นได้ถูกต้อง"
    choices:
      - { id: a, text: "แสงจากหลอดไฟตกกระทบหนังสือ แล้วสะท้อนเข้าตาเรา", correct: true }
      - { id: b, text: "ตาของเราส่งแสงออกไปกระทบหนังสือ", feedback: "ตาไม่ได้ปล่อยแสง ถ้าตาปล่อยแสงได้ เราจะมองเห็นในห้องมืดสนิท" }
      - { id: c, text: "หนังสือเป็นแหล่งกำเนิดแสง ส่องแสงเข้าตาเอง", feedback: "หนังสือไม่ได้ผลิตแสง ถ้าปิดไฟเราจะมองไม่เห็นหนังสือ แสดงว่าหนังสือแค่สะท้อนแสงจากหลอดไฟ" }
    hints:
      - "ถ้าปิดไฟจนห้องมืดสนิท ยังเห็นหนังสือหรือไม่"
      - "แสงต้องเดินทางจากแหล่งกำเนิด ผ่านวัตถุ แล้วไปที่ใด"
    solution: "หลอดไฟเป็นแหล่งกำเนิดแสง แสงเดินทางเป็นเส้นตรงไปกระทบหนังสือ แล้วสะท้อนออกมาเข้าตา จอตาจึงรับแสงและสมองแปลเป็นภาพหนังสือ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.optics-eye.p002
    topics: [physics.light.optics-eye]
    difficulty: 1
    type: match
    stem: "จับคู่ส่วนของตากับหน้าที่"
    pairs:
      - { left: "ม่านตา", right: "ปรับขนาดรูม่านตาเพื่อควบคุมปริมาณแสงที่เข้าตา" }
      - { left: "เลนส์ตา", right: "เปลี่ยนความโค้งเพื่อโฟกัสภาพให้ชัดทั้งระยะใกล้และไกล" }
      - { left: "จอตา", right: "มีเซลล์รับแสงที่เปลี่ยนแสงเป็นสัญญาณประสาท" }
      - { left: "กระจกตา", right: "ผิวโปร่งใสด้านหน้าสุดที่หักเหแสงมากที่สุด" }
    hints:
      - "ส่วนที่ทำหน้าที่เหมือนรูรับแสงของกล้องคืออะไร"
      - "ส่วนที่ทำหน้าที่เหมือนเซนเซอร์ของกล้องอยู่ด้านหลังสุดของลูกตา"
    solution: "ม่านตาควบคุมขนาดรูม่านตา เลนส์ตาปรับโฟกัส จอตารับแสงและเปลี่ยนเป็นสัญญาณประสาท และกระจกตาเป็นผิวหน้าที่หักเหแสงมากที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.optics-eye.p003
    topics: [physics.light.optics-eye]
    difficulty: 2
    type: mcq
    stem: "ภาพของต้นไม้ที่เกิดบนจอตาของเราเป็นภาพชนิดใด"
    choices:
      - { id: a, text: "ภาพจริง หัวกลับ ขนาดเล็กกว่าวัตถุ", correct: true }
      - { id: b, text: "ภาพเสมือน หัวตั้ง ขนาดเล็กกว่าวัตถุ", feedback: "ภาพเสมือนรับบนฉากไม่ได้ แต่ภาพบนจอตาเกิดจากแสงไปรวมกันจริงบนจอตา จึงเป็นภาพจริง" }
      - { id: c, text: "ภาพจริง หัวตั้ง ขนาดเท่าวัตถุ", feedback: "เลนส์นูนที่วัตถุอยู่ไกลกว่า 2f ให้ภาพจริงหัวกลับย่อ ที่เรารู้สึกว่าหัวตั้งเพราะสมองแปลกลับให้" }
    hints:
      - "กระจกตาและเลนส์ตารวมกันทำหน้าที่เหมือนเลนส์ชนิดใด"
      - "ต้นไม้อยู่ไกลกว่า 2f ของเลนส์ตามาก"
    solution: "กระจกตาและเลนส์ตาทำหน้าที่เป็นเลนส์นูน วัตถุอยู่ไกลกว่า 2f มาก จึงเกิดภาพจริงหัวกลับขนาดเล็กบนจอตา เหมือนภาพบนเซนเซอร์ของกล้องถ่ายรูป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.optics-eye.p004
    topics: [physics.light.optics-eye]
    difficulty: 2
    type: numeric
    stem: "โคมไฟอ่านหนังสือส่งแสงไปตกบนโต๊ะพื้นที่ $1.5\\ \\mathrm{m^2}$ รวม $600\\ \\mathrm{lm}$ อย่างสม่ำเสมอ ความสว่างบนโต๊ะเป็นกี่ลักซ์"
    answer: { value: 400, tolerance: 2, unit: lx }
    misconceptions:
      - { match: 900, feedback: "คูณฟลักซ์กับพื้นที่ ความสว่างคือฟลักซ์ต่อพื้นที่ ต้องหาร" }
      - { match: 0.0025, feedback: "หารกลับด้าน ความสว่าง = ฟลักซ์ ÷ พื้นที่" }
    hints:
      - "ความสว่างคือฟลักซ์การส่องสว่างที่ตกบนพื้นที่หนึ่งตารางเมตร"
      - "$E = \\dfrac{F}{A}$"
    solution: "$E = \\dfrac{600\\ \\mathrm{lm}}{1.5\\ \\mathrm{m^2}} = 400\\ \\mathrm{lx}$ เพียงพอสำหรับงานอ่านเขียน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.optics-eye.p005
    topics: [physics.light.optics-eye]
    difficulty: 2
    type: order
    stem: "เรียงกิจกรรมจากที่ต้องการความสว่างน้อยที่สุดไปมากที่สุด"
    items:
      - "เดินผ่านทางเดินในบ้านตอนกลางคืน"
      - "อ่านหนังสือในห้องเรียน"
      - "ร้อยลูกปัดและเย็บปักลายละเอียด"
      - "แพทย์ผ่าตัดในห้องผ่าตัด"
    hints:
      - "งานที่ต้องเห็นรายละเอียดเล็กมากต้องการแสงมาก"
      - "ทางเดินแค่ต้องมองเห็นทางและสิ่งกีดขวาง"
    solution: "ทางเดินต้องการแสงน้อยที่สุด การอ่านหนังสือต้องการแสงหลายร้อยลักซ์ งานเย็บปักละเอียดต้องการมากขึ้น และโต๊ะผ่าตัดต้องการแสงมากที่สุดเพราะต้องเห็นรายละเอียดเล็กมากและผิดพลาดไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.optics-eye.p006
    topics: [physics.light.optics-eye]
    difficulty: 2
    type: mcq
    stem: "นักเรียนใช้ลักซ์มิเตอร์วัดความสว่างบนโต๊ะเรียนของตัวเอง วิธีใดถูกต้องที่สุด"
    choices:
      - { id: a, text: "วางเซนเซอร์ราบบนโต๊ะตรงที่วางหนังสือ หันขึ้นรับแสง และไม่ให้เงาตัวเองบัง", correct: true }
      - { id: b, text: "ยกเซนเซอร์ขึ้นจ่อใกล้หลอดไฟบนเพดาน", feedback: "ค่าที่ได้คือความสว่างใกล้หลอดไฟ ไม่ใช่บนโต๊ะที่ใช้ทำงาน ความสว่างลดลงมากตามระยะ" }
      - { id: c, text: "ก้มตัวคร่อมเซนเซอร์เพื่อให้อ่านตัวเลขได้ชัด", feedback: "ตัวเราจะบังแสงทำให้ค่าที่อ่านได้ต่ำกว่าความจริง" }
    hints:
      - "ต้องการรู้ความสว่างที่ตำแหน่งใด"
      - "อะไรทำให้ค่าที่วัดผิดไปได้"
    solution: "ความสว่างต้องวัดที่พื้นที่ทำงานจริง วางเซนเซอร์ราบหันรับแสงตามแนวที่หนังสือรับแสง และระวังไม่ให้ตัวเองหรือสิ่งอื่นบังแสง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.optics-eye.p007
    topics: [physics.light.optics-eye]
    difficulty: 3
    type: mcq
    stem: "ภาพแสดงแสงจากวัตถุใกล้เข้าสู่ตาของคุณยาย ตาของคุณยายผิดปกติแบบใด และควรแก้ด้วยแว่นชนิดใด"
    figure: { src: p-eye-defect.svg, alt: "ภาพลูกตา มีจุดวัตถุอยู่ใกล้ทางซ้าย รังสีสี่เส้นจากจุดวัตถุผ่านเลนส์ตาแล้วลู่เข้า แต่เมื่อถึงจอตาด้านหลังยังไม่รวมกัน เส้นประต่อออกไปพบกันที่จุดหลังจอตา" }
    choices:
      - { id: a, text: "สายตายาว แก้ด้วยเลนส์นูน", correct: true }
      - { id: b, text: "สายตาสั้น แก้ด้วยเลนส์เว้า", feedback: "สายตาสั้นคือแสงรวมกันก่อนถึงจอตา ในภาพแสงรวมกันหลังจอตา" }
      - { id: c, text: "สายตายาว แก้ด้วยเลนส์เว้า", feedback: "เลนส์เว้ากระจายแสงออก ทำให้จุดรวมแสงถอยไปหลังจอตามากขึ้นอีก ต้องใช้เลนส์ที่ช่วยรวมแสง" }
    hints:
      - "แสงรวมกันก่อนจอตาหรือหลังจอตา"
      - "ต้องการให้แสงรวมกันเร็วขึ้น ควรใช้เลนส์ที่รวมแสงหรือกระจายแสง"
    solution: "แสงจากวัตถุใกล้รวมกันหลังจอตา คือสายตายาว ภาพบนจอตาจึงพร่ามัว ต้องใช้เลนส์นูนช่วยรวมแสงก่อนเข้าตาเพื่อให้จุดรวมแสงเลื่อนมาอยู่บนจอตา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.optics-eye.p008
    topics: [physics.light.optics-eye]
    difficulty: 3
    type: numeric
    stem: "นักเรียนมีจุดไกลอยู่ที่ $50\\ \\mathrm{cm}$ แว่นที่แก้สายตาให้มองไกลได้ชัดต้องมีกำลังกี่ไดออปเตอร์ (ใส่เครื่องหมายด้วย)"
    answer: { value: -2, tolerance: 0.02, unit: D }
    misconceptions:
      - { match: 2, feedback: "ขนาดถูกแล้วแต่เครื่องหมายผิด สายตาสั้นใช้เลนส์เว้า ซึ่งมีความยาวโฟกัสและกำลังเป็นลบ" }
      - { match: -0.02, feedback: "ใช้ความยาวโฟกัสเป็นเซนติเมตร กำลังของเลนส์ต้องใช้ $f$ เป็นเมตร" }
    hints:
      - "จุดไกลไม่ใช่อนันต์ คือสายตาสั้น ใช้เลนส์เว้า"
      - "แว่นต้องให้ภาพเสมือนของวัตถุไกลที่ระยะ 50 cm จึงได้ $f = -0.50\\ \\mathrm{m}$ แล้ว $P = 1/f$"
    solution: "วัตถุไกลมาก $s \\to \\infty$ ภาพเสมือนที่ $s' = -0.50\\ \\mathrm{m}$ จึงได้ $f = -0.50\\ \\mathrm{m}$ และ $P = \\dfrac{1}{-0.50} = -2.0\\ \\mathrm{D}$ (ร้านแว่นเรียกว่าสั้น 200)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.optics-eye.p009
    topics: [physics.light.optics-eye]
    difficulty: 3
    type: numeric
    stem: "ใช้แว่นขยายเลนส์นูนความยาวโฟกัส $5.0\\ \\mathrm{cm}$ ส่องตัวอักษรบนฉลากยาที่อยู่ห่างเลนส์ $4.0\\ \\mathrm{cm}$ ภาพของตัวอักษรขยายกี่เท่า"
    answer: { value: 5, tolerance: 0.05 }
    misconceptions:
      - { match: 0.56, feedback: "บวกส่วนกลับ $\\tfrac15 + \\tfrac14$ ต้องลบ $\\tfrac{1}{s'} = \\tfrac{1}{f} - \\tfrac{1}{s}$ ได้ $s'$ เป็นลบ (ภาพเสมือน)" }
      - { match: 1.25, feedback: "หาร $f$ ด้วย $s$ กำลังขยายต้องใช้ $\\tfrac{|s'|}{s}$" }
    hints:
      - "หาตำแหน่งภาพด้วย $\\dfrac{1}{f} = \\dfrac{1}{s} + \\dfrac{1}{s'}$ วัตถุอยู่ใกล้กว่าจุดโฟกัส"
      - "กำลังขยาย $m = \\dfrac{|s'|}{s}$"
    solution: "$\\dfrac{1}{s'} = \\dfrac{1}{5.0} - \\dfrac{1}{4.0} = -0.05\\ \\mathrm{cm^{-1}}$ ได้ $s' = -20\\ \\mathrm{cm}$ (ภาพเสมือน หัวตั้ง) กำลังขยาย $m = \\dfrac{20}{4.0} = 5$ เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.optics-eye.p010
    topics: [physics.light.optics-eye]
    difficulty: 3
    type: mcq
    stem: "กล้องถ่ายรูปโฟกัสภาพภูเขาที่อยู่ไกลไว้ชัดแล้ว ถ้าต้องการถ่ายดอกไม้ที่อยู่ห่างเพียง $30\\ \\mathrm{cm}$ ให้ชัด ต้องปรับเลนส์อย่างไร"
    choices:
      - { id: a, text: "เลื่อนเลนส์ออกห่างจากเซนเซอร์", correct: true }
      - { id: b, text: "เลื่อนเลนส์เข้าใกล้เซนเซอร์", feedback: "วัตถุเข้าใกล้เลนส์ ภาพจริงจะอยู่ไกลจากเลนส์มากขึ้น ($s'$ เพิ่ม) จึงต้องให้เลนส์ห่างเซนเซอร์มากขึ้น" }
      - { id: c, text: "ไม่ต้องปรับ เพราะความยาวโฟกัสของเลนส์คงเดิม", feedback: "ความยาวโฟกัสคงเดิมจริง แต่ระยะภาพ $s'$ เปลี่ยนตามระยะวัตถุ ภาพจะไม่ชัดถ้าไม่ปรับ" }
    hints:
      - "เมื่อ $s$ ลดลง $s'$ จากสูตรเลนส์เพิ่มหรือลด"
      - "วัตถุไกลมาก ภาพอยู่ที่จุดโฟกัส วัตถุใกล้ขึ้นภาพเลื่อนออกไปไกลกว่าจุดโฟกัส"
    solution: "จาก $\\tfrac{1}{s'} = \\tfrac{1}{f} - \\tfrac{1}{s}$ เมื่อ $s$ เล็กลง $\\tfrac{1}{s'}$ เล็กลง $s'$ จึงยาวขึ้น ต้องเลื่อนเลนส์ออกห่างเซนเซอร์ ส่วนตาเลื่อนเลนส์ไม่ได้ จึงเพิ่มความโค้งของเลนส์ตาแทน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.optics-eye.p011
    topics: [physics.light.optics-eye]
    difficulty: 4
    type: numeric
    stem: "กล้องจุลทรรศน์มีเลนส์ใกล้วัตถุความยาวโฟกัส $1.0\\ \\mathrm{cm}$ วางเซลล์เยื่อหอมห่างเลนส์นี้ $1.1\\ \\mathrm{cm}$ และเลนส์ใกล้ตาให้กำลังขยาย 5 เท่า กำลังขยายรวมของกล้องเป็นกี่เท่า"
    answer: { value: 50, tolerance: 0.5 }
    misconceptions:
      - { match: 15, feedback: "บวกกำลังขยายของสองเลนส์ กำลังขยายรวมคือผลคูณ" }
      - { match: 10, feedback: "นี่คือกำลังขยายของเลนส์ใกล้วัตถุอย่างเดียว ยังต้องคูณกำลังขยายของเลนส์ใกล้ตา" }
    hints:
      - "หาระยะภาพของเลนส์ใกล้วัตถุก่อน แล้วหา $m_o = s'/s$"
      - "กำลังขยายรวม $M = m_o \\times m_e$"
    solution: "$\\dfrac{1}{s'} = \\dfrac{1}{1.0} - \\dfrac{1}{1.1}$ ได้ $s' = 11\\ \\mathrm{cm}$ ดังนั้น $m_o = \\dfrac{11}{1.1} = 10$ กำลังขยายรวม $M = 10 \\times 5 = 50$ เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.optics-eye.p012
    topics: [physics.light.optics-eye]
    difficulty: 4
    type: numeric
    stem: "ชมรมดาราศาสตร์นำกล้องโทรทรรศน์ไปส่องดาวพฤหัสบดีที่ดอยอินทนนท์ เลนส์ใกล้วัตถุความยาวโฟกัส $90\\ \\mathrm{cm}$ เลนส์ใกล้ตาความยาวโฟกัส $2.5\\ \\mathrm{cm}$ กล้องนี้มีกำลังขยายกี่เท่า"
    answer: { value: 36, tolerance: 0.4 }
    misconceptions:
      - { match: 0.028, feedback: "หารกลับด้าน กำลังขยายของกล้องโทรทรรศน์คือ $f_o / f_e$ ความยาวโฟกัสยาวอยู่ที่ตัวเศษ" }
