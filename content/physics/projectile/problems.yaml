    answer: { value: 9.8, tolerance: 0.1, unit: m/s² }
    hints:
      - "ลูกแก้วพุ่งออกในแนวราบ แนวดิ่งจึงเริ่มจาก $u_y = 0$ เหมือนการปล่อยตก"
      - "ใช้ $y = \\tfrac{1}{2}gt^2$ จัดรูปเป็น $g = \\dfrac{2y}{t^2}$"
    misconceptions:
      - { match: 4.9, feedback: "ดูเหมือนใช้ $g = \\dfrac{y}{t^2}$ ลืมว่าสมการคือ $y = \\tfrac{1}{2}gt^2$ จึงต้องคูณ 2" }
      - { match: 1.47, feedback: "นี่คือ $\\dfrac{y}{t}$ ซึ่งเป็นความเร็วเฉลี่ยแนวดิ่ง ไม่ใช่ความเร่ง" }
    solution: "$g = \\dfrac{2y}{t^2} = \\dfrac{2(0.441)}{(0.3)^2} = \\dfrac{0.882}{0.09} = 9.8\\ \\mathrm{m/s^2}$ ตรวจกับจุดอื่น เช่น $\\dfrac{2(0.196)}{0.04} = 9.8$ ได้ค่าเท่ากัน แสดงว่าระยะที่ตกลงเป็นสัดส่วนกับ $t^2$"
    license: CC-BY-SA-4.0
    ai_assisted: true

