    difficulty: 1
    type: mcq
    stem: |
      โปรแกรมนี้แสดงคำใด

      ```python
      fruits = ["มะม่วง", "ทุเรียน", "มังคุด"]
      print(fruits[1])
      ```
    choices:
      - { id: a, text: "ทุเรียน", correct: true }
      - { id: b, text: "มะม่วง", feedback: "มะม่วงอยู่ที่ดัชนี 0 ดัชนีของลิสต์เริ่มนับจาก 0 ไม่ใช่ 1" }
      - { id: c, text: "มังคุด", feedback: "มังคุดอยู่ที่ดัชนี 2 ซึ่งเป็นตัวสุดท้าย" }
