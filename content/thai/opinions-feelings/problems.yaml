  items:
  - ดูให้จบและจดคำสำคัญ
  - บอกจุดประสงค์ของสารคดี
  - สรุปแนวคิดสำคัญหนึ่งประโยค
  - เลือกความคิดเห็นพร้อมเหตุผลและตัวอย่างจากเรื่อง
  - เตรียมความรู้สึกหรือข้อเสนอแนะที่ทำได้จริง
  hints:
  - ต้องฟังและดูก่อนจึงสรุปได้
  - ความคิดเห็นต้องอาศัยแนวคิดที่สรุปไว้
  solution: ดูจบและจด → บอกจุดประสงค์ → สรุปแนวคิด → ความคิดเห็น + เหตุผล → ความรู้สึก / ข้อเสนอแนะ
