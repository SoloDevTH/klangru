    solution: "$R = \\dfrac{V^2}{P}$: หลอด $40\\ \\mathrm{W}$ มี $R = \\dfrac{220^2}{40} = 1210\\ \\Omega$ ส่วนหลอด $100\\ \\mathrm{W}$ มี $R = \\dfrac{220^2}{100} = 484\\ \\Omega$ หลอด $40\\ \\mathrm{W}$ จึงมีความต้านทานมากกว่า"
