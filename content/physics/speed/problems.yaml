problems:
  - id: phy.speed.p001
    topics: [physics.kinematics.speed]
    difficulty: 1
    type: numeric
    stem: "นักเรียนวิ่ง $100\\ \\mathrm{m}$ ในเวลา $20\\ \\mathrm{s}$ มีอัตราเร็วเฉลี่ยเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s)"
    answer: { value: 5, unit: m/s }
    hints:
      - "อัตราเร็วคือระยะทางที่ได้ในหนึ่งวินาที"
      - "ใช้ $v = \\dfrac{s}{t}$ นำระยะทางหารด้วยเวลา"
    misconceptions:
      - { match: 0.2, feedback: "ดูเหมือนนำเวลาหารด้วยระยะทาง ได้หน่วยเป็นวินาทีต่อเมตร ต้องนำระยะทางหารด้วยเวลา" }
      - { match: 2000, feedback: "ดูเหมือนนำระยะทางคูณเวลา ลองตรวจหน่วย: $\\mathrm{m} \\times \\mathrm{s}$ ไม่ใช่หน่วยของอัตราเร็ว" }
    solution: "$v = \\dfrac{s}{t} = \\dfrac{100\\ \\mathrm{m}}{20\\ \\mathrm{s}} = 5\\ \\mathrm{m/s}$ คือวิ่งได้ 5 เมตรทุกวินาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.speed.p002
    topics: [physics.kinematics.speed]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นความหมายของ **อัตราเร็ว**"
    choices:
      - { id: a, text: "ระยะทางที่เคลื่อนที่ได้ในหนึ่งหน่วยเวลา", correct: true }
      - { id: b, text: "เวลาที่ใช้ในการเคลื่อนที่หนึ่งหน่วยระยะทาง", feedback: "นั่นคือเวลาหารด้วยระยะทาง ซึ่งกลับด้านกับอัตราเร็ว ยิ่งค่านี้มาก แปลว่ายิ่งช้า" }
      - { id: c, text: "ระยะทางคูณด้วยเวลาที่ใช้", feedback: "อัตราเร็วเกิดจากการหาร ไม่ใช่การคูณ หน่วยของอัตราเร็วคือ m/s (เมตร **ต่อ** วินาที)" }
      - { id: d, text: "ระยะทางทั้งหมดที่เคลื่อนที่ไป", feedback: "นั่นคือระยะทาง อัตราเร็วต้องเทียบกับเวลาด้วย วิ่งไกลแต่ใช้เวลานานอาจช้ากว่าคนที่วิ่งใกล้กว่า" }
    hints:
      - "นึกถึงหน่วย m/s อ่านว่า เมตรต่อวินาที"
      - "คำว่า 'ต่อ' หมายถึงการหาร"
    solution: "อัตราเร็ว $v = \\dfrac{s}{t}$ คือระยะทางที่เคลื่อนที่ได้ในหนึ่งหน่วยเวลา หน่วยจึงเป็นเมตรต่อวินาที (m/s)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.speed.p003
    topics: [physics.kinematics.speed]
    difficulty: 2
    type: mcq
    stem: "ขณะนั่งรถเมล์ เข็มบนหน้าปัดรถชี้ที่ 40 km/h ตัวเลขนี้บอกอะไร"
    choices:
      - { id: a, text: "อัตราเร็วขณะนั้นของรถ", correct: true }
      - { id: b, text: "อัตราเร็วเฉลี่ยตั้งแต่ออกจากอู่", feedback: "อัตราเร็วเฉลี่ยต้องคิดจากระยะทางรวมหารด้วยเวลารวม เข็มบนหน้าปัดเปลี่ยนตลอดเวลาตามที่รถเร่งหรือเบรก จึงบอกค่า ณ ขณะนั้น" }
      - { id: c, text: "ระยะทางที่รถวิ่งไปแล้ว", feedback: "ระยะทางรวมดูได้จากมาตรวัดระยะทาง (ตัวเลขกิโลเมตรสะสม) ไม่ใช่เข็มที่มีหน่วย km/h" }
      - { id: d, text: "อัตราเร็วสูงสุดที่รถทำได้", feedback: "เข็มขยับขึ้นลงตามการขับขี่ ไม่ได้ค้างที่ค่าสูงสุด" }
    hints:
      - "ถ้ารถจอดติดไฟแดง เข็มจะชี้ที่เท่าใด"
      - "เข็มเปลี่ยนค่าทันทีเมื่อรถเร่งหรือเบรก"
    solution: "เข็มบนหน้าปัดแสดง **อัตราเร็วขณะหนึ่ง** คืออัตราเร็ว ณ เวลานั้น ถ้ารถจอดเข็มจะชี้ 0 ทันที ส่วนอัตราเร็วเฉลี่ยต้องคำนวณจากระยะทางรวม ÷ เวลารวม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.speed.p004
    topics: [physics.kinematics.speed]
    difficulty: 2
    type: numeric
    stem: "จักรยานวิ่งด้วยอัตราเร็วคงที่ $12\\ \\mathrm{m/s}$ เป็นเวลา 3 นาที ได้ระยะทางกี่เมตร (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 2160, unit: m }
    hints:
      - "จัดรูป $v = \\dfrac{s}{t}$ เพื่อหาระยะทาง"
      - "ระวังหน่วย: อัตราเร็วเป็นเมตรต่อ **วินาที** แต่เวลาให้มาเป็นนาที"
      - "แปลง 3 นาทีเป็นวินาทีก่อน แล้วใช้ $s = vt$"
    misconceptions:
      - { match: 36, feedback: "ดูเหมือนคูณ 12 กับ 3 โดยไม่แปลงนาทีเป็นวินาที อัตราเร็วมีหน่วยต่อวินาที เวลาจึงต้องเป็นวินาทีด้วย" }
      - { match: 4, feedback: "ดูเหมือนนำอัตราเร็วหารด้วยเวลา เมื่อหาระยะทางต้องใช้ $s = vt$ คือคูณ" }
    solution: "$t = 3\\ \\mathrm{min} \\times 60\\ \\mathrm{s/min} = 180\\ \\mathrm{s}$ แล้ว $s = vt = 12\\ \\mathrm{m/s} \\times 180\\ \\mathrm{s} = 2160\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.speed.p005
    topics: [physics.kinematics.speed]
    difficulty: 3
    type: numeric
    stem: "รถตู้วิ่งได้ระยะทาง $36\\ \\mathrm{km}$ ในเวลา 30 นาที มีอัตราเร็วเฉลี่ยกี่เมตรต่อวินาที (ตอบเป็นตัวเลขในหน่วย m/s)"
    answer: { value: 20, unit: m/s }
    hints:
      - "คำตอบต้องเป็น m/s จึงควรแปลงระยะทางเป็นเมตรและเวลาเป็นวินาทีก่อน"
      - "$36\\ \\mathrm{km} = 36\\,000\\ \\mathrm{m}$ และ 30 นาที = $30 \\times 60$ วินาที"
    misconceptions:
      - { match: 1.2, feedback: "นั่นคืออัตราเร็วในหน่วยกิโลเมตรต่อนาที โจทย์ต้องการหน่วย m/s ต้องแปลงทั้งระยะทางและเวลา" }
      - { match: 72, feedback: "นั่นคืออัตราเร็วในหน่วย km/h ซึ่งถูกต้องแต่ยังไม่ใช่หน่วยที่โจทย์ถาม ให้หาร 3.6 อีกครั้ง" }
    solution: "$s = 36\\,000\\ \\mathrm{m}$ และ $t = 30 \\times 60 = 1800\\ \\mathrm{s}$ ดังนั้น $v_{\\mathrm{av}} = \\dfrac{36\\,000\\ \\mathrm{m}}{1800\\ \\mathrm{s}} = 20\\ \\mathrm{m/s}$ ตรวจอีกทาง: 36 km ใน 0.5 h คือ $72\\ \\mathrm{km/h}$ และ $72 \\div 3.6 = 20\\ \\mathrm{m/s}$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.speed.p006
    topics: [physics.kinematics.speed]
    difficulty: 3
    type: order
    stem: "เรียงสิ่งต่อไปนี้จาก **ช้าที่สุด** ไป **เร็วที่สุด**"
    items:
      - "คนเดิน $1.4\\ \\mathrm{m/s}$"
      - "จักรยาน $18\\ \\mathrm{km/h}$"
      - "นักวิ่งระยะสั้น $10\\ \\mathrm{m/s}$"
      - "รถเมล์ $54\\ \\mathrm{km/h}$"
      - "รถไฟฟ้า BTS $25\\ \\mathrm{m/s}$"
    hints:
      - "เทียบตัวเลขที่มีหน่วยต่างกันโดยตรงไม่ได้ ต้องแปลงให้เป็นหน่วยเดียวกันก่อน"
      - "แปลง km/h เป็น m/s ด้วยการหาร 3.6"
    solution: "แปลงเป็น m/s: จักรยาน $18 \\div 3.6 = 5\\ \\mathrm{m/s}$ และรถเมล์ $54 \\div 3.6 = 15\\ \\mathrm{m/s}$ จึงเรียงได้ $1.4 < 5 < 10 < 15 < 25\\ \\mathrm{m/s}$ คือ คนเดิน → จักรยาน → นักวิ่ง → รถเมล์ → BTS สังเกตว่ารถเมล์ 54 km/h ตัวเลขดูมากกว่า BTS 25 m/s แต่จริง ๆ ช้ากว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.speed.p007
    topics: [physics.kinematics.speed]
    difficulty: 4
    type: numeric
    stem: "ครอบครัวหนึ่งขับรถจากบ้านไปต่างจังหวัดระยะทาง $60\\ \\mathrm{km}$ ด้วยอัตราเร็วคงที่ $60\\ \\mathrm{km/h}$ แล้วขับกลับทางเดิมด้วยอัตราเร็วคงที่ $40\\ \\mathrm{km/h}$ อัตราเร็วเฉลี่ยตลอดการเดินทางไปกลับเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย km/h)"
    answer: { value: 48, unit: km/h }
    hints:
      - "อัตราเร็วเฉลี่ย = ระยะทางรวม ÷ เวลารวม"
      - "หาเวลาของเที่ยวไปและเที่ยวกลับแยกกันด้วย $t = \\dfrac{s}{v}$"
      - "ระยะทางรวมคือ $60 + 60$ km แล้วนำไปหารด้วยผลรวมของเวลาสองเที่ยว"
    misconceptions:
      - { match: 50, feedback: "นั่นคือค่าเฉลี่ยของ 60 กับ 40 ซึ่งใช้ได้เฉพาะเมื่อแต่ละช่วงใช้เวลาเท่ากัน แต่เที่ยวกลับช้ากว่าจึงใช้เวลานานกว่า ต้องใช้ระยะทางรวม ÷ เวลารวม" }
      - { match: 24, feedback: "ดูเหมือนใช้ระยะทางแค่เที่ยวเดียว (60 km) แต่หารด้วยเวลาของทั้งไปและกลับ ระยะทางรวมของการไปกลับคือ 120 km" }
    solution: "เที่ยวไป $t_1 = \\dfrac{60\\ \\mathrm{km}}{60\\ \\mathrm{km/h}} = 1\\ \\mathrm{h}$ เที่ยวกลับ $t_2 = \\dfrac{60\\ \\mathrm{km}}{40\\ \\mathrm{km/h}} = 1.5\\ \\mathrm{h}$ ระยะทางรวม $120\\ \\mathrm{km}$ เวลารวม $2.5\\ \\mathrm{h}$ ดังนั้น $v_{\\mathrm{av}} = \\dfrac{120\\ \\mathrm{km}}{2.5\\ \\mathrm{h}} = 48\\ \\mathrm{km/h}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.speed.p008
    topics: [physics.kinematics.speed]
    difficulty: 5
    type: numeric
    stem: "ต้องการขับรถระยะทาง $120\\ \\mathrm{km}$ ให้ได้อัตราเร็วเฉลี่ย $60\\ \\mathrm{km/h}$ ตลอดทาง ครึ่งทางแรก ($60\\ \\mathrm{km}$) รถติดจึงขับได้เพียง $40\\ \\mathrm{km/h}$ ครึ่งทางหลังต้องขับด้วยอัตราเร็วคงที่เท่าใด (ตอบเป็นตัวเลขในหน่วย km/h)"
    answer: { value: 120, unit: km/h }
    hints:
      - "เริ่มจากหาว่าทั้งเที่ยวมีเวลาให้ใช้ได้ทั้งหมดเท่าใด ถ้าอัตราเร็วเฉลี่ยต้องเป็น 60 km/h"
      - "ครึ่งทางแรกใช้เวลาไปแล้ว $\\dfrac{60\\ \\mathrm{km}}{40\\ \\mathrm{km/h}}$"
      - "เวลาที่เหลือ = เวลาทั้งหมด − เวลาครึ่งแรก แล้วหาอัตราเร็วที่ทำให้วิ่ง 60 km ได้ในเวลาที่เหลือ"
    misconceptions:
      - { match: 80, feedback: "ดูเหมือนตั้งสมการ $\\dfrac{40 + v}{2} = 60$ ซึ่งเป็นค่าเฉลี่ยของอัตราเร็ว ใช้ไม่ได้เพราะสองช่วงใช้เวลาไม่เท่ากัน ลองหาเวลาของแต่ละช่วงแทน" }
    solution: "เวลาทั้งหมดที่มี $= \\dfrac{120\\ \\mathrm{km}}{60\\ \\mathrm{km/h}} = 2\\ \\mathrm{h}$ ครึ่งแรกใช้ $\\dfrac{60\\ \\mathrm{km}}{40\\ \\mathrm{km/h}} = 1.5\\ \\mathrm{h}$ เหลือเวลา $0.5\\ \\mathrm{h}$ สำหรับ $60\\ \\mathrm{km}$ จึงต้องขับ $\\dfrac{60\\ \\mathrm{km}}{0.5\\ \\mathrm{h}} = 120\\ \\mathrm{km/h}$ ตรวจ: $\\dfrac{120\\ \\mathrm{km}}{1.5 + 0.5\\ \\mathrm{h}} = 60\\ \\mathrm{km/h}$ ✓ (ในชีวิตจริงต้องดูกฎหมายจำกัดความเร็วด้วย ตัวอย่างนี้แสดงว่าการชดเชยช่วงที่ช้าทำได้ยากกว่าที่คิด)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.speed.p009
    topics: [physics.kinematics.speed]
    difficulty: 2
    type: numeric
    stem: "ช่วงหน้าฝน มะลิเห็นฟ้าแลบ แล้วอีก $3\\ \\mathrm{s}$ จึงได้ยินเสียงฟ้าร้อง ถ้าเสียงเดินทางในอากาศด้วยอัตราเร็ว $340\\ \\mathrm{m/s}$ (แสงมาถึงแทบจะทันที) ฟ้าแลบเกิดห่างจากมะลิกี่เมตร (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 1020, unit: m }
    hints:
      - "เสียงใช้เวลา $3\\ \\mathrm{s}$ เดินทางจากจุดที่เกิดฟ้าแลบมาถึงหู"
      - "จัดรูป $v = \\dfrac{s}{t}$ ให้ $s$ อยู่ข้างเดียว ได้ $s = vt$"
    misconceptions:
      - { match: 113.333, feedback: "ดูเหมือนนำอัตราเร็วหารด้วยเวลา เมื่อหาระยะทางต้องใช้ $s = vt$ คือคูณ" }
      - { match: 0.009, feedback: "ดูเหมือนนำเวลาหารด้วยอัตราเร็ว ลองตรวจหน่วย: $\\mathrm{s} \\div \\mathrm{m/s}$ ได้ $\\mathrm{s^2/m}$ ไม่ใช่เมตร" }
    solution: "$s = vt = 340\\ \\mathrm{m/s} \\times 3\\ \\mathrm{s} = 1020\\ \\mathrm{m}$ ประมาณ 1 กิโลเมตร (จำง่าย ๆ ว่าทุก 3 วินาทีคือประมาณ 1 กิโลเมตร)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.speed.p010
    topics: [physics.kinematics.speed]
    difficulty: 4
    type: numeric
    stem: "แก้วเดินจากบ้านไปป้ายรถเมล์ $600\\ \\mathrm{m}$ ใช้เวลา 5 นาที แล้วนั่งรถเมล์ต่อไปโรงเรียนอีก $9\\ \\mathrm{km}$ ใช้เวลา 25 นาที (ไม่ต้องคิดเวลารอรถ) อัตราเร็วเฉลี่ยตลอดทางจากบ้านถึงโรงเรียนเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย km/h)"
    answer: { value: 19.2, tolerance: 0.2, unit: km/h }
    hints:
      - "อัตราเร็วเฉลี่ย = ระยะทางรวม ÷ เวลารวม"
      - "ระยะทางรวม $= 0.6 + 9$ km และเวลารวม $= 5 + 25$ นาที"
      - "แปลงเวลารวมเป็นชั่วโมงก่อนหาร เพราะคำตอบต้องเป็น km/h"
    misconceptions:
      - { match: 14.4, feedback: "ดูเหมือนหาอัตราเร็วแต่ละช่วง (7.2 และ 21.6 km/h) แล้วเฉลี่ยกัน ใช้ไม่ได้เพราะสองช่วงใช้เวลาไม่เท่ากัน ต้องใช้ระยะทางรวม ÷ เวลารวม" }
      - { match: 0.32, feedback: "นั่นคืออัตราเร็วในหน่วยกิโลเมตรต่อนาที โจทย์ต้องการ km/h ต้องแปลง 30 นาทีเป็น 0.5 ชั่วโมงก่อนหาร" }
    solution: "ระยะทางรวม $= 0.6 + 9 = 9.6\\ \\mathrm{km}$ เวลารวม $= 30\\ \\mathrm{min} = 0.5\\ \\mathrm{h}$ ดังนั้น $v_{\\mathrm{av}} = \\dfrac{9.6\\ \\mathrm{km}}{0.5\\ \\mathrm{h}} = 19.2\\ \\mathrm{km/h}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.speed.p011
    topics: [physics.kinematics.speed]
    difficulty: 2
    type: match
    stem: "จับคู่สิ่งที่เคลื่อนที่กับอัตราเร็วโดยประมาณที่สมเหตุสมผลที่สุด"
    pairs:
      - { left: "คนเดิน", right: "$1.5\\ \\mathrm{m/s}$" }
      - { left: "จักรยาน", right: "$5\\ \\mathrm{m/s}$" }
      - { left: "รถยนต์บนทางด่วน", right: "$28\\ \\mathrm{m/s}$" }
      - { left: "เสียงในอากาศ", right: "$340\\ \\mathrm{m/s}$" }
    hints:
      - "เปลี่ยนเป็นภาพในหัว: $1\\ \\mathrm{m/s}$ คือก้าวได้ราวหนึ่งเมตรครึ่งในหนึ่งวินาทีหรือไม่"
      - "รถบนทางด่วนวิ่งราว $100\\ \\mathrm{km/h}$ หาร 3.6 ได้กี่ m/s"
    solution: "คนเดินราว $1.5\\ \\mathrm{m/s}$ จักรยานราว $5\\ \\mathrm{m/s}$ ($18\\ \\mathrm{km/h}$) รถบนทางด่วนราว $28\\ \\mathrm{m/s}$ ($100\\ \\mathrm{km/h}$) และเสียงในอากาศราว $340\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.speed.p012
    topics: [physics.kinematics.speed]
    difficulty: 1
    type: numeric
    stem: "เต่าเดินด้วยอัตราเร็วคงที่ $0.05\\ \\mathrm{m/s}$ ต้องใช้เวลากี่วินาทีจึงเดินได้ $3\\ \\mathrm{m}$ (ตอบเป็นตัวเลขในหน่วย s)"
    answer: { value: 60, unit: s }
    hints:
      - "รู้ระยะทางและอัตราเร็ว ต้องการหาเวลา"
      - "ใช้ $t = \\dfrac{s}{v}$"
    misconceptions:
      - { match: 0.15, feedback: "ดูเหมือนนำอัตราเร็วคูณระยะทาง เวลา = ระยะทาง ÷ อัตราเร็ว" }
      - { match: 0.0167, feedback: "ดูเหมือนนำอัตราเร็วหารด้วยระยะทาง ซึ่งกลับด้าน ต้องเป็นระยะทาง ÷ อัตราเร็ว" }
    solution: "$t = \\dfrac{s}{v} = \\dfrac{3\\ \\mathrm{m}}{0.05\\ \\mathrm{m/s}} = 60\\ \\mathrm{s}$ หรือ 1 นาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.speed.p013
    topics: [physics.kinematics.speed]
    difficulty: 2
    type: numeric
    stem: "กราฟในภาพแสดงระยะทางกับเวลาของนักวิ่ง A และ B ในการวิ่งแข่ง นักวิ่ง A วิ่งด้วยอัตราเร็วเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s)"
    figure:
      src: runners-graph.svg
      alt: "กราฟระยะทาง (เมตร) กับเวลา (วินาที) ตั้งแต่ 0 ถึง 50 วินาที เส้น A เป็นเส้นตรงจาก (0, 0) ถึง (50, 200) เส้น B เป็นเส้นตรงจาก (0, 0) ถึง (20, 120) แล้วเป็นเส้นราบที่ 120 m จนถึง 35 วินาที จากนั้นเป็นเส้นตรงขึ้นไปถึง (50, 210)"
    answer: { value: 4, unit: m/s }
    hints:
      - "เส้นของ A เป็นเส้นตรง อัตราเร็วคงที่ เท่ากับความชันของเส้น"
      - "อ่านระยะทางและเวลาที่จุดปลายของเส้น A แล้วหาร"
    misconceptions:
      - { match: 0.25, feedback: "ดูเหมือนนำเวลาหารด้วยระยะทาง อัตราเร็วคือระยะทาง ÷ เวลา" }
      - { match: 6, feedback: "นี่คืออัตราเร็วของ B ช่วงที่วิ่ง เส้นของ A คือเส้นที่ไปถึง $200\\ \\mathrm{m}$ ที่ $50\\ \\mathrm{s}$" }
    solution: "เส้น A ผ่าน $(0, 0)$ และ $(50\\ \\mathrm{s}, 200\\ \\mathrm{m})$ ความชัน $= \\dfrac{200}{50} = 4\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.speed.p014
    topics: [physics.kinematics.speed]
    difficulty: 3
    type: numeric
    stem: "จากกราฟระยะทางกับเวลาของนักวิ่ง A และ B ในภาพ อัตราเร็วเฉลี่ยของนักวิ่ง B ตลอด $50\\ \\mathrm{s}$ เป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s ทศนิยม 1 ตำแหน่ง)"
    figure:
      src: runners-graph.svg
      alt: "กราฟระยะทาง (เมตร) กับเวลา (วินาที) ตั้งแต่ 0 ถึง 50 วินาที เส้น A เป็นเส้นตรงจาก (0, 0) ถึง (50, 200) เส้น B เป็นเส้นตรงจาก (0, 0) ถึง (20, 120) แล้วเป็นเส้นราบที่ 120 m จนถึง 35 วินาที จากนั้นเป็นเส้นตรงขึ้นไปถึง (50, 210)"
    answer: { value: 4.2, tolerance: 0.05, unit: m/s }
    hints:
      - "อัตราเร็วเฉลี่ย = ระยะทางรวม ÷ เวลารวม รวมช่วงที่หยุดด้วย"
      - "อ่านระยะทางของ B ที่ $t = 50\\ \\mathrm{s}$"
    misconceptions:
      - { match: 6, feedback: "นี่คืออัตราเร็วของ B ขณะวิ่ง แต่ B หยุดพักอยู่ 15 วินาที อัตราเร็วเฉลี่ยต้องใช้เวลารวมทั้งหมด" }
      - { match: 4, feedback: "นี่คืออัตราเร็วของ A ที่ไปได้ $200\\ \\mathrm{m}$ ส่วน B ไปได้ $210\\ \\mathrm{m}$ ในเวลาเท่ากัน" }
    solution: "B วิ่งได้ $210\\ \\mathrm{m}$ ในเวลา $50\\ \\mathrm{s}$ (รวมช่วงหยุดพัก) $v_{\\mathrm{av}} = \\dfrac{210}{50} = 4.2\\ \\mathrm{m/s}$ มากกว่า A เล็กน้อย แม้ B จะหยุดพักกลางทาง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.speed.p015
    topics: [physics.kinematics.speed]
    difficulty: 3
    type: numeric
    stem: "บนทางหลวงสายเอเชีย รถโดยสารวิ่งด้วยอัตราเร็วคงที่ $72\\ \\mathrm{km/h}$ ตามหลังรถบรรทุกที่วิ่งไปทางเดียวกันด้วยอัตราเร็วคงที่ $54\\ \\mathrm{km/h}$ ขณะนี้รถโดยสารอยู่ห่างหลังรถบรรทุก $100\\ \\mathrm{m}$ อีกกี่วินาทีรถโดยสารจึงตามทันรถบรรทุก (ตอบเป็นตัวเลขในหน่วย s)"
    answer: { value: 20, tolerance: 0.1, unit: s }
    hints:
      - "วิ่งทางเดียวกัน ระยะห่างลดลงด้วยผลต่างของอัตราเร็ว"
      - "หาอัตราเร็วสัมพัทธ์ในหน่วย m/s แล้วใช้ $t = \\dfrac{d}{v_{\\text{สัมพัทธ์}}}$"
    misconceptions:
      - { match: 2.86, feedback: "ดูเหมือนบวกอัตราเร็วสองคันเข้าด้วยกัน ซึ่งใช้กับรถที่วิ่งสวนกัน รถที่วิ่งตามกันต้องใช้ผลต่าง" }
      - { match: 5.56, feedback: "ดูเหมือนใช้อัตราเร็วสัมพัทธ์ $18$ ในหน่วย km/h กับระยะในหน่วยเมตร ต้องเปลี่ยน $18\\ \\mathrm{km/h}$ เป็น $5\\ \\mathrm{m/s}$ ก่อน" }
    solution: "อัตราเร็วสัมพัทธ์ $= 72 - 54 = 18\\ \\mathrm{km/h} = 5\\ \\mathrm{m/s}$ เวลา $t = \\dfrac{100\\ \\mathrm{m}}{5\\ \\mathrm{m/s}} = 20\\ \\mathrm{s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.speed.p016
    topics: [physics.kinematics.speed]
    difficulty: 4
    type: numeric
    stem: "รถไฟสองขบวนวิ่งสวนกันบนรางคู่ ดังภาพ ขบวน A ยาว $150\\ \\mathrm{m}$ วิ่ง $20\\ \\mathrm{m/s}$ ขบวน B ยาว $100\\ \\mathrm{m}$ วิ่ง $30\\ \\mathrm{m/s}$ ตั้งแต่หัวขบวนทั้งสองมาพบกันจนท้ายขบวนทั้งสองพ้นกัน ใช้เวลากี่วินาที (ตอบเป็นตัวเลขในหน่วย s)"
    figure:
      src: trains-passing.svg
      alt: "รถไฟสองขบวนบนรางคู่ขนาน ขบวน A ยาว 150 m อยู่รางบน วิ่งไปทางขวาด้วย 20 m/s ขบวน B ยาว 100 m อยู่รางล่าง วิ่งไปทางซ้ายด้วย 30 m/s ทั้งสองกำลังวิ่งเข้าหากัน"
    answer: { value: 5, tolerance: 0.05, unit: s }
    hints:
      - "วิ่งสวนกัน อัตราเร็วสัมพัทธ์คือผลบวกของอัตราเร็ว"
      - "จากหัวพบกันจนท้ายพ้นกัน ระยะที่ต้องปิดคือความยาวของทั้งสองขบวนรวมกัน"
    misconceptions:
      - { match: 25, feedback: "ดูเหมือนใช้ผลต่างของอัตราเร็ว ($10\\ \\mathrm{m/s}$) รถไฟวิ่งสวนกัน ระยะระหว่างกันลดลงด้วยผลบวก $50\\ \\mathrm{m/s}$" }
      - { match: 3, feedback: "ดูเหมือนใช้ความยาวขบวน A ขบวนเดียว ระยะที่ต้องปิดคือความยาวของทั้งสองขบวนรวมกัน $250\\ \\mathrm{m}$" }
    solution: "อัตราเร็วสัมพัทธ์ $= 20 + 30 = 50\\ \\mathrm{m/s}$ ระยะ $= 150 + 100 = 250\\ \\mathrm{m}$ เวลา $= \\dfrac{250}{50} = 5\\ \\mathrm{s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.speed.p017
    topics: [physics.kinematics.speed]
    difficulty: 4
    type: expression
    stem: "เดินทางครึ่งทางแรกด้วยอัตราเร็วคงที่ $u$ และครึ่งทางหลังซึ่งยาวเท่ากันด้วยอัตราเร็วคงที่ $v$ เขียนอัตราเร็วเฉลี่ยตลอดทางในรูปของ $u$ และ $v$"
    prefix: "v_{\\mathrm{av}} ="
    answer: { latex: "\\frac{2uv}{u+v}", variables: [u, v] }
    hints:
      - "ให้แต่ละครึ่งยาว $d$ เวลาครึ่งแรก $\\dfrac{d}{u}$ และครึ่งหลัง $\\dfrac{d}{v}$"
      - "อัตราเร็วเฉลี่ย $= \\dfrac{2d}{\\frac{d}{u} + \\frac{d}{v}}$ แล้วตัด $d$"
    misconceptions:
      - { match: "\\frac{u+v}{2}", feedback: "ค่าเฉลี่ยธรรมดาใช้ได้เมื่อแต่ละช่วงใช้ **เวลา** เท่ากัน แต่โจทย์นี้แต่ละช่วงยาว **ระยะทาง** เท่ากัน ช่วงที่ช้ากว่าใช้เวลานานกว่า" }
      - { match: "\\frac{uv}{u+v}", feedback: "ระยะทางรวมคือ $2d$ ไม่ใช่ $d$ จึงต้องคูณ 2" }
    solution: "ให้แต่ละครึ่งยาว $d$ เวลารวม $= \\dfrac{d}{u} + \\dfrac{d}{v} = \\dfrac{d(u+v)}{uv}$ จึงได้ $v_{\\mathrm{av}} = \\dfrac{2d}{d(u+v)/(uv)} = \\dfrac{2uv}{u+v}$ เช่น $u = 60$, $v = 30$ ได้ $40\\ \\mathrm{km/h}$ ตรงกับตัวอย่างในบทเรียน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.speed.p018
    topics: [physics.kinematics.speed]
    difficulty: 2
    type: numeric
    stem: "รถไฟจากกรุงเทพฯ ไปเชียงใหม่วิ่งระยะทางประมาณ $700\\ \\mathrm{km}$ ถ้าอัตราเร็วเฉลี่ยรวมการจอดตามสถานีเป็น $50\\ \\mathrm{km/h}$ การเดินทางใช้เวลากี่ชั่วโมง (ตอบเป็นตัวเลขในหน่วย h)"
    answer: { value: 14, unit: h }
    hints:
      - "รู้ระยะทางและอัตราเร็วเฉลี่ย ต้องการเวลา"
      - "$t = \\dfrac{s}{v}$ หน่วย km ÷ km/h ได้ชั่วโมง"
    misconceptions:
      - { match: 0.0714, feedback: "ดูเหมือนนำอัตราเร็วหารด้วยระยะทาง เวลา = ระยะทาง ÷ อัตราเร็ว" }
      - { match: 35000, feedback: "ดูเหมือนนำระยะทางคูณอัตราเร็ว หน่วยของคำตอบจะเป็น $\\mathrm{km^2/h}$ ซึ่งไม่ใช่เวลา" }
    solution: "$t = \\dfrac{700\\ \\mathrm{km}}{50\\ \\mathrm{km/h}} = 14\\ \\mathrm{h}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.speed.p019
    topics: [physics.kinematics.speed]
    difficulty: 4
    type: numeric
    stem: "สนามวิ่งรอบยาว $400\\ \\mathrm{m}$ เอวิ่ง $5\\ \\mathrm{m/s}$ และบีวิ่ง $4\\ \\mathrm{m/s}$ คงที่ ทั้งสองออกตัวจากจุดเดียวกันพร้อมกันไปทางเดียวกัน อีกกี่วินาทีเอจึงวิ่งแซงบีครบหนึ่งรอบ (ตอบเป็นตัวเลขในหน่วย s)"
    answer: { value: 400, unit: s }
    hints:
      - "เอแซงบีครบรอบเมื่อเอวิ่งได้มากกว่าบี $400\\ \\mathrm{m}$"
      - "ระยะห่างเพิ่มขึ้นด้วยอัตราเร็วสัมพัทธ์ $5 - 4$"
    misconceptions:
      - { match: 44.4, feedback: "ดูเหมือนบวกอัตราเร็ว ซึ่งใช้กับคนที่วิ่งสวนกัน ทั้งสองวิ่งทางเดียวกัน ระยะห่างเพิ่มด้วยผลต่าง $1\\ \\mathrm{m/s}$" }
      - { match: 80, feedback: "นี่คือเวลาที่เอวิ่งครบหนึ่งรอบ แต่ตอนนั้นบีก็วิ่งไปได้ $320\\ \\mathrm{m}$ แล้ว เอจึงยังไม่ได้แซงบีครบรอบ" }
    solution: "อัตราเร็วสัมพัทธ์ $= 5 - 4 = 1\\ \\mathrm{m/s}$ ต้องห่างกัน $400\\ \\mathrm{m}$ ใช้เวลา $\\dfrac{400}{1} = 400\\ \\mathrm{s}$ ตอนนั้นเอวิ่งไป $2{,}000\\ \\mathrm{m}$ (5 รอบ) และบีวิ่ง $1{,}600\\ \\mathrm{m}$ (4 รอบ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.speed.p020
    topics: [physics.kinematics.speed]
    difficulty: 4
    type: numeric
    stem: "รถไฟขบวนหนึ่งยาว $200\\ \\mathrm{m}$ วิ่งด้วยอัตราเร็วคงที่ $72\\ \\mathrm{km/h}$ ข้ามสะพานยาว $400\\ \\mathrm{m}$ ตั้งแต่หัวรถไฟเริ่มขึ้นสะพานจนท้ายรถไฟพ้นสะพาน ใช้เวลากี่วินาที (ตอบเป็นตัวเลขในหน่วย s)"
    answer: { value: 30, unit: s }
    hints:
      - "เมื่อท้ายรถไฟพ้นสะพาน หัวรถไฟวิ่งเลยปลายสะพานไปแล้วเท่ากับความยาวขบวน"
      - "ระยะที่หัวรถไฟวิ่ง = ความยาวสะพาน + ความยาวขบวน แล้วแปลงอัตราเร็วเป็น m/s"
    misconceptions:
      - { match: 20, feedback: "ดูเหมือนใช้แค่ความยาวสะพาน ตอนที่หัวรถไฟถึงปลายสะพาน ตัวรถไฟยังค้างอยู่บนสะพานอีก $200\\ \\mathrm{m}$" }
      - { match: 8.33, feedback: "ดูเหมือนใช้อัตราเร็วในหน่วย km/h กับระยะในหน่วยเมตร ต้องเปลี่ยน $72\\ \\mathrm{km/h}$ เป็น $20\\ \\mathrm{m/s}$ ก่อน" }
    solution: "$v = 72 \\div 3.6 = 20\\ \\mathrm{m/s}$ ระยะที่หัวรถไฟวิ่ง $= 400 + 200 = 600\\ \\mathrm{m}$ เวลา $= \\dfrac{600}{20} = 30\\ \\mathrm{s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.speed.p021
    topics: [physics.kinematics.speed]
    difficulty: 5
    type: numeric
    stem: "เรือข้ามฟากในแม่น้ำเจ้าพระยาแล่นด้วยอัตราเร็ว $5\\ \\mathrm{m/s}$ เทียบกับน้ำ น้ำไหลด้วยอัตราเร็ว $1\\ \\mathrm{m/s}$ เรือแล่นตามน้ำไปท่าที่อยู่ห่าง $1.2\\ \\mathrm{km}$ แล้วแล่นทวนน้ำกลับท่าเดิมทันที อัตราเร็วเฉลี่ยของเรือเทียบกับฝั่งตลอดเที่ยวไปกลับเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s)"
    answer: { value: 4.8, tolerance: 0.01, unit: m/s }
    hints:
      - "ตามน้ำ เรือเร็ว $5 + 1$ ทวนน้ำ เรือเร็ว $5 - 1$ เทียบกับฝั่ง"
      - "หาเวลาไปและเวลากลับแยกกัน แล้วใช้ระยะทางรวม ÷ เวลารวม"
    misconceptions:
      - { match: 5, feedback: "ดูเหมือนคิดว่าผลของน้ำไหลหักล้างกันพอดี ($\\tfrac{6+4}{2}$) แต่ขาทวนน้ำใช้เวลานานกว่า อัตราเร็วเฉลี่ยจึงน้อยกว่า $5\\ \\mathrm{m/s}$" }
    solution: "เวลาไป $= \\dfrac{1{,}200}{6} = 200\\ \\mathrm{s}$ เวลากลับ $= \\dfrac{1{,}200}{4} = 300\\ \\mathrm{s}$ อัตราเร็วเฉลี่ย $= \\dfrac{2{,}400\\ \\mathrm{m}}{500\\ \\mathrm{s}} = 4.8\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true
