    solution: "ดาวเทียมวงโคจรต่ำผ่านพื้นที่เดิมซ้ำ ๆ และตรวจจุดความร้อนได้ ข้อมูลนี้ช่วยเตือนและวางแผนจัดการไฟได้จริง ตัวเลือกอื่นขัดกับหลักการโคจรหรือหน้าที่ของเครื่องมือ"
