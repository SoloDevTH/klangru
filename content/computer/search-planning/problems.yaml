  - id: computer.ai.search-planning.p016
    topics: [computer.ai.search-planning]
    difficulty: 5
    type: code
    stem: "เขียนฟังก์ชัน `astar_steps(grid, start, goal)` รับกริดแบบเดียวกับ `bfs_steps` (ช่อง `.` เดินได้ `#` เป็นกำแพง) และพิกัดเป็นทูเพิล (แถว, คอลัมน์) ใช้ A* ที่ฮิวริสติกเป็นระยะแมนฮัตตัน ต้นทุนแต่ละก้าวเป็น 1 คืนจำนวนก้าวที่สั้นที่สุด หรือ -1 ถ้าไปไม่ถึง ใช้ `heapq` ได้"
    starter: |
      def astar_steps(grid, start, goal):
          pass
    tests: |
      G = ["....", ".##.", "...#", "#..."]
      r = astar_steps(G, (0, 0), (3, 3))
      assert r == 6, f"จาก (0, 0) ถึง (3, 3) ควรได้ 6 ก้าว แต่ได้ {r}"
      r2 = astar_steps(G, (0, 0), (0, 3))
      assert r2 == 3, f"จาก (0, 0) ถึง (0, 3) ควรได้ 3 ก้าว แต่ได้ {r2}"
      r3 = astar_steps([".#.", "##.", "..."], (0, 0), (0, 2))
      assert r3 == -1, f"ช่องเริ่มถูกล้อมไว้ ควรได้ -1 แต่ได้ {r3}"
    reference: |
      import heapq
      def astar_steps(grid, start, goal):
          rows, cols = len(grid), len(grid[0])
          def h(cell):
              return abs(cell[0] - goal[0]) + abs(cell[1] - goal[1])
          best = {start: 0}
          heap = [(h(start), 0, start)]
          while heap:
              f, g, (r, c) = heapq.heappop(heap)
              if (r, c) == goal:
                  return g
              if g > best.get((r, c), float("inf")):
                  continue
              for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                  nr, nc = r + dr, c + dc
                  if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] == ".":
                      ng = g + 1
                      if ng < best.get((nr, nc), float("inf")):
                          best[(nr, nc)] = ng
                          heapq.heappush(heap, (ng + h((nr, nc)), ng, (nr, nc)))
          return -1
    hints:
      - "คิวเป็น heap ของทูเพิล (f, g, ช่อง) โดย f = g + h"
      - "เมื่อดึงช่องออกมา ถ้าเป็นเป้าหมายให้คืน g ได้ทันที"
      - "ข้ามรายการที่เก่ากว่า โดยตรวจว่า g ปัจจุบันมากกว่าค่าที่บันทึกไว้หรือไม่"
    solution: "ใช้ heap จัดลำดับตาม f = g + h เก็บ g ที่ดีที่สุดของแต่ละช่อง เมื่อดึงเป้าหมายออกมาคืนค่า g และคืน -1 ถ้า heap ว่างก่อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

