problems:
- id: business.law.thai-taxation.p001
  topics:
  - business.law.thai-taxation
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็น **เงินได้พึงประเมิน** ของพนักงานบริษัท
  choices:
  - id: a
    text: เงินเดือน โบนัส และค่าล่วงเวลาที่ได้จากนายจ้าง
    correct: true
  - id: b
    text: เงินที่ยืมจากเพื่อนมาใช้
    feedback: เงินกู้ยืมต้องใช้คืน ไม่ใช่รายได้
  - id: c
    text: ค่าลดหย่อนส่วนตัว
    feedback: ค่าลดหย่อนเป็นรายการที่นำมาหัก ไม่ใช่เงินได้
  - id: d
    text: เงินที่ถอนจากบัญชีออมทรัพย์ของตนเอง
    feedback: ถอนเงินของตัวเองไม่ใช่รายได้ใหม่
  hints:
  - เงินได้พึงประเมินคือรายได้ที่ต้องนำมาคำนวณภาษี
  - เงินเดือนจัดเป็นเงินได้ประเภทแรก
  solution: เงินได้พึงประเมินคือเงินได้ที่ต้องนำมาคิดภาษี ทั้งที่เป็นเงินและประโยชน์อื่น เงินเดือน โบนัส ค่าล่วงเวลาเป็นเงินได้จากการจ้างแรงงาน ส่วนเงินยืมและเงินของตนเองไม่ใช่เงินได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.thai-taxation.p002
  topics:
  - business.law.thai-taxation
  difficulty: 2
  type: match
  stem: จับคู่แบบแสดงรายการภาษีกับการใช้งาน
  pairs:
  - left: ภ.ง.ด.91
    right: บุคคลธรรมดาที่มีเงินเดือนอย่างเดียว ยื่นภาษีประจำปี
  - left: ภ.ง.ด.50
    right: บริษัทยื่นภาษีเงินได้นิติบุคคลประจำรอบบัญชี
  - left: ภ.พ.30
    right: ผู้ประกอบการจดทะเบียนยื่นภาษีมูลค่าเพิ่มรายเดือน
  - left: ภ.ง.ด.1
    right: นายจ้างนำส่งภาษีที่หักจากเงินเดือนพนักงาน
  hints:
  - ภ.ง.ด. เป็นภาษีเงินได้ ภ.พ. เป็นภาษีมูลค่าเพิ่ม
  - ภ.ง.ด.1 เกี่ยวกับเงินเดือนที่นายจ้างหักไว้
  solution: ภ.ง.ด.91 → เงินเดือนอย่างเดียว ยื่นประจำปี · ภ.ง.ด.50 → นิติบุคคลประจำรอบบัญชี · ภ.พ.30 → ภาษีมูลค่าเพิ่มรายเดือน · ภ.ง.ด.1 → นายจ้างนำส่งภาษีหัก ณ ที่จ่ายจากเงินเดือน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.thai-taxation.p003
  topics:
  - business.law.thai-taxation
  difficulty: 2
  type: numeric
  stem: พนักงานได้เงินเดือนเดือนละ $35{,}000$ บาท ทั้งปี $420{,}000$ บาท หักค่าใช้จ่ายจากเงินเดือนได้กี่บาท (ใช้อัตราและเกณฑ์ในบทเรียน) (ตอบเป็นบาท)
  answer:
    value: 100000
    unit: บาท
  misconceptions:
  - match: 210000
    feedback: ลืมเพดาน 100,000 บาท
  - match: 60000
    feedback: ใช้เพดานเดิมก่อนปี 2560
  hints:
  - เงินเดือนหักค่าใช้จ่ายได้ $50\%$ แต่มีเพดาน
  - $50\%$ ของ $420{,}000$ เกินเพดานหรือไม่
  solution: $50\%$ ของ $420{,}000 = 210{,}000$ บาท แต่เพดานคือ $100{,}000$ บาท จึงหักได้ $100{,}000$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.thai-taxation.p004
  topics:
  - business.law.thai-taxation
  difficulty: 2
  type: numeric
  stem: ถ้าเงินได้สุทธิ (หลังหักค่าใช้จ่ายและค่าลดหย่อน) เท่ากับ $251{,}000$ บาท ต้องเสียภาษีเงินได้บุคคลธรรมดากี่บาท (ใช้อัตราและเกณฑ์ในบทเรียน) (ตอบเป็นบาท)
  answer:
    value: 5050
    unit: บาท
  misconceptions:
  - match: 12550
    feedback: คิด 5% กับเงินได้สุทธิทั้งหมด ลืมยกเว้น 150,000 บาทแรก
  - match: 25100
    feedback: ใช้อัตรา 10% แต่เงินได้สุทธิยังไม่ถึง 300,000 บาท
  hints:
  - $150{,}000$ บาทแรกได้รับยกเว้น
  - ส่วนที่เกิน $150{,}000$ ถึง $300{,}000$ บาท เสีย $5\%$
  solution: $(251{,}000 - 150{,}000) \times 5\% = 101{,}000 \times 0.05 = 5{,}050$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.thai-taxation.p005
  topics:
  - business.law.thai-taxation
  difficulty: 3
  type: numeric
  stem: พนักงานเงินเดือนเดือนละ $35{,}000$ บาท (ทั้งปี $420{,}000$ บาท) ไม่มีเงินได้อื่น โสด จ่ายเงินสมทบประกันสังคมทั้งปี $9{,}000$ บาท (สมมติ) และไม่มีค่าลดหย่อนอื่น เงินได้สุทธิเป็นกี่บาท (ใช้อัตราและเกณฑ์ในบทเรียน) (ตอบเป็นบาท)
  answer:
    value: 251000
    unit: บาท
  misconceptions:
  - match: 260000
    feedback: ลืมหักเงินสมทบประกันสังคม
  - match: 141000
    feedback: หักค่าใช้จ่าย 50% โดยไม่ใช้เพดาน 100,000 บาท
  hints:
  - หักค่าใช้จ่ายก่อน แล้วจึงหักค่าลดหย่อน
  - ค่าใช้จ่าย $100{,}000$ ลดหย่อนส่วนตัว $60{,}000$ ประกันสังคม $9{,}000$
  solution: $420{,}000 - 100{,}000 - 60{,}000 - 9{,}000 = 251{,}000$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.thai-taxation.p006
  topics:
  - business.law.thai-taxation
  difficulty: 3
  type: numeric
  stem: ต่อจากข้อที่แล้ว ภาษีทั้งปี $5{,}050$ บาท นายจ้างประมาณภาษีทั้งปีแล้วหักจากเงินเดือนเท่ากันทุกเดือน ต้องหักเดือนละประมาณกี่บาท (ตอบเป็นบาท ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 420.833333
    tolerance: 0.5
    unit: บาท
  misconceptions:
  - match: 1750
    feedback: คิด 5% ของเงินเดือนรายเดือนทั้งก้อน ต้องคิดจากภาษีทั้งปีที่คำนวณแล้ว
  - match: 5050
    feedback: นั่นคือภาษีทั้งปี
  hints:
  - ภาษีหัก ณ ที่จ่ายจากเงินเดือนกระจายภาษีทั้งปีเป็นรายเดือน
  - $5{,}050 \div 12$
  solution: $5{,}050 \div 12 \approx 420.83$ บาทต่อเดือน นายจ้างนำส่งด้วยแบบ ภ.ง.ด.1 ตอนยื่นภาษีประจำปี ภาษีที่ถูกหักไว้นำมาเครดิตได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.thai-taxation.p007
  topics:
  - business.law.thai-taxation
  difficulty: 3
  type: numeric
  stem: ร้านค้าที่จดทะเบียนภาษีมูลค่าเพิ่ม เดือนนี้ซื้อสินค้า $200{,}000$ บาท บวกภาษีซื้อ $7\%$ และขายได้ $300{,}000$ บาท บวกภาษีขาย $7\%$ (ราคาก่อนภาษีทั้งคู่) ร้านต้องนำส่งภาษีมูลค่าเพิ่มกี่บาท (ตอบเป็นบาท)
  answer:
    value: 7000
    unit: บาท
  misconceptions:
  - match: 21000
    feedback: ลืมหักภาษีซื้อ
  - match: 35000
    feedback: บวกภาษีซื้อกับภาษีขาย
  hints:
  - ภาษีขาย $= 300{,}000 \times 7\%$ ภาษีซื้อ $= 200{,}000 \times 7\%$
  - ภาษีที่ต้องชำระ $=$ ภาษีขาย $-$ ภาษีซื้อ
  solution: ภาษีขาย $21{,}000$ บาท ภาษีซื้อ $14{,}000$ บาท นำส่ง $21{,}000 - 14{,}000 = 7{,}000$ บาท ซึ่งเท่ากับ $7\%$ ของมูลค่าที่ร้านเพิ่มให้สินค้า ($100{,}000$ บาท)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.thai-taxation.p008
  topics:
  - business.law.thai-taxation
  difficulty: 3
  type: numeric
  stem: บริษัทจ้างนักออกแบบอิสระ (บุคคลธรรมดา ไม่ได้จดทะเบียนภาษีมูลค่าเพิ่ม) ค่าจ้างออกแบบโลโก้ $20{,}000$ บาท บริษัทต้องหักภาษี ณ ที่จ่าย $3\%$ (อัตราค่าบริการทั่วไปในบทเรียน) บริษัทจ่ายเงินให้นักออกแบบจริงกี่บาท (ตอบเป็นบาท)
  answer:
    value: 19400
    unit: บาท
  misconceptions:
  - match: 600
    feedback: นั่นคือภาษีที่หัก
  - match: 20600
    feedback: ภาษีหัก ณ ที่จ่ายหักออก ไม่ใช่บวกเพิ่ม
  hints:
  - ภาษีที่หัก $= 20{,}000 \times 3\%$
  - เงินที่จ่ายจริง $=$ ค่าจ้าง $-$ ภาษีที่หัก
  solution: หักภาษี $600$ บาท จ่ายจริง $19{,}400$ บาท และออกหนังสือรับรองการหักภาษี ณ ที่จ่ายให้ นักออกแบบนำ $600$ บาทไปเครดิตตอนยื่นภาษีประจำปี
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.thai-taxation.p009
  topics:
  - business.law.thai-taxation
  difficulty: 4
  type: numeric
  stem: พนักงานเงินเดือนเดือนละ $60{,}000$ บาท (ทั้งปี $720{,}000$ บาท) โสด จ่ายประกันสังคม $9{,}000$ บาท (สมมติ) และเบี้ยประกันชีวิต $20{,}000$ บาท (หักได้เต็มจำนวน) ต้องเสียภาษีทั้งปีกี่บาท (ใช้อัตราและเกณฑ์ในบทเรียน) (ตอบเป็นบาท)
  answer:
    value: 32150
    unit: บาท
  misconceptions:
  - match: 79650
    feedback: คิด 15% กับเงินได้สุทธิทั้งหมด
  - match: 56650
    feedback: ลืมยกเว้น 150,000 บาทแรก (คิด 5% ตั้งแต่บาทแรก)
  hints:
  - เงินได้สุทธิ $= 720{,}000 - 100{,}000 - 60{,}000 - 9{,}000 - 20{,}000$
  - 'คิดภาษีทีละขั้น: $5\%$, $10\%$, $15\%$'
  solution: 'เงินได้สุทธิ $531{,}000$ บาท ภาษี: ขั้น $150{,}001$–$300{,}000$ ได้ $7{,}500$ · ขั้น $300{,}001$–$500{,}000$ ได้ $20{,}000$ · ส่วนเกิน $500{,}000$ คือ $31{,}000 \times 15\% = 4{,}650$ รวม $32{,}150$ บาท (อัตราเฉลี่ยต่อเงินได้ทั้งปีประมาณ $4.5\%$)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.thai-taxation.p010
  topics:
  - business.law.thai-taxation
  difficulty: 4
  type: numeric
  stem: บริษัทจำกัดแห่งหนึ่ง **สมมติว่าเข้าเงื่อนไข SME** มีกำไรสุทธิทางภาษี $2{,}000{,}000$ บาท ต้องเสียภาษีเงินได้นิติบุคคลกี่บาท (ใช้อัตราและเกณฑ์ในบทเรียน) (ตอบเป็นบาท)
  answer:
    value: 255000
    unit: บาท
  misconceptions:
  - match: 300000
    feedback: คิด 15% กับกำไรทั้งหมด ลืมยกเว้น 300,000 บาทแรก
  - match: 400000
    feedback: ใช้อัตราทั่วไป 20% แต่โจทย์บอกเข้าเงื่อนไข SME
  hints:
  - $300{,}000$ บาทแรกยกเว้น
  - ส่วนเกิน $300{,}000$ ถึง $3{,}000{,}000$ บาท เสีย $15\%$
  solution: $(2{,}000{,}000 - 300{,}000) \times 15\% = 1{,}700{,}000 \times 0.15 = 255{,}000$ บาท (ถ้าไม่เข้าเงื่อนไข SME เสีย $20\%$ ของกำไรทั้งหมด $= 400{,}000$ บาท)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.thai-taxation.p011
  topics:
  - business.law.thai-taxation
  difficulty: 4
  type: numeric
  stem: บริษัททั่วไป (ไม่ใช่ SME) มีกำไรทางบัญชี $1{,}500{,}000$ บาท ในค่าใช้จ่ายมีค่าปรับทางอาญา $20{,}000$ บาท และค่าใช้จ่ายส่วนตัวของกรรมการ $30{,}000$ บาท ซึ่งหักเป็นรายจ่ายทางภาษีไม่ได้ ภาษีเงินได้นิติบุคคลอัตรา $20\%$ ของกำไรสุทธิทางภาษีเป็นกี่บาท (ตอบเป็นบาท)
  answer:
    value: 310000
    unit: บาท
  misconceptions:
  - match: 300000
    feedback: ใช้กำไรทางบัญชีโดยไม่บวกกลับรายจ่ายต้องห้าม
  - match: 290000
    feedback: หักรายจ่ายต้องห้ามออกอีก ต้องบวกกลับ
  hints:
  - รายจ่ายที่หักทางภาษีไม่ได้ต้องบวกกลับเข้ากำไร
  - กำไรสุทธิทางภาษี $= 1{,}500{,}000 + 20{,}000 + 30{,}000$
  solution: กำไรสุทธิทางภาษี $= 1{,}550{,}000$ บาท ภาษี $= 1{,}550{,}000 \times 20\% = 310{,}000$ บาท กำไรทางบัญชีกับกำไรทางภาษีจึงไม่เท่ากันเสมอ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.thai-taxation.p012
  topics:
  - business.law.thai-taxation
  difficulty: 4
  type: numeric
  stem: บริษัทจ้างบริษัทรับทำความสะอาด (จดทะเบียนภาษีมูลค่าเพิ่ม) ค่าบริการ $50{,}000$ บาท บวกภาษีมูลค่าเพิ่ม $7\%$ เป็น $53{,}500$ บาท หักภาษี ณ ที่จ่ายค่าบริการ $3\%$ จาก **ค่าบริการก่อนภาษีมูลค่าเพิ่ม** บริษัทต้องโอนเงินให้ผู้ให้บริการกี่บาท (ตอบเป็นบาท)
  answer:
    value: 52000
    unit: บาท
  misconceptions:
  - match: 51895
    feedback: คิด 3% จากยอดที่รวมภาษีมูลค่าเพิ่มแล้ว ต้องใช้ค่าบริการก่อนภาษีมูลค่าเพิ่ม
  - match: 48500
    feedback: ลืมบวกภาษีมูลค่าเพิ่มที่ต้องจ่ายให้ผู้ให้บริการ
  hints:
  - ภาษีหัก ณ ที่จ่าย $= 50{,}000 \times 3\%$
  - โอน $=$ ค่าบริการรวมภาษีมูลค่าเพิ่ม $-$ ภาษีที่หัก
  solution: หัก $50{,}000 \times 0.03 = 1{,}500$ บาท โอน $53{,}500 - 1{,}500 = 52{,}000$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.thai-taxation.p013
  topics:
  - business.law.thai-taxation
  difficulty: 4
  type: numeric
  stem: ร้านนำเข้าเครื่องชงกาแฟ ราคา CIF (รวมค่าขนส่งและประกันภัยถึงไทย) $100{,}000$ บาท อากรขาเข้า $10\%$ **ตามอัตราที่สมมติ** และภาษีมูลค่าเพิ่ม $7\%$ คิดจาก (ราคา CIF $+$ อากรขาเข้า) ร้านต้องจ่ายภาษีมูลค่าเพิ่มตอนนำเข้ากี่บาท (ตอบเป็นบาท)
  answer:
    value: 7700
    unit: บาท
  misconceptions:
  - match: 7000
    feedback: คิดจากราคา CIF อย่างเดียว ต้องรวมอากรขาเข้าด้วย
  - match: 17700
    feedback: รวมอากรขาเข้าด้วย โจทย์ถามเฉพาะภาษีมูลค่าเพิ่ม
  hints:
  - อากรขาเข้า $= 100{,}000 \times 10\%$
  - ฐานภาษีมูลค่าเพิ่ม $= 100{,}000 + 10{,}000$
  solution: อากร $10{,}000$ บาท ฐานภาษีมูลค่าเพิ่ม $110{,}000$ บาท ภาษีมูลค่าเพิ่ม $= 110{,}000 \times 7\% = 7{,}700$ บาท ร้านนำ $7{,}700$ บาทไปเป็นภาษีซื้อได้ ส่วนอากรเป็นต้นทุนสินค้า
  license: CC-BY-SA-4.0
