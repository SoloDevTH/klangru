    ai_assisted: true

  - id: mgt.qt.p012
    topics: [management.quality.concepts]
    difficulty: 2
    type: text
    stem: "วงจร PDCA มักเรียกตามชื่อนักสถิติชาวอเมริกันผู้เผยแพร่แนวคิดนี้ในญี่ปุ่นหลังสงครามโลกครั้งที่สอง ว่า \"วงจร...\" เติมชื่อนามสกุลของเขา (ภาษาไทยหรืออังกฤษก็ได้)"
    accepted: ["Deming", "เดมมิง", "เดมมิ่ง", "เดมิง", "เดมมิงก์", "W. Edwards Deming", "Edwards Deming", "วงจรเดมมิง", "วงจรเดมมิ่ง", "Deming cycle"]
    misconceptions:
      - { match: "Juran", feedback: "Juran เป็นนักคิดด้านคุณภาพคนสำคัญ (ให้ความหมายคุณภาพว่าเหมาะกับการใช้งาน) แต่ชื่อวงจร PDCA มาจากอีกคนหนึ่ง" }
      - { match: "Ishikawa", feedback: "Ishikawa เป็นผู้คิดแผนผังก้างปลา ไม่ใช่ชื่อของวงจร PDCA" }
    hints:
      - "นักสถิติคนนี้ได้รับการยกย่องอย่างมากในวงการอุตสาหกรรมญี่ปุ่น มีรางวัลคุณภาพของญี่ปุ่นตั้งตามชื่อเขา"
      - "ชื่อเต็มคือ W. Edwards ..."
    solution: "วงจร PDCA เรียกอีกชื่อว่า **วงจรเดมมิง** (Deming cycle) ตามชื่อ W. Edwards Deming"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qt.p013
    topics: [management.quality.concepts]
    difficulty: 4
    type: numeric
    stem: "โรงงานชิ้นส่วนยานยนต์มีต้นทุนคุณภาพ (พันบาทต่อปี) ป้องกัน 50 ประเมิน 80 ล้มเหลวภายใน 300 ล้มเหลวภายนอก 200 หลังลงทุนบำรุงรักษาเชิงป้องกันเพิ่ม ต้นทุนป้องกันเป็น 150 ล้มเหลวภายในลดเหลือ 180 ล้มเหลวภายนอกลดเหลือ 90 ส่วนต้นทุนประเมินเท่าเดิม ต้นทุนคุณภาพรวมลดลงกี่พันบาท (ตอบเป็นตัวเลขในหน่วยพันบาท)"
    answer: { value: 130, unit: พันบาท }
    hints:
      - "หาต้นทุนคุณภาพรวมก่อนและหลังแยกกัน"
      - "อย่าลืมว่าต้นทุนป้องกันเพิ่มขึ้นด้วย"
      - "ผลต่าง = รวมก่อน − รวมหลัง"
    misconceptions:
      - { match: 230, feedback: "นั่นคือต้นทุนความล้มเหลวที่ลดลงเท่านั้น ต้องหักต้นทุนป้องกันที่เพิ่มขึ้น 100 พันบาทออกด้วย" }
      - { match: 500, feedback: "นั่นคือต้นทุนคุณภาพรวมหลังปรับปรุง โจทย์ถามว่าลดลงเท่าใด" }
    solution: "ก่อน: $50 + 80 + 300 + 200 = 630$ พันบาท หลัง: $150 + 80 + 180 + 90 = 500$ พันบาท ลดลง $630 - 500 = 130$ พันบาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qt.p014
    topics: [management.quality.concepts]
    difficulty: 4
    type: numeric
    stem: "โรงงานในข้อก่อนมียอดขายปีละ 10 ล้านบาทเท่าเดิม ต้นทุนคุณภาพรวมคิดเป็นร้อยละของยอดขายลดลงกี่ **จุดร้อยละ** (ตอบเป็นตัวเลข)"
    answer: { value: 1.3, tolerance: 0.01, unit: จุดร้อยละ }
    hints:
      - "หาร้อยละของยอดขายก่อนและหลังปรับปรุง"
      - "จุดร้อยละคือผลต่างของร้อยละสองค่าโดยตรง"
    misconceptions:
      - { match: 20.63, feedback: "นั่นคือร้อยละการเปลี่ยนแปลงของต้นทุน ($\\tfrac{130}{630} \\times 100$) โจทย์ถามผลต่างของร้อยละต่อยอดขาย ซึ่งเป็นจุดร้อยละ" }
      - { match: 130, feedback: "นั่นคือจำนวนพันบาทที่ลดลง ต้องแปลงเป็นร้อยละของยอดขายก่อน" }
    solution: "ก่อน: $\\dfrac{630{,}000}{10{,}000{,}000} \\times 100 = 6.3\\%$ หลัง: $\\dfrac{500{,}000}{10{,}000{,}000} \\times 100 = 5.0\\%$ ลดลง $6.3 - 5.0 = 1.3$ จุดร้อยละ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qt.p015
    topics: [management.quality.concepts]
    difficulty: 4
    type: mcq
    stem: "โรงงานแปรรูปผลไม้กระป๋องได้รับใบรับรอง ISO 9001 แล้ว ข้อใดสรุปได้ถูกต้อง"
    choices:
      - { id: a, text: "หน่วยรับรองภายนอกตรวจแล้วพบว่าระบบบริหารคุณภาพของโรงงานเป็นไปตามข้อกำหนด และโรงงานต้องรักษาระบบไว้เพราะจะถูกตรวจติดตามต่อ", correct: true }
      - { id: b, text: "ผลไม้กระป๋องทุกกระป๋องรับประกันว่าไม่มีของเสียเลย", feedback: "ใบรับรองยืนยันว่าระบบทำงานตามข้อกำหนด ซึ่งช่วยลดของเสีย แต่ไม่ได้รับประกันว่าไม่มีของเสียสักชิ้น" }
      - { id: c, text: "โรงงานไม่ต้องวัดผลหรือปรับปรุงอีก เพราะผ่านมาตรฐานแล้ว", feedback: "การวัดผล (ข้อ 9) และการปรับปรุง (ข้อ 10) เป็นข้อกำหนดที่ต้องทำต่อเนื่อง" }
      - { id: d, text: "ISO เป็นผู้ตรวจและออกใบรับรองให้โรงงานโดยตรง", feedback: "ISO เป็นผู้จัดทำมาตรฐาน ส่วนการตรวจและออกใบรับรองทำโดยหน่วยรับรอง (certification body)" }
    hints:
      - "มาตรฐาน ISO 9001 กำหนดเรื่องของสินค้าแต่ละชิ้น หรือเรื่องของระบบ"
      - "ใครเป็นผู้มาตรวจและออกใบรับรอง และใบรับรองใช้ได้ตลอดไปหรือไม่"
    solution: "ใบรับรอง ISO 9001 ยืนยันว่า **ระบบ** บริหารคุณภาพเป็นไปตามข้อกำหนด ตรวจโดยหน่วยรับรองภายนอก และมีการตรวจติดตามเป็นระยะ โรงงานจึงต้องวัดผลและปรับปรุงต่อเนื่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qt.p016
    topics: [management.quality.concepts]
    difficulty: 4
    type: order
    stem: "เรียงวิวัฒนาการของแนวคิดด้านคุณภาพจากยุคแรกไปยุคหลัง"
    items:
      - "การตรวจสอบ: ตรวจสินค้าสำเร็จรูปแล้วคัดของเสียออก"
      - "การควบคุมคุณภาพ: ใช้สถิติเฝ้าดูกระบวนการผลิต"
      - "การประกันคุณภาพ: วางระบบและเอกสารให้ทำถูกตั้งแต่ต้น"
      - "การบริหารคุณภาพโดยรวม: ทุกคนในองค์กรร่วมปรับปรุงต่อเนื่องโดยมุ่งที่ลูกค้า"
    hints:
      - "ยุคแรกเน้นการคัดของเสียหลังผลิตเสร็จ"
      - "แต่ละยุคขยายจากการแก้ที่ปลายทาง ไปสู่การป้องกันและการมีส่วนร่วมของทั้งองค์กร"
    solution: "การตรวจสอบ → การควบคุมคุณภาพ → การประกันคุณภาพ → การบริหารคุณภาพโดยรวม ยิ่งยุคหลังยิ่งเน้นการป้องกันและครอบคลุมทั้งองค์กร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qt.p017
    topics: [management.quality.concepts]
    difficulty: 4
    type: numeric
    stem: "โรงงานผลิตหม้อหุงข้าว 10,000 เครื่องต่อเดือน มีของเสีย 2% ฝ่ายตรวจสอบตรวจพบของเสียได้ 75% ของเสียที่พบในโรงงานแก้ไขได้ในต้นทุนเครื่องละ 50 บาท ส่วนของเสียที่หลุดไปถึงลูกค้ามีต้นทุนรับคืนและชดเชยเครื่องละ 800 บาท ต้นทุนความล้มเหลว (ภายในรวมภายนอก) ต่อเดือนเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วยบาท)"
    answer: { value: 47500, unit: บาท }
    hints:
      - "หาจำนวนเครื่องเสียทั้งหมดก่อน แล้วแยกเป็นที่ตรวจพบกับที่หลุดไป"
      - "ของเสีย $10{,}000 \\times 0.02$ เครื่อง ตรวจพบ 75% ที่เหลือหลุดไปถึงลูกค้า"
      - "คูณจำนวนแต่ละส่วนกับต้นทุนต่อเครื่องของส่วนนั้น แล้วรวมกัน"
    misconceptions:
      - { match: 10000, feedback: "ดูเหมือนคิดของเสียทุกเครื่องด้วยต้นทุน 50 บาท แต่เครื่องที่หลุดไปถึงลูกค้ามีต้นทุนเครื่องละ 800 บาท" }
      - { match: 160000, feedback: "ดูเหมือนคิดของเสียทุกเครื่องด้วยต้นทุน 800 บาท แต่ 75% ตรวจพบในโรงงานและแก้ได้ในราคาเครื่องละ 50 บาท" }
    solution: "ของเสีย $10{,}000 \\times 0.02 = 200$ เครื่อง ตรวจพบ $200 \\times 0.75 = 150$ เครื่อง หลุดไป $50$ เครื่อง ต้นทุน $= 150 \\times 50 + 50 \\times 800 = 7{,}500 + 40{,}000 = 47{,}500$ บาทต่อเดือน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qt.p018
    topics: [management.quality.concepts]
    difficulty: 5
    type: numeric
    stem: "ต่อจากข้อก่อน (ของเสีย 2% ตรวจพบ 75% ต้นทุนความล้มเหลว 47,500 บาทต่อเดือน) โรงงานพิจารณาซื้อเครื่องทดสอบอัตโนมัติ ทำให้ตรวจพบของเสียได้ 95% แต่ต้นทุนประเมินเพิ่มขึ้นเดือนละ 15,000 บาท ทางเลือกนี้ทำให้ต้นทุนคุณภาพรวมลดลงเดือนละเท่าใด (ตอบเป็นตัวเลขในหน่วยบาท)"
    answer: { value: 15000, unit: บาท }
    hints:
      - "จำนวนของเสียยังเท่าเดิม 200 เครื่อง แต่สัดส่วนที่ตรวจพบเปลี่ยน"
      - "คิดต้นทุนความล้มเหลวใหม่ แล้วบวกต้นทุนประเมินที่เพิ่มขึ้น"
      - "เงินที่ประหยัด = 47,500 − (ต้นทุนความล้มเหลวใหม่ + 15,000)"
    misconceptions:
      - { match: 30000, feedback: "นั่นคือต้นทุนความล้มเหลวที่ลดลง ยังไม่ได้หักค่าเครื่องทดสอบ 15,000 บาทที่เพิ่มขึ้น" }
      - { match: 17500, feedback: "นั่นคือต้นทุนความล้มเหลวใหม่ ไม่ใช่เงินที่ประหยัดได้" }
    solution: "ของเสีย 200 เครื่อง ตรวจพบ $200 \\times 0.95 = 190$ หลุด $10$ ต้นทุนความล้มเหลว $= 190 \\times 50 + 10 \\times 800 = 9{,}500 + 8{,}000 = 17{,}500$ บาท รวมต้นทุนประเมินที่เพิ่ม $17{,}500 + 15{,}000 = 32{,}500$ บาท ประหยัด $47{,}500 - 32{,}500 = 15{,}000$ บาทต่อเดือน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qt.p019
    topics: [management.quality.concepts]
    difficulty: 5
    type: numeric
    stem: "อีกทางเลือกหนึ่งจากสถานการณ์เดิม (ของเสีย 2% ตรวจพบ 75% ต้นทุนความล้มเหลว 47,500 บาทต่อเดือน) คือลงทุนป้องกันเดือนละ 10,000 บาท (อบรมพนักงานและปรับแม่พิมพ์) ทำให้ของเสียลดเหลือ 0.6% โดยฝ่ายตรวจสอบยังตรวจพบ 75% เท่าเดิม ทางเลือกนี้ทำให้ต้นทุนคุณภาพรวมลดลงเดือนละเท่าใด (ตอบเป็นตัวเลขในหน่วยบาท)"
    answer: { value: 23250, unit: บาท }
    hints:
      - "คำนวณจำนวนของเสียใหม่จาก 10,000 เครื่อง × 0.6%"
      - "แยกส่วนที่ตรวจพบ 75% กับส่วนที่หลุดไป แล้วคิดต้นทุนความล้มเหลวใหม่"
      - "เงินที่ประหยัด = 47,500 − (ต้นทุนความล้มเหลวใหม่ + ต้นทุนป้องกันที่เพิ่ม)"
    misconceptions:
      - { match: 33250, feedback: "นั่นคือต้นทุนความล้มเหลวที่ลดลง ยังไม่ได้หักต้นทุนป้องกัน 10,000 บาทที่ลงทุนเพิ่ม" }
      - { match: 14250, feedback: "นั่นคือต้นทุนความล้มเหลวใหม่ ไม่ใช่เงินที่ประหยัดได้" }
    solution: "ของเสีย $10{,}000 \\times 0.006 = 60$ เครื่อง ตรวจพบ $45$ หลุด $15$ ต้นทุนความล้มเหลว $= 45 \\times 50 + 15 \\times 800 = 2{,}250 + 12{,}000 = 14{,}250$ บาท รวมต้นทุนป้องกัน $14{,}250 + 10{,}000 = 24{,}250$ บาท ประหยัด $47{,}500 - 24{,}250 = 23{,}250$ บาทต่อเดือน"
