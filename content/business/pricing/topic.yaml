id: business.marketing.pricing
subject: business
title:
  th: การตั้งราคา ส่วนลด และโปรโมชัน
  en: Pricing, discounts and promotions
summary: ตั้งราคาจากต้นทุนบวกกำไร (markup กับ margin) ตามคู่แข่ง และตามคุณค่า ส่วนลดซ้อน โปรซื้อ 1 แถม 1 ค่าธรรมเนียมแพลตฟอร์ม และผลต่อกำไรและจุดคุ้มทุน
difficulty: 4.5
minutes: 35
