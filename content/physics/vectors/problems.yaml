  - id: phy.vec.p019
    topics: [physics.units.vectors]
    difficulty: 4
    type: expression
    stem: "แรงขนาด $A$ และ $B$ กระทำที่จุดเดียวกัน ทำมุม $\\theta$ ระหว่างกัน วาง $\\vec{A}$ ตามแกน $+x$ แล้วรวมองค์ประกอบ เขียนขนาดของแรงลัพธ์ในรูปของ $A$, $B$ และ $\\theta$"
    prefix: "R ="
    answer: { latex: "\\sqrt{A^2+B^2+2AB\\cos\\theta}", variables: [A, B, theta] }
    hints:
      - "$R_x = A + B\\cos\\theta$ และ $R_y = B\\sin\\theta$"
      - "$R^2 = R_x^2 + R_y^2$ แล้วใช้ $\\sin^2\\theta + \\cos^2\\theta = 1$"
    misconceptions:
      - { match: "\\sqrt{A^2+B^2-2AB\\cos\\theta}", feedback: "นั่นคือกฎของโคไซน์ที่ใช้มุมภายในของสามเหลี่ยมหางต่อหัว ($180^\\circ - \\theta$) ถ้าใช้มุมระหว่างแรงที่ออกจากจุดเดียวกัน เครื่องหมายต้องเป็นบวก ตรวจ: $\\theta = 0$ ต้องได้ $A + B$" }
      - { match: "\\sqrt{A^2+B^2}", feedback: "ใช้ได้เฉพาะเมื่อแรงตั้งฉากกัน ($\\theta = 90^\\circ$)" }
    solution: "$R^2 = (A + B\\cos\\theta)^2 + (B\\sin\\theta)^2 = A^2 + 2AB\\cos\\theta + B^2(\\cos^2\\theta + \\sin^2\\theta)$ จึงได้ $R = \\sqrt{A^2 + B^2 + 2AB\\cos\\theta}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

