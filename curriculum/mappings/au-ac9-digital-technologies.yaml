  - topic: computer.design.user-centred-design
    indicators: [AC9TDI2P01, AC9TDI10P04, AC9TDI4P03, AC9TDI6P04, AC9TDI8P08, AC9TDI10P08, AC9TDI6P03, AC9TDI8P07, AC9TDI10P07]
    coverage: partial
