  ai_assisted: true
- id: math.de.fourier-series.p012
  topics:
  - math.de.fourier-series
  difficulty: 3
  type: order
  stem: 'เรียงขั้นตอนการหาอนุกรมฟูเรียร์ของฟังก์ชันคาบที่กำหนดบนหนึ่งคาบ ตามลำดับที่ถูกต้อง'
  items:
  - ระบุคาบ $2L$ และเขียนช่วงหนึ่งคาบให้สมมาตรรอบศูนย์เป็น $(-L, L)$
  - ตรวจว่าฟังก์ชันเป็นคู่หรือคี่บนช่วง $(-L, L)$ เพื่อลดรูปอนุกรม
  - หาสัมประสิทธิ์ $a_0$, $a_n$ และ $b_n$ ด้วยปริพันธ์บนหนึ่งคาบ
  - เขียนอนุกรมโดยรวมพจน์ของฮาร์มอนิกทุกลำดับที่ได้
  hints:
  - ก่อนหาสัมประสิทธิ์ต้องรู้คาบและช่วงของการอินทิเกรตก่อน
  - ขั้นสุดท้ายเป็นการรวมผลของทุกขั้นเป็นอนุกรม
  solution: หาคาบและ $L$ ก่อน ตรวจความเป็นคู่หรือคี่ หาสัมประสิทธิ์ด้วยปริพันธ์ แล้วเขียนเป็นอนุกรม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: math.de.fourier-series.p013
  topics:
