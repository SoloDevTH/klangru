id: math.number.fractions
subject: math
title: { th: เศษส่วน, en: Fractions }
summary: เข้าใจเศษส่วนเป็นส่วนแบ่งที่เท่ากัน ทำให้เป็นเศษส่วนอย่างต่ำ บวก ลบ คูณ หารเศษส่วน และแปลงระหว่างเศษส่วนกับทศนิยม
difficulty: 2
minutes: 35
prerequisites: [math.number.integers, math.number.factors-multiples]
encompasses:
  - { id: math.number.integers, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: number-lines.svg
    alt: "เส้นจำนวนสามเส้นจาก 0 ถึง 1 วางตรงกัน เส้นบนแบ่งเป็น 2 ส่วน เส้นกลางแบ่งเป็น 4 ส่วนมีป้าย 1/4, 2/4, 3/4 เส้นล่างแบ่งเป็น 8 ส่วนมีป้าย 1/8 ถึง 7/8 เส้นประแนวตั้งลากผ่าน 1/2, 2/4 และ 4/8 ซึ่งอยู่ตำแหน่งเดียวกัน"
    caption: "$\\tfrac{1}{2} = \\tfrac{2}{4} = \\tfrac{4}{8}$ อยู่ที่จุดเดียวกันบนเส้นจำนวน และยิ่งตัวส่วนมาก ช่วงยิ่งสั้น"
  - { type: check, problem: math.frac.p011, prompt: "ดูภาพแล้วบอกว่าส่วนที่ระบายคือเศษส่วนใด" }
  - type: worked-example
    title: เปรียบเทียบเศษส่วนที่ตัวส่วนต่างกัน
    problem: "$\\tfrac{5}{8}$ กับ $\\tfrac{3}{5}$ จำนวนใดมากกว่า"
    steps:
      - text: "ประมาณก่อน: ครึ่งของ 8 คือ 4 และครึ่งของ 5 คือ 2.5 ทั้ง $\\tfrac{5}{8}$ และ $\\tfrac{3}{5}$ จึงมากกว่าครึ่ง ตัดสินด้วยการเทียบกับครึ่งไม่ได้"
        why: "เทียบกับครึ่งเร็วที่สุด ถ้าใช้ได้ไม่ต้องคำนวณต่อ"
      - text: "ตัวส่วนร่วมที่น้อยที่สุดคือ ค.ร.น. ของ 8 และ 5 คือ 40"
      - text: "$\\tfrac{5}{8} = \\tfrac{5 \\times 5}{8 \\times 5} = \\tfrac{25}{40}$ และ $\\tfrac{3}{5} = \\tfrac{3 \\times 8}{5 \\times 8} = \\tfrac{24}{40}$"
        why: "คูณทั้งตัวเศษและตัวส่วนด้วยจำนวนเดียวกัน ค่าไม่เปลี่ยน แต่ตอนนี้ชิ้นมีขนาดเท่ากันแล้ว"
      - text: "ชิ้นขนาด $\\tfrac{1}{40}$ เท่ากัน จึงเทียบตัวเศษ: $25 > 24$"
    answer: "$\\tfrac{5}{8} > \\tfrac{3}{5}$ (มากกว่าอยู่ $\\tfrac{1}{40}$)"
  - { type: check, problem: math.frac.p013, prompt: "ลองเทียบกับครึ่งหนึ่งดู" }
  - type: worked-example
    title: คูณเศษส่วนด้วยแบบจำลองพื้นที่
    problem: "หาค่า $\\tfrac{3}{5} \\times \\tfrac{2}{3}$ โดยใช้พื้นที่ในสี่เหลี่ยมจัตุรัสหนึ่งหน่วย"
    figure: { src: area-3-5x2-3.svg, alt: "สี่เหลี่ยมจัตุรัสด้านยาว 1 หน่วย แบ่งแนวตั้งเป็น 5 คอลัมน์และแนวนอนเป็น 3 แถว รวม 15 ช่อง ด้านบนกำกับ 3/5 ครอบ 3 คอลัมน์ ด้านซ้ายกำกับ 2/3 ครอบ 2 แถว ช่องที่อยู่ทั้งใน 3 คอลัมน์และ 2 แถวระบายสีเข้ม 6 ช่อง" }
    steps:
      - text: "แบ่งสี่เหลี่ยมหนึ่งหน่วยตามแนวตั้งเป็น 5 ส่วน ระบาย 3 ส่วน แทน $\\tfrac{3}{5}$"
      - text: "แบ่งตามแนวนอนเป็น 3 ส่วน เลือก 2 แถว แทน $\\tfrac{2}{3}$"
      - text: "ทั้งสี่เหลี่ยมมี $5 \\times 3 = 15$ ช่องเท่ากัน ส่วนที่ซ้อนกัน (สีเข้ม) มี $3 \\times 2 = 6$ ช่อง"
        why: "จำนวนช่องทั้งหมดคือ ส่วน × ส่วน และช่องที่ซ้อนกันคือ เศษ × เศษ จึงเป็นที่มาของกฎ เศษคูณเศษ ส่วนคูณส่วน"
      - text: "พื้นที่ส่วนที่ซ้อนกันคือ $\\tfrac{6}{15}$ ทำเป็นอย่างต่ำด้วยการหาร 3 ได้ $\\tfrac{2}{5}$"
      - text: "ตรวจ: ผลคูณ $\\tfrac{2}{5}$ น้อยกว่า $\\tfrac{3}{5}$ เพราะคูณด้วย $\\tfrac{2}{3}$ ซึ่งน้อยกว่า 1 ✓"
    answer: "$\\tfrac{3}{5} \\times \\tfrac{2}{3} = \\tfrac{6}{15} = \\tfrac{2}{5}$"
  - type: simulation
    title: แบ่งพิซซ่าและแท่งช็อกโกแลต (PhET Fractions Intro)
    url: https://phet.colorado.edu/en/simulations/fractions-intro
    provider: phet
    note: ลองเปลี่ยนตัวส่วนเป็น 2, 3, 4 แล้วสังเกตว่าชิ้นเล็กลงเรื่อย ๆ ขณะที่ตัวเศษบอกจำนวนชิ้นที่หยิบมา
glossary:
  - { term: "ตัวเศษ", definition: "ตัวเลขด้านบนของเศษส่วน บอกว่าหยิบมากี่ส่วน" }
  - { term: "ตัวส่วน", definition: "ตัวเลขด้านล่างของเศษส่วน บอกว่าแบ่งทั้งหมดออกเป็นกี่ส่วนเท่า ๆ กัน (ห้ามเป็น 0)" }
  - { term: "เศษส่วนอย่างต่ำ", definition: "เศษส่วนที่ตัวเศษและตัวส่วนไม่มีตัวประกอบร่วมนอกจาก 1 เช่น $\\tfrac{2}{3}$" }
  - { term: "ส่วนกลับ", definition: "เศษส่วนที่สลับตัวเศษกับตัวส่วน เช่น ส่วนกลับของ $\\tfrac{3}{4}$ คือ $\\tfrac{4}{3}$" }
flashcards:
  - { front: "บวกเศษส่วนที่ตัวส่วนไม่เท่ากันอย่างไร", back: "ทำตัวส่วนให้เท่ากันก่อน (ใช้ ค.ร.น.) แล้วบวกเฉพาะตัวเศษ เช่น $\\tfrac{1}{2} + \\tfrac{1}{3} = \\tfrac{3}{6} + \\tfrac{2}{6} = \\tfrac{5}{6}$" }
  - { front: "หารเศษส่วนอย่างไร", back: "คูณด้วยส่วนกลับของตัวหาร เช่น $\\tfrac{3}{4} \\div \\tfrac{1}{2} = \\tfrac{3}{4} \\times \\tfrac{2}{1} = \\tfrac{3}{2}$" }
  - { front: "ทำ $\\tfrac{12}{18}$ ให้เป็นเศษส่วนอย่างต่ำ", back: "หารทั้งเศษและส่วนด้วย ห.ร.ม. คือ 6 ได้ $\\tfrac{2}{3}$" }
  - { front: "$0.75$ เป็นเศษส่วนอย่างต่ำคืออะไร", back: "$0.75 = \\tfrac{75}{100}$ หารด้วย 25 ทั้งเศษและส่วน ได้ $\\tfrac{3}{4}$" }
