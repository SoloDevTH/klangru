  - id: computer.algorithms.efficiency.p014
    topics: [computer.algorithms.efficiency]
    difficulty: 5
    type: mcq
    stem: |
      นักเรียนดัดแปลงทวิภาคหาดัชนีแรกที่ค่าไม่น้อยกว่า target แต่บางครั้งโปรแกรมค้าง เช่น `search([10, 20], 20)` สาเหตุคืออะไร

      ```python
      def search(a, target):
          low, high = 0, len(a) - 1
          while low < high:
              mid = (low + high) // 2
              if a[mid] < target:
                  low = mid
              else:
                  high = mid
          return low
      ```
    choices:
      - { id: a, text: "เมื่อ high = low + 1 จะได้ mid = low ถ้า a[mid] < target แล้ว low = mid ช่วงไม่หด วงวนจึงไม่จบ ต้องแก้เป็น low = mid + 1", correct: true }
      - { id: b, text: "ลิสต์ [10, 20] ยังไม่เรียง", feedback: "ลิสต์เรียงจากน้อยไปมากแล้ว ปัญหาอยู่ที่ช่วงไม่หด" }
      - { id: c, text: "ต้องเปลี่ยน while low < high เป็น while low <= high", feedback: "ทำให้แย่ลง เมื่อ low = high วงวนยังทำต่อและ high = mid ไม่เปลี่ยนค่า จึงค้างได้อีก" }
      - { id: d, text: "(low + high) // 2 ให้ค่าทศนิยม", feedback: "// เป็นการหารปัดเศษทิ้ง ได้จำนวนเต็มเสมอ" }
    hints:
      - "ไล่ค่า low, high, mid ของ search([10, 20], 20) สองสามรอบ"
      - "การพิสูจน์ว่าวงวนจบต้องมีปริมาณที่ลดลงทุกรอบ ในโค้ดนี้ high − low ลดลงทุกรอบหรือไม่"
    solution: "รอบแรก low = 0, high = 1, mid = 0 a[0] = 10 < 20 จึง low = 0 เหมือนเดิม ทุกรอบต่อไปก็เหมือนเดิม วงวนไม่จบ แก้เป็น low = mid + 1 แล้ว high − low ลดลงทุกรอบ (ได้คำตอบ 1)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.efficiency.p015
