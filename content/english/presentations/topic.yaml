id: english.speaking.presentations
subject: english
title: { th: "การนำเสนอและการฟังบรรยาย: โครงสร้างและคำบอกทิศทาง (ระดับ B2)", en: "Presentations and lectures: structure and signposting (B2)" }
summary: ใช้โครงสร้างการนำเสนอสามส่วนและคำบอกทิศทางให้ผู้ฟังตามได้ อธิบายกระบวนการและแผนภูมิ จดโน้ตจากบทบรรยาย และเน้นประเด็นสำคัญ
difficulty: 5.5
minutes: 50
prerequisites: [english.reading.research-skills, english.speaking.feelings-opinions]
encompasses:
  - { id: english.reading.research-skills, weight: 0.3 }
  - { id: english.speaking.feelings-opinions, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: talk-outline.svg
    alt: "แผนภาพโครงสร้างการนำเสนอสามกรอบเรียงจากซ้ายไปขวา กรอบแรกคือส่วนเปิด มีประโยค Good morning, everyone. Today I'm going to talk about plastic waste. และ My presentation is divided into three parts. กรอบที่สองคือส่วนเนื้อหา มีประโยค First of all, Moving on to my second point, Let me give you an example. และ What's really important is กรอบที่สามคือส่วนสรุปปิด มีประโยค To sum up, Thank you for listening. และ Any questions? ลูกศรสองเส้นเชื่อมแต่ละส่วน"
    caption: "โครงสร้างการนำเสนอและคำบอกทิศทางในแต่ละส่วน"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.speaking.presentations.p003, prompt: "วลีบอกทิศทางแต่ละวลีทำหน้าที่อะไร" }
  - type: worked-example
    title: บรรยายแผนภูมิแท่งจากตัวเลข
    problem: "แผนภูมิแท่งแสดงน้ำหนักขวดพลาสติกที่โรงเรียนเก็บได้ต่อเดือน (ข้อมูลสมมุติ) ให้บรรยายช่วงมกราคมถึงมีนาคมด้วยประโยคภาษาอังกฤษสี่ประโยคให้ผู้ฟังเข้าใจ"
    figure:
      src: recycling-bars.svg
      alt: "แผนภูมิแท่งข้อมูลสมมุติ แสดงน้ำหนักขวดพลาสติกที่โรงเรียนเก็บได้ต่อเดือน มกราคม 42 กิโลกรัม กุมภาพันธ์ 58 กิโลกรัม มีนาคม 35 กิโลกรัม เมษายน 71 กิโลกรัม และพฤษภาคม 64 กิโลกรัม"
      caption: "แผนภูมิแท่งที่ใช้ในตัวอย่าง (ข้อมูลสมมุติ)"
    steps:
      - text: "บอกว่าแผนภูมิแสดงอะไร: *The bar chart shows the weight of plastic bottles collected each month, in kilograms.*"
        why: "ประโยคแรกบอกหัวข้อและหน่วยของข้อมูลเสมอ แท่งแสดงน้ำหนักเป็นกิโลกรัม ไม่ใช่จำนวนขวด"
      - text: "บอกจุดเริ่มต้น: *In January, the school collected 42 kg.*"
        why: "อ่านค่าจากตัวเลขบนแท่ง ไม่ต้องเดาจากความสูง"
      - text: "บรรยายการเพิ่มขึ้น: *Figures rose to 58 kg in February.*"
        why: "จาก 42 เป็น 58 เพิ่มขึ้น 16 kg ใช้ rose ซึ่งเป็นอดีตของ rise"
      - text: "บรรยายการลดลงที่เด่น: *Then there was a sharp fall in March, to 35 kg.*"
        why: "จาก 58 เป็น 35 ลดลง 23 kg หรือราว 40% ซึ่งมาก จึงใช้ sharp ไม่ใช่ slight"
    answer: "The bar chart shows the weight of plastic bottles collected each month, in kilograms. In January, the school collected 42 kg. Figures rose to 58 kg in February. Then there was a sharp fall in March, to 35 kg."
  - { type: check, problem: english.speaking.presentations.p005, prompt: "วลีใดเน้นประเด็นสำคัญ" }
  - type: worked-example
    title: อธิบายขั้นตอนด้วยคำเรียงลำดับและ passive voice
    problem: "อธิบายขั้นตอนการจัดการขวดพลาสติกของโรงเรียนในการนำเสนอ โดยใช้คำเรียงลำดับและ passive voice"
    steps:
      - text: "ขั้นแรก: *First, the bottles are collected from each classroom.*"
        why: "First บอกว่าเป็นขั้นแรก และ are collected เน้นว่าขวดถูกเก็บ ไม่ได้เน้นผู้เก็บ"
      - text: "ขั้นถัดมา: *Then the labels are removed and the bottles are washed.*"
        why: "Then บอกลำดับต่อจากขั้นแรก"
      - text: "ขั้นกลาง: *After that, they are sorted by colour.*"
        why: "After that บอกว่าขั้นนี้เกิดหลังจากขั้นก่อนหน้า"
      - text: "ขั้นสุดท้าย: *Finally, they are sent to a recycling centre.*"
        why: "Finally บอกว่าเป็นขั้นสุดท้าย ประโยคแบบ passive ทำให้ผู้ฟังเห็นการกระทำชัด"
    answer: "First, the bottles are collected from each classroom. Then the labels are removed and the bottles are washed. After that, they are sorted by colour. Finally, they are sent to a recycling centre."
glossary:
  - { term: signposting, definition: "คำบอกทิศทาง วลีที่บอกผู้ฟังว่าผู้พูดกำลังเปลี่ยนเรื่อง ขยายประเด็น หรือสรุป" }
  - { term: transcript, definition: "บทถอดความ ข้อความที่เขียนตามคำพูดที่บันทึกไว้ เช่น บทบรรยายที่ใช้แทนเสียง" }
  - { term: passive voice, definition: "รูปประโยคถูกกระทำ เช่น The bottles are collected ใช้เน้นสิ่งที่เกิดขึ้น" }
  - { term: bar chart, definition: "แผนภูมิแท่ง ใช้เปรียบเทียบค่าของแต่ละหมวดด้วยความสูงของแท่ง" }
  - { term: sharp rise, definition: "การเพิ่มขึ้นอย่างรวดเร็วและเห็นได้ชัด" }
  - { term: key point, definition: "ประเด็นสำคัญที่ผู้พูดต้องการให้ผู้ฟังจำ" }
flashcards:
  - { front: "ประโยคเปิดการนำเสนอ", back: "Good morning, everyone. Today I'm going to talk about ..." }
  - { front: "ขึ้นประเด็นแรก", back: "First of all, ... หรือ To begin with, ..." }
  - { front: "เปลี่ยนไปประเด็นถัดไป", back: "Moving on to my second point, ..." }
  - { front: "เน้นประเด็นสำคัญ", back: "What's really important is ... หรือ The key thing to remember is ..." }
  - { front: "ส่วนสรุปปิด", back: "To sum up, ... Thank you for listening. Any questions?" }
