  - id: math.calculus.tangent-planes.p017
    topics: [math.calculus.tangent-planes]
    difficulty: 4
    type: numeric
    stem: "กองข้าวเปลือกบนลานตากในสุพรรณบุรีเป็นรูปกรวย $V = \\tfrac13\\pi r^2h$ เดิมรัศมี 3 m สูง 2 m ระหว่างวันชาวนาเกลี่ยกองข้าวให้รัศมีเพิ่ม 0.05 m และความสูงลด 0.04 m (ค่าสมมติ) จงใช้ผลต่างเชิงอนุพันธ์ประมาณการเปลี่ยนแปลงของปริมาตรเป็นลูกบาศก์เมตร (ตอบทศนิยมสามตำแหน่ง)"
    answer: { value: 0.251, tolerance: 0.003, unit: m³ }
    misconceptions:
      - { match: 1.005, feedback: "ใช้ $dh = +0.04$ ทั้งที่ความสูงลดลง ต้องใช้ $dh = -0.04$" }
      - { match: 0.754, feedback: "ลืม $\\tfrac13$ ของปริมาตรกรวย" }
    hints:
      - "$dV = \\tfrac23\\pi rh\\,dr + \\tfrac13\\pi r^2\\,dh$"
      - "$dr = 0.05$ และ $dh = -0.04$"
    solution: "$dV = \\tfrac23\\pi(3)(2)(0.05) + \\tfrac13\\pi(9)(-0.04) = 0.2\\pi - 0.12\\pi = 0.08\\pi \\approx 0.251\\ \\mathrm{m^3}$ (ค่าจริง $\\approx 0.244$)"
