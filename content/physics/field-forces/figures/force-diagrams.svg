<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" font-family="sans-serif" font-size="14">
<title>แผนภาพแรงของวัตถุในสนามโน้มถ่วง สนามไฟฟ้า และสนามแม่เหล็ก</title>
<rect x="0" y="0" width="780" height="360" fill="#ffffff"/>
<text x="120.0" y="28.0" text-anchor="middle" fill="#15211e" font-size="14" font-weight="bold">ก. มะม่วงกำลังหล่น</text>
<circle cx="120.0" cy="170.0" r="16.0" fill="#f3d36b" stroke="#15211e" stroke-width="2"/>
<line x1="120.0" y1="170.0" x2="120.0" y2="250.7" stroke="#1f5fa8" stroke-width="3"/>
<polygon points="120.0,260.0 125.0,249.0 115.0,249.0" fill="#1f5fa8" stroke="#1f5fa8" stroke-width="1" stroke-linejoin="round"/>
<text x="134.0" y="245.0" text-anchor="start" fill="#1f5fa8" font-size="14" font-weight="bold">W</text>
<text x="120.0" y="332.0" text-anchor="middle" fill="#15211e" font-size="13">แรงโน้มถ่วงของโลก (น้ำหนัก)</text>
<text x="120.0" y="350.0" text-anchor="middle" fill="#777" font-size="12">(ไม่คิดแรงต้านอากาศ)</text>
<text x="400.0" y="28.0" text-anchor="middle" fill="#15211e" font-size="14" font-weight="bold">ข. ลูกโป่งมีประจุลบใกล้แท่งประจุบวก</text>
<line x1="390.0" y1="60.0" x2="470.0" y2="60.0" stroke="#15211e" stroke-width="3"/>
<line x1="390.0" y1="60.0" x2="398.0" y2="52.0" stroke="#777" stroke-width="1"/>
<line x1="402.0" y1="60.0" x2="410.0" y2="52.0" stroke="#777" stroke-width="1"/>
<line x1="414.0" y1="60.0" x2="422.0" y2="52.0" stroke="#777" stroke-width="1"/>
<line x1="426.0" y1="60.0" x2="434.0" y2="52.0" stroke="#777" stroke-width="1"/>
<line x1="438.0" y1="60.0" x2="446.0" y2="52.0" stroke="#777" stroke-width="1"/>
<line x1="450.0" y1="60.0" x2="458.0" y2="52.0" stroke="#777" stroke-width="1"/>
<line x1="462.0" y1="60.0" x2="470.0" y2="52.0" stroke="#777" stroke-width="1"/>
<line x1="430.0" y1="60.0" x2="382.1" y2="191.6" stroke="#777" stroke-width="1.5"/>
<rect x="232.0" y="131.6" width="22.0" height="120.0" rx="0" fill="#f6d5d1" stroke="#15211e" stroke-width="1.5"/>
<text x="243.0" y="151.6" text-anchor="middle" fill="#c0392b" font-size="16" font-weight="bold">+</text>
<text x="243.0" y="178.6" text-anchor="middle" fill="#c0392b" font-size="16" font-weight="bold">+</text>
<text x="243.0" y="205.6" text-anchor="middle" fill="#c0392b" font-size="16" font-weight="bold">+</text>
<text x="243.0" y="232.6" text-anchor="middle" fill="#c0392b" font-size="16" font-weight="bold">+</text>
<circle cx="382.1" cy="191.6" r="20.0" fill="#dfe8f5" stroke="#15211e" stroke-width="2"/>
<text x="382.1" y="196.6" text-anchor="middle" fill="#1f5fa8" font-size="18" font-weight="bold">−</text>
<line x1="382.1" y1="191.6" x2="382.1" y2="282.2" stroke="#1f5fa8" stroke-width="3"/>
<polygon points="382.1,291.6 387.1,280.6 377.2,280.6" fill="#1f5fa8" stroke="#1f5fa8" stroke-width="1" stroke-linejoin="round"/>
<text x="390.1" y="287.6" text-anchor="start" fill="#1f5fa8" font-size="14" font-weight="bold">W</text>
<line x1="382.1" y1="191.6" x2="355.1" y2="191.6" stroke="#c0392b" stroke-width="3"/>
<polygon points="345.7,191.6 356.7,196.5 356.7,186.6" fill="#c0392b" stroke="#c0392b" stroke-width="1" stroke-linejoin="round"/>
<text x="341.7" y="183.6" text-anchor="end" fill="#c0392b" font-size="14" font-weight="bold">F</text>
<line x1="382.1" y1="191.6" x2="415.3" y2="100.3" stroke="#1e7a3c" stroke-width="3"/>
<polygon points="418.5,91.6 410.1,100.2 419.4,103.6" fill="#1e7a3c" stroke="#1e7a3c" stroke-width="1" stroke-linejoin="round"/>
<text x="428.5" y="105.6" text-anchor="start" fill="#1e7a3c" font-size="14" font-weight="bold">T</text>
<text x="400.0" y="332.0" text-anchor="middle" fill="#15211e" font-size="13">F = แรงไฟฟ้า (ดูดเข้าหาแท่ง)</text>
<text x="400.0" y="350.0" text-anchor="middle" fill="#777" font-size="12">T = แรงตึงเชือก</text>
<text x="660.0" y="28.0" text-anchor="middle" fill="#15211e" font-size="14" font-weight="bold">ค. คลิปเหล็กลอยใต้แม่เหล็ก</text>
<rect x="620.0" y="48.0" width="40.0" height="24.0" rx="0" fill="#e8b4b0" stroke="#15211e" stroke-width="1.5"/>
<rect x="660.0" y="48.0" width="40.0" height="24.0" rx="0" fill="#b9cde8" stroke="#15211e" stroke-width="1.5"/>
<text x="640.0" y="65.0" text-anchor="middle" fill="#15211e" font-size="14" font-weight="bold">N</text>
<text x="680.0" y="65.0" text-anchor="middle" fill="#15211e" font-size="14" font-weight="bold">S</text>
<rect x="646.0" y="144.0" width="28.0" height="12.0" rx="6" fill="#cccccc" stroke="#15211e" stroke-width="1.5"/>
<line x1="660.0" y1="156.0" x2="660.0" y2="300.0" stroke="#777" stroke-width="1.5"/>
<line x1="610.0" y1="300.0" x2="710.0" y2="300.0" stroke="#15211e" stroke-width="3"/>
<line x1="610.0" y1="300.0" x2="618.0" y2="308.0" stroke="#777" stroke-width="1"/>
<line x1="622.0" y1="300.0" x2="630.0" y2="308.0" stroke="#777" stroke-width="1"/>
<line x1="634.0" y1="300.0" x2="642.0" y2="308.0" stroke="#777" stroke-width="1"/>
<line x1="646.0" y1="300.0" x2="654.0" y2="308.0" stroke="#777" stroke-width="1"/>
<line x1="658.0" y1="300.0" x2="666.0" y2="308.0" stroke="#777" stroke-width="1"/>
<line x1="670.0" y1="300.0" x2="678.0" y2="308.0" stroke="#777" stroke-width="1"/>
<line x1="682.0" y1="300.0" x2="690.0" y2="308.0" stroke="#777" stroke-width="1"/>
<line x1="694.0" y1="300.0" x2="702.0" y2="308.0" stroke="#777" stroke-width="1"/>
<line x1="706.0" y1="300.0" x2="714.0" y2="308.0" stroke="#777" stroke-width="1"/>
<line x1="660.0" y1="150.0" x2="660.0" y2="84.3" stroke="#7b3fa0" stroke-width="3"/>
<polygon points="660.0,75.0 655.0,86.0 665.0,86.0" fill="#7b3fa0" stroke="#7b3fa0" stroke-width="1" stroke-linejoin="round"/>
<text x="670.0" y="90.0" text-anchor="start" fill="#7b3fa0" font-size="14" font-weight="bold">F</text>
<text x="682.0" y="90.0" text-anchor="start" fill="#7b3fa0" font-size="12">แม่เหล็ก</text>
<line x1="646.0" y1="150.0" x2="646.0" y2="170.7" stroke="#1f5fa8" stroke-width="3"/>
<polygon points="646.0,180.0 651.0,169.0 641.0,169.0" fill="#1f5fa8" stroke="#1f5fa8" stroke-width="1" stroke-linejoin="round"/>
<text x="640.0" y="180.0" text-anchor="end" fill="#1f5fa8" font-size="14" font-weight="bold">W</text>
<line x1="674.0" y1="150.0" x2="674.0" y2="185.7" stroke="#1e7a3c" stroke-width="3"/>
<polygon points="674.0,195.0 679.0,184.0 669.0,184.0" fill="#1e7a3c" stroke="#1e7a3c" stroke-width="1" stroke-linejoin="round"/>
<text x="680.0" y="194.0" text-anchor="start" fill="#1e7a3c" font-size="14" font-weight="bold">T</text>
<text x="660.0" y="332.0" text-anchor="middle" fill="#15211e" font-size="13">แรงแม่เหล็กขึ้น = W + T</text>
<text x="660.0" y="350.0" text-anchor="middle" fill="#777" font-size="12">(ด้ายผูกไว้กับโต๊ะ)</text>
</svg>
