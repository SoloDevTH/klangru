id: math.algebra.expressions
subject: math
title: { th: นิพจน์พีชคณิต, en: Algebraic expressions }
summary: ใช้ตัวแปรแทนจำนวนที่ยังไม่รู้ค่า รู้จักพจน์และพจน์คล้าย รวมพจน์คล้าย แทนค่าตัวแปร และกระจายวงเล็บ
difficulty: 2.5
minutes: 30
prerequisites: [math.number.integers, math.number.fractions]
encompasses:
  - { id: math.number.integers, weight: 0.3 }
  - { id: math.number.fractions, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: simulation
    title: รวมพจน์คล้ายด้วยเหรียญ (PhET Expression Exchange)
    url: https://phet.colorado.edu/en/simulations/expression-exchange
    provider: phet
    note: ลองลากพจน์ที่มีตัวแปรเหมือนกันมาซ้อนกัน แล้วดูว่าสัมประสิทธิ์รวมกันอย่างไร พจน์ที่ตัวแปรต่างกันจะรวมกันไม่ได้
glossary:
  - { term: "ตัวแปร", definition: "ตัวอักษร เช่น $x$ หรือ $y$ ที่ใช้แทนจำนวนที่ยังไม่รู้ค่าหรือเปลี่ยนค่าได้" }
  - { term: "พจน์", definition: "ส่วนของนิพจน์ที่คั่นด้วยเครื่องหมายบวกหรือลบ เช่น $5x - 3y + 7$ มี 3 พจน์" }
  - { term: "สัมประสิทธิ์", definition: "ตัวเลขที่คูณอยู่หน้าตัวแปร รวมเครื่องหมายด้วย เช่น สัมประสิทธิ์ของ $y$ ใน $-3y$ คือ $-3$" }
  - { term: "พจน์คล้าย", definition: "พจน์ที่มีตัวแปรและเลขชี้กำลังเหมือนกันทุกประการ เช่น $4a$ กับ $-a$ จึงนำมารวมกันได้" }
flashcards:
  - { front: "$3x$ หมายถึงอะไร", back: "$3 \\times x$ ถ้า $x = 4$ จะได้ $3x = 12$ ไม่ใช่ 34" }
  - { front: "รวม $4a + 3b - a + 5b$", back: "รวม $a$ กับ $a$: $4a - a = 3a$ รวม $b$ กับ $b$: $3b + 5b = 8b$ ได้ $3a + 8b$" }
  - { front: "กระจาย $-2(3x - 5)$", back: "คูณ $-2$ เข้าทุกพจน์ในวงเล็บ: $-6x + 10$" }
  - { front: "$2a$ กับ $2b$ รวมกันได้หรือไม่", back: "ไม่ได้ เพราะตัวแปรต่างกัน จึงไม่ใช่พจน์คล้าย คำตอบคง $2a + 2b$ ไว้" }
