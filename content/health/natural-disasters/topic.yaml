id: health.safety.natural-disasters
subject: health
title: { th: ภัยธรรมชาติและการปฏิบัติตนเพื่อความปลอดภัย, en: "Natural disasters and how to stay safe" }
summary: น้ำท่วม ดินถล่ม พายุและฟ้าผ่า แผ่นดินไหว สึนามิ และอากาศร้อนจัด ผลกระทบต่อร่างกาย จิตใจ และสังคม การติดตามประกาศเตือนภัย ถุงยังชีพ และการปฏิบัติตนก่อน ระหว่าง และหลังเกิดภัย
difficulty: 2.5
minutes: 35
prerequisites: [health.safety.road-water]
encompasses:
  - { id: health.safety.road-water, weight: 0.15 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: หมอบ ป้อง เกาะ
    src: drop-cover-hold.svg
    alt: "ภาพสามช่อง วิธีปฏิบัติเมื่อเกิดแผ่นดินไหวตามคำแนะนำของ ปภ. ช่อง 1 หมอบ คนคุกเข่าลงข้างโต๊ะ ลูกศรชี้ให้มุดลงใต้โต๊ะที่แข็งแรง ช่อง 2 ป้อง คนขดตัวอยู่ใต้โต๊ะ ใช้แขนกำบังศีรษะ ช่อง 3 เกาะ คนอยู่ใต้โต๊ะ มือข้างหนึ่งจับขาโต๊ะไว้แน่น"
    caption: "ทำระหว่างพื้นสั่น เมื่อหยุดสั่นจึงออกจากอาคารสูง"
  - type: worked-example
    title: ฟ้าผ่าอยู่ไกลแค่ไหน
    problem: "ระหว่างเล่นที่สนาม มายด์เห็นฟ้าแลบ แล้วนับได้ 12 วินาทีจึงได้ยินเสียงฟ้าร้อง ฟ้าผ่าอยู่ห่างประมาณกี่กิโลเมตร และควรทำอย่างไร"
    steps:
      - text: "แสงมาถึงตาแทบทันที แต่เสียงเดินทางราว 1 กิโลเมตรในเวลาประมาณ 3 วินาที"
      - text: "ระยะทาง: 12 ÷ 3 = 4 กิโลเมตร"
      - text: "ได้ยินเสียงฟ้าร้องแปลว่าอยู่ใกล้พอที่ฟ้าอาจผ่าถึงได้ จึงต้องเข้าไปในอาคารหรือรถยนต์ทันที ไม่หลบใต้ต้นไม้"
        why: "กรมอุตุนิยมวิทยาสหรัฐอเมริกาแนะนำว่า ไม่มีที่ใดกลางแจ้งปลอดภัยเมื่อมีฟ้าคะนอง"
      - text: "รอ 30 นาทีหลังได้ยินฟ้าร้องครั้งสุดท้ายจึงออกมาเล่นต่อ"
    answer: "ประมาณ 4 กิโลเมตร ต้องเข้าอาคารทันทีและรอ 30 นาทีหลังฟ้าร้องครั้งสุดท้าย"
  - { type: check, problem: health.safety.natural-disasters.p006, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: figure
    title: น้ำไหลเชี่ยวไม่ลึกก็อันตราย
    src: flood-depth.svg
    alt: "ภาพวาดตามสัดส่วน ด้านซ้ายคนยืนในน้ำที่ไหลเชี่ยวลึกราว 15 เซนติเมตร ระดับต่ำกว่าเข่ามาก เขียนว่าผู้ใหญ่ล้มได้ ด้านขวารถยนต์ในน้ำที่ไหลเชี่ยวลึกราว 30 เซนติเมตร ท่วมแค่ครึ่งล่างของล้อ เขียนว่าพัดรถยนต์ส่วนใหญ่ได้ ข้อมูลกรมอุตุนิยมวิทยาสหรัฐอเมริกา"
    caption: "อย่าเดินหรือขับรถผ่านน้ำที่ไหลเชี่ยว ใต้น้ำอาจมีถนนพังหรือหลุม"
  - type: worked-example
    title: วิเคราะห์ผลกระทบของน้ำท่วม
    problem: "น้ำท่วมหมู่บ้านริมแม่น้ำนาน 2 สัปดาห์ จงบอกผลกระทบด้านร่างกาย จิตใจ และสังคม พร้อมวิธีลดผลกระทบแต่ละด้าน"
    steps:
      - text: "ด้านร่างกาย: น้ำกัดเท้า อุจจาระร่วง ไฟดูด สัตว์มีพิษกัด ลดได้ด้วยการล้างเท้าให้แห้ง ดื่มน้ำสะอาด ตัดไฟ และระวังสัตว์"
      - text: "ด้านจิตใจ: กลัว เครียด นอนไม่หลับ ลดได้ด้วยการอยู่กับครอบครัว พูดคุยความรู้สึก และขอคำปรึกษาเมื่อไม่ดีขึ้น"
        why: "ความกลัวหลังภัยพิบัติเป็นเรื่องปกติ แต่ไม่ควรเก็บไว้คนเดียว"
      - text: "ด้านสังคม: โรงเรียนปิด ขาดรายได้ ถนนตัดขาด ลดได้ด้วยการช่วยเหลือกันในชุมชน ศูนย์พักพิง และความช่วยเหลือจากหน่วยงานรัฐ"
      - text: "สิ่งที่ช่วยลดผลกระทบทุกด้าน คือการเตรียมพร้อมก่อนเกิดภัย เช่น ติดตามประกาศ ถุงยังชีพ และแผนอพยพ"
    answer: "ร่างกาย-โรคและการบาดเจ็บ จิตใจ-ความกลัวความเครียด สังคม-การเรียนและรายได้ ลดได้ด้วยการเตรียมพร้อมและช่วยเหลือกัน"
  - { type: check, problem: health.safety.natural-disasters.p008 }
glossary:
  - { term: ภัยธรรมชาติ, definition: "เหตุการณ์จากธรรมชาติที่ทำให้เกิดความเสียหายต่อชีวิตและทรัพย์สิน เช่น น้ำท่วม แผ่นดินไหว พายุ" }
  - { term: น้ำป่าไหลหลาก, definition: "น้ำจากภูเขาที่ไหลลงมาอย่างรวดเร็วและรุนแรงหลังฝนตกหนัก" }
  - { term: ถุงยังชีพฉุกเฉิน, definition: "ถุงที่เตรียมของจำเป็นไว้ใช้ช่วงเกิดภัย เช่น น้ำ อาหารแห้ง ไฟฉาย ยา เอกสารสำคัญ" }
  - { term: สึนามิ, definition: "คลื่นยักษ์ที่เกิดจากแผ่นดินไหวใต้ทะเล สัญญาณเตือนคือน้ำทะเลลดลงผิดปกติ" }
  - { term: โรคลมร้อน (ฮีตสโตรก), definition: "ภาวะที่ร่างกายร้อนเกินจนระบบต่าง ๆ ทำงานผิดปกติ อาจสับสนหรือหมดสติ เป็นเหตุฉุกเฉิน" }
flashcards:
  - { front: "แผ่นดินไหวขณะอยู่ในอาคาร ทำอย่างไร", back: "หมอบ ป้อง เกาะ ใต้โต๊ะที่แข็งแรง ห่างหน้าต่าง ไม่ใช้ลิฟต์" }
  - { front: "น้ำไหลเชี่ยวลึกเท่าไรทำให้ผู้ใหญ่ล้มได้", back: "ราว 15 เซนติเมตร (ราว 30 เซนติเมตรพัดรถยนต์ได้)" }
  - { front: "นับวินาทีจากฟ้าแลบถึงฟ้าร้อง แล้วหาระยะทางอย่างไร", back: "หารด้วย 3 ได้ระยะทางโดยประมาณเป็นกิโลเมตร" }
  - { front: "เห็นน้ำทะเลลดลงผิดปกติ ทำอย่างไร", back: "สัญญาณสึนามิ รีบหนีขึ้นที่สูงทันที" }
  - { front: "สายด่วนนิรภัย ปภ.", back: "1784 ตลอด 24 ชั่วโมง" }
