    solution: "ขณะพัก 80 ครั้งต่อนาที หลังกระโดดตบ 132 ครั้งต่อนาที เพิ่มขึ้น 52 ร้อยละที่เพิ่ม $= \\frac{52}{80} \\times 100 = 65$"
