<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 470" width="420" height="470" font-family="sans-serif">
<title>ข้อความแชตระหว่าง Ben กับ Nam</title>
<rect x="0" y="0" width="420" height="470" fill="#fff"/>
<rect x="10.0" y="10.0" width="400.0" height="450.0" rx="26" fill="#f3f3f3" stroke="#333" stroke-width="3"/>
<rect x="10.0" y="10.0" width="400.0" height="50.0" rx="26" fill="#2f5fa8" stroke="#2f5fa8" stroke-width="0"/>
<rect x="10.0" y="40.0" width="400.0" height="20.0" rx="0" fill="#2f5fa8" stroke="none" stroke-width="0"/>
<text x="210.0" y="43.0" font-size="18" text-anchor="middle" fill="#fff" font-weight="bold">Ben</text>
<rect x="26.0" y="78.0" width="274.8" height="35.0" rx="12" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
<text x="38.0" y="102.0" font-size="14.5" text-anchor="start" fill="#111" font-weight="normal">Hi Nam! Are you free on Saturday?</text>
<rect x="26.0" y="127.0" width="282.4" height="56.0" rx="12" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
<text x="38.0" y="151.0" font-size="14.5" text-anchor="start" fill="#111" font-weight="normal">I need help with my Thai homework.</text>
<text x="38.0" y="172.0" font-size="14.5" text-anchor="start" fill="#111" font-weight="normal">Could you help me?</text>
<rect x="172.4" y="197.0" width="221.6" height="56.0" rx="12" fill="#d6f5d0" stroke="#6aa35f" stroke-width="1.5"/>
<text x="184.4" y="221.0" font-size="14.5" text-anchor="start" fill="#111" font-weight="normal">Sorry, I can't. I visit my</text>
<text x="184.4" y="242.0" font-size="14.5" text-anchor="start" fill="#111" font-weight="normal">grandma on Saturdays.</text>
<rect x="119.2" y="267.0" width="274.8" height="77.0" rx="12" fill="#d6f5d0" stroke="#6aa35f" stroke-width="1.5"/>
<text x="131.2" y="291.0" font-size="14.5" text-anchor="start" fill="#111" font-weight="normal">But I'm free on Sunday afternoon.</text>
<text x="131.2" y="312.0" font-size="14.5" text-anchor="start" fill="#111" font-weight="normal">Would you like to meet at the</text>
<text x="131.2" y="333.0" font-size="14.5" text-anchor="start" fill="#111" font-weight="normal">library at 2 p.m.?</text>
<rect x="26.0" y="358.0" width="274.8" height="56.0" rx="12" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
<text x="38.0" y="382.0" font-size="14.5" text-anchor="start" fill="#111" font-weight="normal">Yes, please! That would be great.</text>
<text x="38.0" y="403.0" font-size="14.5" text-anchor="start" fill="#111" font-weight="normal">Thanks a lot!</text>
<text x="30.0" y="434.0" font-size="13" text-anchor="start" fill="#555" font-weight="normal">สีขาว = Ben   สีเขียว = Nam</text>
</svg>
