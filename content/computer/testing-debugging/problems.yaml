  - id: computer.programming.testing-debugging.p013
    topics: [computer.programming.testing-debugging]
    difficulty: 4
    type: text
    stem: |
      เมื่อโปรแกรม Python ล้มเหลว ข้อความที่แสดงลำดับการเรียกฟังก์ชันจากจุดเริ่มต้นไปถึงบรรทัดที่เกิดข้อผิดพลาด มีชื่อว่าอะไร (ตอบเป็นคำภาษาอังกฤษหนึ่งคำ)
    accepted: ["traceback", "Traceback"]
    misconceptions:
      - { match: "log", feedback: "log คือบันทึกเหตุการณ์ที่โปรแกรมเขียนเอง ไม่ใช่ข้อความที่ Python แสดงเมื่อล้มเหลว" }
    hints:
      - "ลองนึกถึงข้อความที่มักแสดงเป็นรายการไฟล์และบรรทัดตอนโปรแกรมพัง"
      - "คำนี้มี 9 ตัวอักษร ขึ้นต้นด้วย t"
    solution: "traceback คือรายการการเรียกที่ Python แสดงเมื่อเกิดข้อยกเว้น ให้อ่านจากล่างขึ้นบนเพื่อหาจุดที่เกิดข้อผิดพลาด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.testing-debugging.p014
    topics: [computer.programming.testing-debugging]
    difficulty: 4
    type: numeric
    stem: |
      ชุดทดสอบรันแล้วครอบคลุมคำสั่งได้ 15 คำสั่งจากทั้งหมด 20 คำสั่งของฟังก์ชัน การครอบคลุมโค้ด (coverage) คิดเป็นกี่เปอร์เซ็นต์ (ตอบเป็นจำนวนเต็ม)
    answer: { value: 75, unit: เปอร์เซ็นต์ }
    hints:
      - "หาสัดส่วนของคำสั่งที่ถูกรันเทียบกับจำนวนทั้งหมด"
      - "คูณสัดส่วนด้วย 100 เพื่อให้เป็นเปอร์เซ็นต์"
    misconceptions:
      - { match: 15, feedback: "ตอบจำนวนคำสั่งที่ครอบคลุม แต่โจทย์ถามเป็นเปอร์เซ็นต์ของคำสั่งทั้งหมด" }
    solution: "15 / 20 × 100 = 75 เปอร์เซ็นต์ ยังขาด 5 คำสั่งที่ควรออกแบบกรณีทดสอบเพิ่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.testing-debugging.p015
    topics: [computer.programming.testing-debugging]
    difficulty: 4
    type: numeric
    stem: |
      ร้านต้องการให้ฟังก์ชันคำนวณราคาหลังลด `price * (1 - pct / 100)` แต่ผู้เขียนพิมพ์เป็น `price * (1 - pct)` ถ้าเรียก `discount(200, 10)` ด้วยโค้ดที่มีบั๊กนี้ จะได้ค่าเท่าไร (ตอบเป็นจำนวนเต็ม หน่วยบาท)
    answer: { value: -1800, unit: บาท }
    hints:
      - "คำนวณในวงเล็บก่อนโดยใช้ pct เป็น 10 ตามที่เขียนในโค้ดที่ผิด"
      - "ลองดูว่าค่าในวงเล็บเป็นบวกหรือลบ"
    misconceptions:
      - { match: 180, feedback: "นั่นคือค่าที่ถูกต้องตามสูตรที่มี pct / 100 ไม่ใช่ผลจากบั๊ก" }
    solution: "200 × (1 − 10) = 200 × (−9) = −1800 ค่าที่เป็นลบผิดวิสัยของราคาหลังลด ชุดทดสอบที่ตรวจว่าราคาไม่ติดลบจะจับบั๊กนี้ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.testing-debugging.p016
    topics: [computer.programming.testing-debugging]
    difficulty: 4
    type: code
    stem: |
      ฟังก์ชัน `median(nums)` ควรคืนค่ามัธยฐานของลิสต์ที่ไม่ว่าง (ค่ากลางหลังเรียงลำดับ ถ้ามีจำนวนสมาชิกเป็นคู่ให้เอาค่าเฉลี่ยของสองค่ากลาง) โค้ดเริ่มต้นมีบั๊กสองจุด คือไม่เรียงลำดับและไม่จัดการกรณีจำนวนคู่ ให้แก้โค้ดให้ผ่านชุดทดสอบ
    starter: |
      def median(nums):
          mid = len(nums) // 2
          return nums[mid]
    tests: |
      r = median([3, 1, 2])
      assert r is not None, "ยังไม่ได้คืนค่า (ได้ None) ต้องใช้ return"
      assert r == 2, f"median([3, 1, 2]) ควรได้ 2 แต่ได้ {r}"
      assert median([4, 1, 3, 2]) == 2.5, f"median([4, 1, 3, 2]) ควรได้ 2.5 (ค่าเฉลี่ยของ 2 กับ 3) แต่ได้ {median([4, 1, 3, 2])}"
      assert median([7]) == 7, f"median([7]) ควรได้ 7 แต่ได้ {median([7])}"
      assert median([5, 9]) == 7, f"median([5, 9]) ควรได้ 7 แต่ได้ {median([5, 9])}"
    reference: |
      def median(nums):
          s = sorted(nums)
          n = len(s)
          mid = n // 2
          if n % 2 == 1:
              return s[mid]
          return (s[mid - 1] + s[mid]) / 2
    hints:
      - "เรียงลำดับก่อนจึงจะหาค่ากลางได้"
      - "ถ้าจำนวนสมาชิกเป็นคู่ ต้องหาค่าเฉลี่ยของสองค่าที่อยู่ตรงกลาง"
    solution: "เรียงด้วย sorted แล้วถ้า n เป็นคี่คืน s[n // 2] ถ้าเป็นคู่คืน (s[mid - 1] + s[mid]) / 2"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.testing-debugging.p017
    topics: [computer.programming.testing-debugging]
    difficulty: 5
    type: code
    stem: |
      โปรแกรมรวมคะแนนจากบรรทัดรูปแบบ `ชื่อ: คะแนน` มีบั๊กสามจุดในสองฟังก์ชัน จุดแรกคือ `parse_line` คืนคะแนนเป็นข้อความแทนจำนวนเต็มและไม่ตัดช่องว่าง จุดที่สองคือ `total_score` ข้ามบรรทัดแรกโดยไม่ตั้งใจ จุดที่สามคือ `total_score` รวมค่าที่เป็นข้อความ ให้แก้ทั้งสองฟังก์ชันให้ผ่านชุดทดสอบ โดย `parse_line` ต้องคืนทูเพิล `(ชื่อ, คะแนน)` และ `total_score` คืนผลรวมเป็นจำนวนเต็ม
    starter: |
      def parse_line(line):
          name, score = line.split(":")
          return name, score

      def total_score(lines):
          total = 0
          for line in lines[1:]:
              name, score = parse_line(line)
              total += score
          return total
    tests: |
      assert parse_line("ฟ้า: 18") == ("ฟ้า", 18), f"parse_line('ฟ้า: 18') ควรได้ ('ฟ้า', 18) แต่ได้ {parse_line('ฟ้า: 18')!r}"
      r = total_score(["ฟ้า: 18", "ต้น: 12"])
      assert r is not None, "ยังไม่ได้คืนค่า (ได้ None) ต้องใช้ return"
      assert r == 30, f"total_score ควรได้ 30 (ทั้งสองบรรทัด) แต่ได้ {r!r}"
      assert total_score(["มด: 7"]) == 7, f"total_score(['มด: 7']) ควรได้ 7 แต่ได้ {total_score(['มด: 7'])!r}"
      assert total_score([]) == 0, "รายการว่างควรได้ 0"
    reference: |
      def parse_line(line):
          name, score = line.split(":")
          return name.strip(), int(score.strip())

      def total_score(lines):
          total = 0
          for line in lines:
              name, score = parse_line(line)
              total += score
          return total
    hints:
      - "ดูว่า `lines[1:]` ข้ามสมาชิกใดไปบ้าง และ `for` ควรวนทั้งลิสต์หรือไม่"
      - "ใน `parse_line` ใช้ `strip()` กับชื่อและคะแนน แล้วแปลงคะแนนด้วย `int()` ก่อนคืนค่า"
    solution: "parse_line ใช้ name.strip() และ int(score.strip()) คืนทูเพิล และ total_score วนทั้ง lines แทนที่จะข้ามบรรทัดแรก ค่าที่ได้จึงเป็นจำนวนเต็มและรวมครบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.testing-debugging.p018
    topics: [computer.programming.testing-debugging]
    difficulty: 5
    type: code
    stem: |
      กฎปีอธิกสุรทินคือ ปีที่หารด้วย 4 ลงตัวเป็นปีอธิกสุรทิน ยกเว้นปีที่หารด้วย 100 ลงตัว ซึ่งจะเป็นปีอธิกสุรทินก็ต่อเมื่อหารด้วย 400 ลงตัวด้วย ข้อนี้ให้ **เขียนชุดทดสอบ** ไม่ใช่เขียนฟังก์ชัน เขียน `test_is_leap(is_leap)` ที่รับฟังก์ชัน `is_leap(year)` เข้ามา แล้วใช้ `assert` ตรวจผลของปีต่าง ๆ ระบบจะส่งฟังก์ชันที่ถูกต้องหนึ่งตัว (ชุดทดสอบต้องผ่าน) และฟังก์ชันที่มีบั๊กต่างแบบกันอีกสี่ตัว (ชุดทดสอบต้องล้มเหลวด้วย AssertionError ทุกตัว) เลือกปีที่ทดสอบให้ครอบคลุมทุกกลุ่มสมมูลของกฎ
    starter: |
      def test_is_leap(is_leap):
          pass
    tests: |
      def _ok(y): return y % 400 == 0 or (y % 4 == 0 and y % 100 != 0)
      def _bug_only4(y): return y % 4 == 0
      def _bug_no400(y): return y % 4 == 0 and y % 100 != 0
      def _bug_flip(y): return y % 400 == 0 or (y % 4 == 0 and y % 100 == 0)
      def _bug_always(y): return True
      try:
          test_is_leap(_ok)
      except AssertionError as e:
          raise AssertionError(f"ชุดทดสอบของคุณล้มเหลวกับฟังก์ชันที่ถูกต้อง ตรวจค่าที่คาดไว้อีกครั้ง ({e})")
      for bug, desc in [(_bug_only4, "ตรวจแค่หารด้วย 4 ลงตัว"), (_bug_no400, "ลืมข้อยกเว้นของปีที่หารด้วย 400 ลงตัว"), (_bug_flip, "เขียนเงื่อนไขหารด้วย 100 กลับด้าน"), (_bug_always, "คืน True ทุกปี")]:
          caught = False
          try:
              test_is_leap(bug)
          except AssertionError:
              caught = True
          assert caught, f"ชุดทดสอบยังจับฟังก์ชันที่มีบั๊กแบบ {desc} ไม่ได้ ลองเพิ่มปีที่ทำให้บั๊กนี้ให้ผลผิด"
    reference: |
      def test_is_leap(is_leap):
          assert is_leap(2024) is True, "2024 หารด้วย 4 ลงตัว ควรได้ True"
          assert is_leap(2023) is False, "2023 หารด้วย 4 ไม่ลงตัว ควรได้ False"
          assert is_leap(1900) is False, "1900 หารด้วย 100 ลงตัวแต่ไม่ลงตัวด้วย 400 ควรได้ False"
          assert is_leap(2000) is True, "2000 หารด้วย 400 ลงตัว ควรได้ True"
    hints:
      - "กฎนี้แบ่งปีได้สี่กลุ่ม คือ หารด้วย 4 ไม่ลงตัว หารด้วย 4 ลงตัวแต่ไม่ลงตัวด้วย 100 หารด้วย 100 ลงตัวแต่ไม่ลงตัวด้วย 400 และหารด้วย 400 ลงตัว"
      - "เลือกปีตัวแทนกลุ่มละหนึ่งปี เช่น 2023, 2024, 1900, 2000 แล้วเขียน `assert is_leap(ปี) is ค่าที่ถูก` ทีละบรรทัด"
    solution: "ชุดทดสอบที่มีตัวแทนครบสี่กลุ่มสมมูล (2023 → False, 2024 → True, 1900 → False, 2000 → True) จับบั๊กได้ทุกแบบ เช่น บั๊กที่ตรวจแค่หารด้วย 4 จะให้ 1900 เป็น True จึงล้มเหลวที่บรรทัดของ 1900"
    license: CC-BY-SA-4.0
    ai_assisted: true
