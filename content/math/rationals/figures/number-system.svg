<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="sans-serif" font-size="16">
  <title>แผนภาพระบบจำนวนจริง</title>
  <rect x="10" y="10" width="700" height="300" rx="14" fill="#ffffff" stroke="#15211e" stroke-width="2"/>
  <text x="30.0" y="32.0" text-anchor="start" dominant-baseline="middle" font-size="17" fill="#15211e" font-weight="bold">จำนวนจริง</text>
  <rect x="30" y="50" width="450" height="245" rx="14" fill="#eef6f4" stroke="#0a6b60" stroke-width="2"/>
  <text x="50.0" y="72.0" text-anchor="start" dominant-baseline="middle" font-size="15" fill="#0a6b60" font-weight="bold">จำนวนตรรกยะ  (เขียนเป็น a/b ได้)</text>
  <rect x="50" y="95" width="290" height="185" rx="14" fill="#dcefe9" stroke="#0a6b60" stroke-width="2"/>
  <text x="70.0" y="117.0" text-anchor="start" dominant-baseline="middle" font-size="15" fill="#0a6b60" font-weight="bold">จำนวนเต็ม</text>
  <rect x="70" y="140" width="165" height="125" rx="14" fill="#c7e5dd" stroke="#0a6b60" stroke-width="2"/>
  <text x="90.0" y="162.0" text-anchor="start" dominant-baseline="middle" font-size="15" fill="#0a6b60" font-weight="bold">จำนวนนับ</text>
  <text x="152.0" y="200.0" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#15211e">1   2   3</text>
  <text x="152.0" y="228.0" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#15211e">100</text>
  <text x="288.0" y="175.0" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#15211e">0</text>
  <text x="288.0" y="205.0" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#15211e">−4</text>
  <text x="288.0" y="235.0" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#15211e">−27</text>
  <text x="410.0" y="175.0" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#15211e">2/3   −3/4</text>
  <text x="410.0" y="215.0" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#15211e">−1.5   0.125</text>
  <text x="410.0" y="255.0" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#15211e">0.333...</text>
  <rect x="500" y="50" width="195" height="245" rx="14" fill="#fbeee4" stroke="#b4521f" stroke-width="2"/>
  <text x="515.0" y="72.0" text-anchor="start" dominant-baseline="middle" font-size="15" fill="#b4521f" font-weight="bold">จำนวนอตรรกยะ</text>
  <text x="597.0" y="150.0" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#15211e">√2   √5</text>
  <text x="597.0" y="190.0" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#15211e">π</text>
  <text x="597.0" y="240.0" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#6b7a76">ทศนิยมไม่รู้จบ</text>
  <text x="597.0" y="258.0" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#6b7a76">และไม่ซ้ำ</text>
</svg>
