    note: "สาระการเรียนรู้แกนกลางของการพูดให้ข้อมูลเกี่ยวกับตนเองและเรื่องใกล้ตัวมีจำนวน 1-20 (ป.1) ถึง 1-100 (ป.4) หัวข้อสอนเฉพาะการอ่าน เขียน และพูดตัวเลขถึง 100 ไม่ได้สอนการให้ข้อมูลเรื่องอื่น"
