id: computer.games.game-design
subject: computer
title: { th: การออกแบบเกมและประสบการณ์ผู้เล่น, en: "Game design and player experience" }
summary: วิเคราะห์องค์ประกอบของเกม วางวงจรแกนและความสมดุล วางแผนด้วยสตอรีบอร์ด ออกแบบหน้าจอให้เข้าถึงได้ เปรียบเทียบสองเวอร์ชันด้วยตัวชี้วัด และพิจารณาจริยธรรมกับลิขสิทธิ์ของเกม
difficulty: 4.5
minutes: 40
prerequisites: [computer.design.user-centred-design, computer.society.inclusive-design]
encompasses:
  - { id: computer.design.user-centred-design, weight: 0.2 }
  - { id: computer.society.inclusive-design, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: core-loop.svg
    alt: "วงจรแกนของการเล่นมีสามขั้นวนซ้ำ ขั้นบนคือทำกิจกรรมเล็ก ๆ ขั้นขวาล่างคือได้รางวัลหรือคะแนน ขั้นซ้ายล่างคือเจอความท้าทายที่ยากขึ้น แล้วลูกศรกลับไปขั้นบน"
    caption: "วงจรแกนที่สนุกต้องปรับความยากให้พอดีในทุกรอบ"
  - type: worked-example
    title: เปรียบเทียบสองเวอร์ชันด้วยอัตราเลิกเล่น
    problem: "เกมทดสอบเวอร์ชัน A และ B กับผู้เล่นกลุ่มละ 40 คน เวอร์ชัน A มี 10 คนเลิกกลางคัน และผ่านด่านเฉลี่ย 6.0 นาที เวอร์ชัน B มี 4 คนเลิกกลางคัน และผ่านด่านเฉลี่ย 4.5 นาที เวอร์ชันใดดีกว่า และควรระวังอะไร"
    steps:
      - text: "คำนวณอัตราเลิกเล่นของ A: 10 ÷ 40 × 100 = 25 เปอร์เซ็นต์"
      - text: "คำนวณอัตราเลิกเล่นของ B: 4 ÷ 40 × 100 = 10 เปอร์เซ็นต์"
      - text: "เปรียบเทียบเวลาเฉลี่ย B ผ่านด่านเร็วกว่า A อยู่ 6.0 − 4.5 = 1.5 นาที"
        why: "ตัวชี้วัดที่กำหนดไว้ก่อนทำให้การเปรียบเทียบเป็นธรรม ไม่ใช่เลือกเพราะชอบ"
      - text: "สรุปว่า B ดีกว่าในตัวชี้วัดทั้งสอง แต่กลุ่มตัวอย่าง 40 คนยังเล็ก จึงควรทดสอบเพิ่มกับผู้เล่นที่หลากหลาย"
    answer: "เวอร์ชัน B ดีกว่า (เลิกเล่น 10 เปอร์เซ็นต์ เทียบกับ 25 เปอร์เซ็นต์ และผ่านด่านเร็วกว่า 1.5 นาที) แต่ควรทดสอบเพิ่ม"
  - { type: check, problem: computer.games.game-design.p011, prompt: "ทำไมตัวอย่างผู้เล่น 40 คนจึงควรระวัง" }
  - type: figure
    src: storyboard.svg
    alt: "สตอรีบอร์ดสี่ช่องของเกมเก็บผลไม้ ช่องแรกมีตัวละครหน้าประตูในฉากเริ่มต้น ช่องที่สองมีลูกศรแสดงตัวละครเดินไปทางขวา ช่องที่สามมีผลไม้สีแดงตกลงในตะกร้าและมีป้ายบวกหนึ่ง ช่องที่สี่แสดงตัวเลข 5 และข้อความคะแนนรวม"
    caption: "สตอรีบอร์ดช่วยดูลำดับของการเล่นก่อนลงมือเขียนโปรแกรม"
  - type: worked-example
    title: ปรับการแจ้งผลให้คนตาบอดสีเข้าใจได้
    problem: "เกมแจ้งผลการตอบด้วยสีแดงและสีเขียวอย่างเดียว ผู้เล่นตาบอดสีแดงเขียวแยกไม่ออกจึงไม่รู้ว่าตอบถูกหรือไม่ จะปรับอย่างไร"
    steps:
      - text: "ระบุปัญหา การแจ้งผลพึ่งสีอย่างเดียว ทำให้ผู้เล่นบางกลุ่มเข้าใจไม่ได้"
      - text: "เพิ่มไอคอนเครื่องหมายถูกและผิด รวมกับข้อความว่า ถูก หรือ ผิด"
        why: "เมื่อใช้รูปร่างหรือตัวอักษรช่วย ผู้เล่นทุกคนเข้าใจได้โดยไม่ต้องแยกสี"
      - text: "ทดสอบกับผู้เล่นที่หลากหลาย รวมถึงผู้ที่ตาบอดสี เพื่อดูว่าเข้าใจได้จริงหรือไม่"
    answer: "เพิ่มไอคอนและข้อความร่วมกับสี แล้วทดสอบกับผู้เล่นหลากหลาย"
  - { type: check, problem: computer.games.game-design.p007, prompt: "ลองนึกว่าการแจ้งผลแบบใดช่วยให้ทุกคนเข้าใจ" }
glossary:
  - { term: วงจรแกน (core loop), definition: "การทำกิจกรรมซ้ำ ๆ ที่ผู้เล่นทำบ่อยที่สุดในเกม เช่น ทำกิจกรรม ได้รางวัล แล้วเจอความท้าทาย" }
  - { term: ความสมดุล (game balance), definition: "การปรับความยาก รางวัล และโอกาส ให้เกมให้ความรู้สึกยุติธรรมและน่าเล่นต่อ" }
  - { term: สตอรีบอร์ด (storyboard), definition: "การวาดภาพเป็นช่องต่อกันเพื่อวางแผนลำดับเรื่องและการโต้ตอบของผู้เล่น" }
  - { term: อัตราเลิกเล่น (quit rate), definition: "สัดส่วนของผู้เล่นที่เลิกเล่นกลางคันเทียบกับจำนวนผู้เล่นที่เริ่มเล่นทั้งหมด" }
  - { term: กล่องสุ่ม (loot box), definition: "กลไกที่ผู้เล่นจ่ายเพื่อสุ่มรับรางวัลซึ่งไม่แน่นอน อาจกระตุ้นการใช้จ่ายซ้ำ จึงควรออกแบบอย่างรับผิดชอบ" }
  - { term: ทรัพย์สินทางปัญญา (intellectual property), definition: "สิทธิของผู้สร้างผลงาน เช่น ภาพ เพลง ตัวละคร และโค้ด ที่ต้องได้รับการอนุญาตก่อนนำไปใช้" }
flashcards:
  - { front: "องค์ประกอบของเกมมีอะไรบ้าง", back: "ผู้เล่น เป้าหมาย กติกา กลไก และผลลัพธ์" }
  - { front: "อัตราเลิกเล่นคำนวณอย่างไร", back: "จำนวนคนที่เลิกกลางคัน หารด้วยจำนวนคนที่เริ่มเล่น แล้วคูณด้วย 100" }
  - { front: "ทำไมไม่ควรใช้สีอย่างเดียวบอกผลในเกม", back: "ผู้เล่นตาบอดสีอาจแยกสีไม่ได้ จึงควรเพิ่มไอคอนหรือข้อความ" }
  - { front: "สตอรีบอร์ดช่วยอะไรก่อนเขียนโปรแกรม", back: "วางแผนลำดับเรื่องและการโต้ตอบของผู้เล่นให้เข้าใจตรงกันทั้งทีม" }
