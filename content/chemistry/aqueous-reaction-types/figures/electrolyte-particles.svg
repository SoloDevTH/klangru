<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330">
<title>ภาพจำลองอนุภาคของสารละลายสามชนิด เกลือแกงแตกเป็นไอออนเกือบหมด กรดแอซีติกแตกได้บางส่วน น้ำตาลไม่แตกเป็นไอออน</title>
<rect x="0" y="0" width="780" height="330" fill="#ffffff"/>
<text x="128" y="22" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d3557" font-family="sans-serif">NaCl(aq)</text>
<text x="128" y="40" font-size="12" text-anchor="middle" fill="#222" font-family="Loma, sans-serif">อิเล็กโทรไลต์แก่: แตกเป็นไอออนเกือบหมด</text>
<path d="M 32 58 L 32 258 Q 32 270 46 270 L 210 270 Q 224 270 224 258 L 224 58" fill="#eaf4fb" stroke="#1d3557" stroke-width="2.5"/>
<circle cx="68.0" cy="108.0" r="13" fill="#457b9d" stroke="#1d3557" stroke-width="1"/>
<text x="68.0" y="112.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold" font-family="sans-serif">Na⁺</text>
<circle cx="128.0" cy="108.0" r="13" fill="#2a9d8f" stroke="#1d3557" stroke-width="1"/>
<text x="128.0" y="112.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold" font-family="sans-serif">Cl⁻</text>
<circle cx="188.0" cy="108.0" r="13" fill="#457b9d" stroke="#1d3557" stroke-width="1"/>
<text x="188.0" y="112.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold" font-family="sans-serif">Na⁺</text>
<circle cx="68.0" cy="163.0" r="13" fill="#2a9d8f" stroke="#1d3557" stroke-width="1"/>
<text x="68.0" y="167.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold" font-family="sans-serif">Cl⁻</text>
<circle cx="188.0" cy="163.0" r="13" fill="#2a9d8f" stroke="#1d3557" stroke-width="1"/>
<text x="188.0" y="167.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold" font-family="sans-serif">Cl⁻</text>
<circle cx="68.0" cy="218.0" r="13" fill="#457b9d" stroke="#1d3557" stroke-width="1"/>
<text x="68.0" y="222.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold" font-family="sans-serif">Na⁺</text>
<circle cx="128.0" cy="218.0" r="13" fill="#2a9d8f" stroke="#1d3557" stroke-width="1"/>
<text x="128.0" y="222.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold" font-family="sans-serif">Cl⁻</text>
<circle cx="188.0" cy="218.0" r="13" fill="#457b9d" stroke="#1d3557" stroke-width="1"/>
<text x="188.0" y="222.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold" font-family="sans-serif">Na⁺</text>
<text x="128" y="294" font-size="12" text-anchor="middle" fill="#222" font-family="Loma, sans-serif">Na⁺ และ Cl⁻ เคลื่อนที่อิสระ นำไฟฟ้าได้ดี</text>
<text x="386" y="22" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d3557" font-family="sans-serif">CH₃COOH(aq)</text>
<text x="386" y="40" font-size="12" text-anchor="middle" fill="#222" font-family="Loma, sans-serif">อิเล็กโทรไลต์อ่อน: แตกได้บางส่วน</text>
<path d="M 290 58 L 290 258 Q 290 270 304 270 L 468 270 Q 482 270 482 258 L 482 58" fill="#eaf4fb" stroke="#1d3557" stroke-width="2.5"/>
<circle cx="326.0" cy="108.0" r="12" fill="#c9c9c9" stroke="#1d3557" stroke-width="1"/>
<circle cx="386.0" cy="108.0" r="13" fill="#f4a261" stroke="#1d3557" stroke-width="1"/>
<text x="386.0" y="112.0" font-size="9" text-anchor="middle" fill="#fff" font-weight="bold" font-family="sans-serif">H⁺</text>
<circle cx="446.0" cy="108.0" r="12" fill="#c9c9c9" stroke="#1d3557" stroke-width="1"/>
<circle cx="326.0" cy="163.0" r="12" fill="#c9c9c9" stroke="#1d3557" stroke-width="1"/>
<circle cx="386.0" cy="163.0" r="12" fill="#c9c9c9" stroke="#1d3557" stroke-width="1"/>
<circle cx="446.0" cy="163.0" r="12" fill="#c9c9c9" stroke="#1d3557" stroke-width="1"/>
<circle cx="326.0" cy="218.0" r="12" fill="#c9c9c9" stroke="#1d3557" stroke-width="1"/>
<circle cx="386.0" cy="218.0" r="13" fill="#8e6bbf" stroke="#1d3557" stroke-width="1"/>
<text x="386.0" y="222.0" font-size="9" text-anchor="middle" fill="#fff" font-weight="bold" font-family="sans-serif">A⁻</text>
<circle cx="446.0" cy="218.0" r="12" fill="#c9c9c9" stroke="#1d3557" stroke-width="1"/>
<text x="386" y="294" font-size="12" text-anchor="middle" fill="#222" font-family="Loma, sans-serif">ส่วนใหญ่ยังเป็นโมเลกุล มีไอออนน้อย</text>
<text x="644" y="22" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d3557" font-family="sans-serif">C₁₂H₂₂O₁₁(aq)</text>
<text x="644" y="40" font-size="12" text-anchor="middle" fill="#222" font-family="Loma, sans-serif">นอนอิเล็กโทรไลต์: ไม่แตกเป็นไอออน</text>
<path d="M 548 58 L 548 258 Q 548 270 562 270 L 726 270 Q 740 270 740 258 L 740 58" fill="#eaf4fb" stroke="#1d3557" stroke-width="2.5"/>
<circle cx="584.0" cy="108.0" r="13" fill="#c9c9c9" stroke="#1d3557" stroke-width="1"/>
<circle cx="644.0" cy="108.0" r="13" fill="#c9c9c9" stroke="#1d3557" stroke-width="1"/>
<circle cx="704.0" cy="108.0" r="13" fill="#c9c9c9" stroke="#1d3557" stroke-width="1"/>
<circle cx="584.0" cy="163.0" r="13" fill="#c9c9c9" stroke="#1d3557" stroke-width="1"/>
<circle cx="644.0" cy="163.0" r="13" fill="#c9c9c9" stroke="#1d3557" stroke-width="1"/>
<circle cx="704.0" cy="163.0" r="13" fill="#c9c9c9" stroke="#1d3557" stroke-width="1"/>
<circle cx="584.0" cy="218.0" r="13" fill="#c9c9c9" stroke="#1d3557" stroke-width="1"/>
<circle cx="644.0" cy="218.0" r="13" fill="#c9c9c9" stroke="#1d3557" stroke-width="1"/>
<circle cx="704.0" cy="218.0" r="13" fill="#c9c9c9" stroke="#1d3557" stroke-width="1"/>
<text x="644" y="294" font-size="12" text-anchor="middle" fill="#222" font-family="Loma, sans-serif">โมเลกุลละลายคงรูป ไม่นำไฟฟ้า</text>
<circle cx="40" cy="308" r="7" fill="#457b9d" stroke="#1d3557" stroke-width="1"/>
<text x="52" y="312" font-size="12" fill="#222" font-family="Loma, sans-serif">Na⁺</text>
<circle cx="190" cy="308" r="7" fill="#2a9d8f" stroke="#1d3557" stroke-width="1"/>
<text x="202" y="312" font-size="12" fill="#222" font-family="Loma, sans-serif">Cl⁻</text>
<circle cx="340" cy="308" r="7" fill="#f4a261" stroke="#1d3557" stroke-width="1"/>
<text x="352" y="312" font-size="12" fill="#222" font-family="Loma, sans-serif">H⁺</text>
<circle cx="490" cy="308" r="7" fill="#8e6bbf" stroke="#1d3557" stroke-width="1"/>
<text x="502" y="312" font-size="12" fill="#222" font-family="Loma, sans-serif">A⁻ = CH₃COO⁻</text>
<circle cx="640" cy="308" r="7" fill="#c9c9c9" stroke="#1d3557" stroke-width="1"/>
<text x="652" y="312" font-size="12" fill="#222" font-family="Loma, sans-serif">โมเลกุลที่ยังคงรูป</text>
</svg>
