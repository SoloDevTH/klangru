id: management.principles.functions
subject: management
title: { th: ธุรกิจและหน้าที่การจัดการ, en: Business and the functions of management }
summary: ธุรกิจคืออะไร หน้าที่การจัดการ 4 ด้าน (วางแผน จัดองค์การ ชี้นำ ควบคุม) รูปแบบการเป็นเจ้าของธุรกิจในไทย และผู้มีส่วนได้ส่วนเสีย
difficulty: 2.5
minutes: 35
prerequisites: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: polc-cycle.svg
    alt: "แผนภาพวงจรสี่กล่องเรียงเป็นวงกลม มีลูกศรตามเข็มนาฬิกา 1 วางแผน (ตั้งเป้าหมาย เลือกวิธี) ไป 2 จัดองค์การ (แบ่งงาน คน ทรัพยากร) ไป 3 ชี้นำ (สั่งงาน จูงใจ สื่อสาร) ไป 4 ควบคุม (วัดผล เทียบเป้า แก้ไข) แล้ววนกลับไปวางแผน ตรงกลางเขียนว่าผลการควบคุมใช้วางแผนรอบใหม่"
    caption: "หน้าที่การจัดการเป็นวงจร ผลการควบคุมย้อนกลับไปใช้วางแผนรอบถัดไป"
  - { type: check, problem: mgt.fn.p001, prompt: "ลองคิดก่อนดูตัวอย่าง" }
  - type: worked-example
    title: จัดงานของเจ้าของร้านกาแฟเข้ากับหน้าที่การจัดการ
    problem: "สัปดาห์นี้ต้นเจ้าของร้านกาแฟทำงาน 4 อย่าง (ก) ตั้งเป้าขายเมนูใหม่ให้ได้ 300 แก้วในเดือนหน้า (ข) มอบให้หัวหน้าบาริสต้าดูแลการชงเมนูใหม่ และจัดกะพนักงานเพิ่มช่วงเย็น (ค) สอนสูตรและชมพนักงานที่ชงได้เร็ว (ง) ทุกวันศุกร์ดูยอดขายเมนูใหม่เทียบเป้า งานแต่ละอย่างเป็นหน้าที่การจัดการด้านใด"
    steps:
      - text: "(ก) ตั้งเป้าหมายตัวเลขสำหรับอนาคต จึงเป็น **การวางแผน**"
      - text: "(ข) แบ่งงาน มอบหมายคน และจัดกะ จึงเป็น **การจัดองค์การ**"
        why: "การจัดองค์การคือการกำหนดว่าใครทำอะไรและใช้ทรัพยากรใด เพื่อให้แผนทำได้จริง"
      - text: "(ค) สอนงานและจูงใจพนักงาน จึงเป็น **การชี้นำ**"
      - text: "(ง) นำผลจริงมาเทียบเป้าหมาย จึงเป็น **การควบคุม**"
        why: "การตั้งเป้าเป็นการวางแผน แต่การเอาผลมาเทียบเป้าเพื่อแก้ไขคือการควบคุม สองอย่างนี้มักถูกสับสนกัน"
    answer: "(ก) วางแผน (ข) จัดองค์การ (ค) ชี้นำ (ง) ควบคุม"
  - type: figure
    src: org-chart.svg
    alt: "แผนผังองค์การของร้านกาแฟ บนสุดคือเจ้าของร้าน ใต้ลงมาคือผู้จัดการร้าน ผู้จัดการร้านมีผู้ใต้บังคับบัญชาโดยตรง 3 ตำแหน่งคือ หัวหน้าบาริสต้า แคชเชียร์ และผู้ดูแลร้านออนไลน์ หัวหน้าบาริสต้ามีบาริสต้าอยู่ใต้ 2 คน"
    caption: "แผนผังองค์การเป็นผลงานของการจัดองค์การ เส้นแต่ละเส้นบอกว่าใครรายงานต่อใคร"
  - type: worked-example
    title: เลือกรูปแบบธุรกิจเมื่อเพื่อนสามคนเปิดร้านออนไลน์
    problem: "เพื่อนสามคนจะเปิดร้านขายสินค้าออนไลน์ และคาดว่าอาจต้องกู้เงินมาสต็อกสินค้า กรณีที่เลวร้ายที่สุดร้านอาจมีหนี้ $600{,}000$ บาท เปรียบเทียบความเสี่ยงต่อทรัพย์สินส่วนตัว ถ้าตั้งเป็นห้างหุ้นส่วนสามัญ กับตั้งเป็นบริษัทจำกัดที่เพื่อนคนหนึ่งถือหุ้น $10{,}000$ หุ้น มูลค่าหุ้นละ $10$ บาท และจ่ายค่าหุ้นแล้วหุ้นละ $6$ บาท"
    steps:
      - text: "ห้างหุ้นส่วนสามัญ: หุ้นส่วนทุกคนรับผิดร่วมกันในหนี้ทั้งหมดโดยไม่จำกัดจำนวน เจ้าหนี้จึงอาจเรียกให้ชำระหนี้ได้ถึง $600{,}000$ บาท และทรัพย์สินส่วนตัวของหุ้นส่วนก็อาจถูกนำมาชำระหนี้"
      - text: "บริษัทจำกัด: บริษัทเป็นนิติบุคคลแยกจากผู้ถือหุ้น ผู้ถือหุ้นรับผิดไม่เกินค่าหุ้นที่ยังจ่ายไม่ครบ"
        why: "นี่คือความหมายของคำว่า \"จำกัด\" ในชื่อบริษัทจำกัด"
      - text: "ค่าหุ้นที่ยังค้าง $= 10{,}000 \\times (10 - 6) = 40{,}000$ บาท เป็นจำนวนสูงสุดที่เพื่อนคนนี้ต้องจ่ายเพิ่ม"
      - text: "สรุป: บริษัทจำกัดจำกัดความเสี่ยงต่อทรัพย์สินส่วนตัวได้ดีกว่า แลกกับการจดทะเบียนและหน้าที่ตามกฎหมายที่มากกว่า"
    answer: "ห้างหุ้นส่วนสามัญอาจต้องรับผิดถึง $600{,}000$ บาท บริษัทจำกัดรับผิดเพิ่มไม่เกิน $40{,}000$ บาท"
  - { type: check, problem: mgt.fn.p009, prompt: "ลองคิดความรับผิดของผู้ถือหุ้น" }
glossary:
  - { term: การจัดการ, definition: "กระบวนการทำงานร่วมกับผู้อื่นและใช้ทรัพยากรให้บรรลุเป้าหมายขององค์การ ประกอบด้วยการวางแผน การจัดองค์การ การชี้นำ และการควบคุม" }
  - { term: การควบคุม, definition: "การวัดผลงานจริง เปรียบเทียบกับเป้าหมายหรือมาตรฐาน แล้วแก้ไขเมื่อไม่เป็นไปตามแผน" }
  - { term: บริษัทจำกัด, definition: "ธุรกิจที่บุคคลตั้งแต่ 2 คนร่วมกันตั้ง แบ่งทุนเป็นหุ้นมูลค่าเท่ากัน ผู้ถือหุ้นรับผิดไม่เกินค่าหุ้นที่ยังส่งใช้ไม่ครบ และเป็นนิติบุคคลแยกจากผู้ถือหุ้น" }
  - { term: ห้างหุ้นส่วนจำกัด, definition: "ห้างหุ้นส่วนที่มีหุ้นส่วนจำพวกจำกัดความรับผิดและจำพวกไม่จำกัดความรับผิด หุ้นส่วนผู้จัดการต้องเป็นจำพวกไม่จำกัดความรับผิด และต้องจดทะเบียน" }
  - { term: ผู้มีส่วนได้ส่วนเสีย, definition: "บุคคลหรือกลุ่มที่ได้รับผลหรือมีผลต่อการตัดสินใจของธุรกิจ เช่น เจ้าของ พนักงาน ลูกค้า เจ้าหนี้ ชุมชน รัฐ" }
flashcards:
  - { front: "หน้าที่การจัดการ 4 ด้าน (POLC)", back: "วางแผน (Planning) จัดองค์การ (Organizing) ชี้นำ (Leading) ควบคุม (Controlling)" }
  - { front: "เอายอดขายจริงมาเทียบเป้า เป็นหน้าที่ใด", back: "การควบคุม" }
  - { front: "ห้างหุ้นส่วนสามัญ หุ้นส่วนรับผิดในหนี้อย่างไร", back: "หุ้นส่วนทุกคนรับผิดร่วมกันในหนี้ทั้งหมดโดยไม่จำกัดจำนวน" }
  - { front: "บริษัทจำกัดต้องมีผู้ก่อตั้งอย่างน้อยกี่คน (ตั้งแต่ 7 ก.พ. 2566)", back: "2 คน (เดิม 3 คน) ส่วนบริษัทมหาชนจำกัดต้องมีผู้ถือหุ้นตั้งแต่ 15 คน" }
  - { front: "ผู้มีส่วนได้ส่วนเสียภายในกับภายนอก", back: "ภายใน: เจ้าของ ผู้จัดการ พนักงาน ภายนอก: ลูกค้า ผู้ขายวัตถุดิบ เจ้าหนี้ ชุมชน รัฐ" }
