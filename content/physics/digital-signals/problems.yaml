      - { match: "EEEEEE", feedback: "ถ้าไม่สนใจช่องว่าง จุดทุกตัวจะเป็น E หมด ช่องว่างบอกว่าตัวอักษรหนึ่งจบตรงไหน" }
    hints:
      - "แยกกลุ่มตามช่องว่างก่อน"
