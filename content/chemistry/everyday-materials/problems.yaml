    solution: "น้ำหนักรวม $200 \\times 15 = 3{,}000$ กรัม $= 3$ กิโลกรัม ได้เงิน $3 \\times 50 = 150$ บาท เงินอาจไม่มาก แต่กระป๋องที่หลอมใหม่ช่วยลดการขุดแร่และใช้พลังงานน้อยกว่าการผลิตอะลูมิเนียมจากแร่มาก"
