  - id: biology.diversity.biodiversity.p016
    topics: [biology.diversity.biodiversity]
    difficulty: 5
    type: numeric
    stem: "นักเรียนสำรวจปลาในแนวปะการังสองแห่ง พบปลา 4 ชนิดเท่ากัน รวม 40 ตัวเท่ากัน แห่งที่ 1 นับได้ 10, 10, 10, 10 ตัว ได้ $D = 0.75$ แห่งที่ 2 นับได้ 34, 2, 2, 2 ตัว จงหาดัชนีซิมป์สัน $D = 1 - \\sum p_i^2$ ของแห่งที่ 2 ตอบทศนิยม 2 ตำแหน่ง"
    answer: { value: 0.27, tolerance: 0.01 }
    hints:
      - "หา $p_i$ ของแต่ละชนิดโดยหารด้วย 40"
      - "ชนิดที่มีมากที่สุดมีผลต่อ $\\sum p_i^2$ มากที่สุด"
    misconceptions:
      - { match: 0.73, feedback: "นี่คือ $\\sum p_i^2$ ยังไม่ได้นำไปลบออกจาก 1" }
      - { match: 0.75, feedback: "จำนวนชนิดเท่ากันไม่ได้แปลว่าดัชนีเท่ากัน ต้องคำนวณจากจำนวนจริง" }
    solution: "$\\sum p_i^2 = \\frac{34^2 + 2^2 + 2^2 + 2^2}{40^2} = \\frac{1{,}168}{1{,}600} = 0.73$ ดังนั้น $D = 1 - 0.73 = 0.27$ ต่ำกว่าแห่งที่ 1 มาก แม้จำนวนชนิดเท่ากัน เพราะปลาชนิดเดียวครองถึง 85%"
