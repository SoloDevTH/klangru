id: math.functions.linear-graphs
subject: math
title: { th: กราฟของสมการเชิงเส้น, en: Graphs of linear equations }
summary: เขียนและอ่านกราฟเส้นตรง หาความชันจากสองจุดและระยะตัดแกน y แล้วใช้ความชันตรวจว่าเส้นตรงสองเส้นขนานหรือตั้งฉากกัน
difficulty: 4
minutes: 35
prerequisites: [math.functions.coordinate-plane, math.algebra.linear-eq]
encompasses:
  - { id: math.functions.coordinate-plane, weight: 0.4 }
  - { id: math.algebra.linear-eq, weight: 0.3 }
  - { id: math.algebra.expressions, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - { type: check, problem: math.lgr.p016, prompt: "แทนค่าดูว่าจุดใดทำให้สมการเป็นจริง" }
  - type: worked-example
    title: อ่านความชันจากกราฟด้วยสามเหลี่ยมความชัน
    problem: "หาสมการของเส้นตรงในภาพ"
    figure: { src: slope-triangles.svg, alt: "เส้นตรงบนระนาบพิกัดผ่านจุด (0, 1), (3, 3) และ (6, 5) มีสามเหลี่ยมความชันสองรูป รูปเล็กจาก (0, 1) ไปทางขวา 3 ขึ้น 2 ถึง (3, 3) รูปใหญ่จาก (0, 1) ไปทางขวา 6 ขึ้น 4 ถึง (6, 5)" }
    steps:
      - text: "เส้นตัดแกน $y$ ที่ $(0, 1)$ จึงได้ $c = 1$"
      - text: "เลือกจุดที่ตรงเส้นกริดพอดี เช่น $(0, 1)$ กับ $(3, 3)$ ไปทางขวา 3 ขึ้น 2 ความชัน $m = \\frac{2}{3}$"
        why: "จุดที่ตรงจุดตัดของเส้นกริดอ่านพิกัดได้แน่นอน จุดอื่นอาจอ่านคลาดเคลื่อน"
      - text: "ตรวจด้วยสามเหลี่ยมใหญ่จาก $(0, 1)$ ถึง $(6, 5)$: ไปทางขวา 6 ขึ้น 4 ได้ $\\frac{4}{6} = \\frac{2}{3}$ เท่าเดิม"
        why: "สามเหลี่ยมทั้งสองคล้ายกัน อัตราส่วนด้านจึงเท่ากัน จะเลือกสองจุดใดบนเส้นก็ได้ความชันเดียวกัน"
      - text: "เขียนสมการ $y = \\frac{2}{3}x + 1$ แล้วตรวจกับจุด $(6, 5)$: $\\frac{2}{3}(6) + 1 = 5$ ✓"
    answer: "$y = \\frac{2}{3}x + 1$"
  - { type: check, problem: math.lgr.p015, prompt: "ลองอ่านสมการจากกราฟเอง" }
  - type: worked-example
    title: เทียนไขที่สั้นลงเป็นเส้นตรง
    problem: "เทียนเล่มหนึ่งไหม้ด้วยอัตราคงที่ หลังจุด 2 ชั่วโมงสูง 19 เซนติเมตร หลังจุด 5 ชั่วโมงสูง 10 เซนติเมตร เขียนความสูง $h$ เป็นฟังก์ชันของเวลา $t$ อธิบายความหมายของความชันและระยะตัดแกน และหาว่าเทียนจะไหม้หมดเมื่อใด"
    steps:
      - text: "อัตราคงที่ แปลว่ากราฟเป็นเส้นตรงผ่าน $(2, 19)$ และ $(5, 10)$"
      - text: "ความชัน $m = \\frac{10 - 19}{5 - 2} = \\frac{-9}{3} = -3$ เซนติเมตรต่อชั่วโมง"
        why: "ความชันติดลบ แปลว่าความสูงลดลง เทียนสั้นลงชั่วโมงละ 3 เซนติเมตร"
      - text: "แทน $(2, 19)$ ใน $h = -3t + c$: $19 = -6 + c$ ได้ $c = 25$"
      - text: "$c = 25$ คือความสูงเมื่อ $t = 0$ แปลว่าเทียนยาว 25 เซนติเมตรก่อนจุด"
      - text: "เทียนหมดเมื่อ $h = 0$: $-3t + 25 = 0$ ได้ $t = \\frac{25}{3} \\approx 8.33$ ชั่วโมง หรือประมาณ 8 ชั่วโมง 20 นาที"
        why: "นี่คือจุดตัดแกน $t$ ของกราฟ"
    answer: "$h = -3t + 25$ เทียนสั้นลงชั่วโมงละ 3 cm เริ่มยาว 25 cm และไหม้หมดหลังจุดประมาณ 8 ชั่วโมง 20 นาที"
  - type: interactive
    title: ลองเปลี่ยนความชันและระยะตัดแกน y
    caption: เส้นสีแรกคือ y = mx + c ส่วนเส้นที่สองคือ y = 2x + 1 ไว้เทียบ เลื่อน m แล้วดูความเอียงเปลี่ยน เลื่อน c แล้วดูเส้นขยับขึ้นลง ตั้ง m = 2 จะได้เส้นขนาน ตั้ง m = −0.5 จะได้เส้นตั้งฉาก
    widget:
      kind: function-plot
      functions: ["m x + c", "2 x + 1"]
      sliders:
        - { name: m, min: -4, max: 4, step: 0.5, value: 1, label: ความชัน }
        - { name: c, min: -5, max: 5, step: 1, value: 0, label: ระยะตัดแกน y }
      x: [-6, 6]
      y: [-6, 6]
  - type: simulation
    title: กราฟเส้นตรงรูปความชันและระยะตัดแกน (PhET Graphing Slope-Intercept)
    url: https://phet.colorado.edu/en/simulations/graphing-slope-intercept
    provider: phet
    note: ปรับความชันและระยะตัดแกน y แล้วดูสมการเปลี่ยนตาม หรือลากเส้นแล้วอ่านสมการจากกราฟ
glossary:
  - { term: ความชัน, definition: "อัตราการเปลี่ยนของ $y$ ต่อ $x$ หาได้จาก $m = \\dfrac{y_2 - y_1}{x_2 - x_1}$" }
  - { term: ระยะตัดแกน y, definition: "ค่า $y$ ของจุดที่เส้นตัดแกน $y$ คือค่า $y$ เมื่อ $x = 0$ เป็น $c$ ใน $y = mx + c$" }
  - { term: เส้นขนาน, definition: "เส้นตรงสองเส้นที่ไม่ตัดกัน มีความชันเท่ากัน" }
  - { term: เส้นตั้งฉาก, definition: "เส้นตรงสองเส้นที่ตัดกันเป็นมุมฉาก ผลคูณของความชันเป็น $-1$" }
flashcards:
  - { front: "ใน $y = mx + c$ ตัว $m$ และ $c$ หมายถึงอะไร", back: "$m$ คือความชัน $c$ คือระยะตัดแกน $y$ (ค่า $y$ เมื่อ $x = 0$)" }
  - { front: "สูตรความชันจากสองจุด", back: "$m = \\dfrac{y_2 - y_1}{x_2 - x_1}$" }
  - { front: "เส้นที่ตั้งฉากกับเส้นความชัน 3 มีความชันเท่าใด", back: "$-\\dfrac{1}{3}$ เพราะ $3 \\times \\left(-\\dfrac13\\right) = -1$" }
  - { front: "เส้น $y = 4$ และ $x = 4$ ต่างกันอย่างไร", back: "$y = 4$ เป็นเส้นแนวนอน ความชัน 0 ส่วน $x = 4$ เป็นเส้นแนวตั้ง ไม่มีความชัน" }
