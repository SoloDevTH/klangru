id: chinese.grammar.modal-verbs
subject: chinese
title: { th: "กริยาช่วย 想 要 会 能 และ 可以", en: "Modal verbs 想, 要, 会, 能 and 可以" }
summary: 想 และ 要 บอกความต้องการ 会 และ 能 บอกความสามารถ 可以 ใช้ขออนุญาต พร้อมรูปปฏิเสธ 不想 不用 不会 不能 不可以 และการเลือกคำให้ตรงกับคำว่า ได้ ในภาษาไทย
difficulty: 3
minutes: 35
prerequisites: [chinese.grammar.negation-le]
encompasses:
  - { id: chinese.grammar.negation-le, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: modal-map.svg
    alt: "แผนผัง 5 แถว คอลัมน์คำไทยที่ใกล้เคียง ภาษาจีน และรูปปฏิเสธ: อยาก → 想 xiǎng → 不想 · ต้องการ จะ ต้อง → 要 yào → 不想 (ไม่อยาก) / 不用 (ไม่ต้อง) · …เป็น (ทักษะที่ฝึกมา) → 会 huì → 不会 · …ได้ (ความสามารถ สภาพ) → 能 néng → 不能 · …ได้ไหม (ขออนุญาต) → 可以 kěyǐ → 不可以 / 不能 / 不行 ด้านล่าง: 我会游泳 (ว่ายเป็น) 今天我不能游泳 (วันนี้ว่ายไม่ได้)"
    caption: "เลือกกริยาช่วยตามความหมาย ไม่ใช่ตามคำไทยคำเดียว"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: chinese.grammar.modal-verbs.p008, prompt: "会 หรือ 能" }
  - type: worked-example
    title: ปฏิเสธกริยาช่วย
    problem: "เปลี่ยนเป็นปฏิเสธ: (ก) 我要去。 (หมายถึง อยากไป) (ข) 明天要上课。 (พรุ่งนี้ต้องเข้าเรียน) (ค) 我会游泳。"
    steps:
      - text: "(ก) 要 ที่แปลว่าอยาก/ต้องการ ปฏิเสธด้วย 不想: 我不想去。"
        why: "不要 มักเป็นคำห้าม อย่า"
      - text: "(ข) 要 ที่แปลว่า ต้อง ปฏิเสธด้วย 不用: 明天不用上课。"
      - text: "(ค) 会 ปฏิเสธด้วย 不 หน้ากริยาช่วย: 我不会游泳。"
    answer: "我不想去。 · 明天不用上课。 · 我不会游泳。"
  - type: worked-example
    title: แปลคำว่า ได้
    problem: "แปล: (ก) ฉันพูดภาษาจีนได้ (เพราะเรียนมา) (ข) วันนี้ฉันมาไม่ได้ (ไม่สบาย) (ค) ขอยืมปากกาได้ไหม (用 yòng = ใช้, 笔 bǐ = ปากกา)"
    steps:
      - text: "(ก) ทักษะที่เรียนมาใช้ 会: 我会说中文。"
      - text: "(ข) สภาพไม่พร้อมใช้ 不能: 今天我不能来。"
      - text: "(ค) ขออนุญาตใช้ 可以…吗: 我可以用你的笔吗？"
        why: "ภาษาไทยใช้ ได้ ทั้งสามประโยค แต่ภาษาจีนแยกตามความหมาย"
    answer: "我会说中文。 · 今天我不能来。 · 我可以用你的笔吗？"
  - { type: check, problem: chinese.grammar.modal-verbs.p009, prompt: "ไม่ต้อง กับ อย่า" }
glossary:
  - { term: "想 xiǎng", definition: "อยาก วางหน้ากริยา ปฏิเสธ 不想" }
  - { term: "要 yào", definition: "ต้องการ จะ ต้อง ปฏิเสธเป็น 不想 (ไม่อยาก) หรือ 不用 (ไม่ต้อง)" }
  - { term: "会 huì", definition: "ทำเป็น (ทักษะที่เรียนมา) และบอกการคาดการณ์ เช่น 明天会下雨" }
  - { term: "能 néng", definition: "ทำได้ เพราะมีความสามารถถึงระดับนั้นหรือสภาพพร้อม" }
  - { term: "可以 kěyǐ", definition: "ทำได้ ได้รับอนุญาต ใช้ขออนุญาตด้วย 可以…吗" }
flashcards:
  - { front: "ว่ายน้ำเป็น / วันนี้ว่ายไม่ได้", back: "我会游泳。 / 今天我不能游泳。" }
  - { front: "ที่นี่ถ่ายรูปได้ไหม", back: "这儿可以拍照吗？" }
  - { front: "ไม่ต้อง กับ อย่า", back: "不用 · 不要 (别)" }
  - { front: "ตำแหน่งของ 不 กับกริยาช่วย", back: "不 + กริยาช่วย + กริยา: 我不会说" }
