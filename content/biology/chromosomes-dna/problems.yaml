problems:
  - id: biology.genetics.chromosomes-dna.p001
    topics: [biology.genetics.chromosomes-dna]
    difficulty: 1
    type: mcq
    stem: "ใน DNA สายคู่ เบสกวานีน (G) เข้าคู่กับเบสใด และยึดกันด้วยพันธะไฮโดรเจนกี่พันธะ"
    choices:
      - { id: a, text: "ไซโทซีน (C) ด้วย 3 พันธะ", correct: true }
      - { id: b, text: "ไซโทซีน (C) ด้วย 2 พันธะ", feedback: "2 พันธะเป็นของคู่ A กับ T คู่ C กับ G มี 3 พันธะ" }
      - { id: c, text: "อะดีนีน (A) ด้วย 2 พันธะ", feedback: "A เข้าคู่กับ T ไม่ใช่ G" }
      - { id: d, text: "ยูราซิล (U) ด้วย 3 พันธะ", feedback: "ยูราซิลพบใน RNA ไม่พบใน DNA" }
    hints:
      - "เบสใน DNA มี A T C G"
      - "คู่ที่มีพันธะมากกว่าคือคู่ใด"
    solution: "G เข้าคู่กับ C ด้วยพันธะไฮโดรเจน 3 พันธะ ส่วน A เข้าคู่กับ T ด้วย 2 พันธะ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.chromosomes-dna.p002
    topics: [biology.genetics.chromosomes-dna]
    difficulty: 1
    type: match
    stem: "จับคู่โมเลกุลกับหน้าที่ในการจำลอง DNA และการสังเคราะห์โปรตีน"
    pairs:
      - { left: "mRNA", right: "นำรหัสจาก DNA ไปยังไรโบโซม" }
      - { left: "tRNA", right: "นำกรดอะมิโนมาโดยใช้แอนติโคดอนเข้าคู่กับโคดอน" }
      - { left: "rRNA", right: "เป็นองค์ประกอบหลักของไรโบโซม" }
      - { left: "DNA พอลิเมอเรส", right: "เติมนิวคลีโอไทด์สร้างสาย DNA ใหม่" }
    hints:
      - "อักษรตัวแรกบอกหน้าที่ m = messenger (ตัวนำสาร)"
      - "ไรโบโซมประกอบด้วย RNA ชนิดหนึ่งร่วมกับโปรตีน"
    solution: "mRNA นำรหัส tRNA นำกรดอะมิโน rRNA เป็นส่วนของไรโบโซม และ DNA พอลิเมอเรสสร้างสาย DNA ใหม่ในการจำลอง DNA"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.chromosomes-dna.p003
    topics: [biology.genetics.chromosomes-dna]
    difficulty: 1
    type: text
    stem: "โคดอนเริ่มบน mRNA ซึ่งแทนกรดอะมิโนเมไทโอนีนคือโคดอนใด (พิมพ์ 3 ตัวอักษร)"
    accepted: ["AUG"]
    hints:
      - "mRNA ใช้เบส U แทน T"
      - "ดูโคดอนที่มีคำว่าเริ่มในตารางรหัสพันธุกรรม"
    misconceptions:
      - { match: "ATG", feedback: "ATG เป็นลำดับบน DNA สายที่ไม่ใช่แม่แบบ บน mRNA ใช้ U แทน T" }
      - { match: "UAA", feedback: "UAA เป็นรหัสหยุด ไม่ใช่รหัสเริ่ม" }
    solution: "AUG เป็นรหัสเริ่มและแทนเมไทโอนีน พอลิเพปไทด์ส่วนใหญ่จึงเริ่มต้นด้วยเมไทโอนีน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.chromosomes-dna.p004
    topics: [biology.genetics.chromosomes-dna]
    difficulty: 2
    type: numeric
    stem: "DNA สายคู่ช่วงหนึ่งยาว 1,000 คู่เบส มีเบส G ทั้งหมด 280 เบส ช่วงนี้มีเบส A ทั้งหมดกี่เบส"
    answer: { value: 720, unit: เบส }
    hints:
      - "1,000 คู่เบสมีเบสทั้งหมดกี่เบส"
      - "จำนวน C เท่ากับ G และจำนวน A เท่ากับ T"
    misconceptions:
      - { match: 220, feedback: "คิดว่ามีเบสทั้งหมด 1,000 เบส แต่ 1,000 คู่เบสมีเบส 2,000 เบส" }
      - { match: 280, feedback: "จำนวน A เท่ากับ T ไม่ใช่เท่ากับ G" }
    solution: "เบสทั้งหมด $2 \\times 1{,}000 = 2{,}000$ เบส G = C = 280 รวม 560 เบส ที่เหลือ $2{,}000 - 560 = 1{,}440$ เป็น A และ T อย่างละครึ่ง A = 720 เบส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.chromosomes-dna.p005
    topics: [biology.genetics.chromosomes-dna]
    difficulty: 2
    type: mcq
    stem: "DNA สายแม่แบบมีลำดับเบส 3′-TACGGA-5′ mRNA ที่ถอดรหัสได้มีลำดับเบสใด"
    choices:
      - { id: a, text: "5′-AUGCCU-3′", correct: true }
      - { id: b, text: "5′-ATGCCT-3′", feedback: "RNA ใช้ U แทน T" }
      - { id: c, text: "5′-TACGGA-3′", feedback: "mRNA ต้องเข้าคู่กับสายแม่แบบ ไม่ใช่ลำดับเดียวกับสายแม่แบบ" }
      - { id: d, text: "5′-UCCGUA-3′", feedback: "กลับทิศการอ่าน mRNA เข้าคู่กับแม่แบบแบบสวนทาง จึงเริ่มจากเบสที่คู่กับปลาย 3′ ของแม่แบบ" }
    hints:
      - "เขียนเบสที่เข้าคู่กันทีละตัว โดยใช้ U แทน T"
      - "mRNA กับสายแม่แบบวางสวนทางกัน ปลาย 5′ ของ mRNA อยู่ตรงข้ามกับปลาย 3′ ของแม่แบบ"
    solution: "T→A A→U C→G G→C G→C A→U ได้ 5′-AUGCCU-3′ เริ่มด้วยรหัสเริ่ม AUG"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.chromosomes-dna.p006
    topics: [biology.genetics.chromosomes-dna]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนตั้งแต่ยีนจนได้พอลิเพปไทด์ในเซลล์ยูแคริโอต"
    items:
      - "RNA พอลิเมอเรสใช้ DNA สายแม่แบบสร้าง mRNA ในนิวเคลียส"
      - "ตัดอินทรอนออกจาก mRNA"
      - "mRNA ออกจากนิวเคลียสไปยังไรโบโซม"
      - "tRNA นำกรดอะมิโนมาเข้าคู่กับโคดอนทีละโคดอน"
      - "ไรโบโซมพบรหัสหยุด พอลิเพปไทด์หลุดออก"
    hints:
      - "การถอดรหัสเกิดก่อนการแปลรหัส"
      - "mRNA ถูกตัดแต่งก่อนออกจากนิวเคลียส"
    solution: "ถอดรหัสเป็น mRNA → ตัดอินทรอน → mRNA ไปไรโบโซม → tRNA นำกรดอะมิโนมาตามโคดอน → พบรหัสหยุดแล้วปล่อยพอลิเพปไทด์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.chromosomes-dna.p007
    topics: [biology.genetics.chromosomes-dna]
    difficulty: 2
    type: numeric
    stem: "ส่วนของ mRNA ตั้งแต่รหัสเริ่ม AUG จนถึงก่อนรหัสหยุดยาว 450 นิวคลีโอไทด์ พอลิเพปไทด์ที่ได้มีกรดอะมิโนกี่หน่วย"
    answer: { value: 150, unit: หน่วย }
    hints:
      - "หนึ่งโคดอนมีกี่นิวคลีโอไทด์"
      - "รหัสหยุดไม่แทนกรดอะมิโน และไม่ได้นับรวมอยู่ใน 450 นิวคลีโอไทด์นี้แล้ว"
    misconceptions:
      - { match: 450, feedback: "กรดอะมิโน 1 หน่วยใช้ 3 นิวคลีโอไทด์ ไม่ใช่ 1 นิวคลีโอไทด์" }
      - { match: 1350, feedback: "ต้องหารด้วย 3 ไม่ใช่คูณด้วย 3" }
    solution: "1 โคดอน = 3 นิวคลีโอไทด์ = กรดอะมิโน 1 หน่วย จึงได้ $450 \\div 3 = 150$ หน่วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.chromosomes-dna.p008
    topics: [biology.genetics.chromosomes-dna]
    difficulty: 3
    type: text
    stem: "ใช้ตารางรหัสพันธุกรรมแปลรหัส mRNA 5′-AUG UUU GGC UAA-3′ ตอบเป็นชื่อย่อกรดอะมิโนเรียงกัน คั่นด้วยขีด เช่น Ala-Ser"
    figure: { src: genetic-code.svg, alt: "ตารางรหัสพันธุกรรมมาตรฐานของโคดอนบน mRNA 64 โคดอน แถวคือเบสตัวที่ 1 คอลัมน์คือเบสตัวที่ 2 ภายในแต่ละช่องเรียงตามเบสตัวที่ 3 U C A G ตัวอย่าง UUU และ UUC เป็น Phe GGU GGC GGA GGG เป็น Gly AAA AAG เป็น Lys UGG เป็น Trp GAA GAG เป็น Glu GUU GUC GUA GUG เป็น Val AUG เป็น Met และเป็นรหัสเริ่ม UAA UAG UGA เป็นรหัสหยุด (ตารางครบทุกโคดอนตามรหัสพันธุกรรมมาตรฐาน)" }
    accepted: ["Met-Phe-Gly", "Met Phe Gly", "MetPheGly", "Met-Phe-Gly-หยุด", "เมไทโอนีน-ฟีนิลแอลานีน-ไกลซีน"]
    hints:
      - "อ่านทีละ 3 เบสจากปลาย 5′"
      - "UAA เป็นรหัสหยุด ไม่มีกรดอะมิโน"
    misconceptions:
      - { match: "Met-Phe-Gly-Stop", feedback: "รหัสหยุดไม่แทนกรดอะมิโน ไม่ต้องเขียนรวมในพอลิเพปไทด์" }
      - { match: "Tyr-Lys-Pro", feedback: "แปลจากลำดับที่เข้าคู่กันแทน mRNA ให้เทียบโคดอนของ mRNA กับตารางโดยตรง" }
    solution: "AUG = Met, UUU = Phe, GGC = Gly, UAA = หยุด พอลิเพปไทด์คือ Met-Phe-Gly"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.chromosomes-dna.p009
    topics: [biology.genetics.chromosomes-dna]
    difficulty: 3
    type: numeric
    stem: "ตามการทดลองของเมเซลสันและสตาห์ล แบคทีเรียที่ DNA หนัก (¹⁵N/¹⁵N) ถูกย้ายไปเลี้ยงใน ¹⁴N และจำลอง DNA ไป 3 รุ่น โมเลกุล DNA ที่มีความหนาแน่นกึ่งกลาง (¹⁵N/¹⁴N) คิดเป็นสัดส่วนเท่าใดของ DNA ทั้งหมด ตอบเป็นทศนิยม"
    answer: { value: 0.25, tolerance: 0.01 }
    hints:
      - "เริ่มจาก DNA 1 โมเลกุล หลัง 3 รุ่นจะมีกี่โมเลกุล"
      - "สาย ¹⁵N เดิมมี 2 สาย และไม่ถูกทำลาย แต่ละสายอยู่ในโมเลกุลกึ่งกลางหนึ่งโมเลกุล"
    misconceptions:
      - { match: 0.5, feedback: "0.5 คือสัดส่วนในรุ่นที่ 2 ข้อนี้ถามรุ่นที่ 3" }
      - { match: 0.75, feedback: "นี่คือสัดส่วนของ DNA แบบเบา (¹⁴N/¹⁴N)" }
    solution: "หลัง 3 รุ่นมี $2^3 = 8$ โมเลกุล สาย ¹⁵N เดิม 2 สายอยู่ใน 2 โมเลกุลที่เป็นแบบกึ่งกลาง สัดส่วน $\\frac{2}{8} = 0.25$ ที่เหลือ 6 โมเลกุลเป็นแบบเบา ตรงกับการจำลองแบบกึ่งอนุรักษ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.chromosomes-dna.p010
    topics: [biology.genetics.chromosomes-dna]
    difficulty: 3
    type: mcq
    stem: "ลักษณะหนึ่งถ่ายทอดด้วยแอลลีลเด่นบนโครโมโซม X ชายที่แสดงลักษณะนี้แต่งงานกับหญิงที่ไม่มีแอลลีลนี้ ลูกจะเป็นอย่างไร"
    choices:
      - { id: a, text: "ลูกสาวทุกคนแสดงลักษณะ ลูกชายทุกคนไม่แสดง", correct: true }
      - { id: b, text: "ลูกชายทุกคนแสดงลักษณะ ลูกสาวทุกคนไม่แสดง", feedback: "พ่อส่ง Y ให้ลูกชาย ไม่ได้ส่ง X จึงไม่ได้ส่งแอลลีลบน X ให้ลูกชาย" }
      - { id: c, text: "ลูกทุกคนมีโอกาสแสดงลักษณะ 1/2 ไม่ขึ้นกับเพศ", feedback: "แบบนี้เป็นการถ่ายทอดยีนบนออโตโซมจากพ่อที่เป็นเฮเทอโรไซกัส ยีนบน X ขึ้นกับเพศของลูก" }
    hints:
      - "พ่อส่งโครโมโซมใดให้ลูกสาว และส่งโครโมโซมใดให้ลูกชาย"
      - "แอลลีลเด่นแสดงออกแม้มีเพียงหนึ่งแอลลีล"
    solution: "พ่อ XᴿY ส่ง Xᴿ ให้ลูกสาวทุกคน ลูกสาวจึงเป็น XᴿX แสดงลักษณะ ส่วนลูกชายได้ Y จากพ่อและ X ปกติจากแม่ จึงไม่แสดงลักษณะ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.chromosomes-dna.p011
    topics: [biology.genetics.chromosomes-dna]
    difficulty: 3
    type: mcq
    stem: "แมววิเชียรมาศมีขนสีอ่อนตามลำตัว แต่หู หน้า เท้า และหางมีสีเข้ม ถ้าโกนขนบริเวณหลังแล้วพันผ้าเย็นไว้ระหว่างที่ขนงอกใหม่ ขนใหม่บริเวณนั้นน่าจะเป็นอย่างไร"
    choices:
      - { id: a, text: "สีเข้มขึ้น เพราะเอนไซม์สร้างสีขนทำงานได้ดีที่อุณหภูมิต่ำ", correct: true }
      - { id: b, text: "สีอ่อนเหมือนเดิม เพราะสีขนถูกกำหนดด้วยยีนเท่านั้น", feedback: "ยีนกำหนดเอนไซม์ แต่การทำงานของเอนไซม์ขึ้นกับอุณหภูมิ สิ่งแวดล้อมจึงมีผลต่อฟีโนไทป์" }
      - { id: c, text: "แมวตัวนั้นจะมียีนสีขนเปลี่ยนไปและส่งต่อให้ลูก", feedback: "อุณหภูมิไม่ได้เปลี่ยนลำดับเบสของยีน จึงไม่ถ่ายทอดสู่ลูก" }
    hints:
      - "ทำไมขนเข้มเฉพาะส่วนปลายของร่างกาย"
      - "ส่วนปลายของร่างกายอุ่นหรือเย็นกว่าลำตัว"
    solution: "ยีนสร้างเอนไซม์ที่สร้างสีขนได้เฉพาะที่อุณหภูมิต่ำ ส่วนปลายที่เย็นกว่าจึงมีสีเข้ม ถ้าทำให้ผิวหนังบริเวณหลังเย็น ขนใหม่จะเข้มขึ้น แสดงว่าฟีโนไทป์เกิดจากจีโนไทป์ร่วมกับสิ่งแวดล้อม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.chromosomes-dna.p012
    topics: [biology.genetics.chromosomes-dna]
    difficulty: 3
    type: mcq
    stem: "ในโรคโลหิตจางชนิดเซลล์รูปเคียว โคดอนที่ 6 บน mRNA ของเบตาโกลบินเปลี่ยนจาก GAG เป็น GUG มิวเทชันนี้เป็นแบบใด"
    figure: { src: genetic-code.svg, alt: "ตารางรหัสพันธุกรรมมาตรฐานของโคดอนบน mRNA 64 โคดอน แถวคือเบสตัวที่ 1 คอลัมน์คือเบสตัวที่ 2 ภายในแต่ละช่องเรียงตามเบสตัวที่ 3 U C A G ตัวอย่าง UUU และ UUC เป็น Phe GGU GGC GGA GGG เป็น Gly AAA AAG เป็น Lys UGG เป็น Trp GAA GAG เป็น Glu GUU GUC GUA GUG เป็น Val AUG เป็น Met และเป็นรหัสเริ่ม UAA UAG UGA เป็นรหัสหยุด (ตารางครบทุกโคดอนตามรหัสพันธุกรรมมาตรฐาน)" }
    choices:
      - { id: a, text: "การแทนที่เบสที่ทำให้กรดอะมิโนเปลี่ยนจาก Glu เป็น Val", correct: true }
      - { id: b, text: "การแทนที่เบสที่ไม่เปลี่ยนกรดอะมิโน", feedback: "เทียบตารางแล้ว GAG เป็น Glu แต่ GUG เป็น Val กรดอะมิโนจึงเปลี่ยน" }
      - { id: c, text: "การขาดหายของเบสที่ทำให้กรอบการอ่านเลื่อน", feedback: "โคดอนยังมี 3 เบสเท่าเดิม มีเบสเปลี่ยนเพียงตัวเดียว ไม่มีเบสหายไป" }
      - { id: d, text: "การแทนที่เบสที่ทำให้เกิดรหัสหยุด", feedback: "GUG ไม่ใช่รหัสหยุด รหัสหยุดคือ UAA UAG UGA" }
    hints:
      - "เทียบ GAG กับ GUG ว่าต่างกันกี่เบส"
      - "หากรดอะมิโนของทั้งสองโคดอนในตาราง"
    solution: "เบสตัวกลางเปลี่ยนจาก A เป็น U จำนวนเบสเท่าเดิม จึงเป็นการแทนที่เบส GAG แทน Glu ส่วน GUG แทน Val โปรตีนจึงมีกรดอะมิโนต่างไปหนึ่งหน่วย ซึ่งพอทำให้ฮีโมโกลบินจับกันเป็นเส้นและเม็ดเลือดแดงเป็นรูปเคียว"
