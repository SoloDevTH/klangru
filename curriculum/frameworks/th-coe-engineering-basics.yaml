    - id: CIV-2.5
      text: วิศวกรรมสำรวจ
  - id: CIV-3
    text: องค์ความรู้เฉพาะทางวิศวกรรม
    indicators:
    - id: CIV-3.1
      text: 'กลุ่มที่ ๑ วิศวกรรมโครงสร้าง (Structural Engineering): ความรู้ด้านวัสดุที่ใช้ในงานก่อสร้าง การวิเคราะห์โครงสร้าง ออกแบบและให้รายละเอียดโครงสร้างภายใต้แรงกระทำในรูปแบบต่าง ๆ อาทิ แรงโน้มถ่วงของโลก แรงลม แรงแผ่นดินไหว และอื่น ๆ'
    - id: CIV-3.2
      text: 'กลุ่มที่ ๒ วิศวกรรมการก่อสร้างและการจัดการ (Construction Engineering and Management): ความรู้พื้นฐานเกี่ยวกับอุตสาหกรรมก่อสร้าง การบริหารโครงการ การประมาณต้นทุนและการจัดทำงบประมาณ ความปลอดภัยและการจัดการความเสี่ยง แนวคิดและหลักการของเศรษฐศาสตร์วิศวกรรม เทคโนโลยีเพื่อการก่อสร้างและการจัดการ และกฎหมายข้อบังคับที่เกี่ยวข้อง'
    - id: CIV-3.3
      text: 'กลุ่มที่ ๓ วิศวกรรมขนส่ง (Transportation Engineering): ความรู้พื้นฐานเกี่ยวกับการขนส่งคนและสินค้า ความรู้เบื้องต้นในการออกแบบทางกายภาพของระบบขนส่ง การออกแบบสิ่งอำนวยความสะดวกสำหรับคนเดินเท้าและจักรยาน ระบบขนส่งสาธารณะ การขนส่งต่อเนื่องหลายรูปแบบและวิศวกรรมการทาง'
    - id: CIV-3.4
      text: 'กลุ่มที่ ๔ วิศวกรรมแหล่งน้ำ (Water Resource Engineering): ความรู้พื้นฐานทางกลศาสตร์ของไหล ความรู้ด้านอุทกวิทยา ออกแบบงานด้านวิศวกรรมชลศาสตร์และการวิเคราะห์พฤติกรรมการไหลของน้ำ การออกแบบโครงสร้างทางชลศาสตร์และระบบโครงข่าย การขนส่งน้ำ วัฏจักรของน้ำ การเก็บรวบรวมและวิเคราะห์ข้อมูลด้านอุทกวิทยาด้วยแบบจำลองทางอุทกวิทยาและสถิติ'
    - id: CIV-3.5
      text: 'กลุ่มที่ ๕ วิศวกรรมเทคนิคธรณี (Geotechnical Engineering): การวิเคราะห์สมบัติทางกายภาพและทางวิศวกรรมของดิน วิธีการสำรวจและจำแนกประเภทของดิน การคำนวณความสามารถในการรับน้ำหนักบรรทุกของดินและการทรุดตัวที่เกิดขึ้น พฤติกรรมของดินและการนำดินไปใช้ในงานวิศวกรรม วิเคราะห์การวิบัติของดินและแนวทางการป้องกันงานออกแบบฐานรากและระบบป้องกันดินได้อย่างเหมาะสม'
- id: ME
  title: สาขาวิศวกรรมเครื่องกล
  standards:
  - id: ME-1
    text: องค์ความรู้พื้นฐานทางวิทยาศาสตร์
    indicators:
    - id: ME-1.1
      text: คณิตศาสตร์วิศวกรรม
    - id: ME-1.2
      text: ฟิสิกส์
    - id: ME-1.3
      text: เคมี
  - id: ME-2
    text: องค์ความรู้พื้นฐานทางวิศวกรรม
    indicators:
    - id: ME-2.1
      text: กลุ่มที่ ๑ พื้นฐานการออกแบบ (Design Fundamentals) ความรู้ที่เกี่ยวข้องกับ Mechanical Drawing, Statics and Dynamics, Mechanical Engineering Process
    - id: ME-2.2
      text: กลุ่มที่ ๒ ความรู้ทางดิจิทัล (Digital Literacy) ความรู้ที่เกี่ยวข้องกับ Digital Technology in Mechanical Engineering
    - id: ME-2.3
      text: กลุ่มที่ ๓ พื้นฐานทางความร้อนและของไหล (Thermo-fluids Fundamentals) ความรู้ที่เกี่ยวข้องกับ Thermodynamics, Fluid Mechanics, Heat Transfer
    - id: ME-2.4
      text: กลุ่มที่ ๔ วัสดุวิศวกรรมและกลศาสตร์วัสดุ (Engineering Materials and Mechanics of Materials) ความรู้ที่เกี่ยวข้องกับ Engineering Materials, Solid Mechanics
    - id: ME-2.5
      text: กลุ่มที่ ๕ ความปลอดภัย สิ่งแวดล้อมและความยั่งยืน (Safety Environment and Sustainability)
  - id: ME-3
    text: องค์ความรู้เฉพาะทางวิศวกรรม
    indicators:
    - id: ME-3.1
      text: กลุ่มที่ ๑ เครื่องจักรกล (Machinery) ความรู้ที่เกี่ยวข้องกับ Machinery Systems, Machine Design, Prime Movers
    - id: ME-3.2
      text: กลุ่มที่ ๒ ความร้อน ความเย็น และของไหลประยุกต์ (Heating, Cooling and Applied Fluids) ความรู้ที่เกี่ยวข้องกับ Air Conditioning and Refrigeration, Power Plant, Thermal System Design, Prime Movers Turbomachinery
    - id: ME-3.3
      text: กลุ่มที่ ๓ ระบบพลวัตและการควบคุมอัตโนมัติ (Dynamic Systems and Automatic Control) ความรู้ที่เกี่ยวข้องกับ Dynamic Systems, Automatic Control, Internet of Things (IoT) and Artificial Intelligence (AI), Robotics, Vibration, Pneumatic and Hydraulic Control
    - id: ME-3.4
      text: กลุ่มที่ ๔ ระบบทางกลและองค์ความรู้ที่เกี่ยวข้อง (Mechanical Systems and Other) ความรู้ที่เกี่ยวข้องกับ Energy, Engineering Management and Economics, Fire Protection System, Computer-Aided Engineering (CAE)
