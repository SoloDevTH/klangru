problems:
  - id: health.sexuality.gender-and-respect.p001
    topics: [health.sexuality.gender-and-respect]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นความแตกต่างทางร่างกายที่แท้จริงระหว่างเพศหญิงกับเพศชาย"
    choices:
      - { id: a, text: "อวัยวะเพศและอวัยวะสืบพันธุ์", correct: true }
      - { id: b, text: "ความฉลาด", feedback: "สติปัญญาไม่ได้ขึ้นกับเพศ ทุกเพศเรียนเก่งได้" }
      - { id: c, text: "ความสามารถในการร้องไห้", feedback: "ทุกคนร้องไห้ได้ เป็นอารมณ์ปกติของมนุษย์ทุกเพศ" }
    hints:
      - "ข้อที่ถูกต้องเป็นเรื่องของร่างกาย"
      - "ความสามารถและอารมณ์ไม่ได้ขึ้นกับเพศ"
    solution: "ร่างกายของเพศหญิงและเพศชายต่างกันที่อวัยวะเพศและอวัยวะสืบพันธุ์ ส่วนความฉลาดและอารมณ์ไม่ได้ขึ้นกับเพศ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sexuality.gender-and-respect.p002
    topics: [health.sexuality.gender-and-respect]
    difficulty: 1
    type: match
    stem: "จับคู่อวัยวะกับเพศที่มีอวัยวะนั้นโดยทั่วไป"
    pairs:
      - { left: "องคชาตและถุงอัณฑะ", right: "เพศชาย" }
      - { left: "มดลูกและรังไข่", right: "เพศหญิง" }
      - { left: "หัวใจและปอด", right: "ทุกเพศ" }
    hints:
      - "อวัยวะสืบพันธุ์ต่างกันตามเพศ"
      - "อวัยวะภายในอื่น ๆ ทุกคนมีเหมือนกัน"
    solution: "องคชาตและถุงอัณฑะ-เพศชาย, มดลูกและรังไข่-เพศหญิง, หัวใจและปอด-ทุกเพศ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sexuality.gender-and-respect.p003
    topics: [health.sexuality.gender-and-respect]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อความใดเป็นภาพเหมารวมทางเพศ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ผู้ชายต้องไม่ร้องไห้", correct: true }
      - { id: b, text: "งานบ้านเป็นงานของผู้หญิง", correct: true }
      - { id: c, text: "เด็กผู้หญิงเล่นฟุตบอลไม่ได้", correct: true }
      - { id: d, text: "ทุกคนเรียนวิศวกรรมได้ถ้าสนใจและฝึกฝน", feedback: "ข้อนี้ไม่ได้ตัดสินคนจากเพศ จึงไม่ใช่ภาพเหมารวม" }
      - { id: e, text: "เพศหญิงมีมดลูกและรังไข่", feedback: "เป็นข้อเท็จจริงทางร่างกาย ไม่ใช่ภาพเหมารวม" }
    hints:
      - "ภาพเหมารวมตัดสินว่าคนทั้งเพศต้องเป็นแบบเดียวกัน"
      - "ข้อที่ถูกมีสามข้อ"
    solution: "ข้อ a b c ตัดสินว่าคนเพศหนึ่งต้องเป็นหรือทำแบบเดียวกันหมด จึงเป็นภาพเหมารวม ข้อ e เป็นข้อเท็จจริงทางร่างกาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sexuality.gender-and-respect.p004
    topics: [health.sexuality.gender-and-respect]
    difficulty: 2
    type: match
    stem: "จับคู่คำกับความหมาย"
    pairs:
      - { left: "เพศกำเนิด", right: "เพศที่ระบุตามร่างกายตอนแรกเกิด" }
      - { left: "เพศสภาพ", right: "ความรู้สึกว่าตนเป็นเพศใดและการแสดงออก" }
      - { left: "ภาพเหมารวม", right: "ความเชื่อว่าคนเพศหนึ่งต้องเหมือนกันหมด" }
      - { left: "ความเสมอภาคทางเพศ", right: "ทุกเพศมีสิทธิและโอกาสเท่ากัน" }
    hints:
      - "คำว่า กำเนิด หมายถึงการเกิด"
      - "เสมอภาค หมายถึงเท่าเทียมกัน"
    solution: "เพศกำเนิด-ตามร่างกายตอนเกิด, เพศสภาพ-ตัวตนที่รู้สึกและแสดงออก, ภาพเหมารวม-เชื่อว่าคนเพศหนึ่งเหมือนกันหมด, ความเสมอภาค-สิทธิและโอกาสเท่ากัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sexuality.gender-and-respect.p005
    topics: [health.sexuality.gender-and-respect]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นพฤติกรรมที่ให้เกียรติผู้อื่นตามวัฒนธรรมไทย"
    choices:
      - { id: a, text: "เคาะประตูและขออนุญาตก่อนเข้าห้องของพี่", correct: true }
      - { id: b, text: "แอบมองเพื่อนเปลี่ยนชุดพละ", feedback: "เป็นการละเมิดความเป็นส่วนตัวของเพื่อน ไม่ว่าเพื่อนจะเป็นเพศใด" }
      - { id: c, text: "จับผมหรือแตะตัวเพื่อนเล่นโดยไม่ถาม", feedback: "การแตะตัวคนอื่นต้องได้รับความยินยอมก่อน" }
    hints:
      - "การให้เกียรติรวมถึงการเคารพความเป็นส่วนตัว"
      - "เลือกข้อที่ถามความยินยอมก่อน"
    solution: "การเคาะประตูขออนุญาตแสดงการเคารพความเป็นส่วนตัว ซึ่งเป็นมารยาทที่ใช้กับทุกเพศ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sexuality.gender-and-respect.p006
    topics: [health.sexuality.gender-and-respect]
    difficulty: 2
    type: numeric
    stem: "จากแผนภูมิผลสำรวจ มีนักเรียนตอบแบบสำรวจทั้งหมดกี่คน (ตอบเป็นคน)"
    figure:
      src: chores-survey.svg
      alt: "แผนภูมิแท่งแนวนอน ใครทำงานบ้านเป็นส่วนใหญ่ในบ้านของเรา สำรวจนักเรียน ป.5 ห้องหนึ่ง คนละ 1 คำตอบ ข้อมูลสมมติ แม่ 18 คน ทุกคนช่วยกัน 12 คน พ่อ 5 คน ยายหรือย่า 4 คน ตัวนักเรียนเอง 1 คน"
    answer: { value: 40, unit: คน }
    misconceptions:
      - { match: 18, feedback: "18 คือแท่งที่ยาวที่สุด ต้องรวมทุกแท่ง" }
      - { match: 5, feedback: "5 คือจำนวนตัวเลือก ไม่ใช่จำนวนนักเรียน" }
    hints:
      - "แต่ละคนตอบได้ 1 คำตอบ"
      - "บวกตัวเลขทุกแท่ง"
    solution: "18 + 12 + 5 + 4 + 1 = 40 คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sexuality.gender-and-respect.p007
    topics: [health.sexuality.gender-and-respect]
    difficulty: 3
    type: numeric
    stem: "จากแผนภูมิผลสำรวจ นักเรียนที่ตอบว่าแม่ทำงานบ้านเป็นส่วนใหญ่คิดเป็นร้อยละเท่าไร (ตอบเป็นร้อยละ)"
    figure:
      src: chores-survey.svg
      alt: "แผนภูมิแท่งแนวนอน ใครทำงานบ้านเป็นส่วนใหญ่ในบ้านของเรา สำรวจนักเรียน ป.5 ห้องหนึ่ง คนละ 1 คำตอบ ข้อมูลสมมติ แม่ 18 คน ทุกคนช่วยกัน 12 คน พ่อ 5 คน ยายหรือย่า 4 คน ตัวนักเรียนเอง 1 คน"
    answer: { value: 45, unit: "%" }
    misconceptions:
      - { match: 18, feedback: "18 คือจำนวนคน ต้องหารด้วยจำนวนทั้งหมดแล้วคูณ 100" }
      - { match: 55, feedback: "55 คือร้อยละของคนที่ไม่ได้ตอบว่าแม่" }
    hints:
      - "หาจำนวนนักเรียนทั้งหมดก่อน"
      - "ร้อยละ = 18 ÷ ทั้งหมด × 100"
    solution: "ทั้งหมด 40 คน 18 ÷ 40 × 100 = 45 คือร้อยละ 45"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sexuality.gender-and-respect.p008
    topics: [health.sexuality.gender-and-respect]
    difficulty: 3
    type: mcq
    stem: "ครูประจำชั้น ป.5 จะแบ่งเวรทำความสะอาดห้อง วิธีใดแสดงความเสมอภาคทางเพศมากที่สุด"
    choices:
      - { id: a, text: "หมุนเวียนให้ทุกคนได้ทำทุกงาน ทั้งกวาดห้อง ถูพื้น และยกโต๊ะ ไม่ดูเพศ", correct: true }
      - { id: b, text: "ให้นักเรียนหญิงกวาดถู นักเรียนชายยกโต๊ะทุกครั้ง", feedback: "เป็นการแบ่งงานตามภาพเหมารวม ทำให้แต่ละคนไม่ได้ฝึกทุกงาน" }
      - { id: c, text: "ให้นักเรียนหญิงทำความสะอาด นักเรียนชายไปเล่นได้", feedback: "เป็นการให้ภาระกับเพศเดียว ไม่เป็นธรรม" }
    hints:
      - "เสมอภาค คือทุกคนได้รับโอกาสและหน้าที่เท่ากัน"
      - "งานทำความสะอาดทุกอย่างเรียนรู้ได้ทุกเพศ"
    solution: "การหมุนเวียนงานทุกอย่างให้ทุกคนไม่ดูเพศ ทำให้ทุกคนได้ฝึกและรับผิดชอบเท่ากัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sexuality.gender-and-respect.p009
    topics: [health.sexuality.gender-and-respect]
    difficulty: 3
    type: mcq
    stem: "นนท์เป็นนักเรียนชายที่ชอบรำไทยและเข้าชมรมนาฏศิลป์ เพื่อนกลุ่มหนึ่งล้อเลียนนนท์ด้วยคำเรียกเพศที่ดูถูกทุกวัน ข้อใดเป็นสิ่งที่เพื่อนร่วมห้องควรทำ"
    choices:
      - { id: a, text: "บอกกลุ่มที่ล้ออย่างสุภาพให้หยุด อยู่เคียงข้างนนท์ และบอกครูถ้ายังไม่หยุด", correct: true }
      - { id: b, text: "หัวเราะตามเพราะทุกคนก็หัวเราะ", feedback: "การหัวเราะตามทำให้คนล้อคิดว่าทำได้ และทำให้นนท์เจ็บใจมากขึ้น" }
      - { id: c, text: "บอกนนท์ให้เลิกรำไทยจะได้ไม่ถูกล้อ", feedback: "นนท์ไม่ได้ทำอะไรผิด คนที่ต้องเปลี่ยนพฤติกรรมคือคนที่ล้อ" }
    hints:
      - "การล้อเรื่องเพศซ้ำ ๆ เป็นการกลั่นแกล้ง"
      - "เลือกข้อที่ช่วยให้การกลั่นแกล้งหยุดและนนท์ปลอดภัย"
    solution: "การล้อเลียนเพราะเพศหรือการแสดงออกเป็นการกลั่นแกล้ง เพื่อนช่วยได้ด้วยการพูดให้หยุดอย่างสุภาพ อยู่เคียงข้างคนถูกล้อ และบอกครู"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sexuality.gender-and-respect.p010
    topics: [health.sexuality.gender-and-respect]
    difficulty: 3
    type: numeric
    stem: "พระราชบัญญัติความเท่าเทียมระหว่างเพศ ซึ่งห้ามการเลือกปฏิบัติโดยไม่เป็นธรรมระหว่างเพศ ออกในปี พ.ศ. ใด (ตอบเป็นปี พ.ศ.)"
    answer: { value: 2558 }
    misconceptions:
      - { match: 2568, feedback: "ปี 2568 เป็นปีที่กฎหมายให้คู่รักทุกเพศจดทะเบียนสมรสได้เริ่มมีผล ไม่ใช่ปีของ พ.ร.บ.ความเท่าเทียมระหว่างเพศ" }
    hints:
      - "ชื่อเต็มของกฎหมายมีปี พ.ศ. ต่อท้าย"
      - "กฎหมายนี้ออกก่อนกฎหมายสมรสเท่าเทียมสิบปี"
    solution: "พระราชบัญญัติความเท่าเทียมระหว่างเพศ พ.ศ. 2558"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sexuality.gender-and-respect.p011
    topics: [health.sexuality.gender-and-respect]
    difficulty: 3
    type: match
    stem: "จับคู่ปัจจัยที่มีอิทธิพลต่อเจตคติเรื่องเพศกับตัวอย่าง"
    pairs:
      - { left: "ครอบครัว", right: "พ่อกับแม่ช่วยกันทำกับข้าวให้ลูกเห็นทุกวัน" }
      - { left: "สื่อ", right: "โฆษณาเครื่องครัวที่ใช้แต่นักแสดงหญิง" }
      - { left: "เพื่อน", right: "เพื่อนล้อคนที่ชอบสีชมพูว่าไม่สมเป็นผู้ชาย" }
      - { left: "กฎหมาย", right: "พระราชบัญญัติความเท่าเทียมระหว่างเพศ" }
    hints:
      - "ดูว่าตัวอย่างนั้นมาจากใครหรือจากที่ใด"
      - "โฆษณาและละครเป็นสื่อ"
    solution: "ครอบครัว-พ่อแม่ช่วยกันทำกับข้าว, สื่อ-โฆษณาเครื่องครัว, เพื่อน-การล้อเรื่องสี, กฎหมาย-พ.ร.บ.ความเท่าเทียมระหว่างเพศ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sexuality.gender-and-respect.p012
    topics: [health.sexuality.gender-and-respect]
    difficulty: 4
    type: mcq
    stem: "ร้านสะดวกซื้อแห่งหนึ่งติดประกาศรับสมัครพนักงานคิดเงินว่า \"รับเฉพาะผู้ชาย\" ทั้งที่งานนี้ทุกเพศทำได้เหมือนกัน ข้อใดอธิบายได้ถูกต้อง"
    choices:
      - { id: a, text: "เป็นการกีดกันคนเพราะเพศโดยไม่มีเหตุผลอันชอบธรรม จึงเป็นการเลือกปฏิบัติโดยไม่เป็นธรรมระหว่างเพศ", correct: true }
      - { id: b, text: "ไม่ผิด เพราะร้านจะเลือกใครก็ได้", feedback: "พระราชบัญญัติความเท่าเทียมระหว่างเพศห้ามการแบ่งแยกหรือกีดกันเพราะเพศโดยปราศจากความชอบธรรม" }
      - { id: c, text: "เป็นความเสมอภาค เพราะผู้ชายทุกคนสมัครได้เท่ากัน", feedback: "ความเสมอภาคต้องเท่ากันระหว่างทุกเพศ ไม่ใช่เท่ากันในเพศเดียว" }
    hints:
      - "งานคิดเงินต้องใช้ความสามารถอะไร เพศเกี่ยวหรือไม่"
      - "นึกถึงนิยามการเลือกปฏิบัติใน พ.ร.บ. พ.ศ. 2558"
    solution: "การรับเฉพาะเพศเดียวทั้งที่งานไม่ได้ต้องใช้ลักษณะเฉพาะของเพศใด เป็นการกีดกันโดยไม่มีเหตุผลอันชอบธรรม ตรงกับการเลือกปฏิบัติโดยไม่เป็นธรรมระหว่างเพศ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sexuality.gender-and-respect.p013
    topics: [health.sexuality.gender-and-respect]
    difficulty: 4
    type: numeric
    stem: "จากแผนภูมิผลสำรวจ นักเรียนที่ไม่ได้ตอบว่า \"ทุกคนช่วยกัน\" คิดเป็นร้อยละเท่าไร (ตอบเป็นร้อยละ)"
    figure:
      src: chores-survey.svg
