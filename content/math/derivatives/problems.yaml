      - { id: c, text: "$x = 0.5$", feedback: "นั่นคือจุดต่ำสุดของกราฟ $f'$ ซึ่งเป็นจุดที่ $f$ ลดลงเร็วที่สุด ไม่ใช่จุดสูงสุดของ $f$" }
      - { id: d, text: "$x = 0$", feedback: "ที่ $x = 0$ ค่า $f'(0) = -2 \\ne 0$ ความชันของ $f$ ไม่เป็นศูนย์ จึงไม่ใช่จุดสูงสุดหรือต่ำสุด" }
    hints:
