  - id: computer.projects.digital-innovation.p012
    topics: [computer.projects.digital-innovation]
    difficulty: 4
    type: numeric
    stem: |
      โปรแกรมนี้สรุปยอดขายจากคำสั่งซื้อ แล้วแสดงสินค้าที่ทำรายได้มากที่สุด ตัวเลขที่แสดงคือเท่าไร

      ```python
      orders = [("เดิม", 3), ("ช็อกโกแลต", 2), ("เดิม", 5), ("น้ำผึ้ง", 4), ("ช็อกโกแลต", 1)]
      price = {"เดิม": 60, "ช็อกโกแลต": 95, "น้ำผึ้ง": 80}
      total = {}
      for name, qty in orders:
          total[name] = total.get(name, 0) + qty * price[name]
      best = max(total, key=total.get)
      print(best, total[best])
      ```
    answer: { value: 480, unit: "บาท" }
    hints:
      - "รวมจำนวนของแต่ละสินค้า: เดิม 3 + 5 ช็อกโกแลต 2 + 1 น้ำผึ้ง 4"
      - "คูณราคาแล้วเลือกสินค้าที่รายได้รวมมากที่สุด"
    misconceptions:
      - { match: 320, feedback: "320 บาทเป็นรายได้ของน้ำผึ้ง (4 × 80) แต่ max เลือกสินค้าที่รายได้รวมมากที่สุด" }
      - { match: 300, feedback: "300 บาทคือรายได้ของคำสั่งซื้อแบบเดิมรายการที่สองเท่านั้น ต้องรวมทุกรายการของสินค้าเดียวกัน" }
    solution: "เดิม (3 + 5) × 60 = 480 บาท ช็อกโกแลต (2 + 1) × 95 = 285 บาท น้ำผึ้ง 4 × 80 = 320 บาท max เลือก เดิม โปรแกรมแสดง เดิม 480"
    license: CC-BY-SA-4.0
    ai_assisted: true

