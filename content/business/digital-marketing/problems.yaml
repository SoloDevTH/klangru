- id: business.marketing.digital-marketing.p018
  topics:
  - business.marketing.digital-marketing
  difficulty: 2
  type: mcq
  stem: ข้อใดอธิบายความต่างระหว่าง **การทำให้ติดอันดับการค้นหาแบบธรรมชาติ** (SEO) กับ **โฆษณาบนเครื่องมือค้นหา** ได้ถูกต้อง
  choices:
  - id: a
    text: SEO ไม่จ่ายค่าคลิก แต่ใช้เวลาปรับเนื้อหาให้ตรงคำค้น ส่วนโฆษณาจ่ายเงินแล้วแสดงผลได้ทันที
    correct: true
  - id: b
    text: SEO จ่ายเงินต่อคลิก ส่วนโฆษณาฟรี
    feedback: กลับกัน โฆษณาบนเครื่องมือค้นหาจ่ายเงิน มักคิดต่อคลิก
  - id: c
    text: ทั้งสองแบบเหมือนกันทุกประการ
    feedback: ต่างกันทั้งค่าใช้จ่ายและความเร็วในการเห็นผล
  - id: d
    text: SEO ใช้ได้เฉพาะร้านในมาร์เก็ตเพลส
    feedback: SEO ใช้กับเว็บไซต์และเนื้อหาทั่วไป
  hints:
  - ผลการค้นหามีทั้งส่วนที่เป็นโฆษณาและส่วนที่ไม่ใช่
  - ส่วนไหนต้องจ่ายเงินทุกครั้งที่มีคนคลิก
  solution: SEO คือปรับเว็บและเนื้อหาให้ตรงคำค้นและมีคุณภาพ จนติดอันดับโดยไม่ต้องจ่ายค่าคลิก แต่ใช้เวลา โฆษณาบนเครื่องมือค้นหาจ่ายเงิน (มักต่อคลิก) และแสดงผลได้เร็ว
