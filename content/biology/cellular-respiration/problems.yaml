problems:
  - id: biology.cells.cellular-respiration.p001
    topics: [biology.cells.cellular-respiration]
    difficulty: 1
    type: order
    stem: "เรียงขั้นตอนการหายใจระดับเซลล์เมื่อมีออกซิเจนเพียงพอ"
    items:
      - "ไกลโคลิซิส"
      - "การสร้างแอซิทิล CoA"
      - "วัฏจักรเครบส์"
      - "การถ่ายทอดอิเล็กตรอน"
    hints:
      - "ขั้นแรกเกิดในไซโทซอลและไม่ต้องใช้ออกซิเจน"
      - "ขั้นสุดท้ายใช้ออกซิเจนเป็นตัวรับอิเล็กตรอน"
    solution: "ไกลโคลิซิส → การสร้างแอซิทิล CoA → วัฏจักรเครบส์ → การถ่ายทอดอิเล็กตรอน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cellular-respiration.p002
    topics: [biology.cells.cellular-respiration]
    difficulty: 1
    type: mcq
    stem: "ไกลโคลิซิสเกิดขึ้นที่ส่วนใดของเซลล์"
    choices:
      - { id: a, text: "ไซโทซอล", correct: true }
      - { id: b, text: "เมทริกซ์ของไมโทคอนเดรีย", feedback: "เมทริกซ์เป็นที่เกิดการสร้างแอซิทิล CoA และวัฏจักรเครบส์ ไกลโคลิซิสเกิดก่อนที่ไพรูเวตจะเข้าไมโทคอนเดรีย" }
      - { id: c, text: "เยื่อชั้นในของไมโทคอนเดรีย", feedback: "เยื่อชั้นในเป็นที่เกิดการถ่ายทอดอิเล็กตรอน" }
      - { id: d, text: "คลอโรพลาสต์", feedback: "คลอโรพลาสต์เป็นที่สังเคราะห์ด้วยแสง และเซลล์สัตว์ไม่มีคลอโรพลาสต์แต่ยังทำไกลโคลิซิสได้" }
    hints:
      - "ไกลโคลิซิสเกิดได้แม้ไม่มีออกซิเจน และแบคทีเรียที่ไม่มีไมโทคอนเดรียก็ทำได้"
      - "ส่วนที่เป็นของเหลวของไซโทพลาซึมเรียกว่าอะไร"
    solution: "ไกลโคลิซิสเกิดในไซโทซอล ไม่ต้องใช้ออกซิเจนและไม่ต้องมีไมโทคอนเดรีย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cellular-respiration.p003
    topics: [biology.cells.cellular-respiration]
    difficulty: 2
    type: text
    stem: "สารใดเป็นตัวรับอิเล็กตรอนตัวสุดท้ายของลูกโซ่ถ่ายทอดอิเล็กตรอน แล้วกลายเป็นน้ำ"
    accepted: ["ออกซิเจน", "O2", "O₂", "แก๊สออกซิเจน", "oxygen"]
    hints:
      - "เป็นสารที่เราหายใจเข้าไป"
      - "ถ้าไม่มีสารนี้ การถ่ายทอดอิเล็กตรอนจะหยุด"
    misconceptions:
      - { match: "คาร์บอนไดออกไซด์", feedback: "CO₂ เป็นผลิตภัณฑ์จากการสลายไพรูเวตและวัฏจักรเครบส์ ไม่ได้รับอิเล็กตรอน" }
      - { match: "NAD+", feedback: "NAD⁺ รับอิเล็กตรอนในไกลโคลิซิสและวัฏจักรเครบส์ ส่วนตัวรับสุดท้ายของลูกโซ่คือออกซิเจน" }
    solution: "ออกซิเจนรับอิเล็กตรอนที่ปลายลูกโซ่ แล้วรวมกับ H⁺ เป็นน้ำ: ½O₂ + 2H⁺ + 2e⁻ → H₂O"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cellular-respiration.p004
    topics: [biology.cells.cellular-respiration]
    difficulty: 2
    type: match
    stem: "จับคู่ขั้นตอนการหายใจระดับเซลล์กับตำแหน่งที่เกิด"
    pairs:
      - { left: "ไกลโคลิซิส", right: "ไซโทซอล" }
      - { left: "วัฏจักรเครบส์", right: "เมทริกซ์ของไมโทคอนเดรีย" }
      - { left: "การถ่ายทอดอิเล็กตรอน", right: "เยื่อชั้นในของไมโทคอนเดรีย" }
      - { left: "การหมักกรดแลกติก", right: "ไซโทซอลของเซลล์กล้ามเนื้อ" }
    hints:
      - "ขั้นที่ไม่ใช้ออกซิเจนเกิดนอกไมโทคอนเดรีย"
      - "ลูกโซ่ถ่ายทอดอิเล็กตรอนเป็นโปรตีนที่ฝังในเยื่อ"
    solution: "ไกลโคลิซิสและการหมักเกิดในไซโทซอล วัฏจักรเครบส์ในเมทริกซ์ การถ่ายทอดอิเล็กตรอนที่เยื่อชั้นใน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cellular-respiration.p005
    topics: [biology.cells.cellular-respiration]
    difficulty: 2
    type: mcq
    stem: "ขณะนวดแป้งทำขนมปังที่ผสมยีสต์ แล้วพักไว้ แป้งฟูขึ้นเพราะยีสต์สร้างสารใด"
    choices:
      - { id: a, text: "แก๊สคาร์บอนไดออกไซด์จากการหมักแอลกอฮอล์", correct: true }
      - { id: b, text: "แก๊สออกซิเจน", feedback: "ยีสต์ใช้ออกซิเจน ไม่ได้ปล่อยออกซิเจน" }
      - { id: c, text: "กรดแลกติก", feedback: "กรดแลกติกเป็นผลของการหมักในกล้ามเนื้อและแบคทีเรียบางชนิด ไม่ใช่แก๊ส จึงไม่ทำให้แป้งฟู" }
      - { id: d, text: "ไอน้ำจากการถ่ายทอดอิเล็กตรอน", feedback: "น้ำที่เกิดมีปริมาณน้อยและเป็นของเหลว ฟองในแป้งคือ CO₂" }
    hints:
      - "การหมักแอลกอฮอล์ได้ผลิตภัณฑ์สองชนิด"
      - "ชนิดใดเป็นแก๊สที่ทำให้เกิดฟอง"
    solution: "ยีสต์หมักน้ำตาลได้เอทานอลและ CO₂ แก๊ส CO₂ ทำให้แป้งพองฟู ส่วนเอทานอลระเหยไปเมื่ออบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cellular-respiration.p006
    topics: [biology.cells.cellular-respiration]
    difficulty: 2
    type: numeric
    stem: "ในไกลโคลิซิสของกลูโคส 1 โมเลกุล เซลล์ใช้ ATP 2 โมเลกุลในช่วงแรก และสร้าง ATP 4 โมเลกุลในช่วงหลัง ได้ ATP สุทธิกี่โมเลกุล"
    answer: { value: 2, unit: โมเลกุล }
    hints:
      - "สุทธิ = ที่สร้างได้ − ที่ใช้ไป"
      - "ATP ที่ใช้ช่วงแรกต้องหักออก"
    misconceptions:
      - { match: 4, feedback: "นี่คือ ATP ที่สร้างได้ทั้งหมด ต้องหัก 2 ATP ที่ใช้ไปในช่วงแรก" }
      - { match: 6, feedback: "นำ ATP ที่ใช้มาบวก แต่ ATP ที่ใช้ไปต้องลบออก" }
    solution: "ATP สุทธิ $= 4 - 2 = 2$ โมเลกุลต่อกลูโคส พร้อม NADH 2 โมเลกุล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cellular-respiration.p007
    topics: [biology.cells.cellular-respiration]
    difficulty: 3
    type: numeric
    stem: "กลูโคส 1 โมเลกุลถูกสลายอย่างสมบูรณ์เมื่อมีออกซิเจนเพียงพอ ได้ CO₂ ทั้งหมดกี่โมเลกุล นับจากการสร้างแอซิทิล CoA และวัฏจักรเครบส์รวมกัน"
    answer: { value: 6, unit: โมเลกุล }
    hints:
      - "กลูโคสมีคาร์บอนกี่อะตอม และไกลโคลิซิสปล่อย CO₂ หรือไม่"
      - "ไพรูเวต 2 โมเลกุลเสีย CO₂ โมเลกุลละ 1 แล้ววัฏจักรเครบส์หมุน 2 รอบ รอบละ 2 CO₂"
    misconceptions:
      - { match: 4, feedback: "นับเฉพาะวัฏจักรเครบส์ ต้องรวม 2 CO₂ จากการสร้างแอซิทิล CoA" }
      - { match: 3, feedback: "นับเพียงไพรูเวต 1 โมเลกุล แต่กลูโคส 1 โมเลกุลให้ไพรูเวต 2 โมเลกุล" }
    solution: "สร้างแอซิทิล CoA: $2 \\times 1 = 2$ CO₂ วัฏจักรเครบส์ 2 รอบ: $2 \\times 2 = 4$ CO₂ รวม 6 โมเลกุล เท่ากับคาร์บอน 6 อะตอมของกลูโคส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cellular-respiration.p008
    topics: [biology.cells.cellular-respiration]
    difficulty: 3
    type: numeric
    stem: "กลูโคส 1 โมเลกุลให้ ATP โดยตรง 4 โมเลกุล NADH 10 โมเลกุล และ FADH₂ 2 โมเลกุล ถ้า NADH 1 โมเลกุลให้ 2.5 ATP และ FADH₂ 1 โมเลกุลให้ 1.5 ATP กลูโคส 1 โมเลกุลให้ ATP รวมกี่โมเลกุล"
    answer: { value: 32, unit: โมเลกุล }
    hints:
      - "แปลง NADH และ FADH₂ เป็นจำนวน ATP ก่อน"
      - "รวม ATP โดยตรง + ATP จาก NADH + ATP จาก FADH₂"
    misconceptions:
      - { match: 28, feedback: "ลืมบวก ATP 4 โมเลกุลที่ได้โดยตรงจากไกลโคลิซิสและวัฏจักรเครบส์" }
      - { match: 16, feedback: "นับ NADH และ FADH₂ เป็นโมเลกุลละ 1 ATP ต้องคูณด้วย 2.5 และ 1.5" }
    solution: "$4 + 10 \\times 2.5 + 2 \\times 1.5 = 4 + 25 + 3 = 32$ ATP"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cellular-respiration.p009
    topics: [biology.cells.cellular-respiration]
    difficulty: 3
    type: mcq
    stem: "นักกีฬาวิ่ง 400 เมตรในงานกีฬาสีสุดแรง หลังวิ่งยังหอบอยู่หลายนาทีและรู้สึกล้ากล้ามเนื้อขา ข้อใดอธิบายได้ถูกต้อง"
    choices:
      - { id: a, text: "ออกซิเจนไปถึงกล้ามเนื้อไม่ทัน เซลล์จึงหมักได้กรดแลกติก หลังวิ่งต้องใช้ออกซิเจนเพิ่มเพื่อจัดการกรดแลกติกและสร้าง ATP คืน", correct: true }
      - { id: b, text: "กล้ามเนื้อหมักได้เอทานอลและ CO₂", feedback: "การหมักแอลกอฮอล์เกิดในยีสต์ กล้ามเนื้อของคนหมักได้กรดแลกติก" }
      - { id: c, text: "กล้ามเนื้อหยุดทำไกลโคลิซิสเพราะขาดออกซิเจน", feedback: "ไกลโคลิซิสไม่ต้องใช้ออกซิเจน จึงยังเกิดต่อและให้ ATP ได้เล็กน้อย" }
      - { id: d, text: "หอบเพราะต้องขับกรดแลกติกออกทางลมหายใจ", feedback: "กรดแลกติกไม่ได้ออกทางลมหายใจ ออกซิเจนที่หายใจเพิ่มใช้เปลี่ยนกรดแลกติกกลับ ส่วนใหญ่ที่ตับ" }
    hints:
      - "เมื่อออกซิเจนไม่พอ เซลล์กล้ามเนื้อสร้าง NAD⁺ กลับด้วยวิธีใด"
      - "ทำไมยังต้องหายใจถี่หลังหยุดวิ่ง"
    solution: "ขณะวิ่งหนักออกซิเจนไม่พอ กล้ามเนื้อหมักไพรูเวตเป็นกรดแลกติกเพื่อให้ไกลโคลิซิสทำต่อได้ หลังวิ่งร่างกายยังต้องใช้ออกซิเจนเพิ่มเพื่อเปลี่ยนกรดแลกติกกลับและเติม ATP จึงยังหอบอยู่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cellular-respiration.p010
    topics: [biology.cells.cellular-respiration]
    difficulty: 3
    type: match
    stem: "จับคู่อาหารไทยกับสิ่งมีชีวิตและผลิตภัณฑ์จากการหมักที่ทำให้เกิดรสหรือลักษณะของอาหาร"
    pairs:
      - { left: "นมเปรี้ยว", right: "แบคทีเรีย: กรดแลกติก" }
      - { left: "แหนม", right: "แบคทีเรีย: กรดแลกติกทำให้เปรี้ยว" }
      - { left: "สาโท", right: "ยีสต์: เอทานอล" }
      - { left: "ขนมปัง", right: "ยีสต์: CO₂ ทำให้ฟู" }
    hints:
      - "อาหารที่มีรสเปรี้ยวมักเกิดจากกรดแลกติก"
      - "อาหารที่มีแอลกอฮอล์หรือฟองแก๊สเกิดจากยีสต์"
    solution: "นมเปรี้ยวและแหนมเปรี้ยวด้วยกรดแลกติกจากแบคทีเรีย สาโทมีเอทานอลจากยีสต์ ขนมปังฟูด้วย CO₂ จากยีสต์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cellular-respiration.p011
    topics: [biology.cells.cellular-respiration]
    difficulty: 4
    type: numeric
    stem: "กลูโคส 1 โมล ปล่อยพลังงาน 2,870 kJ เมื่อสลายอย่างสมบูรณ์ ถ้าเซลล์ได้ 32 ATP ต่อกลูโคส และ ATP 1 โมลเก็บพลังงาน 30.5 kJ ประสิทธิภาพของการเก็บพลังงานใน ATP เป็นร้อยละเท่าไร (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 34.0, tolerance: 0.4, unit: "%" }
    hints:
      - "พลังงานที่เก็บใน ATP = จำนวน ATP × 30.5 kJ"
      - "ประสิทธิภาพ = พลังงานใน ATP ÷ พลังงานทั้งหมด × 100"
    misconceptions:
      - { match: 0.34, feedback: "ลืมคูณ 100 เพื่อเปลี่ยนเป็นร้อยละ" }
      - { match: 1.06, feedback: "คิดพลังงานของ ATP เพียง 1 โมล ต้องคูณ 32 ก่อน" }
    solution: "พลังงานใน ATP $= 32 \\times 30.5 = 976\\ \\mathrm{kJ}$ ประสิทธิภาพ $= \\frac{976}{2870} \\times 100 \\approx 34.0\\%$ พลังงานที่เหลือกลายเป็นความร้อน ซึ่งช่วยรักษาอุณหภูมิร่างกาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cellular-respiration.p012
    topics: [biology.cells.cellular-respiration]
    difficulty: 4
    type: mcq
    stem: "ไซยาไนด์ยับยั้งโปรตีนตัวสุดท้ายของลูกโซ่ถ่ายทอดอิเล็กตรอนที่ส่งอิเล็กตรอนให้ออกซิเจน ผลใดเกิดขึ้นในเซลล์"
    choices:
      - { id: a, text: "การถ่ายทอดอิเล็กตรอนหยุด NAD⁺ ไม่ถูกสร้างกลับ วัฏจักรเครบส์หยุดตาม และ ATP ลดลงอย่างมาก", correct: true }
      - { id: b, text: "เฉพาะการถ่ายทอดอิเล็กตรอนหยุด วัฏจักรเครบส์ยังทำงานเต็มที่", feedback: "วัฏจักรเครบส์ต้องใช้ NAD⁺ และ FAD ที่ได้กลับจากลูกโซ่ เมื่อลูกโซ่หยุด วัฏจักรเครบส์ก็หยุดด้วย" }
      - { id: c, text: "เซลล์สร้าง ATP ได้มากขึ้นเพราะออกซิเจนเหลือใช้", feedback: "ออกซิเจนเหลือจริง แต่เซลล์ใช้ไม่ได้ เพราะส่งอิเล็กตรอนให้ออกซิเจนไม่ได้" }
      - { id: d, text: "ไกลโคลิซิสหยุดทันทีเพราะต้องใช้ออกซิเจน", feedback: "ไกลโคลิซิสไม่ใช้ออกซิเจน ยังเกิดได้และอาจเกิดการหมักกรดแลกติก แต่ได้ ATP น้อยเกินไป" }
    hints:
      - "วัฏจักรเครบส์ต้องการ NAD⁺ ที่ได้คืนมาจากขั้นใด"
      - "ATP ส่วนใหญ่มาจากขั้นใด"
    solution: "เมื่ออิเล็กตรอนส่งให้ออกซิเจนไม่ได้ ลูกโซ่หยุด ไม่มีการปั๊ม H⁺ และสร้าง ATP NADH ไม่ถูกเปลี่ยนเป็น NAD⁺ วัฏจักรเครบส์จึงหยุดด้วย เหลือเพียงไกลโคลิซิสและการหมักที่ให้ 2 ATP ต่อกลูโคส ซึ่งไม่พอ เซลล์ประสาทและหัวใจจึงเสียหายเร็ว"
