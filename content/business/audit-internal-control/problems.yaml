  stem: ตามแบบจำลองความเสี่ยงการสอบบัญชี ความเสี่ยงการสอบบัญชี $=$ ความเสี่ยงสืบเนื่อง $\times$ ความเสี่ยงจากการควบคุม $\times$ ความเสี่ยงจากการตรวจไม่พบ ถ้าผู้สอบบัญชียอมรับความเสี่ยงการสอบบัญชีได้ $5\%$ ประเมินความเสี่ยงสืบเนื่อง $80\%$ และความเสี่ยงจากการควบคุม $50\%$ ความเสี่ยงจากการตรวจไม่พบที่ยอมรับได้เป็นกี่เปอร์เซ็นต์ (ตอบเป็น %)
  answer:
    value: 12.5
    tolerance: 0.125
    unit: '%'
  misconceptions:
  - match: 2
    feedback: คูณทั้งสามค่า ต้องหาร AR ด้วยผลคูณของ IR และ CR
  - match: 6.25
    feedback: ลืมหารด้วยความเสี่ยงจากการควบคุม
