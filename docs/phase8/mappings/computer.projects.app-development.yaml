topic: computer.projects.app-development
rows:
  - { framework: th-core-2560-science, indicators: ["ว 4.2 ม.3/1", "ว 4.2 ม.4/1"], coverage: partial, note: "ขั้นตอนพัฒนาแอปและโครงงานที่บูรณาการกับวิชาอื่นและเชื่อมกับชีวิตจริง (แอปค่าไฟใช้พลังงานไฟฟ้าและคณิตศาสตร์ แอปขยะชายหาด แอปร้านผัก) ด้วยแนวคิดเชิงคำนวณ MVP การทดสอบกับผู้ใช้ และเกณฑ์ประเมิน แต่การสร้างแอปและโครงงานจริงทำนอกแอปคลังรู้" }
  - { framework: csta-k12-cs, indicators: ["3A-AP-13"], coverage: partial, note: "เลือกหัวข้อจากความสนใจและความรู้เดิม แยกปัญหาและเขียนอัลกอริทึมก่อนสร้างต้นแบบ แต่ผู้เรียนไม่ได้สร้างต้นแบบเองในแอป" }
  - { framework: csta-k12-cs, indicators: ["3A-AP-16"], coverage: partial, note: "ออกแบบหน้าจอพร้อมเหตุการณ์ ตัวจัดการเหตุการณ์ ตัวจับเวลา และพัฒนาแบบวนรอบ ไล่โปรแกรมจำลองที่ขับเคลื่อนด้วยเหตุการณ์ แต่ไม่ได้สร้างชิ้นงานจริงเอง" }
  - { framework: acm-cs2023, indicators: ["FPL-Event-Driven"], coverage: partial, note: "เหตุการณ์ ตัวจัดการ วงวนเหตุการณ์ (จำลองด้วยดิกชันนารีของฟังก์ชัน) ตัวจับเวลา ตัวจัดการที่ต้องทำงานเร็ว และเหตุการณ์ซ้ำหรือผิดลำดับ ยังไม่มีการเขียนโปรแกรมแบบตอบสนอง (reactive) และการทำงานพร้อมกัน" }
  - { framework: acm-cs2023, indicators: ["SPD-Common"], coverage: partial, note: "เรื่องร่วมของทุกแพลตฟอร์ม: ขนาดจอและวิธีรับข้อมูล การทำงานออฟไลน์ พลังงานและประสิทธิภาพ สิทธิ์และความเป็นส่วนตัว การเข้าถึงได้ และภาษา ยังไม่ลงรายละเอียดของแพลตฟอร์มเฉพาะ" }
  - { framework: uk-nc-computing, indicators: ["UKNC-CO-KS4-01"], coverage: partial, note: "หัวข้อนี้รวมวิทยาการคอมพิวเตอร์ (อัลกอริทึม เหตุการณ์) สื่อดิจิทัล (ออกแบบหน้าจอ) และเทคโนโลยีสารสนเทศ (ข้อมูล แพลตฟอร์ม) ในโครงงาน แต่การพัฒนาความสามารถและความคิดสร้างสรรค์ต้องอาศัยการทำโครงงานจริงต่อเนื่อง" }
