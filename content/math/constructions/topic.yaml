id: math.geometry.constructions
subject: math
title: { th: การสร้างทางเรขาคณิต, en: Geometric constructions }
summary: สร้างรูปสี่เหลี่ยม สามเหลี่ยม และเส้นขนานตามที่กำหนด ใช้วงเวียนและสันตรงแบ่งครึ่งเส้นและมุม สร้างเส้นตั้งฉาก รูปแนบในวงกลม และอ่านแผนผังย่อส่วน
difficulty: 3
minutes: 40
prerequisites: [math.geometry.angle-measure, math.geometry.quadrilaterals, math.geometry.triangles]
encompasses:
  - { id: math.geometry.angle-measure, weight: 0.3 }
  - { id: math.geometry.triangles, weight: 0.2 }
  - { id: math.geometry.quadrilaterals, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: perpendicular-bisector.svg
    alt: "การสร้างเส้นแบ่งครึ่งตั้งฉากของส่วนของเส้นตรง AB ในแนวนอน มีส่วนโค้งจาก A และส่วนโค้งจาก B รัศมีเท่ากัน ตัดกันที่ P ด้านบนและ Q ด้านล่าง เส้น PQ ตัด AB ที่ M มีเครื่องหมายมุมฉากที่ M ข้างภาพเขียนขั้นตอน 1. กางวงเวียนเกินครึ่งของ AB 2. เขียนส่วนโค้งจาก A และจาก B ด้วยรัศมีเดิม ตัดกันที่ P และ Q 3. ลาก PQ ตัด AB ที่ M และสรุปว่า AM = MB และ PQ ตั้งฉากกับ AB"
    caption: "ทุกจุดบนเส้น PQ ห่างจาก A และ B เท่ากัน"
  - { type: check, problem: math.geometry.constructions.p005, prompt: "ถ้ากางวงเวียนสั้นเกินไปจะเกิดอะไรขึ้น" }
  - type: figure
    src: angle-bisector.svg
    alt: "การสร้างเส้นแบ่งครึ่งมุม มุมมีจุดยอด O แขนหนึ่งในแนวนอนและอีกแขนเอียงขึ้น ส่วนโค้งจาก O ตัดแขนที่ A และ B ส่วนโค้งเล็กจาก A และจาก B ตัดกันที่ C รังสี OC อยู่ระหว่างแขนทั้งสอง ข้างภาพเขียนขั้นตอนและสรุปว่า มุม AOC = มุม COB"
    caption: "รังสี OC แบ่งมุม AOB เป็นสองมุมเท่ากัน"
  - type: worked-example
    title: สร้างรูปสามเหลี่ยมเมื่อรู้สามด้าน
    problem: "อธิบายวิธีสร้างรูปสามเหลี่ยม ABC ที่ AB = 6 ซม. BC = 4 ซม. และ CA = 5 ซม. และตรวจว่าสร้างได้หรือไม่"
    steps:
      - text: "ตรวจก่อน: ด้านที่สั้นสองด้านรวมกัน $4 + 5 = 9$ มากกว่าด้านยาวที่สุด 6 จึงสร้างได้"
        why: "ถ้าผลรวมไม่มากกว่าด้านยาวที่สุด ส่วนโค้งจะไม่ตัดกัน"
      - text: "ลาก AB ยาว 6 ซม. ด้วยไม้บรรทัด"
      - text: "กางวงเวียน 5 ซม. เขียนส่วนโค้งจาก A (เพราะ CA = 5)"
      - text: "กางวงเวียน 4 ซม. เขียนส่วนโค้งจาก B (เพราะ BC = 4) ตัดส่วนโค้งแรกที่ C"
      - text: "ลาก AC และ BC ได้รูปสามเหลี่ยม ABC"
    answer: "สร้างได้ จุด C คือจุดตัดของส่วนโค้งรัศมี 5 ซม. จาก A และรัศมี 4 ซม. จาก B"
  - type: figure
    src: hexagon-in-circle.svg
    alt: "วงกลมรัศมี r มีจุด 6 จุดบนวงกลมห่างกันเท่ากัน แต่ละจุดมีรอยส่วนโค้งเล็ก เชื่อมจุดที่อยู่ติดกันเป็นรูปหกเหลี่ยมด้านเท่ามุมเท่า ด้านหนึ่งเขียนว่า r และรัศมีเขียนว่า r เส้นประเชื่อมจุดเว้นจุดเป็นรูปสามเหลี่ยมด้านเท่า ข้างภาพเขียนขั้นตอนการสร้าง"
    caption: "ด้านของหกเหลี่ยมแนบในวงกลมยาวเท่ารัศมี"
  - type: figure
    src: circum-incircle.svg
    alt: "สองภาพ ซ้ายเป็นสามเหลี่ยมกับเส้นประจากจุดกึ่งกลางของแต่ละด้านไปพบกันที่จุด O และวงกลมจุดศูนย์กลาง O ผ่านจุดยอดทั้งสาม คำอธิบายว่าเส้นแบ่งครึ่งตั้งฉากของด้าน ให้วงกลมล้อมรอบ ขวาเป็นสามเหลี่ยมกับเส้นประจากจุดยอดทั้งสามไปพบกันที่จุด I และวงกลมจุดศูนย์กลาง I สัมผัสด้านทั้งสาม มีเส้นตั้งฉากจาก I ถึงฐาน คำอธิบายว่าเส้นแบ่งครึ่งมุม ให้วงกลมแนบใน"
    caption: "จุดตัดของเส้นแบ่งครึ่งตั้งฉากห่างจากจุดยอดเท่ากัน จุดตัดของเส้นแบ่งครึ่งมุมห่างจากด้านเท่ากัน"
  - { type: check, problem: math.geometry.constructions.p013, prompt: "ห่างจากบ้านเท่ากัน คือห่างจากจุดหรือจากด้าน" }
  - type: worked-example
    title: อ่านแผนผังย่อส่วน
    problem: "แผนผังบ้านใช้มาตราส่วน 1 : 50 ห้องนอนในแผนผังกว้าง 7 ซม. ห้องนอนจริงกว้างกี่เมตร"
    steps:
      - text: "1 : 50 แปลว่า 1 ซม. ในแผนผังแทน 50 ซม. ของจริง"
      - text: "7 ซม. ในแผนผังแทน $7 \\times 50 = 350$ ซม."
      - text: "เปลี่ยนเป็นเมตร: $350 \\div 100 = 3.5$ ม."
        why: "1 เมตร = 100 เซนติเมตร"
    answer: "3.5 เมตร"
glossary:
  - { term: สันตรง, definition: "ขอบตรงที่ไม่มีขีดวัด ใช้ลากเส้นตรงผ่านสองจุด" }
  - { term: เส้นแบ่งครึ่งตั้งฉาก, definition: "เส้นที่ผ่านจุดกึ่งกลางของส่วนของเส้นตรงและตั้งฉากกับส่วนนั้น ทุกจุดบนเส้นห่างจากปลายทั้งสองเท่ากัน" }
  - { term: เส้นแบ่งครึ่งมุม, definition: "รังสีที่แบ่งมุมเป็นสองมุมเท่ากัน ทุกจุดบนรังสีห่างจากแขนทั้งสองเท่ากัน" }
  - { term: วงกลมล้อมรอบ, definition: "วงกลมที่ผ่านจุดยอดทุกจุดของรูปสามเหลี่ยม" }
  - { term: วงกลมแนบใน, definition: "วงกลมในรูปสามเหลี่ยมที่สัมผัสด้านทั้งสาม" }
  - { term: มาตราส่วน, definition: "อัตราส่วนของขนาดในแผนผังต่อขนาดจริง เช่น 1 : 100" }
flashcards:
  - { front: "สร้างเส้นแบ่งครึ่งตั้งฉาก ต้องกางวงเวียนอย่างไร", back: "เกินครึ่งของส่วนของเส้นตรง และใช้รัศมีเดิมทั้งสองข้าง" }
  - { front: "หาจุดที่ห่างจากจุดยอดทั้งสามของสามเหลี่ยมเท่ากัน", back: "จุดตัดของเส้นแบ่งครึ่งตั้งฉากของด้าน (จุดศูนย์กลางวงกลมล้อมรอบ)" }
  - { front: "หาจุดที่ห่างจากด้านทั้งสามของสามเหลี่ยมเท่ากัน", back: "จุดตัดของเส้นแบ่งครึ่งมุม (จุดศูนย์กลางวงกลมแนบใน)" }
  - { front: "ด้านของหกเหลี่ยมด้านเท่าแนบในวงกลมยาวเท่าไร", back: "เท่ากับรัศมี" }
  - { front: "ระยะสั้นที่สุดจากจุดถึงเส้นตรง", back: "ระยะตามแนวตั้งฉาก" }
