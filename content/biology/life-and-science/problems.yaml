    choices:
      - { id: a, text: "อธิบายวัตถุประสงค์และความเสี่ยงให้นักเรียนและผู้ปกครองเข้าใจ ขอความยินยอมก่อน และเก็บชื่อผู้เข้าร่วมเป็นความลับ", correct: true }
      - { id: b, text: "เก็บเลือดนักเรียนทุกคนโดยไม่ต้องบอก เพราะเป็นประโยชน์ต่อส่วนรวม", feedback: "งานวิจัยในคนต้องได้รับความยินยอมโดยสมัครใจเสมอ แม้งานนั้นจะมีประโยชน์" }
      - { id: c, text: "ประกาศผลเลือดของนักเรียนแต่ละคนพร้อมชื่อบนบอร์ดของโรงเรียน", feedback: "ผลตรวจสุขภาพเป็นข้อมูลส่วนตัว ต้องเก็บเป็นความลับ" }
      - { id: d, text: "ตัดข้อมูลของนักเรียนที่ผลไม่ตรงกับที่คาดออกจากรายงาน", feedback: "การตัดข้อมูลเพื่อให้ตรงกับสมมติฐานเป็นการรายงานเท็จ ผิดจริยธรรมการวิจัย" }
