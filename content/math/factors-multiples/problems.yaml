  - id: math.fm.p014
    topics: [math.number.factors-multiples]
    difficulty: 1
    type: numeric
    stem: "ครูมีนักเรียน 24 คน ต้องการจัดเป็นแถว แถวละเท่ากันโดยไม่มีใครเหลือ คู่ตัวประกอบ (จำนวนแถว, จำนวนคนต่อแถว) เช่น $1 \\times 24$ ของ 24 มีทั้งหมดกี่คู่ ถ้านับ $2 \\times 12$ กับ $12 \\times 2$ เป็นคู่เดียวกัน (ตอบเป็นจำนวนคู่)"
    answer: { value: 4, unit: คู่ }
    hints:
      - "เริ่มจาก $1 \\times 24$ แล้วลอง 2, 3, 4, … ว่าหาร 24 ลงตัวหรือไม่"
      - "หยุดเมื่อตัวแรกของคู่เริ่มมากกว่าตัวหลัง เพราะคู่จะวนซ้ำ"
    misconceptions:
      - { match: 8, feedback: "8 คือจำนวนตัวประกอบทั้งหมด (1, 2, 3, 4, 6, 8, 12, 24) แต่ตัวประกอบสองตัวจับเป็นหนึ่งคู่" }
      - { match: 3, feedback: "อย่าลืมคู่ $1 \\times 24$ (แถวเดียวยาว 24 คน) ซึ่งเป็นคู่ตัวประกอบเช่นกัน" }
    solution: "$24 = 1 \\times 24 = 2 \\times 12 = 3 \\times 8 = 4 \\times 6$ ส่วน 5 หาร 24 ไม่ลงตัว และคู่ถัดไป $6 \\times 4$ ซ้ำกับ $4 \\times 6$ จึงมี 4 คู่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.fm.p015
    topics: [math.number.factors-multiples]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเขียน $42 + 56$ เป็นผลคูณของ ห.ร.ม. กับผลบวกของสองจำนวนที่ไม่มีตัวประกอบร่วมกัน"
    choices:
      - { id: a, text: "$14(3 + 4)$", correct: true }
      - { id: b, text: "$7(6 + 8)$", feedback: "$7(6 + 8) = 98$ ถูกต้องทางค่า แต่ 6 กับ 8 ยังมีตัวประกอบร่วม 2 แปลว่า 7 ยังไม่ใช่ ห.ร.ม." }
      - { id: c, text: "$2(21 + 28)$", feedback: "21 กับ 28 ยังมีตัวประกอบร่วม 7 ต้องดึงตัวร่วมที่มากกว่านี้" }
      - { id: d, text: "$14(3 + 56)$", feedback: "ดึง 14 ออกจาก 42 แล้ว แต่ลืมหาร 56 ด้วย 14 ลองกระจายดู $14 \\times 3 + 14 \\times 56 = 826$" }
    hints:
      - "หา ห.ร.ม. ของ 42 และ 56 ก่อน"
      - "เขียนแต่ละจำนวนเป็น ห.ร.ม. คูณกับอะไรบางอย่าง แล้วใช้สมบัติการแจกแจง"
    solution: "$42 = 2 \\times 3 \\times 7$ และ $56 = 2 \\times 2 \\times 2 \\times 7$ ห.ร.ม. $= 2 \\times 7 = 14$ จึงได้ $42 + 56 = 14 \\times 3 + 14 \\times 4 = 14(3 + 4)$ ตรวจ: $14 \\times 7 = 98$ ✓ และ 3 กับ 4 ไม่มีตัวประกอบร่วม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.fm.p016
    topics: [math.number.factors-multiples]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ใช้การทดสอบการหารลงตัว (ไม่ต้องหารจริง) จำนวน 4,728 หารด้วยจำนวนใดลงตัว (เลือกได้มากกว่า 1 ข้อ)"
    choices:
      - { id: a, text: "2", correct: true }
      - { id: b, text: "3", correct: true }
      - { id: c, text: "4", correct: true }
      - { id: d, text: "5", feedback: "จำนวนที่หารด้วย 5 ลงตัวต้องลงท้ายด้วย 0 หรือ 5 แต่ 4,728 ลงท้ายด้วย 8" }
      - { id: e, text: "6", correct: true }
      - { id: f, text: "9", feedback: "ผลบวกของหลักคือ $4 + 7 + 2 + 8 = 21$ ซึ่งหารด้วย 3 ลงตัวแต่หารด้วย 9 ไม่ลงตัว" }
    hints:
      - "ดูหลักหน่วยสำหรับ 2 และ 5 ดูสองหลักสุดท้ายสำหรับ 4"
      - "บวกทุกหลักเพื่อทดสอบ 3 และ 9 ส่วน 6 ต้องผ่านทั้ง 2 และ 3"
    solution: "หลักหน่วย 8 เป็นเลขคู่ → หาร 2 ลงตัว · สองหลักท้าย 28 หาร 4 ลงตัว → หาร 4 ลงตัว · ผลบวกหลัก 21 หาร 3 ลงตัวแต่ไม่ลงตัวด้วย 9 → หาร 3 ลงตัว หาร 9 ไม่ลงตัว · ผ่านทั้ง 2 และ 3 → หาร 6 ลงตัว · ลงท้าย 8 → หาร 5 ไม่ลงตัว (ตรวจ: $4728 = 2^3 \\times 3 \\times 197$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.fm.p017
    topics: [math.number.factors-multiples]
    difficulty: 4
    type: numeric
    stem: "$360 = 2^3 \\times 3^2 \\times 5$ จำนวน 360 มีตัวประกอบทั้งหมดกี่ตัว (ตอบเป็นจำนวนตัว)"
    answer: { value: 24, unit: ตัว }
    hints:
      - "ตัวประกอบทุกตัวของ 360 อยู่ในรูป $2^a \\times 3^b \\times 5^c$"
      - "$a$ เลือกได้ตั้งแต่ 0 ถึง 3, $b$ ตั้งแต่ 0 ถึง 2 และ $c$ ตั้งแต่ 0 ถึง 1 แต่ละตัวเลือกได้กี่แบบ"
      - "ใช้หลักการคูณ: นำจำนวนแบบของแต่ละเลขชี้กำลังมาคูณกัน"
    misconceptions:
      - { match: 6, feedback: "ดูเหมือนนำเลขชี้กำลัง $3 \\times 2 \\times 1$ มาคูณ (หรือบวก) ตรง ๆ แต่เลขชี้กำลังเลือกเป็น 0 ได้ด้วย จึงต้องบวก 1 ก่อนคูณ" }
      - { match: 9, feedback: "บวก 1 ถูกแล้ว แต่ต้องนำ $(3 + 1)$, $(2 + 1)$, $(1 + 1)$ มาคูณกัน ไม่ใช่บวกกัน เพราะเลือกแต่ละส่วนได้อิสระ" }
    solution: "เลขชี้กำลังของ 2 เลือกได้ 4 แบบ (0–3) ของ 3 เลือกได้ 3 แบบ (0–2) ของ 5 เลือกได้ 2 แบบ (0–1) จำนวนตัวประกอบ $= 4 \\times 3 \\times 2 = 24$ ตัว ตรวจ: 1, 2, 3, 4, 5, 6, 8, 9, 10, 12, 15, 18, 20, 24, 30, 36, 40, 45, 60, 72, 90, 120, 180, 360 ครบ 24 ตัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.fm.p018
    topics: [math.number.factors-multiples]
    difficulty: 3
    type: numeric
    stem: "แผนภาพเวนน์แสดงตัวประกอบเฉพาะของ 60 และ 84 จงหา ค.ร.น. ของ 60 และ 84"
    figure: { src: venn-60-84.svg, alt: "แผนภาพเวนน์สองวง วง 60 ด้านซ้ายมีเลข 5 อยู่เฉพาะในวง ส่วนที่ซ้อนกันตรงกลางมี 2, 2, 3 และวง 84 ด้านขวามีเลข 7 อยู่เฉพาะในวง" }
    answer: { value: 420 }
    hints:
      - "ตัวเลขทั้งหมดในวงซ้าย (รวมตรงกลาง) คูณกันได้ 60 และในวงขวาได้ 84"
      - "ค.ร.น. ต้องมีตัวประกอบเฉพาะของทั้งสองจำนวน แต่นับส่วนที่ซ้ำกันเพียงครั้งเดียว"
      - "คูณตัวเลขทุกตัวที่อยู่ในแผนภาพ"
    misconceptions:
      - { match: 12, feedback: "12 คือผลคูณเฉพาะตรงกลาง ซึ่งเป็น ห.ร.ม. ค.ร.น. ต้องคูณตัวเลขทุกตัวในแผนภาพ" }
      - { match: 5040, feedback: "นั่นคือ $60 \\times 84$ ซึ่งนับส่วนตรงกลางซ้ำสองครั้ง ได้พหุคูณร่วมแต่ไม่ใช่ตัวที่น้อยที่สุด" }
      - { match: 35, feedback: "$5 \\times 7 = 35$ เป็นเพียงส่วนที่ไม่ซ้ำกัน ต้องคูณกับส่วนตรงกลางด้วย" }
    solution: "ค.ร.น. $= 5 \\times (2 \\times 2 \\times 3) \\times 7 = 5 \\times 12 \\times 7 = 420$ ตรวจ: $420 \\div 60 = 7$ และ $420 \\div 84 = 5$ ลงตัวทั้งคู่ ✓"
