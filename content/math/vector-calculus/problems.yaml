    stem: "จากโจทย์คลองชลประทาน ให้สนามความเร็วผิวน้ำเป็น $\\mathbf{v} = \\langle 0.6(1 - y^2/25),\\; 0\\rangle$ (ไหลตามแกน $x$) ใบไม้เล็กที่ลอยอยู่ห่างจากกึ่งกลางคลองจะเป็นอย่างไร"
    choices:
      - { id: a, text: "ลอยไปตามน้ำและหมุนรอบตัวเอง เพราะเคิร์ลไม่เป็นศูนย์ (ยกเว้นที่กึ่งกลาง)", correct: true, feedback: "ถูก ส่วน z ของเคิร์ลคือ $-\\partial u/\\partial y = 0.048y$ น้ำสองข้างใบไม้ไหลเร็วไม่เท่ากัน" }
      - { id: b, text: "ไม่หมุน เพราะน้ำไหลเป็นเส้นตรง", feedback: "แม้เส้นการไหลตรง ความเร็วต่างกันข้ามความกว้างทำให้เกิดการหมุนได้" }
      - { id: c, text: "จมลง เพราะไดเวอร์เจนซ์เป็นลบ", feedback: "$\\nabla\\cdot\\mathbf{v} = \\partial u/\\partial x = 0$ ไม่มีน้ำหายหรือเกิดเพิ่ม" }
    hints:
      - "คำนวณ $Q_x - P_y$ เมื่อ $P = u(y)$, $Q = 0$"
      - "เคิร์ลบอกการหมุนของวัตถุเล็ก ๆ ที่ลอยตามน้ำ"
    solution: "$\\nabla\\cdot\\mathbf{v} = 0$ แต่ส่วน z ของเคิร์ล $= 0 - u'(y) = 0.048y$ ไม่เป็นศูนย์เมื่อ $y \\ne 0$ ใบไม้จึง **ลอยไปและหมุน** (ฝั่ง $y > 0$ หมุนทวนเข็ม ฝั่ง $y < 0$ หมุนตามเข็ม)"
