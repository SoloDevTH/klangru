id: physics.nuclear.nuclear-energy-particles
subject: physics
title: { th: พลังงานนิวเคลียร์และฟิสิกส์อนุภาค, en: Nuclear energy and particle physics }
summary: แรงเข้มและแรงอ่อน มวลพร่องและพลังงานยึดเหนี่ยว ฟิชชันและฟิวชัน ประโยชน์และอันตรายของพลังงานนิวเคลียร์ในบริบทไทย และแบบจำลองมาตรฐานของอนุภาค
difficulty: 6.5
minutes: 40
prerequisites: [physics.nuclear.radioactivity]
encompasses:
  - { id: physics.nuclear.radioactivity, weight: 0.3 }
  - { id: chemistry.matter.atoms, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: พลังงานยึดเหนี่ยวต่อนิวคลีออน
    src: binding-curve.svg
    alt: "กราฟพลังงานยึดเหนี่ยวต่อนิวคลีออน (MeV) กับเลขมวล A ของนิวไคลด์ที่พบในธรรมชาติ ค่าเพิ่มอย่างรวดเร็วจาก H-2 (1.1 MeV) He-4 (7.1) C-12 (7.7) O-16 (8.0) จนสูงสุดราว 8.8 MeV ที่ Fe-56 แล้วค่อย ๆ ลดลงจนถึงราว 7.6 MeV ที่ U-235 ลูกศรสีเขียวชี้จากนิวเคลียสเบาไปทางขวาเขียนว่าฟิวชัน ลูกศรสีส้มชี้จากนิวเคลียสหนักไปทางซ้ายเขียนว่าฟิชชัน ทั้งสองทางเข้าใกล้ยอดกราฟ"
  - type: worked-example
    title: พลังงานยึดเหนี่ยวของฮีเลียม-4
    problem: "จงหาพลังงานยึดเหนี่ยวและพลังงานยึดเหนี่ยวต่อนิวคลีออนของ $^{4}_{2}\\mathrm{He}$ กำหนดมวลอะตอม $^{1}\\mathrm{H} = 1.007825\\ \\mathrm{u}$ นิวตรอน $= 1.008665\\ \\mathrm{u}$ และ $^{4}\\mathrm{He} = 4.002603\\ \\mathrm{u}$ ($1\\ \\mathrm{u} \\to 931.5\\ \\mathrm{MeV}$)"
    steps:
      - text: "มวลของส่วนประกอบที่แยกกัน: $2(1.007825) + 2(1.008665) = 4.032980\\ \\mathrm{u}$"
        why: "ใช้มวลอะตอมไฮโดรเจน-1 แทนโปรตอน อิเล็กตรอน 2 ตัวในอะตอมไฮโดรเจนจะหักล้างกับอิเล็กตรอน 2 ตัวในอะตอมฮีเลียมพอดี"
      - text: "มวลพร่อง $\\Delta m = 4.032980 - 4.002603 = 0.030377\\ \\mathrm{u}$"
      - text: "พลังงานยึดเหนี่ยว $= 0.030377 \\times 931.5 = 28.3\\ \\mathrm{MeV}$"
      - text: "ต่อนิวคลีออน $= \\dfrac{28.3}{4} = 7.07\\ \\mathrm{MeV}$"
        why: "เทียบกับกราฟ ฮีเลียม-4 อยู่สูงกว่านิวเคลียสข้างเคียงมาก จึงเสถียรเป็นพิเศษ และเป็นเหตุที่รังสีแอลฟาเป็นนิวเคลียสฮีเลียม"
    answer: "พลังงานยึดเหนี่ยว $\\approx 28.3\\ \\mathrm{MeV}$ หรือ $7.07\\ \\mathrm{MeV}$ ต่อนิวคลีออน"
  - { type: check, problem: physics.nuclear.nuclear-energy-particles.p007, prompt: "ดุลเลขมวลโดยนับนิวตรอนที่เข้าไปชนด้วย" }
  - type: figure
    title: ปฏิกิริยาลูกโซ่
    src: chain-reaction.svg
    alt: "นิวตรอนหนึ่งตัวชนนิวเคลียสยูเรเนียม-235 นิวเคลียสแตกเป็นแบเรียมกับคริปทอน และปล่อยนิวตรอน 3 ตัว นิวตรอนแต่ละตัวไปชนยูเรเนียม-235 อีก 3 นิวเคลียสในรุ่นที่ 2 ซึ่งปล่อยนิวตรอนรวม 9 ตัวในรุ่นที่ 3 จำนวนเพิ่มขึ้นเรื่อย ๆ ข้อความบอกว่าแต่ละฟิชชันปล่อยนิวตรอน 2–3 ตัวและพลังงานราว 200 MeV"
  - type: worked-example
    title: พลังงานจากฟิวชันเทียบกับฟิชชัน
    problem: "ปฏิกิริยา $^{2}_{1}\\mathrm{H} +\\ ^{3}_{1}\\mathrm{H} \\to\\ ^{4}_{2}\\mathrm{He} +\\ ^{1}_{0}\\mathrm{n}$ มีมวล $^{2}\\mathrm{H} = 2.014102\\ \\mathrm{u}$, $^{3}\\mathrm{H} = 3.016049\\ \\mathrm{u}$, $^{4}\\mathrm{He} = 4.002603\\ \\mathrm{u}$, นิวตรอน $= 1.008665\\ \\mathrm{u}$ จงหาพลังงานที่ปล่อยออกมา และพลังงานต่อนิวคลีออนที่เข้าทำปฏิกิริยา เทียบกับฟิชชันของยูเรเนียม-235 ที่ให้ราว $200\\ \\mathrm{MeV}$"
    steps:
      - text: "มวลก่อน $= 2.014102 + 3.016049 = 5.030151\\ \\mathrm{u}$ มวลหลัง $= 4.002603 + 1.008665 = 5.011268\\ \\mathrm{u}$"
      - text: "มวลที่หายไป $= 0.018883\\ \\mathrm{u}$ จึงได้ $Q = 0.018883 \\times 931.5 = 17.6\\ \\mathrm{MeV}$"
      - text: "ต่อนิวคลีออน: ฟิวชัน $\\dfrac{17.6}{5} = 3.5\\ \\mathrm{MeV}$ ฟิชชัน $\\dfrac{200}{236} = 0.85\\ \\mathrm{MeV}$"
        why: "ฟิชชันมีนิวคลีออนเข้าทำปฏิกิริยา 236 ตัว (ยูเรเนียม 235 กับนิวตรอน 1) ส่วนฟิวชันนี้มี 5 ตัว"
    answer: "$Q \\approx 17.6\\ \\mathrm{MeV}$ ต่อนิวคลีออนฟิวชันให้พลังงานราว 4 เท่าของฟิชชัน แม้แต่ละปฏิกิริยาจะให้พลังงานน้อยกว่า"
  - type: figure
    title: แบบจำลองมาตรฐาน
    src: standard-model.svg
    alt: "ตารางอนุภาคมูลฐาน: ควาร์ก 6 ชนิด คือ อัป ชาร์ม ท็อป (ประจุ +2/3) และดาวน์ สเตรนจ์ บอตทอม (ประจุ −1/3) เลปตอน 6 ชนิด คือ อิเล็กตรอน มิวออน เทา (ประจุ −1) และนิวทริโน 3 ชนิด (ประจุ 0) จัดเป็น 3 รุ่น อนุภาคพาแรง คือ กลูออน (แรงเข้ม) โฟตอน (แรงแม่เหล็กไฟฟ้า) โบซอน Z และ W (แรงอ่อน) และฮิกส์โบซอน หมายเหตุว่าโปรตอนคือ uud นิวตรอนคือ udd"
  - { type: check, problem: physics.nuclear.nuclear-energy-particles.p003, prompt: "รวมประจุของควาร์กทั้งสามตัว" }
glossary:
  - { term: แรงเข้ม, definition: "แรงดึงดูดระหว่างนิวคลีออนที่ยึดนิวเคลียสไว้ มีขนาดมากแต่ระยะทำการสั้นประมาณ 10⁻¹⁵ เมตร" }
  - { term: แรงอ่อน, definition: "แรงพื้นฐานระยะทำการสั้นมาก ทำให้นิวตรอนเปลี่ยนเป็นโปรตอนในการสลายให้บีตา" }
  - { term: มวลพร่อง, definition: "ผลต่างระหว่างผลรวมมวลของนิวคลีออนที่แยกกันอยู่กับมวลของนิวเคลียส" }
  - { term: พลังงานยึดเหนี่ยว, definition: "พลังงานที่ต้องใช้แยกนิวเคลียสออกเป็นนิวคลีออน เท่ากับมวลพร่องคูณ c²" }
  - { term: ฟิชชัน, definition: "ปฏิกิริยาที่นิวเคลียสหนักแตกเป็นนิวเคลียสขนาดกลางสองนิวเคลียส พร้อมปล่อยนิวตรอนและพลังงาน" }
  - { term: ฟิวชัน, definition: "ปฏิกิริยาที่นิวเคลียสเบารวมกันเป็นนิวเคลียสที่หนักขึ้น พร้อมปล่อยพลังงาน ต้องใช้อุณหภูมิสูงมาก" }
  - { term: ควาร์ก, definition: "อนุภาคมูลฐานที่ประกอบกันเป็นโปรตอนและนิวตรอน มี 6 ชนิด" }
flashcards:
  - { front: "พลังงานยึดเหนี่ยว", back: "$E = \\Delta m\\,c^2$ และ $1\\ \\mathrm{u} \\to 931.5\\ \\mathrm{MeV}$" }
  - { front: "พลังงานจากปฏิกิริยานิวเคลียร์", back: "$Q = (m_{\\text{ก่อน}} - m_{\\text{หลัง}})c^2$ ต้องดุลเลขมวลและเลขอะตอม" }
  - { front: "นิวเคลียสที่เสถียรที่สุด", back: "เลขมวลประมาณ 56 (เหล็ก) พลังงานยึดเหนี่ยวต่อนิวคลีออนราว $8.8\\ \\mathrm{MeV}$" }
  - { front: "ฟิชชันกับฟิวชัน", back: "ฟิชชัน: นิวเคลียสหนักแตกตัว · ฟิวชัน: นิวเคลียสเบารวมตัว ทั้งคู่ได้นิวเคลียสที่ยึดแน่นขึ้น" }
  - { front: "โปรตอนและนิวตรอนประกอบด้วยควาร์กอะไร", back: "โปรตอน uud · นิวตรอน udd" }
