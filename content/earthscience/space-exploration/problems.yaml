problems:
  - id: earthscience.astronomy.space-exploration.p001
    topics: [earthscience.astronomy.space-exploration]
    difficulty: 1
    type: mcq
    stem: "ทำไมกล้องโทรทรรศน์รังสีเอกซ์จึงต้องอยู่ในอวกาศ"
    choices:
      - { id: a, text: "บรรยากาศของโลกดูดกลืนรังสีเอกซ์จากอวกาศไว้ รังสีจึงลงมาไม่ถึงพื้น", correct: true }
      - { id: b, text: "อยู่ในอวกาศจะใกล้ดาวมากขึ้น ภาพจึงชัดขึ้น", feedback: "กล้องสูงขึ้นไปไม่กี่ร้อยกิโลเมตร เทียบกับระยะถึงดาวที่ไกลมากแทบไม่ต่างกัน เหตุผลจริงคือบรรยากาศดูดกลืนรังสีเอกซ์" }
      - { id: c, text: "รังสีเอกซ์เกิดเฉพาะในอวกาศ บนโลกไม่มี", feedback: "บนโลกก็สร้างรังสีเอกซ์ได้ เช่น เครื่องเอกซเรย์ในโรงพยาบาล ปัญหาคือรังสีจากอวกาศผ่านบรรยากาศลงมาไม่ได้" }
      - { id: d, text: "กล้องรังสีเอกซ์ทำงานได้เฉพาะในที่ไร้น้ำหนัก", feedback: "สภาพไร้น้ำหนักไม่ได้จำเป็นต่อการรับรังสีเอกซ์" }
    hints:
      - "คลื่นช่วงไหนบ้างที่ผ่านบรรยากาศลงมาถึงพื้นได้"
      - "รังสีเอกซ์อยู่ในหน้าต่างบรรยากาศหรือไม่"
    solution: "บรรยากาศดูดกลืนรังสีแกมมา รังสีเอกซ์ และอัลตราไวโอเลตเกือบทั้งหมด กล้องรังสีเอกซ์จึงต้องอยู่เหนือบรรยากาศ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.space-exploration.p002
    topics: [earthscience.astronomy.space-exploration]
    difficulty: 1
    type: match
    stem: "จับคู่เครื่องมือสำรวจอวกาศกับช่วงคลื่นหรืองานหลัก"
    pairs:
      - { left: "กล้องโทรทรรศน์วิทยุแห่งชาติ 40 เมตร", right: "คลื่นวิทยุ" }
      - { left: "กล้องเจมส์ เว็บบ์", right: "อินฟราเรด" }
      - { left: "กล้องจันทรา", right: "รังสีเอกซ์" }
      - { left: "ดาวเทียมไทยโชต", right: "ถ่ายภาพพื้นผิวโลกเพื่อสำรวจทรัพยากร" }
    hints:
      - "กล้องที่มีจานใหญ่บนพื้นโลกรับคลื่นที่ผ่านบรรยากาศได้ดี"
      - "ไทยโชตหันกล้องลงมาที่โลก ไม่ได้หันไปที่ดาว"
    solution: "กล้องวิทยุ 40 เมตรรับคลื่นวิทยุ เจมส์ เว็บบ์รับอินฟราเรด จันทรารับรังสีเอกซ์ และไทยโชตถ่ายภาพพื้นโลก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.space-exploration.p003
    topics: [earthscience.astronomy.space-exploration]
    difficulty: 2
    type: numeric
    stem: "กล้องโทรทรรศน์ที่หอดูดาวแห่งชาติบนดอยอินทนนท์มีกระจกกว้าง 2.4 m ส่วนกล้องเล็กอีกตัวกว้าง 0.5 m กล้องตัวใหญ่รวมแสงได้มากกว่ากล้องตัวเล็กกี่เท่า"
    answer: { value: 23.04, tolerance: 0.3, unit: เท่า }
    misconceptions:
      - { match: 4.8, feedback: "4.8 คืออัตราส่วนของเส้นผ่านศูนย์กลาง แต่การรวมแสงขึ้นกับพื้นที่ ต้องยกกำลังสอง" }
      - { match: 110.6, feedback: "ยกกำลังสามเกินไป พื้นที่แปรผันตามกำลังสองของเส้นผ่านศูนย์กลาง" }
    hints:
      - "แสงที่รวมได้แปรผันตามพื้นที่ของกระจก"
      - "พื้นที่แปรผันตาม $D^2$ ให้หา $(D_1/D_2)^2$"
    solution: "อัตราส่วน $= \\left(\\dfrac{2.4}{0.5}\\right)^2 = 4.8^2 = 23.04$ เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.space-exploration.p004
    topics: [earthscience.astronomy.space-exploration]
    difficulty: 2
    type: mcq
    stem: "ดาวเทียมที่ใช้ถ่ายทอดโทรทัศน์ไปยังจานรับสัญญาณที่ตั้งหันไปทางเดิมตลอดเวลา ควรอยู่ในวงโคจรแบบใด"
    choices:
      - { id: a, text: "วงโคจรค้างฟ้า สูง 35,786 กิโลเมตร คาบเท่ากับการหมุนของโลก", correct: true }
      - { id: b, text: "วงโคจรต่ำผ่านขั้วโลก เหมือนไทยโชต", feedback: "ดาวเทียมวงโคจรต่ำเคลื่อนผ่านท้องฟ้าเร็ว จานที่หันนิ่งจะรับสัญญาณได้แค่ช่วงสั้น ๆ" }
      - { id: c, text: "วงโคจรเดียวกับสถานีอวกาศ สูงราว 400 กิโลเมตร", feedback: "วงโคจรนี้โคจรรอบโลกราว 92 นาที ดาวเทียมจึงไม่อยู่นิ่งเหนือจุดเดิม" }
      - { id: d, text: "ไปอยู่ห่างโลก 1.5 ล้านกิโลเมตรเหมือนกล้องเจมส์ เว็บบ์", feedback: "ไกลเกินไป สัญญาณอ่อนมากและตำแหน่งบนท้องฟ้าไม่คงที่ตามการหมุนของโลก" }
    hints:
      - "จานไม่ขยับ ดาวเทียมต้องดูเหมือนอยู่นิ่งบนท้องฟ้า"
      - "คาบของดาวเทียมต้องเท่ากับคาบการหมุนของโลก"
    solution: "ดาวเทียมค้างฟ้าโคจรรอบโลกพอดีกับที่โลกหมุนหนึ่งรอบ จึงดูเหมือนอยู่นิ่งเหนือจุดเดิม จานรับสัญญาณจึงหันไปทางเดียวได้ตลอด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.space-exploration.p005
    topics: [earthscience.astronomy.space-exploration]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ภาพจากดาวเทียมสำรวจทรัพยากรอย่างไทยโชตและ THEOS-2 ช่วยงานใดได้ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ประเมินพื้นที่น้ำท่วมในลุ่มน้ำเจ้าพระยา", correct: true }
      - { id: b, text: "ติดตามการบุกรุกป่าและพื้นที่เผาไหม้", correct: true }
      - { id: c, text: "สำรวจพื้นที่ปลูกข้าวและอ้อย", correct: true }
      - { id: d, text: "ถ่ายภาพกาแล็กซีที่อยู่ไกลมาก", feedback: "ดาวเทียมสำรวจทรัพยากรหันกล้องลงมาที่พื้นโลก งานถ่ายภาพกาแล็กซีเป็นของกล้องโทรทรรศน์อวกาศ" }
    hints:
      - "ดาวเทียมนี้หันกล้องไปทางไหน"
      - "งานที่ต้องดูพื้นที่บนโลกกว้าง ๆ ซ้ำหลายครั้ง"
    solution: "ไทยโชตและ THEOS-2 ถ่ายภาพพื้นผิวโลก จึงใช้ประเมินน้ำท่วม การบุกรุกป่า พื้นที่เผาไหม้ และการเพาะปลูก ไม่ได้ใช้ถ่ายภาพกาแล็กซี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.space-exploration.p006
    topics: [earthscience.astronomy.space-exploration]
    difficulty: 2
    type: order
    stem: "เรียงขั้นการวางแผนกิจกรรมดูดาวเคราะห์ของชมรมดาราศาสตร์"
    items:
      - "เลือกเป้าหมาย แล้วตรวจจากแผนที่ดาวว่าขึ้นเหนือขอบฟ้ากี่โมงและอยู่ทางทิศใด"
      - "เลือกวันที่ฟ้าน่าจะใส และดูข้างขึ้นข้างแรม"
      - "เลือกสถานที่มืด ปลอดภัย และเห็นขอบฟ้าทางนั้น"
      - "เตรียมกล้อง ไฟฉายแสงสีแดง และแบบบันทึก"
      - "ให้ตาปรับกับความมืด สังเกต และบันทึกเวลา ตำแหน่ง และสภาพท้องฟ้า"
    hints:
      - "ต้องรู้ก่อนว่าจะดูอะไร จึงเลือกวันและที่ได้"
      - "การบันทึกผลเกิดขึ้นตอนสังเกตจริง เป็นขั้นสุดท้าย"
    solution: "เลือกเป้าหมายและตรวจเวลา → เลือกวัน → เลือกสถานที่ → เตรียมอุปกรณ์ → สังเกตและบันทึก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.space-exploration.p007
    topics: [earthscience.astronomy.space-exploration]
    difficulty: 3
    type: numeric
    stem: "กระจกของกล้องเจมส์ เว็บบ์กว้าง 6.5 m ส่วนกล้องฮับเบิลกว้าง 2.4 m กล้องเจมส์ เว็บบ์รวมแสงได้มากกว่าฮับเบิลประมาณกี่เท่า (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 7.3, tolerance: 0.1, unit: เท่า }
    misconceptions:
      - { match: 2.7, feedback: "2.7 คืออัตราส่วนของเส้นผ่านศูนย์กลาง การรวมแสงแปรผันตามพื้นที่ จึงต้องยกกำลังสอง" }
      - { match: 4.1, feedback: "4.1 คือผลต่าง 6.5 − 2.4 โจทย์ถามว่ากี่เท่า ต้องใช้อัตราส่วนยกกำลังสอง" }
    hints:
      - "ใช้ความสามารถรวมแสงแปรผันตาม $D^2$"
      - "คำนวณ $(6.5/2.4)^2$"
    solution: "$\\left(\\dfrac{6.5}{2.4}\\right)^2 = 2.708^2 \\approx 7.3$ เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.space-exploration.p008
    topics: [earthscience.astronomy.space-exploration]
    difficulty: 3
    type: numeric
    stem: "ประมาณกำลังแยกของกล้องฮับเบิล ($D = 2.4\\ \\mathrm{m}$) ที่แสงความยาวคลื่น $500\\ \\mathrm{nm}$ ด้วย $\\theta \\approx 1.22\\lambda/D$ ตอบเป็นฟิลิปดา (ใช้ $1\\ \\mathrm{rad} = 206{,}265$ ฟิลิปดา ตอบทศนิยม 3 ตำแหน่ง)"
    answer: { value: 0.052, tolerance: 0.002, unit: ฟิลิปดา }
    misconceptions:
      - { match: 0.043, feedback: "ลืมคูณ 1.22 ในสูตรกำลังแยก" }
      - { match: 52.4, feedback: "ใช้ λ เป็น 500 × 10⁻⁶ m (ไมโครเมตร) แทน 500 × 10⁻⁹ m ทำให้ค่าเกินไป 1,000 เท่า" }
    hints:
      - "แปลง $\\lambda = 500\\ \\mathrm{nm} = 5.0 \\times 10^{-7}\\ \\mathrm{m}$"
      - "คำนวณ $\\theta$ เป็นเรเดียนก่อน แล้วคูณ 206,265"
    solution: "$\\theta = 1.22 \\times \\dfrac{5.0 \\times 10^{-7}}{2.4} = 2.54 \\times 10^{-7}\\ \\mathrm{rad}$ คูณ 206,265 ได้ประมาณ $0.052$ ฟิลิปดา ฮับเบิลทำได้ใกล้ค่านี้เพราะอยู่เหนือบรรยากาศ ส่วนกล้องบนพื้นโลกมักถูกอากาศปั่นป่วนจำกัดไว้ราว 1 ฟิลิปดา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.space-exploration.p009
    topics: [earthscience.astronomy.space-exploration]
    difficulty: 3
    type: numeric
    stem: "กล้องโทรทรรศน์วิทยุแห่งชาติรับคลื่นความถี่ $22\\ \\mathrm{GHz}$ คลื่นนี้มีความยาวคลื่นกี่เซนติเมตร (ใช้ $c = 3.0 \\times 10^8\\ \\mathrm{m/s}$ ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 1.36, tolerance: 0.02, unit: cm }
    misconceptions:
      - { match: 0.01, feedback: "0.0136 m คือคำตอบในหน่วยเมตร ต้องแปลงเป็นเซนติเมตรโดยคูณ 100" }
      - { match: 1364, feedback: "ใช้ 22 GHz เป็น $22 \\times 10^6$ Hz (เมกะเฮิรตซ์) ที่ถูกคือ $22\\ \\mathrm{GHz} = 22 \\times 10^9\\ \\mathrm{Hz}$" }
    hints:
      - "ใช้ $c = f\\lambda$"
      - "$\\lambda = c/f$ แล้วแปลงเมตรเป็นเซนติเมตร"
    solution: "$\\lambda = \\dfrac{3.0 \\times 10^8}{22 \\times 10^9} = 0.0136\\ \\mathrm{m} = 1.36\\ \\mathrm{cm}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.space-exploration.p010
    topics: [earthscience.astronomy.space-exploration]
    difficulty: 3
    type: mcq
    stem: "ชมรมดาราศาสตร์ในจังหวัดน่านอยากถ่ายภาพทางช้างเผือก ควรเลือกคืนแบบใด"
    choices:
      - { id: a, text: "คืนเดือนมืด ฟ้าใส ที่ลานกว้างนอกเมืองซึ่งไม่มีไฟส่อง", correct: true }
      - { id: b, text: "คืนวันเพ็ญ เพราะแสงจันทร์ช่วยให้มองเห็นชัด", feedback: "แสงจันทร์เต็มดวงทำให้ท้องฟ้าสว่าง กลบแสงจาง ๆ ของทางช้างเผือก" }
      - { id: c, text: "คืนที่ฝนเพิ่งหยุดตก เมฆยังมาก", feedback: "เมฆบังท้องฟ้า ต้องเลือกคืนที่ฟ้าใส" }
      - { id: d, text: "สนามฟุตบอลในเมืองที่เปิดไฟสนามทั้งคืน", feedback: "แสงไฟเมืองและไฟสนามทำให้ท้องฟ้าสว่าง จนมองไม่เห็นวัตถุจาง" }
    hints:
      - "ทางช้างเผือกเป็นแสงจาง ต้องการท้องฟ้าที่มืดที่สุด"
      - "ตัดคืนที่มีแสงจันทร์ แสงไฟ หรือเมฆ"
    solution: "ทางช้างเผือกจางมาก ต้องดูในคืนเดือนมืด ฟ้าใส และไกลจากแสงไฟ ซึ่งเป็นหลักเดียวกับที่กลางวันเรามองไม่เห็นดาว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.space-exploration.p011
    topics: [earthscience.astronomy.space-exploration]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นการใช้เทคโนโลยีอวกาศในชีวิตประจำวัน (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "แอปนำทางในโทรศัพท์ที่ใช้สัญญาณ GPS", correct: true }
      - { id: b, text: "ภาพเมฆจากดาวเทียมในรายการพยากรณ์อากาศ", correct: true }
      - { id: c, text: "เซนเซอร์ภาพในกล้องโทรศัพท์ที่พัฒนาต่อจากงานอวกาศ", correct: true }
      - { id: d, text: "การดูดาวด้วยตาเปล่า", feedback: "การดูดาวด้วยตาเปล่าไม่ได้ใช้เทคโนโลยีอวกาศ" }
    hints:
      - "ดาวเทียมส่งข้อมูลอะไรมาให้เราบ้าง"
      - "ผลพลอยได้จากงานอวกาศก็นับด้วย"
    solution: "GPS และภาพเมฆมาจากดาวเทียมโดยตรง เซนเซอร์ภาพ CMOS เป็นผลพลอยได้จากงานอวกาศ ส่วนการดูดาวด้วยตาเปล่าไม่ได้ใช้เทคโนโลยีอวกาศ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.space-exploration.p012
    topics: [earthscience.astronomy.space-exploration]
    difficulty: 4
    type: numeric
    stem: "สถานีอวกาศนานาชาติโคจรสูงจากผิวโลก 400 km ด้วยอัตราเร็ว 7.66 km/s ถ้าวงโคจรเป็นวงกลมและรัศมีโลกเท่ากับ 6,371 km สถานีโคจรครบหนึ่งรอบใช้เวลากี่นาที"
    answer: { value: 92.6, tolerance: 1, unit: นาที }
    misconceptions:
      - { match: 5.47, feedback: "ใช้รัศมีเป็น 400 km ซึ่งเป็นแค่ความสูง รัศมีวงโคจรต้องวัดจากศูนย์กลางโลก คือ 6,371 + 400 km" }
      - { match: 5554, feedback: "5,554 คือคาบในหน่วยวินาที ต้องหารด้วย 60 เป็นนาที" }
    hints:
      - "รัศมีวงโคจร $r = R + h$"
      - "คาบ $T = 2\\pi r / v$ แล้วแปลงวินาทีเป็นนาที"
    solution: "$r = 6{,}371 + 400 = 6{,}771\\ \\mathrm{km}$, $T = \\dfrac{2\\pi \\times 6{,}771}{7.66} = 5{,}554\\ \\mathrm{s} \\approx 92.6$ นาที วันหนึ่งสถานีจึงโคจรรอบโลกราว 15–16 รอบ"
