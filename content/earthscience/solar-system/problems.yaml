problems:
  - id: earthscience.astronomy.solar-system.p001
    topics: [earthscience.astronomy.solar-system]
    difficulty: 1
    type: match
    stem: "จับคู่ชั้นของดวงอาทิตย์กับลักษณะ"
    pairs:
      - { left: "แกน", right: "หลอมไฮโดรเจนเป็นฮีเลียม ร้อนราว 15 ล้าน K" }
      - { left: "เขตการพาความร้อน", right: "แก๊สร้อนลอยขึ้น เย็นแล้วจมลง" }
      - { left: "โฟโตสเฟียร์", right: "ผิวที่เราเห็น ราว 5,800 K มีจุดมืด" }
      - { left: "คอโรนา", right: "บรรยากาศชั้นนอกร้อนกว่าหนึ่งล้าน K เป็นต้นทางของลมสุริยะ" }
    hints:
      - "พลังงานเกิดที่ใจกลาง"
      - "ชั้นนอกสุดเห็นได้ชัดตอนสุริยุปราคาเต็มดวง"
    solution: "แกนผลิตพลังงานจากการหลอมนิวเคลียส เขตการพาความร้อนพาพลังงานขึ้นมาโดยการเคลื่อนที่ของแก๊ส โฟโตสเฟียร์คือผิวที่เห็น และคอโรนาคือบรรยากาศชั้นนอกที่ร้อนมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.solar-system.p002
    topics: [earthscience.astronomy.solar-system]
    difficulty: 1
    type: mcq
    stem: "ทำไมดาวเคราะห์ที่อยู่ใกล้ดวงอาทิตย์ (พุธ ศุกร์ โลก อังคาร) จึงเป็นดาวเคราะห์หินขนาดเล็ก"
    choices:
      - { id: a, text: "ใกล้ดวงอาทิตย์ร้อนเกินกว่าน้ำและแก๊สจะแข็งตัว มีเพียงหินและโลหะที่รวมตัวได้", correct: true }
      - { id: b, text: "ดวงอาทิตย์ดูดแก๊สออกจากดาวเคราะห์ชั้นในจนหมดในภายหลัง", feedback: "ดาวเคราะห์ชั้นในเป็นหินตั้งแต่ตอนเกิด เพราะวัตถุดิบที่ควบแน่นได้ใกล้ดวงอาทิตย์มีแต่หินและโลหะ" }
      - { id: c, text: "ดาวเคราะห์ชั้นในเกิดก่อนดวงอาทิตย์", feedback: "ดวงอาทิตย์และดาวเคราะห์เกิดจากเนบิวลาเดียวกันในช่วงเวลาใกล้กัน ดวงอาทิตย์เป็นส่วนที่รวมตัวที่ศูนย์กลาง" }
      - { id: d, text: "ดาวเคราะห์ชั้นในหมุนรอบตัวเองเร็วกว่า", feedback: "อัตราการหมุนรอบตัวเองไม่ได้กำหนดว่าดาวเคราะห์เป็นหินหรือแก๊ส" }
    hints:
      - "ในจานรอบดวงอาทิตย์ อุณหภูมิลดลงตามระยะ"
      - "สารใดควบแน่นเป็นของแข็งได้ที่อุณหภูมิสูง"
    solution: "ใกล้ดวงอาทิตย์อุณหภูมิสูง สารที่ควบแน่นได้มีเพียงโลหะและหิน ซึ่งมีปริมาณน้อย ดาวเคราะห์จึงเล็กและเป็นหิน เลยแนวน้ำแข็งออกไป น้ำแข็งเพิ่มวัตถุดิบ ดาวเคราะห์จึงโตจนดึงแก๊สไว้ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.solar-system.p003
    topics: [earthscience.astronomy.solar-system]
    difficulty: 2
    type: mcq
    stem: "ดาวหางโคจรรอบดวงอาทิตย์ตามวงรีในภาพ ดาวหางเคลื่อนที่เร็วที่สุดที่ตำแหน่งใด"
    figure: { src: p-orbit.svg, alt: "วงรียาวในแนวนอน ดวงอาทิตย์อยู่ที่โฟกัสใกล้ปลายด้านขวา ตำแหน่ง A อยู่ปลายขวาสุดของวงรี ใกล้ดวงอาทิตย์ที่สุด ตำแหน่ง C อยู่ปลายซ้ายสุด ไกลดวงอาทิตย์ที่สุด ตำแหน่ง B อยู่ด้านบนตรงกลางวงรี และ D อยู่ด้านล่างตรงกลางวงรี" }
    choices:
      - { id: a, text: "A", correct: true }
      - { id: b, text: "B", feedback: "B อยู่ห่างดวงอาทิตย์มากกว่า A อัตราเร็วจึงน้อยกว่า" }
      - { id: c, text: "C", feedback: "C ไกลดวงอาทิตย์ที่สุด ดาวหางเคลื่อนที่ช้าที่สุดที่ตำแหน่งนี้" }
      - { id: d, text: "เร็วเท่ากันทุกตำแหน่ง", feedback: "ตามกฎพื้นที่เท่ากัน ดาวต้องเคลื่อนเร็วเมื่อใกล้และช้าเมื่อไกล" }
    hints:
      - "กฎข้อที่สองของเคพเลอร์: เวลาเท่ากัน กวาดพื้นที่เท่ากัน"
      - "ระยะสั้น ต้องเคลื่อนไปไกลตามวงโคจรจึงกวาดพื้นที่ได้เท่ากัน"
    solution: "A อยู่ใกล้ดวงอาทิตย์ที่สุด เส้นที่ลากจากดวงอาทิตย์สั้นที่สุด ดาวหางต้องเคลื่อนไปได้ไกลที่สุดในเวลาเท่ากันจึงกวาดพื้นที่เท่ากัน อัตราเร็วจึงมากที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.solar-system.p004
    topics: [earthscience.astronomy.solar-system]
    difficulty: 2
    type: numeric
    stem: "ดาวอังคารโคจรรอบดวงอาทิตย์โดยมีกึ่งแกนเอก 1.524 AU ใช้ $T^2 = a^3$ (T เป็นปี a เป็น AU) หาคาบการโคจรของดาวอังคาร เป็นปี"
    answer: { value: 1.881, tolerance: 0.02, unit: "ปี" }
    misconceptions:
      - { match: 1.324, feedback: "ยกกำลัง 2/3 ซึ่งเป็นการหา a จาก T ต้องใช้ $T = a^{3/2}$" }
      - { match: 3.540, feedback: "นี่คือ $a^3$ ซึ่งเท่ากับ $T^2$ ต้องถอดรากที่สองอีกครั้ง" }
    hints:
      - "$T^2 = 1.524^3$"
      - "$T = \\sqrt{1.524^3}$"
    solution: "$T = \\sqrt{1.524^3} = \\sqrt{3.540} \\approx 1.88$ ปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.solar-system.p005
    topics: [earthscience.astronomy.solar-system]
    difficulty: 2
    type: order
    stem: "เรียงลำดับเหตุการณ์การเกิดระบบสุริยะ"
    items:
      - "เนบิวลาสุริยะซึ่งเป็นเมฆแก๊สและฝุ่นเริ่มยุบตัวด้วยแรงโน้มถ่วง"
      - "เนบิวลาหมุนเร็วขึ้นและแบนลงเป็นจานหมุน มวลส่วนใหญ่รวมที่ศูนย์กลาง"
      - "ศูนย์กลางร้อนจนเกิดการหลอมนิวเคลียส กลายเป็นดวงอาทิตย์"
      - "ฝุ่นในจานชนและเกาะกันเป็นดาวเคราะห์ก่อนเกิด แล้วรวมเป็นดาวเคราะห์"
      - "เศษที่เหลือเป็นดาวเคราะห์น้อย ดาวหาง และวัตถุในแถบไคเปอร์"
    hints:
      - "เริ่มจากเมฆแก๊ส"
      - "จานต้องเกิดก่อนดาวเคราะห์ เพราะดาวเคราะห์เกิดในจาน"
    solution: "เนบิวลายุบตัว → แบนเป็นจานหมุน มวลรวมที่ศูนย์กลาง → ดวงอาทิตย์จุดปฏิกิริยานิวเคลียร์ → ดาวเคราะห์ก่อตัวในจาน → เศษที่เหลือเป็นวัตถุขนาดเล็ก (ขั้นที่ 3 และ 4 เกิดในช่วงเวลาซ้อนกัน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.solar-system.p006
    topics: [earthscience.astronomy.solar-system]
    difficulty: 3
    type: numeric
    stem: "ดาวเคราะห์น้อยดวงหนึ่งโคจรรอบดวงอาทิตย์ครบรอบทุก 8 ปี กึ่งแกนเอกของวงโคจรยาวกี่ AU"
    answer: { value: 4, tolerance: 0.04, unit: "AU" }
    misconceptions:
      - { match: 22.6, feedback: "ใช้ $a = T^{3/2}$ ซึ่งสลับกัน ต้องใช้ $a = T^{2/3}$" }
      - { match: 2.83, feedback: "ถอดรากที่สองของ 8 แต่ $a^3 = T^2 = 64$ ต้องถอดรากที่สาม" }
    hints:
      - "$a^3 = T^2 = 64$"
      - "$a = \\sqrt[3]{64}$"
    solution: "$a^3 = 8^2 = 64$ จึงได้ $a = \\sqrt[3]{64} = 4$ AU อยู่เลยแถบดาวเคราะห์น้อยออกไปเล็กน้อย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.solar-system.p007
    topics: [earthscience.astronomy.solar-system]
    difficulty: 3
    type: numeric
    stem: "ดาวหางฮัลเลย์มีกึ่งแกนเอก 17.8 AU และความรี 0.967 ที่จุดไกลดวงอาทิตย์ที่สุด ดาวหางอยู่ห่างจากดวงอาทิตย์กี่ AU"
    answer: { value: 35.0, tolerance: 0.2, unit: "AU" }
    misconceptions:
      - { match: 0.587, feedback: "นี่คือระยะใกล้สุด $a(1-e)$ ระยะไกลสุดคือ $a(1+e)$" }
      - { match: 17.2, feedback: "คูณ $a$ ด้วย $e$ ได้ระยะจากศูนย์กลางถึงโฟกัส ระยะไกลสุดคือ $a + ae = a(1+e)$" }
    hints:
      - "ระยะไกลสุด $= a(1+e)$"
      - "$17.8 \\times 1.967$"
    solution: "$17.8 \\times (1 + 0.967) = 17.8 \\times 1.967 \\approx 35.0$ AU ไกลกว่าวงโคจรของดาวเนปจูน (30 AU)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.solar-system.p008
    topics: [earthscience.astronomy.solar-system]
    difficulty: 3
    type: numeric
    stem: "ลมสุริยะเคลื่อนที่ด้วยอัตราเร็วเฉลี่ย 400 km/s จะใช้เวลากี่วันจึงเดินทางจากดวงอาทิตย์ถึงโลก ($1\\ \\mathrm{AU} = 1.496 \\times 10^{8}$ km)"
    answer: { value: 4.33, tolerance: 0.05, unit: "วัน" }
    misconceptions:
      - { match: 103.9, feedback: "นี่คือเวลาเป็นชั่วโมง ต้องหารด้วย 24 อีกครั้ง" }
      - { match: 4329, feedback: "ใช้ระยะทางเป็นเมตร ($1.496 \\times 10^{11}$) แต่ใช้อัตราเร็วเป็น km/s หน่วยต้องตรงกัน" }
    hints:
      - "เวลา = ระยะทาง ÷ อัตราเร็ว ใช้หน่วยกิโลเมตรทั้งคู่"
      - "แปลงวินาทีเป็นวันโดยหารด้วย 86,400"
    solution: "$t = \\dfrac{1.496 \\times 10^8}{400} = 3.74 \\times 10^5\\ \\mathrm{s} = \\dfrac{3.74 \\times 10^5}{86{,}400} \\approx 4.33$ วัน แสงใช้เวลาเพียง 8.3 นาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.solar-system.p009
    topics: [earthscience.astronomy.solar-system]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "เมื่อเกิดพายุสุริยะรุนแรง ผลใดมีโอกาสเกิดในประเทศไทย (เลือกได้มากกว่าหนึ่งข้อ)"
    choices:
      - { id: a, text: "การหาตำแหน่งด้วย GPS คลาดเคลื่อน", correct: true }
      - { id: b, text: "วิทยุสื่อสารคลื่นสั้นขัดข้อง", correct: true }
      - { id: c, text: "ดาวเทียมสื่อสารและดาวเทียมสำรวจโลกทำงานผิดปกติ", correct: true }
      - { id: d, text: "เห็นแสงเหนือได้ทั่วประเทศทุกครั้ง", feedback: "แสงเหนือเกิดใกล้ขั้วแม่เหล็กโลก ไทยอยู่ใกล้เส้นศูนย์สูตร แม้พายุรุนแรงมากก็แทบไม่เห็น" }
      - { id: e, text: "อุณหภูมิอากาศในไทยสูงขึ้นหลายองศาทันที", feedback: "พายุสุริยะเปลี่ยนสภาพของชั้นบรรยากาศชั้นบนและสนามแม่เหล็ก ไม่ได้ทำให้อากาศที่ผิวโลกร้อนขึ้นทันที" }
    hints:
      - "อนุภาคมีประจุทำให้ชั้นไอโอโนสเฟียร์แปรปรวน"
      - "สัญญาณใดต้องผ่านหรือสะท้อนจากไอโอโนสเฟียร์"
    solution: "พายุสุริยะทำให้ไอโอโนสเฟียร์แปรปรวน สัญญาณ GPS ที่ผ่านชั้นนี้คลาดเคลื่อน วิทยุคลื่นสั้นที่สะท้อนจากชั้นนี้ขัดข้อง และอนุภาคพลังงานสูงทำลายอุปกรณ์บนดาวเทียม ส่วนแสงเหนือเกิดใกล้ขั้วโลก และพายุไม่ทำให้อากาศที่ผิวโลกร้อนขึ้นทันที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.solar-system.p010
    topics: [earthscience.astronomy.solar-system]
    difficulty: 3
    type: mcq
    stem: "ดาวอังคารอยู่ใกล้ขอบนอกของเขตเอื้อต่อชีวิตของดวงอาทิตย์ แต่ปัจจุบันไม่มีน้ำเป็นของเหลวบนผิว เหตุผลสำคัญคือข้อใด"
    choices:
      - { id: a, text: "ดาวอังคารมีมวลน้อยและไม่มีสนามแม่เหล็กทั่วทั้งดาว บรรยากาศส่วนใหญ่จึงสูญหาย ความกดอากาศต่ำมาก น้ำเหลวคงอยู่ได้ยาก", correct: true }
      - { id: b, text: "ดาวอังคารอยู่ใกล้ดวงอาทิตย์เกินไป น้ำจึงระเหยหมด", feedback: "ดาวอังคารอยู่ไกลดวงอาทิตย์กว่าโลก (1.52 AU) จึงเย็นกว่าโลก" }
      - { id: c, text: "ดาวอังคารเป็นดาวเคราะห์แก๊ส ไม่มีพื้นผิว", feedback: "ดาวอังคารเป็นดาวเคราะห์หินที่มีพื้นผิวแข็ง" }
      - { id: d, text: "ดาวอังคารโคจรเป็นวงกลมพอดี", feedback: "รูปร่างวงโคจรไม่ใช่สาเหตุหลัก และวงโคจรดาวอังคารรีกว่าโลกเล็กน้อย" }
    hints:
      - "นอกจากระยะห่าง ดาวเคราะห์ที่เอื้อต่อชีวิตต้องมีอะไรอีก"
      - "บรรยากาศและสนามแม่เหล็กช่วยรักษาน้ำไว้อย่างไร"
    solution: "อยู่ในเขตเอื้อต่อชีวิตอย่างเดียวไม่พอ ดาวอังคารมีมวลราวหนึ่งในสิบของโลกและไม่มีสนามแม่เหล็กทั่วทั้งดาว ลมสุริยะจึงพัดบรรยากาศออกไปเรื่อย ๆ ความกดอากาศต่ำ น้ำเหลวระเหยหรือแข็งตัวง่าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.solar-system.p011
    topics: [earthscience.astronomy.solar-system]
    difficulty: 4
    type: numeric
    stem: "โลกโคจรรอบดวงอาทิตย์รัศมี $1.496 \\times 10^{11}$ m คาบ $3.156 \\times 10^{7}$ s ใช้ $T^2 = \\dfrac{4\\pi^2}{GM}a^3$ และ $G = 6.674 \\times 10^{-11}\\ \\mathrm{N\\,m^2/kg^2}$ หามวลของดวงอาทิตย์ เป็นหน่วย $\\times 10^{30}$ kg"
    answer: { value: 1.99, tolerance: 0.02, unit: "×10³⁰ kg" }
    misconceptions:
      - { match: 0.0504, feedback: "ลืมคูณ $4\\pi^2 \\approx 39.5$" }
    hints:
      - "จัดสมการ $M = \\dfrac{4\\pi^2 a^3}{G T^2}$"
      - "$a^3 \\approx 3.348 \\times 10^{33}\\ \\mathrm{m^3}$ และ $T^2 \\approx 9.960 \\times 10^{14}\\ \\mathrm{s^2}$"
    solution: "$M = \\dfrac{39.48 \\times 3.348 \\times 10^{33}}{6.674 \\times 10^{-11} \\times 9.960 \\times 10^{14}} \\approx 1.99 \\times 10^{30}$ kg วิธีเดียวกันใช้ชั่งมวลของดาวเคราะห์จากดวงจันทร์บริวาร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.solar-system.p012
    topics: [earthscience.astronomy.solar-system]
    difficulty: 4
