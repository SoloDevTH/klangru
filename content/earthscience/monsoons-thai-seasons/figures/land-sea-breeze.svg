<text x="292.0" y="160.0" text-anchor="start" font-size="12" fill="#b91c1c">อากาศร้อน</text>
<text x="292.0" y="176.0" text-anchor="start" font-size="12" fill="#b91c1c">ลอยขึ้น</text>
<rect x="385" y="10" width="360" height="300" fill="#1e293b" stroke="#334155"/>
<rect x="385" y="230" width="180.0" height="80" fill="#3b82f6"/>
<rect x="565.0" y="225" width="180.0" height="85" fill="#a16207"/>
