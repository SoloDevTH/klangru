problems:
- id: chinese.vocab.money-shopping.p001
  topics:
  - chinese.vocab.money-shopping
  difficulty: 1
  type: mcq
  stem: ลูกค้าชาวจีนชี้กระเป๋าแล้วถามว่า 这个多少钱？ (Zhège duōshao qián?) ลูกค้าถามเรื่องอะไร
  choices:
  - id: a
    text: มีกระเป๋ากี่ใบ
    feedback: ถามจำนวนใช้ 几个 หรือ 多少个 ไม่มี 钱
  - id: b
    text: กระเป๋าใบนี้ของใคร
    feedback: ถามเจ้าของใช้ 谁的
  - id: c
    text: ราคาของกระเป๋าใบนี้
    correct: true
    feedback: ถูก 多少钱 = กี่เงิน ราคาเท่าไร
  - id: d
    text: กระเป๋าใบนี้สีอะไร
    feedback: ถามสีใช้ 什么颜色
  hints:
  - 钱 qián = เงิน
  - 多少 = เท่าไร
  solution: 这个多少钱？ = **อันนี้ราคาเท่าไร**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.money-shopping.p002
  topics:
  - chinese.vocab.money-shopping
  difficulty: 1
  type: match
  stem: จับคู่คำกับความหมาย
  pairs:
  - left: 块 kuài
    right: หน่วยเงินในภาษาพูด (= 元)
  - left: 毛 máo
    right: หนึ่งในสิบของ 块 (= 角)
  - left: 贵 guì
    right: แพง
  - left: 便宜 piányi
    right: ถูก (ราคา)
  - left: 一共 yígòng
    right: ทั้งหมด รวม
  hints:
  - 块 毛 เป็นคำพูด 元 角 เป็นคำเขียน
  - 贵 กับ 便宜 เป็นคู่ตรงข้าม
  solution: 块 = 元 · 毛 = 角 (0.1 หยวน) · 贵 แพง · 便宜 ถูก · 一共 ทั้งหมด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.money-shopping.p003
  topics:
  - chinese.vocab.money-shopping
  difficulty: 2
  type: hanzi
  stem: เขียนอักษร 钱 (qián) ที่แปลว่า เงิน ตามลำดับขีด
  character: 钱
  pinyin: qián
  meaning: เงิน
  hints:
  - 钱 = 钅 (โลหะ 5 ขีด) ทางซ้าย + 戋 (5 ขีด) ทางขวา รวม 10 ขีด
  - เขียน 钅 ให้เสร็จก่อน ขีดสุดท้ายของ 钅 เป็นขีดตั้งที่หักขึ้น
  solution: '钅: 撇 → 横 → 横 → 横 → 竖提 แล้ว 戋: 横 → 横 → 斜钩 → 撇 → 点 รวม 10 ขีด (เงินสมัยก่อนเป็นเหรียญโลหะ)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.money-shopping.p004
  topics:
  - chinese.vocab.money-shopping
  difficulty: 2
  type: mcq
  stem: ป้ายราคาเขียนว่า ¥8.50 แม่ค้าพูดราคานี้ว่าอย่างไร
  choices:
  - id: a
    text: 八块五十
    feedback: 50 毛 ไม่มีจริง 0.50 หยวนคือ 5 毛
  - id: b
    text: 八块五
    correct: true
    feedback: ถูก 8 块 กับ 5 毛 และละ 毛 ท้ายได้
  - id: c
    text: 八毛五
    feedback: = 0.85 หยวน (8 毛 5 分)
  - id: d
    text: 五块八
    feedback: = 5.80 หยวน สลับตัวเลข
  hints:
  - ส่วนหน้าจุดคือ 块 หลักแรกหลังจุดคือ 毛
  - หน่วยสุดท้ายละไว้ได้
  solution: ¥8.50 = 8 块 5 毛 พูดว่า **八块五** bā kuài wǔ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.money-shopping.p005
  topics:
  - chinese.vocab.money-shopping
  difficulty: 2
  type: numeric
  stem: เพื่อนชาวจีนบอกว่าน้ำดื่มขวดหนึ่งราคา 三块二 ราคานี้คือกี่หยวน
  answer:
    value: 3.2
    unit: หยวน
    tolerance: 0.01
  misconceptions:
  - match: 3.02
    feedback: 二 ที่ละไว้คือ 毛 (0.1) ไม่ใช่ 分 (0.01) ถ้าเป็น 3.02 ต้องพูด 三块零二
  - match: 32
    feedback: 块 คือหน่วยหยวน 三块 = 3 หยวน ไม่ใช่ 30
  hints:
  - 三块 = 3 หยวน
  - หลัง 块 ถ้ามีตัวเลขโดยไม่บอกหน่วย หมายถึง 毛
  solution: 三块二 = 3 块 2 毛 = $3 + 0.2 = 3.2$ หยวน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.money-shopping.p006
  topics:
  - chinese.vocab.money-shopping
  difficulty: 3
  type: numeric
  stem: นักเรียนไทยไปทัศนศึกษาที่คุนหมิง ดูป้ายราคาในภาพ ถ้าซื้อ 两斤苹果 และ 一个面包 ต้องจ่ายกี่หยวน
  figure: &id001
    src: price-tags.svg
    alt: 'ป้ายราคา 4 ป้าย: 苹果 แอปเปิล 一斤 ¥6.50 · 牛奶 นม 一盒 ¥3.80 · 面包 ขนมปัง 一个 ¥4.50 · T恤 เสื้อยืด 一件 ¥35.00 ใต้ภาพเขียนว่า ราคาสมมติ'
    caption: ป้ายราคาในร้านค้าที่คุนหมิง (ราคาสมมติ)
  answer:
    value: 17.5
    unit: หยวน
    tolerance: 0.01
  misconceptions:
  - match: 11
    feedback: 两斤 = 2 斤 คูณราคาแอปเปิลด้วย 2
  - match: 13
    feedback: อย่าลืมขนมปัง 1 ชิ้น
  hints:
  - 两斤 = 2 斤 แอปเปิลราคาต่อ 斤
  - คูณราคาแอปเปิลกับ 2 แล้วบวกราคาขนมปัง
  solution: แอปเปิล $2 \times 6.50 = 13.00$ หยวน · ขนมปัง 4.50 หยวน · รวม $13.00 + 4.50 = 17.50$ หยวน (十七块五)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.money-shopping.p007
  topics:
  - chinese.vocab.money-shopping
  difficulty: 3
  type: mcq
  stem: ลูกค้าชาวจีนที่ร้านเสื้อผ้าในประตูน้ำพูดว่า 太贵了！便宜一点儿吧。 หมายความว่าอะไร
  choices:
  - id: a
    text: แพงไป ลดหน่อยนะ
    correct: true
    feedback: ถูก 太…了 = เกินไป 便宜一点儿 = ถูกลงหน่อย 吧 = ชวนหรือขอ
  - id: b
    text: ถูกมาก เอาหลายตัว
    feedback: 太贵了 แปลว่า แพงเกินไป
  - id: c
    text: แพงนิดหน่อย แต่ซื้อ
    feedback: ไม่มีคำว่าซื้อ ลูกค้ากำลังต่อราคา
  - id: d
    text: ราคาเท่าไร
    feedback: ถามราคาใช้ 多少钱
  hints:
  - 贵 = แพง 太…了 = …เกินไป
  - 便宜 = ถูก 一点儿 = หน่อย
  solution: 太贵了！= **แพงเกินไป** · 便宜一点儿吧 = **ลดหน่อยนะ** (ถูกลงหน่อย)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.money-shopping.p008
  topics:
  - chinese.vocab.money-shopping
  difficulty: 3
  type: order
  stem: ร้านของฝากในสำเพ็ง เรียงบทสนทนาต่อราคาระหว่างลูกค้าชาวจีนกับแม่ค้าให้ถูกลำดับ (块 ในที่นี้หมายถึง บาท)
  items:
  - 'ลูกค้า: 这个多少钱？'
  - 'แม่ค้า: 一百五十块。'
  - 'ลูกค้า: 太贵了！便宜一点儿吧。'
  - 'แม่ค้า: 一百二十块，怎么样？'
  - 'ลูกค้า: 好，我要两个。'
  hints:
  - เริ่มจากลูกค้าถามราคา
  - ลูกค้าบอกว่าแพงก่อน แม่ค้าจึงลดราคา แล้วลูกค้าจึงตกลง
  solution: ถามราคา → บอกราคา 150 → ว่าแพงเกิน ขอลด → ลดเหลือ 120 (怎么样 = เป็นอย่างไร) → ตกลงซื้อ 2 อัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.money-shopping.p009
  topics:
  - chinese.vocab.money-shopping
  difficulty: 3
  type: mcq
  stem: ราคา 2 หยวนพอดี พูดว่าอย่างไร
  choices:
  - id: a
    text: 两毛
    feedback: 两毛 = 0.2 หยวน
  - id: b
    text: 二十块
    feedback: = 20 หยวน
  - id: c
    text: 两块
    correct: true
    feedback: ถูก 2 ที่อยู่ลำพังหน้าลักษณนาม 块 ใช้ 两
  - id: d
    text: 二块
    feedback: หน้าลักษณนามใช้ 两 ไม่ใช้ 二
  hints:
  - 块 ทำหน้าที่เหมือนลักษณนาม
  - ทบทวนกฎ 两 กับ 二 จากบทลักษณนาม
  solution: '**两块** liǎng kuài (เช่นเดียวกับ 两个 两本)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.money-shopping.p010
  topics:
  - chinese.vocab.money-shopping
  difficulty: 3
  type: numeric
  stem: ร้านขายของในเยาวราชบอกนักท่องเที่ยวชาวจีนว่า 一个三百块 (หมายถึง 300 บาท) ถ้าอัตราแลกเปลี่ยนสมมติว่า 1 หยวน = 5 บาท ราคานี้คิดเป็นกี่หยวน
  answer:
    value: 60
    unit: หยวน
  misconceptions:
  - match: 1500
    feedback: แปลงบาทเป็นหยวนต้องหาร 5 ไม่ใช่คูณ
  - match: 300
    feedback: 块 ในประโยคนี้หมายถึงบาท ต้องแปลงเป็นหยวนก่อน
  hints:
  - ในประเทศไทยคนจีนมักใช้ 块 เรียกบาท
  - 1 หยวน = 5 บาท ดังนั้นจำนวนหยวน = จำนวนบาท ÷ 5
  solution: $300 \div 5 = 60$ หยวน (อัตรานี้เป็นอัตราสมมติ อัตราจริงเปลี่ยนทุกวัน)
  license: CC-BY-SA-4.0
  ai_assisted: true
