    ai_assisted: true

  - id: biology.humans.circulatory-system.p013
    topics: [biology.humans.circulatory-system]
    difficulty: 4
    type: numeric
    stem: "หัวใจห้องล่างซ้ายบีบเลือดออกครั้งละ 70 มิลลิลิตร และเต้น 75 ครั้งต่อนาที หัวใจส่งเลือดออกไปได้กี่ลิตรต่อนาที"
    answer: { value: 5.25, tolerance: 0.05, unit: L/min }
    hints:
      - "ปริมาตรต่อนาที = ปริมาตรต่อครั้ง × จำนวนครั้งต่อนาที"
      - "1 ลิตร = 1,000 มิลลิลิตร"
    misconceptions:
      - { match: 5250, feedback: "ได้ 5,250 มิลลิลิตรแล้ว แต่โจทย์ถามเป็นลิตร ต้องหารด้วย 1,000" }
      - { match: 0.93, feedback: "นำ 70 หารด้วย 75 ต้องคูณกัน" }
    solution: "ปริมาตรต่อนาที $= 70 \\times 75 = 5{,}250$ มิลลิลิตร $= 5.25$ ลิตรต่อนาที ใกล้เคียงกับปริมาณเลือดทั้งตัว (ราว 5 ลิตร) เลือดจึงไหลผ่านหัวใจครบรอบในเวลาราว 1 นาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.circulatory-system.p014
    topics: [biology.humans.circulatory-system]
    difficulty: 4
    type: mcq
    stem: "พนักงานขายของที่ต้องยืนนาน ๆ ทั้งวันมักมีขาบวมตอนเย็น และแพทย์แนะนำให้ขยับขาเดินเป็นระยะ ข้อใดอธิบายเหตุผลได้ดีที่สุด"
    choices:
      - { id: a, text: "เลือดในหลอดเลือดดำที่ขามีแรงดันต่ำ การหดตัวของกล้ามเนื้อขาช่วยบีบหลอดเลือดดำ และลิ้นกันไม่ให้เลือดไหลย้อน เลือดจึงกลับขึ้นหัวใจได้ดี", correct: true }
      - { id: b, text: "การเดินทำให้หลอดเลือดแดงที่ขาบีบตัวแทนหัวใจ", feedback: "ปัญหาอยู่ที่การไหลกลับของเลือดดำ ไม่ใช่หลอดเลือดแดง" }
      - { id: c, text: "การยืนทำให้หัวใจหยุดส่งเลือดไปที่ขา", feedback: "หัวใจยังส่งเลือดไปตามปกติ แต่เลือดไหลกลับขึ้นมายาก" }
      - { id: d, text: "หลอดเลือดฝอยที่ขามีลิ้นมากเกินไป", feedback: "หลอดเลือดฝอยไม่มีลิ้น ลิ้นพบในหลอดเลือดดำ" }
    hints:
      - "เลือดที่ขาต้องไหลขึ้นสวนแรงโน้มถ่วงกลับหัวใจทางหลอดเลือดชนิดใด"
      - "หลอดเลือดชนิดนั้นมีโครงสร้างอะไรที่กันการไหลย้อน"
    solution: "หลอดเลือดดำมีแรงดันต่ำ เลือดที่ขาจึงไหลกลับยากเมื่อยืนนิ่ง ๆ เมื่อขยับขา กล้ามเนื้อจะบีบหลอดเลือดดำ และลิ้นในหลอดเลือดดำกันไม่ให้เลือดไหลย้อนลง เลือดจึงกลับสู่หัวใจได้ดีขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.circulatory-system.p015
    topics: [biology.humans.circulatory-system]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "คุณพ่อชอบกินอาหารรสเค็มจัด สูบบุหรี่ และไม่ค่อยออกกำลังกาย ข้อใดเป็นคำแนะนำที่ช่วยดูแลระบบหมุนเวียนเลือดของคุณพ่อได้ (เลือกได้หลายข้อ)"
    choices:
      - { id: a, text: "ลดการเติมน้ำปลาและซอสปรุงรส", correct: true }
      - { id: b, text: "เลิกสูบบุหรี่ โดยขอคำปรึกษาจากบุคลากรสาธารณสุข", correct: true }
      - { id: c, text: "เดินเร็วหรือปั่นจักรยานสม่ำเสมอ", correct: true }
      - { id: d, text: "กินอาหารทอดทุกมื้อเพื่อให้มีแรง", feedback: "อาหารไขมันสูงทุกมื้อทำให้ไขมันพอกในหลอดเลือดได้ง่าย" }
      - { id: e, text: "ไม่ต้องตรวจสุขภาพถ้ายังไม่มีอาการ", feedback: "โรคความดันโลหิตสูงมักไม่มีอาการในช่วงแรก การตรวจสุขภาพช่วยให้พบเร็ว" }
    hints:
      - "เกลือ บุหรี่ และการไม่ออกกำลังกาย มีผลต่อหัวใจและหลอดเลือด"
      - "เลือกข้อที่ลดปัจจัยเสี่ยงเหล่านั้น"
    solution: "ลดอาหารเค็ม เลิกบุหรี่ (ปรึกษาบุคลากรสาธารณสุขได้) และออกกำลังกายสม่ำเสมอ ช่วยลดความเสี่ยงโรคหัวใจและหลอดเลือด ส่วนอาหารทอดทุกมื้อเพิ่มความเสี่ยง และควรตรวจสุขภาพแม้ยังไม่มีอาการ"
