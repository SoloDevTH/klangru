id: health.sport.tactics
subject: health
title: { th: "กลวิธีการรุกและการป้องกันในกีฬา", en: "Attacking and defending tactics in sport" }
summary: หลักการรุก (ความกว้าง ความลึก ส่งแล้ววิ่ง สร้างจำนวนได้เปรียบ) และการป้องกัน (กดดัน ระวังหลัง ประกบตัวต่อตัว โซน) ในกีฬาประเภททีม การวางแผนตามสถานการณ์ และการอ่านแผนภาพการเล่น
difficulty: 3.5
minutes: 30
prerequisites: [health.movement.skill-learning-teamwork]
encompasses:
  - { id: health.movement.skill-learning-teamwork, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: หลักการรุกในฟุตซอล
    src: attack-principles.svg
    alt: "ครึ่งสนามฟุตซอลฝั่งรุก ประตูอยู่ด้านบน ฝ่ายรุก A ครองลูกอยู่กลางด้านล่าง B และ C ยืนชิดเส้นข้างซ้ายและขวา D อยู่ลึกใกล้เขตโทษ ผู้ป้องกันสามคนยืนอยู่ระหว่างพวกเขา เส้นประจาก A ไป B คือการส่งลูก เส้นทึบจาก A เข้าช่องว่างตรงกลางคือการวิ่ง ข้อความด้านขวา ความกว้าง B กับ C ยืนชิดเส้นข้างทั้งสองฝั่ง ดึงผู้ป้องกันให้แยกกัน เกิดช่องว่างตรงกลาง ความลึก D อยู่ลึกใกล้ประตู A อยู่ข้างหลัง มีตัวเลือกส่งทั้งหน้าและหลัง ส่งแล้ววิ่ง A ส่งให้ B แล้ววิ่งเข้าช่องว่าง รอรับลูกคืน ตัวช่วย ผู้เล่นใกล้ลูกอยู่ในมุมที่รับลูกได้ ไม่ยืนบังกันหลังผู้ป้องกัน"
  - type: figure
    title: ประกบตัวต่อตัวกับโซน 2-3
    src: defense-compare.svg
    alt: "ครึ่งสนามบาสเกตบอลสองภาพ ฝ่ายรุก 5 คน หมายเลข 1 ถือลูกอยู่ด้านหน้า 2 และ 3 อยู่สองข้าง 4 และ 5 อยู่มุมใกล้เส้นหลัง ภาพซ้าย ประกบตัวต่อตัว ผู้ป้องกันแต่ละคนยืนระหว่างคู่แข่งของตนกับแป้น มีเส้นประเชื่อมกับคู่แข่ง 1 คน ภาพขวา โซน 2-3 สนามแบ่งเป็นพื้นที่สี ผู้ป้องกัน 2 คนอยู่แถวหน้า 3 คนอยู่แถวหลังใกล้แป้น แต่ละคนดูแลพื้นที่สีของตน กรอบสีส้มคือเขตใต้แป้น"
  - type: worked-example
    title: สร้าง 2 ต่อ 1
    problem: "ในฟุตซอล นนท์พาลูกเข้าหาผู้ป้องกัน 1 คน โดยมีเพื่อนวิ่งขนานอยู่ทางขวาห่าง 4 เมตร และไม่มีผู้ป้องกันคนอื่นอยู่ใกล้ นนท์ควรทำอย่างไร"
    steps:
      - text: "นี่คือสถานการณ์ 2 ต่อ 1 ฝ่ายรุกได้เปรียบ 1 คน"
      - text: "นนท์พาลูกตรงเข้าหาผู้ป้องกันเพื่อดึงให้เขาเข้ามาหา"
        why: "ถ้าผู้ป้องกันอยู่ตรงกลางระหว่างสองคน เขาจะปิดได้ทั้งการส่งและการพาลูก การดึงให้ตัดสินใจทำให้เกิดช่อง"
      - text: "ถ้าผู้ป้องกันเข้ามาหานนท์ ให้ส่งให้เพื่อนที่ว่างทางขวา ถ้าผู้ป้องกันไปปิดเพื่อน ให้นนท์พาลูกต่อหรือยิงเอง"
      - text: "หลังส่ง นนท์วิ่งต่อเข้าหาประตูเพื่อพร้อมรับลูกคืน"
    answer: "ดึงผู้ป้องกันเข้าหาตัว แล้วเลือกส่งหรือพาลูกต่อตามที่ผู้ป้องกันตัดสินใจ และวิ่งต่อหลังส่ง"
  - { type: check, problem: health.sport.tactics.p002, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: worked-example
    title: เลือกทางส่งจากแผนภาพบนตาราง
    problem: "บนตารางช่องละ 1 เมตร ผู้ครองลูกอยู่ที่ (2, 2) เพื่อน P อยู่ที่ (8, 10) และมีผู้ป้องกันห่าง 4 เมตร เพื่อน Q อยู่ที่ (5, 6) และมีผู้ป้องกันห่าง 1 เมตร ควรส่งให้ใคร"
    steps:
      - text: "ระยะส่งให้ P: แนวนอน 6 แนวตั้ง 8 ได้ $\\sqrt{6^2 + 8^2} = 10$ เมตร"
      - text: "ระยะส่งให้ Q: แนวนอน 3 แนวตั้ง 4 ได้ $\\sqrt{3^2 + 4^2} = 5$ เมตร"
      - text: "Q ใกล้กว่า แต่มีผู้ป้องกันห่างเพียง 1 เมตร ส่วน P ไกลกว่าแต่ว่างกว่า"
        why: "ระยะสั้นอย่างเดียวไม่พอ ต้องดูด้วยว่าผู้รับมีเวลาควบคุมลูกหรือไม่"
      - text: "ถ้าทางส่งไป P ไม่มีผู้ป้องกันขวาง ส่งให้ P ดีกว่า หรือรอจังหวะให้ Q เคลื่อนที่หาที่ว่างก่อน"
    answer: "ส่งให้ P ซึ่งว่างกว่า (10 เมตร) ถ้าทางส่งโล่ง เพราะ Q ถูกประกบใกล้"
  - { type: check, problem: health.sport.tactics.p010 }
glossary:
  - { term: กลวิธี, definition: "แผนการเล่นที่ทีมตกลงกันว่าจะรุกและป้องกันอย่างไรให้ได้เปรียบคู่แข่ง" }
  - { term: ความกว้าง, definition: "การยืนกระจายใช้สนามทั้งกว้างเพื่อดึงผู้ป้องกันให้แยกกันและเปิดช่องตรงกลาง" }
  - { term: ส่งแล้ววิ่ง, definition: "การส่งลูกให้เพื่อนแล้ววิ่งเข้าที่ว่างทันทีเพื่อรับลูกคืน (give-and-go)" }
  - { term: ประกบตัวต่อตัว, definition: "การป้องกันที่ผู้ป้องกันแต่ละคนรับผิดชอบคู่แข่ง 1 คน" }
  - { term: ป้องกันพื้นที่ (โซน), definition: "การป้องกันที่ผู้ป้องกันแต่ละคนดูแลพื้นที่ของตน เช่น โซน 2-3 ในบาสเกตบอล" }
flashcards:
  - { front: "หลักการรุก", back: "ความกว้าง ความลึก ตัวช่วย เคลื่อนที่หาที่ว่าง สร้างจำนวนได้เปรียบ เจาะเข้าหาเป้าหมาย" }
  - { front: "หลักการป้องกัน", back: "ชะลอและกดดัน ระวังหลัง ยืนระหว่างคู่แข่งกับประตู ความกระชับ สื่อสาร" }
  - { front: "โซนเสียเปรียบเมื่อใด", back: "เมื่อคู่แข่งยิงไกลแม่นหรือส่งเร็วหาช่องรอยต่อของพื้นที่" }
  - { front: "นำอยู่และเหลือเวลาน้อย", back: "ครองลูกด้วยการส่งที่ปลอดภัย และป้องกันแบบกระชับเมื่อเสียลูก" }
