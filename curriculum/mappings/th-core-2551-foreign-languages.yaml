# หัวข้อภาษาอังกฤษและภาษาจีนในคลังที่สอนเนื้อหาของตัวชี้วัดภาษาต่างประเทศ
# ตัวชี้วัดเป็นทักษะการสื่อสาร ส่วนไวยากรณ์และคำศัพท์อยู่ในสาระการเรียนรู้แกนกลาง (เอกสาร สพฐ. 2551) หัวข้อไวยากรณ์จึงครอบคลุมได้เพียงบางส่วน
# ตัวชี้วัดเขียนไว้สำหรับภาษาต่างประเทศทั่วไป ตัวอย่างในสาระแกนกลางเป็นภาษาอังกฤษ การจับคู่หัวข้อภาษาจีนจึงเทียบตามเนื้อหาที่เทียบเท่า
framework: th-core-2551-foreign-languages
mappings:
  - topic: english.grammar.present-simple
    indicators: ["ต 1.1 ม.1/4", "ต 1.1 ม.2/4", "ต 1.1 ม.3/4", "ต 1.1 ม.4-6/4"]
    coverage: partial
    note: "สาระการเรียนรู้แกนกลางของตัวชี้วัดเหล่านี้ระบุ Tenses: present simple ไว้ หัวข้อสอนเฉพาะรูปและการใช้ present simple ไม่ได้สอนการจับใจความจากการฟังและอ่าน"
  - topic: english.grammar.past-simple
    indicators: ["ต 1.1 ม.1/4", "ต 1.1 ม.2/4", "ต 1.1 ม.3/4", "ต 1.1 ม.4-6/4"]
    coverage: partial
    note: "สาระการเรียนรู้แกนกลางระบุ Tenses: past simple หัวข้อสอนเฉพาะไวยากรณ์ past simple"
  - topic: english.grammar.present-perfect
    indicators: ["ต 1.1 ม.2/4", "ต 1.1 ม.3/4", "ต 1.1 ม.4-6/4"]
    coverage: partial
    note: "สาระการเรียนรู้แกนกลางตั้งแต่ ม.2 ระบุ Tenses: present perfect หัวข้อสอนเฉพาะไวยากรณ์ present perfect"
  - topic: chinese.pinyin.tones
    indicators: ["ต 1.1 ป.1/2", "ต 1.1 ป.2/2", "ต 2.2 ป.1/1", "ต 2.2 ป.2/1"]
    coverage: partial
    note: "สำหรับภาษาจีน พินอินทำหน้าที่ตัวอักษรและเสียง หัวข้อสอนวรรณยุกต์ การวางเครื่องหมาย และเทียบพยัญชนะต้นกับเสียงวรรณยุกต์กับภาษาไทย ยังไม่สอนสระ (韵母) ครบ และไม่ได้ฝึกอ่านออกเสียงประโยค"
  - topic: chinese.hanzi.numbers
    indicators: ["ต 1.3 ป.1/1", "ต 1.3 ป.2/1", "ต 1.3 ป.3/1", "ต 1.3 ป.4/1"]
    coverage: partial
    note: "สาระการเรียนรู้แกนกลางของการพูดให้ข้อมูลเกี่ยวกับตนเองและเรื่องใกล้ตัวมีจำนวน 1-20 (ป.1) ถึง 1-100 (ป.4) หัวข้อสอนเฉพาะการอ่าน เขียน และพูดตัวเลขถึง 100 ไม่ได้สอนการให้ข้อมูลเรื่องอื่น"
  - topic: english.grammar.be-have-there
    indicators: [ต 1.3 ป.1/1, ต 1.3 ป.2/1, ต 1.3 ป.3/1]
    coverage: partial
    note: สอนโครงสร้างที่ใช้ให้ข้อมูลเกี่ยวกับตนเองและเรื่องใกล้ตัว (ชื่อ อายุ ครอบครัว สิ่งของในห้อง) และทดสอบในรูปเขียน แต่ตัวชี้วัดเป็นการพูด ซึ่งแอปตรวจไม่ได้
  - topic: english.grammar.can-modals
    indicators: [ต 1.2 ป.4/2, ต 1.2 ป.5/2, ต 1.2 ป.6/2, ต 1.2 ม.1/2, ต 1.2 ม.2/2, ต 1.2 ม.3/2, ต 1.2 ม.4-6/2]
    coverage: partial
    note: สอนและทดสอบรูปภาษาของคำขอร้อง (Can/Could you) คำขออนุญาต (Can/May I) และคำแนะนำ (should) ในบทสนทนาที่เขียน ส่วนคำสั่งอยู่ในหัวข้อ classroom-language แต่ไม่ได้ฝึกพูดโต้ตอบจริง
  - topic: english.grammar.connectors
    indicators: [ต 1.1 ม.1/4, ต 1.1 ม.2/4]
    coverage: partial
    note: มีโจทย์ระบุใจความสำคัญและตอบคำถามเชิงลำดับจากข้อความที่อ่าน แต่ไม่ได้ฝึกการฟัง และยังไม่มีนิทานหรือเรื่องสั้นเต็มเรื่อง
  - topic: english.grammar.present-continuous
    indicators: [ต 1.1 ม.1/4]
    coverage: partial
    note: มีโจทย์ระบุใจความสำคัญและตอบคำถามจากข้อความที่อ่าน (ข้อความ LINE) แต่ไม่ได้ฝึกการฟัง และยังไม่มีนิทานหรือเรื่องสั้น ซึ่งควรอยู่ในหัวข้อ english.reading.main-idea
  - topic: english.grammar.questions
    indicators: [ต 1.1 ป.3/4, ต 1.2 ป.4/4]
    coverage: full
    note: ตัวชี้วัดให้ฟังหรืออ่านก็ได้ มีโจทย์ตอบคำถามจากประโยค บทสนทนา และนิทานสั้นที่อ่าน
  - topic: english.grammar.questions
    indicators: [ต 1.1 ป.1/4, ต 1.1 ป.2/4, ต 1.1 ป.4/4, ต 1.2 ป.1/4, ต 1.2 ป.2/4, ต 1.2 ป.3/4]
    coverage: partial
    note: ตัวชี้วัดเป็นการตอบคำถามจากการฟัง แอปไม่มีเสียง จึงฝึกจากการอ่านประโยค บทสนทนา และภาพแทน
  - topic: english.phonics.alphabet-sounds
    indicators: [ต 2.2 ป.1/1, ต 2.2 ป.2/1]
    coverage: full
  - topic: english.phonics.alphabet-sounds
    indicators: [ต 1.1 ป.1/2, ต 1.1 ป.2/2]
    coverage: partial
    note: สอนและทดสอบการระบุตัวอักษรและเสียง และการสะกดคำง่าย ๆ แต่แอปไม่มีเสียงและฟังเสียงผู้เรียนไม่ได้ จึงตรวจการอ่านออกเสียงไม่ได้
  - topic: english.speaking.greetings-introductions
    indicators: [ต 1.2 ป.1/1, ต 1.2 ป.2/1, ต 1.2 ป.3/1, ต 2.1 ป.1/1, ต 2.1 ป.2/1]
    coverage: partial
    note: สอนบทสนทนาสั้นตามแบบ (ทักทาย แนะนำตัว ขอบคุณ ขอโทษ บอกลา) และทดสอบการเลือกและเขียนคำตอบ แต่ตรวจการพูดโต้ตอบจริงไม่ได้
  - topic: english.vocabulary.classroom-language
    indicators: [ต 1.1 ป.1/1, ต 1.1 ป.2/1, ต 1.2 ป.1/2, ต 1.2 ป.2/2, ต 1.2 ป.3/2, ต 4.1 ป.1/1, ต 4.1 ป.2/1, ต 4.1 ป.3/1]
    coverage: partial
    note: สอนความหมายของคำสั่งและคำขอร้องในห้องเรียน และทดสอบการทำตามคำสั่งจากข้อความและภาพ แต่แอปไม่มีเสียงให้ฟังคำสั่งจริง
  - topic: english.grammar.adjectives-comparison
    indicators: [ต 1.2 ม.3/4, ต 1.2 ม.4-6/4]
    coverage: partial
    note: ส่วนการเขียนเปรียบเทียบสิ่งของ คน และสถานที่จากข้อมูลที่อ่าน (กราฟราคา ภาพความสูง) ครบ และมีตัวอย่างแสดงความคิดเห็นพร้อมเหตุผล แต่ตัวชี้วัดต้องการทั้งพูดและเขียน แอปไม่มีเสียงจึงไม่ได้ฝึกพูด และการขอข้อมูลกับการอธิบายเป็นเรื่องของหัวข้ออื่น
  - topic: english.grammar.future-forms
    indicators: [ต 1.1 ม.1/4, ต 1.1 ม.2/4]
    coverage: partial
    note: มีตัวอย่างและโจทย์อ่านบทสนทนาเรื่องแผนการ แล้วระบุหัวข้อเรื่อง ใจความสำคัญ และตอบคำถาม แต่ตัวชี้วัดต้องการทั้งการฟังและการอ่าน แอปไม่มีเสียง และยังไม่มีนิทานหรือเรื่องสั้น
  - topic: english.grammar.nouns-articles
    indicators: [ต 2.2 ป.3/1]
    coverage: partial
    note: เทียบภาษาไทยที่ไม่มีคำนำหน้านามและใช้ลักษณนาม กับภาษาอังกฤษที่มี a/an/the และเติม s รวมทั้งเสียง s ท้ายคำ (/s/ /z/ /ɪz/) ที่ภาษาไทยไม่มี และการเลือก a/an ตามเสียง แต่ไม่ครอบคลุมความต่างของเสียงตัวอักษรและประโยคทั้งหมด (อยู่ใน english.phonics.reading-aloud) และแอปไม่มีเสียงให้ฟังเปรียบเทียบ
  - topic: english.grammar.prepositions
    indicators: [ต 1.3 ป.4/2]
    coverage: partial
    note: มีโจทย์อ่านประโยคบอกตำแหน่งแล้วเลือกภาพ อ่านข้อความแล้วบอกความสัมพันธ์ของสิ่งของในห้อง และบอกตำแหน่งบนแผนที่ด้วยการเขียน แต่ตัวชี้วัดให้พูดหรือวาดภาพ ซึ่งแอปตรวจไม่ได้ และไม่มีเสียงให้ฟัง
  - topic: english.phonics.reading-aloud
    indicators: [ต 2.2 ป.3/1, ต 2.2 ป.4/1]
    coverage: full
    note: ตัวชี้วัดให้บอกความแตกต่าง บทเรียนและโจทย์เทียบเสียงอังกฤษกับไทยระดับคำ กลุ่มคำ ประโยค และข้อความ (การเน้นเสียงแทนวรรณยุกต์ ทำนองเสียงของประโยค พยัญชนะควบต้นคำและท้ายคำ การเชื่อมเสียง) ส่วนเสียงตัวอักษรสอนใน english.phonics.alphabet-sounds ซึ่งเป็น prerequisite
  - topic: english.phonics.reading-aloud
    indicators: [ต 1.1 ป.3/2, ต 1.1 ป.4/2, ต 1.1 ป.5/2, ต 1.1 ป.6/2, ต 1.1 ม.1/2, ต 1.1 ม.2/2, ต 1.1 ม.3/2, ต 1.1 ม.4-6/2]
    coverage: partial
    note: สอนหลักการอ่านออกเสียง (นับพยางค์ เน้นเสียงในคำและประโยค จังหวะ chant กลอน ทำนองเสียง เชื่อมเสียง แบ่งกลุ่มคำในประกาศ โฆษณา และข่าวสั้น) และทดสอบด้วยสัญลักษณ์แทนเสียง แต่แอปไม่มีเสียงและบันทึกหรือตรวจการอ่านออกเสียงจริงไม่ได้ และไม่มีบทละครสั้น (skit) ตาม ม.4-6/2
  - topic: english.speaking.everyday-conversations
    indicators: [ต 1.2 ป.4/1, ต 1.2 ป.5/1, ต 1.2 ป.6/1, ต 1.2 ม.1/1, ต 1.2 ม.2/1, ต 1.2 ม.3/1, ต 1.2 ม.4-6/1, ต 4.1 ป.4/1, ต 4.1 ป.5/1, ต 4.1 ป.6/1, ต 4.1 ม.1/1, ต 4.1 ม.2/1, ต 4.1 ม.3/1, ต 4.1 ม.4-6/1]
    coverage: partial
    note: ฝึกเลือกและเขียนคำตอบโต้ตอบในบทสนทนาระหว่างบุคคล (ขอยืม ขอให้พูดซ้ำ ปฏิเสธสุภาพ ถามกลับ) แต่เป็นการตอบทีละข้อในรูปเขียน แอปไม่มีเสียงและไม่มีคู่สนทนาจริง จึงไม่ได้ฝึกพูดโต้ตอบต่อเนื่อง
  - topic: english.vocabulary.self-family-numbers
    indicators: [ต 1.3 ป.4/1]
    coverage: full
    note: ตัวชี้วัดให้พูดหรือเขียนก็ได้ มีตัวอย่างและโจทย์เขียนประโยคให้ข้อมูลเรื่องตนเอง ครอบครัว อายุ และสีที่ชอบ
  - topic: english.vocabulary.self-family-numbers
    indicators: [ต 1.1 ป.1/3, ต 1.1 ป.2/3, ต 1.3 ป.1/1, ต 1.3 ป.2/1, ต 1.3 ป.3/1]
    coverage: partial
    note: มีโจทย์เลือกภาพให้ตรงกับคำและกลุ่มคำ (a big red ball) และดูภาพแล้วตอบ แต่ตัวชี้วัดเป็นการฟัง แอปไม่มีเสียง ผู้เรียนจึงอ่านคำแทนการฟัง
