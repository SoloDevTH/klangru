<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="sans-serif" font-size="14">
  <title>ระยะเวลาคุ้มครองทรัพย์สินทางปัญญาแต่ละประเภทตามกฎหมายไทย</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="820" height="400" fill="#ffffff"/>
  <text x="410.0" y="26.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">ระยะเวลาคุ้มครอง (ช่องละ 5 ปี)</text>
  <line x1="250.0" y1="40.0" x2="250.0" y2="330.0" stroke="#e5e7eb" stroke-width="1"/>
  <text x="250.0" y="348.0" text-anchor="middle" fill="#6b7280" font-size="11.5">0</text>
  <line x1="320.0" y1="40.0" x2="320.0" y2="330.0" stroke="#e5e7eb" stroke-width="1"/>
  <text x="320.0" y="348.0" text-anchor="middle" fill="#6b7280" font-size="11.5">5</text>
  <line x1="390.0" y1="40.0" x2="390.0" y2="330.0" stroke="#e5e7eb" stroke-width="1"/>
  <text x="390.0" y="348.0" text-anchor="middle" fill="#6b7280" font-size="11.5">10</text>
  <line x1="460.0" y1="40.0" x2="460.0" y2="330.0" stroke="#e5e7eb" stroke-width="1"/>
  <text x="460.0" y="348.0" text-anchor="middle" fill="#6b7280" font-size="11.5">15</text>
  <line x1="530.0" y1="40.0" x2="530.0" y2="330.0" stroke="#e5e7eb" stroke-width="1"/>
  <text x="530.0" y="348.0" text-anchor="middle" fill="#6b7280" font-size="11.5">20</text>
  <line x1="600.0" y1="40.0" x2="600.0" y2="330.0" stroke="#e5e7eb" stroke-width="1"/>
  <text x="600.0" y="348.0" text-anchor="middle" fill="#6b7280" font-size="11.5">25</text>
  <line x1="670.0" y1="40.0" x2="670.0" y2="330.0" stroke="#e5e7eb" stroke-width="1"/>
  <text x="670.0" y="348.0" text-anchor="middle" fill="#6b7280" font-size="11.5">30</text>
  <line x1="740.0" y1="40.0" x2="740.0" y2="330.0" stroke="#e5e7eb" stroke-width="1"/>
  <text x="740.0" y="348.0" text-anchor="middle" fill="#6b7280" font-size="11.5">35</text>
  <line x1="810.0" y1="40.0" x2="810.0" y2="330.0" stroke="#e5e7eb" stroke-width="1"/>
  <text x="810.0" y="348.0" text-anchor="middle" fill="#6b7280" font-size="11.5">40</text>
  <text x="240.0" y="74.0" text-anchor="end" fill="#1f2937" font-size="12.5">สิทธิบัตรการประดิษฐ์</text>
  <rect x="250.0" y="58.0" width="280.0" height="26.0" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="390.0" y="76.0" text-anchor="middle" fill="#1f2937" font-size="11.5">20 ปี นับแต่วันยื่นคำขอ ต่ออายุไม่ได้</text>
  <text x="240.0" y="120.0" text-anchor="end" fill="#1f2937" font-size="12.5">สิทธิบัตรการออกแบบผลิตภัณฑ์</text>
  <rect x="250.0" y="104.0" width="140.0" height="26.0" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="320.0" y="122.0" text-anchor="middle" fill="#1f2937" font-size="11.5">10 ปี นับแต่วันยื่นคำขอ</text>
  <text x="240.0" y="166.0" text-anchor="end" fill="#1f2937" font-size="12.5">อนุสิทธิบัตร</text>
  <rect x="250.0" y="150.0" width="84.0" height="26.0" rx="3" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="292.0" y="168.0" text-anchor="middle" fill="#1f2937" font-size="11.5">6 ปี</text>
  <rect x="334.0" y="150.0" width="28.0" height="26.0" rx="3" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="348.0" y="168.0" text-anchor="middle" fill="#1f2937" font-size="11.5">+2</text>
  <rect x="362.0" y="150.0" width="28.0" height="26.0" rx="3" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="376.0" y="168.0" text-anchor="middle" fill="#1f2937" font-size="11.5">+2</text>
  <text x="240.0" y="212.0" text-anchor="end" fill="#1f2937" font-size="12.5">เครื่องหมายการค้า</text>
  <rect x="250.0" y="196.0" width="140.0" height="26.0" rx="3" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="320.0" y="214.0" text-anchor="middle" fill="#1f2937" font-size="11.5">10 ปี</text>
  <rect x="390.0" y="196.0" width="140.0" height="26.0" rx="3" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="460.0" y="214.0" text-anchor="middle" fill="#1f2937" font-size="11.5">ต่ออายุ 10 ปี</text>
  <rect x="530.0" y="196.0" width="140.0" height="26.0" rx="3" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="600.0" y="214.0" text-anchor="middle" fill="#1f2937" font-size="11.5">ต่อได้เรื่อย ๆ …</text>
  <text x="240.0" y="258.0" text-anchor="end" fill="#1f2937" font-size="12.5">ลิขสิทธิ์ (ผู้สร้างสรรค์เป็นบุคคล)</text>
  <rect x="250.0" y="242.0" width="200.0" height="26.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="350.0" y="260.0" text-anchor="middle" fill="#1f2937" font-size="11.5">ตลอดชีวิตผู้สร้างสรรค์ *</text>
  <rect x="450.0" y="242.0" width="360.0" height="26.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="630.0" y="260.0" text-anchor="middle" fill="#1f2937" font-size="11.5">+ 50 ปีหลังเสียชีวิต</text>
  <text x="240.0" y="304.0" text-anchor="end" fill="#1f2937" font-size="12.5">สิ่งบ่งชี้ทางภูมิศาสตร์</text>
  <rect x="250.0" y="288.0" width="560.0" height="26.0" rx="3" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="530.0" y="306.0" text-anchor="middle" fill="#1f2937" font-size="11.5">คุ้มครองตราบที่สินค้ายังมีคุณลักษณะตามที่ขึ้นทะเบียน</text>
  <text x="410.0" y="372.0" text-anchor="middle" fill="#6b7280" font-size="12">* ช่วงชีวิตผู้สร้างสรรค์ยาวไม่แน่นอน แท่งส่วนนี้และส่วนที่เลยขอบไม่ได้วาดตามสเกล</text>
  <text x="410.0" y="392.0" text-anchor="middle" fill="#6b7280" font-size="12">ลิขสิทธิ์ไม่ต้องจดทะเบียน · สิทธิบัตร อนุสิทธิบัตร เครื่องหมายการค้า ต้องยื่นคำขอที่กรมทรัพย์สินทางปัญญา</text>
</svg>
