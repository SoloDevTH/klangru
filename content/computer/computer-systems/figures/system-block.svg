  <text x="765.0" y="218.3" font-size="13" text-anchor="middle" fill="#1f2937">เครื่องพิมพ์</text>
  <text x="765.0" y="235.9" font-size="13" text-anchor="middle" fill="#1f2937">มอเตอร์ หลอดไฟ</text>
  <rect x="250.0" y="320.0" width="170.0" height="80.0" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="335.0" y="347.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">หน่วยความจำหลัก</text>
  <text x="335.0" y="364.6" font-size="13" text-anchor="middle" fill="#1f2937">RAM (ไฟดับข้อมูลหาย)</text>
  <text x="335.0" y="382.1" font-size="13" text-anchor="middle" fill="#1f2937">ROM</text>
  <rect x="440.0" y="320.0" width="170.0" height="80.0" rx="6" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="525.0" y="347.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">หน่วยเก็บถาวร</text>
  <text x="525.0" y="364.6" font-size="13" text-anchor="middle" fill="#1f2937">SSD ฮาร์ดดิสก์</text>
  <text x="525.0" y="382.1" font-size="13" text-anchor="middle" fill="#1f2937">แฟลชไดรฟ์</text>
  <rect x="20.0" y="280.0" width="820.0" height="16.0" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="110.0" y="293.0" font-size="12" text-anchor="start" fill="#1f2937">บัส (ทางส่งข้อมูล ที่อยู่ และสัญญาณควบคุม)</text>
  <line x1="170.0" y1="205.0" x2="248.0" y2="205.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="612.0" y1="205.0" x2="688.0" y2="205.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="95.0" y1="262.0" x2="95.0" y2="279.0" stroke="#1f2937" stroke-width="2"/>
  <line x1="765.0" y1="262.0" x2="765.0" y2="279.0" stroke="#1f2937" stroke-width="2"/>
  <line x1="430.0" y1="262.0" x2="430.0" y2="279.0" stroke="#1f2937" stroke-width="2"/>
  <line x1="335.0" y1="297.0" x2="335.0" y2="318.0" stroke="#1f2937" stroke-width="2"/>
  <line x1="525.0" y1="297.0" x2="525.0" y2="318.0" stroke="#1f2937" stroke-width="2"/>
  <text x="209.0" y="197.0" font-size="12" text-anchor="middle" fill="#6b7280">ข้อมูลเข้า</text>
  <text x="650.0" y="197.0" font-size="12" text-anchor="middle" fill="#6b7280">ผลลัพธ์</text>
</svg>
