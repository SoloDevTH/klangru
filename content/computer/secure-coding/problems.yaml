    choices:
      - { id: a, text: 'ค่าเริ่มต้นของระบบควรปฏิเสธการเข้าถึงจนกว่าจะได้รับอนุญาต', correct: true }
      - { id: b, text: 'ให้สิทธิ์แก่แต่ละบัญชีเท่าที่หน้าที่ต้องใช้', correct: true }
      - { id: c, text: 'เมื่อการตรวจสิทธิ์เกิดข้อผิดพลาด ให้เปิดทางให้ผ่านเพื่อไม่รบกวนผู้ใช้', feedback: "หลักการที่ถูกต้องคือล้มเหลวอย่างปลอดภัย คือปฏิเสธเมื่อไม่แน่ใจ" }
      - { id: d, text: 'ใช้การป้องกันหลายชั้น ไม่พึ่งการป้องกันเพียงจุดเดียว', correct: true }
    hints:
      - "ค่าเริ่มต้นและการจัดการเมื่อผิดพลาดควรเลือกข้างความปลอดภัย"
      - "หลักการที่เกี่ยวกับการไม่พึ่งจุดเดียวและการให้สิทธิ์น้อยเป็นหลักที่ถูกต้อง"
    solution: "ค่าเริ่มต้นปฏิเสธ สิทธิ์น้อยที่สุด และป้องกันหลายชั้นเป็นหลักการที่ถูกต้อง ส่วนการเปิดให้ผ่านเมื่อผิดพลาดขัดกับการล้มเหลวอย่างปลอดภัย"
