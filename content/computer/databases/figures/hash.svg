  <text x="735.0" y="95.7" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">ค่าแฮช a71e…</text>
  <text x="20.0" y="170.0" font-size="16" text-anchor="start" fill="#1f2937" font-weight="bold" xml:space="preserve">ต้น</text>
