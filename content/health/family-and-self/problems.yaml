    pairs:
      - { left: "บ้านหนึ่งมีรถยนต์สองคัน อีกบ้านใช้รถจักรยานยนต์คันเดียว", right: "ด้านเศรษฐกิจ" }
      - { left: "บ้านหนึ่งนับถือศาสนาพุทธ อีกบ้านนับถือศาสนาอิสลาม", right: "ด้านสังคม" }
      - { left: "แม่ของเพื่อนเรียนจบปริญญา แม่ของเราเรียนจบชั้นประถม", right: "ด้านการศึกษา" }
    hints:
      - "เงินและทรัพย์สินเป็นเรื่องเศรษฐกิจ"
      - "ศาสนา ประเพณี และการอยู่ร่วมกับผู้อื่นเป็นเรื่องสังคม"
    solution: "ทรัพย์สิน → เศรษฐกิจ, ศาสนา → สังคม, ระดับที่เรียนจบ → การศึกษา ความต่างเหล่านี้ไม่ได้ทำให้ครอบครัวใดดีกว่ากัน"
