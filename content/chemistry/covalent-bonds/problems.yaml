  - id: chem.cov.p012
    topics: [chemistry.bonding.covalent]
    difficulty: 5
    type: numeric
    stem: "ข่าวการแช่อาหารทะเลด้วยฟอร์มาลีนเป็นเรื่องอันตราย ฟอร์มาลีนคือสารละลายฟอร์มาลดีไฮด์ ($\\mathrm{H_2CO}$) ซึ่งมีคาร์บอนเป็นอะตอมกลาง ต่อกับ H สองอะตอมและ O หนึ่งอะตอม เมื่อเขียนโครงสร้างให้ทุกอะตอมครบตามกฎออกเตต (H ครบ 2) ทั้งโมเลกุลมีคู่อิเล็กตรอนโดดเดี่ยวกี่คู่"
    answer: { value: 2, unit: คู่ }
    hints:
      - "นับเวเลนซ์อิเล็กตรอนรวม: H 1 × 2, C 4, O 6"
      - "ลองต่อพันธะเดี่ยวทั้งหมดก่อน แล้วตรวจว่าคาร์บอนครบ 8 หรือยัง ถ้ายังไม่ครบต้องเปลี่ยนพันธะหนึ่งเป็นพันธะคู่"
      - "เมื่อได้โครงสร้างที่ครบออกเตตแล้ว นำอิเล็กตรอนที่ไม่ได้อยู่ในพันธะมาหารด้วย 2"
    misconceptions:
      - { match: 3, feedback: "ดูเหมือนใช้พันธะเดี่ยว C–O ซึ่งทำให้คาร์บอนมีอิเล็กตรอนรอบตัวแค่ 6 ตัว ต้องย้ายคู่โดดเดี่ยวหนึ่งคู่จาก O มาเป็นพันธะคู่ C=O" }
      - { match: 4, feedback: "4 คือจำนวนอิเล็กตรอนในคู่โดดเดี่ยว โจทย์ถามจำนวนคู่" }
    solution: "เวเลนซ์รวม $2 + 4 + 6 = 12$ ตัว โครงสร้างที่ครบออกเตตคือ C–H สองพันธะและ C=O หนึ่งพันธะ ใช้ $2 + 2 + 4 = 8$ ตัว เหลือ $12 - 8 = 4$ ตัวเป็นคู่โดดเดี่ยวบน O **2 คู่** ตรวจ: C มี $2 + 2 + 4 = 8$ ✓ O มี $4 + 4 = 8$ ✓"
