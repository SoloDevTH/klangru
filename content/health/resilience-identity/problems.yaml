  difficulty: 5
  type: match
  stem: จับคู่วิธีประเมินกลยุทธ์กับผลที่ได้
  pairs:
  - left: บันทึกผลหลังฝึกทุกสัปดาห์แล้วเทียบกับเป้าหมาย
    right: เห็นว่าวิธีไหนช่วยได้จริง
  - left: ทำแผนเดิมต่อทั้งที่ไม่ได้ผลหลายสัปดาห์
    right: ควรปรับแผนหรือขอความช่วยเหลือ
  - left: ขอคำแนะนำจากคนที่ไว้ใจ
    right: ได้มุมมองใหม่และทางเลือกรับมือ
  - left: เปลี่ยนวิธีทั้งหมดในวันเดียวพร้อมกัน
    right: ไม่รู้ว่าวิธีไหนได้ผล
  hints:
  - การเทียบผลกับเป้าหมายทำให้เห็นว่าวิธีไหนได้ผลจริง
  - การเปลี่ยนหลายอย่างพร้อมกันทำให้ไม่รู้ว่าอะไรช่วยได้
  solution: บันทึกผลทุกสัปดาห์และเทียบกับเป้าหมาย = เห็นวิธีที่ได้ผลจริง, ทำแผนเดิมต่อทั้งที่ไม่ได้ผล = ควรปรับแผนหรือขอความช่วยเหลือ, ขอคำแนะนำจากคนที่ไว้ใจ = ได้มุมมองใหม่และทางเลือก, เปลี่ยนทุกวิธีในวันเดียว = ไม่รู้ว่าวิธีไหนได้ผล
