<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" font-family="sans-serif" font-size="14">
<title>แผนภูมิแท่งกำลังไฟฟ้าตัวอย่างของอุปกรณ์สี่ชนิด แท็บเล็ต 10 วัตต์ แล็ปท็อป 45 วัตต์ เดสก์ท็อป 200 วัตต์ และเซิร์ฟเวอร์ 400 วัตต์</title>
<rect x="0" y="0" width="520" height="300" fill="#ffffff"/>
<text x="260.0" y="26" text-anchor="middle" font-weight="bold" fill="#1f2937">กำลังไฟฟ้าตัวอย่างของอุปกรณ์ (วัตต์)</text>
<line x1="50" y1="250" x2="500" y2="250" stroke="#374151" stroke-width="1.5"/>
<line x1="50" y1="40.0" x2="50" y2="250" stroke="#374151" stroke-width="1.5"/>
<line x1="46" y1="250.0" x2="50" y2="250.0" stroke="#374151" stroke-width="1.5"/>
<text x="42" y="255.0" text-anchor="end" fill="#374151">0</text>
<line x1="46" y1="200.0" x2="50" y2="200.0" stroke="#374151" stroke-width="1.5"/>
<text x="42" y="205.0" text-anchor="end" fill="#374151">100</text>
<line x1="46" y1="150.0" x2="50" y2="150.0" stroke="#374151" stroke-width="1.5"/>
<text x="42" y="155.0" text-anchor="end" fill="#374151">200</text>
<line x1="46" y1="100.0" x2="50" y2="100.0" stroke="#374151" stroke-width="1.5"/>
<text x="42" y="105.0" text-anchor="end" fill="#374151">300</text>
<line x1="46" y1="50.0" x2="50" y2="50.0" stroke="#374151" stroke-width="1.5"/>
<text x="42" y="55.0" text-anchor="end" fill="#374151">400</text>
<rect x="60" y="245.0" width="70" height="5.0" fill="#86efac" stroke="#14532d" stroke-width="1.5"/>
<text x="95.0" y="239.0" text-anchor="middle" fill="#1f2937" font-weight="bold">10 W</text>
<text x="95.0" y="270" text-anchor="middle" fill="#1f2937">แท็บเล็ต</text>
<rect x="164" y="227.5" width="70" height="22.5" fill="#86efac" stroke="#14532d" stroke-width="1.5"/>
<text x="199.0" y="221.5" text-anchor="middle" fill="#1f2937" font-weight="bold">45 W</text>
<text x="199.0" y="270" text-anchor="middle" fill="#1f2937">แล็ปท็อป</text>
<rect x="268" y="150.0" width="70" height="100.0" fill="#86efac" stroke="#14532d" stroke-width="1.5"/>
<text x="303.0" y="144.0" text-anchor="middle" fill="#1f2937" font-weight="bold">200 W</text>
<text x="303.0" y="270" text-anchor="middle" fill="#1f2937">เดสก์ท็อป</text>
<rect x="372" y="50.0" width="70" height="200.0" fill="#86efac" stroke="#14532d" stroke-width="1.5"/>
<text x="407.0" y="44.0" text-anchor="middle" fill="#1f2937" font-weight="bold">400 W</text>
<text x="407.0" y="270" text-anchor="middle" fill="#1f2937">เซิร์ฟเวอร์</text>
<text x="260.0" y="292" text-anchor="middle" fill="#6b7280" font-size="12">ค่าตัวอย่างเพื่อการเรียนรู้ ไม่ใช่ค่าของเครื่องทุกรุ่น</text>
</svg>