<text x="20.0" y="70.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1f5d99">ไฮโพทาลามัส (ในสมอง)</text>
<text x="20.0" y="87.0" font-size="12" text-anchor="start" fill="#111">เชื่อมระบบประสาทกับต่อมไร้ท่อ</text>
<line x1="275.0" y1="73.0" x2="369.0" y2="96.0" stroke="#1f5d99" stroke-width="1"/>
<text x="20.0" y="125.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1f5d99">ต่อมใต้สมอง</text>
<text x="20.0" y="142.0" font-size="12" text-anchor="start" fill="#111">โกรทฮอร์โมน และสั่งต่อมอื่น</text>
<line x1="275.0" y1="128.0" x2="375.0" y2="106.0" stroke="#1f5d99" stroke-width="1"/>
<text x="20.0" y="180.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1f5d99">ต่อมไทรอยด์</text>
<text x="20.0" y="197.0" font-size="12" text-anchor="start" fill="#111">ไทรอกซิน คุมการเผาผลาญ ต้องใช้ไอโอดีน</text>
<line x1="275.0" y1="183.0" x2="373.0" y2="150.0" stroke="#1f5d99" stroke-width="1"/>
<text x="20.0" y="235.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1f5d99">ไขสันหลัง</text>
<text x="20.0" y="252.0" font-size="12" text-anchor="start" fill="#111">ทางผ่านกระแสประสาท ศูนย์รีเฟล็กซ์</text>
<line x1="275.0" y1="238.0" x2="370.0" y2="200.0" stroke="#1f5d99" stroke-width="1"/>
<text x="500.0" y="70.0" font-size="13" text-anchor="start" font-weight="bold" fill="#9c2b2b">สมอง</text>
<text x="500.0" y="87.0" font-size="12" text-anchor="start" fill="#111">คิด จำ ตัดสินใจ สั่งการ</text>
<line x1="495.0" y1="73.0" x2="413.0" y2="80.0" stroke="#9c2b2b" stroke-width="1"/>
<text x="500.0" y="200.0" font-size="13" text-anchor="start" font-weight="bold" fill="#9c2b2b">ต่อมหมวกไต (บนไต)</text>
<text x="500.0" y="217.0" font-size="12" text-anchor="start" fill="#111">อะดรีนาลีน เมื่อตกใจหรือเครียด</text>
<line x1="495.0" y1="203.0" x2="415.0" y2="250.0" stroke="#9c2b2b" stroke-width="1"/>
<text x="500.0" y="265.0" font-size="13" text-anchor="start" font-weight="bold" fill="#9c2b2b">ตับอ่อน</text>
<text x="500.0" y="282.0" font-size="12" text-anchor="start" fill="#111">อินซูลิน ลดน้ำตาลในเลือด</text>
<line x1="495.0" y1="268.0" x2="409.0" y2="288.0" stroke="#9c2b2b" stroke-width="1"/>
<text x="500.0" y="330.0" font-size="13" text-anchor="start" font-weight="bold" fill="#9c2b2b">รังไข่ (หญิง) / อัณฑะ (ชาย)</text>
<text x="500.0" y="347.0" font-size="12" text-anchor="start" fill="#111">ฮอร์โมนเพศ ทำให้ร่างกายเปลี่ยนในวัยรุ่น</text>
<line x1="495.0" y1="333.0" x2="407.0" y2="328.0" stroke="#9c2b2b" stroke-width="1"/>
<text x="380.0" y="480.0" font-size="11" text-anchor="middle" fill="#555">สีม่วง: สมองและไขสันหลัง (ระบบประสาทส่วนกลาง)  จุดสี: ต่อมไร้ท่อ</text>
<text x="380.0" y="498.0" font-size="11" text-anchor="middle" fill="#555">แผนภาพอย่างง่าย ตำแหน่งโดยประมาณ ไม่ใช่ขนาดจริง</text>
</svg>
