<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="sans-serif" font-size="14">
  <title>การป้องกันหลายชั้น ชั้นนอกสุดคือคน ถัดเข้าไปคือกายภาพ เครือข่าย อุปกรณ์ บัญชี และข้อมูลอยู่ตรงกลาง</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="860" height="470" fill="#ffffff"/>
  <rect x="30.0" y="15.0" width="800.0" height="440.0" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="430.0" y="38.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">คน: รู้ทันฟิชชิง รายงานสิ่งผิดปกติ</text>
  <rect x="62.0" y="47.0" width="736.0" height="376.0" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="430.0" y="70.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">กายภาพ: ล็อกห้อง ล็อกหน้าจอ ไม่เสียบ USB แปลก</text>
  <rect x="94.0" y="79.0" width="672.0" height="312.0" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="430.0" y="102.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">เครือข่าย: ไฟร์วอลล์ Wi-Fi WPA2/WPA3</text>
  <rect x="126.0" y="111.0" width="608.0" height="248.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="430.0" y="134.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">อุปกรณ์: อัปเดต แอนติมัลแวร์</text>
  <rect x="158.0" y="143.0" width="544.0" height="184.0" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="430.0" y="166.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">บัญชี: รหัสผ่านไม่ซ้ำ MFA สิทธิ์น้อยที่สุด</text>
  <rect x="190.0" y="175.0" width="480.0" height="120.0" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="430.0" y="198.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ข้อมูล: เข้ารหัส สำรอง 3-2-1</text>
  <text x="430.0" y="250.0" font-size="13" text-anchor="middle" fill="#6b7280" xml:space="preserve">ถ้าชั้นหนึ่งพลาด ชั้นถัดไปยังช่วยกันไว้</text>
</svg>
