problems:
  - id: phy.si.p001
    topics: [physics.units.si]
    difficulty: 1
    type: mcq
    stem: "หน่วยฐานของ **มวล** ในระบบ SI คือข้อใด"
    choices:
      - { id: a, text: "กิโลกรัม (kg)", correct: true }
      - { id: b, text: "กรัม (g)", feedback: "กรัมใช้กันบ่อยในชีวิตประจำวัน แต่หน่วยฐาน SI ของมวลคือกิโลกรัม เป็นหน่วยฐานเพียงหน่วยเดียวที่มีคำนำหน้าติดมาด้วย" }
      - { id: c, text: "นิวตัน (N)", feedback: "นิวตันเป็นหน่วยของแรง (รวมถึงน้ำหนัก) และเป็นหน่วยอนุพันธ์ ไม่ใช่หน่วยของมวล" }
      - { id: d, text: "ปอนด์ (lb)", feedback: "ปอนด์เป็นหน่วยในระบบอังกฤษ ไม่ได้อยู่ในระบบ SI" }
    hints:
      - "หน่วยฐานมี 7 หน่วย เช่น m, s, A, K และหน่วยของมวล"
      - "หน่วยฐานของมวลเป็นหน่วยเดียวที่มีคำนำหน้าหน่วยติดอยู่ในชื่อ"
    solution: "หน่วยฐาน SI ของมวลคือ **กิโลกรัม (kg)** ส่วนกรัมคือ $10^{-3}\\ \\mathrm{kg}$ นิวตันเป็นหน่วยของแรง และปอนด์ไม่ใช่หน่วย SI"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.si.p002
    topics: [physics.units.si]
    difficulty: 1
    type: numeric
    stem: "ระยะทางจากบ้านถึงโรงเรียน $2.5\\ \\mathrm{km}$ เท่ากับกี่เมตร (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 2500, unit: m }
    hints:
      - "k (กิโล) มีค่าเท่ากับ $10^{3}$"
      - "$1\\ \\mathrm{km} = 1000\\ \\mathrm{m}$ หน่วยใหญ่แปลงเป็นหน่วยเล็ก ตัวเลขต้องมากขึ้น"
    misconceptions:
      - { match: 0.0025, feedback: "ดูเหมือนหาร 1000 แต่กิโลเมตรเป็นหน่วยที่ใหญ่กว่าเมตร เมื่อแปลงเป็นเมตร ตัวเลขต้องมากขึ้น จึงต้องคูณ 1000" }
      - { match: 250, feedback: "ดูเหมือนคูณ 100 คำนำหน้า k มีค่า $10^{3} = 1000$ ไม่ใช่ 100" }
    solution: "$2.5\\ \\mathrm{km} \\times \\dfrac{1000\\ \\mathrm{m}}{1\\ \\mathrm{km}} = 2500\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.si.p003
    topics: [physics.units.si]
    difficulty: 2
    type: match
    stem: "จับคู่คำนำหน้าหน่วยกับค่าของมัน"
    pairs:
      - { left: "k (กิโล)", right: "$10^{3}$" }
      - { left: "M (เมกะ)", right: "$10^{6}$" }
      - { left: "c (เซนติ)", right: "$10^{-2}$" }
      - { left: "m (มิลลิ)", right: "$10^{-3}$" }
      - { left: "μ (ไมโคร)", right: "$10^{-6}$" }
    hints:
      - "คำนำหน้าที่ทำให้หน่วยใหญ่ขึ้นมีเลขชี้กำลังเป็นบวก ที่ทำให้เล็กลงเป็นลบ"
      - "1 เมตรมี 100 เซนติเมตร และ 1000 มิลลิเมตร"
      - "M ตัวใหญ่คือเมกะ (ล้าน) ส่วน m ตัวเล็กคือมิลลิ (หนึ่งในพัน)"
    solution: "k = $10^{3}$, M = $10^{6}$, c = $10^{-2}$, m = $10^{-3}$, μ = $10^{-6}$ เช่น $1\\ \\mathrm{cm} = 10^{-2}\\ \\mathrm{m}$ เพราะ 1 เมตรมี 100 เซนติเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.si.p004
    topics: [physics.units.si]
    difficulty: 2
    type: text
    stem: "หน่วย SI ของ **อัตราเร็ว** คืออะไร (พิมพ์สัญลักษณ์หน่วย หรือเขียนเป็นคำไทยก็ได้)"
    accepted: ["m/s", "ms^-1", "m s^-1", "m·s^-1", "m.s^-1", "m s⁻¹", "ms⁻¹", "เมตรต่อวินาที", "เมตร/วินาที"]
    hints:
      - "อัตราเร็ว = ระยะทาง ÷ เวลา"
      - "นำหน่วยฐานของความยาวมาหารด้วยหน่วยฐานของเวลา"
    misconceptions:
      - { match: "km/h", feedback: "km/h ใช้บ่อยบนหน้าปัดรถ แต่ไม่ใช่หน่วย SI เพราะชั่วโมงไม่ใช่หน่วยฐาน หน่วยฐานของเวลาคือวินาที" }
      - { match: "m/s^2", feedback: "นั่นคือหน่วยของความเร่ง อัตราเร็วคือระยะทางหารด้วยเวลาครั้งเดียว" }
    solution: "อัตราเร็ว = ระยะทาง ÷ เวลา หน่วยจึงเป็น $\\mathrm{m} \\div \\mathrm{s} = \\mathrm{m/s}$ (เมตรต่อวินาที) ซึ่งเป็นหน่วยอนุพันธ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.si.p005
    topics: [physics.units.si]
    difficulty: 3
    type: numeric
    stem: "รถเมล์วิ่งด้วยอัตราเร็ว $72\\ \\mathrm{km/h}$ เท่ากับกี่เมตรต่อวินาที (ตอบเป็นตัวเลขในหน่วย m/s)"
    answer: { value: 20, unit: m/s }
    hints:
      - "1 กิโลเมตร = 1000 เมตร และ 1 ชั่วโมง = 3600 วินาที"
      - "คูณด้วย $\\dfrac{1000\\ \\mathrm{m}}{1\\ \\mathrm{km}}$ และ $\\dfrac{1\\ \\mathrm{h}}{3600\\ \\mathrm{s}}$ ให้หน่วยตัดกัน"
      - "สองตัวคูณรวมกันเท่ากับการหารด้วย 3.6"
    misconceptions:
      - { match: 259.2, feedback: "ดูเหมือนคูณ 3.6 แต่ต้องหาร 3.6 ลองคิดว่า 259 เมตรต่อวินาทีเร็วกว่ารถแข่งมาก รถเมล์ไม่น่าจะเร็วขนาดนั้น" }
      - { match: 72, feedback: "ตัวเลขนี้ยังอยู่ในหน่วย km/h ต้องแปลงกิโลเมตรเป็นเมตรและชั่วโมงเป็นวินาทีก่อน" }
    solution: "$72\\ \\dfrac{\\mathrm{km}}{\\mathrm{h}} \\times \\dfrac{1000\\ \\mathrm{m}}{1\\ \\mathrm{km}} \\times \\dfrac{1\\ \\mathrm{h}}{3600\\ \\mathrm{s}} = \\dfrac{72\\,000\\ \\mathrm{m}}{3600\\ \\mathrm{s}} = 20\\ \\mathrm{m/s}$ หรือใช้ทางลัด $72 \\div 3.6 = 20\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.si.p006
    topics: [physics.units.si]
    difficulty: 3
    type: mcq
    stem: "เขียน $0.00045\\ \\mathrm{m}$ ในรูปสัญกรณ์วิทยาศาสตร์ได้ตามข้อใด"
    choices:
      - { id: a, text: "$4.5 \\times 10^{-4}\\ \\mathrm{m}$", correct: true }
      - { id: b, text: "$4.5 \\times 10^{4}\\ \\mathrm{m}$", feedback: "เครื่องหมายของเลขชี้กำลังผิด จำนวนที่น้อยกว่า 1 ต้องมีเลขชี้กำลังเป็นลบ" }
      - { id: c, text: "$45 \\times 10^{-5}\\ \\mathrm{m}$", feedback: "ค่าเท่ากันจริง แต่ยังไม่ใช่สัญกรณ์วิทยาศาสตร์ เพราะตัวหน้าต้องอยู่ระหว่าง 1 ถึงน้อยกว่า 10" }
      - { id: d, text: "$4.5 \\times 10^{-3}\\ \\mathrm{m}$", feedback: "นับตำแหน่งที่เลื่อนจุดทศนิยมขาดไปหนึ่ง ลองนับใหม่ว่าต้องเลื่อนไปทางขวากี่ตำแหน่งจึงได้ 4.5" }
    hints:
      - "สัญกรณ์วิทยาศาสตร์มีรูป $A \\times 10^{n}$ โดย $1 \\le A < 10$"
      - "เลื่อนจุดทศนิยมไปทางขวาจนได้ 4.5 แล้วนับว่าเลื่อนกี่ตำแหน่ง เลื่อนไปทางขวาแปลว่า $n$ เป็นลบ"
    solution: "เลื่อนจุดทศนิยมของ 0.00045 ไปทางขวา 4 ตำแหน่งได้ 4.5 จึงเขียนได้ $4.5 \\times 10^{-4}\\ \\mathrm{m}$ ตรวจ: $4.5 \\times 0.0001 = 0.00045$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.si.p007
    topics: [physics.units.si]
    difficulty: 4
    type: numeric
    stem: "เส้นผมเส้นหนึ่งหนา $80\\ \\mathrm{\\mu m}$ เมื่อเขียนในหน่วยเมตรแบบสัญกรณ์วิทยาศาสตร์จะได้ $8 \\times 10^{n}\\ \\mathrm{m}$ จงหา $n$ (ตอบเป็นจำนวนเต็ม)"
    answer: { value: -5 }
    hints:
      - "μ (ไมโคร) มีค่า $10^{-6}$ จึงได้ $80\\ \\mathrm{\\mu m} = 80 \\times 10^{-6}\\ \\mathrm{m}$"
      - "80 ยังไม่อยู่ระหว่าง 1 ถึง 10 ให้เขียน 80 เป็น $8 \\times 10^{1}$ ก่อน"
      - "คูณเลขยกกำลังฐานเดียวกันให้นำเลขชี้กำลังมาบวกกัน"
    misconceptions:
      - { match: -6, feedback: "$80 \\times 10^{-6}$ ถูกต้อง แต่ตัวหน้ายังเป็น 80 ต้องเขียน 80 เป็น $8 \\times 10^{1}$ แล้วรวมเลขชี้กำลัง" }
      - { match: -7, feedback: "ดูเหมือนเลื่อนเลขชี้กำลังผิดทาง เมื่อตัวหน้าเล็กลง 10 เท่า (80 → 8) เลขชี้กำลังต้องเพิ่มขึ้น 1" }
    solution: "$80\\ \\mathrm{\\mu m} = 80 \\times 10^{-6}\\ \\mathrm{m} = 8 \\times 10^{1} \\times 10^{-6}\\ \\mathrm{m} = 8 \\times 10^{-5}\\ \\mathrm{m}$ ดังนั้น $n = -5$ ตรวจ: $8 \\times 10^{-5} = 0.00008\\ \\mathrm{m}$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.si.p008
    topics: [physics.units.si]
    difficulty: 5
    type: numeric
    stem: "กระดานไวท์บอร์ดมีพื้นที่ $3\\ \\mathrm{m^2}$ เท่ากับกี่ตารางเซนติเมตร (ตอบเป็นตัวเลขในหน่วย cm²)"
    answer: { value: 30000, unit: cm² }
    hints:
      - "$\\mathrm{m^2}$ คือ $\\mathrm{m} \\times \\mathrm{m}$ มีหน่วยเมตรอยู่สองตัว"
      - "แต่ละเมตรต้องแปลงเป็น 100 เซนติเมตร จึงต้องแปลงสองครั้ง"
      - "$1\\ \\mathrm{m^2} = (100\\ \\mathrm{cm})^2$"
    misconceptions:
      - { match: 300, feedback: "ดูเหมือนคูณ 100 ครั้งเดียว แต่ $\\mathrm{m^2}$ มีเมตรสองตัว ต้องคูณ 100 สองครั้ง คือคูณ $10\\,000$" }
      - { match: 3000, feedback: "ดูเหมือนคูณ 1000 ซึ่งเป็นตัวแปลงของกิโล ไม่ใช่ของเซนติ ลองหาว่า $(100\\ \\mathrm{cm})^2$ เท่ากับเท่าใด" }
    solution: "$1\\ \\mathrm{m^2} = (100\\ \\mathrm{cm})^2 = 10\\,000\\ \\mathrm{cm^2}$ ดังนั้น $3\\ \\mathrm{m^2} = 3 \\times 10\\,000\\ \\mathrm{cm^2} = 30\\,000\\ \\mathrm{cm^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.si.p009
    topics: [physics.units.si]
    difficulty: 2
    type: numeric
    stem: "ทุเรียนหมอนทองลูกหนึ่งหนัก $2400\\ \\mathrm{g}$ มีมวลกี่กิโลกรัม (ตอบเป็นตัวเลขในหน่วย kg)"
    answer: { value: 2.4, tolerance: 0.02, unit: kg }
    hints:
      - "$1\\ \\mathrm{kg} = 1000\\ \\mathrm{g}$"
      - "แปลงจากหน่วยเล็ก (กรัม) เป็นหน่วยใหญ่ (กิโลกรัม) ตัวเลขต้องน้อยลง จึงต้องหาร"
    misconceptions:
      - { match: 2400000, feedback: "ดูเหมือนคูณ 1000 แต่กิโลกรัมเป็นหน่วยที่ใหญ่กว่ากรัม เมื่อแปลงเป็นกิโลกรัม ตัวเลขต้องน้อยลง" }
      - { match: 24, feedback: "ดูเหมือนหาร 100 คำนำหน้า k มีค่า $10^{3} = 1000$ ทุเรียน 24 กิโลกรัมหนักเกินจริงไปมาก" }
    solution: "$2400\\ \\mathrm{g} \\times \\dfrac{1\\ \\mathrm{kg}}{1000\\ \\mathrm{g}} = 2.4\\ \\mathrm{kg}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.si.p010
    topics: [physics.units.si]
    difficulty: 4
    type: numeric
    stem: "น้ำผึ้งป่าจากจังหวัดน่านมีความหนาแน่น $1.4\\ \\mathrm{g/cm^3}$ เท่ากับกี่กิโลกรัมต่อลูกบาศก์เมตร (ตอบเป็นตัวเลขในหน่วย kg/m³)"
    answer: { value: 1400, unit: kg/m³ }
    hints:
      - "ต้องแปลงสองอย่าง คือ กรัมเป็นกิโลกรัม (ตัวบน) และ $\\mathrm{cm^3}$ เป็น $\\mathrm{m^3}$ (ตัวล่าง)"
      - "$1\\ \\mathrm{m} = 100\\ \\mathrm{cm}$ ดังนั้น $1\\ \\mathrm{m^3} = (100\\ \\mathrm{cm})^3$"
      - "คูณด้วย $\\dfrac{1\\ \\mathrm{kg}}{1000\\ \\mathrm{g}}$ และ $\\dfrac{10^{6}\\ \\mathrm{cm^3}}{1\\ \\mathrm{m^3}}$ ให้หน่วยตัดกัน"
    misconceptions:
      - { match: 0.0014, feedback: "แปลงกรัมเป็นกิโลกรัมถูกแล้ว แต่ยังไม่ได้แปลง $\\mathrm{cm^3}$ เป็น $\\mathrm{m^3}$ ซึ่ง $1\\ \\mathrm{m^3} = 10^{6}\\ \\mathrm{cm^3}$" }
      - { match: 0.14, feedback: "ดูเหมือนแปลง $\\mathrm{cm^3}$ เป็น $\\mathrm{m^3}$ ด้วยการคูณ 100 ครั้งเดียว แต่ $\\mathrm{cm^3}$ มีเซนติเมตรสามตัว ต้องคูณ $100^3 = 10^{6}$" }
    solution: "$1.4\\ \\dfrac{\\mathrm{g}}{\\mathrm{cm^3}} \\times \\dfrac{1\\ \\mathrm{kg}}{1000\\ \\mathrm{g}} \\times \\dfrac{10^{6}\\ \\mathrm{cm^3}}{1\\ \\mathrm{m^3}} = 1.4 \\times 1000\\ \\mathrm{kg/m^3} = 1400\\ \\mathrm{kg/m^3}$ (เทียบกับน้ำ $1000\\ \\mathrm{kg/m^3}$ น้ำผึ้งจึงหนักกว่าน้ำปริมาตรเท่ากัน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.si.p011
    topics: [physics.units.si]
    difficulty: 1
    type: mcq
    stem: "ข้อใด **ไม่ใช่** หน่วยฐานของระบบ SI"
    choices:
      - { id: a, text: "นิวตัน (N)", correct: true }
      - { id: b, text: "เคลวิน (K)", feedback: "เคลวินเป็นหน่วยฐานของอุณหภูมิ องศาเซลเซียสต่างหากที่ไม่ใช่หน่วยฐาน" }
      - { id: c, text: "โมล (mol)", feedback: "โมลเป็นหน่วยฐานของปริมาณสาร ใช้มากในวิชาเคมี" }
      - { id: d, text: "แอมแปร์ (A)", feedback: "แอมแปร์เป็นหน่วยฐานของกระแสไฟฟ้า" }
    hints:
      - "หน่วยฐานมี 7 หน่วย คือ m, kg, s, A, K, mol และ cd"
      - "หน่วยที่เขียนเป็นผลคูณหรือผลหารของหน่วยอื่นได้คือหน่วยอนุพันธ์"
    solution: "นิวตันเป็นหน่วยอนุพันธ์ $1\\ \\mathrm{N} = 1\\ \\mathrm{kg \\cdot m/s^2}$ ส่วนเคลวิน โมล และแอมแปร์เป็นหน่วยฐาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.si.p012
    topics: [physics.units.si]
    difficulty: 2
    type: numeric
    stem: "น้ำดื่มขวดใหญ่บรรจุ $1.5$ ลิตร มีปริมาตรกี่ลูกบาศก์เซนติเมตร (ตอบเป็นตัวเลขในหน่วย cm³)"
    answer: { value: 1500, unit: cm³ }
    hints:
      - "$1$ ลิตรเท่ากับ $1{,}000$ มิลลิลิตร"
      - "$1\\ \\mathrm{mL} = 1\\ \\mathrm{cm^3}$"
    misconceptions:
      - { match: 150, feedback: "ดูเหมือนคิดว่า $1\\ \\mathrm{L} = 100\\ \\mathrm{cm^3}$ ลิตรคือลูกบาศก์เดซิเมตร $1\\ \\mathrm{dm^3} = 10 \\times 10 \\times 10 = 1{,}000\\ \\mathrm{cm^3}$" }
      - { match: 0.0015, feedback: "นี่คือปริมาตรในหน่วยลูกบาศก์เมตร โจทย์ถามเป็นลูกบาศก์เซนติเมตร" }
    solution: "$1.5\\ \\mathrm{L} = 1.5 \\times 1{,}000\\ \\mathrm{mL} = 1{,}500\\ \\mathrm{mL} = 1{,}500\\ \\mathrm{cm^3}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.si.p013
    topics: [physics.units.si]
    difficulty: 2
    type: numeric
    stem: "ป้ายบนทางหลวงในภาพจำกัดความเร็วไว้ที่ $90$ กิโลเมตรต่อชั่วโมง ความเร็วนี้เท่ากับกี่เมตรต่อวินาที (ตอบเป็นตัวเลขในหน่วย m/s)"
    figure:
      src: speed-limit-90.svg
      alt: "ป้ายจราจรวงกลมขอบสีแดง ตรงกลางเขียนเลข 90 และมีคำว่า กม./ชม. อยู่ใต้ตัวเลข"
    answer: { value: 25, unit: m/s }
    hints:
      - "$1\\ \\mathrm{km} = 1{,}000\\ \\mathrm{m}$ และ $1\\ \\mathrm{h} = 3{,}600\\ \\mathrm{s}$"
      - "คูณด้วย $\\dfrac{1000\\ \\mathrm{m}}{1\\ \\mathrm{km}}$ และ $\\dfrac{1\\ \\mathrm{h}}{3600\\ \\mathrm{s}}$ หรือหารด้วย 3.6"
    misconceptions:
      - { match: 324, feedback: "ดูเหมือนคูณด้วย 3.6 การแปลง km/h เป็น m/s ต้องหาร เพราะ 1 วินาทีสั้นกว่า 1 ชั่วโมงมาก ระยะทางใน 1 วินาทีจึงน้อยกว่า" }
      - { match: 1.5, feedback: "ดูเหมือนหารด้วย 60 ซึ่งเปลี่ยนชั่วโมงเป็นนาทีเท่านั้น และยังไม่ได้เปลี่ยนกิโลเมตรเป็นเมตร" }
    solution: "$90\\ \\dfrac{\\mathrm{km}}{\\mathrm{h}} \\times \\dfrac{1000\\ \\mathrm{m}}{1\\ \\mathrm{km}} \\times \\dfrac{1\\ \\mathrm{h}}{3600\\ \\mathrm{s}} = \\dfrac{90{,}000}{3{,}600}\\ \\mathrm{m/s} = 25\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.si.p014
    topics: [physics.units.si]
    difficulty: 3
    type: expression
    stem: "รถคันหนึ่งวิ่งด้วยอัตราเร็ว $v$ กิโลเมตรต่อชั่วโมง ถ้าอัตราเร็วเดียวกันนี้เท่ากับ $w$ เมตรต่อวินาที เขียน $w$ ในรูปของ $v$"
    prefix: "w ="
    answer: { latex: "\\frac{v}{3.6}", variables: [v] }
    hints:
      - "เปลี่ยน $v$ กิโลเมตรเป็นเมตร แล้วเปลี่ยน 1 ชั่วโมงเป็นวินาที"
      - "$\\dfrac{v \\times 1000}{3600}$ แล้วลดรูปเศษส่วน"
    misconceptions:
      - { match: "3.6v", feedback: "การคูณ 3.6 ใช้แปลง m/s เป็น km/h ส่วนกรณีนี้ตัวเลขต้องเล็กลง จึงต้องหาร" }
      - { match: "\\frac{v}{60}", feedback: "หาร 60 เปลี่ยนชั่วโมงเป็นนาทีเท่านั้น ต้องเปลี่ยนเป็นวินาที (3,600) และเปลี่ยนกิโลเมตรเป็นเมตร (คูณ 1,000) ด้วย" }
    solution: "$v\\ \\dfrac{\\mathrm{km}}{\\mathrm{h}} = \\dfrac{v \\times 1000\\ \\mathrm{m}}{3600\\ \\mathrm{s}} = \\dfrac{v}{3.6}\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.si.p015
    topics: [physics.units.si]
    difficulty: 3
    type: mcq
    stem: "งานมีหน่วยจูล โดย $1\\ \\mathrm{J} = 1\\ \\mathrm{N \\cdot m}$ เมื่อเขียนจูลด้วยหน่วยฐานของ SI จะได้ข้อใด"
    choices:
      - { id: a, text: "$\\mathrm{kg \\cdot m^2/s^2}$", correct: true }
      - { id: b, text: "$\\mathrm{kg \\cdot m/s^2}$", feedback: "นี่คือหน่วยของนิวตันเท่านั้น ยังต้องคูณด้วยเมตรอีกครั้ง" }
      - { id: c, text: "$\\mathrm{kg \\cdot m^2/s}$", feedback: "นิวตันมี $\\mathrm{s^2}$ อยู่ในตัวส่วน การคูณด้วยเมตรไม่ได้ทำให้เลขชี้กำลังของวินาทีเปลี่ยน" }
      - { id: d, text: "$\\mathrm{kg \\cdot m/s}$", feedback: "นี่คือหน่วยของโมเมนตัม (มวล × ความเร็ว) ไม่ใช่งาน" }
    hints:
      - "เขียนนิวตันด้วยหน่วยฐานก่อน: $1\\ \\mathrm{N} = 1\\ \\mathrm{kg \\cdot m/s^2}$"
      - "คูณด้วยเมตรแล้วรวมเลขชี้กำลังของเมตร"
    solution: "$1\\ \\mathrm{J} = 1\\ \\mathrm{N} \\times 1\\ \\mathrm{m} = 1\\ \\mathrm{kg \\cdot m/s^2} \\times \\mathrm{m} = 1\\ \\mathrm{kg \\cdot m^2/s^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.si.p016
    topics: [physics.units.si]
    difficulty: 3
    type: numeric
    stem: "ก๊อกน้ำในห้องน้ำโรงเรียนปิดไม่สนิท น้ำหยดรั่วออกมา $0.05\\ \\mathrm{mL}$ ทุกวินาที ใน 1 วัน (24 ชั่วโมง) น้ำรั่วไปกี่ลิตร (ตอบเป็นตัวเลขในหน่วย L)"
    answer: { value: 4.32, tolerance: 0.01, unit: L }
    hints:
      - "หาจำนวนวินาทีใน 1 วันก่อน: $24 \\times 60 \\times 60$"
      - "คูณจำนวนวินาทีด้วย $0.05\\ \\mathrm{mL}$ แล้วหารด้วย 1,000 เพื่อเปลี่ยนเป็นลิตร"
    misconceptions:
      - { match: 0.072, feedback: "ดูเหมือนใช้จำนวนนาทีใน 1 วัน (1,440) แทนจำนวนวินาที น้ำรั่วทุกวินาที ต้องใช้ $86{,}400$ วินาที" }
      - { match: 4320, feedback: "นี่คือคำตอบในหน่วยมิลลิลิตร ต้องหารด้วย 1,000 เพื่อเปลี่ยนเป็นลิตร" }
    solution: "1 วัน $= 24 \\times 3{,}600 = 86{,}400\\ \\mathrm{s}$ น้ำรั่ว $0.05 \\times 86{,}400 = 4{,}320\\ \\mathrm{mL} = 4.32\\ \\mathrm{L}$ ต่อวัน หรือราว 130 ลิตรต่อเดือน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.si.p017
    topics: [physics.units.si]
    difficulty: 4
    type: numeric
    stem: "กดเข็มหมุดด้วยแรง $2\\ \\mathrm{N}$ ปลายเข็มมีพื้นที่ $0.5\\ \\mathrm{mm^2}$ ความดันที่ปลายเข็มเท่ากับกี่เมกะพาสคัล ($1\\ \\mathrm{Pa} = 1\\ \\mathrm{N/m^2}$) (ตอบเป็นตัวเลขในหน่วย MPa)"
    answer: { value: 4, tolerance: 0.01, unit: MPa }
    hints:
      - "$1\\ \\mathrm{mm} = 10^{-3}\\ \\mathrm{m}$ ดังนั้น $1\\ \\mathrm{mm^2} = (10^{-3})^2\\ \\mathrm{m^2}$"
      - "หาความดันในหน่วย Pa จาก $P = \\dfrac{F}{A}$ แล้วหารด้วย $10^6$ เพื่อเปลี่ยนเป็น MPa"
    misconceptions:
      - { match: 0.004, feedback: "ดูเหมือนแปลง $\\mathrm{mm^2}$ เป็น $\\mathrm{m^2}$ โดยคูณ $10^{-3}$ ครั้งเดียว หน่วยยกกำลังสองต้องคูณ $(10^{-3})^2 = 10^{-6}$" }
      - { match: 4000000, feedback: "นี่คือความดันในหน่วยพาสคัล โจทย์ถามเป็นเมกะพาสคัล ($1\\ \\mathrm{MPa} = 10^6\\ \\mathrm{Pa}$)" }
    solution: "$A = 0.5\\ \\mathrm{mm^2} = 0.5 \\times 10^{-6}\\ \\mathrm{m^2}$ จึงได้ $P = \\dfrac{2}{0.5 \\times 10^{-6}} = 4 \\times 10^{6}\\ \\mathrm{Pa} = 4\\ \\mathrm{MPa}$ (สังเกตว่า $1\\ \\mathrm{N/mm^2} = 1\\ \\mathrm{MPa}$ พอดี)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.si.p018
    topics: [physics.units.si]
    difficulty: 4
    type: mcq
    stem: "ให้ $s$ เป็นระยะทาง ($\\mathrm{m}$) $v$ และ $u$ เป็นความเร็ว ($\\mathrm{m/s}$) $a$ เป็นความเร่ง ($\\mathrm{m/s^2}$) และ $t$ เป็นเวลา ($\\mathrm{s}$) สมการใด **ผิดแน่นอน** เมื่อตรวจด้วยหน่วย"
    choices:
      - { id: a, text: "$v = u + at^2$", correct: true }
      - { id: b, text: "$v^2 = u^2 + 2as$", feedback: "ทุกพจน์มีหน่วย $\\mathrm{m^2/s^2}$ เพราะ $as$ มีหน่วย $\\mathrm{m/s^2} \\times \\mathrm{m}$ สมการนี้ผ่านการตรวจหน่วย" }
      - { id: c, text: "$s = \\dfrac{(u + v)t}{2}$", feedback: "$(u+v)t$ มีหน่วย $\\mathrm{m/s} \\times \\mathrm{s} = \\mathrm{m}$ ตรงกับข้างซ้าย สมการนี้ผ่านการตรวจหน่วย" }
      - { id: d, text: "$s = ut + \\tfrac{1}{2}at^2$", feedback: "ทุกพจน์มีหน่วยเมตร ตัวเลข $\\tfrac{1}{2}$ ไม่มีหน่วย สมการนี้ผ่านการตรวจหน่วย" }
    hints:
      - "สมการที่ถูกต้องต้องมีหน่วยเหมือนกันทุกพจน์ที่บวกกันและทั้งสองข้างของเครื่องหมายเท่ากับ"
      - "หาหน่วยของ $at^2$ แล้วเทียบกับหน่วยของ $v$"
    solution: "$at^2$ มีหน่วย $\\mathrm{m/s^2} \\times \\mathrm{s^2} = \\mathrm{m}$ แต่ $v$ และ $u$ มีหน่วย $\\mathrm{m/s}$ บวกเมตรกับเมตรต่อวินาทีไม่ได้ สมการ $v = u + at^2$ จึงผิดแน่นอน (ที่ถูกคือ $v = u + at$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.si.p019
    topics: [physics.units.si]
    difficulty: 4
    type: numeric
    stem: "ถังเก็บน้ำทรงลูกบาศก์ยาวด้านละ $50\\ \\mathrm{cm}$ จุน้ำได้เต็มที่กี่ลิตร (ตอบเป็นตัวเลขในหน่วย L)"
    answer: { value: 125, unit: L }
    hints:
      - "หาปริมาตรเป็นลูกบาศก์เมตรหรือลูกบาศก์เซนติเมตรก่อน"
      - "$1\\ \\mathrm{L} = 1{,}000\\ \\mathrm{cm^3} = 10^{-3}\\ \\mathrm{m^3}$"
    misconceptions:
      - { match: 0.125, feedback: "นี่คือปริมาตรในหน่วยลูกบาศก์เมตร ($0.5^3$) ต้องคูณ 1,000 เพื่อเปลี่ยนเป็นลิตร" }
      - { match: 125000, feedback: "นี่คือปริมาตรในหน่วยลูกบาศก์เซนติเมตร ต้องหารด้วย 1,000 เพื่อเปลี่ยนเป็นลิตร" }
    solution: "$V = 50^3 = 125{,}000\\ \\mathrm{cm^3}$ และ $1\\ \\mathrm{L} = 1{,}000\\ \\mathrm{cm^3}$ จึงได้ $125\\ \\mathrm{L}$ (หรือ $0.5^3 = 0.125\\ \\mathrm{m^3} = 125\\ \\mathrm{L}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.si.p020
    topics: [physics.units.si]
    difficulty: 5
    type: numeric
    stem: "พายุฝนในกรุงเทพฯ ทำให้วัดปริมาณน้ำฝนได้ $30\\ \\mathrm{mm}$ ในหนึ่งชั่วโมง (คือน้ำฝนสูง $30\\ \\mathrm{mm}$ ถ้าไม่ไหลไปไหน) หลังคาบ้านหลังหนึ่งรับฝนได้บนพื้นที่ราบ $120\\ \\mathrm{m^2}$ น้ำฝนที่ตกลงบนหลังคาในชั่วโมงนั้นมีปริมาตรกี่ลิตร (ตอบเป็นตัวเลขในหน่วย L)"
    answer: { value: 3600, tolerance: 1, unit: L }
    hints:
      - "ปริมาตร = พื้นที่ × ความสูงของน้ำ ต้องใช้หน่วยความยาวเดียวกัน"
      - "เปลี่ยน $30\\ \\mathrm{mm}$ เป็นเมตร หาปริมาตรเป็น $\\mathrm{m^3}$ แล้วเปลี่ยนเป็นลิตร"
    misconceptions:
      - { match: 3.6, feedback: "นี่คือปริมาตรในหน่วยลูกบาศก์เมตร $1\\ \\mathrm{m^3} = 1{,}000\\ \\mathrm{L}$" }
      - { match: 3600000, feedback: "ดูเหมือนนำ $30$ (มิลลิเมตร) คูณกับพื้นที่ในหน่วยตารางเมตรโดยไม่แปลงหน่วยให้ตรงกันก่อน ต้องเปลี่ยน $30\\ \\mathrm{mm}$ เป็น $0.03\\ \\mathrm{m}$" }
    solution: "$30\\ \\mathrm{mm} = 0.03\\ \\mathrm{m}$ ปริมาตร $= 120\\ \\mathrm{m^2} \\times 0.03\\ \\mathrm{m} = 3.6\\ \\mathrm{m^3} = 3.6 \\times 1{,}000 = 3{,}600\\ \\mathrm{L}$ ถ้ารองน้ำฝนไว้ได้ทั้งหมดจะได้น้ำราว 180 ถังขนาด 20 ลิตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.si.p021
    topics: [physics.units.si]
    difficulty: 4
    type: numeric
    stem: "แสงเดินทางด้วยอัตราเร็ว $3.0 \\times 10^{8}\\ \\mathrm{m/s}$ ระยะทางที่แสงเดินทางได้ใน 1 ปี (365 วัน) เรียกว่า 1 ปีแสง ถ้าเขียนระยะนี้ในรูป $9.46 \\times 10^{n}\\ \\mathrm{m}$ จงหา $n$ (ตอบเป็นจำนวนเต็ม)"
    answer: { value: 15 }
    hints:
      - "หาจำนวนวินาทีใน 1 ปีก่อน: $365 \\times 24 \\times 3{,}600 \\approx 3.15 \\times 10^{7}\\ \\mathrm{s}$"
      - "คูณเลขหน้ากับเลขหน้า และบวกเลขชี้กำลังของ 10 แล้วจัดให้เลขหน้าอยู่ระหว่าง 1 กับ 10"
    misconceptions:
      - { match: 12, feedback: "ดูเหมือนคิดเป็นกิโลเมตร โจทย์ใช้หน่วยเมตร $1\\ \\mathrm{km} = 10^{3}\\ \\mathrm{m}$" }
      - { match: 8, feedback: "$10^8$ เป็นแค่อัตราเร็วของแสง ยังต้องคูณด้วยจำนวนวินาทีใน 1 ปี" }
    solution: "1 ปี $= 365 \\times 86{,}400 = 31{,}536{,}000 \\approx 3.15 \\times 10^{7}\\ \\mathrm{s}$ ระยะ $= (3.0 \\times 10^{8})(3.15 \\times 10^{7}) \\approx 9.46 \\times 10^{15}\\ \\mathrm{m}$ จึงได้ $n = 15$"
    license: CC-BY-SA-4.0
    ai_assisted: true
