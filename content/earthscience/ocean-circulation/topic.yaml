id: earthscience.ocean.ocean-circulation
subject: earthscience
title: { th: การหมุนเวียนของน้ำในมหาสมุทร, en: "Ocean circulation" }
summary: การแบ่งชั้นน้ำในมหาสมุทร กระแสน้ำผิวหน้าจากลมและแรงคอริออลิส น้ำผุดน้ำจม กระแสน้ำลึกเทอร์โมฮาลีน เอลนีโญและลานีญา และผลต่อลมฟ้าอากาศ สิ่งมีชีวิต และสิ่งแวดล้อม
difficulty: 5
minutes: 40
prerequisites: [earthscience.atmosphere.global-circulation]
encompasses:
  - { id: earthscience.atmosphere.global-circulation, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: การแบ่งชั้นน้ำตามอุณหภูมิ
    src: layers.svg
    alt: "กราฟแกนนอนอุณหภูมิของน้ำ 0–30 °C แกนตั้งความลึก 0–3,000 m ความลึกเพิ่มลงด้านล่าง เส้นสีแดงเขตร้อน 28 °C คงที่ตั้งแต่ผิวน้ำถึง 100 m (แถบชั้นน้ำผสม) จากนั้นลดลงอย่างรวดเร็วจนเหลือราว 5 °C ที่ 1,000 m (แถบเทอร์โมไคลน์ อุณหภูมิลดลงเร็วตามความลึก) แล้วลดลงช้า ๆ เหลือราว 2 °C ที่ 3,000 m (แถบชั้นน้ำลึก เย็นจัด เกือบคงที่ ราว 2–4 °C) เส้นประสีน้ำเงินใกล้ขั้วโลก อุณหภูมิราว 1–1.6 °C เกือบคงที่ตลอดความลึก ไม่มีเทอร์โมไคลน์"
    caption: "เขตร้อนมีเทอร์โมไคลน์ชัด เขตขั้วโลกน้ำผิวหน้าเย็นพอ ๆ กับน้ำลึก (วาดโดยทีมคลังรู้ จากกราฟอุณหภูมิตัวอย่าง)"
  - type: figure
    title: กระแสน้ำผิวหน้าหลัก
    src: gyres.svg
    alt: "แผนที่ร่างโลกตั้งแต่เอเชียตะวันออกเฉียงใต้ทางซ้ายถึงแอฟริกาทางขวา มีเส้นละติจูด 60°N 30°N 0° 30°S 60°S กระแสน้ำอุ่นสีแดง: คุโรชิโอไหลขึ้นเหนือนอกชายฝั่งญี่ปุ่น ศูนย์สูตรเหนือและศูนย์สูตรใต้ไหลไปทางตะวันตก ออสเตรเลียตะวันออกไหลลงใต้ กัลฟ์สตรีมไหลขึ้นตามชายฝั่งตะวันออกของอเมริกาเหนือ ต่อเป็นกระแสน้ำแอตแลนติกเหนือไปถึงยุโรปเหนือ บราซิลไหลลงใต้ อะกุลฮัสไหลลงใต้ตามแอฟริกาตะวันออก กระแสน้ำเย็นสีน้ำเงิน: แคลิฟอร์เนียไหลลงใต้ ฮัมโบลต์ (เปรู) ไหลขึ้นเหนือตามชายฝั่งอเมริกาใต้ตะวันตก ลาบราดอร์ไหลลงใต้ คะเนรีไหลลงใต้นอกแอฟริกาตะวันตกเฉียงเหนือ เบงเกวลาไหลขึ้นเหนือนอกแอฟริกาตะวันตกเฉียงใต้ และกระแสน้ำรอบทวีปแอนตาร์กติกาไหลไปทางตะวันออกที่ราว 55°–60°S กระแสน้ำสีเทาแปซิฟิกเหนือไหลไปทางตะวันออก วงวนแปซิฟิกเหนือและแอตแลนติกเหนือหมุนตามเข็มนาฬิกา วงวนแปซิฟิกใต้และแอตแลนติกใต้หมุนทวนเข็มนาฬิกา จุดสีเหลืองแสดงประเทศไทย"
    caption: "ขอบตะวันตกของมหาสมุทรมีกระแสน้ำอุ่น ขอบตะวันออกมีกระแสน้ำเย็น (วาดโดยทีมคลังรู้ แผนที่ร่าง ตำแหน่งโดยประมาณ)"
  - type: worked-example
    title: ทิศของการขนส่งเอกแมนและน้ำผุด
    problem: "ชายฝั่งเปรูอยู่ทางตะวันออกของมหาสมุทรแปซิฟิกในซีกโลกใต้ ลมค้าตะวันออกเฉียงใต้พัดขนานชายฝั่งขึ้นไปทางทิศเหนือ อธิบายว่าทำไมจึงเกิดน้ำผุด"
    steps:
      - text: "ซีกโลกใต้ แรงคอริออลิสเบนไปทางซ้าย การขนส่งเอกแมนของน้ำชั้นบนจึงตั้งฉากไปทางซ้ายของทิศลม"
      - text: "ลมพัดไปทางทิศเหนือ หันหน้าไปทางเหนือ มือซ้ายอยู่ทางทิศตะวันตก"
        why: "ทิศตะวันตกอยู่ทางซ้ายเมื่อหันหน้าไปทางเหนือ"
      - text: "น้ำผิวหน้าจึงถูกพาไปทางตะวันตก ออกห่างจากชายฝั่งเปรู"
      - text: "น้ำเย็นจากชั้นล่างลอยขึ้นมาแทน นำธาตุอาหารขึ้นมา แพลงก์ตอนเติบโต ปลาแอนโชวี่ชุกชุม"
    answer: "การขนส่งเอกแมนพาน้ำผิวหน้าออกจากฝั่งไปทางตะวันตก น้ำเย็นธาตุอาหารสูงจึงผุดขึ้นมาแทน"
  - { type: check, problem: earthscience.ocean.ocean-circulation.p003, prompt: "ซีกโลกเหนือเบนไปทางขวา" }
  - type: figure
    title: สภาวะปกติและเอลนีโญ
    src: enso.svg
    alt: "ภาพตัดมหาสมุทรแปซิฟิกเขตร้อนสองภาพ ซ้ายคืออินโดนีเซีย (ตะวันตก) ขวาคืออเมริกาใต้ (เปรู ตะวันออก) ภาพบน สภาวะปกติ ลมค้าตะวันออกพัดแรงไปทางตะวันตก น้ำอุ่นกองหนาทางตะวันตก เส้นเทอร์โมไคลน์ลึกทางตะวันตกและตื้นทางตะวันออก ระดับทะเลด้านตะวันตกสูงกว่า เมฆฝนและอากาศยกตัวอยู่เหนืออินโดนีเซีย ที่ชายฝั่งเปรูมีลูกศรน้ำผุด น้ำเย็นธาตุอาหารสูง ภาพล่าง เอลนีโญ ลมค้าอ่อนลง น้ำอุ่นไหลไปทางตะวันออกและแผ่ไปเกือบถึงอเมริกาใต้ เทอร์โมไคลน์เกือบราบ เมฆฝนเลื่อนไปกลางมหาสมุทร เหนืออินโดนีเซียอากาศจมตัว ฝนน้อย ที่เปรูน้ำผุดอ่อนลง"
    caption: "เอลนีโญเปลี่ยนตำแหน่งน้ำอุ่นและบริเวณฝนชุก (วาดโดยทีมคลังรู้ แผนภาพไม่ได้ตามมาตราส่วน)"
  - type: worked-example
    title: มหาสมุทรเก็บความร้อนได้มากเพียงใด
    problem: "น้ำทะเลผิวหน้าหนา 2.5 m พื้นที่ 1 ตารางเมตร อุ่นขึ้น 1 °C ต้องใช้พลังงานเท่าใด เทียบกับอากาศทั้งชั้นเหนือพื้นที่เดียวกัน (มวลราว $10^4$ kg ความจุความร้อนจำเพาะ $1005\\ \\mathrm{J/(kg\\cdot K)}$)"
    steps:
      - text: "มวลน้ำ $= 1025 \\times 2.5 \\times 1 \\approx 2563\\ \\mathrm{kg}$"
      - text: "พลังงานของน้ำ $= 2563 \\times 3990 \\times 1 \\approx 1.02 \\times 10^7\\ \\mathrm{J}$"
      - text: "พลังงานของอากาศทั้งชั้น $= 10^4 \\times 1005 \\times 1 \\approx 1.0 \\times 10^7\\ \\mathrm{J}$"
        why: "อากาศเหนือพื้นที่ 1 ตารางเมตรมีมวลราว $10^4$ kg ตามความกดอากาศที่ผิวโลกราว $10^5$ Pa หารด้วย g"
      - text: "สองค่านี้ใกล้กัน น้ำทะเลเพียงราว 2.5 m บนสุดจึงเก็บความร้อนได้พอ ๆ กับบรรยากาศทั้งชั้น"
    answer: "ราว $10^7$ J เท่ากัน มหาสมุทรจึงเป็นแหล่งเก็บและขนความร้อนสำคัญของโลก"
  - { type: check, problem: earthscience.ocean.ocean-circulation.p007 }
glossary:
  - { term: ชั้นน้ำผสม, definition: "น้ำชั้นบนสุดที่ลมและคลื่นคลุกเคล้า อุณหภูมิเกือบเท่ากันตลอดชั้น" }
  - { term: เทอร์โมไคลน์, definition: "ชั้นน้ำที่อุณหภูมิลดลงอย่างรวดเร็วตามความลึก อยู่ระหว่างชั้นน้ำผสมกับชั้นน้ำลึก" }
  - { term: การขนส่งเอกแมน, definition: "การเคลื่อนที่สุทธิของน้ำชั้นบนที่ถูกลมลาก ตั้งฉากกับทิศลม ไปทางขวาในซีกโลกเหนือและทางซ้ายในซีกโลกใต้" }
  - { term: วงวนกระแสน้ำ, definition: "ระบบกระแสน้ำผิวหน้าขนาดใหญ่ที่ไหลวนรอบแอ่งมหาสมุทร ตามเข็มนาฬิกาในซีกโลกเหนือ ทวนเข็มนาฬิกาในซีกโลกใต้" }
  - { term: น้ำผุด, definition: "น้ำเย็นจากชั้นล่างที่ลอยขึ้นมาแทนน้ำผิวหน้าที่ถูกพาออกไป นำธาตุอาหารขึ้นมา" }
  - { term: น้ำจม, definition: "น้ำผิวหน้าที่จมลงเมื่อน้ำถูกพาเข้าหาฝั่งหรือกระแสน้ำมาบรรจบกัน" }
  - { term: การหมุนเวียนแบบเทอร์โมฮาลีน, definition: "การหมุนเวียนของน้ำลึกที่เกิดจากความหนาแน่นต่างกันเพราะอุณหภูมิและความเค็ม" }
  - { term: เอลนีโญ, definition: "ภาวะที่ลมค้าอ่อนลงและน้ำผิวหน้าแปซิฟิกตอนกลางและตะวันออกอุ่นผิดปกติ" }
  - { term: ลานีญา, definition: "ภาวะที่ลมค้าแรงกว่าปกติและน้ำผิวหน้าแปซิฟิกตะวันออกเย็นกว่าปกติ" }
flashcards:
  - { front: "ปัจจัยที่ทำให้น้ำทะเลแบ่งชั้น", back: "อุณหภูมิ ความเค็ม (ทำให้ความหนาแน่นต่างกัน) และลมกับคลื่นที่คลุกเคล้าชั้นบน" }
  - { front: "อะไรขับเคลื่อนกระแสน้ำผิวหน้า และอะไรขับเคลื่อนกระแสน้ำลึก", back: "ผิวหน้า: ลม แรงคอริออลิส และทวีป น้ำลึก: ความหนาแน่นจากอุณหภูมิและความเค็ม" }
  - { front: "กระแสน้ำอุ่นและเย็นอยู่ขอบใดของมหาสมุทร", back: "อุ่นไหลจากเขตร้อนตามขอบตะวันตก เย็นไหลจากละติจูดสูงตามขอบตะวันออก" }
  - { front: "ทำไมบริเวณน้ำผุดมีปลามาก", back: "น้ำผุดนำธาตุอาหารขึ้นมา แพลงก์ตอนพืชเติบโต เป็นฐานของโซ่อาหาร" }
  - { front: "เอลนีโญกับลานีญาส่งผลต่อไทยอย่างไร", back: "เอลนีโญ ไทยมักฝนน้อยและแล้ง ลานีญา ไทยมักฝนมากกว่าปกติ เสี่ยงน้ำท่วม" }
