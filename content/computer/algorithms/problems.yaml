problems:
  - id: com.alg.p001
    topics: [computer.algorithms.intro]
    difficulty: 1
    type: order
    stem: "เรียงขั้นตอนการหุงข้าวด้วยหม้อหุงข้าวไฟฟ้าให้ถูกต้อง"
    items:
      - "ตวงข้าวสารใส่หม้อใน"
      - "ซาวข้าวแล้วเทน้ำซาวข้าวทิ้ง"
      - "เติมน้ำให้ถึงขีดบอกระดับ"
      - "วางหม้อในลงในตัวหม้อหุงข้าวแล้วปิดฝา"
      - "เสียบปลั๊กแล้วกดสวิตช์หุง"
    hints:
      - "ขั้นไหนต้องเกิดก่อนจึงจะทำขั้นต่อไปได้"
      - "ซาวข้าวก่อนเติมน้ำหุง และเปิดเครื่องเป็นขั้นสุดท้ายเมื่อทุกอย่างพร้อม"
    solution: "ตวงข้าว → ซาวข้าว → เติมน้ำหุง → ใส่หม้อในและปิดฝา → เสียบปลั๊กกดหุง ถ้าเติมน้ำก่อนซาว น้ำหุงจะถูกเททิ้งไปด้วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.alg.p002
    topics: [computer.algorithms.intro]
    difficulty: 1
    type: match
    stem: "จับคู่รูปร่างของสัญลักษณ์ผังงานกับความหมาย"
    pairs:
      - { left: "วงรี", right: "เริ่มต้นหรือจบ" }
      - { left: "สี่เหลี่ยมผืนผ้า", right: "ประมวลผล เช่น คำนวณ" }
      - { left: "สี่เหลี่ยมข้าวหลามตัด", right: "ตัดสินใจตามเงื่อนไข" }
      - { left: "สี่เหลี่ยมด้านขนาน", right: "รับข้อมูลหรือแสดงผล" }
      - { left: "ลูกศร", right: "ทิศทางการทำงาน" }
    hints:
      - "สัญลักษณ์ใดมีทางออกสองทาง (ใช่/ไม่ใช่)"
      - "สัญลักษณ์ที่มีด้านเอียงใช้กับการรับเข้าและส่งออกข้อมูล"
    solution: "วงรี = เริ่ม/จบ, สี่เหลี่ยมผืนผ้า = ประมวลผล, ข้าวหลามตัด = ตัดสินใจ, สี่เหลี่ยมด้านขนาน = รับ/แสดงผล, ลูกศร = ทิศทาง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.alg.p003
    topics: [computer.algorithms.intro]
    difficulty: 1
    type: mcq
    stem: "อัลกอริทึมชงชาเย็นข้อใด **กำกวม** จนคอมพิวเตอร์หรือหุ่นยนต์ทำตามไม่ได้"
    choices:
      - { id: a, text: "ใส่น้ำตาลพอประมาณ", correct: true }
      - { id: b, text: "ใส่ผงชา 2 ช้อนชาลงในแก้ว", feedback: "ข้อนี้บอกปริมาณและภาชนะชัดเจน ทำตามได้ตรงตัว" }
      - { id: c, text: "เทน้ำร้อน 150 มิลลิลิตร", feedback: "ข้อนี้ระบุปริมาณแน่นอน จึงไม่กำกวม" }
      - { id: d, text: "คนให้เข้ากัน 10 รอบ", feedback: "บอกจำนวนรอบชัดเจน ทำแล้วจบแน่นอน" }
    hints:
      - "ขั้นตอนที่ดีต้องมีความหมายเดียว ทุกคนทำแล้วได้ผลเหมือนกัน"
      - "คำใดที่แต่ละคนตีความได้ไม่เท่ากัน"
    solution: "\"พอประมาณ\" แต่ละคนเข้าใจต่างกัน ต้องระบุเป็นปริมาณแน่นอน เช่น 1 ช้อนโต๊ะ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.alg.p004
    topics: [computer.algorithms.intro]
    difficulty: 2
    type: numeric
    stem: |
      ไล่รหัสลำลองต่อไปนี้ แล้วบอกค่าที่แสดง

      ```
      x = 5
      x = x + 3
      x = x * 2
      show x
      ```
    answer: { value: 16 }
    hints:
      - "ทำทีละบรรทัดจากบนลงล่าง และจดค่า x หลังแต่ละบรรทัด"
      - "บรรทัดที่สามใช้ค่า x ที่เพิ่งได้จากบรรทัดที่สอง ไม่ใช่ค่าเดิม 5"
    misconceptions:
      - { match: 13, feedback: "ดูเหมือนนำ 5 ไปคูณ 2 ก่อนแล้วบวก 3 ลำดับคำสั่งสำคัญ ต้องบวก 3 ก่อน (ได้ 8) แล้วจึงคูณ 2" }
      - { match: 8, feedback: "8 คือค่า x หลังบรรทัดที่สอง ยังต้องทำบรรทัดที่สามที่คูณด้วย 2 ก่อนแสดงผล" }
    solution: "x = 5 → x = 5 + 3 = 8 → x = 8 × 2 = 16 แสดง 16"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.alg.p005
    topics: [computer.algorithms.intro]
    difficulty: 2
    type: numeric
    stem: |
      พัดลมอัจฉริยะทำงานตามอัลกอริทึมนี้ ถ้าอุณหภูมิห้อง `t = 30` พัดลมจะเปิดเบอร์ใด

      ```
      if t > 30:
          speed = 3
      else:
          speed = 1
      ```
    answer: { value: 1 }
    hints:
      - "แทนค่า t แล้วตรวจว่าเงื่อนไข `t > 30` จริงหรือเท็จ"
      - "เครื่องหมาย `>` คือมากกว่า ไม่รวมค่าที่เท่ากัน"
    misconceptions:
      - { match: 3, feedback: "`30 > 30` เป็นเท็จ เพราะ 30 ไม่ได้มากกว่า 30 ถ้าต้องการรวม 30 ต้องเขียน `t >= 30`" }
    solution: "`30 > 30` เป็นเท็จ จึงทำส่วน else ได้ `speed = 1`"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.alg.p006
    topics: [computer.algorithms.intro]
    difficulty: 2
    type: numeric
    stem: |
      หุ่นยนต์ทำตามคำสั่งนี้ หุ่นยนต์เดินไปทั้งหมดกี่ก้าว

      ```
      repeat 4 times:
          walk 3 steps
      ```
    answer: { value: 12, unit: ก้าว }
    hints:
      - "คำสั่งในวงวนทำกี่รอบ แต่ละรอบเดินกี่ก้าว"
      - "รวมก้าวทุกรอบ"
    misconceptions:
      - { match: 7, feedback: "นั่นคือ 4 + 3 แต่การเดิน 3 ก้าวเกิดซ้ำทุกรอบ จึงต้องคูณ 4 × 3" }
      - { match: 3, feedback: "3 ก้าวคือแค่รอบเดียว คำสั่งในวงวนทำซ้ำ 4 รอบ" }
    solution: "เดินรอบละ 3 ก้าว 4 รอบ = 4 × 3 = 12 ก้าว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.alg.p007
    topics: [computer.algorithms.intro]
    difficulty: 2
    type: mcq
    stem: "คำสั่ง \"ถ้าฝนตก ให้พกร่ม ไม่เช่นนั้นให้ใส่หมวก\" ใช้โครงสร้างของอัลกอริทึมแบบใด"
    choices:
      - { id: a, text: "แบบมีทางเลือก (เงื่อนไข)", correct: true }
      - { id: b, text: "แบบลำดับ", feedback: "แบบลำดับทำทุกขั้นเรียงกันไป แต่คำสั่งนี้เลือกทำเพียงอย่างเดียวตามสภาพอากาศ" }
      - { id: c, text: "แบบวนซ้ำ", feedback: "ไม่มีการทำซ้ำในคำสั่งนี้ มีแต่การตรวจเงื่อนไขครั้งเดียวแล้วเลือกทาง" }
    hints:
      - "คำสั่งนี้ทำทั้งสองอย่างหรือเลือกทำอย่างเดียว"
      - "คำว่า \"ถ้า … ไม่เช่นนั้น …\" บอกอะไร"
    solution: "มีการตรวจเงื่อนไข (ฝนตกหรือไม่) แล้วเลือกทำทางใดทางหนึ่ง จึงเป็นแบบมีทางเลือก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.alg.p008
    topics: [computer.algorithms.intro]
    difficulty: 3
    type: numeric
    stem: |
      ไล่รหัสลำลอง แล้วบอกค่าที่แสดง

      ```
      s = 0
      repeat for i = 1 to 5:
          s = s + i
      show s
      ```
    answer: { value: 15 }
    hints:
      - "ทำตารางที่มีคอลัมน์ i และ s แล้วเติมทีละรอบ"
      - "i มีค่า 1, 2, 3, 4, 5 รวม 5 รอบ"
    misconceptions:
      - { match: 10, feedback: "นั่นหยุดที่ i = 4 คำว่า 1 to 5 รวม i = 5 ด้วย" }
      - { match: 5, feedback: "5 คือค่า i รอบสุดท้าย แต่ค่าที่แสดงคือ s ซึ่งสะสมผลบวกของทุกรอบ" }
    solution: "s: 0 → 1 → 3 → 6 → 10 → 15 แสดง 15"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.alg.p009
    topics: [computer.algorithms.intro]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนของผังงาน \"รับจำนวน A และ B แล้วแสดงจำนวนที่มากกว่า\""
    items:
      - "เริ่ม"
      - "รับค่า A และ B"
      - "ตัดสินใจ: A > B หรือไม่"
      - "ถ้าใช่ แสดง A ถ้าไม่ใช่ แสดง B"
      - "จบ"
    hints:
      - "ผังงานเริ่มและจบด้วยวงรีเสมอ"
      - "ต้องมีข้อมูลก่อนจึงจะเปรียบเทียบได้"
    solution: "เริ่ม → รับ A, B → ตรวจ A > B → แสดงตัวที่มากกว่าตามทางที่เลือก → จบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.alg.p010
    topics: [computer.algorithms.intro]
    difficulty: 3
    type: numeric
    stem: |
      ไล่รหัสลำลอง (`//` คือหารแล้วปัดเศษทิ้ง เช่น `5 // 2 = 2`) แล้วบอกค่า `count` ที่แสดง

      ```
      n = 20
      count = 0
      while n > 1:
          n = n // 2
          count = count + 1
      show count
      ```
    answer: { value: 4 }
    hints:
      - "จดค่า n หลังแต่ละรอบ: 20 → ?"
      - "ก่อนเริ่มแต่ละรอบให้ตรวจ `n > 1` ถ้าเท็จให้หยุด"
    misconceptions:
      - { match: 5, feedback: "ดูเหมือนวนต่ออีกรอบเมื่อ n = 1 แต่ `1 > 1` เป็นเท็จ วงวนหยุดแล้ว" }
      - { match: 10, feedback: "10 คือค่า n หลังรอบแรก แต่โจทย์ถามจำนวนรอบ (count)" }
    solution: "n: 20 → 10 → 5 → 2 → 1 หารไป 4 รอบ เมื่อ n = 1 เงื่อนไข `1 > 1` เท็จจึงหยุด แสดง count = 4"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.alg.p011
    topics: [computer.algorithms.intro]
    difficulty: 3
    type: mcq
    stem: |
      อัลกอริทึมหาคะแนนเฉลี่ยของวิชาคณิต วิทย์ และอังกฤษ ทดลองกับคะแนน 6, 6, 6 แล้วได้ 9 ทั้งที่ควรได้ 6 ขั้นใดผิด

      ```
      1. รับคะแนน a, b, c
      2. total = a + b + c
      3. avg = total / 2
      4. show avg
      ```
    choices:
      - { id: a, text: "ขั้นที่ 3 ต้องหารด้วย 3", correct: true }
      - { id: b, text: "ขั้นที่ 2 ต้องเป็น a + b", feedback: "ค่าเฉลี่ยของ 3 วิชาต้องรวมคะแนนทั้งสามวิชา ขั้นที่ 2 ถูกแล้ว ($6 + 6 + 6 = 18$)" }
      - { id: c, text: "ขั้นที่ 1 ต้องรับคะแนน 2 วิชา", feedback: "โจทย์ต้องการเฉลี่ย 3 วิชา จึงต้องรับ 3 ค่า" }
      - { id: d, text: "ขั้นที่ 4 ต้องแสดง total", feedback: "สิ่งที่ต้องการคือค่าเฉลี่ย การแสดง total จะได้ 18 ซึ่งยิ่งผิด" }
    hints:
      - "ไล่ค่าทีละขั้นด้วย 6, 6, 6 ค่าเพี้ยนที่ขั้นใด"
      - "ค่าเฉลี่ยคือผลรวมหารด้วยจำนวนข้อมูล"
    solution: "ขั้นที่ 2 ได้ 18 ถูกต้อง แต่ขั้นที่ 3 หารด้วย 2 ได้ 9 ต้องหารด้วยจำนวนวิชาคือ 3 จึงได้ 6"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.alg.p012
    topics: [computer.algorithms.intro]
    difficulty: 3
    type: numeric
    stem: "ร้านขายข้าวมีข้าวสาร 5 ถุงหน้าตาเหมือนกัน ต้องการหาถุงที่หนักที่สุดด้วยตาชั่งสองแขน วิธีคือชั่งถุงที่ 1 กับถุงที่ 2 เก็บถุงที่หนักกว่าไว้ แล้วนำไปชั่งกับถุงถัดไปเรื่อย ๆ ต้องชั่งทั้งหมดกี่ครั้ง"
    answer: { value: 4, unit: ครั้ง }
    hints:
      - "การชั่งแต่ละครั้งคัดถุงที่เบากว่าออกได้กี่ถุง"
      - "ต้องคัดออกกี่ถุงจึงจะเหลือถุงที่หนักที่สุดถุงเดียว"
    misconceptions:
      - { match: 5, feedback: "ถุงแรกไม่ต้องชั่งแยก มันถูกชั่งพร้อมถุงที่ 2 ในครั้งแรก การชั่งแต่ละครั้งคัดออก 1 ถุง ต้องคัดออก 4 ถุง" }
      - { match: 10, feedback: "10 คือจำนวนการจับคู่ทุกคู่ แต่วิธีนี้เก็บถุงที่หนักกว่าไว้ จึงไม่ต้องเทียบทุกคู่" }
    solution: "แต่ละครั้งคัดถุงที่เบากว่าออก 1 ถุง จาก 5 ถุงต้องคัดออก 4 ถุงให้เหลือถุงเดียว จึงชั่ง 4 ครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.alg.p013
    topics: [computer.algorithms.intro]
    difficulty: 4
    type: numeric
    stem: |
      ไล่รหัสลำลอง (`i mod 3 == 0` แปลว่า i หารด้วย 3 ลงตัว) แล้วบอกค่าที่แสดง

      ```
      c = 0
      repeat for i = 1 to 10:
          if i mod 3 == 0:
              c = c + i
      show c
      ```
    answer: { value: 18 }
    hints:
      - "หาว่า i ใดใน 1 ถึง 10 ที่หารด้วย 3 ลงตัว"
      - "คำสั่งในเงื่อนไขบวก i เข้าไปใน c ไม่ใช่บวก 1"
    misconceptions:
      - { match: 3, feedback: "นั่นคือจำนวนตัวที่หาร 3 ลงตัว แต่คำสั่งคือ `c = c + i` จึงบวกค่า i (3, 6, 9) เข้าไป" }
      - { match: 55, feedback: "นั่นคือผลรวมของ 1 ถึง 10 ทุกตัว แต่บวกเฉพาะเมื่อเงื่อนไขเป็นจริง" }
    solution: "i ที่หาร 3 ลงตัวคือ 3, 6, 9 จึงได้ c = 3 + 6 + 9 = 18"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.alg.p014
    topics: [computer.algorithms.intro]
    difficulty: 4
    type: numeric
    stem: "ค้นหาเลข 7 ในรายการ 4, 9, 2, 7, 5 โดยเปรียบเทียบทีละตัวจากซ้ายไปขวา และหยุดทันทีที่เจอ ต้องเปรียบเทียบกี่ครั้ง"
    answer: { value: 4, unit: ครั้ง }
    hints:
      - "เปรียบเทียบ 7 กับตัวแรก ตัวที่สอง … นับทุกครั้งรวมครั้งที่เจอด้วย"
      - "7 อยู่ตำแหน่งที่เท่าใดเมื่อนับจากซ้ายเริ่มที่ 1"
    misconceptions:
      - { match: 3, feedback: "ครั้งที่เทียบแล้วเจอ 7 ก็นับเป็นการเปรียบเทียบด้วย (เทียบกับ 4, 9, 2 แล้วเทียบกับ 7 เป็นครั้งที่ 4)" }
      - { match: 5, feedback: "อัลกอริทึมหยุดทันทีที่เจอ จึงไม่ต้องเทียบกับ 5 ตัวสุดท้าย" }
    solution: "เทียบกับ 4 (ไม่ใช่) 9 (ไม่ใช่) 2 (ไม่ใช่) 7 (ใช่ หยุด) รวม 4 ครั้ง วิธีนี้เรียกว่าการค้นหาแบบลำดับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: com.alg.p015
    topics: [computer.algorithms.intro]
    difficulty: 4
    type: numeric
    stem: "ไล่ผังงานในภาพ แล้วบอกค่า total ที่แสดง"
    figure: { src: flowchart-loop.svg, alt: "ผังงาน: เริ่ม → ตั้ง n = 1, total = 0 → ตัดสินใจ n <= 9 ? ถ้าใช่ทำ total = total + n แล้ว n = n + 2 แล้วย้อนกลับไปที่การตัดสินใจ ถ้าไม่ใช่ แสดง total แล้วจบ" }
    answer: { value: 25 }
    hints:
      - "จดค่า n และ total ทุกครั้งที่ผ่านกล่อง total = total + n"
      - "n เพิ่มทีละ 2 จึงมีค่า 1, 3, 5, … ตรวจ `n <= 9` ก่อนบวกทุกครั้ง"
