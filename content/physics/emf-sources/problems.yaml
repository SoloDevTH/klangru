    stem: "บ้านหลังหนึ่งติดโซลาร์รูฟท็อปขนาด $3\\ \\mathrm{kW}$ ราคา $120{,}000$ บาท ระบบผลิตไฟฟ้าได้เฉลี่ยวันละ $4\\ \\mathrm{kWh}$ ต่อกำลังติดตั้ง $1\\ \\mathrm{kW}$ และบ้านใช้ไฟที่ผลิตได้ทั้งหมดแทนการซื้อไฟหน่วยละ $4.5$ บาท (ค่าสมมติ) ระยะเวลาคืนทุนเป็นกี่ปี (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 6.1, tolerance: 0.1, unit: ปี }
    misconceptions:
      - { match: 18.3, feedback: "ใช้ $4\\ \\mathrm{kWh}$ ต่อวันสำหรับทั้งระบบ แต่ตัวเลขนี้คิดต่อ $1\\ \\mathrm{kW}$ ระบบ $3\\ \\mathrm{kW}$ ผลิตได้วันละ $12\\ \\mathrm{kWh}$" }
      - { match: 74.1, feedback: "นี่คือระยะเวลาคืนทุนเป็นเดือน (คิดเดือนละ 30 วัน) โจทย์ถามเป็นปี" }
    hints:
      - "ไฟฟ้าที่ผลิตได้ต่อปี $= 3 \\times 4 \\times 365\\ \\mathrm{kWh}$"
      - "เงินที่ประหยัดต่อปี = หน่วยไฟ × 4.5 บาท แล้วระยะคืนทุน = ราคาติดตั้ง ÷ เงินที่ประหยัดต่อปี"
    solution: "ผลิตได้ $3 \\times 4 \\times 365 = 4380\\ \\mathrm{kWh}$ ต่อปี ประหยัด $4380 \\times 4.5 = 19{,}710$ บาทต่อปี ระยะคืนทุน $= \\dfrac{120{,}000}{19{,}710} \\approx 6.1$ ปี (ยังไม่คิดค่าบำรุงรักษาและแผงที่ผลิตไฟลดลงตามอายุ)"
