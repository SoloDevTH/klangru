    ai_assisted: true

  - id: biology.ecology.environmental-issues.p013
    topics: [biology.ecology.environmental-issues]
    difficulty: 4
    type: mcq
    stem: "เกษตรกรรายย่อยเผาตอซังข้าวโพดเพราะเร็วและไม่มีค่าใช้จ่าย ทางแก้ใดน่าจะลดการเผาได้ยั่งยืนที่สุด"
    choices:
      - { id: a, text: "ตั้งจุดรับซื้อตอซังไปทำเชื้อเพลิงชีวมวลหรืออาหารสัตว์ และให้ยืมเครื่องอัดฟางผ่านกลุ่มเกษตรกร", correct: true }
      - { id: b, text: "แจกหน้ากากให้ประชาชนทุกคน", feedback: "ช่วยป้องกันสุขภาพ แต่ไม่ได้ลดการเผาซึ่งเป็นต้นเหตุ" }
      - { id: c, text: "ประกาศห้ามเผาโดยไม่มีทางเลือกอื่นให้เกษตรกร", feedback: "การห้ามช่วยได้บ้าง แต่ถ้าทางเลือกแพงกว่ามาก อาจเกิดการลักลอบเผา" }
      - { id: d, text: "ให้เกษตรกรเผาตอนกลางคืนแทน", feedback: "ฝุ่นยังเกิดเท่าเดิม และกลางคืนอากาศนิ่ง ฝุ่นอาจสะสมมากขึ้น" }
    hints:
      - "เกษตรกรเลือกเผาเพราะเหตุผลทางต้นทุน"
      - "ทางแก้ใดทำให้ทางเลือกอื่นคุ้มกว่าการเผา"
    solution: "การรับซื้อตอซังและให้เข้าถึงเครื่องจักรทำให้ทางเลือกอื่นคุ้มกว่าการเผา จึงแก้ที่ต้นเหตุและเป็นธรรมกับเกษตรกร ส่วนการห้ามอย่างเดียวอาจได้ผลน้อยถ้าไม่มีทางเลือก"
