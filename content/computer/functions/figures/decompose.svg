<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" width="860" height="310" font-family="sans-serif" font-size="14">
  <title>แยกโปรแกรมตัดเกรดเป็นฟังก์ชันย่อยสามตัว แต่ละตัวรับค่าทางพารามิเตอร์และคืนค่าให้ตัวถัดไป</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="860" height="310" fill="#ffffff"/>
  <rect x="280.0" y="20.0" width="300.0" height="60.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="430.0" y="46.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">report(name, scores)</text>
  <text x="430.0" y="70.0" font-size="12" text-anchor="middle" fill="#1f2937" xml:space="preserve">ฟังก์ชันหลัก เรียกฟังก์ชันย่อยตามลำดับ</text>
  <rect x="30.0" y="170.0" width="240.0" height="90.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="150.0" y="202.9" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">total(scores)</text>
  <text x="150.0" y="226.9" font-size="12" text-anchor="middle" fill="#1f2937" xml:space="preserve">รวมคะแนนในลิสต์</text>
  <text x="150.0" y="243.1" font-size="12" text-anchor="middle" fill="#1f2937" xml:space="preserve">คืนจำนวน เช่น 78</text>
  <line x1="430.0" y1="80.0" x2="150.0" y2="168.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="310.0" y="170.0" width="240.0" height="90.0" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="430.0" y="202.9" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">to_grade(points)</text>
  <text x="430.0" y="226.9" font-size="12" text-anchor="middle" fill="#1f2937" xml:space="preserve">แปลงคะแนนเป็นเกรด</text>
  <text x="430.0" y="243.1" font-size="12" text-anchor="middle" fill="#1f2937" xml:space="preserve">คืน 3.5 เมื่อ 75–79</text>
  <line x1="430.0" y1="80.0" x2="430.0" y2="168.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="590.0" y="170.0" width="240.0" height="90.0" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="710.0" y="202.9" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">show(name, grade)</text>
  <text x="710.0" y="226.9" font-size="12" text-anchor="middle" fill="#1f2937" xml:space="preserve">แสดงผลบนจอ</text>
  <text x="710.0" y="243.1" font-size="12" text-anchor="middle" fill="#1f2937" xml:space="preserve">ไม่ต้องคืนค่า</text>
  <line x1="430.0" y1="80.0" x2="710.0" y2="168.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="272.0" y1="215.0" x2="308.0" y2="215.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="290.0" y="206.0" font-size="12" text-anchor="middle" fill="#6b7280" xml:space="preserve">78</text>
  <line x1="552.0" y1="215.0" x2="588.0" y2="215.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="570.0" y="206.0" font-size="12" text-anchor="middle" fill="#6b7280" xml:space="preserve">3.5</text>
  <text x="430.0" y="295.0" font-size="13" text-anchor="middle" fill="#6b7280" xml:space="preserve">report เรียก total ก่อน แล้วส่งผลต่อให้ to_grade และ show ตามลำดับ</text>
</svg>
