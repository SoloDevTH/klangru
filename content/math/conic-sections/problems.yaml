  - id: math.geometry.conic-sections.p021
    topics: [math.geometry.conic-sections]
    difficulty: 5
    type: numeric
    stem: "จุด $P(x, y)$ เคลื่อนที่โดยระยะจาก $P$ ถึง $(0, 0)$ เป็นสองเท่าของระยะจาก $P$ ถึง $(3, 0)$ เสมอ ทางเดินของ $P$ เป็นวงกลม จงหารัศมีของวงกลมนี้"
    answer: { value: 2, unit: หน่วย }
    hints:
      - "ตั้งสมการ $\\sqrt{x^2 + y^2} = 2\\sqrt{(x - 3)^2 + y^2}$ แล้วยกกำลังสอง"
      - "จัดรูปแล้วทำกำลังสองสมบูรณ์"
    misconceptions:
      - { match: 4, feedback: "4 คือพิกัด $x$ ของจุดศูนย์กลาง $(4, 0)$ ไม่ใช่รัศมี" }
      - { match: 3, feedback: "3 คือระยะระหว่างจุดคงที่สองจุด ต้องตั้งสมการแล้วหาจริง" }
    solution: "$x^2 + y^2 = 4(x^2 - 6x + 9 + y^2) \\Rightarrow 3x^2 + 3y^2 - 24x + 36 = 0 \\Rightarrow x^2 - 8x + y^2 + 12 = 0 \\Rightarrow (x - 4)^2 + y^2 = 4$ รัศมี 2"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.conic-sections.p022
    topics: [math.geometry.conic-sections]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการหาจุดศูนย์กลางและรัศมีของวงกลม $x^2 + y^2 + 10x - 4y + 20 = 0$"
    items:
      - "จัดกลุ่ม $(x^2 + 10x) + (y^2 - 4y) = -20$"
      - "เติม 25 และ 4 ทั้งสองข้าง"
      - "เขียน $(x + 5)^2 + (y - 2)^2 = 9$"
      - "อ่านจุดศูนย์กลาง $(-5, 2)$ และรัศมี 3"
    hints:
      - "เริ่มจากแยกพจน์ $x$ และ $y$"
      - "เติมกำลังสองของครึ่งหนึ่งของสัมประสิทธิ์"
    solution: "จัดกลุ่ม → เติม $5^2$ และ $2^2$ → $(x + 5)^2 + (y - 2)^2 = -20 + 25 + 4 = 9$ → จุดศูนย์กลาง $(-5, 2)$ รัศมี 3"
    license: CC-BY-SA-4.0
    ai_assisted: true
