id: health.body.nervous-endocrine-care
subject: health
title: { th: "ระบบประสาทและระบบต่อมไร้ท่อ: ความสำคัญและการดูแล", en: "Nervous and endocrine systems: importance and care" }
summary: บทบาทของสมอง ไขสันหลัง และฮอร์โมนจากต่อมไร้ท่อต่อสุขภาพ การเติบโต และพัฒนาการของวัยรุ่น การนอน อาหาร การจัดการความเครียด และการป้องกันการบาดเจ็บที่ศีรษะ
difficulty: 3.5
minutes: 30
prerequisites: [health.body.circulatory-respiratory-reproductive-care]
encompasses:
  - { id: health.body.circulatory-respiratory-reproductive-care, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: สมอง ไขสันหลัง และต่อมไร้ท่อที่สำคัญ
    src: glands.svg
    alt: "แผนภาพร่างกายอย่างง่าย สมองและไขสันหลังเป็นสีม่วง ป้ายด้านซ้าย ไฮโพทาลามัส (ในสมอง) เชื่อมระบบประสาทกับต่อมไร้ท่อ ต่อมใต้สมอง โกรทฮอร์โมน และสั่งต่อมอื่น ต่อมไทรอยด์ที่คอ ไทรอกซิน คุมการเผาผลาญ ต้องใช้ไอโอดีน ไขสันหลัง ทางผ่านกระแสประสาท ศูนย์รีเฟล็กซ์ ป้ายด้านขวา สมอง คิด จำ ตัดสินใจ สั่งการ ต่อมหมวกไต (บนไต) อะดรีนาลีน เมื่อตกใจหรือเครียด ตับอ่อน อินซูลิน ลดน้ำตาลในเลือด รังไข่ (หญิง) หรืออัณฑะ (ชาย) ฮอร์โมนเพศ ทำให้ร่างกายเปลี่ยนในวัยรุ่น"
    caption: "แผนภาพอย่างง่าย ตำแหน่งโดยประมาณ ไม่ใช่ขนาดจริง"
  - type: worked-example
    title: ทำไมใจยังเต้นแรงหลังเหตุการณ์จบ
    problem: "ระหว่างเดินกลับบ้าน รถจักรยานยนต์คันหนึ่งเฉียดตัวพลอยไปอย่างเร็ว พลอยกระโดดหลบทัน แต่ใจเต้นแรงและมือสั่นต่ออีกหลายนาที อธิบายว่าระบบใดทำงานบ้าง"
    steps:
      - text: "การกระโดดหลบเกิดในเสี้ยววินาที: ตาเห็นรถ กระแสประสาทไปถึงสมองและไขสันหลัง แล้วสั่งกล้ามเนื้อขา นี่คือระบบประสาท"
      - text: "สมองสั่งให้ต่อมหมวกไตหลั่งอะดรีนาลีนเข้าสู่เลือด หัวใจจึงเต้นเร็วและหายใจเร็ว นี่คือระบบต่อมไร้ท่อ"
      - text: "อะดรีนาลีนยังอยู่ในเลือดอีกระยะหนึ่ง ใจจึงเต้นแรงต่อแม้รถผ่านไปแล้ว"
        why: "ฮอร์โมนเดินทางไปกับเลือด ผลจึงอยู่นานกว่ากระแสประสาท"
      - text: "ช่วยให้สงบได้ด้วยการหยุดพักในที่ปลอดภัยและหายใจช้า ๆ"
    answer: "ระบบประสาททำให้หลบได้ทันที ระบบต่อมไร้ท่อ (อะดรีนาลีนจากต่อมหมวกไต) ทำให้ใจเต้นแรงอยู่นาน"
  - { type: check, problem: health.body.nervous-endocrine-care.p011, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: worked-example
    title: วางแผนเวลานอนให้พอ
    problem: "ฟ้าอายุ 14 ปี ต้องตื่นตอน 06:30 น. และปกติใช้เวลาราว 15 นาทีกว่าจะหลับ ถ้าฟ้าต้องการนอนหลับให้ได้ 8 ชั่วโมงครึ่ง ควรเข้านอนกี่โมง และควรวางมือถือกี่โมง"
    steps:
      - text: "วัยรุ่นอายุ 13–17 ปี ควรนอน 8–10 ชั่วโมงต่อคืน 8 ชั่วโมงครึ่งอยู่ในช่วงนี้"
      - text: "นับย้อนจาก 06:30 น. ไป 8 ชั่วโมงครึ่ง ได้ 22:00 น. ซึ่งเป็นเวลาที่ต้องหลับแล้ว"
      - text: "เผื่อเวลากว่าจะหลับ 15 นาที จึงควรเข้านอน 21:45 น."
        why: "เวลาที่อยู่บนเตียงไม่เท่ากับเวลาที่หลับจริง"
      - text: "ควรปิดอุปกรณ์อิเล็กทรอนิกส์อย่างน้อย 30 นาทีก่อนนอน คือวางมือถือภายใน 21:15 น."
    answer: "เข้านอน 21:45 น. และวางมือถือภายใน 21:15 น."
  - { type: check, problem: health.body.nervous-endocrine-care.p003 }
glossary:
  - { term: ระบบประสาท, definition: "ระบบที่ประกอบด้วยสมอง ไขสันหลัง และเส้นประสาท สั่งการร่างกายอย่างรวดเร็วด้วยกระแสประสาท" }
  - { term: ต่อมไร้ท่อ, definition: "ต่อมที่ปล่อยฮอร์โมนเข้าสู่กระแสเลือดโดยตรง ไม่มีท่อ เช่น ต่อมใต้สมอง ต่อมไทรอยด์ ต่อมหมวกไต" }
  - { term: ฮอร์โมน, definition: "สารเคมีที่ต่อมไร้ท่อสร้าง เดินทางไปกับเลือด และควบคุมการทำงานของอวัยวะเป้าหมาย" }
  - { term: ไอโอดีน, definition: "แร่ธาตุที่ต่อมไทรอยด์ใช้สร้างไทรอกซิน พบในอาหารทะเลและเกลือเสริมไอโอดีน" }
  - { term: อะดรีนาลีน, definition: "ฮอร์โมนจากต่อมหมวกไตที่หลั่งเมื่อตกใจหรือเครียด ทำให้หัวใจเต้นเร็วและร่างกายตื่นตัว" }
flashcards:
  - { front: "ระบบประสาท vs ระบบต่อมไร้ท่อ", back: "ประสาท: กระแสประสาท เร็ว ผลสั้น / ต่อมไร้ท่อ: ฮอร์โมนในเลือด ช้ากว่า ผลนาน" }
  - { front: "โกรทฮอร์โมนหลั่งมากที่สุดเมื่อใด", back: "ช่วงแรกของการหลับลึก การนอนพอจึงสำคัญต่อการเติบโต" }
  - { front: "วัยรุ่น 13–17 ปีควรนอนกี่ชั่วโมง", back: "8–10 ชั่วโมงต่อคืน และปิดหน้าจออย่างน้อย 30 นาทีก่อนนอน" }
  - { front: "ศีรษะกระแทกแล้วอาเจียน ง่วงซึม ชัก หรือหมดสติ", back: "โทร 1669 ทันที ไม่เคลื่อนย้ายเองถ้าอาจบาดเจ็บที่คอ" }
