  - id: health.disease.illness-symptoms-care.p018
    topics: [health.disease.illness-symptoms-care]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "สัปดาห์นี้ในห้อง ป.2 มีคนบาดเจ็บ 3 คน คนแรกวิ่งบนพื้นระเบียงที่เปียกฝนแล้วลื่นล้ม คนที่สองเล่นฟุตบอลเท้าเปล่าแล้วโดนเศษแก้วบาด คนที่สามเตะบอลทันทีโดยไม่อบอุ่นร่างกายแล้วกล้ามเนื้อขาตึง ข้อใดเป็นวิธีป้องกันที่ตรงกับสาเหตุ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "เดินช้า ๆ และไม่วิ่งบนพื้นที่เปียก", correct: true }
      - { id: b, text: "สวมรองเท้าและสำรวจสนามก่อนเล่น", correct: true }
      - { id: c, text: "อบอุ่นร่างกายและยืดเหยียดก่อนเล่นกีฬา", correct: true }
      - { id: d, text: "ห้ามทุกคนเล่นกีฬาตลอดไป", feedback: "การเล่นกีฬามีประโยชน์ การป้องกันคือเล่นอย่างปลอดภัย ไม่ใช่เลิกเล่น" }
      - { id: e, text: "กินยาแก้ปวดดักไว้ก่อนเล่น", feedback: "ยาแก้ปวดไม่ได้ป้องกันการบาดเจ็บ และไม่ควรกินยาโดยไม่จำเป็น" }
    hints:
      - "หาสาเหตุของแต่ละคนก่อน: พื้น อุปกรณ์และการแต่งกาย ร่างกายผู้เล่น"
      - "วิธีป้องกันต้องแก้ที่สาเหตุ"
    solution: "พื้นเปียก → ไม่วิ่ง, เท้าเปล่าในสนามที่มีเศษแก้ว → สวมรองเท้าและสำรวจสนาม, ไม่อบอุ่นร่างกาย → อบอุ่นและยืดเหยียดก่อนเล่น"
