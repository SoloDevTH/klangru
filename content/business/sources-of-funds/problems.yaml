  difficulty: 4
  type: numeric
  stem: หุ้นบริษัทสมมติราคา $63$ บาท เพิ่งจ่ายเงินปันผล $D_0 = 3$ บาท คาดว่าเงินปันผลโตคงที่ $5\%$ ต่อปี ต้นทุนส่วนของผู้ถือหุ้นตามแบบจำลองกอร์ดอนเป็นกี่เปอร์เซ็นต์
  answer:
    value: 10.0
    tolerance: 0.02
    unit: '%'
  misconceptions:
  - match: 9.761905
    feedback: ใช้ $D_0$ แทน $D_1$
  hints:
  - ต้องใช้เงินปันผล **ปีหน้า** $D_1 = D_0(1 + g)$
  - $k_e = D_1 / P_0 + g$
  solution: $D_1 = 3 \times 1.05 = 3.15$ $k_e = 3.15 / 63 + 0.05 = 0.05 + 0.05 = 10\%$
