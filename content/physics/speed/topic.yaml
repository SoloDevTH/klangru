id: physics.kinematics.speed
subject: physics
title: { th: ระยะทางและอัตราเร็ว, en: Distance and speed }
summary: อัตราเร็วบอกว่าวัตถุเคลื่อนที่ได้ระยะทางเท่าใดในหนึ่งหน่วยเวลา และอัตราเร็วเฉลี่ยคือระยะทางรวมหารด้วยเวลารวม ไม่ใช่ค่าเฉลี่ยของอัตราเร็ว
difficulty: 2.5
minutes: 25
prerequisites: [physics.units.si, math.algebra.linear-eq]
encompasses:
  - { id: physics.units.si, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
glossary:
  - { term: ระยะทาง, definition: "ความยาวของเส้นทางที่วัตถุเคลื่อนที่ไปจริง ไม่สนทิศทาง มีหน่วยเมตร (m)" }
  - { term: อัตราเร็ว, definition: "ระยะทางที่เคลื่อนที่ได้ในหนึ่งหน่วยเวลา $v = s/t$ มีหน่วยเมตรต่อวินาที (m/s)" }
  - { term: อัตราเร็วเฉลี่ย, definition: "ระยะทางรวมหารด้วยเวลารวมของการเดินทางทั้งหมด" }
  - { term: อัตราเร็วขณะหนึ่ง, definition: "อัตราเร็ว ณ เวลาใดเวลาหนึ่ง เช่น ค่าที่เข็มมาตรวัดบนหน้าปัดรถชี้อยู่" }
flashcards:
  - { front: "สูตรอัตราเร็ว", back: "$v = \\dfrac{s}{t}$ เมื่อ $s$ คือระยะทาง (m) และ $t$ คือเวลา (s)" }
  - { front: "อัตราเร็วเฉลี่ยหาอย่างไร", back: "ระยะทางรวม ÷ เวลารวม ห้ามเอาอัตราเร็วแต่ละช่วงมาบวกแล้วหาร 2" }
  - { front: "วิ่ง 400 m ใน 80 s มีอัตราเร็วเฉลี่ยเท่าใด", back: "$400\\ \\mathrm{m} \\div 80\\ \\mathrm{s} = 5\\ \\mathrm{m/s}$" }
  - { front: "มาตรวัดบนหน้าปัดรถบอกอัตราเร็วแบบไหน", back: "อัตราเร็วขณะหนึ่ง ไม่ใช่อัตราเร็วเฉลี่ยตลอดทาง" }
