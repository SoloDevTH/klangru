  <text x="268.0" y="394.0" text-anchor="start" fill="#1f2937" font-size="13">คุณภาพพื้นฐาน</text>
  <circle cx="367.1" cy="112.9" r="16" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="367.1" y="117.9" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">A</text>
  <circle cx="168.2" cy="296.5" r="16" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="168.2" y="301.5" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">B</text>
  <circle cx="183.5" cy="158.8" r="16" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="183.5" y="163.8" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">C</text>
  <circle cx="351.8" cy="281.2" r="16" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
