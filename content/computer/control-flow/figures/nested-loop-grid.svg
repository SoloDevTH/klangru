  <rect x="150" y="122" width="84" height="52" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="192.0" y="154.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#15211e">5</text>
  <rect x="234" y="122" width="84" height="52" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="276.0" y="154.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#15211e">6</text>
  <rect x="318" y="122" width="84" height="52" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="360.0" y="154.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#15211e">7</text>
  <rect x="402" y="122" width="84" height="52" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="444.0" y="154.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#15211e">8</text>
  <text x="136" y="205.0" text-anchor="end" font-size="14" font-weight="normal" fill="#15211e">i = 3</text>
  <rect x="150" y="174" width="84" height="52" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="192.0" y="206.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#15211e">9</text>
  <rect x="234" y="174" width="84" height="52" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="276.0" y="206.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#15211e">10</text>
