problems:
  - id: chemistry.mixtures.separating-mixtures.p001
    topics: [chemistry.mixtures.separating-mixtures]
    difficulty: 1
    type: mcq
    stem: "ก่อนหุงข้าว แม่เห็นเม็ดกรวดสีเทาปนอยู่ในข้าวสารไม่กี่เม็ด วิธีใดเหมาะที่สุด"
    choices:
      - { id: a, text: "หยิบเม็ดกรวดออก", correct: true, feedback: "ถูก กรวดมีน้อย ชิ้นใหญ่ และสีต่างจากข้าว จึงหยิบออกได้ง่าย" }
      - { id: b, text: "ใช้แม่เหล็กดูด", feedback: "กรวดไม่มีเหล็ก แม่เหล็กจึงดูดไม่ได้" }
      - { id: c, text: "กรองด้วยกระดาษกรอง", feedback: "การกรองแยกของแข็งออกจากของเหลว ข้าวสารกับกรวดเป็นของแข็งทั้งคู่" }
    hints:
      - "กรวดมีกี่เม็ด และมองเห็นชัดหรือไม่"
      - "ของชิ้นใหญ่ที่มีน้อยและสีต่างกัน แยกด้วยมือได้"
    solution: "กรวดมีน้อย ชิ้นใหญ่ มองเห็นชัด จึงใช้ **การหยิบออก** ง่ายที่สุดและไม่ต้องใช้อุปกรณ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.mixtures.separating-mixtures.p002
    topics: [chemistry.mixtures.separating-mixtures]
    difficulty: 1
    type: match
    stem: "จับคู่สารผสมกับวิธีแยกที่เหมาะสม"
    pairs:
      - { left: "ทรายปนผงตะไบเหล็ก", right: "ใช้แม่เหล็กดูด" }
      - { left: "แป้งที่จับกันเป็นก้อนเล็ก ๆ", right: "การร่อน" }
      - { left: "มะพร้าวขูดผสมน้ำ เพื่อเอากะทิ", right: "การกรองผ่านผ้าขาวบาง" }
      - { left: "น้ำต้มข้าวที่ข้าวจมอยู่ก้นหม้อ", right: "การรินออก" }
    hints:
      - "ดูว่าสารสองชนิดต่างกันที่ขนาด การถูกแม่เหล็กดูด หรือการจม"
      - "ของแข็งที่ไม่ละลายในของเหลวแยกด้วยการกรอง"
    solution: "ผงเหล็กถูกแม่เหล็กดูด · ก้อนแป้งใหญ่กว่ารูตะแกรง จึงร่อน · กากมะพร้าวค้างบนผ้าขาวบาง กะทิผ่านลงไป เป็นการกรอง · ข้าวจมก้นหม้อจึงรินน้ำออกได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.mixtures.separating-mixtures.p003
    topics: [chemistry.mixtures.separating-mixtures]
    difficulty: 2
    type: text
    stem: "ชาวบ้านริมแม่น้ำแกว่งสารส้มในโอ่งน้ำขุ่น แล้วตั้งทิ้งไว้ให้ตะกอนจมลงก้นโอ่ง วิธีแยกสารนี้เรียกว่าอะไร"
    accepted: ["การตกตะกอน", "ตกตะกอน"]
    misconceptions:
      - { match: "การกรอง", feedback: "ไม่มีวัสดุกรองในขั้นนี้ ตะกอนแยกออกเพราะจมลงก้นโอ่ง" }
      - { match: "การรินออก", feedback: "การรินออกทำหลังจากตะกอนจมแล้ว ขั้นที่ทำให้ตะกอนจมเรียกว่าอะไร" }
    hints:
      - "สังเกตว่าตะกอนไปอยู่ที่ใดหลังตั้งทิ้งไว้"
      - "สารส้มทำให้ตะกอนเล็ก ๆ จับกันเป็นก้อนใหญ่แล้วจมเร็วขึ้น"
    solution: "ตะกอนแขวนลอยจับกันเป็นก้อนแล้วจมลงก้นโอ่ง เรียกว่า **การตกตะกอน** จากนั้นจึงรินหรือตักน้ำใสด้านบนไปใช้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.mixtures.separating-mixtures.p004
    topics: [chemistry.mixtures.separating-mixtures]
    difficulty: 2
    type: mcq
    stem: "นักเรียนกรองน้ำเกลือด้วยกระดาษกรอง แล้วชิมสารกรองที่ได้ (เกลือแกงที่ครูเตรียม ชิมได้) จะพบอะไร"
    choices:
      - { id: a, text: "ยังเค็มเหมือนเดิม เพราะเกลือที่ละลายแล้วผ่านกระดาษกรองได้", correct: true, feedback: "ถูก อนุภาคเกลือที่ละลายเล็กกว่ารูของกระดาษกรองมาก" }
      - { id: b, text: "จืด เพราะเกลือค้างอยู่บนกระดาษกรอง", feedback: "เกลือที่ละลายแล้วไม่เป็นเม็ดให้กระดาษกรองดักไว้ได้ ลองดูว่าบนกระดาษมีเกลือเหลือหรือไม่" }
      - { id: c, text: "เค็มน้อยลงครึ่งหนึ่ง", feedback: "กระดาษกรองไม่ได้ดักเกลือที่ละลายไว้เลย ความเค็มจึงไม่ลดลง" }
    hints:
      - "การกรองแยกของแข็งชนิดใดได้"
      - "สารที่ละลายแล้วกระจายเป็นอนุภาคเล็กมาก"
    solution: "การกรองแยกได้เฉพาะของแข็งที่ **ไม่ละลาย** เกลือที่ละลายผ่านกระดาษกรองไปกับน้ำ สารกรองจึงเค็มเท่าเดิม ถ้าต้องการเกลือคืนต้องใช้การระเหยหรือการตกผลึก (ในห้องปฏิบัติการปกติห้ามชิมสาร ข้อนี้ใช้เกลือแกงที่ครูเตรียมเพื่อการทดลองนี้เท่านั้น)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.mixtures.separating-mixtures.p005
    topics: [chemistry.mixtures.separating-mixtures]
    difficulty: 2
    type: numeric
    stem: "ในโครมาโทกราฟีแบบกระดาษ ตัวทำละลายเคลื่อนที่ขึ้นไป 6.0 cm จากเส้นเริ่มต้น และจุดสีม่วงเคลื่อนที่ได้ 3.6 cm จงหาค่า $R_f$ ของสีม่วง (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 0.6, tolerance: 0.01 }
    misconceptions:
      - { match: 1.67, feedback: "หารกลับด้าน $R_f$ ต้องไม่เกิน 1 ให้นำระยะของสารหารด้วยระยะของตัวทำละลาย" }
    hints:
      - "$R_f$ = ระยะที่สารเคลื่อนที่ ÷ ระยะที่ตัวทำละลายเคลื่อนที่"
      - "สารเคลื่อนที่ไม่ไกลกว่าตัวทำละลาย ค่าจึงไม่เกิน 1"
    solution: "$R_f = \\dfrac{3.6}{6.0} = 0.60$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.mixtures.separating-mixtures.p006
    topics: [chemistry.mixtures.separating-mixtures]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการแยกเกลือออกจากทรายที่ปนกัน ให้ได้เกลือที่เป็นของแข็งคืนมา"
    items:
      - "เติมน้ำลงในของผสมแล้วคนให้เกลือละลาย"
      - "กรองด้วยกระดาษกรอง ทรายค้างบนกระดาษ"
      - "นำสารกรอง (น้ำเกลือ) ไประเหยน้ำออก"
      - "ได้ผลึกเกลือในภาชนะ"
    hints:
      - "สารใดละลายน้ำ สารใดไม่ละลาย"
      - "ต้องแยกทรายออกก่อนจึงจะระเหยเอาเกลือได้"
    solution: "ละลายเกลือในน้ำ → กรองแยกทรายที่ไม่ละลาย → ระเหยน้ำเกลือ → ได้เกลือ ถ้าระเหยก่อนกรอง เกลือจะกลับมาปนกับทรายอีก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.mixtures.separating-mixtures.p007
    topics: [chemistry.mixtures.separating-mixtures]
    difficulty: 3
    type: mcq
    stem: "การกลั่นอย่างง่ายแยกน้ำออกจากน้ำหมึกได้ เพราะใช้สมบัติข้อใดของสารที่ต่างกัน"
    choices:
      - { id: a, text: "จุดเดือด", correct: true, feedback: "ถูก น้ำเดือดกลายเป็นไอ ส่วนสีในหมึกไม่ระเหยตามไป" }
      - { id: b, text: "ขนาดของอนุภาค", feedback: "นั่นคือหลักของการกรองและการร่อน การกลั่นไม่ได้ใช้รูกรอง" }
      - { id: c, text: "การถูกแม่เหล็กดูด", feedback: "การกลั่นไม่มีแม่เหล็กเกี่ยวข้อง" }
      - { id: d, text: "สี", feedback: "สีช่วยให้เห็นว่าแยกสำเร็จ แต่ไม่ใช่สมบัติที่ทำให้แยกกันได้" }
    hints:
      - "ขั้นแรกของการกลั่นคือให้ความร้อนจนสารหนึ่งกลายเป็นไอ"
      - "สารที่กลายเป็นไอก่อนคือสารที่เดือดที่อุณหภูมิต่ำกว่า"
    solution: "การกลั่นใช้ **จุดเดือดที่ต่างกัน** น้ำเดือดที่ 100 °C กลายเป็นไอ แล้วควบแน่นเป็นน้ำใส ส่วนสีที่ไม่ระเหยค้างอยู่ในขวด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.mixtures.separating-mixtures.p008
    topics: [chemistry.mixtures.separating-mixtures]
    difficulty: 3
    type: numeric
    stem: "จากแผ่นโครมาโทกราฟีในภาพ จงหาค่า $R_f$ ของสาร B (ตอบทศนิยม 2 ตำแหน่ง)"
    figure:
      src: p-chromatogram.svg
      alt: "แผ่นกระดาษโครมาโทกราฟีวางข้างไม้บรรทัด 0 ถึง 9 เซนติเมตร เส้นเริ่มต้นอยู่ที่ 0 cm ระดับตัวทำละลายอยู่ที่ 8.0 cm จุดสีเหลือง A อยู่ที่ 2.4 cm และจุดสีน้ำเงิน B อยู่ที่ 5.6 cm ปลายล่างของกระดาษจุ่มอยู่ในตัวทำละลายใต้เส้นเริ่มต้น"
    answer: { value: 0.7, tolerance: 0.01 }
    misconceptions:
      - { match: 0.3, feedback: "นั่นคือ $R_f$ ของ A (2.4 ÷ 8.0) โจทย์ถามสาร B" }
      - { match: 1.43, feedback: "หารกลับด้าน ต้องนำระยะของสารหารด้วยระยะของตัวทำละลาย" }
    hints:
      - "อ่านระยะจากเส้นเริ่มต้น (0 cm) ถึงกลางจุด B และถึงระดับตัวทำละลาย"
      - "$R_f$ = ระยะของ B ÷ ระยะของตัวทำละลาย"
    solution: "B อยู่สูง 5.6 cm ตัวทำละลายขึ้นไป 8.0 cm · $R_f = \\dfrac{5.6}{8.0} = 0.70$ (ส่วน A มี $R_f = 2.4/8.0 = 0.30$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.mixtures.separating-mixtures.p009
    topics: [chemistry.mixtures.separating-mixtures]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "สารผสมข้อใดแยกได้ด้วยการกรอง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "น้ำโคลน", correct: true, feedback: "ถูก ดินและทรายไม่ละลายน้ำ จึงค้างบนกระดาษกรอง" }
      - { id: b, text: "น้ำผสมผงถ่าน", correct: true, feedback: "ถูก ผงถ่านไม่ละลายน้ำ" }
      - { id: c, text: "น้ำเชื่อม", feedback: "น้ำตาลละลายในน้ำแล้ว ผ่านกระดาษกรองได้" }
      - { id: d, text: "น้ำเกลือ", feedback: "เกลือละลายในน้ำแล้ว ต้องใช้การระเหยหรือการกลั่น" }
    hints:
      - "การกรองแยกของแข็งที่ไม่ละลายออกจากของเหลว"
      - "ถามตัวเองว่าของแข็งในแต่ละข้อละลายน้ำหรือไม่"
    solution: "ดินในน้ำโคลนและผงถ่านไม่ละลายน้ำ จึงกรองได้ ส่วนน้ำตาลในน้ำเชื่อมและเกลือในน้ำเกลือละลายแล้ว กรองไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.mixtures.separating-mixtures.p010
    topics: [chemistry.mixtures.separating-mixtures]
    difficulty: 3
    type: text
    stem: "โรงงานผลิตน้ำมันตะไคร้หอมผ่านไอน้ำร้อนเข้าไปในกองต้นตะไคร้ ไอน้ำพาน้ำมันหอมระเหยออกมาแล้วควบแน่นเป็นของเหลวสองชั้น วิธีนี้เรียกว่าอะไร"
    accepted: ["การกลั่นด้วยไอน้ำ", "กลั่นด้วยไอน้ำ", "การกลั่นโดยใช้ไอน้ำ", "steam distillation"]
    misconceptions:
      - { match: "การกลั่นอย่างง่าย", feedback: "เป็นการกลั่นก็จริง แต่ในข้อนี้ไม่ได้ต้มตะไคร้โดยตรง ใช้ไอน้ำพาน้ำมันออกมา จึงมีชื่อเฉพาะ" }
      - { match: "การสกัดด้วยตัวทำละลาย", feedback: "การสกัดด้วยตัวทำละลายใช้ของเหลว เช่น เอทานอล ละลายสาร ข้อนี้ใช้ไอน้ำ" }
    hints:
      - "สารที่พาน้ำมันออกมาคืออะไร"
      - "เป็นการกลั่นชนิดหนึ่งที่ใช้ไอของน้ำ"
    solution: "ใช้ไอน้ำพาน้ำมันหอมระเหยออกมาที่อุณหภูมิไม่สูงมาก แล้วควบแน่น เรียกว่า **การกลั่นด้วยไอน้ำ** น้ำมันไม่ละลายน้ำจึงแยกเป็นชั้น รินหรือใช้กรวยแยกออกได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.mixtures.separating-mixtures.p011
    topics: [chemistry.mixtures.separating-mixtures]
    difficulty: 4
    type: mcq
    stem: "หน่วยตรวจอาหารนำสีแดงจากขนมชั้นไปทำโครมาโทกราฟีบนกระดาษแผ่นเดียวกับสีมาตรฐาน 3 ชนิด สีจากขนมให้ 2 จุด มีค่า $R_f$ 0.30 และ 0.75 สีมาตรฐานให้ผลดังนี้ P: 0.30 และ 0.55 · Q: 0.30 และ 0.75 · R: 0.75 เพียงจุดเดียว สีในขนมตรงกับสีมาตรฐานใด"
    choices:
      - { id: a, text: "Q", correct: true, feedback: "ถูก ทั้งสองจุดมี $R_f$ ตรงกัน" }
      - { id: b, text: "P", feedback: "P มีจุด 0.30 ตรงกันก็จริง แต่จุด 0.55 ไม่ตรงกับ 0.75" }
      - { id: c, text: "R", feedback: "R มีเพียงสีเดียว แต่สีจากขนมแยกได้ 2 จุด แปลว่าเป็นสีผสม 2 ชนิด" }
    hints:
      - "สีผสมแยกได้หลายจุด ต้องเทียบให้ครบทุกจุด"
      - "หาสีมาตรฐานที่มีจุดชุดเดียวกันทั้งหมด"
    solution: "สีจากขนมมีสาร 2 ชนิด ($R_f$ 0.30 และ 0.75) ซึ่งตรงกับ Q ทั้งสองจุด P ตรงเพียงจุดเดียว R ขาดจุด 0.30 ข้อสรุปนี้ใช้ได้เพราะทดลองบนกระดาษและตัวทำละลายเดียวกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.mixtures.separating-mixtures.p012
    topics: [chemistry.mixtures.separating-mixtures]
    difficulty: 4
    type: numeric
    stem: "ของผสม 50.0 g ประกอบด้วยผงเหล็ก ทราย และเกลือ ใช้แม่เหล็กแยกผงเหล็กได้ 8.5 g แล้วละลายน้ำ กรอง และตากทรายจนแห้งได้ 31.0 g ของผสมนี้มีเกลือร้อยละเท่าใดโดยมวล"
    answer: { value: 21, tolerance: 0.2, unit: "%" }
    misconceptions:
      - { match: 25.3, feedback: "หารด้วยมวลที่เหลือหลังเอาเหล็กออก (41.5 g) ต้องหารด้วยมวลของผสมเริ่มต้น 50.0 g" }
      - { match: 33.87, feedback: "หารด้วยมวลทราย ร้อยละในของผสมต้องเทียบกับมวลทั้งหมด" }
    hints:
