<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" font-family="sans-serif" font-size="16">
  <title>แผนภาพเวนน์ของเซต A และ B ในเอกภพสัมพัทธ์ U</title>
  <rect x="0" y="0" width="560" height="330" fill="#ffffff"/>
  <rect x="20.0" y="20.0" width="520.0" height="270.0" rx="0" fill="#ffffff" stroke="#15211e" stroke-width="2"/>
  <circle cx="225.0" cy="160.0" r="95.0" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
  <circle cx="335.0" cy="160.0" r="95.0" fill="none" stroke="#c2410c" stroke-width="2.5"/>
  <text x="147.1" y="85.9" font-size="20" text-anchor="middle" fill="#1d4ed8" font-weight="bold">A</text>
  <text x="412.9" y="85.9" font-size="20" text-anchor="middle" fill="#c2410c" font-weight="bold">B</text>
  <text x="38.0" y="46.0" font-size="20" text-anchor="middle" fill="#15211e" font-weight="bold">U</text>
  <text x="180.0" y="152.0" font-size="20" text-anchor="middle" fill="#15211e">1</text>
  <text x="185.0" y="188.0" font-size="20" text-anchor="middle" fill="#15211e">3</text>
  <text x="280.0" y="134.0" font-size="20" text-anchor="middle" fill="#15211e">2</text>
  <text x="280.0" y="166.0" font-size="20" text-anchor="middle" fill="#15211e">4</text>
  <text x="280.0" y="198.0" font-size="20" text-anchor="middle" fill="#15211e">6</text>
  <text x="380.0" y="170.0" font-size="20" text-anchor="middle" fill="#15211e">8</text>
  <text x="60.0" y="270.0" font-size="20" text-anchor="middle" fill="#15211e">5</text>
  <text x="500.0" y="60.0" font-size="20" text-anchor="middle" fill="#15211e">7</text>
  <text x="505.0" y="270.0" font-size="20" text-anchor="middle" fill="#15211e">9</text>
  <text x="60.0" y="70.0" font-size="20" text-anchor="middle" fill="#15211e">10</text>
  <text x="280.0" y="318.0" font-size="15" text-anchor="middle" fill="#6b7a76" xml:space="preserve">U = {1, 2, ..., 10}  ·  A = {1, 2, 3, 4, 6}  ·  B = {2, 4, 6, 8}</text>
</svg>
