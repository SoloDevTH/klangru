<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" font-family="sans-serif">
<title>เส้นเวลาของ present perfect สามแบบ: ประสบการณ์ since for และ just</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
</defs>
<rect x="0" y="0" width="720" height="430" fill="#fff"/>
<text x="20.0" y="30.0" font-size="15" text-anchor="start" fill="#111" font-weight="bold" >1) ประสบการณ์: I have been to Japan twice.</text>
<line x1="30.0" y1="75.0" x2="690.0" y2="75.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/><line x1="560.0" y1="59.0" x2="560.0" y2="91.0" stroke="#c0392b" stroke-width="2.5" />
<line x1="182.0" y1="67.0" x2="198.0" y2="83.0" stroke="#1f4e9c" stroke-width="3" /><line x1="182.0" y1="83.0" x2="198.0" y2="67.0" stroke="#1f4e9c" stroke-width="3" />
<line x1="372.0" y1="67.0" x2="388.0" y2="83.0" stroke="#1f4e9c" stroke-width="3" /><line x1="372.0" y1="83.0" x2="388.0" y2="67.0" stroke="#1f4e9c" stroke-width="3" />
<text x="285.0" y="51.0" font-size="13" text-anchor="middle" fill="#1f4e9c" font-weight="normal" >เกิดเมื่อไรไม่สำคัญ สำคัญว่าจนถึงตอนนี้เคยแล้ว</text>
<path d="M 120 97 L 120 105 L 560 105 L 560 97" stroke="#888" stroke-width="1.5" fill="none" />
<text x="340.0" y="123.0" font-size="12" text-anchor="middle" fill="#666" font-weight="normal" >ช่วงชีวิตจนถึงตอนนี้</text>
<text x="560.0" y="51.0" font-size="13" text-anchor="middle" fill="#c0392b" font-weight="bold" >now</text>
<text x="20.0" y="170.0" font-size="15" text-anchor="start" fill="#111" font-weight="bold" >2) เริ่มในอดีตและยังเป็นอยู่: I have lived here since 2020 / for 6 years.</text>
<line x1="30.0" y1="225.0" x2="690.0" y2="225.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/><line x1="560.0" y1="209.0" x2="560.0" y2="241.0" stroke="#c0392b" stroke-width="2.5" />
<line x1="200.0" y1="225.0" x2="560.0" y2="225.0" stroke="#1f4e9c" stroke-width="8" stroke-linecap="round"/>
<circle cx="200.0" cy="225.0" r="9.0" fill="#1f4e9c" stroke="none" stroke-width="0" />
<text x="200.0" y="205.0" font-size="13" text-anchor="middle" fill="#1f4e9c" font-weight="bold" >since 2020 (จุดเริ่ม)</text>
<path d="M 200 245 L 200 253 L 560 253 L 560 245" stroke="#1f4e9c" stroke-width="1.5" fill="none" />
<text x="380.0" y="271.0" font-size="13" text-anchor="middle" fill="#1f4e9c" font-weight="bold" >for 6 years (ความยาวช่วงเวลา)</text>
<text x="560.0" y="205.0" font-size="13" text-anchor="middle" fill="#c0392b" font-weight="bold" >now</text>
<text x="20.0" y="320.0" font-size="15" text-anchor="start" fill="#111" font-weight="bold" >3) เพิ่งเกิด ผลยังอยู่ตอนนี้: The bus has just left.</text>
<line x1="30.0" y1="370.0" x2="690.0" y2="370.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/><line x1="560.0" y1="354.0" x2="560.0" y2="386.0" stroke="#c0392b" stroke-width="2.5" />
<text x="574.0" y="350.0" font-size="13" text-anchor="start" fill="#c0392b" font-weight="bold" >now</text>
<text x="34.0" y="404.0" font-size="13" text-anchor="start" fill="#555" font-weight="normal" >past (อดีต)</text>
<text x="686.0" y="404.0" font-size="13" text-anchor="end" fill="#555" font-weight="normal" >future (อนาคต)</text>
<line x1="522.0" y1="362.0" x2="538.0" y2="378.0" stroke="#1f4e9c" stroke-width="3" /><line x1="522.0" y1="378.0" x2="538.0" y2="362.0" stroke="#1f4e9c" stroke-width="3" />
<text x="530.0" y="350.0" font-size="13" text-anchor="middle" fill="#1f4e9c" font-weight="bold" >just</text>
</svg>
