id: computer.security.cybersecurity-basics
subject: computer
title: { th: ความมั่นคงปลอดภัยไซเบอร์เบื้องต้น, en: "Cybersecurity basics" }
summary: เป้าหมาย CIA การยืนยันตัวตนหลายปัจจัยและสิทธิ์การเข้าถึง รหัสผ่านที่ดี มัลแวร์ ฟิชชิง วิศวกรรมสังคม การป้องกันหลายชั้น แบบจำลองภัยคุกคาม และการชั่งความปลอดภัยกับความสะดวก
difficulty: 4
minutes: 45
prerequisites: [computer.networks.internet-basics, computer.society.responsible-ict]
encompasses:
  - { id: computer.networks.internet-basics, weight: 0.2 }
  - { id: computer.society.responsible-ict, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: cia.svg
    alt: "สามเหลี่ยมมีข้อมูลคะแนนของนักเรียนอยู่ตรงกลาง มุมบน ความลับ เฉพาะคนที่มีสิทธิ์เห็น ความเสียหายคือคะแนนรั่วออกไป มุมขวาล่าง ความถูกต้องครบถ้วน ข้อมูลไม่ถูกแก้โดยไม่ได้รับอนุญาต ความเสียหายคือมีคนแอบแก้เกรด มุมซ้ายล่าง ความพร้อมใช้ ใช้ได้เมื่อต้องการ ความเสียหายคือระบบล่มวันประกาศผล"
    caption: "สามเป้าหมายของความมั่นคงปลอดภัย (CIA)"
  - type: figure
    src: mfa.svg
    alt: "แถวบน ปัจจัยยืนยันตัวตนสามแบบ สิ่งที่รู้ เช่น รหัสผ่าน วลีรหัสผ่าน PIN สิ่งที่มี เช่น โทรศัพท์ที่รับรหัส แอปยืนยันตัวตน กุญแจ USB สิ่งที่เป็น เช่น ลายนิ้วมือ ใบหน้า ข้อความกลางภาพ การยืนยันตัวตนหลายปัจจัย MFA คือใช้ตั้งแต่ 2 แบบที่ต่างกัน แถวล่างเป็นลำดับเหตุการณ์ คนร้ายได้รหัสผ่านจากเว็บอื่นที่ข้อมูลรั่ว ไปที่ ระบบขอปัจจัยที่สองคือรหัสในแอปบนโทรศัพท์ ไปที่ คนร้ายไม่มีโทรศัพท์ของเรา ไปที่ เข้าไม่ได้ บัญชียังปลอดภัย ข้อความใต้ภาพ ปัจจัยต้องต่างชนิดกัน รหัสผ่านสองชุดยังเป็นสิ่งที่รู้แบบเดียว และห้ามบอกรหัส OTP แก่ใคร"
    caption: "MFA ปกป้องบัญชีแม้รหัสผ่านรั่ว"
  - type: figure
    src: layers.svg
    alt: "กรอบซ้อนกันหกชั้นจากนอกเข้าใน ชั้นคน รู้ทันฟิชชิง รายงานสิ่งผิดปกติ ชั้นกายภาพ ล็อกห้อง ล็อกหน้าจอ ไม่เสียบ USB แปลก ชั้นเครือข่าย ไฟร์วอลล์ Wi-Fi WPA2 หรือ WPA3 ชั้นอุปกรณ์ อัปเดต แอนติมัลแวร์ ชั้นบัญชี รหัสผ่านไม่ซ้ำ MFA สิทธิ์น้อยที่สุด และชั้นในสุด ข้อมูล เข้ารหัส สำรอง 3-2-1 ตรงกลางเขียนว่า ถ้าชั้นหนึ่งพลาด ชั้นถัดไปยังช่วยกันไว้"
    caption: "การป้องกันหลายชั้น"
  - type: worked-example
    title: ทำแบบจำลองภัยคุกคามให้ร้านค้าออนไลน์ของชมรม
    problem: "ชมรมศิลปะขายโปสการ์ดผ่านเพจและเก็บไฟล์ลายเส้นต้นฉบับไว้ในโน้ตบุ๊กของประธานชมรม จงทำแบบจำลองภัยคุกคามอย่างง่าย และเลือกว่าควรจัดการเรื่องใดก่อน"
    steps:
      - text: "ปกป้องอะไร: บัญชีเพจที่ใช้ขาย ไฟล์ต้นฉบับ และข้อมูลที่อยู่ของลูกค้า"
      - text: "อะไรอาจผิดพลาด: ถูกฟิชชิงจนเสียบัญชีเพจ แรนซัมแวร์เข้ารหัสไฟล์ โน้ตบุ๊กหาย และไฟดับวันที่มีงานขาย"
      - text: "ให้คะแนนโอกาส × ผลกระทบ (1–5): ฟิชชิง 4 × 4 = 16 แรนซัมแวร์ 2 × 5 = 10 โน้ตบุ๊กหาย 2 × 4 = 8 ไฟดับ 3 × 2 = 6"
        why: "ความเสี่ยงสูงเมื่อเกิดบ่อยหรือเสียหายมาก การคูณทำให้เรื่องที่สูงทั้งสองด้านขึ้นมาก่อน"
      - text: "เรื่องที่ต้องทำก่อนคือฟิชชิง (16): เปิด MFA ให้บัญชีเพจ ใช้รหัสผ่านไม่ซ้ำ และให้สมาชิกที่ดูแลเพจฝึกดูสัญญาณฟิชชิง"
      - text: "รองลงมาคือแรนซัมแวร์และโน้ตบุ๊กหาย (10 และ 8): สำรองไฟล์แบบ 3-2-1 และตั้งรหัสผ่านพร้อมเข้ารหัสดิสก์ของโน้ตบุ๊ก"
        why: "มาตรการเดียว (สำรองข้อมูล) ช่วยได้ทั้งสองเรื่อง จึงคุ้มค่าและทำได้จริงสำหรับชมรมเล็ก ๆ"
    answer: "จัดการฟิชชิงก่อน (ความเสี่ยง 16) ด้วย MFA และรหัสผ่านไม่ซ้ำ แล้วสำรองข้อมูลแบบ 3-2-1 และเข้ารหัสโน้ตบุ๊กเพื่อรับมือแรนซัมแวร์และเครื่องหาย"
  - { type: check, problem: computer.security.cybersecurity-basics.p007, prompt: "ดูว่ามาตรการฝั่งระบบช่วยลดการเดารหัสได้แค่ไหน" }
  - type: worked-example
    title: อ่านชื่อโดเมนในลิงก์ให้ถูก
    problem: "ผิงได้อีเมลอ้างว่ามาจากธนาคารสมมติที่ใช้เว็บ bank.example ให้กดลิงก์ `https://bank.example.account-verify.example/login` ลิงก์นี้พาไปเว็บของธนาคารหรือไม่"
    steps:
      - text: "ตัดส่วนหน้าและหลังออก: ตัด https:// และทุกอย่างหลังเครื่องหมาย / ตัวแรก (คือ /login) เหลือ bank.example.account-verify.example"
      - text: "อ่านจากขวาไปซ้าย: ชื่อโดเมนจริงคือสองส่วนขวาสุด account-verify.example"
        why: "เจ้าของโดเมนตั้งชื่อย่อยด้านซ้ายเป็นอะไรก็ได้ คนร้ายจึงใส่ bank.example ไว้ข้างหน้าให้ดูน่าเชื่อ"
      - text: "เทียบกับโดเมนของธนาคาร: account-verify.example ไม่ใช่ bank.example จึงเป็นเว็บของคนอื่น"
      - text: "อย่ากดลิงก์ ให้พิมพ์ชื่อเว็บธนาคารเองหรือเปิดแอปทางการ แล้วรายงานอีเมลว่าเป็นฟิชชิง"
    answer: "ไม่ใช่ ลิงก์พาไปโดเมน account-verify.example ซึ่งแค่ใส่คำว่า bank.example ไว้ด้านหน้าให้ดูเหมือนของธนาคาร"
  - { type: check, problem: computer.security.cybersecurity-basics.p009, prompt: "ฝึกอ่านโดเมนกับลิงก์อีกแบบ" }
glossary:
  - { term: CIA, definition: "สามเป้าหมายของความมั่นคงปลอดภัย การรักษาความลับ ความถูกต้องครบถ้วน และความพร้อมใช้" }
  - { term: การยืนยันตัวตน (authentication), definition: "การตรวจว่าผู้ใช้คือคนที่อ้างจริง เช่น ด้วยรหัสผ่านหรือลายนิ้วมือ" }
  - { term: การกำหนดสิทธิ์ (authorization), definition: "การกำหนดว่าผู้ใช้ที่ยืนยันตัวตนแล้วทำอะไรได้บ้าง" }
  - { term: การยืนยันตัวตนหลายปัจจัย (MFA), definition: "การใช้ปัจจัยยืนยันตัวตนตั้งแต่สองชนิดที่ต่างกัน เช่น รหัสผ่านร่วมกับรหัสในโทรศัพท์" }
  - { term: มัลแวร์ (malware), definition: "ซอฟต์แวร์ที่สร้างเพื่อทำอันตราย เช่น ไวรัส เวิร์ม โทรจัน สปายแวร์ แรนซัมแวร์" }
  - { term: ฟิชชิง (phishing), definition: "การหลอกด้วยข้อความ อีเมล หรือเว็บปลอม ให้เหยื่อเปิดเผยข้อมูลหรือติดตั้งโปรแกรม" }
  - { term: วิศวกรรมสังคม (social engineering), definition: "การหลอกใช้ความไว้ใจ ความกลัว หรือความรีบของคน แทนการเจาะระบบ" }
  - { term: สิทธิ์น้อยที่สุด (least privilege), definition: "ให้ผู้ใช้หรือโปรแกรมมีสิทธิ์เท่าที่งานต้องใช้เท่านั้น" }
  - { term: แบบจำลองภัยคุกคาม (threat model), definition: "การวิเคราะห์ว่าปกป้องอะไร อะไรอาจผิดพลาด เสี่ยงแค่ไหน และจะป้องกันอย่างไร" }
flashcards:
  - { front: "ปัจจัยยืนยันตัวตนสามแบบ", back: "สิ่งที่รู้ (รหัสผ่าน) สิ่งที่มี (โทรศัพท์) สิ่งที่เป็น (ลายนิ้วมือ ใบหน้า)" }
  - { front: "ทำไมห้ามใช้รหัสผ่านซ้ำ", back: "เว็บหนึ่งรั่ว คนร้ายนำรหัสเดิมไปลองเข้าบัญชีอื่นได้ทันที" }
  - { front: "สัญญาณเตือนของฟิชชิง", back: "เร่งให้รีบ ขู่หรือล่อด้วยรางวัล ขอรหัสผ่านหรือ OTP และลิงก์ที่โดเมนแปลก" }
  - { front: "สำรองข้อมูลแบบ 3-2-1", back: "มี 3 ชุด บนสื่อ 2 แบบ เก็บนอกสถานที่ 1 ชุด" }
  - { front: "ความเสี่ยงประมาณจากอะไร", back: "โอกาสเกิด × ผลกระทบ แล้วจัดการเรื่องที่คะแนนสูงก่อน" }
