problems:
  - id: biology.humans.nervous-system-intro.p001
    topics: [biology.humans.nervous-system-intro]
    difficulty: 1
    type: mcq
    stem: "ระบบประสาทส่วนกลางประกอบด้วยอวัยวะใด"
    choices:
      - { id: a, text: "สมองและไขสันหลัง", correct: true }
      - { id: b, text: "สมองและเส้นประสาททั่วร่างกาย", feedback: "เส้นประสาทที่แตกแขนงไปทั่วร่างกายเป็นระบบประสาทรอบนอก" }
      - { id: c, text: "สมองและกระดูกสันหลัง", feedback: "กระดูกสันหลังเป็นกระดูกที่ห่อหุ้มไขสันหลัง ไม่ใช่เนื้อเยื่อประสาท" }
      - { id: d, text: "หัวใจและสมอง", feedback: "หัวใจเป็นอวัยวะในระบบหมุนเวียนเลือด" }
    hints:
      - "ระบบประสาทส่วนกลางเป็นศูนย์ควบคุม อยู่ตรงแนวกลางลำตัว"
      - "อวัยวะหนึ่งอยู่ในกะโหลกศีรษะ อีกอวัยวะอยู่ในช่องกระดูกสันหลัง"
    solution: "ระบบประสาทส่วนกลางคือสมองและไขสันหลัง ส่วนเส้นประสาทที่แยกออกไปทั่วร่างกายเป็นระบบประสาทรอบนอก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nervous-system-intro.p002
    topics: [biology.humans.nervous-system-intro]
    difficulty: 1
    type: match
    stem: "จับคู่ส่วนของระบบประสาทส่วนกลางกับหน้าที่"
    pairs:
      - { left: "ซีรีบรัม", right: "ความคิด ความจำ การตัดสินใจ" }
      - { left: "ซีรีเบลลัม", right: "การทรงตัวและประสานการเคลื่อนไหว" }
      - { left: "เมดัลลาออบลองกาตา", right: "ควบคุมการหายใจและการเต้นของหัวใจ" }
      - { left: "ไฮโพทาลามัส", right: "ควบคุมอุณหภูมิร่างกาย ความหิว ความกระหาย" }
      - { left: "ไขสันหลัง", right: "ทางผ่านกระแสประสาทและศูนย์ควบคุมรีเฟล็กซ์" }
    hints:
      - "ซีรีบรัมคือสมองใหญ่ ซีรีเบลลัมคือสมองน้อย"
      - "ก้านสมองส่วนที่ต่อกับไขสันหลังควบคุมการทำงานที่ทำให้มีชีวิตอยู่"
    solution: "ซีรีบรัมคิดและจำ ซีรีเบลลัมทรงตัว เมดัลลาออบลองกาตาควบคุมการหายใจและหัวใจ ไฮโพทาลามัสควบคุมอุณหภูมิ ความหิว ความกระหาย และไขสันหลังเป็นทางผ่านและศูนย์รีเฟล็กซ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nervous-system-intro.p003
    topics: [biology.humans.nervous-system-intro]
    difficulty: 1
    type: text
    stem: "กระดูกที่ห่อหุ้มและป้องกันสมองเรียกว่าอะไร"
    accepted: ["กะโหลกศีรษะ", "กะโหลก", "กระโหลกศีรษะ", "skull"]
    hints:
      - "อยู่ที่ศีรษะ"
      - "ไขสันหลังมีกระดูกสันหลังป้องกัน สมองมีกระดูกอะไร"
    misconceptions:
      - { match: "กระดูกสันหลัง", feedback: "กระดูกสันหลังป้องกันไขสันหลัง ส่วนสมองอยู่ในกระดูกอีกชนิดหนึ่ง" }
    solution: "กะโหลกศีรษะ นอกจากนี้ยังมีเยื่อหุ้มสมองและน้ำหล่อสมองไขสันหลังช่วยรองรับแรงกระแทก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nervous-system-intro.p004
    topics: [biology.humans.nervous-system-intro]
    difficulty: 2
    type: mcq
    stem: "จากภาพสมองมองด้านข้าง ตัวอักษรใดชี้ที่ส่วนที่ควบคุมการทรงตัว"
    figure: { src: p-brain-letters.svg, alt: "สมองมองด้านข้าง หน้าอยู่ทางซ้าย มีตัวอักษรกำกับ ก ชี้ที่ส่วนใหญ่ที่สุดด้านบนที่มีรอยหยัก ข ชี้ที่ส่วนรูปไข่สีม่วงมีลายเส้นขวาง อยู่ด้านหลังใต้ส่วนใหญ่ ค ชี้ที่ส่วนล่างสุดของก้านสมองที่ต่อกับแท่งด้านล่าง ง ชี้ที่ก้อนเล็กสีส้มใต้ส่วนใหญ่ค่อนมาทางหน้า จ ชี้ที่แท่งยาวสีเหลืองด้านล่างสุด" }
    choices:
      - { id: a, text: "ข", correct: true }
      - { id: b, text: "ก", feedback: "ก คือซีรีบรัม ทำหน้าที่คิด จำ และสั่งการเคลื่อนไหวที่ตั้งใจ" }
      - { id: c, text: "ค", feedback: "ค คือเมดัลลาออบลองกาตา ควบคุมการหายใจและการเต้นของหัวใจ" }
      - { id: d, text: "ง", feedback: "ง คือไฮโพทาลามัส ควบคุมอุณหภูมิ ความหิว และความกระหาย" }
    hints:
      - "ส่วนที่ควบคุมการทรงตัวเรียกว่าสมองน้อย"
      - "สมองน้อยอยู่ด้านหลัง ใต้สมองใหญ่"
    solution: "ข คือซีรีเบลลัม (สมองน้อย) อยู่ด้านหลังใต้ซีรีบรัม ทำหน้าที่ทรงตัวและประสานการเคลื่อนไหว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nervous-system-intro.p005
    topics: [biology.humans.nervous-system-intro]
    difficulty: 2
    type: order
    stem: "เรียงเส้นทางของกระแสประสาทในวงจรรีเฟล็กซ์ เมื่อนิ้วแตะหนามแหลมแล้วชักมือกลับ"
    items:
      - "หน่วยรับความรู้สึกที่ผิวหนังนิ้ว"
      - "เซลล์ประสาทรับความรู้สึก"
      - "เซลล์ประสาทประสานงานในไขสันหลัง"
      - "เซลล์ประสาทสั่งการ"
      - "กล้ามเนื้อแขนหดตัว"
    hints:
      - "เริ่มที่จุดที่สัมผัสสิ่งเร้า จบที่อวัยวะที่ตอบสนอง"
      - "ศูนย์กลางของวงจรอยู่ในไขสันหลัง"
    solution: "หน่วยรับความรู้สึก → เซลล์ประสาทรับความรู้สึก → เซลล์ประสาทประสานงานในไขสันหลัง → เซลล์ประสาทสั่งการ → กล้ามเนื้อ (หน่วยปฏิบัติงาน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nervous-system-intro.p006
    topics: [biology.humans.nervous-system-intro]
    difficulty: 2
    type: mcq
    stem: "หมอใช้ค้อนยางเคาะใต้ลูกสะบ้า ขาของเรากระตุกขึ้นทันทีโดยไม่ได้ตั้งใจ ศูนย์ควบคุมการตอบสนองนี้อยู่ที่ใด"
    choices:
      - { id: a, text: "ไขสันหลัง", correct: true }
      - { id: b, text: "ซีรีบรัม", feedback: "ซีรีบรัมควบคุมการเคลื่อนไหวที่ตั้งใจ แต่การกระตุกเข่าเกิดเองโดยไม่ต้องคิด" }
      - { id: c, text: "ซีรีเบลลัม", feedback: "ซีรีเบลลัมดูแลการทรงตัว ไม่ใช่ศูนย์ของรีเฟล็กซ์นี้" }
      - { id: d, text: "กล้ามเนื้อขาเอง", feedback: "กล้ามเนื้อเป็นหน่วยปฏิบัติงาน ต้องได้รับคำสั่งผ่านเซลล์ประสาทสั่งการ" }
    hints:
      - "การกระตุกเกิดทันทีโดยไม่ต้องคิด เรียกว่าอะไร"
      - "เส้นทางสั้นที่สุดผ่านส่วนใดของระบบประสาทส่วนกลาง"
    solution: "การกระตุกเข่าเป็นรีเฟล็กซ์ที่มีศูนย์ควบคุมอยู่ที่ไขสันหลัง กระแสประสาทไม่ต้องขึ้นไปถึงสมองก่อน จึงตอบสนองได้เร็ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nervous-system-intro.p007
    topics: [biology.humans.nervous-system-intro]
    difficulty: 2
    type: mcq
    stem: "เดนไดรต์ของเซลล์ประสาททำหน้าที่ใด"
    choices:
      - { id: a, text: "รับกระแสประสาทเข้าสู่ตัวเซลล์", correct: true }
      - { id: b, text: "นำกระแสประสาทออกจากตัวเซลล์ไปยังเซลล์อื่น", feedback: "นี่คือหน้าที่ของแอกซอน" }
      - { id: c, text: "เก็บสารพันธุกรรมของเซลล์", feedback: "สารพันธุกรรมอยู่ในนิวเคลียสในตัวเซลล์" }
      - { id: d, text: "หดตัวเพื่อเคลื่อนไหวร่างกาย", feedback: "เซลล์กล้ามเนื้อเป็นเซลล์ที่หดตัว เซลล์ประสาทนำกระแสประสาท" }
    hints:
      - "เซลล์ประสาทมีแขนงสองแบบ แบบสั้นหลายแขนงกับแบบยาว"
      - "แขนงสั้นหลายแขนงเหมือนเสาอากาศ"
    solution: "เดนไดรต์เป็นแขนงสั้นหลายแขนง รับกระแสประสาทเข้าสู่ตัวเซลล์ ส่วนแอกซอนนำกระแสประสาทออกจากตัวเซลล์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nervous-system-intro.p008
    topics: [biology.humans.nervous-system-intro]
    difficulty: 3
    type: mcq
    stem: "ช่วงสงกรานต์ วัยรุ่นหลายคนกระโดดลงคลองที่ไม่รู้ความลึก ข้อใดเป็นอันตรายร้ายแรงที่สุดต่อระบบประสาท"
    choices:
      - { id: a, text: "ศีรษะกระแทกพื้นคลองจนกระดูกคอหัก ไขสันหลังบาดเจ็บ อาจเป็นอัมพาตถาวร", correct: true }
      - { id: b, text: "น้ำเข้าหูแล้วทำให้ซีรีเบลลัมเสีย", feedback: "น้ำเข้าหูอาจทำให้หูอักเสบ แต่ไม่ได้ทำลายซีรีเบลลัมโดยตรง" }
      - { id: c, text: "ได้ยินเสียงดังจนสมองเสื่อม", feedback: "ไม่ใช่อันตรายหลักของการกระโดดน้ำตื้น" }
      - { id: d, text: "ไม่มีอันตรายต่อระบบประสาท เพราะน้ำช่วยรับแรง", feedback: "ถ้าน้ำตื้น น้ำรับแรงไม่พอ ศีรษะจะกระแทกพื้นด้วยแรงมาก" }
    hints:
      - "กระโดดศีรษะลงในน้ำตื้น ส่วนใดกระแทกก่อน"
      - "ส่วนใดของระบบประสาทส่วนกลางอยู่ในกระดูกคอ"
    solution: "ถ้าน้ำตื้น ศีรษะกระแทกพื้น แรงส่งไปที่กระดูกคอ กระดูกอาจหักและทำลายไขสันหลัง กระแสประสาทระหว่างสมองกับร่างกายส่วนล่างถูกตัด ทำให้อัมพาตได้ จึงห้ามกระโดดน้ำในที่ไม่รู้ความลึก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nervous-system-intro.p009
    topics: [biology.humans.nervous-system-intro]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "การทำงานใดถูกควบคุมโดยก้านสมอง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "การหายใจ", correct: true }
      - { id: b, text: "การเต้นของหัวใจ", correct: true }
      - { id: c, text: "การไอและการจาม", correct: true }
      - { id: d, text: "การทรงตัวขณะขี่จักรยาน", feedback: "การทรงตัวเป็นหน้าที่ของซีรีเบลลัม" }
      - { id: e, text: "การท่องจำสูตรคูณ", feedback: "ความจำและการเรียนรู้เป็นหน้าที่ของซีรีบรัม" }
    hints:
      - "ก้านสมองควบคุมงานที่เกิดเองนอกอำนาจจิตใจ"
      - "งานเหล่านี้หยุดไม่ได้แม้ตอนนอนหลับ"
    solution: "ก้านสมอง โดยเฉพาะเมดัลลาออบลองกาตา ควบคุมการหายใจ การเต้นของหัวใจ ความดันเลือด การไอ จาม และกลืน ส่วนการทรงตัวเป็นของซีรีเบลลัม และความจำเป็นของซีรีบรัม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nervous-system-intro.p010
    topics: [biology.humans.nervous-system-intro]
    difficulty: 3
    type: mcq
    stem: "วันที่อากาศร้อนจัด ร่างกายขับเหงื่อมากและเรารู้สึกกระหายน้ำ ส่วนใดของสมองควบคุมการตอบสนองทั้งสองนี้"
    choices:
      - { id: a, text: "ไฮโพทาลามัส", correct: true }
      - { id: b, text: "ซีรีเบลลัม", feedback: "ซีรีเบลลัมดูแลการทรงตัวและการเคลื่อนไหว ไม่ได้ควบคุมอุณหภูมิ" }
      - { id: c, text: "ไขสันหลัง", feedback: "ไขสันหลังเป็นทางผ่านและศูนย์รีเฟล็กซ์ ส่วนศูนย์ควบคุมอุณหภูมิและความกระหายอยู่ในสมอง" }
      - { id: d, text: "ทาลามัส", feedback: "ทาลามัสถ่ายทอดกระแสประสาทไปซีรีบรัม ส่วนที่อยู่ใต้ทาลามัสต่างหากที่ควบคุมอุณหภูมิ" }
    hints:
      - "หาส่วนที่ควบคุมอุณหภูมิร่างกายและสมดุลน้ำ"
      - "ชื่อส่วนนี้แปลว่า อยู่ใต้ทาลามัส"
    solution: "ไฮโพทาลามัสควบคุมอุณหภูมิของร่างกาย (สั่งให้ขับเหงื่อ) และสมดุลน้ำ (ทำให้รู้สึกกระหาย) ช่วยรักษาสภาพภายในร่างกายให้คงที่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nervous-system-intro.p011
    topics: [biology.humans.nervous-system-intro]
    difficulty: 3
    type: mcq
    stem: "ข้อใดเป็นเหตุผลหลักที่ต้องสวมหมวกนิรภัยทุกครั้งที่ซ้อนท้ายรถจักรยานยนต์ แม้จะไปใกล้ ๆ"
    choices:
      - { id: a, text: "เซลล์ประสาทในสมองที่ตายจากการกระแทกสร้างใหม่ทดแทนได้น้อยมาก และกะโหลกศีรษะอย่างเดียวรับแรงกระแทกแรง ๆ ไม่พอ", correct: true }
      - { id: b, text: "เพื่อกันแดดไม่ให้สมองร้อน", feedback: "หมวกช่วยบังแดดได้บ้าง แต่จุดประสงค์หลักคือลดแรงกระแทกต่อศีรษะ" }
      - { id: c, text: "เพราะกะโหลกศีรษะของวัยรุ่นยังไม่มีกระดูก", feedback: "วัยรุ่นมีกะโหลกศีรษะแล้ว แต่กะโหลกอย่างเดียวรับแรงจากอุบัติเหตุไม่พอ" }
      - { id: d, text: "เพราะสมองควบคุมการทรงตัวไม่ได้ขณะซ้อนรถ", feedback: "ซีรีเบลลัมยังทำงานปกติ ปัญหาคือแรงกระแทกเมื่อเกิดอุบัติเหตุ" }
    hints:
      - "เมื่อศีรษะกระแทกพื้นถนน อะไรเกิดกับเนื้อสมอง"
      - "เซลล์ประสาทที่ตายแล้วสร้างใหม่ได้ง่ายหรือไม่"
    solution: "อุบัติเหตุเกิดได้แม้ระยะใกล้ หมวกนิรภัยช่วยกระจายและลดแรงกระแทกที่ศีรษะ ถ้าสมองบาดเจ็บ เซลล์ประสาทที่ตายสร้างใหม่ทดแทนได้น้อยมาก ความพิการจึงอาจอยู่ตลอดชีวิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nervous-system-intro.p012
    topics: [biology.humans.nervous-system-intro]
    difficulty: 4
    type: numeric
    stem: "ทดลองวัดเวลาตอบสนองด้วยไม้บรรทัด ไม้บรรทัดตกไป 0.20 เมตรก่อนถูกหนีบไว้ ใช้ $t = \\sqrt{\\frac{2d}{g}}$ และ $g = 9.8\\ \\mathrm{m/s^2}$ เวลาตอบสนองเป็นกี่วินาที (ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 0.20, tolerance: 0.005, unit: s }
    hints:
      - "แทนค่า $d = 0.20$ และ $g = 9.8$ ในสูตร"
      - "คำนวณ $\\frac{2 \\times 0.20}{9.8}$ ก่อน แล้วจึงถอดรากที่สอง"
    misconceptions:
      - { match: 0.14, feedback: "ลืมคูณ 2 ในสูตร ต้องใช้ $2d$" }
      - { match: 0.04, feedback: "ลืมถอดรากที่สอง" }
    solution: "$t = \\sqrt{\\frac{2 \\times 0.20}{9.8}} = \\sqrt{0.0408} \\approx 0.20$ วินาที การตอบสนองนี้ต้องให้ตาเห็นแล้วสมองสั่งมือ จึงช้ากว่ารีเฟล็กซ์ที่ผ่านไขสันหลัง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nervous-system-intro.p013
    topics: [biology.humans.nervous-system-intro]
    difficulty: 4
    type: mcq
    stem: "ชายคนหนึ่งได้รับบาดเจ็บที่ไขสันหลังบริเวณหลังส่วนล่าง หลังจากนั้นขาทั้งสองข้างขยับไม่ได้และไม่รู้สึกเมื่อถูกสัมผัส แต่แขนยังใช้งานได้ปกติ ข้อใดอธิบายได้ดีที่สุด"
    choices:
      - { id: a, text: "กระแสประสาทระหว่างขากับสมองต้องผ่านไขสันหลังช่วงที่บาดเจ็บ ส่วนเส้นประสาทของแขนแยกออกจากไขสันหลังที่สูงกว่านั้น", correct: true }
      - { id: b, text: "กล้ามเนื้อขาถูกทำลายทั้งหมด", feedback: "ถ้ากล้ามเนื้อเสียอย่างเดียว ขาควรยังรู้สึกได้ แต่ชายคนนี้ไม่รู้สึกด้วย แสดงว่าทางผ่านกระแสประสาทเสีย" }
      - { id: c, text: "ซีรีบรัมส่วนที่ควบคุมขาเสียหาย", feedback: "การบาดเจ็บอยู่ที่ไขสันหลัง สมองยังปกติ แต่คำสั่งส่งลงไปถึงขาไม่ได้" }
      - { id: d, text: "ไขสันหลังทำหน้าที่เฉพาะรีเฟล็กซ์ ไม่เกี่ยวกับการเดิน", feedback: "ไขสันหลังเป็นทางผ่านของคำสั่งจากสมองไปยังกล้ามเนื้อขา และความรู้สึกจากขาขึ้นไปยังสมองด้วย" }
    hints:
      - "ไขสันหลังทำหน้าที่อะไรนอกจากรีเฟล็กซ์"
      - "เส้นประสาทของแขนกับขาออกจากไขสันหลังที่ระดับเดียวกันหรือไม่"
    solution: "ไขสันหลังเป็นทางผ่านของกระแสประสาทระหว่างสมองกับร่างกาย เมื่อบาดเจ็บที่หลังส่วนล่าง สัญญาณจากขาขึ้นไปสมองไม่ได้ (ไม่รู้สึก) และคำสั่งจากสมองลงไปถึงขาไม่ได้ (ขยับไม่ได้) ส่วนเส้นประสาทของแขนต่อกับไขสันหลังช่วงคอซึ่งอยู่สูงกว่า จึงยังปกติ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nervous-system-intro.p014
    topics: [biology.humans.nervous-system-intro]
    difficulty: 4
    type: mcq
    stem: "เพื่อนตกจากต้นไม้ นอนอยู่ บอกว่าปวดคอมากและขาชา ควรทำอย่างไร"
    choices:
      - { id: a, text: "บอกให้เพื่อนนอนนิ่ง ๆ ไม่ขยับคอ ห้ามคนอื่นยกตัว แล้วโทร 1669 ทันที", correct: true }
      - { id: b, text: "ช่วยกันพยุงให้ลุกนั่งเพื่อดูว่าเดินได้หรือไม่", feedback: "ถ้ากระดูกคอหัก การขยับอาจทำให้ไขสันหลังบาดเจ็บมากขึ้นจนอัมพาตถาวร" }
      - { id: c, text: "อุ้มขึ้นรถจักรยานยนต์ไปโรงพยาบาลเอง", feedback: "การยกและการนั่งรถทำให้คอและหลังขยับมาก ควรรอเจ้าหน้าที่ที่มีอุปกรณ์ยึดคอและแผ่นรองหลัง" }
      - { id: d, text: "นวดคอให้หายปวด", feedback: "การนวดทำให้คอเคลื่อน อาจทำร้ายไขสันหลัง" }
    hints:
      - "ปวดคอร่วมกับขาชา บ่งบอกว่าอวัยวะใดอาจบาดเจ็บ"
      - "ไขสันหลังที่บาดเจ็บแล้วถูกขยับซ้ำจะเป็นอย่างไร"
    solution: "อาการปวดคอและขาชาบ่งว่ากระดูกคอและไขสันหลังอาจบาดเจ็บ ต้องให้ผู้บาดเจ็บอยู่นิ่ง ไม่ยก ไม่พลิก แล้วโทร 1669 ให้เจ้าหน้าที่นำส่งด้วยอุปกรณ์ที่ถูกต้อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nervous-system-intro.p015
    topics: [biology.humans.nervous-system-intro]
    difficulty: 5
    type: numeric
    stem: "กระแสประสาทในเซลล์ประสาทบางชนิดเคลื่อนที่ได้ราว 100 เมตรต่อวินาที ถ้าระยะทางจากปลายนิ้วเท้าถึงสมองของคนคนหนึ่งเท่ากับ 1.6 เมตร กระแสประสาทใช้เวลาเดินทางกี่มิลลิวินาที"
    answer: { value: 16, unit: ms }
    hints:
      - "เวลา = ระยะทาง ÷ อัตราเร็ว"
      - "1 วินาที = 1,000 มิลลิวินาที"
    misconceptions:
      - { match: 0.016, feedback: "นี่คือคำตอบเป็นวินาที โจทย์ถามเป็นมิลลิวินาที ต้องคูณ 1,000" }
      - { match: 160000, feedback: "นำระยะทางคูณอัตราเร็ว ต้องหาร: เวลา = ระยะทาง ÷ อัตราเร็ว" }
    solution: "เวลา $= \\frac{1.6}{100} = 0.016$ วินาที $= 16$ มิลลิวินาที เวลาตอบสนองที่วัดได้ (ราว 200 มิลลิวินาที) จึงไม่ได้มาจากการเดินทางในเส้นประสาทอย่างเดียว แต่สมองใช้เวลาประมวลผลด้วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nervous-system-intro.p016
    topics: [biology.humans.nervous-system-intro]
    difficulty: 5
    type: mcq
    stem: "เมื่อแตะหม้อร้อน มือชักกลับก่อนที่เราจะรู้สึกว่าร้อน ข้อใดอธิบายได้ถูกต้องที่สุด"
    choices:
      - { id: a, text: "กระแสประสาทเข้าไขสันหลังแล้วสั่งกล้ามเนื้อทันทีผ่านวงจรรีเฟล็กซ์ ส่วนสัญญาณที่ส่งขึ้นไปถึงซีรีบรัมเพื่อให้รู้สึกร้อนใช้ทางที่ยาวกว่า จึงมาถึงภายหลัง", correct: true }
      - { id: b, text: "มือรับรู้ความร้อนแล้วสั่งตัวเองให้ชักกลับ", feedback: "มือมีหน่วยรับความรู้สึก แต่การสั่งกล้ามเนื้อต้องผ่านระบบประสาทส่วนกลาง" }
      - { id: c, text: "ซีรีเบลลัมสั่งการชักมือ แล้วจึงส่งต่อให้ซีรีบรัม", feedback: "ศูนย์ของรีเฟล็กซ์ชักมือหนีอยู่ที่ไขสันหลัง ไม่ใช่ซีรีเบลลัม" }
      - { id: d, text: "กระแสประสาทที่ไปสมองเคลื่อนที่ช้ากว่ากระแสประสาทที่ไปกล้ามเนื้อเสมอ", feedback: "ความต่างหลักอยู่ที่ระยะทางและจำนวนจุดเชื่อมต่อ ไม่ใช่ว่าสัญญาณไปสมองช้ากว่าเสมอ" }
    hints:
      - "วงจรรีเฟล็กซ์ผ่านส่วนใดของระบบประสาทส่วนกลาง"
      - "ความรู้สึกเจ็บหรือร้อนเกิดที่ส่วนใดของสมอง"
    solution: "รีเฟล็กซ์ใช้เส้นทางสั้นผ่านไขสันหลัง กล้ามเนื้อจึงหดตัวเร็ว ช่วยลดอันตราย ขณะเดียวกันไขสันหลังส่งกระแสประสาทขึ้นไปยังซีรีบรัมที่อยู่ไกลกว่าและต้องประมวลผล ความรู้สึกร้อนจึงตามมาทีหลัง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nervous-system-intro.p017
    topics: [biology.humans.nervous-system-intro]
    difficulty: 4
    type: mcq
    stem: "คนที่ดื่มเครื่องดื่มแอลกอฮอล์มากมักเดินเซและหยิบของพลาด แสดงว่าแอลกอฮอล์รบกวนการทำงานของส่วนใดของสมองมากที่สุด"
    choices:
      - { id: a, text: "ซีรีเบลลัม", correct: true }
      - { id: b, text: "เมดัลลาออบลองกาตา", feedback: "ถ้าแอลกอฮอล์กดเมดัลลามากจะหายใจช้าลงจนอันตรายถึงชีวิต แต่อาการเดินเซมาจากส่วนที่ดูแลการทรงตัว" }
      - { id: c, text: "ไฮโพทาลามัส", feedback: "ไฮโพทาลามัสดูแลอุณหภูมิและความกระหาย ไม่ใช่การทรงตัว" }
      - { id: d, text: "ไขสันหลัง", feedback: "ไขสันหลังเป็นทางผ่าน แต่การประสานการเคลื่อนไหวให้แม่นยำเป็นงานของสมองส่วนหนึ่ง" }
    hints:
      - "เดินเซคือเสียการทรงตัว หยิบพลาดคือการเคลื่อนไหวไม่แม่นยำ"
      - "ส่วนใดของสมองทำทั้งสองหน้าที่นี้"
    solution: "ซีรีเบลลัมควบคุมการทรงตัวและประสานการเคลื่อนไหวให้แม่นยำ แอลกอฮอล์รบกวนการทำงานของซีรีเบลลัม จึงเดินเซและหยิบของพลาด นอกจากนี้แอลกอฮอล์ยังทำลายเซลล์สมองในระยะยาว"
    license: CC-BY-SA-4.0
    ai_assisted: true
