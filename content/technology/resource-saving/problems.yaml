problems:
- id: technology.living.resource-saving.p001
  topics:
  - technology.living.resource-saving
  difficulty: 1
  type: match
  stem: "จับคู่ทรัพยากรที่ใช้ในการทำงานกับตัวอย่างการใช้ในงานบ้าน"
  pairs:
  - left: "ไฟฟ้า"
    right: "ใช้กับหม้อหุงข้าวและหลอดไฟ"
  - left: "น้ำ"
    right: "ใช้ล้างผักและล้างเครื่องมือ"
  - left: "วัสดุ"
    right: "ใช้ทำงานประดิษฐ์จากกระดาษและกล่อง"
  - left: "เวลา"
    right: "ใช้ทำงานบ้านและการบ้านในแต่ละวัน"
  hints:
  - "ทรัพยากรแต่ละอย่างใช้ในงานต่างกัน ดูว่าอะไรต้องเสียบปลั๊กหรือต้องเปิดก๊อก"
  - "วัสดุคือของที่ถูกนำไปทำเป็นชิ้นงาน"
  - "เวลาคือสิ่งที่ใช้ไปโดยไม่สามารถนำกลับมาได้"
  solution: "ไฟฟ้าใช้กับเครื่องใช้ไฟฟ้า น้ำใช้กับการล้างและทำความสะอาด วัสดุคือสิ่งที่นำมาทำเป็นชิ้นงาน และเวลาคือสิ่งที่ทุกคนใช้ทำงานในแต่ละวัน"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.resource-saving.p002
  topics:
  - technology.living.resource-saving
  difficulty: 1
  type: mcq
  stem: "ข้อใดเป็นการใช้ทรัพยากรอย่างคุ้มค่า โดยยังได้ผลงานเท่าเดิม"
  choices:
  - id: a
    text: "เปิดพัดลมไว้ทั้งวันแม้ไม่มีคนอยู่ในห้อง"
    feedback: "เปิดทิ้งไว้โดยไม่มีคนใช้ ทำให้ไฟฟ้าสิ้นเปลืองโดยไม่ได้ประโยชน์"
  - id: b
    text: "นำน้ำที่ใช้ล้างผักครั้งสุดท้ายไปรดต้นไม้"
    correct: true
  - id: c
    text: "เปิดน้ำไหลตลอดขณะแปรงฟันหรือถูตัว"
    feedback: "น้ำที่ไหลตลอดเวลาทำให้สิ้นเปลืองโดยไม่จำเป็น"
  - id: d
    text: "ซื้อของที่ใช้ครั้งเดียวแล้วทิ้งทุกครั้งเพราะสะดวก"
    feedback: "การทิ้งของใช้ครั้งเดียวทำให้เสียวัสดุและเพิ่มขยะ"
  hints:
  - "คิดว่าทรัพยากรที่ใช้ไปนั้นได้ประโยชน์เพิ่มเติมหรือไม่"
  - "น้ำที่ใช้แล้วยังนำไปใช้ประโยชน์ต่อได้ในบางกรณี"
  solution: "น้ำที่ใช้ล้างผักครั้งสุดท้ายยังสะอาดพอจะรดต้นไม้ได้ ทำให้ได้ประโยชน์สองครั้งโดยไม่ทำให้งานล้างผักเสียผล"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.resource-saving.p003
  topics:
  - technology.living.resource-saving
  difficulty: 2
  type: numeric
  stem: "พัดลมกำลังไฟ 60 วัตต์ เปิดวันละ 3 ชั่วโมงทุกวันตลอด 30 วัน ใช้ไฟฟ้ากี่หน่วย (ตอบเป็นกิโลวัตต์-ชั่วโมง)"
  answer:
    value: 5.4
    tolerance: 0.01
    unit: "kWh"
  misconceptions:
  - match: 180
    feedback: "ตอบ 180 คือผลคูณ 60 × 3 ซึ่งเป็นวัตต์-ชั่วโมงต่อวัน ยังไม่ได้คูณจำนวนวันและแปลงเป็นกิโลวัตต์"
  - match: 0.18
    feedback: "ตอบ 0.18 คือปริมาณไฟของวันเดียว ยังไม่ได้คูณ 30 วัน"
  hints:
  - "กำลังไฟ 60 วัตต์คือ 0.06 กิโลวัตต์"
  - "หน่วยไฟฟ้าคือกำลังไฟ (กิโลวัตต์) คูณชั่วโมงที่ใช้ในทุกวัน"
  - "นำผลต่อวันคูณด้วยจำนวนวันทั้งหมด"
  solution: "กำลังไฟ 60 วัตต์ = 0.06 กิโลวัตต์ ใช้วันละ 3 ชั่วโมง ได้ 0.06 × 3 = 0.18 หน่วยต่อวัน ทั้ง 30 วันได้ 5.4 หน่วย (ตรวจด้วย python3: 60/1000*3*30 = 5.4)"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.resource-saving.p004
  topics:
  - technology.living.resource-saving
  difficulty: 2
  type: mcq
  stem: "ข้อใดเป็นตัวอย่างของการประหยัดแต่ไม่คุ้มค่า"
  choices:
  - id: a
    text: "ใช้ผงซักฟอกน้อยกว่าฉลากมากจนผ้ายังไม่สะอาดและต้องซักซ้ำ"
    correct: true
  - id: b
    text: "เลือกเครื่องที่กินไฟน้อยและใช้งานได้ดีตามต้องการ"
    feedback: "นี่คือการใช้ทรัพยากรอย่างคุ้มค่า เพราะประหยัดและได้ผลดี"
  - id: c
    text: "เปิดน้ำเต็มถังเครื่องซักผ้าทุกครั้งแม้มีผ้าเพียงไม่กี่ชิ้น"
    feedback: "การเปิดเครื่องทั้งที่ผ้าน้อยเป็นการใช้น้ำและไฟเกินจำเป็น ไม่ใช่การประหยัด"
  - id: d
    text: "ใช้เครื่องมือเก่าที่ซ่อมได้ และดูแลให้ใช้งานต่อได้"
    feedback: "เป็นการใช้ซ้ำและซ่อม ทำให้คุ้มค่ากับทรัพยากรที่ผลิตไปแล้ว"
  hints:
  - "ลองดูว่าการใช้น้อยลงนั้นส่งผลต่องานที่ทำสำเร็จหรือไม่"
  - "การประหยัดที่ทำให้ต้องทำซ้ำจะใช้ทรัพยากรรวมมากขึ้น"
  solution: "การใช้ผงซักฟอกน้อยเกินไปทำให้ผ้ายังไม่สะอาด ต้องซักซ้ำซึ่งใช้น้ำ ไฟ และเวลาเพิ่ม จึงประหยัดในครั้งแรกแต่ไม่คุ้มค่าโดยรวม"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.resource-saving.p005
  topics:
  - technology.living.resource-saving
  difficulty: 3
  type: order
  stem: "เรียงลำดับขั้นตอนการประเมินทางเลือกก่อนซื้อเครื่องใช้ไฟฟ้าใหม่"
  items:
  - "ระบุว่าจะใช้งานจริงบ่อยแค่ไหนและนานเท่าใด"
  - "เปรียบเทียบกำลังไฟและฉลากประหยัดไฟของรุ่นต่าง ๆ"
  - "คำนวณค่าไฟที่ใช้ตลอดอายุการใช้งานของแต่ละรุ่น"
  - "เทียบราคาซื้อกับค่าไฟรวม แล้วเลือกทางเลือกที่คุ้มค่า"
  hints:
  - "ก่อนเปรียบเทียบต้องรู้ก่อนว่าจะใช้งานอย่างไร"
  - "การคำนวณค่าไฟต้องใช้กำลังไฟและชั่วโมงที่ใช้งาน"
  - "ขั้นสุดท้ายคือตัดสินใจจากค่าใช้จ่ายรวม ไม่ใช่ราคาซื้ออย่างเดียว"
  solution: "ระบุการใช้งานก่อนเพื่อรู้ชั่วโมงใช้จริง แล้วเปรียบเทียบกำลังไฟและฉลาก คำนวณค่าไฟตลอดอายุการใช้งาน และตัดสินใจจากค่าใช้จ่ายรวมเทียบกับราคาซื้อ"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.resource-saving.p006
  topics:
  - technology.living.resource-saving
  difficulty: 2
  type: match
  stem: "จับคู่แต่ละ R ของหลัก 5R กับการกระทำที่ตรงกับความหมาย"
  pairs:
  - left: "ปฏิเสธ"
    right: "ไม่รับถุงพลาสติกที่ไม่จำเป็น"
  - left: "ลด"
    right: "ซื้อเฉพาะของที่ต้องใช้จริง"
  - left: "ใช้ซ้ำ"
    right: "ใช้ถุงผ้าเดิมไปซื้อของหลายครั้ง"
  - left: "ซ่อม"
    right: "เย็บกระเป๋าที่ขาดให้ใช้ต่อได้"
  - left: "รีไซเคิล"
    right: "นำขวดพลาสติกไปแปรรูปเป็นวัสดุใหม่"
  hints:
  - "ดูว่าการกระทำนั้นเกิดก่อนหรือหลังการได้ของมาใช้"
  - "ลดคือการซื้อหรือใช้ให้น้อยลง ส่วนใช้ซ้ำคือการใช้ของเดิมอีกครั้ง"
  - "รีไซเคิลคือการนำวัสดุไปแปรรูปเป็นของใหม่"
  solution: "ปฏิเสธคือไม่รับสิ่งที่ไม่จำเป็นตั้งแต่ต้น ลดคือซื้อและใช้น้อยลง ใช้ซ้ำคือใช้ของเดิมอีกครั้ง ซ่อมคือทำให้ของเสียกลับมาใช้ได้ และรีไซเคิลคือนำวัสดุไปแปรรูปเป็นของใหม่"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.resource-saving.p007
  topics:
  - technology.living.resource-saving
  difficulty: 2
  type: text
  stem: "หน่วยที่ใช้คิดค่าไฟฟ้าในบ้าน เรียกเต็ม ๆ ว่าอะไร (ตอบเป็นชื่อหน่วย)"
  accepted:
  - "kWh"
  - "กิโลวัตต์-ชั่วโมง"
  - "กิโลวัตต์ชั่วโมง"
  misconceptions:
  - match: "วัตต์"
    feedback: "วัตต์เป็นหน่วยของกำลังไฟ ไม่ใช่หน่วยพลังงานที่ใช้คิดค่าไฟ"
  hints:
  - "หน่วยนี้เกิดจากการเอากำลังไฟคูณด้วยเวลาที่ใช้"
  - "ตัวย่อมีทั้ง k (กิโล) W (วัตต์) และ h (ชั่วโมง)"
  solution: "กิโลวัตต์-ชั่วโมง (kWh) คือกำลังไฟเป็นกิโลวัตต์คูณชั่วโมงที่ใช้ ใบแจ้งค่าไฟคิดเป็นหน่วยนี้"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.resource-saving.p008
  topics:
  - technology.living.resource-saving
  difficulty: 3
  type: mcq
  stem: "ห้องนั่งเล่นเปิดหลอดไฟวันละ 5 ชั่วโมง ข้อใดเป็นการเลือกที่คุ้มค่าที่สุด"
  choices:
  - id: a
    text: "เลือกหลอดไส้เพราะซื้อถูกที่สุด จึงคุ้มค่าเสมอ"
    feedback: "ราคาซื้อเป็นเพียงส่วนหนึ่ง ต้องรวมค่าไฟตลอดอายุการใช้งานด้วย"
  - id: b
    text: "เลือกหลอด LED ที่กินไฟน้อยและอายุยาว แม้ราคาต่อหลอดสูงกว่า แต่ค่าใช้จ่ายรวมตลอดอายุอาจต่ำกว่า"
    correct: true
  - id: c
    text: "ไม่ต้องคิดเรื่องค่าไฟ เพราะเปิดเพียงไม่กี่ชั่วโมง"
    feedback: "5 ชั่วโมงต่อวันทำให้ค่าไฟสะสมได้มาก จึงควรคิดด้วย"
  - id: d
    text: "เปิดหลอดทิ้งไว้ทั้งวันเพื่อไม่ต้องเปิดปิดบ่อย"
    feedback: "การเปิดทิ้งไว้เกินความจำเป็นทำให้สิ้นเปลือง"
  hints:
  - "ลองคิดค่าใช้จ่ายรวมทั้งค่าหลอดและค่าไฟตลอดอายุการใช้งาน"
  - "หลอดที่กินไฟน้อยลงต่อชั่วโมงจะประหยัดขึ้นเมื่อใช้นานขึ้น"
  solution: "หลอด LED กินไฟน้อยกว่าและอายุยาวกว่า แม้ซื้อหลอดละแพงกว่า แต่เมื่อรวมค่าไฟและค่าหลอดตลอดอายุใช้งานแล้วอาจถูกกว่า ดังที่ภาพในบทเรียนแสดง"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.resource-saving.p009
  topics:
  - technology.living.resource-saving
  difficulty: 3
  type: numeric
  stem: "ฝักบัวเดิมไหลประมาณ 12 ลิตรต่อนาที เปลี่ยนเป็นฝักบัวประหยัดน้ำที่ไหล 7 ลิตรต่อนาที (แรงน้ำพอใช้) ถ้าอาบวันละ 8 นาที ทั้งเดือน 30 วัน จะประหยัดน้ำได้กี่ลิตร (ตอบเป็นลิตร)"
  answer:
    value: 1200
    tolerance: 0
    unit: "ลิตร"
  misconceptions:
  - match: 1680
    feedback: "ตอบ 1680 คือปริมาณน้ำที่ฝักบัวใหม่ใช้ทั้งเดือน ไม่ใช่ส่วนที่ประหยัดได้"
  - match: 2880
    feedback: "ตอบ 2880 คือปริมาณน้ำที่ฝักบัวเดิมใช้ทั้งเดือน ยังไม่ได้หักส่วนที่ประหยัดได้"
  hints:
  - "หาก่อนว่าฝักบัวเดิมและฝักบัวใหม่แต่ละอันใช้น้ำต่างกันต่อนาทีเท่าใด"
  - "ผลต่างของอัตราน้ำคูณด้วยเวลาอาบต่อวันจะได้น้ำที่ประหยัดต่อวัน"
  - "นำผลประหยัดต่อวันคูณด้วยจำนวนวัน"
  solution: "ประหยัดต่อวัน (12 − 7) × 8 = 40 ลิตร ทั้ง 30 วันได้ 40 × 30 = 1,200 ลิตร (ตรวจด้วย python3: (12-7)*8*30 = 1200)"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.resource-saving.p010
  topics:
  - technology.living.resource-saving
  difficulty: 3
  type: mcq
  stem: "เมื่อซักเสื้อผ้าด้วยเครื่องซักผ้า ข้อใดคือวิธีที่ประหยัดและคุ้มค่า"
  choices:
  - id: a
    text: "ซักผ้าเพียงไม่กี่ชิ้นทุกครั้งเพื่อให้ผ้าสะอาดเร็ว"
    feedback: "การซักบ่อยกับผ้าน้อยทำให้ใช้น้ำและไฟต่อชิ้นสูงขึ้น"
  - id: b
    text: "รอให้ผ้าเต็มเครื่องแล้วเลือกโปรแกรมที่เหมาะกับความสกปรกและปริมาณผ้า"
    correct: true
  - id: c
    text: "ซักผ้าทีละชิ้นโดยเปิดเครื่องแยกกันทุกชิ้น"
    feedback: "การเปิดเครื่องหลายครั้งทำให้สิ้นเปลืองน้ำและไฟ"
  - id: d
    text: "ใช้โปรแกรมที่แรงที่สุดทุกครั้งเพื่อความมั่นใจว่าสะอาด"
    feedback: "โปรแกรมที่แรงเกินความจำเป็นใช้พลังงานและน้ำมากโดยไม่จำเป็น"
  hints:
  - "ลองนึกถึงการใช้เครื่องหนึ่งครั้งกับผ้าเต็มเทียบกับผ้าน้อยหลายครั้ง"
  - "โปรแกรมที่เหมาะสมต้องพอดีกับงาน ไม่ใช่แรงที่สุดเสมอ"
  solution: "การรอให้ผ้าเต็มเครื่องลดจำนวนครั้งที่เปิดเครื่อง และการเลือกโปรแกรมที่พอดีกับความสกปรกและปริมาณผ้าช่วยลดการใช้น้ำและไฟโดยยังได้ผลสะอาด"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.resource-saving.p011
  topics:
  - technology.living.resource-saving
  difficulty: 2
  type: text
  stem: "การนำของเดิมกลับมาใช้อีกครั้งโดยไม่ต้องแปรรูป เรียกว่าอะไร (ตอบเป็นคำ 2 คำ)"
