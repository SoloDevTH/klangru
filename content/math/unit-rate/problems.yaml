problems:
  - id: math.number.unit-rate.p001
    topics: [math.number.unit-rate]
    difficulty: 1
    type: numeric
    stem: "ดินสอ 4 แท่ง ราคา 28 บาท ดินสอ 1 แท่งราคากี่บาท"
    answer: { value: 7, unit: บาท }
    hints:
      - "ราคาของ 4 แท่งรวมกันเป็น 28 บาท"
      - "แบ่ง 28 บาทออกเป็น 4 ส่วนเท่า ๆ กัน"
    misconceptions:
      - { match: 112, feedback: "คูณ 28 × 4 แต่ราคาของแท่งเดียวต้องน้อยกว่าราคาของ 4 แท่ง จึงต้องหาร" }
      - { match: 24, feedback: "ลบ 28 − 4 แต่ต้องแบ่งราคาเป็น 4 ส่วนเท่ากัน คือหาร" }
    solution: "1 แท่งราคา $28 \\div 4 = 7$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p002
    topics: [math.number.unit-rate]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นอัตราต่อหน่วย"
    choices:
      - { id: a, text: "60 กิโลเมตรต่อชั่วโมง", correct: true }
      - { id: b, text: "120 กิโลเมตรต่อ 2 ชั่วโมง", feedback: "เป็นอัตรา แต่ตัวหลังเป็น 2 ชั่วโมง ยังไม่ใช่ 1 หน่วย" }
      - { id: c, text: "ส้ม 5 ผล 40 บาท", feedback: "เป็นอัตรา แต่บอกราคาของ 5 ผล ไม่ใช่ 1 ผล" }
      - { id: d, text: "ทำงาน 3 วัน ได้ 1,200 บาท", feedback: "ตัวหลังเป็น 3 วัน อัตราต่อหน่วยต้องเป็นต่อ 1 วัน" }
    hints:
      - "อัตราต่อหน่วยคืออัตราที่ปริมาณตัวหลังเป็น 1"
      - "คำว่า ต่อชั่วโมง หมายถึง ต่อ 1 ชั่วโมง"
    solution: "60 กิโลเมตรต่อชั่วโมง คือ 60 กิโลเมตรต่อ 1 ชั่วโมง จึงเป็นอัตราต่อหน่วย ข้ออื่นตัวหลังไม่ใช่ 1"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p003
    topics: [math.number.unit-rate]
    difficulty: 2
    type: numeric
    stem: "ไข่ไก่ 10 ฟอง ราคา 42 บาท ถ้าซื้อ 15 ฟอง ต้องจ่ายกี่บาท"
    answer: { value: 63, unit: บาท }
    hints:
      - "หาราคาของไข่ 1 ฟองก่อน"
      - "1 ฟองราคา 42 ÷ 10 บาท แล้วคูณด้วยจำนวนฟองที่ต้องการ"
    misconceptions:
      - { match: 47, feedback: "บวกจำนวนฟองที่เพิ่ม (42 + 5) ราคาเพิ่มเป็นเท่าตามจำนวนฟอง ต้องหาราคาต่อฟองแล้วคูณ" }
      - { match: 630, feedback: "คูณ 42 × 15 คือคิดว่า 42 บาทเป็นราคาต่อฟอง แต่ 42 บาทเป็นราคาของ 10 ฟอง" }
    solution: "ราคาต่อฟอง $42 \\div 10 = 4.2$ บาท ไข่ 15 ฟองราคา $4.2 \\times 15 = 63$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p004
    topics: [math.number.unit-rate]
    difficulty: 2
    type: numeric
    stem: "รถโดยสารวิ่งได้ 180 กิโลเมตรในเวลา 3 ชั่วโมงด้วยอัตราเร็วคงที่ อัตราเร็วกี่กิโลเมตรต่อชั่วโมง"
    answer: { value: 60, unit: กม./ชม. }
    hints:
      - "อัตราเร็วคือระยะทางที่วิ่งได้ใน 1 ชั่วโมง"
      - "หารระยะทางด้วยเวลา"
    misconceptions:
      - { match: 540, feedback: "คูณระยะทางกับเวลา อัตราเร็ว = ระยะทาง ÷ เวลา" }
      - { match: 177, feedback: "ลบ 180 − 3 แต่ต้องแบ่งระยะทางให้แต่ละชั่วโมงเท่ากัน คือหาร" }
    solution: "อัตราเร็ว $= 180 \\div 3 = 60$ กิโลเมตรต่อชั่วโมง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p005
    topics: [math.number.unit-rate]
    difficulty: 2
    type: mcq
    stem: "ซีอิ๊วขาวขวดใหญ่ 1,000 มิลลิลิตร ราคา 52 บาท ขวดเล็ก 300 มิลลิลิตร ราคา 18 บาท ซื้อแบบใดคุ้มกว่า"
    choices:
      - { id: a, text: "ขวดใหญ่ เพราะราคาต่อมิลลิลิตรถูกกว่า", correct: true }
      - { id: b, text: "ขวดเล็ก เพราะจ่ายเงินน้อยกว่า", feedback: "จ่ายน้อยกว่าแต่ได้ซีอิ๊วน้อยกว่ามาก ต้องเทียบราคาต่อมิลลิลิตร ขวดเล็กมิลลิลิตรละ 0.06 บาท ขวดใหญ่ 0.052 บาท" }
      - { id: c, text: "คุ้มเท่ากัน", feedback: "ลองหาราคาต่อ 100 มิลลิลิตร ขวดใหญ่ 5.20 บาท ขวดเล็ก 6 บาท ไม่เท่ากัน" }
      - { id: d, text: "ขวดเล็ก เพราะ 300 ÷ 18 น้อยกว่า 1,000 ÷ 52", feedback: "300 ÷ 18 คือมิลลิลิตรต่อบาท ยิ่งมากยิ่งคุ้ม ขวดเล็กได้ประมาณ 16.7 มล./บาท ขวดใหญ่ได้ประมาณ 19.2 มล./บาท" }
    hints:
      - "เทียบราคาของปริมาณที่เท่ากัน"
      - "หาราคาต่อ 1 มิลลิลิตร (หรือต่อ 100 มิลลิลิตร) ของแต่ละขวด"
    solution: "ขวดใหญ่ $52 \\div 1{,}000 = 0.052$ บาทต่อมล. ขวดเล็ก $18 \\div 300 = 0.06$ บาทต่อมล. ขวดใหญ่ถูกกว่าต่อมิลลิลิตร จึงคุ้มกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p006
    topics: [math.number.unit-rate]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการแก้โจทย์ \"ส้ม 4 กิโลกรัม ราคา 120 บาท ซื้อ 7 กิโลกรัมต้องจ่ายเท่าไร\" ด้วยบัญญัติไตรยางศ์"
    items:
      - "เขียนสิ่งที่รู้: ส้ม 4 กิโลกรัม ราคา 120 บาท"
      - "หาราคาต่อ 1 กิโลกรัม: 120 ÷ 4 = 30 บาท"
      - "คูณด้วยจำนวนที่ต้องการ: 30 × 7 = 210 บาท"
      - "ตรวจความสมเหตุสมผล: ซื้อมากขึ้นต้องจ่ายมากกว่า 120 บาท"
    hints:
      - "เริ่มจากสิ่งที่โจทย์บอก"
      - "หาค่าของ 1 หน่วยก่อนคูณ"
    solution: "เขียนสิ่งที่รู้ → หาราคาต่อ 1 กิโลกรัม → คูณด้วย 7 → ตรวจคำตอบ ได้ 210 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p007
    topics: [math.number.unit-rate]
    difficulty: 2
    type: numeric
    stem: "ลุงทำงานรับจ้าง 5 วัน ได้ค่าจ้าง 1,750 บาท ถ้าได้ค่าจ้างวันละเท่ากัน ทำงาน 8 วันจะได้ค่าจ้างกี่บาท"
    answer: { value: 2800, unit: บาท }
    hints:
      - "หาค่าจ้างต่อ 1 วันก่อน"
      - "ค่าจ้างต่อวัน = 1,750 ÷ 5 แล้วคูณด้วย 8"
    misconceptions:
      - { match: 1093.75, feedback: "หารด้วย 8 แล้วคูณ 5 กลับด้าน ทำงานมากขึ้นต้องได้มากกว่า 1,750 บาท" }
      - { match: 1753, feedback: "บวกจำนวนวันที่เพิ่ม ค่าจ้างเพิ่มเป็นเท่าตามจำนวนวัน" }
    solution: "ค่าจ้างวันละ $1{,}750 \\div 5 = 350$ บาท 8 วันได้ $350 \\times 8 = 2{,}800$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p008
    topics: [math.number.unit-rate]
    difficulty: 3
    type: numeric
    stem: "ข้าวหอมมะลิถุง 5 กิโลกรัม ราคา 235 บาท ถ้าแบ่งขายตามราคาเดียวกัน 3 กิโลกรัมราคากี่บาท"
    answer: { value: 141, unit: บาท }
    hints:
      - "หาราคาต่อ 1 กิโลกรัมก่อน"
      - "235 ÷ 5 แล้วคูณด้วย 3"
    misconceptions:
      - { match: 391.67, feedback: "หาร 235 ด้วย 3 แล้วคูณ 5 กลับด้าน ซื้อน้อยลงต้องจ่ายน้อยกว่า 235 บาท" }
      - { match: 705, feedback: "คูณ 235 × 3 คือคิดว่า 235 บาทเป็นราคาต่อกิโลกรัม แต่เป็นราคาของ 5 กิโลกรัม" }
    solution: "ราคาต่อกิโลกรัม $235 \\div 5 = 47$ บาท 3 กิโลกรัมราคา $47 \\times 3 = 141$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p009
    topics: [math.number.unit-rate]
    difficulty: 3
    type: numeric
    stem: "แม่แบ่งเงิน 450 บาท ให้พี่กับน้อง โดยพี่ได้เป็น 2 เท่าของน้อง น้องได้กี่บาท"
    answer: { value: 150, unit: บาท }
    hints:
      - "วาดแท่ง: น้อง 1 ช่อง พี่ 2 ช่อง"
      - "รวมมีกี่ช่อง แบ่ง 450 บาทให้แต่ละช่องเท่ากัน"
    misconceptions:
      - { match: 225, feedback: "แบ่งครึ่ง แต่พี่ได้มากกว่าน้อง ทั้งหมดมี 3 ช่อง" }
      - { match: 300, feedback: "นี่คือส่วนของพี่ (2 ช่อง) โจทย์ถามส่วนของน้อง" }
    solution: "น้อง 1 ช่อง พี่ 2 ช่อง รวม 3 ช่อง ช่องละ $450 \\div 3 = 150$ บาท น้องได้ 150 บาท (พี่ได้ 300 บาท)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p010
    topics: [math.number.unit-rate]
    difficulty: 3
    type: match
    stem: "จับคู่สถานการณ์กับอัตราต่อหน่วย"
    pairs:
      - { left: "วิ่ง 150 กิโลเมตรใน 3 ชั่วโมง", right: "50 กิโลเมตรต่อชั่วโมง" }
      - { left: "ได้ค่าจ้าง 600 บาทใน 4 ชั่วโมง", right: "150 บาทต่อชั่วโมง" }
      - { left: "น้ำไหล 36 ลิตรใน 4 นาที", right: "9 ลิตรต่อนาที" }
      - { left: "กระดาษ 500 แผ่น ราคา 125 บาท", right: "0.25 บาทต่อแผ่น" }
    hints:
      - "อัตราต่อหน่วย = ปริมาณแรก ÷ ปริมาณหลัง"
      - "ดูหน่วยคำตอบ เช่น บาทต่อแผ่น คือ บาท ÷ แผ่น"
    solution: "$150 \\div 3 = 50$, $600 \\div 4 = 150$, $36 \\div 4 = 9$, $125 \\div 500 = 0.25$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p011
    topics: [math.number.unit-rate]
    difficulty: 3
    type: mcq
    stem: "โดยไม่ต้องคำนวณ ผลคูณ $96 \\times \\tfrac78$ เป็นอย่างไรเมื่อเทียบกับ 96"
    choices:
      - { id: a, text: "น้อยกว่า 96", correct: true }
      - { id: b, text: "มากกว่า 96", feedback: "การคูณไม่ได้ทำให้มากขึ้นเสมอ คูณด้วยจำนวนที่น้อยกว่า 1 ผลจะเล็กลง" }
      - { id: c, text: "เท่ากับ 96", feedback: "ค่าจะไม่เปลี่ยนเมื่อคูณด้วย 1 เท่านั้น แต่ 7/8 น้อยกว่า 1" }
      - { id: d, text: "บอกไม่ได้ถ้าไม่คำนวณ", feedback: "ดูแค่ตัวคูณก็บอกได้ 7/8 น้อยกว่า 1 ผลจึงน้อยกว่า 96" }
    hints:
      - "เทียบตัวคูณ 7/8 กับ 1"
      - "คูณด้วยจำนวนที่น้อยกว่า 1 คือการย่อ"
    solution: "$\\tfrac78 < 1$ การคูณจึงย่อ 96 ให้เล็กลง ผลคือ $84$ ซึ่งน้อยกว่า 96"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p012
    topics: [math.number.unit-rate]
    difficulty: 3
    type: numeric
    stem: "เชือกสีแดงยาว 18 เมตร เชือกสีฟ้ายาว 8 เมตร เชือกสีแดงยาวเป็นกี่เท่าของเชือกสีฟ้า (ตอบเป็นทศนิยม)"
    answer: { value: 2.25, tolerance: 0.01, unit: เท่า }
    hints:
      - "สิ่งที่ถูกถาม (สีแดง) เป็นตัวเศษ สิ่งที่ใช้เทียบ (สีฟ้า) เป็นตัวส่วน"
      - "หาร 18 ด้วย 8"
    misconceptions:
      - { match: 0.444, feedback: "นี่คือสีฟ้าเป็นกี่เท่าของสีแดง (8 ÷ 18) โจทย์ถามสีแดงเทียบกับสีฟ้า" }
      - { match: 10, feedback: "ลบ 18 − 8 ได้ว่ายาวกว่ากี่เมตร แต่โจทย์ถามว่ากี่เท่า ต้องหาร" }
    solution: "$\\tfrac{18}{8} = 2.25$ เชือกสีแดงยาวเป็น 2.25 เท่าของเชือกสีฟ้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p013
    topics: [math.number.unit-rate]
    difficulty: 3
    type: numeric
    stem: "ห้องเรียนมีนักเรียน 40 คน เป็นชาย 18 คน นักเรียนชายเป็นเศษส่วนเท่าใดของนักเรียนทั้งห้อง (ตอบเป็นทศนิยม)"
    answer: { value: 0.45, tolerance: 0.005 }
    hints:
      - "เศษส่วนของทั้งห้อง: จำนวนชายเป็นตัวเศษ จำนวนทั้งห้องเป็นตัวส่วน"
      - "$\\tfrac{18}{40}$ แล้วเขียนเป็นทศนิยม"
    misconceptions:
      - { match: 0.818, feedback: "หาร 18 ด้วย 22 (จำนวนหญิง) แต่โจทย์เทียบกับทั้งห้อง 40 คน" }
      - { match: 2.222, feedback: "หาร 40 ด้วย 18 กลับด้าน" }
    solution: "$\\tfrac{18}{40} = \\tfrac{9}{20} = 0.45$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p014
    topics: [math.number.unit-rate]
    difficulty: 4
    type: numeric
    stem: "ปั่นจักรยานได้ $\\tfrac34$ กิโลเมตรในเวลา $\\tfrac16$ ชั่วโมง อัตราเร็วกี่กิโลเมตรต่อชั่วโมง"
    answer: { value: 4.5, tolerance: 0.01, unit: กม./ชม. }
    hints:
      - "อัตราเร็ว = ระยะทาง ÷ เวลา แม้ตัวเลขเป็นเศษส่วน"
      - "หารด้วย $\\tfrac16$ คือคูณด้วย 6"
    misconceptions:
      - { match: 0.125, feedback: "คูณ $\\tfrac34 \\times \\tfrac16$ ต้องหาร" }
      - { match: 0.222, feedback: "หารเวลาด้วยระยะทาง ได้ชั่วโมงต่อกิโลเมตร ไม่ใช่กิโลเมตรต่อชั่วโมง" }
    solution: "$\\tfrac34 \\div \\tfrac16 = \\tfrac34 \\times 6 = 4.5$ กิโลเมตรต่อชั่วโมง (ใน 1 ชั่วโมงมี 6 ช่วงของ $\\tfrac16$ ชั่วโมง แต่ละช่วงปั่นได้ $\\tfrac34$ กม.)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p015
    topics: [math.number.unit-rate]
    difficulty: 4
    type: numeric
    stem: "รถไฟวิ่งด้วยอัตราเร็ว 54 กิโลเมตรต่อชั่วโมง คิดเป็นกี่เมตรต่อวินาที"
    answer: { value: 15, unit: ม./วินาที }
    hints:
      - "54 กิโลเมตร = 54,000 เมตร และ 1 ชั่วโมง = 3,600 วินาที"
      - "หาร 54,000 ด้วย 3,600"
    misconceptions:
      - { match: 194.4, feedback: "คูณด้วย 3.6 แต่เปลี่ยน กม./ชม. เป็น ม./วินาที ต้องหารด้วย 3.6" }
      - { match: 900, feedback: "หารด้วย 60 ครั้งเดียว (ได้เมตรต่อนาที) ต้องหารด้วย 3,600 วินาที" }
    solution: "$54 \\,\\mathrm{km/h} = \\dfrac{54{,}000\\ \\mathrm{m}}{3{,}600\\ \\mathrm{s}} = 15\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p016
    topics: [math.number.unit-rate]
    difficulty: 4
    type: numeric
    stem: "ผสมน้ำหวานโดยใช้น้ำเชื่อมต่อน้ำเปล่าเป็น $3 : 5$ ถ้าต้องการน้ำหวานทั้งหมด 2,400 มิลลิลิตร ต้องใช้น้ำเชื่อมกี่มิลลิลิตร"
    answer: { value: 900, unit: มล. }
    hints:
      - "ทั้งหมดมีกี่ส่วน"
      - "น้ำเชื่อมเป็น $\\tfrac{3}{3 + 5}$ ของทั้งหมด"
    misconceptions:
      - { match: 1440, feedback: "ใช้ $\\tfrac35$ ซึ่งเป็นน้ำเชื่อมเทียบกับน้ำเปล่า ต้องเทียบกับทั้งหมด 8 ส่วน" }
      - { match: 1200, feedback: "แบ่งครึ่ง แต่สองอย่างไม่ได้มีปริมาณเท่ากัน" }
    solution: "ทั้งหมด $3 + 5 = 8$ ส่วน ส่วนละ $2{,}400 \\div 8 = 300$ มล. น้ำเชื่อม 3 ส่วน $= 900$ มล. (น้ำเปล่า 1,500 มล.)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p017
    topics: [math.number.unit-rate]
    difficulty: 4
    type: mcq
    stem: "ผงซักฟอกสามขนาดตามภาพ ถ้าใช้ราคาต่อ 100 กรัมตัดสิน ขนาดใดคุ้มที่สุด"
    figure:
      src: p-detergent.svg
      alt: "ผงซักฟอกสามถุง ถุง A ขนาด 900 กรัม ราคา 89 บาท ถุง B ขนาด 2.5 กิโลกรัม ราคา 229 บาท ถุง C ขนาด 400 กรัม ราคา 42 บาท"
    choices:
      - { id: a, text: "B", correct: true }
      - { id: b, text: "C", feedback: "C ราคาถูกที่สุดต่อถุง แต่ 100 กรัมละ 10.50 บาท แพงที่สุด" }
      - { id: c, text: "A", feedback: "A 100 กรัมละประมาณ 9.89 บาท ส่วน B 100 กรัมละ 9.16 บาท" }
      - { id: d, text: "คุ้มเท่ากันทุกขนาด", feedback: "ราคาต่อ 100 กรัมของทั้งสามถุงไม่เท่ากัน" }
    hints:
      - "เปลี่ยน 2.5 กิโลกรัมเป็นกรัมก่อน"
      - "หาราคาต่อ 100 กรัม: ราคา ÷ (จำนวนกรัม ÷ 100)"
    solution: "A: $89 \\div 9 \\approx 9.89$ บาท B: 2.5 กก. $= 2{,}500$ ก. $229 \\div 25 = 9.16$ บาท C: $42 \\div 4 = 10.50$ บาท ต่อ 100 กรัม B ถูกที่สุดจึงคุ้มที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p018
    topics: [math.number.unit-rate]
    difficulty: 5
    type: numeric
    stem: "ขับรถจากกรุงเทพฯ ไปอยุธยา 75 กิโลเมตร ใช้เวลา 1 ชั่วโมง 30 นาที อัตราเร็วเฉลี่ยกี่กิโลเมตรต่อชั่วโมง"
    answer: { value: 50, unit: กม./ชม. }
    hints:
      - "เปลี่ยนเวลาเป็นชั่วโมงก่อน 30 นาทีเป็นกี่ชั่วโมง"
      - "30 นาที = 30/60 ชั่วโมง แล้วหารระยะทางด้วยเวลาทั้งหมด"
    misconceptions:
      - { match: 57.69, feedback: "เขียน 1 ชั่วโมง 30 นาทีเป็น 1.3 ชั่วโมง แต่ 30 นาที = 0.5 ชั่วโมง" }
      - { match: 0.833, feedback: "ได้กิโลเมตรต่อนาที (75 ÷ 90) โจทย์ถามกิโลเมตรต่อชั่วโมง" }
    solution: "เวลา $= 1 + \\tfrac{30}{60} = 1.5$ ชั่วโมง อัตราเร็ว $= 75 \\div 1.5 = 50$ กิโลเมตรต่อชั่วโมง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p019
    topics: [math.number.unit-rate]
    difficulty: 5
    type: numeric
    stem: "รถยนต์คันหนึ่งใช้น้ำมัน 6 ลิตรต่อระยะทาง 90 กิโลเมตร น้ำมันราคาลิตรละ 32.50 บาท ถ้าขับ 300 กิโลเมตร ค่าน้ำมันกี่บาท"
    answer: { value: 650, unit: บาท }
    hints:
      - "หาว่าน้ำมัน 1 ลิตรวิ่งได้กี่กิโลเมตร"
      - "หาว่า 300 กิโลเมตรใช้น้ำมันกี่ลิตร แล้วคูณด้วยราคาต่อลิตร"
    misconceptions:
      - { match: 20, feedback: "นี่คือจำนวนลิตรที่ใช้ ยังต้องคูณด้วยราคาลิตรละ 32.50 บาท" }
      - { match: 195, feedback: "นี่คือค่าน้ำมัน 6 ลิตรสำหรับ 90 กม. แรกเท่านั้น ต้องหาจำนวนลิตรสำหรับ 300 กม." }
    solution: "1 ลิตรวิ่งได้ $90 \\div 6 = 15$ กม. 300 กม. ใช้ $300 \\div 15 = 20$ ลิตร ค่าน้ำมัน $20 \\times 32.50 = 650$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p020
    topics: [math.number.unit-rate]
    difficulty: 5
    type: numeric
    stem: "ก้อนโลหะปริมาตร 50 ลูกบาศก์เซนติเมตร มีมวล 448 กรัม ความหนาแน่น (มวลต่อปริมาตร) ของโลหะนี้กี่กรัมต่อลูกบาศก์เซนติเมตร"
    answer: { value: 8.96, tolerance: 0.01, unit: g/cm³ }
    hints:
      - "ความหนาแน่นคืออัตราต่อหน่วยแบบหนึ่ง: มวลของ 1 ลูกบาศก์เซนติเมตร"
      - "หารมวลด้วยปริมาตร"
    misconceptions:
      - { match: 0.1116, feedback: "หารปริมาตรด้วยมวลกลับด้าน ได้ลูกบาศก์เซนติเมตรต่อกรัม" }
      - { match: 22400, feedback: "คูณมวลกับปริมาตร ความหนาแน่น = มวล ÷ ปริมาตร" }
    solution: "ความหนาแน่น $= 448 \\div 50 = 8.96$ กรัมต่อลูกบาศก์เซนติเมตร (ใกล้กับทองแดง)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p021
    topics: [math.number.unit-rate]
    difficulty: 4
    type: expression
    stem: "สินค้า $n$ ชิ้นราคา $x$ บาท ถ้าซื้อ $m$ ชิ้นในราคาต่อชิ้นเท่าเดิม ต้องจ่ายกี่บาท เขียนในรูปของ $x$, $n$ และ $m$"
    answer: { latex: "\\frac{xm}{n}", variables: [x, n, m] }
    hints:
      - "หาราคาต่อ 1 ชิ้นก่อน"
      - "ราคาต่อชิ้น $= \\tfrac{x}{n}$ แล้วคูณด้วยจำนวนชิ้นที่ต้องการ"
    misconceptions:
      - { match: "\\frac{xn}{m}", feedback: "คูณและหารกลับด้าน ตรวจด้วยตัวเลข: 3 ชิ้น 36 บาท ซื้อ 5 ชิ้นต้องได้ 60 บาท" }
      - { match: "xm", feedback: "ใช้ $x$ เป็นราคาต่อชิ้น แต่ $x$ เป็นราคาของ $n$ ชิ้น" }
    solution: "ราคาต่อชิ้น $\\tfrac{x}{n}$ บาท $m$ ชิ้นราคา $\\tfrac{x}{n} \\times m = \\dfrac{xm}{n}$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true
