<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="sans-serif" font-size="14">
  <title>เปรียบเทียบรูปแบบธุรกิจ: กิจการเจ้าของคนเดียว ห้างหุ้นส่วนสามัญ ห้างหุ้นส่วนจำกัด และบริษัทจำกัด</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="800" height="300" fill="#ffffff"/>
  <rect x="10" y="14" width="780" height="40" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/>
  <text x="18.0" y="38.2" text-anchor="start" fill="#1f2937" font-size="12" font-weight="bold"></text>
  <line x1="150" y1="14" x2="150" y2="54" stroke="#1f2937" stroke-width="1"/>
  <text x="220.0" y="38.2" text-anchor="middle" fill="#1f2937" font-size="12" font-weight="bold">เจ้าของคนเดียว</text>
  <line x1="290" y1="14" x2="290" y2="54" stroke="#1f2937" stroke-width="1"/>
  <text x="372.5" y="38.2" text-anchor="middle" fill="#1f2937" font-size="12" font-weight="bold">ห้างหุ้นส่วนสามัญ</text>
  <line x1="455" y1="14" x2="455" y2="54" stroke="#1f2937" stroke-width="1"/>
  <text x="537.5" y="38.2" text-anchor="middle" fill="#1f2937" font-size="12" font-weight="bold">ห้างหุ้นส่วนจำกัด</text>
  <line x1="620" y1="14" x2="620" y2="54" stroke="#1f2937" stroke-width="1"/>
  <text x="705.0" y="38.2" text-anchor="middle" fill="#1f2937" font-size="12" font-weight="bold">บริษัทจำกัด</text>
  <rect x="10" y="54" width="780" height="40" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="18.0" y="78.2" text-anchor="start" fill="#1f2937" font-size="12">จำนวนผู้ก่อตั้ง</text>
  <line x1="150" y1="54" x2="150" y2="94" stroke="#1f2937" stroke-width="1"/>
  <text x="220.0" y="78.2" text-anchor="middle" fill="#1f2937" font-size="12">1 คน</text>
  <line x1="290" y1="54" x2="290" y2="94" stroke="#1f2937" stroke-width="1"/>
  <text x="372.5" y="78.2" text-anchor="middle" fill="#1f2937" font-size="12">2 คนขึ้นไป</text>
  <line x1="455" y1="54" x2="455" y2="94" stroke="#1f2937" stroke-width="1"/>
  <text x="537.5" y="78.2" text-anchor="middle" fill="#1f2937" font-size="12">2 คนขึ้นไป</text>
  <line x1="620" y1="54" x2="620" y2="94" stroke="#1f2937" stroke-width="1"/>
  <text x="705.0" y="78.2" text-anchor="middle" fill="#1f2937" font-size="12">ผู้เริ่มก่อการ 2 คนขึ้นไป</text>
  <rect x="10" y="94" width="780" height="40" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="18.0" y="118.2" text-anchor="start" fill="#1f2937" font-size="12">นิติบุคคล</text>
  <line x1="150" y1="94" x2="150" y2="134" stroke="#1f2937" stroke-width="1"/>
  <text x="220.0" y="118.2" text-anchor="middle" fill="#1f2937" font-size="12">ไม่เป็น</text>
  <line x1="290" y1="94" x2="290" y2="134" stroke="#1f2937" stroke-width="1"/>
  <text x="372.5" y="118.2" text-anchor="middle" fill="#1f2937" font-size="12">เป็นเมื่อจดทะเบียน</text>
  <line x1="455" y1="94" x2="455" y2="134" stroke="#1f2937" stroke-width="1"/>
  <text x="537.5" y="118.2" text-anchor="middle" fill="#1f2937" font-size="12">เป็น (ต้องจดทะเบียน)</text>
  <line x1="620" y1="94" x2="620" y2="134" stroke="#1f2937" stroke-width="1"/>
  <text x="705.0" y="118.2" text-anchor="middle" fill="#1f2937" font-size="12">เป็น (ต้องจดทะเบียน)</text>
  <rect x="10" y="134" width="780" height="40" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="18.0" y="158.2" text-anchor="start" fill="#1f2937" font-size="12">ความรับผิดในหนี้</text>
  <line x1="150" y1="134" x2="150" y2="174" stroke="#1f2937" stroke-width="1"/>
  <text x="220.0" y="158.2" text-anchor="middle" fill="#1f2937" font-size="12">ไม่จำกัด</text>
  <line x1="290" y1="134" x2="290" y2="174" stroke="#1f2937" stroke-width="1"/>
  <text x="372.5" y="158.2" text-anchor="middle" fill="#1f2937" font-size="12">ไม่จำกัด ทุกคนร่วมกัน</text>
  <line x1="455" y1="134" x2="455" y2="174" stroke="#1f2937" stroke-width="1"/>
  <text x="537.5" y="158.2" text-anchor="middle" fill="#1f2937" font-size="12">มีทั้งจำกัดและไม่จำกัด</text>
  <line x1="620" y1="134" x2="620" y2="174" stroke="#1f2937" stroke-width="1"/>
  <text x="705.0" y="158.2" text-anchor="middle" fill="#1f2937" font-size="12">จำกัดไม่เกินค่าหุ้นที่ยังไม่ชำระ</text>
  <rect x="10" y="174" width="780" height="40" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="18.0" y="198.2" text-anchor="start" fill="#1f2937" font-size="12">จดทะเบียนที่</text>
  <line x1="150" y1="174" x2="150" y2="214" stroke="#1f2937" stroke-width="1"/>
  <text x="220.0" y="198.2" text-anchor="middle" fill="#1f2937" font-size="12">ทะเบียนพาณิชย์</text>
  <line x1="290" y1="174" x2="290" y2="214" stroke="#1f2937" stroke-width="1"/>
  <text x="372.5" y="198.2" text-anchor="middle" fill="#1f2937" font-size="12">กรมพัฒนาธุรกิจการค้า</text>
  <line x1="455" y1="174" x2="455" y2="214" stroke="#1f2937" stroke-width="1"/>
  <text x="537.5" y="198.2" text-anchor="middle" fill="#1f2937" font-size="12">กรมพัฒนาธุรกิจการค้า</text>
  <line x1="620" y1="174" x2="620" y2="214" stroke="#1f2937" stroke-width="1"/>
  <text x="705.0" y="198.2" text-anchor="middle" fill="#1f2937" font-size="12">กรมพัฒนาธุรกิจการค้า</text>
  <rect x="10" y="214" width="780" height="40" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="18.0" y="238.2" text-anchor="start" fill="#1f2937" font-size="12">ภาษีเงินได้</text>
  <line x1="150" y1="214" x2="150" y2="254" stroke="#1f2937" stroke-width="1"/>
  <text x="220.0" y="238.2" text-anchor="middle" fill="#1f2937" font-size="12">บุคคลธรรมดา</text>
  <line x1="290" y1="214" x2="290" y2="254" stroke="#1f2937" stroke-width="1"/>
  <text x="372.5" y="238.2" text-anchor="middle" fill="#1f2937" font-size="12">บุคคลธรรมดา*</text>
  <line x1="455" y1="214" x2="455" y2="254" stroke="#1f2937" stroke-width="1"/>
  <text x="537.5" y="238.2" text-anchor="middle" fill="#1f2937" font-size="12">นิติบุคคล</text>
  <line x1="620" y1="214" x2="620" y2="254" stroke="#1f2937" stroke-width="1"/>
  <text x="705.0" y="238.2" text-anchor="middle" fill="#1f2937" font-size="12">นิติบุคคล</text>
  <text x="400.0" y="272.0" text-anchor="middle" fill="#6b7280" font-size="11.5">* ห้างหุ้นส่วนสามัญที่จดทะเบียนเสียภาษีเงินได้นิติบุคคล ส่วนที่ไม่จดทะเบียนเสียภาษีแบบบุคคลธรรมดา</text>
  <text x="400.0" y="292.0" text-anchor="middle" fill="#6b7280" font-size="11.5">สรุปเพื่อการเรียนรู้ ข้อกำหนดอาจเปลี่ยนตามกฎหมาย ตรวจข้อมูลล่าสุดกับกรมพัฒนาธุรกิจการค้าและกรมสรรพากร</text>
</svg>
