<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="sans-serif" font-size="14">
  <title>วงจรการสืบค้นเศรษฐกิจเจ็ดขั้น จากตั้งคำถามไปจนถึงการเขียนสรุป แล้ววนกลับไปปรับคำถามเมื่อได้ข้อมูลใหม่</title>
  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <line x1="508.1" y1="98.6" x2="569.1" y2="127.9" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="604.2" y1="171.9" x2="619.3" y2="237.9" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="606.8" y1="292.8" x2="564.6" y2="345.7" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="513.8" y1="370.1" x2="446.2" y2="370.1" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="395.4" y1="345.7" x2="353.2" y2="292.8" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="340.7" y1="237.9" x2="355.8" y2="171.9" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="390.9" y1="127.9" x2="451.9" y2="98.6" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <circle cx="480.0" cy="85.0" r="11" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="480.0" y="62.0" text-anchor="middle" font-size="14" fill="#1f2937">1. ตั้งคำถาม</text>
  <circle cx="597.3" cy="141.5" r="11" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="682.7" y="120.3" text-anchor="start" font-size="14" fill="#1f2937">2. เลือกแหล่งและเก็บข้อมูล</text>
  <circle cx="626.2" cy="268.4" r="11" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="732.7" y="282.7" text-anchor="start" font-size="14" fill="#1f2937">3. ประเมินความน่าเชื่อถือ</text>
  <circle cx="545.1" cy="370.1" r="11" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="563.3" y="413.0" text-anchor="start" font-size="14" fill="#1f2937">4. จัดข้อมูลเป็นตาราง</text>
  <circle cx="414.9" cy="370.1" r="11" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="396.7" y="413.0" text-anchor="end" font-size="14" fill="#1f2937">5. ตีความแนวโน้มและเหตุผล</text>
  <circle cx="333.8" cy="268.4" r="11" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="227.3" y="282.7" text-anchor="end" font-size="14" fill="#1f2937">6. เสนอทางเลือกและคาดการณ์ผล</text>
  <circle cx="362.7" cy="141.5" r="11" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
