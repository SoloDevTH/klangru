id: computer.algorithms.data-structures
subject: computer
title: { th: "โครงสร้างข้อมูล: สแตก คิว ตารางแฮช ต้นไม้ และกราฟ", en: "Data structures: stacks, queues, hash tables, trees and graphs" }
summary: ชนิดข้อมูลนามธรรม สแตกและคิวพร้อมการใช้งาน ตารางแฮช ต้นไม้ค้นหาแบบทวิภาค กราฟแบบลิสต์ประชิดและเมทริกซ์ประชิด การท่องกราฟแบบกว้างก่อนและลึกก่อน และการเลือกโครงสร้างให้เหมาะกับงาน
difficulty: 6
minutes: 60
prerequisites: [computer.algorithms.searching-sorting]
encompasses:
  - { id: computer.algorithms.searching-sorting, weight: 0.3 }
  - { id: computer.programming.lists-strings, weight: 0.4 }
  - { id: computer.programming.functions, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: stack-queue.svg
    alt: "ด้านซ้ายเป็นสแตก ใส่ 4, 9, 1 ตามลำดับ 1 อยู่บนสุด ลูกศร push ชี้ลงและ pop ชี้ขึ้นที่ด้านบน เข้าทีหลังออกก่อน ใช้กับปุ่มย้อนกลับ undo ตรวจวงเล็บ และกองการเรียกฟังก์ชัน ด้านขวาเป็นคิว A01, A02, A03 enqueue เข้าทางท้ายคิวด้านขวา dequeue ออกทางหัวคิวด้านซ้าย เข้าก่อนออกก่อน ใช้กับคิวรับบริการ คิวพิมพ์งาน และการท่องกราฟแบบกว้างก่อน"
    caption: "สแตกเข้าออกทางเดียว คิวเข้าทางหนึ่งออกอีกทางหนึ่ง"
  - type: worked-example
    title: ไล่การตรวจวงเล็บด้วยสแตก
    problem: "ใช้ฟังก์ชัน balanced ในบทเรียนตรวจข้อความ \"{[()]}(\" ให้ไล่สแตกทีละตัวอักษร และบอกผลลัพธ์"
    steps:
      - text: "{ เป็นวงเล็บเปิด push ได้สแตก [ { ]"
      - text: "[ และ ( เป็นวงเล็บเปิด push ต่อ ได้สแตก [ {, [, ( ] (ตัวท้ายคือบนสุด)"
      - text: ") pop ได้ ( ตรงคู่ เหลือ [ {, [ ] แล้ว ] pop ได้ [ ตรงคู่ เหลือ [ { ] แล้ว } pop ได้ { ตรงคู่ สแตกว่าง"
        why: "วงเล็บที่เปิดล่าสุดต้องปิดก่อน ตรงกับหลักเข้าทีหลังออกก่อนของสแตก"
      - text: "( ตัวสุดท้ายเป็นวงเล็บเปิด push ได้สแตก [ ( ]"
      - text: "จบข้อความแล้วสแตกยังไม่ว่าง len(stack) == 0 เป็นเท็จ คืน False"
        why: "ทุกคู่ที่ปิดถูก แต่ยังมีวงเล็บเปิดค้าง จึงยังไม่สมดุล"
    answer: "False เพราะเหลือ ( ค้างในสแตกหนึ่งตัว"
  - { type: check, problem: computer.algorithms.data-structures.p003, prompt: "ไล่สแตกทีละคำสั่ง" }
  - type: figure
    src: hash-table.svg
    alt: "ตารางแฮช 7 ช่อง ดัชนี 0 ถึง 6 ฟังก์ชัน h(รหัส) = รหัส mod 7 ด้านซ้ายแสดงการคำนวณ 6503 mod 7 = 0, 6512 mod 7 = 2, 6519 mod 7 = 2, 6534 mod 7 = 3, 6508 mod 7 = 5 ช่อง 0 เก็บ 6503 ช่อง 2 เก็บ 6512 แล้วต่อด้วย 6519 (ชนกัน ต่อเป็นลิสต์) ช่อง 3 เก็บ 6534 ช่อง 5 เก็บ 6508 ช่อง 1, 4, 6 ว่าง"
    caption: "ฟังก์ชันแฮชบอกช่องทันที สองคีย์ที่ได้ช่องเดียวกันต่อกันเป็นลิสต์"
  - type: figure
    src: bst.svg
    alt: "ต้นไม้ค้นหาแบบทวิภาคจากการใส่ 50, 30, 70, 20, 40, 60, 80 ราก 50 ลูกซ้าย 30 ลูกขวา 70 ใต้ 30 มีลูกซ้าย 20 ลูกขวา 40 ใต้ 70 มีลูกซ้าย 60 ลูกขวา 80 เส้นทางค้นหา 60 เป็นสีส้ม 60 มากกว่า 50 ไปขวา 60 น้อยกว่า 70 ไปซ้าย เจอ 60 เทียบ 3 ครั้ง"
    caption: "ค้นในต้นไม้ค้นหาแบบทวิภาค เทียบแล้วเลือกลงซ้ายหรือขวาทีละชั้น"
  - type: figure
    src: school-graph.svg
    alt: "กราฟทางเดินในโรงเรียน 6 จุด 0 ประตู 1 อาคาร 1 2 โรงอาหาร 3 ห้องสมุด 4 สนาม 5 หอประชุม เส้นเชื่อม 0–1, 0–2, 1–3, 2–3, 2–4, 3–5, 4–5 ใต้กราฟเขียนว่าลิสต์ประชิดของห้องสมุด (3) คือ [1, 2, 5] ด้านขวาเป็นเมทริกซ์ประชิด 6 × 6 แถว 0 มี 1 ที่คอลัมน์ 1, 2 แถว 1 ที่คอลัมน์ 0, 3 แถว 2 ที่คอลัมน์ 0, 3, 4 แถว 3 ที่คอลัมน์ 1, 2, 5 แถว 4 ที่คอลัมน์ 2, 5 แถว 5 ที่คอลัมน์ 3, 4 นอกนั้นเป็น 0 ใช้ช่องทั้งหมด 36 ช่อง"
    caption: "กราฟเดียวกันแทนได้ทั้งลิสต์ประชิดและเมทริกซ์ประชิด"
  - type: worked-example
    title: ไล่ BFS หาทางที่ผ่านน้อยจุดที่สุด
    problem: "ใช้ bfs ในบทเรียนกับกราฟทางเดินในโรงเรียน เริ่มที่ประตู ให้ไล่คิวและหาว่าจากประตูไปหอประชุมต้องผ่านเส้นเชื่อมน้อยที่สุดกี่เส้น"
    steps:
      - text: "เริ่ม: dist = {ประตู: 0} คิว = [ประตู]"
      - text: "ออกประตู: เพื่อนบ้านคือ อาคาร 1 และโรงอาหาร ได้ระยะ 1 ทั้งคู่ คิว = [อาคาร 1, โรงอาหาร]"
      - text: "ออกอาคาร 1: ห้องสมุดยังไม่เคยเจอ ได้ระยะ 2 คิว = [โรงอาหาร, ห้องสมุด]"
      - text: "ออกโรงอาหาร: ห้องสมุดเจอแล้วข้ามไป สนามได้ระยะ 2 คิว = [ห้องสมุด, สนาม]"
        why: "จุดที่เจอแล้วมีระยะที่สั้นที่สุดอยู่แล้ว เพราะคิวทำให้จุดที่ใกล้กว่าถูกหยิบก่อนเสมอ"
      - text: "ออกห้องสมุด: หอประชุมได้ระยะ 2 + 1 = 3 แล้วสนามและหอประชุมไม่มีจุดใหม่ คิวว่าง จบ"
    answer: "3 เส้น เช่น ประตู → อาคาร 1 → ห้องสมุด → หอประชุม"
  - { type: check, problem: computer.algorithms.data-structures.p007, prompt: "ลองไล่ลำดับการเยี่ยมของ BFS ในกราฟของโจทย์" }
glossary:
  - { term: ชนิดข้อมูลนามธรรม (abstract data type), definition: "คำอธิบายว่าโครงสร้างข้อมูลทำอะไรได้ โดยยังไม่บอกวิธีเก็บในหน่วยความจำ" }
  - { term: สแตก (stack), definition: "โครงสร้างแบบเข้าทีหลังออกก่อน (LIFO) push ใส่ด้านบน pop เอาด้านบนออก" }
  - { term: คิว (queue), definition: "โครงสร้างแบบเข้าก่อนออกก่อน (FIFO) enqueue เข้าท้าย dequeue ออกจากหัว" }
  - { term: ตารางแฮช (hash table), definition: "โครงสร้างที่ใช้ฟังก์ชันแฮชแปลงคีย์เป็นเลขช่อง ค้นได้ในเวลาเฉลี่ย O(1)" }
  - { term: การชนกัน (collision), definition: "เหตุการณ์ที่สองคีย์ได้ช่องเดียวกันในตารางแฮช" }
  - { term: ต้นไม้ค้นหาแบบทวิภาค (binary search tree), definition: "ต้นไม้ที่แต่ละโหนดมีลูกไม่เกินสอง ค่าทางซ้ายน้อยกว่า ค่าทางขวามากกว่าหรือเท่ากับ" }
  - { term: กราฟ (graph), definition: "จุดยอดกับเส้นเชื่อมที่แสดงความสัมพันธ์ เส้นเชื่อมอาจมีทิศทางหรือน้ำหนัก" }
  - { term: ลิสต์ประชิดและเมทริกซ์ประชิด, definition: "สองวิธีแทนกราฟ ลิสต์ประชิดเก็บเพื่อนบ้านของแต่ละจุด เมทริกซ์ประชิดเป็นตาราง V × V" }
  - { term: BFS และ DFS, definition: "การท่องกราฟแบบกว้างก่อน (ใช้คิว ได้ทางที่ผ่านน้อยเส้นที่สุด) และแบบลึกก่อน (ใช้สแตกหรือการเรียกซ้ำ)" }
flashcards:
  - { front: "สแตกกับคิวต่างกันอย่างไร", back: "สแตกเข้าทีหลังออกก่อน (LIFO) คิวเข้าก่อนออกก่อน (FIFO)" }
  - { front: "ทำไมทำคิวด้วย deque แทน list.pop(0)", back: "pop(0) ต้องเลื่อนทุกตัวที่เหลือ O(n) ส่วน deque.popleft() เป็น O(1)" }
  - { front: "ตารางแฮชค้นด้วยคีย์ใช้เวลาเท่าใด และมีข้อจำกัดอะไร", back: "เฉลี่ย O(1) แต่ข้อมูลไม่เรียงตามคีย์ ค้นเป็นช่วงได้ไม่ดี" }
  - { front: "ใส่ 1, 2, 3, ..., n ลงต้นไม้ค้นหาแบบทวิภาคตามลำดับ จะได้อะไร", back: "ต้นไม้เอียงเป็นเส้นตรง สูง n ค้นช้าเท่าลิสต์" }
  - { front: "อยากรู้ทางที่ผ่านเส้นเชื่อมน้อยที่สุด ใช้ BFS หรือ DFS", back: "BFS (ใช้คิว)" }
