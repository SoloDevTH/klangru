<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
<title>กราฟแท่งแสดงจุดเดือดของ F2 Cl2 Br2 I2 เพิ่มขึ้นจากลบถึงบวก และอิเล็กโทรเนกาติวิตีลดลงจาก F ไป I</title>
<rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
<text x="170" y="36" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d3557" font-family="Loma, sans-serif">จุดเดือดปกติของแฮโลเจน</text>
<line x1="30" y1="170.0" x2="330" y2="170.0" stroke="#444" stroke-width="1.2"/>
<line x1="30" y1="70" x2="30" y2="270" stroke="#444" stroke-width="1.2"/>
<rect x="47.0" y="170.0" width="46" height="85.5" fill="#f4d35e" stroke="#222" stroke-width="1"/>
<text x="70" y="269.5" font-size="12" text-anchor="middle" fill="#222" font-family="sans-serif">−188.1</text>
<text x="70" y="288" font-size="13" text-anchor="middle" fill="#222" font-family="sans-serif">F₂</text>
<rect x="119.0" y="170.0" width="46" height="15.5" fill="#9bd770" stroke="#222" stroke-width="1"/>
<text x="142" y="199.5" font-size="12" text-anchor="middle" fill="#222" font-family="sans-serif">−34.0</text>
<text x="142" y="288" font-size="13" text-anchor="middle" fill="#222" font-family="sans-serif">Cl₂</text>
<rect x="191.0" y="143.3" width="46" height="26.7" fill="#c1440e" stroke="#222" stroke-width="1"/>
<text x="214" y="137.3" font-size="12" text-anchor="middle" fill="#222" font-family="sans-serif">58.8</text>
<text x="214" y="288" font-size="13" text-anchor="middle" fill="#222" font-family="sans-serif">Br₂</text>
<rect x="263.0" y="86.2" width="46" height="83.8" fill="#5b4a8b" stroke="#222" stroke-width="1"/>
<text x="286" y="80.2" font-size="12" text-anchor="middle" fill="#222" font-family="sans-serif">184.3</text>
<text x="286" y="288" font-size="13" text-anchor="middle" fill="#222" font-family="sans-serif">I₂</text>
<text x="170" y="310" font-size="12" text-anchor="middle" fill="#444" font-family="Loma, sans-serif">หน่วย °C</text>
<text x="550" y="36" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d3557" font-family="Loma, sans-serif">อิเล็กโทรเนกาติวิตี (Pauling)</text>
<line x1="410" y1="70" x2="410" y2="270" stroke="#444" stroke-width="1.2"/>
<rect x="427.0" y="89.1" width="46" height="180.9" fill="#f4d35e" stroke="#222" stroke-width="1"/>
<text x="450" y="83.1" font-size="12" text-anchor="middle" fill="#222" font-family="sans-serif">3.98</text>
<text x="450" y="288" font-size="13" text-anchor="middle" fill="#222" font-family="sans-serif">F</text>
<rect x="499.0" y="126.4" width="46" height="143.6" fill="#9bd770" stroke="#222" stroke-width="1"/>
<text x="522" y="120.4" font-size="12" text-anchor="middle" fill="#222" font-family="sans-serif">3.16</text>
<text x="522" y="288" font-size="13" text-anchor="middle" fill="#222" font-family="sans-serif">Cl</text>
<rect x="571.0" y="135.5" width="46" height="134.5" fill="#c1440e" stroke="#222" stroke-width="1"/>
<text x="594" y="129.5" font-size="12" text-anchor="middle" fill="#222" font-family="sans-serif">2.96</text>
<text x="594" y="288" font-size="13" text-anchor="middle" fill="#222" font-family="sans-serif">Br</text>
<rect x="643.0" y="149.1" width="46" height="120.9" fill="#5b4a8b" stroke="#222" stroke-width="1"/>
<text x="666" y="143.1" font-size="12" text-anchor="middle" fill="#222" font-family="sans-serif">2.66</text>
<text x="666" y="288" font-size="13" text-anchor="middle" fill="#222" font-family="sans-serif">I</text>
<text x="550" y="310" font-size="12" text-anchor="middle" fill="#444" font-family="Loma, sans-serif">ค่าไม่มีหน่วย (มากกว่า = ดึงอิเล็กตรอนได้ดีกว่า)</text>
<text x="380.0" y="370" font-size="13" text-anchor="middle" fill="#1d3557" font-family="Loma, sans-serif" font-weight="bold">ที่ 25 °C: F₂ และ Cl₂ เป็นแก๊ส Br₂ เป็นของเหลว I₂ เป็นของแข็ง</text>
<text x="380.0" y="396" font-size="12" text-anchor="middle" fill="#666" font-family="Loma, sans-serif">จุดเดือดเพิ่มขึ้นตามมวลโมเลกุลและแรงแวนเดอร์วาลส์ ส่วนอิเล็กโทรเนกาติวิตีลดลงจาก F ไป I</text>
</svg>
