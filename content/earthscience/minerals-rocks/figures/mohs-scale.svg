<rect x="0" y="0" width="760" height="340" fill="#ffffff"/>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#e0f2fe"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient></defs>
<rect x="60" y="156" width="660" height="28" fill="url(#g)" stroke="#111"/>
