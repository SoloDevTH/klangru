topic: health.family.respectful-relationships
rows:
  - { framework: au-ac9-hpe, indicators: ["AC9HP8P04"], coverage: full }
  - { framework: au-ac9-hpe, indicators: ["AC9HP6P04"], coverage: partial, note: "สอนการแสดงความเคารพและความเห็นอกเห็นใจในคำพูดและการกระทำ (บทเรียนส่วนความเคารพและ p001) แต่การแสดงออกจริงในความสัมพันธ์ทำนอกแอป" }
  - { framework: au-ac9-hpe, indicators: ["AC9HP6P07", "AC9HP8P07"], coverage: partial, note: "สอนกลยุทธ์การขอ ให้ และปฏิเสธความยินยอม ประโยค \"ฉัน...\" และการปฏิเสธอย่างมั่นใจ (p004, p005, p009, p016) แต่การซ้อมสื่อสารและการใช้จริงทำนอกแอป ระดับ 7–8 ที่ให้ใช้ทักษะจริงวัดในแอปไม่ได้" }
  - { framework: au-ac9-hpe, indicators: ["AC9HP8P03"], coverage: partial, note: "สอนอำนาจ การบังคับ การควบคุม และภาพเหมารวมทางเพศ เช่น \"หึงแปลว่ารัก\" (p008, p010) แต่ยังไม่ได้วิเคราะห์บทบาทและการตัดสินใจในความสัมพันธ์ตามเพศอย่างเป็นระบบ" }
  - { framework: au-ac9-hpe, indicators: ["AC9HP10P03"], coverage: partial, note: "สอนความเสมอภาคและการท้าทายภาพเหมารวมทางเพศเพื่อป้องกันความรุนแรง แต่ระดับ 9–10 ที่ให้สืบค้นเชิงลึกเกินกว่าที่บทเรียนสอน" }
  - { framework: au-ac9-hpe, indicators: ["AC9HP10P04"], coverage: partial, note: "สอนผลของความเคารพ ความเห็นอกเห็นใจ อำนาจ และการบังคับ พร้อมโจทย์วิเคราะห์ (p011, p012, p013) แต่การประเมินผลระยะยาวต่อความสัมพันธ์ยังไม่ลึกเท่าระดับ 9–10" }
  - { framework: au-ac9-hpe, indicators: ["AC9HP10P07"], coverage: partial, note: "สอนการสื่อสารเรื่องการเลือก การยินยอม และการแสดงความต้องการในความสัมพันธ์ทั่วไป แต่ตั้งใจไม่ลงรายละเอียดความสัมพันธ์ทางเพศ (กล่าวถึงเฉพาะหลักความยินยอม) จึงเป็น partial และต้องให้ผู้เชี่ยวชาญเพศวิถีศึกษาตรวจ" }
