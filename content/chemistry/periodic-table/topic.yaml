id: chemistry.matter.periodic-table
subject: chemistry
title: { th: ตารางธาตุและการจัดเรียงอิเล็กตรอน, en: The periodic table and electron arrangement }
summary: ธาตุในตารางธาตุเรียงตามเลขอะตอม คาบบอกจำนวนชั้นของอิเล็กตรอน หมู่บอกจำนวนเวเลนซ์อิเล็กตรอน และสมบัติของธาตุเปลี่ยนอย่างมีแบบแผน
difficulty: 3.5
minutes: 30
prerequisites: [chemistry.matter.atoms]
encompasses:
  - { id: chemistry.matter.atoms, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: simulation
    title: เติมอิเล็กตรอนทีละชั้น (PhET Build an Atom)
    url: https://phet.colorado.edu/en/simulations/build-an-atom
    provider: phet
    note: สร้างอะตอมตั้งแต่ไฮโดรเจนถึงนีออน สังเกตว่าอิเล็กตรอนเต็มชั้นในสุด 2 ตัวก่อน แล้วจึงไปอยู่ชั้นถัดไปได้อีก 8 ตัว
glossary:
  - { term: คาบ, definition: แถวแนวนอนของตารางธาตุ ธาตุในคาบเดียวกันมีจำนวนชั้นของอิเล็กตรอนเท่ากัน }
  - { term: หมู่, definition: แถวแนวตั้งของตารางธาตุ ธาตุหมู่เดียวกันมีเวเลนซ์อิเล็กตรอนเท่ากันและมีสมบัติทางเคมีคล้ายกัน }
  - { term: เวเลนซ์อิเล็กตรอน, definition: อิเล็กตรอนในชั้นนอกสุดของอะตอม เป็นตัวกำหนดว่าธาตุเกิดปฏิกิริยาอย่างไร }
  - { term: แก๊สมีตระกูล, definition: ธาตุหมู่ 18 ชั้นนอกสุดมีอิเล็กตรอนเต็ม จึงแทบไม่ทำปฏิกิริยากับธาตุอื่น }
flashcards:
  - { front: "จำนวนอิเล็กตรอนสูงสุดในชั้นที่ 1, 2, 3 (แบบง่ายสำหรับธาตุลำดับ 1–20)", back: "2, 8, 8 เช่น แคลเซียม ($Z = 20$) จัดเป็น 2, 8, 8, 2" }
  - { front: "คาบและหมู่บอกอะไรเกี่ยวกับการจัดเรียงอิเล็กตรอน", back: "คาบ = จำนวนชั้นที่มีอิเล็กตรอน · หมู่ 1–2 = จำนวนเวเลนซ์อิเล็กตรอน · หมู่ 13–18 = เวเลนซ์อิเล็กตรอน + 10 (ยกเว้นฮีเลียม)" }
  - { front: "ขนาดอะตอมเปลี่ยนอย่างไรในตารางธาตุ", back: "ใหญ่ขึ้นเมื่อลงล่างในหมู่เดียวกัน (ชั้นเพิ่ม) และเล็กลงเมื่อไปทางขวาในคาบเดียวกัน (โปรตอนดึงแรงขึ้น)" }
  - { front: "ชื่อหมู่ 1, 2, 17 และ 18", back: "โลหะแอลคาไล · โลหะแอลคาไลน์เอิร์ท · แฮโลเจน · แก๊สมีตระกูล" }
