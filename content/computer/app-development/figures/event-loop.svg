  <text x="740.0" y="223.1" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">ข้อมูลเปลี่ยน</text>
  <text x="740.0" y="242.7" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">→ วาดหน้าจอใหม่</text>
  <line x1="740.0" y1="158.0" x2="740.0" y2="198.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah)"/>
  <path d="M648.0,240.0 Q560.0,250.0 505.0,182.0" fill="none" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="560.0" y="280.0" font-size="13" text-anchor="middle" fill="#6b7280" xml:space="preserve">รอเหตุการณ์ถัดไป</text>
