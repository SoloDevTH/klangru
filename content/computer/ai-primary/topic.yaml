id: computer.ai.ai-primary
subject: computer
title: { th: คอมพิวเตอร์เรียนรู้จากตัวอย่าง, en: "Computers learn from examples" }
summary: จำแนกสิ่งต่าง ๆ จากลักษณะที่สังเกตได้ เปรียบเทียบการเรียนรู้ของคนกับเครื่อง ฝึกแบบจำลองด้วยตัวอย่างที่ติดป้าย และทดสอบด้วยภาพใหม่เพื่อดูว่าแบบจำลองแม่นแค่ไหน
difficulty: 2.5
minutes: 40
prerequisites: [computer.algorithms.logical-reasoning, computer.data.digital-data-basics]
encompasses:
  - { id: computer.data.digital-data-basics, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: train-and-test.svg
    alt: "ด้านซ้ายเป็นตัวอย่างฝึกที่มีป้ายกำกับ มีมะม่วงสามลูกสีเหลืองในแถวบน กล้วยสามผลโค้งในแถวกลาง และส้มสามลูกสีส้มในแถวล่าง ด้านขวาเป็นภาพทดสอบที่ยังไม่มีป้าย แสดงผลไม้สีเหลืองหนึ่งลูกในกรอบประ"
    caption: "ตัวอย่างฝึกมีป้ายกำกับให้เครื่องเรียน ส่วนภาพทดสอบเป็นภาพที่เครื่องยังไม่เคยเห็น"
  - type: worked-example
    title: วัดความแม่นของแบบจำลองจากภาพทดสอบ
    problem: "ทดสอบแบบจำลองด้วยภาพใหม่ 10 ภาพ ทายถูก 8 ภาพ ทายผิด 2 ภาพ คือ กล้วย 1 ภาพที่ทายเป็นมะม่วง และส้ม 1 ภาพที่ทายเป็นมะม่วง ความถูกต้องเป็นกี่เปอร์เซ็นต์ และควรปรับปรุงอย่างไร"
    steps:
      - text: "นับภาพทดสอบทั้งหมด ได้ 10 ภาพ"
      - text: "นับภาพที่ทายถูก ได้ 8 ภาพ"
      - text: "คำนวณความถูกต้อง 8 ÷ 10 × 100 = 80 เปอร์เซ็นต์"
      - text: "ดูว่าผิดแบบไหน ทั้งสองภาพที่ผิดถูกทายเป็นมะม่วง"
        why: "การดูว่าผิดแบบไหนช่วยบอกว่าควรเพิ่มตัวอย่างของชนิดใด ไม่ใช่แค่รู้ว่าผิดกี่ภาพ"
      - text: "ควรเพิ่มภาพกล้วยและส้มที่หลากหลาย ทั้งแสงน้อยและมุมต่างกัน แล้วฝึกและทดสอบใหม่"
    answer: "ความถูกต้อง 80 เปอร์เซ็นต์ ควรเพิ่มตัวอย่างกล้วยและส้มที่ทายผิดแล้วทดสอบใหม่"
  - { type: check, problem: computer.ai.ai-primary.p004, prompt: "ทำไมต้องทดสอบด้วยภาพที่ไม่เคยใช้ฝึก" }
  - type: figure
    src: training-cycle.svg
    alt: "วงจรการฝึกแบบจำลองมีห้าขั้นเรียงเป็นวง เริ่มจาก 1 เก็บภาพตัวอย่าง ไปที่ 2 ติดป้ายกำกับ ไปที่ 3 ฝึกแบบจำลอง ไปที่ 4 ทดสอบด้วยภาพใหม่ ไปที่ 5 เพิ่มตัวอย่างที่ทายผิด แล้ววนกลับไปขั้นที่ 1"
    caption: "ขั้นที่ 5 ทำให้วงจรวนกลับไปเก็บตัวอย่างเพิ่มและฝึกใหม่"
  - type: worked-example
    title: เพิ่มตัวอย่างที่ขาดแล้วฝึกใหม่
    problem: "ตัวอย่างฝึกเดิมมีมะม่วงสุก 20 ภาพ และยังไม่มีมะม่วงดิบเลย เมื่อให้ทดสอบด้วยมะม่วงดิบแบบจำลองทายว่าไม่ใช่มะม่วง ถ้าเพิ่มมะม่วงดิบอีก 10 ภาพ แล้วฝึกใหม่ มะม่วงดิบคิดเป็นกี่เปอร์เซ็นต์ของตัวอย่างทั้งหมด"
    steps:
      - text: "ตัวอย่างเดิมมีมะม่วงสุก 20 ภาพ และมะม่วงดิบ 0 ภาพ"
      - text: "แบบจำลองไม่เคยเห็นสีเขียวของมะม่วงดิบ จึงทายว่าไม่ใช่มะม่วง"
      - text: "เพิ่มมะม่วงดิบ 10 ภาพ ตัวอย่างทั้งหมดเป็น 30 ภาพ มะม่วงดิบคิดเป็น 10 ÷ 30 × 100 ≈ 33.33 เปอร์เซ็นต์"
        why: "ถ้าตัวอย่างของลักษณะใดน้อยเกินไปเทียบกับกลุ่มอื่น แบบจำลองจะเรียนลักษณะนั้นได้ไม่ดี"
      - text: "ฝึกใหม่แล้วทดสอบด้วยมะม่วงดิบภาพใหม่ แบบจำลองจะทายถูกมากขึ้น"
    answer: "หลังเพิ่มตัวอย่างมะม่วงดิบ มะม่วงดิบคิดเป็นประมาณ 33.33 เปอร์เซ็นต์ของตัวอย่าง และแบบจำลองทายถูกมากขึ้น"
  - { type: check, problem: computer.ai.ai-primary.p011, prompt: "ถ้าเก็บแต่ภาพแอปเปิลแดง แบบจำลองจะแยกมะนาวได้หรือไม่" }
glossary:
  - { term: ลักษณะ (feature), definition: "สิ่งที่สังเกตได้จากของสิ่งหนึ่ง เช่น สี ขนาด รูปร่าง หรือเสียง ใช้ช่วยจำแนกสิ่งต่าง ๆ" }
  - { term: การจำแนก (classification), definition: "การจัดกลุ่มสิ่งต่าง ๆ ให้อยู่ในประเภทที่ถูกต้องตามลักษณะที่สังเกต" }
  - { term: แบบจำลอง (model), definition: "สิ่งที่เครื่องสร้างจากตัวอย่างเพื่อใช้ทำนายหรือทายคำตอบกับข้อมูลใหม่" }
  - { term: ป้ายกำกับ (label), definition: "ชื่อหรือคำตอบที่ติดกับตัวอย่างฝึก เช่น ชื่อผลไม้ของภาพนั้น" }
  - { term: ความถูกต้อง (accuracy), definition: "ร้อยละของคำทายที่ถูกเมื่อเทียบกับจำนวนภาพทดสอบทั้งหมด" }
flashcards:
  - { front: "ตัวอย่างฝึกต่างจากตัวอย่างทดสอบอย่างไร", back: "ตัวอย่างฝึกใช้สอนแบบจำลองและมีป้าย ส่วนตัวอย่างทดสอบเป็นภาพใหม่ที่ไม่เคยใช้สอนเพื่อวัดความแม่นยำ" }
  - { front: "แบบจำลองทายผิดกับกลุ่มที่ตัวอย่างน้อย ควรทำอย่างไร", back: "เพิ่มตัวอย่างของกลุ่มนั้นให้หลากหลาย แล้วฝึกและทดสอบใหม่" }
  - { front: "คนกับเครื่องเรียนรู้จากตัวอย่างต่างกันอย่างไร", back: "คนเรียนจากตัวอย่างไม่กี่ชิ้นและเข้าใจบริบท ส่วนเครื่องต้องการตัวอย่างจำนวนมากและไม่เข้าใจบริบทเหมือนคน" }
  - { front: "ความถูกต้อง 8 ภาพจาก 10 ภาพคือกี่เปอร์เซ็นต์", back: "80 เปอร์เซ็นต์" }
