<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" font-family="sans-serif">
  <title>จำนวนสถานะจุลภาคของการโยนเหรียญสี่เหรียญแยกตามจำนวนหัว</title>
  <rect width="660" height="330" fill="#ffffff"/>
  <line x1="80" y1="260" x2="640" y2="260" stroke="#1d1d1d" stroke-width="1.5"/>
  <rect x="100.0" y="226.7" width="70.0" height="33.3" fill="#1d4f91" fill-opacity="0.85"/><text x="135.0" y="218.7" font-size="16" text-anchor="middle" fill="#1d1d1d">W = 1</text><rect x="210.0" y="126.7" width="70.0" height="133.3" fill="#1d4f91" fill-opacity="0.85"/><text x="245.0" y="118.7" font-size="16" text-anchor="middle" fill="#1d1d1d">W = 4</text><rect x="320.0" y="60.0" width="70.0" height="200.0" fill="#d9822b" fill-opacity="0.85"/><text x="355.0" y="52.0" font-size="16" text-anchor="middle" fill="#1d1d1d">W = 6</text><rect x="430.0" y="126.7" width="70.0" height="133.3" fill="#1d4f91" fill-opacity="0.85"/><text x="465.0" y="118.7" font-size="16" text-anchor="middle" fill="#1d1d1d">W = 4</text><rect x="540.0" y="226.7" width="70.0" height="33.3" fill="#1d4f91" fill-opacity="0.85"/><text x="575.0" y="218.7" font-size="16" text-anchor="middle" fill="#1d1d1d">W = 1</text>
  <text x="135.0" y="284" font-size="15" text-anchor="middle" fill="#1d1d1d">0 หัว</text><text x="245.0" y="284" font-size="15" text-anchor="middle" fill="#1d1d1d">1 หัว</text><text x="355.0" y="284" font-size="15" text-anchor="middle" fill="#1d1d1d">2 หัว</text><text x="465.0" y="284" font-size="15" text-anchor="middle" fill="#1d1d1d">3 หัว</text><text x="575.0" y="284" font-size="15" text-anchor="middle" fill="#1d1d1d">4 หัว</text>
  <text x="330.0" y="318" font-size="14" text-anchor="middle" fill="#555">สถานะมหภาคแยกตามจำนวนหัว รวมจำนวนสถานะจุลภาคทั้งหมด 2⁴ = 16</text>
</svg>
