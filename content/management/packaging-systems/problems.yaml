  - id: management.operations.packaging-systems.p013
    topics: [management.operations.packaging-systems]
    difficulty: 4
    type: code
    stem: "เขียนฟังก์ชัน `ean13_check(digits)` ที่รับสตริงตัวเลข 12 หลัก (หลัก 1 ถึง 12 ของรหัส EAN-13) แล้วคืนค่าเลขตรวจสอบหลักที่ 13 โดยหลักที่ตำแหน่งคี่ (1, 3, 5, ...) มีน้ำหนัก 1 และหลักที่ตำแหน่งคู่มีน้ำหนัก 3 หาผลรวมของผลคูณ แล้วคืน (10 − ผลรวม mod 10) mod 10"
    starter: |
      def ean13_check(digits):
          pass
    tests: |
      r = ean13_check("400638133393")
      assert r is not None, "ยังไม่ได้คืนค่า (ได้ None) ต้องใช้ return ไม่ใช่ print"
      assert r == 1, f"ean13_check('400638133393') ควรได้ 1 แต่ได้ {r}"
      assert ean13_check("590123412345") == 7, f"ean13_check('590123412345') ควรได้ 7 แต่ได้ {ean13_check('590123412345')}"
      assert ean13_check("885123456789") == 8, f"ean13_check('885123456789') ควรได้ 8 แต่ได้ {ean13_check('885123456789')}"
      assert ean13_check("885000000001") == 0, f"ผลรวมหารด้วย 10 ลงตัวพอดี เลขตรวจต้องเป็น 0 ไม่ใช่ 10 แต่ได้ {ean13_check('885000000001')} (ลืมทำ mod 10 รอบสุดท้าย)"
    reference: |
      def ean13_check(digits):
          total = 0
          for i, ch in enumerate(digits):
              total += int(ch) * (1 if i % 2 == 0 else 3)
          return (10 - total % 10) % 10
    hints:
      - "ใช้ enumerate เพื่อรู้ตำแหน่งของแต่ละหลัก และแปลงตัวอักษรเป็นตัวเลขด้วย int"
      - "ตำแหน่งที่เริ่มนับจาก 0 ถ้าหารด้วย 2 เหลือ 0 คือหลักที่มีน้ำหนัก 1"
      - "ผลรวมที่ลงตัวพอดีต้องให้เลขตรวจเป็น 0 ดูว่าต้องทำ mod 10 ตรงไหนบ้าง"
    solution: "def ean13_check(digits): วนลูปหลักทีละตัว คูณด้วยน้ำหนัก 1 หรือ 3 ตามตำแหน่ง รวมผลคูณ แล้วคืน (10 − total % 10) % 10 ซึ่งทำให้ได้ 0 เมื่อผลรวมลงตัวพอดี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.packaging-systems.p014
    topics: [management.operations.packaging-systems]
    difficulty: 3
    type: mcq
    stem: "เหตุผลหลักที่ควรเลือกขนาดพาเลทให้เข้ากับพื้นที่ภายในตู้คอนเทนเนอร์และรถบรรทุกคืออะไร"
    choices:
