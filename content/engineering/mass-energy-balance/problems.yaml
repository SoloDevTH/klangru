    hints:
      - "ไอเสีย: $\\mathrm{CO_2}$ จากการเผาไหม้บวกที่มากับไบโอแก๊ส $\\mathrm{O_2}$ ที่เหลือ และ $\\mathrm{N_2}$ ทั้งหมดจากอากาศ"
      - "$\\mathrm{N_2} = 144 \\times 79/21$ ตัด $\\mathrm{H_2O}$ ออกก่อนหาร้อยละ"
    solution: "$\\mathrm{CO_2} = 60 + 40 = 100$, $\\mathrm{O_2} = 144 - 120 = 24$, $\\mathrm{N_2} = 541.7$, $\\mathrm{H_2O} = 120$ (ไม่นับ) ฐานแห้ง $= 665.7\\ \\mathrm{mol}$ $\\mathrm{CO_2} = 100/665.7 = 15.0\\%$ ตรวจด้วยดุลอะตอม O: เข้า $2(40) + 2(144) = 368$ ออก $2(100) + 120 + 2(24) = 368$"
