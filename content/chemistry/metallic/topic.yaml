id: chemistry.bonding.metallic
subject: chemistry
title: { th: พันธะโลหะและการเปรียบเทียบสมบัติของสาร, en: Metallic bonding and comparing properties of substances }
summary: การเกิดพันธะโลหะด้วยแบบจำลองทะเลอิเล็กตรอน สมบัติของโลหะและโลหะผสม และการเปรียบเทียบสมบัติกับการใช้ประโยชน์ของสารไอออนิก สารโคเวเลนต์ และโลหะ
difficulty: 4.5
minutes: 35
prerequisites: [chemistry.bonding.ionic, chemistry.bonding.polarity-intermolecular]
encompasses:
  - { id: chemistry.bonding.ionic, weight: 0.3 }
  - { id: chemistry.bonding.polarity-intermolecular, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: metal-vs-ionic-layers.svg
    alt: "แผนภาพสองฝั่ง ฝั่งซ้ายเป็นโลหะ: ไอออนบวก 3 แถว แถวละ 6 ตัว อยู่ในพื้นสีฟ้าอ่อนที่มีจุดเล็ก ๆ แทนอิเล็กตรอนอิสระกระจายทั่ว มีลูกศรแรงกดที่แถวบน หลังแถวบนเลื่อนไปหนึ่งตำแหน่ง ไอออนบวกยังอยู่ในทะเลอิเล็กตรอน ข้อความว่าโลหะเปลี่ยนรูปได้โดยไม่แตก ฝั่งขวาเป็นสารไอออนิก: ไอออนบวกและลบสลับกันแบบตาราง หลังแถวบนเลื่อนไปหนึ่งตำแหน่ง ไอออนบวกอยู่เหนือไอออนบวก ไอออนลบอยู่เหนือไอออนลบ มีลูกศรสีแดงชี้ออกจากกันแสดงแรงผลัก ข้อความว่าผลึกแตกตามแนวชั้น"
    caption: "เมื่อชั้นเลื่อน ทะเลอิเล็กตรอนยังยึดไอออนบวกในโลหะ แต่ในผลึกไอออนิก ไอออนประจุเดียวกันผลักกัน"
  - { type: check, problem: chemistry.bonding.metallic.p007, prompt: "นึกภาพชั้นไอออนเลื่อนไปหนึ่งตำแหน่ง" }
  - type: worked-example
    title: อธิบายจุดหลอมเหลวของ Na Mg Al
    problem: "จุดหลอมเหลวของโซเดียม แมกนีเซียม และอะลูมิเนียม เป็น 98, 650 และ 660 °C ตามลำดับ จงอธิบายแนวโน้มนี้ด้วยพันธะโลหะ"
    steps:
      - text: "หาเวเลนซ์อิเล็กตรอน: Na หมู่ 1 มี 1 ตัว Mg หมู่ 2 มี 2 ตัว Al หมู่ 13 มี 3 ตัว"
      - text: "ทุกอะตอมให้อิเล็กตรอนเหล่านี้เป็นอิเล็กตรอนอิสระ ได้ไอออน $\\mathrm{Na^+}$, $\\mathrm{Mg^{2+}}$, $\\mathrm{Al^{3+}}$"
      - text: "ไอออนประจุมากขึ้นและเล็กลงในคาบเดียวกัน และมีอิเล็กตรอนอิสระมากขึ้น แรงดึงดูดระหว่างไอออนกับทะเลอิเล็กตรอนจึงแรงขึ้น"
        why: "แรงไฟฟ้ามากขึ้นเมื่อประจุมากขึ้นและระยะห่างน้อยลง"
      - text: "ต้องใช้พลังงานมากขึ้นเพื่อทำให้ไอออนเคลื่อนที่ผ่านกันได้ จุดหลอมเหลวจึงสูงขึ้นจาก Na ไป Al"
    answer: "พันธะโลหะแข็งแรงขึ้นตามจำนวนอิเล็กตรอนอิสระและประจุของไอออน จุดหลอมเหลวจึงเรียง Na < Mg < Al"
  - type: worked-example
    title: ระบุชนิดของสารจากข้อมูล
    problem: "สาร P หลอมเหลวที่ 2,852 °C ของแข็งไม่นำไฟฟ้า แต่เมื่อหลอมเหลวนำไฟฟ้าได้ สาร Q หลอมเหลวที่ 1,085 °C นำไฟฟ้าทั้งของแข็งและของเหลว ตีเป็นแผ่นได้ P และ Q เป็นสารประเภทใด และน่าจะเป็นสารใด"
    steps:
      - text: "P ไม่นำไฟฟ้าเมื่อเป็นของแข็ง แต่นำเมื่อหลอมเหลว แสดงว่ามีไอออนที่ถูกตรึงไว้ในผลึกและเคลื่อนที่ได้เมื่อหลอม"
      - text: "P จึงเป็นสารประกอบไอออนิก จุดหลอมเหลวสูงมากบอกว่าไอออนมีประจุมาก เช่น MgO ($\\mathrm{Mg^{2+}}$, $\\mathrm{O^{2-}}$)"
      - text: "Q นำไฟฟ้าได้ทั้งสองสถานะและตีแผ่ได้ แสดงว่ามีอิเล็กตรอนอิสระ Q จึงเป็นโลหะ จุดหลอมเหลว 1,085 °C ตรงกับทองแดง"
        why: "สารไอออนิกนำไฟฟ้าได้เมื่อหลอมเหลวเท่านั้น โลหะนำได้ทั้งของแข็งและของเหลว"
    answer: "P เป็นสารประกอบไอออนิก (เช่น MgO) · Q เป็นโลหะ (เช่น ทองแดง)"
  - { type: check, problem: chemistry.bonding.metallic.p011, prompt: "ดูการนำไฟฟ้าทั้งสองสถานะก่อน" }
glossary:
  - { term: พันธะโลหะ, definition: แรงดึงดูดระหว่างไอออนบวกของโลหะกับอิเล็กตรอนอิสระที่เคลื่อนที่ไปทั่วทั้งก้อน }
  - { term: ทะเลอิเล็กตรอน, definition: แบบจำลองที่มองเวเลนซ์อิเล็กตรอนของโลหะว่าเคลื่อนที่อิสระรอบไอออนบวกทั้งหมด }
  - { term: โลหะผสม, definition: "สารที่เกิดจากโลหะผสมกับโลหะหรืออโลหะอื่น มักแข็งกว่าโลหะบริสุทธิ์ เช่น ทองเหลือง สำริด" }
  - { term: ตีแผ่ได้, definition: สมบัติที่ทุบหรือรีดให้เป็นแผ่นบางได้โดยไม่แตก }
flashcards:
  - { front: "อะไรเคลื่อนที่เมื่อโลหะนำไฟฟ้า", back: "อิเล็กตรอนอิสระ (ไอออนบวกอยู่กับที่)" }
  - { front: "ทำไมโลหะตีแผ่ได้แต่ผลึกไอออนิกเปราะ", back: "ชั้นไอออนบวกในโลหะเลื่อนได้โดยทะเลอิเล็กตรอนยังยึดไว้ ในผลึกไอออนิก ชั้นที่เลื่อนทำให้ไอออนประจุเดียวกันผลักกัน" }
  - { front: "จุดหลอมเหลว Na < Mg < Al เพราะ", back: "อิเล็กตรอนอิสระต่ออะตอมและประจุของไอออนเพิ่มขึ้น พันธะโลหะจึงแข็งแรงขึ้น" }
  - { front: "สารใดนำไฟฟ้าเมื่อหลอมเหลวแต่ไม่นำเมื่อเป็นของแข็ง", back: "สารประกอบไอออนิก" }
  - { front: "ทำไมโลหะผสมแข็งกว่าโลหะบริสุทธิ์", back: "อะตอมขนาดต่างกันขวางไม่ให้ชั้นไอออนเลื่อนผ่านกันง่าย" }
