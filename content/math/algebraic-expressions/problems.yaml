problems:
  - id: math.expr.p001
    topics: [math.algebra.expressions]
    difficulty: 1
    type: mcq
    stem: "ในนิพจน์ $5x - 3y + 7$ สัมประสิทธิ์ของ $y$ คือข้อใด"
    choices:
      - { id: a, text: "$-3$", correct: true }
      - { id: b, text: "$3$", feedback: "เกือบถูก แต่เครื่องหมายหน้าพจน์ติดไปกับพจน์ด้วย พจน์นี้คือ $-3y$" }
      - { id: c, text: "$5$", feedback: "5 คือสัมประสิทธิ์ของ $x$ โจทย์ถามของ $y$" }
      - { id: d, text: "$7$", feedback: "7 คือค่าคงตัว ไม่ได้คูณกับตัวแปรใดเลย" }
    hints:
      - "สัมประสิทธิ์คือตัวเลขที่คูณอยู่หน้าตัวแปร"
      - "หาพจน์ที่มี $y$ แล้วดูตัวเลขข้างหน้า พร้อมเครื่องหมายของพจน์นั้น"
    solution: "นิพจน์มี 3 พจน์ คือ $5x$, $-3y$ และ $7$ พจน์ที่มี $y$ คือ $-3y$ สัมประสิทธิ์ของ $y$ จึงเป็น $-3$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.expr.p002
    topics: [math.algebra.expressions]
    difficulty: 1
    type: numeric
    stem: "ลูกชิ้นไม้ละ 3 บาท ซื้อ $x$ ไม้ และซื้อน้ำจิ้มเพิ่มอีก 2 บาท ราคารวมคือ $3x + 2$ บาท ถ้าซื้อ 4 ไม้ ต้องจ่ายกี่บาท"
    answer: { value: 14, unit: บาท }
    hints:
      - "แทน $x$ ด้วย 4 โดยใส่วงเล็บ: $3(4) + 2$"
      - "$3x$ แปลว่า $3 \\times x$ ให้คูณก่อนแล้วค่อยบวก"
    misconceptions:
      - { match: 36, feedback: "ดูเหมือนอ่าน $3x$ เป็นเลข 34 แต่ $3x$ หมายถึง $3 \\times x = 3 \\times 4$" }
      - { match: 9, feedback: "ดูเหมือนนำ $3 + 4 + 2$ มาบวกกัน แต่ $3x$ หมายถึง 3 คูณ $x$ ไม่ใช่ 3 บวก $x$" }
    solution: "แทน $x = 4$: $3(4) + 2 = 12 + 2 = 14$ บาท (ลูกชิ้น 4 ไม้ 12 บาท บวกน้ำจิ้ม 2 บาท)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.expr.p003
    topics: [math.algebra.expressions]
    difficulty: 2
    type: text
    stem: "ทำ $4a + 3b - a + 5b$ ให้อยู่ในรูปอย่างง่าย (พิมพ์ เช่น 2a+7b)"
    accepted: ["3a+8b", "8b+3a"]
    hints:
      - "จับกลุ่มพจน์ที่มี $a$ ไว้ด้วยกัน และพจน์ที่มี $b$ ไว้ด้วยกัน"
      - "$-a$ หมายถึง $-1a$"
      - "รวมสัมประสิทธิ์ของ $a$: $4 - 1$ และของ $b$: $3 + 5$ ตัวแปรคงเดิม"
    misconceptions:
      - { match: "11ab", feedback: "$a$ กับ $b$ ไม่ใช่พจน์คล้าย จึงรวมกันเป็นพจน์เดียวไม่ได้ ให้รวม $a$ กับ $a$ และ $b$ กับ $b$ แยกกัน" }
      - { match: "5a+8b", feedback: "ลองดูเครื่องหมายหน้า $a$ อีกครั้ง พจน์นี้คือ $-a$ จึงต้องลบ: $4a - a$" }
    solution: "$(4a - a) + (3b + 5b) = 3a + 8b$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.expr.p004
    topics: [math.algebra.expressions]
    difficulty: 2
    type: match
    stem: "ให้ $x$ แทนจำนวนจำนวนหนึ่ง จับคู่ข้อความกับนิพจน์ที่ตรงกัน"
    pairs:
      - { left: "สามเท่าของจำนวนนั้น", right: "$3x$" }
      - { left: "จำนวนนั้นเพิ่มขึ้นอีกสาม", right: "$x + 3$" }
      - { left: "จำนวนนั้นลบด้วยสาม", right: "$x - 3$" }
      - { left: "สามลบด้วยจำนวนนั้น", right: "$3 - x$" }
      - { left: "จำนวนนั้นหารด้วยสาม", right: "$\\dfrac{x}{3}$" }
    hints:
      - "\"เท่า\" หมายถึงการคูณ"
      - "ระวังลำดับของการลบ: \"A ลบด้วย B\" เขียนเป็น $A - B$"
      - "ลองแทน $x = 10$ ในแต่ละข้อความ แล้วดูว่าได้ค่าตรงกับนิพจน์ไหน"
    solution: "สามเท่า → $3x$ | เพิ่มขึ้นอีกสาม → $x + 3$ | จำนวนนั้นลบด้วยสาม → $x - 3$ | สามลบด้วยจำนวนนั้น → $3 - x$ | หารด้วยสาม → $\\dfrac{x}{3}$ ตรวจด้วย $x = 10$: ได้ $30, 13, 7, -7$ และ $\\tfrac{10}{3}$ ตามลำดับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.expr.p005
    topics: [math.algebra.expressions]
    difficulty: 3
    type: numeric
    stem: "หาค่า $4a - 3b + ab$ เมื่อ $a = -2$ และ $b = 3$"
    answer: { value: -23 }
    hints:
      - "แทนค่าโดยใส่วงเล็บรอบจำนวนลบเสมอ"
      - "$ab$ หมายถึง $a \\times b$"
      - "เขียนเป็น $4(-2) - 3(3) + (-2)(3)$ แล้วคูณทุกพจน์ก่อนบวกลบ"
    misconceptions:
      - { match: 5, feedback: "ดูเหมือนแทน $a$ เป็น 2 แทนที่จะเป็น $-2$ ใส่วงเล็บแล้วแทน $a = (-2)$" }
      - { match: -11, feedback: "ลองตรวจพจน์ $ab$ อีกครั้ง $(-2)(3) = -6$ ไม่ใช่ $6$ (ลบคูณบวกได้ลบ)" }
    solution: "$4(-2) - 3(3) + (-2)(3) = -8 - 9 + (-6) = -23$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.expr.p006
    topics: [math.algebra.expressions]
    difficulty: 3
    type: expression
    stem: "กระจายวงเล็บ $-2(3x - 5)$ แล้วเขียนคำตอบโดยไม่มีวงเล็บ"
    answer: { latex: "-6x + 10", variables: [x] }
    expanded: true
    hints:
      - "คูณ $-2$ เข้าไปทุกพจน์ในวงเล็บ ทั้ง $3x$ และ $-5$"
      - "ระวังเครื่องหมาย: ลบคูณลบได้บวก"
      - "หา $(-2)(3x)$ และ $(-2)(-5)$ แยกกัน แล้วนำมาเขียนต่อกัน"
    misconceptions:
      - { match: "-6x - 5", feedback: "คูณ $-2$ เข้าแค่พจน์แรก ต้องคูณเข้าทุกพจน์ รวมทั้ง $-5$ ด้วย" }
      - { match: "-6x - 10", feedback: "ลองตรวจเครื่องหมาย $(-2)(-5) = +10$ เพราะลบคูณลบได้บวก" }
      - { match: "6x - 10", feedback: "เครื่องหมายกลับกันทั้งสองพจน์ ดูเหมือนคูณด้วย $+2$ แทน $-2$ เครื่องหมายลบหน้า 2 ต้องคูณเข้าไปด้วย" }
    solution: "$-2(3x - 5) = (-2)(3x) + (-2)(-5) = -6x + 10$ ตรวจด้วย $x = 1$: $-2(3 - 5) = 4$ และ $-6 + 10 = 4$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.expr.p007
    topics: [math.algebra.expressions]
    difficulty: 4
    type: numeric
    stem: "ร้านเครื่องเขียนขายสมุดเล่มละ 12 บาท และปากกาด้ามละ 8 บาท ต้นซื้อสมุด $n$ เล่ม และซื้อปากกามากกว่าสมุด 2 ด้าม เขียนนิพจน์แทนราคารวม แล้วหาว่าถ้า $n = 5$ ต้นต้องจ่ายกี่บาท"
    answer: { value: 116, unit: บาท }
    hints:
      - "ปากกามากกว่าสมุด 2 ด้าม จึงมี $n + 2$ ด้าม"
      - "ราคารวม $= 12n + 8(n + 2)$ อย่าลืมคูณ 8 เข้าทุกพจน์ในวงเล็บ"
      - "ทำให้อย่างง่ายเป็นรูป $\\square n + \\square$ ก่อน แล้วค่อยแทน $n = 5$"
    misconceptions:
      - { match: 102, feedback: "ดูเหมือนกระจาย $8(n + 2)$ เป็น $8n + 2$ ต้องคูณ 8 เข้าไปทั้ง $n$ และ 2 ได้ $8n + 16$" }
      - { match: 100, feedback: "ดูเหมือนคิดว่าปากกามี $n$ ด้ามเท่าสมุด แต่ปากกามากกว่าสมุด 2 ด้าม คือ $n + 2$ ด้าม" }
    solution: "ราคารวม $= 12n + 8(n + 2) = 12n + 8n + 16 = 20n + 16$ เมื่อ $n = 5$: $20(5) + 16 = 116$ บาท ตรวจ: สมุด 5 เล่ม 60 บาท ปากกา 7 ด้าม 56 บาท รวม 116 บาท ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.expr.p008
    topics: [math.algebra.expressions]
    difficulty: 5
    type: text
    stem: "ทำ $3(2x - 4) - 2(x - 5)$ ให้อยู่ในรูปอย่างง่าย (พิมพ์ เช่น 5x+3)"
    accepted: ["4x-2", "-2+4x", "4x−2", "−2+4x"]
    hints:
      - "กระจายทีละวงเล็บ วงเล็บที่สองให้คูณด้วย $-2$ (รวมเครื่องหมายลบด้วย)"
      - "$-2(x - 5)$ มีสองพจน์ที่ต้องคูณ: $(-2)(x)$ และ $(-2)(-5)$"
      - "เมื่อกระจายครบแล้ว รวมพจน์ที่มี $x$ เข้าด้วยกัน และรวมค่าคงตัวเข้าด้วยกัน"
    misconceptions:
      - { match: "4x-22", feedback: "ลองตรวจ $(-2)(-5)$ อีกครั้ง ลบคูณลบได้ $+10$ ไม่ใช่ $-10$" }
      - { match: "4x-7", feedback: "ดูเหมือนคูณ $-2$ เข้าแค่ $x$ แต่ไม่ได้คูณเข้า $-5$ ต้องคูณเข้าทุกพจน์ ได้ $-2x + 10$" }
    solution: "$3(2x - 4) = 6x - 12$ และ $-2(x - 5) = -2x + 10$ รวมได้ $6x - 12 - 2x + 10 = 4x - 2$ ตรวจด้วย $x = 1$: $3(-2) - 2(-4) = 2$ และ $4(1) - 2 = 2$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.expr.p009
    topics: [math.algebra.expressions]
    difficulty: 2
    type: expression
    stem: "ลุงทำแปลงผักสวนครัวรูปสี่เหลี่ยมผืนผ้า กว้าง $x$ เมตร และยาวกว่าความกว้าง 3 เมตร เขียนนิพจน์แทน **ความยาวของรั้ว** ที่ต้องใช้ล้อมแปลงผักนี้ครบรอบ (หน่วยเมตร)"
    answer: { latex: "4x + 6", variables: [x] }
    hints:
      - "ความยาวของแปลงคือ $x + 3$ เมตร"
      - "รั้วล้อมรอบคือเส้นรอบรูป ซึ่งมีด้านกว้าง 2 ด้าน และด้านยาว 2 ด้าน"
      - "เขียน $2 \\times (\\text{กว้าง}) + 2 \\times (\\text{ยาว})$ แล้วรวมพจน์คล้ายหรือจะตอบในรูปที่มีวงเล็บก็ได้"
    misconceptions:
      - { match: "2x + 3", feedback: "นั่นคือกว้าง + ยาว เพียงด้านละหนึ่งด้าน รั้วต้องล้อมครบทั้ง 4 ด้าน" }
      - { match: "x(x + 3)", feedback: "นั่นคือพื้นที่ของแปลง (กว้าง × ยาว) แต่โจทย์ถามความยาวรั้วรอบแปลง ซึ่งคือเส้นรอบรูป" }
      - { match: "4x + 3", feedback: "ด้านยาวมีสองด้าน แต่ละด้านยาวกว่าความกว้าง 3 เมตร จึงต้องเพิ่ม 3 สองครั้ง" }
    solution: "ความยาวแปลง $= x + 3$ เมตร เส้นรอบรูป $= 2x + 2(x + 3) = 2x + 2x + 6 = 4x + 6$ เมตร ตรวจด้วย $x = 2$: แปลงกว้าง 2 ยาว 5 รั้วยาว $2 + 5 + 2 + 5 = 14$ และ $4(2) + 6 = 14$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.expr.p010
    topics: [math.algebra.expressions]
    difficulty: 4
    type: numeric
    stem: "ร้านให้เช่าจักรยานในอุทยานประวัติศาสตร์สุโขทัยคิดค่าเช่าคันละ $20 + 15h$ บาท เมื่อ $h$ คือจำนวนชั่วโมง เพื่อน 4 คนเช่าคนละคัน ราคารวมคือ $4(20 + 15h)$ บาท ถ้าเช่า 3 ชั่วโมง ต้องจ่ายรวมกี่บาท"
    answer: { value: 260, unit: บาท }
    hints:
      - "แทน $h = 3$ ในวงเล็บก่อน"
      - "คำนวณในวงเล็บให้เสร็จ (คูณก่อนบวก) แล้วค่อยคูณด้วย 4"
      - "หรือกระจาย $4(20 + 15h) = 80 + 60h$ ก่อนแล้วแทนค่าก็ได้"
    misconceptions:
      - { match: 125, feedback: "ดูเหมือนคูณ 4 เข้าแค่ 20 ต้องคูณ 4 เข้าทุกพจน์ในวงเล็บ ($4 \\times 20$ และ $4 \\times 15h$) เพราะทุกคนจ่ายค่าชั่วโมงด้วย" }
      - { match: 65, feedback: "นั่นคือค่าเช่าของคนเดียว ยังต้องคูณ 4 สำหรับเพื่อนทั้ง 4 คน" }
    solution: "แทน $h = 3$: $4(20 + 15 \\times 3) = 4(20 + 45) = 4(65) = 260$ บาท ตรวจด้วยการกระจาย: $80 + 60(3) = 80 + 180 = 260$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.expr.p011
    topics: [math.algebra.expressions]
    difficulty: 1
    type: expression
    stem: "เขียนนิพจน์แทนข้อความ \"นำ $y$ ไปลบออกจาก 5\""
    answer: { latex: "5 - y", variables: [y] }
    hints:
      - "\"ลบออกจาก 5\" แปลว่าเริ่มที่ 5 แล้วเอาบางอย่างออก"
      - "ตัวตั้งคือ 5 ตัวลบคือ $y$"
    misconceptions:
      - { match: "y - 5", feedback: "สลับลำดับ ข้อความบอกว่าเริ่มจาก 5 แล้วนำ $y$ ไปลบออก จึงเป็น $5 - y$ ลองแทน $y = 1$: เหลือ 4 ไม่ใช่ $-4$" }
    solution: "เริ่มจาก 5 แล้วนำ $y$ ออก จึงเขียนเป็น $5 - y$ (ลำดับของการลบสำคัญ $5 - y$ กับ $y - 5$ ไม่เท่ากัน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.expr.p012
    topics: [math.algebra.expressions]
    difficulty: 2
    type: mcq
    stem: "ข้อใดอธิบายนิพจน์ $2(x + 7)$ ตามที่เขียนไว้ได้ถูกต้อง"
    choices:
      - { id: a, text: "ผลคูณของตัวประกอบสองตัว คือ $2$ และ $(x + 7)$", correct: true }
      - { id: b, text: "ผลบวกของพจน์สองพจน์ คือ $2x$ และ $7$", feedback: "$2x + 7$ ไม่เท่ากับ $2(x + 7)$ เพราะ 2 ต้องคูณทั้ง $x$ และ 7 อีกอย่าง ตามที่เขียนไว้ การดำเนินการสุดท้ายคือการคูณ ไม่ใช่การบวก" }
      - { id: c, text: "ผลบวกของพจน์สามพจน์ คือ $2$, $x$ และ $7$", feedback: "เลข 2 ติดกับวงเล็บหมายถึงการคูณ ไม่ใช่การบวก" }
      - { id: d, text: "ผลหารของ $2$ ด้วย $x + 7$", feedback: "ไม่มีการหารในนิพจน์นี้ ผลหารจะเขียนเป็น $\\dfrac{2}{x + 7}$" }
    hints:
      - "ถ้าแทน $x$ ด้วยจำนวนหนึ่ง แล้วคำนวณตามลำดับ ขั้นสุดท้ายที่ทำคือการบวกหรือการคูณ"
      - "มองวงเล็บ $(x + 7)$ เป็นก้อนเดียว"
    solution: "ตามที่เขียนไว้ ต้องหา $x + 7$ ก่อน แล้วนำไปคูณกับ 2 การดำเนินการสุดท้ายคือการคูณ นิพจน์นี้จึงเป็นผลคูณของตัวประกอบสองตัว คือ $2$ กับ $(x + 7)$ โดยมอง $(x + 7)$ เป็นก้อนเดียว ซึ่งภายในก้อนนั้นเป็นผลบวกของสองพจน์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.expr.p013
    topics: [math.algebra.expressions]
    difficulty: 2
    type: numeric
    stem: "พื้นที่ผิวของลูกบาศก์ที่ยาวด้านละ $s$ หาได้จากสูตร $A = 6s^2$ ถ้ากล่องลูกบาศก์ยาวด้านละ $3$ เซนติเมตร มีพื้นที่ผิวกี่ตารางเซนติเมตร"
    answer: { value: 54, unit: "cm²" }
    hints:
      - "แทน $s = 3$ โดยใส่วงเล็บ: $6(3)^2$"
      - "ยกกำลังก่อนคูณ เลขชี้กำลัง 2 อยู่ที่ $s$ เท่านั้น ไม่ได้ครอบ 6"
    misconceptions:
      - { match: 324, feedback: "ดูเหมือนคูณ $6 \\times 3 = 18$ ก่อนแล้วจึงยกกำลังสอง แต่ $6s^2$ หมายถึง $6 \\times s^2$ ต้องยกกำลังก่อน" }
      - { match: 36, feedback: "ดูเหมือนคิดว่า $s^2$ คือ $s \\times 2$ ที่ถูกคือ $s^2 = s \\times s = 9$" }
    solution: "$A = 6(3)^2 = 6 \\times 9 = 54$ ตารางเซนติเมตร (ลูกบาศก์มี 6 หน้า แต่ละหน้า $3 \\times 3 = 9$ ตารางเซนติเมตร)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.expr.p014
    topics: [math.algebra.expressions]
    difficulty: 3
    type: numeric
    stem: "ปริมาตรของลูกบาศก์ที่ยาวด้านละ $s$ หาได้จากสูตร $V = s^3$ ถ้า $s = \\tfrac{1}{2}$ เมตร ปริมาตรเท่ากับกี่ลูกบาศก์เมตร (ตอบเป็นทศนิยม)"
    answer: { value: 0.125, tolerance: 0.001, unit: "m³" }
    hints:
      - "$s^3 = s \\times s \\times s$"
      - "คูณ $\\tfrac{1}{2}$ ด้วยตัวเองสามครั้ง แล้วแปลงเป็นทศนิยม"
    misconceptions:
      - { match: 1.5, feedback: "ดูเหมือนคิดว่า $s^3$ คือ $3 \\times s$ เลขชี้กำลังบอกจำนวนครั้งที่คูณตัวเอง: $\\tfrac12 \\times \\tfrac12 \\times \\tfrac12$" }
      - { match: 0.25, feedback: "นั่นคือ $s^2$ ยังต้องคูณ $\\tfrac{1}{2}$ อีกหนึ่งครั้ง" }
    solution: "$V = \\left(\\tfrac{1}{2}\\right)^3 = \\tfrac{1}{2} \\times \\tfrac{1}{2} \\times \\tfrac{1}{2} = \\tfrac{1}{8} = 0.125$ ลูกบาศก์เมตร สังเกตว่าเมื่อยกกำลังจำนวนที่น้อยกว่า 1 ผลลัพธ์ยิ่งเล็กลง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.expr.p015
    topics: [math.algebra.expressions]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "นิพจน์ใดเท่ากับ $3(2 + x)$ **ทุกค่า** ของ $x$ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "$6 + 3x$", correct: true }
      - { id: b, text: "$(2 + x) + (2 + x) + (2 + x)$", correct: true }
      - { id: c, text: "$6 + x$", feedback: "คูณ 3 เข้าแค่ 2 ลองแทน $x = 1$: $3(2 + 1) = 9$ แต่ $6 + 1 = 7$ ไม่เท่ากัน" }
      - { id: d, text: "$5 + x$", feedback: "ดูเหมือนนำ 3 ไปบวก 2 แต่ 3 ที่ติดวงเล็บหมายถึงการคูณ ลองแทน $x = 0$: ได้ 6 กับ 5 ไม่เท่ากัน" }
      - { id: e, text: "$2 + 3x$", feedback: "คูณ 3 เข้าแค่ $x$ ลองแทน $x = 0$: $3(2) = 6$ แต่ $2 + 0 = 2$" }
    hints:
      - "นิพจน์สองนิพจน์เท่ากันเมื่อแทน $x$ ด้วยจำนวนใดก็ได้ค่าเท่ากันเสมอ"
      - "ลองแทน $x = 0$ และ $x = 1$ ในทุกตัวเลือก ตัวเลือกที่ได้ค่าต่างจาก $3(2 + x)$ แม้แต่ครั้งเดียวไม่เท่ากัน"
      - "การคูณด้วย 3 คือการบวกของเดิมสามครั้ง"
    solution: "กระจาย: $3(2 + x) = 6 + 3x$ และ $3(2 + x)$ คือ $(2 + x)$ บวกกันสามครั้ง ซึ่งรวมได้ $6 + 3x$ เช่นกัน ส่วน $6 + x$, $5 + x$ และ $2 + 3x$ หาค่า $x$ ที่ให้ผลต่างได้ จึงไม่เท่ากัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.expr.p016
    topics: [math.algebra.expressions]
    difficulty: 3
    type: expression
    stem: "ดึงตัวร่วม 6 ออกจาก $24x + 18y$ เติมสิ่งที่อยู่ในวงเล็บ: $24x + 18y = 6(\\square)$"
    prefix: "□ ="
    answer: { latex: "4x + 3y", variables: [x, y] }
    hints:
      - "สิ่งที่อยู่ในวงเล็บคูณกับ 6 แล้วต้องได้ $24x + 18y$"
      - "หารทุกพจน์ด้วย 6: $24x \\div 6$ และ $18y \\div 6$"
    misconceptions:
      - { match: "4x + 18y", feedback: "หารด้วย 6 แค่พจน์แรก ต้องหารทุกพจน์ เพราะ 6 ที่อยู่นอกวงเล็บจะคูณเข้าทุกพจน์" }
      - { match: "144x + 108y", feedback: "นั่นคือการคูณด้วย 6 การดึงตัวร่วมออกต้องหารด้วย 6" }
    solution: "$24x \\div 6 = 4x$ และ $18y \\div 6 = 3y$ จึงได้ $24x + 18y = 6(4x + 3y)$ ตรวจด้วยการกระจายกลับ: $6 \\cdot 4x + 6 \\cdot 3y = 24x + 18y$ ✓ (6 เป็นตัวหารร่วมมากของ 24 กับ 18 วงเล็บจึงไม่มีตัวร่วมเหลืออีก)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.expr.p017
    topics: [math.algebra.expressions]
    difficulty: 4
    type: expression
    stem: "ทำ $\\tfrac{3}{4}x - \\tfrac{1}{2}(x - 6)$ ให้อยู่ในรูปอย่างง่าย โดยไม่มีวงเล็บ"
    answer: { latex: "\\frac{1}{4}x + 3", variables: [x] }
    expanded: true
    hints:
      - "กระจาย $-\\tfrac{1}{2}$ เข้าทั้ง $x$ และ $-6$ (รวมเครื่องหมายลบด้วย)"
      - "รวมพจน์ $x$: $\\tfrac{3}{4} - \\tfrac{1}{2}$ ต้องทำส่วนให้เท่ากันก่อน"
      - "$-\\tfrac{1}{2} \\times (-6)$ ได้จำนวนบวก"
    misconceptions:
      - { match: "\\frac{1}{4}x - 6", feedback: "ยังไม่ได้คูณ $-\\tfrac{1}{2}$ เข้ากับ $-6$ ต้องกระจายเข้าทุกพจน์: $\\left(-\\tfrac12\\right)(-6) = 3$" }
      - { match: "\\frac{1}{4}x - 3", feedback: "ลองตรวจเครื่องหมาย $\\left(-\\tfrac12\\right)(-6) = +3$ เพราะลบคูณลบได้บวก" }
      - { match: "x + 3", feedback: "ลบเศษส่วนโดยลบเศษกับส่วนตรง ๆ ไม่ได้ ต้องทำส่วนให้เท่ากัน: $\\tfrac34 - \\tfrac24 = \\tfrac14$" }
    solution: "กระจาย: $-\\tfrac{1}{2}(x - 6) = -\\tfrac{1}{2}x + 3$ ได้ $\\tfrac{3}{4}x - \\tfrac{1}{2}x + 3 = \\tfrac{3}{4}x - \\tfrac{2}{4}x + 3 = \\tfrac{1}{4}x + 3$ ตรวจด้วย $x = 4$: $3 - \\tfrac12(-2) = 4$ และ $\\tfrac14(4) + 3 = 4$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.expr.p018
    topics: [math.algebra.expressions]
    difficulty: 3
    type: expression
    stem: "ห้างลดราคาเสื้อนักเรียนทุกตัว 15% ถ้าราคาป้ายคือ $p$ บาท เขียนราคาที่ต้องจ่ายเป็นนิพจน์ที่มีพจน์เดียว"
    prefix: "ราคาที่จ่าย ="
    answer: { latex: "0.85p", variables: [p] }
    hints:
      - "ราคาที่จ่าย = ราคาป้าย − ส่วนลด และส่วนลดคือ 15% ของ $p$ หรือ $0.15p$"
      - "$p - 0.15p$ เป็นพจน์คล้าย รวมสัมประสิทธิ์ $1 - 0.15$"
    misconceptions:
      - { match: "0.15p", feedback: "นั่นคือส่วนลด ไม่ใช่ราคาที่ต้องจ่าย ต้องนำส่วนลดไปหักออกจาก $p$" }
      - { match: "p - 15", feedback: "ลดราคา 15% ไม่ใช่ลด 15 บาท ส่วนลดขึ้นกับราคาป้าย คือ $0.15p$" }
      - { match: "1.15p", feedback: "นั่นคือราคาที่เพิ่มขึ้น 15% แต่โจทย์เป็นการลดราคา" }
    solution: "ราคาที่จ่าย $= p - 0.15p = (1 - 0.15)p = 0.85p$ บาท การเขียนเป็นพจน์เดียวบอกได้ทันทีว่าจ่าย 85% ของราคาป้าย เช่น เสื้อ 200 บาท จ่าย $0.85 \\times 200 = 170$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.expr.p019
    topics: [math.algebra.expressions]
    difficulty: 4
    type: mcq
    stem: "แม่ฝากเงินในบัญชีออมทรัพย์พิเศษ ยอดเงินหลังผ่านไป $n$ ปีคือ $5000(1.02)^n$ บาท ตัวเลข $1.02$ ในนิพจน์นี้บอกอะไร"
    choices:
      - { id: a, text: "ยอดเงินเพิ่มขึ้น 2% ของยอดเดิมทุกปี", correct: true }
      - { id: b, text: "ยอดเงินเพิ่มขึ้นปีละ 1.02 บาท", feedback: "$1.02$ เป็นตัวคูณ ไม่ใช่จำนวนที่บวกเพิ่ม ถ้าเพิ่มปีละ 1.02 บาท นิพจน์จะเป็น $5000 + 1.02n$" }
      - { id: c, text: "ยอดเงินเพิ่มขึ้น 102% ทุกปี", feedback: "คูณ $1.02$ คือได้ 102% ของยอดเดิม แปลว่าเพิ่มขึ้นเพียง 2% ถ้าเพิ่มขึ้น 102% ต้องคูณ $2.02$" }
      - { id: d, text: "ยอดเงินเพิ่มขึ้น 20% ทุกปี", feedback: "$0.02 = 2\\%$ ไม่ใช่ 20% ถ้าเพิ่ม 20% ตัวคูณจะเป็น $1.20$" }
    hints:
      - "ทุกปีที่ผ่านไป ยอดเงินถูกคูณด้วย $1.02$ อีกหนึ่งครั้ง"
      - "แยก $1.02 = 1 + 0.02$ ส่วน 1 คือเงินเดิมทั้งหมด ส่วน 0.02 คือส่วนที่เพิ่ม"
    solution: "ทุกปียอดเงินถูกคูณด้วย $1.02 = 1 + 0.02$ คือได้เงินเดิม (1 เท่า) บวกเพิ่มอีก $0.02 = 2\\%$ ของยอดเดิม นิพจน์นี้มองได้เป็นผลคูณของ $5000$ (เงินต้น) กับตัวประกอบ $(1.02)^n$ ซึ่งไม่ขึ้นกับเงินต้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.expr.p020
    topics: [math.algebra.expressions]
    difficulty: 4
    type: expression
    stem: "สี่เหลี่ยมผืนผ้ากว้าง 3 หน่วย แบ่งเป็นสองส่วนที่มีพื้นที่ $6x$ และ $15$ ตารางหน่วยตามภาพ เขียนนิพจน์แทนความยาวทั้งหมดของรูป"
    figure: { src: area-split-rectangle.svg, alt: "สี่เหลี่ยมผืนผ้าสูง 3 หน่วย แบ่งด้วยเส้นตั้งเป็นสองส่วน ส่วนซ้ายมีพื้นที่ 6x ส่วนขวามีพื้นที่ 15 ด้านล่างมีเส้นบอกความยาวทั้งหมดเป็นเครื่องหมายคำถาม" }
    prefix: "ความยาว ="
    answer: { latex: "2x + 5", variables: [x] }
    hints:
      - "แต่ละส่วนเป็นสี่เหลี่ยมผืนผ้าที่กว้าง 3 เท่ากัน ความยาวของแต่ละส่วน = พื้นที่ ÷ 3"
      - "พื้นที่ทั้งหมดคือ $6x + 15 = 3(\\square)$ สิ่งที่อยู่ในวงเล็บคือความยาว"
    misconceptions:
      - { match: "6x + 15", feedback: "นั่นคือพื้นที่ทั้งหมด ความยาวต้องนำพื้นที่หารด้วยความกว้าง 3" }
      - { match: "2x + 15", feedback: "หารด้วย 3 แค่ส่วนซ้าย ส่วนขวาก็กว้าง 3 เหมือนกัน ความยาวจึงเป็น $15 \\div 3 = 5$" }
    solution: "ความยาวส่วนซ้าย $= 6x \\div 3 = 2x$ ความยาวส่วนขวา $= 15 \\div 3 = 5$ รวมเป็น $2x + 5$ ซึ่งก็คือการดึงตัวร่วม: $6x + 15 = 3(2x + 5)$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.expr.p021
    topics: [math.algebra.expressions]
    difficulty: 5
    type: numeric
    stem: "ร้านก๋วยเตี๋ยวขายชามธรรมดาราคา 50 บาท และชามพิเศษราคา 60 บาท ต้นทุนชามละ 30 บาทเท่ากันทั้งสองแบบ วันหนึ่งขายชามธรรมดาได้ $x$ ชาม และขายชามพิเศษได้น้อยกว่าชามธรรมดา 8 ชาม เขียนนิพจน์แทนกำไรแล้วทำให้อย่างง่าย จากนั้นหากำไรเมื่อ $x = 40$ (ตอบเป็นบาท)"
    answer: { value: 1760, unit: บาท }
    hints:
      - "ชามพิเศษมี $x - 8$ ชาม จำนวนชามทั้งหมดคือ $x + (x - 8) = 2x - 8$"
      - "กำไร = รายรับ − ต้นทุน $= 50x + 60(x - 8) - 30(2x - 8)$"
      - "กระจายทุกวงเล็บให้ครบ ระวังเครื่องหมายลบหน้า $30(2x - 8)$ แล้วรวมพจน์คล้ายก่อนแทนค่า"
    misconceptions:
      - { match: 1528, feedback: "ดูเหมือนกระจาย $-30(2x - 8)$ เป็น $-60x - 8$ ต้องคูณ $-30$ เข้ากับ $-8$ ด้วย ได้ $+240$" }
      - { match: 2720, feedback: "ดูเหมือนคิดต้นทุนเฉพาะชามธรรมดา ($30x$) ชามพิเศษก็มีต้นทุนชามละ 30 บาทเช่นกัน" }
    solution: "กำไร $= 50x + 60(x - 8) - 30(2x - 8) = 50x + 60x - 480 - 60x + 240 = 50x - 240$ บาท เมื่อ $x = 40$: $50(40) - 240 = 1760$ บาท ตรวจ: ชามธรรมดา 40 ชาม รายรับ 2,000 บาท ชามพิเศษ 32 ชาม รายรับ 1,920 บาท ต้นทุน 72 ชาม 2,160 บาท กำไร $3920 - 2160 = 1760$ บาท ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.expr.p022
    topics: [math.algebra.expressions]
    difficulty: 2
    type: match
    stem: "จับคู่ข้อความทางคณิตศาสตร์กับชื่อที่ถูกต้อง"
    pairs:
      - { left: "$3x + 2$", right: "นิพจน์ (ไม่มีเครื่องหมายเท่ากับหรือไม่เท่ากับ)" }
      - { left: "$3x + 2 = 11$", right: "สมการ (จริงเฉพาะบางค่าของ $x$)" }
      - { left: "$3x + 2 > 11$", right: "อสมการ" }
      - { left: "$2(x + 1) = 2x + 2$", right: "เอกลักษณ์ (จริงทุกค่าของ $x$)" }
    hints:
      - "นิพจน์ไม่มีเครื่องหมาย $=$ หรือ $>$ $<$ จึงไม่ได้บอกว่าอะไรเท่ากับอะไร"
      - "ลองแทน $x = 0$ และ $x = 3$ ในข้อที่มีเครื่องหมายเท่ากับ ข้อใดจริงทั้งสองค่า ข้อใดจริงค่าเดียว"
    solution: "$3x + 2$ เป็นนิพจน์ $3x + 2 = 11$ เป็นสมการ จริงเมื่อ $x = 3$ เท่านั้น $3x + 2 > 11$ เป็นอสมการ ส่วน $2(x + 1) = 2x + 2$ จริงทุกค่าของ $x$ (กระจายแล้วได้สองข้างเหมือนกัน) จึงเป็นเอกลักษณ์ บางตำราเขียน $\\equiv$ แทน $=$"
    license: CC-BY-SA-4.0
    ai_assisted: true
