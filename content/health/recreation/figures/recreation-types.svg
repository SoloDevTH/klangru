<text x="78.0" y="263.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">การละครและการแสดง</text>
<text x="78.0" y="286.0" font-size="13" text-anchor="start" font-weight="normal" fill="#333">เช่น ละครหุ่น แสดงละครสั้น</text>
<rect x="390.0" y="236.0" width="350.0" height="64.0" rx="10" fill="#eef3fa" stroke="#1f4e9a" stroke-width="1.5" />
<circle cx="420.0" cy="268.0" r="17.0" fill="#1f4e9a" stroke="#1f4e9a" stroke-width="1.5"/>
