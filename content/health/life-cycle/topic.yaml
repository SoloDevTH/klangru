id: health.body.life-cycle
subject: health
title: { th: ธรรมชาติของชีวิตมนุษย์และการเปลี่ยนแปลงแต่ละช่วงวัย, en: "The human life cycle and changes at each stage of life" }
summary: ชีวิตมนุษย์ตั้งแต่เกิดจนตาย ช่วงวัยทารก เด็ก วัยรุ่น ผู้ใหญ่ ผู้สูงอายุ และการเปลี่ยนแปลงด้านร่างกาย จิตใจ อารมณ์ สังคม และสติปัญญาในแต่ละช่วง
difficulty: 2
minutes: 25
prerequisites: [health.body.internal-organs]
encompasses: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ห้าช่วงวัยของชีวิต
    src: life-stages.svg
    alt: "เส้นเวลาจากซ้ายไปขวาแสดงคนห้าช่วงวัยเรียงตามอายุ วัยทารก แรกเกิดถึงราว 2 ปี ตัวเล็กที่สุดและนั่งอยู่ วัยเด็ก ราว 3 ถึง 12 ปี วัยรุ่น ราว 13 ถึง 19 ปี สูงขึ้นมาก วัยผู้ใหญ่ ราว 20 ถึง 59 ปี สูงที่สุด และวัยสูงอายุ 60 ปีขึ้นไป หลังค่อมเล็กน้อยและถือไม้เท้า หัวภาพเขียนว่า ชีวิตมนุษย์ เกิด เจริญเติบโต เปลี่ยนแปลง แก่ และตาย"
    caption: "ช่วงอายุเป็นค่าโดยประมาณ แต่ละคนเติบโตไม่เท่ากัน"
  - type: worked-example
    title: จัดการเปลี่ยนแปลงของคุณตาให้ถูกด้าน
    problem: "คุณตาอายุ 72 ปี ครอบครัวสังเกตว่า (1) คุณตาอ่านหนังสือต้องใช้แว่นและเดินช้าลง (2) คุณตาน้อยใจง่ายเมื่อหลานไม่คุยด้วย (3) คุณตาไปสอนจักสานให้เด็กที่วัดทุกสัปดาห์ (4) คุณตาจำชื่อเพื่อนบ้านคนใหม่ไม่ค่อยได้ แต่ละข้อเป็นการเปลี่ยนแปลงด้านใด"
    steps:
      - text: "ข้อ (1) สายตาและการเคลื่อนไหวเป็นเรื่องของร่างกาย จึงเป็นด้านร่างกาย"
      - text: "ข้อ (2) ความรู้สึกที่แสดงออกเป็นด้านอารมณ์"
        why: "น้อยใจ ดีใจ โกรธ เป็นอารมณ์ ส่วนความรู้สึกต่อตัวเอง เช่น ความภาคภูมิใจ เป็นด้านจิตใจ"
      - text: "ข้อ (3) การมีบทบาทในชุมชนและอยู่ร่วมกับคนอื่นเป็นด้านสังคม"
      - text: "ข้อ (4) ความจำเป็นด้านสติปัญญา"
      - text: "ตรวจว่าคุณตาอายุเกิน 60 ปี จึงอยู่ในวัยสูงอายุ การเปลี่ยนแปลงทั้งสี่ข้อเป็นเรื่องปกติของวัยนี้ ครอบครัวช่วยได้โดยชวนคุยและพาไปตรวจสายตา"
    answer: "(1) ร่างกาย (2) อารมณ์ (3) สังคม (4) สติปัญญา"
  - { type: check, problem: health.body.life-cycle.p003, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: worked-example
    title: อีกกี่ปีจะถึงวัยสูงอายุ
    problem: "แม่ของต้นข้าวอายุ 38 ปี ส่วนต้นข้าวอายุ 11 ปี อีกกี่ปีแม่จะเข้าสู่วัยสูงอายุ (60 ปี) และตอนนั้นต้นข้าวจะอยู่ในวัยใด"
    steps:
      - text: "หาจำนวนปี: 60 − 38 = 22 ปี"
      - text: "อายุของต้นข้าวตอนนั้น: 11 + 22 = 33 ปี"
        why: "ทุกคนอายุเพิ่มขึ้นเท่ากันในเวลาเดียวกัน"
      - text: "33 ปีอยู่ในช่วงราว 20–59 ปี จึงเป็นวัยผู้ใหญ่"
    answer: "อีก 22 ปี ตอนนั้นต้นข้าวอายุ 33 ปี อยู่ในวัยผู้ใหญ่"
  - { type: check, problem: health.body.life-cycle.p007 }
glossary:
  - { term: ช่วงวัย, definition: "ช่วงของชีวิตที่มีลักษณะการเปลี่ยนแปลงคล้ายกัน ได้แก่ วัยทารก วัยเด็ก วัยรุ่น วัยผู้ใหญ่ วัยสูงอายุ" }
  - { term: การเจริญเติบโต, definition: "การที่ร่างกายมีขนาด ส่วนสูง และน้ำหนักเพิ่มขึ้น" }
  - { term: พัฒนาการ, definition: "การเปลี่ยนแปลงความสามารถด้านร่างกาย จิตใจ อารมณ์ สังคม และสติปัญญา ให้ทำสิ่งต่าง ๆ ได้ดีขึ้นตามวัย" }
  - { term: วัยเจริญพันธุ์, definition: "ช่วงต้นของวัยรุ่นที่ฮอร์โมนทำให้ร่างกายเปลี่ยนจากเด็กเป็นผู้ใหญ่" }
  - { term: ผู้สูงอายุ, definition: "ตามกฎหมายไทย คือคนอายุ 60 ปีขึ้นไป" }
flashcards:
  - { front: "ธรรมชาติของชีวิตมนุษย์มีขั้นอะไรบ้าง", back: "เกิด เจริญเติบโต เปลี่ยนแปลง แก่ และตาย" }
  - { front: "การเปลี่ยนแปลง 5 ด้านคืออะไร", back: "ร่างกาย จิตใจ อารมณ์ สังคม สติปัญญา" }
  - { front: "ช่วงวัยใดที่ร่างกายโตเร็วเป็นพิเศษ", back: "วัยทารกและวัยรุ่น" }
  - { front: "ผู้สูงอายุตามกฎหมายไทยคือคนอายุเท่าไร", back: "60 ปีขึ้นไป" }
