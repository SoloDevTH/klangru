id: thai.composition.opinion-argument
subject: thai
title: { th: การเขียนแสดงความคิดเห็นและโต้แย้ง, en: "Writing opinions and arguments" }
summary: เขียนแสดงความรู้สึกและความคิดเห็นให้ตรงเจตนา เขียนอธิบาย ชี้แจง วิเคราะห์ วิจารณ์ และโต้แย้งด้วยข้ออ้าง เหตุผล หลักฐาน และการหักล้างข้อแย้ง รวมทั้งแสดงความคิดเห็นต่อสาระจากสื่อ
difficulty: 5.5
minutes: 40
prerequisites: [thai.composition.essay, thai.reading.fact-opinion]
encompasses:
  - { id: thai.composition.essay, weight: 0.3 }
  - { id: thai.reading.fact-opinion, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: argument-map.svg
    alt: "แผนผังการโต้แย้งสมมติ ข้ออ้างด้านบน ห้องสมุดควรเปิดช่วงพักกลางวัน มีเหตุผลสองข้อชี้ขึ้นไปที่ข้ออ้าง เหตุผล 1 นักเรียนที่กลับด้วยรถรับส่งไม่มีเวลาเข้าห้องสมุดหลังเลิกเรียน หลักฐานใต้เหตุผล 1 สำรวจ 3 ห้อง 64 จาก 120 คนกลับบ้านด้วยรถรับส่ง ราวร้อยละ 53 เหตุผล 2 ช่วงพักไม่มีที่สงบให้อ่านหนังสือหรือทำการบ้าน หลักฐานใต้เหตุผล 2 สังเกต 5 วัน โรงอาหารและลานกิจกรรมมีเสียงดังตลอดช่วงพัก แถวล่าง ข้อแย้งของอีกฝ่าย บรรณารักษ์ก็ต้องพักกลางวัน มีลูกศรไปที่การหักล้าง จัดนักเรียนอาสาช่วยเวร สลับเวลาพัก แล้วทดลองหนึ่งภาคเรียน"
    caption: "หลักฐานหนุนเหตุผล เหตุผลหนุนข้ออ้าง และตอบข้อแย้งด้วยการหักล้าง"
  - type: worked-example
    title: จากความเห็นลอย ๆ สู่ย่อหน้าที่มีเหตุผล
    problem: "ปรับความเห็น \"ที่ล้างมือหน้าโรงอาหารแย่มาก ต้องทำใหม่\" (สมมติ) ให้เป็นย่อหน้าแสดงความคิดเห็นที่สุภาพและน่าเชื่อ"
    steps:
      - text: "เขียนข้ออ้างให้ชัดและแคบ: โรงเรียนควรเพิ่มก๊อกน้ำที่จุดล้างมือหน้าโรงอาหาร"
        why: "คำว่า แย่มาก ไม่บอกว่าต้องการให้แก้อะไร"
      - text: "หาเหตุผล: ช่วงพักกลางวันนักเรียนต่อแถวล้างมือนาน หลายคนจึงข้ามการล้างมือก่อนกิน"
      - text: "หาหลักฐาน: นับคนต่อแถว 3 วัน พบว่ามีก๊อก 4 ก๊อก แต่มีคนรอเฉลี่ย 25 คน (ข้อมูลสมมติ)"
      - text: "ตอบข้อแย้งล่วงหน้า: ถ้ากังวลเรื่องค่าใช้จ่าย อาจเพิ่มก๊อกต่อจากท่อเดิมที่มีอยู่แล้ว"
      - text: "เลือกภาษาสุภาพและคำเชื่อม: ใช้ เนื่องจาก จึง แม้ว่า แทนคำตำหนิ"
    answer: "\"โรงเรียนควรเพิ่มก๊อกน้ำที่จุดล้างมือหน้าโรงอาหาร เนื่องจากช่วงพักกลางวันนักเรียนต่อแถวนานจนหลายคนข้ามการล้างมือ จากการนับ 3 วัน มีก๊อก 4 ก๊อกแต่มีคนรอเฉลี่ย 25 คน แม้การเพิ่มก๊อกจะมีค่าใช้จ่าย แต่ต่อจากท่อเดิมได้ จึงขอเสนอให้ฝ่ายอาคารพิจารณา\""
  - { type: check, problem: thai.composition.opinion-argument.p006, prompt: "หลักฐานเป็นข้อเท็จจริงที่ตรวจได้" }
  - type: worked-example
    title: เขียนตอบข้อแย้ง
    problem: "ข้ออ้าง: ควรอนุญาตให้ใช้แท็บเล็ตของโรงเรียนค้นข้อมูลในคาบเรียน (สมมติ) ข้อแย้ง: นักเรียนจะแอบเล่นเกม เขียนการหักล้าง"
    steps:
      - text: "ยอมรับส่วนที่จริง: มีโอกาสที่นักเรียนบางคนจะใช้ผิดวัตถุประสงค์"
        why: "ปฏิเสธทั้งหมดทำให้ผู้อ่านไม่เชื่อ"
      - text: "เสนอทางป้องกัน: ใช้เฉพาะช่วงกิจกรรมค้นคว้า ครูกำหนดเว็บไซต์ และเก็บเครื่องเมื่อจบกิจกรรม"
      - text: "ให้เหตุผลว่าประโยชน์มากกว่า: นักเรียนได้ฝึกค้นและประเมินแหล่งข้อมูลจริงขณะมีครูแนะนำ"
      - text: "เสนอวิธีตรวจผล: ทดลองหนึ่งเดือนแล้วเทียบคุณภาพงานค้นคว้าก่อนและหลัง"
    answer: "\"แม้นักเรียนบางคนอาจใช้แท็บเล็ตผิดวัตถุประสงค์ แต่ป้องกันได้ด้วยการใช้เฉพาะช่วงค้นคว้า กำหนดเว็บไซต์ และเก็บเครื่องเมื่อจบกิจกรรม ประโยชน์ที่นักเรียนได้ฝึกค้นและประเมินข้อมูลโดยมีครูแนะนำจึงคุ้มค่า และควรทดลองหนึ่งเดือนเพื่อดูผล\""
  - { type: check, problem: thai.composition.opinion-argument.p010, prompt: "ประโยคใดพูดถึงตัวคนแทนเหตุผล" }
glossary:
  - { term: ข้ออ้าง, definition: "จุดยืนหรือความคิดเห็นหลักที่ผู้เขียนต้องการให้ผู้อ่านยอมรับ แบบเรียนบางเล่มเรียกข้อสรุปหรือทรรศนะ" }
  - { term: เหตุผล, definition: "คำตอบว่าทำไมจึงมีจุดยืนนั้น" }
  - { term: หลักฐาน, definition: "ข้อเท็จจริงที่ตรวจสอบได้ซึ่งหนุนเหตุผล เช่น ผลสำรวจ ตัวเลข ตัวอย่าง พร้อมที่มา" }
  - { term: ข้อแย้ง, definition: "ความเห็นหรือเหตุผลของอีกฝ่ายที่ค้านจุดยืนของเรา" }
  - { term: การหักล้าง, definition: "การตอบข้อแย้งด้วยเหตุผลหรือหลักฐาน หรือยอมรับบางส่วนแล้วเสนอทางออก" }
  - { term: ชี้แจง, definition: "ให้ข้อเท็จจริงและเหตุผลเพื่อให้ผู้อื่นเข้าใจเรื่องหนึ่งอย่างถูกต้อง" }
  - { term: วิจารณ์, definition: "ประเมินงานทั้งจุดเด่นและจุดด้อยตามเกณฑ์ พร้อมเหตุผล" }
flashcards:
  - { front: "งานเขียนโต้แย้ง 3 ส่วนหลัก", back: "ข้ออ้าง เหตุผล หลักฐาน (และตอบข้อแย้งด้วยการหักล้าง)" }
  - { front: "หลักฐานที่ดี", back: "เกี่ยวข้อง เพียงพอ เชื่อถือได้ และบอกที่มา" }
  - { front: "อธิบาย กับ ชี้แจง", back: "อธิบายทำให้เข้าใจว่าอะไร อย่างไร ทำไม ชี้แจงให้ข้อเท็จจริงและเหตุผลเพื่อแก้ความเข้าใจที่คลาดเคลื่อน" }
  - { front: "ความเห็นต่อสาระจากสื่อ", back: "สรุปสาระก่อน แล้วบอกความเห็น เหตุผล และข้อเสนอ" }
  - { front: "หลักฐานร้อยละ 70 ควรใช้คำว่า", back: "ส่วนใหญ่ ไม่ใช่ ทุกคน" }
