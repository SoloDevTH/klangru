id: thai.speaking.opinions-feelings
subject: thai
title: { th: การพูดแสดงความรู้ ความคิดเห็น และความรู้สึก, en: "Speaking about knowledge, opinions and feelings" }
summary: แยกความรู้ ความคิดเห็น และความรู้สึกจากเรื่องที่ฟังและดู บอกจุดประสงค์ของเรื่อง พูดแสดงความคิดเห็น 4 ขั้นอย่างมีเหตุผลและสร้างสรรค์ และประเมินความน่าเชื่อถือของสื่อ
difficulty: 3
minutes: 30
prerequisites: [thai.listening.main-points]
encompasses:
  - { id: thai.listening.main-points, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: speaking-frame.svg
    alt: "ขั้นตอนพูดแสดงความคิดเห็น 4 ขั้นเรียงจากบนลงล่าง 1 บอกเรื่อง: จากคลิปสารคดีเรื่องขยะพลาสติกในทะเล 2 สรุปแนวคิดสำคัญ: คลิปต้องการบอกว่าขยะบนบกไหลลงทะเลและทำร้ายสัตว์ 3 ความคิดเห็นและเหตุผล: ผมคิดว่าเราควรพกกระบอกน้ำ เพราะในคลิปพบขวดมากที่สุด 4 ความรู้สึกหรือข้อเสนอแนะ: ผมรู้สึกตกใจ และอยากชวนห้องเราแยกขยะทุกวัน"
    caption: "โครงการพูดแสดงความคิดเห็นต่อเรื่องที่ฟังและดู"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: เปลี่ยนคำตอบสั้นให้เป็นความคิดเห็นที่มีเหตุผล
    problem: "หลังฟังนิทานมดกับตั๊กแตน เพื่อนตอบว่า \"ตั๊กแตนโง่\" ช่วยปรับเป็นคำพูดแสดงความคิดเห็นที่สร้างสรรค์"
    steps:
      - text: "บอกเรื่อง: จากนิทานเรื่องมดกับตั๊กแตน"
      - text: "สรุปแนวคิด: นิทานสอนให้เตรียมพร้อมไว้ก่อนถึงเวลาลำบาก"
      - text: "ความคิดเห็นพร้อมเหตุผล: ผมคิดว่าตั๊กแตนประมาท เพราะเล่นทั้งฤดูร้อนโดยไม่เก็บอาหาร"
        why: "พูดถึงการกระทำในเรื่อง ไม่ใช้คำตัดสินอย่าง โง่ ที่ไม่บอกเหตุผล"
      - text: "ข้อเสนอแนะ: ผมจะแบ่งเงินค่าขนมไว้ส่วนหนึ่งเผื่อวันที่จำเป็น"
    answer: "จากนิทานมดกับตั๊กแตน ผมคิดว่าตั๊กแตนประมาทเพราะไม่เก็บอาหารไว้ นิทานสอนให้เตรียมพร้อม ผมจึงจะแบ่งเงินค่าขนมเก็บไว้บ้าง"
  - { type: check, problem: thai.speaking.opinions-feelings.p003, prompt: "หาคำตอบที่มีทั้ง คิดว่า และ เพราะ" }
  - type: worked-example
    title: ประเมินโฆษณา
    problem: "ประเมินโฆษณาที่บอกว่า \"ครีมนี้ทาแล้วผิวขาวใน 3 วัน ดาราดังใช้ทุกคน\""
    steps:
      - text: "จุดประสงค์: โน้มน้าวให้ซื้อ"
      - text: "ใครพูด: ดาราที่อาจได้ค่าจ้าง ไม่ใช่ผู้เชี่ยวชาญด้านผิวหนัง"
      - text: "หลักฐาน: ไม่มีผลทดสอบหรือแหล่งที่ตรวจได้ บอกแค่ว่าดาราใช้"
      - text: "เหตุผล: ผลใน 3 วันเกินจริง"
        why: "การประเมินที่ดีต้องตอบคำถามประเมินทีละข้อ ไม่ใช่ตัดสินจากความชอบ"
      - text: "สรุป: ยังไม่ควรเชื่อหรือซื้อทันที ควรหาข้อมูลจากแหล่งที่น่าเชื่อถือก่อน"
    answer: "โฆษณานี้ยังไม่น่าเชื่อถือ เพราะอ้างผลเกินจริงและไม่มีหลักฐาน มีเพียงคำของดาราที่อาจได้ค่าจ้าง"
  - { type: check, problem: thai.speaking.opinions-feelings.p007, prompt: "ข้อมูลใดที่เรื่องไม่ได้พูดไว้" }
glossary:
  - { term: ความรู้, definition: "ข้อมูลที่ได้จากเรื่องที่ฟังและดู ตรวจได้ว่าเรื่องพูดไว้จริง" }
  - { term: ความคิดเห็น, definition: "ความเห็นของผู้พูดต่อเรื่อง ควรมีเหตุผลและตัวอย่างประกอบ" }
  - { term: ความรู้สึก, definition: "อารมณ์ของผู้พูดต่อเรื่อง เช่น ดีใจ เศร้า ตกใจ" }
  - { term: แนวคิด, definition: "สิ่งสำคัญที่เรื่องต้องการบอกผู้ฟังผู้ดู สรุปได้ในประโยคเดียว" }
  - { term: สร้างสรรค์, definition: "ความคิดเห็นที่ช่วยให้เรื่องดีขึ้น มีเหตุผล สุภาพ และเสนอทางแก้" }
flashcards:
  - { front: "พูดแสดงความคิดเห็น 4 ขั้น", back: "บอกเรื่อง → สรุปแนวคิด → ความคิดเห็นพร้อมเหตุผล → ความรู้สึกหรือข้อเสนอแนะ" }
  - { front: "จุดประสงค์ของสื่อมีอะไรบ้าง", back: "ให้ความรู้ แจ้งข่าว โน้มน้าวใจ ให้ความบันเทิง" }
  - { front: "ความคิดเห็นที่สร้างสรรค์", back: "พูดถึงเรื่องไม่โจมตีคน ชมจุดดี เสนอทางแก้ ใช้คำสุภาพ" }
  - { front: "คำถามประเมินสื่อ", back: "ใครพูด มีหลักฐานไหม เหตุผลสมเหตุสมผลไหม มีประโยชน์อย่างไร" }
