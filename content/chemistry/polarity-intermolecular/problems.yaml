    type: mcq
    stem: "$\\mathrm{CO_2}$ เป็นแก๊สที่อุณหภูมิห้อง แต่ $\\mathrm{SiO_2}$ (ทราย) หลอมเหลวที่ราว 1,700 °C ทั้งที่ C และ Si อยู่หมู่เดียวกัน เพราะเหตุใด"
    choices:
      - { id: a, text: "$\\mathrm{CO_2}$ เป็นโมเลกุลเล็กที่ยึดกันด้วยแรงลอนดอน ส่วน $\\mathrm{SiO_2}$ เป็นโครงร่างตาข่ายที่ทุกอะตอมยึดกันด้วยพันธะโคเวเลนต์", correct: true, feedback: "ถูก การหลอม $\\mathrm{SiO_2}$ ต้องทำลายพันธะโคเวเลนต์จำนวนมาก" }
      - { id: b, text: "$\\mathrm{SiO_2}$ เป็นสารประกอบไอออนิก", feedback: "Si กับ O ยึดกันด้วยพันธะโคเวเลนต์ ไม่ใช่ไอออน" }
      - { id: c, text: "$\\mathrm{SiO_2}$ มีพันธะไฮโดรเจนระหว่างโมเลกุล", feedback: "$\\mathrm{SiO_2}$ ไม่มี H และไม่ได้เป็นโมเลกุลเดี่ยว" }
    hints:
      - "สูตร $\\mathrm{SiO_2}$ บอกเพียงอัตราส่วน ไม่ใช่โมเลกุลเดี่ยว"
      - "การหลอมแต่ละสารต้องทำลายอะไร"
    solution: "$\\mathrm{CO_2}$ เป็นโมเลกุลเดี่ยว การกลายเป็นแก๊สทำลายเพียงแรงลอนดอนที่อ่อน ส่วน $\\mathrm{SiO_2}$ เป็นสารโคเวเลนต์โครงร่างตาข่าย Si แต่ละอะตอมยึด O 4 อะตอมต่อกันทั้งก้อน การหลอมต้องทำลายพันธะโคเวเลนต์ จุดหลอมเหลวจึงสูงมาก"
