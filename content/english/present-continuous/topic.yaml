id: english.grammar.present-continuous
subject: english
title: { th: Present continuous (ปัจจุบันกาลกำลังกระทำ), en: Present continuous }
summary: ใช้ am is are กับกริยาเติม ing บอกสิ่งที่กำลังทำตอนนี้ สะกด ing ให้ถูก แยกการใช้กับ present simple และจับใจความข้อความที่เล่าว่าใครกำลังทำอะไร
difficulty: 2
minutes: 30
prerequisites: [english.grammar.present-simple]
encompasses:
  - { id: english.grammar.present-simple, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: continuous-timeline.svg
    alt: "เส้นเวลาสองเส้นจากอดีตไปอนาคต มีขีดแดงบอกตอนนี้ เส้นแรก I am reading a book now. มีเส้นหยักสีเขียวช่วงสั้น ๆ ครอบขีดตอนนี้ เริ่มก่อนตอนนี้เล็กน้อยและยังไม่จบ หมายถึงกำลังทำอยู่ เส้นที่สอง I read a book every night. มีกากบาทเว้นระยะเท่ากันตลอดเส้น หมายถึงทำเป็นประจำ"
    caption: "present continuous: กำลังทำอยู่ตอนนี้ · present simple: ทำเป็นประจำ"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.grammar.present-continuous.p001, prompt: "ต้องมีทั้ง be และ -ing" }
  - type: worked-example
    title: สะกดกริยาเติม -ing
    problem: "เติมกริยาให้ถูก: *The children ___ (swim) and their mother ___ (make) sandwiches.*"
    steps:
      - text: "ประธานแรก the children เป็นพหูพจน์ ใช้ are ประธานที่สอง their mother = she ใช้ is"
      - text: "swim เป็นพยางค์เดียว รูป พยัญชนะ-สระ-พยัญชนะ (w-i-m) ซ้ำ m ก่อนเติม ing: swimming"
        why: "ถ้าไม่ซ้ำจะได้ swiming ซึ่งอ่านเหมือนสระยาว ไซ-มิง"
      - text: "make ลงท้ายด้วย e ตัด e ก่อนเติม ing: making"
    answer: "*The children **are swimming** and their mother **is making** sandwiches.*"
  - { type: check, problem: english.grammar.present-continuous.p011, prompt: "ดูคำบอกเวลา every Sunday" }
  - type: worked-example
    title: เขียนบอกว่าทุกคนกำลังทำอะไร
    problem: "เขียนข้อความ LINE สั้น ๆ บอกแม่ว่า ตอนนี้ (1) ฝนกำลังตก (2) ฉันกำลังรอรถเมล์ (3) ฉันไม่ได้กำลังเดินกลับบ้าน"
    steps:
      - text: "ฝนกำลังตก: ประธาน it กับ is + raining: *It's raining.*"
      - text: "กำลังรอรถเมล์: wait for = รอ ประธาน I กับ am: *I'm waiting for the bus.*"
      - text: "ปฏิเสธ: ใส่ not หลัง am แล้วตามด้วย walking: *I'm not walking home.*"
        why: "present continuous ปฏิเสธด้วย not หลัง be ไม่ใช้ don't"
      - text: "เชื่อมเหตุกับผลด้วย so (ฝนตก จึงไม่เดินกลับ) ให้อ่านลื่น"
    answer: "*Hi Mum! It's raining, so I'm not walking home. I'm waiting for the bus.*"
glossary:
  - { term: present continuous, definition: "รูป am/is/are + V-ing ใช้กับสิ่งที่กำลังเกิดขึ้นตอนนี้หรือเรื่องชั่วคราว" }
  - { term: V-ing, definition: "กริยาเติม ing เช่น reading, making, running" }
  - { term: stative verb, definition: "กริยาบอกความรู้สึก ความคิด หรือการมี เช่น like, know, want ปกติไม่ใช้รูป -ing" }
  - { term: ใจความสำคัญ (main idea), definition: "เรื่องหลักที่ข้อความทั้งหมดต้องการบอก ไม่ใช่รายละเอียดของประโยคเดียว" }
flashcards:
  - { front: "โครงสร้าง present continuous", back: "ประธาน + am/is/are + V-ing เช่น She is cooking." }
  - { front: "run, make, swim, lie เติม -ing", back: "running, making, swimming, lying" }
  - { front: "I play football every day. กับ I am playing football now. ต่างกันอย่างไร", back: "แบบแรกทำเป็นประจำ (present simple) แบบที่สองกำลังทำอยู่ตอนนี้ (present continuous)" }
  - { front: "I am liking this song. ผิดตรงไหน", back: "like เป็นกริยาความรู้สึก ใช้ I like this song." }
