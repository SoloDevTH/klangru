  - id: EE-3
    text: องค์ความรู้เฉพาะทางวิศวกรรม
    indicators:
    - id: EE-3.1
      text: 'งานไฟฟ้ากำลัง: การผลิต ส่งจ่าย จำหน่ายและการใช้งานของกำลังไฟฟ้า การแปลงรูปกำลังไฟฟ้า การกักเก็บพลังงาน ข้อพึงปฏิบัติมาตรฐาน และความปลอดภัยในการออกแบบและติดตั้งทางไฟฟ้า สัญญาณและระบบ การแปลงรูปพลังงานไฟฟ้าเชิงกล การวัดและเครื่องมือวัดทางไฟฟ้า ระบบควบคุม และเทคโนโลยีการสื่อสาร'
      note: ฉบับ พ.ศ. ๒๕๖๕ จัด สัญญาณและระบบ การแปลงรูปพลังงานไฟฟ้าเชิงกล การวัดและเครื่องมือวัดทางไฟฟ้า ระบบควบคุม และเทคโนโลยีการสื่อสาร ไว้ในองค์ความรู้พื้นฐานทางวิศวกรรม ฉบับ พ.ศ. ๒๕๖๗ ย้ายมาไว้ในงานไฟฟ้ากำลังและงานไฟฟ้าสื่อสาร
    - id: EE-3.2
      text: 'งานไฟฟ้าสื่อสาร: ระบบสื่อสารมีสายและไร้สาย ระบบรับ-ส่งสัญญาณความถี่วิทยุหรือคลื่นแม่เหล็กไฟฟ้า การออกแบบและการทำงานของเครือข่ายโทรคมนาคมและสารสนเทศเพื่อการบริการ สัญญาณและระบบ การแปลงรูปพลังงานไฟฟ้าเชิงกล การวัดและเครื่องมือวัดทางไฟฟ้า ระบบควบคุม'
- id: IE
  title: สาขาวิศวกรรมอุตสาหการ
  standards:
  - id: IE-1
    text: องค์ความรู้พื้นฐานทางวิทยาศาสตร์
    indicators:
    - id: IE-1.1
      text: คณิตศาสตร์เชิงวิศวกรรม
    - id: IE-1.2
      text: ฟิสิกส์
    - id: IE-1.3
      text: เคมี
  - id: IE-2
    text: องค์ความรู้พื้นฐานทางวิศวกรรม
    indicators:
    - id: IE-2.1
      text: เขียนแบบวิศวกรรม
    - id: IE-2.2
      text: กลศาสตร์
    - id: IE-2.3
      text: วัสดุวิศวกรรม
    - id: IE-2.4
      text: โปรแกรมคอมพิวเตอร์สำหรับวิศวกร
    - id: IE-2.5
      text: สถิติวิศวกรรม
    - id: IE-2.6
      text: กระบวนการผลิต
      note: ต้นฉบับพิมพ์ติดกันเป็น "กระบวนการผลิตอุณหพลศาสตร์" แยกเป็นสองรายการตามฉบับ พ.ศ. ๒๕๖๒ ที่เว้นวรรคไว้
    - id: IE-2.7
      text: อุณหพลศาสตร์
      note: ต้นฉบับพิมพ์ติดกันเป็น "กระบวนการผลิตอุณหพลศาสตร์" แยกเป็นสองรายการตามฉบับ พ.ศ. ๒๕๖๒ ที่เว้นวรรคไว้
    - id: IE-2.8
      text: ความรู้พื้นฐานไฟฟ้า
  - id: IE-3
    text: องค์ความรู้เฉพาะทางวิศวกรรม
    indicators:
    - id: IE-3.1
      text: '(๑) วัสดุอุตสาหกรรมและกระบวนการผลิตทางเทคโนโลยีสมัยใหม่: กระบวนการทางวิศวกรรมของโลหะ อโลหะ และวัสดุทางวิศวกรรม กระบวนการผลิตทางเทคโนโลยีสมัยใหม่ การวิเคราะห์และการออกแบบผลิตภัณฑ์และกระบวนการโดยการแปลงหน้าที่ของผลิตภัณฑ์เชิงคุณภาพและเชิงนวัตกรรม โดยคำนึงถึงแนวทางการพัฒนาอย่างยั่งยืน'
    - id: IE-3.2
      text: '(๒) ระบบงานและความปลอดภัย: การศึกษาและออกแบบระบบงานเพื่อการปรับปรุงผลิตภาพ และประสิทธิภาพการผลิต การศึกษาวิเคราะห์และการออกแบบระบบงานเพื่อความปลอดภัย การยศาสตร์ สิ่งแวดล้อม ระบบดับเพลิง และการประเมินความเสี่ยงในอุตสาหกรรม การดำเนินการจัดการกากอุตสาหกรรมที่มาจากวัตถุของเสีย น้ำเสีย มลพิษจากอากาศ รวมทั้งกากกัมมันตรังสี'
    - id: IE-3.3
      text: '(๓) ระบบคุณภาพ: ระบบการควบคุมคุณภาพและการประกันคุณภาพ การจัดการคุณภาพเชิงรวม กระบวนการออกและวิเคราะห์แผนการทดลองเพื่อกำหนดสภาวการณ์การผลิตที่เหมาะสม และวิศวกรรมคุณภาพเพื่อความน่าเชื่อถือได้ตลอดจนนวัตกรรมทางระบบคุณภาพ โดยคำนึงถึงแนวทางการพัฒนาอย่างยั่งยืน'
    - id: IE-3.4
      text: '(๔) เศรษฐศาสตร์และการเงิน: การวิเคราะห์ทางเศรษฐศาสตร์เพื่อการตัดสินใจในงานวิศวกรรมภายใต้ความเสี่ยงและความไม่แน่นอน การจัดการต้นทุนเพื่อการจัดการงบประมาณ และการจัดการและการวิเคราะห์งบการเงินและการบัญชี การศึกษาวิเคราะห์และประเมินความเป็นไปได้ของโครงการ'
    - id: IE-3.5
      text: '(๕) การจัดการการผลิต: การวางแผนและควบคุมการผลิต การวิเคราะห์เชิงปริมาณเพื่อการจัดการการผลิต การจัดการระบบการซ่อมบำรุง การจัดการองค์กรของระบบการผลิตและการบริการ และการจัดการนวัตกรรมในองค์กร โดยคำนึงถึงแนวทางการพัฒนาระบบการจัดการการผลิตอย่างยั่งยืน'
    - id: IE-3.6
      text: '(๖) การบูรณาการทางวิศวกรรมอุตสาหการ: การบูรณาการความรู้ในองค์ความรู้ ตั้งแต่สององค์ความรู้ ขึ้นไปเพื่อแก้ไขปัญหาทางวิศวกรรมที่ซับซ้อน เสนอแนะแนวทางการปรับปรุงวิธีการ หรือแนวทางใหม่ในงานวิศวกรรม ระบบ และการบริการอื่น ๆ โดยคำนึงถึงแนวทางการพัฒนาอย่างยั่งยืน'
- id: MIN
  title: สาขาวิศวกรรมเหมืองแร่ (งานเหมืองแร่)
  standards:
  - id: MIN-1
    text: องค์ความรู้พื้นฐานทางวิทยาศาสตร์
    indicators:
    - id: MIN-1.1
      text: ความรู้ในระดับอุดมศึกษาเกี่ยวกับปรากฏการณ์ทางฟิสิกส์และเคมี ระบบธรณีวิทยาและเปลือกโลก แร่และหิน รวมทั้งแคลคูลัส สมการเชิงอนุพันธ์ การคำนวณเมทริกซ์ สถิติและความเป็นไปได้ และวิทยาการคอมพิวเตอร์
  - id: MIN-2
    text: องค์ความรู้พื้นฐานทางวิศวกรรมและองค์ความรู้เฉพาะทางวิศวกรรม
    indicators:
    - id: MIN-2.1
      text: (๑) พื้นฐานและการประยุกต์ใช้ความรู้เชิงระบบแรงและความแข็งแรงวัสดุ ในของแข็ง ของเหลววัสดุวิศวกรรม โครงสร้างทางวิศวกรรมและชั้นหินในเปลือกโลก
    - id: MIN-2.2
      text: (๒) พื้นฐานและการประยุกต์ใช้ความรู้เชิงระบบด้านกลไกควบคุม เครื่องจักรกลต้นกำลัง พลังงาน และการส่งกำลังทางไฟฟ้า
    - id: MIN-2.3
      text: (๓) พื้นฐานและการประยุกต์ใช้ความรู้ด้านเคมี เคมีกายภาพ และ/หรือ เคมีไฟฟ้าของระบบก๊าซ ของเหลว และอนุภาคของแข็ง และการประยุกต์ใช้ในงานอย่างใดอย่างหนึ่ง หรือ ควบรวมงานสำรวจแร่ การทำเหมืองแร่ การแต่งแร่ การนำวัสดุกลับมาใช้ใหม่
    - id: MIN-2.4
      text: (๔) พื้นฐานและการประยุกต์ใช้ความรู้ทางธรณีวิทยาโครงสร้าง ธรณีวิศวกรรม และ/หรือ ธรณีสถิติในการปฏิบัติการ และ/หรือ การออกแบบ และ/หรือ การแก้ไขปัญหาในการสำรวจแร่ การประเมินปริมาณแร่ ปริมาณแร่สำรองที่ทำเหมืองได้ และ/หรือ งานวิศวกรรมธรณี งานสำรวจความแข็งแรงของฐานราก หรือ การเสริมความแข็งแรงของผนังบ่อเหมือง และ/หรือ อุโมงค์ และ/หรือ ช่องเปิดในหิน
    - id: MIN-2.5
      text: (๕) พื้นฐานและการประยุกต์ใช้ความรู้เชิงระบบในการปฏิบัติการ และ/หรือ การออกแบบ และ/หรือ การแก้ไขปัญหาที่เกิดขึ้นในระบบงานอย่างใดอย่างหนึ่ง หรือควบรวมงานสำรวจแร่ งานทำเหมืองแร่ งานแต่งแร่ การนำวัสดุกลับมาใช้ใหม่
    - id: MIN-2.6
      text: (๖) พื้นฐานและการประยุกต์ใช้ความรู้ในด้านการบริหารงานวิศวกรรม การจัดการโครงงาน เศรษฐศาสตร์วิศวกรรม และ/หรือ การลงทุนภายใต้ข้อกำหนดของการพัฒนาที่ยั่งยืนและความซับซ้อนของงานวิศวกรรม
    - id: MIN-2.7
      text: (๗) พื้นฐานความรู้เชิงระบบด้านนิเวศวิทยา การจัดการความปลอดภัย สิ่งแวดล้อม อาชีวอนามัยการพัฒนาที่ยั่งยืน มาตรฐานและกฎหมายที่เกี่ยวข้อง ในการทำงานเหมืองแร่และการประเมินผลกระทบสิ่งแวดล้อมจากการสำรวจแร่ การทำเหมืองแร่ การแต่งแร่ การนำวัสดุกลับมาใช้ใหม่
    - id: MIN-2.8
      text: (๘) พื้นฐานและการประยุกต์ใช้ความรู้เชิงระบบในการปฏิบัติการ และ/หรือ การออกแบบ และ/หรือ การแก้ไขปัญหาที่เกิดขึ้นในงานเจาะและระเบิดในงานวิศวกรรม
- id: MET
  title: สาขาวิศวกรรมเหมืองแร่ (งานโลหการ)
  standards:
  - id: MET-1
    text: องค์ความรู้พื้นฐานทางวิทยาศาสตร์
    indicators:
    - id: MET-1.1
      text: ความรู้ในระดับอุดมศึกษาเกี่ยวกับปรากฏการณ์ทางฟิสิกส์และเคมี รวมทั้งแคลคูลัส สมการเชิงอนุพันธ์ การคำนวณเมทริกซ์ สถิติและความเป็นไปได้ และวิทยาการคอมพิวเตอร์
  - id: MET-2
    text: องค์ความรู้พื้นฐานทางวิศวกรรมและองค์ความรู้เฉพาะทางวิศวกรรม
    indicators:
    - id: MET-2.1
      text: (๑) พื้นฐานและการประยุกต์ใช้ความรู้เชิงระบบแรงและความแข็งแรงวัสดุในของแข็ง ของเหลว วัสดุวิศวกรรม โครงสร้างทางวิศวกรรม
    - id: MET-2.2
      text: (๒) พื้นฐานและการประยุกต์ใช้ความรู้เชิงระบบด้านกลไกควบคุม เครื่องจักรกลต้นกำลัง พลังงาน และการส่งกำลังทางไฟฟ้า
    - id: MET-2.3
      text: (๓) พื้นฐานและการประยุกต์ใช้ความรู้ด้านเคมี เคมีกายภาพ และ/หรือ เคมีไฟฟ้าของระบบก๊าซ ของเหลว โลหะหลอมเหลว และอนุภาคของแข็ง
    - id: MET-2.4
      text: (๔) พื้นฐานและการประยุกต์ใช้วัสดุธรรมชาติ และ/หรือ วัสดุวิศวกรรมที่เหมาะสมในงานวิศวกรรมภายใต้ข้อกำหนดของการพัฒนาที่ยั่งยืนและความซับซ้อนของงานวิศวกรรม
    - id: MET-2.5
      text: (๕) พื้นฐานและการประยุกต์ใช้ความรู้ด้านโลหะวิทยาของเหล็กและโลหะกลุ่มนอกเหล็ก โลหะต้านการกร่อนและทนความร้อนสูงพื้นฐาน
    - id: MET-2.6
      text: (๖) พื้นฐานและการประยุกต์ใช้ความรู้เชิงระบบในการปฏิบัติการ และ/หรือการออกแบบ และ/หรือ การแก้ไขปัญหาที่เกิดขึ้นในกระบวนการปรับปรุงผิวและการเคลือบผิวโลหะ
    - id: MET-2.7
      text: (๗) พื้นฐานและการประยุกต์ใช้ความรู้เชิงระบบในการปฏิบัติการ และ/หรือการออกแบบ และ/หรือ การแก้ไขปัญหาที่เกิดขึ้นในระบบงานอย่างใดอย่างหนึ่ง หรือ ควบรวมการผลิตโลหะ การนำโลหะกลับมาใช้ใหม่ การแปรสภาพและขึ้นรูปร้อน การแปรสภาพและขึ้นรูปเย็น กระบวนการอบชุบความร้อน กระบวนการปรับปรุงผิวและการเคลือบผิวโลหะ การหล่อโลหะ การเชื่อมโลหะ และการบัดกรี
    - id: MET-2.8
      text: (๘) พื้นฐานและการประยุกต์ใช้ความรู้เชิงระบบในการออกแบบ และ/หรือการแก้ไขปัญหาที่เกิดขึ้นในงานวิศวกรรมที่ซับซ้อน โดยใช้การวิเคราะห์ลักษณะเฉพาะการวิบัติและการเสื่อมสภาพของวัสดุและโลหะ
    - id: MET-2.9
      text: (๙) พื้นฐานและการประยุกต์ใช้ความรู้ในด้านการบริหารงานวิศวกรรม การจัดการโครงงาน เศรษฐศาสตร์วิศวกรรม และ/หรือ การลงทุนภายใต้ข้อกำหนดของการพัฒนาที่ยั่งยืนและความซับซ้อนของงานวิศวกรรม
    - id: MET-2.10
      text: (๑๐) พื้นฐานความรู้เชิงระบบด้านการจัดการความปลอดภัย สิ่งแวดล้อมอาชีวอนามัย กฎหมาย การพัฒนาที่ยั่งยืน และมาตรฐานในการประกอบวิชาชีพวิศวกรรม
- id: CHE
  title: สาขาวิศวกรรมเคมี
  standards:
  - id: CHE-1
    text: องค์ความรู้พื้นฐานทางวิทยาศาสตร์
    indicators:
    - id: CHE-1.1
      text: (๑) ความรู้ในระดับอุดมศึกษาเกี่ยวกับคณิตศาสตร์
    - id: CHE-1.2
      text: (๒) ฟิสิกส์
    - id: CHE-1.3
      text: (๓) เคมี และ/หรือ เคมีอินทรีย์สำหรับปิโตรเคมี และ/หรือ เคมีวิเคราะห์ และ/หรือ วิศวกรรมเคมีชีวภาพ (Biochemical Engineering)
  - id: CHE-2
    text: องค์ความรู้พื้นฐานทางวิศวกรรม
    indicators:
    - id: CHE-2.1
      text: (๑) วัสดุวิศวกรรม
    - id: CHE-2.2
      text: (๒) สถิติวิศวกรรมและการออกแบบการทดลอง
    - id: CHE-2.3
      text: (๓) วิศวกรรมไฟฟ้า
    - id: CHE-2.4
      text: (๔) โปรแกรมคอมพิวเตอร์สำหรับวิศวกร และ/หรือ การวิเคราะห์ข้อมูล (Data Analytics)
    - id: CHE-2.5
      text: (๕) การเขียนแบบวิศวกรรม
    - id: CHE-2.6
      text: (๖) กลศาสตร์วิศวกรรม
  - id: CHE-3
    text: องค์ความรู้เฉพาะทางวิศวกรรม
    indicators:
    - id: CHE-3.1
      text: (๑) พื้นฐานและการประยุกต์ใช้ความรู้เกี่ยวกับดุลมวลและพลังงาน
    - id: CHE-3.2
      text: (๒) พื้นฐานทางอุณหพลศาสตร์ทางวิศวกรรมเคมี
    - id: CHE-3.3
      text: (๓) ความรู้เกี่ยวกับการปฏิบัติการเฉพาะหน่วยและปรากฏการณ์การถ่ายโอน และตัวอย่างปัญหาทางวิศวกรรมที่ซับซ้อน
    - id: CHE-3.4
      text: (๔) ความรู้เกี่ยวกับวิศวกรรมปฏิกิริยาเคมีและการออกแบบเครื่องปฏิกรณ์ และตัวอย่างปัญหาทางวิศวกรรมที่ซับซ้อน
    - id: CHE-3.5
      text: (๕) พื้นฐานและการประยุกต์ใช้ความรู้เชิงระบบในการออกแบบอุปกรณ์และการออกแบบโรงงานทางวิศวกรรมเคมี ตัวอย่างการประยุกต์ใช้กับงานวิศวกรรมที่ซับซ้อน
    - id: CHE-3.6
      text: (๖) พื้นฐานเครื่องมือวัดอุตสาหกรรม (Industrial Instrumentation)
    - id: CHE-3.7
      text: (๗) ความรู้เกี่ยวกับการจำลองกระบวนการทางวิศวกรรมเคมีกับการแก้ปัญหาวิศวกรรมที่ซับซ้อน
    - id: CHE-3.8
      text: (๘) ความรู้เกี่ยวกับพลศาสตร์ของกระบวนการและการควบคุมในงานวิศวกรรม
    - id: CHE-3.9
      text: (๙) หลักการบริหารโครงการ และ/หรือ เทคโนโลยีการจัดการอุตสาหกรรมและการผลิตเพื่อการพัฒนาที่ยั่งยืน
    - id: CHE-3.10
      text: (๑๐) หลักทางเศรษฐศาสตร์วิศวกรรมและการประเมินราคาทางวิศวกรรมสำหรับการลงทุนภายใต้พลวัตทางเศรษฐกิจ
    - id: CHE-3.11
      text: (๑๑) วิศวกรรมความปลอดภัยและการประเมินความเสี่ยงตามหลักการและมาตรฐานวิศวกรรมเพื่อความยั่งยืนของอุตสาหกรรม
    - id: CHE-3.12
      text: (๑๒) หลักการจัดการและการบำบัดของเสีย และ/หรือ วิศวกรรมกระบวนการด้านสิ่งแวดล้อมกับการพัฒนาอย่างยั่งยืน การปล่อยก๊าซเรือนกระจกสุทธิเป็นศูนย์และความเป็นกลางทางคาร์บอน
- id: ENV
  title: สาขาวิศวกรรมสิ่งแวดล้อม
  standards:
  - id: ENV-1
