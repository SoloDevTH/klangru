strands:
  - id: "S-U"
    title: "Science understanding"
    standards:
      - id: "S-U-BIO"
        text: "Biological sciences"
        indicators:
          - { id: "AC9SFU01", level: "F", text: "observe external features of plants and animals and describe ways they can be grouped based on these features" }
          - { id: "AC9S1U01", level: "1", text: "identify the basic needs of plants and animals, including air, water, food or shelter, and describe how the places they live meet those needs" }
          - { id: "AC9S3U01", level: "3", text: "compare characteristics of living and non-living things and examine the differences between the life cycles of plants and animals" }
          - { id: "AC9S4U01", level: "4", text: "explain the roles and interactions of consumers, producers and decomposers within a habitat and how food chains represent feeding relationships" }
          - { id: "AC9S5U01", level: "5", text: "examine how particular structural features and behaviours of living things enable their survival in specific habitats" }
          - { id: "AC9S6U01", level: "6", text: "investigate the physical conditions of a habitat and analyse how the growth and survival of living things is affected by changing physical conditions" }
          - { id: "AC9S7U01", level: "7", text: "investigate the role of classification in ordering and organising the diversity of life on Earth and use and develop classification tools including dichotomous keys" }
          - { id: "AC9S7U02", level: "7", text: "use models, including food webs, to represent matter and energy flow in ecosystems and predict the impact of changing abiotic and biotic factors on populations" }
          - { id: "AC9S8U01", level: "8", text: "recognise cells as the basic units of living things, compare plant and animal cells, and describe the functions of specialised cell structures and organelles" }
          - { id: "AC9S8U02", level: "8", text: "analyse the relationship between structure and function of cells, tissues and organs in a plant and an animal organ system and explain how these systems enable survival of the individual" }
          - { id: "AC9S9U01", level: "9", text: "compare the role of body systems in regulating and coordinating the body’s response to a stimulus, and describe the operation of a negative feedback mechanism" }
          - { id: "AC9S9U02", level: "9", text: "describe the form and function of reproductive cells and organs in animals and plants, and analyse how the processes of sexual and asexual reproduction enable survival of the species" }
          - { id: "AC9S10U01", level: "10", text: "explain the role of meiosis and mitosis and the function of chromosomes, DNA and genes in heredity and predict patterns of Mendelian inheritance" }
          - { id: "AC9S10U02", level: "10", text: "use the theory of evolution by natural selection to explain past and present diversity and analyse the scientific evidence supporting the theory" }
      - id: "S-U-PHY"
        text: "Physical sciences"
        indicators:
          - { id: "AC9SFU02", level: "F", text: "describe how objects move and how factors including their size, shape or material influence their movement" }
          - { id: "AC9S1U03", level: "1", text: "describe pushes and pulls in terms of strength and direction and predict the effect of these forces on objects’ motion and shape" }
          - { id: "AC9S2U02", level: "2", text: "explore different actions to make sounds and how to make a variety of sounds, and recognise that sound energy causes objects to vibrate" }
          - { id: "AC9S3U03", level: "3", text: "identify sources of heat energy and examine how temperature changes when heat energy is transferred from one object to another" }
          - { id: "AC9S4U03", level: "4", text: "identify how forces can be exerted by one object on another and investigate the effect of frictional, gravitational and magnetic forces on the motion of objects" }
          - { id: "AC9S5U03", level: "5", text: "identify sources of light, recognise that light travels in a straight path and describe how shadows are formed and light can be reflected and refracted" }
          - { id: "AC9S6U03", level: "6", text: "investigate the transfer and transformation of energy in electrical circuits, including the role of circuit components, insulators and conductors" }
          - { id: "AC9S7U04", level: "7", text: "investigate and represent balanced and unbalanced forces, including gravitational force, acting on objects, and relate changes in an object’s motion to its mass and the magnitude and direction of forces acting on it" }
          - { id: "AC9S8U05", level: "8", text: "classify different types of energy as kinetic or potential and investigate energy transfer and transformations in simple systems" }
          - { id: "AC9S9U04", level: "9", text: "use wave and particle models to describe energy transfer through different mediums and examine the usefulness of each model for explaining phenomena" }
          - { id: "AC9S9U05", level: "9", text: "apply the law of conservation of energy to analyse system efficiency in terms of energy inputs, outputs, transfers and transformations" }
          - { id: "AC9S10U05", level: "10", text: "investigate Newton’s laws of motion and quantitatively analyse the relationship between force, mass and acceleration of objects" }
      - id: "S-U-CHE"
        text: "Chemical sciences"
        indicators:
          - { id: "AC9SFU03", level: "F", text: "recognise that objects can be composed of different materials and describe the observable properties of those materials" }
          - { id: "AC9S2U03", level: "2", text: "recognise that materials can be changed physically without changing their material composition and explore the effect of different actions on materials including bending, twisting, stretching and breaking into smaller pieces" }
          - { id: "AC9S3U04", level: "3", text: "investigate the observable properties of solids and liquids and how adding or removing heat energy leads to a change of state" }
          - { id: "AC9S4U04", level: "4", text: "examine the properties of natural and made materials including fibres, metals, glass and plastics and consider how these properties influence their use" }
          - { id: "AC9S5U04", level: "5", text: "explain observable properties of solids, liquids and gases by modelling the motion and arrangement of particles" }
          - { id: "AC9S6U04", level: "6", text: "compare reversible changes, including dissolving and changes of state, and irreversible changes, including cooking and rusting that produce new substances" }
          - { id: "AC9S7U05", level: "7", text: "use particle theory to describe the arrangement of particles in a substance, including the motion of and attraction between particles, and relate this to the properties of the substance" }
          - { id: "AC9S7U06", level: "7", text: "use a particle model to describe differences between pure substances and mixtures and apply understanding of properties of substances to separate mixtures" }
          - { id: "AC9S8U06", level: "8", text: "classify matter as elements, compounds or mixtures and compare different representations of these, including 2-dimensional and 3-dimensional models, symbols for elements and formulas for molecules and compounds" }
          - { id: "AC9S8U07", level: "8", text: "compare physical and chemical changes and identify indicators of energy change in chemical reactions" }
          - { id: "AC9S9U06", level: "9", text: "explain how the model of the atom changed following the discovery of electrons, protons and neutrons and describe how natural radioactive decay results in stable atoms" }
          - { id: "AC9S9U07", level: "9", text: "model the rearrangement of atoms in chemical reactions using a range of representations, including word and simple balanced chemical equations, and use these to demonstrate the law of conservation of mass" }
          - { id: "AC9S10U06", level: "10", text: "explain how the structure and properties of atoms relate to the organisation of the elements in the periodic table" }
          - { id: "AC9S10U07", level: "10", text: "identify patterns in synthesis, decomposition and displacement reactions and investigate the factors that affect reaction rates" }
      - id: "S-U-EAR"
        text: "Earth and space sciences"
        indicators:
          - { id: "AC9S1U02", level: "1", text: "describe daily and seasonal changes in the environment and explore how these changes affect everyday life" }
          - { id: "AC9S2U01", level: "2", text: "recognise Earth is a planet in the solar system and identify patterns in the changing position of the sun, moon, planets and stars in the sky" }
          - { id: "AC9S3U02", level: "3", text: "compare the observable properties of soils, rocks and minerals and investigate why they are important Earth resources" }
          - { id: "AC9S4U02", level: "4", text: "identify sources of water and describe key processes in the water cycle, including movement of water through the sky, landscape and ocean; precipitation; evaporation; and condensation" }
          - { id: "AC9S5U02", level: "5", text: "describe how weathering, erosion, transportation and deposition cause slow or rapid change to Earth’s surface" }
          - { id: "AC9S6U02", level: "6", text: "describe the movement of Earth and other planets relative to the sun and model how Earth’s tilt, rotation on its axis and revolution around the sun relate to cyclic observable phenomena, including variable day and night length" }
          - { id: "AC9S7U03", level: "7", text: "model cyclic changes in the relative positions of the Earth, sun and moon and explain how these cycles cause eclipses and influence predictable phenomena on Earth, including seasons and tides" }
          - { id: "AC9S8U03", level: "8", text: "investigate tectonic activity including the formation of geological features at divergent, convergent and transform plate boundaries and describe the scientific evidence for the theory of plate tectonics" }
          - { id: "AC9S8U04", level: "8", text: "describe the key processes of the rock cycle, including the timescales over which they occur, and examine how the properties of sedimentary, igneous and metamorphic rocks reflect their formation and influence their use" }
          - { id: "AC9S9U03", level: "9", text: "represent the carbon cycle and examine how key processes including combustion, photosynthesis and respiration rely on interactions between Earth’s spheres (the geosphere, biosphere, hydrosphere and atmosphere)" }
          - { id: "AC9S10U03", level: "10", text: "describe how the big bang theory models the origin and evolution of the universe and analyse the supporting evidence for the theory" }
          - { id: "AC9S10U04", level: "10", text: "use models of energy flow between the geosphere, biosphere, hydrosphere and atmosphere to explain patterns of global climate change" }
  - id: "S-H"
    title: "Science as a human endeavour"
    standards:
      - id: "S-H-UIS"
        text: "Use and influence of science"
        indicators:
          - { id: "AC9SFH01", level: "F", text: "explore the ways people make and use observations and questions to learn about the natural world" }
          - { id: "AC9S1H01", level: "1", text: "describe how people use science in their daily lives, including using patterns to make scientific predictions" }
          - { id: "AC9S2H01", level: "2", text: "describe how people use science in their daily lives, including using patterns to make scientific predictions" }
          - { id: "AC9S3H02", level: "3", text: "consider how people use scientific explanations to meet a need or solve a problem" }
          - { id: "AC9S4H02", level: "4", text: "consider how people use scientific explanations to meet a need or solve a problem" }
          - { id: "AC9S5H02", level: "5", text: "investigate how scientific knowledge is used by individuals and communities to identify problems, consider responses and make decisions" }
          - { id: "AC9S6H02", level: "6", text: "investigate how scientific knowledge is used by individuals and communities to identify problems, consider responses and make decisions" }
          - { id: "AC9S7H03", level: "7", text: "examine how proposed scientific responses to contemporary issues may impact on society and explore ethical, environmental, social and economic considerations" }
          - { id: "AC9S7H04", level: "7", text: "explore the role of science communication in informing individual viewpoints and community policies and regulations" }
          - { id: "AC9S8H03", level: "8", text: "examine how proposed scientific responses to contemporary issues may impact on society and explore ethical, environmental, social and economic considerations" }
          - { id: "AC9S8H04", level: "8", text: "explore the role of science communication in informing individual viewpoints and community policies and regulations" }
          - { id: "AC9S9H03", level: "9", text: "analyse the key factors that contribute to science knowledge and practices being adopted more broadly by society" }
          - { id: "AC9S9H04", level: "9", text: "examine how the values and needs of society influence the focus of scientific research" }
          - { id: "AC9S10H03", level: "10", text: "analyse the key factors that contribute to science knowledge and practices being adopted more broadly by society" }
          - { id: "AC9S10H04", level: "10", text: "examine how the values and needs of society influence the focus of scientific research" }
      - id: "S-H-NDS"
        text: "Nature and development of science"
        indicators:
          - { id: "AC9S3H01", level: "3", text: "examine how people use data to develop scientific explanations" }
          - { id: "AC9S4H01", level: "4", text: "examine how people use data to develop scientific explanations" }
          - { id: "AC9S5H01", level: "5", text: "examine why advances in science are often the result of collaboration or build on the work of others" }
          - { id: "AC9S6H01", level: "6", text: "examine why advances in science are often the result of collaboration or build on the work of others" }
          - { id: "AC9S7H01", level: "7", text: "explain how new evidence or different perspectives can lead to changes in scientific knowledge" }
          - { id: "AC9S7H02", level: "7", text: "investigate how cultural perspectives and world views influence the development of scientific knowledge" }
          - { id: "AC9S8H01", level: "8", text: "explain how new evidence or different perspectives can lead to changes in scientific knowledge" }
          - { id: "AC9S8H02", level: "8", text: "investigate how cultural perspectives and world views influence the development of scientific knowledge" }
          - { id: "AC9S9H01", level: "9", text: "explain how scientific knowledge is validated and refined, including the role of publication and peer review" }
          - { id: "AC9S9H02", level: "9", text: "investigate how advances in technologies enable advances in science, and how science has contributed to developments in technologies and engineering" }
          - { id: "AC9S10H01", level: "10", text: "explain how scientific knowledge is validated and refined, including the role of publication and peer review" }
          - { id: "AC9S10H02", level: "10", text: "investigate how advances in technologies enable advances in science, and how science has contributed to developments in technologies and engineering" }
  - id: "S-I"
    title: "Science inquiry"
    standards:
      - id: "S-I-QP"
        text: "Questioning and predicting"
        indicators:
          - { id: "AC9SFI01", level: "F", text: "pose questions and make predictions based on experiences" }
          - { id: "AC9S1I01", level: "1", text: "pose questions to explore observed simple patterns and relationships and make predictions based on experiences" }
          - { id: "AC9S2I01", level: "2", text: "pose questions to explore observed simple patterns and relationships and make predictions based on experiences" }
          - { id: "AC9S3I01", level: "3", text: "pose questions to explore observed patterns and relationships and make predictions based on observations" }
          - { id: "AC9S4I01", level: "4", text: "pose questions to explore observed patterns and relationships and make predictions based on observations" }
          - { id: "AC9S5I01", level: "5", text: "pose investigable questions to identify patterns and test relationships and make reasoned predictions" }
          - { id: "AC9S6I01", level: "6", text: "pose investigable questions to identify patterns and test relationships and make reasoned predictions" }
          - { id: "AC9S7I01", level: "7", text: "develop investigable questions, reasoned predictions and hypotheses to explore scientific models, identify patterns and test relationships" }
          - { id: "AC9S8I01", level: "8", text: "develop investigable questions, reasoned predictions and hypotheses to explore scientific models, identify patterns and test relationships" }
          - { id: "AC9S9I01", level: "9", text: "develop investigable questions, reasoned predictions and hypotheses to test relationships and develop explanatory models" }
          - { id: "AC9S10I01", level: "10", text: "develop investigable questions, reasoned predictions and hypotheses to test relationships and develop explanatory models" }
      - id: "S-I-PC"
        text: "Planning and conducting"
        indicators:
          - { id: "AC9SFI02", level: "F", text: "engage in investigations safely and make observations using their senses" }
          - { id: "AC9S1I02", level: "1", text: "suggest and follow safe procedures to investigate questions and test predictions" }
          - { id: "AC9S1I03", level: "1", text: "make and record observations, including informal measurements, using digital tools as appropriate" }
          - { id: "AC9S2I02", level: "2", text: "suggest and follow safe procedures to investigate questions and test predictions" }
          - { id: "AC9S2I03", level: "2", text: "make and record observations, including informal measurements, using digital tools as appropriate" }
          - { id: "AC9S3I02", level: "3", text: "use provided scaffolds to plan and conduct investigations to answer questions or test predictions, including identifying the elements of fair tests, and considering the safe use of materials and equipment" }
          - { id: "AC9S3I03", level: "3", text: "follow procedures to make and record observations, including making formal measurements using familiar scaled instruments and using digital tools as appropriate" }
          - { id: "AC9S4I02", level: "4", text: "use provided scaffolds to plan and conduct investigations to answer questions or test predictions, including identifying the elements of fair tests, and considering the safe use of materials and equipment" }
          - { id: "AC9S4I03", level: "4", text: "follow procedures to make and record observations, including making formal measurements using familiar scaled instruments and using digital tools as appropriate" }
          - { id: "AC9S5I02", level: "5", text: "plan and conduct repeatable investigations to answer questions, including, as appropriate, deciding the variables to be changed, measured and controlled in fair tests; describing potential risks; planning for the safe use of equipment and materials; and identifying required permissions to conduct investigations on Country/Place" }
          - { id: "AC9S5I03", level: "5", text: "use equipment to observe, measure and record data with reasonable precision, using digital tools as appropriate" }
          - { id: "AC9S6I02", level: "6", text: "plan and conduct repeatable investigations to answer questions including, as appropriate, deciding the variables to be changed, measured and controlled in fair tests; describing potential risks; planning for the safe use of equipment and materials; and identifying required permissions to conduct investigations on Country/Place" }
          - { id: "AC9S6I03", level: "6", text: "use equipment to observe, measure and record data with reasonable precision, using digital tools as appropriate" }
          - { id: "AC9S7I02", level: "7", text: "plan and conduct reproducible investigations to answer questions and test hypotheses, including identifying variables and assumptions and, as appropriate, recognising and managing risks, considering ethical issues and recognising key considerations regarding heritage sites and artefacts on Country/Place" }
          - { id: "AC9S7I03", level: "7", text: "select and use equipment to generate and record data with precision, using digital tools as appropriate" }
          - { id: "AC9S8I02", level: "8", text: "plan and conduct reproducible investigations to answer questions and test hypotheses, including identifying variables and assumptions and, as appropriate, recognising and managing risks, considering ethical issues and recognising key considerations regarding heritage sites and artefacts on Country/Place" }
          - { id: "AC9S8I03", level: "8", text: "select and use equipment to generate and record data with precision, using digital tools as appropriate" }
          - { id: "AC9S9I02", level: "9", text: "plan and conduct valid, reproducible investigations to answer questions and test hypotheses, including identifying and controlling for possible sources of error and, as appropriate, developing and following risk assessments, considering ethical issues, and addressing key considerations regarding heritage sites and artefacts on Country/Place" }
          - { id: "AC9S9I03", level: "9", text: "select and use equipment to generate and record data with precision to obtain useful sample sizes and replicable data, using digital tools as appropriate" }
          - { id: "AC9S10I02", level: "10", text: "plan and conduct valid, reproducible investigations to answer questions and test hypotheses, including identifying and controlling for possible sources of error and, as appropriate, developing and following risk assessments, considering ethical issues, and addressing key considerations regarding heritage sites and artefacts on Country/Place" }
          - { id: "AC9S10I03", level: "10", text: "select and use equipment to generate and record data with precision to obtain useful sample sizes and replicable data, using digital tools as appropriate" }
      - id: "S-I-PMA"
        text: "Processing, modelling and analysing"
        indicators:
          - { id: "AC9SFI03", level: "F", text: "represent observations in provided templates and identify patterns with guidance" }
          - { id: "AC9S1I04", level: "1", text: "sort and order data and information and represent patterns, including with provided tables and visual or physical models" }
          - { id: "AC9S2I04", level: "2", text: "sort and order data and information and represent patterns, including with provided tables and visual or physical models" }
          - { id: "AC9S3I04", level: "3", text: "construct and use representations, including tables, simple column graphs and visual or physical models, to organise data and information, show simple relationships and identify patterns" }
          - { id: "AC9S4I04", level: "4", text: "construct and use representations, including tables, simple column graphs and visual or physical models, to organise data and information, show simple relationships and identify patterns" }
          - { id: "AC9S5I04", level: "5", text: "construct and use appropriate representations, including tables, graphs and visual or physical models, to organise and process data and information and describe patterns, trends and relationships" }
