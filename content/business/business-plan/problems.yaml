problems:
  - id: business.entrepreneurship.business-plan.p001
    topics: [business.entrepreneurship.business-plan]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นลักษณะของ **ผู้ประกอบการ** ที่ช่วยให้ธุรกิจประสบความสำเร็จ (เลือกได้มากกว่าหนึ่งข้อ)"
    multiple: true
    choices:
      - { id: a, text: "คิดหาวิธีใหม่แก้ปัญหาของลูกค้า", correct: true }
      - { id: b, text: "ขายไม่ดีแล้วหาสาเหตุ ปรับสินค้า และลองใหม่", correct: true }
      - { id: c, text: "ลงทุนทั้งหมดทันทีโดยไม่ทดลองขายก่อน เพราะมั่นใจว่าจะขายดี", feedback: "กล้าเสี่ยงต้องมีเหตุผล ควรทดลองเล็ก ๆ และเก็บข้อมูลก่อน" }
      - { id: d, text: "บอกลูกค้าตามจริงเมื่อสินค้าล่าช้า", correct: true }
      - { id: "e", text: "ใช้เงินร้านกับเงินส่วนตัวปนกัน ไม่ต้องจดบัญชี", feedback: "ไม่แยกเงินทำให้ไม่รู้ต้นทุนและกำไรจริง" }
    hints:
      - "ผู้ประกอบการมองเห็นโอกาสและยอมรับความเสี่ยงอย่างมีเหตุผล"
      - "ข้อใดทำให้ธุรกิจเสียหาย"
    solution: "ข้อ ก ข และ ง ช่วยให้ธุรกิจเติบโต (สร้างสรรค์ เรียนรู้จากความผิดพลาด ซื่อสัตย์) ข้อ ค เสี่ยงโดยไม่มีข้อมูล และข้อ จ ทำให้ไม่รู้ว่าธุรกิจกำไรจริงหรือไม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.business-plan.p002
    topics: [business.entrepreneurship.business-plan]
    difficulty: 1
    type: match
    stem: "จับคู่ส่วนของแผนธุรกิจกับคำถามที่ส่วนนั้นตอบ"
    pairs:
      - { left: "ลูกค้าเป้าหมายและตลาด", right: "ใครจะซื้อ มีกี่คน ซื้อบ่อยแค่ไหน" }
      - { left: "คู่แข่งและความได้เปรียบ", right: "ทำไมลูกค้าจะเลือกร้านเรา" }
      - { left: "แผนการดำเนินงาน", right: "ใช้วัตถุดิบ คน และขั้นตอนผลิตอย่างไร" }
      - { left: "แผนการเงิน", right: "ต้องลงทุนเท่าไร และเมื่อไรจะคุ้มทุน" }
      - { left: "ความเสี่ยงและแผนรองรับ", right: "ถ้ายอดขายต่ำกว่าคาดจะทำอย่างไร" }
    hints:
      - "แต่ละส่วนของแผนตอบคำถามหนึ่งข้อ"
      - "แผนการเงินเกี่ยวกับเงินลงทุน ยอดขาย ต้นทุน"
    solution: "ลูกค้าและตลาด → ใครจะซื้อ · คู่แข่งและความได้เปรียบ → ทำไมลูกค้าเลือกเรา · แผนการดำเนินงาน → ผลิตอย่างไร · แผนการเงิน → ลงทุนเท่าไร เมื่อไรคุ้มทุน · ความเสี่ยง → ถ้าไม่เป็นตามแผนทำอย่างไร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.business-plan.p003
    topics: [business.entrepreneurship.business-plan]
    difficulty: 2
    type: mcq
    stem: "ข้อใดบอก **ความสำคัญของการสร้างอาชีพของตนเอง** ได้ถูกต้อง (เลือกได้มากกว่าหนึ่งข้อ)"
    multiple: true
    choices:
      - { id: a, text: "มีรายได้และพึ่งพาตนเองได้", correct: true }
      - { id: b, text: "สร้างงานให้คนในชุมชน", correct: true }
      - { id: c, text: "นำวัตถุดิบหรือภูมิปัญญาท้องถิ่นมาเพิ่มมูลค่า", correct: true }
      - { id: d, text: "รับประกันว่าจะได้รายได้สูงกว่างานประจำเสมอ", feedback: "ธุรกิจมีความเสี่ยง บางเดือนอาจขาดทุน จึงต้องวางแผน" }
    hints:
      - "คิดถึงผลต่อตัวเอง ครอบครัว และชุมชน"
      - "มีข้อใดที่เป็นความเข้าใจผิดเกี่ยวกับการทำธุรกิจ"
    solution: "การสร้างอาชีพทำให้มีรายได้ พึ่งตนเองได้ สร้างงานให้ผู้อื่น และเพิ่มมูลค่าให้ทรัพยากรท้องถิ่น (ข้อ ก ข ค) แต่ธุรกิจมีความเสี่ยงเสมอ ไม่มีอาชีพใดรับประกันรายได้สูงแน่นอน (ข้อ ง)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.business-plan.p004
    topics: [business.entrepreneurship.business-plan]
    difficulty: 2
    type: numeric
    stem: "นัทจะเปิดร้านน้ำปั่นหน้าโรงเรียน ต้องซื้อรถเข็น $8{,}500$ บาท เครื่องปั่น $2{,}900$ บาท แก้วและวัตถุดิบล็อตแรก $1{,}600$ บาท และป้ายร้าน $1{,}000$ บาท เงินลงทุนเริ่มต้นรวมกี่บาท (ตอบเป็นบาท)"
    answer: { value: 14000, unit: "บาท" }
    hints:
      - "บวกทุกรายการที่ต้องจ่ายก่อนเปิดร้าน"
      - "รวมสี่จำนวน"
    misconceptions:
      - { match: 12400, feedback: "ลืมนับแก้วและวัตถุดิบล็อตแรก $1{,}600$ บาท ซึ่งต้องซื้อก่อนเปิดร้านเช่นกัน" }
      - { match: 13000, feedback: "ลืมนับป้ายร้าน $1{,}000$ บาท" }
    solution: "$8{,}500 + 2{,}900 + 1{,}600 + 1{,}000 = 14{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.business-plan.p005
    topics: [business.entrepreneurship.business-plan]
    difficulty: 2
    type: mcq
    stem: "ประเทศไทยมีผู้สูงอายุเพิ่มขึ้นเรื่อย ๆ ข้อใดเป็น **โอกาสทางธุรกิจ** ที่เกิดจากการเปลี่ยนแปลงนี้มากที่สุด"
    choices:
      - { id: a, text: "บริการรับส่งผู้สูงอายุไปโรงพยาบาลและอาหารเคี้ยวง่ายส่งถึงบ้าน", correct: true }
      - { id: b, text: "ร้านขายของเล่นเด็กเล็กแห่งใหม่", feedback: "สังคมสูงวัยมักมาพร้อมเด็กเกิดน้อยลง ตลาดนี้ไม่ได้โตจากการเปลี่ยนแปลงนี้" }
      - { id: c, text: "ร้านเกมออนไลน์สำหรับวัยรุ่น", feedback: "ไม่เกี่ยวกับการเพิ่มขึ้นของผู้สูงอายุ" }
      - { id: d, text: "โรงเรียนกวดวิชาสอบเข้า ม.1", feedback: "กลุ่มลูกค้าคือเด็ก ไม่ใช่กลุ่มที่เพิ่มขึ้น" }
    hints:
      - "โอกาสมาจากความต้องการใหม่ของคนกลุ่มที่เพิ่มขึ้น"
      - "ผู้สูงอายุต้องการสินค้าและบริการแบบใด"
    solution: "เมื่อผู้สูงอายุเพิ่มขึ้น ความต้องการบริการดูแลสุขภาพที่บ้านและอาหารสำหรับผู้สูงอายุเพิ่มขึ้น จึงเป็นโอกาส ส่วนตัวเลือกอื่นไม่เกี่ยวกับการเปลี่ยนแปลงนี้หรือสวนทางกับมัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.business-plan.p006
    topics: [business.entrepreneurship.business-plan]
    difficulty: 3
    type: numeric
    stem: "หมู่บ้านในอุดรธานีมี $400$ ครัวเรือน มิ้นท์จะขายน้ำพริกกระปุกละ $25$ บาท จากการสอบถาม คาดว่า $30\\%$ ของครัวเรือนจะซื้อเดือนละ $4$ กระปุก ยอดขายที่ประมาณได้ต่อเดือนเป็นกี่บาท (ตอบเป็นบาท)"
    answer: { value: 12000, unit: "บาท" }
    hints:
      - "จำนวนขาย $=$ ครัวเรือน $\\times$ สัดส่วนที่ซื้อ $\\times$ ความถี่"
      - "ยอดขาย $=$ จำนวนขาย $\\times$ ราคา"
    misconceptions:
      - { match: 40000, feedback: "คิดว่าทุกครัวเรือนจะซื้อ ต้องคูณสัดส่วน $30\\%$ ด้วย" }
      - { match: 3000, feedback: "ลืมคูณความถี่ $4$ กระปุกต่อเดือน" }
    solution: "จำนวนขาย $= 400 \\times 0.30 \\times 4 = 480$ กระปุก ยอดขาย $= 480 \\times 25 = 12{,}000$ บาทต่อเดือน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.business-plan.p007
    topics: [business.entrepreneurship.business-plan]
    difficulty: 3
    type: numeric
    stem: "จากข้อมูลในภาพ ร้านโรตีต้องขายเดือนละอย่างน้อยกี่ชิ้นจึงไม่ขาดทุน (ตอบเป็นชิ้น)"
    figure:
      src: roti-costs.svg
      alt: "ตารางแผนธุรกิจร้านโรตีกล้วยหอม (สมมติ) ราคาขาย 60 บาทต่อชิ้น วัตถุดิบ (แป้ง กล้วย ไข่ นมข้น) 30 บาทต่อชิ้น ถุงและกล่อง 6 บาทต่อชิ้น ค่าเช่าที่หน้าตลาด 6,000 บาทต่อเดือน ค่าไฟและแก๊สเหมาจ่าย 2,500 บาทต่อเดือน ค่าจ้างผู้ช่วย 3,500 บาทต่อเดือน ซื้อเตา กระทะ รถเข็นครั้งเดียว 30,000 บาท"
    answer: { value: 500, unit: "ชิ้น" }
    hints:
      - "แยกต้นทุนผันแปรต่อชิ้นกับต้นทุนคงที่ต่อเดือน เงินซื้ออุปกรณ์ครั้งเดียวไม่ใช่ต้นทุนรายเดือน"
      - "จุดคุ้มทุน $=$ ต้นทุนคงที่ $\\div$ (ราคา $-$ ต้นทุนผันแปรต่อชิ้น)"
    misconceptions:
      - { match: 1750, feedback: "นำเงินซื้ออุปกรณ์ $30{,}000$ บาทไปรวมเป็นต้นทุนคงที่รายเดือน แต่จ่ายครั้งเดียว" }
      - { match: 400, feedback: "ลืมค่าถุงและกล่อง $6$ บาท ต้นทุนผันแปรต้องเป็น $36$ บาท" }
    solution: "ต้นทุนผันแปร $30 + 6 = 36$ บาทต่อชิ้น กำไรส่วนเกิน $60 - 36 = 24$ บาท ต้นทุนคงที่ $6{,}000 + 2{,}500 + 3{,}500 = 12{,}000$ บาทต่อเดือน จุดคุ้มทุน $= 12{,}000 \\div 24 = 500$ ชิ้นต่อเดือน (เงินซื้ออุปกรณ์ $30{,}000$ บาทเป็นเงินลงทุนเริ่มต้น ใช้คิดระยะคืนทุน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.business-plan.p008
    topics: [business.entrepreneurship.business-plan]
    difficulty: 3
    type: numeric
    stem: "จากข้อมูลในภาพ ถ้าร้านโรตีขายได้เดือนละ $700$ ชิ้นตามแผน จะมีกำไรเดือนละกี่บาท (ตอบเป็นบาท)"
    figure:
      src: roti-costs.svg
      alt: "ตารางแผนธุรกิจร้านโรตีกล้วยหอม (สมมติ) ราคาขาย 60 บาทต่อชิ้น วัตถุดิบ (แป้ง กล้วย ไข่ นมข้น) 30 บาทต่อชิ้น ถุงและกล่อง 6 บาทต่อชิ้น ค่าเช่าที่หน้าตลาด 6,000 บาทต่อเดือน ค่าไฟและแก๊สเหมาจ่าย 2,500 บาทต่อเดือน ค่าจ้างผู้ช่วย 3,500 บาทต่อเดือน ซื้อเตา กระทะ รถเข็นครั้งเดียว 30,000 บาท"
    answer: { value: 4800, unit: "บาท" }
    hints:
      - "กำไร $=$ จำนวนขาย $\\times$ กำไรส่วนเกินต่อชิ้น $-$ ต้นทุนคงที่"
      - "กำไรส่วนเกินต่อชิ้น $= 60 - 30 - 6$"
    misconceptions:
      - { match: 16800, feedback: "นั่นคือกำไรส่วนเกินรวม ยังไม่ได้หักต้นทุนคงที่ $12{,}000$ บาท" }
      - { match: 9000, feedback: "ลืมค่าถุงและกล่อง $6$ บาทต่อชิ้น" }
    solution: "กำไรส่วนเกิน $24$ บาทต่อชิ้น กำไร $= 700 \\times 24 - 12{,}000 = 16{,}800 - 12{,}000 = 4{,}800$ บาทต่อเดือน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.business-plan.p009
    topics: [business.entrepreneurship.business-plan]
    difficulty: 3
    type: match
    stem: "จับคู่ธุรกิจกับแนวทางสร้างความได้เปรียบในการแข่งขัน"
    pairs:
      - { left: "ร้านผักซื้อตรงจากสวน ไม่ผ่านคนกลาง จึงขายถูกกว่าตลาด", right: "ต้นทุนต่ำ" }
      - { left: "ร้านกาแฟใช้แก้วย่อยสลายได้และพิมพ์ลายศิลปินท้องถิ่น", right: "ความแตกต่าง" }
      - { left: "ร้านเสื้อผ้าออนไลน์ขายเฉพาะไซซ์สำหรับคนตัวสูงมาก", right: "มุ่งกลุ่มเฉพาะ" }
    hints:
      - "ต้นทุนต่ำ ขายถูกกว่า · ความแตกต่าง มีสิ่งที่คนอื่นไม่มี · มุ่งกลุ่มเฉพาะ เจาะลูกค้ากลุ่มเล็ก"
      - "ดูว่าธุรกิจเน้นราคา จุดเด่น หรือกลุ่มลูกค้า"
    solution: "ซื้อผักตรงจากสวนจึงขายถูก → ต้นทุนต่ำ · กาแฟใส่แก้วย่อยสลายได้และลายศิลปินท้องถิ่น → ความแตกต่าง · ร้านเสื้อผ้าสำหรับคนตัวสูงเท่านั้น → มุ่งกลุ่มเฉพาะ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.business-plan.p010
    topics: [business.entrepreneurship.business-plan]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการเริ่มต้นธุรกิจอย่างมีระบบ"
    items:
      - "หาโอกาสจากปัญหาหรือความต้องการของลูกค้า"
      - "ศึกษาลูกค้าเป้าหมายและคู่แข่ง"
      - "เขียนแผนธุรกิจ"
      - "หาเงินทุนและเตรียมอุปกรณ์"
      - "เริ่มขายจริง"
      - "ประเมินผลแล้วปรับแผน"
    hints:
      - "ต้องรู้ว่ามีโอกาสและมีลูกค้าก่อนเขียนแผน"
      - "เมื่อเปิดแล้วยังต้องประเมินผล"
    solution: "หาโอกาสจากปัญหาของลูกค้า → ศึกษาตลาดและคู่แข่ง → เขียนแผนธุรกิจ → หาเงินทุนและเตรียมการ → เริ่มขาย → ประเมินผลและปรับปรุง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.business-plan.p011
    topics: [business.entrepreneurship.business-plan]
    difficulty: 4
    type: numeric
    stem: "จากข้อมูลในภาพ ถ้าร้านโรตีมีกำไรเดือนละ $4{,}800$ บาท ต้องใช้เวลากี่เดือนจึงได้เงินซื้ออุปกรณ์คืน (ตอบทศนิยม 2 ตำแหน่ง)"
    figure:
      src: roti-costs.svg
      alt: "ตารางแผนธุรกิจร้านโรตีกล้วยหอม (สมมติ) ราคาขาย 60 บาทต่อชิ้น วัตถุดิบ (แป้ง กล้วย ไข่ นมข้น) 30 บาทต่อชิ้น ถุงและกล่อง 6 บาทต่อชิ้น ค่าเช่าที่หน้าตลาด 6,000 บาทต่อเดือน ค่าไฟและแก๊สเหมาจ่าย 2,500 บาทต่อเดือน ค่าจ้างผู้ช่วย 3,500 บาทต่อเดือน ซื้อเตา กระทะ รถเข็นครั้งเดียว 30,000 บาท"
    answer: { value: 6.25, tolerance: 0.01, unit: "เดือน" }
    hints:
      - "ระยะคืนทุน $=$ เงินลงทุนเริ่มต้น $\\div$ กำไรต่อเดือน"
      - "เงินลงทุนเริ่มต้นคือเงินที่จ่ายครั้งเดียว"
    misconceptions:
      - { match: 2.5, feedback: "หารด้วยต้นทุนคงที่ $12{,}000$ บาท ต้องหารด้วยกำไรต่อเดือน" }
      - { match: 0.16, feedback: "หารกลับด้าน ต้องเป็นเงินลงทุน $\\div$ กำไรต่อเดือน" }
    solution: "ระยะคืนทุน $= 30{,}000 \\div 4{,}800 = 6.25$ เดือน หรือประมาณ $6$ เดือนครึ่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.business-plan.p012
    topics: [business.entrepreneurship.business-plan]
    difficulty: 4
    type: numeric
    stem: "ร้านโรตีในข้อมูลภาพเจอคู่แข่ง จึงลดราคาจาก $60$ เหลือ $55$ บาทต่อชิ้น ต้นทุนอื่นเท่าเดิม จุดคุ้มทุนใหม่เป็นเดือนละกี่ชิ้น (ปัดขึ้นเป็นจำนวนเต็ม)"
    figure:
      src: roti-costs.svg
      alt: "ตารางแผนธุรกิจร้านโรตีกล้วยหอม (สมมติ) ราคาขาย 60 บาทต่อชิ้น วัตถุดิบ (แป้ง กล้วย ไข่ นมข้น) 30 บาทต่อชิ้น ถุงและกล่อง 6 บาทต่อชิ้น ค่าเช่าที่หน้าตลาด 6,000 บาทต่อเดือน ค่าไฟและแก๊สเหมาจ่าย 2,500 บาทต่อเดือน ค่าจ้างผู้ช่วย 3,500 บาทต่อเดือน ซื้อเตา กระทะ รถเข็นครั้งเดียว 30,000 บาท"
    answer: { value: 632, unit: "ชิ้น" }
    hints:
      - "กำไรส่วนเกินใหม่ $= 55 - 36$"
      - "ปัดขึ้น เพราะขายน้อยกว่านั้นแม้ชิ้นเดียวก็ยังขาดทุน"
    misconceptions:
      - { match: 500, feedback: "นั่นคือจุดคุ้มทุนเดิมที่ราคา $60$ บาท" }
      - { match: 631, feedback: "ปัดลง ขาย $631$ ชิ้นยังขาดทุนเล็กน้อย ต้องปัดขึ้น" }
    solution: "กำไรส่วนเกินใหม่ $= 55 - 36 = 19$ บาท จุดคุ้มทุน $= 12{,}000 \\div 19 \\approx 631.58$ ปัดขึ้นเป็น $632$ ชิ้น ลดราคา $5$ บาทแต่ต้องขายเพิ่มจากเดิม $500$ ชิ้นอีก $132$ ชิ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.business-plan.p013
    topics: [business.entrepreneurship.business-plan]
    difficulty: 4
    type: mcq
    stem: "ร้านตัดเสื้อในตัวเมืองลำปาง (สมมติ) มีลูกค้าตัดชุดใหม่น้อยลง เพราะคนซื้อเสื้อผ้าสำเร็จรูปทางออนไลน์ ข้อใดเป็นการ **ปรับตัวต่อโอกาสในตลาด** ที่เหมาะสม (เลือกได้มากกว่าหนึ่งข้อ)"
    multiple: true
    choices:
      - { id: a, text: "รับแก้ทรงเสื้อผ้าที่ลูกค้าซื้อออนไลน์มาแล้วไม่พอดีตัว", correct: true }
      - { id: b, text: "ถ่ายรูปผลงานลงโซเชียล รับวัดตัวและนัดลองชุดผ่านแชต", correct: true }
      - { id: c, text: "รับตัดชุดยูนิฟอร์มให้ร้านอาหารและโรงแรมในจังหวัด", correct: true }
      - { id: d, text: "ขึ้นราคาค่าตัดเพื่อชดเชยลูกค้าที่หายไป โดยไม่เปลี่ยนอย่างอื่น", feedback: "ไม่ได้แก้ปัญหาที่ลูกค้าเปลี่ยนพฤติกรรม และอาจทำให้ลูกค้าน้อยลงอีก" }
    hints:
      - "คนซื้อเสื้อออนไลน์มากขึ้น แล้วเขามีปัญหาอะไรตามมา"
      - "ข้อใดไม่ได้ปรับตัวเลย"
    solution: "เสื้อที่ซื้อออนไลน์มักไม่พอดีตัว ร้านจึงรับแก้ทรง (ข้อ ก) ขายผ่านช่องทางออนไลน์เอง (ข้อ ข) และหาลูกค้ากลุ่มใหม่ที่ยังต้องตัดชุด (ข้อ ค) ส่วนข้อ ง ขึ้นราคาโดยไม่เพิ่มคุณค่า ลูกค้าจะยิ่งหนีไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.business-plan.p014
    topics: [business.entrepreneurship.business-plan]
    difficulty: 4
    type: match
    stem: "โฮมสเตย์ในน่าน (สมมติ) ทำ SWOT จับคู่ข้อมูลกับหมวด"
    pairs:
      - { left: "มีวิวนาข้าวสวยและอาหารพื้นบ้านที่แขกชอบ", right: "จุดแข็ง (S)" }
      - { left: "เจ้าของยังใช้แพลตฟอร์มจองที่พักออนไลน์ไม่เป็น", right: "จุดอ่อน (W)" }
      - { left: "นักท่องเที่ยวนิยมเที่ยวชุมชนและวิถีชีวิตท้องถิ่นมากขึ้น", right: "โอกาส (O)" }
      - { left: "มีโฮมสเตย์เปิดใหม่ในหมู่บ้านใกล้ ๆ หลายแห่ง", right: "อุปสรรค (T)" }
    hints:
      - "S และ W อยู่ภายในกิจการ O และ T มาจากภายนอก"
      - "ข้อดีภายใน = จุดแข็ง ข้อดีภายนอก = โอกาส"
    solution: "วิวนาข้าวและอาหารพื้นบ้าน → จุดแข็ง (ภายใน ดี) · เจ้าของยังใช้แพลตฟอร์มจองออนไลน์ไม่เป็น → จุดอ่อน (ภายใน ไม่ดี) · นักท่องเที่ยวนิยมเที่ยวชุมชนมากขึ้น → โอกาส (ภายนอก ดี) · มีโฮมสเตย์เปิดใหม่ใกล้ ๆ หลายแห่ง → อุปสรรค (ภายนอก ไม่ดี)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.business-plan.p015
    topics: [business.entrepreneurship.business-plan]
    difficulty: 5
    type: numeric
    stem: "ร้านโรตี (ราคา $60$ บาท ต้นทุนผันแปร $36$ บาทต่อชิ้น ค่าใช้จ่ายคงที่อื่นนอกจากค่าเช่าเดือนละ $6{,}000$ บาท) เลือกทำเลได้สองแห่ง ทำเล ก ค่าเช่าเดือนละ $15{,}000$ บาท คาดว่าขายได้ $900$ ชิ้น ทำเล ข ค่าเช่า $8{,}000$ บาท คาดว่าขายได้ $650$ ชิ้น ทำเลที่กำไรมากกว่าได้กำไรมากกว่าอีกทำเลกี่บาทต่อเดือน (ตอบเป็นบาท)"
    answer: { value: 1000, unit: "บาท" }
    hints:
      - "หากำไรของแต่ละทำเล: จำนวนขาย $\\times 24 -$ ค่าเช่า $- 6{,}000$"
      - "ขายได้มากกว่าไม่ได้แปลว่ากำไรมากกว่าเสมอ"
    misconceptions:
      - { match: 6000, feedback: "นั่นคือกำไรส่วนเกินที่ทำเล ก ได้เพิ่ม ($250 \\times 24$) ยังไม่ได้หักค่าเช่าที่แพงกว่า $7{,}000$ บาท" }
      - { match: 15000, feedback: "เทียบยอดขายเป็นเงิน ($250 \\times 60$) ซึ่งยังไม่ได้หักต้นทุนใด ๆ" }
    solution: "ทำเล ก: $900 \\times 24 - 15{,}000 - 6{,}000 = 600$ บาท ทำเล ข: $650 \\times 24 - 8{,}000 - 6{,}000 = 1{,}600$ บาท ทำเล ข กำไรมากกว่า $1{,}000$ บาทต่อเดือน เพราะยอดขายที่เพิ่ม $250$ ชิ้นให้กำไรส่วนเกินเพิ่มแค่ $6{,}000$ บาท แต่ค่าเช่าแพงขึ้น $7{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.business-plan.p016
    topics: [business.entrepreneurship.business-plan]
    difficulty: 5
    type: mcq
    stem: "แผนธุรกิจร้านขนมของนักเรียนกลุ่มหนึ่งเขียนว่า \"โรงเรียนมีนักเรียน 2,000 คน ทุกคนจะซื้อขนมเราวันละ 1 ชิ้น ราคาชิ้นละ 20 บาท ต้นทุนวัตถุดิบชิ้นละ 8 บาท จึงมีกำไรวันละ 24,000 บาท\" ข้อใดเป็น **คำวิจารณ์ที่สมเหตุสมผล** (เลือกได้มากกว่าหนึ่งข้อ)"
    multiple: true
    choices:
      - { id: a, text: "สมมติว่านักเรียนทุกคนซื้อทุกวันสูงเกินจริง ควรสำรวจหรือทดลองขายก่อน", correct: true }
      - { id: b, text: "ยังไม่ได้หักต้นทุนอื่น เช่น ถุง ค่าแรง ค่าเช่าโต๊ะ", correct: true }
      - { id: c, text: "ไม่ได้กล่าวถึงร้านค้าเดิมในโรงเรียนที่เป็นคู่แข่ง", correct: true }
      - { id: d, text: "คูณเลขผิด กำไรควรเป็น 40,000 บาท", feedback: "$2{,}000 \\times (20 - 8) = 24{,}000$ ถูกแล้ว ส่วน $40{,}000$ คือยอดขายซึ่งยังไม่หักต้นทุน" }
    hints:
      - "ตรวจทั้งสมมติฐานยอดขายและต้นทุนที่ใช้"
      - "กำไรต้องหักต้นทุนอะไรอีกนอกจากวัตถุดิบ"
    solution: "ข้อ ก ข และ ค สมเหตุสมผล สมมติว่าทุกคนซื้อทุกวันสูงเกินจริง ยังไม่ได้หักบรรจุภัณฑ์ ค่าแรง และต้นทุนคงที่ และไม่ได้คิดถึงคู่แข่ง ข้อ ง ผิด เพราะการคำนวณ $2{,}000 \\times 12 = 24{,}000$ ถูกต้องตามสมมติฐานที่เขียน ปัญหาอยู่ที่สมมติฐาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.entrepreneurship.business-plan.p017
    topics: [business.entrepreneurship.business-plan]
    difficulty: 5
    type: numeric
    stem: "ร้านกาแฟเปิดใหม่ในอำเภอหนึ่ง (สมมติ) ประมาณว่าทั้งอำเภอมียอดขายกาแฟรวมเดือนละ $2{,}000{,}000$ บาท ร้านคาดว่าจะได้ส่วนแบ่งตลาด $3\\%$ กำไรขั้นต้นเป็น $40\\%$ ของยอดขาย และมีต้นทุนคงที่เดือนละ $18{,}000$ บาท ร้านจะมีกำไรเดือนละกี่บาท (ตอบเป็นบาท)"
    answer: { value: 6000, unit: "บาท" }
    hints:
      - "ยอดขายของร้าน $=$ ตลาดรวม $\\times$ ส่วนแบ่งตลาด"
      - "กำไร $=$ ยอดขาย $\\times 40\\% -$ ต้นทุนคงที่"
    misconceptions:
      - { match: 24000, feedback: "นั่นคือกำไรขั้นต้น ยังไม่ได้หักต้นทุนคงที่" }
      - { match: 42000, feedback: "หักต้นทุนคงที่จากยอดขาย แต่ยังไม่ได้หักต้นทุนสินค้า ต้องใช้กำไรขั้นต้น $40\\%$" }
    solution: "ยอดขาย $= 2{,}000{,}000 \\times 0.03 = 60{,}000$ บาท กำไรขั้นต้น $= 60{,}000 \\times 0.40 = 24{,}000$ บาท กำไร $= 24{,}000 - 18{,}000 = 6{,}000$ บาทต่อเดือน"
    license: CC-BY-SA-4.0
    ai_assisted: true
