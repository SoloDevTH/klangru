<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="sans-serif" font-size="16">
  <title>การสร้างเส้นแบ่งครึ่งมุม</title>
  <rect x="0" y="0" width="720" height="330" fill="#ffffff"/>
  <line x1="90.0" y1="270.0" x2="450.0" y2="270.0" stroke="#15211e" stroke-width="3" stroke-linecap="round"/>
  <line x1="90.0" y1="270.0" x2="213.1" y2="-68.3" stroke="#15211e" stroke-width="3" stroke-linecap="round"/>
  <path d="M 238.5 290.9 A 150.0 150.0 0 0 0 121.2 123.3" fill="none" stroke="#1d4ed8" stroke-width="1.8"/>
  <path d="M 289.2 160.5 A 120.0 120.0 0 0 0 227.9 150.6" fill="none" stroke="#c2410c" stroke-width="1.8"/>
  <path d="M 249.3 181.3 A 120.0 120.0 0 0 0 261.0 120.3" fill="none" stroke="#c2410c" stroke-width="1.8"/>
  <line x1="90.0" y1="270.0" x2="335.3" y2="98.2" stroke="#0a6b60" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="90.0" cy="270.0" r="4.5" fill="#15211e" stroke="#15211e" stroke-width="1"/>
  <circle cx="240.0" cy="270.0" r="4.5" fill="#15211e" stroke="#15211e" stroke-width="1"/>
  <circle cx="141.3" cy="129.0" r="4.5" fill="#15211e" stroke="#15211e" stroke-width="1"/>
  <circle cx="259.2" cy="151.5" r="4.5" fill="#15211e" stroke="#15211e" stroke-width="1"/>
  <text x="76.0" y="278.0" font-size="17" text-anchor="middle" fill="#15211e" font-weight="bold">O</text>
  <text x="244.0" y="294.0" font-size="17" text-anchor="middle" fill="#15211e" font-weight="bold">A</text>
  <text x="123.3" y="129.0" font-size="17" text-anchor="middle" fill="#15211e" font-weight="bold">B</text>
  <text x="273.2" y="145.5" font-size="17" text-anchor="middle" fill="#15211e" font-weight="bold">C</text>
  <text x="420.0" y="60.0" font-size="15" text-anchor="start" fill="#15211e">1. ส่วนโค้งจาก O ตัดแขนของมุมที่ A และ B</text>
  <text x="420.0" y="94.0" font-size="15" text-anchor="start" fill="#15211e">2. จาก A และ B เขียนส่วนโค้ง</text>
  <text x="420.0" y="128.0" font-size="15" text-anchor="start" fill="#15211e">    รัศมีเท่ากัน ตัดกันที่ C</text>
  <text x="420.0" y="162.0" font-size="15" text-anchor="start" fill="#15211e">3. ลากรังสี OC</text>
  <text x="420.0" y="196.0" font-size="15" text-anchor="start" fill="#0a6b60" font-weight="bold">มุม AOC = มุม COB</text>
</svg>
