problems:
- id: thai.literature.lessons-from-reading.p001
  topics:
  - thai.literature.lessons-from-reading
  difficulty: 1
  type: mcq
  stem: 'นิทานอีสป (เล่าใหม่): "เด็กเลี้ยงแกะตะโกนว่า หมาป่ามา! เพื่อแกล้งชาวบ้านหลายครั้ง ชาวบ้านวิ่งมาช่วยแต่ไม่พบหมาป่า วันหนึ่งหมาป่ามาจริง เด็กตะโกนขอให้ช่วย แต่ไม่มีใครมา เพราะไม่มีใครเชื่ออีกแล้ว" ข้อใดเป็น **ข้อคิด** ของเรื่อง'
  choices:
  - id: a
    text: ถ้าโกหกบ่อย ๆ เวลาพูดจริงก็ไม่มีใครเชื่อ
    correct: true
    feedback: ถูก สรุปจากผลที่เกิดกับเด็กเลี้ยงแกะ
  - id: b
    text: หมาป่ามาจริงในวันสุดท้าย
    feedback: เป็นเหตุการณ์ในเรื่อง ไม่ใช่ข้อคิด
  - id: c
    text: ควรเลี้ยงแกะให้ดี
    feedback: ไม่ใช่ประเด็นของเรื่อง
  - id: d
    text: ชาวบ้านวิ่งมาช่วยหลายครั้ง
    feedback: เป็นเหตุการณ์ในเรื่อง
  hints:
  - ข้อคิดเป็นสิ่งที่นำไปใช้ได้ ไม่ใช่เหตุการณ์
  - ทำไมตอนจบจึงไม่มีใครมาช่วย
  solution: 'ข้อคิด: **ถ้าโกหกบ่อย คนจะไม่เชื่อแม้เราพูดความจริง**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.lessons-from-reading.p002
  topics:
  - thai.literature.lessons-from-reading
  difficulty: 1
  type: match
  stem: จับคู่นิทานกับข้อคิด
  pairs:
  - left: ราชสีห์กับหนู
    right: อย่าดูถูกผู้ที่เล็กกว่า
  - left: เด็กเลี้ยงแกะ
    right: ไม่ควรโกหก
  - left: กากับเหยือกน้ำ
    right: ความพยายามและไหวพริบช่วยแก้ปัญหา
  hints:
  - นึกถึงตอนจบของแต่ละเรื่อง
  - ตัวละครได้ผลดีหรือผลร้ายเพราะอะไร
  solution: ราชสีห์กับหนู = อย่าดูถูกผู้อื่น · เด็กเลี้ยงแกะ = ไม่ควรโกหก · กากับเหยือกน้ำ = ความพยายามและไหวพริบ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.lessons-from-reading.p003
  topics:
  - thai.literature.lessons-from-reading
  difficulty: 2
  type: mcq
  stem: 'นิทานอีสป (เล่าใหม่): "กากระหายน้ำ พบเหยือกที่มีน้ำอยู่ก้นเหยือก ปากกาลงไปไม่ถึง กาจึงคาบก้อนกรวดมาใส่ทีละก้อน น้ำค่อย ๆ สูงขึ้นจนกาดื่มได้" ข้อคิดใดตรงกับเรื่องที่สุด'
  choices:
  - id: a
    text: เมื่อเจอปัญหา ใช้ความคิดและความพยายามหาทางแก้
    correct: true
    feedback: ถูก กาคิดวิธีใส่กรวดและทำทีละก้อนจนสำเร็จ
  - id: b
    text: ไม่ควรดื่มน้ำจากเหยือก
    feedback: ไม่ได้มาจากเรื่อง
  - id: c
    text: กาเป็นนกที่ฉลาดที่สุด
    feedback: เป็นความเห็นเรื่องนก ไม่ใช่ข้อคิดที่ใช้กับคน
  - id: d
    text: ก้อนกรวดทำให้น้ำสะอาด
    feedback: เรื่องไม่ได้พูดถึงความสะอาด
  hints:
  - กาแก้ปัญหาอย่างไร
  - ใส่กรวดทีละก้อนแสดงลักษณะนิสัยใด
  solution: 'ข้อคิด: **ใช้ความคิดและความพยายามแก้ปัญหา**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.lessons-from-reading.p004
  topics:
  - thai.literature.lessons-from-reading
  difficulty: 2
  type: mcq
  stem: อ่านเรื่องในภาพ ข้อใดเป็น **เหตุการณ์** ไม่ใช่ข้อคิด
  figure: &id001
    src: class-plant.svg
    alt: เรื่องสั้นสมมุติ ต้นไม้ของห้อง ป.5/1 มี 5 ประโยค (1) โบรับหน้าที่รดน้ำต้นไม้หน้าห้องทุกเย็น (2) สัปดาห์หนึ่ง เพื่อนชวนไปเตะฟุตบอลหลังเลิกเรียน โบรีบไปเล่นจนลืมรดน้ำสามวัน (3) วันที่สี่ ใบไม้เหี่ยวตก โบรู้สึกผิด จึงไปบอกครูตามตรงและขอโทษเพื่อนในห้อง (4) โบทำป้ายเตือนติดประตูห้อง และรดน้ำให้เสร็จก่อนไปเล่นทุกวัน (5) สองสัปดาห์ต่อมา ต้นไม้แตกใบใหม่ ครูชมว่าโบกล้ายอมรับและแก้ไข
  choices:
  - id: a
    text: โบลืมรดน้ำต้นไม้สามวัน
    correct: true
    feedback: ถูก เป็นสิ่งที่เกิดขึ้นในเรื่อง
  - id: b
    text: ควรทำหน้าที่ให้เสร็จก่อนไปเล่น
    feedback: เป็นข้อคิด
  - id: c
    text: เมื่อทำผิดควรยอมรับและแก้ไข
    feedback: เป็นข้อคิด
  - id: d
    text: ความรับผิดชอบทำให้งานสำเร็จ
    feedback: เป็นข้อคิด
  hints:
  - เหตุการณ์บอกว่าเกิดอะไรกับตัวละคร
  - ข้อคิดใช้ได้กับคนทั่วไป มักมีคำว่า ควร
  solution: '**โบลืมรดน้ำสามวัน** เป็นเหตุการณ์ ข้ออื่นเป็นข้อคิด'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.lessons-from-reading.p005
  topics:
  - thai.literature.lessons-from-reading
  difficulty: 2
  type: order
  stem: เรียงขั้นการหาข้อคิดจากเรื่องที่อ่าน
  items:
  - ดูว่าตัวละครทำอะไร
  - ดูผลที่เกิดขึ้น
  - หาเหตุว่าทำไมจึงเกิดผลนั้น
  - สรุปเป็นข้อคิดที่ใช้ได้กับคนทั่วไป
  - บอกว่าจะนำไปใช้ในชีวิตอย่างไร
  hints:
  - เริ่มจากสิ่งที่อยู่ในเรื่อง
  - จบที่ชีวิตของเรา
  solution: การกระทำ → ผล → เหตุ → ข้อคิด → นำไปใช้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.lessons-from-reading.p006
  topics:
  - thai.literature.lessons-from-reading
  difficulty: 3
  type: mcq
  stem: อ่านเรื่องในภาพ ประโยคที่ (3) และ (5) ให้ข้อคิดข้อใด
  figure: *id001
  choices:
  - id: a
    text: เมื่อทำผิด ควรยอมรับตามตรงและแก้ไข
    correct: true
    feedback: ถูก โบบอกครูตามตรง แก้ไข และได้รับคำชม
  - id: b
    text: ไม่ควรเล่นฟุตบอล
    feedback: เรื่องไม่ได้ห้ามเล่น แต่ให้ทำหน้าที่ก่อน
  - id: c
    text: ต้นไม้ต้องรดน้ำทุกวัน
    feedback: เป็นความรู้ ไม่ใช่ข้อคิดของประโยค 3 และ 5
  - id: d
    text: ควรปิดบังความผิดไม่ให้ครูรู้
    feedback: ขัดกับเรื่อง
  hints:
  - ประโยค (3) โบทำอะไรหลังรู้ว่าผิด
  - ประโยค (5) ครูชมเรื่องอะไร
  solution: 'ข้อคิด: **ทำผิดแล้วยอมรับและแก้ไข** ได้ผลดีกว่าการปิดบัง'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.lessons-from-reading.p007
  topics:
  - thai.literature.lessons-from-reading
  difficulty: 3
  type: mcq
  stem: ข้อคิดใด **กว้างเกินไป** จนไม่บอกอะไรเกี่ยวกับนิทานราชสีห์กับหนู
  choices:
  - id: a
    text: ควรเป็นคนดี
    correct: true
    feedback: ถูก ใช้ได้กับทุกเรื่อง ไม่ชี้ไปที่ประเด็นของนิทาน
  - id: b
    text: อย่าดูถูกผู้ที่ตัวเล็กกว่า
    feedback: ตรงประเด็นของเรื่อง
  - id: c
    text: ความเมตตามักได้รับการตอบแทน
    feedback: ตรงประเด็นของเรื่อง
  - id: d
    text: ควรรักษาสัญญาที่ให้ไว้
    feedback: มีหลักฐานจากหนูที่กลับมาช่วย
  hints:
  - ข้อคิดที่ดีต้องมาจากเรื่องจริง ๆ
  - ข้อใดเอาไปใช้กับนิทานเรื่องไหนก็ได้
  solution: '**ควรเป็นคนดี** กว้างเกินไป ไม่ชี้ว่าเรื่องนี้สอนอะไร'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.lessons-from-reading.p008
  topics:
  - thai.literature.lessons-from-reading
  difficulty: 3
  type: mcq
  stem: ข้อคิดใด **ไม่ได้มาจาก** เรื่องเด็กเลี้ยงแกะ หรือขัดกับเรื่อง
  choices:
  - id: a
    text: อย่าช่วยคนที่ร้องขอความช่วยเหลือ
    correct: true
    feedback: ถูก เรื่องไม่ได้สอนอย่างนั้น ปัญหาอยู่ที่การโกหก ไม่ใช่การช่วยเหลือ
  - id: b
    text: ความน่าเชื่อถือสร้างยาก แต่เสียได้ง่าย
    feedback: มาจากเรื่อง
  - id: c
    text: ไม่ควรล้อเล่นเรื่องอันตราย
    feedback: มาจากเรื่อง
  - id: d
    text: การโกหกส่งผลร้ายกับตัวเอง
    feedback: มาจากเรื่อง
  hints:
  - ตัวละครใดทำผิดในเรื่อง
  - ข้อใดเปลี่ยนความผิดไปเป็นของชาวบ้าน
  solution: '**อย่าช่วยคนที่ร้องขอ** ไม่ได้มาจากเรื่อง เรื่องสอนว่าไม่ควรโกหก'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.lessons-from-reading.p009
  topics:
  - thai.literature.lessons-from-reading
  difficulty: 3
  type: mcq
  stem: ร้อยกรอง "อันอ้อยตาลหวานลิ้นแล้วสิ้นซาก / แต่ลมปากหวานหูไม่รู้หาย / แม้นเจ็บอื่นหมื่นแสนจะแคลนคลาย / เจ็บจนตายนั้นเพราะเหน็บให้เจ็บใจ" (สุนทรภู่ เพลงยาวถวายโอวาท) คำว่า **เหน็บ** ในบทนี้หมายความว่าอย่างไร
  choices:
  - id: a
    text: พูดเสียดสี กระทบให้เจ็บใจ
    correct: true
    feedback: ถูก ตามพจนานุกรม เหน็บ ๓ = พูดเสียดสีแคะไค้
  - id: b
    text: อาการชาที่แขนขา
    feedback: เป็นอีกความหมาย ไม่เข้ากับ ให้เจ็บใจ
  - id: c
    text: เสียบไว้ที่เอว
    feedback: เป็นอีกความหมาย ไม่เข้ากับบริบท
  - id: d
    text: มีดขนาดกลาง
    feedback: เป็นคำนาม ไม่เข้ากับบริบท
  hints:
  - ดูคำรอบข้าง เหน็บ ให้ เจ็บใจ
  - บทนี้พูดถึงลมปากหรือคำพูด
  solution: '**เหน็บ** = พูดเสียดสี ทำให้ผู้ฟังเจ็บใจ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.lessons-from-reading.p010
  topics:
  - thai.literature.lessons-from-reading
  difficulty: 4
  type: mcq
  stem: ร้อยกรอง "อันอ้อยตาลหวานลิ้นแล้วสิ้นซาก / แต่ลมปากหวานหูไม่รู้หาย / แม้นเจ็บอื่นหมื่นแสนจะแคลนคลาย / เจ็บจนตายนั้นเพราะเหน็บให้เจ็บใจ" (สุนทรภู่ เพลงยาวถวายโอวาท) ข้อคิดของบทนี้คือข้อใด
  choices:
  - id: a
    text: คำพูดมีผลต่อใจคนนาน ควรพูดดีและไม่พูดเสียดสี
    correct: true
    feedback: ถูก ความหวานของอาหารหายไป แต่คำพูดอยู่ในใจไม่รู้ลืม
  - id: b
    text: ไม่ควรกินอ้อยและน้ำตาลมาก
    feedback: ตีความตามตัวอักษร อ้อยตาลเป็นเพียงสิ่งที่ใช้เปรียบ
  - id: c
    text: ความเจ็บป่วยทุกชนิดหายได้
    feedback: บทบอกว่าเจ็บใจจากคำเสียดสีไม่หาย
  - id: d
    text: ควรพูดหวานเพื่อให้คนชอบแม้ไม่จริงใจ
    feedback: บทไม่ได้สอนให้ประจบ
  hints:
  - ถอดความทีละวรรคก่อน
  - อ้อยตาลใช้เปรียบกับอะไร
  solution: 'ถอดความ: ความหวานของอ้อยตาลหายไป แต่คำพูดดีจำไม่ลืม คำเหน็บทำให้เจ็บใจไปตลอด ข้อคิด: **คำพูดมีผลยาวนาน ควรพูดดี ไม่เสียดสี**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.lessons-from-reading.p011
  topics:
  - thai.literature.lessons-from-reading
  difficulty: 4
  type: mcq
  stem: นำข้อคิดจากเรื่องในภาพไปใช้ในชีวิต ข้อใด **เจาะจงและตรงข้อคิด** ที่สุด
  figure: *id001
  choices:
  - id: a
    text: ฉันเป็นเวรทำความสะอาดห้องวันพุธ จะตั้งปลุกในโทรศัพท์ และทำให้เสร็จก่อนไปซ้อมดนตรี
    correct: true
    feedback: ถูก บอกสถานการณ์และการกระทำ ตรงกับข้อคิดเรื่องทำหน้าที่ก่อนเล่น
  - id: b
    text: ฉันจะเป็นคนดี
    feedback: กว้างเกินไป ไม่บอกว่าจะทำอะไร
  - id: c
    text: ฉันจะปลูกต้นไม้ที่บ้าน
    feedback: ไม่ได้ใช้ข้อคิดเรื่องความรับผิดชอบ
  - id: d
    text: ฉันจะไม่เล่นกีฬาอีกเลย
    feedback: เกินจากข้อคิด เรื่องไม่ได้ห้ามเล่น
  hints:
  - การนำไปใช้ที่ดีบอกสถานการณ์และสิ่งที่จะทำ
  - ข้อคิดของเรื่องคือทำหน้าที่ให้เสร็จก่อน
  solution: ข้อแรก **เจาะจง** (เวรวันพุธ ตั้งปลุก ทำก่อนซ้อม) และ **ตรงข้อคิด**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.lessons-from-reading.p012
  topics:
  - thai.literature.lessons-from-reading
  difficulty: 4
  type: match
  stem: จับคู่ข้อคิดกับการนำไปใช้ในชีวิตที่ตรงที่สุด
  pairs:
  - left: อย่าดูถูกผู้อื่น
    right: ชวนเพื่อนใหม่ที่ยังเล่นไม่เก่งเข้าทีม
  - left: ไม่ควรโกหก
    right: บอกแม่ตามจริงว่าทำแก้วแตก
  - left: คำพูดเสียดสีทำร้ายใจ
