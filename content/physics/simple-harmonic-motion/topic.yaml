id: physics.waves.shm
subject: physics
title: { th: การเคลื่อนที่แบบฮาร์มอนิกอย่างง่าย, en: Simple harmonic motion }
summary: การแกว่งกลับไปกลับมาเมื่อแรงดึงกลับแปรผันตรงกับการกระจัด คาบของมวลติดสปริงและลูกตุ้มอย่างง่าย อัตราเร็วและความเร่งสูงสุด
difficulty: 6.5
minutes: 40
prerequisites: [physics.waves.wave-basics, physics.dynamics.newton-second, math.geometry.trig-ratios]
encompasses:
  - { id: physics.waves.wave-basics, weight: 0.2 }
  - { id: physics.dynamics.newton-second, weight: 0.3 }
  - { id: math.geometry.trig-ratios, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: shm-graphs.svg
    alt: "กราฟสามกราฟเรียงจากบนลงล่าง แกนนอนคือเวลา 0 ถึง 4 วินาที กราฟบนคือการกระจัด x เริ่มที่ 0.1 m เป็นรูปโคไซน์ แอมพลิจูด 0.1 m คาบ 2.0 s กราฟกลางคือความเร็ว v เริ่มที่ศูนย์ ค่าสูงสุด 0.314 m/s กราฟล่างคือความเร่ง a เริ่มที่ −0.987 m/s² เป็นกราฟกลับหัวของการกระจัด เส้นประแนวตั้งที่ t = 0.5 s (ผ่านตำแหน่งสมดุล) ตัดกราฟ x และ a ที่ศูนย์ และ v มีขนาดมากที่สุด เส้นประที่ t = 1 s (ที่ปลาย) x เป็น −0.1 m v เป็นศูนย์ และ a มีค่ามากที่สุด"
    caption: "คาบเท่ากันทั้งสามกราฟ ความเร็วสูงสุดเมื่อผ่านตำแหน่งสมดุล ส่วนความเร่งมากที่สุดที่ปลายและมีทิศตรงข้ามกับการกระจัด"
  - type: worked-example
    title: อ่านแอมพลิจูดและคาบจากกราฟ
    problem: "จากกราฟการกระจัดกับเวลาด้านบน จงหาแอมพลิจูด คาบ ความถี่ อัตราเร็วสูงสุด และขนาดความเร่งสูงสุดของวัตถุ"
    steps:
      - text: "แอมพลิจูดคือการกระจัดมากที่สุดจากศูนย์: $A = 0.10\\ \\mathrm{m}$"
        why: "วัดจากตำแหน่งสมดุลถึงยอด ไม่ใช่จากยอดล่างถึงยอดบน (ซึ่งเป็น $0.20\\ \\mathrm{m}$)"
      - text: "คาบคือเวลาจากยอดหนึ่งถึงยอดถัดไป: กราฟสูงสุดที่ $t = 0$ และ $t = 2.0\\ \\mathrm{s}$ จึงได้ $T = 2.0\\ \\mathrm{s}$"
      - text: "ความถี่และความถี่เชิงมุม: $f = \\dfrac{1}{T} = 0.5\\ \\mathrm{Hz}$ และ $\\omega = \\dfrac{2\\pi}{T} = \\pi \\approx 3.14\\ \\mathrm{rad/s}$"
      - text: "อัตราเร็วสูงสุด: $v_{\\max} = \\omega A = (3.14)(0.10) \\approx 0.314\\ \\mathrm{m/s}$"
      - text: "ความเร่งสูงสุด: $a_{\\max} = \\omega^2 A = (3.14)^2(0.10) \\approx 0.987\\ \\mathrm{m/s^2}$"
        why: "ค่าทั้งสองตรงกับยอดของกราฟความเร็วและกราฟความเร่ง ใช้ตรวจคำตอบได้"
    answer: "$A = 0.10\\ \\mathrm{m}$, $T = 2.0\\ \\mathrm{s}$, $f = 0.5\\ \\mathrm{Hz}$, $v_{\\max} \\approx 0.314\\ \\mathrm{m/s}$, $a_{\\max} \\approx 0.987\\ \\mathrm{m/s^2}$"
  - { type: check, problem: phy.shm.p012 }
  - type: figure
    src: pendulum-forces.svg
    alt: "ลูกตุ้มแขวนด้วยเชือกยาว L เบนออกจากแนวดิ่งเป็นมุม theta น้ำหนัก mg ชี้ลง แยกเป็นองค์ประกอบ mg cos theta ตามแนวเชือกออกจากจุดแขวน และ mg sin theta ตั้งฉากกับเชือกชี้กลับเข้าหาแนวดิ่ง เป็นแรงดึงกลับ แรงตึงเชือก T ชี้เข้าหาจุดแขวน ความยาวลูกศรเป็นสัดส่วนกับขนาดแรงเมื่อ theta = 20 องศา"
    caption: "แรงดึงกลับของลูกตุ้มคือ $mg\\sin\\theta$ เมื่อมุมเล็กมีค่าประมาณ $\\dfrac{mg}{L}x$ จึงเป็นการเคลื่อนที่แบบฮาร์มอนิกอย่างง่าย"
  - type: worked-example
    title: อัตราเร็วของก้อนมวลที่ตำแหน่งใด ๆ
    problem: "ก้อนมวล $0.2\\ \\mathrm{kg}$ ติดสปริง $k = 80\\ \\mathrm{N/m}$ บนพื้นลื่น สั่นด้วยแอมพลิจูด $0.10\\ \\mathrm{m}$ ขณะที่ก้อนมวลอยู่ห่างตำแหน่งสมดุล $0.06\\ \\mathrm{m}$ มีอัตราเร็วเท่าใด"
    steps:
      - text: "พลังงานกลทั้งหมดเท่ากับพลังงานศักย์ที่ปลาย: $E = \\tfrac{1}{2}kA^2 = \\tfrac{1}{2}(80)(0.10)^2 = 0.40\\ \\mathrm{J}$"
        why: "ที่ปลายก้อนมวลหยุดนิ่งชั่วขณะ พลังงานทั้งหมดจึงอยู่ในสปริง"
      - text: "พลังงานศักย์ที่ $x = 0.06\\ \\mathrm{m}$: $\\tfrac{1}{2}(80)(0.06)^2 = 0.144\\ \\mathrm{J}$"
      - text: "พลังงานจลน์ที่เหลือ: $0.40 - 0.144 = 0.256\\ \\mathrm{J}$"
        why: "ไม่มีแรงเสียดทาน พลังงานกลจึงคงตัว"
      - text: "หาอัตราเร็ว: $\\tfrac{1}{2}(0.2)v^2 = 0.256$ ได้ $v^2 = 2.56$ และ $v = 1.6\\ \\mathrm{m/s}$"
      - text: "ตรวจด้วยสูตร: $\\omega = \\sqrt{\\tfrac{80}{0.2}} = 20\\ \\mathrm{rad/s}$ และ $v = \\omega\\sqrt{A^2 - x^2} = 20\\sqrt{0.01 - 0.0036} = 20(0.08) = 1.6\\ \\mathrm{m/s}$ ✓"
    answer: "$1.6\\ \\mathrm{m/s}$ (อัตราเร็วสูงสุดที่ตำแหน่งสมดุลคือ $\\omega A = 2.0\\ \\mathrm{m/s}$)"
  - { type: check, problem: phy.shm.p020, prompt: "การสั่นพ้องเกิดเมื่อใด" }
  - type: interactive
    title: กราฟตำแหน่งกับเวลาของการแกว่ง
    caption: แกนนอนคือเวลา (วินาที) แกนตั้งคือการกระจัด x = A cos(2πt/T) ลองเปลี่ยนแอมพลิจูด A แล้วสังเกตว่าเวลาครบรอบไม่เปลี่ยน จากนั้นเปลี่ยนคาบ T แล้วดูว่ากราฟยืดหรือหดในแนวนอน
    widget:
      kind: function-plot
      functions: ["A\\cos\\left(\\frac{2\\pi x}{T}\\right)"]
      sliders:
        - { name: A, min: 0.5, max: 3, step: 0.5, value: 2, label: แอมพลิจูด }
        - { name: T, min: 0.5, max: 4, step: 0.5, value: 2, label: คาบ (s) }
      x: [0, 8]
      y: [-3.5, 3.5]
  - type: simulation
    title: ห้องทดลองลูกตุ้ม (PhET Pendulum Lab)
    url: https://phet.colorado.edu/en/simulations/pendulum-lab
    provider: phet
    note: เปิดตัวจับเวลาแล้ววัดคาบ ลองเปลี่ยนมวลลูกตุ้ม (คาบแทบไม่เปลี่ยน) แล้วลองเพิ่มความยาวเป็น 4 เท่า (คาบเพิ่มเป็น 2 เท่า) ในซิมกำหนดแรงโน้มถ่วงโลกเป็น 9.81 m/s²
  - type: simulation
    title: มวลและสปริง (PhET Masses and Springs)
    url: https://phet.colorado.edu/en/simulations/masses-and-springs
    provider: phet
    note: แขวนมวลต่าง ๆ กับสปริงแล้วจับเวลาการสั่น 10 รอบ เปรียบเทียบกับ T = 2π√(m/k) และสังเกตว่าสปริงที่แข็งกว่าสั่นเร็วกว่า
glossary:
  - { term: การเคลื่อนที่แบบฮาร์มอนิกอย่างง่าย, definition: "การเคลื่อนที่กลับไปกลับมารอบตำแหน่งสมดุล โดยแรงดึงกลับแปรผันตรงกับการกระจัดและมีทิศตรงข้ามกับการกระจัด" }
  - { term: แอมพลิจูด, definition: "การกระจัดมากที่สุดของวัตถุที่แกว่ง วัดจากตำแหน่งสมดุล" }
  - { term: คาบ, definition: "เวลาที่ใช้ในการแกว่งครบ 1 รอบ มีหน่วยวินาที เป็นส่วนกลับของความถี่ $T = \\tfrac{1}{f}$" }
  - { term: ค่านิจสปริง, definition: "ค่าที่บอกความแข็งของสปริง คือแรงที่ต้องใช้ต่อระยะยืด 1 เมตร มีหน่วย $\\mathrm{N/m}$" }
flashcards:
  - { front: "เงื่อนไขของการเคลื่อนที่แบบฮาร์มอนิกอย่างง่าย", back: "แรงดึงกลับแปรผันตรงกับการกระจัดและมีทิศตรงข้าม เช่น $F = -kx$" }
  - { front: "คาบของมวลติดสปริง", back: "$T = 2\\pi\\sqrt{\\dfrac{m}{k}}$ ไม่ขึ้นกับแอมพลิจูด" }
  - { front: "คาบของลูกตุ้มอย่างง่าย (มุมเล็ก)", back: "$T = 2\\pi\\sqrt{\\dfrac{L}{g}}$ ไม่ขึ้นกับมวลและแอมพลิจูด" }
  - { front: "ที่ตำแหน่งสมดุลและที่ปลาย อัตราเร็วและความเร่งเป็นอย่างไร", back: "ตำแหน่งสมดุล: อัตราเร็วมากสุด $\\omega A$ ความเร่งเป็นศูนย์ · ปลาย: อัตราเร็วเป็นศูนย์ ความเร่งมากสุด $\\omega^2 A$" }
  - { front: "ลูกตุ้มยาว 1 m มีคาบเท่าใด ($g = 9.8\\ \\mathrm{m/s^2}$)", back: "$T = 2\\pi\\sqrt{\\tfrac{1}{9.8}} \\approx 2.01\\ \\mathrm{s}$" }
