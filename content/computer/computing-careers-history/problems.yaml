problems:
  - id: computer.society.computing-careers-history.p001
    topics: [computer.society.computing-careers-history]
    difficulty: 1
    type: mcq
    stem: "ใครเป็นผู้เขียนบันทึกในปี ค.ศ. 1843 ที่อธิบายว่าเครื่องวิเคราะห์ของชาลส์ แบบเบจ อาจทำงานกับสัญลักษณ์ได้มากกว่าตัวเลข"
    choices:
      - { id: a, text: "เอดา เลิฟเลซ", correct: true }
      - { id: b, text: "เกรซ ฮอปเปอร์", feedback: "ฮอปเปอร์พัฒนาตัวแปลภาษา A-0 ในปี ค.ศ. 1952 ซึ่งเป็นยุคหลังบันทึกนี้" }
      - { id: c, text: "อลัน ทัวริง", feedback: "ทัวริงเสนอแนวคิดเครื่องจักรทัวริงในปี ค.ศ. 1936 ไม่ใช่ปี 1843" }
      - { id: d, text: "แคเทอรีน จอห์นสัน", feedback: "จอห์นสันเริ่มทำงานเป็นนักคำนวณที่ NACA (ต่อมาเป็นนาซา) ในปี ค.ศ. 1953" }
    hints:
      - "ลองนึกถึงผู้หญิงคนแรก ๆ ที่เขียนอธิบายการทำงานของเครื่องคำนวณ"
      - "ปีที่บอกคือ ค.ศ. 1843 ซึ่งเป็นยุคก่อนคอมพิวเตอร์อิเล็กทรอนิกส์มาก"
    solution: "เอดา เลิฟเลซ เขียนบันทึกในปี ค.ศ. 1843 อธิบายว่าเครื่องวิเคราะห์อาจทำงานกับสัญลักษณ์ได้มากกว่าการคำนวณตัวเลข"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-careers-history.p002
    topics: [computer.society.computing-careers-history]
    difficulty: 1
    type: match
    stem: "จับคู่บุคคลกับผลงานที่เกี่ยวข้อง"
    pairs:
      - { left: "เอดา เลิฟเลซ", right: "บันทึกเกี่ยวกับการทำงานของเครื่องวิเคราะห์ตั้งแต่ปี ค.ศ. 1843" }
      - { left: "เกรซ ฮอปเปอร์", right: "พัฒนาตัวแปลภาษา A-0 ในปี ค.ศ. 1952" }
      - { left: "อลัน ทัวริง", right: "เสนอแนวคิดเครื่องจักรทัวริงในปี ค.ศ. 1936" }
    hints:
      - "ดูปีที่ระบุในแต่ละผลงานและเทียบกับช่วงเวลาที่แต่ละคนทำงาน"
      - "ผลงานแต่ละชิ้นตรงกับคนเพียงคนเดียว"
    solution: "เอดา เลิฟเลซ เขียนบันทึกปี 1843 เกรซ ฮอปเปอร์พัฒนา A-0 ปี 1952 และอลัน ทัวริงเสนอแนวคิดปี 1936"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-careers-history.p003
    topics: [computer.society.computing-careers-history]
    difficulty: 1
    type: order
    stem: "เรียงเหตุการณ์ตามลำดับปีจากเก่าไปใหม่"
    items:
      - "เอดา เลิฟเลซ เขียนบันทึก (ค.ศ. 1843)"
      - "อลัน ทัวริง เสนอแนวคิด (ค.ศ. 1936)"
      - "เกรซ ฮอปเปอร์พัฒนา A-0 (ค.ศ. 1952)"
      - "โทรศัพท์มือถือเครื่องแรกถูกทดลองโทร (ค.ศ. 1973)"
    hints:
      - "เรียงตามตัวเลขปีจากน้อยไปมาก"
      - "ดูว่าเหตุการณ์ใดเกิดก่อนในช่วงหนึ่งร้อยปี"
    solution: "1843 → 1936 → 1952 → 1973"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-careers-history.p004
    topics: [computer.society.computing-careers-history]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นอาชีพที่ใช้แนวคิดเชิงคำนวณในการทำงานหลัก"
    choices:
      - { id: a, text: "แพทย์ที่ใช้โปรแกรมคำนวณขนาดยาและช่วยอ่านภาพเอ็กซเรย์", correct: true }
      - { id: b, text: "นักแสดงละครเวที", feedback: "งานนี้เน้นการแสดงและการสื่อสารกับผู้ชม ไม่ได้ใช้การคำนวณเป็นหลักในการทำงาน" }
      - { id: c, text: "นักกีฬาที่ซ้อมตามตารางเดิมทุกวัน", feedback: "การซ้อมตามตารางเป็นการฝึกวินัย ไม่ใช่การออกแบบขั้นตอนแก้ปัญหาด้วยการคำนวณ" }
      - { id: d, text: "ช่างทาสีบ้านที่ทาตามความชอบของลูกค้า", feedback: "งานนี้ใช้ทักษะฝีมือเป็นหลัก ไม่ได้เน้นการคำนวณข้อมูลเป็นขั้นตอน" }
    hints:
      - "ลองนึกว่าอาชีพใดต้องวิเคราะห์ข้อมูลหรือคำนวณเพื่อตัดสินใจ"
      - "ตัวเลือกที่ถูกเกี่ยวข้องกับการคำนวณขนาดหรือการอ่านข้อมูลที่ซับซ้อน"
    solution: "แพทย์ใช้โปรแกรมคำนวณขนาดยาและอ่านภาพเอ็กซเรย์ ซึ่งเป็นการใช้แนวคิดเชิงคำนวณกับข้อมูลในการตัดสินใจ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-careers-history.p005
    topics: [computer.society.computing-careers-history]
    difficulty: 2
    type: numeric
    stem: "เอดา เลิฟเลซ เขียนบันทึกในปี ค.ศ. 1843 และอลัน ทัวริงเสนอแนวคิดในปี ค.ศ. 1936 สองเหตุการณ์นี้ห่างกันกี่ปี"
    answer: { value: 93, tolerance: 0, unit: "ปี" }
    hints:
      - "หาผลต่างของปีที่มากกว่าลบด้วยปีที่น้อยกว่า"
      - "ปีที่มากกว่าคือ 1936 และปีที่น้อยกว่าคือ 1843"
    solution: "1936 − 1843 = 93 ปี"
    misconceptions:
      - { match: 92, feedback: "92 เกิดจากการนับไม่ครบ ผลต่างของปีคือลบตรง ๆ" }
      - { match: 100, feedback: "100 เกิดจากการปัดเป็นร้อยปี ทั้งที่โจทย์ต้องการผลต่างที่แน่นอน" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-careers-history.p006
    topics: [computer.society.computing-careers-history]
    difficulty: 2
    type: numeric
    stem: "ปี ค.ศ. 1952 ตรงกับปี พ.ศ. ใด"
    answer: { value: 2495, tolerance: 0, unit: "ปี พ.ศ." }
    hints:
      - "พ.ศ. มากกว่า ค.ศ. อยู่กี่ปี"
      - "เอาค่าที่ต่างกันไปบวกกับ ค.ศ."
    solution: "1952 + 543 = 2495"
    misconceptions:
      - { match: 1409, feedback: "1409 เกิดจากการลบ 543 ทั้งที่ต้องบวก เพราะ พ.ศ. มากกว่า ค.ศ. อยู่ 543 ปี" }
      - { match: 2395, feedback: "2395 เกิดจากการคำนวณผิด 1852 + 543 แทนที่จะเป็น 1952 + 543" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-careers-history.p007
    topics: [computer.society.computing-careers-history]
    difficulty: 2
    type: numeric
    stem: "เกรซ ฮอปเปอร์เริ่มทำงานกับเครื่อง Harvard Mark I ในปี ค.ศ. 1944 และพัฒนาตัวแปลภาษา A-0 ในปี ค.ศ. 1952 เหตุการณ์ทั้งสองห่างกันกี่ปี"
    answer: { value: 8, tolerance: 0, unit: "ปี" }
    hints:
      - "ลบปีที่เกิดก่อนออกจากปีที่เกิดหลัง"
      - "ลองนับทีละปีจาก 1944 ไปถึง 1952 แล้วดูว่าได้กี่ช่วง"
    solution: "1952 − 1944 = 8 ปี"
    misconceptions:
      - { match: 9, feedback: "9 เกิดจากการนับปีแรกและปีสุดท้ายเข้าไปทั้งคู่ ทั้งที่การลบจะได้ระยะห่าง" }
      - { match: 7, feedback: "7 เกิดจากลบผิด ตรวจอีกครั้งว่า 1952 − 1944 เท่ากับเท่าไร" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-careers-history.p008
    topics: [computer.society.computing-careers-history]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นผลที่ตั้งใจจากการพัฒนาโทรศัพท์มือถือ"
    choices:
      - { id: a, text: "ทำให้ติดต่อคนได้จากที่ไหนก็ได้", correct: true }
      - { id: b, text: "ทำให้เกิดขยะอิเล็กทรอนิกส์เพิ่มขึ้น", feedback: "เป็นผลกระทบที่ไม่ตั้งใจจากการผลิตและทิ้งเครื่องจำนวนมาก" }
      - { id: c, text: "ทำให้คนใช้จอนานจนนอนไม่พอ", feedback: "เป็นผลกระทบที่ไม่ตั้งใจจากการใช้งานที่เกินพอดี" }
      - { id: d, text: "ทำให้เลิกใช้ไฟฟ้าได้โดยสิ้นเชิง", feedback: "มือถือยังต้องใช้พลังงาน จึงไม่ใช่ผลที่ผู้พัฒนาตั้งใจและเป็นจริง" }
    hints:
      - "ถามว่าผู้พัฒนาตั้งเป้าอะไรไว้แต่ต้น"
      - "ผลที่ไม่ได้วางแผนมักเกิดขึ้นทีหลังและเห็นในระยะยาว"
    solution: "เป้าหมายแรกของโทรศัพท์มือถือคือให้ติดต่อคนได้ระหว่างเดินทาง ส่วนขยะ การใช้จอเกินพอดี และการเลิกใช้ไฟฟ้า ไม่ใช่สิ่งที่ตั้งใจหรือเป็นจริง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-careers-history.p009
    topics: [computer.society.computing-careers-history]
    difficulty: 2
    type: numeric
    stem: "โทรศัพท์มือถือเครื่องแรกถูกทดลองโทรในปี ค.ศ. 1973 และเริ่มขายแบบพาณิชย์ราวปี ค.ศ. 1983 จากปี 1973 ถึงปี 1983 ผ่านไปกี่ปี"
    answer: { value: 10, tolerance: 0, unit: "ปี" }
    hints:
      - "หาผลต่างระหว่างสองปีโดยไม่ต้องนับปีแรกซ้ำ"
      - "ลบปีแรกออกจากปีหลัง"
    solution: "1983 − 1973 = 10 ปี"
    misconceptions:
      - { match: 11, feedback: "11 เกิดจากการนับปีแรกเข้าไปด้วย ทั้งที่การลบให้ระยะห่างโดยตรง" }
      - { match: 9, feedback: "9 เกิดจากการลบผิดหรือนับไม่ครบ" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-careers-history.p010
    topics: [computer.society.computing-careers-history]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นปัจจัยทางสังคมที่มีผลต่อเส้นทางของโทรศัพท์มือถือ"
    choices:
      - { id: a, text: "ความต้องการติดต่อสื่อสารขณะเดินทาง", correct: true }
      - { id: b, text: "ระยะทางจากดวงจันทร์ถึงโลก", feedback: "ระยะทางนี้ไม่เกี่ยวข้องกับการพัฒนาและการใช้โทรศัพท์โดยตรง" }
      - { id: c, text: "จำนวนหน้าของตำราวิทยาศาสตร์เล่มหนึ่ง", feedback: "จำนวนหน้าของตำราไม่ได้เป็นปัจจัยของเทคโนโลยีนี้" }
      - { id: d, text: "สีของกล่องบรรจุภัณฑ์รุ่นแรก", feedback: "สีบรรจุภัณฑ์ไม่ใช่ปัจจัยที่กำหนดเส้นทางของเทคโนโลยี" }
    hints:
      - "ปัจจัยทางสังคมเกี่ยวกับความต้องการและการอยู่ร่วมกันของคน"
      - "ถามว่าปัจจัยนั้นทำให้คนอยากมีและใช้เทคโนโลยีนี้หรือไม่"
    solution: "ความต้องการติดต่อสื่อสารขณะเดินทางเป็นแรงขับทางสังคมที่ผลักดันให้โทรศัพท์มือถือพัฒนา ส่วนข้ออื่นไม่เกี่ยวกับเส้นทางของเทคโนโลยีนี้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-careers-history.p011
    topics: [computer.society.computing-careers-history]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นตัวอย่างของผลกระทบที่ไม่ตั้งใจจากเทคโนโลยีคอมพิวเตอร์ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ขยะอิเล็กทรอนิกส์จากเครื่องเก่าที่ถูกทิ้ง", correct: true }
      - { id: b, text: "ความเมื่อยล้าของสายตาจากการจ้องจอนาน", correct: true }
      - { id: c, text: "คนบางกลุ่มเข้าถึงบริการออนไลน์ได้ยากเพราะไม่มีอุปกรณ์", correct: true }
      - { id: d, text: "การติดต่อกับครอบครัวที่อยู่ต่างประเทศได้ทันที", feedback: "เป็นผลที่ตั้งใจและมีประโยชน์ ไม่ใช่ผลที่ไม่ตั้งใจ" }
    hints:
      - "ลองถามว่าผลนี้เกิดขึ้นโดยผู้พัฒนาไม่ได้วางแผนหรือไม่"
      - "ผลกระทบที่ไม่ตั้งใจมักเป็นผลตามมาหลังการใช้งานหรือการทิ้ง"
    solution: "ขยะจากเครื่องเก่า สายตาล้าจากการใช้จอนาน และการเข้าถึงที่ไม่เท่ากัน เป็นผลที่ไม่ได้ตั้งใจ ส่วนการติดต่อครอบครัวเป็นผลที่ตั้งใจ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-careers-history.p012
    topics: [computer.society.computing-careers-history]
    difficulty: 3
    type: match
    stem: "จับคู่ผู้มีบทบาทกับตัวอย่างบทบาทที่มีต่อเทคโนโลยี"
    pairs:
      - { left: "บริษัท", right: "พัฒนาเครื่องรุ่นใหม่เพื่อแข่งขันในตลาด" }
      - { left: "รัฐ", right: "กำหนดหลักเกณฑ์การใช้คลื่นความถี่" }
      - { left: "ชุมชนหรือผู้ใช้", right: "บอกความต้องการจริงและเลือกใช้หรือไม่ใช้" }
    hints:
      - "ลองนึกว่าแต่ละฝ่ายมีอำนาจหรือความต้องการอะไรต่อเทคโนโลยี"
      - "บริษัทกับรัฐมีเป้าหมายต่างกัน"
    solution: "บริษัทพัฒนาเครื่องเพื่อแข่งขัน รัฐกำหนดกติกาการใช้คลื่น และชุมชนผู้ใช้บอกความต้องการพร้อมตัดสินใจเลือกใช้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-careers-history.p013
    topics: [computer.society.computing-careers-history]
    difficulty: 3
    type: numeric
    stem: "ในห้องเรียนมีนักเรียนที่อยากเป็นแพทย์ 3 คน เกษตรกร 5 คน นักออกแบบ 4 คน และนักวิทยาศาสตร์ข้อมูล 2 คน ถ้าเลือกนักเรียนหนึ่งคนจากทั้งหมดแบบสุ่ม โอกาสที่จะได้นักวิทยาศาสตร์ข้อมูลคิดเป็นกี่เปอร์เซ็นต์ (ตอบเป็นทศนิยม 2 ตำแหน่ง)"
    answer: { value: 14.29, tolerance: 0.01, unit: "%" }
    hints:
      - "หาจำนวนนักเรียนทั้งหมดในห้องก่อนเลย"
      - "โอกาสคือจำนวนที่ต้องการหารด้วยจำนวนทั้งหมด แล้วคูณด้วย 100"
    solution: "จำนวนทั้งหมด 3 + 5 + 4 + 2 = 14 คน โอกาสได้นักวิทยาศาสตร์ข้อมูล 2 ÷ 14 × 100 ≈ 14.29 เปอร์เซ็นต์"
    misconceptions:
      - { match: 2, feedback: "2 คือจำนวนนักวิทยาศาสตร์ข้อมูล ยังไม่ได้เปลี่ยนเป็นร้อยละของทั้งหมด" }
      - { match: 16.67, feedback: "16.67 เกิดจากการหารด้วย 12 แทน 14 ซึ่งทำให้จำนวนคนทั้งหมดผิดไป" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-careers-history.p014
