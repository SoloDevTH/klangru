id: math.discrete.networks
subject: math
title: { th: เครือข่ายและกราฟเบื้องต้น, en: Networks and introductory graph theory }
summary: ใช้จุดยอดและเส้นเชื่อมแทนเส้นทางและการเชื่อมต่อ หาดีกรี ตรวจความเชื่อมโยง แนวเดินและวงจร ปัญหาสะพานเคอนิกส์แบร์ก และเส้นทางสั้นที่สุด
difficulty: 5
minutes: 40
prerequisites: [math.geometry.shapes, math.logic.sets]
encompasses:
  - { id: math.logic.sets, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: degrees.svg
    alt: "กราฟมีจุดยอด 6 จุด P Q R S T U เส้นเชื่อม 7 เส้น คือ PQ PR QR QS RS ST TU ข้างจุดแต่ละจุดเขียนดีกรี P 2 Q 3 R 3 S 3 T 2 U 1 ใต้ภาพเขียนว่า ผลรวมดีกรี = 2 + 3 + 3 + 3 + 2 + 1 = 14 = 2 × เส้นเชื่อม 7 เส้น"
    caption: "เส้นเชื่อมแต่ละเส้นถูกนับในดีกรีสองครั้ง ที่ปลายทั้งสองข้าง"
  - { type: check, problem: math.discrete.networks.p003, prompt: "นับเส้นเชื่อมที่ต่อกับจุด D" }
  - type: worked-example
    title: นับเส้นเชื่อมจากดีกรี
    problem: "กลุ่มเพื่อน 8 คน แต่ละคนเป็นเพื่อนในแอปแชตกับคนในกลุ่มพอดี 3 คน มีความเป็นเพื่อน (เส้นเชื่อม) กี่คู่"
    steps:
      - text: "แทนเพื่อนแต่ละคนด้วยจุดยอด และความเป็นเพื่อนด้วยเส้นเชื่อม ทุกจุดมีดีกรี 3"
      - text: "ผลรวมดีกรี $= 8 \\times 3 = 24$"
      - text: "จำนวนเส้นเชื่อม $= 24 \\div 2 = 12$ คู่"
        why: "ความเป็นเพื่อนหนึ่งคู่ถูกนับสองครั้ง ครั้งหนึ่งในดีกรีของแต่ละคน"
    answer: "12 คู่"
  - type: figure
    src: konigsberg.svg
    alt: "ซ้ายเป็นแผนที่อย่างง่าย แม่น้ำแบ่งแผ่นดินเป็น ฝั่งเหนือ A เกาะ B ฝั่งใต้ C และแผ่นดินตะวันออก D มีสะพาน 7 แห่ง A กับ B สองแห่ง B กับ C สองแห่ง B กับ D หนึ่งแห่ง A กับ D หนึ่งแห่ง C กับ D หนึ่งแห่ง ขวาเป็นกราฟที่มีจุดยอด A B C D และเส้นเชื่อม 7 เส้นตามสะพาน"
    caption: "ดีกรีของ A, B, C, D คือ 3, 5, 3, 3 เป็นจำนวนคี่ทั้งหมด จึงข้ามสะพานทุกแห่งครั้งเดียวพอดีไม่ได้"
  - type: worked-example
    title: หาเส้นทางที่สั้นที่สุด
    problem: "จากเครือข่ายถนนในภาพ หาระยะทางที่สั้นที่สุดจากหมู่บ้าน A ไปหมู่บ้าน D"
    figure:
      src: p-towns.svg
      alt: "เครือข่ายถนนระหว่างหมู่บ้าน 6 แห่ง ระยะทางเป็นกิโลเมตร A–B 4, A–C 2, B–C 1, B–D 5, C–D 8, C–E 10, D–E 2, D–F 6, E–F 3"
    steps:
      - text: "จาก A ไป C ได้ 2 กม. ไป B ตรง ๆ ได้ 4 กม."
      - text: "ไป B ผ่าน C ได้ $2 + 1 = 3$ กม. สั้นกว่า 4 กม. จึงเก็บ 3"
        why: "ทางที่ผ่านจุดมากกว่าอาจสั้นกว่า ต้องเทียบผลรวมจริง"
      - text: "ไป D ผ่าน B: $3 + 5 = 8$ กม. ผ่าน C ตรง: $2 + 8 = 10$ กม. เก็บ 8"
    answer: "8 กิโลเมตร (A → C → B → D)"
  - { type: check, problem: math.discrete.networks.p008, prompt: "ทุกคนจับมือกับทุกคน แต่การจับมือหนึ่งครั้งใช้คนสองคน" }
glossary:
  - { term: กราฟ (เครือข่าย), definition: "ภาพที่ประกอบด้วยจุดยอดและเส้นเชื่อม ใช้แทนการเชื่อมต่อของสิ่งต่าง ๆ" }
  - { term: จุดยอด, definition: "จุดในกราฟ แทนสิ่งที่สนใจ เช่น หมู่บ้าน สถานี หรือคน" }
  - { term: เส้นเชื่อม, definition: "เส้นที่เชื่อมจุดยอดสองจุด แทนความสัมพันธ์ เช่น ถนนหรือความเป็นเพื่อน" }
  - { term: ดีกรี, definition: "จำนวนเส้นเชื่อมที่ต่อกับจุดยอดหนึ่ง" }
  - { term: กราฟเชื่อมโยง, definition: "กราฟที่เดินตามเส้นเชื่อมจากจุดยอดใดไปจุดยอดใดก็ได้" }
  - { term: วงจร, definition: "แนวเดินที่เริ่มและจบที่จุดเดียวกันโดยไม่ใช้เส้นเชื่อมซ้ำ" }
  - { term: แนวเดินออยเลอร์, definition: "แนวเดินที่ผ่านทุกเส้นเชื่อมครั้งเดียวพอดี" }
  - { term: ต้นไม้, definition: "กราฟเชื่อมโยงที่ไม่มีวงจร ถ้ามี n จุดยอดจะมีเส้นเชื่อม n − 1 เส้น" }
flashcards:
  - { front: "ผลรวมดีกรีของทุกจุดยอดเท่ากับเท่าไร", back: "2 เท่าของจำนวนเส้นเชื่อม" }
  - { front: "กราฟเชื่อมโยงมีจุดดีกรีคี่ 2 จุด ลากผ่านทุกเส้นครั้งเดียวได้ไหม", back: "ได้ ต้องเริ่มที่จุดดีกรีคี่จุดหนึ่งและจบที่อีกจุด" }
  - { front: "ทำไมสะพานเคอนิกส์แบร์กเดินครบไม่ได้", back: "จุดยอดทั้ง 4 จุดมีดีกรีคี่ (3, 5, 3, 3)" }
  - { front: "คน n คนจับมือกันครบทุกคู่ได้กี่ครั้ง", back: "n(n − 1)/2 ครั้ง" }
  - { front: "ต้นไม้ที่มี 8 จุดยอดมีเส้นเชื่อมกี่เส้น", back: "7 เส้น" }
