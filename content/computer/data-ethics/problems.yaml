    choices:
      - { id: b, text: "ไม่บอกรายละเอียดเพื่อป้องกันการเลียนแบบระบบ", feedback: "การไม่บอกเลยทำให้ผู้ได้รับผลกระทบโต้แย้งหรือทวงถามความถูกต้องไม่ได้" }
      - { id: c, text: "บอกเฉพาะผลลัพธ์สุดท้าย โดยไม่อธิบายที่มา", feedback: "ผลลัพธ์โดยไม่มีคำอธิบายทำให้ตรวจสอบและโต้แย้งไม่ได้" }
      - { id: d, text: "ให้ผู้ใช้ยอมรับทุกอย่างโดยไม่ต้องรู้ข้อมูลเพิ่มเติม", feedback: "การยอมรับโดยไม่รู้ข้อมูลไม่ใช่ความโปร่งใส" }
      - { id: a, text: "บอกว่าใช้ข้อมูลประเภทใดบ้าง และอธิบายได้ว่าปัจจัยใดมีผลต่อผลลัพธ์", correct: true }
    hints:
      - "ความโปร่งใสต้องทำให้ผู้ได้รับผลกระทบเข้าใจได้ว่าเกิดอะไรขึ้น"
      - "คำอธิบายต้องครบทั้งที่มาของข้อมูลและเหตุผลของผลลัพธ์"
    solution: "ความโปร่งใสที่ดีคือบอกว่าใช้ข้อมูลประเภทใด และอธิบายได้ว่าปัจจัยใดมีผลต่อผลลัพธ์ ทำให้ผู้ได้รับผลกระทบตรวจสอบและโต้แย้งได้"
