<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" font-family="sans-serif" font-size="14">
<title>การทดลองเงา หลอดไฟจุด แผ่นกระดาษแข็งสูง 10 เซนติเมตรห่างหลอดไฟ 20 เซนติเมตร และฉากห่างหลอดไฟ 60 เซนติเมตร</title>
<rect x="0" y="0" width="600" height="260" fill="#ffffff"/>
<line x1="30.0" y1="200.0" x2="580.0" y2="200.0" stroke="#777" stroke-width="2"/>
<circle cx="60.0" cy="160.0" r="7.0" fill="#ffd54a" stroke="#e0a100" stroke-width="2"/>
<text x="60.0" y="144.0" text-anchor="middle" fill="#15211e" font-size="13">หลอดไฟ</text>
<line x1="60.0" y1="167.0" x2="60.0" y2="200.0" stroke="#777" stroke-width="2"/>
<rect x="217.0" y="120.0" width="6.0" height="80.0" rx="0" fill="#15211e" stroke="#15211e" stroke-width="1"/>
<text x="230.0" y="160.0" text-anchor="start" fill="#15211e" font-size="13">สูง 10 cm</text>
<line x1="540.0" y1="40.0" x2="540.0" y2="200.0" stroke="#15211e" stroke-width="4"/>
<text x="534.0" y="32.0" text-anchor="end" fill="#15211e" font-size="13">ฉาก</text>
<line x1="60.0" y1="218.0" x2="220.0" y2="218.0" stroke="#1f5fa8" stroke-width="1.5"/>
<line x1="60.0" y1="212.0" x2="60.0" y2="224.0" stroke="#1f5fa8" stroke-width="1.5"/>
<line x1="220.0" y1="212.0" x2="220.0" y2="224.0" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="140.0" y="238.0" text-anchor="middle" fill="#1f5fa8" font-size="13">20 cm</text>
<line x1="60.0" y1="242.0" x2="540.0" y2="242.0" stroke="#1f5fa8" stroke-width="1.5"/>
<line x1="60.0" y1="236.0" x2="60.0" y2="248.0" stroke="#1f5fa8" stroke-width="1.5"/>
<line x1="540.0" y1="236.0" x2="540.0" y2="248.0" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="300.0" y="262.0" text-anchor="middle" fill="#1f5fa8" font-size="13">60 cm</text>
</svg>
