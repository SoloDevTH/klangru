<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" font-family="sans-serif" font-size="14">
<title>ผลการทดลองยาป้องกันโรค: จำนวนผู้ป่วยในแต่ละกลุ่ม (ข้อมูลสมมติ)</title>
<rect x="0" y="0" width="600" height="380" fill="#ffffff"/>
<rect x="90.0" y="60.0" width="470.0" height="240.0" rx="0" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<line x1="90.0" y1="300.0" x2="560.0" y2="300.0" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="84.0" y="304.0" text-anchor="end" font-size="11" fill="#222">0</text>
<line x1="90.0" y1="240.0" x2="560.0" y2="240.0" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="84.0" y="244.0" text-anchor="end" font-size="11" fill="#222">50</text>
<line x1="90.0" y1="180.0" x2="560.0" y2="180.0" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="84.0" y="184.0" text-anchor="end" font-size="11" fill="#222">100</text>
<line x1="90.0" y1="120.0" x2="560.0" y2="120.0" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="84.0" y="124.0" text-anchor="end" font-size="11" fill="#222">150</text>
<line x1="90.0" y1="60.0" x2="560.0" y2="60.0" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="84.0" y="64.0" text-anchor="end" font-size="11" fill="#222">200</text>
<rect x="147.5" y="108.0" width="120.0" height="192.0" rx="0" fill="#6366f1" stroke="none" stroke-width="1.5"/>
<text x="207.5" y="102.0" text-anchor="middle" font-size="13" fill="#111" font-weight="bold">160</text>
<text x="207.5" y="320.0" text-anchor="middle" font-size="12" fill="#222">กลุ่มยาหลอก</text>
<text x="207.5" y="336.0" text-anchor="middle" font-size="11" fill="#555">(20,000 คน)</text>
<rect x="382.5" y="252.0" width="120.0" height="48.0" rx="0" fill="#16a34a" stroke="none" stroke-width="1.5"/>
<text x="442.5" y="246.0" text-anchor="middle" font-size="13" fill="#111" font-weight="bold">40</text>
<text x="442.5" y="320.0" text-anchor="middle" font-size="12" fill="#222">กลุ่มยาใหม่</text>
<text x="442.5" y="336.0" text-anchor="middle" font-size="11" fill="#555">(20,000 คน)</text>
<text x="30.0" y="180.0" text-anchor="middle" font-size="12" fill="#111" transform="rotate(-90 30 180.0)">จำนวนผู้ที่ป่วย (คน)</text>
<text x="300.0" y="30.0" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">จำนวนผู้ที่ป่วยเป็นโรคระหว่างการทดลอง 1 ปี (ข้อมูลสมมติ)</text>
</svg>