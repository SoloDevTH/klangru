  - id: computer.society.computing-careers-history.p015
    topics: [computer.society.computing-careers-history]
    difficulty: 4
    type: mcq
    stem: "เมื่อผู้ผลิตออกแบบเครื่องให้เปิดฝาหลังหรือเปลี่ยนแบตเตอรี่ได้ยาก ข้อใดเป็นผลต่อสังคมที่เป็นไปได้มากที่สุด"
    choices:
      - { id: a, text: "ผู้ใช้ต้องซื้อเครื่องใหม่บ่อยขึ้น และมีขยะอิเล็กทรอนิกส์มากขึ้น", correct: true }
      - { id: b, text: "ผู้ใช้ประหยัดเงินและลดขยะได้ทุกกรณี", feedback: "การซ่อมยากทำให้ผู้ใช้เสียค่าใช้จ่ายและมักทิ้งเครื่องแทนการซ่อม" }
      - { id: c, text: "ไม่มีผลต่อสังคมเพราะเป็นเรื่องเทคนิคล้วน", feedback: "การออกแบบเกี่ยวข้องกับเศรษฐกิจ สิ่งแวดล้อม และสิทธิของผู้บริโภค" }
      - { id: d, text: "ทำให้เครื่องมีอายุยืนขึ้นเสมอ", feedback: "เมื่อซ่อมยาก เครื่องที่เสียมักถูกทิ้ง เครื่องจึงไม่ได้อายุยืนขึ้น" }
    hints:
      - "ถ้าซ่อมเองไม่ได้ ผู้ใช้จะทำอย่างไรเมื่อเครื่องเสียหาย"
      - "ลองนึกถึงผลต่อขยะที่เกิดจากการทิ้งเครื่องก่อนเวลา"
    solution: "เมื่อซ่อมยาก ผู้ใช้มักต้องซื้อเครื่องใหม่บ่อยขึ้น ทำให้เกิดขยะอิเล็กทรอนิกส์มากขึ้น และเป็นปัญหาต่อสิ่งแวดล้อมและค่าใช้จ่ายของครอบครัว"
