id: health.safety.signs-fire
subject: health
title: { th: สัญลักษณ์ ป้ายเตือน และอัคคีภัย, en: "Safety signs, hazard symbols and fire safety" }
summary: ความหมายของสีและรูปร่างป้ายความปลอดภัย สัญลักษณ์อันตรายบนสิ่งของ สาเหตุ อันตราย และการป้องกันอัคคีภัย และหลักการหนีไฟอย่างปลอดภัย
difficulty: 1.5
minutes: 30
prerequisites: [health.safety.home-school-play]
encompasses:
  - { id: health.safety.home-school-play, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ป้ายความปลอดภัยห้าแบบ
    src: safety-signs.svg
    alt: "ป้ายห้าแบบ 1 ป้ายห้าม วงกลมขอบแดงมีขีดคาด ตัวอย่างห้ามจุดไฟ (รูปเปลวไฟถูกขีดคาด) 2 ป้ายเตือน สามเหลี่ยมสีเหลืองขอบดำ ตัวอย่างระวังไฟฟ้าแรงสูง (รูปสายฟ้า) 3 ป้ายบังคับ วงกลมสีฟ้า ตัวอย่างต้องสวมหมวกนิรภัย (รูปศีรษะสวมหมวก) 4 ป้ายสภาวะปลอดภัย สี่เหลี่ยมสีเขียว ตัวอย่างทางหนีไฟ (รูปคนวิ่งออกประตู) 5 ป้ายอุปกรณ์ดับเพลิง สี่เหลี่ยมสีแดง ตัวอย่างถังดับเพลิง ด้านล่างสรุปว่า แดง = ห้ามหรือดับเพลิง เหลือง = ระวัง ฟ้า = ต้องทำ เขียว = ปลอดภัย"
    caption: "ป้ายแบบนี้ใช้กันทั่วโลก ดูสีและรูปร่างก็รู้ความหมาย"
  - type: worked-example
    title: อ่านป้ายแล้วตัดสินใจ
    problem: "ไปเที่ยวน้ำตกกับครอบครัว เห็นป้ายวงกลมขอบแดงรูปคนว่ายน้ำมีขีดคาด และอีกป้ายเป็นสามเหลี่ยมสีเหลืองรูปคนลื่นล้มบนหิน เราควรทำอย่างไร"
    steps:
      - text: "ป้ายแรกเป็นวงกลมขอบแดงมีขีดคาด คือป้ายห้าม หมายถึงห้ามว่ายน้ำตรงนั้น"
        why: "สีแดงกับขีดคาดหมายถึงห้ามเสมอ ไม่ว่ารูปข้างในจะเป็นอะไร"
      - text: "ป้ายที่สองเป็นสามเหลี่ยมสีเหลือง คือป้ายเตือน บอกว่าหินลื่น ต้องระวัง"
      - text: "จึงไม่ลงเล่นน้ำในบริเวณนั้น เดินบนทางเดินที่จัดไว้ ไม่ปีนหิน และอยู่ใกล้ผู้ใหญ่"
    answer: "ไม่ว่ายน้ำตรงที่มีป้ายห้าม และเดินอย่างระวังบนทางที่จัดไว้ ไม่ปีนหินที่ลื่น"
  - { type: check, problem: health.safety.signs-fire.p004, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: figure
    title: สามเหลี่ยมของไฟ
    src: fire-triangle.svg
    alt: "สามเหลี่ยมมีเปลวไฟอยู่ตรงกลาง ด้านซ้ายเขียนว่าความร้อน เช่น ไม้ขีด เตา ไฟฟ้าลัดวงจร ด้านขวาเขียนว่าออกซิเจน คืออากาศรอบตัว ด้านล่างเขียนว่าเชื้อเพลิง เช่น กระดาษ ผ้า ไม้ แก๊ส น้ำมัน ด้านบนเขียนว่าไฟติดเมื่อมีครบ 3 อย่าง ตัดอย่างใดอย่างหนึ่งไฟจะดับ"
    caption: "การป้องกันและการดับไฟทุกวิธีคือการแยกสามอย่างนี้ออกจากกัน"
  - type: worked-example
    title: หนีไฟจากห้องเรียนชั้นสอง
    problem: "ระหว่างเรียนบนชั้นสอง ได้ยินเสียงสัญญาณเตือนไฟไหม้ และเห็นควันลอยมาตามทางเดิน นักเรียนควรทำอย่างไร"
    steps:
      - text: "หยุดทุกอย่าง ไม่เก็บกระเป๋า ฟังครู แล้วเดินแถวออกจากห้องทันที"
        why: "ทุกวินาทีมีค่า ของใช้ซื้อใหม่ได้ แต่ชีวิตไม่ได้"
      - text: "ก้มตัวต่ำ ใช้ผ้าหรือแขนเสื้อปิดจมูกและปาก เพราะควันลอยอยู่ด้านบน"
      - text: "ไปทางบันไดหนีไฟตามป้ายสีเขียว ไม่ใช้ลิฟต์ ไม่วิ่งผลักกัน"
      - text: "ไปที่จุดรวมพล ให้ครูนับจำนวน และไม่กลับเข้าไปในอาคาร"
        why: "ครูต้องรู้ว่าใครยังไม่ออกมา เพื่อแจ้งเจ้าหน้าที่ดับเพลิงได้ทันที"
    answer: "ออกทันทีโดยไม่เก็บของ ก้มต่ำปิดจมูก ใช้บันไดหนีไฟตามป้ายสีเขียว ไปจุดรวมพล และไม่กลับเข้าไป"
  - { type: check, problem: health.safety.signs-fire.p006 }
glossary:
  - { term: อัคคีภัย, definition: "ภัยที่เกิดจากไฟไหม้" }
  - { term: ป้ายความปลอดภัย, definition: "ป้ายที่ใช้สีและรูปร่างบอกว่าห้ามทำ ต้องระวัง ต้องทำ หรือทางที่ปลอดภัย" }
  - { term: สามเหลี่ยมของไฟ, definition: "สิ่งที่ทำให้ไฟติด 3 อย่าง คือ ความร้อน เชื้อเพลิง และออกซิเจน" }
  - { term: จุดรวมพล, definition: "จุดนอกอาคารที่ทุกคนไปรวมกันเมื่อหนีไฟ เพื่อนับว่าครบทุกคน" }
  - { term: วัตถุไวไฟ, definition: "สิ่งที่ติดไฟได้ง่าย เช่น แก๊ส น้ำมัน แอลกอฮอล์ สเปรย์" }
flashcards:
  - { front: "ป้ายวงกลมขอบแดงมีขีดคาดหมายถึงอะไร", back: "ห้ามทำ" }
  - { front: "ป้ายสามเหลี่ยมสีเหลืองหมายถึงอะไร", back: "ระวังอันตราย" }
  - { front: "ป้ายสี่เหลี่ยมสีเขียวหมายถึงอะไร", back: "ทางหรือจุดที่ปลอดภัย เช่น ทางหนีไฟ จุดรวมพล" }
  - { front: "ไฟติดต้องมีอะไรบ้าง", back: "ความร้อน เชื้อเพลิง และออกซิเจน" }
  - { front: "เสื้อผ้าติดไฟทำอย่างไร", back: "หยุด ล้มลง ปิดหน้า และกลิ้งจนไฟดับ ไม่วิ่ง" }
