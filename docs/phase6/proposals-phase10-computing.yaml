  - { id: computer.security.network-defense, title: ป้องกันเครือข่ายและตรวจจับการโจมตี, difficulty: 6, prereq: [computer.networks.addressing-routing, computer.security.cybersecurity-basics], indicators: ["acm-cs2023:NC-Security", "csta-k12-cs-2026:S1-CYB-ND-01", "csta-k12-cs-2026:S2-CYB-ND-01", "csta-k12-cs-2026:S2-CYB-ND-02", "csta-k12-cs-2026:S2-CYB-ND-03", "csta-k12-cs-2026:S1-CYB-TS-07", "csta-k12-cs-2026:S1-CYB-NO-06", "csta-k12-cs-2026:S2-CYB-NO-04", "csta-k12-cs-2026:S2-CYB-NO-05"], scope: "บทบาทของบริการและโพรโทคอลในการสื่อสารที่ปลอดภัยและช่องโหว่ (ปลอม ARP และ DNS ดักฟัง พอร์ตที่เปิดทิ้ง) โพรโทคอลที่ปลอดภัย (HTTPS SSH VPN) ไฟร์วอลล์และการเขียนกฎ การแบ่งส่วนเครือข่ายและ DMZ ระบบตรวจจับและป้องกันการบุกรุก ฟีเจอร์ความปลอดภัยของอุปกรณ์และซอฟต์แวร์เครือข่าย ออกแบบเครือข่ายโรงเรียนที่ปลอดภัย (แม่ข่าย สวิตช์ เราเตอร์ อุปกรณ์ปลายทาง ไฟร์วอลล์) ผลของโทโพโลยีต่อความปลอดภัย เครื่องมือบรรทัดคำสั่งดูกระบวนการและการเชื่อมต่อ (ps netstat ss) อ่านบันทึกและแยกรูปแบบจราจรปกติกับผิดปกติ (สแกนพอร์ต เดารหัสผ่าน DDoS) และเขียนสคริปต์ช่วยงานความปลอดภัยที่ทำซ้ำ โจทย์โค้ดแยกบันทึกการเข้าสู่ระบบเพื่อหา IP ที่เดารหัสผ่านเกินเกณฑ์" }
  # ลำดับ 2
  - { id: computer.security.risk-policy, title: การบริหารความเสี่ยง นโยบาย และกฎหมายความมั่นคงปลอดภัย, difficulty: 5.5, prereq: [computer.security.cybersecurity-basics, computer.society.privacy], indicators: ["acm-cs2023:SEC-Governance", "acm-cs2023:SEP-Security", "csta-k12-cs-2026:S1-CYB-CP-11", "csta-k12-cs-2026:S1-CYB-CP-12", "csta-k12-cs-2026:S2-CYB-CP-09", "csta-k12-cs-2026:S1-CYB-TS-08", "csta-k12-cs-2026:S2-CYB-TS-06", "csta-k12-cs-2026:S2-CYB-TS-07", "csta-k12-cs-2026:S1-CYB-PP-13", "csta-k12-cs-2026:S1-CYB-PP-14", "csta-k12-cs-2026:S1-CYB-PP-15"], scope: "สินทรัพย์ ภัยคุกคาม ช่องโหว่ และความเสี่ยง = โอกาส × ผลกระทบ ตารางความเสี่ยงและทางเลือกจัดการ (ลด โอน ยอมรับ หลีกเลี่ยง) ประเมินภัยด้วย CIA สถานะของข้อมูล (จัดเก็บ ส่ง ใช้งาน) และชนิดของมาตรการ (เทคนิค บริหาร กายภาพ ป้องกัน ตรวจจับ แก้ไข) ออกแบบการควบคุมการเข้าถึงข้อมูลอ่อนไหว (บทบาท RBAC สิทธิ์น้อยที่สุด) นโยบายความปลอดภัยขององค์กรและองค์ประกอบ (ขอบเขต บทบาท การใช้ที่ยอมรับได้ รหัสผ่าน สำรองข้อมูล) กฎหมายและมาตรฐาน (พ.ร.บ.การรักษาความมั่นคงปลอดภัยไซเบอร์ PDPA ISO/IEC 27001 แบบภาพรวม) และผลต่อนโยบายองค์กร อาชญากรรมคอมพิวเตอร์ (ฉ้อโกง มัลแวร์ โจมตีโครงสร้างพื้นฐาน) วิศวกรรมสังคมกับอคติทางความคิด (เร่งรีบ อ้างอำนาจ เห็นตามกลุ่ม) ผลของการตัดสินใจด้านความปลอดภัยต่อบุคคล องค์กร และสังคม และอธิบายความเสี่ยงให้ผู้ไม่ใช่สายเทคนิคเข้าใจ" }
  # ลำดับ 3
  - { id: computer.security.incident-forensics, title: การรับมือเหตุการณ์และนิติวิทยาศาสตร์ดิจิทัล, difficulty: 5.5, prereq: [computer.security.risk-policy], indicators: ["acm-cs2023:SEC-Forensics", "acm-cs2023:SEC-SEP", "csta-k12-cs-2026:HS-SYS-SE-32", "csta-k12-cs-2026:S2-CYB-TS-08", "csta-k12-cs-2026:S2-CYB-PP-11", "csta-k12-cs-2026:S2-CYB-PP-12"], scope: "ชนิดและสาเหตุของเหตุละเมิด (คนภายใน คนภายนอก ความผิดพลาดของคน ช่องโหว่ วิศวกรรมสังคม) และผลต่อบุคคล อุตสาหกรรม ชุมชน และรัฐ วงจรรับมือเหตุการณ์ (เตรียม ตรวจจับ จำกัดวง กำจัด กู้คืน ทบทวน) ศึกษาแผนรับมือของเหตุจริง (แรนซัมแวร์ในโรงพยาบาล ข้อมูลรั่ว) นิติวิทยาศาสตร์ดิจิทัล (เก็บหลักฐานไม่ให้เปลี่ยน ห่วงโซ่การครอบครอง แฮชยืนยันสำเนา เส้นเวลาจากบันทึก) การเปิดเผยช่องโหว่อย่างรับผิดชอบและโปรแกรมล่าบั๊ก จริยธรรมและกฎหมายของการทดสอบเจาะระบบ และบันทึกกระบวนการและการตัดสินใจเพื่อให้ทีมประสานงานและรับผิดชอบได้" }
