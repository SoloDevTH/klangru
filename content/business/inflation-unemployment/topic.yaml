id: business.econ.inflation-unemployment
subject: business
title:
  th: เงินเฟ้อ เงินฝืด และการว่างงาน
  en: Inflation, deflation and unemployment
summary: ดัชนีราคาผู้บริโภคและอัตราเงินเฟ้อ ผลของเงินเฟ้อและเงินฝืดต่อผู้ออม ผู้กู้ และธุรกิจ อัตราการว่างงาน ประเภท ผลเสีย และแนวทางแก้
difficulty: 5
minutes: 40
