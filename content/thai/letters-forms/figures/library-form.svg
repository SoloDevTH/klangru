<defs></defs>
<rect x="0" y="0" width="860" height="430" fill="#fff"/>
<rect x="10.0" y="10.0" width="840.0" height="410.0" rx="6" fill="#fff" stroke="#555" stroke-width="2"/>
<text x="430.0" y="46.0" font-size="21" text-anchor="middle" fill="#111" font-weight="bold">ใบสมัครสมาชิกห้องสมุดประชาชน (สมมุติ)</text>
