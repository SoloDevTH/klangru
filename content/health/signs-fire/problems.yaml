  - id: health.safety.signs-fire.p018
    topics: [health.safety.signs-fire]
    difficulty: 5
    type: mcq
    stem: "ไฟไหม้ทางเดินหน้าห้องนอน ควันลอยเข้ามาใต้ประตู และประตูร้อน ไม่มีทางออกอื่นนอกจากหน้าต่างชั้นสอง ข้อใดเป็นการตัดสินใจที่ดีที่สุด"
    choices:
      - { id: a, text: "ปิดประตูไว้ อุดช่องใต้ประตูด้วยผ้าเปียก ไปที่หน้าต่าง โบกผ้าหรือส่องไฟ และโทร 199 บอกว่าติดอยู่ห้องไหน", correct: true }
      - { id: b, text: "เปิดประตูแล้ววิ่งฝ่าควันออกไป", feedback: "ประตูร้อนแสดงว่ามีไฟอยู่อีกฝั่ง การเปิดทำให้ไฟและควันพุ่งเข้ามา" }
      - { id: c, text: "หลบใต้เตียงและรอให้ไฟดับเอง", feedback: "ควันจะเข้ามาในห้อง และเจ้าหน้าที่หาตัวไม่เจอ ต้องส่งสัญญาณให้คนข้างนอกเห็น" }
      - { id: d, text: "กระโดดลงจากหน้าต่างทันที", feedback: "การกระโดดจากชั้นสองเสี่ยงบาดเจ็บรุนแรง ควรส่งสัญญาณและรอความช่วยเหลือก่อน ถ้าไม่ใช่สถานการณ์ที่ไม่มีทางเลือกจริง ๆ" }
    hints:
      - "ประตูร้อนบอกอะไร"
      - "ทำให้ควันเข้ามาช้าที่สุด และให้คนข้างนอกรู้ว่าเราอยู่ตรงไหน"
    solution: "อย่าเปิดประตูที่ร้อน ปิดและอุดช่องกันควัน แล้วส่งสัญญาณที่หน้าต่างและโทร 199 บอกตำแหน่ง เพื่อให้เจ้าหน้าที่ดับเพลิงมาช่วย"
