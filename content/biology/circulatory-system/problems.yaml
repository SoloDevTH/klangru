      - { id: b, text: "นักกีฬามีเลือดน้อยกว่า หัวใจจึงไม่ต้องเต้นบ่อย", feedback: "ข้อมูลไม่ได้บอกปริมาณเลือด และการมีเลือดน้อยไม่ได้ทำให้แข็งแรงขึ้น" }
      - { id: c, text: "หัวใจของนักกีฬาป่วย จึงเต้นช้า", feedback: "อัตราขณะพักที่ต่ำร่วมกับการฟื้นตัวเร็วในนักกีฬาเป็นสัญญาณของความฟิต ไม่ใช่ความเจ็บป่วย" }
