<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="sans-serif" font-size="14">
<title>วงจรรับรู้ ปรับแบบจำลอง วางแผน และกระทำของเอเจนต์</title>
<rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<line x1="462.4" y1="83.2" x2="434.1" y2="141.8" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<line x1="434.1" y1="188.2" x2="462.4" y2="246.8" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<line x1="297.6" y1="246.8" x2="325.9" y2="188.2" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<line x1="325.9" y1="141.8" x2="297.6" y2="83.2" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<rect x="280" y="26" width="200" height="68" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="380" y="54" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">รับรู้</text>
<text x="380" y="74" text-anchor="middle" font-size="12" fill="#374151">เซนเซอร์ให้ข้อมูลสภาพแวดล้อม</text>
<rect x="416.5" y="131" width="200" height="68" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="516.5" y="159" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">ปรับแบบจำลองโลก</text>
<text x="516.5" y="179" text-anchor="middle" font-size="12" fill="#374151">อัปเดตสถานะที่รู้</text>
<rect x="280" y="236" width="200" height="68" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="380" y="264" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">วางแผน</text>
<text x="380" y="284" text-anchor="middle" font-size="12" fill="#374151">ค้นหาลำดับการกระทำถึงเป้าหมาย</text>
<rect x="143.5" y="131" width="200" height="68" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="243.5" y="159" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">กระทำ</text>
<text x="243.5" y="179" text-anchor="middle" font-size="12" fill="#374151">สั่งตัวขับเคลื่อนทำตามแผนหนึ่งก้าว</text>
<text x="380" y="320" text-anchor="middle" fill="#475569" font-size="13">ถ้าสิ่งแวดล้อมเปลี่ยนระหว่างทาง ให้วนกลับไปวางแผนใหม่</text>
</svg>
