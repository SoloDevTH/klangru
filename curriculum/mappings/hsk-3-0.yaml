    indicators: [HSK3.0-L1]
    coverage: partial
    note: "หัวข้อข้อมูลส่วนตัวของระดับ 1: ชื่อ แซ่ สัญชาติ อายุ ครอบครัว และ 有/没有 รวมถึงการเขียนแนะนำตัวสั้น ๆ แต่ไม่ครอบคลุมทักษะฟังและหัวข้ออื่นของระดับ"
  - topic: chinese.grammar.ba-sentences
    indicators: [HSK3.0-L3]
    coverage: partial
    note: ประโยค 把 (รวม 放在 给 成 ข้อจำกัดกริยา กรรม คำปฏิเสธ) และประโยค 被 叫 让 ครบตามขอบเขต แต่เป็นจุดไวยากรณ์ส่วนหนึ่งของระดับ 3
  - topic: chinese.grammar.complements-basic
    indicators: [HSK3.0-L2, HSK3.0-L3]
    coverage: partial
    note: ส่วนเติมเต็มผลลัพธ์ (看懂 写错 做完 ฯลฯ) และทิศทาง 来/去 กับ 上 下 进 出 回 过 起 ครบตามขอบเขต แต่เป็นจุดไวยากรณ์ส่วนหนึ่งของระดับ
  - topic: chinese.grammar.compound-sentences
    indicators: [HSK3.0-L2]
    coverage: partial
    note: คำเชื่อม 因为…所以 如果…就 虽然…但是 先…再/然后 不但…而且 ครบตามขอบเขต แต่เป็นเพียงจุดไวยากรณ์ส่วนหนึ่งของระดับ 2 (不但…而且 และ 虽然…但是 บางรายการจัดไว้ระดับ 3)
  - topic: chinese.grammar.progressive-bi
    indicators: [HSK3.0-L1, HSK3.0-L2]
