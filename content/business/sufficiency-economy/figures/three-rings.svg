<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="sans-serif" font-size="14">
  <title>สามห่วงสองเงื่อนไขของปรัชญาของเศรษฐกิจพอเพียง</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="640" height="420" fill="#ffffff"/>
  <text x="320.0" y="28.0" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="bold">ผลลัพธ์: สมดุล มั่นคง ยั่งยืน (เศรษฐกิจ สังคม สิ่งแวดล้อม วัฒนธรรม)</text>
  <circle cx="320" cy="123" r="78" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="3"/>
  <circle cx="250" cy="223" r="78" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="3"/>
  <circle cx="390" cy="223" r="78" fill="#ea580c" fill-opacity="0.15" stroke="#ea580c" stroke-width="3"/>
  <text x="320.0" y="95.0" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="bold">ความพอประมาณ</text>
  <text x="220.0" y="245.0" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="bold">ความมีเหตุผล</text>
  <text x="420.0" y="237.0" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="bold">มีภูมิคุ้มกัน</text>
  <text x="420.0" y="257.0" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="bold">ที่ดีในตัว</text>
  <rect x="276.0" y="177.0" width="88.0" height="24.0" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/>
  <text x="320.0" y="194.0" text-anchor="middle" fill="#1f2937" font-size="13">ทางสายกลาง</text>
  <rect x="60.0" y="315.0" width="240.0" height="80.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="180.0" y="343.0" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="bold">เงื่อนไขความรู้</text>
  <text x="180.0" y="368.0" text-anchor="middle" fill="#1f2937" font-size="13">รอบรู้ รอบคอบ ระมัดระวัง</text>
  <rect x="340.0" y="315.0" width="240.0" height="80.0" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="460.0" y="343.0" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="bold">เงื่อนไขคุณธรรม</text>
  <text x="460.0" y="368.0" text-anchor="middle" fill="#1f2937" font-size="13">ซื่อสัตย์ อดทน เพียร แบ่งปัน</text>
</svg>
