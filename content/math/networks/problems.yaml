  - id: math.discrete.networks.p017
    topics: [math.discrete.networks]
    difficulty: 5
    type: mcq
    stem: "ต้องการลากเส้นผ่านทุกเส้นเชื่อมของกราฟรูปบ้านในภาพครั้งเดียวพอดีโดยไม่ยกปากกา ต้องเริ่มที่จุดใด"
    figure:
      src: p-house.svg
      alt: "กราฟรูปบ้าน จุดยอด A เป็นยอดหลังคา B และ C เป็นมุมบนของตัวบ้าน D และ E เป็นมุมล่าง เส้นเชื่อม AB, AC, BC, BD, CE, DE และเส้นทแยง BE กับ CD"
    choices:
      - { id: a, text: "D หรือ E", correct: true }
      - { id: b, text: "A", feedback: "A มีดีกรี 2 (คู่) ถ้าเริ่มที่ A จะต้องจบที่ A ซึ่งทำไม่ได้เพราะมีจุดดีกรีคี่ 2 จุด" }
      - { id: c, text: "B หรือ C", feedback: "B และ C มีดีกรี 4 (คู่) จุดเริ่มต้องเป็นจุดดีกรีคี่" }
      - { id: d, text: "จุดใดก็ได้", feedback: "เริ่มจุดใดก็ได้เฉพาะเมื่อทุกจุดมีดีกรีคู่ แต่กราฟนี้มีจุดดีกรีคี่ 2 จุด" }
    hints:
      - "หาดีกรีของทุกจุด"
      - "เมื่อมีจุดดีกรีคี่ 2 จุด ต้องเริ่มที่จุดดีกรีคี่"
    solution: "ดีกรี A 2, B 4, C 4, D 3, E 3 มีจุดดีกรีคี่ 2 จุดคือ D และ E จึงต้องเริ่มที่จุดหนึ่งและจบที่อีกจุด เช่น D → B → A → C → B → E → C → D → E"
    license: CC-BY-SA-4.0
