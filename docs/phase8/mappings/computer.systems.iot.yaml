topic: computer.systems.iot
rows:
  - { framework: acm-cs2023, indicators: ["NC-Emerging"], coverage: partial, note: "สถาปัตยกรรม IoT โพรโทคอล การประมวลผลที่ขอบ และ 5G กับ SDN ในระดับแนวคิด (บทเรียนส่วนสถาปัตยกรรม โพรโทคอล และเทคโนโลยีเครือข่ายใหม่) ยังไม่ลงลึกเทคโนโลยีเครือข่ายใหม่อื่น ๆ" }
  - { framework: csta-k12-cs-2026, indicators: ["S1-PHY-CI-04"], coverage: full, note: "เซนเซอร์ส่งค่าผ่านการสื่อสารระยะใกล้ไปยังเกตเวย์ และคำนวณการส่งข้อความต่อชั่วโมง (ภาพ iot-architecture; ตัวอย่างแสดงวิธีทำ; โจทย์ p004 p008)" }
  - { framework: csta-k12-cs-2026, indicators: ["S1-PHY-CI-05"], coverage: partial, note: "เชื่อมอุปกรณ์ด้วยโพรโทคอลและเข้ารหัส อธิบายในระดับแนวคิดและตรวจค่าตั้งต้น แต่ยังไม่มีการเชื่อมอุปกรณ์จริงในแอป" }
  - { framework: csta-k12-cs-2026, indicators: ["S2-PHY-CI-04"], coverage: partial, note: "ออกแบบการเก็บข้อมูลและการเฝ้าดูจากระยะไกลในเชิงสถาปัตยกรรม แต่ยังไม่มีการสร้างระบบจริง" }
  - { framework: csta-k12-cs-2026, indicators: ["S2-PHY-CI-05"], coverage: partial, note: "เปรียบเทียบการแลกเปลี่ยนระหว่างระยะ พลังงาน ความปลอดภัย และการขยายระบบ (โจทย์ p013) แต่ยังไม่มีการพัฒนาเครือข่ายฝังตัว" }
  - { framework: csta-k12-cs-2026, indicators: ["S1-PHY-PP-07"], coverage: full, note: "ผลทางสังคมและเทคนิคของระบบ IoT ในบ้านและเมือง (บทเรียนส่วนผลกระทบต่อสังคมและความเป็นส่วนตัว; โจทย์ p014)" }
  - { framework: csta-k12-cs-2026, indicators: ["S1-PHY-PP-08"], coverage: full, note: "ภัยของอุปกรณ์ IoT ได้แก่ รหัสผ่านจากโรงงาน เฟิร์มแวร์ไม่อัปเดต และข้อมูลไม่เข้ารหัส พร้อมการป้องกัน (บทเรียนส่วนภัยของอุปกรณ์ IoT; ตัวอย่างแสดงวิธีทำการตรวจอุปกรณ์; โจทย์ p007 p009 p010 p011)" }
  - { framework: csta-k12-cs-2026, indicators: ["S2-PHY-PP-07"], coverage: full, note: "เทคโนโลยีทางกายภาพกับอำนาจและความเท่าเทียมของชุมชน (บทเรียนส่วนอำนาจและความเท่าเทียม; โจทย์ p015 p017)" }
  - { framework: csta-k12-cs-2026, indicators: ["S2-PHY-DD-03"], coverage: partial, note: "แนวคิดแอปที่เฝ้าดูและสั่งงานอุปกรณ์จากระยะไกล (แสดงเวลาวัด แจ้งเตือน ยืนยันผลคำสั่ง) และการจำลองตัวกลาง MQTT (โจทย์ p016) แต่ตัวชี้วัดให้พัฒนาแอปที่เชื่อมอุปกรณ์จริง ซึ่งแอปคลังรู้ทำไม่ได้" }
