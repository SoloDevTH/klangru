<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" font-family="sans-serif">
<title>ป้ายพิพิธภัณฑ์และฉลากยาน้ำสมมุติ</title>
<rect x="0" y="0" width="700" height="360" fill="#fff"/>
<rect x="12.0" y="12.0" width="330.0" height="336.0" rx="8" fill="#f4f8ee" stroke="#3f7a32" stroke-width="2.5"/>
<text x="177.0" y="44.0" font-size="20" text-anchor="middle" fill="#1f4f1a" font-weight="bold">CITY MUSEUM</text>
<text x="177.0" y="66.0" font-size="15" text-anchor="middle" fill="#1f4f1a" font-weight="normal">Visitor Information</text>
<circle cx="34.0" cy="93.0" r="3.5" fill="#3f7a32" stroke="#3f7a32" stroke-width="1"/>
<text x="46.0" y="98.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">Tickets: 80 baht.</text>
<circle cx="34.0" cy="115.0" r="3.5" fill="#3f7a32" stroke="#3f7a32" stroke-width="1"/>
<text x="46.0" y="120.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">Children under 12 are</text>
<text x="46.0" y="142.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">admitted free.</text>
<circle cx="34.0" cy="159.0" r="3.5" fill="#3f7a32" stroke="#3f7a32" stroke-width="1"/>
<text x="46.0" y="164.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">Bags must be left at</text>
<text x="46.0" y="186.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">the counter.</text>
<circle cx="34.0" cy="203.0" r="3.5" fill="#3f7a32" stroke="#3f7a32" stroke-width="1"/>
<text x="46.0" y="208.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">Tickets are checked at</text>
<text x="46.0" y="230.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">the gate.</text>
<circle cx="34.0" cy="247.0" r="3.5" fill="#3f7a32" stroke="#3f7a32" stroke-width="1"/>
<text x="46.0" y="252.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">Photography is not</text>
<text x="46.0" y="274.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">allowed in Room 3.</text>
<circle cx="34.0" cy="291.0" r="3.5" fill="#3f7a32" stroke="#3f7a32" stroke-width="1"/>
<text x="46.0" y="296.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">The museum is closed</text>
<text x="46.0" y="318.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">on Mondays.</text>
<rect x="362.0" y="12.0" width="326.0" height="336.0" rx="8" fill="#fff" stroke="#b3261e" stroke-width="2.5"/>
<rect x="362.0" y="12.0" width="326.0" height="46.0" rx="8" fill="#b3261e" stroke="#b3261e" stroke-width="1"/>
<text x="525.0" y="42.0" font-size="18" text-anchor="middle" fill="#fff" font-weight="bold">COUGH SYRUP X  (60 ml)</text>
<text x="525.0" y="78.0" font-size="14" text-anchor="middle" fill="#b3261e" font-weight="normal">ยาสมมุติ ไม่ใช่ยาจริง</text>
<text x="380.0" y="108.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">This medicine should be taken</text>
<text x="380.0" y="129.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">three times a day after meals.</text>
<text x="380.0" y="171.0" font-size="15" text-anchor="start" fill="#111" font-weight="bold">Adults: 10 ml each time</text>
<text x="380.0" y="192.0" font-size="15" text-anchor="start" fill="#111" font-weight="bold">Children 6–12 years: 5 ml each time</text>
<text x="380.0" y="234.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">Must not be given to children</text>
<text x="380.0" y="255.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">under 6 years old.</text>
<text x="380.0" y="276.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">Must be kept below 30 °C.</text>
<text x="380.0" y="318.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">Ask a pharmacist if you are not sure.</text>
</svg>
