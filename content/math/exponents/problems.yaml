problems:
  - id: math.exp.p001
    topics: [math.number.exponents]
    difficulty: 1
    type: numeric
    stem: "หาค่า $2^5$"
    answer: { value: 32 }
    hints:
      - "$2^5$ หมายถึงนำ 2 มาคูณกันกี่ตัว"
      - "เขียนเป็น $2 \\times 2 \\times 2 \\times 2 \\times 2$ แล้วคูณทีละคู่"
    misconceptions:
      - { match: 10, feedback: "นั่นคือ $2 \\times 5$ เลขชี้กำลัง 5 บอกว่ามี 2 คูณกัน 5 ตัว ไม่ได้ให้คูณ 2 กับ 5" }
      - { match: 25, feedback: "นั่นคือ $5^2$ ดูเหมือนสลับฐานกับเลขชี้กำลัง ฐานคือ 2 ซึ่งถูกคูณซ้ำ 5 ตัว" }
    solution: "$2^5 = 2 \\times 2 \\times 2 \\times 2 \\times 2 = 4 \\times 2 \\times 2 \\times 2 = 32$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.exp.p002
    topics: [math.number.exponents]
    difficulty: 1
    type: mcq
    stem: "เขียน $7 \\times 7 \\times 7 \\times 7$ ในรูปเลขยกกำลังได้อย่างไร"
    choices:
      - { id: a, text: "$7^4$", correct: true }
      - { id: b, text: "$4^7$", feedback: "ดูเหมือนสลับฐานกับเลขชี้กำลัง จำนวนที่ถูกคูณซ้ำคือ 7 จึงเป็นฐาน ส่วน 4 คือจำนวนตัว" }
      - { id: c, text: "$7^3$", feedback: "ดูเหมือนนับเครื่องหมายคูณ (มี 3 ตัว) เลขชี้กำลังต้องนับจำนวน 7 ที่คูณกัน ซึ่งมี 4 ตัว" }
      - { id: d, text: "$7 \\times 4$", feedback: "$7 \\times 4 = 28$ คือการบวก 7 สี่ครั้ง แต่โจทย์คือการ **คูณ** 7 สี่ครั้ง" }
    hints:
      - "ฐานคือจำนวนที่ถูกคูณซ้ำ"
      - "เลขชี้กำลังคือจำนวนตัวของฐานที่คูณกัน ให้นับเลข 7 ไม่ใช่นับเครื่องหมาย ×"
    solution: "มีเลข 7 คูณกัน 4 ตัว ฐานคือ 7 เลขชี้กำลังคือ 4 จึงเขียนเป็น $7^4$ (มีค่าเท่ากับ 2,401)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.exp.p003
    topics: [math.number.exponents]
    difficulty: 2
    type: numeric
    stem: "หาค่า $(-3)^4$"
    answer: { value: 81 }
    hints:
      - "ฐานคือ $-3$ ทั้งตัว เพราะอยู่ในวงเล็บ"
      - "เขียนเป็น $(-3)(-3)(-3)(-3)$ แล้วจับคู่ ลบคูณลบได้บวก"
    misconceptions:
      - { match: -81, feedback: "เลขชี้กำลังเป็นคู่ (4) จำนวนลบสี่ตัวจับคู่ได้สองคู่ แต่ละคู่ได้บวก ผลจึงเป็นบวก" }
      - { match: -12, feedback: "นั่นคือ $(-3) \\times 4$ เลขชี้กำลังบอกจำนวนตัวที่คูณกัน ไม่ได้ให้คูณ $-3$ กับ 4" }
    solution: "$(-3)^4 = [(-3)(-3)] \\times [(-3)(-3)] = 9 \\times 9 = 81$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.exp.p004
    topics: [math.number.exponents]
    difficulty: 2
    type: numeric
    stem: "กล่องใส่ขนมไหว้พระจันทร์เป็นรูปลูกบาศก์ ยาวด้านละ 5 เซนติเมตร กล่องนี้มีปริมาตรกี่ลูกบาศก์เซนติเมตร (ปริมาตรลูกบาศก์ = ความยาวด้านยกกำลังสาม)"
    answer: { value: 125, unit: cm³ }
    hints:
      - "ปริมาตร = $5^3$"
      - "$5^3 = 5 \\times 5 \\times 5$ ไม่ใช่ $5 \\times 3$"
    misconceptions:
      - { match: 15, feedback: "นั่นคือ $5 \\times 3$ ยกกำลังสามหมายถึงนำ 5 มาคูณกัน 3 ตัว" }
      - { match: 25, feedback: "นั่นคือ $5^2$ ซึ่งเป็นพื้นที่ของหน้ากล่องหนึ่งด้าน ปริมาตรต้องคูณความสูงอีก 5" }
    solution: "ปริมาตร $= 5^3 = 5 \\times 5 \\times 5 = 125\\ \\mathrm{cm^3}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.exp.p005
    topics: [math.number.exponents]
    difficulty: 3
    type: numeric
    stem: "หาค่า $-3^4$ (สังเกตว่าไม่มีวงเล็บ)"
    answer: { value: -81 }
    hints:
      - "เมื่อไม่มีวงเล็บ เลขชี้กำลัง 4 ติดอยู่กับ 3 เท่านั้น"
      - "หาค่า $3^4$ ก่อน แล้วจึงใส่เครื่องหมายลบข้างหน้า"
    misconceptions:
      - { match: 81, feedback: "นั่นคือค่าของ $(-3)^4$ ซึ่งมีวงเล็บ แต่ $-3^4$ ไม่มีวงเล็บ ฐานจึงเป็น 3 แล้วค่อยใส่เครื่องหมายลบ ได้ $-(3^4)$" }
    solution: "$-3^4 = -(3 \\times 3 \\times 3 \\times 3) = -81$ (ต่างจาก $(-3)^4 = 81$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.exp.p006
    topics: [math.number.exponents]
    difficulty: 3
    type: match
    stem: "จับคู่เลขยกกำลังกับค่าของมัน"
    pairs:
      - { left: "$(-2)^3$", right: "$-8$" }
      - { left: "$(-2)^2$", right: "$4$" }
      - { left: "$-2^2$", right: "$-4$" }
      - { left: "$2^3$", right: "$8$" }
      - { left: "$0^5$", right: "$0$" }
      - { left: "$1^{100}$", right: "$1$" }
    hints:
      - "ดูว่ามีวงเล็บครอบเครื่องหมายลบหรือไม่ ถ้าไม่มี ให้ยกกำลังก่อนแล้วค่อยใส่ลบ"
      - "ฐานเป็นลบ: เลขชี้กำลังคู่ได้บวก คี่ได้ลบ ส่วนศูนย์และหนึ่งคูณกันกี่ครั้งก็ได้ค่าเดิม"
    solution: "$(-2)^3 = -8$ (คี่ได้ลบ) · $(-2)^2 = 4$ (คู่ได้บวก) · $-2^2 = -(2^2) = -4$ · $2^3 = 8$ · $0^5 = 0$ · $1^{100} = 1$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.exp.p007
    topics: [math.number.exponents]
    difficulty: 3
    type: numeric
    stem: "หาค่า $3 + 2 \\times 4^2$"
    answer: { value: 35 }
    hints:
      - "ลำดับ: วงเล็บ → เลขยกกำลัง → คูณหาร → บวกลบ"
      - "หาค่า $4^2$ ก่อน แล้วคูณด้วย 2 แล้วจึงบวก 3"
    misconceptions:
      - { match: 80, feedback: "ดูเหมือนบวก $3 + 2$ ก่อน ต้องยกกำลังและคูณก่อนบวก" }
      - { match: 67, feedback: "ดูเหมือนคิดเป็น $(2 \\times 4)^2$ แต่เลขยกกำลังติดอยู่กับ 4 ตัวเดียว ต้องหา $4^2$ ก่อนแล้วจึงคูณ 2" }
    solution: "$4^2 = 16$ → $2 \\times 16 = 32$ → $3 + 32 = 35$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.exp.p008
    topics: [math.number.exponents]
    difficulty: 3
    type: numeric
    stem: "ประกาศของหมู่บ้านถูกส่งต่อทางโทรศัพท์ รอบที่ 1 ผู้ใหญ่บ้านส่งให้ 3 คน รอบที่ 2 แต่ละคนที่เพิ่งได้รับส่งต่อให้คนใหม่อีกคนละ 3 คน และเป็นแบบนี้ทุกรอบ ในรอบที่ 4 มีคนได้รับประกาศใหม่กี่คน"
    answer: { value: 81, unit: คน }
    hints:
      - "รอบที่ 1 มี 3 คน รอบที่ 2 มี $3 \\times 3$ คน"
      - "แต่ละรอบคูณด้วย 3 เพิ่มขึ้นหนึ่งตัว รอบที่ 4 จึงเป็น 3 ยกกำลังเท่าใด"
    misconceptions:
      - { match: 12, feedback: "นั่นคือ $3 \\times 4$ แต่จำนวนคนไม่ได้เพิ่มทีละ 3 คน ทุกรอบจำนวนคน **คูณ** 3" }
      - { match: 64, feedback: "นั่นคือ $4^3$ ดูเหมือนสลับฐานกับเลขชี้กำลัง ฐานคือ 3 (คนละ 3 คน) ส่วน 4 คือจำนวนรอบ" }
    solution: "รอบที่ 1: 3 คน · รอบที่ 2: $3^2 = 9$ คน · รอบที่ 3: $3^3 = 27$ คน · รอบที่ 4: $3^4 = 81$ คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.exp.p009
    topics: [math.number.exponents]
    difficulty: 3
    type: text
    stem: "เขียน $2 \\times 2 \\times 2 \\times 3 \\times 3$ ในรูปผลคูณของเลขยกกำลัง (พิมพ์ เช่น 5^2×7^3 หรือ 5^2*7^3)"
    accepted: ["2^3×3^2", "2^3x3^2", "2^3*3^2", "2^3·3^2", "3^2×2^3", "3^2x2^3", "3^2*2^3", "3^2·2^3"]
    hints:
      - "จัดกลุ่มฐานที่เหมือนกันไว้ด้วยกัน: กลุ่มของ 2 และกลุ่มของ 3"
      - "นับว่าแต่ละฐานมีกี่ตัว แล้วใช้เป็นเลขชี้กำลังของฐานนั้น"
    misconceptions:
      - { match: "6^5", feedback: "ฐานต่างกัน (2 กับ 3) รวมเป็นฐานเดียวไม่ได้ $6^5 = 7{,}776$ แต่ผลคูณในโจทย์คือ 72 ให้เขียนแยกแต่ละฐาน" }
      - { match: "2^3+3^2", feedback: "สองกลุ่มนี้ **คูณ** กัน ไม่ใช่บวกกัน ให้ใช้เครื่องหมาย × ระหว่าง $2^3$ กับ $3^2$" }
    solution: "มี 2 อยู่ 3 ตัว ได้ $2^3$ และมี 3 อยู่ 2 ตัว ได้ $3^2$ จึงเขียนเป็น $2^3 \\times 3^2$ ตรวจ: $8 \\times 9 = 72 = 2 \\times 2 \\times 2 \\times 3 \\times 3$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.exp.p010
    topics: [math.number.exponents]
    difficulty: 4
    type: numeric
    stem: "หาค่า $(-1)^{25} + (-1)^{10} + 0^7$"
    answer: { value: 0 }
    hints:
      - "$(-1)$ ยกกำลังคี่ได้ $-1$ ยกกำลังคู่ได้ $1$"
      - "ศูนย์คูณกันกี่ครั้งก็ได้ศูนย์"
    misconceptions:
      - { match: 2, feedback: "ดูเหมือนคิดว่า $(-1)^{25} = 1$ เลขชี้กำลัง 25 เป็นจำนวนคี่ ผลจึงเป็น $-1$" }
      - { match: 1, feedback: "ดูเหมือนคิดว่า $0^7 = 1$ แต่ $0^7 = 0 \\times 0 \\times \\cdots \\times 0 = 0$" }
    solution: "$(-1)^{25} = -1$ (คี่) · $(-1)^{10} = 1$ (คู่) · $0^7 = 0$ รวม $-1 + 1 + 0 = 0$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.exp.p011
    topics: [math.number.exponents]
    difficulty: 4
    type: numeric
    stem: "หาค่า $(2 \\times 3)^2 - 2 \\times 3^2$"
    answer: { value: 18 }
    hints:
      - "พจน์แรกมีวงเล็บ ให้คูณในวงเล็บก่อนแล้วจึงยกกำลัง"
      - "พจน์หลังไม่มีวงเล็บ เลขยกกำลังใช้กับ 3 ตัวเดียว ให้ยกกำลังก่อนแล้วจึงคูณ 2"
    misconceptions:
      - { match: 0, feedback: "ดูเหมือนคิดว่า $(2 \\times 3)^2$ กับ $2 \\times 3^2$ เท่ากัน แต่ $(2 \\times 3)^2 = 36$ ขณะที่ $2 \\times 3^2 = 18$" }
    solution: "$(2 \\times 3)^2 = 6^2 = 36$ และ $2 \\times 3^2 = 2 \\times 9 = 18$ ดังนั้น $36 - 18 = 18$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.exp.p012
    topics: [math.number.exponents]
    difficulty: 4
    type: order
    stem: "เรียงเลขยกกำลังต่อไปนี้จากค่าน้อยไปมาก"
    items:
      - "$5^2$"
      - "$3^3$"
      - "$2^5$"
      - "$4^3$"
      - "$10^2$"
    hints:
      - "อย่าดูแค่ฐานหรือเลขชี้กำลัง ให้หาค่าจริงของแต่ละตัว"
      - "คำนวณทีละตัว เช่น $3^3 = 3 \\times 3 \\times 3$ แล้วจึงเรียง"
    solution: "$5^2 = 25$, $3^3 = 27$, $2^5 = 32$, $4^3 = 64$, $10^2 = 100$ จึงเรียงเป็น $5^2 < 3^3 < 2^5 < 4^3 < 10^2$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.exp.p013
    topics: [math.number.exponents]
    difficulty: 5
    type: numeric
    stem: "หาค่า $[(-2)^3 + 4^2] \\div 2^3 \\times (-3)^2$"
    answer: { value: 9 }
    hints:
      - "หาค่าเลขยกกำลังทุกตัวก่อน ระวังเครื่องหมายของ $(-2)^3$"
      - "ทำในวงเล็บเหลี่ยมให้เสร็จ แล้วหารและคูณ **จากซ้ายไปขวา**"
    misconceptions:
      - { match: 27, feedback: "ดูเหมือนคิดว่า $(-2)^3 = 8$ เลขชี้กำลังคี่กับฐานลบได้ผลเป็นลบ $(-2)^3 = -8$" }
      - { match: 0.111, feedback: "ดูเหมือนคูณก่อนหาร คือ $8 \\div (8 \\times 9)$ การคูณและหารต้องทำจากซ้ายไปขวา จึงต้องหาร 8 ก่อน" }
    solution: "$(-2)^3 = -8$, $4^2 = 16$, $2^3 = 8$, $(-3)^2 = 9$ → $[-8 + 16] \\div 8 \\times 9 = 8 \\div 8 \\times 9 = 1 \\times 9 = 9$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.exp.p014
    topics: [math.number.exponents]
    difficulty: 5
    type: numeric
    stem: "น้องเริ่มหยอดกระปุกออมสิน วันที่ 1 หยอด 1 บาท วันต่อ ๆ ไปหยอดเป็นสองเท่าของวันก่อนหน้าเสมอ วันที่ 10 น้องต้องหยอดเงินกี่บาท"
    answer: { value: 512, unit: บาท }
    hints:
      - "วันที่ 1 หยอด 1 บาท วันที่ 2 หยอด 2 บาท วันที่ 3 หยอด $2 \\times 2$ บาท"
      - "วันที่ $n$ หยอด $2^{n-1}$ บาท เพราะวันแรกยังไม่ได้คูณ 2 เลย"
    misconceptions:
      - { match: 1024, feedback: "นั่นคือ $2^{10}$ แต่วันที่ 1 หยอด 1 บาทซึ่งยังไม่ได้คูณ 2 เลย วันที่ 10 จึงคูณ 2 ไปแค่ 9 ครั้ง" }
      - { match: 20, feedback: "นั่นคือ $2 \\times 10$ แต่เงินที่หยอดไม่ได้เพิ่มทีละ 2 บาท ทุกวันเงิน **คูณ** 2" }
    solution: "วันที่ 1: $1$ บาท · วันที่ 2: $2^1$ · วันที่ 3: $2^2$ · … · วันที่ 10: $2^9 = 512$ บาท ตรวจด้วยการไล่ทีละวัน: 1, 2, 4, 8, 16, 32, 64, 128, 256, 512 ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true
