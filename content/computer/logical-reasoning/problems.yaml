    ai_assisted: true

  - id: computer.algorithms.logical-reasoning.p014
    topics: [computer.algorithms.logical-reasoning]
    difficulty: 4
    type: numeric
    stem: "ร้านค้าคิดค่าส่ง: ถ้ายอดซื้อตั้งแต่ 500 บาทขึ้นไป ส่งฟรี ไม่เช่นนั้น ถ้าเป็นสมาชิก ค่าส่ง 20 บาท ไม่เช่นนั้นค่าส่ง 50 บาท พี่ฝ้ายเป็นสมาชิก ซื้อเสื้อ 2 ตัว ตัวละ 230 บาท ต้องจ่ายทั้งหมดกี่บาท"
    answer: { value: 480, unit: บาท }
    hints:
      - "หายอดซื้อก่อน แล้วตรวจเงื่อนไขแรก"
      - "ยอดซื้อไม่ถึง 500 จึงไปตรวจว่าเป็นสมาชิกหรือไม่"
    misconceptions:
      - { match: 460, feedback: "460 คือยอดซื้ออย่างเดียว ยอดไม่ถึง 500 จึงยังต้องบวกค่าส่ง" }
      - { match: 510, feedback: "พี่ฝ้ายเป็นสมาชิก ค่าส่งจึงเป็น 20 บาท ไม่ใช่ 50 บาท" }
    solution: "ยอดซื้อ 2 × 230 = 460 บาท 460 ≥ 500 เท็จ → เป็นสมาชิก จริง → ค่าส่ง 20 บาท รวม 460 + 20 = 480 บาท"
