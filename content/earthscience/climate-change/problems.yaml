    solution: "$\\tfrac12 \\times 40 \\times n = 1{,}150$ ได้ $n = 1{,}150 / 20 = 57.5$ ปี คือถึงศูนย์ราว ค.ศ. 2077 แต่เป้าหมาย 1.5 °C ต้องถึงศูนย์เร็วกว่านี้มาก"
