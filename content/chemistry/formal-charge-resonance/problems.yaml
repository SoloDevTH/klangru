problems:
  - id: chemistry.bonding.formal-charge-resonance.p001
    topics: [chemistry.bonding.formal-charge-resonance]
    difficulty: 1
    type: mcq
    stem: 'ในโครงสร้างลิวอิสของ $\mathrm{CO_2}$ อะตอม C ถูกล้อมรอบด้วยอิเล็กตรอนกี่ตัว ตามกฎออกเตต'
    choices:
      - { id: a, text: '4', feedback: 'นี่คือจำนวนอิเล็กตรอนวาเลนซ์ของ C เท่านั้น ยังไม่ได้นับอิเล็กตรอนในพันธะคู่ทั้งสอง' }
      - { id: b, text: '6', feedback: 'ยังนับไม่ครบ พันธะคู่แต่ละพันธะมีอิเล็กตรอนร่วม 4 ตัว ต้องนับรอบ C ทั้งหมด' }
      - { id: c, text: '8', correct: true, feedback: 'ถูก C มีพันธะคู่กับ O สองข้าง รวม 4 พันธะ ใช้อิเล็กตรอนร่วม 8 ตัว ครบออกเตต' }
      - { id: d, text: '10', feedback: 'ออกเตตขยายเกิดกับอะตอมกลางบางชนิด แต่ C ในคาร์บอนไดออกไซด์ยึดตามกฎออกเตตปกติ' }
    hints:
      - 'นับอิเล็กตรอนที่อยู่รอบอะตอม C ทั้งคู่โดดและอิเล็กตรอนที่ใช้ร่วมในพันธะ'
      - 'พันธะคู่หนึ่งพันธะให้อิเล็กตรอนรอบอะตอมนั้น 4 ตัว'
    solution: 'C มีพันธะคู่ 2 พันธะ (ข้างละหนึ่ง) รวมเป็น 4 พันธะ ได้อิเล็กตรอนรอบ C 8 ตัว ตรงกับกฎออกเตต'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.formal-charge-resonance.p002
    topics: [chemistry.bonding.formal-charge-resonance]
    difficulty: 1
    type: numeric
    stem: 'จำนวนอิเล็กตรอนวาเลนซ์ทั้งหมดของไอออน $\mathrm{NO_2^{-}}$ เป็นเท่าใด (ตอบเป็นจำนวนเต็ม)'
    answer: { value: 18, tolerance: 0 }
    hints:
      - 'นับอิเล็กตรอนวาเลนซ์ของ N และ O แต่ละอะตอม (N มี 5 ตัว O มี 6 ตัว)'
      - 'ไอออนลบมีอิเล็กตรอนเพิ่มจากประจุ 1 ตัว อย่าลืมบวกเพิ่ม'
    misconceptions:
      - { match: 17, feedback: 'ลืมบวกอิเล็กตรอนเพิ่มจากประจุลบ −1 ของไอออน' }
    solution: 'N: 5 + O: 6 × 2 + ประจุลบ 1 = 5 + 12 + 1 = 18 อิเล็กตรอน'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.formal-charge-resonance.p003
    topics: [chemistry.bonding.formal-charge-resonance]
    difficulty: 2
    type: numeric
    stem: 'โอโซน ($\mathrm{O_3}$) ใช้ฆ่าเชื้อในโรงงานน้ำดื่มบรรจุขวดหลายแห่งในประเทศไทย โครงสร้างแบบหนึ่งเขียนเป็น $\mathrm{O{=}O{-}O}$ (ไม่ได้แสดงประจุ) โดย O ตัวกลางมีพันธะคู่กับ O ซ้าย พันธะเดี่ยวกับ O ขวา และมีคู่โดด 1 คู่ จงหาประจุฟอร์มัลของ O ตัวกลาง (ตอบเป็นจำนวนเต็ม)'
    answer: { value: 1, tolerance: 0 }
    hints:
      - 'ใช้สูตร FC เท่ากับวาเลนซ์ของ O ลบด้วยอิเล็กตรอนในคู่โดด ลบด้วยจำนวนพันธะ'
      - 'O ตัวกลางมีพันธะรวม 3 พันธะ (พันธะคู่นับเป็น 2 พันธะ) และมีอิเล็กตรอนในคู่โดด 2 ตัว'
    misconceptions:
      - { match: 0, feedback: 'ค่า 0 มาจากการสรุปว่าอะตอมกลางเป็นกลางโดยไม่คำนวณ ถ้าคิดจริงจะได้ 6 − 2 − 3 = +1' }
    solution: 'O ตัวกลาง: $V = 6$, คู่โดด 1 คู่ (อิเล็กตรอน 2 ตัว), พันธะรวม 3 พันธะ $FC = 6 - 2 - 3 = +1$'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.formal-charge-resonance.p004
    topics: [chemistry.bonding.formal-charge-resonance]
    difficulty: 2
    type: numeric
    stem: 'ไอออนไนไทรต์ $\mathrm{NO_2^{-}}$ (จากโซเดียมไนไทรต์ที่ใช้ถนอมกุนเชียงและไส้กรอกในปริมาณที่กฎหมายกำหนด) โครงสร้างหนึ่งมีพันธะคู่ $\mathrm{N{=}O}$ 1 ตำแหน่ง พันธะเดี่ยว $\mathrm{N{-}O}$ 1 ตำแหน่ง และ N มีคู่โดด 1 คู่ จงหาประจุฟอร์มัลของ N (ตอบเป็นจำนวนเต็ม)'
    answer: { value: 0, tolerance: 0 }
    hints:
      - 'N มีอิเล็กตรอนวาเลนซ์ 5 ตัว ในโครงสร้างนี้ N มีคู่โดด 1 คู่ (2 ตัว)'
      - 'นับพันธะทั้งหมดที่ N มีให้ครบ โดยพันธะคู่นับเป็นสองพันธะ'
    misconceptions:
      - { match: 1, feedback: 'ลืมหักอิเล็กตรอนในคู่โดดบน N ซึ่งมี 2 ตัว (คิดเหมือน N ในไนเทรตที่ไม่มีคู่โดด)' }
      - { match: -1, feedback: 'นำประจุ −1 ของไอออนมาใส่ที่ N แต่ประจุนั้นอยู่บน O ที่มีพันธะเดี่ยว' }
    solution: 'N: $V = 5$, คู่โดด 1 คู่ (2 ตัว), พันธะรวม $2 + 1 = 3$ พันธะ $FC = 5 - 2 - 3 = 0$ O ของพันธะคู่มี FC = 0 และ O ของพันธะเดี่ยว (คู่โดด 3 คู่) มี FC = −1 ผลรวม $0 + 0 - 1 = -1$ ตรงกับประจุของไอออน'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.formal-charge-resonance.p005
    topics: [chemistry.bonding.formal-charge-resonance]
    difficulty: 2
    type: mcq
    stem: 'แก๊สไนตริกออกไซด์ ($\mathrm{NO}$) จากไอเสียรถยนต์และโรงงาน เป็นข้อยกเว้นของกฎออกเตต เพราะเหตุใด'
    choices:
      - { id: a, text: 'จำนวนอิเล็กตรอนวาเลนซ์รวม 11 ตัวเป็นเลขคี่ จับคู่เป็นพันธะไม่หมด', correct: true, feedback: 'ถูก อิเล็กตรอนเดี่ยวหนึ่งตัวทำให้อะตอมอย่างน้อยหนึ่งอะตอมไม่ครบออกเตตไม่ว่าจะเขียนอย่างไร' }
      - { id: b, text: 'N มีอิเล็กตรอน 5 ตัวจึงสร้างพันธะได้เพียง 3 พันธะเสมอ', feedback: 'ข้อความนี้ไม่ถูกต้องทั้งหมด N สร้างพันธะได้มากกว่านั้นได้ และไม่ใช่เหตุหลักที่ทำให้เป็นข้อยกเว้น' }
      - { id: c, text: 'O ดึงอิเล็กตรอนแรงเกินไปจนอิเล็กตรอนหายไปหนึ่งตัว', feedback: 'อิเล็กตรอนไม่ได้หายไป ไม่มีการเปลี่ยนแปลงจำนวนอิเล็กตรอนในโครงสร้างลิวอิส' }
      - { id: d, text: 'โมเลกุลมีพันธะสามเสมอจึงเกินออกเตต', feedback: 'NO ไม่มีพันธะสาม การเกินออกเตตไม่ใช่เหตุผลของ NO' }
    hints:
      - 'ลองนับจำนวนอิเล็กตรอนวาเลนซ์รวมของ N และ O (5 + 6)'
      - 'อิเล็กตรอนที่จับคู่ไม่ได้จะเหลืออยู่เป็นอิเล็กตรอนเดี่ยว'
    solution: 'N มี 5 อิเล็กตรอน O มี 6 รวม 11 เป็นเลขคี่ จึงไม่สามารถจับคู่ให้ครบออกเตตทุกอะตอมได้ NO จึงมีอิเล็กตรอนเดี่ยวหนึ่งตัว'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.formal-charge-resonance.p006
    topics: [chemistry.bonding.formal-charge-resonance]
    difficulty: 2
    type: mcq
    stem: 'โมเลกุล $\mathrm{BF_3}$ เป็นข้อยกเว้นของกฎออกเตตแบบใด'
    choices:
      - { id: a, text: 'อะตอมกลาง B ล้อมรอบด้วยอิเล็กตรอน 10 ตัว (ออกเตตขยาย)', feedback: 'B อยู่คาบ 2 ไม่มีออร์บิทัล d ที่รองรับการขยายออกเตต' }
      - { id: b, text: 'จำนวนอิเล็กตรอนวาเลนซ์รวมเป็นเลขคี่', feedback: 'BF₃ มีอิเล็กตรอนวาเลนซ์รวม 24 ตัว ซึ่งเป็นเลขคู่' }
      - { id: c, text: 'อะตอมกลาง B ล้อมรอบด้วยอิเล็กตรอนเพียง 6 ตัว (ออกเตตไม่ครบ)', correct: true, feedback: 'ถูก B มีพันธะเดี่ยวสามพันธะ ใช้อิเล็กตรอน 6 ตัว และไม่มีคู่โดดบน B' }
      - { id: d, text: 'อะตอมกลาง B ล้อมรอบด้วยอิเล็กตรอน 8 ตัวครบออกเตต', feedback: 'ถ้า B ครบออกเตตจะต้องมีคู่โดดซึ่ง BF₃ ไม่มี' }
    hints:
      - 'นับจำนวนพันธะที่ B สร้าง และดูว่ามีคู่โดดบน B หรือไม่'
      - 'อะตอมกลางบางชนิดอยู่ในกลุ่ม 13 และมีอิเล็กตรอนน้อยกว่า 8 ได้'
    solution: 'B มีพันธะเดี่ยว 3 พันธะกับ F ใช้อิเล็กตรอนร่วม 6 ตัวรอบ B ไม่มีคู่โดด จึงขาดออกเตต ซึ่งพบได้กับสารประกอบของโบรอนและอลูมิเนียมบางชนิด'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.formal-charge-resonance.p007
    topics: [chemistry.bonding.formal-charge-resonance]
    difficulty: 2
    type: match
    stem: 'จับคู่สารกับลักษณะของข้อยกเว้นของกฎออกเตต'
    pairs:
      - { left: '$\mathrm{NO}$', right: 'จำนวนอิเล็กตรอนวาเลนซ์เป็นเลขคี่' }
      - { left: '$\mathrm{BF_3}$', right: 'อะตอมกลางมีอิเล็กตรอนล้อมรอบน้อยกว่า 8 ตัว' }
      - { left: '$\mathrm{PCl_5}$', right: 'อะตอมกลางคาบ 3 ขึ้นไป ล้อมรอบมากกว่า 8 ตัว' }
      - { left: '$\mathrm{SF_6}$', right: 'อะตอมกลางล้อมรอบด้วยอิเล็กตรอน 12 ตัว' }
    hints:
      - 'ดูว่าสารแต่ละชนิดมีอิเล็กตรอนรวมเป็นเลขคู่หรือคี่'
      - 'ถ้าอะตอมกลางมีอิเล็กตรอนล้อมรอบมากกว่า 8 ตัว เรียกว่าออกเตตขยาย'
    solution: 'NO มีอิเล็กตรอนรวม 11 ตัวซึ่งเป็นเลขคี่ BF₃ อะตอมกลางมี 6 ตัว PCl₅ อะตอมกลางอยู่คาบ 3 มี 10 ตัว และ SF₆ มี 12 ตัว'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.formal-charge-resonance.p008
    topics: [chemistry.bonding.formal-charge-resonance]
    difficulty: 2
    type: numeric
    stem: 'โมเลกุลซัลเฟอร์เฮกซะฟลูออไรด์ $\mathrm{SF_6}$ ที่ใช้เป็นฉนวนไฟฟ้าแรงสูง มีอิเล็กตรอนวาเลนซ์รวมทั้งหมดกี่ตัว (ตอบเป็นจำนวนเต็ม)'
    answer: { value: 48, tolerance: 0 }
    hints:
      - 'S มีอิเล็กตรอนวาเลนซ์ 6 ตัว และ F แต่ละอะตอมมี 7 ตัว'
      - 'รวมอิเล็กตรอนของ S 1 อะตอมกับ F 6 อะตอม'
    misconceptions:
      - { match: 42, feedback: 'ลืมนับอิเล็กตรอนวาเลนซ์ของ S ตัวกลางไป 6 ตัว ต้องรวมทุกอะตอม' }
    solution: 'S: 6 + F: 7 × 6 = 6 + 42 = 48 อิเล็กตรอน'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.formal-charge-resonance.p009
    topics: [chemistry.bonding.formal-charge-resonance]
    difficulty: 3
    type: mcq
    stem: 'เมื่อมีหลายโครงสร้างลิวอิสที่เป็นไปได้ ข้อใดเป็นเกณฑ์ที่ใช้เลือกโครงสร้างที่เหมาะสมที่สุดได้ถูกต้อง'
    choices:
      - { id: a, text: 'ประจุฟอร์มัลใกล้ศูนย์มากที่สุด และประจุลบอยู่บนอะตอมที่มีค่าอิเล็กโทรเนกาติวิตีสูงกว่า', correct: true, feedback: 'ถูก เป็นเกณฑ์ที่ใช้ได้โดยทั่วไปในการคัดเลือกโครงสร้าง' }
      - { id: b, text: 'ประจุฟอร์มัลของทุกอะตอมต้องเป็นบวก', feedback: 'ไม่มีข้อกำหนดนั้น ประจุฟอร์มัลลบก็เป็นไปได้' }
      - { id: c, text: 'ประจุลบควรอยู่บนอะตอมที่มีค่าอิเล็กโทรเนกาติวิตีต่ำ', feedback: 'ตรงข้าม อะตอมที่ดึงอิเล็กตรอนได้ดีกว่าเหมาะจะรับประจุลบมากกว่า' }
      - { id: d, text: 'ผลรวมของประจุฟอร์มัลไม่จำเป็นต้องเท่ากับประจุของอนุภาค', feedback: 'ผลรวมของประจุฟอร์มัลเท่ากับประจุรวมของโมเลกุลหรือไอออนเสมอ' }
    hints:
      - 'โครงสร้างที่ดีควรมีประจุฟอร์มัลน้อยที่สุด'
      - 'ดูว่าประจุลบควรอยู่บนอะตอมที่ดึงอิเล็กตรอนได้ดีกว่า เช่น O มากกว่า C หรือ N'
    solution: 'เกณฑ์ที่ใช้เลือกคือ FC ใกล้ศูนย์ที่สุด ประจุลบบนอะตอมที่มี EN สูง และไม่ให้ประจุบวกและลบที่อยู่ติดกันจนขัดกัน'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.formal-charge-resonance.p010
    topics: [chemistry.bonding.formal-charge-resonance]
    difficulty: 3
    type: numeric
    stem: 'ไอออนแอมโมเนียม $\mathrm{NH_4^{+}}$ เป็นรูปหนึ่งของไนโตรเจนที่พืชในนาข้าวดูดไปใช้ได้ โครงสร้างลิวอิสมีพันธะ N–H 4 พันธะ ไม่มีคู่โดดบน N จงหาประจุฟอร์มัลของ N (ตอบเป็นจำนวนเต็ม)'
    answer: { value: 1, tolerance: 0 }
    hints:
      - 'N มีอิเล็กตรอนวาเลนซ์ 5 ตัว และพันธะรวม 4 พันธะ'
      - 'คำนวณ FC ของ N แล้วดูว่าผลรวมของประจุที่คำนวณได้ตรงกับประจุของไอออนหรือไม่'
    misconceptions:
      - { match: 0, feedback: 'คิดว่าไอออนเป็นกลาง แต่ $\mathrm{NH_4^{+}}$ มีประจุ +1 ซึ่งต้องปรากฏที่ N' }
    solution: 'N: $V = 5$, คู่โดด 0, พันธะ 4 พันธะ $FC = 5 - 0 - 4 = +1$ H แต่ละอะตอมมีพันธะเดี่ยว 1 พันธะ $FC = 1 - 0 - 1 = 0$ ผลรวม $+1$ ตรงกับประจุของไอออน'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.formal-charge-resonance.p011
    topics: [chemistry.bonding.formal-charge-resonance]
    difficulty: 3
    type: numeric
    stem: 'ไอออน $\mathrm{NO_3^{-}}$ มีโครงสร้างเรโซแนนซ์สามแบบ โดยมีพันธะ N–O จำนวน 3 ตำแหน่ง ในแต่ละแบบมีพันธะคู่ 1 ตำแหน่งและพันธะเดี่ยว 2 ตำแหน่ง อันดับพันธะเฉลี่ยของแต่ละตำแหน่ง N–O คือเท่าใด (ตอบทศนิยม 2 ตำแหน่ง)'
    answer: { value: 1.33, tolerance: 0.01 }
    hints:
      - 'รวมจำนวนพันธะทั้งหมดในโครงสร้างหนึ่งแบบ (พันธะคู่นับเป็น 2)'
      - 'หารจำนวนพันธะรวมด้วยจำนวนตำแหน่งพันธะ N–O ที่ต่างกัน'
    misconceptions:
