<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="sans-serif">
<title>สามแบบการสื่อสาร ยอมตาม ก้าวร้าว และมั่นใจอย่างให้เกียรติ</title>
<rect x="0" y="0" width="800" height="340" fill="#ffffff"/>
<rect x="20" y="60" width="230" height="260" rx="12" fill="#f7e6a1" stroke="#222" stroke-width="2.5"/>
<text x="135.0" y="96" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">ยอมตาม</text>
<line x1="38" y1="112" x2="232" y2="112" stroke="#222" stroke-width="1.5"/>
<text x="135.0" y="150" text-anchor="middle" font-size="16" font-style="italic" fill="#222">ตัวอย่างประโยค:</text>
<text x="135.0" y="180" text-anchor="middle" font-size="17" fill="#222">ก็ได้</text>
<text x="135.0" y="206" text-anchor="middle" font-size="17" fill="#222">ตามใจเธอก็แล้วกัน</text>
<text x="135.0" y="272" text-anchor="middle" font-size="16" fill="#222">ไม่บอกความต้องการ</text>
<text x="135.0" y="296" text-anchor="middle" font-size="16" fill="#222">ของตัวเอง</text>
<rect x="262" y="60" width="230" height="260" rx="12" fill="#f2b77a" stroke="#222" stroke-width="2.5"/>
<text x="377.0" y="96" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">ก้าวร้าว</text>
<line x1="280" y1="112" x2="474" y2="112" stroke="#222" stroke-width="1.5"/>
<text x="377.0" y="150" text-anchor="middle" font-size="16" font-style="italic" fill="#222">ตัวอย่างประโยค:</text>
<text x="377.0" y="180" text-anchor="middle" font-size="17" fill="#222">เธอนี่มันโง่จริง ๆ</text>
<text x="377.0" y="206" text-anchor="middle" font-size="17" fill="#222">ทำไมไม่ฟังฉัน</text>
<text x="377.0" y="272" text-anchor="middle" font-size="16" fill="#222">ดูถูกและบังคับ</text>
<text x="377.0" y="296" text-anchor="middle" font-size="16" fill="#222">อีกฝ่าย</text>
<rect x="504" y="60" width="230" height="260" rx="12" fill="#cfe9c4" stroke="#222" stroke-width="2.5"/>
<text x="619.0" y="96" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">มั่นใจและให้เกียรติ</text>
<line x1="522" y1="112" x2="716" y2="112" stroke="#222" stroke-width="1.5"/>
<text x="619.0" y="150" text-anchor="middle" font-size="16" font-style="italic" fill="#222">ตัวอย่างประโยค:</text>
<text x="619.0" y="180" text-anchor="middle" font-size="17" fill="#222">ฉันรู้สึกไม่สบายใจ</text>
<text x="619.0" y="206" text-anchor="middle" font-size="17" fill="#222">ฉันขอเลือกรอบนี้นะ</text>
<text x="619.0" y="272" text-anchor="middle" font-size="16" fill="#222">บอกความต้องการ</text>
<text x="619.0" y="296" text-anchor="middle" font-size="16" fill="#222">และเคารพอีกฝ่าย</text>
</svg>
