id: computer.data.binary
subject: computer
title: { th: การแทนข้อมูลด้วยเลขฐานสอง, en: Binary data representation }
summary: บิตและไบต์ แปลงเลขฐานสองกับฐานสิบ และดูว่าคอมพิวเตอร์เก็บตัวอักษร ภาพ และเสียงเป็นตัวเลขอย่างไร พร้อมคำนวณขนาดข้อมูล
difficulty: 2.5
minutes: 35
prerequisites: [math.number.place-value]
encompasses:
  - { id: math.number.place-value, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: place-values.svg
    alt: "แถวของกล่อง 8 กล่องแทน 1 ไบต์ เหนือกล่องเขียนค่าประจำหลักจากซ้ายไปขวา 128, 64, 32, 16, 8, 4, 2, 1 ในกล่องเป็นบิต 0 0 0 1 1 0 0 1 กล่องที่เป็น 1 อยู่หลัก 16, 8 และ 1 ด้านล่างเขียนว่า 16 + 8 + 1 = 25"
    caption: "เลข $25$ เก็บใน 1 ไบต์เป็น $00011001_2$ บวกค่าประจำหลักเฉพาะช่องที่เป็น 1"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: com.bin.p003, prompt: "ลองแปลงเองก่อนดูตัวอย่างถัดไป" }
  - type: worked-example
    title: แปลง 45 เป็นเลขฐานสองด้วยการลบค่าประจำหลัก
    problem: "เขียน $45_{10}$ เป็นเลขฐานสอง"
    steps:
      - text: "ไล่ค่าประจำหลักของฐานสอง: 1, 2, 4, 8, 16, 32, 64 ค่าที่มากที่สุดที่ไม่เกิน 45 คือ 32"
        why: "64 มากกว่า 45 จึงไม่มีหลัก 64 ตัวเลขจะเริ่มที่หลัก 32"
      - text: "$45 - 32 = 13$ ใส่ 1 ที่หลัก 32"
      - text: "หลัก 16 มากกว่า 13 ใส่ 0 จากนั้น $13 - 8 = 5$ ใส่ 1 ที่หลัก 8"
        why: "ทุกหลักที่ข้ามไปต้องใส่ 0 ไว้ ไม่อย่างนั้นตำแหน่งของหลักอื่นจะเลื่อน"
      - text: "$5 - 4 = 1$ ใส่ 1 ที่หลัก 4 หลัก 2 ใส่ 0 และ $1 - 1 = 0$ ใส่ 1 ที่หลัก 1"
      - text: "เรียงจากหลัก 32 ลงมาหลัก 1: $101101_2$ ตรวจ: $32 + 8 + 4 + 1 = 45$ ✓"
    answer: "$45_{10} = 101101_2$"
  - type: worked-example
    title: ภาพถ่ายหนึ่งภาพใช้ข้อมูลเท่าไร
    problem: "ภาพสีขนาด $1280 \\times 720$ พิกเซล เก็บแบบ RGB สีละ 1 ไบต์ โดยไม่บีบอัด ใช้ข้อมูลกี่เมกะไบต์ (ให้ $1\\ \\mathrm{MB} = 1{,}000{,}000$ ไบต์)"
    steps:
      - text: "จำนวนพิกเซล: $1280 \\times 720 = 921{,}600$ พิกเซล"
      - text: "แต่ละพิกเซลเก็บแดง เขียว น้ำเงิน สีละ 1 ไบต์ จึงใช้ $3$ ไบต์ต่อพิกเซล"
        why: "หนึ่งพิกเซลไม่ได้เก็บเลขเดียว แต่เก็บความเข้มของแสงสามสีที่ผสมกันเป็นสีที่เห็น"
      - text: "ขนาดข้อมูล: $921{,}600 \\times 3 = 2{,}764{,}800$ ไบต์"
      - text: "แปลงเป็นเมกะไบต์: $2{,}764{,}800 \\div 1{,}000{,}000 \\approx 2.76\\ \\mathrm{MB}$"
        why: "ถ้าต้องการคำตอบเป็นบิตจึงคูณ 8 แต่โจทย์ถามเป็นไบต์ จึงไม่ต้องคูณ"
    answer: "ประมาณ $2.76\\ \\mathrm{MB}$ (ไฟล์ JPEG จริงเล็กกว่านี้มากเพราะถูกบีบอัด)"
  - { type: check, problem: com.bin.p010, prompt: "ใช้วิธีเดียวกันกับภาพขาวดำ" }
  - type: interactive
    title: 1011 ในฐานสองคือ 8 + 2 + 1
    caption: "เริ่มจาก 0 แล้วกระโดดตามค่าประจำหลักของบิตที่เป็น 1 ใน 1011 คือ 8, 2 และ 1 (หลัก 4 เป็น 0 จึงไม่กระโดด) ไปหยุดที่ 11 ลองนึกว่า 1101 จะกระโดดอย่างไร และไปหยุดที่เลขใด"
    widget:
      kind: number-line
      min: 0
      max: 16
      points:
        - { value: 11, label: "1011 = 11" }
      jumps:
        - { from: 0, to: 8, label: "+8" }
        - { from: 8, to: 10, label: "+2" }
        - { from: 10, to: 11, label: "+1" }
glossary:
  - { term: บิต (bit), definition: "หลักเดียวของเลขฐานสอง มีค่าเป็น 0 หรือ 1 เป็นหน่วยข้อมูลที่เล็กที่สุด" }
  - { term: ไบต์ (byte), definition: "บิต 8 บิตเรียงกัน แทนได้ $2^8 = 256$ แบบ เช่น จำนวน 0 ถึง 255" }
  - { term: เลขฐานสอง, definition: "ระบบเลขที่ใช้เลขโดด 0 และ 1 ค่าประจำหลักจากขวาไปซ้ายคือ 1, 2, 4, 8, 16, … เพิ่มทีละ 2 เท่า" }
  - { term: พิกเซล, definition: "จุดสี่เหลี่ยมเล็กที่สุดของภาพดิจิทัล แต่ละพิกเซลเก็บตัวเลขบอกสี เช่น ค่า R G B" }
  - { term: ยูนิโคด (Unicode), definition: "มาตรฐานที่ให้รหัสตัวเลขแก่อักขระของทุกภาษา เมื่อบันทึกแบบ UTF-8 อักษรไทยใช้ 3 ไบต์ต่ออักขระ" }
flashcards:
  - { front: "$n$ บิตเรียงได้กี่แบบ", back: "$2^n$ แบบ เช่น 8 บิตได้ 256 แบบ ค่ามากสุดเมื่อเริ่มนับที่ 0 คือ 255" }
  - { front: "แปลงฐานสิบเป็นฐานสองด้วยการหาร", back: "หารด้วย 2 ไปเรื่อย ๆ จนผลหารเป็น 0 แล้วอ่านเศษจากล่างขึ้นบน" }
  - { front: "$1011_2$ เท่ากับเท่าใดในฐานสิบ", back: "$8 + 2 + 1 = 11$" }
  - { front: "ขนาดภาพสี RGB ก่อนบีบอัด", back: "กว้าง × สูง × 3 ไบต์ (สีละ 1 ไบต์)" }
  - { front: "อักษรไทย 1 ตัวใช้กี่ไบต์ใน UTF-8", back: "3 ไบต์ สระบนล่างและวรรณยุกต์นับเป็นอักขระแยก" }
