<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" font-family="sans-serif">
<title>ตำแหน่งรากตัวส่วนบนระนาบ s ได้แก่ −1 บวกหรือลบ 2i และจุด −1 กับ −2 บนแกนจริง</title>
<rect width="480" height="320" fill="#ffffff"/>
<line x1="30" y1="165" x2="460" y2="165" stroke="#444" stroke-width="1.5"/>
<line x1="240" y1="20" x2="240" y2="300" stroke="#444" stroke-width="1.5"/>
<text x="418" y="157" font-size="13" fill="#333">Re(s)</text>
<text x="248" y="28" font-size="13" fill="#333">Im(s)</text>
<line x1="240" y1="165" x2="240" y2="165" stroke="none"/>
<path d="M194,79 L206,91 M206,79 L194,91" stroke="#d35400" stroke-width="2.5"/>
<path d="M194,239 L206,251 M206,239 L194,251" stroke="#d35400" stroke-width="2.5"/>
<path d="M194,159 L206,171 M206,159 L194,171" stroke="#d35400" stroke-width="2.5"/>
<path d="M154,159 L166,171 M166,159 L154,171" stroke="#d35400" stroke-width="2.5"/>

<text x="178" y="73.0" font-size="13" text-anchor="middle" fill="#d35400">ขั้วเชิงซ้อน −1 + 2i</text>
<text x="178" y="267.0" font-size="13" text-anchor="middle" fill="#d35400">ขั้วเชิงซ้อน −1 − 2i</text>
<text x="200.0" y="153" font-size="13" text-anchor="middle" fill="#d35400">ขั้วจริง −1</text>
<text x="160.0" y="187" font-size="13" text-anchor="middle" fill="#d35400">ขั้วจริง −2</text>
<text x="30" y="308" font-size="13" fill="#444">ขั้วทางซ้ายของแกนจินตภาพ (ส่วนจริงเป็นลบ) ให้ผลตอบสนองที่ลดลงตามเวลา</text>
</svg>
