<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="sans-serif">
<title>เรื่องสั้นสมมุติ ต้นไม้ของห้อง ป.5/1</title>
<defs></defs>
<rect x="0" y="0" width="860" height="330" fill="#fff"/>
<rect x="10.0" y="10.0" width="840.0" height="310.0" rx="10" fill="#fffdf5" stroke="#8d6e63" stroke-width="2"/>
<text x="30.0" y="46.0" font-size="22" text-anchor="start" fill="#5d4037" font-weight="bold">ต้นไม้ของห้อง ป.5/1</text>
<text x="830.0" y="46.0" font-size="14" text-anchor="end" fill="#777" font-weight="normal">(เรื่องสมมุติ)</text>
<text x="30.0" y="96.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">(1) โบรับหน้าที่รดน้ำต้นไม้หน้าห้องทุกเย็น</text>
<text x="30.0" y="142.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">(2) สัปดาห์หนึ่ง เพื่อนชวนไปเตะฟุตบอลหลังเลิกเรียน โบรีบไปเล่นจนลืมรดน้ำสามวัน</text>
<text x="30.0" y="188.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">(3) วันที่สี่ ใบไม้เหี่ยวตก โบรู้สึกผิด จึงไปบอกครูตามตรงและขอโทษเพื่อนในห้อง</text>
<text x="30.0" y="234.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">(4) โบทำป้ายเตือนติดประตูห้อง และรดน้ำให้เสร็จก่อนไปเล่นทุกวัน</text>
<text x="30.0" y="280.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">(5) สองสัปดาห์ต่อมา ต้นไม้แตกใบใหม่ ครูชมว่าโบกล้ายอมรับและแก้ไข</text>
</svg>
