<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="sans-serif" font-size="14">
<title>พีระมิดจำนวน พีระมิดมวลชีวภาพ และพีระมิดพลังงาน</title>
<rect x="0" y="0" width="900" height="360" fill="#ffffff"/>
<text x="150.0" y="40.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">พีระมิดจำนวน</text>
<text x="150.0" y="60.0" text-anchor="middle" font-size="12" fill="#555">ต้นมะม่วง 1 ต้น (ตัว)</text>
<rect x="143.0" y="218.0" width="14.0" height="42.0" rx="0" fill="#cfe6cf" stroke="#2a7a3a" stroke-width="1.5"/>
<text x="163.0" y="244.0" text-anchor="start" font-size="12" fill="#222">มะม่วง 1</text>
<rect x="50.0" y="172.0" width="200.0" height="42.0" rx="0" fill="#cfe6cf" stroke="#2a7a3a" stroke-width="1.5"/>
<text x="150.0" y="198.0" text-anchor="middle" font-size="12" fill="#222">เพลี้ย 5,000</text>
<rect x="143.0" y="126.0" width="14.0" height="42.0" rx="0" fill="#cfe6cf" stroke="#2a7a3a" stroke-width="1.5"/>
<text x="163.0" y="152.0" text-anchor="start" font-size="12" fill="#222">เต่าทอง 300</text>
<rect x="143.0" y="80.0" width="14.0" height="42.0" rx="0" fill="#cfe6cf" stroke="#2a7a3a" stroke-width="1.5"/>
<text x="163.0" y="106.0" text-anchor="start" font-size="12" fill="#222">นก 4</text>
<text x="150.0" y="288.0" text-anchor="middle" font-size="12" fill="#a22">ฐานแคบ เพราะผู้ผลิตตัวใหญ่</text>
<text x="450.0" y="40.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">พีระมิดมวลชีวภาพ</text>
<text x="450.0" y="60.0" text-anchor="middle" font-size="12" fill="#555">ทะเลเปิด (g/m²)</text>
<rect x="431.0" y="126.0" width="38.1" height="42.0" rx="0" fill="#d8e8f7" stroke="#2a7a3a" stroke-width="1.5"/>
<text x="475.0" y="152.0" text-anchor="start" font-size="12" fill="#222">แพลงก์ตอนพืช 4</text>
<rect x="350.0" y="80.0" width="200.0" height="42.0" rx="0" fill="#d8e8f7" stroke="#2a7a3a" stroke-width="1.5"/>
<text x="450.0" y="106.0" text-anchor="middle" font-size="12" fill="#222">แพลงก์ตอนสัตว์ 21</text>
<text x="450.0" y="196.0" text-anchor="middle" font-size="12" fill="#a22">ฐานแคบ เพราะแพลงก์ตอนพืช</text>
<text x="450.0" y="212.0" text-anchor="middle" font-size="12" fill="#a22">แบ่งตัวเร็วและถูกกินเร็ว</text>
<text x="750.0" y="40.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">พีระมิดพลังงาน</text>
<text x="750.0" y="60.0" text-anchor="middle" font-size="12" fill="#555">kJ/m²/ปี</text>
<rect x="650.0" y="218.0" width="200.0" height="42.0" rx="0" fill="#f7ecd0" stroke="#2a7a3a" stroke-width="1.5"/>
<text x="750.0" y="244.0" text-anchor="middle" font-size="12" fill="#222">ผู้ผลิต 15,000</text>
<rect x="740.0" y="172.0" width="20.0" height="42.0" rx="0" fill="#f7ecd0" stroke="#2a7a3a" stroke-width="1.5"/>
<text x="766.0" y="198.0" text-anchor="start" font-size="12" fill="#222">ลำดับ 1: 1,500</text>
<rect x="743.0" y="126.0" width="14.0" height="42.0" rx="0" fill="#f7ecd0" stroke="#2a7a3a" stroke-width="1.5"/>
<text x="763.0" y="152.0" text-anchor="start" font-size="12" fill="#222">ลำดับ 2: 120</text>
<rect x="743.0" y="80.0" width="14.0" height="42.0" rx="0" fill="#f7ecd0" stroke="#2a7a3a" stroke-width="1.5"/>
<text x="763.0" y="106.0" text-anchor="start" font-size="12" fill="#222">ลำดับ 3: 10</text>
<text x="750.0" y="288.0" text-anchor="middle" font-size="12" fill="#2a7a3a">ฐานกว้างเสมอ</text>
<text x="450.0" y="348.0" text-anchor="middle" font-size="12" fill="#555">ข้อมูลสมมติเพื่อแสดงรูปร่าง ความกว้างของแต่ละชั้นเป็นสัดส่วนกับค่าในชั้นนั้น</text>
</svg>