rows:
  - { framework: hsk-3-0, indicators: ["HSK3.0-L3"], coverage: partial, note: "ครอบคลุมหัวข้อ เทศกาลและประเพณี ของระดับ 3 ด้านคำศัพท์และวัฒนธรรม (春节 端午节 中秋节 元宵节 คำอวยพร) แต่ไม่ได้ฝึกอ่าน ฟัง หรือเขียนข้อความยาวระดับ 3" }
  - { framework: th-core-2551-foreign-languages, indicators: ["ต 2.1 ป.1/2", "ต 2.1 ป.3/2"], coverage: full, note: "ชื่อและคำศัพท์ของเทศกาลสำคัญ อาหาร ของใช้ และคำอวยพร พร้อมโจทย์จับคู่และเขียนคำอวยพร" }
  - { framework: th-core-2551-foreign-languages, indicators: ["ต 2.1 ป.4/2"], coverage: full, note: "ตอบคำถามเรื่องวันที่ตามปฏิทินจีน ธรรมเนียม (福 กลับหัว อั่งเปา วันจ่าย วันไหว้ วันเที่ยว) ตำนาน (屈原 嫦娥) และชีวิตความเป็นอยู่ของคนไทยเชื้อสายจีน" }
  - { framework: th-core-2551-foreign-languages, indicators: ["ต 2.2 ป.4/2", "ต 2.2 ป.5/2"], coverage: full, note: "ตารางเทียบตรุษจีนกับสงกรานต์ 中秋节 กับลอยกระทง แข่งเรือมังกรกับแข่งเรือยาว และปฏิทินจันทรคติ พร้อมโจทย์บอกความเหมือนและความต่าง" }
