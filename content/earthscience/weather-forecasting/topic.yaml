id: earthscience.atmosphere.weather-forecasting
subject: earthscience
title: { th: ลมฟ้าอากาศ พายุ และการพยากรณ์อากาศ, en: "Weather, storms and weather forecasting" }
summary: องค์ประกอบของลมฟ้าอากาศและเครื่องมือวัด ปัจจัยที่ทำให้ลมฟ้าอากาศเปลี่ยน พายุฝนฟ้าคะนองกับพายุหมุนเขตร้อน การพยากรณ์อากาศอย่างง่าย และการใช้คำพยากรณ์ให้ปลอดภัย
difficulty: 3
minutes: 35
prerequisites: [earthscience.atmosphere.atmosphere-layers, earthscience.hydrosphere.water-cycle]
encompasses:
  - { id: earthscience.atmosphere.atmosphere-layers, weight: 0.2 }
  - { id: earthscience.hydrosphere.water-cycle, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: หาความชื้นสัมพัทธ์
    problem: "ตอนเช้าที่เชียงราย อากาศมีไอน้ำ $9\\ \\mathrm{g/m^3}$ อากาศที่อุณหภูมินั้นรับไอน้ำได้มากที่สุด $12\\ \\mathrm{g/m^3}$ ความชื้นสัมพัทธ์เป็นเท่าใด และถ้าอากาศเย็นลงจนรับไอน้ำได้มากที่สุดเพียง $9\\ \\mathrm{g/m^3}$ จะเกิดอะไรขึ้น"
    steps:
      - text: "ความชื้นสัมพัทธ์ $= \\dfrac{9}{12} \\times 100\\% = 75\\%$"
      - text: "ถ้าอากาศเย็นลง ไอน้ำที่มีอยู่จริงยังเท่าเดิม คือ $9\\ \\mathrm{g/m^3}$ แต่รับได้มากที่สุดลดลงเหลือ $9\\ \\mathrm{g/m^3}$"
        why: "อากาศเย็นรับไอน้ำได้น้อยกว่าอากาศร้อน"
      - text: "ความชื้นสัมพัทธ์ $= \\dfrac{9}{9} \\times 100\\% = 100\\%$ อากาศอิ่มตัว"
      - text: "ถ้าเย็นลงอีก ไอน้ำส่วนเกินควบแน่นเป็นหยดน้ำเล็ก ๆ เกิดหมอกหรือน้ำค้าง"
    answer: "ความชื้นสัมพัทธ์ 75% เมื่ออากาศเย็นลงจนอิ่มตัวจะเกิดหมอกหรือน้ำค้าง"
  - { type: check, problem: earthscience.atmosphere.weather-forecasting.p005, prompt: "เอาไอน้ำที่มีจริงเป็นตัวตั้ง" }
  - type: figure
    title: พายุฝนฟ้าคะนองกับพายุหมุนเขตร้อน
    src: storm-types.svg
    alt: "ภาพซ้าย พายุฝนฟ้าคะนองมองด้านข้าง เมฆคิวมูโลนิมบัสสูง 10–15 กิโลเมตร ยอดเมฆแผ่เป็นรูปทั่ง ลูกศรสีแดงแสดงอากาศร้อนชื้นลอยขึ้น ลูกศรสีน้ำเงินแสดงลมกระโชกลงสู่พื้น มีฝนและฟ้าผ่า กว้างหลายกิโลเมตร เกิดนานราว 1–2 ชั่วโมง ภาพขวา พายุหมุนเขตร้อนมองจากด้านบน แถบเมฆเป็นเกลียวหลายแถบล้อมตาพายุตรงกลาง ลูกศรแสดงลมหมุนทวนเข็มนาฬิกาเข้าหาศูนย์กลางในซีกโลกเหนือ กว้างหลายร้อยกิโลเมตร อยู่ได้หลายวัน"
    caption: "พายุสองชนิดต่างกันทั้งขนาด เวลา และแหล่งพลังงาน (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: worked-example
    title: พายุจะถึงฝั่งเมื่อใด
    problem: "พายุโซนร้อนลูกหนึ่งมีศูนย์กลางอยู่กลางอ่าวไทย ห่างฝั่งจังหวัดชุมพร 360 กิโลเมตร เคลื่อนที่เข้าหาฝั่งด้วยอัตราเร็ว 15 กิโลเมตรต่อชั่วโมง ลมแรงแผ่ออกจากศูนย์กลาง 120 กิโลเมตร (ข้อมูลสมมติ) ลมแรงจะเริ่มถึงฝั่งในอีกกี่ชั่วโมง และศูนย์กลางจะขึ้นฝั่งในอีกกี่ชั่วโมง"
    steps:
      - text: "ลมแรงถึงฝั่งเมื่อขอบของลมแรงถึงฝั่ง ซึ่งศูนย์กลางยังห่างฝั่ง 120 กิโลเมตร ระยะที่ต้องเคลื่อน $= 360 - 120 = 240$ กิโลเมตร"
        why: "ลมแรงไม่ได้อยู่เฉพาะที่ศูนย์กลาง จึงมาถึงก่อนศูนย์กลาง"
      - text: "เวลา $= \\dfrac{240}{15} = 16$ ชั่วโมง"
      - text: "ศูนย์กลางขึ้นฝั่ง: เวลา $= \\dfrac{360}{15} = 24$ ชั่วโมง"
      - text: "ต้องเตรียมตัวให้เสร็จก่อนลมแรงมาถึง ไม่ใช่ก่อนศูนย์กลางมาถึง"
    answer: "ลมแรงถึงฝั่งในอีกประมาณ 16 ชั่วโมง ศูนย์กลางขึ้นฝั่งในอีกประมาณ 24 ชั่วโมง"
  - { type: check, problem: earthscience.atmosphere.weather-forecasting.p007, prompt: "เสียงเดินทางราว 340 เมตรต่อวินาที" }
glossary:
  - { term: ลมฟ้าอากาศ, definition: "สภาพของอากาศในที่หนึ่งในช่วงเวลาสั้น ๆ บอกด้วยอุณหภูมิ ความชื้น ความกดอากาศ ลม เมฆ และหยาดน้ำฟ้า" }
  - { term: ภูมิอากาศ, definition: "ลักษณะลมฟ้าอากาศเฉลี่ยของที่หนึ่งตลอดช่วงเวลายาวหลายสิบปี" }
  - { term: ความชื้นสัมพัทธ์, definition: "ร้อยละของไอน้ำที่มีอยู่จริงเทียบกับไอน้ำมากที่สุดที่อากาศอุณหภูมินั้นรับได้" }
  - { term: ความกดอากาศ, definition: "แรงที่อากาศกดลงบนพื้นที่หนึ่งหน่วย วัดด้วยบารอมิเตอร์ หน่วยเฮกโตพาสคัล (hPa)" }
  - { term: หยาดน้ำฟ้า, definition: "น้ำในรูปของเหลวหรือของแข็งที่ตกจากฟ้าถึงพื้น เช่น ฝน ลูกเห็บ หิมะ" }
  - { term: พายุหมุนเขตร้อน, definition: "พายุขนาดหลายร้อยกิโลเมตรที่เกิดเหนือทะเลเขตร้อนน้ำอุ่น ลมหมุนเข้าหาศูนย์กลางความกดอากาศต่ำ แบ่งเป็นดีเปรสชัน โซนร้อน และไต้ฝุ่น" }
  - { term: ตาพายุ, definition: "บริเวณกลางพายุหมุนเขตร้อนที่ลมสงบ ท้องฟ้าค่อนข้างโปร่ง ล้อมรอบด้วยลมแรงที่สุด" }
  - { term: การพยากรณ์อากาศ, definition: "การคาดการณ์ลมฟ้าอากาศล่วงหน้าจากข้อมูลตรวจวัดและการคำนวณด้วยแบบจำลอง" }
flashcards:
  - { front: "องค์ประกอบของลมฟ้าอากาศมีอะไรบ้าง", back: "อุณหภูมิ ความชื้น ความกดอากาศ ลม เมฆ และหยาดน้ำฟ้า" }
  - { front: "ความกดอากาศลดลงต่อเนื่อง ความชื้นเพิ่มขึ้น บอกอะไร", back: "มีโอกาสเกิดเมฆ ฝน หรือพายุ" }
  - { front: "พายุโซนร้อนมีลมสูงสุดเท่าใด", back: "63–117 km/h ต่ำกว่านั้นคือดีเปรสชัน ตั้งแต่ 118 km/h คือไต้ฝุ่น" }
  - { front: "ฝนฟ้าคะนองร้อยละ 60 ของพื้นที่ หมายความว่าอะไร", back: "คาดว่าฝนจะตกประมาณ 60 ใน 100 ส่วนของพื้นที่นั้น" }
  - { front: "ประเมินระยะฟ้าผ่าอย่างไร", back: "นับวินาทีจากฟ้าแลบถึงฟ้าร้อง ทุก 3 วินาทีประมาณ 1 กิโลเมตร" }
