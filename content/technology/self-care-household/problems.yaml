problems:
- id: technology.living.self-care-household.p001
  topics:
  - technology.living.self-care-household
  difficulty: 1
  type: order
  stem: "เรียงขั้นตอนการจัดกระเป๋านักเรียนตอนเย็น เพื่อเตรียมตัวไปโรงเรียนวันพรุ่งนี้"
  items:
  - "ดูตารางเรียนของวันพรุ่งนี้"
  - "เก็บหนังสือและสมุดที่ต้องใช้ใส่กระเป๋า"
  - "ใส่กล่องดินสอและอุปกรณ์ที่ต้องใช้"
  - "ใส่กระติกน้ำและผ้าเช็ดมือ"
  - "วางกระเป๋าไว้ที่ประตูหรือจุดที่หยิบได้ง่าย"
  hints:
  - "เริ่มจากการรู้ก่อนว่าพรุ่งนี้มีวิชาอะไรบ้าง"
  - "ของที่ต้องใช้ตามตารางควรใส่ก่อนของที่ต้องพกทุกวัน"
  - "ขั้นสุดท้ายคือการเตรียมให้หยิบกระเป๋าได้ทันทีตอนเช้า"
  solution: "ดูตารางเรียน แล้วเก็บหนังสือและสมุดที่ต้องใช้ ตามด้วยกล่องดินสอและอุปกรณ์ กระติกน้ำ และผ้าเช็ดมือ จากนั้นวางกระเป๋าไว้ที่จุดที่หยิบได้ง่าย เพราะต้องรู้ก่อนว่าต้องใช้อะไรจึงจัดของลงกระเป๋าได้ครบ"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.self-care-household.p002
  topics:
  - technology.living.self-care-household
  difficulty: 1
  type: mcq
  stem: "เพื่อนขอยืมกรรไกรไปตัดกระดาษ ข้อใดคือวิธีส่งกรรไกรให้เพื่อนอย่างปลอดภัย"
  choices:
  - id: a
    text: "ถือด้ามไว้ ยื่นปลายใบมีดที่เปิดอยู่ไปให้เพื่อนรับ"
    feedback: "ปลายแหลมชี้เข้าหาผู้รับ เสี่ยงบาดมือทั้งสองคน"
  - id: b
    text: "ปิดใบมีด จับที่ส่วนใบ แล้วหันด้ามให้เพื่อนรับ"
    correct: true
  - id: c
    text: "โยนกรรไกรไปให้เพื่อนรับเร็ว ๆ"
    feedback: "การโยนของมีคมทำให้ผู้รับไม่ทันและอาจบาดได้"
  - id: d
    text: "เปิดใบมีดค้างไว้แล้ววางบนโต๊ะให้เพื่อนหยิบเอง"
    feedback: "ใบมีดที่เปิดอยู่ทำให้มีคนเผลอจับโดนคมได้"
  hints:
  - "ของมีคมต้องคำนึงถึงทั้งคนส่งและคนรับ"
  - "ส่วนที่คมควรหันไปทางไหน และส่วนที่ไม่คมควรหันไปทางไหน"
  - "ปิดใบมีด จับส่วนใบ แล้วส่งด้ามให้ผู้รับ"
  solution: "ปิดใบมีดและจับส่วนใบซึ่งเป็นส่วนที่คมไว้ที่มือตนเอง แล้วหันด้ามให้ผู้รับ วิธีนี้ทำให้ปลายคมไม่ชี้ไปหาใคร"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.self-care-household.p003
  topics:
  - technology.living.self-care-household
  difficulty: 2
  type: numeric
  stem: "ฉลากน้ำยาถูพื้นบอกให้ผสมน้ำยา 1 ส่วนต่อน้ำ 20 ส่วน ถ้าจะใช้น้ำยา 50 มิลลิลิตร ต้องใช้น้ำกี่ลิตร (ตอบเป็นลิตร)"
  answer:
    value: 1
    tolerance: 0.01
    unit: "ลิตร"
  misconceptions:
  - match: 1000
    feedback: "1000 เป็นค่าในหน่วยมิลลิลิตร ต้องหารด้วย 1000 เพื่อแปลงเป็นลิตร"
  - match: 1.05
    feedback: "1.05 ลิตรคือน้ำยากับน้ำรวมกัน แต่โจทย์ถามเฉพาะปริมาณน้ำ"
  hints:
  - "1 ส่วนน้ำยาต่อ 20 ส่วนน้ำ หมายความว่าน้ำเป็นกี่เท่าของน้ำยา"
  - "คูณปริมาณน้ำยาด้วย 20 จะได้ปริมาณน้ำเป็นมิลลิลิตร"
  - "หารด้วย 1000 เพื่อแปลงมิลลิลิตรเป็นลิตร"
  solution: "น้ำ = 50 × 20 = 1,000 มิลลิลิตร = 1.0 ลิตร (ตรวจด้วย python3: 50*20/1000 = 1.0)"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.self-care-household.p004
  topics:
  - technology.living.self-care-household
  difficulty: 1
  type: match
  stem: "จับคู่อุปกรณ์ทำความสะอาดหรืออุปกรณ์ในบ้านกับงานที่เหมาะสม"
  pairs:
  - left: "ไม้กวาดดอกหญ้า"
    right: "กวาดพื้นกระเบื้องในบ้าน"
  - left: "ไม้กวาดทางมะพร้าว"
    right: "กวาดลานดินและเศษใบไม้นอกบ้าน"
  - left: "ถุงมือยาง"
    right: "ล้างจานที่มีคราบมันและน้ำร้อน"
  - left: "กรรไกรปลายมน"
    right: "ตัดกระดาษสำหรับงานประดิษฐ์"
  hints:
  - "ดูว่าอุปกรณ์แต่ละชิ้นทำจากอะไรและเหมาะกับพื้นผิวแบบใด"
  - "ลองดูว่างานนั้นเกิดขึ้นในบ้านหรือนอกบ้าน"
  - "ถุงมือยางช่วยป้องกันมือจากอะไร"
  solution: "ไม้กวาดดอกหญ้าเบานุ่มเหมาะกับพื้นกระเบื้องในบ้าน ไม้กวาดทางมะพร้าวแข็งและทนกว่าเหมาะกับลานดิน ถุงมือยางป้องกันมือจากคราบมันและความร้อน และกรรไกรปลายมนเหมาะกับงานตัดกระดาษทั่วไปที่ปลอดภัยกว่าปลายแหลม"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.self-care-household.p005
  topics:
  - technology.living.self-care-household
  difficulty: 2
  type: mcq
  stem: "ที่บ้านมีน้ำยาฟอกขาวที่มีคลอรีน และน้ำยาล้างห้องน้ำที่มีกรดเป็นส่วนประกอบ ข้อใดคือวิธีใช้ที่ถูกต้อง"
  choices:
  - id: a
    text: "ผสมทั้งสองชนิดแล้วเจือจางด้วยน้ำมาก ๆ เพื่อให้แรงน้อยลง"
    feedback: "การเจือจางไม่ได้ทำให้ปฏิกิริยาหายไป ยังเกิดแก๊สพิษได้"
  - id: b
    text: "ผสมกันแล้วใช้ในห้องที่ปิดประตู เพื่อให้ทำความสะอาดได้เร็วขึ้น"
    feedback: "แก๊สพิษจะสะสมในห้องปิด ซึ่งอันตรายมาก"
  - id: c
    text: "ใช้ทีละชนิด ล้างด้วยน้ำให้สะอาดก่อนเปลี่ยนชนิด และเปิดหน้าต่างให้อากาศถ่ายเท"
    correct: true
  - id: d
    text: "ผสมในถุงพลาสติกเพื่อไม่ให้กลิ่นกระจาย"
    feedback: "ถุงที่ปิดทำให้แก๊สสะสมและอาจทำให้ถุงแตกได้"
  hints:
  - "ดูที่ปฏิกิริยาระหว่างน้ำยาสองชนิด ไม่ใช่ที่ความแรงของน้ำยา"
  - "วิธีที่ถูกต้องต้องไม่ทำให้สารสองชนิดมาทำปฏิกิริยากัน"
  solution: "คลอรีนในน้ำยาฟอกขาวทำปฏิกิริยากับกรดได้แก๊สคลอรีนที่เป็นพิษ การเจือจาง การปิดห้อง หรือการใส่ถุงไม่ช่วยป้องกัน ต้องใช้ทีละชนิด ล้างให้สะอาด และระบายอากาศ"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.self-care-household.p006
  topics:
  - technology.living.self-care-household
  difficulty: 2
  type: text
  stem: "ก่อนล้างจานที่มีอาหารติดอยู่ ขั้นแรกที่ควรทำคืออะไร (ตอบเป็นข้อความสั้น ๆ)"
  accepted:
  - "เก็บเศษอาหาร"
  - "เก็บเศษอาหารออก"
  - "เก็บเศษอาหารออกจากจาน"
  misconceptions:
  - match: "เทน้ำยาเลย"
    feedback: "ถ้าเทน้ำยาก่อน เศษอาหารจะติดอยู่ในฟองน้ำและต้องใช้น้ำยามากขึ้นโดยไม่จำเป็น"
  hints:
  - "คิดถึงสิ่งที่ติดอยู่บนจานก่อนล้างทุกครั้ง"
  - "เศษอาหารควรถูกนำออกก่อนที่น้ำยาจะเข้ามาเกี่ยวข้อง"
  solution: "เก็บเศษอาหารออกจากจานก่อน แล้วจึงใช้น้ำยาและฟองน้ำล้าง วิธีนี้ทำให้ใช้น้ำยาน้อยลง ฟองน้ำไม่สกปรกเร็ว และล้างได้สะอาดขึ้น"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.self-care-household.p007
  topics:
  - technology.living.self-care-household
  difficulty: 2
  type: numeric
  stem: "ฉลากผงซักฟอกแนะนำให้ใช้ 15 กรัมต่อผ้า 2 กิโลกรัม วันนี้มีผ้าที่ต้องซัก 6 กิโลกรัม ต้องใช้ผงซักฟอกกี่กรัม (ตอบเป็นกรัม)"
  answer:
    value: 45
    tolerance: 0
    unit: "กรัม"
  misconceptions:
  - match: 15
    feedback: "ตอบ 15 กรัม เป็นปริมาณสำหรับผ้า 2 กิโลกรัมเท่านั้น ผงซักฟอกต้องเพิ่มตามน้ำหนักผ้า"
  - match: 90
    feedback: "ตอบ 90 กรัม เกิดจากคูณ 15 ด้วย 6 แต่ลืมหารด้วย 2 ก่อน"
  hints:
  - "หาก่อนว่าผ้า 6 กิโลกรัม เป็นกี่เท่าของ 2 กิโลกรัม"
  - "ผงซักฟอกต้องเพิ่มตามจำนวนชุดของผ้า"
  - "นำจำนวนชุดคูณด้วย 15 กรัม"
  solution: "6 ÷ 2 = 3 ชุด และ 15 × 3 = 45 กรัม (ตรวจด้วย python3: 15*6/2 = 45)"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.self-care-household.p008
  topics:
  - technology.living.self-care-household
  difficulty: 2
  type: mcq
  stem: "ข้อใดเป็นประโยชน์ของการพับผ้าทันทีหลังผ้าแห้ง"
  choices:
  - id: a
    text: "ทำให้ผ้าขาวขึ้นเอง"
    feedback: "การพับไม่ได้ทำให้ผ้าขาวขึ้น ความขาวขึ้นอยู่กับการซักและการฟอกที่ถูกวิธี"
  - id: b
    text: "ผ้าไม่ยับมาก และเก็บเข้าตู้ได้เป็นระเบียบ"
    correct: true
  - id: c
    text: "ทำให้ผ้านุ่มขึ้นโดยไม่ต้องซักใหม่"
    feedback: "ความนุ่มของผ้าไม่ได้เกิดจากการพับ และการทิ้งผ้าไว้เฉย ๆ ไม่ทำให้นุ่ม"
  - id: d
    text: "ทำให้ซักครั้งต่อไปใช้ผงซักฟอกน้อยลงเสมอ"
    feedback: "การพับไม่เกี่ยวกับปริมาณผงซักฟอกที่ใช้ในการซักครั้งต่อไป"
  hints:
  - "ลองนึกถึงสภาพของผ้าที่พับทันทีเทียบกับผ้าที่กองทิ้งไว้"
  - "ประโยชน์ที่ถูกต้องเกี่ยวกับความเรียบร้อยของผ้า"
  solution: "ผ้าที่พับทันทีจะยับน้อยกว่าผ้าที่กองทิ้งไว้ เก็บเข้าตู้ได้เป็นระเบียบ และช่วยให้ไม่ต้องรีดมาก"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.self-care-household.p009
  topics:
  - technology.living.self-care-household
  difficulty: 3
  type: numeric
  stem: "วิธีเดิมล้างจานโดยเปิดก๊อกน้ำไหลตลอด 10 นาที น้ำไหล 8 ลิตรต่อนาที (สมมติ) วิธีใหม่ปิดก๊อกขณะฟอกสบู่ 7 นาที และเปิดเฉพาะตอนล้าง 3 นาที (น้ำไหลอัตราเดิม) วิธีใหม่ประหยัดน้ำได้กี่ลิตร (ตอบเป็นลิตร)"
  answer:
    value: 56
    tolerance: 0
    unit: "ลิตร"
  misconceptions:
  - match: 80
    feedback: "ตอบ 80 ลิตร คือปริมาณน้ำของวิธีเดิมทั้งหมด ยังไม่ได้หักปริมาณที่วิธีใหม่ใช้"
  - match: 24
    feedback: "ตอบ 24 ลิตร คือปริมาณน้ำของวิธีใหม่ ไม่ใช่ส่วนที่ประหยัดได้"
  hints:
  - "คำนวณปริมาณน้ำของวิธีเดิมก่อน จากอัตรา 8 ลิตรต่อนาที คูณด้วย 10 นาที"
  - "คำนวณปริมาณน้ำของวิธีใหม่ เฉพาะช่วงที่เปิดก๊อกจริง"
  - "ส่วนที่ประหยัดได้คือปริมาณของวิธีเดิมลบด้วยปริมาณของวิธีใหม่"
  solution: "วิธีเดิม 8 × 10 = 80 ลิตร วิธีใหม่ 8 × 3 = 24 ลิตร ประหยัดได้ 80 − 24 = 56 ลิตร (ตรวจด้วย python3: 8*10 - 8*3 = 56)"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.self-care-household.p010
  topics:
  - technology.living.self-care-household
  difficulty: 3
  type: order
  stem: "เรียงขั้นตอนการซักเสื้อนักเรียนด้วยมืออย่างถูกต้อง"
  items:
  - "แยกเสื้อสีขาวออกจากเสื้อสีเข้ม"
  - "แช่เสื้อในน้ำที่ผสมผงซักฟอกตามฉลาก"
  - "ขยี้เบา ๆ ตรงรอยเปื้อนแล้วล้างด้วยน้ำสะอาดจนไม่มีฟอง"
  - "บิดน้ำออกเบา ๆ ไม่บิดแรงจนเสื้อยืด"
  - "ตากให้ลมผ่านจนแห้งสนิท"
  hints:
  - "แยกผ้าก่อนซักเพื่อไม่ให้สีตกไปติดผ้าขาว"
  - "ขั้นถัดจากการแช่คือการทำความสะอาดรอยเปื้อน"
  - "ขั้นสุดท้ายคือทำให้เสื้อแห้งโดยไม่เสียรูปทรง"
  solution: "แยกสีก่อนเพื่อกันสีตก แช่ในน้ำผงซักฟอก แล้วขยี้และล้างให้สะอาด บิดเบา ๆ และตากให้ลมผ่านจนแห้ง เพราะการบิดแรงทำให้เสื้อยืดและรูปทรงเสีย"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.self-care-household.p011
  topics:
  - technology.living.self-care-household
  difficulty: 3
  type: mcq
  multiple: true
  stem: "ข้อใดเป็นวิธีที่ปลอดภัยเมื่อใช้กรรไกรตัดกระดาษหรือผ้า (เลือกได้มากกว่าหนึ่งข้อ)"
  choices:
  - id: a
    text: "วางกรรไกรไว้บนขอบโต๊ะโดยให้ปลายยื่นออกนอกโต๊ะ"
    feedback: "กรรไกรที่ยื่นออกนอกโต๊ะอาจตกใส่คนหรือเท้าได้"
  - id: b
    text: "วางกระดาษบนพื้นผิวที่มั่นคงและรักษามือให้ห่างจากใบมีด"
    correct: true
  - id: c
    text: "ถือกรรไกรที่กำลังใช้อยู่ไว้ขณะเดินไปมา"
    feedback: "ของมีคมควรวางลงเมื่อไม่ได้ใช้ และไม่ถือเดินไปมา"
  - id: d
