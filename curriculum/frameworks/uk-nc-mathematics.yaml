# ไม่เก็บ Purpose of study, Aims, ย่อหน้านำของช่วงชั้น และ "Notes and guidance (non-statutory)"
# ที่มา: ใช้โครง (หัวข้อและลำดับ) จากหน้า HTML ของ GOV.UK ผ่าน Content API (https://www.gov.uk/api/content/...) แต่ข้อความทุกข้อคัดจาก PDF ฉบับทางการ
#   เพราะหน้า HTML ถูกปรับตามรูปแบบของ GOV.UK (เขียนตัวเลขแทนคำ เช่น "1 more" แทน "one more") และบางข้อต่างจาก PDF
# ตรวจ: จับคู่ทุกข้อจาก HTML กับ bullet ใน PDF โดยอัตโนมัติ ตรวจข้อที่ไม่ตรงทีละข้อ และตรวจย้อนว่า bullet ใน PDF ที่เป็นข้อกำหนดมีครบ
# รหัส: ต้นฉบับไม่มีรหัส รหัสทั้งหมด (UKNC-...) เป็นรหัสที่เราตั้ง รูปแบบ UKNC-<วิชา>-<ปีหรือช่วงชั้น>-<หัวข้อ>-<ลำดับ> ลำดับตามที่ปรากฏในต้นฉบับ
#   วิชา MA = mathematics, SC = science, CO = computing; strand = ปีหรือช่วงชั้นตามหัวข้อของต้นฉบับ; standard = หัวข้อย่อยในต้นฉบับ
# level: Y1–Y6 = Year, Y1-2 / Y3-4 / Y5-6 = ช่วงปีของ Working scientifically, KS1–KS4 = key stage
# bullet ย่อยในต้นฉบับต่อท้ายข้อหลักด้วย " • " ข้อความในวงเล็บเหลี่ยม [ ] เป็นตัวอย่างที่ไม่บังคับตามต้นฉบับ
# KS4: ข้อความใน { } คือเนื้อหาเพิ่มสำหรับนักเรียนที่เรียนได้สูง (PDF พิมพ์ตัวหนาและใส่ { })
