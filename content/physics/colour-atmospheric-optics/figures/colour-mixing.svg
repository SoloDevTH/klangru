<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" width="620" height="320" font-family="sans-serif" font-size="14">
<title>การผสมแสงสีและการผสมสารสี ซ้าย แสงสีแดง เขียว น้ำเงินซ้อนกันบนพื้นดำ ได้เหลือง ฟ้าอมเขียว ม่วงแดง และขาวตรงกลาง ขวา สารสีฟ้าอมเขียว ม่วงแดง เหลืองซ้อนกันบนพื้นขาว ได้น้ำเงิน แดง เขียว และดำตรงกลาง</title>
<rect x="0" y="0" width="620" height="320" fill="#ffffff"/>
<rect x="10.0" y="40.0" width="290.0" height="270.0" rx="0" fill="#000000" stroke="none" stroke-width="0"/>
<text x="155.0" y="28.0" text-anchor="middle" fill="#15211e" font-size="15" font-weight="bold">ผสมแสงสี (บวกแสง)</text>
<text x="465.0" y="28.0" text-anchor="middle" fill="#15211e" font-size="15" font-weight="bold">ผสมสารสี (ดูดกลืนแสง)</text>
<g style="isolation:isolate">
<circle cx="155" cy="137" r="62" fill="#ff0000" style="mix-blend-mode:screen"/>
<circle cx="117" cy="203" r="62" fill="#00ff00" style="mix-blend-mode:screen"/>
<circle cx="193" cy="203" r="62" fill="#0000ff" style="mix-blend-mode:screen"/>
</g>
<text x="155.0" y="82.0" text-anchor="middle" fill="#ffffff" font-size="13">แดง</text>
<text x="70.0" y="262.0" text-anchor="middle" fill="#ffffff" font-size="13">เขียว</text>
<text x="240.0" y="262.0" text-anchor="middle" fill="#ffffff" font-size="13">น้ำเงิน</text>
<g style="isolation:isolate">
<circle cx="465" cy="137" r="62" fill="#00ffff" style="mix-blend-mode:multiply"/>
<circle cx="427" cy="203" r="62" fill="#ff00ff" style="mix-blend-mode:multiply"/>
<circle cx="503" cy="203" r="62" fill="#ffff00" style="mix-blend-mode:multiply"/>
</g>
<rect x="320.0" y="40.0" width="290.0" height="270.0" rx="0" fill="none" stroke="#bbbbbb" stroke-width="1"/>
<text x="465.0" y="82.0" text-anchor="middle" fill="#15211e" font-size="13">ฟ้าอมเขียว</text>
<text x="375.0" y="262.0" text-anchor="middle" fill="#15211e" font-size="13">ม่วงแดง</text>
<text x="555.0" y="262.0" text-anchor="middle" fill="#15211e" font-size="13">เหลือง</text>
</svg>
