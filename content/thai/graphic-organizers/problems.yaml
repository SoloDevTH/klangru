problems:
- id: thai.reading.graphic-organizers.p001
  topics:
  - thai.reading.graphic-organizers
  difficulty: 1
  type: mcq
  stem: ในผังความคิด สิ่งที่เขียนไว้ **กลางหน้า** คืออะไร
  choices:
  - id: a
    text: รายละเอียดที่สำคัญที่สุด
    feedback: รายละเอียดอยู่บนกิ่งย่อย
  - id: b
    text: ชื่อผู้เขียนบทความ
    feedback: ชื่อผู้เขียนจดไว้ในบันทึก ไม่ใช่กลางผัง
  - id: c
    text: หัวเรื่องของสิ่งที่อ่าน
    correct: true
    feedback: ถูก กิ่งทุกกิ่งแตกออกจากหัวเรื่อง
  - id: d
    text: ข้อคิดเห็นของผู้อ่าน
    feedback: ผังความคิดจัดความรู้จากเรื่อง
  hints:
  - กิ่งทุกกิ่งแตกออกจากจุดใด
  - เรื่องนี้พูดถึงอะไร
  solution: กลางหน้าคือ **หัวเรื่อง** กิ่งใหญ่คือใจความหลัก กิ่งย่อยคือรายละเอียด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.graphic-organizers.p002
  topics:
  - thai.reading.graphic-organizers
  difficulty: 1
  type: match
  stem: จับคู่เรื่องที่อ่านกับแผนภาพที่เหมาะสม
  pairs:
  - left: ขั้นตอนการทำปุ๋ยหมัก
    right: ผังลำดับ
  - left: เปรียบเทียบช้างเอเชียกับช้างแอฟริกา
    right: แผนภาพเวนน์
  - left: สาเหตุที่น้ำท่วมในเมือง
    right: ผังก้างปลา
  - left: วัฏจักรของน้ำ
    right: ผังวงจร
  hints:
  - ขั้นตอนเรียงต่อกัน
  - วัฏจักรวนกลับมาที่เดิม
  solution: ขั้นตอน = ผังลำดับ · เปรียบเทียบ = เวนน์ · สาเหตุ = ก้างปลา · วัฏจักร = ผังวงจร
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.graphic-organizers.p003
  topics:
  - thai.reading.graphic-organizers
  difficulty: 2
  type: text
  stem: ในแผนภาพเวนน์ ส่วนที่วงกลมสองวง **ซ้อนกัน** ใช้เขียนอะไร (ตอบสั้น ๆ)
  accepted:
  - สิ่งที่เหมือนกัน
  - ความเหมือน
  - ส่วนที่เหมือนกัน
  - เหมือนกัน
  - ความเหมือนกัน
  - ลักษณะที่เหมือนกัน
  - สิ่งที่ทั้งสองมีเหมือนกัน
  misconceptions:
  - match: สิ่งที่ต่างกัน
    feedback: สิ่งที่ต่างกันเขียนในส่วนที่ไม่ซ้อน
  - match: ความต่าง
    feedback: ความต่างเขียนในส่วนที่ไม่ซ้อน
  hints:
  - ส่วนซ้อนเป็นของทั้งสองวง
  - ของที่อยู่ในทั้งสองสิ่ง แปลว่าอะไร
  solution: ส่วนซ้อนเขียน **สิ่งที่เหมือนกัน** ส่วนที่ไม่ซ้อนเขียนสิ่งที่ต่างกัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.graphic-organizers.p004
  topics:
  - thai.reading.graphic-organizers
  difficulty: 2
  type: order
  stem: เรียงขั้นตอนการทำผังความคิดจากเรื่องที่อ่าน
  items:
  - อ่านเรื่องให้จบและหาใจความแต่ละย่อหน้า
  - เขียนหัวเรื่องไว้กลางหน้า
  - แตกกิ่งใหญ่เป็นใจความหลัก
  - เติมกิ่งย่อยเป็นรายละเอียด
  - ตรวจว่าแต่ละคำอยู่ถูกระดับ
  hints:
  - ต้องเข้าใจเรื่องก่อนวาด
  - วาดจากกลางออกไปข้างนอก
  solution: อ่านและหาใจความ → หัวเรื่องกลางหน้า → กิ่งใหญ่ → กิ่งย่อย → ตรวจระดับ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.graphic-organizers.p005
  topics:
  - thai.reading.graphic-organizers
  difficulty: 2
  type: mcq
  stem: ทำแผนภาพเวนน์เปรียบเทียบ **ผึ้งกับผีเสื้อ** ข้อความใดควรอยู่ใน **ส่วนที่ซ้อนกัน**
  choices:
  - id: a
    text: ทำน้ำผึ้ง
    feedback: เป็นของผึ้งเท่านั้น
  - id: b
    text: ปีกมีเกล็ดเล็ก ๆ เรียงเป็นลวดลายสี
    feedback: เป็นลักษณะของผีเสื้อ ปีกผึ้งเป็นแผ่นบางใส
  - id: c
    text: ช่วยถ่ายเรณูให้ดอกไม้
    correct: true
    feedback: ถูก ทั้งผึ้งและผีเสื้อช่วยถ่ายเรณู
  - id: d
    text: อยู่รวมกันเป็นรังใหญ่
    feedback: เป็นลักษณะของผึ้งรวง ผีเสื้อไม่ทำรัง
  hints:
  - ส่วนซ้อน = เหมือนกัน
  - ข้อใดจริงสำหรับทั้งสองชนิด
  solution: '**ช่วยถ่ายเรณู** จริงทั้งสองชนิด จึงอยู่ส่วนซ้อน'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.graphic-organizers.p006
  topics:
  - thai.reading.graphic-organizers
  difficulty: 3
  type: mcq
  stem: อ่านบทความในภาพ ถ้าทำผังความคิด **กิ่งใหญ่** ควรเป็นชุดใด
  figure:
    src: bee-article.svg
    alt: บทความสมมติ ผึ้งตัวเล็ก งานใหญ่ 3 ย่อหน้า (1) ผึ้งไม่ได้ให้แค่น้ำผึ้ง ขณะผึ้งบินจากดอกหนึ่งไปอีกดอกหนึ่งเพื่อเก็บน้ำหวาน เรณูจะติดตัวผึ้งไปยังดอกอื่น ทำให้พืชติดผล ผลไม้และผักหลายชนิดที่เรากิน เช่น ลำไย แตงโม และฟักทอง จึงต้องพึ่งแมลงอย่างผึ้งช่วยถ่ายเรณู (2) ปัจจุบันผึ้งในหลายพื้นที่มีจำนวนลดลง สาเหตุสำคัญ ได้แก่ การใช้สารเคมีกำจัดแมลงโดยไม่ระวัง ป่าและทุ่งดอกไม้ซึ่งเป็นแหล่งอาหารของผึ้งลดลง และโรคกับปรสิตที่ระบาดในรังผึ้ง (3) เราช่วยผึ้งได้ เช่น ปลูกไม้ดอกหลายชนิดให้มีดอกบานตลอดปี ใช้สารเคมีเท่าที่จำเป็นและไม่ฉีดพ่นในช่วงที่ดอกบาน และสนับสนุนผู้เลี้ยงผึ้งในท้องถิ่น
  choices:
  - id: a
    text: ลำไย · แตงโม · ฟักทอง
    feedback: เป็นตัวอย่างในย่อหน้า (1) เป็นรายละเอียด
  - id: b
    text: หน้าที่ของผึ้ง · สาเหตุที่ผึ้งลดลง · วิธีช่วยผึ้ง
    correct: true
    feedback: ถูก ตรงกับใจความของ 3 ย่อหน้า
  - id: c
    text: สารเคมี · ป่าลดลง · โรค
    feedback: เป็นรายละเอียดของสาเหตุในย่อหน้า (2)
  - id: d
    text: น้ำผึ้ง · เรณู · ดอกไม้
    feedback: เป็นคำที่พบในเรื่อง แต่ไม่ครอบคลุมทั้งเรื่อง
  hints:
  - กิ่งใหญ่ = ใจความของแต่ละย่อหน้า
  - ตัวอย่างอยู่บนกิ่งย่อย
  solution: กิ่งใหญ่คือ **หน้าที่ สาเหตุที่ลดลง วิธีช่วย** ตามใจความ 3 ย่อหน้า
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.graphic-organizers.p007
  topics:
  - thai.reading.graphic-organizers
  difficulty: 3
  type: mcq
  stem: ดูผังความคิดฉบับร่างในภาพ คำใด **วางผิดระดับ**
  figure:
    src: bee-mindmap-draft.svg
    alt: ผังความคิดฉบับร่างของนักเรียนเรื่องผึ้ง กลางหน้าเขียนว่า ผึ้ง มีกิ่งใหญ่ 4 กิ่ง กิ่ง หน้าที่ มีกิ่งย่อย ถ่ายเรณู ทำน้ำผึ้ง กิ่ง สาเหตุที่ลดลง มีกิ่งย่อย สารเคมีกำจัดแมลง แหล่งอาหารลดลง โรคและปรสิต กิ่ง วิธีช่วยผึ้ง มีกิ่งย่อย ใช้สารเคมีเท่าที่จำเป็น สนับสนุนผู้เลี้ยงผึ้ง และกิ่ง ปลูกไม้ดอก มีกิ่งย่อย มีดอกตลอดปี ใต้ภาพเขียนว่ามีจุดที่วางผิดระดับ
  choices:
  - id: a
    text: ปลูกไม้ดอก
    correct: true
    feedback: ถูก เป็นวิธีช่วยผึ้ง ควรเป็นกิ่งย่อยใต้ วิธีช่วยผึ้ง ไม่ใช่กิ่งใหญ่
  - id: b
    text: สาเหตุที่ลดลง
    feedback: เป็นใจความของย่อหน้า (2) วางเป็นกิ่งใหญ่ถูกแล้ว
  - id: c
    text: ถ่ายเรณู
    feedback: เป็นรายละเอียดของ หน้าที่ วางถูกแล้ว
  - id: d
    text: โรคและปรสิต
    feedback: เป็นสาเหตุหนึ่ง วางถูกแล้ว
  hints:
  - กิ่งใหญ่แต่ละกิ่งเป็นใจความหลักหรือไม่
  - กิ่งใดซ้ำกับความหมายของกิ่งอื่น
  solution: '**ปลูกไม้ดอก** เป็นวิธีหนึ่งในการช่วยผึ้ง ต้องย้ายไปเป็นกิ่งย่อยของ วิธีช่วยผึ้ง'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.graphic-organizers.p008
  topics:
  - thai.reading.graphic-organizers
  difficulty: 3
  type: match
  stem: บันทึกแบบแบ่งช่อง (คอร์เนลล์) จับคู่ส่วนของบันทึกกับสิ่งที่เขียน
  pairs:
  - left: ช่องซ้ายแคบ
    right: คำสำคัญหรือคำถาม เช่น ผึ้งช่วยพืชอย่างไร
  - left: ช่องขวากว้าง
    right: รายละเอียดที่ตอบคำถาม
  - left: แถบล่าง
    right: สรุปทั้งหน้าใน 2–3 ประโยค
  - left: หัวกระดาษ
    right: ชื่อเรื่อง แหล่งที่มา และวันที่
  hints:
  - ช่องแคบเขียนได้สั้น ๆ
  - ส่วนล่างสุดคือส่วนที่ทำหลังจดเสร็จ
  solution: ซ้าย = คำสำคัญ/คำถาม · ขวา = รายละเอียด · ล่าง = สรุป · หัวกระดาษ = ข้อมูลแหล่ง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.graphic-organizers.p009
  topics:
  - thai.reading.graphic-organizers
  difficulty: 3
  type: mcq
  stem: อ่านบทความในภาพ แล้วทำ **ผังก้างปลา** โดยหัวปลาคือ "ผึ้งลดลง" ข้อใดเป็น **ก้าง** ได้
  figure:
    src: bee-article.svg
    alt: บทความสมมติ ผึ้งตัวเล็ก งานใหญ่ 3 ย่อหน้า (1) ผึ้งไม่ได้ให้แค่น้ำผึ้ง ขณะผึ้งบินจากดอกหนึ่งไปอีกดอกหนึ่งเพื่อเก็บน้ำหวาน เรณูจะติดตัวผึ้งไปยังดอกอื่น ทำให้พืชติดผล ผลไม้และผักหลายชนิดที่เรากิน เช่น ลำไย แตงโม และฟักทอง จึงต้องพึ่งแมลงอย่างผึ้งช่วยถ่ายเรณู (2) ปัจจุบันผึ้งในหลายพื้นที่มีจำนวนลดลง สาเหตุสำคัญ ได้แก่ การใช้สารเคมีกำจัดแมลงโดยไม่ระวัง ป่าและทุ่งดอกไม้ซึ่งเป็นแหล่งอาหารของผึ้งลดลง และโรคกับปรสิตที่ระบาดในรังผึ้ง (3) เราช่วยผึ้งได้ เช่น ปลูกไม้ดอกหลายชนิดให้มีดอกบานตลอดปี ใช้สารเคมีเท่าที่จำเป็นและไม่ฉีดพ่นในช่วงที่ดอกบาน และสนับสนุนผู้เลี้ยงผึ้งในท้องถิ่น
  choices:
  - id: a
    text: ปลูกไม้ดอกหลายชนิด
    feedback: เป็นวิธีแก้ ไม่ใช่สาเหตุ
  - id: b
    text: ลำไยติดผล
    feedback: เป็นผลจากการที่ผึ้งช่วยถ่ายเรณู
  - id: c
    text: การใช้สารเคมีกำจัดแมลงโดยไม่ระวัง
    correct: true
    feedback: ถูก เป็นสาเหตุของปัญหา
  - id: d
    text: สนับสนุนผู้เลี้ยงผึ้ง
    feedback: เป็นวิธีช่วยผึ้ง
  hints:
  - ก้างปลา = สาเหตุ
  - ย่อหน้าใดบอกสาเหตุ
  solution: ก้างคือ **สาเหตุ** จากย่อหน้า (2) เช่น การใช้สารเคมีโดยไม่ระวัง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.graphic-organizers.p010
  topics:
  - thai.reading.graphic-organizers
  difficulty: 4
  type: mcq
  stem: ดูกรอบแนวคิดในภาพ ข้อความใดเติมใน **กล่องว่าง** ได้เหมาะที่สุด
  figure:
    src: reading-framework.svg
    alt: กรอบแนวคิดจากบทความสมมติ ปัจจัยที่ทำให้นักเรียนรักการอ่าน ทางซ้ายมีกล่องปัจจัย 3 กล่อง กล่องแรก มุมหนังสือในห้องเรียน กล่องที่สองเป็นกล่องว่างเส้นประมีเครื่องหมายคำถาม กล่องที่สาม หนังสือตรงความสนใจ ลูกศรจากทั้งสามกล่องชี้ไปที่กล่องทางขวา นิสัยรักการอ่าน ซึ่งเป็นผล
  choices:
  - id: a
    text: นักเรียนอ่านหนังสือมากขึ้น
    feedback: เป็นผล ควรอยู่ฝั่งขวา ไม่ใช่ปัจจัย
  - id: b
    text: เวลาอ่านหนังสือทุกเช้า 15 นาที
    correct: true
    feedback: ถูก เป็นปัจจัยที่ส่งผลให้รักการอ่าน เข้ากับกล่องอื่น
  - id: c
    text: ห้องสมุดของโรงเรียน
    feedback: เป็นสถานที่ ไม่ได้บอกว่าทำอะไรจึงส่งผล และซ้ำกับมุมหนังสือ
  - id: d
    text: การอ่านมีประโยชน์
    feedback: เป็นความเห็นทั่วไป ไม่ใช่ปัจจัย
  hints:
  - กล่องทางซ้ายคือปัจจัย
  - ปัจจัยต้องเป็นสิ่งที่ทำให้เกิดผลทางขวา
  solution: กล่องซ้ายเป็น **ปัจจัย** เช่น **เวลาอ่านทุกเช้า** ลูกศรชี้ไปหาผล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.graphic-organizers.p011
  topics:
  - thai.reading.graphic-organizers
  difficulty: 4
  type: numeric
