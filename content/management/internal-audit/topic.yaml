id: management.quality.internal-audit
subject: management
title:
  th: การตรวจติดตามคุณภาพภายใน
  en: Internal quality audit
summary: ประเภทการตรวจ โปรแกรมการตรวจตามความเสี่ยง ความสามารถและความเป็นกลางของผู้ตรวจ รายการตรวจ การสุ่มหลักฐานและการตามรอย การจัดระดับข้อพบ และการติดตามประสิทธิผลของการแก้ไข
difficulty: 6.5
minutes: 40
prerequisites:
- management.quality.iso-management-systems
encompasses:
- id: management.quality.iso-management-systems
  weight: 0.4
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  src: audit-programme.svg
  alt: ตารางโปรแกรมการตรวจติดตามภายในทั้งปี แถวเป็นกระบวนการเจ็ดกระบวนการ คอลัมน์คือคะแนนความสำคัญ ความเสี่ยง คะแนนรวม (ผลคูณ) และสี่ไตรมาส จุดสีน้ำเงินคือไตรมาสที่กำหนดตรวจ ผลิตและควบคุมกระบวนการคะแนน 20 สีแดง ตรวจทุกไตรมาส ทบทวนข้อกำหนดลูกค้า 8 จัดซื้อ 12 ตรวจสอบและทดสอบ 12 สีส้ม ตรวจปีละ 2 ครั้ง ออกแบบผลิตภัณฑ์ 6 ทรัพยากรบุคคล 4 การทบทวนโดยฝ่ายบริหาร 3 สีเขียว ตรวจปีละครั้ง กระจายไปไตรมาสต่าง ๆ ด้านล่างมีคำอธิบายเกณฑ์สี 1–6 ปีละครั้ง 8–12 ปีละ 2 ครั้ง 15–25 ทุกไตรมาส และปรับเพิ่มได้ถ้ามีข้อร้องเรียนหรือการเปลี่ยนแปลง
  caption: ตรวจกระบวนการที่สำคัญและเสี่ยงบ่อยกว่า (ข้อมูลสมมติ)
- type: worked-example
  title: วางโปรแกรมการตรวจปีหน้าจากผลปีนี้
  problem: โรงพยาบาลชุมชน (สมมติ) ปีนี้ตรวจกระบวนการจ่ายยาปีละครั้ง (ความสำคัญ 5 ความเสี่ยง 2) แต่ปีนี้พบข้อบกพร่องย่อยเรื่องการทวนสอบชื่อผู้ป่วย 2 ครั้ง และมีข้อร้องเรียนจ่ายยาผิด 1 ครั้ง ใช้เกณฑ์ 1–6 ปีละครั้ง 8–12 ปีละ 2 ครั้ง 15–25 ทุกไตรมาส จะวางแผนปีหน้าอย่างไร
  steps:
  - text: 'เดิม: คะแนน $5 \times 2 = 10$ ตามเกณฑ์ควรตรวจปีละ 2 ครั้ง แต่ปีนี้ตรวจเพียงครั้งเดียว โปรแกรมเดิมจึงไม่เป็นไปตามเกณฑ์ขององค์กรเอง'
    why: โปรแกรมต้องทบทวนตัวเองด้วย
  - text: 'ข้อมูลใหม่: ข้อพบซ้ำและข้อร้องเรียนบอกว่าโอกาสเกิดปัญหาสูงกว่าที่ประเมิน ปรับความเสี่ยงเป็น 3 หรือ 4'
  - text: คะแนนใหม่ $5 \times 3 = 15$ (หรือ 20) อยู่ในช่วง 15–25 ตรวจทุกไตรมาส
  - text: 'เลือกผู้ตรวจ: เภสัชกรจากโรงพยาบาลเครือข่ายหรือพยาบาลที่ไม่ได้ปฏิบัติงานจ่ายยา และมีผู้รู้กระบวนการร่วมทีม'
    why: ต้องเป็นกลางและมีความรู้พอจะถามได้ตรงจุด
  - text: รายการตรวจเน้นการทวนสอบชื่อผู้ป่วยและการตรวจยาซ้ำ สุ่มใบสั่งยาแบ่งชั้นตามเวรเช้า บ่าย ดึก เพราะเวรดึกคนน้อย อาจเสี่ยงกว่า
  answer: เพิ่มเป็นทุกไตรมาส เลือกผู้ตรวจที่เป็นกลาง เน้นจุดเสี่ยง และสุ่มแบบแบ่งชั้นตามเวร
- type: check
  problem: management.quality.internal-audit.p003
  prompt: บันทึกในคลังช่วงที่ตรวจเป็นผลงานของใคร
- type: figure
  src: audit-cycle.svg
  alt: 'วงจรสี่ขั้นเรียงตามเข็มนาฬิกา ล้อมคำว่าโปรแกรมการตรวจ (ระดับทั้งปี) ขั้น 1 กำหนดโปรแกรม: วัตถุประสงค์ ความถี่ตามความเสี่ยง ผู้ตรวจ ทรัพยากร ขั้น 2 ทำการตรวจแต่ละครั้ง: แผนการตรวจ รายการตรวจ เก็บหลักฐาน เขียนข้อพบ ขั้น 3 รายงานและติดตามผล: หน่วยงานแก้ไขที่สาเหตุ ผู้ตรวจยืนยันประสิทธิผล ขั้น 4 ทบทวนโปรแกรม: ครอบคลุมครบไหม ผู้ตรวจพร้อมไหม ปรับความถี่ปีถัดไป แล้ววนกลับขั้น 1 กล่องข้อมูลนำเข้า (ความเสี่ยง ข้อร้องเรียน) ส่งลูกศรเข้าขั้น 1 และขั้น 3 ส่งลูกศรออกไปยังกล่องการทบทวนโดยฝ่ายบริหาร ข้อความด้านล่างบอกว่าขั้น 2 คือการตรวจหนึ่งครั้ง ส่วนวงจรนี้บริหารการตรวจทั้งปี'
  caption: บริหารโปรแกรมการตรวจเป็นวงจรต่อเนื่อง
- type: figure
  src: sampling-curve.svg
  alt: กราฟแกนนอนจำนวนบันทึกที่สุ่ม n ตั้งแต่ 0 ถึง 60 แกนตั้งโอกาสพบบันทึกผิดอย่างน้อย 1 รายการ สามเส้นโค้งสำหรับอัตราบกพร่อง 2% 5% และ 10% ทุกเส้นเพิ่มขึ้นแบบชันลดลง เส้นประสีแดงที่ 0.95 เส้น 10% ถึง 0.95 ที่ n = 29 เส้น 5% ที่ n = 10 ได้ 0.40 เส้น 2% ที่ n = 60 ได้เพียงราว 0.70 สูตร P = 1 − (1 − p)ⁿ
  caption: ยิ่งปัญหาเกิดน้อย ยิ่งต้องสุ่มมากจึงจะเจอ
- type: worked-example
  title: สุ่มเท่าไรจึงพอ
  problem: ผู้ตรวจจะตรวจบันทึกอุณหภูมิห้องเย็นของโรงงานแปรรูปอาหารทะเล (สมมติ) ซึ่งมีหลายพันรายการ อยากมั่นใจ 95% ว่าถ้ามีบันทึกที่ขาดหรือผิดตั้งแต่ 5% ขึ้นไปจะพบอย่างน้อยหนึ่งรายการ ต้องสุ่มกี่รายการ และถ้าสุ่มได้แค่ 20 รายการ โอกาสพบเป็นเท่าใด
  steps:
  - text: 'ไม่พบเลยเมื่อทุกรายการที่สุ่มถูก: $(1 - 0.05)^n$ ต้องการให้ $\le 0.05$'
  - text: $n \ge \ln 0.05/\ln 0.95 = 58.40$ ปัดขึ้นเป็น $59$ รายการ
    why: ตรวจด้วยการไล่ $n$ ทีละค่า ได้ค่าน้อยที่สุดตรงกัน
  - text: 'ถ้าสุ่ม 20 รายการ: $1 - 0.95^{20} = 0.64$ หรือราว 64%'
  - text: เลือกแบบแบ่งชั้นตามกะและวันหยุด เพราะบันทึกขาดมักเกิดช่วงคนน้อย และระบุในรายงานว่าสุ่มกี่รายการจากช่วงใด
    why: ผู้อ่านรายงานจะรู้ว่าข้อสรุปมีความไม่แน่นอนเท่าใด
  answer: ต้องสุ่มอย่างน้อย 59 รายการ ถ้าสุ่ม 20 รายการ โอกาสพบราว 64%
- type: check
  problem: management.quality.internal-audit.p004
  prompt: หาโอกาสที่ไม่พบเลยก่อน
glossary:
- term: การตรวจติดตามภายใน
  definition: การตรวจระบบขององค์กรโดยองค์กรเอง (ฝ่ายที่หนึ่ง) เพื่อดูความสอดคล้องและประสิทธิผล (internal audit)
- term: โปรแกรมการตรวจ
  definition: แผนการตรวจทั้งรอบ เช่น ทั้งปี กำหนดว่าตรวจอะไร บ่อยแค่ไหน และใครตรวจ (audit programme)
- term: แผนการตรวจ
  definition: 'รายละเอียดของการตรวจหนึ่งครั้ง: วัตถุประสงค์ ขอบเขต เกณฑ์ ตารางเวลา (audit plan)'
- term: เกณฑ์การตรวจ
  definition: สิ่งที่ใช้เทียบหลักฐาน เช่น ข้อกำหนดของมาตรฐาน ขั้นตอนขององค์กร ข้อกำหนดลูกค้า (audit criteria)
- term: หลักฐานการตรวจ
  definition: บันทึก ข้อเท็จจริง หรือข้อมูลที่ตรวจสอบได้ (audit evidence)
- term: รายการตรวจ
  definition: รายการคำถามหรือประเด็นที่เตรียมไว้ช่วยผู้ตรวจ (checklist)
- term: การตรวจตามรอย
  definition: การเดินตามงานผ่านบันทึกที่เชื่อมกันด้วยรหัสล็อตหรือเลขเอกสาร (audit trail)
- term: การสุ่มแบบแบ่งชั้น
  definition: แบ่งประชากรเป็นกลุ่มย่อยแล้วสุ่มจากทุกกลุ่ม (stratified sampling)
- term: ความเป็นกลางของผู้ตรวจ
  definition: ผู้ตรวจไม่ตรวจงานที่ตัวเองรับผิดชอบและไม่มีส่วนได้เสีย (impartiality)
- term: การยืนยันประสิทธิผล
  definition: การตรวจว่าการแก้ไขทำให้ปัญหาไม่เกิดซ้ำจริง (verification of effectiveness)
flashcards:
- front: ความถี่ในโปรแกรมการตรวจ
  back: ตามความสำคัญ × ความเสี่ยง การเปลี่ยนแปลง และผลการตรวจครั้งก่อน
- front: ผู้ตรวจที่ดี
  back: มีความสามารถ + เป็นกลาง (ไม่ตรวจงานตัวเอง)
- front: โอกาสพบจากการสุ่ม
  back: '$1 - (1 - p)^n$ · ต้องการ 95%: $n \ge \ln 0.05/\ln(1 - p)$'
- front: หลักฐานสามทาง
  back: สัมภาษณ์ · สังเกต · บันทึก
- front: ปิดข้อบกพร่องได้เมื่อ
  back: แก้ไข + แก้ที่สาเหตุ + ทำแล้ว + ได้ผลจริง
