  - id: management.operations.packaging-systems.p018
    topics: [management.operations.packaging-systems]
    difficulty: 5
    type: numeric
    stem: "กลุ่มวิสาหกิจชุมชนทำกล้วยฉาบ (สมมติ) ต้องการกล่องที่ส่งถึงปลายทางโดยไม่เสียหายอย่างน้อย 200 กล่อง คาดว่าระหว่างขนส่งจะเสียหาย 4% ของกล่องที่ส่งออก ต้องส่งออกอย่างน้อยกี่กล่อง (ปัดขึ้นเป็นจำนวนเต็ม)"
