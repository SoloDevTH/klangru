id: english.grammar.future-forms
subject: english
title: { th: "will และ be going to", en: "Will and be going to" }
summary: ใช้ will ตัดสินใจทันที เสนอช่วย สัญญา และคาดเดาจากความเห็น ใช้ be going to กับแผนที่คิดไว้ก่อนและการคาดเดาจากสิ่งที่เห็น พูดถึงแผนการ และจับใจความบทสนทนา
difficulty: 3
minutes: 35
prerequisites: [english.grammar.present-continuous]
encompasses:
  - { id: english.grammar.present-continuous, weight: 0.2 }
  - { id: english.grammar.be-have-there, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: will-going-to.svg
    alt: "ตารางสี่ช่อง ฝั่งซ้ายคือ will ช่องบนใช้ตัดสินใจทันทีตอนพูด เสนอช่วย สัญญา ตัวอย่าง I'll carry your bag. ช่องล่างใช้คาดเดาจากความคิดเห็น ตัวอย่าง I think Thailand will win. ฝั่งขวาคือ be going to ช่องบนใช้กับแผนหรือความตั้งใจที่คิดไว้ก่อน ตัวอย่าง I'm going to visit Grandma on Saturday. ช่องล่างใช้คาดเดาจากสิ่งที่เห็นตอนนี้ ตัวอย่าง Look at the clouds! It's going to rain. ข้อความใต้ตารางบอกว่าทั้งสองแบบตามด้วยกริยารูปเดิม"
    caption: "will: ตัดสินใจตอนพูดหรือคาดเดาจากความเห็น · be going to: คิดไว้ก่อนหรือเห็นหลักฐาน"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.grammar.future-forms.p008, prompt: "เรารู้มาก่อนไหมว่าโทรศัพท์จะดัง" }
  - type: worked-example
    title: เขียนแผนวันหยุดและคำทำนาย
    problem: "เขียน 3 ประโยค: ปิดเทอมนี้จะไปเกาะสมุยกับครอบครัว (จองตั๋วแล้ว) จะไปดำน้ำ และคิดว่าคงสนุกมาก"
    steps:
      - text: "จองตั๋วแล้ว เป็นแผนที่คิดไว้ก่อน ใช้ be going to: *We're going to visit Ko Samui this holiday.*"
      - text: "ดำน้ำก็เป็นแผนเดียวกัน: *We're going to go snorkelling.*"
        why: "going to + go ใช้ได้ ไม่ใช่การซ้ำคำผิด going เป็นส่วนหนึ่งของ be going to ส่วน go คือกริยาหลัก"
      - text: "คิดว่าจะสนุก เป็นการคาดเดาจากความเห็น ใช้ I think + will: *I think it will be a lot of fun.*"
    answer: "*We're going to visit Ko Samui this holiday. We're going to go snorkelling. I think it will be a lot of fun.*"
  - { type: check, problem: english.grammar.future-forms.p009, prompt: "มีหลักฐานที่เห็นตอนนี้ หลัง going to ใช้กริยารูปไหน" }
  - type: worked-example
    title: สนทนาวางแผนนัดหมาย
    problem: "เติมบทสนทนา: *A: ___ you ___ (do) anything on Friday evening? / B: No, I'm free. / A: I'm going to see a movie. Do you want to come? / B: Sure! I ___ (meet) you at the cinema.*"
    steps:
      - text: "A ถามถึงแผนที่ B อาจมีอยู่แล้ว ใช้ be going to: ***Are** you **going to do** anything on Friday evening?*"
      - text: "A บอกแผนของตัวเองที่คิดไว้แล้ว: *I'm going to see a movie.* (มีให้แล้ว)"
      - text: "B เพิ่งตัดสินใจไปด้วยตอนนี้ ใช้ will: *I'**ll meet** you at the cinema.*"
        why: "B ไม่ได้วางแผนมาก่อน จึงใช้ will ไม่ใช่ going to"
    answer: "*Are you going to do anything on Friday evening?* … *Sure! I'll meet you at the cinema.*"
glossary:
  - { term: will, definition: "กริยาช่วยบอกอนาคต ใช้ตัดสินใจทันที เสนอช่วย สัญญา คาดเดาจากความเห็น ตามด้วยกริยารูปเดิม" }
  - { term: won't, definition: "รูปย่อของ will not" }
  - { term: be going to, definition: "am/is/are going to + กริยารูปเดิม ใช้กับแผนที่คิดไว้ก่อนและการคาดเดาจากสิ่งที่เห็น" }
  - { term: prediction (การคาดเดา), definition: "การบอกว่าน่าจะเกิดอะไรในอนาคต ใช้ will จากความเห็น หรือ going to จากหลักฐาน" }
  - { term: main idea (ใจความสำคัญ), definition: "เรื่องหลักที่ข้อความหรือบทสนทนาทั้งหมดพูดถึง" }
flashcards:
  - { front: "ตัดสินใจทันที: \"เดี๋ยวฉันช่วยเอง\"", back: "I'll help you." }
  - { front: "แผนที่คิดไว้ก่อน: \"ฉันจะไปเยี่ยมยายวันเสาร์\"", back: "I'm going to visit my grandma on Saturday." }
  - { front: "เห็นเมฆดำ: \"ฝนกำลังจะตก\"", back: "It's going to rain." }
  - { front: "Will you come? ตอบรับแบบสั้น", back: "Yes, I will. (ห้ามย่อเป็น Yes, I'll.)" }
  - { front: "ปฏิเสธของ She is going to cook.", back: "She isn't going to cook." }
