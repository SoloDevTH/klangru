<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="sans-serif">
<title>เรือข้ามแม่น้ำที่หัวเรือทำมุมทวนน้ำ และแผนภาพความเร็วสามตัว</title>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f2937"/></marker><marker id="ab" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1d4ed8"/></marker><marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#15803d"/></marker><marker id="ao" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c2410c"/></marker></defs>
<rect width="720" height="340" fill="#ffffff"/>
<rect x="30" y="50" width="370" height="200" fill="#e0f2fe"/>
<line x1="30" y1="50" x2="400" y2="50" stroke="#334155" stroke-width="2"/>
<line x1="30" y1="250" x2="400" y2="250" stroke="#334155" stroke-width="2"/>
<text x="215.0" y="40.0" text-anchor="middle" font-size="13" fill="#111" font-weight="normal">ฝั่งเหนือ (ปลายทาง)</text>
<text x="215.0" y="270.0" text-anchor="middle" font-size="13" fill="#111" font-weight="normal">ฝั่งใต้ (จุดเริ่ม)</text>
<line x1="70.0" y1="150.0" x2="330.0" y2="150.0" stroke="#0369a1" stroke-width="2" marker-end="url(#ab)"/>
<text x="60.0" y="118.0" text-anchor="start" font-size="13" fill="#075985" font-weight="normal">กระแสน้ำไหล</text>
<text x="60.0" y="136.0" text-anchor="start" font-size="13" fill="#075985" font-weight="normal">ไปทางตะวันออก</text>
<line x1="220" y1="250" x2="220" y2="50" stroke="#15803d" stroke-width="2" stroke-dasharray="6 4"/>
<text x="228.0" y="96.0" text-anchor="start" font-size="12" fill="#15803d" font-weight="normal">ผลลัพธ์: เรือไปถึงจุดตรงข้าม</text>
<line x1="220.0" y1="250.0" x2="172.5" y2="167.7" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>
<text x="166.5" y="173.7" text-anchor="end" font-size="12" fill="#1d4ed8" font-weight="normal">หัวเรือ</text>
<path d="M 220.0 210.0 A 40 40 0 0 0 200.0 215.4" fill="none" stroke="#111" stroke-width="1.5"/>
<text x="206.0" y="203.0" text-anchor="middle" font-size="13" fill="#111" font-weight="normal">θ</text>
<line x1="480.0" y1="250.0" x2="560.0" y2="250.0" stroke="#0369a1" stroke-width="2.5" marker-end="url(#ab)"/>
<line x1="560.0" y1="250.0" x2="480.0" y2="111.4" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>
<line x1="480.0" y1="250.0" x2="480.0" y2="111.4" stroke="#15803d" stroke-width="3" marker-end="url(#ag)"/>
<text x="560.0" y="270.0" text-anchor="middle" font-size="12" fill="#0369a1" font-weight="normal">กระแสน้ำ</text>
<text x="498.0" y="78.0" text-anchor="start" font-size="12" fill="#15803d" font-weight="normal">เทียบกับฝั่ง (ผลรวม)</text>
<text x="528.0" y="178.0" text-anchor="start" font-size="12" fill="#1d4ed8" font-weight="normal">เรือเทียบกับน้ำ</text>
<text x="360.0" y="328.0" text-anchor="middle" font-size="12" fill="#444" font-weight="normal">แผนภาพซ้าย: ทิศทางจริงบนแม่น้ำ  แผนภาพขวา: การบวกเวกเตอร์ความเร็ว (ลูกศรรวมคือความเร็วเทียบกับฝั่ง)</text>
</svg>