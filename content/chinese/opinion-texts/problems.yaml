- type: mcq
  difficulty: 4
  stem: 'อ่านข้อความต่อไปนี้แล้วตอบ


    学习语言不是背单词，而是要多说、多听。很多人花很多时间做题，却不敢开口。与其一直看书，不如找朋友练习对话。当然，词汇也很重要，但它只是基础。总之，只有多练习，才能真正学会一门语言。


    ความคิดหลักของผู้เขียนคืออะไร'
  choices:
  - id: a
    text: คำศัพท์ไม่สำคัญเลยในการเรียนภาษา
    feedback: ผู้เขียนบอกว่า ‘词汇也很重要 (cíhuì yě hěn zhòngyào)’ จึงตรงข้ามกับตัวเลือกนี้
  - id: b
    text: การเรียนภาษาต้องฝึกพูดและฟังเป็นหลัก
    correct: true
    feedback: ถูก ประโยค ‘要多说 (yào duō shuō)、多听 (duō tīng)’ และ ‘多练习 (duō liànxí)’ เป็นความคิดหลัก
  - id: c
    text: ควรเรียนภาษาจากหนังสืออย่างเดียว
    feedback: ผู้เขียนบอกว่า ‘与其一直看书 (yǔqí yìzhí kànshū)’ จึงไม่สนับสนุนการอ่านอย่างเดียว
  - id: d
    text: ทุกคนควรเลิกทำแบบฝึกหัดทั้งหมด
    feedback: ข้อความไม่ได้เสนอให้เลิกทำแบบฝึกหัดทั้งหมด
  hints:
  - หาประโยคที่ขึ้นต้นด้วย 学习语言不是…而是…
  - ดูข้อสรุปที่มี 总之
  - ความคิดหลักต้องครอบคลุมข้อสรุปทั้งหมด
  solution: '**b.** ผู้เขียนเน้นการพูดและฟังเป็นหลัก ส่วนการอ่านหนังสือและการทำแบบฝึกหัดมีบทบาทรอง'
