      - { left: "$|-4| - |6|$", right: "$-2$" }
      - { left: "$-|-4|$", right: "$-4$" }
      - { left: "$(-4) - (-6)$", right: "$2$" }
    hints:
      - "หาค่าสัมบูรณ์ก่อน แล้วจึงใส่เครื่องหมายลบที่อยู่นอกเครื่องหมายค่าสัมบูรณ์"
      - "$-(-4)$ คือตรงข้ามของ $-4$ ส่วน $(-4) - (-6)$ เปลี่ยนเป็น $-4 + 6$"
    solution: "$-(-4) = 4$ · $|-4| - |6| = 4 - 6 = -2$ · $-|-4| = -(4) = -4$ · $(-4) - (-6) = -4 + 6 = 2$"
