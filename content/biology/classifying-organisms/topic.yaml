id: biology.diversity.classifying-organisms
subject: biology
title: { th: การจำแนกสิ่งมีชีวิต, en: "Classifying living things" }
summary: แบ่งสิ่งมีชีวิตเป็นกลุ่มพืช กลุ่มสัตว์ และกลุ่มที่ไม่ใช่พืชและสัตว์ พืชดอกกับพืชไม่มีดอก สัตว์มีและไม่มีกระดูกสันหลัง ลักษณะของสัตว์มีกระดูกสันหลัง 5 กลุ่ม และการใช้กุญแจจำแนก
difficulty: 2
minutes: 30
prerequisites: [biology.plants.flowering-plants, biology.animals.needs-life-cycles]
encompasses:
  - { id: biology.plants.flowering-plants, weight: 0.2 }
  - { id: biology.animals.needs-life-cycles, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: แผนภาพการจำแนกสิ่งมีชีวิต
    src: classification-tree.svg
    alt: "แผนภาพต้นไม้ สิ่งมีชีวิตแยกเป็น 3 กลุ่ม กลุ่มพืชใช้เกณฑ์มีดอกหรือไม่ แยกเป็นพืชดอก (มะม่วง ชบา ข้าว หญ้า) และพืชไม่มีดอก (มอส เฟิร์น สน ปรง) กลุ่มสัตว์ใช้เกณฑ์มีกระดูกสันหลังหรือไม่ แยกเป็นสัตว์ไม่มีกระดูกสันหลัง (ไส้เดือน แมลง กุ้ง ปู หอย) และสัตว์มีกระดูกสันหลัง ซึ่งแยกต่อเป็น 5 กลุ่ม ปลา (ปลานิล) สัตว์สะเทินน้ำสะเทินบก (กบ) สัตว์เลื้อยคลาน (งู เต่า) นก (ไก่ เป็ด) และสัตว์เลี้ยงลูกด้วยน้ำนม (แมว คน) กลุ่มที่ไม่ใช่พืชและสัตว์มีตัวอย่าง เห็ด รา ยีสต์ แบคทีเรีย ซึ่งสร้างอาหารเองไม่ได้"
    caption: "แต่ละชั้นของแผนภาพใช้เกณฑ์หนึ่งข้อแบ่งกลุ่ม (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: จัดกลุ่มสัตว์ด้วยลักษณะที่สังเกตได้
    problem: "สัตว์มีกระดูกสันหลังชนิดหนึ่งพบในบ่อน้ำ ตัวอ่อนอยู่ในน้ำและหายใจด้วยเหงือก ตัวเต็มวัยขึ้นมาอยู่บนบก ผิวหนังเปียกชื้น ไม่มีเกล็ด ไม่มีขน สัตว์นี้อยู่กลุ่มใด"
    steps:
      - text: "เป็นสัตว์มีกระดูกสันหลัง จึงต้องหาว่าอยู่กลุ่มใดใน 5 กลุ่ม โดยตัดกลุ่มที่ไม่ตรงออกทีละกลุ่ม"
      - text: "ไม่มีขนเป็นเส้นและไม่มีขนนก จึงไม่ใช่สัตว์เลี้ยงลูกด้วยน้ำนมและไม่ใช่นก"
      - text: "ตัวเต็มวัยขึ้นบกได้ ไม่ได้มีเหงือกตลอดชีวิต จึงไม่ใช่ปลา"
        why: "ปลามีครีบและหายใจด้วยเหงือกตลอดชีวิต"
      - text: "ผิวหนังเปียกชื้น ไม่มีเกล็ด จึงไม่ใช่สัตว์เลื้อยคลาน"
    answer: "สัตว์สะเทินน้ำสะเทินบก เช่น กบ คางคก อึ่งอ่าง"
  - { type: check, problem: biology.diversity.classifying-organisms.p005, prompt: "ดูว่าโลมาหายใจด้วยอะไรและเลี้ยงลูกอย่างไร ไม่ใช่ดูว่าอยู่ที่ไหน" }
  - type: worked-example
    title: สร้างกุญแจจำแนกพืช
    problem: "สร้างกุญแจจำแนกแบบสองทางสำหรับพืช 4 ชนิด คือ มอส เฟิร์น ต้นสน และต้นมะม่วง"
    steps:
      - text: "หาลักษณะที่แบ่งได้ก่อน มะม่วงออกดอก อีก 3 ชนิดไม่ออกดอก ข้อ 1: มีดอกหรือไม่ ใช่ → มะม่วง"
      - text: "เหลือมอส เฟิร์น สน ต้นสนสร้างเมล็ดบนโคน มอสและเฟิร์นไม่มีเมล็ด ข้อ 2: มีเมล็ดหรือไม่ ใช่ → ต้นสน"
        why: "แต่ละข้อต้องแบ่งพืชที่เหลืออยู่ออกเป็นสองพวก"
      - text: "เหลือมอสกับเฟิร์น เฟิร์นมีใบใหญ่และมีจุดสีน้ำตาลใต้ใบ มอสต้นเล็กมากขึ้นเป็นพรมบนหินชื้น ข้อ 3: มีใบใหญ่ที่มีจุดสีน้ำตาลใต้ใบหรือไม่ ใช่ → เฟิร์น ไม่ใช่ → มอส"
    answer: "ได้กุญแจ 3 ข้อ แยกพืช 4 ชนิดครบ (จำนวนข้อน้อยกว่าจำนวนชนิดอยู่ 1)"
  - { type: check, problem: biology.diversity.classifying-organisms.p011, prompt: "เกณฑ์ที่ดีต้องสังเกตได้และทุกคนตอบตรงกัน" }
glossary:
  - { term: การจำแนก, definition: "การแบ่งสิ่งมีชีวิตเป็นกลุ่มตามความเหมือนและความต่างของลักษณะ" }
  - { term: เกณฑ์, definition: "ลักษณะที่ใช้แบ่งกลุ่ม ต้องสังเกตได้และตอบได้ชัดเจน เช่น มีดอกหรือไม่มีดอก" }
  - { term: กุญแจจำแนก, definition: "ชุดคำถามที่ตอบได้ทีละสองทาง ใช้หาชื่อหรือกลุ่มของสิ่งมีชีวิต" }
  - { term: สัตว์มีกระดูกสันหลัง, definition: "สัตว์ที่มีกระดูกต่อกันเป็นข้อ ๆ ตามแนวหลัง ได้แก่ ปลา สัตว์สะเทินน้ำสะเทินบก สัตว์เลื้อยคลาน นก และสัตว์เลี้ยงลูกด้วยน้ำนม" }
  - { term: จุลินทรีย์, definition: "สิ่งมีชีวิตขนาดเล็กมากที่ต้องดูด้วยกล้องจุลทรรศน์ เช่น แบคทีเรีย ยีสต์" }
  - { term: พืชไม่มีดอก, definition: "พืชที่ไม่ออกดอกตลอดชีวิต เช่น มอส เฟิร์น สน ปรง" }
flashcards:
  - { front: "สิ่งมีชีวิต 3 กลุ่มใหญ่", back: "กลุ่มพืช กลุ่มสัตว์ และกลุ่มที่ไม่ใช่พืชและสัตว์ (เห็ด รา ยีสต์ แบคทีเรีย)" }
  - { front: "สัตว์มีกระดูกสันหลัง 5 กลุ่ม", back: "ปลา สัตว์สะเทินน้ำสะเทินบก สัตว์เลื้อยคลาน นก สัตว์เลี้ยงลูกด้วยน้ำนม" }
  - { front: "ลักษณะเฉพาะของนก", back: "มีขนนก (ค้างคาวบินได้แต่ไม่มีขนนก จึงไม่ใช่นก)" }
  - { front: "วาฬเป็นปลาหรือไม่", back: "ไม่ใช่ วาฬหายใจด้วยปอดและเลี้ยงลูกด้วยน้ำนม เป็นสัตว์เลี้ยงลูกด้วยน้ำนม" }
  - { front: "ตัวอย่างพืชไม่มีดอก", back: "มอส เฟิร์น สน ปรง" }
