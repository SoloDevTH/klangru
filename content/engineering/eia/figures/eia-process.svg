<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" width="720" height="620" font-family="sans-serif" font-size="14">
<title>ขั้นตอนโดยทั่วไปของการจัดทำรายงาน EIA</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15211e"/></marker></defs>
<rect x="0" y="0" width="720" height="620" fill="#ffffff"/>
<text x="360.0" y="30.0" text-anchor="middle" font-size="16" fill="#15211e" font-weight="bold">ขั้นตอนโดยทั่วไปของการจัดทำรายงาน EIA (แผนภาพจำลอง)</text>
<rect x="150.0" y="50.0" width="420.0" height="42.0" rx="8" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="2"/>
<text x="360.0" y="76.0" text-anchor="middle" font-size="14" fill="#15211e">1  เจ้าของโครงการเสนอโครงการ</text>
<line x1="360.0" y1="92.0" x2="360.0" y2="114.0" stroke="#15211e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="150.0" y="114.0" width="420.0" height="42.0" rx="8" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="2"/>
<text x="360.0" y="140.0" text-anchor="middle" font-size="14" fill="#15211e">2  กำหนดขอบเขตการศึกษา (ร่างขอบเขต)</text>
<line x1="360.0" y1="156.0" x2="360.0" y2="178.0" stroke="#15211e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="150.0" y="178.0" width="420.0" height="42.0" rx="8" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="2"/>
<text x="360.0" y="204.0" text-anchor="middle" font-size="14" fill="#15211e">3  ศึกษาสภาพแวดล้อมพื้นฐานก่อนโครงการ</text>
<line x1="360.0" y1="220.0" x2="360.0" y2="242.0" stroke="#15211e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="150.0" y="242.0" width="420.0" height="42.0" rx="8" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="2"/>
<text x="360.0" y="268.0" text-anchor="middle" font-size="14" fill="#15211e">4  ทำนายผลกระทบและเสนอมาตรการลดผลกระทบ</text>
<line x1="360.0" y1="284.0" x2="360.0" y2="306.0" stroke="#15211e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="150.0" y="306.0" width="420.0" height="42.0" rx="8" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="2"/>
<text x="360.0" y="332.0" text-anchor="middle" font-size="14" fill="#15211e">5  เสนอแผนติดตามและตรวจสอบหลังโครงการ</text>
<line x1="360.0" y1="348.0" x2="360.0" y2="370.0" stroke="#15211e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="150.0" y="370.0" width="420.0" height="42.0" rx="8" fill="#fff3e0" stroke="#b35c00" stroke-width="2"/>
<text x="360.0" y="396.0" text-anchor="middle" font-size="14" fill="#15211e">6  รับฟังความคิดเห็นของประชาชน</text>
<line x1="360.0" y1="412.0" x2="360.0" y2="434.0" stroke="#15211e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="150.0" y="434.0" width="420.0" height="42.0" rx="8" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="2"/>
<text x="360.0" y="460.0" text-anchor="middle" font-size="14" fill="#15211e">7  จัดทำรายงานฉบับสมบูรณ์</text>
<line x1="360.0" y1="476.0" x2="360.0" y2="498.0" stroke="#15211e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="150.0" y="498.0" width="420.0" height="42.0" rx="8" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="2"/>
<text x="360.0" y="524.0" text-anchor="middle" font-size="14" fill="#15211e">8  หน่วยงานผู้ชำนาญการพิจารณาและมีมติ</text>
<text x="360.0" y="602.0" text-anchor="middle" font-size="12" fill="#555555">ขั้นที่ 6 ต้องเปิดให้ประชาชนมีส่วนร่วมก่อนสรุปผล ตรวจรายละเอียดกับหลักเกณฑ์ปัจจุบันเสมอ</text>
</svg>
