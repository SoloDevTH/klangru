<defs></defs>
<rect x="0" y="0" width="560" height="300" fill="#fff"/>
<rect x="20.0" y="20.0" width="520.0" height="260.0" rx="14" fill="#fff" stroke="#1f4e9c" stroke-width="2.5"/>
<rect x="20.0" y="20.0" width="520.0" height="52.0" rx="14" fill="#dbe8f8" stroke="#1f4e9c" stroke-width="2.5"/>
