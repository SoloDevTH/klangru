  - id: engineering.environmental.eia.p017
    topics:
      - engineering.environmental.eia
    difficulty: 5
    type: numeric
    stem: '(ข้อมูลสมมติ) ผลกระทบของกิจกรรมหนึ่งมีสามสถานการณ์: สถานการณ์แรกความน่าจะเป็น 0.5 คะแนน −50 สถานการณ์ที่สองความน่าจะเป็น 0.3 คะแนน −90 และสถานการณ์ที่สามความน่าจะเป็น 0.2 คะแนน +20 คะแนนคาดหมายเท่ากับเท่าไร (ตอบจำนวนเต็ม)'
    answer:
      value: -48.0
      tolerance: 0.1
    hints:
      - ใช้สูตรคะแนนคาดหมาย = Σ (ความน่าจะเป็น × คะแนน) โดยความน่าจะเป็นรวมเป็น 1
      - สถานการณ์ที่สามเป็นบวก จึงเพิ่มคะแนนรวม
    misconceptions:
      - match: -40.0
        feedback: หาค่าเฉลี่ยธรรมดาโดยไม่ถ่วงน้ำหนักด้วยความน่าจะเป็น ผลจึงไม่ถูกต้อง
    solution: คะแนนคาดหมาย = 0.5 × (−50) + 0.3 × (−90) + 0.2 × 20 = −25 − 27 + 4 = −48 ค่าที่ได้เป็นตัวช่วยประเมินความเสี่ยงโดยรวม ไม่ได้แทนการพิจารณาสถานการณ์ที่รุนแรงที่สุดแยกต่างหาก
    license: CC-BY-SA-4.0
    ai_assisted: true
