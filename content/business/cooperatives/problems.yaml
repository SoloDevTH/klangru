  solution: วิสาหกิจชุมชนจดทะเบียนตามกฎหมายส่งเสริมวิสาหกิจชุมชน ไม่ใช่กฎหมายสหกรณ์ แม้จะเป็นการรวมกลุ่มทางเศรษฐกิจเหมือนกัน (วิสาหกิจชุมชนที่โตขึ้นอาจรวมกันจดทะเบียนเป็นสหกรณ์ได้)
