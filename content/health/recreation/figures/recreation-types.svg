<text x="448.0" y="263.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">กิจกรรมกลางแจ้ง</text>
<text x="448.0" y="286.0" font-size="13" text-anchor="start" font-weight="normal" fill="#333">เช่น เดินป่า ตั้งแคมป์ ดูนก</text>
<rect x="20.0" y="312.0" width="350.0" height="64.0" rx="10" fill="#eef3fa" stroke="#1f4e9a" stroke-width="1.5" />
