    feedback: ผู้เขียนบอกว่า ‘不是要完全不用塑料袋 (bú shì yào wánquán bú yòng sùliàodài)’ จึงไม่ได้เสนอให้หยุดทั้งหมดทันที
  - id: b
    text: นำถุงผ้าไปตลาดเพื่อซื้อของ
    correct: true
    feedback: ถูก ผู้เขียนเสนอให้ใช้ถุงผ้า (布袋 (bùdài)) ไปตลาด
  - id: c
    text: ซื้อของจากห้างสรรพสินค้าเท่านั้น
    feedback: ข้อความไม่ได้บอกให้ซื้อของจากห้าง
  - id: d
    text: ให้รัฐบาลออกกฎหมายใหม่ทันที
    feedback: ข้อความไม่ได้เสนอให้ออกกฎหมาย
  hints:
  - หาประโยคที่มี 可以带 ซึ่งบอกสิ่งที่ควรทำ
  - ดูว่าเสนอของที่ใช้แทนถุงพลาสติก
  - เลือกตัวเลือกที่ตรงกับ 布袋 และ 菜市场
  solution: '**b.** ผู้เขียนเสนอให้ใช้ถุงผ้าไปตลาด (可以带一个布袋去菜市场买菜 (kěyǐ dài yí gè bùdài qù càishìchǎng mǎicài))'
