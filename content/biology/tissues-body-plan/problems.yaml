problems:
  - id: biology.animals.tissues-body-plan.p001
    topics: [biology.animals.tissues-body-plan]
    difficulty: 1
    type: mcq
    stem: "ข้อใดคือเนื้อเยื่อหลักสี่ชนิดของสัตว์"
    choices:
      - { id: a, text: "เยื่อบุผิว เนื้อเยื่อเกี่ยวพัน เนื้อเยื่อกล้ามเนื้อ และเนื้อเยื่อประสาท", correct: true }
      - { id: b, text: "ราก ลำต้น ใบ และดอก", feedback: "นี่คืออวัยวะของพืช ไม่ใช่เนื้อเยื่อหลักของสัตว์" }
      - { id: c, text: "ไซเลม ฟลอเอ็ม และเนื้อเยื่อเจริญ", feedback: "ไซเลมและฟลอเอ็มเป็นเนื้อเยื่อลำเลียงของพืช" }
      - { id: d, text: "กระดูก ไขมัน ผิวหนัง และหัวใจ", feedback: "กระดูกและไขมันเป็นเนื้อเยื่อย่อยของเนื้อเยื่อเกี่ยวพัน ส่วนหัวใจเป็นอวัยวะ" }
    hints:
      - "เนื้อเยื่อหลักเป็นกลุ่มเซลล์ที่แบ่งตามหน้าที่ ไม่ใช่ชื่ออวัยวะ"
      - "มองหาชุดที่มีเนื้อเยื่อสี่กลุ่มใหญ่ทั้งหมดของสัตว์"
    solution: "เนื้อเยื่อหลักของสัตว์มีสี่ชนิด คือ เยื่อบุผิว เนื้อเยื่อเกี่ยวพัน เนื้อเยื่อกล้ามเนื้อ และเนื้อเยื่อประสาท ส่วนรากและลำต้นเป็นอวัยวะของพืช"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.tissues-body-plan.p002
    topics: [biology.animals.tissues-body-plan]
    difficulty: 2
    type: numeric
    stem: "ลูกบาศก์ด้านยาว 2 cm มีอัตราส่วนพื้นที่ผิวต่อปริมาตรเท่าไร (ตอบเป็นตัวเลข หน่วย cm⁻¹)"
    answer: { value: 3, tolerance: 0.01, unit: "cm⁻¹" }
    misconceptions:
      - { match: 1.5, feedback: "คิดพื้นที่ผิวเป็น 6L แทน 6L²: 12 ÷ 8 = 1.5 พื้นที่ผิวต้องยกกำลังสอง" }
      - { match: 0.33, feedback: "หารกลับด้าน ปริมาตรหารด้วยพื้นที่ผิว ได้ 8 ÷ 24 อัตราส่วนต้องเป็นพื้นที่ผิวหารด้วยปริมาตร" }
    hints:
      - "พื้นที่ผิวของลูกบาศก์คือ 6 คูณด้านยกกำลังสอง"
      - "ปริมาตรคือด้านยกกำลังสาม แล้วนำพื้นที่ผิวหารด้วยปริมาตร"
    solution: "พื้นที่ผิว = 6 × 2² = 24 cm² ปริมาตร = 2³ = 8 cm³ อัตราส่วน = 24 ÷ 8 = 3 ต่อ cm"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.tissues-body-plan.p003
    topics: [biology.animals.tissues-body-plan]
    difficulty: 3
    type: expression
    stem: "ลูกบาศก์มีด้าน $L$ จงเขียนอัตราส่วนพื้นที่ผิวต่อปริมาตรในรูปนิพจน์ของ $L$ (พื้นที่ผิวของลูกบาศก์คือ $6L^2$ และปริมาตรคือ $L^3$)"
    prefix: "อัตราส่วน ="
    answer: { latex: "\\frac{6}{L}", variables: [L] }
    misconceptions:
      - { match: "\\frac{6}{L^2}", feedback: "ปริมาตรเป็น L³ ไม่ใช่ L² ผลที่ถูกคือ 6L² ÷ L³ = 6 ÷ L" }
      - { match: "\\frac{L}{6}", feedback: "กลับด้านอัตราส่วน อัตราส่วนคือพื้นที่ผิวหารด้วยปริมาตร" }
    hints:
      - "อัตราส่วนคือพื้นที่ผิวหารด้วยปริมาตร"
      - "เขียนพื้นที่ผิวและปริมาตรเป็นเศษกับส่วน แล้วตัด L ที่เป็นตัวประกอบร่วมออก"
    solution: "อัตราส่วน = $\\frac{6L^2}{L^3} = \\frac{6}{L}$ เมื่อด้านยาวขึ้น อัตราส่วนนี้ลดลง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.tissues-body-plan.p004
    topics: [biology.animals.tissues-body-plan]
    difficulty: 3
    type: numeric
    stem: "ลูกบาศก์ด้านยาว 1 cm มีอัตราส่วนพื้นที่ผิวต่อปริมาตรมากกว่าลูกบาศก์ด้านยาว 10 cm กี่เท่า (ตอบเป็นจำนวนเท่า)"
    answer: { value: 10, tolerance: 0, unit: "เท่า" }
    misconceptions:
      - { match: 100, feedback: "เทียบเฉพาะพื้นที่ผิว 600 ÷ 6 = 100 แต่ต้องเทียบอัตราส่วนพื้นที่ผิวต่อปริมาตร" }
      - { match: 0.1, feedback: "หารกลับด้าน 0.6 ÷ 6 = 0.1 ลูกบาศก์เล็กมีอัตราส่วนมากกว่า ค่าของลูกเล็กต้องเป็นตัวตั้ง จึงได้ 6 ÷ 0.6 = 10" }
    hints:
      - "คำนวณอัตราส่วนของลูกบาศก์แต่ละลูกก่อน ใช้สูตร 6 ÷ ด้าน"
      - "เอาค่าของลูกบาศก์เล็กหารด้วยค่าของลูกบาศก์ใหญ่"
    solution: "ด้าน 1 cm ได้ 6 ต่อ cm และด้าน 10 cm ได้ 0.6 ต่อ cm อัตราส่วน 6 ÷ 0.6 = 10 เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.tissues-body-plan.p005
    topics: [biology.animals.tissues-body-plan]
    difficulty: 2
    type: mcq
    stem: "เหตุใดลูกนกกระจอกในสวนหลังบ้านจึงต้องกินอาหารบ่อยเมื่อเทียบกับน้ำหนักตัวของมัน"
    choices:
      - { id: a, text: "เพราะมีพื้นที่ผิวเทียบกับปริมาตรมาก เสียความร้อนได้เร็ว จึงต้องเผาผลาญมากต่อกรัม", correct: true }
      - { id: b, text: "เพราะกระดูกเบากว่า จึงย่อยอาหารได้เร็วกว่า", feedback: "ขนาดกระดูกไม่ได้เป็นตัวกำหนดความต้องการพลังงาน" }
      - { id: c, text: "เพราะมีปริมาตรเซลล์มากกว่าสัตว์ใหญ่เมื่อเทียบกับพื้นที่ผิว", feedback: "สัตว์เล็กมีพื้นที่ผิวเทียบกับปริมาตรมากกว่า ไม่ใช่น้อยกว่า" }
      - { id: d, text: "เพราะจำนวนเซลล์ในร่างกายน้อยกว่าสัตว์ใหญ่", feedback: "การใช้พลังงานขึ้นกับการเผาผลาญและการเสียความร้อน ไม่ได้ขึ้นกับจำนวนเซลล์โดยตรง" }
    hints:
      - "ลองนึกว่าความร้อนในร่างกายออกทางไหน และออกมากเท่าไร"
      - "เมื่อด้านของลูกบาศก์เล็กลง พื้นที่ผิวเทียบกับปริมาตรเปลี่ยนไปทางไหน"
    solution: "สัตว์เล็กมีพื้นที่ผิวเทียบกับปริมาตรมาก จึงเสียความร้อนให้สิ่งแวดล้อมได้เร็ว ต้องเผาผลาญมากต่อกรัมเพื่อรักษาอุณหภูมิ จึงต้องกินอาหารบ่อย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.tissues-body-plan.p006
    topics: [biology.animals.tissues-body-plan]
    difficulty: 2
    type: mcq
    stem: "กิ้งก่าในสวนที่ออกมาอาบแดดตอนเช้า ตรงกับลักษณะของสัตว์กลุ่มใด และข้อใดอธิบายความต่างของสัตว์สองกลุ่มได้ถูกต้อง"
    choices:
      - { id: a, text: "สัตว์เลือดอุ่นผลิตความร้อนจากเมแทบอลิซึมเป็นหลัก ส่วนสัตว์เลือดเย็นพึ่งความร้อนจากภายนอกเป็นหลัก", correct: true }
      - { id: b, text: "สัตว์เลือดอุ่นอยู่ได้เฉพาะที่อากาศอุ่น ส่วนสัตว์เลือดเย็นอยู่ได้เฉพาะที่อากาศเย็น", feedback: "สัตว์ทั้งสองกลุ่มอยู่ได้หลายสภาพอากาศ เช่น นกในขั้วโลกก็เป็นสัตว์เลือดอุ่น" }
      - { id: c, text: "สัตว์เลือดเย็นไม่มีการเผาผลาญเลย", feedback: "สัตว์เลือดเย็นก็มีเมแทบอลิซึม เพียงแต่ผลิตความร้อนได้น้อยกว่าเป็นหลัก" }
      - { id: d, text: "สัตว์เลือดอุ่นมีกระดูก ส่วนสัตว์เลือดเย็นไม่มีกระดูก", feedback: "สัตว์ทั้งสองกลุ่มมีโครงกระดูกได้ เช่น ปลาและนก" }
    hints:
      - "ประเด็นสำคัญคือแหล่งความร้อนหลักของร่างกาย"
      - "กิ้งก่าอาบแดดเพื่อให้ร่างกายอุ่นขึ้นจากอะไร"
    solution: "กิ้งก่าเป็นสัตว์เลือดเย็นที่พึ่งความร้อนจากแสงแดดเป็นหลัก จึงอาบแดดตอนเช้าเพื่อให้ร่างกายพร้อมทำงาน ส่วนสัตว์เลือดอุ่นผลิตความร้อนเองจากเมแทบอลิซึม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.tissues-body-plan.p007
    topics: [biology.animals.tissues-body-plan]
    difficulty: 2
    type: numeric
    stem: "ลูกบาศก์ชิ้นหนึ่งด้านยาว 4 cm มีปริมาตรมากกว่าลูกบาศก์ด้านยาว 2 cm กี่เท่า (ตอบเป็นจำนวนเท่า)"
    answer: { value: 8, tolerance: 0, unit: "เท่า" }
    misconceptions:
      - { match: 4, feedback: "ใช้อัตราส่วนของพื้นที่ผิว 96 ÷ 24 = 4 แทนอัตราส่วนของปริมาตร ปริมาตรต้องยกกำลังสาม" }
      - { match: 2, feedback: "ใช้อัตราส่วนของด้าน 4 ÷ 2 = 2 แทนอัตราส่วนของปริมาตร ต้องยกกำลังสาม" }
    hints:
      - "ปริมาตรของลูกบาศก์คือด้านยกกำลังสาม"
      - "หาปริมาตรของลูกบาศก์ทั้งสองลูกแล้วนำมาหารกัน"
    solution: "ปริมาตรด้าน 4 cm = 64 cm³ ปริมาตรด้าน 2 cm = 8 cm³ ได้ 64 ÷ 8 = 8 เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.tissues-body-plan.p008
    topics: [biology.animals.tissues-body-plan]
    difficulty: 2
    type: match
    stem: "จับคู่เนื้อเยื่อกับตำแหน่งหรือหน้าที่ที่พบบ่อย"
    pairs:
      - { left: "เยื่อบุผิวแบบแบน", right: "ถุงลมปอดที่แลกเปลี่ยนแก๊ส" }
      - { left: "เยื่อบุผิวแบบทรงกระบอกมีซิเลีย", right: "เยื่อบุหลอดลมที่พัดเมือกออก" }
      - { left: "เนื้อเยื่อกระดูกอ่อน", right: "ผิวข้อต่อและโครงของจมูก" }
      - { left: "เนื้อเยื่อไขมัน", right: "สะสมพลังงานและเป็นฉนวนความร้อน" }
      - { left: "เนื้อเยื่อประสาท", right: "รับสิ่งเร้าและส่งกระแสประสาท" }
    hints:
      - "เนื้อเยื่อบุผิวทำหน้าที่ปกป้องหรือแลกเปลี่ยนสารที่ผิว"
      - "เนื้อเยื่อเกี่ยวพันมักมีเมทริกซ์และเส้นใยที่ทำให้แข็งหรือยืดหยุ่น"
    solution: "ถุงลมปอดเป็นเยื่อบุผิวแบบแบนบางให้แก๊สผ่านได้ง่าย หลอดลมมีซิเลียที่พัดเมือก กระดูกอ่อนพบที่ข้อต่อและจมูก ไขมันสะสมพลังงานและเป็นฉนวน เนื้อเยื่อประสาทรับและส่งกระแสประสาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.tissues-body-plan.p009
    topics: [biology.animals.tissues-body-plan]
    difficulty: 2
    type: match
    stem: "จับคู่ชนิดกล้ามเนื้อกับลักษณะที่ถูกต้อง"
    pairs:
      - { left: "กล้ามเนื้อโครงร่าง", right: "มีลาย ทำงานตามการสั่งการได้" }
      - { left: "กล้ามเนื้อเรียบ", right: "ไม่มีลาย อยู่ในผนังลำไส้และหลอดเลือด" }
      - { left: "กล้ามเนื้อหัวใจ", right: "มีลาย แตกกิ่ง ส่งสัญญาณผ่านรอยต่อพิเศษ" }
    hints:
      - "ดูว่ากล้ามเนื้อชนิดใดมีลาย และชนิดใดอยู่ในอวัยวะภายใน"
      - "กล้ามเนื้อหัวใจมีลายเหมือนกล้ามเนื้อโครงร่าง แต่มีรูปร่างและรอยต่อต่างออกไป"
    solution: "กล้ามเนื้อโครงร่างมีลายและสั่งการได้ กล้ามเนื้อเรียบไม่มีลายและพบในผนังลำไส้และหลอดเลือด กล้ามเนื้อหัวใจมีลาย แตกกิ่ง และรอยต่อพิเศษ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.tissues-body-plan.p010
    topics: [biology.animals.tissues-body-plan]
    difficulty: 2
    type: text
    stem: "เนื้อเยื่อเกี่ยวพันชนิดใดแข็งแรงที่สุด และมีแคลเซียมฟอสเฟตสะสมอยู่ในเมทริกซ์"
    accepted: ["กระดูก", "เนื้อเยื่อกระดูก", "bone", "bone tissue"]
    hints:
      - "เนื้อเยื่อนี้เป็นโครงพยุงร่างกายของสัตว์กระดูกสันหลัง"
      - "เซลล์ของเนื้อเยื่อนี้อยู่ในช่องว่างของเมทริกซ์ที่แข็ง"
    solution: "กระดูก (bone) เมทริกซ์แข็งเพราะมีแคลเซียมฟอสเฟตสะสม เซลล์กระดูกอยู่ในช่องว่างของเมทริกซ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.tissues-body-plan.p011
    topics: [biology.animals.tissues-body-plan]
    difficulty: 3
    type: mcq
    stem: "เซลล์ที่อยู่ในช่องว่างของเมทริกซ์กระดูกแข็งเรียกว่าอะไร"
    choices:
      - { id: a, text: "ออสทีโอไซต์", correct: true }
      - { id: b, text: "คอนโดรไซต์", feedback: "คอนโดรไซต์อยู่ในช่องว่างของกระดูกอ่อน ไม่ใช่กระดูกแข็ง" }
      - { id: c, text: "ไฟโบรบลาสต์", feedback: "ไฟโบรบลาสต์ผลิตเส้นใยในเนื้อเยื่อเกี่ยวพันหลวม ไม่ได้อยู่ในช่องว่างของกระดูก" }
      - { id: d, text: "นิวรอน", feedback: "นิวรอนเป็นเซลล์ของเนื้อเยื่อประสาท" }
    hints:
      - "เซลล์นี้อยู่ในเนื้อเยื่อเกี่ยวพันที่มีเมทริกซ์แข็งที่สุด"
      - "ระวังสับสนกับเซลล์ของกระดูกอ่อนซึ่งอยู่ในช่องว่างเช่นกัน"
    solution: "ออสทีโอไซต์ (osteocyte) เป็นเซลล์กระดูกที่อยู่ในช่องว่างของเมทริกซ์แข็ง ส่วนคอนโดรไซต์อยู่ในกระดูกอ่อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.tissues-body-plan.p012
    topics: [biology.animals.tissues-body-plan]
    difficulty: 2
    type: mcq
    stem: "เนื้อเยื่อบุผิวแบบหลายชั้นพบมากที่สุดที่บริเวณใด"
    choices:
      - { id: a, text: "ผิวหนังชั้นนอกที่ต้องทนการขัดถู", correct: true }
