    stem: "ตู้ปลาทรงสี่เหลี่ยมมุมฉากยาว 40 ซม. กว้าง 20 ซม. สูง 25 ซม. จุน้ำได้กี่ลิตร (1 ลูกบาศก์เซนติเมตร = 1 มิลลิลิตร)"
    answer: { value: 20, unit: L }
    hints:
      - "หาจำนวนลูกบาศก์เซนติเมตร: ชั้นละ $40 \\times 20$ มี 25 ชั้น"
