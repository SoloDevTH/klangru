    type: mcq
    stem: "เพชรและแกรไฟต์ประกอบด้วยคาร์บอนล้วน แต่แกรไฟต์นำไฟฟ้าได้และใช้ทำขั้วไฟฟ้า ส่วนเพชรไม่นำไฟฟ้า ข้อใดอธิบายได้ถูกต้อง"
