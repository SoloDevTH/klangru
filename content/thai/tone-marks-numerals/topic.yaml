id: thai.writing.tone-marks-numerals
subject: thai
title: { th: รูปวรรณยุกต์และเลขไทย, en: Thai tone marks and Thai numerals }
summary: รู้จักรูปวรรณยุกต์ 4 รูป วางให้ถูกตำแหน่ง แยกรูปกับเสียงวรรณยุกต์ อ่านและเขียนเลขไทย ๐ ถึง ๙ และจำนวนหลายหลัก
difficulty: 1
minutes: 25
prerequisites: [thai.writing.consonants]
encompasses:
  - { id: thai.writing.consonants, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: tone-mark-forms.svg
    alt: "ภาพสองแถว แถวบน รูปวรรณยุกต์ 4 รูป: ◌่ ไม้เอก เช่น ไก่ / ◌้ ไม้โท เช่น บ้าน / ◌๊ ไม้ตรี เช่น โต๊ะ / ◌๋ ไม้จัตวา เช่น จ๋า แถวล่าง ตำแหน่งที่วาง: ป่า (บนพยัญชนะต้น) / ที่ (บนสระข้างบน) / กล้า (บนพยัญชนะตัวที่สอง) / น้ำ (บนพยัญชนะ ไม่ใช่บนสระอำ)"
    caption: "รูปวรรณยุกต์ 4 รูป และตำแหน่งที่วาง"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: thai-numerals.svg
    alt: "ตารางเลขไทย 10 ช่อง แต่ละช่องมีเลขไทย เลขอารบิก และคำอ่าน: ๐ 0 ศูนย์, ๑ 1 หนึ่ง, ๒ 2 สอง, ๓ 3 สาม, ๔ 4 สี่, ๕ 5 ห้า, ๖ 6 หก, ๗ 7 เจ็ด, ๘ 8 แปด, ๙ 9 เก้า"
    caption: "เลขไทย ๐–๙ กับเลขอารบิกและคำอ่าน"
  - type: worked-example
    title: เขียนคำว่า ปั้น ให้ครบทุกเครื่องหมาย
    problem: "เขียนคำ: พยัญชนะต้น ป + สระอะ + ตัวสะกด น + ไม้โท"
    steps:
      - text: "สระอะเมื่อมีตัวสะกดเปลี่ยนเป็นไม้หันอากาศ ◌ั เขียนบน ป"
      - text: "ไม้โทต้องอยู่บนสุด สูงกว่าไม้หันอากาศ"
        why: "เมื่อมีสระข้างบน รูปวรรณยุกต์วางเหนือสระ ไม่วางทับหรือวางข้างสระ"
      - text: "ป มีหางยาวขึ้นข้างบน ให้เขียนเครื่องหมายค่อนมาทางซ้าย ไม่ทับหาง"
      - text: "ตามด้วยตัวสะกด น"
    answer: "ปั้น"
  - { type: check, problem: thai.writing.tone-marks-numerals.p006, prompt: "คำควบกล้ำวางวรรณยุกต์ตรงไหน" }
  - type: worked-example
    title: อ่านจำนวนเลขไทยสี่หลัก
    problem: "อ่าน ๑๓๒๓ และเขียนเป็นเลขอารบิก"
    steps:
      - text: "เปลี่ยนทีละตัว: ๑ = 1, ๓ = 3, ๒ = 2, ๓ = 3"
      - text: "เรียงหลักเหมือนเลขอารบิก ได้ 1323"
        why: "เลขไทยใช้ระบบหลักเดียวกับเลขอารบิก"
      - text: "อ่านว่า หนึ่งพันสามร้อยยี่สิบสาม"
    answer: "1323 (หนึ่งพันสามร้อยยี่สิบสาม) เป็นเบอร์สายด่วนสุขภาพจิต กรมสุขภาพจิต"
  - { type: check, problem: thai.writing.tone-marks-numerals.p008, prompt: "แปลงเป็นเลขอารบิกก่อนเปรียบเทียบ" }
glossary:
  - { term: รูปวรรณยุกต์, definition: "เครื่องหมายที่เขียนบนพยัญชนะ มี 4 รูป คือ ไม้เอก ไม้โท ไม้ตรี ไม้จัตวา" }
  - { term: เสียงวรรณยุกต์, definition: "ระดับเสียงสูงต่ำของพยางค์ มี 5 เสียง คือ สามัญ เอก โท ตรี จัตวา" }
  - { term: เลขไทย, definition: "ตัวเลข ๐ ๑ ๒ ๓ ๔ ๕ ๖ ๗ ๘ ๙ ใช้หลักเหมือนเลขอารบิก" }
  - { term: คำควบกล้ำ, definition: "พยัญชนะสองตัวออกเสียงควบกัน เช่น กล ปล วรรณยุกต์วางบนตัวที่สอง" }
flashcards:
  - { front: "รูปวรรณยุกต์มีกี่รูป เสียงวรรณยุกต์มีกี่เสียง", back: "4 รูป 5 เสียง (เสียงสามัญไม่มีรูป)" }
  - { front: "คำที่มีสระข้างบน เช่น ที่ วางวรรณยุกต์ตรงไหน", back: "เหนือสระข้างบน" }
  - { front: "คำควบหรืออักษรนำ เช่น กล้า หน้า วางวรรณยุกต์บนตัวใด", back: "บนพยัญชนะตัวที่สอง (ล, น)" }
  - { front: "๒๕๖๙ คือเลขอะไร", back: "2569" }
  - { front: "๔ กับ ๕ ต่างกันอย่างไร", back: "๕ (ห้า) มีหางยาวตวัดขึ้น ๔ (สี่) ไม่มี" }
references:
