copyright: "หลักสูตรแกนกลางฯ เป็นเอกสารที่กระทรวงศึกษาธิการประกาศใช้โดยคำสั่งกระทรวง ตามการตีความของเรา เอกสารนี้เป็นประกาศหรือคำสั่งของหน่วยงานรัฐ จึงไม่เป็นงานอันมีลิขสิทธิ์ตาม พ.ร.บ.ลิขสิทธิ์ พ.ศ. 2537 มาตรา 7 คัดข้อความตัวชี้วัดได้ครบ (การตีความนี้ไม่ใช่คำปรึกษาทางกฎหมาย)"
completeness: full-text
strands:
  - id: ท1
    title: การอ่าน
    standards:
      - id: ท 1.1
        text: "ใช้กระบวนการอ่านสร้างความรู้และความคิด เพื่อนำไปใช้ตัดสินใจ แก้ปัญหาในการดำเนินชีวิตและมีนิสัยรักการอ่าน"
        indicators:
          - { id: "ท 1.1 ป.1/1", level: ป.1, text: "อ่านออกเสียงคำ คำคล้องจอง และข้อความสั้นๆ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “คำคล้องจอง|และข้อความ” เว้นวรรค" }
          - { id: "ท 1.1 ป.1/2", level: ป.1, text: "บอกความหมายของคำ และข้อความที่อ่าน" }
          - { id: "ท 1.1 ป.1/3", level: ป.1, text: "ตอบคำถามเกี่ยวกับเรื่องที่อ่าน" }
          - { id: "ท 1.1 ป.1/4", level: ป.1, text: "เล่าเรื่องย่อจากเรื่องที่อ่าน" }
          - { id: "ท 1.1 ป.1/5", level: ป.1, text: "คาดคะเนเหตุการณ์จากเรื่องที่อ่าน" }
          - { id: "ท 1.1 ป.1/6", level: ป.1, text: "อ่านหนังสือตามความสนใจอย่างสม่ำเสมอและนำเสนอเรื่องที่อ่าน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ความสนใจ|อย่างสม่ำเสมอ” ไม่เว้นวรรค; “และนำเสนอ|เรื่องที่อ่าน” ไม่เว้นวรรค" }
          - { id: "ท 1.1 ป.1/7", level: ป.1, text: "บอกความหมายของเครื่องหมายหรือสัญลักษณ์สำคัญที่มักพบเห็นในชีวิตประจำวัน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ของเครื่องหมาย|หรือสัญลักษณ์” ไม่เว้นวรรค; “มักพบเห็น|ในชีวิตประจำวัน” ไม่เว้นวรรค" }
          - { id: "ท 1.1 ป.1/8", level: ป.1, text: "มีมารยาทในการอ่าน" }
          - { id: "ท 1.1 ป.2/1", level: ป.2, text: "อ่านออกเสียงคำ คำคล้องจอง ข้อความ และบทร้อยกรองง่ายๆ ได้ถูกต้อง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “คำคล้องจอง|ข้อความ” เว้นวรรค" }
          - { id: "ท 1.1 ป.2/2", level: ป.2, text: "อธิบายความหมายของคำและข้อความที่อ่าน" }
          - { id: "ท 1.1 ป.2/3", level: ป.2, text: "ตั้งคำถามและตอบคำถามเกี่ยวกับเรื่องที่อ่าน" }
          - { id: "ท 1.1 ป.2/4", level: ป.2, text: "ระบุใจความสำคัญและรายละเอียดจากเรื่องที่อ่าน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และรายละเอียด|จากเรื่องที่อ่าน” ไม่เว้นวรรค" }
          - { id: "ท 1.1 ป.2/5", level: ป.2, text: "แสดงความคิดเห็น และคาดคะเนเหตุการณ์จากเรื่องที่อ่าน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “คาดคะเน|เหตุการณ์จาก” ไม่เว้นวรรค" }
          - { id: "ท 1.1 ป.2/6", level: ป.2, text: "อ่านหนังสือตามความสนใจอย่างสม่ำเสมอและนำเสนอเรื่องที่อ่าน" }
          - { id: "ท 1.1 ป.2/7", level: ป.2, text: "อ่านข้อเขียนเชิงอธิบาย และปฏิบัติตามคำสั่งหรือข้อแนะนำ" }
          - { id: "ท 1.1 ป.2/8", level: ป.2, text: "มีมารยาทในการอ่าน" }
          - { id: "ท 1.1 ป.3/1", level: ป.3, text: "อ่านออกเสียงคำ ข้อความ เรื่องสั้นๆ และบทร้อยกรองง่ายๆ ได้ถูกต้อง คล่องแคล่ว" }
          - { id: "ท 1.1 ป.3/2", level: ป.3, text: "อธิบายความหมายของคำและข้อความที่อ่าน" }
          - { id: "ท 1.1 ป.3/3", level: ป.3, text: "ตั้งคำถามและตอบคำถามเชิงเหตุผลเกี่ยวกับเรื่องที่อ่าน" }
          - { id: "ท 1.1 ป.3/4", level: ป.3, text: "ลำดับเหตุการณ์และคาดคะเนเหตุการณ์จากเรื่องที่อ่าน โดยระบุเหตุผลประกอบ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และคาดคะเน|เหตุการณ์จาก” ไม่เว้นวรรค" }
          - { id: "ท 1.1 ป.3/5", level: ป.3, text: "สรุปความรู้และข้อคิดจากเรื่องที่อ่านเพื่อนำไปใช้ในชีวิตประจำวัน" }
          - { id: "ท 1.1 ป.3/6", level: ป.3, text: "อ่านหนังสือตามความสนใจอย่างสม่ำเสมอ และนำเสนอเรื่องที่อ่าน" }
          - { id: "ท 1.1 ป.3/7", level: ป.3, text: "อ่านข้อเขียนเชิงอธิบายและปฏิบัติตามคำสั่งหรือข้อแนะนำ" }
          - { id: "ท 1.1 ป.3/8", level: ป.3, text: "อธิบายความหมายของข้อมูลจากแผนภาพ แผนที่และแผนภูมิ" }
          - { id: "ท 1.1 ป.3/9", level: ป.3, text: "มีมารยาทในการอ่าน" }
          - { id: "ท 1.1 ป.4/1", level: ป.4, text: "อ่านออกเสียงบทร้อยแก้วและบทร้อยกรองได้ถูกต้อง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “บทร้อยแก้วและ|บทร้อยกรอง” ไม่เว้นวรรค" }
          - { id: "ท 1.1 ป.4/2", level: ป.4, text: "อธิบายความหมายของคำ ประโยค และสำนวนจากเรื่องที่อ่าน" }
          - { id: "ท 1.1 ป.4/3", level: ป.4, text: "อ่านเรื่องสั้นๆ ตามเวลาที่กำหนด และตอบคำถามจากเรื่องที่อ่าน" }
          - { id: "ท 1.1 ป.4/4", level: ป.4, text: "แยกข้อเท็จจริงและข้อคิดเห็นจากเรื่องที่อ่าน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และข้อคิดเห็น|จากเรื่องที่อ่าน” ไม่เว้นวรรค" }
          - { id: "ท 1.1 ป.4/5", level: ป.4, text: "คาดคะเนเหตุการณ์จากเรื่องที่อ่าน โดยระบุเหตุผลประกอบ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “คาดคะเน|เหตุการณ์จาก” ไม่เว้นวรรค" }
          - { id: "ท 1.1 ป.4/6", level: ป.4, text: "สรุปความรู้และข้อคิดจากเรื่องที่อ่านเพื่อนำไปใช้ในชีวิตประจำวัน" }
          - { id: "ท 1.1 ป.4/7", level: ป.4, text: "อ่านหนังสือที่มีคุณค่าตามความสนใจอย่างสม่ำเสมอและแสดงความคิดเห็นเกี่ยวกับเรื่องที่อ่าน" }
          - { id: "ท 1.1 ป.4/8", level: ป.4, text: "มีมารยาทในการอ่าน" }
          - { id: "ท 1.1 ป.5/1", level: ป.5, text: "อ่านออกเสียงบทร้อยแก้วและบทร้อยกรองได้ถูกต้อง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “บทร้อยแก้วและ|บทร้อยกรอง” ไม่เว้นวรรค" }
          - { id: "ท 1.1 ป.5/2", level: ป.5, text: "อธิบายความหมายของคำ ประโยค และข้อความที่เป็นการบรรยาย และการพรรณนา", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ประโยค|และข้อความ” เว้นวรรค; “ที่เป็นการบรรยาย|และการพรรณนา” เว้นวรรค" }
          - { id: "ท 1.1 ป.5/3", level: ป.5, text: "อธิบายความหมายโดยนัยจากเรื่องที่อ่านอย่างหลากหลาย" }
          - { id: "ท 1.1 ป.5/4", level: ป.5, text: "แยกข้อเท็จจริงและข้อคิดเห็นจากเรื่องที่อ่าน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และข้อคิดเห็น|จากเรื่องที่อ่าน” ไม่เว้นวรรค" }
          - { id: "ท 1.1 ป.5/5", level: ป.5, text: "วิเคราะห์และแสดงความคิดเห็นเกี่ยวกับเรื่องที่อ่าน เพื่อนำไปใช้ในการดำเนินชีวิต", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “แสดงความคิดเห็น|เกี่ยวกับ” ไม่เว้นวรรค" }
          - { id: "ท 1.1 ป.5/6", level: ป.5, text: "อ่านงานเขียนเชิงอธิบาย คำสั่ง ข้อแนะนำ และปฏิบัติตาม", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “คำสั่ง|ข้อแนะนำ” เว้นวรรค" }
          - { id: "ท 1.1 ป.5/7", level: ป.5, text: "อ่านหนังสือที่มีคุณค่าตามความสนใจอย่างสม่ำเสมอและแสดงความคิดเห็นเกี่ยวกับเรื่องที่อ่าน" }
          - { id: "ท 1.1 ป.5/8", level: ป.5, text: "มีมารยาทในการอ่าน" }
          - { id: "ท 1.1 ป.6/1", level: ป.6, text: "อ่านออกเสียงบทร้อยแก้วและบทร้อยกรองได้ถูกต้อง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “บทร้อยแก้วและ|บทร้อยกรอง” ไม่เว้นวรรค" }
          - { id: "ท 1.1 ป.6/2", level: ป.6, text: "อธิบายความหมายของคำ ประโยค และข้อความที่เป็นโวหาร", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ประโยค|และข้อความ” เว้นวรรค" }
          - { id: "ท 1.1 ป.6/3", level: ป.6, text: "อ่านเรื่องสั้นๆ อย่างหลากหลายโดยจับเวลาแล้วถามเกี่ยวกับเรื่องที่อ่าน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “อย่างหลากหลาย|โดยจับเวลา” ไม่เว้นวรรค; “แล้วถามเกี่ยวกับ|เรื่องที่อ่าน” ไม่เว้นวรรค" }
          - { id: "ท 1.1 ป.6/4", level: ป.6, text: "แยกข้อเท็จจริงและข้อคิดเห็นจากเรื่องที่อ่าน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และข้อคิดเห็น|จากเรื่องที่อ่าน” ไม่เว้นวรรค" }
          - { id: "ท 1.1 ป.6/5", level: ป.6, text: "อธิบายการนำความรู้และความคิดจากเรื่องที่อ่านไปตัดสินใจแก้ปัญหาในการดำเนินชีวิต" }
          - { id: "ท 1.1 ป.6/6", level: ป.6, text: "อ่านงานเขียนเชิงอธิบาย คำสั่ง ข้อแนะนำและปฏิบัติตาม", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “คำสั่ง|ข้อแนะนำและ” เว้นวรรค" }
          - { id: "ท 1.1 ป.6/7", level: ป.6, text: "อธิบายความหมายของข้อมูลจากการอ่านแผนผัง แผนที่ แผนภูมิ และกราฟ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “แผนภูมิ|และกราฟ” เว้นวรรค" }
          - { id: "ท 1.1 ป.6/8", level: ป.6, text: "อ่านหนังสือตามความสนใจ และอธิบายคุณค่าที่ได้รับ" }
          - { id: "ท 1.1 ป.6/9", level: ป.6, text: "มีมารยาทในการอ่าน" }
          - { id: "ท 1.1 ม.1/1", level: ม.1, text: "อ่านออกเสียงบทร้อยแก้วและบทร้อยกรองได้ถูกต้องเหมาะสมกับเรื่องที่อ่าน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “บทร้อยแก้วและ|บทร้อยกรองได้ถูกต้อง” ไม่เว้นวรรค" }
          - { id: "ท 1.1 ม.1/2", level: ม.1, text: "จับใจความสำคัญจากเรื่องที่อ่าน" }
          - { id: "ท 1.1 ม.1/3", level: ม.1, text: "ระบุเหตุและผล และข้อเท็จจริงกับข้อคิดเห็นจากเรื่องที่อ่าน" }
          - { id: "ท 1.1 ม.1/4", level: ม.1, text: "ระบุและอธิบายคำเปรียบเทียบและคำที่มีหลายความหมายในบริบทต่างๆ จากการอ่าน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “คำที่มีหลายความหมาย|ในบริบทต่างๆ” ไม่เว้นวรรค" }
          - { id: "ท 1.1 ม.1/5", level: ม.1, text: "ตีความคำยากในเอกสารวิชาการ โดยพิจารณาจากบริบท" }
          - { id: "ท 1.1 ม.1/6", level: ม.1, text: "ระบุข้อสังเกต และความสมเหตุสมผลของงานเขียนประเภทชักจูงโน้มน้าวใจ" }
          - { id: "ท 1.1 ม.1/7", level: ม.1, text: "ปฏิบัติตามคู่มือแนะนำวิธีการใช้งานของเครื่องมือ หรือเครื่องใช้ในระดับที่ยากขึ้น" }
          - { id: "ท 1.1 ม.1/8", level: ม.1, text: "วิเคราะห์คุณค่าที่ได้รับจากการอ่านงานเขียนอย่างหลากหลายเพื่อนำไปใช้แก้ปัญหาในชีวิต", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “อย่างหลากหลาย|เพื่อนำไปใช้แก้ปัญหา” ไม่เว้นวรรค" }
          - { id: "ท 1.1 ม.1/9", level: ม.1, text: "มีมารยาทในการอ่าน" }
          - { id: "ท 1.1 ม.2/1", level: ม.2, text: "อ่านออกเสียงบทร้อยแก้วและบทร้อยกรองได้ถูกต้อง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “บทร้อยแก้วและ|บทร้อยกรองได้ถูกต้อง” ไม่เว้นวรรค" }
          - { id: "ท 1.1 ม.2/2", level: ม.2, text: "จับใจความสำคัญ สรุปความ และอธิบายรายละเอียดจากเรื่องที่อ่าน" }
          - { id: "ท 1.1 ม.2/3", level: ม.2, text: "เขียนผังความคิดเพื่อแสดงความเข้าใจในบทเรียนต่างๆ ที่อ่าน" }
          - { id: "ท 1.1 ม.2/4", level: ม.2, text: "อภิปรายแสดงความคิดเห็น และข้อโต้แย้งเกี่ยวกับเรื่องที่อ่าน" }
          - { id: "ท 1.1 ม.2/5", level: ม.2, text: "วิเคราะห์และจำแนกข้อเท็จจริง ข้อมูลสนับสนุนและข้อคิดเห็นจากบทความที่อ่าน" }
          - { id: "ท 1.1 ม.2/6", level: ม.2, text: "ระบุข้อสังเกตการชวนเชื่อ การโน้มน้าว หรือความสมเหตุสมผลของงานเขียน" }
          - { id: "ท 1.1 ม.2/7", level: ม.2, text: "อ่านหนังสือ บทความ หรือคำประพันธ์อย่างหลากหลาย และประเมินคุณค่าหรือแนวคิดที่ได้จากการอ่าน เพื่อนำไปใช้แก้ปัญหาในชีวิต" }
          - { id: "ท 1.1 ม.2/8", level: ม.2, text: "มีมารยาทในการอ่าน" }
          - { id: "ท 1.1 ม.3/1", level: ม.3, text: "อ่านออกเสียงบทร้อยแก้วและบทร้อยกรองได้ถูกต้องและเหมาะสมกับเรื่องที่อ่าน" }
          - { id: "ท 1.1 ม.3/2", level: ม.3, text: "ระบุความแตกต่างของคำที่มีความหมายโดยตรงและความหมายโดยนัย" }
          - { id: "ท 1.1 ม.3/3", level: ม.3, text: "ระบุใจความสำคัญและรายละเอียดของข้อมูลที่สนับสนุนจากเรื่องที่อ่าน" }
          - { id: "ท 1.1 ม.3/4", level: ม.3, text: "อ่านเรื่องต่างๆ แล้วเขียนกรอบแนวคิด ผังความคิด บันทึก ย่อความ และรายงาน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “บันทึก|ย่อความ” เว้นวรรค" }
          - { id: "ท 1.1 ม.3/5", level: ม.3, text: "วิเคราะห์ วิจารณ์ และประเมินเรื่องที่อ่านโดยใช้กลวิธีการเปรียบเทียบ เพื่อให้ผู้อ่านเข้าใจได้ดีขึ้น" }
          - { id: "ท 1.1 ม.3/6", level: ม.3, text: "ประเมินความถูกต้องของข้อมูลที่ใช้สนับสนุนในเรื่องที่อ่าน" }
          - { id: "ท 1.1 ม.3/7", level: ม.3, text: "วิจารณ์ความสมเหตุสมผล การลำดับความ และความเป็นไปได้ของเรื่อง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และความเป็นไปได้|ของเรื่อง” ไม่เว้นวรรค" }
          - { id: "ท 1.1 ม.3/8", level: ม.3, text: "วิเคราะห์เพื่อแสดงความคิดเห็นโต้แย้งเกี่ยวกับเรื่องที่อ่าน" }
          - { id: "ท 1.1 ม.3/9", level: ม.3, text: "ตีความและประเมินคุณค่า แนวคิดที่ได้จากงานเขียนอย่างหลากหลาย เพื่อนำไปใช้แก้ปัญหาในชีวิต" }
          - { id: "ท 1.1 ม.3/10", level: ม.3, text: "มีมารยาทในการอ่าน" }
          - { id: "ท 1.1 ม.4-6/1", level: ม.4-6, text: "อ่านออกเสียงบทร้อยแก้ว และบทร้อยกรองได้อย่างถูกต้อง ไพเราะ และเหมาะสมกับเรื่องที่อ่าน" }
          - { id: "ท 1.1 ม.4-6/2", level: ม.4-6, text: "ตีความ แปลความ และขยายความเรื่องที่อ่าน" }
          - { id: "ท 1.1 ม.4-6/3", level: ม.4-6, text: "วิเคราะห์และวิจารณ์เรื่องที่อ่านในทุกๆ ด้านอย่างมีเหตุผล" }
          - { id: "ท 1.1 ม.4-6/4", level: ม.4-6, text: "คาดคะเนเหตุการณ์จากเรื่องที่อ่าน และประเมินค่า เพื่อนำความรู้ ความคิดไปใช้ตัดสินใจแก้ปัญหาในการดำเนินชีวิต" }
          - { id: "ท 1.1 ม.4-6/5", level: ม.4-6, text: "วิเคราะห์ วิจารณ์ แสดงความคิดเห็นโต้แย้งเกี่ยวกับเรื่องที่อ่าน และเสนอความคิดใหม่อย่างมีเหตุผล" }
          - { id: "ท 1.1 ม.4-6/6", level: ม.4-6, text: "ตอบคำถามจากการอ่านงานเขียนประเภทต่างๆ ภายในเวลาที่กำหนด" }
          - { id: "ท 1.1 ม.4-6/7", level: ม.4-6, text: "อ่านเรื่องต่างๆ แล้วเขียนกรอบแนวคิด ผังความคิด บันทึก ย่อความ และรายงาน" }
          - { id: "ท 1.1 ม.4-6/8", level: ม.4-6, text: "สังเคราะห์ความรู้จากการอ่านสื่อสิ่งพิมพ์ สื่ออิเล็กทรอนิกส์ และแหล่งเรียนรู้ต่างๆ มาพัฒนาตน พัฒนาการเรียน และพัฒนาความรู้ทางอาชีพ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “…ะห์ความรู้จากการอ่าน|สื่อสิ่งพิมพ์” ไม่เว้นวรรค" }
          - { id: "ท 1.1 ม.4-6/9", level: ม.4-6, text: "มีมารยาทในการอ่าน" }
  - id: ท2
