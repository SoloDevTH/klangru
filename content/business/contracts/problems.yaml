  solution: $3\%$ ต่อเดือนเท่ากับ $36\%$ ต่อปี เกิน $15\%$ ข้อตกลงเรื่องดอกเบี้ยจึงตกเป็นโมฆะทั้งหมด ผู้ให้กู้เรียกได้เพียงเงินต้น $40{,}000$ บาท ดอกเบี้ยที่เรียกตามสัญญา $= 40{,}000 \times 0.03 \times 6 = 7{,}200$ บาท จึงเรียกเกินไป $7{,}200$ บาท (ถ้าผิดนัดหลังครบกำหนด อาจถูกเรียกดอกเบี้ยผิดนัดตามกฎหมายได้) การเรียกดอกเบี้ยเกินอัตรายังเป็นความผิดอาญาด้วย
