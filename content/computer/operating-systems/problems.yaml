      - { id: b, text: "มาก่อนได้ก่อน เพราะยุติธรรมที่สุด", feedback: "ถ้างานวิดีโอมาก่อน แอปอื่นต้องรอหลายนาทีจนเสร็จ หน้าจอจะดูค้าง" }
      - { id: c, text: "งานสั้นที่สุดก่อน เพราะเวลารอเฉลี่ยน้อยที่สุด", feedback: "ต้องรู้ล่วงหน้าว่างานใช้เวลาเท่าใด ซึ่งงานที่ผู้ใช้โต้ตอบมักไม่รู้ และงานยาวอาจไม่ได้ทำเลย" }
