problems:
- id: thai.reading.critical-reading.p001
  topics:
  - thai.reading.critical-reading
  difficulty: 1
  type: match
  stem: จับคู่ระดับความเข้าใจกับความหมาย
  pairs:
  - left: แปลความ
    right: เรียบเรียงใหม่ด้วยคำของตน ความหมายคงเดิม
  - left: ตีความ
    right: หาความหมายที่แฝงอยู่หรือเจตนาของผู้เขียน
  - left: ขยายความ
    right: อธิบายเพิ่มด้วยตัวอย่างหรือเหตุผล
  hints:
  - แปล = เปลี่ยนรูปคำ
  - ขยาย = ทำให้ยาวขึ้นด้วยรายละเอียด
  solution: แปลความ = คำของตนความหมายเดิม · ตีความ = ความหมายแฝง · ขยายความ = เพิ่มตัวอย่างหรือเหตุผล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.critical-reading.p002
  topics:
  - thai.reading.critical-reading
  difficulty: 1
  type: mcq
  stem: '"เขาใจกว้างดั่งมหาสมุทร" ข้อใดเป็นการ **แปลความ**'
  choices:
  - id: a
    text: ผู้เขียนชื่นชมเขา
    feedback: เป็นการตีความเจตนา
  - id: b
    text: เขาใจกว้างมาก
    correct: true
    feedback: ถูก เรียบเรียงใหม่ ความหมายเดิม
  - id: c
    text: เขาให้อภัยคนที่ทำผิดและรับฟังความเห็นต่าง
    feedback: เป็นการขยายความ
  - id: d
    text: เขาชอบไปเที่ยวทะเล
    feedback: ตีความตามตัวอักษรผิด มหาสมุทรเป็นการเปรียบ
  hints:
  - แปลความ = บอกความหมายด้วยคำของตน
  - ดั่งมหาสมุทร เป็นการเปรียบเทียบ
  solution: '**เขาใจกว้างมาก** เป็นการแปลความ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.critical-reading.p003
  topics:
  - thai.reading.critical-reading
  difficulty: 2
  type: text
  stem: การนำข้อความไปเรียบเรียงใหม่ด้วยคำของตนเอง โดยความหมายยังคงเดิม เรียกว่าอะไร
  accepted:
  - แปลความ
  - การแปลความ
  misconceptions:
  - match: ตีความ
    feedback: ตีความคือหาความหมายแฝง
  - match: ขยายความ
    feedback: ขยายความคือเพิ่มรายละเอียด
  hints:
  - เปลี่ยนรูปภาษาแต่ไม่เปลี่ยนความหมาย
  - ถอดคำประพันธ์ก็เป็นงานชนิดนี้
  solution: เรียกว่า **แปลความ**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.critical-reading.p004
  topics:
  - thai.reading.critical-reading
  difficulty: 2
  type: mcq
  stem: อ่านบทความในภาพ ประโยค **(3)** มีปัญหาด้านความสมเหตุสมผลแบบใด
  figure:
    src: school-time-editorial.svg
    alt: บทความแสดงความคิดเห็นสมมติ ถึงเวลาเลื่อนเวลาเข้าเรียน 6 ประโยค (1) โรงเรียนทุกแห่งควรเลื่อนเวลาเข้าเรียนจากแปดโมงเป็นเก้าโมงเช้า (2) งานวิจัยหลายชิ้นพบว่าวัยรุ่นมักง่วงช้าและตื่นสายกว่าเด็กเล็กและผู้ใหญ่ (3) ห้องของฉันมีเพื่อนห้าคนหลับในคาบแรก แสดงว่านักเรียนทั้งประเทศนอนไม่พอ (4) คนที่ค้านเรื่องนี้คือคนที่ไม่เคยเข้าใจหัวอกเด็กเลย (5) ถ้าไม่เลื่อนเวลา เราก็ต้องยอมให้นักเรียนสอบตกกันทั้งประเทศ (6) เวลาเข้าเรียนใหม่จะทำให้ทุกคนมีความสุขและอนาคตสดใส
  choices:
  - id: a
    text: โจมตีตัวบุคคล
    feedback: ไม่ได้พูดถึงผู้ที่เห็นต่าง
  - id: b
    text: มีทางเลือกแค่สองทาง
    feedback: ไม่ได้บังคับเลือกสองทาง
  - id: c
    text: ไม่มีปัญหา
    feedback: ตัวอย่างน้อยเกินไปสำหรับข้อสรุปกว้าง
  - id: d
    text: สรุปเกินข้อมูล ใช้เพื่อน 5 คนสรุปถึงนักเรียนทั้งประเทศ
    correct: true
    feedback: ถูก
  hints:
  - ข้อมูลมาจากกี่คน
  - ข้อสรุปพูดถึงกี่คน
  solution: ประโยค (3) **สรุปเกินข้อมูล** จากคน 5 คนไปถึงทั้งประเทศ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.critical-reading.p005
  topics:
  - thai.reading.critical-reading
  difficulty: 2
  type: mcq
  stem: ข้อความโฆษณาชวนเชื่อ (สมมติ) "พวกหัวเก่าที่ค้านโครงการนี้ไม่อยากเห็นชุมชนเจริญ" ใช้กลวิธีใด
  choices:
  - id: a
    text: เสนอหลักฐานเชิงสถิติ
    feedback: ไม่มีตัวเลขหรือหลักฐาน
  - id: b
    text: ยอมรับข้อเสียของโครงการ
    feedback: ไม่ได้พูดถึงข้อเสีย
  - id: c
    text: ตั้งฉายาให้ฝ่ายตรงข้ามแทนการตอบเหตุผล
    correct: true
    feedback: ถูก เรียกผู้ค้านว่า พวกหัวเก่า
  - id: d
    text: อ้างงานวิจัย
    feedback: ไม่มีการอ้างงานวิจัย
  hints:
  - คำว่า พวกหัวเก่า ใช้เรียกใคร
  - ข้อความตอบเหตุผลของผู้ค้านหรือไม่
  solution: เป็นการ **ตั้งฉายา** ให้ฝ่ายตรงข้ามแทนการโต้เหตุผล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.critical-reading.p006
  topics:
  - thai.reading.critical-reading
  difficulty: 3
  type: mcq
  stem: อ่านบทความในภาพ ประโยค **(4)** เป็นเหตุผลวิบัติแบบใด
  figure:
    src: school-time-editorial.svg
    alt: บทความแสดงความคิดเห็นสมมติ ถึงเวลาเลื่อนเวลาเข้าเรียน 6 ประโยค (1) โรงเรียนทุกแห่งควรเลื่อนเวลาเข้าเรียนจากแปดโมงเป็นเก้าโมงเช้า (2) งานวิจัยหลายชิ้นพบว่าวัยรุ่นมักง่วงช้าและตื่นสายกว่าเด็กเล็กและผู้ใหญ่ (3) ห้องของฉันมีเพื่อนห้าคนหลับในคาบแรก แสดงว่านักเรียนทั้งประเทศนอนไม่พอ (4) คนที่ค้านเรื่องนี้คือคนที่ไม่เคยเข้าใจหัวอกเด็กเลย (5) ถ้าไม่เลื่อนเวลา เราก็ต้องยอมให้นักเรียนสอบตกกันทั้งประเทศ (6) เวลาเข้าเรียนใหม่จะทำให้ทุกคนมีความสุขและอนาคตสดใส
  choices:
  - id: a
    text: สรุปเกินข้อมูล
    feedback: เป็นปัญหาของประโยค (3)
  - id: b
    text: โจมตีตัวบุคคล ไม่ตอบเหตุผลของผู้ที่ค้าน
    correct: true
    feedback: ถูก
  - id: c
    text: ลากเหตุผลเกินจริง
    feedback: ไม่ได้เล่าผลต่อกันเป็นทอด ๆ
  - id: d
    text: อ้างคนดัง
    feedback: ไม่ได้อ้างบุคคลมีชื่อเสียง
  hints:
  - ประโยคพูดถึงเหตุผลหรือตัวคน
  - ผู้ค้านอาจมีเหตุผลอะไรบ้าง
  solution: ประโยค (4) **โจมตีตัวบุคคล** แทนการตอบเหตุผล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.critical-reading.p007
  topics:
  - thai.reading.critical-reading
  difficulty: 3
  type: mcq
  stem: อ่านบทความในภาพ ประโยค **(5)** มีจุดอ่อนอย่างไร
  figure:
    src: school-time-editorial.svg
    alt: บทความแสดงความคิดเห็นสมมติ ถึงเวลาเลื่อนเวลาเข้าเรียน 6 ประโยค (1) โรงเรียนทุกแห่งควรเลื่อนเวลาเข้าเรียนจากแปดโมงเป็นเก้าโมงเช้า (2) งานวิจัยหลายชิ้นพบว่าวัยรุ่นมักง่วงช้าและตื่นสายกว่าเด็กเล็กและผู้ใหญ่ (3) ห้องของฉันมีเพื่อนห้าคนหลับในคาบแรก แสดงว่านักเรียนทั้งประเทศนอนไม่พอ (4) คนที่ค้านเรื่องนี้คือคนที่ไม่เคยเข้าใจหัวอกเด็กเลย (5) ถ้าไม่เลื่อนเวลา เราก็ต้องยอมให้นักเรียนสอบตกกันทั้งประเทศ (6) เวลาเข้าเรียนใหม่จะทำให้ทุกคนมีความสุขและอนาคตสดใส
  choices:
  - id: a
    text: ทำให้ดูเหมือนมีทางเลือกแค่สองทาง ทั้งที่ยังมีวิธีอื่นช่วยให้นักเรียนนอนพอ
    correct: true
    feedback: ถูก เช่น ลดการบ้านดึก ให้ความรู้เรื่องการนอน
  - id: b
    text: ใช้ตัวเลขผิด
    feedback: ไม่มีตัวเลข
  - id: c
    text: สะกดคำผิด
    feedback: ไม่ใช่ปัญหาของประโยคนี้
  - id: d
    text: เป็นข้อเท็จจริงที่ตรวจได้
    feedback: เป็นการคาดการณ์ที่เกินจริง
  hints:
  - ไม่เลื่อนเวลา = สอบตกทั้งประเทศ จริงหรือ
  - มีทางเลือกอื่นไหม
  solution: เป็น **ทางเลือกแค่สองทาง** และเกินจริง ทั้งที่ยังมีทางแก้อื่น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.critical-reading.p008
  topics:
  - thai.reading.critical-reading
  difficulty: 3
  type: mcq
  stem: ดูกราฟในภาพ ข้อใดวิเคราะห์ได้ถูกต้อง
  figure:
    src: truncated-graph.svg
    alt: กราฟแท่งสมมติจากเพจของโรงเรียน ข คะแนนเฉลี่ยวิชาภาษาไทย แกนตั้งเริ่มที่ 90 และสิ้นสุดที่ 96 แท่งโรงเรียน ก สูงถึง 92 แท่งโรงเรียน ข สูงถึง 95 ทำให้แท่งของโรงเรียน ข ดูสูงกว่าแท่งของโรงเรียน ก มาก
  choices:
  - id: a
    text: โรงเรียน ข ได้คะแนนมากกว่าโรงเรียน ก ประมาณ 2.5 เท่า
    feedback: ดูจากความสูงแท่งที่แกนไม่เริ่มที่ศูนย์
  - id: b
    text: โรงเรียน ก สอบตก
    feedback: 92 คะแนนไม่ใช่สอบตก
  - id: c
    text: กราฟนี้ไม่มีปัญหา เพราะตัวเลขถูก
    feedback: ตัวเลขถูก แต่การวาดแกนทำให้เข้าใจผิด
  - id: d
    text: แกนตั้งเริ่มที่ 90 ทำให้ความต่างดูมาก ทั้งที่คะแนนต่างกันเพียง 3 คะแนน
    correct: true
    feedback: ถูก เป็นกราฟแกนตัด
  hints:
  - ดูตัวเลขที่จุดเริ่มของแกนตั้ง
  - คะแนนจริงต่างกันเท่าไร
  solution: '**แกนตั้งเริ่มที่ 90** ความต่างจริงคือ 95 − 92 = 3 คะแนน'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.critical-reading.p009
  topics:
  - thai.reading.critical-reading
  difficulty: 3
  type: numeric
  stem: ดูกราฟในภาพ ถ้าวัดความสูงของแท่งจากเส้นแกนล่าง (ที่ 90) แท่งของโรงเรียน ข สูงเป็นกี่เท่าของแท่งโรงเรียน ก
  figure:
    src: truncated-graph.svg
    alt: กราฟแท่งสมมติจากเพจของโรงเรียน ข คะแนนเฉลี่ยวิชาภาษาไทย แกนตั้งเริ่มที่ 90 และสิ้นสุดที่ 96 แท่งโรงเรียน ก สูงถึง 92 แท่งโรงเรียน ข สูงถึง 95 ทำให้แท่งของโรงเรียน ข ดูสูงกว่าแท่งของโรงเรียน ก มาก
  answer:
    value: 2.5
    unit: เท่า
    tolerance: 0.02
  misconceptions:
  - match: 1.03
    feedback: เป็นอัตราส่วนของคะแนนจริง 95 ÷ 92 ไม่ใช่ความสูงของแท่งที่วาด
  - match: 3
    feedback: เป็นความต่างของคะแนน ไม่ใช่อัตราส่วน
  hints:
  - ความสูงแท่ง ก = 92 − 90
  - ความสูงแท่ง ข = 95 − 90 แล้วหารกัน
  solution: แท่ง ข สูง $95-90=5$ แท่ง ก สูง $92-90=2$ · $5 \div 2 = 2.5$ เท่า ทั้งที่คะแนนจริงต่างกันเพียงราวร้อยละ 3
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.critical-reading.p010
  topics:
  - thai.reading.critical-reading
  difficulty: 4
  type: mcq
  stem: เรื่องสั้นแนวสมจริง (สมมติ) เล่าว่า "ต้นเดือนมิถุนายน ต้นกล้าปลูกเมล็ดมะม่วงในกระถาง ปลายเดือนเดียวกันเขาเก็บมะม่วงสุกไปขายที่ตลาด" ข้อใดวิจารณ์ได้ถูกต้อง
  choices:
  - id: a
    text: ลำดับเหตุการณ์ถูกต้องแล้ว เพราะปลูกก่อนแล้วเก็บทีหลัง
    feedback: ลำดับก่อนหลังถูก แต่ช่วงเวลาเป็นไปไม่ได้
  - id: b
    text: ไม่สมเหตุสมผลด้านความเป็นไปได้ เพราะมะม่วงที่ปลูกจากเมล็ดต้องใช้เวลาหลายปีกว่าจะออกผล
    correct: true
    feedback: ถูก ขัดกับความรู้จริงในเรื่องแนวสมจริง
  - id: c
    text: ผิดเพราะมะม่วงปลูกในกระถางไม่ได้
    feedback: ประเด็นสำคัญคือเวลาที่ใช้
  - id: d
    text: เรื่องสั้นไม่ต้องสมจริงเลย
    feedback: เรื่องแนวสมจริงควรเป็นไปได้ตามโลกจริง
  hints:
  - ตรวจทั้งลำดับและความเป็นไปได้
  - ต้นมะม่วงใช้เวลานานเท่าไรจึงออกผล
  solution: ลำดับถูกแต่ **ความเป็นไปได้** ไม่สมเหตุสมผล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.critical-reading.p011
  topics:
  - thai.reading.critical-reading
  difficulty: 4
  type: mcq
  stem: บทความเขียนในปี 2569 ว่า "ปัจจุบันครัวเรือนไทยมีอินเทอร์เน็ตใช้เพียงส่วนน้อย" โดยอ้างตัวเลขสำรวจปี 2555 ข้อใด **ประเมินความถูกต้องของข้อมูลสนับสนุน** ได้ดีที่สุด
  choices:
  - id: a
    text: ข้อมูลเก่ากว่าสิบปีจึงใช้บอกสภาพปัจจุบันไม่ได้ ควรหาผลสำรวจล่าสุดจากหน่วยงานที่สำรวจเรื่องนี้
    correct: true
    feedback: ถูก ประเมินความทันสมัยและเสนอวิธีตรวจ
