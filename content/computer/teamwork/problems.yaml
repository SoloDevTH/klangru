    ai_assisted: true

  - id: computer.programming.teamwork.p014
    topics: [computer.programming.teamwork]
    difficulty: 5
    type: numeric
    stem: "ทีมวางงานในรอบ 10 วัน รวม 30 แต้มงาน ผ่านไป 4 วันทำเสร็จ 10 แต้ม ถ้าทำต่อด้วยอัตราเฉลี่ยเท่าเดิม เมื่อครบ 10 วันจะเหลืองานที่ยังไม่เสร็จกี่แต้ม"
    answer: { value: 5, unit: "แต้ม" }
    hints:
      - "อัตราเฉลี่ย = แต้มที่เสร็จ ÷ จำนวนวันที่ผ่านไป"
      - "คูณอัตราด้วย 10 วัน แล้วเทียบกับ 30 แต้ม"
    misconceptions:
      - { match: 20, feedback: "20 คืองานที่เหลือตอนนี้ แต่ยังมีเวลาอีก 6 วัน" }
      - { match: 25, feedback: "25 คืองานที่คาดว่าจะเสร็จทั้งหมด โจทย์ถามงานที่ยังไม่เสร็จ" }
    solution: "อัตรา 10 ÷ 4 = 2.5 แต้มต่อวัน 10 วันได้ 25 แต้ม จึงเหลือ 30 − 25 = 5 แต้ม ทีมควรรู้ตั้งแต่วันนี้ แล้วตัดงานสำคัญน้อยออกหรือหาวิธีช่วยกัน ไม่ใช่รอจนวันสุดท้าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.teamwork.p015
    topics: [computer.programming.teamwork]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นแนวปฏิบัติที่ดีสำหรับคลังโค้ดของทีม (เลือกทุกข้อที่ถูก)"
    choices:
