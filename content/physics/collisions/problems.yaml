problems:
  - id: phy.coll.p001
    topics: [physics.momentum.collisions]
    difficulty: 1
    type: numeric
    stem: "ในห้องปฏิบัติการ รถทดลองมวล $2\\ \\mathrm{kg}$ วิ่งด้วยความเร็ว $3\\ \\mathrm{m/s}$ ไปชนรถทดลองมวล $1\\ \\mathrm{kg}$ ที่จอดนิ่ง แล้วติดกันไป ไม่คิดแรงเสียดทาน รถทั้งสองคันเคลื่อนที่ด้วยความเร็วเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s)"
    answer: { value: 2, unit: m/s }
    hints:
      - "โมเมนตัมรวมก่อนชนเท่ากับโมเมนตัมรวมหลังชน"
      - "หลังชนรถติดกัน จึงมีความเร็วเดียวกัน และมวลรวมเป็น $m_1 + m_2$"
      - "หาโมเมนตัมก่อนชน แล้วหารด้วยมวลรวม"
    misconceptions:
      - { match: 6, feedback: "ดูเหมือนหารโมเมนตัมด้วยมวลของรถคันที่ถูกชนคันเดียว หลังชนรถติดกัน ต้องหารด้วยมวลรวม $2 + 1 = 3\\ \\mathrm{kg}$" }
      - { match: 1.5, feedback: "ดูเหมือนหาค่าเฉลี่ยของความเร็ว $\\tfrac{3 + 0}{2}$ ซึ่งใช้ได้เฉพาะเมื่อมวลเท่ากัน ต้องใช้การอนุรักษ์โมเมนตัมที่คิดมวลด้วย" }
    solution: "ก่อนชน: $p = (2\\ \\mathrm{kg})(3\\ \\mathrm{m/s}) + (1\\ \\mathrm{kg})(0) = 6\\ \\mathrm{kg\\,m/s}$ หลังชน: $(2 + 1)\\ \\mathrm{kg} \\times v = 6\\ \\mathrm{kg\\,m/s}$ จึงได้ $v = 2\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.coll.p002
    topics: [physics.momentum.collisions]
    difficulty: 1
    type: mcq
    stem: "วัตถุสองก้อนชนกันโดยไม่มีแรงลัพธ์ภายนอกมากระทำ ปริมาณใดคงตัว **เสมอ** ไม่ว่าจะชนแบบใด"
    choices:
      - { id: a, text: "โมเมนตัมรวมของวัตถุทั้งสอง", correct: true }
      - { id: b, text: "พลังงานจลน์รวมของวัตถุทั้งสอง", feedback: "พลังงานจลน์รวมคงตัวเฉพาะการชนแบบยืดหยุ่นสมบูรณ์ การชนแบบอื่นเสียพลังงานจลน์ไปเป็นความร้อนและเสียง" }
      - { id: c, text: "โมเมนตัมของวัตถุแต่ละก้อน", feedback: "วัตถุแต่ละก้อนได้รับการดลจากอีกก้อน โมเมนตัมของแต่ละก้อนจึงเปลี่ยน มีเพียงผลรวมที่คงตัว" }
      - { id: d, text: "อัตราเร็วของวัตถุแต่ละก้อน", feedback: "การชนทำให้ความเร็วของแต่ละก้อนเปลี่ยน เช่น ลูกที่วิ่งมาชนอาจหยุดหรือกระดอนกลับ" }
    hints:
      - "นึกถึงกฎข้อที่ 3 ของนิวตัน: แรงที่สองก้อนกระทำต่อกันเท่ากันแต่ทิศตรงข้าม"
      - "การดลที่ก้อนหนึ่งได้รับหักล้างกับอีกก้อนพอดี ปริมาณใดของ **ระบบ** จึงไม่เปลี่ยน"
    solution: "แรงที่วัตถุทั้งสองกระทำต่อกันเท่ากันแต่ทิศตรงข้ามในเวลาเท่ากัน โมเมนตัมที่ก้อนหนึ่งเสียไปจึงเท่ากับที่อีกก้อนได้รับ โมเมนตัมรวมของระบบจึงคงตัวในการชนทุกแบบ ส่วนพลังงานจลน์รวมคงตัวเฉพาะการชนแบบยืดหยุ่นสมบูรณ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.coll.p003
    topics: [physics.momentum.collisions]
    difficulty: 2
    type: numeric
    stem: "เด็กสองคนยืนนิ่งบนลานสเก็ตน้ำแข็งในห้างแห่งหนึ่งในกรุงเทพฯ แล้วผลักกัน เด็กคนแรกมวล $30\\ \\mathrm{kg}$ ไถลออกไปด้วยอัตราเร็ว $2\\ \\mathrm{m/s}$ เด็กคนที่สองมวล $40\\ \\mathrm{kg}$ ไถลไปทางตรงข้ามด้วยอัตราเร็วเท่าใด ไม่คิดแรงเสียดทาน (ตอบเป็นตัวเลขบวกในหน่วย m/s)"
    answer: { value: 1.5, tolerance: 0.01, unit: m/s }
    hints:
      - "ก่อนผลักทั้งสองนิ่ง โมเมนตัมรวมจึงเป็นศูนย์"
      - "หลังผลัก ขนาดโมเมนตัมของสองคนต้องเท่ากันแต่ทิศตรงข้าม: $m_1v_1 = m_2v_2$"
    misconceptions:
      - { match: 2.67, feedback: "ดูเหมือนสลับมวล ($\\tfrac{40 \\times 2}{30}$) คนที่มวลมากกว่าต้องไถลช้ากว่า ไม่ใช่เร็วกว่า" }
      - { match: 2, feedback: "แรงที่ผลักกันเท่ากันจริง แต่ความเร็วไม่จำเป็นต้องเท่ากัน สิ่งที่เท่ากันคือขนาดของโมเมนตัม $mv$" }
    solution: "โมเมนตัมรวมก่อนผลักเป็นศูนย์ หลังผลักจึงได้ $(30\\ \\mathrm{kg})(2\\ \\mathrm{m/s}) = (40\\ \\mathrm{kg})v$ → $v = \\dfrac{60}{40} = 1.5\\ \\mathrm{m/s}$ ในทิศตรงข้ามกับเด็กคนแรก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.coll.p004
    topics: [physics.momentum.collisions]
    difficulty: 2
    type: match
    stem: "จับคู่การชนหรือการแยกตัวแต่ละแบบกับลักษณะที่ถูกต้อง"
    pairs:
      - { left: "การชนแบบยืดหยุ่นสมบูรณ์", right: "โมเมนตัมรวมและพลังงานจลน์รวมคงตัวทั้งคู่" }
      - { left: "การชนแบบไม่ยืดหยุ่น", right: "โมเมนตัมรวมคงตัว พลังงานจลน์รวมลดลงบางส่วน วัตถุแยกจากกัน" }
      - { left: "การชนแบบไม่ยืดหยุ่นสมบูรณ์", right: "วัตถุติดกันไปด้วยความเร็วเดียว พลังงานจลน์ลดลงมากที่สุด" }
      - { left: "การระเบิดจากหยุดนิ่ง", right: "โมเมนตัมรวมเป็นศูนย์ตลอด พลังงานจลน์รวมเพิ่มขึ้นจากพลังงานภายใน" }
    hints:
      - "ทุกแบบมีโมเมนตัมรวมคงตัว ให้ดูที่พลังงานจลน์เป็นหลัก"
      - "การระเบิดคือการชนที่ย้อนกลับ วัตถุเริ่มจากติดกันแล้วแยกออก"
    solution: "ยืดหยุ่นสมบูรณ์: พลังงานจลน์คงตัว · ไม่ยืดหยุ่น: เสียพลังงานจลน์บางส่วนแต่ยังแยกกัน · ไม่ยืดหยุ่นสมบูรณ์: ติดกันไปและเสียพลังงานจลน์มากที่สุด · การระเบิดจากหยุดนิ่ง: โมเมนตัมรวมเป็นศูนย์ ส่วนพลังงานจลน์เพิ่มขึ้นจากพลังงานเคมีหรือพลังงานสะสมอื่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.coll.p005
    topics: [physics.momentum.collisions]
    difficulty: 3
    type: numeric
    stem: "บนถนนสายหนึ่งในต่างจังหวัด รถกระบะมวล $1500\\ \\mathrm{kg}$ วิ่งไปทางทิศตะวันออกด้วยความเร็ว $20\\ \\mathrm{m/s}$ ชนประสานงากับรถเก๋งมวล $1000\\ \\mathrm{kg}$ ที่วิ่งไปทางทิศตะวันตกด้วยความเร็ว $15\\ \\mathrm{m/s}$ แล้วติดกันไป ถ้าให้ทิศตะวันออกเป็นบวก ความเร็วของรถทั้งสองหลังชนเป็นเท่าใด (ตอบเป็นตัวเลขพร้อมเครื่องหมายในหน่วย m/s)"
    answer: { value: 6, unit: m/s }
    hints:
      - "ให้ทิศตะวันออกเป็นบวก ความเร็วของรถเก๋งจึงเป็น $-15\\ \\mathrm{m/s}$"
      - "หาโมเมนตัมรวมก่อนชนโดยคิดเครื่องหมาย แล้วหารด้วยมวลรวม $2500\\ \\mathrm{kg}$"
    misconceptions:
      - { match: 18, feedback: "ดูเหมือนลืมเครื่องหมายลบของรถเก๋งที่วิ่งสวนมา โมเมนตัมของรถที่วิ่งสวนทางต้องหักลบกัน ไม่ใช่บวกกัน" }
      - { match: -6, feedback: "ขนาดถูกแล้วแต่เครื่องหมายกลับ รถกระบะมีโมเมนตัมทิศตะวันออกมากกว่า รถที่ติดกันจึงไปทางตะวันออก (บวก)" }
    solution: "$p_{\\text{ก่อน}} = (1500)(20) + (1000)(-15) = 30000 - 15000 = 15000\\ \\mathrm{kg\\,m/s}$ หลังชน: $v = \\dfrac{15000\\ \\mathrm{kg\\,m/s}}{2500\\ \\mathrm{kg}} = +6\\ \\mathrm{m/s}$ คือรถทั้งสองไถลไปทางทิศตะวันออก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.coll.p006
    topics: [physics.momentum.collisions]
    difficulty: 3
    type: numeric
    stem: "ก้อนดินน้ำมันมวล $4\\ \\mathrm{kg}$ เคลื่อนที่ด้วยความเร็ว $5\\ \\mathrm{m/s}$ บนพื้นลื่น ชนก้อนดินน้ำมันมวล $1\\ \\mathrm{kg}$ ที่อยู่นิ่งแล้วติดกันไป พลังงานจลน์ของระบบหายไปกี่จูลในการชนนี้ (ตอบเป็นตัวเลขในหน่วย J)"
    answer: { value: 10, unit: J }
    hints:
      - "หาความเร็วหลังชนจากการอนุรักษ์โมเมนตัมก่อน"
      - "คำนวณ $E_k = \\tfrac{1}{2}mv^2$ ก่อนชนและหลังชน โดยหลังชนใช้มวลรวม"
      - "พลังงานที่หายไป = พลังงานจลน์ก่อนชน − พลังงานจลน์หลังชน"
    misconceptions:
      - { match: 0, feedback: "พลังงานจลน์คงตัวเฉพาะการชนแบบยืดหยุ่นสมบูรณ์ การชนที่ติดกันไปเสียพลังงานจลน์เสมอ ลองคำนวณพลังงานจลน์หลังชนดู" }
      - { match: 40, feedback: "นั่นคือพลังงานจลน์ **หลังชน** โจทย์ถามพลังงานที่หายไป ต้องนำไปลบออกจากพลังงานจลน์ก่อนชน" }
    solution: "ความเร็วหลังชน: $v = \\dfrac{(4)(5)}{4 + 1} = 4\\ \\mathrm{m/s}$ พลังงานจลน์ก่อนชน: $\\tfrac{1}{2}(4\\ \\mathrm{kg})(5\\ \\mathrm{m/s})^2 = 50\\ \\mathrm{J}$ หลังชน: $\\tfrac{1}{2}(5\\ \\mathrm{kg})(4\\ \\mathrm{m/s})^2 = 40\\ \\mathrm{J}$ หายไป $50 - 40 = 10\\ \\mathrm{J}$ (กลายเป็นความร้อน เสียง และการเปลี่ยนรูปของดินน้ำมัน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.coll.p007
    topics: [physics.momentum.collisions]
    difficulty: 3
    type: mcq
    stem: "ลูกบิลเลียดลูก A เคลื่อนที่ด้วยความเร็ว $u$ ชนตรง ๆ กับลูก B ที่มีมวลเท่ากันและวางนิ่งอยู่ ถ้าการชนเป็นแบบยืดหยุ่นสมบูรณ์ หลังชนเกิดอะไรขึ้น"
    choices:
      - { id: a, text: "A หยุดนิ่ง ส่วน B เคลื่อนที่ด้วยความเร็ว $u$", correct: true }
      - { id: b, text: "ทั้ง A และ B เคลื่อนที่ไปด้วยกันด้วยความเร็ว $\\tfrac{u}{2}$", feedback: "ผลนี้ทำให้โมเมนตัมคงตัวก็จริง แต่พลังงานจลน์เหลือเพียงครึ่งเดียว จึงเป็นการชนแบบติดกัน (ไม่ยืดหยุ่นสมบูรณ์) ไม่ใช่แบบยืดหยุ่นสมบูรณ์" }
      - { id: c, text: "A กระดอนกลับด้วยความเร็ว $u$ ส่วน B ยังนิ่งอยู่", feedback: "แบบนี้เกิดเมื่อชนผนังที่หนักมาก ถ้า B มีมวลเท่ากับ A โมเมนตัมรวมจะเปลี่ยนจาก $mu$ เป็น $-mu$ ซึ่งผิดกฎการอนุรักษ์โมเมนตัม" }
      - { id: d, text: "ทั้ง A และ B เคลื่อนที่ไปข้างหน้าด้วยความเร็ว $u$", feedback: "โมเมนตัมรวมหลังชนจะเป็น $2mu$ มากกว่าก่อนชนเป็นสองเท่า ซึ่งเป็นไปไม่ได้" }
    hints:
      - "ผลที่ถูกต้องต้องทำให้ทั้งโมเมนตัมรวมและพลังงานจลน์รวมคงตัว"
      - "ตรวจแต่ละตัวเลือก: คำนวณ $mv$ รวม และ $\\tfrac{1}{2}mv^2$ รวม แล้วเทียบกับก่อนชน"
    solution: "ก่อนชน: โมเมนตัมรวม $mu$ พลังงานจลน์ $\\tfrac{1}{2}mu^2$ ถ้า A หยุดและ B เคลื่อนที่ด้วย $u$ ได้โมเมนตัม $mu$ และพลังงานจลน์ $\\tfrac{1}{2}mu^2$ เท่าเดิมทั้งคู่ (ตรงกับสูตร $v_1 = \\tfrac{m_1 - m_2}{m_1 + m_2}u = 0$ และ $v_2 = \\tfrac{2m_1}{m_1 + m_2}u = u$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.coll.p008
    topics: [physics.momentum.collisions]
    difficulty: 4
    type: numeric
    stem: "ลูกเหล็กมวล $0.2\\ \\mathrm{kg}$ เคลื่อนที่ด้วยความเร็ว $6\\ \\mathrm{m/s}$ ชนตรง ๆ กับลูกเหล็กมวล $0.4\\ \\mathrm{kg}$ ที่อยู่นิ่ง การชนเป็นแบบยืดหยุ่นสมบูรณ์ ลูกเหล็กมวล $0.4\\ \\mathrm{kg}$ เคลื่อนที่ออกไปด้วยความเร็วเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s)"
    answer: { value: 4, unit: m/s }
    hints:
      - "การชนแบบยืดหยุ่นสมบูรณ์ เมื่อลูกที่ถูกชนอยู่นิ่ง ใช้ $v_2 = \\dfrac{2m_1}{m_1 + m_2}u_1$"
      - "ระวังว่า $m_1$ คือมวลของลูกที่วิ่งมาชน"
      - "ตรวจคำตอบ: หา $v_1$ ด้วย แล้วดูว่าโมเมนตัมรวมและพลังงานจลน์รวมเท่าเดิมหรือไม่"
    misconceptions:
      - { match: 2, feedback: "นั่นคือความเร็วเมื่อสองลูกติดกันไป ($\\tfrac{0.2 \\times 6}{0.6}$) ซึ่งเป็นการชนแบบไม่ยืดหยุ่นสมบูรณ์ ข้อนี้เป็นแบบยืดหยุ่นสมบูรณ์" }
      - { match: 3, feedback: "ดูเหมือนคิดว่าลูกแรกหยุดนิ่งแล้วส่งโมเมนตัมทั้งหมดให้ลูกที่สอง ($\\tfrac{1.2}{0.4}$) แบบนี้เกิดเฉพาะเมื่อมวลเท่ากัน ถ้าลองตรวจ พลังงานจลน์จะไม่เท่าเดิม" }
    solution: "$v_2 = \\dfrac{2(0.2)}{0.2 + 0.4}(6\\ \\mathrm{m/s}) = 4\\ \\mathrm{m/s}$ และ $v_1 = \\dfrac{0.2 - 0.4}{0.6}(6) = -2\\ \\mathrm{m/s}$ (ลูกแรกกระดอนกลับ) ตรวจโมเมนตัม: $(0.2)(-2) + (0.4)(4) = 1.2 = (0.2)(6)$ ✓ พลังงานจลน์: $\\tfrac{1}{2}(0.2)(4) + \\tfrac{1}{2}(0.4)(16) = 0.4 + 3.2 = 3.6\\ \\mathrm{J} = \\tfrac{1}{2}(0.2)(36)$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.coll.p009
    topics: [physics.momentum.collisions]
    difficulty: 4
    type: numeric
    stem: "ในงานลอยกระทง พลุลูกหนึ่งมวล $0.3\\ \\mathrm{kg}$ ขึ้นไปถึงจุดสูงสุด ขณะนั้นเคลื่อนที่ในแนวระดับด้วยความเร็ว $10\\ \\mathrm{m/s}$ ไปทางทิศตะวันออก แล้วระเบิดแยกเป็นสองชิ้น ชิ้นมวล $0.2\\ \\mathrm{kg}$ พุ่งไปทางทิศตะวันออกด้วยความเร็ว $20\\ \\mathrm{m/s}$ ในแนวระดับ ถ้าให้ทิศตะวันออกเป็นบวก ชิ้นมวล $0.1\\ \\mathrm{kg}$ มีความเร็วในแนวระดับเท่าใดทันทีหลังระเบิด (ตอบเป็นตัวเลขพร้อมเครื่องหมายในหน่วย m/s)"
    answer: { value: -10, unit: m/s }
    hints:
      - "ช่วงระเบิดสั้นมาก โมเมนตัมรวมในแนวระดับจึงคงตัว แต่ก่อนระเบิดพลุ **ไม่ได้นิ่ง**"
      - "โมเมนตัมก่อนระเบิด $= (0.3)(10)$ ตั้งให้เท่ากับ $(0.2)(20) + (0.1)v$"
    misconceptions:
      - { match: -40, feedback: "ดูเหมือนคิดว่าโมเมนตัมรวมก่อนระเบิดเป็นศูนย์ แต่พลุกำลังเคลื่อนที่ด้วยความเร็ว $10\\ \\mathrm{m/s}$ อยู่แล้ว ต้องใส่โมเมนตัมเดิม $(0.3)(10)$ ด้วย" }
      - { match: 10, feedback: "ขนาดถูกแล้ว แต่ลองตรวจเครื่องหมาย: ถ้าชิ้นนี้ไปทางตะวันออกด้วย โมเมนตัมรวมหลังระเบิดจะเป็น $4 + 1 = 5$ ซึ่งมากกว่าก่อนระเบิด" }
    solution: "$(0.3)(10) = (0.2)(20) + (0.1)v$ → $3 = 4 + 0.1v$ → $v = -10\\ \\mathrm{m/s}$ คือชิ้นมวล $0.1\\ \\mathrm{kg}$ พุ่งไปทางทิศตะวันตกด้วยอัตราเร็ว $10\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.coll.p010
    topics: [physics.momentum.collisions]
    difficulty: 4
    type: expression
    stem: "วัตถุมวล $m_1$ เคลื่อนที่ด้วยความเร็ว $u$ ชนวัตถุมวล $m_2$ ที่อยู่นิ่ง แล้วติดกันไป เขียนความเร็วหลังชนในรูปของ $m_1$, $m_2$ และ $u$"
    prefix: "v ="
    answer: { latex: "\\frac{m_1 u}{m_1 + m_2}", variables: [m_1, m_2, u] }
    hints:
      - "โมเมนตัมก่อนชนมีเฉพาะของวัตถุที่เคลื่อนที่ คือ $m_1u$"
      - "หลังชนวัตถุติดกัน มวลรวม $m_1 + m_2$ เคลื่อนที่ด้วยความเร็ว $v$ เดียวกัน ตั้งสมการแล้วจัดรูปหา $v$"
    misconceptions:
      - { match: "\\frac{m_1 u}{m_2}", feedback: "หลังชนวัตถุติดกัน ต้องหารด้วยมวลรวม $m_1 + m_2$ ไม่ใช่มวลของวัตถุที่ถูกชนอย่างเดียว" }
      - { match: "\\frac{u}{2}", feedback: "ค่า $\\tfrac{u}{2}$ ถูกเฉพาะเมื่อ $m_1 = m_2$ เท่านั้น คำตอบทั่วไปต้องมีมวลอยู่ด้วย" }
    solution: "$m_1u + m_2(0) = (m_1 + m_2)v$ จึงได้ $v = \\dfrac{m_1u}{m_1 + m_2}$ ซึ่งน้อยกว่า $u$ เสมอ และเท่ากับ $\\tfrac{u}{2}$ เมื่อมวลเท่ากัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.coll.p011
    topics: [physics.momentum.collisions]
    difficulty: 5
    type: numeric
    stem: "ปาก้อนดินน้ำมันมวล $0.05\\ \\mathrm{kg}$ ในแนวระดับเข้าชนแท่งไม้มวล $0.95\\ \\mathrm{kg}$ ที่แขวนนิ่งด้วยเชือก ดินน้ำมันติดแน่นกับแท่งไม้ แล้วทั้งคู่แกว่งขึ้นไปสูงจากตำแหน่งเดิม $0.2\\ \\mathrm{m}$ ก้อนดินน้ำมันมีอัตราเร็วเท่าใดก่อนชน ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ ไม่คิดแรงต้านอากาศ (ตอบเป็นตัวเลขในหน่วย m/s ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 39.6, tolerance: 0.3, unit: m/s }
    hints:
      - "แยกเป็นสองช่วง: ช่วงชน (ใช้การอนุรักษ์โมเมนตัม) และช่วงแกว่งขึ้น (ใช้การอนุรักษ์พลังงานกล)"
      - "ช่วงแกว่งขึ้น: $\\tfrac{1}{2}Mv^2 = Mgh$ ได้ความเร็วทันทีหลังชน $v = \\sqrt{2gh}$"
      - "ช่วงชน: $m u = (m + M)v$ แล้วจัดรูปหา $u$"
    misconceptions:
      - { match: 8.85, feedback: "ดูเหมือนใช้การอนุรักษ์พลังงานตั้งแต่ก่อนชนจนถึงจุดสูงสุด แต่การชนแบบติดกันเสียพลังงานจลน์ไปมาก ช่วงชนต้องใช้การอนุรักษ์โมเมนตัม" }
      - { match: 1.98, feedback: "นั่นคือความเร็วของแท่งไม้กับดินน้ำมันทันทีหลังชน โจทย์ถามความเร็วของดินน้ำมัน **ก่อน** ชน ยังต้องใช้การอนุรักษ์โมเมนตัมอีกขั้น" }
    solution: "หลังชน: $v = \\sqrt{2gh} = \\sqrt{2(9.8\\ \\mathrm{m/s^2})(0.2\\ \\mathrm{m})} = \\sqrt{3.92} \\approx 1.980\\ \\mathrm{m/s}$ ช่วงชน: $(0.05)u = (0.05 + 0.95)(1.980)$ → $u = \\dfrac{1.980}{0.05} \\approx 39.6\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.coll.p012
    topics: [physics.momentum.collisions]
    difficulty: 5
    type: mcq
    stem: "ลูกบอล A มวล $2\\ \\mathrm{kg}$ เคลื่อนที่ด้วยความเร็ว $4\\ \\mathrm{m/s}$ ชนลูกบอล B มวล $1\\ \\mathrm{kg}$ ที่อยู่นิ่ง นักเรียนคนหนึ่งรายงานว่าหลังชน A เคลื่อนที่ไปทางเดิมด้วยความเร็ว $1\\ \\mathrm{m/s}$ และ B เคลื่อนที่ไปทางเดิมด้วยความเร็ว $6\\ \\mathrm{m/s}$ ข้อใดสรุปได้ถูกต้อง (ลูกบอลไม่มีพลังงานสะสมภายในที่จะปล่อยออกมา)"
    choices:
      - { id: a, text: "ผลนี้เป็นไปไม่ได้ เพราะพลังงานจลน์รวมหลังชนมากกว่าก่อนชน", correct: true }
      - { id: b, text: "เป็นการชนแบบยืดหยุ่นสมบูรณ์ เพราะโมเมนตัมรวมก่อนและหลังชนเท่ากัน", feedback: "โมเมนตัมรวมเท่ากันจริง ($8\\ \\mathrm{kg\\,m/s}$) แต่นั่นเป็นจริงในการชนทุกแบบ การจะบอกว่ายืดหยุ่นสมบูรณ์ต้องตรวจพลังงานจลน์ด้วย" }
      - { id: c, text: "เป็นการชนแบบไม่ยืดหยุ่น เพราะลูกบอลทั้งสองเคลื่อนที่ด้วยความเร็วต่างกัน", feedback: "ความเร็วต่างกันไม่ได้บอกชนิดของการชน ต้องเทียบพลังงานจลน์ ลองคำนวณดูว่าหลังชนพลังงานจลน์ลดลงจริงหรือไม่" }
      - { id: d, text: "เป็นการชนแบบไม่ยืดหยุ่นสมบูรณ์", feedback: "การชนแบบไม่ยืดหยุ่นสมบูรณ์ ลูกบอลต้องติดกันไปด้วยความเร็วเดียว แต่ที่รายงานมาความเร็วไม่เท่ากัน" }
    hints:
      - "ตรวจทั้งโมเมนตัมรวมและพลังงานจลน์รวม ทั้งก่อนและหลังชน"
      - "พลังงานจลน์รวมหลังชนจะ **มากกว่า** ก่อนชนได้ไหม ถ้าไม่มีแหล่งพลังงานภายใน"
    solution: "โมเมนตัม: ก่อน $(2)(4) = 8$ หลัง $(2)(1) + (1)(6) = 8\\ \\mathrm{kg\\,m/s}$ เท่ากัน แต่พลังงานจลน์: ก่อน $\\tfrac{1}{2}(2)(4)^2 = 16\\ \\mathrm{J}$ หลัง $\\tfrac{1}{2}(2)(1)^2 + \\tfrac{1}{2}(1)(6)^2 = 1 + 18 = 19\\ \\mathrm{J}$ เพิ่มขึ้นโดยไม่มีแหล่งพลังงาน จึงเป็นไปไม่ได้ (ถ้าชนแบบยืดหยุ่นสมบูรณ์ ผลที่ถูกคือ A $\\approx 1.33\\ \\mathrm{m/s}$ และ B $\\approx 5.33\\ \\mathrm{m/s}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.coll.p013
    topics: [physics.momentum.collisions]
    difficulty: 1
    type: mcq
    stem: "รถบรรทุกมวล $6000\\ \\mathrm{kg}$ ชนกับรถจักรยานยนต์มวล $150\\ \\mathrm{kg}$ ขณะชนกัน ข้อใดเปรียบเทียบแรงที่ทั้งสองกระทำต่อกันได้ถูกต้อง"
    choices:
      - { id: a, text: "แรงทั้งสองมีขนาดเท่ากัน ทิศตรงข้ามกัน", correct: true }
      - { id: b, text: "รถบรรทุกออกแรงต่อรถจักรยานยนต์มากกว่า เพราะหนักกว่า", feedback: "แรงคู่กิริยา–ปฏิกิริยาเท่ากันเสมอตามกฎข้อที่ 3 รถจักรยานยนต์เสียหายมากกว่าเพราะมวลน้อย จึงมีความเร่งมากกว่า ไม่ใช่เพราะได้รับแรงมากกว่า" }
      - { id: c, text: "รถจักรยานยนต์ออกแรงต่อรถบรรทุกมากกว่า เพราะเป็นฝ่ายเสียหาย", feedback: "ความเสียหายมากไม่ได้มาจากการออกแรงมาก แรงทั้งสองเท่ากัน" }
      - { id: d, text: "ขึ้นกับว่าคันไหนวิ่งเร็วกว่า", feedback: "ความเร็วมีผลต่อขนาดของแรงชนทั้งคู่ แต่ไม่ว่าเร็วเท่าใด แรงที่ทั้งสองกระทำต่อกันก็ยังเท่ากัน" }
    hints:
      - "นึกถึงกฎข้อที่ 3 ของนิวตัน"
      - "แรงกิริยาและแรงปฏิกิริยามีขนาดอย่างไร"
    solution: "ตามกฎข้อที่ 3 แรงที่รถบรรทุกกระทำต่อรถจักรยานยนต์เท่ากับแรงที่รถจักรยานยนต์กระทำต่อรถบรรทุก แต่ทิศตรงข้าม รถจักรยานยนต์มีมวลน้อยกว่า 40 เท่า จึงมีความเร่งมากกว่า 40 เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.coll.p014
    topics: [physics.momentum.collisions]
    difficulty: 2
    type: numeric
    stem: "ชาวประมงมวล $60\\ \\mathrm{kg}$ ยืนบนเรือหางยาวมวล $120\\ \\mathrm{kg}$ ที่ลอยนิ่งอยู่ เขากระโดดขึ้นท่าด้วยความเร็วในแนวระดับ $2.5\\ \\mathrm{m/s}$ เรือจะเคลื่อนที่ถอยหลังด้วยอัตราเร็วเท่าใด ไม่คิดแรงต้านของน้ำ (ตอบเป็นตัวเลขบวกในหน่วย m/s)"
    answer: { value: 1.25, tolerance: 0.01, unit: m/s }
    hints:
      - "ก่อนกระโดด ทั้งระบบนิ่ง โมเมนตัมรวมเป็นศูนย์"
      - "$0 = m_{\\text{คน}}v_{\\text{คน}} + m_{\\text{เรือ}}v_{\\text{เรือ}}$"
    misconceptions:
      - { match: 2.5, feedback: "อัตราเร็วจะเท่ากันก็ต่อเมื่อมวลเท่ากัน เรือหนักกว่าคนสองเท่า จึงเคลื่อนที่ช้ากว่า" }
      - { match: 5, feedback: "ดูเหมือนกลับอัตราส่วนมวล วัตถุที่หนักกว่าต้องเคลื่อนที่ช้ากว่า ไม่ใช่เร็วกว่า" }
    solution: "$0 = (60)(2.5) + (120)v$ ได้ $v = -\\dfrac{150}{120} = -1.25\\ \\mathrm{m/s}$ เรือถอยออกจากท่าด้วยอัตราเร็ว $1.25\\ \\mathrm{m/s}$ คนที่กระโดดจากเรือเล็กจึงต้องระวังพลาดตกน้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.coll.p015
    topics: [physics.momentum.collisions]
    difficulty: 2
    type: numeric
    stem: "รถทดลอง A มวล $2\\ \\mathrm{kg}$ วิ่งไปทางขวาด้วยอัตราเร็ว $3\\ \\mathrm{m/s}$ รถทดลอง B มวล $3\\ \\mathrm{kg}$ วิ่งสวนมาทางซ้ายด้วยอัตราเร็ว $2\\ \\mathrm{m/s}$ ชนกันแล้วติดกันไป ให้ทิศขวาเป็นบวก ความเร็วของรถทั้งสองหลังชนเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s)"
    answer: { value: 0, tolerance: 0.01, unit: m/s }
    hints:
      - "รถ B วิ่งไปทางซ้าย ความเร็วของ B จึงเป็นลบ"
      - "หาโมเมนตัมรวมก่อนชนโดยคิดเครื่องหมาย แล้วหารด้วยมวลรวม"
    misconceptions:
      - { match: 2.4, feedback: "ดูเหมือนบวกโมเมนตัม $6 + 6$ โดยไม่คิดทิศ B วิ่งสวนมา โมเมนตัมของ B ต้องเป็น $-6\\ \\mathrm{kg\\,m/s}$" }
    solution: "$p = (2)(3) + (3)(-2) = 6 - 6 = 0$ ดังนั้น $v = \\dfrac{0}{5} = 0$ รถทั้งสองหยุดนิ่งทันทีหลังชน พลังงานจลน์ทั้งหมด $\\tfrac12(2)(9) + \\tfrac12(3)(4) = 15\\ \\mathrm{J}$ หายไปหมด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.coll.p016
    topics: [physics.momentum.collisions]
    difficulty: 3
    type: numeric
    stem: "ในการทดลองบนรางลมของนักเรียน ม.4 รถ A มวล $0.40\\ \\mathrm{kg}$ วิ่งด้วยความเร็ว $0.50\\ \\mathrm{m/s}$ ชนรถ B มวล $0.20\\ \\mathrm{kg}$ ที่จอดนิ่ง เครื่องจับเวลาแสงวัดได้ว่าหลังชนรถ A วิ่งต่อไปทางเดิมด้วยความเร็ว $0.17\\ \\mathrm{m/s}$ ถ้าโมเมนตัมคงตัว รถ B ควรมีความเร็วเท่าใดหลังชน (ตอบเป็นตัวเลขในหน่วย m/s)"
    answer: { value: 0.66, tolerance: 0.01, unit: m/s }
    hints:
      - "โมเมนตัมก่อนชนมีแต่ของรถ A"
      - "$m_Au_A = m_Av_A + m_Bv_B$ แก้หา $v_B$"
    misconceptions:
      - { match: 0.33, feedback: "ดูเหมือนคิดว่าความเร็วที่ A เสียไป ($0.50 - 0.17$) ส่งต่อให้ B ทั้งหมด ต้องคิดเป็นโมเมนตัม B เบากว่า A ครึ่งหนึ่ง จึงได้ความเร็วเพิ่มเป็นสองเท่าของความเร็วที่ A เสียไป" }
      - { match: 1.0, feedback: "นั่นคือความเร็วของ B ถ้า A หยุดนิ่ง แต่ A ยังวิ่งต่อ $0.17\\ \\mathrm{m/s}$ ต้องหักโมเมนตัมส่วนนั้นออกก่อน" }
    solution: "$(0.40)(0.50) = (0.40)(0.17) + (0.20)v_B$ → $0.200 = 0.068 + 0.20v_B$ → $v_B = \\dfrac{0.132}{0.20} = 0.66\\ \\mathrm{m/s}$ ตรวจพลังงานจลน์: ก่อน $0.050\\ \\mathrm{J}$ หลัง $0.0058 + 0.0436 \\approx 0.049\\ \\mathrm{J}$ เกือบเท่าเดิม การชนจึงเกือบยืดหยุ่นสมบูรณ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.coll.p017
    topics: [physics.momentum.collisions]
    difficulty: 3
    type: numeric
    stem: "รถ A มวล $1.0\\ \\mathrm{kg}$ ชนรถ B ที่จอดนิ่งบนรางลม แล้วติดกันไป กราฟความเร็ว–เวลาของรถทั้งสองเป็นดังรูป รถ B มีมวลเท่าใด (ตอบเป็นตัวเลขในหน่วย kg)"
    figure: { src: p-vt-stick.svg, alt: "กราฟความเร็ว–เวลา รถ A มีความเร็ว 0.6 m/s คงที่จนถึง t = 1.0 s แล้วลดลงเหลือ 0.2 m/s ที่ t = 1.1 s รถ B นิ่งจนถึง t = 1.0 s แล้วเพิ่มเป็น 0.2 m/s ที่ t = 1.1 s หลังจากนั้นทั้งสองเส้นทับกันที่ 0.2 m/s" }
    answer: { value: 2, tolerance: 0.02, unit: kg }
    hints:
      - "อ่านความเร็วของ A ก่อนชน และความเร็วร่วมหลังชนจากกราฟ"
      - "$m_Au_A = (m_A + m_B)v$"
    misconceptions:
      - { match: 3, feedback: "นั่นคือมวลรวม $m_A + m_B$ ยังต้องลบมวลของ A ออก" }
    solution: "จากกราฟ $u_A = 0.6\\ \\mathrm{m/s}$ และหลังชนติดกันไปด้วย $v = 0.2\\ \\mathrm{m/s}$ จาก $(1.0)(0.6) = (1.0 + m_B)(0.2)$ ได้ $1.0 + m_B = 3$ ดังนั้น $m_B = 2\\ \\mathrm{kg}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.coll.p018
    topics: [physics.momentum.collisions]
    difficulty: 3
    type: numeric
    stem: "คนขับรถกระบะมวล $60\\ \\mathrm{kg}$ เคลื่อนที่ด้วยความเร็ว $15\\ \\mathrm{m/s}$ เมื่อรถชนกำแพงแล้วหยุด ถุงลมนิรภัยทำให้คนขับหยุดในเวลา $0.25\\ \\mathrm{s}$ แรงเฉลี่ยที่กระทำต่อคนขับมีขนาดเท่าใด (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 3600, tolerance: 10, unit: N }
    hints:
      - "โมเมนตัมของคนขับเปลี่ยนจาก $mv$ เป็นศูนย์"
      - "แรงเฉลี่ย $= \\dfrac{\\Delta p}{\\Delta t}$"
    misconceptions:
      - { match: 225, feedback: "ดูเหมือนนำโมเมนตัมคูณเวลา แรงเฉลี่ยคือการเปลี่ยนโมเมนตัมหารด้วยเวลา" }
      - { match: 90000, feedback: "นั่นคือแรงถ้าหยุดใน $0.01\\ \\mathrm{s}$ (เช่น กระแทกพวงมาลัย) ข้อนี้ถุงลมยืดเวลาเป็น $0.25\\ \\mathrm{s}$" }
    solution: "$\\Delta p = 0 - (60)(15) = -900\\ \\mathrm{kg\\,m/s}$ แรงเฉลี่ย $= \\dfrac{900}{0.25} = 3600\\ \\mathrm{N}$ ถ้าไม่มีถุงลมและศีรษะหยุดใน $0.01\\ \\mathrm{s}$ แรงจะเป็น $90\\,000\\ \\mathrm{N}$ มากกว่า 25 เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.coll.p019
    topics: [physics.momentum.collisions]
    difficulty: 4
    type: numeric
    stem: "ลูกบอล A มวล $0.5\\ \\mathrm{kg}$ เคลื่อนที่ไปทางขวาด้วยความเร็ว $4\\ \\mathrm{m/s}$ ชนตรง ๆ กับลูกบอล B มวล $1.5\\ \\mathrm{kg}$ ที่อยู่นิ่ง การชนเป็นแบบยืดหยุ่นสมบูรณ์ ให้ทิศขวาเป็นบวก ความเร็วของลูกบอล A หลังชนเป็นเท่าใด (ตอบเป็นตัวเลขพร้อมเครื่องหมายในหน่วย m/s)"
    answer: { value: -2, tolerance: 0.01, unit: m/s }
    hints:
      - "ใช้สูตรการชนแบบยืดหยุ่นสมบูรณ์กับวัตถุนิ่ง $v_1 = \\dfrac{m_1 - m_2}{m_1 + m_2}u_1$"
      - "ลูกที่เบากว่าชนลูกที่หนักกว่า จะเกิดอะไรขึ้นกับทิศของลูกที่เบา"
    misconceptions:
      - { match: 2, feedback: "ขนาดถูก แต่ $m_1 - m_2$ ติดลบ ลูก A กระดอนกลับไปทางซ้าย ความเร็วต้องเป็นลบ" }
      - { match: -4, feedback: "ลูกจะกระดอนกลับด้วยอัตราเร็วเท่าเดิมก็ต่อเมื่อชนสิ่งที่หนักมากจนไม่ขยับ (เช่น ผนัง) ที่นี่ลูก B ได้โมเมนตัมไปส่วนหนึ่ง" }
    solution: "$v_A = \\dfrac{0.5 - 1.5}{0.5 + 1.5}(4) = -2\\ \\mathrm{m/s}$ และ $v_B = \\dfrac{2(0.5)}{2}(4) = 2\\ \\mathrm{m/s}$ ตรวจ: โมเมนตัม $(0.5)(-2) + (1.5)(2) = 2 = (0.5)(4)$ ✓ พลังงานจลน์ $1 + 3 = 4\\ \\mathrm{J} = \\tfrac12(0.5)(16)$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.coll.p020
    topics: [physics.momentum.collisions]
    difficulty: 5
    type: numeric
    stem: "รถเก๋ง A มวล $1000\\ \\mathrm{kg}$ ชนท้ายรถ B มวล $1500\\ \\mathrm{kg}$ ที่จอดนิ่งอยู่ แล้วติดกันไถลไปบนถนนราบได้ $5\\ \\mathrm{m}$ ก่อนหยุด ขณะไถลมีแรงเสียดทานจากถนนเท่ากับ $0.7$ เท่าของน้ำหนักรวม ตำรวจต้องการรู้ว่ารถ A วิ่งเร็วเท่าใดก่อนชน ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย m/s)"
    answer: { value: 20.71, tolerance: 0.2, unit: m/s }
    hints:
      - "แบ่งเป็นสองช่วง: ช่วงไถลหลังชนใช้พลังงาน ช่วงชนใช้โมเมนตัม"
      - "ช่วงไถล: พลังงานจลน์หลังชนถูกแรงเสียดทานใช้หมด $\\tfrac12 Mv^2 = (0.7Mg)d$ ได้ $v = \\sqrt{2(0.7)gd}$"
      - "ช่วงชน: $m_Au_A = (m_A + m_B)v$"
    misconceptions:
      - { match: 8.28, feedback: "นั่นคือความเร็วร่วมทันทีหลังชน ยังต้องใช้การอนุรักษ์โมเมนตัมย้อนกลับไปหาความเร็วของ A ก่อนชน" }
      - { match: 3.31, feedback: "ดูเหมือนกลับอัตราส่วนมวล ความเร็วก่อนชนของ A ต้องมากกว่าความเร็วร่วม เพราะ A ต้องลากรถ B ที่นิ่งไปด้วย" }
    solution: "ช่วงไถล: $v = \\sqrt{2(0.7)(9.8)(5)} = \\sqrt{68.6} \\approx 8.28\\ \\mathrm{m/s}$ ช่วงชน: $u_A = \\dfrac{(1000 + 1500)(8.28)}{1000} \\approx 20.7\\ \\mathrm{m/s}$ (ประมาณ $75\\ \\mathrm{km/h}$) ห้ามใช้พลังงานข้ามช่วงชน เพราะการชนแบบติดกันเสียพลังงานจลน์ไปส่วนหนึ่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.coll.p021
    topics: [physics.momentum.collisions]
    difficulty: 2
    type: numeric
    stem: "รถทดลอง A มวล $3\\ \\mathrm{kg}$ วิ่งด้วยความเร็ว $4\\ \\mathrm{m/s}$ ชนรถทดลอง B มวล $1\\ \\mathrm{kg}$ ที่จอดนิ่ง หลังชนรถ A วิ่งต่อไปทางเดิมด้วยความเร็ว $2\\ \\mathrm{m/s}$ รถ B มีความเร็วเท่าใดหลังชน (ตอบเป็นตัวเลขในหน่วย m/s)"
    answer: { value: 6, tolerance: 0.01, unit: m/s }
    hints:
      - "โมเมนตัมรวมก่อนชน = โมเมนตัมรวมหลังชน"
      - "$(3)(4) = (3)(2) + (1)v_B$"
    misconceptions:
      - { match: 2, feedback: "ดูเหมือนคิดว่าความเร็วที่ A เสียไปเท่ากับความเร็วที่ B ได้ ต้องคิดเป็นโมเมนตัม B เบากว่า จึงได้ความเร็วมากกว่า" }
      - { match: 10, feedback: "ดูเหมือนนำโมเมนตัมก่อนชน 12 ลบด้วยความเร็วของ A ต้องลบด้วยโมเมนตัมของ A หลังชน $(3)(2) = 6$" }
    solution: "$(3)(4) = (3)(2) + (1)v_B$ → $12 = 6 + v_B$ → $v_B = 6\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.coll.p022
    topics: [physics.momentum.collisions]
    difficulty: 1
    type: numeric
    stem: "ลูกบอลมวล $2\\ \\mathrm{kg}$ เคลื่อนที่ไปทางขวาด้วยอัตราเร็ว $3\\ \\mathrm{m/s}$ และลูกบอลมวล $1\\ \\mathrm{kg}$ เคลื่อนที่ไปทางซ้ายด้วยอัตราเร็ว $4\\ \\mathrm{m/s}$ ให้ทิศขวาเป็นบวก โมเมนตัมรวมของระบบเป็นเท่าใด (ตอบเป็นตัวเลขพร้อมเครื่องหมายในหน่วย kg·m/s)"
    answer: { value: 2, tolerance: 0.01, unit: kg·m/s }
    hints:
      - "โมเมนตัมเป็นเวกเตอร์ ลูกที่ไปทางซ้ายมีโมเมนตัมเป็นลบ"
      - "รวม $(2)(3) + (1)(-4)$"
    misconceptions:
      - { match: 10, feedback: "ดูเหมือนบวกขนาดของโมเมนตัมโดยไม่คิดทิศ ลูกที่ไปทางซ้ายมีโมเมนตัม $-4\\ \\mathrm{kg\\,m/s}$" }
    solution: "$p = (2)(3) + (1)(-4) = 6 - 4 = 2\\ \\mathrm{kg\\,m/s}$ ไปทางขวา"
    license: CC-BY-SA-4.0
    ai_assisted: true
