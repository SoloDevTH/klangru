      - { id: b, text: "แบบ A เพราะ B/C สูงกว่า", feedback: "B/C สูงแปลว่าได้ผลต่อบาทมาก แต่โครงการเล็กกว่าจึงให้ประโยชน์สุทธิรวมน้อยกว่า เมื่องบพอและเลือกได้หนึ่งเดียวให้ดู NPV" }
      - { id: c, text: "ทำทั้งสองแบบ", feedback: "โจทย์บอกว่าเป็นโครงการบนพื้นที่เดียวกันซึ่งเลือกได้เพียงหนึ่ง" }
      - { id: d, text: "ไม่ทำเลย เพราะ B/C ของทั้งสองแบบต่ำกว่า 2", feedback: "เกณฑ์คือ B/C มากกว่า 1 และ NPV มากกว่า 0 ทั้งสองแบบผ่าน" }
    hints:
      - "ทั้งสองโครงการคุ้มหรือไม่"
      - "เลือกหนึ่งจากสองที่ทดแทนกัน ใช้เกณฑ์ใดเป็นหลัก"
    solution: "ทั้งสองแบบคุ้ม (NPV > 0, B/C > 1) เมื่อเลือกได้แบบเดียวและงบไม่จำกัด ให้เลือกแบบที่ NPV สูงกว่า คือแบบ B ซึ่งให้ประโยชน์สุทธิมากกว่า 15 ล้านบาท"
