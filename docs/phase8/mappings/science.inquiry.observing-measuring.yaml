  - { framework: au-ac9-science, indicators: ["AC9SFI02"], coverage: full, note: "สังเกตด้วยประสาทสัมผัสอย่างปลอดภัย ห้ามชิมหรือดมตรง ๆ ห้ามมองดวงอาทิตย์ และดูผ่านรูเข็มแทน (บทเรียนส่วน 1 ภาพความปลอดภัยเมื่อสังเกต)" }
