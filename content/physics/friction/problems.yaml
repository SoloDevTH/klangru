      - { match: 0.36, feedback: "นั่นคือ $\\tfrac{3.6}{10}$ จากจุดข้อมูลจุดเดียว ซึ่งมีความคลาดเคลื่อน ควรใช้ความชันของเส้นที่เหมาะสม" }
