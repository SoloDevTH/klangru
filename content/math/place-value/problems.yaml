problems:
  - id: math.pv.p001
    topics: [math.number.place-value]
    difficulty: 1
    type: mcq
    stem: "ในจำนวน 52,384 เลขโดด 3 มีค่าเท่าใด"
    choices:
      - { id: a, text: "300", correct: true }
      - { id: b, text: "3", feedback: "3 คือตัวเลขโดด แต่โจทย์ถามค่าของมัน ต้องคูณด้วยค่าประจำหลักของตำแหน่งที่มันอยู่" }
      - { id: c, text: "3,000", feedback: "ดูเหมือนนับหลักเกินไปหนึ่งหลัก นับจากขวา: 4 หลักหน่วย 8 หลักสิบ 3 หลักร้อย" }
      - { id: d, text: "30", feedback: "ดูเหมือนนับหลักขาดไปหนึ่งหลัก 30 จะเกิดเมื่อ 3 อยู่หลักสิบ แต่หลักสิบของจำนวนนี้คือ 8" }
    hints:
      - "นับตำแหน่งจากหลักหน่วยทางขวาสุด"
      - "หาว่า 3 อยู่ในหลักใด แล้วคูณ 3 ด้วยค่าประจำหลักนั้น"
    solution: "นับจากขวา: 4 หลักหน่วย, 8 หลักสิบ, 3 หลักร้อย ค่าของเลขโดด 3 จึงเป็น $3 \\times 100 = 300$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.pv.p002
    topics: [math.number.place-value]
    difficulty: 1
    type: numeric
    stem: "ในจำนวน 47,215 เลขโดด 7 มีค่าเท่าใด (ตอบเป็นตัวเลข)"
    answer: { value: 7000 }
    hints:
      - "เลขโดดกับค่าของเลขโดดไม่เหมือนกัน ค่าขึ้นกับตำแหน่ง"
      - "นับหลักจากขวา: หน่วย สิบ ร้อย พัน หมื่น แล้วคูณ 7 ด้วยค่าประจำหลักที่ได้"
    misconceptions:
      - { match: 7, feedback: "7 คือเลขโดด โจทย์ถามค่าของมัน ซึ่งต้องคูณด้วยค่าประจำหลักของตำแหน่งที่ 7 อยู่" }
      - { match: 700, feedback: "ดูเหมือนนับหลักขาดไปหนึ่งหลัก นับจากขวา: 5 หน่วย, 1 สิบ, 2 ร้อย, 7 พัน" }
    solution: "นับจากขวา: 5 หลักหน่วย, 1 หลักสิบ, 2 หลักร้อย, 7 หลักพัน ค่าของเลขโดด 7 คือ $7 \\times 1{,}000 = 7{,}000$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.pv.p003
    topics: [math.number.place-value]
    difficulty: 2
    type: numeric
    stem: "จำนวนที่เขียนในรูปกระจายเป็น 6,000 + 400 + 5 คือจำนวนใด (ตอบเป็นตัวเลข)"
    answer: { value: 6405 }
    hints:
      - "มีหลักพัน หลักร้อย และหลักหน่วย แต่หลักใดหายไป"
      - "หลักที่ไม่มีค่าต้องเขียน 0 จองที่ไว้"
    misconceptions:
      - { match: 645, feedback: "ลืมใส่ 0 ในหลักสิบ จำนวนนี้ไม่มีหลักสิบ จึงต้องเขียน 0 จองที่ไว้ ไม่เช่นนั้น 6 จะเลื่อนจากหลักพันมาอยู่หลักร้อย" }
    solution: "6,000 คือ 6 ในหลักพัน, 400 คือ 4 ในหลักร้อย, ไม่มีหลักสิบจึงเป็น 0, 5 อยู่หลักหน่วย ได้ 6,405"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.pv.p004
    topics: [math.number.place-value]
    difficulty: 2
    type: match
    stem: "จับคู่คำอ่านกับตัวเลขให้ถูกต้อง"
    pairs:
      - { left: "สามหมื่นสี่สิบ", right: "30,040" }
      - { left: "สามพันสี่ร้อย", right: "3,400" }
      - { left: "สามหมื่นสี่พัน", right: "34,000" }
      - { left: "สามแสนสี่ร้อย", right: "300,400" }
    hints:
      - "เขียนตารางหลัก แสน หมื่น พัน ร้อย สิบ หน่วย แล้ววางเลขโดดลงในหลักที่คำอ่านบอก"
      - "หลักที่คำอ่านไม่ได้พูดถึงให้ใส่ 0"
    solution: "สามหมื่นสี่สิบ = 3 ในหลักหมื่น 4 ในหลักสิบ = 30,040 · สามพันสี่ร้อย = 3,400 · สามหมื่นสี่พัน = 34,000 · สามแสนสี่ร้อย = 3 ในหลักแสน 4 ในหลักร้อย = 300,400"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.pv.p005
    topics: [math.number.place-value]
    difficulty: 2
    type: numeric
    stem: "รองเท้านักเรียนคู่หนึ่งราคา 3,476 บาท ถ้าปัดเป็นหลักร้อย จะได้ประมาณกี่บาท"
    answer: { value: 3500, unit: บาท }
    hints:
      - "หลักร้อยของ 3,476 คือ 4 ให้ดูหลักถัดไปทางขวา"
      - "หลักสิบเป็น 7 ซึ่งมากกว่าหรือเท่ากับ 5 ให้ตัดสินว่าปัดขึ้นหรือลง แล้วเปลี่ยนหลักทางขวาเป็น 0"
    misconceptions:
      - { match: 3400, feedback: "ดูเหมือนตัดหลักสิบกับหลักหน่วยทิ้งเฉย ๆ แต่หลักสิบเป็น 7 ซึ่งตั้งแต่ 5 ขึ้นไปต้องปัดขึ้น" }
      - { match: 3480, feedback: "นั่นคือการปัดเป็นหลักสิบ โจทย์ให้ปัดเป็นหลักร้อย คำตอบต้องลงท้ายด้วย 00" }
    solution: "หลักร้อยคือ 4 หลักถัดไปคือหลักสิบ เป็น 7 ซึ่ง ≥ 5 จึงปัดขึ้น หลักร้อยกลายเป็น 5 และหลักทางขวาเป็น 0 ได้ 3,500 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.pv.p006
    topics: [math.number.place-value]
    difficulty: 3
    type: order
    stem: "เรียงทศนิยมต่อไปนี้จากน้อยไปมาก"
    items:
      - "0.054"
      - "0.405"
      - "0.45"
      - "0.5"
    hints:
      - "เติม 0 ท้ายทศนิยมให้มีสามตำแหน่งเท่ากันทุกตัว ค่าไม่เปลี่ยน"
      - "เทียบหลักส่วนสิบก่อน ถ้าเท่ากันค่อยเทียบหลักส่วนร้อย แล้วหลักส่วนพัน"
    solution: "เติม 0 ให้ยาวเท่ากัน: 0.054, 0.405, 0.450, 0.500 หลักส่วนสิบคือ 0, 4, 4, 5 ส่วน 0.405 กับ 0.450 หลักส่วนสิบเท่ากัน หลักส่วนร้อย 0 < 5 จึงได้ 0.054 < 0.405 < 0.45 < 0.5"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.pv.p007
    topics: [math.number.place-value]
    difficulty: 3
    type: mcq
    stem: "ในการแข่งวิ่ง 100 เมตรกีฬาสีของโรงเรียน นักกีฬาสี่คนจับเวลาได้ดังนี้ ใครวิ่งเร็วที่สุด"
    choices:
      - { id: a, text: "สีแดง 12.08 วินาที", correct: true }
      - { id: b, text: "สีเหลือง 12.1 วินาที", feedback: "ดูเหมือนอ่านตัวเลขหลังจุดเป็นจำนวนเต็ม (1 กับ 08) ให้เทียบหลักส่วนสิบก่อน: 12.08 มี 0 ส่วน 12.1 มี 1 จึง 12.08 น้อยกว่า" }
      - { id: c, text: "สีเขียว 12.75 วินาที", feedback: "ทศนิยมที่มีหลายหลักไม่ได้แปลว่ามีค่าน้อยหรือมาก เทียบหลักส่วนสิบ 7 มากกว่า 0 จึงใช้เวลานานกว่าสีแดง" }
      - { id: d, text: "สีฟ้า 12.8 วินาที", feedback: "12.8 ไม่เท่ากับ 12.08 เพราะ 12.8 มี 8 ส่วนสิบ แต่ 12.08 มีแค่ 8 ส่วนร้อย และ 12.8 เป็นเวลานานที่สุดในกลุ่มนี้ ใช้เวลานานแปลว่าช้า" }
    hints:
      - "วิ่งเร็วที่สุดคือใช้เวลา **น้อยที่สุด**"
      - "ส่วนจำนวนเต็มเท่ากันหมด ให้เติม 0 ให้ทศนิยมยาวเท่ากัน แล้วเทียบหลักส่วนสิบ"
    solution: "เติม 0 ให้ยาวเท่ากัน: 12.08, 12.10, 12.75, 12.80 หลักส่วนสิบคือ 0, 1, 7, 8 น้อยที่สุดคือ 12.08 วินาที สีแดงจึงวิ่งเร็วที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.pv.p008
    topics: [math.number.place-value]
    difficulty: 3
    type: numeric
    stem: "ปัด 2.648 เป็นทศนิยม 1 ตำแหน่ง"
    answer: { value: 2.6, tolerance: 0.01 }
    hints:
      - "ทศนิยม 1 ตำแหน่ง คือเก็บไว้ถึงหลักส่วนสิบ"
      - "ดูเลขโดดในหลักถัดไปทางขวาของหลักส่วนสิบเพียงหลักเดียว แล้วตัดสินว่าปัดขึ้นหรือลง"
    misconceptions:
      - { match: 2.7, feedback: "ดูเหมือนปัดเป็นทอด ๆ คือปัดเป็น 2.65 ก่อนแล้วปัดอีกครั้ง ต้องดูหลักส่วนร้อยของจำนวนเดิม ซึ่งเป็น 4 จึงปัดลง" }
      - { match: 2.65, feedback: "นั่นคือการปัดเป็นทศนิยม 2 ตำแหน่ง โจทย์ต้องการทศนิยม 1 ตำแหน่งเท่านั้น" }
    solution: "หลักส่วนสิบคือ 6 หลักถัดไปคือหลักส่วนร้อย เป็น 4 ซึ่งน้อยกว่า 5 จึงปัดลง ได้ 2.6 ตรวจ: 2.648 ยังไม่ถึงครึ่งทาง 2.65 จึงใกล้ 2.6 มากกว่า 2.7 ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.pv.p009
    topics: [math.number.place-value]
    difficulty: 4
    type: numeric
    stem: "จังหวัดหนึ่งมีประชากร 1,246,873 คน ถ้าปัดเป็นหลักแสน จะได้ประมาณกี่คน (ตอบเป็นตัวเลข)"
    answer: { value: 1200000, unit: คน }
    hints:
      - "หลักแสนของจำนวนนี้คือเลขโดดตัวที่สองจากซ้าย"
      - "ดูเลขโดดในหลักหมื่นเพียงหลักเดียว ไม่ต้องดูหลักอื่นที่อยู่ทางขวาต่อไป"
    misconceptions:
      - { match: 1300000, feedback: "ดูเหมือนปัดเป็นทอด ๆ (ปัดเป็นหลักหมื่นได้ 1,250,000 แล้วปัดอีกครั้ง) ต้องดูหลักหมื่นของจำนวนเดิมครั้งเดียว ซึ่งเป็น 4 จึงปัดลง" }
      - { match: 1250000, feedback: "นั่นคือการปัดเป็นหลักหมื่น โจทย์ให้ปัดเป็นหลักแสน" }
    solution: "หลักแสนคือ 2 หลักถัดไปคือหลักหมื่น เป็น 4 ซึ่งน้อยกว่า 5 จึงปัดลง หลักทางขวาทั้งหมดเป็น 0 ได้ 1,200,000 คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.pv.p010
    topics: [math.number.place-value]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "จำนวนใดบ้างที่ปัดเป็นหลักพันแล้วได้ 8,000 (เลือกได้มากกว่า 1 ข้อ)"
    choices:
      - { id: a, text: "7,500", correct: true }
      - { id: b, text: "8,499", correct: true }
      - { id: c, text: "7,950", correct: true }
      - { id: d, text: "7,499", feedback: "หลักร้อยของ 7,499 คือ 4 จึงปัดลงเป็น 7,000 ไม่ต้องดูหลักสิบและหลักหน่วยที่เป็น 9" }
      - { id: e, text: "8,500", feedback: "หลักร้อยของ 8,500 คือ 5 ซึ่งต้องปัดขึ้น จึงได้ 9,000" }
    hints:
      - "ปัดเป็นหลักพัน ให้ดูเฉพาะเลขโดดในหลักร้อย"
      - "จำนวนที่ปัดได้ 8,000 ต้องอยู่ตั้งแต่ 7,500 ไปจนถึงก่อน 8,500"
    solution: "ดูหลักร้อยของแต่ละจำนวน: 7,500 → 5 ปัดขึ้นเป็น 8,000 · 8,499 → 4 ปัดลงเป็น 8,000 · 7,950 → 9 ปัดขึ้นเป็น 8,000 · 7,499 → 4 ปัดลงเป็น 7,000 · 8,500 → 5 ปัดขึ้นเป็น 9,000 คำตอบคือ 7,500, 8,499 และ 7,950"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.pv.p011
    topics: [math.number.place-value]
    difficulty: 3
    type: text
    stem: "เขียน \"สองล้านสามหมื่นห้าสิบ\" เป็นตัวเลข (พิมพ์ตัวเลข จะมีจุลภาคหรือไม่ก็ได้)"
    accepted: ["2030050", "2,030,050"]
    hints:
      - "หลักล้านมีทั้งหมด 7 หลัก: ล้าน แสน หมื่น พัน ร้อย สิบ หน่วย"
      - "วาง 2 ในหลักล้าน 3 ในหลักหมื่น 5 ในหลักสิบ แล้วเติม 0 ในหลักที่ไม่ได้พูดถึง"
    misconceptions:
      - { match: "2350", feedback: "เขียนเฉพาะเลขที่ได้ยินโดยไม่ใส่ 0 จองที่ จำนวนในหลักล้านต้องมี 7 หลัก" }
      - { match: "2,350", feedback: "เขียนเฉพาะเลขที่ได้ยินโดยไม่ใส่ 0 จองที่ จำนวนในหลักล้านต้องมี 7 หลัก" }
      - { match: "2300050", feedback: "วาง 3 ผิดหลัก 3 ควรอยู่หลักหมื่น (ตำแหน่งที่ 5 จากขวา) แต่ตอนนี้อยู่หลักแสน" }
    solution: "ล้าน 2 · แสน 0 · หมื่น 3 · พัน 0 · ร้อย 0 · สิบ 5 · หน่วย 0 ได้ 2,030,050"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.pv.p012
    topics: [math.number.place-value]
    difficulty: 2
    type: numeric
    stem: "ในจำนวน 12.358 เลขโดด 5 มีค่าเท่าใด (ตอบเป็นทศนิยม)"
    answer: { value: 0.05, tolerance: 0.0005 }
    hints:
      - "นับหลักจากจุดทศนิยมไปทางขวา: ส่วนสิบ ส่วนร้อย ส่วนพัน"
      - "หาว่า 5 อยู่หลักใด แล้วคูณ 5 ด้วยค่าประจำหลักนั้น"
    misconceptions:
      - { match: 0.5, feedback: "ดูเหมือนนับหลักขาดไปหนึ่งหลัก หลักแรกหลังจุดคือหลักส่วนสิบ ซึ่งเป็น 3 ส่วน 5 อยู่หลักที่สอง" }
      - { match: 5, feedback: "5 คือเลขโดด โจทย์ถามค่าของมัน ซึ่งขึ้นกับตำแหน่งหลังจุดทศนิยม" }
    solution: "หลังจุด: 3 หลักส่วนสิบ, 5 หลักส่วนร้อย, 8 หลักส่วนพัน ค่าของเลขโดด 5 คือ $5 \\times 0.01 = 0.05$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.pv.p013
    topics: [math.number.place-value]
    difficulty: 5
    type: numeric
    stem: "แม่ค้าบอกว่าราคาตู้เย็นใหม่ \"ประมาณ 4,300 บาท\" โดยปัดเป็นหลักร้อย ถ้าราคาจริงเป็นจำนวนเต็มบาท ราคาจริงที่มากที่สุดที่เป็นไปได้กับราคาจริงที่น้อยที่สุดที่เป็นไปได้ต่างกันกี่บาท"
    answer: { value: 99, unit: บาท }
    hints:
      - "จำนวนที่ปัดเป็นหลักร้อยแล้วได้ 4,300 ต้องอยู่ใกล้ 4,300 มากกว่า 4,200 และ 4,400"
      - "ลองปัด 4,250 และ 4,350 ดูว่าได้ 4,300 หรือไม่ หลักสิบเป็น 5 ต้องปัดขึ้น"
      - "หาราคาน้อยที่สุดและมากที่สุดที่ปัดได้ 4,300 แล้วนำมาลบกัน"
    misconceptions:
