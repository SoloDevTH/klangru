  - id: biology.plants.plant-products-growth.p014
    topics: [biology.plants.plant-products-growth]
    difficulty: 4
    type: mcq
    stem: "ปลูกข้าวพันธุ์ ก และพันธุ์ ข ในแปลง 2 แบบ ได้ความสูงเฉลี่ยดังนี้ แปลงดินดีน้ำพอ พันธุ์ ก 150 cm พันธุ์ ข 95 cm แปลงขาดน้ำ พันธุ์ ก 110 cm พันธุ์ ข 70 cm ข้อสรุปใดสอดคล้องกับข้อมูลมากที่สุด"
    choices:
      - { id: a, text: "ทั้งพันธุกรรมและสิ่งแวดล้อมมีผลต่อความสูงของข้าว", correct: true }
      - { id: b, text: "ความสูงขึ้นกับพันธุกรรมอย่างเดียว", feedback: "ข้าวพันธุ์เดียวกันในแปลงขาดน้ำเตี้ยกว่า แสดงว่าสิ่งแวดล้อมมีผลด้วย" }
      - { id: c, text: "ความสูงขึ้นกับสิ่งแวดล้อมอย่างเดียว", feedback: "ในแปลงเดียวกัน พันธุ์ ก สูงกว่าพันธุ์ ข เสมอ แสดงว่าพันธุกรรมมีผลด้วย" }
    hints:
      - "เทียบพันธุ์เดียวกันในสองแปลง แล้วเทียบสองพันธุ์ในแปลงเดียวกัน"
      - "ถ้าการเปรียบเทียบทั้งสองแบบให้ผลต่างกัน แสดงว่ามีผลทั้งสองปัจจัย"
    solution: "พันธุ์เดียวกันสูงต่างกันในสองแปลง แสดงว่าสิ่งแวดล้อมมีผล และในแปลงเดียวกันพันธุ์ ก สูงกว่าพันธุ์ ข แสดงว่าพันธุกรรมมีผล การเจริญเติบโตจึงเป็นผลร่วมของทั้งสองปัจจัย"
