<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" font-family="sans-serif">
<title>สระว่ายน้ำมองจากด้านบนและด้านข้าง มีขนาดยาว กว้าง และลึกที่กำกับไว้</title>
<rect width="780" height="300" fill="#ffffff"/>
<text x="235.0" y="48" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">มองจากด้านบน</text>
<rect x="110" y="70" width="250" height="125" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
<text x="235.0" y="215" text-anchor="middle" font-size="13" fill="#111">ยาว 50 m</text>
<line x1="100" y1="70" x2="100" y2="195" stroke="#444"/><text x="94" y="136.5" text-anchor="end" font-size="13" fill="#111">กว้าง 25 m</text>
<text x="585" y="48" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">มองจากด้านข้าง (ตัดตามความยาว)</text>
<rect x="460" y="170" width="250" height="40" fill="#60a5fa" fill-opacity="0.55" stroke="#1e3a8a" stroke-width="2"/>
<text x="585" y="232" text-anchor="middle" font-size="13" fill="#111">ยาว 50 m</text>
<line x1="722" y1="170" x2="722" y2="210" stroke="#444"/><text x="730" y="194" font-size="13" fill="#111">ลึก 2 m</text>
<text x="110" y="286" font-size="12" fill="#555">ภาพไม่ได้วาดตามมาตราส่วนความลึก (ความลึกขยายให้มองเห็นได้)</text>
</svg>