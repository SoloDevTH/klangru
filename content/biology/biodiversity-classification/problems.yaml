  - id: biology.diversity.biodiversity-classification.p013
    topics: [biology.diversity.biodiversity-classification]
    difficulty: 4
    type: mcq
    stem: "ข้อใดอธิบายได้ดีที่สุดว่าทำไมการจำแนกสิ่งมีชีวิตจึงเปลี่ยนจากระบบ 5 อาณาจักรเป็นระบบ 3 โดเมน"
    choices:
      - { id: a, text: "การเทียบลำดับเบสของ rRNA พบว่าโพรแคริโอตแยกเป็นสองสายที่ต่างกันมาก และอาร์เคียใกล้ชิดกับยูคาเรียมากกว่าแบคทีเรีย", correct: true }
      - { id: b, text: "กล้องจุลทรรศน์ทำให้พบว่าแบคทีเรียมีนิวเคลียส", feedback: "แบคทีเรียไม่มีนิวเคลียส การเปลี่ยนเกิดจากหลักฐานระดับโมเลกุล" }
      - { id: c, text: "นักวิทยาศาสตร์ตกลงกันให้มีจำนวนกลุ่มน้อยลงเพื่อให้จำง่าย", feedback: "การจำแนกเปลี่ยนตามหลักฐานเรื่องความสัมพันธ์ทางวิวัฒนาการ ไม่ใช่ความสะดวก" }
      - { id: d, text: "พบว่าพืชและสัตว์มีบรรพบุรุษร่วมกัน จึงรวมเป็นโดเมนเดียว", feedback: "พืชและสัตว์อยู่ในยูคาเรียเหมือนเดิม การเปลี่ยนสำคัญอยู่ที่การแยกโพรแคริโอตเป็นสองโดเมน" }
    hints:
