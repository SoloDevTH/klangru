  stem: จับคู่คำบอกระดับความมั่นใจหรือทัศนคติกับความหมาย
  pairs:
  - left: clearly
    right: มั่นใจสูง ยืนยันอย่างชัดเจน
  - left: arguably
    right: อาจกล่าวได้ว่า ยังไม่ยืนยันเต็มที่
  - left: appears to
    right: ดูเหมือนว่า ยังไม่แน่ชัด
  - left: unfortunately
    right: น่าเสียดาย แสดงความรู้สึกของผู้เขียน
