id: thai.grammar.sentence-structure
subject: thai
title: { th: ส่วนประกอบและโครงสร้างประโยค, en: "Sentence components and structure" }
summary: แยกภาคประธานและภาคแสดง ประโยค 2 ส่วนและ 3 ส่วน วลี และวิเคราะห์ประโยคสามัญ ประโยครวม ประโยคซ้อน และประโยคซับซ้อน แล้วเลือกโครงสร้างให้ตรงวัตถุประสงค์
difficulty: 5
minutes: 40
prerequisites: [thai.grammar.sentences-basic]
encompasses:
  - { id: thai.grammar.sentences-basic, weight: 0.3 }
  - { id: thai.grammar.word-types, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: sentence-kinds.svg
    alt: "แผนภาพ 3 แถว แถวที่ 1 ประโยคสามัญ: กล่อง เด็ก ๆ (ภาคประธาน) กับ เล่นฟุตบอลที่สนาม (ภาคแสดง) แถวที่ 2 ประโยครวม: ฝนตกหนัก (ประโยคที่ 1) + แต่ (สันธาน) + เด็ก ๆ ยังเล่นฟุตบอล (ประโยคที่ 2) แถวที่ 3 ประโยคซ้อน: กรอบใหญ่มีกล่อง เด็ก ๆ, ที่ชอบออกกำลังกาย (ประโยคย่อย ขยาย เด็ก ๆ), มักนอนหลับสบาย ประโยคหลักคือ เด็ก ๆ มักนอนหลับสบาย"
    caption: "ประโยคสามัญ ประโยครวม และประโยคซ้อน"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: หาประโยคหลักในประโยคซ้อน
    problem: "หาประโยคหลักและประโยคย่อยของ \"นักเรียนที่มาสายต้องเขียนชื่อในสมุดซึ่งวางอยู่หน้าห้อง\""
    steps:
      - text: "หาคำเชื่อมประโยคย่อย: ที่ (หลัง นักเรียน) และ ซึ่ง (หลัง สมุด)"
      - text: "กันประโยคย่อยที่ 1: ที่มาสาย ขยาย นักเรียน"
      - text: "กันประโยคย่อยที่ 2: ซึ่งวางอยู่หน้าห้อง ขยาย สมุด"
      - text: "ส่วนที่เหลือ: นักเรียนต้องเขียนชื่อในสมุด มีประธาน (นักเรียน) และกริยาหลัก (เขียน)"
        why: "ประโยคหลักต้องยืนเองได้ ส่วนประโยคย่อยแยกออกมาแล้วไม่รู้ว่าขยายอะไร"
    answer: "ประโยคหลัก: นักเรียนต้องเขียนชื่อในสมุด · ประโยคย่อย: ที่มาสาย · ซึ่งวางอยู่หน้าห้อง"
  - { type: check, problem: thai.grammar.sentence-structure.p007, prompt: "หาคำเชื่อมประโยคย่อยก่อน" }
  - type: worked-example
    title: แยกประโยคซับซ้อนทีละชั้น
    problem: "วิเคราะห์ \"พ่อบอกว่าจะซ่อมหลังคาที่รั่ว แต่ฝนตกทั้งวันจนพ่อออกไปข้างนอกไม่ได้\""
    steps:
      - text: "แยกด้วยสันธาน แต่ ได้สองส่วน: (1) พ่อบอกว่าจะซ่อมหลังคาที่รั่ว (2) ฝนตกทั้งวันจนพ่อออกไปข้างนอกไม่ได้"
      - text: "ส่วนที่ 1: ประโยคหลัก พ่อบอก · ประโยคย่อย ว่าจะซ่อมหลังคา (เป็นกรรมของ บอก) ซึ่งมีประโยคย่อยซ้อนอีกชั้น ที่รั่ว (ขยาย หลังคา)"
      - text: "ส่วนที่ 2: ประโยคหลัก ฝนตกทั้งวัน · ประโยคย่อย จนพ่อออกไปข้างนอกไม่ได้ (บอกผล)"
      - text: "สรุป: เป็นประโยครวมที่มีประโยคย่อยซ้อนอยู่ในทั้งสองส่วน"
        why: "การมีทั้งโครงสร้างรวมและซ้อนในประโยคเดียวทำให้จัดเป็นประโยคซับซ้อน"
    answer: "ประโยคซับซ้อน: ประโยครวม (แต่) ที่มีประโยคย่อย ว่า... ที่... และ จน... ซ้อนอยู่"
  - { type: check, problem: thai.grammar.sentence-structure.p013, prompt: "ที่ ตัวนี้ตามด้วยคำนามหรือกริยา" }
glossary:
  - { term: ภาคประธาน, definition: "ประธานพร้อมส่วนขยาย บอกว่าใครหรืออะไร" }
  - { term: ภาคแสดง, definition: "กริยาพร้อมกรรม ส่วนเติมเต็ม และส่วนขยาย บอกว่าทำอะไรหรือเป็นอย่างไร" }
  - { term: วลี, definition: "กลุ่มคำที่มีความหมายแต่ยังไม่ครบเป็นประโยค เช่น บ้านหลังใหญ่ริมคลอง" }
  - { term: ประโยคสามัญ, definition: "ประโยคที่มีภาคประธานและภาคแสดงชุดเดียว (ประโยคความเดียว)" }
  - { term: ประโยครวม, definition: "ประโยคสามัญตั้งแต่ 2 ประโยคเชื่อมด้วยสันธาน (ประโยคความรวม)" }
  - { term: ประโยคซ้อน, definition: "ประโยคหลักที่มีประโยคย่อยซ้อนอยู่ เชื่อมด้วย ที่ ซึ่ง อัน ว่า เมื่อ (ประโยคความซ้อน)" }
  - { term: ประโยคซับซ้อน, definition: "ประโยคที่มีหลายชั้น เช่น ประโยครวมที่มีประโยคย่อยซ้อนอยู่ด้วย" }
flashcards:
  - { front: "ประโยค 2 ส่วน กับ 3 ส่วน ต่างกันอย่างไร", back: "2 ส่วนไม่มีกรรม (นกบิน) · 3 ส่วนมีกรรม (แมวจับหนู)" }
  - { front: "สันธานของประโยครวม 4 แบบ", back: "คล้อยตาม (และ) · ขัดแย้ง (แต่) · เลือก (หรือ) · เหตุผล (จึง)" }
  - { front: "คำเชื่อมประโยคย่อยในประโยคซ้อน", back: "ที่ ซึ่ง อัน (ขยายนาม) · ว่า ให้ (เป็นนาม) · เมื่อ ขณะที่ จน (ขยายกริยา)" }
  - { front: "ผู้ที่ชนะการแข่งขัน เป็นประโยคหรือไม่", back: "ไม่ ขาดกริยาหลัก ต้องเติม เช่น ...ได้รับถ้วยรางวัล" }
