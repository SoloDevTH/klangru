  - id: math.lgr.p020
    topics: [math.functions.linear-graphs]
    difficulty: 4
    type: numeric
    stem: "ค่าไฟฟ้ารายเดือนของบ้านหลังหนึ่ง (ตามแบบจำลองอย่างง่าย) เป็นเส้นตรงตามจำนวนหน่วยที่ใช้ เดือนที่ใช้ 100 หน่วยจ่าย 450 บาท เดือนที่ใช้ 250 หน่วยจ่าย 1,050 บาท ระยะตัดแกนของกราฟ (ค่าใช้จ่ายเมื่อใช้ 0 หน่วย) ซึ่งเป็นค่าบริการคงที่ เท่ากับกี่บาท (ตอบในหน่วยบาท)"
    answer: { value: 50, unit: บาท }
    hints:
      - "หาความชันจากสองจุด $(100, 450)$ และ $(250, 1050)$ ก่อน"
      - "ความชันคือค่าไฟต่อหน่วย แล้วเขียน $y = mx + c$ แทนจุดหนึ่งเพื่อหา $c$"
    misconceptions:
      - { match: 4, feedback: "4 บาทคือความชัน (ค่าไฟต่อหน่วย) โจทย์ถามค่า $c$ ซึ่งเป็นค่าเมื่อใช้ 0 หน่วย" }
      - { match: 450, feedback: "450 บาทคือค่าไฟเมื่อใช้ 100 หน่วย ไม่ใช่ 0 หน่วย" }
    solution: "$m = \\frac{1050 - 450}{250 - 100} = \\frac{600}{150} = 4$ บาท/หน่วย แทน $(100, 450)$: $450 = 4(100) + c$ ได้ $c = 50$ บาท คือค่าบริการที่จ่ายแม้ไม่ใช้ไฟเลย ตรวจ: $4(250) + 50 = 1050$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

