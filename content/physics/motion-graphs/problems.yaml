    stem: "รถคันหนึ่งออกตัวจากหยุดนิ่งด้วยความเร่งคงตัว กราฟตำแหน่ง–เวลาเป็นเส้นโค้งที่ผ่านจุด $(0\\ \\mathrm{s}, 0\\ \\mathrm{m})$, $(1\\ \\mathrm{s}, 2\\ \\mathrm{m})$, $(2\\ \\mathrm{s}, 8\\ \\mathrm{m})$ และ $(3\\ \\mathrm{s}, 18\\ \\mathrm{m})$ ที่เวลา $t = 3\\ \\mathrm{s}$ รถมีความเร็วขณะนั้นเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s)"
