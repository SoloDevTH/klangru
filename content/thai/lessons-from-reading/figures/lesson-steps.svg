<defs><marker id="a5e35b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5e35b1"/></marker></defs>
<rect x="0" y="0" width="860" height="330" fill="#fff"/>
