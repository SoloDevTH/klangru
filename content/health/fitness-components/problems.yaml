    ai_assisted: true

  - id: health.fitness.fitness-components.p014
    topics: [health.fitness.fitness-components]
    difficulty: 4
    type: mcq
    stem: "มิวตัวเล็กกว่าเพื่อนและเพิ่งหายป่วย ผลทดสอบลุก-นั่งได้ระดับต่ำ ในขณะที่เพื่อนได้ระดับดีมาก ข้อใดคิดได้เหมาะสมที่สุด"
    choices:
      - { id: a, text: "แต่ละคนมีพื้นฐานต่างกัน มิวควรตั้งเป้าให้ดีขึ้นกว่าผลของตัวเองครั้งก่อน และฝึกอย่างค่อยเป็นค่อยไป", correct: true }
      - { id: b, text: "มิวต้องฝึกหนักทันทีวันละหลายร้อยครั้งให้เท่าเพื่อน", feedback: "การหักโหมทันทีเสี่ยงบาดเจ็บ โดยเฉพาะเมื่อเพิ่งหายป่วย ควรค่อย ๆ เพิ่ม" }
      - { id: c, text: "มิวไม่มีทางดีขึ้น จึงไม่ต้องฝึก", feedback: "สมรรถภาพทางกายพัฒนาได้ด้วยการฝึกสม่ำเสมอ" }
      - { id: d, text: "ผลทดสอบไม่มีประโยชน์ ไม่ต้องสนใจ", feedback: "ผลทดสอบช่วยให้รู้จุดที่ต้องพัฒนาและติดตามความก้าวหน้าของตัวเอง" }
    hints:
      - "นึกถึงความแตกต่างระหว่างบุคคล"
      - "การเทียบกับใครช่วยให้เห็นพัฒนาการของตนเองได้ดีที่สุด"
    solution: "สมรรถภาพทางกายพัฒนาได้ตามความแตกต่างระหว่างบุคคล การเทียบกับผลเดิมของตัวเองและค่อย ๆ เพิ่มความหนักเป็นวิธีที่ปลอดภัยและได้ผล"
