    pairs:
      - { left: "เลขฐานสิบหก", right: "รหัสสีบนเว็บ #FF8800" }
      - { left: "ส่วนเติมเต็มสอง", right: "เก็บอุณหภูมิ −5 °C เป็น 1111 1011" }
      - { left: "จุดลอยตัว", right: "เก็บระยะทางระหว่างดาวที่มีขนาดใหญ่มาก" }
      - { left: "จำนวนเต็มหน่วยย่อย", right: "เก็บเงิน 12.75 บาทเป็น 1275 สตางค์" }
      - { left: "เครื่องหมายและขนาด", right: "บิตซ้ายสุดบอกบวกลบ บิตที่เหลือบอกขนาด" }
