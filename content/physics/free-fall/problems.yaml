  - id: phy.ff.p016
    topics: [physics.kinematics.free-fall]
    difficulty: 3
    type: numeric
    stem: "นักบินอวกาศปล่อยค้อนจากความสูง $2.0\\ \\mathrm{m}$ บนดวงจันทร์ ซึ่งมีความเร่งโน้มถ่วง $1.6\\ \\mathrm{m/s^2}$ และไม่มีอากาศ ค้อนใช้เวลากี่วินาทีจึงถึงพื้น (ตอบเป็นตัวเลขในหน่วย s ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 1.58, tolerance: 0.02, unit: s }
    hints:
