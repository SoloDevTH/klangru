problems:
- id: business.marketing.pricing.p001
  topics:
  - business.marketing.pricing
  difficulty: 1
  type: mcq
  stem: การตั้งราคาแบบ **ต้นทุนบวกกำไร** คืออะไร
  choices:
  - id: a
    text: นำต้นทุนต่อหน่วยมาบวกกำไรที่ต้องการ แล้วได้เป็นราคาขาย
    correct: true
  - id: b
    text: ตั้งราคาเท่ากับร้านคู่แข่งทุกครั้ง
    feedback: นั่นคือการตั้งราคาตามคู่แข่ง
  - id: c
    text: ตั้งราคาตามที่ลูกค้ารู้สึกว่าคุ้มค่า
    feedback: นั่นคือการตั้งราคาตามคุณค่า
  - id: d
    text: ขายต่ำกว่าต้นทุนเสมอเพื่อให้ขายดี
    feedback: ขายต่ำกว่าต้นทุนทำให้ขาดทุนทุกชิ้น
  hints:
  - ชื่อวิธีบอกส่วนประกอบของราคาอยู่แล้ว
  - ราคา $=$ ต้นทุน $+$ กำไร
  solution: 'ต้นทุนบวกกำไร: หาต้นทุนต่อหน่วยก่อน แล้วบวกส่วนกำไร (มักกำหนดเป็นร้อยละของต้นทุน) เป็นราคาขาย วิธีนี้ง่ายและไม่ขาดทุนต่อชิ้น แต่ไม่ได้ดูคู่แข่งหรือความยินดีจ่ายของลูกค้า'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.pricing.p002
  topics:
  - business.marketing.pricing
  difficulty: 1
  type: numeric
  stem: เสื้อยืดราคา $200$ บาท ลดราคา $25\%$ ต้องจ่ายกี่บาท (ตอบเป็นบาท)
  answer:
    value: 150
    unit: บาท
  misconceptions:
  - match: 50
    feedback: นั่นคือส่วนลด โจทย์ถามเงินที่ต้องจ่าย
  - match: 175
    feedback: ลด 25 บาท ไม่ใช่ 25%
  hints:
  - ส่วนลด $= 200 \times 25\%$
  - ราคาหลังลด $=$ ราคาเดิม $-$ ส่วนลด
  solution: ส่วนลด $= 200 \times 0.25 = 50$ บาท จ่าย $200 - 50 = 150$ บาท (หรือ $200 \times 0.75$)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.pricing.p003
  topics:
  - business.marketing.pricing
  difficulty: 2
  type: numeric
  stem: ร้านขนมมีต้นทุนบราวนี่ชิ้นละ $80$ บาท ตั้งราคาโดย **บวกกำไร $25\%$ ของต้นทุน** (markup) ราคาขายเป็นกี่บาท (ตอบเป็นบาท)
  answer:
    value: 100
    unit: บาท
  misconceptions:
  - match: 106.666667
    feedback: ใช้ 25% เป็นอัตรากำไรต่อราคาขาย (margin) โจทย์บอกคิดจากต้นทุน
  - match: 20
    feedback: นั่นคือกำไรต่อชิ้น
  hints:
  - กำไรต่อชิ้น $= 80 \times 25\%$
  - ราคา $=$ ต้นทุน $\times (1 + \text{อัตราบวกเพิ่ม})$
  solution: กำไรต่อชิ้น $= 80 \times 0.25 = 20$ บาท ราคา $= 80 + 20 = 100$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.pricing.p004
  topics:
  - business.marketing.pricing
  difficulty: 2
  type: match
  stem: จับคู่วิธีตั้งราคากับตัวอย่าง
  pairs:
  - left: ต้นทุนบวกกำไร
    right: ต้นทุนแก้วละ 30 บาท บวกเพิ่ม 50% ขาย 45 บาท
  - left: ตามคู่แข่ง
    right: ร้านข้าง ๆ ขายจานละ 50 บาท ร้านเราจึงขาย 50 บาทเท่ากัน
  - left: ตามคุณค่าที่ลูกค้ารับรู้
    right: ทุเรียนจากสวนที่มีชื่อเสียง ลูกค้ายอมจ่ายแพงกว่าทุเรียนทั่วไปมาก
  - left: ราคาเชิงจิตวิทยา
    right: ตั้งราคา 199 บาทแทน 200 บาท
  hints:
  - ดูว่าราคามาจากต้นทุน คู่แข่ง ความรู้สึกของลูกค้า หรือการเล่นกับตัวเลข
  - ราคาลงท้ายด้วย 9 ทำให้ดูถูกกว่าความจริง
  solution: ต้นทุนบวกกำไร → บวก 50% จากต้นทุน · ตามคู่แข่ง → ขายเท่าร้านข้าง ๆ · ตามคุณค่า → ลูกค้ายอมจ่ายเพราะชื่อเสียงและคุณภาพ · เชิงจิตวิทยา → 199 บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.pricing.p005
  topics:
  - business.marketing.pricing
  difficulty: 2
  type: numeric
  stem: สินค้าต้นทุน $80$ บาท ขาย $100$ บาท **อัตรากำไรต่อราคาขาย** (margin) เป็นกี่เปอร์เซ็นต์ (ตอบเป็น %)
  answer:
    value: 20
    unit: '%'
  misconceptions:
  - match: 25
    feedback: หารด้วยต้นทุน นั่นคือ markup ไม่ใช่ margin
  - match: 80
    feedback: นั่นคือสัดส่วนต้นทุนต่อราคา
  hints:
  - กำไรต่อชิ้น $= 100 - 80$
  - margin $=$ กำไร $\div$ **ราคาขาย** $\times 100$
  solution: กำไร $= 20$ บาท margin $= \dfrac{20}{100} \times 100 = 20\%$ ส่วน markup $= \dfrac{20}{80} \times 100 = 25\%$ สินค้าชิ้นเดียวกัน ตัวเลขต่างกันเพราะฐานต่างกัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.pricing.p006
  topics:
  - business.marketing.pricing
  difficulty: 3
  type: numeric
  stem: ร้านขายกระเป๋าผ้ามีต้นทุนใบละ $140$ บาท ต้องการ **อัตรากำไรต่อราคาขาย $30\%$** ต้องตั้งราคากี่บาท (ตอบเป็นบาท)
  answer:
    value: 200
    unit: บาท
  misconceptions:
  - match: 182
    feedback: บวก 30% ของต้นทุน (markup) ได้ margin เพียง 23% ไม่ใช่ 30%
  - match: 42
    feedback: นั่นคือ 30% ของต้นทุน
  hints:
  - ถ้ากำไรเป็น $30\%$ ของราคา ต้นทุนเป็นกี่ % ของราคา
  - ราคา $=$ ต้นทุน $\div (1 - \text{margin})$
  solution: 'ต้นทุนเป็น $70\%$ ของราคา ราคา $= 140 \div 0.70 = 200$ บาท ตรวจ: กำไร $60$ บาท $= 30\%$ ของ $200$ ✓'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.pricing.p007
  topics:
  - business.marketing.pricing
  difficulty: 3
  type: numeric
  stem: ร้านโชห่วยซื้อน้ำปลาลังละ $300$ บาท ขายลังละ $450$ บาท **อัตราบวกเพิ่มจากต้นทุน** (markup) เป็นกี่เปอร์เซ็นต์ (ตอบเป็น %)
  answer:
    value: 50
    unit: '%'
  misconceptions:
  - match: 33.333333
    feedback: หารด้วยราคาขาย นั่นคือ margin
  - match: 150
    feedback: นั่นคือกำไรเป็นบาท
  hints:
  - กำไร $= 450 - 300$
  - markup $=$ กำไร $\div$ **ต้นทุน** $\times 100$
  solution: กำไร $150$ บาท markup $= \dfrac{150}{300} \times 100 = 50\%$ (ส่วน margin $= \dfrac{150}{450} \approx 33.3\%$)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.pricing.p008
  topics:
  - business.marketing.pricing
  difficulty: 3
  type: numeric
  stem: ร้านออนไลน์ติดป้ายรองเท้าตามภาพ ลูกค้าได้ลด $20\%$ ก่อน แล้วใช้โค้ดลดเพิ่ม $10\%$ จากราคาที่ลดแล้ว ลูกค้าจ่ายกี่บาท (ตอบเป็นบาท ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 928.8
    tolerance: 0.05
    unit: บาท
  misconceptions:
  - match: 903
    feedback: บวกส่วนลดเป็น 30% แต่ส่วนลดที่สองคิดจากราคาที่ลดแล้ว
  - match: 1032
    feedback: ลดแค่ครั้งแรก
  figure:
    src: p-price-tag.svg
    alt: ป้ายสินค้ารองเท้าผ้าใบของร้านออนไลน์ (สมมติ) ราคาปกติ 1,290 บาท มีแถบลด 20% และคูปองโค้ดลดเพิ่ม 10% เมื่อชำระเงิน
  hints:
  - 'ลดครั้งแรก: คูณ $0.80$'
  - 'ลดครั้งที่สองคิดจากราคาที่ลดแล้ว: คูณ $0.90$ อีกครั้ง'
  solution: $1{,}290 \times 0.80 = 1{,}032$ บาท แล้ว $1{,}032 \times 0.90 = 928.80$ บาท ส่วนลดรวม $28\%$ ไม่ใช่ $30\%$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.pricing.p009
  topics:
  - business.marketing.pricing
  difficulty: 3
  type: mcq
  stem: โปรโมชันใดให้ **ส่วนลดต่อชิ้นมากที่สุด** (สินค้าราคาเท่ากันทุกชิ้น)
  choices:
  - id: a
    text: ซื้อ 1 แถม 1
    correct: true
  - id: b
    text: ซื้อ 2 แถม 1
    feedback: ได้ 3 ชิ้นจ่าย 2 ชิ้น ลดเฉลี่ยประมาณ 33.3% ต่อชิ้น
  - id: c
    text: ลด 40%
    feedback: 40% น้อยกว่าซื้อ 1 แถม 1 ที่เท่ากับลด 50% ต่อชิ้น
  - id: d
    text: ชิ้นที่สองลด 50%
    feedback: จ่าย 1.5 เท่าของราคาได้ 2 ชิ้น เท่ากับลด 25% ต่อชิ้น
  hints:
  - เปลี่ยนแต่ละโปรเป็นส่วนลดเฉลี่ยต่อชิ้น
  - ส่วนลดต่อชิ้น $=$ จำนวนชิ้นที่ได้ฟรี $\div$ จำนวนชิ้นที่ได้ทั้งหมด
  solution: 'ซื้อ 1 แถม 1: ฟรี 1 ใน 2 ชิ้น $= 50\%$ · ซื้อ 2 แถม 1: ฟรี 1 ใน 3 $\approx 33.3\%$ · ชิ้นที่สองลดครึ่ง: ลด 0.5 ใน 2 ชิ้น $= 25\%$ · ลด 40% จึงน้อยกว่าซื้อ 1 แถม 1'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.pricing.p010
  topics:
  - business.marketing.pricing
  difficulty: 3
  type: numeric
  stem: ร้านชานมขายแก้วละ $60$ บาท ต้นทุนผันแปรแก้วละ $25$ บาท จัดโปร **ซื้อ 1 แถม 1** ลูกค้าหนึ่งคนซื้อหนึ่งครั้งได้ 2 แก้ว ร้านได้กำไรส่วนเกินจากการขายครั้งนั้นกี่บาท (ตอบเป็นบาท)
  answer:
    value: 10
    unit: บาท
  misconceptions:
  - match: 35
    feedback: ลืมว่าต้องให้แก้วที่สองฟรี
  - match: 70
    feedback: คิดราคาสองแก้วเป็น 120 บาท แต่ลูกค้าจ่ายแค่ 60 บาท
  hints:
  - ร้านได้เงิน $60$ บาท แต่ต้องทำชานม 2 แก้ว
  - กำไรส่วนเกิน $=$ รายได้ $-$ ต้นทุนผันแปรของทั้ง 2 แก้ว
  solution: รายได้ $60$ บาท ต้นทุนผันแปร $2 \times 25 = 50$ บาท กำไรส่วนเกิน $10$ บาท (เดิมขายแก้วเดียวได้ $35$ บาท) โปรนี้จึงต้องเพิ่มยอดขายมากจึงคุ้ม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.pricing.p011
  topics:
  - business.marketing.pricing
  difficulty: 4
  type: numeric
  stem: รถเข็นกาแฟมีต้นทุนคงที่เดือนละ $9{,}000$ บาท ขายแก้วละ $50$ บาท ต้นทุนผันแปรแก้วละ $20$ บาท ถ้าลดราคา $20\%$ ทั้งเดือน **จุดคุ้มทุน** ใหม่คือกี่แก้วต่อเดือน (ตอบเป็นแก้ว)
  answer:
    value: 450
    unit: แก้ว
  misconceptions:
  - match: 300
    feedback: นั่นคือจุดคุ้มทุนก่อนลดราคา
  - match: 225
    feedback: หารด้วยราคา ต้องหารด้วยกำไรส่วนเกินต่อแก้ว
  hints:
  - ราคาใหม่ $= 50 \times 0.8$
  - จุดคุ้มทุน $=$ ต้นทุนคงที่ $\div$ กำไรส่วนเกินต่อหน่วยใหม่
  solution: ราคาใหม่ $40$ บาท กำไรส่วนเกิน $40 - 20 = 20$ บาท จุดคุ้มทุน $= 9{,}000 \div 20 = 450$ แก้ว เพิ่มจาก $300$ แก้ว ถึง $50\%$ ทั้งที่ลดราคาเพียง $20\%$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.pricing.p012
  topics:
  - business.marketing.pricing
  difficulty: 4
  type: numeric
  stem: รถเข็นกาแฟเดิม (ต้นทุนคงที่ $9{,}000$ บาท ขาย $50$ บาท ต้นทุนผันแปร $20$ บาท) ขายได้เดือนละ $500$ แก้ว กำไร $6{,}000$ บาท ถ้าลดราคาเหลือ $40$ บาท ต้องขายกี่แก้วจึงได้กำไรเท่าเดิม (ตอบเป็นแก้ว)
  answer:
    value: 750
    unit: แก้ว
  misconceptions:
  - match: 600
    feedback: คิดว่าลดราคา 20% ก็ขายเพิ่มแค่ 20% แต่กำไรต่อแก้วลดลงถึงหนึ่งในสาม
  - match: 450
    feedback: นั่นคือจุดคุ้มทุน ยังไม่ได้กำไร 6,000 บาท
  hints:
  - กำไรเป้าหมาย $6{,}000$ บาท ต้นทุนคงที่ $9{,}000$ บาท ต้องให้กำไรส่วนเกินรวมเท่าไร
  - จำนวนแก้ว $= (F + \text{กำไรเป้าหมาย}) \div (p - v)$
  solution: กำไรส่วนเกินใหม่แก้วละ $20$ บาท ต้องการ $9{,}000 + 6{,}000 = 15{,}000$ บาท จึงต้องขาย $15{,}000 \div 20 = 750$ แก้ว เพิ่มขึ้น $50\%$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.pricing.p013
  topics:
  - business.marketing.pricing
  difficulty: 4
  type: numeric
  stem: ร้านออนไลน์ขายกระเป๋า ต้นทุน (รวมค่าแพ็ก) ใบละ $120$ บาท แพลตฟอร์มคิดค่าธรรมเนียม $8\%$ ของราคาขาย ร้านต้องการกำไรใบละ $50$ บาทหลังหักค่าธรรมเนียม ต้องตั้งราคาอย่างน้อยกี่บาท (ตอบเป็นบาท ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 184.782609
    tolerance: 0.05
    unit: บาท
  misconceptions:
  - match: 183.6
    feedback: บวก 8% ของต้นทุนและกำไร แต่ค่าธรรมเนียมคิดจากราคาขาย ซึ่งสูงกว่า
  - match: 170
    feedback: ลืมค่าธรรมเนียม
  hints:
  - ร้านเหลือเงิน $92\%$ ของราคาหลังหักค่าธรรมเนียม
  - ตั้ง $0.92P = 120 + 50$
  solution: $0.92P = 170 \Rightarrow P = 170 \div 0.92 \approx 184.78$ บาท ในทางปฏิบัติปัดขึ้นเป็น $185$ บาทหรือราคาจิตวิทยา $189$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.pricing.p014
  topics:
  - business.marketing.pricing
  difficulty: 4
  type: mcq
  stem: สวนทุเรียนแห่งหนึ่งมีชื่อเสียงเรื่องคุณภาพ ลูกค้าจองล่วงหน้าและยอมจ่ายแพงกว่าราคาตลาดทั่วไปมาก การตั้งราคาที่เหมาะคือแบบใด
  choices:
  - id: a
    text: ตั้งตามคุณค่าที่ลูกค้ารับรู้ (ราคาสูงกว่าตลาด)
    correct: true
  - id: b
    text: ต้นทุนบวกกำไรเท่ากับสวนอื่น
    feedback: ต้นทุนใกล้กัน แต่ลูกค้าให้คุณค่ามากกว่า ใช้ต้นทุนอย่างเดียวจะเสียโอกาส
  - id: c
    text: ตั้งต่ำกว่าคู่แข่งเพื่อแย่งลูกค้า
    feedback: ลูกค้าจองล่วงหน้าอยู่แล้ว ไม่จำเป็นต้องลดราคา และอาจทำให้ภาพลักษณ์คุณภาพลดลง
  - id: d
    text: ตั้งราคาสุ่ม
    feedback: การตั้งราคาควรมีหลักเกณฑ์
  hints:
  - ลูกค้ายอมจ่ายเพราะอะไร
  - ราคาตามคุณค่ามองที่ความยินดีจ่ายของลูกค้า
