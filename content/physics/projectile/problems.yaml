      - { id: b, text: "เป็นศูนย์ที่จุดสูงสุด และเป็น $9.8\\ \\mathrm{m/s^2}$ ที่จุดอื่น", feedback: "ที่จุดสูงสุดความเร็วแนวดิ่งเป็นศูนย์ แต่ความเร่งไม่เป็นศูนย์ แรงโน้มถ่วงยังกระทำอยู่ ความเร็วแนวดิ่งจึงเปลี่ยนจากขึ้นเป็นลงได้" }
      - { id: c, text: "มีทิศเดียวกับความเร็ว คือชี้ไปตามแนวเส้นโค้ง", feedback: "แรงที่กระทำมีแรงเดียวคือแรงโน้มถ่วงซึ่งชี้ลงเสมอ ความเร่งจึงชี้ลงเสมอ ไม่ได้ชี้ตามทิศการเคลื่อนที่" }
      - { id: d, text: "ชี้ไปข้างหน้าในแนวราบ เพราะลูกเปตองเคลื่อนที่ไปข้างหน้า", feedback: "ลูกเปตองไปข้างหน้าด้วยความเร็วแนวราบคงตัว ซึ่งไม่ต้องมีความเร่ง ไม่มีแรงใดดันไปข้างหน้าหลังจากออกจากมือ" }
    hints:
