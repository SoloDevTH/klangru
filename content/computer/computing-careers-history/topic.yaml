id: computer.society.computing-careers-history
subject: computer
title: { th: ผู้คนในประวัติศาสตร์คอมพิวเตอร์และอาชีพด้านคอมพิวเตอร์, en: "People in computing history and computing careers" }
summary: รู้จักคนหลากหลายที่ช่วยสร้างคอมพิวเตอร์ เห็นว่าบุคคล ชุมชน บริษัท และรัฐมีบทบาทต่อเทคโนโลยี และเชื่อมความสนใจของตนกับอาชีพที่ใช้แนวคิดเชิงคำนวณ
difficulty: 3
minutes: 35
prerequisites: [computer.society.computing-impacts]
encompasses: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: timeline.svg
    alt: "เส้นเวลาจากปี 1830 ถึง 1990 มีจุดเหตุการณ์หกจุด ได้แก่ 1843 เอดา เลิฟเลซ เขียนบันทึก 1936 อลัน ทัวริง เสนอแนวคิดเครื่องจักรทัวริง 1944 เกรซ ฮอปเปอร์เริ่มทำงานกับ Harvard Mark I 1952 ฮอปเปอร์พัฒนา A-0 1973 โทรศัพท์มือถือเครื่องแรกถูกทดลองโทร และ 1983 เริ่มขายเชิงพาณิชย์"
    caption: "เหตุการณ์ในประวัติศาสตร์เกิดขึ้นห่างกันหลายสิบปี ให้นับระยะห่างเป็นปีเพื่อดูความต่อเนื่อง"
  - type: worked-example
    title: แปลงปี ค.ศ. เป็น พ.ศ. แล้วหาระยะห่าง
    problem: "เอดา เลิฟเลซ เขียนบันทึกในปี ค.ศ. 1843 และเกรซ ฮอปเปอร์พัฒนา A-0 ในปี ค.ศ. 1952 เหตุการณ์ทั้งสองห่างกันกี่ปี และในปี พ.ศ. ปีที่พัฒนา A-0 คือปีใด"
    steps:
      - text: "หาระยะห่างระหว่างปี ค.ศ. 1952 กับ 1843: 1952 − 1843 = 109 ปี"
      - text: "แปลงปี ค.ศ. เป็น พ.ศ. โดยบวก 543: 1952 + 543 = 2495"
        why: "พ.ศ. มากกว่า ค.ศ. อยู่ 543 ปีเสมอ จึงต้องบวกเพิ่ม ไม่ใช่ลบ"
      - text: "ตรวจอีกครั้ง ระยะห่างของ พ.ศ. ก็ยังเท่าเดิม คือ 2495 − 2386 = 109 ปี"
        why: "ปีที่ต่างกันจะไม่เปลี่ยนเมื่อแปลงทั้งสองปีด้วยค่าเดียวกัน"
    answer: "ห่างกัน 109 ปี และปีที่พัฒนา A-0 ตรงกับ พ.ศ. 2495"
  - { type: check, problem: computer.society.computing-careers-history.p004, prompt: "ลองนึกถึงอาชีพที่ใช้การคำนวณในชีวิตประจำวัน" }
  - type: worked-example
    title: วิเคราะห์ผลของโทรศัพท์มือถือ
    problem: "จากการพัฒนาโทรศัพท์มือถือ ผลกระทบใดตั้งใจและผลใดไม่ตั้งใจ และใครมีบทบาทบ้าง"
    steps:
      - text: "ดูว่าเจตนาแรกของผู้พัฒนาคืออะไร คือให้ติดต่อคนได้ระหว่างเดินทาง นี่คือผลที่ตั้งใจ"
      - text: "ดูผลที่ตามมาโดยไม่ได้วางแผน เช่น ขยะอิเล็กทรอนิกส์เมื่อเครื่องเก่าถูกทิ้ง และการใช้หน้าจอนานเกินไป"
        why: "ผลที่ไม่ตั้งใจมักเห็นชัดในระยะยาว จึงต้องดูนานกว่าช่วงแรกที่เริ่มใช้"
      - text: "ระบุบทบาท บริษัทพัฒนาเครื่องรุ่นใหม่ รัฐจัดสรรคลื่นความถี่ และชุมชนเลือกใช้หรือไม่ใช้"
      - text: "สรุปว่าเทคโนโลยีเกิดจากหลายฝ่ายและมีผลได้ทั้งที่ตั้งใจและไม่ตั้งใจ"
    answer: "ผลที่ตั้งใจคือการติดต่อได้ทุกที่ ผลที่ไม่ตั้งใจคือขยะและการใช้หน้าจอนานเกินไป และหลายฝ่ายมีบทบาทร่วมกัน"
  - { type: check, problem: computer.society.computing-careers-history.p011, prompt: "ลองแยกว่าผลกระทบใดตั้งใจหรือไม่ตั้งใจ" }
glossary:
  - { term: แนวคิดเชิงคำนวณ (computational thinking), definition: "การคิดแบบแยกปัญหาเป็นส่วนย่อย หาแบบแผน และออกแบบขั้นตอนการแก้ปัญหาที่ทำซ้ำหรือปรับได้" }
  - { term: ผลที่ตั้งใจ (intended effect), definition: "ผลที่ผู้พัฒนาหรือผู้ใช้ตั้งเป้าไว้ตั้งแต่ต้นเมื่อสร้างหรือใช้เทคโนโลยี" }
  - { term: ผลที่ไม่ตั้งใจ (unintended effect), definition: "ผลที่เกิดขึ้นตามมาโดยไม่ได้วางแผน เช่น ขยะจากเครื่องเก่า" }
  - { term: มาตรฐานการเข้ารหัส (character encoding), definition: "กติกาที่กำหนดว่าตัวอักษรแต่ละตัวจะถูกเก็บเป็นตัวเลขอย่างไร เช่น ตัวอักษรไทยบนคอมพิวเตอร์" }
  - { term: นักคำนวณ (computer), definition: "คำในอดีตที่หมายถึงบุคคลที่ทำการคำนวณด้วยมือหรือด้วยเครื่องก่อนมีคอมพิวเตอร์อิเล็กทรอนิกส์" }
flashcards:
  - { front: "เอดา เลิฟเลซ มีผลงานที่สำคัญอย่างไร", back: "เขียนบันทึกในปี ค.ศ. 1843 อธิบายว่าเครื่องวิเคราะห์อาจทำงานกับสัญลักษณ์ได้มากกว่าการคำนวณตัวเลข" }
  - { front: "เกรซ ฮอปเปอร์ พัฒนาอะไรในปี ค.ศ. 1952", back: "ตัวแปลภาษา A-0 ที่แปลคำสั่งที่คนอ่านได้ให้เครื่องทำงาน" }
  - { front: "แปลงปี ค.ศ. เป็น พ.ศ. ทำอย่างไร", back: "บวก 543 เช่น 1952 + 543 = 2495" }
  - { front: "ผลที่ตั้งใจกับผลที่ไม่ตั้งใจต่างกันอย่างไร", back: "ผลที่ตั้งใจคือเป้าหมายตั้งแต่ต้น ส่วนผลที่ไม่ตั้งใจคือสิ่งที่เกิดตามมาโดยไม่ได้วางแผน" }
