id: english.vocabulary.categories-cross-curricular
subject: english
title: { th: "จัดหมวดคำศัพท์และคำศัพท์จากวิชาอื่น", en: "Word categories and vocabulary from other subjects" }
summary: จัดคำเป็นหมวดคน สัตว์ สิ่งของ บอกความสัมพันธ์ของสิ่งรอบตัว และใช้คำศัพท์คณิตศาสตร์ วิทยาศาสตร์ และวิชาอื่นเป็นภาษาอังกฤษ
difficulty: 2
minutes: 25
prerequisites: [english.vocabulary.self-family-numbers]
encompasses:
  - { id: english.vocabulary.self-family-numbers, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: category-web.svg
    alt: "แผนผังความคิด ตรงกลางเขียน Words (คำศัพท์) มีเส้นโยงไปสามกล่อง กล่อง People (คน) มี teacher, doctor, farmer, baby กล่อง Animals (สัตว์) มี cat, elephant, fish, bird กล่อง Things (สิ่งของ) มี pencil, chair, bag, ball"
    caption: "จัดคำศัพท์เป็นสามหมวดใหญ่"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.vocabulary.categories-cross-curricular.p003, prompt: "คำไหนไม่เข้าพวก และเข้าหมวดไหนแทน" }
  - type: figure
    src: plant-parts.svg
    alt: "ภาพต้นไม้มีป้ายชื่อสี่ส่วน flower (ดอก) อยู่บนสุด leaf (ใบ) สีเขียวติดลำต้น stem (ลำต้น) เป็นแท่งตั้งตรง root (ราก) อยู่ใต้ดิน"
    caption: "คำศัพท์วิทยาศาสตร์: ส่วนของต้นไม้"
  - type: worked-example
    title: ทำสมุดคำศัพท์หมวดสัตว์
    problem: "จัดคำ *cow, tiger, cat, hen, monkey, rabbit* เป็นสามหมวดย่อย pets, farm animals และ wild animals แล้วพูดนำเสนอหนึ่งประโยค"
    steps:
      - text: "สัตว์ที่เลี้ยงไว้ในบ้าน: *cat, rabbit* → **pets**"
      - text: "สัตว์ที่เลี้ยงในฟาร์มเพื่อเป็นอาหารหรือใช้งาน: *cow, hen* → **farm animals**"
        why: "hen (แม่ไก่) ให้ไข่ cow (วัว) ให้นม จึงอยู่ในฟาร์ม"
      - text: "สัตว์ที่อยู่ในป่า: *tiger, monkey* → **wild animals**"
      - text: "นำเสนอ: *Cats and rabbits are pets. Cows and hens are farm animals. Tigers and monkeys are wild animals.*"
        why: "พูดถึงสัตว์ทั้งกลุ่มใช้รูปพหูพจน์ เติม s"
    answer: "pets: cat, rabbit · farm animals: cow, hen · wild animals: tiger, monkey"
  - { type: check, problem: english.vocabulary.categories-cross-curricular.p011, prompt: "minus แปลว่าอะไร" }
glossary:
  - { term: category, definition: "หมวดหมู่ กลุ่มของสิ่งที่เหมือนกัน เช่น animals, food" }
  - { term: odd one out, definition: "สิ่งที่ไม่เข้าพวก ไม่อยู่หมวดเดียวกับสิ่งอื่น" }
  - { term: word bank, definition: "สมุดหรือรายการรวบรวมคำศัพท์ แบ่งตามหมวดหรือตามวิชา" }
  - { term: food chain, definition: "ห่วงโซ่อาหาร ลำดับว่าสิ่งมีชีวิตใดกินสิ่งใด" }
  - { term: "plus / minus / times / equals", definition: "บวก / ลบ / คูณ / เท่ากับ" }
flashcards:
  - { front: "คน สัตว์ สิ่งของ ภาษาอังกฤษ", back: "people, animals, things" }
  - { front: "3 + 4 = 7 อ่านว่า", back: "Three plus four equals seven." }
  - { front: "ส่วนของต้นไม้ 4 ส่วน", back: "flower, leaf, stem, root" }
  - { front: "pets / farm animals / wild animals", back: "สัตว์เลี้ยง / สัตว์ในฟาร์ม / สัตว์ป่า" }
  - { front: "บอกว่าของใช้ทำอะไร", back: "A pencil is for writing." }
