    ai_assisted: true

  - id: biology.genetics.chromosomes-dna.p014
    topics: [biology.genetics.chromosomes-dna]
    difficulty: 4
    type: mcq
    stem: "mRNA ปกติคือ 5′-AUG GCA UUA CGA UAA-3′ ได้ Met-Ala-Leu-Arg ถ้าเบส G ตัวแรกของโคดอนที่ 2 ขาดหายไป ผลน่าจะเป็นอย่างไร"
    figure: { src: genetic-code.svg, alt: "ตารางรหัสพันธุกรรมมาตรฐานของโคดอนบน mRNA 64 โคดอน แถวคือเบสตัวที่ 1 คอลัมน์คือเบสตัวที่ 2 ภายในแต่ละช่องเรียงตามเบสตัวที่ 3 U C A G ตัวอย่าง UUU และ UUC เป็น Phe GGU GGC GGA GGG เป็น Gly AAA AAG เป็น Lys UGG เป็น Trp GAA GAG เป็น Glu GUU GUC GUA GUG เป็น Val AUG เป็น Met และเป็นรหัสเริ่ม UAA UAG UGA เป็นรหัสหยุด (ตารางครบทุกโคดอนตามรหัสพันธุกรรมมาตรฐาน)" }
    choices:
      - { id: a, text: "กรอบการอ่านเลื่อน กรดอะมิโนตั้งแต่ตำแหน่งที่ 2 เปลี่ยนไปทั้งหมด", correct: true }
      - { id: b, text: "กรดอะมิโนตำแหน่งที่ 2 หายไปตัวเดียว ที่เหลือเหมือนเดิม", feedback: "การขาดเบสเพียง 1 ตัวไม่ได้ทำให้หายไปทั้งโคดอน แต่ทำให้การอ่านทีละ 3 เบสเลื่อนไปทั้งสาย" }
      - { id: c, text: "ไม่มีผล เพราะรหัสพันธุกรรมมีหลายโคดอนแทนกรดอะมิโนเดียวกัน", feedback: "ความซ้ำซ้อนของรหัสช่วยได้เฉพาะการแทนที่บางแบบ ไม่ช่วยเมื่อกรอบการอ่านเลื่อน" }
    hints:
      - "เขียนลำดับใหม่หลังลบเบสออก แล้วแบ่งทีละ 3 เบสจาก AUG"
      - "เปรียบเทียบกรดอะมิโนทุกตำแหน่งกับของเดิม"
    solution: "ลำดับใหม่ AUG CAU UAC GAU AA... อ่านได้ Met-His-Tyr-Asp... กรดอะมิโนเปลี่ยนตั้งแต่ตำแหน่งที่ 2 และรหัสหยุดเดิมหายไป การเพิ่มหรือขาดของเบสที่ไม่ใช่ทีละ 3 จึงมักร้ายแรงกว่าการแทนที่"
