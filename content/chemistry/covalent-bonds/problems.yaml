  - id: chem.cov.p021
    topics: [chemistry.bonding.covalent]
    difficulty: 5
    type: expression
    stem: "แก๊สหุงต้ม (LPG) ส่วนใหญ่เป็นโพรเพนและบิวเทน ซึ่งเป็นอัลเคนสูตรทั่วไป $\\mathrm{C}_n\\mathrm{H}_{2n+2}$ คาร์บอนต่อกันเป็นสายด้วยพันธะเดี่ยว และทุกพันธะในโมเลกุลเป็นพันธะเดี่ยว เขียนจำนวนพันธะโคเวเลนต์ทั้งหมดในหนึ่งโมเลกุลในรูปของ $n$"
    prefix: "จำนวนพันธะ ="
    answer: { latex: "3n+1", variables: [n] }
    hints:
      - "แยกนับเป็นสองกลุ่ม: พันธะ C–C และพันธะ C–H"
      - "คาร์บอน $n$ อะตอมเรียงเป็นสายต่อกันด้วยพันธะกี่พันธะ (ลองนึกถึงรั้วที่มีเสา $n$ ต้น)"
      - "ไฮโดรเจนแต่ละอะตอมสร้างได้พันธะเดียว จำนวนพันธะ C–H จึงเท่ากับจำนวนไฮโดรเจน"
    misconceptions:
      - { match: "3n+2", feedback: "ดูเหมือนนับพันธะ C–C เป็น $n$ พันธะ คาร์บอน $n$ อะตอมเรียงเป็นสายมีพันธะระหว่างกัน $n - 1$ พันธะ (มีเทน $n = 1$ ไม่มีพันธะ C–C เลย)" }
      - { match: "2n+2", feedback: "นั่นคือพันธะ C–H อย่างเดียว ยังต้องนับพันธะ C–C ที่ต่อคาร์บอนเป็นสายด้วย" }
    solution: "พันธะ C–C $= n - 1$ พันธะ C–H $= 2n + 2$ รวม $(n - 1) + (2n + 2) = 3n + 1$ ตรวจ: มีเทน ($n = 1$) มี 4 พันธะ ✓ โพรเพน ($n = 3$) มี 2 + 8 = 10 พันธะ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true
