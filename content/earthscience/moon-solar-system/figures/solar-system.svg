<text x="320.0" y="95.0" text-anchor="start" font-size="13" fill="#374151">ดาวเคราะห์ชั้นนอก (แก๊สและน้ำแข็ง ใหญ่)</text>
<line x1="315" y1="105" x2="690" y2="105" stroke="#6b7280"/>
