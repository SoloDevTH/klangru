    stem: "ช่วงหน้าหนาวที่เชียงใหม่อากาศแห้ง เวลาถอดเสื้อกันหนาวผ้าขนสัตว์จะได้ยินเสียงเปาะแปะ เพราะเสื้อกับตัวเรามีประจุต่างกัน ขณะเสื้อเสียดสีกับเสื้อตัวใน อนุภาคใดย้ายจากวัตถุหนึ่งไปอีกวัตถุหนึ่ง"
    choices:
      - { id: a, text: "อิเล็กตรอน", correct: true }
      - { id: b, text: "โปรตอน", feedback: "โปรตอนถูกยึดแน่นอยู่ในนิวเคลียส การถูกันไม่ได้ทำให้โปรตอนย้ายที่" }
      - { id: c, text: "นิวตรอน", feedback: "นิวตรอนไม่มีประจุ และอยู่ในนิวเคลียสเหมือนโปรตอน" }
      - { id: d, text: "ทั้งอะตอม", feedback: "ถ้าอะตอมที่เป็นกลางย้ายไป จะไม่ทำให้เกิดประจุเลย สิ่งที่ย้ายคือส่วนที่มีประจุและหลุดง่ายที่สุด" }
    hints:
      - "อนุภาคในอะตอมใดอยู่รอบนอกและหลุดออกได้ง่าย"
    solution: "การเสียดสีทำให้ **อิเล็กตรอน** ย้ายจากวัตถุหนึ่งไปอีกวัตถุหนึ่ง วัตถุที่ได้อิเล็กตรอนมีประจุลบ วัตถุที่เสียอิเล็กตรอนมีประจุบวกเท่ากัน"
