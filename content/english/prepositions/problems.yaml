  - id: english.grammar.prepositions.p018
    topics: [english.grammar.prepositions]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "เลือกประโยคที่ **ถูกต้อง** ทั้งหมด"
    choices:
      - { id: a, text: "Mother's Day in Thailand is on 12 August.", correct: true, feedback: "ถูก วันที่ใช้ on" }
      - { id: b, text: "We eat dinner at 6 o'clock.", correct: true, feedback: "ถูก เวลาบนนาฬิกาใช้ at" }
      - { id: c, text: "It is cold at night.", correct: true, feedback: "ถูก at night เป็นคำยกเว้น" }
      - { id: d, text: "See you in Monday.", feedback: "วันใช้ on: See you on Monday." }
      - { id: e, text: "The picture is in the wall.", feedback: "ภาพแขวนแตะพื้นผิวผนัง ใช้ on the wall" }
      - { id: f, text: "The shop is between the bank or the school.", feedback: "between ใช้คู่กับ and ไม่ใช่ or" }
    hints:
      - "ตรวจ at, on, in กับเวลาแต่ละแบบ"
      - "on ใช้กับพื้นผิว และ between ใช้กับ and"
    solution: "ถูกคือ *Mother's Day in Thailand is on 12 August.*, *We eat dinner at 6 o'clock.*, *It is cold at night.*"
