    stem: "กล่องมวล $4\\ \\mathrm{kg}$ วางบนพื้นเอียงลื่นมุม $30^\\circ$ ผูกเชือกขนานกับพื้นเอียงข้ามรอกเบาที่ยอดพื้นเอียง ไปผูกกล่องมวล $3\\ \\mathrm{kg}$ ที่แขวนห้อยอยู่ ดังภาพ เมื่อปล่อยจากหยุดนิ่ง ระบบมีความเร่งขนาดเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย m/s² ทศนิยม 1 ตำแหน่ง)"
    figure: { src: incline-pulley.svg, alt: "พื้นเอียงทำมุม 30° กับพื้นราบ สูงขึ้นไปทางขวา มีกล่อง 4 kg วางบนพื้นเอียง เชือกขนานกับพื้นเอียงลากจากกล่องขึ้นไปพาดรอกที่ยอดพื้นเอียง แล้วห้อยลงในแนวดิ่งไปผูกกล่อง 3 kg ที่แขวนอยู่ข้างพื้นเอียง" }
    answer: { value: 1.4, tolerance: 0.02, unit: m/s² }
    hints:
      - "เทียบแรงที่ดึงระบบไปคนละทาง: น้ำหนักของกล่องที่แขวน กับองค์ประกอบของน้ำหนักกล่องบนพื้นเอียงตามแนวพื้น"
      - "แรงลัพธ์ของทั้งระบบคือผลต่างของสองแรงนั้น แรงตึงเชือกเป็นแรงภายในจึงตัดกัน"
      - "ใช้ $a = \\dfrac{\\text{แรงลัพธ์}}{\\text{มวลรวมทั้งสองกล่อง}}$"
