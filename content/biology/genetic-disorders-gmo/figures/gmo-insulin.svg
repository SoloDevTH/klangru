<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="sans-serif" font-size="14">
<title>ขั้นตอนการสร้างแบคทีเรียดัดแปรพันธุกรรมที่ผลิตอินซูลิน</title>
<rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
<rect x="20.0" y="60.0" width="125.0" height="170.0" rx="8" fill="#f7f9fc" stroke="#99a" stroke-width="1.5"/>
<text x="82.5" y="48.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">1. ตัดยีนอินซูลิน</text>
<text x="82.5" y="255.0" text-anchor="middle" font-size="12" fill="#222">จาก DNA ของคน</text>
<text x="82.5" y="272.0" text-anchor="middle" font-size="12" fill="#222">ด้วยเอนไซม์ตัดจำเพาะ</text>
<line x1="148.0" y1="145.0" x2="167.0" y2="145.0" stroke="#444" stroke-width="2"/>
<polygon points="167.0,145.0 158.7,148.5 158.7,141.5" fill="#444"/>
<rect x="170.0" y="60.0" width="125.0" height="170.0" rx="8" fill="#f7f9fc" stroke="#99a" stroke-width="1.5"/>
<text x="232.5" y="48.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">2. ตัดพลาสมิด</text>
<text x="232.5" y="255.0" text-anchor="middle" font-size="12" fill="#222">ของแบคทีเรีย</text>
<text x="232.5" y="272.0" text-anchor="middle" font-size="12" fill="#222">ด้วยเอนไซม์ชนิดเดียวกัน</text>
<line x1="298.0" y1="145.0" x2="317.0" y2="145.0" stroke="#444" stroke-width="2"/>
<polygon points="317.0,145.0 308.7,148.5 308.7,141.5" fill="#444"/>
<rect x="320.0" y="60.0" width="125.0" height="170.0" rx="8" fill="#f7f9fc" stroke="#99a" stroke-width="1.5"/>
<text x="382.5" y="48.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">3. เชื่อมต่อยีน</text>
<text x="382.5" y="255.0" text-anchor="middle" font-size="12" fill="#222">ด้วยเอนไซม์ไลเกส</text>
<text x="382.5" y="272.0" text-anchor="middle" font-size="12" fill="#222">ได้ DNA รีคอมบิแนนท์</text>
<line x1="448.0" y1="145.0" x2="467.0" y2="145.0" stroke="#444" stroke-width="2"/>
<polygon points="467.0,145.0 458.7,148.5 458.7,141.5" fill="#444"/>
<rect x="470.0" y="60.0" width="125.0" height="170.0" rx="8" fill="#f7f9fc" stroke="#99a" stroke-width="1.5"/>
<text x="532.5" y="48.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">4. ใส่เข้าแบคทีเรีย</text>
<text x="532.5" y="255.0" text-anchor="middle" font-size="12" fill="#222">แบคทีเรียรับพลาสมิด</text>
<text x="532.5" y="272.0" text-anchor="middle" font-size="12" fill="#222">ที่มียีนอินซูลิน</text>
<line x1="598.0" y1="145.0" x2="617.0" y2="145.0" stroke="#444" stroke-width="2"/>
<polygon points="617.0,145.0 608.7,148.5 608.7,141.5" fill="#444"/>
<rect x="620.0" y="60.0" width="125.0" height="170.0" rx="8" fill="#f7f9fc" stroke="#99a" stroke-width="1.5"/>
<text x="682.5" y="48.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">5. เลี้ยงให้เพิ่มจำนวน</text>
<text x="682.5" y="255.0" text-anchor="middle" font-size="12" fill="#222">แบคทีเรียสร้างอินซูลิน</text>
<text x="682.5" y="272.0" text-anchor="middle" font-size="12" fill="#222">นำไปทำให้บริสุทธิ์</text>
<line x1="32.0" y1="130.0" x2="133.0" y2="130.0" stroke="#2c4a7a" stroke-width="6"/>
<rect x="65.0" y="124.0" width="35.0" height="12.0" rx="0" fill="#d33" stroke="none" stroke-width="1.5"/>
<line x1="62.0" y1="112.0" x2="62.0" y2="148.0" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="103.0" y1="112.0" x2="103.0" y2="148.0" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="82.0" y="170.0" text-anchor="middle" font-size="12" fill="#b11">ยีนอินซูลิน</text>
<path d="M240.5,106 A35,35 0 1 1 224.5,106" fill="none" stroke="#2a7a3a" stroke-width="6"/>
<text x="232.5" y="205.0" text-anchor="middle" font-size="12" fill="#2a7a3a">พลาสมิดถูกตัดเปิด</text>
<circle cx="382.5" cy="140.0" r="35.0" fill="none" stroke="#2a7a3a" stroke-width="6"/>
<path d="M368.5,108 A35,35 0 0 1 396.5,108" fill="none" stroke="#d33" stroke-width="7"/>
<text x="382.5" y="200.0" text-anchor="middle" font-size="12" fill="#222">พลาสมิดรีคอมบิแนนท์</text>
<rect x="482.5" y="110.0" width="100.0" height="60.0" rx="30" fill="#fff6d8" stroke="#a07a00" stroke-width="1.5"/>
<circle cx="547.5" cy="140.0" r="13.0" fill="none" stroke="#2a7a3a" stroke-width="3"/>
<path d="M541.5,128 A13,13 0 0 1 553.5,128" fill="none" stroke="#d33" stroke-width="4"/>
<path d="M497.5,140 q10,-15 20,0 t20,0" fill="none" stroke="#555" stroke-width="2"/>
<text x="532.5" y="195.0" text-anchor="middle" font-size="11" fill="#222">DNA ของแบคทีเรีย</text>
<rect x="635.0" y="90.0" width="40.0" height="22.0" rx="11" fill="#fff6d8" stroke="#a07a00" stroke-width="1.5"/>
<rect x="680.0" y="95.0" width="40.0" height="22.0" rx="11" fill="#fff6d8" stroke="#a07a00" stroke-width="1.5"/>
<rect x="645.0" y="135.0" width="40.0" height="22.0" rx="11" fill="#fff6d8" stroke="#a07a00" stroke-width="1.5"/>
<rect x="690.0" y="140.0" width="40.0" height="22.0" rx="11" fill="#fff6d8" stroke="#a07a00" stroke-width="1.5"/>
<rect x="660.0" y="180.0" width="40.0" height="22.0" rx="11" fill="#fff6d8" stroke="#a07a00" stroke-width="1.5"/>
<rect x="710.0" y="185.0" width="40.0" height="22.0" rx="11" fill="#fff6d8" stroke="#a07a00" stroke-width="1.5"/>
<circle cx="635.0" cy="120.0" r="4.0" fill="#d33" stroke="none" stroke-width="1.5"/>
<circle cx="680.0" cy="125.0" r="4.0" fill="#d33" stroke="none" stroke-width="1.5"/>
<circle cx="725.0" cy="120.0" r="4.0" fill="#d33" stroke="none" stroke-width="1.5"/>
<circle cx="640.0" cy="170.0" r="4.0" fill="#d33" stroke="none" stroke-width="1.5"/>
<circle cx="708.0" cy="168.0" r="4.0" fill="#d33" stroke="none" stroke-width="1.5"/>
<circle cx="730.0" cy="150.0" r="4.0" fill="#d33" stroke="none" stroke-width="1.5"/>
<text x="682.5" y="222.0" text-anchor="middle" font-size="11" fill="#b11">จุดแดง = อินซูลิน</text>
<text x="380.0" y="310.0" text-anchor="middle" font-size="13" fill="#444">ยีนที่ใส่ (สีแดง) มาจากคน พลาสมิดและแบคทีเรียเป็นตัวพาและโรงงานผลิต</text>
</svg>