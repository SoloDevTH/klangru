id: chinese.grammar.progressive-bi
subject: chinese
title: { th: "กำลังทำด้วย 在/正在 และเปรียบเทียบด้วย 比", en: "Actions in progress with 在/正在 and comparisons with 比" }
summary: 在 และ 正在 หน้ากริยา (กับ 呢 ท้ายประโยค) บอกสิ่งที่กำลังทำ ส่วน 比 没有 และ 跟…一样 ใช้เปรียบเทียบว่ามากกว่า ไม่เท่า หรือเท่ากัน พร้อมบอกผลต่าง
difficulty: 3.5
minutes: 35
prerequisites: [chinese.grammar.word-order]
encompasses:
  - { id: chinese.grammar.word-order, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: bi-slots.svg
    alt: "ผังช่องประโยคเปรียบเทียบ หัวคอลัมน์ A · 比 · B · 更/还 · คุณศัพท์ · ผลต่าง ตัวอย่าง 曼谷 比 昆明 热 · 哥哥 比 我 高 五厘米 · 今天 比 昨天 更 热 · 这个 比 那个 贵 一点儿/得多 และข้อผิด 他比我很高 (หลัง 比 ห้ามใช้ 很 非常 ใช้ 更 หรือ 还 แทน) แถวล่าง A 没有 B 那么 คุณศัพท์: 昆明 没有 曼谷 那么 热 = คุนหมิงไม่ร้อนเท่ากรุงเทพฯ และ A 跟/和 B 一样 คุณศัพท์: 清迈 跟 曼谷 一样 热 = เชียงใหม่ร้อนเท่ากรุงเทพฯ"
    caption: "สิ่งที่มากกว่าอยู่หน้า 比 ผลต่างอยู่หลังคุณศัพท์ สิ่งที่น้อยกว่าอยู่หน้า 没有"
  - { type: check, problem: chinese.grammar.progressive-bi.p006, prompt: "ใช้ 很 หลัง 比 ได้ไหม" }
  - type: worked-example
    title: บอกว่ากำลังทำอะไรและปฏิเสธ
    problem: "เพื่อนโทรมาถาม 你在看电视吗？ ตอบว่า \"เปล่า ฉันไม่ได้ดูทีวี ฉันกำลังทำอาหารอยู่\""
    steps:
      - text: "ปฏิเสธการกระทำที่กำลังทำด้วย 没 วางหน้า 在: 没有，我没在看电视。"
        why: "不 ใช้กับความตั้งใจหรือนิสัย ส่วนสิ่งที่กำลังเกิดหรือไม่เกิดใช้ 没"
      - text: "บอกสิ่งที่กำลังทำ ใช้ 正在 (หรือ 在) + กริยา + 呢: 我正在做饭呢。"
    answer: "没有，我没在看电视，我正在做饭呢。"
  - type: worked-example
    title: เปรียบเทียบราคาค่าโดยสาร
    problem: "ข้อมูลสมมติ: นั่งแท็กซี่ไปสนามบินค่าโดยสาร 400 บาท นั่งรถไฟฟ้า 45 บาท เขียนว่า (ก) แท็กซี่แพงกว่ารถไฟฟ้ากี่บาท (ข) รถไฟฟ้าไม่แพงเท่าแท็กซี่"
    steps:
      - text: "หาผลต่าง: $400 - 45 = 355$ บาท"
      - text: "(ก) A 比 B + คุณศัพท์ + ผลต่าง: 坐出租车比坐轻轨贵三百五十五泰铢。 (轻轨 qīngguǐ = รถไฟฟ้ารางเบา)"
        why: "ผลต่างวางหลังคุณศัพท์ 贵 เสมอ"
      - text: "(ข) ฝ่ายที่น้อยกว่าอยู่หน้า 没有: 坐轻轨没有坐出租车那么贵。"
    answer: "坐出租车比坐轻轨贵三百五十五泰铢。坐轻轨没有坐出租车那么贵。"
  - { type: check, problem: chinese.grammar.progressive-bi.p009, prompt: "ปฏิเสธ 在 ใช้คำอะไร" }
glossary:
  - { term: "在 / 正在 zài / zhèngzài", definition: "วางหน้ากริยา บอกว่ากำลังทำอยู่ 正在 เน้นว่าตอนนี้เลย ปฏิเสธด้วย 没(在)" }
  - { term: "呢 ne", definition: "ท้ายประโยคบอกว่าการกระทำยังดำเนินอยู่ เช่น 我吃饭呢" }
  - { term: "比 bǐ", definition: "A 比 B + คุณศัพท์ = A …กว่า B ห้ามมี 很 ใช้ 更 หรือ 还 เพื่อเน้น" }
  - { term: "没有 méiyǒu (ในการเปรียบเทียบ)", definition: "A 没有 B (那么) + คุณศัพท์ = A ไม่…เท่า B" }
  - { term: "跟…一样 gēn…yíyàng", definition: "เท่ากัน เหมือนกัน ปฏิเสธเป็น 不一样" }
  - { term: "得多 / 多了 / 一点儿", definition: "วางหลังคุณศัพท์ในประโยค 比 บอกว่ามากกว่ามาก / มากกว่านิดหน่อย" }
flashcards:
  - { front: "แม่กำลังทำอาหารอยู่", back: "妈妈正在做饭呢。" }
  - { front: "กรุงเทพฯ ร้อนกว่าคุนหมิง", back: "曼谷比昆明热。" }
  - { front: "พี่ชายสูงกว่าฉัน 5 ซม.", back: "哥哥比我高五厘米。 (ผลต่างอยู่หลังคุณศัพท์)" }
  - { front: "คุนหมิงไม่ร้อนเท่ากรุงเทพฯ", back: "昆明没有曼谷(那么)热。" }
  - { front: "ฉันสูงเท่าพี่ชาย", back: "我跟哥哥一样高。" }
