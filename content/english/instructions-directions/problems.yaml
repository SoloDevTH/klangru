  - id: english.listening.instructions-directions.p017
    topics: [english.listening.instructions-directions]
    difficulty: 5
    type: mcq
    stem: "ฉลากยาตัวอย่างเขียนว่า *Take 2 tablets every 6 hours if needed. Do not take more than 8 tablets in 24 hours.* ข้อใดทำตามฉลากได้ถูกต้อง"
    choices:
      - { id: a, text: "Take 2 tablets at 8 a.m. and 2 more at 2 p.m.", correct: true, feedback: "ถูก 8 a.m. ถึง 2 p.m. ห่างกัน 6 ชั่วโมง และกินครั้งละ 2 เม็ด" }
      - { id: b, text: "Take 2 tablets at 8 a.m. and 2 more at 10 a.m.", feedback: "ห่างกันแค่ 2 ชั่วโมง ฉลากบอก every 6 hours" }
      - { id: c, text: "Take 8 tablets at once in the morning.", feedback: "8 เม็ดคือจำนวนสูงสุดใน 24 ชั่วโมง ไม่ใช่ขนาดต่อครั้ง ครั้งละ 2 เม็ด" }
      - { id: d, text: "Take 2 tablets every 6 hours, so 10 tablets a day is fine.", feedback: "ฉลากห้ามเกิน 8 เม็ดใน 24 ชั่วโมง" }
    hints:
      - "every 6 hours = ทุก 6 ชั่วโมง ไม่เร็วกว่านั้น"
      - "ตรวจทั้งระยะห่างระหว่างครั้ง และจำนวนสูงสุดต่อวัน"
    solution: "***Take 2 tablets at 8 a.m. and 2 more at 2 p.m.*** ห่างกัน 6 ชั่วโมง ครั้งละ 2 เม็ด ทั้งวันไม่เกิน 8 เม็ด ใช้ยาจริงตามที่แพทย์หรือเภสัชกรบอกเสมอ"
