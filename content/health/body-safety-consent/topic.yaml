id: health.sexuality.body-safety-consent
subject: health
title: { th: ร่างกายของฉัน การปฏิเสธ และการป้องกันการถูกล่วงละเมิดทางเพศ, en: "My body, saying no, and preventing sexual abuse" }
summary: ส่วนที่เป็นส่วนตัวและกฎชุดชั้นใน สัมผัสที่ปลอดภัยและไม่ปลอดภัย ความยินยอม ความลับที่ต้องบอก การลดโอกาสเสี่ยง ทักษะปฏิเสธ ออกไป บอก และสายด่วนช่วยเหลือ
difficulty: 2.5
minutes: 30
prerequisites: [health.family.friendships-relationships]
encompasses:
  - { id: health.family.friendships-relationships, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: กฎชุดชั้นใน
    src: underwear-rule.svg
    alt: "ภาพเด็กสองคนยืนหันหน้า วาดแบบเรียบง่าย คนซ้ายใส่ชุดว่ายน้ำแบบชิ้นเดียว คนขวาใส่กางเกงว่ายน้ำ หัวภาพเขียนว่า ส่วนที่ชุดว่ายน้ำหรือชุดชั้นในปิด คือส่วนที่เป็นส่วนตัว ใต้ภาพเขียนว่า ไม่มีใครควรแตะ มอง หรือถ่ายรูปส่วนที่เป็นส่วนตัวของเรา และเราก็ไม่แตะส่วนที่เป็นส่วนตัวของคนอื่น"
    caption: "ใช้ได้กับทุกคน ทั้งคนแปลกหน้า คนรู้จัก และญาติ"
  - type: worked-example
    title: ใช้ ปฏิเสธ ออกไป บอก
    problem: "ระหว่างรอผู้ปกครองหน้าโรงเรียน ชายคนหนึ่งที่มินรู้จักหน้าชวนมินไปดูลูกแมวที่หลังตึก และบอกว่าไม่ต้องบอกครู มินควรทำอย่างไร"
    steps:
      - text: "สังเกตสัญญาณเตือน: ชวนไปที่ลับตา และบอกให้ปิดบังผู้ใหญ่"
        why: "คนที่มีเจตนาดีจะไม่ขอให้เด็กปิดบังผู้ใหญ่"
      - text: "ปฏิเสธ: พูดเสียงดังชัดว่า \"ไม่ไป\" ไม่ต้องขอโทษหรืออธิบายยาว"
      - text: "ออกไป: เดินไปหาครูเวรหรือกลุ่มเพื่อนที่อยู่ใกล้ที่สุด"
      - text: "บอก: เล่าให้ครูฟังทันทีว่าเกิดอะไรขึ้น และเล่าให้ผู้ปกครองฟังเมื่อมารับ"
        why: "ครูช่วยดูแลความปลอดภัยของมินและเพื่อนคนอื่นได้"
    answer: "ปฏิเสธเสียงดัง ไปหาครูหรือเพื่อน แล้วบอกครูและผู้ปกครอง"
  - { type: check, problem: health.sexuality.body-safety-consent.p004, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: figure
    title: มือแห่งความปลอดภัย
    src: safety-hand.svg
    alt: "ภาพฝ่ามือห้านิ้ว แต่ละนิ้วมีชื่อผู้ใหญ่ที่ไว้ใจเป็นตัวอย่าง ได้แก่ แม่หรือพ่อ ครูประจำชั้น ยายหรือตา พี่ที่โตแล้ว และครูแนะแนว ด้านขวามีสามขั้น 1 ปฏิเสธ พูดว่าไม่ชัด ๆ เสียงดัง 2 ออกไป ไปยังที่ที่มีคนอื่นอยู่ 3 บอก บอกผู้ใหญ่ที่ไว้ใจทันที ถ้าไม่มีใครเชื่อ บอกคนต่อไป ด้านล่างมีเบอร์ สายด่วน 1300 สายเด็ก 1387 ตำรวจ 191"
    caption: "ลองวาดมือของตัวเองแล้วเขียนชื่อผู้ใหญ่ที่ไว้ใจห้าคน"
  - type: worked-example
    title: ความยินยอมในชีวิตประจำวัน
    problem: "ในวันกีฬาสี ปิ่นดีใจที่ทีมชนะและอยากกอดเพื่อนทุกคน แต่ต้นหลบตัวออก ปิ่นควรทำอย่างไร"
    steps:
      - text: "สังเกตว่าต้นหลบ แปลว่าต้นอาจไม่อยากให้กอด"
        why: "ความยินยอมดูได้ทั้งจากคำพูดและท่าทาง"
      - text: "ถามก่อน: \"ขอกอดได้ไหม\""
      - text: "ถ้าต้นตอบว่าไม่ ให้เคารพคำตอบ แล้วฉลองด้วยวิธีอื่น เช่น แปะมือหรือยิ้มให้กัน"
      - text: "ไม่โกรธหรือต่อว่า เพราะทุกคนมีสิทธิ์ตัดสินใจเรื่องร่างกายของตัวเอง"
    answer: "ถามก่อน ถ้าต้นไม่ยินยอมก็ไม่กอด และฉลองด้วยวิธีที่ต้นสบายใจ"
  - { type: check, problem: health.sexuality.body-safety-consent.p016 }
glossary:
  - { term: ส่วนที่เป็นส่วนตัว, definition: "ส่วนของร่างกายที่ชุดชั้นในหรือชุดว่ายน้ำปิด ได้แก่ อวัยวะเพศ ก้น และหน้าอก" }
  - { term: ความยินยอม, definition: "การตกลงด้วยความเต็มใจ ไม่ถูกบังคับ ข่มขู่ หรือหลอก และเปลี่ยนใจได้" }
  - { term: การล่วงละเมิดทางเพศ, definition: "การกระทำเรื่องเพศต่อผู้อื่นโดยเขาไม่ยินยอม เช่น แตะต้อง มอง หรือถ่ายรูปส่วนที่เป็นส่วนตัว การกระทำแบบนี้ต่อเด็กเป็นความผิดเสมอ" }
  - { term: ผู้ใหญ่ที่ไว้ใจ, definition: "ผู้ใหญ่ที่เราเล่าเรื่องได้อย่างสบายใจ และจะช่วยให้เราปลอดภัย เช่น พ่อแม่ ครู ญาติที่ดูแลเรา" }
flashcards:
  - { front: "กฎชุดชั้นในคืออะไร", back: "ไม่มีใครควรแตะ มอง หรือถ่ายรูปส่วนที่ชุดชั้นในปิดของเรา และเราไม่แตะของคนอื่น" }
  - { front: "เมื่อรู้สึกไม่ปลอดภัยทำอะไร 3 ขั้น", back: "ปฏิเสธ ออกไป บอกผู้ใหญ่ที่ไว้ใจ" }
  - { front: "ความลับแบบไหนต้องบอกผู้ใหญ่", back: "ความลับที่ทำให้กลัวหรือไม่สบายใจ หรือมีคนสั่งว่าห้ามบอกใคร" }
  - { front: "สายด่วนขอความช่วยเหลือสำหรับเด็ก", back: "1300 ศูนย์ช่วยเหลือสังคม และ 1387 สายเด็ก ตลอด 24 ชั่วโมง อันตรายเฉพาะหน้าโทร 191" }
  - { front: "ถ้ามีใครทำร้ายหรือล่วงละเมิดเด็ก เป็นความผิดของใคร", back: "ของคนที่ทำเสมอ ไม่ใช่ของเด็ก" }
