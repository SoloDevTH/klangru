<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="820" height="260" font-family="sans-serif" font-size="14">
  <title>กิ่งหลัก main มีคอมมิตเรียงกัน กิ่ง add-score แตกออกมาและมีคอมมิตสองครั้ง แล้วรวมกลับเข้า main ผ่านคำขอรวมหลังเพื่อนตรวจโค้ด</title>
  <defs></defs>
  <rect x="0" y="0" width="820" height="260" fill="#ffffff"/>
  <line x1="40.0" y1="80.0" x2="780.0" y2="80.0" stroke="#2563eb" stroke-width="3"/>
  <text x="40.0" y="24.0" font-size="15" text-anchor="start" fill="#2563eb" font-weight="bold" xml:space="preserve">main (กิ่งหลัก)</text>
  <circle cx="80.0" cy="80.0" r="13.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="80.0" y="58.0" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">เริ่มเกม</text>
  <circle cx="220.0" cy="80.0" r="13.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="220.0" y="58.0" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">เพิ่มหน้าแรก</text>
  <circle cx="470.0" cy="80.0" r="13.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="470.0" y="58.0" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">แก้ข้อความบนจอ</text>
  <circle cx="680.0" cy="80.0" r="13.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="680.0" y="58.0" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">รวม add-score</text>
  <path d="M220,80 C260,180 280,180 320,180" fill="none" stroke="#c2410c" stroke-width="3"/>
  <line x1="320.0" y1="180.0" x2="560.0" y2="180.0" stroke="#c2410c" stroke-width="3"/>
  <path d="M560,180 C620,180 640,80 680,80" fill="none" stroke="#c2410c" stroke-width="3"/>
  <text x="40.0" y="185.0" font-size="15" text-anchor="start" fill="#c2410c" font-weight="bold" xml:space="preserve">add-score</text>
  <text x="40.0" y="205.0" font-size="13" text-anchor="start" fill="#c2410c" xml:space="preserve">(กิ่งของต้น)</text>
  <circle cx="340.0" cy="180.0" r="13.0" fill="#ffedd5" stroke="#c2410c" stroke-width="2.5"/>
  <text x="340.0" y="210.0" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">เพิ่มตัวนับคะแนน</text>
  <circle cx="500.0" cy="180.0" r="13.0" fill="#ffedd5" stroke="#c2410c" stroke-width="2.5"/>
  <text x="500.0" y="210.0" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">แสดงคะแนนบนจอ</text>
  <rect x="570.0" y="205.0" width="230.0" height="44.0" rx="6" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="685.0" y="231.6" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">คำขอรวม: เพื่อนตรวจโค้ดก่อนรวม</text>
  <circle cx="80.0" cy="80.0" r="13.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
</svg>
