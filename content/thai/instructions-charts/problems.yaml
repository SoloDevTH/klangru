problems:
- id: thai.reading.instructions-charts.p001
  topics:
  - thai.reading.instructions-charts
  difficulty: 1
  type: mcq
  stem: ป้ายรูป **วงกลมขอบสีแดง มีขีดทับรูปบุหรี่** หมายความว่าอย่างไร
  choices:
  - id: a
    text: ห้ามสูบบุหรี่
    correct: true
    feedback: ถูก วงกลมขอบแดงมีขีดทับ หมายถึงห้ามทำสิ่งที่อยู่ในรูป
  - id: b
    text: ที่สูบบุหรี่อยู่ตรงนี้
    feedback: ถ้าเป็นที่สูบบุหรี่ จะไม่มีขีดทับ
  - id: c
    text: ระวังไฟไหม้
    feedback: ป้ายเตือนเป็นสามเหลี่ยมสีเหลือง
  - id: d
    text: ขายบุหรี่
    feedback: ป้ายนี้ไม่ใช่ป้ายร้านค้า
  hints:
  - สีแดงและขีดทับ บอกความหมายแบบใด
  - ดูตารางรูปทรงและสีของป้ายในบทเรียน
  solution: วงกลมขอบแดงมีขีดทับ = **ห้าม** ป้ายนี้จึงหมายถึง **ห้ามสูบบุหรี่**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.instructions-charts.p002
  topics:
  - thai.reading.instructions-charts
  difficulty: 1
  type: match
  stem: จับคู่รูปทรงและสีของป้ายกับความหมาย
  pairs:
  - left: วงกลมขอบแดง มีขีดทับ
    right: ห้ามทำ
  - left: สามเหลี่ยมสีเหลือง
    right: เตือนให้ระวัง
  - left: วงกลมสีน้ำเงิน
    right: ต้องทำตาม
  - left: สี่เหลี่ยมสีเขียว
    right: ปลอดภัย ทางออก
  hints:
  - สีแดงมักหมายถึงห้าม สีเหลืองหมายถึงระวัง
  - สีเขียวพบบนป้ายทางหนีไฟ
  solution: แดง = ห้าม · เหลือง = เตือน · น้ำเงิน = ต้องทำตาม · เขียว = ปลอดภัยและทางออก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.instructions-charts.p003
  topics:
  - thai.reading.instructions-charts
  difficulty: 2
  type: mcq
  stem: ข้อความใดเป็น **ข้อแนะนำ** ไม่ใช่คำสั่ง
  choices:
  - id: a
    text: ควรดื่มน้ำสะอาดวันละ 6 ถึง 8 แก้ว
    correct: true
    feedback: ถูก มีคำว่า ควร บอกสิ่งที่ทำแล้วดี แต่ไม่ได้บังคับ
  - id: b
    text: ห้ามใช้ลิฟต์ขณะเกิดเพลิงไหม้
    feedback: มีคำว่า ห้าม เป็นคำสั่ง
  - id: c
    text: ผู้ที่จะเข้าห้องปฏิบัติการต้องสวมแว่นนิรภัย
    feedback: มีคำว่า ต้อง เป็นคำสั่ง
  - id: d
    text: จงเขียนชื่อให้ครบทุกหน้า
    feedback: มีคำว่า จง เป็นคำสั่ง
  hints:
  - คำสั่งมักมีคำว่า ต้อง ห้าม จง
  - ข้อแนะนำมักมีคำว่า ควร
  solution: '**ควรดื่มน้ำสะอาด...** เป็นข้อแนะนำ ข้ออื่นมี ห้าม ต้อง จง จึงเป็นคำสั่ง'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.instructions-charts.p004
  topics:
  - thai.reading.instructions-charts
  difficulty: 2
  type: mcq
  stem: อ่านซองบะหมี่ในภาพ ต้องใส่ **ผงปรุงรส** เมื่อไร
  figure: &id001
    src: noodle-box.svg
    alt: 'ด้านหลังซองบะหมี่กึ่งสำเร็จรูปสมมุติ ตราต้นกล้า วิธีปรุง 1 ซอง: 1. ต้มน้ำ 400 มิลลิลิตร ให้เดือด 2. ใส่เส้นบะหมี่ ต้มต่ออีก 3 นาที 3. ปิดไฟ แล้วใส่ผงปรุงรสและน้ำมันปรุงรส 4. คนให้เข้ากัน พร้อมรับประทาน ข้อควรระวัง: ระวังน้ำร้อนลวก เด็กควรให้ผู้ใหญ่ช่วยยกหม้อ ควรเติมผักและไข่เพื่อให้ได้สารอาหารครบ'
  choices:
  - id: a
    text: หลังจากปิดไฟแล้ว
    correct: true
    feedback: ถูก ขั้นที่ 3 บอกให้ปิดไฟก่อน แล้วจึงใส่ผงปรุงรส
  - id: b
    text: พร้อมกับใส่เส้นบะหมี่
    feedback: ขั้นที่ 2 ใส่เฉพาะเส้น
  - id: c
    text: ตอนเริ่มต้มน้ำ
    feedback: ขั้นที่ 1 ต้มน้ำเปล่าให้เดือดก่อน
  - id: d
    text: ก่อนต้มน้ำ
    feedback: ไม่มีขั้นใดบอกอย่างนั้น
  hints:
  - หาขั้นที่พูดถึงผงปรุงรส
  - อ่านคำที่อยู่หน้าคำว่า ใส่ผงปรุงรส ในขั้นนั้น
  solution: 'ขั้นที่ 3: "**ปิดไฟ แล้ว** ใส่ผงปรุงรส" จึงใส่หลังปิดไฟ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.instructions-charts.p005
  topics:
  - thai.reading.instructions-charts
  difficulty: 2
  type: order
  stem: 'ข้อความ: "ก่อนอื่นล้างมือให้สะอาด จากนั้นเทดินลงกระถางให้เกือบเต็ม เมื่อเตรียมดินเสร็จแล้วจึงหยอดเมล็ดผักบุ้งลงหลุมตื้น ๆ สุดท้ายรดน้ำพอให้ดินชุ่ม" เรียงขั้นตอนให้ถูก'
  items:
  - ล้างมือให้สะอาด
  - เทดินลงกระถางให้เกือบเต็ม
  - หยอดเมล็ดผักบุ้งลงหลุมตื้น ๆ
  - รดน้ำพอให้ดินชุ่ม
  hints:
  - หาคำบอกลำดับ ก่อนอื่น จากนั้น เมื่อ...แล้ว สุดท้าย
  - คำว่า ก่อนอื่น บอกขั้นแรก
  solution: ก่อนอื่น → **ล้างมือ** · จากนั้น → **เทดิน** · เมื่อเตรียมดินเสร็จ → **หยอดเมล็ด** · สุดท้าย → **รดน้ำ**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.instructions-charts.p006
  topics:
  - thai.reading.instructions-charts
  difficulty: 3
  type: numeric
  stem: อ่านซองบะหมี่ในภาพ ถ้าต้มบะหมี่ **2 ซอง** พร้อมกันในหม้อเดียว ต้องใช้น้ำกี่มิลลิลิตร
  figure: *id001
  answer:
    value: 800
    unit: มิลลิลิตร
  misconceptions:
  - match: 400
    feedback: 400 มิลลิลิตรเป็นปริมาณของ 1 ซอง ต้องคูณ 2
  - match: 402
    feedback: นำจำนวนซองไปบวก ต้องคูณ
  hints:
  - วิธีปรุงเขียนไว้สำหรับกี่ซอง
  - ปริมาณน้ำของ 1 ซอง × จำนวนซอง
  solution: 1 ซองใช้น้ำ 400 มิลลิลิตร 2 ซองจึงใช้ $400 \times 2 = 800$ มิลลิลิตร
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.instructions-charts.p007
  topics:
  - thai.reading.instructions-charts
  difficulty: 3
  type: numeric
  stem: อ่านแผนภูมิรูปภาพในภาพ วัน **อังคาร** นักเรียนยืมหนังสือกี่เล่ม
  figure: &id002
    src: library-pictogram.svg
    alt: แผนภูมิรูปภาพ จำนวนหนังสือที่นักเรียนยืมจากห้องสมุด สัปดาห์ที่ 2 ของเดือน รูปหนังสือ 1 รูปแทน 4 เล่ม วันจันทร์ 5 รูป วันอังคาร 3 รูปครึ่ง วันพุธ 6 รูป วันพฤหัสบดี 2 รูปครึ่ง วันศุกร์ 4 รูปครึ่ง
  answer:
    value: 14
    unit: เล่ม
  misconceptions:
  - match: 3.5
    feedback: นับจำนวนรูปแล้วตอบเลย ต้องคูณด้วย 4 เพราะ 1 รูปแทน 4 เล่ม
  - match: 16
    feedback: นับรูปครึ่งเป็นรูปเต็ม ได้ 4 รูป ครึ่งรูปแทน 2 เล่ม
  - match: 12
    feedback: ไม่นับรูปครึ่ง
  hints:
  - ดูคำอธิบายสัญลักษณ์ว่า 1 รูปแทนกี่เล่ม
  - วันอังคารมีกี่รูป รูปครึ่งแทนครึ่งหนึ่งของ 4
  solution: วันอังคารมี 3 รูปครึ่ง $3.5 \times 4 = 14$ เล่ม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.instructions-charts.p008
  topics:
  - thai.reading.instructions-charts
  difficulty: 3
  type: mcq
  stem: อ่านแผนผังในภาพ **ห้องสมุด** อยู่ทิศใดของสนาม
  figure: &id003
    src: school-plan.svg
    alt: แผนผังโรงเรียนสมมุติ ลูกศรทิศเหนือชี้ขึ้นด้านบนของภาพ สนามอยู่ตรงกลาง อาคารเรียน 1 อยู่ด้านบนของสนาม โรงอาหารอยู่ด้านล่างของสนาม ห้องสมุดอยู่ด้านซ้ายของสนาม อาคารเรียน 2 อยู่ด้านขวาของสนาม ห้องพยาบาลอยู่มุมขวาล่าง ถัดจากโรงอาหาร ประตูโรงเรียนอยู่ขอบล่างของภาพ ใต้โรงอาหาร
  choices:
  - id: a
    text: ทิศตะวันตก
    correct: true
    feedback: ถูก ลูกศรเหนือชี้ขึ้น ด้านซ้ายจึงเป็นทิศตะวันตก
  - id: b
    text: ทิศตะวันออก
    feedback: ด้านขวาของภาพเป็นทิศตะวันออก ที่นั่นคืออาคารเรียน 2
  - id: c
    text: ทิศเหนือ
    feedback: ทิศเหนือของสนามคืออาคารเรียน 1
  - id: d
    text: ทิศใต้
    feedback: ทิศใต้ของสนามคือโรงอาหาร
  hints:
  - หาลูกศรทิศเหนือก่อน
  - หันหน้าไปทางทิศเหนือ มือซ้ายคือทิศตะวันตก
  solution: ลูกศรเหนือชี้ขึ้น ด้านซ้ายจึงเป็นทิศตะวันตก ห้องสมุดอยู่ **ทิศตะวันตก** ของสนาม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.instructions-charts.p009
  topics:
  - thai.reading.instructions-charts
  difficulty: 3
  type: mcq
  stem: อ่านตารางในภาพ พัดลมเปิดแล้วใบพัดหมุน แต่ **มีเสียงดัง** ควรทำอย่างไรเป็นอย่างแรก
  figure:
    src: fan-manual.svg
    alt: 'ตารางแก้ปัญหาเบื้องต้นจากคู่มือพัดลมตั้งโต๊ะสมมุติ 3 คอลัมน์ อาการ สาเหตุ วิธีแก้ แถว 1: ไฟไม่ติด ใบพัดไม่หมุน สาเหตุ ปลั๊กหลวม วิธีแก้ เสียบปลั๊กให้แน่น แถว 2: ใบพัดหมุน แต่มีเสียงดัง สาเหตุ ฝาครอบใบพัดหลวม วิธีแก้ ถอดปลั๊ก แล้วขันฝาครอบให้แน่น แถว 3: หัวพัดลมไม่ส่าย สาเหตุ ปุ่มส่ายไม่ได้กด วิธีแก้ กดปุ่มส่ายที่ด้านบนลง แถว 4: ทำแล้วยังไม่หาย สาเหตุ ชิ้นส่วนภายในเสีย วิธีแก้ หยุดใช้ ส่งศูนย์บริการ คำเตือน: ถอดปลั๊กทุกครั้งก่อนทำความสะอาดหรือถอดชิ้นส่วน อย่าสอดนิ้วหรือสิ่งของเข้าไปในฝาครอบขณะใบพัดหมุน'
  choices:
  - id: a
    text: ถอดปลั๊กก่อน แล้วขันฝาครอบใบพัดให้แน่น
    correct: true
    feedback: ถูก ตรงกับแถวที่ 2 และคำเตือนให้ถอดปลั๊กก่อนถอดหรือขันชิ้นส่วน
  - id: b
    text: เสียบปลั๊กให้แน่น
    feedback: เป็นวิธีแก้ของอาการไฟไม่ติด
  - id: c
    text: กดปุ่มส่าย
    feedback: เป็นวิธีแก้ของอาการหัวไม่ส่าย
  - id: d
    text: ขันฝาครอบทั้งที่ใบพัดยังหมุน
    feedback: ผิดคำเตือน อันตรายมาก
  hints:
  - หาแถวที่อาการตรงกัน
  - อ่านคำเตือนในกรอบสีแดงประกอบด้วย
  solution: อาการ "ใบพัดหมุน แต่มีเสียงดัง" → **ถอดปลั๊ก แล้วขันฝาครอบให้แน่น**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.instructions-charts.p010
  topics:
  - thai.reading.instructions-charts
  difficulty: 4
  type: numeric
  stem: 'แผนที่หมู่บ้านใช้มาตราส่วน 1 เซนติเมตร : 50 เมตร วัดระยะจากบ้านของต้นถึงวัดบนแผนที่ได้ 6 เซนติเมตร ระยะจริงกี่เมตร'
  answer:
    value: 300
    unit: เมตร
  misconceptions:
  - match: 56
    feedback: นำตัวเลขมาบวกกัน ต้องคูณ
  - match: 12
    feedback: หาร 50 ด้วยระยะบนแผนที่ ต้องคูณระยะบนแผนที่กับ 50
  hints:
  - 1 เซนติเมตรบนแผนที่เท่ากับระยะจริงเท่าไร
  - ระยะจริง = ระยะบนแผนที่ × 50
  solution: $6 \times 50 = 300$ เมตร
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.instructions-charts.p011
  topics:
  - thai.reading.instructions-charts
  difficulty: 4
  type: numeric
  stem: อ่านแผนภูมิรูปภาพในภาพ วันที่ยืมหนังสือ **มากที่สุด** ยืมมากกว่าวันที่ยืม **น้อยที่สุด** กี่เล่ม
  figure: *id002
  answer:
    value: 14
    unit: เล่ม
  misconceptions:
  - match: 3.5
    feedback: หาผลต่างของจำนวนรูปแล้วไม่คูณ 4
  - match: 34
    feedback: นำสองวันมาบวกกัน ต้องลบ
  hints:
  - หาวันที่มีรูปมากที่สุดและน้อยที่สุด
  - แปลงเป็นจำนวนเล่มก่อน แล้วลบกัน
  solution: มากที่สุดวันพุธ $6 \times 4 = 24$ เล่ม น้อยที่สุดวันพฤหัสบดี $2.5 \times 4 = 10$ เล่ม ต่างกัน $24 - 10 = 14$ เล่ม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.instructions-charts.p012
  topics:
  - thai.reading.instructions-charts
  difficulty: 4
  type: match
  stem: จับคู่ข้อมูลกับภาพที่เหมาะที่สุด
  pairs:
  - left: ตำแหน่งห้องต่าง ๆ ในโรงเรียน
    right: แผนผัง
  - left: จำนวนนักเรียนแต่ละชั้นเปรียบเทียบกัน
    right: แผนภูมิแท่ง
  - left: อุณหภูมิที่เปลี่ยนไปในแต่ละเดือน
    right: กราฟเส้น
  - left: ขั้นตอนการเกิดฝน
    right: แผนภาพ
  hints:
  - ถามว่าข้อมูลเป็นตำแหน่ง ตัวเลขเปรียบเทียบ การเปลี่ยนตามเวลา หรือขั้นตอน
  - การเปลี่ยนแปลงตามเวลาเห็นชัดเมื่อจุดต่อกันเป็นเส้น
  solution: ตำแหน่ง → แผนผัง · เปรียบเทียบจำนวน → แผนภูมิแท่ง · เปลี่ยนตามเวลา → กราฟเส้น · ขั้นตอน → แผนภาพ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.instructions-charts.p013
