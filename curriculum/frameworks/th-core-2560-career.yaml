# กลุ่มสาระการเรียนรู้การงานอาชีพ ตามหลักสูตรแกนกลางการศึกษาขั้นพื้นฐาน พุทธศักราช 2551 (หลังการปรับปรุง พ.ศ. 2560-2561)
#
# ที่มาของฉบับปรับปรุง (ตรวจเมื่อ 2026-10-24)
# - คำสั่ง สพฐ. ที่ 921/2561 (3 พฤษภาคม 2561) ยกเลิกมาตรฐานและตัวชี้วัด สาระที่ 2 การออกแบบและเทคโนโลยี และสาระที่ 3
#   เทคโนโลยีสารสนเทศและการสื่อสาร (ย้ายไปเป็นสาระเทคโนโลยีในวิทยาศาสตร์ตามฉบับปรับปรุง 2560) คงเหลือ 2 สาระ คือ
#   สาระที่ 1 การดำรงชีวิตและครอบครัว และสาระที่ 4 การอาชีพ โดยเปลี่ยนชื่อ "สาระที่ 4 การอาชีพ" เป็น "สาระที่ 2 การอาชีพ"
#   และตั้งแต่ปีการศึกษา 2563 เปลี่ยนชื่อกลุ่มสาระ "การงานอาชีพและเทคโนโลยี" เป็น "การงานอาชีพ"
# - คำสั่งไม่ได้แก้ข้อความมาตรฐานหรือตัวชี้วัด ข้อความในไฟล์นี้จึงคัดจากเล่มหลักสูตร 2551 (มาตรฐาน ง 1.1 และ ง 4.1)
#   ส่วนรหัส ง 4.1 เปลี่ยนเป็น ง 2.1 ตามการเปลี่ยนชื่อสาระ (เอกสาร สพฐ. เรื่องตัวชี้วัดระหว่างทางและปลายทาง ปี 2566
#   ใช้รหัส ง 2.1 ป.4/1 ... ง 2.1 ม.4-6/4 แบบเดียวกัน และนับรวมได้ 54 ตัวชี้วัดเท่ากับไฟล์นี้)
# - ไม่พบเอกสารฉบับรวมที่ สพฐ. พิมพ์ใหม่ทั้งกลุ่มสาระในชื่อ "ฉบับปรับปรุง พ.ศ. 2560" (academic.obec.go.th ตอบ HTTP 403 จากเครือข่ายนี้)
# - ไฟล์ id ใช้คำว่า 2560 ตามชื่อชุดฉบับปรับปรุง แม้คำสั่งที่เปลี่ยนกลุ่มสาระนี้ออกในปี 2561
#
# วิธีคัดข้อความ
# - ตาราง "ตัวชี้วัดชั้นปี" ในเล่มหลักสูตร หน้า 210-211 (ง 1.1) และ 218-219 (ง 4.1) (หน้า PDF 219-220, 227-228)
#   มาตรฐานใช้ข้อความหน้า "สาระและมาตรฐานการเรียนรู้" หน้า 19 (หน้า PDF 27)
# - ถอดฟอนต์ MacThai และแบ่งช่องตารางเหมือนไฟล์ th-core-2551-social-economics แล้วตรวจทานทั้ง 54 ตัวชี้วัดกับภาพหน้า PDF
#   (ง 2.1 ป.5/1 และ ง 1.1 ป.6/3 แก้ลำดับสระที่ pdfminer สลับตามภาพ)
# - รอยต่อบรรทัดตัดสินจาก "ตัวชี้วัดและสาระการเรียนรู้แกนกลาง กลุ่มสาระการเรียนรู้การงานอาชีพและเทคโนโลยี" ของ สพฐ.
#   (และเอกสาร สพฐ. ปี 2566 เป็นหลักฐานรอง) จุดที่ใช้เอกสารเหล่านี้ตัดสินหรือถ้อยคำต่างกันบันทึกใน note
# - ง 2.1 ม.4-6/1 คงข้อความที่น่าจะพิมพ์ผิดในเล่มไว้ตามต้นฉบับ (ดู note)
# - จำนวน: ง 1.1 36 ตัวชี้วัด ง 2.1 18 ตัวชี้วัด รวม 54
