id: math.functions.quadratic
subject: math
title: { th: ฟังก์ชันกำลังสอง, en: Quadratic functions }
summary: วาดและอ่านกราฟพาราโบลาของฟังก์ชันกำลังสอง หาจุดยอด แกนสมมาตร ค่าสูงสุดหรือต่ำสุด แล้วใช้แก้โจทย์หากำไรมากที่สุดหรือพื้นที่มากที่สุด
difficulty: 5.5
minutes: 35
prerequisites: [math.functions.functions-intro, math.algebra.quadratic-eq]
encompasses:
  - { id: math.functions.functions-intro, weight: 0.3 }
  - { id: math.algebra.quadratic-eq, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: parabola-features.svg
    alt: "กราฟพาราโบลาหงาย y = x² − 2x − 3 บนตาราง จุดยอดอยู่ที่ (1, −4) แกนสมมาตรเป็นเส้นประแนวตั้ง x = 1 กราฟตัดแกน x ที่ (−1, 0) และ (3, 0) และตัดแกน y ที่ (0, −3)"
    caption: "จุดตัดแกน $x$ ทั้งสองอยู่ห่างแกนสมมาตรเท่ากัน ($1 - (-1) = 3 - 1 = 2$)"
  - type: worked-example
    title: อ่านลักษณะสำคัญของพาราโบลาจากสมการ
    problem: "หาจุดยอด แกนสมมาตร จุดตัดแกน $y$ จุดตัดแกน $x$ และเรนจ์ของ $y = x^2 - 2x - 3$"
    steps:
      - text: "$a = 1 > 0$ พาราโบลาหงาย มีค่าต่ำสุด"
      - text: "แกนสมมาตร $x = -\\dfrac{-2}{2(1)} = 1$"
      - text: "แทน $x = 1$: $y = 1 - 2 - 3 = -4$ จุดยอดคือ $(1, -4)$"
        why: "จุดยอดอยู่บนแกนสมมาตรเสมอ จึงใช้ค่า $x$ ของแกนสมมาตรหาพิกัด $y$"
      - text: "จุดตัดแกน $y$: แทน $x = 0$ ได้ $y = -3$ คือ $(0, -3)$"
      - text: "จุดตัดแกน $x$: แก้ $x^2 - 2x - 3 = (x + 1)(x - 3) = 0$ ได้ $(-1, 0)$ และ $(3, 0)$"
        why: "บนแกน $x$ ค่า $y$ เป็นศูนย์ จึงกลายเป็นการแก้สมการกำลังสอง"
      - text: "พาราโบลาหงาย ค่าต่ำสุดคือ $-4$ เรนจ์จึงเป็น $y \\ge -4$"
    answer: "จุดยอด $(1, -4)$ แกนสมมาตร $x = 1$ ตัดแกน $y$ ที่ $(0, -3)$ ตัดแกน $x$ ที่ $(-1, 0)$ และ $(3, 0)$ เรนจ์ $y \\ge -4$"
  - { type: check, problem: math.qf.p002, prompt: "อ่านจุดยอดจากรูปจุดยอด ระวังเครื่องหมาย" }
  - type: worked-example
    title: ทำกำลังสองสมบูรณ์เพื่อหาค่าสูงสุด
    problem: "เขียน $y = -2x^2 + 12x - 10$ ในรูปจุดยอด แล้วบอกค่าสูงสุด ช่วงที่ฟังก์ชันเพิ่ม และเรนจ์"
    steps:
      - text: "ดึง $-2$ ออกจากสองพจน์แรก: $y = -2(x^2 - 6x) - 10$"
        why: "ในวงเล็บต้องมีสัมประสิทธิ์ของ $x^2$ เป็น 1 จึงจะเติมกำลังสองสมบูรณ์ได้"
      - text: "เติมและลบ $9$ ในวงเล็บ: $y = -2(x^2 - 6x + 9 - 9) - 10$"
        why: "ครึ่งหนึ่งของ $-6$ คือ $-3$ และ $(-3)^2 = 9$"
      - text: "$y = -2(x - 3)^2 + 18 - 10 = -2(x - 3)^2 + 8$"
        why: "$-9$ ที่อยู่ในวงเล็บถูกคูณด้วย $-2$ เมื่อนำออกมาจึงกลายเป็น $+18$"
      - text: "$a = -2 < 0$ พาราโบลาคว่ำ ค่าสูงสุดคือ $8$ เมื่อ $x = 3$"
      - text: "พาราโบลาคว่ำเพิ่มขึ้นทางซ้ายของจุดยอด คือเมื่อ $x < 3$ และเรนจ์คือ $y \\le 8$"
      - text: "ตรวจ: แทน $x = 3$ ในรูปเดิม $-2(9) + 36 - 10 = 8$ ✓"
    answer: "$y = -2(x - 3)^2 + 8$ ค่าสูงสุด $8$ ที่ $x = 3$ ฟังก์ชันเพิ่มเมื่อ $x < 3$ เรนจ์ $y \\le 8$"
  - { type: check, problem: math.qf.p006, prompt: "หาค่าต่ำสุดด้วยวิธีที่ถนัด" }
  - type: interactive
    title: ลองเปลี่ยน a, h, k แล้วดูพาราโบลา
    caption: "กราฟคือ y = a(x − h)² + k สังเกตว่า a เป็นบวกพาราโบลาหงาย เป็นลบพาราโบลาคว่ำ ส่วน h และ k เลื่อนจุดยอดไปที่ (h, k) โดยรูปร่างไม่เปลี่ยน"
    widget:
      kind: function-plot
      functions: ["a\\cdot(x-h)^2+k"]
      sliders:
        - { name: a, min: -3, max: 3, step: 0.5, value: 1, label: ความกว้างและทิศ }
        - { name: h, min: -4, max: 4, step: 1, value: 0, label: เลื่อนซ้ายขวา }
        - { name: k, min: -4, max: 4, step: 1, value: 0, label: เลื่อนขึ้นลง }
      x: [-6, 6]
      y: [-6, 6]
  - type: simulation
    title: กราฟฟังก์ชันกำลังสอง (PhET Graphing Quadratics)
    url: https://phet.colorado.edu/en/simulations/graphing-quadratics
    provider: phet
    note: เปิดโหมด Vertex Form แล้วเลื่อนค่า a, h, k ดูว่าจุดยอดและแกนสมมาตรเปลี่ยนไปอย่างไร จากนั้นเปิดโหมด Standard Form แล้วเทียบตำแหน่งแกนสมมาตรกับสูตร x = −b/2a
glossary:
  - { term: ฟังก์ชันกำลังสอง, definition: "ฟังก์ชันรูป $f(x) = ax^2 + bx + c$ เมื่อ $a \\ne 0$" }
  - { term: พาราโบลา, definition: "กราฟของฟังก์ชันกำลังสอง มีรูปโค้งคล้ายตัว U หงายหรือคว่ำ" }
  - { term: จุดยอด, definition: "จุดต่ำสุดของพาราโบลาหงาย หรือจุดสูงสุดของพาราโบลาคว่ำ" }
  - { term: แกนสมมาตร, definition: "เส้นตั้งที่ผ่านจุดยอด แบ่งพาราโบลาเป็นสองซีกที่เหมือนกันเหมือนภาพในกระจก" }
flashcards:
  - { front: "แกนสมมาตรของ $y = ax^2 + bx + c$", back: "$x = -\\dfrac{b}{2a}$" }
  - { front: "จุดยอดของ $y = a(x - h)^2 + k$", back: "$(h, k)$ ระวังเครื่องหมาย: $(x + 2)^2$ หมายถึง $h = -2$" }
  - { front: "รู้ได้อย่างไรว่าพาราโบลามีค่าสูงสุดหรือต่ำสุด", back: "$a > 0$ พาราโบลาหงาย มีค่าต่ำสุด, $a < 0$ พาราโบลาคว่ำ มีค่าสูงสุด" }
  - { front: "หาค่าสูงสุดหรือต่ำสุดของ $y = ax^2 + bx + c$", back: "หา $x = -\\tfrac{b}{2a}$ แล้วแทนกลับในฟังก์ชัน ค่า $y$ ที่ได้คือคำตอบ" }
