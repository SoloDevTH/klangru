id: english.grammar.prepositions
subject: english
title: { th: "บุพบทบอกตำแหน่งและเวลา", en: "Prepositions of place and time" }
summary: บอกตำแหน่งด้วย in on under next to between in front of behind ใช้ at on in กับเวลา วัน เดือน ปี อ่านแผนที่และบอกทางง่าย ๆ
difficulty: 2
minutes: 35
prerequisites: [english.grammar.be-have-there, english.grammar.present-simple]
encompasses:
  - { id: english.grammar.be-have-there, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: positions.svg
    alt: "ภาพเจ็ดช่องแสดงบุพบทบอกตำแหน่ง in ลูกบอลอยู่ในกล่อง on ลูกบอลอยู่บนกล่อง under ลูกบอลอยู่ใต้โต๊ะ next to ลูกบอลอยู่ข้างกล่องติดกัน between ลูกบอลอยู่ระหว่างกล่องสองใบ in front of ลูกบอลอยู่ข้างหน้ากล่อง behind ลูกบอลโผล่จากข้างหลังกล่อง"
    caption: "บุพบทบอกว่าลูกบอลอยู่ตรงไหนเทียบกับกล่อง"
  - type: figure
    src: time-triangle.svg
    alt: "ภาพสามชั้น ชั้นบนสุดซึ่งเจาะจงที่สุดคือ at ใช้กับเวลา เช่น at 8 o'clock at noon at night ชั้นกลางคือ on ใช้กับวันและวันที่ เช่น on Monday on 13 April on my birthday ชั้นล่างซึ่งกว้างที่สุดคือ in ใช้กับเดือน ปี ฤดู และช่วงของวัน เช่น in April in 2025 in the rainy season in the morning"
    caption: "at → on → in จากจุดเวลาที่เจาะจงไปถึงช่วงเวลาที่กว้างขึ้น"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.grammar.prepositions.p005, prompt: "May เป็นวันหรือเดือน" }
  - type: figure
    src: street-map.svg
    alt: "แผนที่ถนนสองสายตัดกันเป็นสี่แยก ถนน Park Street วิ่งจากล่างขึ้นบน ถนน River Road วิ่งซ้ายไปขวา จุด You are here อยู่ล่างสุดของ Park Street หันหน้าขึ้นด้านบน ระหว่างทางก่อนถึงสี่แยก ฝั่งซ้ายของ Park Street มี Shop (ใกล้จุดเริ่ม) แล้วจึงเป็น School ฝั่งขวามี Bank อยู่ตรงข้าม School ด้านล่างของ River Road ทางซ้ายของ School มี Market อยู่ติดกัน ทางขวาของ Bank มี Post office อยู่ติดกัน ด้านบนของ River Road ฝั่งซ้ายมี Temple ฝั่งขวามี Hospital สุดถนน Park Street ด้านบนคือ Park"
    caption: "แผนที่สำหรับฝึกบอกทาง เริ่มเดินจาก You are here"
  - type: worked-example
    title: บอกทางไปที่ทำการไปรษณีย์
    problem: "ดูแผนที่ด้านบน เพื่อนยืนที่ You are here แล้วถามว่า *Excuse me. Where is the post office?* ตอบเป็นทางเดิน"
    steps:
      - text: "จากจุดเริ่ม เดินขึ้นไปถึงสี่แยก: *Go straight.*"
      - text: "ที่ทำการไปรษณีย์อยู่ทางขวาของแผนที่ จึงเลี้ยวขวาที่สี่แยก: *Turn right at the crossroads.*"
      - text: "หลังเลี้ยวขวา เราหันหน้าไปทางขวาของแผนที่ ด้านล่างของถนนจึงเป็นขวามือ: *It's on your right.*"
        why: "ซ้ายขวาคิดจากทิศที่เราหันหน้า ไม่ใช่ทิศบนแผนที่"
      - text: "บอกที่สังเกตเพิ่ม: *It's next to the bank.*"
    answer: "*Go straight. Turn right at the crossroads. It's on your right, next to the bank.*"
  - { type: check, problem: english.grammar.prepositions.p011, prompt: "night ใช้บุพบทคำไหน" }
  - type: worked-example
    title: เขียนตารางกิจกรรม
    problem: "เขียนเป็นภาษาอังกฤษ: ชมรมว่ายน้ำ ทุกวันพุธ เวลา 4 โมงเย็น และแข่งว่ายน้ำในเดือนธันวาคม"
    steps:
      - text: "วันในสัปดาห์ใช้ on แต่มี every นำหน้า ไม่ต้องใส่บุพบท: *every Wednesday*"
        why: "หน้า every, next, this ไม่ใส่ on/in/at"
      - text: "เวลาบนนาฬิกาใช้ at: *at 4 o'clock* (หรือ *at 4 p.m.*)"
      - text: "เดือนใช้ in: *in December*"
      - text: "รวมเป็นประโยค: *Swimming club is every Wednesday at 4 p.m. The swimming race is in December.*"
    answer: "*Swimming club is every Wednesday at 4 p.m. The swimming race is in December.*"
glossary:
  - { term: preposition (บุพบท), definition: "คำที่วางหน้าคำนามเพื่อบอกตำแหน่ง เวลา หรือทิศทาง เช่น in, on, at, under" }
  - { term: between ... and ..., definition: "ระหว่างสองสิ่ง ใช้คู่กับ and เสมอ" }
  - { term: opposite, definition: "ตรงข้าม อยู่คนละฝั่งถนนหันหน้าเข้าหากัน" }
  - { term: crossroads, definition: "สี่แยก จุดที่ถนนสองสายตัดกัน" }
  - { term: at / on / in (เวลา), definition: "at กับเวลาบนนาฬิกา on กับวันและวันที่ in กับเดือน ปี ฤดู และช่วงของวัน" }
flashcards:
  - { front: "___ Monday / ___ May / ___ 7 o'clock", back: "on Monday / in May / at 7 o'clock" }
  - { front: "___ the morning / ___ night", back: "in the morning / at night" }
  - { front: "ข้างหน้า / ข้าง ๆ (ภาษาอังกฤษ)", back: "in front of / next to (อย่าลืม of และ to)" }
  - { front: "ระหว่างธนาคาร ___ โรงเรียน", back: "between the bank and the school" }
  - { front: "เลี้ยวซ้ายที่สี่แยก", back: "Turn left at the crossroads." }
