id: physics.dynamics.forces
subject: physics
title: { th: แรงและแผนภาพแรง, en: Forces and free-body diagrams }
summary: รู้จักแรงในฐานะการดึงหรือผลัก หน่วยนิวตัน ชนิดของแรงที่พบบ่อย การวาดแผนภาพแรง และการหาแรงลัพธ์ของแรงที่อยู่ในแนวเดียวกัน
difficulty: 3
minutes: 30
prerequisites: [physics.units.si, math.geometry.pythagoras, physics.dynamics.forces-intro]
encompasses:
  - { id: physics.units.si, weight: 0.2 }
  - { id: math.number.integers, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: fbd-box.svg
    alt: "แผนภาพแรงของลังที่ถูกดึงบนพื้น น้ำหนัก W = 200 N ชี้ลง แรงตั้งฉาก N = 200 N ชี้ขึ้นยาวเท่ากัน แรงตึงเชือก T = 120 N ชี้ไปทางขวา แรงเสียดทาน f = 90 N ที่ผิวพื้นชี้ไปทางซ้าย ลูกศรยาวตามสัดส่วนของขนาดแรง"
    caption: "แผนภาพแรง: ทุกแรงที่กระทำต่อลัง ความยาวลูกศรตามขนาดของแรง"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: แรงตึงโซ่ที่แขวนโคมไฟ
    problem: "โคมไฟในศาลาวัดหนัก $40\\ \\mathrm{N}$ แขวนนิ่งด้วยโซ่เส้นเดียว วาดแผนภาพแรงของโคมไฟและหาแรงตึงในโซ่"
    figure:
      src: fbd-lamp.svg
      alt: "ซ้ายคือภาพโคมไฟแขวนจากเพดานด้วยโซ่ ขวาคือแผนภาพแรงของโคมไฟ เป็นจุดที่มีลูกศรแรงตึง T ชี้ขึ้นและน้ำหนัก W = 40 N ชี้ลง ลูกศรสองอันยาวเท่ากัน"
    steps:
      - text: "แยกโคมไฟออกมาเป็นจุด วาดน้ำหนัก $40\\ \\mathrm{N}$ ชี้ลง"
      - text: "สิ่งที่แตะโคมไฟมีโซ่เท่านั้น โซ่ให้แรงตึง $T$ ชี้ขึ้นตามแนวโซ่"
        why: "อากาศรอบโคมไฟนิ่ง จึงไม่มีแรงต้านอากาศ และเพดานไม่ได้แตะโคมไฟโดยตรง"
      - text: "โคมไฟนิ่ง แรงลัพธ์เป็นศูนย์: $T - 40 = 0$ ได้ $T = 40\\ \\mathrm{N}$"
        why: "วัตถุที่อยู่นิ่งไม่ได้แปลว่าไม่มีแรง แต่แรงที่มีหักล้างกันพอดี"
    answer: "แรงตึงในโซ่ $40\\ \\mathrm{N}$ ชี้ขึ้น เท่ากับน้ำหนักของโคมไฟ"
  - { type: check, problem: phy.force.p014, prompt: "อ่านแผนภาพแรงแล้วหาแรงลัพธ์" }
  - type: worked-example
    title: แรงลัพธ์ของแรงสองแรงที่ตั้งฉากกัน
    problem: "เรือลำหนึ่งถูกเชือกสองเส้นดึง เส้นหนึ่งดึงไปทางตะวันออก $300\\ \\mathrm{N}$ อีกเส้นดึงไปทางเหนือ $400\\ \\mathrm{N}$ แรงลัพธ์มีขนาดเท่าใดและชี้ไปทางไหน"
    figure:
      src: perp-forces.svg
      alt: "มองจากด้านบน เรืออยู่ที่มุมล่างซ้าย ลูกศร 300 N ชี้ไปทางตะวันออก ลูกศร 400 N ชี้ไปทางเหนือ เส้นประประกอบเป็นสี่เหลี่ยมผืนผ้า และลูกศรแรงลัพธ์ลากตามเส้นทแยงไปทางตะวันออกเฉียงเหนือ วาดตามมาตราส่วน"
    steps:
      - text: "สองแรงตั้งฉากกัน จึงบวกตรง ๆ เป็น $700\\ \\mathrm{N}$ ไม่ได้"
        why: "แรงที่ดึงไปคนละทิศช่วยกันได้ไม่เต็มที่ ผลรวมต้องคิดแบบเวกเตอร์"
      - text: "วาดสี่เหลี่ยมผืนผ้าที่มีสองแรงเป็นด้าน แรงลัพธ์คือเส้นทแยง"
      - text: "$F_\\text{net} = \\sqrt{300^2 + 400^2} = \\sqrt{250\\,000} = 500\\ \\mathrm{N}$"
      - text: "ทิศอยู่ระหว่างตะวันออกกับเหนือ เอนไปทางเหนือเพราะแรงทางเหนือใหญ่กว่า (ทำมุมประมาณ $53^\\circ$ กับทิศตะวันออก)"
    answer: "แรงลัพธ์ $500\\ \\mathrm{N}$ ไปทางตะวันออกเฉียงเหนือ เอนไปทางเหนือ"
  - { type: check, problem: phy.force.p015, prompt: "เลือกแผนภาพแรงที่ถูกต้อง" }
  - type: interactive
    title: แรงลัพธ์ของการชักเย่อบนเส้นจำนวน
    caption: "ให้ทางขวาเป็นบวก ทีมแดงดึงไปทางขวา 300 N (ลูกศร +300) ทีมขาวดึงไปทางซ้าย 250 N (ลูกศร −250) จุดที่ลูกศรสุดท้ายไปหยุดคือแรงลัพธ์ +50 N สังเกตว่าแรงทิศตรงข้ามต้องหักลบกัน ไม่ใช่บวกขนาดเข้าด้วยกัน"
    widget:
      kind: number-line
      min: -100
      max: 350
      points:
        - { value: 0, label: เริ่ม }
        - { value: 50, label: แรงลัพธ์ +50 N }
      jumps:
        - { from: 0, to: 300, label: "ทีมแดง +300 N" }
        - { from: 300, to: 50, label: "ทีมขาว −250 N" }
  - type: simulation
    title: แรงและการเคลื่อนที่ (PhET Forces and Motion Basics)
    url: https://phet.colorado.edu/en/simulations/forces-and-motion-basics
    provider: phet
    note: เปิดหน้าจอ Net Force (ชักเย่อ) วางคนดึงเชือกทั้งสองฝั่ง ติ๊กแสดงผลรวมของแรง (Sum of Forces) แล้วเปรียบเทียบแรงลัพธ์กับการคำนวณแบบใส่เครื่องหมาย ลองจัดให้แรงลัพธ์เป็นศูนย์แล้วกด Go ดูว่าเกวียนขยับหรือไม่
glossary:
  - { term: แรง, definition: "การดึงหรือการผลักที่วัตถุหนึ่งกระทำต่ออีกวัตถุหนึ่ง เป็นปริมาณเวกเตอร์ มีหน่วยนิวตัน ($\\mathrm{N}$)" }
  - { term: นิวตัน (N), definition: "หน่วยของแรงในระบบ SI เท่ากับ $1\\ \\mathrm{kg \\cdot m/s^2}$" }
  - { term: แผนภาพแรง, definition: "ภาพที่แยกวัตถุชิ้นเดียวออกมาแล้ววาดลูกศรแทนทุกแรงที่กระทำต่อวัตถุนั้น (free-body diagram)" }
  - { term: แรงลัพธ์, definition: "ผลรวมแบบเวกเตอร์ของแรงทุกแรงที่กระทำต่อวัตถุ เขียนเป็น $\\Sigma F$ หรือ $F_\\text{net}$" }
flashcards:
  - { front: "หน่วยของแรงในระบบ SI คืออะไร", back: "นิวตัน ($\\mathrm{N}$) โดย $1\\ \\mathrm{N} = 1\\ \\mathrm{kg \\cdot m/s^2}$ ส่วนกิโลกรัมเป็นหน่วยของมวล" }
  - { front: "หาแรงลัพธ์ของแรงในแนวเดียวกันอย่างไร", back: "เลือกทิศบวก ใส่เครื่องหมาย $+$ หรือ $-$ ให้แต่ละแรงตามทิศ แล้วบวกกันทั้งหมด" }
  - { front: "แผนภาพแรงของหนังสือที่วางบนโต๊ะมีแรงอะไรบ้าง", back: "น้ำหนักชี้ลง และแรงตั้งฉากจากโต๊ะชี้ขึ้น (ไม่ใส่แรงที่หนังสือกดโต๊ะ เพราะแรงนั้นกระทำต่อโต๊ะ)" }
  - { front: "ยกตัวอย่างแรงไม่สัมผัส", back: "แรงโน้มถ่วง แรงแม่เหล็ก แรงไฟฟ้า กระทำได้แม้วัตถุไม่แตะกัน" }
  - { front: "แรงสมดุลกับแรงไม่สมดุลมีผลต่อการเคลื่อนที่อย่างไร", back: "สมดุล (แรงลัพธ์ 0): นิ่งต่อไปหรือเคลื่อนที่ด้วยความเร็วคงตัว · ไม่สมดุล: เริ่ม หยุด เร็วขึ้น ช้าลง หรือเปลี่ยนทิศ" }
