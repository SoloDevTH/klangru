problems:
  - id: business.accounting.product-costing.p001
    topics: [business.accounting.product-costing]
    difficulty: 1
    type: match
    stem: "โรงงานทำรองเท้าหนัง (สมมติ) จับคู่รายการกับประเภทต้นทุน"
    pairs:
      - { left: "หนังวัวที่ใช้ทำตัวรองเท้า", right: "วัตถุดิบทางตรง" }
      - { left: "ค่าจ้างช่างเย็บตามชั่วโมงที่เย็บรองเท้า", right: "ค่าแรงทางตรง" }
      - { left: "ค่าไฟฟ้าของโรงงานและกาวที่ใช้ร่วมกัน", right: "ค่าใช้จ่ายการผลิต" }
      - { left: "ค่านายหน้าพนักงานขายหน้าร้าน", right: "ค่าใช้จ่ายในการขาย (ไม่ใช่ต้นทุนผลิตภัณฑ์)" }
    hints:
      - "วัตถุดิบทางตรงและค่าแรงทางตรงระบุได้ว่าเป็นของรองเท้าคู่ใด"
      - "ค่าใช้จ่ายนอกโรงงานไม่ใช่ต้นทุนผลิตภัณฑ์"
    solution: "หนังวัว → วัตถุดิบทางตรง · ค่าจ้างช่างเย็บตามชั่วโมงที่ทำรองเท้า → ค่าแรงทางตรง · ค่าไฟโรงงานและกาว → ค่าใช้จ่ายการผลิต · ค่านายหน้าพนักงานขาย → ค่าใช้จ่ายในการขาย (ไม่ใช่ต้นทุนผลิตภัณฑ์)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.product-costing.p002
    topics: [business.accounting.product-costing]
    difficulty: 1
    type: mcq
    stem: "ในโรงงานทำขนมปัง ข้อใดเป็น **ค่าใช้จ่ายการผลิต**"
    choices:
      - { id: a, text: "ค่าเสื่อมราคาเตาอบในโรงงาน", correct: true }
      - { id: b, text: "แป้งสาลีที่ผสมในขนมปัง", feedback: "แป้งเป็นวัตถุดิบหลักที่ระบุได้ จึงเป็นวัตถุดิบทางตรง" }
      - { id: c, text: "ค่าจ้างพนักงานนวดแป้ง", feedback: "คนที่ลงมือผลิตโดยตรงเป็นค่าแรงทางตรง" }
      - { id: d, text: "ค่าโฆษณาขนมปังในโซเชียล", feedback: "ค่าโฆษณาเป็นค่าใช้จ่ายในการขาย ไม่ใช่ต้นทุนผลิต" }
    hints:
      - "ค่าใช้จ่ายการผลิตเกิดในโรงงาน แต่ระบุเข้าขนมปังแต่ละก้อนโดยตรงไม่ได้"
      - "ข้อใดเกิดนอกโรงงาน"
    solution: "ค่าเสื่อมราคาเตาอบใช้ร่วมกับขนมปังทุกก้อน ระบุเข้าก้อนใดก้อนหนึ่งไม่ได้ จึงเป็นค่าใช้จ่ายการผลิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.product-costing.p003
    topics: [business.accounting.product-costing]
    difficulty: 2
    type: numeric
    stem: "เดือนนี้โรงงานใช้วัตถุดิบทางตรง $45{,}000$ บาท ค่าแรงทางตรง $30{,}000$ บาท และค่าใช้จ่ายการผลิต $25{,}000$ บาท **ต้นทุนแปรสภาพ** เป็นกี่บาท (ตอบเป็นบาท)"
    answer: { value: 55000, unit: "บาท" }
    hints:
      - "ต้นทุนแปรสภาพคือต้นทุนที่ใช้แปลงวัตถุดิบเป็นสินค้า"
      - "$=$ ค่าแรงทางตรง $+$ ค่าใช้จ่ายการผลิต"
    misconceptions:
      - { match: 75000, feedback: "นั่นคือต้นทุนเบื้องต้น (วัตถุดิบทางตรง $+$ ค่าแรงทางตรง)" }
      - { match: 100000, feedback: "นั่นคือต้นทุนผลิตรวมทั้งสามส่วน" }
    solution: "ต้นทุนแปรสภาพ $= 30{,}000 + 25{,}000 = 55{,}000$ บาท (ต้นทุนเบื้องต้น $= 45{,}000 + 30{,}000 = 75{,}000$ บาท)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.product-costing.p004
    topics: [business.accounting.product-costing]
    difficulty: 2
    type: numeric
    stem: "โรงงานมีวัตถุดิบต้นเดือน $12{,}000$ บาท ซื้อเพิ่ม $68{,}000$ บาท นับได้ปลายเดือน $15{,}000$ บาท เดือนนี้ใช้วัตถุดิบไปกี่บาท (ตอบเป็นบาท)"
    answer: { value: 65000, unit: "บาท" }
    hints:
      - "วัตถุดิบที่มีให้ใช้ $=$ ต้นงวด $+$ ซื้อ"
      - "ส่วนที่เหลือปลายงวดยังไม่ได้ใช้"
    misconceptions:
      - { match: 68000, feedback: "ใช้ยอดซื้อแทนยอดที่ใช้ ต้องปรับด้วยวัตถุดิบต้นงวดและปลายงวด" }
      - { match: 95000, feedback: "บวกวัตถุดิบปลายงวด ต้องหักออก" }
    solution: "วัตถุดิบที่ใช้ $= 12{,}000 + 68{,}000 - 15{,}000 = 65{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.product-costing.p005
    topics: [business.accounting.product-costing]
    difficulty: 2
    type: mcq
    stem: "กิจการใดควรใช้ **ระบบต้นทุนงานสั่งทำ** (เลือกได้มากกว่าหนึ่งข้อ)"
    multiple: true
    choices:
      - { id: a, text: "อู่ซ่อมรถยนต์", correct: true }
      - { id: b, text: "โรงพิมพ์รับพิมพ์การ์ดแต่งงานตามแบบของลูกค้า", correct: true }
      - { id: c, text: "ผู้รับเหมาสร้างบ้านตามแบบ", correct: true }
      - { id: d, text: "โรงงานน้ำดื่มบรรจุขวด", feedback: "ผลิตขวดเหมือนกันต่อเนื่องจำนวนมาก เหมาะกับต้นทุนช่วง" }
    hints:
      - "งานสั่งทำ: แต่ละงานต่างกัน ต้นทุนแยกตามงาน"
      - "ต้นทุนช่วง: ผลิตสินค้าเหมือนกันจำนวนมากต่อเนื่อง"
    solution: "อู่ซ่อมรถ โรงพิมพ์รับงานตามสั่ง และผู้รับเหมาสร้างบ้านมีงานแต่ละชิ้นไม่เหมือนกัน จึงใช้ต้นทุนงานสั่งทำ ส่วนโรงงานน้ำดื่มบรรจุขวดผลิตสินค้าเหมือนกันต่อเนื่อง ใช้ต้นทุนช่วง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.product-costing.p006
    topics: [business.accounting.product-costing]
    difficulty: 3
    type: numeric
    stem: "โรงงานประมาณว่าทั้งปีจะมีค่าใช้จ่ายการผลิต $360{,}000$ บาท และใช้ชั่วโมงแรงงานทางตรง $6{,}000$ ชั่วโมง อัตราค่าใช้จ่ายการผลิตกำหนดไว้ล่วงหน้าเป็นกี่บาทต่อชั่วโมงแรงงาน (ตอบเป็นบาท)"
    answer: { value: 60, unit: "บาท" }
    hints:
      - "อัตรา $=$ ค่าใช้จ่ายการผลิตที่ประมาณ $\\div$ ฐานที่ประมาณ"
      - "ตัวตั้งเป็นบาท ตัวหารเป็นชั่วโมง"
    misconceptions:
      - { match: 0.02, feedback: "หารกลับด้าน ($6{,}000 \\div 360{,}000$) ต้องเป็นบาทหารด้วยชั่วโมง" }
    solution: "อัตรา $= 360{,}000 \\div 6{,}000 = 60$ บาทต่อชั่วโมงแรงงานทางตรง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.product-costing.p007
    topics: [business.accounting.product-costing]
    difficulty: 3
    type: numeric
    stem: "จากบัตรต้นทุนงาน J-115 ในภาพ ต้นทุนต่อใบเป็นกี่บาท (ตอบทศนิยม 2 ตำแหน่ง)"
    figure:
      src: job-sheet.svg
      alt: "บัตรต้นทุนงาน J-115 กล่องกระดาษพิมพ์ลาย 400 ใบ (สมมติ) กระดาษและหมึก (วัตถุดิบทางตรง) 7,800 บาท ชั่วโมงแรงงานทางตรง 24 ชั่วโมง อัตราค่าจ้างทางตรง 160 บาทต่อชั่วโมง อัตราค่าใช้จ่ายการผลิต 45 บาทต่อชั่วโมงแรงงาน จำนวนที่ผลิต 400 ใบ ช่องต้นทุนรวมของงานและต้นทุนต่อใบเป็นเครื่องหมายคำถาม"
    answer: { value: 31.8, tolerance: 0.01, unit: "บาท" }
    hints:
      - "ค่าแรงทางตรง $= 24 \\times 160$ ค่าใช้จ่ายการผลิตที่ปันส่วน $= 24 \\times 45$"
      - "รวมทั้งสามส่วนแล้วหารด้วย $400$ ใบ"
    misconceptions:
      - { match: 29.1, feedback: "ลืมปันส่วนค่าใช้จ่ายการผลิต $24 \\times 45 = 1{,}080$ บาท" }
      - { match: 19.5, feedback: "คิดแค่วัตถุดิบ ($7{,}800 \\div 400$) ต้องรวมค่าแรงและค่าใช้จ่ายการผลิตด้วย" }
    solution: "ค่าแรงทางตรง $= 24 \\times 160 = 3{,}840$ บาท ค่าใช้จ่ายการผลิต $= 24 \\times 45 = 1{,}080$ บาท ต้นทุนงาน $= 7{,}800 + 3{,}840 + 1{,}080 = 12{,}720$ บาท ต้นทุนต่อใบ $= 12{,}720 \\div 400 = 31.80$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.product-costing.p008
    topics: [business.accounting.product-costing]
    difficulty: 3
    type: numeric
    stem: "เดือนนี้โรงงานมีงานระหว่างทำต้นงวด $8{,}000$ บาท ใช้วัตถุดิบทางตรง $65{,}000$ บาท ค่าแรงทางตรง $30{,}000$ บาท ค่าใช้จ่ายการผลิต $25{,}000$ บาท งานระหว่างทำปลายงวด $10{,}000$ บาท ต้นทุนการผลิตของสินค้าที่ผลิตเสร็จเป็นกี่บาท (ตอบเป็นบาท)"
    answer: { value: 118000, unit: "บาท" }
    hints:
      - "รวมต้นทุนผลิตทั้งสามส่วนของงวดนี้ก่อน"
      - "บวกงานระหว่างทำต้นงวด หักงานระหว่างทำปลายงวด"
    misconceptions:
      - { match: 128000, feedback: "ลืมหักงานระหว่างทำปลายงวด $10{,}000$ บาทซึ่งยังทำไม่เสร็จ" }
      - { match: 120000, feedback: "ไม่ได้ปรับงานระหว่างทำต้นงวดและปลายงวดเลย" }
    solution: "ต้นทุนการผลิต $= 8{,}000 + 65{,}000 + 30{,}000 + 25{,}000 - 10{,}000 = 118{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.product-costing.p009
    topics: [business.accounting.product-costing]
    difficulty: 3
    type: order
    stem: "เรียงการไหลของต้นทุนในโรงงานตั้งแต่ซื้อวัตถุดิบจนขายสินค้าได้"
    items:
      - "ซื้อวัตถุดิบเก็บเป็นวัตถุดิบคงเหลือ"
      - "เบิกวัตถุดิบเข้าการผลิต (งานระหว่างทำ) พร้อมค่าแรงและค่าใช้จ่ายการผลิต"
      - "ผลิตเสร็จ โอนเป็นสินค้าสำเร็จรูป"
      - "ขายสินค้าได้ ต้นทุนกลายเป็นต้นทุนขาย"
    hints:
      - "สินค้าที่ยังผลิตไม่เสร็จเรียกว่าอะไร"
      - "ต้นทุนกลายเป็นค่าใช้จ่ายเมื่อขายสินค้าได้"
    solution: "วัตถุดิบคงเหลือ → งานระหว่างทำ (ใส่ค่าแรงและค่าใช้จ่ายการผลิต) → สินค้าสำเร็จรูป → ต้นทุนขาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.product-costing.p010
    topics: [business.accounting.product-costing]
    difficulty: 4
    type: numeric
    stem: "โรงงานใช้อัตราค่าใช้จ่ายการผลิต $60$ บาทต่อชั่วโมงแรงงานทางตรง ทั้งปีใช้แรงงานจริง $6{,}300$ ชั่วโมง และมีค่าใช้จ่ายการผลิตจริง $371{,}500$ บาท ค่าใช้จ่ายการผลิตปันส่วนเกินหรือขาดไปกี่บาท (ตอบเป็นจำนวนบวก)"
    answer: { value: 6500, unit: "บาท" }
    hints:
      - "ยอดที่ปันส่วน $=$ อัตรา $\\times$ ชั่วโมงจริง"
      - "เทียบยอดที่ปันส่วนกับยอดจริง"
    misconceptions:
      - { match: 11500, feedback: "เทียบยอดจริงกับยอดที่ประมาณไว้ต้นปี ($360{,}000$) ต้องเทียบกับยอดที่ปันส่วนตามชั่วโมงจริง" }
    solution: "ปันส่วน $= 60 \\times 6{,}300 = 378{,}000$ บาท มากกว่ายอดจริง $371{,}500$ บาท อยู่ $6{,}500$ บาท จึงเป็น **ปันส่วนเกิน** ต้นทุนงานที่บันทึกไว้สูงกว่าจริงเล็กน้อย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.product-costing.p011
    topics: [business.accounting.product-costing]
    difficulty: 4
    type: numeric
    stem: "จากข้อมูลการผลิตในภาพ หน่วยเทียบเท่าสำเร็จรูปของ **ต้นทุนแปรสภาพ** (วิธีถัวเฉลี่ยถ่วงน้ำหนัก) เป็นกี่หน่วย"
    figure:
      src: process-data.svg
      alt: "ตารางข้อมูลการผลิตของโรงงานน้ำพริกเผา แผนกผสมและบรรจุ เดือนมีนาคม (สมมติ) งานระหว่างทำต้นงวด 200 ขวด เริ่มผลิตในเดือนนี้ 1,800 ขวด ผลิตเสร็จโอนออก 1,700 ขวด งานระหว่างทำปลายงวด 300 ขวด ความสำเร็จของงานปลายงวด วัตถุดิบ 100% แปรสภาพ 40% ต้นทุนวัตถุดิบ ต้นงวด 3,000 บาท เดือนนี้ 27,000 บาท ต้นทุนแปรสภาพ ต้นงวด 1,000 บาท เดือนนี้ 17,200 บาท ใช้วิธีถัวเฉลี่ยถ่วงน้ำหนัก"
    answer: { value: 1820, unit: "หน่วย" }
    hints:
      - "หน่วยเทียบเท่า $=$ หน่วยที่เสร็จ $+$ หน่วยปลายงวด $\\times$ ร้อยละความสำเร็จ"
      - "งานปลายงวดแปรสภาพไปแล้ว $40\\%$"
    misconceptions:
      - { match: 2000, feedback: "นับงานปลายงวดเต็มหน่วย ใช้ได้กับวัตถุดิบเท่านั้น ต้นทุนแปรสภาพเสร็จแค่ $40\\%$" }
      - { match: 1700, feedback: "ลืมนับงานปลายงวดที่ทำไปแล้วบางส่วน" }
    solution: "หน่วยเทียบเท่า $= 1{,}700 + 300 \\times 0.40 = 1{,}700 + 120 = 1{,}820$ หน่วย (ส่วนวัตถุดิบ $= 1{,}700 + 300 = 2{,}000$ หน่วย)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.product-costing.p012
    topics: [business.accounting.product-costing]
    difficulty: 4
    type: numeric
    stem: "จากข้อมูลการผลิตในภาพ ต้นทุนแปรสภาพต่อหน่วยเทียบเท่า (วิธีถัวเฉลี่ยถ่วงน้ำหนัก) เป็นกี่บาท (ตอบทศนิยม 2 ตำแหน่ง)"
    figure:
      src: process-data.svg
      alt: "ตารางข้อมูลการผลิตของโรงงานน้ำพริกเผา แผนกผสมและบรรจุ เดือนมีนาคม (สมมติ) งานระหว่างทำต้นงวด 200 ขวด เริ่มผลิตในเดือนนี้ 1,800 ขวด ผลิตเสร็จโอนออก 1,700 ขวด งานระหว่างทำปลายงวด 300 ขวด ความสำเร็จของงานปลายงวด วัตถุดิบ 100% แปรสภาพ 40% ต้นทุนวัตถุดิบ ต้นงวด 3,000 บาท เดือนนี้ 27,000 บาท ต้นทุนแปรสภาพ ต้นงวด 1,000 บาท เดือนนี้ 17,200 บาท ใช้วิธีถัวเฉลี่ยถ่วงน้ำหนัก"
    answer: { value: 10, tolerance: 0.01, unit: "บาท" }
    hints:
      - "วิธีถัวเฉลี่ยถ่วงน้ำหนักใช้ต้นทุนต้นงวดรวมกับต้นทุนเดือนนี้"
      - "หารด้วยหน่วยเทียบเท่าของต้นทุนแปรสภาพ ($1{,}820$ หน่วย)"
    misconceptions:
      - { match: 9.45, feedback: "ใช้แค่ต้นทุนเดือนนี้ $17{,}200$ บาท วิธีถัวเฉลี่ยถ่วงน้ำหนักต้องรวมต้นทุนต้นงวดด้วย" }
      - { match: 9.1, feedback: "หารด้วย $2{,}000$ หน่วยของวัตถุดิบ ต้องใช้หน่วยเทียบเท่าของต้นทุนแปรสภาพ" }
    solution: "ต้นทุนแปรสภาพรวม $= 1{,}000 + 17{,}200 = 18{,}200$ บาท ต่อหน่วยเทียบเท่า $= 18{,}200 \\div 1{,}820 = 10.00$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.product-costing.p013
    topics: [business.accounting.product-costing]
    difficulty: 5
    type: numeric
    stem: "จากข้อมูลการผลิตในภาพ ต้นทุนของงานระหว่างทำปลายงวด (300 ขวด) เป็นกี่บาท (วิธีถัวเฉลี่ยถ่วงน้ำหนัก ตอบเป็นบาท)"
    figure:
      src: process-data.svg
      alt: "ตารางข้อมูลการผลิตของโรงงานน้ำพริกเผา แผนกผสมและบรรจุ เดือนมีนาคม (สมมติ) งานระหว่างทำต้นงวด 200 ขวด เริ่มผลิตในเดือนนี้ 1,800 ขวด ผลิตเสร็จโอนออก 1,700 ขวด งานระหว่างทำปลายงวด 300 ขวด ความสำเร็จของงานปลายงวด วัตถุดิบ 100% แปรสภาพ 40% ต้นทุนวัตถุดิบ ต้นงวด 3,000 บาท เดือนนี้ 27,000 บาท ต้นทุนแปรสภาพ ต้นงวด 1,000 บาท เดือนนี้ 17,200 บาท ใช้วิธีถัวเฉลี่ยถ่วงน้ำหนัก"
    answer: { value: 5700, unit: "บาท" }
    hints:
      - "หาต้นทุนต่อหน่วยเทียบเท่าของวัตถุดิบ ($30{,}000 \\div 2{,}000$) และแปรสภาพ ($18{,}200 \\div 1{,}820$)"
      - "งานปลายงวดมีวัตถุดิบ $300$ หน่วยเทียบเท่า แปรสภาพ $120$ หน่วยเทียบเท่า"
    misconceptions:
      - { match: 7500, feedback: "คิดงานปลายงวดเต็ม $300$ หน่วยด้วยต้นทุน $25$ บาท แต่ต้นทุนแปรสภาพทำไปแค่ $40\\%$" }
      - { match: 4500, feedback: "คิดแค่วัตถุดิบ ยังไม่ได้รวมต้นทุนแปรสภาพ $120 \\times 10$" }
    solution: "วัตถุดิบ $= 30{,}000 \\div 2{,}000 = 15$ บาท แปรสภาพ $= 18{,}200 \\div 1{,}820 = 10$ บาท งานปลายงวด $= 300 \\times 15 + 120 \\times 10 = 4{,}500 + 1{,}200 = 5{,}700$ บาท ตรวจ: สินค้าเสร็จ $1{,}700 \\times 25 = 42{,}500$ บาท รวม $48{,}200$ บาท เท่ากับต้นทุนทั้งหมด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.product-costing.p014
    topics: [business.accounting.product-costing]
    difficulty: 4
    type: numeric
    stem: "โต๊ะสั่งทำมีต้นทุนผลิต $2{,}640$ บาทต่อตัว โรงงานตั้งราคาแบบต้นทุนบวกส่วนเพิ่ม $40\\%$ ของต้นทุน ราคาขายต่อตัวเป็นกี่บาท (ตอบเป็นบาท)"
    answer: { value: 3696, unit: "บาท" }
    hints:
      - "ส่วนเพิ่มคิดจากต้นทุน"
      - "ราคา $=$ ต้นทุน $\\times (1 + 0.40)$"
    misconceptions:
      - { match: 4400, feedback: "หาร $2{,}640$ ด้วย $0.60$ เป็นการตั้งให้กำไร $40\\%$ ของราคาขาย ไม่ใช่บวก $40\\%$ ของต้นทุน" }
      - { match: 1056, feedback: "นั่นคือส่วนเพิ่มอย่างเดียว ต้องบวกต้นทุนด้วย" }
    solution: "ราคา $= 2{,}640 \\times 1.40 = 3{,}696$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.product-costing.p015
    topics: [business.accounting.product-costing]
    difficulty: 5
    type: numeric
    stem: "โรงงาน (สมมติ) มีค่าใช้จ่ายการผลิต $240{,}000$ บาทต่อปี ผลิตสินค้า X $2{,}000$ หน่วย ใช้ชั่วโมงเครื่องจักร $1{,}000$ ชั่วโมงและชั่วโมงแรงงาน $3{,}000$ ชั่วโมง สินค้า Y ใช้ชั่วโมงเครื่องจักร $3{,}000$ ชั่วโมงและชั่วโมงแรงงาน $1{,}000$ ชั่วโมง ถ้าเปลี่ยนฐานปันส่วนจากชั่วโมงแรงงานเป็นชั่วโมงเครื่องจักร ค่าใช้จ่ายการผลิตต่อหน่วยของ X ลดลงกี่บาท (ตอบเป็นบาท)"
    answer: { value: 60, unit: "บาท" }
    hints:
      - "ทั้งสองฐานมีรวม $4{,}000$ ชั่วโมง อัตรา $= 240{,}000 \\div 4{,}000 = 60$ บาทต่อชั่วโมง"
      - "หาค่าใช้จ่ายที่ X ได้รับในแต่ละฐาน แล้วหารด้วย $2{,}000$ หน่วย"
    misconceptions:
      - { match: 30, feedback: "นั่นคือค่าใช้จ่ายต่อหน่วยเมื่อใช้ชั่วโมงเครื่องจักร ยังไม่ได้เทียบกับฐานเดิม" }
      - { match: 120000, feedback: "นั่นคือส่วนต่างรวมทั้งปี ต้องหารด้วย $2{,}000$ หน่วย" }
    solution: "ฐานชั่วโมงแรงงาน: X ได้ $3{,}000 \\times 60 = 180{,}000$ บาท หรือ $90$ บาทต่อหน่วย ฐานชั่วโมงเครื่องจักร: X ได้ $1{,}000 \\times 60 = 60{,}000$ บาท หรือ $30$ บาทต่อหน่วย ลดลง $60$ บาทต่อหน่วย ถ้าค่าใช้จ่ายการผลิตส่วนใหญ่มาจากเครื่องจักร ฐานชั่วโมงเครื่องจักรสะท้อนต้นทุนจริงได้ดีกว่า และราคาที่ตั้งจากต้นทุนต่อหน่วยก็จะต่างไปมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.product-costing.p016
    topics: [business.accounting.product-costing]
    difficulty: 5
    type: mcq
    stem: "โรงงานผลิตกระเป๋า (สมมติ) มีต้นทุนผันแปร $30$ บาทต่อใบ ต้นทุนคงที่การผลิต $20{,}000$ บาทต่อเดือน เดือนนี้ผลิต $1{,}000$ ใบ ต้นทุนต่อใบจึงเป็น $50$ บาท ข้อใด **ถูกต้อง** (เลือกได้มากกว่าหนึ่งข้อ)"
    multiple: true
    choices:
      - { id: a, text: "ถ้าผลิต $2{,}000$ ใบ ต้นทุนต่อใบจะลดเหลือ $40$ บาท", correct: true }
      - { id: b, text: "ถ้ามีกำลังผลิตว่างและต้นทุนคงที่ไม่เพิ่ม คำสั่งซื้อพิเศษราคา $45$ บาทต่อใบยังเพิ่มกำไรได้", correct: true }
      - { id: c, text: "ถ้าผลิต $2{,}000$ ใบ ต้นทุนผันแปรต่อใบจะลดเหลือ $15$ บาท", feedback: "ต้นทุนผันแปรต่อหน่วยคงที่ $30$ บาท ส่วนที่ลดคือต้นทุนคงที่ต่อหน่วย" }
      - { id: d, text: "ห้ามขายต่ำกว่า $50$ บาทในทุกกรณี เพราะจะขาดทุนแน่นอน", feedback: "ต้นทุน $50$ บาทรวมต้นทุนคงที่ที่ต้องจ่ายอยู่แล้ว คำสั่งซื้อเพิ่มที่ราคาเกิน $30$ บาทยังให้กำไรส่วนเกิน" }
    hints:
      - "ต้นทุนคงที่ต่อหน่วยเปลี่ยนตามจำนวนผลิต"
      - "ลองคิดต้นทุนต่อใบเมื่อผลิต $2{,}000$ ใบ"
    solution: "ข้อ ก และ ข ถูก ถ้าผลิต $2{,}000$ ใบ ต้นทุนต่อใบ $= 30 + 20{,}000 \\div 2{,}000 = 40$ บาท ต้นทุนต่อหน่วยที่รวมต้นทุนคงที่จึงใช้ได้เฉพาะที่ปริมาณผลิตนั้น และคำสั่งซื้อพิเศษราคา $45$ บาทที่ใช้กำลังผลิตว่างยังได้กำไรส่วนเกิน $15$ บาทต่อใบ ข้อ ค ผิด เพราะต้นทุนผันแปรต่อใบยังเป็น $30$ บาท ข้อ ง ผิด เพราะราคาที่ต่ำกว่า $50$ บาทอาจยังคุ้มถ้าต้นทุนคงที่ไม่เพิ่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.product-costing.p017
    topics: [business.accounting.product-costing]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็น **ค่าใช้จ่ายของงวด** ไม่ใช่ต้นทุนผลิตภัณฑ์"
    choices:
      - { id: a, text: "เงินเดือนพนักงานบัญชีที่สำนักงานใหญ่", correct: true }
      - { id: b, text: "ค่าซ่อมเครื่องจักรในโรงงาน", feedback: "เกิดในการผลิต เป็นค่าใช้จ่ายการผลิต" }
      - { id: c, text: "ค่าจ้างหัวหน้าคนงานในโรงงาน", feedback: "หัวหน้าคนงานดูแลการผลิต เป็นค่าแรงทางอ้อมในค่าใช้จ่ายการผลิต" }
      - { id: d, text: "ผ้าที่ใช้ตัดเย็บเสื้อ", feedback: "เป็นวัตถุดิบทางตรง" }
    hints:
      - "ต้นทุนผลิตภัณฑ์เกิดในการผลิต"
      - "ค่าใช้จ่ายของงวดเกิดจากการขายและการบริหาร"
    solution: "เงินเดือนพนักงานบัญชีที่สำนักงานเป็นค่าใช้จ่ายในการบริหาร บันทึกเป็นค่าใช้จ่ายในงวดที่เกิด ไม่เข้าต้นทุนสินค้า"
