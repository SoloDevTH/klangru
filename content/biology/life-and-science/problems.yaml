  - id: biology.foundations.life-and-science.p015
    topics: [biology.foundations.life-and-science]
    difficulty: 5
    type: mcq
    stem: "ข้อใดอธิบายความสัมพันธ์ของการจัดระบบในสิ่งมีชีวิตได้ถูกต้องที่สุด"
    choices:
      - { id: a, text: "ถ้าเซลล์กล้ามเนื้อหัวใจจำนวนมากตายจากหลอดเลือดอุดตัน หัวใจสูบฉีดเลือดได้น้อยลง เซลล์ทั่วร่างกายได้ออกซิเจนไม่พอ และชีวิตของคนนั้นอาจตกอยู่ในอันตราย", correct: true }
      - { id: b, text: "แต่ละระดับทำงานแยกกัน ความเสียหายของเซลล์ไม่มีผลต่ออวัยวะ", feedback: "อวัยวะเกิดจากเนื้อเยื่อและเซลล์ทำงานร่วมกัน เซลล์เสียหายจึงทำให้อวัยวะทำงานได้น้อยลง" }
      - { id: c, text: "เซลล์กล้ามเนื้อหัวใจเพียงเซลล์เดียวสูบฉีดเลือดไปทั่วร่างกายได้", feedback: "การสูบฉีดเลือดเป็นสมบัติของหัวใจทั้งดวงที่เกิดจากเซลล์จำนวนมากบีบตัวพร้อมกัน เซลล์เดียวทำไม่ได้" }
      - { id: d, text: "ระดับประชากรอยู่ภายในร่างกายของสิ่งมีชีวิตหนึ่งตัว", feedback: "ประชากรคือสิ่งมีชีวิตชนิดเดียวกันหลายตัว จึงอยู่เหนือระดับสิ่งมีชีวิตหนึ่งตัว" }
    hints:
