      - "ป้ายสีเขียวบอกทางที่ปลอดภัย"
    solution: "ใช้บันไดหนีไฟตามป้ายสีเขียว ห้ามใช้ลิฟต์ ออกไปจุดรวมพลแล้วโทร 199"
