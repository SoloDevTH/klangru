  difficulty: 1
  type: match
  stem: จับคู่ตัวย่อในพจนานุกรมกับชนิดของคำ
  pairs:
  - left: n.
    right: noun
  - left: v.
    right: verb
  - left: adj.
    right: adjective
  - left: adv.
    right: adverb
  hints:
  - ตัวย่อมาจากตัวอักษรต้นของชื่อชนิดคำ
  - adj. กับ adv. ต่างกันที่ตัวที่สาม
  solution: n. = noun · v. = verb · adj. = adjective · adv. = adverb
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.reading.research-skills.p002
  topics:
  - english.reading.research-skills
  difficulty: 1
  type: mcq
  stem: ดูพจนานุกรม คำว่า bank ออกเสียงอย่างไร ดูได้จากส่วนใด
  figure: &id001
    src: dictionary-entry.svg
    alt: 'รายการคำศัพท์ในพจนานุกรม headword: bank, pronunciation: /bæŋk/, part of speech: noun ความหมาย 1 an organization that keeps and lends money ตัวอย่าง She keeps her savings in a bank. ความหมาย 2 the land along the side of a river or lake ตัวอย่าง We had a picnic on the river bank. ความหมาย 3 a place where something is stored for use ตัวอย่าง a blood bank · a food bank และ verb: to put money into a bank ตัวอย่าง I bank my pocket money every month.'
  choices:
  - id: a
    text: /bæŋk/
    correct: true
    feedback: ถูก สัทอักษรในเครื่องหมาย / / บอกการออกเสียง
  - id: b
    text: noun
    feedback: noun คือชนิดของคำ
  - id: c
    text: an organization that keeps and lends money
    feedback: นี่คือความหมาย
  - id: d
    text: She keeps her savings in a bank.
    feedback: นี่คือประโยคตัวอย่าง
  hints:
  - การออกเสียงเขียนด้วยสัญลักษณ์พิเศษ
  - มองหาข้อความในเครื่องหมาย / /
  solution: การออกเสียงอยู่ใน **/bæŋk/** (pronunciation)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.reading.research-skills.p003
  topics:
  - english.reading.research-skills
  difficulty: 1
  type: mcq
  stem: ต้องการหาข้อมูลเรื่อง *How do sea turtles find their way?* คำค้นใดดีที่สุด
  choices:
  - id: a
    text: sea turtle navigation
    correct: true
    feedback: ถูก เป็นคำนามสำคัญ สั้น ตรงประเด็น
  - id: b
    text: how do the sea turtles find their way to go
    feedback: ยาวเกินและมีคำเล็กที่ไม่ช่วยค้นหา
  - id: c
    text: turtle
    feedback: กว้างเกินไป จะได้เต่าทุกชนิดและทุกเรื่อง
  - id: d
    text: เต่าทะเลหาทางอย่างไร
    feedback: ถ้าต้องการแหล่งภาษาอังกฤษ ให้ใช้คำค้นภาษาอังกฤษ
  hints:
  - เลือกคำนามสำคัญ ตัดคำเล็ก
  - หัวข้อคือเต่าทะเล + การหาทาง (navigation)
  solution: '**sea turtle navigation** สั้นและตรงประเด็น'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.reading.research-skills.p004
  topics:
  - english.reading.research-skills
  difficulty: 2
  type: order
  stem: เรียงขั้นตอนการสืบค้นข้อมูลทำรายงาน
  items:
  - ตั้งคำถามให้ชัด
  - เลือกคำค้น
  - ค้นและเลือกแหล่งที่เชื่อถือได้
  - จดบันทึกคำสำคัญพร้อมแหล่งที่มา
  - สรุปด้วยคำของตัวเอง
  - นำเสนอและบอกแหล่งที่มา
  hints:
  - ต้องรู้ก่อนว่าอยากรู้อะไร
  - จดบันทึกก่อนสรุป สรุปก่อนนำเสนอ
  solution: คำถาม → คำค้น → เลือกแหล่ง → จดบันทึก → สรุป → นำเสนอ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.reading.research-skills.p005
  topics:
  - english.reading.research-skills
  difficulty: 2
  type: mcq
  stem: ดูพจนานุกรม *Many birds live on the **bank** of the Chao Phraya River.* คำว่า bank ในประโยคนี้ใช้ความหมายข้อใด
  figure: *id001
  choices:
  - id: a
    text: ความหมายที่ 2 the land along the side of a river or lake
    correct: true
    feedback: ถูก บริบทมีคำว่า river
  - id: b
    text: ความหมายที่ 1 an organization that keeps and lends money
    feedback: นกไม่ได้อาศัยในธนาคาร บริบทคือแม่น้ำ
  - id: c
    text: ความหมายที่ 3 a place where something is stored for use
    feedback: ไม่ได้พูดถึงการเก็บสิ่งของ
  - id: d
    text: 'verb: to put money into a bank'
    feedback: bank ในประโยคนี้อยู่หลัง the จึงเป็นคำนาม
  hints:
  - หาคำในประโยคที่เป็นเบาะแส
  - มีคำว่า river
  solution: บริบทคือแม่น้ำ จึงเป็น **ความหมายที่ 2 (ริมฝั่งแม่น้ำ)**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.reading.research-skills.p006
  topics:
  - english.reading.research-skills
  difficulty: 2
  type: text
  stem: 'เติมคำหนึ่งคำ: *___ to the Ocean Research Institute, corals lose their colour when the water is too warm.* (ใช้บอกแหล่งที่มาของข้อมูล)'
  accepted:
  - According
  misconceptions:
  - match: Accord
    feedback: ใช้รูป According to
  - match: Thanks
    feedback: Thanks to แปลว่า เพราะ ไม่ได้บอกแหล่งที่มาของข้อมูล
  hints:
  - สำนวนบอกแหล่งที่มา ___ to ...
  - ขึ้นต้นด้วย A
  solution: '***According** to the Ocean Research Institute, ...* = ตามข้อมูลของ ...'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.reading.research-skills.p007
  topics:
  - english.reading.research-skills
  difficulty: 3
  type: mcq
  stem: ดูผลการค้นหา แหล่งใด **เชื่อถือได้มากที่สุด** สำหรับรายงานวิทยาศาสตร์
  figure: &id002
    src: search-results.svg
    alt: 'ผลการค้นหาสมมุติสำหรับคำค้น coral bleaching causes มี 4 ผล A: Coral Bleaching: Causes and Effects เว็บ marine-research.example.org โดย Ocean Research Institute ปรับปรุงมีนาคม 2025 ข้อความ When sea water stays too warm, corals push out the tiny algae living in them... B: 10 CRAZY coral facts you won''t believe!!! เว็บ funclickz.example.com ไม่มีผู้เขียน ไม่มีวันที่ ข้อความ Number 7 will shock you! Corals turn white because they are scared... C: Coral-safe sunscreen - 20% OFF today เว็บ shop.example.com เป็นโฆษณา (Sponsored) ข้อความ Save the reef! Buy our sunscreen now and get free delivery... D: My diving trip to Koh Tao เว็บ aom-travel.example.net บล็อกส่วนตัวปี 2016 ข้อความ The corals looked a bit white when I visited. I think it was the boats...'
  choices:
  - id: a
    text: A
    correct: true
    feedback: ถูก มีหน่วยงานผู้เชี่ยวชาญ ปรับปรุงล่าสุด และเขียนเพื่อให้ความรู้
  - id: b
    text: B
    feedback: ไม่มีผู้เขียน ไม่มีวันที่ หัวข้อเกินจริง และอ้างว่าปะการังกลัว ซึ่งไม่ใช่วิทยาศาสตร์
  - id: c
    text: C
    feedback: เป็นโฆษณาขายครีมกันแดด จุดประสงค์คือขายของ
  - id: d
    text: D
    feedback: บล็อกส่วนตัวปี 2016 เป็นความเห็น (I think) ไม่ใช่หลักฐาน
  hints:
  - ถาม Who? When? Why? Evidence?
  - แหล่งไหนมีผู้เชี่ยวชาญ ใหม่ และให้ความรู้
  solution: แหล่ง **A** ตอบคำถาม Who, When, Why, Evidence ได้ดีที่สุด
  license: CC-BY-SA-4.0
  ai_assisted: true
