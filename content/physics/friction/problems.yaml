      - { match: 1.67, feedback: "ดูเหมือนนำ $N$ หารด้วยแรงเสียดทาน ต้องกลับกัน $\\mu = f/N$" }
    solution: "แรงเสียดทานสถิตสูงสุด $30\\ \\mathrm{N}$ ดังนั้น $\\mu_s = \\dfrac{30}{50} = 0.6$ (และ $\\mu_k = \\tfrac{20}{50} = 0.4$)"
