problems:
  - id: biology.ecology.food-webs.p001
    topics: [biology.ecology.food-webs]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นองค์ประกอบที่ไม่มีชีวิตของระบบนิเวศในบ่อปลา"
    choices:
      - { id: a, text: "ปริมาณแสงที่ส่องถึงน้ำ", correct: true }
      - { id: b, text: "แพลงก์ตอนพืช", feedback: "แพลงก์ตอนพืชเป็นสิ่งมีชีวิตและเป็นผู้ผลิต" }
      - { id: c, text: "แบคทีเรียที่ก้นบ่อ", feedback: "แบคทีเรียเป็นสิ่งมีชีวิต ทำหน้าที่ผู้ย่อยสลาย" }
      - { id: d, text: "ปลานิล", feedback: "ปลานิลเป็นสิ่งมีชีวิต" }
    hints:
      - "องค์ประกอบที่ไม่มีชีวิตเติบโตหรือสืบพันธุ์ไม่ได้"
      - "นึกถึงแสง อุณหภูมิ น้ำ ดิน แร่ธาตุ"
    solution: "แสงเป็นองค์ประกอบที่ไม่มีชีวิต ส่วนแพลงก์ตอนพืช แบคทีเรีย และปลานิลเป็นองค์ประกอบที่มีชีวิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.food-webs.p002
    topics: [biology.ecology.food-webs]
    difficulty: 1
    type: match
    stem: "จับคู่ตัวอย่างกับรูปแบบความสัมพันธ์"
    pairs:
      - { left: "ราและสาหร่ายในไลเคน", right: "ภาวะพึ่งพากัน" }
      - { left: "กล้วยไม้เกาะบนต้นไม้ใหญ่", right: "ภาวะอิงอาศัย" }
      - { left: "พยาธิตัวตืดในลำไส้คน", right: "ภาวะปรสิต" }
      - { left: "ผึ้งดูดน้ำหวานและช่วยถ่ายเรณูให้ดอกไม้", right: "ภาวะได้ประโยชน์ร่วมกัน" }
    hints:
      - "ใช้เครื่องหมาย + − 0 กับแต่ละฝ่าย"
      - "ภาวะพึ่งพากันต่างจากภาวะได้ประโยชน์ร่วมกันตรงที่แยกกันอยู่ไม่ได้"
    solution: "ไลเคน (+/+ แยกกันไม่ได้) เป็นภาวะพึ่งพากัน กล้วยไม้ (+/0) เป็นภาวะอิงอาศัย พยาธิ (+/−) เป็นภาวะปรสิต และผึ้งกับดอกไม้ (+/+ แยกกันอยู่ได้) เป็นภาวะได้ประโยชน์ร่วมกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.food-webs.p003
    topics: [biology.ecology.food-webs]
    difficulty: 1
    type: text
    stem: "สิ่งมีชีวิตกลุ่มใดย่อยซากพืชซากสัตว์ให้เป็นแร่ธาตุกลับคืนสู่ดิน เช่น เห็ดรา และแบคทีเรีย"
    accepted: ["ผู้ย่อยสลาย", "ผู้ย่อยสลายสารอินทรีย์", "decomposer", "decomposers"]
    hints:
      - "เป็นกลุ่มที่ทำให้สสารหมุนเวียน"
      - "ชื่อกลุ่มบอกสิ่งที่ทำ คือ ย่อย"
    misconceptions:
      - { match: "ผู้บริโภค", feedback: "ผู้บริโภคกินสิ่งมีชีวิตอื่น แต่ไม่ได้เปลี่ยนซากให้เป็นแร่ธาตุ" }
    solution: "ผู้ย่อยสลาย เช่น เห็ดรา และแบคทีเรีย ย่อยซากและของเสียให้เป็นแร่ธาตุ คาร์บอนไดออกไซด์ และน้ำ พืชจึงนำกลับไปใช้ใหม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.food-webs.p004
    topics: [biology.ecology.food-webs]
    difficulty: 2
    type: numeric
    stem: "ในโซ่อาหาร หญ้า → กระต่าย → งู ถ้าหญ้าตรึงพลังงานได้ 20,000 กิโลจูล และพลังงานส่งต่อได้ร้อยละ 10 ในแต่ละลำดับขั้น งูจะได้รับพลังงานประมาณกี่กิโลจูล"
    answer: { value: 200, unit: kJ }
    hints:
      - "พลังงานถูกส่งต่อสองครั้ง คือ หญ้าไปกระต่าย และกระต่ายไปงู"
      - "คูณด้วย 0.1 ทุกครั้งที่ส่งต่อ"
    misconceptions:
      - { match: 2000, feedback: "นี่คือพลังงานที่กระต่ายได้รับ ต้องส่งต่ออีกครั้งไปยังงู" }
      - { match: 20, feedback: "ส่งต่อมากเกินไปหนึ่งครั้ง จากหญ้าถึงงูส่งต่อเพียงสองครั้ง" }
    solution: "กระต่ายได้ $20{,}000 \\times 0.1 = 2{,}000$ kJ งูได้ $2{,}000 \\times 0.1 = 200$ kJ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.food-webs.p005
    topics: [biology.ecology.food-webs]
    difficulty: 2
    type: mcq
    stem: "จากสายใยอาหารในนาข้าว กบเป็นผู้บริโภคลำดับที่เท่าใด"
    figure: { src: rice-field-web.svg, alt: "สายใยอาหารในนาข้าว ลูกศรชี้จากผู้ถูกกินไปยังผู้กิน ข้าวถูกกินโดยเพลี้ยกระโดด ตั๊กแตน และหนูนา เพลี้ยกระโดดถูกกินโดยแมงมุม ตั๊กแตนถูกกินโดยแมงมุมและกบ แมงมุมถูกกินโดยกบ กบถูกกินโดยงูและนกกระยาง หนูนาถูกกินโดยงูและเหยี่ยว งูถูกกินโดยเหยี่ยว" }
    choices:
      - { id: a, text: "ลำดับที่ 2 เมื่อกินตั๊กแตน และลำดับที่ 3 เมื่อกินแมงมุม", correct: true }
      - { id: b, text: "ลำดับที่ 2 เท่านั้น", feedback: "กบกินแมงมุมด้วย ซึ่งเป็นผู้บริโภคลำดับที่ 2 กบจึงเป็นลำดับที่ 3 ในโซ่นั้น" }
      - { id: c, text: "ลำดับที่ 3 และลำดับที่ 4", feedback: "นับลำดับขั้นของโซ่อาหารแทนลำดับผู้บริโภค ผู้บริโภคลำดับที่ 1 อยู่ลำดับขั้นที่ 2" }
      - { id: d, text: "ลำดับที่ 1", feedback: "ผู้บริโภคลำดับที่ 1 กินผู้ผลิตโดยตรง กบไม่ได้กินข้าว" }
    hints:
      - "ดูว่ากบกินอะไรบ้าง"
      - "ไล่โซ่อาหารจากข้าวมาถึงกบทุกเส้นทาง แล้วนับเฉพาะผู้บริโภค"
    solution: "ข้าว → ตั๊กแตน → กบ กบเป็นผู้บริโภคลำดับที่ 2 ส่วน ข้าว → เพลี้ยกระโดดหรือตั๊กแตน → แมงมุม → กบ กบเป็นผู้บริโภคลำดับที่ 3"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.food-webs.p006
    topics: [biology.ecology.food-webs]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นตัวอย่างของประชากร"
    choices:
      - { id: a, text: "ปลานิลทั้งหมดในบ่อเลี้ยงปลาบ่อหนึ่ง", correct: true }
      - { id: b, text: "ปลาทุกชนิดในบ่อเลี้ยงปลาบ่อหนึ่ง", feedback: "ปลาหลายชนิดรวมกันเป็นส่วนหนึ่งของกลุ่มสิ่งมีชีวิต ไม่ใช่ประชากร" }
      - { id: c, text: "สิ่งมีชีวิตทุกชนิดในบ่อรวมกับน้ำและดินก้นบ่อ", feedback: "สิ่งมีชีวิตรวมกับสิ่งแวดล้อมคือระบบนิเวศ" }
      - { id: d, text: "ปลานิลหนึ่งตัว", feedback: "ประชากรต้องมีสิ่งมีชีวิตหลายตัว" }
    hints:
      - "ประชากรคือสิ่งมีชีวิตชนิดเดียวกันในบริเวณเดียวกัน"
      - "ถ้ามีหลายชนิดเรียกอย่างไร ถ้ารวมสิ่งแวดล้อมเรียกอย่างไร"
    solution: "ประชากรคือสิ่งมีชีวิตชนิดเดียวกันที่อยู่ในบริเวณเดียวกันในเวลาเดียวกัน ปลานิลทั้งหมดในบ่อจึงเป็นประชากร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.food-webs.p007
    topics: [biology.ecology.food-webs]
    difficulty: 2
    type: numeric
    stem: "จากสายใยอาหารในนาข้าว มีโซ่อาหารทั้งหมดกี่สาย (นับจากข้าวไปจนถึงผู้บริโภคที่ไม่มีใครกินต่อ)"
    figure: { src: rice-field-web.svg, alt: "สายใยอาหารในนาข้าว ลูกศรชี้จากผู้ถูกกินไปยังผู้กิน ข้าวถูกกินโดยเพลี้ยกระโดด ตั๊กแตน และหนูนา เพลี้ยกระโดดถูกกินโดยแมงมุม ตั๊กแตนถูกกินโดยแมงมุมและกบ แมงมุมถูกกินโดยกบ กบถูกกินโดยงูและนกกระยาง หนูนาถูกกินโดยงูและเหยี่ยว งูถูกกินโดยเหยี่ยว" }
    answer: { value: 8, unit: สาย }
    hints:
      - "โซ่อาหารต้องเริ่มที่ข้าวและจบที่นกกระยางหรือเหยี่ยว"
      - "ไล่ทีละทางจากเพลี้ยกระโดด ตั๊กแตน และหนูนา แล้วจดทุกเส้นทางไม่ให้ซ้ำ"
    misconceptions:
      - { match: 12, feedback: "12 คือจำนวนลูกศร ไม่ใช่จำนวนโซ่อาหาร" }
      - { match: 5, feedback: "นับเฉพาะโซ่ที่จบที่เหยี่ยว ยังขาดโซ่ที่จบที่นกกระยาง" }
    solution: "จบที่เหยี่ยว 5 สาย (ผ่านเพลี้ยกระโดด–แมงมุม–กบ–งู, ตั๊กแตน–แมงมุม–กบ–งู, ตั๊กแตน–กบ–งู, หนูนา–งู และหนูนาโดยตรง) จบที่นกกระยาง 3 สาย (ผ่านเพลี้ยกระโดด–แมงมุม–กบ, ตั๊กแตน–แมงมุม–กบ, ตั๊กแตน–กบ) รวม 8 สาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.food-webs.p008
    topics: [biology.ecology.food-webs]
    difficulty: 3
    type: numeric
    stem: "จากสายใยอาหารในนาข้าว มีโซ่อาหารที่ผ่านกบกี่สาย"
    figure: { src: rice-field-web.svg, alt: "สายใยอาหารในนาข้าว ลูกศรชี้จากผู้ถูกกินไปยังผู้กิน ข้าวถูกกินโดยเพลี้ยกระโดด ตั๊กแตน และหนูนา เพลี้ยกระโดดถูกกินโดยแมงมุม ตั๊กแตนถูกกินโดยแมงมุมและกบ แมงมุมถูกกินโดยกบ กบถูกกินโดยงูและนกกระยาง หนูนาถูกกินโดยงูและเหยี่ยว งูถูกกินโดยเหยี่ยว" }
    answer: { value: 6, unit: สาย }
    hints:
      - "นับเส้นทางจากข้าวมาถึงกบก่อน แล้วนับเส้นทางจากกบไปจนสุดโซ่"
      - "จำนวนโซ่ที่ผ่านกบ = (ทางเข้าสู่กบ) × (ทางออกจากกบ)"
    misconceptions:
      - { match: 3, feedback: "นับเพียงเส้นทางจากข้าวถึงกบ ยังต้องคูณด้วยเส้นทางจากกบไปถึงปลายโซ่" }
      - { match: 2, feedback: "นับเพียงผู้ล่าของกบ (งูและนกกระยาง) ต้องรวมเส้นทางที่มาถึงกบด้วย" }
    solution: "เส้นทางจากข้าวถึงกบมี 3 ทาง (ผ่านเพลี้ยกระโดด–แมงมุม ตั๊กแตน–แมงมุม และตั๊กแตนโดยตรง) จากกบไปปลายโซ่มี 2 ทาง (กบ → นกกระยาง และ กบ → งู → เหยี่ยว) รวม $3 \\times 2 = 6$ สาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.food-webs.p009
    topics: [biology.ecology.food-webs]
    difficulty: 3
    type: mcq
    stem: "จากสายใยอาหารในนาข้าว ถ้างูถูกจับไปขายจนเกือบหมด ผลที่น่าจะเกิดในช่วงแรกคือข้อใด"
    figure: { src: rice-field-web.svg, alt: "สายใยอาหารในนาข้าว ลูกศรชี้จากผู้ถูกกินไปยังผู้กิน ข้าวถูกกินโดยเพลี้ยกระโดด ตั๊กแตน และหนูนา เพลี้ยกระโดดถูกกินโดยแมงมุม ตั๊กแตนถูกกินโดยแมงมุมและกบ แมงมุมถูกกินโดยกบ กบถูกกินโดยงูและนกกระยาง หนูนาถูกกินโดยงูและเหยี่ยว งูถูกกินโดยเหยี่ยว" }
    choices:
      - { id: a, text: "หนูนาและกบเพิ่มขึ้น ข้าวถูกหนูกินมากขึ้น", correct: true }
      - { id: b, text: "หนูนาและกบลดลง เพราะงูหายไปจากระบบนิเวศ", feedback: "งูเป็นผู้ล่าของหนูนาและกบ เมื่อผู้ล่าลดลง เหยื่อมักเพิ่มขึ้น ไม่ใช่ลดลง" }
      - { id: c, text: "เหยี่ยวสูญพันธุ์ทันที เพราะไม่มีงูให้กิน", feedback: "เหยี่ยวยังกินหนูนาได้ สายใยอาหารมีทางเลือกหลายทาง" }
      - { id: d, text: "ไม่มีสิ่งมีชีวิตใดเปลี่ยนแปลง", feedback: "งูกินทั้งกบและหนูนา การหายไปของงูจึงส่งผลต่อสิ่งมีชีวิตอื่น" }
    hints:
      - "งูกินอะไรบ้าง และใครกินงู"
      - "เมื่อผู้ล่าลดลง เหยื่อจะเป็นอย่างไร แล้วเหยื่อนั้นกินอะไร"
    solution: "งูเป็นผู้ล่าของกบและหนูนา เมื่องูลดลง กบและหนูนาจึงเพิ่มขึ้น หนูนาที่เพิ่มขึ้นกินข้าวมากขึ้น ส่วนเหยี่ยวยังมีหนูนาเป็นอาหารจึงไม่สูญพันธุ์ทันที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.food-webs.p010
    topics: [biology.ecology.food-webs]
    difficulty: 3
    type: mcq
    stem: "บึงแห่งหนึ่งปนเปื้อนสารปรอทในปริมาณน้อย ในโซ่อาหาร สาหร่าย → กุ้งฝอย → ปลาช่อน → นกกาน้ำ สิ่งมีชีวิตใดน่าจะมีปรอทเข้มข้นในร่างกายมากที่สุด"
    choices:
      - { id: a, text: "นกกาน้ำ", correct: true }
      - { id: b, text: "สาหร่าย", feedback: "สาหร่ายรับปรอทจากน้ำโดยตรง แต่ผู้ล่ากินเหยื่อจำนวนมาก ปรอทจึงสะสมเข้มข้นขึ้นทุกลำดับขั้น" }
      - { id: c, text: "กุ้งฝอย", feedback: "กุ้งฝอยอยู่ลำดับต้นของโซ่อาหาร ความเข้มข้นยังไม่สูงเท่าผู้ล่าลำดับสูง" }
      - { id: d, text: "ทุกชนิดมีความเข้มข้นเท่ากัน", feedback: "ปรอทสลายตัวยากและสะสมในร่างกาย ความเข้มข้นจึงเพิ่มขึ้นตามลำดับขั้น" }
    hints:
      - "สารพิษที่สลายตัวยากจะถูกขับออกจากร่างกายหรือสะสมไว้"
      - "ผู้ล่าลำดับสูงกินเหยื่อที่มีสารพิษจำนวนมากตลอดชีวิต"
    solution: "ปรอทสลายตัวยากและสะสมในร่างกาย ผู้ล่าแต่ละลำดับกินเหยื่อจำนวนมาก ความเข้มข้นจึงเพิ่มขึ้นในแต่ละลำดับขั้น นกกาน้ำซึ่งเป็นผู้บริโภคลำดับสูงสุดจึงมีความเข้มข้นมากที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.food-webs.p011
    topics: [biology.ecology.food-webs]
    difficulty: 3
    type: order
    stem: "เรียงลำดับการหมุนเวียนของธาตุอาหารในป่า เริ่มจากใบไม้ที่ร่วงลงพื้น"
    items:
      - "ใบไม้แห้งร่วงลงบนพื้นป่า"
      - "เห็ดราและแบคทีเรียย่อยสลายใบไม้"
      - "แร่ธาตุถูกปล่อยกลับสู่ดิน"
      - "รากพืชดูดแร่ธาตุขึ้นไปใช้"
      - "พืชสร้างใบใหม่"
    hints:
      - "ผู้ย่อยสลายทำงานก่อนที่แร่ธาตุจะกลับสู่ดิน"
      - "พืชต้องดูดแร่ธาตุก่อนจึงสร้างใบใหม่ได้"
    solution: "ใบไม้ร่วง → ผู้ย่อยสลายย่อย → แร่ธาตุกลับสู่ดิน → รากดูดแร่ธาตุ → พืชสร้างใบใหม่ สสารจึงหมุนเวียนในระบบนิเวศ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.food-webs.p012
    topics: [biology.ecology.food-webs]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นเหตุผลที่พลังงานส่งต่อไปยังลำดับขั้นถัดไปได้เพียงประมาณร้อยละ 10 (เลือกได้มากกว่า 1 ข้อ)"
    choices:
      - { id: a, text: "สิ่งมีชีวิตใช้พลังงานในการหายใจระดับเซลล์และสูญเสียเป็นความร้อน", correct: true }
      - { id: b, text: "บางส่วนของเหยื่อไม่ถูกกินหรือย่อยไม่ได้ เช่น กระดูก ขน", correct: true }
      - { id: c, text: "บางส่วนถูกขับออกเป็นของเสีย", correct: true }
      - { id: d, text: "พลังงานถูกส่งกลับไปให้ผู้ผลิตใช้ใหม่", feedback: "พลังงานไหลทางเดียว ไม่หมุนกลับไปที่ผู้ผลิต สิ่งที่หมุนเวียนคือสสาร" }
    hints:
      - "พลังงานที่กินเข้าไปไม่ได้กลายเป็นเนื้อเยื่อทั้งหมด"
      - "คิดถึงสิ่งที่สัตว์ทำทุกวันและสิ่งที่เหลือจากการกิน"
    solution: "พลังงานส่วนใหญ่ใช้ในการหายใจระดับเซลล์และกลายเป็นความร้อน บางส่วนไม่ถูกกินหรือย่อยไม่ได้ และบางส่วนถูกขับถ่าย จึงเหลือสะสมเป็นเนื้อเยื่อให้ลำดับถัดไปเพียงราวร้อยละ 10 ส่วนพลังงานไม่หมุนกลับไปที่ผู้ผลิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.food-webs.p013
    topics: [biology.ecology.food-webs]
    difficulty: 4
    type: numeric
    stem: "แพลงก์ตอนพืชในทะเลสาบตรึงพลังงานได้ 50,000 กิโลจูล ในโซ่อาหาร แพลงก์ตอนพืช → แพลงก์ตอนสัตว์ → ปลาเล็ก → ปลาใหญ่ ถ้าพลังงานส่งต่อได้ร้อยละ 10 ในแต่ละลำดับขั้น ปลาใหญ่จะได้รับพลังงานประมาณกี่กิโลจูล"
    answer: { value: 50, unit: kJ }
    hints:
      - "ปลาใหญ่เป็นผู้บริโภคลำดับที่ 3 พลังงานถูกส่งต่อกี่ครั้ง"
      - "คูณ 50,000 ด้วย 0.1 ตามจำนวนครั้งที่ส่งต่อ"
    misconceptions:
      - { match: 500, feedback: "นี่คือพลังงานของปลาเล็ก ยังขาดการส่งต่ออีกหนึ่งครั้ง" }
      - { match: 5, feedback: "ส่งต่อเกินไปหนึ่งครั้ง จากแพลงก์ตอนพืชถึงปลาใหญ่ส่งต่อ 3 ครั้ง" }
    solution: "ส่งต่อ 3 ครั้ง $50{,}000 \\times 0.1 \\times 0.1 \\times 0.1 = 50$ kJ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.food-webs.p014
    topics: [biology.ecology.food-webs]
    difficulty: 4
    type: numeric
    stem: "จากกราฟ ความเข้มข้นของดีดีทีในนกกินปลาเป็นกี่เท่าของแพลงก์ตอนสัตว์"
    figure: { src: ddt-biomagnification.svg, alt: "กราฟแท่งแกนตั้งเป็นสเกลลอการิทึม แสดงความเข้มข้นของดีดีทีเป็นส่วนในล้านส่วน (ppm) เรียงตามลำดับขั้นในโซ่อาหาร น้ำ 0.00005 แพลงก์ตอนสัตว์ 0.04 ปลาเล็ก 0.5 ปลาใหญ่ 2 นกกินปลา 25 เป็นข้อมูลตัวอย่าง" }
    answer: { value: 625, unit: เท่า }
    hints:
      - "อ่านค่าของนกกินปลาและแพลงก์ตอนสัตว์จากกราฟ"
      - "จำนวนเท่า = ค่าของนกกินปลา ÷ ค่าของแพลงก์ตอนสัตว์"
    misconceptions:
      - { match: 0.0016, feedback: "หารกลับด้าน ต้องเอาค่าของนกกินปลาเป็นตัวตั้ง" }
      - { match: 500000, feedback: "นี่คือการเทียบกับน้ำ ข้อนี้ให้เทียบกับแพลงก์ตอนสัตว์" }
    solution: "$25 \\div 0.04 = 625$ เท่า ดีดีทีเข้มข้นขึ้นมากตามลำดับขั้นเพราะสลายตัวยากและสะสมในไขมัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.food-webs.p015
    topics: [biology.ecology.food-webs]
    difficulty: 4
    type: mcq
    stem: "ถ้าผึ้งและแมลงผสมเกสรในประเทศไทยลดลงมาก ผลผลิตของพืชใดน่าจะได้รับผลกระทบน้อยที่สุด"
    choices:
      - { id: a, text: "ข้าว", correct: true }
      - { id: b, text: "ลำไย", feedback: "ลำไยอาศัยผึ้งและแมลงช่วยถ่ายเรณู ชาวสวนบางแห่งจึงนำรังผึ้งเข้าสวน" }
      - { id: c, text: "ทุเรียน", feedback: "ทุเรียนต้องการสัตว์ช่วยถ่ายเรณู เช่น ค้างคาวและแมลง ผลผลิตจึงขึ้นกับสัตว์ผสมเกสร" }
      - { id: d, text: "แตงโม", feedback: "แตงโมมีดอกเพศผู้และดอกเพศเมียแยกกัน ต้องอาศัยแมลงพาเรณูไป" }
    hints:
      - "พืชแต่ละชนิดถ่ายเรณูด้วยวิธีต่างกัน"
      - "พืชวงศ์หญ้าส่วนใหญ่อาศัยลมหรือผสมตัวเองได้"
    solution: "ข้าวผสมตัวเองได้เป็นส่วนใหญ่และอาศัยลม ไม่ต้องพึ่งแมลง ส่วนลำไย ทุเรียน และแตงโมต้องอาศัยสัตว์ผสมเกสร การลดลงของแมลงผสมเกสรจึงกระทบความมั่นคงทางอาหารผ่านผลไม้และพืชผักเหล่านี้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.food-webs.p016
    topics: [biology.ecology.food-webs]
    difficulty: 5
    type: numeric
    stem: "นักเรียนวัดพลังงานในโซ่อาหารหนึ่งได้ ผู้ผลิต 12,000 kJ ผู้บริโภคลำดับที่ 1 1,500 kJ ผู้บริโภคลำดับที่ 2 120 kJ ประสิทธิภาพการถ่ายทอดพลังงานจากผู้บริโภคลำดับที่ 1 ไปยังผู้บริโภคลำดับที่ 2 เป็นร้อยละเท่าใด"
    answer: { value: 8, unit: "%" }
    hints:
      - "ประสิทธิภาพ = (พลังงานของลำดับที่รับ ÷ พลังงานของลำดับที่ให้) × 100"
      - "ลำดับที่ให้คือผู้บริโภคลำดับที่ 1 ลำดับที่รับคือผู้บริโภคลำดับที่ 2"
    misconceptions:
      - { match: 12.5, feedback: "นี่คือประสิทธิภาพจากผู้ผลิตไปผู้บริโภคลำดับที่ 1 หรือหารกลับด้าน ตรวจว่าใช้ 120 ÷ 1,500" }
      - { match: 1, feedback: "นี่คือร้อยละจากผู้ผลิตไปถึงผู้บริโภคลำดับที่ 2 ข้อนี้ถามเพียงขั้นเดียว" }
    solution: "$\\frac{120}{1{,}500} \\times 100 = 8\\%$ ต่ำกว่าค่าประมาณร้อยละ 10 เล็กน้อย แสดงว่าประสิทธิภาพจริงแตกต่างกันไปในแต่ละลำดับขั้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.food-webs.p017
    topics: [biology.ecology.food-webs]
    difficulty: 5
    type: mcq
    stem: "ชาวนาฉีดยาฆ่าแมลงที่ฆ่าได้หลายชนิดในนาข้าวทุกสัปดาห์ ผ่านไปไม่กี่เดือน เพลี้ยกระโดดกลับระบาดหนักกว่านาข้างเคียงที่ไม่ได้ฉีด คำอธิบายใดสอดคล้องกับความรู้เรื่องสายใยอาหารมากที่สุด"
    choices:
      - { id: a, text: "ยาฆ่าแมงมุมและแมลงที่เป็นผู้ล่าของเพลี้ยกระโดดไปด้วย เมื่อผู้ล่าลดลง เพลี้ยกระโดดที่เหลือจึงเพิ่มจำนวนได้เร็ว", correct: true }
      - { id: b, text: "ยาฆ่าแมลงเป็นอาหารของเพลี้ยกระโดด", feedback: "ยาฆ่าแมลงไม่ใช่อาหาร และไม่ได้ให้พลังงานแก่เพลี้ยกระโดด" }
      - { id: c, text: "ข้าวสร้างพลังงานได้มากขึ้นเมื่อได้รับยาฆ่าแมลง จึงเลี้ยงเพลี้ยได้มากขึ้น", feedback: "ยาฆ่าแมลงไม่ได้เพิ่มการสังเคราะห์ด้วยแสง และไม่ได้อธิบายว่าทำไมนาข้างเคียงระบาดน้อยกว่า" }
      - { id: d, text: "เพลี้ยกระโดดเป็นผู้บริโภคลำดับสูงสุด จึงไม่ได้รับผลจากยา", feedback: "เพลี้ยกระโดดกินข้าวโดยตรง เป็นผู้บริโภคลำดับที่ 1 ไม่ใช่ลำดับสูงสุด" }
    hints:
      - "ยาฆ่าแมลงที่ฆ่าได้หลายชนิดฆ่าเฉพาะศัตรูพืชหรือไม่"
      - "ใครกินเพลี้ยกระโดดในสายใยอาหาร"
    solution: "ยาที่ฆ่าได้หลายชนิดฆ่าผู้ล่าตามธรรมชาติ เช่น แมงมุม ไปด้วย เพลี้ยกระโดดสืบพันธุ์เร็วและบางตัวรอดจากยา เมื่อไม่มีผู้ล่าควบคุม จึงเพิ่มจำนวนจนระบาด การรักษาผู้ล่าตามธรรมชาติจึงช่วยรักษาสมดุลของระบบนิเวศ"
    license: CC-BY-SA-4.0
    ai_assisted: true
