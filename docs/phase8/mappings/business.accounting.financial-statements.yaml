  - { framework: th-tqf-accounting, indicators: ["8.1.1"], coverage: partial, note: "เกณฑ์คงค้าง รายการปรับปรุง (ค่าเสื่อมราคาเส้นตรง ค่าใช้จ่ายค้างจ่าย รายได้รับล่วงหน้า) ต้นทุนขายแบบสิ้นงวด การจัดทำงบแสดงฐานะการเงิน งบกำไรขาดทุน งบแสดงการเปลี่ยนแปลงส่วนของเจ้าของ งบกระแสเงินสดอย่างง่าย ความเชื่อมโยงของงบ และขอบเขตของ TFRS for NPAEs กับ TFRS ฉบับเต็ม ยังไม่มีงบการเงินรวม นโยบายการบัญชีและการเปิดเผยข้อมูลในหมายเหตุ รายงานความยั่งยืนและรายงานฉบับบูรณาการ" }
