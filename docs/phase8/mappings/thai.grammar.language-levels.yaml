  - { framework: th-core-2551-thai, indicators: ["ท 4.1 ป.2/5", "ท 4.1 ป.3/6"], coverage: full, note: "เลือกใช้ภาษาไทยมาตรฐานหรือภาษาถิ่นตามสถานการณ์ (ครอบครัว ชุมชน ประเพณี ห้องเรียน)" }
  - { framework: th-core-2551-thai, indicators: ["ท 4.1 ป.4/7", "ท 4.1 ป.5/3"], coverage: full, note: "เปรียบเทียบคำในภาษาไทยมาตรฐานกับถิ่นเหนือ อีสาน ใต้ (พูด อร่อย อะไร ไม่) และเปรียบเทียบที่คำ สำเนียง และการเรียงประโยค" }
  - { framework: th-core-2551-thai, indicators: ["ท 4.1 ป.6/2"], coverage: full, note: "เลือกคำ สรรพนาม และคำลงท้ายให้เหมาะกับครูและผู้อำนวยการ แก้ข้อความแชตถึงครู" }
  - { framework: th-core-2551-thai, indicators: ["ท 4.1 ม.1/4"], coverage: full, note: "ตารางความต่างของภาษาพูดกับภาษาเขียน (คำลงท้าย คำตัด ภาษาปาก การละประธาน) และเปลี่ยนภาษาพูดเป็นภาษาเขียน" }
  - { framework: th-core-2551-thai, indicators: ["ท 4.1 ม.3/3"], coverage: full, note: "ระดับภาษา 5 ระดับและแบบ 3 ระดับ วิเคราะห์ระดับจากคำ รูปประโยค และสถานการณ์" }
  - { framework: th-core-2551-thai, indicators: ["ท 4.1 ม.4-6/3"], coverage: partial, note: "ใช้ภาษาให้เหมาะกับโอกาสในพิธีและบุคคล แต่คำราชาศัพท์สอนไว้ใน thai.grammar.royal-vocabulary บทนี้อ้างถึงเท่านั้น" }
