id: health.safety.cpr-full
subject: health
title:
  th: การช่วยฟื้นคืนชีพขั้นพื้นฐานสำหรับผู้ใหญ่ เด็ก และทารก
  en: Basic life support for adults, children and infants
summary: ห่วงโซ่การรอดชีวิต CPR แบบกดหน้าอกร่วมกับช่วยหายใจ 30:2 ความแตกต่างในเด็กและทารกตามแนวทาง AHA 2025 การใช้ AED การช่วยคนจมน้ำ และการโทร 1669 ต้องฝึกจริงกับครูฝึก
difficulty: 4.5
minutes: 35
prerequisites:
- health.safety.first-aid
encompasses:
- id: health.safety.first-aid
  weight: 0.3
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  title: ห่วงโซ่การรอดชีวิต
  src: chain.svg
  alt: ห้าห่วงเรียงต่อกัน 1 รู้และโทร 1669 2 CPR ทันที กดหน้าอกคุณภาพสูง 3 AED ช็อกให้เร็วที่สุด 4 ทีมแพทย์ฉุกเฉิน รักษาขั้นสูง 5 โรงพยาบาล ดูแลและฟื้นฟู ด้านล่างเขียนว่าห่วงที่ 1 ถึง 3 ทำได้โดยคนที่อยู่ในที่เกิดเหตุ ก่อนรถพยาบาลมาถึง
- type: figure
  title: วิธีกดหน้าอกตามวัย
  src: hands.svg
  alt: แผนภาพลำตัวสามขนาด ผู้ใหญ่ สองมือ ลึก 5 ถึง 6 ซม. เด็ก หนึ่งหรือสองมือ ลึกราว 5 ซม. ทารก นิ้วโป้งโอบรอบอก หรือส้นมือข้างเดียว ลึกราว 4 ซม. ทุกภาพมีจุดแดงที่กึ่งกลางหน้าอก ครึ่งล่างของกระดูกหน้าอก ด้านล่างเขียนว่าทุกวัยกด 100 ถึง 120 ครั้งต่อนาที
  caption: แผนภาพนี้ไม่แทนการฝึกกับหุ่นจำลองและครูฝึก
- type: worked-example
  title: คิดจังหวะและจำนวนครั้ง
  problem: ผู้ช่วยคนเดียวทำ CPR ผู้ใหญ่ด้วยอัตรา 30:2 กดที่อัตรา 100 ครั้งต่อนาที และเป่าลมรวมครั้งละประมาณ 5 วินาทีต่อรอบ หนึ่งรอบใช้เวลาเท่าไร และใน 2 นาทีทำได้ประมาณกี่รอบ
  steps:
  - text: 'เวลากด 30 ครั้งที่ 100 ครั้งต่อนาที: $\frac{30}{100} \times 60 = 18$ วินาที'
  - text: 'รวมเวลาช่วยหายใจ 2 ครั้ง: $18 + 5 = 23$ วินาทีต่อรอบ'
    why: แนวทางให้หยุดกดเพื่อช่วยหายใจให้สั้นที่สุด ไม่ควรเกินราว 10 วินาที
  - text: 2 นาที $= 120$ วินาที ทำได้ $120 \div 23 \approx 5.2$ หรือประมาณ 5 รอบ
  - text: จึงเป็นที่มาของการสลับคนกดทุกราว 5 รอบหรือ 2 นาที
  answer: รอบละประมาณ 23 วินาที ใน 2 นาทีได้ราว 5 รอบ
- type: check
  problem: health.safety.cpr-full.p004
  prompt: ลองตอบก่อนอ่านต่อ
- type: figure
  title: ตำแหน่งติดแผ่น AED
  src: aed-pads.svg
  alt: แผนภาพลำตัวผู้ใหญ่ด้านหน้า แผ่น 1 อยู่ใต้ไหปลาร้าขวาของผู้ป่วย แผ่น 2 อยู่ชายโครงซ้ายใต้รักแร้ ด้านขวาเป็นทารกด้านหน้ามีแผ่น 1 กลางหน้าอก และทารกด้านหลังมีแผ่น 2 กลางหลัง เขียนว่าหน้าอกเล็ก แผ่นหนึ่งกลางหน้าอก อีกแผ่นกลางหลัง ใช้แผ่นเด็กหรือตัวลดพลังงานถ้ามี
- type: worked-example
  title: ช่วยทารกที่ไม่หายใจ
  problem: พี่เลี้ยงพบทารกอายุ 6 เดือนนอนนิ่ง ตัวเขียว ไม่ตอบสนองเมื่อดีดฝ่าเท้า และไม่หายใจ พี่เลี้ยงเคยผ่านการอบรม CPR ทารก ควรทำอย่างไร
  steps:
  - text: ตะโกนขอความช่วยเหลือ และใช้โทรศัพท์โทร 1669 เปิดลำโพงทันที
  - text: วางทารกบนพื้นแข็ง กดหน้าอกด้วยนิ้วโป้งสองข้างโอบรอบอก หรือส้นมือข้างเดียว ลึกประมาณ 4 ซม. อัตรา 100–120 ครั้งต่อนาที
    why: แนวทาง AHA 2025 ยกเลิกการกดด้วยสองนิ้วเพราะลึกไม่พอ
  - text: กด 30 ครั้ง แล้วช่วยหายใจ 2 ครั้ง โดยใช้ปากครอบทั้งปากและจมูกของทารก เป่าเบา ๆ พอให้หน้าอกยก
  - text: ทำต่อเป็นรอบ 30:2 ถ้ามี AED ใช้แผ่นเด็ก ติดหน้า–หลัง จนเจ้าหน้าที่มาถึงหรือทารกหายใจเอง
  answer: โทร 1669 ทันที แล้ว CPR 30:2 ด้วยเทคนิคสำหรับทารก
- type: check
  problem: health.safety.cpr-full.p010
glossary:
- term: CPR
  definition: การช่วยฟื้นคืนชีพ ประกอบด้วยการกดหน้าอกและการช่วยหายใจ เพื่อให้เลือดและออกซิเจนไปเลี้ยงสมองระหว่างที่หัวใจหยุดเต้น
- term: AED
  definition: เครื่องกระตุกหัวใจไฟฟ้าอัตโนมัติ วิเคราะห์จังหวะหัวใจเองและบอกด้วยเสียงว่าต้องทำอะไร คนทั่วไปใช้ได้
- term: หายใจเฮือก
  definition: การหายใจเป็นช่วง ๆ ผิดปกติที่พบได้หลังหัวใจหยุดเต้น ไม่ใช่การหายใจปกติ ต้องเริ่ม CPR
- term: ห่วงโซ่การรอดชีวิต
  definition: ลำดับการช่วยเหลือผู้ป่วยหัวใจหยุดเต้น ตั้งแต่โทรแจ้งเหตุ CPR AED การรักษาขั้นสูง จนถึงการดูแลในโรงพยาบาล
- term: ท่าพักฟื้น
  definition: การจัดผู้ที่หายใจปกติแต่ไม่รู้สึกตัวให้นอนตะแคง เพื่อไม่ให้ลิ้นตกและไม่สำลัก
flashcards:
- front: CPR ผู้ใหญ่
  back: กดลึก 5–6 ซม. อัตรา 100–120 ครั้ง/นาที กด:เป่า 30:2 ปล่อยให้หน้าอกคืนตัวสุด
- front: CPR ทารก (AHA 2025)
  back: นิ้วโป้งสองข้างโอบรอบอกหรือส้นมือข้างเดียว ลึกราว 4 ซม. (1 ใน 3 ของหน้าอก) ไม่ใช้สองนิ้วแล้ว
- front: AED กับเด็กเล็กและทารก
  back: ใช้แผ่นเด็กหรือตัวลดพลังงานถ้ามี ถ้าไม่มีใช้แผ่นผู้ใหญ่ ติดหน้า–หลังไม่ให้แผ่นชนกัน
- front: ช่วยคนจมน้ำ
  back: ตะโกน โยน ยื่น ขึ้นจากน้ำแล้วไม่หายใจให้ CPR พร้อมช่วยหายใจ ห้ามอุ้มพาดบ่าเอาน้ำออก
