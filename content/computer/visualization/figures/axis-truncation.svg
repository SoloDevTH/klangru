<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" width="640" height="372" font-family="sans-serif" font-size="15">
  <title>แผนภูมิแท่งค่าเดียวกันบนแกนที่เริ่มต่างกัน</title>
  <rect x="0" y="0" width="640" height="372" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#15211e">ค่าเดียวกัน สองแกน ตีความต่างกันมาก (ค่าสมมติ)</text>
  <text x="185" y="58" text-anchor="middle" font-size="15" font-weight="bold" fill="#15211e">แกนเริ่มที่ 50 (ตัดแกน)</text>
  <line x1="60" y1="270" x2="310" y2="270" stroke="#15211e" stroke-width="2"/>
  <line x1="60" y1="90" x2="60" y2="270" stroke="#15211e" stroke-width="2"/>
  <text x="52" y="274" text-anchor="end" font-size="13" fill="#15211e">50</text>
  <text x="52" y="94" text-anchor="end" font-size="13" fill="#15211e">60</text>
  <rect x="85" y="234.0" width="50" height="36.0" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="110" y="226.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#15211e">52</text>
  <text x="110" y="290" text-anchor="middle" font-size="13" fill="#15211e">บริการ A</text>
  <rect x="160" y="180.0" width="50" height="90.0" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="185" y="172.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#15211e">55</text>
  <text x="185" y="290" text-anchor="middle" font-size="13" fill="#15211e">บริการ B</text>
  <rect x="235" y="126.0" width="50" height="144.0" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="260" y="118.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#15211e">58</text>
  <text x="260" y="290" text-anchor="middle" font-size="13" fill="#15211e">บริการ C</text>
  <text x="185" y="316" text-anchor="middle" font-size="13" fill="#b5562b">บริการ C ดูสูงกว่า A ราวสี่เท่า</text>
  <text x="475" y="58" text-anchor="middle" font-size="15" font-weight="bold" fill="#15211e">แกนเริ่มที่ 0</text>
  <line x1="350" y1="270" x2="600" y2="270" stroke="#15211e" stroke-width="2"/>
  <line x1="350" y1="90" x2="350" y2="270" stroke="#15211e" stroke-width="2"/>
  <text x="342" y="274" text-anchor="end" font-size="13" fill="#15211e">0</text>
  <text x="342" y="94" text-anchor="end" font-size="13" fill="#15211e">60</text>
  <rect x="375" y="114.0" width="50" height="156.0" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="400" y="106.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#15211e">52</text>
  <text x="400" y="290" text-anchor="middle" font-size="13" fill="#15211e">บริการ A</text>
  <rect x="450" y="105.0" width="50" height="165.0" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="475" y="97.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#15211e">55</text>
  <text x="475" y="290" text-anchor="middle" font-size="13" fill="#15211e">บริการ B</text>
  <rect x="525" y="96.0" width="50" height="174.0" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="550" y="88.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#15211e">58</text>
  <text x="550" y="290" text-anchor="middle" font-size="13" fill="#15211e">บริการ C</text>
  <text x="475" y="316" text-anchor="middle" font-size="13" fill="#4a5a55">ความต่างจริงคือ 6 คะแนนจาก 52 ถึง 58</text>
  <text x="320" y="354" text-anchor="middle" font-size="13" fill="#4a5a55">ตัวเลขเหนือแท่งคือค่าจริงของคะแนนความพึงพอใจ</text>
</svg>
