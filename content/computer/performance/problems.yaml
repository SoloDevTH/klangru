problems:
  - id: computer.networks.performance.p001
    topics: [computer.networks.performance]
    difficulty: 1
    type: mcq
    stem: "แพ็กเกจอินเทอร์เน็ตบ้านโฆษณาว่า \"ความเร็ว 500 ...\" หน่วยใดใช้บอก **แบนด์วิดท์**"
    choices:
      - { id: a, text: "Mbps (เมกะบิตต่อวินาที)", correct: true }
      - { id: b, text: "MB (เมกะไบต์)", feedback: "MB เป็นหน่วยขนาดข้อมูล ไม่ได้บอกว่าต่อวินาที" }
      - { id: c, text: "ms (มิลลิวินาที)", feedback: "ms เป็นหน่วยเวลา ใช้บอกความหน่วง ไม่ใช่แบนด์วิดท์" }
      - { id: d, text: "GHz (กิกะเฮิรตซ์)", feedback: "GHz บอกความถี่ เช่น ความถี่สัญญาณนาฬิกาของหน่วยประมวลผลหรือคลื่น Wi-Fi ไม่ใช่อัตราการส่งข้อมูล" }
    hints:
      - "แบนด์วิดท์คืออัตรา จึงต้องมี ต่อวินาที"
      - "อินเทอร์เน็ตวัดเป็นบิต ไม่ใช่ไบต์"
    solution: "แบนด์วิดท์วัดเป็นบิตต่อวินาที แพ็กเกจบ้านนิยมใช้ Mbps เช่น 500 Mbps"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.performance.p002
    topics: [computer.networks.performance]
    difficulty: 1
    type: match
    stem: "จับคู่คำกับความหมาย"
    pairs:
      - { left: "แบนด์วิดท์", right: "ส่งข้อมูลได้มากที่สุดกี่บิตต่อวินาที" }
      - { left: "ความหน่วง", right: "ข้อมูลใช้เวลาเดินทางนานเท่าใด" }
      - { left: "ความแออัด", right: "ข้อมูลเข้ามามากกว่าที่ส่งออกได้ คิวจึงยาว" }
      - { left: "คอขวด", right: "ลิงก์ที่ช้าที่สุดบนเส้นทาง" }
    hints:
      - "นึกถึงท่อน้ำ ความกว้างกับความยาวต่างกันอย่างไร"
      - "คอขวดคือจุดที่แคบที่สุด"
    solution: "แบนด์วิดท์ = อัตราสูงสุด ความหน่วง = เวลาเดินทาง ความแออัด = ภาระเกินความจุจนคิวยาว คอขวด = ลิงก์ที่ช้าที่สุดซึ่งจำกัดทั้งเส้นทาง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.performance.p003
    topics: [computer.networks.performance]
    difficulty: 2
    type: numeric
    stem: "ดาวน์โหลดเกมขนาด 450 MB ด้วยความเร็ว 60 Mbps ตลอดเวลา ใช้เวลาอย่างน้อยกี่วินาที (1 MB = 1,000,000 ไบต์)"
    answer: { value: 60, unit: วินาที }
    hints:
      - "แปลงขนาดไฟล์จากเมกะไบต์เป็นเมกะบิตก่อน"
      - "เวลา = ขนาด (เมกะบิต) ÷ อัตรา (เมกะบิตต่อวินาที)"
    misconceptions:
      - { match: 7.5, feedback: "หาร 450 ด้วย 60 โดยไม่แปลงไบต์เป็นบิต ต้องคูณ 8 ก่อน" }
      - { match: 0.9375, feedback: "หารด้วย 8 แทนการคูณ 1 ไบต์มี 8 บิต จำนวนบิตจึงมากกว่าจำนวนไบต์" }
    solution: "450 MB × 8 = 3,600 เมกะบิต เวลา = 3,600 ÷ 60 = 60 วินาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.performance.p004
    topics: [computer.networks.performance]
    difficulty: 2
    type: mcq
    stem: "ต้นมีอินเทอร์เน็ต 1 Gbps แต่เล่นเกมกับเซิร์ฟเวอร์ในอีกทวีปแล้วตัวละครขยับช้ากว่าที่กดเสมอ สาเหตุหลักคืออะไร"
    choices:
      - { id: a, text: "ความหน่วงสูง เพราะสัญญาณต้องเดินทางไกลหลายพันกิโลเมตรและผ่านเราเตอร์หลายตัว", correct: true }
      - { id: b, text: "แบนด์วิดท์ไม่พอ ต้องอัปเกรดเป็น 2 Gbps", feedback: "เกมส่งข้อมูลครั้งละน้อย แบนด์วิดท์ 1 Gbps เหลือเฟือ เพิ่มแบนด์วิดท์ไม่ทำให้สัญญาณเดินทางเร็วขึ้น" }
      - { id: c, text: "ไฟล์เกมใหญ่เกินไป", feedback: "ขนาดไฟล์เกมมีผลตอนดาวน์โหลด ไม่ใช่ตอนเล่นออนไลน์" }
      - { id: d, text: "จอภาพมีความละเอียดต่ำ", feedback: "ความละเอียดจอไม่เกี่ยวกับเวลาที่ข้อมูลเดินทางไปเซิร์ฟเวอร์" }
    hints:
      - "เกมออนไลน์ส่งข้อมูลครั้งละน้อยแต่ต้องการคำตอบเร็ว"
      - "ระยะทางมีผลต่อส่วนใดของความหน่วง"
    solution: "ปัญหาคือความหน่วง ไม่ใช่แบนด์วิดท์ สัญญาณต้องใช้เวลาเดินทางตามระยะทาง ระยะหลายพันกิโลเมตรใช้หลายสิบมิลลิวินาทีต่อเที่ยว วิธีแก้คือเลือกเซิร์ฟเวอร์ที่อยู่ใกล้ เช่น ในภูมิภาคเดียวกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.performance.p005
    topics: [computer.networks.performance]
    difficulty: 2
    type: numeric
    stem: "อินเทอร์เน็ตความเร็ว 200 Mbps ดาวน์โหลดได้เร็วสุดกี่ **เมกะไบต์ต่อวินาที**"
    answer: { value: 25, unit: MB/s }
    hints:
      - "1 ไบต์ = 8 บิต"
      - "แปลงบิตเป็นไบต์ต้องหารหรือคูณด้วย 8"
    misconceptions:
      - { match: 200, feedback: "Mbps (บิต) กับ MB/s (ไบต์) ไม่เท่ากัน ต้องแปลงหน่วย" }
      - { match: 1600, feedback: "คูณ 8 แทนการหาร จำนวนไบต์ต้องน้อยกว่าจำนวนบิต" }
    solution: "200 Mbps ÷ 8 = 25 MB/s นี่คือเหตุผลที่โปรแกรมดาวน์โหลดซึ่งแสดงเป็น MB/s ดูเหมือนช้ากว่าที่โฆษณา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.performance.p006
    topics: [computer.networks.performance]
    difficulty: 2
    type: text
    stem: "คำสั่งใดใช้ส่งแพ็กเก็ตเล็ก ๆ ไปยังเครื่องปลายทางแล้ววัดเวลาไปกลับ (RTT) (ตอบชื่อคำสั่ง)"
    accepted: ["ping"]
    misconceptions:
      - { match: "dns", feedback: "DNS แปลชื่อโดเมนเป็นที่อยู่ IP ไม่ได้วัดเวลาไปกลับ" }
      - { match: "http", feedback: "HTTP เป็นโพรโทคอลขอหน้าเว็บ ไม่ใช่คำสั่งวัดความหน่วง" }
    hints:
      - "ชื่อคำสั่งเลียนเสียงโซนาร์ของเรือดำน้ำ"
      - "มีสี่ตัวอักษร ขึ้นต้นด้วย p"
    solution: "ping ส่งแพ็กเก็ตเล็ก ๆ แล้วรอคำตอบ แสดงเวลาไปกลับเป็นมิลลิวินาที ใช้ตรวจทั้งความหน่วงและว่าเครื่องปลายทางยังติดต่อได้หรือไม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.performance.p007
    topics: [computer.networks.performance]
    difficulty: 3
    type: numeric
    stem: "สัญญาณเดินทางในใยแก้วนำแสงด้วยอัตราเร็วประมาณ $2 \\times 10^8$ m/s ถ้าสายจากกรุงเทพฯ ถึงหาดใหญ่ยาว 950 km (ระยะสมมติ) เวลาเดินทางของสัญญาณ **เที่ยวเดียว** เป็นกี่มิลลิวินาที"
    answer: { value: 4.75, tolerance: 0.05, unit: ms }
    hints:
      - "แปลง 950 km เป็นเมตรก่อน"
      - "เวลา = ระยะทาง ÷ อัตราเร็ว แล้วคูณ 1,000 เพื่อเป็นมิลลิวินาที"
    misconceptions:
      - { match: 3.17, feedback: "ใช้อัตราเร็วแสงในสุญญากาศ 3 × 10⁸ m/s แต่แสงในใยแก้วช้ากว่า ประมาณ 2 × 10⁸ m/s" }
      - { match: 9.5, feedback: "นี่คือเวลาไปกลับ โจทย์ถามเที่ยวเดียว" }
    solution: "950,000 ÷ (2 × 10⁸) = 0.00475 วินาที = 4.75 ms ส่วนนี้ลดด้วยการเพิ่มแบนด์วิดท์ไม่ได้ ต้องลดระยะทาง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.performance.p008
    topics: [computer.networks.performance]
    difficulty: 3
    type: numeric
    stem: "ห้องเรียนมีอินเทอร์เน็ต 100 Mbps ครูอยากให้ใช้งานไม่เกิน 80% ของความจุเพื่อไม่ให้คิวยาว ถ้าวิดีโอแต่ละสตรีมใช้ 25 Mbps จะเปิดพร้อมกันได้มากที่สุดกี่สตรีม"
    answer: { value: 3, unit: สตรีม }
    hints:
      - "80% ของ 100 Mbps เท่ากับเท่าใด"
      - "หารด้วย 25 แล้วปัดลง เพราะเปิดเป็นเศษสตรีมไม่ได้"
    misconceptions:
      - { match: 4, feedback: "4 สตรีมใช้ 100 Mbps เต็มความจุ เกินเกณฑ์ 80% ที่ครูตั้งไว้ คิวจะยาวมาก" }
      - { match: 3.2, feedback: "จำนวนสตรีมต้องเป็นจำนวนเต็ม ต้องปัดลง" }
    solution: "80% × 100 = 80 Mbps หาร 25 ได้ 3.2 ปัดลงเป็น 3 สตรีม (ใช้ 75 Mbps = 75%) การเว้นช่องว่างไว้ช่วยให้เวลาเข้าคิวไม่พุ่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.performance.p009
    topics: [computer.networks.performance]
    difficulty: 3
    type: numeric
    stem: "จากแผนผังเครือข่ายโรงเรียนในภาพ ถ้าคอมพิวเตอร์ในห้องสมุดเครื่องเดียวคัดลอกไฟล์จากเซิร์ฟเวอร์โรงเรียน โดยไม่มีใครใช้เครือข่ายพร้อมกัน ทรูพุตสูงสุดเป็นกี่ Mbps"
    figure:
      src: school-network.svg
      alt: "แผนผังเครือข่ายโรงเรียนสมมติ อินเทอร์เน็ตต่อกับเราเตอร์ด้วยลิงก์ 500 Mbps เราเตอร์ต่อกับสวิตช์หลัก 1 Gbps สวิตช์หลักต่อกับสวิตช์ห้องคอม 1 Gbps ต่อกับเซิร์ฟเวอร์โรงเรียน 1 Gbps และต่อกับสวิตช์ห้องสมุด 100 Mbps ห้องคอมมีคอมพิวเตอร์ 30 เครื่อง ห้องสมุดมี 10 เครื่อง แต่ละเครื่องต่อสวิตช์ของห้องด้วย 1 Gbps"
    answer: { value: 100, unit: Mbps }
    hints:
      - "ไล่เส้นทางจากคอมพิวเตอร์ห้องสมุดไปเซิร์ฟเวอร์ว่าผ่านลิงก์ใดบ้าง"
      - "ทรูพุตสูงสุดเท่ากับลิงก์ที่ช้าที่สุดบนเส้นทาง"
    misconceptions:
      - { match: 1000, feedback: "ลิงก์ส่วนใหญ่เป็น 1 Gbps แต่ลิงก์จากสวิตช์ห้องสมุดไปสวิตช์หลักมีแค่ 100 Mbps" }
      - { match: 500, feedback: "500 Mbps เป็นลิงก์ไปอินเทอร์เน็ต เส้นทางไปเซิร์ฟเวอร์โรงเรียนไม่ได้ผ่านลิงก์นี้" }
    solution: "เส้นทาง: เครื่อง (1 Gbps) → สวิตช์ห้องสมุด → (100 Mbps) → สวิตช์หลัก → (1 Gbps) → เซิร์ฟเวอร์ ช้าที่สุด 100 Mbps จึงเป็นคอขวด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.performance.p010
    topics: [computer.networks.performance]
    difficulty: 3
    type: mcq
    stem: "ห้องนอนของเพลงอยู่ไกลเราเตอร์ Wi-Fi และมีผนังคอนกรีตกั้นสองชั้น วัดความเร็วได้แค่ 15 Mbps ขณะที่ข้างเราเตอร์ได้ 300 Mbps ข้อใดแก้ได้ตรงสาเหตุที่สุด"
    choices:
      - { id: a, text: "ย้ายเราเตอร์ไปไว้กลางบ้านหรือเพิ่มจุดกระจายสัญญาณ หรือเดินสาย LAN ไปห้องนอน", correct: true }
      - { id: b, text: "อัปเกรดแพ็กเกจอินเทอร์เน็ตจาก 300 เป็น 1,000 Mbps", feedback: "ข้างเราเตอร์ได้ 300 Mbps อยู่แล้ว คอขวดคือสัญญาณ Wi-Fi ที่อ่อนในห้องนอน ไม่ใช่สายจากผู้ให้บริการ" }
      - { id: c, text: "เปลี่ยนเบราว์เซอร์", feedback: "เบราว์เซอร์ไม่ได้ทำให้สัญญาณวิทยุผ่านผนังได้ดีขึ้น" }
      - { id: d, text: "ลบไฟล์ในเครื่องให้มีพื้นที่ว่างมากขึ้น", feedback: "พื้นที่ดิสก์ไม่เกี่ยวกับความแรงของสัญญาณ Wi-Fi" }
    hints:
      - "ความเร็วต่างกันมากระหว่างข้างเราเตอร์กับในห้องนอน"
      - "คลื่น Wi-Fi อ่อนลงตามระยะทางและเมื่อผ่านผนัง"
    solution: "ข้างเราเตอร์เร็ว แสดงว่าลิงก์จากผู้ให้บริการไม่ใช่ปัญหา คอขวดคือ Wi-Fi ที่อ่อนเพราะระยะทางและผนัง จึงต้องทำให้สัญญาณถึงห้องนอนดีขึ้น หรือใช้สาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.performance.p011
    topics: [computer.networks.performance]
    difficulty: 4
    type: numeric
    stem: "จากแผนผังในภาพ ถ้าคอมพิวเตอร์ทั้ง 30 เครื่องในห้องคอมดาวน์โหลดจาก **อินเทอร์เน็ต** พร้อมกัน และแบ่งแบนด์วิดท์เท่ากัน แต่ละเครื่องได้ทรูพุตสูงสุดประมาณกี่ Mbps (ตอบทศนิยม 2 ตำแหน่ง)"
    figure:
      src: school-network.svg
      alt: "แผนผังเครือข่ายโรงเรียนสมมติ อินเทอร์เน็ตต่อกับเราเตอร์ด้วยลิงก์ 500 Mbps เราเตอร์ต่อกับสวิตช์หลัก 1 Gbps สวิตช์หลักต่อกับสวิตช์ห้องคอม 1 Gbps ต่อกับเซิร์ฟเวอร์โรงเรียน 1 Gbps และต่อกับสวิตช์ห้องสมุด 100 Mbps ห้องคอมมีคอมพิวเตอร์ 30 เครื่อง ห้องสมุดมี 10 เครื่อง แต่ละเครื่องต่อสวิตช์ของห้องด้วย 1 Gbps"
    answer: { value: 16.67, tolerance: 0.17, unit: Mbps }
    hints:
      - "ลิงก์ใดบนเส้นทางไปอินเทอร์เน็ตที่ทั้ง 30 เครื่องต้องใช้ร่วมกันและช้าที่สุด"
      - "แบ่งความจุของคอขวดนั้นเท่า ๆ กันให้ 30 เครื่อง"
    misconceptions:
      - { match: 33.33, feedback: "หารลิงก์ห้องคอม 1 Gbps ด้วย 30 แต่ข้อมูลทุกเครื่องยังต้องผ่านลิงก์อินเทอร์เน็ต 500 Mbps ซึ่งช้ากว่า" }
      - { match: 500, feedback: "500 Mbps เป็นความจุรวมที่ทุกเครื่องใช้ร่วมกัน ต้องแบ่งให้ 30 เครื่อง" }
    solution: "ทุกเครื่องใช้ลิงก์ห้องคอม (1,000 Mbps) และลิงก์อินเทอร์เน็ต (500 Mbps) ร่วมกัน คอขวดคือ 500 Mbps แบ่ง 30 เครื่องได้ 500 ÷ 30 ≈ 16.67 Mbps ต่อเครื่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.performance.p012
    topics: [computer.networks.performance]
    difficulty: 4
    type: numeric
    stem: "จากแผนผังในภาพ คอมพิวเตอร์ในห้องสมุดเครื่องเดียวดาวน์โหลดวิดีโอการสอนขนาด 250 MB จากเซิร์ฟเวอร์โรงเรียน ขณะไม่มีใครใช้เครือข่าย ใช้เวลาอย่างน้อยกี่วินาที (1 MB = 1,000,000 ไบต์)"
    figure:
      src: school-network.svg
      alt: "แผนผังเครือข่ายโรงเรียนสมมติ อินเทอร์เน็ตต่อกับเราเตอร์ด้วยลิงก์ 500 Mbps เราเตอร์ต่อกับสวิตช์หลัก 1 Gbps สวิตช์หลักต่อกับสวิตช์ห้องคอม 1 Gbps ต่อกับเซิร์ฟเวอร์โรงเรียน 1 Gbps และต่อกับสวิตช์ห้องสมุด 100 Mbps ห้องคอมมีคอมพิวเตอร์ 30 เครื่อง ห้องสมุดมี 10 เครื่อง แต่ละเครื่องต่อสวิตช์ของห้องด้วย 1 Gbps"
    answer: { value: 20, unit: วินาที }
    hints:
      - "หาคอขวดของเส้นทางห้องสมุดถึงเซิร์ฟเวอร์ก่อน"
      - "แปลง 250 MB เป็นเมกะบิต แล้วหารด้วยอัตราของคอขวด"
    misconceptions:
      - { match: 2, feedback: "ใช้ 1 Gbps ซึ่งไม่ใช่คอขวด ลิงก์ห้องสมุดมีแค่ 100 Mbps" }
      - { match: 2.5, feedback: "ลืมแปลงไบต์เป็นบิต ต้องคูณ 8" }
    solution: "คอขวดคือ 100 Mbps ขนาด 250 × 8 = 2,000 เมกะบิต เวลา = 2,000 ÷ 100 = 20 วินาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.performance.p013
    topics: [computer.networks.performance]
    difficulty: 4
    type: mcq
    stem: "จากแผนผังในภาพ ถ้าอุปกรณ์ชิ้นเดียวเสีย อุปกรณ์ใดทำให้ **ทุกห้อง** ใช้ทั้งเซิร์ฟเวอร์โรงเรียนและอินเทอร์เน็ตไม่ได้"
    figure:
      src: school-network.svg
      alt: "แผนผังเครือข่ายโรงเรียนสมมติ อินเทอร์เน็ตต่อกับเราเตอร์ด้วยลิงก์ 500 Mbps เราเตอร์ต่อกับสวิตช์หลัก 1 Gbps สวิตช์หลักต่อกับสวิตช์ห้องคอม 1 Gbps ต่อกับเซิร์ฟเวอร์โรงเรียน 1 Gbps และต่อกับสวิตช์ห้องสมุด 100 Mbps ห้องคอมมีคอมพิวเตอร์ 30 เครื่อง ห้องสมุดมี 10 เครื่อง แต่ละเครื่องต่อสวิตช์ของห้องด้วย 1 Gbps"
    choices:
      - { id: a, text: "สวิตช์หลัก", correct: true }
      - { id: b, text: "เราเตอร์", feedback: "ถ้าเราเตอร์เสีย อินเทอร์เน็ตใช้ไม่ได้ แต่ทุกห้องยังติดต่อเซิร์ฟเวอร์โรงเรียนผ่านสวิตช์หลักได้" }
      - { id: c, text: "สวิตช์ห้องสมุด", feedback: "กระทบเฉพาะห้องสมุด ห้องคอมยังใช้ได้ตามปกติ" }
      - { id: d, text: "เซิร์ฟเวอร์โรงเรียน", feedback: "ใช้เซิร์ฟเวอร์ไม่ได้ แต่ทุกห้องยังออกอินเทอร์เน็ตได้" }
    hints:
      - "ข้อมูลของทุกห้องต้องผ่านอุปกรณ์ใดเสมอ"
      - "จุดล้มเหลวเดียวอยู่ตรงกลางของโทโพโลยีแบบดาว"
    solution: "สวิตช์หลักเป็นศูนย์กลางของแบบดาว ทุกห้อง เซิร์ฟเวอร์ และเราเตอร์ต่อผ่านมัน จึงเป็นจุดล้มเหลวเดียว ลดความเสี่ยงได้ด้วยสวิตช์หลักสำรองและลิงก์สำรองไปแต่ละห้อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.performance.p014
    topics: [computer.networks.performance]
    difficulty: 4
    type: numeric
    stem: "ในแบบจำลองคิวอย่างง่าย เวลาเฉลี่ยที่แพ็กเก็ตอยู่ในเราเตอร์เป็นสัดส่วนกับ $\\frac{1}{1 - \\rho}$ เมื่อ $\\rho$ คือสัดส่วนการใช้งานลิงก์ ถ้าการใช้งานเพิ่มจาก 50% เป็น 95% เวลาเฉลี่ยในเราเตอร์เพิ่มขึ้นกี่เท่า"
    answer: { value: 10, tolerance: 0.01, unit: เท่า }
    hints:
      - "คำนวณ 1 ÷ (1 − ρ) ที่ ρ = 0.5 และ ρ = 0.95"
      - "นำค่าที่ 95% หารด้วยค่าที่ 50%"
    misconceptions:
      - { match: 1.9, feedback: "เทียบสัดส่วนการใช้งาน 95 ÷ 50 ตรง ๆ แต่เวลาเข้าคิวไม่ได้เพิ่มเป็นเส้นตรงกับการใช้งาน" }
      - { match: 20, feedback: "20 คือค่าที่ 95% เมื่อเทียบกับเวลาส่งหนึ่งแพ็กเก็ต โจทย์ถามว่าเพิ่มจากตอน 50% กี่เท่า" }
    solution: "ที่ 50%: 1 ÷ 0.5 = 2 ที่ 95%: 1 ÷ 0.05 = 20 เพิ่มขึ้น 20 ÷ 2 = 10 เท่า ทั้งที่การใช้งานเพิ่มไม่ถึงสองเท่า นี่คือเหตุผลที่ไม่ควรใช้ลิงก์จนเกือบเต็ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.performance.p015
    topics: [computer.networks.performance]
    difficulty: 5
    type: numeric
    stem: "อินเทอร์เน็ตผ่านดาวเทียมค้างฟ้าอยู่สูงจากพื้นโลกประมาณ 36,000 km สัญญาณวิทยุเดินทางด้วยอัตราเร็ว $3 \\times 10^8$ m/s คำขอจากบ้านต้องขึ้นไปดาวเทียมแล้วลงมาสถานีภาคพื้นดิน และคำตอบก็ต้องขึ้นลงอีกรอบ เวลาไปกลับ (RTT) จากเวลาเดินทางของสัญญาณอย่างเดียวเป็นอย่างน้อยกี่มิลลิวินาที (คิดว่าดาวเทียมอยู่เหนือศีรษะพอดี)"
    answer: { value: 480, unit: ms }
    hints:
      - "นับจำนวนช่วงขึ้นหรือลงระยะ 36,000 km ทั้งไปและกลับ"
      - "เวลา = ระยะทางรวม ÷ อัตราเร็ว แล้วแปลงเป็นมิลลิวินาที"
    misconceptions:
      - { match: 240, feedback: "นับแค่ขาไป (ขึ้นและลงหนึ่งรอบ) RTT ต้องรวมขากลับอีกขึ้นและลงหนึ่งรอบ" }
      - { match: 120, feedback: "นับแค่ขึ้นและลงอย่างละครั้ง ต้องมีทั้งขาไปและขากลับ รวม 4 ช่วง" }
    solution: "ไปกลับมี 4 ช่วง (ขึ้น ลง ขึ้น ลง) ระยะรวม 4 × 36,000 km = 144,000 km เวลา = 144 × 10⁶ ÷ (3 × 10⁸) = 0.48 วินาที = 480 ms ดาวเทียมค้างฟ้าจึงไม่เหมาะกับเกมออนไลน์ แม้แบนด์วิดท์จะสูง ดาวเทียมวงโคจรต่ำซึ่งอยู่ใกล้กว่ามากจึงหน่วงน้อยกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.performance.p016
    topics: [computer.networks.performance]
    difficulty: 5
    type: mcq
    stem: "จากแผนผังในภาพ นักเรียนในห้องสมุดบ่นว่าตอนเปิดวิดีโอการสอนจากเซิร์ฟเวอร์โรงเรียนพร้อมกันทั้ง 10 เครื่อง (เครื่องละ 15 Mbps) ภาพกระตุก ส่วนห้องคอมไม่มีปัญหา โรงเรียนมีงบอัปเกรดได้หนึ่งอย่าง ควรเลือกข้อใด"
    figure:
      src: school-network.svg
      alt: "แผนผังเครือข่ายโรงเรียนสมมติ อินเทอร์เน็ตต่อกับเราเตอร์ด้วยลิงก์ 500 Mbps เราเตอร์ต่อกับสวิตช์หลัก 1 Gbps สวิตช์หลักต่อกับสวิตช์ห้องคอม 1 Gbps ต่อกับเซิร์ฟเวอร์โรงเรียน 1 Gbps และต่อกับสวิตช์ห้องสมุด 100 Mbps ห้องคอมมีคอมพิวเตอร์ 30 เครื่อง ห้องสมุดมี 10 เครื่อง แต่ละเครื่องต่อสวิตช์ของห้องด้วย 1 Gbps"
    choices:
      - { id: a, text: "อัปเกรดลิงก์ห้องสมุดถึงสวิตช์หลักจาก 100 Mbps เป็น 1 Gbps", correct: true }
      - { id: b, text: "อัปเกรดอินเทอร์เน็ตจาก 500 Mbps เป็น 1 Gbps", feedback: "วิดีโอมาจากเซิร์ฟเวอร์ในโรงเรียน ไม่ผ่านลิงก์อินเทอร์เน็ตเลย" }
      - { id: c, text: "เปลี่ยนคอมพิวเตอร์ในห้องสมุดเป็นรุ่นใหม่", feedback: "แต่ละเครื่องต่อสวิตช์ด้วย 1 Gbps อยู่แล้ว ปัญหาอยู่ที่ลิงก์ที่ทุกเครื่องในห้องสมุดใช้ร่วมกัน" }
      - { id: d, text: "อัปเกรดลิงก์ห้องคอมเป็น 10 Gbps", feedback: "ห้องคอมไม่มีปัญหา และลิงก์นี้ไม่อยู่บนเส้นทางของห้องสมุด" }
    hints:
      - "ความต้องการรวมของห้องสมุดเท่ากับเท่าใด เทียบกับลิงก์ที่ห้องสมุดใช้ร่วมกัน"
      - "อัปเกรดต้องทำที่คอขวดของเส้นทางที่มีปัญหาเท่านั้นจึงได้ผล"
    solution: "ความต้องการรวม 10 × 15 = 150 Mbps เกินลิงก์ห้องสมุด 100 Mbps จึงแออัด เส้นทางไปเซิร์ฟเวอร์ไม่ผ่านอินเทอร์เน็ต การอัปเกรดลิงก์ห้องสมุดเป็น 1 Gbps แก้ตรงคอขวด (150 Mbps เหลือเพียง 15% ของความจุ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.performance.p017
    topics: [computer.networks.performance]
    difficulty: 5
    type: mcq
    stem: "ข้อความแชตขนาด 1 KB ส่งผ่านสายใยแก้วยาว 13,000 km (สัญญาณ $2 \\times 10^8$ m/s) ถ้าเพิ่มแบนด์วิดท์จาก 100 Mbps เป็น 1 Gbps ความหน่วงเที่ยวเดียว (คิดเฉพาะเวลาส่งออกและเวลาเดินทาง) จะเป็นอย่างไร"
    choices:
      - { id: a, text: "แทบไม่เปลี่ยน จากประมาณ 65.08 ms เป็นประมาณ 65.01 ms เพราะเวลาเดินทาง 65 ms เป็นส่วนใหญ่", correct: true }
      - { id: b, text: "ลดลง 10 เท่า จากประมาณ 65 ms เหลือประมาณ 6.5 ms", feedback: "แบนด์วิดท์ลดเฉพาะเวลาส่งออก (0.08 ms → 0.008 ms) ไม่ได้ลดเวลาเดินทางของสัญญาณ" }
      - { id: c, text: "เพิ่มขึ้น เพราะส่งเร็วเกินไปจนเราเตอร์รับไม่ทัน", feedback: "การเพิ่มแบนด์วิดท์ไม่ได้ทำให้ความหน่วงเพิ่มขึ้นในกรณีนี้" }
      - { id: d, text: "เหลือ 0 ms เพราะ 1 Gbps เร็วมาก", feedback: "สัญญาณมีอัตราเร็วจำกัด ระยะ 13,000 km ต้องใช้เวลาเสมอ" }
    hints:
      - "เวลาส่งออก = 8,000 บิต ÷ แบนด์วิดท์ เวลาเดินทาง = ระยะทาง ÷ อัตราเร็ว"
      - "ส่วนใดเปลี่ยนเมื่อแบนด์วิดท์เพิ่ม และส่วนนั้นใหญ่แค่ไหนเมื่อเทียบกับอีกส่วน"
    solution: "เวลาเดินทาง = 13 × 10⁶ ÷ (2 × 10⁸) = 0.065 s = 65 ms เวลาส่งออกที่ 100 Mbps = 8,000 ÷ 10⁸ = 0.08 ms ที่ 1 Gbps = 0.008 ms รวมจาก 65.08 เหลือ 65.008 ms สำหรับข้อมูลชิ้นเล็ก ความหน่วงขึ้นกับระยะทาง แบนด์วิดท์ช่วยได้เมื่อข้อมูลใหญ่"
    license: CC-BY-SA-4.0
    ai_assisted: true
