  difficulty: 3
  type: order
  stem: 'เรียงขั้นตอนการหาผลเฉลยทั่วไปของระบบ $\mathbf{x}^{\prime}=A\mathbf{x}$ ตามลำดับที่ถูกต้อง'
  items:
