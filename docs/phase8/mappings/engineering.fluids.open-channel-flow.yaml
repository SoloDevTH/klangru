rows:
  - { framework: th-coe-engineering-basics, indicators: ["ENV-2.8"], coverage: partial, note: "ชลศาสตร์ทางน้ำเปิด: รัศมีชลศาสตร์ สมการแมนนิงและเชซี ความลึกปกติ พลังงานจำเพาะ ความลึกวิกฤต เลขฟรูด การกระโดดของน้ำ ฝายสันคม ท่อระบายน้ำที่ไหลครึ่งท่อ ส่วนการไหลในท่อเต็มอยู่ใน engineering.fluids.fluid-mechanics (สองหัวข้อรวมกันครอบคลุมชลศาสตร์พื้นฐาน)" }
  - { framework: th-coe-engineering-basics, indicators: ["CIV-3.4"], coverage: partial, note: "เติมส่วนการวิเคราะห์พฤติกรรมการไหลในคลองและการออกแบบหน้าตัดทางน้ำ (หน้าตัดที่มีประสิทธิภาพ แอ่งสลายพลังงาน ฝายวัดน้ำ) ยังไม่มีอุทกวิทยา การวิเคราะห์ข้อมูลน้ำฝนและน้ำท่า การไหลไม่สม่ำเสมอแบบค่อยเป็นค่อยไป และระบบโครงข่าย" }
