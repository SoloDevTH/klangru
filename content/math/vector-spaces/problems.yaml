  - id: math.linalg.vector-spaces.p015
    topics: [math.linalg.vector-spaces]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "ให้ $A$ เป็นเมทริกซ์ $m \\times n$ ข้อใดถูกต้องเสมอ (เลือกได้หลายข้อ)"
    choices:
      - { id: a, text: "ทุกเวกเตอร์ใน $N(A)$ ตั้งฉากกับทุกแถวของ $A$", correct: true }
      - { id: b, text: "$\\dim C(A) = \\dim C(A^{T})$", correct: true }
      - { id: c, text: "$\\dim N(A) + \\dim C(A^{T}) = n$", correct: true }
      - { id: d, text: "$C(A) = C(R)$ เมื่อ $R$ เป็นรูปขั้นบันไดลดรูปของ $A$", feedback: "การดำเนินการตามแถวเปลี่ยนปริภูมิหลักได้ เช่น $A = \\begin{bmatrix}1\\\\ 1\\end{bmatrix}$ มี $R = \\begin{bmatrix}1\\\\ 0\\end{bmatrix}$ ปริภูมิหลักเปลี่ยนจากเส้นในทิศ $(1, 1)$ เป็นเส้นในทิศ $(1, 0)$ สิ่งที่การดำเนินการตามแถวรักษาไว้คือปริภูมิแถวและปริภูมิศูนย์" }
      - { id: e, text: "ถ้า $m < n$ แล้ว $N(A) = \\{\\mathbf{0}\\}$", feedback: "กลับกัน: $m < n$ ทำให้ $r \\le m < n$ มีตัวแปรอิสระอย่างน้อยหนึ่งตัว $N(A)$ จึงไม่ใช่แค่ $\\{\\mathbf{0}\\}$" }
    hints:
      - "$A\\mathbf{x} = \\mathbf{0}$ หมายถึงผลคูณจุดของแต่ละแถวกับ $\\mathbf{x}$ เป็นศูนย์"
      - "ปริภูมิหลักและปริภูมิแถวมีมิติเท่ากับแรงก์ $r$ ทั้งคู่"
    solution: "a ถูกเพราะ $A\\mathbf{x} = \\mathbf{0}$ คือ (แถว)·$\\mathbf{x} = 0$ ทุกแถว; b ถูก ทั้งคู่มีมิติ $r$; c ถูก $(n - r) + r = n$; d ผิด การดำเนินการตามแถวรักษาปริภูมิแถวแต่เปลี่ยนปริภูมิหลัก; e ผิด เมทริกซ์ที่หลักมากกว่าแถวมีปริภูมิศูนย์ไม่ใช่ศูนย์เสมอ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.linalg.vector-spaces.p016
    topics: [math.linalg.vector-spaces]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการหาฐานหลักของปริภูมิศูนย์ $N(A)$"
    items:
      - "กำจัด $A$ จนได้รูปขั้นบันไดลดรูป $R$"
      - "ระบุหลักที่มีตัวนำ (ตัวแปรหลัก) และหลักที่ไม่มี (ตัวแปรอิสระ)"
      - "ให้ตัวแปรอิสระตัวหนึ่งเป็น 1 ตัวอื่นเป็น 0"
      - "แก้หาตัวแปรหลักจาก $R\\mathbf{x} = \\mathbf{0}$ ได้ผลเฉลยพิเศษ"
      - "ทำซ้ำกับตัวแปรอิสระทุกตัว ผลเฉลยพิเศษทั้งหมดคือฐานหลัก"
    hints:
      - "ต้องรู้ว่าตัวแปรใดอิสระก่อนจึงกำหนดค่าได้"
      - "ผลเฉลยพิเศษมีจำนวนเท่ากับจำนวนตัวแปรอิสระ"
    solution: "กำจัดเป็น $R$ → แยกตัวแปรหลัก/อิสระ → กำหนดตัวแปรอิสระทีละตัวเป็น 1 → แก้หาตัวแปรหลัก → ได้ผลเฉลยพิเศษ $n - r$ ตัวเป็นฐานหลักของ $N(A)$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.linalg.vector-spaces.p017
