<text x="450.0" y="312.0" font-size="14" text-anchor="middle" fill="#444" font-weight="normal" font-family="sans-serif" >A = สารที่รู้ปริมาณ · B = สารที่ต้องการหา · ขั้นกลาง (สีแดง) ใช้สมการที่ดุลแล้วเท่านั้น</text>
