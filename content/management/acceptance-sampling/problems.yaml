problems:
  - id: management.quality.acceptance-sampling.p001
    topics: [management.quality.acceptance-sampling]
    difficulty: 1
    type: mcq
    stem: "โรงงานใช้แผนการชักตัวอย่าง $n = 50$, $c = 1$ ตรวจรับฝาขวดล็อตหนึ่ง สุ่มได้ฝาบกพร่อง 2 ชิ้น ต้องตัดสินอย่างไร"
    choices:
      - { id: a, text: "ปฏิเสธล็อต", correct: true }
      - { id: b, text: "ยอมรับล็อต เพราะ 2 จาก 50 คิดเป็นแค่ 4%", feedback: "แผนตัดสินด้วยการเทียบจำนวนของเสีย $d$ กับเลขยอมรับ $c$ ไม่ใช่ร้อยละ พบ 2 ชิ้น มากกว่า $c = 1$" }
      - { id: c, text: "ยอมรับล็อต แต่คัดฝา 2 ชิ้นนั้นทิ้ง", feedback: "ของเสียเกินเลขยอมรับแล้ว ต้องปฏิเสธทั้งล็อต" }
      - { id: d, text: "สุ่มตัวอย่างชุดที่สองเพิ่ม", feedback: "นั่นคือแผนเชิงคู่ แผนนี้เป็นแผนเชิงเดี่ยว ตัดสินจากตัวอย่างชุดเดียว" }
    hints:
      - "ยอมรับเมื่อ $d \\le c$ ปฏิเสธเมื่อ $d > c$"
      - "$d = 2$ และ $c = 1$"
    solution: "พบของเสีย $d = 2$ มากกว่าเลขยอมรับ $c = 1$ จึงปฏิเสธล็อต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.acceptance-sampling.p002
    topics: [management.quality.acceptance-sampling]
    difficulty: 1
    type: match
    stem: "จับคู่คำกับความหมาย"
    pairs:
      - { left: "AQL", right: "สัดส่วนของเสียที่ถือว่าเป็นล็อตดี ควรยอมรับเกือบทุกครั้ง" }
      - { left: "LTPD", right: "สัดส่วนของเสียที่ถือว่าเป็นล็อตเสีย ควรปฏิเสธเกือบทุกครั้ง" }
      - { left: "ความเสี่ยงของผู้ผลิต (α)", right: "โอกาสที่ล็อตดีถูกปฏิเสธ" }
      - { left: "ความเสี่ยงของผู้บริโภค (β)", right: "โอกาสที่ล็อตเสียถูกยอมรับ" }
    hints:
      - "ผู้ผลิตเสียหายเมื่อของดีของตัวเองถูกตีกลับ"
      - "ผู้บริโภคเสียหายเมื่อได้ของเสียไปใช้"
    solution: "AQL คือระดับล็อตดี LTPD คือระดับล็อตเสีย α คือโอกาสปฏิเสธล็อตดี และ β คือโอกาสยอมรับล็อตเสีย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.acceptance-sampling.p003
    topics: [management.quality.acceptance-sampling]
    difficulty: 1
    type: mcq
    stem: "กรณีใดเหมาะกับการชักตัวอย่างเพื่อการยอมรับมากกว่าการตรวจทุกชิ้น"
    choices:
      - { id: a, text: "ทดสอบแรงดึงของเชือกโดยดึงจนขาด", correct: true }
      - { id: b, text: "ตรวจถุงลมนิรภัยที่ผู้ผลิตรถยนต์ต้องการให้ทุกชิ้นผ่าน และมีเครื่องตรวจอัตโนมัติที่ไม่ทำลายชิ้นงาน", feedback: "ถ้าตรวจได้ทุกชิ้นโดยไม่ทำลายและผลของการพลาดร้ายแรง ควรตรวจทุกชิ้น" }
      - { id: c, text: "ล็อตที่มีเพียง 3 ชิ้นและตรวจง่าย", feedback: "ล็อตเล็กมากที่ตรวจง่าย ตรวจทุกชิ้นได้ไม่ยาก" }
      - { id: d, text: "สินค้าที่ไม่เคยมีของเสียมาหลายปีและไม่สำคัญ", feedback: "กรณีนี้อาจไม่ต้องตรวจรับเลยหรือใช้การรับรองผู้ขาย ไม่จำเป็นต้องใช้การชักตัวอย่าง" }
    hints:
      - "ถ้าตรวจแล้วสินค้าเสียหาย จะตรวจทุกชิ้นได้ไหม"
      - "การชักตัวอย่างเหมาะเมื่อการตรวจทุกชิ้นทำไม่ได้หรือแพงเกินไป"
    solution: "การทดสอบที่ทำลายชิ้นงานตรวจทุกชิ้นไม่ได้ เพราะจะไม่เหลือสินค้า จึงต้องสุ่มตัวอย่าง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.acceptance-sampling.p004
    topics: [management.quality.acceptance-sampling]
    difficulty: 2
    type: numeric
    stem: "ร้านขายยาตรวจรับหน้ากากอนามัยด้วยแผน $n = 20$, $c = 0$ ถ้าล็อตมีหน้ากากบกพร่อง 5% ความน่าจะเป็นที่จะยอมรับล็อตเป็นเท่าใด (ล็อตใหญ่มาก ตอบเป็นทศนิยม 4 ตำแหน่ง)"
    answer: { value: 0.3585, tolerance: 0.002 }
    hints:
      - "$c = 0$ ต้องไม่พบของเสียเลยทั้ง 20 ชิ้น"
      - "$P_a = (1 - 0.05)^{20}$"
    misconceptions:
      - { match: 0.6415, feedback: "นั่นคือความน่าจะเป็นที่จะปฏิเสธ" }
      - { match: 0.95, feedback: "นั่นคือโอกาสที่หน้ากากชิ้นเดียวดี ต้องดีทั้ง 20 ชิ้น" }
    solution: "$P_a = 0.95^{20} \\approx 0.3585$ ล็อตที่มีของเสีย 5% ยังผ่านได้ราว 36%"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.acceptance-sampling.p005
    topics: [management.quality.acceptance-sampling]
    difficulty: 2
    type: mcq
    stem: "คลังวัตถุดิบของโรงงานอาหาร (สมมติ) วางแป้งล็อตที่รอผลตรวจไว้ปนกับล็อตที่ผ่านแล้ว พนักงานจึงเบิกแป้งที่ยังไม่ได้ตรวจไปผลิต วิธีป้องกันที่ตรงที่สุดคือข้อใด"
    choices:
      - { id: a, text: "ติดป้ายสถานะ \"รอตรวจ\" \"ผ่าน\" \"ไม่ผ่าน\" และแยกพื้นที่ชัดเจน ให้เบิกได้เฉพาะจากพื้นที่ \"ผ่าน\"", correct: true }
      - { id: b, text: "เพิ่มขนาดตัวอย่างในการตรวจรับ", feedback: "ขนาดตัวอย่างไม่เกี่ยวกับปัญหาการเบิกของที่ยังไม่ได้ตรวจ" }
      - { id: c, text: "ตักเตือนพนักงานเบิกของ", feedback: "ไม่ได้แก้สาเหตุที่ระบบไม่แยกสถานะ คนอื่นก็พลาดได้อีก" }
      - { id: d, text: "เปลี่ยนผู้ขายแป้ง", feedback: "ปัญหาอยู่ที่การควบคุมวัสดุภายในโรงงาน ไม่ใช่ที่ผู้ขาย" }
    hints:
      - "ปัญหาคือแยกไม่ออกว่าล็อตใดผ่านการตรวจแล้ว"
      - "การควบคุมวัสดุต้องชี้บ่งสถานะการตรวจ"
    solution: "การชี้บ่งสถานะการตรวจและแยกพื้นที่ทำให้แยกล็อตได้ทันทีและป้องกันการเบิกผิด ล็อตที่ไม่ผ่านต้องกักกันแยกไว้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.acceptance-sampling.p006
    topics: [management.quality.acceptance-sampling]
    difficulty: 3
    type: numeric
    stem: "แผนการชักตัวอย่าง $n = 32$, $c = 1$ ใช้กับล็อตใหญ่ที่มีของเสีย 2% ความน่าจะเป็นที่จะยอมรับล็อตเป็นเท่าใด (ตอบเป็นทศนิยม 4 ตำแหน่ง)"
    answer: { value: 0.866, tolerance: 0.002 }
    hints:
      - "$P_a = P(0) + P(1)$ จากการแจกแจงทวินาม $n = 32$, $p = 0.02$"
      - "$P(0) = 0.98^{32}$ และ $P(1) = 32(0.02)(0.98)^{31}$"
    misconceptions:
      - { match: 0.5239, feedback: "นั่นคือ $P(0)$ อย่างเดียว ต้องรวม $P(1)$ ด้วยเพราะ $c = 1$" }
      - { match: 0.3421, feedback: "นั่นคือ $P(1)$ อย่างเดียว ต้องรวมตั้งแต่ $d = 0$" }
    solution: "$P(0) = 0.98^{32} \\approx 0.5239$, $P(1) = 32(0.02)(0.98)^{31} \\approx 0.3421$ รวม $P_a \\approx 0.8660$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.acceptance-sampling.p007
    topics: [management.quality.acceptance-sampling]
    difficulty: 3
    type: numeric
    stem: "ใช้การแจกแจงปัวซงประมาณความน่าจะเป็นที่จะยอมรับล็อตด้วยแผน $n = 100$, $c = 2$ เมื่อล็อตมีของเสีย 1% (ตอบเป็นทศนิยม 4 ตำแหน่ง)"
    answer: { value: 0.9197, tolerance: 0.002 }
    hints:
      - "$\\lambda = np = 100 \\times 0.01 = 1$"
      - "$P_a \\approx e^{-1}\\left(1 + 1 + \\dfrac{1^2}{2}\\right)$"
    misconceptions:
      - { match: 0.3679, feedback: "นั่นคือ $P(0)$ อย่างเดียว ต้องรวม $d = 0, 1, 2$" }
      - { match: 0.7358, feedback: "นั่นคือรวมถึง $d = 1$ เท่านั้น เลขยอมรับคือ 2" }
    solution: "$\\lambda = 1$ ดังนั้น $P_a \\approx e^{-1}(1 + 1 + 0.5) = 2.5e^{-1} \\approx 0.9197$ (ค่าจากทวินามคือ 0.9206 ใกล้กันมาก)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.acceptance-sampling.p008
    topics: [management.quality.acceptance-sampling]
    difficulty: 3
    type: numeric
    stem: "แผน $n = 125$, $c = 3$ ตกลงกับผู้ขายว่า AQL = 1% ความน่าจะเป็นที่จะยอมรับล็อตที่มีของเสีย 1% คือ 0.9626 ความเสี่ยงของผู้ผลิต (α) เป็นเท่าใด (ตอบเป็นทศนิยม 4 ตำแหน่ง)"
    answer: { value: 0.0374, tolerance: 0.001 }
    hints:
      - "ความเสี่ยงของผู้ผลิตคือโอกาสที่ล็อตระดับ AQL ถูกปฏิเสธ"
      - "$\\alpha = 1 - P_a(\\text{AQL})$"
    misconceptions:
      - { match: 0.9626, feedback: "นั่นคือโอกาสยอมรับ ความเสี่ยงของผู้ผลิตคือโอกาสถูกปฏิเสธ" }
    solution: "$\\alpha = 1 - 0.9626 = 0.0374$ หรือราว 3.7%"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.acceptance-sampling.p009
    topics: [management.quality.acceptance-sampling]
    difficulty: 4
    type: numeric
    stem: "แผน $n = 125$, $c = 3$ ใช้กับล็อตใหญ่ ถ้า LTPD = 6% จงหาความเสี่ยงของผู้บริโภค (β) โดยใช้การแจกแจงทวินาม (ตอบเป็นทศนิยม 4 ตำแหน่ง)"
    answer: { value: 0.0539, tolerance: 0.002 }
    hints:
      - "$\\beta = P_a$ ที่ $p = 0.06$ คือผลรวมของ $P(0)$ ถึง $P(3)$"
      - "$P(d) = \\binom{125}{d}(0.06)^d(0.94)^{125-d}$"
    misconceptions:
      - { match: 0.9461, feedback: "นั่นคือโอกาสปฏิเสธล็อตที่ระดับ LTPD ความเสี่ยงของผู้บริโภคคือโอกาสยอมรับ" }
      - { match: 0.0177, feedback: "ดูเหมือนรวมถึง $d = 2$ เท่านั้น เลขยอมรับคือ 3" }
    solution: "$P(0) \\approx 0.00044$, $P(1) \\approx 0.0035$, $P(2) \\approx 0.0138$, $P(3) \\approx 0.0361$ รวม $\\beta \\approx 0.0539$ ล็อตที่มีของเสีย 6% ผ่านได้ราว 5.4%"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.acceptance-sampling.p010
    topics: [management.quality.acceptance-sampling]
    difficulty: 3
    type: mcq
    stem: "จากเส้นโค้ง OC ในภาพ ถ้าล็อตมีของเสีย 6% แผนใดปกป้องผู้บริโภคได้ดีกว่า"
    figure:
      src: p-oc.svg
      alt: "กราฟเส้นโค้ง OC สองเส้น แกนนอนคือสัดส่วนของเสียในล็อต 0% ถึง 12% แกนตั้งคือความน่าจะเป็นที่จะยอมรับ แผน ก (สีเขียว) เริ่มที่ 1 แล้วลดลงเป็นเส้นโค้งตื้น ที่ 1% ประมาณ 0.82 ที่ 6% ประมาณ 0.29 ที่ 12% ประมาณ 0.08 แผน ข (สีน้ำตาล) อยู่ใกล้ 1 ช่วงแรกแล้วลดลงชันกว่า ที่ 1% ประมาณ 0.95 ที่ 6% ประมาณ 0.13 ที่ 12% เกือบ 0 สองเส้นตัดกันที่ประมาณ 3.3%"
    choices:
      - { id: a, text: "แผน ข เพราะยอมรับล็อตนี้ได้น้อยกว่า (ประมาณ 0.13 เทียบกับ 0.29)", correct: true }
      - { id: b, text: "แผน ก เพราะเส้นโค้งอยู่สูงกว่าที่ 6%", feedback: "เส้นสูงกว่าแปลว่ายอมรับล็อตเสียบ่อยกว่า ซึ่งเป็นผลเสียต่อผู้บริโภค" }
      - { id: c, text: "เท่ากัน เพราะทั้งสองเส้นเริ่มที่ 1", feedback: "จุดเริ่มที่ $p = 0$ เหมือนกันเสมอ ต้องดูค่าที่ $p = 6\\%$" }
      - { id: d, text: "แผน ก เพราะแผน ข ยอมรับล็อตที่มีของเสีย 1% บ่อยกว่า", feedback: "นั่นเป็นข้อดีต่อผู้ผลิต คำถามนี้ถามเรื่องการปกป้องผู้บริโภคที่ $p = 6\\%$" }
    hints:
      - "อ่านค่า $P_a$ ของแต่ละเส้นที่ $p = 6\\%$"
      - "การปกป้องผู้บริโภคดีเมื่อยอมรับล็อตเสียได้น้อย"
    solution: "ที่ $p = 6\\%$ แผน ข มี $P_a \\approx 0.13$ ส่วนแผน ก $\\approx 0.29$ แผน ข จึงปล่อยล็อตเสียผ่านน้อยกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.acceptance-sampling.p011
    topics: [management.quality.acceptance-sampling]
    difficulty: 4
    type: mcq
    stem: "จากเส้นโค้ง OC ในภาพ ผู้ขายผลิตของเสียเฉลี่ย 1% (เท่ากับ AQL ที่ตกลงกัน) ข้อใดสรุปได้ถูกต้องที่สุด"
    figure:
      src: p-oc.svg
      alt: "กราฟเส้นโค้ง OC สองเส้น แกนนอนคือสัดส่วนของเสียในล็อต 0% ถึง 12% แกนตั้งคือความน่าจะเป็นที่จะยอมรับ แผน ก (สีเขียว) ที่ 1% ประมาณ 0.82 ที่ 6% ประมาณ 0.29 แผน ข (สีน้ำตาล) ที่ 1% ประมาณ 0.95 ที่ 6% ประมาณ 0.13 สองเส้นตัดกันที่ประมาณ 3.3%"
    choices:
      - { id: a, text: "แผน ข ดีกว่าทั้งสองฝ่าย คือความเสี่ยงของผู้ผลิตราว 5% (แผน ก ราว 18%) และปกป้องผู้บริโภคที่ 6% ได้ดีกว่า แลกกับการตรวจตัวอย่างมากกว่า", correct: true }
      - { id: b, text: "แผน ก ดีกว่า เพราะปฏิเสธล็อตดีบ่อยกว่า จึงเข้มงวดกว่า", feedback: "การปฏิเสธล็อตดีบ่อยเป็นความเสี่ยงของผู้ผลิต ไม่ใช่ข้อดี และแผน ก ยังยอมรับล็อตเสียได้มากกว่าด้วย" }
      - { id: c, text: "สองแผนให้ความเสี่ยงของผู้ผลิตเท่ากัน", feedback: "ที่ 1% สองเส้นต่างกันชัด (0.82 กับ 0.95)" }
      - { id: d, text: "ไม่มีแผนใดยอมรับล็อตที่ระดับ AQL เลย", feedback: "ทั้งสองแผนยอมรับล็อตระดับ AQL ส่วนใหญ่ ($P_a$ 0.82 และ 0.95)" }
    hints:
      - "ความเสี่ยงของผู้ผลิต $= 1 - P_a$ ที่ AQL"
      - "แผนที่เส้นโค้งชันกว่าแยกล็อตดีกับล็อตเสียได้ดีกว่า"
    solution: "ที่ 1% แผน ข มี $\\alpha \\approx 1 - 0.95 = 0.05$ แผน ก $\\approx 1 - 0.82 = 0.18$ และที่ 6% แผน ข ก็ยอมรับน้อยกว่า เส้นโค้งที่ชันกว่าจึงดีทั้งต่อผู้ผลิตและผู้บริโภค ต้นทุนคือขนาดตัวอย่างที่มากกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.acceptance-sampling.p012
    topics: [management.quality.acceptance-sampling]
    difficulty: 4
    type: numeric
    stem: "แผน $n = 80$, $c = 2$ ใช้กับล็อตขนาด $N = 1{,}000$ ที่มีของเสีย 3% ซึ่งมีความน่าจะเป็นที่จะยอมรับ 0.5681 ล็อตที่ถูกปฏิเสธจะถูกคัดทุกชิ้น AOQ เป็นร้อยละเท่าใด (ตอบในหน่วย % ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 1.57, unit: "%", tolerance: 0.02 }
    hints:
      - "$\\text{AOQ} \\approx P_a \\cdot p \\cdot \\dfrac{N - n}{N}$"
      - "$0.5681 \\times 0.03 \\times \\dfrac{920}{1000}$"
    misconceptions:
      - { match: 1.70, feedback: "ลืมคูณ $(N - n)/N$ ของเสียที่พบในตัวอย่างถูกเปลี่ยนแล้ว" }
      - { match: 3, feedback: "นั่นคือคุณภาพขาเข้า การคัดล็อตที่ถูกปฏิเสธทำให้คุณภาพขาออกดีขึ้น" }
    solution: "$\\text{AOQ} = 0.5681 \\times 0.03 \\times 0.92 \\approx 0.01568 \\approx 1.57\\%$"
