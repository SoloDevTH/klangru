problems:
- id: chinese.grammar.compound-sentences.p001
  topics:
  - chinese.grammar.compound-sentences
  difficulty: 1
  type: match
  stem: จับคู่คำเชื่อมส่วนแรกกับส่วนหลังที่ใช้คู่กัน
  pairs:
  - left: 因为
    right: 所以
  - left: 如果
    right: 就
  - left: 虽然
    right: 但是
  - left: 不但
    right: 而且
  hints:
  - 'คิดความหมาย: เพราะ…จึง · ถ้า…ก็ · ถึงแม้…แต่ · ไม่เพียง…แต่ยัง'
  - 所以 = จึง 就 = ก็ 但是 = แต่ 而且 = แต่ยัง และยัง
  solution: 因为…所以 (เหตุผล) · 如果…就 (เงื่อนไข) · 虽然…但是 (ขัดแย้ง) · 不但…而且 (เพิ่มเติม)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.compound-sentences.p002
  topics:
  - chinese.grammar.compound-sentences
  difficulty: 1
  type: mcq
  stem: 因为我很累，所以我想睡觉。 แปลว่าอะไร
  choices:
  - id: a
    text: ถ้าฉันเหนื่อย ฉันก็จะนอน
    feedback: ถ้า ใช้ 如果
  - id: b
    text: ถึงแม้ฉันจะเหนื่อย แต่ฉันอยากนอน
    feedback: ถึงแม้…แต่ ใช้ 虽然…但是
  - id: c
    text: ฉันนอนแล้วจึงเหนื่อย
    feedback: สลับเหตุกับผล เหตุคือเหนื่อย ผลคืออยากนอน
  - id: d
    text: เพราะฉันเหนื่อยมาก ฉันจึงอยากนอน
    correct: true
    feedback: ถูก 因为…所以 = เพราะ…จึง
  hints:
  - 因为 นำเหตุ
  - 所以 นำผล
  solution: '**เพราะฉันเหนื่อยมาก ฉันจึงอยากนอน**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.compound-sentences.p003
  topics:
  - chinese.grammar.compound-sentences
  difficulty: 2
  type: mcq
  stem: ＿＿这件衣服有点儿贵，但是很好看。 คำใดเติมแล้วถูกต้อง
  choices:
  - id: a
    text: 虽然
    correct: true
    feedback: ถูก 虽然…但是 = ถึงแม้…แต่
  - id: b
    text: 因为
    feedback: 因为 คู่กับ 所以 ไม่คู่กับ 但是
  - id: c
    text: 如果
    feedback: 如果 คู่กับ 就
  - id: d
    text: 不但
    feedback: 不但 คู่กับ 而且
  hints:
  - 'ดูคำเชื่อมส่วนหลัง: 但是'
  - แพงนิดหน่อย กับ สวย เป็นความขัดแย้ง
  solution: '**虽然**这件衣服有点儿贵，但是很好看。 (ถึงแม้เสื้อตัวนี้จะแพงไปหน่อย แต่ก็สวย)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.compound-sentences.p004
  topics:
  - chinese.grammar.compound-sentences
  difficulty: 2
  type: order
  stem: เรียงคำเป็นประโยค "ถ้าคุณอยากกินต้มยำกุ้ง พวกเราก็ไปร้านนั้นกันเถอะ" (冬荫功 dōngyīngōng = ต้มยำกุ้ง)
  items:
  - 如果
  - 你想吃冬荫功，
  - 我们
  - 就
  - 去那家店吧。
  hints:
  - 如果 อยู่ต้นประโยคแรก
  - 就 อยู่หลังประธานของประโยคหลัง (我们)
  solution: '**如果你想吃冬荫功，我们就去那家店吧。** Rúguǒ nǐ xiǎng chī dōngyīngōng, wǒmen jiù qù nà jiā diàn ba.'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.compound-sentences.p005
  topics:
  - chinese.grammar.compound-sentences
  difficulty: 2
  type: hanzi
  stem: เขียนอักษร 因 (yīn ในคำว่า 因为 เพราะ) ตามลำดับขีด
  character: 因
  pinyin: yīn
  meaning: เหตุ (因为 = เพราะ)
  hints:
  - 因 = 囗 ล้อม 大 รวม 6 ขีด
  - เขียนกรอบด้านซ้ายและบน เขียน 大 ข้างใน แล้วจึงปิดกรอบด้วยขีดล่าง
  solution: '竖 → 横折 → (大: 横 → 撇 → 点) → 横 ปิดล่าง รวม 6 ขีด'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.compound-sentences.p006
  topics:
  - chinese.grammar.compound-sentences
  difficulty: 3
  type: mcq
  stem: '"ถ้าอากาศดี พวกเราก็จะไปปีนเขา" (爬山 páshān = ปีนเขา) ประโยคใดถูกต้อง'
  choices:
  - id: a
    text: 如果天气好，就我们去爬山。
    feedback: 就 เป็นคำวิเศษณ์ ห้ามวางหน้าประธาน
  - id: b
    text: 如果天气好，我们去就爬山。
    feedback: 就 ต้องอยู่หน้ากริยาแรก 去
  - id: c
    text: 就如果天气好，我们去爬山。
    feedback: 就 อยู่ในประโยคหลัง ไม่ใช่หน้า 如果
  - id: d
    text: 如果天气好，我们就去爬山。
    correct: true
    feedback: ถูก 就 อยู่หลังประธาน 我们 หน้ากริยา
  hints:
  - 就 = ก็ เป็นคำวิเศษณ์
  - คำวิเศษณ์ภาษาจีนอยู่หลังประธาน หน้ากริยา
  solution: '**如果天气好，我们就去爬山。** Rúguǒ tiānqì hǎo, wǒmen jiù qù páshān.'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.compound-sentences.p007
  topics:
  - chinese.grammar.compound-sentences
  difficulty: 3
  type: mcq
  stem: ประโยคใดใช้คำเชื่อม **ถูกคู่**
  choices:
  - id: a
    text: 虽然他很忙，但是每天都运动。
    correct: true
    feedback: ถูก 虽然…但是 (ถึงแม้ยุ่ง แต่ก็ออกกำลังกายทุกวัน)
  - id: b
    text: 虽然他很忙，所以每天都运动。
    feedback: 虽然 ต้องคู่กับ 但是 หรือ 可是
  - id: c
    text: 因为他很忙，但是每天都运动。
    feedback: 因为 ต้องคู่กับ 所以 และความหมายเป็นความขัดแย้ง ไม่ใช่เหตุผล
  - id: d
    text: 如果他很忙，所以每天都运动。
    feedback: 如果 คู่กับ 就
  hints:
  - ยุ่ง กับ ออกกำลังกายทุกวัน ขัดกันหรือเป็นเหตุผลกัน
  - ความขัดแย้งใช้ 虽然…但是
  solution: '**虽然他很忙，但是每天都运动。**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.compound-sentences.p008
  topics:
  - chinese.grammar.compound-sentences
  difficulty: 3
  type: text
  stem: 'เติมคำเชื่อมในช่องว่าง (พิมพ์อักษรจีน 2 ตัว): ＿＿我很累，所以想早点儿睡觉。'
  accepted:
  - 因为
  - 因为。
  - 因为.
  - 因为？
  - 因为?
  - 因為
  - 因為。
  - 因為.
  - 因為？
  - 因為?
  misconceptions:
  - match: 虽然
    feedback: 虽然 คู่กับ 但是 ประโยคนี้มี 所以 จึงต้องใช้ 因为
  - match: 虽然。
    feedback: 虽然 คู่กับ 但是 ประโยคนี้มี 所以 จึงต้องใช้ 因为
  - match: 虽然？
    feedback: 虽然 คู่กับ 但是 ประโยคนี้มี 所以 จึงต้องใช้ 因为
  - match: 如果
    feedback: 如果 คู่กับ 就
  - match: 如果。
    feedback: 如果 คู่กับ 就
  - match: 如果？
    feedback: 如果 คู่กับ 就
  hints:
  - 'ดูคำเชื่อมส่วนหลัง: 所以'
  - 所以 คู่กับคำว่า เพราะ
  solution: '**因为**我很累，所以想早点儿睡觉。 (早点儿 = เร็วขึ้นหน่อย)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.compound-sentences.p009
  topics:
  - chinese.grammar.compound-sentences
  difficulty: 3
  type: order
  stem: เรียงเป็นประโยค "พวกเราไปซื้อของที่ห้างก่อน แล้วค่อยไปดูหนัง" (商场 shāngchǎng = ห้าง)
  items:
  - 我们
  - 先
  - 去商场买东西，
  - 然后
  - 去看电影。
  hints:
  - 先 วางหลังประธาน หน้ากริยาแรก
  - 然后 อยู่ต้นประโยคหลัง
  solution: '**我们先去商场买东西，然后去看电影。**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.compound-sentences.p010
  topics:
  - chinese.grammar.compound-sentences
  difficulty: 4
  type: mcq
  stem: '"เขาไม่เพียงว่ายน้ำเป็น แต่ยังเล่นบาสเกตบอลเป็นด้วย" ประโยคใดถูกต้อง'
  choices:
  - id: a
    text: 他不但会游泳，但是会打篮球。
    feedback: 不但 คู่กับ 而且 ไม่ใช่ 但是
  - id: b
    text: 他不但会游泳，所以会打篮球。
    feedback: ไม่ใช่เหตุผล จึงไม่ใช้ 所以
  - id: c
    text: 他会游泳不但，而且会打篮球。
    feedback: 不但 ต้องอยู่หน้าส่วนที่เพิ่ม ไม่ใช่ท้าย
  - id: d
    text: 他不但会游泳，而且会打篮球。
    correct: true
    feedback: ถูก ประธานเดียวกันวางไว้หน้า 不但 แล้วใช้ 而且 นำส่วนหลัง
  hints:
  - ไม่เพียง…แต่ยัง = 不但…而且
  - 'ประธานเดียวกัน: ประธาน + 不但…，而且…'
  solution: '**他不但会游泳，而且会打篮球。** Tā búdàn huì yóuyǒng, érqiě huì dǎ lánqiú.'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.compound-sentences.p011
  topics:
  - chinese.grammar.compound-sentences
  difficulty: 4
  type: text
  stem: 'เติมคำในช่องว่าง (พิมพ์อักษรจีน 1 ตัว): 如果你不舒服，＿在家休息吧。'
  accepted:
  - 就
  - 就。
  - 就.
  - 就？
  - 就?
  misconceptions:
  - match: 所以
    feedback: 如果 คู่กับ 就 ไม่ใช่ 所以
  - match: 所以。
    feedback: 如果 คู่กับ 就 ไม่ใช่ 所以
  - match: 所以？
    feedback: 如果 คู่กับ 就 ไม่ใช่ 所以
  - match: 但是
    feedback: ไม่ใช่ความขัดแย้ง
  - match: 但是。
    feedback: ไม่ใช่ความขัดแย้ง
  - match: 但是？
    feedback: ไม่ใช่ความขัดแย้ง
  hints:
  - ประโยคแรกขึ้นต้นด้วย 如果
  - 如果 คู่กับคำว่า ก็
  solution: 如果你不舒服，**就**在家休息吧。 (ถ้าไม่สบายก็พักอยู่บ้านเถอะ)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.compound-sentences.p012
  topics:
  - chinese.grammar.compound-sentences
  difficulty: 4
  type: mcq
  stem: '"เขาไม่ได้มาเรียน เพราะเขาเป็นไข้" (发烧 fāshāo = เป็นไข้) ประโยคใดถูกต้อง'
  choices:
  - id: a
    text: 他没来上课，但是他发烧了。
    feedback: ไม่ใช่ความขัดแย้ง
  - id: b
    text: 他没来上课，因为他发烧了。
    correct: true
    feedback: ถูก บอกผลก่อน แล้วใช้ 因为 นำเหตุ
  - id: c
    text: 他没来上课，所以他发烧了。
    feedback: 所以 นำผล ประโยคนี้จึงแปลว่าไม่มาเรียนเลยเป็นไข้ ซึ่งกลับเหตุผล
  - id: d
    text: 所以他没来上课，因为他发烧了。
    feedback: ห้ามเรียง 所以 ก่อน 因为
  hints:
  - เหตุคือเป็นไข้ ผลคือไม่มาเรียน
  - ถ้าผลมาก่อน ให้ใช้ 因为 นำเหตุที่ตามมา
  solution: '**他没来上课，因为他发烧了。** หรือ 因为他发烧了，所以没来上课。'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.compound-sentences.p013
  topics:
  - chinese.grammar.compound-sentences
  difficulty: 4
  type: match
  stem: จับคู่ประโยคส่วนแรกกับส่วนหลังให้ได้ความ
  pairs:
  - left: 虽然泰国菜很辣，
    right: 但是我很喜欢吃。
  - left: 如果你有时间，
    right: 就来我家玩吧。
  - left: 因为昨天没睡觉，
    right: 所以今天很累。
  - left: 他不但会说汉语，
    right: 而且会说英语。
  hints:
  - ดูคู่คำเชื่อมก่อน
  - 虽然→但是 如果→就 因为→所以 不但→而且
  solution: 虽然…但是我很喜欢吃 · 如果…就来我家玩吧 · 因为…所以今天很累 · 不但…而且会说英语
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.compound-sentences.p014
  topics:
  - chinese.grammar.compound-sentences
  difficulty: 4
  type: mcq
  stem: ครูให้แสดงความคิดเห็นว่า "ขี่จักรยานไปโรงเรียนดีไหม" ข้อใดเป็นความคิดเห็นพร้อมเหตุผลที่ถูกต้องและสมบูรณ์ที่สุด (花钱 huā qián = ใช้เงิน, 对身体好 = ดีต่อสุขภาพ)
  choices:
  - id: a
    text: 我觉得骑自行车。
    feedback: ยังไม่บอกความคิดเห็น (ดีหรือไม่ดี) และไม่มีเหตุผล
  - id: b
    text: 我觉得骑自行车很好，但是不花钱。
    feedback: ไม่ใช้เงินเป็นเหตุผลสนับสนุน ไม่ใช่ความขัดแย้ง จึงไม่ใช้ 但是
  - id: c
    text: 骑自行车很好，所以因为不花钱。
    feedback: 所以 กับ 因为 วางติดกันแบบนี้ไม่ได้
  - id: d
    text: 我觉得骑自行车很好，因为不花钱，而且对身体好。
    correct: true
    feedback: ถูก ความคิดเห็น + 因为 + เหตุผล 1 + 而且 + เหตุผล 2
  hints:
  - 'โครง: 我觉得 + ความคิดเห็น，因为 + เหตุผล'
  - เหตุผลที่สองเติมด้วย 而且
  solution: '**我觉得骑自行车很好，因为不花钱，而且对身体好。**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.compound-sentences.p015
  topics:
  - chinese.grammar.compound-sentences
  difficulty: 5
  type: mcq
  stem: ประโยคใด **ผิด** (เลือกทุกข้อที่ผิด)
  multiple: true
  choices:
  - id: a
    text: 我们先吃饭，然后去看电影。
    feedback: ข้อนี้ถูก
  - id: b
    text: 他不但聪明，而且很努力。
    feedback: ข้อนี้ถูก (聪明 cōngming ฉลาด 努力 nǔlì ขยัน)
  - id: c
    text: 如果明天下雨，就我们不去。
    correct: true
    feedback: 'ผิด 就 ต้องอยู่หลังประธาน: 我们就不去'
  - id: d
    text: 虽然很贵，所以我买了。
    correct: true
    feedback: 'ผิด 虽然 ต้องคู่กับ 但是/可是: 虽然很贵，但是我买了'
  - id: e
    text: 所以我没去，因为下雨了。
    correct: true
    feedback: 'ผิด ห้ามเรียง 所以 ก่อน 因为: 我没去，因为下雨了'
  hints:
  - ตรวจคู่คำเชื่อม
  - ตรวจตำแหน่งของ 就 และลำดับของ 因为 กับ 所以
  solution: 'ผิด: **如果明天下雨，就我们不去** · **虽然很贵，所以我买了** · **所以我没去，因为下雨了**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.compound-sentences.p016
  topics:
  - chinese.grammar.compound-sentences
  difficulty: 5
  type: mcq
  stem: 'อ่านข้อความแสดงความคิดเห็นแล้วเลือกคำเชื่อมช่อง 1–4 ตามลำดับ: 我觉得清迈很好。＿1＿那儿的天气很凉快，＿2＿有很多好吃的东西。＿3＿清迈离曼谷有点儿远，＿4＿我每年都去。 (离 lí = ห่างจาก)'
  choices:
  - id: a
    text: 如果 · 就 · 虽然 · 但是
    feedback: ข้อดีของเชียงใหม่เป็นความจริง ไม่ใช่เงื่อนไข
  - id: b
    text: 不但 · 而且 · 虽然 · 但是
    correct: true
    feedback: ถูก ช่อง 1–2 บอกข้อดีสองข้อ ช่อง 3–4 ยอมรับข้อเสียแล้วแย้ง
  - id: c
    text: 因为 · 所以 · 虽然 · 但是
