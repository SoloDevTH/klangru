id: technology.living.teamwork-work-ethic
subject: technology
title:
  th: การทำงานกลุ่ม คุณธรรม และลักษณะนิสัยในการทำงาน
  en: Teamwork, work ethics and work habits
summary: บทบาทและกระบวนการทำงานกลุ่มให้สำเร็จ การแบ่งงานอย่างยุติธรรม การรับมือเมื่อสมาชิกติดขัดหรือเห็นต่าง คุณธรรมอย่างความซื่อสัตย์ ความเสียสละ และลักษณะนิสัยในการทำงาน
difficulty: 3
minutes: 30
prerequisites:
- technology.living.work-process
encompasses:
- id: technology.living.work-process
  weight: 0.2
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  title: บทบาทในกลุ่มงาน
  src: roles.svg
  alt: แผนภาพกล่องเป้าหมายร่วมด้านบนเชื่อมไปยังสี่กล่องด้านล่าง ได้แก่ ผู้นำ ที่ประสานงานและช่วยให้กลุ่มตัดสินใจร่วมกัน เลขานุการ ที่บันทึกความคืบหน้าและติดตามกำหนดส่ง สมาชิก ที่รับผิดชอบงานที่ได้รับให้เสร็จตามเวลา และผู้ดูแลวัสดุ ที่จัดหาและดูแลอุปกรณ์ที่ใช้ร่วมกัน
- type: worked-example
  title: แบ่งงานใหม่เมื่อสมาชิกหนึ่งคนไม่ส่งงาน
  problem: กลุ่ม 4 คนแบ่งงานคนละ 10 หน้า ต่อมาสมาชิกคนหนึ่งไม่ส่งงาน ต้องแบ่งงานของคนนั้นให้สามคนที่เหลือเท่า ๆ กัน แต่ละคนต้องทำเพิ่มเท่าใด
  steps:
  - text: ระบุงานที่ต้องแบ่งเพิ่ม คือ 10 หน้า ของสมาชิกที่ไม่ส่ง
  - text: นับจำนวนคนที่เหลือ คือ 3 คน
    why: ต้องไม่นับคนที่ไม่ส่งงานรวมในการแบ่ง
  - text: แบ่งงานเท่า ๆ กัน 10 ÷ 3 ≈ 3.3 หน้าต่อคน
  - text: รวมกับงานเดิม 10 + 3.3 ≈ 13.3 หน้าต่อคน
    why: ควรตรวจว่าเวลาที่เหลือเพียงพอก่อนยืนยันแผนใหม่
  answer: แต่ละคนต้องทำเพิ่มประมาณ 3.3 หน้า รวมเป็นประมาณ 13.3 หน้า แล้วคุยกับกลุ่มเพื่อยืนยันแผนใหม่
- type: check
  problem: technology.living.teamwork-work-ethic.p004
  prompt: ลองนึกถึงสมาชิกที่ไม่ส่งงานในกลุ่มของคุณ คุณจะเริ่มถามอะไรก่อน
- type: worked-example
  title: เมื่อเพื่อนขอให้ช่วยลอกงานเพื่อให้ทันกำหนด
  problem: เพื่อนในกลุ่มขอให้คุณส่งงานที่คัดลอกจากอินเทอร์เน็ตให้เขา เพราะเขาจะส่งไม่ทัน ควรตัดสินใจอย่างไร
  steps:
  - text: ระบุคุณธรรมที่เกี่ยวข้อง คือความซื่อสัตย์ การคัดลอกโดยไม่อ้างอิงขัดกับความซื่อสัตย์
  - text: ระบุผลกระทบต่อทุกคน ทั้งความไว้ใจในกลุ่ม การเรียนรู้ของเพื่อน และกฎของโรงเรียน
    why: การตัดสินใจที่ดีคิดถึงผู้ที่ได้รับผลด้วย
  - text: หาทางเลือกที่ซื่อสัตย์ เช่น บอกกลุ่มให้ช่วยกันแบ่งงานใหม่ ขอขยายเวลากับครู หรือช่วยอธิบายส่วนที่เขาเข้าใจ
  - text: เลือกทางที่ช่วยให้งานเสร็จโดยไม่ลอกและบอกกลุ่มทันที
  answer: ไม่ส่งงานที่คัดลอกให้ แต่ช่วยหาทางที่ซื่อสัตย์ เช่น แบ่งงานใหม่หรือขอขยายเวลาพร้อมบอกกลุ่ม
- type: check
  problem: technology.living.teamwork-work-ethic.p013
  prompt: ลองคิดถึงครั้งล่าสุดที่คุณไม่เห็นด้วยกับกลุ่ม คุณฟังจนจบก่อนตอบหรือไม่
glossary:
- term: เป้าหมายร่วม
  definition: สิ่งที่สมาชิกทุกคนในกลุ่มตกลงกันว่าจะทำให้สำเร็จ เขียนให้ชัดและวัดได้
- term: เลขานุการกลุ่ม
  definition: บทบาทที่บันทึกสิ่งที่ตกลงกันและติดตามกำหนดส่งงาน
- term: ความซื่อสัตย์ทางวิชาการ
  definition: การระบุที่มาของข้อมูลและผลงานตามจริง และไม่คัดลอกงานของผู้อื่นโดยไม่อ้างอิง
- term: ความเสียสละ
  definition: การให้ความสำคัญกับเป้าหมายส่วนรวม แม้ต้องรับภาระที่ยากหรือไม่สะดวกบ้าง
- term: ลักษณะนิสัยในการทำงาน
  definition: พฤติกรรมที่แสดงออกสม่ำเสมอในการทำงาน เช่น ขยัน อดทน รับผิดชอบ ตรงเวลา และประหยัด
flashcards:
- front: บทบาทในกลุ่มงานมีอะไรบ้าง
  back: ผู้นำ เลขานุการ สมาชิก และผู้ดูแลวัสดุ โดยแต่ละคนมีหน้าที่ชัดเจน
- front: ทำไมต้องตั้งเป้าหมายร่วมให้วัดได้
  back: เพื่อให้ทุกคนเข้าใจตรงกันว่าสำเร็จเมื่อใด และตรวจผลงานของกลุ่มได้
- front: เมื่อสมาชิกไม่ส่งงาน ควรทำอย่างไรเป็นอันดับแรก
  back: สังเกตและถามด้วยความเข้าใจ เพื่อหาสาเหตุก่อนปรับแผนร่วมกัน
- front: ความเสียสละในกลุ่มหมายถึงอะไร
  back: การให้ความสำคัญกับเป้าหมายส่วนรวม แม้ต้องรับงานที่ยากหรือไม่สะดวกบ้าง
