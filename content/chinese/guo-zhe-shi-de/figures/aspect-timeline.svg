<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 470" width="740" height="470" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei','Noto Sans Thai',sans-serif">
<title>เส้นเวลาเปรียบเทียบ 了 过 着 และ 是…的</title>
<defs><marker id="a1f4e9c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e9c"/></marker><marker id="a666" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker></defs>
<rect x="0" y="0" width="740" height="470" fill="#fff"/>
<text x="370.0" y="30.0" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="bold">了 · 过 · 着 · 是…的 บนเส้นเวลา</text>
<line x1="610.0" y1="52.0" x2="610.0" y2="440.0" stroke="#b3261e" stroke-width="2" stroke-linecap="round" stroke-dasharray="6,4"/>
<text x="610.0" y="460.0" font-size="15" text-anchor="middle" fill="#b3261e" font-weight="bold">ตอนนี้</text>
<text x="340.0" y="460.0" font-size="14" text-anchor="start" fill="#666" font-weight="normal">อดีต</text>
<text x="715.0" y="460.0" font-size="14" text-anchor="end" fill="#666" font-weight="normal"></text>
<rect x="20.0" y="60.0" width="300.0" height="78.0" rx="10" fill="#dcefd6" stroke="#2a6a2a" stroke-width="2"/>
<text x="170.0" y="92.0" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="bold">了: 他去了北京。</text>
<text x="170.0" y="118.0" font-size="14" text-anchor="middle" fill="#2a6a2a" font-weight="normal">ไปแล้ว (อาจยังอยู่ที่นั่น)</text>
<line x1="340.0" y1="118.0" x2="715.0" y2="118.0" stroke="#666" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a666)"/>
<circle cx="430.0" cy="118.0" r="8.0" fill="#2a6a2a" stroke="#2a6a2a" stroke-width="1.5"/>
<text x="430.0" y="102.0" font-size="14" text-anchor="middle" fill="#2a6a2a" font-weight="normal">ไป</text>
<line x1="440.0" y1="114.0" x2="604.0" y2="114.0" stroke="#2a6a2a" stroke-width="2" stroke-linecap="round" stroke-dasharray="5,4"/>
<text x="622.0" y="110.0" font-size="18" text-anchor="start" fill="#2a6a2a" font-weight="bold">?</text>
<rect x="20.0" y="156.0" width="300.0" height="78.0" rx="10" fill="#dbe8f8" stroke="#1f4e9c" stroke-width="2"/>
<text x="170.0" y="188.0" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="bold">过: 他去过北京。</text>
<text x="170.0" y="214.0" font-size="14" text-anchor="middle" fill="#1f4e9c" font-weight="normal">เคยไป เป็นประสบการณ์ จบแล้ว</text>
<line x1="340.0" y1="214.0" x2="715.0" y2="214.0" stroke="#666" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a666)"/>
<path d="M400,214 Q450,144 500,214" stroke="#1f4e9c" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#a1f4e9c)"/>
<text x="450.0" y="172.0" font-size="14" text-anchor="middle" fill="#1f4e9c" font-weight="normal">ไป แล้ว กลับ</text>
<rect x="20.0" y="252.0" width="300.0" height="78.0" rx="10" fill="#fbf0c0" stroke="#7a5a00" stroke-width="2"/>
<text x="170.0" y="284.0" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="bold">着: 门开着。</text>
<text x="170.0" y="310.0" font-size="14" text-anchor="middle" fill="#7a5a00" font-weight="normal">ประตูเปิดอยู่ สภาพค้างต่อเนื่อง</text>
<line x1="340.0" y1="310.0" x2="715.0" y2="310.0" stroke="#666" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a666)"/>
<rect x="500.0" y="298.0" width="200.0" height="24.0" rx="5" fill="#f2d27a" stroke="#7a5a00" stroke-width="1.5"/>
<text x="560.0" y="290.0" font-size="14" text-anchor="middle" fill="#7a5a00" font-weight="normal">สภาพต่อเนื่อง</text>
<rect x="20.0" y="348.0" width="300.0" height="78.0" rx="10" fill="#e6dcf5" stroke="#5b3a8c" stroke-width="2"/>
<text x="170.0" y="380.0" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="bold">是…的: 他是坐飞机去的。</text>
<text x="170.0" y="406.0" font-size="14" text-anchor="middle" fill="#5b3a8c" font-weight="normal">เรื่องเกิดแล้ว เน้น เมื่อไร ที่ไหน อย่างไร</text>
<line x1="340.0" y1="406.0" x2="715.0" y2="406.0" stroke="#666" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a666)"/>
<circle cx="450.0" cy="406.0" r="8.0" fill="#5b3a8c" stroke="#5b3a8c" stroke-width="1.5"/>
<polygon points="450,398 410,354 490,354" fill="#e6dcf5" stroke="#5b3a8c" stroke-width="1.5"/>
<text x="450.0" y="348.0" font-size="14" text-anchor="middle" fill="#5b3a8c" font-weight="normal">เน้นรายละเอียด</text>
</svg>
