<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" font-family="sans-serif" font-size="14">
<title>ผลการทดลองของเมเซลสันและสตาห์ล</title>
<rect x="0" y="0" width="820" height="420" fill="#ffffff"/>
<text x="410.0" y="28.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">ตำแหน่งแถบ DNA ในหลอดปั่นเหวี่ยง</text>
<line x1="150" y1="170" x2="690" y2="170" stroke="#cfd8dc" stroke-dasharray="5 4"/>
<text x="140.0" y="175.0" text-anchor="end" font-size="13" fill="#222">เบา (¹⁴N/¹⁴N)</text>
<line x1="150" y1="230" x2="690" y2="230" stroke="#cfd8dc" stroke-dasharray="5 4"/>
<text x="140.0" y="235.0" text-anchor="end" font-size="13" fill="#222">กึ่งกลาง (¹⁵N/¹⁴N)</text>
<line x1="150" y1="290" x2="690" y2="290" stroke="#cfd8dc" stroke-dasharray="5 4"/>
<text x="140.0" y="295.0" text-anchor="end" font-size="13" fill="#222">หนัก (¹⁵N/¹⁵N)</text>
<path d="M245,90 L245,320 A25,25 0 0 0 295,320 L295,90" fill="#f5f5f5" stroke="#455a64" stroke-width="2"/>
<rect x="248" y="282.0" width="44" height="16.0" fill="#1565c0" opacity="0.9"/>
<text x="270.0" y="375.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">รุ่น 0 (ใน ¹⁵N)</text>
<path d="M415,90 L415,320 A25,25 0 0 0 465,320 L465,90" fill="#f5f5f5" stroke="#455a64" stroke-width="2"/>
<rect x="418" y="222.0" width="44" height="16.0" fill="#1565c0" opacity="0.9"/>
<text x="440.0" y="375.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">รุ่น 1 (ใน ¹⁴N)</text>
<path d="M585,90 L585,320 A25,25 0 0 0 635,320 L635,90" fill="#f5f5f5" stroke="#455a64" stroke-width="2"/>
<rect x="588" y="224.0" width="44" height="12.0" fill="#1565c0" opacity="0.65"/>
<rect x="588" y="164.0" width="44" height="12.0" fill="#1565c0" opacity="0.65"/>
<text x="610.0" y="375.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">รุ่น 2 (ใน ¹⁴N)</text>
<text x="410.0" y="405.0" text-anchor="middle" font-size="12" fill="#555">แถบหนากว่าแปลว่ามี DNA มากกว่า รุ่น 2 มีแถบกึ่งกลางและแถบเบาอย่างละครึ่ง</text>
</svg>