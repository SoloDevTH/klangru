<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 355" width="450" height="355" font-family="sans-serif" font-size="16">
  <title>ลากเส้นผ่าน C ขนานกับ AB เพื่อแสดงว่ามุมภายในสามเหลี่ยมรวมกันได้ 180 องศา</title>
  <polygon points="80,290 340,290 236.1,67.1" fill="#e2f0ed" stroke="#15211e" stroke-width="2.5" stroke-linejoin="round" />
  <line x1="46.1" y1="67.1" x2="426.1" y2="67.1" stroke="#2b5f9e" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="48.1" y="57.1" text-anchor="start" fill="#2b5f9e" font-size="13" >เส้นผ่าน C ขนานกับ AB</text>
  <path d="M 80 290 L 114 290 A 34 34 0 0 0 99.5 262.1 Z" fill="#fbe3d3" stroke="#b4521f" stroke-width="2"/>
  <path d="M 340 290 L 325.6 259.2 A 34 34 0 0 0 306 290 Z" fill="#d5ece6" stroke="#0a6b60" stroke-width="2"/>
  <path d="M 236.1 67.1 L 206.1 67.1 A 30 30 0 0 0 218.9 91.7 Z" fill="#fbe3d3" stroke="#b4521f" stroke-width="2"/>
  <path d="M 236.1 67.1 L 248.7 94.3 A 30 30 0 0 0 266.1 67.1 Z" fill="#d5ece6" stroke="#0a6b60" stroke-width="2"/>
  <path d="M 236.1 67.1 L 222.3 86.8 A 24 24 0 0 0 246.2 88.9 Z" fill="#ead9f0" stroke="#7a3f8f" stroke-width="2"/>
  <text x="126.1" y="272" text-anchor="middle" fill="#b4521f" font-size="18" font-style="italic" font-weight="bold">a</text>
  <text x="296.1" y="268.1" text-anchor="middle" fill="#0a6b60" font-size="18" font-style="italic" font-weight="bold">b</text>
  <text x="195.3" y="94.4" text-anchor="middle" fill="#b4521f" font-size="18" font-style="italic" font-weight="bold">a</text>
  <text x="274.9" y="97.8" text-anchor="middle" fill="#0a6b60" font-size="18" font-style="italic" font-weight="bold">b</text>
  <text x="232.6" y="113" text-anchor="middle" fill="#7a3f8f" font-size="18" font-style="italic" font-weight="bold">c</text>
  <text x="66" y="308" text-anchor="middle" fill="#15211e" font-size="16" font-weight="bold">A</text>
  <text x="354" y="308" text-anchor="middle" fill="#15211e" font-size="16" font-weight="bold">B</text>
  <text x="236.1" y="55.1" text-anchor="middle" fill="#15211e" font-size="16" font-weight="bold">C</text>
  <text x="210" y="335" text-anchor="middle" fill="#15211e" font-size="17" >a + c + b = 180° (มุมบนเส้นตรง)</text>
</svg>
