<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" font-family="sans-serif">
<title>พูดแสดงความคิดเห็น 4 ขั้น</title>
<defs><marker id="a888" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker></defs>
<rect x="0" y="0" width="860" height="440" fill="#fff"/>
<text x="20.0" y="34.0" font-size="21" text-anchor="start" fill="#1f5fbf" font-weight="bold">พูดแสดงความคิดเห็นต่อเรื่องที่ฟังและดู 4 ขั้น</text>
<rect x="70.0" y="60.0" width="770.0" height="78.0" rx="12" fill="#fff" stroke="#1f5fbf" stroke-width="2"/>
<circle cx="38.0" cy="99.0" r="22.0" fill="#1f5fbf" stroke="#1f5fbf" stroke-width="1.5"/>
<text x="38.0" y="106.0" font-size="20" text-anchor="middle" fill="#fff" font-weight="bold">1</text>
<text x="90.0" y="107.0" font-size="20" text-anchor="start" fill="#1f5fbf" font-weight="bold">บอกเรื่อง</text>
<text x="360.0" y="93.0" font-size="18" text-anchor="start" fill="#222" font-weight="normal">"จากคลิปสารคดีเรื่อง</text>
<text x="360.0" y="120.0" font-size="18" text-anchor="start" fill="#222" font-weight="normal">ขยะพลาสติกในทะเล..."</text>
<line x1="38.0" y1="122.0" x2="38.0" y2="168.0" stroke="#888" stroke-width="2" stroke-linecap="round" marker-end="url(#a888)"/>
<rect x="70.0" y="152.0" width="770.0" height="78.0" rx="12" fill="#fff" stroke="#1f5fbf" stroke-width="2"/>
<circle cx="38.0" cy="191.0" r="22.0" fill="#1f5fbf" stroke="#1f5fbf" stroke-width="1.5"/>
<text x="38.0" y="198.0" font-size="20" text-anchor="middle" fill="#fff" font-weight="bold">2</text>
<text x="90.0" y="199.0" font-size="20" text-anchor="start" fill="#1f5fbf" font-weight="bold">สรุปแนวคิดสำคัญ</text>
<text x="360.0" y="185.0" font-size="18" text-anchor="start" fill="#222" font-weight="normal">"คลิปต้องการบอกว่าขยะบนบก</text>
<text x="360.0" y="212.0" font-size="18" text-anchor="start" fill="#222" font-weight="normal">ไหลลงทะเลและทำร้ายสัตว์"</text>
<line x1="38.0" y1="214.0" x2="38.0" y2="260.0" stroke="#888" stroke-width="2" stroke-linecap="round" marker-end="url(#a888)"/>
<rect x="70.0" y="244.0" width="770.0" height="78.0" rx="12" fill="#fff" stroke="#1e8449" stroke-width="2"/>
<circle cx="38.0" cy="283.0" r="22.0" fill="#1e8449" stroke="#1e8449" stroke-width="1.5"/>
<text x="38.0" y="290.0" font-size="20" text-anchor="middle" fill="#fff" font-weight="bold">3</text>
<text x="90.0" y="291.0" font-size="20" text-anchor="start" fill="#1e8449" font-weight="bold">ความคิดเห็น + เหตุผล</text>
<text x="360.0" y="277.0" font-size="18" text-anchor="start" fill="#222" font-weight="normal">"ผมคิดว่าเราควรพกกระบอกน้ำ</text>
<text x="360.0" y="304.0" font-size="18" text-anchor="start" fill="#222" font-weight="normal">เพราะในคลิปพบขวดมากที่สุด"</text>
<line x1="38.0" y1="306.0" x2="38.0" y2="352.0" stroke="#888" stroke-width="2" stroke-linecap="round" marker-end="url(#a888)"/>
<rect x="70.0" y="336.0" width="770.0" height="78.0" rx="12" fill="#fff" stroke="#b9770e" stroke-width="2"/>
<circle cx="38.0" cy="375.0" r="22.0" fill="#b9770e" stroke="#b9770e" stroke-width="1.5"/>
<text x="38.0" y="382.0" font-size="20" text-anchor="middle" fill="#fff" font-weight="bold">4</text>
<text x="90.0" y="383.0" font-size="20" text-anchor="start" fill="#b9770e" font-weight="bold">ความรู้สึก / ข้อเสนอแนะ</text>
<text x="360.0" y="369.0" font-size="18" text-anchor="start" fill="#222" font-weight="normal">"ผมรู้สึกตกใจ และอยากชวน</text>
<text x="360.0" y="396.0" font-size="18" text-anchor="start" fill="#222" font-weight="normal">ห้องเราแยกขยะทุกวัน"</text>
