problems:
  - id: math.func.p001
    topics: [math.functions.functions-intro]
    difficulty: 1
    type: numeric
    stem: "ให้ $f(x) = 3x - 5$ จงหา $f(4)$"
    answer: { value: 7 }
    hints:
      - "$f(4)$ คือค่าของฟังก์ชันเมื่อใส่ $x = 4$ เข้าไป"
      - "แทน $x$ ทุกตัวในสูตรด้วย 4 แล้วคำนวณ"
    misconceptions:
      - { match: 3, feedback: "ดูเหมือนแก้สมการ $3x - 5 = 4$ แต่ $f(4)$ แปลว่าแทน $x = 4$ ไม่ใช่ให้ $f(x)$ เท่ากับ 4" }
    solution: "แทน $x = 4$: $f(4) = 3(4) - 5 = 12 - 5 = 7$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.func.p002
    topics: [math.functions.functions-intro]
    difficulty: 1
    type: mcq
    stem: "ความสัมพันธ์ใดเป็นฟังก์ชัน"
    choices:
      - { id: a, text: "$\\{(1, 2), (2, 3), (3, 2)\\}$", correct: true }
      - { id: b, text: "$\\{(1, 2), (1, 3), (2, 4)\\}$", feedback: "$x = 1$ จับคู่กับทั้ง 2 และ 3 ค่า $x$ หนึ่งค่าให้ $y$ ได้หลายค่า จึงไม่เป็นฟังก์ชัน" }
      - { id: c, text: "$\\{(4, 0), (5, 1), (4, 2)\\}$", feedback: "$x = 4$ ปรากฏสองครั้งและให้ $y$ ต่างกัน (0 กับ 2) จึงไม่เป็นฟังก์ชัน" }
      - { id: d, text: "$\\{(0, 1), (0, -1), (1, 0)\\}$", feedback: "$x = 0$ ให้ทั้ง 1 และ $-1$ จึงไม่เป็นฟังก์ชัน" }
    hints:
      - "ฟังก์ชันต้องให้ค่า $y$ เพียงค่าเดียวสำหรับค่า $x$ แต่ละค่า"
      - "ดูว่ามีค่า $x$ ตัวใดซ้ำแล้วจับคู่กับ $y$ ต่างกันหรือไม่ ส่วนค่า $y$ ที่ซ้ำกันไม่เป็นปัญหา"
    solution: "ในข้อ a ค่า $x$ คือ 1, 2, 3 ไม่ซ้ำกันเลย จึงเป็นฟังก์ชัน (ค่า $y$ ซ้ำกันคือ 2 ได้) ส่วนข้ออื่นมีค่า $x$ ซ้ำแล้วได้ $y$ ต่างกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.func.p003
    topics: [math.functions.functions-intro]
    difficulty: 2
    type: numeric
    stem: "ให้ $f(x) = 2x^2 - 3$ จงหา $f(-2)$"
    answer: { value: 5 }
    hints:
      - "แทน $x$ ด้วย $(-2)$ โดยใส่วงเล็บไว้ด้วย"
      - "ยกกำลังสองก่อน แล้วจึงคูณ 2 และลบ 3 ตามลำดับการดำเนินการ"
    misconceptions:
      - { match: 13, feedback: "ดูเหมือนคูณ 2 กับ $-2$ ก่อนแล้วจึงยกกำลังสอง ต้องยกกำลังก่อน: $2(-2)^2 = 2(4)$" }
      - { match: -11, feedback: "ดูเหมือนคิด $(-2)^2$ เป็น $-4$ จำนวนลบยกกำลังสองได้ค่าบวก $(-2)^2 = 4$" }
    solution: "$f(-2) = 2(-2)^2 - 3 = 2(4) - 3 = 8 - 3 = 5$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.func.p004
    topics: [math.functions.functions-intro]
    difficulty: 2
    type: mcq
    stem: "ในห้องเรียน นักเรียนแต่ละคนมีเลขที่ประจำตัวเพียงเลขเดียว และไม่มีสองคนใช้เลขที่ซ้ำกัน ส่วนกลุ่มเลือดของนักเรียนอาจซ้ำกันได้ ความสัมพันธ์ใดเป็นฟังก์ชันแน่นอน"
    choices:
      - { id: a, text: "จากนักเรียนไปยังกลุ่มเลือดของนักเรียนคนนั้น", correct: true }
      - { id: b, text: "จากกลุ่มเลือดไปยังนักเรียนที่มีกลุ่มเลือดนั้น", feedback: "กลุ่มเลือด A หนึ่งค่าอาจจับคู่กับนักเรียนหลายคน ค่าเข้าหนึ่งค่าจึงให้ค่าออกได้หลายค่า" }
      - { id: c, text: "ไม่มีข้อใดเป็นฟังก์ชัน เพราะนักเรียนหลายคนมีกลุ่มเลือดเดียวกัน", feedback: "ค่าออกซ้ำกันได้ ที่ห้ามคือค่าเข้าหนึ่งค่าให้ค่าออกหลายค่า นักเรียนแต่ละคนมีกลุ่มเลือดเดียว จึงเป็นฟังก์ชัน" }
    hints:
      - "ถามตัวเองว่า ค่าเข้าหนึ่งค่าให้ค่าออกได้กี่ค่า"
      - "ลองดูทีละทิศ: นักเรียนหนึ่งคนมีกลุ่มเลือดกี่กลุ่ม และกลุ่มเลือดหนึ่งกลุ่มมีนักเรียนได้กี่คน"
    solution: "นักเรียนหนึ่งคนมีกลุ่มเลือดเดียว ความสัมพันธ์จากนักเรียนไปยังกลุ่มเลือดจึงเป็นฟังก์ชัน (หลายคนกลุ่มเลือดเดียวกันได้) แต่กลุ่มเลือดหนึ่งกลุ่มจับคู่กับนักเรียนได้หลายคน ทิศกลับจึงไม่เป็นฟังก์ชัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.func.p005
    topics: [math.functions.functions-intro]
    difficulty: 2
    type: numeric
    stem: "การประปาแห่งหนึ่งคิดค่าน้ำรายเดือนตามฟังก์ชัน $c(x) = 50 + 8x$ เมื่อ $x$ เป็นปริมาณน้ำที่ใช้ (ลูกบาศก์เมตร) และ $c$ เป็นค่าน้ำ (บาท) ถ้าบ้านหนึ่งใช้น้ำ 15 ลูกบาศก์เมตร ต้องจ่ายค่าน้ำกี่บาท"
    answer: { value: 170, unit: บาท }
    hints:
      - "ค่าน้ำที่ต้องจ่ายคือ $c(15)$"
      - "แทน $x = 15$ คูณ 8 ก่อน แล้วจึงบวกค่าบริการ 50 บาท"
    misconceptions:
      - { match: 870, feedback: "ดูเหมือนคิดเป็น $(50 + 8) \\times 15$ ค่าบริการ 50 บาทจ่ายครั้งเดียว ส่วน 8 บาทเท่านั้นที่คูณกับปริมาณน้ำ" }
    solution: "$c(15) = 50 + 8(15) = 50 + 120 = 170$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.func.p006
    topics: [math.functions.functions-intro]
    difficulty: 3
    type: numeric
    stem: "ให้ $f(x) = 4x + 1$ ถ้า $f(a) = 21$ แล้ว $a$ มีค่าเท่าใด"
    answer: { value: 5 }
    hints:
      - "$f(a) = 21$ แปลว่าค่าออกเป็น 21 ต้องหาค่าเข้า"
      - "ตั้งสมการ $4a + 1 = 21$ แล้วแก้หา $a$"
    misconceptions:
      - { match: 85, feedback: "นั่นคือ $f(21)$ แต่โจทย์บอกว่าค่าออกเท่ากับ 21 ต้องย้อนกลับหาค่าเข้า" }
    solution: "$4a + 1 = 21$ → $4a = 20$ → $a = 5$ ตรวจ: $f(5) = 4(5) + 1 = 21$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.func.p007
    topics: [math.functions.functions-intro]
    difficulty: 3
    type: mcq
    stem: "ให้ $f(x) = \\sqrt{x - 2}$ โดเมนของ $f$ คือข้อใด"
    choices:
      - { id: a, text: "$x \\ge 2$", correct: true }
      - { id: b, text: "$x > 2$", feedback: "เมื่อ $x = 2$ ได้ $\\sqrt{0} = 0$ ซึ่งหาค่าได้ จึงต้องรวม 2 ด้วย" }
      - { id: c, text: "$x \\ge 0$", feedback: "สิ่งที่ห้ามติดลบคือ $x - 2$ ทั้งก้อน ไม่ใช่ $x$ เช่น $x = 1$ ได้ $\\sqrt{-1}$ ซึ่งไม่เป็นจำนวนจริง" }
      - { id: d, text: "จำนวนจริงทุกตัว", feedback: "รากที่สองของจำนวนลบไม่เป็นจำนวนจริง เช่น $x = 0$ ได้ $\\sqrt{-2}$" }
    hints:
      - "ในรากที่สองต้องไม่ติดลบ"
      - "ตั้งอสมการ $x - 2 \\ge 0$ แล้วแก้หา $x$"
    solution: "ต้องมี $x - 2 \\ge 0$ จึงได้ $x \\ge 2$ เช่น $f(2) = 0$ และ $f(6) = 2$ หาค่าได้ แต่ $f(1) = \\sqrt{-1}$ หาค่าไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.func.p008
    topics: [math.functions.functions-intro]
    difficulty: 3
    type: match
    stem: "จับคู่ฟังก์ชัน (โดเมนเป็นจำนวนจริงทุกตัว) กับเรนจ์ของฟังก์ชันนั้น"
    pairs:
      - { left: "$f(x) = x^2$", right: "$y \\ge 0$" }
      - { left: "$f(x) = 2x + 1$", right: "จำนวนจริงทุกตัว" }
      - { left: "$f(x) = -x^2 + 3$", right: "$y \\le 3$" }
      - { left: "$f(x) = 5$", right: "$\\{5\\}$" }
    hints:
      - "เรนจ์คือค่า $y$ ทั้งหมดที่ฟังก์ชันให้ออกมาได้"
      - "$x^2$ ไม่ติดลบเสมอ ส่วน $-x^2$ ไม่เป็นบวกเสมอ"
      - "ลองแทนค่า $x$ หลาย ๆ ค่าในแต่ละฟังก์ชัน แล้วดูว่าค่า $y$ ไปได้ถึงไหน"
    solution: "$x^2 \\ge 0$ เรนจ์จึงเป็น $y \\ge 0$ | $2x + 1$ เป็นเส้นตรงที่ไม่ขนานแกน $x$ ให้ค่าได้ทุกจำนวน | $-x^2 \\le 0$ จึงได้ $-x^2 + 3 \\le 3$ | $f(x) = 5$ ให้ค่า 5 เสมอ เรนจ์จึงเป็น $\\{5\\}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.func.p009
    topics: [math.functions.functions-intro]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "กราฟของความสัมพันธ์ใดเป็นฟังก์ชัน (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "$y = 2x + 1$", correct: true }
      - { id: b, text: "$y = x^2$", correct: true }
      - { id: c, text: "$y = 4$", correct: true }
      - { id: d, text: "$x = y^2$", feedback: "เมื่อ $x = 4$ จะได้ $y = 2$ และ $y = -2$ เส้นตั้ง $x = 4$ ตัดกราฟ 2 จุด จึงไม่เป็นฟังก์ชัน" }
      - { id: e, text: "$x = 3$", feedback: "กราฟเป็นเส้นตั้ง ค่า $x = 3$ จับคู่กับ $y$ ทุกค่า จึงไม่เป็นฟังก์ชัน" }
    hints:
      - "ใช้การทดสอบด้วยเส้นตั้ง: เส้นแนวตั้งเส้นใดตัดกราฟเกิน 1 จุดหรือไม่"
      - "สำหรับแต่ละข้อ ลองเลือกค่า $x$ หนึ่งค่า แล้วดูว่าได้ $y$ กี่ค่า"
    solution: "$y = 2x + 1$, $y = x^2$ และ $y = 4$ ให้ $y$ ค่าเดียวทุกค่า $x$ จึงเป็นฟังก์ชัน ส่วน $x = y^2$ ให้ $y = \\pm\\sqrt{x}$ สองค่า และ $x = 3$ เป็นเส้นตั้งที่มี $y$ ได้ทุกค่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.func.p010
    topics: [math.functions.functions-intro]
    difficulty: 4
    type: numeric
    stem: "ให้ $f(x) = 2x + 3$ และ $g(x) = x^2$ จงหา $f(g(3))$"
    answer: { value: 21 }
    hints:
      - "ฟังก์ชันประกอบทำจากตัวในออกมาตัวนอก"
      - "หา $g(3)$ ก่อน แล้วนำผลที่ได้ไปแทนใน $f$"
    misconceptions:
      - { match: 81, feedback: "นั่นคือ $g(f(3))$ ซึ่งทำ $f$ ก่อน แต่ $f(g(3))$ ต้องทำ $g$ ก่อน" }
      - { match: 18, feedback: "ดูเหมือนนำ $f(3)$ กับ $g(3)$ มาบวกกัน ฟังก์ชันประกอบต้องนำผลของ $g$ ไปใส่ใน $f$" }
    solution: "$g(3) = 3^2 = 9$ แล้ว $f(9) = 2(9) + 3 = 21$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.func.p011
    topics: [math.functions.functions-intro]
    difficulty: 4
    type: expression
    stem: "ให้ $f(x) = 3x - 1$ และ $g(x) = x + 2$ จงหา $f(g(x))$"
    prefix: "f(g(x)) ="
    answer: { latex: "3x+5", variables: [x] }
    hints:
      - "$f(g(x))$ คือการนำ $g(x)$ ทั้งก้อนไปแทนที่ $x$ ในสูตรของ $f$"
      - "เขียน $f(x + 2) = 3(\\ldots) - 1$ โดยใส่ $x + 2$ ในวงเล็บ"
      - "คูณ 3 เข้าไปในวงเล็บให้ครบทุกพจน์ แล้วรวมพจน์ที่เป็นตัวเลข"
    misconceptions:
      - { match: "3x+1", feedback: "ได้ $3x + 1$ เมื่อทำ $g(f(x))$ หรือเมื่อคูณ 3 ไม่ครบวงเล็บ ต้องแทน $x + 2$ ลงใน $f$ แล้วคูณ 3 ทั้ง $x$ และ 2: $3(x + 2) - 1$" }
      - { match: "(3x-1)(x+2)", feedback: "นั่นคือ $f(x)$ คูณ $g(x)$ ฟังก์ชันประกอบไม่ใช่การคูณ ให้นำ $g(x)$ ไปใส่แทน $x$ ใน $f$" }
    solution: "$f(g(x)) = f(x + 2) = 3(x + 2) - 1 = 3x + 6 - 1 = 3x + 5$ ตรวจด้วย $x = 1$: $g(1) = 3$, $f(3) = 8$ และ $3(1) + 5 = 8$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.func.p012
    topics: [math.functions.functions-intro]
    difficulty: 4
    type: numeric
    stem: "เครื่องปั่นน้ำผลไม้ราคาป้าย 1,500 บาท ร้านลดราคา 20% ก่อน แล้วจึงคิดภาษีมูลค่าเพิ่ม 7% จากราคาที่ลดแล้ว ถ้าให้ $f(x) = 0.8x$ เป็นราคาหลังลด และ $g(x) = 1.07x$ เป็นราคารวมภาษี ราคาที่ต้องจ่ายคือ $g(f(1500))$ เท่ากับกี่บาท"
    answer: { value: 1284, unit: บาท }
    hints:
      - "ทำฟังก์ชันตัวในก่อน คือหา $f(1500)$"
      - "นำราคาหลังลดที่ได้ไปคูณ 1.07"
      - "ลดราคาแล้วบวกภาษีเป็นการคูณต่อกันสองครั้ง ไม่ใช่นำร้อยละมาบวกลบกัน"
    misconceptions:
      - { match: 1305, feedback: "ดูเหมือนคิด $20\\% - 7\\% = 13\\%$ แล้วลด 13% ครั้งเดียว แต่ภาษีคิดจากราคาที่ลดแล้ว ต้องคูณ 0.8 แล้วคูณ 1.07 ต่อ" }
    solution: "$f(1500) = 0.8(1500) = 1200$ บาท แล้ว $g(1200) = 1.07(1200) = 1284$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.func.p013
    topics: [math.functions.functions-intro]
    difficulty: 5
    type: numeric
    stem: "ฟังก์ชัน $f$ มีสมบัติว่า $f(2x - 1) = 6x + 5$ สำหรับจำนวนจริง $x$ ทุกตัว จงหา $f(3)$"
    answer: { value: 17 }
    hints:
      - "ค่าที่อยู่ในวงเล็บของ $f$ ตอนนี้คือ $2x - 1$ ไม่ใช่ $x$"
      - "หาค่า $x$ ที่ทำให้ $2x - 1 = 3$ ก่อน"
      - "นำค่า $x$ ที่ได้ไปแทนใน $6x + 5$"
    misconceptions:
      - { match: 23, feedback: "ดูเหมือนแทน $x = 3$ ลงใน $6x + 5$ ตรง ๆ แต่ค่าที่ใส่เข้า $f$ คือ $2x - 1$ ซึ่งเมื่อ $x = 3$ ได้ $f(5)$ ไม่ใช่ $f(3)$" }
    solution: "ให้ $2x - 1 = 3$ จะได้ $x = 2$ ดังนั้น $f(3) = 6(2) + 5 = 17$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.func.p014
    topics: [math.functions.functions-intro]
    difficulty: 5
    type: mcq
    stem: "ให้ $f(x) = x^2 - 2$ มีโดเมนเป็น $\\{-2, -1, 0, 1, 2\\}$ เรนจ์ของ $f$ คือข้อใด"
    choices:
      - { id: a, text: "$\\{-2, -1, 2\\}$", correct: true }
      - { id: b, text: "$\\{-6, -3, -2, -1, 2\\}$", feedback: "ดูเหมือนคิด $(-2)^2 = -4$ และ $(-1)^2 = -1$ จำนวนลบยกกำลังสองได้ค่าบวก" }
      - { id: c, text: "$\\{-2, -1, 0, 1, 2\\}$", feedback: "นั่นคือโดเมน เรนจ์คือค่าที่ได้ออกมาหลังแทนค่าลงในฟังก์ชัน" }
