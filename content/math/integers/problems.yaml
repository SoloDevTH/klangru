problems:
  - id: math.int.p001
    topics: [math.number.integers]
    difficulty: 1
    type: mcq
    stem: "จำนวนใดมีค่าน้อยที่สุด: $-3,\\ 2,\\ -7,\\ 0$"
    choices:
      - { id: a, text: "$-7$", correct: true }
      - { id: b, text: "$-3$", feedback: "3 น้อยกว่า 7 ก็จริง แต่สำหรับจำนวนลบ ยิ่งค่าสัมบูรณ์มากยิ่งอยู่ทางซ้าย $-7$ จึงน้อยกว่า $-3$" }
      - { id: c, text: "$0$", feedback: "ศูนย์ไม่ใช่จำนวนที่น้อยที่สุด จำนวนลบทุกตัวอยู่ทางซ้ายของศูนย์จึงน้อยกว่าศูนย์" }
    hints:
      - "วาดเส้นจำนวน ตัวที่อยู่ซ้ายสุดคือตัวที่น้อยที่สุด"
      - "จำนวนลบทุกตัวน้อยกว่าศูนย์ ให้เทียบเฉพาะ $-3$ กับ $-7$ ว่าตัวไหนอยู่ห่างจากศูนย์ไปทางซ้ายมากกว่า"
    solution: "บนเส้นจำนวน เรียงจากซ้ายไปขวาได้ $-7, -3, 0, 2$ ตัวที่อยู่ซ้ายสุดคือ $-7$ จึงมีค่าน้อยที่สุด (เหมือน $-7$ องศาหนาวกว่า $-3$ องศา)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.int.p002
    topics: [math.number.integers]
    difficulty: 1
    type: numeric
    stem: "หาค่า $-8 + 5$"
    answer: { value: -3 }
    hints:
      - "เริ่มที่ $-8$ บนเส้นจำนวน การบวก 5 คือเดินไปทางขวา 5 ก้าว"
      - "เครื่องหมายต่างกัน ให้เอาค่าสัมบูรณ์ลบกัน แล้วใช้เครื่องหมายของตัวที่ค่าสัมบูรณ์มากกว่า"
    misconceptions:
      - { match: -13, feedback: "ดูเหมือนเอา 8 กับ 5 มาบวกกัน แต่เครื่องหมายต่างกัน ต้องเอาค่าสัมบูรณ์มาลบกัน" }
      - { match: 3, feedback: "ตัวเลข 3 ถูกแล้ว แต่เครื่องหมายผิด $-8$ มีค่าสัมบูรณ์มากกว่า 5 คำตอบจึงเป็นลบ" }
    solution: "เครื่องหมายต่างกัน: $8 - 5 = 3$ ใช้เครื่องหมายของ $-8$ (ค่าสัมบูรณ์มากกว่า) ได้ $-8 + 5 = -3$ ตรวจบนเส้นจำนวน: จาก $-8$ เดินขวา 5 ก้าว หยุดที่ $-3$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.int.p003
    topics: [math.number.integers]
    difficulty: 2
    type: numeric
    stem: "หาค่า $(-6) \\times (-4)$"
    answer: { value: 24 }
    hints:
      - "คูณตัวเลขตามปกติก่อน แล้วค่อยตัดสินเครื่องหมาย"
      - "เครื่องหมายเหมือนกันได้ผลเป็นบวก ต่างกันได้ผลเป็นลบ"
    misconceptions:
      - { match: -24, feedback: "ลบคูณลบได้ **บวก** เพราะเครื่องหมายเหมือนกัน" }
      - { match: -10, feedback: "ดูเหมือนนำมาบวกกัน แต่โจทย์เป็นการคูณ" }
    solution: "$6 \\times 4 = 24$ และเครื่องหมายเป็นลบทั้งคู่ (เหมือนกัน) ผลจึงเป็นบวก $(-6) \\times (-4) = 24$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.int.p004
    topics: [math.number.integers]
    difficulty: 2
    type: match
    stem: "จับคู่โจทย์กับผลลัพธ์ที่ถูกต้อง"
    pairs:
      - { left: "$-3 - 5$", right: "$-8$" }
      - { left: "$-3 - (-5)$", right: "$2$" }
      - { left: "$3 - (-5)$", right: "$8$" }
      - { left: "$(-15) \\div 3$", right: "$-5$" }
    hints:
      - "การลบจำนวนลบเหมือนการบวกจำนวนบวก: $a - (-b) = a + b$"
      - "สำหรับการหาร ตัวตั้งกับตัวหารเครื่องหมายต่างกันได้ผลเป็นลบ"
      - "ลองเปลี่ยน $-3 - (-5)$ เป็น $-3 + 5$ แล้วเดินบนเส้นจำนวนจาก $-3$ ไปทางขวา"
    solution: "$-3 - 5$: เดินซ้ายจาก $-3$ อีก 5 ก้าว ได้ $-8$ | $-3 - (-5) = -3 + 5 = 2$ | $3 - (-5) = 3 + 5 = 8$ | $(-15) \\div 3$: เครื่องหมายต่างกัน ได้ $-5$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.int.p005
    topics: [math.number.integers]
    difficulty: 3
    type: numeric
    stem: "ตอนเช้าบนยอดดอยวัดอุณหภูมิได้ $-2$ องศาเซลเซียส ตอนบ่ายวัดได้ $13$ องศาเซลเซียส อุณหภูมิเพิ่มขึ้นกี่องศาเซลเซียส"
    answer: { value: 15, unit: "°C" }
    hints:
      - "การเปลี่ยนแปลง = ค่าตอนหลัง − ค่าตอนแรก"
      - "เขียนเป็น $13 - (-2)$ แล้วจำไว้ว่าการลบจำนวนลบคือการบวก"
      - "นับบนเส้นจำนวน: จาก $-2$ ไปถึง $0$ ได้กี่ช่อง แล้วจาก $0$ ไปถึง $13$ ได้อีกกี่ช่อง"
    misconceptions:
      - { match: 11, feedback: "ดูเหมือนคิด $13 - 2$ แต่ตอนเช้าอุณหภูมิเป็น **ลบ** 2 ต้องคิด $13 - (-2) = 13 + 2$" }
      - { match: -15, feedback: "ดูเหมือนลบกลับด้าน ($-2 - 13$) อุณหภูมิสูงขึ้น ผลต่างจึงเป็นบวก ให้เอาค่าตอนหลังลบค่าตอนแรก" }
    solution: "เพิ่มขึ้น $= 13 - (-2) = 13 + 2 = 15$ องศาเซลเซียส ตรวจบนเส้นจำนวน: จาก $-2$ ถึง $0$ มี 2 ช่อง จาก $0$ ถึง $13$ มี 13 ช่อง รวม 15 ช่อง ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.int.p006
    topics: [math.number.integers]
    difficulty: 3
    type: numeric
    stem: "หาค่า $-2 + 3 \\times (-4)$"
    answer: { value: -14 }
    hints:
      - "ไม่มีวงเล็บ ดังนั้นต้องคูณก่อนบวก"
      - "หาค่า $3 \\times (-4)$ ก่อน แล้วนำผลไปบวกกับ $-2$"
    misconceptions:
      - { match: -4, feedback: "ดูเหมือนบวก $-2 + 3$ ก่อนแล้วค่อยคูณ ลำดับการดำเนินการบอกว่าต้องคูณก่อนบวก" }
      - { match: 10, feedback: "ลองตรวจเครื่องหมาย $3 \\times (-4) = -12$ ไม่ใช่ $12$ (บวกคูณลบได้ลบ)" }
    solution: "คูณก่อน: $3 \\times (-4) = -12$ แล้วบวก: $-2 + (-12) = -14$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.int.p007
    topics: [math.number.integers]
    difficulty: 4
    type: order
    stem: "เรียงขั้นตอนการหาค่า $18 \\div (-3) - 2 \\times (4 - 7)$ ให้ถูกต้องตามลำดับการดำเนินการ"
    items:
      - "คำนวณในวงเล็บ: $18 \\div (-3) - 2 \\times (-3)$"
      - "หาร: $-6 - 2 \\times (-3)$"
      - "คูณ: $-6 - (-6)$"
      - "ลบจำนวนลบคือบวก: $-6 + 6 = 0$"
    hints:
      - "วงเล็บต้องมาก่อนเสมอ"
      - "คูณและหารมีลำดับเท่ากัน ให้ทำจากซ้ายไปขวา"
      - "การบวกลบเป็นขั้นสุดท้าย และอย่าลืมว่า $a - (-b) = a + b$"
    solution: "วงเล็บ: $4 - 7 = -3$ → หาร (อยู่ซ้ายกว่า): $18 \\div (-3) = -6$ → คูณ: $2 \\times (-3) = -6$ → ลบ: $-6 - (-6) = -6 + 6 = 0$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.int.p008
    topics: [math.number.integers]
    difficulty: 5
    type: numeric
    stem: "แม่ค้าขายของที่ตลาดนัด 5 วัน บันทึกกำไรเป็นจำนวนบวกและขาดทุนเป็นจำนวนลบ ได้ดังนี้ $120,\\ -80,\\ -150,\\ 200,\\ -40$ บาท โดยเฉลี่ยแล้วได้กำไรวันละกี่บาท (ถ้าขาดทุนให้ตอบเป็นจำนวนลบ)"
    answer: { value: 10, unit: บาท }
    hints:
      - "ค่าเฉลี่ย = ผลรวมทั้งหมด ÷ จำนวนวัน"
      - "รวมกำไรทั้งหมดและขาดทุนทั้งหมดแยกกันก่อนก็ได้ แล้วค่อยนำมารวมกัน"
      - "กำไรรวม $120 + 200$ ขาดทุนรวม $(-80) + (-150) + (-40)$ นำสองค่านี้มาบวกกัน แล้วหารด้วย 5"
    misconceptions:
      - { match: 118, feedback: "ดูเหมือนนำทุกจำนวนมาบวกกันโดยไม่สนเครื่องหมาย ขาดทุนต้องนับเป็นจำนวนลบ" }
      - { match: 50, feedback: "นี่คือกำไรรวม 5 วัน ยังต้องหารด้วย 5 เพื่อหาค่าเฉลี่ยต่อวัน" }
    solution: "กำไรรวม $120 + 200 = 320$ ขาดทุนรวม $(-80) + (-150) + (-40) = -270$ ผลรวม $320 + (-270) = 50$ บาท เฉลี่ย $50 \\div 5 = 10$ บาทต่อวัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.int.p009
    topics: [math.number.integers]
    difficulty: 2
    type: numeric
    stem: "นักดำน้ำที่เกาะเต่าอยู่ที่ระดับ $-12$ เมตร (ต่ำกว่าระดับน้ำทะเล 12 เมตร) แล้วว่ายขึ้นมา 5 เมตร ตอนนี้นักดำน้ำอยู่ที่ระดับกี่เมตร (ตอบเป็นจำนวนเต็มพร้อมเครื่องหมาย)"
    answer: { value: -7, unit: เมตร }
    hints:
      - "ว่ายขึ้นคือการบวก ระดับใหม่ $= -12 + 5$"
      - "เครื่องหมายต่างกัน ให้เอาค่าสัมบูรณ์ลบกัน แล้วใช้เครื่องหมายของตัวที่ค่าสัมบูรณ์มากกว่า"
    misconceptions:
      - { match: -17, feedback: "ดูเหมือนว่ายลงไปอีก 5 เมตร ($-12 - 5$) แต่ว่ายขึ้นแปลว่าเข้าใกล้ระดับน้ำทะเล ต้องบวก 5" }
      - { match: 7, feedback: "ตัวเลข 7 ถูกแล้ว แต่นักดำน้ำยังอยู่ใต้น้ำ ระดับจึงต้องเป็นลบ" }
    solution: "$-12 + 5$: เครื่องหมายต่างกัน $12 - 5 = 7$ ใช้เครื่องหมายของ $-12$ ได้ $-7$ เมตร คือยังอยู่ต่ำกว่าระดับน้ำทะเล 7 เมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.int.p010
    topics: [math.number.integers]
    difficulty: 4
    type: numeric
    stem: "หาค่า $(-24) \\div (-6) \\times (-2)$"
    answer: { value: -8 }
    hints:
      - "คูณและหารมีลำดับเท่ากัน ให้ทำจากซ้ายไปขวา"
      - "หา $(-24) \\div (-6)$ ก่อน แล้วนำผลไปคูณกับ $(-2)$"
      - "ตัดสินเครื่องหมายทีละขั้น: เหมือนกันได้บวก ต่างกันได้ลบ"
    misconceptions:
      - { match: -2, feedback: "ดูเหมือนคูณ $(-6) \\times (-2)$ ก่อนแล้วค่อยหาร คูณกับหารมีลำดับเท่ากัน ต้องทำจากซ้ายไปขวา จึงต้องหารก่อน" }
      - { match: 8, feedback: "ตัวเลขถูกแล้ว แต่ลองตรวจเครื่องหมาย $(-24) \\div (-6) = 4$ (บวก) แล้ว $4 \\times (-2)$ ได้ลบ" }
    solution: "ซ้ายไปขวา: $(-24) \\div (-6) = 4$ (ลบหารลบได้บวก) แล้ว $4 \\times (-2) = -8$ (บวกคูณลบได้ลบ)"
    license: CC-BY-SA-4.0
    ai_assisted: true
