    text: จ่ายภาษีเฉพาะปีที่อยากจ่าย
    feedback: การเสียภาษีเป็นหน้าที่ตามกฎหมาย ไม่ขึ้นกับความสมัครใจ
  - id: c
    text: แจ้งรายได้ให้น้อยกว่าจริงเพื่อเสียภาษีน้อย
    feedback: เป็นการหลีกเลี่ยงภาษีที่ผิดกฎหมาย
  - id: d
