  - id: phy.n3.p020
    topics: [physics.dynamics.newton-third]
    difficulty: 5
    type: numeric
    stem: "ดันกล่อง A มวล $4\\ \\mathrm{kg}$ ด้วยแรง $50\\ \\mathrm{N}$ ในแนวราบ กล่อง A ดันกล่อง B มวล $6\\ \\mathrm{kg}$ ที่วางชิดอยู่ พื้นมีสัมประสิทธิ์ความเสียดทานจลน์ $0.2$ กับทั้งสองกล่อง แรงที่ A ดัน B มีขนาดเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 30, tolerance: 0.3, unit: N }
    hints:
      - "มองทั้งสองกล่องเป็นก้อนเดียว: แรงลัพธ์ $= 50 - 0.2(10)(9.8)$ แล้วหาความเร่ง"
      - "แยกดูกล่อง B: แรงที่ A ดัน B ต้องเอาชนะแรงเสียดทานของ B และทำให้ B เร่ง"
      - "$F_{AB} - 0.2\\,m_B g = m_B a$"
    misconceptions:
      - { match: 18.24, feedback: "ดูเหมือนลืมแรงเสียดทานที่พื้นกระทำต่อกล่อง B ($0.2 \\times 6 \\times 9.8 = 11.76\\ \\mathrm{N}$) ซึ่ง A ต้องดันชนะด้วย" }
      - { match: 50, feedback: "แรง $50\\ \\mathrm{N}$ กระทำต่อ A ส่วนหนึ่งใช้เร่ง A และชนะแรงเสียดทานของ A จึงเหลือส่งต่อให้ B น้อยกว่านั้น" }
    solution: "$a = \\dfrac{50 - 0.2(10)(9.8)}{10} = \\dfrac{50 - 19.6}{10} = 3.04\\ \\mathrm{m/s^2}$ สำหรับ B: $F_{AB} = m_B a + 0.2\\,m_B g = 6(3.04) + 11.76 = 30\\ \\mathrm{N}$ (น่าสนใจว่าเท่ากับกรณีไม่มีแรงเสียดทาน $50 \\times \\tfrac{6}{10}$ เพราะ $\\mu$ เท่ากันทั้งสองกล่อง)"
