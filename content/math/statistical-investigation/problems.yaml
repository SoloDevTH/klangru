  - id: math.stats.statistical-investigation.p016
    topics: [math.stats.statistical-investigation]
    difficulty: 4
    type: mcq
    stem: "นักเรียนอยากรู้ว่าปุ๋ยน้ำชนิดใหม่ทำให้ผักบุ้งโตเร็วขึ้นหรือไม่ การออกแบบใดดีที่สุด"
    choices:
      - { id: a, text: "ปลูกผักบุ้งสองกระบะ ดิน น้ำ และแดดเท่ากัน ใส่ปุ๋ยใหม่กระบะเดียว แล้ววัดความสูงทุกต้นหลัง 14 วัน", correct: true }
      - { id: b, text: "ถามแม่ค้าในตลาดว่าเคยได้ยินว่าปุ๋ยนี้ดีไหม", feedback: "ได้แค่ความเห็น ไม่ได้วัดผลจริง" }
      - { id: c, text: "ใส่ปุ๋ยใหม่ในกระบะที่อยู่กลางแดด และไม่ใส่ในกระบะที่อยู่ในร่ม", feedback: "แดดต่างกันด้วย ถ้ากระบะแรกโตเร็ว จะไม่รู้ว่าเพราะปุ๋ยหรือเพราะแดด" }
      - { id: d, text: "ใส่ปุ๋ยใหม่ในกระบะเดียว แล้วดูว่าโตไหม", feedback: "ไม่มีกระบะเปรียบเทียบ ผักบุ้งโตอยู่แล้วแม้ไม่ใส่ปุ๋ย" }
    hints:
      - "นี่เป็นคำถามเรื่องผลของการเปลี่ยนแปลง จึงควรทดลอง"
      - "ต้องมีกลุ่มเปรียบเทียบ และให้ต่างกันแค่ปุ๋ยอย่างเดียว"
    solution: "การทดลองที่ดีมีกลุ่มเปรียบเทียบ เปลี่ยนแค่สิ่งที่สนใจ (ปุ๋ย) ควบคุมอย่างอื่นให้เท่ากัน และวัดผลเป็นตัวเลขจากหลายต้น"
