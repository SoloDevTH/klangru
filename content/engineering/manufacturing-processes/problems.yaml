        feedback: ได้ผลเป็นนาทีแต่โจทย์ถามเป็นชั่วโมง ให้หารด้วย 60 อีกครั้ง
    solution: จำนวนชั้น = 60 ÷ 0.2 = 300 ชั้น เวลาทั้งหมด = 300 × 45 = 13,500 วินาที = 225 นาที = 3.75 ชั่วโมง
