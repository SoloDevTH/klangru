<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 230" width="300" height="230" font-family="sans-serif" font-size="16">
  <title>ที่นารูปสี่เหลี่ยมคางหมู ด้านขนาน 30 m และ b สูง 40 m</title>
  
  <polygon points="60.0,190.0 260.0,190.0 212.0,30.0 92.0,30.0" fill="#e6f0d8" stroke="#15211e" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="92.0" y1="30.0" x2="92.0" y2="190.0" stroke="#0a6b60" stroke-width="2" stroke-dasharray="6 4"/>
  <polyline points="102.0,190.0 102.0,180.0 92.0,180.0" fill="none" stroke="#15211e" stroke-width="2" stroke-linejoin="round"/>
  <text x="152.0" y="16.0" text-anchor="middle" dominant-baseline="middle" fill="#0a6b60">30 m</text>
  <text x="160.0" y="208.0" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="bold" font-style="italic" fill="#b4521f">b</text>
  <text x="100.0" y="110.0" text-anchor="start" dominant-baseline="middle" fill="#0a6b60">40 m</text>
  <text x="180.0" y="154.0" text-anchor="middle" dominant-baseline="middle" font-size="14">พื้นที่ 1,600 m²</text>
</svg>
