  stem: จับคู่สถานการณ์ที่เกิดในเกมกับการปรับที่เหมาะสม
  pairs:
  - left: คนเก่งยิงทุกลูกทำให้คนอื่นไม่ได้เล่น
    right: กำหนดให้ทุกคนต้องสัมผัสบอลก่อนยิง
  - left: สนามกว้างเกินไปจนผู้เล่นตามบอลไม่ทัน
    right: ลดขนาดพื้นที่เล่น
  - left: ผู้เล่นใช้รถเข็นเข้าถึงลูกบอลไม่ได้
    right: ปรับจุดเริ่มและอุปกรณ์ให้เข้าถึงได้
  - left: อุปกรณ์แข็งทำให้ผู้เล่นเจ็บ
    right: เปลี่ยนเป็นลูกบอลนิ่มหรือเบาลง
  hints:
  - ลองนึกว่าปัญหาแต่ละข้อแก้ได้ด้วยการปรับด้านใด
  - การปรับที่ดีควรแก้ที่ต้นเหตุของปัญหา
  solution: คนเก่งยิงทุกลูก = กำหนดให้ทุกคนต้องสัมผัสบอลก่อนยิง, สนามกว้างเกินไป = ลดขนาดพื้นที่เล่น, ผู้เล่นใช้รถเข็นเข้าถึงลูกบอลไม่ได้ = ปรับจุดเริ่มและอุปกรณ์ให้เข้าถึงได้, อุปกรณ์แข็งทำให้เจ็บ = เปลี่ยนเป็นลูกบอลนิ่มหรือเบาลง
