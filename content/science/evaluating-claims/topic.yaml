id: science.inquiry.evaluating-claims
subject: science
title:
  th: การประเมินผลการทดลอง หลักฐาน และข้อกล่าวอ้าง
  en: Evaluating experiments, evidence and claims
summary: ประเมินวิธีการทดลอง กลุ่มควบคุม ยาหลอก ขนาดตัวอย่าง และการทำซ้ำ แยกสหสัมพันธ์กับเหตุและผล อ่านความเสี่ยงสัมพัทธ์และสัมบูรณ์ เสนอการปรับปรุง และตรวจข้อกล่าวอ้างในสื่อ
difficulty: 3.5
minutes: 35
prerequisites:
- science.inquiry.data-analysis
- physics.units.measurement
- science.nature.nature-of-science
encompasses:
- id: science.inquiry.data-analysis
  weight: 0.2
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  title: การทดลองแบบมีกลุ่มควบคุม สุ่ม และปกปิด
  src: controlled-trial.svg
  alt: "ผังงาน อาสาสมัคร 200 คนที่ยินยอมเข้าร่วม ถูกสุ่มแบ่งเป็นสองกลุ่ม กลุ่มทดลอง 100 คนได้เครื่องดื่มที่มีสารทดสอบ กลุ่มควบคุม 100 คนได้เครื่องดื่มหน้าตาเหมือนกันแต่ไม่มีสาร ตรงกลางเขียนว่าปกปิด ทั้งผู้เข้าร่วมและผู้วัดผลไม่รู้ว่าใครอยู่กลุ่มใด ทั้งสองกลุ่มไปที่กล่องวัดผลแบบเดียวกันแล้วเปรียบเทียบสองกลุ่ม ด้านล่างบอกว่าความต่างระหว่างสองกลุ่มจึงเกิดจากสารทดสอบ ไม่ใช่ความคาดหวังหรือความบังเอิญในการแบ่งกลุ่ม"
  caption: "การสุ่ม กลุ่มควบคุม และการปกปิด ช่วยแยกผลของสิ่งที่ทดสอบออกจากปัจจัยอื่น (วาดโดยทีมคลังรู้ ตัวอย่างสมมติ)"
- type: worked-example
  title: ประเมินและปรับปรุงการทดลองของเพื่อน
  problem: "เพื่อนทดลองว่าน้ำตาลทำให้ดอกไม้ในแจกันบานนานขึ้น โดยใส่ดอกกุหลาบ 1 ดอกในน้ำผสมน้ำตาลวางริมหน้าต่าง และอีก 1 ดอกในน้ำเปล่าวางในห้องแอร์ พบว่าดอกในน้ำตาลเหี่ยวเร็วกว่า จึงสรุปว่า \"น้ำตาลทำให้ดอกไม้เหี่ยวเร็ว\" ประเมินและเสนอการปรับปรุง"
  steps:
  - text: "ตัวแปรต้นคือน้ำตาล แต่สองแจกันยังต่างกันเรื่องที่วางด้วย (แดดและอุณหภูมิ) การทดลองจึงไม่ยุติธรรม"
    why: "ถ้าต่างกันมากกว่าหนึ่งอย่าง ไม่รู้ว่าผลมาจากอะไร"
  - text: "ใช้ดอกไม้กลุ่มละดอกเดียว ดอกแต่ละดอกต่างกันตามธรรมชาติ ผลอาจเกิดโดยบังเอิญ"
  - text: "ข้อสันนิษฐานที่ไม่ได้ตรวจ: ดอกทั้งสองสดเท่ากันตั้งแต่ต้น และการตัดสินว่า \"เหี่ยว\" ทำแบบเดียวกัน"
  - text: "ปรับปรุง: วางทุกแจกันที่เดียวกัน ใช้ดอกกลุ่มละ 5–10 ดอกที่สุ่มจากช่อเดียวกัน กำหนดเกณฑ์เหี่ยวชัดเจน (เช่น กลีบร่วงกี่กลีบ) และให้คนที่ไม่รู้ว่าแจกันใดมีน้ำตาลเป็นผู้ตัดสิน"
  answer: "ข้อสรุปเดิมเชื่อถือไม่ได้ เพราะมีตัวแปรแทรกซ้อนและตัวอย่างน้อย ต้องควบคุมตัวแปร เพิ่มจำนวนดอก และวัดผลอย่างเป็นกลาง"
- type: check
  problem: science.inquiry.evaluating-claims.p003
- type: figure
  title: ตัวแปรแทรกซ้อน
  src: confounding.svg
  alt: "แผนภาพ กล่องบนสุดคืออากาศร้อน เดือนมีนาคม–พฤษภาคม มีลูกศรสีแดงเขียนว่าเป็นสาเหตุ ชี้ลงไปที่กล่องซ้าย ขายไอศกรีมได้มาก เพราะคนอยากกินของเย็น และกล่องขวา คนจมน้ำมากขึ้น เพราะคนไปเล่นน้ำมากขึ้น ระหว่างสองกล่องล่างมีเส้นประเขียนว่าเพิ่มขึ้นพร้อมกัน (สหสัมพันธ์) แต่ไอศกรีมไม่ได้ทำให้คนจมน้ำ"
  caption: "อากาศร้อนเป็นตัวแปรแทรกซ้อนที่ทำให้สองสิ่งเปลี่ยนพร้อมกัน (วาดโดยทีมคลังรู้ ตัวอย่างสมมติ)"
- type: worked-example
  title: อ่านข่าวความเสี่ยงอย่างมีวิจารณญาณ
  problem: "พาดหัวข่าวสมมติ: \"กินอาหาร X เป็นประจำ เพิ่มความเสี่ยงโรค Y ถึง 20%\" ในเนื้อข่าวบอกว่าความเสี่ยงเดิม 5 ใน 10,000 คน ประเมินว่าควรกังวลเพียงใด"
  steps:
  - text: "20% เป็นความเสี่ยงสัมพัทธ์ ความเสี่ยงใหม่ $= 5 \\times 1.2 = 6$ ใน 10,000 คน"
  - text: "ความเสี่ยงสัมบูรณ์เพิ่ม $6 - 5 = 1$ คนใน 10,000 คน หรือ 0.01 จุดร้อยละ"
    why: "ความเสี่ยงสัมบูรณ์บอกว่าในคนจำนวนหนึ่ง จะมีคนได้รับผลเพิ่มกี่คนจริง ๆ"
  - text: "ถามต่อ: เป็นการศึกษาเชิงสังเกตหรือทดลอง ตัดตัวแปรแทรกซ้อน เช่น พฤติกรรมอื่นของคนที่กินอาหาร X แล้วหรือยัง ศึกษากี่คน"
  - text: "ตัดสินใจโดยดูภาพรวม และเทียบกับคำแนะนำของหน่วยงานสาธารณสุข"
  answer: "ความเสี่ยงเพิ่มจริงเพียง 1 ใน 10,000 คน และยังต้องดูคุณภาพของการศึกษา ก่อนสรุปว่าอาหาร X เป็นสาเหตุ"
- type: check
  problem: science.inquiry.evaluating-claims.p004
glossary:
- term: กลุ่มควบคุม
  definition: กลุ่มที่ได้รับการปฏิบัติเหมือนกลุ่มทดลองทุกอย่าง ยกเว้นไม่ได้รับสิ่งที่ทดสอบ ใช้เปรียบเทียบ
- term: ยาหลอก
  definition: สิ่งที่หน้าตาเหมือนสิ่งที่ทดสอบแต่ไม่มีสารออกฤทธิ์ ใช้ตัดผลจากความคาดหวัง
- term: การปกปิด
  definition: การที่ผู้เข้าร่วม (และผู้วัดผล) ไม่รู้ว่าใครอยู่กลุ่มใด เพื่อลดความลำเอียง
- term: สหสัมพันธ์
  definition: ความสัมพันธ์ที่สองตัวแปรเปลี่ยนไปด้วยกัน ซึ่งไม่ได้แปลว่าตัวหนึ่งเป็นสาเหตุของอีกตัว
- term: ตัวแปรแทรกซ้อน
  definition: ตัวแปรที่ไม่ได้ศึกษาแต่ส่งผลต่อทั้งตัวแปรต้นและตัวแปรตาม ทำให้ดูเหมือนเป็นเหตุและผลกัน
- term: การทำซ้ำได้
  definition: วัดหรือทดลองซ้ำโดยคนเดิมวิธีเดิมแล้วได้ผลใกล้เดิม
- term: การทำซ้ำได้โดยผู้อื่น
  definition: ทีมอื่น วิธีอื่น หรือเครื่องมืออื่นได้ผลสอดคล้องกัน
- term: ความเสี่ยงสัมพัทธ์และสัมบูรณ์
  definition: สัมพัทธ์บอกว่าความเสี่ยงเปลี่ยนไปกี่เท่าหรือกี่เปอร์เซ็นต์จากเดิม สัมบูรณ์บอกว่าความเสี่ยงต่างกันเท่าใดจริง ๆ
flashcards:
- front: การทดลองที่ดีเพื่อตรวจเหตุและผลมีอะไรบ้าง
  back: กลุ่มควบคุม สุ่มแบ่งกลุ่ม ยาหลอกและการปกปิด ตัวอย่างมากพอ และทำซ้ำได้
- front: สหสัมพันธ์กับเหตุและผล
  back: เปลี่ยนพร้อมกันไม่ได้แปลว่าเป็นสาเหตุ ต้องตัดตัวแปรแทรกซ้อน ทิศทางกลับกัน และความบังเอิญ
- front: ความเสี่ยงเพิ่มจาก 2 เป็น 3 ใน 1,000
  back: สัมพัทธ์เพิ่ม 50% สัมบูรณ์เพิ่ม 0.1 จุดร้อยละ (1 ใน 1,000)
- front: สัญญาณเตือนของข้อกล่าวอ้าง
  back: 100% ปาฏิหาริย์ อ้างว่าผู้เชี่ยวชาญปิดบัง ไม่มีแหล่ง เร่งให้แชร์ อาศัยคำบอกเล่า
- front: อ่านด้านข้างคืออะไร
  back: เปิดแหล่งอื่นที่น่าเชื่อถือเพื่อตรวจว่าผู้พูดเป็นใคร และคนอื่นรายงานเรื่องเดียวกันอย่างไร
