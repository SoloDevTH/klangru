<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360" font-family="sans-serif"><title>สเปกตรัม AM แสดงความถี่พาหะตรงกลางและแถบข้างสองด้านที่ห่างเท่ากับความถี่ข่าวสาร</title><rect x="0" y="0" width="700" height="360" fill="#ffffff"/><rect x="90" y="30" width="560" height="230" fill="#fff" stroke="#999"/><line x1="90.0" y1="260" x2="90.0" y2="265" stroke="#333"/><text x="90.0" y="279" text-anchor="middle" font-size="13">90</text><line x1="230.0" y1="260" x2="230.0" y2="265" stroke="#333"/><text x="230.0" y="279" text-anchor="middle" font-size="13">95</text><line x1="370.0" y1="260" x2="370.0" y2="265" stroke="#333"/><text x="370.0" y="279" text-anchor="middle" font-size="13">100</text><line x1="510.0" y1="260" x2="510.0" y2="265" stroke="#333"/><text x="510.0" y="279" text-anchor="middle" font-size="13">105</text><line x1="650.0" y1="260" x2="650.0" y2="265" stroke="#333"/><text x="650.0" y="279" text-anchor="middle" font-size="13">110</text><line x1="230.0" y1="260" x2="230.0" y2="150" stroke="#1f3a5f" stroke-width="3"/><text x="230.0" y="144" text-anchor="middle" font-size="13">fc − fm</text><line x1="370.0" y1="260" x2="370.0" y2="60" stroke="#1f3a5f" stroke-width="3"/><text x="370.0" y="54" text-anchor="middle" font-size="13">fc (พาหะ)</text><line x1="510.0" y1="260" x2="510.0" y2="150" stroke="#1f3a5f" stroke-width="3"/><text x="510.0" y="144" text-anchor="middle" font-size="13">fc + fm</text><line x1="230.0" y1="296" x2="510.0" y2="296" stroke="#b5452b" stroke-width="2"/><text x="370.0" y="314" text-anchor="middle" font-size="14" fill="#b5452b">แบนด์วิดท์ของสัญญาณ AM ตามภาพประกอบ</text><text x="370.0" y="340" text-anchor="middle" font-size="14">ความถี่ (kHz)</text><text x="28" y="145.0" font-size="14" transform="rotate(-90 28 145.0)" text-anchor="middle">กำลังสัมพัทธ์</text></svg>
