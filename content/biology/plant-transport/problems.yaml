    ai_assisted: true

  - id: biology.plants.plant-transport.p016
    topics: [biology.plants.plant-transport]
    difficulty: 5
    type: mcq
    stem: "ตอนเช้ามืดเห็นหยดน้ำที่ปลายและขอบใบบอนและใบหญ้า แม้คืนนั้นอากาศไม่เย็นจนเกิดน้ำค้าง ข้อใดอธิบายได้ดีที่สุด"
    choices:
      - { id: a, text: "กลางคืนปากใบปิด การคายน้ำน้อย แต่รากยังดูดไอออนและน้ำเข้าไซเลม เกิดแรงดันรากดันน้ำออกทางรูเปิดที่ขอบใบ", correct: true }
      - { id: b, text: "เป็นน้ำค้างที่ไอน้ำในอากาศควบแน่นบนใบ", feedback: "โจทย์บอกว่าอากาศไม่เย็นพอให้เกิดน้ำค้าง และหยดน้ำอยู่เฉพาะที่ขอบและปลายใบ" }
      - { id: c, text: "แรงดึงจากการคายน้ำสูงที่สุดตอนกลางคืน", feedback: "กลางคืนปากใบปิด แรงดึงจากการคายน้ำจึงต่ำ" }
      - { id: d, text: "น้ำในโฟลเอ็มไหลย้อนออกมาทางปากใบ", feedback: "น้ำที่ออกมาเป็นหยดมาจากไซเลมทางรูเปิดพิเศษที่ขอบใบ ไม่ใช่จากโฟลเอ็ม" }
    hints:
      - "ตอนกลางคืนแรงใดยังทำงานอยู่ ทั้งที่การคายน้ำน้อย"
      - "หยดน้ำอยู่เฉพาะตำแหน่งปลายเส้นใบ"
    solution: "นี่คือการคายน้ำเป็นหยด กลางคืนปากใบปิด การคายน้ำน้อย แต่รากยังลำเลียงไอออนเข้าไซเลม น้ำจึงเข้าตามและเกิดแรงดันราก ดันน้ำออกทางรูเปิดที่ปลายเส้นใบ เป็นหลักฐานว่าแรงดันรากมีอยู่จริง"
