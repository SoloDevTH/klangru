problems:
  - id: computer.systems.operating-systems.p001
    topics: [computer.systems.operating-systems]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็น **ระบบปฏิบัติการ**"
    choices:
      - { id: a, text: "Android", correct: true }
      - { id: b, text: "เบราว์เซอร์ Chrome", feedback: "เบราว์เซอร์เป็นซอฟต์แวร์ประยุกต์ที่ทำงานบนระบบปฏิบัติการ" }
      - { id: c, text: "แอปแชต", feedback: "แอปแชตเป็นซอฟต์แวร์ประยุกต์" }
      - { id: d, text: "หน่วยความจำ RAM", feedback: "RAM เป็นฮาร์ดแวร์ ระบบปฏิบัติการเป็นผู้แบ่ง RAM ให้แอป" }
    hints:
      - "ระบบปฏิบัติการเป็นตัวกลางระหว่างฮาร์ดแวร์กับแอป"
      - "แอปทุกตัวในโทรศัพท์ทำงานอยู่บนซอฟต์แวร์ตัวใด"
    solution: "Android เป็นระบบปฏิบัติการของโทรศัพท์หลายยี่ห้อ ทำหน้าที่จัดการฮาร์ดแวร์และแบ่งทรัพยากรให้แอปอย่างเบราว์เซอร์และแอปแชต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.operating-systems.p002
    topics: [computer.systems.operating-systems]
    difficulty: 1
    type: match
    stem: "จับคู่สิ่งต่อไปนี้กับชั้นของระบบคอมพิวเตอร์"
    pairs:
      - { left: "เกมทายคำศัพท์", right: "ซอฟต์แวร์ประยุกต์" }
      - { left: "เคอร์เนลของ Linux", right: "ซอฟต์แวร์ระบบ" }
      - { left: "แผงหน่วยความจำ RAM", right: "ฮาร์ดแวร์" }
    hints:
      - "ฮาร์ดแวร์จับต้องได้"
      - "ซอฟต์แวร์ระบบดูแลเครื่อง ซอฟต์แวร์ประยุกต์ช่วยผู้ใช้ทำงาน"
    solution: "เกมเป็นซอฟต์แวร์ประยุกต์ เคอร์เนลเป็นแกนของระบบปฏิบัติการจึงเป็นซอฟต์แวร์ระบบ RAM เป็นฮาร์ดแวร์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.operating-systems.p003
    topics: [computer.systems.operating-systems]
    difficulty: 2
    type: order
    stem: "แก้วส่งข้อความในแอปแชตผ่าน Wi-Fi เรียงสิ่งที่คำสั่งส่งข้อความผ่าน จากผู้ใช้ลงไปถึงฮาร์ดแวร์"
    items:
      - "แก้วกดปุ่มส่ง"
      - "แอปแชต"
      - "เคอร์เนลของระบบปฏิบัติการ"
      - "ไดรเวอร์ของการ์ด Wi-Fi"
      - "การ์ด Wi-Fi ส่งคลื่นวิทยุ"
    hints:
      - "แอปติดต่อเคอร์เนลผ่านการเรียกใช้บริการของระบบ"
      - "ไดรเวอร์เป็นตัวแปลคำสั่งให้อุปกรณ์รุ่นนั้น จึงอยู่ติดกับฮาร์ดแวร์"
    solution: "ผู้ใช้ → แอปแชต (ซอฟต์แวร์ประยุกต์) → เคอร์เนล (รับคำขอส่งข้อมูลทางเครือข่าย) → ไดรเวอร์ Wi-Fi → การ์ด Wi-Fi (ฮาร์ดแวร์)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.operating-systems.p004
    topics: [computer.systems.operating-systems]
    difficulty: 2
    type: mcq
    stem: "ภูมิเปิดเบราว์เซอร์ตัวเดียวกันขึ้นมา 3 หน้าต่าง และระบบปฏิบัติการแยกแต่ละหน้าต่างเป็นกระบวนการ ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "มีโปรแกรม 1 โปรแกรม แต่มี 3 กระบวนการ", correct: true }
      - { id: b, text: "มี 3 โปรแกรม และ 3 กระบวนการ", feedback: "ไฟล์โปรแกรมเบราว์เซอร์ในดิสก์มีชุดเดียว ที่เพิ่มคือจำนวนครั้งที่รัน" }
      - { id: c, text: "มี 1 โปรแกรม และ 1 กระบวนการ", feedback: "โจทย์บอกว่าแต่ละหน้าต่างแยกเป็นกระบวนการ จึงมี 3 กระบวนการ" }
      - { id: d, text: "โปรแกรมกับกระบวนการเป็นสิ่งเดียวกัน", feedback: "โปรแกรมคือไฟล์ในดิสก์ กระบวนการคือโปรแกรมที่กำลังรันในหน่วยความจำ" }
    hints:
      - "โปรแกรมคือไฟล์คำสั่งที่เก็บในดิสก์"
      - "กระบวนการเกิดทุกครั้งที่สั่งรัน"
    solution: "ไฟล์โปรแกรมเบราว์เซอร์มีชุดเดียว แต่ถูกรัน 3 ครั้ง จึงมี 3 กระบวนการ แต่ละกระบวนการมีหน่วยความจำของตัวเอง ถ้าหน้าต่างหนึ่งค้าง อีกสองหน้าต่างยังใช้ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.operating-systems.p005
    topics: [computer.systems.operating-systems]
    difficulty: 2
    type: text
    stem: "แกนกลางของระบบปฏิบัติการที่ทำงานในโหมดที่สั่งฮาร์ดแวร์ได้ทุกอย่าง และรับการเรียกใช้บริการของระบบจากแอป เรียกว่าอะไร"
    accepted: ["เคอร์เนล", "kernel", "เคอเนล"]
    misconceptions:
      - { match: "ไดรเวอร์", feedback: "ไดรเวอร์คุยกับอุปกรณ์แต่ละรุ่น ส่วนแกนกลางที่รับคำขอจากทุกแอปมีชื่อเฉพาะ" }
      - { match: "ซีพียู", feedback: "CPU เป็นฮาร์ดแวร์ คำถามนี้ถามถึงซอฟต์แวร์" }
    hints:
      - "ภาษาอังกฤษแปลว่าเมล็ดใน"
      - "ขึ้นต้นด้วย k"
    solution: "เคอร์เนล (kernel) เป็นแกนกลางของระบบปฏิบัติการ จัดการกระบวนการ หน่วยความจำ อุปกรณ์ และไฟล์ แอปติดต่อเคอร์เนลผ่านการเรียกใช้บริการของระบบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.operating-systems.p006
    topics: [computer.systems.operating-systems]
    difficulty: 3
    type: match
    stem: "จับคู่สิ่งที่เกิดขึ้นในคอมพิวเตอร์ของห้องสมุดกับหน้าที่ของระบบปฏิบัติการ"
    pairs:
      - { left: "นักเรียนสองคนสั่งพิมพ์พร้อมกัน แต่งานไม่ปนกัน", right: "จัดการอุปกรณ์" }
      - { left: "เพลงยังเล่นต่อขณะเปิดเบราว์เซอร์", right: "จัดการกระบวนการ" }
      - { left: "เกมที่ค้างไม่ทำให้ข้อมูลในโปรแกรมพิมพ์งานเสีย", right: "จัดการหน่วยความจำ" }
      - { left: "หาไฟล์รายงานในโฟลเดอร์ Documents เจอ", right: "จัดการไฟล์" }
      - { left: "บัญชีนักเรียนติดตั้งโปรแกรมใหม่ไม่ได้", right: "จัดการผู้ใช้และความปลอดภัย" }
    hints:
      - "หน่วยความจำ: แต่ละแอปมีพื้นที่ของตัวเอง ไม่ทับกัน"
      - "กระบวนการ: ผลัดกันใช้หน่วยประมวลผล"
    solution: "คิวเครื่องพิมพ์ = จัดการอุปกรณ์ หลายแอปทำงานพร้อมกัน = จัดการกระบวนการ แอปหนึ่งค้างไม่ทับข้อมูลอีกแอป = จัดการหน่วยความจำ โฟลเดอร์และชื่อไฟล์ = จัดการไฟล์ สิทธิ์ของบัญชี = จัดการผู้ใช้และความปลอดภัย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.operating-systems.p007
    topics: [computer.systems.operating-systems]
    difficulty: 3
    type: mcq
    stem: "ทำไมแอปจดบันทึกจึงไม่เขียนข้อมูลลงดิสก์เอง แต่ต้องเรียกใช้บริการของระบบให้เคอร์เนลเขียนให้"
    choices:
      - { id: a, text: "แอปทำงานในโหมดผู้ใช้ซึ่งสิทธิ์จำกัด เคอร์เนลจึงตรวจสิทธิ์และจัดการดิสก์แทน กันไม่ให้แอปหนึ่งเขียนทับไฟล์ของแอปอื่นหรือทำลายระบบ และแอปไม่ต้องรู้รายละเอียดของดิสก์แต่ละรุ่น", correct: true }
      - { id: b, text: "เพราะเคอร์เนลเขียนข้อมูลเร็วกว่าแอปเสมอ", feedback: "เหตุผลหลักไม่ใช่ความเร็ว แต่คือความปลอดภัยและนามธรรม การผ่านเคอร์เนลยังมีค่าใช้จ่ายเล็กน้อยด้วย" }
      - { id: c, text: "เพราะดิสก์อ่านภาษา Python ไม่ออก", feedback: "ไม่ว่าเขียนด้วยภาษาใด แอปก็ต้องผ่านเคอร์เนล เพราะเรื่องสิทธิ์และการจัดการอุปกรณ์" }
      - { id: d, text: "เพราะแอปไม่มีหน่วยความจำ", feedback: "แอปมีหน่วยความจำของตัวเอง แต่ไม่มีสิทธิ์สั่งฮาร์ดแวร์โดยตรง" }
    hints:
      - "หน่วยประมวลผลมีสองโหมด โหมดผู้ใช้กับโหมดเคอร์เนล"
      - "ถ้าทุกแอปสั่งดิสก์ได้เอง จะเกิดอะไรขึ้นเมื่อมีแอปที่ผิดพลาด"
    solution: "การบังคับให้ทุกคำขอผ่านเคอร์เนลทำให้ระบบตรวจสิทธิ์ จัดคิว และป้องกันแอปไม่ให้ทำลายกัน ทั้งยังซ่อนรายละเอียดของฮาร์ดแวร์ (นามธรรม) แอปจึงใช้คำสั่งเดียวกันได้กับทุกดิสก์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.operating-systems.p008
    topics: [computer.systems.operating-systems]
    difficulty: 3
    type: mcq
    stem: "กระบวนการหนึ่งอยู่สถานะ **รอ** เพราะกำลังรอข้อมูลจากดิสก์ เมื่อข้อมูลมาถึง กระบวนการจะไปสถานะใด"
    choices:
      - { id: a, text: "พร้อม", correct: true }
      - { id: b, text: "กำลังทำงานทันที", feedback: "หน่วยประมวลผลอาจกำลังทำงานของกระบวนการอื่นอยู่ กระบวนการที่ได้ข้อมูลแล้วต้องเข้าคิวพร้อมก่อน" }
      - { id: c, text: "สิ้นสุด", feedback: "งานยังไม่เสร็จ เพิ่งได้ข้อมูลที่รอ" }
      - { id: d, text: "ใหม่", feedback: "สถานะใหม่ใช้ตอนเพิ่งสร้างกระบวนการเท่านั้น" }
    hints:
      - "ดูลูกศรที่ออกจากสถานะรอในแผนภาพสถานะ"
      - "ได้ข้อมูลแล้วยังต้องรอคิวใช้หน่วยประมวลผล"
    solution: "รอ → พร้อม เพราะยังต้องรอให้ตัวจัดคิวเลือก แล้วจึงไปกำลังทำงาน การแยกสถานะพร้อมกับรอทำให้ระบบปฏิบัติการไม่เสียเวลาให้หน่วยประมวลผลกับกระบวนการที่ยังทำต่อไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.operating-systems.p009
    topics: [computer.systems.operating-systems]
    difficulty: 3
    type: numeric
    stem: "เครื่องพิมพ์ในห้องสมุดได้รับงานพร้อมกันตามลำดับ A ใช้ 6 นาที B ใช้ 3 นาที C ใช้ 1 นาที ถ้าพิมพ์แบบ **มาก่อนได้ก่อน** เวลารอเฉลี่ยก่อนเริ่มพิมพ์ของแต่ละงานเป็นกี่นาที"
    answer: { value: 5, unit: นาที }
    hints:
      - "A เริ่มทันที B รอ A เสร็จ C รอทั้ง A และ B"
      - "รวมเวลารอของทั้งสามงานแล้วหาร 3"
    misconceptions:
      - { match: 1.67, feedback: "นี่คือคำตอบแบบงานสั้นที่สุดก่อน โจทย์ให้ทำตามลำดับที่มา" }
      - { match: 15, feedback: "นี่คือเวลารอรวม ต้องหารด้วยจำนวนงาน 3" }
      - { match: 8.33, feedback: "นี่คือเวลาตลอดงานเฉลี่ย (รวมเวลาพิมพ์ของตัวเอง) เวลารอนับเฉพาะเวลาที่อยู่ในคิว" }
    solution: "A รอ 0 B รอ 6 C รอ 6 + 3 = 9 เฉลี่ย (0 + 6 + 9) ÷ 3 = 5 นาที งาน C ที่ใช้แค่ 1 นาทีต้องรอถึง 9 นาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.operating-systems.p010
    topics: [computer.systems.operating-systems]
    difficulty: 4
    type: numeric
    stem: "งานชุดเดียวกับข้อก่อน (A 6 นาที B 3 นาที C 1 นาที มาถึงพร้อมกัน) ถ้าจัดคิวแบบ **งานสั้นที่สุดก่อน** เวลารอเฉลี่ยเป็นกี่นาที (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 1.67, tolerance: 0.02, unit: นาที }
    hints:
      - "เรียงงานจากสั้นไปยาวก่อน"
      - "งานแรกรอ 0 งานถัดไปรอเท่ากับเวลาของงานก่อนหน้ารวมกัน"
    misconceptions:
      - { match: 5, feedback: "นี่คือคำตอบแบบมาก่อนได้ก่อน ต้องเรียงใหม่จากสั้นไปยาว" }
      - { match: 1.33, feedback: "นับเวลารอของ A เท่ากับเวลาของ B งานเดียว แต่ A ต้องรอทั้ง C และ B คือ 1 + 3 = 4" }
    solution: "ลำดับ C (1), B (3), A (6) เวลารอ C 0 B 1 A 1 + 3 = 4 เฉลี่ย (0 + 1 + 4) ÷ 3 ≈ 1.67 นาที น้อยกว่าแบบมาก่อนได้ก่อน (5 นาที) มาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.operating-systems.p011
    topics: [computer.systems.operating-systems]
    difficulty: 4
    type: numeric
    stem: "แผนภูมิในภาพแสดงการจัดคิวแบบวนรอบ ควอนตัม 2 หน่วยเวลา ของงาน P1 (ใช้ 5 หน่วย) P2 (ใช้ 3 หน่วย) และ P3 (ใช้ 1 หน่วย) ที่มาถึงเวลา 0 งาน P1 **รอในคิว** รวมทั้งหมดกี่หน่วยเวลา"
    figure:
      src: rr-gantt.svg
      alt: "แผนภูมิแกนต์แบบวนรอบ ควอนตัม 2 หน่วยเวลา ช่วง 0 ถึง 2 เป็น P1 ช่วง 2 ถึง 4 เป็น P2 ช่วง 4 ถึง 5 เป็น P3 ช่วง 5 ถึง 7 เป็น P1 ช่วง 7 ถึง 8 เป็น P2 ช่วง 8 ถึง 9 เป็น P1"
    answer: { value: 4, unit: หน่วยเวลา }
    hints:
      - "หาช่วงเวลาที่ P1 ไม่ได้ทำงานตั้งแต่เวลา 0 จนเสร็จ"
      - "หรือใช้ เวลารอ = เวลาเสร็จ − เวลามาถึง − เวลาที่ใช้หน่วยประมวลผล"
    misconceptions:
      - { match: 9, feedback: "9 คือเวลาที่ P1 เสร็จ (เวลาตลอดงาน) ต้องหักเวลาที่ P1 ทำงานจริง 5 หน่วยออก" }
      - { match: 3, feedback: "นับแค่ช่วงรอครั้งแรก (2 ถึง 5) P1 ยังรออีกช่วง 7 ถึง 8" }
