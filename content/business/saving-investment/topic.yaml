- front: ปัจจัยที่มีผลต่อการออม
  back: รายได้ · อัตราดอกเบี้ย · ค่าของเงิน (เงินเฟ้อ) · การคาดการณ์อนาคต · ค่านิยม
- front: ความเสี่ยงกับผลตอบแทน
  back: ผลตอบแทนที่คาดหวังสูงมาพร้อมความเสี่ยงสูง ไม่มีของฟรี
- front: จัดการความเสี่ยง 4 แบบ
  back: หลีกเลี่ยง · ลด/กระจาย · โอน (ประกันภัย) · ยอมรับและสำรองเงินไว้
