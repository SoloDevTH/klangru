# หัวข้อสุขศึกษาในคลังที่สอนเนื้อหาของตัวชี้วัด th-core-2551-health-pe
# ความครอบคลุมตัดสินจาก lesson.md และ problems.yaml ของหัวข้อ เทียบกับสาระการเรียนรู้แกนกลางของแต่ละตัวชี้วัด
# (เอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง กลุ่มสาระการเรียนรู้สุขศึกษาและพลศึกษา สพฐ. 2551)
# หนึ่งหัวข้อมีได้แถวเดียว จึงตั้ง coverage ทั้งแถวเป็น partial และบอกใน note ว่าตัวชี้วัดใดสอนครบ
# ตัวชี้วัดที่ขึ้นต้นด้วย "แสดง" "ปฏิบัติ" หรือ "เลือกกิน" ต้องทำจริง แอปสอนได้เฉพาะความรู้และการตัดสินใจ
framework: th-core-2551-health-pe
mappings:
  - topic: health.nutrition.basics
    indicators: [พ 4.1 ป.3/2]
    coverage: full
    note: สอนครบหลังเติมเนื้อหาเฟส 7
  - topic: health.nutrition.basics
    indicators: ["พ 4.1 ป.4/3", "พ 4.1 ป.2/2", "พ 4.1 ป.3/3", "พ 4.1 ม.1/1", "พ 4.1 ป.5/3"]
    coverage: partial
    note: "สอนครบ: ป.3/2 (อาหารหลัก 5 หมู่ มีโจทย์จำแนกและจับคู่) บางส่วน: ป.4/3 สอนฉลากโภชนาการและฉลากจีดีเอครบ แต่ยังไม่มีฉลากผลิตภัณฑ์สุขภาพอื่น (ยา เครื่องสำอาง เลข อย.); ป.2/2 ป.3/3 ม.1/1 สอนหลักการเลือกอาหารตามธงโภชนาการแยกตามวัยและระดับพลังงาน แต่การเลือกกินจริงเป็นพฤติกรรม; ป.5/3 มีโจทย์ประเมินข้อความโฆษณาอาหาร (hlt.nut.p026) ยังไม่ครอบคลุมโฆษณาผลิตภัณฑ์สุขภาพทั่วไป"
  - topic: health.body.bmi-growth
    indicators: [พ 1.1 ป.3/3]
    coverage: full
    note: สอนครบหลังเติมเนื้อหาเฟส 7
  - topic: health.body.bmi-growth
    indicators: ["พ 1.1 ป.3/2", "พ 1.1 ม.1/3", "พ 1.1 ม.1/4", "พ 4.1 ม.1/3"]
    coverage: partial
    note: "สอนครบ: ป.3/3 (ปัจจัยที่มีผลต่อการเจริญเติบโต) บางส่วน: ป.3/2 และ ม.1/3 สอนการคำนวณ BMI เกณฑ์ผู้ใหญ่ชาวเอเชีย รอบเอว และย้ำว่าเด็กต้องเทียบกราฟ BMI ตามอายุและเพศ แต่ยังไม่มีเกณฑ์อ้างอิงการเจริญเติบโตของเด็กไทยให้ผู้เรียนเทียบกับตนเอง; ม.1/4 และ พ 4.1 ม.1/3 สอนว่า BMI เป็นเครื่องมือคัดกรองและการดูแลด้วยอาหาร การนอน และกิจกรรมทางกาย ตั้งใจไม่สอนวิธีลดน้ำหนักให้ผู้เยาว์ การควบคุมน้ำหนักจริงต้องทำร่วมกับบุคลากรสุขภาพ"
  - topic: health.safety.first-aid
