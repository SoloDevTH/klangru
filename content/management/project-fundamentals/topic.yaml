id: management.project.project-fundamentals
subject: management
title: { th: พื้นฐานการจัดการโครงการ, en: Project management fundamentals }
summary: โครงการกับงานประจำ วงจรชีวิตแบบพยากรณ์และแบบปรับตัว กฎบัตร ขอบเขตและ WBS ผู้มีส่วนได้ส่วนเสีย ทรัพยากรและ RACI ธรรมาภิบาลโครงการ และการปิดโครงการ
difficulty: 5
minutes: 40
prerequisites: [management.principles.planning-decision]
encompasses:
  - { id: management.principles.planning-decision, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: lifecycle.svg
    alt: "สองแถว แถวบนแบบพยากรณ์: กล่องหกกล่องเรียงต่อกันด้วยลูกศร เริ่มโครงการ วางแผน ออกแบบ สร้าง ทดสอบ ส่งมอบและปิด ขอบเขตกำหนดละเอียดตั้งแต่ต้น ทำทีละระยะ และส่งมอบครั้งเดียวตอนท้าย แถวล่างแบบปรับตัว: กล่องรายการงานค้าง (backlog) ต่อด้วยวงกลมรอบที่ 1 ถึง 4 รอบละ 2 สัปดาห์ แต่ละรอบมีลูกศรส่งมอบ ขอบเขตปรับได้ตามข้อมูลป้อนกลับของผู้ใช้"
    caption: "วงจรชีวิตแบบพยากรณ์ส่งมอบครั้งเดียว แบบปรับตัวส่งมอบทุกรอบ"
  - type: worked-example
    title: ประมาณจำนวนรอบของทีมพัฒนาแอปลงทะเบียนเด็ก
    problem: "ทีมพัฒนาระบบลงทะเบียนเด็กของเทศบาล (สมมติ) มีงานค้าง 180 แต้ม สามรอบแรกทำได้ 22, 26 และ 24 แต้ม รอบละ 2 สัปดาห์ งานที่เหลือต้องใช้อีกประมาณกี่รอบและกี่สัปดาห์ (ถ้า 180 แต้มยังไม่รวมงานสามรอบแรก)"
    steps:
      - text: "ความเร็วเฉลี่ย $(22 + 26 + 24) \\div 3 = 24$ แต้มต่อรอบ"
        why: "ใช้ค่าเฉลี่ยของหลายรอบ เพราะความเร็วของรอบเดียวแกว่งได้มาก"
      - text: "จำนวนรอบ $180 \\div 24 = 7.5$ ปัดขึ้นเป็น 8 รอบ"
        why: "รอบที่ทำครึ่งเดียวไม่มี ต้องปัดขึ้น"
      - text: "เวลา $8 \\times 2 = 16$ สัปดาห์"
      - text: "แจ้งผู้สนับสนุนเป็นช่วง และทบทวนทุกรอบ เพราะงานค้างอาจเพิ่มหรือลดตามข้อมูลป้อนกลับ"
    answer: "ประมาณ 8 รอบ หรือ 16 สัปดาห์ และควรปรับประมาณการใหม่ทุกรอบ"
  - { type: check, problem: management.project.project-fundamentals.p008 }
  - type: figure
    src: wbs.svg
    alt: "แผนภาพต้นไม้ WBS โครงการก่อสร้างศูนย์พัฒนาเด็กเล็ก ขอนแก่น (สมมติ) งบเป็นพันบาท ระดับ 1 มีสี่กลุ่ม 1 งานออกแบบ: 1.1 แบบสถาปัตย์และวิศวกรรม 120, 1.2 ขออนุญาตก่อสร้าง 30 · 2 งานก่อสร้าง: 2.1 ฐานราก 850, 2.2 โครงสร้างและผนัง 1,600, 2.3 หลังคา 540, 2.4 ระบบไฟฟ้าและประปา 420 · 3 ครุภัณฑ์: 3.1 โต๊ะ เก้าอี้ ที่นอน 180, 3.2 ของเล่นเสริมพัฒนาการ 95 · 4 บริหารโครงการ: 4.1 ควบคุมงานและรายงาน 210"
    caption: "WBS แตกงานเป็นชุดงานที่ประมาณงบได้ แล้วรวมขึ้นไปเป็นงบของโครงการ"
  - type: worked-example
    title: รวมงบจาก WBS ตามกฎ 100%
    problem: "จาก WBS ในภาพ จงหางบของแต่ละกลุ่มในระดับ 1 และงบรวมของโครงการ แล้วตรวจว่ากลุ่มใดใช้งบมากที่สุด"
    steps:
      - text: "งานออกแบบ $120 + 30 = 150$ พันบาท"
      - text: "งานก่อสร้าง $850 + 1{,}600 + 540 + 420 = 3{,}410$ พันบาท"
      - text: "ครุภัณฑ์ $180 + 95 = 275$ พันบาท และบริหารโครงการ 210 พันบาท"
      - text: "งบรวม $150 + 3{,}410 + 275 + 210 = 4{,}045$ พันบาท"
        why: "ตามกฎ 100% งบของงานแม่ต้องเท่ากับผลรวมของงานลูกพอดี ถ้าใส่ชุดงานเดียวกันไว้สองที่ งบจะเกินจริง"
      - text: "งานก่อสร้างคิดเป็น $3{,}410 \\div 4{,}045 \\approx 84\\%$ ของงบ จึงควรติดตามใกล้ชิดที่สุด"
    answer: "ออกแบบ 150 ก่อสร้าง 3,410 ครุภัณฑ์ 275 บริหารโครงการ 210 รวม 4,045 พันบาท (ประมาณ 4.05 ล้านบาท)"
  - type: figure
    src: p-stakeholder.svg
    alt: "ตารางสองแกน แกนนอนความสนใจต่อโครงการจากต่ำไปสูง แกนตั้งอำนาจต่อโครงการจากต่ำไปสูง แบ่งสี่ช่องด้วยเส้นประ จุด A ผู้บริหารเทศบาล (ผู้สนับสนุนโครงการ) อยู่ช่องอำนาจสูง ความสนใจสูง จุด B ผู้ปกครองเด็กอยู่ช่องอำนาจต่ำ ความสนใจสูง จุด C หน่วยงานที่อนุญาตการระบายน้ำอยู่ช่องอำนาจสูง ความสนใจต่ำ จุด D ร้านค้าห่างออกไปสองซอยอยู่ช่องอำนาจต่ำ ความสนใจต่ำ"
    caption: "ผู้มีส่วนได้ส่วนเสียสี่กลุ่มของโครงการ (ใช้ในโจทย์ข้อ 6)"
glossary:
  - { term: โครงการ, definition: "งานชั่วคราวที่มีวันเริ่มและวันจบ ทำเพื่อสร้างผลงาน บริการ หรือผลลัพธ์ที่ไม่ซ้ำแบบเดิม" }
  - { term: กฎบัตรโครงการ, definition: "เอกสารที่ผู้สนับสนุนลงนามเพื่อเริ่มโครงการ ระบุเหตุผล วัตถุประสงค์ ขอบเขตกว้าง ๆ หมุดหมาย งบโดยประมาณ และอำนาจของผู้จัดการโครงการ" }
  - { term: WBS, definition: "โครงสร้างการแบ่งงาน แตกงานทั้งหมดของโครงการเป็นลำดับชั้นจนถึงชุดงานที่ประมาณเวลาและงบได้" }
  - { term: กฎ 100%, definition: "หลักว่างานย่อยใน WBS ต้องรวมกันได้งานแม่ครบพอดี ไม่ขาดและไม่ซ้ำ" }
  - { term: ความเร็วของทีม (velocity), definition: "จำนวนแต้มงานที่ทีมแบบปรับตัวทำเสร็จในหนึ่งรอบ ใช้ประมาณจำนวนรอบที่เหลือ" }
  - { term: ตาราง RACI, definition: "ตารางระบุบทบาทต่องาน ลงมือทำ (R) รับผิดชอบสุดท้าย (A) ปรึกษา (C) และแจ้งให้ทราบ (I)" }
  - { term: ธรรมาภิบาลโครงการ, definition: "โครงสร้างการตัดสินใจและอำนาจอนุมัติของโครงการ เช่น ใครอนุมัติงบ การเปลี่ยนขอบเขต และการผ่านไปยังระยะถัดไป" }
flashcards:
  - { front: "โครงการต่างจากงานประจำอย่างไร", back: "โครงการชั่วคราว มีวันเริ่มวันจบ ผลงานไม่ซ้ำแบบเดิม งานประจำทำซ้ำต่อเนื่อง" }
  - { front: "แบบพยากรณ์กับแบบปรับตัว", back: "พยากรณ์: วางแผนละเอียดก่อน ส่งมอบครั้งเดียว · ปรับตัว: รอบสั้น ส่งมอบทุกรอบ ปรับตามข้อมูลป้อนกลับ" }
  - { front: "ตารางอำนาจกับความสนใจ", back: "สูง/สูง บริหารใกล้ชิด · สูง/ต่ำ ทำให้พอใจ · ต่ำ/สูง แจ้งข่าวสม่ำเสมอ · ต่ำ/ต่ำ ติดตามดู" }
  - { front: "จำนวนช่องทางสื่อสารของทีม n คน", back: "n(n − 1) ÷ 2" }
  - { front: "RACI", back: "R ลงมือทำ · A รับผิดชอบสุดท้าย (คนเดียว) · C ปรึกษา · I แจ้งให้ทราบ" }
