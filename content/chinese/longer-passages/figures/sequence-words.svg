<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei','Loma','Noto Sans Thai',sans-serif">
<title>เส้นเวลาคำบอกลำดับ</title>
<rect x="0" y="0" width="1000" height="460" fill="#fff"/>
<text x="500" y="44" font-size="28" fill="#111" text-anchor="middle" font-weight="bold">คำบอกลำดับเหตุการณ์</text>
<line x1="120" y1="130" x2="880" y2="130" stroke="#555" stroke-width="4" stroke-linecap="round"/>
<circle cx="170" cy="130" r="36" fill="#1f4e9c" stroke="#1f4e9c" stroke-width="3"/>
<text x="170" y="140" font-size="26" fill="#fff" text-anchor="middle" font-weight="bold">首先</text>
<text x="170" y="196" font-size="20" fill="#1f4e9c" text-anchor="middle" font-weight="bold">ขั้นแรก</text>
<circle cx="390" cy="130" r="36" fill="#2a6a2a" stroke="#2a6a2a" stroke-width="3"/>
<text x="390" y="140" font-size="26" fill="#fff" text-anchor="middle" font-weight="bold">然后</text>
<text x="390" y="196" font-size="20" fill="#2a6a2a" text-anchor="middle" font-weight="bold">จากนั้น</text>
<circle cx="610" cy="130" r="36" fill="#8a5a00" stroke="#8a5a00" stroke-width="3"/>
<text x="610" y="140" font-size="26" fill="#fff" text-anchor="middle" font-weight="bold">后来</text>
<text x="610" y="196" font-size="20" fill="#8a5a00" text-anchor="middle" font-weight="bold">ต่อมา</text>
<circle cx="830" cy="130" r="36" fill="#b3261e" stroke="#b3261e" stroke-width="3"/>
<text x="830" y="140" font-size="26" fill="#fff" text-anchor="middle" font-weight="bold">最后</text>
<text x="830" y="196" font-size="20" fill="#b3261e" text-anchor="middle" font-weight="bold">สุดท้าย</text>
<rect x="60" y="230" width="880" height="190" rx="14" fill="#f7f7f7" stroke="#999" stroke-width="2"/>
<text x="500" y="272" font-size="22" fill="#111" text-anchor="middle" font-weight="bold">ตัวอย่าง</text>
<text x="500" y="316" font-size="24" fill="#111" text-anchor="middle" font-weight="normal">首先，我们上课；然后，我们吃午饭；</text>
<text x="500" y="358" font-size="24" fill="#111" text-anchor="middle" font-weight="normal">后来，我们去图书馆；最后，我们回家。</text>
<text x="500" y="398" font-size="18" fill="#444" text-anchor="middle" font-weight="normal">คำบอกลำดับช่วยให้ผู้อ่านรู้ว่าเหตุการณ์ไหนเกิดก่อนหลัง</text>
</svg>
