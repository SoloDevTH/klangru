title: { th: แผนภาพเฟสเหล็ก–คาร์บอนและการอบชุบความร้อน, en: Iron–carbon phase diagram and heat treatment of steels }
summary: อ่านแผนภาพเฟสเหล็ก–คาร์บอน คำนวณสัดส่วนเพิร์ลไลต์ด้วยกฎคานงัด และเลือกการอบชุบให้ได้สมบัติที่ต้องการ
difficulty: 7
minutes: 40
prerequisites: [engineering.materials.materials-science]
