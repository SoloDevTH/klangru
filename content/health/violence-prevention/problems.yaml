problems:
- id: health.safety.violence-prevention.p001
  topics:
  - health.safety.violence-prevention
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็นการกลั่นแกล้งทางไซเบอร์
  choices:
  - id: a
    text: สร้างบัญชีปลอมเป็นชื่อเพื่อนแล้วโพสต์ข้อความน่าอายทุกวัน
    correct: true
  - id: b
    text: เพื่อนสองคนเถียงกันเรื่องฟุตบอลครั้งเดียวแล้วคืนดีกัน
    feedback: เป็นความขัดแย้งครั้งเดียวที่ทั้งสองฝ่ายเท่ากัน ไม่ใช่การกลั่นแกล้ง
  - id: c
    text: ครูประกาศคะแนนสอบในกลุ่มห้องโดยไม่ระบุชื่อ
    feedback: ไม่ได้มุ่งทำร้ายใครและไม่ระบุตัวตน
  - id: d
    text: เพื่อนส่งสติกเกอร์ตลกที่ทุกคนชอบ
    feedback: ไม่มีใครถูกทำร้ายหรือรู้สึกแย่
  hints:
  - การกลั่นแกล้งเกิดซ้ำและตั้งใจทำให้อีกฝ่ายเจ็บ
  - บัญชีปลอมเป็นเทคนิคหนึ่งที่ยูนิเซฟยกตัวอย่าง
  solution: การปลอมตัวเป็นคนอื่นแล้วโพสต์ให้อับอายซ้ำ ๆ เป็นการกลั่นแกล้งทางไซเบอร์ ส่วนการเถียงครั้งเดียวแล้วคืนดีเป็นความขัดแย้งปกติ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.violence-prevention.p002
  topics:
  - health.safety.violence-prevention
  difficulty: 1
  type: match
  stem: จับคู่รูปแบบของความรุนแรงกับตัวอย่าง
  pairs:
  - left: ทางร่างกาย
    right: ผลักเพื่อนล้มที่บันได
  - left: ทางวาจาและจิตใจ
    right: ล้อปมด้อยและกีดกันออกจากกลุ่มทุกวัน
  - left: ทางเพศ
    right: แตะต้องร่างกายโดยอีกฝ่ายไม่ยินยอม
  - left: ทางออนไลน์
    right: โพสต์คลิปทำให้อับอายแล้วแชร์ต่อ
  - left: การทอดทิ้ง
    right: ผู้ดูแลไม่พาเด็กที่ป่วยหนักไปหาหมอ
  hints:
  - ดูว่าทำร้ายผ่านอะไร ร่างกาย คำพูด เรื่องเพศ หรือโลกออนไลน์
  - การไม่ทำในสิ่งที่ผู้ดูแลต้องทำก็เป็นความรุนแรง
  solution: ผลัก = ร่างกาย ล้อและกีดกัน = วาจาและจิตใจ แตะต้องโดยไม่ยินยอม = ทางเพศ โพสต์คลิปให้อับอาย = ออนไลน์ ไม่พาเด็กป่วยไปหาหมอ = การทอดทิ้ง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.violence-prevention.p003
  topics:
  - health.safety.violence-prevention
  difficulty: 2
  type: mcq
  stem: ดูแชตกลุ่มสมมติในภาพ ข้อความใดแสดงชัดที่สุดว่านี่เป็น **การกลั่นแกล้ง** ไม่ใช่การล้อเล่น
  choices:
  - id: a
    text: ต้นบอกว่าจะทำทุกวัน และยังทำต่อแม้น้ำใสขอให้ลบและบอกว่าไม่ตลก
    correct: true
  - id: b
    text: มีคนพิมพ์ 555
    feedback: การหัวเราะอย่างเดียวไม่ได้บอกว่าเป็นการกลั่นแกล้ง แต่ทำให้ผู้แกล้งได้ผู้ชม
  - id: c
    text: แชตเป็นกลุ่มของห้อง
    feedback: สถานที่ไม่ใช่เกณฑ์ เกณฑ์คือการทำซ้ำ ตั้งใจ และอีกฝ่ายเจ็บ
  - id: d
    text: ภาพเป็นภาพตัดต่อ
    feedback: ภาพตัดต่อบางภาพเป็นเรื่องสนุกที่เจ้าตัวยินยอม ประเด็นคือเจ้าตัวไม่ยินยอมและเกิดซ้ำ
  hints:
  - ล้อเล่นกับกลั่นแกล้งต่างกันตรงไหน
  - ดูข้อความของน้ำใสและคำตอบของต้น
  solution: เมื่อผู้ถูกล้อบอกว่าไม่ตลกและขอให้หยุด แต่ผู้ล้อยังทำต่อและวางแผนทำซ้ำ นั่นคือการกลั่นแกล้ง คำว่า "แค่ล้อเล่น" ไม่ได้ทำให้การกระทำนั้นถูก
  figure: &id001
    src: chat-quiz.svg
    alt: แชตกลุ่มสมมติของห้อง ม.3/4 ต้นเขียนว่า ดูรูปน้ำใสที่เราแต่งดิ 555 ตามด้วยภาพตัดต่อหน้าน้ำใสให้ดูตลก เมย์ตอบว่า 555 ส่งต่อให้ห้องอื่นด้วย ต้นเขียนว่า พรุ่งนี้มีอีก ทำทุกวันเลย น้ำใสตอบว่า ลบได้ไหม เราไม่ตลกด้วย ต้นตอบว่า แค่ล้อเล่น คิดมากไปได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.violence-prevention.p004
  topics:
  - health.safety.violence-prevention
  difficulty: 2
  type: order
  stem: ปิ่นถูกส่งข้อความข่มขู่จากบัญชีที่ไม่รู้จักหลายครั้ง เรียงขั้นตอนที่ควรทำตามบทเรียน
  items:
  - ตั้งสติ ไม่ตอบโต้กลับ
  - บันทึกหน้าจอพร้อมวันเวลาและชื่อบัญชี
  - บล็อกและรายงานต่อแพลตฟอร์ม
  - บอกผู้ปกครองหรือครูที่ไว้ใจ
  hints:
  - หลักฐานต้องเก็บก่อนที่จะบล็อก
  - ผู้ใหญ่ช่วยติดต่อโรงเรียนหรือแจ้งความได้
  solution: ไม่ตอบโต้ → เก็บหลักฐาน → บล็อกและรายงาน → บอกผู้ใหญ่ ถ้าถูกขู่ทำร้ายให้ผู้ใหญ่แจ้ง 191 หรือ 1212
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.violence-prevention.p005
  topics:
  - health.safety.violence-prevention
  difficulty: 2
  type: text
  stem: หมายเลขสายด่วนศูนย์ช่วยเหลือสังคม กระทรวงการพัฒนาสังคมและความมั่นคงของมนุษย์ ที่รับแจ้งความรุนแรงต่อเด็กและในครอบครัวตลอด 24 ชั่วโมงคือหมายเลขใด (ตอบเป็นตัวเลข 4 หลัก)
  accepted:
  - '1300'
  misconceptions:
  - match: '1323'
    feedback: 1323 คือสายด่วนสุขภาพจิต
  - match: '1669'
    feedback: 1669 คือเหตุเจ็บป่วยฉุกเฉิน
  - match: '191'
    feedback: 191 คือตำรวจ ใช้เมื่อมีอันตรายเฉพาะหน้า
  hints:
  - ขึ้นต้นด้วย 13
  - ลงท้ายด้วย 00
  solution: 1300 ศูนย์ช่วยเหลือสังคม (ศูนย์ประชาบดี) ของ พ.ม. เปิดตลอด 24 ชั่วโมง ถ้ามีอันตรายเฉพาะหน้าโทร 191
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.violence-prevention.p006
  topics:
  - health.safety.violence-prevention
  difficulty: 2
  type: mcq
  stem: ข้อใดเป็น **สัญญาณเตือน** ของความรุนแรงในความสัมพันธ์แบบคู่รัก (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: ขอรหัสโทรศัพท์และตรวจข้อความทุกวัน
    correct: true
    feedback: ถูก เป็นการควบคุม
  - id: b
    text: ห้ามไปพบเพื่อนหรือครอบครัว
    correct: true
    feedback: ถูก เป็นการตัดขาดจากคนที่ช่วยได้
  - id: c
    text: ขู่ว่าจะทำร้ายตัวเองถ้าอีกฝ่ายขอเลิก
    correct: true
    feedback: ถูก เป็นการบีบบังคับทางอารมณ์
  - id: d
    text: กดดันให้ส่งภาพส่วนตัว
    correct: true
    feedback: ถูก เป็นความรุนแรงทางเพศ
  - id: e
    text: เคารพเมื่ออีกฝ่ายบอกว่าวันนี้อยากไปกับเพื่อน
    feedback: นี่คือความสัมพันธ์ที่ดี
  hints:
  - ความรักไม่ใช่การควบคุม
  - ดูว่าอีกฝ่ายยังพูดว่า "ไม่" ได้หรือไม่
  solution: การตรวจโทรศัพท์ ตัดขาดจากเพื่อน ขู่ และกดดันเรื่องภาพส่วนตัวเป็นสัญญาณเตือน ความสัมพันธ์ที่ดีเคารพการตัดสินใจของกันและกัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.violence-prevention.p007
  topics:
  - health.safety.violence-prevention
  difficulty: 3
  type: mcq
  stem: ถ้าเราอยู่ในแชตกลุ่มในภาพ สิ่งใดที่ผู้เห็นเหตุการณ์ควรทำ (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: ไม่หัวเราะตามและไม่ส่งต่อภาพ
    correct: true
    feedback: ถูก การไม่ร่วมวงทำให้ผู้แกล้งไม่มีผู้ชม
  - id: b
    text: ส่งข้อความส่วนตัวหาน้ำใสว่าเราอยู่ข้างเธอ
    correct: true
    feedback: ถูก
  - id: c
    text: บันทึกหน้าจอเก็บไว้เป็นหลักฐานและบอกครูประจำชั้น
    correct: true
    feedback: ถูก
  - id: d
    text: แต่งภาพต้นกลับเพื่อเอาคืนแทนน้ำใส
    feedback: การเอาคืนทำให้เรื่องบานปลายและเราก็กลายเป็นผู้กลั่นแกล้ง
  - id: e
    text: ออกจากกลุ่มเงียบ ๆ แล้วลืมเรื่องนี้
    feedback: การเงียบไม่ได้ช่วยน้ำใส ควรช่วยอย่างปลอดภัยอย่างน้อยหนึ่งทาง
  hints:
  - ผู้เห็นเหตุการณ์ช่วยได้หลายทางโดยไม่ต้องเผชิญหน้ารุนแรง
  - การเอาคืนไม่ใช่การช่วย
  solution: ไม่ร่วมวง อยู่ข้างผู้ถูกกระทำ เก็บหลักฐาน และแจ้งผู้ใหญ่ เป็นสิ่งที่ผู้เห็นเหตุการณ์ทำได้อย่างปลอดภัย การเอาคืนเพิ่มความรุนแรง
  figure: *id001
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.violence-prevention.p008
  topics:
  - health.safety.violence-prevention
  difficulty: 3
  type: numeric
  stem: WHO ระบุว่าทั่วโลกเด็กและวัยรุ่นราว 25% เคยถูกกลั่นแกล้ง ถ้าใช้สัดส่วนนี้กับห้องเรียนที่มีนักเรียน 36 คน จะคาดว่ามีนักเรียนเคยถูกกลั่นแกล้งประมาณกี่คน
  answer:
    value: 9.0
    unit: คน
  misconceptions:
  - match: 25
    feedback: 25 คือร้อยละ ต้องนำไปคูณกับจำนวนนักเรียน
  - match: 27
    feedback: นี่คือจำนวนคนที่ไม่เคยถูกกลั่นแกล้ง
  hints:
  - 25% เท่ากับหนึ่งในสี่
  - 36 × 0.25
  solution: $36 \times 0.25 = 9$ คน เกือบทุกห้องจึงอาจมีเพื่อนที่กำลังถูกกลั่นแกล้งโดยที่เราไม่รู้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.violence-prevention.p009
  topics:
  - health.safety.violence-prevention
  difficulty: 3
  type: match
  stem: จับคู่ปัจจัยที่ทำให้เกิดความรุนแรงกับระดับของปัจจัย
  pairs:
  - left: ดื่มสุราตั้งแต่อายุน้อยและควบคุมความโกรธไม่ได้
    right: ระดับบุคคล
  - left: กลุ่มเพื่อนถือว่าต้องเอาคืนให้สาสม
    right: ระดับความสัมพันธ์
  - left: อาวุธและสุราหาซื้อได้ง่ายในงานวัด
    right: ระดับชุมชนและสังคม
  hints:
  - บุคคลคือสิ่งที่อยู่ในตัวคนนั้น
  - ชุมชนคือสภาพแวดล้อมที่ทุกคนเจอร่วมกัน
  solution: การดื่มเร็วและคุมอารมณ์ไม่ได้เป็นระดับบุคคล ค่านิยมของกลุ่มเพื่อนเป็นระดับความสัมพันธ์ และการเข้าถึงอาวุธและสุราเป็นระดับชุมชนและสังคม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.violence-prevention.p010
  topics:
  - health.safety.violence-prevention
  difficulty: 3
  type: mcq
  stem: เพื่อนสนิทถูกต่อยในงานวัดเมื่อคืน วันนี้ชวนเราและเพื่อนอีกสามคนไป "นัดเคลียร์" กับอีกกลุ่มหลังเลิกเรียน เราควรพูดหรือทำอย่างไร
  choices:
  - id: a
    text: ปฏิเสธไม่ไป บอกเพื่อนว่าเป็นห่วง ชวนให้แจ้งครูหรือผู้ปกครองช่วยไกล่เกลี่ย และถ้าเพื่อนยังจะไป ให้บอกผู้ใหญ่ทันที
    correct: true
  - id: b
    text: ไปด้วยแต่ยืนดูเฉย ๆ
    feedback: การไปด้วยทำให้กลุ่มดูใหญ่ขึ้นและเราอาจได้รับบาดเจ็บหรือถูกดำเนินคดี
  - id: c
    text: ไปด้วยและพกไม้ไปป้องกันตัว
    feedback: การพกอาวุธเพิ่มโอกาสบาดเจ็บรุนแรงและผิดกฎหมาย
  - id: d
    text: ไม่ไปแต่ไม่บอกใคร
    feedback: การเงียบไม่ช่วยป้องกันเพื่อนจากอันตราย
  hints:
  - ตัวชี้วัดให้หลีกเลี่ยงและชักชวนเพื่อนให้หลีกเลี่ยงความรุนแรง
  - มีผู้ใหญ่ที่ช่วยไกล่เกลี่ยได้
  solution: เราหลีกเลี่ยงด้วยการไม่ไป และชักชวนเพื่อนด้วยความห่วงใย เสนอทางแก้โดยสันติผ่านครูหรือผู้ปกครอง ถ้าเพื่อนยังยืนยันจะไป การบอกผู้ใหญ่คือการปกป้องเพื่อน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.violence-prevention.p011
  topics:
  - health.safety.violence-prevention
  difficulty: 4
  type: mcq
  stem: ข่าวรายงานว่ามีวัยรุ่นยกพวกตีกันในงานวัดหลายครั้ง ส่วนใหญ่มีการดื่มสุราและพกอาวุธ ข้อเสนอใดแก้ปัจจัยระดับ **ชุมชนและสังคม** ได้ตรงที่สุด
  choices:
  - id: a
    text: ตั้งจุดตรวจอาวุธ ควบคุมการขายสุราให้ผู้อายุต่ำกว่า 20 ปี และจัดพื้นที่กิจกรรมสร้างสรรค์สำหรับเยาวชนในงาน
    correct: true
  - id: b
    text: ให้วัยรุ่นแต่ละคนสัญญากับตัวเองว่าจะไม่โกรธ
    feedback: เป็นแนวทางระดับบุคคล ยังไม่แก้สิ่งแวดล้อมที่ทำให้อาวุธและสุราหาง่าย
  - id: c
    text: ห้ามวัยรุ่นทุกคนเข้างานวัด
    feedback: ตีตรากลุ่มวัยรุ่นทั้งหมดและไม่แก้ต้นเหตุ
  - id: d
    text: ให้กลุ่มที่แพ้ไปเอาคืนในงานครั้งหน้า
    feedback: เพิ่มวงจรความรุนแรง
  hints:
