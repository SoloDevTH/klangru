  - id: engineering.mechanics.centroids-inertia.p015
    topics: [engineering.mechanics.centroids-inertia]
    difficulty: 2
    type: mcq
    stem: "นักศึกษารู้ $I_a$ ของหน้าตัดรอบแกน $a$ ซึ่งห่างเซนทรอยด์ $50\\ \\mathrm{mm}$ แล้วเขียน $I_b = I_a + A(30)^2$ สำหรับแกน $b$ ที่ขนานกันและห่างแกน $a$ อีก $30\\ \\mathrm{mm}$ (ห่างเซนทรอยด์ $80\\ \\mathrm{mm}$) ข้อใดถูก"
    choices:
      - { id: a, text: "ผิด ต้องผ่านเซนทรอยด์ก่อน: $\\bar I = I_a - A(50)^2$ แล้ว $I_b = \\bar I + A(80)^2$", correct: true }
      - { id: b, text: "ถูก เพราะทฤษฎีบทแกนขนานใช้กับแกนขนานคู่ใดก็ได้", feedback: "พจน์ $Ad^2$ มาจากการที่ $\\int y\\,dA = 0$ รอบเซนทรอยด์ ใช้ได้เมื่อแกนหนึ่งผ่านเซนทรอยด์เท่านั้น" }
      - { id: c, text: "ผิด ต้องใช้ $I_b = I_a - A(30)^2$", feedback: "แกน $b$ อยู่ไกลเซนทรอยด์กว่า $I_b$ ต้องมากกว่า $I_a$" }
      - { id: d, text: "ผิด ต้องใช้ $I_b = I_a + A(80)^2$", feedback: "$I_a$ ไม่ใช่ค่ารอบเซนทรอยด์ บวก $A(80)^2$ ซ้ำทำให้นับส่วนของ $50\\ \\mathrm{mm}$ เกิน" }
    hints:
      - "ทฤษฎีบทแกนขนาน: $I = \\bar I + Ad^2$ เมื่อ $\\bar I$ รอบเซนทรอยด์"
      - "ผลต่างของ $I$ คือ $A(80^2 - 50^2)$ ไม่ใช่ $A(30)^2$"
    solution: "$I_a = \\bar I + A(50)^2$ และ $I_b = \\bar I + A(80)^2$ จึง $I_b = I_a + A(80^2 - 50^2) = I_a + 3900A$ ซึ่งไม่เท่ากับ $I_a + 900A$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.mechanics.centroids-inertia.p016
    topics: [engineering.mechanics.centroids-inertia]
    difficulty: 5
    type: numeric
    stem: "จงหาโมเมนต์ความเฉื่อยของพื้นที่ใต้เส้นโค้ง $y = \\sqrt{x}$ จาก $x = 0$ ถึง $x = 4$ (หน่วยเมตร) รอบแกน $x$ คือ $I_x = \\iint y^2\\,dA$ เป็น $\\mathrm{m^4}$ (ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 4.27, tolerance: 0.03, unit: "m⁴" }
    misconceptions:
      - { match: 12.8, feedback: "ลืมหาร 3 ปริพันธ์ชั้นในคือ $\\int_0^{\\sqrt x} y^2\\,dy = (\\sqrt x)^3/3$" }
      - { match: 8, feedback: "ใช้ $\\int y^2\\,dx$ ซึ่งไม่ใช่ $\\iint y^2\\,dA$ แถบตั้งแต่ละแถบมีจุดหลายระยะจากแกน $x$" }
    hints:
      - "เขียนเป็นปริพันธ์สองชั้น $\\int_0^4\\int_0^{\\sqrt x} y^2\\,dy\\,dx$"
      - "ชั้นในได้ $x^{3/2}/3$"
    solution: "$I_x = \\int_0^4 \\dfrac{x^{3/2}}{3}\\,dx = \\dfrac13 \\cdot \\dfrac25 \\cdot 4^{5/2} = \\dfrac{2}{15}(32) = \\dfrac{64}{15} = 4.27\\ \\mathrm{m^4}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.mechanics.centroids-inertia.p017
