      - "ยาทำหน้าที่เป็นสิ่งแวดล้อมที่คัดเลือก"
    solution: "ความแปรผันมีอยู่ก่อนแล้ว ยาฆ่าเซลล์ที่ไม่ดื้อ เซลล์ที่ดื้อจึงเหลือและเพิ่มจำนวน การใช้ยาปฏิชีวนะเมื่อไม่จำเป็น เช่น กับไข้หวัดจากไวรัส จึงเร่งให้เกิดเชื้อดื้อยา"
