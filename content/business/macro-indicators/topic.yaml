- front: อัตราดอกเบี้ยที่แท้จริง
  back: $1 + r = \dfrac{1 + i}{1 + \pi}$ · ประมาณ $i - \pi$
- front: HHI
  back: $\sum s_i^2$ · ผูกขาด $= 10{,}000$ · 4 รายเท่ากัน $= 2{,}500$
- front: ผู้ขายน้อยราย
  back: ไม่กี่ราย เข้ายาก ต้องจับตาปฏิกิริยาคู่แข่ง
