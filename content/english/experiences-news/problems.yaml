problems:
- id: english.writing.experiences-news.p001
  topics:
  - english.writing.experiences-news
  difficulty: 1
  type: mcq
  stem: 'เลือกคำที่ถูก: *Have you ever ___ to Phuket?*'
  choices:
  - id: a
    text: been
    correct: true
    feedback: ถูก Have you ever + V3 ถามประสบการณ์ ไปเที่ยวแล้วกลับมาใช้ been
  - id: b
    text: went
    feedback: went เป็นช่อง 2 หลัง have ใช้ V3
  - id: c
    text: go
    feedback: หลัง have ใช้ V3
  - id: d
    text: going
    feedback: หลัง have ใช้ V3 ไม่ใช่ V-ing
  hints:
  - Have you ever + V3
  - ไปแล้วกลับมาใช้ be → been
  solution: '*Have you ever **been** to Phuket?*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.experiences-news.p002
  topics:
  - english.writing.experiences-news
  difficulty: 1
  type: text
  stem: 'เติมกริยา go ในรูปที่ถูก: *Last Saturday we ___ to Khao Yai National Park.*'
  accepted:
  - went
  misconceptions:
  - match: go
    feedback: Last Saturday เป็นอดีต ใช้ went
  - match: goed
    feedback: go เป็นกริยาอปกติ อดีตคือ went
  - match: have gone
    feedback: มีเวลาในอดีตชัดเจน (Last Saturday) ใช้ past simple
  hints:
  - Last Saturday = อดีตที่ระบุเวลา
  - go – went – gone
  solution: '*Last Saturday we **went** to Khao Yai National Park.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.experiences-news.p003
  topics:
  - english.writing.experiences-news
  difficulty: 1
  type: mcq
  stem: ข้อใดเล่า **กิจวัตรประจำวัน**
  choices:
  - id: a
    text: I usually cycle to school with my brother.
    correct: true
    feedback: ถูก usually + present simple บอกสิ่งที่ทำเป็นประจำ
  - id: b
    text: Last Sunday I cycled to Wat Phumin.
    feedback: เป็นเหตุการณ์ครั้งเดียวในอดีต
  - id: c
    text: I have cycled 20 kilometres in one day.
    feedback: เป็นประสบการณ์ (present perfect) ไม่ใช่กิจวัตร
  - id: d
    text: I was cycling when it started to rain.
    feedback: เป็นฉากของเหตุการณ์ในอดีตครั้งหนึ่ง
  hints:
  - กิจวัตร = ทำเป็นประจำ
  - มองหาคำอย่าง usually, every day และ present simple
  solution: '***I usually cycle to school with my brother.***'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.experiences-news.p004
  topics:
  - english.writing.experiences-news
  difficulty: 2
  type: match
  stem: ดูข่าว จับคู่คำถามกับคำตอบจากย่อหน้าแรก (lead)
  figure: &id001
    src: nan-news.svg
    alt: 'ข่าวสมมุติจาก NAN DAILY NEWS วันที่ 12 October 2026 หัวข่าว New Bike Path Opens Along Nan River ย่อหน้า 1: A 6-kilometre bike path has opened along the Nan River in the city centre. The mayor opened the path on Saturday morning, and more than 300 people cycled on it on the first day. ย่อหน้า 2: The path took eight months to build and cost 18 million baht. It has lights, benches and two rest stops. ย่อหน้า 3: "I used to ride on the busy road, so I was scared of the cars. Now I feel much safer," said Mali, a 15-year-old student. ย่อหน้า 4: However, some shop owners on River Road are unhappy because the path has taken away 40 parking spaces.'
  pairs:
  - left: What happened?
    right: A bike path opened.
  - left: Where?
    right: Along the Nan River in the city centre.
  - left: When?
    right: On Saturday morning.
  - left: Who opened it?
    right: The mayor.
  hints:
  - lead ตอบ Who, What, Where, When
  - อ่านย่อหน้าแรกทีละวลี
  solution: What → a bike path opened · Where → along the Nan River · When → Saturday morning · Who → the mayor
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.experiences-news.p005
  topics:
  - english.writing.experiences-news
  difficulty: 2
  type: mcq
  stem: 'เลือกคำที่ถูก: *Good news! Our town ___ a new library. It opened last Monday.*'
  choices:
  - id: a
    text: has opened
    correct: true
    feedback: ถูก บอกข่าวใหม่ด้วย present perfect แล้วเล่ารายละเอียดด้วย past simple
  - id: b
    text: have opened
    feedback: our town เป็นเอกพจน์ ใช้ has
  - id: c
    text: has open
    feedback: 'หลัง has ใช้ V3: opened'
  - id: d
    text: opening
    feedback: ขาดกริยาช่วย และไม่ใช่รูปที่ใช้บอกข่าว
  hints:
  - ข่าวใหม่ที่ยังเกี่ยวกับตอนนี้
  - has/have + V3 · ประธานเอกพจน์ใช้ has
  solution: '*Our town **has opened** a new library. It opened last Monday.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.experiences-news.p006
  topics:
  - english.writing.experiences-news
  difficulty: 2
  type: mcq
  stem: 'เลือกคำที่ถูก: *I was ___ to hear that our school team won the football cup.*'
  choices:
  - id: a
    text: delighted
    correct: true
    feedback: ถูก I เป็นผู้รู้สึก ใช้ -ed
  - id: b
    text: delighting
    feedback: รูป -ing ไม่ใช้บอกความรู้สึกของคนแบบนี้
  - id: c
    text: delight
    feedback: หลัง was ต้องเป็นคุณศัพท์ delighted
  - id: d
    text: delightful
    feedback: delightful ใช้กับสิ่งที่น่ายินดี (a delightful day) ไม่ใช้บอกว่าคนรู้สึกอย่างไร
  hints:
  - คนรู้สึก ใช้ -ed
  - I was + คุณศัพท์บอกความรู้สึก + to hear that ...
  solution: '*I was **delighted** to hear that our school team won the football cup.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.experiences-news.p007
  topics:
  - english.writing.experiences-news
  difficulty: 3
  type: mcq
  stem: 'เลือกคำที่ถูก: *While we ___ along the beach in Rayong, we saw a baby turtle.*'
  choices:
  - id: a
    text: were walking
    correct: true
    feedback: ถูก การกระทำยาวที่เป็นฉากหลังใช้ past continuous ประธาน we ใช้ were
  - id: b
    text: was walking
    feedback: ประธาน we ใช้ were
  - id: c
    text: are walking
    feedback: เรื่องในอดีต (saw) ใช้ were
  - id: d
    text: walk
    feedback: เรื่องในอดีต ต้องเปลี่ยนรูปกริยา
  hints:
  - while + การกระทำยาวที่เป็นฉากหลัง
  - we + were + V-ing
  solution: '*While we **were walking** along the beach in Rayong, we saw a baby turtle.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.experiences-news.p008
  topics:
  - english.writing.experiences-news
  difficulty: 3
  type: order
  stem: เรียงประโยคให้เป็นย่อหน้าเล่าประสบการณ์ (orientation → events → personal response)
  items:
  - Last April, my family and I went to Nan for Songkran.
  - On the first day, we visited Wat Phumin and looked at its famous wall paintings.
  - After that, we joined a water fight in the old town.
  - In the evening, we watched a boat race on the river.
  - It was my best holiday ever because the people were so friendly.
  hints:
  - เริ่มด้วยใคร ที่ไหน เมื่อไร
  - On the first day → After that → In the evening แล้วจบด้วยความรู้สึก
  solution: Orientation (Last April ...) → events (On the first day → After that → In the evening) → personal response (It was my best holiday ever because ...)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.experiences-news.p009
  topics:
  - english.writing.experiences-news
  difficulty: 3
  type: mcq
  stem: 'เลือกคำที่ถูก: *I have visited Chiang Mai twice. I first ___ there in 2022.*'
  choices:
  - id: a
    text: went
    correct: true
    feedback: ถูก มีเวลาในอดีตชัดเจน (in 2022) ใช้ past simple
  - id: b
    text: have gone
    feedback: present perfect ใช้กับเวลาที่ระบุชัดในอดีต (in 2022) ไม่ได้
  - id: c
    text: have been
    feedback: present perfect ใช้กับ in 2022 ไม่ได้
  - id: d
    text: go
    feedback: เรื่องในอดีต ต้องใช้ went
  hints:
  - ประโยคแรกบอกประสบการณ์ ประโยคที่สองบอกเวลาชัดเจน
  - in 2022 → past simple
  solution: '*I have visited Chiang Mai twice. I first **went** there in 2022.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.experiences-news.p010
  topics:
  - english.writing.experiences-news
  difficulty: 3
  type: mcq
  stem: 'เลือกคำเชื่อมที่ใช้ได้ (เลือกทุกข้อที่ถูก): *My trip to Bangkok was busy and noisy. ___, my trip to Nan was quiet and relaxing.*'
  multiple: true
  choices:
  - id: a
    text: However
    correct: true
    feedback: ถูก บอกความขัดแย้งระหว่างสองประสบการณ์
  - id: b
    text: In contrast
    correct: true
    feedback: ถูก ใช้เปรียบเทียบสิ่งที่ต่างกัน
  - id: c
    text: For example
    feedback: Nan ไม่ใช่ตัวอย่างของ Bangkok สองประโยคตรงข้ามกัน
  - id: d
    text: As a result
    feedback: ทริปน่านไม่ใช่ผลของทริปกรุงเทพฯ
  hints:
  - วุ่นวาย vs เงียบสงบ เป็นความต่าง
  - ใช้คำเชื่อมบอกความขัดแย้ง
  solution: '***However**, ...* หรือ ***In contrast**, ...* ใช้เปรียบเทียบประสบการณ์ที่ต่างกัน'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.experiences-news.p011
  topics:
  - english.writing.experiences-news
  difficulty: 3
  type: mcq
  stem: ดูข่าว คำถามใด **ตอบได้** จากข่าวนี้
  figure: *id001
  choices:
  - id: a
    text: Why are some shop owners unhappy?
    correct: true
    feedback: ถูก ย่อหน้าสุดท้ายบอกว่าเสียที่จอดรถ 40 ที่
  - id: b
    text: What is the mayor's name?
    feedback: ข่าวไม่ได้บอกชื่อนายกเทศมนตรี
  - id: c
    text: How many people live in Nan?
    feedback: ข่าวไม่ได้บอกจำนวนประชากร
  - id: d
    text: When will the path close?
    feedback: ข่าวไม่ได้พูดถึงการปิดทางจักรยาน
  hints:
  - scan หาข้อมูลของแต่ละคำถามในข่าว
  - คำถามที่ข่าวไม่ได้ให้ข้อมูลตอบไม่ได้
  solution: '***Why are some shop owners unhappy?*** → *because the path has taken away 40 parking spaces.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.experiences-news.p012
  topics:
  - english.writing.experiences-news
  difficulty: 4
  type: numeric
  stem: ดูข่าว ทางจักรยานนี้มีค่าก่อสร้างเฉลี่ยกิโลเมตรละกี่ล้านบาท
  figure: *id001
  answer:
    value: 3
    tolerance: 0
    unit: ล้านบาท
  misconceptions:
  - match: 108
    feedback: 18 × 6 = 108 เป็นการคูณ ต้องหารค่าก่อสร้างด้วยระยะทาง
  - match: 0.33
    feedback: 6 ÷ 18 หารกลับด้าน ต้องเอาค่าก่อสร้างตั้ง
  - match: 2.25
    feedback: 18 ÷ 8 ใช้จำนวนเดือน ต้องใช้ระยะทาง 6 กิโลเมตร
  hints:
  - scan หาตัวเลขระยะทาง (kilometre) และค่าก่อสร้าง (cost)
  - ค่าก่อสร้าง ÷ ระยะทาง
  solution: 'ค่าก่อสร้าง 18 ล้านบาท ระยะทาง 6 กิโลเมตร: 18 ÷ 6 = **3 ล้านบาทต่อกิโลเมตร**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.experiences-news.p013
  topics:
  - english.writing.experiences-news
  difficulty: 4
  type: mcq
  stem: 'เลือกคำที่ถูกทั้งสองช่อง: *I usually ___ the bus to school, but yesterday I ___ because the bus was late.*'
  choices:
  - id: a
    text: take / walked
    correct: true
    feedback: ถูก กิจวัตรใช้ present simple เหตุการณ์เมื่อวานใช้ past simple
  - id: b
    text: took / walk
    feedback: สลับกัน กิจวัตร (usually) ใช้ take เมื่อวานใช้ walked
  - id: c
    text: am taking / was walking
    feedback: กิจวัตรใช้ present simple ไม่ใช้ continuous และเมื่อวานเป็นเหตุการณ์ที่จบแล้ว
  - id: d
    text: take / walk
    feedback: yesterday ต้องใช้กริยาอดีต walked
  hints:
  - usually = กิจวัตร · yesterday = อดีต
  - present simple กับ past simple
  solution: '*I usually **take** the bus to school, but yesterday I **walked** because the bus was late.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.experiences-news.p014
  topics:
  - english.writing.experiences-news
  difficulty: 4
  type: text
  stem: 'เติมกริยา have ในรูปที่ถูก: *Our school ___ a vegetable garden since 2020.*'
  accepted:
  - has had
  misconceptions:
  - match: had
    feedback: 'since 2020 บอกว่ายังมีอยู่จนถึงตอนนี้ ใช้ present perfect: has had'
  - match: has
    feedback: since บอกช่วงเวลาจากอดีตถึงปัจจุบัน ต้องใช้ has + V3
  - match: have had
    feedback: our school เป็นเอกพจน์ ใช้ has
  - match: has have
    feedback: 'หลัง has ใช้ V3: had'
  hints:
  - since + จุดเริ่มต้นในอดีต → present perfect
  - has + V3 (have – had – had)
  solution: '*Our school **has had** a vegetable garden since 2020.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.experiences-news.p015
  topics:
  - english.writing.experiences-news
  difficulty: 4
  type: mcq
  stem: ดูข่าว ข้อใดแสดง **ความรู้สึก ความคิดเห็น เหตุผล และอ้างข้อมูลจากข่าว** ได้ดีที่สุด
  figure: *id001
  choices:
  - id: a
    text: I'm glad about the new path because cyclists will be safer. Mali said she used to be scared of the cars. However, I think the town should find new parking spaces for the shops.
    correct: true
    feedback: ถูก มีความรู้สึก (glad) เหตุผล อ้างคำพูดของ Mali และมองอีกด้าน (ร้านค้าเสียที่จอดรถ)
  - id: b
    text: The path is 6 kilometres long and cost 18 million baht.
    feedback: ทวนข้อเท็จจริงจากข่าว ไม่มีความรู้สึกหรือความเห็น
  - id: c
    text: I'm glad. Bikes are good.
    feedback: มีความรู้สึก แต่เหตุผลสั้นและไม่อ้างข้อมูลจากข่าว
  - id: d
    text: I'm glad about the new path because it cost 300 million baht.
    feedback: ข้อมูลผิด ข่าวบอกว่าค่าก่อสร้าง 18 ล้านบาท และค่าก่อสร้างไม่ใช่เหตุผลที่ดีใจ
  hints:
  - 'คำตอบที่ดีมีครบ: ความรู้สึก ความเห็น เหตุผล และข้อมูลจากข่าว'
  - ตรวจว่าข้อมูลที่อ้างตรงกับข่าวจริง
  solution: 'ข้อแรกดีที่สุด: บอกความรู้สึก ให้เหตุผล อ้างคำพูดในข่าว และเสนอความเห็นต่อปัญหาที่จอดรถ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.experiences-news.p016
  topics:
  - english.writing.experiences-news
  difficulty: 5
  type: order
  stem: เรียงประโยคให้เป็นข่าวโรงเรียนแบบพีระมิดกลับหัว
  items:
  - M.3 Students Clean Up Bang Saen Beach
  - Forty M.3 students collected rubbish at Bang Saen Beach last Sunday.
  - They filled 65 bags with plastic bottles, cans and fishing nets in three hours.
  - “I didn't know there was so much plastic on the beach,” said Krit, one of the students.
  - The school plans to organise another clean-up in March.
  hints:
  - หัวข่าวสั้นอยู่บนสุด ตามด้วย lead ที่ตอบ Who, What, Where, When
  - รายละเอียดและตัวเลข → คำพูดของคนที่เกี่ยวข้อง → ข้อมูลเสริม
  solution: Headline → lead (Forty M.3 students ...) → details (65 bags ...) → quote (Krit) → ข้อมูลเสริม (another clean-up in March)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.experiences-news.p017
  topics:
  - english.writing.experiences-news
  difficulty: 5
  type: mcq
  stem: 'อ่านบันทึกของนักเรียน ประโยคใด **ใช้ tense ผิด** (เลือกทุกข้อที่ผิด)


    *(1) I have been to Sukhothai three times. (2) I have gone there last December with my class. (3) While we were cycling around the old city, it started to rain. (4) We stay in a temple until the rain stopped.*'
  multiple: true
  choices:
  - id: a
    text: (2) I have gone there last December with my class.
    correct: true
    feedback: 'ผิดจริง last December เป็นเวลาที่ระบุชัด ต้องใช้ past simple: I went there last December'
  - id: b
    text: (4) We stay in a temple until the rain stopped.
    correct: true
    feedback: ผิดจริง เรื่องในอดีต ต้องใช้ stayed
  - id: c
    text: (1) I have been to Sukhothai three times.
    feedback: ถูก present perfect บอกประสบการณ์โดยไม่ระบุเวลา
  - id: d
    text: (3) While we were cycling around the old city, it started to rain.
    feedback: ถูก past continuous เป็นฉากหลัง past simple เป็นเหตุการณ์ที่แทรก
  hints:
  - ประโยคที่มีเวลาในอดีตระบุชัดต้องใช้ past simple
  - ตรวจกริยาทุกตัวว่าตรงกับเวลาของเรื่อง
  solution: (2) ต้องเป็น *I **went** there last December ...* และ (4) ต้องเป็น *We **stayed** in a temple until the rain stopped.*
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.experiences-news.p018
  topics:
  - english.writing.experiences-news
