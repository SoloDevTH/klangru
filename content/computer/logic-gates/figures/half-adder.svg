<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="520" height="250" font-family="sans-serif" font-size="15">
  <title>วงจรบวกครึ่ง อินพุต A และ B ต่อเข้าเกต XOR ได้ผลบวก S และต่อเข้าเกต AND ได้ตัวทด C</title>
  <rect x="0" y="0" width="520" height="250" fill="#ffffff"/>
  <path d="M230,40 Q254.5,65.0 230,90 Q275.5,90 300,65.0 Q275.5,40 230,40 Z" fill="#fff" stroke="#15211e" stroke-width="2" />
  <path d="M221,40 Q245.5,65.0 221,90" fill="none" stroke="#15211e" stroke-width="2" />
  <path d="M230,150 H275.0 A25.0,25.0 0 0 1 275.0,200 H230 Z" fill="#fff" stroke="#15211e" stroke-width="2" />
  <text x="40.0" y="59.0" text-anchor="end" fill="#15211e" font-weight="bold" font-size="18" >A</text>
  <text x="40.0" y="116.0" text-anchor="end" fill="#15211e" font-weight="bold" font-size="18" >B</text>
  <path d="M50.0,54.0 L238.4,54.0" fill="none" stroke="#15211e" stroke-width="2" />
  <circle cx="110.0" cy="54.0" r="3.5" fill="#15211e" stroke="#15211e" stroke-width="1"/>
  <path d="M110.0,54.0 L110.0,164.0 L230.0,164.0" fill="none" stroke="#15211e" stroke-width="2" />
  <path d="M50.0,111.0 L150.0,111.0" fill="none" stroke="#15211e" stroke-width="2" />
  <circle cx="150.0" cy="111.0" r="3.5" fill="#15211e" stroke="#15211e" stroke-width="1"/>
  <path d="M150.0,111.0 L150.0,76.0 L238.4,76.0" fill="none" stroke="#15211e" stroke-width="2" />
  <path d="M150.0,111.0 L150.0,186.0 L230.0,186.0" fill="none" stroke="#15211e" stroke-width="2" />
  <path d="M300.0,65.0 L420.0,65.0" fill="none" stroke="#15211e" stroke-width="2" />
  <text x="428.0" y="71.0" text-anchor="start" fill="#15211e" font-weight="bold" >S (ผลบวก)</text>
  <path d="M300.0,175.0 L420.0,175.0" fill="none" stroke="#15211e" stroke-width="2" />
  <text x="428.0" y="181.0" text-anchor="start" fill="#15211e" font-weight="bold" >C (ตัวทด)</text>
  <text x="265.0" y="30.0" text-anchor="middle" fill="#6b7672" font-weight="normal" font-size="13" >XOR</text>
  <text x="265.0" y="222.0" text-anchor="middle" fill="#6b7672" font-weight="normal" font-size="13" >AND</text>
</svg>
