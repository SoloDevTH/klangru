<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 345" width="680" height="345" font-family="sans-serif">
<title>สามขั้นของการเรียนรู้ทักษะกลไก</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="0" y="0" width="680" height="345" fill="#ffffff"/>
<text x="340.0" y="28.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">ขั้นของการเรียนรู้ทักษะกลไก</text>
<rect x="20.0" y="110.0" width="200.0" height="175.0" rx="10" fill="#fdebd0" stroke="#555" stroke-width="1.5" />
<text x="120.0" y="138.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">1 ขั้นทำความเข้าใจ</text>
<text x="32.0" y="168.0" font-size="13" text-anchor="start" fill="#111">• รู้ว่าต้องทำอะไร</text>
<text x="32.0" y="192.0" font-size="13" text-anchor="start" fill="#111">• ต้องคิดทุกขั้น ช้า</text>
<text x="32.0" y="216.0" font-size="13" text-anchor="start" fill="#111">• ผิดบ่อย ไม่สม่ำเสมอ</text>
<text x="32.0" y="240.0" font-size="13" text-anchor="start" fill="#111">• ต้องการคำแนะนำและตัวอย่าง</text>
<line x1="223.0" y1="130.0" x2="247.0" y2="100.0" stroke="#222" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="250.0" y="80.0" width="200.0" height="175.0" rx="10" fill="#d6eaf8" stroke="#555" stroke-width="1.5" />
<text x="350.0" y="108.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">2 ขั้นฝึกฝน</text>
<text x="262.0" y="138.0" font-size="13" text-anchor="start" fill="#111">• ทำได้คล่องขึ้น</text>
<text x="262.0" y="162.0" font-size="13" text-anchor="start" fill="#111">• ผิดน้อยลง แก้เองได้</text>
<text x="262.0" y="186.0" font-size="13" text-anchor="start" fill="#111">• เริ่มรู้สึกว่าทำถูกหรือผิด</text>
<text x="262.0" y="210.0" font-size="13" text-anchor="start" fill="#111">• ต้องฝึกซ้ำและได้ข้อมูลย้อนกลับ</text>
<line x1="453.0" y1="100.0" x2="477.0" y2="70.0" stroke="#222" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="480.0" y="50.0" width="200.0" height="175.0" rx="10" fill="#d5f5e3" stroke="#555" stroke-width="1.5" />
<text x="580.0" y="78.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">3 ขั้นอัตโนมัติ</text>
<text x="492.0" y="108.0" font-size="13" text-anchor="start" fill="#111">• ทำได้โดยไม่ต้องคิด</text>
<text x="492.0" y="132.0" font-size="13" text-anchor="start" fill="#111">• ถูกต้องและสม่ำเสมอ</text>
<text x="492.0" y="156.0" font-size="13" text-anchor="start" fill="#111">• สนใจเกมและเพื่อนร่วมทีมได้</text>
<text x="492.0" y="180.0" font-size="13" text-anchor="start" fill="#111">• ฝึกรักษาและพัฒนาต่อ</text>
<text x="340.0" y="330.0" font-size="13" text-anchor="middle" fill="#111">การฝึกที่ถูกวิธีและสม่ำเสมอพาจากขั้นที่ 1 ไปขั้นที่ 3 แต่ละคนใช้เวลาไม่เท่ากัน</text>
</svg>
