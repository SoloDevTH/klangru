<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" font-family="sans-serif" font-size="14">
<title>การเปลี่ยนแปลงคาร์บอนในบรรยากาศจากกิจกรรมของมนุษย์ ปี 2022</title>
<rect x="0" y="0" width="860" height="420" fill="#ffffff"/>
<rect x="320.0" y="170.0" width="220.0" height="76.0" rx="8" fill="#eef4fb" stroke="#2c4a7a" stroke-width="1.5"/>
<text x="430.0" y="196.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">บรรยากาศ</text>
<text x="430.0" y="213.0" text-anchor="middle" font-size="13" fill="#222">เพิ่มขึ้น 4.6 GtC ต่อปี</text>
<text x="430.0" y="230.0" text-anchor="middle" font-size="13" fill="#222">CO₂ 417 ppm</text>
<rect x="30.0" y="30.0" width="230.0" height="60.0" rx="8" fill="#f2f2f2" stroke="#555" stroke-width="1.5"/>
<text x="145.0" y="56.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">เชื้อเพลิงฟอสซิล (ธรณีภาค)</text>
<text x="145.0" y="73.5" text-anchor="middle" font-size="13" fill="#222">และซีเมนต์ 9.9 GtC ต่อปี</text>
<rect x="600.0" y="30.0" width="230.0" height="60.0" rx="8" fill="#f7ecd0" stroke="#8a5a1a" stroke-width="1.5"/>
<text x="715.0" y="56.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">การเปลี่ยนการใช้ที่ดิน</text>
<text x="715.0" y="73.5" text-anchor="middle" font-size="12" fill="#222">เช่น ตัดไม้ทำลายป่า 1.2 GtC ต่อปี</text>
<rect x="30.0" y="330.0" width="230.0" height="60.0" rx="8" fill="#d8e8f7" stroke="#2c6aa0" stroke-width="1.5"/>
<text x="145.0" y="356.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">มหาสมุทร (ไฮโดรสเฟียร์)</text>
<text x="145.0" y="373.5" text-anchor="middle" font-size="13" fill="#222">ดูดซับ 2.8 GtC ต่อปี</text>
<rect x="600.0" y="330.0" width="230.0" height="60.0" rx="8" fill="#e9f5e9" stroke="#2a7a3a" stroke-width="1.5"/>
<text x="715.0" y="356.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">พืชบนบก (ชีวภาค)</text>
<text x="715.0" y="373.5" text-anchor="middle" font-size="13" fill="#222">ดูดซับ 3.8 GtC ต่อปี</text>
<line x1="200.0" y1="92.0" x2="330.0" y2="168.0" stroke="#555" stroke-width="3"/>
<polygon points="330.0,168.0 321.1,166.8 324.6,160.8" fill="#555"/>
<line x1="660.0" y1="92.0" x2="530.0" y2="168.0" stroke="#8a5a1a" stroke-width="3"/>
<polygon points="530.0,168.0 535.4,160.8 538.9,166.8" fill="#8a5a1a"/>
<line x1="330.0" y1="248.0" x2="200.0" y2="328.0" stroke="#2c6aa0" stroke-width="3"/>
<polygon points="200.0,328.0 205.2,320.7 208.9,326.6" fill="#2c6aa0"/>
<line x1="530.0" y1="248.0" x2="660.0" y2="328.0" stroke="#2a7a3a" stroke-width="3"/>
<polygon points="660.0,328.0 651.1,326.6 654.8,320.7" fill="#2a7a3a"/>
<text x="430.0" y="290.0" text-anchor="middle" font-size="12" fill="#555">ส่วนต่างเล็กน้อย (−0.1 GtC) คือความไม่สมดุล</text>
<text x="430.0" y="306.0" text-anchor="middle" font-size="12" fill="#555">ของการประมาณ</text>
<text x="430.0" y="412.0" text-anchor="middle" font-size="12" fill="#555">ค่าประมาณปี ค.ศ. 2022 จาก Global Carbon Budget 2023 (1 GtC = 10⁹ ตันคาร์บอน)</text>
</svg>