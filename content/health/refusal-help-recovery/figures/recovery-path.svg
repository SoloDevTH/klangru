<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" font-family="sans-serif">
<title>ขั้นตอนการบำบัดของ สบยช.</title>
<rect x="0" y="0" width="760" height="260" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="380.0" y="28.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">ขั้นตอนการบำบัดและฟื้นฟู (ตามที่ สบยช. อธิบาย ก.พ. 2569)</text>
<rect x="20.0" y="60.0" width="160.0" height="90.0" rx="8" fill="#d6eaf8" stroke="#333" stroke-width="1.5"/>
<text x="100.0" y="98.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">1 คัดกรอง</text>
<text x="100.0" y="124.0" font-size="13" text-anchor="middle" fill="#111">ประเมินโรคร่วม</text>
<line x1="182.0" y1="105.0" x2="203.0" y2="105.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="205.0" y="60.0" width="160.0" height="90.0" rx="8" fill="#d5f5e3" stroke="#333" stroke-width="1.5"/>
<text x="285.0" y="98.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">2 บำบัดด้วยยา</text>
<text x="285.0" y="124.0" font-size="13" text-anchor="middle" fill="#111">ดูแลอาการทางกาย</text>
<line x1="367.0" y1="105.0" x2="388.0" y2="105.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="390.0" y="60.0" width="160.0" height="90.0" rx="8" fill="#fcf3cf" stroke="#333" stroke-width="1.5"/>
<text x="470.0" y="98.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">3 ฟื้นฟู</text>
<text x="470.0" y="124.0" font-size="13" text-anchor="middle" fill="#111">ราว 4–6 เดือน</text>
<line x1="552.0" y1="105.0" x2="573.0" y2="105.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="575.0" y="60.0" width="160.0" height="90.0" rx="8" fill="#fadbd8" stroke="#333" stroke-width="1.5"/>
<text x="655.0" y="98.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">4 ติดตาม</text>
<text x="655.0" y="124.0" font-size="13" text-anchor="middle" fill="#111">อย่างน้อย 1 ปี</text>
<text x="380.0" y="185.0" font-size="13" text-anchor="middle" fill="#111">สถานที่: รพ.สต. → โรงพยาบาลชุมชน → โรงพยาบาลจังหวัด → สบยช. (อาการรุนแรง)</text>
<text x="380.0" y="212.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#922b21">ปรึกษาได้ที่ 1165 ตลอด 24 ชั่วโมง  •  ฉุกเฉินโทร 1669</text>
</svg>
