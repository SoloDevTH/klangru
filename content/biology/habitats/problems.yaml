problems:
  - id: biology.ecology.habitats.p001
    topics: [biology.ecology.habitats]
    difficulty: 1
    type: mcq
    stem: "ปลาหางนกยูงอาศัยอยู่ที่ใด"
    choices:
      - { id: a, text: "ในสระน้ำหรือบ่อน้ำ", correct: true }
      - { id: b, text: "บนกิ่งไม้", feedback: "ปลาหายใจด้วยเหงือกและว่ายน้ำ ต้องอยู่ในน้ำ อยู่บนกิ่งไม้ไม่ได้" }
      - { id: c, text: "ใต้ก้อนหินบนบก", feedback: "ใต้ก้อนหินชื้นแต่ไม่มีน้ำให้ปลาว่ายและหายใจ" }
      - { id: d, text: "บนลานคอนกรีต", feedback: "ลานคอนกรีตแห้งและร้อน ปลาอยู่ไม่ได้" }
    hints:
      - "ปลาใช้อะไรเคลื่อนที่และหายใจ"
      - "ปลาต้องอยู่ในที่ที่มีน้ำตลอดเวลา"
    solution: "ปลาหายใจด้วยเหงือกและว่ายด้วยครีบ จึงต้องอยู่ในน้ำ เช่น สระน้ำหรือบ่อน้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.habitats.p002
    topics: [biology.ecology.habitats]
    difficulty: 1
    type: match
    stem: "จับคู่สัตว์กับแหล่งที่อยู่ที่เหมาะสม"
    pairs:
      - { left: "ไส้เดือน", right: "ในดินที่ชื้น ใต้ใบไม้ผุ" }
      - { left: "นกกางเขน", right: "บนต้นไม้" }
      - { left: "ปลาช่อน", right: "ในบึงหรือนาข้าว" }
      - { left: "ผีเสื้อ", right: "สวนดอกไม้" }
    hints:
      - "คิดว่าสัตว์แต่ละชนิดกินอะไรและหลบภัยที่ไหน"
      - "ผีเสื้อกินน้ำหวานจากดอกไม้"
    solution: "ไส้เดือน → ดินชื้นใต้ใบไม้ผุ, นกกางเขน → บนต้นไม้, ปลาช่อน → บึงหรือนาข้าว, ผีเสื้อ → สวนดอกไม้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.habitats.p003
    topics: [biology.ecology.habitats]
    difficulty: 1
    type: text
    stem: "บริเวณที่สิ่งมีชีวิตอาศัยอยู่ และได้อาหาร น้ำ และที่หลบภัย เรียกว่าอะไร"
    accepted: ["แหล่งที่อยู่", "แหล่งที่อยู่อาศัย", "ที่อยู่อาศัย", "ถิ่นที่อยู่"]
    hints:
      - "คำนี้มีคำว่า ที่อยู่"
      - "เช่น สระน้ำเป็น...ของปลา"
    misconceptions:
      - { match: "อาหาร", feedback: "อาหารเป็นสิ่งที่ได้จากบริเวณนั้น แต่โจทย์ถามชื่อของบริเวณที่อาศัย" }
    solution: "บริเวณที่สิ่งมีชีวิตอาศัยอยู่เรียกว่า แหล่งที่อยู่ เช่น สระน้ำเป็นแหล่งที่อยู่ของปลา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.habitats.p004
    topics: [biology.ecology.habitats]
    difficulty: 2
    type: mcq
    stem: "ทำไมเราจึงมักพบไส้เดือนและกิ้งกือใต้ก้อนหิน"
    choices:
      - { id: a, text: "ใต้ก้อนหินมืด ชื้น และเย็น มีเศษใบไม้ผุเป็นอาหาร", correct: true }
      - { id: b, text: "ใต้ก้อนหินมีแดดมากและร้อน", feedback: "ก้อนหินบังแดด ใต้ก้อนหินจึงมืดและเย็น ไส้เดือนไม่ชอบที่ร้อน" }
      - { id: c, text: "ใต้ก้อนหินมีน้ำท่วมตลอดเวลา", feedback: "ใต้ก้อนหินชื้น แต่ไม่ได้มีน้ำท่วม ไส้เดือนต้องการความชื้น ไม่ใช่น้ำลึก" }
      - { id: d, text: "ไส้เดือนกินก้อนหินเป็นอาหาร", feedback: "ไส้เดือนกินเศษใบไม้และซากพืชในดิน ไม่ได้กินหิน" }
    hints:
      - "ลองยกก้อนหินดู ใต้ก้อนหินเป็นอย่างไร"
      - "ตัวไส้เดือนต้องไม่แห้ง"
    solution: "ใต้ก้อนหินเป็นแหล่งที่อยู่ขนาดเล็กที่มืด ชื้น และเย็น ทำให้ตัวไส้เดือนไม่แห้ง และมีเศษใบไม้ผุเป็นอาหาร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.habitats.p005
    topics: [biology.ecology.habitats]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ต้นมะม่วงใหญ่ในสวนให้อะไรแก่สัตว์บ้าง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ผลมะม่วงเป็นอาหารของนกและค้างคาว", correct: true }
      - { id: b, text: "กิ่งไม้เป็นที่ทำรังของนก", correct: true }
      - { id: c, text: "ร่มเงาให้สุนัขหลบแดด", correct: true }
      - { id: d, text: "น้ำให้ปลาว่าย", feedback: "ต้นมะม่วงไม่มีน้ำให้ปลาว่าย ปลาต้องอยู่ในสระหรือแม่น้ำ" }
    hints:
      - "คิดถึงอาหาร ที่หลบภัย และที่ทำรัง"
      - "มีข้อหนึ่งที่ต้นไม้ให้ไม่ได้"
    solution: "ต้นมะม่วงให้อาหาร (ผล) ที่ทำรัง (กิ่ง) และร่มเงา แก่สัตว์หลายชนิด แต่ไม่ได้ให้น้ำสำหรับปลา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.habitats.p006
    topics: [biology.ecology.habitats]
    difficulty: 2
    type: numeric
    stem: "จากกราฟผลการสำรวจ สนามหญ้ามีสัตว์มากกว่าลานคอนกรีตกี่ชนิด"
    figure: { src: survey-chart.svg, alt: "กราฟแท่งจำนวนชนิดของสัตว์ที่พบในการสำรวจ 15 นาที สนามหญ้า 6 ชนิด สระน้ำ 4 ชนิด ลานคอนกรีต 1 ชนิด" }
    answer: { value: 5, unit: ชนิด }
    hints:
      - "อ่านจำนวนชนิดของสนามหญ้าและลานคอนกรีตจากกราฟ"
      - "มากกว่ากี่ชนิด ให้นำจำนวนที่มากลบด้วยจำนวนที่น้อย"
    misconceptions:
      - { match: 7, feedback: "7 คือนำสองค่ามาบวกกัน คำถามว่ามากกว่ากี่ชนิดต้องลบ" }
      - { match: 2, feedback: "2 คือผลต่างของสนามหญ้ากับสระน้ำ โจทย์ถามเทียบกับลานคอนกรีต" }
    solution: "สนามหญ้า 6 ชนิด ลานคอนกรีต 1 ชนิด มากกว่ากัน $6 - 1 = 5$ ชนิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.habitats.p007
    topics: [biology.ecology.habitats]
    difficulty: 2
    type: mcq
    stem: "จากผลการสำรวจ ลานคอนกรีตพบสัตว์เพียง 1 ชนิด เพราะเหตุใด"
    choices:
      - { id: a, text: "ลานคอนกรีตร้อน แห้ง ไม่มีพืชเป็นอาหารและไม่มีที่หลบภัย", correct: true }
      - { id: b, text: "สัตว์ทุกชนิดไม่ชอบสีเทา", feedback: "สีของพื้นไม่ใช่เหตุผลหลัก สัตว์มองหาอาหาร น้ำ และที่หลบภัย" }
      - { id: c, text: "นักเรียนสำรวจลานคอนกรีตนานกว่าที่อื่น", feedback: "การสำรวจใช้เวลาเท่ากันทุกที่ 15 นาที จึงเปรียบเทียบกันได้" }
      - { id: d, text: "ลานคอนกรีตมีอาหารมากเกินไป", feedback: "ลานคอนกรีตแทบไม่มีพืชหรืออาหารเลย" }
    hints:
      - "แหล่งที่อยู่ที่ดีต้องให้อะไรบ้าง"
      - "ลานคอนกรีตมีสิ่งเหล่านั้นไหม"
    solution: "ลานคอนกรีตไม่มีพืชเป็นอาหาร ไม่มีน้ำ และไม่มีที่หลบภัย ทั้งยังร้อนและแห้ง จึงไม่เหมาะกับสัตว์ส่วนใหญ่ ส่วนสนามหญ้ามีพืชและดอกไม้จึงพบสัตว์มากกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.habitats.p008
    topics: [biology.ecology.habitats]
    difficulty: 3
    type: mcq
    stem: "ช่วงหน้าแล้ง สระน้ำเล็ก ๆ หลังหมู่บ้านแห้งจนหมด ข้อใดน่าจะเกิดขึ้น"
    choices:
      - { id: a, text: "ปลาในสระตาย ส่วนกบย้ายไปหาที่ชื้นหรือมุดลงไปในดินโคลน", correct: true }
      - { id: b, text: "ปลาเดินไปหาสระอื่น", feedback: "ปลาส่วนใหญ่เคลื่อนที่บนบกไม่ได้และหายใจในอากาศไม่ได้นาน จึงมักตายเมื่อสระแห้ง" }
      - { id: c, text: "ไม่มีอะไรเปลี่ยน เพราะสัตว์ไม่ต้องใช้น้ำ", feedback: "สัตว์ทุกชนิดต้องการน้ำ โดยเฉพาะสัตว์ที่อาศัยในน้ำ" }
      - { id: d, text: "บัวในสระโตเร็วขึ้น", feedback: "บัวเป็นพืชน้ำ เมื่อน้ำแห้งบัวจะเหี่ยว ไม่ได้โตเร็วขึ้น" }
    hints:
      - "สัตว์ในสระต้องการน้ำเพื่ออะไรบ้าง"
      - "สัตว์ที่ย้ายที่ได้กับสัตว์ที่ย้ายไม่ได้ จะเป็นอย่างไร"
    solution: "เมื่อแหล่งที่อยู่เปลี่ยน สัตว์ที่ย้ายไม่ได้ เช่น ปลา จะตาย ส่วนสัตว์ที่ย้ายได้ เช่น กบ จะไปหาที่ชื้นแห่งใหม่ พืชน้ำอย่างบัวก็จะเหี่ยว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.habitats.p009
    topics: [biology.ecology.habitats]
    difficulty: 3
    type: mcq
    stem: "นักเรียนไปทัศนศึกษาที่ป่าชายเลนในจังหวัดสมุทรสงคราม น่าจะพบสัตว์ชนิดใด"
    choices:
      - { id: a, text: "ปูก้ามดาบและปลาตีน", correct: true }
      - { id: b, text: "หมีขั้วโลก", feedback: "หมีขั้วโลกอาศัยในเขตขั้วโลกที่หนาวและมีน้ำแข็ง ไม่ใช่ป่าชายเลนที่ร้อนชื้น" }
      - { id: c, text: "อูฐ", feedback: "อูฐอาศัยในทะเลทรายที่แห้งแล้ง ป่าชายเลนมีน้ำและดินเลน" }
      - { id: d, text: "ปลาทองในตู้", feedback: "ปลาทองเป็นปลาน้ำจืดที่คนเลี้ยง ป่าชายเลนมีน้ำกร่อยจากทะเล" }
    hints:
      - "ป่าชายเลนมีน้ำทะเลขึ้นลงและดินเลน"
      - "สัตว์ที่พบต้องอยู่ในเลนและน้ำกร่อยได้"
    solution: "ป่าชายเลนมีดินเลนและน้ำทะเลขึ้นลง ปูก้ามดาบขุดรูในเลน และปลาตีนกระโดดบนเลนได้ จึงเหมาะกับที่นี่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.habitats.p010
    topics: [biology.ecology.habitats]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการสำรวจเพื่อเปรียบเทียบสิ่งมีชีวิตในบริเวณต่าง ๆ ของโรงเรียน"
    items:
      - "เลือกบริเวณที่จะสำรวจ เช่น สนามหญ้า สระน้ำ ลานคอนกรีต"
      - "สังเกตและนับพืชและสัตว์ในแต่ละบริเวณ ใช้เวลาเท่ากัน"
      - "บันทึกชื่อและจำนวนลงในตาราง"
      - "ทำกราฟแล้วเปรียบเทียบว่าบริเวณใดพบมากที่สุด"
    hints:
      - "ต้องรู้ก่อนว่าจะไปสำรวจที่ไหน"
      - "ต้องมีข้อมูลในตารางก่อนจึงทำกราฟได้"
    solution: "เลือกบริเวณ → สังเกตและนับด้วยเวลาเท่ากัน → บันทึกลงตาราง → ทำกราฟและเปรียบเทียบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.habitats.p011
    topics: [biology.ecology.habitats]
    difficulty: 3
    type: mcq
    stem: "ข้อใดเป็นตัวอย่างของสัตว์ที่เปลี่ยนแปลงสภาพแวดล้อมเพื่อให้ได้ที่อยู่"
    choices:
      - { id: a, text: "ปลวกขนดินมาสร้างจอมปลวกสูงในทุ่งนา", correct: true }
      - { id: b, text: "ฝนตกทำให้สระน้ำเต็ม", feedback: "ฝนเป็นสภาพอากาศ ไม่ใช่สัตว์ที่ทำให้สภาพแวดล้อมเปลี่ยน" }
      - { id: c, text: "แดดทำให้ใบไม้แห้ง", feedback: "แดดไม่ใช่สัตว์ โจทย์ถามถึงสัตว์ที่เปลี่ยนสภาพแวดล้อม" }
      - { id: d, text: "ผีเสื้อบินผ่านสวน", feedback: "การบินผ่านไม่ได้เปลี่ยนสภาพแวดล้อม" }
    hints:
      - "หาข้อที่สัตว์ลงมือสร้างหรือเปลี่ยนบางอย่าง"
      - "จอมปลวกเกิดขึ้นได้อย่างไร"
    solution: "ปลวกขนดินมาสร้างจอมปลวกเป็นที่อยู่ จอมปลวกเปลี่ยนรูปพื้นดินในบริเวณนั้น นกกระจาบสานรังและคนสร้างบ้านก็เป็นตัวอย่างเช่นกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.habitats.p012
    topics: [biology.ecology.habitats]
    difficulty: 4
    type: mcq
    stem: "ในสวนดอกไม้ ผึ้งกับดอกไม้พึ่งพากันอย่างไร"
    choices:
      - { id: a, text: "ผึ้งได้น้ำหวานเป็นอาหาร และพาละอองเรณูไปยังดอกอื่น ช่วยให้ดอกติดผล", correct: true }
      - { id: b, text: "ผึ้งได้น้ำหวาน แต่ดอกไม้ไม่ได้อะไรเลย", feedback: "ดอกไม้ได้ประโยชน์ด้วย ผึ้งพาละอองเรณูไปดอกอื่น ทำให้ดอกติดผลและเมล็ด" }
      - { id: c, text: "ดอกไม้กินผึ้งเป็นอาหาร", feedback: "ดอกไม้ทั่วไปไม่ได้กินผึ้ง ทั้งสองได้ประโยชน์จากกัน" }
      - { id: d, text: "ผึ้งทำรังในดอกไม้", feedback: "ผึ้งทำรังบนต้นไม้หรือในโพรง ผึ้งมาที่ดอกเพื่อเก็บน้ำหวาน" }
    hints:
      - "ผึ้งมาที่ดอกไม้เพื่ออะไร"
      - "เมื่อผึ้งบินจากดอกหนึ่งไปอีกดอก มีอะไรติดตัวไปด้วย"
    solution: "ผึ้งได้น้ำหวานจากดอกไม้เป็นอาหาร ส่วนดอกไม้ได้ละอองเรณูจากดอกอื่นที่ติดตัวผึ้งมา ทำให้ติดผลและเมล็ด ทั้งสองจึงพึ่งพากัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.habitats.p013
    topics: [biology.ecology.habitats]
    difficulty: 4
    type: numeric
    stem: "นักเรียนสำรวจสวนหลังโรงเรียน 15 นาที นับได้ มด 25 ตัว ไส้เดือน 4 ตัว ผีเสื้อ 3 ตัว และตั๊กแตน 6 ตัว นับสัตว์ได้ทั้งหมดกี่ตัว"
    answer: { value: 38, unit: ตัว }
    hints:
      - "โจทย์ถามจำนวนตัว ไม่ใช่จำนวนชนิด"
      - "บวกจำนวนตัวของสัตว์ทุกชนิดเข้าด้วยกัน"
    misconceptions:
