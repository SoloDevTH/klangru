  - id: b
    text: 我连都不知道 (wǒ lián dōu bù zhīdào)。
    feedback: 连 (lián) ต้องวางหน้าสิ่งที่เน้น ไม่ใช่หลัง 都 (dōu)
  - id: c
    text: 连都我不知道 (lián dōu wǒ bù zhīdào)。
    feedback: ลำดับคำผิด 连 (lián) ต้องอยู่หน้าคำที่เน้น
  - id: d
    text: 我都连不知道 (wǒ dōu lián bù zhīdào)。
    feedback: 都 (dōu) และ 连 (lián) วางผิดตำแหน่ง ประโยคนี้ไม่ถูกต้อง
  hints:
