    note: อ่านประกาศ ข้อความอิเล็กทรอนิกส์ และป้ายไม่เกิน 200 ตัวอักษร ตอบคำถามใจความและรายละเอียด แต่ไม่ได้วัดความเร็วในการอ่านจริง และเป็นเฉพาะทักษะอ่าน
  - topic: chinese.vocab.daily-life-topics
    indicators: [HSK3.0-L2, HSK3.0-L3]
