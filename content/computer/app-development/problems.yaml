  - id: computer.projects.app-development.p013
    topics: [computer.projects.app-development]
    difficulty: 4
    type: numeric
    stem: "แอปแนะนำให้บ้านหนึ่งเปลี่ยนหลอดไฟ 60 W จำนวน 10 หลอดเป็นหลอด LED 9 W ซึ่งให้แสงใกล้เคียงกัน เปิดวันละ 5 ชั่วโมง 30 วัน ค่าไฟสมมติหน่วยละ 4 บาท จะประหยัดได้เดือนละกี่บาท"
    answer: { value: 306, unit: "บาท" }
    hints:
      - "หลอดหนึ่งลดกำลังไฟฟ้าลง 60 − 9 = 51 W"
      - "พลังงานที่ประหยัด = 10 × 51 × 5 × 30 ÷ 1000 kWh แล้วคูณ 4 บาท"
    misconceptions:
      - { match: 360, feedback: "นี่คือค่าไฟของหลอดเดิมทั้งหมด ยังไม่ได้หักค่าไฟของหลอด LED" }
      - { match: 30.6, feedback: "คิดแค่หลอดเดียว ต้องคูณ 10 หลอด" }
      - { match: 76.5, feedback: "76.5 คือจำนวนหน่วยที่ประหยัด ต้องคูณ 4 บาท" }
    solution: "10 × (60 − 9) × 5 × 30 ÷ 1000 = 76.5 kWh × 4 = 306 บาทต่อเดือน (อัตราสมมติ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.projects.app-development.p014
    topics: [computer.projects.app-development]
    difficulty: 5
    type: mcq
    stem: "แอปสั่งอาหารของโรงอาหารพบปัญหา บางคนได้รายการสั่งซ้ำสองรายการ เพราะเน็ตช้าแล้วผู้ใช้กดปุ่ม \"ส่ง\" ซ้ำ ตัวจัดการเหตุการณ์ของปุ่มบันทึกรายการทุกครั้งที่ถูกเรียก วิธีแก้ใดดีที่สุด"
    choices:
      - { id: a, text: "ปิดการกดปุ่มทันทีที่เริ่มส่ง และให้แต่ละคำสั่งซื้อมีรหัสเฉพาะ เซิร์ฟเวอร์จะไม่บันทึกรหัสเดิมซ้ำ", correct: true }
      - { id: b, text: "เขียนข้อความบนหน้าจอว่า \"กรุณากดครั้งเดียว\"", feedback: "ผู้ใช้ยังกดซ้ำได้เมื่อรอนาน ต้องป้องกันที่โปรแกรม" }
      - { id: c, text: "ลบตัวจัดการของปุ่มส่งออก", feedback: "ปุ่มจะไม่ทำงานเลย" }
      - { id: d, text: "ให้แม่ค้าตรวจและลบรายการซ้ำเองทุกเช้า", feedback: "เพิ่มภาระและพลาดได้ ไม่ได้แก้ต้นเหตุ" }
    hints:
      - "ผู้ใช้ทำเหตุการณ์ในลำดับที่ไม่คาดคิดได้เสมอ"
      - "ป้องกันทั้งฝั่งหน้าจอและฝั่งที่บันทึกข้อมูล"
    solution: "แอปแบบขับเคลื่อนด้วยเหตุการณ์ต้องรับมือเหตุการณ์ซ้ำ การปิดปุ่มระหว่างส่งลดการกดซ้ำ และรหัสคำสั่งซื้อทำให้แม้คำขอถูกส่งซ้ำ ระบบก็บันทึกครั้งเดียว ควรเพิ่มกรณีทดสอบการกดซ้ำด้วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.projects.app-development.p015
    topics: [computer.projects.app-development]
    difficulty: 5
    type: numeric
    stem: "เกมแข่งรถในแอปใช้ตัวจับเวลาส่งเหตุการณ์ tick ทุก 50 มิลลิวินาที ทุก tick รถเลื่อนไปทางขวา 3 พิกเซล ถ้าผู้เล่นไม่กดอะไรเลยเป็นเวลา 10 วินาที รถเลื่อนไปกี่พิกเซล"
    answer: { value: 600, unit: "พิกเซล" }
    hints:
      - "10 วินาทีมีกี่ tick ถ้าเกิดทุก 50 มิลลิวินาที (0.05 วินาที)"
      - "จำนวน tick × 3 พิกเซล"
    misconceptions:
      - { match: 30, feedback: "คิดว่าเกิด tick วินาทีละครั้ง แต่เกิดทุก 0.05 วินาที" }
      - { match: 1500, feedback: "คูณ 50 × 10 × 3 แต่ต้องหาร 10 วินาทีด้วย 0.05 วินาที" }
    solution: "10 ÷ 0.05 = 200 tick × 3 = 600 พิกเซล ถ้าเครื่องช้าจน tick เกิดไม่ครบ รถจะช้าลง เกมจริงจึงมักคำนวณระยะจากเวลาที่ผ่านไปจริง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.projects.app-development.p016
    topics: [computer.projects.app-development]
    difficulty: 5
    type: mcq
    stem: "ครูให้ทำโครงงานที่ใช้แนวคิดเชิงคำนวณ บูรณาการกับวิชาอื่น และเชื่อมโยงกับชีวิตจริง ข้อเสนอใดตรงเกณฑ์ที่สุด"
    choices:
      - { id: a, text: "แอปให้ร้านขายผักในตลาดบันทึกยอดขายรายวัน คำนวณกำไร (คณิตศาสตร์) และพยากรณ์ผักที่ควรสั่งจากข้อมูลย้อนหลัง ทดสอบกับแม่ค้าจริง", correct: true }
      - { id: b, text: "คัดลอกเกมงูจากอินเทอร์เน็ตแล้วเปลี่ยนสี", feedback: "ไม่ได้แก้ปัญหาจริง ไม่ได้บูรณาการกับวิชาอื่น และต้องให้เครดิตด้วย" }
      - { id: c, text: "สไลด์นำเสนอประวัติคอมพิวเตอร์", feedback: "ไม่ได้ใช้แนวคิดเชิงคำนวณสร้างชิ้นงานแก้ปัญหา" }
      - { id: d, text: "โปรแกรมพิมพ์คำว่า สวัสดี 100 ครั้ง", feedback: "ไม่ได้เชื่อมโยงกับปัญหาในชีวิตจริงหรือวิชาอื่น" }
    hints:
      - "ตรวจทีละเกณฑ์: แนวคิดเชิงคำนวณ วิชาอื่น ชีวิตจริง"
      - "ข้อเสนอใดมีผู้ใช้จริงและใช้ข้อมูลแก้ปัญหา"
    solution: "ข้อ a แยกปัญหา (บันทึก คำนวณ พยากรณ์) ใช้คณิตศาสตร์คิดกำไรและดูแนวโน้มจากข้อมูล แก้ปัญหาของแม่ค้าจริง และทดสอบกับผู้ใช้ จึงตรงทั้งสามเกณฑ์"
    license: CC-BY-SA-4.0
    ai_assisted: true
