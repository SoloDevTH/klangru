<circle cx="68.0" cy="218.0" r="6.0" fill="#15211e" stroke="#15211e" stroke-width="1"/>
<circle cx="106.0" cy="218.0" r="6.0" fill="#15211e" stroke="#15211e" stroke-width="1"/>
<text x="85.0" y="176.0" text-anchor="middle" font-size="12" fill="#1f5f8b">รถ 60 กม./ชม.</text>
<rect x="390.1" y="160.0" width="14.0" height="60.0" rx="0" fill="#ffffff" stroke="#b3261e" stroke-width="2.5"/>
