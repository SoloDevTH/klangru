<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220" font-family="sans-serif">
<title>แผนภาพบล็อกของวงปิด สัญญาณอ้างอิง r ลบด้วยสัญญาณป้อนกลับ H(s)y ได้ค่าคลาดเคลื่อน e ส่งเข้าตัวควบคุม C(s) เป็นสัญญาณ u แล้วเข้ากระบวนการ G(s) ได้เอาต์พุต y ซึ่งถูกวัดกลับมาผ่าน H(s)</title>
<rect width="560" height="220" fill="#ffffff"/>
<line x1="12" y1="90" x2="44" y2="90" stroke="#222" stroke-width="2"/>
<polygon points="44,90 36,85 36,95" fill="#222"/>
<text x="16" y="82" font-size="15" fill="#222">r</text>
<circle cx="60" cy="90" r="16" fill="none" stroke="#222" stroke-width="2"/>
<text x="48" y="96" font-size="16" fill="#222">+</text>
<text x="63" y="97" font-size="16" fill="#8a3b2b">−</text>
<line x1="76" y1="90" x2="108" y2="90" stroke="#222" stroke-width="2"/>
<polygon points="108,90 100,85 100,95" fill="#222"/>
<text x="82" y="82" font-size="15" fill="#222">e</text>
<rect x="110" y="62" width="90" height="56" fill="#eaf1fb" stroke="#1f5fa8" stroke-width="2"/>
<text x="155" y="96" font-size="17" text-anchor="middle" fill="#1f5fa8">C(s)</text>
<line x1="200" y1="90" x2="244" y2="90" stroke="#222" stroke-width="2"/>
<polygon points="244,90 236,85 236,95" fill="#222"/>
<text x="208" y="82" font-size="15" fill="#222">u</text>
<rect x="246" y="62" width="110" height="56" fill="#eaf4ea" stroke="#2e6b2e" stroke-width="2"/>
<text x="301" y="96" font-size="17" text-anchor="middle" fill="#2e6b2e">G(s)</text>
<line x1="356" y1="90" x2="462" y2="90" stroke="#222" stroke-width="2"/>
<polygon points="462,90 454,85 454,95" fill="#222"/>
<text x="400" y="82" font-size="15" fill="#222">y</text>
<circle cx="420" cy="90" r="3.5" fill="#222"/>
<line x1="420" y1="90" x2="420" y2="180" stroke="#222" stroke-width="2"/>
<line x1="420" y1="180" x2="368" y2="180" stroke="#222" stroke-width="2"/>
<polygon points="360,180 368,175 368,185" fill="#222"/>
<rect x="250" y="160" width="110" height="40" fill="#f8e9e6" stroke="#8a3b2b" stroke-width="2"/>
<text x="305" y="186" font-size="17" text-anchor="middle" fill="#8a3b2b">H(s)</text>
<line x1="250" y1="180" x2="60" y2="180" stroke="#222" stroke-width="2"/>
<line x1="60" y1="180" x2="60" y2="106" stroke="#222" stroke-width="2"/>
<polygon points="60,106 55,114 65,114" fill="#222"/>
<text x="430" y="150" font-size="13" fill="#555">วงป้อนกลับ</text>
</svg>
