  topics:
  - math.de.transfer-functions
  difficulty: 4
  type: numeric
  stem: 'ฟังก์ชันถ่ายโอน $W(s)=\dfrac{1}{s^2+0.6s+1}$ มีค่าเกน $|W(i\omega)|$ สูงสุดที่ความถี่ $\omega$ เท่าใด (ตอบทศนิยม 4 ตำแหน่ง)'
  answer:
    value: 0.9055
    tolerance: 0.0001
  hints:
  - ในรูปมาตรฐาน $\omega_n = 1$ และ $2\zeta = 0.6$ จึงได้ $\zeta = 0.3$
  - ความถี่ที่เกนสูงสุดคือ $\omega_n\sqrt{1-2\zeta^2}$
  misconceptions:
