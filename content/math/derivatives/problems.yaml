  - id: math.der.p018
    topics: [math.calculus.derivative]
    difficulty: 3
    type: numeric
    stem: "หุ่นยนต์ในการแข่งขันของโรงเรียนวิ่งบนรางตรง ตำแหน่งคือ $s(t) = t^3 - 6t^2 + 9t$ เมตร เมื่อเวลา $t$ วินาที ความเร่งของหุ่นยนต์ที่ $t = 3$ วินาทีเป็นกี่ $\\mathrm{m/s^2}$"
    answer: { value: 6, unit: "m/s²" }
    hints:
      - "ความเร็ว $v(t) = s'(t)$ และความเร่ง $a(t) = v'(t)$ คืออนุพันธ์อันดับสองของตำแหน่ง"
      - "หา $v(t)$ ก่อน แล้วหาอนุพันธ์อีกครั้ง จากนั้นแทน $t = 3$"
    misconceptions:
      - { match: 0, feedback: "ที่ $t = 3$ ทั้งตำแหน่ง $s(3)$ และความเร็ว $v(3) = 27 - 36 + 9$ เป็น 0 แต่ความเร่งต้องหาอนุพันธ์อีกครั้งเป็น $a(t)$ แล้วจึงแทนค่า" }
    solution: "$v(t) = 3t^2 - 12t + 9$ และ $a(t) = 6t - 12$ ที่ $t = 3$: $a(3) = 18 - 12 = 6\\ \\mathrm{m/s^2}$ ขณะนั้นหุ่นยนต์หยุดนิ่งชั่วขณะ ($v = 0$) แต่ความเร่งเป็นบวก จึงกำลังจะเริ่มเคลื่อนที่ไปข้างหน้าอีกครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.der.p019
    topics: [math.calculus.derivative]
    difficulty: 4
    type: numeric
    stem: "หาค่าสูงสุดของ $f(x) = x^3 - 3x$ บนช่วง $0 \\le x \\le 3$"
    answer: { value: 18 }
    hints:
      - "บนช่วงปิด ค่าสูงสุดอาจอยู่ที่จุดที่ $f'(x) = 0$ หรือที่ปลายช่วง"
      - "หาจุดที่ $f'(x) = 3x^2 - 3 = 0$ ที่อยู่ในช่วง แล้วเทียบค่า $f$ ที่จุดนั้นกับที่ $x = 0$ และ $x = 3$"
    misconceptions:
      - { match: 2, feedback: "$f(-1) = 2$ เป็นค่าสูงสุดสัมพัทธ์ แต่ $x = -1$ อยู่นอกช่วง $0 \\le x \\le 3$ และปลายช่วง $x = 3$ ให้ค่ามากกว่า" }
      - { match: -2, feedback: "$f(1) = -2$ เป็นค่าต่ำสุดในช่วงนี้ ไม่ใช่ค่าสูงสุด" }
    solution: "$f'(x) = 3x^2 - 3 = 0$ ได้ $x = \\pm 1$ ในช่วงมีเพียง $x = 1$: $f(1) = -2$ ปลายช่วง $f(0) = 0$ และ $f(3) = 27 - 9 = 18$ ค่าสูงสุดคือ 18 (ที่ปลายช่วง $x = 3$) ส่วนค่าต่ำสุดคือ $-2$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.der.p020
    topics: [math.calculus.derivative]
    difficulty: 5
    type: numeric
    stem: "ร้านขนมพับกล่องไม่มีฝาจากกระดาษแข็งรูปสี่เหลี่ยมจัตุรัสด้านละ $30\\ \\mathrm{cm}$ โดยตัดสี่เหลี่ยมจัตุรัสด้านละ $x$ เซนติเมตรออกที่มุมทั้งสี่ แล้วพับขอบขึ้น กล่องจะจุได้มากที่สุดกี่ลูกบาศก์เซนติเมตร"
    figure: { src: box-net.svg, alt: "แผ่นกระดาษสี่เหลี่ยมจัตุรัสด้านละ 30 cm ที่มุมทั้งสี่มีสี่เหลี่ยมจัตุรัสเส้นประด้านละ x ที่จะตัดออก และมีเส้นประด้านในแสดงแนวพับขอบขึ้น" }
    answer: { value: 2000, unit: "cm³" }
    hints:
      - "หลังพับ กล่องสูง $x$ ฐานเป็นสี่เหลี่ยมจัตุรัสยาว $30 - 2x$ จึงมีปริมาตร $V(x) = x(30 - 2x)^2$ โดย $0 < x < 15$"
      - "หา $V'(x)$ แล้วแก้ $V'(x) = 0$ (แยกตัวประกอบได้ $12(x - 5)(x - 15)$)"
      - "เลือกค่า $x$ ที่อยู่ในช่วงที่เป็นไปได้ แล้วแทนกลับใน $V(x)$"
    misconceptions:
      - { match: 5, feedback: "นั่นคือขนาดที่ควรตัด $x = 5$ ยังต้องนำไปหาปริมาตร $V(5)$" }
      - { match: 4000, feedback: "ดูเหมือนใช้ฐานยาว $30 - x$ แทน $30 - 2x$ แต่ตัดออกทั้งสองข้างของแต่ละด้าน ฐานจึงสั้นลง $2x$" }
    solution: "$V(x) = x(30 - 2x)^2 = 4x^3 - 120x^2 + 900x$ ได้ $V'(x) = 12x^2 - 240x + 900 = 12(x - 5)(x - 15)$ ค่า $x = 15$ ทำให้ฐานหายไป ($V = 0$) จึงใช้ $x = 5$ ตรวจ: $V'$ เปลี่ยนจากบวกเป็นลบที่ $x = 5$ เป็นจุดสูงสุด ปริมาตร $V(5) = 5 \\times 20^2 = 2000\\ \\mathrm{cm^3}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

