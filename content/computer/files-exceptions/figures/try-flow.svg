<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="sans-serif">
  <title>ลำดับการทำงานของ try except else finally ถ้าไม่มีข้อผิดพลาดจะไปทาง else แล้ว finally ถ้ามีข้อผิดพลาดจะไปทาง except แล้ว finally</title>
  <rect x="0" y="0" width="640" height="300" fill="#ffffff"/>
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker></defs>
  <rect x="20" y="120" width="150" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="95.0" y="156.0" font-size="15" text-anchor="middle" fill="#1f2937" font-family="monospace">try</text>
  <rect x="250" y="40" width="150" height="60" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="325.0" y="76.0" font-size="15" text-anchor="middle" fill="#1f2937" font-family="monospace">else</text>
  <rect x="250" y="200" width="150" height="60" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="325.0" y="236.0" font-size="15" text-anchor="middle" fill="#1f2937" font-family="monospace">except</text>
  <rect x="470" y="120" width="150" height="60" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="545.0" y="156.0" font-size="15" text-anchor="middle" fill="#1f2937" font-family="monospace">finally</text>
  <line x1="170" y1="140" x2="250" y2="80" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="205" y="98" font-size="13" text-anchor="end" fill="#374151">ไม่มีข้อผิดพลาด</text>
  <line x1="170" y1="160" x2="250" y2="225" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="205" y="240" font-size="13" text-anchor="end" fill="#374151">มีข้อผิดพลาด</text>
  <line x1="400" y1="70" x2="470" y2="135" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="400" y1="230" x2="470" y2="165" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="320" y="285" font-size="14" text-anchor="middle" fill="#6b7280">finally ทำงานทุกครั้ง ทั้งสองทาง</text>
</svg>
