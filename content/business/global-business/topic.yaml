lessons:
- type: explanation
  file: lesson.md
- type: figure
  src: pestel.svg
  alt: วงกลมกลางเขียนว่าธุรกิจ (องค์กร) ล้อมด้วยกล่องหกกล่อง P การเมือง (เสถียรภาพ นโยบายการค้า) E เศรษฐกิจ (GDP ดอกเบี้ย อัตราแลกเปลี่ยน) S สังคมและวัฒนธรรม (ค่านิยม ภาษา ประชากร) T เทคโนโลยี (อินเทอร์เน็ต การชำระเงิน) E สิ่งแวดล้อม (สภาพอากาศ มาตรฐานสีเขียว) L กฎหมาย (ภาษี แรงงาน ข้อมูลส่วนบุคคล) ด้านล่างเขียนว่าบวกปัจจัยต่างประเทศ ความตกลงการค้า ค่าเงิน ความขัดแย้งระหว่างประเทศ
  caption: ปัจจัยภายนอกหกด้านที่ธุรกิจต้องวิเคราะห์
- type: check
  problem: business.international.global-business.p001
  prompt: ค่าเงินอยู่ในด้านใด
- type: figure
  src: entry-modes.svg
  alt: แผนภาพขั้นบันไดห้าขั้นจากซ้ายไปขวา สูงขึ้นทีละขั้น ส่งออก (ผ่านตัวแทนหรือออนไลน์) ให้สิทธิ licensing (ให้ใช้สิทธิบัตรหรือตราสินค้า) แฟรนไชส์ (ขายระบบธุรกิจ) กิจการร่วมค้า (ร่วมทุนกับบริษัทท้องถิ่น) บริษัทลูก 100% (ลงทุนโดยตรง FDI) ลูกศรด้านล่างชี้ไปทางขวา เขียนว่าเงินลงทุน การควบคุม และความเสี่ยงสูงขึ้น
  caption: ยิ่งลงทุนมาก ยิ่งควบคุมได้มาก และเสี่ยงมากขึ้น
- type: figure
  src: exchange-rate.svg
  alt: กราฟเส้นอัตราแลกเปลี่ยนบาทต่อดอลลาร์สหรัฐรายเดือนของปีสมมติ ม.ค. 35.8 ก.พ. 36.0 แล้วลดลงต่อเนื่องถึง ก.ค. 33.0 จากนั้นเพิ่มขึ้นถึง พ.ย. 35.2 และ ธ.ค. 35.0 ป้ายช่วงที่ตัวเลขลดลงเขียนว่าบาทแข็งค่า ช่วงที่ตัวเลขเพิ่มขึ้นเขียนว่าบาทอ่อนค่า
  caption: ตัวเลขบาทต่อดอลลาร์ลดลงแปลว่าบาทแข็งค่า
- type: worked-example
  title: ความเสี่ยงจากธุรกรรมและสัญญาล่วงหน้า
  problem: ผู้ส่งออกข้าว (สมมติ) ขายสินค้า $50{,}000$ ดอลลาร์ รับเงินใน 90 วัน วันนี้อัตรา $34.00$ บาท ธนาคารเสนอสัญญาล่วงหน้า $33.80$ บาท ถ้าวันรับเงินอัตราตลาดเป็น $32.50$ หรือ $35.00$ บาท ผลต่างกันอย่างไร
  steps:
  - text: 'ไม่ป้องกัน อัตรา $32.50$: ได้ $50{,}000 \times 32.50 = 1{,}625{,}000$ บาท'
  - text: 'ไม่ป้องกัน อัตรา $35.00$: ได้ $1{,}750{,}000$ บาท'
    why: ผลลัพธ์ขึ้นกับค่าเงินที่ยังไม่รู้
  - text: 'ทำสัญญาล่วงหน้า: ได้ $50{,}000 \times 33.80 = 1{,}690{,}000$ บาท ทั้งสองกรณี'
  - text: ถ้าบาทแข็งเป็น $32.50$ สัญญาช่วยได้ $65{,}000$ บาท ถ้าบาทอ่อนเป็น $35.00$ พลาดโอกาส $60{,}000$ บาท
    why: สัญญาล่วงหน้าแลกโอกาสได้กำไรกับความแน่นอน
  answer: สัญญาล่วงหน้าให้ $1{,}690{,}000$ บาทแน่นอน
- type: check
  problem: business.international.global-business.p006
  prompt: ลูกค้าขายดอลลาร์ ธนาคารรับซื้อ
- type: worked-example
  title: อัตราไขว้และการตั้งราคาขายออนไลน์
  problem: ร้านไทยจะขายสินค้าให้ลูกค้าญี่ปุ่น ต้องการรายได้ $510$ บาทต่อชิ้น อัตรา (สมมติ) 1 ดอลลาร์ $= 34$ บาท และ $= 150$ เยน ควรตั้งราคากี่เยน
  steps:
  - text: 'อัตราไขว้: 1 เยน $= 34 / 150 \approx 0.2267$ บาท'
    why: ดอลลาร์เป็นสกุลร่วม
  - text: ราคาเป็นเยน $= 510 / 0.2267 = 510 \times 150 / 34 = 2{,}250$ เยน
  - text: 'ตรวจ: $2{,}250$ เยน $= 15$ ดอลลาร์ $= 510$ บาท'
  answer: $2{,}250$ เยน
glossary:
- term: PESTEL
  definition: กรอบวิเคราะห์สภาพแวดล้อมภายนอกหกด้าน การเมือง เศรษฐกิจ สังคม เทคโนโลยี สิ่งแวดล้อม กฎหมาย
- term: โลกาภิวัตน์
  definition: การเชื่อมโยงการค้า การลงทุน เทคโนโลยี ข้อมูล และผู้คนข้ามประเทศมากขึ้น
- term: บริษัทข้ามชาติ
  definition: บริษัทที่ดำเนินงานหรือมีการลงทุนในหลายประเทศ
- term: การลงทุนโดยตรงจากต่างประเทศ (FDI)
  definition: การลงทุนตั้งหรือถือกิจการในต่างประเทศโดยมีอำนาจควบคุม
- term: ตลาดเกิดใหม่
  definition: ประเทศที่เศรษฐกิจกำลังโตเร็วและเปิดสู่ตลาดโลก แต่สถาบันและตลาดการเงินยังพัฒนาไม่เต็มที่
- term: อัตราแลกเปลี่ยน
  definition: ราคาของเงินสกุลหนึ่งในหน่วยของอีกสกุลหนึ่ง
- term: อัตราไขว้
  definition: อัตราแลกเปลี่ยนระหว่างสองสกุลที่คำนวณผ่านสกุลที่สาม
- term: ลอยตัวภายใต้การจัดการ
  definition: ระบบที่ตลาดกำหนดค่าเงิน แต่ธนาคารกลางเข้าดูแลเมื่อผันผวนมาก
- term: สัญญาซื้อขายเงินตราล่วงหน้า
  definition: สัญญาตกลงอัตราแลกเปลี่ยนวันนี้สำหรับการส่งมอบเงินในอนาคต
