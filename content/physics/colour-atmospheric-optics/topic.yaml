id: physics.light.colour-atmospheric-optics
subject: physics
title: { th: สีและปรากฏการณ์ของแสงในธรรมชาติ, en: Colour and atmospheric optics }
summary: การเห็นสี สีของวัตถุ แผ่นกรองแสงสี การผสมแสงสีและสารสี ตาบอดสี และปรากฏการณ์ธรรมชาติ ได้แก่ สีของท้องฟ้า รุ้ง การทรงกลด และมิราจ
difficulty: 4.5
minutes: 40
prerequisites: [physics.light.refraction]
encompasses:
  - { id: physics.light.refraction, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ผสมแสงสีกับผสมสารสี
    src: colour-mixing.svg
    alt: "สองภาพเคียงกัน ภาพซ้ายชื่อผสมแสงสี บนพื้นดำมีวงกลมแสงสีแดง เขียว น้ำเงินซ้อนกัน ส่วนที่แดงซ้อนเขียวเป็นสีเหลือง เขียวซ้อนน้ำเงินเป็นสีฟ้าอมเขียว แดงซ้อนน้ำเงินเป็นสีม่วงแดง ตรงกลางที่ซ้อนครบสามสีเป็นสีขาว ภาพขวาชื่อผสมสารสี บนพื้นขาวมีวงกลมสีฟ้าอมเขียว ม่วงแดง เหลืองซ้อนกัน ส่วนที่ฟ้าอมเขียวซ้อนม่วงแดงเป็นสีน้ำเงิน ฟ้าอมเขียวซ้อนเหลืองเป็นสีเขียว ม่วงแดงซ้อนเหลืองเป็นสีแดง ตรงกลางที่ซ้อนครบสามสีเป็นสีดำ"
    caption: "แม่สีของแสงคือแดง เขียว น้ำเงิน ส่วนแม่สีของสารสีคือฟ้าอมเขียว ม่วงแดง เหลือง สีที่ซ้อนกันของฝั่งหนึ่งคือแม่สีของอีกฝั่ง"
  - type: worked-example
    title: ธงชาติไทยใต้แสงสีแดง
    problem: "ธงชาติไทยมีแถบสีแดง ขาว และน้ำเงิน ถ้าส่องธงในห้องมืดด้วยแสงสีแดงล้วน แต่ละแถบจะเห็นเป็นสีอะไร"
    steps:
      - text: "แถบสีแดงสะท้อนแสงสีแดง แสงที่ส่องเป็นสีแดง จึงสะท้อนกลับมาได้ เห็นเป็นสีแดง"
      - text: "แถบสีขาวสะท้อนแสงทุกสี แต่มีแสงสีแดงสีเดียวให้สะท้อน จึงเห็นเป็นสีแดงเช่นกัน"
        why: "วัตถุสีขาวไม่ได้ขาวในตัวเอง แต่สะท้อนแสงทุกสีที่ส่องมา"
      - text: "แถบสีน้ำเงินสะท้อนแสงสีน้ำเงินและดูดกลืนแสงสีแดง จึงไม่มีแสงสะท้อนเข้าตา เห็นเป็นสีดำ"
      - text: "สรุป: แถบแดงกับแถบขาวดูเหมือนกัน แยกไม่ออก ส่วนแถบน้ำเงินดูดำ"
    answer: "แดง → แดง ขาว → แดง น้ำเงิน → ดำ"
  - { type: check, problem: physics.light.colour-atmospheric-optics.p003, prompt: "ลองใช้หลักเดียวกัน" }
  - type: figure
    title: สีของท้องฟ้าตอนเที่ยงและตอนเย็น
    src: sky-colour.svg
    alt: "ภาพตัดผิวโลกโค้ง มีเส้นประเป็นขอบบรรยากาศ ผู้สังเกตยืนบนผิวโลก ลูกศรสีเหลืองจากด้านบนลงมาตรง ๆ แทนแสงตอนเที่ยง ผ่านอากาศระยะสั้น ป้ายบอกว่าฟ้าเป็นสีฟ้า ดวงอาทิตย์ขาวอมเหลือง ลูกศรสีส้มแนวนอนจากซ้ายแทนแสงตอนดวงอาทิตย์ตก ผ่านอากาศระยะยาวมาก ระหว่างทางมีลูกศรสีน้ำเงินเล็ก ๆ ชี้ออกด้านข้างแทนแสงสีน้ำเงินที่ถูกกระเจิงออก เหลือสีแดงส้มมาถึงผู้สังเกต"
    caption: "ตอนเย็นแสงผ่านบรรยากาศยาวกว่าตอนเที่ยงมาก สีน้ำเงินจึงถูกกระเจิงออกจากลำแสงเกือบหมด"
  - type: figure
    title: ทางเดินของแสงในหยดน้ำฝน
    src: raindrop.svg
    alt: "หยดน้ำกลม แสงอาทิตย์สีขาวเข้ามาทางซ้ายบนในแนวนอน หักเหเข้าหยดน้ำ ไปสะท้อนที่ผิวด้านหลังทางขวา แล้วลงมาหักเหออกที่ด้านล่างซ้าย แยกเป็นสีแดงและสีม่วงที่ออกมาในมุมต่างกันเล็กน้อย มีเส้นประแนวขนานกับแสงอาทิตย์ที่จุดออก และมุมระหว่างแสงสีแดงที่ออกกับเส้นนี้ประมาณ 42 องศา แสงสีม่วงประมาณ 40.6 องศา"
    caption: "แสงแต่ละสีออกจากหยดน้ำในมุมต่างกัน (วาดตามการคำนวณด้วยดรรชนีหักเหของน้ำ 1.331 สำหรับแดงและ 1.343 สำหรับม่วง)"
  - type: worked-example
    title: รุ้งจะอยู่สูงเท่าใด
    problem: "ตอนเช้าดวงอาทิตย์อยู่สูงจากขอบฟ้า $20^\\circ$ และมีฝนตกทางทิศตะวันตก ยอดรุ้งปฐมภูมิ (ขอบสีแดง) อยู่สูงจากขอบฟ้ากี่องศา และอยู่ทางทิศใด"
    steps:
      - text: "รุ้งเป็นวงกลมรัศมีประมาณ $42^\\circ$ รอบจุดตรงข้ามดวงอาทิตย์"
        why: "แสงที่ออกจากหยดน้ำแล้วทำมุม $42^\\circ$ กับแนวแสงอาทิตย์ย้อนกลับเท่านั้นจึงเข้าตาเป็นสีแดงของรุ้ง"
      - text: "ดวงอาทิตย์อยู่ทางตะวันออกสูง $20^\\circ$ จุดตรงข้ามดวงอาทิตย์จึงอยู่ทางตะวันตก ต่ำกว่าขอบฟ้า $20^\\circ$"
      - text: "ยอดรุ้งสูง $= -20^\\circ + 42^\\circ = 22^\\circ$ เหนือขอบฟ้า"
      - text: "ตรวจ: ม่านฝนอยู่ทางตะวันตก ตรงกับฝั่งที่รุ้งเกิด จึงเห็นรุ้งได้"
    answer: "ยอดรุ้งสูงประมาณ $22^\\circ$ อยู่ทางทิศตะวันตก"
  - { type: check, problem: physics.light.colour-atmospheric-optics.p006, prompt: "ใช้แนวคิดเรื่องจุดตรงข้ามดวงอาทิตย์" }
  - type: figure
    title: มิราจบนถนนร้อน
    src: mirage.svg
    alt: "ถนนสีเทาด้านล่าง เหนือถนนเป็นแถบอากาศร้อนสีส้มจาง มีป้ายว่าอากาศใกล้ผิวถนนร้อนกว่า ดรรชนีหักเหน้อยกว่า เส้นสีน้ำเงินแทนแสงจากท้องฟ้าด้านซ้ายบนโค้งลงมาเกือบแตะผิวถนน แล้วโค้งขึ้นเข้าตาผู้สังเกตทางขวา เส้นประจากตาย้อนกลับเป็นเส้นตรงลงไปที่ผิวถนน แสดงว่าผู้สังเกตเห็นภาพท้องฟ้าบนถนนเหมือนมีน้ำ"
    caption: "แสงโค้งขึ้นในอากาศร้อน แต่สมองคิดว่าแสงมาเป็นเส้นตรง จึงเห็นท้องฟ้าอยู่บนถนน"
  - type: simulation
    title: การมองเห็นสี (PhET Color Vision)
    url: https://phet.colorado.edu/en/simulations/color-vision
    provider: phet
    note: "หน้า RGB Bulbs: เปิดไฟสีแดงกับสีเขียวพร้อมกัน แล้วดูว่าคนในภาพเห็นสีอะไร หน้า Single Bulb: ใส่แผ่นกรองแสงสี แล้วลองเปลี่ยนสีของหลอดไฟว่าแสงสีใดผ่านแผ่นกรองได้"
glossary:
  - { term: เซลล์รูปกรวย, definition: "เซลล์รับแสงในจอตาที่แยกสีได้ มีสามชนิด ไวต่อแสงสีแดง เขียว และน้ำเงิน" }
  - { term: แผ่นกรองแสงสี, definition: "แผ่นโปร่งใสที่ให้แสงสีของตัวเองผ่านและดูดกลืนแสงสีอื่น" }
  - { term: แม่สีของแสง, definition: "แดง เขียว น้ำเงิน ผสมกันครบได้แสงขาว" }
  - { term: แม่สีของสารสี, definition: "ฟ้าอมเขียว ม่วงแดง เหลือง ผสมกันครบได้สีดำหรือเกือบดำ" }
  - { term: ตาบอดสี, definition: "ภาวะที่เซลล์รูปกรวยบางชนิดขาดหรือทำงานผิดปกติ ทำให้แยกบางสีไม่ได้ ส่วนใหญ่ถ่ายทอดทางพันธุกรรม" }
  - { term: การกระเจิงของแสง, definition: "การที่อนุภาคเล็ก ๆ ทำให้แสงเบนออกไปหลายทิศ โมเลกุลอากาศกระเจิงแสงความยาวคลื่นสั้นได้มากกว่า" }
  - { term: การทรงกลด, definition: "วงแสงรัศมีประมาณ 22 องศารอบดวงอาทิตย์หรือดวงจันทร์ เกิดจากแสงหักเหผ่านผลึกน้ำแข็งในเมฆชั้นสูง" }
  - { term: มิราจ, definition: "ภาพที่เกิดเพราะแสงหักเหโค้งในอากาศที่มีอุณหภูมิต่างกัน เช่น เห็นท้องฟ้าบนถนนร้อนเหมือนแอ่งน้ำ" }
flashcards:
  - { front: "ผสมแสงสี: แดง + เขียว + น้ำเงิน", back: "ขาว (แดง + เขียว = เหลือง)" }
  - { front: "ผสมสารสี: ฟ้าอมเขียว + เหลือง", back: "เขียว (ผสมครบสามแม่สีได้ดำ)" }
  - { front: "ทำไมฟ้าเป็นสีฟ้า และตอนเย็นเป็นสีแดง", back: "อากาศกระเจิงแสงสีน้ำเงินมากกว่า (แปรผกผันกับ $\\lambda^4$) ตอนเย็นแสงผ่านอากาศยาว สีน้ำเงินถูกกระเจิงออกหมด" }
  - { front: "รุ้งปฐมภูมิเกิดอย่างไร อยู่ที่ไหน", back: "หักเหเข้า สะท้อนหนึ่งครั้ง หักเหออกจากหยดน้ำ อยู่ประมาณ 42° รอบจุดตรงข้ามดวงอาทิตย์ แดงอยู่นอก" }
  - { front: "การทรงกลดกับมิราจเกิดจากอะไร", back: "ทรงกลด: แสงหักเหผ่านผลึกน้ำแข็งหกเหลี่ยม (ประมาณ 22°) มิราจ: แสงโค้งในอากาศที่ร้อนไม่เท่ากัน" }
