<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="sans-serif" font-size="14">
  <title>ชั้นนามธรรมของหม้อหุงข้าวดิจิทัล จากบนลงล่าง ผู้ใช้ โปรแกรมหลัก ไลบรารีของบอร์ด และวงจรอิเล็กทรอนิกส์ แต่ละชั้นใช้บริการของชั้นล่างโดยไม่ต้องรู้รายละเอียด</title>
  <defs><marker id="ah6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="760" height="340" fill="#ffffff"/>
  <rect x="20.0" y="20.0" width="560.0" height="62.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="36.0" y="46.0" font-size="16" text-anchor="start" fill="#1f2937" font-weight="bold" xml:space="preserve">ผู้ใช้</text>
  <text x="36.0" y="69.0" font-size="14" text-anchor="start" fill="#1f2937" xml:space="preserve">กดปุ่ม หุง แล้วรอไฟเปลี่ยนเป็น อุ่น</text>
  <rect x="20.0" y="98.0" width="560.0" height="62.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="36.0" y="124.0" font-size="16" text-anchor="start" fill="#1f2937" font-weight="bold" xml:space="preserve">โปรแกรมหลัก</text>
  <text x="36.0" y="147.0" font-size="14" text-anchor="start" fill="#1f2937" font-family="monospace" xml:space="preserve">t = read_temperature()  ถ้า t &gt; 100 → ลดไฟ</text>
  <rect x="20.0" y="176.0" width="560.0" height="62.0" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="36.0" y="202.0" font-size="16" text-anchor="start" fill="#1f2937" font-weight="bold" xml:space="preserve">ไลบรารีของบอร์ด</text>
  <text x="36.0" y="225.0" font-size="14" text-anchor="start" fill="#1f2937" xml:space="preserve">สั่ง ADC อ่านแรงดัน แล้วแปลงเป็นองศา</text>
  <rect x="20.0" y="254.0" width="560.0" height="62.0" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="36.0" y="280.0" font-size="16" text-anchor="start" fill="#1f2937" font-weight="bold" xml:space="preserve">วงจรอิเล็กทรอนิกส์</text>
  <text x="36.0" y="303.0" font-size="14" text-anchor="start" fill="#1f2937" xml:space="preserve">เซนเซอร์เปลี่ยนความร้อนเป็นแรงดันไฟฟ้า</text>
  <line x1="640.0" y1="40.0" x2="640.0" y2="290.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah6b7280)"/>
  <text x="655.0" y="60.0" font-size="14" text-anchor="start" fill="#6b7280" font-weight="bold" xml:space="preserve">ซ่อน</text>
  <text x="655.0" y="80.0" font-size="14" text-anchor="start" fill="#6b7280" font-weight="bold" xml:space="preserve">รายละเอียด</text>
  <text x="655.0" y="250.0" font-size="14" text-anchor="start" fill="#6b7280" xml:space="preserve">รายละเอียด</text>
  <text x="655.0" y="270.0" font-size="14" text-anchor="start" fill="#6b7280" xml:space="preserve">มากขึ้น</text>
  <text x="20.0" y="335.0" font-size="13" text-anchor="start" fill="#6b7280" xml:space="preserve">แต่ละชั้นเรียกใช้ชั้นที่อยู่ล่างลงไป โดยไม่ต้องรู้ว่าชั้นนั้นทำงานอย่างไร</text>
</svg>
