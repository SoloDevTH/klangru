problems:
  - id: physics.waves.em-spectrum-intro.p001
    topics: [physics.waves.em-spectrum-intro]
    difficulty: 1
    type: order
    stem: "เรียงคลื่นแม่เหล็กไฟฟ้าจากความยาวคลื่นยาวที่สุดไปสั้นที่สุด"
    items:
      - "คลื่นวิทยุ"
      - "ไมโครเวฟ"
      - "อินฟราเรด"
      - "แสงที่มองเห็น"
      - "อัลตราไวโอเลต"
      - "รังสีเอกซ์"
      - "รังสีแกมมา"
    hints:
      - "คลื่นวิทยุยาวที่สุด รังสีแกมมาสั้นที่สุด"
      - "อินฟราเรดอยู่ถัดจากแสงสีแดง อัลตราไวโอเลตอยู่ถัดจากแสงสีม่วง"
    solution: "คลื่นวิทยุ → ไมโครเวฟ → อินฟราเรด → แสงที่มองเห็น → อัลตราไวโอเลต → รังสีเอกซ์ → รังสีแกมมา (ความถี่และพลังงานเพิ่มขึ้นตามลำดับนี้)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.em-spectrum-intro.p002
    topics: [physics.waves.em-spectrum-intro]
    difficulty: 1
    type: mcq
    stem: "คลื่นชนิดใดเดินทางจากดวงอาทิตย์ผ่านอวกาศซึ่งเกือบเป็นสุญญากาศมาถึงโลกได้"
    choices:
      - { id: a, text: "แสงและคลื่นแม่เหล็กไฟฟ้าอื่น ๆ", correct: true }
      - { id: b, text: "เสียงจากการระเบิดบนดวงอาทิตย์", feedback: "เสียงต้องอาศัยตัวกลาง อวกาศเกือบไม่มีอนุภาคให้สั่นส่งต่อ เสียงจึงมาไม่ถึง" }
      - { id: c, text: "คลื่นน้ำ", feedback: "คลื่นน้ำต้องมีน้ำเป็นตัวกลาง ในอวกาศไม่มี" }
    hints:
      - "คลื่นชนิดใดไม่ต้องอาศัยตัวกลาง"
      - "เรามองเห็นดวงอาทิตย์ได้ แต่ได้ยินเสียงจากดวงอาทิตย์หรือไม่"
    solution: "คลื่นแม่เหล็กไฟฟ้า รวมทั้งแสง เดินทางในสุญญากาศได้ ส่วนเสียงและคลื่นน้ำต้องมีตัวกลาง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.em-spectrum-intro.p003
    topics: [physics.waves.em-spectrum-intro]
    difficulty: 2
    type: match
    stem: "จับคู่การใช้ประโยชน์กับชนิดของคลื่นแม่เหล็กไฟฟ้า"
    pairs:
      - { left: "รีโมตเปลี่ยนช่องทีวี", right: "อินฟราเรด" }
      - { left: "อุ่นข้าวกล่องในร้านสะดวกซื้อ", right: "ไมโครเวฟ" }
      - { left: "ถ่ายภาพกระดูกที่หัก", right: "รังสีเอกซ์" }
      - { left: "ฟังสถานีวิทยุ FM", right: "คลื่นวิทยุ" }
      - { left: "ส่องลายน้ำเรืองแสงตรวจธนบัตร", right: "อัลตราไวโอเลต" }
      - { left: "ฉายรังสีรักษามะเร็ง", right: "รังสีแกมมา" }
    hints:
      - "เตาที่อุ่นอาหารมีชื่อเดียวกับคลื่นที่ใช้"
      - "เครื่องตรวจธนบัตรใช้แสงสีม่วงที่ทำให้หมึกพิเศษเรืองแสง"
    solution: "รีโมต → อินฟราเรด เตาอุ่นอาหาร → ไมโครเวฟ ภาพกระดูก → รังสีเอกซ์ วิทยุ FM → คลื่นวิทยุ ตรวจธนบัตร → อัลตราไวโอเลต รักษามะเร็ง → รังสีแกมมา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.em-spectrum-intro.p004
    topics: [physics.waves.em-spectrum-intro]
    difficulty: 2
    type: numeric
    stem: "ดวงอาทิตย์อยู่ห่างโลกประมาณ $1.5 \\times 10^{11}\\ \\mathrm{m}$ แสงเดินทางด้วยอัตราเร็ว $3.0 \\times 10^8\\ \\mathrm{m/s}$ แสงจากดวงอาทิตย์ใช้เวลากี่วินาทีจึงมาถึงโลก (ตอบในหน่วย s)"
    answer: { value: 500, tolerance: 5, unit: s }
    hints:
      - "เวลา = ระยะทาง ÷ อัตราเร็ว"
      - "$\\dfrac{1.5 \\times 10^{11}}{3.0 \\times 10^8}$ ลบเลขชี้กำลัง 11 − 8"
    misconceptions:
      - { match: 8.33, feedback: "8.33 คือเวลาเป็นนาที โจทย์ถามเป็นวินาที" }
      - { match: 2000, feedback: "ดูเหมือนนำ 3.0 หาร 1.5 (ได้ 2) แทน 1.5 หาร 3.0 (ได้ 0.5) เวลาคือระยะทางหารด้วยอัตราเร็ว" }
    solution: "$t = \\dfrac{1.5 \\times 10^{11}}{3.0 \\times 10^8} = 0.5 \\times 10^3 = 500\\ \\mathrm{s}$ ประมาณ 8 นาที 20 วินาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.em-spectrum-intro.p005
    topics: [physics.waves.em-spectrum-intro]
    difficulty: 2
    type: mcq
    stem: "ในสุญญากาศ คลื่นวิทยุ แสงที่มองเห็น และรังสีแกมมา เคลื่อนที่เร็วต่างกันอย่างไร"
    choices:
      - { id: a, text: "เร็วเท่ากันทั้งหมด คือ $3.0 \\times 10^8\\ \\mathrm{m/s}$", correct: true }
      - { id: b, text: "รังสีแกมมาเร็วที่สุด เพราะมีพลังงานสูงที่สุด", feedback: "พลังงานสูงมาจากความถี่สูง ไม่ได้ทำให้เร็วกว่า คลื่นแม่เหล็กไฟฟ้าทุกชนิดเร็วเท่ากันในสุญญากาศ" }
      - { id: c, text: "คลื่นวิทยุเร็วที่สุด เพราะความยาวคลื่นยาวที่สุด", feedback: "ความยาวคลื่นยาวแต่ความถี่ต่ำ ผลคูณ $f\\lambda$ จึงเท่ากับ $c$ เหมือนชนิดอื่น" }
    hints:
      - "คลื่นทั้งสามเป็นคลื่นชนิดเดียวกันหรือไม่"
      - "ใช้ $c = f\\lambda$ ถ้า $f$ มาก $\\lambda$ จะเป็นอย่างไร"
    solution: "ทั้งหมดเป็นคลื่นแม่เหล็กไฟฟ้า จึงเร็วเท่ากันในสุญญากาศ คือ $c = 3.0 \\times 10^8\\ \\mathrm{m/s}$ ต่างกันเพียงความถี่และความยาวคลื่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.em-spectrum-intro.p006
    topics: [physics.waves.em-spectrum-intro]
    difficulty: 3
    type: numeric
    stem: "สถานีวิทยุ FM ในกรุงเทพฯ ส่งคลื่นความถี่ $100\\ \\mathrm{MHz}$ คลื่นวิทยุนี้มีความยาวคลื่นกี่เมตร (ใช้ $c = 3.0 \\times 10^8\\ \\mathrm{m/s}$ ตอบในหน่วย m)"
    answer: { value: 3, tolerance: 0.03, unit: m }
    hints:
      - "แปลงหน่วย $100\\ \\mathrm{MHz} = 100 \\times 10^6\\ \\mathrm{Hz} = 1.0 \\times 10^8\\ \\mathrm{Hz}$"
      - "$\\lambda = \\dfrac{c}{f}$"
    misconceptions:
      - { match: 0.33, feedback: "ดูเหมือนนำ $f$ หาร $c$ ความยาวคลื่นคือ $c \\div f$" }
      - { match: 3000000, feedback: "ดูเหมือนลืมแปลง MHz เป็น Hz ($1\\ \\mathrm{MHz} = 10^6\\ \\mathrm{Hz}$)" }
    solution: "$\\lambda = \\dfrac{3.0 \\times 10^8}{1.0 \\times 10^8} = 3.0\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.em-spectrum-intro.p007
    topics: [physics.waves.em-spectrum-intro]
    difficulty: 3
    type: numeric
    stem: "เตาไมโครเวฟใช้คลื่นความถี่ $2.45\\ \\mathrm{GHz}$ ความยาวคลื่นเป็นกี่เซนติเมตร (ใช้ $c = 3.0 \\times 10^8\\ \\mathrm{m/s}$ ตอบในหน่วย cm ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 12.2, tolerance: 0.15, unit: cm }
    hints:
      - "$2.45\\ \\mathrm{GHz} = 2.45 \\times 10^9\\ \\mathrm{Hz}$"
      - "หา $\\lambda = \\dfrac{c}{f}$ เป็นเมตร แล้วคูณ 100 เป็นเซนติเมตร"
    misconceptions:
      - { match: 0.12, feedback: "0.122 คือความยาวคลื่นเป็นเมตร โจทย์ถามเป็นเซนติเมตร ต้องคูณ 100" }
    solution: "$\\lambda = \\dfrac{3.0 \\times 10^8}{2.45 \\times 10^9} = 0.122\\ \\mathrm{m} = 12.2\\ \\mathrm{cm}$ อยู่ในช่วงไมโครเวฟ (1 mm ถึง 10 cm โดยประมาณ ขอบเขตไม่ได้แบ่งตายตัว)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.em-spectrum-intro.p008
    topics: [physics.waves.em-spectrum-intro]
    difficulty: 3
    type: mcq
    stem: "คลื่นแม่เหล็กไฟฟ้าชนิดใดมีความถี่สูงที่สุดและพลังงานสูงที่สุด จึงทำลาย DNA ในเซลล์ได้มากที่สุด"
    choices:
      - { id: a, text: "รังสีแกมมา", correct: true }
      - { id: b, text: "คลื่นวิทยุ", feedback: "คลื่นวิทยุมีความถี่ต่ำที่สุดในสเปกตรัม พลังงานต่ำมาก" }
      - { id: c, text: "อินฟราเรด", feedback: "อินฟราเรดทำให้ร้อนได้ แต่ความถี่ต่ำกว่าแสงที่มองเห็น ไม่ทำให้อะตอมแตกตัวเป็นไอออน" }
      - { id: d, text: "ไมโครเวฟ", feedback: "ไมโครเวฟทำให้น้ำร้อน แต่ความถี่ต่ำ ไม่ทำลาย DNA โดยตรง" }
    hints:
      - "ความถี่สูงขึ้นไปทางความยาวคลื่นสั้น"
      - "คลื่นที่ยาวสั้นที่สุดในสเปกตรัมคืออะไร"
    solution: "รังสีแกมมามีความยาวคลื่นสั้นที่สุด ความถี่และพลังงานสูงที่สุด ทำให้อะตอมแตกตัวเป็นไอออนและทำลาย DNA ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.em-spectrum-intro.p009
    topics: [physics.waves.em-spectrum-intro]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นความแตกต่างระหว่างคลื่นแสงกับคลื่นเสียง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "แสงเดินทางในสุญญากาศได้ เสียงเดินทางไม่ได้", correct: true }
      - { id: b, text: "แสงเร็วกว่าเสียงในอากาศหลายแสนเท่า", correct: true }
      - { id: c, text: "แสงเป็นคลื่นตามขวาง เสียงในอากาศเป็นคลื่นตามยาว", correct: true }
      - { id: d, text: "แสงสะท้อนได้ แต่เสียงสะท้อนไม่ได้", feedback: "เสียงสะท้อนได้ เช่น เสียงก้องจากหน้าผา การสะท้อนเป็นสมบัติที่คลื่นทั้งสองมีเหมือนกัน" }
      - { id: e, text: "แสงพาพลังงาน แต่เสียงไม่พาพลังงาน", feedback: "เสียงพาพลังงานได้ เสียงดังทำให้กระจกสั่นได้ การพาพลังงานเป็นสมบัติร่วมของคลื่นทุกชนิด" }
    hints:
      - "คิดถึงตัวกลาง อัตราเร็ว และทิศการสั่น"
      - "ข้อใดเป็นสมบัติที่คลื่นทุกชนิดมีเหมือนกัน"
    solution: "ต่างกันที่ แสงไม่ต้องใช้ตัวกลาง แสงเร็วกว่ามาก ($3 \\times 10^8$ กับ $340\\ \\mathrm{m/s}$) และแสงเป็นคลื่นตามขวาง ส่วนการสะท้อนและการพาพลังงานเป็นสมบัติที่เหมือนกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.em-spectrum-intro.p010
    topics: [physics.waves.em-spectrum-intro]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นสมบัติที่ทั้งคลื่นแสงและคลื่นในตัวกลาง (เช่น เสียง คลื่นน้ำ) มีเหมือนกัน (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "พาพลังงานไปโดยไม่พาเนื้อสารไปด้วย", correct: true }
      - { id: b, text: "สะท้อนและหักเหได้", correct: true }
      - { id: c, text: "ใช้ความสัมพันธ์ อัตราเร็ว = ความถี่ × ความยาวคลื่น ได้", correct: true }
      - { id: d, text: "ต้องมีตัวกลางจึงเดินทางได้", feedback: "แสงไม่ต้องใช้ตัวกลาง จึงเดินทางผ่านอวกาศมาถึงโลกได้ ข้อนี้จึงไม่ใช่สมบัติร่วม" }
    hints:
      - "คลื่นทุกชนิดมีสมบัติร่วมหลายอย่าง"
      - "ข้อใดใช้ได้กับเสียงแต่ใช้ไม่ได้กับแสง"
    solution: "คลื่นทุกชนิดพาพลังงาน สะท้อน หักเห และใช้ $v = f\\lambda$ ได้ แต่ความต้องการตัวกลางเป็นของคลื่นในตัวกลางเท่านั้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.em-spectrum-intro.p011
    topics: [physics.waves.em-spectrum-intro]
    difficulty: 4
    type: numeric
    stem: "แสงสีแดงจากหลอด LED มีความยาวคลื่น $650\\ \\mathrm{nm}$ ความถี่ของแสงนี้เป็นกี่ $\\times 10^{14}\\ \\mathrm{Hz}$ (ใช้ $c = 3.0 \\times 10^8\\ \\mathrm{m/s}$ ตอบเฉพาะตัวเลขหน้า $\\times 10^{14}$ ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 4.62, tolerance: 0.05, unit: "× 10^14 Hz" }
    hints:
      - "$650\\ \\mathrm{nm} = 650 \\times 10^{-9}\\ \\mathrm{m} = 6.5 \\times 10^{-7}\\ \\mathrm{m}$"
      - "$f = \\dfrac{c}{\\lambda}$"
    misconceptions:
      - { match: 2.17, feedback: "ดูเหมือนนำ $\\lambda$ หาร $c$ ($\\tfrac{6.5}{3.0}$) ความถี่คือ $c \\div \\lambda$" }
      - { match: 0.46, feedback: "ตรวจเลขชี้กำลังอีกครั้ง $\\dfrac{3.0 \\times 10^8}{6.5 \\times 10^{-7}} = 0.462 \\times 10^{15} = 4.62 \\times 10^{14}$" }
    solution: "$f = \\dfrac{3.0 \\times 10^8}{6.5 \\times 10^{-7}} \\approx 4.62 \\times 10^{14}\\ \\mathrm{Hz}$ แสงที่มองเห็นมีความถี่ราว $4 \\times 10^{14}$ ถึง $7.5 \\times 10^{14}\\ \\mathrm{Hz}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.em-spectrum-intro.p012
    topics: [physics.waves.em-spectrum-intro]
    difficulty: 4
    type: numeric
    stem: "ดาวเทียมสื่อสารของไทยโคจรค้างฟ้าที่ความสูงประมาณ $36{,}000\\ \\mathrm{km}$ สัญญาณวิทยุจากสถานีภาคพื้นดินขึ้นไปถึงดาวเทียมแล้วส่งกลับลงมายังพื้นดินที่อยู่ใต้ดาวเทียม ใช้เวลารวมกี่วินาที (ใช้ $c = 3.0 \\times 10^5\\ \\mathrm{km/s}$ ตอบในหน่วย s)"
    answer: { value: 0.24, tolerance: 0.005, unit: s }
    hints:
      - "สัญญาณเดินทางขึ้นและลง ระยะทางรวมเป็นสองเท่าของความสูง"
      - "เวลา = ระยะทางรวม ÷ อัตราเร็วแสง"
    misconceptions:
      - { match: 0.12, feedback: "0.12 s คือเวลาขาขึ้นเพียงเที่ยวเดียว สัญญาณต้องลงมาด้วย" }
    solution: "ระยะทางรวม $= 2 \\times 36{,}000 = 72{,}000\\ \\mathrm{km}$ เวลา $= \\dfrac{72{,}000}{3.0 \\times 10^5} = 0.24\\ \\mathrm{s}$ คนที่คุยผ่านดาวเทียมจึงรู้สึกว่าเสียงตอบกลับช้าเล็กน้อย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.em-spectrum-intro.p013
    topics: [physics.waves.em-spectrum-intro]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "ช่วงสงกรานต์เดือนเมษายน ดัชนียูวีในหลายจังหวัดของไทยสูงมากตอนกลางวัน ข้อใดเป็นการป้องกันอันตรายจากรังสีอัลตราไวโอเลตที่ถูกต้อง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ทาครีมกันแดดและทาซ้ำเมื่อเปียกน้ำหรือเหงื่อออกมาก", correct: true }
      - { id: b, text: "สวมหมวกปีกกว้างและแว่นกันแดดที่กันรังสียูวีได้", correct: true }
      - { id: c, text: "หลบอยู่ในร่มช่วงสายถึงบ่ายที่แดดแรงที่สุด", correct: true }
      - { id: d, text: "วันที่มีเมฆมากไม่ต้องป้องกันเลย เพราะรังสียูวีผ่านเมฆไม่ได้", feedback: "รังสียูวีส่วนใหญ่ผ่านเมฆบาง ๆ ได้ ผิวจึงไหม้แดดได้แม้วันที่ฟ้าครึ้ม" }
      - { id: e, text: "อยู่ในน้ำตลอดจะปลอดภัย เพราะน้ำกันรังสียูวีได้หมด", feedback: "รังสียูวีผ่านน้ำตื้นได้ และผิวน้ำสะท้อนแสงแดดเพิ่มอีก คนที่เล่นน้ำจึงไหม้แดดได้ง่าย" }
    hints:
      - "ป้องกันได้ทั้งด้วยการบังผิวและลดเวลาที่อยู่กลางแดด"
      - "รังสียูวีผ่านเมฆบางและน้ำตื้นได้หรือไม่"
    solution: "ข้อ ก ข ค ถูก ครีมกันแดด หมวก แว่นกันแดด และการหลบแดดช่วงที่แรงที่สุดลดปริมาณรังสียูวีที่ผิวและตาได้รับ รังสียูวีผ่านเมฆบางและน้ำตื้นได้ จึงต้องป้องกันเสมอ"
