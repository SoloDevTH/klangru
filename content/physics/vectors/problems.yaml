    solution: "แรงลัพธ์ $= 50\\ \\mathrm{N}$ ทิศ $\\tan^{-1}\\tfrac{40}{30} \\approx 53.1^\\circ$ แรงที่สามต้องมีขนาด $50\\ \\mathrm{N}$ ทิศตรงข้าม คือ $53.1^\\circ + 180^\\circ = 233.1^\\circ$ (องค์ประกอบ $-30$ และ $-40\\ \\mathrm{N}$)"
