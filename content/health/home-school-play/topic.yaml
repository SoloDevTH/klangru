id: health.safety.home-school-play
subject: health
title: { th: อันตรายที่บ้าน โรงเรียน และจากการเล่น, en: "Hazards at home, at school and during play" }
summary: สิ่งที่ทำให้เกิดอันตรายในบ้านและโรงเรียน สาเหตุและการป้องกันอันตรายจากการเล่น ความปลอดภัยระหว่างเดินทาง และการพูดขอความช่วยเหลือจากผู้ใหญ่เมื่อเกิดเหตุ
difficulty: 1
minutes: 25
prerequisites: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: จุดอันตรายในบ้าน
    src: home-hazards.svg
    alt: "แผนผังบ้านสี่ห้องพร้อมจุดอันตรายเจ็ดจุดและคำอธิบาย: 1 มีดวางที่ขอบโต๊ะในครัว เป็นของมีคม 2 ด้ามหม้อยื่นออกนอกเตา เสี่ยงความร้อนและน้ำร้อนลวก 3 ปลั๊กพ่วงเสียบหลายอันในห้องนั่งเล่น สายไฟชำรุด เสี่ยงไฟฟ้าดูด 4 พื้นห้องน้ำเปียก ลื่นล้ม 5 น้ำยาล้างห้องน้ำวางบนพื้น เป็นสารพิษที่เด็กเล็กหยิบได้ 6 ของเล่นบนขั้นบันได ทำให้สะดุดตกจากที่สูง 7 ถังน้ำเปิดฝาในห้องน้ำ เด็กเล็กจมน้ำได้"
    caption: "ลองเดินสำรวจบ้านของตัวเองแบบนี้ แล้วบอกผู้ใหญ่ถ้าเจอจุดอันตราย"
  - type: worked-example
    title: สำรวจจุดอันตรายในครัว
    problem: "ในครัวมีมีดวางที่ขอบโต๊ะ และหม้อแกงกำลังเดือดบนเตาโดยด้ามหม้อยื่นออกมา น้องอายุ 3 ขวบกำลังเดินเข้าครัว เราควรทำอะไรบ้าง"
    steps:
      - text: "บอกอันตรายแต่ละจุด: มีดเป็นของมีคม หม้อเดือดเป็นความร้อน"
      - text: "พาน้องออกจากครัวก่อน"
        why: "การเอาคนที่เสี่ยงออกจากอันตรายเร็วที่สุดสำคัญกว่าการจัดของ"
      - text: "บอกผู้ใหญ่ให้เลื่อนมีดเข้าด้านในหรือเก็บเข้าที่ และหมุนด้ามหม้อเข้าด้านในเตา"
        why: "เด็กเล็กชอบเอื้อมคว้าของที่ยื่นออกมา ถ้าดึงด้ามหม้อ น้ำแกงร้อนจะหกลวกตัว"
      - text: "ตกลงกันในบ้านว่าไม่ให้เด็กเล็กเข้าครัวขณะทำอาหาร"
    answer: "พาน้องออกจากครัว เก็บมีดเข้าด้านใน หมุนด้ามหม้อเข้าใน และไม่ให้เด็กเล็กเข้าครัวตอนทำอาหาร"
  - { type: check, problem: health.safety.home-school-play.p001, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: worked-example
    title: พูดขอความช่วยเหลือให้ครบ
    problem: "ระหว่างเล่นที่สนามหลังโรงเรียน เพื่อนชื่อเก่งตกจากชิงช้า หัวเข่ามีเลือดไหล เราวิ่งไปเจอครูที่ห้องพักครู ควรพูดว่าอย่างไร"
    steps:
      - text: "เรียกครูและบอกว่าต้องการความช่วยเหลือ: \"ครูครับ ช่วยด้วยครับ\""
      - text: "บอกว่าใครและเกิดอะไร: \"เก่งตกชิงช้า\""
      - text: "บอกว่าที่ไหน: \"ที่สนามหลังโรงเรียน\""
        why: "ถ้าครูไม่รู้สถานที่ จะต้องเสียเวลาถามหรือตามหา"
      - text: "บอกอาการ: \"หัวเข่ามีเลือดไหลครับ\" แล้วพาครูไปที่เกิดเหตุ"
        why: "อาการช่วยให้ครูรู้ว่าต้องนำอุปกรณ์อะไรไป เช่น ผ้าสะอาด"
    answer: "\"ครูครับ ช่วยด้วยครับ เก่งตกชิงช้าที่สนามหลังโรงเรียน หัวเข่ามีเลือดไหลครับ\" แล้วพาครูไป"
  - { type: check, problem: health.safety.home-school-play.p006 }
glossary:
  - { term: อุบัติเหตุ, definition: "เหตุที่เกิดขึ้นโดยไม่ตั้งใจและทำให้บาดเจ็บหรือเสียหาย เช่น หกล้ม ถูกของมีคมบาด" }
  - { term: ของมีคม, definition: "ของที่มีคมหรือปลายแหลม เช่น มีด กรรไกร เศษแก้ว" }
  - { term: ปลั๊กพ่วง, definition: "รางปลั๊กที่มีหลายช่อง ไม่ควรเสียบเครื่องใช้ไฟฟ้าที่ให้ความร้อนหลายเครื่องพร้อมกัน" }
  - { term: สารพิษ, definition: "สารที่เป็นอันตรายเมื่อกิน ดม หรือถูกผิว เช่น น้ำยาล้างห้องน้ำ ยาฆ่าแมลง" }
  - { term: เบอร์โทรฉุกเฉิน, definition: "1669 เจ็บป่วยฉุกเฉิน 199 ไฟไหม้ 191 แจ้งเหตุร้ายกับตำรวจ" }
flashcards:
  - { front: "อันตรายในบ้านมีอะไรบ้าง", back: "ของมีคม ความร้อนและไฟ ไฟฟ้า ที่สูง พื้นลื่น สารพิษและยา และภาชนะใส่น้ำ" }
  - { front: "สาเหตุของอันตรายจากการเล่นมีอะไรบ้าง", back: "คนเล่นประมาทหรือเล่นรุนแรง อุปกรณ์ชำรุด สถานที่ไม่ปลอดภัย และไม่มีผู้ใหญ่ดูแล" }
  - { front: "ขอความช่วยเหลือต้องบอกอะไรบ้าง", back: "ใคร เกิดอะไร ที่ไหน อาการเป็นอย่างไร แล้วพาผู้ใหญ่ไปที่เกิดเหตุ" }
  - { front: "1669 199 191 ใช้เมื่อใด", back: "1669 เจ็บป่วยฉุกเฉิน 199 ไฟไหม้ 191 เหตุร้ายแจ้งตำรวจ" }
