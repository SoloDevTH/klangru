problems:
  - id: biology.cells.cell-signaling.p001
    topics: [biology.cells.cell-signaling]
    difficulty: 1
    type: mcq
    stem: "เซลล์ต่อมไทรอยด์ปล่อยฮอร์โมนเข้าสู่เลือดเพื่อไปกระตุ้นเซลล์เป้าหมายที่อยู่ไกลออกไป การส่งสัญญาณแบบนี้เรียกว่าอะไร"
    choices:
      - { id: a, text: "เอนโดไครน์", correct: true }
      - { id: b, text: "พาราไครน์", feedback: "พาราไครน์ส่งสัญญาณให้เซลล์ข้างเคียงโดยไม่ผ่านเลือดเป็นระยะไกล" }
      - { id: c, text: "ออโตไครน์", feedback: "ออโตไครน์เป็นการที่เซลล์ส่งสัญญาณให้ตัวเอง" }
      - { id: d, text: "การสัมผัสระหว่างเซลล์", feedback: "การสัมผัสต้องใช้โมเลกุลบนผิวเซลล์ที่แตะกัน ไม่ได้ส่งผ่านเลือด" }
    hints:
      - "สังเกตว่าสารถูกส่งผ่านทางใด"
      - "ฮอร์โมนที่ไหลในเลือดไปถึงเซลล์ที่อยู่ไกลได้"
    solution: "เมื่อฮอร์โมนถูกปล่อยเข้าเลือดแล้วไปถึงเซลล์เป้าหมายที่อยู่ไกล เป็นการส่งสัญญาณแบบเอนโดไครน์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-signaling.p002
    topics: [biology.cells.cell-signaling]
    difficulty: 1
    type: text
    stem: "โมเลกุลสัญญาณที่จับกับตัวรับอย่างจำเพาะเรียกว่าอะไร"
    accepted: ["ลิแกนด์", "ligand", "ลิแกนด์ (ligand)"]
    hints:
      - "โมเลกุลนี้จับกับตัวรับเหมือนกุญแจกับแม่กุญแจ"
      - "ชื่อเป็นคำทับศัพท์ภาษาอังกฤษที่ขึ้นต้นด้วยตัว L"
    solution: "ลิแกนด์ (ligand) คือโมเลกุลสัญญาณที่จับกับตัวรับเฉพาะเจาะจง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-signaling.p003
    topics: [biology.cells.cell-signaling]
    difficulty: 2
    type: mcq
    stem: "เมื่อถูกยุงกัดในสวนหลังบ้านที่ประเทศไทย ฮีสตามีนที่เซลล์มาสต์บริเวณรอยกัดปล่อยออกมาทำให้เส้นเลือดใกล้เคียงขยาย การส่งสัญญาณนี้เป็นแบบใด"
    choices:
      - { id: a, text: "พาราไครน์ เพราะส่งผลต่อเซลล์ข้างเคียง", correct: true }
      - { id: b, text: "เอนโดไครน์ เพราะส่งผ่านเลือดไปทั่วร่างกาย", feedback: "ฮีสตามีนออกฤทธิ์ในบริเวณใกล้เคียงกับที่ถูกปล่อย ไม่ได้ไปทั่วร่างกายผ่านต่อม" }
      - { id: c, text: "ออโตไครน์ เพราะส่งผลต่อเซลล์ที่ปล่อยเอง", feedback: "ฮีสตามีนส่งผลต่อเส้นเลือดข้างเคียง ไม่ได้ย้อนกลับไปยังเซลล์ที่ปล่อยเป็นหลัก" }
      - { id: d, text: "ส่งผ่านช่องแกปจังก์ชันโดยตรง", feedback: "ฮีสตามีนเป็นโมเลกุลที่จับตัวรับบนผิวเซลล์ ไม่ได้ผ่านช่องต่อระหว่างเซลล์" }
    hints:
      - "ดูว่าเซลล์เป้าหมายอยู่ใกล้หรือไกลจากจุดที่ปล่อยสาร"
      - "เส้นเลือดที่อยู่ใกล้เซลล์มาสต์รับสัญญาณโดยไม่ต้องผ่านกระแสเลือด"
    solution: "ฮีสตามีนจากเซลล์มาสต์ส่งสัญญาณให้เซลล์ข้างเคียง เช่น เส้นเลือดใกล้เคียง จึงเป็นการส่งสัญญาณแบบพาราไครน์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-signaling.p004
    topics: [biology.cells.cell-signaling]
    difficulty: 2
    type: mcq
    stem: "เซลล์มะเร็งบางชนิดหลั่งปัจจัยการเจริญเติบโตที่กระตุ้นตัวรับของเซลล์เดียวกัน ทำให้แบ่งตัวต่อเนื่อง การส่งสัญญาณนี้เรียกว่าอะไร"
    choices:
      - { id: a, text: "ออโตไครน์", correct: true }
      - { id: b, text: "เอนโดไครน์", feedback: "เอนโดไครน์ต้องผ่านเลือดไปยังเซลล์ที่อยู่ไกล ซึ่งไม่ใช่กรณีนี้" }
      - { id: c, text: "พาราไครน์", feedback: "พาราไครน์ส่งให้เซลล์ข้างเคียง แต่กรณีนี้เซลล์ส่งสัญญาณให้ตัวเอง" }
      - { id: d, text: "การส่งผ่านแกปจังก์ชัน", feedback: "แกปจังก์ชันส่งไอออนและโมเลกุลเล็กระหว่างเซลล์ที่แตะกัน ไม่ใช่การกระตุ้นตัวเอง" }
    hints:
      - "สัญญาณนี้ถูกรับโดยเซลล์ที่ปล่อยมันเอง"
      - "คำว่า 'ออโต' แปลว่าตัวเอง"
    solution: "การปล่อยสัญญาณที่กระตุ้นตัวเองของเซลล์เดียวกัน เป็นการส่งสัญญาณแบบออโตไครน์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-signaling.p005
    topics: [biology.cells.cell-signaling]
    difficulty: 2
    type: mcq
    stem: "ตัวรับแบบช่องไอออนทำงานอย่างไรเมื่อลิแกนด์จับ"
    choices:
      - { id: a, text: "เปิดช่องให้ไอออนผ่านเยื่อหุ้มเซลล์ได้ทันที", correct: true }
      - { id: b, text: "เติมหมู่ฟอสเฟตให้ตัวรับตัวเองแล้วเข้าสู่นิวเคลียส", feedback: "การเติมฟอสเฟตให้ตัวเองเป็นของตัวรับที่เป็นเอนไซม์ ไม่ใช่ตัวรับช่องไอออน" }
      - { id: c, text: "กระตุ้นโปรตีนจีให้เปลี่ยนสถานะ", feedback: "การกระตุ้นโปรตีนจีเป็นของตัวรับคู่โปรตีนจี ไม่ใช่ตัวรับช่องไอออน" }
      - { id: d, text: "ผ่านเข้าไปจับดีเอ็นเอในนิวเคลียสโดยตรง", feedback: "การจับดีเอ็นเอในนิวเคลียสเป็นของตัวรับที่อยู่ภายในเซลล์ เช่น ของฮอร์โมนสเตียรอยด์" }
    hints:
      - "ตัวรับช่องไอออนเป็นช่องที่เปิดปิดได้"
      - "การตอบสนองแบบนี้เร็วมากเพราะไม่ต้องผ่านหลายขั้น"
    solution: "ตัวรับช่องไอออนจับลิแกนด์แล้วเปิดช่องให้ไอออนผ่านเยื่อหุ้มเซลล์ทันที การตอบสนองจึงเร็วมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-signaling.p006
    topics: [biology.cells.cell-signaling]
    difficulty: 2
    type: numeric
    stem: "สัญญาณถูกขยายขึ้น 10 เท่าในแต่ละขั้นของการส่งต่อ ถ้ามี 4 ขั้น โมเลกุลที่ถูกกระตุ้นในขั้นสุดท้ายจะมากกว่าสัญญาณเริ่มต้นกี่เท่า (ตอบเป็นจำนวนเท่า)"
    answer: { value: 10000, tolerance: 0, unit: "เท่า" }
    misconceptions:
      - { match: 40, feedback: "บวกการขยายแทนการคูณ 10 + 10 + 10 + 10 = 40 การขยายเป็นทวีคูณ ต้องคูณกัน" }
      - { match: 1000, feedback: "ขยายเพียง 3 ขั้น แต่โจทย์มี 4 ขั้น ต้องคูณทั้งสี่ขั้น" }
    hints:
      - "การขยายในแต่ละขั้นเป็นการคูณกับตัวเลขเดิมซ้ำ"
      - "ถ้ามี 4 ขั้น ใช้ 10 คูณกันกี่ครั้ง"
    solution: "10 × 10 × 10 × 10 = 10⁴ = 10,000 เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-signaling.p007
    topics: [biology.cells.cell-signaling]
    difficulty: 2
    type: match
    stem: "จับคู่ตัวอย่างการส่งสัญญาณกับประเภทที่ตรงที่สุด"
    pairs:
      - { left: "อินซูลินที่ไหลในเลือดไปกระตุ้นเซลล์กล้ามเนื้อที่อยู่ไกล", right: "เอนโดไครน์" }
      - { left: "ฮีสตามีนจากเซลล์มาสต์ที่ส่งให้เซลล์ข้างเคียง", right: "พาราไครน์" }
      - { left: "เซลล์ที่ปล่อยปัจจัยการเจริญเติบโตที่กระตุ้นตัวเอง", right: "ออโตไครน์" }
      - { left: "โมเลกุลบนผิวของเซลล์สองเซลล์ที่แตะกันเป็นตัวส่งสัญญาณ", right: "ผ่านการสัมผัสระหว่างเซลล์" }
    hints:
      - "ดูว่าเป้าหมายอยู่ไกลหรือใกล้ และสารผ่านทางใด"
      - "ออโตไครน์คือส่งให้ตัวเอง"
    solution: "อินซูลินในเลือดเป็นเอนโดไครน์ ฮีสตามีนให้เซลล์ข้างเคียงเป็นพาราไครน์ ปัจจัยการเจริญเติบโตกับตัวเองเป็นออโตไครน์ และโมเลกุลบนผิวที่แตะกันเป็นการสัมผัส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-signaling.p008
    topics: [biology.cells.cell-signaling]
    difficulty: 2
    type: order
    stem: "เรียงลำดับเหตุการณ์ของเส้นทางการส่งสัญญาณผ่านตัวรับคู่โปรตีนจี (GPCR) จากต้นทางไปการตอบสนอง"
    items:
      - "ลิแกนด์จับกับตัวรับคู่โปรตีนจีที่ผิวเซลล์"
      - "ตัวรับกระตุ้นโปรตีนจีให้เปลี่ยนสถานะ"
      - "อะดีไนลิลไซเคลสเปลี่ยน ATP เป็น cAMP"
      - "โปรตีนไคเนสเอเติมหมู่ฟอสเฟตให้เอนไซม์เป้าหมาย"
      - "เกิดการตอบสนอง เช่น การสลายไกลโคเจน"
    hints:
      - "เริ่มจากการจับลิแกนด์ที่ผิวเซลล์ก่อนเสมอ"
      - "ผู้ส่งสารที่สองเกิดก่อนการกระตุ้นโปรตีนไคเนส"
    solution: "ลิแกนด์จับตัวรับ ตัวรับกระตุ้นโปรตีนจี โปรตีนจีกระตุ้นอะดีไนลิลไซเคลสให้สร้าง cAMP cAMP กระตุ้นโปรตีนไคเนสเอ และไคเนสเติมฟอสเฟตให้เอนไซม์จนเกิดการตอบสนอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-signaling.p009
    topics: [biology.cells.cell-signaling]
    difficulty: 3
    type: mcq
    stem: "ตัวรับคู่โปรตีนจีมีลักษณะเด่นอย่างไร"
    choices:
      - { id: a, text: "เป็นโปรตีนที่ผ่านเยื่อหุ้มเซลล์เจ็ดรอบและทำงานร่วมกับโปรตีนจี", correct: true }
      - { id: b, text: "เป็นช่องไอออนที่เปิดออกเมื่อมีศักย์ไฟฟ้า", feedback: "นั่นคือลักษณะของช่องไอออน ไม่ใช่ตัวรับคู่โปรตีนจี" }
      - { id: c, text: "เป็นเอนไซม์ไคเนสที่ฝังอยู่ในไซโทพลาซึม", feedback: "ตัวรับที่เป็นเอนไซม์เป็นอีกกลุ่มหนึ่ง และไม่ได้ทำงานร่วมกับโปรตีนจีเป็นหลัก" }
      - { id: d, text: "อยู่ในไซโทพลาซึมเท่านั้นและจับเฉพาะสารที่ละลายในไขมัน", feedback: "ตัวรับคู่โปรตีนจีอยู่บนเยื่อหุ้มเซลล์และจับลิแกนด์ที่ละลายน้ำได้" }
    hints:
      - "ลักษณะสำคัญคือการผ่านเยื่อหุ้มหลายรอบ"
      - "ตัวรับนี้ต้องส่งต่อสัญญาณไปที่โปรตีนอีกตัวเสมอ"
    solution: "ตัวรับคู่โปรตีนจี (GPCR) มีเยื่อหุ้มเซลล์เจ็ดรอบ เมื่อจับลิแกนด์จะกระตุ้นโปรตีนจีที่อยู่ใต้เยื่อหุ้ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-signaling.p010
    topics: [biology.cells.cell-signaling]
    difficulty: 3
    type: mcq
    stem: "ฮอร์โมนสเตียรอยด์ซึ่งผ่านเยื่อหุ้มเซลล์ได้ มักจับกับตัวรับที่ตำแหน่งใด"
    choices:
      - { id: a, text: "ตัวรับอยู่ในไซโทพลาซึมหรือนิวเคลียส แล้วไปควบคุมการแสดงออกของยีน", correct: true }
      - { id: b, text: "ตัวรับอยู่บนผิวเซลล์เท่านั้นและเปิดช่องไอออนทันที", feedback: "ตัวรับของฮอร์โมนสเตียรอยด์ไม่ได้เป็นช่องไอออนบนผิว" }
      - { id: c, text: "ตัวรับอยู่ในเลือดและทำงานก่อนฮอร์โมนเข้าเซลล์", feedback: "ตัวรับอยู่ในเซลล์เป้าหมาย ไม่ได้อยู่ในเลือด" }
      - { id: d, text: "ไม่มีตัวรับ ฮอร์โมนทำงานได้เองเหมือนน้ำตาล", feedback: "ฮอร์โมนทุกชนิดต้องจับกับตัวรับที่จำเพาะจึงจะออกฤทธิ์ได้" }
    hints:
      - "ฮอร์โมนที่ผ่านเยื่อหุ้มเข้าไปได้ไม่จำเป็นต้องจับตัวรับบนผิว"
      - "การควบคุมยีนเกิดในนิวเคลียส"
    solution: "ฮอร์โมนสเตียรอยด์ผ่านเยื่อหุ้มเซลล์ได้ จับตัวรับในไซโทพลาซึมหรือนิวเคลียส แล้วตัวรับนั้นไปควบคุมการแสดงออกของยีน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-signaling.p011
    topics: [biology.cells.cell-signaling]
    difficulty: 3
    type: mcq
    stem: "ข้อใด **ไม่ใช่** ผู้ส่งสารที่สองที่ใช้บ่อยในการส่งต่อสัญญาณในเซลล์"
    choices:
      - { id: a, text: "cAMP", feedback: "cAMP เป็นผู้ส่งสารที่สองที่สำคัญ เกิดจาก ATP ด้วยอะดีไนลิลไซเคลส" }
      - { id: b, text: "Ca²⁺ ในไซโทพลาซึม", feedback: "Ca²⁺ เป็นผู้ส่งสารที่สองที่ถูกปล่อยจากคลังภายในเซลล์เมื่อได้รับสัญญาณ" }
      - { id: c, text: "IP₃", feedback: "IP₃ เกิดจากการแยก PIP₂ และกระตุ้นการปล่อย Ca²⁺" }
      - { id: d, text: "กลูโคส", correct: true }
    hints:
      - "ผู้ส่งสารที่สองคือโมเลกุลขนาดเล็กที่เกิดขึ้นในเซลล์หลังได้รับสัญญาณ"
      - "ดูว่าตัวเลือกใดเป็นสารที่เซลล์ใช้เป็นพลังงานหรือแหล่งคาร์บอนมากกว่า"
