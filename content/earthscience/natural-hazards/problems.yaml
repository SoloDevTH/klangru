      - { id: b, text: "ไม่ดี เพราะบ้านใต้ถุนสูงทำให้น้ำท่วมสูงขึ้น", feedback: "บ้านหลังเดียวไม่ได้ทำให้ระดับน้ำทั้งลุ่มน้ำสูงขึ้น ใต้ถุนสูงยังให้น้ำไหลผ่านได้" }
      - { id: c, text: "ดีที่สุด ไม่ต้องเตรียมอย่างอื่นอีกเลย", feedback: "ทุกวิธีมีข้อจำกัด ถ้าน้ำท่วมสูงกว่าปกติหรือท่วมนาน ยังต้องมีเสบียงและแผนอพยพ" }
