<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
<title>แผนภาพระดับเอนทัลปีของการเผาคาร์บอนเป็น CO2 ทางตรงและทางอ้อมผ่าน CO แสดงกฎของเฮสส์</title>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1d3557"/></marker></defs>
<g transform="translate(40,0)">
<line x1="22" y1="60" x2="22" y2="200.0" stroke="#444" stroke-width="1.5"/>
<line x1="18" y1="60.0" x2="22" y2="60.0" stroke="#444" stroke-width="1.5"/>
<text x="14" y="64.0" font-size="11" text-anchor="end" fill="#444" font-family="sans-serif">0</text>
<line x1="18" y1="95.0" x2="22" y2="95.0" stroke="#444" stroke-width="1.5"/>
<text x="14" y="99.0" font-size="11" text-anchor="end" fill="#444" font-family="sans-serif">-100</text>
<line x1="18" y1="130.0" x2="22" y2="130.0" stroke="#444" stroke-width="1.5"/>
<text x="14" y="134.0" font-size="11" text-anchor="end" fill="#444" font-family="sans-serif">-200</text>
<line x1="18" y1="165.0" x2="22" y2="165.0" stroke="#444" stroke-width="1.5"/>
<text x="14" y="169.0" font-size="11" text-anchor="end" fill="#444" font-family="sans-serif">-300</text>
<line x1="18" y1="200.0" x2="22" y2="200.0" stroke="#444" stroke-width="1.5"/>
<text x="14" y="204.0" font-size="11" text-anchor="end" fill="#444" font-family="sans-serif">-400</text>
<text x="2" y="30" font-size="12" fill="#444" font-family="sans-serif">ΔH (kJ/mol)</text>
<line x1="40" y1="60.0" x2="180" y2="60.0" stroke="#1d3557" stroke-width="3"/>
<text x="40" y="52.0" font-size="14" fill="#222" font-family="sans-serif" font-weight="bold">C(s) + O₂(g)</text>
<line x1="260" y1="98.7" x2="400" y2="98.7" stroke="#1d3557" stroke-width="3"/>
<text x="260" y="90.7" font-size="14" fill="#222" font-family="sans-serif" font-weight="bold">CO(g) + ½O₂(g)</text>
<line x1="480" y1="197.7" x2="620" y2="197.7" stroke="#1d3557" stroke-width="3"/>
<text x="480" y="189.7" font-size="14" fill="#222" font-family="sans-serif" font-weight="bold">CO₂(g)</text>
<line x1="180.0" y1="64.0" x2="260.0" y2="94.7" stroke="#e76f51" stroke-width="2.2" marker-end="url(#ah)"/>
<line x1="400.0" y1="102.7" x2="480.0" y2="193.7" stroke="#e76f51" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="196" y="64.0" font-size="13" fill="#e76f51" font-family="sans-serif" font-weight="bold">−110.5</text>
<text x="452" y="152.2" font-size="13" fill="#e76f51" font-family="sans-serif" font-weight="bold">−283.0</text>
<line x1="100" y1="66.0" x2="474" y2="195.5" stroke="#2a9d8f" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="230" y="170.0" font-size="14" fill="#2a9d8f" font-family="sans-serif" text-anchor="middle" font-weight="bold">ทางตรง ΔH = −393.5 kJ/mol</text>
<text x="326" y="258.0" font-size="12" fill="#222" font-family="Loma, sans-serif" text-anchor="middle">ผลรวมของสองขั้น (−110.5 + (−283.0)) เท่ากับทางตรงเสมอ</text>
