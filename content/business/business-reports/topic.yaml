id: business.communication.business-reports
subject: business
title:
  th: การสื่อสารสารสนเทศทางธุรกิจ รายงาน การนำเสนอ และการเลือกรูปแบบให้เหมาะกับผู้ฟัง
  en: Business information communication, reports, presentations and choosing formats for the audience
summary: เขียนรายงานและบทสรุปผู้บริหารที่ขึ้นต้นด้วยข้อสรุป เลือกตาราง กราฟ หรือช่องทางให้เหมาะกับข้อมูลและผู้ฟัง หลีกเลี่ยงกราฟที่ชวนเข้าใจผิด และอธิบายตัวเลขบัญชีให้ผู้ที่ไม่ใช่นักบัญชี
difficulty: 5
minutes: 40
prerequisites:
- business.stats.descriptive
encompasses:
- id: business.stats.descriptive
  weight: 0.3
- id: math.stats.data-display
  weight: 0.3
- id: math.number.ratio-percent
  weight: 0.2
curriculum_tags: []
lessons:
- type: figure
  src: pyramid-structure.svg
  alt: พีระมิดสามชั้นที่ชั้นบนสุดเป็นข้อสรุปและข้อเสนอแนะ ชั้นกลางเป็นเหตุผลหลักสามข้อที่มีประเด็นและหลักฐานรองรับ ชั้นล่างสุดเป็นข้อมูลและแหล่งที่มา ข้อความด้านขวาบอกว่าผู้อ่านดูชั้นบนสุดก่อน
  caption: หลักพีระมิดให้ผู้อ่านได้ข้อสรุปก่อน แล้วลงไปดูเหตุผลและหลักฐานตามลำดับ
- type: explanation
  file: lesson.md
- type: figure
  src: chart-axis.svg
  alt: กราฟแท่งสองกราฟแสดงยอดขายสมมติสองปี กราฟซ้ายแกนตั้งเริ่มที่ 90 แท่งปี 2568 สูงกว่าปี 2567 มาก กราฟขวาแกนตั้งเริ่มที่ 0 แท่งทั้งสองเกือบเท่ากัน
  caption: ข้อมูลเดียวกัน แต่แกนตั้งต่างกันทำให้ความประทับใจต่างกันมาก (ข้อมูลสมมติ)
- type: worked-example
  title: อัตรากำไรขั้นต้นและกำไรสุทธิของร้านกาแฟ
  problem: ร้านกาแฟ (สมมติ) มีรายได้ $500{,}000$ บาท ต้นทุนขาย $300{,}000$ บาท และค่าใช้จ่ายดำเนินงาน $150{,}000$ บาทในเดือนหนึ่ง กำไรขั้นต้นและกำไรสุทธิเป็นกี่เปอร์เซ็นต์ของรายได้
  steps:
  - text: "กำไรขั้นต้น $= 500{,}000 - 300{,}000 = 200{,}000$ บาท คิดเป็น $200{,}000 \\div 500{,}000 \\times 100 = 40\\%$ ของรายได้"
    why: กำไรขั้นต้นยังไม่หักค่าใช้จ่ายดำเนินงาน จึงเป็นกำไรก่อนค่าใช้จ่ายอื่น
  - text: "กำไรสุทธิ $= 200{,}000 - 150{,}000 = 50{,}000$ บาท คิดเป็น $50{,}000 \\div 500{,}000 \\times 100 = 10\\%$ ของรายได้"
    why: กำไรสุทธิคือสิ่งที่เหลือหลังหักค่าใช้จ่ายทั้งหมดที่เกี่ยวข้องในงวดนั้น
  - text: "บอกผู้อ่านให้ชัดว่าทั้งสองตัวเลขเป็นเปอร์เซ็นต์ของรายได้ ไม่ใช่ของต้นทุน"
  answer: กำไรขั้นต้น $40\%$ และกำไรสุทธิ $10\%$ ของรายได้ ซึ่งบอกว่าเหลือเงินจากทุกบาทของรายได้ประมาณ 10 สตางค์หลังหักทุกอย่าง
- type: check
  problem: business.communication.business-reports.p006
  prompt: ลองคิดก่อนอ่านต่อ แกนตั้งของกราฟใดทำให้เข้าใจผิดได้
- type: figure
  src: waterfall.svg
  alt: แผนภูมิน้ำตกเริ่มจากแท่งรายได้ 500,000 บาท ตามด้วยแท่งลบต้นทุนขาย 300,000 บาท ทำให้เหลือกำไรขั้นต้น 200,000 บาท แท่งลบค่าใช้จ่าย 150,000 บาท และแท่งกำไรสุทธิ 50,000 บาท
  caption: ภาพนี้ไล่จากรายได้ลงไปถึงกำไรสุทธิ (ข้อมูลสมมติ)
- type: worked-example
  title: เลือกรูปแบบการแสดงยอดขายตามสัดส่วนสินค้า
  problem: ต้องการแสดงว่ายอดขายรวมในปีหนึ่งมาจากสินค้าสามกลุ่มกี่เปอร์เซ็นต์ และให้ผู้ฟังเทียบกลุ่มที่ใหญ่ที่สุดกับรองลงมาได้ง่าย ควรเลือกรูปแบบใด
  steps:
  - text: ถามว่าข้อมูลเป็นสัดส่วนของทั้งหมดหรือไม่ ซึ่งในที่นี้ใช่
    why: สัดส่วนของทั้งหมดควรแสดงให้เห็นว่าแต่ละส่วนรวมกันได้ 100%
  - text: นับจำนวนส่วน มีสามกลุ่ม ซึ่งไม่มากเกินไปสำหรับแผนภูมิประเภทส่วนประกอบ
  - text: เลือกแท่งเดียวที่แบ่งเป็น 100% และเรียงกลุ่มจากใหญ่ไปเล็ก เพื่อให้เทียบความยาวของแต่ละส่วนได้ง่ายกว่าวงกลม
    why: คนเปรียบเทียบความยาวได้แม่นกว่าการเปรียบเทียบพื้นที่ของมุม
  answer: แท่งซ้อน 100% ที่เรียงจากใหญ่ไปเล็ก พร้อมป้ายเปอร์เซ็นต์ของแต่ละกลุ่ม
- type: check
  problem: business.communication.business-reports.p018
  prompt: เมื่อผู้ฟังตั้งคำถาม คำตอบควรมีอะไรบ้าง
glossary:
- term: พีระมิดแนวคิด
  definition: โครงสร้างการเขียนที่วางข้อสรุปไว้บนสุด แล้วใช้เหตุผลและหลักฐานรองรับเป็นชั้นลงไป
- term: บทสรุปผู้บริหาร
  definition: ส่วนแรกของรายงานที่สรุปข้อค้นพบ ข้อเสนอแนะ และการตัดสินใจที่ต้องการในหน้าเดียว
- term: กำไรขั้นต้น
  definition: รายได้ลบต้นทุนขาย ก่อนหักค่าใช้จ่ายดำเนินงาน
- term: กำไรสุทธิ
  definition: กำไรที่เหลือหลังหักค่าใช้จ่ายทั้งหมดในงวดนั้น
- term: ค่าเสื่อมราคา
  definition: การกระจายต้นทุนของสินทรัพย์ที่ใช้งานหลายปีไปตามช่วงที่ใช้ประโยชน์ ซึ่งไม่ได้จ่ายเป็นเงินสดในทุกงวด
flashcards:
- front: พีระมิดแนวคิดในการเขียนรายงาน
  back: ขึ้นต้นด้วยข้อสรุป แล้วตามด้วยเหตุผลหลักและหลักฐานรองรับ
- front: เมื่อใดควรใช้แผนภูมิแท่ง
  back: เทียบค่าระหว่างหมวดหมู่ที่ไม่มีลำดับเวลา
- front: กราฟแท่งทำไมต้องเริ่มแกนตั้งที่ศูนย์
  back: เพราะความสูงของแท่งถูกรับรู้เป็นขนาด แกนที่ไม่เริ่มที่ศูนย์ทำให้ความต่างดูเกินจริง
- front: กำไรขั้นต้นกับกำไรสุทธิต่างกันอย่างไร
  back: กำไรขั้นต้นหักเฉพาะต้นทุนขาย กำไรสุทธิหักค่าใช้จ่ายทั้งหมดแล้ว
