<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 370" width="860" height="370" font-family="sans-serif" font-size="14">
<title>เส้นทางการส่งสัญญาณจากอะดรีนาลินผ่านตัวรับคู่โปรตีนจี โปรตีนจี อะดีไนลิลไซเคลส cAMP และโปรตีนไคเนสเอ จนถึงการสลายไกลโคเจน</title>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#37474f"/></marker></defs>
<rect x="0" y="0" width="860" height="370" fill="#ffffff"/>
<rect x="20" y="40" width="170" height="78" rx="12" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
<text x="105.0" y="74" text-anchor="middle" font-weight="bold" fill="#263238">อะดรีนาลิน</text>
<text x="105.0" y="96" text-anchor="middle" font-size="12" fill="#455a64">ลิแกนด์ภายนอกเซลล์</text>
<rect x="230" y="40" width="170" height="78" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="315.0" y="74" text-anchor="middle" font-weight="bold" fill="#263238">ตัวรับคู่โปรตีนจี</text>
<text x="315.0" y="96" text-anchor="middle" font-size="12" fill="#455a64">เจ็ดรอบผ่านเยื่อหุ้ม</text>
<rect x="440" y="40" width="170" height="78" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/>
<text x="525.0" y="74" text-anchor="middle" font-weight="bold" fill="#263238">โปรตีนจี (GTP)</text>
<text x="525.0" y="96" text-anchor="middle" font-size="12" fill="#455a64">เปลี่ยนสถานะเมื่อจับ GTP</text>
<rect x="650" y="40" width="170" height="78" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="735.0" y="74" text-anchor="middle" font-weight="bold" fill="#263238">อะดีไนลิลไซเคลส</text>
<text x="735.0" y="96" text-anchor="middle" font-size="12" fill="#455a64">เปลี่ยน ATP เป็น cAMP</text>
<rect x="650" y="200" width="170" height="78" rx="12" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
<text x="735.0" y="234" text-anchor="middle" font-weight="bold" fill="#263238">cAMP</text>
<text x="735.0" y="256" text-anchor="middle" font-size="12" fill="#455a64">ผู้ส่งสารที่สอง</text>
<rect x="440" y="200" width="170" height="78" rx="12" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
<text x="525.0" y="234" text-anchor="middle" font-weight="bold" fill="#263238">โปรตีนไคเนสเอ (PKA)</text>
<text x="525.0" y="256" text-anchor="middle" font-size="12" fill="#455a64">เติมฟอสเฟตให้เอนไซม์</text>
<rect x="230" y="200" width="170" height="78" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
<text x="315.0" y="234" text-anchor="middle" font-weight="bold" fill="#263238">ฟอสโฟรีเลชันของเอนไซม์</text>
<text x="315.0" y="256" text-anchor="middle" font-size="12" fill="#455a64">กระตุ้นการสลายไกลโคเจน</text>
<rect x="20" y="200" width="170" height="78" rx="12" fill="#e0f7fa" stroke="#00838f" stroke-width="2"/>
<text x="105.0" y="234" text-anchor="middle" font-weight="bold" fill="#263238">กลูโคส-6-ฟอสเฟต</text>
<text x="105.0" y="256" text-anchor="middle" font-size="12" fill="#455a64">สารตั้งต้นของการหายใจ</text>
<line x1="196" y1="79.0" x2="224" y2="79.0" stroke="#37474f" stroke-width="2.2" marker-end="url(#ar)"/>
<line x1="406" y1="79.0" x2="434" y2="79.0" stroke="#37474f" stroke-width="2.2" marker-end="url(#ar)"/>
<line x1="616" y1="79.0" x2="644" y2="79.0" stroke="#37474f" stroke-width="2.2" marker-end="url(#ar)"/>
<line x1="735.0" y1="124" x2="735.0" y2="194" stroke="#37474f" stroke-width="2.2" marker-end="url(#ar)"/>
<line x1="644" y1="239.0" x2="616" y2="239.0" stroke="#37474f" stroke-width="2.2" marker-end="url(#ar)"/>
<line x1="434" y1="239.0" x2="406" y2="239.0" stroke="#37474f" stroke-width="2.2" marker-end="url(#ar)"/>
<line x1="224" y1="239.0" x2="196" y2="239.0" stroke="#37474f" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="430" y="322" text-anchor="middle" fill="#555" font-size="12">ตัวอย่างนี้คือเซลล์กล้ามเนื้อโครงร่างที่ถูกกระตุ้นให้สลายไกลโคเจน (ลูกศรบอกลำดับการส่งสัญญาณ)</text>
</svg>