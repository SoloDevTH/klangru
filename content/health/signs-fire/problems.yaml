    choices:
      - { id: a, text: "บันไดหนีไฟตามป้ายสีเขียว ก้มต่ำและปิดจมูกถ้ามีควัน", correct: true }
      - { id: b, text: "ลิฟต์ เพราะเร็วกว่าเดินลงบันได", feedback: "ลิฟต์อาจหยุดค้างเมื่อไฟฟ้าดับ และอาจเปิดที่ชั้นที่ไฟไหม้หรือมีควันเข้า" }
      - { id: c, text: "ขึ้นไปดาดฟ้าแล้วรอ", feedback: "ควันลอยขึ้นสูง การขึ้นไปข้างบนทำให้ติดอยู่กับควัน ถ้าลงได้อย่างปลอดภัยต้องลงทางบันไดหนีไฟ" }
    hints:
