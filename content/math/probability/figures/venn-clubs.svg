<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 305" width="460" height="305" font-family="sans-serif" font-size="15">
  <title>แผนภาพเวนน์นักเรียน 30 คน วงดนตรีและวงว่ายน้ำ</title>
  <rect x="0" y="0" width="460" height="305" fill="#ffffff"/>
  <rect x="15.0" y="30.0" width="430.0" height="260.0" rx="0" fill="#ffffff" stroke="#15211e" stroke-width="2"/>
  <text x="28.0" y="52.0" font-size="14" text-anchor="start" fill="#444" font-weight="normal" font-style="normal">นักเรียนทั้งหมด 30 คน</text>
  <circle cx="180" cy="180" r="90" fill="#e2f0ed" fill-opacity="0.75" stroke="#0a6b60" stroke-width="2.5"/>
