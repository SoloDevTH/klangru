id: computer.programming.lists-strings
subject: computer
title: { th: ลิสต์ ดิกชันนารี และการประมวลผลข้อความ, en: "Lists, dictionaries and string processing" }
summary: ใช้ลิสต์แทนตัวแปรหลายตัว เข้าถึงด้วยดัชนีและการตัดช่วง เพิ่มลบและวนผ่านสมาชิก ดิกชันนารีและเซต ตัด ต่อ ค้นหา และนับในสตริง และเลือกโครงสร้างข้อมูลให้เหมาะกับปัญหา
difficulty: 4.5
minutes: 45
prerequisites: [computer.programming.functions]
encompasses:
  - { id: computer.programming.functions, weight: 0.3 }
  - { id: computer.programming.basics, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: list-index.svg
    alt: "ลิสต์ scores = [12, 15, 9, 18, 11] วาดเป็นช่องห้าช่อง เหนือช่องมีดัชนี 0, 1, 2, 3, 4 ใต้ช่องมีดัชนีลบ -5, -4, -3, -2, -1 ช่องที่ดัชนี 1 และ 2 (ค่า 15 และ 9) เป็นสีส้ม มีวงเล็บใต้ช่องจากขอบซ้ายของดัชนี 1 ถึงขอบซ้ายของดัชนี 3 ป้ายว่า scores[1:3] ได้ [15, 9] หยุดก่อนดัชนี 3 ข้างขวาเขียนว่า len = 5"
    caption: "ดัชนีเริ่มที่ 0 ดัชนีลบนับจากท้าย และการตัดช่วงไม่รวมดัชนีท้าย"
  - type: worked-example
    title: นับคะแนนเลือกประธานนักเรียนด้วยดิกชันนารี
    problem: "บัตรเลือกตั้ง 8 ใบเก็บเป็นลิสต์ `votes = [\"ข้าวหอม\", \"ต้นกล้า\", \"ข้าวหอม\", \"ปลื้ม\", \"ต้นกล้า\", \"ข้าวหอม\", \"ปลื้ม\", \"ข้าวหอม\"]` เขียนโปรแกรมนับคะแนนแต่ละคนและหาผู้ชนะ"
    steps:
      - text: "เลือกโครงสร้าง: ต้องเก็บจำนวนคะแนนคู่กับชื่อ จึงใช้ดิกชันนารี `count = {}` คีย์คือชื่อ ค่าคือคะแนน"
        why: "ถ้าใช้ลิสต์ต้องจำว่าคะแนนของใครอยู่ช่องไหน ดิกชันนารีใช้ชื่อค้นได้ตรง ๆ และใช้ได้กับผู้สมัครกี่คนก็ได้"
      - text: "วนบัตรทีละใบ: `for v in votes:` แล้ว `count[v] = count.get(v, 0) + 1`"
        why: "ชื่อที่ยังไม่เคยพบ get คืน 0 จึงเริ่มนับที่ 1 โดยไม่เกิด KeyError"
      - text: "ไล่ดูผล: count = {\"ข้าวหอม\": 4, \"ต้นกล้า\": 2, \"ปลื้ม\": 2}"
      - text: "หาผู้ชนะ: ตั้ง `best = 0` แล้ววน `for name in count:` ถ้า `count[name] > best` ให้จำชื่อและคะแนนนั้น"
      - text: "ตรวจกับการนับมือ: ข้าวหอมได้ 4 จาก 8 ใบ รวมทุกคนได้ 4 + 2 + 2 = 8 ครบทุกใบ"
        why: "ผลรวมของค่าในดิกชันนารีต้องเท่ากับจำนวนบัตร เป็นการตรวจว่าไม่มีบัตรหาย"
    answer: "count = {\"ข้าวหอม\": 4, \"ต้นกล้า\": 2, \"ปลื้ม\": 2} ผู้ชนะคือข้าวหอม 4 คะแนน"
  - { type: check, problem: computer.programming.lists-strings.p003, prompt: "ลองใช้ดัชนีลบและ len" }
  - type: figure
    src: structures.svg
    alt: "สามกรอบเทียบกัน กรอบซ้ายคือลิสต์ มีช่องเรียงลงมา ดัชนี 0 ฟ้า 1 ต้น 2 ฟ้า 3 มด แสดงว่าเรียงลำดับและซ้ำได้ กรอบกลางคือดิกชันนารี มีลูกศรจากคีย์ไปค่า ส้มตำ ไป 50 ไก่ย่าง ไป 120 ข้าวเหนียว ไป 10 และตัวอย่าง price[\"ไก่ย่าง\"] ได้ 120 กรอบขวาคือเซต เป็นวงรีที่มีเชียงใหม่ ระยอง และน่าน ใต้วงรีเขียนว่าเพิ่มเชียงใหม่อีกครั้งก็ยังมี 3 ตัว"
    caption: "ลิสต์ ดิกชันนารี และเซต เหมาะกับคำถามต่างกัน"
  - type: worked-example
    title: แยกข้อความเป็นดิกชันนารีคะแนน
    problem: "ระบบส่งออกคะแนนมาเป็นข้อความเดียว `data = \"ฟ้า:18, ต้น:12 ,มด:15\"` (เว้นวรรคไม่สม่ำเสมอ) ให้แปลงเป็นดิกชันนารีชื่อกับคะแนน หาค่าเฉลี่ย และรายชื่อคนที่ได้ 15 ขึ้นไป"
    steps:
      - text: "แยกแต่ละคนด้วยจุลภาค: `data.split(\",\")` ได้ `['ฟ้า:18', ' ต้น:12 ', 'มด:15']`"
      - text: "แยกชื่อกับคะแนนด้วยโคลอน: `name, pt = part.split(\":\")`"
      - text: "ทำความสะอาดและแปลงชนิด: `scores[name.strip()] = int(pt)`"
        why: "strip ตัดช่องว่างหัวท้าย ไม่เช่นนั้นคีย์จะเป็น ' ต้น' ซึ่งไม่เท่ากับ 'ต้น' และ int แปลงข้อความ '12 ' เป็นจำนวน 12 (int ยอมให้มีช่องว่างหัวท้าย)"
      - text: "ได้ scores = {\"ฟ้า\": 18, \"ต้น\": 12, \"มด\": 15} ค่าเฉลี่ย `sum(scores.values()) / len(scores)` = 45 / 3 = 15.0"
      - text: "หาคนที่ได้ 15 ขึ้นไป: สร้าง `top = []` วนทุกชื่อ ถ้า `scores[name] >= 15` ให้ `top.append(name)` ได้ ['ฟ้า', 'มด']"
    answer: "ได้ดิกชันนารี {\"ฟ้า\": 18, \"ต้น\": 12, \"มด\": 15} ค่าเฉลี่ย 15.0 และคนที่ได้ 15 ขึ้นไปคือฟ้าและมด"
  - { type: check, problem: computer.programming.lists-strings.p008, prompt: "ดิกชันนารีนับคำ มีคีย์กี่ตัว" }
glossary:
  - { term: ลิสต์ (list), definition: "โครงสร้างที่เก็บข้อมูลหลายค่าเรียงเป็นลำดับ เข้าถึงด้วยดัชนี เพิ่มลบได้ และมีค่าซ้ำได้" }
  - { term: ดัชนี (index), definition: "ตำแหน่งของสมาชิกในลิสต์หรือสตริง เริ่มที่ 0 ดัชนีลบนับจากท้าย" }
  - { term: การตัดช่วง (slicing), definition: "การเลือกสมาชิกช่วงหนึ่งด้วย a[i:j] ได้ดัชนี i ถึง j − 1" }
  - { term: ดิกชันนารี (dictionary), definition: "โครงสร้างที่เก็บคู่คีย์กับค่า ค้นค่าด้วยคีย์ คีย์ไม่ซ้ำกัน" }
  - { term: เซต (set), definition: "กลุ่มสมาชิกที่ไม่ซ้ำกันและไม่สนลำดับ ตรวจการเป็นสมาชิกได้เร็ว" }
  - { term: สตริง (string), definition: "ลำดับของอักขระที่ใช้แทนข้อความ แก้ทีละตัวไม่ได้ ต้องสร้างสตริงใหม่" }
  - { term: เมทอด (method), definition: "ฟังก์ชันที่เป็นของข้อมูลชนิดหนึ่ง เรียกด้วยจุด เช่น scores.append(5) หรือ text.split()" }
flashcards:
  - { front: "a = [5, 8, 2] แล้ว a[0] และ a[-1] คืออะไร", back: "a[0] = 5 ตัวแรก และ a[-1] = 2 ตัวสุดท้าย" }
  - { front: "a[1:3] ได้สมาชิกดัชนีใดบ้าง", back: "ดัชนี 1 และ 2 ไม่รวมดัชนี 3" }
  - { front: "นับความถี่ของคำด้วยดิกชันนารีอย่างไร", back: "count[w] = count.get(w, 0) + 1 ทุกคำ" }
  - { front: "เมื่อใดควรใช้เซตแทนลิสต์", back: "เมื่อสนใจแค่ว่ามีหรือไม่ หรือต้องตัดตัวซ้ำ เซตตรวจด้วย in ได้เร็วกว่า" }
  - { front: "ทำไม len(\"น้ำ\") ได้ 3", back: "วรรณยุกต์และสระบนล่างเป็นอักขระแยก: น ไม้โท สระอำ" }
