problems:
  - id: computer.networks.internet-basics.p001
    topics: [computer.networks.internet-basics]
    difficulty: 1
    type: mcq
    stem: "อุปกรณ์ใดทำหน้าที่ **เชื่อมเครือข่ายบ้านเข้ากับอินเทอร์เน็ต และเลือกเส้นทางส่งต่อข้อมูล**"
    choices:
      - { id: a, text: "เราเตอร์", correct: true }
      - { id: b, text: "เมาส์", feedback: "เมาส์เป็นหน่วยรับเข้าของคอมพิวเตอร์ ไม่เกี่ยวกับการส่งข้อมูลในเครือข่าย" }
      - { id: c, text: "จอภาพ", feedback: "จอภาพเป็นหน่วยส่งออก แสดงผลเท่านั้น" }
      - { id: d, text: "ลำโพงบลูทูท", feedback: "ลำโพงรับเสียงจากโทรศัพท์ในระยะใกล้ ไม่ได้เชื่อมเครือข่าย" }
    hints:
      - "อุปกรณ์นี้อยู่ระหว่างเครือข่ายสองวง"
      - "ชื่อมาจากคำว่า route ที่แปลว่าเส้นทาง"
    solution: "เราเตอร์เชื่อมเครือข่ายที่ต่างกัน เช่น เครือข่ายบ้านกับเครือข่ายของผู้ให้บริการอินเทอร์เน็ต และเลือกเส้นทางส่งแพ็กเก็ตต่อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.internet-basics.p002
    topics: [computer.networks.internet-basics]
    difficulty: 1
    type: match
    stem: "จับคู่อุปกรณ์เครือข่ายกับหน้าที่"
    pairs:
      - { left: "สวิตช์", right: "เชื่อมเครื่องหลายเครื่องในห้องเดียวกันเข้าด้วยกัน" }
      - { left: "เราเตอร์", right: "ส่งต่อข้อมูลระหว่างเครือข่ายที่ต่างกัน" }
      - { left: "เซิร์ฟเวอร์", right: "เก็บหน้าเว็บและตอบคำขอของเครื่องอื่น" }
      - { left: "จุดเข้าใช้งานไร้สาย", right: "ให้โทรศัพท์และแท็บเล็ตเชื่อมด้วย Wi-Fi" }
    hints:
      - "สวิตช์ทำงานในวงเดียวกัน เราเตอร์ทำงานระหว่างวง"
      - "เครื่องที่ให้บริการเรียกว่าแม่ข่าย"
    solution: "สวิตช์ = เชื่อมเครื่องในวงเดียวกัน, เราเตอร์ = ส่งต่อระหว่างเครือข่าย, เซิร์ฟเวอร์ = ให้บริการตอบคำขอ, จุดเข้าใช้งานไร้สาย = ให้อุปกรณ์ต่อ Wi-Fi"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.internet-basics.p003
    topics: [computer.networks.internet-basics]
    difficulty: 2
    type: order
    stem: "ฟ้าส่งรูปให้ยายที่เชียงใหม่ เรียงสิ่งที่เกิดกับข้อมูลรูปนี้"
    items:
      - "แบ่งรูปเป็นแพ็กเก็ตเล็ก ๆ"
      - "ใส่ส่วนหัวบอกที่อยู่ผู้รับและลำดับที่ในแต่ละแพ็กเก็ต"
      - "เราเตอร์หลายตัวส่งต่อแพ็กเก็ต บางชิ้นไปคนละเส้นทาง"
      - "แพ็กเก็ตมาถึงโทรศัพท์ของยาย อาจไม่เรียงลำดับ"
      - "เรียงแพ็กเก็ตตามลำดับที่และขอส่งซ้ำชิ้นที่หาย"
      - "ประกอบเป็นรูปเดิมแล้วแสดงบนจอ"
    hints:
      - "ต้องแบ่งก่อนจึงจะติดป้ายแต่ละชิ้นได้"
      - "ประกอบกลับได้เมื่อมีชิ้นครบและเรียงแล้ว"
    solution: "แบ่งเป็นแพ็กเก็ต → ใส่ส่วนหัว → เราเตอร์ส่งต่อ → มาถึงไม่เรียง → เรียงและขอส่งซ้ำ → ประกอบกลับและแสดง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.internet-basics.p004
    topics: [computer.networks.internet-basics]
    difficulty: 2
    type: numeric
    stem: "รูปขนาด 6,000,000 ไบต์ ถูกแบ่งเป็นแพ็กเก็ตที่บรรจุข้อมูลได้แพ็กเก็ตละ 1,500 ไบต์ ต้องใช้กี่แพ็กเก็ต"
    answer: { value: 4000, unit: แพ็กเก็ต }
    hints:
      - "จำนวนแพ็กเก็ต = ขนาดข้อมูล ÷ ขนาดต่อแพ็กเก็ต"
      - "ถ้าหารไม่ลงตัวต้องปัดขึ้น แต่ข้อนี้ลงตัว"
    misconceptions:
      - { match: 4, feedback: "นับเลขศูนย์ผิด 6,000,000 ÷ 1,500 = 4,000" }
      - { match: 400, feedback: "นับเลขศูนย์ผิด 1,500 × 400 = 600,000 เท่านั้น" }
    solution: "6,000,000 ÷ 1,500 = 4,000 แพ็กเก็ต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.internet-basics.p005
    topics: [computer.networks.internet-basics]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นที่อยู่ IPv4 ที่ **ถูกต้อง**"
    choices:
      - { id: a, text: "192.168.10.25", correct: true }
      - { id: b, text: "192.168.256.1", feedback: "แต่ละชุดมี 8 บิต จึงมีค่าได้แค่ 0 ถึง 255 ค่า 256 เกิน" }
      - { id: c, text: "10.0.5", feedback: "IPv4 ต้องมีตัวเลข 4 ชุด ข้อนี้มีแค่ 3 ชุด" }
      - { id: d, text: "school.example", feedback: "เป็นชื่อโดเมน ต้องให้ DNS แปลเป็นที่อยู่ IP ก่อน" }
    hints:
      - "IPv4 มีตัวเลข 4 ชุด คั่นด้วยจุด"
      - "แต่ละชุดมีค่าได้ตั้งแต่ 0 ถึง 255"
    solution: "192.168.10.25 มี 4 ชุด และทุกชุดอยู่ในช่วง 0 ถึง 255 จึงถูกต้อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.internet-basics.p006
    topics: [computer.networks.internet-basics]
    difficulty: 2
    type: mcq
    stem: "เมื่อพิมพ์ชื่อเว็บไซต์ในเบราว์เซอร์ ระบบ **DNS** ทำหน้าที่อะไร"
    choices:
      - { id: a, text: "แปลชื่อเว็บไซต์ให้เป็นที่อยู่ IP ของเซิร์ฟเวอร์", correct: true }
      - { id: b, text: "เก็บหน้าเว็บทุกหน้าในโลกไว้", feedback: "หน้าเว็บเก็บอยู่ในเซิร์ฟเวอร์ของแต่ละเว็บ DNS แค่บอกที่อยู่" }
      - { id: c, text: "เข้ารหัสข้อมูลไม่ให้ใครอ่านได้", feedback: "การเข้ารหัสเป็นหน้าที่ของ HTTPS" }
      - { id: d, text: "แบ่งข้อมูลเป็นแพ็กเก็ต", feedback: "การแบ่งและเรียงแพ็กเก็ตเป็นงานของชั้นขนส่ง เช่น TCP" }
    hints:
      - "คอมพิวเตอร์ติดต่อกันด้วยตัวเลข แต่คนจำชื่อ"
      - "DNS เปรียบเหมือนสมุดโทรศัพท์"
    solution: "DNS แปลชื่อโดเมนเป็นที่อยู่ IP เบราว์เซอร์จึงรู้ว่าต้องส่งคำขอไปที่เครื่องใด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.internet-basics.p007
    topics: [computer.networks.internet-basics]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนตั้งแต่พิมพ์ชื่อเว็บไซต์ จนหน้าเว็บแสดงบนจอ"
    items:
      - "เบราว์เซอร์ถาม DNS หาที่อยู่ IP ของชื่อเว็บ"
      - "เปิดการเชื่อมต่อ TCP กับเซิร์ฟเวอร์"
      - "ส่งคำขอ HTTP ขอหน้าเว็บ"
      - "เซิร์ฟเวอร์ตอบรหัส 200 พร้อมเนื้อหาหน้าเว็บ"
      - "เบราว์เซอร์ประกอบแพ็กเก็ตและแสดงหน้าเว็บ"
    hints:
      - "ต้องรู้ที่อยู่ก่อนจึงจะเชื่อมต่อได้"
      - "ต้องเชื่อมต่อก่อนจึงจะส่งคำขอได้"
    solution: "DNS → เชื่อมต่อ TCP → คำขอ HTTP → แม่ข่ายตอบ 200 → แสดงผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.internet-basics.p008
    topics: [computer.networks.internet-basics]
    difficulty: 3
    type: numeric
    stem: "ที่อยู่ IPv4 ยาว 32 บิต มีที่อยู่ได้ทั้งหมดกี่ **ล้าน** ที่อยู่ (ตอบเป็นจำนวนล้าน ปัดเป็นจำนวนเต็ม)"
    answer: { value: 4295, tolerance: 1, unit: ล้าน }
    hints:
      - "n บิตแทนค่าได้ $2^n$ แบบ"
      - "คำนวณ $2^{32}$ แล้วหารด้วย 1,000,000"
    misconceptions:
      - { match: 0.000032, feedback: "นำ 32 หารล้าน ต้องใช้ $2^{32}$ ไม่ใช่ 32" }
      - { match: 1020, feedback: "คิดว่า 4 ชุดชุดละ 0 ถึง 255 บวกกัน (4 × 255) ต้องคูณกัน คือ $256^4 = 2^{32}$" }
    solution: "$2^{32}$ = 4,294,967,296 ≈ 4,295 ล้านที่อยู่ ซึ่งน้อยกว่าจำนวนอุปกรณ์ในโลก จึงมี IPv6 ที่ยาว 128 บิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.internet-basics.p009
    topics: [computer.networks.internet-basics]
    difficulty: 3
    type: match
    stem: "จับคู่โพรโทคอลกับหน้าที่"
    pairs:
      - { left: "HTTP", right: "ขอและส่งหน้าเว็บ" }
      - { left: "DNS", right: "แปลชื่อโดเมนเป็นที่อยู่ IP" }
      - { left: "TCP", right: "ตรวจว่าข้อมูลมาครบและเรียงถูก ส่งซ้ำเมื่อหาย" }
      - { left: "IP", right: "ใส่ที่อยู่และพาแพ็กเก็ตข้ามเครือข่าย" }
    hints:
      - "HTTP และ DNS อยู่ชั้นแอปพลิเคชัน TCP อยู่ชั้นขนส่ง"
      - "IP เป็นชื่อเดียวกับที่อยู่ IP"
    solution: "HTTP = หน้าเว็บ, DNS = แปลชื่อ, TCP = ส่งให้ครบและเรียงถูก, IP = ที่อยู่และการหาเส้นทาง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.internet-basics.p010
    topics: [computer.networks.internet-basics]
    difficulty: 3
    type: mcq
    stem: "ครูสอนออนไลน์ผ่านวิดีโอคอลสด แอปเลือกใช้ UDP เป็นส่วนใหญ่แทน TCP เพราะเหตุใด"
    choices:
      - { id: a, text: "วิดีโอคอลต้องการความเร็ว แพ็กเก็ตที่หายไปเล็กน้อยทำให้ภาพกระตุกนิดเดียว ดีกว่ารอส่งซ้ำจนภาพช้ากว่าเวลาจริง", correct: true }
      - { id: b, text: "UDP รับประกันว่าข้อมูลครบทุกชิ้น", feedback: "UDP ไม่ตรวจและไม่ส่งซ้ำ TCP คือโพรโทคอลที่ทำให้ข้อมูลครบ" }
      - { id: c, text: "UDP เข้ารหัสข้อมูลให้ปลอดภัย", feedback: "UDP ไม่ได้เข้ารหัสเอง การเข้ารหัสทำในชั้นอื่น" }
      - { id: d, text: "TCP ใช้กับวิดีโอไม่ได้เลย", feedback: "ใช้ได้ เช่น ดูคลิปที่บันทึกไว้มักใช้ TCP แต่ของสดต้องการความหน่วงต่ำ" }
    hints:
      - "TCP รอส่งซ้ำชิ้นที่หาย UDP ไม่รอ"
      - "งานสดหรืองานที่ต้องครบทุกไบต์ อะไรสำคัญกว่ากัน"
    solution: "การคุยสดต้องการความหน่วงต่ำ ถ้ารอส่งซ้ำ ภาพและเสียงจะช้ากว่าเหตุการณ์จริง UDP จึงเหมาะกว่า ส่วนไฟล์และหน้าเว็บต้องครบทุกไบต์จึงใช้ TCP"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.internet-basics.p011
    topics: [computer.networks.internet-basics]
    difficulty: 3
    type: numeric
    stem: "ในเครือข่ายเราเตอร์ตามภาพ แพ็กเก็ตจาก A ไป F ต้องผ่านสายอย่างน้อยกี่ช่วง (นับจำนวนสายที่ผ่าน)"
    figure:
      src: mesh-net.svg
      alt: "เครือข่ายเราเตอร์หกตัว A B C D E F สายเชื่อม 8 เส้น คือ A กับ B, A กับ C, B กับ C, B กับ D, C กับ D, C กับ E, D กับ F และ E กับ F"
    answer: { value: 3, unit: ช่วง }
    hints:
      - "จาก A ไปได้ B หรือ C จากนั้นต้องถึง D หรือ E ก่อนเข้า F"
      - "นับจำนวนเส้น ไม่ใช่จำนวนเราเตอร์"
    misconceptions:
      - { match: 4, feedback: "นับจำนวนเราเตอร์บนเส้นทาง (เช่น A, B, D, F = 4 ตัว) แต่โจทย์ถามจำนวนสาย" }
      - { match: 2, feedback: "ไม่มีเราเตอร์ตัวใดต่อกับทั้ง A และ F โดยตรง จึงต้องผ่านอย่างน้อย 3 สาย" }
    solution: "เส้นทางที่สั้นที่สุดมีหลายทาง เช่น A → B → D → F, A → C → D → F, A → C → E → F แต่ละทางผ่าน 3 สาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.internet-basics.p012
    topics: [computer.networks.internet-basics]
    difficulty: 4
    type: mcq
    stem: "ห้องคอมพิวเตอร์ 40 เครื่องต่อแบบดาวกับสวิตช์ตัวเดียว ถ้าสวิตช์เสีย จะเกิดอะไรขึ้น และควรแก้แบบใดถ้าต้องการให้ทนทานขึ้น"
    choices:
      - { id: a, text: "ทุกเครื่องในห้องหลุดจากเครือข่าย ควรมีสวิตช์สำรอง หรือแบ่งเครื่องเป็นสองกลุ่มต่อสวิตช์สองตัวที่มีทางเชื่อมขึ้นไปคนละเส้น", correct: true }
      - { id: b, text: "เฉพาะเครื่องที่อยู่ใกล้สวิตช์ที่สุดหลุด", feedback: "ในแบบดาวทุกเครื่องผ่านศูนย์กลาง สวิตช์เสียจึงกระทบทุกเครื่อง" }
      - { id: c, text: "ไม่มีผล เพราะข้อมูลอ้อมไปเส้นทางอื่นได้เอง", feedback: "แบบดาวไม่มีเส้นทางสำรอง การอ้อมทำได้ในแบบตาข่าย" }
      - { id: d, text: "ทุกเครื่องหลุด ควรเปลี่ยนเป็นแบบบัสสายเดียว", feedback: "แบบบัสมีจุดอ่อนที่สายหลัก สายขาดก็หลุดทั้งวงเช่นกัน" }
    hints:
      - "แบบดาวมีจุดศูนย์กลางเพียงจุดเดียว"
      - "ความทนทานเกิดจากการมีเส้นทางหรืออุปกรณ์สำรอง"
    solution: "แบบดาวพึ่งศูนย์กลางจุดเดียว สวิตช์เสียทุกเครื่องหลุด การเพิ่มอุปกรณ์หรือเส้นทางสำรองช่วยลดจุดเสียจุดเดียว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.internet-basics.p013
    topics: [computer.networks.internet-basics]
    difficulty: 4
    type: numeric
    stem: "ถ้าจะต่อเราเตอร์ 6 ตัวแบบตาข่ายเต็มรูป (ทุกคู่มีสายตรงถึงกัน) ต้องใช้สายกี่เส้น"
    answer: { value: 15, unit: เส้น }
    hints:
      - "แต่ละตัวต่อกับอีก 5 ตัว"
      - "สายหนึ่งเส้นเชื่อมสองตัว จึงนับซ้ำ ต้องหารด้วย 2"
    misconceptions:
      - { match: 30, feedback: "6 × 5 นับสายแต่ละเส้นสองครั้ง (จากปลายทั้งสองข้าง) ต้องหาร 2" }
      - { match: 36, feedback: "6 × 6 รวมการต่อกับตัวเองและนับซ้ำ" }
    solution: "สาย = 6 × 5 ÷ 2 = 15 เส้น ตาข่ายเต็มรูปทนทานแต่ใช้สายมาก จึงใช้เฉพาะจุดสำคัญ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.internet-basics.p014
    topics: [computer.networks.internet-basics]
    difficulty: 4
    type: mcq
    stem: "นักเรียนคลิกลิงก์ในเว็บโรงเรียนแล้วเห็นหน้า \"404 Not Found\" ข้อใดอธิบายได้ถูกต้อง"
    choices:
      - { id: a, text: "เบราว์เซอร์ติดต่อแม่ข่ายได้ แต่แม่ข่ายไม่พบหน้าที่ขอ เช่น ลิงก์ผิดหรือหน้าถูกลบ", correct: true }
      - { id: b, text: "อินเทอร์เน็ตของนักเรียนหลุด", feedback: "ถ้าเน็ตหลุด จะไม่ได้รับคำตอบจากแม่ข่ายเลย การได้รหัส 404 แปลว่าแม่ข่ายตอบกลับมาแล้ว" }
      - { id: c, text: "DNS แปลชื่อไม่สำเร็จ", feedback: "ถ้า DNS ล้มเหลว เบราว์เซอร์จะหาแม่ข่ายไม่เจอ และไม่ได้รหัส 404 จากแม่ข่าย" }
      - { id: d, text: "หน้าเว็บโหลดสำเร็จตามปกติ", feedback: "สำเร็จคือรหัส 200" }
    hints:
      - "ใครเป็นผู้ส่งรหัส 404 กลับมา"
      - "รหัส 200 คือสำเร็จ รหัสขึ้นต้นด้วย 4 คือคำขอมีปัญหา"
    solution: "รหัส 404 มาจากแม่ข่าย แปลว่าการเชื่อมต่อและ DNS ทำงานแล้ว แต่ไม่มีหน้าตามที่อยู่ที่ขอ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.internet-basics.p015
    topics: [computer.networks.internet-basics]
    difficulty: 4
    type: numeric
    stem: "จากภาพเครือข่ายเราเตอร์ ถ้าสายระหว่าง D กับ F ขาด จะเหลือเส้นทางจาก A ไป F ที่ไม่ผ่านเราเตอร์ตัวใดซ้ำกี่เส้นทาง"
    figure:
      src: mesh-net.svg
      alt: "เครือข่ายเราเตอร์หกตัว A B C D E F สายเชื่อม 8 เส้น คือ A กับ B, A กับ C, B กับ C, B กับ D, C กับ D, C กับ E, D กับ F และ E กับ F"
    answer: { value: 3, unit: เส้นทาง }
    hints:
      - "เมื่อ D–F ขาด ทุกเส้นทางต้องเข้า F ผ่าน E และเข้า E ได้จาก C เท่านั้น"
      - "จึงนับว่าจาก A ไป C โดยไม่ซ้ำตัวมีกี่ทาง"
    misconceptions:
      - { match: 7, feedback: "7 คือจำนวนเส้นทางก่อนสายขาด ต้องตัดทางที่ใช้สาย D–F ออก" }
      - { match: 1, feedback: "นับแค่ A → C → E → F ยังมีทางที่ไปถึง C ผ่าน B และ D ได้" }
    solution: "ต้องจบด้วย C → E → F ส่วนจาก A ไป C มี 3 ทาง: A → C, A → B → C, A → B → D → C ได้ 3 เส้นทาง เครือข่ายจึงยังส่งข้อมูลได้แม้สายขาด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.internet-basics.p016
    topics: [computer.networks.internet-basics]
    difficulty: 5
    type: mcq
    stem: "อินเทอร์เน็ตมีอุปกรณ์หลายพันล้านเครื่อง แต่เราเตอร์แต่ละตัวไม่ต้องจำเส้นทางไปทุกเครื่อง ข้อใดอธิบายเหตุผลที่ทำให้อินเทอร์เน็ต **ขยายได้** ดีที่สุด"
    choices:
      - { id: a, text: "ที่อยู่ IP แบ่งเป็นเครือข่ายย่อยเป็นลำดับชั้น เราเตอร์จำแค่ว่าจะส่งกลุ่มที่อยู่แต่ละกลุ่มไปทางใด และไม่มีศูนย์กลางเดียวที่ทุกอย่างต้องผ่าน", correct: true }
      - { id: b, text: "มีเซิร์ฟเวอร์กลางตัวเดียวที่รู้จักทุกเครื่องในโลก", feedback: "ถ้ามีศูนย์กลางเดียวจะเป็นคอขวดและจุดเสียจุดเดียว อินเทอร์เน็ตไม่ได้ออกแบบแบบนั้น" }
      - { id: c, text: "ทุกเครื่องต่อสายตรงถึงกันหมด", feedback: "เป็นไปไม่ได้ จำนวนสายจะเป็น n(n − 1) ÷ 2 ซึ่งมหาศาล" }
      - { id: d, text: "แพ็กเก็ตทุกชิ้นใช้เส้นทางเดียวกันเสมอ", feedback: "ไม่ช่วยการขยาย และทำให้ไม่ทนทานเมื่อเส้นทางนั้นเสีย" }
    hints:
      - "ลองเทียบกับการส่งจดหมาย บุรุษไปรษณีย์ดูรหัสไปรษณีย์ก่อน ยังไม่ต้องรู้บ้านทุกหลัง"
      - "การจัดที่อยู่เป็นลำดับชั้นทำให้รวมหลายเครื่องเป็นกลุ่มเดียว"
    solution: "ที่อยู่แบบลำดับชั้นทำให้เราเตอร์จำเป็นกลุ่ม (เครือข่ายย่อย) ไม่ต้องจำทีละเครื่อง และการไม่มีศูนย์กลางเดียวทำให้เพิ่มเครือข่ายใหม่ได้เรื่อย ๆ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.internet-basics.p017
    topics: [computer.networks.internet-basics]
    difficulty: 5
    type: numeric
    stem: "ไฟล์ขนาด 1,000,000 ไบต์ ถูกแบ่งเป็นแพ็กเก็ตที่บรรจุข้อมูลได้แพ็กเก็ตละ 1,460 ไบต์ และทุกแพ็กเก็ตมีส่วนหัว 40 ไบต์ ส่งผ่านลิงก์ความเร็ว 8 Mbps (8,000,000 บิตต่อวินาที) ใช้เวลาส่งกี่วินาที (ไม่คิดเวลารอระหว่างทาง)"
    answer: { value: 1.0274, tolerance: 0.005, unit: วินาที }
    hints:
      - "จำนวนแพ็กเก็ต = ปัดเศษขึ้น(1,000,000 ÷ 1,460) แล้วหาจำนวนไบต์ของส่วนหัวรวม"
      - "แปลงไบต์ทั้งหมดเป็นบิต (× 8) แล้วหารด้วยความเร็ว"
    misconceptions:
      - { match: 1, feedback: "ลืมส่วนหัวของแพ็กเก็ต ทุกแพ็กเก็ตต้องส่งส่วนหัว 40 ไบต์ด้วย" }
      - { match: 0.1284, feedback: "ไม่ได้แปลงไบต์เป็นบิต ความเร็ว 8 Mbps เป็นบิตต่อวินาที" }
    solution: "1,000,000 ÷ 1,460 = 684.9 ปัดขึ้นเป็น 685 แพ็กเก็ต ส่วนหัวรวม 685 × 40 = 27,400 ไบต์ ข้อมูลรวม 1,027,400 ไบต์ = 8,219,200 บิต เวลา 8,219,200 ÷ 8,000,000 ≈ 1.027 วินาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.internet-basics.p018
    topics: [computer.networks.internet-basics]
    difficulty: 4
    type: mcq
    stem: "ต้นนั่งที่ร้านกาแฟและใช้ Wi-Fi ฟรีที่ไม่มีรหัสผ่าน แล้วจะเข้าแอปธนาคาร ข้อใดถูกต้องเรื่องความปลอดภัยของข้อมูลระหว่างส่ง"
    choices:
      - { id: a, text: "Wi-Fi ที่ไม่มีรหัสไม่ได้เข้ารหัสคลื่น คนใกล้ ๆ อาจดักข้อมูลได้ จึงควรใช้แต่การเชื่อมต่อที่เข้ารหัส เช่น HTTPS หรือใช้เน็ตมือถือแทนเมื่อทำธุรกรรม", correct: true }
      - { id: b, text: "ปลอดภัยเสมอ เพราะร้านกาแฟเป็นที่สาธารณะ", feedback: "การเป็นที่สาธารณะยิ่งมีคนแปลกหน้าอยู่ในเครือข่ายเดียวกันมาก" }
      - { id: c, text: "ข้อมูลส่งผ่านสาย จึงไม่มีใครดักได้", feedback: "Wi-Fi ส่งผ่านคลื่นในอากาศ ใครในระยะสัญญาณก็รับได้" }
      - { id: d, text: "แพ็กเก็ตแบ่งเป็นชิ้นเล็ก จึงไม่มีใครอ่านรู้เรื่อง", feedback: "การแบ่งแพ็กเก็ตไม่ใช่การเข้ารหัส ถ้าดักได้ครบก็ประกอบกลับได้" }
    hints:
      - "ข้อมูลบน Wi-Fi เดินทางผ่านอะไร"
      - "อะไรทำให้คนที่ดักข้อมูลได้อ่านไม่ออก"
    solution: "Wi-Fi ที่ไม่ตั้งรหัสไม่ได้เข้ารหัสคลื่น ผู้อื่นในระยะอาจดักแพ็กเก็ตได้ การใช้ HTTPS ทำให้ข้อมูลถูกเข้ารหัสระหว่างทาง และการใช้เน็ตมือถือช่วยหลีกเลี่ยงเครือข่ายที่ไม่น่าไว้ใจ"
    license: CC-BY-SA-4.0
    ai_assisted: true
