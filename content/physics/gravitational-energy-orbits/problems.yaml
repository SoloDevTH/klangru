problems:
- id: physics.dynamics.gravitational-energy-orbits.p001
  topics:
  - physics.dynamics.gravitational-energy-orbits
  difficulty: 2
  type: numeric
  stem: จรวดขึ้นจากผิวโลกต้องมีอัตราเร็วต่ำสุดเท่าใดจึงหลุดจากแรงโน้มถ่วงของโลกได้ โดยไม่คิดแรงต้านอากาศและไม่มีแรงขับเพิ่มหลังปล่อย กำหนด $G = 6.674\times10^{-11}\,\mathrm{N\,m^2/kg^2}$, $M_\mathrm{E} = 5.972\times10^{24}\,\mathrm{kg}$ และ $R_\mathrm{E} = 6.371\times10^{6}\,\mathrm{m}$ ตอบเป็น $\mathrm{km/s}$
  hints:
  - พลังงานรวมที่หลุดพ้นได้ต้องไม่ต่ำกว่าศูนย์ เพราะพลังงานศักย์ที่ระยะอนันต์เป็นศูนย์
  - ที่ผิวโลก $U = -\dfrac{GMm}{R}$ และพลังงานจลน์ต้องมีค่าเท่ากับ $\dfrac{GMm}{R}$ พอดี
  - จัดรูป $v = \sqrt{\dfrac{2GM}{R}}$ แล้วแทนค่าเป็นหน่วย m/s ก่อนแปลงเป็น km/s
  answer:
    value: 11.186
    tolerance: 0.02
    unit: km/s
  misconceptions:
  - match: 7.91
    feedback: ได้ค่าอัตราเร็ววงโคจรวงกลมที่ผิวโลก $\sqrt{GM/R}$ ซึ่งขาดตัว 2 ในราก อัตราเร็วหลุดพ้นต้องมีตัวนี้
  - match: 15.82
    feedback: ใส่ 2 นอกรากแทนที่จะอยู่ใน $\sqrt{2GM/R}$ ทำให้ค่าสูงเกินจริงเป็นสองเท่า
  solution: $v_\mathrm{esc} = \sqrt{\dfrac{2GM_\mathrm{E}}{R_\mathrm{E}}} = \sqrt{\dfrac{2(6.674\times10^{-11})(5.972\times10^{24})}{6.371\times10^{6}}} \approx 1.119e+04\,\mathrm{m/s} = 11.19\,\mathrm{km/s}$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: physics.dynamics.gravitational-energy-orbits.p002
  topics:
  - physics.dynamics.gravitational-energy-orbits
  difficulty: 1
  type: numeric
  stem: ดาวเทียมที่โคจรเป็นวงกลมเฉียดผิวโลกมาก ๆ มีอัตราเร็วประมาณเท่าใด กำหนด $g = 9.8\,\mathrm{m/s^2}$ และ $R_\mathrm{E} = 6.371\times10^{6}\,\mathrm{m}$ ตอบเป็น $\mathrm{km/s}$
  hints:
  - แรงโน้มถ่วงทำหน้าที่เป็นแรงสู่ศูนย์กลาง คือ $mg = \dfrac{mv^2}{R}$
  - ตัดมวล $m$ ออกแล้วจัดรูปหา $v^2$
  - ได้ $v = \sqrt{gR}$ จากนั้นแทนค่าและแปลงเป็น km/s
  answer:
    value: 7.902
    tolerance: 0.02
    unit: km/s
  misconceptions:
  - match: 7901.6
    feedback: ค่าที่ได้เป็นเมตรต่อวินาที (ประมาณ 7901 m/s) ต้องหารด้วย 1000 เพื่อตอบเป็นกิโลเมตรต่อวินาที
  solution: แรงสู่ศูนย์กลางคือแรงโน้มถ่วง $mg = mv^2/R$ จึงได้ $v = \sqrt{gR} = \sqrt{9.8 \times 6.371\times10^{6}} \approx 7902\,\mathrm{m/s} = 7.90\,\mathrm{km/s}$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: physics.dynamics.gravitational-energy-orbits.p003
  topics:
  - physics.dynamics.gravitational-energy-orbits
  difficulty: 2
  type: numeric
  stem: ดาวเทียมมวล $1000\,\mathrm{kg}$ โคจรอยู่สูง $400\,\mathrm{km}$ เหนือผิวโลก พลังงานศักย์โน้มถ่วงของดาวเทียมมีค่าเท่าใด (กำหนดให้ $U = 0$ ที่ระยะอนันต์) ตอบเป็น $\mathrm{GJ}$ (กิกะจูล) ใช้ค่า $GM_\mathrm{E} = 3.986\times10^{14}\,\mathrm{m^3/s^2}$
  hints:
  - ระยะจากจุดศูนย์กลางโลกถึงดาวเทียมไม่ใช่ $400\,\mathrm{km}$ แต่ต้องบวกด้วยรัศมีโลก
  - ใช้สูตร $U = -\dfrac{GMm}{r}$ โดย $r = R_\mathrm{E} + h$
  - แทนค่า $GM$, $m$ และ $r$ เป็นหน่วย SI แล้วหารด้วย $10^9$ เพื่อให้ได้ GJ
  answer:
    value: -58.87
    tolerance: 0.6
    unit: GJ
  misconceptions:
  - match: -3.92
    feedback: ใช้ $mgh$ ซึ่งวัดจากผิวโลกและเป็นการประมาณใกล้ผิวโลก ไม่ได้ตั้งศูนย์ที่ระยะอนันต์ ค่า $U$ ที่ 400 km จึงต่างจากนี้มาก
  - match: -62.56
    feedback: ลืมเพิ่มความสูงของวงโคจร แล้วใช้ $r = R_\mathrm{E}$ ทำให้ค่าลึกเกินจริง
  solution: $r = R_\mathrm{E} + h = 6.771\times10^{6}\,\mathrm{m}$ และ $U = -\dfrac{(3.986\times10^{14})(1000)}{6.771\times10^{6}} \approx -5.887e+10\,\mathrm{J} = -58.87\,\mathrm{GJ}$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: physics.dynamics.gravitational-energy-orbits.p004
  topics:
  - physics.dynamics.gravitational-energy-orbits
  difficulty: 2
  type: numeric
  stem: จากดาวเทียมมวล $1000\,\mathrm{kg}$ ในข้อก่อนหน้า (สูง $400\,\mathrm{km}$ โคจรเป็นวงกลม) พลังงานรวม $E = K + U$ ของดาวเทียมมีค่าเท่าใด ตอบเป็น $\mathrm{GJ}$
  hints:
  - ในวงโคจรวงกลม แรงโน้มถ่วงเป็นแรงสู่ศูนย์กลางทำให้ $K = \dfrac{GMm}{2r}$
  - รวมกับ $U = -\dfrac{GMm}{r}$ แล้วได้พลังงานรวมในรูปเดียวกับสูตร $E = -\dfrac{GMm}{2r}$
  - แทนค่า $r = 6.771\times10^{6}\,\mathrm{m}$ แล้วคำนวณเป็น GJ โดยเก็บเครื่องหมายลบไว้
  answer:
    value: -29.43
    tolerance: 0.3
    unit: GJ
  misconceptions:
  - match: -58.87
    feedback: นั่นคือ $U$ ไม่ใช่ $E$ ลืมว่าพลังงานจลน์มีค่าเป็นครึ่งหนึ่งของค่าสัมบูรณ์ของ $U$
  - match: 29.43
    feedback: ลืมเครื่องหมายลบ พลังงานรวมของวงโคจรที่ผูกไว้กับโลกเป็นลบ
  solution: $K = -\tfrac12 U$ จึงได้ $E = U + K = \tfrac12 U = -\dfrac{GMm}{2r} = -\dfrac{(3.986\times10^{14})(1000)}{2(6.771\times10^{6})} \approx -29.43\,\mathrm{GJ}$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: physics.dynamics.gravitational-energy-orbits.p005
  topics:
  - physics.dynamics.gravitational-energy-orbits
  difficulty: 2
  type: expression
  stem: จากวงโคจรวงกลม $v^2 = \dfrac{GM}{r}$ จงจัดรูปหา $r$ ให้อยู่ข้างเดียว
  hints:
  - ต้องการให้ $r$ อยู่ในตัวเศษหรือตัวส่วน ดูว่า $r$ อยู่ที่ใดในสมการเดิม
  - คูณทั้งสองข้างด้วย $r$ แล้วหารทั้งสองข้างด้วย $v^2$
  - ได้ $r = \dfrac{GM}{v^2}$ ตรวจว่าหน่วยของทั้งสองข้างเป็น m เมื่อ $GM$ มีหน่วย $\mathrm{m^3/s^2}$
  answer:
    latex: \frac{GM}{v^2}
    variables:
    - G
    - M
    - v
  prefix: r =
  misconceptions:
  - match: \frac{v^2}{GM}
    feedback: กลับเศษส่วนทั้งก้อน $r$ ควรอยู่ในตัวเศษ เพราะ $r$ เป็นผลหารของ $GM$ ด้วย $v^2$
  - match: \frac{GM}{v}
    feedback: ลืมยกกำลังสองของ $v$ เมื่อย้ายข้าม ต้องหารด้วย $v^2$ ไม่ใช่ $v$
  solution: คูณสองข้างด้วย $r$ ได้ $rv^2 = GM$ แล้วหารด้วย $v^2$ จะได้ $r = \dfrac{GM}{v^2}$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: physics.dynamics.gravitational-energy-orbits.p006
  topics:
  - physics.dynamics.gravitational-energy-orbits
  difficulty: 2
  type: order
  stem: เรียงพลังงานรวม $E$ ของวัตถุในสามกรณีต่อไปนี้จากต่ำที่สุดไปสูงที่สุด (ก) วงโคจรวงกลมรัศมีเล็ก (ข) วงโคจรวงกลมรัศมีใหญ่กว่า (ค) วัตถุที่หลุดพ้นไปได้ ซึ่งมี $E = 0$
  hints:
  - ในวงโคจรวงกลม $E = -\dfrac{GMm}{2r}$ ดังนั้นรัศมียิ่งเล็ก $E$ ยิ่งลบมาก
  - วัตถุหลุดพ้นมี $E$ เท่ากับศูนย์ เป็นค่าสูงกว่าการโคจรที่ถูกผูกไว้ทั้งหมด
  - เรียงจากรัศมีเล็กไปใหญ่แล้วจบที่กรณีหลุดพ้น
  items:
  - วงโคจรวงกลมรัศมีเล็ก
  - วงโคจรวงกลมรัศมีใหญ่กว่า
  - วัตถุที่หลุดพ้นไปได้ (E = 0)
  solution: วงโคจรวงกลม $E = -\dfrac{GMm}{2r}$ เมื่อ $r$ เล็ก $E$ ลบมาก จึงต่ำกว่า วงโคจรรัศมีใหญ่มี $E$ ลบน้อยกว่า และหลุดพ้นมี $E = 0$ ลำดับจากต่ำไปสูงคือ (ก), (ข), (ค)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: physics.dynamics.gravitational-energy-orbits.p007
  topics:
  - physics.dynamics.gravitational-energy-orbits
  difficulty: 1
  type: match
  stem: จับคู่กฎของเคปเลอร์แต่ละข้อกับข้อความที่ตรงกับกฎนั้น
  hints:
  - กฎข้อที่หนึ่งพูดถึงรูปร่างของวงโคจร
  - กฎข้อที่สองพูดถึงอัตราการกวาดพื้นที่
  - กฎข้อที่สามพูดถึงความสัมพันธ์ระหว่างคาบกับระยะทาง
  pairs:
  - left: กฎข้อที่หนึ่ง
    right: วงโคจรเป็นวงรี และดวงอาทิตย์อยู่ที่จุดโฟกัสจุดหนึ่ง
  - left: กฎข้อที่สอง
    right: เส้นที่ลากจากดาวไปดวงอาทิตย์กวาดพื้นที่เท่ากันในเวลาเท่ากัน
  - left: กฎข้อที่สาม
    right: กำลังสองของคาบแปรผันตรงกับกำลังสามของกึ่งแกนเอก
  solution: กฎข้อที่หนึ่ง (วงรี) กฎข้อที่สอง (พื้นที่เท่ากันในเวลาเท่ากัน) และกฎข้อที่สาม ($T^2 \propto a^3$)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: physics.dynamics.gravitational-energy-orbits.p008
  topics:
  - physics.dynamics.gravitational-energy-orbits
  difficulty: 3
  type: numeric
  stem: ดาวเคราะห์น้อยดวงหนึ่งโคจรรอบดวงอาทิตย์ด้วยคาบ $4$ ปี กึ่งแกนเอกของวงโคจรมีค่ากี่หน่วยดาราศาสตร์ (AU) โดย $1\,\mathrm{AU}$ คือกึ่งแกนเอกของโลก ตอบเป็น $\mathrm{AU}$
  hints:
  - กฎข้อที่สามเขียนได้ $T^2 \propto a^3$ โดยมีค่าคงที่สัดส่วนเดียวกันสำหรับวัตถุทุกดวงรอบดวงอาทิตย์
  - เมื่อวัด $T$ เป็นปี และ $a$ เป็น AU ค่าคงที่สัดส่วนคือ $1$ พอดี ไม่ต้องใช้ค่า $G$
  - ดังนั้น $a^3 = T^2$ จึงได้ $a = T^{2/3}$
  answer:
    value: 2.52
    tolerance: 0.03
    unit: AU
  misconceptions:
  - match: 1.587
    feedback: ถอดรากที่สามของ $T$ โดยตรง ได้ $a = T^{1/3}$ แต่สมการคือ $a^3 = T^2$ ต้องยกกำลัง $2/3$
  - match: 16
    feedback: ยกกำลังสองให้ $a$ แทนที่จะเป็น $a^3 = T^2$ ทำให้ได้ค่าสูงเกินจริงมาก
  solution: $a^3 = T^2 = 4^2 = 16$ จึงได้ $a = 16^{1/3} = 4^{2/3} \approx 2.520\,\mathrm{AU}$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: physics.dynamics.gravitational-energy-orbits.p009
  topics:
  - physics.dynamics.gravitational-energy-orbits
  difficulty: 4
  type: numeric
  stem: โลกโคจรรอบดวงอาทิตย์เป็นวงรีมีกึ่งแกนเอก $a = 1.496\times10^{11}\,\mathrm{m}$ และความเยื้องศูนย์กลาง $e = 0.0167$ จงหาอัตราเร็วของโลกที่จุดใกล้ดวงอาทิตย์ที่สุด (perihelion) ตอบเป็น $\mathrm{km/s}$ กำหนด $GM_\mathrm{S} = 1.327\times10^{20}\,\mathrm{m^3/s^2}$
  hints:
  - ระยะที่ใกล้ดวงอาทิตย์ที่สุดคือ $r_p = a(1-e)$
  - พลังงานรวมต่อหน่วยมวลของวงรีเท่ากับ $\tfrac12 v^2 - \dfrac{GM}{r} = -\dfrac{GM}{2a}$ ซึ่งคงที่ตลอดวงโคจร
  - แก้สมการพลังงานหา $v_p$ จากนั้นแปลงเป็น km/s
  answer:
    value: 30.28
    tolerance: 0.3
    unit: km/s
  misconceptions:
  - match: 29.78
    feedback: ใช้อัตราเร็ววงโคจรวงกลมที่รัศมี $a$ แทนค่าที่จุดใกล้ที่สุด ซึ่งโลกเร็วกว่านั้นเพราะอยู่ใกล้ดวงอาทิตย์มากขึ้น
  solution: $r_p = a(1-e) \approx 1.4710e+11\,\mathrm{m}$ แล้วจาก $\tfrac12 v_p^2 = GM(\tfrac{1}{r_p} - \tfrac{1}{2a})$ ได้ $v_p \approx 30.28\,\mathrm{km/s}$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: physics.dynamics.gravitational-energy-orbits.p010
  topics:
  - physics.dynamics.gravitational-energy-orbits
  difficulty: 4
  type: numeric
  stem: โลกมีอัตราเร็ว $30.29\,\mathrm{km/s}$ ที่จุดใกล้ดวงอาทิตย์ที่สุด ซึ่งห่าง $r_p = 1.471\times10^{11}\,\mathrm{m}$ และห่าง $r_a = 1.521\times10^{11}\,\mathrm{m}$ ที่จุดไกลที่สุด จงหาอัตราเร็วที่จุดไกลที่สุด ตอบเป็น $\mathrm{km/s}$
  hints:
  - การอนุรักษ์โมเมนตัมเชิงมุม $L = mvr$ ให้ $v_p r_p = v_a r_a$ โดยตรง
  - กฎพื้นที่เท่ากันของเคปเลอร์เป็นผลจากข้อนี้
  - จัดสมการหา $v_a$ จากนั้นแทนค่าและแปลงหน่วย
  answer:
    value: 29.29
    tolerance: 0.03
    unit: km/s
  misconceptions:
  - match: 30.29
    feedback: ถือว่าอัตราเร็วคงที่ตลอดวงโคจร ซึ่งขัดกับการอนุรักษ์โมเมนตัมเชิงมุม
  - match: 31.32
    feedback: ใส่อัตราส่วน $r$ กลับด้าน ต้องได้ $v_a = v_p r_p / r_a$ ซึ่งจะน้อยกว่า $v_p$ เพราะ $r_a$ ใหญ่กว่า
  solution: จาก $v_p r_p = v_a r_a$ ได้ $v_a = v_p \dfrac{r_p}{r_a} = 30.29 \times \dfrac{1.471}{1.521} \approx 29.29\,\mathrm{km/s}$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: physics.dynamics.gravitational-energy-orbits.p011
  topics:
  - physics.dynamics.gravitational-energy-orbits
  difficulty: 4
  type: numeric
  stem: นักเรียนศึกษาน้ำขึ้นน้ำลงที่ชายฝั่งอ่าวไทย ดวงจันทร์มีมวล $7.342\times10^{22}\,\mathrm{kg}$ อยู่ห่างจากโลก $3.844\times10^{8}\,\mathrm{m}$ จงประมาณความเร่งไทดัลที่ผิวโลกด้านที่หันเข้าหาดวงจันทร์เทียบกับจุดศูนย์กลางโลก ตอบเป็น $\mu\mathrm{m/s^2}$ (ไมโครเมตรต่อวินาทียกกำลังสอง) โดยใช้ $R_\mathrm{E} = 6.371\times10^{6}\,\mathrm{m}$ และ $G = 6.674\times10^{-11}\,\mathrm{N\,m^2/kg^2}$
  hints:
  - ความเร่งจากดวงจันทร์ที่ระยะ $r$ คือ $a(r) = \dfrac{GM_\mathrm{m}}{r^2}$
  - ผลต่างความเร่งระหว่างผิวด้านใกล้กับจุดศูนย์กลางโดยประมาณ $\approx \left|\dfrac{da}{dr}\right|\Delta r$ โดย $\Delta r = R_\mathrm{E}$
  - ทำอนุพันธ์ $\dfrac{da}{dr} = -\dfrac{2GM_\mathrm{m}}{r^3}$ แล้วแทนค่า $r = d$ และหน่วย $\mu\mathrm{m/s^2} = 10^{6}\,\mathrm{m/s^2}$
  answer:
    value: 1.1
    tolerance: 0.02
    unit: μm/s^2
  misconceptions:
  - match: 0.55
    feedback: ลืมตัวคูณ 2 ในสูตร $\left|\dfrac{da}{dr}\right| = \dfrac{2GM}{r^3}$ ทำให้ค่าเล็กลงครึ่งหนึ่ง
  - match: 2.2
