<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" font-family="sans-serif">
<title>โฆษณาสมมติของนมสำหรับเด็ก</title>
<rect x="0" y="0" width="420" height="420" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect x="20.0" y="20.0" width="380.0" height="360.0" rx="12" fill="#eef6ff" stroke="#2c6fb7" stroke-width="2"/>
<text x="210.0" y="62.0" font-size="26" text-anchor="middle" font-weight="bold" fill="#1f5d99">นมซูเปอร์คิดส์</text>
<text x="210.0" y="84.0" font-size="12" text-anchor="middle" fill="#555">นมรสช็อกโกแลต (ชื่อสมมติ)</text>
<text x="45.0" y="130.0" font-size="14" text-anchor="start" fill="#111">ก. ดื่มวันละกล่อง สูงขึ้น 10 ซม. ในเดือนเดียว</text>
<text x="45.0" y="166.0" font-size="14" text-anchor="start" fill="#111">ข. มีแคลเซียม 25% ของปริมาณที่แนะนำต่อวัน</text>
<text x="45.0" y="202.0" font-size="14" text-anchor="start" fill="#111">ค. ดื่มแล้วเรียนเก่งกว่าเพื่อนทั้งห้อง</text>
<text x="45.0" y="238.0" font-size="14" text-anchor="start" fill="#111">ง. ปริมาณ 180 มิลลิลิตร</text>
<text x="45.0" y="274.0" font-size="14" text-anchor="start" fill="#111">จ. แพทย์ทุกคนแนะนำ</text>
<text x="45.0" y="310.0" font-size="14" text-anchor="start" fill="#111">ฉ. น้ำตาล 12 กรัมต่อกล่อง</text>
<text x="210.0" y="402.0" font-size="11" text-anchor="middle" fill="#555">โฆษณาสมมติเพื่อฝึกวิเคราะห์ ไม่ใช่สินค้าจริง</text>
</svg>
