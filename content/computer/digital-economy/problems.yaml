problems:
  - id: computer.society.digital-economy.p001
    topics: [computer.society.digital-economy]
    difficulty: 1
    type: mcq
    stem: "เหตุใดต้นทุนส่วนเพิ่มของซอฟต์แวร์จึงต่ำกว่าสินค้าทั่วไปมาก"
    choices:
      - { id: a, text: "ต้นทุนพัฒนาจ่ายครั้งเดียว และการคัดลอกเพิ่มอีกหนึ่งชุดแทบไม่มีค่าใช้จ่าย", correct: true }
      - { id: b, text: "ซอฟต์แวร์ไม่ต้องมีคนดูแลหรือแก้ไขเลย", feedback: "ซอฟต์แวร์ยังต้องดูแลและอัปเดต แต่ค่าใช้จ่ายนี้ไม่ได้เพิ่มตามจำนวนผู้ใช้ทุกคน" }
      - { id: c, text: "รัฐบาลอุดหนุนซอฟต์แวร์ทุกชนิดให้ราคาถูก", feedback: "เหตุผลนี้ไม่ได้อธิบายต้นทุนส่วนเพิ่มที่เกิดจากลักษณะของซอฟต์แวร์เอง" }
      - { id: d, text: "ซอฟต์แวร์ไม่ต้องใช้ไฟฟ้าหรือเครื่องคอมพิวเตอร์", feedback: "ซอฟต์แวร์ต้องทำงานบนเครื่องคอมพิวเตอร์และใช้ไฟฟ้าเสมอ ต้นทุนส่วนเพิ่มจึงไม่ได้เป็นศูนย์จากเหตุผลนี้" }
    hints:
      - "ลองคิดว่าต้นทุนอะไรเกิดครั้งเดียว และอะไรเกิดซ้ำทุกครั้งที่มีผู้ใช้เพิ่ม"
      - "การทำสำเนาไฟล์ซอฟต์แวร์หนึ่งชุดเพิ่มแทบไม่ต้องใช้วัตถุดิบ"
    solution: "ซอฟต์แวร์มีต้นทุนพัฒนาคงที่ที่จ่ายครั้งเดียว ส่วนการผลิตเพิ่มอีกหนึ่งชุดคือการคัดลอก ซึ่งแทบไม่มีต้นทุน จึงทำให้ต้นทุนส่วนเพิ่มต่ำมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.digital-economy.p002
    topics: [computer.society.digital-economy]
    difficulty: 1
    type: numeric
    stem: "เกมมือถือเกมหนึ่งมีต้นทุนพัฒนาคงที่ 450,000 บาท (ค่าสมมติ) และต้นทุนส่วนเพิ่มต่อชุดเป็นศูนย์ ถ้าขายได้ 1,500 ชุด ต้นทุนเฉลี่ยต่อชุดเท่ากับกี่บาท (ตอบเป็นบาท)"
    answer: { value: 300, unit: บาท }
    hints:
      - "ต้นทุนเฉลี่ยคือต้นทุนรวมหารด้วยจำนวนชุดที่ขาย"
      - "ต้นทุนรวมในกรณีนี้คือต้นทุนพัฒนา 450,000 บาท เพราะต้นทุนส่วนเพิ่มเป็นศูนย์"
    misconceptions:
      - { match: 0, feedback: "ลืมว่ายังมีต้นทุนพัฒนาคงที่ที่ต้องแบ่งให้ทุกชุดที่ขาย ต้นทุนส่วนเพิ่มเป็นศูนย์ไม่ได้หมายความว่าต้นทุนเฉลี่ยเป็นศูนย์" }
      - { match: 450000, feedback: "นั่นคือต้นทุนรวม ยังไม่ได้หารด้วยจำนวนชุดที่ขาย" }
    solution: "ต้นทุนเฉลี่ย = 450,000 ÷ 1,500 = 300 บาทต่อชุด ถ้าขายได้ 15,000 ชุดต้นทุนเฉลี่ยจะลดเหลือ 30 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.digital-economy.p003
    topics: [computer.society.digital-economy]
    difficulty: 1
    type: match
    stem: "จับคู่คำศัพท์เศรษฐศาสตร์ดิจิทัลกับความหมายที่ตรงที่สุด"
    pairs:
      - { left: "ต้นทุนคงที่", right: "จ่ายครั้งเดียวไม่ว่าจะผลิตหรือขายได้กี่หน่วย" }
      - { left: "ต้นทุนส่วนเพิ่ม", right: "เงินที่ต้องเพิ่มเมื่อผลิตหรือให้บริการอีกหนึ่งหน่วย" }
      - { left: "ผลของเครือข่าย", right: "บริการมีคุณค่ามากขึ้นเมื่อมีผู้ใช้มากขึ้น" }
      - { left: "การผูกติดผู้ขาย", right: "ผู้ใช้ย้ายไปใช้บริการอื่นได้ยากเพราะต้นทุนการเปลี่ยนสูง" }
    hints:
      - "ต้นทุนคงที่ไม่เปลี่ยนตามจำนวนหน่วย ส่วนต้นทุนส่วนเพิ่มเปลี่ยนทีละหน่วย"
      - "ผลของเครือข่ายเกี่ยวกับจำนวนผู้ใช้ ไม่เกี่ยวกับราคา"
    solution: "ต้นทุนคงที่ไม่ขึ้นกับจำนวนหน่วย ต้นทุนส่วนเพิ่มคือค่าใช้จ่ายของหน่วยถัดไป ผลของเครือข่ายคือคุณค่าที่เพิ่มขึ้นเมื่อมีคนใช้มากขึ้น การผูกติดผู้ขายเกิดจากการย้ายยาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.digital-economy.p004
    topics: [computer.society.digital-economy]
    difficulty: 2
    type: numeric
    stem: "บริการสมาชิกรายเดือนราคา 99 บาทต่อคน มีสมาชิก 1,200 คน ต่อมามีสมาชิกเดิม 10% ยกเลิก รายได้ต่อเดือนหลังยกเลิกเท่ากับกี่บาท (ค่าสมมติ) (ตอบเป็นบาท)"
    answer: { value: 106920, unit: บาท }
    hints:
      - "หาจำนวนสมาชิกที่เหลือก่อน จากนั้นคูณด้วยราคาต่อคน"
      - "สมาชิกที่เหลือคือ 1,200 × (1 − 0.10)"
      - "รายได้ = จำนวนสมาชิกที่เหลือ × 99"
    misconceptions:
      - { match: 118800, feedback: "ยังไม่ได้หักสมาชิกที่ยกเลิกออก รายได้เดิมคือ 1,200 × 99 = 118,800 บาท" }
      - { match: 1080, feedback: "นั่นคือจำนวนสมาชิกที่เหลือ โจทย์ถามรายได้ ต้องคูณด้วยราคา 99 บาท" }
    solution: "สมาชิกที่เหลือ = 1,200 × 0.9 = 1,080 คน รายได้ = 1,080 × 99 = 106,920 บาทต่อเดือน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.digital-economy.p005
    topics: [computer.society.digital-economy]
    difficulty: 2
    type: numeric
    stem: "กลุ่มเพื่อนในแอปแชตมี 9 คน แต่ละคนเชื่อมต่อกับทุกคนอื่นหนึ่งครั้ง โดยนับคู่โดยไม่สนลำดับ ทั้งกลุ่มจะมีการเชื่อมต่อทั้งหมดกี่คู่"
    answer: { value: 36 }
    hints:
      - "คนแรกเชื่อมได้ 8 คน คนที่สองเชื่อมกับคนที่เหลือได้อีก 7 คน แต่ระวังการนับซ้ำ"
      - "การเชื่อมระหว่าง A กับ B นับเป็นคู่เดียว ไม่ใช่สองคู่"
      - "ใช้สูตร n(n − 1) ÷ 2 โดย n คือจำนวนคน"
    misconceptions:
      - { match: 72, feedback: "นับทั้ง A กับ B และ B กับ A เป็นคนละคู่ ทั้งที่การเชื่อมต่อนับเป็นคู่เดียว จึงต้องหารด้วย 2" }
      - { match: 81, feedback: "นั่นคือ 9 × 9 ซึ่งรวมการเชื่อมต่อของคนกับตัวเองด้วย" }
    solution: "n = 9 จึงได้ 9 × 8 ÷ 2 = 36 คู่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.digital-economy.p006
    topics: [computer.society.digital-economy]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นตัวอย่างของผลของเครือข่ายได้ชัดเจนที่สุด"
    choices:
      - { id: a, text: "ยิ่งมีเพื่อนในแอปแชตมาก แอปยิ่งมีประโยชน์ต่อเรา", correct: true }
      - { id: b, text: "เครื่องคิดเลขราคาถูกลงเมื่อโรงงานผลิตมากขึ้น", feedback: "นี่คือการประหยัดต่อขนาดในการผลิต ไม่ใช่การที่คุณค่าของสินค้าเพิ่มตามจำนวนผู้ใช้" }
      - { id: c, text: "ปากกาเขียนดีขึ้นเมื่อหมึกใหม่ขึ้น", feedback: "คุณภาพของปากกาไม่ได้ขึ้นกับจำนวนคนอื่นที่ใช้" }
      - { id: d, text: "หนังสือเล่มหนึ่งอ่านได้โดยคนคนเดียวทุกครั้ง", feedback: "ไม่มีการเพิ่มคุณค่าจากผู้ใช้คนอื่นในกรณีนี้" }
    hints:
      - "ผลของเครือข่ายเกี่ยวกับคุณค่าที่เพิ่มขึ้นเมื่อมีคนอื่นใช้ร่วมกัน"
      - "ตัวเลือกที่พูดถึงจำนวนคนที่ใช้บริการร่วมกันเป็นคำตอบที่เข้าข่าย"
    solution: "แอปแชตมีประโยชน์เพิ่มขึ้นเมื่อเพื่อนของเราใช้ด้วย นี่คือผลของเครือข่ายโดยตรง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.digital-economy.p007
    topics: [computer.society.digital-economy]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการเติบโตของแพลตฟอร์มสองฝั่ง จากจุดเริ่มต้นไปจนถึงการที่รายใหม่สู้ยาก"
    items:
      - "สร้างบริการที่ผู้ใช้ฝั่งหนึ่งต้องการให้ได้จำนวนหนึ่งก่อน"
      - "ดึงผู้ให้บริการอีกฝั่งเข้ามาเพราะเห็นว่ามีผู้ใช้มากพอ"
      - "คุณค่าของบริการเพิ่มขึ้น ทำให้ผู้ใช้ใหม่เข้ามาเรื่อย ๆ"
      - "ผู้เล่นรายใหม่สู้ยาก เพราะไม่มีผู้ใช้มากพอให้ดึงคนมาอยู่ด้วย"
    hints:
      - "ขั้นแรกต้องมีฝั่งที่เป็นแม่เหล็กก่อนจึงดึงอีกฝั่งได้"
      - "เมื่อมีคุณค่าสูงแล้วผู้ใช้ใหม่จะตามกันมา และผู้เล่นรายใหม่จะถูกทิ้งห่างไปเรื่อย ๆ"
    solution: "เริ่มจากการทำให้ฝั่งหนึ่งมีผู้ใช้ จากนั้นดึงอีกฝั่งเข้ามา คุณค่าที่เพิ่มขึ้นดึงดูดผู้ใช้ใหม่ จนรายใหม่ไม่มีผู้ใช้พอให้แข่งขันได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.digital-economy.p008
    topics: [computer.society.digital-economy]
    difficulty: 2
    type: text
    stem: "แพลตฟอร์มให้ผู้ใช้ใช้งานฟรี แต่หารายได้จากการขายพื้นที่แสดงสินค้าแก่ผู้ที่จ่ายเงินให้ไปปรากฏต่อผู้ใช้ เรียกโมเดลรายได้หลักแบบนี้ว่าอะไร (ตอบเป็นคำไทยสั้น ๆ)"
    accepted: ["โฆษณา", "รายได้จากโฆษณา", "การโฆษณา", "ค่าโฆษณา"]
    misconceptions:
      - { match: "ฟรีเมียม", feedback: "ฟรีเมียมคือการให้ใช้ฟรีแล้วเก็บเงินจากฟีเจอร์เพิ่มเติม ไม่ใช่การขายพื้นที่แสดงให้ผู้ลงโฆษณา" }
    hints:
      - "ลองนึกว่าใครคือผู้จ่ายเงินจริงในโมเดลนี้ ผู้ใช้หรือผู้ลงสินค้า"
      - "คำตอบเกี่ยวข้องกับการแสดงสินค้าหรือบริการให้ผู้ใช้เห็น"
    solution: "รายได้จากโฆษณา: ผู้ใช้ได้บริการฟรี ส่วนผู้จ่ายเงินคือผู้ลงโฆษณาที่อยากให้สินค้าของตนปรากฏต่อผู้ใช้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.digital-economy.p009
    topics: [computer.society.digital-economy]
    difficulty: 3
    type: numeric
    stem: "แอปฟรีมีผู้ใช้ 10,000 คน มี 5% ของผู้ใช้ที่สมัครสมาชิกรายเดือน 149 บาท รายได้ต่อเดือนจากผู้สมัครเท่ากับกี่บาท (ค่าสมมติ) (ตอบเป็นบาท)"
    answer: { value: 74500, unit: บาท }
    hints:
      - "หาจำนวนผู้ที่จ่ายเงินก่อน คือ 5% ของ 10,000 คน"
      - "รายได้ = จำนวนผู้จ่ายเงิน × 149 บาท"
    misconceptions:
      - { match: 149, feedback: "นั่นคือราคาของผู้จ่ายหนึ่งคน ยังไม่ได้คูณด้วยจำนวนผู้จ่ายทั้งหมด" }
      - { match: 7450, feedback: "ใช้ 0.5% แทน 5% ทำให้ได้ผู้จ่ายเพียง 50 คน" }
    solution: "ผู้จ่ายเงิน = 10,000 × 0.05 = 500 คน รายได้ = 500 × 149 = 74,500 บาทต่อเดือน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.digital-economy.p010
    topics: [computer.society.digital-economy]
    difficulty: 3
    type: mcq
    stem: "ข้อใดถูกต้องที่สุดเกี่ยวกับซอฟต์แวร์โอเพนซอร์ส"
    choices:
      - { id: a, text: "ใช้ได้ฟรี แต่ยังมีต้นทุนการดูแล ทดสอบ และอัปเดตความปลอดภัย", correct: true }
      - { id: b, text: "ไม่มีต้นทุนใด ๆ เพราะทุกคนช่วยกันทำฟรี", feedback: "การพัฒนาและดูแลยังต้องใช้เวลาและทรัพยากร แม้ผู้ใช้จะไม่ต้องจ่ายค่าใช้สิทธิ์" }
      - { id: c, text: "ห้ามให้ผู้อื่นตรวจสอบโค้ดเพื่อปกป้องความลับ", feedback: "การเปิดให้ตรวจสอบโค้ดได้เป็นหลักการสำคัญของโอเพนซอร์ส" }
      - { id: d, text: "เป็นสาธารณสมบัติเสมอ จึงไม่มีบริษัทใดหารายได้จากมันได้", feedback: "หลายบริษัทหารายได้จากบริการที่เกี่ยวข้อง เช่น การติดตั้งและการช่วยเหลือ แม้ซอฟต์แวร์จะใช้สัญญาอนุญาตโอเพนซอร์ส" }
    hints:
      - "คำว่าใช้ฟรีกับการไม่มีต้นทุนไม่ใช่เรื่องเดียวกัน"
      - "หลักการสำคัญของโอเพนซอร์สคือการเปิดโค้ดให้ตรวจสอบและแก้ไขได้"
    solution: "โอเพนซอร์สให้ผู้ใช้ใช้และตรวจสอบโค้ดได้โดยไม่ต้องจ่ายค่าใช้สิทธิ์ แต่การพัฒนา การทดสอบ และการอัปเดตความปลอดภัยยังมีต้นทุนที่ต้องมีคนรับผิดชอบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.digital-economy.p011
    topics: [computer.society.digital-economy]
    difficulty: 3
    type: numeric
    stem: "โรงเรียนแห่งหนึ่งพิจารณาเปลี่ยนระบบ มีค่าเปลี่ยนระบบ (ย้ายข้อมูลและฝึกอบรม) 50,000 บาท (ค่าสมมติ) ค่าซอฟต์แวร์เดิม 12,000 บาทต่อปี ระบบใหม่ 8,000 บาทต่อปี ต้องใช้กี่ปีจึงจะคืนทุนค่าเปลี่ยนระบบ (ตอบเป็นปี ทศนิยมได้ 1 ตำแหน่ง)"
    answer: { value: 12.5, tolerance: 0.05, unit: ปี }
    hints:
