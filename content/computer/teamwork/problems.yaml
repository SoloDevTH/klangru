    stem: "คู่หนึ่งเขียนโปรแกรมเป็นคู่ในคาบคอมพิวเตอร์ 90 นาที ตกลงสลับคนขับกับผู้นำทางทุก 15 นาที ตั้งแต่เริ่มจนจบคาบจะสลับกันกี่ครั้ง (ไม่นับตอนจบคาบ)"
    answer: { value: 5, unit: "ครั้ง" }
    hints:
      - "90 นาทีแบ่งเป็นช่วงละ 15 นาทีได้กี่ช่วง"
      - "การสลับเกิดระหว่างช่วง จำนวนครั้งน้อยกว่าจำนวนช่วงอยู่ 1"
    misconceptions:
