<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" font-family="sans-serif">
<title>ช่วงอุณหภูมิอันตรายของอาหาร 5 ถึง 60 องศาเซลเซียส</title>
<rect width="760" height="260" fill="#ffffff"/>
<text x="380.0" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">ช่วงอุณหภูมิอันตรายของอาหาร</text>
<rect x="105.71428571428571" y="128" width="502.85714285714283" height="44" fill="#fecaca" stroke="#b91c1c" stroke-width="1.2"/>
<text x="357.1428571428571" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#7f1d1d">ช่วงอันตราย 5–60 °C จุลินทรีย์เติบโตเร็ว</text>
<line x1="60" y1="172" x2="700" y2="172" stroke="#334155" stroke-width="1.5"/>
<line x1="60.0" y1="172" x2="60.0" y2="178" stroke="#334155" stroke-width="1.5"/>
<text x="60.0" y="196" text-anchor="middle" font-size="13" fill="#374151">0</text>
<line x1="151.42857142857142" y1="172" x2="151.42857142857142" y2="178" stroke="#334155" stroke-width="1.5"/>
<text x="151.42857142857142" y="196" text-anchor="middle" font-size="13" fill="#374151">10</text>
<line x1="242.85714285714283" y1="172" x2="242.85714285714283" y2="178" stroke="#334155" stroke-width="1.5"/>
<text x="242.85714285714283" y="196" text-anchor="middle" font-size="13" fill="#374151">20</text>
<line x1="334.2857142857143" y1="172" x2="334.2857142857143" y2="178" stroke="#334155" stroke-width="1.5"/>
<text x="334.2857142857143" y="196" text-anchor="middle" font-size="13" fill="#374151">30</text>
<line x1="425.71428571428567" y1="172" x2="425.71428571428567" y2="178" stroke="#334155" stroke-width="1.5"/>
<text x="425.71428571428567" y="196" text-anchor="middle" font-size="13" fill="#374151">40</text>
<line x1="517.1428571428571" y1="172" x2="517.1428571428571" y2="178" stroke="#334155" stroke-width="1.5"/>
<text x="517.1428571428571" y="196" text-anchor="middle" font-size="13" fill="#374151">50</text>
<line x1="608.5714285714286" y1="172" x2="608.5714285714286" y2="178" stroke="#334155" stroke-width="1.5"/>
<text x="608.5714285714286" y="196" text-anchor="middle" font-size="13" fill="#374151">60</text>
<line x1="700.0" y1="172" x2="700.0" y2="178" stroke="#334155" stroke-width="1.5"/>
<text x="700.0" y="196" text-anchor="middle" font-size="13" fill="#374151">70</text>
<text x="710" y="196" font-size="13" fill="#374151">°C</text>
<line x1="105.71428571428571" y1="128" x2="105.71428571428571" y2="98" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="608.5714285714286" y1="128" x2="608.5714285714286" y2="180" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="109.71428571428571" y="90" text-anchor="start" font-size="14" fill="#111827">ตู้เย็นควรอยู่ที่ไม่เกิน 5 °C</text>
<text x="604.5714285714286" y="90" text-anchor="end" font-size="14" fill="#111827">อาหารร้อนควรอยู่เหนือ 60 °C</text>
<text x="380.0" y="240" text-anchor="middle" font-size="14" fill="#374151">ทำให้อาหารผ่านช่วงนี้เร็วที่สุด โดยเก็บให้เย็นต่ำกว่า 5 °C หรืออุ่นให้ร้อนเกิน 60 °C</text>
</svg>
