  difficulty: 5
  type: mcq
  stem: ร้านขายสินค้าราคา $100$ บาท ต้นทุนผันแปร $60$ บาท ปกติขายได้เดือนละ $300$ ชิ้น พิจารณาโปรสองแบบ (สมมติยอดขายที่คาด) แบบ ก ลด $20\%$ คาดขาย $450$ ชิ้น แบบ ข ซื้อ 2 แถม 1 คาดว่าลูกค้ารับสินค้ารวม $600$ ชิ้น (รวมชิ้นที่แถม) ทางเลือกใดให้ **กำไรส่วนเกินรวมสูงสุด**
  choices:
  - id: a
    text: ขายราคาปกติ ไม่จัดโปร
    correct: true
  - id: b
    text: แบบ ก ลด 20%
    feedback: ได้ชิ้นละ 20 บาท × 450 ชิ้น = 9,000 บาท น้อยกว่าราคาปกติ 12,000 บาท
  - id: c
    text: แบบ ข ซื้อ 2 แถม 1
    feedback: ได้เงิน 200 บาทต่อ 3 ชิ้น เหลือชิ้นละประมาณ 6.67 บาท × 600 = 4,000 บาท
  - id: d
