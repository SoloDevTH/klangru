<text x="630.0" y="140.0" text-anchor="middle" font-size="13" fill="#222">น้ำหนักรวม</text>
<rect x="690.0" y="100.0" width="120.0" height="70.0" rx="0" fill="#f4f7fb" stroke="#333" stroke-width="1.5"/>
