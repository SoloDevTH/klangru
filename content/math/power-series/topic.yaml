summary: อนุกรมกำลังรอบจุดศูนย์กลาง การหารัศมีและช่วงการลู่เข้าพร้อมตรวจจุดปลาย การแทนฟังก์ชันด้วยอนุกรมเรขาคณิต และการหาอนุพันธ์กับปริพันธ์ทีละพจน์
