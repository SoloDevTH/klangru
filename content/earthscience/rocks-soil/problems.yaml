problems:
  - id: earthscience.geology.rocks-soil.p001
    topics: [earthscience.geology.rocks-soil]
    difficulty: 1
    type: mcq
    stem: "หินชนิดใดลอยน้ำได้"
    choices:
      - { id: a, text: "หินพัมมิซ ที่มีรูพรุนทั่วก้อน", correct: true }
      - { id: b, text: "หินแกรนิต", feedback: "หินแกรนิตแข็งและหนัก จมน้ำ" }
      - { id: c, text: "หินปูน", feedback: "หินปูนเนื้อแน่น จมน้ำ" }
      - { id: d, text: "หินทุกชนิดลอยน้ำได้", feedback: "หินส่วนใหญ่จมน้ำ มีเพียงบางชนิดที่มีรูพรุนมาก เช่น หินพัมมิซ ที่ลอยได้" }
    hints:
      - "หินที่ลอยน้ำได้ต้องเบามาก"
      - "หินที่มีรูพรุนมาก ข้างในมีอากาศอยู่"
    solution: "หินพัมมิซมีรูพรุนทั่วก้อน ข้างในมีอากาศ จึงเบาและลอยน้ำได้ หินส่วนใหญ่ เช่น หินแกรนิตและหินปูน จมน้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.rocks-soil.p002
    topics: [earthscience.geology.rocks-soil]
    difficulty: 1
    type: match
    stem: "จับคู่หินกับลักษณะที่สังเกตได้"
    pairs:
      - { left: "หินแกรนิต", right: "เนื้อหยาบ เห็นเม็ดสีขาว ดำ ชมพูปนกัน" }
      - { left: "หินทราย", right: "มีเม็ดทรายเล็ก ๆ ผิวสาก" }
      - { left: "หินพัมมิซ", right: "มีรูพรุนทั่วก้อน เบา" }
      - { left: "หินปูน", right: "เนื้อละเอียด สีเทาหรือขาว" }
    hints:
      - "ดูชื่อหิน บางชื่อบอกสิ่งที่อยู่ในหิน"
      - "หินที่มีรูพรุนเบาจนลอยน้ำได้"
    solution: "หินแกรนิตเนื้อหยาบมีหลายสี หินทรายมีเม็ดทราย หินพัมมิซมีรูพรุน หินปูนเนื้อละเอียดสีเทาหรือขาว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.rocks-soil.p003
    topics: [earthscience.geology.rocks-soil]
    difficulty: 1
    type: text
    stem: "ซากพืชซากสัตว์ที่เน่าเปื่อยผุพังอยู่ในดิน มีสีเข้ม เรียกว่าอะไร"
    accepted: ["ฮิวมัส", "humus"]
    misconceptions:
      - { match: "ปุ๋ย", feedback: "ฮิวมัสช่วยบำรุงดินเหมือนปุ๋ย แต่ชื่อเรียกของซากพืชซากสัตว์ที่ผุพังในดินคือ ฮิวมัส" }
      - { match: "ดินเหนียว", feedback: "ดินเหนียวเป็นชนิดของดิน ไม่ใช่ชื่อของซากพืชซากสัตว์ที่ผุพัง" }
    hints:
      - "คำนี้ขึ้นต้นด้วย ฮิว"
      - "ทำให้ดินชั้นบนมีสีเข้มและร่วนซุย"
    solution: "ซากพืชซากสัตว์ที่ผุพังในดินเรียกว่า ฮิวมัส ทำให้ดินชั้นบนสีเข้ม ร่วนซุย และมีอาหารสำหรับพืช"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.rocks-soil.p004
    topics: [earthscience.geology.rocks-soil]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ดินที่เหมาะกับการปลูกพืชมีส่วนประกอบใดบ้าง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "เศษหินและแร่", correct: true }
      - { id: b, text: "ซากพืชซากสัตว์ (ฮิวมัส)", correct: true }
      - { id: c, text: "น้ำ", correct: true }
      - { id: d, text: "อากาศ", correct: true }
      - { id: e, text: "พลาสติก", feedback: "พลาสติกเป็นขยะที่คนทิ้ง ไม่ใช่ส่วนประกอบตามธรรมชาติของดิน และย่อยสลายยากมาก" }
    hints:
      - "ดินเกิดจากหินผุผสมกับอะไร"
      - "ใส่ดินแห้งลงในน้ำ เห็นฟองอากาศ แปลว่าดินมีอะไร"
    solution: "ดินมีส่วนประกอบ 4 อย่าง คือ เศษหินและแร่ ฮิวมัส น้ำ และอากาศ พลาสติกไม่ใช่ส่วนประกอบของดิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.rocks-soil.p005
    topics: [earthscience.geology.rocks-soil]
    difficulty: 2
    type: mcq
    stem: "ใส่ดินแห้งหนึ่งช้อนลงในแก้วน้ำ แล้วเห็นฟองเล็ก ๆ ลอยขึ้นมา ฟองนี้แสดงว่าในดินมีอะไร"
    choices:
      - { id: a, text: "อากาศ", correct: true }
      - { id: b, text: "น้ำ", feedback: "ดินที่ใส่เป็นดินแห้ง และฟองที่ลอยขึ้นเป็นแก๊ส ไม่ใช่น้ำ" }
      - { id: c, text: "ฮิวมัส", feedback: "ฮิวมัสบางส่วนอาจลอยเป็นเศษบนผิวน้ำ แต่ฟองที่ผุดขึ้นคืออากาศ" }
      - { id: d, text: "เม็ดทราย", feedback: "เม็ดทรายหนัก จมลงก้นแก้ว ไม่ลอยขึ้นเป็นฟอง" }
    hints:
      - "ฟองในน้ำข้างในเป็นอะไร"
      - "ระหว่างเม็ดดินมีช่องว่าง ช่องว่างนั้นมีอะไรอยู่"
    solution: "ระหว่างเม็ดดินมีช่องว่างที่มีอากาศอยู่ เมื่อน้ำเข้าไปแทนที่ อากาศจึงออกมาเป็นฟอง แสดงว่าในดินมีอากาศ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.rocks-soil.p006
    topics: [earthscience.geology.rocks-soil]
    difficulty: 2
    type: mcq
    stem: "ใบเตยนำหิน ก มาขูดหิน ข แล้วหิน ข เป็นรอย แต่เมื่อนำหิน ข มาขูดหิน ก หิน ก ไม่เป็นรอย หินก้อนใดแข็งกว่า"
    choices:
      - { id: a, text: "หิน ก", correct: true }
      - { id: b, text: "หิน ข", feedback: "หินที่เป็นรอยคือหินที่อ่อนกว่า หิน ข เป็นรอย หิน ข จึงอ่อนกว่า" }
      - { id: c, text: "แข็งเท่ากัน", feedback: "ถ้าแข็งเท่ากันจะขูดกันได้ยากทั้งสองทาง แต่ในโจทย์หิน ข เป็นรอยเพียงก้อนเดียว" }
    hints:
      - "หินที่แข็งกว่าทำให้หินที่อ่อนกว่าเป็นรอย"
      - "ก้อนไหนเป็นรอย ก้อนนั้นอ่อนกว่า"
    solution: "หิน ก ทำให้หิน ข เป็นรอย แต่หิน ข ทำให้หิน ก เป็นรอยไม่ได้ หิน ก จึงแข็งกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.rocks-soil.p007
    topics: [earthscience.geology.rocks-soil]
    difficulty: 2
    type: match
    stem: "จับคู่ชนิดของดินกับสิ่งที่สังเกตได้เมื่อบีบและปั้นดินชื้น"
    pairs:
      - { left: "ดินทราย", right: "สากมือ ปั้นเป็นก้อนไม่ได้" }
      - { left: "ดินร่วน", right: "นุ่มมือ ปั้นเป็นก้อนได้แต่แตกง่าย" }
      - { left: "ดินเหนียว", right: "เหนียวมือ ปั้นเป็นเส้นยาวได้" }
    hints:
      - "ดูว่าดินจับตัวกันดีแค่ไหน"
      - "ดินที่เนื้อละเอียดที่สุดจับตัวแน่นที่สุด"
    solution: "ดินทรายเนื้อหยาบไม่จับตัว ดินร่วนจับตัวพอปั้นได้แต่แตกง่าย ดินเหนียวเนื้อละเอียดมาก จับตัวแน่นจนปั้นเป็นเส้นได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.rocks-soil.p008
    topics: [earthscience.geology.rocks-soil]
    difficulty: 2
    type: mcq
    stem: "จังหวัดราชบุรีมีชื่อเสียงเรื่องโอ่งมังกร ช่างปั้นโอ่งต้องใช้ดินชนิดใด"
    choices:
      - { id: a, text: "ดินเหนียว", correct: true }
      - { id: b, text: "ดินทราย", feedback: "ดินทรายไม่จับตัว ปั้นเป็นรูปโอ่งไม่ได้" }
      - { id: c, text: "ดินร่วน", feedback: "ดินร่วนปั้นได้แต่แตกง่าย ไม่เหมาะกับการปั้นภาชนะใบใหญ่" }
    hints:
      - "ดินที่ใช้ปั้นต้องจับตัวกันดี"
      - "ดินชนิดไหนปั้นเป็นเส้นยาวได้"
    solution: "ดินเหนียวเนื้อละเอียดและจับตัวแน่น ปั้นเป็นรูปร่างได้และไม่แตกง่าย จึงใช้ปั้นโอ่ง หม้อ อิฐ และกระถาง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.rocks-soil.p009
    topics: [earthscience.geology.rocks-soil]
    difficulty: 3
    type: mcq
    stem: "นักเรียนใส่ดินสามชนิดปริมาณเท่ากันในกรวย แล้วเทน้ำลงไปกรวยละ 150 มิลลิลิตร รอ 10 นาที วัดน้ำที่ไหลลงแก้วได้ตามภาพ ดินใดน่าจะเป็นดินเหนียว"
    figure: { src: p-drain.svg, alt: "กรวยใส่ดินสามอัน มีแก้วรองน้ำข้างใต้ แก้วมีขีดบอกปริมาตร 0 ถึง 150 มิลลิลิตร น้ำในแก้วใต้ดิน ก ประมาณ 35 มิลลิลิตร ใต้ดิน ข ประมาณ 130 มิลลิลิตร ใต้ดิน ค ประมาณ 80 มิลลิลิตร" }
    choices:
      - { id: a, text: "ดิน ก", correct: true }
      - { id: b, text: "ดิน ข", feedback: "ดิน ข ให้น้ำไหลผ่านมากที่สุด ซึ่งเป็นลักษณะของดินทราย" }
      - { id: c, text: "ดิน ค", feedback: "ดิน ค ให้น้ำผ่านปานกลาง น่าจะเป็นดินร่วน" }
    hints:
      - "ดินเหนียวอุ้มน้ำไว้มาก น้ำไหลผ่านช้า"
      - "หาแก้วที่มีน้ำน้อยที่สุด"
    solution: "ดินเหนียวเนื้อละเอียด น้ำไหลผ่านช้าและถูกอุ้มไว้มาก น้ำที่ไหลลงแก้วจึงน้อยที่สุด คือดิน ก (ประมาณ 35 มิลลิลิตร) ดิน ข ที่น้ำผ่านมากที่สุดน่าจะเป็นดินทราย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.rocks-soil.p010
    topics: [earthscience.geology.rocks-soil]
    difficulty: 3
    type: numeric
    stem: "จากภาพการทดลองเทน้ำผ่านดิน น้ำที่ไหลผ่านดิน ข มากกว่าน้ำที่ไหลผ่านดิน ก กี่มิลลิลิตร"
    figure: { src: p-drain.svg, alt: "กรวยใส่ดินสามอัน มีแก้วรองน้ำข้างใต้ แก้วมีขีดบอกปริมาตร 0 ถึง 150 มิลลิลิตร น้ำในแก้วใต้ดิน ก ประมาณ 35 มิลลิลิตร ใต้ดิน ข ประมาณ 130 มิลลิลิตร ใต้ดิน ค ประมาณ 80 มิลลิลิตร" }
    answer: { value: 95, tolerance: 5, unit: มิลลิลิตร }
    misconceptions:
      - { match: 165, feedback: "165 คือนำสองค่ามาบวกกัน คำว่า มากกว่ากี่มิลลิลิตร ต้องลบ" }
      - { match: 50, feedback: "50 คือผลต่างของดิน ข กับดิน ค โจทย์ถามเทียบกับดิน ก" }
    hints:
      - "อ่านปริมาณน้ำในแก้วใต้ดิน ข และดิน ก"
      - "นำค่าที่มากลบด้วยค่าที่น้อย"
    solution: "ดิน ข ประมาณ 130 มิลลิลิตร ดิน ก ประมาณ 35 มิลลิลิตร ต่างกัน $130 - 35 = 95$ มิลลิลิตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.rocks-soil.p011
    topics: [earthscience.geology.rocks-soil]
    difficulty: 3
    type: mcq
    stem: "แม่จะปลูกผักบุ้งและผักคะน้าในกระถางหน้าบ้าน ควรเลือกใช้ดินชนิดใดมากที่สุด"
    choices:
      - { id: a, text: "ดินร่วน เพราะร่วนซุย มีฮิวมัส และเก็บน้ำได้พอดี", correct: true }
      - { id: b, text: "ดินทราย เพราะน้ำไหลผ่านเร็ว", feedback: "ดินทรายเก็บน้ำได้น้อยและมีอาหารพืชน้อย ผักใบจะเหี่ยวง่าย" }
      - { id: c, text: "ดินเหนียว เพราะเก็บน้ำได้มากที่สุด", feedback: "ดินเหนียวแน่นและน้ำขังง่าย รากผักชอนไชยากและอาจเน่า" }
    hints:
      - "ผักต้องการน้ำพอดี อากาศในดิน และอาหาร"
      - "ดินชนิดไหนมีทุกอย่างพอดี"
    solution: "ดินร่วนร่วนซุย มีฮิวมัส เก็บน้ำได้พอดี และมีอากาศให้ราก จึงเหมาะกับการปลูกผักทั่วไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.rocks-soil.p012
    topics: [earthscience.geology.rocks-soil]
    difficulty: 3
    type: order
    stem: "เรียงขั้นการเกิดดินจากหิน"
    items:
      - "หินแข็งก้อนใหญ่ถูกแดด ฝน และลมเป็นเวลานาน"
      - "หินผุและแตกเป็นก้อนเล็กลง"
      - "เศษหินแตกต่อจนเป็นเม็ดเล็ก ๆ"
      - "ซากพืชซากสัตว์ผุพังผสมกับเศษหิน กลายเป็นดิน"
    hints:
      - "เริ่มจากหินก้อนใหญ่"
      - "ซากพืชซากสัตว์ผสมเข้ามาเป็นขั้นสุดท้าย"
    solution: "หินถูกแดด ฝน และลม → ผุแตกเป็นก้อนเล็ก → เป็นเม็ดเล็ก ๆ → ผสมกับซากพืชซากสัตว์ที่ผุพัง กลายเป็นดิน ขั้นเหล่านี้ใช้เวลานานมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.rocks-soil.p013
    topics: [earthscience.geology.rocks-soil]
    difficulty: 4
    type: numeric
    stem: "ดินที่เหมาะกับการปลูกพืช 100 ส่วน มีน้ำประมาณ 25 ส่วนและอากาศประมาณ 25 ส่วน ถ้ามีดินแบบนี้ 200 ส่วน จะมีน้ำและอากาศรวมกันประมาณกี่ส่วน"
    answer: { value: 100, unit: ส่วน }
    misconceptions:
      - { match: 50, feedback: "50 ส่วนคือน้ำกับอากาศในดิน 100 ส่วน ดิน 200 ส่วนมากเป็นสองเท่า" }
      - { match: 25, feedback: "25 ส่วนคือน้ำอย่างเดียวในดิน 100 ส่วน ต้องรวมอากาศ และคิดดิน 200 ส่วน" }
    hints:
      - "ดิน 100 ส่วน มีน้ำกับอากาศรวมกันกี่ส่วน"
      - "ดิน 200 ส่วนมากเป็นสองเท่าของ 100 ส่วน"
    solution: "ดิน 100 ส่วน มีน้ำและอากาศ $25 + 25 = 50$ ส่วน ดิน 200 ส่วนมากเป็นสองเท่า จึงมี $50 \\times 2 = 100$ ส่วน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.rocks-soil.p014
    topics: [earthscience.geology.rocks-soil]
    difficulty: 4
    type: mcq
    stem: "ชาวไร่ปลูกแตงโมในดินทรายริมแม่น้ำช่วงหน้าแล้ง ข้อใดเป็นเรื่องที่ชาวไร่ต้องระวังมากที่สุด"
    choices:
