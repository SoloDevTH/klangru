problems:
  - id: physics.magnetism.magnets.p001
    topics: [physics.magnetism.magnets]
    difficulty: 1
    type: mcq
    stem: "ของชิ้นใดถูกแม่เหล็กดูด"
    choices:
      - { id: a, text: "ตะปูเหล็ก", correct: true }
      - { id: b, text: "ยางลบ", feedback: "ยางลบทำจากยางหรือพลาสติก ไม่ใช่สารแม่เหล็ก แม่เหล็กจึงไม่ดูด" }
      - { id: c, text: "ไม้บรรทัดไม้", feedback: "ไม้ไม่ใช่สารแม่เหล็ก แม่เหล็กดูดของที่ทำจากเหล็ก" }
    hints:
      - "แม่เหล็กดูดของที่ทำจากวัสดุอะไร"
      - "ดูว่าของชิ้นไหนทำจากเหล็ก"
    solution: "แม่เหล็กดูดของที่ทำจากเหล็ก ตะปูเหล็กจึงถูกดูด ส่วนยางลบและไม้บรรทัดไม้ไม่ถูกดูด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.magnetism.magnets.p002
    topics: [physics.magnetism.magnets]
    difficulty: 1
    type: text
    stem: "แม่เหล็กมีสองขั้ว คือ ขั้วเหนือ และขั้วอะไร"
    accepted: ["ขั้วใต้", "ใต้", "S", "south", "ขั้ว S"]
    misconceptions:
      - { match: "ขั้วบวก", feedback: "ขั้วบวกและขั้วลบเป็นคำของถ่านไฟฉาย ขั้วแม่เหล็กเรียกว่าขั้วเหนือกับขั้วใต้" }
      - { match: "ขั้วลบ", feedback: "ขั้วบวกและขั้วลบเป็นคำของถ่านไฟฉาย ขั้วแม่เหล็กเรียกว่าขั้วเหนือกับขั้วใต้" }
    hints:
      - "ขั้วหนึ่งชี้ไปทางทิศเหนือ อีกขั้วชี้ไปทางทิศตรงข้าม"
      - "ทิศตรงข้ามกับทิศเหนือคือทิศอะไร"
    solution: "แม่เหล็กมีขั้วเหนือ (N) และขั้วใต้ (S)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.magnetism.magnets.p003
    topics: [physics.magnetism.magnets]
    difficulty: 1
    type: mcq
    stem: "นำขั้วเหนือของแม่เหล็กแท่งหนึ่งเข้าใกล้ขั้วใต้ของแม่เหล็กอีกแท่งหนึ่ง จะเกิดอะไรขึ้น"
    choices:
      - { id: a, text: "ดูดกัน", correct: true }
      - { id: b, text: "ผลักกัน", feedback: "ขั้วเหนือกับขั้วใต้เป็นขั้วต่างกัน ขั้วต่างกันดูดกัน ขั้วที่เหมือนกันจึงจะผลักกัน" }
      - { id: c, text: "ไม่เกิดอะไรเลย", feedback: "แม่เหล็กสองแท่งออกแรงต่อกันเสมอเมื่ออยู่ใกล้กัน แม้ไม่แตะกัน" }
    hints:
      - "ขั้วเหนือกับขั้วใต้เป็นขั้วเหมือนกันหรือต่างกัน"
      - "ขั้วต่างกันดูดกัน ขั้วเหมือนกันผลักกัน"
    solution: "ขั้วเหนือกับขั้วใต้เป็นขั้วต่างกัน จึงดูดกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.magnetism.magnets.p004
    topics: [physics.magnetism.magnets]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ของชิ้นใดถูกแม่เหล็กดูด (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "คลิปหนีบกระดาษเหล็ก", correct: true }
      - { id: b, text: "ฝาจีบขวดน้ำอัดลม (ทำจากเหล็กบาง)", correct: true }
      - { id: c, text: "กระป๋องน้ำอัดลมอะลูมิเนียม", feedback: "อะลูมิเนียมเป็นโลหะ แต่ไม่ใช่สารแม่เหล็ก แม่เหล็กไม่ดูดโลหะทุกชนิด" }
      - { id: d, text: "สายไฟทองแดง", feedback: "ทองแดงเป็นโลหะที่แม่เหล็กไม่ดูด อย่าตัดสินว่าโลหะทุกชนิดถูกดูด" }
      - { id: e, text: "ยางรัดของ", feedback: "ยางไม่ใช่สารแม่เหล็ก" }
    hints:
      - "แม่เหล็กดูดของที่ทำจากเหล็ก นิกเกิล หรือโคบอลต์"
      - "โลหะบางชนิด เช่น อะลูมิเนียมและทองแดง ไม่ถูกดูด"
    solution: "คลิปหนีบกระดาษและฝาจีบขวดทำจากเหล็กจึงถูกดูด กระป๋องอะลูมิเนียมและสายไฟทองแดงเป็นโลหะที่ไม่ใช่สารแม่เหล็ก ยางรัดของก็ไม่ถูกดูด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.magnetism.magnets.p005
    topics: [physics.magnetism.magnets]
    difficulty: 2
    type: match
    stem: "จับคู่ของใช้ที่มีแม่เหล็กกับประโยชน์ของแม่เหล็กในของใช้นั้น"
    pairs:
      - { left: "เข็มทิศ", right: "บอกทิศเหนือ" }
      - { left: "ขอบยางประตูตู้เย็น", right: "ทำให้ประตูปิดสนิท ความเย็นไม่รั่ว" }
      - { left: "แม่เหล็กแรงสูงในร้านรับซื้อของเก่า", right: "แยกกระป๋องเหล็กออกจากกระป๋องอะลูมิเนียม" }
      - { left: "ไขควงปลายแม่เหล็ก", right: "ดูดสกรูเหล็กไว้ไม่ให้หล่น" }
    hints:
      - "เข็มทิศคือแม่เหล็กเล็ก ๆ ที่หมุนได้ ขั้วเหนือชี้ไปทางไหน"
      - "ของแต่ละอย่างใช้แม่เหล็กดูดอะไร"
    solution: "เข็มทิศบอกทิศเหนือ ขอบยางตู้เย็นดูดกับผิวเหล็กของตู้ให้ปิดสนิท แม่เหล็กในร้านรับซื้อของเก่าดูดกระป๋องเหล็กแยกจากกระป๋องอะลูมิเนียม และไขควงปลายแม่เหล็กดูดสกรูเหล็กไว้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.magnetism.magnets.p006
    topics: [physics.magnetism.magnets]
    difficulty: 2
    type: mcq
    stem: "นำแม่เหล็กแท่งไปจุ่มในกองคลิปหนีบกระดาษแล้วยกขึ้น คลิปจะเกาะที่ส่วนใดของแม่เหล็กมากที่สุด"
    choices:
      - { id: a, text: "ที่ปลายทั้งสองข้าง", correct: true }
      - { id: b, text: "ที่ตรงกลางแท่ง", feedback: "ตรงกลางแม่เหล็กแท่งมีแรงน้อยที่สุด คลิปแทบไม่เกาะ แรงแม่เหล็กมากที่สุดที่ขั้วซึ่งอยู่ที่ปลาย" }
      - { id: c, text: "ที่ปลายขั้วเหนือข้างเดียว", feedback: "ขั้วใต้ก็ดูดเหล็กได้แรงเท่ากับขั้วเหนือ คลิปจึงเกาะทั้งสองปลาย" }
      - { id: d, text: "เกาะเท่ากันตลอดทั้งแท่ง", feedback: "แรงแม่เหล็กไม่เท่ากันทุกจุด แรงที่สุดที่ขั้ว" }
    hints:
      - "ส่วนที่แรงแม่เหล็กมากที่สุดเรียกว่าอะไร"
      - "ขั้วแม่เหล็กแท่งอยู่ตรงไหน"
    solution: "ขั้วแม่เหล็กอยู่ที่ปลายทั้งสองข้าง และเป็นส่วนที่แรงแม่เหล็กมากที่สุด คลิปจึงเกาะที่ปลายทั้งสองข้างมากที่สุด ทั้งขั้วเหนือและขั้วใต้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.magnetism.magnets.p007
    topics: [physics.magnetism.magnets]
    difficulty: 2
    type: text
    stem: "แรงแม่เหล็กส่งผลได้แม้แม่เหล็กยังไม่แตะวัตถุ แรงแม่เหล็กจึงเป็นแรงสัมผัสหรือแรงไม่สัมผัส"
    accepted: ["แรงไม่สัมผัส", "ไม่สัมผัส", "non-contact force"]
    misconceptions:
      - { match: "แรงสัมผัส", feedback: "แรงสัมผัสต้องแตะกันจึงเกิด แต่แม่เหล็กดูดคลิปได้ทั้งที่ยังไม่แตะ" }
    hints:
      - "แม่เหล็กดูดคลิปที่อยู่ห่างออกไปเล็กน้อยได้หรือไม่"
      - "แรงที่เกิดได้โดยไม่ต้องแตะกันเรียกว่าอะไร"
    solution: "แม่เหล็กดูดหรือผลักได้โดยไม่ต้องแตะกัน แรงแม่เหล็กจึงเป็นแรงไม่สัมผัส เช่นเดียวกับแรงโน้มถ่วง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.magnetism.magnets.p008
    topics: [physics.magnetism.magnets]
    difficulty: 3
    type: mcq
    stem: "แม่เหล็กแท่งหนึ่งไม่มีป้ายบอกขั้ว นักเรียนนำขั้วเหนือของแม่เหล็กอีกแท่งที่มีป้ายเข้าใกล้ปลาย ก ปรากฏว่า **ผลักกัน** ปลาย ก เป็นขั้วอะไร"
    choices:
      - { id: a, text: "ขั้วเหนือ", correct: true }
      - { id: b, text: "ขั้วใต้", feedback: "ถ้าปลาย ก เป็นขั้วใต้ จะดูดกับขั้วเหนือ แต่นี่ผลักกัน" }
      - { id: c, text: "บอกไม่ได้", feedback: "การผลักบอกได้แน่นอน เพราะผลักกันได้เฉพาะขั้วที่เหมือนกัน" }
    hints:
      - "ขั้วแบบไหนจึงผลักกัน"
      - "ปลาย ก ต้องเหมือนกับขั้วที่นำเข้าไปใกล้"
    solution: "ขั้วเหมือนกันผลักกัน ปลาย ก ผลักกับขั้วเหนือ จึงเป็นขั้วเหนือ (อีกปลายหนึ่งจึงเป็นขั้วใต้)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.magnetism.magnets.p009
    topics: [physics.magnetism.magnets]
    difficulty: 3
    type: numeric
    stem: "หักแม่เหล็กแท่งหนึ่งออกเป็น 3 ท่อน ทุกท่อนรวมกันมีขั้วแม่เหล็กทั้งหมดกี่ขั้ว (ตอบเป็นจำนวนขั้ว)"
    answer: { value: 6, unit: ขั้ว }
    misconceptions:
      - { match: 2, feedback: "ดูเหมือนนับเฉพาะปลายเดิมสองข้าง แต่ทุกท่อนที่หักออกมาเป็นแม่เหล็กใหม่ที่มีสองขั้วของตัวเอง" }
      - { match: 3, feedback: "ดูเหมือนให้แต่ละท่อนมีขั้วเดียว แม่เหล็กทุกก้อนมีสองขั้วเสมอ" }
    hints:
      - "หักแม่เหล็กแล้ว แต่ละท่อนมีกี่ขั้ว"
      - "นำจำนวนขั้วต่อท่อนคูณกับจำนวนท่อน"
    solution: "แม่เหล็กทุกท่อนมีขั้วเหนือและขั้วใต้ ท่อนละ 2 ขั้ว 3 ท่อนจึงมี $3 \\times 2 = 6$ ขั้ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.magnetism.magnets.p010
    topics: [physics.magnetism.magnets]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการทดลองแบ่งกลุ่มของใช้ในห้องเรียนว่าถูกแม่เหล็กดูดหรือไม่"
    items:
      - "ทายว่าของแต่ละชิ้นจะถูกดูดหรือไม่ แล้วจดไว้"
      - "นำแม่เหล็กไปแตะของทีละชิ้น"
      - "บันทึกผลที่เห็นลงในตาราง"
      - "แบ่งของเป็นกลุ่มที่ถูกดูดและไม่ถูกดูด"
      - "เทียบผลกับคำทาย แล้วสรุปว่าวัสดุใดถูกดูด"
    hints:
      - "นักวิทยาศาสตร์ทายผลก่อนหรือหลังการทดลอง"
      - "ต้องบันทึกผลก่อนจึงจะแบ่งกลุ่มและสรุปได้"
    solution: "ทายผลก่อน → ทดลองแตะทีละชิ้น → บันทึกผล → แบ่งกลุ่ม → เทียบกับคำทายแล้วสรุป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.magnetism.magnets.p011
    topics: [physics.magnetism.magnets]
    difficulty: 3
    type: numeric
    stem: "นักเรียนวางกระดาษคั่นระหว่างแม่เหล็กกับกองคลิป แล้วนับว่าแม่เหล็กยกคลิปขึ้นมาได้กี่ตัว ได้ผลดังนี้ ไม่มีกระดาษ 14 ตัว กระดาษ 2 แผ่น 9 ตัว กระดาษ 4 แผ่น 5 ตัว กระดาษ 6 แผ่น 2 ตัว เมื่อคั่นกระดาษ 6 แผ่น แม่เหล็กยกคลิปได้น้อยกว่าตอนไม่มีกระดาษกี่ตัว (ตอบเป็นจำนวนตัว)"
    answer: { value: 12, unit: ตัว }
    misconceptions:
      - { match: 2, feedback: "2 ตัวคือจำนวนคลิปเมื่อคั่นกระดาษ 6 แผ่น คำถามถามว่าน้อยกว่าตอนไม่มีกระดาษกี่ตัว ต้องลบกัน" }
      - { match: 16, feedback: "ดูเหมือนนำจำนวนคลิปมาบวกกัน ต้องหาผลต่าง จึงต้องลบ" }
    hints:
      - "หาจำนวนคลิปตอนไม่มีกระดาษ และตอนคั่นกระดาษ 6 แผ่น"
      - "น้อยกว่ากี่ตัว หาได้จากการลบ"
    solution: "ไม่มีกระดาษยกได้ 14 ตัว คั่นกระดาษ 6 แผ่นยกได้ 2 ตัว น้อยกว่า $14 - 2 = 12$ ตัว ข้อมูลนี้แสดงว่ายิ่งแม่เหล็กอยู่ห่างคลิป (กระดาษหนาขึ้น) แรงแม่เหล็กยิ่งน้อย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.magnetism.magnets.p012
    topics: [physics.magnetism.magnets]
    difficulty: 3
    type: mcq
    stem: "มีแท่งโลหะหน้าตาเหมือนกันสองแท่ง แท่งหนึ่งเป็นแม่เหล็ก อีกแท่งเป็นเหล็กธรรมดา นักเรียนใช้แม่เหล็กที่มีป้ายบอกขั้วทดสอบ ผลแบบใดบอกได้แน่ว่าแท่งที่ทดสอบเป็นแม่เหล็ก"
    choices:
      - { id: a, text: "ปลายหนึ่งของแท่งที่ทดสอบผลักกับขั้วแม่เหล็กที่นำไปใกล้", correct: true }
      - { id: b, text: "แท่งที่ทดสอบดูดกับแม่เหล็กที่นำไปใกล้", feedback: "เหล็กธรรมดาก็ถูกแม่เหล็กดูด การดูดจึงบอกไม่ได้ว่าเป็นแม่เหล็ก" }
      - { id: c, text: "แท่งที่ทดสอบหนักกว่าอีกแท่ง", feedback: "น้ำหนักไม่ได้บอกว่าเป็นแม่เหล็กหรือไม่" }
    hints:
      - "เหล็กธรรมดาถูกแม่เหล็กดูดได้หรือไม่"
      - "อะไรเกิดได้เฉพาะระหว่างแม่เหล็กสองแท่ง"
    solution: "เหล็กธรรมดาถูกดูดได้ทั้งสองขั้ว แต่ไม่เคยผลัก การผลักเกิดเฉพาะเมื่อขั้วเหมือนกันของแม่เหล็กสองแท่งหันเข้าหากัน ถ้าแท่งที่ทดสอบผลักได้ จึงแน่ใจว่าเป็นแม่เหล็ก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.magnetism.magnets.p013
    topics: [physics.magnetism.magnets]
    difficulty: 4
    type: mcq
    stem: "สวมแม่เหล็กวงแหวนสองวงบนดินสอตามภาพ วงล่างมีหน้าบนเป็นขั้วเหนือ (N) วงบนลอยอยู่เหนือวงล่างโดยไม่แตะกัน หน้าล่างของวงบนเป็นขั้วอะไร"
    figure: { src: ring-magnets.svg, alt: "ดินสอตั้งบนฐานไม้ มีแม่เหล็กวงแหวนสองวงสวมอยู่ วงล่างวางบนฐาน หน้าบนเป็นขั้วเหนือ N หน้าล่างเป็นขั้วใต้ S วงบนลอยอยู่สูงขึ้นไป มีช่องว่างระหว่างสองวง หน้าบนและหน้าล่างของวงบนเขียนว่า ? ไม่บอกขั้ว" }
    choices:
      - { id: a, text: "ขั้วเหนือ (N) เพราะผลักกับหน้าบนของวงล่าง", correct: true }
      - { id: b, text: "ขั้วใต้ (S) เพราะดูดกับหน้าบนของวงล่าง", feedback: "ถ้าดูดกัน วงบนจะตกลงมาแนบวงล่าง แต่วงบนลอยอยู่ แสดงว่ามีแรงผลักดันขึ้น" }
      - { id: c, text: "บอกไม่ได้ เพราะแม่เหล็กวงแหวนไม่มีขั้ว", feedback: "แม่เหล็กทุกรูปทรงมีสองขั้ว แม่เหล็กวงแหวนมีขั้วอยู่ที่หน้าบนและหน้าล่าง" }
    hints:
      - "วงบนลอยได้ แสดงว่าวงล่างผลักหรือดูดวงบน"
      - "ขั้วแบบไหนผลักกัน"
    solution: "วงบนลอยอยู่ได้เพราะวงล่างผลักขึ้น การผลักเกิดเมื่อขั้วเหมือนกันหันเข้าหากัน หน้าบนของวงล่างเป็น N หน้าล่างของวงบนจึงเป็น N ด้วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.magnetism.magnets.p014
    topics: [physics.magnetism.magnets]
    difficulty: 4
    type: mcq
    stem: "วางแม่เหล็กสามแท่งเรียงกันตามภาพ แท่ง 1 มีขั้วเหนือหันไปทางแท่ง 2 และแท่ง 1 กับแท่ง 2 ผลักกัน แท่ง 3 มีขั้วใต้หันมาทางแท่ง 2 ถ้าเลื่อนแท่ง 2 กับแท่ง 3 เข้าใกล้กัน จะเกิดอะไรขึ้น"
    figure: { src: three-magnets.svg, alt: "แม่เหล็กแท่งสามแท่งวางเรียงจากซ้ายไปขวา แท่ง 1 ปลายซ้าย S ปลายขวา N แท่ง 2 ไม่มีป้ายบอกขั้วทั้งสองปลาย แท่ง 3 ปลายซ้าย S ปลายขวา N ระหว่างแท่ง 1 กับแท่ง 2 มีลูกศรชี้ออกจากกันและคำว่าผลักกัน ระหว่างแท่ง 2 กับแท่ง 3 มีเครื่องหมายคำถาม" }
    choices:
      - { id: a, text: "ผลักกัน", correct: true }
      - { id: b, text: "ดูดกัน", feedback: "ลองหาขั้วของแท่ง 2 ก่อน ปลายซ้ายของแท่ง 2 ผลักกับขั้วเหนือจึงเป็นขั้วเหนือ ปลายขวาจึงเป็นขั้วใต้ แล้วดูว่าหันหาขั้วอะไรของแท่ง 3" }
      - { id: c, text: "ไม่เกิดอะไร เพราะแท่ง 2 ใช้แรงไปกับแท่ง 1 หมดแล้ว", feedback: "แม่เหล็กออกแรงต่อแม่เหล็กหลายแท่งได้พร้อมกัน แรงไม่ได้หมดไป" }
    hints:
      - "ปลายซ้ายของแท่ง 2 ผลักกับขั้วเหนือของแท่ง 1 ปลายซ้ายของแท่ง 2 เป็นขั้วอะไร"
      - "แม่เหล็กมีสองขั้ว ถ้าปลายซ้ายเป็นขั้วหนึ่ง ปลายขวาเป็นอีกขั้วหนึ่ง แล้วเทียบกับปลายซ้ายของแท่ง 3"
    solution: "ปลายซ้ายของแท่ง 2 ผลักกับขั้วเหนือ จึงเป็นขั้วเหนือ ปลายขวาของแท่ง 2 จึงเป็นขั้วใต้ ซึ่งหันหาขั้วใต้ของแท่ง 3 ขั้วเหมือนกันจึงผลักกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.magnetism.magnets.p015
    topics: [physics.magnetism.magnets]
    difficulty: 4
    type: mcq
    stem: "ร้านรับซื้อของเก่าแห่งหนึ่งมีกระป๋องเหล็กกับกระป๋องอะลูมิเนียมปนกันเต็มกระสอบ เจ้าของร้านอยากแยกให้เร็วและไม่ต้องหยิบทีละใบ วิธีใดใช้ได้ดีที่สุด"
    choices:
      - { id: a, text: "เทกระป๋องลงบนสายพาน แล้วแขวนแม่เหล็กแรงสูงไว้เหนือสายพาน ให้ดูดกระป๋องเหล็กขึ้นไป กระป๋องอะลูมิเนียมไหลต่อไปตามสายพาน", correct: true }
      - { id: b, text: "ใช้แม่เหล็กดูดกระป๋องอะลูมิเนียมออกมา", feedback: "อะลูมิเนียมไม่ถูกแม่เหล็กดูด แม่เหล็กจะดูดได้เฉพาะกระป๋องเหล็ก" }
      - { id: c, text: "ใช้แม่เหล็กดูดกระป๋องทั้งหมดขึ้นมาก่อน แล้วค่อยแยก", feedback: "แม่เหล็กดูดกระป๋องทุกใบไม่ได้ เพราะกระป๋องอะลูมิเนียมไม่ใช่สารแม่เหล็ก และความแตกต่างนี้เองที่ใช้แยก" }
    hints:
      - "กระป๋องสองชนิดต่างกันอย่างไรเมื่อเจอแม่เหล็ก"
      - "วิธีที่ดีต้องแยกได้เร็วโดยไม่ต้องหยิบทีละใบ"
    solution: "แม่เหล็กดูดกระป๋องเหล็กแต่ไม่ดูดกระป๋องอะลูมิเนียม ถ้าแขวนแม่เหล็กแรงสูงเหนือสายพาน กระป๋องเหล็กจะถูกดูดขึ้นไป ส่วนกระป๋องอะลูมิเนียมไหลต่อไป แยกได้ต่อเนื่องโดยไม่ต้องใช้มือหยิบ โรงงานคัดแยกขยะจริงก็ใช้หลักนี้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.magnetism.magnets.p016
    topics: [physics.magnetism.magnets]
    difficulty: 5
    type: mcq
    stem: "ต้นข้าวสงสัยว่า \"แม่เหล็กยิ่งก้อนใหญ่ ยิ่งยกคลิปได้มากหรือไม่\" การทดลองแบบใดตอบคำถามนี้ได้อย่างยุติธรรม"
    choices:
      - { id: a, text: "ใช้แม่เหล็กชนิดเดียวกันหลายขนาด ยกคลิปแบบเดียวกันจากกองเดียวกันด้วยวิธีเดียวกัน แล้วนับจำนวนคลิป", correct: true }
      - { id: b, text: "ใช้แม่เหล็กก้อนใหญ่ยกคลิปเหล็ก และแม่เหล็กก้อนเล็กยกตะปู แล้วเทียบกัน", feedback: "เปลี่ยนทั้งขนาดแม่เหล็กและของที่ยก ถ้าผลต่างกันจะไม่รู้ว่าเป็นเพราะขนาดแม่เหล็กหรือเพราะของที่ยก" }
      - { id: c, text: "ใช้แม่เหล็กก้อนใหญ่ก้อนเดียว ยกคลิปหลายครั้งแล้วหาค่าเฉลี่ย", feedback: "การทำซ้ำดี แต่ไม่ได้เปลี่ยนขนาดแม่เหล็กเลย จึงตอบคำถามเรื่องขนาดไม่ได้" }
      - { id: d, text: "ใช้แม่เหล็กหลายก้อนที่ต่างทั้งขนาดและชนิด แล้วดูว่าก้อนไหนยกได้มากที่สุด", feedback: "แม่เหล็กต่างชนิดมีแรงต่างกันแม้ขนาดเท่ากัน ต้องให้ชนิดเหมือนกันและเปลี่ยนเฉพาะขนาด" }
    hints:
      - "ต้องการรู้ผลของอะไร สิ่งนั้นคือสิ่งที่ต้องเปลี่ยน"
      - "สิ่งอื่นทั้งหมดต้องเหมือนเดิม จึงจะบอกได้ว่าผลเกิดจากสิ่งที่เปลี่ยน"
    solution: "การทดลองที่ยุติธรรมเปลี่ยนเพียงสิ่งเดียวที่อยากรู้ผล (ขนาดแม่เหล็ก) แล้วให้สิ่งอื่นเหมือนเดิม (ชนิดแม่เหล็ก คลิป วิธียก) จึงบอกได้ว่าจำนวนคลิปที่ต่างกันเกิดจากขนาด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.magnetism.magnets.p017
    topics: [physics.magnetism.magnets]
    difficulty: 5
    type: mcq
    stem: "วางเข็มทิศไว้ทางขวาของแม่เหล็กแท่ง ใกล้ปลายที่เป็นขั้วเหนือของแม่เหล็ก ปลายขั้วเหนือของเข็มทิศจะชี้ไปทางไหน"
    choices:
      - { id: a, text: "ชี้ออกห่างจากแม่เหล็ก (ไปทางขวา)", correct: true }
      - { id: b, text: "ชี้เข้าหาขั้วเหนือของแม่เหล็ก (ไปทางซ้าย)", feedback: "เข็มทิศก็เป็นแม่เหล็ก ขั้วเหนือของเข็มทิศถูกขั้วเหนือของแม่เหล็กผลัก จึงไม่ชี้เข้าหา" }
      - { id: c, text: "ชี้ไปทางทิศเหนือของโลกเหมือนเดิมเสมอ", feedback: "เมื่ออยู่ใกล้แม่เหล็กแท่ง แรงจากแม่เหล็กแท่งมากกว่าแรงจากโลกมาก เข็มทิศจึงหันตามแม่เหล็กแท่ง" }
    hints:
      - "เข็มทิศเป็นแม่เหล็กเล็ก ๆ มีขั้วเหนือและขั้วใต้"
      - "ขั้วเหนือของเข็มทิศกับขั้วเหนือของแม่เหล็กแท่งดูดหรือผลักกัน"
    solution: "ขั้วเหนือของเข็มทิศถูกขั้วเหนือของแม่เหล็กแท่งผลัก และขั้วใต้ของเข็มทิศถูกดูดเข้าหา เข็มทิศจึงหมุนจนขั้วใต้หันเข้าหาแม่เหล็ก ส่วนขั้วเหนือชี้ออกห่างไปทางขวา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.magnetism.magnets.p018
    topics: [physics.magnetism.magnets]
    difficulty: 4
    type: mcq
    stem: "ปิ่นทำเข็มหมุดหล่นกระจายบนพื้นห้องและอยากเก็บโดยไม่ให้มือโดนเข็ม เขาออกแบบเครื่องเก็บเข็มจากของในบ้าน แบบใดเหมาะที่สุด"
    choices:
      - { id: a, text: "ห่อแม่เหล็กด้วยถุงพลาสติกแล้วกวาดไปบนพื้น เมื่อเข็มติดแล้วจึงกลับถุงด้านในออก เข็มจะหลุดลงกล่อง", correct: true }
      - { id: b, text: "ใช้แผ่นอะลูมิเนียมฟอยล์กวาดให้เข็มติด", feedback: "อะลูมิเนียมไม่ใช่แม่เหล็ก ดูดเข็มเหล็กไม่ได้" }
      - { id: c, text: "ใช้แม่เหล็กเปล่ากวาด แล้วใช้มือดึงเข็มออกทีละอัน", feedback: "เก็บเข็มได้ แต่ต้องใช้มือดึงเข็ม ซึ่งไม่ตรงกับเงื่อนไขที่ไม่ให้มือโดนเข็ม" }
    hints:
      - "แรงแม่เหล็กส่งผ่านพลาสติกบาง ๆ ได้หรือไม่"
      - "แบบที่ดีต้องเก็บเข็มได้และต้องไม่ให้มือโดนเข็ม"
    solution: "แรงแม่เหล็กส่งผ่านถุงพลาสติกได้ เข็มเหล็กจึงติดที่ถุง เมื่อกลับถุงออกให้แม่เหล็กอยู่ห่างจากเข็ม แรงดูดลดลงจนเข็มหลุดลงกล่องเอง ตรงทั้งเกณฑ์เก็บเข็มได้และข้อจำกัดไม่ให้มือโดนเข็ม"
