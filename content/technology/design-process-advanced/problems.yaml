problems:
- id: technology.design.design-process-advanced.p001
  topics:
  - technology.design.design-process-advanced
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็น **ข้อจำกัด** (ต้องผ่าน ไม่ผ่านก็ตัดทิ้ง) ของเครื่องเตือนน้ำท่วมชุมชน
  choices:
  - id: a
    text: ยิ่งเสียงดังยิ่งดี
    feedback: เป็นเกณฑ์ที่ใช้ให้คะแนน เพราะ ยิ่ง...ยิ่งดี
  - id: b
    text: ยิ่งราคาถูกยิ่งดี
    feedback: เป็นเกณฑ์ ส่วนข้อจำกัดเรื่องเงินคือ ไม่เกินงบที่กำหนด
  - id: c
    text: เมื่อไฟดับ ต้องทำงานได้อย่างน้อย 24 ชั่วโมง
    correct: true
    feedback: ถูก ไม่ผ่านข้อนี้ เครื่องไม่มีประโยชน์ตอนน้ำท่วมจริง
  - id: d
    text: หน้าตาสวยงาม
    feedback: เป็นเกณฑ์ที่มีน้ำหนักน้อย ไม่ใช่เงื่อนไขที่ต้องผ่าน
  hints:
  - ข้อจำกัดมักเขียนว่า ต้อง... ไม่เกิน... อย่างน้อย...
  - เกณฑ์มักเขียนว่า ยิ่ง...ยิ่งดี
  solution: '**ทำงานได้อย่างน้อย 24 ชั่วโมงเมื่อไฟดับ** เป็นข้อจำกัด ไม่ผ่านต้องตัดทิ้ง ส่วนข้ออื่นเป็นเกณฑ์ที่ใช้ให้คะแนน'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.design-process-advanced.p002
  topics:
  - technology.design.design-process-advanced
  difficulty: 1
  type: text
  stem: เงื่อนไขที่ทางเลือกต้องผ่านทุกข้อ ถ้าไม่ผ่านแม้ข้อเดียวต้องตัดทางเลือกนั้นทิ้งทันที เรียกว่าอะไร
  accepted:
  - ข้อจำกัด
  - เงื่อนไข
  - ข้อจำกัดหรือเงื่อนไข
  - constraint
  - constraints
  misconceptions:
  - match: เกณฑ์
    feedback: เกณฑ์ใช้ให้คะแนนเปรียบเทียบ ยิ่งดียิ่งได้คะแนนมาก ไม่ได้ใช้ตัดทิ้ง
  - match: เกณฑ์ความสำเร็จ
    feedback: เกณฑ์ใช้ให้คะแนน ส่วนเงื่อนไขที่ต้องผ่านคือข้อจำกัด
  hints:
  - คำนี้ตรงข้ามกับ ยิ่งดียิ่งได้คะแนน
  - ตัวอย่าง งบไม่เกิน 2,000 บาท
  solution: เรียกว่า **ข้อจำกัด** (หรือเงื่อนไข) เช่น งบไม่เกิน 2,000 บาท ใช้ไฟแรงดันต่ำ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.design-process-advanced.p003
  topics:
  - technology.design.design-process-advanced
  difficulty: 1
  type: match
  stem: จับคู่วิธีนำเสนอแนวทางแก้ปัญหากับสิ่งที่เหมาะจะใช้สื่อ
  pairs:
  - left: ผังงาน
    right: ลำดับการทำงานและการตัดสินใจของโปรแกรม
  - left: แบบจำลองสามมิติจากซอฟต์แวร์ช่วยออกแบบ
    right: รูปร่างและการประกอบชิ้นส่วนก่อนตัดวัสดุจริง
  - left: ซอฟต์แวร์จำลองวงจร
    right: ตรวจว่าวงจรทำงานถูกก่อนต่อจริง
  - left: สาธิตด้วยแบบจำลองขนาดเล็ก
    right: ให้ชาวบ้านเห็นและได้ยินเสียงเตือนจริงในที่ประชุมชุมชน
  hints:
  - ผังงานใช้กับโปรแกรม
  - ผู้ฟังที่ไม่ใช่ช่างเข้าใจจากการเห็นของจริง
  solution: ผังงาน → ลำดับการทำงานของโปรแกรม · CAD สามมิติ → รูปร่างและการประกอบ · จำลองวงจร → ตรวจวงจร · สาธิตแบบจำลอง → ผู้ฟังทั่วไปเห็นการทำงานจริง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.design-process-advanced.p004
  topics:
  - technology.design.design-process-advanced
  difficulty: 2
  type: numeric
  stem: ทีมสำรวจ 80 ครัวเรือนในชุมชน (สมมติ) พบว่า 52 ครัวเรือนอยากให้มีเสียงเตือนที่ได้ยินในบ้าน คิดเป็นร้อยละเท่าไร
  answer:
    value: 65
    unit: '%'
  misconceptions:
  - match: 153.85
    feedback: หารกลับด้าน ต้องเป็น 52 ÷ 80
  - match: 52
    feedback: นี่คือจำนวนครัวเรือน ยังไม่ได้เทียบเป็นร้อยละ
  hints:
  - ร้อยละ = ส่วน ÷ ทั้งหมด × 100
  - ส่วน = 52 ทั้งหมด = 80
  solution: $52 \div 80 \times 100 = 65$ ร้อยละ ข้อมูลที่เก็บเองนี้เป็นข้อมูลปฐมภูมิ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.design-process-advanced.p005
  topics:
  - technology.design.design-process-advanced
  difficulty: 2
  type: mcq
  stem: ทีมออกแบบเครื่องเตือนน้ำท่วมสัมภาษณ์เฉพาะผู้ใหญ่บ้าน แล้วเลือกแบบที่ส่งข้อความเข้าโทรศัพท์มือถืออย่างเดียว ข้อบกพร่องสำคัญของการรวบรวมข้อมูลนี้คืออะไร
  choices:
  - id: a
    text: ผู้ใหญ่บ้านไม่ควรมีส่วนร่วม
    feedback: ผู้ใหญ่บ้านเป็นผู้มีส่วนได้ส่วนเสียสำคัญ แต่ไม่ใช่กลุ่มเดียว
  - id: b
    text: ควรเลือกแบบที่แพงที่สุด
    feedback: ราคาไม่ได้บอกว่าตรงความต้องการ
  - id: c
    text: ไม่ได้ถามผู้มีส่วนได้ส่วนเสียกลุ่มอื่น เช่น ผู้สูงอายุที่ไม่ได้ใช้โทรศัพท์มือถือ
    correct: true
    feedback: ถูก ผู้ใช้หลายกลุ่มต้องการต่างกัน
  - id: d
    text: ไม่มีข้อบกพร่อง เพราะทุกคนมีโทรศัพท์
    feedback: ข้อสันนิษฐานนี้ไม่ได้ตรวจสอบ และมักไม่จริงกับผู้สูงอายุ
  hints:
  - ใครบ้างที่ได้รับผลจากเครื่องนี้
  - ทุกคนใช้โทรศัพท์มือถือหรือไม่
  solution: ปัญหาของชุมชนมีผู้ใช้หลายกลุ่ม ต้อง **ถามทุกกลุ่ม** โดยเฉพาะผู้สูงอายุที่อาจไม่ได้ใช้โทรศัพท์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.design-process-advanced.p006
  topics:
  - technology.design.design-process-advanced
  difficulty: 2
  type: mcq
  stem: นักเรียนพบภาพวงจรเครื่องเตือนน้ำท่วมสวย ๆ บนเว็บไซต์หนึ่ง และอยากใช้ในโปสเตอร์นำเสนอโครงงาน ข้อใด **ถูกต้องด้านทรัพย์สินทางปัญญา** ที่สุด
  choices:
  - id: a
    text: ใช้ได้เลย เพราะเป็นงานของโรงเรียน ไม่ได้ขาย
    feedback: งานที่ไม่ได้ขายก็ยังต้องเคารพลิขสิทธิ์และให้เครดิต
  - id: b
    text: ดูสัญญาอนุญาตของภาพ ถ้าอนุญาตให้ใช้ก็ใช้และให้เครดิตตามเงื่อนไข ถ้าไม่อนุญาตให้วาดวงจรของตนเองแล้วอ้างที่มาของแนวคิด
    correct: true
    feedback: ถูก
  - id: c
    text: ใช้ได้ ถ้าตัดลายน้ำออกก่อน
    feedback: การตัดลายน้ำยิ่งเป็นการละเมิด
  - id: d
    text: ใช้ได้ เพราะภาพบนอินเทอร์เน็ตเป็นสาธารณสมบัติทุกภาพ
    feedback: ภาพส่วนใหญ่มีลิขสิทธิ์ตั้งแต่สร้าง
  hints:
  - ลิขสิทธิ์เกิดขึ้นทันทีที่สร้างงาน
  - ดูว่าเจ้าของอนุญาตอย่างไร
  solution: ตรวจ **สัญญาอนุญาต** ใช้ตามเงื่อนไขและให้เครดิต หรือวาดเองแล้วอ้างที่มาของแนวคิด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.design-process-advanced.p007
  topics:
  - technology.design.design-process-advanced
  difficulty: 3
  type: numeric
  stem: ดูตารางในภาพ คำนวณ **คะแนนรวมถ่วงน้ำหนัก** ของทางเลือก 2 (ลด 2 บาท ถ้านำกล่องมาเอง)
  figure:
    src: canteen-matrix.svg
    alt: ตารางเมทริกซ์ตัดสินใจลดพลาสติกในโรงอาหาร (ข้อมูลสมมติ) คะแนน 1 ถึง 5 ทางเลือก 1 ตู้กดน้ำและแก้วส่วนตัว ทางเลือก 2 ลด 2 บาทถ้านำกล่องมาเอง ทางเลือก 3 ถุงพลาสติกชีวภาพ เกณฑ์ลดขยะพลาสติก น้ำหนัก 0.40 ได้ 5 4 2 เกณฑ์ค่าใช้จ่ายของโรงเรียนต่ำ น้ำหนัก 0.20 ได้ 2 4 1 เกณฑ์สะดวกต่อนักเรียน น้ำหนัก 0.25 ได้ 4 3 5 เกณฑ์สุขอนามัย น้ำหนัก 0.15 ได้ 4 3 4 แถวคะแนนรวมเป็นเครื่องหมายคำถาม
  answer:
    value: 3.6
    unit: คะแนน
    tolerance: 0.01
  misconceptions:
  - match: 14
    feedback: บวกคะแนนดิบโดยไม่คูณน้ำหนัก
  - match: 3.5
    feedback: หาค่าเฉลี่ยของคะแนนดิบ ไม่ได้ถ่วงน้ำหนัก
  hints:
  - คูณคะแนนแต่ละเกณฑ์กับน้ำหนักของเกณฑ์นั้น
  - 0.40 × 4 + 0.20 × 4 + 0.25 × 3 + 0.15 × 3
  solution: $0.40(4) + 0.20(4) + 0.25(3) + 0.15(3) = 1.6 + 0.8 + 0.75 + 0.45 = 3.6$ คะแนน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.design-process-advanced.p008
  topics:
  - technology.design.design-process-advanced
  difficulty: 3
  type: mcq
  stem: ดูตารางในภาพ ทางเลือก 1 ได้คะแนนรวม 4.0 สูงสุด ทางเลือก 2 ได้ 3.6 แต่ตู้กดน้ำราคา 15,000 บาท ขณะที่โรงเรียนมีข้อจำกัดว่างบต้องไม่เกิน 10,000 บาท ควรตัดสินใจอย่างไร
  figure:
    src: canteen-matrix.svg
    alt: ตารางเมทริกซ์ตัดสินใจลดพลาสติกในโรงอาหาร (ข้อมูลสมมติ) คะแนน 1 ถึง 5 ทางเลือก 1 ตู้กดน้ำและแก้วส่วนตัว ทางเลือก 2 ลด 2 บาทถ้านำกล่องมาเอง ทางเลือก 3 ถุงพลาสติกชีวภาพ เกณฑ์ลดขยะพลาสติก น้ำหนัก 0.40 ได้ 5 4 2 เกณฑ์ค่าใช้จ่ายของโรงเรียนต่ำ น้ำหนัก 0.20 ได้ 2 4 1 เกณฑ์สะดวกต่อนักเรียน น้ำหนัก 0.25 ได้ 4 3 5 เกณฑ์สุขอนามัย น้ำหนัก 0.15 ได้ 4 3 4 แถวคะแนนรวมเป็นเครื่องหมายคำถาม
  choices:
  - id: a
    text: เลือกทางเลือก 1 เพราะคะแนนสูงสุด
    feedback: คะแนนสูงไม่ช่วยถ้าไม่ผ่านข้อจำกัด
  - id: b
    text: เลือกทางเลือก 3 เพราะสะดวกที่สุด
    feedback: ดูแค่เกณฑ์เดียว และคะแนนรวมต่ำสุด
  - id: c
    text: เพิ่มน้ำหนักเกณฑ์ลดพลาสติกจนทางเลือก 1 ชนะ
    feedback: การปรับน้ำหนักไม่ได้ทำให้งบพอ
  - id: d
    text: ตัดทางเลือก 1 ออกก่อนเพราะไม่ผ่านข้อจำกัดเรื่องงบ แล้วเลือกทางเลือก 2 ซึ่งคะแนนสูงสุดในทางเลือกที่เหลือ
    correct: true
    feedback: ถูก ตรวจข้อจำกัดก่อนเทียบคะแนน
  hints:
  - ขั้นแรกตรวจอะไรก่อน
  - ทางเลือกที่ไม่ผ่านข้อจำกัดยังเข้าแข่งได้ไหม
  solution: '**ตัดทางเลือกที่ไม่ผ่านข้อจำกัดก่อน** (ทางเลือก 1 เกินงบ) แล้วเลือก **ทางเลือก 2** ซึ่งได้ 3.6 สูงกว่าทางเลือก 3 (2.85) หรืออาจหาทางลดราคาตู้แล้วประเมินใหม่'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.design-process-advanced.p009
  topics:
  - technology.design.design-process-advanced
  difficulty: 3
  type: mcq
  stem: ดูกราฟในภาพ ต้นแบบตั้งให้ไซเรนดังทันทีที่ค่าที่อ่านได้เกิน 80 cm จึงดังสองครั้ง ทั้งที่ชาวบ้านบอกว่าน้ำไม่ได้ขึ้น ข้อใด **ให้เหตุผลของข้อบกพร่อง** ได้ถูกต้องที่สุด
  figure:
    src: sensor-data.svg
    alt: กราฟเส้นระดับน้ำที่เซนเซอร์อ่านได้ทุก 30 วินาที นาน 30 นาที (ข้อมูลสมมติ) ค่าส่วนใหญ่อยู่ระหว่าง 65 ถึง 75 เซนติเมตร และค่อย ๆ สูงขึ้นช้า ๆ มีเส้นประระดับเตือน 80 เซนติเมตร มีจุดที่พุ่งขึ้นเกินเส้นเตือนชั่วครู่สองช่วง ช่วงแรกที่นาทีที่ 12 หนึ่งจุด สูง 87 เซนติเมตร ช่วงที่สองที่นาทีที่ 21 ถึง 21.5 สองจุด สูง 84 และ 85 เซนติเมตร แล้วกลับลงมาอยู่ราว 70 เซนติเมตรทันที
  choices:
  - id: a
    text: น้ำขึ้นจริงสองครั้ง ชาวบ้านจำผิด
    feedback: ค่ากลับมาราว 70 cm ทันที น้ำจริงไม่ลดเร็วขนาดนั้น
  - id: b
    text: เส้นระดับเตือนต่ำเกินไป ควรตั้งเป็น 90 cm
    feedback: แก้ผิดจุด ถ้าน้ำขึ้นจริงจะเตือนช้าลง
  - id: c
    text: ค่าที่เกิน 80 cm เป็นจุดพุ่งขึ้นชั่วครู่แล้วลงทันที น่าจะเกิดจากคลื่นหรือสิ่งลอยน้ำ ไม่ใช่ระดับน้ำที่สูงขึ้นจริง
    correct: true
    feedback: ถูก ระดับน้ำจริงขึ้นช้า ๆ และอยู่ราว 70 cm
  - id: d
    text: ไซเรนเสีย
    feedback: ไซเรนทำงานตามคำสั่ง ปัญหาอยู่ที่ข้อมูลที่ใช้ตัดสินใจ
  hints:
  - ค่าที่เกินเส้นอยู่นานกี่จุด
  - ระดับน้ำจริงเปลี่ยนเร็วหรือช้า
  solution: จุดที่เกินเส้นเป็น **ค่าพุ่งชั่วครู่** 1–2 จุด แล้วกลับมาราว 70 cm ทันที จึงมาจากคลื่นหรือสิ่งลอยน้ำ ทางแก้คือใช้ค่าเฉลี่ยหลายค่า หรือเตือนเมื่อเกินต่อเนื่องนานพอ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.design-process-advanced.p010
  topics:
  - technology.design.design-process-advanced
  difficulty: 3
  type: numeric
