    note: แท็กที่มีความหมาย ข้อความแทนภาพ ขนาดตัวอักษรที่ผู้ใช้ปรับได้ และจัดวางการ์ดในความกว้างของหน้า แต่ยังไม่ได้สอนการออกแบบที่ปรับตามขนาดจอ (responsive) ผู้เรียนไม่ได้สร้างหน้าเว็บเอง และไม่ได้ใช้เครื่องมือตรวจการเข้าถึงได้

