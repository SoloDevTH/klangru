  - id: computer.systems.logic-gates.p017
    topics: [computer.systems.logic-gates]
    difficulty: 5
    type: numeric
    stem: "ต่อวงจรบวกครึ่งกับวงจรบวกเต็มเป็นวงจรบวก 2 บิต แล้วบวก $11_2 + 01_2$ ผลลัพธ์ทั้งหมด (รวมตัวทดสุดท้าย) มีค่าเท่าใดในฐานสิบ"
    answer: { value: 4 }
    hints:
      - "หลักขวา: $1 + 1$ ได้ผลบวกเท่าใด ทดเท่าใด"
      - "หลักซ้าย: $1 + 0 +$ ตัวทดจากหลักขวา แล้วอ่านผลรวมเป็นเลขฐานสอง 3 หลัก"
    misconceptions:
      - { match: 0, feedback: "ดูเหมือนอ่านเฉพาะสองหลักขวา ($00_2$) แล้วทิ้งตัวทดสุดท้าย ตัวทดคือหลักที่สามของผลลัพธ์" }
      - { match: 3, feedback: "ดูเหมือนลืมตัวทดจากหลักขวา หรือใช้ OR แทนการบวก $11_2 = 3$ และ $01_2 = 1$ รวมกันต้องได้มากกว่า 3" }
    solution: "หลักขวา: 1 + 1 = 0 ทด 1 / หลักซ้าย: 1 + 0 + 1 = 0 ทด 1 / ผลลัพธ์ $100_2 = 4$ ตรวจ: 3 + 1 = 4"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.logic-gates.p018
    topics: [computer.systems.logic-gates]
    difficulty: 5
    type: mcq
    stem: "เกต NAND ให้ผล $\\overline{A \\cdot B}$ ถ้าต่ออินพุตทั้งสองของ NAND เข้ากับสัญญาณเดียวกัน $X$ จะได้เกตใด"
    choices:
      - { id: a, text: "NOT เพราะ $\\overline{X \\cdot X} = \\overline{X}$", correct: true }
      - { id: b, text: "AND เพราะยังมีอินพุตสองขา", feedback: "ลองแทนค่า X = 1: $\\overline{1 \\cdot 1} = 0$ ซึ่งกลับค่าของ X จึงไม่ใช่ AND" }
      - { id: c, text: "ได้ X เดิม", feedback: "X AND X = X แต่ NAND กลับค่าอีกครั้ง ผลจึงเป็น NOT X" }
      - { id: d, text: "XOR", feedback: "X XOR X = 0 เสมอ แต่ NAND ของ X กับ X ให้ 1 เมื่อ X = 0" }
    hints:
      - "แทน X = 0 และ X = 1 แล้วหาผล"
      - "$X \\cdot X$ เท่ากับอะไร"
    solution: "X = 0: $\\overline{0 \\cdot 0} = 1$ / X = 1: $\\overline{1 \\cdot 1} = 0$ ได้ผลกลับค่าของ X จึงเป็น NOT เกต NAND จึงใช้สร้างเกตอื่นได้ทั้งหมด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.logic-gates.p019
    topics: [computer.systems.logic-gates]
    difficulty: 5
    type: numeric
    stem: "ประตูหมุนทำงานตามเครื่องสถานะที่มีสถานะ ล็อก และ ปลดล็อก (ล็อก + เหรียญ → ปลดล็อก, ปลดล็อก + ดัน → คนผ่านแล้วล็อก, ล็อก + ดัน → ล็อก, ปลดล็อก + เหรียญ → ปลดล็อก) เริ่มที่ ล็อก มีเหตุการณ์: เหรียญ, ดัน, ดัน, เหรียญ, เหรียญ, ดัน, เหรียญ มีเหรียญที่ **เสียเปล่า** (หยอดแล้วไม่ทำให้มีคนผ่านเพิ่ม) กี่เหรียญ"
    answer: { value: 2, unit: เหรียญ }
    hints:
      - "ไล่สถานะทีละเหตุการณ์ จดว่าแต่ละเหรียญถูกใช้ให้มีคนผ่านหรือไม่"
      - "เหรียญที่หยอดตอนปลดล็อกอยู่แล้ว และเหรียญสุดท้ายที่ไม่มีใครดันตามมา ทำให้มีคนผ่านเพิ่มหรือไม่"
    misconceptions:
      - { match: 1, feedback: "นับแค่เหรียญที่หยอดซ้ำตอนปลดล็อก ยังมีเหรียญสุดท้ายที่หยอดแล้วไม่มีใครดันผ่าน" }
      - { match: 4, feedback: "4 คือจำนวนเหรียญทั้งหมด แต่มี 2 เหรียญที่ทำให้มีคนผ่าน" }
    solution: "ล็อก →เหรียญ ปลดล็อก →ดัน ผ่านคนที่ 1 ล็อก →ดัน ล็อก →เหรียญ ปลดล็อก →เหรียญ ปลดล็อก (เสียเปล่า) →ดัน ผ่านคนที่ 2 ล็อก →เหรียญ ปลดล็อก (ยังไม่มีใครผ่าน) หยอด 4 เหรียญ มีคนผ่าน 2 คน จึงเสียเปล่า 4 − 2 = 2 เหรียญ"
    license: CC-BY-SA-4.0
    ai_assisted: true
