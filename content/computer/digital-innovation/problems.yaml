  - id: computer.projects.digital-innovation.p016
    topics: [computer.projects.digital-innovation]
    difficulty: 5
    type: numeric
    stem: |
      นักเรียนให้คะแนนแนวทางเพิ่มมูลค่า 3 แนวทาง (1–5 คะแนน ยิ่งมากยิ่งดี ด้านต้นทุน 5 = ถูกที่สุด) แล้วถ่วงน้ำหนัก ผลต่อผู้ใช้ 0.5 ต้นทุน 0.3 ความง่ายในการดูแลต่อ 0.2 คะแนนถ่วงน้ำหนักที่ **สูงที่สุด** เป็นเท่าไร

      | แนวทาง | ผลต่อผู้ใช้ | ต้นทุน | ดูแลต่อง่าย |
      |---|---|---|---|
      | A แอปสั่งซื้อที่เขียนเอง | 5 | 2 | 3 |
      | B แบบฟอร์มและตารางคำนวณ | 4 | 3 | 5 |
      | C คลิปเล่าเรื่องอย่างเดียว | 3 | 5 | 4 |
    answer: { value: 3.9, tolerance: 0.01, unit: "คะแนน" }
    hints:
      - "คะแนนถ่วงน้ำหนัก = 0.5 × ผลต่อผู้ใช้ + 0.3 × ต้นทุน + 0.2 × ดูแลต่อง่าย"
      - "คำนวณทั้งสามแนวทางแล้วเลือกค่าที่มากที่สุด"
    misconceptions:
      - { match: 4, feedback: "4.0 คือค่าเฉลี่ยธรรมดาของ B หรือ C ที่ไม่ได้ถ่วงน้ำหนัก" }
      - { match: 3.7, feedback: "3.7 เป็นคะแนนของ A ซึ่งได้ผลต่อผู้ใช้สูงสุด แต่ต้นทุนสูงและดูแลยาก คะแนนรวมจึงไม่สูงสุด" }
    solution: "A = 0.5(5) + 0.3(2) + 0.2(3) = 3.7 B = 0.5(4) + 0.3(3) + 0.2(5) = 3.9 C = 0.5(3) + 0.3(5) + 0.2(4) = 3.8 สูงที่สุดคือ B 3.9 คะแนน การถ่วงน้ำหนักทำให้เห็นว่าทางที่ดูดีที่สุดด้านเดียวไม่จำเป็นต้องดีที่สุดโดยรวม"
    license: CC-BY-SA-4.0
    ai_assisted: true
