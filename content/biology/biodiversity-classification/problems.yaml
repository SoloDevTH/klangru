  - id: biology.diversity.biodiversity-classification.p017
    topics: [biology.diversity.biodiversity-classification]
    difficulty: 5
    type: mcq
    stem: "คีย์ของเพื่อนสำหรับ ยีสต์ ยูกลีนา สาหร่ายเตาน้ำ และไส้เดือนดิน คือ 1ก มีคลอโรฟิลล์ → ข้อ 2 1ข ไม่มีคลอโรฟิลล์ → ข้อ 3 2ก หลายเซลล์ → สาหร่ายเตาน้ำ 2ข เซลล์เดียว → ยูกลีนา 3ก เซลล์เดียว → ยีสต์ 3ข เคลื่อนที่ได้ → ไส้เดือนดิน คีย์นี้มีปัญหาที่ข้อใด"
    choices:
      - { id: a, text: "ข้อ 3 ใช้ลักษณะคนละเรื่อง (เซลล์เดียว กับ เคลื่อนที่ได้) ซึ่งไม่ตรงข้ามกัน ควรเปลี่ยน 3ข เป็น หลายเซลล์", correct: true }
      - { id: b, text: "ข้อ 1 ผิด เพราะยูกลีนาไม่มีคลอโรฟิลล์", feedback: "ยูกลีนามีคลอโรพลาสต์และคลอโรฟิลล์ สังเคราะห์ด้วยแสงได้" }
      - { id: c, text: "ข้อ 2 ผิด เพราะสาหร่ายเตาน้ำเป็นเซลล์เดียว", feedback: "สาหร่ายเตาน้ำเป็นเส้นสายที่มีหลายเซลล์ต่อกัน" }
      - { id: d, text: "คีย์มี 3 ข้อซึ่งมากเกินไป ควรมี 2 ข้อ", feedback: "สิ่งมีชีวิต 4 ชนิดต้องใช้ 4 − 1 = 3 ข้อพอดี" }
    hints:
      - "สองทางในข้อเดียวกันต้องเป็นลักษณะเดียวกันที่ตรงข้ามกัน"
      - "ตรวจข้อ 3 ว่า 'เซลล์เดียว' กับ 'เคลื่อนที่ได้' เป็นลักษณะเดียวกันหรือไม่"
    solution: "ข้อ 3 เทียบ 'เซลล์เดียว' กับ 'เคลื่อนที่ได้' ซึ่งเป็นลักษณะคนละเรื่อง สิ่งมีชีวิตที่เป็นเซลล์เดียวและเคลื่อนที่ได้จะเข้าได้ทั้งสองทาง ควรแก้เป็น 3ก เซลล์เดียว → ยีสต์ 3ข หลายเซลล์ → ไส้เดือนดิน ส่วนข้อ 1 ข้อ 2 และจำนวนข้อถูกต้องแล้ว"
