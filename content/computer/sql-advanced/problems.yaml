  - id: computer.data.sql-advanced.p015
    topics: [computer.data.sql-advanced]
    difficulty: 4
    type: code
    stem: "เขียนฟังก์ชัน group_having(rows, key, min_count) โดยนับจำนวนแถวของแต่ละค่า key แล้วคืนลิสต์ของค่า key ที่จำนวนแถวมีอย่างน้อย min_count เรียงตามตัวอักษรของค่า key (จำลอง GROUP BY key HAVING COUNT(*) >= min_count)"
    starter: |
      def group_having(rows, key, min_count):
          # ตอนนี้คืนค่า key ทั้งหมดโดยไม่ได้ตรวจจำนวน
          return sorted({row[key] for row in rows})
    tests: |
      data = [{"seller": "ฝน"}, {"seller": "ปาน"}, {"seller": "ฝน"}, {"seller": "ต้น"}, {"seller": "ปาน"}, {"seller": "ต้น"}]
      assert group_having(data, "seller", 2) == ["ต้น", "ปาน", "ฝน"], "ทั้งสามคนมีอย่างน้อย 2 แถว"
      assert group_having(data, "seller", 3) == [], "ไม่มีผู้ขายที่มี 3 แถวขึ้นไป"
      data2 = data + [{"seller": "ฝน"}]
      assert group_having(data2, "seller", 3) == ["ฝน"], "ฝนมี 3 แถวจึงควรเหลือเพียงฝน"
    reference: |
      def group_having(rows, key, min_count):
          counts = {}
          for row in rows:
              counts[row[key]] = counts.get(row[key], 0) + 1
          return sorted(k for k, n in counts.items() if n >= min_count)
    hints:
      - "นับจำนวนแถวของแต่ละค่า key ก่อนด้วยดิกชันนารี"
      - "กรองเฉพาะค่าที่นับได้มากกว่าหรือเท่ากับ min_count แล้วเรียงผลลัพธ์"
    solution: "นับแถวต่อค่า key ด้วยดิกชันนารี แล้วคืนค่าที่ n >= min_count เรียงแล้ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.sql-advanced.p016
    topics: [computer.data.sql-advanced]
    difficulty: 4
    type: code
    stem: "เขียนฟังก์ชัน count_matches(left_keys, right_keys) โดย left_keys และ right_keys เป็นลิสต์ของค่าคีย์ ให้คืนดิกชันนารีจากคีย์ทุกตัวใน left_keys ไปเป็นจำนวนครั้งที่ปรากฏใน right_keys (จำลอง LEFT JOIN แล้ว COUNT ฝั่งขวา โดยคีย์ที่ไม่มีคู่ได้ 0)"
    starter: |
      def count_matches(left_keys, right_keys):
          # ตอนนี้ให้ทุกคีย์ได้ 1 ยังไม่ได้นับจริง
          return {k: 1 for k in left_keys}
    tests: |
      left = ["ฝน", "ปาน", "ต้น", "แนน"]
      right = ["ฝน", "ปาน", "ฝน", "ต้น", "ต้น"]
      assert count_matches(left, right) == {"ฝน": 2, "ปาน": 1, "ต้น": 2, "แนน": 0}, f"แนนไม่มีคู่ต้องได้ 0 แต่ได้ {count_matches(left, right)}"
      assert count_matches([], right) == {}, "ไม่มีแถวซ้ายต้องได้ดิกชันนารีว่าง"
    reference: |
      def count_matches(left_keys, right_keys):
          return {k: right_keys.count(k) for k in left_keys}
    hints:
      - "สำหรับแต่ละคีย์ฝั่งซ้าย ลองนับว่าปรากฏในฝั่งขวากี่ครั้ง"
      - "เมธอด count ของลิสต์คืนค่า 0 เมื่อไม่พบ จึงเหมาะกับกรณีไม่มีคู่"
    solution: "ใช้ right_keys.count(k) สำหรับแต่ละ k ในฝั่งซ้าย ซึ่งได้ 0 เมื่อไม่มีคู่ตรงกับ LEFT JOIN"
    license: CC-BY-SA-4.0
    ai_assisted: true

