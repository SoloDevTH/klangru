id: business.finance.time-value-of-money
subject: business
title:
  th: มูลค่าเงินตามเวลาในการตัดสินใจทางธุรกิจ
  en: Time value of money in business decisions
summary: มูลค่าปัจจุบันของกระแสเงินสดหลายงวด เงินงวดต้นงวด อัตราที่แท้จริง NPV และ IRR ค่างวดและตารางผ่อน การเทียบเงินกู้กับเช่าซื้อ และความเสี่ยงกับอัตราคิดลด
difficulty: 6
minutes: 45
prerequisites:
- math.number.financial-math
- business.econ.saving-investment
encompasses:
- id: math.number.financial-math
  weight: 0.5
- id: business.econ.saving-investment
  weight: 0.3
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  src: cashflow-timeline.svg
  alt: เส้นเวลาของโครงการเตาอบ (สมมติ) จากปีที่ 0 ถึงปีที่ 5 ปีที่ 0 มีลูกศรชี้ลงแสดงเงินลงทุน 200,000 บาท ปลายปีที่ 1 ถึง 4 มีลูกศรชี้ขึ้นปีละ 60,000 บาท ปลายปีที่ 5 ลูกศรชี้ขึ้น 80,000 บาท (60,000 บวกเศษซาก 20,000) ใต้แต่ละปีเขียนมูลค่าปัจจุบันที่อัตรา 10% ได้แก่ 54,545 49,587 45,079 40,981 และ 49,674 บาท รวม 239,866 บาท NPV ประมาณ 39,866 บาท
  caption: คิดลดเงินแต่ละปีกลับมาที่ปีที่ 0 แล้วรวม (อัตราคิดลด 10%)
- type: worked-example
  title: NPV ของเตาอบ
  problem: ลงทุน $200{,}000$ บาทวันนี้ ได้ $60{,}000$ บาทปลายปีที่ 1–4 และ $80{,}000$ บาทปลายปีที่ 5 อัตราผลตอบแทนที่ต้องการ $10\%$ หา NPV
  steps:
  - text: 'PV ปีที่ 1–4: $\dfrac{60{,}000}{1.1} + \dfrac{60{,}000}{1.1^2} + \dfrac{60{,}000}{1.1^3} + \dfrac{60{,}000}{1.1^4} \approx 54{,}545 + 49{,}587 + 45{,}079 + 40{,}981$'
    why: แต่ละก้อนคิดลดด้วยจำนวนปีที่ต้องรอ
  - text: 'PV ปีที่ 5: $\dfrac{80{,}000}{1.1^5} \approx 49{,}674$'
  - text: รวม PV $\approx 239{,}866$ บาท
  - text: NPV $\approx 239{,}866 - 200{,}000 = 39{,}866$ บาท มากกว่า 0 จึงควรลงทุน
    why: ร้านได้ผลตอบแทนมากกว่า 10% ที่ต้องการ
  - text: ถ้าโครงการเสี่ยงกว่าที่คิดและใช้ $14\%$ NPV ลดเหลือประมาณ $16{,}372$ บาท ยังคุ้มแต่ส่วนเผื่อน้อยลง
  answer: NPV $\approx 39{,}866$ บาท (ที่ $10\%$)
- type: check
  problem: business.finance.time-value-of-money.p004
  prompt: คิดลดแต่ละก้อนด้วยจำนวนปีของตัวเอง
- type: figure
  src: npv-profile.svg
  alt: กราฟ NPV ของโครงการเตาอบเทียบกับอัตราคิดลด แกนนอนอัตราคิดลด 0% ถึง 30% แกนตั้ง NPV −80,000 ถึง 140,000 บาท เส้นโค้งลดลงจาก 120,000 บาทที่ 0% ผ่าน 39,866 บาทที่ 10% และ 16,372 บาทที่ 14% ตัดแกนนอนที่ประมาณ 17.2% ซึ่งคือ IRR แล้วติดลบเมื่ออัตราสูงกว่านั้น
  caption: ยิ่งอัตราคิดลดสูง NPV ยิ่งต่ำ จุดตัดแกนนอนคือ IRR ≈ 17.2%
- type: interactive
  title: NPV เมื่อเปลี่ยนเงินที่ได้ต่อปี
  caption: NPV (พันบาท) $= -200 + c \cdot \dfrac{1 - (1 + r)^{-5}}{r} + 20(1 + r)^{-5}$ เมื่อแกนนอนคืออัตราคิดลด (%) ลองลด $c$ (เงินที่ได้ต่อปี พันบาท) แล้วดูว่าจุดตัดแกนนอน (IRR) เลื่อนไปทางซ้าย
  widget:
    kind: function-plot
    functions:
    - -200 + c \cdot \frac{1 - (1 + \frac{x}{100})^{-5}}{\frac{x}{100}} + 20 \cdot (1 + \frac{x}{100})^{-5}
    sliders:
    - name: c
      min: 30
      max: 90
      step: 5
      value: 60
      label: เงินที่ได้ต่อปี (พันบาท)
    x:
    - 1
    - 30
    y:
    - -100
    - 200
- type: worked-example
  title: อัตราที่แท้จริงของการเช่าซื้อด้วยการแบ่งครึ่งช่วง
  problem: ยอดจัด $400{,}000$ บาท ค่างวด $9{,}333.33$ บาท $48$ งวด หาอัตราดอกเบี้ยรายเดือน $i$ ที่ทำให้ $9{,}333.33 \cdot \dfrac{1 - (1 + i)^{-48}}{i} = 400{,}000$
  steps:
  - text: 'ลอง $i = 0.4\%$: PV $\approx 406,879.66$ บาท มากกว่า $400{,}000$ แปลว่า $i$ ยังต่ำไป'
    why: อัตราสูงขึ้น มูลค่าปัจจุบันลดลง
  - text: 'ลอง $i = 0.5\%$: PV $\approx 397,416.30$ บาท น้อยกว่า แปลว่า $i$ อยู่ระหว่าง $0.4\%$ กับ $0.5\%$'
  - text: 'ลอง $i = 0.45\%$: PV $\approx 402,109.42$ ยังมากกว่า $\Rightarrow$ ช่วงใหม่ $0.45\%$–$0.5\%$'
  - text: แบ่งครึ่งต่อไปเรื่อย ๆ ได้ $i \approx 0.4724\%$ ต่อเดือน
  - text: อัตราต่อปี $\approx 0.4724\% \times 12 \approx 5.67\%$ เทียบกับ $3\%$ ที่ประกาศ
    why: ดอกเบี้ยเงินต้นคงที่คิดจากยอดจัดเต็มตลอดสัญญา
  answer: ประมาณ $5.67\%$ ต่อปี
- type: check
  problem: business.finance.time-value-of-money.p006
  prompt: รวมเงินรายปีโดยไม่คิดลดได้ไหม
glossary:
- term: มูลค่าปัจจุบัน (PV)
  definition: มูลค่าวันนี้ของเงินที่จะได้รับหรือจ่ายในอนาคต หาโดยคิดลด
- term: อัตราคิดลด
  definition: อัตราผลตอบแทนที่ต้องการ ใช้แปลงเงินในอนาคตเป็นมูลค่าปัจจุบัน ควรสูงขึ้นตามความเสี่ยง
- term: มูลค่าปัจจุบันสุทธิ (NPV)
  definition: ผลรวมมูลค่าปัจจุบันของกระแสเงินสดเข้าหักเงินลงทุน
- term: อัตราผลตอบแทนภายใน (IRR)
  definition: อัตราคิดลดที่ทำให้ NPV เท่ากับศูนย์
- term: เงินงวดต้นงวด
  definition: เงินงวดที่จ่ายหรือรับต้นแต่ละงวด
- term: อัตราที่แท้จริงต่อปี (EAR)
  definition: อัตราต่อปีที่รวมผลการทบต้นหลายครั้งในปีแล้ว
- term: ลดต้นลดดอก
  definition: วิธีคิดดอกเบี้ยจากเงินต้นคงเหลือในแต่ละงวด
- term: ดอกเบี้ยแบบเงินต้นคงที่
  definition: วิธีคิดดอกเบี้ยจากยอดจัดเต็มตลอดสัญญา มักใช้ในการเช่าซื้อ
- term: การแบ่งครึ่งช่วง
  definition: วิธีหาคำตอบของสมการโดยแบ่งช่วงที่คำตอบอยู่ลงครึ่งหนึ่งซ้ำ ๆ
flashcards:
- front: NPV
  back: $\sum \dfrac{C_t}{(1 + r)^t} -$ เงินลงทุน · มากกว่า 0 = คุ้ม
- front: IRR
  back: อัตราที่ทำให้ NPV = 0 · หาโดยลองค่าและแบ่งครึ่งช่วง
- front: ค่างวดลดต้นลดดอก
  back: $R = \dfrac{P\,i}{1 - (1 + i)^{-n}}$
- front: เงินงวดต้นงวด
  back: PV ต้นงวด $=$ PV ปลายงวด $\times (1 + r)$
- front: เช่าซื้อเงินต้นคงที่
  back: อัตราที่แท้จริงเกือบ 2 เท่าของอัตราที่ประกาศ
