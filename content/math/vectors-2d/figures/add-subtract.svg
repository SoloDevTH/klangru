<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" width="560" height="270" font-family="sans-serif" font-size="16">
  <title>กฎสี่เหลี่ยมด้านขนานของ a + b และเวกเตอร์ a − b</title>
  <defs><marker id="arr0a6b60" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a6b60"/></marker><marker id="arr1f5fa8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker><marker id="arrb4521f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4521f"/></marker></defs>
  <polygon points="40.0,220.0 208.0,178.0 250.0,52.0 82.0,94.0" fill="#f2f6f5" stroke="#c3cfcc" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="5 4"/>
  <line x1="40.0" y1="220.0" x2="208.0" y2="178.0" stroke="#1f5fa8" stroke-width="3" marker-end="url(#arr1f5fa8)"/>
  <line x1="40.0" y1="220.0" x2="82.0" y2="94.0" stroke="#0a6b60" stroke-width="3" marker-end="url(#arr0a6b60)"/>
  <line x1="208.0" y1="178.0" x2="250.0" y2="52.0" stroke="#0a6b60" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr0a6b60)"/>
  <line x1="40.0" y1="220.0" x2="250.0" y2="52.0" stroke="#b4521f" stroke-width="3" marker-end="url(#arrb4521f)"/>
  <text x="136.6" y="209.5" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="bold" font-style="italic" fill="#1f5fa8">a</text>
  <text x="48.4" y="144.4" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="bold" font-style="italic" fill="#0a6b60">b</text>
  <text x="124.0" y="110.8" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="bold" font-style="italic" fill="#b4521f">a + b</text>
  <text x="145.0" y="245.2" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#6b7a76">หางต่อหัว / สี่เหลี่ยมด้านขนาน</text>
  <line x1="330.0" y1="220.0" x2="498.0" y2="178.0" stroke="#1f5fa8" stroke-width="3" marker-end="url(#arr1f5fa8)"/>
  <line x1="330.0" y1="220.0" x2="372.0" y2="94.0" stroke="#0a6b60" stroke-width="3" marker-end="url(#arr0a6b60)"/>
  <line x1="372.0" y1="94.0" x2="498.0" y2="178.0" stroke="#b4521f" stroke-width="3" marker-end="url(#arrb4521f)"/>
  <text x="426.6" y="209.5" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="bold" font-style="italic" fill="#1f5fa8">a</text>
  <text x="338.4" y="144.4" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="bold" font-style="italic" fill="#0a6b60">b</text>
  <text x="456.0" y="115.0" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="bold" font-style="italic" fill="#b4521f">a − b</text>
  <text x="435.0" y="245.2" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#6b7a76">a − b ชี้จากหัว b ไปหัว a</text>
</svg>
