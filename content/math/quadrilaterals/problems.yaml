  - id: math.geometry.quadrilaterals.p013
    topics: [math.geometry.quadrilaterals]
    difficulty: 4
    type: numeric
    stem: "ที่ดินแปลงหนึ่งเป็นรูปสี่เหลี่ยมด้านขนาน ด้านที่ติดถนนยาว $40$ เมตร ระยะตั้งฉากจากถนนถึงด้านตรงข้ามคือ $25$ เมตร ที่ดินนี้มีพื้นที่กี่ตารางวา (1 ตารางวา $= 4$ ตารางเมตร ตอบในหน่วยตารางวา)"
    answer: { value: 250, unit: ตารางวา }
    hints:
      - "หาพื้นที่เป็นตารางเมตรก่อน ด้วย ฐาน × ความสูง"
      - "แปลงตารางเมตรเป็นตารางวาโดยหารด้วย 4"
    misconceptions:
      - { match: 1000, feedback: "นั่นคือพื้นที่ในหน่วยตารางเมตร ยังต้องแปลงเป็นตารางวา" }
      - { match: 4000, feedback: "คูณด้วย 4 แทนการหาร 1 ตารางวาใหญ่กว่า 1 ตารางเมตร จำนวนตารางวาจึงต้องน้อยกว่า" }
    solution: "พื้นที่ $= 40 \\times 25 = 1{,}000$ ตารางเมตร $= 1{,}000 \\div 4 = 250$ ตารางวา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.quadrilaterals.p014
    topics: [math.geometry.quadrilaterals]
    difficulty: 4
    type: numeric
    stem: "สี่เหลี่ยมขนมเปียกปูนมีพื้นที่ $96\\ \\mathrm{cm^2}$ เส้นทแยงมุมเส้นหนึ่งยาว $12\\ \\mathrm{cm}$ เส้นทแยงมุมอีกเส้นยาวกี่เซนติเมตร (ตอบในหน่วย cm)"
    answer: { value: 16, unit: cm }
    hints:
      - "เขียน $96 = \\tfrac12 \\times 12 \\times d$"
      - "$\\tfrac12 \\times 12 = 6$ แล้วหา $d$"
    misconceptions:
      - { match: 8, feedback: "หาร 96 ด้วย 12 โดยลืมว่ามี $\\tfrac12$ ในสูตร ต้องคูณ 2 ก่อน" }
      - { match: 4, feedback: "หารด้วย 2 ซ้ำอีกครั้ง ลองแทนค่ากลับ: $\\tfrac12 \\times 12 \\times 4 = 24$ ไม่ใช่ 96" }
    solution: "$96 = \\tfrac12 \\times 12 \\times d = 6d$ จึงได้ $d = 96 \\div 6 = 16\\ \\mathrm{cm}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.quadrilaterals.p015
    topics: [math.geometry.quadrilaterals]
    difficulty: 4
    type: numeric
    stem: "รูปว่าว $ABCD$ มี $AB = AD$ และ $CB = CD$ มุม $A = 80^\\circ$ และมุม $C = 50^\\circ$ มุม $B$ มีขนาดกี่องศา (ตอบในหน่วยองศา)"
    answer: { value: 115, unit: องศา }
    hints:
      - "มุมภายในของรูปสี่เหลี่ยมรวมกันได้ $360^\\circ$"
      - "ในรูปว่าว มุมระหว่างด้านที่ไม่เท่ากัน (มุม $B$ และมุม $D$) มีขนาดเท่ากัน"
    misconceptions:
      - { match: 230, feedback: "นั่นคือผลรวมของมุม $B$ กับมุม $D$ ซึ่งเท่ากัน ต้องหารด้วย 2" }
      - { match: 50, feedback: "มุม $C$ ไม่ได้เท่ากับมุม $B$ มุมที่เท่ากันในรูปว่าวคือมุม $B$ กับมุม $D$" }
    solution: "$\\angle B + \\angle D = 360^\\circ - 80^\\circ - 50^\\circ = 230^\\circ$ และ $\\angle B = \\angle D$ จึงได้ $\\angle B = 115^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.quadrilaterals.p016
    topics: [math.geometry.quadrilaterals]
    difficulty: 5
    type: numeric
    stem: "สี่เหลี่ยมจัตุรัสรูปหนึ่งมีเส้นทแยงมุมยาว $10\\ \\mathrm{cm}$ มีพื้นที่กี่ตารางเซนติเมตร (ตอบในหน่วย cm²)"
    answer: { value: 50, unit: "cm²" }
    hints:
      - "สี่เหลี่ยมจัตุรัสเป็นสี่เหลี่ยมขนมเปียกปูนชนิดหนึ่ง"
      - "ใช้พื้นที่ $= \\tfrac12 \\times d_1 \\times d_2$ โดยเส้นทแยงมุมทั้งสองยาวเท่ากัน"
    misconceptions:
      - { match: 100, feedback: "คิดว่าด้านยาว 10 cm แต่ 10 cm คือเส้นทแยงมุม ซึ่งยาวกว่าด้าน" }
      - { match: 25, feedback: "ลองตรวจ: จัตุรัสพื้นที่ 25 มีด้าน 5 cm เส้นทแยงมุมยาวเพียงประมาณ 7.07 cm" }
    solution: "จัตุรัสเป็นขนมเปียกปูนที่เส้นทแยงมุมยาวเท่ากัน พื้นที่ $= \\tfrac12 \\times 10 \\times 10 = 50\\ \\mathrm{cm^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.quadrilaterals.p017
    topics: [math.geometry.quadrilaterals]
    difficulty: 5
    type: mcq
    stem: "รูปสี่เหลี่ยมที่เส้นทแยงมุมยาวเท่ากันและแบ่งครึ่งซึ่งกันและกัน ต้องเป็นรูปใด แน่นอน"
    choices:
      - { id: a, text: "สี่เหลี่ยมผืนผ้า", correct: true }
      - { id: b, text: "สี่เหลี่ยมจัตุรัส", feedback: "อาจเป็นจัตุรัสก็ได้ แต่ไม่จำเป็น สี่เหลี่ยมผืนผ้า 3 × 5 ก็มีเส้นทแยงมุมเท่ากันและแบ่งครึ่งกัน" }
      - { id: c, text: "สี่เหลี่ยมขนมเปียกปูน", feedback: "เส้นทแยงมุมของขนมเปียกปูนตั้งฉากกัน แต่ไม่จำเป็นต้องยาวเท่ากัน" }
      - { id: d, text: "รูปว่าว", feedback: "เส้นทแยงมุมของรูปว่าวไม่จำเป็นต้องแบ่งครึ่งซึ่งกันและกัน" }
    hints:
      - "แบ่งครึ่งซึ่งกันและกัน ทำให้เป็นสี่เหลี่ยมด้านขนาน"
      - "สี่เหลี่ยมด้านขนานชนิดใดมีเส้นทแยงมุมยาวเท่ากัน ลองนึกถึงตัวอย่างที่ไม่ใช่จัตุรัส"
    solution: "เส้นทแยงมุมแบ่งครึ่งกัน → สี่เหลี่ยมด้านขนาน ยาวเท่ากันด้วย → มุมทุกมุมเป็นมุมฉาก จึงเป็นสี่เหลี่ยมผืนผ้าแน่นอน (อาจเป็นจัตุรัสด้วยหรือไม่ก็ได้)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.quadrilaterals.p018
    topics: [math.geometry.quadrilaterals]
    difficulty: 5
    type: mcq
    stem: "ลากเส้นทแยงมุม $AC$ ในสี่เหลี่ยมด้านขนาน $ABCD$ เหตุผลใดถูกต้องที่สุดที่บอกว่า $\\triangle ABC$ เท่ากันทุกประการกับ $\\triangle CDA$"
    choices:
      - { id: a, text: "$\\angle BAC = \\angle DCA$ และ $\\angle BCA = \\angle DAC$ (มุมแย้ง) และ $AC$ เป็นด้านร่วม จึงเท่ากันแบบ มุม-ด้าน-มุม", correct: true }
      - { id: b, text: "ด้านตรงข้ามยาวเท่ากัน จึงเท่ากันแบบ ด้าน-ด้าน-ด้าน", feedback: "การที่ด้านตรงข้ามยาวเท่ากันคือสิ่งที่เราจะพิสูจน์จากความเท่ากันทุกประการนี้ จะนำมาใช้เป็นเหตุผลก่อนไม่ได้" }
      - { id: c, text: "มุม $B$ เท่ากับมุม $D$ และมี $AC$ เป็นด้านร่วม", feedback: "ข้อมูลยังไม่พอ (มุมหนึ่งกับด้านหนึ่ง) และมุม $B = D$ ก็เป็นผลที่ต้องพิสูจน์" }
    hints:
      - "เริ่มจากสิ่งที่รู้แน่นอน คือด้านตรงข้ามขนานกัน"
      - "เส้นขนานที่มีเส้นตัด ($AC$) ทำให้เกิดมุมแย้งที่เท่ากัน"
    solution: "$AB \\parallel DC$ ให้ $\\angle BAC = \\angle DCA$, $BC \\parallel AD$ ให้ $\\angle BCA = \\angle DAC$ และ $AC = CA$ จึงเท่ากันทุกประการแบบ ม.ด.ม. แล้วจึงสรุปได้ว่าด้านตรงข้ามยาวเท่ากันและมุมตรงข้ามเท่ากัน"
    license: CC-BY-SA-4.0
    ai_assisted: true
