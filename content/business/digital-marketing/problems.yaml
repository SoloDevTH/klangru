  difficulty: 3
  type: mcq
  stem: ข้อใดเป็นการตลาดออนไลน์ที่ **ไม่เหมาะสม** เลือกทุกข้อที่ถูก
  multiple: true
  choices:
  - id: a
    text: จ้างคนเขียนรีวิวปลอมว่าเคยใช้สินค้า
    correct: true
  - id: b
    text: ส่งข้อความโฆษณาไปยังเบอร์ที่ลูกค้าไม่เคยให้ความยินยอม
    correct: true
  - id: c
    text: ซื้อยอดผู้ติดตามปลอมให้เพจดูน่าเชื่อถือ
    correct: true
  - id: d
    text: ขอความยินยอมก่อนส่งข่าวโปรโมชัน และให้ยกเลิกได้ง่าย
    feedback: นี่คือวิธีที่ถูกต้อง เคารพข้อมูลส่วนบุคคลของลูกค้า
  - id: e
    text: ติดป้ายว่าเป็นโฆษณาเมื่อจ้างผู้มีชื่อเสียงรีวิว
    feedback: การเปิดเผยว่าเป็นเนื้อหาที่ได้รับค่าจ้างเป็นสิ่งที่ควรทำ
  hints:
  - คิดว่าการกระทำใดหลอกลูกค้าหรือใช้ข้อมูลโดยไม่ได้รับอนุญาต
  - ข้อมูลส่วนบุคคลต้องใช้ตามที่เจ้าของยินยอม
  solution: รีวิวปลอม ผู้ติดตามปลอม และการส่งโฆษณาโดยไม่ได้รับความยินยอม ทำให้ผู้บริโภคเข้าใจผิดหรือละเมิดข้อมูลส่วนบุคคล ร้านที่ดีควรขอความยินยอม เปิดเผยเนื้อหาที่ได้รับค่าจ้าง และให้ข้อมูลจริง
