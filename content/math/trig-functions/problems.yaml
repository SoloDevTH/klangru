    items:
      - "$\\sin\\dfrac{7\\pi}{6}$"
      - "$\\cos\\dfrac{\\pi}{2}$"
      - "$\\sin\\dfrac{\\pi}{4}$"
      - "$\\cos\\dfrac{\\pi}{6}$"
      - "$\\tan\\dfrac{\\pi}{3}$"
    hints:
      - "หาค่าแต่ละตัวจากตารางมุมพิเศษและเครื่องหมายตามควอดรันต์"
      - "$\\sin\\tfrac{7\\pi}{6}$ อยู่ในควอดรันต์ III จึงเป็นลบ"
    solution: "$\\sin\\tfrac{7\\pi}{6} = -0.5$, $\\cos\\tfrac{\\pi}{2} = 0$, $\\sin\\tfrac{\\pi}{4} \\approx 0.707$, $\\cos\\tfrac{\\pi}{6} \\approx 0.866$, $\\tan\\tfrac{\\pi}{3} \\approx 1.732$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.functions.trig-functions.p017
    topics: [math.functions.trig-functions]
    difficulty: 5
    type: mcq
    stem: "ถ้าจำกัดโดเมนของ $y = \\sin x$ ให้เหลือช่วงใดต่อไปนี้ ฟังก์ชันจะมีฟังก์ชันผกผัน"
    choices:
      - { id: a, text: "$\\left[\\dfrac{\\pi}{2}, \\dfrac{3\\pi}{2}\\right]$", correct: true }
      - { id: b, text: "$[0, \\pi]$", feedback: "ในช่วงนี้ไซน์เพิ่มจาก 0 ถึง 1 แล้วลดกลับเป็น 0 เช่น $\\sin\\tfrac{\\pi}{6} = \\sin\\tfrac{5\\pi}{6}$ จึงไม่เป็นหนึ่งต่อหนึ่ง (ช่วงนี้ใช้กับโคไซน์)" }
      - { id: c, text: "$[-\\pi, 0]$", feedback: "ไซน์ลดจาก 0 ถึง −1 แล้วเพิ่มกลับเป็น 0 ค่าซ้ำกัน จึงไม่เป็นหนึ่งต่อหนึ่ง" }
      - { id: d, text: "$[0, 2\\pi]$", feedback: "หนึ่งรอบเต็ม ทุกค่าใน $(-1, 1)$ เกิดซ้ำสองครั้ง" }
    hints:
      - "ฟังก์ชันมีตัวผกผันเมื่อเป็นหนึ่งต่อหนึ่ง เช่น เพิ่มขึ้นตลอดหรือลดลงตลอดในช่วงนั้น"
      - "ดูกราฟ $\\sin x$ ว่าช่วงใดลดลงตลอด"
    solution: "ในช่วง $\\left[\\tfrac{\\pi}{2}, \\tfrac{3\\pi}{2}\\right]$ ไซน์ลดลงตลอดจาก 1 ถึง −1 จึงเป็นหนึ่งต่อหนึ่งและมีตัวผกผัน (ฟังก์ชัน arcsin มาตรฐานเลือกช่วง $\\left[-\\tfrac{\\pi}{2}, \\tfrac{\\pi}{2}\\right]$ ซึ่งไซน์เพิ่มขึ้นตลอด) ช่วงอื่นมีค่าซ้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.functions.trig-functions.p018
    topics: [math.functions.trig-functions]
    difficulty: 5
    type: numeric
    stem: "ให้ $A$ และ $B$ เป็นมุมแหลม $\\sin A = \\dfrac35$ และ $\\cos B = \\dfrac{5}{13}$ จงหา $\\sin(A + B)$ (ทศนิยม 4 ตำแหน่ง)"
    answer: { value: 0.9692, tolerance: 0.001 }
    hints:
      - "หา $\\cos A$ และ $\\sin B$ ด้วยเอกลักษณ์พีทาโกรัส (มุมแหลมจึงเป็นบวก)"
      - "$\\sin(A + B) = \\sin A\\cos B + \\cos A\\sin B$"
    misconceptions:
      - { match: 1.5231, feedback: "บวก $\\sin A + \\sin B$ ตรง ๆ ได้ค่ามากกว่า 1 ซึ่งไซน์เป็นไม่ได้ ต้องใช้สูตรผลบวกของมุม" }
      - { match: -0.5077, feedback: "ใช้เครื่องหมายลบ ซึ่งเป็นสูตรของ $\\sin(A - B)$" }
    solution: "$\\cos A = \\tfrac45$, $\\sin B = \\tfrac{12}{13}$ ได้ $\\sin(A + B) = \\tfrac35 \\cdot \\tfrac{5}{13} + \\tfrac45 \\cdot \\tfrac{12}{13} = \\tfrac{15 + 48}{65} = \\tfrac{63}{65} \\approx 0.9692$"
    license: CC-BY-SA-4.0
    ai_assisted: true

