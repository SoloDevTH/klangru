  - id: business.stats.forecasting.p014
    topics: [business.stats.forecasting]
    difficulty: 5
    type: numeric
    stem: "จากตารางในภาพ ดัชนีฤดูกาลของ **ไตรมาส 2** เป็นเท่าไร (ตอบทศนิยม 2 ตำแหน่ง)"
    figure: { src: quarters.svg, alt: "ตารางยอดขายร้านไอศกรีมกะทิ (พันบาท สมมติ) ปีที่ 1 ไตรมาส 1 ถึง 4 เท่ากับ 80, 120, 95, 105 ปีที่ 2 เท่ากับ 88, 132, 101, 119" }
    answer: { value: 1.2, tolerance: 0.01 }
    hints:
      - "ค่าเฉลี่ยไตรมาส 2 $= \\dfrac{120 + 132}{2}$"
      - "หารด้วยค่าเฉลี่ยของทั้ง 8 ไตรมาส"
    misconceptions:
      - { match: 1.05, feedback: "หารด้วย $120$ (ค่าไตรมาส 2 ปีแรก) ต้องหารค่าเฉลี่ยไตรมาส 2 ด้วยค่าเฉลี่ยของทุกไตรมาส" }
      - { match: 0.83, feedback: "หารกลับด้าน ต้องเป็นค่าเฉลี่ยไตรมาส $\\div$ ค่าเฉลี่ยรวม" }
    solution: "ค่าเฉลี่ยไตรมาส 2 $= 126$ ค่าเฉลี่ยทุกไตรมาส $= \\dfrac{80 + 120 + 95 + 105 + 88 + 132 + 101 + 119}{8} = \\dfrac{840}{8} = 105$ ดัชนี $= 126 \\div 105 = 1.20$ ไตรมาส 2 (ช่วงหน้าร้อน) ขายสูงกว่าค่าเฉลี่ย $20\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.stats.forecasting.p015
    topics: [business.stats.forecasting]
    difficulty: 5
    type: numeric
    stem: "จากยอดขายห้าไตรมาส $20,\\ 24,\\ 23,\\ 28,\\ 30$ กับ $t = 1$ ถึง $5$ ซึ่งมี $\\sum (t - \\bar{t})(y - \\bar{y}) = 24$ และ $\\sum (t - \\bar{t})^2 = 10$ หาสัมประสิทธิ์สหสัมพันธ์ $r$ ระหว่าง $t$ กับยอดขาย (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 0.95, tolerance: 0.01 }
    hints:
      - "$r = \\dfrac{\\sum (t - \\bar{t})(y - \\bar{y})}{\\sqrt{\\sum (t - \\bar{t})^2 \\sum (y - \\bar{y})^2}}$"
      - "$\\bar{y} = 25$ หา $\\sum (y - \\bar{y})^2$ ก่อน"
    misconceptions:
      - { match: 2.4, feedback: "นั่นคือความชัน $b$ ไม่ใช่ $r$ ซึ่งต้องอยู่ระหว่าง $-1$ ถึง $1$" }
      - { match: 0.38, feedback: "หาร $24$ ด้วย $64$ ต้องหารด้วย $\\sqrt{10 \\times 64}$" }
    solution: "$\\sum (y - \\bar{y})^2 = 25 + 1 + 4 + 9 + 25 = 64$ ได้ $r = \\dfrac{24}{\\sqrt{10 \\times 64}} = \\dfrac{24}{\\sqrt{640}} \\approx 0.95$ แนวโน้มขาขึ้นชัดเจนและค่อนข้างเป็นเส้นตรง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.stats.forecasting.p016
    topics: [business.stats.forecasting]
    difficulty: 5
    type: mcq
    stem: "ร้านกาแฟใช้เส้นแนวโน้มพยากรณ์ว่าเดือนหน้าจะขาย $3{,}000$ แก้ว และ MAD ที่ผ่านมาประมาณ $250$ แก้ว นมสดเก็บได้ไม่กี่วัน ส่วนเมล็ดกาแฟเก็บได้หลายเดือน ข้อใดเป็นการใช้ค่าพยากรณ์ตัดสินใจที่ **เหมาะสม** (เลือกได้มากกว่าหนึ่งข้อ)"
    multiple: true
    choices:
      - { id: a, text: "วางแผนเป็นช่วงประมาณ $2{,}750$–$3{,}250$ แก้ว แทนตัวเลขเดียว", correct: true }
      - { id: b, text: "สั่งเมล็ดกาแฟเผื่อไว้ด้านสูง แต่สั่งนมสดทีละสัปดาห์ตามยอดขายจริง", correct: true }
      - { id: c, text: "ติดตามยอดขายจริงทุกสัปดาห์แล้วปรับค่าพยากรณ์", correct: true }
      - { id: d, text: "สั่งนมสดสำหรับ $3{,}000$ แก้วทั้งหมดตั้งแต่ต้นเดือน เพราะค่าพยากรณ์คำนวณมาแล้ว", feedback: "ไม่คิดถึงความคลาดเคลื่อนและนมที่เสียเร็ว ถ้าขายได้น้อยกว่าคาดจะเสียทิ้ง" }
    hints:
      - "ค่าพยากรณ์มีความคลาดเคลื่อน คิดเป็นช่วงจะปลอดภัยกว่า"
      - "ผลเสียของการสั่งขาดกับสั่งเกินต่างกันตามชนิดของวัตถุดิบ"
    solution: "ข้อ ก ข และ ค ใช้ค่าพยากรณ์ร่วมกับความคลาดเคลื่อนและผลกระทบของการตัดสินใจ ของเก็บนานสั่งเผื่อได้ ของเสียเร็วสั่งถี่และพอดี และปรับเมื่อมีข้อมูลใหม่ ข้อ ง เชื่อค่าพยากรณ์เป็นตัวเลขเดียวโดยไม่สนความคลาดเคลื่อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

