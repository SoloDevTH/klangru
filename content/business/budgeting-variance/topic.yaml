id: business.accounting.budgeting-variance
subject: business
title:
  th: งบประมาณ การพยากรณ์ และการวิเคราะห์ผลต่าง
  en: Budgeting, forecasting and variance analysis
summary: งบประมาณขาย การผลิต และเงินสด งบประมาณยืดหยุ่น ผลต่างราคาและปริมาณ การวัดผลส่วนงาน และการตัดสินใจระยะสั้น เช่น รับคำสั่งซื้อพิเศษ ผลิตเองหรือซื้อ
difficulty: 6
minutes: 50
prerequisites:
- business.accounting.product-costing
- business.stats.forecasting
- business.finance.break-even
encompasses:
- id: business.accounting.product-costing
  weight: 0.3
- id: business.stats.forecasting
  weight: 0.2
- id: business.finance.break-even
  weight: 0.2
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  src: flexible-budget-line.svg
  alt: กราฟเส้นต้นทุนรวมตามงบยืดหยุ่น แกนนอนจำนวนแก้ว 4,000 ถึง 8,000 แกนตั้ง 150,000 ถึง 300,000 บาท เส้นตรงสีน้ำเงิน 120,000 + 22 × จำนวนแก้ว เส้นประแนวนอนคืองบคงที่ที่ 6,000 แก้ว 252,000 บาท จุดแดงคือต้นทุนจริงที่ 6,500 แก้ว 271,200 บาท อยู่เหนือจุดบนเส้นงบยืดหยุ่นที่ 6,500 แก้ว ซึ่งควรเป็น 263,000 บาท ห่างกัน 8,200 บาท
  caption: เทียบต้นทุนจริงกับงบยืดหยุ่นที่ระดับกิจกรรมจริง ไม่ใช่กับงบคงที่
- type: worked-example
  title: รายงานผลแบบงบยืดหยุ่นของร้านกาแฟ
  problem: ร้านกาแฟบ้านสวน (สมมติ) ตั้งงบว่าจะขาย $6{,}000$ แก้ว ราคา $60$ บาท ต้นทุนผันแปรแก้วละ $22$ บาท ต้นทุนคงที่ $120{,}000$ บาท ผลจริงขาย $6{,}500$ แก้ว รายได้ $377{,}000$ บาท ต้นทุนผันแปร $148{,}200$ บาท ต้นทุนคงที่ $123{,}000$ บาท แยกผลต่างของกำไร
  steps:
  - text: 'งบคงที่: กำไร $= 228{,}000 - 120{,}000 = 108{,}000$ บาท · จริง: กำไร $= 228{,}800 - 123{,}000 = 105{,}800$ บาท'
  - text: 'งบยืดหยุ่นที่ $6{,}500$ แก้ว: รายได้ $390{,}000$ ต้นทุนผันแปร $143{,}000$ กำไร $127{,}000$ บาท'
    why: ใช้ราคาและต้นทุนต่อแก้วตามงบ แต่จำนวนแก้วจริง
  - text: ผลต่างจากปริมาณขาย $= 127{,}000 - 108{,}000 = 19{,}000$ บาท F
    why: ขายได้มากกว่าที่ตั้งไว้ 500 แก้ว แก้วละ 38 บาทของกำไรส่วนเกิน
  - text: ผลต่างงบยืดหยุ่น $= 105{,}800 - 127{,}000 = -21{,}200$ บาท U (ราคาต่ำกว่างบ $13{,}000$ ต้นทุนผันแปรเกิน $5{,}200$ ต้นทุนคงที่เกิน $3{,}000$)
  - text: 'รวม: $19{,}000$ F $-$ $21{,}200$ U $=$ $2{,}200$ U ตรงกับกำไรจริงต่ำกว่างบคงที่'
  answer: ปริมาณขาย $19{,}000$ F · งบยืดหยุ่น $21{,}200$ U · รวม $2{,}200$ U
- type: figure
  src: performance-report.svg
  alt: ตารางรายงานผลร้านกาแฟบ้านสวน เดือนมีนาคม (สมมติ) สามคอลัมน์ งบประมาณคงที่ งบยืดหยุ่น และผลจริง จำนวนแก้ว 6,000 6,500 6,500 รายได้ 360,000 390,000 377,000 ต้นทุนผันแปร 132,000 143,000 148,200 กำไรส่วนเกิน 228,000 247,000 228,800 ต้นทุนคงที่ 120,000 120,000 123,000 กำไรจากการดำเนินงาน 108,000 127,000 105,800
  caption: วางงบคงที่ งบยืดหยุ่น และผลจริงเทียบกันในรายงานเดียว
- type: check
  problem: business.accounting.budgeting-variance.p004
  prompt: ผลิตเท่าไรจึงพอขายและเหลือสต็อก
- type: figure
  src: variance-tree.svg
  alt: แผนภาพต้นไม้ผลต่างวัตถุดิบ สามกล่องเรียงลงมา ต้นทุนจริง AQ คูณ AP, ปริมาณจริงคูณราคามาตรฐาน AQ คูณ SP, และต้นทุนมาตรฐานของผลผลิตจริง SQ คูณ SP ผลต่างระหว่างกล่องบนกับกล่องกลางคือผลต่างราคา (AP − SP) × AQ ผลต่างระหว่างกล่องกลางกับกล่องล่างคือผลต่างปริมาณ (AQ − SQ) × SP ผลต่างรวมคือ AQ×AP − SQ×SP หมายเหตุว่าผลต่างราคาเป็นความรับผิดชอบของฝ่ายจัดซื้อ ผลต่างปริมาณเป็นของฝ่ายผลิต
  caption: แยกผลต่างวัตถุดิบเป็นผลต่างราคาและผลต่างปริมาณ
- type: worked-example
  title: ผลต่างราคาและปริมาณของเมล็ดกาแฟ
  problem: มาตรฐาน $18$ กรัมต่อแก้ว ราคามาตรฐาน $0.80$ บาทต่อกรัม เดือนนี้ขาย $6{,}500$ แก้ว ใช้เมล็ดจริง $123{,}500$ กรัม ราคาจริง $0.76$ บาทต่อกรัม
  steps:
  - text: $AQ \times AP = 123{,}500 \times 0.76 = 93{,}860$ บาท
  - text: $AQ \times SP = 123{,}500 \times 0.80 = 98{,}800$ บาท
  - text: $SQ \times SP = (6{,}500 \times 18) \times 0.80 = 117{,}000 \times 0.80 = 93{,}600$ บาท
    why: SQ คือปริมาณที่ควรใช้สำหรับจำนวนแก้วที่ขายจริง
  - text: ผลต่างราคา $= 93{,}860 - 98{,}800 = -4{,}940$ บาท (F) · ผลต่างปริมาณ $= 98{,}800 - 93{,}600 = 5{,}200$ บาท (U)
  - text: ผลต่างรวม $= 260$ บาท (U) ซื้อถูกแต่ใช้มากเกินจนกลบส่วนที่ประหยัด
    why: ควรถามว่าเมล็ดราคาถูกทำให้ต้องใช้มากขึ้นหรือไม่
  answer: ราคา $4{,}940$ F · ปริมาณ $5{,}200$ U · รวม $260$ U
- type: check
  problem: business.accounting.budgeting-variance.p010
  prompt: ผลต่างราคาคูณปริมาณใด
glossary:
- term: งบประมาณหลัก (master budget)
  definition: ชุดงบประมาณที่เชื่อมกันทั้งองค์กร เริ่มจากงบขาย ไปจนถึงงบเงินสดและงบการเงินประมาณการ
- term: งบประมาณคงที่ (static budget)
  definition: งบที่ทำไว้ที่ระดับกิจกรรมเดียวตามแผน ไม่ปรับตามปริมาณจริง
- term: งบประมาณยืดหยุ่น (flexible budget)
  definition: งบที่ปรับรายได้และต้นทุนผันแปรตามระดับกิจกรรมจริง ต้นทุนคงที่คงเดิม
- term: ต้นทุนมาตรฐาน
  definition: ต้นทุนที่ควรเกิดต่อหน่วยผลผลิตเมื่อทำงานอย่างมีประสิทธิภาพ ทั้งปริมาณและราคา
- term: ผลต่างราคา
  definition: ผลต่างจากการจ่ายราคาต่อหน่วยต่างจากมาตรฐาน $(AP - SP) \times AQ$
- term: ผลต่างปริมาณ (ประสิทธิภาพ)
  definition: ผลต่างจากการใช้ปริมาณต่างจากมาตรฐานของผลผลิตจริง $(AQ - SQ) \times SP$
- term: กำไรส่วนงาน
  definition: กำไรส่วนเกินของส่วนงานหักต้นทุนคงที่ที่เกิดจากส่วนงานนั้นโดยตรง ไม่รวมค่าใช้จ่ายส่วนกลางที่ปันส่วน
- term: ต้นทุนที่เกี่ยวข้อง
  definition: ต้นทุนในอนาคตที่แตกต่างกันระหว่างทางเลือก ใช้ในการตัดสินใจระยะสั้น
flashcards:
- front: ผลิต (งบการผลิต)
  back: ขาย + สินค้าปลายงวดที่ต้องการ − สินค้าต้นงวด
- front: งบยืดหยุ่นของต้นทุน
  back: ต้นทุนคงที่ + ต้นทุนผันแปรต่อหน่วย × ปริมาณจริง
- front: ผลต่างราคา / ผลต่างปริมาณ
  back: $(AP-SP)\times AQ$ · $(AQ-SQ)\times SP$
- front: รับคำสั่งซื้อพิเศษเมื่อใด
  back: มีกำลังการผลิตว่าง และราคาพิเศษ > ต้นทุนผันแปร + ต้นทุนที่เพิ่มขึ้นจริง
- front: ผลิตเองหรือซื้อ
  back: เทียบราคาซื้อกับต้นทุนผันแปร + ต้นทุนคงที่ที่เลี่ยงได้เท่านั้น
