<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 345" width="640" height="345" font-family="sans-serif">
<title>ผนังสองชั้น ชั้นซ้ายเป็นไม้อัดหนา 2 เซนติเมตร และชั้นขวาเป็นโฟมหนา 5 เซนติเมตร</title>
<defs><marker id="rh" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="640" height="345" fill="#ffffff"/>
<rect x="160" y="80" width="60" height="160" fill="#fcd9a4" stroke="#334155" stroke-width="2"/>
<rect x="220" y="80" width="150" height="160" fill="#e0f2fe" stroke="#334155" stroke-width="2"/>
<text x="190.0" y="264" text-anchor="middle" font-size="14" fill="#111" font-weight="normal">ไม้อัด</text>
<text x="295.0" y="264" text-anchor="middle" font-size="14" fill="#111" font-weight="normal">โฟมโพลีสไตรีน</text>
<line x1="160" y1="282" x2="220" y2="282" stroke="#444"/>
<text x="190.0" y="300" text-anchor="middle" font-size="13" fill="#111" font-weight="normal">2 cm</text>
<line x1="220" y1="282" x2="370" y2="282" stroke="#444"/>
<text x="295.0" y="300" text-anchor="middle" font-size="13" fill="#111" font-weight="normal">5 cm</text>
<text x="144" y="165.0" text-anchor="end" font-size="13" fill="#b91c1c" font-weight="bold">ด้านในห้อง</text>
<text x="386" y="165.0" text-anchor="start" font-size="13" fill="#1d4ed8" font-weight="bold">ด้านนอก</text>
<line x1="152" y1="200.0" x2="190" y2="200.0" stroke="#dc2626" stroke-width="3" marker-end="url(#rh)"/>
<text x="152" y="222.0" text-anchor="end" font-size="12" fill="#b91c1c" font-weight="normal">ความร้อนไหลออก</text>
<text x="320.0" y="30" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">ผนังสองชั้น (ตัดในแนวตั้ง)</text>
<text x="320.0" y="331" text-anchor="middle" font-size="12" fill="#666" font-weight="normal">ภาพไม่ได้วาดตามมาตราส่วน ความหนาที่กำกับเป็นค่าจริงตามโจทย์</text>
</svg>