id: chemistry.bonding.hybridization
subject: chemistry
title: { th: ทฤษฎีพันธะเวเลนซ์และออร์บิทัลไฮบริด, en: Valence bond theory and hybrid orbitals }
summary: อธิบายพันธะโคเวเลนต์ด้วยการซ้อนเหลื่อมของออร์บิทัล หาชนิดไฮบริด sp sp² sp³ sp³d และ sp³d² จากจำนวนกลุ่มอิเล็กตรอน และนับพันธะซิกมาและพันธะพายในโมเลกุลอินทรีย์
difficulty: 7
minutes: 45
prerequisites: [chemistry.matter.quantum-numbers-orbitals, chemistry.bonding.formal-charge-resonance]
encompasses:
  - { id: chemistry.matter.quantum-numbers-orbitals, weight: 0.3 }
  - { id: chemistry.bonding.formal-charge-resonance, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: hybrid-sp3-promotion.svg
    alt: "ไดอะแกรมสามแผง แผงซ้ายคือคาร์บอนสถานะพื้นฐาน ออร์บิทัล 2s มีอิเล็กตรอนสองตัวสวนทิศกัน และ 2p มีอิเล็กตรอนสองตัวอยู่ในสองออร์บิทัล ออร์บิทัลที่สามว่าง แผงกลางคือหลังกระตุ้น 2s มีหนึ่งตัวและ 2p มีสามตัว แผงขวามีออร์บิทัลไฮบริด sp³ สี่ออร์บิทัลเท่ากัน แต่ละออร์บิทัลมีอิเล็กตรอนหนึ่งตัว"
    caption: "คาร์บอนกระตุ้นอิเล็กตรอนหนึ่งตัวจาก 2s ไปยัง 2p แล้วผสมออร์บิทัลทั้งสี่ได้ออร์บิทัล sp³ สี่ออร์บิทัลที่เท่ากัน"
  - type: worked-example
    title: หาไฮบริดของคาร์บอนแต่ละตัวในกรดแอซีติก
    problem: "โครงสร้างของกรดแอซีติก CH₃COOH คือ CH₃–C(=O)–OH จงหาชนิดไฮบริดของคาร์บอนสองอะตอม"
    steps:
      - text: "คาร์บอนตัวแรก (หมู่ CH₃) จับกับ H สามอะตอมและ C อีกหนึ่งอะตอม รวม 4 พันธะ ไม่มีคู่โดดเดี่ยว"
        why: "หมู่ CH₃ ไม่มีพันธะคู่ จึงนับแต่ละพันธะเดี่ยวเป็นหนึ่งกลุ่ม"
      - text: "กลุ่มอิเล็กตรอน = 4 จึงเป็น sp³"
      - text: "คาร์บอนตัวที่สอง (หมู่คาร์บอกซิล) จับกับ C หนึ่งอะตอม O ด้วยพันธะคู่ และ O อีกตัวด้วยพันธะเดี่ยว รวม 3 กลุ่มอิเล็กตรอน"
        why: "พันธะคู่ C=O นับเป็นหนึ่งกลุ่มอิเล็กตรอนที่อยู่ในทิศทางเดียวกัน พาย (π) ไม่ได้เพิ่มกลุ่มใหม่"
      - text: "กลุ่มอิเล็กตรอน = 3 จึงเป็น sp²"
    answer: "คาร์บอนหมู่ CH₃ เป็น sp³ และคาร์บอนหมู่คาร์บอกซิลเป็น sp²"
  - { type: check, problem: chemistry.bonding.hybridization.p001, prompt: "ลองนับกลุ่มอิเล็กตรอนรอบคาร์บอนก่อนดูเฉลย" }
  - type: figure
    src: sigma-pi-count.svg
    alt: "โครงสร้างสามโมเลกุลเรียงกัน CO₂ มี O เชื่อม C สองพันธะเป็นเส้นทึบ และมีเส้นประโค้งสองเส้นแทนพาย เอทีน C₂H₄ มี C สองอะตอมเชื่อมด้วยเส้นทึบ มีเส้น H ยื่นออกจากแต่ละ C สองเส้น และเส้นประโค้งหนึ่งเส้นเหนือพันธะ C=C เอไทน์ C₂H₂ มี H เชื่อม C สองอะตอมเป็นเส้นตรงทึบหนึ่งเส้น และมีเส้นประโค้งสองเส้นด้านบนและด้านล่างแทนพายสองพันธะ"
    caption: "เส้นทึบคือพันธะซิกมา เส้นประโค้งคือพันธะพาย พันธะคู่มีพายหนึ่งพันธะ พันธะสามมีพายสองพันธะ"
  - type: worked-example
    title: เปรียบเทียบ NH₃ กับ H₂O เมื่อมีคู่โดดเดี่ยว
    problem: "แอมโมเนีย NH₃ และน้ำ H₂O มีอะตอมกลางที่มีอิเล็กตรอนวงนอก 5 และ 6 ตามลำดับ จงหาจำนวนกลุ่มอิเล็กตรอนและชนิดไฮบริดของอะตอมกลาง"
    steps:
      - text: "NH₃: N มีพันธะ N–H สามพันธะ และคู่โดดเดี่ยวหนึ่งคู่ รวม 3 + 1 = 4 กลุ่ม"
        why: "คู่โดดเดี่ยวต้องนับเป็นกลุ่มอิเล็กตรอนด้วย แม้ไม่ได้สร้างพันธะ"
      - text: "H₂O: O มีพันธะ O–H สองพันธะ และคู่โดดเดี่ยวสองคู่ รวม 2 + 2 = 4 กลุ่ม"
      - text: "ทั้งสองโมเลกุลมี 4 กลุ่ม จึงเป็น sp³ ทั้งคู่ แต่รูปร่างต่างกัน NH₃ เป็นรูปพีระมิดฐานสามเหลี่ยม มุมประมาณ 107° ส่วน H₂O เป็นรูปตัววี มุมประมาณ 104.5°"
        why: "คู่โดดเดี่ยวผลักพันธะแรงกว่าคู่พันธะ ทำให้มุมพันธะเล็กลงจาก 109.5°"
    answer: "ทั้งสองอะตอมกลางเป็น sp³ มี 4 กลุ่มอิเล็กตรอน แต่ H₂O มีคู่โดดเดี่ยวสองคู่ จึงโค้งงอมากกว่า"
  - type: simulation
    title: ลองต่อโมเลกุลและดูรูปร่างจากจำนวนคู่อิเล็กตรอน
    url: https://phet.colorado.edu/en/simulations/molecule-shapes
    provider: phet
    note: "ซิมูเลชัน PhET ใช้แนวคิด VSEPR เดียวกับการหาชนิดไฮบริดจากจำนวนกลุ่มอิเล็กตรอน"
  - { type: check, problem: chemistry.bonding.hybridization.p009, prompt: "คู่โดดเดี่ยวนับเป็นกลุ่มหรือไม่" }
glossary:
  - { term: ทฤษฎีพันธะเวเลนซ์, definition: "ทฤษฎีที่อธิบายว่าพันธะโคเวเลนต์เกิดจากการซ้อนเหลื่อมของออร์บิทัลของอะตอมสองอะตอม โดยอิเล็กตรอนหนึ่งคู่อยู่ร่วมกัน" }
  - { term: ออร์บิทัลไฮบริด, definition: "ออร์บิทัลใหม่ที่เกิดจากการผสมออร์บิทัลในอะตอมเดียวกันที่พลังงานใกล้กัน จำนวนออร์บิทัลใหม่เท่ากับจำนวนที่นำมารวม" }
  - { term: พันธะซิกมา (σ), definition: "พันธะโคเวเลนต์ที่เกิดจากการซ้อนเหลื่อมแบบหัวชนหัวตามแนวระหว่างนิวเคลียสสองนิวเคลียส" }
  - { term: พันธะพาย (π), definition: "พันธะที่เกิดจากการซ้อนเหลื่อมแบบด้านข้างของออร์บิทัลชนิด p ที่ตั้งฉากกับแนวพันธะซิกมา" }
  - { term: กลุ่มอิเล็กตรอน, definition: "พันธะ (ซิกมา หรือ พันธะคู่/สามทั้งชุดนับเป็นหนึ่งกลุ่ม) หรือคู่โดดเดี่ยวหนึ่งคู่ที่อยู่รอบอะตอมกลาง" }
flashcards:
  - { front: "กลุ่มอิเล็กตรอน 4 กลุ่มรอบอะตอมกลาง ไฮบริดคืออะไร", back: "sp³ มุมประมาณ 109.5° (รูปทรงสี่หน้าเมื่อไม่มีคู่โดดเดี่ยว)" }
  - { front: "พันธะคู่ C=C ประกอบด้วยอะไรบ้าง", back: "พันธะซิกมาหนึ่งพันธะและพันธะพายหนึ่งพันธะ" }
  - { front: "พันธะสาม C≡C มีพันธะซิกมาและพายกี่พันธะ", back: "σ 1 พันธะ และ π 2 พันธะ" }
  - { front: "พันธะพายหมุนรอบได้หรือไม่", back: "หมุนไม่ได้ง่าย ๆ เพราะการหมุนต้องทำลายการซ้อนเหลื่อมด้านข้างของออร์บิทัล p" }
  - { front: "ไฮบริด sp³d มีกี่ออร์บิทัลและรูปทรงแบบใด", back: "5 ออร์บิทัล เช่นในโมเลกุล PCl₅ รูปทรงสองพีระมิดฐานสามเหลี่ยม" }
