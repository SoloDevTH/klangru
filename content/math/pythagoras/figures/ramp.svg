<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 130" width="460" height="130" font-family="sans-serif" font-size="16">
  <title>ทางลาดสำหรับรถเข็น ยาวตามแนวราบ 6 m สูง 0.5 m</title>
  
  <line x1="20.0" y1="70.0" x2="440.0" y2="70.0" stroke="#6b7a76" stroke-width="1.5"/>
  <polygon points="40.0,70.0 400.0,70.0 400.0,40.0" fill="#e2f0ed" stroke="#15211e" stroke-width="2.5" stroke-linejoin="round"/>
  <polyline points="390.0,70.0 390.0,60.0 400.0,60.0" fill="none" stroke="#15211e" stroke-width="2" stroke-linejoin="round"/>
  <text x="220.0" y="90.0" text-anchor="middle" dominant-baseline="middle" fill="#0a6b60">6 m</text>
  <text x="430.0" y="55.0" text-anchor="middle" dominant-baseline="middle" fill="#0a6b60">0.5 m</text>
  <text x="218.5" y="37.1" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#b4521f">ทางลาด ?</text>
  <text x="220.0" y="118.0" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#6b7a76">(วาดตามสัดส่วนจริง)</text>
</svg>
