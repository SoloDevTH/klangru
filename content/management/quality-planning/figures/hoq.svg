<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" font-family="sans-serif" font-size="14">
<title>บ้านแห่งคุณภาพของกระติกน้ำเก็บความเย็น</title>
<rect x="0" y="0" width="860" height="440" fill="#ffffff"/>
<text x="430.0" y="26.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">บ้านแห่งคุณภาพ: กระติกน้ำเก็บความเย็น (โรงงานสมมติ)</text>
<rect x="330.0" y="100.0" width="120.0" height="70.0" rx="0" fill="#f4f7fb" stroke="#333" stroke-width="1.5"/>
<text x="390.0" y="140.0" text-anchor="middle" font-size="13" fill="#222">ความหนาฉนวน</text>
