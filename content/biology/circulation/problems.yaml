problems:
  - id: biology.animals.circulation.p001
    topics: [biology.animals.circulation]
    difficulty: 1
    type: mcq
    stem: "สัตว์ชนิดใดมีระบบหมุนเวียนเลือดแบบเปิด"
    choices:
      - { id: a, text: "ตั๊กแตน", correct: true }
      - { id: b, text: "ไส้เดือนดิน", feedback: "ไส้เดือนดินมีเลือดอยู่ในหลอดเลือดตลอด จึงเป็นระบบปิด" }
      - { id: c, text: "หมึก", feedback: "หมึกเป็นหอยที่มีระบบปิด ต่างจากหอยส่วนใหญ่" }
      - { id: d, text: "ปลานิล", feedback: "สัตว์มีกระดูกสันหลังทุกชนิดมีระบบปิด" }
    hints:
      - "ระบบเปิดคือของเหลวออกจากหลอดเลือดไปอาบเซลล์โดยตรง"
      - "สัตว์กลุ่มแมลงใช้ระบบท่อลมนำออกซิเจน"
    solution: "แมลงเช่นตั๊กแตนมีระบบเปิด หัวใจสูบของเหลวออกไปในช่องว่างของลำตัว ส่วนไส้เดือนดิน หมึก และปลามีระบบปิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.circulation.p002
    topics: [biology.animals.circulation]
    difficulty: 1
    type: text
    stem: "กลุ่มเซลล์พิเศษในห้องบนขวาที่กำหนดจังหวะการเต้นของหัวใจ เรียกว่าอะไร"
    accepted: ["เอสเอโนด", "เอส-เอ โนด", "SA node", "S-A node", "ไซโนเอเทรียลโนด", "sinoatrial node"]
    hints:
      - "เป็นตัวกำหนดจังหวะ (pacemaker) ตามธรรมชาติ"
      - "ชื่อย่อมีสองตัวอักษร คือ S และ A"
    misconceptions:
      - { match: "เอวีโนด", feedback: "เอวีโนดรับสัญญาณต่อจากเอสเอโนดและหน่วงเวลา ไม่ใช่ตัวเริ่มจังหวะ" }
      - { match: "AV node", feedback: "เอวีโนดรับสัญญาณต่อจากเอสเอโนดและหน่วงเวลา ไม่ใช่ตัวเริ่มจังหวะ" }
    solution: "เอสเอโนด (SA node) สร้างสัญญาณไฟฟ้าเป็นจังหวะ กระจายไปห้องบน แล้วผ่านเอวีโนดไปยังห้องล่าง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.circulation.p003
    topics: [biology.animals.circulation]
    difficulty: 1
    type: match
    stem: "จับคู่สัตว์กับจำนวนห้องของหัวใจ"
    pairs:
      - { left: "ปลา", right: "2 ห้อง" }
      - { left: "กบ", right: "3 ห้อง ห้องล่างห้องเดียว" }
      - { left: "จระเข้", right: "4 ห้อง (สัตว์เลื้อยคลานกลุ่มเดียวที่แยกห้องล่างสมบูรณ์)" }
      - { left: "นก", right: "4 ห้อง และเป็นสัตว์เลือดอุ่น" }
    hints:
      - "ปลามีหัวใจห้องบน 1 ห้องล่าง 1"
      - "สัตว์เลื้อยคลานส่วนใหญ่มี 3 ห้อง แต่มีข้อยกเว้นหนึ่งกลุ่ม"
    solution: "ปลามี 2 ห้อง กบมี 3 ห้อง (ห้องบน 2 ห้องล่าง 1) จระเข้มี 4 ห้อง และนกมี 4 ห้องเช่นเดียวกับสัตว์เลี้ยงลูกด้วยน้ำนม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.circulation.p004
    topics: [biology.animals.circulation]
    difficulty: 2
    type: mcq
    stem: "จากภาพหลอดเลือดในหางปลาใต้กล้องจุลทรรศน์ หลอดเลือดใดเป็นหลอดเลือดแดง"
    figure: { src: p-fish-tail.svg, alt: "ภาพหางปลาใต้กล้องจุลทรรศน์ ด้านซ้ายคือทางลำตัวปลา ด้านขวาคือทางปลายหาง มีหลอดเลือดแนวนอนสองเส้น เส้นบนชื่อ ก แคบกว่า ลูกศรเหนือเส้นชี้จากซ้ายไปขวา (จากลำตัวไปปลายหาง) เส้นล่างชื่อ ข กว้างกว่า ลูกศรชี้จากขวาไปซ้าย (จากปลายหางกลับลำตัว) ระหว่างสองเส้นมีหลอดเลือดเล็กโค้งเชื่อมกันสองเส้นชื่อ ค ข้างในมีเซลล์เม็ดเลือดเรียงแถวเดี่ยว" }
    choices:
      - { id: a, text: "ก", correct: true }
      - { id: b, text: "ข", feedback: "เลือดใน ข ไหลจากปลายหางกลับเข้าลำตัว (กลับสู่หัวใจ) จึงเป็นหลอดเลือดดำ" }
      - { id: c, text: "ค", feedback: "ค เล็กมากจนเซลล์เม็ดเลือดเรียงแถวเดี่ยว เป็นหลอดเลือดฝอย" }
      - { id: d, text: "บอกไม่ได้จากภาพ", feedback: "ทิศทางการไหลเทียบกับลำตัวบอกได้ว่าหลอดใดนำเลือดออกจากหัวใจ" }
    hints:
      - "หัวใจอยู่ในลำตัว ไม่ได้อยู่ที่หาง"
      - "หลอดเลือดแดงนำเลือดออกจากหัวใจ"
    solution: "หลอดเลือดแดงนำเลือดออกจากหัวใจซึ่งอยู่ในลำตัว ไปยังปลายหาง จึงเป็น ก ส่วน ข เป็นหลอดเลือดดำ และ ค เป็นหลอดเลือดฝอย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.circulation.p005
    topics: [biology.animals.circulation]
    difficulty: 2
    type: match
    stem: "จับคู่ส่วนประกอบของเลือดกับลักษณะเด่น"
    pairs:
      - { left: "เซลล์เม็ดเลือดแดงของคน", right: "ไม่มีนิวเคลียส รูปร่างกลมแบนเว้าตรงกลาง อายุราว 120 วัน" }
      - { left: "เซลล์เม็ดเลือดขาว", right: "มีนิวเคลียส ต่อต้านเชื้อโรค" }
      - { left: "เพลตเลต", right: "ชิ้นส่วนของเซลล์ ช่วยให้เลือดแข็งตัว" }
      - { left: "พลาสมา", right: "ของเหลวที่มีน้ำราวร้อยละ 90 และโปรตีน เช่น ไฟบริโนเจน" }
    hints:
      - "เซลล์ใดของคนที่โตเต็มที่แล้วไม่มีนิวเคลียส"
      - "ไฟบริโนเจนเป็นโปรตีนที่ละลายอยู่ในส่วนของเหลว"
    solution: "เซลล์เม็ดเลือดแดงไม่มีนิวเคลียสและอายุราว 120 วัน เซลล์เม็ดเลือดขาวมีนิวเคลียสและต่อต้านเชื้อโรค เพลตเลตเป็นชิ้นส่วนเซลล์ช่วยการแข็งตัวของเลือด และพลาสมาเป็นของเหลวที่มีโปรตีน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.circulation.p006
    topics: [biology.animals.circulation]
    difficulty: 2
    type: order
    stem: "เรียงเส้นทางของสัญญาณไฟฟ้าที่ทำให้หัวใจบีบตัวหนึ่งครั้ง"
    items:
      - "เอสเอโนดสร้างสัญญาณ"
      - "สัญญาณกระจายทั่วห้องบน ห้องบนบีบตัว"
      - "เอวีโนดรับสัญญาณและหน่วงเวลาเล็กน้อย"
      - "มัดใยกล้ามเนื้อหัวใจนำสัญญาณลงผนังกั้นห้อง"
      - "ห้องล่างทั้งสองบีบตัวพร้อมกัน"
    hints:
      - "สัญญาณเริ่มที่ห้องบนขวา"
      - "ห้องบนต้องบีบตัวก่อนห้องล่าง"
    solution: "เอสเอโนด → ห้องบนบีบตัว → เอวีโนดหน่วงเวลา → มัดใยกล้ามเนื้อหัวใจ → ห้องล่างบีบตัว การหน่วงที่เอวีโนดทำให้ห้องบนส่งเลือดลงห้องล่างได้ครบก่อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.circulation.p007
    topics: [biology.animals.circulation]
    difficulty: 3
    type: mcq
    stem: "จากภาพหลอดเลือดในหางปลา ถ้าเปรียบเทียบความเร็วการไหลของเซลล์เม็ดเลือดในหลอด ก ข และ ค ข้อใดถูกต้อง"
    figure: { src: p-fish-tail.svg, alt: "ภาพหางปลาใต้กล้องจุลทรรศน์ ด้านซ้ายคือทางลำตัวปลา ด้านขวาคือทางปลายหาง มีหลอดเลือดแนวนอนสองเส้น เส้นบนชื่อ ก แคบกว่า ลูกศรเหนือเส้นชี้จากซ้ายไปขวา (จากลำตัวไปปลายหาง) เส้นล่างชื่อ ข กว้างกว่า ลูกศรชี้จากขวาไปซ้าย (จากปลายหางกลับลำตัว) ระหว่างสองเส้นมีหลอดเลือดเล็กโค้งเชื่อมกันสองเส้นชื่อ ค ข้างในมีเซลล์เม็ดเลือดเรียงแถวเดี่ยว" }
    choices:
      - { id: a, text: "ก เร็วที่สุดและไหลเป็นจังหวะ ข ช้ากว่า ค ช้าที่สุด", correct: true }
      - { id: b, text: "ค เร็วที่สุด เพราะหลอดเล็ก เลือดจึงต้องเร่งผ่าน", feedback: "หลอดเลือดฝอยแต่ละเส้นเล็ก แต่มีจำนวนมาก พื้นที่หน้าตัดรวมจึงมากที่สุด เลือดไหลช้าที่สุด" }
      - { id: c, text: "ข เร็วที่สุด เพราะกว้างที่สุด", feedback: "หลอดเลือดดำกว้างแต่ความดันต่ำ เลือดไหลช้ากว่าในหลอดเลือดแดง" }
      - { id: d, text: "ทั้งสามหลอดไหลเร็วเท่ากัน", feedback: "สังเกตได้ชัดว่าเซลล์ในหลอดเลือดฝอยเคลื่อนช้ามาก" }
    hints:
      - "หลอดใดได้รับแรงดันจากหัวใจโดยตรง"
      - "ความเร็ว = ปริมาตรต่อเวลา ÷ พื้นที่หน้าตัดรวม"
    solution: "ก เป็นหลอดเลือดแดง ได้แรงดันจากหัวใจ จึงเร็วและเป็นจังหวะ ข เป็นหลอดเลือดดำ ช้าและสม่ำเสมอ ค เป็นหลอดเลือดฝอยซึ่งพื้นที่หน้าตัดรวมมากที่สุด จึงไหลช้าที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.circulation.p008
    topics: [biology.animals.circulation]
    difficulty: 3
    type: numeric
    stem: "หัวใจส่งเลือด 5,000 cm³ ต่อนาที ผ่านเอออร์ตาที่มีพื้นที่หน้าตัด 3 cm² เลือดในเอออร์ตาไหลด้วยความเร็วเฉลี่ยกี่เซนติเมตรต่อวินาที ตอบทศนิยม 1 ตำแหน่ง"
    answer: { value: 27.8, tolerance: 0.3, unit: cm/s }
    hints:
      - "แปลงปริมาตรต่อนาทีเป็นต่อวินาทีก่อน"
      - "v = Q ÷ A"
    misconceptions:
      - { match: 1666.7, feedback: "5,000 ÷ 3 ได้ความเร็วต่อนาที ต้องแปลงเป็นต่อวินาทีโดยหาร 60" }
      - { match: 250, feedback: "คูณพื้นที่แทนการหาร ความเร็ว = ปริมาตรต่อวินาที ÷ พื้นที่" }
    solution: "$Q = 5{,}000 \\div 60 \\approx 83.3\\ \\mathrm{cm^3/s}$ ความเร็ว $v = \\frac{Q}{A} = \\frac{83.3}{3} \\approx 27.8\\ \\mathrm{cm/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.circulation.p009
    topics: [biology.animals.circulation]
    difficulty: 3
    type: mcq
    stem: "จากภาพผลการตรวจหมู่เลือดบนแผ่นทดสอบ คนที่ 1 มีหมู่เลือดใด"
    figure: { src: p-blood-typing.svg, alt: "ตารางวงกลม 3 แถว 3 คอลัมน์ คอลัมน์คือสารแอนติ-A แอนติ-B และแอนติ-D แถวคือคนที่ 1 2 3 คนที่ 1 เลือดตกตะกอนเป็นก้อนในแอนติ-A และแอนติ-D ไม่ตกตะกอนในแอนติ-B คนที่ 2 ไม่ตกตะกอนในวงใดเลย คนที่ 3 ตกตะกอนในทั้งสามวง คำอธิบายใต้ภาพ จุดเป็นก้อนคือเลือดตกตะกอน สีเรียบสม่ำเสมอคือไม่ตกตะกอน" }
    choices:
      - { id: a, text: "A Rh บวก", correct: true }
      - { id: b, text: "B Rh บวก", feedback: "คนที่ 1 ตกตะกอนกับแอนติ-A ไม่ใช่แอนติ-B จึงมีแอนติเจน A" }
      - { id: c, text: "A Rh ลบ", feedback: "เลือดตกตะกอนกับแอนติ-D แปลว่ามีแอนติเจน D จึงเป็น Rh บวก" }
      - { id: d, text: "AB Rh บวก", feedback: "ถ้าเป็น AB ต้องตกตะกอนกับแอนติ-B ด้วย" }
    hints:
      - "เลือดตกตะกอนกับสารแอนติใด แปลว่ามีแอนติเจนนั้นบนเซลล์เม็ดเลือดแดง"
      - "แอนติ-D ใช้ตรวจระบบ Rh"
    solution: "คนที่ 1 ตกตะกอนกับแอนติ-A จึงมีแอนติเจน A ไม่ตกตะกอนกับแอนติ-B จึงไม่มีแอนติเจน B และตกตะกอนกับแอนติ-D จึงเป็น Rh บวก หมู่เลือดคือ A Rh บวก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.circulation.p010
    topics: [biology.animals.circulation]
    difficulty: 3
    type: mcq
    stem: "ความดันเลือดของชายคนหนึ่งวัดได้ 120/80 มิลลิเมตรปรอท ตัวเลข 120 หมายถึงอะไร"
    choices:
      - { id: a, text: "ความดันในหลอดเลือดแดงขณะหัวใจห้องล่างบีบตัว", correct: true }
      - { id: b, text: "ความดันขณะหัวใจคลายตัว", feedback: "ความดันขณะหัวใจคลายตัวคือตัวเลขล่าง 80" }
      - { id: c, text: "จำนวนครั้งที่หัวใจเต้นต่อนาที", feedback: "อัตราการเต้นของหัวใจมีหน่วยครั้งต่อนาที ไม่ใช่มิลลิเมตรปรอท" }
      - { id: d, text: "ความดันในหลอดเลือดดำ", feedback: "ความดันเลือดวัดที่หลอดเลือดแดงต้นแขน ความดันในหลอดเลือดดำต่ำกว่านี้มาก" }
    hints:
      - "ตัวเลขบนสูงกว่าตัวเลขล่าง"
      - "ความดันสูงสุดเกิดเมื่อห้องล่างบีบเลือดออก"
    solution: "120 คือความดันสูงสุดในหลอดเลือดแดงขณะห้องล่างบีบตัว ส่วน 80 คือความดันต่ำสุดขณะหัวใจคลายตัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.circulation.p011
    topics: [biology.animals.circulation]
    difficulty: 3
    type: mcq
    stem: "นักเรียนมีอาการเจ็บคอและคลำพบก้อนที่ข้างลำคอโตขึ้นและกดเจ็บ ก้อนนี้น่าจะเป็นอะไร และเพราะเหตุใดจึงโต"
    choices:
      - { id: a, text: "ต่อมน้ำเหลือง ซึ่งกรองเชื้อโรคและมีลิมโฟไซต์เพิ่มจำนวนเพื่อต่อสู้กับการติดเชื้อ", correct: true }
      - { id: b, text: "หลอดเลือดแดงที่อุดตัน", feedback: "หลอดเลือดแดงที่คอคลำได้เป็นชีพจร ไม่ได้โตเป็นก้อนกดเจ็บเมื่อเจ็บคอ" }
      - { id: c, text: "ต่อมน้ำลายที่สร้างเลือดเพิ่ม", feedback: "ต่อมน้ำลายไม่ได้สร้างเลือด" }
