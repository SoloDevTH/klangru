problems:
  - id: chemistry.equilibrium.chemical-equilibrium.p001
    topics: [chemistry.equilibrium.chemical-equilibrium]
    difficulty: 1
    type: mcq
    stem: "ข้อใดถูกต้องเกี่ยวกับระบบที่อยู่ในภาวะสมดุลเคมี"
    choices:
      - { id: a, text: "อัตราการเกิดปฏิกิริยาไปข้างหน้าเท่ากับอัตราย้อนกลับ", correct: true, feedback: "ถูก ปฏิกิริยายังเกิดทั้งสองทิศด้วยอัตราเท่ากัน ความเข้มข้นจึงคงที่" }
      - { id: b, text: "ความเข้มข้นของสารตั้งต้นเท่ากับความเข้มข้นของผลิตภัณฑ์", feedback: "ความเข้มข้นคงที่แต่ไม่จำเป็นต้องเท่ากัน เช่น H₂ 0.21 กับ HI 1.57 mol/L" }
      - { id: c, text: "ปฏิกิริยาหยุดเกิดแล้ว", feedback: "สมดุลเคมีเป็นสมดุลพลวัต ปฏิกิริยายังเกิดอยู่ทั้งสองทิศทาง" }
    hints:
      - "สมดุลเคมีเรียกว่าสมดุลพลวัต"
      - "อะไรทำให้ความเข้มข้นไม่เปลี่ยน ทั้งที่ปฏิกิริยายังเกิด"
    solution: "ที่ภาวะสมดุล **อัตราไปข้างหน้าเท่ากับอัตราย้อนกลับ** ความเข้มข้นของทุกสารจึงคงที่ แต่ไม่จำเป็นต้องเท่ากัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.equilibrium.chemical-equilibrium.p002
    topics: [chemistry.equilibrium.chemical-equilibrium]
    difficulty: 2
    type: mcq
    stem: "ค่าคงที่สมดุล $K_c$ ของ $\\mathrm{N_2(g) + 3H_2(g) \\rightleftharpoons 2NH_3(g)}$ เขียนได้อย่างไร"
    choices:
      - { id: a, text: "$K_c = \\dfrac{[\\mathrm{NH_3}]^2}{[\\mathrm{N_2}][\\mathrm{H_2}]^3}$", correct: true, feedback: "ถูก ผลิตภัณฑ์อยู่ด้านบน ยกกำลังด้วยสัมประสิทธิ์" }
      - { id: b, text: "$K_c = \\dfrac{[\\mathrm{N_2}][\\mathrm{H_2}]^3}{[\\mathrm{NH_3}]^2}$", feedback: "กลับเศษกับส่วน นี่คือ K ของปฏิกิริยาย้อนกลับ" }
      - { id: c, text: "$K_c = \\dfrac{2[\\mathrm{NH_3}]}{[\\mathrm{N_2}] \\cdot 3[\\mathrm{H_2}]}$", feedback: "สัมประสิทธิ์ใช้เป็นเลขยกกำลัง ไม่ใช่ตัวคูณ" }
      - { id: d, text: "$K_c = \\dfrac{[\\mathrm{NH_3}]^2}{[\\mathrm{N_2}] + [\\mathrm{H_2}]^3}$", feedback: "ความเข้มข้นของสารตั้งต้นต้องคูณกัน ไม่ใช่บวกกัน" }
    hints:
      - "ผลิตภัณฑ์อยู่เศษ สารตั้งต้นอยู่ส่วน"
      - "สัมประสิทธิ์ในสมการกลายเป็นเลขยกกำลัง"
    solution: "$K_c = \\dfrac{[\\mathrm{NH_3}]^2}{[\\mathrm{N_2}][\\mathrm{H_2}]^3}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.equilibrium.chemical-equilibrium.p003
    topics: [chemistry.equilibrium.chemical-equilibrium]
    difficulty: 2
    type: mcq
    stem: "การเผาหินปูนในเตาปิด $\\mathrm{CaCO_3(s) \\rightleftharpoons CaO(s) + CO_2(g)}$ มีค่าคงที่สมดุล $K_c$ เป็นอย่างไร"
    choices:
      - { id: a, text: "$K_c = [\\mathrm{CO_2}]$", correct: true, feedback: "ถูก ของแข็งมีความเข้มข้นคงที่ จึงไม่เขียนในสูตร" }
      - { id: b, text: "$K_c = \\dfrac{[\\mathrm{CaO}][\\mathrm{CO_2}]}{[\\mathrm{CaCO_3}]}$", feedback: "CaO และ CaCO₃ เป็นของแข็ง ไม่ใส่ในสูตร K" }
      - { id: c, text: "$K_c = \\dfrac{1}{[\\mathrm{CO_2}]}$", feedback: "CO₂ เป็นผลิตภัณฑ์ จึงอยู่ที่เศษ" }
    hints:
      - "สารใดเป็นของแข็ง"
      - "ของแข็งและของเหลวบริสุทธิ์ไม่ใส่ในสูตร K"
    solution: "CaCO₃ และ CaO เป็นของแข็ง จึงเหลือ **$K_c = [\\mathrm{CO_2}]$** แปลว่าที่อุณหภูมิหนึ่ง ความเข้มข้นของ CO₂ ที่สมดุลคงที่เสมอ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.equilibrium.chemical-equilibrium.p004
    topics: [chemistry.equilibrium.chemical-equilibrium]
    difficulty: 3
    type: numeric
    stem: "ที่อุณหภูมิหนึ่ง ระบบ $\\mathrm{N_2O_4(g) \\rightleftharpoons 2NO_2(g)}$ อยู่ในภาวะสมดุล มี $[\\mathrm{N_2O_4}] = 0.0450$ mol/L และ $[\\mathrm{NO_2}] = 0.0300$ mol/L จงหา $K_c$"
    answer: { value: 0.02, tolerance: 0.0002 }
    misconceptions:
      - { match: 0.667, feedback: "ลืมยกกำลังสองความเข้มข้นของ NO₂ ตามสัมประสิทธิ์ 2" }
      - { match: 1.333, feedback: "คูณความเข้มข้นด้วย 2 แทนการยกกำลังสอง" }
    hints:
      - "$K_c = [\\mathrm{NO_2}]^2 / [\\mathrm{N_2O_4}]$"
      - "ยกกำลังสอง 0.0300 ก่อนหาร"
    solution: "$K_c = \\dfrac{0.0300^2}{0.0450} = \\dfrac{0.000900}{0.0450} =$ **0.0200**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.equilibrium.chemical-equilibrium.p005
    topics: [chemistry.equilibrium.chemical-equilibrium]
    difficulty: 3
    type: numeric
    stem: "ที่ 430 °C ปฏิกิริยา $\\mathrm{H_2(g) + I_2(g) \\rightleftharpoons 2HI(g)}$ มี $K_c = 54.3$ ค่า $K_c$ ของ $\\mathrm{2HI(g) \\rightleftharpoons H_2(g) + I_2(g)}$ ที่อุณหภูมิเดียวกันเป็นเท่าใด"
    answer: { value: 0.0184, tolerance: 0.0002 }
    misconceptions:
      - { match: 54.3, feedback: "สมการกลับทิศ ค่า K ต้องกลับเป็นส่วนกลับ" }
      - { match: 0.136, feedback: "ถอดรากที่สองแล้วกลับเศษส่วน แต่สมการนี้เพียงกลับทิศ ไม่ได้หารสัมประสิทธิ์ด้วย 2" }
    hints:
      - "สมการใหม่คือสมการเดิมกลับทิศ"
      - "K ของปฏิกิริยาย้อนกลับ = 1/K"
    solution: "$K' = 1/54.3 =$ **0.0184**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.equilibrium.chemical-equilibrium.p006
    topics: [chemistry.equilibrium.chemical-equilibrium]
    difficulty: 4
    type: numeric
    stem: "ใส่ $\\mathrm{H_2}$ และ $\\mathrm{I_2}$ อย่างละ 0.100 mol/L ในภาชนะปิดที่ 430 °C ($K_c = 54.3$ สำหรับ $\\mathrm{H_2 + I_2 \\rightleftharpoons 2HI}$) ที่ภาวะสมดุลมี HI กี่ mol/L"
    answer: { value: 0.157, unit: mol/L, tolerance: 0.002 }
    misconceptions:
      - { match: 0.0787, feedback: "นี่คือค่า x ความเข้มข้นของ HI คือ 2x" }
      - { match: 0.2, feedback: "คิดว่าปฏิกิริยาเกิดสมบูรณ์ แต่ที่สมดุลยังเหลือ H₂ และ I₂ อยู่" }
    hints:
      - "ตาราง ICE: H₂ และ I₂ เหลือ 0.100 − x HI เป็น 2x"
      - "$\\dfrac{2x}{0.100 - x} = \\sqrt{54.3}$"
    solution: "$\\dfrac{2x}{0.100 - x} = 7.369$ ได้ $x = 0.7369/9.369 = 0.0787$ จึงได้ $[\\mathrm{HI}] = 2x =$ **0.157 mol/L**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.equilibrium.chemical-equilibrium.p007
    topics: [chemistry.equilibrium.chemical-equilibrium]
    difficulty: 4
    type: numeric
    stem: "ใส่ $\\mathrm{PCl_5}$ 0.200 mol ในภาชนะ 1.00 L ที่อุณหภูมิหนึ่ง เกิด $\\mathrm{PCl_5(g) \\rightleftharpoons PCl_3(g) + Cl_2(g)}$ ที่ภาวะสมดุลเหลือ $\\mathrm{PCl_5}$ 0.120 mol/L จงหา $K_c$"
    answer: { value: 0.0533, tolerance: 0.0006 }
    misconceptions:
      - { match: 0.667, feedback: "ลืมคูณความเข้มข้นของ PCl₃ กับ Cl₂ ที่ต้องอยู่ทั้งคู่ที่เศษ" }
      - { match: 0.032, feedback: "ใช้ความเข้มข้นเริ่มต้นของ PCl₅ (0.200) แทนค่าที่สมดุล (0.120)" }
    hints:
      - "PCl₅ ลดลงเท่าใด ก็เกิด PCl₃ และ Cl₂ อย่างละเท่านั้น"
      - "$K_c = [\\mathrm{PCl_3}][\\mathrm{Cl_2}] / [\\mathrm{PCl_5}]$ ใช้ค่าที่สมดุล"
    solution: "PCl₅ ลดลง $0.200 - 0.120 = 0.080$ mol/L จึงมี PCl₃ = Cl₂ = 0.080 · $K_c = \\dfrac{0.080 \\times 0.080}{0.120} =$ **0.0533**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.equilibrium.chemical-equilibrium.p008
    topics: [chemistry.equilibrium.chemical-equilibrium]
    difficulty: 5
    type: numeric
    stem: "ที่ 250 °C ปฏิกิริยา $\\mathrm{PCl_5(g) \\rightleftharpoons PCl_3(g) + Cl_2(g)}$ มี $K_c = 0.042$ ถ้าเริ่มด้วย $\\mathrm{PCl_5}$ 0.100 mol/L เพียงอย่างเดียว ที่ภาวะสมดุลมี $\\mathrm{Cl_2}$ กี่ mol/L (แก้สมการกำลังสอง)"
    answer: { value: 0.0471, unit: mol/L, tolerance: 0.0005 }
    misconceptions:
      - { match: 0.0648, feedback: "ตัด x ในตัวส่วนทิ้ง (ประมาณ 0.100 − x ≈ 0.100) แต่ x ไม่ได้น้อยเมื่อเทียบกับ 0.100 ต้องแก้สมการกำลังสองเต็ม" }
      - { match: 0.042, feedback: "ค่า K ไม่ใช่ความเข้มข้น ต้องตั้งตาราง ICE แล้วแก้หา x" }
    hints:
      - "ตาราง ICE: $\\mathrm{PCl_5}$ เหลือ $0.100 - x$ ได้ $\\mathrm{PCl_3} = \\mathrm{Cl_2} = x$"
      - "$\\dfrac{x^2}{0.100 - x} = 0.042$ จัดเป็น $x^2 + 0.042x - 0.0042 = 0$ แล้วใช้สูตรหาราก"
    solution: "$x^2 + 0.042x - 0.0042 = 0$ ได้ $x = \\dfrac{-0.042 + \\sqrt{0.042^2 + 4(0.0042)}}{2} = \\dfrac{-0.042 + 0.1362}{2} =$ **0.0471 mol/L** (รากลบใช้ไม่ได้) ตรวจ: $0.0471^2/0.0529 = 0.042$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.equilibrium.chemical-equilibrium.p009
    topics: [chemistry.equilibrium.chemical-equilibrium]
    difficulty: 4
    type: numeric
    stem: "ที่อุณหภูมิหนึ่ง (ค่าสมมติ) $\\mathrm{2NO(g) + O_2(g) \\rightleftharpoons 2NO_2(g)}$ มี $K_1 = 40$ และ $\\mathrm{2NO_2(g) \\rightleftharpoons N_2O_4(g)}$ มี $K_2 = 0.25$ จงหา $K_c$ ของ $\\mathrm{N_2O_4(g) \\rightleftharpoons 2NO(g) + O_2(g)}$"
    answer: { value: 0.1, tolerance: 0.001 }
    misconceptions:
      - { match: 10, feedback: "10 คือ K ของ 2NO + O₂ ⇌ N₂O₄ (K₁ × K₂) สมการที่ถามเป็นทิศกลับ ต้องใช้ส่วนกลับ" }
      - { match: 160, feedback: "หาร K₁ ด้วย K₂ แต่การรวมสองขั้นต้องคูณกัน แล้วจึงกลับทิศ" }
    hints:
      - "รวมสองสมการได้ 2NO + O₂ ⇌ N₂O₄ ซึ่งมี K = K₁ × K₂"
      - "สมการที่ถามเป็นทิศกลับของสมการรวม"
    solution: "สมการรวม $K = K_1 K_2 = 40 \\times 0.25 = 10$ สมการที่ถามกลับทิศ $K = 1/10 =$ **0.10**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.equilibrium.chemical-equilibrium.p010
    topics: [chemistry.equilibrium.chemical-equilibrium]
    difficulty: 3
    type: mcq
    stem: "ที่ 430 °C ($K_c = 54.3$) ภาชนะหนึ่งมี $[\\mathrm{H_2}] = [\\mathrm{I_2}] = 0.50$ mol/L และ $[\\mathrm{HI}] = 0.50$ mol/L ระบบจะเปลี่ยนไปทางใด"
    choices:
      - { id: a, text: "ไปข้างหน้า เพราะ Q = 1.0 น้อยกว่า K", correct: true, feedback: "ถูก ผลิตภัณฑ์ยังน้อยเกินไป ปฏิกิริยาจึงเกิดไปข้างหน้ามากกว่า" }
      - { id: b, text: "ย้อนกลับ เพราะ Q น้อยกว่า K", feedback: "Q < K หมายถึงผลิตภัณฑ์ยังน้อย ระบบต้องสร้างผลิตภัณฑ์เพิ่ม ไม่ใช่ย้อนกลับ" }
      - { id: c, text: "ไม่เปลี่ยน เพราะทุกสารมีความเข้มข้นเท่ากัน", feedback: "ความเข้มข้นเท่ากันไม่ได้แปลว่าสมดุล ต้องเทียบ Q กับ K" }
    hints:
      - "คำนวณ $Q = [\\mathrm{HI}]^2 / [\\mathrm{H_2}][\\mathrm{I_2}]$"
      - "Q < K แปลว่าผลิตภัณฑ์ยังน้อยกว่าที่สมดุล"
    solution: "$Q = \\dfrac{0.50^2}{0.50 \\times 0.50} = 1.0$ ซึ่ง **น้อยกว่า K = 54.3** ระบบจึงดำเนินไปข้างหน้า HI เพิ่มขึ้นจนถึงสมดุล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.equilibrium.chemical-equilibrium.p011
    topics: [chemistry.equilibrium.chemical-equilibrium]
    difficulty: 3
    type: mcq
    stem: "สารละลาย $\\mathrm{Fe^{3+}(aq) + SCN^-(aq) \\rightleftharpoons FeSCN^{2+}(aq)}$ มีสีแดงอ่อนที่สมดุล (FeSCN²⁺ สีแดง) ถ้าหยดสารละลาย KSCN ลงไป จะสังเกตเห็นอะไร"
    choices:
      - { id: a, text: "สีแดงเข้มขึ้น เพราะสมดุลเลื่อนไปทางขวาเพื่อลด SCN⁻ ที่เติมเข้าไป", correct: true, feedback: "ถูก ระบบใช้ SCN⁻ ที่เพิ่มขึ้น ได้ FeSCN²⁺ มากขึ้น" }
      - { id: b, text: "สีแดงจางลง เพราะสมดุลเลื่อนไปทางซ้าย", feedback: "การเพิ่มสารตั้งต้นทำให้สมดุลเลื่อนไปทางผลิตภัณฑ์ ไม่ใช่ทางซ้าย" }
      - { id: c, text: "สีไม่เปลี่ยน เพราะค่า K คงที่", feedback: "K คงที่จริง แต่ความเข้มข้นแต่ละตัวเปลี่ยนได้ ระบบปรับจนได้ Q = K อีกครั้ง" }
    hints:
      - "SCN⁻ เป็นสารตั้งต้นหรือผลิตภัณฑ์"
      - "ระบบจะปรับตัวเพื่อลดผลของสิ่งที่เติมเข้าไป"
    solution: "เติม SCN⁻ (สารตั้งต้น) สมดุลเลื่อนไปข้างหน้าตามหลักของเลอชาเตอลิเอ **FeSCN²⁺ เพิ่ม สีแดงเข้มขึ้น**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.equilibrium.chemical-equilibrium.p012
    topics: [chemistry.equilibrium.chemical-equilibrium]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "การผลิตแอมโมเนีย $\\mathrm{N_2(g) + 3H_2(g) \\rightleftharpoons 2NH_3(g)}$ เป็นปฏิกิริยาคายความร้อน การเปลี่ยนแปลงใดทำให้ได้ $\\mathrm{NH_3}$ มากขึ้น **ที่ภาวะสมดุล** (เลือกได้หลายข้อ)"
    choices:
      - { id: a, text: "เพิ่มความดันโดยลดปริมาตร", correct: true, feedback: "ถูก สมดุลเลื่อนไปฝั่งที่มีโมลแก๊สน้อยกว่า (2 mol เทียบกับ 4 mol)" }
      - { id: b, text: "ลดอุณหภูมิ", correct: true, feedback: "ถูก ปฏิกิริยาไปข้างหน้าคายความร้อน การลดอุณหภูมิทำให้สมดุลเลื่อนไปทางที่คายความร้อน (แต่ปฏิกิริยาช้าลง)" }
      - { id: c, text: "ควบแน่นแยก NH₃ ออกไปเรื่อย ๆ", correct: true, feedback: "ถูก ดึงผลิตภัณฑ์ออก สมดุลเลื่อนไปข้างหน้าเพื่อสร้างทดแทน" }
      - { id: d, text: "เติมตัวเร่งปฏิกิริยาเหล็กให้มากขึ้น", feedback: "ตัวเร่งทำให้ถึงสมดุลเร็วขึ้น แต่ไม่เปลี่ยนปริมาณที่สมดุล" }
    hints:
      - "นับโมลแก๊สทั้งสองข้าง"
      - "ปฏิกิริยาไปข้างหน้าคายความร้อน ถ้าลดอุณหภูมิ ระบบจะชดเชยด้วยการคายความร้อนเพิ่ม"
    solution: "**เพิ่มความดัน ลดอุณหภูมิ และดึง NH₃ ออก** ทำให้สมดุลเลื่อนไปทางขวา ตัวเร่งไม่เปลี่ยนตำแหน่งสมดุล โรงงานจึงใช้ 450 °C ซึ่งเป็นค่าประนีประนอมระหว่างผลได้กับอัตรา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.equilibrium.chemical-equilibrium.p013
    topics: [chemistry.equilibrium.chemical-equilibrium]
    difficulty: 4
