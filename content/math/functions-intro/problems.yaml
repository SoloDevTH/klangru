  - id: math.func.p016
    topics: [math.functions.functions-intro]
    difficulty: 2
    type: expression
    stem: "ร้านให้เช่าจักรยานที่เชียงใหม่คิดค่าเช่าตามตาราง เวลา $x$ (ชั่วโมง) 0, 1, 2, 3 ค่าเช่า $y$ (บาท) 20, 35, 50, 65 เขียนค่าเช่า $y$ เป็นฟังก์ชันของ $x$"
    prefix: "y ="
    hints:
      - "เมื่อ $x$ เพิ่มทีละ 1 ค่า $y$ เพิ่มทีละเท่าใด"
      - "ค่า $y$ เมื่อ $x = 0$ คือค่าที่จ่ายแม้ยังไม่ได้ปั่น"
      - "เขียนในรูป $y = (\\text{ค่าเริ่มต้น}) + (\\text{ค่าต่อชั่วโมง}) \\times x$"
    misconceptions:
      - { match: "20x+15", feedback: "สลับบทบาทกัน 20 บาทคือค่าเมื่อ $x = 0$ (ค่าคงที่) ส่วน 15 บาทคือส่วนที่เพิ่มต่อชั่วโมง จึงต้องคูณกับ $x$" }
      - { match: "35x", feedback: "$35x$ ใช้ได้แค่ตอน $x = 1$ ลองแทน $x = 2$ ได้ 70 แต่ตารางบอก 50" }
    solution: "$x$ เพิ่มทีละ 1 ค่าเช่าเพิ่มทีละ 15 บาท และเมื่อ $x = 0$ ค่าเช่า 20 บาท จึงได้ $y = 20 + 15x$ ตรวจ: $x = 3$ ได้ $20 + 45 = 65$ ✓ ($x$ เป็นตัวแปรต้น $y$ เป็นตัวแปรตาม)"
    license: CC-BY-SA-4.0
    ai_assisted: true
    answer: { latex: "15x+20", variables: [x] }

  - id: math.func.p017
    topics: [math.functions.functions-intro]
    difficulty: 3
    type: mcq
    stem: "กราฟแสดงระยะทางจากบ้านของนักเรียนคนหนึ่งที่เดินไปโรงเรียน ระหว่างทางแวะซื้อข้าวเหนียวหมูปิ้ง ช่วงเวลาใดที่นักเรียนหยุดอยู่ที่ร้าน"
    figure: { src: walk-graph.svg, alt: "กราฟระยะทางจากบ้าน (เมตร) กับเวลา (นาที) เป็นเส้นหักสามช่วง จาก (0, 0) ขึ้นไป (5, 400) จากนั้นเป็นเส้นราบถึง (12, 400) แล้วขึ้นชันกว่าเดิมไปถึง (20, 1200)" }
    choices:
      - { id: a, text: "นาทีที่ 5 ถึงนาทีที่ 12", correct: true }
      - { id: b, text: "นาทีที่ 0 ถึงนาทีที่ 5", feedback: "ช่วงนี้ระยะทางจากบ้านเพิ่มจาก 0 เป็น 400 เมตร แปลว่ากำลังเดินอยู่" }
      - { id: c, text: "นาทีที่ 12 ถึงนาทีที่ 20", feedback: "ช่วงนี้เส้นชันที่สุด แปลว่าเดินเร็วที่สุด (ระยะทางเพิ่ม 800 เมตรใน 8 นาที) ไม่ได้หยุด" }
      - { id: d, text: "ไม่มีช่วงที่หยุด เพราะกราฟไม่ลงเลย", feedback: "หยุดอยู่กับที่ไม่ได้ทำให้กราฟลง กราฟลงแปลว่าเดินกลับทางบ้าน ส่วนหยุดอยู่กับที่ทำให้กราฟราบ" }
    hints:
