  ai_assisted: true
- id: thai.reading.fact-opinion.p012
  topics:
  - thai.reading.fact-opinion
  difficulty: 4
  type: mcq
  stem: '"นักเรียนทุกคนในโรงเรียนชอบอาหารกลางวันวันศุกร์ เพราะเพื่อนในกลุ่มของฉันสามคนบอกว่าชอบ" ข้อมูลสนับสนุนมีปัญหาอย่างไร'
  choices:
  - id: a
    text: ไม่เพียงพอ ใช้คนสามคนสรุปถึงทุกคนในโรงเรียน
    correct: true
    feedback: ถูก ตัวอย่างน้อยเกินไปสำหรับข้อสรุปที่กว้าง
  - id: b
    text: ไม่เกี่ยวข้องกับเรื่องอาหาร
    feedback: เกี่ยวข้อง แต่ไม่พอ
  - id: c
    text: ไม่มีปัญหา เพราะเพื่อนพูดจริง
    feedback: แม้เพื่อนพูดจริง ก็สรุปถึงทุกคนไม่ได้
  - id: d
    text: ผิดเพราะวันศุกร์ไม่มีอาหาร
    feedback: ไม่ใช่ประเด็น
  hints:
  - ข้อสรุปพูดถึงกี่คน
  - ข้อมูลมาจากกี่คน
  solution: ข้อมูลจาก **3 คน** ไม่เพียงพอจะสรุปถึง **ทุกคน** ในโรงเรียน
