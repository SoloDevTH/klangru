<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="520" height="330" font-family="sans-serif" font-size="14">
<title>วงจรชีวิตของอุปกรณ์คอมพิวเตอร์สี่ขั้น ขุดแร่และแปรรูป ผลิตและประกอบ ใช้งาน และซ่อม ใช้ซ้ำ หรือรีไซเคิล วนกลับไปขั้นแรก</title>
<rect x="0" y="0" width="520" height="330" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<line x1="296.3" y1="79.2" x2="387.0" y2="139.7" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
<line x1="388.7" y1="189.2" x2="298.0" y2="249.7" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
<line x1="223.7" y1="250.8" x2="133.0" y2="190.3" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
<line x1="131.3" y1="140.8" x2="222.0" y2="80.3" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
<rect x="172.0" y="33.0" width="176" height="44" rx="10" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
<text x="260.0" y="60.0" text-anchor="middle" fill="#1f2937" font-size="13">1 ขุดแร่และแปรรูป</text>
