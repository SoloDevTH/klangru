  - id: biology.animals.behaviour.p017
    topics: [biology.animals.behaviour]
    difficulty: 5
    type: numeric
    stem: "(ข้อมูลสมมติ) สิงโตที่ล่าตัวเดียวจับเหยื่อได้สำเร็จ 15% ของการล่า สิงโต 4 ตัวที่ล่าร่วมกันจับได้สำเร็จ 40% เหยื่อแต่ละตัวหนัก 200 kg และแบ่งเท่ากันในกลุ่ม โดยเฉลี่ยสิงโตในกลุ่มได้อาหารต่อตัวต่อการล่าหนึ่งครั้งกี่กิโลกรัม"
    answer: { value: 20, unit: kg }
    misconceptions:
      - { match: 80, feedback: "ยังไม่ได้แบ่งให้สมาชิก 4 ตัว" }
      - { match: 30, feedback: "30 kg คือค่าเฉลี่ยของสิงโตที่ล่าตัวเดียว (0.15 × 200)" }
      - { match: 50, feedback: "ต้องคูณด้วยโอกาสสำเร็จ 0.4 ด้วย" }
    hints:
      - "อาหารเฉลี่ยต่อการล่า = โอกาสสำเร็จ × มวลเหยื่อ"
      - "หารด้วยจำนวนสมาชิกที่แบ่งกัน"
    solution: "กลุ่มได้เฉลี่ย $0.4 \\times 200 = 80$ kg ต่อการล่า แบ่ง 4 ตัวได้ $80 \\div 4 = 20$ kg ต่อตัว น้อยกว่าล่าตัวเดียว ($0.15 \\times 200 = 30$ kg) แสดงว่าการล่าเป็นกลุ่มไม่ได้คุ้มค่าด้านอาหารเสมอ ประโยชน์อื่น เช่น ป้องกันเหยื่อจากผู้ล่าอื่นและปกป้องลูก อาจอธิบายการอยู่เป็นกลุ่มได้ดีกว่า"
