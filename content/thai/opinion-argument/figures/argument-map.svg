<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="'Sarabun','Noto Sans Thai','Noto Sans Thai UI','Leelawadee UI','Tahoma','Loma',sans-serif">
<title>แผนผังการโต้แย้ง ห้องสมุดควรเปิดช่วงพักกลางวัน</title>
<defs><marker id="a555" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="0" y="0" width="900" height="560" fill="#fff"/>
<text x="450.0" y="30.0" font-size="19" text-anchor="middle" fill="#111" font-weight="bold">แผนผังการโต้แย้ง (สมมติ)</text>
<rect x="200.0" y="44.0" width="500.0" height="84.0" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="450.0" y="68.0" font-size="15" text-anchor="middle" fill="#1565c0" font-weight="bold">ข้ออ้าง (จุดยืน)</text>
<text x="450.0" y="92.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">ห้องสมุดควรเปิดช่วงพักกลางวัน</text>
<rect x="30.0" y="170.0" width="400.0" height="90.0" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="230.0" y="194.0" font-size="15" text-anchor="middle" fill="#2e7d32" font-weight="bold">เหตุผล 1</text>
<text x="230.0" y="218.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">นักเรียนที่กลับด้วยรถรับส่ง</text>
<text x="230.0" y="239.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">ไม่มีเวลาเข้าห้องสมุดหลังเลิกเรียน</text>
<rect x="470.0" y="170.0" width="400.0" height="90.0" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="670.0" y="194.0" font-size="15" text-anchor="middle" fill="#2e7d32" font-weight="bold">เหตุผล 2</text>
<text x="670.0" y="218.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">ช่วงพักไม่มีที่สงบ</text>
<text x="670.0" y="239.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">ให้อ่านหนังสือหรือทำการบ้าน</text>
<rect x="30.0" y="300.0" width="400.0" height="90.0" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/>
<text x="230.0" y="324.0" font-size="15" text-anchor="middle" fill="#f9a825" font-weight="bold">หลักฐาน</text>
<text x="230.0" y="348.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">สำรวจ 3 ห้อง: 64 จาก 120 คน</text>
<text x="230.0" y="369.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">กลับบ้านด้วยรถรับส่ง (ราวร้อยละ 53)</text>
<rect x="470.0" y="300.0" width="400.0" height="90.0" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/>
<text x="670.0" y="324.0" font-size="15" text-anchor="middle" fill="#f9a825" font-weight="bold">หลักฐาน</text>
<text x="670.0" y="348.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">สังเกต 5 วัน: โรงอาหารและ</text>
<text x="670.0" y="369.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">ลานกิจกรรมมีเสียงดังตลอดช่วงพัก</text>
<rect x="30.0" y="440.0" width="400.0" height="90.0" rx="10" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
<text x="230.0" y="464.0" font-size="15" text-anchor="middle" fill="#ad1457" font-weight="bold">ข้อแย้งของอีกฝ่าย</text>
<text x="230.0" y="488.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">บรรณารักษ์ก็ต้องพักกลางวัน</text>
<rect x="470.0" y="440.0" width="400.0" height="90.0" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
<text x="670.0" y="464.0" font-size="15" text-anchor="middle" fill="#6a1b9a" font-weight="bold">การหักล้าง</text>
<text x="670.0" y="488.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">จัดนักเรียนอาสาช่วยเวร</text>
<text x="670.0" y="509.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">สลับเวลาพัก แล้วทดลองหนึ่งภาคเรียน</text>
<line x1="230.0" y1="170.0" x2="330.0" y2="130.0" stroke="#555" stroke-width="2" stroke-linecap="round" marker-end="url(#a555)"/>
<line x1="670.0" y1="170.0" x2="570.0" y2="130.0" stroke="#555" stroke-width="2" stroke-linecap="round" marker-end="url(#a555)"/>
<line x1="230.0" y1="300.0" x2="230.0" y2="262.0" stroke="#555" stroke-width="2" stroke-linecap="round" marker-end="url(#a555)"/>
<line x1="670.0" y1="300.0" x2="670.0" y2="262.0" stroke="#555" stroke-width="2" stroke-linecap="round" marker-end="url(#a555)"/>
<line x1="432.0" y1="485.0" x2="468.0" y2="485.0" stroke="#555" stroke-width="2" stroke-linecap="round" marker-end="url(#a555)"/>
<text x="450.0" y="418.0" font-size="13" text-anchor="middle" fill="#555" font-weight="normal">หลักฐานหนุนเหตุผล · เหตุผลหนุนข้ออ้าง · ข้อแย้งค้านข้ออ้าง แล้วถูกตอบด้วยการหักล้าง</text>
</svg>
