id: computer.systems.iot
subject: computer
title: { th: "อินเทอร์เน็ตของสรรพสิ่ง: โพรโทคอล ความปลอดภัย และผลกระทบ", en: "The Internet of Things: protocols, security and impacts" }
summary: สถาปัตยกรรม IoT จากเซนเซอร์ถึงแอป การเลือกเครือข่ายและโพรโทคอล MQTT กับ HTTP การประมวลผลที่ขอบ ภัยของอุปกรณ์และการป้องกัน และผลต่อความเป็นส่วนตัวและความเท่าเทียม
difficulty: 5.5
minutes: 45
prerequisites: [computer.systems.physical-computing, computer.security.cybersecurity-basics, computer.networks.internet-basics]
encompasses:
  - { id: computer.systems.physical-computing, weight: 0.3 }
  - { id: computer.security.cybersecurity-basics, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: iot-architecture.svg
    alt: "สี่กล่องเรียงจากซ้ายไปขวา ได้แก่ เซนเซอร์และแอคชูเอเตอร์ เกตเวย์ที่ประมวลผลที่ขอบ คลาวด์ที่เก็บและวิเคราะห์ และแอปผู้ใช้ ลูกศรระหว่างกล่องชี้จากซ้ายไปขวาตามทางของข้อมูล และมีชื่อการสื่อสารแต่ละช่วง คำสั่งจากแอปย้อนกลับตามเส้นทางเดียวกัน"
    caption: "ข้อมูลไหลขึ้นไปยังคลาวด์ และคำสั่งไหลกลับลงมาตามเส้นทางเดียวกัน"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: mqtt-publish-subscribe.svg
    alt: "เซนเซอร์อุณหภูมิเผยแพร่ข้อความไปยังตัวกลาง ตัวกลางส่งต่อข้อความไปยังแอปมือถือและจอแสดงผลในห้อง ซึ่งเป็นผู้บอกรับหัวข้อ home/room1/temp"
    caption: "ผู้เผยแพร่ไม่ต้องรู้จักผู้บอกรับ ตัวกลางเป็นตัวเชื่อมระหว่างสองฝั่ง"
  - type: worked-example
    title: ลดจำนวนข้อความด้วยการส่งให้ถี่น้อยลง
    problem: "เซนเซอร์ 10 ตัวส่งค่าทุก 1 นาที ระบบต้องรับข้อความต่อชั่วโมงเป็นจำนวนมาก ถ้าปรับให้ส่งทุก 5 นาทีแทน จำนวนข้อความต่อชั่วโมงลดลงกี่เปอร์เซ็นต์ (ค่าสมมติ)"
    steps:
      - text: "เดิมส่งทุก 1 นาที ต่อชั่วโมงแต่ละเซนเซอร์ส่ง 60 ครั้ง รวม 10 × 60 = 600 ข้อความ"
        why: "เริ่มจากตัวเลขก่อนปรับเสมอ เพื่อให้มีค่าอ้างอิงในการเปรียบเทียบ"
      - text: "ปรับเป็นทุก 5 นาที แต่ละเซนเซอร์ส่ง 12 ครั้งต่อชั่วโมง รวม 10 × 12 = 120 ข้อความ"
      - text: "ลดลง 600 − 120 = 480 ข้อความ คิดเป็น 480 ÷ 600 × 100 = 80%"
        why: "การลดลงเป็นเปอร์เซ็นต์คิดจากค่าเดิม ไม่ใช่จากค่าใหม่"
      - text: "ต้องตรวจด้วยว่าค่าที่ส่งถี่น้อยลงยังเพียงพอต่อการตัดสินใจหรือไม่ เช่น การเตือนอุณหภูมิสูงฉุกเฉิน"
        why: "การลดความถี่ช่วยประหยัด แต่ถ้าลดจนพลาดเหตุการณ์สำคัญก็ไม่คุ้ม"
    answer: "ข้อความต่อชั่วโมงลดลง 80% จาก 600 เหลือ 120 แต่ต้องตรวจว่าความถี่ใหม่ยังพอสำหรับการแจ้งเตือนที่จำเป็น"
  - { type: check, problem: computer.systems.iot.p005, prompt: "เกตเวย์ทำหน้าที่สำคัญอย่างไร" }
  - type: worked-example
    title: ตรวจอุปกรณ์ก่อนนำไปติดตั้งในอาคารเรียน
    problem: "มีอุปกรณ์เซนเซอร์ใหม่ที่ยังใช้รหัสผ่านจากโรงงาน และเฟิร์มแวร์เป็นเวอร์ชันแรกที่ออกจากโรงงาน ก่อนนำไปติดตั้งในอาคารเรียนควรตรวจอะไรบ้าง"
    steps:
      - text: "เปลี่ยนรหัสผ่านเริ่มต้นเป็นรหัสที่ไม่ซ้ำกันสำหรับแต่ละเครื่อง"
        why: "รหัสจากโรงงานมักเหมือนกันทั่วไป ผู้โจมตีลองเข้าได้ง่าย"
      - text: "ตรวจและติดตั้งเฟิร์มแวร์เวอร์ชันล่าสุดที่ผู้ผลิตแนะนำ"
        why: "ช่องโหว่ที่แก้ไปแล้วจะกลับมาเปิดอยู่ถ้าใช้เวอร์ชันเก่า"
      - text: "ตรวจว่าการสื่อสารถูกเข้ารหัสและปิดบริการที่ไม่ได้ใช้"
        why: "ข้อมูลที่ไม่เข้ารหัสอาจถูกอ่านระหว่างทาง และบริการที่เปิดไว้เป็นจุดเข้าที่ไม่จำเป็น"
      - text: "วางอุปกรณ์ไว้ในเครือข่ายแยกจากเครื่องที่ใช้ข้อมูลสำคัญ และบันทึกว่าข้อมูลใดถูกเก็บนานเท่าใด"
        why: "การแยกเครือข่ายจำกัดความเสียหายหากอุปกรณ์หนึ่งถูกเข้าควบคุม"
    answer: "เปลี่ยนรหัส อัปเดตเฟิร์มแวร์ เข้ารหัส ปิดบริการที่ไม่จำเป็น แยกเครือข่าย และกำหนดระยะเวลาเก็บข้อมูลก่อนติดตั้ง"
  - { type: check, problem: computer.systems.iot.p010, prompt: "ทำไมการอัปเดตเฟิร์มแวร์จึงสำคัญ" }
glossary:
  - { term: อินเทอร์เน็ตของสรรพสิ่ง (IoT), definition: "อุปกรณ์ทั่วไปที่มีเซนเซอร์หรือตัวควบคุม และเชื่อมต่อเครือข่ายเพื่อแลกเปลี่ยนข้อมูล" }
  - { term: เซนเซอร์ (sensor), definition: "อุปกรณ์ที่วัดค่าจากสิ่งแวดล้อม เช่น อุณหภูมิ ความชื้น หรือแสง" }
  - { term: เกตเวย์ (gateway), definition: "อุปกรณ์ที่เชื่อมอุปกรณ์ในพื้นที่เข้ากับอินเทอร์เน็ต และแปลงโพรโทคอลระหว่างกัน" }
  - { term: MQTT, definition: "โพรโทคอลแบบเผยแพร่–บอกรับที่ใช้ตัวกลางและข้อความขนาดเล็ก เหมาะกับอุปกรณ์ที่มีทรัพยากรจำกัด" }
  - { term: บอตเน็ต (botnet), definition: "กลุ่มอุปกรณ์ที่ถูกผู้โจมตียึดควบคุมไว้ แล้วใช้โจมตีบริการอื่นพร้อมกัน" }
flashcards:
  - { front: "แอคชูเอเตอร์ต่างจากเซนเซอร์อย่างไร", back: "เซนเซอร์วัดค่าเข้า ส่วนแอคชูเอเตอร์ทำให้เกิดการเปลี่ยนแปลงออกไปยังสิ่งแวดล้อม" }
  - { front: "MQTT ทำงานอย่างไร", back: "อุปกรณ์เผยแพร่ข้อความไปยังหัวข้อ ตัวกลางส่งต่อให้ผู้ที่บอกรับหัวข้อนั้น" }
  - { front: "การประมวลผลที่ขอบมีประโยชน์อย่างไร", back: "คัดกรองหรือสรุปข้อมูลใกล้อุปกรณ์ ลดการส่งขึ้นคลาวด์และตอบสนองได้เร็วขึ้น" }
  - { front: "ป้องกันบอตเน็ตในอุปกรณ์ IoT อย่างไร", back: "เปลี่ยนรหัสผ่าน อัปเดตเฟิร์มแวร์ ปิดบริการที่ไม่จำเป็น และแยกเครือข่ายของอุปกรณ์" }
