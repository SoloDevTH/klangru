  difficulty: 4
  type: mcq
  stem: '"แม่ทำอาหารในครัวทุกเย็น" ประโยคใดถูกต้อง (每天晚上 = ทุกเย็น, 厨房 chúfáng = ครัว, 做饭 zuòfàn = ทำอาหาร)'
  choices:
  - id: a
    text: 每天晚上妈妈做饭在厨房。
    feedback: สถานที่ที่ใช้ 在 ต้องอยู่หน้ากริยา
  - id: b
    text: 妈妈每天晚上在厨房做饭。
    correct: true
    feedback: ถูก ประธาน + เวลา + สถานที่ + กริยา
  - id: c
    text: 妈妈在厨房每天晚上做饭。
    feedback: ปกติเวลาวางก่อนสถานที่
  - id: d
    text: 妈妈做饭在厨房每天晚上。
    feedback: เวลาและสถานที่ต้องอยู่หน้ากริยา
  hints:
  - 'ลำดับ: ประธาน เวลา สถานที่ กริยา'
  - ภาษาไทยวาง ในครัว ทุกเย็น ไว้ท้าย แต่ภาษาจีนไม่ทำ
  solution: '**妈妈每天晚上在厨房做饭。** Māma měi tiān wǎnshang zài chúfáng zuòfàn.'
