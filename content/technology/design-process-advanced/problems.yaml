  - ทางแก้ต้องตรงกับเหตุ แล้วทดสอบซ้ำ
  solution: เหตุคือ **ระยะไกลและมีสิ่งบังเสียง** จึงเพิ่มจุดเตือนกลางซอย แล้วทดสอบซ้ำด้วยวิธีเดิม
