    ai_assisted: true

  - id: chemistry.acids-bases.polyprotic-lewis-complex.p013
    topics: [chemistry.acids-bases.polyprotic-lewis-complex]
    difficulty: 2
    type: order
    stem: "เรียงกรดต่อไปนี้จากแรงที่สุดไปอ่อนที่สุด โดยเทียบค่า Ka₁"
    items: ["H₃PO₄ (Ka₁ = 7.5 × 10⁻³)", "CH₃COOH (Ka = 1.8 × 10⁻⁵)", "H₂CO₃ (Ka₁ = 4.3 × 10⁻⁷)"]
    hints:
      - "Ka ที่มากหมายถึงกรดที่แรงกว่า"
      - "ดูเลขยกกำลังของ Ka ก่อน"
    solution: "Ka₁ = 7.5 × 10⁻³ > 1.8 × 10⁻⁵ > 4.3 × 10⁻⁷ จึงเรียงได้ H₃PO₄ > CH₃COOH > H₂CO₃"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.acids-bases.polyprotic-lewis-complex.p014
    topics: [chemistry.acids-bases.polyprotic-lewis-complex]
    difficulty: 2
    type: mcq
    stem: "ที่ pH เท่าใด สัดส่วนของ H₂CO₃ และ HCO₃⁻ เท่ากัน (Ka₁ = 4.3 × 10⁻⁷)"
    choices:
      - { id: a, text: "4.70", feedback: "4.70 คือค่า pKa ของกรดแอซีติก ไม่ใช่ของ H₂CO₃" }
      - { id: b, text: "6.37", correct: true, feedback: "ถูก pH = pKa₁ = −log(4.3 × 10⁻⁷) ≈ 6.37" }
      - { id: c, text: "8.35", feedback: "8.35 คือ pH ประมาณของจุดสมมูลแรก" }
      - { id: d, text: "10.33", feedback: "10.33 คือ pKa₂ ที่ทำให้ HCO₃⁻ และ CO₃²⁻ มีสัดส่วนเท่ากัน" }
    hints:
      - "สัดส่วนสองสปีชีส์เท่ากันที่ pH เท่ากับค่าใด"
      - "คำนวณ −log(Ka₁)"
    solution: "สัดส่วนเท่ากันที่ pH = pKa₁ = −log(4.3 × 10⁻⁷) = **6.37**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.acids-bases.polyprotic-lewis-complex.p015
    topics: [chemistry.acids-bases.polyprotic-lewis-complex]
    difficulty: 3
    type: numeric
    stem: "ประมาณ pH ของสารละลาย NaHCO₃ 0.100 M โดยใช้ pH ≈ (pKa₁ + pKa₂) / 2 (Ka₁ = 4.3 × 10⁻⁷, Ka₂ = 4.7 × 10⁻¹¹ ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 8.35, tolerance: 0.05, unit: "" }
    misconceptions:
      - { match: 10.33, feedback: "ใช้ pKa₂ แทนค่าเฉลี่ยของ pKa สองขั้น" }
    hints:
      - "หา pKa₁ และ pKa₂ จาก Ka แต่ละค่า"
      - "สารที่เป็นทั้งกรดและเบส (HCO₃⁻) ให้ pH อยู่ระหว่าง pKa สองค่า"
    solution: "pKa₁ = 6.37 และ pKa₂ = 10.33 จึงได้ pH ≈ (6.37 + 10.33) / 2 = **8.35**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.acids-bases.polyprotic-lewis-complex.p016
    topics: [chemistry.acids-bases.polyprotic-lewis-complex]
    difficulty: 4
    type: code
    stem: "เขียนฟังก์ชัน `diprotic_alpha0(h, ka1, ka2)` ที่คืนค่าสัดส่วนของ H₂A ที่ความเข้มข้นของ H⁺ เท่ากับ h จากสูตร h² / (h² + Ka₁h + Ka₁Ka₂)"
    starter: |
      def diprotic_alpha0(h, ka1, ka2):
          pass
    tests: |
      r = diprotic_alpha0(1e-7, 4.3e-7, 4.7e-11)
      assert r is not None, "ไม่ได้คืนค่า (ได้ None) ต้องใช้ return"
      assert abs(r - 0.18861) < 1e-4, f"diprotic_alpha0(1e-7, 4.3e-7, 4.7e-11) ควรได้ 0.18861 แต่ได้ {r}"
      s = diprotic_alpha0(1e-4, 4.3e-7, 4.7e-11)
      assert abs(s - 0.99572) < 1e-4, f"diprotic_alpha0(1e-4, ...) ควรได้ 0.99572 แต่ได้ {s} (ตรวจว่าใช้ h² ในตัวเศษ)"
    reference: |
      def diprotic_alpha0(h, ka1, ka2):
          return h * h / (h * h + ka1 * h + ka1 * ka2)
    hints:
      - "ตัวเศษคือ h²"
      - "ตัวส่วนรวมสามพจน์ h², Ka₁h และ Ka₁Ka₂"
    solution: "ฟังก์ชันคืน `h * h / (h * h + ka1 * h + ka1 * ka2)` เช่น diprotic_alpha0(1e-7, 4.3e-7, 4.7e-11) ≈ 0.1886"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.acids-bases.polyprotic-lewis-complex.p017
    topics: [chemistry.acids-bases.polyprotic-lewis-complex]
