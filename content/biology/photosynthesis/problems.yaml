problems:
  - id: biology.plants.photosynthesis.p001
    topics: [biology.plants.photosynthesis]
    difficulty: 1
    type: mcq
    stem: "ปฏิกิริยาแสงของการสังเคราะห์ด้วยแสงเกิดขึ้นที่ส่วนใดของคลอโรพลาสต์"
    choices:
      - { id: a, text: "เยื่อไทลาคอยด์", correct: true }
      - { id: b, text: "สโตรมา", feedback: "สโตรมาเป็นที่เกิดวัฏจักรคัลวิน" }
      - { id: c, text: "เยื่อหุ้มชั้นนอกของคลอโรพลาสต์", feedback: "เยื่อหุ้มชั้นนอกไม่มีระบบแสง" }
      - { id: d, text: "ไมโทคอนเดรีย", feedback: "ไมโทคอนเดรียเป็นที่เกิดการหายใจระดับเซลล์ ไม่ใช่ส่วนของคลอโรพลาสต์" }
    hints:
      - "ปฏิกิริยาแสงต้องใช้รงควัตถุที่รับแสง"
      - "ระบบแสงฝังอยู่บนเยื่อ"
    solution: "ระบบแสง ตัวรับอิเล็กตรอน และ ATP ซินเทสอยู่บนเยื่อไทลาคอยด์ ปฏิกิริยาแสงจึงเกิดที่นั่น ส่วนวัฏจักรคัลวินเกิดในสโตรมา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.photosynthesis.p002
    topics: [biology.plants.photosynthesis]
    difficulty: 1
    type: match
    stem: "จับคู่นักวิทยาศาสตร์กับข้อค้นพบ"
    pairs:
      - { left: "ฟาน เฮลมอนต์", right: "มวลของต้นหลิวไม่ได้มาจากดิน" }
      - { left: "อินเกนฮูซ", right: "พืชต้องได้รับแสงและใช้ส่วนสีเขียว" }
      - { left: "เองเกลมันน์", right: "แสงสีแดงและสีน้ำเงินทำให้สาหร่ายปล่อย O₂ มาก" }
      - { left: "รูเบนและคาเมน", right: "O₂ ที่พืชปล่อยมาจากน้ำ" }
      - { left: "คัลวิน", right: "ใช้ ¹⁴CO₂ ติดตามการตรึงคาร์บอน" }
    hints:
      - "นักวิทยาศาสตร์ที่ใช้ไอโซโทปมีสองคู่ คู่หนึ่งใช้ ¹⁸O อีกคนใช้ ¹⁴C"
      - "การทดลองต้นหลิวใช้เวลา 5 ปี"
    solution: "ฟาน เฮลมอนต์ศึกษาต้นหลิว อินเกนฮูซพบว่าต้องใช้แสงและส่วนสีเขียว เองเกลมันน์ใช้แบคทีเรียบอกช่วงแสง รูเบนและคาเมนใช้ ¹⁸O และคัลวินใช้ ¹⁴C"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.photosynthesis.p003
    topics: [biology.plants.photosynthesis]
    difficulty: 1
    type: text
    stem: "เอนไซม์ที่ตรึง CO₂ เข้ากับ RuBP ในวัฏจักรคัลวินชื่ออะไร"
    accepted: ["รูบิสโก", "Rubisco", "RuBisCO", "ไรบูโลสบิสฟอสเฟตคาร์บอกซิเลส", "RuBP carboxylase"]
    misconceptions:
      - { match: "PEP คาร์บอกซิเลส", feedback: "PEP คาร์บอกซิเลสตรึง CO₂ ครั้งแรกในพืช C4 และ CAM ไม่ใช่ในวัฏจักรคัลวิน" }
      - { match: "ATP ซินเทส", feedback: "ATP ซินเทสสร้าง ATP ในปฏิกิริยาแสง" }
    hints:
      - "ชื่อย่อมาจาก RuBP carboxylase/oxygenase"
      - "เอนไซม์นี้จับ O₂ ได้ด้วย ทำให้เกิดการหายใจแสง"
    solution: "รูบิสโกตรึง CO₂ กับ RuBP (5C) ได้ PGA (3C) 2 โมเลกุล เป็นเอนไซม์ที่พบมากที่สุดในใบพืช"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.photosynthesis.p004
    topics: [biology.plants.photosynthesis]
    difficulty: 2
    type: mcq
    stem: "ให้สาหร่ายได้รับน้ำที่ติดฉลากออกซิเจนเป็น H₂¹⁸O และ CO₂ ธรรมดา ¹⁸O จะพบในสารใดก่อน"
    choices:
      - { id: a, text: "แก๊ส O₂ ที่สาหร่ายปล่อยออกมา", correct: true }
      - { id: b, text: "กลูโคสที่สาหร่ายสร้าง", feedback: "ออกซิเจนในกลูโคสมาจาก CO₂ ส่วนออกซิเจนจากน้ำถูกปล่อยเป็นแก๊ส" }
      - { id: c, text: "CO₂ ในอากาศ", feedback: "พืชไม่ได้เปลี่ยนน้ำเป็น CO₂ ในการสังเคราะห์ด้วยแสง" }
      - { id: d, text: "ไม่พบที่ใดเลย", feedback: "น้ำถูกแยกในปฏิกิริยาแสง ออกซิเจนจากน้ำจึงไปอยู่ในผลิตภัณฑ์" }
    hints:
      - "ระบบแสง II แยกน้ำได้อะไร"
      - "นี่คือการทดลองของรูเบนและคาเมน"
    solution: "การแยกน้ำ $\\mathrm{2H_2O \\rightarrow 4H^+ + O_2 + 4e^-}$ ทำให้ ¹⁸O ไปอยู่ในแก๊ส O₂ แสดงว่า O₂ มาจากน้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.photosynthesis.p005
    topics: [biology.plants.photosynthesis]
    difficulty: 2
    type: numeric
    stem: "วัฏจักรคัลวินใช้ ATP กี่โมเลกุลในการตรึงคาร์บอนให้พอสร้างกลูโคส 1 โมเลกุล"
    answer: { value: 18, unit: โมเลกุล }
    misconceptions:
      - { match: 9, feedback: "9 ATP ใช้ต่อ CO₂ 3 โมเลกุล แต่กลูโคสต้องใช้ CO₂ 6 โมเลกุล" }
      - { match: 12, feedback: "12 คือจำนวน NADPH ไม่ใช่ ATP" }
      - { match: 6, feedback: "6 คือจำนวน CO₂ ที่ต้องตรึง" }
    hints:
      - "กลูโคสมีคาร์บอน 6 อะตอม"
      - "ทุก 3 CO₂ ใช้ 9 ATP"
    solution: "ต้องตรึง CO₂ 6 โมเลกุล เป็น 2 เท่าของ 3 CO₂ จึงใช้ $2 \\times 9 = 18$ ATP (และ 12 NADPH)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.photosynthesis.p006
    topics: [biology.plants.photosynthesis]
    difficulty: 2
    type: order
    stem: "เรียงเหตุการณ์ในวัฏจักรคัลวิน เริ่มจากเมื่อ CO₂ เข้าสู่สโตรมา"
    items:
      - "รูบิสโกรวม CO₂ กับ RuBP"
      - "ได้ PGA ซึ่งมีคาร์บอน 3 อะตอม"
      - "ใช้ ATP และ NADPH เปลี่ยน PGA เป็น G3P"
      - "G3P บางส่วนออกไปสร้างน้ำตาล"
      - "G3P ที่เหลือใช้ ATP สร้าง RuBP คืน"
    hints:
      - "ขั้นแรกคือการตรึงคาร์บอน"
      - "RuBP ต้องถูกสร้างคืนเป็นขั้นสุดท้ายเพื่อให้วัฏจักรดำเนินต่อ"
    solution: "ตรึง CO₂ กับ RuBP → ได้ PGA → รีดักชันเป็น G3P ด้วย ATP และ NADPH → G3P บางส่วนออกไปสร้างน้ำตาล → G3P ที่เหลือสร้าง RuBP คืน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.photosynthesis.p007
    topics: [biology.plants.photosynthesis]
    difficulty: 2
    type: mcq
    stem: "พืชเศรษฐกิจไทยชนิดใดเป็นพืช C4"
    choices:
      - { id: a, text: "อ้อย", correct: true }
      - { id: b, text: "ข้าว", feedback: "ข้าวเป็นพืช C3 ตรึง CO₂ ด้วยรูบิสโกโดยตรง" }
      - { id: c, text: "สับปะรด", feedback: "สับปะรดเป็นพืช CAM เปิดปากใบตอนกลางคืน" }
      - { id: d, text: "ถั่วเหลือง", feedback: "ถั่วเหลืองเป็นพืช C3" }
    hints:
      - "พืช C4 เติบโตดีในที่ร้อนและแดดจัด"
      - "ข้าวโพดและข้าวฟ่างเป็นพืช C4 ตัวเลือกใดเป็นพืชไร่ที่ใช้ผลิตน้ำตาลและเติบโตเร็วกลางแดดจัด"
    solution: "อ้อยเป็นพืช C4 ที่ตรึง CO₂ ด้วย PEP คาร์บอกซิเลสในเซลล์มีโซฟิลล์ก่อนส่ง CO₂ ไปเซลล์บันเดิลชีท จึงเติบโตเร็วในที่ร้อน ส่วนข้าวและถั่วเหลืองเป็น C3 และสับปะรดเป็น CAM"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.photosynthesis.p008
    topics: [biology.plants.photosynthesis]
    difficulty: 3
    type: mcq
    stem: "จากกราฟ ที่ความเข้มแสง 800 หน่วย ปัจจัยใดจำกัดอัตราการสังเคราะห์ด้วยแสงของเส้น CO₂ 0.04% ที่ 15 °C"
    figure: { src: rate-limiting-factors.svg, alt: "กราฟอัตราการปล่อย O₂ (หน่วยสัมพัทธ์ 0 ถึง 24) กับความเข้มแสง (0 ถึง 1000 หน่วยสัมพัทธ์) ข้อมูลสมมติ มี 3 เส้น ที่แสงต่ำทั้งสามเส้นเกือบทับกัน เส้นสีน้ำเงิน CO₂ 0.10% ที่ 30 °C สูงขึ้นเรื่อย ๆ ถึงราว 17 ที่แสง 800 และราว 18 ที่แสง 1000 เส้นสีส้ม CO₂ 0.04% ที่ 30 °C ราบที่ราว 12 ตั้งแต่แสงประมาณ 700 เส้นสีเขียว CO₂ 0.04% ที่ 15 °C ราบที่ราว 7 ตั้งแต่แสงประมาณ 400" }
    choices:
      - { id: a, text: "อุณหภูมิ", correct: true }
      - { id: b, text: "ความเข้มแสง", feedback: "เส้นสีเขียวราบแล้วที่แสง 800 เพิ่มแสงก็ไม่เพิ่มอัตรา" }
      - { id: c, text: "ความเข้มข้นของ CO₂", feedback: "เทียบกับเส้นสีส้มที่ CO₂ เท่ากัน (0.04%) แต่อุณหภูมิสูงกว่า อัตราสูงกว่า แสดงว่าสิ่งที่จำกัดเส้นสีเขียวคืออุณหภูมิ" }
      - { id: d, text: "ไม่มีปัจจัยใดจำกัด", feedback: "อัตราคงที่ทั้งที่ยังเพิ่มได้เมื่อเปลี่ยนเงื่อนไขอื่น จึงมีปัจจัยจำกัด" }
    hints:
      - "เทียบเส้นที่ต่างกันเพียงปัจจัยเดียว"
      - "เส้นสีส้มกับเส้นสีเขียวต่างกันที่ปัจจัยใด"
    solution: "เส้นสีเขียวราบแล้ว แสงจึงไม่จำกัด เส้นสีส้มมี CO₂ เท่ากันแต่อุณหภูมิสูงกว่าและมีอัตราสูงกว่า อุณหภูมิจึงเป็นปัจจัยจำกัดของเส้นสีเขียว เพราะเอนไซม์ในวัฏจักรคัลวินทำงานช้าที่ 15 °C"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.photosynthesis.p009
    topics: [biology.plants.photosynthesis]
    difficulty: 3
    type: numeric
    stem: "ในการทดลองแบบฟาน เฮลมอนต์ ต้นหลิวหนักขึ้นจาก 2.3 kg เป็น 76.8 kg ใน 5 ปี ส่วนดินในกระถางหายไป 0.06 kg มวลของต้นหลิวที่เพิ่มขึ้นซึ่งไม่ได้มาจากดินมีกี่กิโลกรัม (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 74.44, tolerance: 0.02, unit: kg }
    misconceptions:
      - { match: 74.5, feedback: "ยังไม่ได้หักมวลดิน 0.06 kg ที่อาจเข้าไปเป็นส่วนของต้นไม้" }
      - { match: 76.8, feedback: "76.8 kg คือมวลสุดท้าย ต้องหักมวลเริ่มต้นก่อน" }
    hints:
      - "มวลที่เพิ่ม = มวลสุดท้าย − มวลเริ่มต้น"
      - "หักส่วนที่อาจมาจากดินออก"
    solution: "มวลเพิ่ม $76.8 - 2.3 = 74.5$ kg หักดิน 0.06 kg ได้ $74.44$ kg มวลเกือบทั้งหมดจึงไม่ได้มาจากดิน ความรู้ปัจจุบันบอกว่ามาจาก CO₂ ในอากาศร่วมกับน้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.photosynthesis.p010
    topics: [biology.plants.photosynthesis]
    difficulty: 3
    type: mcq
    stem: "ในการถ่ายทอดอิเล็กตรอนแบบไม่เป็นวัฏจักร ตัวรับอิเล็กตรอนตัวสุดท้ายคือสารใด"
    choices:
      - { id: a, text: "NADP⁺", correct: true }
      - { id: b, text: "O₂", feedback: "O₂ เป็นตัวรับอิเล็กตรอนตัวสุดท้ายในการหายใจระดับเซลล์ ในปฏิกิริยาแสง O₂ เป็นผลิตภัณฑ์" }
      - { id: c, text: "H₂O", feedback: "น้ำเป็นตัวให้อิเล็กตรอน ไม่ใช่ตัวรับ" }
      - { id: d, text: "CO₂", feedback: "CO₂ ใช้ในวัฏจักรคัลวิน ไม่ได้รับอิเล็กตรอนจากระบบแสงโดยตรง" }
    hints:
      - "อิเล็กตรอนเริ่มจากน้ำและจบที่สารที่นำไปใช้ในวัฏจักรคัลวิน"
      - "สารนั้นรับอิเล็กตรอนแล้วกลายเป็น NADPH"
    solution: "อิเล็กตรอนจากน้ำผ่านระบบแสง II และ I ไปสู่ NADP⁺ ได้ NADPH ซึ่งใช้ในรีดักชันของวัฏจักรคัลวิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.photosynthesis.p011
    topics: [biology.plants.photosynthesis]
    difficulty: 3
    type: mcq
    stem: "นักเรียนวัดความเป็นกรดของน้ำคั้นจากใบสับปะรดที่ปลูกในไร่ เวลาใดน่าจะเป็นกรดมากที่สุด"
    choices:
      - { id: a, text: "เช้ามืดก่อนดวงอาทิตย์ขึ้น", correct: true }
      - { id: b, text: "เที่ยงวัน", feedback: "ตอนกลางวันกรดมาลิกถูกใช้ปล่อย CO₂ ให้วัฏจักรคัลวิน ความเป็นกรดจึงลดลง" }
      - { id: c, text: "ช่วงบ่ายแก่", feedback: "หลังใช้กรดมาลิกมาทั้งวัน ความเป็นกรดต่ำ" }
      - { id: d, text: "ทุกเวลาเท่ากัน", feedback: "พืช CAM สะสมและใช้กรดมาลิกต่างกันตามเวลา" }
    hints:
      - "สับปะรดเป็นพืช CAM"
      - "พืช CAM ตรึง CO₂ เก็บไว้เป็นกรดมาลิกตอนไหน"
    solution: "สับปะรดเปิดปากใบตอนกลางคืนและเก็บ CO₂ เป็นกรดมาลิกในแวคิวโอล กรดจึงสะสมมากที่สุดตอนเช้ามืด แล้วถูกใช้ไปตอนกลางวัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.photosynthesis.p012
    topics: [biology.plants.photosynthesis]
    difficulty: 3
    type: text
    stem: "ในพืช C4 PEP คาร์บอกซิเลสตรึง CO₂ กับ PEP ได้สารประกอบที่มีคาร์บอน 4 อะตอมเป็นสารแรก สารนี้ชื่ออะไร"
    accepted: ["ออกซาโลแอซีเตต", "ออกซาโลอะซีเตต", "ออกซาโลแอซีเทต", "OAA", "oxaloacetate", "กรดออกซาโลแอซีติก"]
    misconceptions:
      - { match: "PGA", feedback: "PGA มีคาร์บอน 3 อะตอม เป็นสารแรกของพืช C3" }
      - { match: "มาเลต", feedback: "มาเลตเกิดต่อจากสารแรกนี้ และเป็นรูปที่ส่งไปเซลล์บันเดิลชีท" }
    hints:
      - "ชื่อย่อมี 3 ตัวอักษร"
      - "สารนี้จะถูกเปลี่ยนเป็นมาเลตต่อไป"
    solution: "ออกซาโลแอซีเตต (OAA) มีคาร์บอน 4 อะตอม พืชกลุ่มนี้จึงเรียกว่าพืช C4"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.photosynthesis.p013
    topics: [biology.plants.photosynthesis]
    difficulty: 4
    type: mcq
