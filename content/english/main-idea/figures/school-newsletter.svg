<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" width="660" height="470" font-family="sans-serif">
<title>จดหมายข่าวโรงเรียนสมมุติ Ban Nong Bua School News สามข่าว</title>
<rect x="0" y="0" width="660" height="470" fill="#fff"/>
<rect x="10.0" y="10.0" width="640.0" height="450.0" rx="6" fill="#fffdf6" stroke="#555" stroke-width="2"/>
<text x="330.0" y="48.0" font-size="24" text-anchor="middle" fill="#1d3f75" font-weight="bold">BAN NONG BUA SCHOOL NEWS</text>
<text x="330.0" y="72.0" font-size="14" text-anchor="middle" fill="#555" font-weight="normal">November 2026  ·  (ข้อมูลสมมุติ)</text>
<line x1="30.0" y1="86.0" x2="630.0" y2="86.0" stroke="#1d3f75" stroke-width="2" stroke-linecap="round"/>
<text x="34.0" y="116.0" font-size="18" text-anchor="start" fill="#b3261e" font-weight="bold">Book Fair Is Coming!</text>
<text x="34.0" y="142.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">Our book fair will be held in the school library from Monday</text>
<text x="34.0" y="164.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">16 November to Friday 20 November, 8:30 a.m. – 4:00 p.m.</text>
<text x="34.0" y="186.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">Every student will get a 50-baht coupon. Don't miss it!</text>
<line x1="30.0" y1="210.0" x2="630.0" y2="210.0" stroke="#bbb" stroke-width="1" stroke-linecap="round"/>
<text x="34.0" y="240.0" font-size="18" text-anchor="start" fill="#b3261e" font-weight="bold">600 New Trees at Bang Pu</text>
<text x="34.0" y="266.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">On Saturday 7 November, 45 students from M.2 and 38 students</text>
<text x="34.0" y="288.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">from M.3 planted 600 mangrove trees at Bang Pu, Samut Prakan.</text>
<text x="34.0" y="310.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">“My feet were covered in mud, but it was fun,” said Ploy (M.2).</text>
<line x1="30.0" y1="334.0" x2="630.0" y2="334.0" stroke="#bbb" stroke-width="1" stroke-linecap="round"/>
<text x="34.0" y="364.0" font-size="18" text-anchor="start" fill="#b3261e" font-weight="bold">Sports Day Winners</text>
<text x="34.0" y="390.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">Congratulations to the Green Team! They won 12 gold medals.</text>
<text x="34.0" y="412.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">The Red Team came second with 9 gold medals, and the</text>
<text x="34.0" y="434.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">Blue Team came third with 7. The day ended with a picnic.</text>
</svg>
