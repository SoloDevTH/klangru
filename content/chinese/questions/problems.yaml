  solution: '**对，我不是中国人，我是泰国人。** ภาษาจีนและภาษาไทยตอบคำถามปฏิเสธแบบเดียวกัน คือยืนยันหรือแย้งสิ่งที่ผู้ถามพูด (ต่างจากภาษาอังกฤษที่ตอบ No, I''m not)'
