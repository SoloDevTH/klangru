  - id: earthscience.astronomy.star-formation-energy.p013
    topics: [earthscience.astronomy.star-formation-energy]
    difficulty: 5
    type: numeric
    stem: "การหลอมไฮโดรเจนเป็นฮีเลียมเปลี่ยนมวลไฮโดรเจนเป็นพลังงานราวร้อยละ 0.712 ดวงอาทิตย์ ($L = 3.828 \\times 10^{26}\\ \\mathrm{W}$) ต้องหลอมไฮโดรเจนวินาทีละกี่ $\\times 10^{11}\\ \\mathrm{kg}$ ($c = 2.998 \\times 10^8\\ \\mathrm{m/s}$)"
    answer: { value: 5.98, tolerance: 0.06, unit: "×10¹¹ kg" }
    misconceptions:
      - { match: 0.0426, feedback: "นี่คือ $L/c^2$ หรือมวลที่หายไป (4.26 × 10⁹ kg) ยังต้องหารด้วย 0.00712 เพราะมีเพียงส่วนน้อยของไฮโดรเจนที่กลายเป็นพลังงาน" }
      - { match: 0.0598, feedback: "ใช้ 0.712 แทน 0.00712 ร้อยละ 0.712 คือ 0.00712" }
    hints:
      - "มวลที่หายไปต่อวินาที $= L/c^2$"
      - "มวลไฮโดรเจนที่ใช้ $= \\dfrac{L/c^2}{0.00712}$"
    solution: "$L/c^2 = 4.26 \\times 10^9\\ \\mathrm{kg/s}$ ไฮโดรเจนที่ใช้ $= \\dfrac{4.26 \\times 10^9}{0.00712} \\approx 5.98 \\times 10^{11}\\ \\mathrm{kg/s}$ หรือราว 600 ล้านตันต่อวินาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.star-formation-energy.p014
    topics: [earthscience.astronomy.star-formation-energy]
    difficulty: 5
    type: numeric
    stem: "ถ้ากำลังส่องสว่างแปรตาม $M^{3.5}$ และดวงอาทิตย์อยู่ในลำดับหลักได้ 10,000 ล้านปี ดาวมวล 4 เท่าของดวงอาทิตย์จะอยู่ในลำดับหลักได้ราวกี่ล้านปี"
    answer: { value: 313, tolerance: 4, unit: ล้านปี }
    misconceptions:
      - { match: 40000, feedback: "คิดว่ามวลมากอยู่ได้นานกว่าตามสัดส่วนมวล แต่ดาวมวลมากใช้เชื้อเพลิงเร็วกว่ามาก" }
      - { match: 78.1, feedback: "ใช้อายุ $\\propto 1/L = M^{-3.5}$ ลืมว่ามีเชื้อเพลิงมากขึ้นตามมวล อายุ $\\propto M/L = M^{-2.5}$" }
    hints:
      - "อายุ $\\propto \\dfrac{M}{L} \\propto M^{-2.5}$"
      - "$4^{-2.5} = \\dfrac{1}{32}$"
    solution: "$4^{-2.5} = 1/32 = 0.03125$ อายุ $\\approx 0.03125 \\times 10{,}000 = 312.5 \\approx 313$ ล้านปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.star-formation-energy.p015
    topics: [earthscience.astronomy.star-formation-energy]
    difficulty: 5
    type: numeric
    stem: "ถ้าดวงอาทิตย์ส่องสว่างด้วยพลังงานโน้มถ่วงจากการหดตัวเพียงอย่างเดียว จะส่องสว่างได้นานราว $t \\approx \\dfrac{GM^2}{RL}$ ใช้ $G = 6.674 \\times 10^{-11}$, $M = 1.989 \\times 10^{30}\\ \\mathrm{kg}$, $R = 6.957 \\times 10^8\\ \\mathrm{m}$, $L = 3.828 \\times 10^{26}\\ \\mathrm{W}$ และ 1 ปี $= 3.156 \\times 10^7$ s ได้นานกี่ล้านปี"
    answer: { value: 31.4, tolerance: 0.4, unit: ล้านปี }
    misconceptions:
      - { match: 31414, feedback: "ใช้รัศมีเป็นกิโลเมตร ($6.957 \\times 10^5$) ต้องใช้หน่วยเมตร ค่าจึงมากเกินจริง 1,000 เท่า" }
      - { match: 991000000, feedback: "ยังเป็นหน่วยวินาที (ราว 9.9 × 10¹⁴ s) ต้องหารด้วยวินาทีต่อปีและแปลงเป็นล้านปี" }
    hints:
      - "$GM^2/R \\approx 3.80 \\times 10^{41}\\ \\mathrm{J}$"
      - "หารด้วย $L$ ได้วินาที แล้วหารด้วย $3.156 \\times 10^7$ และ $10^6$"
    solution: "$\\dfrac{GM^2}{R} = \\dfrac{6.674 \\times 10^{-11}(1.989 \\times 10^{30})^2}{6.957 \\times 10^8} \\approx 3.80 \\times 10^{41}$ J หารด้วย $L$ ได้ $9.91 \\times 10^{14}$ s $\\approx 3.14 \\times 10^7$ ปี หรือราว 31 ล้านปี สั้นกว่าอายุของโลก (4,600 ล้านปี) มาก ดวงอาทิตย์จึงต้องมีแหล่งพลังงานอื่น คือการหลอมนิวเคลียส แต่ช่วงเวลานี้ตรงกับความยาวช่วงก่อนเกิดที่ดาวหดตัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

