strands:
  - id: พ1
    title: การเจริญเติบโตและพัฒนาการของมนุษย์
    standards:
      - id: พ 1.1
        text: "เข้าใจธรรมชาติของการเจริญเติบโตและพัฒนาการของมนุษย์"
        indicators:
          - { id: "พ 1.1 ป.1/1", level: ป.1, text: "อธิบายลักษณะและหน้าที่ของอวัยวะภายนอก" }
          - { id: "พ 1.1 ป.1/2", level: ป.1, text: "อธิบายวิธีดูแลรักษาอวัยวะภายนอก" }
          - { id: "พ 1.1 ป.2/1", level: ป.2, text: "อธิบายลักษณะและหน้าที่ของอวัยวะภายใน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. สองฉบับเว้นวรรคต่างกัน: “อธิบายลักษณะ|และหน้าที่ของ” ไม่เว้นวรรค (ตามเอกสารตัวชี้วัดฯ สพฐ. 2551 ส่วนเอกสารต้องรู้ควรรู้ 2559 เว้นวรรค)" }
          - { id: "พ 1.1 ป.2/2", level: ป.2, text: "อธิบายวิธีดูแลรักษาอวัยวะภายใน" }
          - { id: "พ 1.1 ป.2/3", level: ป.2, text: "อธิบายธรรมชาติของชีวิตมนุษย์" }
          - { id: "พ 1.1 ป.3/1", level: ป.3, text: "อธิบายลักษณะและการเจริญเติบโตของร่างกายมนุษย์" }
          - { id: "พ 1.1 ป.3/2", level: ป.3, text: "เปรียบเทียบการเจริญเติบโตของตนเองกับเกณฑ์มาตรฐาน" }
          - { id: "พ 1.1 ป.3/3", level: ป.3, text: "ระบุปัจจัยที่มีผลต่อการเจริญเติบโต" }
          - { id: "พ 1.1 ป.4/1", level: ป.4, text: "อธิบายการเจริญเติบโต และพัฒนาการของร่างกาย และจิตใจตามวัย", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และ|พัฒนาการของ” ไม่เว้นวรรค" }
          - { id: "พ 1.1 ป.4/2", level: ป.4, text: "อธิบายความสำคัญของกล้ามเนื้อกระดูกและข้อที่มีผลต่อสุขภาพ การเจริญเติบโตและพัฒนาการ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “กล้ามเนื้อ|กระดูกและข้อ” ไม่เว้นวรรค; “ที่มีผลต่อสุขภาพ|การเจริญเติบโต” เว้นวรรค" }
          - { id: "พ 1.1 ป.4/3", level: ป.4, text: "อธิบายวิธีดูแลกล้ามเนื้อกระดูก และข้อให้ทำงานอย่างมีประสิทธิภาพ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. สองฉบับเว้นวรรคต่างกัน: “กล้ามเนื้อ|กระดูก” ไม่เว้นวรรค (ตามเอกสารตัวชี้วัดฯ สพฐ. 2551 ส่วนเอกสารต้องรู้ควรรู้ 2559 เว้นวรรค)" }
          - { id: "พ 1.1 ป.5/1", level: ป.5, text: "อธิบายความสำคัญของระบบย่อยอาหาร และระบบขับถ่ายที่มีผลต่อสุขภาพ การเจริญเติบโต และพัฒนาการ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “สำคัญของระบบ|ย่อยอาหาร” ไม่เว้นวรรค" }
          - { id: "พ 1.1 ป.5/2", level: ป.5, text: "อธิบายวิธีดูแลระบบย่อยอาหารและระบบขับถ่ายให้ทำงานตามปกติ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “อาหารและ|ระบบขับถ่ายให้” ไม่เว้นวรรค / เล่มหลักสูตรตัดคำข้ามบรรทัดเป็น “ระบบย่อย-” “อาหาร” ไฟล์นี้รวมเป็น “ระบบย่อยอาหาร” ตามเอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง สพฐ. (2551)" }
          - { id: "พ 1.1 ป.6/1", level: ป.6, text: "อธิบายความสำคัญของระบบสืบพันธุ์ ระบบไหลเวียนโลหิต และระบบหายใจที่มีผลต่อสุขภาพ การเจริญเติบโตและพัฒนาการ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และระบบหายใจ|ที่มีผลต่อสุขภาพ” ไม่เว้นวรรค; “การเจริญเติบโต|และพัฒนาการ” ไม่เว้นวรรค" }
          - { id: "พ 1.1 ป.6/2", level: ป.6, text: "อธิบายวิธีดูแลระบบสืบพันธุ์ ระบบไหลเวียนโลหิต และระบบหายใจให้ทำงานตามปกติ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “อธิบายวิธีดูแล|ระบบสืบพันธุ์” ไม่เว้นวรรค; “ระบบสืบพันธุ์|ระบบไหลเวียน” เว้นวรรค / เอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง สพฐ. (2551) เขียน “อธิบายวิธีดูแลรักษาระบบสืบพันธุ์ ...” และเอกสารต้องรู้ควรรู้ สพฐ. (2559) เขียน “อธิบายวิธีการดูแลรักษา ...” ไฟล์นี้ใช้ถ้อยคำตามเล่มหลักสูตร" }
          - { id: "พ 1.1 ม.1/1", level: ม.1, text: "อธิบายความสำคัญของระบบประสาท และระบบต่อมไร้ท่อที่มีผลต่อสุขภาพ การเจริญเติบโต และพัฒนาการของวัยรุ่น" }
          - { id: "พ 1.1 ม.1/2", level: ม.1, text: "อธิบายวิธีดูแลระบบประสาท และระบบต่อมไร้ท่อให้ทำงานตามปกติ", note: "เอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง สพฐ. (2551) และเอกสารต้องรู้ควรรู้ สพฐ. (2559) เขียน “อธิบายวิธีดูแลรักษาระบบประสาท ...” ไฟล์นี้ใช้ถ้อยคำตามเล่มหลักสูตร" }
          - { id: "พ 1.1 ม.1/3", level: ม.1, text: "วิเคราะห์ภาวะการเจริญเติบโตทางร่างกายของตนเองกับเกณฑ์มาตรฐาน" }
          - { id: "พ 1.1 ม.1/4", level: ม.1, text: "แสวงหาแนวทางในการพัฒนาตนเองให้เจริญเติบโตสมวัย" }
          - { id: "พ 1.1 ม.2/1", level: ม.2, text: "อธิบายการเปลี่ยนแปลงด้านร่างกาย จิตใจ อารมณ์ สังคม และสติปัญญาในวัยรุ่น" }
          - { id: "พ 1.1 ม.2/2", level: ม.2, text: "ระบุปัจจัยที่มีผลกระทบต่อการเจริญเติบโต และพัฒนาการด้านร่างกาย จิตใจ อารมณ์ สังคม และสติปัญญาในวัยรุ่น", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “สังคม|และสติปัญญาในวัยรุ่น” เว้นวรรค / เอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง สพฐ. (2551) เขียน “ผลกระทบต่อเจริญเติบโต” (ไม่มี “การ”) ซึ่งน่าจะตกหล่น ส่วนเอกสารต้องรู้ควรรู้ สพฐ. (2559) ตรงกับเล่มหลักสูตร" }
          - { id: "พ 1.1 ม.3/1", level: ม.3, text: "เปรียบเทียบการเปลี่ยนแปลงทางด้านร่างกาย จิตใจ อารมณ์ สังคม และสติปัญญา แต่ละช่วงของชีวิต" }
          - { id: "พ 1.1 ม.3/2", level: ม.3, text: "วิเคราะห์อิทธิพลและความคาดหวังของสังคมต่อการเปลี่ยนแปลงของวัยรุ่น" }
          - { id: "พ 1.1 ม.3/3", level: ม.3, text: "วิเคราะห์ สื่อ โฆษณา ที่มีอิทธิพลต่อการเจริญเติบโต และพัฒนาการของวัยรุ่น", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. สองฉบับเว้นวรรคต่างกัน: “โฆษณา|ที่มีอิทธิพลต่อการ” เว้นวรรค (ตามเอกสารตัวชี้วัดฯ สพฐ. 2551 ส่วนเอกสารต้องรู้ควรรู้ 2559 ไม่เว้นวรรค)" }
          - { id: "พ 1.1 ม.4-6/1", level: ม.4-6, text: "อธิบายกระบวนการสร้างเสริมและดำรงประสิทธิภาพการทำงานของระบบอวัยวะต่างๆ" }
          - { id: "พ 1.1 ม.4-6/2", level: ม.4-6, text: "วางแผนดูแลสุขภาพตามภาวะการเจริญเติบโต และพัฒนาการของตนเองและบุคคลในครอบครัว" }
  - id: พ2
    title: ชีวิตและครอบครัว
    standards:
      - id: พ 2.1
        text: "เข้าใจและเห็นคุณค่าตนเอง ครอบครัว เพศศึกษา และมีทักษะในการดำเนินชีวิต"
        indicators:
          - { id: "พ 2.1 ป.1/1", level: ป.1, text: "ระบุสมาชิกในครอบครัวและความรักความผูกพันของสมาชิกที่มีต่อกัน" }
          - { id: "พ 2.1 ป.1/2", level: ป.1, text: "บอกสิ่งที่ชื่นชอบและภาคภูมิใจในตนเอง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และภาคภูมิใจ|ในตนเอง” ไม่เว้นวรรค / ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. สองฉบับเว้นวรรคต่างกัน: “บอกสิ่งที่ชื่นชอบ|และภาคภูมิใจ” ไม่เว้นวรรค (ตามเอกสารตัวชี้วัดฯ สพฐ. 2551 ส่วนเอกสารต้องรู้ควรรู้ 2559 เว้นวรรค)" }
          - { id: "พ 2.1 ป.1/3", level: ป.1, text: "บอกลักษณะความแตกต่างระหว่างเพศชายและเพศหญิง" }
          - { id: "พ 2.1 ป.2/1", level: ป.2, text: "ระบุบทบาทหน้าที่ของตนเองและสมาชิกในครอบครัว" }
          - { id: "พ 2.1 ป.2/2", level: ป.2, text: "บอกความสำคัญของเพื่อน" }
          - { id: "พ 2.1 ป.2/3", level: ป.2, text: "ระบุพฤติกรรมที่เหมาะสมกับเพศ" }
          - { id: "พ 2.1 ป.2/4", level: ป.2, text: "อธิบายความภาคภูมิใจในความเป็นเพศหญิง หรือเพศชาย", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ในความเป็น|เพศหญิง” ไม่เว้นวรรค" }
          - { id: "พ 2.1 ป.3/1", level: ป.3, text: "อธิบายความสำคัญ และความแตกต่างของครอบครัวที่มีต่อตนเอง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ความแตกต่าง|ของครอบครัว” ไม่เว้นวรรค" }
          - { id: "พ 2.1 ป.3/2", level: ป.3, text: "อธิบายวิธีสร้างสัมพันธภาพในครอบครัวและกลุ่มเพื่อน" }
          - { id: "พ 2.1 ป.3/3", level: ป.3, text: "บอกวิธีหลีกเลี่ยงพฤติกรรมที่นำไปสู่การถูกล่วงละเมิดทางเพศ" }
          - { id: "พ 2.1 ป.4/1", level: ป.4, text: "อธิบายคุณลักษณะของความเป็นเพื่อนและสมาชิกที่ดีของครอบครัว" }
          - { id: "พ 2.1 ป.4/2", level: ป.4, text: "แสดงพฤติกรรมที่เหมาะสมกับเพศของตนตามวัฒนธรรมไทย" }
          - { id: "พ 2.1 ป.4/3", level: ป.4, text: "ยกตัวอย่างวิธีการปฏิเสธการกระทำที่เป็นอันตรายและไม่เหมาะสมในเรื่องเพศ" }
          - { id: "พ 2.1 ป.5/1", level: ป.5, text: "อธิบายการเปลี่ยนแปลงทางเพศ และปฏิบัติตนได้เหมาะสม" }
          - { id: "พ 2.1 ป.5/2", level: ป.5, text: "อธิบายความสำคัญของการมีครอบครัวที่อบอุ่นตามวัฒนธรรมไทย" }
          - { id: "พ 2.1 ป.5/3", level: ป.5, text: "ระบุพฤติกรรมที่พึงประสงค์และไม่พึงประสงค์ในการแก้ไขปัญหาความขัดแย้งในครอบครัวและกลุ่มเพื่อน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ที่พึงประสงค์และ|ไม่พึงประสงค์ใน” ไม่เว้นวรรค; “การแก้ไขปัญหา|ความขัดแย้งใน” ไม่เว้นวรรค; “ครอบครัวและ|กลุ่มเพื่อน” ไม่เว้นวรรค" }
          - { id: "พ 2.1 ป.6/1", level: ป.6, text: "อธิบายความสำคัญของการสร้างและรักษาสัมพันธภาพกับผู้อื่น", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ของการสร้าง|และรักษา” ไม่เว้นวรรค" }
          - { id: "พ 2.1 ป.6/2", level: ป.6, text: "วิเคราะห์พฤติกรรมเสี่ยงที่อาจนำไปสู่การมีเพศสัมพันธ์ การติดเชื้อเอดส์ และการตั้งครรภ์ก่อนวัยอันควร", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “การติดเชื้อเอดส์|และการตั้งครรภ์” เว้นวรรค" }
          - { id: "พ 2.1 ม.1/1", level: ม.1, text: "อธิบายวิธีการปรับตัวต่อการเปลี่ยนแปลงทางร่างกาย จิตใจ อารมณ์ และพัฒนาการทางเพศอย่างเหมาะสม", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และพัฒนาการทางเพศ|อย่างเหมาะสม” ไม่เว้นวรรค" }
          - { id: "พ 2.1 ม.1/2", level: ม.1, text: "แสดงทักษะการปฏิเสธเพื่อป้องกันตนเองจากการถูกล่วงละเมิดทางเพศ" }
          - { id: "พ 2.1 ม.2/1", level: ม.2, text: "วิเคราะห์ปัจจัยที่มีอิทธิพลต่อเจตคติในเรื่องเพศ" }
          - { id: "พ 2.1 ม.2/2", level: ม.2, text: "วิเคราะห์ปัญหาและผลกระทบที่เกิดจากการมีเพศสัมพันธ์ในวัยเรียน" }
          - { id: "พ 2.1 ม.2/3", level: ม.2, text: "อธิบายวิธีป้องกันตนเองและหลีกเลี่ยงจากโรคติดต่อทางเพศสัมพันธ์ เอดส์ และการตั้งครรภ์โดยไม่พึงประสงค์" }
          - { id: "พ 2.1 ม.2/4", level: ม.2, text: "อธิบายความสำคัญของความเสมอภาคทางเพศและวางตัวได้อย่างเหมาะสม" }
          - { id: "พ 2.1 ม.3/1", level: ม.3, text: "อธิบายอนามัยแม่และเด็ก การวางแผนครอบครัว และวิธีการปฏิบัติตนที่เหมาะสม", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และวิธีการ|ปฏิบัติตนที่เหมาะสม” ไม่เว้นวรรค" }
          - { id: "พ 2.1 ม.3/2", level: ม.3, text: "วิเคราะห์ปัจจัยที่มีผลกระทบต่อการตั้งครรภ์" }
          - { id: "พ 2.1 ม.3/3", level: ม.3, text: "วิเคราะห์สาเหตุ และเสนอแนวทางป้องกัน แก้ไข ความขัดแย้งในครอบครัว" }
          - { id: "พ 2.1 ม.4-6/1", level: ม.4-6, text: "วิเคราะห์อิทธิพลของครอบครัว เพื่อน สังคม และวัฒนธรรมที่มีผลต่อพฤติกรรมทางเพศและการดำเนินชีวิต" }
          - { id: "พ 2.1 ม.4-6/2", level: ม.4-6, text: "วิเคราะห์ค่านิยมในเรื่องเพศตามวัฒนธรรมไทยและวัฒนธรรมอื่นๆ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “วิเคราะห์ค่านิยมในเรื่องเพศ|ตามวัฒนธรรมไทยและวัฒนธรรม” ไม่เว้นวรรค" }
          - { id: "พ 2.1 ม.4-6/3", level: ม.4-6, text: "เลือกใช้ทักษะที่เหมาะสมในการป้องกัน ลดความขัดแย้งและแก้ปัญหาเรื่องเพศและครอบครัว" }
          - { id: "พ 2.1 ม.4-6/4", level: ม.4-6, text: "วิเคราะห์สาเหตุและผลของความขัดแย้งที่อาจเกิดขึ้นระหว่างผู้เรียน หรือเยาวชนในชุมชน และเสนอแนวทางแก้ไขปัญหา", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ความขัดแย้งที่อาจเกิดขึ้นระหว่าง|ผู้เรียน” ไม่เว้นวรรค / เอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง สพฐ. (2551) และเอกสารต้องรู้ควรรู้ สพฐ. (2559) เขียน “นักเรียน” แทน “ผู้เรียน”" }
  - id: พ3
    title: การเคลื่อนไหว การออกกำลังกาย การเล่นเกม กีฬาไทย และกีฬาสากล
    standards:
      - id: พ 3.1
        text: "เข้าใจ มีทักษะในการเคลื่อนไหว กิจกรรมทางกาย การเล่นเกม และกีฬา"
        indicators:
          - { id: "พ 3.1 ป.1/1", level: ป.1, text: "เคลื่อนไหวร่างกายขณะอยู่กับที่ เคลื่อนที่ และใช้อุปกรณ์ประกอบ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. สองฉบับเว้นวรรคต่างกัน: “เคลื่อนที่|และใช้อุปกรณ์” เว้นวรรค (ตามเอกสารตัวชี้วัดฯ สพฐ. 2551 ส่วนเอกสารต้องรู้ควรรู้ 2559 ไม่เว้นวรรค)" }
          - { id: "พ 3.1 ป.1/2", level: ป.1, text: "เล่นเกมเบ็ดเตล็ดและเข้าร่วมกิจกรรมทางกายที่ใช้การเคลื่อนไหวตามธรรมชาติ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และเข้าร่วม|กิจกรรมทางกาย” ไม่เว้นวรรค; “ที่ใช้การเคลื่อนไหว|ตามธรรมชาติ” ไม่เว้นวรรค" }
          - { id: "พ 3.1 ป.2/1", level: ป.2, text: "ควบคุมการเคลื่อนไหวร่างกายขณะอยู่กับที่ เคลื่อนที่ และใช้อุปกรณ์ประกอบ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ร่างกาย|ขณะอยู่กับที่” ไม่เว้นวรรค" }
          - { id: "พ 3.1 ป.2/2", level: ป.2, text: "เล่นเกมเบ็ดเตล็ดและเข้าร่วมกิจกรรมทางกายที่วิธีเล่นอาศัยการเคลื่อนไหวเบื้องต้นทั้งแบบอยู่กับที่ เคลื่อนที่และใช้อุปกรณ์ประกอบ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และเข้าร่วม|กิจกรรมทางกาย” ไม่เว้นวรรค / เอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง สพฐ. (2551) และเอกสารต้องรู้ควรรู้ สพฐ. (2559) พิมพ์ “เล่มเกม” (คำผิด) เล่มหลักสูตรพิมพ์ “เล่นเกม”" }
          - { id: "พ 3.1 ป.3/1", level: ป.3, text: "ควบคุมการเคลื่อนไหวร่างกายขณะอยู่กับที่ เคลื่อนที่ และใช้อุปกรณ์ประกอบอย่างมีทิศทาง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ร่างกาย|ขณะอยู่กับที่” ไม่เว้นวรรค" }
          - { id: "พ 3.1 ป.3/2", level: ป.3, text: "เคลื่อนไหวร่างกายที่ใช้ทักษะการเคลื่อนไหวแบบบังคับทิศทางในการเล่นเกมเบ็ดเตล็ด", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ทักษะ|การเคลื่อนไหว” ไม่เว้นวรรค" }
          - { id: "พ 3.1 ป.4/1", level: ป.4, text: "ควบคุมตนเองเมื่อใช้ทักษะการเคลื่อนไหวในลักษณะผสมผสานได้ทั้งแบบอยู่กับที่ เคลื่อนที่ และใช้อุปกรณ์ประกอบ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และใช้|อุปกรณ์ประกอบ” ไม่เว้นวรรค" }
          - { id: "พ 3.1 ป.4/2", level: ป.4, text: "ฝึกกายบริหารท่ามือเปล่าประกอบจังหวะ" }
          - { id: "พ 3.1 ป.4/3", level: ป.4, text: "เล่นเกมเลียนแบบและกิจกรรมแบบผลัด", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และกิจกรรม|แบบผลัด” ไม่เว้นวรรค" }
          - { id: "พ 3.1 ป.4/4", level: ป.4, text: "เล่นกีฬาพื้นฐานอย่างน้อย ๑ ชนิด" }
          - { id: "พ 3.1 ป.5/1", level: ป.5, text: "จัดรูปแบบการเคลื่อนไหวแบบผสมผสาน และควบคุมตนเองเมื่อใช้ทักษะการเคลื่อนไหวตามแบบที่กำหนด" }
          - { id: "พ 3.1 ป.5/2", level: ป.5, text: "เล่นเกมนำไปสู่กีฬาที่เลือกและกิจกรรมการเคลื่อนไหวแบบผลัด", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “กีฬาที่เลือกและ|กิจกรรมการ” ไม่เว้นวรรค / เอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง สพฐ. (2551) พิมพ์ “เล่มเกม” (คำผิด) เล่มหลักสูตรพิมพ์ “เล่นเกม”" }
          - { id: "พ 3.1 ป.5/3", level: ป.5, text: "ควบคุมการเคลื่อนไหวในเรื่องการรับแรง การใช้แรงและความสมดุล" }
          - { id: "พ 3.1 ป.5/4", level: ป.5, text: "แสดงทักษะกลไกในการปฏิบัติกิจกรรมทางกายและเล่นกีฬา", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ในการปฏิบัติ|กิจกรรมทางกาย” ไม่เว้นวรรค" }
          - { id: "พ 3.1 ป.5/5", level: ป.5, text: "เล่นกีฬาไทยและกีฬาสากล ประเภทบุคคลและประเภททีมอย่างละ ๑ ชนิด", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และประเภททีม|อย่างละ” ไม่เว้นวรรค" }
          - { id: "พ 3.1 ป.5/6", level: ป.5, text: "อธิบายหลักการและเข้าร่วมกิจกรรมนันทนาการอย่างน้อย ๑ กิจกรรม", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. สองฉบับเว้นวรรคต่างกัน: “อธิบายหลักการ|และเข้าร่วม” ไม่เว้นวรรค (ตามเอกสารตัวชี้วัดฯ สพฐ. 2551 ส่วนเอกสารต้องรู้ควรรู้ 2559 เว้นวรรค)" }
          - { id: "พ 3.1 ป.6/1", level: ป.6, text: "แสดงทักษะการเคลื่อนไหวร่วมกับผู้อื่นในลักษณะแบบผลัดและแบบผสมผสานได้ตามลำดับ ทั้งแบบอยู่กับที่ เคลื่อนที่ และใช้อุปกรณ์ประกอบและการเคลื่อนไหวประกอบเพลง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “เคลื่อนไหวร่วมกับ|ผู้อื่นในลักษณะ” ไม่เว้นวรรค; “ทั้งแบบ|อยู่กับที่” ไม่เว้นวรรค; “และใช้อุปกรณ์|ประกอบและการ” ไม่เว้นวรรค; “เคลื่อนไหว|ประกอบเพลง” ไม่เว้นวรรค" }
          - { id: "พ 3.1 ป.6/2", level: ป.6, text: "จำแนกหลักการเคลื่อนไหวในเรื่องการรับแรง การใช้แรง และความสมดุลในการเคลื่อนไหวร่างกายในการเล่นเกม เล่นกีฬา และนำผลมาปรับปรุง เพิ่มพูนวิธีปฏิบัติของตนและผู้อื่น" }
          - { id: "พ 3.1 ป.6/3", level: ป.6, text: "เล่นกีฬาไทย กีฬาสากล ประเภทบุคคลและประเภททีมอย่างละ ๑ ชนิด", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ประเภทบุคคล|และประเภททีม” ไม่เว้นวรรค / ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. สองฉบับเว้นวรรคต่างกัน: “กีฬาสากล|ประเภทบุคคล” เว้นวรรค (ตามเอกสารตัวชี้วัดฯ สพฐ. 2551 ส่วนเอกสารต้องรู้ควรรู้ 2559 ไม่เว้นวรรค)" }
          - { id: "พ 3.1 ป.6/4", level: ป.6, text: "ใช้ทักษะกลไกเพื่อปรับปรุงเพิ่มพูนความสามารถของตนและผู้อื่นในการเล่นกีฬา", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ปรับปรุงเพิ่มพูน|ความสามารถ” ไม่เว้นวรรค; “ของตนและผู้อื่น|ในการเล่นกีฬา” ไม่เว้นวรรค" }
          - { id: "พ 3.1 ป.6/5", level: ป.6, text: "ร่วมกิจกรรมนันทนาการอย่างน้อย ๑ กิจกรรม แล้วนำความรู้และหลักการที่ได้ไปใช้เป็นฐานการศึกษาหาความรู้เรื่องอื่นๆ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. สองฉบับเว้นวรรคต่างกัน: “นันทนาการ|อย่างน้อย” ไม่เว้นวรรค (ตามเอกสารตัวชี้วัดฯ สพฐ. 2551 ส่วนเอกสารต้องรู้ควรรู้ 2559 เว้นวรรค)" }
          - { id: "พ 3.1 ม.1/1", level: ม.1, text: "เพิ่มพูนความสามารถของตนตามหลักการเคลื่อนไหวที่ใช้ทักษะกลไกและทักษะพื้นฐานที่นำไปสู่การพัฒนาทักษะการเล่นกีฬา", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “เคลื่อนไหวที่ใช้ทักษะ|กลไกและทักษะพื้นฐาน” ไม่เว้นวรรค" }
          - { id: "พ 3.1 ม.1/2", level: ม.1, text: "เล่นกีฬาไทยและกีฬาสากล ประเภทบุคคลและทีม โดยใช้ทักษะพื้นฐานตามชนิดกีฬาอย่างละ ๑ ชนิด", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. สองฉบับเว้นวรรคต่างกัน: “พื้นฐานตามชนิดกีฬา|อย่างละ” ไม่เว้นวรรค (ตามเอกสารตัวชี้วัดฯ สพฐ. 2551 ส่วนเอกสารต้องรู้ควรรู้ 2559 เว้นวรรค)" }
          - { id: "พ 3.1 ม.1/3", level: ม.1, text: "ร่วมกิจกรรมนันทนาการ อย่างน้อย ๑ กิจกรรม และนำหลักความรู้ที่ได้ไปเชื่อมโยงสัมพันธ์กับวิชาอื่น", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “อย่างน้อย|๑” เว้นวรรค" }
          - { id: "พ 3.1 ม.2/1", level: ม.2, text: "นำผลการปฏิบัติตนเกี่ยวกับทักษะกลไกและทักษะการเคลื่อนไหวในการเล่นกีฬาจากแหล่งข้อมูลที่หลากหลายมาสรุปเป็นวิธีที่เหมาะสมในบริบทของตนเอง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ทักษะการเคลื่อนไหว|ในการเล่นกีฬาจาก” ไม่เว้นวรรค" }
          - { id: "พ 3.1 ม.2/2", level: ม.2, text: "เล่นกีฬาไทยและกีฬาสากล ทั้งประเภทบุคคลและทีมอย่างละ ๑ ชนิด" }
          - { id: "พ 3.1 ม.2/3", level: ม.2, text: "เปรียบเทียบประสิทธิภาพของรูปแบบการเคลื่อนไหวที่ส่งผลต่อการเล่นกีฬาและกิจกรรมในชีวิตประจำวัน" }
          - { id: "พ 3.1 ม.2/4", level: ม.2, text: "ร่วมกิจกรรมนันทนาการอย่างน้อย ๑ กิจกรรม และนำความรู้และหลักการที่ได้ไปปรับใช้ในชีวิตประจำวันอย่างเป็นระบบ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ในชีวิตประจำวัน|อย่างเป็นระบบ” ไม่เว้นวรรค / ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. สองฉบับเว้นวรรคต่างกัน: “ร่วมกิจกรรมนันทนาการ|อย่างน้อย” ไม่เว้นวรรค (ตามเอกสารตัวชี้วัดฯ สพฐ. 2551 ส่วนเอกสารต้องรู้ควรรู้ 2559 เว้นวรรค); “กิจกรรม|และนำความรู้และ” เว้นวรรค (ตามเอกสารตัวชี้วัดฯ สพฐ. 2551 ส่วนเอกสารต้องรู้ควรรู้ 2559 ไม่เว้นวรรค)" }
          - { id: "พ 3.1 ม.3/1", level: ม.3, text: "เล่นกีฬาไทยและกีฬาสากลอย่างละ ๑ ชนิด โดยใช้เทคนิคที่เหมาะสมกับตนเองและทีม" }
          - { id: "พ 3.1 ม.3/2", level: ม.3, text: "นำหลักการ ความรู้และทักษะในการเคลื่อนไหว กิจกรรมทางกาย การเล่นเกม และการเล่นกีฬาไปใช้สร้างเสริมสุขภาพอย่างต่อเนื่องเป็นระบบ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “กิจกรรมทางกาย|การเล่นเกม” เว้นวรรค; “การเล่นกีฬาไปใช้|สร้างเสริมสุขภาพ” ไม่เว้นวรรค" }
          - { id: "พ 3.1 ม.3/3", level: ม.3, text: "ร่วมกิจกรรมนันทนาการ อย่างน้อย ๑ กิจกรรม และนำหลักความรู้วิธีการไปขยายผลการเรียนรู้ให้กับผู้อื่น", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “อย่างน้อย|๑” เว้นวรรค" }
          - { id: "พ 3.1 ม.4-6/1", level: ม.4-6, text: "วิเคราะห์ความคิดรวบยอดเกี่ยวกับการเคลื่อนไหวรูปแบบต่างๆ ในการเล่นกีฬา", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “วิเคราะห์ความคิดรวบยอดเกี่ยวกับ|การเคลื่อนไหวรูปแบบต่างๆ” ไม่เว้นวรรค" }
          - { id: "พ 3.1 ม.4-6/2", level: ม.4-6, text: "ใช้ความสามารถของตนเพื่อเพิ่มศักยภาพของทีม คำนึงถึงผลที่เกิดต่อ ผู้อื่น และสังคม", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ใช้ความสามารถของตนเพื่อเพิ่ม|ศักยภาพของทีม” ไม่เว้นวรรค / ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. สองฉบับเว้นวรรคต่างกัน: “คำนึงถึงผลที่เกิดต่อ|ผู้อื่น” เว้นวรรค (ตามเอกสารตัวชี้วัดฯ สพฐ. 2551 ส่วนเอกสารต้องรู้ควรรู้ 2559 ไม่เว้นวรรค)" }
          - { id: "พ 3.1 ม.4-6/3", level: ม.4-6, text: "เล่นกีฬาไทย กีฬาสากลประเภทบุคคล ประเภทคู่ กีฬาประเภททีมอย่างน้อย ๑ ชนิด", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “กีฬาสากลประเภทบุคคล|ประเภทคู่” เว้นวรรค; “กีฬาประเภททีม|อย่างน้อย” ไม่เว้นวรรค / เอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง สพฐ. (2551) และเอกสารต้องรู้ควรรู้ สพฐ. (2559) เขียน “ประเภทบุคคล/คู่”" }
          - { id: "พ 3.1 ม.4-6/4", level: ม.4-6, text: "แสดงการเคลื่อนไหวได้อย่างสร้างสรรค์" }
          - { id: "พ 3.1 ม.4-6/5", level: ม.4-6, text: "เข้าร่วมกิจกรรมนันทนาการนอกโรงเรียน และนำหลักการแนวคิดไปปรับปรุงและพัฒนาคุณภาพชีวิตของตนและสังคม" }
      - id: พ 3.2
        text: "รักการออกกำลังกาย การเล่นเกม และการเล่นกีฬา ปฏิบัติเป็นประจำอย่างสม่ำเสมอ มีวินัย เคารพสิทธิ กฎ กติกา มีน้ำใจนักกีฬา มีจิตวิญญาณในการแข่งขัน และชื่นชมในสุนทรียภาพของการกีฬา"
        indicators:
          - { id: "พ 3.2 ป.1/1", level: ป.1, text: "ออกกำลังกายและเล่นเกมตามคำแนะนำอย่างสนุกสนาน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. สองฉบับเว้นวรรคต่างกัน: “ออกกำลังกาย|และเล่นเกม” ไม่เว้นวรรค (ตามเอกสารตัวชี้วัดฯ สพฐ. 2551 ส่วนเอกสารต้องรู้ควรรู้ 2559 เว้นวรรค)" }
          - { id: "พ 3.2 ป.1/2", level: ป.1, text: "ปฏิบัติตนตามกฎ กติกา ข้อตกลงในการเล่นเกมตามคำแนะนำ" }
          - { id: "พ 3.2 ป.2/1", level: ป.2, text: "ออกกำลังกายและเล่นเกมได้ด้วยตนเองอย่างสนุกสนาน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. สองฉบับเว้นวรรคต่างกัน: “ออกกำลังกาย|และเล่นเกมได้” ไม่เว้นวรรค (ตามเอกสารตัวชี้วัดฯ สพฐ. 2551 ส่วนเอกสารต้องรู้ควรรู้ 2559 เว้นวรรค)" }
          - { id: "พ 3.2 ป.2/2", level: ป.2, text: "ปฏิบัติตามกฎ กติกาและข้อตกลงในการเล่นเกมเป็นกลุ่ม" }
          - { id: "พ 3.2 ป.3/1", level: ป.3, text: "เลือกออกกำลังกาย การละเล่นพื้นเมือง และเล่นเกมที่เหมาะสมกับจุดเด่นจุดด้อย และข้อจำกัดของตนเอง" }
          - { id: "พ 3.2 ป.3/2", level: ป.3, text: "ปฏิบัติตามกฎ กติกาและข้อตกลงของการออกกำลังกาย การเล่นเกม การละเล่นพื้นเมืองได้ด้วยตนเอง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “การเล่นเกม|การละเล่น” เว้นวรรค" }
          - { id: "พ 3.2 ป.4/1", level: ป.4, text: "ออกกำลังกาย เล่นเกม และกีฬาที่ตนเองชอบและมีความสามารถในการวิเคราะห์ผลพัฒนาการของตนเองตามตัวอย่างและแบบปฏิบัติของผู้อื่น", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “พัฒนาการของ|ตนเองตาม” ไม่เว้นวรรค" }
          - { id: "พ 3.2 ป.4/2", level: ป.4, text: "ปฏิบัติตามกฎ กติกาการเล่นกีฬาพื้นฐานตามชนิดกีฬาที่เล่น" }
          - { id: "พ 3.2 ป.5/1", level: ป.5, text: "ออกกำลังกายอย่างมีรูปแบบ เล่นเกมที่ใช้ทักษะการคิดและตัดสินใจ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “อย่างมีรูปแบบ|เล่นเกมที่ใช้” เว้นวรรค" }
          - { id: "พ 3.2 ป.5/2", level: ป.5, text: "เล่นกีฬาที่ตนเองชอบอย่างสม่ำเสมอ โดยสร้างทางเลือกในวิธีปฏิบัติของตนเองอย่างหลากหลาย และมีน้ำใจนักกีฬา" }
          - { id: "พ 3.2 ป.5/3", level: ป.5, text: "ปฏิบัติตามกฎ กติกา การเล่นเกม กีฬาไทย และกีฬาสากลตามชนิดกีฬาที่เล่น", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “การเล่นเกม|กีฬาไทย” เว้นวรรค" }
          - { id: "พ 3.2 ป.5/4", level: ป.5, text: "ปฏิบัติตนตามสิทธิของตนเอง ไม่ละเมิดสิทธิผู้อื่นและยอมรับในความแตกต่างระหว่างบุคคลในการเล่นเกม กีฬาไทย และกีฬาสากล", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “สิทธิของตนเอง|ไม่ละเมิดสิทธิ” เว้นวรรค; “การเล่นเกม|กีฬาไทย” เว้นวรรค; “และ|กีฬาสากล” ไม่เว้นวรรค / เอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง สพฐ. (2551) และเอกสารต้องรู้ควรรู้ สพฐ. (2559) เขียน “ในการเล่นเกมและกีฬาไทย กีฬาสากล”" }
          - { id: "พ 3.2 ป.6/1", level: ป.6, text: "อธิบายประโยชน์และหลักการออกกำลังกายเพื่อสุขภาพ สมรรถภาพทางกายและการสร้างเสริมบุคลิกภาพ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และหลักการ|ออกกำลังกาย” ไม่เว้นวรรค; “เพื่อสุขภาพ|สมรรถภาพ” เว้นวรรค" }
          - { id: "พ 3.2 ป.6/2", level: ป.6, text: "เล่นเกมที่ใช้ทักษะการวางแผนและสามารถเพิ่มพูนทักษะการออกกำลังกายและเคลื่อนไหวอย่างเป็นระบบ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “การวางแผน|และสามารถ” ไม่เว้นวรรค; “เพิ่มพูนทักษะ|การออกกำลังกาย” ไม่เว้นวรรค; “และเคลื่อนไหว|อย่างเป็นระบบ” ไม่เว้นวรรค" }
          - { id: "พ 3.2 ป.6/3", level: ป.6, text: "เล่นกีฬาที่ตนเองชื่นชอบและสามารถประเมินทักษะการเล่นของตนเป็นประจำ" }
          - { id: "พ 3.2 ป.6/4", level: ป.6, text: "ปฏิบัติตามกฎ กติกา ตามชนิดกีฬาที่เล่น โดยคำนึงถึงความปลอดภัยของตนเองและผู้อื่น" }
          - { id: "พ 3.2 ป.6/5", level: ป.6, text: "จำแนกกลวิธีการรุก การป้องกันและนำไปใช้ในการเล่นกีฬา", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “การป้องกัน|และนำไปใช้ใน” ไม่เว้นวรรค" }
          - { id: "พ 3.2 ป.6/6", level: ป.6, text: "เล่นเกมและกีฬาด้วยความสามัคคีและมีน้ำใจนักกีฬา", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ด้วยความสามัคคี|และมีน้ำใจนักกีฬา” ไม่เว้นวรรค" }
          - { id: "พ 3.2 ม.1/1", level: ม.1, text: "อธิบายความสำคัญของการออกกำลังกายและเล่นกีฬาจนเป็นวิถีชีวิตที่มีสุขภาพดี" }
          - { id: "พ 3.2 ม.1/2", level: ม.1, text: "ออกกำลังกายและเลือกเข้าร่วมเล่นกีฬาตามความถนัด ความสนใจอย่างเต็มความสามารถ พร้อมทั้งมีการประเมินการเล่นของตนและผู้อื่น", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ความสนใจ|อย่างเต็มความสามารถ” ไม่เว้นวรรค" }
          - { id: "พ 3.2 ม.1/3", level: ม.1, text: "ปฏิบัติตามกฎ กติกา และข้อตกลงตามชนิดกีฬาที่เลือกเล่น" }
          - { id: "พ 3.2 ม.1/4", level: ม.1, text: "วางแผนการรุกและการป้องกันในการเล่นกีฬาที่เลือกและนำไปใช้ในการเล่นอย่างเป็นระบบ" }
          - { id: "พ 3.2 ม.1/5", level: ม.1, text: "ร่วมมือในการเล่นกีฬาและการทำงานเป็นทีมอย่างสนุกสนาน" }
          - { id: "พ 3.2 ม.1/6", level: ม.1, text: "วิเคราะห์ เปรียบเทียบ และยอมรับความแตกต่างระหว่างวิธีการเล่นกีฬาของตนเองกับผู้อื่น", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ระหว่างวิธีการเล่นกีฬา|ของตนเองกับผู้อื่น” ไม่เว้นวรรค" }
          - { id: "พ 3.2 ม.2/1", level: ม.2, text: "อธิบายสาเหตุการเปลี่ยนแปลงทางกาย จิตใจ อารมณ์ สังคม และสติปัญญาที่เกิดจากการออกกำลังกาย และเล่นกีฬาเป็นประจำจนเป็นวิถีชีวิต", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. สองฉบับเว้นวรรคต่างกัน: “และสติปัญญา|ที่เกิดจากการ” ไม่เว้นวรรค (ตามเอกสารตัวชี้วัดฯ สพฐ. 2551 ส่วนเอกสารต้องรู้ควรรู้ 2559 เว้นวรรค)" }
          - { id: "พ 3.2 ม.2/2", level: ม.2, text: "เลือกเข้าร่วมกิจกรรมออกกำลังกาย เล่นกีฬาตามความถนัด ความสนใจ พร้อมทั้งวิเคราะห์ความแตกต่างระหว่างบุคคลเพื่อเป็นแนวทางในการพัฒนาตนเอง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “เลือกเข้าร่วมกิจกรรม|ออกกำลังกาย” ไม่เว้นวรรค; “ตามความถนัด|ความสนใจ” เว้นวรรค / เอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง สพฐ. (2551) และเอกสารต้องรู้ควรรู้ สพฐ. (2559) เขียน “กิจกรรมการออกกำลังกาย” และ “ตามความถนัดและความสนใจ”" }
          - { id: "พ 3.2 ม.2/3", level: ม.2, text: "มีวินัย ปฏิบัติตามกฎ กติกา และข้อตกลงในการเล่นกีฬาที่เลือก" }
          - { id: "พ 3.2 ม.2/4", level: ม.2, text: "วางแผนการรุก และการป้องกันในการเล่นกีฬาที่เลือกและนำไปใช้ในการเล่นอย่างเหมาะสมกับทีม" }
          - { id: "พ 3.2 ม.2/5", level: ม.2, text: "นำผลการปฏิบัติในการเล่นกีฬามาสรุปเป็นวิธีที่เหมาะสมกับตนเองด้วยความมุ่งมั่น" }
          - { id: "พ 3.2 ม.3/1", level: ม.3, text: "มีมารยาทในการเล่นและดูกีฬาด้วยความมีน้ำใจนักกีฬา" }
          - { id: "พ 3.2 ม.3/2", level: ม.3, text: "ออกกำลังกายและเล่นกีฬาอย่างสม่ำเสมอ และนำแนวคิดหลักการจากการเล่นไปพัฒนาคุณภาพชีวิตของตนด้วยความภาคภูมิใจ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. สองฉบับเว้นวรรคต่างกัน: “เล่นกีฬาอย่างสม่ำเสมอ|และนำแนวคิดหลักการ” เว้นวรรค (ตามเอกสารตัวชี้วัดฯ สพฐ. 2551 ส่วนเอกสารต้องรู้ควรรู้ 2559 ไม่เว้นวรรค)" }
          - { id: "พ 3.2 ม.3/3", level: ม.3, text: "ปฏิบัติตนตามกฎ กติกา และข้อตกลงในการเล่นตามชนิดกีฬาที่เลือก และนำแนวคิดที่ได้ไปพัฒนาคุณภาพชีวิตของตนในสังคม" }
          - { id: "พ 3.2 ม.3/4", level: ม.3, text: "จำแนกกลวิธีการรุก การป้องกัน และใช้ในการเล่นกีฬาที่เลือกและตัดสินใจเลือกวิธีที่เหมาะสมกับทีมไปใช้ได้ตามสถานการณ์ของการเล่น", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ที่เหมาะสมกับทีม|ไปใช้ได้ตามสถานการณ์” ไม่เว้นวรรค" }
          - { id: "พ 3.2 ม.3/5", level: ม.3, text: "เสนอผลการพัฒนาสุขภาพของตนเองที่เกิดจากการออกกำลังกายและการเล่นกีฬาเป็นประจำ" }
          - { id: "พ 3.2 ม.4-6/1", level: ม.4-6, text: "ออกกำลังกายและเล่นกีฬาที่เหมาะสมกับตนเองอย่างสม่ำเสมอ และใช้ความสามารถของตนเองเพิ่มศักยภาพของทีม ลดความเป็นตัวตน คำนึงถึงผลที่เกิดต่อสังคม" }
          - { id: "พ 3.2 ม.4-6/2", level: ม.4-6, text: "อธิบายและปฏิบัติเกี่ยวกับสิทธิ กฎ กติกา กลวิธีต่างๆ ในระหว่างการเล่น การแข่งขันกีฬากับผู้อื่นและนำไปสรุปเป็นแนวปฏิบัติ และใช้ในชีวิตประจำวันอย่างต่อเนื่อง" }
          - { id: "พ 3.2 ม.4-6/3", level: ม.4-6, text: "แสดงออกถึงการมีมารยาทในการดู การเล่น และการแข่งขันกีฬาด้วยความมีน้ำใจนักกีฬา และนำไปใช้ปฏิบัติทุกโอกาส จนเป็นบุคลิกภาพที่ดี", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “แสดงออกถึงการมีมารยาทในการดู|การเล่น” เว้นวรรค" }
          - { id: "พ 3.2 ม.4-6/4", level: ม.4-6, text: "ร่วมกิจกรรมทางกายและเล่นกีฬาอย่างมีความสุข ชื่นชมในคุณค่าและความงามของการกีฬา", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ร่วมกิจกรรมทางกายและเล่นกีฬา|อย่างมีความสุข” ไม่เว้นวรรค" }
  - id: พ4
    title: การสร้างเสริมสุขภาพ สมรรถภาพและการป้องกันโรค
    standards:
      - id: พ 4.1
        text: "เห็นคุณค่าและมีทักษะในการสร้างเสริมสุขภาพ การดำรงสุขภาพ การป้องกันโรค และการสร้างเสริมสมรรถภาพเพื่อสุขภาพ"
        indicators:
          - { id: "พ 4.1 ป.1/1", level: ป.1, text: "ปฏิบัติตนตามหลักสุขบัญญัติแห่งชาติตามคำแนะนำ" }
          - { id: "พ 4.1 ป.1/2", level: ป.1, text: "บอกอาการเจ็บป่วยที่เกิดขึ้นกับตนเอง" }
          - { id: "พ 4.1 ป.1/3", level: ป.1, text: "ปฏิบัติตนตามคำแนะนำ เมื่อมีอาการเจ็บป่วย" }
          - { id: "พ 4.1 ป.2/1", level: ป.2, text: "บอกลักษณะของการมีสุขภาพดี" }
          - { id: "พ 4.1 ป.2/2", level: ป.2, text: "เลือกกินอาหารที่มีประโยชน์" }
          - { id: "พ 4.1 ป.2/3", level: ป.2, text: "ระบุของใช้และของเล่นที่มีผลเสียต่อสุขภาพ" }
          - { id: "พ 4.1 ป.2/4", level: ป.2, text: "อธิบายอาการและวิธีป้องกันการเจ็บป่วย การบาดเจ็บที่อาจเกิดขึ้น", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และวิธีป้องกัน|การเจ็บป่วย” ไม่เว้นวรรค" }
          - { id: "พ 4.1 ป.2/5", level: ป.2, text: "ปฏิบัติตามคำแนะนำ เมื่อมีอาการเจ็บป่วยและบาดเจ็บ" }
          - { id: "พ 4.1 ป.3/1", level: ป.3, text: "อธิบายการติดต่อและวิธีการป้องกันการแพร่กระจายของโรค" }
          - { id: "พ 4.1 ป.3/2", level: ป.3, text: "จำแนกอาหารหลัก ๕ หมู่" }
          - { id: "พ 4.1 ป.3/3", level: ป.3, text: "เลือกกินอาหารที่หลากหลาย ครบ ๕ หมู่ ในสัดส่วนที่เหมาะสม", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ที่หลากหลาย|ครบ” เว้นวรรค" }
          - { id: "พ 4.1 ป.3/4", level: ป.3, text: "แสดงการแปรงฟันให้สะอาดอย่างถูกวิธี" }
          - { id: "พ 4.1 ป.3/5", level: ป.3, text: "สร้างเสริมสมรรถภาพทางกายได้ตามคำแนะนำ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ทางกายได้|ตามคำแนะนำ” ไม่เว้นวรรค" }
          - { id: "พ 4.1 ป.4/1", level: ป.4, text: "อธิบายความสัมพันธ์ระหว่างสิ่งแวดล้อมกับสุขภาพ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “สัมพันธ์ระหว่าง|สิ่งแวดล้อมกับ” ไม่เว้นวรรค" }
          - { id: "พ 4.1 ป.4/2", level: ป.4, text: "อธิบายสภาวะอารมณ์ ความรู้สึกที่มีผลต่อสุขภาพ" }
          - { id: "พ 4.1 ป.4/3", level: ป.4, text: "วิเคราะห์ข้อมูลบนฉลากอาหารและผลิตภัณฑ์สุขภาพเพื่อการเลือกบริโภค" }
          - { id: "พ 4.1 ป.4/4", level: ป.4, text: "ทดสอบและปรับปรุงสมรรถภาพทางกายตามผลการทดสอบสมรรถภาพทางกาย", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “สมรรถภาพ|ทางกายตาม” ไม่เว้นวรรค; “ผลการทดสอบ|สมรรถภาพ” ไม่เว้นวรรค / เอกสารต้องรู้ควรรู้ สพฐ. (2559) เขียน “ตามผลการตรวจสอบสมรรถภาพทางกาย” ส่วนเอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง สพฐ. (2551) ตรงกับเล่มหลักสูตร" }
          - { id: "พ 4.1 ป.5/1", level: ป.5, text: "แสดงพฤติกรรมที่เห็นความสำคัญของการปฏิบัติตนตามสุขบัญญัติแห่งชาติ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ตามสุขบัญญัติ|แห่งชาติ” ไม่เว้นวรรค" }
          - { id: "พ 4.1 ป.5/2", level: ป.5, text: "ค้นหาข้อมูลข่าวสารเพื่อใช้สร้างเสริมสุขภาพ" }
          - { id: "พ 4.1 ป.5/3", level: ป.5, text: "วิเคราะห์สื่อโฆษณาในการตัดสินใจเลือกซื้ออาหารและผลิตภัณฑ์สุขภาพอย่างมีเหตุผล", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “การตัดสินใจ|เลือกซื้ออาหาร” ไม่เว้นวรรค" }
          - { id: "พ 4.1 ป.5/4", level: ป.5, text: "ปฏิบัติตนในการป้องกันโรคที่พบบ่อยในชีวิตประจำวัน" }
          - { id: "พ 4.1 ป.5/5", level: ป.5, text: "ทดสอบและปรับปรุงสมรรถภาพทางกายตามผลการทดสอบสมรรถภาพทางกาย", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “สมรรถภาพ|ทางกายตาม” ไม่เว้นวรรค; “ผลการทดสอบ|สมรรถภาพ” ไม่เว้นวรรค" }
          - { id: "พ 4.1 ป.6/1", level: ป.6, text: "แสดงพฤติกรรมในการป้องกันและแก้ไขปัญหาสิ่งแวดล้อมที่มีผลต่อสุขภาพ" }
          - { id: "พ 4.1 ป.6/2", level: ป.6, text: "วิเคราะห์ผลกระทบที่เกิดจากการระบาดของโรคและเสนอแนวทางการป้องกันโรคติดต่อสำคัญที่พบในประเทศไทย" }
          - { id: "พ 4.1 ป.6/3", level: ป.6, text: "แสดงพฤติกรรมที่บ่งบอกถึงความรับผิดชอบต่อสุขภาพของส่วนรวม" }
          - { id: "พ 4.1 ป.6/4", level: ป.6, text: "สร้างเสริมและปรับปรุงสมรรถภาพทางกายเพื่อสุขภาพอย่างต่อเนื่อง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “สมรรถภาพ|ทางกายเพื่อ” ไม่เว้นวรรค" }
          - { id: "พ 4.1 ม.1/1", level: ม.1, text: "เลือกกินอาหารที่เหมาะสมกับวัย" }
          - { id: "พ 4.1 ม.1/2", level: ม.1, text: "วิเคราะห์ปัญหาที่เกิดจากภาวะโภชนาการที่มีผลกระทบต่อสุขภาพ" }
          - { id: "พ 4.1 ม.1/3", level: ม.1, text: "ควบคุมน้ำหนักของตนเอง ให้อยู่ในเกณฑ์มาตรฐาน" }
          - { id: "พ 4.1 ม.1/4", level: ม.1, text: "สร้างเสริมและปรับปรุงสมรรถภาพทางกายตามผลการทดสอบ" }
          - { id: "พ 4.1 ม.2/1", level: ม.2, text: "เลือกใช้บริการทางสุขภาพอย่างมีเหตุผล" }
          - { id: "พ 4.1 ม.2/2", level: ม.2, text: "วิเคราะห์ผลของการใช้เทคโนโลยีที่มีต่อสุขภาพ" }
          - { id: "พ 4.1 ม.2/3", level: ม.2, text: "วิเคราะห์ความเจริญก้าวหน้าทางการแพทย์ที่มีผลต่อสุขภาพ" }
          - { id: "พ 4.1 ม.2/4", level: ม.2, text: "วิเคราะห์ความสัมพันธ์ของภาวะสมดุลระหว่างสุขภาพกายและสุขภาพจิต" }
          - { id: "พ 4.1 ม.2/5", level: ม.2, text: "อธิบายลักษณะอาการเบื้องต้นของผู้มีปัญหาสุขภาพจิต" }
          - { id: "พ 4.1 ม.2/6", level: ม.2, text: "เสนอแนะวิธีปฏิบัติตนเพื่อจัดการกับอารมณ์และความเครียด" }
          - { id: "พ 4.1 ม.2/7", level: ม.2, text: "พัฒนาสมรรถภาพทางกายตนเองให้เป็นไปตามเกณฑ์ที่กำหนด", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ทางกายตนเอง|ให้เป็นไปตามเกณฑ์” ไม่เว้นวรรค" }
          - { id: "พ 4.1 ม.3/1", level: ม.3, text: "กำหนดรายการอาหารที่เหมาะสมกับวัยต่างๆ โดยคำนึงถึงความประหยัดและคุณค่าทางโภชนาการ" }
          - { id: "พ 4.1 ม.3/2", level: ม.3, text: "เสนอแนวทางป้องกันโรคที่เป็นสาเหตุสำคัญของการเจ็บป่วยและการตายของคนไทย", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ของการเจ็บป่วยและ|การตายของคนไทย” ไม่เว้นวรรค" }
          - { id: "พ 4.1 ม.3/3", level: ม.3, text: "รวบรวมข้อมูลและเสนอแนวทางแก้ไขปัญหาสุขภาพในชุมชน" }
          - { id: "พ 4.1 ม.3/4", level: ม.3, text: "วางแผนและจัดเวลาในการออกกำลังกาย การพักผ่อนและการสร้างเสริมสมรรถภาพทางกาย", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “การพักผ่อนและ|การสร้างเสริม” ไม่เว้นวรรค" }
          - { id: "พ 4.1 ม.3/5", level: ม.3, text: "ทดสอบสมรรถภาพทางกาย และพัฒนาได้ตามความแตกต่างระหว่างบุคคล" }
          - { id: "พ 4.1 ม.4-6/1", level: ม.4-6, text: "วิเคราะห์บทบาทและความรับผิดชอบของบุคคลที่มีต่อการสร้างเสริมสุขภาพและการป้องกันโรคในชุมชน" }
          - { id: "พ 4.1 ม.4-6/2", level: ม.4-6, text: "วิเคราะห์ อิทธิพลของสื่อโฆษณาเกี่ยวกับสุขภาพเพื่อการเลือกบริโภค", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “อิทธิพลของสื่อโฆษณา|เกี่ยวกับสุขภาพเพื่อการเลือกบริโภค” ไม่เว้นวรรค" }
          - { id: "พ 4.1 ม.4-6/3", level: ม.4-6, text: "ปฏิบัติตนตามสิทธิของผู้บริโภค" }
          - { id: "พ 4.1 ม.4-6/4", level: ม.4-6, text: "วิเคราะห์สาเหตุและเสนอแนวทางการป้องกันการเจ็บป่วยและการตายของคนไทย", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “วิเคราะห์สาเหตุและเสนอแนวทาง|การป้องกันการเจ็บป่วยและการตาย” ไม่เว้นวรรค" }
          - { id: "พ 4.1 ม.4-6/5", level: ม.4-6, text: "วางแผนและปฏิบัติตามแผนการพัฒนาสุขภาพของตนเองและครอบครัว", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “วางแผนและปฏิบัติตามแผน|การพัฒนาสุขภาพของตนเอง” ไม่เว้นวรรค" }
          - { id: "พ 4.1 ม.4-6/6", level: ม.4-6, text: "มีส่วนร่วมในการส่งเสริม และพัฒนาสุขภาพในชุมชน", note: "เอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง สพฐ. (2551) และเอกสารต้องรู้ควรรู้ สพฐ. (2559) เขียน “พัฒนาสุขภาพของบุคคลในชุมชน”" }
          - { id: "พ 4.1 ม.4-6/7", level: ม.4-6, text: "วางแผนและปฏิบัติตามแผนการพัฒนาสมรรถภาพทางกาย และสมรรถภาพทางกลไก", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “วางแผนและปฏิบัติตามแผน|การพัฒนาสมรรถภาพทางกาย” ไม่เว้นวรรค / เอกสารต้องรู้ควรรู้ สพฐ. (2559) เขียน “สมรรถภาพกาย และสมรรถภาพกลไก” ส่วนเอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง สพฐ. (2551) ตรงกับเล่มหลักสูตร" }
  - id: พ5
    title: ความปลอดภัยในชีวิต
    standards:
      - id: พ 5.1
        text: "ป้องกันและหลีกเลี่ยงปัจจัยเสี่ยง พฤติกรรมเสี่ยงต่อสุขภาพ อุบัติเหตุ การใช้ยา สารเสพติด และความรุนแรง"
        indicators:
          - { id: "พ 5.1 ป.1/1", level: ป.1, text: "ระบุสิ่งที่ทำให้เกิดอันตรายที่บ้าน โรงเรียน และการป้องกัน" }
          - { id: "พ 5.1 ป.1/2", level: ป.1, text: "บอกสาเหตุและการป้องกันอันตรายที่เกิดจากการเล่น" }
          - { id: "พ 5.1 ป.1/3", level: ป.1, text: "แสดงคำพูดหรือท่าทางขอความช่วยเหลือจากผู้อื่น เมื่อเกิดเหตุร้ายที่บ้านและโรงเรียน" }
          - { id: "พ 5.1 ป.2/1", level: ป.2, text: "ปฏิบัติตนในการป้องกันอุบัติเหตุที่อาจเกิดขึ้นทางน้ำและทางบก", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. สองฉบับเว้นวรรคต่างกัน: “เกิดขึ้นทางน้ำ|และทางบก” ไม่เว้นวรรค (ตามเอกสารตัวชี้วัดฯ สพฐ. 2551 ส่วนเอกสารต้องรู้ควรรู้ 2559 เว้นวรรค)" }
          - { id: "พ 5.1 ป.2/2", level: ป.2, text: "บอกชื่อยาสามัญประจำบ้าน และใช้ยาตามคำแนะนำ" }
          - { id: "พ 5.1 ป.2/3", level: ป.2, text: "ระบุโทษของสารเสพติด สารอันตรายใกล้ตัว และวิธีการป้องกัน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “สารอันตราย|ใกล้ตัว” ไม่เว้นวรรค" }
          - { id: "พ 5.1 ป.2/4", level: ป.2, text: "ปฏิบัติตนตามสัญลักษณ์และป้ายเตือนของสิ่งของ หรือสถานที่ที่เป็นอันตราย", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “สัญลักษณ์และ|ป้ายเตือนของ” ไม่เว้นวรรค" }
          - { id: "พ 5.1 ป.2/5", level: ป.2, text: "อธิบายสาเหตุ อันตราย วิธีป้องกันอัคคีภัย และแสดงการหนีไฟ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. สองฉบับเว้นวรรคต่างกัน: “ป้องกันอัคคีภัย|และแสดงการ” เว้นวรรค (ตามเอกสารตัวชี้วัดฯ สพฐ. 2551 ส่วนเอกสารต้องรู้ควรรู้ 2559 ไม่เว้นวรรค)" }
          - { id: "พ 5.1 ป.3/1", level: ป.3, text: "ปฏิบัติตนเพื่อความปลอดภัยจากอุบัติเหตุในบ้าน โรงเรียน และการเดินทาง" }
          - { id: "พ 5.1 ป.3/2", level: ป.3, text: "แสดงวิธีขอความช่วยเหลือจากบุคคลและแหล่งต่างๆ เมื่อเกิดเหตุร้ายหรืออุบัติเหตุ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “แหล่งต่างๆ|เมื่อเกิดเหตุร้าย” เว้นวรรค / ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. สองฉบับเว้นวรรคต่างกัน: “เมื่อเกิดเหตุร้าย|หรืออุบัติเหตุ” ไม่เว้นวรรค (ตามเอกสารตัวชี้วัดฯ สพฐ. 2551 ส่วนเอกสารต้องรู้ควรรู้ 2559 เว้นวรรค)" }
          - { id: "พ 5.1 ป.3/3", level: ป.3, text: "แสดงวิธีปฐมพยาบาลเมื่อบาดเจ็บจากการเล่น", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “เมื่อบาดเจ็บ|จากการเล่น” ไม่เว้นวรรค / ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. สองฉบับเว้นวรรคต่างกัน: “ปฐมพยาบาล|เมื่อบาดเจ็บ” ไม่เว้นวรรค (ตามเอกสารตัวชี้วัดฯ สพฐ. 2551 ส่วนเอกสารต้องรู้ควรรู้ 2559 เว้นวรรค)" }
          - { id: "พ 5.1 ป.4/1", level: ป.4, text: "อธิบายความสำคัญของการใช้ยาและใช้ยาอย่างถูกวิธี" }
          - { id: "พ 5.1 ป.4/2", level: ป.4, text: "แสดงวิธีปฐมพยาบาลเมื่อได้รับอันตรายจากการใช้ยาผิด สารเคมี แมลงสัตว์กัดต่อย และการบาดเจ็บจากการเล่นกีฬา", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “เมื่อได้รับ|อันตรายจาก” ไม่เว้นวรรค" }
          - { id: "พ 5.1 ป.4/3", level: ป.4, text: "วิเคราะห์ผลเสียของการสูบบุหรี่และการดื่มสุราที่มีต่อสุขภาพและการป้องกัน" }
          - { id: "พ 5.1 ป.5/1", level: ป.5, text: "วิเคราะห์ปัจจัยที่มีอิทธิพลต่อการใช้สารเสพติด" }
          - { id: "พ 5.1 ป.5/2", level: ป.5, text: "วิเคราะห์ผลกระทบของการใช้ยาและสารเสพติด ที่มีผลต่อร่างกาย จิตใจ อารมณ์ สังคม และสติปัญญา" }
          - { id: "พ 5.1 ป.5/3", level: ป.5, text: "ปฏิบัติตนเพื่อความปลอดภัยจากการใช้ยาและหลีกเลี่ยงสารเสพติด" }
          - { id: "พ 5.1 ป.5/4", level: ป.5, text: "วิเคราะห์อิทธิพลของสื่อที่มีต่อพฤติกรรมสุขภาพ" }
          - { id: "พ 5.1 ป.5/5", level: ป.5, text: "ปฏิบัติตนเพื่อป้องกันอันตรายจากการเล่นกีฬา" }
          - { id: "พ 5.1 ป.6/1", level: ป.6, text: "วิเคราะห์ผลกระทบจากความรุนแรงของภัยธรรมชาติที่มีต่อร่างกาย จิตใจ และสังคม" }
          - { id: "พ 5.1 ป.6/2", level: ป.6, text: "ระบุวิธีปฏิบัติตนเพื่อความปลอดภัยจากภัยธรรมชาติ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ปลอดภัยจาก|ภัยธรรมชาติ” ไม่เว้นวรรค / ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. สองฉบับเว้นวรรคต่างกัน: “ระบุวิธีปฏิบัติตน|เพื่อความ” ไม่เว้นวรรค (ตามเอกสารตัวชี้วัดฯ สพฐ. 2551 ส่วนเอกสารต้องรู้ควรรู้ 2559 เว้นวรรค) / เอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง สพฐ. (2551) และเอกสารต้องรู้ควรรู้ สพฐ. (2559) เขียน “ความปลอดภัยจากธรรมชาติ”" }
          - { id: "พ 5.1 ป.6/3", level: ป.6, text: "วิเคราะห์สาเหตุของการติดสารเสพติด และชักชวนให้ผู้อื่นหลีกเลี่ยงสารเสพติด", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “หลีกเลี่ยง|สารเสพติด” ไม่เว้นวรรค" }
          - { id: "พ 5.1 ม.1/1", level: ม.1, text: "แสดงวิธีปฐมพยาบาลและเคลื่อนย้ายผู้ป่วยอย่างปลอดภัย" }
          - { id: "พ 5.1 ม.1/2", level: ม.1, text: "อธิบายลักษณะอาการของผู้ติดสารเสพติดและการป้องกันการติดสารเสพติด" }
          - { id: "พ 5.1 ม.1/3", level: ม.1, text: "อธิบายความสัมพันธ์ของการใช้สารเสพติดกับการเกิดโรคและอุบัติเหตุ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “กับการเกิดโรคและ|อุบัติเหตุ” ไม่เว้นวรรค" }
          - { id: "พ 5.1 ม.1/4", level: ม.1, text: "แสดงวิธีการชักชวนผู้อื่นให้ลด ละ เลิกสารเสพติด โดยใช้ทักษะต่างๆ" }
          - { id: "พ 5.1 ม.2/1", level: ม.2, text: "ระบุวิธีการ ปัจจัยและแหล่งที่ช่วยเหลือฟื้นฟูผู้ติดสารเสพติด" }
          - { id: "พ 5.1 ม.2/2", level: ม.2, text: "อธิบายวิธีการหลีกเลี่ยงพฤติกรรมเสี่ยงและสถานการณ์เสี่ยง" }
          - { id: "พ 5.1 ม.2/3", level: ม.2, text: "ใช้ทักษะชีวิตในการป้องกันตนเองและหลีกเลี่ยงสถานการณ์คับขันที่อาจนำไปสู่อันตราย" }
          - { id: "พ 5.1 ม.3/1", level: ม.3, text: "วิเคราะห์ปัจจัยเสี่ยงและพฤติกรรมเสี่ยงที่มีผลต่อสุขภาพและแนวทางป้องกัน" }
          - { id: "พ 5.1 ม.3/2", level: ม.3, text: "หลีกเลี่ยงการใช้ความรุนแรงและชักชวนเพื่อนให้หลีกเลี่ยงการใช้ความรุนแรงในการแก้ปัญหา", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ความรุนแรงและ|ชักชวนเพื่อนให้” ไม่เว้นวรรค; “หลีกเลี่ยงการใช้|ความรุนแรงใน” ไม่เว้นวรรค" }
          - { id: "พ 5.1 ม.3/3", level: ม.3, text: "วิเคราะห์อิทธิพลของสื่อต่อพฤติกรรมสุขภาพและความรุนแรง" }
          - { id: "พ 5.1 ม.3/4", level: ม.3, text: "วิเคราะห์ความสัมพันธ์ของการดื่มเครื่องดื่มที่มีแอลกอฮอล์ต่อสุขภาพและการเกิดอุบัติเหตุ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “แอลกอฮอล์ต่อสุขภาพ|และการเกิดอุบัติเหตุ” ไม่เว้นวรรค" }
          - { id: "พ 5.1 ม.3/5", level: ม.3, text: "แสดงวิธีการช่วยฟื้นคืนชีพอย่างถูกวิธี" }
          - { id: "พ 5.1 ม.4-6/1", level: ม.4-6, text: "มีส่วนร่วมในการป้องกันความเสี่ยงต่อการใช้ยา การใช้สารเสพติด และความรุนแรง เพื่อสุขภาพของตนเอง ครอบครัว และสังคม", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “มีส่วนร่วมในการป้องกันความเสี่ยง|ต่อการใช้ยา” ไม่เว้นวรรค" }
          - { id: "พ 5.1 ม.4-6/2", level: ม.4-6, text: "วิเคราะห์ผลกระทบที่เกิดจากการครอบครอง การใช้และการจำหน่ายสารเสพติด" }
          - { id: "พ 5.1 ม.4-6/3", level: ม.4-6, text: "วิเคราะห์ปัจจัยที่มีผลต่อสุขภาพหรือความรุนแรงของคนไทยและเสนอแนวทางป้องกัน" }
          - { id: "พ 5.1 ม.4-6/4", level: ม.4-6, text: "วางแผน กำหนดแนวทางลดอุบัติเหตุ และสร้างเสริมความปลอดภัยในชุมชน" }
          - { id: "พ 5.1 ม.4-6/5", level: ม.4-6, text: "มีส่วนร่วมในการสร้างเสริมความปลอดภัยในชุมชน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “มีส่วนร่วมในการสร้างเสริม|ความปลอดภัยในชุมชน” ไม่เว้นวรรค" }
          - { id: "พ 5.1 ม.4-6/6", level: ม.4-6, text: "ใช้ทักษะการตัดสินใจแก้ปัญหาในสถานการณ์ที่เสี่ยงต่อสุขภาพและความรุนแรง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง และเอกสาร สพฐ. อีกสองฉบับก็ขึ้นบรรทัดตรงเดียวกันหรือใช้ถ้อยคำต่างไป จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ใช้ทักษะการตัดสินใจแก้ปัญหา|ในสถานการณ์ที่เสี่ยงต่อสุขภาพและ” ไม่เว้นวรรค" }
          - { id: "พ 5.1 ม.4-6/7", level: ม.4-6, text: "แสดงวิธีการช่วยฟื้นคืนชีพอย่างถูกวิธี" }
