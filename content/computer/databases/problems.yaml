problems:
  - id: computer.data.databases.p001
    topics: [computer.data.databases]
    difficulty: 1
    type: match
    stem: "จับคู่คำในฐานข้อมูลเชิงสัมพันธ์กับความหมาย"
    pairs:
      - { left: "ตาราง", right: "ที่เก็บข้อมูลเรื่องเดียวกัน เช่น นักเรียนทั้งหมด" }
      - { left: "แถว", right: "สิ่งหรือเหตุการณ์หนึ่ง เช่น นักเรียนหนึ่งคน" }
      - { left: "คอลัมน์", right: "คุณสมบัติหนึ่ง เช่น ชื่อ หรือ ชั้น" }
      - { left: "คีย์หลัก", right: "คอลัมน์ที่ค่าไม่ซ้ำ ใช้ระบุแถว" }
      - { left: "คีย์นอก", right: "คอลัมน์ที่อ้างคีย์หลักของอีกตาราง" }
    hints:
      - "แถวเรียงตามแนวนอน คอลัมน์เรียงตามแนวตั้ง"
      - "คีย์ใดเชื่อมสองตารางเข้าด้วยกัน"
    solution: "ตารางเก็บข้อมูลเรื่องเดียวกัน แถวคือแต่ละรายการ คอลัมน์คือคุณสมบัติ คีย์หลักระบุแถวไม่ซ้ำ และคีย์นอกอ้างคีย์หลักของตารางอื่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.databases.p002
    topics: [computer.data.databases]
    difficulty: 1
    type: mcq
    stem: "ตารางนักเรียนของโรงเรียนมีคอลัมน์ต่อไปนี้ คอลัมน์ใดเหมาะเป็น **คีย์หลัก** ที่สุด"
    choices:
      - { id: a, text: "เลขประจำตัวนักเรียน", correct: true }
      - { id: b, text: "ชื่อ", feedback: "นักเรียนชื่อซ้ำกันได้ และชื่ออาจเปลี่ยน" }
      - { id: c, text: "ชั้น", feedback: "นักเรียนหลายคนอยู่ชั้นเดียวกัน ค่าจึงซ้ำ" }
      - { id: d, text: "วันเกิด", feedback: "คนเกิดวันเดียวกันได้" }
    hints:
      - "คีย์หลักต้องไม่ซ้ำกันเลยในทั้งตาราง"
      - "ค่าใดที่โรงเรียนกำหนดให้แต่ละคนไม่ซ้ำกัน"
    solution: "เลขประจำตัวนักเรียนถูกกำหนดให้ไม่ซ้ำและไม่เปลี่ยน จึงเหมาะเป็นคีย์หลัก ชื่อ ชั้น และวันเกิดซ้ำกันได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.databases.p003
    topics: [computer.data.databases]
    difficulty: 2
    type: numeric
    stem: |
      ใช้ตาราง `books` ของห้องสมุดในภาพ คำสั่งนี้ได้ผลเป็นตัวเลขใด

      ```sql
      SELECT COUNT(*) FROM books WHERE category = 'นิยาย';
      ```
    figure:
      src: library-tables.svg
      alt: "สามตาราง ตาราง students มีคอลัมน์ student_id, name, class แถว 1 ฟ้า ม.4/1, 2 ต้น ม.4/2, 3 มด ม.4/1, 4 ปลื้ม ม.5/1 ตาราง books มีคอลัมน์ book_id, title, category, year แถว 101 นิทานดวงดาว นิยาย 2558, 102 Python เบื้องต้น คอมพิวเตอร์ 2565, 103 ป่าชายเลนของเรา วิทยาศาสตร์ 2561, 104 จดหมายถึงยาย นิยาย 2549, 105 อัลกอริทึมสนุก คอมพิวเตอร์ 2567 ตาราง loans มีคอลัมน์ loan_id, student_id, book_id, loan_date, returned แถว 1: 1, 102, 2568-11-03, 1 แถว 2: 3, 101, 2568-11-04, 0 แถว 3: 1, 105, 2568-11-05, 0 แถว 4: 2, 102, 2568-11-05, 0 แถว 5: 4, 103, 2568-11-06, 1 แถว 6: 3, 104, 2568-11-07, 0 (returned 1 คือคืนแล้ว 0 คือยังไม่คืน)"
    answer: { value: 2, unit: "แถว" }
    hints:
      - "WHERE เลือกเฉพาะแถวที่ category เป็นนิยาย"
      - "COUNT(*) นับจำนวนแถวที่ผ่านเงื่อนไข"
    misconceptions:
      - { match: 5, feedback: "5 คือจำนวนหนังสือทั้งหมด แต่ WHERE กรองเหลือเฉพาะนิยาย" }
    solution: "หนังสือหมวดนิยายคือ 101 นิทานดวงดาว และ 104 จดหมายถึงยาย ผลจึงเป็น 2"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.databases.p004
    topics: [computer.data.databases]
    difficulty: 2
    type: mcq
    stem: "ต้องการเลือกเฉพาะนักเรียนชั้น ม.4/1 จากตาราง students ควรเติมส่วนใดต่อจาก `SELECT name FROM students`"
    choices:
      - { id: a, text: "WHERE class = 'ม.4/1'", correct: true }
      - { id: b, text: "ORDER BY class", feedback: "ORDER BY เรียงผล แต่ไม่ได้กรองแถว ยังได้นักเรียนทุกชั้น" }
      - { id: c, text: "COUNT(class)", feedback: "COUNT ใช้นับ และต้องอยู่ในส่วน SELECT" }
      - { id: d, text: "JOIN class", feedback: "JOIN ใช้รวมตาราง ไม่ใช่กรองแถว" }
    hints:
      - "ส่วนใดของ SQL ใช้กรองแถวตามเงื่อนไข"
      - "ข้อความใน SQL ใส่ในเครื่องหมาย ' '"
    solution: "SELECT name FROM students WHERE class = 'ม.4/1' ได้ฟ้ากับมด WHERE ใช้กรองแถว ส่วน ORDER BY ใช้เรียง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.databases.p005
    topics: [computer.data.databases]
    difficulty: 2
    type: text
    stem: "คำสั่ง SQL ส่วนใดใช้ **เรียงลำดับ** ผลลัพธ์ เช่น เรียงหนังสือตามปีที่พิมพ์ (พิมพ์สองคำภาษาอังกฤษ)"
    accepted: ["ORDER BY", "order by"]
    misconceptions:
      - { match: "SORT", feedback: "SQL ไม่ได้ใช้คำว่า SORT ใช้สองคำที่ขึ้นต้นด้วย ORDER" }
      - { match: "WHERE", feedback: "WHERE ใช้กรองแถว ไม่ใช่เรียง" }
    hints:
      - "คำแรกแปลว่าลำดับ"
      - "ใช้คู่กับ ASC หรือ DESC"
    solution: "ORDER BY เช่น ORDER BY year DESC เรียงจากปีมากไปน้อย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.databases.p006
    topics: [computer.data.databases]
    difficulty: 3
    type: mcq
    stem: |
      ใช้ตาราง `books` ในภาพ คำสั่งนี้ได้ชื่อหนังสือใดเป็น **แถวแรก** ของผลลัพธ์

      ```sql
      SELECT title FROM books
      WHERE year >= 2560
      ORDER BY year DESC;
      ```
    figure:
      src: library-tables.svg
      alt: "สามตาราง ตาราง students มีคอลัมน์ student_id, name, class แถว 1 ฟ้า ม.4/1, 2 ต้น ม.4/2, 3 มด ม.4/1, 4 ปลื้ม ม.5/1 ตาราง books มีคอลัมน์ book_id, title, category, year แถว 101 นิทานดวงดาว นิยาย 2558, 102 Python เบื้องต้น คอมพิวเตอร์ 2565, 103 ป่าชายเลนของเรา วิทยาศาสตร์ 2561, 104 จดหมายถึงยาย นิยาย 2549, 105 อัลกอริทึมสนุก คอมพิวเตอร์ 2567 ตาราง loans มีคอลัมน์ loan_id, student_id, book_id, loan_date, returned แถว 1: 1, 102, 2568-11-03, 1 แถว 2: 3, 101, 2568-11-04, 0 แถว 3: 1, 105, 2568-11-05, 0 แถว 4: 2, 102, 2568-11-05, 0 แถว 5: 4, 103, 2568-11-06, 1 แถว 6: 3, 104, 2568-11-07, 0 (returned 1 คือคืนแล้ว 0 คือยังไม่คืน)"
    choices:
      - { id: a, text: "อัลกอริทึมสนุก", correct: true }
      - { id: b, text: "ป่าชายเลนของเรา", feedback: "เล่มนี้ปี 2561 น้อยที่สุดในกลุ่มที่ผ่านเงื่อนไข จะอยู่แถวสุดท้ายเมื่อเรียง DESC" }
      - { id: c, text: "Python เบื้องต้น", feedback: "ปี 2565 ยังมีเล่มที่ใหม่กว่า" }
      - { id: d, text: "นิทานดวงดาว", feedback: "ปี 2558 ไม่ผ่าน WHERE year >= 2560" }
    hints:
      - "กรองก่อน: เล่มใดพิมพ์ปี 2560 ขึ้นไป"
      - "DESC เรียงจากมากไปน้อย"
    solution: "ผ่านเงื่อนไข 3 เล่ม: Python เบื้องต้น (2565), ป่าชายเลนของเรา (2561), อัลกอริทึมสนุก (2567) เรียงปีมากไปน้อยได้ อัลกอริทึมสนุก, Python เบื้องต้น, ป่าชายเลนของเรา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.databases.p007
    topics: [computer.data.databases]
    difficulty: 3
    type: numeric
    stem: |
      ใช้ตารางในภาพ คำสั่งนี้นับการยืมที่ **ยังไม่คืน** ของนักเรียนชั้น ม.4/1 ได้ตัวเลขใด

      ```sql
      SELECT COUNT(*)
      FROM loans
      JOIN students ON loans.student_id = students.student_id
      WHERE students.class = 'ม.4/1' AND loans.returned = 0;
      ```
    figure:
      src: library-tables.svg
      alt: "สามตาราง ตาราง students มีคอลัมน์ student_id, name, class แถว 1 ฟ้า ม.4/1, 2 ต้น ม.4/2, 3 มด ม.4/1, 4 ปลื้ม ม.5/1 ตาราง books มีคอลัมน์ book_id, title, category, year แถว 101 นิทานดวงดาว นิยาย 2558, 102 Python เบื้องต้น คอมพิวเตอร์ 2565, 103 ป่าชายเลนของเรา วิทยาศาสตร์ 2561, 104 จดหมายถึงยาย นิยาย 2549, 105 อัลกอริทึมสนุก คอมพิวเตอร์ 2567 ตาราง loans มีคอลัมน์ loan_id, student_id, book_id, loan_date, returned แถว 1: 1, 102, 2568-11-03, 1 แถว 2: 3, 101, 2568-11-04, 0 แถว 3: 1, 105, 2568-11-05, 0 แถว 4: 2, 102, 2568-11-05, 0 แถว 5: 4, 103, 2568-11-06, 1 แถว 6: 3, 104, 2568-11-07, 0 (returned 1 คือคืนแล้ว 0 คือยังไม่คืน)"
    answer: { value: 3, unit: "รายการ" }
    hints:
      - "นักเรียน ม.4/1 คือรหัส 1 (ฟ้า) และ 3 (มด)"
      - "หาแถวใน loans ที่ student_id เป็น 1 หรือ 3 และ returned = 0"
    misconceptions:
      - { match: 4, feedback: "นับการยืมทั้งหมดของ ม.4/1 รวมรายการที่คืนแล้ว (ฟ้าคืน Python เบื้องต้นแล้ว)" }
      - { match: 2, feedback: "นับเฉพาะการยืมของมด ลืมฟ้าซึ่งอยู่ ม.4/1 เหมือนกันและยังไม่คืนอีก 1 เล่ม" }
    solution: "การยืมของฟ้า (1): loan 1 คืนแล้ว, loan 3 ยังไม่คืน การยืมของมด (3): loan 2 และ loan 6 ยังไม่คืน รวม 3 รายการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.databases.p008
    topics: [computer.data.databases]
    difficulty: 3
    type: mcq
    stem: "ตารางการยืมเดิมเก็บ ชื่อนักเรียน ชั้น ชื่อหนังสือ และวันที่ยืม ไว้ในทุกแถว เมื่อนักเรียนย้ายชั้นแล้วบรรณารักษ์แก้ไม่ครบทุกแถว ปัญหานี้แก้ได้ดีที่สุดอย่างไร"
    choices:
      - { id: a, text: "แยกตารางนักเรียนออกมา เก็บชั้นไว้ที่เดียว แล้วให้ตารางการยืมอ้างรหัสนักเรียน", correct: true }
      - { id: b, text: "เพิ่มคอลัมน์ชั้นใหม่อีกคอลัมน์ในตารางการยืม", feedback: "ยิ่งเพิ่มข้อมูลซ้ำ แก้ยากขึ้น" }
      - { id: c, text: "ให้บรรณารักษ์ระวังมากขึ้นเวลาแก้", feedback: "ยังต้องแก้หลายแถว ความผิดพลาดเกิดซ้ำได้ ควรแก้ที่การออกแบบ" }
      - { id: d, text: "ลบประวัติการยืมเก่าทิ้งทุกเทอม", feedback: "สูญเสียข้อมูลที่ต้องใช้ และไม่ได้แก้ต้นเหตุ" }
    hints:
      - "ข้อมูลใดซ้ำกันในหลายแถว"
      - "ถ้าข้อมูลอยู่ที่เดียว แก้ครั้งเดียวก็พอ"
    solution: "ต้นเหตุคือข้อมูลซ้ำซ้อน การแยกตาราง students แล้วอ้างด้วยคีย์นอก student_id ทำให้ชั้นของแต่ละคนอยู่ที่เดียว แก้ครั้งเดียวถูกทุกการยืม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.databases.p009
    topics: [computer.data.databases]
    difficulty: 3
    type: order
    stem: "เรียงส่วนของคำสั่ง SQL ให้ถูกลำดับ เพื่อหาชื่อหนังสือหมวดคอมพิวเตอร์เรียงตามปี"
    items:
      - "SELECT title"
      - "FROM books"
      - "WHERE category = 'คอมพิวเตอร์'"
      - "ORDER BY year;"
    hints:
      - "เริ่มด้วยการบอกว่าจะเอาคอลัมน์ใด แล้วจากตารางใด"
      - "กรองก่อนเรียง ORDER BY อยู่ท้ายสุด"
    solution: "SELECT title FROM books WHERE category = 'คอมพิวเตอร์' ORDER BY year; ได้ Python เบื้องต้น (2565) แล้ว อัลกอริทึมสนุก (2567)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.databases.p010
    topics: [computer.data.databases]
    difficulty: 4
    type: mcq
    stem: "ตาราง loans ประกาศให้ student_id เป็นคีย์นอกที่อ้าง students และเปิดการตรวจคีย์นอกไว้ ถ้าบันทึกการยืมของ student_id = 9 ซึ่งไม่มีในตาราง students จะเกิดอะไรขึ้น"
    choices:
      - { id: a, text: "ฐานข้อมูลปฏิเสธการบันทึก เพราะผิดความถูกต้องของการอ้างอิง", correct: true }
      - { id: b, text: "บันทึกได้ และสร้างนักเรียนรหัส 9 ให้อัตโนมัติ", feedback: "ฐานข้อมูลไม่สร้างข้อมูลที่ไม่รู้จักให้เอง" }
      - { id: c, text: "บันทึกได้ตามปกติ เพราะเป็นแค่ตัวเลข", feedback: "หน้าที่ของคีย์นอกคือกันไม่ให้อ้างสิ่งที่ไม่มีอยู่จริง" }
      - { id: d, text: "ลบตาราง students ทั้งหมด", feedback: "ไม่มีการลบข้อมูลอื่น คำสั่งที่ผิดกฎถูกปฏิเสธเท่านั้น" }
    hints:
      - "คีย์นอกต้องอ้างคีย์หลักที่มีอยู่จริง"
      - "ทบทวนเรื่องความถูกต้องของการอ้างอิง"
    solution: "การอ้างนักเรียนที่ไม่มีทำให้ข้อมูลขัดแย้ง ฐานข้อมูลจึงปฏิเสธ (SQLite แจ้ง FOREIGN KEY constraint failed) ต้องเพิ่มนักเรียนรหัส 9 ก่อน หรือแก้รหัสให้ถูก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.databases.p011
    topics: [computer.data.databases]
    difficulty: 4
    type: mcq
    stem: |
      เว็บห้องสมุดสร้างคำสั่งค้นหาแบบนี้ ถ้าผู้ใช้พิมพ์ข้อความที่มีเครื่องหมาย `'` และคำสั่ง SQL ปนมา คำสั่งอาจคืนข้อมูลนักเรียนทุกคน ควรแก้อย่างไร

      ```python
      sql = "SELECT * FROM students WHERE name = '" + name + "'"
      rows = con.execute(sql).fetchall()
      ```
    choices:
      - { id: a, text: "ใช้ตัวยึดตำแหน่ง con.execute(\"SELECT * FROM students WHERE name = ?\", (name,)) และตรวจรูปแบบข้อมูลรับเข้า", correct: true }
      - { id: b, text: "ซ่อนช่องค้นหาไว้ในหน้าเว็บที่ไม่มีลิงก์", feedback: "การซ่อนไม่ได้ปิดช่องโหว่ ใครรู้ที่อยู่ก็ส่งข้อมูลมาได้" }
      - { id: c, text: "เปลี่ยนชื่อตาราง students เป็นชื่อที่เดายาก", feedback: "ข้อความที่แทรกมายังเปลี่ยนความหมายของคำสั่งได้เหมือนเดิม" }
      - { id: d, text: "แสดงข้อความเตือนให้ผู้ใช้อย่าพิมพ์เครื่องหมาย '", feedback: "ผู้ไม่หวังดีไม่ทำตามคำเตือน ต้องป้องกันที่โปรแกรม" }
    hints:
      - "ปัญหาคือข้อความของผู้ใช้กลายเป็นส่วนหนึ่งของคำสั่ง"
      - "วิธีใดทำให้ฐานข้อมูลถือว่าข้อความนั้นเป็นข้อมูลเสมอ"
    solution: "การต่อข้อความเข้าคำสั่งทำให้เครื่องหมาย ' ในข้อความปิดสตริงและเปลี่ยนเงื่อนไขได้ (SQL injection) ตัวยึดตำแหน่ง ? ส่งข้อความแยกจากคำสั่ง ฐานข้อมูลจึงค้นหาชื่อที่ตรงกับข้อความนั้นทั้งก้อน ร่วมกับการตรวจรูปแบบข้อมูลรับเข้าและให้สิทธิ์เท่าที่จำเป็น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.databases.p012
    topics: [computer.data.databases]
    difficulty: 4
    type: numeric
    stem: "ออกแบบฐานข้อมูลชุมนุมของโรงเรียน นักเรียนเข้าได้หลายชุมนุม และชุมนุมหนึ่งมีนักเรียนหลายคน จึงใช้ตาราง students, clubs และตารางกลาง memberships (หนึ่งแถวต่อการเป็นสมาชิกหนึ่งครั้ง) ถ้าฟ้า ต้น และมด เข้าคนละ 2 ชุมนุม และปลื้มเข้า 3 ชุมนุม ตาราง memberships มีกี่แถว"
    answer: { value: 9, unit: "แถว" }
    hints:
      - "หนึ่งแถวของ memberships คือนักเรียนหนึ่งคนกับชุมนุมหนึ่งชุมนุม"
      - "รวมจำนวนชุมนุมของทุกคน"
    misconceptions:
      - { match: 4, feedback: "4 คือจำนวนนักเรียน แต่ตารางกลางเก็บการเป็นสมาชิกแต่ละครั้ง" }
      - { match: 24, feedback: "ไม่ได้เก็บทุกคู่ที่เป็นไปได้ เก็บเฉพาะคู่ที่เป็นสมาชิกจริง" }
    solution: "2 + 2 + 2 + 3 = 9 แถว ความสัมพันธ์หลายต่อหลายต้องใช้ตารางกลางที่มีคีย์นอกสองตัว คือ student_id และ club_id"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.databases.p013
    topics: [computer.data.databases]
    difficulty: 4
    type: mcq
    stem: "ร้านค้าสหกรณ์ในหมู่บ้านบนดอยมีเครื่องคิดเงินเครื่องเดียว อินเทอร์เน็ตหลุดบ่อย ต้องเก็บรายการขายวันละไม่กี่ร้อยรายการ ควรเก็บฐานข้อมูลแบบใด"
    choices:
      - { id: a, text: "ฐานข้อมูลในเครื่อง ขายได้แม้อินเทอร์เน็ตหลุด และสำรองข้อมูลขึ้นคลาวด์หรือลงดิสก์ภายนอกเมื่อมีโอกาส", correct: true }
      - { id: b, text: "ฐานข้อมูลบนคลาวด์อย่างเดียว ต้องต่ออินเทอร์เน็ตทุกครั้งที่ขาย", feedback: "เมื่ออินเทอร์เน็ตหลุดจะขายไม่ได้ ไม่เหมาะกับสภาพนี้" }
      - { id: c, text: "เก็บในเครื่องอย่างเดียวโดยไม่ต้องสำรอง", feedback: "ถ้าเครื่องเสีย ข้อมูลหายทั้งหมด" }
      - { id: d, text: "จดในกระดาษแล้วพิมพ์เข้าคลาวด์ปลายปี", feedback: "ข้อมูลไม่เป็นปัจจุบัน และพิมพ์ผิดได้มาก" }
    hints:
      - "ข้อจำกัดหลักของร้านนี้คืออะไร"
      - "การเก็บในเครื่องมีความเสี่ยงอะไรที่ต้องรับมือ"
    solution: "ร้านมีเครื่องเดียวและอินเทอร์เน็ตไม่เสถียร ฐานข้อมูลในเครื่องจึงเหมาะ แต่ต้องสำรองข้อมูลไว้ที่อื่นเพื่อรับมือเครื่องเสีย ถ้าร้านมีหลายสาขาที่ต้องเห็นข้อมูลเดียวกันและอินเทอร์เน็ตดี คลาวด์จะเหมาะกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.databases.p014
    topics: [computer.data.databases]
    difficulty: 5
    type: mcq
    stem: "แอปห้องสมุดต้องเก็บรหัสผ่านของสมาชิก ข้อใดเป็นวิธีที่ถูกต้อง"
    choices:
      - { id: a, text: "เก็บค่าแฮชจากฟังก์ชันที่ตั้งใจให้ช้า (เช่น bcrypt หรือ Argon2) พร้อมซอลต์สุ่มที่ต่างกันในแต่ละบัญชี", correct: true }
      - { id: b, text: "เก็บรหัสผ่านเป็นข้อความตรง ๆ ในคอลัมน์ password", feedback: "ถ้าฐานข้อมูลรั่ว รหัสผ่านทุกคนถูกเปิดเผยทันที และหลายคนใช้รหัสเดียวกันกับบริการอื่น" }
      - { id: c, text: "เข้ารหัสด้วยกุญแจแล้วเก็บกุญแจไว้ในเซิร์ฟเวอร์เดียวกัน", feedback: "ถอดกลับได้ ถ้ากุญแจรั่วพร้อมฐานข้อมูล รหัสผ่านทุกตัวถูกเปิดเผย" }
      - { id: d, text: "แฮชด้วยฟังก์ชันที่เร็วที่สุดโดยไม่มีซอลต์", feedback: "แฮชเร็วทำให้ลองเดาได้มากต่อวินาที และรหัสเหมือนกันได้ค่าแฮชเหมือนกัน" }
    hints:
      - "รหัสผ่านไม่จำเป็นต้องถอดกลับ แค่ต้องตรวจว่าตรงหรือไม่"
      - "ทบทวนเรื่องซอลต์และฟังก์ชันที่ตั้งใจให้ช้า"
    solution: "การตรวจรหัสผ่านทำได้โดยแฮชรหัสที่พิมพ์ด้วยซอลต์เดิมแล้วเทียบ จึงไม่ต้องเก็บแบบถอดกลับได้ ซอลต์ทำให้รหัสเหมือนกันได้ค่าแฮชต่างกัน และฟังก์ชันที่ช้าทำให้การเดารหัสจากฐานข้อมูลที่รั่วทำได้ช้ามาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.databases.p015
    topics: [computer.data.databases]
    difficulty: 5
    type: numeric
    stem: "ระบบหนึ่งมีผู้ใช้ 1,000 บัญชี สมมติผู้ไม่หวังดีได้ฐานข้อมูลค่าแฮชไปและมีรายการรหัสผ่านยอดนิยม 10,000 รหัส ถ้าระบบ **ไม่ใช้ซอลต์** เขาแฮชแต่ละรหัสครั้งเดียวแล้วเทียบกับทุกบัญชีได้ (10,000 ครั้ง) แต่ถ้าแต่ละบัญชีมี **ซอลต์ต่างกัน** ต้องแฮชแยกทุกบัญชี จะต้องคำนวณแฮชทั้งหมดกี่ครั้งเพื่อลองรายการนี้กับทุกบัญชี"
    answer: { value: 10000000, unit: "ครั้ง" }
    hints:
      - "ซอลต์ต่างกันทำให้ค่าแฮชของรหัสเดียวกันต่างกันในแต่ละบัญชี"
      - "จำนวนครั้ง = จำนวนบัญชี × จำนวนรหัสที่ลอง"
    misconceptions:
      - { match: 10000, feedback: "นี่คือกรณีไม่มีซอลต์ ซอลต์ต่างกันทำให้ใช้ผลแฮชเดียวกับทุกบัญชีไม่ได้" }
      - { match: 11000, feedback: "บวกจำนวนบัญชีกับจำนวนรหัส แต่ต้องลองทุกรหัสกับทุกบัญชี จึงคูณกัน" }
    solution: "1,000 × 10,000 = 10,000,000 ครั้ง มากกว่ากรณีไม่มีซอลต์ 1,000 เท่า และถ้าฟังก์ชันแฮชถูกตั้งให้ช้า แต่ละครั้งยังใช้เวลามากขึ้นอีก รหัสผ่านที่ยาวและไม่อยู่ในรายการยอดนิยมจึงปลอดภัยกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.databases.p016
    topics: [computer.data.databases]
    difficulty: 5
    type: numeric
    stem: |
      ใช้ตารางในภาพ คำสั่งนี้ได้ผลลัพธ์กี่แถว

      ```sql
      SELECT students.name, books.title
      FROM loans
      JOIN students ON loans.student_id = students.student_id
      JOIN books ON loans.book_id = books.book_id
      WHERE books.category = 'คอมพิวเตอร์';
      ```
    figure:
      src: library-tables.svg
      alt: "สามตาราง ตาราง students มีคอลัมน์ student_id, name, class แถว 1 ฟ้า ม.4/1, 2 ต้น ม.4/2, 3 มด ม.4/1, 4 ปลื้ม ม.5/1 ตาราง books มีคอลัมน์ book_id, title, category, year แถว 101 นิทานดวงดาว นิยาย 2558, 102 Python เบื้องต้น คอมพิวเตอร์ 2565, 103 ป่าชายเลนของเรา วิทยาศาสตร์ 2561, 104 จดหมายถึงยาย นิยาย 2549, 105 อัลกอริทึมสนุก คอมพิวเตอร์ 2567 ตาราง loans มีคอลัมน์ loan_id, student_id, book_id, loan_date, returned แถว 1: 1, 102, 2568-11-03, 1 แถว 2: 3, 101, 2568-11-04, 0 แถว 3: 1, 105, 2568-11-05, 0 แถว 4: 2, 102, 2568-11-05, 0 แถว 5: 4, 103, 2568-11-06, 1 แถว 6: 3, 104, 2568-11-07, 0 (returned 1 คือคืนแล้ว 0 คือยังไม่คืน)"
    answer: { value: 3, unit: "แถว" }
    hints:
      - "หนังสือหมวดคอมพิวเตอร์คือ 102 และ 105"
      - "นับแถวใน loans ที่ book_id เป็น 102 หรือ 105 แต่ละแถวให้ผลหนึ่งแถว"
    misconceptions:
      - { match: 2, feedback: "2 คือจำนวนหนังสือหมวดคอมพิวเตอร์ แต่ Python เบื้องต้นถูกยืม 2 ครั้ง JOIN ให้หนึ่งแถวต่อการยืมหนึ่งครั้ง" }
      - { match: 6, feedback: "6 คือการยืมทั้งหมด แต่ WHERE เก็บเฉพาะหนังสือหมวดคอมพิวเตอร์" }
    solution: "loans ที่ book_id = 102: loan 1 (ฟ้า), loan 4 (ต้น) และ book_id = 105: loan 3 (ฟ้า) ได้ 3 แถว: (ฟ้า, Python เบื้องต้น), (ฟ้า, อัลกอริทึมสนุก), (ต้น, Python เบื้องต้น)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.databases.p017
    topics: [computer.data.databases]
    difficulty: 3
    type: mcq
    stem: "การยืมหนังสือต้องทำสองอย่าง คือ เพิ่มแถวในตาราง loans และลดจำนวนเล่มที่ว่างของหนังสือลง 1 ถ้าไฟดับหลังทำอย่างแรกเสร็จแต่ก่อนทำอย่างที่สอง ระบบที่ใช้ **ธุรกรรม** จะเป็นอย่างไร"
    choices:
      - { id: a, text: "ย้อนกลับทั้งชุด เหมือนการยืมครั้งนั้นไม่เคยเกิด ข้อมูลไม่ค้างครึ่งเดียว", correct: true }
      - { id: b, text: "เก็บแถวการยืมไว้ แต่จำนวนเล่มที่ว่างไม่ลด", feedback: "นี่คือสภาพค้างครึ่งเดียวที่ธุรกรรมป้องกัน" }
      - { id: c, text: "ลดจำนวนเล่มอัตโนมัติเมื่อไฟมา โดยไม่ต้องย้อนกลับ", feedback: "ธุรกรรมไม่ได้เดาว่าจะทำต่อ แต่ย้อนกลับให้ข้อมูลสอดคล้อง" }
      - { id: d, text: "ลบตาราง loans ทิ้งทั้งตาราง", feedback: "ธุรกรรมย้อนเฉพาะคำสั่งในชุดนั้น ไม่กระทบข้อมูลอื่น" }
    hints:
      - "ธุรกรรมต้องสำเร็จทั้งหมดหรือไม่เกิดเลย"
      - "ถ้าค้างครึ่งเดียว ข้อมูลสองตารางจะขัดกันอย่างไร"
    solution: "ธุรกรรมรวมคำสั่งหลายคำสั่งเป็นหน่วยเดียว ถ้าไม่สำเร็จครบ ระบบย้อนกลับทั้งหมด จำนวนเล่มที่ว่างจึงตรงกับการยืมเสมอ"
    license: CC-BY-SA-4.0
    ai_assisted: true
