problems:
  - id: earthscience.geology.geologic-history-maps.p001
    topics: [earthscience.geology.geologic-history-maps]
    difficulty: 1
    type: mcq
    stem: "หน้าผามีชั้นหินตะกอนสามชั้นวางตัวในแนวราบ ไม่ถูกพลิกกลับ ชั้นบนเป็นหินทราย ชั้นกลางเป็นหินดินดาน ชั้นล่างเป็นหินปูน ชั้นใดอายุมากที่สุด"
    choices:
      - { id: a, text: "หินปูน ชั้นล่างสุด", correct: true }
      - { id: b, text: "หินทราย ชั้นบนสุด", feedback: "ชั้นบนสุดทับถมทีหลังสุด จึงอายุน้อยที่สุด" }
      - { id: c, text: "หินดินดาน ชั้นกลาง", feedback: "ชั้นกลางทับอยู่บนหินปูน จึงเกิดหลังหินปูน" }
      - { id: d, text: "บอกไม่ได้ ต้องหาอายุสัมบูรณ์ก่อน", feedback: "กฎการลำดับชั้นหินบอกลำดับก่อนหลังได้โดยไม่ต้องรู้อายุเป็นปี" }
    hints:
      - "ตะกอนทับถมจากล่างขึ้นบน"
      - "ใช้กฎการลำดับชั้นหิน"
    solution: "ตามกฎการลำดับชั้นหิน ชั้นที่ไม่ถูกพลิกกลับ ชั้นล่างเกิดก่อน หินปูนชั้นล่างสุดจึงอายุมากที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.geologic-history-maps.p002
    topics: [earthscience.geology.geologic-history-maps]
    difficulty: 1
    type: match
    stem: "จับคู่หลักการกับข้อความ"
    pairs:
      - { left: "กฎการลำดับชั้นหิน", right: "ชั้นล่างเกิดก่อนชั้นบน" }
      - { left: "หลักการวางตัวในแนวราบ", right: "ตะกอนทับถมเป็นชั้นแนวราบ ชั้นเอียงแปลว่าถูกแรงกระทำภายหลัง" }
      - { left: "หลักการตัดขวาง", right: "หินอัคนีหรือรอยเลื่อนที่ตัดผ่านชั้นหิน เกิดหลังชั้นหินนั้น" }
      - { left: "ซากดึกดำบรรพ์ดัชนี", right: "ใช้เทียบอายุของชั้นหินที่อยู่ห่างกัน" }
    hints:
      - "หลักการใดพูดถึงสิ่งที่ตัดผ่าน"
      - "หลักการใดพูดถึงชั้นที่เอียง"
    solution: "ลำดับชั้นหิน: ล่างเก่ากว่า วางตัวในแนวราบ: ชั้นเอียงถูกแรงภายหลัง ตัดขวาง: สิ่งที่ตัดผ่านเกิดทีหลัง ซากดึกดำบรรพ์ดัชนี: เทียบอายุชั้นหินต่างที่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.geologic-history-maps.p003
    topics: [earthscience.geology.geologic-history-maps]
    difficulty: 2
    type: mcq
    stem: "บนแผนที่ภูมิประเทศ บริเวณที่เส้นชั้นความสูงอยู่ชิดกันมาก แสดงว่าพื้นที่นั้นเป็นอย่างไร"
    choices:
      - { id: a, text: "ลาดชันมาก", correct: true }
      - { id: b, text: "สูงที่สุดของแผนที่", feedback: "ความสูงอ่านจากตัวเลขบนเส้น ไม่ใช่จากความชิดของเส้น" }
      - { id: c, text: "ราบเรียบ", feedback: "พื้นที่ราบมีเส้นชั้นความสูงห่างกันมาก" }
      - { id: d, text: "เป็นแม่น้ำ", feedback: "ลำน้ำดูจากเส้นที่หักเป็นรูปตัววี ไม่ใช่จากเส้นที่ชิดกัน" }
    hints:
      - "เส้นสองเส้นที่ติดกันมีความสูงต่างกันเท่าช่วงชั้นความสูงเสมอ"
      - "ถ้าความสูงเปลี่ยนเท่าเดิมในระยะทางสั้นลง พื้นจะเป็นอย่างไร"
    solution: "เส้นที่ติดกันต่างกันเท่าช่วงชั้นความสูงเสมอ เส้นชิดกันแปลว่าความสูงเปลี่ยนมากในระยะทางราบสั้น จึงลาดชันมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.geologic-history-maps.p004
    topics: [earthscience.geology.geologic-history-maps]
    difficulty: 2
    type: numeric
    stem: "ถ่านจากเตาไฟโบราณในถ้ำแห่งหนึ่งเหลือคาร์บอน-14 เพียงหนึ่งในสี่ของเดิม ครึ่งชีวิตของคาร์บอน-14 คือ 5,730 ปี ถ่านนี้อายุประมาณกี่ปี"
    answer: { value: 11460, tolerance: 10, unit: ปี }
    misconceptions:
      - { match: 22920, feedback: "หนึ่งในสี่คือผ่านสองครึ่งชีวิต ไม่ใช่สี่ครึ่งชีวิต" }
      - { match: 1432.5, feedback: "หาร 5,730 ด้วย 4 ไม่ถูก ครึ่งชีวิตไม่ได้ลดลงเป็นเส้นตรง" }
    hints:
      - "ผ่านหนึ่งครึ่งชีวิตเหลือครึ่งหนึ่ง ผ่านสองครึ่งชีวิตเหลือเท่าไร"
      - "อายุ = จำนวนครึ่งชีวิต × 5,730 ปี"
    solution: "$1 \\to \\tfrac12 \\to \\tfrac14$ คือผ่านสองครึ่งชีวิต อายุ $= 2 \\times 5{,}730 = 11{,}460$ ปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.geologic-history-maps.p005
    topics: [earthscience.geology.geologic-history-maps]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นการบอก \"อายุสัมบูรณ์\""
    choices:
      - { id: a, text: "เถ้าภูเขาไฟชั้นนี้มีอายุราว 128 ล้านปี จากการวัดโพแทสเซียม-40 และอาร์กอน-40", correct: true }
      - { id: b, text: "หินทรายชั้นนี้อายุมากกว่าหินปูนที่ทับอยู่ข้างบน", feedback: "เป็นการเทียบก่อนหลัง คืออายุสัมพัทธ์" }
      - { id: c, text: "หินอัคนีนี้เกิดหลังชั้นหินที่มันแทรกตัด", feedback: "หลักการตัดขวางบอกเพียงลำดับ จึงเป็นอายุสัมพัทธ์" }
      - { id: d, text: "ชั้นหินนี้มีซากแอมโมไนต์ชนิดเดียวกับอีกแห่ง จึงอายุใกล้กัน", feedback: "การเทียบซากดึกดำบรรพ์ดัชนีให้อายุสัมพัทธ์" }
    hints:
      - "อายุสัมบูรณ์บอกเป็นจำนวนปี"
      - "วิธีใดใช้การสลายตัวของธาตุกัมมันตรังสี"
    solution: "อายุสัมบูรณ์บอกเป็นจำนวนปี ได้จากการวัดธาตุกัมมันตรังสี ข้ออื่นบอกเพียงลำดับก่อนหลังซึ่งเป็นอายุสัมพัทธ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.geologic-history-maps.p006
    topics: [earthscience.geology.geologic-history-maps]
    difficulty: 2
    type: text
    stem: "เวลาที่ธาตุกัมมันตรังสีสลายตัวจนเหลือครึ่งหนึ่งของปริมาณเดิม เรียกว่าอะไร"
    accepted: ["ครึ่งชีวิต", "half-life", "half life", "ครึ่งอายุ"]
    misconceptions:
      - { match: "อายุสัมบูรณ์", feedback: "อายุสัมบูรณ์คืออายุของหินเป็นปี ซึ่งคำนวณจากค่านี้" }
    hints:
      - "คาร์บอน-14 มีค่านี้ 5,730 ปี"
      - "คำนี้มีคำว่า ครึ่ง"
    solution: "ครึ่งชีวิต (half-life) เป็นค่าคงที่ของธาตุแต่ละชนิด ไม่ขึ้นกับอุณหภูมิหรือความดัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.geologic-history-maps.p007
    topics: [earthscience.geology.geologic-history-maps]
    difficulty: 3
    type: order
    stem: "ภาพตัดขวางแสดงชั้นหินตะกอน ก ข ค ง หินอัคนี ฉ และรอยเลื่อน ช เรียงเหตุการณ์จากเกิดก่อนไปเกิดหลัง"
    figure: { src: p-cross-section.svg, alt: "ภาพตัดขวางชั้นหินแนวราบ ล่างสุดคือชั้น ก ถัดขึ้นมาชั้น ข และชั้น ค รอยเลื่อน ช เป็นเส้นเอียงตัดผ่านชั้น ก ข และ ค ทำให้ชั้นทั้งสามด้านซ้ายของรอยเลื่อนต่ำกว่าด้านขวา รอยเลื่อนสิ้นสุดที่ขอบบนของชั้น ค ชั้น ง วางทับอยู่บนสุดต่อเนื่องทั้งสองฝั่งโดยไม่ถูกรอยเลื่อนตัด หินอัคนี ฉ เป็นแท่งแนวตั้งด้านขวา ตัดผ่านทุกชั้นตั้งแต่ ก ถึง ง ขึ้นไปถึงผิวบน เป็นภาพสมมติ ไม่มีชั้นใดถูกพลิกกลับ" }
    items:
      - "ชั้น ก ทับถม"
      - "ชั้น ข ทับถม"
      - "ชั้น ค ทับถม"
      - "เกิดรอยเลื่อน ช"
      - "ชั้น ง ทับถม"
      - "หินอัคนี ฉ แทรกดันขึ้นมา"
    hints:
      - "รอยเลื่อน ช ตัดชั้นใดบ้าง และไม่ตัดชั้นใด"
      - "หินอัคนี ฉ ตัดชั้น ง ด้วยหรือไม่"
    solution: "ก ข ค ทับถมตามลำดับจากล่างขึ้นบน → รอยเลื่อน ช ตัดชั้น ก ข ค (เกิดหลังชั้นเหล่านี้) → ชั้น ง ทับถมปิดรอยเลื่อน (รอยเลื่อนไม่ตัด ง จึงเกิดก่อน ง) → หินอัคนี ฉ ตัดทุกชั้นรวมทั้ง ง จึงเกิดหลังสุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.geologic-history-maps.p008
    topics: [earthscience.geology.geologic-history-maps]
    difficulty: 3
    type: numeric
    stem: "จากแผนที่ภูมิประเทศ จุด ก กับจุด ข มีความสูงต่างกันกี่เมตร"
    figure: { src: p-contour.svg, alt: "แผนที่เส้นชั้นความสูงของเนินเขารูปรี ช่วงชั้นความสูง 100 m เส้นวงนอกสุด 200 m ถัดเข้าไป 300 400 500 และวงในสุด 600 m ยอดเนินอยู่ในวง 600 m ด้านตะวันตกเส้นชั้นความสูงอยู่ชิดกัน ด้านตะวันออกเส้นห่างกันมาก จุด ข อยู่บนเส้น 200 m ทางตะวันตก จุด ก อยู่บนเส้น 500 m ทางตะวันตก จุด ค อยู่บนเส้น 200 m ทางตะวันออก ทิศเหนืออยู่ด้านบน" }
    answer: { value: 300, unit: m }
    misconceptions:
      - { match: 3, feedback: "นับจำนวนช่วงได้ 3 ช่วง ต้องคูณด้วยช่วงชั้นความสูง 100 m" }
      - { match: 400, feedback: "นับเส้นได้ 4 เส้น แต่ต้องนับจำนวนช่วงระหว่างเส้น ซึ่งมี 3 ช่วง" }
    hints:
      - "อ่านตัวเลขบนเส้นที่จุด ก และจุด ข อยู่"
      - "ผลต่าง = ความสูงที่ ก − ความสูงที่ ข"
    solution: "ก อยู่บนเส้น 500 m ข อยู่บนเส้น 200 m ต่างกัน $500 - 200 = 300$ m"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.geologic-history-maps.p009
    topics: [earthscience.geology.geologic-history-maps]
    difficulty: 3
    type: mcq
    stem: "จากแผนที่ภูมิประเทศเดิม นักเดินป่าอยากขึ้นยอดเนินทางที่ลาดชันน้อยที่สุด ควรขึ้นจากด้านใด"
    figure: { src: p-contour.svg, alt: "แผนที่เส้นชั้นความสูงของเนินเขารูปรี ช่วงชั้นความสูง 100 m เส้นวงนอกสุด 200 m ถัดเข้าไป 300 400 500 และวงในสุด 600 m ยอดเนินอยู่ในวง 600 m ด้านตะวันตกเส้นชั้นความสูงอยู่ชิดกัน ด้านตะวันออกเส้นห่างกันมาก จุด ข อยู่บนเส้น 200 m ทางตะวันตก จุด ก อยู่บนเส้น 500 m ทางตะวันตก จุด ค อยู่บนเส้น 200 m ทางตะวันออก ทิศเหนืออยู่ด้านบน" }
    choices:
      - { id: a, text: "ด้านตะวันออก เริ่มจากจุด ค เพราะเส้นชั้นความสูงห่างกัน", correct: true }
      - { id: b, text: "ด้านตะวันตก เริ่มจากจุด ข เพราะระยะทางสั้นกว่า", feedback: "ระยะทางสั้นกว่าแต่เส้นชั้นความสูงชิดกัน จึงชันกว่า" }
      - { id: c, text: "ทุกด้านชันเท่ากัน เพราะยอดสูงเท่ากัน", feedback: "ความสูงที่ต้องขึ้นเท่ากัน แต่ระยะทางราบต่างกัน ความชันจึงต่างกัน" }
      - { id: d, text: "บอกไม่ได้จากแผนที่", feedback: "ระยะห่างของเส้นชั้นความสูงบอกความชันได้" }
    hints:
      - "เทียบระยะห่างของเส้นชั้นความสูงสองด้าน"
      - "เส้นห่างกันแปลว่าอะไร"
    solution: "ด้านตะวันออกเส้นชั้นความสูงห่างกันมาก ความสูงเพิ่มเท่ากันในระยะทางราบที่ยาวกว่า จึงลาดชันน้อยกว่าด้านตะวันตก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.geologic-history-maps.p010
    topics: [earthscience.geology.geologic-history-maps]
    difficulty: 3
    type: numeric
    stem: "แร่ในหินอัคนีก้อนหนึ่งเหลือโพแทสเซียม-40 หนึ่งในแปดของปริมาณตอนที่ตกผลึก ครึ่งชีวิตของโพแทสเซียม-40 คือ 1,250 ล้านปี หินนี้อายุกี่ล้านปี"
    answer: { value: 3750, tolerance: 5, unit: ล้านปี }
    misconceptions:
      - { match: 10000, feedback: "คูณด้วย 8 ไม่ถูก หนึ่งในแปดคือผ่านสามครึ่งชีวิต" }
      - { match: 2500, feedback: "สองครึ่งชีวิตเหลือหนึ่งในสี่ ยังไม่ถึงหนึ่งในแปด" }
    hints:
      - "$\\tfrac18 = \\left(\\tfrac12\\right)^n$ หา $n$"
      - "อายุ = $n$ × 1,250 ล้านปี"
    solution: "$\\tfrac18 = \\left(\\tfrac12\\right)^3$ ผ่าน 3 ครึ่งชีวิต อายุ $= 3 \\times 1{,}250 = 3{,}750$ ล้านปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.geologic-history-maps.p011
    topics: [earthscience.geology.geologic-history-maps]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ซากดึกดำบรรพ์ดัชนีที่ดีควรมีลักษณะใด (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "พบได้มาก", correct: true }
      - { id: b, text: "กระจายอยู่ในพื้นที่กว้าง", correct: true }
      - { id: c, text: "สิ่งมีชีวิตชนิดนั้นมีชีวิตอยู่ในช่วงเวลาสั้นทางธรณีวิทยา", correct: true }
      - { id: d, text: "สิ่งมีชีวิตชนิดนั้นยังมีชีวิตอยู่ตั้งแต่อดีตถึงปัจจุบัน", feedback: "ชนิดที่อยู่มานานมากไม่ช่วยบอกอายุ เพราะพบได้ในชั้นหินหลายช่วงเวลา" }
    hints:
      - "ต้องหาได้ง่ายในหลายที่"
      - "ถ้าอยู่มานานหลายร้อยล้านปี จะบอกช่วงเวลาได้แคบหรือกว้าง"
    solution: "ซากดึกดำบรรพ์ดัชนีต้องพบมาก กระจายกว้าง และมีชีวิตช่วงสั้น จึงใช้ระบุช่วงเวลาได้แคบและเทียบชั้นหินต่างพื้นที่ได้ เช่น แอมโมไนต์ ไทรโลไบต์ ฟิวซูลินิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.geologic-history-maps.p012
    topics: [earthscience.geology.geologic-history-maps]
    difficulty: 4
    type: numeric
    stem: "จากแผนที่ภูมิประเทศเดิม ระยะทางราบบนพื้นจริงจากจุด ข ถึงจุด ก คือ 600 m ความชันเฉลี่ยระหว่างสองจุดนี้ (ผลต่างความสูง ÷ ระยะทางราบ) มีค่าเท่าใด"
    figure: { src: p-contour.svg, alt: "แผนที่เส้นชั้นความสูงของเนินเขารูปรี ช่วงชั้นความสูง 100 m เส้นวงนอกสุด 200 m ถัดเข้าไป 300 400 500 และวงในสุด 600 m ยอดเนินอยู่ในวง 600 m ด้านตะวันตกเส้นชั้นความสูงอยู่ชิดกัน ด้านตะวันออกเส้นห่างกันมาก จุด ข อยู่บนเส้น 200 m ทางตะวันตก จุด ก อยู่บนเส้น 500 m ทางตะวันตก จุด ค อยู่บนเส้น 200 m ทางตะวันออก ทิศเหนืออยู่ด้านบน" }
    answer: { value: 0.5, tolerance: 0.01 }
    misconceptions:
      - { match: 2, feedback: "หารกลับด้าน ความชัน = ผลต่างความสูง ÷ ระยะทางราบ" }
      - { match: 0.83, feedback: "ใช้ความสูงของจุด ก (500 m) แทนผลต่างความสูง ต้องใช้ 500 − 200" }
    hints:
      - "ผลต่างความสูงระหว่าง ก กับ ข อ่านจากเส้นชั้นความสูง"
      - "หารด้วยระยะทางราบ 600 m"
    solution: "ผลต่างความสูง $500 - 200 = 300$ m ความชัน $= 300 \\div 600 = 0.5$ คือทุก 2 m ตามแนวราบ สูงขึ้น 1 m (มุมราว 27°)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.geologic-history-maps.p013
    topics: [earthscience.geology.geologic-history-maps]
    difficulty: 4
    type: mcq
    stem: "ชั้นหินทรายที่มีกระดูกไดโนเสาร์ถูกประกบด้วยชั้นเถ้าภูเขาไฟ ชั้นเถ้าด้านล่างอายุ 132 ล้านปี ชั้นเถ้าด้านบนอายุ 128 ล้านปี (ข้อมูลสมมติ ชั้นหินไม่ถูกพลิกกลับ) ข้อใดสรุปอายุของกระดูกได้ถูกต้องที่สุด"
    choices:
      - { id: a, text: "อายุระหว่าง 128 ถึง 132 ล้านปี", correct: true }
      - { id: b, text: "อายุ 130 ล้านปีพอดี", feedback: "หลักฐานบอกได้เพียงช่วงอายุ ค่ากลางไม่ใช่คำตอบที่แน่นอน" }
      - { id: c, text: "อายุมากกว่า 132 ล้านปี", feedback: "ชั้นกระดูกอยู่บนชั้นเถ้า 132 ล้านปี จึงเกิดทีหลัง อายุน้อยกว่า 132 ล้านปี" }
      - { id: d, text: "อายุน้อยกว่า 128 ล้านปี", feedback: "ชั้นกระดูกอยู่ใต้ชั้นเถ้า 128 ล้านปี จึงเกิดก่อน อายุมากกว่า 128 ล้านปี" }
    hints:
      - "ชั้นที่อยู่บนชั้นเถ้า 132 ล้านปี ต้องอายุน้อยกว่าหรือมากกว่า 132"
      - "ใช้กฎการลำดับชั้นหินร่วมกับอายุสัมบูรณ์"
    solution: "ชั้นกระดูกอยู่เหนือเถ้า 132 ล้านปี จึงอ่อนกว่า และอยู่ใต้เถ้า 128 ล้านปี จึงแก่กว่า อายุจึงอยู่ระหว่าง 128 ถึง 132 ล้านปี เป็นการใช้อายุสัมพัทธ์ร่วมกับอายุสัมบูรณ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.geologic-history-maps.p014
    topics: [earthscience.geology.geologic-history-maps]
    difficulty: 4
    type: mcq
    stem: "หินที่เก่าที่สุดที่พบบนโลกมีอายุราว 4,000 ล้านปี แต่นักวิทยาศาสตร์สรุปว่าโลกมีอายุราว 4,600 ล้านปี หลักฐานใดใช้สนับสนุนข้อสรุปนี้"
    choices:
      - { id: a, text: "อุกกาบาตซึ่งเกิดพร้อมระบบสุริยะมีอายุราว 4,570 ล้านปี และหินบนดวงจันทร์อายุถึงราว 4,500 ล้านปี", correct: true }
      - { id: b, text: "นับชั้นตะกอนทั้งหมดบนโลกแล้วรวมเวลา", feedback: "ชั้นตะกอนถูกกร่อนและหายไปหลายช่วง นับรวมแล้วจะได้อายุน้อยเกินไปมาก" }
      - { id: c, text: "ใช้คาร์บอน-14 หาอายุหินที่เก่าที่สุด", feedback: "คาร์บอน-14 ใช้ได้ไม่เกินราว 50,000 ปี" }
      - { id: d, text: "หินบนโลกหายไปเพราะอุกกาบาตชนเท่านั้น", feedback: "หินเก่าส่วนใหญ่หายไปเพราะแผ่นธรณีมุดตัวและการกร่อน ข้อนี้ไม่ได้เป็นหลักฐานของอายุโลก" }
    hints:
      - "ทำไมโลกจึงเหลือหินเก่ามากน้อย"
      - "วัตถุใดในระบบสุริยะเกิดพร้อมโลกและไม่ถูกทำลาย"
    solution: "บนโลก แผ่นธรณีมุดตัวและการกร่อนทำลายหินเก่าไปเกือบหมด จึงต้องใช้วัตถุที่เกิดพร้อมกันและเปลี่ยนแปลงน้อย คืออุกกาบาต (ราว 4,570 ล้านปี) และหินดวงจันทร์ (ถึงราว 4,500 ล้านปี) ร่วมกับแร่เซอร์คอนอายุราว 4,400 ล้านปีบนโลก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.geologic-history-maps.p015
    topics: [earthscience.geology.geologic-history-maps]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "จังหวัดหนึ่งในภาคเหนือวางแผนสร้างเขื่อนเก็บน้ำ แผนที่ใดช่วยในการตัดสินใจ และใช้อย่างไร (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "แผนที่ภูมิประเทศ ใช้หาหุบเขาแคบที่ปิดกั้นได้ และประเมินพื้นที่ที่น้ำจะท่วมหลังเขื่อน", correct: true }
      - { id: b, text: "แผนที่ธรณีวิทยาของกรมทรัพยากรธรณี ใช้หลีกเลี่ยงรอยเลื่อนมีพลังและหินที่ไม่แข็งแรง", correct: true }
      - { id: c, text: "แผนที่ธรณีวิทยา ใช้ดูว่ามีหินปูนที่อาจเป็นโพรงทำให้น้ำรั่วหรือไม่", correct: true }
      - { id: d, text: "แผนที่ดาว ใช้เลือกวันเริ่มก่อสร้าง", feedback: "แผนที่ดาวใช้หากลุ่มดาว ไม่เกี่ยวกับการเลือกที่ตั้งเขื่อน" }
    hints:
      - "เขื่อนต้องอยู่ในที่ที่รูปร่างพื้นที่เหมาะ"
      - "เขื่อนต้องตั้งบนหินที่แข็งแรงและไม่มีรอยเลื่อนที่อาจขยับ"
    solution: "แผนที่ภูมิประเทศบอกรูปร่างหุบเขาและพื้นที่น้ำท่วม แผนที่ธรณีวิทยาบอกชนิดหิน รอยเลื่อน และหินปูนที่อาจมีโพรง ซึ่งสำคัญต่อความปลอดภัยและการเก็บน้ำของเขื่อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.geologic-history-maps.p016
    topics: [earthscience.geology.geologic-history-maps]
    difficulty: 5
    type: numeric
    stem: "ถ้าย่อประวัติโลก 4,600 ล้านปีให้เป็น 24 ชั่วโมง โดยโลกเกิดตอนเที่ยงคืนต้นวันและปัจจุบันคือเที่ยงคืนท้ายวัน ไดโนเสาร์ที่ไม่ใช่นกสูญพันธุ์เมื่อ 66 ล้านปีก่อน ตรงกับกี่นาทีก่อนเที่ยงคืนท้ายวัน"
    answer: { value: 20.7, tolerance: 0.3, unit: นาที }
    misconceptions:
      - { match: 0.34, feedback: "0.34 คือคำตอบในหน่วยชั่วโมง ต้องคูณ 60" }
      - { match: 1.43, feedback: "1.43 คือร้อยละของประวัติโลก ต้องคูณกับเวลา 24 ชั่วโมงเป็นนาที" }
    hints:
      - "66 ล้านปีคิดเป็นสัดส่วน $\\dfrac{66}{4{,}600}$ ของประวัติโลก"
      - "24 ชั่วโมง = 1,440 นาที"
    solution: "$\\dfrac{66}{4{,}600} \\times 1{,}440 \\approx 20.7$ นาที ไดโนเสาร์สูญพันธุ์ราว 23.39 น. และมนุษย์ปัจจุบัน (ราว 0.3 ล้านปี) ปรากฏเพียงราว 6 วินาทีสุดท้าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.geologic-history-maps.p017
    topics: [earthscience.geology.geologic-history-maps]
    difficulty: 5
    type: mcq
    stem: "หินเหล็กแถบซึ่งเป็นชั้นเหล็กออกไซด์สลับกับชั้นซิลิกาพบมากในหินอายุราว 2,500–1,800 ล้านปี และแทบไม่พบในหินที่อายุน้อยกว่านั้น ข้อใดอธิบายหลักฐานนี้ได้ดีที่สุด"
    choices:
      - { id: a, text: "ออกซิเจนจากสิ่งมีชีวิตสังเคราะห์ด้วยแสงทำให้เหล็กที่ละลายในทะเลตกตะกอน เมื่อเหล็กในทะเลหมด ออกซิเจนจึงสะสมในอากาศ", correct: true }
      - { id: b, text: "ภูเขาไฟหยุดปะทุหลัง 1,800 ล้านปีก่อน", feedback: "ภูเขาไฟยังปะทุจนถึงปัจจุบัน ข้อนี้ไม่ได้อธิบายการหายไปของหินเหล็กแถบ" }
      - { id: c, text: "เหล็กทั้งหมดของโลกจมลงแก่นโลกเมื่อ 1,800 ล้านปีก่อน", feedback: "แก่นโลกเกิดตั้งแต่ยุคแรกของโลก และหินปัจจุบันก็ยังมีเหล็ก" }
      - { id: d, text: "สิ่งมีชีวิตยังไม่เกิดจนถึง 1,800 ล้านปีก่อน", feedback: "มีหลักฐานสิ่งมีชีวิตตั้งแต่ราว 3,500 ล้านปีก่อน และออกซิเจนเริ่มสะสมราว 2,400 ล้านปีก่อน" }
    hints:
      - "เหล็กละลายในน้ำที่ไม่มีออกซิเจน แต่ตกตะกอนเมื่อพบออกซิเจน"
      - "ออกซิเจนมาจากกระบวนการของสิ่งมีชีวิตใด"
    solution: "สิ่งมีชีวิตสังเคราะห์ด้วยแสงปล่อยออกซิเจนลงทะเล ทำปฏิกิริยากับเหล็กที่ละลายอยู่เป็นเหล็กออกไซด์ตกตะกอนเป็นชั้น เมื่อเหล็กละลายในทะเลลดลง ออกซิเจนจึงสะสมในอากาศได้ เป็นหลักฐานว่าสิ่งมีชีวิตเปลี่ยนบรรยากาศและมหาสมุทร และการเปลี่ยนนี้ก็ส่งผลกลับต่อสิ่งมีชีวิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.geologic-history-maps.p018
    topics: [earthscience.geology.geologic-history-maps]
    difficulty: 5
    type: mcq
    stem: "ในภาพตัดขวางตัวอย่างของบทเรียน ชั้น ก ข ค เอียงและถูกตัดด้วยผิวกร่อน แล้วมีชั้น ง และ จ วางทับในแนวราบ ผิวกร่อนนี้บอกอะไรเกี่ยวกับประวัติของพื้นที่"
    figure: { src: cross-section-example.svg, alt: "ภาพตัดขวาง ชั้นล่างสามชั้นเอียง คือ ก หินดินดาน ข หินทราย และ ค หินปูน ถูกตัดด้านบนด้วยเส้นหยักสีแดงเข้ม เขียนว่า ผิวกร่อน ความไม่ต่อเนื่อง เหนือขึ้นไปเป็นชั้นแนวราบ ง หินทราย และ จ หินกรวดมน หินอัคนี ฉ แทรกตัดชั้น ก ข ค แต่สิ้นสุดที่ผิวกร่อน ไม่ตัดชั้น ง" }
    choices:
      - { id: a, text: "ชั้น ก ข ค ถูกแรงทำให้เอียงและถูกยกขึ้นมากร่อน มีช่วงเวลาที่ไม่มีชั้นหินบันทึกไว้ ก่อนจะจมลงให้ชั้น ง ทับถม", correct: true }
      - { id: b, text: "ชั้น ง และ จ เกิดก่อนชั้น ก ข ค", feedback: "ชั้น ง และ จ อยู่บนผิวกร่อนที่ตัดชั้น ก ข ค จึงเกิดทีหลัง" }
      - { id: c, text: "ตะกอนทับถมต่อเนื่องโดยไม่มีช่วงหยุด", feedback: "ผิวกร่อนแสดงว่ามีช่วงที่หินถูกกร่อนหายไป ไม่ได้ทับถมต่อเนื่อง" }
      - { id: d, text: "ตะกอนชั้น ก ข ค ทับถมเป็นชั้นเอียงตั้งแต่แรก", feedback: "ตามหลักการวางตัวในแนวราบ ตะกอนทับถมในแนวราบ ชั้นที่เอียงจึงถูกแรงกระทำภายหลัง" }
    hints:
      - "ชั้นเอียงบอกอะไรตามหลักการวางตัวในแนวราบ"
      - "การกร่อนเกิดเมื่อหินอยู่ที่ผิวโลก"
    solution: "ชั้น ก ข ค ทับถมในแนวราบ ถูกแรงทำให้เอียง และถูกยกขึ้นจนกร่อน (หินอัคนี ฉ แทรกก่อนการกร่อนเพราะถูกผิวกร่อนตัด) จากนั้นพื้นที่ลดระดับลงให้ชั้น ง และ จ ทับถม ช่วงเวลาที่หินถูกกร่อนหายไปไม่มีชั้นหินบันทึกไว้ เรียกว่าความไม่ต่อเนื่องของชั้นหิน"
    license: CC-BY-SA-4.0
    ai_assisted: true
