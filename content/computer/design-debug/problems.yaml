problems:
  - id: computer.programming.design-debug.p001
    topics: [computer.programming.design-debug]
    difficulty: 1
    type: mcq
    stem: "โปรแกรมตู้กดน้ำต้องมีตัวแปรเก็บ **จำนวนขวดน้ำที่เหลือในตู้** ชื่อตัวแปรใดดีที่สุด"
    choices:
      - { id: a, text: "bottles_left", correct: true }
      - { id: b, text: "x", feedback: "สั้นแต่ไม่บอกความหมาย คนอ่านต้องเดาว่าเก็บอะไร" }
      - { id: c, text: "a1", feedback: "ไม่บอกว่าเก็บข้อมูลอะไร ถ้ามี a2, a3 จะสับสนง่าย" }
      - { id: d, text: "data", feedback: "กว้างเกินไป ทุกตัวแปรก็เก็บข้อมูล ไม่บอกว่าเป็นข้อมูลอะไร" }
    hints:
      - "ชื่อตัวแปรที่ดีบอกว่าเก็บอะไร"
      - "อ่านชื่อแล้วรู้ทันทีหรือไม่ว่าคือจำนวนขวดที่เหลือ"
    solution: "bottles_left บอกชัดว่าเก็บจำนวนขวดที่เหลือ คนอ่านโค้ดเข้าใจได้โดยไม่ต้องเดา ชื่อที่ชัดยังช่วยให้หาบั๊กง่ายขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.design-debug.p002
    topics: [computer.programming.design-debug]
    difficulty: 1
    type: match
    stem: "โปรแกรมรับสมัครค่ายรับเฉพาะเด็กอายุ 7 ถึง 12 ปี จับคู่ข้อมูลทดสอบกับชนิดของกรณีทดสอบ"
    pairs:
      - { left: "อายุ 10", right: "ค่าปกติ" }
      - { left: "อายุ 12", right: "ค่าขอบ" }
      - { left: "อายุ \"สิบ\" (พิมพ์เป็นตัวอักษร)", right: "ค่าผิดรูป" }
    hints:
      - "ค่าขอบอยู่บนรอยต่อของช่วงพอดี"
      - "ค่าผิดรูปคือข้อมูลที่ไม่ควรเกิด เช่น ตัวอักษรในช่องตัวเลข"
    solution: "10 อยู่กลางช่วง = ค่าปกติ, 12 อยู่บนขอบบนของช่วง = ค่าขอบ, \"สิบ\" เป็นตัวอักษรในช่องตัวเลข = ค่าผิดรูป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.design-debug.p003
    topics: [computer.programming.design-debug]
    difficulty: 2
    type: numeric
    stem: "เมื่อรันโปรแกรมบล็อกในภาพ ตัวละครปั๊มดาวทั้งหมดกี่ดวง"
    figure:
      src: nested-stamp.svg
      alt: "โปรแกรมบล็อก เมื่อกดปุ่มเริ่ม ต่อด้วย ทำซ้ำ 3 ครั้ง ข้างในมี ทำซ้ำ 4 ครั้ง ซึ่งข้างในมี ปั๊มดาว และ เดินหน้า 1 ช่อง ต่อจากวงวนชั้นในคือ เลี้ยวขวา ที่ยังอยู่ในวงวน ทำซ้ำ 3 ครั้ง"
    answer: { value: 12, unit: ดวง }
    hints:
      - "บล็อกปั๊มดาวอยู่ในวงวนชั้นใด"
      - "วงในทำครบ 4 รอบทุกครั้งที่วงนอกทำ 1 รอบ"
    misconceptions:
      - { match: 7, feedback: "บวกจำนวนรอบ 3 + 4 แต่วงวนซ้อนต้องคูณ" }
      - { match: 4, feedback: "4 คือดาวจากวงนอกรอบเดียว วงนอกทำซ้ำ 3 รอบ" }
    solution: "ปั๊มดาวอยู่ในวงใน ซึ่งทำ 4 ครั้งต่อวงนอก 1 รอบ วงนอกมี 3 รอบ จึงปั๊ม 3 × 4 = 12 ดวง (เลี้ยวขวาอยู่นอกวงใน จึงทำ 3 ครั้ง)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.design-debug.p004
    topics: [computer.programming.design-debug]
    difficulty: 2
    type: mcq
    stem: |
      พิพิธภัณฑ์แห่งหนึ่งใช้โปรแกรมนี้ตัดสินว่าใครเข้าชมฟรี ผู้เข้าชมอายุเท่าใด **ต้องเสียเงิน**

      ```python
      if age < 6 or age >= 60:
          print("เข้าฟรี")
      else:
          print("ซื้อบัตร")
      ```
    choices:
      - { id: a, text: "6 ปี", correct: true }
      - { id: b, text: "5 ปี", feedback: "5 < 6 เป็นจริง เงื่อนไข or จริงเพียงข้อเดียวก็พอ จึงเข้าฟรี" }
      - { id: c, text: "60 ปี", feedback: "60 >= 60 เป็นจริง จึงเข้าฟรี" }
      - { id: d, text: "72 ปี", feedback: "72 >= 60 เป็นจริง จึงเข้าฟรี" }
    hints:
      - "or จะจริงเมื่อเงื่อนไขข้อใดข้อหนึ่งจริง"
      - "ลองแทนค่าทีละตัวเลือก ระวังค่าที่อยู่บนขอบ"
    solution: "อายุ 6: 6 < 6 เท็จ และ 6 >= 60 เท็จ ทั้งสองข้อเท็จ จึงไป else ต้องซื้อบัตร ส่วน 5, 60 และ 72 ทำให้เงื่อนไขข้อใดข้อหนึ่งจริง จึงเข้าฟรี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.design-debug.p005
    topics: [computer.programming.design-debug]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการดีบักอย่างเป็นระบบ"
    items:
      - "หาข้อมูลเข้าที่ทำให้โปรแกรมผิดได้ทุกครั้ง"
      - "เทียบผลที่คาดกับผลที่ได้จริง"
      - "ไล่ค่าตัวแปรหรือแทรก print หาบรรทัดแรกที่ค่าเริ่มผิด"
      - "แก้ทีละจุดตามสมมติฐาน"
      - "รันกรณีทดสอบทั้งหมดซ้ำ"
    hints:
      - "ต้องทำให้บั๊กเกิดซ้ำได้ก่อน จึงจะตรวจได้ว่าแก้สำเร็จหรือไม่"
      - "ขั้นสุดท้ายตรวจว่าการแก้ไม่ทำให้ส่วนอื่นพัง"
    solution: "ทำให้เกิดซ้ำ → เทียบผลที่คาดกับผลจริง → จำกัดวงหาบรรทัดที่ผิด → แก้ทีละจุด → ทดสอบซ้ำทั้งหมด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.design-debug.p006
    topics: [computer.programming.design-debug]
    difficulty: 2
    type: mcq
    stem: "บรรทัด `price = 10` ในโปรแกรมตู้กดน้ำ ควรมีคอมเมนต์แบบใด"
    choices:
      - { id: a, text: "# ราคาตามป้ายหน้าตู้ ถ้าเปลี่ยนราคาให้แก้ที่นี่ที่เดียว", correct: true }
      - { id: b, text: "# ตั้ง price เท่ากับ 10", feedback: "แปลโค้ดซ้ำ ผู้อ่านเห็นอยู่แล้วว่า price = 10 ไม่ได้ข้อมูลเพิ่ม" }
      - { id: c, text: "# ตัวแปร", feedback: "ไม่บอกอะไรเลย" }
      - { id: d, text: "ไม่ต้องมีคอมเมนต์ในโปรแกรมใดเลย", feedback: "คอมเมนต์ที่บอกเหตุผลช่วยให้คนอื่นและตัวเราในอนาคตเข้าใจและแก้โปรแกรมได้ง่าย" }
    hints:
      - "คอมเมนต์ที่ดีอธิบายสิ่งที่อ่านจากโค้ดเฉย ๆ ไม่ได้"
      - "ข้อใดบอกที่มาหรือเหตุผล"
    solution: "คอมเมนต์ที่ดีบอกเหตุผลและวิธีใช้ คือราคานี้มาจากป้ายและให้แก้ที่จุดนี้จุดเดียว ไม่ใช่แปลโค้ดซ้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.design-debug.p007
    topics: [computer.programming.design-debug]
    difficulty: 3
    type: numeric
    stem: |
      เมื่อรันโปรแกรมนี้ ค่า total ที่พิมพ์ออกมาคือเท่าใด

      ```python
      total = 0
      for i in range(1, 4):
          for j in range(i):
              total = total + 1
      print(total)
      ```
    answer: { value: 6 }
    hints:
      - "วงนอกมี i = 1, 2, 3 วงในทำ i รอบในแต่ละครั้ง"
      - "นับว่าในแต่ละรอบของ i บรรทัด total = total + 1 ทำกี่ครั้ง"
    misconceptions:
      - { match: 9, feedback: "คิดว่าวงในทำ 3 รอบทุกครั้ง แต่ range(i) เปลี่ยนตาม i จึงทำ 1, 2, 3 รอบ" }
      - { match: 3, feedback: "นับแค่รอบของวงนอก ต้องนับทุกครั้งที่วงในทำงาน" }
    solution: "i = 1: วงในทำ 1 ครั้ง, i = 2: 2 ครั้ง, i = 3: 3 ครั้ง รวม 1 + 2 + 3 = 6"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.design-debug.p008
    topics: [computer.programming.design-debug]
    difficulty: 3
    type: mcq
    stem: "โปรแกรมรับคะแนนสอบที่ถูกต้องตั้งแต่ 50 ถึง 100 (คะแนนผ่าน) ข้อมูลทดสอบชุดใดตรวจ **ค่าขอบ** ได้ครบที่สุด"
    choices:
      - { id: a, text: "49, 50, 100, 101", correct: true }
      - { id: b, text: "60, 70, 80, 90", feedback: "เป็นค่าปกติทั้งหมด ไม่มีค่าบนรอยต่อเลย" }
      - { id: c, text: "50, 100", feedback: "มีค่าบนขอบ แต่ขาดค่าที่อยู่นอกขอบติดกัน จึงจับบั๊กแบบรับค่าเกินช่วงไม่ได้" }
      - { id: d, text: "0, 1000", feedback: "อยู่ไกลจากขอบมาก ถ้าเขียน > แทน >= จะจับไม่ได้" }
    hints:
      - "ขอบมีสองด้าน คือ 50 และ 100"
      - "ทดสอบทั้งค่าบนขอบและค่าที่ติดกันฝั่งนอก"
    solution: "ชุด 49, 50, 100, 101 ทดสอบทั้งสองขอบ ทั้งค่าที่ควรผ่าน (50, 100) และค่าที่ติดกันซึ่งไม่ควรผ่าน (49, 101) บั๊กอย่างใช้ > แทน >= จะปรากฏทันที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.design-debug.p009
    topics: [computer.programming.design-debug]
    difficulty: 3
    type: mcq
    stem: "เกมเก็บเหรียญควรพูดว่า \"ชนะแล้ว!\" เมื่อเก็บครบ **10 เหรียญ** ผู้ทดสอบควรใช้กรณีทดสอบใดจึงจะเห็นบั๊กของโปรแกรมในภาพชัดที่สุด"
    figure:
      src: coin-game.svg
      alt: "โปรแกรมบล็อก เมื่อตัวละครแตะเหรียญ ต่อด้วย เปลี่ยน คะแนน ทีละ 1 แล้ว ถ้า คะแนน มากกว่า 10 แล้ว ข้างในมี พูด ชนะแล้ว!"
    choices:
      - { id: a, text: "เก็บเหรียญให้ได้ 10 เหรียญพอดี แล้วดูว่าพูด \"ชนะแล้ว!\" หรือไม่", correct: true }
      - { id: b, text: "เก็บ 3 เหรียญ", feedback: "ทั้งโปรแกรมที่ถูกและผิดจะไม่พูดอะไร จึงแยกไม่ออก" }
      - { id: c, text: "เก็บ 20 เหรียญ", feedback: "โปรแกรมพูดว่าชนะแล้วตอนเหรียญที่ 11 ถ้าดูแค่ตอนจบอาจไม่เห็นว่าช้าไปหนึ่งเหรียญ" }
      - { id: d, text: "ไม่ต้องทดสอบ เพราะบล็อกเรียงถูกลำดับแล้ว", feedback: "ลำดับถูกแต่เงื่อนไขอาจผิด ต้องทดสอบที่ค่าขอบเสมอ" }
    hints:
      - "บั๊กที่เงื่อนไขมักเห็นได้ที่ค่าขอบ"
      - "เมื่อคะแนนเป็น 10 พอดี เงื่อนไข คะแนน > 10 เป็นจริงหรือเท็จ"
    solution: "ที่ 10 เหรียญ เงื่อนไข 10 > 10 เป็นเท็จ จึงไม่พูดว่าชนะ ทั้งที่ควรพูด การทดสอบค่าขอบ 10 เหรียญจึงเห็นบั๊กทันที แก้โดยเปลี่ยนเป็น คะแนน = 10 หรือ คะแนน ≥ 10"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.design-debug.p010
    topics: [computer.programming.design-debug]
    difficulty: 3
    type: numeric
    stem: |
      ต้นตั้งใจเขียนโปรแกรมหาผลบวก 1 + 2 + … + 10 แต่ได้คำตอบไม่ตรงกับที่คิดในใจ โปรแกรมนี้พิมพ์ค่าใดออกมาจริง

      ```python
      total = 0
      for n in range(1, 10):
          total = total + n
      print(total)
      ```
    answer: { value: 45 }
    hints:
      - "range(1, 10) ให้ค่า n ใดบ้าง"
      - "range ไม่รวมตัวเลขตัวสุดท้าย"
    misconceptions:
      - { match: 55, feedback: "55 คือคำตอบที่ต้นตั้งใจ แต่ range(1, 10) หยุดที่ 9 จึงไม่ได้บวก 10" }
      - { match: 10, feedback: "10 คือค่า n ตัวสุดท้ายที่คิดว่ามี แต่โจทย์ถามผลบวก และ n ไม่ถึง 10" }
    solution: "range(1, 10) ให้ n = 1 ถึง 9 ผลบวก = 45 ไม่ใช่ 55 ต้องแก้เป็น range(1, 11) การเทียบผลที่ได้ (45) กับผลที่คาด (55) ทำให้รู้ว่าขาดไป 10 พอดี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.design-debug.p011
    topics: [computer.programming.design-debug]
    difficulty: 3
    type: numeric
    stem: |
      เกมตอบคำถามจังหวัดของไทยมีสองสคริปต์ ผู้เล่นกดปุ่มเริ่ม แล้วกดปุ่มถูก 4 ครั้ง และกดปุ่มผิด 1 ครั้ง คะแนนสุดท้ายเป็นเท่าใด

      ```
      เมื่อกดปุ่มเริ่ม:      ตั้ง คะแนน เป็น 0
      เมื่อกดปุ่มถูก:        เปลี่ยน คะแนน ทีละ 2
      เมื่อกดปุ่มผิด:        เปลี่ยน คะแนน ทีละ −1
      ```
    answer: { value: 7, unit: คะแนน }
    hints:
      - "แต่ละเหตุการณ์ทำงานทุกครั้งที่เกิด"
      - "เริ่มจาก 0 แล้วบวกลบตามจำนวนครั้งที่กดแต่ละปุ่ม"
    misconceptions:
      - { match: 8, feedback: "ลืมเหตุการณ์กดปุ่มผิดซึ่งลดคะแนน 1" }
      - { match: 3, feedback: "นับปุ่มถูกครั้งละ 1 คะแนน แต่สคริปต์เพิ่มครั้งละ 2" }
    solution: "เริ่ม 0 กดถูก 4 ครั้ง: 4 × 2 = 8 กดผิด 1 ครั้ง: −1 คะแนนสุดท้าย 8 − 1 = 7"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.design-debug.p012
    topics: [computer.programming.design-debug]
    difficulty: 4
    type: mcq
    stem: |
      ตู้กดน้ำปล่อยน้ำแม้ผู้ใช้หยอดเงินไม่พอ ในกรณีที่ตู้ยังมีน้ำ โค้ดส่วนนี้ผิดที่ใด

      ```python
      if money >= price or bottles_left > 0:
          give_water()
          money = money - price
          bottles_left = bottles_left - 1
      ```
    choices:
      - { id: a, text: "ต้องเปลี่ยน or เป็น and เพราะต้องมีเงินพอ และ ต้องมีน้ำ จึงปล่อยน้ำ", correct: true }
      - { id: b, text: "ต้องเปลี่ยน >= เป็น >", feedback: "จะทำให้เงินที่พอดีกับราคาซื้อไม่ได้ ยังไม่แก้ปัญหาเงินไม่พอ" }
      - { id: c, text: "ต้องสลับบรรทัด give_water() ไปไว้ท้ายสุด", feedback: "ลำดับในบล็อกไม่ใช่สาเหตุ ปัญหาอยู่ที่เงื่อนไขซึ่งให้ผ่านทั้งที่เงินไม่พอ" }
      - { id: d, text: "ต้องลบบรรทัด bottles_left = bottles_left - 1", feedback: "บรรทัดนี้ถูกต้อง ต้องลดจำนวนขวดหลังปล่อยน้ำ" }
    hints:
      - "ลองแทน money = 5, price = 10, bottles_left = 3 แล้วดูว่าเงื่อนไขเป็นจริงหรือเท็จ"
      - "or จริงเมื่อข้อใดข้อหนึ่งจริง"
    solution: "เมื่อเงินไม่พอแต่มีน้ำ: money >= price เท็จ แต่ bottles_left > 0 จริง เงื่อนไข or จึงจริงและปล่อยน้ำ ต้องใช้ and เพื่อให้ปล่อยน้ำเฉพาะเมื่อจริงทั้งสองข้อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

