strands:
  - id: ว1
    title: "วิทยาศาสตร์ชีวภาพ"
    standards:
      - id: "ว 1.1"
        text: "เข้าใจความหลากหลายของระบบนิเวศ ความสัมพันธ์ระหว่างสิ่งไม่มีชีวิตกับสิ่งมีชีวิต และความสัมพันธ์ระหว่างสิ่งมีชีวิตกับสิ่งมีชีวิตต่าง ๆ ในระบบนิเวศ การถ่ายทอดพลังงาน การเปลี่ยนแปลงแทนที่ในระบบนิเวศ ความหมายของประชากร ปัญหาและผลกระทบที่มีต่อทรัพยากรธรรมชาติและสิ่งแวดล้อม แนวทางในการอนุรักษ์ทรัพยากรธรรมชาติและการแก้ไขปัญหาสิ่งแวดล้อม รวมทั้งนำความรู้ไปใช้ประโยชน์"
        indicators:
          - { id: "ว 1.1 ป.1/1", level: ป.1, text: "ระบุชื่อพืชและสัตว์ที่อาศัยอยู่บริเวณต่าง ๆ จากข้อมูลที่รวบรวมได้" }
          - { id: "ว 1.1 ป.1/2", level: ป.1, text: "บอกสภาพแวดล้อมที่เหมาะสมกับการดำรงชีวิตของสัตว์ในบริเวณที่อาศัยอยู่" }
          - { id: "ว 1.1 ป.5/1", level: ป.5, text: "บรรยายโครงสร้างและลักษณะของสิ่งมีชีวิตที่เหมาะสมกับการดำรงชีวิต ซึ่งเป็นผลมาจากการปรับตัวของสิ่งมีชีวิตในแต่ละแหล่งที่อยู่" }
          - { id: "ว 1.1 ป.5/2", level: ป.5, text: "อธิบายความสัมพันธ์ระหว่างสิ่งมีชีวิตกับสิ่งมีชีวิต และความสัมพันธ์ระหว่างสิ่งมีชีวิตกับสิ่งไม่มีชีวิต เพื่อประโยชน์ต่อการดำรงชีวิต" }
          - { id: "ว 1.1 ป.5/3", level: ป.5, text: "เขียนโซ่อาหารและระบุบทบาทหน้าที่ของสิ่งมีชีวิตที่เป็นผู้ผลิตและผู้บริโภคในโซ่อาหาร" }
          - { id: "ว 1.1 ป.5/4", level: ป.5, text: "ตระหนักในคุณค่าของสิ่งแวดล้อมที่มีต่อการดำรงชีวิตของสิ่งมีชีวิต โดยมีส่วนร่วมในการดูแลรักษาสิ่งแวดล้อม" }
          - { id: "ว 1.1 ม.3/1", level: ม.3, text: "อธิบายปฏิสัมพันธ์ขององค์ประกอบของระบบนิเวศที่ได้จากการสำรวจ" }
          - { id: "ว 1.1 ม.3/2", level: ม.3, text: "อธิบายรูปแบบความสัมพันธ์ระหว่างสิ่งมีชีวิตกับสิ่งมีชีวิตรูปแบบต่าง ๆ ในแหล่งที่อยู่เดียวกัน ที่ได้จากการสำรวจ" }
          - { id: "ว 1.1 ม.3/3", level: ม.3, text: "สร้างแบบจำลองในการอธิบายการถ่ายทอดพลังงานในสายใยอาหาร" }
          - { id: "ว 1.1 ม.3/4", level: ม.3, text: "อธิบายความสัมพันธ์ของผู้ผลิต ผู้บริโภค และผู้ย่อยสลายสารอินทรีย์ในระบบนิเวศ" }
          - { id: "ว 1.1 ม.3/5", level: ม.3, text: "อธิบายการสะสมสารพิษในสิ่งมีชีวิตในโซ่อาหาร" }
          - { id: "ว 1.1 ม.3/6", level: ม.3, text: "ตระหนักถึงความสัมพันธ์ของสิ่งมีชีวิต และสิ่งแวดล้อมในระบบนิเวศ โดยไม่ทำลายสมดุลของระบบนิเวศ" }
          - { id: "ว 1.1 ม.4/1", level: ม.4, text: "สืบค้นข้อมูลและอธิบายความสัมพันธ์ของสภาพทางภูมิศาสตร์บนโลกกับความหลากหลายของไบโอม และยกตัวอย่างไบโอมชนิดต่าง ๆ" }
          - { id: "ว 1.1 ม.4/2", level: ม.4, text: "สืบค้นข้อมูล อภิปรายสาเหตุ และยกตัวอย่างการเปลี่ยนแปลงแทนที่ของระบบนิเวศ" }
          - { id: "ว 1.1 ม.4/3", level: ม.4, text: "สืบค้นข้อมูล อธิบายและยกตัวอย่างเกี่ยวกับการเปลี่ยนแปลงขององค์ประกอบทางกายภาพและทางชีวภาพที่มีผลต่อการเปลี่ยนแปลงขนาดของประชากรสิ่งมีชีวิตในระบบนิเวศ" }
          - { id: "ว 1.1 ม.4/4", level: ม.4, text: "สืบค้นข้อมูลและอภิปรายเกี่ยวกับปัญหาและผลกระทบที่มีต่อทรัพยากรธรรมชาติและสิ่งแวดล้อม พร้อมทั้งนำเสนอแนวทางในการอนุรักษ์ทรัพยากรธรรมชาติและการแก้ไขปัญหาสิ่งแวดล้อม" }
      - id: "ว 1.2"
        text: "เข้าใจสมบัติของสิ่งมีชีวิต หน่วยพื้นฐานของสิ่งมีชีวิต การลำเลียงสารเข้าและออกจากเซลล์ ความสัมพันธ์ของโครงสร้างและหน้าที่ของระบบต่าง ๆ ของสัตว์และมนุษย์ที่ทำงานสัมพันธ์กัน ความสัมพันธ์ของโครงสร้างและหน้าที่ของอวัยวะต่าง ๆ ของพืชที่ทำงานสัมพันธ์กัน รวมทั้งนำความรู้ไปใช้ประโยชน์"
        indicators:
          - { id: "ว 1.2 ป.1/1", level: ป.1, text: "ระบุชื่อ บรรยายลักษณะและบอกหน้าที่ของส่วนต่าง ๆ ของร่างกายมนุษย์ สัตว์ และพืช รวมทั้งบรรยายการทำหน้าที่ร่วมกันของส่วนต่าง ๆ ของร่างกายมนุษย์ในการทำกิจกรรมต่าง ๆ จากข้อมูลที่รวบรวมได้" }
          - { id: "ว 1.2 ป.1/2", level: ป.1, text: "ตระหนักถึงความสำคัญของส่วนต่าง ๆ ของร่างกายตนเอง โดยการดูแลส่วนต่าง ๆ อย่างถูกต้อง ให้ปลอดภัย และรักษาความสะอาดอยู่เสมอ" }
          - { id: "ว 1.2 ป.2/1", level: ป.2, text: "ระบุว่าพืชต้องการแสงและน้ำ เพื่อการเจริญเติบโต โดยใช้ข้อมูลจากหลักฐานเชิงประจักษ์" }
          - { id: "ว 1.2 ป.2/2", level: ป.2, text: "ตระหนักถึงความจำเป็นที่พืชต้องได้รับน้ำและแสงเพื่อการเจริญเติบโต โดยดูแลพืชให้ได้รับสิ่งดังกล่าวอย่างเหมาะสม" }
          - { id: "ว 1.2 ป.2/3", level: ป.2, text: "สร้างแบบจำลองที่บรรยายวัฏจักรชีวิตของพืชดอก" }
          - { id: "ว 1.2 ป.3/1", level: ป.3, text: "บรรยายสิ่งที่จำเป็นต่อการดำรงชีวิต และการเจริญเติบโตของมนุษย์และสัตว์ โดยใช้ข้อมูลที่รวบรวมได้" }
          - { id: "ว 1.2 ป.3/2", level: ป.3, text: "ตระหนักถึงประโยชน์ของอาหาร น้ำ และอากาศ โดยการดูแลตนเองและสัตว์ให้ได้รับสิ่งเหล่านี้อย่างเหมาะสม" }
          - { id: "ว 1.2 ป.3/3", level: ป.3, text: "สร้างแบบจำลองที่บรรยายวัฏจักรชีวิตของสัตว์ และเปรียบเทียบวัฏจักรชีวิตของสัตว์บางชนิด" }
          - { id: "ว 1.2 ป.3/4", level: ป.3, text: "ตระหนักถึงคุณค่าของชีวิตสัตว์ โดยไม่ทำให้วัฏจักรชีวิตของสัตว์เปลี่ยนแปลง" }
          - { id: "ว 1.2 ป.4/1", level: ป.4, text: "บรรยายหน้าที่ของราก ลำต้น ใบ และดอกของพืชดอก โดยใช้ข้อมูลที่รวบรวมได้" }
          - { id: "ว 1.2 ป.6/1", level: ป.6, text: "ระบุสารอาหารและบอกประโยชน์ของสารอาหารแต่ละประเภทจากอาหารที่ตนเองรับประทาน" }
          - { id: "ว 1.2 ป.6/2", level: ป.6, text: "บอกแนวทางในการเลือกรับประทานอาหารให้ได้สารอาหารครบถ้วน ในสัดส่วนที่เหมาะสมกับเพศและวัย รวมทั้งความปลอดภัยต่อสุขภาพ" }
          - { id: "ว 1.2 ป.6/3", level: ป.6, text: "ตระหนักถึงความสำคัญของสารอาหาร โดยการเลือกรับประทานอาหารที่มีสารอาหารครบถ้วนในสัดส่วนที่เหมาะสมกับเพศและวัย รวมทั้งปลอดภัยต่อสุขภาพ" }
          - { id: "ว 1.2 ป.6/4", level: ป.6, text: "สร้างแบบจำลองระบบย่อยอาหาร และบรรยายหน้าที่ของอวัยวะในระบบย่อยอาหาร รวมทั้งอธิบายการย่อยอาหารและการดูดซึมสารอาหาร" }
          - { id: "ว 1.2 ป.6/5", level: ป.6, text: "ตระหนักถึงความสำคัญของระบบย่อยอาหาร โดยการบอกแนวทางในการดูแลรักษาอวัยวะในระบบย่อยอาหารให้ทำงานเป็นปกติ" }
          - { id: "ว 1.2 ม.1/1", level: ม.1, text: "เปรียบเทียบรูปร่าง ลักษณะ และโครงสร้างของเซลล์พืชและเซลล์สัตว์ รวมทั้งบรรยายหน้าที่ของผนังเซลล์ เยื่อหุ้มเซลล์ ไซโทพลาซึม นิวเคลียส แวคิวโอล ไมโทคอนเดรีย และคลอโรพลาสต์" }
          - { id: "ว 1.2 ม.1/2", level: ม.1, text: "ใช้กล้องจุลทรรศน์ใช้แสงศึกษาเซลล์และโครงสร้างต่าง ๆ ภายในเซลล์" }
          - { id: "ว 1.2 ม.1/3", level: ม.1, text: "อธิบายความสัมพันธ์ระหว่างรูปร่างกับการทำหน้าที่ของเซลล์" }
          - { id: "ว 1.2 ม.1/4", level: ม.1, text: "อธิบายการจัดระบบของสิ่งมีชีวิต โดยเริ่มจากเซลล์ เนื้อเยื่อ อวัยวะ ระบบอวัยวะ จนเป็นสิ่งมีชีวิต" }
          - { id: "ว 1.2 ม.1/5", level: ม.1, text: "อธิบายกระบวนการแพร่และออสโมซิสจากหลักฐานเชิงประจักษ์ และยกตัวอย่างการแพร่และออสโมซิสในชีวิตประจำวัน" }
          - { id: "ว 1.2 ม.1/6", level: ม.1, text: "ระบุปัจจัยที่จำเป็นในการสังเคราะห์ด้วยแสงและผลผลิตที่เกิดขึ้นจากการสังเคราะห์ด้วยแสง โดยใช้หลักฐานเชิงประจักษ์" }
          - { id: "ว 1.2 ม.1/7", level: ม.1, text: "อธิบายความสำคัญของการสังเคราะห์ด้วยแสงของพืชต่อสิ่งมีชีวิตและสิ่งแวดล้อม" }
          - { id: "ว 1.2 ม.1/8", level: ม.1, text: "ตระหนักในคุณค่าของพืชที่มีต่อสิ่งมีชีวิตและสิ่งแวดล้อม โดยการร่วมกันปลูกและดูแลรักษาต้นไม้ในโรงเรียนและชุมชน" }
          - { id: "ว 1.2 ม.1/9", level: ม.1, text: "บรรยายลักษณะและหน้าที่ของไซเล็มและโฟลเอ็ม" }
          - { id: "ว 1.2 ม.1/10", level: ม.1, text: "เขียนแผนภาพที่บรรยายทิศทางการลำเลียงสารในไซเล็มและโฟลเอ็มของพืช" }
          - { id: "ว 1.2 ม.1/11", level: ม.1, text: "อธิบายการสืบพันธุ์แบบอาศัยเพศ และไม่อาศัยเพศของพืชดอก" }
          - { id: "ว 1.2 ม.1/12", level: ม.1, text: "อธิบายลักษณะโครงสร้างของดอกที่มีส่วนทำให้เกิดการถ่ายเรณู รวมทั้งบรรยายการปฏิสนธิของพืชดอก การเกิดผลและเมล็ด การกระจายเมล็ด และการงอกของเมล็ด" }
          - { id: "ว 1.2 ม.1/13", level: ม.1, text: "ตระหนักถึงความสำคัญของสัตว์ที่ช่วยในการถ่ายเรณูของพืชดอก โดยการไม่ทำลายชีวิตของสัตว์ที่ช่วยในการถ่ายเรณู" }
          - { id: "ว 1.2 ม.1/14", level: ม.1, text: "อธิบายความสำคัญของธาตุอาหารบางชนิดที่มีผลต่อการเจริญเติบโตและการดำรงชีวิตของพืช" }
          - { id: "ว 1.2 ม.1/15", level: ม.1, text: "เลือกใช้ปุ๋ยที่มีธาตุอาหารเหมาะสมกับพืชในสถานการณ์ที่กำหนด" }
          - { id: "ว 1.2 ม.1/16", level: ม.1, text: "เลือกวิธีการขยายพันธุ์พืชให้เหมาะสมกับความต้องการของมนุษย์ โดยใช้ความรู้เกี่ยวกับการสืบพันธุ์ของพืช" }
          - { id: "ว 1.2 ม.1/17", level: ม.1, text: "อธิบายความสำคัญของเทคโนโลยีการเพาะเลี้ยงเนื้อเยื่อพืชในการใช้ประโยชน์ด้านต่าง ๆ" }
          - { id: "ว 1.2 ม.1/18", level: ม.1, text: "ตระหนักถึงประโยชน์ของการขยายพันธุ์พืช โดยการนำความรู้ไปใช้ในชีวิตประจำวัน" }
          - { id: "ว 1.2 ม.2/1", level: ม.2, text: "ระบุอวัยวะและบรรยายหน้าที่ของอวัยวะที่เกี่ยวข้องในระบบหายใจ" }
          - { id: "ว 1.2 ม.2/2", level: ม.2, text: "อธิบายกลไกการหายใจเข้าและออก โดยใช้แบบจำลอง รวมทั้งอธิบายกระบวนการแลกเปลี่ยนแก๊ส" }
          - { id: "ว 1.2 ม.2/3", level: ม.2, text: "ตระหนักถึงความสำคัญของระบบหายใจ โดยการบอกแนวทางในการดูแลรักษาอวัยวะในระบบหายใจให้ทำงานเป็นปกติ" }
          - { id: "ว 1.2 ม.2/4", level: ม.2, text: "ระบุอวัยวะและบรรยายหน้าที่ของอวัยวะในระบบขับถ่ายในการกำจัดของเสียทางไต" }
          - { id: "ว 1.2 ม.2/5", level: ม.2, text: "ตระหนักถึงความสำคัญของระบบขับถ่ายในการกำจัดของเสียทางไต โดยการบอกแนวทางในการปฏิบัติตนที่ช่วยให้ระบบขับถ่ายทำหน้าที่ได้อย่างปกติ" }
          - { id: "ว 1.2 ม.2/6", level: ม.2, text: "บรรยายโครงสร้างและหน้าที่ของหัวใจ หลอดเลือด และเลือด" }
          - { id: "ว 1.2 ม.2/7", level: ม.2, text: "อธิบายการทำงานของระบบหมุนเวียนเลือด โดยใช้แบบจำลอง" }
          - { id: "ว 1.2 ม.2/8", level: ม.2, text: "ออกแบบการทดลองและทดลอง ในการเปรียบเทียบอัตราการเต้นของหัวใจ ขณะปกติและหลังทำกิจกรรม" }
          - { id: "ว 1.2 ม.2/9", level: ม.2, text: "ตระหนักถึงความสำคัญของระบบหมุนเวียนเลือด โดยการบอกแนวทางในการดูแลรักษาอวัยวะในระบบหมุนเวียนเลือดให้ทำงานเป็นปกติ" }
          - { id: "ว 1.2 ม.2/10", level: ม.2, text: "ระบุอวัยวะและบรรยายหน้าที่ของอวัยวะในระบบประสาทส่วนกลางในการควบคุมการทำงานต่าง ๆ ของร่างกาย" }
          - { id: "ว 1.2 ม.2/11", level: ม.2, text: "ตระหนักถึงความสำคัญของระบบประสาท โดยการบอกแนวทางในการดูแลรักษา รวมถึงการป้องกันการกระทบกระเทือนและอันตรายต่อสมองและไขสันหลัง" }
          - { id: "ว 1.2 ม.2/12", level: ม.2, text: "ระบุอวัยวะและบรรยายหน้าที่ของอวัยวะในระบบสืบพันธุ์ของเพศชายและเพศหญิง โดยใช้แบบจำลอง" }
          - { id: "ว 1.2 ม.2/13", level: ม.2, text: "อธิบายผลของฮอร์โมนเพศชายและเพศหญิงที่ควบคุมการเปลี่ยนแปลงของร่างกาย เมื่อเข้าสู่วัยหนุ่มสาว" }
          - { id: "ว 1.2 ม.2/14", level: ม.2, text: "ตระหนักถึงการเปลี่ยนแปลงของร่างกายเมื่อเข้าสู่วัยหนุ่มสาว โดยการดูแลรักษาร่างกายและจิตใจของตนเองในช่วงที่มีการเปลี่ยนแปลง" }
          - { id: "ว 1.2 ม.2/15", level: ม.2, text: "อธิบายการตกไข่ การมีประจำเดือน การปฏิสนธิ และการพัฒนาของไซโกต จนคลอดเป็นทารก" }
          - { id: "ว 1.2 ม.2/16", level: ม.2, text: "เลือกวิธีการคุมกำเนิดที่เหมาะสมกับสถานการณ์ที่กำหนด" }
          - { id: "ว 1.2 ม.2/17", level: ม.2, text: "ตระหนักถึงผลกระทบของการตั้งครรภ์ก่อนวัยอันควร โดยการประพฤติตนให้เหมาะสม" }
          - { id: "ว 1.2 ม.4/1", level: ม.4, text: "อธิบายโครงสร้างและสมบัติของเยื่อหุ้มเซลล์ที่สัมพันธ์กับการลำเลียงสาร และเปรียบเทียบการลำเลียงสารผ่านเยื่อหุ้มเซลล์แบบต่าง ๆ" }
          - { id: "ว 1.2 ม.4/2", level: ม.4, text: "อธิบายการควบคุมดุลยภาพของน้ำและสารในเลือดโดยการทำงานของไต" }
          - { id: "ว 1.2 ม.4/3", level: ม.4, text: "อธิบายการควบคุมดุลยภาพของกรด-เบสของเลือดโดยการทำงานของไตและปอด" }
          - { id: "ว 1.2 ม.4/4", level: ม.4, text: "อธิบายการควบคุมดุลยภาพของอุณหภูมิภายในร่างกายโดยระบบหมุนเวียนเลือด ผิวหนัง และกล้ามเนื้อโครงร่าง" }
          - { id: "ว 1.2 ม.4/5", level: ม.4, text: "อธิบาย และเขียนแผนผังเกี่ยวกับการตอบสนองของร่างกายแบบไม่จำเพาะ และแบบจำเพาะต่อสิ่งแปลกปลอมของร่างกาย" }
          - { id: "ว 1.2 ม.4/6", level: ม.4, text: "สืบค้นข้อมูล อธิบาย และยกตัวอย่างโรคหรืออาการที่เกิดจากความผิดปกติของระบบภูมิคุ้มกัน" }
          - { id: "ว 1.2 ม.4/7", level: ม.4, text: "อธิบายภาวะภูมิคุ้มกันบกพร่องที่มีสาเหตุมาจากการติดเชื้อ HIV" }
          - { id: "ว 1.2 ม.4/8", level: ม.4, text: "ทดสอบ และบอกชนิดของสารอาหารที่พืชสังเคราะห์ได้" }
          - { id: "ว 1.2 ม.4/9", level: ม.4, text: "สืบค้นข้อมูล อภิปราย และยกตัวอย่างเกี่ยวกับการใช้ประโยชน์จากสารต่าง ๆ ที่พืชบางชนิดสร้างขึ้น" }
          - { id: "ว 1.2 ม.4/10", level: ม.4, text: "ออกแบบการทดลอง ทดลอง และอธิบายเกี่ยวกับปัจจัยภายนอกที่มีผลต่อการเจริญเติบโตของพืช" }
          - { id: "ว 1.2 ม.4/11", level: ม.4, text: "สืบค้นข้อมูลเกี่ยวกับสารควบคุมการเจริญเติบโตของพืชที่มนุษย์สังเคราะห์ขึ้น และยกตัวอย่างการนำมาประยุกต์ใช้ทางด้านการเกษตรของพืช" }
          - { id: "ว 1.2 ม.4/12", level: ม.4, text: "สังเกต และอธิบายการตอบสนองของพืชต่อสิ่งเร้าในรูปแบบต่าง ๆ ที่มีผลต่อการดำรงชีวิต" }
      - id: "ว 1.3"
        text: "เข้าใจกระบวนการและความสำคัญของการถ่ายทอดลักษณะทางพันธุกรรม สารพันธุกรรม การเปลี่ยนแปลงทางพันธุกรรมที่มีผลต่อสิ่งมีชีวิต ความหลากหลายทางชีวภาพและวิวัฒนาการของสิ่งมีชีวิต รวมทั้งนำความรู้ไปใช้ประโยชน์"
        indicators:
          - { id: "ว 1.3 ป.2/1", level: ป.2, text: "เปรียบเทียบลักษณะของสิ่งมีชีวิตและสิ่งไม่มีชีวิต จากข้อมูลที่รวบรวมได้" }
          - { id: "ว 1.3 ป.4/1", level: ป.4, text: "จำแนกสิ่งมีชีวิตโดยใช้ความเหมือน และความแตกต่างของลักษณะของสิ่งมีชีวิตออกเป็นกลุ่มพืช กลุ่มสัตว์ และกลุ่มที่ไม่ใช่พืชและสัตว์" }
          - { id: "ว 1.3 ป.4/2", level: ป.4, text: "จำแนกพืชออกเป็นพืชดอกและพืชไม่มีดอก โดยใช้การมีดอกเป็นเกณฑ์ โดยใช้ข้อมูลที่รวบรวมได้" }
          - { id: "ว 1.3 ป.4/3", level: ป.4, text: "จำแนกสัตว์ออกเป็นสัตว์มีกระดูกสันหลังและสัตว์ไม่มีกระดูกสันหลัง โดยใช้การมีกระดูกสันหลังเป็นเกณฑ์ โดยใช้ข้อมูลที่รวบรวมได้" }
          - { id: "ว 1.3 ป.4/4", level: ป.4, text: "บรรยายลักษณะเฉพาะที่สังเกตได้ของสัตว์มีกระดูกสันหลังในกลุ่มปลา กลุ่มสัตว์สะเทินน้ำสะเทินบก กลุ่มสัตว์เลื้อยคลาน กลุ่มนก และกลุ่มสัตว์เลี้ยงลูกด้วยน้ำนม และยกตัวอย่างสิ่งมีชีวิตในแต่ละกลุ่ม" }
          - { id: "ว 1.3 ป.5/1", level: ป.5, text: "อธิบายลักษณะทางพันธุกรรมที่มีการถ่ายทอดจากพ่อแม่สู่ลูกของพืช สัตว์ และมนุษย์" }
          - { id: "ว 1.3 ป.5/2", level: ป.5, text: "แสดงความอยากรู้อยากเห็น โดยการถามคำถามเกี่ยวกับลักษณะที่คล้ายคลึงกันของตนเองกับพ่อแม่" }
          - { id: "ว 1.3 ม.3/1", level: ม.3, text: "อธิบายความสัมพันธ์ระหว่าง ยีน ดีเอ็นเอ และโครโมโซม โดยใช้แบบจำลอง" }
          - { id: "ว 1.3 ม.3/2", level: ม.3, text: "อธิบายการถ่ายทอดลักษณะทางพันธุกรรมจากการผสมโดยพิจารณาลักษณะเดียวที่แอลลีลเด่นข่มแอลลีลด้อยอย่างสมบูรณ์" }
          - { id: "ว 1.3 ม.3/3", level: ม.3, text: "อธิบายการเกิดจีโนไทป์และฟีโนไทป์ของลูก และคำนวณอัตราส่วนการเกิดจีโนไทป์และฟีโนไทป์ของรุ่นลูก" }
          - { id: "ว 1.3 ม.3/4", level: ม.3, text: "อธิบายความแตกต่างของการแบ่งเซลล์แบบไมโทซิสและไมโอซิส" }
          - { id: "ว 1.3 ม.3/5", level: ม.3, text: "บอกได้ว่าการเปลี่ยนแปลงของยีนหรือโครโมโซมอาจทำให้เกิดโรคทางพันธุกรรม พร้อมทั้งยกตัวอย่างโรคทางพันธุกรรม" }
          - { id: "ว 1.3 ม.3/6", level: ม.3, text: "ตระหนักถึงประโยชน์ของความรู้เรื่องโรคทางพันธุกรรม โดยรู้ว่าก่อนแต่งงานควรปรึกษาแพทย์ เพื่อตรวจและวินิจฉัยภาวะเสี่ยงของลูกที่อาจเกิดโรคทางพันธุกรรม" }
          - { id: "ว 1.3 ม.3/7", level: ม.3, text: "อธิบายการใช้ประโยชน์จากสิ่งมีชีวิตดัดแปรพันธุกรรม และผลกระทบที่อาจมีต่อมนุษย์และสิ่งแวดล้อม โดยใช้ข้อมูลที่รวบรวมได้" }
          - { id: "ว 1.3 ม.3/8", level: ม.3, text: "ตระหนักถึงประโยชน์และผลกระทบของสิ่งมีชีวิตดัดแปรพันธุกรรมที่อาจมีต่อมนุษย์และสิ่งแวดล้อม โดยการเผยแพร่ความรู้ที่ได้จากการโต้แย้งทางวิทยาศาสตร์ ซึ่งมีข้อมูลสนับสนุน" }
          - { id: "ว 1.3 ม.3/9", level: ม.3, text: "เปรียบเทียบความหลากหลายทางชีวภาพในระดับชนิดสิ่งมีชีวิตในระบบนิเวศต่าง ๆ" }
          - { id: "ว 1.3 ม.3/10", level: ม.3, text: "อธิบายความสำคัญของความหลากหลายทางชีวภาพที่มีต่อการรักษาสมดุลของระบบนิเวศและต่อมนุษย์" }
          - { id: "ว 1.3 ม.3/11", level: ม.3, text: "แสดงความตระหนักในคุณค่าและความสำคัญของความหลากหลายทางชีวภาพ โดยมีส่วนร่วมในการดูแลรักษาความหลากหลายทางชีวภาพ" }
          - { id: "ว 1.3 ม.4/1", level: ม.4, text: "อธิบายความสัมพันธ์ระหว่างยีน การสังเคราะห์โปรตีน และลักษณะทางพันธุกรรม" }
          - { id: "ว 1.3 ม.4/2", level: ม.4, text: "อธิบายหลักการถ่ายทอดลักษณะที่ถูกควบคุมด้วยยีนที่อยู่บนโครโมโซมเพศและมัลติเปิลแอลลีล" }
          - { id: "ว 1.3 ม.4/3", level: ม.4, text: "อธิบายผลที่เกิดจากการเปลี่ยนแปลงลำดับนิวคลีโอไทด์ในดีเอ็นเอต่อการแสดงลักษณะของสิ่งมีชีวิต" }
          - { id: "ว 1.3 ม.4/4", level: ม.4, text: "สืบค้นข้อมูล และยกตัวอย่างการนำมิวเทชันไปใช้ประโยชน์" }
          - { id: "ว 1.3 ม.4/5", level: ม.4, text: "สืบค้นข้อมูล และอภิปรายผลของเทคโนโลยีทางดีเอ็นเอที่มีต่อมนุษย์และสิ่งแวดล้อม" }
          - { id: "ว 1.3 ม.4/6", level: ม.4, text: "สืบค้นข้อมูล อธิบาย และยกตัวอย่างความหลากหลายของสิ่งมีชีวิต ซึ่งเป็นผลมาจากวิวัฒนาการ" }
  - id: ว2
    title: "วิทยาศาสตร์กายภาพ"
    standards:
      - id: "ว 2.1"
        text: "เข้าใจสมบัติของสสาร องค์ประกอบของสสาร ความสัมพันธ์ระหว่างสมบัติของสสารกับโครงสร้างและแรงยึดเหนี่ยวระหว่างอนุภาค หลักและธรรมชาติของการเปลี่ยนแปลงสถานะของสสาร การเกิดสารละลาย และการเกิดปฏิกิริยาเคมี"
        indicators:
          - { id: "ว 2.1 ป.1/1", level: ป.1, text: "อธิบายสมบัติที่สังเกตได้ของวัสดุที่ใช้ทำวัตถุซึ่งทำจากวัสดุชนิดเดียวหรือหลายชนิดประกอบกันโดยใช้หลักฐานเชิงประจักษ์" }
          - { id: "ว 2.1 ป.1/2", level: ป.1, text: "ระบุชนิดของวัสดุและจัดกลุ่มวัสดุตามสมบัติที่สังเกตได้" }
          - { id: "ว 2.1 ป.2/1", level: ป.2, text: "เปรียบเทียบสมบัติการดูดซับน้ำของวัสดุโดยใช้หลักฐานเชิงประจักษ์ และระบุการนำสมบัติการดูดซับน้ำของวัสดุไปประยุกต์ใช้ในการทำวัตถุในชีวิตประจำวัน" }
          - { id: "ว 2.1 ป.2/2", level: ป.2, text: "อธิบายสมบัติที่สังเกตได้ของวัสดุที่เกิดจากการนำวัสดุมาผสมกันโดยใช้หลักฐานเชิงประจักษ์" }
          - { id: "ว 2.1 ป.2/3", level: ป.2, text: "เปรียบเทียบสมบัติที่สังเกตได้ของวัสดุ เพื่อนำมาทำเป็นวัตถุในการใช้งานตามวัตถุประสงค์ และอธิบายการนำวัสดุที่ใช้แล้วกลับมาใช้ใหม่โดยใช้หลักฐานเชิงประจักษ์" }
          - { id: "ว 2.1 ป.2/4", level: ป.2, text: "ตระหนักถึงประโยชน์ของการนำวัสดุที่ใช้แล้วกลับมาใช้ใหม่ โดยการนำวัสดุที่ใช้แล้วกลับมาใช้ใหม่" }
          - { id: "ว 2.1 ป.3/1", level: ป.3, text: "อธิบายว่าวัตถุประกอบขึ้นจากชิ้นส่วนย่อย ๆ ซึ่งสามารถแยกออกจากกันได้และประกอบกันเป็นวัตถุชิ้นใหม่ได้ โดยใช้หลักฐานเชิงประจักษ์" }
          - { id: "ว 2.1 ป.3/2", level: ป.3, text: "อธิบายการเปลี่ยนแปลงของวัสดุเมื่อทำให้ร้อนขึ้นหรือทำให้เย็นลง โดยใช้หลักฐานเชิงประจักษ์" }
          - { id: "ว 2.1 ป.4/1", level: ป.4, text: "เปรียบเทียบสมบัติทางกายภาพด้านความแข็ง สภาพยืดหยุ่น การนำความร้อน และการนำไฟฟ้าของวัสดุโดยใช้หลักฐานเชิงประจักษ์จากการทดลองและระบุการนำสมบัติเรื่องความแข็ง สภาพยืดหยุ่น การนำความร้อน และการนำไฟฟ้าของวัสดุไปใช้ในชีวิตประจำวันผ่านกระบวนการออกแบบชิ้นงาน" }
          - { id: "ว 2.1 ป.4/2", level: ป.4, text: "แลกเปลี่ยนความคิดกับผู้อื่นโดยการอภิปรายเกี่ยวกับสมบัติทางกายภาพของวัสดุอย่างมีเหตุผลจากการทดลอง" }
          - { id: "ว 2.1 ป.4/3", level: ป.4, text: "เปรียบเทียบสมบัติของสสารทั้ง 3 สถานะ จากข้อมูลที่ได้จากการสังเกตมวล การต้องการที่อยู่ รูปร่างและปริมาตรของสสาร" }
          - { id: "ว 2.1 ป.4/4", level: ป.4, text: "ใช้เครื่องมือเพื่อวัดมวล และปริมาตรของสสารทั้ง 3 สถานะ" }
          - { id: "ว 2.1 ป.5/1", level: ป.5, text: "อธิบายการเปลี่ยนสถานะของสสาร เมื่อทำให้สสารร้อนขึ้นหรือเย็นลง โดยใช้หลักฐานเชิงประจักษ์" }
          - { id: "ว 2.1 ป.5/2", level: ป.5, text: "อธิบายการละลายของสารในน้ำ โดยใช้หลักฐานเชิงประจักษ์" }
          - { id: "ว 2.1 ป.5/3", level: ป.5, text: "วิเคราะห์การเปลี่ยนแปลงของสารเมื่อเกิดการเปลี่ยนแปลงทางเคมี โดยใช้หลักฐานเชิงประจักษ์" }
          - { id: "ว 2.1 ป.5/4", level: ป.5, text: "วิเคราะห์และระบุการเปลี่ยนแปลงที่ผันกลับได้และการเปลี่ยนแปลงที่ผันกลับไม่ได้" }
          - { id: "ว 2.1 ป.6/1", level: ป.6, text: "อธิบายและเปรียบเทียบการแยกสารผสมโดยการหยิบออก การร่อน การใช้แม่เหล็กดึงดูด การรินออก การกรอง และการตกตะกอน โดยใช้หลักฐานเชิงประจักษ์ รวมทั้งระบุวิธีแก้ปัญหาในชีวิตประจำวันเกี่ยวกับการแยกสาร" }
          - { id: "ว 2.1 ม.1/1", level: ม.1, text: "อธิบายสมบัติทางกายภาพบางประการของธาตุโลหะ อโลหะ และกึ่งโลหะ โดยใช้หลักฐานเชิงประจักษ์ที่ได้จากการสังเกตและการทดสอบ และใช้สารสนเทศที่ได้จากแหล่งข้อมูลต่าง ๆ รวมทั้งจัดกลุ่มธาตุเป็นโลหะ อโลหะ และกึ่งโลหะ" }
          - { id: "ว 2.1 ม.1/2", level: ม.1, text: "วิเคราะห์ผลจากการใช้ธาตุโลหะ อโลหะ กึ่งโลหะ และธาตุกัมมันตรังสี ที่มีต่อสิ่งมีชีวิต สิ่งแวดล้อม เศรษฐกิจและสังคม จากข้อมูลที่รวบรวมได้" }
          - { id: "ว 2.1 ม.1/3", level: ม.1, text: "ตระหนักถึงคุณค่าของการใช้ธาตุโลหะ อโลหะ กึ่งโลหะ ธาตุกัมมันตรังสี โดยเสนอแนวทางการใช้ธาตุอย่างปลอดภัย คุ้มค่า" }
          - { id: "ว 2.1 ม.1/4", level: ม.1, text: "เปรียบเทียบจุดเดือด จุดหลอมเหลวของสารบริสุทธิ์และสารผสม โดยการวัดอุณหภูมิ เขียนกราฟ แปลความหมายข้อมูลจากกราฟ หรือสารสนเทศ" }
          - { id: "ว 2.1 ม.1/5", level: ม.1, text: "อธิบายและเปรียบเทียบความหนาแน่นของสารบริสุทธิ์และสารผสม" }
          - { id: "ว 2.1 ม.1/6", level: ม.1, text: "ใช้เครื่องมือเพื่อวัดมวลและปริมาตรของสารบริสุทธิ์และสารผสม" }
          - { id: "ว 2.1 ม.1/7", level: ม.1, text: "อธิบายเกี่ยวกับความสัมพันธ์ระหว่างอะตอม ธาตุ และสารประกอบ โดยใช้แบบจำลองและสารสนเทศ" }
          - { id: "ว 2.1 ม.1/8", level: ม.1, text: "อธิบายโครงสร้างอะตอมที่ประกอบด้วยโปรตอน นิวตรอน และอิเล็กตรอน โดยใช้แบบจำลอง" }
          - { id: "ว 2.1 ม.1/9", level: ม.1, text: "อธิบายและเปรียบเทียบการจัดเรียงอนุภาค แรงยึดเหนี่ยวระหว่างอนุภาค และการเคลื่อนที่ของอนุภาคของสสารชนิดเดียวกันในสถานะของแข็ง ของเหลว และแก๊ส โดยใช้แบบจำลอง" }
          - { id: "ว 2.1 ม.1/10", level: ม.1, text: "อธิบายความสัมพันธ์ระหว่างพลังงานความร้อนกับการเปลี่ยนสถานะของสสาร โดยใช้หลักฐานเชิงประจักษ์และแบบจำลอง" }
          - { id: "ว 2.1 ม.2/1", level: ม.2, text: "อธิบายการแยกสารผสมโดยการระเหยแห้ง การตกผลึก การกลั่นอย่างง่าย โครมาโทกราฟีแบบกระดาษ การสกัดด้วยตัวทำละลาย โดยใช้หลักฐานเชิงประจักษ์" }
          - { id: "ว 2.1 ม.2/2", level: ม.2, text: "แยกสารโดยการระเหยแห้ง การตกผลึก การกลั่นอย่างง่าย โครมาโทกราฟีแบบกระดาษ การสกัดด้วยตัวทำละลาย" }
          - { id: "ว 2.1 ม.2/3", level: ม.2, text: "นำวิธีการแยกสารไปใช้แก้ปัญหาในชีวิตประจำวัน โดยบูรณาการวิทยาศาสตร์ คณิตศาสตร์ เทคโนโลยี และวิศวกรรมศาสตร์" }
          - { id: "ว 2.1 ม.2/4", level: ม.2, text: "ออกแบบการทดลองและทดลองในการอธิบายผลของชนิดตัวละลาย ชนิดตัวทำละลาย อุณหภูมิที่มีต่อสภาพละลายได้ของสาร รวมทั้งอธิบายผลของความดันที่มีต่อสภาพละลายได้ของสาร โดยใช้สารสนเทศ" }
          - { id: "ว 2.1 ม.2/5", level: ม.2, text: "ระบุปริมาณตัวละลายในสารละลาย ในหน่วยความเข้มข้นเป็นร้อยละ ปริมาตรต่อปริมาตร มวลต่อมวล และมวลต่อปริมาตร" }
          - { id: "ว 2.1 ม.2/6", level: ม.2, text: "ตระหนักถึงความสำคัญของการนำความรู้เรื่องความเข้มข้นของสารไปใช้ โดยยกตัวอย่างการใช้สารละลายในชีวิตประจำวันอย่างถูกต้องและปลอดภัย" }
          - { id: "ว 2.1 ม.3/1", level: ม.3, text: "ระบุสมบัติทางกายภาพและการใช้ประโยชน์วัสดุประเภทพอลิเมอร์ เซรามิก และวัสดุผสม โดยใช้หลักฐานเชิงประจักษ์ และสารสนเทศ" }
          - { id: "ว 2.1 ม.3/2", level: ม.3, text: "ตระหนักถึงคุณค่าของการใช้วัสดุประเภทพอลิเมอร์ เซรามิก และวัสดุผสม โดยเสนอแนะแนวทางการใช้วัสดุอย่างประหยัดและคุ้มค่า" }
          - { id: "ว 2.1 ม.3/3", level: ม.3, text: "อธิบายการเกิดปฏิกิริยาเคมี รวมถึงการจัดเรียงตัวใหม่ของอะตอมเมื่อเกิดปฏิกิริยาเคมี โดยใช้แบบจำลองและสมการข้อความ" }
          - { id: "ว 2.1 ม.3/4", level: ม.3, text: "อธิบายกฎทรงมวล โดยใช้หลักฐานเชิงประจักษ์" }
          - { id: "ว 2.1 ม.3/5", level: ม.3, text: "วิเคราะห์ปฏิกิริยาดูดความร้อน และปฏิกิริยาคายความร้อน จากการเปลี่ยนแปลงพลังงานความร้อนของปฏิกิริยา" }
          - { id: "ว 2.1 ม.3/6", level: ม.3, text: "อธิบายปฏิกิริยาการเกิดสนิมของเหล็ก ปฏิกิริยาของกรดกับโลหะ ปฏิกิริยาของกรดกับเบส และปฏิกิริยาของเบสกับโลหะ โดยใช้หลักฐานเชิงประจักษ์ และอธิบายปฏิกิริยาการเผาไหม้ การเกิดฝนกรด การสังเคราะห์ด้วยแสง โดยใช้สารสนเทศ รวมทั้งเขียนสมการข้อความแสดงปฏิกิริยาดังกล่าว" }
          - { id: "ว 2.1 ม.3/7", level: ม.3, text: "ระบุประโยชน์และโทษของปฏิกิริยาเคมีที่มีต่อสิ่งมีชีวิตและสิ่งแวดล้อม และยกตัวอย่างวิธีการป้องกันและแก้ปัญหาที่เกิดจากปฏิกิริยาเคมีที่พบในชีวิตประจำวัน จากการสืบค้นข้อมูล" }
          - { id: "ว 2.1 ม.3/8", level: ม.3, text: "ออกแบบวิธีแก้ปัญหาในชีวิตประจำวัน โดยใช้ความรู้เกี่ยวกับปฏิกิริยาเคมี โดยบูรณาการวิทยาศาสตร์ คณิตศาสตร์ เทคโนโลยี และวิศวกรรมศาสตร์" }
          - { id: "ว 2.1 ม.5/1", level: ม.5, text: "ระบุว่าสารเป็นธาตุหรือสารประกอบ และอยู่ในรูปอะตอม โมเลกุล หรือไอออนจากสูตรเคมี" }
          - { id: "ว 2.1 ม.5/2", level: ม.5, text: "เปรียบเทียบความเหมือนและความแตกต่างของแบบจำลองอะตอมของโบร์กับแบบจำลองอะตอมแบบกลุ่มหมอก" }
          - { id: "ว 2.1 ม.5/3", level: ม.5, text: "ระบุจำนวนโปรตอน นิวตรอน และอิเล็กตรอนของอะตอม และไอออนที่เกิดจากอะตอมเดียว" }
          - { id: "ว 2.1 ม.5/4", level: ม.5, text: "เขียนสัญลักษณ์นิวเคลียร์ของธาตุและระบุการเป็นไอโซโทป" }
          - { id: "ว 2.1 ม.5/5", level: ม.5, text: "ระบุหมู่และคาบของธาตุ และระบุว่าธาตุเป็นโลหะ อโลหะ กึ่งโลหะ กลุ่มธาตุเรพรีเซนเททีฟ หรือกลุ่มธาตุแทรนซิชัน จากตารางธาตุ" }
          - { id: "ว 2.1 ม.5/6", level: ม.5, text: "เปรียบเทียบสมบัติการนำไฟฟ้า การให้และรับอิเล็กตรอนระหว่างธาตุในกลุ่มโลหะกับอโลหะ" }
          - { id: "ว 2.1 ม.5/7", level: ม.5, text: "สืบค้นข้อมูลและนำเสนอตัวอย่างประโยชน์และอันตรายที่เกิดจากธาตุเรพรีเซนเททีฟและธาตุแทรนซิชัน" }
          - { id: "ว 2.1 ม.5/8", level: ม.5, text: "ระบุว่าพันธะโคเวเลนต์เป็นพันธะเดี่ยว พันธะคู่ หรือพันธะสาม และระบุจำนวนคู่อิเล็กตรอนระหว่างอะตอมคู่ร่วมพันธะ จากสูตรโครงสร้าง" }
          - { id: "ว 2.1 ม.5/9", level: ม.5, text: "ระบุสภาพขั้วของสารที่โมเลกุลประกอบด้วย 2 อะตอม" }
          - { id: "ว 2.1 ม.5/10", level: ม.5, text: "ระบุสารที่เกิดพันธะไฮโดรเจนได้จากสูตรโครงสร้าง" }
          - { id: "ว 2.1 ม.5/11", level: ม.5, text: "อธิบายความสัมพันธ์ระหว่างจุดเดือดของสารโคเวเลนต์กับแรงดึงดูดระหว่างโมเลกุลตามสภาพขั้วหรือการเกิดพันธะไฮโดรเจน" }
          - { id: "ว 2.1 ม.5/12", level: ม.5, text: "เขียนสูตรเคมีของไอออนและสารประกอบไอออนิก" }
          - { id: "ว 2.1 ม.5/13", level: ม.5, text: "ระบุว่าสารเกิดการละลายแบบแตกตัวหรือไม่แตกตัว พร้อมให้เหตุผลและระบุว่าสารละลายที่ได้เป็นสารละลายอิเล็กโทรไลต์ หรือนอนอิเล็กโทรไลต์" }
          - { id: "ว 2.1 ม.5/14", level: ม.5, text: "ระบุสารประกอบอินทรีย์ประเภทไฮโดรคาร์บอนว่าอิ่มตัวหรือไม่อิ่มตัวจากสูตรโครงสร้าง" }
          - { id: "ว 2.1 ม.5/15", level: ม.5, text: "สืบค้นข้อมูลและเปรียบเทียบสมบัติทางกายภาพระหว่างพอลิเมอร์และมอนอเมอร์ของพอลิเมอร์ชนิดนั้น" }
          - { id: "ว 2.1 ม.5/16", level: ม.5, text: "ระบุสมบัติความเป็นกรด-เบสจากโครงสร้างของสารประกอบอินทรีย์" }
          - { id: "ว 2.1 ม.5/17", level: ม.5, text: "อธิบายสมบัติการละลายในตัวทำละลายชนิดต่าง ๆ ของสาร" }
          - { id: "ว 2.1 ม.5/18", level: ม.5, text: "วิเคราะห์และอธิบายความสัมพันธ์ระหว่างโครงสร้างกับสมบัติเทอร์มอพลาสติกและเทอร์มอเซตของพอลิเมอร์ และการนำพอลิเมอร์ไปใช้ประโยชน์" }
          - { id: "ว 2.1 ม.5/19", level: ม.5, text: "สืบค้นข้อมูลและนำเสนอผลกระทบของการใช้ผลิตภัณฑ์พอลิเมอร์ที่มีต่อสิ่งมีชีวิตและสิ่งแวดล้อม พร้อมแนวทางป้องกันหรือแก้ไข" }
          - { id: "ว 2.1 ม.5/20", level: ม.5, text: "ระบุสูตรเคมีของสารตั้งต้น ผลิตภัณฑ์ และแปลความหมายของสัญลักษณ์ในสมการเคมีของปฏิกิริยาเคมี" }
          - { id: "ว 2.1 ม.5/21", level: ม.5, text: "ทดลองและอธิบายผลของความเข้มข้น พื้นที่ผิว อุณหภูมิ และตัวเร่งปฏิกิริยา ที่มีผลต่ออัตราการเกิดปฏิกิริยาเคมี" }
          - { id: "ว 2.1 ม.5/22", level: ม.5, text: "สืบค้นข้อมูลและอธิบายปัจจัยที่มีผลต่ออัตราการเกิดปฏิกิริยาเคมีที่ใช้ประโยชน์ในชีวิตประจำวันหรือในอุตสาหกรรม" }
          - { id: "ว 2.1 ม.5/23", level: ม.5, text: "อธิบายความหมายของปฏิกิริยารีดอกซ์" }
          - { id: "ว 2.1 ม.5/24", level: ม.5, text: "อธิบายสมบัติของสารกัมมันตรังสี และคำนวณครึ่งชีวิตและปริมาณของสารกัมมันตรังสี" }
          - { id: "ว 2.1 ม.5/25", level: ม.5, text: "สืบค้นข้อมูลและนำเสนอตัวอย่างประโยชน์ของสารกัมมันตรังสีและการป้องกันอันตรายที่เกิดจากกัมมันตภาพรังสี" }
      - id: "ว 2.2"
        text: "เข้าใจธรรมชาติของแรงในชีวิตประจำวัน ผลของแรงที่กระทำต่อวัตถุ ลักษณะการเคลื่อนที่แบบต่าง ๆ ของวัตถุ รวมทั้งนำความรู้ไปใช้ประโยชน์"
        indicators:
          - { id: "ว 2.2 ป.3/1", level: ป.3, text: "ระบุผลของแรงที่มีต่อการเปลี่ยนแปลงการเคลื่อนที่ของวัตถุจากหลักฐานเชิงประจักษ์" }
          - { id: "ว 2.2 ป.3/2", level: ป.3, text: "เปรียบเทียบและยกตัวอย่างแรงสัมผัสและแรงไม่สัมผัสที่มีผลต่อการเคลื่อนที่ของวัตถุโดยใช้หลักฐานเชิงประจักษ์" }
          - { id: "ว 2.2 ป.3/3", level: ป.3, text: "จำแนกวัตถุโดยใช้การดึงดูดกับแม่เหล็กเป็นเกณฑ์จากหลักฐานเชิงประจักษ์" }
          - { id: "ว 2.2 ป.3/4", level: ป.3, text: "ระบุขั้วแม่เหล็กและพยากรณ์ผลที่เกิดขึ้นระหว่างขั้วแม่เหล็กเมื่อนำมาเข้าใกล้กันจากหลักฐานเชิงประจักษ์" }
          - { id: "ว 2.2 ป.4/1", level: ป.4, text: "ระบุผลของแรงโน้มถ่วงที่มีต่อวัตถุจากหลักฐานเชิงประจักษ์" }
          - { id: "ว 2.2 ป.4/2", level: ป.4, text: "ใช้เครื่องชั่งสปริงในการวัดน้ำหนักของวัตถุ" }
          - { id: "ว 2.2 ป.4/3", level: ป.4, text: "บรรยายมวลของวัตถุที่มีผลต่อการเปลี่ยนแปลงการเคลื่อนที่ของวัตถุจากหลักฐานเชิงประจักษ์" }
          - { id: "ว 2.2 ป.5/1", level: ป.5, text: "อธิบายวิธีการหาแรงลัพธ์ของแรงหลายแรงในแนวเดียวกันที่กระทำต่อวัตถุในกรณีที่วัตถุอยู่นิ่งจากหลักฐานเชิงประจักษ์" }
          - { id: "ว 2.2 ป.5/2", level: ป.5, text: "เขียนแผนภาพแสดงแรงที่กระทำต่อวัตถุที่อยู่ในแนวเดียวกันและแรงลัพธ์ที่กระทำต่อวัตถุ" }
          - { id: "ว 2.2 ป.5/3", level: ป.5, text: "ใช้เครื่องชั่งสปริงในการวัดแรงที่กระทำต่อวัตถุ" }
          - { id: "ว 2.2 ป.5/4", level: ป.5, text: "ระบุผลของแรงเสียดทานที่มีต่อการเปลี่ยนแปลงการเคลื่อนที่ของวัตถุจากหลักฐานเชิงประจักษ์" }
          - { id: "ว 2.2 ป.5/5", level: ป.5, text: "เขียนแผนภาพแสดงแรงเสียดทานและแรงที่อยู่ในแนวเดียวกันที่กระทำต่อวัตถุ" }
          - { id: "ว 2.2 ป.6/1", level: ป.6, text: "อธิบายการเกิดและผลของแรงไฟฟ้าซึ่งเกิดจากวัตถุที่ผ่านการขัดถู โดยใช้หลักฐานเชิงประจักษ์" }
          - { id: "ว 2.2 ม.1/1", level: ม.1, text: "สร้างแบบจำลองที่อธิบายความสัมพันธ์ระหว่างความดันอากาศกับความสูงจากพื้นโลก" }
          - { id: "ว 2.2 ม.2/1", level: ม.2, text: "พยากรณ์การเคลื่อนที่ของวัตถุที่เป็นผลของแรงลัพธ์ที่เกิดจากแรงหลายแรงที่กระทำต่อวัตถุในแนวเดียวกันจากหลักฐานเชิงประจักษ์" }
          - { id: "ว 2.2 ม.2/2", level: ม.2, text: "เขียนแผนภาพแสดงแรงและแรงลัพธ์ที่เกิดจากแรงหลายแรงที่กระทำต่อวัตถุในแนวเดียวกัน" }
          - { id: "ว 2.2 ม.2/3", level: ม.2, text: "ออกแบบการทดลองและทดลองด้วยวิธีที่เหมาะสมในการอธิบายปัจจัยที่มีผลต่อความดันของของเหลว" }
          - { id: "ว 2.2 ม.2/4", level: ม.2, text: "วิเคราะห์แรงพยุงและการจม การลอยของวัตถุในของเหลวจากหลักฐานเชิงประจักษ์" }
          - { id: "ว 2.2 ม.2/5", level: ม.2, text: "เขียนแผนภาพแสดงแรงที่กระทำต่อวัตถุในของเหลว" }
          - { id: "ว 2.2 ม.2/6", level: ม.2, text: "อธิบายแรงเสียดทานสถิตและแรงเสียดทานจลน์จากหลักฐานเชิงประจักษ์" }
          - { id: "ว 2.2 ม.2/7", level: ม.2, text: "ออกแบบการทดลองและทดลองด้วยวิธีที่เหมาะสมในการอธิบายปัจจัยที่มีผลต่อขนาดของแรงเสียดทาน" }
          - { id: "ว 2.2 ม.2/8", level: ม.2, text: "เขียนแผนภาพแสดงแรงเสียดทานและแรงอื่น ๆ ที่กระทำต่อวัตถุ" }
          - { id: "ว 2.2 ม.2/9", level: ม.2, text: "ตระหนักถึงประโยชน์ของความรู้เรื่องแรงเสียดทานโดยวิเคราะห์สถานการณ์ปัญหาและเสนอแนะวิธีการลดหรือเพิ่มแรงเสียดทานที่เป็นประโยชน์ต่อการทำกิจกรรมในชีวิตประจำวัน" }
          - { id: "ว 2.2 ม.2/10", level: ม.2, text: "ออกแบบการทดลองและทดลองด้วยวิธีที่เหมาะสมในการอธิบายโมเมนต์ของแรง เมื่อวัตถุอยู่ในสภาพสมดุลต่อการหมุน และคำนวณโดยใช้สมการ M = Fl" }
          - { id: "ว 2.2 ม.2/11", level: ม.2, text: "เปรียบเทียบแหล่งของสนามแม่เหล็ก สนามไฟฟ้า และสนามโน้มถ่วง และทิศทางของแรงที่กระทำต่อวัตถุที่อยู่ในแต่ละสนามจากข้อมูลที่รวบรวมได้" }
          - { id: "ว 2.2 ม.2/12", level: ม.2, text: "เขียนแผนภาพแสดงแรงแม่เหล็ก แรงไฟฟ้า และแรงโน้มถ่วงที่กระทำต่อวัตถุ" }
          - { id: "ว 2.2 ม.2/13", level: ม.2, text: "วิเคราะห์ความสัมพันธ์ระหว่างขนาดของแรงแม่เหล็ก แรงไฟฟ้า และแรงโน้มถ่วงที่กระทำต่อวัตถุที่อยู่ในสนามนั้น ๆ กับระยะห่างจากแหล่งของสนามถึงวัตถุจากข้อมูลที่รวบรวมได้" }
          - { id: "ว 2.2 ม.2/14", level: ม.2, text: "อธิบายและคำนวณอัตราเร็วและความเร็วของการเคลื่อนที่ของวัตถุ โดยใช้สมการ v = s/t และ v⃗ = s⃗/t จากหลักฐานเชิงประจักษ์", note: "ต้นฉบับเขียนสมการเป็นเศษส่วน (v = s/t และเวกเตอร์ v = เวกเตอร์ s / t)" }
          - { id: "ว 2.2 ม.2/15", level: ม.2, text: "เขียนแผนภาพแสดงการกระจัดและความเร็ว" }
          - { id: "ว 2.2 ม.5/1", level: ม.5, text: "วิเคราะห์และแปลความหมายข้อมูลความเร็วกับเวลาของการเคลื่อนที่ของวัตถุ เพื่ออธิบายความเร่งของวัตถุ" }
          - { id: "ว 2.2 ม.5/2", level: ม.5, text: "สังเกตและอธิบายการหาแรงลัพธ์ที่เกิดจากแรงหลายแรงที่อยู่ในระนาบเดียวกันที่กระทำต่อวัตถุโดยการเขียนแผนภาพการรวมแบบเวกเตอร์" }
          - { id: "ว 2.2 ม.5/3", level: ม.5, text: "สังเกต วิเคราะห์ และอธิบายความสัมพันธ์ระหว่างความเร่งของวัตถุกับแรงลัพธ์ที่กระทำต่อวัตถุและมวลของวัตถุ" }
          - { id: "ว 2.2 ม.5/4", level: ม.5, text: "สังเกตและอธิบายแรงกิริยาและแรงปฏิกิริยาระหว่างวัตถุคู่หนึ่ง ๆ" }
          - { id: "ว 2.2 ม.5/5", level: ม.5, text: "สังเกตและอธิบายผลของความเร่งที่มีต่อการเคลื่อนที่แบบต่าง ๆ ของวัตถุ ได้แก่ การเคลื่อนที่แนวตรง การเคลื่อนที่แบบโพรเจกไทล์ การเคลื่อนที่แบบวงกลม และการเคลื่อนที่แบบสั่น" }
          - { id: "ว 2.2 ม.5/6", level: ม.5, text: "สืบค้นข้อมูลและอธิบายแรงโน้มถ่วงที่เกี่ยวกับการเคลื่อนที่ของวัตถุต่าง ๆ รอบโลก" }
          - { id: "ว 2.2 ม.5/7", level: ม.5, text: "สังเกตและอธิบายการเกิดสนามแม่เหล็กเนื่องจากกระแสไฟฟ้า" }
          - { id: "ว 2.2 ม.5/8", level: ม.5, text: "สังเกตและอธิบายแรงแม่เหล็กที่กระทำต่ออนุภาคที่มีประจุไฟฟ้าที่เคลื่อนที่ในสนามแม่เหล็ก และแรงแม่เหล็กที่กระทำต่อลวดตัวนำที่มีกระแสไฟฟ้าผ่านในสนามแม่เหล็ก รวมทั้งอธิบายหลักการทำงานของมอเตอร์" }
          - { id: "ว 2.2 ม.5/9", level: ม.5, text: "สังเกตและอธิบายการเกิดอีเอ็มเอฟ รวมทั้งยกตัวอย่างการนำความรู้ไปใช้ประโยชน์" }
          - { id: "ว 2.2 ม.5/10", level: ม.5, text: "สืบค้นข้อมูลและอธิบายแรงเข้มและแรงอ่อน" }
      - id: "ว 2.3"
        text: "เข้าใจความหมายของพลังงาน การเปลี่ยนแปลงและการถ่ายโอนพลังงาน ปฏิสัมพันธ์ระหว่างสสารและพลังงาน พลังงานในชีวิตประจำวัน ธรรมชาติของคลื่น ปรากฏการณ์ที่เกี่ยวข้องกับเสียง แสง และคลื่นแม่เหล็กไฟฟ้า รวมทั้งนำความรู้ไปใช้ประโยชน์"
        indicators:
          - { id: "ว 2.3 ป.1/1", level: ป.1, text: "บรรยายการเกิดเสียงและทิศทางการเคลื่อนที่ของเสียงจากหลักฐานเชิงประจักษ์" }
          - { id: "ว 2.3 ป.2/1", level: ป.2, text: "บรรยายแนวการเคลื่อนที่ของแสงจากแหล่งกำเนิดแสง และอธิบายการมองเห็นวัตถุจากหลักฐานเชิงประจักษ์" }
          - { id: "ว 2.3 ป.2/2", level: ป.2, text: "ตระหนักในคุณค่าของความรู้ของการมองเห็นโดยเสนอแนะแนวทางการป้องกันอันตรายจากการมองวัตถุที่อยู่ในบริเวณที่มีแสงสว่างไม่เหมาะสม" }
          - { id: "ว 2.3 ป.3/1", level: ป.3, text: "ยกตัวอย่างการเปลี่ยนพลังงานหนึ่งไปเป็นอีกพลังงานหนึ่งจากหลักฐานเชิงประจักษ์" }
          - { id: "ว 2.3 ป.3/2", level: ป.3, text: "บรรยายการทำงานของเครื่องกำเนิดไฟฟ้าและระบุแหล่งพลังงานในการผลิตไฟฟ้า จากข้อมูลที่รวบรวมได้" }
          - { id: "ว 2.3 ป.3/3", level: ป.3, text: "ตระหนักในประโยชน์และโทษของไฟฟ้า โดยนำเสนอวิธีการใช้ไฟฟ้าอย่างประหยัด และปลอดภัย" }
          - { id: "ว 2.3 ป.4/1", level: ป.4, text: "จำแนกวัตถุเป็นตัวกลางโปร่งใส ตัวกลางโปร่งแสง และวัตถุทึบแสง จากลักษณะการมองเห็นสิ่งต่าง ๆ ผ่านวัตถุนั้นเป็นเกณฑ์โดยใช้หลักฐานเชิงประจักษ์" }
          - { id: "ว 2.3 ป.5/1", level: ป.5, text: "อธิบายการได้ยินเสียงผ่านตัวกลางจากหลักฐานเชิงประจักษ์" }
          - { id: "ว 2.3 ป.5/2", level: ป.5, text: "ระบุตัวแปร ทดลอง และอธิบายลักษณะและการเกิดเสียงสูง เสียงต่ำ" }
          - { id: "ว 2.3 ป.5/3", level: ป.5, text: "ออกแบบการทดลองและอธิบายลักษณะและการเกิดเสียงดัง เสียงค่อย" }
          - { id: "ว 2.3 ป.5/4", level: ป.5, text: "วัดระดับเสียงโดยใช้เครื่องมือวัดระดับเสียง" }
          - { id: "ว 2.3 ป.5/5", level: ป.5, text: "ตระหนักในคุณค่าของความรู้เรื่องระดับเสียงโดยเสนอแนะแนวทางในการหลีกเลี่ยงและลดมลพิษทางเสียง" }
          - { id: "ว 2.3 ป.6/1", level: ป.6, text: "ระบุส่วนประกอบและบรรยายหน้าที่ของแต่ละส่วนประกอบของวงจรไฟฟ้าอย่างง่ายจากหลักฐานเชิงประจักษ์" }
          - { id: "ว 2.3 ป.6/2", level: ป.6, text: "เขียนแผนภาพและต่อวงจรไฟฟ้าอย่างง่าย" }
          - { id: "ว 2.3 ป.6/3", level: ป.6, text: "ออกแบบการทดลองและทดลองด้วยวิธีที่เหมาะสมในการอธิบายวิธีการและผลของการต่อเซลล์ไฟฟ้าแบบอนุกรม" }
          - { id: "ว 2.3 ป.6/4", level: ป.6, text: "ตระหนักถึงประโยชน์ของความรู้ของการต่อเซลล์ไฟฟ้าแบบอนุกรมโดยบอกประโยชน์และการประยุกต์ใช้ในชีวิตประจำวัน" }
          - { id: "ว 2.3 ป.6/5", level: ป.6, text: "ออกแบบการทดลองและทดลองด้วยวิธีที่เหมาะสมในการอธิบายการต่อหลอดไฟฟ้าแบบอนุกรมและแบบขนาน" }
          - { id: "ว 2.3 ป.6/6", level: ป.6, text: "ตระหนักถึงประโยชน์ของความรู้ของการต่อหลอดไฟฟ้าแบบอนุกรมและแบบขนาน โดยบอกประโยชน์ ข้อจำกัด และการประยุกต์ใช้ในชีวิตประจำวัน" }
          - { id: "ว 2.3 ป.6/7", level: ป.6, text: "อธิบายการเกิดเงามืดเงามัวจากหลักฐานเชิงประจักษ์" }
          - { id: "ว 2.3 ป.6/8", level: ป.6, text: "เขียนแผนภาพรังสีของแสงแสดงการเกิดเงามืดเงามัว" }
          - { id: "ว 2.3 ม.1/1", level: ม.1, text: "วิเคราะห์ แปลความหมายข้อมูล และคำนวณปริมาณความร้อนที่ทำให้สสารเปลี่ยนอุณหภูมิและเปลี่ยนสถานะ โดยใช้สมการ Q = mc∆t และ Q = mL" }
          - { id: "ว 2.3 ม.1/2", level: ม.1, text: "ใช้เทอร์มอมิเตอร์ในการวัดอุณหภูมิของสสาร" }
          - { id: "ว 2.3 ม.1/3", level: ม.1, text: "สร้างแบบจำลองที่อธิบายการขยายตัวหรือหดตัวของสสารเนื่องจากได้รับหรือสูญเสียความร้อน" }
          - { id: "ว 2.3 ม.1/4", level: ม.1, text: "ตระหนักถึงประโยชน์ของความรู้ของการหดและขยายตัวของสสารเนื่องจากความร้อนโดยวิเคราะห์สถานการณ์ปัญหา และเสนอแนะวิธีการนำความรู้มาแก้ปัญหาในชีวิตประจำวัน" }
          - { id: "ว 2.3 ม.1/5", level: ม.1, text: "วิเคราะห์สถานการณ์การถ่ายโอนความร้อนและคำนวณปริมาณความร้อนที่ถ่ายโอนระหว่างสสารจนเกิดสมดุลความร้อนโดยใช้สมการ Qสูญเสีย = Qได้รับ", note: "ในต้นฉบับ \"สูญเสีย\" และ \"ได้รับ\" เป็นตัวห้อยของ Q" }
          - { id: "ว 2.3 ม.1/6", level: ม.1, text: "สร้างแบบจำลองที่อธิบายการถ่ายโอนความร้อนโดยการนำความร้อน การพาความร้อน การแผ่รังสีความร้อน" }
          - { id: "ว 2.3 ม.1/7", level: ม.1, text: "ออกแบบ เลือกใช้ และสร้างอุปกรณ์ เพื่อแก้ปัญหาในชีวิตประจำวันโดยใช้ความรู้เกี่ยวกับการถ่ายโอนความร้อน" }
          - { id: "ว 2.3 ม.2/1", level: ม.2, text: "วิเคราะห์สถานการณ์และคำนวณเกี่ยวกับงานและกำลังที่เกิดจากแรงที่กระทำต่อวัตถุ โดยใช้สมการ W = Fs และ P = W/t จากข้อมูลที่รวบรวมได้", note: "ต้นฉบับเขียน P = W/t เป็นเศษส่วน" }
          - { id: "ว 2.3 ม.2/2", level: ม.2, text: "วิเคราะห์หลักการทำงานของเครื่องกลอย่างง่ายจากข้อมูลที่รวบรวมได้" }
          - { id: "ว 2.3 ม.2/3", level: ม.2, text: "ตระหนักถึงประโยชน์ของความรู้ของเครื่องกลอย่างง่าย โดยบอกประโยชน์และการประยุกต์ใช้ในชีวิตประจำวัน" }
          - { id: "ว 2.3 ม.2/4", level: ม.2, text: "ออกแบบและทดลองด้วยวิธีที่เหมาะสมในการอธิบายปัจจัยที่มีผลต่อพลังงานจลน์และพลังงานศักย์โน้มถ่วง" }
          - { id: "ว 2.3 ม.2/5", level: ม.2, text: "แปลความหมายข้อมูลและอธิบายการเปลี่ยนพลังงานระหว่างพลังงานศักย์โน้มถ่วงและพลังงานจลน์ของวัตถุโดยพลังงานกลของวัตถุมีค่าคงตัวจากข้อมูลที่รวบรวมได้" }
          - { id: "ว 2.3 ม.2/6", level: ม.2, text: "วิเคราะห์สถานการณ์และอธิบายการเปลี่ยนและการถ่ายโอนพลังงานโดยใช้กฎการอนุรักษ์พลังงาน" }
          - { id: "ว 2.3 ม.3/1", level: ม.3, text: "วิเคราะห์ความสัมพันธ์ระหว่างความต่างศักย์ กระแสไฟฟ้า และความต้านทาน และคำนวณปริมาณที่เกี่ยวข้องโดยใช้สมการ V = IR จากหลักฐานเชิงประจักษ์" }
          - { id: "ว 2.3 ม.3/2", level: ม.3, text: "เขียนกราฟความสัมพันธ์ระหว่างกระแสไฟฟ้า และความต่างศักย์ไฟฟ้า" }
          - { id: "ว 2.3 ม.3/3", level: ม.3, text: "ใช้โวลต์มิเตอร์ แอมมิเตอร์ในการวัดปริมาณทางไฟฟ้า" }
          - { id: "ว 2.3 ม.3/4", level: ม.3, text: "วิเคราะห์ความต่างศักย์ไฟฟ้าและกระแสไฟฟ้าในวงจรไฟฟ้าเมื่อต่อตัวต้านทานหลายตัวแบบอนุกรมและแบบขนานจากหลักฐานเชิงประจักษ์" }
          - { id: "ว 2.3 ม.3/5", level: ม.3, text: "เขียนแผนภาพวงจรไฟฟ้าแสดงการต่อตัวต้านทานแบบอนุกรมและขนาน" }
          - { id: "ว 2.3 ม.3/6", level: ม.3, text: "บรรยายการทำงานของชิ้นส่วนอิเล็กทรอนิกส์อย่างง่ายในวงจรจากข้อมูลที่รวบรวมได้" }
          - { id: "ว 2.3 ม.3/7", level: ม.3, text: "เขียนแผนภาพและต่อชิ้นส่วนอิเล็กทรอนิกส์อย่างง่ายในวงจรไฟฟ้า" }
          - { id: "ว 2.3 ม.3/8", level: ม.3, text: "อธิบายและคำนวณพลังงานไฟฟ้าโดยใช้สมการ W = Pt รวมทั้งคำนวณค่าไฟฟ้าของเครื่องใช้ไฟฟ้าในบ้าน" }
          - { id: "ว 2.3 ม.3/9", level: ม.3, text: "ตระหนักในคุณค่าของการเลือกใช้เครื่องใช้ไฟฟ้าโดยนำเสนอวิธีการใช้เครื่องใช้ไฟฟ้าอย่างประหยัดและปลอดภัย" }
          - { id: "ว 2.3 ม.3/10", level: ม.3, text: "สร้างแบบจำลองที่อธิบายการเกิดคลื่นและบรรยายส่วนประกอบของคลื่น" }
          - { id: "ว 2.3 ม.3/11", level: ม.3, text: "อธิบายคลื่นแม่เหล็กไฟฟ้าและสเปกตรัมคลื่นแม่เหล็กไฟฟ้าจากข้อมูลที่รวบรวมได้" }
          - { id: "ว 2.3 ม.3/12", level: ม.3, text: "ตระหนักถึงประโยชน์และอันตรายจากคลื่นแม่เหล็กไฟฟ้าโดยนำเสนอการใช้ประโยชน์ในด้านต่าง ๆ และอันตรายจากคลื่นแม่เหล็กไฟฟ้าในชีวิตประจำวัน" }
          - { id: "ว 2.3 ม.3/13", level: ม.3, text: "ออกแบบการทดลองและดำเนินการทดลองด้วยวิธีที่เหมาะสมในการอธิบายกฎการสะท้อนของแสง" }
          - { id: "ว 2.3 ม.3/14", level: ม.3, text: "เขียนแผนภาพการเคลื่อนที่ของแสง แสดงการเกิดภาพจากกระจกเงา" }
          - { id: "ว 2.3 ม.3/15", level: ม.3, text: "อธิบายการหักเหของแสงเมื่อผ่านตัวกลางโปร่งใสที่แตกต่างกัน และอธิบายการกระจายแสงของแสงขาวเมื่อผ่านปริซึมจากหลักฐานเชิงประจักษ์" }
          - { id: "ว 2.3 ม.3/16", level: ม.3, text: "เขียนแผนภาพการเคลื่อนที่ของแสง แสดงการเกิดภาพจากเลนส์บาง" }
          - { id: "ว 2.3 ม.3/17", level: ม.3, text: "อธิบายปรากฏการณ์ที่เกี่ยวกับแสง และการทำงานของทัศนอุปกรณ์จากข้อมูลที่รวบรวมได้" }
          - { id: "ว 2.3 ม.3/18", level: ม.3, text: "เขียนแผนภาพการเคลื่อนที่ของแสง แสดงการเกิดภาพของทัศนอุปกรณ์และเลนส์ตา" }
          - { id: "ว 2.3 ม.3/19", level: ม.3, text: "อธิบายผลของความสว่างที่มีต่อดวงตาจากข้อมูลที่ได้จากการสืบค้น" }
          - { id: "ว 2.3 ม.3/20", level: ม.3, text: "วัดความสว่างของแสงโดยใช้อุปกรณ์วัดความสว่างของแสง" }
          - { id: "ว 2.3 ม.3/21", level: ม.3, text: "ตระหนักในคุณค่าของความรู้เรื่อง ความสว่างของแสงที่มีต่อดวงตา โดยวิเคราะห์สถานการณ์ปัญหาและเสนอแนะการจัดความสว่างให้เหมาะสมในการทำกิจกรรมต่าง ๆ" }
          - { id: "ว 2.3 ม.5/1", level: ม.5, text: "สืบค้นข้อมูลและอธิบายพลังงานนิวเคลียร์ ฟิชชันและฟิวชัน และความสัมพันธ์ระหว่างมวลกับพลังงานที่ปลดปล่อยออกมาจากฟิชชันและฟิวชัน" }
          - { id: "ว 2.3 ม.5/2", level: ม.5, text: "สืบค้นข้อมูล และอธิบายการเปลี่ยนพลังงานทดแทนเป็นพลังงานไฟฟ้า รวมทั้งสืบค้นและอภิปรายเกี่ยวกับเทคโนโลยีที่นำมาแก้ปัญหาหรือตอบสนองความต้องการทางด้านพลังงาน โดยเน้นด้านประสิทธิภาพและความคุ้มค่าด้านค่าใช้จ่าย" }
          - { id: "ว 2.3 ม.5/3", level: ม.5, text: "สังเกต และอธิบายการสะท้อน การหักเห การเลี้ยวเบน และการรวมคลื่น" }
          - { id: "ว 2.3 ม.5/4", level: ม.5, text: "สังเกต และอธิบายความถี่ธรรมชาติ การสั่นพ้อง และผลที่เกิดขึ้นจากการสั่นพ้อง" }
          - { id: "ว 2.3 ม.5/5", level: ม.5, text: "สังเกต และอธิบายการสะท้อน การหักเห การเลี้ยวเบน และการรวมคลื่นของคลื่นเสียง" }
          - { id: "ว 2.3 ม.5/6", level: ม.5, text: "สืบค้นข้อมูล และอธิบายความสัมพันธ์ระหว่างความเข้มเสียงกับระดับเสียงและผลของความถี่กับระดับเสียงที่มีต่อการได้ยินเสียง" }
          - { id: "ว 2.3 ม.5/7", level: ม.5, text: "สังเกต และอธิบายการเกิดเสียงสะท้อนกลับ บีต ดอปเพลอร์ และการสั่นพ้องของเสียง" }
          - { id: "ว 2.3 ม.5/8", level: ม.5, text: "สืบค้นข้อมูล และยกตัวอย่างการนำความรู้เกี่ยวกับเสียงไปใช้ประโยชน์ในชีวิตประจำวัน" }
          - { id: "ว 2.3 ม.5/9", level: ม.5, text: "สังเกต และอธิบายการมองเห็นสีของวัตถุและความผิดปกติในการมองเห็นสี" }
          - { id: "ว 2.3 ม.5/10", level: ม.5, text: "สังเกต และอธิบายการทำงานของแผ่นกรองแสงสี การผสมแสงสี การผสมสารสี และการนำไปใช้ประโยชน์ในชีวิตประจำวัน" }
          - { id: "ว 2.3 ม.5/11", level: ม.5, text: "สืบค้นข้อมูลและอธิบายคลื่นแม่เหล็กไฟฟ้า ส่วนประกอบคลื่นแม่เหล็กไฟฟ้า และหลักการทำงานของอุปกรณ์บางชนิดที่อาศัยคลื่นแม่เหล็กไฟฟ้า" }
          - { id: "ว 2.3 ม.5/12", level: ม.5, text: "สืบค้นข้อมูลและอธิบายการสื่อสาร โดยอาศัยคลื่นแม่เหล็กไฟฟ้าในการส่งผ่านสารสนเทศและเปรียบเทียบการสื่อสารด้วยสัญญาณแอนะล็อกกับสัญญาณดิจิทัล" }
  - id: ว3
    title: "วิทยาศาสตร์โลก และอวกาศ"
    standards:
      - id: "ว 3.1"
        text: "เข้าใจองค์ประกอบ ลักษณะ กระบวนการเกิด และวิวัฒนาการของเอกภพ กาแล็กซี ดาวฤกษ์ และระบบสุริยะ รวมทั้งปฏิสัมพันธ์ภายในระบบสุริยะที่ส่งผลต่อสิ่งมีชีวิต และการประยุกต์ใช้เทคโนโลยีอวกาศ"
        indicators:
          - { id: "ว 3.1 ป.1/1", level: ป.1, text: "ระบุดาวที่ปรากฏบนท้องฟ้าในเวลากลางวันและกลางคืนจากข้อมูลที่รวบรวมได้" }
          - { id: "ว 3.1 ป.1/2", level: ป.1, text: "อธิบายสาเหตุที่มองไม่เห็นดาวส่วนใหญ่ในเวลากลางวันจากหลักฐานเชิงประจักษ์" }
          - { id: "ว 3.1 ป.3/1", level: ป.3, text: "อธิบายแบบรูปเส้นทางการขึ้นและตก ของดวงอาทิตย์โดยใช้หลักฐานเชิงประจักษ์" }
          - { id: "ว 3.1 ป.3/2", level: ป.3, text: "อธิบายสาเหตุการเกิดปรากฏการณ์การขึ้นและตกของดวงอาทิตย์ การเกิดกลางวันกลางคืน และการกำหนดทิศ โดยใช้แบบจำลอง" }
          - { id: "ว 3.1 ป.3/3", level: ป.3, text: "ตระหนักถึงความสำคัญของดวงอาทิตย์ โดยบรรยายประโยชน์ของดวงอาทิตย์ต่อสิ่งมีชีวิต" }
          - { id: "ว 3.1 ป.4/1", level: ป.4, text: "อธิบายแบบรูปเส้นทางการขึ้นและตกของดวงจันทร์ โดยใช้หลักฐานเชิงประจักษ์" }
          - { id: "ว 3.1 ป.4/2", level: ป.4, text: "สร้างแบบจำลองที่อธิบายแบบรูปการเปลี่ยนแปลงรูปร่างปรากฏของดวงจันทร์ และพยากรณ์รูปร่างปรากฏของดวงจันทร์" }
          - { id: "ว 3.1 ป.4/3", level: ป.4, text: "สร้างแบบจำลองแสดงองค์ประกอบของระบบสุริยะ และอธิบายเปรียบเทียบคาบการโคจรของดาวเคราะห์ต่าง ๆ จากแบบจำลอง" }
          - { id: "ว 3.1 ป.5/1", level: ป.5, text: "เปรียบเทียบความแตกต่างของดาวเคราะห์และดาวฤกษ์จากแบบจำลอง" }
          - { id: "ว 3.1 ป.5/2", level: ป.5, text: "ใช้แผนที่ดาวระบุตำแหน่งและเส้นทางการขึ้นและตกของกลุ่มดาวฤกษ์บนท้องฟ้า และอธิบายแบบรูปเส้นทางการขึ้นและตกของกลุ่มดาวฤกษ์บนท้องฟ้าในรอบปี" }
          - { id: "ว 3.1 ป.6/1", level: ป.6, text: "สร้างแบบจำลองที่อธิบายการเกิด และเปรียบเทียบปรากฏการณ์สุริยุปราคาและจันทรุปราคา" }
          - { id: "ว 3.1 ป.6/2", level: ป.6, text: "อธิบายพัฒนาการของเทคโนโลยีอวกาศ และยกตัวอย่างการนำเทคโนโลยีอวกาศมาใช้ประโยชน์ในชีวิตประจำวัน จากข้อมูลที่รวบรวมได้" }
          - { id: "ว 3.1 ม.3/1", level: ม.3, text: "อธิบายการโคจรของดาวเคราะห์รอบดวงอาทิตย์ด้วยแรงโน้มถ่วงจากสมการ F = (Gm₁m₂)/r²", note: "ในต้นฉบับ 1 และ 2 ของ m เป็นตัวห้อย และ 2 ของ r เป็นตัวยก" }
          - { id: "ว 3.1 ม.3/2", level: ม.3, text: "สร้างแบบจำลองที่อธิบายการเกิดฤดู และการเคลื่อนที่ปรากฏของดวงอาทิตย์" }
          - { id: "ว 3.1 ม.3/3", level: ม.3, text: "สร้างแบบจำลองที่อธิบายการเกิดข้างขึ้นข้างแรม การเปลี่ยนแปลงเวลาการขึ้นและตกของดวงจันทร์ และการเกิดน้ำขึ้นน้ำลง" }
          - { id: "ว 3.1 ม.3/4", level: ม.3, text: "อธิบายการใช้ประโยชน์ของเทคโนโลยีอวกาศ และยกตัวอย่างความก้าวหน้าของโครงการสำรวจอวกาศ จากข้อมูลที่รวบรวมได้" }
          - { id: "ว 3.1 ม.6/1", level: ม.6, text: "อธิบายการกำเนิดและการเปลี่ยนแปลงพลังงาน สสาร ขนาด อุณหภูมิของเอกภพหลังเกิดบิกแบงในช่วงเวลาต่าง ๆ ตามวิวัฒนาการของเอกภพ" }
          - { id: "ว 3.1 ม.6/2", level: ม.6, text: "อธิบายหลักฐานที่สนับสนุนทฤษฎีบิกแบง จากความสัมพันธ์ระหว่างความเร็วกับระยะทางของกาแล็กซี รวมทั้งข้อมูลการค้นพบไมโครเวฟพื้นหลังจากอวกาศ" }
          - { id: "ว 3.1 ม.6/3", level: ม.6, text: "อธิบายโครงสร้างและองค์ประกอบของกาแล็กซีทางช้างเผือก และระบุตำแหน่งของระบบสุริยะพร้อมอธิบายเชื่อมโยงกับการสังเกตเห็นทางช้างเผือกของคนบนโลก" }
          - { id: "ว 3.1 ม.6/4", level: ม.6, text: "อธิบายกระบวนการเกิดดาวฤกษ์ โดยแสดงการเปลี่ยนแปลงความดัน อุณหภูมิ ขนาด จากดาวฤกษ์ก่อนเกิดจนเป็นดาวฤกษ์" }
          - { id: "ว 3.1 ม.6/5", level: ม.6, text: "ระบุปัจจัยที่ส่งผลต่อความส่องสว่างของดาวฤกษ์ และอธิบายความสัมพันธ์ระหว่างความส่องสว่างกับโชติมาตรของดาวฤกษ์" }
          - { id: "ว 3.1 ม.6/6", level: ม.6, text: "อธิบายความสัมพันธ์ระหว่างสี อุณหภูมิผิว และสเปกตรัมของดาวฤกษ์" }
          - { id: "ว 3.1 ม.6/7", level: ม.6, text: "อธิบายลำดับวิวัฒนาการที่สัมพันธ์กับมวลตั้งต้น และวิเคราะห์การเปลี่ยนแปลงสมบัติบางประการของดาวฤกษ์" }
          - { id: "ว 3.1 ม.6/8", level: ม.6, text: "อธิบายกระบวนการเกิดระบบสุริยะ และการแบ่งเขตบริวารของดวงอาทิตย์ และลักษณะของดาวเคราะห์ที่เอื้อต่อการดำรงชีวิต" }
          - { id: "ว 3.1 ม.6/9", level: ม.6, text: "อธิบายโครงสร้างของดวงอาทิตย์ การเกิดลมสุริยะ พายุสุริยะ และสืบค้นข้อมูล วิเคราะห์ นำเสนอปรากฏการณ์หรือเหตุการณ์ที่เกี่ยวข้องกับผลของลมสุริยะ และพายุสุริยะที่มีต่อโลกรวมทั้งประเทศไทย" }
          - { id: "ว 3.1 ม.6/10", level: ม.6, text: "สืบค้นข้อมูล อธิบายการสำรวจอวกาศ โดยใช้กล้องโทรทรรศน์ในช่วงความยาวคลื่นต่าง ๆ ดาวเทียม ยานอวกาศ สถานีอวกาศ และนำเสนอแนวคิดการนำความรู้ทางด้านเทคโนโลยีอวกาศมาประยุกต์ใช้ ในชีวิตประจำวันหรือในอนาคต" }
      - id: "ว 3.2"
        text: "เข้าใจองค์ประกอบและความสัมพันธ์ของระบบโลก กระบวนการเปลี่ยนแปลงภายในโลกและบนผิวโลก ธรณีพิบัติภัย กระบวนการเปลี่ยนแปลงลมฟ้าอากาศและภูมิอากาศโลก รวมทั้งผลต่อสิ่งมีชีวิตและสิ่งแวดล้อม"
        indicators:
          - { id: "ว 3.2 ป.1/1", level: ป.1, text: "อธิบายลักษณะภายนอกของหิน จากลักษณะเฉพาะตัวที่สังเกตได้" }
          - { id: "ว 3.2 ป.2/1", level: ป.2, text: "ระบุส่วนประกอบของดิน และจำแนกชนิดของดินโดยใช้ลักษณะเนื้อดินและการจับตัวเป็นเกณฑ์" }
          - { id: "ว 3.2 ป.2/2", level: ป.2, text: "อธิบายการใช้ประโยชน์จากดิน จากข้อมูลที่รวบรวมได้" }
          - { id: "ว 3.2 ป.3/1", level: ป.3, text: "ระบุส่วนประกอบของอากาศ บรรยายความสำคัญของอากาศ และผลกระทบของมลพิษทางอากาศต่อสิ่งมีชีวิต จากข้อมูลที่รวบรวมได้" }
          - { id: "ว 3.2 ป.3/2", level: ป.3, text: "ตระหนักถึงความสำคัญของอากาศ โดยนำเสนอแนวทางการปฏิบัติตนในการลดการเกิดมลพิษทางอากาศ" }
          - { id: "ว 3.2 ป.3/3", level: ป.3, text: "อธิบายการเกิดลมจากหลักฐานเชิงประจักษ์" }
          - { id: "ว 3.2 ป.3/4", level: ป.3, text: "บรรยายประโยชน์และโทษของลม จากข้อมูลที่รวบรวมได้" }
          - { id: "ว 3.2 ป.5/1", level: ป.5, text: "เปรียบเทียบปริมาณน้ำในแต่ละแหล่ง และระบุปริมาณน้ำที่มนุษย์สามารถนำมาใช้ประโยชน์ได้ จากข้อมูลที่รวบรวมได้" }
          - { id: "ว 3.2 ป.5/2", level: ป.5, text: "ตระหนักถึงคุณค่าของน้ำโดยนำเสนอแนวทางการใช้น้ำอย่างประหยัดและการอนุรักษ์น้ำ" }
          - { id: "ว 3.2 ป.5/3", level: ป.5, text: "สร้างแบบจำลองที่อธิบายการหมุนเวียนของน้ำในวัฏจักรน้ำ" }
          - { id: "ว 3.2 ป.5/4", level: ป.5, text: "เปรียบเทียบกระบวนการเกิดเมฆ หมอก น้ำค้าง และน้ำค้างแข็ง จากแบบจำลอง" }
          - { id: "ว 3.2 ป.5/5", level: ป.5, text: "เปรียบเทียบกระบวนการเกิดฝน หิมะ และลูกเห็บ จากข้อมูลที่รวบรวมได้" }
          - { id: "ว 3.2 ป.6/1", level: ป.6, text: "เปรียบเทียบกระบวนการเกิดหินอัคนี หินตะกอน และหินแปร และอธิบายวัฏจักรหินจากแบบจำลอง" }
          - { id: "ว 3.2 ป.6/2", level: ป.6, text: "บรรยายและยกตัวอย่างการใช้ประโยชน์ของหินและแร่ในชีวิตประจำวันจากข้อมูลที่รวบรวมได้" }
          - { id: "ว 3.2 ป.6/3", level: ป.6, text: "สร้างแบบจำลองที่อธิบายการเกิดซากดึกดำบรรพ์และคาดคะเนสภาพแวดล้อมในอดีตของซากดึกดำบรรพ์" }
          - { id: "ว 3.2 ป.6/4", level: ป.6, text: "เปรียบเทียบการเกิดลมบก ลมทะเล และมรสุม รวมทั้งอธิบายผลที่มีต่อสิ่งมีชีวิตและสิ่งแวดล้อม จากแบบจำลอง" }
          - { id: "ว 3.2 ป.6/5", level: ป.6, text: "อธิบายผลของมรสุมต่อการเกิดฤดูของประเทศไทย จากข้อมูลที่รวบรวมได้" }
          - { id: "ว 3.2 ป.6/6", level: ป.6, text: "บรรยายลักษณะและผลกระทบของน้ำท่วม การกัดเซาะชายฝั่ง ดินถล่ม แผ่นดินไหว สึนามิ" }
          - { id: "ว 3.2 ป.6/7", level: ป.6, text: "ตระหนักถึงผลกระทบของภัยธรรมชาติและธรณีพิบัติภัย โดยนำเสนอแนวทางในการเฝ้าระวังและปฏิบัติตนให้ปลอดภัยจากภัยธรรมชาติและธรณีพิบัติภัยที่อาจเกิดในท้องถิ่น" }
          - { id: "ว 3.2 ป.6/8", level: ป.6, text: "สร้างแบบจำลองที่อธิบายการเกิดปรากฏการณ์เรือนกระจก และผลของปรากฏการณ์เรือนกระจกต่อสิ่งมีชีวิต" }
          - { id: "ว 3.2 ป.6/9", level: ป.6, text: "ตระหนักถึงผลกระทบของปรากฏการณ์เรือนกระจก โดยนำเสนอแนวทางการปฏิบัติตนเพื่อลดกิจกรรมที่ก่อให้เกิดแก๊สเรือนกระจก" }
          - { id: "ว 3.2 ม.1/1", level: ม.1, text: "สร้างแบบจำลองที่อธิบายการแบ่งชั้นบรรยากาศ และเปรียบเทียบประโยชน์ของบรรยากาศแต่ละชั้น" }
          - { id: "ว 3.2 ม.1/2", level: ม.1, text: "อธิบายปัจจัยที่มีผลต่อการเปลี่ยนแปลงองค์ประกอบของลมฟ้าอากาศ จากข้อมูลที่รวบรวมได้" }
          - { id: "ว 3.2 ม.1/3", level: ม.1, text: "เปรียบเทียบกระบวนการเกิดพายุ ฝนฟ้าคะนองและพายุหมุนเขตร้อน และผลที่มีต่อสิ่งมีชีวิตและสิ่งแวดล้อม รวมทั้งนำเสนอแนวทางการปฏิบัติตนให้เหมาะสมและปลอดภัย" }
          - { id: "ว 3.2 ม.1/4", level: ม.1, text: "อธิบายการพยากรณ์อากาศ และพยากรณ์อากาศอย่างง่ายจากข้อมูลที่รวบรวมได้" }
          - { id: "ว 3.2 ม.1/5", level: ม.1, text: "ตระหนักถึงคุณค่าของการพยากรณ์อากาศ โดยนำเสนอแนวทางการปฏิบัติตนและการใช้ประโยชน์จากคำพยากรณ์อากาศ" }
          - { id: "ว 3.2 ม.1/6", level: ม.1, text: "อธิบายสถานการณ์และผลกระทบการเปลี่ยนแปลงภูมิอากาศโลกจากข้อมูลที่รวบรวมได้" }
          - { id: "ว 3.2 ม.1/7", level: ม.1, text: "ตระหนักถึงผลกระทบของการเปลี่ยนแปลงภูมิอากาศโลก โดยนำเสนอแนวทางการปฏิบัติตนภายใต้การเปลี่ยนแปลงภูมิอากาศโลก" }
          - { id: "ว 3.2 ม.2/1", level: ม.2, text: "เปรียบเทียบกระบวนการเกิด สมบัติ และการใช้ประโยชน์ รวมทั้งอธิบายผลกระทบจากการใช้เชื้อเพลิงซากดึกดำบรรพ์ จากข้อมูลที่รวบรวมได้" }
          - { id: "ว 3.2 ม.2/2", level: ม.2, text: "แสดงความตระหนักถึงผลจากการใช้เชื้อเพลิงซากดึกดำบรรพ์ โดยนำเสนอแนวทางการใช้เชื้อเพลิงซากดึกดำบรรพ์" }
          - { id: "ว 3.2 ม.2/3", level: ม.2, text: "เปรียบเทียบข้อดีและข้อจำกัดของพลังงานทดแทนแต่ละประเภทจากการรวบรวมข้อมูล และนำเสนอแนวทางการใช้พลังงานทดแทนที่เหมาะสมในท้องถิ่น" }
          - { id: "ว 3.2 ม.2/4", level: ม.2, text: "สร้างแบบจำลองที่อธิบายโครงสร้างภายในโลกตามองค์ประกอบทางเคมีจากข้อมูลที่รวบรวมได้" }
          - { id: "ว 3.2 ม.2/5", level: ม.2, text: "อธิบายกระบวนการผุพังอยู่กับที่ การกร่อน และการสะสมตัวของตะกอนจากแบบจำลอง รวมทั้งยกตัวอย่างผลของกระบวนการดังกล่าวที่ทำให้ผิวโลกเกิดการเปลี่ยนแปลง" }
          - { id: "ว 3.2 ม.2/6", level: ม.2, text: "อธิบายลักษณะของชั้นหน้าตัดดินและกระบวนการเกิดดิน จากแบบจำลอง รวมทั้งระบุปัจจัยที่ทำให้ดินมีลักษณะและสมบัติแตกต่างกัน" }
          - { id: "ว 3.2 ม.2/7", level: ม.2, text: "ตรวจวัดสมบัติบางประการของดิน โดยใช้เครื่องมือที่เหมาะสมและนำเสนอแนวทางการใช้ประโยชน์ดินจากข้อมูลสมบัติของดิน" }
          - { id: "ว 3.2 ม.2/8", level: ม.2, text: "อธิบายปัจจัยและกระบวนการเกิดแหล่งน้ำผิวดินและแหล่งน้ำใต้ดิน จากแบบจำลอง" }
          - { id: "ว 3.2 ม.2/9", level: ม.2, text: "สร้างแบบจำลองที่อธิบายการใช้น้ำ และนำเสนอแนวทางการใช้น้ำอย่างยั่งยืนในท้องถิ่นของตนเอง" }
          - { id: "ว 3.2 ม.2/10", level: ม.2, text: "สร้างแบบจำลองที่อธิบายกระบวนการเกิดและผลกระทบของน้ำท่วม การกัดเซาะชายฝั่ง ดินถล่ม หลุมยุบ แผ่นดินทรุด" }
          - { id: "ว 3.2 ม.6/1", level: ม.6, text: "อธิบายการแบ่งชั้นและสมบัติของโครงสร้างโลก พร้อมยกตัวอย่างข้อมูลที่สนับสนุน" }
          - { id: "ว 3.2 ม.6/2", level: ม.6, text: "อธิบายหลักฐานทางธรณีวิทยาที่สนับสนุนการเคลื่อนที่ของแผ่นธรณี" }
          - { id: "ว 3.2 ม.6/3", level: ม.6, text: "ระบุสาเหตุ และอธิบายรูปแบบแนวรอยต่อของแผ่นธรณีที่สัมพันธ์กับการเคลื่อนที่ของแผ่นธรณี พร้อมยกตัวอย่างหลักฐานทางธรณีวิทยาที่พบ" }
          - { id: "ว 3.2 ม.6/4", level: ม.6, text: "อธิบายสาเหตุ กระบวนการเกิดภูเขาไฟระเบิด รวมทั้งสืบค้นข้อมูลพื้นที่เสี่ยงภัย ออกแบบและนำเสนอแนวทางการเฝ้าระวังและการปฏิบัติตนให้ปลอดภัย" }
          - { id: "ว 3.2 ม.6/5", level: ม.6, text: "อธิบายสาเหตุ กระบวนการเกิด ขนาดและความรุนแรง และผลจากแผ่นดินไหว รวมทั้งสืบค้นข้อมูลพื้นที่เสี่ยงภัย ออกแบบและนำเสนอแนวทางการเฝ้าระวังและการปฏิบัติตนให้ปลอดภัย" }
          - { id: "ว 3.2 ม.6/6", level: ม.6, text: "อธิบายสาเหตุ กระบวนการเกิด และผลจากสึนามิ รวมทั้งสืบค้นข้อมูลพื้นที่เสี่ยงภัย ออกแบบและนำเสนอแนวทางการเฝ้าระวังและการปฏิบัติตนให้ปลอดภัย" }
          - { id: "ว 3.2 ม.6/7", level: ม.6, text: "อธิบายปัจจัยสำคัญที่มีผลต่อการได้รับพลังงานจากดวงอาทิตย์แตกต่างกันในแต่ละบริเวณของโลก" }
          - { id: "ว 3.2 ม.6/8", level: ม.6, text: "อธิบายการหมุนเวียนของอากาศ ที่เป็นผลมาจากความแตกต่างของความกดอากาศ" }
          - { id: "ว 3.2 ม.6/9", level: ม.6, text: "อธิบายทิศทางการเคลื่อนที่ของอากาศ ที่เป็นผลมาจากการหมุนรอบตัวเองของโลก" }
          - { id: "ว 3.2 ม.6/10", level: ม.6, text: "อธิบายการหมุนเวียนของอากาศตามเขตละติจูด และผลที่มีต่อภูมิอากาศ" }
          - { id: "ว 3.2 ม.6/11", level: ม.6, text: "อธิบายปัจจัยที่ทำให้เกิดการหมุนเวียนของน้ำผิวหน้าในมหาสมุทร และรูปแบบการหมุนเวียนของน้ำผิวหน้าในมหาสมุทร" }
          - { id: "ว 3.2 ม.6/12", level: ม.6, text: "อธิบายผลของการหมุนเวียนของอากาศและน้ำผิวหน้าในมหาสมุทรที่มีต่อลักษณะภูมิอากาศ ลมฟ้าอากาศ สิ่งมีชีวิต และสิ่งแวดล้อม" }
          - { id: "ว 3.2 ม.6/13", level: ม.6, text: "อธิบายปัจจัยที่มีผลต่อการเปลี่ยนแปลงภูมิอากาศของโลก พร้อมทั้งนำเสนอแนวปฏิบัติเพื่อลดกิจกรรมของมนุษย์ ที่ส่งผลต่อการเปลี่ยนแปลงภูมิอากาศโลก" }
          - { id: "ว 3.2 ม.6/14", level: ม.6, text: "แปลความหมายสัญลักษณ์ลมฟ้าอากาศที่สำคัญจากแผนที่อากาศ และนำข้อมูลสารสนเทศต่าง ๆ มาวางแผนการดำเนินชีวิตให้สอดคล้องกับสภาพลมฟ้าอากาศ" }
  - id: ว4
    title: "เทคโนโลยี"
    standards:
      - id: "ว 4.1"
        text: "เข้าใจแนวคิดหลักของเทคโนโลยีเพื่อการดำรงชีวิตในสังคมที่มีการเปลี่ยนแปลงอย่างรวดเร็ว ใช้ความรู้และทักษะทางด้านวิทยาศาสตร์ คณิตศาสตร์ และศาสตร์อื่น ๆ เพื่อแก้ปัญหาหรือพัฒนางานอย่างมีความคิดสร้างสรรค์ ด้วยกระบวนการออกแบบเชิงวิศวกรรม เลือกใช้เทคโนโลยีอย่างเหมาะสม โดยคำนึงถึงผลกระทบต่อชีวิต สังคม และสิ่งแวดล้อม"
        indicators:
          - { id: "ว 4.1 ม.1/1", level: ม.1, text: "อธิบายแนวคิดหลักของเทคโนโลยีในชีวิตประจำวันและวิเคราะห์สาเหตุหรือปัจจัยที่ส่งผลต่อการเปลี่ยนแปลงของเทคโนโลยี" }
          - { id: "ว 4.1 ม.1/2", level: ม.1, text: "ระบุปัญหาหรือความต้องการในชีวิตประจำวัน รวบรวม วิเคราะห์ข้อมูลและแนวคิดที่เกี่ยวข้องกับปัญหา" }
          - { id: "ว 4.1 ม.1/3", level: ม.1, text: "ออกแบบวิธีการแก้ปัญหา โดยวิเคราะห์เปรียบเทียบ และตัดสินใจเลือกข้อมูลที่จำเป็น นำเสนอแนวทางการแก้ปัญหาให้ผู้อื่นเข้าใจ วางแผนและดำเนินการแก้ปัญหา" }
          - { id: "ว 4.1 ม.1/4", level: ม.1, text: "ทดสอบ ประเมินผล และระบุข้อบกพร่องที่เกิดขึ้น พร้อมทั้งหาแนวทางการปรับปรุงแก้ไข และนำเสนอผลการแก้ปัญหา" }
          - { id: "ว 4.1 ม.1/5", level: ม.1, text: "ใช้ความรู้และทักษะเกี่ยวกับวัสดุ อุปกรณ์ เครื่องมือ กลไก ไฟฟ้า หรืออิเล็กทรอนิกส์เพื่อแก้ปัญหาได้อย่างถูกต้อง เหมาะสม และปลอดภัย" }
          - { id: "ว 4.1 ม.2/1", level: ม.2, text: "คาดการณ์แนวโน้มเทคโนโลยีที่จะเกิดขึ้นโดยพิจารณาจากสาเหตุหรือปัจจัยที่ส่งผลต่อการเปลี่ยนแปลงของเทคโนโลยี และวิเคราะห์ เปรียบเทียบ ตัดสินใจเลือกใช้เทคโนโลยี โดยคำนึงถึงผลกระทบที่เกิดขึ้นต่อชีวิต สังคม และสิ่งแวดล้อม" }
          - { id: "ว 4.1 ม.2/2", level: ม.2, text: "ระบุปัญหาหรือความต้องการในชุมชนหรือท้องถิ่น สรุปกรอบของปัญหา รวบรวม วิเคราะห์ข้อมูลและแนวคิดที่เกี่ยวข้องกับปัญหา" }
          - { id: "ว 4.1 ม.2/3", level: ม.2, text: "ออกแบบวิธีการแก้ปัญหา โดยวิเคราะห์เปรียบเทียบ และตัดสินใจเลือกข้อมูลที่จำเป็นภายใต้เงื่อนไขและทรัพยากรที่มีอยู่ นำเสนอแนวทางการแก้ปัญหาให้ผู้อื่นเข้าใจ วางแผนขั้นตอนการทำงานและดำเนินการแก้ปัญหาอย่างเป็นขั้นตอน" }
          - { id: "ว 4.1 ม.2/4", level: ม.2, text: "ทดสอบ ประเมินผล และอธิบายปัญหาหรือข้อบกพร่องที่เกิดขึ้น ภายใต้กรอบเงื่อนไข พร้อมทั้งหาแนวทางการปรับปรุงแก้ไข และนำเสนอผลการแก้ปัญหา" }
          - { id: "ว 4.1 ม.2/5", level: ม.2, text: "ใช้ความรู้ และทักษะเกี่ยวกับวัสดุ อุปกรณ์ เครื่องมือ กลไก ไฟฟ้า และอิเล็กทรอนิกส์เพื่อแก้ปัญหาหรือพัฒนางานได้อย่างถูกต้อง เหมาะสม และปลอดภัย" }
          - { id: "ว 4.1 ม.3/1", level: ม.3, text: "วิเคราะห์สาเหตุ หรือปัจจัยที่ส่งผลต่อการเปลี่ยนแปลงของเทคโนโลยี และความสัมพันธ์ของเทคโนโลยีกับศาสตร์อื่น โดยเฉพาะวิทยาศาสตร์ หรือคณิตศาสตร์ เพื่อเป็นแนวทางการแก้ปัญหาหรือพัฒนางาน" }
          - { id: "ว 4.1 ม.3/2", level: ม.3, text: "ระบุปัญหาหรือความต้องการของชุมชนหรือท้องถิ่น เพื่อพัฒนางานอาชีพ สรุปกรอบของปัญหา รวบรวม วิเคราะห์ข้อมูลและแนวคิดที่เกี่ยวข้องกับปัญหา โดยคำนึงถึงความถูกต้องด้านทรัพย์สินทางปัญญา" }
          - { id: "ว 4.1 ม.3/3", level: ม.3, text: "ออกแบบวิธีการแก้ปัญหา โดยวิเคราะห์เปรียบเทียบ และตัดสินใจเลือกข้อมูลที่จำเป็นภายใต้เงื่อนไขและทรัพยากรที่มีอยู่ นำเสนอแนวทางการแก้ปัญหาให้ผู้อื่นเข้าใจด้วยเทคนิคหรือวิธีการที่หลากหลาย วางแผนขั้นตอนการทำงานและดำเนินการแก้ปัญหาอย่างเป็นขั้นตอน" }
          - { id: "ว 4.1 ม.3/4", level: ม.3, text: "ทดสอบ ประเมินผล วิเคราะห์ และให้เหตุผลของปัญหาหรือข้อบกพร่องที่เกิดขึ้นภายใต้กรอบเงื่อนไข พร้อมทั้งหาแนวทางการปรับปรุงแก้ไข และนำเสนอผลการแก้ปัญหา" }
          - { id: "ว 4.1 ม.3/5", level: ม.3, text: "ใช้ความรู้ และทักษะเกี่ยวกับวัสดุ อุปกรณ์ เครื่องมือ กลไก ไฟฟ้าและอิเล็กทรอนิกส์ให้ถูกต้องกับลักษณะของงาน และปลอดภัย เพื่อแก้ปัญหาหรือพัฒนางาน" }
          - { id: "ว 4.1 ม.4/1", level: ม.4, text: "วิเคราะห์แนวคิดหลักของเทคโนโลยี ความสัมพันธ์กับศาสตร์อื่น โดยเฉพาะวิทยาศาสตร์ หรือคณิตศาสตร์ รวมทั้งประเมินผลกระทบที่จะเกิดขึ้นต่อมนุษย์ สังคม เศรษฐกิจ และสิ่งแวดล้อม เพื่อเป็นแนวทางในการพัฒนาเทคโนโลยี" }
          - { id: "ว 4.1 ม.4/2", level: ม.4, text: "ระบุปัญหาหรือความต้องการที่มีผลกระทบต่อสังคม รวบรวม วิเคราะห์ข้อมูลและแนวคิดที่เกี่ยวข้องกับปัญหาที่มีความซับซ้อนเพื่อสังเคราะห์วิธีการ เทคนิคในการแก้ปัญหา โดยคำนึงถึงความถูกต้องด้านทรัพย์สินทางปัญญา" }
          - { id: "ว 4.1 ม.4/3", level: ม.4, text: "ออกแบบวิธีการแก้ปัญหา โดยวิเคราะห์เปรียบเทียบ และตัดสินใจเลือกข้อมูลที่จำเป็นภายใต้เงื่อนไขและทรัพยากรที่มีอยู่ นำเสนอแนวทางการแก้ปัญหาให้ผู้อื่นเข้าใจด้วยเทคนิคหรือวิธีการที่หลากหลาย โดยใช้ซอฟต์แวร์ช่วยในการออกแบบ วางแผนขั้นตอนการทำงานและดำเนินการแก้ปัญหา" }
          - { id: "ว 4.1 ม.4/4", level: ม.4, text: "ทดสอบ ประเมินผล วิเคราะห์ และให้เหตุผลของปัญหาหรือข้อบกพร่องที่เกิดขึ้นภายใต้กรอบเงื่อนไข หาแนวทางการปรับปรุงแก้ไข และนำเสนอผลการแก้ปัญหา พร้อมทั้งเสนอแนวทางการพัฒนาต่อยอด" }
          - { id: "ว 4.1 ม.4/5", level: ม.4, text: "ใช้ความรู้และทักษะเกี่ยวกับวัสดุ อุปกรณ์ เครื่องมือ กลไก ไฟฟ้าและอิเล็กทรอนิกส์ และเทคโนโลยีที่ซับซ้อนในการแก้ปัญหาหรือพัฒนางาน ได้อย่างถูกต้อง เหมาะสม และปลอดภัย" }
          - { id: "ว 4.1 ม.5/1", level: ม.5, text: "ประยุกต์ใช้ความรู้และทักษะจากศาสตร์ต่าง ๆ รวมทั้งทรัพยากรในการทำโครงงานเพื่อแก้ปัญหาหรือพัฒนางาน" }
      - id: "ว 4.2"
        text: "เข้าใจและใช้แนวคิดเชิงคำนวณในการแก้ปัญหาที่พบในชีวิตจริงอย่างเป็นขั้นตอนและเป็นระบบ ใช้เทคโนโลยีสารสนเทศและการสื่อสารในการเรียนรู้ การทำงาน และการแก้ปัญหาได้อย่างมีประสิทธิภาพ รู้เท่าทัน และมีจริยธรรม"
        indicators:
          - { id: "ว 4.2 ป.1/1", level: ป.1, text: "แก้ปัญหาอย่างง่ายโดยใช้การลองผิดลองถูก การเปรียบเทียบ" }
          - { id: "ว 4.2 ป.1/2", level: ป.1, text: "แสดงลำดับขั้นตอนการทำงานหรือการแก้ปัญหาอย่างง่ายโดยใช้ภาพ สัญลักษณ์ หรือข้อความ" }
          - { id: "ว 4.2 ป.1/3", level: ป.1, text: "เขียนโปรแกรมอย่างง่าย โดยใช้ซอฟต์แวร์หรือสื่อ" }
          - { id: "ว 4.2 ป.1/4", level: ป.1, text: "ใช้เทคโนโลยีในการสร้าง จัดเก็บ เรียกใช้ข้อมูลตามวัตถุประสงค์" }
          - { id: "ว 4.2 ป.1/5", level: ป.1, text: "ใช้เทคโนโลยีสารสนเทศอย่างปลอดภัย ปฏิบัติตามข้อตกลงในการใช้คอมพิวเตอร์ร่วมกัน ดูแลรักษาอุปกรณ์เบื้องต้น ใช้งานอย่างเหมาะสม" }
          - { id: "ว 4.2 ป.2/1", level: ป.2, text: "แสดงลำดับขั้นตอนการทำงานหรือการแก้ปัญหาอย่างง่ายโดยใช้ภาพ สัญลักษณ์ หรือข้อความ" }
          - { id: "ว 4.2 ป.2/2", level: ป.2, text: "เขียนโปรแกรมอย่างง่าย โดยใช้ซอฟต์แวร์หรือสื่อ และตรวจหาข้อผิดพลาดของโปรแกรม" }
          - { id: "ว 4.2 ป.2/3", level: ป.2, text: "ใช้เทคโนโลยีในการสร้าง จัดหมวดหมู่ ค้นหา จัดเก็บ เรียกใช้ข้อมูลตามวัตถุประสงค์" }
          - { id: "ว 4.2 ป.2/4", level: ป.2, text: "ใช้เทคโนโลยีสารสนเทศอย่างปลอดภัย ปฏิบัติตามข้อตกลงในการใช้คอมพิวเตอร์ร่วมกัน ดูแลรักษาอุปกรณ์เบื้องต้น ใช้งานอย่างเหมาะสม" }
          - { id: "ว 4.2 ป.3/1", level: ป.3, text: "แสดงอัลกอริทึมในการทำงานหรือการแก้ปัญหาอย่างง่ายโดยใช้ภาพ สัญลักษณ์ หรือข้อความ" }
          - { id: "ว 4.2 ป.3/2", level: ป.3, text: "เขียนโปรแกรมอย่างง่าย โดยใช้ซอฟต์แวร์หรือสื่อ และตรวจหาข้อผิดพลาดของโปรแกรม" }
          - { id: "ว 4.2 ป.3/3", level: ป.3, text: "ใช้อินเทอร์เน็ตค้นหาความรู้" }
          - { id: "ว 4.2 ป.3/4", level: ป.3, text: "รวบรวม ประมวลผล และนำเสนอข้อมูล โดยใช้ซอฟต์แวร์ตามวัตถุประสงค์" }
          - { id: "ว 4.2 ป.3/5", level: ป.3, text: "ใช้เทคโนโลยีสารสนเทศอย่างปลอดภัย ปฏิบัติตามข้อตกลงในการใช้อินเทอร์เน็ต" }
          - { id: "ว 4.2 ป.4/1", level: ป.4, text: "ใช้เหตุผลเชิงตรรกะในการแก้ปัญหา การอธิบายการทำงาน การคาดการณ์ผลลัพธ์ จากปัญหาอย่างง่าย" }
          - { id: "ว 4.2 ป.4/2", level: ป.4, text: "ออกแบบ และเขียนโปรแกรมอย่างง่าย โดยใช้ซอฟต์แวร์หรือสื่อ และตรวจหาข้อผิดพลาดและแก้ไข" }
          - { id: "ว 4.2 ป.4/3", level: ป.4, text: "ใช้อินเทอร์เน็ตค้นหาความรู้ และประเมินความน่าเชื่อถือของข้อมูล" }
          - { id: "ว 4.2 ป.4/4", level: ป.4, text: "รวบรวม ประเมิน นำเสนอข้อมูลและสารสนเทศ โดยใช้ซอฟต์แวร์ที่หลากหลาย เพื่อแก้ปัญหาในชีวิตประจำวัน" }
          - { id: "ว 4.2 ป.4/5", level: ป.4, text: "ใช้เทคโนโลยีสารสนเทศอย่างปลอดภัย เข้าใจสิทธิและหน้าที่ของตน เคารพในสิทธิของผู้อื่น แจ้งผู้เกี่ยวข้องเมื่อพบข้อมูลหรือบุคคลที่ไม่เหมาะสม" }
          - { id: "ว 4.2 ป.5/1", level: ป.5, text: "ใช้เหตุผลเชิงตรรกะในการแก้ปัญหา การอธิบายการทำงาน การคาดการณ์ผลลัพธ์ จากปัญหาอย่างง่าย" }
          - { id: "ว 4.2 ป.5/2", level: ป.5, text: "ออกแบบ และเขียนโปรแกรมที่มีการใช้เหตุผลเชิงตรรกะอย่างง่าย ตรวจหาข้อผิดพลาดและแก้ไข" }
          - { id: "ว 4.2 ป.5/3", level: ป.5, text: "ใช้อินเทอร์เน็ตค้นหาข้อมูล ติดต่อสื่อสารและทำงานร่วมกัน ประเมินความน่าเชื่อถือของข้อมูล" }
          - { id: "ว 4.2 ป.5/4", level: ป.5, text: "รวบรวม ประเมิน นำเสนอข้อมูลและสารสนเทศ ตามวัตถุประสงค์โดยใช้ซอฟต์แวร์หรือบริการบนอินเทอร์เน็ตที่หลากหลาย เพื่อแก้ปัญหาในชีวิตประจำวัน" }
          - { id: "ว 4.2 ป.5/5", level: ป.5, text: "ใช้เทคโนโลยีสารสนเทศอย่างปลอดภัย มีมารยาท เข้าใจสิทธิและหน้าที่ของตน เคารพในสิทธิของผู้อื่น แจ้งผู้เกี่ยวข้องเมื่อพบข้อมูลหรือบุคคลที่ไม่เหมาะสม" }
          - { id: "ว 4.2 ป.6/1", level: ป.6, text: "ใช้เหตุผลเชิงตรรกะในการอธิบายและออกแบบวิธีการแก้ปัญหาที่พบในชีวิตประจำวัน" }
          - { id: "ว 4.2 ป.6/2", level: ป.6, text: "ออกแบบและเขียนโปรแกรมอย่างง่าย เพื่อแก้ปัญหาในชีวิตประจำวัน ตรวจหาข้อผิดพลาดของโปรแกรมและแก้ไข" }
          - { id: "ว 4.2 ป.6/3", level: ป.6, text: "ใช้อินเทอร์เน็ตในการค้นหาข้อมูลอย่างมีประสิทธิภาพ" }
          - { id: "ว 4.2 ป.6/4", level: ป.6, text: "ใช้เทคโนโลยีสารสนเทศทำงานร่วมกันอย่างปลอดภัย เข้าใจสิทธิและหน้าที่ของตน เคารพในสิทธิของผู้อื่น แจ้งผู้เกี่ยวข้องเมื่อพบข้อมูลหรือบุคคลที่ไม่เหมาะสม" }
          - { id: "ว 4.2 ม.1/1", level: ม.1, text: "ออกแบบอัลกอริทึมที่ใช้แนวคิดเชิงนามธรรมเพื่อแก้ปัญหาหรืออธิบายการทำงานที่พบในชีวิตจริง" }
          - { id: "ว 4.2 ม.1/2", level: ม.1, text: "ออกแบบและเขียนโปรแกรมอย่างง่าย เพื่อแก้ปัญหาทางคณิตศาสตร์หรือวิทยาศาสตร์" }
          - { id: "ว 4.2 ม.1/3", level: ม.1, text: "รวบรวมข้อมูลปฐมภูมิ ประมวลผล ประเมินผล นำเสนอข้อมูล และสารสนเทศ ตามวัตถุประสงค์โดยใช้ซอฟต์แวร์ หรือบริการบนอินเทอร์เน็ตที่หลากหลาย" }
          - { id: "ว 4.2 ม.1/4", level: ม.1, text: "ใช้เทคโนโลยีสารสนเทศอย่างปลอดภัย ใช้สื่อและแหล่งข้อมูลตามข้อกำหนดและข้อตกลง" }
          - { id: "ว 4.2 ม.2/1", level: ม.2, text: "ออกแบบอัลกอริทึมที่ใช้แนวคิดเชิงคำนวณในการแก้ปัญหา หรือการทำงานที่พบในชีวิตจริง" }
          - { id: "ว 4.2 ม.2/2", level: ม.2, text: "ออกแบบและเขียนโปรแกรมที่ใช้ตรรกะและฟังก์ชันในการแก้ปัญหา" }
          - { id: "ว 4.2 ม.2/3", level: ม.2, text: "อภิปรายองค์ประกอบและหลักการทำงานของระบบคอมพิวเตอร์ และเทคโนโลยีการสื่อสาร เพื่อประยุกต์ใช้งานหรือแก้ปัญหาเบื้องต้น" }
          - { id: "ว 4.2 ม.2/4", level: ม.2, text: "ใช้เทคโนโลยีสารสนเทศอย่างปลอดภัย มีความรับผิดชอบ สร้างและแสดงสิทธิในการเผยแพร่ผลงาน" }
          - { id: "ว 4.2 ม.3/1", level: ม.3, text: "พัฒนาแอปพลิเคชันที่มีการบูรณาการกับวิชาอื่นอย่างสร้างสรรค์" }
          - { id: "ว 4.2 ม.3/2", level: ม.3, text: "รวบรวมข้อมูล ประมวลผล ประเมินผล นำเสนอข้อมูลและสารสนเทศตามวัตถุประสงค์ โดยใช้ซอฟต์แวร์หรือบริการบนอินเทอร์เน็ตที่หลากหลาย" }
          - { id: "ว 4.2 ม.3/3", level: ม.3, text: "ประเมินความน่าเชื่อถือของข้อมูล วิเคราะห์สื่อและผลกระทบจากการให้ข่าวสารที่ผิด เพื่อการใช้งานอย่างรู้เท่าทัน" }
          - { id: "ว 4.2 ม.3/4", level: ม.3, text: "ใช้เทคโนโลยีสารสนเทศอย่างปลอดภัย และมีความรับผิดชอบต่อสังคม ปฏิบัติตามกฎหมายเกี่ยวกับคอมพิวเตอร์ ใช้ลิขสิทธิ์ของผู้อื่นโดยชอบธรรม" }
          - { id: "ว 4.2 ม.4/1", level: ม.4, text: "ประยุกต์ใช้แนวคิดเชิงคำนวณในการพัฒนาโครงงานที่มีการบูรณาการกับวิชาอื่นอย่างสร้างสรรค์ และเชื่อมโยงกับชีวิตจริง" }
          - { id: "ว 4.2 ม.5/1", level: ม.5, text: "รวบรวม วิเคราะห์ข้อมูล และใช้ความรู้ด้านวิทยาการคอมพิวเตอร์ สื่อดิจิทัล เทคโนโลยีสารสนเทศในการแก้ปัญหาหรือเพิ่มมูลค่าให้กับบริการหรือผลิตภัณฑ์ที่ใช้ในชีวิตจริงอย่างสร้างสรรค์" }
          - { id: "ว 4.2 ม.6/1", level: ม.6, text: "ใช้เทคโนโลยีสารสนเทศในการนำเสนอ และแบ่งปันข้อมูลอย่างปลอดภัย มีจริยธรรม และวิเคราะห์การเปลี่ยนแปลงเทคโนโลยีสารสนเทศที่มีผลต่อการดำเนินชีวิต อาชีพ สังคม และวัฒนธรรม" }
