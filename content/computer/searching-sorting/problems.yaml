problems:
  - id: computer.algorithms.searching-sorting.p001
    topics: [computer.algorithms.searching-sorting]
    difficulty: 1
    type: mcq
    stem: "การค้นหาแบบทวิภาคต้องมีเงื่อนไขใดของข้อมูล"
    choices:
      - { id: a, text: "ข้อมูลต้องเรียงลำดับแล้ว", correct: true }
      - { id: b, text: "ข้อมูลต้องมีจำนวนเป็นเลขคู่", feedback: "ตัวกลางหาได้เสมอด้วย (low + high) // 2 จำนวนคู่หรือคี่ไม่สำคัญ" }
      - { id: c, text: "ข้อมูลต้องเป็นตัวเลขเท่านั้น", feedback: "ข้อความที่เรียงตามตัวอักษรก็ใช้ทวิภาคได้ เช่น รายชื่อ" }
      - { id: d, text: "ข้อมูลต้องไม่เกิน 100 ตัว", feedback: "ทวิภาคยิ่งได้เปรียบมากเมื่อข้อมูลมาก" }
    hints:
      - "ทวิภาคตัดครึ่งหนึ่งทิ้งโดยดูจากตัวกลาง"
      - "ถ้าข้อมูลไม่เรียง รู้ได้อย่างไรว่าเป้าหมายอยู่ครึ่งไหน"
    solution: "ทวิภาคตัดสินว่าเป้าหมายอยู่ครึ่งซ้ายหรือขวาจากการเทียบกับตัวกลาง ซึ่งใช้ได้เมื่อข้อมูลเรียงแล้วเท่านั้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.searching-sorting.p002
    topics: [computer.algorithms.searching-sorting]
    difficulty: 1
    type: match
    stem: "จับคู่อัลกอริทึมกับแนวคิดหลัก"
    pairs:
      - { left: "ค้นหาแบบลำดับ", right: "เทียบทีละตัวตั้งแต่ตัวแรก" }
      - { left: "ค้นหาแบบทวิภาค", right: "ดูตัวกลางแล้วตัดครึ่งหนึ่งทิ้ง" }
      - { left: "เรียงแบบเลือก", right: "หาตัวน้อยที่สุดของส่วนที่เหลือแล้วสลับมาไว้ข้างหน้า" }
      - { left: "เรียงแบบแทรก", right: "หยิบทีละตัวไปแทรกในส่วนที่เรียงแล้ว เหมือนจัดไพ่" }
      - { left: "เรียงแบบผสาน", right: "แบ่งครึ่งจนเหลือตัวเดียว แล้วผสานลิสต์ที่เรียงแล้ว" }
    hints:
      - "อัลกอริทึมใดใช้แนวคิดแบ่งแยกและเอาชนะ"
      - "เลือก = เลือกตัวน้อยสุด แทรก = แทรกในที่ที่ถูก"
    solution: "ลำดับเทียบทีละตัว ทวิภาคตัดครึ่ง เลือกหาตัวน้อยสุดแล้วสลับ แทรกหยิบไปแทรกในส่วนที่เรียง และผสานแบ่งครึ่งแล้วผสานกลับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.searching-sorting.p003
    topics: [computer.algorithms.searching-sorting]
    difficulty: 2
    type: numeric
    stem: "ใช้การค้นหาแบบลำดับหาเลขที่ 42 ในลิสต์ `[17, 8, 33, 42, 5, 29]` ต้องเทียบกี่ครั้งจึงเจอ"
    answer: { value: 4, unit: "ครั้ง" }
    hints:
      - "เทียบตั้งแต่ตัวแรกทีละตัว"
      - "42 อยู่ตัวที่เท่าไรเมื่อนับจาก 1"
    misconceptions:
      - { match: 3, feedback: "3 คือดัชนีของ 42 (เริ่มที่ 0) แต่จำนวนครั้งที่เทียบนับรวมตัวแรกด้วย" }
      - { match: 6, feedback: "เมื่อเจอแล้วหยุดทันที ไม่ต้องเทียบครบทุกตัว" }
    solution: "เทียบ 17, 8, 33 ไม่ใช่ แล้วเทียบ 42 ตรงกัน รวม 4 ครั้ง (ฟังก์ชันคืนดัชนี 3)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.searching-sorting.p004
    topics: [computer.algorithms.searching-sorting]
    difficulty: 2
    type: numeric
    stem: "ห้องทะเบียนมีรายชื่อนักเรียน 1,200 คนที่ไม่ได้เรียง ถ้าค้นหาแบบลำดับแล้วชื่อที่หาไม่อยู่ในรายชื่อ ต้องเทียบกี่ครั้ง"
    answer: { value: 1200, unit: "ครั้ง" }
    hints:
      - "จะรู้ว่าไม่มีชื่อนั้นได้ต้องดูกี่ชื่อ"
      - "นี่คือกรณีแย่ที่สุดของการค้นหาแบบลำดับ"
    misconceptions:
      - { match: 600, feedback: "600 คือค่าเฉลี่ยเมื่อชื่ออยู่ในรายชื่อ แต่ถ้าไม่มี ต้องดูครบทุกชื่อ" }
      - { match: 11, feedback: "11 ครั้งเป็นของทวิภาคซึ่งใช้กับรายชื่อที่เรียงแล้ว รายชื่อนี้ไม่ได้เรียง" }
    solution: "ต้องเทียบครบทั้ง 1,200 ชื่อจึงสรุปได้ว่าไม่มี การค้นหาแบบลำดับเป็น O(n)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.searching-sorting.p005
    topics: [computer.algorithms.searching-sorting]
    difficulty: 2
    type: text
    stem: "อัลกอริทึมค้นหาที่ดูตัวกลางของลิสต์ที่เรียงแล้ว แล้วตัดครึ่งที่ไม่มีเป้าหมายทิ้งทุกรอบ เรียกว่าการค้นหาแบบใด (ภาษาไทยหรืออังกฤษ)"
    accepted: ["ทวิภาค", "การค้นหาแบบทวิภาค", "แบบทวิภาค", "binary search", "ค้นหาแบบทวิภาค", "ไบนารีเสิร์ช"]
    misconceptions:
      - { match: "ลำดับ", feedback: "แบบลำดับเทียบทีละตัว ไม่ได้ตัดครึ่ง" }
      - { match: "linear search", feedback: "linear search เทียบทีละตัว ไม่ได้ตัดครึ่ง" }
    hints:
      - "ทวิ แปลว่าสอง"
      - "ภาษาอังกฤษขึ้นต้นด้วย binary"
    solution: "การค้นหาแบบทวิภาค (binary search) ตัดช่วงลงครึ่งหนึ่งทุกรอบ จึงเทียบไม่เกิน ⌊log₂ n⌋ + 1 ครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.searching-sorting.p006
    topics: [computer.algorithms.searching-sorting]
    difficulty: 3
    type: numeric
    stem: "ถ้ารายชื่อ 1,200 คนเรียงตามตัวอักษรแล้ว การค้นหาแบบทวิภาคต้องเทียบ **มากที่สุด** กี่ครั้ง"
    answer: { value: 11, unit: "ครั้ง" }
    hints:
      - "แต่ละครั้งช่วงที่เหลือหดลงราวครึ่งหนึ่ง: 1200 → 600 → 300 → ..."
      - "ใช้สูตร ⌊log₂ n⌋ + 1 โดย 2¹⁰ = 1,024"
    misconceptions:
      - { match: 600, feedback: "600 คือขนาดช่วงหลังเทียบครั้งแรก ไม่ใช่จำนวนครั้งที่เทียบ" }
      - { match: 10, feedback: "log₂ 1200 ≈ 10.2 ปัดลงได้ 10 แล้วต้องบวก 1 สำหรับครั้งที่เหลือหนึ่งตัว" }
    solution: "⌊log₂ 1200⌋ + 1 = 10 + 1 = 11 ครั้ง (ช่วงหด 1200 → 600 → 300 → 150 → 75 → 37 → 18 → 9 → 4 → 2 → 1) เทียบกับแบบลำดับที่อาจต้อง 1,200 ครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.searching-sorting.p007
    topics: [computer.algorithms.searching-sorting]
    difficulty: 3
    type: numeric
    stem: "ใช้ฟังก์ชัน binary_search ในบทเรียนหาเลข 81 ในลิสต์ที่เรียงแล้ว 15 ตัวตามภาพ ต้องเทียบกับตัวกลางกี่ครั้งจึงเจอ"
    figure:
      src: sorted-list.svg
      alt: "ลิสต์ที่เรียงแล้ว 15 ช่อง ดัชนี 0 ถึง 14 ค่าเรียงจากซ้ายไปขวาคือ 2, 5, 8, 12, 16, 23, 38, 45, 56, 61, 72, 77, 81, 90, 95"
    answer: { value: 4, unit: "ครั้ง" }
    hints:
      - "รอบแรก low = 0, high = 14 จึง mid = 7 ค่าคือ 45 น้อยกว่า 81 จึงเลื่อน low"
      - "คำนวณ mid = (low + high) // 2 ใหม่ทุกรอบจนเจอ 81"
    misconceptions:
      - { match: 13, feedback: "13 คือจำนวนครั้งของการค้นหาแบบลำดับ (81 อยู่ตัวที่ 13)" }
      - { match: 12, feedback: "12 คือดัชนีของ 81 ไม่ใช่จำนวนครั้งที่เทียบ" }
    solution: "รอบ 1: mid = 7 ค่า 45 < 81 → low = 8 รอบ 2: mid = 11 ค่า 77 < 81 → low = 12 รอบ 3: mid = 13 ค่า 90 > 81 → high = 12 รอบ 4: mid = 12 ค่า 81 เจอ รวม 4 ครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.searching-sorting.p008
    topics: [computer.algorithms.searching-sorting]
    difficulty: 3
    type: mcq
    stem: "เรียงแบบเลือกจากน้อยไปมากกับลิสต์ `[29, 10, 14, 37, 13, 5]` หลังจบรอบที่ **2** ลิสต์เป็นแบบใด"
    choices:
      - { id: a, text: "[5, 10, 14, 37, 13, 29]", correct: true }
      - { id: b, text: "[5, 10, 13, 37, 14, 29]", feedback: "นี่คือผลหลังรอบที่ 3 ซึ่งนำ 13 มาไว้ตำแหน่งที่สาม" }
      - { id: c, text: "[10, 29, 14, 37, 13, 5]", feedback: "นี่คือการสลับตัวติดกันแบบอื่น แบบเลือกหาตัวน้อยที่สุดของทั้งส่วนที่เหลือ" }
      - { id: d, text: "[5, 10, 13, 14, 29, 37]", feedback: "นี่คือผลเมื่อเรียงเสร็จทุกรอบ" }
    hints:
      - "รอบที่ 1 หาตัวน้อยที่สุดของทั้งลิสต์ (5) แล้วสลับกับตัวแรก (29)"
      - "รอบที่ 2 หาตัวน้อยที่สุดตั้งแต่ตำแหน่งที่สอง ถ้าอยู่ที่เดิมแล้วก็สลับกับตัวเอง"
    solution: "รอบ 1: 5 สลับกับ 29 ได้ [5, 10, 14, 37, 13, 29] รอบ 2: ตัวน้อยสุดของ [10, 14, 37, 13, 29] คือ 10 อยู่ที่เดิมแล้ว ลิสต์จึงยังเป็น [5, 10, 14, 37, 13, 29]"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.searching-sorting.p009
    topics: [computer.algorithms.searching-sorting]
    difficulty: 3
    type: numeric
    stem: "เรียงแบบเลือกกับลิสต์ 6 ตัว ต้องเทียบค่าทั้งหมดกี่ครั้ง (ทุกกรณีเท่ากัน)"
    answer: { value: 15, unit: "ครั้ง" }
    hints:
      - "รอบแรกเทียบ 5 ครั้ง รอบถัดไปเทียบน้อยลงทีละ 1"
      - "ใช้สูตร n(n − 1)/2"
    misconceptions:
      - { match: 36, feedback: "36 คือ n² เป็นอัตราการโตโดยประมาณ จำนวนครั้งจริงคือ n(n − 1)/2" }
      - { match: 30, feedback: "ลืมหาร 2 ในสูตร n(n − 1)/2" }
    solution: "5 + 4 + 3 + 2 + 1 = 15 = 6 × 5 ÷ 2 จำนวนนี้ไม่ขึ้นกับว่าข้อมูลเรียงอยู่แล้วหรือไม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.searching-sorting.p010
    topics: [computer.algorithms.searching-sorting]
    difficulty: 3
    type: numeric
    stem: "ผสานลิสต์ที่เรียงแล้วสองลิสต์ `[1, 4, 9]` กับ `[2, 3, 10]` ตามวิธีของ merge_sort ในบทเรียน (เทียบตัวหน้าสุดของทั้งคู่ หยิบตัวที่น้อยกว่า จนลิสต์หนึ่งหมด แล้วต่อส่วนที่เหลือโดยไม่ต้องเทียบ) ต้องเทียบกี่ครั้ง"
    answer: { value: 5, unit: "ครั้ง" }
    hints:
      - "เทียบ 1 กับ 2 หยิบ 1 แล้วเทียบ 4 กับ 2 ต่อ"
      - "เมื่อลิสต์ซ้ายหมด ตัวที่เหลือในลิสต์ขวาต่อท้ายได้เลย"
    misconceptions:
      - { match: 6, feedback: "ตัวสุดท้าย (10) ต่อท้ายโดยไม่ต้องเทียบ เพราะลิสต์ซ้ายหมดแล้ว" }
      - { match: 9, feedback: "ไม่ต้องเทียบทุกคู่ แค่เทียบตัวหน้าสุดของสองลิสต์" }
    solution: "1<2 หยิบ 1, 4>2 หยิบ 2, 4>3 หยิบ 3, 4<10 หยิบ 4, 9<10 หยิบ 9 (5 ครั้ง) ลิสต์ซ้ายหมด ต่อ 10 ได้ [1, 2, 3, 4, 9, 10]"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.searching-sorting.p011
    topics: [computer.algorithms.searching-sorting]
    difficulty: 4
    type: mcq
    stem: "ร้านค้าบันทึกใบเสร็จเรียงตามเวลาเกือบทั้งหมด มีเพียงไม่กี่ใบที่บันทึกช้าจึงอยู่ผิดตำแหน่งเล็กน้อย ควรใช้การเรียงแบบใดถ้าต้องเขียนเอง"
    choices:
      - { id: a, text: "เรียงแบบแทรก เพราะตัวที่อยู่ถูกที่แล้วเทียบเพียงครั้งเดียวก็หยุด ข้อมูลเกือบเรียงจึงเร็วมาก", correct: true }
      - { id: b, text: "เรียงแบบเลือก เพราะเทียบน้อยที่สุดเสมอ", feedback: "แบบเลือกเทียบ n(n − 1)/2 ครั้งเสมอ ไม่ได้ประโยชน์จากข้อมูลที่เกือบเรียง" }
      - { id: c, text: "สุ่มสลับไปเรื่อย ๆ จนกว่าจะเรียง", feedback: "ไม่มีหลักประกันว่าจะเสร็จในเวลาที่ใช้ได้" }
      - { id: d, text: "ค้นหาแบบทวิภาค", feedback: "ทวิภาคเป็นการค้นหา ไม่ใช่การเรียง" }
    hints:
      - "อัลกอริทึมใดทำงานน้อยลงเมื่อข้อมูลเกือบเรียง"
      - "ทบทวนส่วนการเรียงแบบแทรกในบทเรียน"
    solution: "แบบแทรกหยุดเทียบทันทีเมื่อเจอตำแหน่งที่ถูก ข้อมูลที่เรียงแล้วจึงเทียบแค่ n − 1 ครั้ง ข้อมูลเกือบเรียงก็ใกล้เคียงนั้น ส่วนแบบเลือกเทียบเท่าเดิมทุกกรณี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.searching-sorting.p012
    topics: [computer.algorithms.searching-sorting]
    difficulty: 4
    type: mcq
    stem: |
      ฟังก์ชันนี้ตรวจว่าในลิสต์มีเลขซ้ำหรือไม่ จำนวนครั้งที่เทียบในกรณีแย่ที่สุดเป็น Big-O แบบใด

      ```python
      def has_duplicate(a):
          for i in range(len(a)):
              for j in range(i + 1, len(a)):
                  if a[i] == a[j]:
                      return True
          return False
      ```
    choices:
      - { id: a, text: "O(n²)", correct: true }
      - { id: b, text: "O(n)", feedback: "มีวงวนซ้อนสองชั้น ชั้นในวนหลายรอบในทุกรอบของชั้นนอก" }
      - { id: c, text: "O(log n)", feedback: "ไม่มีการตัดครึ่งข้อมูล" }
      - { id: d, text: "O(1)", feedback: "จำนวนครั้งเพิ่มตามขนาดของลิสต์" }
    hints:
      - "นับจำนวนคู่ (i, j) ที่ถูกเทียบเมื่อไม่มีเลขซ้ำ"
      - "(n − 1) + (n − 2) + ... + 1 = n(n − 1)/2"
    solution: "กรณีแย่ที่สุด (ไม่มีเลขซ้ำ) เทียบทุกคู่ n(n − 1)/2 ครั้ง พจน์ที่โตเร็วที่สุดคือ n² จึงเป็น O(n²) เป็นวิธีลองทุกทาง ถ้าใช้เซตเก็บตัวที่เคยเห็นจะเหลือราว O(n)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.searching-sorting.p013
    topics: [computer.algorithms.searching-sorting]
    difficulty: 4
    type: numeric
    stem: "แอปของโรงเรียนต้องเรียงข้อมูลผู้ใช้ 100,000 รายการ สมมติว่าเครื่องทำได้ 1 ขั้นต่อไมโครวินาที (10⁶ ขั้นต่อวินาที) ถ้าใช้อัลกอริทึมที่ใช้ n² ขั้น จะใช้เวลากี่วินาที"
    answer: { value: 10000, unit: "วินาที" }
    hints:
      - "n² = 100,000² = 10¹⁰ ขั้น"
      - "หารด้วย 10⁶ ขั้นต่อวินาที"
