      assert r == "ออกดอก", f"พืชวันสั้นที่มืด 14 ชม. วิกฤติ 12 ชม. ควรได้ 'ออกดอก' แต่ได้ {r!r}"
      assert flowering(10, 12, "short") == "ไม่ออกดอก", "พืชวันสั้นที่มืด 10 ชม. ต้องไม่ออกดอก"
      assert flowering(10, 12, "long") == "ออกดอก", "พืชวันยาวที่มืด 10 ชม. ต้องออกดอก"
      assert flowering(14, 12, "long") == "ไม่ออกดอก", "พืชวันยาวที่มืด 14 ชม. ต้องไม่ออกดอก"
    reference: |
      def flowering(dark_hours, critical_hours, kind):
          if kind == "short":
              return "ออกดอก" if dark_hours >= critical_hours else "ไม่ออกดอก"
          return "ออกดอก" if dark_hours < critical_hours else "ไม่ออกดอก"
    hints:
      - "แยกเงื่อนไขตามชนิดของพืชก่อนด้วย if"
      - "พืชวันสั้นต้องการช่วงมืดที่ยาวเกินวิกฤติ พืชวันยาวต้องการช่วงมืดที่สั้นกว่าวิกฤติ"
    solution: "ตรวจ kind ก่อน แล้วเปรียบเทียบ dark_hours กับ critical_hours ตามเงื่อนไขของแต่ละชนิด"
