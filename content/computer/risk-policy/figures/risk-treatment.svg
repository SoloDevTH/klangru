<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300"><title>ทางเลือกจัดการความเสี่ยงสี่แบบ ได้แก่ ลด โอน ยอมรับ และหลีกเลี่ยง</title><rect width="720" height="300" fill="#ffffff"/><rect x="30" y="70" width="150" height="170" rx="10" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/><text x="105" y="110" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">ลด (reduce)</text><text x="105" y="150" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal">สำรองข้อมูลทุกคืน</text><rect x="200" y="70" width="150" height="170" rx="10" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/><text x="275" y="110" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">โอน (transfer)</text><text x="275" y="150" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal">ซื้อประกันภัยไซเบอร์</text><rect x="370" y="70" width="150" height="170" rx="10" fill="#fef3c7" stroke="#1f2937" stroke-width="1.5"/><text x="445" y="110" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">ยอมรับ (accept)</text><text x="445" y="150" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal">บันทึกและติดตามไว้</text><rect x="540" y="70" width="150" height="170" rx="10" fill="#fde68a" stroke="#1f2937" stroke-width="1.5"/><text x="615" y="110" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">หลีกเลี่ยง (avoid)</text><text x="615" y="150" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal">เลิกใช้ระบบเสี่ยงสูง</text><text x="360" y="40" font-family="sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">เลือกทางจัดการให้สอดคล้องกับโอกาสและผลกระทบของแต่ละความเสี่ยง</text><text x="360" y="270" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">ตัวอย่างเป็นแนวทางสมมติเพื่อการเรียนรู้</text></svg>
