<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 275" width="470" height="275" font-family="sans-serif" font-size="16">
  <title>แรงสองแรงดึงเรือ 60 นิวตันกับ 80 นิวตัน ทำมุม 60 องศา และเวกเตอร์ลัพธ์แบบสี่เหลี่ยมด้านขนาน</title>
  <ellipse cx="52" cy="215" rx="30" ry="14" fill="#d9c7a7" stroke="#15211e" stroke-width="2"/>
  <text x="52" y="249" font-size="13" text-anchor="middle">เรือ</text>
  <line x1="214" y1="215" x2="310" y2="48.7" stroke="#6b7570" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="166" y1="48.7" x2="310" y2="48.7" stroke="#6b7570" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="70" y1="215" x2="203.6" y2="215" stroke="#1f5fa8" stroke-width="3"/>
  <polygon points="214,215 201,220.8 201,209.2" fill="#1f5fa8"/>
  <text x="218" y="235" fill="#1f5fa8" font-size="14" font-weight="bold"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="9" font-style="normal">1</tspan> = 60 N</text>
  <line x1="70" y1="215" x2="160.8" y2="57.7" stroke="#b4521f" stroke-width="3"/>
  <polygon points="166,48.7 164.6,62.9 154.4,57.1" fill="#b4521f"/>
  <text x="158" y="44.7" fill="#b4521f" font-size="14" text-anchor="end" font-weight="bold"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="9" font-style="normal">2</tspan> = 80 N</text>
  <line x1="70" y1="215" x2="300.8" y2="55.1" stroke="#0a6b60" stroke-width="3.4"/>
  <polygon points="310,48.7 302.1,61.9 294.9,51.5" fill="#0a6b60"/>
  <text x="316" y="44.7" fill="#0a6b60" font-size="16" font-weight="bold"><tspan font-style="italic">R</tspan></text>
  <path d="M 116 215 A 46 46 0 0 0 93.0 175.2" fill="none" stroke="#15211e" stroke-width="1.4"/>
  <text x="120" y="193" font-size="13">60°</text>
