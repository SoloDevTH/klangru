      - { id: c, text: "เป็นกลาง แผ่นโลหะกางเพราะลมจากการขยับแท่ง", feedback: "แผ่นกางเพราะมีประจุชนิดเดียวกันจึงผลักกัน" }
      - { id: d, text: "แผ่นหนึ่งเป็นบวก อีกแผ่นเป็นลบ", feedback: "ถ้าประจุต่างชนิดกัน แผ่นทั้งสองจะดูดกัน ไม่กางออก" }
    hints:
