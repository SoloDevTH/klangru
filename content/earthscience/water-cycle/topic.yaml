id: earthscience.hydrosphere.water-cycle
subject: earthscience
title: { th: น้ำ วัฏจักรน้ำ และหยาดน้ำฟ้า, en: "Water, the water cycle and precipitation" }
summary: ปริมาณน้ำในแหล่งต่าง ๆ และน้ำจืดที่ใช้ได้ การใช้น้ำอย่างประหยัด วัฏจักรน้ำ การเกิดเมฆ หมอก น้ำค้าง น้ำค้างแข็ง ฝน หิมะ และลูกเห็บ
difficulty: 1.8
minutes: 30
prerequisites: [earthscience.atmosphere.air-wind]
encompasses:
  - { id: earthscience.atmosphere.air-wind, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: น้ำบนโลกอยู่ที่ไหนบ้าง
    src: water-share.svg
    alt: "แถบยาวแทนน้ำทั้งโลก 1,000 ขวด น้ำเค็มในทะเลและมหาสมุทรประมาณ 975 ขวด เกือบทั้งแถบ ส่วนน้ำจืด 25 ขวดอยู่ปลายแถบ แถบขยายส่วนน้ำจืดแสดงน้ำแข็งและธารน้ำแข็งราว 17 ขวด น้ำใต้ดินราว 7 ขวดครึ่ง และแม่น้ำ ทะเลสาบ บึง ดินชื้น และไอน้ำในอากาศรวมกันไม่ถึงครึ่งขวด"
    caption: "ปัดเศษจากข้อมูลการกระจายของน้ำบนโลกของสำนักสำรวจธรณีวิทยาสหรัฐฯ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: น้ำจืดที่มนุษย์ใช้ได้
    problem: "ถ้าแบ่งน้ำทั้งโลกเป็น 1,000 ขวด เป็นน้ำเค็ม 975 ขวด น้ำแข็ง 17 ขวด น้ำจืดที่ไม่ใช่น้ำแข็งมีกี่ขวด และคิดเป็นกี่ส่วนในร้อยส่วน"
    steps:
      - text: "น้ำจืด $= 1{,}000 - 975 = 25$ ขวด"
      - text: "น้ำจืดที่ไม่ใช่น้ำแข็ง $= 25 - 17 = 8$ ขวด"
        why: "น้ำแข็งที่ขั้วโลกและบนภูเขาสูงนำมาใช้ได้ยาก"
      - text: "8 ขวดใน 1,000 ขวด เท่ากับ 0.8 ขวดใน 100 ขวด คือไม่ถึง 1 ส่วนในร้อยส่วน"
    answer: "8 ขวด ไม่ถึง 1 ส่วนใน 100 ส่วนของน้ำทั้งโลก"
  - { type: check, problem: earthscience.hydrosphere.water-cycle.p007, prompt: "น้ำแข็งเป็นส่วนหนึ่งของน้ำจืด" }
  - type: figure
    title: วัฏจักรน้ำ
    src: water-cycle.svg
    alt: "ดวงอาทิตย์ส่องลงทะเลทางซ้าย ลูกศรสีแดงชี้ขึ้นจากทะเล เขียนว่า การระเหย ต้นไม้มีลูกศรขึ้น เขียนว่า การคายน้ำของพืช ไอน้ำควบแน่นเป็นเมฆ ลมพาเมฆไปทางขวาเหนือภูเขา เมฆสีเทาให้หยาดน้ำฟ้า คือ ฝน หิมะ ลูกเห็บ ตกบนภูเขา น้ำไหลลงแม่น้ำบนผิวดินกลับสู่ทะเล และมีลูกศรน้ำซึมลงดินเป็นน้ำใต้ดิน"
    caption: "พลังงานจากดวงอาทิตย์ทำให้น้ำระเหยขึ้น แรงโน้มถ่วงดึงน้ำลงมาและไหลลงที่ต่ำ (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: worked-example
    title: เปรียบเทียบน้ำค้างกับน้ำค้างแข็ง
    problem: "คืนเดียวกัน ที่ตีนดอยอุณหภูมิต่ำสุด 8 °C ส่วนยอดดอยอุณหภูมิต่ำสุด −1 °C เช้าวันนั้นที่ยอดหญ้าของแต่ละที่น่าจะพบอะไร"
    steps:
      - text: "ทั้งสองที่มีไอน้ำในอากาศ และผิวหญ้าเย็นลงตอนกลางคืน ไอน้ำจึงเปลี่ยนสถานะบนผิวหญ้า"
      - text: "ตีนดอย 8 °C สูงกว่า 0 °C ไอน้ำควบแน่นเป็นหยดน้ำ คือน้ำค้าง"
      - text: "ยอดดอย −1 °C ต่ำกว่า 0 °C ไอน้ำเปลี่ยนเป็นเกล็ดน้ำแข็งโดยตรง คือน้ำค้างแข็ง (แม่คะนิ้ง)"
        why: "ที่อุณหภูมิต่ำกว่าจุดเยือกแข็ง น้ำอยู่ในสถานะของแข็ง"
    answer: "ตีนดอยพบน้ำค้าง ยอดดอยพบน้ำค้างแข็ง"
  - { type: check, problem: earthscience.hydrosphere.water-cycle.p005, prompt: "หยดน้ำนอกแก้วมาจากไหน" }
glossary:
  - { term: วัฏจักรน้ำ, definition: "การหมุนเวียนของน้ำระหว่างทะเล อากาศ และพื้นดิน ผ่านการระเหย การควบแน่น หยาดน้ำฟ้า และการไหลกลับ" }
  - { term: การระเหย, definition: "การที่น้ำเปลี่ยนจากของเหลวเป็นไอน้ำ เกิดเร็วขึ้นเมื่ออุณหภูมิสูงหรือมีลม" }
  - { term: การควบแน่น, definition: "การที่ไอน้ำเย็นลงแล้วเปลี่ยนเป็นละอองน้ำหรือหยดน้ำ" }
  - { term: การคายน้ำ, definition: "การที่พืชปล่อยไอน้ำออกทางปากใบ" }
  - { term: หยาดน้ำฟ้า, definition: "น้ำที่ตกจากฟ้าลงสู่พื้น เช่น ฝน หิมะ และลูกเห็บ" }
  - { term: น้ำค้างแข็ง, definition: "เกล็ดน้ำแข็งที่เกิดจากไอน้ำบนผิววัตถุที่เย็นต่ำกว่า 0 องศาเซลเซียส ในภาคเหนือเรียกว่าแม่คะนิ้ง" }
flashcards:
  - { front: "น้ำจืดมีกี่ส่วนในน้ำทั้งโลก 1,000 ส่วน", back: "ประมาณ 25 ส่วน และส่วนใหญ่เป็นน้ำแข็ง" }
  - { front: "อะไรขับเคลื่อนวัฏจักรน้ำ", back: "พลังงานจากดวงอาทิตย์ (ระเหย) และแรงโน้มถ่วง (ฝนตก น้ำไหลลงที่ต่ำ)" }
  - { front: "เมฆกับหมอกต่างกันอย่างไร", back: "เกิดจากการควบแน่นเหมือนกัน เมฆอยู่สูง หมอกอยู่ใกล้พื้น" }
  - { front: "ลูกเห็บเกิดอย่างไร", back: "ลมในเมฆฝนฟ้าคะนองพัดหยดน้ำขึ้นลงหลายรอบ น้ำแข็งพอกเป็นชั้นจนหนักแล้วตก" }
