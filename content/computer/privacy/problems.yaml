problems:
  - id: computer.society.privacy.p001
    topics: [computer.society.privacy]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็น **ข้อมูลส่วนบุคคลของเรา** ที่ไม่ควรบอกคนที่รู้จักทางออนไลน์"
    choices:
      - { id: a, text: "ที่อยู่บ้านของเรา", correct: true }
      - { id: b, text: "ชื่อการ์ตูนที่ฉายทางทีวี", feedback: "ชื่อการ์ตูนเป็นข้อมูลทั่วไป ทุกคนรู้ได้ ไม่ได้บอกว่าเราเป็นใครหรืออยู่ที่ไหน" }
      - { id: c, text: "สูตรคูณแม่ 7", feedback: "สูตรคูณเป็นความรู้ทั่วไป ไม่เกี่ยวกับตัวเรา" }
      - { id: d, text: "ชื่อจังหวัดที่เป็นเมืองหลวงของไทย", feedback: "เป็นข้อเท็จจริงทั่วไป ไม่ใช่ข้อมูลของเรา" }
    hints:
      - "ข้อมูลส่วนบุคคลบอกได้ว่าเราเป็นใครหรืออยู่ที่ไหน"
      - "ข้อใดเป็นข้อมูลของเราคนเดียว ไม่ใช่ความรู้ทั่วไป"
    solution: "ที่อยู่บ้านบอกได้ว่าเราอยู่ที่ไหน จึงเป็นข้อมูลส่วนบุคคลของเรา ถ้าคนแปลกหน้ารู้อาจตามมาถึงบ้านได้ ข้อที่เหลือเป็นความรู้ทั่วไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.privacy.p002
    topics: [computer.society.privacy]
    difficulty: 1
    type: match
    stem: "จับคู่ข้อมูลกับประเภท"
    pairs:
      - { left: "เลขบัตรประชาชน 13 หลัก", right: "ระบุตัวได้ทางตรง" }
      - { left: "ห้องเรียน เพศ และปีเกิด", right: "รวมกันแล้วระบุตัวได้ทางอ้อม" }
      - { left: "ลายนิ้วมือที่ใช้สแกนเข้าโรงเรียน", right: "ข้อมูลอ่อนไหว" }
      - { left: "อุณหภูมิเฉลี่ยของกรุงเทพฯ เดือนเมษายน", right: "ไม่ใช่ข้อมูลส่วนบุคคล" }
    hints:
      - "ข้อมูลชิ้นเดียวที่บอกได้ทันทีว่าเป็นใคร คือทางตรง"
      - "ลายนิ้วมือเป็นข้อมูลชีวภาพ ซึ่ง PDPA มาตรา 26 จัดเป็นประเภทที่คุมเข้มกว่าปกติ"
    solution: "เลขบัตรประชาชนชี้ตัวได้ทันที (ทางตรง) ห้อง เพศ ปีเกิด ต้องรวมกันจึงชี้ตัวได้ (ทางอ้อม) ลายนิ้วมือเป็นข้อมูลชีวภาพ จัดเป็นข้อมูลอ่อนไหว อุณหภูมิของเมืองไม่เกี่ยวกับบุคคลใด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.privacy.p003
    topics: [computer.society.privacy]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "มดเปิดเว็บร้านขายรองเท้าดูอยู่ 5 นาที **โดยไม่ได้สมัครสมาชิกหรือกรอกอะไรเลย** เว็บนั้นอาจเก็บข้อมูลใดของมดได้โดยอัตโนมัติ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ที่อยู่ IP ของเครื่อง", correct: true }
      - { id: b, text: "หน้าสินค้าที่เปิดดูและเวลาที่ดูแต่ละหน้า", correct: true }
      - { id: c, text: "คุกกี้ที่ใช้จำเครื่องของมดเมื่อกลับมาอีกครั้ง", correct: true }
      - { id: d, text: "ชื่อจริงและนามสกุลของมด", feedback: "เว็บไม่รู้ชื่อจริงถ้ามดไม่ได้กรอกหรือเข้าระบบ แต่ถ้าภายหลังมดสมัคร เว็บอาจผูกข้อมูลการเข้าชมเดิมกับชื่อได้" }
    hints:
      - "คิดถึงข้อมูลที่เบราว์เซอร์ส่งไปทุกครั้งที่ขอหน้าเว็บ"
      - "ข้อมูลที่ระบบเก็บอัตโนมัติไม่ต้องให้ผู้ใช้พิมพ์เอง"
    solution: "ทุกคำขอหน้าเว็บส่งที่อยู่ IP ไปด้วย เว็บบันทึกได้ว่าเปิดหน้าใดนานเท่าใด และฝากคุกกี้ไว้จำเครื่อง ทั้งหมดเกิดโดยมดไม่ได้พิมพ์อะไร ส่วนชื่อจริงต้องให้เองจึงจะรู้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.privacy.p004
    topics: [computer.society.privacy]
    difficulty: 2
    type: mcq
    stem: "ต้นโพสต์ภาพล้อเพื่อนลงโซเชียล 10 นาทีต่อมารู้สึกผิดจึงลบโพสต์ ข้อใดถูกต้องที่สุด"
    choices:
      - { id: a, text: "ภาพอาจยังอยู่ เพราะมีคนแคปหน้าจอ ดาวน์โหลด หรือแชร์ต่อไปแล้ว", correct: true }
      - { id: b, text: "ลบแล้วภาพหายจากอินเทอร์เน็ตทันทีและถาวร", feedback: "การลบเอาออกจากหน้าโปรไฟล์ของเรา แต่สำเนาที่คนอื่นเก็บไว้หรือที่อยู่ในระบบสำรองยังอาจอยู่" }
      - { id: c, text: "ไม่มีใครเห็น เพราะ 10 นาทีสั้นเกินไป", feedback: "ภาพบนโซเชียลอาจมีคนเห็นและบันทึกได้ภายในไม่กี่วินาที" }
      - { id: d, text: "ภาพจะหายเองเมื่อครบ 1 ปี", feedback: "ไม่มีกติกาแบบนั้น สำเนาที่คนอื่นเก็บไว้ไม่มีวันหมดอายุ" }
    hints:
      - "ระหว่าง 10 นาทีนั้นมีใครทำอะไรกับภาพได้บ้าง"
      - "นึกถึงความคงทนของร่องรอยดิจิทัล"
    solution: "ร่องรอยดิจิทัลลบให้หมดยาก ภาพอาจถูกแคปหน้าจอ ดาวน์โหลด หรือแชร์ต่อแล้ว ทางที่ดีคือคิดก่อนโพสต์ และขอโทษเพื่อนพร้อมขอให้คนที่บันทึกไว้ลบด้วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.privacy.p005
    topics: [computer.society.privacy]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "แอปไฟฉายในภาพขออนุญาตเข้าถึงหลายอย่าง สิทธิ์ใดที่ **ไม่จำเป็น** ต่อการเปิดไฟฉาย และควรกดไม่อนุญาต (เลือกทุกข้อที่ถูก)"
    figure:
      src: flashlight-app.svg
      alt: "หน้าจอโทรศัพท์ แอปไฟฉายสว่างมาก (ชื่อสมมติ) ขออนุญาตเข้าถึงห้าอย่าง ได้แก่ กล้องและแฟลช ตำแหน่งที่ตั้งตลอดเวลา รายชื่อผู้ติดต่อ ไมโครโฟน และรูปภาพทั้งหมดในเครื่อง ด้านล่างมีปุ่มไม่อนุญาตและปุ่มอนุญาตทั้งหมด"
    choices:
      - { id: a, text: "ตำแหน่งที่ตั้งตลอดเวลา", correct: true }
      - { id: b, text: "รายชื่อผู้ติดต่อ", correct: true }
      - { id: c, text: "ไมโครโฟน", correct: true }
      - { id: d, text: "รูปภาพทั้งหมดในเครื่อง", correct: true }
      - { id: e, text: "กล้องและแฟลช", feedback: "ไฟฉายของโทรศัพท์คือไฟแฟลชของกล้อง แอปจึงต้องสั่งงานแฟลชได้" }
    hints:
      - "ถามทีละสิทธิ์ว่าการเปิดไฟต้องใช้สิ่งนี้หรือไม่"
      - "ไฟฉายของโทรศัพท์คือไฟชิ้นเดียวกับแฟลชของกล้อง"
    solution: "การเปิดไฟใช้แค่แฟลช สิทธิ์ตำแหน่ง รายชื่อผู้ติดต่อ ไมโครโฟน และรูปภาพไม่เกี่ยวกับงานนี้ แอปที่ขอเกินจำเป็นอาจนำข้อมูลไปขายหรือใช้ติดตามผู้ใช้ จึงควรไม่อนุญาต หรือเลือกแอปอื่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.privacy.p006
    topics: [computer.society.privacy]
    difficulty: 2
    type: order
    stem: "เรียงขั้นของวงจรข้อมูลส่วนบุคคลที่ผู้ควบคุมข้อมูลต้องทำตาม PDPA ตั้งแต่ก่อนเก็บจนเลิกใช้"
    items:
      - "แจ้งวัตถุประสงค์และขอความยินยอม"
      - "เก็บเฉพาะข้อมูลที่จำเป็นต่อวัตถุประสงค์"
      - "ใช้ตามวัตถุประสงค์ที่แจ้งและรักษาความปลอดภัย"
      - "ลบหรือทำลายเมื่อพ้นความจำเป็น"
    hints:
      - "ต้องบอกเจ้าของข้อมูลก่อนหรือขณะเก็บ"
      - "ขั้นสุดท้ายคือเมื่อไม่ต้องใช้ข้อมูลแล้ว"
    solution: "แจ้งวัตถุประสงค์และขอความยินยอม (มาตรา 19, 23) → เก็บเท่าที่จำเป็น (มาตรา 22) → ใช้ตามวัตถุประสงค์และรักษาความปลอดภัย (มาตรา 21, 37) → ลบหรือทำลายเมื่อพ้นความจำเป็น (มาตรา 37)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.privacy.p007
    topics: [computer.society.privacy]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ร้านก๋วยเตี๋ยวทำฟอร์มออนไลน์ให้ลูกค้าจองโต๊ะ เพื่อเตรียมโต๊ะและโทรยืนยันการจอง ช่องใด **ไม่ควรมี** ตามหลักเก็บเท่าที่จำเป็น (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "วันเดือนปีเกิด", correct: true }
      - { id: b, text: "เลขบัตรประชาชน", correct: true }
      - { id: c, text: "โรคประจำตัว", correct: true }
      - { id: d, text: "จำนวนคน วันและเวลาที่จะมา", feedback: "ต้องใช้เตรียมโต๊ะ จึงจำเป็นต่อวัตถุประสงค์" }
      - { id: e, text: "ชื่อที่ใช้จองและเบอร์โทร", feedback: "ต้องใช้โทรยืนยันและเรียกชื่อเมื่อมาถึง จึงจำเป็น" }
    hints:
      - "วัตถุประสงค์มีสองอย่าง เตรียมโต๊ะ และโทรยืนยัน"
      - "ช่องใดไม่ช่วยงานสองอย่างนี้เลย"
    solution: "การจองใช้แค่ชื่อ เบอร์โทร จำนวนคน วันและเวลา วันเกิดและเลขบัตรประชาชนไม่เกี่ยว ส่วนโรคประจำตัวเป็นข้อมูลสุขภาพซึ่งเป็นข้อมูลอ่อนไหว (มาตรา 26) ถ้าร้านอยากรู้เรื่องแพ้อาหาร ควรถามเฉพาะเรื่องแพ้อาหารเป็นช่องที่ไม่บังคับ และบอกว่าจะใช้เพื่อเตรียมอาหาร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.privacy.p008
    topics: [computer.society.privacy]
    difficulty: 3
    type: match
    stem: "จับคู่สิ่งที่เจ้าของข้อมูลต้องการกับสิทธิตาม PDPA"
    pairs:
      - { left: "อยากรู้ว่าแอปเก็บข้อมูลอะไรของเราไว้บ้าง และขอสำเนา", right: "สิทธิขอเข้าถึงและขอสำเนา" }
      - { left: "เลิกใช้แอปแล้ว อยากให้ข้อมูลของเราหายไปจากระบบ", right: "สิทธิขอให้ลบหรือทำลาย" }
      - { left: "ไม่อยากให้ร้านส่งโฆษณาจากข้อมูลการซื้อของเราอีก", right: "สิทธิคัดค้าน" }
      - { left: "ย้ายค่ายมือถือ อยากนำประวัติการใช้งานไปให้ค่ายใหม่", right: "สิทธิขอรับข้อมูลไปใช้กับผู้ให้บริการอื่น" }
    hints:
      - "อ่านว่าเจ้าของข้อมูลอยากให้เกิดอะไรกับข้อมูล ดู เอาออก หยุดใช้ หรือย้าย"
      - "ทบทวนสิทธิตามมาตรา 30 ถึง 33 ในภาพวงจรข้อมูล"
    solution: "อยากดู = ขอเข้าถึงและขอสำเนา (มาตรา 30) อยากให้หาย = ขอให้ลบ (มาตรา 33) ไม่อยากให้ใช้ทำโฆษณา = คัดค้าน (มาตรา 32) อยากย้ายข้อมูล = ขอรับข้อมูลไปใช้กับผู้ให้บริการอื่น (มาตรา 31)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.privacy.p009
    topics: [computer.society.privacy]
    difficulty: 3
    type: numeric
    stem: "โรงเรียนแชร์ตารางน้ำหนักนักเรียนในภาพ โดยลบชื่อออกแล้ว ถ้าเพื่อนที่รู้ห้อง เพศ และปีเกิดของทุกคนอ่านตารางนี้ จะรู้น้ำหนักของนักเรียนได้แน่ชัดกี่คน (นับแถวที่ไม่มีแถวอื่นซึ่งห้อง เพศ และปีเกิดตรงกัน)"
    figure:
      src: weight-table.svg
      alt: "ตาราง 10 แถว คอลัมน์ ลำดับ ห้อง เพศ ปีเกิด และน้ำหนัก แถว 1 ม.3/1 ชาย 2553 47 กิโลกรัม แถว 2 ม.3/1 หญิง 2553 52 แถว 3 ม.3/1 หญิง 2553 45 แถว 4 ม.3/1 ชาย 2552 60 แถว 5 ม.3/2 หญิง 2553 41 แถว 6 ม.3/2 ชาย 2553 55 แถว 7 ม.3/2 ชาย 2553 58 แถว 8 ม.3/2 หญิง 2552 49 แถว 9 ม.3/2 ชาย 2554 50 แถว 10 ม.3/1 หญิง 2554 43"
    answer: { value: 6, unit: คน }
    hints:
      - "จัดกลุ่มแถวที่ห้อง เพศ และปีเกิดเหมือนกันทั้งสามช่อง"
      - "แถวที่อยู่ในกลุ่มขนาด 1 ชี้ตัวได้แน่ชัด ส่วนกลุ่มที่มี 2 แถวยังบอกไม่ได้ว่าใครเป็นใคร"
    misconceptions:
      - { match: 8, feedback: "8 คือจำนวนกลุ่มที่ต่างกัน แต่มี 2 กลุ่มที่มีคนละ 2 แถว ซึ่งยังชี้ตัวไม่ได้แน่ชัด" }
      - { match: 0, feedback: "การลบชื่อไม่พอ ห้อง เพศ และปีเกิดรวมกันก็ระบุตัวได้ทางอ้อม" }
    solution: "กลุ่มที่มี 2 แถว: ม.3/1 หญิง 2553 (แถว 2, 3) และ ม.3/2 ชาย 2553 (แถว 6, 7) กลุ่มที่เหลือมีแถวเดียว คือแถว 1, 4, 5, 8, 9, 10 รวม 6 คนที่ถูกรู้น้ำหนักแน่ชัด แม้จะลบชื่อแล้ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.privacy.p010
    topics: [computer.society.privacy]
    difficulty: 3
    type: mcq
    stem: "ใบเตยขี่จักรยานไปเรียนพิเศษตอนเย็น พ่อแม่อยากรู้ว่าถึงบ้านหรือยัง การแชร์ตำแหน่งแบบใดได้ประโยชน์ด้านความปลอดภัยโดยเสี่ยงน้อยที่สุด"
    choices:
      - { id: a, text: "แชร์ตำแหน่งสดเฉพาะกับพ่อแม่ และปิดเมื่อถึงบ้าน", correct: true }
      - { id: b, text: "เปิดตำแหน่งสดในโปรไฟล์สาธารณะ ให้ทุกคนช่วยกันดู", feedback: "คนแปลกหน้าก็เห็นด้วย และรู้เส้นทางประจำของใบเตย ซึ่งเสี่ยงต่อการถูกตาม" }
      - { id: c, text: "โพสต์เช็กอินทุกจุดที่ผ่านลงโซเชียล", feedback: "เปิดเผยเส้นทางและเวลาให้คนจำนวนมาก ประโยชน์ไม่เพิ่ม แต่ความเสี่ยงเพิ่มมาก" }
      - { id: d, text: "ไม่บอกใครเลยว่าอยู่ที่ไหน", feedback: "เป็นส่วนตัวที่สุด แต่เสียประโยชน์ด้านความปลอดภัยที่พ่อแม่ต้องการ ไม่ใช่การชั่งน้ำหนักที่ดีที่สุด" }
    hints:
      - "ใครบ้างที่จำเป็นต้องรู้ตำแหน่ง"
      - "เลือกทางที่ได้ประโยชน์ครบ แต่เปิดเผยให้น้อยที่สุดทั้งจำนวนคนและระยะเวลา"
    solution: "การเปิดเผยข้อมูลต้องชั่งประโยชน์กับความเสี่ยง พ่อแม่เท่านั้นที่ต้องรู้ และต้องรู้แค่ช่วงเดินทาง การแชร์เฉพาะพ่อแม่แล้วปิดเมื่อถึงบ้านจึงได้ประโยชน์ครบโดยเสี่ยงน้อยที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.privacy.p011
    topics: [computer.society.privacy]
    difficulty: 2
    type: text
    stem: "ตาม PDPA มาตรา 26 ข้อมูลศาสนา ข้อมูลสุขภาพ และลายนิ้วมือ จัดเป็นข้อมูลส่วนบุคคลประเภทที่กฎหมายคุมเข้มกว่าปกติ ประเภทนี้เรียกว่าข้อมูลอะไร (ตอบเป็นคำ)"
    accepted: ["ข้อมูลอ่อนไหว", "อ่อนไหว", "ข้อมูลส่วนบุคคลอ่อนไหว", "ข้อมูลส่วนบุคคลที่อ่อนไหว", "sensitive data", "sensitive"]
    misconceptions:
      - { match: "ข้อมูลทั่วไป", feedback: "ข้อมูลทั่วไปคุมตามปกติ ประเภทที่คุมเข้มกว่าเพราะถ้ารั่วอาจทำให้ถูกเลือกปฏิบัติมีชื่อเฉพาะ" }
      - { match: "ข้อมูลชีวภาพ", feedback: "ข้อมูลชีวภาพ (เช่น ลายนิ้วมือ) เป็นแค่ชนิดหนึ่งในประเภทนี้ ศาสนาและสุขภาพไม่ใช่ข้อมูลชีวภาพ" }
    hints:
      - "ข้อมูลกลุ่มนี้ถ้ารั่วอาจทำให้ถูกเลือกปฏิบัติ"
      - "คำนี้แปลจาก sensitive data"
    solution: "ข้อมูลอ่อนไหว (sensitive data) เช่น เชื้อชาติ ศาสนา ความคิดเห็นทางการเมือง สุขภาพ ความพิการ ประวัติอาชญากรรม ข้อมูลพันธุกรรม และข้อมูลชีวภาพ การเก็บต้องได้รับความยินยอมโดยชัดแจ้งหรือเข้าข้อยกเว้นตามกฎหมาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.privacy.p012
    topics: [computer.society.privacy]
    difficulty: 3
    type: mcq
    stem: "บริษัทแห่งหนึ่งทราบว่าข้อมูลลูกค้ารั่วเมื่อวันจันทร์ เวลา 10:00 น. และการรั่วนี้มีความเสี่ยงต่อสิทธิของลูกค้า ตาม PDPA มาตรา 37 บริษัทต้องแจ้งสำนักงานคุ้มครองข้อมูลส่วนบุคคล **ช้าสุด** ภายในเวลาใด"
    choices:
      - { id: a, text: "วันพฤหัสบดี 10:00 น.", correct: true }
      - { id: b, text: "วันอังคาร 10:00 น.", feedback: "นั่นคือ 24 ชั่วโมง กฎหมายให้เวลา 72 ชั่วโมง" }
      - { id: c, text: "วันพุธ 10:00 น.", feedback: "นั่นคือ 48 ชั่วโมง ยังไม่ครบ 72 ชั่วโมง" }
      - { id: d, text: "วันจันทร์ถัดไป 10:00 น.", feedback: "นั่นคือ 7 วัน (168 ชั่วโมง) ช้ากว่าที่กฎหมายกำหนดมาก" }
    hints:
      - "มาตรา 37 (4) ให้แจ้งภายใน 72 ชั่วโมงนับแต่ทราบเหตุ"
      - "72 ชั่วโมงเท่ากับกี่วัน แล้วนับต่อจากวันจันทร์ 10:00 น."
    solution: "72 ชั่วโมง = 3 วัน นับจากวันจันทร์ 10:00 น. ไป 3 วันคือวันพฤหัสบดี 10:00 น. กฎหมายให้แจ้งโดยไม่ชักช้าเท่าที่ทำได้ เวลานี้จึงเป็นเส้นตาย ไม่ใช่เวลาที่ควรรอ และถ้าเสี่ยงสูงต้องแจ้งลูกค้าพร้อมแนวทางเยียวยาด้วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.privacy.p013
    topics: [computer.society.privacy]
    difficulty: 4
    type: numeric
    stem: "จากตารางน้ำหนักในภาพ โรงเรียนแก้ปัญหาโดยลบคอลัมน์ **ปีเกิด** ออก เหลือห้อง เพศ และน้ำหนัก หลังแก้แล้ว กลุ่มที่เล็กที่สุดซึ่งมีห้องและเพศตรงกันมีกี่คน (ค่านี้เรียกว่า k ยิ่งมากยิ่งชี้ตัวยาก)"
    figure:
      src: weight-table.svg
      alt: "ตาราง 10 แถว คอลัมน์ ลำดับ ห้อง เพศ ปีเกิด และน้ำหนัก แถว 1 ม.3/1 ชาย 2553 47 กิโลกรัม แถว 2 ม.3/1 หญิง 2553 52 แถว 3 ม.3/1 หญิง 2553 45 แถว 4 ม.3/1 ชาย 2552 60 แถว 5 ม.3/2 หญิง 2553 41 แถว 6 ม.3/2 ชาย 2553 55 แถว 7 ม.3/2 ชาย 2553 58 แถว 8 ม.3/2 หญิง 2552 49 แถว 9 ม.3/2 ชาย 2554 50 แถว 10 ม.3/1 หญิง 2554 43"
    answer: { value: 2, unit: คน }
    hints:
      - "เหลือแค่สองคอลัมน์สำหรับจัดกลุ่ม คือห้องและเพศ จึงมีได้สูงสุด 4 กลุ่ม"
      - "นับจำนวนแถวในแต่ละกลุ่ม แล้วเลือกค่าที่น้อยที่สุด"
    misconceptions:
      - { match: 3, feedback: "3 คือขนาดของกลุ่มที่ใหญ่ที่สุด k ต้องดูกลุ่มที่เล็กที่สุด เพราะคนในกลุ่มเล็กเสี่ยงที่สุด" }
      - { match: 4, feedback: "4 คือจำนวนกลุ่ม ไม่ใช่จำนวนคนในกลุ่ม" }
    solution: "ม.3/1 ชาย: แถว 1, 4 = 2 คน ม.3/1 หญิง: แถว 2, 3, 10 = 3 คน ม.3/2 หญิง: แถว 5, 8 = 2 คน ม.3/2 ชาย: แถว 6, 7, 9 = 3 คน กลุ่มเล็กสุดมี 2 คน จึง k = 2 ไม่มีใครถูกชี้ตัวได้แน่ชัดแล้ว แต่เพื่อนในกลุ่ม 2 คนก็ยังเดาได้ครึ่งต่อครึ่ง ถ้าต้องการปลอดภัยกว่านี้ควรแชร์เฉพาะค่าเฉลี่ยของทั้งห้อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.privacy.p014
    topics: [computer.society.privacy]
    difficulty: 4
    type: mcq
    stem: "นาฬิกาออกกำลังกายเก็บอัตราการเต้นของหัวใจและเวลานอนทุกคืน ข้อใดเป็นข้อกังวลเรื่องความเป็นส่วนตัวที่ **ผู้ใช้มักมองไม่เห็น** มากที่สุด"
    choices:
      - { id: a, text: "ระบบนำข้อมูลไปอนุมานเรื่องสุขภาพหรือความเครียด แล้วส่งต่อให้บริษัทอื่น เช่น บริษัทประกันหรือโฆษณา", correct: true }
      - { id: b, text: "หน้าจอนาฬิกาแสดงอัตราการเต้นของหัวใจให้ผู้ใช้เห็น", feedback: "ผู้ใช้เห็นเองอยู่แล้ว ไม่ใช่สิ่งที่ซ่อนอยู่" }
      - { id: c, text: "ผู้ใช้ต้องชาร์จแบตเตอรี่ทุกสองวัน", feedback: "เป็นเรื่องความสะดวก ไม่เกี่ยวกับความเป็นส่วนตัว" }
      - { id: d, text: "ผู้ใช้พิมพ์ชื่อเล่นตอนตั้งค่าเครื่อง", feedback: "ผู้ใช้ให้ข้อมูลนี้เองและรู้ตัว ข้อกังวลสำคัญอยู่ที่การเก็บและการประมวลผลอัตโนมัติที่ผู้ใช้ไม่เห็น" }
    hints:
      - "แยกข้อมูลที่ผู้ใช้รู้ว่าให้ กับสิ่งที่ระบบทำต่อเบื้องหลัง"
      - "ข้อมูลที่ระบบอนุมานขึ้นเองอาจเป็นข้อมูลอ่อนไหว"
    solution: "ข้อมูลที่เก็บอัตโนมัติทุกคืนสามารถนำไปอนุมานเรื่องสุขภาพ ซึ่งเป็นข้อมูลอ่อนไหว ผู้ใช้มักไม่รู้ว่าระบบสรุปอะไรได้และส่งต่อให้ใคร ผู้ใช้จึงควรอ่านนโยบายความเป็นส่วนตัวและปิดการแชร์ที่ไม่จำเป็น ส่วนผู้ผลิตต้องแจ้งวัตถุประสงค์และขอความยินยอมโดยชัดแจ้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.privacy.p015
    topics: [computer.society.privacy]
    difficulty: 4
    type: match
    stem: "นักเรียนกำลังออกแบบแอปบันทึกการยืมหนังสือห้องสมุด จับคู่เทคนิคปกป้องความเป็นส่วนตัวกับตัวอย่างการใช้"
    pairs:
      - { left: "เก็บเท่าที่จำเป็น", right: "ไม่มีช่องวันเกิด เพราะการยืมหนังสือไม่ต้องใช้" }
      - { left: "แฝงชื่อ", right: "ใช้รหัสสมาชิกแทนชื่อในตารางการยืม และเก็บตารางรหัสกับชื่อแยกไว้" }
      - { left: "รวมเป็นกลุ่ม", right: "รายงานผู้บริหารเป็นจำนวนการยืมต่อชั้นเรียน ไม่แสดงรายคน" }
      - { left: "กำหนดระยะเวลาเก็บ", right: "ลบประวัติการยืมเมื่อคืนหนังสือครบและจบปีการศึกษา" }
      - { left: "กำหนดสิทธิ์การเข้าถึง", right: "บรรณารักษ์ดูประวัติได้ ส่วนนักเรียนดูได้เฉพาะของตัวเอง" }
    hints:
      - "แต่ละเทคนิคตอบคำถามต่างกัน เก็บอะไร เก็บในรูปใด เก็บนานเท่าใด และใครเห็น"
      - "การรวมเป็นกลุ่มคือรายงานเป็นจำนวนรวม ไม่แสดงรายคน"
    solution: "ไม่เก็บวันเกิด = เก็บเท่าที่จำเป็น ใช้รหัสแทนชื่อ = แฝงชื่อ รายงานต่อชั้นเรียน = รวมเป็นกลุ่ม ลบเมื่อจบปี = กำหนดระยะเวลาเก็บ บรรณารักษ์กับนักเรียนเห็นไม่เท่ากัน = กำหนดสิทธิ์การเข้าถึง"
