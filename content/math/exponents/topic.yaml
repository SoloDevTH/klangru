id: math.number.exponents
subject: math
title: { th: เลขยกกำลัง, en: Exponents }
summary: เขียนการคูณซ้ำในรูปเลขยกกำลัง หาค่าเลขยกกำลังที่ฐานเป็นจำนวนลบหรือศูนย์ และคำนวณตามลำดับการดำเนินการที่มีเลขยกกำลังได้ถูกต้อง
difficulty: 2.5
minutes: 30
prerequisites: [math.number.integers]
encompasses:
  - { id: math.number.integers, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: square-cube-numbers.svg
    alt: "ซ้ายคือจุดเรียงเป็นสี่เหลี่ยมจัตุรัส 1, 4, 9 และ 16 จุด เขียนว่า 1² = 1, 2² = 4, 3² = 9, 4² = 16 ขวาคือลูกบาศก์ที่ต่อจากลูกบาศก์เล็ก 1, 8 และ 27 ก้อน เขียนว่า 1³ = 1, 2³ = 8, 3³ = 27"
    caption: "กำลังสองคือพื้นที่ของสี่เหลี่ยมจัตุรัส กำลังสามคือปริมาตรของลูกบาศก์"
  - { type: check, problem: math.exp.p015, prompt: "นับลูกบาศก์เล็กโดยไม่ต้องนับทีละก้อน" }
  - type: worked-example
    title: เขียนจำนวนเป็นผลคูณของเลขยกกำลังของจำนวนเฉพาะ
    problem: "เขียน 360 ในรูปผลคูณของเลขยกกำลังที่มีฐานเป็นจำนวนเฉพาะ"
    steps:
      - text: "หารด้วยจำนวนเฉพาะที่เล็กที่สุดซ้ำ ๆ: $360 \\div 2 = 180$, $180 \\div 2 = 90$, $90 \\div 2 = 45$"
      - text: "45 หารด้วย 2 ไม่ลงตัว จึงหารด้วย 3: $45 \\div 3 = 15$, $15 \\div 3 = 5$ และ 5 เป็นจำนวนเฉพาะ"
      - text: "ได้ $360 = 2 \\times 2 \\times 2 \\times 3 \\times 3 \\times 5$"
      - text: "รวมตัวที่ซ้ำเป็นเลขยกกำลัง: $360 = 2^3 \\times 3^2 \\times 5$"
        why: "เลขชี้กำลังบอกว่าจำนวนเฉพาะแต่ละตัวปรากฏกี่ครั้ง ตัวที่ปรากฏครั้งเดียวไม่ต้องเขียนเลขชี้กำลัง 1"
      - text: "ตรวจ: $8 \\times 9 \\times 5 = 360$ ✓"
    answer: "$360 = 2^3 \\times 3^2 \\times 5$"
  - type: worked-example
    title: ลำดับการดำเนินการที่มีฐานเป็นลบ
    problem: "หาค่า $-2^4 + (-2)^3 \\times 3 - (5 - 7)^2$"
    steps:
      - text: "ในวงเล็บก่อน: $5 - 7 = -2$ จึงเป็น $(-2)^2 = 4$"
      - text: "$-2^4$ ไม่มีวงเล็บครอบ $-2$ จึงยกกำลังเฉพาะ 2: $-2^4 = -16$"
        why: "เลขชี้กำลังติดอยู่กับตัวที่อยู่ติดกันเท่านั้น เครื่องหมายลบด้านหน้าใส่ทีหลัง"
      - text: "$(-2)^3 = -8$ (เลขชี้กำลังคี่ ผลเป็นลบ)"
      - text: "คูณ: $(-8) \\times 3 = -24$"
      - text: "รวม: $-16 + (-24) - 4 = -44$"
    answer: "$-44$"
  - { type: check, problem: math.exp.p017, prompt: "ยกกำลังทศนิยมต้องระวังตำแหน่งจุด" }
  - type: interactive
    title: เลขชี้กำลังคู่กับคี่ เมื่อฐานเป็นลบ
    caption: กราฟคือ y = x ยกกำลัง n ลองเลื่อน n เป็น 2, 4, 6 แล้วดูฝั่ง x ติดลบ กราฟจะอยู่เหนือแกน x เสมอ (ผลเป็นบวก) แต่เมื่อ n เป็น 1, 3, 5 กราฟฝั่งนั้นจะอยู่ใต้แกน x (ผลเป็นลบ)
    widget:
      kind: function-plot
      functions: ["x^n"]
      sliders:
        - { name: n, min: 1, max: 6, step: 1, value: 2, label: เลขชี้กำลัง }
      x: [-2.5, 2.5]
      y: [-10, 10]
glossary:
  - { term: เลขยกกำลัง, definition: "การเขียนการคูณจำนวนเดียวกันซ้ำ ๆ แบบย่อ เช่น $2 \\times 2 \\times 2 = 2^3$" }
  - { term: ฐาน, definition: "จำนวนที่ถูกนำมาคูณซ้ำ เช่น ใน $2^3$ ฐานคือ 2" }
  - { term: เลขชี้กำลัง, definition: "จำนวนที่บอกว่าฐานถูกคูณกี่ตัว เช่น ใน $2^3$ เลขชี้กำลังคือ 3" }
flashcards:
  - { front: "$2^3$ เท่ากับ 6 หรือไม่", back: "ไม่ $2^3 = 2 \\times 2 \\times 2 = 8$ ส่วน 6 คือ $2 \\times 3$" }
  - { front: "$(-3)^2$ กับ $-3^2$ ต่างกันอย่างไร", back: "$(-3)^2 = (-3)(-3) = 9$ แต่ $-3^2 = -(3 \\times 3) = -9$ เพราะยกกำลังก่อนแล้วจึงใส่เครื่องหมายลบ" }
  - { front: "ฐานเป็นลบ ผลเป็นบวกหรือลบ", back: "เลขชี้กำลังคู่ได้บวก เลขชี้กำลังคี่ได้ลบ เช่น $(-2)^4 = 16$, $(-2)^3 = -8$" }
  - { front: "ลำดับการดำเนินการเมื่อมีเลขยกกำลัง", back: "วงเล็บ → เลขยกกำลัง → คูณหารจากซ้ายไปขวา → บวกลบจากซ้ายไปขวา" }
