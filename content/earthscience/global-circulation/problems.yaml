problems:
  - id: earthscience.atmosphere.global-circulation.p001
    topics: [earthscience.atmosphere.global-circulation]
    difficulty: 1
    type: mcq
    stem: "สาเหตุพื้นฐานที่ทำให้อากาศทั้งโลกเกิดการหมุนเวียนคือข้อใด"
    choices:
      - { id: a, text: "เขตร้อนได้รับพลังงานจากดวงอาทิตย์มากกว่าเขตขั้วโลก ความกดอากาศจึงต่างกัน", correct: true }
      - { id: b, text: "ดวงจันทร์ดึงอากาศให้เคลื่อนที่", feedback: "แรงไทดัลของดวงจันทร์ต่อบรรยากาศน้อยมาก ไม่ใช่ตัวขับเคลื่อนลมประจำ" }
      - { id: c, text: "ภูเขาสูงผลักอากาศให้เคลื่อนที่", feedback: "ภูเขาเปลี่ยนทิศลมเฉพาะที่ แต่ไม่ได้ให้พลังงานแก่การหมุนเวียนทั้งโลก" }
      - { id: d, text: "แรงคอริออลิสสร้างลมขึ้นเอง", feedback: "แรงคอริออลิสเปลี่ยนทิศของลมที่เคลื่อนที่อยู่แล้ว แต่ไม่ได้ทำให้อากาศเริ่มเคลื่อนที่" }
    hints:
      - "ลมต้องมีแหล่งพลังงาน"
      - "แสงตกตั้งฉากที่เขตร้อนและตกเฉียงที่ขั้วโลก"
    solution: "พลังงานจากดวงอาทิตย์ที่ได้รับไม่เท่ากัน ทำให้อุณหภูมิและความกดอากาศต่างกัน อากาศจึงเคลื่อนที่เพื่อขนความร้อนจากเขตร้อนไปขั้วโลก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.global-circulation.p002
    topics: [earthscience.atmosphere.global-circulation]
    difficulty: 1
    type: match
    stem: "จับคู่แนวความกดอากาศกับลักษณะภูมิอากาศ"
    pairs:
      - { left: "ร่องความกดอากาศต่ำบริเวณศูนย์สูตร (ITCZ)", right: "ฝนตกชุก ป่าดิบชื้น" }
      - { left: "แนวความกดอากาศสูงกึ่งเขตร้อน (ราว 30°)", right: "อากาศแห้ง ทะเลทราย" }
      - { left: "เขตลมตะวันตก (30°–60°)", right: "มีพายุตามแนวปะทะอากาศผ่านบ่อย" }
      - { left: "ความกดอากาศสูงขั้วโลก", right: "หนาวจัดและแห้ง" }
    hints:
      - "อากาศยกตัวทำให้เกิดเมฆ อากาศจมตัวทำให้ท้องฟ้าโปร่ง"
      - "ที่ 0° อากาศยกตัว ที่ 30° อากาศจมตัว"
    solution: "ITCZ อากาศยกตัว ฝนชุก แนว 30° อากาศจมตัว แห้ง เป็นทะเลทราย เขตลมตะวันตกมีพายุผ่านบ่อย และขั้วโลกหนาวจัดและแห้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.global-circulation.p003
    topics: [earthscience.atmosphere.global-circulation]
    difficulty: 2
    type: mcq
    stem: "จรวดถูกยิงจากเชียงใหม่ไปทางทิศเหนือตรง ๆ เมื่อมองจากพื้นโลก แรงคอริออลิสจะทำให้แนวเคลื่อนที่เบนไปทางใด"
    choices:
      - { id: a, text: "ทางขวา คือเบนไปทางทิศตะวันออก", correct: true }
      - { id: b, text: "ทางซ้าย คือเบนไปทางทิศตะวันตก", feedback: "การเบนไปทางซ้ายเกิดในซีกโลกใต้ เชียงใหม่อยู่ในซีกโลกเหนือ" }
      - { id: c, text: "ไม่เบนเลย เพราะเคลื่อนที่ตามแนวเหนือ–ใต้", feedback: "แรงคอริออลิสกระทำกับทุกทิศการเคลื่อนที่ในแนวราบ ยกเว้นที่เส้นศูนย์สูตร" }
      - { id: d, text: "ช้าลงแต่ไม่เปลี่ยนทิศ", feedback: "แรงคอริออลิสตั้งฉากกับทิศการเคลื่อนที่ จึงเปลี่ยนทิศ ไม่ได้เปลี่ยนอัตราเร็ว" }
    hints:
      - "ซีกโลกเหนือ แรงคอริออลิสเบนไปทางขวาของทิศที่เคลื่อน"
      - "หันหน้าไปทางทิศเหนือ มือขวาอยู่ทางทิศใด"
    solution: "เชียงใหม่อยู่ในซีกโลกเหนือ แรงคอริออลิสเบนไปทางขวาของทิศการเคลื่อนที่ เคลื่อนไปทางเหนือ ทางขวาคือทิศตะวันออก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.global-circulation.p004
    topics: [earthscience.atmosphere.global-circulation]
    difficulty: 2
    type: order
    stem: "เรียงการเคลื่อนที่ของอากาศในเซลล์แฮดลีย์ของซีกโลกเหนือ เริ่มจากเส้นศูนย์สูตร"
    items:
      - "อากาศร้อนชื้นที่เส้นศูนย์สูตรยกตัวขึ้น เกิดเมฆและฝน"
      - "อากาศชั้นบนไหลไปทางเหนือ"
      - "อากาศเย็นลงและจมตัวที่ละติจูดราว 30°"
      - "อากาศที่ผิวโลกไหลกลับหาเส้นศูนย์สูตร ถูกเบนเป็นลมค้าตะวันออกเฉียงเหนือ"
    hints:
      - "เริ่มจากที่ที่ร้อนที่สุด"
      - "ลมค้าคือขากลับที่ผิวโลก"
    solution: "ยกตัวที่ศูนย์สูตร → ไหลขึ้นเหนือในชั้นบน → จมตัวที่ราว 30° → ไหลกลับที่ผิวโลกเป็นลมค้าตะวันออกเฉียงเหนือ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.global-circulation.p005
    topics: [earthscience.atmosphere.global-circulation]
    difficulty: 2
    type: mcq
    stem: "ทะเลทรายสะฮาราและทะเลทรายอาหรับอยู่ราวละติจูด 20°–30° เหนือ เหตุผลหลักคือข้อใด"
    choices:
      - { id: a, text: "อยู่ใต้แนวความกดอากาศสูงกึ่งเขตร้อน อากาศแห้งจมตัว เมฆและฝนเกิดยาก", correct: true }
      - { id: b, text: "ได้รับแสงอาทิตย์มากที่สุดในโลก", feedback: "เขตศูนย์สูตรได้แสงมากพอกันหรือมากกว่า แต่มีฝนชุก สาเหตุของทะเลทรายคืออากาศจมตัว" }
      - { id: c, text: "อยู่ใกล้ร่องความกดอากาศต่ำ ITCZ", feedback: "ITCZ มีอากาศยกตัวและฝนชุก ตรงข้ามกับทะเลทราย" }
      - { id: d, text: "มีลมตะวันตกนำความชื้นมาจากมหาสมุทร", feedback: "ลมตะวันตกอยู่ที่ 30°–60° และถ้านำความชื้นมาก็จะทำให้ฝนตก ไม่ใช่ทะเลทราย" }
    hints:
      - "ที่ 30° อากาศในเซลล์แฮดลีย์ทำอะไร"
      - "อากาศจมตัวร้อนขึ้นและความชื้นสัมพัทธ์ลดลง"
    solution: "ที่ราว 30° อากาศในเซลล์แฮดลีย์จมตัวลง อัดตัวและร้อนขึ้น ความชื้นสัมพัทธ์ต่ำ เมฆเกิดยาก ฝนน้อย จึงเกิดแนวทะเลทรายใหญ่ของโลก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.global-circulation.p006
    topics: [earthscience.atmosphere.global-circulation]
    difficulty: 3
    type: numeric
    stem: "พารามิเตอร์คอริออลิส $f = 2\\Omega\\sin\\varphi$ โดย $\\Omega = 7.292 \\times 10^{-5}\\ \\mathrm{rad/s}$ ที่กรุงเทพฯ (ละติจูด 13.75° เหนือ) $f$ มีค่ากี่ $\\times 10^{-5}\\ \\mathrm{s^{-1}}$"
    answer: { value: 3.47, tolerance: 0.03, unit: "×10⁻⁵ s⁻¹" }
    misconceptions:
      - { match: 1.73, feedback: "ลืมคูณ 2 ในสูตร $f = 2\\Omega\\sin\\varphi$" }
      - { match: 14.17, feedback: "ใช้ $\\cos\\varphi$ แทน $\\sin\\varphi$ แรงคอริออลิสในแนวราบแปรตาม $\\sin\\varphi$ จึงเป็นศูนย์ที่เส้นศูนย์สูตร" }
    hints:
      - "$\\sin 13.75^\\circ \\approx 0.2377$"
      - "$f = 2 \\times 7.292 \\times 10^{-5} \\times 0.2377$"
    solution: "$f = 2(7.292 \\times 10^{-5})(0.2377) \\approx 3.47 \\times 10^{-5}\\ \\mathrm{s^{-1}}$ เพียงราวหนึ่งในสามของที่ละติจูด 45°"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.global-circulation.p007
    topics: [earthscience.atmosphere.global-circulation]
    difficulty: 3
    type: numeric
    stem: "ความกดอากาศต่างกัน 2 hPa ในระยะ 100 km ความหนาแน่นของอากาศ $1.2\\ \\mathrm{kg/m^3}$ ความเร่งจากแรงเกรเดียนต์ความกดอากาศ $a_p = \\dfrac{1}{\\rho}\\dfrac{\\Delta p}{\\Delta n}$ มีค่ากี่ $\\times 10^{-3}\\ \\mathrm{m/s^2}$"
    answer: { value: 1.67, tolerance: 0.02, unit: "×10⁻³ m/s²" }
    misconceptions:
      - { match: 0.0167, feedback: "ใช้ $\\Delta p = 2$ Pa ต้องแปลง 2 hPa เป็น 200 Pa" }
      - { match: 2, feedback: "ลืมหารด้วยความหนาแน่น 1.2" }
    hints:
      - "2 hPa = 200 Pa และ 100 km = $10^5$ m"
      - "$a_p = \\dfrac{200}{1.2 \\times 10^5}$"
    solution: "$a_p = \\dfrac{200}{1.2 \\times 10^5} \\approx 1.67 \\times 10^{-3}\\ \\mathrm{m/s^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.global-circulation.p008
    topics: [earthscience.atmosphere.global-circulation]
    difficulty: 3
    type: mcq
    stem: "แผนที่แสดงไอโซบาร์รอบหย่อมความกดอากาศต่ำในซีกโลกเหนือ จุด P อยู่ทางทิศใต้ของศูนย์กลาง ลมใกล้ผิวพื้นที่จุด P พัดไปทางใด"
    figure: { src: p-isobars.svg, alt: "แผนที่ซีกโลกเหนือ ทิศเหนืออยู่ด้านบน ไอโซบาร์เป็นวงรีซ้อนกันสี่วง 996, 1000, 1004 และ 1008 hPa จากในออกนอก ศูนย์กลางเขียนว่า ต่ำ จุด P อยู่ใต้ศูนย์กลาง ระหว่างเส้น 1000 กับ 1004 hPa" }
    choices:
      - { id: a, text: "ไปทางตะวันออกค่อนเหนือ คือหมุนทวนเข็มนาฬิกาและเฉียงเข้าหาศูนย์กลาง", correct: true }
      - { id: b, text: "ไปทางทิศเหนือตรงเข้าหาศูนย์กลาง", feedback: "ถ้าไม่มีแรงคอริออลิสลมจะพัดตรงเข้าหาศูนย์กลาง แต่แรงคอริออลิสเบนลมไปทางขวา ลมจึงหมุนวน" }
      - { id: c, text: "ไปทางตะวันตกค่อนเหนือ คือหมุนตามเข็มนาฬิกา", feedback: "การหมุนตามเข็มนาฬิกาเป็นลมรอบความกดอากาศต่ำในซีกโลกใต้ หรือรอบความกดอากาศสูงในซีกโลกเหนือ" }
      - { id: d, text: "ไปทางตะวันออกขนานกับไอโซบาร์พอดี", feedback: "ลมขนานไอโซบาร์พอดีคือลมชั้นบน ใกล้ผิวพื้นมีแรงเสียดทาน ลมจึงเฉียงเข้าหาศูนย์กลาง" }
    hints:
      - "ซีกโลกเหนือ ลมรอบความกดอากาศต่ำหมุนทวนเข็มนาฬิกา"
      - "ใต้ศูนย์กลาง การหมุนทวนเข็มนาฬิกาเคลื่อนไปทางทิศใด และแรงเสียดทานทำอะไรเพิ่ม"
    solution: "ซีกโลกเหนือ ลมรอบความกดอากาศต่ำหมุนทวนเข็มนาฬิกา ที่ด้านใต้ของศูนย์กลางจึงเคลื่อนไปทางตะวันออก แรงเสียดทานทำให้ลมเฉียงข้ามไอโซบาร์เข้าหาความกดอากาศต่ำ จึงเป็นทางตะวันออกค่อนเหนือ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.global-circulation.p009
    topics: [earthscience.atmosphere.global-circulation]
    difficulty: 3
    type: mcq
    stem: "ช่วงเดือนมิถุนายนถึงสิงหาคม กรมอุตุนิยมวิทยามักรายงานว่า \"ร่องมรสุมพาดผ่านภาคเหนือ\" แล้วกลับลงมาพาดผ่านภาคกลางและภาคใต้ในเดือนกันยายนถึงตุลาคม ข้อใดอธิบายได้ดีที่สุด"
    choices:
      - { id: a, text: "ร่องมรสุมคือ ITCZ ซึ่งเลื่อนตามตำแหน่งที่ดวงอาทิตย์ส่องตั้งฉาก ขึ้นเหนือช่วงกลางปีแล้วกลับลงใต้", correct: true }
      - { id: b, text: "ร่องมรสุมคือแนวความกดอากาศสูงกึ่งเขตร้อน ทำให้อากาศแห้ง", feedback: "แนวความกดอากาศสูงทำให้อากาศจมตัวและแห้ง แต่ร่องมรสุมทำให้ฝนชุก" }
      - { id: c, text: "ร่องมรสุมเกิดจากแผ่นดินไหวในทะเลอันดามัน", feedback: "ร่องมรสุมเป็นปรากฏการณ์ของบรรยากาศ ไม่เกี่ยวกับแผ่นดินไหว" }
      - { id: d, text: "ร่องมรสุมอยู่กับที่ตลอดปี แต่ลมพัดฝนไปที่ต่าง ๆ", feedback: "ตัวร่องมรสุมเลื่อนตำแหน่งจริงตามฤดู" }
    hints:
      - "ITCZ คือที่ที่ได้รับความร้อนมากที่สุดและอากาศยกตัว"
      - "ดวงอาทิตย์ส่องตั้งฉากไปทางเหนือสุดในเดือนมิถุนายน"
    solution: "ร่องมรสุมเป็นส่วนของ ITCZ ที่อากาศยกตัวและฝนชุก แนวนี้เลื่อนตามบริเวณที่ร้อนที่สุด ซึ่งตามดวงอาทิตย์ จึงเลื่อนขึ้นเหนือช่วงกลางปีและกลับลงใต้ช่วงปลายฤดูฝน ทำให้แต่ละภาคมีช่วงฝนชุกต่างกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.global-circulation.p010
    topics: [earthscience.atmosphere.global-circulation]
    difficulty: 4
    type: numeric
    stem: "ที่ละติจูด 45° เหนือ ($f = 1.03 \\times 10^{-4}\\ \\mathrm{s^{-1}}$) ความกดอากาศในชั้นบนลดลง 4 hPa ในระยะ 300 km ความหนาแน่นของอากาศ $1.2\\ \\mathrm{kg/m^3}$ ลมจีออสโทรฟิกมีอัตราเร็วกี่เมตรต่อวินาที"
    answer: { value: 10.8, tolerance: 0.2, unit: m/s }
    misconceptions:
      - { match: 0.108, feedback: "ใช้ 4 hPa เป็น 4 Pa ต้องแปลงเป็น 400 Pa" }
      - { match: 12.9, feedback: "ลืมหารด้วยความหนาแน่น 1.2" }
    hints:
      - "$a_p = \\dfrac{400}{1.2 \\times 3 \\times 10^5}$"
      - "$v_g = a_p / f$"
    solution: "$a_p = \\dfrac{400}{1.2 \\times 3 \\times 10^5} = 1.11 \\times 10^{-3}\\ \\mathrm{m/s^2}$ $v_g = \\dfrac{1.11 \\times 10^{-3}}{1.03 \\times 10^{-4}} \\approx 10.8\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.global-circulation.p011
    topics: [earthscience.atmosphere.global-circulation]
    difficulty: 4
    type: mcq
    stem: "พายุหมุนเขตร้อนแทบไม่เกิดภายในราว 5° จากเส้นศูนย์สูตร แม้น้ำทะเลจะอุ่นมาก เหตุผลหลักคือข้อใด"
    choices:
      - { id: a, text: "แรงคอริออลิสใกล้เส้นศูนย์สูตรน้อยมาก ลมที่ไหลเข้าหาความกดอากาศต่ำจึงไม่หมุนเป็นวง", correct: true }
      - { id: b, text: "เส้นศูนย์สูตรมีแรงเสียดทานมากที่สุด", feedback: "แรงเสียดทานขึ้นกับผิวพื้น ไม่ได้ขึ้นกับละติจูด และพายุเกิดเหนือทะเลที่แรงเสียดทานน้อย" }
      - { id: c, text: "เส้นศูนย์สูตรไม่มีความกดอากาศต่ำ", feedback: "แนว ITCZ ที่ศูนย์สูตรเป็นความกดอากาศต่ำ แต่ลมไหลตรงเข้าหาจนความกดอากาศเติมเต็มเร็ว" }
      - { id: d, text: "แรงสู่ศูนย์กลางที่ศูนย์สูตรเป็นศูนย์", feedback: "แรงสู่ศูนย์กลางขึ้นกับอัตราเร็วและรัศมีความโค้งของลม ไม่ได้เป็นศูนย์ที่ศูนย์สูตร" }
    hints:
