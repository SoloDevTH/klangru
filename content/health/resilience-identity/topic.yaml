id: health.mental.resilience-identity
subject: health
title: { th: ตัวตน จุดแข็ง และความยืดหยุ่นทางใจเมื่อเจอความล้มเหลวและการเปลี่ยนแปลง, en: "Identity, strengths and resilience through failure and change" }
summary: ตัวตนประกอบจากค่านิยม ความชอบ และคนรอบตัว ฝึกมองจุดแข็ง รับมือความล้มเหลวและการเปลี่ยนผ่าน และรู้เมื่อควรขอความช่วยเหลือ
difficulty: 3
minutes: 35
prerequisites: [health.family.family-and-self, health.family.friendships-relationships]
encompasses:
  - { id: health.family.family-and-self, weight: 0.2 }
  - { id: health.family.friendships-relationships, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ตัวตนประกอบจากหลายด้าน
    src: identity-circle.svg
    alt: "วงกลมตรงกลางเขียนว่า ตัวฉัน มีกล่องหกกล่องวางรอบวงและเชื่อมด้วยเส้นตรง กล่องเหล่านั้นคือ คุณลักษณะส่วนตัว ความชอบ ค่านิยมและความเชื่อ วัฒนธรรม ครอบครัว และเพื่อนและสถานที่"
    caption: "ตัวตนไม่ได้มาจากด้านเดียว แต่ประกอบจากหลายด้านที่เปลี่ยนไปตามประสบการณ์"
  - { type: check, problem: health.mental.resilience-identity.p002, prompt: "ลองคิดก่อนอ่านต่อ: จับคู่สิ่งต่าง ๆ กับส่วนที่ประกอบเป็นตัวตน" }
  - type: worked-example
    title: แบ่งเป้าหมายใหญ่เป็นเป้าหมายย่อยรายวัน
    problem: "น้องต้องการอ่านหนังสือให้จบ 240 หน้าใน 4 สัปดาห์ ต้องอ่านเฉลี่ยวันละกี่หน้า (ปัดเป็นทศนิยม 1 ตำแหน่ง)"
    steps:
      - text: "หาจำนวนวันทั้งหมดก่อน: 4 สัปดาห์ × 7 วัน = 28 วัน"
        why: "เป้าหมายรายวันต้องหารด้วยจำนวนวัน ไม่ใช่จำนวนสัปดาห์"
      - text: "หารจำนวนหน้าด้วยจำนวนวัน: 240 ÷ 28 ≈ 8.6 หน้าต่อวัน"
      - text: "ตรวจผล: 8.6 × 28 ≈ 240.8 หน้า ซึ่งมากกว่า 240 หน้าเล็กน้อย จึงทำได้ครบ"
        why: "การปัดขึ้นเล็กน้อยทำให้มั่นใจว่าจบแน่นอน และแบ่งเป้าให้เป็นขั้นย่อยที่ทำได้จริง"
    answer: "ประมาณ 8.6 หน้าต่อวัน"
  - type: figure
    title: กราฟสมมติของความมั่นใจหลังความล้มเหลว
    src: setback-curve.svg
    alt: "กราฟเส้นแสดงความมั่นใจสมมติ แกนนอนคือเวลา แกนตั้งคือความมั่นใจ เส้นเริ่มที่ระดับ 60 แล้วตกลงถึงระดับ 30 ตรงจุดที่เขียนว่า สอบตก และวางแผนขอความช่วยเหลือ จากนั้นค่อย ๆ สูงขึ้นถึงระดับประมาณ 70"
    caption: "ความมั่นใจมักลดลงหลังล้มเหลว และฟื้นได้เมื่อวางแผนและขอความช่วยเหลือ (เส้นนี้สมมติเพื่ออธิบาย)"
  - type: worked-example
    title: เลือกกลยุทธ์ที่ได้ผลจริงด้วยอัตราส่วน
    problem: "กลยุทธ์ A ได้ผล 6 ใน 8 ครั้ง กลยุทธ์ B ได้ผล 9 ใน 12 ครั้ง ควรเลือกกลยุทธ์ใดจากผลนี้"
    steps:
      - text: "คำนวณอัตราของ A: 6 ÷ 8 × 100 = 75%"
      - text: "คำนวณอัตราของ B: 9 ÷ 12 × 100 = 75%"
        why: "B มีจำนวนครั้งที่ได้ผลมากกว่า (9 > 6) แต่ต้องดูอัตราเทียบกับจำนวนครั้งทั้งหมด"
      - text: "สรุป: อัตราเท่ากัน จึงควรลองดูต่อว่าวิธีใดเหมาะกับตัวเรามากกว่า"
    answer: "ทั้งสองกลยุทธ์ได้ผล 75% เท่ากัน"
  - { type: check, problem: health.mental.resilience-identity.p011, prompt: "ลองคิดก่อนอ่านต่อ: ข้อใดเป็นตัวอย่างของการเรียนรู้จากความล้มเหลว" }
glossary:
  - { term: ตัวตน (identity), definition: "ความเข้าใจว่าเราเป็นใคร ประกอบจากคุณลักษณะ ความชอบ ค่านิยม ความเชื่อ ครอบครัว เพื่อน และวัฒนธรรม" }
  - { term: ความยืดหยุ่นทางใจ (resilience), definition: "ความสามารถกลับมารับมือกับความยากลำบากได้หลังเจอความล้มเหลวหรือการเปลี่ยนแปลง ซึ่งฝึกได้" }
  - { term: ปัจจัยปกป้อง, definition: "สิ่งที่ช่วยลดผลกระทบจากเรื่องยาก เช่น ผู้ใหญ่หรือเพื่อนที่ไว้ใจ การนอนและการดูแลตัวเอง และความสามารถที่ภูมิใจ" }
  - { term: ช่วงเปลี่ยนผ่าน (transition), definition: "ช่วงที่ชีวิตเปลี่ยน เช่น ย้ายโรงเรียน ขึ้นมัธยม ย้ายบ้าน หรือครอบครัวเปลี่ยน" }
flashcards:
  - { front: "ตัวตนประกอบจากอะไรบ้าง", back: "คุณลักษณะส่วนตัว ความชอบ ค่านิยม ความเชื่อ วัฒนธรรม ครอบครัว เพื่อน และสถานที่" }
  - { front: "ความยืดหยุ่นทางใจคืออะไร", back: "ความสามารถกลับมารับมือเรื่องยากได้หลังเจอความล้มเหลว ซึ่งฝึกได้" }
  - { front: "ปัจจัยปกป้องที่ช่วยเมื่อเจอเรื่องยากมีอะไรบ้าง", back: "ผู้ใหญ่หรือเพื่อนที่ไว้ใจ การนอนและดูแลตัวเอง และความสามารถที่ภูมิใจ" }
  - { front: "สายด่วนสุขภาพจิตและสายด่วนเมื่อฉุกเฉินคือเบอร์อะไร", back: "1323 สุขภาพจิต และ 1669 เหตุฉุกเฉิน" }
