  - id: biology.plants.photosynthesis.p017
    topics: [biology.plants.photosynthesis]
    difficulty: 5
    type: numeric
    stem: "การปล่อย O₂ 1 โมเลกุลใช้โฟตอนประมาณ 8 โฟตอน การสร้างกลูโคส 1 โมล (ปล่อย O₂ 6 โมล) จึงใช้โฟตอนราว 48 โมล แสงความยาวคลื่น 680 nm มีพลังงาน 176 kJ ต่อโมลโฟตอน และกลูโคส 1 โมลเก็บพลังงานเคมี 2,870 kJ ประสิทธิภาพการเปลี่ยนพลังงานแสงที่ดูดกลืนเป็นพลังงานเคมีในกลูโคสเป็นร้อยละเท่าใด (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 34.0, tolerance: 0.4, unit: "%" }
    misconceptions:
      - { match: 203.8, feedback: "ใช้โฟตอน 8 โมลแทน 48 โมล ประสิทธิภาพเกิน 100% เป็นไปไม่ได้" }
      - { match: 294.3, feedback: "หารกลับด้าน ต้องเอาพลังงานในกลูโคสตั้งหารด้วยพลังงานแสง" }
    hints:
      - "พลังงานแสงที่ใช้ = จำนวนโมลโฟตอน × พลังงานต่อโมลโฟตอน"
      - "ประสิทธิภาพ = พลังงานในกลูโคส ÷ พลังงานแสง × 100"
    solution: "พลังงานแสง $48 \\times 176 = 8{,}448$ kJ ประสิทธิภาพ $\\tfrac{2{,}870}{8{,}448} \\times 100 \\approx 34.0$ เปอร์เซ็นต์ พลังงานที่เหลือกลายเป็นความร้อน นี่คือประสิทธิภาพของแสงที่ถูกดูดกลืนแล้ว ประสิทธิภาพเทียบกับแสงอาทิตย์ทั้งหมดที่ตกบนไร่ต่ำกว่านี้มาก"
