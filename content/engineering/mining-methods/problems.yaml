  - id: "engineering.mining.mining-methods.p018"
    topics: ["engineering.mining.mining-methods"]
    difficulty: 5
    type: "code"
    stem: "เขียนฟังก์ชัน `avg_grade(blocks, cutoff)` ที่รับลิสต์ของคู่ `(ตัน, เกรด%)` และค่าตัดเกรด คืนเกรดเฉลี่ยถ่วงด้วยตันของบล็อกที่มีเกรดไม่ต่ำกว่าค่าตัด ถ้าไม่มีบล็อกเลยให้คืน 0.0"
    hints: ["กรองบล็อกที่เกรด `>= cutoff` ก่อน", "ถ่วงเกรดด้วยตัน แล้วหารด้วยตันรวม"]
    solution: "ฟังก์ชันกรองบล็อกที่ผ่านค่าตัด รวมตันและผลคูณตัน×เกรด แล้วหารด้วยตันรวม และคืน 0.0 ถ้าไม่มีบล็อกผ่าน"
    license: "CC-BY-SA-4.0"
    ai_assisted: true
    language: "python"
    starter: "def avg_grade(blocks, cutoff):\n    pass\n"
    tests: "assert abs(avg_grade([(10000, 0.8), (8000, 0.4), (12000, 1.2), (5000, 0.6)], 0.5) - 0.9407) < 0.001, f\"ค่าที่ได้คือ {avg_grade([(10000, 0.8), (8000, 0.4), (12000, 1.2), (5000, 0.6)], 0.5)}\"\nassert avg_grade([(100, 0.2)], 0.5) == 0.0, \"ถ้าไม่มีบล็อกผ่านค่าตัดต้องคืน 0.0\"\nassert abs(avg_grade([(100, 1.0), (300, 2.0)], 0.5) - 1.75) < 1e-9, \"ต้องถ่วงด้วยตัน ไม่ใช่เฉลี่ยเลขคณิต\"\n"
    reference: "def avg_grade(blocks, cutoff):\n    sel = [(t, g) for t, g in blocks if g >= cutoff]\n    total = sum(t for t, _ in sel)\n    if total == 0:\n        return 0.0\n    return sum(t * g for t, g in sel) / total\n"
