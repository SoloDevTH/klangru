<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220" font-family="sans-serif" font-size="15">
  <title>โรงไฟฟ้าส่งกำลัง 1 MW ผ่านสายส่งที่มีความต้านทานรวม 5 โอห์ม ไปยังเมือง</title>
  <rect x="0" y="0" width="600" height="220" fill="#ffffff"/>
  <rect x="30.0" y="60.0" width="120.0" height="90.0" rx="6" fill="#d9e8f5" stroke="#15211e" stroke-width="2"/>
  <text x="90.0" y="100.0" fill="#15211e" font-size="15" text-anchor="middle">โรงไฟฟ้า</text>
  <text x="90.0" y="124.0" fill="#15211e" font-size="15" text-anchor="middle" font-weight="bold">1 MW</text>
  <rect x="450.0" y="60.0" width="120.0" height="90.0" rx="6" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="510.0" y="110.0" fill="#15211e" font-size="15" text-anchor="middle">เมือง</text>
  <polyline points="150.0,75.0 275.0,75.0 279.2,67.0 287.5,83.0 295.8,67.0 304.2,83.0 312.5,67.0 320.8,83.0 325.0,75.0 450.0,75.0" fill="none" stroke="#15211e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="300.0" y="61.0" fill="#15211e" font-size="15" text-anchor="middle">สายส่ง R = 5 Ω (รวมทั้งสองเส้น)</text>
  <line x1="150.0" y1="135.0" x2="450.0" y2="135.0" stroke="#15211e" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="230.0" y1="170.0" x2="361.0" y2="170.0" stroke="#b3261e" stroke-width="2.4" stroke-linecap="butt"/>
  <polygon points="370.0,170.0 361.0,174.1 361.0,165.9" fill="#b3261e"/>
  <text x="300.0" y="195.0" fill="#b3261e" font-size="13" text-anchor="middle">กระแส I ไหลผ่านสายส่ง เสียพลังงาน I²R เป็นความร้อน</text>
</svg>
