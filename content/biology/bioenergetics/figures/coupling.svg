<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="sans-serif" font-size="14">
<title>แท่งแสดงค่า ΔG มาตรฐานของการสร้างกลูโคส-6-ฟอสเฟตที่เป็นบวก และการไฮโดรไลซิส ATP ที่เป็นลบมาก</title>
<rect x="0" y="0" width="700" height="330" fill="#ffffff"/>
<line x1="60" y1="165" x2="650" y2="165" stroke="#37474f" stroke-width="1.6"/>
<text x="20" y="90.0" fill="#37474f">+20</text>
<text x="20" y="250.0" fill="#37474f">−20</text>
<text x="20" y="170" fill="#37474f">0</text>
<text x="20" y="45" fill="#37474f" font-size="12">kJ/mol</text>
<rect x="170" y="109.8" width="140" height="55.2" fill="#ef9a9a" stroke="#c62828" stroke-width="1.5"/>
<text x="240" y="99.8" text-anchor="middle" fill="#c62828" font-weight="bold">+13.8</text>
<text x="240" y="193" text-anchor="middle" fill="#263238">กลูโคส + Pi → G6P</text>
<text x="240" y="211" text-anchor="middle" fill="#455a64" font-size="12">ไม่เกิดเองที่สภาวะมาตรฐาน</text>
<rect x="420" y="165.0" width="140" height="122.0" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1.5"/>
<text x="490" y="231.0" text-anchor="middle" fill="#1b5e20" font-weight="bold" font-size="16">−30.5</text>
<text x="490" y="153" text-anchor="middle" fill="#263238">ATP + H₂O → ADP + Pi</text>
<text x="490" y="135" text-anchor="middle" fill="#455a64" font-size="12">เกิดเองได้</text>
<text x="60" y="318" fill="#555" font-size="12">ค่า ΔG°′ ที่สภาวะมาตรฐานทางชีวเคมี (pH 7, 25 °C) ใช้เปรียบเทียบเท่านั้น ภาพไม่ได้วาดตามสัดส่วนจริงทั้งหมด</text>
</svg>