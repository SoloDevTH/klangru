  <text x="511.0" y="100.2" text-anchor="middle" fill="#1f2937" font-size="12">กลุ่มที่เหมาะที่สุด</text>
  <line x1="596.0" y1="78.0" x2="627.0" y2="78.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="629.0" y="30.0" width="170.0" height="96.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="714.0" y="64.2" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">วางตำแหน่ง</text>
  <text x="714.0" y="82.2" text-anchor="middle" fill="#1f2937" font-size="12">(Positioning)</text>
