- id: business.communication.business-reports.p015
  topics:
  - business.communication.business-reports
  difficulty: 4
  type: mcq
  stem: เมื่อต้องอธิบาย "ค่าเสื่อมราคา" ให้ผู้ที่ไม่ใช่นักบัญชีฟัง ข้อใดเป็นคำอธิบายที่เหมาะที่สุด
  choices:
  - id: a
    text: เงินที่จ่ายออกไปจริงในเดือนนี้เพื่อซื้อเครื่องจักร
    feedback: นั่นคือการจ่ายเงินสด ไม่ใช่ค่าเสื่อมราคา
  - id: b
    text: การกระจายต้นทุนของสิ่งที่ใช้งานหลายปีไปตามช่วงที่ใช้ประโยชน์ เป็นค่าใช้จ่ายที่ไม่ได้จ่ายเป็นเงินสดในเดือนนั้น
    correct: true
  - id: c
    text: ราคาที่สินทรัพย์ขายได้จริงทุกปี
    feedback: นั่นคือมูลค่าตลาด ไม่ใช่ค่าเสื่อมราคา
  - id: d
    text: เงินปันผลที่ได้รับจากการลงทุน
    feedback: เป็นรายได้จากการลงทุน ไม่ใช่ค่าเสื่อม
  hints:
  - ถามว่าค่านี้ทำให้เงินสดออกไปจริงในเดือนนั้นหรือไม่
  - ใช้ตัวอย่างเครื่องจักรที่ใช้ได้หลายปี
  solution: ค่าเสื่อมราคาคือการทยอยรับรู้ต้นทุนของสินทรัพย์ที่ใช้หลายปีเป็นค่าใช้จ่ายในแต่ละงวด โดยไม่ได้จ่ายเงินสดออกในทุกงวด
