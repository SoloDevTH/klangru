id: earthscience.geology.rock-cycle-fossils
subject: earthscience
title: { th: วัฏจักรหิน แร่ และซากดึกดำบรรพ์, en: "The rock cycle, minerals and fossils" }
summary: หินอัคนี หินตะกอน หินแปร และวัฏจักรหิน การใช้ประโยชน์จากหินและแร่ การเกิดซากดึกดำบรรพ์ และการใช้ซากดึกดำบรรพ์คาดคะเนสภาพแวดล้อมในอดีต
difficulty: 2.2
minutes: 35
prerequisites: [earthscience.geology.rocks-soil]
encompasses:
  - { id: earthscience.geology.rocks-soil, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: วัฏจักรหิน
    src: rock-cycle.svg
    alt: "แผนภาพวัฏจักรหิน แมกมาด้านล่างเย็นตัวและแข็งตัวเป็นหินอัคนี (ลาวาบนผิวโลกใช้เวลาวันถึงหลายปี) หินอัคนีผุพัง กร่อน ถูกน้ำและลมพัดพาเป็นตะกอน ตะกอนทับถม อัดแน่น และเชื่อมประสานเป็นหินตะกอน ใช้เวลานับพันถึงล้านปี หินตะกอนได้รับความร้อนและความดันสูงเป็นหินแปร หินแปรหลอมละลายลึกใต้ผิวโลกเป็นแมกมา มีลูกศรทางลัดจากหินอัคนีไปหินแปรด้วยความร้อนและความดัน"
    caption: "หินทุกประเภทผุพังเป็นตะกอน แปรสภาพ หรือหลอมเป็นแมกมาได้ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: หินอ่อนผ่านวัฏจักรหินมาอย่างไร
    problem: "หินอ่อนก้อนหนึ่งเกิดจากเปลือกหอยในทะเลโบราณ เขียนลำดับการเปลี่ยนแปลงตั้งแต่เปลือกหอยจนเป็นหินอ่อน และบอกว่าแต่ละขั้นใช้พลังงานจากแหล่งใด"
    steps:
      - text: "เปลือกหอยและตะกอนปูนทับถมที่พื้นทะเล เป็นตะกอน"
      - text: "ตะกอนถูกทับถมเพิ่ม อัดแน่น และเชื่อมประสานเป็นหินปูน ซึ่งเป็นหินตะกอน ใช้เวลาหลายพันถึงหลายล้านปี"
        why: "แรงโน้มถ่วงของตะกอนชั้นบนกดทับชั้นล่าง"
      - text: "หินปูนถูกฝังลึกลงไปใต้ผิวโลก ได้รับความร้อนและความดันสูงจากภายในโลก แร่แคลไซต์ตกผลึกใหม่เป็นหินอ่อน โดยไม่หลอมละลาย"
    answer: "ตะกอนเปลือกหอย → หินปูน (หินตะกอน) → หินอ่อน (หินแปร) โดยขั้นสุดท้ายใช้ความร้อนภายในโลก"
  - { type: check, problem: earthscience.geology.rock-cycle-fossils.p010, prompt: "ผลึกต้องใช้เวลาโต" }
  - type: figure
    title: การเกิดซากดึกดำบรรพ์
    src: fossil-formation.svg
    alt: "ภาพสี่ช่อง ช่องที่ 1 สัตว์ตาย ซากปลาจมลงก้นทะเลสาบ ช่องที่ 2 ตะกอนทับถม ฝังโครงกระดูกปลาอย่างรวดเร็ว ช่องที่ 3 ตะกอนหลายชั้นกลายเป็นหิน แร่ค่อย ๆ แทนที่กระดูก ช่องที่ 4 ชั้นหินยกตัวขึ้นเป็นเนินและถูกกร่อน โครงกระดูกปลาโผล่ให้เห็น มีแว่นขยายอยู่ข้าง ๆ"
    caption: "ซากต้องถูกฝังกลบเร็วก่อนเน่าเปื่อยหรือถูกสัตว์อื่นกิน (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: อ่านสภาพแวดล้อมจากชั้นหิน
    problem: "หน้าผาแห่งหนึ่งมีชั้นหินสามชั้นที่ไม่ถูกพลิกกลับ ชั้นล่างเป็นหินดินดานมีซากปลาน้ำจืด ชั้นกลางเป็นหินทรายมีรอยเท้าไดโนเสาร์ ชั้นบนเป็นหินปูนมีซากปะการัง เรียงสภาพแวดล้อมจากอดีตถึงปัจจุบัน"
    steps:
      - text: "ชั้นล่างเกิดก่อน จึงเริ่มอ่านจากชั้นล่าง"
        why: "ตะกอนทับถมจากล่างขึ้นบน"
      - text: "ชั้นล่าง ซากปลาน้ำจืดในโคลนละเอียด แสดงว่าเป็นทะเลสาบหรือแหล่งน้ำจืดที่น้ำนิ่ง"
      - text: "ชั้นกลาง รอยเท้าไดโนเสาร์บนทราย แสดงว่าเป็นแผ่นดินหรือริมฝั่งน้ำ"
      - text: "ชั้นบน ซากปะการัง แสดงว่าต่อมาน้ำทะเลท่วมเข้ามาเป็นทะเลตื้น"
    answer: "แหล่งน้ำจืด → แผ่นดินริมน้ำ → ทะเลตื้น"
  - { type: check, problem: earthscience.geology.rock-cycle-fossils.p006, prompt: "ชั้นใดทับถมก่อน" }
glossary:
  - { term: แร่, definition: "ของแข็งที่เกิดเองตามธรรมชาติ มีส่วนประกอบและสมบัติเฉพาะตัว เช่น ควอตซ์ แคลไซต์" }
  - { term: หินอัคนี, definition: "หินที่เกิดจากแมกมาหรือลาวาเย็นตัวและแข็งตัว เช่น หินแกรนิต หินบะซอลต์" }
  - { term: หินตะกอน, definition: "หินที่เกิดจากตะกอนทับถม อัดแน่น และเชื่อมประสานกัน มักเป็นชั้นและมีซากดึกดำบรรพ์" }
  - { term: หินแปร, definition: "หินที่เปลี่ยนเนื้อและแร่เพราะความร้อนและความดันสูงโดยไม่หลอมละลาย เช่น หินอ่อน หินชนวน" }
  - { term: วัฏจักรหิน, definition: "การเปลี่ยนแปลงของหินจากประเภทหนึ่งไปเป็นอีกประเภทหนึ่งต่อเนื่องเป็นวงจร" }
  - { term: ซากดึกดำบรรพ์, definition: "ซากหรือร่องรอยของสิ่งมีชีวิตในอดีตที่เก็บรักษาไว้ในหิน เช่น กระดูก เปลือกหอย ไม้กลายเป็นหิน รอยเท้า" }
flashcards:
  - { front: "หินสามประเภทเกิดอย่างไร", back: "อัคนี: แมกมาเย็นตัว ตะกอน: ตะกอนทับถมอัดแน่น แปร: ความร้อนและความดันโดยไม่หลอม" }
  - { front: "อะไรขับเคลื่อนวัฏจักรหิน", back: "ความร้อนภายในโลก (หลอม แปร) และพลังงานจากดวงอาทิตย์ (ลม ฝน น้ำ ทำให้ผุพังและพัดพา)" }
  - { front: "ซากหอยทะเลบนภูเขาบอกอะไร", back: "บริเวณนั้นเคยเป็นทะเล แล้วชั้นหินถูกยกตัวขึ้น" }
  - { front: "ซากดึกดำบรรพ์ไทยที่สำคัญ", back: "ไดโนเสาร์ภูเวียง ขอนแก่น ไม้กลายเป็นหิน บ้านตาก จังหวัดตาก สุสานหอยแหลมโพธิ์ กระบี่" }
