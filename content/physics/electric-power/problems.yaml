    answer: { value: 20.41, tolerance: 0.2, unit: W }
    hints:
      - "หาความต้านทานของแต่ละหลอดจาก $R = \\dfrac{V^2}{P}$ โดยใช้ค่าบนฉลาก"
      - "ต่ออนุกรม ความต้านทานรวมเป็นผลบวก หากระแสในวงจร"
      - "กำลังของหลอด $40\\ \\mathrm{W}$ คือ $I^2R_{40}$"
    misconceptions:
      - { match: 40, feedback: "หลอดได้ $40\\ \\mathrm{W}$ เมื่อมีความต่างศักย์คร่อม $220\\ \\mathrm{V}$ เต็ม แต่ต่ออนุกรมแล้วความต่างศักย์ถูกแบ่ง" }
      - { match: 8.16, feedback: "นั่นคือกำลังของหลอด $100\\ \\mathrm{W}$ ในวงจรนี้ ซึ่งความต้านทานน้อยกว่าจึงได้กำลังน้อยกว่า" }
    solution: "$R_{40} = \\dfrac{220^2}{40} = 1210\\ \\Omega$, $R_{100} = \\dfrac{220^2}{100} = 484\\ \\Omega$ กระแส $I = \\dfrac{220}{1694} \\approx 0.130\\ \\mathrm{A}$ หลอด 40 W ใช้ $I^2(1210) \\approx 20.4\\ \\mathrm{W}$ ส่วนหลอด 100 W ใช้เพียง $\\approx 8.2\\ \\mathrm{W}$ หลอด 40 W จึงสว่างกว่าเมื่อต่ออนุกรม"
    license: CC-BY-SA-4.0
    ai_assisted: true

