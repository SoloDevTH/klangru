  solution: หยุดใช้และดูแลสุขภาพก่อน แล้วเก็บหลักฐานและร้องเรียน อย. 1556 เพราะเครื่องสำอางที่ไม่มีเลขจดแจ้งอาจผิดกฎหมายและไม่ปลอดภัย
