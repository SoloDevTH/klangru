    solution: "17 วัน: $68{,}000$ · เร่ง D 1 วัน (2,000) ได้ 16 วัน ตอนนี้ B–D–F–G และ A–C–E–G ยาว 16 ทั้งคู่ รวม $2{,}000 + 64{,}000 = 66{,}000$ · เร่ง D อีก 1 วันพร้อม A 1 วัน (3,000) ได้ 15 วัน รวม $5{,}000 + 60{,}000 = 65{,}000$ · วันถัดไปต้องเร่ง B กับ C (4,500) มากกว่า 4,000 ไม่คุ้ม ต้นทุนรวมต่ำสุด 65,000 บาทที่ 15 วัน"
