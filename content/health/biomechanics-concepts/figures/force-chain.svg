<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 200" width="660" height="200" font-family="sans-serif">
<title>การส่งแรงต่อเนื่องจากขาไปถึงมือเมื่อขว้างลูกบอล</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="0" y="0" width="660" height="200" fill="#ffffff"/>
<text x="330.0" y="28.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">ส่งแรงต่อเนื่องจากส่วนใหญ่ไปส่วนเล็ก (ขว้างลูกบอล)</text>
<rect x="16.0" y="60.0" width="112.0" height="80.0" rx="10" fill="#eaf2fb" stroke="#2c6fb7" stroke-width="2" />
<text x="72.0" y="92.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">1 เท้าและขา</text>
<text x="72.0" y="116.0" font-size="12" text-anchor="middle" fill="#111">ถีบพื้น ก้าวเท้า</text>
<line x1="130.0" y1="100.0" x2="146.0" y2="100.0" stroke="#222" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="148.0" y="60.0" width="112.0" height="80.0" rx="10" fill="#eaf2fb" stroke="#2c6fb7" stroke-width="2" />
<text x="204.0" y="92.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">2 สะโพก</text>
<text x="204.0" y="116.0" font-size="12" text-anchor="middle" fill="#111">หมุนไปทางเป้า</text>
<line x1="262.0" y1="100.0" x2="278.0" y2="100.0" stroke="#222" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="280.0" y="60.0" width="112.0" height="80.0" rx="10" fill="#eaf2fb" stroke="#2c6fb7" stroke-width="2" />
<text x="336.0" y="92.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">3 ลำตัว</text>
<text x="336.0" y="116.0" font-size="12" text-anchor="middle" fill="#111">บิดตาม</text>
<line x1="394.0" y1="100.0" x2="410.0" y2="100.0" stroke="#222" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="412.0" y="60.0" width="112.0" height="80.0" rx="10" fill="#eaf2fb" stroke="#2c6fb7" stroke-width="2" />
<text x="468.0" y="92.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">4 ไหล่และแขน</text>
<text x="468.0" y="116.0" font-size="12" text-anchor="middle" fill="#111">เหวี่ยงแขน</text>
<line x1="526.0" y1="100.0" x2="542.0" y2="100.0" stroke="#222" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="544.0" y="60.0" width="112.0" height="80.0" rx="10" fill="#eaf2fb" stroke="#2c6fb7" stroke-width="2" />
<text x="600.0" y="92.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">5 ข้อมือ</text>
<text x="600.0" y="116.0" font-size="12" text-anchor="middle" fill="#111">สะบัดปล่อยลูก</text>
<text x="330.0" y="172.0" font-size="13" text-anchor="middle" fill="#111">ส่วนที่ใหญ่และแข็งแรงเริ่มก่อน แล้วส่งต่อตามลำดับ จังหวะต่อเนื่อง แรงจึงรวมกันได้มากที่สุด</text>
</svg>
