id: computer.networks.addressing-routing
subject: computer
title: { th: ที่อยู่ IP ซับเน็ต และการหาเส้นทาง, en: "IP addresses, subnets and routing" }
summary: แบ่งที่อยู่ IPv4 เป็นส่วนเครือข่ายกับส่วนโฮสต์ หาที่อยู่เครือข่ายและจำนวนโฮสต์จาก CIDR เลือกเส้นทางแบบ prefix ยาวที่สุด และไล่หาสาเหตุเมื่ออินเทอร์เน็ตใช้ไม่ได้
difficulty: 5.5
minutes: 45
prerequisites: [computer.networks.internet-basics, computer.data.number-representation]
encompasses:
  - { id: computer.data.number-representation, weight: 0.3 }
  - { id: computer.networks.internet-basics, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: school-network.svg
    alt: "แผนผังเครือข่ายโรงเรียน กล่องบนสุดคืออินเทอร์เน็ต ต่อกับเราเตอร์ เราเตอร์แตกเป็นสองเส้นไปยังซับเน็ต A ที่เป็นห้องคอมพิวเตอร์ใช้ 192.168.10.0/24 มีเครื่อง PC สองเครื่องและสวิตช์ และซับเน็ต B ที่เป็นห้องครูใช้ 192.168.20.0/24 มีโน้ตบุ๊กและเครื่องพิมพ์"
    caption: "เราเตอร์ดูที่อยู่ปลายทางแล้วเลือกว่าจะส่งแพ็กเก็ตไปซับเน็ตใด"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: subnet-split.svg
    alt: "แถบแสดงที่อยู่ 192.168.10.0 ถึง 192.168.10.255 แบ่งเป็นสี่บล็อกเท่า ๆ กัน บล็อกละ 64 ที่อยู่ ได้แก่ 0 ถึง 63, 64 ถึง 127, 128 ถึง 191 และ 192 ถึง 255 บล็อกที่สองถูกเน้นสี เครื่องที่ลงท้ายด้วย .77 อยู่ในบล็อกนี้"
    caption: "ซับเน็ต /26 แบ่งวง /24 เป็นสี่ส่วนเท่า ๆ กัน"
  - type: worked-example
    title: หาที่อยู่เครือข่าย ที่อยู่กระจายข่าว และช่วงโฮสต์
    problem: "เครื่องหนึ่งมีที่อยู่ 192.168.10.77/26 จงหาที่อยู่เครือข่าย ที่อยู่กระจายข่าว และช่วงของที่อยู่โฮสต์ที่ใช้ได้"
    steps:
      - text: "prefix คือ 26 จึงมีส่วนโฮสต์ $32 - 26 = 6$ บิต ขนาดบล็อกคือ $2^6 = 64$ ที่อยู่"
        why: "จำนวนที่อยู่ในบล็อกขึ้นกับจำนวนบิตที่เหลือไว้สำหรับส่วนโฮสต์เท่านั้น"
      - text: "ตัวเลขสุดท้าย 77 อยู่ระหว่าง 64 ถึง 127 เพราะ 64 บวก 64 เท่ากับ 128 ดังนั้นบล็อกนี้เริ่มที่ 64"
        why: "บล็อกขนาด 64 ต้องเริ่มที่ผลคูณของ 64 คือ 0, 64, 128, 192"
      - text: "ที่อยู่เครือข่ายคือ 192.168.10.64 และที่อยู่กระจายข่าวคือ 192.168.10.127 (บล็อกเริ่มที่ 64 และจบก่อน 128)"
        why: "ที่อยู่เครือข่ายมีส่วนโฮสต์เป็นศูนย์ทั้งหมด ที่อยู่กระจายข่าวมีส่วนโฮสต์เป็นหนึ่งทั้งหมด"
      - text: "ที่อยู่โฮสต์ที่ใช้ได้คือ 192.168.10.65 ถึง 192.168.10.126 รวม $64 - 2 = 62$ ค่า"
    answer: "เครือข่าย 192.168.10.64 กระจายข่าว 192.168.10.127 โฮสต์ที่ใช้ได้ 62 ค่า"
  - { type: check, problem: computer.networks.addressing-routing.p002, prompt: "ลองคิดก่อนอ่านต่อว่าอุปกรณ์ใดตัดสินเส้นทางระหว่างเครือข่าย" }
  - type: worked-example
    title: สองเครื่องอยู่ซับเน็ตเดียวกันหรือไม่
    problem: "เครื่อง A มี 192.168.1.40 และเครื่อง B มี 192.168.1.70 ทั้งคู่ใช้ prefix /27 เครื่องทั้งสองสื่อสารกันตรงได้โดยไม่ต้องผ่านเราเตอร์หรือไม่"
    steps:
      - text: "/27 มีบล็อกขนาด $2^5 = 32$ ที่อยู่ บล็อกจึงเริ่มที่ 0, 32, 64, 96, 128 และอื่น ๆ ทีละ 32"
      - text: "เครื่อง A คือ .40 อยู่ในบล็อก .32 ถึง .63 ที่อยู่เครือข่ายคือ 192.168.1.32"
        why: "ตรวจด้วยการหาจุดเริ่มของบล็อกที่ไม่เกินค่าของเครื่อง ไม่ใช่ดูแค่ว่าตัวเลขสามชุดแรกเหมือนกัน"
      - text: "เครื่อง B คือ .70 อยู่ในบล็อก .64 ถึง .95 ที่อยู่เครือข่ายคือ 192.168.1.64"
      - text: "เครือข่ายสองค่าไม่เท่ากัน จึงอยู่คนละซับเน็ต ต้องส่งผ่านเราเตอร์"
        why: "แม้ 192.168.1 จะเหมือนกัน แต่ prefix /27 แบ่งส่วนที่สี่ออกเป็นหลายวง"
    answer: "ไม่ได้ อยู่คนละซับเน็ตคือ 192.168.1.32/27 และ 192.168.1.64/27"
  - { type: check, problem: computer.networks.addressing-routing.p010, prompt: "ตรวจด้วยการหาบล็อกที่ที่อยู่ตกอยู่" }
  - type: figure
    src: longest-prefix.svg
    alt: "ตารางเส้นทางสี่แถว แถวแรกคือ 0.0.0.0/0 ส่งออกอินเทอร์เน็ต แถวที่สองคือ 10.0.0.0/8 ส่งไป R1 แถวที่สามคือ 10.1.0.0/16 ส่งไป R2 และแถวที่สี่คือ 10.1.2.0/24 ส่งไป R3 แถวที่สี่ถูกเน้นสีเขียว ใต้ตารางเขียนว่าปลายทาง 10.1.2.9 ตรงกับสี่แถว แถวที่ prefix ยาวที่สุดคือ /24"
    caption: "เลือกแถวที่ prefix ยาวที่สุดที่ตรงกับปลายทาง"
glossary:
  - { term: ที่อยู่ IP (IP address), definition: "หมายเลขที่ใช้ระบุเครื่องในเครือข่ายที่ใช้โพรโทคอลอินเทอร์เน็ต IPv4 มี 32 บิต" }
  - { term: ซับเน็ต (subnet), definition: "ส่วนหนึ่งของเครือข่ายที่ที่อยู่ส่วนเครือข่ายเหมือนกัน เครื่องในซับเน็ตเดียวกันติดต่อกันโดยตรงได้" }
  - { term: CIDR, definition: "การเขียน prefix ตามหลังที่อยู่ เช่น 192.168.10.0/24 โดยตัวเลขหลัง / คือจำนวนบิตของส่วนเครือข่าย" }
  - { term: ที่อยู่กระจายข่าว (broadcast address), definition: "ที่อยู่ที่ส่วนโฮสต์เป็นหนึ่งทั้งหมด ใช้ส่งข้อมูลถึงทุกเครื่องในซับเน็ต" }
  - { term: ตารางเส้นทาง (routing table), definition: "รายการที่เราเตอร์ใช้เลือกว่าแพ็กเก็ตปลายทางแต่ละวงควรส่งต่อไปทางใด" }
  - { term: NAT, definition: "การแปลงที่อยู่ภายในเป็นที่อยู่สาธารณะที่เราเตอร์ใช้แทน เพื่อให้หลายเครื่องใช้ที่อยู่ออกอินเทอร์เน็ตร่วมกัน" }
flashcards:
  - { front: "จำนวนโฮสต์ที่ใช้ได้ในซับเน็ต /p", back: "2 ยกกำลัง (32 − p) ลบ 2 เช่น /26 ได้ 62 เครื่อง" }
  - { front: "ที่อยู่เครือข่ายกับที่อยู่กระจายข่าวต่างกันอย่างไร", back: "เครือข่ายมีส่วนโฮสต์เป็นศูนย์ทั้งหมด กระจายข่าวมีส่วนโฮสต์เป็นหนึ่งทั้งหมด" }
  - { front: "longest prefix match คืออะไร", back: "เลือกแถวตารางเส้นทางที่ตรงกับปลายทางและมี prefix ยาวที่สุด" }
  - { front: "ช่วงที่อยู่ส่วนตัวของ 172", back: "172.16.0.0 ถึง 172.31.255.255 (RFC 1918)" }
  - { front: "ping กับ traceroute ต่างกันอย่างไร", back: "ping ทดสอบว่าถึงปลายทางหรือไม่ traceroute แสดงเส้นทางทีละฮอป" }
