id: biology.animals.hormones
subject: biology
title: { th: ฮอร์โมนกับการรักษาดุลยภาพ, en: "Hormones and homeostasis" }
summary: การทำงานของฮอร์โมนกับเซลล์เป้าหมาย ไฮโพทาลามัสและต่อมใต้สมอง ต่อมไร้ท่อและเนื้อเยื่อที่สร้างฮอร์โมน การป้อนกลับเชิงลบและเชิงบวก ฮอร์โมนคู่ตรงข้าม และความผิดปกติที่พบบ่อย
difficulty: 5.5
minutes: 45
prerequisites: [biology.animals.nervous-system, biology.animals.homeostasis, health.body.nervous-endocrine-care]
encompasses:
  - { id: biology.animals.homeostasis, weight: 0.3 }
  - { id: health.body.nervous-endocrine-care, weight: 0.2 }
  - { id: biology.animals.nervous-system, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ไฮโพทาลามัสและต่อมใต้สมอง
    src: pituitary-axis.svg
    alt: "แผนผัง ไฮโพทาลามัสอยู่บนสุด หลั่งฮอร์โมนกระตุ้นและยับยั้งผ่านเส้นเลือดไปยังต่อมใต้สมองส่วนหน้า และส่งฮอร์โมนผ่านแอกซอนไปยังต่อมใต้สมองส่วนหลัง ต่อมใต้สมองส่วนหน้าหลั่ง GH ไปที่กระดูกและกล้ามเนื้อให้เติบโต TSH ไปที่ต่อมไทรอยด์ให้หลั่งไทรอกซิน ACTH ไปที่ต่อมหมวกไตส่วนนอกให้หลั่งคอร์ติซอล FSH และ LH ไปที่รังไข่และอัณฑะให้สร้างเซลล์สืบพันธุ์และฮอร์โมนเพศ และโพรแลกทินไปที่ต่อมน้ำนมให้สร้างน้ำนม ต่อมใต้สมองส่วนหลังหลั่ง ADH ไปที่ท่อหน่วยไตให้ดูดน้ำกลับ และออกซิโทซินไปที่มดลูกและต่อมน้ำนมให้มดลูกหดตัวและหลั่งน้ำนม หมายเหตุ ADH และออกซิโทซินสร้างที่ไฮโพทาลามัสแล้วส่งไปเก็บที่ต่อมใต้สมองส่วนหลัง"
    caption: "ต่อมใต้สมองส่วนหน้าควบคุมต่อมไร้ท่ออื่นอีกทอดหนึ่ง (วาดโดยทีมคลังรู้)"
  - type: figure
    title: การควบคุมไทรอกซินด้วยการป้อนกลับเชิงลบ
    src: thyroxine-feedback.svg
    alt: "ผังจากบนลงล่าง ไฮโพทาลามัสหลั่ง TRH กระตุ้นต่อมใต้สมองส่วนหน้า ต่อมใต้สมองส่วนหน้าหลั่ง TSH กระตุ้นต่อมไทรอยด์ซึ่งต้องใช้ไอโอดีน ต่อมไทรอยด์หลั่งไทรอกซินไปที่เซลล์ทั่วร่างกายทำให้เมแทบอลิซึมเพิ่มขึ้น มีเส้นประสีแดงสองเส้นจากไทรอกซินย้อนกลับไปยับยั้งต่อมใต้สมองส่วนหน้าและไฮโพทาลามัส เมื่อไทรอกซินสูง"
    caption: "ไทรอกซินที่สูงยับยั้งการหลั่ง TRH และ TSH (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ทำไมขาดไอโอดีนแล้วต่อมไทรอยด์โต
    problem: "อธิบายด้วยการป้อนกลับเชิงลบว่าทำไมคนที่ได้รับไอโอดีนไม่พอเป็นเวลานานจึงเป็นคอพอก"
    steps:
      - text: "ต่อมไทรอยด์ใช้ไอโอดีนสร้างไทรอกซิน ขาดไอโอดีนจึงสร้างไทรอกซินได้น้อย"
      - text: "ไทรอกซินในเลือดต่ำ จึงไม่ยับยั้งไฮโพทาลามัสและต่อมใต้สมองส่วนหน้า"
        why: "ในภาวะปกติ ไทรอกซินเป็นตัวส่งสัญญาณย้อนกลับให้ลด TRH และ TSH"
      - text: "ต่อมใต้สมองส่วนหน้าหลั่ง TSH สูงอยู่ตลอด"
      - text: "TSH กระตุ้นเซลล์ของต่อมไทรอยด์ให้เพิ่มจำนวนและขนาด ต่อมจึงโตจนเห็นเป็นก้อนที่คอ"
    answer: "ไทรอกซินต่ำทำให้ TSH สูงตลอด TSH กระตุ้นต่อมไทรอยด์จนโตเป็นคอพอก"
  - { type: check, problem: biology.animals.hormones.p006, prompt: "TSH สูงหรือต่ำเมื่อไทรอกซินในเลือดน้อย" }
  - type: worked-example
    title: อ่านกราฟน้ำตาลและฮอร์โมนหลังกินอาหาร
    problem: "จากกราฟระดับน้ำตาล อินซูลิน และกลูคากอนหลังกินอาหาร (ข้อมูลสมมติ) อธิบายการเปลี่ยนแปลงในช่วง 0–30 นาที และ 90–150 นาที"
    figure: { src: glucose-insulin.svg, alt: "กราฟเส้นสามเส้น แกนนอนคือเวลาหลังกินอาหาร 0 ถึง 180 นาที ทุก 30 นาที น้ำตาลในเลือดเป็นเส้นสีแดงทึบ ค่า 90, 150, 130, 105, 90, 85, 88 มิลลิกรัมต่อเดซิลิตร อินซูลินเป็นเส้นประสีน้ำเงิน ค่า 10, 60, 45, 25, 12, 8, 9 ไมโครยูนิตต่อมิลลิลิตร กลูคากอนเป็นเส้นจุดสีเขียว ค่า 60, 30, 35, 45, 58, 65, 62 พิโคกรัมต่อมิลลิลิตร" }
    steps:
      - text: "0–30 นาที กลูโคสจากอาหารถูกดูดซึม น้ำตาลเพิ่มจาก 90 เป็น 150 mg/dL"
      - text: "ตับอ่อนตอบสนองโดยหลั่งอินซูลินเพิ่มจาก 10 เป็น 60 และลดกลูคากอนจาก 60 เป็น 30"
        why: "สองฮอร์โมนทำงานตรงข้ามกัน เมื่อต้องการลดน้ำตาล ร่างกายเพิ่มตัวหนึ่งและลดอีกตัวหนึ่งพร้อมกัน"
      - text: "90–150 นาที น้ำตาลลดลงใกล้ระดับเดิม อินซูลินลดลง ส่วนกลูคากอนเพิ่มขึ้นเพื่อกันไม่ให้น้ำตาลต่ำเกินไป"
      - text: "นี่คือการป้อนกลับเชิงลบ เพราะผลของฮอร์โมนดึงน้ำตาลกลับเข้าหาระดับปกติ"
    answer: "น้ำตาลสูงกระตุ้นอินซูลินและลดกลูคากอน เมื่อน้ำตาลลดลงอินซูลินลดและกลูคากอนเพิ่ม"
  - { type: check, problem: biology.animals.hormones.p009, prompt: "ช่วงที่น้ำตาลสูง กลูคากอนควรเพิ่มหรือลด" }
glossary:
  - { term: เซลล์เป้าหมาย, definition: "เซลล์ที่มีตัวรับของฮอร์โมนชนิดหนึ่ง จึงตอบสนองต่อฮอร์โมนนั้น" }
  - { term: ฮอร์โมนสเตียรอยด์, definition: "ฮอร์โมนที่ละลายในลิพิด ผ่านเยื่อหุ้มเซลล์ไปจับตัวรับภายในเซลล์ เช่น คอร์ติซอล ฮอร์โมนเพศ" }
  - { term: ไฮโพทาลามัส, definition: "สมองส่วนที่เชื่อมระบบประสาทกับระบบต่อมไร้ท่อ ควบคุมต่อมใต้สมอง" }
  - { term: การป้อนกลับเชิงบวก, definition: "การควบคุมที่ผลของการตอบสนองไปเสริมสิ่งเร้าให้แรงขึ้น เช่น ออกซิโทซินขณะคลอด" }
  - { term: ฮอร์โมนคู่ตรงข้าม, definition: "ฮอร์โมนสองชนิดที่มีผลตรงข้ามกันต่อค่าเดียวกัน เช่น อินซูลินกับกลูคากอน" }
  - { term: คอพอก, definition: "ต่อมไทรอยด์โต มักเกิดจากขาดไอโอดีนจน TSH กระตุ้นต่อมตลอด" }
flashcards:
  - { front: "อินซูลินกับกลูคากอน", back: "อินซูลินลดน้ำตาลในเลือด กลูคากอนเพิ่มน้ำตาลในเลือด ทั้งคู่มาจากตับอ่อน" }
  - { front: "แคลซิโทนินกับพาราทอร์โมน", back: "แคลซิโทนิน (ไทรอยด์) ลดแคลเซียมในเลือด พาราทอร์โมน (พาราไทรอยด์) เพิ่มแคลเซียมในเลือด" }
  - { front: "ADH และออกซิโทซินสร้างที่ใด", back: "สร้างที่ไฮโพทาลามัส เก็บและหลั่งที่ต่อมใต้สมองส่วนหลัง" }
  - { front: "ตัวอย่างการป้อนกลับเชิงบวก", back: "ออกซิโทซินทำให้มดลูกหดตัวแรงขึ้นเรื่อย ๆ ขณะคลอด" }
  - { front: "ชุดตรวจครรภ์ตรวจหาฮอร์โมนอะไร", back: "hCG ที่สร้างจากรก" }
