<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 388" width="720" height="388" font-family="sans-serif">
<title>ระดับความเป็นจริงของ zero, first และ second conditional</title>
<rect x="0" y="0" width="720" height="388" fill="#fff"/>
<text x="360.0" y="30.0" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">conditional สามแบบ เรียงจากจริงที่สุดไปสมมุติที่สุด</text>
<rect x="110.0" y="56.0" width="590.0" height="90.0" rx="8" fill="#fff" stroke="#2f7a3a" stroke-width="2.5"/>
<rect x="110.0" y="56.0" width="120.0" height="90.0" rx="8" fill="#2f7a3a" stroke="#2f7a3a" stroke-width="2.5"/>
<text x="170.0" y="108.0" font-size="20" text-anchor="middle" fill="#fff" font-weight="bold">ZERO</text>
<text x="248.0" y="86.0" font-size="15" text-anchor="start" fill="#2f7a3a" font-weight="bold">ข้อเท็จจริง เกิดทุกครั้ง</text>
<text x="248.0" y="112.0" font-size="17" text-anchor="start" fill="#111" font-weight="bold">If + present,  present</text>
<text x="248.0" y="136.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal" font-style="italic">If you heat ice, it melts.</text>
<rect x="110.0" y="160.0" width="590.0" height="90.0" rx="8" fill="#fff" stroke="#c47a12" stroke-width="2.5"/>
<rect x="110.0" y="160.0" width="120.0" height="90.0" rx="8" fill="#c47a12" stroke="#c47a12" stroke-width="2.5"/>
<text x="170.0" y="212.0" font-size="20" text-anchor="middle" fill="#fff" font-weight="bold">FIRST</text>
<text x="248.0" y="190.0" font-size="15" text-anchor="start" fill="#c47a12" font-weight="bold">เป็นไปได้จริงในอนาคต</text>
<text x="248.0" y="216.0" font-size="17" text-anchor="start" fill="#111" font-weight="bold">If + present,  will + V1</text>
<text x="248.0" y="240.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal" font-style="italic">If it rains, we will stay at home.</text>
<rect x="110.0" y="264.0" width="590.0" height="90.0" rx="8" fill="#fff" stroke="#8a3ab9" stroke-width="2.5"/>
<rect x="110.0" y="264.0" width="120.0" height="90.0" rx="8" fill="#8a3ab9" stroke="#8a3ab9" stroke-width="2.5"/>
<text x="170.0" y="316.0" font-size="20" text-anchor="middle" fill="#fff" font-weight="bold">SECOND</text>
<text x="248.0" y="294.0" font-size="15" text-anchor="start" fill="#8a3ab9" font-weight="bold">สมมุติ ไม่จริงตอนนี้</text>
<text x="248.0" y="320.0" font-size="17" text-anchor="start" fill="#111" font-weight="bold">If + past,  would + V1</text>
<text x="248.0" y="344.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal" font-style="italic">If I had wings, I would fly.</text>
<line x1="60.0" y1="70.0" x2="60.0" y2="350.0" stroke="#555" stroke-width="3" stroke-linecap="round"/>
<polygon points="60.0,350.0 54.8,339.2 65.2,339.2" fill="#555" stroke="#555" stroke-width="1" stroke-linejoin="round"/>
<text x="60.0" y="62.0" font-size="14" text-anchor="middle" fill="#2f7a3a" font-weight="bold">จริง</text>
<text x="40" y="215" font-size="14" fill="#555" text-anchor="middle" transform="rotate(-90 40 215)">ความเป็นจริงลดลง</text>
<text x="60.0" y="372.0" font-size="14" text-anchor="middle" fill="#8a3ab9" font-weight="bold">สมมุติ</text>
</svg>
