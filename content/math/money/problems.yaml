problems:
  - id: math.measure.money.p001
    topics: [math.measure.money]
    difficulty: 1
    type: numeric
    stem: "น้องมีเหรียญ 5 บาท 3 เหรียญ น้องมีเงินกี่บาท (ตอบในหน่วยบาท)"
    answer: { value: 15, unit: บาท }
    hints:
      - "นับเพิ่มทีละ 5"
      - "5, 10, …"
    misconceptions:
      - { match: 3, feedback: "3 คือจำนวนเหรียญ แต่ละเหรียญมีค่า 5 บาท" }
      - { match: 8, feedback: "บวก 5 กับ 3 ต้องนับเพิ่มทีละ 5 สามครั้ง" }
    solution: "นับ 5, 10, 15 น้องมีเงิน 15 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.money.p002
    topics: [math.measure.money]
    difficulty: 1
    type: mcq
    stem: "ข้อใดมีค่ามากที่สุด"
    choices:
      - { id: a, text: "ธนบัตร 20 บาท 1 ใบ", correct: true }
      - { id: b, text: "เหรียญ 10 บาท 1 เหรียญ", feedback: "10 บาทน้อยกว่า 20 บาท" }
      - { id: c, text: "เหรียญ 50 สตางค์ 3 เหรียญ", feedback: "50 สตางค์ 3 เหรียญ = 150 สตางค์ = 1 บาท 50 สตางค์ น้อยกว่า 20 บาทมาก" }
      - { id: d, text: "เหรียญ 5 บาท 2 เหรียญ", feedback: "5 บาท 2 เหรียญ = 10 บาท น้อยกว่า 20 บาท" }
    hints:
      - "หาค่าของแต่ละข้อเป็นบาท"
      - "100 สตางค์ = 1 บาท"
    solution: "ค่าของแต่ละข้อ: 20 บาท, 10 บาท, 1.50 บาท, 10 บาท ธนบัตร 20 บาทมีค่ามากที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.money.p003
    topics: [math.measure.money]
    difficulty: 1
    type: numeric
    stem: "1 บาท เท่ากับกี่สตางค์"
    answer: { value: 100, unit: สตางค์ }
    hints:
      - "สตางค์เป็นหน่วยย่อยของบาท"
      - "เหรียญ 25 สตางค์ 4 เหรียญเท่ากับ 1 บาท"
    misconceptions:
      - { match: 10, feedback: "1 บาทไม่ใช่ 10 สตางค์ เหรียญ 50 สตางค์ 2 เหรียญเท่ากับ 1 บาท จึงเป็น 100 สตางค์" }
    solution: "1 บาท = 100 สตางค์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.money.p004
    topics: [math.measure.money]
    difficulty: 2
    type: numeric
    stem: "นำเหรียญ 1 บาท ไปแลกเป็นเหรียญ 25 สตางค์ ได้กี่เหรียญ (ตอบเป็นจำนวนเหรียญ)"
    answer: { value: 4, unit: เหรียญ }
    hints:
      - "1 บาท = 100 สตางค์"
      - "25 + 25 + … ให้ได้ 100"
    misconceptions:
      - { match: 2, feedback: "แลกเป็นเหรียญ 50 สตางค์ได้ 2 เหรียญ แต่เหรียญ 25 สตางค์มีค่าน้อยกว่า จึงต้องใช้มากกว่า" }
      - { match: 25, feedback: "25 คือค่าของเหรียญหนึ่งเหรียญ ไม่ใช่จำนวนเหรียญ" }
    solution: "$25 + 25 + 25 + 25 = 100$ สตางค์ ได้ 4 เหรียญ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.money.p005
    topics: [math.measure.money]
    difficulty: 2
    type: numeric
    stem: "เงินในภาพรวมเป็นเงินเท่าไร (ตอบเป็นบาท ใช้จุดแทนสตางค์ เช่น 12.50)"
    figure: { src: money-count.svg, alt: "ธนบัตร 100 บาท 1 ใบ ธนบัตร 20 บาท 2 ใบ เหรียญ 10 บาท 1 เหรียญ เหรียญ 5 บาท 1 เหรียญ เหรียญ 1 บาท 1 เหรียญ เหรียญ 50 สตางค์ 1 เหรียญ และเหรียญ 25 สตางค์ 1 เหรียญ" }
    answer: { value: 156.75, tolerance: 0.001, unit: บาท }
    hints:
      - "นับธนบัตรก่อน แล้วนับเหรียญบาท แล้วจึงนับสตางค์"
      - "50 สตางค์ + 25 สตางค์ = 75 สตางค์ ซึ่งยังไม่ถึง 1 บาท"
    misconceptions:
      - { match: 231, feedback: "นับเหรียญ 50 สตางค์และ 25 สตางค์เป็น 50 บาทและ 25 บาท ต้องเป็นสตางค์" }
      - { match: 136.75, feedback: "นับธนบัตร 20 บาทแค่ใบเดียว ในภาพมี 2 ใบ" }
    solution: "ธนบัตร $100 + 20 + 20 = 140$ บาท เหรียญ $10 + 5 + 1 = 16$ บาท รวม 156 บาท และสตางค์ $50 + 25 = 75$ สตางค์ รวม 156.75 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.money.p006
    topics: [math.measure.money]
    difficulty: 2
    type: match
    stem: "จับคู่จำนวนเงินกับการเขียนด้วยจุด"
    pairs:
      - { left: "25 บาท 50 สตางค์", right: "25.50 บาท" }
      - { left: "3 บาท 25 สตางค์", right: "3.25 บาท" }
      - { left: "75 สตางค์", right: "0.75 บาท" }
      - { left: "40 บาท 5 สตางค์", right: "40.05 บาท" }
      - { left: "40 บาท 50 สตางค์", right: "40.50 บาท" }
    hints:
      - "หน้าจุดคือบาท หลังจุดคือสตางค์"
      - "หลังจุดต้องมีสองหลักเสมอ 5 สตางค์เขียน 05"
    solution: "หลังจุดเป็นสตางค์สองหลัก 5 สตางค์จึงเขียน .05 และ 50 สตางค์เขียน .50 ไม่มีบาทให้เขียน 0 หน้าจุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.money.p007
    topics: [math.measure.money]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดรวมกันได้ 20 บาทพอดี (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "เหรียญ 10 บาท 2 เหรียญ", correct: true }
      - { id: b, text: "เหรียญ 5 บาท 4 เหรียญ", correct: true }
      - { id: c, text: "เหรียญ 10 บาท 1 เหรียญ และเหรียญ 5 บาท 2 เหรียญ", correct: true }
      - { id: d, text: "เหรียญ 2 บาท 5 เหรียญ", feedback: "$2 + 2 + 2 + 2 + 2 = 10$ บาท ยังไม่ถึง 20 บาท" }
      - { id: e, text: "เหรียญ 5 บาท 2 เหรียญ และเหรียญ 1 บาท 5 เหรียญ", feedback: "$10 + 5 = 15$ บาท ยังขาดอีก 5 บาท" }
    hints:
      - "รวมเงินของแต่ละข้อ"
      - "ข้อที่ถูกต้องได้ 20 บาทพอดี"
    solution: "$10 + 10 = 20$, $5 + 5 + 5 + 5 = 20$, $10 + 5 + 5 = 20$ ส่วน 2 บาท 5 เหรียญได้ 10 บาท และอีกข้อได้ 15 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.money.p008
    topics: [math.measure.money]
    difficulty: 2
    type: numeric
    stem: "ซื้อขนมครก 35 บาท จ่ายด้วยธนบัตร 50 บาท จะได้เงินทอนกี่บาท (ตอบในหน่วยบาท)"
    answer: { value: 15, unit: บาท }
    hints:
      - "เงินทอน = เงินที่จ่าย − ราคา"
      - "นับต่อจาก 35 ไปถึง 50"
    misconceptions:
      - { match: 85, feedback: "บวกราคากับเงินที่จ่าย เงินทอนต้องใช้การลบ" }
      - { match: 25, feedback: "ลบผิด $50 - 35$ ไม่ใช่ 25 ลองนับต่อ 35 → 40 → 50" }
    solution: "$50 - 35 = 15$ บาท (นับต่อ 35 → 40 ได้ 5, 40 → 50 ได้ 10 รวม 15)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.money.p009
    topics: [math.measure.money]
    difficulty: 3
    type: order
    stem: "เรียงจำนวนเงินจากน้อยไปมาก"
    items: ["9.75 บาท", "10.05 บาท", "10.50 บาท", "15.25 บาท", "100.00 บาท"]
    hints:
      - "เทียบบาทก่อน"
      - "10.05 กับ 10.50 บาทเท่ากัน เทียบสตางค์ 5 กับ 50"
    solution: "9 บาท < 10 บาท < 15 บาท < 100 บาท และ 10.05 < 10.50 เพราะ 5 สตางค์ < 50 สตางค์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.money.p010
    topics: [math.measure.money]
    difficulty: 3
    type: numeric
    stem: "ซื้อปากกา 12.50 บาท และสมุด 18.75 บาท ต้องจ่ายเงินทั้งหมดเท่าไร (ตอบเป็นบาท ใช้จุดแทนสตางค์)"
    answer: { value: 31.25, tolerance: 0.001, unit: บาท }
    hints:
      - "บวกสตางค์: 50 + 75 = 125 สตางค์"
      - "125 สตางค์ = 1 บาท 25 สตางค์ ต้องทด 1 บาท"
    misconceptions:
      - { match: 30.125, feedback: "สตางค์รวมได้ 125 ต้องทด 100 สตางค์เป็น 1 บาท หลังจุดมีได้แค่สองหลัก" }
      - { match: 30.25, feedback: "เขียน 25 สตางค์แล้วลืมทด 1 บาท" }
    solution: "บาท $12 + 18 = 30$ สตางค์ $50 + 75 = 125$ = 1 บาท 25 สตางค์ รวม 31.25 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.money.p011
    topics: [math.measure.money]
    difficulty: 3
    type: mcq
    stem: "กระเป๋าของกิ่งมีเงิน 45.50 บาท กระเป๋าของก้อยมีเงิน 45 บาท 5 สตางค์ ใครมีเงินมากกว่า"
    choices:
      - { id: a, text: "กิ่ง", correct: true }
      - { id: b, text: "ก้อย", feedback: "45 บาท 5 สตางค์ = 45.05 บาท ซึ่งน้อยกว่า 45.50 บาท" }
      - { id: c, text: "มีเท่ากัน", feedback: "45 บาท 5 สตางค์ไม่ใช่ 45.50 บาท 5 สตางค์เขียนเป็น .05" }
    hints:
      - "เขียนเงินของก้อยด้วยจุด"
      - "บาทเท่ากัน เทียบสตางค์ 50 กับ 5"
    solution: "ก้อยมี 45.05 บาท บาทเท่ากัน แต่ 50 สตางค์ > 5 สตางค์ กิ่งจึงมีเงินมากกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.money.p012
    topics: [math.measure.money]
    difficulty: 4
    type: numeric
    stem: "ซื้อของที่ร้านสะดวกซื้อรวม 63.25 บาท จ่ายด้วยธนบัตร 100 บาท ได้เงินทอนเท่าไร (ตอบเป็นบาท ใช้จุดแทนสตางค์)"
    answer: { value: 36.75, tolerance: 0.001, unit: บาท }
    hints:
      - "เขียน 100 บาท เป็น 100.00 บาท แล้วตั้งจุดให้ตรงกัน"
      - "สตางค์ 0 ไม่พอลบ 25 ต้องกระจาย 1 บาทเป็น 100 สตางค์"
    misconceptions:
      - { match: 37.75, feedback: "กระจาย 1 บาทมาเป็นสตางค์แล้ว แต่ลืมลดบาทลง 1" }
      - { match: 37.25, feedback: "ลบแค่บาท แล้วนำ 25 สตางค์มาเขียนต่อ ต้องลบสตางค์ด้วย" }
    solution: "$100.00 - 63.25 = 36.75$ บาท (นับต่อ: 63.25 → 64 ได้ 0.75, 64 → 100 ได้ 36 รวม 36.75)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.money.p013
    topics: [math.measure.money]
    difficulty: 4
    type: numeric
    stem: "ดูบันทึกรายรับรายจ่ายของน้องมิว เมื่อสิ้นวันที่ 3 ตุลาคม น้องมิวเหลือเงินเท่าไร (เริ่มวันที่ 1 โดยไม่มีเงินเลย ตอบเป็นบาท ใช้จุดแทนสตางค์)"
    figure: { src: income-expense.svg, alt: "ตารางบันทึกรายรับรายจ่ายของน้องมิว คอลัมน์ วันที่ รายการ รายรับ รายจ่าย 1 ต.ค. แม่ให้ค่าขนม รายรับ 100.00 บาท 1 ต.ค. ซื้อขนม รายจ่าย 25.00 บาท 2 ต.ค. ซื้อสมุด รายจ่าย 18.50 บาท 2 ต.ค. ยายให้ รายรับ 50.00 บาท 3 ต.ค. ซื้อน้ำดื่ม รายจ่าย 12.00 บาท" }
    answer: { value: 94.5, tolerance: 0.001, unit: บาท }
    hints:
      - "รวมรายรับทั้งหมด และรวมรายจ่ายทั้งหมด"
      - "คงเหลือ = รายรับทั้งหมด − รายจ่ายทั้งหมด"
    misconceptions:
      - { match: 205.5, feedback: "บวกทุกจำนวนเข้าด้วยกัน รายจ่ายต้องลบออก" }
      - { match: 55.5, feedback: "55.50 บาทคือรายจ่ายทั้งหมด โจทย์ถามเงินที่เหลือ" }
    solution: "รายรับ $100 + 50 = 150$ บาท รายจ่าย $25 + 18.50 + 12 = 55.50$ บาท เหลือ $150 - 55.50 = 94.50$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.money.p014
    topics: [math.measure.money]
    difficulty: 3
    type: mcq
    stem: "แม่มีเงิน 200 บาท อยากซื้อข้าวสาร 189 บาท และน้ำปลา 32 บาท ประมาณแล้วเงินพอหรือไม่"
    choices:
      - { id: a, text: "ไม่พอ เพราะรวมประมาณ 220 บาท", correct: true }
      - { id: b, text: "พอ เพราะของแต่ละอย่างราคาไม่ถึง 200 บาท", feedback: "ต้องดูราคารวมของทั้งสองอย่าง ไม่ใช่ทีละอย่าง" }
      - { id: c, text: "พอ เพราะรวมประมาณ 190 บาท", feedback: "ปัดน้ำปลา 32 บาททิ้งไปเป็น 0 ไม่ได้ 32 บาทใกล้ 30 บาท" }
    hints:
      - "ปัด 189 เป็น 190 และ 32 เป็น 30"
      - "รวมแล้วมากกว่าหรือน้อยกว่า 200"
    solution: "ประมาณ $190 + 30 = 220$ บาท มากกว่า 200 บาท เงินไม่พอ (ราคาจริง $189 + 32 = 221$ บาท)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.money.p015
    topics: [math.measure.money]
    difficulty: 5
    type: numeric
    stem: "แม่มีธนบัตร 500 บาท 1 ใบ ไปตลาดซื้อหมู 156.50 บาท ผักบุ้ง 3 กำ กำละ 15 บาท และไข่ไก่ 1 แผง 112 บาท แม่ได้เงินทอนเท่าไร (ตอบเป็นบาท ใช้จุดแทนสตางค์)"
    answer: { value: 186.5, tolerance: 0.001, unit: บาท }
    hints:
      - "ผักบุ้ง 3 กำ ราคา $15 + 15 + 15$ บาท"
      - "รวมราคาทั้งหมดก่อน แล้วลบออกจาก 500"
    misconceptions:
      - { match: 216.5, feedback: "คิดราคาผักบุ้งแค่กำเดียว แต่ซื้อ 3 กำ" }
      - { match: 313.5, feedback: "313.50 บาทคือราคารวมของที่ซื้อ โจทย์ถามเงินทอน" }
    solution: "ผักบุ้ง $15 \\times 3 = 45$ บาท ราคารวม $156.50 + 45 + 112 = 313.50$ บาท เงินทอน $500 - 313.50 = 186.50$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.money.p016
    topics: [math.measure.money]
    difficulty: 4
    type: numeric
    stem: "ร้านต้องทอนเงิน 87 บาท โดยใช้ธนบัตรและเหรียญ (20, 50 บาท และเหรียญ 1, 2, 5, 10 บาท) ให้ได้จำนวนชิ้นน้อยที่สุด ต้องใช้กี่ชิ้น"
    answer: { value: 5, unit: ชิ้น }
    hints:
      - "เลือกชิ้นที่มีค่ามากที่สุดที่ยังไม่เกินก่อน"
      - "87 = 50 + 37 แล้วทำต่อกับ 37"
    misconceptions:
      - { match: 6, feedback: "ยังไม่น้อยที่สุด เช่น ใช้เหรียญ 1 บาท 2 เหรียญแทนเหรียญ 2 บาท หรือใช้ธนบัตร 20 บาท 4 ใบแทน 50 + 20 + 10 ลองเริ่มจากธนบัตร 50 บาท" }
    solution: "$87 = 50 + 20 + 10 + 5 + 2$ ใช้ 5 ชิ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.money.p017
    topics: [math.measure.money]
    difficulty: 5
    type: numeric
    stem: "ต้นมีเหรียญ 10 บาท และเหรียญ 5 บาท รวม 12 เหรียญ เป็นเงิน 85 บาท ต้นมีเหรียญ 10 บาทกี่เหรียญ"
    answer: { value: 5, unit: เหรียญ }
    hints:
      - "ถ้าทั้ง 12 เหรียญเป็นเหรียญ 5 บาท จะได้ 60 บาท ยังขาดกี่บาท"
      - "เปลี่ยนเหรียญ 5 บาท 1 เหรียญเป็นเหรียญ 10 บาท ได้เงินเพิ่ม 5 บาท ต้องเปลี่ยนกี่เหรียญ"
