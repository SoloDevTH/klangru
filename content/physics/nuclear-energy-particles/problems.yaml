  - id: physics.nuclear.nuclear-energy-particles.p015
    topics: [physics.nuclear.nuclear-energy-particles]
    difficulty: 5
    type: numeric
    stem: "โรงไฟฟ้านิวเคลียร์แห่งหนึ่ง (ค่าสมมติ) ผลิตไฟฟ้า $1000\\ \\mathrm{MW}$ ด้วยประสิทธิภาพ 33% ถ้าแต่ละฟิชชันให้พลังงาน $200\\ \\mathrm{MeV}$ ในแกนเตาเกิดฟิชชันกี่เท่าของ $10^{19}$ ครั้งต่อวินาที ($1\\ \\mathrm{MeV} = 1.6 \\times 10^{-13}\\ \\mathrm{J}$)"
    answer: { value: 9.47, tolerance: 0.1 }
    misconceptions:
      - { match: 3.13, feedback: "ใช้กำลังไฟฟ้า $1000\\ \\mathrm{MW}$ โดยตรง แกนเตาต้องผลิตความร้อนมากกว่านั้น เพราะประสิทธิภาพเพียง 33%" }
      - { match: 1.03, feedback: "คูณประสิทธิภาพแทนการหาร กำลังความร้อนต้องมากกว่ากำลังไฟฟ้า" }
    hints:
      - "กำลังความร้อน $= \\dfrac{1000\\ \\mathrm{MW}}{0.33}$"
      - "พลังงานต่อฟิชชัน $= 200 \\times 1.6 \\times 10^{-13}\\ \\mathrm{J}$ แล้วหารกำลังความร้อนด้วยค่านี้"
    solution: "กำลังความร้อน $= \\dfrac{1.0 \\times 10^{9}}{0.33} = 3.03 \\times 10^{9}\\ \\mathrm{W}$ พลังงานต่อฟิชชัน $= 3.2 \\times 10^{-11}\\ \\mathrm{J}$ จำนวนฟิชชัน $= \\dfrac{3.03 \\times 10^{9}}{3.2 \\times 10^{-11}} \\approx 9.47 \\times 10^{19}$ ครั้งต่อวินาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

