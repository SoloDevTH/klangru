<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" font-family="sans-serif">
<title>ตำแหน่งลิ้นของสระเดี่ยว 18 เสียง</title>
<rect x="0" y="0" width="760" height="480" fill="#fff"/>
<text x="380.0" y="34.0" font-size="22" text-anchor="middle" fill="#111" font-weight="bold">สระเดี่ยว: ตำแหน่งลิ้น (สั้น / ยาว)</text>
<text x="260.0" y="74.0" font-size="19" text-anchor="middle" fill="#1f5fbf" font-weight="bold">ลิ้นส่วนหน้า</text>
<text x="440.0" y="74.0" font-size="19" text-anchor="middle" fill="#1f5fbf" font-weight="bold">ลิ้นส่วนกลาง</text>
<text x="620.0" y="74.0" font-size="19" text-anchor="middle" fill="#1f5fbf" font-weight="bold">ลิ้นส่วนหลัง</text>
<text x="156.0" y="144.5" font-size="19" text-anchor="end" fill="#1e8449" font-weight="bold">ลิ้นยกสูง</text>
<rect x="170.0" y="90.0" width="180.0" height="95.0" rx="0" fill="#fff" stroke="#666" stroke-width="1.5"/>
<text x="260.0" y="147.5" font-size="28" text-anchor="middle" fill="#111" font-weight="bold">อิ / อี</text>
<rect x="350.0" y="90.0" width="180.0" height="95.0" rx="0" fill="#fff" stroke="#666" stroke-width="1.5"/>
<text x="440.0" y="147.5" font-size="28" text-anchor="middle" fill="#111" font-weight="bold">อึ / อือ</text>
<rect x="530.0" y="90.0" width="180.0" height="95.0" rx="0" fill="#fdf2e3" stroke="#666" stroke-width="1.5"/>
<text x="620.0" y="147.5" font-size="28" text-anchor="middle" fill="#111" font-weight="bold">อุ / อู</text>
<text x="156.0" y="239.5" font-size="19" text-anchor="end" fill="#1e8449" font-weight="bold">ลิ้นยกกลาง</text>
<rect x="170.0" y="185.0" width="180.0" height="95.0" rx="0" fill="#fff" stroke="#666" stroke-width="1.5"/>
<text x="260.0" y="242.5" font-size="28" text-anchor="middle" fill="#111" font-weight="bold">เอะ / เอ</text>
<rect x="350.0" y="185.0" width="180.0" height="95.0" rx="0" fill="#fff" stroke="#666" stroke-width="1.5"/>
<text x="440.0" y="242.5" font-size="28" text-anchor="middle" fill="#111" font-weight="bold">เออะ / เออ</text>
<rect x="530.0" y="185.0" width="180.0" height="95.0" rx="0" fill="#fdf2e3" stroke="#666" stroke-width="1.5"/>
<text x="620.0" y="242.5" font-size="28" text-anchor="middle" fill="#111" font-weight="bold">โอะ / โอ</text>
<text x="156.0" y="334.5" font-size="19" text-anchor="end" fill="#1e8449" font-weight="bold">ลิ้นลดต่ำ</text>
<rect x="170.0" y="280.0" width="180.0" height="95.0" rx="0" fill="#fff" stroke="#666" stroke-width="1.5"/>
<text x="260.0" y="337.5" font-size="28" text-anchor="middle" fill="#111" font-weight="bold">แอะ / แอ</text>
<rect x="350.0" y="280.0" width="180.0" height="95.0" rx="0" fill="#fff" stroke="#666" stroke-width="1.5"/>
<text x="440.0" y="337.5" font-size="28" text-anchor="middle" fill="#111" font-weight="bold">อะ / อา</text>
<rect x="530.0" y="280.0" width="180.0" height="95.0" rx="0" fill="#fdf2e3" stroke="#666" stroke-width="1.5"/>
<text x="620.0" y="337.5" font-size="28" text-anchor="middle" fill="#111" font-weight="bold">เอาะ / ออ</text>
<rect x="540.0" y="393.0" width="26.0" height="20.0" rx="0" fill="#fdf2e3" stroke="#666" stroke-width="1.2"/>
<text x="574.0" y="409.0" font-size="17" text-anchor="start" fill="#333" font-weight="normal">ริมฝีปากห่อกลม</text>
<text x="170.0" y="409.0" font-size="17" text-anchor="start" fill="#555" font-weight="normal">← หน้าปาก</text>
<text x="520.0" y="409.0" font-size="17" text-anchor="end" fill="#555" font-weight="normal">คอ →</text>
<text x="380.0" y="462.0" font-size="18" text-anchor="middle" fill="#333" font-weight="normal">สระประสม 3 เสียง: เอีย = อี→อา · เอือ = อือ→อา · อัว = อู→อา</text>
</svg>
