<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="sans-serif" font-size="14">
  <title>ความหน่วงของแพ็กเก็ตหนึ่งชิ้นมีสี่ส่วน เวลาส่งออก เวลาเดินทางของสัญญาณ เวลาประมวลผล และเวลาเข้าคิว</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="880" height="330" fill="#ffffff"/>
  <rect x="20.0" y="40.0" width="150.0" height="70.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="95.0" y="71.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ต้นทาง</text>
  <text x="95.0" y="95.0" font-size="12" text-anchor="middle" fill="#1f2937" xml:space="preserve">ส่งแพ็กเก็ต</text>
  <rect x="360.0" y="40.0" width="160.0" height="70.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440.0" y="71.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">เราเตอร์</text>
  <text x="440.0" y="95.0" font-size="12" text-anchor="middle" fill="#1f2937" xml:space="preserve">อ่านส่วนหัว เลือกทาง</text>
  <rect x="710.0" y="40.0" width="150.0" height="70.0" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="785.0" y="71.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ปลายทาง</text>
  <text x="785.0" y="95.0" font-size="12" text-anchor="middle" fill="#1f2937" xml:space="preserve">รับแพ็กเก็ต</text>
  <line x1="172.0" y1="75.0" x2="358.0" y2="75.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="522.0" y1="75.0" x2="708.0" y2="75.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah)"/>
  <text x="265.0" y="66.0" font-size="12" text-anchor="middle" fill="#6b7280" xml:space="preserve">สาย 700 km</text>
  <rect x="380.0" y="120.0" width="18.0" height="22.0" rx="2" fill="#ffedd5" stroke="#c2410c" stroke-width="1"/>
  <rect x="402.0" y="120.0" width="18.0" height="22.0" rx="2" fill="#ffedd5" stroke="#c2410c" stroke-width="1"/>
  <rect x="424.0" y="120.0" width="18.0" height="22.0" rx="2" fill="#ffedd5" stroke="#c2410c" stroke-width="1"/>
  <rect x="446.0" y="120.0" width="18.0" height="22.0" rx="2" fill="#ffedd5" stroke="#c2410c" stroke-width="1"/>
  <text x="440.0" y="160.0" font-size="12" text-anchor="middle" fill="#6b7280" xml:space="preserve">คิวในเราเตอร์</text>
  <rect x="20.0" y="190.0" width="200.0" height="110.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="120.0" y="218.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">1 เวลาส่งออก</text>
  <text x="120.0" y="244.0" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">ขนาด ÷ แบนด์วิดท์</text>
  <text x="120.0" y="268.0" font-size="12" text-anchor="middle" fill="#6b7280" xml:space="preserve">1,500 ไบต์ ที่ 10 Mbps = 1.2 ms</text>
  <rect x="235.0" y="190.0" width="200.0" height="110.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="335.0" y="218.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">2 เวลาเดินทาง</text>
  <text x="335.0" y="244.0" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">ระยะทาง ÷ อัตราเร็วสัญญาณ</text>
  <text x="335.0" y="268.0" font-size="12" text-anchor="middle" fill="#6b7280" xml:space="preserve">700 km ในใยแก้ว ≈ 3.5 ms</text>
  <rect x="450.0" y="190.0" width="200.0" height="110.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="550.0" y="218.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">3 เวลาประมวลผล</text>
  <text x="550.0" y="244.0" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">เราเตอร์อ่านส่วนหัว</text>
  <text x="550.0" y="268.0" font-size="12" text-anchor="middle" fill="#6b7280" xml:space="preserve">มักน้อยมาก</text>
  <rect x="665.0" y="190.0" width="200.0" height="110.0" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="765.0" y="218.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">4 เวลาเข้าคิว</text>
  <text x="765.0" y="244.0" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">รอเมื่อข้อมูลเข้ามาก</text>
  <text x="765.0" y="268.0" font-size="12" text-anchor="middle" fill="#6b7280" xml:space="preserve">ไม่คงที่ ขึ้นกับภาระ</text>
</svg>
