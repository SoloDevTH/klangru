# หัวข้อคณิตศาสตร์ในคลังกับผลการเรียนรู้คณิตศาสตร์เพิ่มเติม ม.4-ม.6 (สสวท. เสนอแนะ)
# จับคู่จากเนื้อหาบทเรียนและโจทย์ของแต่ละหัวข้อ coverage ใช้กับทุกข้อในแถวเหมือน th-core-2560-math
framework: th-core-2560-math-additional
mappings:
  - topic: math.prob.counting
    indicators: ["ค เพิ่มเติม 3.1 ม.5/1"]
    coverage: full
  - topic: math.calculus.derivative
    indicators: ["ค เพิ่มเติม 4.1 ม.6/2"]
    coverage: partial
    note: "อนุพันธ์ของพหุนาม เส้นสัมผัส ค่าสูงสุดต่ำสุด และความเร็ว ยังไม่มีอนุพันธ์ของฟังก์ชันพีชคณิตอื่น เช่น ฟังก์ชันตรรกยะ และกฎลูกโซ่"
  - topic: math.algebra.exponent-laws
    indicators: ["ค เพิ่มเติม 1.1 ม.4/3"]
    coverage: partial
    note: "จำนวนจริงในรูปเลขยกกำลังที่มีเลขชี้กำลังเป็นจำนวนตรรกยะและรากที่ n ยังไม่มีสมบัติของจำนวนจริงและค่าสัมบูรณ์"
  - topic: math.functions.exponential
    indicators: ["ค เพิ่มเติม 1.2 ม.4/3", "ค เพิ่มเติม 1.3 ม.4/4"]
    coverage: partial
    note: "กราฟของฟังก์ชันเอกซ์โพเนนเชียลและการนำไปใช้ สมการเอกซ์โพเนนเชียลที่ทำฐานให้เท่ากันได้ ยังไม่มีกราฟของฟังก์ชันลอการิทึม"
  - topic: math.functions.functions-intro
    indicators: ["ค เพิ่มเติม 1.2 ม.4/1", "ค เพิ่มเติม 1.2 ม.4/2"]
    coverage: partial
    note: "ฟังก์ชัน โดเมน เรนจ์ และฟังก์ชันประกอบ ยังไม่มีการบวก ลบ คูณ หารฟังก์ชัน และฟังก์ชันผกผัน"
  - topic: math.functions.linear-graphs
    indicators: ["ค เพิ่มเติม 2.1 ม.4/1"]
    coverage: partial
    note: "ความชัน สมการเส้นตรง เส้นขนานและเส้นตั้งฉาก (ส่วนจุดและเส้นตรงของเรขาคณิตวิเคราะห์) ยังไม่มีภาคตัดกรวย"
  - topic: math.functions.logarithms
    indicators: ["ค เพิ่มเติม 1.2 ม.4/3", "ค เพิ่มเติม 1.3 ม.4/4"]
    coverage: partial
    note: "ความหมายและสมบัติของลอการิทึม และการแก้สมการเอกซ์โพเนนเชียลด้วยลอการิทึม ยังไม่มีกราฟของฟังก์ชันลอการิทึมและสมการลอการิทึม"
  - topic: math.prob.probability
    indicators: ["ค เพิ่มเติม 3.1 ม.5/2"]
    coverage: full
  - topic: math.geometry.pythagoras
    indicators: ["ค เพิ่มเติม 2.1 ม.4/1"]
    coverage: partial
    note: "ระยะทางระหว่างจุดสองจุดบนระนาบพิกัด ซึ่งเป็นส่วนหนึ่งของเรขาคณิตวิเคราะห์"
  - topic: math.algebra.quadratic-eq
    indicators: ["ค เพิ่มเติม 1.3 ม.4/1"]
    coverage: partial
    note: "สมการพหุนามดีกรีสอง ยังไม่มีดีกรีสามและสี่ และอสมการพหุนาม"
  - topic: math.functions.quadratic
    indicators: ["ค เพิ่มเติม 1.2 ม.4/2"]
    coverage: partial
    note: "ใช้สมบัติของฟังก์ชันกำลังสองแก้ปัญหาค่าสูงสุดต่ำสุด ยังไม่มีฟังก์ชันชนิดอื่น เช่น ฟังก์ชันขั้นบันได ฟังก์ชันค่าสัมบูรณ์"
  - topic: math.calculus.rate-of-change
    indicators: ["ค เพิ่มเติม 4.1 ม.6/2"]
    coverage: partial
    note: "อัตราการเปลี่ยนแปลงเฉลี่ยและขณะหนึ่ง และลิมิตของผลหารเชิงผลต่าง ซึ่งเป็นนิยามของอนุพันธ์"
  - topic: math.number.roots
    indicators: ["ค เพิ่มเติม 1.1 ม.4/3"]
    coverage: partial
    note: "จำนวนตรรกยะ จำนวนอตรรกยะ และจำนวนจริงบนเส้นจำนวน รากที่สองและรากที่สาม ยังไม่มีสมบัติของจำนวนจริงและค่าสัมบูรณ์"
  - topic: math.geometry.vectors
    indicators: ["ค เพิ่มเติม 2.2 ม.5/1"]
    coverage: partial
    note: "เวกเตอร์ในสองมิติ การบวก ลบ คูณด้วยสเกลาร์ ขนาดและทิศทาง ยังไม่มีเวกเตอร์ในสามมิติ ผลคูณเชิงสเกลาร์ และผลคูณเชิงเวกเตอร์"
  - topic: math.logic.sets
    indicators: [ค เพิ่มเติม 1.1 ม.4/1]
    coverage: full
  - topic: math.algebra.radicals
    indicators: [ค เพิ่มเติม 1.1 ม.4/3]
    coverage: full
    note: สมบัติปิด สลับที่ เปลี่ยนกลุ่ม เอกลักษณ์ ตัวผกผัน การแจกแจง สมบัติการไม่เท่ากัน และค่าสัมบูรณ์ สมการและอสมการค่าสัมบูรณ์อยู่ในหัวข้อในแผน math.algebra.rational-abs-inequalities
  - topic: math.logic.propositions
    indicators: [ค เพิ่มเติม 1.1 ม.4/2]
    coverage: full
    note: รวมรูปแบบที่สมมูลกัน สัจนิรันดร์ นิเสธของตัวบ่งปริมาณ และการตรวจความสมเหตุสมผลของการอ้างเหตุผล
  - topic: math.algebra.polynomial-equations
    indicators: [ค เพิ่มเติม 1.3 ม.4/1, ค เพิ่มเติม 1.3 ม.5/6]
    coverage: full
    note: แก้สมการดีกรีสามและสี่ (รวม u = x²) อสมการพหุนามด้วยเส้นจำนวนบอกเครื่องหมาย และโจทย์ปัญหา (กล่อง แท็งก์น้ำ แปลงนา)
  - topic: math.algebra.sequences-series
    indicators: [ค เพิ่มเติม 1.2 ม.6/1, ค เพิ่มเติม 1.2 ม.6/2, ค เพิ่มเติม 1.2 ม.6/3, ค เพิ่มเติม 1.2 ม.6/4]
    coverage: full
    note: ลิมิตของลำดับ ลู่เข้าลู่ออก ผลบวก n พจน์แรก อนุกรมเรขาคณิตอนันต์ ทศนิยมซ้ำ ลูกบอลกระดอน
  - topic: math.functions.trig-functions
    indicators: [ค เพิ่มเติม 1.2 ม.5/1, ค เพิ่มเติม 1.3 ม.5/1]
    coverage: full
    note: ยังไม่มีสูตรมุมสองเท่า ผลคูณเป็นผลบวก และฟังก์ชัน sec cosec cot ซึ่งตำรา สสวท. ม.5 สอน อาจเป็นหัวข้อต่อยอด
  - topic: math.geometry.law-of-sines-cosines
    indicators: [ค เพิ่มเติม 1.3 ม.5/2]
    coverage: full
