  - id: math.int.p017
    topics: [math.number.integers]
    difficulty: 3
    type: numeric
    stem: "หาค่า $(-2)^3 - 4 \\times (-3) + 12 \\div (-4)$"
    answer: { value: 1 }
    hints:
      - "ทำตามลำดับ: ยกกำลังก่อน แล้วคูณหาร สุดท้ายบวกลบ"
      - "$(-2)^3 = (-2)(-2)(-2)$ จำนวนลบคูณกันสามตัวได้เครื่องหมายใด"
      - "$-4 \\times (-3)$ ได้บวก และ $12 \\div (-4)$ ได้ลบ แล้วนำทั้งสามพจน์มารวมกัน"
    misconceptions:
      - { match: 17, feedback: "$(-2)^3$ เป็นลบ เพราะลบคูณกันสามตัว: $(-2)(-2) = 4$ แล้ว $4 \\times (-2) = -8$ ไม่ใช่ $8$" }
      - { match: 7, feedback: "$12 \\div (-4) = -3$ เครื่องหมายต่างกันได้ลบ ไม่ใช่ $+3$" }
      - { match: -23, feedback: "$-4 \\times (-3)$ ต้องได้ $+12$ ลบคูณลบได้บวก" }
    solution: "$(-2)^3 = -8$, $4 \\times (-3) = -12$, $12 \\div (-4) = -3$ จึงได้ $-8 - (-12) + (-3) = -8 + 12 - 3 = 1$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.int.p018
