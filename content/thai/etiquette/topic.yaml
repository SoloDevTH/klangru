id: thai.communication.etiquette
subject: thai
title: { th: "มารยาทในการอ่าน การเขียน การฟัง การดู และการพูด", en: "Etiquette in reading, writing, listening, viewing and speaking" }
summary: มารยาทในการอ่าน การเขียน การฟัง การดู และการพูด รวมถึงการบอกแหล่งที่มา ไม่ลอกงานผู้อื่น และมารยาทออนไลน์ ฝึกตัดสินใจจากสถานการณ์
difficulty: 1.5
minutes: 25
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - type: figure
    src: etiquette-overview.svg
    alt: "ตาราง 5 คอลัมน์สรุปมารยาท การอ่าน: ไม่ส่งเสียงดัง ไม่แอบอ่านของผู้อื่น ถนอมหนังสือ ไม่พับมุม ไม่ขีดเขียน การเขียน: เขียนให้อ่านง่าย ใช้คำสุภาพ ไม่ลอกงานผู้อื่น บอกแหล่งที่มา การฟัง: มองผู้พูด ไม่พูดแทรก ไม่คุยกัน ถามเมื่อพูดจบ การดู: นั่งเรียบร้อย ไม่บังผู้อื่น ปิดเสียงโทรศัพท์ ไม่ถ่ายภาพในที่ที่ห้ามถ่าย การพูด: ใช้คำสุภาพ ครับ ค่ะ เสียงดังพอดี ไม่พูดล้อเลียน ไม่พูดขณะมีอาหารในปาก"
    caption: "มารยาท 5 เรื่องโดยสรุป"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: ใช้ข้อมูลจากหนังสือในรายงานอย่างมีมารยาท
    problem: "แพรอ่านหนังสือ \"นกในสวนหลังบ้าน\" ของ สมชาย ใจดี (พิมพ์ปี 2567) หน้า 12 เขียนว่า นกกางเขนบ้านชอบร้องเพลงตอนเช้า แพรจะใส่ข้อมูลนี้ในรายงานอย่างไร"
    steps:
      - text: "อ่านแล้วปิดหนังสือ เขียนใจความด้วยคำของตัวเอง เช่น นกกางเขนบ้านมักส่งเสียงร้องในตอนเช้า"
        why: "ถ้าคัดลอกทั้งประโยค งานนั้นจะเป็นคำของผู้เขียน ไม่ใช่ของเรา"
      - text: "จดแหล่งที่มา: ผู้เขียน ปี ชื่อหนังสือ หน้า"
      - text: "เขียนท้ายข้อความหรือท้ายรายงาน: สมชาย ใจดี. (2567). นกในสวนหลังบ้าน. หน้า 12."
    answer: "เรียบเรียงด้วยคำของตัวเองและบอกแหล่งที่มาครบ ผู้เขียน ปี ชื่อหนังสือ หน้า"
  - { type: check, problem: thai.communication.etiquette.p009, prompt: "แหล่งที่มาที่ดีทำให้คนอื่นตามไปอ่านได้" }
  - type: worked-example
    title: ตอบความคิดเห็นที่ไม่สุภาพในกลุ่มแชต
    problem: "มีคนพิมพ์ในกลุ่มแชตว่า \"รูปของบีเหมือนเด็กอนุบาลวาด 555\" ถ้าเราเป็นเพื่อนในกลุ่ม ควรทำอย่างไร"
    steps:
      - text: "ไม่กดหัวเราะ และไม่ตอบด้วยคำหยาบ"
        why: "การกดหัวเราะเท่ากับสนับสนุนการล้อเลียน คำหยาบก็ผิดมารยาทเหมือนกัน"
      - text: "พิมพ์อย่างสุภาพ เช่น \"ชมกันดีกว่านะ บีตั้งใจวาดมาก\""
      - text: "ถ้ายังมีการล้อเลียนต่อ ให้บอกครูที่ดูแลกลุ่ม"
    answer: "ไม่ร่วมล้อเลียน เตือนอย่างสุภาพ และขอให้ครูช่วยเมื่อจำเป็น"
  - { type: check, problem: thai.communication.etiquette.p005, prompt: "หาข้อความที่ทำให้เพื่อนอับอาย" }
glossary:
  - { term: มารยาท, definition: "กิริยาวาจาที่เหมาะสมกับกาลเทศะ โดยคิดถึงผู้อื่น" }
  - { term: การอ้างอิง, definition: "การบอกแหล่งที่มาของข้อความหรือข้อมูลที่นำมาใช้ เช่น ผู้เขียน ปี ชื่อเรื่อง หน้า" }
  - { term: การลักลอกผลงาน, definition: "การนำงานเขียนหรือความคิดของผู้อื่นมาเป็นของตนโดยไม่บอกที่มา" }
  - { term: ข้อมูลส่วนตัว, definition: "ข้อมูลที่ระบุตัวบุคคลได้ เช่น เบอร์โทรศัพท์ ที่อยู่ รูปภาพ ไม่ควรเผยแพร่โดยเจ้าของไม่อนุญาต" }
flashcards:
  - { front: "มารยาทในการอ่านในห้องสมุด", back: "อ่านในใจ ไม่ส่งเสียง ไม่พับมุม ไม่ขีดเขียน คืนตรงเวลา" }
  - { front: "นำข้อความของผู้อื่นมาใช้ต้องทำอย่างไร", back: "เรียบเรียงด้วยคำของตัวเองและบอกแหล่งที่มา" }
  - { front: "สงสัยขณะฟังผู้อื่นพูดควรทำอย่างไร", back: "จดคำถามไว้ รอให้พูดจบ แล้วยกมือถาม" }
  - { front: "ติงานเพื่อนอย่างมีมารยาท", back: "ชมส่วนที่ดีก่อน แล้วเสนอแนะที่งาน ไม่ติที่ตัวคน" }
