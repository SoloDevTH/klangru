id: business.finance.break-even
subject: business
title: { th: ต้นทุน จุดคุ้มทุน และกำไรเป้าหมาย, en: "Costs, break-even point and target profit" }
summary: แยกต้นทุนคงที่กับต้นทุนผันแปร หากำไรส่วนเกินต่อหน่วย จำนวนขายที่จุดคุ้มทุน และจำนวนที่ต้องขายเพื่อให้ได้กำไรตามเป้า พร้อมอ่านกราฟรายได้กับต้นทุน
difficulty: 5
minutes: 40
prerequisites: [math.functions.linear-graphs, business.accounting.equation]
encompasses:
  - { id: math.functions.linear-graphs, weight: 0.4 }
  - { id: math.algebra.linear-eq, weight: 0.4 }
  - { id: business.accounting.equation, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: break-even-chart.svg
    alt: "กราฟจุดคุ้มทุนของรถเข็นกาแฟ แกนนอนคือจำนวนแก้วต่อเดือน 0 ถึง 500 แกนตั้งคือบาท 0 ถึง 25,000 เส้นต้นทุนคงที่เป็นเส้นประแนวนอนที่ 9,000 บาท เส้นต้นทุนรวมเริ่มที่ 9,000 บาทและขึ้นไปถึง 19,000 บาทที่ 500 แก้ว เส้นรายได้รวมเริ่มที่ 0 และขึ้นไปถึง 25,000 บาทที่ 500 แก้ว สองเส้นตัดกันที่ 300 แก้ว 15,000 บาท คือจุดคุ้มทุน ทางซ้ายเป็นช่วงขาดทุน ทางขวาเป็นช่วงกำไร"
    caption: "ต้นทุนคงที่ $9{,}000$ บาท ราคาแก้วละ $50$ บาท ต้นทุนผันแปรแก้วละ $20$ บาท เส้นทั้งสองตัดกันที่ $300$ แก้ว"
  - { type: check, problem: bus.bep.p003, prompt: "ลองคิดก่อนดูตัวอย่าง" }
  - type: worked-example
    title: จุดคุ้มทุนของร้านขายเคสโทรศัพท์ออนไลน์
    problem: "ฝนขายเคสโทรศัพท์ทางออนไลน์ ราคาชิ้นละ $120$ บาท ต้นทุนสินค้าและค่าแพ็กของรวมชิ้นละ $72$ บาท จ่ายค่าโฆษณาเหมาเดือนละ $2{,}400$ บาท ต้องขายเดือนละกี่ชิ้นจึงคุ้มทุน"
    steps:
      - text: "แยกต้นทุน: ค่าโฆษณาเหมาเดือน $F = 2{,}400$ บาท เป็นต้นทุนคงที่ ส่วน $v = 72$ บาทต่อชิ้นเป็นต้นทุนผันแปร"
        why: "ค่าโฆษณาจ่ายเท่าเดิมไม่ว่าจะขายได้กี่ชิ้น แต่ค่าสินค้าและค่าแพ็กเพิ่มขึ้นทุกครั้งที่ขายได้หนึ่งชิ้น"
      - text: "กำไรส่วนเกินต่อชิ้น $= p - v = 120 - 72 = 48$ บาท"
      - text: "จุดคุ้มทุน $= \\dfrac{F}{p - v} = \\dfrac{2{,}400}{48} = 50$ ชิ้น"
        why: "ต้องมีกำไรส่วนเกินสะสมครบ $2{,}400$ บาท แต่ละชิ้นให้ $48$ บาท จึงต้องขาย $2{,}400 \\div 48$ ชิ้น"
      - text: "ตรวจ: รายได้ $120 \\times 50 = 6{,}000$ บาท ต้นทุนรวม $2{,}400 + 72 \\times 50 = 6{,}000$ บาท เท่ากันพอดี"
    answer: "ต้องขายเดือนละ $50$ ชิ้นจึงคุ้มทุน"
  - type: worked-example
    title: แผงน้ำส้มที่ตลาดนัดกับกำไรเป้าหมาย
    problem: "เอกขายน้ำส้มคั้นที่ตลาดนัดตอนเย็น ค่าเช่าแผงและค่าไฟรวมคืนละ $450$ บาท ส้ม น้ำแข็ง และขวดรวมขวดละ $13$ บาท ขายขวดละ $25$ บาท (ก) คืนหนึ่งต้องขายกี่ขวดจึงไม่ขาดทุน (ข) ถ้าอยากได้กำไรคืนละอย่างน้อย $600$ บาท ต้องขายกี่ขวด"
    steps:
      - text: "กำไรส่วนเกินต่อขวด $= 25 - 13 = 12$ บาท ต้นทุนคงที่ต่อคืน $F = 450$ บาท"
      - text: "(ก) $\\dfrac{450}{12} = 37.5$ ขวด"
      - text: "ปัดขึ้นเป็น $38$ ขวด ตรวจ: $12 \\times 38 - 450 = 6$ บาท (กำไรเล็กน้อย) แต่ $12 \\times 37 - 450 = -6$ บาท (ขาดทุน)"
        why: "ขายครึ่งขวดไม่ได้ และถ้าปัดลงจะยังขาดทุน จึงต้องปัดขึ้นเสมอ"
      - text: "(ข) ให้กำไรส่วนเกินจ่ายทั้งค่าแผงและกำไรเป้าหมาย: $\\dfrac{450 + 600}{12} = 87.5$ ขวด"
        why: "ต้นทุนคงที่ต้องถูกจ่ายให้หมดก่อน กำไรจึงเริ่มสะสม"
      - text: "ปัดขึ้นเป็น $88$ ขวด ตรวจ: $12 \\times 88 - 450 = 606$ บาท ไม่น้อยกว่า $600$ บาท"
    answer: "(ก) $38$ ขวดต่อคืน (ข) $88$ ขวดต่อคืน"
  - { type: check, problem: bus.bep.p009, prompt: "ลองโจทย์ที่ต้องปัดเศษ" }
  - type: interactive
    title: เลื่อนราคาและต้นทุนแล้วดูจุดคุ้มทุนขยับ
    caption: "แกนนอนคือจำนวนแก้วต่อเดือน แกนตั้งคือบาท เส้นแรกคือรายได้รวม $p\\,x$ เส้นที่สองคือต้นทุนรวม $F + v\\,x$ เส้นที่สามคือกำไร $(p - v)\\,x - F$ ซึ่งตัดแกนนอนที่จุดคุ้มทุน (F เป็นพันบาท) ลองตั้ง p = 50, v = 20, F = 9 แล้วขึ้นราคาเป็น 60 สังเกตว่าจุดคุ้มทุนเลื่อนจาก 300 มาเหลือ 225 แก้ว"
    widget:
      kind: function-plot
      functions: ["p x", "1000 F + v x", "(p - v)\\cdot x - 1000 F"]
      sliders:
        - { name: p, min: 25, max: 80, step: 5, value: 50, label: ราคาต่อแก้ว (บาท) }
        - { name: v, min: 5, max: 40, step: 1, value: 20, label: ต้นทุนผันแปรต่อแก้ว (บาท) }
        - { name: F, min: 3, max: 15, step: 1, value: 9, label: ต้นทุนคงที่ (พันบาท) }
      x: [0, 600]
      y: [-15000, 30000]
glossary:
  - { term: ต้นทุนคงที่, definition: "ค่าใช้จ่ายที่ไม่เปลี่ยนตามจำนวนที่ผลิตหรือขายได้ในช่วงเวลาหนึ่ง เช่น ค่าเช่าที่ ค่าผ่อนเครื่อง" }
  - { term: ต้นทุนผันแปร, definition: "ค่าใช้จ่ายที่เพิ่มขึ้นตามจำนวนที่ผลิตหรือขาย มักคิดเป็นต้นทุนต่อหน่วย $v$ เช่น วัตถุดิบ บรรจุภัณฑ์" }
  - { term: กำไรส่วนเกินต่อหน่วย, definition: "ราคาขายลบต้นทุนผันแปรต่อหน่วย $p - v$ เป็นเงินที่แต่ละหน่วยเหลือไว้จ่ายต้นทุนคงที่และเป็นกำไร" }
  - { term: จุดคุ้มทุน, definition: "จำนวนขาย (หรือยอดขาย) ที่ทำให้รายได้รวมเท่ากับต้นทุนรวม กำไรเป็นศูนย์ หาได้จาก $\\dfrac{F}{p - v}$" }
  - { term: กำไรเป้าหมาย, definition: "กำไรที่ธุรกิจตั้งใจจะได้ จำนวนที่ต้องขายคือ $\\dfrac{F + \\text{กำไรเป้าหมาย}}{p - v}$" }
flashcards:
  - { front: "สูตรจุดคุ้มทุน (หน่วย)", back: "$x = \\dfrac{F}{p - v}$ ต้นทุนคงที่หารด้วยกำไรส่วนเกินต่อหน่วย แล้วปัดขึ้น" }
  - { front: "กำไรเมื่อขายได้ $x$ หน่วย", back: "$(p - v)\\,x - F$" }
  - { front: "ค่าเช่าร้านรายเดือนกับค่าแก้วกระดาษ อย่างไหนเป็นต้นทุนคงที่", back: "ค่าเช่าร้านรายเดือนเป็นต้นทุนคงที่ ค่าแก้วกระดาษเพิ่มตามจำนวนแก้วที่ขาย จึงเป็นต้นทุนผันแปร" }
  - { front: "ขึ้นราคาแล้วจุดคุ้มทุนเปลี่ยนอย่างไร (ต้นทุนเท่าเดิม)", back: "กำไรส่วนเกินต่อหน่วยมากขึ้น จุดคุ้มทุนจึงลดลง" }
  - { front: "บนกราฟ จุดคุ้มทุนอยู่ตรงไหน", back: "จุดที่เส้นรายได้รวมตัดเส้นต้นทุนรวม ทางขวาของจุดนี้คือช่วงกำไร" }
