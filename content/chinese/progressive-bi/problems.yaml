problems:
- id: chinese.grammar.progressive-bi.p001
  topics:
  - chinese.grammar.progressive-bi
  difficulty: 1
  type: mcq
  stem: 他在看书呢。 (Tā zài kàn shū ne.) แปลว่าอะไร
  choices:
  - id: a
    text: เขาเคยอ่านหนังสือ
    feedback: เคย ใช้ 过
  - id: b
    text: เขาอ่านหนังสือเสร็จแล้ว
    feedback: เสร็จแล้วใช้ 了 หรือ 看完了
  - id: c
    text: เขากำลังอ่านหนังสืออยู่
    correct: true
    feedback: ถูก 在 + กริยา (+ 呢) = กำลัง…อยู่
  - id: d
    text: เขาอยู่ที่ร้านหนังสือ
    feedback: ไม่มีสถานที่หลัง 在 ในประโยคนี้ 在 จึงบอกว่ากำลังทำ
  hints:
  - 在 อยู่หน้ากริยา 看
  - 呢 ท้ายประโยคบอกว่ายังดำเนินอยู่
  solution: '**เขากำลังอ่านหนังสืออยู่**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.progressive-bi.p002
  topics:
  - chinese.grammar.progressive-bi
  difficulty: 1
  type: mcq
  stem: 曼谷比清迈大。 (Màngǔ bǐ Qīngmài dà.) แปลว่าอะไร
  choices:
  - id: a
    text: เชียงใหม่ใหญ่กว่ากรุงเทพฯ
    feedback: สิ่งที่มากกว่าอยู่หน้า 比 คือ 曼谷
  - id: b
    text: กรุงเทพฯ ใหญ่เท่าเชียงใหม่
    feedback: เท่ากันใช้ 跟…一样
  - id: c
    text: กรุงเทพฯ ไม่ใหญ่เท่าเชียงใหม่
    feedback: ไม่…เท่า ใช้ 没有
  - id: d
    text: กรุงเทพฯ ใหญ่กว่าเชียงใหม่
    correct: true
    feedback: ถูก A 比 B + คุณศัพท์ = A …กว่า B
  hints:
  - ดูว่าคำใดอยู่หน้า 比
  - 大 = ใหญ่
  solution: '**กรุงเทพฯ ใหญ่กว่าเชียงใหม่** (曼谷 อยู่หน้า 比 จึงเป็นฝ่ายที่ "มากกว่า")'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.progressive-bi.p003
  topics:
  - chinese.grammar.progressive-bi
  difficulty: 2
  type: order
  stem: เรียงคำเป็นประโยค "แม่กำลังทำอาหารอยู่"
  items:
  - 妈妈
  - 正在
  - 做饭
  - 呢
  hints:
  - 正在 วางหน้ากริยา
  - 呢 อยู่ท้ายประโยค
  solution: '**妈妈正在做饭呢。** Māma zhèngzài zuò fàn ne.'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.progressive-bi.p004
  topics:
  - chinese.grammar.progressive-bi
  difficulty: 2
  type: mcq
  stem: เพื่อนส่งข้อความมาถามว่า 你在做什么？ เรากำลังทำการบ้านอยู่ ควรตอบว่าอะไร
  choices:
  - id: a
    text: 我做了作业。
    feedback: 了 บอกว่าทำเสร็จแล้ว ไม่ใช่กำลังทำ
  - id: b
    text: 我在做作业。
    correct: true
    feedback: ถูก ตอบด้วยรูปเดียวกับคำถาม 在 + กริยา
  - id: c
    text: 我做作业在。
    feedback: 在 ต้องอยู่หน้ากริยา
  - id: d
    text: 我是做作业。
    feedback: ไม่ใช้ 是 บอกว่ากำลังทำ
  hints:
  - คำถามใช้ 在 + 做什么
  - แทน 什么 ด้วยสิ่งที่กำลังทำ
  solution: '**我在做作业。** Wǒ zài zuò zuòyè. (เติม 呢 ท้ายประโยคได้)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.progressive-bi.p005
  topics:
  - chinese.grammar.progressive-bi
  difficulty: 2
  type: hanzi
  stem: เขียนอักษร 比 (bǐ เปรียบเทียบ) ตามลำดับขีด
  character: 比
  pinyin: bǐ
  meaning: เปรียบเทียบ …กว่า
  hints:
  - 比 มี 4 ขีด ประกอบด้วยสองส่วนซ้ายขวาที่คล้ายกัน
  - เขียนส่วนซ้ายก่อน แล้วจึงเขียนส่วนขวา
  solution: 'ส่วนซ้าย: 横 → 竖提 แล้วส่วนขวา: 撇 → 竖弯钩 รวม 4 ขีด'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.progressive-bi.p006
  topics:
  - chinese.grammar.progressive-bi
  difficulty: 3
  type: mcq
  stem: '"เขาสูงกว่าฉัน" ประโยคใดถูกต้อง'
  choices:
  - id: a
    text: 他比我很高。
    feedback: หลัง 比 ห้ามใช้ 很
  - id: b
    text: 他高比我。
    feedback: 比 + B ต้องอยู่หน้าคุณศัพท์
  - id: c
    text: 他比我高很。
    feedback: 很 ไม่วางหลังคุณศัพท์ และไม่ใช้ในประโยค 比
  - id: d
    text: 他比我高。
    correct: true
    feedback: ถูก A 比 B + คุณศัพท์
  hints:
  - 'ลำดับ: A + 比 + B + คุณศัพท์'
  - ภาษาไทยมี "มาก" ได้ แต่ภาษาจีนไม่ใส่ 很 ในประโยค 比
  solution: '**他比我高。** Tā bǐ wǒ gāo.'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.progressive-bi.p007
  topics:
  - chinese.grammar.progressive-bi
  difficulty: 3
  type: numeric
  stem: ดูกราฟ 曼谷比昆明热几度？ (กรุงเทพฯ ร้อนกว่าคุนหมิงกี่องศา)
  figure: &id001
    src: weather-compare.svg
    alt: กราฟแท่งอุณหภูมิสูงสุดวันหนึ่งในเดือนเมษายน (ข้อมูลสมมติ) 曼谷 กรุงเทพฯ 35°C · 清迈 เชียงใหม่ 35°C · 普吉 ภูเก็ต 33°C · 昆明 คุนหมิง 24°C
    caption: อุณหภูมิสูงสุด (ข้อมูลสมมติ)
  answer:
    value: 11
    unit: องศาเซลเซียส
  misconceptions:
  - match: 59
    feedback: ไม่ต้องบวกกัน "ร้อนกว่ากี่องศา" คือผลต่าง
  - match: 35
    feedback: 35 คืออุณหภูมิของกรุงเทพฯ ต้องลบด้วยของคุนหมิง
  hints:
  - 曼谷 35°C 昆明 24°C
  - '热几度 ถามผลต่าง: นำค่ามากลบค่าน้อย'
  solution: $35 - 24 = 11$ องศา ตอบเป็นประโยคว่า **曼谷比昆明热十一度。**
  license: CC-BY-SA-4.0
  ai_assisted: true
