  - id: computer.security.cybersecurity-basics.p012
    topics: [computer.security.cybersecurity-basics]
    difficulty: 4
    type: numeric
    stem: "วลีรหัสผ่านสร้างจากการสุ่มคำ 4 คำ แต่ละคำสุ่มจากรายการ 2,048 คำ ($2^{11}$) โดยสุ่มซ้ำได้ จำนวนวลีที่เป็นไปได้ทั้งหมดเท่ากับ $2^n$ จงหา $n$"
    answer: { value: 44 }
    hints:
      - "จำนวนแบบทั้งหมด = 2,048 × 2,048 × 2,048 × 2,048"
      - "$(2^{11})^4$ ใช้กฎเลขยกกำลัง คูณเลขชี้กำลังเข้าด้วยกัน"
    misconceptions:
      - { match: 15, feedback: "บวก 11 + 4 แต่ $(2^{11})^4$ ต้องคูณเลขชี้กำลัง ได้ 11 × 4" }
      - { match: 13, feedback: "คิดว่า 4 คำเพิ่มเลขชี้กำลังแค่ 2 (เพราะ 4 = 2²) ต้องคูณ 11 ด้วย 4" }
    solution: "จำนวนแบบ = $(2^{11})^4 = 2^{44}$ ประมาณ 17.6 ล้านล้านแบบ จึง n = 44 เพิ่มคำที่ห้าจะได้ $2^{55}$ ซึ่งมากขึ้น 2,048 เท่า ความยาวจึงสำคัญที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.cybersecurity-basics.p013
    topics: [computer.security.cybersecurity-basics]
    difficulty: 4
    type: order
    stem: |
      คลินิกทันตกรรมเล็ก ๆ ให้คะแนนภัยคุกคาม (1–5) ดังนี้
      - ทำโทรศัพท์ที่ใช้รับนัดหาย: โอกาส 3 ผลกระทบ 3
      - พนักงานถูกฟิชชิงจนเสียบัญชีอีเมล: โอกาส 4 ผลกระทบ 5
      - เว็บนัดหมายล่มเพราะคนเข้าพร้อมกัน: โอกาส 2 ผลกระทบ 2
      - พนักงานพิมพ์ข้อมูลคนไข้ผิด: โอกาส 3 ผลกระทบ 4

      เรียงจากความเสี่ยง (โอกาส × ผลกระทบ) **สูงที่สุดไปต่ำที่สุด**
    items:
      - "พนักงานถูกฟิชชิงจนเสียบัญชีอีเมล"
      - "พนักงานพิมพ์ข้อมูลคนไข้ผิด"
      - "ทำโทรศัพท์ที่ใช้รับนัดหาย"
      - "เว็บนัดหมายล่มเพราะคนเข้าพร้อมกัน"
    hints:
      - "คูณโอกาสกับผลกระทบของแต่ละเรื่อง"
      - "เรียงผลคูณจากมากไปน้อย"
    solution: "ฟิชชิง 4 × 5 = 20 พิมพ์ผิด 3 × 4 = 12 โทรศัพท์หาย 3 × 3 = 9 เว็บล่ม 2 × 2 = 4 คลินิกจึงควรเริ่มจากฝึกพนักงานเรื่องฟิชชิงและเปิด MFA ให้อีเมล"
