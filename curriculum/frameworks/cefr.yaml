completeness: structure-and-summary
strands:
  - id: CEFR-reception
    title: การรับสาร (reception)
    standards:
      - id: CEFR-overall-listening
        text: "Overall listening comprehension: ความเข้าใจภาษาพูดโดยรวม"
        indicators:
          - { id: CEFR-A1-listening, level: A1, text: "เข้าใจคำพูดที่ช้ามากและชัดมาก มีช่วงหยุดให้คิดตาม และจับข้อมูลรูปธรรม เช่น สถานที่และเวลา ในเรื่องใกล้ตัวได้" }
          - { id: CEFR-A2-listening, level: A2, text: "เข้าใจวลีและสำนวนเรื่องจำเป็นใกล้ตัว เช่น ข้อมูลตัวเองและครอบครัว การซื้อของ ละแวกบ้าน งาน เมื่อพูดช้าและชัด" }
          - { id: CEFR-B1-listening, level: B1, text: "จับประเด็นหลักของคำพูดภาษามาตรฐานที่ชัดเจนในเรื่องที่พบประจำ เช่น งาน โรงเรียน เวลาว่าง รวมทั้งเรื่องเล่าสั้น ๆ และข้อมูลข้อเท็จจริงตรงไปตรงมา" }
          - { id: CEFR-B2-listening, level: B2, text: "เข้าใจภาษาพูดมาตรฐานทั้งพูดสดและผ่านสื่อ ทั้งเรื่องคุ้นและไม่คุ้น ตามการพูดยาวและข้อโต้แย้งซับซ้อนได้ถ้าหัวข้อค่อนข้างคุ้นเคย" }
          - { id: CEFR-C1-listening, level: C1, text: "ตามการพูดยาวเรื่องนามธรรมซับซ้อนนอกสาขาของตนได้ แม้ไม่ได้เรียงโครงชัดเจน และเข้าใจสำนวนกับภาษาปากได้หลากหลาย" }
          - { id: CEFR-C2-listening, level: C2, text: "เข้าใจภาษาพูดแทบทุกแบบได้สบาย แม้พูดเร็วตามธรรมชาติ" }
      - id: CEFR-overall-reading
        text: "Overall reading comprehension: ความเข้าใจการอ่านโดยรวม"
        indicators:
          - { id: CEFR-A1-reading, level: A1, text: "อ่านข้อความสั้นมากและง่ายทีละวลี จับชื่อ คำ และวลีพื้นฐานที่คุ้นเคย อ่านซ้ำได้เมื่อต้องการ" }
          - { id: CEFR-A2-reading, level: A2, text: "เข้าใจข้อความสั้นและง่ายเรื่องรูปธรรมที่คุ้นเคย ซึ่งใช้คำศัพท์ที่พบบ่อยในชีวิตประจำวันหรืองาน" }
          - { id: CEFR-B1-reading, level: B1, text: "อ่านข้อความข้อเท็จจริงที่ตรงไปตรงมาในเรื่องที่เกี่ยวกับความสนใจหรือสาขาของตนได้เข้าใจพอสมควร" }
          - { id: CEFR-B2-reading, level: B2, text: "อ่านได้ค่อนข้างเป็นอิสระ ปรับวิธีและความเร็วตามชนิดข้อความและจุดประสงค์ เลือกใช้แหล่งอ้างอิงเป็น และมีคลังคำศัพท์สำหรับอ่านกว้าง" }
          - { id: CEFR-C1-reading, level: C1, text: "เข้าใจข้อความยาวและซับซ้อนหลายประเภทได้ละเอียด ทั้งวรรณกรรม บทความ และงานวิชาการหรือวิชาชีพ เมื่ออ่านซ้ำส่วนที่ยากได้" }
          - { id: CEFR-C2-reading, level: C2, text: "เข้าใจภาษาเขียนแทบทุกรูปแบบ รวมทั้งงานที่นามธรรม โครงสร้างซับซ้อน หรือใช้ภาษาปาก และแยกแยะลีลากับความหมายแฝงได้ละเอียด" }
  - id: CEFR-production
    title: การผลิตสาร (production)
    standards:
      - id: CEFR-overall-spoken-production
        text: "Overall spoken production: การพูดนำเสนอโดยรวม"
        indicators:
          - { id: CEFR-A1-spoken-production, level: A1, text: "พูดวลีง่าย ๆ ที่ส่วนใหญ่แยกเป็นวลีเดี่ยว เกี่ยวกับคนและสถานที่" }
          - { id: CEFR-A2-spoken-production, level: A2, text: "บรรยายหรือนำเสนออย่างง่ายเรื่องคน ความเป็นอยู่ กิจวัตร สิ่งที่ชอบและไม่ชอบ เป็นวลีและประโยคง่ายที่เรียงต่อกัน" }
          - { id: CEFR-B1-spoken-production, level: B1, text: "บรรยายเรื่องในขอบเขตความสนใจได้ค่อนข้างคล่อง โดยเล่าเป็นลำดับประเด็นต่อเนื่องกัน" }
          - { id: CEFR-B2-spoken-production, level: B2, text: "บรรยายและนำเสนอได้ชัดเจนและละเอียด เน้นประเด็นสำคัญ และขยายความด้วยประเด็นย่อยกับตัวอย่างที่เกี่ยวข้อง" }
          - { id: CEFR-C1-spoken-production, level: C1, text: "บรรยายและนำเสนอเรื่องซับซ้อนได้ชัดเจนละเอียด ผูกประเด็นย่อยเข้าด้วยกัน และสรุปปิดได้เหมาะสม" }
          - { id: CEFR-C2-spoken-production, level: C2, text: "พูดได้ชัด ลื่นไหล โครงสร้างดี และเรียงตรรกะจนผู้ฟังจับและจำประเด็นสำคัญได้ง่าย" }
      - id: CEFR-overall-written-production
        text: "Overall written production: การเขียนโดยรวม"
        indicators:
          - { id: CEFR-A1-written-production, level: A1, text: "เขียนวลีและประโยคง่าย ๆ แยกกัน ให้ข้อมูลเรื่องส่วนตัว เช่น สิ่งที่ชอบ ครอบครัว สัตว์เลี้ยง ด้วยคำพื้นฐาน" }
          - { id: CEFR-A2-written-production, level: A2, text: "เขียนวลีและประโยคง่ายเป็นชุด เชื่อมด้วยคำเชื่อมพื้นฐาน เช่น and, but, because" }
          - { id: CEFR-B1-written-production, level: B1, text: "เขียนข้อความต่อเนื่องที่ตรงไปตรงมาในเรื่องคุ้นเคยตามความสนใจ โดยร้อยส่วนย่อยสั้น ๆ เป็นลำดับ" }
          - { id: CEFR-B2-written-production, level: B2, text: "เขียนข้อความชัดเจนและละเอียดในหลายเรื่องตามความสนใจ สังเคราะห์และประเมินข้อมูลกับข้อโต้แย้งจากหลายแหล่ง" }
          - { id: CEFR-C1-written-production, level: C1, text: "เขียนเรื่องซับซ้อนที่มีโครงสร้างดี ขยายและสนับสนุนมุมมองอย่างยาวพร้อมเหตุผลและตัวอย่าง และปรับน้ำเสียงกับลีลาตามผู้อ่านและประเภทงานเขียน" }
          - { id: CEFR-C2-written-production, level: C2, text: "เขียนข้อความซับซ้อนที่ลื่นไหล ลีลาเหมาะสมและได้ผล มีโครงสร้างที่ช่วยให้ผู้อ่านหาประเด็นสำคัญได้" }
  - id: CEFR-interaction
    title: การปฏิสัมพันธ์ (interaction)
    standards:
      - id: CEFR-overall-spoken-interaction
        text: "Overall spoken interaction: การสนทนาโต้ตอบโดยรวม"
        indicators:
          - { id: CEFR-A1-spoken-interaction, level: A1, text: "โต้ตอบอย่างง่ายได้เมื่อคู่สนทนาพูดช้า พูดซ้ำ และช่วยเรียบเรียง ถามและตอบคำถามง่าย ๆ เรื่องจำเป็นเฉพาะหน้าหรือเรื่องที่คุ้นมาก" }
          - { id: CEFR-A2-spoken-interaction, level: A2, text: "แลกเปลี่ยนข้อมูลง่าย ๆ ตรงไปตรงมาในสถานการณ์ประจำวันที่คาดเดาได้ สนทนาสั้น ๆ ได้ แต่ยังประคองบทสนทนาเองได้ยาก" }
          - { id: CEFR-B1-spoken-interaction, level: B1, text: "สื่อสารเรื่องคุ้นเคยได้ค่อนข้างมั่นใจ รับมือสถานการณ์ส่วนใหญ่ระหว่างเดินทาง เข้าร่วมสนทนาเรื่องคุ้นเคยโดยไม่ต้องเตรียม แสดงความเห็นและแลกเปลี่ยนข้อมูลได้" }
          - { id: CEFR-B2-spoken-interaction, level: B2, text: "ใช้ภาษาได้คล่อง ถูกต้อง และได้ผลในหัวข้อหลากหลาย โต้ตอบกับผู้ใช้ภาษาเป้าหมายได้เป็นธรรมชาติโดยไม่ลำบากทั้งสองฝ่าย และอธิบายพร้อมยืนยันความเห็นด้วยเหตุผล" }
          - { id: CEFR-C1-spoken-interaction, level: C1, text: "แสดงออกได้คล่องและทันทีแทบไม่ต้องพยายาม มีคลังคำกว้างพอจะอ้อมคำแทนเมื่อนึกคำไม่ออก" }
          - { id: CEFR-C2-spoken-interaction, level: C2, text: "ใช้สำนวนและภาษาปากได้ดี สื่อความหมายละเอียดอ่อนได้แม่นยำ และแก้ประโยคเมื่อติดขัดได้แนบเนียนจนคู่สนทนาแทบไม่รู้ตัว" }
      - id: CEFR-overall-written-interaction
        text: "Overall written interaction: การเขียนโต้ตอบโดยรวม"
        indicators:
          - { id: CEFR-A1-written-interaction, level: A1, text: "ขอหรือส่งต่อข้อมูลส่วนตัวเป็นลายลักษณ์อักษรได้" }
          - { id: CEFR-A2-written-interaction, level: A2, text: "เขียนบันทึกสั้น ๆ ง่าย ๆ ตามรูปแบบสำเร็จ เรื่องที่จำเป็นเฉพาะหน้า" }
          - { id: CEFR-B1-written-interaction, level: B1, text: "เขียนจดหมายหรือข้อความส่วนตัวเพื่อขอหรือให้ข้อมูลง่าย ๆ ที่เกี่ยวข้องและสื่อประเด็นที่ตนเห็นว่าสำคัญ ส่งต่อข้อมูลและความคิดทั้งเรื่องรูปธรรมและนามธรรมได้พอแม่นยำ" }
          - { id: CEFR-B2-written-interaction, level: B2, text: "เขียนเล่าข่าวและแสดงความเห็นได้ได้ผล และตอบสนองต่อข่าวและความเห็นของผู้อื่น" }
          - { id: CEFR-C1-written-interaction, level: C1, text: "เขียนโต้ตอบได้ชัดเจนแม่นยำ และปรับให้เข้ากับผู้รับอย่างยืดหยุ่นและได้ผล" }
          - { id: CEFR-C2-written-interaction, level: C2, text: "ใช้น้ำเสียงและลีลาเหมาะสมในการเขียนโต้ตอบแทบทุกแบบ ทั้งทางการและไม่เป็นทางการ" }
