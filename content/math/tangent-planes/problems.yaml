    ai_assisted: true

  - id: math.calculus.tangent-planes.p018
    topics: [math.calculus.tangent-planes]
    difficulty: 5
    type: numeric
    stem: "ให้ $z = x^2 + y^2$ เปลี่ยนจุด $(1, 1)$ เป็น $(1.1, 1.1)$ จงหาผลต่าง $\\Delta z - dz$ ระหว่างการเปลี่ยนแปลงจริงกับผลต่างเชิงอนุพันธ์รวม"
