  - id: biology.health.medicines-development.p018
    topics: [biology.health.medicines-development]
    difficulty: 5
    type: numeric
    stem: "ข่าวรายงานว่ายาชนิดหนึ่ง \"ลดความเสี่ยงหัวใจวายได้ถึง 50%\" ในกลุ่มคนที่มีความเสี่ยงต่ำ ซึ่งเดิมมีโอกาสหัวใจวาย 0.4% ใน 5 ปี ต้องให้ยากี่คนเป็นเวลา 5 ปีจึงป้องกันหัวใจวายได้ 1 คน (NNT)"
