    type: mcq
    stem: "ข้อใดเป็นการเปรียบเทียบผลิตภัณฑ์ด้วยหน่วยหน้าที่ที่ยุติธรรม"
    choices:
      - { id: a, text: "เทียบผลกระทบของแชมพูขวดใหญ่และขวดเล็กต่อการสระผม 1 ครั้ง", correct: true, feedback: "ถูก ทั้งสองทำหน้าที่เดียวกัน คือการสระผม 1 ครั้ง" }
      - { id: b, text: "เทียบผลกระทบของแชมพูขวดใหญ่ 1 ขวดกับขวดเล็ก 1 ขวด", feedback: "ขวดใหญ่ใช้ได้หลายครั้งกว่า เทียบต่อขวดจึงไม่ยุติธรรม" }
      - { id: c, text: "เทียบน้ำหนักขวดเปล่าเท่านั้น", feedback: "น้ำหนักขวดเป็นเพียงส่วนหนึ่ง ต้องเทียบผลกระทบทั้งหมดต่อหน้าที่เดียวกัน" }
    hints:
      - "หน่วยหน้าที่คือหน้าที่ที่ผู้ใช้ต้องการ"
      - "ขวดใหญ่และขวดเล็กใช้ได้จำนวนครั้งเท่ากันหรือไม่"
    solution: "ต้องเทียบที่ **หน้าที่เดียวกัน** เช่น ต่อการสระผม 1 ครั้ง ไม่ใช่ต่อขวด"
