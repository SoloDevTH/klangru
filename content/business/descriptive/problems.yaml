  - id: business.stats.descriptive.p018
    topics: [business.stats.descriptive]
    difficulty: 5
    type: mcq
    stem: "บริษัทขนส่งพัสดุ (สมมติ) สรุปเวลาส่งของสองเส้นทางจาก 200 เที่ยว เส้นทาง A เฉลี่ย 26 ชั่วโมง SD 2 ชั่วโมง เส้นทาง B เฉลี่ย 24 ชั่วโมง SD 9 ชั่วโมง บริษัทรับประกันกับลูกค้าว่า \"ถึงภายใน 30 ชั่วโมง\" ข้อสรุปใดสมเหตุสมผลที่สุด"
    choices:
      - { id: a, text: "เส้นทาง A น่าจะรักษาคำรับประกันได้สม่ำเสมอกว่า แม้ค่าเฉลี่ยช้ากว่า เพราะเวลาแกว่งน้อยกว่ามาก", correct: true }
      - { id: b, text: "เส้นทาง B ดีกว่าทุกด้าน เพราะค่าเฉลี่ยเร็วกว่า 2 ชั่วโมง", feedback: "ค่าเฉลี่ยไม่พอ SD 9 ชั่วโมงแปลว่าหลายเที่ยวใช้เวลานานกว่า 30 ชั่วโมงได้ง่าย" }
      - { id: c, text: "สรุปไม่ได้เลยเพราะค่าเฉลี่ยใกล้กัน", feedback: "ค่าเฉลี่ยใกล้กัน แต่การกระจายต่างกันมาก ซึ่งเป็นข้อมูลสำคัญสำหรับคำรับประกัน" }
      - { id: d, text: "เส้นทาง A ทุกเที่ยวถึงภายใน 26 ชั่วโมง", feedback: "26 คือค่าเฉลี่ย ประมาณครึ่งหนึ่งของเที่ยวอาจใช้เวลานานกว่านั้น" }
    hints:
      - "คำรับประกันสนใจเที่ยวที่ช้าที่สุด ไม่ใช่เที่ยวเฉลี่ย"
      - "ลองดูว่า 30 ชั่วโมงห่างจากค่าเฉลี่ยของแต่ละเส้นทางกี่ SD"
    solution: "30 ชั่วโมงห่างจากค่าเฉลี่ยของ A $= \\dfrac{30 - 26}{2} = 2$ SD แต่ห่างจาก B เพียง $\\dfrac{30 - 24}{9} \\approx 0.67$ SD เส้นทาง B จึงมีเที่ยวที่เกิน 30 ชั่วโมงมากกว่า แม้เฉลี่ยเร็วกว่า"
