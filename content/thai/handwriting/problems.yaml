problems:
- id: thai.writing.handwriting.p001
  topics:
  - thai.writing.handwriting
  difficulty: 1
  type: mcq
  stem: เขียนตัว **บ** ต้องเริ่มที่ใด
  choices:
  - id: a
    text: ที่หัวข้างบนด้านซ้าย
    correct: true
    feedback: ถูก เริ่มที่หัวเสมอ
  - id: b
    text: ที่ปลายเส้นด้านขวา
    feedback: ปลายเส้นขวาคือจุดจบ ถ้าเริ่มตรงนั้นหัวจะไปอยู่ผิดที่
  - id: c
    text: ที่มุมล่างซ้าย
    feedback: มุมล่างเป็นทางผ่าน ไม่ใช่จุดเริ่ม
  - id: d
    text: ที่ไหนก็ได้
    feedback: ตัวบรรจงต้องเริ่มที่หัว ตัวอักษรจึงสวยและถูกแบบ
  hints:
  - หลักสำคัญของการคัดตัวบรรจง
  - เริ่มที่ส่วนที่เป็นวงกลม
  solution: เริ่มที่ **หัว** ข้างบนด้านซ้าย แล้วลากลง ไปทางขวา และขึ้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.handwriting.p002
  topics:
  - thai.writing.handwriting
  difficulty: 1
  type: mcq
  stem: ดูภาพ ตัว บ แบบใดเขียน **ถูกต้อง**
  figure:
    src: handwriting-quiz.svg
    alt: 'ตัว บ สี่แบบบนเส้นบรรทัด แบบ ก: หัวอยู่ข้างบนซ้ายแต่เป็นวงทึบสีดำ แบบ ข: หัวอยู่ข้างบนด้านขวา แบบ ค: หัวเป็นวงกลมโปร่งอยู่ข้างบนด้านซ้าย แบบ ง: หัวอยู่ข้างล่างด้านซ้ายที่เส้นบรรทัดล่าง'
  choices:
  - id: a
    text: แบบ ค
    correct: true
    feedback: ถูก หัวกลมโปร่ง อยู่ข้างบนด้านซ้าย
  - id: b
    text: แบบ ก
    feedback: หัวบอดเป็นวงทึบ ต้องเห็นช่องว่างในวงหัว
  - id: c
    text: แบบ ข
    feedback: หัวอยู่ผิดด้าน บ มีหัวทางซ้าย
  - id: d
    text: แบบ ง
    feedback: หัวอยู่ข้างล่าง ตัว บ มีหัวข้างบน
  hints:
  - ตรวจตำแหน่งหัวและดูว่าหัวกลมโปร่งไหม
  - บ หัวอยู่ข้างบนด้านซ้าย
  solution: '**แบบ ค** หัวกลม ไม่บอด อยู่ข้างบนด้านซ้าย'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.handwriting.p003
  topics:
  - thai.writing.handwriting
  difficulty: 1
  type: text
  stem: พยัญชนะตัวใดเขียนเหมือน **บ** แต่เส้นขวายาวขึ้นไปเป็นหางเหนือเส้นบรรทัด (พิมพ์ตัวอักษร)
  accepted:
  - ป
  misconceptions:
  - match: ฟ
    feedback: ฟ มีหางเหมือนกัน แต่เป็นคู่ของ พ ไม่ใช่ บ
  - match: ย
    feedback: ย มีเส้นหักข้างในต่างจาก บ
  hints:
  - นึกถึงตัว ป ปลา
  - บ ใบไม้ กับ ...ปลา
  solution: '**ป** เขียนเหมือน บ แต่เส้นขวาเป็นหางยาว'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.handwriting.p004
  topics:
  - thai.writing.handwriting
  difficulty: 2
  type: order
  stem: เรียงขั้นตอนการเขียนตัว **บ**
  items:
  - เขียนหัวกลมข้างบนด้านซ้าย
  - ลากเส้นลงถึงเส้นบรรทัดล่าง
  - ลากไปทางขวาตามเส้นบรรทัดล่าง
  - ลากเส้นขึ้นจนถึงเส้นบรรทัดบน
  hints:
  - เริ่มที่หัวเสมอ
  - ลากต่อเนื่องเส้นเดียว ลง ขวา ขึ้น
  solution: หัว → ลากลง → ลากไปขวา → ลากขึ้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.handwriting.p005
  topics:
  - thai.writing.handwriting
  difficulty: 2
  type: match
  stem: จับคู่พยัญชนะกับส่วนที่ทำให้ต่างจากคู่ของมัน
  pairs:
  - left: ป (เทียบกับ บ)
    right: มีหางยาวขึ้นเหนือเส้น
  - left: ต (เทียบกับ ด)
    right: มีหยักรูปตัววีด้านบน
  - left: ช (เทียบกับ ข)
    right: มีหางเล็กด้านขวาบน
  - left: ฏ (เทียบกับ ฎ)
    right: เชิงข้างล่างมีหยัก
  hints:
  - เปรียบเทียบสองตัวที่หน้าตาคล้ายกัน
  - ป ฝ ฟ มีหาง ฎ ฏ มีเชิงใต้เส้น
  solution: ป มีหาง · ต มีหยักข้างบน · ช มีหางเล็กขวาบน · ฏ (ปฏัก) มีเชิงหยัก ส่วน ฎ (ชฎา) เชิงโค้งเรียบ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.handwriting.p006
  topics:
  - thai.writing.handwriting
  difficulty: 2
  type: mcq
  stem: ตัวบรรจงที่ดีควรมี **หัว** แบบใด
  choices:
  - id: a
    text: กลม โปร่ง เห็นช่องตรงกลาง
    correct: true
    feedback: ถูก หัวไม่บอด อ่านง่าย
  - id: b
    text: เป็นจุดดำทึบ
    feedback: หัวบอดทำให้อ่านยาก โดยเฉพาะตัวเล็ก
  - id: c
    text: ใหญ่กว่าตัวอักษร
    feedback: หัวควรเล็กพอเหมาะกับตัวอักษร
  - id: d
    text: ไม่ต้องมีหัว เขียนเร็วกว่า
    feedback: นั่นคือตัวหวัด ตัวบรรจงต้องมีหัวครบ
  hints:
  - หัวบอดคืออะไร
  - ตัวบรรจงต้องชัดทุกส่วน
  solution: หัวต้อง **กลม โปร่ง ไม่บอด**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.handwriting.p007
  topics:
  - thai.writing.handwriting
  difficulty: 3
  type: numeric
  stem: ข้อความ "ฝนตกที่ป่าไผ่" มีพยัญชนะที่ **หางยาวขึ้นเหนือเส้นบรรทัด** กี่ตัว
  answer:
    value: 2
    tolerance: 0
    unit: ตัว
  misconceptions:
  - match: 3
    feedback: ผ ใน ไผ่ ไม่มีหาง ผ กับ ฝ ต่างกันที่หาง
  - match: 1
    feedback: นับ ฝ ใน ฝน และ ป ใน ป่า ด้วย
  hints:
  - พยัญชนะที่มีหางยาวขึ้นคือ ป ฝ ฟ ฬ
  - ตรวจทีละคำ ฝน ตก ที่ ป่า ไผ่
  solution: ฝ (ฝน) และ ป (ป่า) = **2 ตัว** ส่วน ผ (ไผ่) ไม่มีหาง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.handwriting.p008
  topics:
  - thai.writing.handwriting
  difficulty: 3
  type: mcq
  stem: ข้อใดอธิบาย **ตัวบรรจงครึ่งบรรทัด** ถูกต้อง
  choices:
  - id: a
    text: ตัวพยัญชนะสูงประมาณครึ่งช่อง ตั้งบนเส้นล่าง สระบนและวรรณยุกต์อยู่ในครึ่งบน
    correct: true
    feedback: ถูก
  - id: b
    text: ตัวพยัญชนะสูงเต็มช่อง สระบนอยู่ในช่องข้างบน
    feedback: นี่คือตัวบรรจงเต็มบรรทัด
  - id: c
    text: ตัวพยัญชนะลอยอยู่กลางช่อง ไม่แตะเส้น
    feedback: ตัวอักษรต้องตั้งบนเส้นล่าง
  - id: d
    text: เขียนครึ่งตัวแล้วเว้นไว้
    feedback: ทุกส่วนของตัวอักษรต้องครบ
  hints:
  - เปรียบเทียบสองภาพในบทเรียน
  - ครึ่งบรรทัด = ตัวเล็กลงครึ่งหนึ่ง แต่ยังตั้งบนเส้นล่าง
  solution: 'ครึ่งบรรทัด: **พยัญชนะสูงครึ่งช่อง ตั้งบนเส้นล่าง สระบนและวรรณยุกต์อยู่ครึ่งบน**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.handwriting.p009
  topics:
  - thai.writing.handwriting
  difficulty: 3
  type: mcq
  stem: เขียนตัว **ด** เริ่มที่ใด
  choices:
  - id: a
    text: หัวที่ม้วนอยู่ข้างในตัว
    correct: true
    feedback: ถูก หัวของ ด อยู่ข้างใน แล้วลากลงไปที่เส้นล่าง
  - id: b
    text: ปลายเส้นด้านขวาที่เส้นล่าง
    feedback: นั่นคือจุดจบของตัว ด
  - id: c
    text: ยอดโค้งข้างบน
    feedback: ยอดโค้งเป็นทางผ่าน
  - id: d
    text: มุมล่างด้านซ้าย
    feedback: เส้นจากหัวลากลงมาที่จุดนี้ แต่ไม่ได้เริ่มที่นี่
  hints:
  - เริ่มที่หัวเสมอ
  - หัวของ ด อยู่ข้างนอกหรือข้างใน
  solution: ด เริ่มที่ **หัวข้างใน** ลากลง ขึ้นด้านซ้าย โค้งข้ามบน ลงด้านขวา
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.handwriting.p010
  topics:
  - thai.writing.handwriting
  difficulty: 4
  type: mcq
  stem: เพื่อนเขียนการ์ดวันครู ตัว ฟ ดูเหมือน พ ครูจึงอ่านคำว่า "ฟ้า" เป็น "พ้า" ปัญหาเกิดจากอะไร
  choices:
  - id: a
    text: หางของ ฟ สั้นเกินไป ไม่ขึ้นเหนือเส้น
    correct: true
    feedback: ถูก ฟ ต่างจาก พ ที่หางยาว
  - id: b
    text: หัวของ ฟ บอด
    feedback: หัวบอดทำให้อ่านยาก แต่ พ กับ ฟ ต่างกันที่หาง
  - id: c
    text: วางไม้โทผิดที่
    feedback: วรรณยุกต์ไม่ได้ทำให้ ฟ กลายเป็น พ
  - id: d
    text: เขียนตัวเอียง
    feedback: ตัวเอียงทำให้ไม่สวย แต่ไม่ทำให้สับสน พ กับ ฟ
  hints:
  - พ กับ ฟ ต่างกันตรงไหน
  - ดูเส้นด้านขวา
  solution: '**หางของ ฟ สั้นเกินไป** ต้องลากเส้นขวาขึ้นเหนือเส้นบรรทัดชัด ๆ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.handwriting.p011
  topics:
  - thai.writing.handwriting
  difficulty: 4
  type: mcq
  stem: ข้อใด **ไม่ใช่** หลักการคัดตัวบรรจง
  choices:
  - id: a
    text: ลากเส้นให้เร็ว ยกดินสอกลางตัวได้
    correct: true
    feedback: ถูกที่ว่าไม่ใช่ ตัวบรรจงเขียนอย่างตั้งใจ ลากต่อเนื่องเส้นเดียว
  - id: b
    text: ตัวอักษรสูงเท่ากันทุกตัว
    feedback: เป็นหลักการที่ถูก
  - id: c
    text: ช่องไฟระหว่างตัวอักษรเท่ากัน
    feedback: เป็นหลักการที่ถูก
  - id: d
    text: เส้นตั้งตรง ไม่เอียง
    feedback: เป็นหลักการที่ถูก
  hints:
  - โจทย์ถามข้อที่ไม่ใช่
  - ตัวบรรจงกับตัวหวัดต่างกันอย่างไร
  solution: '**ลากเร็วและยกดินสอกลางตัว** ไม่ใช่หลักการคัดตัวบรรจง'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.handwriting.p012
  topics:
  - thai.writing.handwriting
  difficulty: 4
  type: mcq
  stem: ในคำว่า **ป่า** ควรเขียนไม้เอกไว้ตรงไหน
  choices:
  - id: a
    text: เหนือตัว ป ค่อนมาทางซ้าย ไม่ทับหาง
    correct: true
    feedback: ถูก หางของ ป อยู่ด้านขวา วรรณยุกต์จึงเยื้องซ้าย
  - id: b
    text: บนปลายหางของ ป
    feedback: ทับหางทำให้อ่านไม่ออก
  - id: c
    text: บน า
    feedback: วรรณยุกต์อยู่บนพยัญชนะ ไม่อยู่บนสระข้างหลัง
  - id: d
    text: ใต้ตัว ป
    feedback: วรรณยุกต์อยู่ข้างบนเสมอ
  hints:
  - ป มีหางด้านขวา
  - วรรณยุกต์ต้องไม่ทับหาง
  solution: ไม้เอกอยู่ **เหนือ ป ค่อนมาทางซ้าย** ไม่ทับหาง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.handwriting.p013
  topics:
  - thai.writing.handwriting
  difficulty: 5
  type: order
  stem: ครูให้ตรวจลายมือคำว่า "ปู" เรียงสิ่งที่ควรตรวจ **จากบนลงล่าง** ของตัวอักษร
  items:
  - ปลายหางของ ป ขึ้นเหนือเส้นบน
  - หัวของ ป อยู่ข้างบนซ้าย กลม ไม่บอด
  - ตัว ป แตะเส้นบรรทัดล่างพอดี
  - สระอู อยู่ใต้เส้นบรรทัดตรงกลางตัว ป
  hints:
  - เริ่มจากส่วนที่อยู่สูงที่สุด
  - หาง → หัว → ฐานของตัว → สระล่าง
  solution: หางเหนือเส้น → หัวที่ระดับเส้นบน → ฐานที่เส้นล่าง → สระอูใต้เส้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.handwriting.p014
  topics:
  - thai.writing.handwriting
  difficulty: 5
  type: mcq
  stem: นักเรียน ม.2 ต้องคัดลายมือข้อความยาวลงในสมุดที่มีเส้นบรรทัดธรรมดา ควรเลือกแบบใด และเพราะอะไร
  choices:
  - id: a
    text: ครึ่งบรรทัด เพราะใกล้ขนาดตัวอักษรที่เขียนจริง และสระบนกับวรรณยุกต์อยู่ในบรรทัดเดียวกัน
    correct: true
    feedback: ถูก ตัวชี้วัด ม.1–3 ให้คัดครึ่งบรรทัด
  - id: b
    text: เต็มบรรทัด เพราะตัวใหญ่กว่าย่อมสวยกว่าเสมอ
    feedback: ตัวใหญ่ใช้ฝึกรายละเอียดในชั้นต้น ข้อความยาวจะใช้บรรทัดมากเกินไป
  - id: c
    text: ตัวหวัด เพราะเร็วที่สุด
    feedback: งานคัดลายมือต้องเป็นตัวบรรจง
  - id: d
    text: แบบไหนก็ได้ ขอให้ทุกตัวขนาดไม่เท่ากัน
    feedback: ตัวอักษรต้องขนาดเท่ากันเสมอ
  hints:
  - ม.1–3 ฝึกคัดแบบใด
  - ข้อความยาวกับเส้นบรรทัดธรรมดา
  solution: '**ครึ่งบรรทัด** ใกล้กับการเขียนจริง สระบนและวรรณยุกต์อยู่ในบรรทัดเดียวกัน'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.handwriting.p015
  topics:
  - thai.writing.handwriting
  difficulty: 2
  type: mcq
  stem: นักเรียนชั้น ป.1 ควรฝึกคัดลายมือตัวบรรจงแบบใดก่อน
  choices:
  - id: a
    text: เต็มบรรทัด
    correct: true
    feedback: ถูก ตัวใหญ่ เห็นหัว หาง และเส้นชัดเจน
  - id: b
    text: ครึ่งบรรทัด
    feedback: ครึ่งบรรทัดเริ่มฝึกตั้งแต่ ป.4
  - id: c
    text: ตัวหวัด
    feedback: ตัวหวัดเขียนเร็วจนบางส่วนหายไป ไม่ใช่ตัวบรรจง
  - id: d
    text: ตัวพิมพ์ที่พิมพ์จากคอมพิวเตอร์
