id: chinese.writing.narrative-compositions
subject: chinese
title:
  th: การเขียนเล่าเรื่องและบรรยายภาษาจีนราว 300 ตัวอักษร
  en: Writing narratives and descriptions in Chinese of about 300 characters
summary: รูปแบบเรียงความจีนบนกระดาษตาราง โครงเรื่องเล่าห้าส่วน คำบอกลำดับและเวลา การบรรยายคนและสิ่งของ และการขยายประโยคสั้นให้เป็นย่อหน้า ฝึกด้วยการเรียงประโยคและเลือกประโยค
difficulty: 5.5
minutes: 40
prerequisites:
- chinese.writing.short-messages
- chinese.grammar.complex-connectives
encompasses:
- id: chinese.writing.short-messages
  weight: 0.3
- id: chinese.grammar.complex-connectives
  weight: 0.3
