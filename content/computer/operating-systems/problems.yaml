    difficulty: 5
    type: mcq
    stem: "ทีมพัฒนาเกมเลือกระหว่าง (1) ใช้เกมเอนจินซึ่งเรียกใช้บริการของระบบปฏิบัติการและไลบรารีกราฟิกให้ กับ (2) เขียนโค้ดสั่งการ์ดจอรุ่นเดียวโดยตรงในระดับต่ำ ข้อใดเปรียบเทียบได้ถูกต้องที่สุด"
    choices:
      - { id: a, text: "แบบ 1 อยู่ระดับนามธรรมสูง เขียนเร็วและใช้ได้หลายเครื่อง แต่ควบคุมรายละเอียดได้น้อยลง ส่วนแบบ 2 อาจรีดความเร็วได้มากกว่า แต่ใช้ได้กับฮาร์ดแวร์รุ่นนั้น และเขียนยากกว่ามาก", correct: true }
      - { id: b, text: "แบบ 2 ดีกว่าเสมอ เพราะใกล้ฮาร์ดแวร์ที่สุด", feedback: "ใกล้ฮาร์ดแวร์ให้การควบคุมมากขึ้น แต่ต้องแลกกับเวลาพัฒนาและการใช้ได้เฉพาะรุ่น ไม่ได้ดีกว่าเสมอ" }
      - { id: c, text: "แบบ 1 ไม่ต้องใช้ฮาร์ดแวร์เลย", feedback: "ทุกชั้นสุดท้ายก็สั่งฮาร์ดแวร์ เพียงแต่ผ่านชั้นนามธรรมหลายชั้น" }
      - { id: d, text: "สองแบบไม่ต่างกัน เพราะสุดท้ายเกมก็แสดงภาพบนจอเหมือนกัน", feedback: "ผลบนจออาจคล้ายกัน แต่ต่างกันมากในเวลาพัฒนา การควบคุม และการนำไปใช้กับเครื่องอื่น" }
    hints:
      - "ชั้นนามธรรมที่สูงขึ้นซ่อนรายละเอียดอะไร และเสียอะไรไป"
      - "คิดทั้งด้านเวลาพัฒนา ความเร็ว และจำนวนเครื่องที่ใช้ได้"
    solution: "การเลือกระดับนามธรรมเป็นการชั่งน้ำหนัก ชั้นสูงซ่อนความต่างของฮาร์ดแวร์ ทำให้เขียนง่ายและย้ายเครื่องได้ แต่ควบคุมได้น้อย ชั้นต่ำควบคุมได้ละเอียดแต่ผูกกับฮาร์ดแวร์และเขียนยาก ทีมส่วนใหญ่จึงใช้ชั้นสูงเป็นหลัก และลงไปชั้นต่ำเฉพาะส่วนที่ต้องเร็วมาก"
