problems:
  - id: math.reasoning.problem-solving.p001
    topics: [math.reasoning.problem-solving]
    difficulty: 1
    type: mcq
    stem: "ข้อความ \"จำนวนเฉพาะทุกตัวเป็นจำนวนคี่\" จำนวนใดเป็นตัวอย่างค้าน"
    choices:
      - { id: a, text: "2", correct: true }
      - { id: b, text: "9", feedback: "9 เป็นจำนวนคี่และไม่ใช่จำนวนเฉพาะ จึงไม่ตรงเงื่อนไข 'เป็นจำนวนเฉพาะ' ตัวอย่างค้านต้องเป็นจำนวนเฉพาะที่ไม่เป็นจำนวนคี่" }
      - { id: c, text: "7", feedback: "7 เป็นจำนวนเฉพาะและเป็นจำนวนคี่ จึงสนับสนุนข้อความ ไม่ได้ค้าน" }
      - { id: d, text: "1", feedback: "1 ไม่ใช่จำนวนเฉพาะ (จำนวนเฉพาะต้องมีตัวประกอบที่ต่างกันสองตัวพอดี)" }
    hints:
      - "ตัวอย่างค้านต้องตรงเงื่อนไข (เป็นจำนวนเฉพาะ) แต่ผลไม่เป็นจริง (ไม่เป็นจำนวนคี่)"
      - "มีจำนวนเฉพาะที่เป็นจำนวนคู่หรือไม่"
    solution: "2 เป็นจำนวนเฉพาะ (ตัวประกอบคือ 1 กับ 2) แต่เป็นจำนวนคู่ ข้อความจึงเป็นเท็จ ตัวอย่างค้านเพียงตัวเดียวก็พอ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.reasoning.problem-solving.p002
    topics: [math.reasoning.problem-solving]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นเอกลักษณ์ (เป็นจริงทุกค่าของ $x$)"
    choices:
      - { id: a, text: "$3(x - 2) = 3x - 6$", correct: true }
      - { id: b, text: "$3x - 2 = 10$", feedback: "เป็นสมการ จริงเฉพาะ $x = 4$" }
      - { id: c, text: "$3(x - 2) = 3x - 2$", feedback: "ลืมคูณ 3 เข้ากับ 2 ลองแทน $x = 0$ ได้ $-6 \\ne -2$" }
      - { id: d, text: "$x^2 = 9$", feedback: "เป็นสมการ จริงเฉพาะ $x = 3$ และ $x = -3$" }
    hints:
      - "เอกลักษณ์ต้องจริงทุกค่า ลองแทน $x = 0$ และ $x = 1$"
      - "กระจายวงเล็บแล้วดูว่าสองข้างเหมือนกันหรือไม่"
    solution: "$3(x - 2) = 3x - 6$ ทุกค่าของ $x$ ตามสมบัติการแจกแจง ข้ออื่นจริงเพียงบางค่าหรือไม่จริงเลย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.reasoning.problem-solving.p003
    topics: [math.reasoning.problem-solving]
    difficulty: 2
    type: numeric
    stem: "แพรวมีเงิน 24 บาท ซื้อปากกาด้ามละ 3 บาทและดินสอแท่งละ 2 บาท อย่างละอย่างน้อย 1 ชิ้น ใช้เงินหมดพอดี ซื้อได้กี่แบบ"
    answer: { value: 3, unit: แบบ }
    hints:
      - "ให้ซื้อปากกา $x$ ด้าม ดินสอ $y$ แท่ง ได้ $3x + 2y = 24$ โดย $x, y \\ge 1$"
      - "$2y = 24 - 3x$ ต้องเป็นจำนวนคู่ $x$ จึงต้องเป็นจำนวนคู่ ไล่ $x = 2, 4, 6, \\dots$"
    misconceptions:
      - { match: 4, feedback: "นับ $x = 8, y = 0$ ด้วย แต่โจทย์บอกว่าต้องซื้อดินสออย่างน้อย 1 แท่ง" }
      - { match: 5, feedback: "นับกรณีที่ซื้อของอย่างเดียว ($x = 0$ หรือ $y = 0$) ด้วย ซึ่งไม่ตรงเงื่อนไข" }
    solution: "$3x + 2y = 24$ ไล่ $x$ ที่เป็นจำนวนคู่: $x = 2, y = 9$; $x = 4, y = 6$; $x = 6, y = 3$; $x = 8$ ได้ $y = 0$ ใช้ไม่ได้ จึงซื้อได้ 3 แบบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.reasoning.problem-solving.p004
    topics: [math.reasoning.problem-solving]
    difficulty: 2
    type: numeric
    stem: "ฟาร์มแห่งหนึ่งในจังหวัดสุพรรณบุรีเลี้ยงไก่และแพะ นับขารวมได้ 22 ขา มีสัตว์อย่างละอย่างน้อย 1 ตัว จำนวนไก่และแพะเป็นไปได้กี่แบบ"
    answer: { value: 5, unit: แบบ }
    hints:
      - "ไก่ $c$ ตัว แพะ $g$ ตัว ได้ $2c + 4g = 22$ หรือ $c + 2g = 11$"
      - "ไล่ $g = 1, 2, 3, \\dots$ จนกว่า $c$ จะไม่เป็นบวก"
    misconceptions:
      - { match: 6, feedback: "นับกรณีแพะ 0 ตัว (ไก่ 11 ตัว) ด้วย แต่โจทย์บอกว่ามีสัตว์อย่างละอย่างน้อย 1 ตัว" }
      - { match: 11, feedback: "11 คือจำนวนไก่มากที่สุด ไม่ใช่จำนวนแบบ ให้ทำตารางของ $g$ กับ $c$" }
    solution: "$c + 2g = 11$: $g = 1, c = 9$; $g = 2, c = 7$; $g = 3, c = 5$; $g = 4, c = 3$; $g = 5, c = 1$ ($g = 6$ ได้ $c < 0$) จึงมี 5 แบบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.reasoning.problem-solving.p005
    topics: [math.reasoning.problem-solving]
    difficulty: 2
    type: mcq
    stem: "ค่าแรงรายวัน $w$ บาท ขึ้น 5% ค่าแรงใหม่เขียนได้เป็นข้อใด"
    choices:
      - { id: a, text: "$1.05w$", correct: true }
      - { id: b, text: "$w + 5$", feedback: "เพิ่ม 5 บาท ไม่ใช่ 5% ร้อยละต้องคิดจาก $w$ คือ $0.05w$" }
      - { id: c, text: "$0.05w$", feedback: "$0.05w$ คือส่วนที่เพิ่มขึ้นเท่านั้น ต้องบวกค่าแรงเดิมด้วย" }
      - { id: d, text: "$5w$", feedback: "$5w$ คือเพิ่มเป็น 5 เท่า ไม่ใช่ 5%" }
    hints:
      - "ค่าแรงใหม่ = ค่าแรงเดิม + ส่วนที่เพิ่ม"
      - "$w + 0.05w$ ดึงตัวร่วม $w$"
    solution: "$w + 0.05w = (1 + 0.05)w = 1.05w$ การ 'เพิ่ม 5%' จึงเหมือน 'คูณด้วย 1.05'"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.reasoning.problem-solving.p006
    topics: [math.reasoning.problem-solving]
    difficulty: 3
    type: numeric
    stem: "ห้างสรรพสินค้าลดราคาเสื้อ 30% แล้วลดอีก 10% จากราคาที่ลดแล้ว เท่ากับลดจากราคาเดิมทั้งหมดกี่เปอร์เซ็นต์"
    answer: { value: 37, unit: "%" }
    hints:
      - "ลด 30% คือคูณ 0.7 ลด 10% คือคูณ 0.9"
      - "ราคาสุดท้าย $= 0.7 \\times 0.9 \\times$ ราคาเดิม แล้วหาว่าหายไปกี่เปอร์เซ็นต์"
    misconceptions:
      - { match: 40, feedback: "บวกเปอร์เซ็นต์ตรง ๆ แต่การลดครั้งที่สองคิดจากราคาที่ลดแล้ว ไม่ใช่ราคาเดิม" }
      - { match: 63, feedback: "63% คือราคาที่เหลือ ส่วนที่ลดคือ $100 - 63$" }
    solution: "ราคาสุดท้าย $= 0.7 \\times 0.9 = 0.63$ เท่าของราคาเดิม จึงลดไป $1 - 0.63 = 0.37$ หรือ 37% (เช่น เสื้อ 1,000 บาท → 700 → 630 บาท)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.reasoning.problem-solving.p007
    topics: [math.reasoning.problem-solving]
    difficulty: 3
    type: order
    stem: "เรียงขั้นการพิสูจน์ว่า \"ผลบวกของจำนวนเต็มสามจำนวนที่เรียงกันหารด้วย 3 ลงตัวเสมอ\""
    items:
      - "ให้จำนวนเต็มสามจำนวนที่เรียงกันเป็น $n$, $n + 1$, $n + 2$ เมื่อ $n$ เป็นจำนวนเต็ม"
      - "ผลบวก $= n + (n + 1) + (n + 2) = 3n + 3$"
      - "$3n + 3 = 3(n + 1)$"
      - "$n + 1$ เป็นจำนวนเต็ม ผลบวกจึงเป็นพหุคูณของ 3 ทุกกรณี"
    hints:
      - "เริ่มจากการเขียนจำนวนทั่วไปด้วยตัวแปร"
      - "เป้าหมายคือเขียนผลบวกในรูป $3 \\times$ (จำนวนเต็ม)"
    solution: "ตั้งตัวแปร → รวมพจน์ได้ $3n + 3$ → ดึงตัวร่วม $3(n + 1)$ → สรุปว่าเป็นพหุคูณของ 3 เพราะ $n + 1$ เป็นจำนวนเต็ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.reasoning.problem-solving.p008
    topics: [math.reasoning.problem-solving]
    difficulty: 3
    type: mcq
    stem: |
      การ "พิสูจน์" ต่อไปนี้ได้ข้อสรุปว่า $2 = 1$ ขั้นใดผิด

      1. ให้ $a = b$
      2. คูณด้วย $a$: $a^2 = ab$
      3. ลบ $b^2$: $a^2 - b^2 = ab - b^2$
      4. แยกตัวประกอบ: $(a + b)(a - b) = b(a - b)$
      5. หารด้วย $a - b$: $a + b = b$
      6. แทน $a = b$: $2b = b$ จึงได้ $2 = 1$
    choices:
      - { id: a, text: "ขั้น (5) เพราะ $a - b = 0$ หารด้วยศูนย์ไม่ได้", correct: true }
      - { id: b, text: "ขั้น (2) เพราะคูณด้วยตัวแปรไม่ได้", feedback: "คูณทั้งสองข้างด้วยจำนวนเดียวกันได้เสมอ สมการยังเป็นจริง" }
      - { id: c, text: "ขั้น (4) เพราะแยกตัวประกอบผิด", feedback: "$(a + b)(a - b) = a^2 - b^2$ และ $b(a - b) = ab - b^2$ ถูกต้องทั้งคู่" }
      - { id: d, text: "ขั้น (6) เพราะแทนค่าไม่ได้", feedback: "แทนค่าได้ แต่ที่ได้ $2b = b$ เพราะขั้นก่อนหน้าผิดแล้ว (และ $2b = b$ จริงเมื่อ $b = 0$ ซึ่งหาร $b$ ไม่ได้อีกเช่นกัน)" }
    hints:
      - "ตรวจทีละขั้นว่ามีเหตุผลรองรับหรือไม่"
      - "เมื่อ $a = b$ นิพจน์ใดในการพิสูจน์มีค่าเป็นศูนย์"
    solution: "เพราะ $a = b$ จึงได้ $a - b = 0$ ขั้น (5) หารทั้งสองข้างด้วยศูนย์ ซึ่งไม่นิยาม ข้อสรุปจึงผิด ขั้นอื่นถูกต้อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.reasoning.problem-solving.p009
    topics: [math.reasoning.problem-solving]
    difficulty: 4
    type: numeric
    stem: "แทน $n = 1, 2, 3, \\dots$ ใน $n^2 - n + 41$ ได้ 41, 43, 47, 53, … ซึ่งเป็นจำนวนเฉพาะ จงหาจำนวนนับ $n$ ที่น้อยที่สุดที่ทำให้ $n^2 - n + 41$ ไม่เป็นจำนวนเฉพาะ"
    answer: { value: 41 }
    hints:
      - "หาค่า $n$ ที่ทำให้ทุกพจน์มีตัวประกอบร่วมกัน"
      - "ถ้า $n = 41$ จะได้ $41^2 - 41 + 41$ ซึ่งเท่ากับเท่าไร ส่วน $n$ ที่น้อยกว่านั้นให้เชื่อตามที่โจทย์บอกว่าเป็นจำนวนเฉพาะหรือลองตรวจบางค่า"
    misconceptions:
      - { match: 40, feedback: "$40^2 - 40 + 41 = 1601$ เป็นจำนวนเฉพาะ (ค่า $n = 40$ ใช้ได้กับ $n^2 + n + 41$ ในบทเรียน แต่โจทย์นี้มีเครื่องหมายลบ)" }
    solution: "เมื่อ $n = 41$: $41^2 - 41 + 41 = 41^2 = 1681$ หารด้วย 41 ลงตัว จึงไม่เป็นจำนวนเฉพาะ ส่วน $n = 1$ ถึง $40$ ให้จำนวนเฉพาะทั้งหมด (ตรวจด้วยคอมพิวเตอร์ได้) ข้อคาดการณ์ 'ได้จำนวนเฉพาะเสมอ' จึงผิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.reasoning.problem-solving.p010
    topics: [math.reasoning.problem-solving]
    difficulty: 3
    type: mcq
    stem: "สมการ $3(x - 2) + 6 = 3x$ มีคำตอบเป็นอย่างไร"
    choices:
      - { id: a, text: "จริงทุกจำนวนจริง $x$ (เป็นเอกลักษณ์)", correct: true }
      - { id: b, text: "$x = 0$ เท่านั้น", feedback: "$x = 0$ ทำให้จริง แต่ลองแทน $x = 5$ ก็จริงเช่นกัน" }
      - { id: c, text: "ไม่มีคำตอบ", feedback: "เมื่อจัดรูปได้ $3x = 3x$ ซึ่งจริงเสมอ ไม่ใช่ข้อความเท็จอย่าง $0 = 6$" }
      - { id: d, text: "$x = 2$ เท่านั้น", feedback: "อาจเห็นวงเล็บ $(x - 2)$ แล้วคิดว่า $x = 2$ แต่สมการไม่ได้อยู่ในรูปผลคูณเท่ากับศูนย์" }
    hints:
      - "กระจายวงเล็บข้างซ้ายแล้วรวมพจน์"
      - "ถ้าได้สองข้างเหมือนกันทุกตัว แปลว่าอะไร"
    solution: "$3(x - 2) + 6 = 3x - 6 + 6 = 3x$ สองข้างเท่ากันทุกค่าของ $x$ จึงเป็นเอกลักษณ์ คำตอบคือจำนวนจริงทุกจำนวน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.reasoning.problem-solving.p011
    topics: [math.reasoning.problem-solving]
    difficulty: 4
    type: expression
    expanded: true
    stem: "ให้ $n$ เป็นจำนวนเต็ม จงกระจายและจัด $(2n + 1)^2 - (2n - 1)^2$ ให้อยู่ในรูปอย่างง่าย (ผลนี้แสดงว่าผลต่างของกำลังสองของจำนวนคี่สองจำนวนที่ห่างกัน 2 หารด้วย 8 ลงตัวเสมอ)"
    answer: { latex: "8n", variables: [n] }
    hints:
      - "$(2n + 1)^2 = 4n^2 + 4n + 1$"
      - "$(2n - 1)^2 = 4n^2 - 4n + 1$ แล้วลบกันโดยระวังเครื่องหมาย"
    misconceptions:
      - { match: "0", feedback: "ลืมพจน์กลาง $2ab$ ใช้ $(2n + 1)^2 = 4n^2 + 1$ ซึ่งผิด" }
      - { match: "8n+2", feedback: "ใช้ $(2n - 1)^2 = 4n^2 - 4n - 1$ แต่ $(-1)^2 = +1$" }
    solution: "$(4n^2 + 4n + 1) - (4n^2 - 4n + 1) = 8n$ เป็นพหุคูณของ 8 ทุกค่า $n$ เช่น $n = 3$: $7^2 - 5^2 = 24 = 8 \\times 3$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.reasoning.problem-solving.p012
    topics: [math.reasoning.problem-solving]
    difficulty: 4
    type: mcq
    stem: "ครูสำรวจนักเรียน ม.3 จำนวน 50 คนในโรงเรียนแห่งหนึ่ง พบว่านักเรียนที่นอนหลังเที่ยงคืนมีคะแนนสอบเฉลี่ยต่ำกว่านักเรียนที่นอนก่อน ข้อสรุปใดสมเหตุสมผลที่สุด"
    choices:
      - { id: a, text: "ในกลุ่มนี้การนอนดึกสัมพันธ์กับคะแนนที่ต่ำกว่า แต่ยังสรุปไม่ได้ว่าการนอนดึกเป็นสาเหตุ", correct: true }
      - { id: b, text: "การนอนดึกทำให้คะแนนสอบต่ำลง", feedback: "ข้อมูลสำรวจบอกความสัมพันธ์ ไม่ได้บอกสาเหตุ อาจมีปัจจัยอื่น เช่น เวลาเล่นโทรศัพท์ ที่ส่งผลทั้งสองอย่าง" }
      - { id: c, text: "นักเรียนไทยทุกคนที่นอนดึกได้คะแนนต่ำ", feedback: "กลุ่มตัวอย่างเป็นนักเรียน 50 คนในโรงเรียนเดียว ใช้แทนนักเรียนทั้งประเทศไม่ได้ และค่าเฉลี่ยไม่ได้บอกเกี่ยวกับทุกคน" }
      - { id: d, text: "เวลานอนกับคะแนนไม่มีความสัมพันธ์กัน", feedback: "ข้อมูลแสดงว่าค่าเฉลี่ยต่างกัน จึงมีความสัมพันธ์ในกลุ่มนี้" }
    hints:
      - "ข้อมูลสำรวจบอกอะไรได้ และบอกอะไรไม่ได้"
      - "แยกระหว่าง 'สัมพันธ์กัน' กับ 'เป็นสาเหตุ' และดูว่ากลุ่มตัวอย่างเป็นตัวแทนใคร"
    solution: "สรุปได้เพียงว่าในกลุ่มตัวอย่างนี้มีความสัมพันธ์ ข้อมูลสำรวจบอกไม่ได้ว่าอะไรเป็นสาเหตุ และกลุ่มตัวอย่างจากโรงเรียนเดียวใช้สรุปกับทั้งประเทศไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.reasoning.problem-solving.p013
    topics: [math.reasoning.problem-solving]
    difficulty: 3
    type: match
    stem: "จับคู่ปัญหากับกลยุทธ์ที่เหมาะที่สุดในการเริ่มแก้"
    pairs:
      - { left: "ใช้เงินไปครึ่งหนึ่ง แล้วจ่ายค่ารถอีก 20 บาท เหลือ 30 บาท ตอนแรกมีเงินเท่าไร", right: "ทำย้อนกลับจากผลลัพธ์" }
      - { left: "รูป 20 เหลี่ยมมีเส้นทแยงมุมกี่เส้น", right: "ลองกรณีเล็ก ๆ แล้วหาแบบรูป" }
      - { left: "หาคู่จำนวนนับ $x, y$ ทั้งหมดที่ $x + 2y = 9$", right: "แจกแจงกรณีอย่างเป็นระบบ" }
      - { left: "หอยทากปีนบ่อลึก 10 เมตร กลางวันขึ้น 3 เมตร กลางคืนไถลลง 2 เมตร กี่วันจึงถึงปากบ่อ", right: "วาดภาพหรือทำตารางทีละวัน" }
    hints:
      - "ปัญหาที่รู้ผลตอนท้ายแต่ไม่รู้ตอนเริ่ม เหมาะกับการคิดย้อน"
      - "ปัญหาที่ตัวเลขใหญ่เกินจะนับตรง ๆ ลองกับรูปสี่ ห้า หกเหลี่ยมก่อน"
    solution: "รู้ผลตอนท้าย → ทำย้อนกลับ (30 + 20 = 50, × 2 = 100 บาท) จำนวนเหลี่ยมมาก → กรณีเล็กแล้วหาแบบรูป หาคู่จำนวนทั้งหมด → แจกแจงกรณี การเคลื่อนที่ขึ้นลงทีละวัน → วาดภาพหรือทำตาราง (ระวังวันสุดท้ายที่ขึ้นถึงปากบ่อแล้วไม่ไถลลง)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.reasoning.problem-solving.p014
    topics: [math.reasoning.problem-solving]
    difficulty: 3
    type: numeric
    stem: "คนงาน 4 คนทาสีรั้วโรงเรียนเสร็จใน 9 วัน ถ้ามีคนงาน 6 คนที่ทำงานเร็วเท่ากัน จะทาเสร็จในกี่วัน"
    answer: { value: 6, unit: วัน }
    hints:
      - "คนมากขึ้น งานเสร็จเร็วขึ้น เป็นการแปรผันตรงหรือผกผัน"
      - "งานทั้งหมด $= 4 \\times 9$ คน-วัน ซึ่งคงที่"
    misconceptions:
      - { match: 13.5, feedback: "ใช้สัดส่วนตรง (คนเพิ่ม วันเพิ่ม) แต่คนมากขึ้นต้องใช้วันน้อยลง" }
      - { match: 7, feedback: "คิดแบบบวก (คนเพิ่ม 2 วันลด 2) แต่ความสัมพันธ์นี้เป็นการคูณ คน × วัน คงที่" }
    solution: "งานทั้งหมด $4 \\times 9 = 36$ คน-วัน คนงาน 6 คนใช้ $36 \\div 6 = 6$ วัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.reasoning.problem-solving.p015
    topics: [math.reasoning.problem-solving]
    difficulty: 4
    type: mcq
    stem: "ข้อใดเป็นการพิสูจน์ที่ถูกต้องว่า \"ผลคูณของจำนวนคี่สองจำนวนเป็นจำนวนคี่\""
    choices:
      - { id: a, text: "ให้ $2a + 1$ และ $2b + 1$ ผลคูณ $= 4ab + 2a + 2b + 1 = 2(2ab + a + b) + 1$ ซึ่งเป็นจำนวนคี่", correct: true }
      - { id: b, text: "$3 \\times 5 = 15$, $7 \\times 9 = 63$, $11 \\times 13 = 143$ ล้วนเป็นจำนวนคี่ จึงเป็นจริงเสมอ", feedback: "เป็นแค่ตัวอย่าง ไม่ครอบคลุมจำนวนคี่ทุกคู่" }
      - { id: c, text: "ให้จำนวนคี่ทั้งสองเป็น $2n + 1$ ผลคูณ $= (2n + 1)^2 = 4n^2 + 4n + 1 = 2(2n^2 + 2n) + 1$ เป็นจำนวนคี่", feedback: "ใช้ตัวแปรเดียวกันทั้งสองจำนวน จึงพิสูจน์แค่กรณีที่สองจำนวนเท่ากัน (กำลังสองของจำนวนคี่)" }
      - { id: d, text: "ให้ $2a$ และ $2b$ ผลคูณ $= 4ab = 2(2ab)$ เป็นจำนวนคู่ จึงขัดแย้ง", feedback: "$2a$ และ $2b$ เป็นจำนวนคู่ ไม่ใช่จำนวนคี่ เริ่มต้นผิดตั้งแต่การแทนจำนวน" }
    hints:
      - "การพิสูจน์ต้องใช้ได้กับจำนวนคี่ทุกคู่ ทั้งคู่ที่เท่ากันและไม่เท่ากัน"
      - "จำนวนคี่สองจำนวนที่อาจต่างกันต้องใช้ตัวแปรคนละตัว"
    solution: "ให้ $p = 2a + 1$, $q = 2b + 1$ ได้ $pq = 4ab + 2a + 2b + 1 = 2(2ab + a + b) + 1$ เนื่องจาก $2ab + a + b$ เป็นจำนวนเต็ม $pq$ จึงเป็นจำนวนคี่ทุกกรณี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.reasoning.problem-solving.p016
    topics: [math.reasoning.problem-solving]
    difficulty: 5
    type: numeric
    stem: "จำนวนสองหลักกี่จำนวนที่เมื่อสลับหลักหน่วยกับหลักสิบแล้วบวกกับจำนวนเดิม ได้ผลบวก 121 (เช่น 47 + 74)"
    answer: { value: 8, unit: จำนวน }
    hints:
      - "เขียนจำนวนสองหลักเป็น $10a + b$ จำนวนที่สลับหลักคือ $10b + a$"
      - "ผลบวก $= 11(a + b)$ จึงได้ $a + b = 11$ แล้วแจกแจงหลักที่เป็นไปได้"
    misconceptions:
      - { match: 4, feedback: "นับคู่หลัก {2, 9}, {3, 8}, … แบบไม่สนลำดับ แต่ 29 กับ 92 เป็นจำนวนสองหลักคนละจำนวน" }
      - { match: 9, feedback: "นับ $a = 2$ ถึง $a = 10$ แต่หลักต้องไม่เกิน 9 จึงได้ $a = 2, 3, \\dots, 9$" }
    solution: "$(10a + b) + (10b + a) = 11(a + b) = 121$ ได้ $a + b = 11$ เมื่อ $a, b$ เป็นเลขโดด 0–9 และ $a \\ge 1$: $(a, b) = (2, 9), (3, 8), \\dots, (9, 2)$ รวม 8 จำนวน คือ 29, 38, 47, 56, 65, 74, 83, 92"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.reasoning.problem-solving.p017
    topics: [math.reasoning.problem-solving]
    difficulty: 5
    type: expression
    stem: "ทุเรียนราคากิโลกรัมละ $P$ บาท ต้นฤดูขึ้นราคา 10% ปลายฤดูลดราคา 10% จากราคาที่ขึ้นแล้ว จงเขียนราคาปลายฤดูในรูปจำนวนคูณ $P$"
    prefix: "ราคาปลายฤดู ="
    answer: { latex: "0.99P", variables: [P] }
    hints:
      - "ขึ้น 10% คือคูณ 1.1 ลด 10% คือคูณ 0.9"
      - "$1.1 \\times 0.9 \\times P$"
    misconceptions:
      - { match: "P", feedback: "ขึ้น 10% แล้วลด 10% ไม่ได้กลับมาที่เดิม เพราะ 10% ครั้งหลังคิดจากราคาที่สูงขึ้นแล้ว" }
      - { match: "1.01P", feedback: "ทิศทางผิด ราคาปลายฤดูต่ำกว่าราคาเดิมเล็กน้อย เพราะ $1.1 \\times 0.9 = 0.99$" }
    solution: "$P \\times 1.1 \\times 0.9 = 0.99P$ ราคาปลายฤดูจึงต่ำกว่าราคาเดิม 1% การเขียนในรูปนี้ทำให้เห็นทันทีว่าการขึ้นและลดร้อยละเท่ากันไม่หักล้างกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.reasoning.problem-solving.p018
    topics: [math.reasoning.problem-solving]
    difficulty: 3
    type: mcq
    stem: "นักเรียนคนหนึ่งเขียนว่า $(x + 1)^2 = x^2 + 1$ เป็นเอกลักษณ์ ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "ไม่ใช่เอกลักษณ์ เพราะเมื่อ $x = 1$ ข้างซ้ายเป็น 4 แต่ข้างขวาเป็น 2", correct: true }
      - { id: b, text: "เป็นเอกลักษณ์ เพราะเมื่อ $x = 0$ ทั้งสองข้างเท่ากับ 1", feedback: "จริงที่ค่าเดียวไม่พอ เอกลักษณ์ต้องจริงทุกค่า" }
      - { id: c, text: "ไม่มีค่า $x$ ใดทำให้เป็นจริงเลย", feedback: "$x = 0$ ทำให้จริง สมการนี้มีคำตอบ $x = 0$" }
      - { id: d, text: "เป็นเอกลักษณ์เมื่อ $x$ เป็นจำนวนบวก", feedback: "$x = 1$ เป็นจำนวนบวกแต่ไม่จริง" }
    hints:
      - "ตัวอย่างค้านเพียงค่าเดียวพอที่จะแสดงว่าไม่ใช่เอกลักษณ์"
      - "กระจาย $(x + 1)^2$ แล้วเทียบกับ $x^2 + 1$"
    solution: "$(x + 1)^2 = x^2 + 2x + 1$ เท่ากับ $x^2 + 1$ เมื่อ $2x = 0$ คือ $x = 0$ เท่านั้น จึงเป็นสมการ ไม่ใช่เอกลักษณ์ ตัวอย่างค้าน $x = 1$: $4 \\ne 2$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.reasoning.problem-solving.p019
    topics: [math.reasoning.problem-solving]
    difficulty: 5
    type: mcq
    stem: "ในภาพ วงกลมที่มีจุดบนเส้นรอบวง 1, 2, 3, 4, 5 จุด (ลากเส้นเชื่อมทุกคู่ และไม่มีสามเส้นตัดกันที่จุดเดียว) ถูกแบ่งได้ 1, 2, 4, 8, 16 ส่วน มีคนคาดการณ์ว่า $n$ จุดจะแบ่งได้ $2^{n-1}$ ส่วน เมื่อนับจริงกับ 6 จุดได้ 31 ส่วน ข้อสรุปใดถูกต้อง"
    figure:
      src: circle-regions.svg
      alt: "วงกลมห้าวง มีจุดบนเส้นรอบวง 1 ถึง 5 จุด ลากเส้นเชื่อมทุกคู่ ใต้วงเขียนจำนวนส่วน 1, 2, 4, 8, 16"
    choices:
      - { id: a, text: "ข้อคาดการณ์เป็นเท็จ กรณี 6 จุดเป็นตัวอย่างค้าน และแบบรูปจากห้ากรณีแรกไม่ใช่การพิสูจน์", correct: true }
      - { id: b, text: "ข้อคาดการณ์ถูก เพราะจริงถึงห้ากรณี คงนับผิดที่ 6 จุด", feedback: "ห้ากรณีที่จริงไม่ได้พิสูจน์อะไร ตัวอย่างค้านที่นับถูกเพียงกรณีเดียวทำให้ข้อความ 'ทุก n' เป็นเท็จ" }
      - { id: c, text: "ข้อคาดการณ์จริงเฉพาะ $n$ เป็นจำนวนคี่", feedback: "ไม่มีเหตุผลหรือข้อมูลรองรับ ข้อมูลมีแค่ว่าจริงที่ $n = 1$ ถึง 5 และไม่จริงที่ $n = 6$" }
      - { id: d, text: "ต้องลองถึง 100 จุดก่อนจึงจะบอกได้", feedback: "ไม่จำเป็น ตัวอย่างค้านเพียงตัวเดียวก็พอที่จะสรุปว่าข้อความเป็นเท็จ" }
    hints:
      - "ข้อความ 'ทุก $n$' เป็นเท็จได้ด้วยตัวอย่างค้านกี่ตัว"
      - "$2^{6-1} = 32$ เทียบกับที่นับได้ 31"
    solution: "ข้อคาดการณ์ให้ $2^5 = 32$ แต่นับได้ 31 จึงเป็นเท็จ (สูตรที่ถูกคือ $\\binom{n}{4} + \\binom{n}{2} + 1$ ซึ่งบังเอิญเท่ากับ $2^{n-1}$ เมื่อ $n \\le 5$) บทเรียน: แบบรูปที่เห็นจากกรณีแรก ๆ อาจไม่ต่อเนื่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true
