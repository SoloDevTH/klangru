<text x="225.0" y="326.0" text-anchor="middle" font-size="13" fill="#15211e" font-weight="bold">SSD รวม ≈ 82.5 เมตร (t = 2.5 วินาที, a = 3.4 เมตร/วินาที²)</text>
<text x="360.0" y="406.0" text-anchor="middle" font-size="12" fill="#555555">t = 2.5 วินาที และ a = 3.4 เมตร/วินาที² เป็นค่าตามแนวทาง AASHTO ต้องตรวจกับมาตรฐานกรมทางหลวงปัจจุบัน</text>
