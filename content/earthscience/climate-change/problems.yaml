problems:
  - id: earthscience.atmosphere.climate-change.p001
    topics: [earthscience.atmosphere.climate-change]
    difficulty: 1
    type: match
    stem: "จับคู่ปัจจัยกับผลต่อภูมิอากาศโลก"
    pairs:
      - { left: "ภูเขาไฟระเบิดรุนแรง", right: "ละอองซัลเฟตสะท้อนแสง โลกเย็นลงชั่วคราว 1–3 ปี" }
      - { left: "แก๊สเรือนกระจกจากการเผาเชื้อเพลิง", right: "ดูดกลืนอินฟราเรดมากขึ้น โลกร้อนขึ้นและสะสมนานหลายร้อยปี" }
      - { left: "วัฏจักรมิลานโควิช", right: "วงโคจรและแกนเอียงเปลี่ยน ทำให้เกิดยุคน้ำแข็งในเวลาหลายหมื่นปี" }
      - { left: "เอลนีโญ", right: "มหาสมุทรคายความร้อนให้อากาศ ปีนั้นโลกร้อนกว่าปีข้างเคียง" }
    hints:
      - "ปัจจัยใดเกิดเร็วและหายเร็ว ปัจจัยใดช้ามาก"
      - "ปัจจัยเดียวที่สะสมต่อเนื่องจากกิจกรรมของมนุษย์คืออะไร"
    solution: "ภูเขาไฟทำให้เย็นลงชั่วคราว แก๊สเรือนกระจกทำให้ร้อนขึ้นสะสม วัฏจักรมิลานโควิชเปลี่ยนภูมิอากาศในเวลาหลายหมื่นปี เอลนีโญทำให้บางปีร้อนกว่าปีข้างเคียง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.climate-change.p002
    topics: [earthscience.atmosphere.climate-change]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็น \"การปรับตัว\" ต่อการเปลี่ยนแปลงภูมิอากาศ ไม่ใช่การลดการปล่อยแก๊สเรือนกระจก"
    choices:
      - { id: a, text: "ปลูกข้าวพันธุ์ที่ทนน้ำท่วมได้หลายวัน", correct: true }
      - { id: b, text: "ติดแผงโซลาร์เซลล์บนหลังคาโรงเรียน", feedback: "ไฟฟ้าจากแสงอาทิตย์ลดการเผาเชื้อเพลิง เป็นการลดการปล่อย" }
      - { id: c, text: "ขึ้นรถไฟฟ้าแทนขับรถยนต์ส่วนตัว", feedback: "ใช้พลังงานต่อคนน้อยลง เป็นการลดการปล่อย" }
      - { id: d, text: "เลิกเผาตอซังข้าว", feedback: "การไม่เผาลดการปล่อยแก๊สและฝุ่น เป็นการลดการปล่อย" }
    hints:
      - "การปรับตัวคือเตรียมรับผลที่เกิดขึ้นแล้วหรือหลีกเลี่ยงไม่ได้"
      - "ข้อใดไม่ได้ลดแก๊สเรือนกระจกเลย แต่ช่วยให้อยู่รอดเมื่อเกิดภัย"
    solution: "ข้าวทนน้ำท่วมช่วยให้ชาวนารับมือน้ำท่วมที่รุนแรงขึ้น เป็นการปรับตัว ข้ออื่นลดการปล่อยแก๊สเรือนกระจก เป็นการลดผลกระทบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.climate-change.p003
    topics: [earthscience.atmosphere.climate-change]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นหลักฐานว่าโลกร้อนขึ้นในระยะยาว (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ระดับน้ำทะเลเฉลี่ยสูงขึ้นราว 0.20 m ระหว่าง ค.ศ. 1901–2018", correct: true }
      - { id: b, text: "ความร้อนที่สะสมในมหาสมุทรเพิ่มขึ้นต่อเนื่องหลายสิบปี", correct: true }
      - { id: c, text: "ธารน้ำแข็งทั่วโลกหดตัว", correct: true }
      - { id: d, text: "ธันวาคมปีนี้ที่เชียงใหม่หนาวกว่าปีก่อน", feedback: "อุณหภูมิของเมืองเดียวในเดือนเดียวเป็นลมฟ้าอากาศ ภูมิอากาศต้องดูค่าเฉลี่ยทั้งโลกหลายสิบปี" }
      - { id: e, text: "รูโอโซนเหนือแอนตาร์กติกา", feedback: "รูโอโซนเกิดจากสาร CFC ทำลายโอโซน เป็นคนละเรื่องกับภาวะโลกร้อน" }
    hints:
      - "หลักฐานต้องเป็นข้อมูลระยะยาวและครอบคลุมทั้งโลก"
      - "น้ำที่อุ่นขยายตัวและน้ำแข็งบนแผ่นดินละลายทำให้เกิดอะไร"
    solution: "ระดับน้ำทะเล ความร้อนในมหาสมุทร และธารน้ำแข็งเป็นหลักฐานระยะยาวทั่วโลก อากาศหนาวในเดือนเดียวเป็นลมฟ้าอากาศ และรูโอโซนเป็นคนละเรื่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.climate-change.p004
    topics: [earthscience.atmosphere.climate-change]
    difficulty: 2
    type: order
    stem: "เรียงการป้อนกลับจากชั้นดินเยือกแข็งคงตัว (permafrost) ในเขตขั้วโลกเหนือ"
    items:
      - "แก๊สเรือนกระจกที่มนุษย์ปล่อยทำให้โลกร้อนขึ้น"
      - "ชั้นดินเยือกแข็งคงตัวละลาย"
      - "จุลินทรีย์ย่อยซากพืชที่เคยแข็งตัวอยู่ ปล่อยมีเทนและคาร์บอนไดออกไซด์"
      - "แก๊สเรือนกระจกในบรรยากาศเพิ่มขึ้นอีก"
      - "โลกร้อนขึ้นอีก ชั้นดินเยือกแข็งละลายมากขึ้น"
    hints:
      - "การป้อนกลับแบบเสริมวนกลับมาที่จุดเริ่มต้นและทำให้แรงขึ้น"
      - "ซากพืชที่แช่แข็งไว้หลายพันปีจะเป็นอย่างไรเมื่อละลาย"
    solution: "โลกร้อน → ชั้นดินเยือกแข็งละลาย → จุลินทรีย์ย่อยซากพืชปล่อยมีเทนและ CO₂ → แก๊สเรือนกระจกเพิ่ม → ร้อนขึ้นอีก เป็นการป้อนกลับแบบเสริม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.climate-change.p005
    topics: [earthscience.atmosphere.climate-change]
    difficulty: 2
    type: mcq
    stem: "นาข้าวไทยที่มีน้ำขังตลอดฤดูปล่อยแก๊สมีเทน วิธีใดช่วยลดมีเทนจากนาข้าวได้โดยตรง"
    choices:
      - { id: a, text: "ปลูกข้าวแบบเปียกสลับแห้ง ปล่อยให้น้ำในนาแห้งเป็นช่วง ๆ", correct: true }
      - { id: b, text: "เผาฟางและตอซังหลังเก็บเกี่ยว", feedback: "การเผาปล่อยคาร์บอนไดออกไซด์และฝุ่น PM2.5 ไม่ได้ลดมีเทน" }
      - { id: c, text: "ขังน้ำให้ลึกขึ้น", feedback: "น้ำขังลึกทำให้ดินขาดออกซิเจนมากขึ้น จุลินทรีย์สร้างมีเทนได้มากขึ้น" }
      - { id: d, text: "ใส่ปุ๋ยเคมีไนโตรเจนเพิ่ม", feedback: "ปุ๋ยไนโตรเจนที่มากเกินไปทำให้เกิดไนตรัสออกไซด์ซึ่งเป็นแก๊สเรือนกระจกเช่นกัน" }
    hints:
      - "จุลินทรีย์ที่สร้างมีเทนอยู่ได้ในดินที่ขาดออกซิเจน"
      - "ถ้าดินได้รับอากาศเป็นช่วง ๆ จะเป็นอย่างไร"
    solution: "จุลินทรีย์สร้างมีเทนในดินที่ขาดออกซิเจนเพราะน้ำขัง การปล่อยน้ำให้แห้งเป็นช่วง ๆ ทำให้อากาศเข้าดิน มีเทนจึงลดลง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.climate-change.p006
    topics: [earthscience.atmosphere.climate-change]
    difficulty: 3
    type: mcq
    stem: "กราฟ ก แสดงพลังงานจากดวงอาทิตย์ และกราฟ ข แสดงอุณหภูมิผิวโลก ค.ศ. 1960–2020 (ข้อมูลตัวอย่าง) ข้อสรุปใดสมเหตุสมผลที่สุด"
    figure: { src: p-sun-temp.svg, alt: "กราฟสองกราฟ แกนนอน ค.ศ. 1960 ถึง 2020 กราฟ ก พลังงานจากดวงอาทิตย์ที่ยอดบรรยากาศ ขึ้นลงเป็นคลื่นระหว่างราว 1,360.5 ถึง 1,361.5 วัตต์ต่อตารางเมตร รอบละราว 11 ปี ไม่มีแนวโน้มเพิ่มขึ้น กราฟ ข อุณหภูมิผิวโลกเทียบกับ 1850–1900 ขึ้นลงเล็กน้อยแต่เพิ่มขึ้นต่อเนื่องจากราว 0.3 °C ใน 1960 เป็นราว 1.2 °C ใน 2020" }
    choices:
      - { id: a, text: "ดวงอาทิตย์ไม่ใช่สาเหตุของแนวโน้มร้อนขึ้น เพราะพลังงานจากดวงอาทิตย์ไม่ได้เพิ่ม แต่อุณหภูมิเพิ่มต่อเนื่อง", correct: true }
      - { id: b, text: "ดวงอาทิตย์เป็นสาเหตุ เพราะกราฟทั้งสองขึ้นลงเหมือนกัน", feedback: "กราฟ ก ขึ้นลงรอบตัวเองโดยไม่มีแนวโน้ม ส่วนกราฟ ข มีแนวโน้มเพิ่มขึ้นชัดเจน จึงไม่สอดคล้องกัน" }
      - { id: c, text: "โลกไม่ได้ร้อนขึ้น เพราะดวงอาทิตย์ไม่ได้สว่างขึ้น", feedback: "อุณหภูมิที่วัดได้เพิ่มขึ้นจริงตามกราฟ ข ต้องหาสาเหตุอื่นที่อธิบายได้" }
      - { id: d, text: "สรุปอะไรไม่ได้เลย เพราะกราฟขึ้นลงตลอด", feedback: "แม้มีการขึ้นลงระยะสั้น แต่แนวโน้มระยะยาวของสองกราฟต่างกันชัดเจน จึงสรุปได้ว่าดวงอาทิตย์ไม่ใช่สาเหตุหลัก" }
    hints:
      - "ดูแนวโน้มระยะยาวของแต่ละกราฟ ไม่ใช่การขึ้นลงระยะสั้น"
      - "ถ้าสาเหตุไม่เปลี่ยน ผลจะเปลี่ยนต่อเนื่องได้หรือไม่"
    solution: "พลังงานจากดวงอาทิตย์ขึ้นลงตามวัฏจักรราว 11 ปีโดยไม่มีแนวโน้มเพิ่ม แต่อุณหภูมิเพิ่มต่อเนื่อง ดวงอาทิตย์จึงอธิบายแนวโน้มไม่ได้ ต้องเป็นปัจจัยอื่น ซึ่งหลักฐานชี้ว่าเป็นแก๊สเรือนกระจก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.climate-change.p007
    topics: [earthscience.atmosphere.climate-change]
    difficulty: 3
    type: numeric
    stem: "ใช้ $\\Delta F = 5.35 \\ln\\dfrac{C}{C_0}$ เมื่อ $C_0 = 280$ ppm หาแรงบังคับการแผ่รังสีจากคาร์บอนไดออกไซด์ที่ 420 ppm (หน่วย W/m² ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 2.17, tolerance: 0.03, unit: "W/m²" }
    misconceptions:
      - { match: 8.03, feedback: "8.03 มาจาก 5.35 × 420/280 ลืมใส่ ln" }
      - { match: 0.94, feedback: "0.94 ใช้ลอการิทึมฐาน 10 สูตรนี้ใช้ลอการิทึมธรรมชาติ ln" }
    hints:
      - "หา 420/280 ก่อน"
      - "ใส่ ln ของค่านั้นแล้วคูณ 5.35"
    solution: "$\\Delta F = 5.35 \\ln(420/280) = 5.35 \\ln 1.5 = 5.35 \\times 0.405 \\approx 2.17\\ \\mathrm{W/m^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.climate-change.p008
    topics: [earthscience.atmosphere.climate-change]
    difficulty: 3
    type: mcq
    stem: "นักวิทยาศาสตร์ประเมินความไวของภูมิอากาศเป็นช่วง 2.5–4 °C ไม่ใช่ค่าเดียว ความไม่แน่นอนส่วนใหญ่มาจากอะไร"
    choices:
      - { id: a, text: "การป้อนกลับของเมฆ ซึ่งอาจเสริมหรือลดการร้อนขึ้น", correct: true }
      - { id: b, text: "เราวัดคาร์บอนไดออกไซด์ในอากาศไม่ได้", feedback: "คาร์บอนไดออกไซด์วัดได้แม่นยำมากตั้งแต่ ค.ศ. 1958" }
      - { id: c, text: "ไม่รู้ว่าคาร์บอนไดออกไซด์ดูดกลืนอินฟราเรดหรือไม่", feedback: "การดูดกลืนอินฟราเรดของ CO₂ วัดได้ในห้องปฏิบัติการมานานกว่า 150 ปี" }
      - { id: d, text: "ดวงอาทิตย์อาจดับในอนาคตอันใกล้", feedback: "ดวงอาทิตย์มีอายุเหลืออีกหลายพันล้านปี ไม่เกี่ยวกับช่วงความไวของภูมิอากาศ" }
    hints:
      - "ส่วนที่ยากคือการตอบสนองของระบบ ไม่ใช่แรงบังคับ"
      - "สิ่งใดทั้งสะท้อนแสงอาทิตย์และกักเก็บอินฟราเรดได้"
    solution: "แรงบังคับจาก CO₂ รู้ค่าค่อนข้างแน่ แต่เมฆเปลี่ยนไปเมื่อโลกร้อนขึ้น เมฆต่ำสะท้อนแสงทำให้เย็น เมฆสูงกักอินฟราเรดทำให้ร้อน ผลสุทธิประเมินยาก จึงเป็นแหล่งความไม่แน่นอนใหญ่ที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.climate-change.p009
    topics: [earthscience.atmosphere.climate-change]
    difficulty: 2
    type: text
    stem: "ข้อตกลงระหว่างประเทศที่ทำใน ค.ศ. 2015 ตั้งเป้าให้อุณหภูมิเพิ่มขึ้นต่ำกว่า 2 °C มาก และพยายามไม่ให้เกิน 1.5 °C ชื่อว่าอะไร"
    accepted: ["ความตกลงปารีส", "ข้อตกลงปารีส", "Paris Agreement", "ความตกลงปารีสว่าด้วยการเปลี่ยนแปลงสภาพภูมิอากาศ"]
    misconceptions:
      - { match: "พิธีสารเกียวโต", feedback: "พิธีสารเกียวโตทำใน ค.ศ. 1997 กำหนดให้ประเทศพัฒนาแล้วลดการปล่อย ข้อตกลงปี 2015 เป็นอีกฉบับ" }
      - { match: "พิธีสารมอนทรีออล", feedback: "พิธีสารมอนทรีออลควบคุมสารทำลายโอโซน เช่น CFC" }
    hints:
      - "ตั้งชื่อตามเมืองหลวงของประเทศฝรั่งเศส"
      - "ทำในการประชุม COP21"
    solution: "ความตกลงปารีส (Paris Agreement) ค.ศ. 2015 ทุกประเทศส่งแผนลดการปล่อยของตนเองและปรับให้เข้มขึ้นเป็นระยะ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.climate-change.p010
    topics: [earthscience.atmosphere.climate-change]
    difficulty: 3
    type: mcq
    stem: "ถ้าสมมติว่าทั้งโลกหยุดปล่อยคาร์บอนไดออกไซด์สุทธิเป็นศูนย์ได้ทันที อุณหภูมิเฉลี่ยของโลกในหลายสิบปีต่อมาจะเป็นอย่างไร"
    choices:
      - { id: a, text: "หยุดเพิ่มขึ้นและอยู่ราวระดับเดิม ไม่ลดลงเร็ว", correct: true }
