- id: chinese.grammar.progressive-bi.p012
  topics:
  - chinese.grammar.progressive-bi
  difficulty: 4
  type: mcq
  stem: ขนม (点心 diǎnxin) ร้านนี้ก็อร่อยอยู่แล้ว แต่ร้านนั้นยิ่งอร่อยกว่า ประโยคใดบอกความหมายนี้ถูกต้อง
  choices:
  - id: a
    text: 那家的点心比这家的好吃更。
    feedback: 更 ต้องอยู่หน้าคุณศัพท์
  - id: b
    text: 那家的点心比这家的更好吃。
    correct: true
    feedback: ถูก 更 วางหน้าคุณศัพท์ = ยิ่ง…กว่า
  - id: c
    text: 那家的点心比这家的很好吃。
    feedback: หลัง 比 ห้ามใช้ 很
  - id: d
    text: 那家的点心比这家的非常好吃。
    feedback: หลัง 比 ห้ามใช้ 非常
  hints:
  - ยิ่ง…กว่า ใช้ 更 หรือ 还
  - 更 วางหน้าคุณศัพท์ 好吃
  solution: '**那家的点心比这家的更好吃。** Nà jiā de diǎnxin bǐ zhè jiā de gèng hǎochī. (家 = ลักษณนามของร้าน)'
