  - id: phy.chg.p016
    topics: [physics.electricity.charge]
    difficulty: 4
    type: numeric
    stem: "อิเล็กตรอนกับโปรตอนอยู่ห่างกันระยะหนึ่ง แรงไฟฟ้าระหว่างทั้งสองมากกว่าแรงโน้มถ่วงระหว่างทั้งสองกี่เท่า ใช้ $k = 9.0 \\times 10^9\\ \\mathrm{N\\,m^2/C^2}$, $G = 6.67 \\times 10^{-11}\\ \\mathrm{N\\,m^2/kg^2}$, $e = 1.6 \\times 10^{-19}\\ \\mathrm{C}$, $m_e = 9.11 \\times 10^{-31}\\ \\mathrm{kg}$, $m_p = 1.67 \\times 10^{-27}\\ \\mathrm{kg}$ (ตอบเป็นจำนวนเท่าของ $10^{39}$ เช่น ถ้าได้ $5 \\times 10^{39}$ ให้ตอบ 5)"
    answer: { value: 2.27, tolerance: 0.03, unit: × 10³⁹ เท่า }
