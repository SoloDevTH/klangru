  - ขั้นสุดท้ายเป็นการใส่เงื่อนไขเริ่มต้นเพื่อหาค่าคงที่
  solution: หาค่าเฉพาะ หาเวกเตอร์เฉพาะ เขียนผลเฉลย $e^{\lambda t}\mathbf{v}$ แล้วรวมเชิงเส้นตามเงื่อนไขเริ่มต้น
