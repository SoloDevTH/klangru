problems:
- id: thai.speaking.opinions-feelings.p001
  topics:
  - thai.speaking.opinions-feelings
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็นการพูดแสดง **ความรู้สึก**
  choices:
  - id: a
    text: หนูรู้สึกดีใจที่ลูกแมวในนิทานได้กลับบ้าน
    correct: true
    feedback: ถูก บอกอารมณ์ของผู้พูด
  - id: b
    text: นิทานเรื่องนี้มีตัวละครสามตัว
    feedback: เป็นข้อมูลจากเรื่อง (ความรู้)
  - id: c
    text: หนูคิดว่าลูกแมวไม่ควรออกจากบ้านคนเดียว เพราะอาจหลงทาง
    feedback: เป็นความคิดเห็นพร้อมเหตุผล
  - id: d
    text: ลูกแมวหลงทางอยู่สองวัน
    feedback: เป็นข้อมูลจากเรื่อง
  hints:
  - ความรู้สึกคืออารมณ์ เช่น ดีใจ เสียใจ
  - หาคำว่า รู้สึก
  solution: '**หนูรู้สึกดีใจ...** บอกอารมณ์ของผู้พูด จึงเป็นความรู้สึก'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.speaking.opinions-feelings.p002
  topics:
  - thai.speaking.opinions-feelings
  difficulty: 1
  type: match
  stem: ฟังนิทานเรื่องกระต่ายกับเต่าแล้ว จับคู่คำพูดกับชนิด
  pairs:
  - left: ในนิทาน กระต่ายนอนหลับใต้ต้นไม้ระหว่างแข่ง
    right: ความรู้จากเรื่อง
  - left: ผมคิดว่ากระต่ายแพ้เพราะประมาท
    right: ความคิดเห็น
  - left: หนูรู้สึกสนุกตอนเต่าเดินเข้าเส้นชัย
    right: ความรู้สึก
  hints:
  - ความรู้ = ข้อมูลที่อยู่ในเรื่อง
  - ความคิดเห็นมักมี ฉันคิดว่า ความรู้สึกมีคำบอกอารมณ์
  solution: ข้อมูลในนิทาน = **ความรู้** · ผมคิดว่า...เพราะ... = **ความคิดเห็น** · รู้สึกสนุก = **ความรู้สึก**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.speaking.opinions-feelings.p003
  topics:
  - thai.speaking.opinions-feelings
  difficulty: 2
  type: mcq
  stem: ครูถามว่า "คิดอย่างไรกับคลิปเรื่องการประหยัดน้ำ" คำตอบใด **ดีที่สุด**
  choices:
  - id: a
    text: ผมคิดว่าคลิปนี้มีประโยชน์ เพราะสอนวิธีที่ทำได้จริง เช่น ปิดน้ำขณะแปรงฟัน
    correct: true
    feedback: ถูก มีความคิดเห็น เหตุผล และตัวอย่างจากเรื่อง
  - id: b
    text: ดีครับ
    feedback: สั้นเกินไป ไม่มีเหตุผล
  - id: c
    text: ไม่ชอบ น่าเบื่อ
    feedback: ไม่มีเหตุผล และไม่สร้างสรรค์
  - id: d
    text: คลิปยาวสามนาที
    feedback: เป็นข้อมูล ไม่ใช่ความคิดเห็น
  hints:
  - ความคิดเห็นที่ดีต้องมีอะไรประกอบ
  - ดูว่าคำตอบใดมีทั้ง คิดว่า และ เพราะ
  solution: คำตอบแรกมี **ความคิดเห็น + เหตุผล + ตัวอย่างจากเรื่อง** ครบ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.speaking.opinions-feelings.p004
  topics:
  - thai.speaking.opinions-feelings
  difficulty: 2
  type: match
  stem: จับคู่สื่อกับ **จุดประสงค์หลัก**
  pairs:
  - left: สารคดีเรื่องชีวิตช้างป่า
    right: ให้ความรู้
  - left: โฆษณาขนมในโทรทัศน์
    right: โน้มน้าวใจ
  - left: ประกาศหน้าเสาธงเรื่องวันหยุด
    right: แจ้งข่าวหรือประกาศ
  - left: ละครตลกวันเด็ก
    right: ให้ความบันเทิง
  hints:
  - ผู้ทำสื่อต้องการให้เรารู้ ซื้อ รับทราบ หรือสนุก
  - โฆษณาต้องการให้ทำอะไร
  solution: สารคดี = ให้ความรู้ · โฆษณา = โน้มน้าว · ประกาศ = แจ้งข่าว · ละครตลก = บันเทิง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.speaking.opinions-feelings.p005
  topics:
  - thai.speaking.opinions-feelings
  difficulty: 2
  type: mcq
  stem: ข้อใดเป็นการแสดงความคิดเห็นอย่าง **สร้างสรรค์** ต่อการแสดงละครของเพื่อน
  choices:
  - id: a
    text: ฉากเปิดสนุกมาก ถ้าพูดเสียงดังขึ้นอีกนิด คนแถวหลังจะได้ยินชัดขึ้น
    correct: true
    feedback: ถูก ชมจุดดีก่อนแล้วเสนอสิ่งที่ปรับได้
  - id: b
    text: เล่นไม่เก่งเลย น่าเบื่อมาก
    feedback: ติอย่างเดียว ไม่มีทางแก้
  - id: c
    text: คนเล่นเป็นพระเอกหน้าตาไม่เหมาะ
    feedback: โจมตีตัวบุคคล ไม่ได้พูดถึงการแสดง
  - id: d
    text: ก็ดีมั้ง
    feedback: ไม่ชัดเจน ไม่มีเหตุผล
  hints:
  - สร้างสรรค์ = ช่วยให้งานดีขึ้น
  - ดูว่าข้อใดมีจุดดีและข้อเสนอแนะ
  solution: ข้อแรก **ชมจุดดีและเสนอวิธีปรับ** ที่ทำได้จริง พูดถึงงาน ไม่ใช่ตัวบุคคล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.speaking.opinions-feelings.p006
  topics:
  - thai.speaking.opinions-feelings
  difficulty: 3
  type: order
  stem: เรียงคำพูดแสดงความคิดเห็นต่อข่าวให้เป็นไปตาม 4 ขั้น
  items:
  - จากข่าวเรื่องฝุ่น PM2.5 ในภาคเหนือเมื่อเช้านี้
  - ข่าวนี้ต้องการบอกว่าการเผาในที่โล่งทำให้ค่าฝุ่นสูงจนเป็นอันตราย
  - หนูคิดว่าควรสวมหน้ากากเมื่อออกนอกบ้าน เพราะข่าวบอกว่าฝุ่นเข้าปอดได้
  - หนูรู้สึกเป็นห่วงคุณยายที่เชียงใหม่ และจะโทรบอกให้ท่านดูแลตัวเอง
  hints:
  - เริ่มด้วยการบอกว่าพูดถึงเรื่องอะไร
  - ความรู้สึกหรือข้อเสนอแนะอยู่ท้ายสุด
  solution: บอกเรื่อง → สรุปแนวคิด → ความคิดเห็น + เหตุผล → ความรู้สึก / สิ่งที่จะทำ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.speaking.opinions-feelings.p007
  topics:
  - thai.speaking.opinions-feelings
  difficulty: 3
  type: mcq
  stem: 'ข้อความที่ได้ยิน: "ห้องสมุดจะเปิดถึงหกโมงเย็นตั้งแต่สัปดาห์หน้า เพื่อให้นักเรียนมีที่ทำการบ้านหลังเลิกเรียน" ข้อใด **ไม่ใช่ความรู้** จากเรื่องที่ฟัง แต่เป็นความคิดเห็นของผู้ฟัง'
  choices:
  - id: a
    text: การเปิดห้องสมุดนานขึ้นเป็นเรื่องดีที่สุดของปีนี้
    correct: true
    feedback: ถูก เป็นการตัดสินของผู้ฟังเอง เรื่องไม่ได้บอก
  - id: b
    text: ห้องสมุดจะเปิดถึงหกโมงเย็น
    feedback: เป็นข้อมูลในเรื่อง
  - id: c
    text: จะเริ่มตั้งแต่สัปดาห์หน้า
    feedback: เป็นข้อมูลในเรื่อง
  - id: d
    text: จุดประสงค์คือให้นักเรียนมีที่ทำการบ้าน
    feedback: เรื่องบอกไว้ตรง ๆ
  hints:
  - ความรู้ต้องตรวจได้ว่าเรื่องพูดไว้จริง
  - ข้อใดเป็นการตัดสินว่าดีหรือไม่ดี
  solution: '"ดีที่สุดของปีนี้" เป็น **ความคิดเห็น** ของผู้ฟัง ข้ออื่นเป็นข้อมูลที่ได้ยินจริง'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.speaking.opinions-feelings.p008
  topics:
  - thai.speaking.opinions-feelings
  difficulty: 3
  type: mcq
  stem: ดูโฆษณาในภาพ จุดประสงค์หลักของโฆษณานี้คืออะไร
  figure: &id001
    src: drink-ad.svg
    alt: 'โฆษณาสมมุติ นมสมองไว ตราดาวเด่น ข้อความใหญ่: ดื่มวันละขวด เก่งขึ้นทันที! คุณพ่อในโฆษณาพูดว่า ลูกผมดื่มแล้ว สอบได้ที่ 1 ของห้องเลยครับ กรอบกลาง: ทุกคนดื่มกันแล้ว อย่าให้ลูกคุณตามไม่ทัน! ด้านล่าง: ขวดละ 25 บาท ซื้อ 10 ขวด แถม 1 ขวด'
  choices:
  - id: a
    text: โน้มน้าวให้ผู้ปกครองซื้อนม
    correct: true
    feedback: ถูก มีราคา โปรโมชัน และคำเร่งให้ซื้อ
  - id: b
    text: ให้ความรู้เรื่องโภชนาการ
    feedback: ไม่มีข้อมูลสารอาหารหรือหลักฐานใด
  - id: c
    text: แจ้งข่าวผลสอบของนักเรียน
    feedback: คำของคุณพ่อเป็นส่วนหนึ่งของการโฆษณา
  - id: d
    text: ให้ความบันเทิง
    feedback: ไม่ได้เล่าเรื่องเพื่อความสนุก
  hints:
  - โฆษณามีราคาและโปรโมชันเพื่ออะไร
  - คำว่า อย่าให้ลูกคุณตามไม่ทัน ชวนให้ทำอะไร
  solution: มีราคา ซื้อ 10 แถม 1 และคำเร่งเร้า จุดประสงค์คือ **โน้มน้าวให้ซื้อ**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.speaking.opinions-feelings.p009
  topics:
  - thai.speaking.opinions-feelings
  difficulty: 4
  type: mcq
  stem: ดูโฆษณาในภาพเดิม ข้อใดเป็นเหตุผลที่ทำให้ **ไม่ควรเชื่อ** โฆษณานี้ทันที (เลือกได้มากกว่า 1 ข้อ)
  figure: *id001
  multiple: true
  choices:
  - id: a
    text: อ้าง เก่งขึ้นทันที ซึ่งเกินจริงและไม่มีหลักฐาน
    correct: true
    feedback: ถูก ไม่มีอาหารใดทำให้เก่งได้ทันที
  - id: b
    text: หลักฐานมีแค่คำพูดของคุณพ่อคนเดียวในโฆษณา
    correct: true
    feedback: ถูก ตัวอย่างคนเดียวไม่ใช่หลักฐานที่ตรวจได้
  - id: c
    text: ใช้คำว่า ทุกคนดื่มกันแล้ว กดดันให้กลัวตกขบวน
    correct: true
    feedback: ถูก เป็นการเร้าอารมณ์ ไม่ใช่เหตุผล
  - id: d
    text: บอกราคาขวดละ 25 บาท
    feedback: การบอกราคาไม่ใช่สิ่งที่ทำให้ไม่น่าเชื่อ
  hints:
  - ถามว่าใครพูด มีหลักฐานไหม เหตุผลสมเหตุสมผลไหม
  - คำที่เร้าอารมณ์ต่างจากเหตุผลอย่างไร
  solution: ไม่ควรเชื่อทันทีเพราะ **อ้างเกินจริง** · **หลักฐานเป็นคำพูดคนเดียว** · **กดดันด้วยอารมณ์** ส่วนการบอกราคาเป็นข้อมูลปกติ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.speaking.opinions-feelings.p010
  topics:
  - thai.speaking.opinions-feelings
  difficulty: 4
  type: numeric
  stem: จากโฆษณาในภาพ ถ้าซื้อ 10 ขวดแล้วได้ 11 ขวด ราคาเฉลี่ยต่อขวดเป็นกี่บาท (ทศนิยม 2 ตำแหน่ง) เพื่อใช้ประกอบความคิดเห็นว่าคุ้มหรือไม่
  figure: *id001
  answer:
    value: 22.73
    tolerance: 0.01
    unit: บาท
  misconceptions:
  - match: 25
    feedback: 25 บาทคือราคาก่อนแถม ต้องนำเงินที่จ่ายหารด้วยจำนวนขวดที่ได้จริง
  - match: 27.5
    feedback: คิดเงินเป็น 11 ขวด แล้วหารด้วย 10 กลับด้าน ขวดที่แถมไม่ต้องจ่ายเงิน จ่ายจริง 250 บาทสำหรับ 11 ขวด
  hints:
  - จ่ายเงินกี่บาทสำหรับ 10 ขวด
  - ได้ขวดจริงกี่ขวด แล้วนำเงินหารด้วยจำนวนขวด
  solution: จ่าย $25 \times 10 = 250$ บาท ได้ 11 ขวด ราคาเฉลี่ย $250 \div 11 \approx 22.73$ บาทต่อขวด ถูกลงขวดละประมาณ 2.27 บาท แต่ราคาถูกไม่ได้แปลว่าคำโฆษณาเรื่องเก่งขึ้นเป็นจริง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.speaking.opinions-feelings.p011
  topics:
  - thai.speaking.opinions-feelings
  difficulty: 4
  type: mcq
  stem: เพื่อนพูดว่า "การบ้านเยอะเกินไป ควรยกเลิกการบ้านทั้งหมด" ข้อใดเป็นการตอบที่ **แสดงความเห็นต่างอย่างสร้างสรรค์**
  choices:
  - id: a
    text: เราเข้าใจว่าการบ้านเยอะจนเหนื่อย แต่เราเห็นต่างนิดหนึ่ง เพราะการบ้านช่วยทบทวน อาจขอให้ครูนัดส่งไม่ให้ตรงกันแทน
    correct: true
    feedback: ถูก รับฟัง ให้เหตุผล และเสนอทางเลือก
  - id: b
    text: พูดแบบนี้แสดงว่าขี้เกียจ
    feedback: โจมตีตัวบุคคล
  - id: c
    text: ไม่จริงหรอก
    feedback: ปฏิเสธโดยไม่มีเหตุผล
  - id: d
    text: ใช่ ยกเลิกเลย
    feedback: ไม่ได้แสดงความเห็นต่างหรือคิดถึงผลเสีย
  hints:
  - เห็นต่างได้ แต่ต้องมีเหตุผลและสุภาพ
  - คำตอบที่ดีมักเสนอทางออกด้วย
  solution: คำตอบแรก **รับฟังความรู้สึกของเพื่อน ให้เหตุผล และเสนอทางแก้** เป็นการเห็นต่างอย่างสร้างสรรค์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.speaking.opinions-feelings.p012
  topics:
  - thai.speaking.opinions-feelings
  difficulty: 4
  type: mcq
  stem: 'ข้อความที่ได้ยินจากรายการวิทยุ: "ผู้ใหญ่บ้านเล่าว่า ปีนี้ชาวบ้านช่วยกันขุดลอกคลอง น้ำจึงไม่ท่วมนาเหมือนปีก่อน" ข้อใด **สรุปแนวคิด** ของเรื่องได้ถูกต้อง'
  choices:
  - id: a
    text: ความร่วมมือของชาวบ้านช่วยแก้ปัญหาน้ำท่วมได้
    correct: true
    feedback: ถูก ครอบคลุมเหตุ (ร่วมกันขุดลอก) และผล (น้ำไม่ท่วม)
  - id: b
