id: english.listening.instructions-directions
subject: english
title: { th: "การฟังและอ่านคำสั่ง คำแนะนำ และการบอกทาง", en: "Following instructions and directions" }
summary: อ่านและทำตามคำแนะนำการทำอาหาร ฉลากยา คู่มือเครื่องใช้ กติกาเกม ประกาศ และการบอกทางที่ละเอียดขึ้น
difficulty: 3
minutes: 35
prerequisites: [english.vocabulary.classroom-language, english.grammar.prepositions]
encompasses:
  - { id: english.vocabulary.classroom-language, weight: 0.3 }
  - { id: english.grammar.prepositions, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: street-map.svg
    alt: "แผนที่ทิศเหนืออยู่ด้านบน จุด You are here อยู่ล่างสุดของ Main Street หันหน้าไปทางเหนือ Main Street ตัดกับ Park Road (ทางแยกแรก มีสัญญาณไฟจราจร) และ River Road (ทางแยกที่สอง) สุดถนนเป็น City Park ก่อนถึงไฟจราจร Bank อยู่ซ้ายมือและ Pharmacy อยู่ขวามือ ริม Park Road ฝั่งตะวันตก: Police station ฝั่งเหนือ Post office ฝั่งใต้ ริม Park Road ฝั่งตะวันออก: Hospital ฝั่งเหนือ Café ฝั่งใต้ ริม River Road ฝั่งตะวันตก: Library ฝั่งเหนือ School ฝั่งใต้ ริม River Road ฝั่งตะวันออก: Museum ฝั่งเหนือ Cinema ฝั่งใต้"
    caption: "แผนที่สำหรับฝึกบอกทาง เริ่มที่จุดสีแดง"
  - type: worked-example
    title: เดินตามคำบอกทาง
    problem: "เริ่มที่ You are here ทำตามคำบอกทาง *Go straight on. Take the second turning on the left. It's on your right.* ถึงอาคารใด"
    steps:
      - text: "เดินขึ้นเหนือตาม Main Street ทางแยกแรกคือ Park Road (มีไฟจราจร) ทางแยกที่สองคือ River Road"
      - text: "เลี้ยวซ้ายเข้า River Road ตอนนี้เดินไปทางทิศตะวันตก"
      - text: "หันหน้าไปทางตะวันตก ขวามือคือฝั่งทิศเหนือของถนน"
        why: "ซ้ายขวาคิดตามทิศที่เดิน ไม่ใช่ตามด้านของแผนที่"
      - text: "อาคารฝั่งเหนือของ River Road ทางตะวันตกคือ Library"
    answer: "Library (ห้องสมุด)"
  - { type: check, problem: english.listening.instructions-directions.p009, prompt: "เลี้ยวขวาแล้ว ซ้ายมืออยู่ฝั่งไหนของถนน" }
  - type: worked-example
    title: จับใจความประกาศ
    problem: "*Attention, please. The library will close early today, at 3 p.m., because of a staff meeting. Please return your books before 2.45 p.m.* ต้องคืนหนังสือก่อนกี่โมง และทำไม"
    steps:
      - text: "หาเรื่องหลัก: ห้องสมุดปิดเร็ว (*close early*) วันนี้ เวลา 15.00 น."
      - text: "หาเหตุผลหลัง *because of*: มีประชุมเจ้าหน้าที่ (*a staff meeting*)"
      - text: "หาสิ่งที่ผู้ฟังต้องทำ: คืนหนังสือก่อน *2.45 p.m.* คือ 14.45 น."
        why: "ประกาศมีเวลาสองค่า เวลาปิดคือ 3 p.m. แต่เวลาที่ต้องคืนหนังสือคือ 2.45 p.m."
    answer: "คืนหนังสือก่อน 14.45 น. เพราะห้องสมุดปิด 15.00 น. เนื่องจากมีประชุมเจ้าหน้าที่"
  - { type: check, problem: english.listening.instructions-directions.p006, prompt: "after meals แปลว่าอะไร" }
glossary:
  - { term: instructions, definition: "คำแนะนำวิธีทำหรือวิธีใช้ เขียนเป็นขั้น ๆ" }
  - { term: turning, definition: "ทางแยกที่เลี้ยวเข้าได้ (อเมริกันมักพูด take the second left / the second street on the left)" }
  - { term: traffic lights, definition: "สัญญาณไฟจราจร" }
  - { term: dose, definition: "ขนาดยาที่กินในแต่ละครั้ง" }
  - { term: announcement, definition: "ประกาศ เช่น ที่สถานีรถไฟ สนามบิน หรือโรงเรียน" }
flashcards:
  - { front: "after meals / before meals", back: "หลังอาหาร / ก่อนอาหาร" }
  - { front: "take the second turning on the left", back: "เลี้ยวซ้ายที่ทางแยกที่สอง" }
  - { front: "fry until golden", back: "ทอดจนเหลือง" }
  - { front: "For external use only.", back: "ใช้ภายนอกเท่านั้น ห้ามกิน" }
  - { front: "go past the bank", back: "เดินผ่านธนาคาร" }
