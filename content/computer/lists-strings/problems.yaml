    difficulty: 4
    type: mcq
    stem: |
      นักเรียนต้องการลบจำนวนลบออกจากลิสต์ ได้โปรแกรมนี้ ผลที่แสดงคืออะไร

      ```python
      nums = [3, -1, -2, 5]
      for x in nums:
          if x < 0:
              nums.remove(x)
      print(nums)
      ```
    choices:
      - { id: a, text: "[3, -2, 5]", correct: true }
      - { id: b, text: "[3, 5]", feedback: "นี่คือผลที่ตั้งใจ แต่การลบขณะวนทำให้ -2 เลื่อนมาแทนที่ตำแหน่งที่เพิ่งตรวจไปแล้ว วงวนจึงข้าม -2" }
      - { id: c, text: "[3, -1, -2, 5]", feedback: "remove ทำงานจริงตอนพบ -1 ลิสต์จึงเปลี่ยน" }
      - { id: d, text: "เกิด IndexError", feedback: "for x in nums ไม่ใช้ดัชนีเอง จึงไม่เกิด IndexError แต่ให้ผลผิด" }
    hints:
