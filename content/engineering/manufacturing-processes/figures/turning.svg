<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="sans-serif" font-size="14">
<title>ภาพกลึงทรงกระบอกแสดงเส้นผ่านศูนย์กลาง การหมุน และการป้อน</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15211e"/></marker></defs>
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
<text x="360.0" y="30" text-anchor="middle" font-size="16" fill="#15211e" font-weight="bold">การกลึงทรงกระบอก: ความเร็วตัดและอัตราป้อน</text>
<rect x="60" y="110" width="50" height="160" fill="#bdbdbd" stroke="#15211e" stroke-width="2"/>
<text x="85" y="290" text-anchor="middle" font-size="12" fill="#15211e">หัวจับ</text>
<rect x="110" y="140" width="360" height="100" fill="#e8eaf6" stroke="#15211e" stroke-width="2.5"/>
<ellipse cx="470" cy="190" rx="14" ry="50" fill="#d5d9ef" stroke="#15211e" stroke-width="2.5"/>
<line x1="70" y1="190" x2="530" y2="190" stroke="#15211e" stroke-width="1" stroke-dasharray="10 4 2 4"/>
<text x="300" y="178" text-anchor="middle" font-size="13" fill="#15211e">ชิ้นงาน</text>
<line x1="170" y1="143" x2="170" y2="237" stroke="#15211e" stroke-width="1.4" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="162" y="218" text-anchor="end" font-size="15" fill="#15211e" font-weight="bold">D</text>
<path d="M465.5,125.0 A26,66 0 0 1 494.4,212.6" fill="none" stroke="#b35c00" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="510" y="118" text-anchor="start" font-size="12" fill="#b35c00">การหมุน N (รอบ/นาที)</text>
<polygon points="400,240 386,280 430,280" fill="#9e9e9e" stroke="#15211e" stroke-width="1.5"/>
<rect x="386" y="280" width="44" height="34" fill="#9e9e9e" stroke="#15211e" stroke-width="1.5"/>
<text x="440" y="302" text-anchor="start" font-size="12" fill="#15211e">มีดกลึง</text>
<line x1="378" y1="262" x2="300" y2="262" stroke="#b3261e" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="292" y="267" text-anchor="end" font-size="12" fill="#b3261e">การป้อน f (มม./รอบ) ขนานแกน</text>
<text x="360.0" y="358" text-anchor="middle" font-size="13" fill="#15211e">ความเร็วตัด V = π × D × N ÷ 1000 (เมตร/นาที) เมื่อ D เป็นมิลลิเมตร</text>
<text x="360.0" y="380" text-anchor="middle" font-size="13" fill="#15211e">เวลาตัดหนึ่งเที่ยวตลอดความยาว L ประมาณ t = L ÷ (f × N) (นาที)</text>
</svg>
