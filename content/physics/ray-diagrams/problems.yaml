    ai_assisted: true

  - id: physics.light.ray-diagrams.p019
    topics: [physics.light.ray-diagrams]
    difficulty: 5
    type: mcq
    stem: "กระจกมองข้างของรถยนต์ด้านผู้โดยสารมักมีข้อความว่า \"วัตถุในกระจกอยู่ใกล้กว่าที่เห็น\" ข้อใดอธิบายได้ถูกต้อง"
    choices:
      - { id: a, text: "เป็นกระจกนูน ภาพเสมือนเล็กกว่ารถจริง สมองจึงตัดสินว่ารถอยู่ไกลกว่าความจริง", correct: true }
      - { id: b, text: "เป็นกระจกเว้า ภาพขยายทำให้รถดูใกล้เกินจริง", feedback: "ถ้ารถดูใกล้เกินจริง คำเตือนจะต้องเป็นว่าวัตถุอยู่ไกลกว่าที่เห็น และกระจกเว้าจะให้ภาพกลับหัวเมื่อรถอยู่ไกล" }
      - { id: c, text: "เป็นกระจกเงาราบ ภาพอยู่หลังกระจกจึงดูไกลเป็นสองเท่า", feedback: "กระจกเงาราบให้ภาพขนาดเท่าจริง ระยะที่เห็นจึงตรงกับความจริง ไม่ต้องเตือน" }
    hints:
      - "กระจกชนิดใดให้มุมมองกว้างและภาพย่อ"
      - "ตาและสมองใช้ขนาดของรถในภาพตัดสินระยะ ภาพเล็กทำให้คิดว่าอยู่ไกล"
    solution: "กระจกมองข้างด้านผู้โดยสารเป็นกระจกนูน ให้ภาพเสมือนหัวตั้งย่อ เห็นกว้าง แต่รถคันหลังในภาพเล็กกว่าที่ควรเป็น สมองจึงประเมินว่าอยู่ไกล ผู้ขับจึงต้องระวังก่อนเปลี่ยนช่องทาง"
