  - ทางแก้ควรตอบทุกสาเหตุ
  solution: ข้อแรกวิเคราะห์สาเหตุหลายด้านและเสนอทางแก้ที่ตอบแต่ละสาเหตุ ทั้งสร้างความสัมพันธ์ ใช้คนกลาง ลดโอกาสปะทะ และดูแลสื่อออนไลน์
