id: thai.poetry.rhymes-slogans
subject: thai
title: { th: คำคล้องจองและคำขวัญ, en: "Rhyming words and slogans" }
summary: แยกสัมผัสสระกับสัมผัสอักษร ต่อคำคล้องจองทีละวรรค บอกลักษณะคำคล้องจองจากเสียง วิเคราะห์คำขวัญประจำจังหวัด และแต่งคำขวัญสั้น ๆ
difficulty: 2
minutes: 25
prerequisites: [thai.writing.spelling-basics]
encompasses:
  - { id: thai.writing.spelling-basics, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: rhyme-types.svg
    alt: "สองกรอบ กรอบซ้าย สัมผัสสระ (สระเสียงเดียวกัน + ตัวสะกดมาตราเดียวกัน): กา–ปลา (ก + อา · ปล + อา) ขัน–กัน (ข + อะ + น · ก + อะ + น) รัก–หัก (ร + อะ + ก · ห + อะ + ก) ส่วนที่เหมือนกันเป็นสีแดง กรอบขวา สัมผัสอักษร (พยัญชนะต้นเสียงเดียวกัน): สวย–ใส (ส) เก่ง–กล้า (ก) ดำ–ดี (ด) พยัญชนะที่เหมือนกันเป็นสีน้ำเงิน"
    caption: "สัมผัสสระดูสระและตัวสะกด สัมผัสอักษรดูพยัญชนะต้น"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: ตรวจว่าคำคล้องจองกันหรือไม่
    problem: "\"บาท\" กับ \"ชาติ\" คล้องจองกันหรือไม่"
    steps:
      - text: "แยกเสียง บาท: บ + อา + ท สะกด ออกเสียงท้าย /ด/"
      - text: "แยกเสียง ชาติ: ช + อา + ต สะกด (ิ ไม่ออกเสียง) ออกเสียงท้าย /ด/"
      - text: "เทียบ: สระอาเหมือนกัน ตัวสะกดอยู่แม่กดเหมือนกัน"
        why: "คำคล้องจองดูที่เสียง ไม่ใช่ตัวเขียน ท กับ ต เขียนต่างกันแต่ออกเสียง /ด/"
    answer: "คล้องจองกัน (เสียง /อาด/)"
  - { type: check, problem: thai.poetry.rhymes-slogans.p005, prompt: "แยกสระของแต่ละคำ" }
  - type: worked-example
    title: แต่งคำขวัญรักการอ่าน
    problem: "แต่งคำขวัญ 2 วรรคชวนเพื่อนอ่านหนังสือ"
    steps:
      - text: "ตั้งเรื่อง: ชวนอ่านหนังสือทุกวัน"
      - text: "จดคำสำคัญ: อ่าน ทุกวัน ความรู้ แบ่งปัน"
      - text: "วรรคแรก: อ่านทุกวัน · หาคำที่คล้องจองกับ วัน (อะ + น) ได้ ปัน"
      - text: "วรรคสอง: แบ่งปันความรู้ แล้วอ่านออกเสียงตรวจ"
        why: "อ่านออกเสียงช่วยให้ได้ยินว่าสัมผัสรับกันจริงและจำง่าย"
    answer: "อ่านทุกวัน แบ่งปันความรู้"
  - { type: check, problem: thai.poetry.rhymes-slogans.p008, prompt: "หาคำท้ายบรรทัดแรก" }
  - type: figure
    src: class-slogan.svg
    alt: "ป้ายคำขวัญห้อง ป.3/2 ตัวใหญ่สองบรรทัด: ห้องเรียนสะอาด / ไม่ขาดน้ำใจ บรรทัดเล็กด้านล่าง: ช่วยกันเก็บขยะ แบ่งปันเพื่อนเสมอ"
    caption: "คำขวัญห้องเรียน หาคำคล้องจองได้กี่คู่"
glossary:
  - { term: คำคล้องจอง, definition: "คำที่มีเสียงสัมผัสกัน ทำให้จำง่ายและไพเราะ" }
  - { term: สัมผัสสระ, definition: "คำที่มีเสียงสระเดียวกันและตัวสะกดมาตราเดียวกัน เช่น ขัน–ฉัน" }
  - { term: สัมผัสอักษร, definition: "คำที่มีพยัญชนะต้นเสียงเดียวกัน เช่น สวย–ใส" }
  - { term: วรรค, definition: "กลุ่มคำสั้น ๆ หนึ่งช่วงในคำคล้องจอง คำขวัญ หรือบทร้อยกรอง" }
  - { term: คำขวัญ, definition: "ถ้อยคำสั้น ๆ มีคำคล้องจอง บอกจุดเด่นหรือชวนให้ทำสิ่งดี" }
flashcards:
  - { front: "สัมผัสสระต้องเหมือนกันตรงไหน", back: "เสียงสระ และตัวสะกดมาตราเดียวกัน (วรรณยุกต์ต่างกันได้)" }
  - { front: "ขัน กับ ขาน คล้องจองหรือไม่", back: "ไม่ สระสั้น (อะ) กับสระยาว (อา) ต่างกัน" }
  - { front: "สัมผัสอักษรคืออะไร", back: "พยัญชนะต้นเสียงเดียวกัน เช่น สตูล สงบ สะอาด" }
  - { front: "ลักษณะคำขวัญที่ดี", back: "สั้น มีคำคล้องจอง ใช้คำง่าย ความหมายดี มีจุดมุ่งหมายชัด" }
