problems:
  - id: thai.tone.p001
    topics: [thai.writing.tone-rules]
    difficulty: 1
    type: mcq
    stem: "คำใดเป็น **คำตาย**"
    choices:
      - { id: a, text: "จะ", correct: true, feedback: "ถูก สระอะเป็นสระเสียงสั้นและไม่มีตัวสะกด จึงเป็นคำตาย" }
      - { id: b, text: "มา", feedback: "สระอาเป็นสระเสียงยาวและไม่มีตัวสะกด จึงเป็นคำเป็น" }
      - { id: c, text: "กิน", feedback: "แม้สระอิจะสั้น แต่มี น สะกด (แม่กน) จึงเป็นคำเป็น" }
      - { id: d, text: "ไป", feedback: "สระไอเป็นหนึ่งในสระ อำ ไอ ใอ เอา ที่นับเป็นคำเป็น" }
    hints:
      - "คำตายคือสระเสียงสั้นไม่มีตัวสะกด หรือมีตัวสะกดแม่กก กด กบ"
      - "ดูว่าแต่ละคำมีตัวสะกดหรือไม่ และสระสั้นหรือยาว"
    solution: "จะ มีสระเสียงสั้นและไม่มีตัวสะกด จึงเป็นคำตาย ส่วน มา (สระยาว) กิน (น สะกด) และ ไป (สระไอ) เป็นคำเป็น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.tone.p002
    topics: [thai.writing.tone-rules]
    difficulty: 1
    type: match
    stem: "อักษรกลางคำเป็นผันได้ครบ 5 เสียง จับคู่คำกับเสียงวรรณยุกต์"
    pairs:
      - { left: "กา", right: "สามัญ" }
      - { left: "ก่า", right: "เอก" }
      - { left: "ก้า", right: "โท" }
      - { left: "ก๊า", right: "ตรี" }
      - { left: "ก๋า", right: "จัตวา" }
    hints:
      - "อักษรกลางคำเป็นเป็นหมู่เดียวที่รูปวรรณยุกต์ตรงกับชื่อเสียง"
      - "ไม่มีรูปคือสามัญ แล้วไล่ ่ ้ ๊ ๋ เป็นเอก โท ตรี จัตวา"
    solution: "ก เป็นอักษรกลาง กา เป็นคำเป็น จึงผันตามรูป: กา สามัญ · ก่า เอก · ก้า โท · ก๊า ตรี · ก๋า จัตวา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.tone.p003
    topics: [thai.writing.tone-rules]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "เลือก **คำเป็น** ให้ครบทุกคำ"
    choices:
      - { id: a, text: "นาม", correct: true }
      - { id: b, text: "ขาว", correct: true }
      - { id: c, text: "ใจ", correct: true }
      - { id: d, text: "ปาก", feedback: "ก สะกดเป็นแม่กก จึงเป็นคำตาย แม้สระอาจะยาว" }
      - { id: e, text: "ลูก", feedback: "ก สะกดเป็นแม่กก จึงเป็นคำตาย แม้สระอูจะยาว" }
      - { id: f, text: "เตะ", feedback: "สระเอะเป็นสระเสียงสั้นและไม่มีตัวสะกด จึงเป็นคำตาย" }
    hints:
      - "ตัวสะกดแม่กง กน กม เกย เกอว และสระ อำ ไอ ใอ เอา ทำให้เป็นคำเป็น"
      - "ตัวสะกด ก ด บ ทำให้เป็นคำตายเสมอ ไม่ว่าสระจะยาวหรือสั้น"
    solution: "นาม (ม สะกด แม่กม) ขาว (ว สะกด แม่เกอว) และ ใจ (สระใอ) เป็นคำเป็น ส่วน ปาก ลูก (แม่กก) และ เตะ (สระสั้นไม่มีตัวสะกด) เป็นคำตาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.tone.p004
    topics: [thai.writing.tone-rules]
    difficulty: 2
    type: text
    stem: "คำว่า **ขา** ออกเสียงวรรณยุกต์อะไร (ตอบชื่อเสียง เช่น สามัญ เอก โท ตรี จัตวา)"
    accepted: ["จัตวา", "เสียงจัตวา"]
    misconceptions:
      - { match: "สามัญ", feedback: "ไม่มีรูปวรรณยุกต์ไม่ได้แปลว่าเป็นเสียงสามัญเสมอ ข เป็นอักษรสูง คำเป็นของอักษรสูงที่ไม่มีรูปออกเสียงจัตวา" }
    hints:
      - "ข เป็นอักษรหมู่ใด และ ขา เป็นคำเป็นหรือคำตาย"
      - "เปิดตารางที่แถวอักษรสูง คำเป็น ช่องไม่มีรูปวรรณยุกต์"
    solution: "ข เป็นอักษรสูง ขา มีสระอาเสียงยาวไม่มีตัวสะกดจึงเป็นคำเป็น อักษรสูงคำเป็นไม่มีรูปวรรณยุกต์ออกเสียง **จัตวา**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.tone.p005
    topics: [thai.writing.tone-rules]
    difficulty: 2
    type: mcq
    stem: "คำว่า **ค่า** ออกเสียงวรรณยุกต์อะไร"
    choices:
      - { id: a, text: "เสียงโท", correct: true, feedback: "ถูก อักษรต่ำ + ไม้เอก ให้เสียงโท" }
      - { id: b, text: "เสียงเอก", feedback: "ไม้เอกให้เสียงเอกเฉพาะอักษรกลางและอักษรสูง ค เป็นอักษรต่ำ" }
      - { id: c, text: "เสียงสามัญ", feedback: "เสียงสามัญคือ คา ที่ไม่มีรูปวรรณยุกต์" }
      - { id: d, text: "เสียงตรี", feedback: "เสียงตรีของอักษรต่ำคำเป็นใช้ไม้โท คือ ค้า" }
    hints:
      - "ค เป็นอักษรต่ำ และ ค่า เป็นคำเป็น"
      - "ดูตารางแถวอักษรต่ำ คำเป็น ช่องไม้เอก"
    solution: "ค เป็นอักษรต่ำ ค่า เป็นคำเป็น (สระอายาว ไม่มีตัวสะกด) อักษรต่ำคำเป็นที่มีไม้เอกออกเสียง **โท**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.tone.p006
    topics: [thai.writing.tone-rules]
    difficulty: 3
    type: text
    stem: "คำว่า **ม้า** ออกเสียงวรรณยุกต์อะไร"
    accepted: ["ตรี", "เสียงตรี"]
    misconceptions:
      - { match: "โท", feedback: "เขียนด้วยไม้โท แต่ ม เป็นอักษรต่ำ อักษรต่ำ + ไม้โท ให้เสียงตรี" }
      - { match: "เสียงโท", feedback: "เขียนด้วยไม้โท แต่ ม เป็นอักษรต่ำ อักษรต่ำ + ไม้โท ให้เสียงตรี" }
    hints:
      - "ม เป็นอักษรหมู่ใด"
      - "รูปวรรณยุกต์บนอักษรต่ำให้เสียงสูงกว่าชื่อรูปหนึ่งขั้น ดูตารางแถวอักษรต่ำ คำเป็น ช่องไม้โท"
    solution: "ม เป็นอักษรต่ำ (เดี่ยว) ม้า เป็นคำเป็น อักษรต่ำคำเป็นที่มีไม้โทออกเสียง **ตรี**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.tone.p007
    topics: [thai.writing.tone-rules]
    difficulty: 3
    type: match
    stem: "จับคู่คำที่ไม่มีรูปวรรณยุกต์กับเสียงวรรณยุกต์ที่ออกจริง"
    pairs:
      - { left: "หมา", right: "จัตวา" }
      - { left: "ปาก", right: "เอก" }
      - { left: "มาก", right: "โท" }
      - { left: "รัก", right: "ตรี" }
      - { left: "นา", right: "สามัญ" }
    hints:
      - "ทุกคำไม่มีรูปวรรณยุกต์ จึงต้องดูหมู่ของพยัญชนะต้นและคำเป็นคำตาย หมา มี ห นำ"
      - "อักษรต่ำคำตายต้องดูสระด้วย: สระสั้นเป็นเสียงตรี สระยาวเป็นเสียงโท"
    solution: "หมา: ห นำ ม ผันตามอักษรสูง คำเป็น → จัตวา · ปาก: อักษรกลาง คำตาย → เอก · มาก: อักษรต่ำ คำตาย สระยาว → โท · รัก: อักษรต่ำ คำตาย สระสั้น → ตรี · นา: อักษรต่ำ คำเป็น → สามัญ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.tone.p008
    topics: [thai.writing.tone-rules]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการหาเสียงวรรณยุกต์ของคำว่า **สุข** ให้ถูกต้อง"
    items:
      - "ดูพยัญชนะต้น: ส เป็นอักษรสูง"
      - "ดูตัวสะกด: ข สะกดเป็นแม่กก จึงเป็นคำตาย"
      - "ดูรูปวรรณยุกต์: ไม่มีรูป"
      - "เปิดตาราง: อักษรสูง คำตาย ไม่มีรูป ได้เสียงเอก"
    hints:
      - "เริ่มจากหมู่ของพยัญชนะต้น แล้วดูชนิดของคำ"
      - "รูปวรรณยุกต์ดูหลังจากรู้หมู่และชนิดคำแล้ว ขั้นสุดท้ายคือเปิดตาราง"
    solution: "หมู่พยัญชนะต้น (ส สูง) → คำเป็นหรือคำตาย (ข สะกด แม่กก → ตาย) → รูปวรรณยุกต์ (ไม่มี) → ตาราง: อักษรสูงคำตายไม่มีรูปเป็นเสียงเอก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.tone.p009
    topics: [thai.writing.tone-rules]
    difficulty: 4
    type: mcq
    stem: "ป้ายหน้าร้านเขียนว่า \"ข้าวผัด จานละ 50 บาท\" คำว่า **ข้าว** ออกเสียงวรรณยุกต์อะไร"
    choices:
      - { id: a, text: "เสียงโท", correct: true, feedback: "ถูก อักษรสูง คำเป็น ไม้โท ให้เสียงโท" }
      - { id: b, text: "เสียงตรี", feedback: "ไม้โทให้เสียงตรีเฉพาะอักษรต่ำ แต่ ข เป็นอักษรสูง" }
      - { id: c, text: "เสียงจัตวา", feedback: "จัตวาคือเสียงของอักษรสูงคำเป็นที่ไม่มีรูป เช่น ขาว แต่คำนี้มีไม้โท" }
      - { id: d, text: "เสียงเอก", feedback: "เสียงเอกของอักษรสูงคำเป็นใช้ไม้เอก เช่น ข่าว" }
    hints:
      - "ข เป็นอักษรหมู่ใด ว สะกดทำให้เป็นคำเป็นหรือคำตาย"
      - "ดูตารางแถวอักษรสูง คำเป็น ช่องไม้โท"
    solution: "ข เป็นอักษรสูง ว สะกดเป็นแม่เกอว จึงเป็นคำเป็น อักษรสูงคำเป็นที่มีไม้โทออกเสียง **โท**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.tone.p010
    topics: [thai.writing.tone-rules]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "คำใดออกเสียงวรรณยุกต์ **ตรี** (เลือกให้ครบ)"
    choices:
      - { id: a, text: "น้อง", correct: true }
      - { id: b, text: "โต๊ะ", correct: true }
      - { id: c, text: "นะ", correct: true }
      - { id: d, text: "พี่", feedback: "พ เป็นอักษรต่ำ + ไม้เอก ให้เสียงโท" }
      - { id: e, text: "หน้า", feedback: "ห นำ น จึงผันตามอักษรสูง อักษรสูง + ไม้โท ให้เสียงโท" }
      - { id: f, text: "ข้าง", feedback: "ข เป็นอักษรสูง + ไม้โท ให้เสียงโท" }
    hints:
      - "เสียงตรีเกิดได้จากอักษรกลาง + ไม้ตรี อักษรต่ำ + ไม้โท หรืออักษรต่ำคำตายสระสั้นไม่มีรูป"
      - "ระวังคำที่มี ห นำ ให้ผันตามอักษรสูง"
    solution: "น้อง (อักษรต่ำ + ไม้โท) โต๊ะ (อักษรกลาง + ไม้ตรี) และ นะ (อักษรต่ำ คำตาย สระสั้น ไม่มีรูป) ออกเสียงตรี ส่วน พี่ หน้า ข้าง ออกเสียงโท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.tone.p011
    topics: [thai.writing.tone-rules]
    difficulty: 4
    type: text
    stem: "คำว่า **หยุด** ออกเสียงวรรณยุกต์อะไร"
    accepted: ["เอก", "เสียงเอก"]
    misconceptions:
      - { match: "ตรี", feedback: "ถ้าดูแค่ ย (อักษรต่ำ คำตาย สระสั้น) จะได้ตรี แต่ ห นำ ย ทำให้ผันตามอักษรสูง" }
      - { match: "เสียงตรี", feedback: "ถ้าดูแค่ ย (อักษรต่ำ คำตาย สระสั้น) จะได้ตรี แต่ ห นำ ย ทำให้ผันตามอักษรสูง" }
      - { match: "จัตวา", feedback: "จัตวาคือเสียงของอักษรสูงคำเป็น แต่ หยุด มี ด สะกดจึงเป็นคำตาย" }
    hints:
      - "คำนี้มีอักษรนำ ห นำอักษรต่ำเดี่ยวจะผันตามอักษรหมู่ใด"
      - "ด สะกดเป็นแม่กด แล้วดูตารางแถวอักษรสูง คำตาย"
    solution: "ห นำ ย จึงผันตามอักษรสูง ด สะกดเป็นแม่กด จึงเป็นคำตาย อักษรสูงคำตายไม่มีรูปออกเสียง **เอก**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.tone.p012
    topics: [thai.writing.tone-rules]
    difficulty: 5
    type: mcq
    stem: "น้องพูดว่า \"หนูอยากกินข้าวมันไก่\" คำว่า **อยาก** ออกเสียงวรรณยุกต์อะไร"
    choices:
      - { id: a, text: "เสียงเอก", correct: true, feedback: "ถูก อ นำ ย ผันตามอักษรกลาง คำตายไม่มีรูปจึงเป็นเสียงเอก" }
      - { id: b, text: "เสียงโท", feedback: "ถ้าดูแค่ ย (อักษรต่ำ คำตาย สระยาว) จะได้เสียงโท แต่คำนี้มี อ นำ ย จึงผันตามอักษรกลาง" }
      - { id: c, text: "เสียงจัตวา", feedback: "อ ไม่ใช่อักษรสูงแบบ ห อ นำ ย ผันตามอักษรกลาง และคำนี้เป็นคำตาย" }
      - { id: d, text: "เสียงสามัญ", feedback: "ก สะกดทำให้เป็นคำตาย อักษรกลางคำตายไม่มีเสียงสามัญ" }
    hints:
      - "อยาก เป็นหนึ่งในคำ อ นำ ย 4 คำ คือ อย่า อยู่ อย่าง อยาก"
      - "อ นำ ย ผันตามอักษรกลาง แล้วดูว่า ก สะกดทำให้เป็นคำเป็นหรือคำตาย"
    solution: "อ นำ ย ผันตามอักษรกลาง ก สะกดเป็นแม่กก จึงเป็นคำตาย อักษรกลางคำตายไม่มีรูปออกเสียง **เอก**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.tone.p013
    topics: [thai.writing.tone-rules]
    difficulty: 5
    type: text
    stem: "เพื่อนต่างชาติอยากเขียนคำที่ออกเสียงเหมือน **ค่า** (เสียงโท) แต่ใช้พยัญชนะต้น ข แทน ค ต้องเขียนคำนี้อย่างไร"
    accepted: ["ข้า"]
    misconceptions:
      - { match: "ข่า", feedback: "อักษรสูง + ไม้เอก ให้เสียงเอก ไม่ใช่เสียงโท" }
      - { match: "ขา", feedback: "อักษรสูงคำเป็นไม่มีรูปออกเสียงจัตวา" }
    hints:
      - "ข เป็นอักษรสูง ซึ่งผันได้ 3 เสียงในคำเป็น: จัตวา เอก โท"
