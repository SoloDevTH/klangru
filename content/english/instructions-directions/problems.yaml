problems:
  - id: english.listening.instructions-directions.p001
    topics: [english.listening.instructions-directions]
    difficulty: 1
    type: match
    stem: "จับคู่กริยาในสูตรอาหารกับความหมาย"
    pairs:
      - { left: "chop", right: "หั่นเป็นชิ้น" }
      - { left: "boil", right: "ต้ม" }
      - { left: "stir", right: "คน" }
      - { left: "pour", right: "เท" }
    hints:
      - "boil ใช้กับน้ำที่ร้อนจนเดือด"
      - "stir ใช้ช้อนวนในหม้อ pour คือเทของเหลวออกจากภาชนะ"
    solution: "chop → หั่นเป็นชิ้น · boil → ต้ม · stir → คน · pour → เท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.listening.instructions-directions.p002
    topics: [english.listening.instructions-directions]
    difficulty: 1
    type: mcq
    stem: "ป้ายที่พิพิธภัณฑ์เขียนว่า *Please do not touch.* หมายความว่าอะไร"
    choices:
      - { id: a, text: "กรุณาอย่าจับ", correct: true, feedback: "ถูก do not = อย่า, touch = จับ แตะ" }
      - { id: b, text: "กรุณาจับเบา ๆ", feedback: "do not แปลว่า อย่า ไม่ใช่ให้จับเบา ๆ" }
      - { id: c, text: "กรุณาถ่ายรูป", feedback: "touch แปลว่า แตะ จับ ไม่ใช่ถ่ายรูป" }
      - { id: d, text: "กรุณาเข้าแถว", feedback: "เข้าแถวคือ Please queue here." }
    hints:
      - "do not / don't = อย่า"
      - "touch แปลว่าอะไร"
    solution: "*Please do not touch.* = **กรุณาอย่าจับ**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.listening.instructions-directions.p003
    topics: [english.listening.instructions-directions]
    difficulty: 1
    type: mcq
    stem: "ดูแผนที่ เริ่มที่ You are here หันหน้าไปทางเหนือ *Walk along Main Street. The bank is on your left, before the traffic lights.* ธนาคารคืออาคารใด"
    figure: { src: map-quiz.svg, alt: "แผนที่ทิศเหนืออยู่ด้านบน จุด You are here อยู่ล่างสุดของ Main Street Main Street ตัดกับ Park Road (ทางแยกแรก มีสัญญาณไฟจราจร) และ River Road (ทางแยกที่สอง) สุดถนนเป็น City Park ก่อนถึงไฟจราจร อาคาร A อยู่ฝั่งตะวันตกของ Main Street และ B อยู่ฝั่งตะวันออก ริม Park Road ฝั่งตะวันตก: D ฝั่งเหนือ C ฝั่งใต้ ริม Park Road ฝั่งตะวันออก: F ฝั่งเหนือ E ฝั่งใต้ ริม River Road ฝั่งตะวันตก: H ฝั่งเหนือ G ฝั่งใต้ ริม River Road ฝั่งตะวันออก: J ฝั่งเหนือ I ฝั่งใต้" }
    choices:
      - { id: a, text: "A", correct: true, feedback: "ถูก เดินขึ้นเหนือ ซ้ายมือคือฝั่งตะวันตก ก่อนถึงไฟจราจร" }
      - { id: b, text: "B", feedback: "B อยู่ขวามือ (on your right)" }
      - { id: c, text: "C", feedback: "C อยู่ริม Park Road ต้องเลี้ยวก่อน โจทย์ไม่ได้ให้เลี้ยว" }
      - { id: d, text: "F", feedback: "F อยู่หลังไฟจราจรและต้องเลี้ยวขวา" }
    hints:
      - "เดินขึ้นไปทางทิศเหนือ ซ้ายมือคือฝั่งไหน"
      - "before the traffic lights = ก่อนถึงไฟจราจร"
    solution: "เดินขึ้นเหนือ ซ้ายมือคือฝั่งตะวันตก อาคารก่อนถึงไฟจราจรฝั่งนั้นคือ **A**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.listening.instructions-directions.p004
    topics: [english.listening.instructions-directions]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนทำไข่เจียวให้ถูกลำดับ"
    items:
      - "Crack two eggs into a bowl."
      - "Add a teaspoon of fish sauce and beat the eggs."
      - "Heat some oil in a pan."
      - "Pour the eggs into the hot oil."
      - "Fry until golden, then turn it over."
      - "Serve with rice."
    hints:
      - "ต้องมีไข่ในชามก่อนจะตีไข่"
      - "น้ำมันต้องร้อนก่อนเทไข่ลงไป เสิร์ฟเป็นขั้นสุดท้าย"
    solution: "ตอกไข่ใส่ชาม → ใส่น้ำปลาแล้วตี → ตั้งน้ำมันให้ร้อน → เทไข่ → ทอดจนเหลืองแล้วกลับด้าน → เสิร์ฟกับข้าว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.listening.instructions-directions.p005
    topics: [english.listening.instructions-directions]
    difficulty: 2
    type: mcq
    stem: "กติกาเกมเก้าอี้ดนตรี: *Walk around the chairs. When the music stops, sit on a chair. The player without a chair is out.* เมื่อเพลงหยุด ต้องทำอะไร"
    choices:
      - { id: a, text: "นั่งบนเก้าอี้ให้เร็วที่สุด", correct: true, feedback: "ถูก When the music stops, sit on a chair." }
      - { id: b, text: "เดินรอบเก้าอี้ต่อไป", feedback: "เดินรอบเก้าอี้ตอนที่เพลงยังเล่นอยู่" }
      - { id: c, text: "ออกจากเกมทันที", feedback: "คนที่ออกคือคนที่ไม่มีเก้าอี้นั่ง (without a chair)" }
      - { id: d, text: "ยกเก้าอี้ออกหนึ่งตัว", feedback: "กติกาไม่ได้บอกให้ผู้เล่นยกเก้าอี้" }
    hints:
      - "หาประโยคที่ขึ้นต้นด้วย When the music stops"
      - "sit on a chair = นั่งบนเก้าอี้"
    solution: "*When the music stops, **sit on a chair**.* ผู้เล่นที่ไม่มีเก้าอี้ออกจากเกม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.listening.instructions-directions.p006
    topics: [english.listening.instructions-directions]
    difficulty: 2
    type: mcq
    stem: "ดูฉลากยาที่ได้จากร้านขายยา ควรกินยานี้ตอนไหน"
    figure: { src: medicine-label.svg, alt: "ฉลากยาตัวอย่าง MEDICINE X (example) 21 tablets ข้อความ: Take 1 tablet 3 times a day after meals. Do not take more than 3 tablets in 24 hours. Swallow whole with water. Do not chew. Keep out of the reach of children. Store below 30°C. Keep away from sunlight." }
    choices:
      - { id: a, text: "หลังอาหาร วันละ 3 ครั้ง ครั้งละ 1 เม็ด", correct: true, feedback: "ถูก after meals = หลังอาหาร" }
      - { id: b, text: "ก่อนอาหาร วันละ 3 ครั้ง ครั้งละ 1 เม็ด", feedback: "ก่อนอาหารคือ before meals ฉลากเขียน after meals" }
      - { id: c, text: "หลังอาหาร วันละ 1 ครั้ง ครั้งละ 3 เม็ด", feedback: "สลับตัวเลข: 1 tablet (ครั้งละ 1 เม็ด) 3 times a day (วันละ 3 ครั้ง)" }
      - { id: d, text: "ก่อนนอน วันละ 1 ครั้ง", feedback: "ก่อนนอนคือ at bedtime ฉลากไม่ได้เขียนแบบนั้น" }
    hints:
      - "อ่านบรรทัดแรกของฉลาก"
      - "after meals / before meals ต่างกันอย่างไร"
    solution: "*Take 1 tablet 3 times a day after meals.* = กิน**หลังอาหาร วันละ 3 ครั้ง ครั้งละ 1 เม็ด** ถ้าไม่แน่ใจให้ถามเภสัชกร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.listening.instructions-directions.p007
    topics: [english.listening.instructions-directions]
    difficulty: 2
    type: text
    stem: "เติมคำที่แปลว่า จนกระทั่ง: *Fry the egg ___ it is golden.*"
    accepted: ["until", "till"]
    misconceptions:
      - { match: "when", feedback: "when แปลว่า เมื่อ ประโยคนี้ต้องการ ทอดไปเรื่อย ๆ จนเหลือง ใช้ until" }
      - { match: "before", feedback: "before แปลว่า ก่อน ทอดก่อนจะเหลืองไม่ใช่ความหมายของสูตร" }
    hints:
      - "คำนี้บอกว่าทำไปเรื่อย ๆ ถึงจุดไหนจึงหยุด"
      - "ขึ้นต้นด้วย u"
    solution: "*Fry the egg **until** it is golden.* (ภาษาพูดใช้ till ได้)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.listening.instructions-directions.p008
    topics: [english.listening.instructions-directions]
    difficulty: 3
    type: numeric
    stem: "ดูฉลากยา ถ้ากินตามฉลากทุกวัน ยาทั้งแผงจะพอกินกี่วัน"
    figure: { src: medicine-label.svg, alt: "ฉลากยาตัวอย่าง MEDICINE X (example) 21 tablets ข้อความ: Take 1 tablet 3 times a day after meals. Do not take more than 3 tablets in 24 hours. Swallow whole with water. Do not chew. Keep out of the reach of children. Store below 30°C. Keep away from sunlight." }
    answer: { value: 7, unit: "วัน" }
    misconceptions:
      - { match: 63, feedback: "ต้องหาร ไม่ใช่คูณ ยามี 21 เม็ด กินวันละ 3 เม็ด" }
      - { match: 18, feedback: "21 − 3 คือยาที่เหลือหลังวันแรก ต้องหาว่า 3 เม็ดต่อวันใช้ได้กี่วัน" }
    hints:
      - "หาจำนวนเม็ดทั้งหมดบนฉลาก และจำนวนเม็ดที่กินต่อวัน"
      - "จำนวนวัน = จำนวนเม็ดทั้งหมด ÷ จำนวนเม็ดต่อวัน"
    solution: "21 tablets, วันละ 1 × 3 = 3 เม็ด → 21 ÷ 3 = **7** วัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.listening.instructions-directions.p009
    topics: [english.listening.instructions-directions]
    difficulty: 3
    type: mcq
    stem: "ดูแผนที่ เริ่มที่ You are here *Go straight on. Take the first turning on the right. It's on your left.* ถึงอาคารใด"
    figure: { src: map-quiz.svg, alt: "แผนที่ทิศเหนืออยู่ด้านบน จุด You are here อยู่ล่างสุดของ Main Street Main Street ตัดกับ Park Road (ทางแยกแรก มีสัญญาณไฟจราจร) และ River Road (ทางแยกที่สอง) สุดถนนเป็น City Park ก่อนถึงไฟจราจร อาคาร A อยู่ฝั่งตะวันตกของ Main Street และ B อยู่ฝั่งตะวันออก ริม Park Road ฝั่งตะวันตก: D ฝั่งเหนือ C ฝั่งใต้ ริม Park Road ฝั่งตะวันออก: F ฝั่งเหนือ E ฝั่งใต้ ริม River Road ฝั่งตะวันตก: H ฝั่งเหนือ G ฝั่งใต้ ริม River Road ฝั่งตะวันออก: J ฝั่งเหนือ I ฝั่งใต้" }
    choices:
      - { id: a, text: "F", correct: true, feedback: "ถูก เลี้ยวขวาเข้า Park Road เดินไปทางตะวันออก ซ้ายมือคือฝั่งเหนือ" }
      - { id: b, text: "E", feedback: "E อยู่ฝั่งใต้ ซึ่งเป็นขวามือเมื่อเดินไปทางตะวันออก" }
      - { id: c, text: "J", feedback: "J อยู่ที่ทางแยกที่สอง (River Road) โจทย์บอกทางแยกแรก" }
      - { id: d, text: "D", feedback: "D อยู่ทางซ้ายของ Main Street ต้องเลี้ยวซ้ายจึงจะไปถึง" }
    hints:
      - "ทางแยกแรกคือถนนไหน เลี้ยวขวาแล้วเดินไปทิศใด"
      - "เดินไปทางตะวันออก ซ้ายมือคือฝั่งเหนือของถนน"
    solution: "ทางแยกแรกคือ Park Road เลี้ยวขวาเดินไปทางตะวันออก ซ้ายมือคือฝั่งเหนือ → **F**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.listening.instructions-directions.p010
    topics: [english.listening.instructions-directions]
    difficulty: 3
    type: mcq
    stem: "ดูแผนที่ เริ่มที่ You are here *Go straight on and turn left at the traffic lights. It's on your right.* ถึงอาคารใด"
    figure: { src: map-quiz.svg, alt: "แผนที่ทิศเหนืออยู่ด้านบน จุด You are here อยู่ล่างสุดของ Main Street Main Street ตัดกับ Park Road (ทางแยกแรก มีสัญญาณไฟจราจร) และ River Road (ทางแยกที่สอง) สุดถนนเป็น City Park ก่อนถึงไฟจราจร อาคาร A อยู่ฝั่งตะวันตกของ Main Street และ B อยู่ฝั่งตะวันออก ริม Park Road ฝั่งตะวันตก: D ฝั่งเหนือ C ฝั่งใต้ ริม Park Road ฝั่งตะวันออก: F ฝั่งเหนือ E ฝั่งใต้ ริม River Road ฝั่งตะวันตก: H ฝั่งเหนือ G ฝั่งใต้ ริม River Road ฝั่งตะวันออก: J ฝั่งเหนือ I ฝั่งใต้" }
    choices:
      - { id: a, text: "D", correct: true, feedback: "ถูก เลี้ยวซ้ายเดินไปทางตะวันตก ขวามือคือฝั่งเหนือ" }
      - { id: b, text: "C", feedback: "C อยู่ฝั่งใต้ ซึ่งเป็นซ้ายมือเมื่อเดินไปทางตะวันตก" }
      - { id: c, text: "F", feedback: "F อยู่ทางขวาของ Main Street ต้องเลี้ยวขวา" }
      - { id: d, text: "H", feedback: "H อยู่ริม River Road ไฟจราจรอยู่ที่ Park Road" }
    hints:
      - "ไฟจราจรอยู่ที่ถนนไหน"
      - "เลี้ยวซ้ายแล้วเดินไปทางตะวันตก ขวามือคือฝั่งเหนือ"
    solution: "ไฟจราจรอยู่ที่ Park Road เลี้ยวซ้ายเดินไปทางตะวันตก ขวามือคือฝั่งเหนือ → **D**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.listening.instructions-directions.p011
    topics: [english.listening.instructions-directions]
    difficulty: 3
    type: numeric
    stem: "ที่สถานีกรุงเทพอภิวัฒน์ ประกาศว่า *Attention, please. The 6.10 p.m. train to Chiang Mai will now leave from platform 5, not platform 3. We are sorry for the change.* ผู้โดยสารไปเชียงใหม่ต้องไปชานชาลาที่เท่าไร"
    answer: { value: 5 }
    misconceptions:
      - { match: 3, feedback: "ชานชาลา 3 เป็นชานชาลาเดิม ประกาศบอกว่า now ... platform 5, not platform 3" }
      - { match: 6, feedback: "6 มาจากเวลา 6.10 p.m. ไม่ใช่หมายเลขชานชาลา" }
    hints:
      - "ประกาศนี้บอกการเปลี่ยนแปลง ดูคำว่า now และ not"
      - "ตัวเลขหลัง platform มีสองตัว ตัวไหนเป็นของใหม่"
    solution: "*will now leave from platform 5, not platform 3* → ชานชาลาที่ **5**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.listening.instructions-directions.p012
    topics: [english.listening.instructions-directions]
    difficulty: 4
    type: mcq
    stem: "ดูแผนที่ เริ่มที่ You are here *Go straight on. Take the second turning on the left. It's on your left.* ถึงอาคารใด"
    figure: { src: map-quiz.svg, alt: "แผนที่ทิศเหนืออยู่ด้านบน จุด You are here อยู่ล่างสุดของ Main Street Main Street ตัดกับ Park Road (ทางแยกแรก มีสัญญาณไฟจราจร) และ River Road (ทางแยกที่สอง) สุดถนนเป็น City Park ก่อนถึงไฟจราจร อาคาร A อยู่ฝั่งตะวันตกของ Main Street และ B อยู่ฝั่งตะวันออก ริม Park Road ฝั่งตะวันตก: D ฝั่งเหนือ C ฝั่งใต้ ริม Park Road ฝั่งตะวันออก: F ฝั่งเหนือ E ฝั่งใต้ ริม River Road ฝั่งตะวันตก: H ฝั่งเหนือ G ฝั่งใต้ ริม River Road ฝั่งตะวันออก: J ฝั่งเหนือ I ฝั่งใต้" }
    choices:
      - { id: a, text: "G", correct: true, feedback: "ถูก เลี้ยวซ้ายเข้า River Road เดินไปทางตะวันตก ซ้ายมือคือฝั่งใต้" }
      - { id: b, text: "H", feedback: "H อยู่ฝั่งเหนือ ซึ่งเป็นขวามือเมื่อเดินไปทางตะวันตก" }
      - { id: c, text: "C", feedback: "C อยู่ที่ทางแยกแรก (Park Road) โจทย์บอกทางแยกที่สอง" }
      - { id: d, text: "I", feedback: "I อยู่ทางขวาของ Main Street ต้องเลี้ยวขวา" }
    hints:
      - "ทางแยกที่สองคือถนนไหน"
      - "เลี้ยวซ้ายเดินไปทางตะวันตก ซ้ายมือคือฝั่งใต้"
    solution: "ทางแยกที่สองคือ River Road เลี้ยวซ้ายเดินไปทางตะวันตก ซ้ายมือคือฝั่งใต้ → **G**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.listening.instructions-directions.p013
    topics: [english.listening.instructions-directions]
    difficulty: 4
    type: mcq
    stem: "ดูแผนที่ เริ่มที่ You are here *Go past the traffic lights and take the second right. It's on your right.* ถึงอาคารใด"
