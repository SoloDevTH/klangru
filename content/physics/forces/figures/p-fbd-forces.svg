<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320" font-family="sans-serif" font-size="15">
  <title>แผนภาพแรงของกล่อง แรง 70 N ไปทางขวา แรง 25 N และ 15 N ไปทางซ้าย น้ำหนัก 50 N ชี้ลง แรงตั้งฉาก 50 N ชี้ขึ้น</title>
  <rect x="0" y="0" width="520" height="320" fill="#ffffff"/>
  <rect x="215.0" y="115.0" width="90.0" height="90.0" rx="0" fill="#f3e3c3" stroke="#15211e" stroke-width="2"/>
  <line x1="305.0" y1="160.0" x2="405.0" y2="160.0" stroke="#0a6b60" stroke-width="3.2" stroke-linecap="butt"/>
  <polygon points="417.0,160.0 405.0,165.4 405.0,154.6" fill="#0a6b60"/>
  <text x="423.0" y="165.0" fill="#0a6b60" font-size="14" text-anchor="start" font-weight="bold">70 N</text>
  <line x1="215.0" y1="140.0" x2="187.0" y2="140.0" stroke="#b3261e" stroke-width="3.2" stroke-linecap="butt"/>
  <polygon points="175.0,140.0 187.0,134.6 187.0,145.4" fill="#b3261e"/>
  <text x="169.0" y="145.0" fill="#b3261e" font-size="14" text-anchor="end" font-weight="bold">25 N</text>
  <line x1="215.0" y1="185.0" x2="203.0" y2="185.0" stroke="#b3261e" stroke-width="3.2" stroke-linecap="butt"/>
  <polygon points="191.0,185.0 203.0,179.6 203.0,190.4" fill="#b3261e"/>
  <text x="185.0" y="190.0" fill="#b3261e" font-size="14" text-anchor="end" font-weight="bold">15 N</text>
  <line x1="260.0" y1="205.0" x2="260.0" y2="273.0" stroke="#b4521f" stroke-width="3.2" stroke-linecap="butt"/>
  <polygon points="260.0,285.0 254.6,273.0 265.4,273.0" fill="#b4521f"/>
  <text x="268.0" y="281.0" fill="#b4521f" font-size="14" text-anchor="start" font-weight="bold">50 N</text>
  <line x1="260.0" y1="115.0" x2="260.0" y2="47.0" stroke="#1f5fa8" stroke-width="3.2" stroke-linecap="butt"/>
  <polygon points="260.0,35.0 265.4,47.0 254.6,47.0" fill="#1f5fa8"/>
  <text x="268.0" y="49.0" fill="#1f5fa8" font-size="14" text-anchor="start" font-weight="bold">50 N</text>
</svg>
