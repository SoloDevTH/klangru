  - { id: computer.design.usability-evaluation, title: ประเมินความใช้งานง่ายและปรับปรุงจากผลทดสอบ, difficulty: 5, prereq: [computer.design.user-centred-design, computer.programming.development-process], indicators: ["acm-cs2023:HCI-Evaluation", "acm-cs2023:HCI-Design", "acm-cs2023:HCI-User", "acm-cs2023:HCI-SEP", "csta-k12-cs-2026:MS-PRO-TR-20", "csta-k12-cs-2026:HS-PRO-TR-19", "csta-k12-cs-2026:HS-PRO-TR-20", "csta-k12-cs-2026:S2-SWD-DD-02"], scope: "เพอร์โซนาและแผนที่การเดินทางของผู้ใช้ ปัจจัยมนุษย์ (ความจำระยะสั้น กฎของฟิตส์ ภาระทางความคิด) หลักฮิวริสติกสิบข้อของนีลเส็นและการประเมินโดยผู้เชี่ยวชาญ ทดสอบกับผู้ใช้แบบคิดดัง ๆ ตัวชี้วัด (อัตราสำเร็จ เวลา จำนวนข้อผิดพลาด แบบสอบถาม SUS) การทดสอบ A/B จัดลำดับปัญหาตามความรุนแรงแล้วแก้ทีละรอบเพื่อความใช้ง่ายและการเข้าถึงได้ ประเมินตามข้อกำหนดการออกแบบและค่านิยมการออกแบบอย่างรับผิดชอบ (ความถูกต้อง ประสิทธิผล ประสบการณ์) รูปแบบหลอกล่อ (dark patterns) และจริยธรรมของการออกแบบส่วนต่อประสาน โจทย์คำนวณคะแนน SUS และเลือกการแก้ไขจากผลทดสอบ" }
