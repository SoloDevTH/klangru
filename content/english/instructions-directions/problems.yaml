  - id: english.listening.instructions-directions.p015
    topics: [english.listening.instructions-directions]
    difficulty: 4
    type: mcq
    stem: "ประกาศเสียงตามสายของโรงเรียน: *Good morning, everyone. Because of the heavy rain, today's sports day is cancelled. Please go to your classrooms at nine o'clock. Sports day will now take place next Friday.* ใจความสำคัญคืออะไร"
    choices:
      - { id: a, text: "กีฬาสีวันนี้ยกเลิกเพราะฝนตกหนัก และเลื่อนไปเป็นวันศุกร์หน้า", correct: true, feedback: "ถูก ครบทั้งเรื่องหลัก เหตุผล และวันใหม่" }
      - { id: b, text: "กีฬาสีเริ่มเวลาเก้าโมงเช้าวันนี้", feedback: "เก้าโมงเป็นเวลาเข้าห้องเรียน กีฬาสีวันนี้ยกเลิก (cancelled)" }
      - { id: c, text: "วันนี้โรงเรียนหยุดเพราะฝนตก", feedback: "ประกาศให้ไปห้องเรียน แปลว่ายังเรียนตามปกติ" }
      - { id: d, text: "นักเรียนต้องเตรียมชุดกันฝนมาวันศุกร์", feedback: "ประกาศไม่ได้พูดถึงชุดกันฝน" }
    hints:
      - "cancelled = ยกเลิก, take place = จัดขึ้น"
      - "ใจความสำคัญต้องบอกเรื่องหลักและการเปลี่ยนแปลง"
    solution: "**กีฬาสีวันนี้ยกเลิกเพราะฝนตกหนัก (because of the heavy rain) และเลื่อนไปจัดวันศุกร์หน้า (next Friday)** ส่วนวันนี้ให้เข้าห้องเรียนเวลาเก้าโมง"
