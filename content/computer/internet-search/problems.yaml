problems:
  - id: computer.data.internet-search.p001
    topics: [computer.data.internet-search]
    difficulty: 1
    type: mcq
    stem: "น้ำฝนอยากรู้ว่าช้างไทยกินอะไร คำค้นใดเหมาะที่สุด"
    choices:
      - { id: a, text: "อาหาร ช้างไทย", correct: true }
      - { id: b, text: "ช้าง", feedback: "กว้างเกินไป จะได้ทั้งเพลง ภาพ ร้านค้า และช้างประเทศอื่น" }
      - { id: c, text: "อยากรู้ว่าช้างที่อยู่ในประเทศไทยชอบกินอะไรบ้างคะ ช่วยบอกหน่อย", feedback: "ยาวเกินไป มีคำที่ไม่ช่วยค้นหา เช่น คะ ช่วยบอกหน่อย ควรใช้เฉพาะคำสำคัญ" }
      - { id: d, text: "สัตว์", feedback: "กว้างมาก ไม่บอกว่าสนใจช้างหรือเรื่องอาหาร" }
    hints:
      - "คำค้นที่ดีมีแต่คำสำคัญ"
      - "เรื่องที่อยากรู้มีคำสำคัญอะไรบ้าง"
    solution: "อาหาร กับ ช้างไทย คือคำสำคัญของเรื่องที่อยากรู้ คำค้นนี้สั้นและเจาะจง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.internet-search.p002
    topics: [computer.data.internet-search]
    difficulty: 1
    type: mcq
    stem: "ถ้าต้องการหาความรู้จากเว็บไซต์ต่าง ๆ ทั่วโลก ควรใช้เครื่องมือใด"
    choices:
      - { id: a, text: "โปรแกรมค้นหา (search engine)", correct: true }
      - { id: b, text: "โปรแกรมวาดภาพ", feedback: "ใช้วาดหรือตกแต่งภาพ ไม่ได้ใช้หาข้อมูลบนเว็บไซต์" }
      - { id: c, text: "เครื่องคิดเลข", feedback: "ใช้คำนวณ ไม่ได้ค้นข้อมูล" }
      - { id: d, text: "ช่องค้นหาไฟล์ในเครื่อง", feedback: "หาได้เฉพาะไฟล์ที่เก็บในเครื่องของเรา ไม่ได้หาบนอินเทอร์เน็ต" }
    hints:
      - "เครื่องมือใดทำดัชนีหน้าเว็บทั่วโลกไว้"
      - "ข้อมูลที่ต้องการอยู่บนอินเทอร์เน็ต ไม่ใช่ในเครื่อง"
    solution: "โปรแกรมค้นหารวบรวมดัชนีหน้าเว็บทั่วโลก แล้วแสดงหน้าที่ตรงกับคำค้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.internet-search.p003
    topics: [computer.data.internet-search]
    difficulty: 2
    type: match
    stem: "จับคู่ตัวช่วยค้นหากับความหมาย"
    pairs:
      - { left: "\"ประเพณีลอยกระทง\"", right: "หาวลีที่ตรงตัวทุกคำ" }
      - { left: "ลอยกระทง -เพลง", right: "ตัดผลที่มีคำว่า เพลง ออก" }
      - { left: "ภาวะโลกร้อน site:ac.th", right: "หาเฉพาะในเว็บของสถานศึกษาไทย" }
      - { left: "ช้าง OR ม้า", right: "หาผลที่มีคำใดคำหนึ่ง" }
    hints:
      - "เครื่องหมายลบหน้าคำแปลว่าไม่เอาคำนั้น"
      - "site: ตามด้วยโดเมน ใช้จำกัดว่าหาในเว็บใด"
    solution: "\"...\" = วลีตรงตัว, -คำ = ตัดคำนั้นออก, site: = จำกัดเว็บไซต์หรือโดเมน, OR = คำใดคำหนึ่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.internet-search.p004
    topics: [computer.data.internet-search]
    difficulty: 2
    type: mcq
    stem: "ในหน้าผลการค้นหาตามภาพ ผลลัพธ์ใดเป็นโฆษณาที่มีผู้จ่ายเงินให้แสดง"
    figure:
      src: search-results.svg
      alt: "หน้าผลการค้นหาสมมติ คำค้น ค่าฝุ่น PM2.5 เชียงใหม่ วันนี้ ผลลัพธ์ ก มีป้าย โฆษณา เว็บร้านขายเครื่องฟอกอากาศ หัวเรื่องเครื่องฟอกอากาศลดราคา 70% ผลลัพธ์ ข เว็บบล็อกสุขภาพ ปี 2562 หัวเรื่อง ฝุ่นหมดใน 3 วัน แค่ทำสิ่งนี้ หมอไม่อยากให้รู้ ไม่ระบุผู้เขียน โพสต์เมื่อ 5 ปีก่อน ผลลัพธ์ ค เว็บหน่วยงานตรวจวัดคุณภาพอากาศ หัวเรื่อง ค่าฝุ่น PM2.5 รายชั่วโมง สถานีตรวจวัดเชียงใหม่ อัปเดต 10 นาทีที่แล้ว ผลลัพธ์ ง กระทู้ถามตอบ ใครรู้บ้างฝุ่นวันนี้เยอะไหม มีคนตอบ 3 คนเมื่อวานนี้"
    choices:
      - { id: a, text: "ผลลัพธ์ ก", correct: true }
      - { id: b, text: "ผลลัพธ์ ข", feedback: "เป็นบทความที่ดูเกินจริง แต่ไม่มีป้ายโฆษณา จึงเป็นผลการค้นหาปกติ" }
      - { id: c, text: "ผลลัพธ์ ค", feedback: "เป็นผลปกติจากเว็บหน่วยงาน ไม่มีป้ายโฆษณา" }
      - { id: d, text: "ไม่มีโฆษณา เพราะทุกรายการเรียงตามความถูกต้อง", feedback: "โปรแกรมค้นหาแสดงโฆษณาปนกับผลลัพธ์ได้ และอันดับไม่ได้เรียงตามความถูกต้อง" }
    hints:
      - "ดูป้ายกำกับเล็ก ๆ หน้าชื่อเว็บไซต์"
      - "โฆษณามักชวนให้ซื้อสินค้า"
    solution: "ผลลัพธ์ ก มีป้าย โฆษณา และชวนซื้อสินค้า แสดงว่ามีผู้จ่ายเงินให้ขึ้นอยู่ด้านบน ไม่ได้แปลว่าตอบคำถามเรื่องค่าฝุ่นได้ดี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.internet-search.p005
    topics: [computer.data.internet-search]
    difficulty: 3
    type: mcq
    stem: "จากผลการค้นหาในภาพ ถ้าต้องการรู้ค่าฝุ่น PM2.5 ของเชียงใหม่ตอนนี้ ผลลัพธ์ใดน่าเชื่อถือที่สุด"
    figure:
      src: search-results.svg
      alt: "หน้าผลการค้นหาสมมติ คำค้น ค่าฝุ่น PM2.5 เชียงใหม่ วันนี้ ผลลัพธ์ ก มีป้าย โฆษณา เว็บร้านขายเครื่องฟอกอากาศ ผลลัพธ์ ข เว็บบล็อกสุขภาพ ปี 2562 หัวเรื่อง ฝุ่นหมดใน 3 วัน ไม่ระบุผู้เขียน โพสต์เมื่อ 5 ปีก่อน ผลลัพธ์ ค เว็บหน่วยงานตรวจวัดคุณภาพอากาศ ค่าฝุ่นรายชั่วโมงจากสถานีตรวจวัดเชียงใหม่ อัปเดต 10 นาทีที่แล้ว ผลลัพธ์ ง กระทู้ถามตอบ มีคนตอบ 3 คนเมื่อวานนี้"
    choices:
      - { id: a, text: "ผลลัพธ์ ค", correct: true }
      - { id: b, text: "ผลลัพธ์ ก", feedback: "เป็นโฆษณาขายเครื่องฟอกอากาศ จุดประสงค์คือขายของ ไม่ได้รายงานค่าฝุ่น" }
      - { id: c, text: "ผลลัพธ์ ข", feedback: "ไม่ระบุผู้เขียน เขียนเมื่อ 5 ปีก่อน และพาดหัวเกินจริง จึงตอบเรื่องค่าฝุ่นวันนี้ไม่ได้" }
      - { id: d, text: "ผลลัพธ์ ง", feedback: "เป็นความเห็นของคนทั่วไปจากเมื่อวาน ไม่ใช่ค่าที่วัดจริงในวันนี้" }
    hints:
      - "ใช้คำถาม ใคร เมื่อไร และทำไม กับแต่ละผล"
      - "ข้อมูลค่าฝุ่นเปลี่ยนทุกชั่วโมง ต้องใหม่และมาจากการวัดจริง"
    solution: "ผลลัพธ์ ค มาจากหน่วยงานที่ตรวจวัดโดยตรง อัปเดตเมื่อ 10 นาทีที่แล้ว และมีจุดประสงค์ให้ข้อมูล จึงน่าเชื่อถือที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.internet-search.p006
    topics: [computer.data.internet-search]
    difficulty: 2
    type: mcq
    stem: "ข้อใด **ไม่ใช่** เกณฑ์ที่ดีในการตัดสินว่าข้อมูลบนเว็บไซต์น่าเชื่อถือ"
    choices:
      - { id: a, text: "เว็บไซต์สวยและมีคนกดถูกใจมาก", correct: true }
      - { id: b, text: "บอกชื่อผู้เขียนหรือหน่วยงานที่เชี่ยวชาญ", feedback: "เป็นเกณฑ์ที่ดี เรารู้ว่าใครรับผิดชอบข้อมูล" }
      - { id: c, text: "มีวันที่เขียนหรือแก้ไขล่าสุด", feedback: "เป็นเกณฑ์ที่ดี ช่วยบอกว่าข้อมูลยังทันสมัยหรือไม่" }
      - { id: d, text: "อ้างแหล่งที่มาที่ตรวจสอบได้", feedback: "เป็นเกณฑ์ที่ดี เราตามไปตรวจหลักฐานได้" }
    hints:
      - "ข้อใดเกี่ยวกับหน้าตาหรือความนิยม ไม่ใช่ความถูกต้อง"
      - "นึกถึง 5 คำถาม ใคร เมื่อไร ที่ไหน ทำไม หลักฐาน"
    solution: "ความสวยงามและยอดถูกใจไม่ได้บอกว่าเนื้อหาถูกต้อง ข่าวปลอมหลายข่าวทั้งสวยและมีคนกดถูกใจมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.internet-search.p007
    topics: [computer.data.internet-search]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการค้นหาข้อมูลทำรายงานอย่างมีประสิทธิภาพ"
    items:
      - "กำหนดให้ชัดว่าต้องการรู้อะไร"
      - "เลือกคำสำคัญมาเป็นคำค้น"
      - "ค้นหาแล้วกรองผลด้วยตัวช่วยค้นหา"
      - "ประเมินความน่าเชื่อถือและเทียบหลายแหล่ง"
      - "จดชื่อเว็บไซต์และวันที่ไว้อ้างอิง"
    hints:
      - "ต้องรู้ก่อนว่าหาอะไร จึงจะเลือกคำค้นได้"
      - "การอ้างอิงเกิดหลังจากเลือกแหล่งที่จะใช้แล้ว"
    solution: "ตั้งเป้าหมาย → เลือกคำค้น → ค้นและกรอง → ประเมินและเทียบแหล่ง → บันทึกแหล่งอ้างอิง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.internet-search.p008
    topics: [computer.data.internet-search]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "โพสต์ในภาพมีสัญญาณเตือนของข่าวปลอมข้อใดบ้าง (เลือกได้หลายข้อ)"
    figure:
      src: fake-post.svg
      alt: "โพสต์สมมติจากเพจ ข่าวสุขภาพทันใจ ที่สร้างเมื่อ 2 สัปดาห์ก่อน ข้อความว่า ด่วน แชร์ด่วนก่อนถูกลบ ดื่มน้ำมะนาวร้อนวันละแก้ว ฆ่าเชื้อไวรัสได้ 100% หมอยืนยันแล้ว รักใครให้แชร์ต่อ ไม่แชร์โชคร้าย 7 ปี มีภาพแก้วน้ำมะนาว ไม่มีชื่อแพทย์และไม่มีลิงก์แหล่งที่มา ถูกใจ 18K แชร์ 25K"
    choices:
      - { id: a, text: "อ้างว่าได้ผล 100%", correct: true, feedback: "คำเกินจริงแบบนี้เป็นสัญญาณเตือน ข้อมูลทางการแพทย์ที่ถูกต้องไม่ค่อยอ้างว่าได้ผลทุกคน" }
      - { id: b, text: "เร่งให้แชร์ก่อนถูกลบ และขู่ว่าไม่แชร์จะโชคร้าย", correct: true, feedback: "การเร่งและขู่ทำให้คนแชร์ก่อนคิด" }
      - { id: c, text: "อ้างว่าหมอยืนยันแต่ไม่บอกชื่อหรือแหล่งที่มา", correct: true, feedback: "ตรวจสอบไม่ได้ว่าหมอคนไหน ยืนยันที่ใด" }
      - { id: d, text: "มีรูปภาพประกอบ", feedback: "การมีรูปไม่ใช่สัญญาณเตือนในตัวเอง ข่าวจริงก็มีรูป แต่ต้องดูว่ารูปเกี่ยวข้องจริงหรือไม่" }
    hints:
      - "ดูคำที่ใช้ การเร่งเร้า และแหล่งที่มา"
      - "ข้อใดเป็นลักษณะทั่วไปที่ข่าวจริงก็มีได้"
    solution: "คำเกินจริง การเร่งให้แชร์ และการอ้างผู้เชี่ยวชาญโดยไม่มีแหล่งที่มาเป็นสัญญาณของข่าวปลอม ส่วนการมีรูปภาพไม่ได้บอกว่าจริงหรือปลอม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.internet-search.p009
    topics: [computer.data.internet-search]
    difficulty: 4
    type: match
    stem: "จับคู่ข้อความกับเหตุผลวิบัติที่ใช้"
    pairs:
      - { left: "คนแชร์สองหมื่นครั้ง ข่าวนี้ต้องจริงแน่", right: "อ้างคนส่วนใหญ่" }
      - { left: "อย่าเชื่อที่เขาพูดเรื่องขยะ เขาแต่งตัวไม่เรียบร้อย", right: "โจมตีตัวบุคคล" }
      - { left: "ใส่เสื้อสีแดงวันสอบแล้วได้เต็ม เสื้อสีแดงทำให้เก่ง", right: "เกิดตามกันจึงเป็นเหตุ" }
      - { left: "เพื่อนสองคนกินแล้วหายหวัด ยานี้รักษาได้ทุกคน", right: "สรุปเกินจากตัวอย่างน้อย" }
      - { left: "นักร้องดังบอกว่าอาหารเสริมนี้รักษาเบาหวานได้", right: "อ้างผู้มีชื่อเสียงที่ไม่เชี่ยวชาญ" }
    hints:
      - "ดูว่าข้อความใช้อะไรเป็นเหตุผล: จำนวนคน ตัวบุคคล ลำดับเหตุการณ์ ตัวอย่างไม่กี่ราย หรือชื่อเสียง"
      - "การโจมตีตัวคนแทนการโต้แย้งเนื้อหาเรียกว่าอะไร"
    solution: "จำนวนแชร์ = อ้างคนส่วนใหญ่, แต่งตัว = โจมตีตัวบุคคล, เสื้อแดงกับคะแนน = เกิดตามกันจึงเป็นเหตุ, สองคนหาย = สรุปจากตัวอย่างน้อย, นักร้องกับยา = อ้างผู้มีชื่อเสียงนอกสาขา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.internet-search.p010
    topics: [computer.data.internet-search]
    difficulty: 3
    type: mcq
    stem: "ข้อใดอธิบายการจัดอันดับผลการค้นหาได้ถูกต้องที่สุด"
    choices:
      - { id: a, text: "ระบบเรียงตามความตรงกับคำค้น ความนิยม ความใหม่ และปัจจัยอื่น จึงไม่รับประกันว่าอันดับแรกถูกต้อง", correct: true }
      - { id: b, text: "เจ้าหน้าที่ตรวจทุกหน้าแล้วเรียงจากถูกต้องที่สุด", feedback: "หน้าเว็บมีจำนวนมหาศาล ระบบจัดอันดับอัตโนมัติ ไม่มีใครตรวจความจริงทุกหน้า" }
