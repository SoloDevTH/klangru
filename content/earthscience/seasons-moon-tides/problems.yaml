    ai_assisted: true

  - id: earthscience.astronomy.seasons-moon-tides.p015
    topics: [earthscience.astronomy.seasons-moon-tides]
    difficulty: 5
    type: numeric
    stem: "ผลการทำให้เกิดน้ำขึ้นน้ำลงของวัตถุแปรผันตาม $M/d^3$ เมื่อ $M$ คือมวลและ $d$ คือระยะห่างจากโลก ดวงจันทร์มีมวล $7.35 \\times 10^{22}$ kg อยู่ห่าง $3.84 \\times 10^{5}$ km ดวงอาทิตย์มีมวล $1.99 \\times 10^{30}$ kg อยู่ห่าง $1.496 \\times 10^{8}$ km ผลของดวงจันทร์เป็นกี่เท่าของดวงอาทิตย์"
    answer: { value: 2.18, tolerance: 0.03, unit: เท่า }
    misconceptions:
      - { match: 0.0056, feedback: "ใช้ $d^2$ แบบแรงโน้มถ่วงปกติ ซึ่งบอกว่าดวงอาทิตย์ดึงโลกแรงกว่ามาก แต่น้ำขึ้นน้ำลงเกิดจากผลต่างของแรง ซึ่งแปรตาม $1/d^3$" }
      - { match: 0.458, feedback: "นี่คือผลของดวงอาทิตย์เทียบกับดวงจันทร์ (กลับเศษกับส่วน) โจทย์ถามดวงจันทร์เทียบกับดวงอาทิตย์" }
    hints:
      - "อัตราส่วน $= \\dfrac{M_\\text{จันทร์}}{M_\\text{อาทิตย์}} \\times \\left(\\dfrac{d_\\text{อาทิตย์}}{d_\\text{จันทร์}}\\right)^3$"
      - "$\\dfrac{1.496 \\times 10^8}{3.84 \\times 10^5} \\approx 390$"
    solution: "$\\dfrac{7.35 \\times 10^{22}}{1.99 \\times 10^{30}} \\times (389.6)^3 \\approx 3.69 \\times 10^{-8} \\times 5.91 \\times 10^{7} \\approx 2.18$ ผลของดวงจันทร์ราว 2.2 เท่าของดวงอาทิตย์ แม้ดวงอาทิตย์ดึงโลกด้วยแรงมากกว่าราว 180 เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.seasons-moon-tides.p016
    topics: [earthscience.astronomy.seasons-moon-tides]
    difficulty: 5
    type: numeric
    stem: "สมมติว่าแกนโลกเอียง 30° แทน 23.44° วันที่ดวงอาทิตย์อยู่ตรงศีรษะที่ละติจูดเหนือสุด (เดคลิเนชัน +30°) ดวงอาทิตย์ตอนเที่ยงที่เชียงใหม่ (ละติจูด 18.79° เหนือ) จะมีมุมเงยกี่องศา"
    answer: { value: 78.79, tolerance: 0.1, unit: องศา }
    misconceptions:
      - { match: 41.21, feedback: "บวกละติจูดกับเดคลิเนชัน ทั้งสองอยู่ซีกโลกเหนือ ต้องลบกัน: $\\lvert 18.79 - 30 \\rvert$" }
      - { match: 11.21, feedback: "11.21° คือมุมจากจุดเหนือศีรษะ ต้องนำ 90 ลบ" }
    hints:
      - "แกนเอียงเท่าไร เดคลิเนชันสูงสุดเท่านั้น"
      - "มุมเงย $= 90 - \\lvert 18.79 - 30 \\rvert$"
    solution: "$\\lvert 18.79 - 30 \\rvert = 11.21^\\circ$ มุมเงย $= 90 - 11.21 = 78.79^\\circ$ ดวงอาทิตย์อยู่ทางทิศเหนือ ถ้าแกนเอียงมากขึ้น ความต่างของฤดูจะชัดเจนขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true
