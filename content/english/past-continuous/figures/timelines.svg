<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="sans-serif">
<title>เส้นเวลาของ past continuous คู่กับ past simple</title>
<rect x="0" y="0" width="760" height="400" fill="#fff"/>
<text x="30.0" y="32.0" font-size="16" text-anchor="start" fill="#111" font-weight="bold">1) การกระทำที่กำลังเกิด ถูกเหตุการณ์สั้นแทรก (when)</text>
<line x1="60.0" y1="110.0" x2="720.0" y2="110.0" stroke="#111" stroke-width="2" stroke-linecap="round"/>
<line x1="60.0" y1="104.0" x2="60.0" y2="116.0" stroke="#111" stroke-width="2" stroke-linecap="round"/>
<text x="60.0" y="134.0" font-size="14" text-anchor="middle" fill="#444" font-weight="normal">6:00</text>
<line x1="280.0" y1="104.0" x2="280.0" y2="116.0" stroke="#111" stroke-width="2" stroke-linecap="round"/>
<text x="280.0" y="134.0" font-size="14" text-anchor="middle" fill="#444" font-weight="normal">6:30</text>
<line x1="500.0" y1="104.0" x2="500.0" y2="116.0" stroke="#111" stroke-width="2" stroke-linecap="round"/>
<text x="500.0" y="134.0" font-size="14" text-anchor="middle" fill="#444" font-weight="normal">7:00</text>
<line x1="720.0" y1="104.0" x2="720.0" y2="116.0" stroke="#111" stroke-width="2" stroke-linecap="round"/>
<text x="720.0" y="134.0" font-size="14" text-anchor="middle" fill="#444" font-weight="normal">7:30 p.m.</text>
<rect x="60.0" y="68.0" width="440.0" height="26.0" rx="6" fill="#9cc7ff" stroke="#2f5fa8" stroke-width="2"/>
<text x="280.0" y="86.0" font-size="15" text-anchor="middle" fill="#1d3f75" font-weight="bold">I was cooking (กำลังทำอาหาร)</text>
<line x1="270.0" y1="100.0" x2="290.0" y2="120.0" stroke="#d63b2f" stroke-width="4" stroke-linecap="round"/>
<line x1="270.0" y1="120.0" x2="290.0" y2="100.0" stroke="#d63b2f" stroke-width="4" stroke-linecap="round"/>
<text x="280.0" y="158.0" font-size="15" text-anchor="middle" fill="#d63b2f" font-weight="bold">the phone rang (โทรศัพท์ดัง)</text>
<text x="380.0" y="185.0" font-size="17" text-anchor="middle" fill="#111" font-weight="normal" font-style="italic">I was cooking when the phone rang.</text>
<text x="30.0" y="235.0" font-size="16" text-anchor="start" fill="#111" font-weight="bold">2) สองการกระทำเกิดพร้อมกัน (while)</text>
<line x1="60.0" y1="330.0" x2="720.0" y2="330.0" stroke="#111" stroke-width="2" stroke-linecap="round"/>
<rect x="170.0" y="260.0" width="440.0" height="24.0" rx="6" fill="#9cc7ff" stroke="#2f5fa8" stroke-width="2"/>
<text x="390.0" y="277.0" font-size="15" text-anchor="middle" fill="#1d3f75" font-weight="bold">Mum was reading</text>
<rect x="170.0" y="290.0" width="440.0" height="24.0" rx="6" fill="#b9e3b0" stroke="#2f8a4a" stroke-width="2"/>
<text x="390.0" y="307.0" font-size="15" text-anchor="middle" fill="#1f5a2e" font-weight="bold">Dad was washing the dishes</text>
<text x="380.0" y="370.0" font-size="17" text-anchor="middle" fill="#111" font-weight="normal" font-style="italic">Mum was reading while Dad was washing the dishes.</text>
</svg>
