  - id: chemistry.solutions.solubility-percent.p016
    topics: [chemistry.solutions.solubility-percent]
    difficulty: 5
    type: numeric
    stem: "แม่ค้าต้องการทำน้ำเชื่อมเข้มข้น 30% w/w โดยใช้น้ำตาลทรายทั้งหมด 150 g ต้องใช้น้ำกี่กรัม"
    answer: { value: 350, tolerance: 1, unit: g }
    misconceptions:
      - { match: 500, feedback: "500 g คือมวลน้ำเชื่อมทั้งหมด ยังต้องหักมวลน้ำตาลออก" }
      - { match: 45, feedback: "คูณ 150 ด้วย 0.30 ได้มวลน้ำตาลในสารละลาย 150 g แต่โจทย์ให้น้ำตาล 150 g เป็นร้อยละ 30 ของสารละลาย" }
    hints:
      - "น้ำตาล 150 g เป็นร้อยละ 30 ของมวลน้ำเชื่อมทั้งหมด"
      - "หามวลน้ำเชื่อมทั้งหมดก่อน แล้วลบมวลน้ำตาล"
    solution: "มวลน้ำเชื่อม $= \\dfrac{150}{0.30} = 500$ g · มวลน้ำ $= 500 - 150 = 350$ g"
