id: management.public.public-finance
subject: management
title: { th: การคลังและงบประมาณภาครัฐ, en: Public finance and budgeting }
summary: รายได้และรายจ่ายภาครัฐ ดุลการคลังและหนี้ต่อ GDP วงจรงบประมาณแผ่นดิน งบประมาณแบบมุ่งผลสัมฤทธิ์ การคลังท้องถิ่น และการอ่านสัดส่วนงบประมาณ
difficulty: 5.5
minutes: 35
prerequisites: [management.public.public-administration, math.number.ratio-percent]
encompasses:
  - { id: math.number.ratio-percent, weight: 0.4 }
  - { id: management.public.public-administration, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: budget-mix.svg
    alt: "แผนภูมิแท่งแนวนอน งบประมาณของกรมแห่งหนึ่ง (สมมติ) รวม 1,250 ล้านบาท งบบุคลากร 520 ล้านบาท งบดำเนินงาน 310 ล้านบาท งบลงทุน 245 ล้านบาท งบเงินอุดหนุน 130 ล้านบาท งบรายจ่ายอื่น 45 ล้านบาท"
    caption: "งบประมาณจำแนกตามงบรายจ่ายห้าประเภท (ข้อมูลสมมติ)"
  - type: worked-example
    title: อ่านส่วนแบ่งและค่าแท้จริงของงบประมาณ
    problem: "จากภาพ กรมแห่งหนึ่ง (สมมติ) ได้งบ 1,250 ล้านบาท (ก) งบบุคลากรคิดเป็นกี่เปอร์เซ็นต์ (ข) ถ้าปีหน้าได้งบรวม 1,320 ล้านบาท และเงินเฟ้อ 3% งบรวมเพิ่มขึ้นจริงกี่เปอร์เซ็นต์"
    steps:
      - text: "(ก) $520 \\div 1{,}250 \\times 100\\% = 41.6\\%$"
      - text: "(ข) อัตราเพิ่มตามตัวเงิน $1{,}320 \\div 1{,}250 - 1 = 5.6\\%$"
      - text: "หักเงินเฟ้อ $\\dfrac{1{,}320}{1.03 \\times 1{,}250} - 1 \\approx 0.0252$ หรือประมาณ $2.52\\%$"
        why: "เงิน 1,250 ล้านบาทปีนี้ ปีหน้าต้องใช้ $1{,}250 \\times 1.03$ จึงจะซื้อของได้เท่าเดิม จึงต้องหารด้วย 1.03 ไม่ใช่ลบ 3 ตรง ๆ"
      - text: "งบเพิ่มตามตัวเงิน 5.6% แต่กำลังซื้อเพิ่มจริงเพียงราว 2.5%"
    answer: "(ก) 41.6% (ข) เพิ่มจริงประมาณ 2.52%"
  - { type: check, problem: management.public.public-finance.p005 }
  - type: figure
    src: budget-cycle.svg
    alt: "แผนภาพวงกลมสี่ขั้นต่อกันด้วยลูกศรตามเข็มนาฬิกา 1 จัดทำ: ส่วนราชการทำคำขอ สำนักงบประมาณพิจารณา ครม. เห็นชอบร่าง → 2 อนุมัติ: สภาผู้แทนราษฎรแล้ววุฒิสภาพิจารณา ประกาศเป็น พ.ร.บ. → 3 บริหารงบประมาณ: ใช้จ่ายตามปีงบประมาณ 1 ต.ค. ถึง 30 ก.ย. เบิกจ่าย โอนเปลี่ยนแปลง → 4 ติดตามและตรวจสอบ: รายงานผลตามตัวชี้วัด ตรวจสอบการใช้เงิน ป้อนกลับสู่ปีถัดไป แล้ววนกลับไปขั้นที่ 1 กลางภาพเขียนว่าหนึ่งรอบกินเวลามากกว่าหนึ่งปี"
    caption: "วงจรงบประมาณแผ่นดินสี่ขั้น"
  - type: worked-example
    title: ขาดดุลและหนี้ต่อ GDP ของประเทศสมมติ
    problem: "ประเทศสมมติมีรายจ่าย 3,600,000 ล้านบาท รายได้ 2,900,000 ล้านบาท GDP 20,000,000 ล้านบาท หนี้สาธารณะต้นปี 12,400,000 ล้านบาท ถ้าขาดดุลทั้งหมดกู้มาชดเชย และ GDP ปีถัดไปโต 5% (ตามตัวเงิน) หนี้ต่อ GDP เปลี่ยนจากเท่าไรเป็นเท่าไร"
    steps:
      - text: "ขาดดุล $3{,}600{,}000 - 2{,}900{,}000 = 700{,}000$ ล้านบาท คิดเป็น $3.5\\%$ ของ GDP"
      - text: "หนี้ต่อ GDP ต้นปี $12{,}400{,}000 \\div 20{,}000{,}000 = 62\\%$"
      - text: "หนี้ใหม่ $12{,}400{,}000 + 700{,}000 = 13{,}100{,}000$ ล้านบาท"
      - text: "GDP ใหม่ $20{,}000{,}000 \\times 1.05 = 21{,}000{,}000$ ล้านบาท"
        why: "ต้องหารด้วย GDP ของปีเดียวกับหนี้ ถ้าหารด้วย GDP เดิมจะได้ 65.5% ซึ่งสูงเกินจริง"
      - text: "หนี้ต่อ GDP ใหม่ $13{,}100{,}000 \\div 21{,}000{,}000 \\approx 62.38\\%$"
    answer: "จาก 62% เป็นประมาณ 62.4% หนี้โตเร็วกว่าเศรษฐกิจเล็กน้อย"
  - { type: check, problem: management.public.public-finance.p010 }
  - type: figure
    src: p-local-revenue.svg
    alt: "แผนภูมิแท่งแนวนอน รายได้ของเทศบาลเมืองแห่งหนึ่ง (สมมติ) หน่วยล้านบาท ภาษีที่เทศบาลจัดเก็บเอง 38 ค่าธรรมเนียม ค่าปรับ ใบอนุญาต 7 รายได้จากทรัพย์สิน 5 (สามแท่งนี้สีเขียว เทศบาลหาเอง) ภาษีที่รัฐจัดเก็บแล้วจัดสรรให้ 120 เงินอุดหนุนจากรัฐบาล 150 (สองแท่งนี้สีน้ำเงิน มาจากรัฐบาลกลาง)"
    caption: "รายได้ของเทศบาลเมือง (ข้อมูลสมมติ ใช้ในโจทย์ข้อ 7 และ 8)"
glossary:
  - { term: ปีงบประมาณ, definition: "รอบการใช้งบประมาณของรัฐบาลไทย ตั้งแต่ 1 ตุลาคมถึง 30 กันยายนของปีถัดไป เรียกตามปีที่สิ้นสุด" }
  - { term: ภาษีทางอ้อม, definition: "ภาษีที่ผู้เสียภาษีผลักภาระไปให้ผู้ซื้อได้ เช่น ภาษีมูลค่าเพิ่ม ภาษีสรรพสามิต" }
  - { term: การขาดดุลการคลัง, definition: "รายจ่ายของรัฐมากกว่ารายได้ในปีเดียวกัน มักเทียบเป็นร้อยละของ GDP" }
  - { term: ดุลเบื้องต้น, definition: "ดุลการคลังที่ไม่นับดอกเบี้ยจ่ายของหนี้เดิม" }
  - { term: งบประมาณแบบมุ่งผลสัมฤทธิ์, definition: "การจัดสรรงบโดยผูกกับผลผลิตและผลลัพธ์ที่วัดได้ ไม่ใช่แจกแจงตามรายการค่าใช้จ่ายอย่างเดียว" }
  - { term: ผลผลิตและผลลัพธ์, definition: "ผลผลิตคือสิ่งที่หน่วยงานทำเสร็จ ผลลัพธ์คือการเปลี่ยนแปลงที่เกิดกับประชาชนหรือพื้นที่" }
  - { term: สัดส่วนพึ่งตนเองทางการคลัง, definition: "รายได้ที่ท้องถิ่นจัดเก็บเองหารด้วยรายได้ทั้งหมด ยิ่งสูงยิ่งพึ่งรัฐบาลกลางน้อย" }
flashcards:
