problems:
- id: chinese.grammar.word-order.p001
  topics:
  - chinese.grammar.word-order
  difficulty: 1
  type: mcq
  stem: '"ฉันอ่านหนังสือที่บ้าน" ภาษาจีนเรียงคำอย่างไร'
  choices:
  - id: a
    text: 在家看书我。
    feedback: ประธานต้องอยู่หน้ากริยา
  - id: b
    text: 我看在家书。
    feedback: 在家 แทรกระหว่างกริยากับกรรมไม่ได้
  - id: c
    text: 我在家看书。
    correct: true
    feedback: ถูก สถานที่ (在家) วางหน้ากริยา (看)
  - id: d
    text: 我看书在家。
    feedback: เรียงตามภาษาไทย ภาษาจีนไม่วาง 在 + สถานที่ ไว้ท้ายประโยค
  hints:
  - ภาษาไทยวาง ที่บ้าน ไว้ท้าย
  - 'ภาษาจีน: ประธาน + 在 + สถานที่ + กริยา + กรรม'
  solution: '**我在家看书。** Wǒ zài jiā kàn shū.'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.word-order.p002
  topics:
  - chinese.grammar.word-order
  difficulty: 2
  type: order
  stem: เรียงคำเป็นประโยค "ตอนบ่ายพวกเราเรียนที่ห้องสมุด" (图书馆 túshūguǎn = ห้องสมุด, 学习 xuéxí = เรียน)
  items:
  - 我们
  - 下午
  - 在
  - 图书馆
  - 学习
  hints:
  - ประธาน + เวลา + สถานที่ + กริยา
  - สถานที่ใช้ 在 นำหน้า
  solution: '**我们下午在图书馆学习。** Wǒmen xiàwǔ zài túshūguǎn xuéxí. (下午我们在图书馆学习 ก็ถูก)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.word-order.p003
  topics:
  - chinese.grammar.word-order
  difficulty: 2
  type: mcq
  stem: '"ฉันก็เป็นคนไทย" ประโยคใดถูกต้อง'
  choices:
  - id: a
    text: 我也是泰国人。
    correct: true
    feedback: ถูก 也 อยู่หลังประธาน หน้ากริยา
  - id: b
    text: 也我是泰国人。
    feedback: 也 วางหน้าประธานไม่ได้
  - id: c
    text: 我是也泰国人。
    feedback: 也 ต้องอยู่หน้ากริยา 是
  - id: d
    text: 我是泰国人也。
    feedback: 也 ไม่วางท้ายประโยคแบบคำว่า ด้วย ในภาษาไทย
  hints:
  - 也 yě = ก็ ด้วย
  - ภาษาจีนวาง 也 ไว้หน้ากริยาเท่านั้น
  solution: '**我也是泰国人。** Wǒ yě shì Tàiguórén.'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.word-order.p004
  topics:
  - chinese.grammar.word-order
  difficulty: 2
  type: hanzi
  stem: เขียนอักษร 都 (dōu) ที่แปลว่า ทั้งหมด ล้วน ตามลำดับขีด
  character: 都
  pinyin: dōu
  meaning: ทั้งหมด ล้วน
  hints:
  - 都 = 者 ทางซ้าย (8 ขีด) + 阝 ทางขวา (2 ขีด) รวม 10 ขีด
  - 'เขียน 者 ให้เสร็จก่อน: ส่วนบนคล้าย 土 แล้วขีดเฉียงยาว แล้ว 日 ด้านล่าง'
  solution: '者: 横 → 竖 → 横 → 撇 → 竖 → 横折 → 横 → 横 แล้ว 阝: 横撇弯钩 → 竖 รวม 10 ขีด'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.word-order.p005
  topics:
  - chinese.grammar.word-order
  difficulty: 2
  type: match
  stem: ประโยค 我明天在学校吃午饭。 (พรุ่งนี้ฉันกินข้าวกลางวันที่โรงเรียน) จับคู่ส่วนของประโยคกับหน้าที่
  pairs:
  - left: 我
    right: ประธาน
  - left: 明天
    right: เวลา
  - left: 在学校
    right: สถานที่
  - left: 吃
    right: กริยา
  - left: 午饭
    right: กรรม
  hints:
  - 明天 = พรุ่งนี้ 午饭 = ข้าวกลางวัน
  - ลำดับคือ ประธาน เวลา สถานที่ กริยา กรรม
  solution: 我 ประธาน · 明天 เวลา · 在学校 สถานที่ · 吃 กริยา · 午饭 กรรม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.word-order.p006
  topics:
  - chinese.grammar.word-order
  difficulty: 3
  type: mcq
  stem: นัดเพื่อนชาวจีนว่า "พวกเราเจอกันที่สถานี BTS สยามตอนบ่ายสามโมง" ประโยคใดถูกต้อง (暹罗站 Xiānluó zhàn = สถานีสยาม, 见 jiàn = พบ)
  choices:
  - id: a
    text: 我们见在暹罗站下午三点。
    feedback: เรียงตามภาษาไทย ภาษาจีนวางเวลาและสถานที่หน้ากริยา
  - id: b
    text: 我们在暹罗站见下午三点。
    feedback: เวลาต้องอยู่หน้ากริยา ไม่ใช่ท้ายประโยค
  - id: c
    text: 下午三点见我们在暹罗站。
    feedback: ประธานต้องอยู่หน้ากริยา และสถานที่อยู่หน้ากริยา
  - id: d
    text: 我们下午三点在暹罗站见。
    correct: true
    feedback: ถูก เวลา (下午三点) แล้วสถานที่ (在暹罗站) อยู่หน้ากริยา 见
  hints:
  - ภาษาจีนวางเวลาก่อนสถานที่ และทั้งสองอยู่หน้ากริยา
  - เวลาวางหน้าหรือหลังประธานได้ แต่ต้องอยู่หน้ากริยา
  solution: '**我们下午三点在暹罗站见。** (下午三点我们在暹罗站见 ก็ถูก)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.word-order.p007
  topics:
  - chinese.grammar.word-order
  difficulty: 3
  type: mcq
  stem: '"พวกเราเป็นนักเรียนทุกคน" ประโยคใดถูกต้อง'
  choices:
  - id: a
    text: 我们都是学生。
    correct: true
    feedback: ถูก 都 อยู่หลังประธานที่เป็นพหูพจน์ หน้ากริยา
  - id: b
    text: 都我们是学生。
    feedback: 都 วางหน้าประธานไม่ได้
  - id: c
    text: 我们是都学生。
    feedback: 都 ต้องอยู่หน้ากริยา 是
  - id: d
    text: 我们是学生都。
    feedback: 都 ไม่วางท้ายประโยคแบบคำว่า ทุกคน ในภาษาไทย
  hints:
  - 都 dōu = ทั้งหมด ล้วน
  - 都 รวบคำที่อยู่ข้างหน้า จึงวางหลังประธาน หน้ากริยา
  solution: '**我们都是学生。** Wǒmen dōu shì xuésheng.'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.word-order.p008
  topics:
  - chinese.grammar.word-order
  difficulty: 3
  type: mcq
  stem: '"วันนี้ร้อนมาก" (热 rè = ร้อน) ประโยคใดถูกต้อง'
  choices:
  - id: a
    text: 很今天热。
    feedback: 很 ขยายคุณศัพท์ จึงต้องอยู่หน้า 热 ติดกัน
  - id: b
    text: 今天很热。
    correct: true
    feedback: ถูก 很 วางหน้าคุณศัพท์ และไม่ต้องมี 是
  - id: c
    text: 今天热很。
    feedback: ภาษาไทยวาง มาก หลังคุณศัพท์ แต่ภาษาจีนวาง 很 หน้าคุณศัพท์
  - id: d
    text: 今天是很热。
    feedback: คุณศัพท์ไม่ต้องมี 是
  hints:
  - 很 hěn = มาก
  - 'ภาษาจีน: 很 + คุณศัพท์'
  solution: '**今天很热。** Jīntiān hěn rè. (很 อยู่หน้าคุณศัพท์ ต่างจาก มาก ในภาษาไทย)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.word-order.p009
  topics:
  - chinese.grammar.word-order
  difficulty: 3
  type: mcq
  stem: ข้อความภาษาจีน 我有苹果、香蕉和芒果。 เครื่องหมาย 、 ทำหน้าที่อะไร (香蕉 xiāngjiāo = กล้วย)
  choices:
  - id: a
    text: แสดงคำถาม
    feedback: คำถามใช้ ？
  - id: b
    text: คั่นประโยคย่อย
    feedback: คั่นประโยคย่อยใช้ ，
  - id: c
    text: คั่นรายการคำที่เรียงกันในประโยค
    correct: true
    feedback: ถูก 、 (顿号 dùnhào) ใช้คั่นรายการ ภาษาไทยมักเว้นวรรคแทน
  - id: d
    text: จบประโยค
    feedback: จบประโยคใช้ 。 (จุดวงกลม)
  hints:
  - ดูว่า 、 อยู่ระหว่างอะไร
  - ภาษาจีนมีจุลภาคสองแบบ ， และ 、
  solution: 、 = **顿号** ใช้คั่นรายการคำ ส่วน ， คั่นประโยคย่อย และ 。 จบประโยค
  license: CC-BY-SA-4.0
  ai_assisted: true
