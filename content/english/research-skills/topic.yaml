id: english.reading.research-skills
subject: english
title: { th: "การสืบค้นข้อมูลเป็นภาษาอังกฤษและนำเสนอ", en: "Researching in English and presenting findings" }
summary: ใช้พจนานุกรม เลือกคำค้นภาษาอังกฤษ ประเมินความน่าเชื่อถือของแหล่งข้อมูล จดบันทึก ถอดความ สรุป และนำเสนอข้อมูลของวิชาอื่นพร้อมบอกแหล่งที่มา
difficulty: 5
minutes: 40
prerequisites: [english.reading.main-idea]
encompasses:
  - { id: english.reading.main-idea, weight: 0.4 }
curriculum_tags: []
lessons:
  - type: figure
    src: dictionary-entry.svg
    alt: "รายการคำศัพท์ในพจนานุกรมพร้อมป้ายกำกับ headword: bank, pronunciation: /bæŋk/, part of speech: noun ความหมาย 1 an organization that keeps and lends money (ตัวอย่าง She keeps her savings in a bank.) ความหมาย 2 the land along the side of a river or lake (ตัวอย่าง We had a picnic on the river bank.) ความหมาย 3 a place where something is stored for use (a blood bank · a food bank) และ verb: to put money into a bank (I bank my pocket money every month.)"
    caption: "ส่วนต่าง ๆ ของรายการคำศัพท์ในพจนานุกรม"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: search-results.svg
    alt: "ผลการค้นหาสมมุติสำหรับคำค้น coral bleaching causes 4 ผล A: Coral Bleaching: Causes and Effects จาก Ocean Research Institute ปรับปรุงมีนาคม 2025 B: 10 CRAZY coral facts you won't believe!!! ไม่มีผู้เขียน ไม่มีวันที่ C: Coral-safe sunscreen - 20% OFF today เป็นโฆษณา (Sponsored) D: My diving trip to Koh Tao บล็อกส่วนตัวปี 2016 ที่เขียนว่า I think it was the boats"
    caption: "ผลการค้นหาสมมุติ ใช้ฝึกประเมินแหล่งข้อมูล"
  - type: worked-example
    title: จากคำถามสู่คำค้น
    problem: "ครูสังคมศึกษาให้หาว่า แม่น้ำโขงไหลผ่านกี่ประเทศ ควรค้นเป็นภาษาอังกฤษอย่างไร"
    steps:
      - text: "เขียนคำถามเป็นภาษาอังกฤษ: How many countries does the Mekong River flow through?"
      - text: "เลือกคำนามสำคัญ: Mekong River, countries"
        why: "คำเล็ก เช่น how, does, the ไม่ช่วยให้ผลค้นหาตรงขึ้น"
      - text: "ใส่อัญประกาศให้ชื่อแม่น้ำ: \"Mekong River\" countries"
      - text: "เปิดอย่างน้อยสองแหล่งที่เชื่อถือได้ แล้วเทียบคำตอบ"
    answer: "\"Mekong River\" countries แล้วตรวจคำตอบจากสองแหล่ง (แม่น้ำโขงไหลผ่าน 6 ประเทศ: จีน เมียนมา ลาว ไทย กัมพูชา เวียดนาม)"
  - { type: check, problem: english.reading.research-skills.p003, prompt: "เลือกคำนามสำคัญ" }
  - type: worked-example
    title: จากบันทึกสู่ประโยคนำเสนอ
    problem: "บันทึก: warm water (weeks) → corals push out algae → lose colour · แหล่ง: Ocean Research Institute, 2025 เขียนเป็นประโยคนำเสนอหนึ่งประโยค"
    steps:
      - text: "เริ่มด้วยแหล่งที่มา: According to the Ocean Research Institute,"
      - text: "เปลี่ยนลูกศรเป็นคำเชื่อมเหตุผล: when ... , ... and so ..."
      - text: "ใช้คำของตัวเอง: corals lose their colour when warm water makes them push out their algae."
        why: "ไม่คัดลอกประโยคต้นฉบับ แต่ความหมายต้องตรงกับบันทึก"
    answer: "According to the Ocean Research Institute (2025), corals lose their colour when warm water makes them push out their algae."
  - { type: check, problem: english.reading.research-skills.p007, prompt: "ถาม Who? When? Why? Evidence?" }
glossary:
  - { term: headword, definition: "คำที่ค้นในพจนานุกรม" }
  - { term: part of speech, definition: "ชนิดของคำ เช่น noun verb adjective adverb" }
  - { term: keyword, definition: "คำค้น คำสำคัญที่พิมพ์ในเครื่องมือค้นหา" }
  - { term: source, definition: "แหล่งที่มาของข้อมูล เช่น หนังสือ บทความ เว็บไซต์" }
  - { term: paraphrase, definition: "ถอดความด้วยคำและโครงสร้างของตนเอง โดยความหมายเท่าเดิม" }
  - { term: sponsored, definition: "ผลการค้นหาที่เป็นโฆษณา มีผู้จ่ายเงินให้แสดง" }
flashcards:
  - { front: "คำถาม 4 ข้อประเมินแหล่งข้อมูล", back: "Who? When? Why? Evidence?" }
  - { front: "\"coral bleaching\" ในช่องค้นหาหมายถึงอะไร", back: "ค้นทั้งวลีที่สองคำอยู่ติดกัน" }
  - { front: "jaguar -car", back: "ตัดผลที่มีคำว่า car ออก" }
  - { front: "สำนวนบอกแหล่งข้อมูลในการนำเสนอ", back: "According to ..., The data shows that ..." }
  - { front: "โครงสร้างการนำเสนอ", back: "Introduction → Main points (พร้อมหลักฐาน) → Conclusion → Sources" }
