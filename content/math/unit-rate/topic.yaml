id: math.number.unit-rate
subject: math
title: { th: บัญญัติไตรยางศ์และอัตราต่อหน่วย, en: Rule of three and unit rates }
summary: หาค่าต่อหนึ่งหน่วยแล้วหาค่าที่ต้องการ เทียบความคุ้มค่า หาอัตราเร็วและค่าจ้าง แบ่งของไม่เท่ากัน และใช้เศษส่วนกับอัตราส่วน
difficulty: 2.5
minutes: 35
prerequisites: [math.number.whole-mixed-operations, math.number.decimals]
encompasses:
  - { id: math.number.whole-mixed-operations, weight: 0.3 }
  - { id: math.number.decimals, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: rule-of-three.svg
    alt: "แผนภาพบัญญัติไตรยางศ์ สองหลัก หลักซ้ายเป็นจำนวนด้าม หลักขวาเป็นราคา แถวแรก 3 ด้าม คู่กับ 36 บาท ลูกศรหาร 3 ทั้งสองข้างไปแถวสอง 1 ด้าม คู่กับ 12 บาท แล้วลูกศรคูณ 5 ทั้งสองข้างไปแถวสาม 5 ด้าม คู่กับ 60 บาท"
    caption: "ทำอะไรกับจำนวนด้าม ก็ทำแบบเดียวกันกับราคา"
  - type: worked-example
    title: ซื้อไข่ด้วยบัญญัติไตรยางศ์
    problem: "ไข่ไก่ 10 ฟอง ราคา 45 บาท ถ้าซื้อ 24 ฟอง ต้องจ่ายกี่บาท"
    steps:
      - text: "หาราคาต่อ 1 ฟอง: $45 \\div 10 = 4.5$ บาท"
        why: "รู้ราคาของ 10 ฟอง จึงหารด้วย 10 เพื่อให้เหลือ 1 ฟอง"
      - text: "คูณด้วยจำนวนที่ต้องการ: $4.5 \\times 24 = 108$ บาท"
      - text: "ตรวจ: 24 ฟองมากกว่า 10 ฟองประมาณ 2 เท่าครึ่ง ราคา 108 บาทก็ประมาณ 2 เท่าครึ่งของ 45 บาท สมเหตุสมผล"
        why: "ถ้าได้ $45 + 14 = 59$ บาท คือบวกจำนวนฟองที่เพิ่ม ซึ่งผิด เพราะราคาเพิ่มเป็นเท่า ไม่ได้เพิ่มทีละบาท"
    answer: "108 บาท"
  - { type: check, problem: math.number.unit-rate.p001, prompt: "หาราคาของหนึ่งด้ามก่อน" }
  - type: interactive
    title: ราคารวมเมื่อราคาต่อหน่วยคงที่
    caption: "k คือราคาต่อชิ้น (บาท) แกนนอนคือจำนวนชิ้น กราฟเป็นเส้นตรงผ่านจุด (0, 0) เสมอ ยิ่ง k มาก เส้นยิ่งชัน"
    widget:
      kind: function-plot
      functions: ["k x"]
      sliders:
        - { name: k, min: 1, max: 20, step: 1, value: 12, label: ราคาต่อชิ้น }
      x: [0, 10]
      y: [0, 120]
  - type: worked-example
    title: อัตราเร็วเมื่อเวลามีนาที
    problem: "ขับรถจากกรุงเทพฯ ไปชลบุรีระยะทาง 80 กิโลเมตร ใช้เวลา 1 ชั่วโมง 15 นาที อัตราเร็วเฉลี่ยกี่กิโลเมตรต่อชั่วโมง"
    steps:
      - text: "เปลี่ยนเวลาเป็นชั่วโมง: 15 นาที $= \\tfrac{15}{60} = 0.25$ ชั่วโมง เวลาทั้งหมด $1.25$ ชั่วโมง"
        why: "1 ชั่วโมงมี 60 นาที ไม่ใช่ 100 นาที จึงเขียน 1.15 ไม่ได้"
      - text: "อัตราเร็ว $=$ ระยะทาง $\\div$ เวลา $= 80 \\div 1.25 = 64$ กิโลเมตรต่อชั่วโมง"
      - text: "ตรวจ: ขับ 64 กม./ชม. นาน 1.25 ชั่วโมง ได้ $64 \\times 1.25 = 80$ กม. ตรงกับโจทย์"
    answer: "64 กิโลเมตรต่อชั่วโมง"
  - type: figure
    src: sharing-bar.svg
    alt: "แบบจำลองบาร์ แถวบนน้องมี 1 ช่อง แถวล่างพี่มี 3 ช่องขนาดเท่ากัน รวม 60 เม็ด ทุกช่องเขียน 15 ใต้ภาพเขียนว่า รวม 4 ช่อง ช่องละ 60 ÷ 4 = 15 เม็ด"
    caption: "พี่ได้ 3 เท่าของน้อง แปลว่าทั้งหมดมี 4 ช่อง"
  - { type: check, problem: math.number.unit-rate.p009, prompt: "วาดแท่งของพี่และน้องก่อน แล้วนับว่ามีกี่ช่อง" }
glossary:
  - { term: บัญญัติไตรยางศ์, definition: "วิธีหาค่าที่ไม่รู้จากค่าที่รู้สามค่า โดยหาค่าต่อหนึ่งหน่วยก่อนแล้วคูณด้วยจำนวนที่ต้องการ" }
  - { term: อัตรา, definition: "การเปรียบเทียบปริมาณสองอย่างที่มีหน่วยต่างกัน เช่น กิโลเมตรต่อชั่วโมง" }
  - { term: อัตราต่อหน่วย, definition: "อัตราที่ปริมาณตัวหลังเป็น 1 เช่น 60 กิโลเมตรต่อ 1 ชั่วโมง หรือ 12 บาทต่อ 1 ด้าม" }
  - { term: ราคาต่อหน่วย, definition: "ราคาของสินค้า 1 หน่วย เช่น บาทต่อกิโลกรัม ใช้เทียบความคุ้มค่า" }
  - { term: อัตราเร็ว, definition: "ระยะทางที่เคลื่อนที่ได้ต่อหนึ่งหน่วยเวลา หาจากระยะทางหารด้วยเวลา" }
flashcards:
  - { front: "บัญญัติไตรยางศ์มีกี่ขั้น", back: "2 ขั้น: หาค่าต่อ 1 หน่วย (หาร) แล้วคูณด้วยจำนวนที่ต้องการ" }
  - { front: "คำว่า ต่อ ในอัตราหมายถึงอะไร", back: "หารด้วย เช่น บาทต่อกิโลกรัม = บาท ÷ กิโลกรัม" }
  - { front: "1 ชั่วโมง 15 นาที เท่ากับกี่ชั่วโมง", back: "1.25 ชั่วโมง (ไม่ใช่ 1.15)" }
  - { front: "72 กม./ชม. เท่ากับกี่ ม./วินาที", back: "72,000 ÷ 3,600 = 20 ม./วินาที" }
  - { front: "คูณ 250 ด้วย 3/4 ผลมากหรือน้อยกว่า 250", back: "น้อยกว่า เพราะคูณด้วยจำนวนที่น้อยกว่า 1" }
