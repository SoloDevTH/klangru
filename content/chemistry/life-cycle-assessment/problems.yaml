  - id: chemistry.industry.life-cycle-assessment.p013
    topics: [chemistry.industry.life-cycle-assessment]
    difficulty: 5
    type: numeric
    stem: "ทำกระดาษจากเยื่อไม้ใหม่ปล่อย 1.1 kg CO₂e ต่อกิโลกรัม ทำจากกระดาษเก่าปล่อย 0.7 kg CO₂e ต่อกิโลกรัม (ไม่รวมการขนกระดาษเก่า) รถเก็บกระดาษเก่าปล่อย 0.002 kg CO₂e ต่อกิโลกรัมกระดาษต่อกิโลเมตร (ข้อมูลสมมติ) ระยะขนส่งไกลสุดกี่กิโลเมตรที่การรีไซเคิลยังปล่อยไม่มากกว่าการทำจากเยื่อใหม่"
    answer: { value: 200, unit: km, tolerance: 1 }
    misconceptions:
      - { match: 550, feedback: "ใช้ 1.1 หารตรง ๆ แต่สิ่งที่ประหยัดได้คือผลต่าง 1.1 − 0.7 เท่านั้น" }
      - { match: 350, feedback: "ใช้ 0.7 หาร ต้องใช้ส่วนที่ประหยัดได้ 0.4 kg ต่อกิโลกรัม" }
    hints:
      - "รีไซเคิลประหยัดได้กี่ kg CO₂e ต่อกิโลกรัมกระดาษ"
      - "ระยะทางที่การขนส่งกินส่วนที่ประหยัดหมดพอดี = ส่วนที่ประหยัด ÷ 0.002"
    solution: "ประหยัด $1.1 - 0.7 = 0.4$ kg CO₂e/kg ระยะทางไกลสุด $0.4 \\div 0.002 =$ **200 km** ไกลกว่านี้การขนส่งจะกินส่วนที่ประหยัดจนหมด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.industry.life-cycle-assessment.p014
    topics: [chemistry.industry.life-cycle-assessment]
    difficulty: 5
    type: numeric
    stem: "รถยนต์ไฟฟ้า (EV) ปล่อยแก๊สเรือนกระจกขั้นผลิตรวมแบตเตอรี่ 11,000 kg CO₂e และขั้นใช้งาน 0.07 kg CO₂e ต่อกิโลเมตร (คิดจากไฟฟ้าที่ใช้ชาร์จ) รถยนต์น้ำมันปล่อยขั้นผลิต 7,000 kg CO₂e และขั้นใช้งาน 0.15 kg CO₂e ต่อกิโลเมตร (ข้อมูลสมมติ) ต้องขับกี่กิโลเมตร EV จึงปล่อยรวมเท่ากับรถน้ำมัน"
    answer: { value: 50000, unit: km, tolerance: 100 }
    misconceptions:
      - { match: 26667, feedback: "หาร 4,000 ด้วย 0.15 แต่ EV ก็ปล่อยตอนใช้งานด้วย ต้องหารด้วยผลต่าง 0.15 − 0.07" }
      - { match: 57143, feedback: "หาร 4,000 ด้วย 0.07 ต้องหารด้วยผลต่างของการปล่อยต่อกิโลเมตร" }
    hints:
      - "ผลรวม = ขั้นผลิต + (ต่อกิโลเมตร × ระยะทาง)"
      - "ตั้งสมการ 11000 + 0.07d = 7000 + 0.15d"
    solution: "$11000 + 0.07d = 7000 + 0.15d$ ได้ $0.08d = 4000$ และ $d =$ **50,000 km** ขับมากกว่านี้ EV ปล่อยรวมน้อยกว่า ค่านี้ขึ้นกับว่าไฟฟ้าผลิตจากแหล่งใด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.industry.life-cycle-assessment.p015
    topics: [chemistry.industry.life-cycle-assessment]
    difficulty: 3
    type: mcq
    stem: "ธนาคารขยะของโรงเรียนขอให้นักเรียนแกะฉลาก แยกฝา และล้างขวด PET ก่อนนำมาฝาก เพราะเหตุใด"
    choices:
      - { id: a, text: "ฝาและฉลากเป็นพลาสติกต่างชนิดกับตัวขวด และสิ่งสกปรกทำให้พลาสติกรีไซเคิลคุณภาพต่ำ", correct: true, feedback: "ถูก ขวดที่สะอาดและเป็นพลาสติกชนิดเดียวมีมูลค่าสูงกว่า" }
      - { id: b, text: "เพื่อให้ขวดเบาลง จะได้ขายได้ราคาน้อยลง", feedback: "จุดประสงค์คือให้วัสดุบริสุทธิ์ ซึ่งมักทำให้ขายได้ราคาดีขึ้น" }
      - { id: c, text: "เพราะ PET เป็นเทอร์โมเซต ต้องแยกออกจากเทอร์โมพลาสติก", feedback: "PET เป็นเทอร์โมพลาสติกที่หลอมใหม่ได้" }
    hints:
      - "ฝาขวดมักทำจาก PP หรือ HDPE"
      - "วัสดุที่บริสุทธิ์มีผลต่อคุณภาพของการรีไซเคิลอย่างไร"
    solution: "ฝาและฉลากเป็น **พลาสติกต่างชนิด** และคราบสกปรกเป็นสิ่งปนเปื้อน การแยกและล้างทำให้ได้ PET บริสุทธิ์ที่แปรเป็นเส้นใยหรือขวดใหม่ได้ดี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.industry.life-cycle-assessment.p016
