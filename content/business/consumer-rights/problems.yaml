problems:
  - id: business.econ.consumer-rights.p001
    topics: [business.econ.consumer-rights]
    difficulty: 1
    type: match
    stem: "จับคู่เหตุการณ์กับปัจจัยที่มีผลต่อการเลือกซื้อ"
    pairs:
      - { left: "ช่วงสงกรานต์ ร้านในขอนแก่นขายปืนฉีดน้ำได้มากกว่าปกติหลายเท่า", right: "ฤดูกาลและเทศกาล" }
      - { left: "ต้นได้ค่าขนมเพิ่ม จึงซื้อนมกล่องใหญ่ขึ้น", right: "รายได้และเงินที่มี" }
      - { left: "ฝนเห็นยูทูบเบอร์ที่ชอบรีวิวลิปสติก แล้วอยากได้ทันที", right: "โฆษณาและคนที่ชื่นชอบ" }
      - { left: "ร้านหน้าโรงเรียนขึ้นราคาน้ำแดง นักเรียนจึงซื้อน้ำเปล่าแทน", right: "ราคา" }
    hints:
      - "ถามตัวเองว่าอะไรทำให้คนในเหตุการณ์ซื้อมากขึ้นหรือน้อยลง"
      - "ดูคำสำคัญ เช่น สงกรานต์ ค่าขนม ราคา รีวิว"
    solution: "ปืนฉีดน้ำช่วงสงกรานต์ → ฤดูกาลและเทศกาล · ได้ค่าขนมเพิ่ม → รายได้ · ยูทูบเบอร์รีวิว → โฆษณาและคนที่ชื่นชอบ · น้ำแดงขึ้นราคาจึงซื้อน้ำเปล่า → ราคา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.consumer-rights.p002
    topics: [business.econ.consumer-rights]
    difficulty: 1
    type: mcq
    stem: "เก่งพลิกดูวันหมดอายุและส่วนประกอบบนฉลากขนมก่อนซื้อ เก่งกำลังใช้สิทธิผู้บริโภคข้อใด"
    choices:
      - { id: a, text: "สิทธิที่จะได้รับข่าวสารและคำพรรณนาคุณภาพที่ถูกต้องและเพียงพอ", correct: true }
      - { id: b, text: "สิทธิที่จะได้รับความปลอดภัยจากการใช้สินค้า", feedback: "ความปลอดภัยหมายถึงสินค้าต้องไม่เป็นอันตราย ส่วนการได้รู้ข้อมูลบนฉลากคือสิทธิได้รับข่าวสาร" }
      - { id: c, text: "สิทธิที่จะได้รับการพิจารณาและชดเชยความเสียหาย", feedback: "ใช้เมื่อถูกละเมิดสิทธิแล้ว เก่งยังไม่ได้รับความเสียหาย" }
      - { id: d, text: "สิทธิที่จะได้รับความเป็นธรรมในการทำสัญญา", feedback: "ซื้อขนมไม่ได้ทำสัญญาเป็นหนังสือ และการอ่านฉลากเป็นเรื่องข้อมูลสินค้า" }
    hints:
      - "ฉลากให้อะไรแก่ผู้บริโภค"
      - "สิทธิข้อแรกตาม พ.ร.บ.คุ้มครองผู้บริโภค"
    solution: "ฉลากคือข้อมูลของสินค้า การอ่านฉลากจึงเป็นการใช้ **สิทธิที่จะได้รับข่าวสารและคำพรรณนาคุณภาพที่ถูกต้องและเพียงพอ**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.consumer-rights.p003
    topics: [business.econ.consumer-rights]
    difficulty: 2
    type: match
    stem: "จับคู่เหตุการณ์กับสิทธิของผู้บริโภคที่ถูกละเมิด"
    pairs:
      - { left: "โฆษณาว่าดื่มแล้วผอมใน 3 วัน แต่ไม่จริง", right: "สิทธิได้รับข่าวสารที่ถูกต้อง" }
      - { left: "ปลั๊กพ่วงไม่ได้มาตรฐาน ใช้ตามคู่มือแล้วยังไหม้", right: "สิทธิได้รับความปลอดภัย" }
      - { left: "พนักงานบอกว่าถ้าไม่ซื้อประกันพ่วงจะไม่ขายโทรศัพท์ให้", right: "สิทธิมีอิสระในการเลือก" }
      - { left: "สัญญาเขียนว่าร้านยึดเงินมัดจำทั้งหมดได้แม้ร้านส่งของช้าเอง", right: "สิทธิได้รับความเป็นธรรมในการทำสัญญา" }
    hints:
      - "ดูว่าปัญหาอยู่ที่ข้อมูล การบังคับ ความปลอดภัย หรือสัญญา"
      - "สิทธิได้รับการชดเชยใช้หลังจากสิทธิข้ออื่นถูกละเมิดแล้ว ในข้อนี้ไม่ได้ใช้"
    solution: "โฆษณาว่าลดน้ำหนักได้ใน 3 วันแต่ไม่จริง → ข่าวสาร · ปลั๊กพ่วงไม่มีมาตรฐานจนไหม้ → ความปลอดภัย · บังคับซื้อประกันพ่วง → เลือกอย่างอิสระ · สัญญายึดเงินมัดจำทั้งหมดแม้ร้านผิดเอง → เป็นธรรมในสัญญา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.consumer-rights.p004
    topics: [business.econ.consumer-rights]
    difficulty: 2
    type: numeric
    stem: "น้ำยาล้างจานยี่ห้อเดียวกัน ขวดเล็ก $550$ มล. ราคา $35$ บาท ขวดใหญ่ $1{,}500$ มล. ราคา $89$ บาท ขวดใหญ่ถูกกว่าขวดเล็กกี่บาทต่อ $100$ มล. (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 0.43, tolerance: 0.01, unit: "บาท" }
    hints:
      - "หาราคาต่อ $100$ มล. ของแต่ละขวด: ราคา $\\div$ (ปริมาณ $\\div 100$)"
      - "นำราคาต่อ $100$ มล. ของขวดเล็กลบขวดใหญ่"
    misconceptions:
      - { match: 54, feedback: "เทียบราคาทั้งขวด ($89 - 35$) ซึ่งปริมาณไม่เท่ากัน ต้องคิดราคาต่อหน่วยก่อน" }
    solution: "ขวดเล็ก $35 \\div 5.5 \\approx 6.36$ บาท ขวดใหญ่ $89 \\div 15 \\approx 5.93$ บาท ต่อ $100$ มล. ขวดใหญ่ถูกกว่า $\\approx 0.43$ บาทต่อ $100$ มล."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.consumer-rights.p005
    topics: [business.econ.consumer-rights]
    difficulty: 2
    type: mcq
    stem: "ข้อใดแสดงพฤติกรรมของ **ผู้บริโภคที่รู้เท่าทัน** (เลือกได้มากกว่าหนึ่งข้อ)"
    multiple: true
    choices:
      - { id: a, text: "อ่านรีวิวจากหลายแหล่งก่อนซื้อหูฟัง", correct: true }
      - { id: b, text: "เทียบราคาต่อกรัมของข้าวสารถุง 5 กก. กับถุง 15 กก.", correct: true }
      - { id: c, text: "รีบกดซื้อเพราะไลฟ์สดบอกว่า \"เหลือ 3 ชิ้นสุดท้าย\"", feedback: "คำเร่งให้ตัดสินใจเร็วเป็นเทคนิคการขาย ควรคิดว่าจำเป็นหรือไม่ก่อน" }
      - { id: d, text: "แคปหน้าจอโฆษณาและเก็บสลิปโอนเงินไว้", correct: true }
      - { id: "e", text: "ทิ้งใบเสร็จทันทีเพราะไม่อยากให้กระเป๋ารก", feedback: "ใบเสร็จเป็นหลักฐานสำคัญเมื่อต้องเปลี่ยนคืนหรือร้องเรียน" }
    hints:
      - "ผู้บริโภคที่รู้เท่าทันซื้ออย่างมีเหตุผลและมีข้อมูล"
      - "ดูว่าข้อใดตัดสินใจเพราะถูกเร่ง หรือข้อใดทิ้งหลักฐาน"
    solution: "ข้อ ก ข และ ง ถูก เพราะหาข้อมูล เทียบราคา และเก็บหลักฐาน ข้อ ค ตัดสินใจเพราะโฆษณาเร่ง ข้อ จ ทิ้งหลักฐานที่ต้องใช้เมื่อมีปัญหา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.consumer-rights.p006
    topics: [business.econ.consumer-rights]
    difficulty: 2
    type: numeric
    stem: "ร้านเครื่องเขียนในลำปางขายปากกาด้ามละ $15$ บาท จัดโปร \"ซื้อ 3 แถม 1\" ถ้าซื้อตามโปร ปากกาตกด้ามละกี่บาท (ตอบเป็นบาท)"
    answer: { value: 11.25, tolerance: 0.01, unit: "บาท" }
    hints:
      - "จ่ายเงินกี่ด้าม และได้ปากกากี่ด้าม"
      - "ราคาต่อด้าม = เงินที่จ่าย ÷ จำนวนด้ามที่ได้"
    misconceptions:
      - { match: 15, feedback: "หาร $45$ ด้วย $3$ ลืมนับปากกาที่แถมอีก $1$ ด้าม" }
      - { match: 3.75, feedback: "นั่นคือส่วนที่ลดได้ต่อด้าม ($15 - 11.25$) ไม่ใช่ราคาต่อด้าม" }
    solution: "จ่าย $3 \\times 15 = 45$ บาท ได้ $4$ ด้าม ราคาต่อด้าม $= 45 \\div 4 = 11.25$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.consumer-rights.p007
    topics: [business.econ.consumer-rights]
    difficulty: 3
    type: mcq
    stem: "ภาพคือฉลากขนมทองม้วนของกลุ่มแม่บ้าน (สมมติ) ฉลากนี้ **ขาดข้อมูลสำคัญ** ข้อใดที่ผู้บริโภคควรได้รู้ก่อนซื้ออาหาร"
    figure:
      src: snack-label.svg
      alt: "ฉลากขนมทองม้วนกรอบ สูตรมะพร้าวอ่อน ของกลุ่มแม่บ้านบ้านดอนแก้ว (สมมติ) บอกส่วนประกอบ แป้งข้าวเจ้า 40% กะทิ 30% น้ำตาล 25% ไข่ไก่ งาดำ เกลือ น้ำหนักสุทธิ 150 กรัม ผู้ผลิตและที่อยู่ จ.ลำพูน เลขสารบบอาหาร ราคา 45 บาท และคำแนะนำให้เก็บในที่แห้ง"
    choices:
      - { id: a, text: "วันผลิตและวันหมดอายุ (ควรบริโภคก่อน)", correct: true }
      - { id: b, text: "น้ำหนักสุทธิ", feedback: "ฉลากบอกน้ำหนักสุทธิ 150 กรัมแล้ว" }
      - { id: c, text: "ส่วนประกอบ", feedback: "ฉลากบอกส่วนประกอบพร้อมร้อยละแล้ว" }
      - { id: d, text: "ชื่อและที่อยู่ผู้ผลิต", feedback: "ฉลากบอกชื่อกลุ่มแม่บ้านและอำเภอ จังหวัดแล้ว" }
    hints:
      - "ไล่ดูทีละรายการที่ฉลากอาหารควรมี: ชื่อ ส่วนประกอบ ปริมาณ ผู้ผลิต เลขสารบบ ราคา และวัน"
      - "ขนมเก็บได้นานแค่ไหน ดูจากข้อมูลใด"
    solution: "ฉลากมีชื่อ ส่วนประกอบ น้ำหนักสุทธิ ผู้ผลิต เลขสารบบอาหาร และราคาแล้ว แต่ **ไม่มีวันผลิตและวันหมดอายุ (หรือควรบริโภคก่อน)** ผู้บริโภคจึงไม่รู้ว่าขนมยังสดอยู่หรือไม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.consumer-rights.p008
    topics: [business.econ.consumer-rights]
    difficulty: 3
    type: numeric
    stem: "แม่สงสัยว่าน้ำตาลทรายถุงละ $1$ กก. ร้านหนึ่ง (สมมติ) ไม่ครบ จึงชั่ง 5 ถุงได้ $940,\\ 950,\\ 1{,}000,\\ 930,\\ 960$ กรัม โดยเฉลี่ยน้ำตาลขาดไปถุงละกี่กรัม (ตอบเป็นกรัม)"
    answer: { value: 44, unit: "กรัม" }
    hints:
      - "หาน้ำหนักเฉลี่ยของ 5 ถุงก่อน"
      - "$1$ กก. $= 1{,}000$ กรัม ลบด้วยค่าเฉลี่ย"
    misconceptions:
      - { match: 956, feedback: "นั่นคือน้ำหนักเฉลี่ย ต้องนำไปลบจาก $1{,}000$ กรัม" }
      - { match: 220, feedback: "นั่นคือส่วนที่ขาดรวม 5 ถุง ต้องหารด้วย 5" }
    solution: "ผลรวม $= 4{,}780$ กรัม เฉลี่ย $= 4{,}780 \\div 5 = 956$ กรัม ขาดไปเฉลี่ย $1{,}000 - 956 = 44$ กรัมต่อถุง เป็นการให้ข้อมูลปริมาณที่ไม่ถูกต้อง แม่ควรเก็บถุงและใบเสร็จไว้เป็นหลักฐาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.consumer-rights.p009
    topics: [business.econ.consumer-rights]
    difficulty: 3
    type: order
    stem: "น้องบีซื้อหม้อหุงข้าวทางออนไลน์ เปิดกล่องแล้วพบว่าฝาแตก เรียงขั้นตอนที่ควรทำ"
    items:
      - "ถ่ายรูปสินค้าและกล่อง เก็บสลิปและแชตกับร้าน"
      - "แจ้งร้านพร้อมรูป ขอเปลี่ยนสินค้าหรือคืนเงิน"
      - "ถ้าร้านไม่แก้ไข ร้องเรียน สคบ. พร้อมแนบหลักฐาน"
      - "ติดตามผลการไกล่เกลี่ยหรือการดำเนินการ"
    hints:
      - "เริ่มจากสิ่งที่ต้องมีเมื่อจะเรียกร้องสิทธิ"
      - "ให้โอกาสผู้ขายแก้ไขก่อนร้องเรียนหน่วยงาน"
    solution: "ถ่ายรูปและเก็บหลักฐาน → แจ้งร้านขอเปลี่ยนหรือคืนเงิน → ถ้าร้านไม่แก้ไข ร้องเรียน สคบ. (1166 หรือออนไลน์) พร้อมหลักฐาน → ติดตามผลการไกล่เกลี่ย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.consumer-rights.p010
    topics: [business.econ.consumer-rights]
    difficulty: 3
    type: numeric
    stem: "พัดลมตัวหนึ่งราคาเงินสด $1{,}290$ บาท หรือผ่อน $10$ เดือน เดือนละ $159$ บาท ถ้าผ่อน จะจ่ายมากกว่าซื้อเงินสดกี่บาท (ตอบเป็นบาท)"
    answer: { value: 300, unit: "บาท" }
    hints:
      - "หาเงินที่จ่ายรวมเมื่อผ่อนครบ $10$ งวด"
      - "นำไปลบราคาเงินสด"
    misconceptions:
      - { match: 1590, feedback: "นั่นคือเงินที่จ่ายรวม ยังไม่ได้ลบราคาเงินสด" }
      - { match: 30, feedback: "นั่นคือส่วนต่างต่องวด ($159 - 129$) ยังต้องคูณ $10$ งวด" }
    solution: "ผ่อนรวม $159 \\times 10 = 1{,}590$ บาท มากกว่าเงินสด $1{,}590 - 1{,}290 = 300$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.consumer-rights.p011
    topics: [business.econ.consumer-rights]
    difficulty: 3
    type: match
    stem: "จับคู่ปัญหากับหน่วยงานที่ควรร้องเรียน"
    pairs:
      - { left: "ครีมทาหน้าไม่มีเลขจดแจ้ง ใช้แล้วหน้าแพ้", right: "สำนักงานคณะกรรมการอาหารและยา (อย.)" }
      - { left: "ธนาคารเก็บค่าธรรมเนียมบัตรที่ไม่เคยแจ้งลูกค้า", right: "ศูนย์คุ้มครองผู้ใช้บริการทางการเงิน ธปท. (1213)" }
      - { left: "ร้านเฟอร์นิเจอร์รับเงินแล้วไม่ส่งของตามสัญญา", right: "สำนักงานคณะกรรมการคุ้มครองผู้บริโภค (สคบ. 1166)" }
    hints:
      - "อาหาร ยา และเครื่องสำอางมีหน่วยงานเฉพาะ"
      - "บริการทางการเงินอยู่ในความดูแลของธนาคารกลาง"
    solution: "ครีมไม่มีเลขจดแจ้งทำให้แพ้ → อย. · ธนาคารเก็บค่าธรรมเนียมบัตรที่ไม่เคยแจ้ง → ศูนย์คุ้มครองผู้ใช้บริการทางการเงิน ธปท. (1213) · ร้านเฟอร์นิเจอร์ไม่ส่งของตามสัญญา → สคบ. (1166)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.consumer-rights.p012
    topics: [business.econ.consumer-rights]
    difficulty: 4
    type: numeric
    stem: "แชมพูยี่ห้อเดียวกันมีสามแบบ: ขวด $400$ มล. ราคา $129$ บาท · แพ็กคู่ $2 \\times 400$ มล. ราคา $239$ บาท · ขวด $900$ มล. ราคา $279$ บาท ลด $15\\%$ แบบที่ถูกที่สุดราคากี่บาทต่อ $100$ มล. (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 26.35, tolerance: 0.01, unit: "บาท" }
    hints:
      - "หาราคาหลังลดของขวด $900$ มล. ก่อน: $279 \\times 0.85$"
      - "หาราคาต่อ $100$ มล. ทั้งสามแบบแล้วเลือกค่าน้อยสุด"
    misconceptions:
      - { match: 31, feedback: "ลืมหักส่วนลด $15\\%$ ของขวด $900$ มล." }
      - { match: 29.88, feedback: "นั่นคือราคาของแพ็กคู่ ยังไม่ได้คิดส่วนลดของขวดใหญ่" }
    solution: "ขวดเดี่ยว $129 \\div 4 = 32.25$ · แพ็กคู่ $239 \\div 8 \\approx 29.88$ · ขวดใหญ่หลังลด $279 \\times 0.85 = 237.15$ บาท $\\div 9 \\approx 26.35$ บาทต่อ $100$ มล. ขวด $900$ มล. ถูกที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.consumer-rights.p013
    topics: [business.econ.consumer-rights]
    difficulty: 4
    type: numeric
    stem: "กระเป๋าใบหนึ่งราคา $2{,}000$ บาท ร้าน ก ลด $30\\%$ แล้วลดเพิ่มอีก $10\\%$ ที่หน้าแคชเชียร์ ร้าน ข ลด $40\\%$ ทีเดียว ร้าน ก ขายกระเป๋าใบนี้กี่บาท (ตอบเป็นบาท)"
    answer: { value: 1260, unit: "บาท" }
    hints:
      - "ส่วนลดที่สองคิดจากราคาที่ลดครั้งแรกแล้ว"
      - "$2{,}000 \\times 0.70 \\times 0.90$"
    misconceptions:
      - { match: 1200, feedback: "บวกส่วนลดเป็น $40\\%$ แต่ส่วนลดที่สองคิดจากราคาที่ลดแล้ว" }
      - { match: 1400, feedback: "คิดแค่ส่วนลดแรก ยังไม่ได้ลดอีก $10\\%$" }
    solution: "ร้าน ก: $2{,}000 \\times 0.70 = 1{,}400$ บาท แล้ว $1{,}400 \\times 0.90 = 1{,}260$ บาท ส่วนร้าน ข: $2{,}000 \\times 0.60 = 1{,}200$ บาท ร้าน ข ถูกกว่า $60$ บาท ลด 30% แล้วลด 10% จึงเท่ากับลด $37\\%$ ไม่ใช่ $40\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.consumer-rights.p014
    topics: [business.econ.consumer-rights]
    difficulty: 4
    type: mcq
    stem: "หมู่บ้านแห่งหนึ่งนิยมซื้อโทรศัพท์รุ่นใหม่ทุกปีแบบผ่อน และสั่งของใช้นำเข้าทางออนไลน์ ข้อใด **วิเคราะห์ผลต่อเศรษฐกิจของชุมชน** ได้ถูกต้อง (เลือกได้มากกว่าหนึ่งข้อ)"
    multiple: true
    choices:
      - { id: a, text: "หนี้ครัวเรือนเพิ่ม และเงินออมสำหรับยามฉุกเฉินลดลง", correct: true }
      - { id: b, text: "เงินไหลออกนอกชุมชน ร้านค้าและผู้ผลิตในชุมชนมีรายได้น้อยลง", correct: true }
      - { id: c, text: "ถ้าคนหันมาซื้อสินค้าคุณภาพดีจากผู้ผลิตในท้องถิ่น เงินจะหมุนอยู่ในชุมชนมากขึ้น", correct: true }
      - { id: d, text: "ชุมชนจะมีเงินออมมากขึ้นเพราะคนใช้จ่ายมาก", feedback: "รายได้เท่าเดิมแต่ใช้จ่ายมากขึ้น เงินออมย่อมลดลง" }
    hints:
      - "คิดผลต่อเงินออมและหนี้ของครัวเรือน"
      - "เงินที่จ่ายไปไหลไปที่ใคร อยู่ในชุมชนหรือออกนอกชุมชน"
    solution: "ข้อ ก ข และ ค ถูก การผ่อนของเกินจำเป็นทำให้หนี้เพิ่มและเงินออมลด เงินที่ซื้อของจากนอกชุมชนไม่หมุนกลับมาเป็นรายได้ของผู้ผลิตในชุมชน ข้อ ง ผิดเพราะการใช้จ่ายมากขึ้นไม่ได้ทำให้ชุมชนมีเงินออมมากขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.consumer-rights.p015
    topics: [business.econ.consumer-rights]
    difficulty: 4
    type: mcq
    stem: "ร้านติดป้ายว่า \"สินค้าซื้อแล้ว ไม่รับเปลี่ยนคืนทุกกรณี\" ลูกค้าซื้อเครื่องปั่นน้ำผลไม้กลับบ้าน เปิดใช้ครั้งแรกตามคู่มือแล้วมอเตอร์ไหม้ ข้อใดถูกต้องที่สุด"
    choices:
      - { id: a, text: "ลูกค้ายังมีสิทธิเรียกร้องให้ร้านแก้ไขหรือชดเชย ควรเก็บหลักฐานและแจ้งร้าน ถ้าไม่ได้ผลให้ร้องเรียน สคบ.", correct: true }
      - { id: b, text: "ลูกค้าเรียกร้องอะไรไม่ได้ เพราะร้านติดป้ายไว้แล้ว", feedback: "ป้ายของร้านไม่ได้ลบสิทธิของผู้บริโภคตามกฎหมาย" }
      - { id: c, text: "ลูกค้าต้องไปฟ้องศาลทันที ห้ามติดต่อร้านก่อน", feedback: "ควรให้ร้านแก้ไขก่อน การฟ้องศาลเป็นทางเลือกท้าย ๆ" }
      - { id: d, text: "เป็นความผิดของลูกค้าที่ไม่ตรวจมอเตอร์ก่อนซื้อ", feedback: "ลูกค้าใช้ตามคู่มือแล้ว ผู้บริโภคตรวจภายในมอเตอร์เองไม่ได้" }
    hints:
      - "สินค้าใช้ตามคำแนะนำแล้วเกิดอันตราย เกี่ยวกับสิทธิข้อใด"
      - "ป้ายของร้านลบสิทธิตามกฎหมายของผู้บริโภคได้หรือไม่"
    solution: "สินค้าที่ใช้ตามคำแนะนำแล้วชำรุดจนอาจเป็นอันตรายเกี่ยวกับ **สิทธิได้รับความปลอดภัย** และเมื่อเสียหายผู้บริโภคมี **สิทธิได้รับการพิจารณาและชดเชย** ป้ายของร้านไม่ได้ทำให้สิทธิตามกฎหมายหายไป ลูกค้าควรเก็บหลักฐาน แจ้งร้าน และร้องเรียน สคบ. ถ้าร้านไม่แก้ไข"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.consumer-rights.p016
    topics: [business.econ.consumer-rights]
    difficulty: 5
    type: numeric
    stem: "แอปหนึ่งให้ \"ซื้อก่อนจ่ายทีหลัง\" รองเท้าราคา $3{,}000$ บาท แบ่งจ่าย $3$ งวดเท่ากัน ไม่มีดอกเบี้ย แต่ถ้าจ่ายงวดใดช้าเสียค่าปรับงวดละ $150$ บาท นุ่นจ่ายช้า $2$ งวด นุ่นจ่ายรวมมากกว่าราคารองเท้ากี่เปอร์เซ็นต์ (ตอบเป็น %)"
    answer: { value: 10, tolerance: 0.1, unit: "%" }
    hints:
      - "หาเงินที่นุ่นจ่ายรวมทั้งค่าปรับ"
      - "ร้อยละที่จ่ายเกิน $= \\dfrac{\\text{ส่วนที่จ่ายเกิน}}{3{,}000} \\times 100$"
    misconceptions:
      - { match: 5, feedback: "นับค่าปรับแค่งวดเดียว นุ่นจ่ายช้า 2 งวด" }
      - { match: 300, feedback: "นั่นคือส่วนที่จ่ายเกินเป็นบาท โจทย์ถามเป็นร้อยละ" }
    solution: "จ่ายรวม $3{,}000 + 2 \\times 150 = 3{,}300$ บาท เกิน $300$ บาท คิดเป็น $\\dfrac{300}{3{,}000} \\times 100 = 10\\%$ \"ไม่มีดอกเบี้ย\" จึงไม่ได้แปลว่าไม่มีค่าใช้จ่ายเพิ่ม ต้องอ่านเงื่อนไขค่าปรับก่อนตกลง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.consumer-rights.p017
    topics: [business.econ.consumer-rights]
    difficulty: 5
    type: mcq
    stem: "ก่อนเซ็นสัญญาเช่าซื้อรถจักรยานยนต์ ข้อใดเป็น **ความรับผิดชอบของผู้ประกอบธุรกิจ** (เลือกได้มากกว่าหนึ่งข้อ)"
    multiple: true
    choices:
      - { id: a, text: "แจ้งค่างวด ดอกเบี้ย ค่าธรรมเนียม และค่าปรับให้ครบและตรงจริง", correct: true }
      - { id: b, text: "ไม่ใส่ข้อสัญญาที่เอาเปรียบผู้ซื้อเกินสมควร", correct: true }
      - { id: c, text: "อ่านสัญญาทุกข้อก่อนลงชื่อ และถามจนเข้าใจ", feedback: "เป็นหน้าที่ของผู้บริโภค แม้จะสำคัญมากก็ตาม" }
      - { id: d, text: "คำนวณว่ารายได้พอผ่อนค่างวดทุกเดือนหรือไม่", feedback: "เป็นหน้าที่ของผู้ซื้อในการวางแผนการเงินของตนเอง" }
    hints:
      - "แยกสิ่งที่ผู้ขายต้องทำกับสิ่งที่ผู้ซื้อควรทำ"
      - "สิทธิของผู้บริโภคข้อหนึ่งคู่กับหน้าที่ของผู้ขายข้อหนึ่ง"
    solution: "ผู้ประกอบธุรกิจต้องบอกข้อมูลค่างวด ดอกเบี้ย และค่าธรรมเนียมให้ครบและตรงจริง (ข้อ ก) และไม่ใส่ข้อสัญญาที่เอาเปรียบ (ข้อ ข) ส่วนการอ่านสัญญาให้เข้าใจและการประเมินว่าผ่อนไหว (ข้อ ค ง) เป็นหน้าที่ของผู้บริโภค"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.consumer-rights.p018
    topics: [business.econ.consumer-rights]
    difficulty: 5
    type: numeric
    stem: "หมู่บ้านในกาฬสินธุ์มี $200$ ครัวเรือน แต่ละครัวเรือนซื้อน้ำดื่มบรรจุขวดจากนอกชุมชนเดือนละ $450$ บาท ถ้าหันมาซื้อจากโรงน้ำดื่มของชุมชน (สมมติ) แทน $60\\%$ ของเงินจำนวนนี้ เงินที่หมุนอยู่ในชุมชนจะเพิ่มขึ้นปีละกี่บาท (ตอบเป็นบาท)"
    answer: { value: 648000, unit: "บาท" }
    hints:
      - "หาเงินที่ทั้งหมู่บ้านจ่ายค่าน้ำดื่มต่อเดือน"
      - "คิด $60\\%$ แล้วคูณ $12$ เดือน"
    misconceptions:
      - { match: 54000, feedback: "นั่นคือต่อเดือน โจทย์ถามต่อปี" }
      - { match: 1080000, feedback: "ลืมคิดเฉพาะ $60\\%$ ที่ย้ายมาซื้อในชุมชน" }
    solution: "ทั้งหมู่บ้านจ่าย $200 \\times 450 = 90{,}000$ บาทต่อเดือน ส่วนที่ย้ายมาซื้อในชุมชน $90{,}000 \\times 0.6 = 54{,}000$ บาทต่อเดือน ต่อปี $54{,}000 \\times 12 = 648{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true
