    difficulty: 5
    type: mcq
    stem: วิศวกรพบจากการตรวจภายในว่าอาคารที่ตนรับรองไปแล้วมีโอกาสพังในฤดูน้ำหลาก ลูกค้าขอให้เก็บข้อมูลเป็นความลับและไม่ยอมแก้ไข ข้อใดเป็นการดำเนินการที่เหมาะสมที่สุด
    choices:
      - id: a
        text: เก็บความลับไว้ทั้งหมด เพราะเป็นข้อมูลของลูกค้า
        feedback: ความลับทางการค้าไม่ควรใช้ปิดบังอันตรายต่อผู้คน
      - id: b
        text: แจ้งลูกค้าเป็นลายลักษณ์อักษรและขอให้แก้ไข หากยังไม่แก้ไขให้เปิดเผยเฉพาะข้อมูลความปลอดภัยต่อหน่วยงานที่มีอำนาจ
        correct: true
      - id: c
        text: ประกาศข้อมูลทั้งหมดในสื่อสังคมออนไลน์ทันทีโดยไม่แจ้งใคร
        feedback: การเผยแพร่ที่ไม่ตรวจสอบและไม่ส่งถึงผู้มีอำนาจอาจสร้างความตื่นตระหนกและทำให้การแก้ไขล่าช้า
      - id: d
        text: ขอส่วนแบ่งจากลูกค้าเพื่อแลกกับการเก็บข้อมูลเป็นความลับ
        feedback: การนำข้อมูลความปลอดภัยไปแลกผลประโยชน์ส่วนตัวเป็นการละเมิดจรรยาบรรณโดยตรง
    hints:
      - ความลับทางการค้ามีขอบเขต แต่ความปลอดภัยของผู้คนไม่มีข้อยกเว้นในการพิจารณา
      - เปิดเผยเท่าที่จำเป็นต่อผู้มีอำนาจที่รับผิดชอบความปลอดภัย และแจ้งคู่กรณีในขั้นตอนที่เหมาะสม
    solution: วิศวกรต้องแจ้งลูกค้าก่อนเป็นลายลักษณ์อักษรและขอให้แก้ไข หากยังไม่แก้ไขให้เปิดเผยเฉพาะข้อมูลที่เกี่ยวกับความปลอดภัยต่อหน่วยงานที่มีอำนาจตามที่กฎหมายเปิดช่องไว้ ไม่ควรเก็บข้อมูลอันตรายไว้เงียบ ๆ และไม่ควรนำข้อมูลไปใช้เพื่อผลประโยชน์ส่วนตัว
