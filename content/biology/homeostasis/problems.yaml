      - { id: b, text: "ร่างกายขาดน้ำ ควรดื่มน้ำเปล่าเพิ่มอีกมาก ๆ", feedback: "นักวิ่งดื่มน้ำมากอยู่แล้ว การดื่มน้ำเปล่าเพิ่มจะทำให้โซเดียมในเลือดเจือจางลงอีก" }
      - { id: c, text: "ADH หลั่งมากเกินไปเพราะวิ่ง ควรกลั้นปัสสาวะไว้", feedback: "การกลั้นปัสสาวะไม่ได้แก้สมดุลเกลือแร่" }
      - { id: d, text: "เลือดเป็นเบสเพราะหายใจหอบ ควรหายใจในถุง", feedback: "อาการและบริบทเข้ากับโซเดียมในเลือดต่ำมากกว่า" }
    hints:
