<text x="380.0" y="285.0" text-anchor="middle" fill="#15211e" font-size="13">I ตามหลัง V อยู่ 90°</text>
<text x="380.0" y="310.0" text-anchor="middle" fill="#1f5fa8" font-size="14">Z = jωL</text>
<text x="630.0" y="30.0" text-anchor="middle" fill="#15211e" font-size="15" font-weight="bold">ตัวเก็บประจุ C</text>
