<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="sans-serif" font-size="14">
  <title>แบบจำลองกล่องของ CSS width 200 px padding 10 px border 2 px และ margin 20 px ความกว้างรวม 264 px</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="880" height="340" fill="#ffffff"/>
  <rect x="96.8" y="20.0" width="686.4" height="236.4" fill="#fef3c7" stroke="#a16207" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="148.8" y="72.0" width="582.4" height="132.4" fill="#1f2937" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="154.0" y="77.2" width="572.0" height="122.0" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <rect x="180.0" y="103.2" width="520.0" height="70.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440.0" y="144.2" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">เนื้อหา (width: 200px)</text>
  <text x="104.8" y="52.0" font-size="13" text-anchor="start" fill="#a16207" font-weight="bold" xml:space="preserve">margin: 20px (ระยะห่างภายนอก ใส)</text>
  <text x="162.0" y="96.2" font-size="13" text-anchor="start" fill="#15803d" font-weight="bold" xml:space="preserve">padding: 10px (ระยะห่างภายใน)</text>
  <line x1="724.6" y1="73.0" x2="698.6" y2="56.0" stroke="#1f2937" stroke-width="1"/>
  <text x="694.6" y="56.0" font-size="13" text-anchor="end" fill="#1f2937" font-weight="bold" xml:space="preserve">border: 2px (เส้นขอบ)</text>
  <line x1="96.8" y1="290.4" x2="783.2" y2="290.4" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <text x="440.0" y="314.4" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ความกว้างรวม = 200 + 2 × (10 + 2 + 20) = 264 px</text>
</svg>
