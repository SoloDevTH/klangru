id: physics.kinematics.circular
subject: physics
title: { th: การเคลื่อนที่แบบวงกลม, en: Circular motion }
summary: วัตถุที่เคลื่อนที่เป็นวงกลมด้วยอัตราเร็วคงตัว คาบ ความถี่ อัตราเร็วเชิงมุม ความเร่งสู่ศูนย์กลาง และแรงสู่ศูนย์กลางที่ได้จากแรงตึง แรงเสียดทาน หรือแรงโน้มถ่วง
difficulty: 6
minutes: 40
prerequisites: [physics.dynamics.newton-second, math.geometry.circles]
encompasses:
  - { id: physics.dynamics.newton-second, weight: 0.4 }
  - { id: math.geometry.circles, weight: 0.3 }
  - { id: physics.kinematics.acceleration, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: velocity-acceleration.svg
    alt: "วงกลมมีจุดศูนย์กลาง O วัตถุเคลื่อนที่ทวนเข็มนาฬิกาด้วยอัตราเร็วคงตัว แสดงวัตถุสามตำแหน่ง ที่ทุกตำแหน่งลูกศรความเร็วยาวเท่ากันและสัมผัสวงกลม ลูกศรความเร่งยาวเท่ากันและชี้เข้าหา O ตั้งฉากกับความเร็ว มีเส้นประต่อจากลูกศรความเร็วตำแหน่งหนึ่ง บอกว่าถ้าเชือกขาด วัตถุจะไปตามแนวเส้นสัมผัส"
    caption: "ความเร็วสัมผัสวงกลม ความเร่งชี้เข้าหาศูนย์กลางและตั้งฉากกับความเร็วเสมอ"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: ปลายใบพัดลมเพดานเร็วแค่ไหน
    problem: "พัดลมเพดานหมุน $240$ รอบต่อนาที ปลายใบพัดอยู่ห่างแกน $0.6\\ \\mathrm{m}$ หาความถี่ อัตราเร็วเชิงมุม อัตราเร็ว และความเร่งสู่ศูนย์กลางของปลายใบพัด"
    steps:
      - text: "แปลงเป็นรอบต่อวินาที: $f = \\dfrac{240}{60} = 4\\ \\mathrm{Hz}$"
        why: "สูตรทุกตัวใช้หน่วยวินาที ต้องหาร 60 ก่อน"
      - text: "$\\omega = 2\\pi f = 2\\pi(4) = 8\\pi \\approx 25.1\\ \\mathrm{rad/s}$"
      - text: "$v = \\omega r = (8\\pi)(0.6) = 4.8\\pi \\approx 15.1\\ \\mathrm{m/s}$"
        why: "ทุกจุดบนใบพัดมี $\\omega$ เท่ากัน แต่จุดที่ไกลแกนมีอัตราเร็วมากกว่า เพราะต้องเดินทางรอบวงที่ใหญ่กว่าในเวลาเท่ากัน"
      - text: "$a_c = \\omega^2 r = (8\\pi)^2(0.6) = 38.4\\pi^2 \\approx 379\\ \\mathrm{m/s^2}$"
        why: "ใช้ค่าที่ยังไม่ปัดเศษ ถ้าใช้ $25.1$ หรือ $15.1$ ที่ปัดแล้วจะได้ $378$–$380$ ซึ่งต่างกันเล็กน้อยจากการปัดเศษ"
    answer: "$f = 4\\ \\mathrm{Hz}$, $\\omega \\approx 25.1\\ \\mathrm{rad/s}$, $v \\approx 15.1\\ \\mathrm{m/s}$ (ประมาณ $54\\ \\mathrm{km/h}$) และ $a_c \\approx 379\\ \\mathrm{m/s^2}$ จึงห้ามยื่นมือเข้าไปในพัดลมที่กำลังหมุน"
  - { type: check, problem: phy.circ.p013, prompt: "ความเร่งชี้ไปทางใด" }
  - type: worked-example
    title: อัตราเร็วสูงสุดบนทางโค้งราบ
    problem: "รถเลี้ยวโค้งบนถนนราบรัศมี $40\\ \\mathrm{m}$ สัมประสิทธิ์ความเสียดทานสถิตระหว่างยางกับถนนแห้งเป็น $0.6$ รถเลี้ยวได้เร็วที่สุดเท่าใดโดยไม่ไถล ถ้าถนนเปียกจนสัมประสิทธิ์เหลือ $0.3$ จะเป็นเท่าใด"
    figure:
      src: flat-curve-fbd.svg
      alt: "แผนภาพแรงของรถบนถนนราบ มองจากด้านหลัง น้ำหนัก mg ชี้ลง แรงปฏิกิริยาตั้งฉาก N ชี้ขึ้นยาวเท่ากับ mg แรงเสียดทาน f = μN ที่ผิวถนนชี้ไปทางซ้ายซึ่งเป็นทิศของศูนย์กลางโค้ง ยาว 0.6 เท่าของ N"
    steps:
      - text: "แนวดิ่งไม่มีความเร่ง: $N = mg$"
      - text: "แรงสู่ศูนย์กลางมีแต่แรงเสียดทาน ซึ่งสูงสุดได้ $\\mu N = \\mu mg$ ที่อัตราเร็วสูงสุด $\\mu mg = \\dfrac{mv^2}{r}$"
        why: "ถ้าต้องการแรงสู่ศูนย์กลางมากกว่าที่แรงเสียดทานให้ได้ รถจะไถลออกนอกโค้ง"
      - text: "ตัด $m$ ได้ $v_{\\max} = \\sqrt{\\mu g r} = \\sqrt{0.6 \\times 9.8 \\times 40} = \\sqrt{235.2} \\approx 15.3\\ \\mathrm{m/s}$"
        why: "มวลตัดกันหมด อัตราเร็วสูงสุดจึงไม่ขึ้นกับว่ารถหนักเท่าใด"
      - text: "ถนนเปียก: $v_{\\max} = \\sqrt{0.3 \\times 9.8 \\times 40} = \\sqrt{117.6} \\approx 10.8\\ \\mathrm{m/s}$"
    answer: "ถนนแห้งประมาณ $15.3\\ \\mathrm{m/s}$ ($55\\ \\mathrm{km/h}$) ถนนเปียกเหลือประมาณ $10.8\\ \\mathrm{m/s}$ ($39\\ \\mathrm{km/h}$) จึงต้องชะลอก่อนเข้าโค้งเมื่อฝนตก"
  - { type: check, problem: phy.circ.p016, prompt: "ลองกับทางโค้งบนภูเขา" }
  - type: interactive
    title: ความเร่งสู่ศูนย์กลางกับอัตราเร็วและรัศมี
    caption: "แกนนอนคืออัตราเร็ว v (m/s) แกนตั้งคือความเร่งสู่ศูนย์กลาง a = v²/r (m/s²) เลื่อนรัศมี r แล้วสังเกตว่าเมื่ออัตราเร็วเพิ่มเป็นสองเท่า ความเร่งเพิ่มเป็นสี่เท่า แต่เมื่อรัศมีเพิ่มเป็นสองเท่า ความเร่งลดลงครึ่งหนึ่ง ทางโค้งที่แคบจึงต้องขับช้ากว่า"
    widget:
      kind: function-plot
      functions: ["\\frac{x^2}{r}"]
      sliders:
        - { name: r, min: 1, max: 10, step: 1, value: 5, label: รัศมี (m) }
      x: [0, 10]
      y: [0, 50]
  - type: simulation
    title: แรงโน้มถ่วงและวงโคจร (PhET Gravity and Orbits)
    url: https://phet.colorado.edu/en/simulations/gravity-and-orbits
    provider: phet
    note: เปิดหน้าจอ Model เลือกระบบดวงอาทิตย์กับโลก ติ๊กแสดงเวกเตอร์แรงโน้มถ่วงและความเร็ว สังเกตว่าแรงชี้เข้าหาดวงอาทิตย์ (ศูนย์กลาง) ตลอด ส่วนความเร็วสัมผัสวงโคจร ลองปิดแรงโน้มถ่วง (Gravity off) แล้วดูว่าโลกพุ่งออกไปเป็นเส้นตรงตามแนวเส้นสัมผัส
glossary:
  - { term: คาบ (T), definition: "เวลาที่ใช้เคลื่อนที่ครบหนึ่งรอบ หน่วยวินาที" }
  - { term: ความถี่ (f), definition: "จำนวนรอบต่อหนึ่งวินาที $f = \\dfrac{1}{T}$ หน่วยเฮิรตซ์ ($\\mathrm{Hz}$)" }
  - { term: อัตราเร็วเชิงมุม (ω), definition: "มุมที่กวาดได้ต่อหนึ่งวินาที $\\omega = \\dfrac{2\\pi}{T} = 2\\pi f$ หน่วย $\\mathrm{rad/s}$" }
  - { term: ความเร่งสู่ศูนย์กลาง, definition: "ความเร่งของวัตถุที่เคลื่อนที่เป็นวงกลม ชี้เข้าหาศูนย์กลาง ขนาด $a_c = \\dfrac{v^2}{r} = \\omega^2 r$" }
  - { term: แรงสู่ศูนย์กลาง, definition: "แรงลัพธ์ที่ชี้เข้าหาศูนย์กลาง $F_c = \\dfrac{mv^2}{r}$ ไม่ใช่แรงชนิดใหม่ แต่มาจากแรงจริง เช่น แรงตึง แรงเสียดทาน แรงโน้มถ่วง" }
flashcards:
  - { front: "อัตราเร็วของวัตถุที่เคลื่อนที่เป็นวงกลมรัศมี $r$ คาบ $T$", back: "$v = \\dfrac{2\\pi r}{T} = \\omega r$" }
  - { front: "ความเร่งสู่ศูนย์กลางมีขนาดและทิศอย่างไร", back: "$a_c = \\dfrac{v^2}{r} = \\omega^2 r$ ชี้เข้าหาศูนย์กลางเสมอ" }
  - { front: "เชือกที่แกว่งก้อนหินขาด ก้อนหินจะเคลื่อนที่ไปทางใด", back: "ตามแนวเส้นสัมผัสวงกลม ณ จุดที่เชือกขาด ไม่ใช่พุ่งออกจากศูนย์กลาง" }
  - { front: "รถเลี้ยวโค้งบนถนนราบ แรงใดเป็นแรงสู่ศูนย์กลาง", back: "แรงเสียดทานระหว่างยางกับถนน" }
  - { front: "อัตราเร็วสูงสุดบนโค้งราบ และมุมเอียงของถนนยกขอบ", back: "$v_{\\max} = \\sqrt{\\mu g r}$ และ $\\tan\\theta = \\dfrac{v^2}{rg}$ ทั้งสองไม่ขึ้นกับมวลของรถ" }
