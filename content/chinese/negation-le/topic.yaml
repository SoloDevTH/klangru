id: chinese.grammar.negation-le
subject: chinese
title: { th: "ปฏิเสธด้วย 不 และ 没 กับ 了 บอกการเสร็จสิ้นหรือเปลี่ยนแปลง", en: "Negation with 不 and 没, and 了 for completion or change" }
summary: 不 ปฏิเสธนิสัย ความตั้งใจ และอนาคต 没(有) ปฏิเสธสิ่งที่ไม่ได้เกิดและการมี 别 ใช้ห้าม 了 หลังกริยาบอกการเสร็จสิ้น และ 了 ท้ายประโยคบอกการเปลี่ยนแปลง
difficulty: 3
minutes: 35
prerequisites: [chinese.grammar.pronouns-shi]
encompasses:
  - { id: chinese.grammar.pronouns-shi, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: bu-mei-chart.svg
    alt: "แผนผังสามแถว แถวแรก 不 bù: ไม่ (นิสัย ความตั้งใจ อนาคต คุณศัพท์ 是) ตัวอย่าง 我不喝咖啡 明天我不去 他不是老师 แถวสอง 没(有) méi(yǒu): ไม่ได้ ยังไม่ (เรื่องที่ไม่ได้เกิด) และไม่มี ตัวอย่าง 我昨天没去 我没有钱 แถวสาม 别 bié: อย่า ตัวอย่าง 别说话 别担心 ด้านล่าง 了 สองตำแหน่ง: หลังกริยาคือทำเสร็จแล้ว 我吃了三个包子 ปฏิเสธเป็น 我没吃包子 ไม่มี 了 และท้ายประโยคคือสภาพเปลี่ยน 下雨了 我饿了 และ 不…了 = ไม่…แล้ว เช่น 我不去了"
    caption: "เลือก 不 没 别 ตามความหมาย และ 了 มีสองตำแหน่ง"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: chinese.grammar.negation-le.p007, prompt: "ยังไม่ได้กินข้าว พูดอย่างไร" }
  - type: worked-example
    title: เปลี่ยนประโยคที่มี 了 เป็นปฏิเสธ
    problem: "เปลี่ยน 他买了一本书。 (เขาซื้อหนังสือไปหนึ่งเล่ม) เป็น \"เขาไม่ได้ซื้อหนังสือ\""
    steps:
      - text: "การซื้อไม่ได้เกิดขึ้น จึงใช้ 没 หน้ากริยา: 没买"
      - text: "ตัด 了 ออก เพราะ 了 บอกว่าเกิดแล้ว ขัดกับ 没"
        why: "没 กับ 了 ไม่อยู่ด้วยกันเมื่อพูดถึงการกระทำเดียวกัน"
      - text: "ตัดจำนวน 一本 ออกด้วย เพราะไม่ได้ซื้อเลย"
    answer: "他没买书。 Tā méi mǎi shū."
  - type: worked-example
    title: 了 ท้ายประโยคกับ 不…了
    problem: "แปล: \"หิวแล้ว แต่ไม่กินขนมแล้ว\" (零食 língshí = ขนมขบเคี้ยว)"
    steps:
      - text: "หิวแล้ว เป็นสภาพใหม่: 饿了"
      - text: "ไม่กินแล้ว เป็นการเปลี่ยนใจ ใช้ 不…了: 不吃零食了"
        why: "ไม่ใช่ 没吃 เพราะไม่ได้หมายถึงสิ่งที่ไม่ได้เกิดในอดีต"
      - text: "รวมด้วย 但是 dànshì (แต่)"
    answer: "我饿了，但是我不吃零食了。"
  - { type: check, problem: chinese.grammar.negation-le.p016, prompt: "หาประโยคที่ใช้คำปฏิเสธผิด" }
glossary:
  - { term: "不 bù", definition: "ไม่ ใช้กับนิสัย ความตั้งใจ อนาคต คุณศัพท์ และ 是 อ่าน bú หน้าเสียง 4" }
  - { term: "没 (有) méi (yǒu)", definition: "ไม่ได้ ยังไม่ ใช้กับสิ่งที่ไม่ได้เกิด และ 没有 = ไม่มี" }
  - { term: "别 bié", definition: "อย่า ใช้ห้ามหรือเตือน ใช้ 不要 แทนได้" }
  - { term: "了 le (หลังกริยา)", definition: "บอกว่าการกระทำเสร็จสิ้น เช่น 我吃了三个包子" }
  - { term: "了 le (ท้ายประโยค)", definition: "บอกสภาพใหม่หรือการเปลี่ยนแปลง เช่น 下雨了 ฝนตกแล้ว" }
flashcards:
  - { front: "ไม่ไป / ไม่ได้ไป / อย่าไป", back: "不去 / 没去 / 别去" }
  - { front: "我吃了 → ปฏิเสธ", back: "我没吃 (ตัด 了 ออก)" }
  - { front: "ฉันไม่มีเงิน", back: "我没有钱 (ไม่ใช่ 不有)" }
  - { front: "我不去了 กับ 我没去", back: "ไม่ไปแล้ว (เปลี่ยนใจ) · ไม่ได้ไป" }
