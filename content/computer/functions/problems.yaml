  - id: computer.programming.functions.p017
    topics: [computer.programming.functions]
    difficulty: 5
    type: numeric
    stem: |
      ฟังก์ชันนี้หาค่าประมาณของ $\sqrt{2}$ โดยแบ่งช่วงครึ่งไปเรื่อย ๆ `count_steps(1, 2)` คืนค่าเท่าใด

      ```python
      def f(x):
          return x * x - 2

      def count_steps(lo, hi):
          steps = 0
          while hi - lo > 0.1:
              mid = (lo + hi) / 2
              if f(mid) > 0:
                  hi = mid
              else:
                  lo = mid
              steps = steps + 1
          return steps
      ```
    answer: { value: 4, unit: รอบ }
    hints:
      - "ทุกรอบความกว้างของช่วง hi − lo ลดลงครึ่งหนึ่ง ไม่ว่าจะเลือกครึ่งไหน"
      - "เริ่มกว้าง 1 แล้วไล่ 0.5, 0.25, ... วงวนหยุดเมื่อกว้างไม่เกิน 0.1"
