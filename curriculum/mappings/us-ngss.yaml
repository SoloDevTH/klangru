# จับคู่หัวข้อที่มีอยู่กับ PE ของ NGSS เฉพาะที่บทเรียนสอนเนื้อหานั้นจริง (ระดับ HS)
framework: us-ngss
mappings:
  - topic: physics.momentum.collisions
    indicators: ["HS-PS2-2"]
    coverage: full
    note: "ใช้กฎการอนุรักษ์โมเมนตัมเชิงคณิตศาสตร์กับการชนและการระเบิดใน 1 มิติ"
  - topic: physics.dynamics.newton-second
    indicators: ["HS-PS2-1"]
    coverage: partial
    note: "สอนความสัมพันธ์ F = ma แต่ยังไม่เน้นการวิเคราะห์ข้อมูลการทดลองตาม PE"
  - topic: physics.dynamics.gravitation
    indicators: ["HS-PS2-4"]
    coverage: partial
    note: "ครอบคลุมกฎความโน้มถ่วงของนิวตัน ส่วนกฎของคูลอมบ์อยู่ใน physics.electricity.charge"
  - topic: physics.electricity.charge
    indicators: ["HS-PS2-4"]
    coverage: partial
    note: "ครอบคลุมกฎของคูลอมบ์ ส่วนกฎความโน้มถ่วงอยู่ใน physics.dynamics.gravitation"
  - topic: physics.waves.wave-basics
    indicators: ["HS-PS4-1"]
    coverage: partial
    note: "ใช้ v = fλ และอัตราเร็วคลื่นขึ้นกับตัวกลาง แต่ยังไม่เปรียบเทียบคลื่นในตัวกลางต่าง ๆ หรือคลื่นแม่เหล็กไฟฟ้า"
  - topic: chemistry.matter.periodic-table
    indicators: ["HS-PS1-1"]
    coverage: partial
    note: "ใช้ตารางธาตุและเวเลนซ์อิเล็กตรอนอธิบายแนวโน้มสมบัติของธาตุ ยังไม่ครอบคลุมการทำนายชนิดและจำนวนพันธะครบตาม PE"
