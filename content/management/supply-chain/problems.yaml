    solution: "เรือ $45{,}000 + 2{,}400{,}000 \\times 0.18 \\times 12/365 \\approx 45{,}000 + 14{,}202.74 = 59{,}202.74$ ราง $60{,}000 + 2{,}400{,}000 \\times 0.18 \\times 5/365 \\approx 60{,}000 + 5{,}917.81 = 65{,}917.81$ ทางเรือถูกกว่า $\\approx 6{,}715.07$ บาท (แต่ต้องดูความเสี่ยงต่อคุณภาพและเวลาที่ลูกค้าต้องการด้วย)"
