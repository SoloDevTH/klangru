  <text x="300.0" y="77.9" font-size="14" text-anchor="middle" fill="#1f2937" font-family="monospace" xml:space="preserve">add</text>
  <rect x="240.0" y="99.0" width="120.0" height="36.0" rx="6" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="300.0" y="121.9" font-size="14" text-anchor="middle" fill="#1f2937" font-family="monospace" xml:space="preserve">add</text>
