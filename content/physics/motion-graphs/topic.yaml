id: physics.kinematics.motion-graphs
subject: physics
title: { th: กราฟของการเคลื่อนที่, en: Motion graphs }
summary: อ่านกราฟตำแหน่ง–เวลา ความเร็ว–เวลา และความเร่ง–เวลา ใช้ความชันหาความเร็วและความเร่ง และใช้พื้นที่ใต้กราฟหาการกระจัดและความเร็วที่เปลี่ยนไป
difficulty: 4.5
minutes: 40
prerequisites: [physics.kinematics.constant-acceleration, math.functions.linear-graphs]
encompasses:
  - { id: physics.kinematics.constant-acceleration, weight: 0.4 }
  - { id: physics.kinematics.acceleration, weight: 0.3 }
  - { id: physics.kinematics.velocity, weight: 0.2 }
  - { id: math.functions.linear-graphs, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: train-three-graphs.svg
    alt: "กราฟสามกราฟเรียงจากบนลงล่าง ใช้แกนเวลา 0 ถึง 80 วินาทีร่วมกัน แบ่งเป็นช่วงเร่ง (0–20 s) ความเร็วคงตัว (20–60 s) และเบรก (60–80 s) กราฟตำแหน่ง–เวลาโค้งหงายช่วงแรก เป็นเส้นตรงช่วงกลาง และโค้งคว่ำช่วงท้าย จบที่ 1200 m กราฟความเร็ว–เวลาเป็นรูปสี่เหลี่ยมคางหมู ขึ้นจาก 0 ถึง 20 m/s คงที่ แล้วลดลงถึง 0 พื้นที่ใต้กราฟระบายสีเขียนว่า 1200 m กราฟความเร่ง–เวลาเป็นเส้นแนวนอนสามช่วง คือ 1, 0 และ −1 m/s²"
    caption: "การเคลื่อนที่เดียวกันในสามกราฟ: ความชันของกราฟบนคือค่าของกราฟกลาง และความชันของกราฟกลางคือค่าของกราฟล่าง"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: ระยะหยุดรถจากกราฟความเร็ว–เวลา
    problem: "รถยนต์วิ่งด้วยความเร็ว $15\\ \\mathrm{m/s}$ คนขับเห็นเด็กวิ่งตัดหน้า ใช้เวลาตัดสินใจ $0.8\\ \\mathrm{s}$ ก่อนเหยียบเบรก แล้วรถชะลอสม่ำเสมอจนหยุดในอีก $3\\ \\mathrm{s}$ ดังกราฟ รถวิ่งไปไกลเท่าใดตั้งแต่เห็นเด็กจนหยุด"
    figure:
      src: stopping-distance-vt.svg
      alt: "กราฟความเร็วกับเวลา ความเร็วคงที่ 15 m/s ตั้งแต่ 0 ถึง 0.8 s (พื้นที่สี่เหลี่ยมระบายสีฟ้า เขียนว่าระยะคิด) แล้วลดลงเป็นเส้นตรงถึง 0 ที่เวลา 3.8 s (พื้นที่สามเหลี่ยมระบายสีส้ม เขียนว่าระยะเบรก)"
    steps:
      - text: "ระยะคิด = พื้นที่สี่เหลี่ยม $= 15 \\times 0.8 = 12\\ \\mathrm{m}$"
        why: "ระหว่างตัดสินใจ รถยังไม่ได้เบรก จึงวิ่งด้วยความเร็วเดิม"
      - text: "ระยะเบรก = พื้นที่สามเหลี่ยม $= \\tfrac12 \\times 3 \\times 15 = 22.5\\ \\mathrm{m}$"
      - text: "ระยะหยุดรถ $= 12 + 22.5 = 34.5\\ \\mathrm{m}$ และความหน่วงขณะเบรกคือความชัน $\\dfrac{0 - 15}{3} = -5\\ \\mathrm{m/s^2}$"
    answer: "$34.5\\ \\mathrm{m}$ (ถ้าเล่นโทรศัพท์จนตัดสินใจช้าเป็น $2\\ \\mathrm{s}$ ระยะคิดจะเป็น $30\\ \\mathrm{m}$)"
  - { type: check, problem: phy.graph.p001, prompt: "เส้นแนวนอนบนกราฟตำแหน่ง–เวลาแปลว่าอะไร" }
  - type: worked-example
    title: จากกราฟความเร็วสู่กราฟตำแหน่ง
    problem: "ใช้กราฟความเร็ว–เวลาของรถไฟฟ้าในภาพแรก หาตำแหน่งของรถที่ $t = 20$, $60$ และ $80\\ \\mathrm{s}$ และอธิบายว่าทำไมกราฟตำแหน่งจึงโค้งในช่วงแรกและช่วงท้าย"
    steps:
      - text: "พื้นที่ใต้กราฟ $v$–$t$ ถึง $t = 20\\ \\mathrm{s}$: $\\tfrac12(20)(20) = 200\\ \\mathrm{m}$ จึงได้ $x = 200\\ \\mathrm{m}$"
      - text: "ช่วง $20$–$60\\ \\mathrm{s}$ พื้นที่เพิ่ม $(40)(20) = 800\\ \\mathrm{m}$ จึงได้ $x = 1000\\ \\mathrm{m}$ ช่วง $60$–$80\\ \\mathrm{s}$ เพิ่มอีก $200\\ \\mathrm{m}$ จึงได้ $x = 1200\\ \\mathrm{m}$"
        why: "ตำแหน่งที่เวลาใดคือพื้นที่สะสมใต้กราฟ $v$–$t$ ตั้งแต่เริ่มจนถึงเวลานั้น (เมื่อเริ่มที่ $x = 0$)"
      - text: "ช่วงแรกความเร็วเพิ่มขึ้น ความชันของกราฟ $x$–$t$ จึงชันขึ้นเรื่อย ๆ (โค้งหงาย) ช่วงท้ายความเร็วลดลง ความชันจึงลดลงจนเป็นศูนย์ตอนจอด (โค้งคว่ำ) ช่วงกลางความเร็วคงตัว จึงเป็นเส้นตรง"
    answer: "$x = 200$, $1000$ และ $1200\\ \\mathrm{m}$ ตามลำดับ"
  - { type: check, problem: phy.graph.p007, prompt: "ลองนึกกราฟความเร็วของลูกบอลที่โยนขึ้น" }
  - type: interactive
    title: กราฟตำแหน่ง–เวลาเมื่อความเร่งคงตัว
    caption: แกนนอนคือเวลา (s) แกนตั้งคือตำแหน่ง (m) ตั้ง a = 0 แล้วเลื่อน u จะได้เส้นตรงที่ความชันเท่ากับความเร็ว จากนั้นเพิ่ม a เส้นจะโค้งเป็นพาราโบลา เพราะความชันซึ่งคือความเร็วเปลี่ยนไปตามเวลา
    widget:
      kind: function-plot
      functions: ["u x + \\frac{1}{2} a x^2"]
      sliders:
        - { name: u, min: -4, max: 4, step: 0.5, value: 2, label: ความเร็วต้น (m/s) }
        - { name: a, min: -2, max: 2, step: 0.25, value: 0, label: ความเร่ง (m/s²) }
      x: [0, 6]
      y: [-60, 60]
  - type: interactive
    title: กราฟความเร็ว–เวลาเมื่อความเร่งคงตัว
    caption: แกนนอนคือเวลา (s) แกนตั้งคือความเร็ว (m/s) ความชันของเส้นเท่ากับค่า a ลองตั้ง u เป็นบวกและ a เป็นลบ แล้วสังเกตเวลาที่เส้นตัดแกนเวลา ซึ่งคือตอนที่วัตถุหยุดชั่วขณะแล้วกลับทิศ
    widget:
      kind: function-plot
      functions: ["u + a x"]
      sliders:
        - { name: u, min: -6, max: 6, step: 0.5, value: 4, label: ความเร็วต้น (m/s) }
        - { name: a, min: -2, max: 2, step: 0.25, value: -1, label: ความเร่ง (m/s²) }
      x: [0, 8]
      y: [-10, 10]
glossary:
  - { term: กราฟตำแหน่ง–เวลา, definition: "กราฟที่มีเวลาบนแกนนอนและตำแหน่งบนแกนตั้ง ความชันของกราฟคือความเร็ว" }
  - { term: กราฟความเร็ว–เวลา, definition: "กราฟที่มีเวลาบนแกนนอนและความเร็วบนแกนตั้ง ความชันคือความเร่ง พื้นที่ระหว่างกราฟกับแกนเวลาคือการกระจัด" }
  - { term: เส้นสัมผัส, definition: "เส้นตรงที่แตะเส้นโค้งที่จุดหนึ่ง ความชันของเส้นสัมผัสบนกราฟตำแหน่ง–เวลาคือความเร็วขณะนั้น" }
flashcards:
  - { front: "ความชันของกราฟ $x$–$t$ บอกอะไร", back: "ความเร็ว $v = \\dfrac{\\Delta x}{\\Delta t}$" }
  - { front: "พื้นที่ใต้กราฟ $v$–$t$ บอกอะไร", back: "การกระจัด พื้นที่ส่วนที่อยู่ใต้แกนเวลานับเป็นลบ" }
  - { front: "ความชันของกราฟ $v$–$t$ บอกอะไร", back: "ความเร่ง $a = \\dfrac{\\Delta v}{\\Delta t}$" }
  - { front: "พื้นที่ใต้กราฟ $a$–$t$ บอกอะไร", back: "ความเร็วที่เปลี่ยนไป $\\Delta v$ ต้องบวกความเร็วต้นจึงได้ความเร็วปลาย" }
  - { front: "กราฟ $x$–$t$ เป็นเส้นแนวนอนหมายความว่าอะไร", back: "ตำแหน่งไม่เปลี่ยน วัตถุหยุดนิ่ง" }
