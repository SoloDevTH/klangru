    solution: "$150x = 100(1.5 - x) \\Rightarrow 250x = 150 \\Rightarrow x = 0.60\\ \\mathrm{m}$ จากปลายหน้า (และ $0.90\\ \\mathrm{m}$ จากปลายหลัง)"
