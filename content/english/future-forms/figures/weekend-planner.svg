<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" font-family="sans-serif">
<title>ตารางวันหยุดสุดสัปดาห์ของนิดา</title>
<rect x="0" y="0" width="600" height="300" fill="#fff"/>
<text x="300.0" y="32.0" font-size="20" text-anchor="middle" fill="#1f4e9c" font-weight="bold">Nida's weekend plans</text>
<rect x="30.0" y="50.0" width="260.0" height="230.0" rx="10" fill="#fffdf5" stroke="#888" stroke-width="1.5"/>
<rect x="30.0" y="50.0" width="260.0" height="40.0" rx="10" fill="#ffe7a8" stroke="#888" stroke-width="1.5"/>
<text x="160.0" y="77.0" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">Saturday</text>
<text x="46.0" y="120.0" font-size="15" text-anchor="start" fill="#c77700" font-weight="bold">morning</text>
<text x="46.0" y="144.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">visit Grandma in</text>
<text x="46.0" y="166.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">Ayutthaya</text>
<text x="46.0" y="205.0" font-size="15" text-anchor="start" fill="#c77700" font-weight="bold">afternoon</text>
<text x="46.0" y="229.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">buy fruit at the market</text>
<text x="46.0" y="251.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">with Mum</text>
<rect x="310.0" y="50.0" width="260.0" height="230.0" rx="10" fill="#fffdf5" stroke="#888" stroke-width="1.5"/>
<rect x="310.0" y="50.0" width="260.0" height="40.0" rx="10" fill="#ffe7a8" stroke="#888" stroke-width="1.5"/>
<text x="440.0" y="77.0" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">Sunday</text>
<text x="326.0" y="120.0" font-size="15" text-anchor="start" fill="#c77700" font-weight="bold">morning</text>
<text x="326.0" y="144.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">play football (9:00)</text>
<text x="326.0" y="205.0" font-size="15" text-anchor="start" fill="#c77700" font-weight="bold">evening</text>
<text x="326.0" y="229.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">do maths homework</text>
</svg>
