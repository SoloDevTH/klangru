problems:
  - id: phy.circ.p001
    topics: [physics.kinematics.circular]
    difficulty: 1
    type: mcq
    stem: "แกว่งก้อนหินที่ผูกเชือกเป็นวงกลมในแนวราบเหนือศีรษะ ถ้าเชือกขาดทันที ก้อนหินจะเคลื่อนที่ไปในแนวใด (มองจากด้านบน)"
    choices:
      - { id: a, text: "เป็นเส้นตรงตามแนวเส้นสัมผัสวงกลม ณ จุดที่เชือกขาด", correct: true }
      - { id: b, text: "พุ่งออกจากศูนย์กลางตามแนวรัศมี", feedback: "ไม่มีแรงใดผลักก้อนหินออกจากศูนย์กลาง เมื่อเชือกขาด ก้อนหินเคลื่อนที่ต่อด้วยความเร็วที่มีอยู่ขณะนั้น ซึ่งมีทิศตามเส้นสัมผัส" }
      - { id: c, text: "เคลื่อนที่เป็นวงกลมต่อไปอีกสักพักแล้วค่อย ๆ ออกนอกวง", feedback: "การเคลื่อนที่เป็นวงกลมต้องมีแรงดึงเข้าหาศูนย์กลางตลอด เมื่อไม่มีแรงตึงเชือก ก้อนหินจะเปลี่ยนเป็นเส้นตรงทันที" }
      - { id: d, text: "พุ่งเข้าหาศูนย์กลาง", feedback: "แรงตึงที่ดึงเข้าศูนย์กลางหายไปแล้ว ก้อนหินจึงไม่มีเหตุให้เคลื่อนเข้าหาศูนย์กลาง" }
    hints:
      - "ขณะเชือกขาด ความเร็วของก้อนหินมีทิศใดเมื่อเทียบกับวงกลม"
      - "เมื่อไม่มีแรงในแนวราบ วัตถุจะเคลื่อนที่อย่างไรตามกฎข้อที่ 1"
    solution: "ความเร็วของวัตถุที่เคลื่อนที่เป็นวงกลมมีทิศตามเส้นสัมผัสเสมอ เมื่อเชือกขาด แรงสู่ศูนย์กลางหายไป ก้อนหินจึงเคลื่อนที่ต่อเป็นเส้นตรงด้วยความเร็วนั้น (กฎข้อที่ 1) คือตามแนวเส้นสัมผัส ณ จุดที่เชือกขาด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.circ.p002
    topics: [physics.kinematics.circular]
    difficulty: 1
    type: numeric
    stem: "ใบพัดลมตั้งโต๊ะหมุน $300$ รอบในเวลา $1$ นาที ความถี่ของการหมุนเป็นกี่เฮิรตซ์ (ตอบเป็นตัวเลขในหน่วย Hz)"
    answer: { value: 5, unit: Hz }
    hints:
      - "ความถี่คือจำนวนรอบใน 1 วินาที"
      - "แปลง 1 นาทีเป็นวินาทีก่อน แล้วนำจำนวนรอบหารด้วยเวลา"
    misconceptions:
      - { match: 300, feedback: "นั่นคือจำนวนรอบต่อนาที ความถี่ในหน่วยเฮิรตซ์คือรอบต่อ **วินาที** ต้องหารด้วย 60" }
      - { match: 0.2, feedback: "นั่นคือคาบ (เวลาต่อ 1 รอบ หน่วยวินาที) ความถี่เป็นส่วนกลับของคาบ" }
    solution: "300 รอบใน $60\\ \\mathrm{s}$: $f = \\dfrac{300}{60\\ \\mathrm{s}} = 5\\ \\mathrm{Hz}$ (คาบ $T = \\dfrac{1}{5} = 0.2\\ \\mathrm{s}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.circ.p003
    topics: [physics.kinematics.circular]
    difficulty: 2
    type: numeric
    stem: "ชิงช้าสวรรค์ริมแม่น้ำเจ้าพระยามีรัศมี $30\\ \\mathrm{m}$ หมุนครบ 1 รอบใน $10$ นาทีด้วยอัตราเร็วคงตัว กระเช้าที่ขอบวงล้อเคลื่อนที่ด้วยอัตราเร็วเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s ทศนิยม 3 ตำแหน่ง)"
    answer: { value: 0.314, tolerance: 0.003, unit: m/s }
    hints:
      - "ใน 1 รอบ กระเช้าเดินทางได้ระยะเท่ากับเส้นรอบวง $2\\pi r$"
      - "แปลงคาบเป็นวินาทีก่อน แล้วใช้ $v = \\dfrac{2\\pi r}{T}$"
    misconceptions:
      - { match: 0.628, feedback: "ดูเหมือนใช้ $60\\ \\mathrm{m}$ ซึ่งเป็นเส้นผ่านศูนย์กลาง สูตร $v = \\dfrac{2\\pi r}{T}$ ใช้รัศมี" }
      - { match: 18.85, feedback: "ดูเหมือนใช้คาบเป็น 10 โดยไม่แปลงนาทีเป็นวินาที 10 นาทีเท่ากับ $600\\ \\mathrm{s}$" }
    solution: "$T = 10 \\times 60 = 600\\ \\mathrm{s}$ → $v = \\dfrac{2\\pi r}{T} = \\dfrac{2\\pi(30\\ \\mathrm{m})}{600\\ \\mathrm{s}} = \\dfrac{\\pi}{10}\\ \\mathrm{m/s} \\approx 0.314\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.circ.p004
    topics: [physics.kinematics.circular]
    difficulty: 2
    type: mcq
    stem: "รถคันหนึ่งวิ่งรอบวงเวียนด้วยอัตราเร็วคงตัว ข้อใดกล่าวถึงความเร่งของรถได้ถูกต้อง"
    choices:
      - { id: a, text: "มีความเร่งชี้เข้าหาศูนย์กลางของวงเวียน", correct: true }
      - { id: b, text: "ไม่มีความเร่ง เพราะอัตราเร็วคงตัว", feedback: "อัตราเร็วคงตัวแต่ทิศของความเร็วเปลี่ยนตลอด ความเร็วจึงเปลี่ยน และมีความเร่ง" }
      - { id: c, text: "มีความเร่งในทิศเดียวกับความเร็ว ตามแนวเส้นสัมผัส", feedback: "ความเร่งตามแนวเส้นสัมผัสทำให้อัตราเร็วเปลี่ยน แต่รถมีอัตราเร็วคงตัว ความเร่งจึงตั้งฉากกับความเร็ว ชี้เข้าศูนย์กลาง" }
      - { id: d, text: "มีความเร่งชี้ออกจากศูนย์กลาง", feedback: "ความรู้สึกเหมือนถูกเหวี่ยงออกเกิดจากความเฉื่อยของตัวเรา แรงลัพธ์และความเร่งของรถชี้เข้าหาศูนย์กลาง" }
    hints:
      - "ความเร่งคือการเปลี่ยนความเร็ว ซึ่งรวมทั้งขนาดและทิศ"
      - "ถ้าอัตราเร็วไม่เปลี่ยน ความเร่งต้องตั้งฉากกับความเร็ว ในวงกลมคือทิศใด"
    solution: "ทิศของความเร็วเปลี่ยนตลอดเวลา รถจึงมีความเร่ง เนื่องจากอัตราเร็วคงตัว ความเร่งตั้งฉากกับความเร็ว คือชี้เข้าหาศูนย์กลาง ขนาด $a_c = \\dfrac{v^2}{r}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.circ.p005
    topics: [physics.kinematics.circular]
    difficulty: 3
    type: numeric
    stem: "รถยนต์วิ่งรอบวงเวียนขนาดใหญ่ซึ่งมีเส้นผ่านศูนย์กลาง $160\\ \\mathrm{m}$ ด้วยอัตราเร็วคงตัว $20\\ \\mathrm{m/s}$ ความเร่งสู่ศูนย์กลางของรถมีขนาดเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s²)"
    answer: { value: 5, unit: m/s² }
    hints:
      - "โจทย์ให้เส้นผ่านศูนย์กลาง แต่สูตรใช้รัศมี"
      - "ใช้ $a_c = \\dfrac{v^2}{r}$ อย่าลืมยกกำลังสองของอัตราเร็ว"
    misconceptions:
      - { match: 2.5, feedback: "ดูเหมือนใช้ $160\\ \\mathrm{m}$ เป็นรัศมี แต่ $160\\ \\mathrm{m}$ คือเส้นผ่านศูนย์กลาง รัศมีคือ $80\\ \\mathrm{m}$" }
      - { match: 0.25, feedback: "ดูเหมือนลืมยกกำลังสองของอัตราเร็ว ($\\tfrac{20}{80}$) สูตรคือ $a_c = \\dfrac{v^2}{r}$" }
    solution: "$r = \\dfrac{160}{2} = 80\\ \\mathrm{m}$ → $a_c = \\dfrac{v^2}{r} = \\dfrac{(20\\ \\mathrm{m/s})^2}{80\\ \\mathrm{m}} = \\dfrac{400}{80}\\ \\mathrm{m/s^2} = 5\\ \\mathrm{m/s^2}$ ชี้เข้าหาศูนย์กลางวงเวียน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.circ.p006
    topics: [physics.kinematics.circular]
    difficulty: 3
    type: numeric
    stem: "ถังปั่นแห้งของเครื่องซักผ้าหมุนด้วยอัตรา $1200$ รอบต่อนาที อัตราเร็วเชิงมุมของถังเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย rad/s)"
    answer: { value: 125.66, tolerance: 1.2, unit: rad/s }
    hints:
      - "แปลงรอบต่อนาทีเป็นรอบต่อวินาที (ความถี่) ก่อน"
      - "1 รอบเท่ากับ $2\\pi$ เรเดียน ใช้ $\\omega = 2\\pi f$"
    misconceptions:
      - { match: 20, feedback: "นั่นคือความถี่ (รอบต่อวินาที) ยังต้องคูณด้วย $2\\pi$ เพราะ 1 รอบเท่ากับ $2\\pi$ เรเดียน" }
      - { match: 7539.82, feedback: "ดูเหมือนลืมแปลงนาทีเป็นวินาที ต้องหารด้วย 60 ก่อน" }
    solution: "$f = \\dfrac{1200}{60} = 20\\ \\mathrm{Hz}$ → $\\omega = 2\\pi f = 2\\pi(20) = 40\\pi \\approx 125.7\\ \\mathrm{rad/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.circ.p007
    topics: [physics.kinematics.circular]
    difficulty: 2
    type: match
    stem: "จับคู่ปริมาณของการเคลื่อนที่แบบวงกลมกับหน่วยใน SI"
    pairs:
      - { left: "คาบ $T$", right: "$\\mathrm{s}$" }
      - { left: "ความถี่ $f$", right: "$\\mathrm{Hz}$" }
      - { left: "อัตราเร็วเชิงมุม $\\omega$", right: "$\\mathrm{rad/s}$" }
      - { left: "ความเร่งสู่ศูนย์กลาง $a_c$", right: "$\\mathrm{m/s^2}$" }
      - { left: "แรงสู่ศูนย์กลาง $F_c$", right: "$\\mathrm{N}$" }
    hints:
      - "คาบเป็นเวลา ความถี่เป็นจำนวนรอบต่อวินาที"
      - "อัตราเร็วเชิงมุมคือมุม (เรเดียน) ต่อเวลา ส่วนความเร่งและแรงใช้หน่วยเดียวกับการเคลื่อนที่แนวตรง"
    solution: "คาบ → $\\mathrm{s}$ · ความถี่ → $\\mathrm{Hz}$ (รอบต่อวินาที) · อัตราเร็วเชิงมุม → $\\mathrm{rad/s}$ · ความเร่งสู่ศูนย์กลาง → $\\mathrm{m/s^2}$ · แรงสู่ศูนย์กลาง → $\\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.circ.p008
    topics: [physics.kinematics.circular]
    difficulty: 4
    type: numeric
    stem: "ลูกตุ้มมวล $0.2\\ \\mathrm{kg}$ ผูกเชือกยาว $0.5\\ \\mathrm{m}$ หมุนเป็นวงกลมในแนวราบบนโต๊ะลื่นด้วยความถี่ $2\\ \\mathrm{Hz}$ (ไม่คิดแรงเสียดทาน) แรงตึงในเชือกมีขนาดเท่าใด (ตอบเป็นตัวเลขในหน่วย N ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 15.79, tolerance: 0.16, unit: N }
    hints:
      - "แรงตึงเชือกเป็นแรงเดียวในแนวราบ จึงทำหน้าที่เป็นแรงสู่ศูนย์กลาง"
      - "หาอัตราเร็วเชิงมุม $\\omega = 2\\pi f$ ก่อน"
      - "ใช้ $T = m\\omega^2 r$ (หรือหา $v = \\omega r$ แล้วใช้ $\\dfrac{mv^2}{r}$)"
    misconceptions:
      - { match: 0.4, feedback: "ดูเหมือนใช้ความถี่ $2$ แทนอัตราเร็วเชิงมุม ต้องคูณ $2\\pi$ ก่อน: $\\omega = 2\\pi f$" }
      - { match: 2.51, feedback: "ดูเหมือนใช้ $\\dfrac{mv}{r}$ โดยลืมยกกำลังสองของอัตราเร็ว สูตรคือ $\\dfrac{mv^2}{r}$" }
    solution: "$\\omega = 2\\pi(2\\ \\mathrm{Hz}) = 4\\pi \\approx 12.57\\ \\mathrm{rad/s}$ → $T = m\\omega^2 r = (0.2)(12.57)^2(0.5) \\approx 15.79\\ \\mathrm{N}$ ตรวจ: $v = \\omega r \\approx 6.28\\ \\mathrm{m/s}$ และ $\\dfrac{mv^2}{r} = \\dfrac{0.2(6.28)^2}{0.5} \\approx 15.79\\ \\mathrm{N}$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.circ.p009
    topics: [physics.kinematics.circular]
    difficulty: 4
    type: numeric
    stem: "รถเก๋งมวล $1200\\ \\mathrm{kg}$ เลี้ยวโค้งบนถนนราบรัศมี $50\\ \\mathrm{m}$ ด้วยอัตราเร็วคงตัว $54\\ \\mathrm{km/h}$ แรงเสียดทานระหว่างยางกับถนนต้องมีขนาดเท่าใดรถจึงเลี้ยวได้ตามโค้ง (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 5400, unit: N }
    hints:
      - "แปลง $\\mathrm{km/h}$ เป็น $\\mathrm{m/s}$ ก่อน โดยคูณด้วย $\\dfrac{1000}{3600}$"
      - "บนถนนราบ แรงเสียดทานทำหน้าที่เป็นแรงสู่ศูนย์กลาง $F_c = \\dfrac{mv^2}{r}$"
    misconceptions:
      - { match: 69984, feedback: "ดูเหมือนแทน $v = 54$ โดยไม่แปลงหน่วย $54\\ \\mathrm{km/h} = 15\\ \\mathrm{m/s}$" }
      - { match: 360, feedback: "ดูเหมือนลืมยกกำลังสองของอัตราเร็ว สูตรคือ $\\dfrac{mv^2}{r}$" }
    solution: "$v = 54 \\times \\dfrac{1000}{3600} = 15\\ \\mathrm{m/s}$ → $F_c = \\dfrac{mv^2}{r} = \\dfrac{(1200\\ \\mathrm{kg})(15\\ \\mathrm{m/s})^2}{50\\ \\mathrm{m}} = \\dfrac{1200 \\times 225}{50}\\ \\mathrm{N} = 5400\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.circ.p010
    topics: [physics.kinematics.circular]
    difficulty: 4
    type: expression
    stem: "วัตถุมวล $m$ เคลื่อนที่เป็นวงกลมรัศมี $r$ ด้วยอัตราเร็วคงตัว ครบ 1 รอบใช้เวลา $T$ เขียนขนาดของแรงสู่ศูนย์กลางในรูปของ $m$, $r$ และ $T$"
    prefix: "F_c ="
    answer: { latex: "\\frac{4\\pi^2 m r}{T^2}", variables: [m, r, T] }
    hints:
      - "เขียนอัตราเร็วในรูปของ $r$ และ $T$ ก่อน: $v = \\dfrac{2\\pi r}{T}$"
      - "แทนลงใน $F_c = \\dfrac{mv^2}{r}$ แล้วยกกำลังสองทั้ง $2\\pi$ และ $r$"
    misconceptions:
      - { match: "\\frac{4\\pi^2 m r^2}{T^2}", feedback: "ดูเหมือนแทน $v^2$ แล้วลืมหารด้วย $r$ ใน $\\dfrac{mv^2}{r}$" }
      - { match: "\\frac{2\\pi m r}{T^2}", feedback: "ดูเหมือนยกกำลังสองแค่ $r$ และ $T$ แต่ลืมยกกำลังสองของ $2\\pi$: $(2\\pi)^2 = 4\\pi^2$" }
    solution: "$v = \\dfrac{2\\pi r}{T}$ → $F_c = \\dfrac{mv^2}{r} = \\dfrac{m}{r} \\cdot \\dfrac{4\\pi^2 r^2}{T^2} = \\dfrac{4\\pi^2 m r}{T^2}$ (เท่ากับ $m\\omega^2 r$ เมื่อ $\\omega = \\dfrac{2\\pi}{T}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.circ.p011
    topics: [physics.kinematics.circular]
    difficulty: 5
    type: numeric
    stem: "รถไฟเหาะในสวนสนุกวิ่งผ่านห่วงวงกลมแนวดิ่งรัศมี $10\\ \\mathrm{m}$ ที่จุดสูงสุดของห่วงผู้โดยสารอยู่ในท่าหัวกลับ ถ้ารถวิ่งช้าที่สุดที่ยังวนผ่านจุดสูงสุดได้ (รางไม่ต้องออกแรงกดรถเลย แรงโน้มถ่วงทำหน้าที่เป็นแรงสู่ศูนย์กลางเพียงแรงเดียว) รถมีอัตราเร็วเท่าใดที่จุดนั้น ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย m/s)"
    answer: { value: 9.9, tolerance: 0.1, unit: m/s }
    hints:
      - "ที่จุดสูงสุด ศูนย์กลางของห่วงอยู่ด้านล่าง น้ำหนัก $mg$ ชี้เข้าหาศูนย์กลางพอดี"
      - "ตั้งน้ำหนักเท่ากับแรงสู่ศูนย์กลาง: $mg = \\dfrac{mv^2}{r}$ มวลตัดกันได้"
      - "จัดรูปได้ $v = \\sqrt{gr}$"
    misconceptions:
      - { match: 98, feedback: "นั่นคือ $v^2 = gr$ ยังต้องถอดรากที่สอง" }
