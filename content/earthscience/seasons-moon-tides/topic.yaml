id: earthscience.astronomy.seasons-moon-tides
subject: earthscience
title: { th: ฤดูกาล ข้างขึ้นข้างแรม และน้ำขึ้นน้ำลง, en: "Seasons, lunar phases and tides" }
summary: แกนโลกเอียงกับการเกิดฤดู การเคลื่อนที่ปรากฏของดวงอาทิตย์และมุมเงยตอนเที่ยงที่กรุงเทพฯ ความยาวกลางวัน เวลาขึ้นตกของดวงจันทร์ และน้ำขึ้นน้ำลง น้ำเกิด น้ำตาย
difficulty: 3.5
minutes: 40
prerequisites: [earthscience.astronomy.moon-solar-system, physics.fields.field-forces]
encompasses:
  - { id: earthscience.astronomy.moon-solar-system, weight: 0.3 }
  - { id: physics.fields.field-forces, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: แกนโลกเอียงกับการเกิดฤดู
    src: seasons-orbit.svg
    alt: "ดวงอาทิตย์อยู่ตรงกลาง วงโคจรรูปวงรีเส้นประ โลกอยู่สี่ตำแหน่ง แกนโลกสีแดงเอียงไปทางขวาเท่ากันทุกตำแหน่ง ปลายบนเป็นขั้วเหนือ ด้านที่หันเข้าหาดวงอาทิตย์สว่าง ตำแหน่งซ้ายคือราว 21 มิถุนายน ขั้วเหนือเอียงเข้าหาดวงอาทิตย์ ซีกโลกเหนือเป็นฤดูร้อน ตำแหน่งขวาคือราว 21 ธันวาคม ขั้วเหนือเอียงออกจากดวงอาทิตย์ ซีกโลกเหนือเป็นฤดูหนาว ตำแหน่งบนคือราว 20 มีนาคม และตำแหน่งล่างคือราว 22 กันยายน กลางวันยาวเท่ากลางคืนทั้งโลก"
    caption: "แกนโลกชี้ไปทิศเดิมตลอดปี ซีกโลกที่เอียงเข้าหาดวงอาทิตย์เป็นฤดูร้อน (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: figure
    title: ดวงอาทิตย์ตอนเที่ยงที่กรุงเทพฯ
    src: noon-sun-bangkok.svg
    alt: "ผู้สังเกตยืนบนเส้นขอบฟ้า ซ้ายคือทิศเหนือ ขวาคือทิศใต้ เส้นประสามเส้นชี้ไปยังดวงอาทิตย์ตอนเที่ยง ราว 21 มิถุนายน ดวงอาทิตย์สูง 80.31 องศาจากขอบฟ้าทิศเหนือ ราว 20 มีนาคมและ 22 กันยายน สูง 76.25 องศาจากขอบฟ้าทิศใต้ ราว 21 ธันวาคม สูง 52.81 องศาจากขอบฟ้าทิศใต้"
    caption: "คำนวณจาก มุมเงย = 90° − |ละติจูด − เดคลิเนชัน| ที่ละติจูด 13.75° เหนือ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: มุมเงยของดวงอาทิตย์ตอนเที่ยงที่หาดใหญ่
    problem: "หาดใหญ่อยู่ละติจูดราว 7.0° เหนือ ราว 21 ธันวาคม (เดคลิเนชัน −23.44°) ดวงอาทิตย์ตอนเที่ยงอยู่สูงกี่องศา และอยู่ทางทิศใด"
    steps:
      - text: "ผลต่างของละติจูดกับเดคลิเนชัน $= 7.0 - (-23.44) = 30.44^\\circ$"
        why: "ลบจำนวนลบคือบวก ดวงอาทิตย์อยู่ใต้เส้นศูนย์สูตร ห่างจากหาดใหญ่มากกว่าละติจูดของหาดใหญ่"
      - text: "มุมเงย $= 90^\\circ - 30.44^\\circ = 59.56^\\circ$"
      - text: "เดคลิเนชันน้อยกว่าละติจูด ดวงอาทิตย์จึงอยู่ทางทิศใต้"
    answer: "สูงราว 59.6° จากขอบฟ้าทิศใต้ สูงกว่าที่กรุงเทพฯ (52.81°) เพราะหาดใหญ่อยู่ใกล้เส้นศูนย์สูตรกว่า"
  - { type: check, problem: earthscience.astronomy.seasons-moon-tides.p004, prompt: "เดคลิเนชันวันนั้นเท่ากับ 0" }
  - type: figure
    title: น้ำเกิดและน้ำตาย
    src: spring-neap.svg
    alt: "ภาพซ้าย น้ำเกิด ดวงอาทิตย์ โลก และดวงจันทร์อยู่แนวเดียวกัน น้ำรอบโลกนูนเป็นวงรียาวมากตามแนวนั้น เกิดวันเดือนดับและวันเพ็ญ ภาพขวา น้ำตาย ดวงจันทร์อยู่ด้านบนของโลก ทำมุมฉากกับแนวดวงอาทิตย์ น้ำนูนไปทางดวงจันทร์แต่นูนน้อยกว่า เกิดขึ้น 8 ค่ำและแรม 8 ค่ำ ส่วนนูนของน้ำวาดใหญ่เกินจริงมาก"
    caption: "ดวงอาทิตย์ช่วยเสริมหรือหักล้างผลของดวงจันทร์ (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: worked-example
    title: พยากรณ์เวลาน้ำขึ้น
    problem: "วันนี้ที่ท่าเรือแห่งหนึ่งน้ำขึ้นสูงสุดเวลา 06.10 น. น้ำขึ้นสูงสุดครั้งถัดไปของวันนี้ และน้ำขึ้นสูงสุดครั้งแรกของวันพรุ่งนี้ควรเป็นเวลาประมาณเท่าใด"
    steps:
      - text: "ชายฝั่งที่มีน้ำขึ้นวันละสองครั้ง น้ำขึ้นแต่ละครั้งห่างกันราว 12 ชั่วโมง 25 นาที"
        why: "รอบของน้ำขึ้นตามดวงจันทร์ยาว 24 ชั่วโมง 50 นาที มีน้ำขึ้นสองครั้ง"
      - text: "ครั้งถัดไป $=$ 06.10 น. $+$ 12 ชั่วโมง 25 นาที $=$ 18.35 น."
      - text: "ครั้งแรกของพรุ่งนี้ $=$ 06.10 น. $+$ 24 ชั่วโมง 50 นาที $=$ 07.00 น. ของวันพรุ่งนี้"
    answer: "ราว 18.35 น. ของวันนี้ และราว 07.00 น. ของวันพรุ่งนี้ ช้าลงจากวันนี้ราว 50 นาที"
  - { type: check, problem: earthscience.astronomy.seasons-moon-tides.p009, prompt: "รอบ 24 ชั่วโมง 50 นาทีมีน้ำขึ้นกี่ครั้ง" }
glossary:
  - { term: แกนโลกเอียง, definition: "แกนหมุนของโลกเอียง 23.44 องศาจากแนวตั้งฉากกับระนาบวงโคจร และชี้ไปทิศเดิมตลอดปี เป็นสาเหตุของฤดู" }
  - { term: เดคลิเนชันของดวงอาทิตย์, definition: "ละติจูดที่ดวงอาทิตย์อยู่ตรงศีรษะตอนเที่ยงในวันนั้น เปลี่ยนระหว่าง −23.44° ถึง +23.44° ตลอดปี" }
  - { term: มุมเงย, definition: "มุมที่วัดจากขอบฟ้าขึ้นไปถึงวัตถุบนท้องฟ้า" }
  - { term: การเคลื่อนที่ปรากฏของดวงอาทิตย์, definition: "การที่ดวงอาทิตย์ดูเหมือนเคลื่อนข้ามท้องฟ้าทุกวันจากการหมุนของโลก และเปลี่ยนจุดขึ้นตกและมุมเงยตลอดปีจากการโคจรของโลกที่แกนเอียง" }
  - { term: น้ำเกิด, definition: "ช่วงที่น้ำขึ้นสูงมากและลงต่ำมาก เกิดวันเดือนดับและวันเพ็ญ เมื่อดวงอาทิตย์ โลก ดวงจันทร์อยู่แนวเดียวกัน" }
  - { term: น้ำตาย, definition: "ช่วงที่น้ำขึ้นลงน้อย เกิดขึ้น 8 ค่ำและแรม 8 ค่ำ เมื่อดวงอาทิตย์กับดวงจันทร์ทำมุมฉากกับโลก" }
flashcards:
  - { front: "ฤดูเกิดจากอะไร", back: "แกนโลกเอียง 23.44° ทำให้มุมของแสงและความยาวกลางวันเปลี่ยนตลอดปี ไม่ใช่ระยะห่างจากดวงอาทิตย์" }
  - { front: "สูตรมุมเงยของดวงอาทิตย์ตอนเที่ยง", back: "90° − |ละติจูด − เดคลิเนชัน|" }
  - { front: "ดวงอาทิตย์อยู่ตรงศีรษะกรุงเทพฯ เมื่อใด", back: "ปีละสองครั้ง ราวปลายเมษายนและกลางสิงหาคม" }
  - { front: "ดวงจันทร์ขึ้นช้าลงวันละเท่าไร", back: "ราว 50 นาที (24 × 60 ÷ 29.5 ≈ 49 นาที)" }
  - { front: "น้ำเกิดเกิดเมื่อใด", back: "วันเดือนดับและวันเพ็ญ เมื่อดวงอาทิตย์ โลก ดวงจันทร์อยู่แนวเดียวกัน" }
