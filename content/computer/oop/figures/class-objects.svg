<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="sans-serif" font-size="15">
  <title>คลาส Account เป็นแม่แบบ มีแอตทริบิวต์ owner และ balance และเมทอด deposit และ withdraw สร้างวัตถุสองตัว a ของมานี balance 150 และ b ของปิติ balance 0</title>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <rect x="0" y="0" width="760" height="360" fill="#ffffff"/>
  <text x="160.0" y="45.0" font-size="17" text-anchor="middle" fill="#1d4ed8" font-weight="bold" xml:space="preserve">คลาส (แม่แบบ)</text>
  <rect x="30.0" y="70.0" width="260.0" height="44.0" rx="4" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="160.0" y="99.0" font-size="19" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="monospace" xml:space="preserve">Account</text>
  <rect x="30.0" y="114.0" width="260.0" height="86.0" rx="0" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="42.0" y="136.0" font-size="13" text-anchor="start" fill="#4b5563" xml:space="preserve">แอตทริบิวต์ (ข้อมูล)</text>
  <text x="42.0" y="162.0" font-size="16" text-anchor="start" fill="#111827" font-family="monospace" xml:space="preserve">owner</text>
  <text x="42.0" y="186.0" font-size="16" text-anchor="start" fill="#111827" font-family="monospace" xml:space="preserve">balance</text>
  <rect x="30.0" y="200.0" width="260.0" height="96.0" rx="0" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="42.0" y="222.0" font-size="13" text-anchor="start" fill="#4b5563" xml:space="preserve">เมทอด (การกระทำ)</text>
  <text x="42.0" y="248.0" font-size="16" text-anchor="start" fill="#111827" font-family="monospace" xml:space="preserve">deposit(amount)</text>
  <text x="42.0" y="274.0" font-size="16" text-anchor="start" fill="#111827" font-family="monospace" xml:space="preserve">withdraw(amount)</text>
  <text x="600.0" y="45.0" font-size="17" text-anchor="middle" fill="#15803d" font-weight="bold" xml:space="preserve">วัตถุ (สร้างจากคลาส)</text>
  <rect x="470.0" y="70.0" width="260.0" height="110.0" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="484.0" y="98.0" font-size="15" text-anchor="start" fill="#15803d" font-weight="bold" font-family="monospace" xml:space="preserve">a = Account(...)</text>
  <text x="484.0" y="130.0" font-size="15" text-anchor="start" fill="#111827" font-family="monospace" xml:space="preserve">owner = "มานี"</text>
  <text x="484.0" y="158.0" font-size="15" text-anchor="start" fill="#111827" font-family="monospace" xml:space="preserve">balance = 150</text>
  <line x1="296.0" y1="183.0" x2="464.0" y2="125.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="470.0" y="210.0" width="260.0" height="110.0" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="484.0" y="238.0" font-size="15" text-anchor="start" fill="#15803d" font-weight="bold" font-family="monospace" xml:space="preserve">b = Account(...)</text>
  <text x="484.0" y="270.0" font-size="15" text-anchor="start" fill="#111827" font-family="monospace" xml:space="preserve">owner = "ปิติ"</text>
  <text x="484.0" y="298.0" font-size="15" text-anchor="start" fill="#111827" font-family="monospace" xml:space="preserve">balance = 0</text>
  <line x1="296.0" y1="183.0" x2="464.0" y2="265.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <text x="380.0" y="340.0" font-size="14" text-anchor="middle" fill="#4b5563" xml:space="preserve">วัตถุแต่ละตัวมีค่าแอตทริบิวต์ของตัวเอง แต่ใช้เมทอดชุดเดียวกัน</text>
</svg>
