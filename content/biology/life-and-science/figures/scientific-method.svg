<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" width="640" height="490" font-family="sans-serif" font-size="15">
<title>ขั้นตอนของวิธีการทางวิทยาศาสตร์</title>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect x="60" y="20" width="360" height="52" rx="8" fill="#eef5fb" stroke="#1f4e79" stroke-width="2"/>
<text x="240.0" y="42" text-anchor="middle" font-weight="bold" font-size="16">1. สังเกต</text>
<text x="240.0" y="62" text-anchor="middle" font-size="13.5" fill="#333">เห็นปรากฏการณ์ที่น่าสงสัย</text>
<line x1="240.0" y1="72" x2="240.0" y2="95" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="98" width="360" height="52" rx="8" fill="#eef5fb" stroke="#1f4e79" stroke-width="2"/>
<text x="240.0" y="120" text-anchor="middle" font-weight="bold" font-size="16">2. ระบุปัญหา</text>
<text x="240.0" y="140" text-anchor="middle" font-size="13.5" fill="#333">ตั้งคำถามที่ตรวจสอบได้</text>
<line x1="240.0" y1="150" x2="240.0" y2="173" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="176" width="360" height="52" rx="8" fill="#eef5fb" stroke="#1f4e79" stroke-width="2"/>
<text x="240.0" y="198" text-anchor="middle" font-weight="bold" font-size="16">3. ตั้งสมมติฐาน</text>
<text x="240.0" y="218" text-anchor="middle" font-size="13.5" fill="#333">ถ้า... ดังนั้น... (คำตอบที่คาดไว้)</text>
<line x1="240.0" y1="228" x2="240.0" y2="251" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="254" width="360" height="52" rx="8" fill="#eef5fb" stroke="#1f4e79" stroke-width="2"/>
<text x="240.0" y="276" text-anchor="middle" font-weight="bold" font-size="16">4. ตรวจสอบสมมติฐาน</text>
<text x="240.0" y="296" text-anchor="middle" font-size="13.5" fill="#333">ออกแบบการทดลอง กำหนดตัวแปร ชุดควบคุม</text>
<line x1="240.0" y1="306" x2="240.0" y2="329" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="332" width="360" height="52" rx="8" fill="#eef5fb" stroke="#1f4e79" stroke-width="2"/>
<text x="240.0" y="354" text-anchor="middle" font-weight="bold" font-size="16">5. วิเคราะห์และสรุปผล</text>
<text x="240.0" y="374" text-anchor="middle" font-size="13.5" fill="#333">ข้อมูลสนับสนุนสมมติฐานหรือไม่</text>
<path d="M420,358.0 L490,358.0 L490,202.0 L424,202.0" fill="none" stroke="#b4521f" stroke-width="2" marker-end="url(#ah)"/>
<text x="498" y="272.0" fill="#b4521f" font-size="13.5">ไม่สนับสนุน</text>
<text x="498" y="290.0" fill="#b4521f" font-size="13.5">ตั้งสมมติฐานใหม่</text>
<line x1="240.0" y1="384" x2="240.0" y2="412" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<text x="250.0" y="404" font-size="13.5" fill="#1b7a2f">สนับสนุน</text>
<rect x="60" y="416" width="360" height="40" rx="8" fill="#e2f3e4" stroke="#1b7a2f" stroke-width="2"/>
<text x="240.0" y="442" text-anchor="middle" font-weight="bold">สื่อสารผลให้ผู้อื่นตรวจซ้ำ</text>
</svg>