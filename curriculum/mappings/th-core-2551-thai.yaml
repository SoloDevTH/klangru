  - topic: thai.grammar.royal-vocabulary
    indicators: [ท 4.1 ป.5/4, ท 4.1 ม.2/4]
    coverage: full
    note: ระดับบุคคล 5 ระดับ คำนาม (อวัยวะ เครื่องใช้ พระบรม/พระราช/พระ) สรรพนาม กริยา (เสวย บรรทม ประทับ ตรัส ทอดพระเนตร เสด็จ/เสด็จพระราชดำเนิน ทูลเกล้าฯ/น้อมเกล้าฯ) หลักการใช้ ทรง และคำที่ใช้กับพระสงฆ์ พร้อมโจทย์แก้ประโยค
  - topic: thai.grammar.royal-vocabulary
    indicators: [ท 4.1 ป.6/2, ท 4.1 ม.4-6/3]
    coverage: partial
    note: ฝึกเลือกคำให้เหมาะกับบุคคล (ราชาศัพท์ คำสำหรับพระสงฆ์ คำสุภาพ ไม่ใช้ราชาศัพท์กับตนเอง) แต่ยังไม่ได้ฝึกเรื่องกาลเทศะและระดับภาษาทั่วไป ซึ่งอยู่ในแผนที่ thai.grammar.language-levels
  - topic: thai.grammar.sentences-basic
    indicators: [ท 4.1 ป.1/3, ท 4.1 ป.2/3]
    coverage: full
    note: เรียงบัตรคำเป็นประโยคง่าย (ประธาน กริยา กรรม ส่วนขยาย) ด้วยโจทย์เรียงลำดับและเลือกประโยคที่เรียงถูก
  - topic: thai.grammar.sentences-basic
    indicators: [ท 4.1 ป.3/4]
    coverage: partial
    note: เติมคำและเปลี่ยนประโยคให้ตรงชนิด และเรียงประโยคเป็นข้อความสั้น แต่การแต่งประโยคอิสระของผู้เรียนตรวจอัตโนมัติไม่ได้
  - topic: thai.listening.instructions-retelling
    indicators: [ท 3.1 ป.1/1, ท 3.1 ป.2/1, ท 3.1 ป.1/2, ท 3.1 ป.2/2, ท 3.1 ป.3/1, ท 3.1 ม.1/2]
    coverage: partial
    note: สอนการจับคำสำคัญ คำบอกลำดับ เงื่อนไข และข้อห้าม พร้อมโจทย์ทำตามคำสั่งหลายขั้นและคำบอกทางบนแผนผัง แต่แอปไม่มีเสียง โจทย์ใช้ข้อความที่พิมพ์แทนการฟังจริง และการปฏิบัติตามจริงตรวจไม่ได้
  - topic: thai.writing.handwriting
    indicators: [ท 2.1 ป.1/1, ท 2.1 ป.2/1, ท 2.1 ป.3/1, ท 2.1 ป.4/1, ท 2.1 ป.5/1, ท 2.1 ป.6/1, ท 2.1 ม.1/1, ท 2.1 ม.2/1, ท 2.1 ม.3/1]
    coverage: partial
    note: สอนส่วนของตัวอักษร (หัว หาง เชิง หยัก) ลำดับการลากเส้นพร้อมภาพ (บ ป พ ฟ ด ต) หลักการคัดตัวบรรจง และความต่างของเต็มบรรทัดกับครึ่งบรรทัด แต่แอปตรวจลายมือที่ผู้เรียนเขียนจริงไม่ได้ ต้องฝึกในสมุดคัดลายมือ
  - topic: thai.writing.tone-marks-numerals
