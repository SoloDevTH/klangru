  - id: phy.proj.p015
    topics: [physics.kinematics.projectile]
    difficulty: 2
    type: match
    stem: "ยิงวัตถุจากพื้นด้วยอัตราเร็ว $u$ ทำมุม $\\theta$ กับแนวราบ ไม่คิดแรงต้านอากาศ จับคู่ปริมาณที่ **จุดสูงสุด** กับค่าของปริมาณนั้น"
    pairs:
      - { left: "ความเร็วแนวดิ่ง", right: "$0$" }
      - { left: "ความเร็วแนวราบ", right: "$u\\cos\\theta$" }
      - { left: "ความเร่ง", right: "$g$ ทิศลง" }
      - { left: "เวลาที่ใช้ขึ้นถึงจุดนี้", right: "$\\dfrac{u\\sin\\theta}{g}$" }
    hints:
      - "ที่จุดสูงสุด วัตถุหยุดขึ้นแต่ยังไม่เริ่มลง องค์ประกอบใดของความเร็วเป็นศูนย์"
      - "ความเร็วแนวราบคงที่ตลอด และเวลาขาขึ้นหาจาก $v_y = u_y - gt = 0$"
    solution: "ที่จุดสูงสุด $v_y = 0$ ส่วน $v_x = u\\cos\\theta$ เท่าเดิม ความเร่งยังเป็น $g$ ทิศลง และเวลาขาขึ้นได้จาก $0 = u\\sin\\theta - gt$ คือ $t = \\dfrac{u\\sin\\theta}{g}$ (ครึ่งหนึ่งของเวลาลอย)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.proj.p016
    topics: [physics.kinematics.projectile]
    difficulty: 3
    type: numeric
    stem: "ลูกปิงปองกลิ้งตกจากขอบโต๊ะสูง $1.25\\ \\mathrm{m}$ ด้วยความเร็วแนวราบ $3\\ \\mathrm{m/s}$ ลูกปิงปองกระทบพื้นด้วยอัตราเร็วเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ และไม่คิดแรงต้านอากาศ (ตอบเป็นตัวเลขในหน่วย m/s)"
    answer: { value: 5.79, tolerance: 0.06, unit: m/s }
    hints:
      - "ความเร็วตอนกระทบพื้นมีสององค์ประกอบ แนวราบยังเป็น $3\\ \\mathrm{m/s}$"
      - "หา $v_y$ จาก $v_y^2 = 2gh$ แล้วรวมด้วย $v = \\sqrt{v_x^2 + v_y^2}$"
    misconceptions:
      - { match: 4.95, feedback: "นี่คือความเร็วแนวดิ่งอย่างเดียว ลูกปิงปองยังมีความเร็วแนวราบ $3\\ \\mathrm{m/s}$ ต้องรวมแบบเวกเตอร์" }
      - { match: 7.95, feedback: "ดูเหมือนนำสององค์ประกอบมาบวกกันตรง ๆ องค์ประกอบทั้งสองตั้งฉากกัน ต้องรวมด้วยทฤษฎีบทพีทาโกรัส" }
    solution: "$v_y = \\sqrt{2gh} = \\sqrt{2(9.8)(1.25)} = \\sqrt{24.5} \\approx 4.95\\ \\mathrm{m/s}$ และ $v_x = 3\\ \\mathrm{m/s}$ จึงได้ $v = \\sqrt{3^2 + 24.5} = \\sqrt{33.5} \\approx 5.79\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.proj.p017
    topics: [physics.kinematics.projectile]
    difficulty: 4
    type: numeric
    stem: "ในสนามฟุตบอลของโรงเรียน นักเรียนเตะลูกบอลจากพื้นด้วยความเร็ว $15\\ \\mathrm{m/s}$ ทำมุม $45^\\circ$ กับพื้น ห่างออกไปในแนวราบ $18\\ \\mathrm{m}$ มีกำแพงสูง $2.5\\ \\mathrm{m}$ ดังภาพ เมื่อลูกบอลเคลื่อนที่ไปถึงแนวกำแพง ลูกบอลอยู่สูงจากพื้นเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ และไม่คิดแรงต้านอากาศ (ตอบเป็นตัวเลขในหน่วย m)"
    figure:
      src: wall-kick.svg
      alt: "ลูกบอลวางบนพื้นราบ ลูกศรความเร็วต้น 15 m/s ทำมุม 45 องศากับพื้น ห่างออกไปในแนวราบ 18 m มีกำแพงตั้งตรงสูง 2.5 m"
    answer: { value: 3.89, tolerance: 0.04, unit: m }
    hints:
      - "หาเวลาที่ลูกบอลใช้เคลื่อนที่ไปถึงแนวกำแพงจากการเคลื่อนที่แนวราบ"
      - "$t = \\dfrac{18}{15\\cos 45^\\circ}$ แล้วแทนในสมการแนวดิ่ง $y = u_y t - \\tfrac{1}{2}gt^2$"
    misconceptions:
      - { match: 5.67, feedback: "ดูเหมือนใช้ $15\\ \\mathrm{m/s}$ ทั้งก้อนเป็นความเร็วแนวราบ ต้องใช้องค์ประกอบ $15\\cos 45^\\circ \\approx 10.6\\ \\mathrm{m/s}$" }
      - { match: -10.22, feedback: "ได้ค่าติดลบแปลว่าลืม $\\tfrac{1}{2}$ ในพจน์ $\\tfrac{1}{2}gt^2$ ลูกบอลไม่ได้มุดลงใต้ดิน" }
    solution: "$u_x = u_y = 15\\cos 45^\\circ \\approx 10.61\\ \\mathrm{m/s}$ เวลาถึงกำแพง $t = \\dfrac{18}{10.61} \\approx 1.697\\ \\mathrm{s}$ ความสูง $y = (10.61)(1.697) - \\tfrac{1}{2}(9.8)(1.697)^2 \\approx 18.0 - 14.11 = 3.89\\ \\mathrm{m}$ สูงกว่ากำแพง $2.5\\ \\mathrm{m}$ ลูกบอลจึงข้ามกำแพงได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.proj.p018
