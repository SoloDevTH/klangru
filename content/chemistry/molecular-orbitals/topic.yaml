id: chemistry.bonding.molecular-orbitals
subject: chemistry
title: { th: ทฤษฎีออร์บิทัลเชิงโมเลกุล, en: Molecular orbital theory }
summary: รวมออร์บิทัลอะตอมเป็นออร์บิทัลโมเลกุลแบบพันธะและแอนติบอนดิง เขียนแผนภาพระดับพลังงานของโมเลกุลคาบ 2 หาอันดับพันธะ และอธิบายว่าทำไม O₂ เป็นพาราแมกเนติก
difficulty: 7.5
minutes: 45
prerequisites: [chemistry.bonding.hybridization]
encompasses:
  - { id: chemistry.matter.quantum-numbers-orbitals, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: s-orbital-combination.svg
    alt: "สามกลุ่มภาพ กลุ่มซ้ายคือออร์บิทัล 1s ของอะตอม A และ B เป็นวงกลมสองวงเครื่องหมายบวกทั้งคู่ กลุ่มกลางคือวงรีใหญ่ครอบคลุมนิวเคลียสทั้งสองไม่มีเส้นแบ่ง กลุ่มขวาคือวงกลมสีฟ้าและสีแดงสองวงคั่นด้วยเส้นประแนวตั้งตรงกลางซึ่งเป็นระนาบโหนด"
    caption: "ซ้อนเหลื่อมแบบเฟสเดียวกันได้ออร์บิทัลพันธะที่อิเล็กตรอนอยู่ระหว่างนิวเคลียส ซ้อนเหลื่อมต่างเฟสได้แอนติบอนดิงที่มีระนาบโหนด"
  - type: worked-example
    title: หาอันดับพันธะและจำนวนอิเล็กตรอนไม่จับคู่ของ O₂
    problem: "โมเลกุล O₂ มีอิเล็กตรอนวงนอก 12 ตัว (ไม่นับ 1s) จงหาอันดับพันธะและจำนวนอิเล็กตรอนไม่จับคู่"
    steps:
      - text: "เติมอิเล็กตรอนตามลำดับพลังงาน: σ2s² σ*2s² σ2p² π2p⁴ π*2p² (ใช้ 12 ตัว)"
        why: "ออร์บิทัลพันธะต่ำกว่าแอนติบอนดิง เติมทีละคู่ตามหลักของ Aufbau"
      - text: "อิเล็กตรอนพันธะ = σ2s² + σ2p² + π2p⁴ = 8 ตัว และอิเล็กตรอนแอนติบอนดิง = σ*2s² + π*2p² = 4 ตัว"
      - text: "อันดับพันธะ = (8 − 4) / 2 = 2"
        why: "อิเล็กตรอนแอนติบอนดิงหนึ่งคู่หักล้างพันธะหนึ่งพันธะ จึงหารด้วย 2 หลังหักแล้ว"
      - text: "ใน π*2p มีสองออร์บิทัลที่เสื่อมกัน อิเล็กตรอนสองตัวเข้าคนละออร์บิทัลตามกฎของฮุนด์ จึงมีอิเล็กตรอนไม่จับคู่สองตัว"
        why: "การเติมอิเล็กตรอนเข้าออร์บิทัลที่ระดับเท่ากันทีละตัวก่อนจับคู่ทำให้พลังงานต่ำกว่า"
    answer: "อันดับพันธะ 2 และมีอิเล็กตรอนไม่จับคู่ 2 ตัว จึงเป็นพาราแมกเนติก"
  - { type: check, problem: chemistry.bonding.molecular-orbitals.p003, prompt: "หักอิเล็กตรอนแอนติบอนดิงออกก่อน" }
  - type: figure
    src: mo-o2-diagram.svg
    alt: "แผนภาพระดับพลังงานสามคอลัมน์ คอลัมน์ซ้ายและขวาเป็นออร์บิทัลของอะตอม O 2s และ 2p ส่วนตรงกลางเป็นออร์บิทัลโมเลกุลเรียงจากล่างขึ้นบน σ2s σ*2s σ2p π2p π*2p และ σ*2p ลูกศรขึ้นลงในแต่ละระดับแสดงการจัดอิเล็กตรอน π*2p มีลูกศรขึ้นคนละตัวสองช่องที่ระดับเท่ากัน"
    caption: "ไดอะแกรมของ O₂ ออร์บิทัล π*2p สองช่องที่เสื่อมกันมีอิเล็กตรอนช่องละหนึ่งตัว ทำให้มีอิเล็กตรอนไม่จับคู่สองตัว"
  - type: worked-example
    title: เปรียบเทียบอันดับพันธะของไอออนที่เพิ่มหรือลดอิเล็กตรอน
    problem: "ไอออน O₂⁺ และ O₂⁻ มีอันดับพันธะเท่าไร และอันดับพันธะเกี่ยวข้องกับความยาวพันธะอย่างไร"
    steps:
      - text: "O₂⁺ มี 11 อิเล็กตรอนวงนอก เพราะเสียไป 1 ตัวจาก O₂ (12 ตัว): พันธะ 8 แอนติบอนดิง 3 จึงได้ (8 − 3)/2 = 2.5"
        why: "ตัดอิเล็กตรอนออกจากออร์บิทัลแอนติบอนดิงที่เติมล่าสุดจะเพิ่มอันดับพันธะ"
      - text: "O₂⁻ มี 13 อิเล็กตรอนวงนอก เพราะรับเพิ่ม 1 ตัว: พันธะ 8 แอนติบอนดิง 5 จึงได้ (8 − 5)/2 = 1.5"
      - text: "อันดับพันธะสูงขึ้นมักทำให้พันธะสั้นขึ้นและแข็งแรงขึ้น ดังนั้น O₂⁺ มีพันธะแข็งกว่า O₂⁻ แต่ค่านี้เป็นแนวโน้มเชิงคุณภาพ ไม่ใช่ตัวเลขที่บทนี้ยืนยันเชิงปริมาณ"
    answer: "O₂⁺ มีอันดับพันธะ 2.5 และ O₂⁻ มีอันดับพันธะ 1.5 อันดับพันธะที่สูงกว่ามักสัมพันธ์กับพันธะที่สั้นและแข็งกว่า"
  - { type: check, problem: chemistry.bonding.molecular-orbitals.p005, prompt: "นับอิเล็กตรอนก่อนที่จะคำนวณ" }
glossary:
  - { term: ออร์บิทัลโมเลกุล, definition: "ออร์บิทัลที่อิเล็กตรอนอยู่ได้ทั่วทั้งโมเลกุล เกิดจากการรวมออร์บิทัลของอะตอมทั้งหมดที่ร่วมพันธะ" }
  - { term: ออร์บิทัลพันธะ, definition: "ออร์บิทัลโมเลกุลที่มีพลังงานต่ำกว่าออร์บิทัลอะตอมเดิม อิเล็กตรอนอยู่ระหว่างนิวเคลียสทำให้ยึดเหนี่ยวกัน" }
  - { term: ออร์บิทัลแอนติบอนดิง, definition: "ออร์บิทัลโมเลกุลที่มีพลังงานสูงกว่าเดิมและมีระนาบโหนดระหว่างนิวเคลียส อิเล็กตรอนในนั้นทำให้พันธะอ่อนลง" }
  - { term: อันดับพันธะ, definition: "ครึ่งหนึ่งของผลต่างระหว่างจำนวนอิเล็กตรอนในออร์บิทัลพันธะและแอนติบอนดิง คำนวณได้จาก (พันธะ − แอนติบอนดิง) / 2" }
  - { term: พาราแมกเนติก, definition: "สมบัติของสารที่มีอิเล็กตรอนไม่จับคู่อย่างน้อยหนึ่งตัว ทำให้ถูกดึงเข้าหาสนามแม่เหล็ก" }
flashcards:
  - { front: "อันดับพันธะของ O₂ เท่ากับเท่าไร", back: "2 จาก (8 − 4) / 2 โดยนับอิเล็กตรอนพันธะ 8 และแอนติบอนดิง 4" }
  - { front: "ทำไม O₂ จึงดูดเข้าหาแม่เหล็ก", back: "มีอิเล็กตรอนไม่จับคู่สองตัวใน π*2p จึงเป็นพาราแมกเนติก" }
  - { front: "He₂ มีอยู่ได้หรือไม่", back: "ไม่เสถียร อันดับพันธะ (2 − 2) / 2 = 0" }
  - { front: "ลำดับของ σ2p และ π2p ในโมเลกุลคาบ 2 ที่หนักกว่า N₂", back: "σ2p ต่ำกว่า π2p" }
