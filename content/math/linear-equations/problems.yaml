      - { match: 120, feedback: "ดูเหมือนใช้ 30 แทนเวลา 30 นาที ได้ $100t = 80(t + 30)$ ต้องเปลี่ยนเป็นชั่วโมงก่อน 30 นาที $= 0.5$ ชั่วโมง" }
    solution: "$100t = 80(t + 0.5)$ → $100t = 80t + 40$ → $20t = 40$ → $t = 2$ ชั่วโมง ตรวจ: รถเก๋ง $100 \\times 2 = 200$ km รถตู้ $80 \\times 2.5 = 200$ km ✓"
