  color: "#4d7c0f"
- id: business
  title: { th: บริหารธุรกิจ, en: Business administration }
  description: การจัดการ การตลาด บัญชี การเงิน และการเป็นผู้ประกอบการ
  color: "#8a6d1f"
- id: management
  title: { th: การจัดการ, en: Management }
