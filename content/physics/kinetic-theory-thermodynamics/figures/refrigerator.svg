<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="sans-serif" font-size="14">
<title>วัฏจักรของตู้เย็นและเครื่องปรับอากาศ</title>
<rect x="0" y="0" width="720" height="380" fill="#ffffff"/>
<rect x="20.0" y="60.0" width="240.0" height="250.0" rx="12" fill="#eef4fb" stroke="#1f5fa8" stroke-width="2"/>
<text x="140.0" y="90.0" text-anchor="middle" fill="#1f5fa8" font-size="14" font-weight="bold">ในห้องหรือในตู้ (เย็น)</text>
<rect x="460.0" y="60.0" width="240.0" height="250.0" rx="12" fill="#fdf0ea" stroke="#c0392b" stroke-width="2"/>
<text x="580.0" y="90.0" text-anchor="middle" fill="#c0392b" font-size="14" font-weight="bold">นอกห้อง (ร้อน)</text>
<rect x="170.0" y="120.0" width="40.0" height="140.0" rx="6" fill="#ffffff" stroke="#15211e" stroke-width="2"/>
<text x="190.0" y="280.0" text-anchor="middle" fill="#15211e" font-size="13">คอยล์เย็น</text>
<rect x="510.0" y="120.0" width="40.0" height="140.0" rx="6" fill="#ffffff" stroke="#15211e" stroke-width="2"/>
<text x="530.0" y="280.0" text-anchor="middle" fill="#15211e" font-size="13">คอยล์ร้อน</text>
<line x1="210.0" y1="140.0" x2="330.0" y2="140.0" stroke="#15211e" stroke-width="2.5"/>
<circle cx="360.0" cy="140.0" r="28.0" fill="#ffe08a" stroke="#15211e" stroke-width="2.5"/>
<text x="360.0" y="145.0" text-anchor="middle" fill="#15211e" font-size="14" font-weight="bold">อัด</text>
<line x1="388.0" y1="140.0" x2="495.6" y2="140.0" stroke="#15211e" stroke-width="2.5"/>
<polygon points="505.0,140.0 494.0,135.1 494.0,144.9" fill="#15211e" stroke="#15211e" stroke-width="1" stroke-linejoin="round"/>
<text x="360.0" y="70.0" text-anchor="middle" fill="#15211e" font-size="13">คอมเพรสเซอร์อัดแก๊ส</text>
<text x="360.0" y="90.0" text-anchor="middle" fill="#777" font-size="12">งานทำต่อแก๊ส แก๊สร้อนขึ้น</text>
<line x1="510.0" y1="240.0" x2="390.0" y2="240.0" stroke="#15211e" stroke-width="2.5"/>
<rect x="340.0" y="228.0" width="40.0" height="24.0" rx="3" fill="#cfe0f5" stroke="#15211e" stroke-width="2"/>
