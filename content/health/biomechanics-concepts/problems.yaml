problems:
  - id: health.movement.biomechanics-concepts.p001
    topics: [health.movement.biomechanics-concepts]
    difficulty: 1
    type: mcq
    stem: "เมื่อกระโดดลงจากที่สูงเล็กน้อย ควรลงพื้นอย่างไรจึงปลอดภัยที่สุด"
    choices:
      - { id: a, text: "ลงด้วยปลายเท้าแล้วงอเข่าและสะโพกยุบตัวตามแรง", correct: true }
      - { id: b, text: "ลงด้วยส้นเท้าโดยเข่าตรง", feedback: "เข่าตรงทำให้หยุดเร็วมาก แรงกระแทกจึงสูงและส่งขึ้นไปถึงหลังและศีรษะ" }
      - { id: c, text: "เอามือข้างเดียวยันพื้นก่อน", feedback: "แรงทั้งหมดจะไปลงที่ข้อมือข้างเดียว เสี่ยงข้อมือหัก" }
    hints:
      - "ยิ่งใช้เวลาหยุดนาน แรงกระแทกยิ่งน้อย"
      - "ข้อต่อที่งอได้ช่วยยืดเวลาหยุด"
    solution: "ลงด้วยปลายเท้าแล้วงอข้อเท้า เข่า และสะโพก ยุบตัวตามแรง เพื่อยืดเวลาหยุดและลดแรงกระแทก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.biomechanics-concepts.p002
    topics: [health.movement.biomechanics-concepts]
    difficulty: 1
    type: mcq
    stem: "ยืนบนรถเมล์ที่กำลังวิ่ง ท่าใดทรงตัวได้ดีที่สุด"
    choices:
      - { id: a, text: "แยกเท้ากว้างประมาณช่วงไหล่ ย่อเข่าเล็กน้อย และจับราว", correct: true }
      - { id: b, text: "ยืนเท้าชิดตัวตรง", feedback: "ฐานรองรับแคบและจุดศูนย์ถ่วงสูง เมื่อรถเบรกจะเสียหลักง่าย" }
      - { id: c, text: "ยืนขาเดียวพิงเสา", feedback: "ยืนขาเดียวมีฐานรองรับเล็กมาก ไม่มั่นคง" }
    hints:
      - "ฐานรองรับกว้างช่วยให้มั่นคง"
      - "จุดศูนย์ถ่วงต่ำช่วยให้มั่นคง"
    solution: "แยกเท้าให้ฐานกว้าง ย่อเข่าให้จุดศูนย์ถ่วงต่ำ และจับราวเพิ่มจุดรองรับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.biomechanics-concepts.p003
    topics: [health.movement.biomechanics-concepts]
    difficulty: 1
    type: text
    stem: "จุดที่เสมือนเป็นที่รวมน้ำหนักทั้งหมดของร่างกาย เรียกว่าอะไร"
    accepted: ["จุดศูนย์ถ่วง", "ศูนย์ถ่วง", "center of gravity", "centre of gravity", "จุดศูนย์กลางมวล", "ศูนย์กลางมวล"]
    misconceptions:
      - { match: "ฐานรองรับ", feedback: "ฐานรองรับคือพื้นที่ที่ร่างกายแตะพื้น จุดที่รวมน้ำหนักคือจุดศูนย์ถ่วง" }
    hints:
      - "เมื่อยืนตรงอยู่ประมาณระดับสะโพก"
      - "คำนี้มีคำว่า ถ่วง"
    solution: "จุดศูนย์ถ่วง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.biomechanics-concepts.p004
    topics: [health.movement.biomechanics-concepts]
    difficulty: 2
    type: order
    stem: "ดูภาพท่ายืน A B C แล้วเรียงจากท่าที่ล้มง่ายที่สุดไปท่าที่มั่นคงที่สุด"
    figure:
      src: balance-quiz.svg
      alt: "ภาพคนสามท่าติดตัวอักษร ท่า A ยืนแยกเท้าตัวตรง ฐานรองรับกว้าง จุดศูนย์ถ่วงสูง ท่า B แยกเท้ากว้างเท่าท่า A และย่อเข่า จุดศูนย์ถ่วงต่ำลง ท่า C ยืนเท้าชิดตัวตรง ฐานรองรับแคบ จุดศูนย์ถ่วงสูง"
    items:
      - "ท่า C"
      - "ท่า A"
      - "ท่า B"
    hints:
      - "เทียบความกว้างของฐานรองรับก่อน"
      - "ถ้าฐานกว้างเท่ากัน ท่าที่จุดศูนย์ถ่วงต่ำกว่ามั่นคงกว่า"
    solution: "C ฐานแคบ จุดศูนย์ถ่วงสูง → A ฐานกว้าง จุดศูนย์ถ่วงสูง → B ฐานกว้าง จุดศูนย์ถ่วงต่ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.biomechanics-concepts.p005
    topics: [health.movement.biomechanics-concepts]
    difficulty: 2
    type: order
    stem: "เรียงลำดับการส่งแรงเมื่อขว้างลูกซอฟต์บอลให้ไกลที่สุด"
    items:
      - "ก้าวเท้าและถีบพื้น"
      - "หมุนสะโพกไปทางเป้า"
      - "บิดลำตัวตาม"
      - "เหวี่ยงไหล่และแขน"
      - "สะบัดข้อมือปล่อยลูก"
    hints:
      - "เริ่มจากส่วนที่ใหญ่และอยู่ใกล้พื้นที่สุด"
      - "จบที่ส่วนที่เล็กที่สุดซึ่งสัมผัสลูก"
    solution: "ขา → สะโพก → ลำตัว → ไหล่และแขน → ข้อมือ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.biomechanics-concepts.p006
    topics: [health.movement.biomechanics-concepts]
    difficulty: 2
    type: match
    stem: "จับคู่การกระทำกับหลักการเคลื่อนไหวที่ใช้"
    pairs:
      - { left: "ดึงมือเข้าหาตัวเมื่อรับลูกบาสเกตบอล", right: "การรับแรงโดยยืดเวลาหยุด" }
      - { left: "ถีบพื้นแล้วเหวี่ยงแขนขึ้นตอนกระโดดสูง", right: "การใช้แรง" }
      - { left: "ยืนขาเดียวกางแขนบนคานทรงตัว", right: "ความสมดุล" }
      - { left: "ม้วนตัวเมื่อล้มบนเบาะ", right: "การรับแรงโดยกระจายแรงไปบนพื้นที่กว้าง" }
    hints:
      - "รับแรง = ลดแรงกระแทกที่เข้ามา ใช้แรง = ส่งแรงออกไป"
      - "ความสมดุลเกี่ยวกับการไม่ล้ม"
    solution: "ดึงมือรับลูก-รับแรงโดยยืดเวลาหยุด, ม้วนตัว-รับแรงโดยกระจายแรง, ถีบพื้นเหวี่ยงแขน-การใช้แรง, ยืนบนคาน-ความสมดุล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.biomechanics-concepts.p007
    topics: [health.movement.biomechanics-concepts]
    difficulty: 2
    type: numeric
    stem: "จากแผนภูมิ ระยะยืนกระโดดไกลแบบไม่เหวี่ยงแขนของนักเรียน 5 คน มีค่าเฉลี่ยกี่เซนติเมตร (ตอบเป็นเซนติเมตร)"
    figure:
      src: jump-data.svg
      alt: "แผนภูมิแท่งระยะยืนกระโดดไกลเป็นเซนติเมตร ของนักเรียน 5 คน แบบไม่เหวี่ยงแขนและแบบเหวี่ยงแขน ต้น 150 และ 168 ฝน 132 และ 145 เก่ง 160 และ 181 มายด์ 140 และ 152 บอส 148 และ 164"
    answer: { value: 146, unit: เซนติเมตร }
    misconceptions:
      - { match: 730, feedback: "730 คือผลรวม ต้องหารด้วยจำนวนคน 5" }
      - { match: 162, feedback: "162 คือค่าเฉลี่ยแบบเหวี่ยงแขน คำถามถามแบบไม่เหวี่ยงแขน" }
    hints:
      - "ใช้แท่งสีเทา"
      - "รวมทั้ง 5 ค่าแล้วหารด้วย 5"
    solution: "(150 + 132 + 160 + 140 + 148) ÷ 5 = 730 ÷ 5 = 146 เซนติเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.biomechanics-concepts.p008
    topics: [health.movement.biomechanics-concepts]
    difficulty: 3
    type: numeric
    stem: "จากแผนภูมิ ค่าเฉลี่ยระยะยืนกระโดดไกลแบบเหวี่ยงแขนมากกว่าแบบไม่เหวี่ยงแขนกี่เซนติเมตร (ตอบเป็นเซนติเมตร)"
    figure:
      src: jump-data.svg
      alt: "แผนภูมิแท่งระยะยืนกระโดดไกลเป็นเซนติเมตร ของนักเรียน 5 คน แบบไม่เหวี่ยงแขนและแบบเหวี่ยงแขน ต้น 150 และ 168 ฝน 132 และ 145 เก่ง 160 และ 181 มายด์ 140 และ 152 บอส 148 และ 164"
    answer: { value: 16, unit: เซนติเมตร }
    misconceptions:
      - { match: 80, feedback: "80 คือผลต่างของผลรวม (810 − 730) ต้องหารด้วย 5 คน" }
      - { match: 21, feedback: "21 คือผลต่างของเก่งคนเดียว คำถามถามค่าเฉลี่ยทั้ง 5 คน" }
    hints:
      - "หาค่าเฉลี่ยของแต่ละแบบก่อน"
      - "ค่าเฉลี่ยแบบเหวี่ยงแขนลบค่าเฉลี่ยแบบไม่เหวี่ยงแขน"
    solution: "แบบเหวี่ยงแขน 810 ÷ 5 = 162 แบบไม่เหวี่ยงแขน 730 ÷ 5 = 146 ต่างกัน 162 − 146 = 16 เซนติเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.biomechanics-concepts.p009
    topics: [health.movement.biomechanics-concepts]
    difficulty: 3
    type: numeric
    stem: "จากแผนภูมิ ฝนกระโดดได้ 132 เซนติเมตรเมื่อไม่เหวี่ยงแขน และ 145 เซนติเมตรเมื่อเหวี่ยงแขน ระยะของฝนเพิ่มขึ้นร้อยละเท่าไร (ตอบเป็นร้อยละ ทศนิยม 1 ตำแหน่ง)"
    figure:
      src: jump-data.svg
      alt: "แผนภูมิแท่งระยะยืนกระโดดไกลเป็นเซนติเมตร ของนักเรียน 5 คน แบบไม่เหวี่ยงแขนและแบบเหวี่ยงแขน ต้น 150 และ 168 ฝน 132 และ 145 เก่ง 160 และ 181 มายด์ 140 และ 152 บอส 148 และ 164"
    answer: { value: 9.8, tolerance: 0.1, unit: "%" }
    misconceptions:
      - { match: 13, feedback: "13 คือระยะที่เพิ่มเป็นเซนติเมตร ต้องหารด้วยค่าเดิมแล้วคูณ 100" }
      - { match: 8.97, feedback: "หารด้วย 145 ไม่ถูก ร้อยละที่เพิ่มขึ้นต้องหารด้วยค่าเดิม 132" }
    hints:
      - "ร้อยละที่เพิ่มขึ้น = (ค่าใหม่ − ค่าเดิม) ÷ ค่าเดิม × 100"
      - "ค่าเดิมคือแบบไม่เหวี่ยงแขน 132"
    solution: "(145 − 132) ÷ 132 × 100 = 13 ÷ 132 × 100 ≈ 9.8 คือเพิ่มขึ้นประมาณร้อยละ 9.8"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.biomechanics-concepts.p010
    topics: [health.movement.biomechanics-concepts]
    difficulty: 3
    type: mcq
    stem: "นักกีฬาแฮนด์บอลรับลูกที่ส่งมาแรงมาก ข้อใดอธิบายการรับลูกที่ถูกหลักได้ดีที่สุด"
    choices:
      - { id: a, text: "ยื่นสองมือไปรับ แล้วงอศอกดึงลูกเข้าหาตัว เพื่อยืดเวลาหยุดลูกและลดแรงกระแทก", correct: true }
      - { id: b, text: "เกร็งแขนให้ตรงและแข็ง ลูกจะได้ไม่หลุดมือ", feedback: "แขนแข็งทำให้ลูกหยุดในเวลาสั้นมาก แรงกระแทกสูง ลูกจึงกระดอนหลุดมือและนิ้วอาจเจ็บ" }
      - { id: c, text: "รับด้วยมือข้างเดียวให้เร็วที่สุด", feedback: "มือข้างเดียวรับแรงบนพื้นที่เล็ก แรงไม่กระจาย" }
    hints:
      - "แรงเฉลี่ย = โมเมนตัม ÷ เวลาที่ใช้หยุด"
      - "ทำอย่างไรให้เวลาหยุดนานขึ้นและพื้นที่รับแรงกว้างขึ้น"
    solution: "ใช้สองมือเพื่อกระจายแรง และงอศอกดึงลูกเข้าหาตัวเพื่อยืดเวลาหยุด แรงกระแทกเฉลี่ยจึงลดลง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.biomechanics-concepts.p011
    topics: [health.movement.biomechanics-concepts]
    difficulty: 3
    type: mcq
    stem: "นักมวยไทยยืนแยกเท้าหน้าหลัง ย่อเข่าเล็กน้อย ขณะเตรียมรับเตะหรือดันคู่ต่อสู้ การยืนแบบนี้ใช้หลักความสมดุลข้อใดเด่นที่สุด"
    choices:
      - { id: a, text: "ขยายฐานรองรับไปในทิศที่แรงจะมาถึง และลดจุดศูนย์ถ่วงให้ต่ำ", correct: true }
      - { id: b, text: "ทำให้จุดศูนย์ถ่วงสูงขึ้นเพื่อกระโดดได้เร็ว", feedback: "การย่อเข่าทำให้จุดศูนย์ถ่วงต่ำลง ไม่ใช่สูงขึ้น" }
      - { id: c, text: "ทำให้ฐานรองรับแคบลงเพื่อหมุนตัวง่าย", feedback: "การแยกเท้าหน้าหลังทำให้ฐานกว้างขึ้นในแนวหน้าหลัง" }
    hints:
      - "แรงเตะหรือแรงดันมักมาจากด้านหน้า"
      - "แยกเท้าแนวไหนจึงต้านแรงจากด้านหน้าได้"
    solution: "การแยกเท้าหน้าหลังขยายฐานรองรับในแนวที่แรงจะมา และการย่อเข่าลดจุดศูนย์ถ่วง ทำให้ถูกดันแล้วแนวดิ่งจากจุดศูนย์ถ่วงยังอยู่ในฐาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.biomechanics-concepts.p012
    topics: [health.movement.biomechanics-concepts]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ต้องยกลังน้ำดื่มจากพื้นขึ้นวางบนโต๊ะ ข้อใดใช้หลักการเคลื่อนไหวได้ถูกต้องและลดการบาดเจ็บที่หลัง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "แยกเท้าให้ฐานรองรับกว้าง", correct: true }
      - { id: b, text: "ย่อเข่าลง หลังตรง แล้วใช้แรงขาดันตัวขึ้น", correct: true }
      - { id: c, text: "ถือลังให้ชิดลำตัว", correct: true }
      - { id: d, text: "ขาตรง ก้มหลังลงไปยก", feedback: "การก้มหลังให้หลังรับแรงทั้งหมด กล้ามเนื้อหลังมีขนาดเล็กกว่าขา เสี่ยงปวดหลัง" }
      - { id: e, text: "บิดเอวหมุนตัวขณะยก", feedback: "การบิดเอวขณะรับน้ำหนักเสี่ยงต่อการบาดเจ็บที่หลัง ควรหมุนทั้งตัวด้วยการก้าวเท้า" }
    hints:
      - "ใช้กล้ามเนื้อใหญ่ (ขา) และฐานรองรับกว้าง"
      - "ของที่อยู่ไกลตัวทำให้หลังต้องรับแรงมากขึ้น"
    solution: "แยกเท้า ย่อเข่าหลังตรงใช้แรงขา และถือลังชิดตัว เป็นการใช้หลักความสมดุลและการใช้แรงในชีวิตประจำวัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.biomechanics-concepts.p013
    topics: [health.movement.biomechanics-concepts]
    difficulty: 4
    type: mcq
    stem: "จากแผนภูมิระยะยืนกระโดดไกล นักเรียนคนใดมีระยะเพิ่มขึ้นเป็นร้อยละมากที่สุดเมื่อเหวี่ยงแขน"
    figure:
      src: jump-data.svg
      alt: "แผนภูมิแท่งระยะยืนกระโดดไกลเป็นเซนติเมตร ของนักเรียน 5 คน แบบไม่เหวี่ยงแขนและแบบเหวี่ยงแขน ต้น 150 และ 168 ฝน 132 และ 145 เก่ง 160 และ 181 มายด์ 140 และ 152 บอส 148 และ 164"
    choices:
      - { id: a, text: "เก่ง (เพิ่มขึ้นประมาณร้อยละ 13.1)", correct: true }
      - { id: b, text: "ต้น (เพิ่มขึ้นร้อยละ 12)", feedback: "ต้นเพิ่ม 18 ÷ 150 × 100 = 12 ซึ่งน้อยกว่าเก่งที่เพิ่ม 21 ÷ 160 × 100 ≈ 13.1" }
      - { id: c, text: "บอส (เพิ่มขึ้นประมาณร้อยละ 10.8)", feedback: "บอสเพิ่ม 16 ÷ 148 × 100 ≈ 10.8 น้อยกว่าเก่ง" }
      - { id: d, text: "ฝน เพราะเดิมกระโดดได้น้อยที่สุด", feedback: "ฝนเพิ่ม 13 ÷ 132 × 100 ≈ 9.8 การกระโดดได้น้อยไม่ได้แปลว่าเพิ่มได้มากที่สุด ต้องคำนวณ" }
    hints:
      - "หาร้อยละที่เพิ่มขึ้นของแต่ละคน"
      - "(ค่าใหม่ − ค่าเดิม) ÷ ค่าเดิม × 100"
    solution: "ต้น 12.0 ฝน 9.8 เก่ง 13.1 มายด์ 8.6 บอส 10.8 เก่งเพิ่มขึ้นมากที่สุดประมาณร้อยละ 13.1"
