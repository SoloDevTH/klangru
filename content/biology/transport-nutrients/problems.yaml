problems:
  - id: biology.plants.transport-nutrients.p001
    topics: [biology.plants.transport-nutrients]
    difficulty: 1
    type: mcq
    stem: "ไซเลมทำหน้าที่ลำเลียงอะไร"
    choices:
      - { id: a, text: "น้ำและธาตุอาหารจากรากขึ้นไปยังส่วนต่าง ๆ", correct: true }
      - { id: b, text: "น้ำตาลจากใบไปยังส่วนต่าง ๆ", feedback: "นี่คือหน้าที่ของโฟลเอ็ม" }
      - { id: c, text: "แก๊สออกซิเจนจากใบลงไปที่ราก", feedback: "แก๊สเข้าออกทางปากใบและแพร่ระหว่างเซลล์ ไม่ได้ลำเลียงทางไซเลมเป็นหลัก" }
      - { id: d, text: "แสงจากใบไปยังราก", feedback: "แสงไม่ได้ถูกลำเลียงในพืช ใบใช้แสงสร้างอาหาร" }
    hints:
      - "นึกถึงขึ้นฉ่ายที่แช่น้ำสีแดง"
      - "ท่อนี้รับของจากรากแล้วส่งขึ้น"
    solution: "ไซเลมลำเลียงน้ำและธาตุอาหารที่รากดูดมา ขึ้นไปยังลำต้น ใบ และดอก ในทิศทางเดียว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.transport-nutrients.p002
    topics: [biology.plants.transport-nutrients]
    difficulty: 1
    type: text
    stem: "เนื้อเยื่อที่ลำเลียงน้ำตาลที่ใบสร้างขึ้นไปยังส่วนต่าง ๆ ของพืช เรียกว่าอะไร"
    accepted: ["โฟลเอ็ม", "โฟลเอม", "phloem"]
    hints:
      - "พืชมีเนื้อเยื่อลำเลียงสองชนิด"
      - "ชนิดนี้ไม่ได้ลำเลียงน้ำจากราก"
    misconceptions:
      - { match: "ไซเลม", feedback: "ไซเลมลำเลียงน้ำและธาตุอาหาร ส่วนอาหารที่ใบสร้างใช้อีกชนิดหนึ่ง" }
      - { match: "ไซเล็ม", feedback: "ไซเลมลำเลียงน้ำและธาตุอาหาร ส่วนอาหารที่ใบสร้างใช้อีกชนิดหนึ่ง" }
    solution: "โฟลเอ็ม ลำเลียงน้ำตาลจากใบไปยังยอด ราก ผล และส่วนที่เก็บอาหาร ได้ทั้งขึ้นและลง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.transport-nutrients.p003
    topics: [biology.plants.transport-nutrients]
    difficulty: 1
    type: match
    stem: "จับคู่ธาตุอาหารกับความสำคัญต่อพืช"
    pairs:
      - { left: "ไนโตรเจน (N)", right: "ช่วยให้ใบเขียว ต้นและใบเติบโต" }
      - { left: "ฟอสฟอรัส (P)", right: "ช่วยสร้างราก ดอก และเมล็ด" }
      - { left: "โพแทสเซียม (K)", right: "ช่วยให้ผลหวานและลำต้นแข็งแรง" }
      - { left: "แมกนีเซียม (Mg)", right: "เป็นส่วนประกอบของคลอโรฟิลล์" }
    hints:
      - "ผักกินใบต้องการธาตุใดมาก"
      - "ไม้ผลช่วงผลโตต้องการธาตุใดมาก"
    solution: "ไนโตรเจนช่วยการเติบโตของใบ ฟอสฟอรัสช่วยราก ดอก และเมล็ด โพแทสเซียมช่วยให้ผลหวานและต้นแข็งแรง แมกนีเซียมเป็นส่วนของคลอโรฟิลล์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.transport-nutrients.p004
    topics: [biology.plants.transport-nutrients]
    difficulty: 2
    type: order
    stem: "เรียงเส้นทางของน้ำในต้นพืช ตั้งแต่ดินจนออกจากใบ"
    items:
      - "ขนรากดูดน้ำจากดิน"
      - "น้ำเข้าสู่ไซเลมในราก"
      - "น้ำขึ้นตามไซเลมในลำต้น"
      - "น้ำไปถึงเซลล์ในใบ"
      - "น้ำระเหยเป็นไอออกทางปากใบ"
    hints:
      - "น้ำเข้าทางรากและออกทางใบ"
      - "ไซเลมต่อจากรากผ่านลำต้นไปถึงใบ"
    solution: "ขนราก → ไซเลมในราก → ไซเลมในลำต้น → เซลล์ในใบ → ระเหยออกทางปากใบ (การคายน้ำ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.transport-nutrients.p005
    topics: [biology.plants.transport-nutrients]
    difficulty: 2
    type: mcq
    stem: "นักเรียนแช่ก้านขึ้นฉ่ายในน้ำสีแดงทิ้งไว้ 6 ชั่วโมง แล้วหั่นก้านตามขวาง จะเห็นสีแดงที่ใด และสรุปได้ว่าอย่างไร"
    choices:
      - { id: a, text: "เป็นจุดเรียงกันในก้าน คือไซเลมที่ลำเลียงน้ำขึ้นไป", correct: true }
      - { id: b, text: "ทั่วทั้งหน้าตัดเท่ากัน เพราะน้ำซึมไปทุกเซลล์พร้อมกัน", feedback: "สีแดงขึ้นตามท่อลำเลียงเป็นจุด ไม่ได้กระจายเท่ากันทุกเซลล์" }
      - { id: c, text: "เป็นจุดเรียงกัน คือโฟลเอ็มที่ลำเลียงน้ำ", feedback: "โฟลเอ็มลำเลียงอาหาร ส่วนน้ำขึ้นทางไซเลม" }
      - { id: d, text: "ไม่มีสีแดงเลย เพราะพืชดูดน้ำทางรากเท่านั้น", feedback: "ก้านที่ตัดแล้วยังดูดน้ำขึ้นทางไซเลมได้ เพราะใบยังคายน้ำ" }
    hints:
      - "น้ำสีเคลื่อนที่ไปพร้อมน้ำ"
      - "น้ำขึ้นตามเนื้อเยื่อใด และเนื้อเยื่อนั้นอยู่เป็นมัดหรือกระจายทั่ว"
    solution: "สีแดงขึ้นไปพร้อมกับน้ำในไซเลม ซึ่งอยู่ในมัดท่อลำเลียงที่เรียงเป็นวง จึงเห็นเป็นจุดสีแดงในหน้าตัด แสดงว่าน้ำลำเลียงขึ้นทางไซเลม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.transport-nutrients.p006
    topics: [biology.plants.transport-nutrients]
    difficulty: 2
    type: numeric
    stem: "จากภาพฉลากกระสอบปุ๋ย ปุ๋ยสูตร 46-0-0 หนึ่งกระสอบมีไนโตรเจนกี่กิโลกรัม"
    figure: { src: p-fertilizer-bags.svg, alt: "ฉลากกระสอบปุ๋ยเคมี 3 กระสอบ กระสอบที่ 1 สูตร 15-15-15 น้ำหนักสุทธิ 25 กิโลกรัม กระสอบที่ 2 สูตร 46-0-0 น้ำหนักสุทธิ 50 กิโลกรัม กระสอบที่ 3 สูตร 13-13-21 น้ำหนักสุทธิ 50 กิโลกรัม ใต้สูตรทุกกระสอบเขียนว่า N - P₂O₅ - K₂O" }
    answer: { value: 23, unit: kg }
    hints:
      - "ตัวเลขแรกของสูตรคือร้อยละของไนโตรเจน"
      - "คูณน้ำหนักกระสอบด้วยร้อยละ แล้วหารด้วย 100"
    misconceptions:
      - { match: 46, feedback: "46 เป็นร้อยละ ไม่ใช่กิโลกรัม ต้องคิดร้อยละ 46 ของ 50 กิโลกรัม" }
      - { match: 50, feedback: "50 กิโลกรัมคือน้ำหนักปุ๋ยทั้งกระสอบ ไม่ใช่ไนโตรเจนทั้งหมด" }
    solution: "ไนโตรเจน $= 50 \\times \\frac{46}{100} = 23$ กิโลกรัม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.transport-nutrients.p007
    topics: [biology.plants.transport-nutrients]
    difficulty: 2
    type: mcq
    stem: "หัวมันสำปะหลังที่อยู่ใต้ดินสะสมแป้งไว้มาก น้ำตาลที่ใช้สร้างแป้งเดินทางมาจากไหน ผ่านเนื้อเยื่อใด"
    choices:
      - { id: a, text: "มาจากใบ ลงมาทางโฟลเอ็ม", correct: true }
      - { id: b, text: "มาจากดิน ขึ้นมาทางไซเลม", feedback: "พืชไม่ได้ดูดน้ำตาลจากดิน ใบเป็นแหล่งสร้างน้ำตาล" }
      - { id: c, text: "มาจากใบ ลงมาทางไซเลม", feedback: "ไซเลมลำเลียงขึ้นทางเดียว อาหารที่ลงไปที่หัวต้องผ่านโฟลเอ็ม" }
      - { id: d, text: "หัวมันสร้างน้ำตาลเองด้วยแสง", feedback: "หัวมันอยู่ใต้ดิน ไม่ได้รับแสงและไม่มีคลอโรฟิลล์" }
    hints:
      - "ส่วนใดของพืชสร้างน้ำตาลด้วยการสังเคราะห์ด้วยแสง"
      - "เนื้อเยื่อใดลำเลียงอาหารได้ทั้งขึ้นและลง"
    solution: "ใบสร้างน้ำตาลด้วยการสังเคราะห์ด้วยแสง แล้วส่งลงมาทางโฟลเอ็มไปสะสมเป็นแป้งในหัวมันสำปะหลัง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.transport-nutrients.p008
    topics: [biology.plants.transport-nutrients]
    difficulty: 3
    type: mcq
    stem: "แปลงผักคะน้าของคุณป้า ต้นแคระแกร็น ใบแก่ด้านล่างเหลืองซีดทั้งใบ แต่ดินชุ่มน้ำดี ควรเลือกปุ๋ยใดมาแก้ไข"
    choices:
      - { id: a, text: "ปุ๋ยไนโตรเจนสูง เช่น 46-0-0", correct: true }
      - { id: b, text: "ปุ๋ยโพแทสเซียมสูง เช่น 0-0-60", feedback: "ขาดโพแทสเซียมมักทำให้ขอบใบแก่ไหม้ ไม่ใช่ใบเหลืองทั้งใบและต้นแคระ" }
      - { id: c, text: "ปุ๋ยฟอสฟอรัสสูง เช่น 0-46-0", feedback: "ขาดฟอสฟอรัสมักทำให้ใบมีสีม่วงแดงและรากไม่เจริญ" }
      - { id: d, text: "รดน้ำเพิ่มอย่างเดียว", feedback: "ดินชุ่มน้ำดีอยู่แล้ว ปัญหาคือขาดธาตุอาหาร" }
    hints:
      - "อาการใบแก่เหลืองซีดและต้นแคระเป็นอาการขาดธาตุใด"
      - "ผักกินใบต้องการธาตุนี้มาก"
    solution: "ใบแก่เหลืองซีดทั้งใบและต้นแคระแกร็นเป็นอาการขาดไนโตรเจน ผักคะน้าเป็นผักกินใบที่ต้องการไนโตรเจนมาก จึงควรใช้ปุ๋ยไนโตรเจนสูง เช่น 46-0-0 ตามปริมาณที่ฉลากแนะนำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.transport-nutrients.p009
    topics: [biology.plants.transport-nutrients]
    difficulty: 3
    type: numeric
    stem: "จากภาพฉลากกระสอบปุ๋ย ปุ๋ยสูตร 15-15-15 หนึ่งกระสอบมีโพแทสเซียม (คิดในรูป K₂O) กี่กิโลกรัม"
    figure: { src: p-fertilizer-bags.svg, alt: "ฉลากกระสอบปุ๋ยเคมี 3 กระสอบ กระสอบที่ 1 สูตร 15-15-15 น้ำหนักสุทธิ 25 กิโลกรัม กระสอบที่ 2 สูตร 46-0-0 น้ำหนักสุทธิ 50 กิโลกรัม กระสอบที่ 3 สูตร 13-13-21 น้ำหนักสุทธิ 50 กิโลกรัม ใต้สูตรทุกกระสอบเขียนว่า N - P₂O₅ - K₂O" }
    answer: { value: 3.75, tolerance: 0.01, unit: kg }
    hints:
      - "ตัวเลขที่สามของสูตรคือร้อยละของโพแทสเซียม"
      - "ดูน้ำหนักของกระสอบสูตรนี้ให้ดี ไม่ใช่ 50 กิโลกรัม"
    misconceptions:
      - { match: 7.5, feedback: "ใช้น้ำหนัก 50 กิโลกรัม แต่กระสอบสูตร 15-15-15 หนัก 25 กิโลกรัม" }
      - { match: 11.25, feedback: "รวมธาตุทั้งสามตัว โจทย์ถามเฉพาะโพแทสเซียม" }
    solution: "โพแทสเซียม $= 25 \\times \\frac{15}{100} = 3.75$ กิโลกรัม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.transport-nutrients.p010
    topics: [biology.plants.transport-nutrients]
    difficulty: 3
    type: mcq
    stem: "ชาวสวนควั่นกิ่งลำไยโดยลอกเปลือกออกเป็นวงรอบกิ่ง ไม่ได้ตัดเนื้อไม้ ผ่านไป 3 สัปดาห์ จะเห็นผลอย่างไร"
    choices:
      - { id: a, text: "เปลือกเหนือรอยควั่นบวมพอง ใบบนกิ่งยังสด", correct: true }
      - { id: b, text: "เปลือกใต้รอยควั่นบวมพอง ใบบนกิ่งยังสด", feedback: "อาหารลงมาจากใบซึ่งอยู่ด้านบน จึงมาค้างอยู่ด้านเหนือรอยควั่น" }
      - { id: c, text: "ใบบนกิ่งเหี่ยวตาย เพราะน้ำขึ้นไปไม่ได้", feedback: "ไซเลมอยู่ในเนื้อไม้ซึ่งไม่ได้ถูกตัด น้ำจึงยังขึ้นไปได้" }
      - { id: d, text: "ไม่มีอะไรเปลี่ยนแปลง", feedback: "เปลือกมีโฟลเอ็ม เมื่อลอกออก อาหารจะเคลื่อนผ่านรอยควั่นไม่ได้" }
    hints:
      - "โฟลเอ็มอยู่ในเปลือก ไซเลมอยู่ในเนื้อไม้"
      - "อาหารมาจากใบซึ่งอยู่ทางปลายกิ่ง"
    solution: "การลอกเปลือกตัดโฟลเอ็ม อาหารจากใบลงไปด้านล่างไม่ได้จึงสะสมเหนือรอยควั่นจนบวม แต่ไซเลมในเนื้อไม้ยังส่งน้ำขึ้นไป ใบจึงยังสด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.transport-nutrients.p011
    topics: [biology.plants.transport-nutrients]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ธาตุใดเป็นธาตุอาหารหลักของพืช (เลือกได้หลายข้อ)"
    choices:
      - { id: a, text: "ไนโตรเจน", correct: true }
      - { id: b, text: "ฟอสฟอรัส", correct: true }
      - { id: c, text: "โพแทสเซียม", correct: true }
      - { id: d, text: "แคลเซียม", feedback: "แคลเซียมเป็นธาตุอาหารรอง พืชต้องการน้อยกว่าธาตุอาหารหลัก" }
      - { id: e, text: "เหล็ก", feedback: "เหล็กเป็นจุลธาตุ พืชต้องการน้อยมาก" }
    hints:
      - "ธาตุอาหารหลักคือธาตุที่ตัวย่อปรากฏในสูตรปุ๋ย"
      - "สูตรปุ๋ยเรียงเป็น N-P-K"
    solution: "ธาตุอาหารหลักมี 3 ธาตุ คือ ไนโตรเจน (N) ฟอสฟอรัส (P) และโพแทสเซียม (K) แคลเซียมเป็นธาตุอาหารรอง ส่วนเหล็กเป็นจุลธาตุ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.transport-nutrients.p012
    topics: [biology.plants.transport-nutrients]
    difficulty: 3
    type: mcq
    stem: "ชาวสวนลำไยที่จังหวัดลำพูนต้องการบำรุงต้นให้ออกดอกมาก ช่วงก่อนออกดอกควรเลือกปุ๋ยสูตรใด"
    choices:
      - { id: a, text: "8-24-24", correct: true }
      - { id: b, text: "46-0-0", feedback: "ไนโตรเจนสูงเร่งใบ ถ้าใส่ช่วงนี้ต้นอาจแตกใบอ่อนแทนการออกดอก" }
      - { id: c, text: "21-0-0", feedback: "สูตรนี้มีแต่ไนโตรเจน เหมาะกับผักกินใบมากกว่า" }
      - { id: d, text: "ไม่ต้องใส่ปุ๋ยเลย", feedback: "ไม้ผลที่ให้ผลทุกปีใช้ธาตุอาหารจากดินมาก จึงควรเติมให้เหมาะกับช่วงการเติบโต" }
    hints:
