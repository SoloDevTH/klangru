# หัวข้อในคลังกับ Australian Curriculum: Health and Physical Education V9.0 (F–10)
# จับคู่จากเนื้อหาใน lesson.md และ problems.yaml จริง (ตรวจ 2026-10-24)
# AC9 HPE เน้นทักษะ (ตีความข้อมูลสุขภาพ วางแผน ประเมิน) ไม่ได้ระบุเนื้อหาโภชนาการหรือ BMI โดยตรง จึงจับคู่ได้เพียงบางส่วน
# หัวข้อ content/health ที่มี topic.yaml lesson.md problems.yaml ครบ ณ วันที่จับคู่: health.nutrition.basics, health.body.bmi-growth (health/first-aid ยังไม่มี problems.yaml จึงไม่จับคู่)
framework: au-ac9-hpe
mappings:
  - topic: health.nutrition.basics
    indicators: ["AC9HP4P09", "AC9HP6P09"]
    coverage: partial
    note: "อ่านฉลากโภชนาการและธงโภชนาการเพื่อใช้ข้อมูลสุขภาพในการเลือกอาหาร ยังไม่วิเคราะห์เจตนาของโฆษณาและสื่อ"
  - topic: health.body.bmi-growth
    indicators: ["AC9HP6P09"]
    coverage: partial
    note: "คำนวณและแปลผล BMI และบอกข้อจำกัดของตัวชี้วัดนี้ เป็นส่วนหนึ่งของการใช้ข้อมูลสุขภาพ ยังไม่มีการเปลี่ยนแปลงช่วงวัยรุ่น (AC9HP6P02)"
  - topic: health.community.diversity-inclusion
    indicators: [AC9HP4P03, AC9HP4P05]
    coverage: full
  - topic: health.community.diversity-inclusion
    indicators: [AC9HP6P05, AC9HP8P05, AC9HP10P05]
    coverage: partial
    note: สอนการให้คุณค่าความหลากหลายและกลยุทธ์ระดับบุคคล กลุ่ม และชุมชน (บทเรียนส่วนทำให้ทุกคนมีส่วนร่วม และ p013, p018) แต่การนำไปปฏิบัติในชุมชนจริงทำนอกแอป
  - topic: health.family.respectful-relationships
    indicators: [AC9HP8P04]
    coverage: full
  - topic: health.family.respectful-relationships
    indicators: [AC9HP6P04, AC9HP6P07, AC9HP8P07, AC9HP8P03, AC9HP10P03, AC9HP10P04, AC9HP10P07]
    coverage: partial
    note: สอนการแสดงความเคารพและความเห็นอกเห็นใจในคำพูดและการกระทำ (บทเรียนส่วนความเคารพและ p001) แต่การแสดงออกจริงในความสัมพันธ์ทำนอกแอป
  - topic: health.fitness.active-lifestyle
    indicators: [AC9HP4M06, AC9HP6M06]
    coverage: full
  - topic: health.fitness.active-lifestyle
    indicators: [AC9HPFM03, AC9HP2M03, AC9HP4M04, AC9HP4M05, AC9HP6M04, AC9HP6M05, AC9HP8M05, AC9HP10M05, AC9HP8M06, AC9HP10M04, AC9HP10M06]
    coverage: partial
    note: ตัวชี้วัดขึ้นต้นด้วยการเข้าร่วมกิจกรรมจริงในธรรมชาติ ซึ่งทำนอกแอป แอปสอนประโยชน์ของการเคลื่อนไหวและปัจจัยที่ทำให้คนเข้าร่วมหรือไม่เข้าร่วม (p012 และบทเรียน) แต่ไม่ได้วัดการเข้าร่วม
  - topic: health.mental.feelings-basics
    indicators: [AC9HPFP03, AC9HP2P03]
    coverage: full
  - topic: health.mental.feelings-basics
    indicators: [AC9HP4P06]
    coverage: partial
    note: บทเรียนและโจทย์อธิบายว่าการตอบสนองทางอารมณ์ต่างกันได้เพราะประสบการณ์ ความเหนื่อย และความหิว (p010, p011) และสอนกลยุทธ์จัดการอารมณ์ (หายใจนับจังหวะ นับถึงสิบ ขอเวลาพัก บอกผู้ใหญ่) แต่ตัวชี้วัดให้ฝึก (practise) ซึ่งทำจริงนอกแอปและวัดไม่ได้ และระดับ 3–4 สูงกว่าความยากของหัวข้อนี้ (ความยาก 1)
  - topic: health.mental.resilience-identity
    indicators: [AC9HP2P01]
    coverage: full
  - topic: health.mental.resilience-identity
    indicators: [AC9HP4P01, AC9HP6P01, AC9HP8P01, AC9HP10P01, AC9HP4P02, AC9HP6P02, AC9HP8P02, AC9HP10P02]
    coverage: partial
    note: สอนว่าความล้มเหลวและการดูผลช่วยสร้างความยืดหยุ่น (p007, p011, p009 และบทเรียนส่วนความยืดหยุ่นทางใจ ซึ่งมีตัวอย่างจากการสอบและการยิงลูกโทษในกีฬา) แต่ตัวชี้วัดให้สืบค้น (investigate) ในหลายบริบท บทเรียนมีเพียงสองบริบทและโจทย์ส่วนใหญ่อยู่ในบริบทการเรียน การสืบค้นจริงทำนอกแอป
  - topic: health.sport.modified-games-inclusion
    indicators: [AC9HP8M08]
    coverage: full
  - topic: health.sport.modified-games-inclusion
    indicators: [AC9HP2M04, AC9HP4M08, AC9HP6M08, AC9HP10M08]
    coverage: partial
    note: สอนการตั้งกติการ่วมกัน (บทเรียนส่วนให้ทุกคนช่วยตั้งกติกา p003) การใช้กติกาและระบบคะแนนเพื่อความยุติธรรม (p004, p005, p013) แต่การใช้กติกาและการเล่นจริงในกิจกรรมทำนอกแอป
