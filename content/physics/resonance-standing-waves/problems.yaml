  - id: physics.waves.resonance-standing-waves.p017
    topics: [physics.waves.resonance-standing-waves]
    difficulty: 5
    type: numeric
    stem: "เชือกตรึงปลายทั้งสองถูกเครื่องสั่นด้วยความถี่คงที่ เห็นคลื่นนิ่ง 4 ลูป ถ้าเพิ่มแรงตึงเชือกเป็น 4 เท่าโดยความถี่ของเครื่องสั่นเท่าเดิม จะเห็นคลื่นนิ่งกี่ลูป"
    answer: { value: 2, tolerance: 0, unit: ลูป }
    misconceptions:
      - { match: 1, feedback: "คิดว่าอัตราเร็วเพิ่ม 4 เท่าตามแรงตึง แต่ $v = \\sqrt{T/\\mu}$ อัตราเร็วเพิ่มเพียง 2 เท่า" }
      - { match: 8, feedback: "แรงตึงมากขึ้นทำให้คลื่นเร็วขึ้น ความยาวคลื่นที่ความถี่เดิมยาวขึ้น ลูปจึงต้องน้อยลง ไม่ใช่มากขึ้น" }
