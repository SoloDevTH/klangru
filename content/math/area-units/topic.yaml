id: math.measure.area-units
subject: math
title: { th: "แนวคิดพื้นที่: ตารางหน่วยและการนับ", en: "Area concepts: unit squares and counting" }
summary: พื้นที่คือจำนวนตารางหน่วยที่ปูเต็มรูป นับตารางหน่วย แบ่งสี่เหลี่ยมเป็นแถวและหลัก รู้จักตารางเซนติเมตร ตารางเมตร และหาความยาวรอบรูปของรูปง่าย ๆ
difficulty: 1.5
minutes: 30
prerequisites: [math.geometry.shapes, math.number.whole-mul-div]
encompasses:
  - { id: math.number.whole-mul-div, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: rows-columns.svg
    alt: "สี่เหลี่ยมผืนผ้าแบ่งเป็นตารางหน่วย 3 แถว แถวละ 5 ช่อง แต่ละแถวระบายสีต่างกัน ข้างภาพเขียนว่า 3 แถว แถวละ 5 ช่อง 5 + 5 + 5 = 15 และ 3 × 5 = 15 ตารางหน่วย ใต้ภาพเขียนว่า 1 ช่อง = 1 ตารางหน่วย"
    caption: "ทุกแถวมีจำนวนช่องเท่ากัน จึงใช้การคูณแทนการนับทีละช่องได้"
  - type: worked-example
    title: นับแถวและหลัก
    problem: "ผนังห้องครัวปูกระเบื้องจัตุรัสเป็นสี่เหลี่ยมผืนผ้า 4 แถว แถวละ 7 แผ่น ผนังส่วนนี้มีพื้นที่กี่แผ่นกระเบื้อง"
    steps:
      - text: "ทุกแถวมีกระเบื้อง 7 แผ่นเท่ากัน"
        why: "ถ้าทุกแถวเท่ากัน ใช้การบวกซ้ำหรือการคูณได้"
      - text: "บวกซ้ำ: $7 + 7 + 7 + 7 = 28$"
      - text: "หรือคูณ: $4 \\times 7 = 28$"
    answer: "28 แผ่น (28 ตารางหน่วย เมื่อกระเบื้อง 1 แผ่นเป็น 1 ตารางหน่วย)"
  - { type: check, problem: math.measure.area-units.p004, prompt: "นับแถว แล้วคูณด้วยจำนวนช่องในแต่ละแถว" }
  - type: figure
    src: l-shape.svg
    alt: "รูปตัวแอลบนตาราง แบ่งด้วยเส้นประเป็นสองส่วน ส่วนสีเขียวด้านซ้ายกว้าง 2 ช่อง สูง 4 ช่อง มี 8 ช่อง ส่วนสีส้มด้านล่างขวากว้าง 3 ช่อง สูง 2 ช่อง มี 6 ช่อง ความยาวด้านตามขอบเรียงรอบรูปคือ 2, 2, 3, 2, 5, 4 ข้างภาพเขียนว่า พื้นที่ 8 + 6 = 14 ตารางหน่วย และความยาวรอบรูป 2 + 2 + 3 + 2 + 5 + 4 = 18 หน่วย"
    caption: "พื้นที่: แบ่งเป็นสี่เหลี่ยมแล้วบวก ความยาวรอบรูป: เดินตามขอบแล้วบวกทุกด้าน (ไม่นับเส้นประ)"
  - type: worked-example
    title: พื้นที่และความยาวรอบรูปของรูปตัวแอล
    problem: "รูปตัวแอลในภาพ มีพื้นที่และความยาวรอบรูปเท่าไร"
    steps:
      - text: "แบ่งรูปด้วยเส้นประเป็นสองสี่เหลี่ยม: ส่วนซ้าย 4 แถว แถวละ 2 ช่อง ได้ $4 \\times 2 = 8$"
      - text: "ส่วนขวาล่าง 2 แถว แถวละ 3 ช่อง ได้ $2 \\times 3 = 6$"
      - text: "พื้นที่ $= 8 + 6 = 14$ ตารางหน่วย"
        why: "สองส่วนไม่ซ้อนกันและไม่มีช่องว่าง จึงบวกกันได้"
      - text: "เดินรอบขอบจากมุมซ้ายบน: $2 + 2 + 3 + 2 + 5 + 4 = 18$ หน่วย"
        why: "เส้นประอยู่ข้างในรูป ไม่ใช่ขอบ จึงไม่นับ"
    answer: "พื้นที่ 14 ตารางหน่วย ความยาวรอบรูป 18 หน่วย"
  - { type: check, problem: math.measure.area-units.p009, prompt: "นับขอบ ไม่ใช่นับช่อง" }
glossary:
  - { term: พื้นที่, definition: "ความกว้างขวางของพื้นผิวภายในรูป วัดเป็นจำนวนตารางหน่วยที่ปูได้เต็มพอดี" }
  - { term: ตารางหน่วย, definition: "สี่เหลี่ยมจัตุรัสยาวด้านละ 1 หน่วย มีพื้นที่ 1 ตารางหน่วย" }
  - { term: ตารางเซนติเมตร, definition: "พื้นที่ของสี่เหลี่ยมจัตุรัสยาวด้านละ 1 เซนติเมตร" }
  - { term: ตารางเมตร, definition: "พื้นที่ของสี่เหลี่ยมจัตุรัสยาวด้านละ 1 เมตร ใช้วัดพื้นห้องหรือสนาม" }
  - { term: ความยาวรอบรูป, definition: "ผลรวมความยาวของทุกด้านรอบรูป วัดเป็นหน่วยความยาว" }
flashcards:
  - { front: "พื้นที่ของรูปหาได้อย่างไรเมื่อรูปอยู่บนตาราง", back: "นับตารางหน่วยที่ปูรูปเต็มพอดี ไม่มีช่องว่างและไม่ซ้อนกัน" }
  - { front: "สี่เหลี่ยม 3 แถว แถวละ 5 ช่อง มีพื้นที่เท่าไร", back: "3 × 5 = 15 ตารางหน่วย" }
  - { front: "ครึ่งช่อง 2 ชิ้นเท่ากับเท่าไร", back: "1 ตารางหน่วย" }
  - { front: "พื้นที่กับความยาวรอบรูปต่างกันอย่างไร", back: "พื้นที่วัดข้างในเป็นตารางหน่วย ความยาวรอบรูปวัดขอบเป็นหน่วยความยาว" }
