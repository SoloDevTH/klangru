id: math.stats.central-tendency
subject: math
title: { th: ค่ากลางของข้อมูล, en: Measures of central tendency }
summary: หาค่าเฉลี่ยเลขคณิต มัธยฐาน ฐานนิยม และค่าเฉลี่ยถ่วงน้ำหนัก แล้วเลือกค่ากลางที่เป็นตัวแทนของข้อมูลได้ดีที่สุด
difficulty: 2.5
minutes: 35
prerequisites: [math.number.decimals]
encompasses:
  - { id: math.number.decimals, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: mean-balance-point.svg
    alt: "ข้อมูล 3, 5, 6 และ 10 วางเป็นลูกตุ้มบนคานเหนือเส้นจำนวน 0 ถึง 12 จุดหมุนรูปสามเหลี่ยมอยู่ที่ 6 ซึ่งเป็นค่าเฉลี่ย ข้อมูลทางซ้ายห่างจาก 6 รวม 3 + 1 = 4 หน่วย ข้อมูลทางขวาห่าง 4 หน่วย คานจึงสมดุล"
    caption: "ค่าเฉลี่ยคือจุดที่ผลรวมระยะห่างทางซ้ายเท่ากับผลรวมระยะห่างทางขวา"
  - { type: check, problem: math.ctr.p016, prompt: "ใช้แนวคิดจุดสมดุลที่เพิ่งเห็น" }
  - type: worked-example
    title: ตรวจค่าเฉลี่ยด้วยจุดสมดุล
    problem: "แสดงว่าค่าเฉลี่ยของ 2, 5, 8, 13 คือ 7 ทั้งด้วยสูตรและด้วยระยะห่างจากค่าเฉลี่ย"
    steps:
      - text: "ใช้สูตร: $\\bar{x} = \\dfrac{2 + 5 + 8 + 13}{4} = \\dfrac{28}{4} = 7$"
      - text: "ข้อมูลที่น้อยกว่า 7 คือ 2 และ 5 ห่างจาก 7 เป็น $5$ และ $2$ รวม $7$"
      - text: "ข้อมูลที่มากกว่า 7 คือ 8 และ 13 ห่างจาก 7 เป็น $1$ และ $6$ รวม $7$"
      - text: "ระยะห่างสองฝั่งเท่ากัน คานจึงสมดุลที่ 7 พอดี ✓"
        why: "ถ้าลองจุดหมุนที่ 6 ฝั่งซ้ายห่างรวม $4 + 1 = 5$ ฝั่งขวาห่างรวม $2 + 7 = 9$ ไม่เท่ากัน คานจะเอียงไปทางขวา แปลว่าจุดสมดุลต้องขยับไปทางขวา"
    answer: "ค่าเฉลี่ยคือ 7 และผลรวมระยะห่างทั้งสองฝั่งเท่ากับ 7 เท่ากัน"
  - type: figure
    src: distribution-shapes.svg
    alt: "ฮิสโทแกรมสองรูป รูปซ้ายสมมาตร แท่งสูงที่สุดอยู่ตรงกลาง เส้นค่าเฉลี่ยกับมัธยฐานทับกันที่ 35 รูปขวาเบ้ขวา แท่งสูงอยู่ทางซ้ายและมีหางยาวไปทางขวา เส้นมัธยฐานอยู่ที่ 15 ส่วนเส้นค่าเฉลี่ยอยู่ทางขวาของมัธยฐานที่ประมาณ 22"
    caption: "หางยาวดึงค่าเฉลี่ยไปทางหาง แต่มัธยฐานแทบไม่ขยับ"
  - type: worked-example
    title: เลือกค่ากลางให้เหมาะกับรูปร่างของข้อมูล
    problem: "เวลาเดินทางมาโรงเรียน (นาที) ของนักเรียน 10 คน: 5, 8, 10, 10, 12, 12, 15, 15, 18, 55 ควรรายงานค่ากลางใด และได้ค่าเท่าใด"
    steps:
      - text: "ค่าเฉลี่ย: ผลรวม $= 160$ นาที หารด้วย 10 คน ได้ $16$ นาที"
      - text: "มัธยฐาน: ข้อมูลเรียงแล้ว มี 10 ตัว ตัวที่ 5 และ 6 คือ 12 และ 12 มัธยฐาน $= \\tfrac{12 + 12}{2} = 12$ นาที"
      - text: "ฐานนิยม: 10, 12 และ 15 ปรากฏสองครั้งเท่ากัน จึงมีสามค่า ไม่ช่วยสรุปมากนัก"
      - text: "ข้อมูลมีค่าผิดปกติ 55 ทำให้เบ้ขวา ค่าเฉลี่ย 16 มากกว่าเวลาของนักเรียน 8 ใน 10 คน"
        why: "ถ้าตัด 55 ออก ค่าเฉลี่ยลดเหลือประมาณ 11.7 แต่มัธยฐานยังเป็น 12 มัธยฐานจึงทนต่อค่าผิดปกติมากกว่า"
      - text: "จึงรายงานมัธยฐาน: \"นักเรียน 10 คนใช้เวลาเดินทางโดยมัธยฐาน 12 นาที\""
    answer: "รายงานมัธยฐาน 12 นาที เพราะข้อมูลเบ้ขวาจากค่าผิดปกติ"
  - { type: check, problem: math.ctr.p017, prompt: "ข้อมูลแบบนี้เบ้ไปทางไหน" }
  - type: simulation
    title: ค่าเฉลี่ยคือการแบ่งให้เท่ากัน (PhET Mean Share and Balance)
    url: https://phet.colorado.edu/en/simulations/mean-share-and-balance
    provider: phet
    note: ใส่จำนวนขนมในแต่ละกองไม่เท่ากัน แล้วแบ่งให้ทุกกองเท่ากัน จำนวนต่อกองที่ได้คือค่าเฉลี่ย ลองเพิ่มกองที่มีขนมมาก ๆ กองเดียว แล้วดูว่าค่าเฉลี่ยเปลี่ยนไปมากแค่ไหน
glossary:
  - { term: ค่าเฉลี่ยเลขคณิต, definition: "ผลรวมของข้อมูลทุกตัวหารด้วยจำนวนข้อมูล" }
  - { term: มัธยฐาน, definition: "ค่าที่อยู่ตรงกลางเมื่อเรียงข้อมูลจากน้อยไปมาก ถ้าจำนวนข้อมูลเป็นคู่ ใช้ค่าเฉลี่ยของสองตัวตรงกลาง" }
  - { term: ฐานนิยม, definition: "ค่าที่ปรากฏบ่อยที่สุดในข้อมูล" }
  - { term: ค่าเฉลี่ยถ่วงน้ำหนัก, definition: "ค่าเฉลี่ยที่ข้อมูลแต่ละตัวมีน้ำหนักไม่เท่ากัน คำนวณจากผลรวมของน้ำหนักคูณข้อมูล หารด้วยผลรวมของน้ำหนัก" }
  - { term: ค่าผิดปกติ, definition: "ข้อมูลที่สูงหรือต่ำกว่าข้อมูลส่วนใหญ่มาก ดึงค่าเฉลี่ยได้มากแต่แทบไม่กระทบมัธยฐาน" }
flashcards:
  - { front: "หามัธยฐานของ 9, 2, 7, 4, 5", back: "เรียงก่อน: 2, 4, 5, 7, 9 ตัวตรงกลางคือ 5" }
  - { front: "ข้อมูลมีค่าผิดปกติ ควรใช้ค่ากลางแบบใด", back: "มัธยฐาน เพราะไม่ถูกดึงด้วยค่าที่สูงหรือต่ำผิดปกติเหมือนค่าเฉลี่ย" }
  - { front: "สูตรค่าเฉลี่ยจากตารางความถี่", back: "$\\bar{x} = \\dfrac{\\sum f x}{\\sum f}$ หารด้วยผลรวมของความถี่ ไม่ใช่จำนวนแถว" }
  - { front: "ค่ากลางแบบใดใช้กับข้อมูลเชิงคุณภาพได้", back: "ฐานนิยม เช่น สีเสื้อที่ขายดีที่สุด" }
