  - id: biology.genetics.linkage-mapping.p017
    topics: [biology.genetics.linkage-mapping]
    difficulty: 5
    type: numeric
    stem: "ยีน A B C เรียงกันบนโครโมโซมเดียวกัน ผสมทดสอบได้ลูก 1,000 ตัว มีครอสซิงโอเวอร์สองชั้น AbC 6 ตัว และ aBc 6 ตัว ระยะ A–B เท่ากับ 12 cM และระยะ B–C เท่ากับ 14 cM ค่าการเกิดร่วม (coefficient of coincidence) คำนวณเป็นความถี่ที่พบจริงหารด้วยความถี่ที่คาดไว้จากผลคูณของสองช่วง ได้เท่าไร (ตอบทศนิยมสองตำแหน่ง)"
    answer: { value: 0.71, tolerance: 0.01 }
    misconceptions:
      - { match: 1.4, feedback: "กลับด้านอัตราส่วน ต้องหาร ครอสซิงโอเวอร์สองชั้นที่พบจริงด้วยค่าที่คาดไว้ ไม่ใช่กลับกัน" }
      - { match: 0.0168, feedback: "ตอบค่าที่คาดไว้โดยไม่ได้หารด้วยค่าที่พบจริง" }
    hints:
      - "ครอสซิงโอเวอร์สองชั้นที่พบจริงคือ AbC + aBc หารด้วย 1,000"
      - "ค่าที่คาดไว้ได้จากการคูณความถี่ของสองช่วงเป็นทศนิยม เช่น 0.12 × 0.14"
    solution: "ความถี่ที่พบจริง = (6 + 6) ÷ 1,000 = 0.012 ความถี่ที่คาดไว้ = 0.12 × 0.14 = 0.0168 ค่าการเกิดร่วม = 0.012 ÷ 0.0168 ≈ 0.71 ค่าน้อยกว่า 1 แปลว่าครอสซิงโอเวอร์ครั้งหนึ่งลดโอกาสเกิดอีกครั้งในบริเวณใกล้กัน (การรบกวน = 1 − 0.71 ≈ 0.29) ซึ่งเป็นสิ่งที่พบได้ทั่วไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

