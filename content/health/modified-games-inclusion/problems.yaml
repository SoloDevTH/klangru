- id: health.sport.modified-games-inclusion.p017
  topics:
  - health.sport.modified-games-inclusion
  difficulty: 5
  type: numeric
  stem: สนามเกม 15 × 8 เมตร มี 10 คนเล่นพร้อมกัน ถ้าแบ่งพื้นที่ให้ทุกคนเท่ากัน แต่ละคนได้กี่ตารางเมตร (ตอบเป็นตารางเมตร)
  answer:
    value: 12.0
    tolerance: 0
    unit: ตารางเมตร
  misconceptions:
  - match: 23
    feedback: นั่นคือการบวกความยาวกับความกว้าง ไม่ใช่การหาพื้นที่
  - match: 120
    feedback: นั่นคือพื้นที่ทั้งสนาม ยังไม่ได้แบ่งให้ผู้เล่นแต่ละคน
  hints:
  - หาพื้นที่ทั้งสนามก่อน (ความยาว × ความกว้าง)
  - แล้วแบ่งด้วยจำนวนผู้เล่น
  solution: พื้นที่สนาม = 15 × 8 = 120 ตารางเมตร แบ่งให้ 10 คน = 120 ÷ 10 = 12 ตารางเมตรต่อคน
