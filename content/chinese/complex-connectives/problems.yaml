  choices:
  - id: a
    text: 越学越有意思 (yuè xué yuè yǒuyìsi)。
    correct: true
    feedback: ถูก 越 (yuè)…越 (yuè) ใช้คู่กันทั้งสองส่วน และไม่ใส่ 很 (hěn)
  - id: b
    text: 越学很有意思 (yuè xué hěn yǒuyìsi)。
    feedback: หลัง 越 (yuè) ไม่ใช้ 很 (hěn) และต้องมี 越 (yuè) ทั้งสองตัว
  - id: c
    text: 学越有意思 (xué yuè yǒuyìsi)。
    feedback: ต้องมี 越 (yuè) ทั้งสองตัวจึงจะบอกความยิ่งยิ่ง
  - id: d
    text: 越学越没意思 (yuè xué yuè méi yìsi)。
    feedback: รูปประโยคถูก แต่ความหมายคือ ‘ยิ่งเรียนยิ่งไม่สนุก’
  hints:
  - คู่นี้ต้องมีคำว่า 越 ทั้งสองส่วน
  - ดูว่าประโยคหลัง 越 ต้องมีคำอะไร
  - เลือกประโยคที่มีความหมายว่าสนุก
  solution: '**a. 越学越有意思 (yuè xué yuè yǒuyìsi)。** ยิ่งเรียน ยิ่งสนุก ประโยคมี 越 (yuè) สองตัวและไม่มี 很 (hěn)'
