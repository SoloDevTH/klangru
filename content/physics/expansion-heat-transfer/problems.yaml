    stem: "สะพานเหล็กยาวรวม $400$ เมตร แบ่งเป็น $8$ ช่วงเท่ากัน แต่ละช่วงมีรอยต่อหนึ่งจุด อุณหภูมิพื้นสะพานอยู่ระหว่าง $20$ ถึง $55\\ ^\\circ\\mathrm{C}$ (ค่าสมมติ) เหล็กยืด $0.012$ มิลลิเมตรต่อเมตรต่อองศา รอยต่อแต่ละจุดต้องรับการยืดได้อย่างน้อยกี่มิลลิเมตร"
