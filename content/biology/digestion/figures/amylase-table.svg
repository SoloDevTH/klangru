<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="sans-serif" font-size="14">
<title>ผลการทดลองย่อยแป้งด้วยน้ำลาย</title>
<rect x="0" y="0" width="640" height="300" fill="#ffffff"/>
<rect x="20" y="20" width="600" height="44" fill="#eceff1" stroke="#90a4ae"/>
<text x="55.0" y="48.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">หลอด</text>
<text x="100.0" y="48.0" text-anchor="start" font-size="13" font-weight="bold" fill="#222">สิ่งที่ใส่ในหลอด (แป้ง 5 mL ทุกหลอด)</text>
<text x="450.0" y="48.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">อุณหภูมิ</text>
<text x="555.0" y="48.0" text-anchor="middle" font-size="13" fill="#222"></text>
<text x="555.0" y="40.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">เวลาที่ทดสอบด้วยไอโอดีน</text>
<text x="555.0" y="57.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">แล้วไม่เป็นสีน้ำเงินดำ</text>
<rect x="20" y="64" width="600" height="44" fill="#fff" stroke="#90a4ae"/>
<text x="55.0" y="92.0" text-anchor="middle" font-size="15" fill="#222">ก</text>
<text x="100.0" y="92.0" text-anchor="start" font-size="13" fill="#222">น้ำลาย 1 mL</text>
<text x="450.0" y="92.0" text-anchor="middle" font-size="13" fill="#222">37 °C</text>
<text x="555.0" y="92.0" text-anchor="middle" font-size="13" fill="#222">2 นาที</text>
<rect x="20" y="108" width="600" height="44" fill="#fff" stroke="#90a4ae"/>
<text x="55.0" y="136.0" text-anchor="middle" font-size="15" fill="#222">ข</text>
<text x="100.0" y="136.0" text-anchor="start" font-size="13" fill="#222">น้ำลายที่ต้มเดือดแล้ว 1 mL</text>
<text x="450.0" y="136.0" text-anchor="middle" font-size="13" fill="#222">37 °C</text>
<text x="555.0" y="136.0" text-anchor="middle" font-size="13" fill="#222">เกิน 20 นาที</text>
<rect x="20" y="152" width="600" height="44" fill="#fff" stroke="#90a4ae"/>
<text x="55.0" y="180.0" text-anchor="middle" font-size="15" fill="#222">ค</text>
<text x="100.0" y="180.0" text-anchor="start" font-size="13" fill="#222">น้ำลาย 1 mL + กรดไฮโดรคลอริกเจือจาง</text>
<text x="450.0" y="180.0" text-anchor="middle" font-size="13" fill="#222">37 °C</text>
<text x="555.0" y="180.0" text-anchor="middle" font-size="13" fill="#222">เกิน 20 นาที</text>
<rect x="20" y="196" width="600" height="44" fill="#fff" stroke="#90a4ae"/>
<text x="55.0" y="224.0" text-anchor="middle" font-size="15" fill="#222">ง</text>
<text x="100.0" y="224.0" text-anchor="start" font-size="13" fill="#222">น้ำลาย 1 mL</text>
<text x="450.0" y="224.0" text-anchor="middle" font-size="13" fill="#222">5 °C</text>
<text x="555.0" y="224.0" text-anchor="middle" font-size="13" fill="#222">12 นาที</text>
<rect x="20" y="240" width="600" height="44" fill="#fff" stroke="#90a4ae"/>
<text x="55.0" y="268.0" text-anchor="middle" font-size="15" fill="#222">จ</text>
<text x="100.0" y="268.0" text-anchor="start" font-size="13" fill="#222">น้ำกลั่น 1 mL</text>
<text x="450.0" y="268.0" text-anchor="middle" font-size="13" fill="#222">37 °C</text>
<text x="555.0" y="268.0" text-anchor="middle" font-size="13" fill="#222">เกิน 20 นาที</text>
<line x1="90" y1="20" x2="90" y2="284" stroke="#90a4ae"/>
<line x1="410" y1="20" x2="410" y2="284" stroke="#90a4ae"/>
<line x1="490" y1="20" x2="490" y2="284" stroke="#90a4ae"/>
</svg>