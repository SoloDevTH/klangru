    type: numeric
    stem: "ผสมแก๊สไฮโดรเจน 5.00 g กับแก๊สออกซิเจน 16.0 g แล้วจุดประกายไฟ $\\mathrm{2H_2(g) + O_2(g) \\to 2H_2O(l)}$ เมื่อปฏิกิริยาสิ้นสุด จะเหลือสารที่มากเกินพอกี่กรัม (H = 1.008, O = 16.00)"
