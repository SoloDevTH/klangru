<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 345" width="680" height="345" font-family="sans-serif">
<title>ดัชนีคุณภาพอากาศของประเทศไทย 5 ระดับ</title>
<rect x="0" y="0" width="680" height="345" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="340.0" y="28.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">ดัชนีคุณภาพอากาศ (AQI) ของประเทศไทย และค่า PM2.5 เฉลี่ย 24 ชั่วโมง</text>
<text x="20.0" y="60.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">สี</text>
<text x="80.0" y="60.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">AQI</text>
<text x="170.0" y="60.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">PM2.5 (มคก./ลบ.ม.)</text>
<text x="320.0" y="60.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">คุณภาพอากาศ / ควรทำอย่างไร</text>
<rect x="20.0" y="70.0" width="50.0" height="40.0" rx="4" fill="#3b9fe0" stroke="#333" stroke-width="1.5"/>
<text x="80.0" y="95.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">0–25</text>
<text x="170.0" y="95.0" font-size="15" text-anchor="start" fill="#111">0–15</text>
<text x="320.0" y="87.0" font-size="14" text-anchor="start" font-weight="bold" fill="#111">ดีมาก</text>
<text x="320.0" y="105.0" font-size="13" text-anchor="start" fill="#333">ทำกิจกรรมได้ตามปกติ</text>
<rect x="20.0" y="118.0" width="50.0" height="40.0" rx="4" fill="#3fae49" stroke="#333" stroke-width="1.5"/>
<text x="80.0" y="143.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">26–50</text>
<text x="170.0" y="143.0" font-size="15" text-anchor="start" fill="#111">15.1–25</text>
<text x="320.0" y="135.0" font-size="14" text-anchor="start" font-weight="bold" fill="#111">ดี</text>
<text x="320.0" y="153.0" font-size="13" text-anchor="start" fill="#333">ทำกิจกรรมกลางแจ้งได้ กลุ่มเสี่ยงสังเกตอาการ</text>
<rect x="20.0" y="166.0" width="50.0" height="40.0" rx="4" fill="#f2d13a" stroke="#333" stroke-width="1.5"/>
<text x="80.0" y="191.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">51–100</text>
<text x="170.0" y="191.0" font-size="15" text-anchor="start" fill="#111">25.1–37.5</text>
<text x="320.0" y="183.0" font-size="14" text-anchor="start" font-weight="bold" fill="#111">ปานกลาง</text>
<text x="320.0" y="201.0" font-size="13" text-anchor="start" fill="#333">ลดกิจกรรมกลางแจ้งที่ใช้แรงมาก</text>
<rect x="20.0" y="214.0" width="50.0" height="40.0" rx="4" fill="#f08a24" stroke="#333" stroke-width="1.5"/>
<text x="80.0" y="239.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">101–200</text>
<text x="170.0" y="239.0" font-size="15" text-anchor="start" fill="#111">37.6–75</text>
<text x="320.0" y="231.0" font-size="14" text-anchor="start" font-weight="bold" fill="#111">เริ่มมีผลกระทบต่อสุขภาพ</text>
<text x="320.0" y="249.0" font-size="13" text-anchor="start" fill="#333">สวมหน้ากากกัน PM2.5 ลดเวลานอกอาคาร</text>
<rect x="20.0" y="262.0" width="50.0" height="40.0" rx="4" fill="#d7302b" stroke="#333" stroke-width="1.5"/>
<text x="80.0" y="287.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">201 ขึ้นไป</text>
<text x="170.0" y="287.0" font-size="15" text-anchor="start" fill="#111">75.1 ขึ้นไป</text>
<text x="320.0" y="279.0" font-size="14" text-anchor="start" font-weight="bold" fill="#111">มีผลกระทบต่อสุขภาพ</text>
<text x="320.0" y="297.0" font-size="13" text-anchor="start" fill="#333">งดกิจกรรมกลางแจ้ง มีอาการรีบพบแพทย์</text>
<text x="340.0" y="328.0" font-size="13" text-anchor="middle" fill="#333">ค่ามาตรฐาน PM2.5 เฉลี่ย 24 ชั่วโมง = 37.5 มคก./ลบ.ม. (AQI 100) ตั้งแต่ 1 มิ.ย. 2566</text>
</svg>
