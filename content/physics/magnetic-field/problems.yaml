      - { id: c, text: "ใช้แกนเหล็กอ่อนในขดลวด", correct: true }
      - { id: d, text: "เปลี่ยนแกนเป็นพลาสติกที่เบากว่า", feedback: "พลาสติกไม่ใช่สารแม่เหล็ก ไม่ช่วยเสริมสนาม แกนเหล็กอ่อนต่างหากที่ทำให้สนามแรงขึ้นมาก" }
      - { id: e, text: "กลับทิศกระแสไฟฟ้า", feedback: "กลับทิศกระแสแค่สลับขั้ว N กับ S ความแรงของสนามเท่าเดิม และเศษเหล็กก็ถูกดูดได้ทั้งสองขั้ว" }
    hints:
      - "สนามของโซเลนอยด์ขึ้นกับกระแสและจำนวนรอบต่อความยาว"
      - "วัสดุใดในแกนช่วยเสริมสนามแม่เหล็ก"
    solution: "สนามของแม่เหล็กไฟฟ้าแรงขึ้นเมื่อเพิ่มกระแส เพิ่มจำนวนรอบ และใส่แกนเหล็กอ่อน การกลับทิศกระแสเพียงสลับขั้ว ส่วนแกนพลาสติกไม่ช่วยเสริมสนาม ข้อดีของแม่เหล็กไฟฟ้าคือปิดกระแสเพื่อปล่อยเศษเหล็กได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.mag.p018
    topics: [physics.magnetism.magnetic-field]
    difficulty: 4
    type: numeric
    stem: "โปรตอน (มวล $1.67 \\times 10^{-27}\\ \\mathrm{kg}$ ประจุ $1.6 \\times 10^{-19}\\ \\mathrm{C}$) เคลื่อนที่ด้วยอัตราเร็ว $2 \\times 10^{6}\\ \\mathrm{m/s}$ ในทิศตั้งฉากกับสนามแม่เหล็กสม่ำเสมอ $0.5\\ \\mathrm{T}$ โปรตอนเคลื่อนที่เป็นวงกลมรัศมีเท่าใด (ตอบเป็นตัวเลขในหน่วย cm ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 4.175, tolerance: 0.042, unit: cm }
    hints:
      - "แรงแม่เหล็ก $qvB$ ทำหน้าที่เป็นแรงสู่ศูนย์กลาง $\\dfrac{mv^2}{r}$"
      - "จัดรูปได้ $r = \\dfrac{mv}{qB}$ ได้ผลเป็นเมตร แล้วแปลงเป็นเซนติเมตร"
    misconceptions:
      - { match: 0.04175, feedback: "นั่นคือค่าในหน่วยเมตร โจทย์ถามเป็นเซนติเมตร ต้องคูณ 100" }
      - { match: 0.00228, feedback: "ดูเหมือนใช้มวลของอิเล็กตรอน โปรตอนหนักกว่าอิเล็กตรอนราว 1800 เท่า" }
    solution: "$r = \\dfrac{mv}{qB} = \\dfrac{(1.67 \\times 10^{-27})(2 \\times 10^{6})}{(1.6 \\times 10^{-19})(0.5)} \\approx 0.0418\\ \\mathrm{m} \\approx 4.18\\ \\mathrm{cm}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.mag.p019
    topics: [physics.magnetism.magnetic-field]
    difficulty: 3
    type: mcq
    stem: "อนุภาคประจุบวกพุ่งไปทางขวาเข้าสู่บริเวณที่มีสนามแม่เหล็กสม่ำเสมอพุ่งเข้ากระดาษ ดังภาพ อนุภาคจะเคลื่อนที่ตามเส้นทางใด"
    figure: { src: particle-paths.svg, alt: "อนุภาคประจุบวกทางซ้ายมีลูกศรความเร็วชี้ไปทางขวา เข้าสู่กรอบสี่เหลี่ยมที่เต็มไปด้วยเครื่องหมายกากบาทแทนสนามแม่เหล็กพุ่งเข้ากระดาษ มีเส้นทางประสามเส้นจากจุดที่อนุภาคเข้ากรอบ: A โค้งขึ้นด้านบน B โค้งลงด้านล่าง และ C เป็นเส้นตรงไปทางขวา" }
    choices:
      - { id: a, text: "เส้นทาง A (โค้งขึ้น)", correct: true }
      - { id: b, text: "เส้นทาง B (โค้งลง)", feedback: "เส้นทาง B เป็นของประจุลบ เช่น อิเล็กตรอน ซึ่งได้แรงทิศตรงข้าม ใช้กฎมือขวากับประจุบวกจะได้แรงชี้ขึ้น" }
      - { id: c, text: "เส้นทาง C (ตรงไป)", feedback: "อนุภาคเคลื่อนที่ตั้งฉากกับสนาม จึงถูกแรง $qvB$ เต็มที่ ไม่ได้วิ่งตรง จะวิ่งตรงเฉพาะเมื่อขนานกับสนามหรือไม่มีประจุ" }
    hints:
      - "ใช้กฎมือขวา: นิ้วโป้งตามความเร็ว (ขวา) นิ้วทั้งสี่ตามสนาม (เข้ากระดาษ)"
      - "ฝ่ามือผลักไปทางใด แรงนั้นตั้งฉากกับความเร็วจึงทำให้เส้นทางโค้งไปทางนั้น"
    solution: "นิ้วโป้งชี้ขวา นิ้วทั้งสี่ชี้เข้ากระดาษ ฝ่ามือผลักขึ้น แรงบนประจุบวกจึงชี้ขึ้นตั้งฉากกับความเร็ว อนุภาคเลี้ยวขึ้นเป็นส่วนโค้งของวงกลม (เส้นทาง A) และแรงยังตั้งฉากกับความเร็วตลอดทาง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.mag.p020
    topics: [physics.magnetism.magnetic-field]
    difficulty: 3
    type: mcq
    stem: "สายไฟสองเส้นในสายปลั๊กพ่วงวางขนานกันใกล้ ๆ ขณะเปิดเครื่องใช้ไฟฟ้า กระแสในสองเส้นไหลสวนทางกัน สายไฟสองเส้นออกแรงต่อกันอย่างไร"
    choices:
      - { id: a, text: "ผลักกัน", correct: true }
      - { id: b, text: "ดูดกัน", feedback: "ลวดขนานที่มีกระแสทิศเดียวกันจึงจะดูดกัน กระแสสวนทางกันให้แรงผลัก" }
      - { id: c, text: "ไม่มีแรงต่อกัน เพราะสายไฟไม่มีประจุสุทธิ", feedback: "แม้ลวดเป็นกลางทางไฟฟ้า แต่กระแสในเส้นหนึ่งสร้างสนามแม่เหล็ก และอีกเส้นที่มีกระแสอยู่ในสนามนั้นจึงถูกแรง $ILB$" }
      - { id: d, text: "แรงบิดให้สายพันกัน", feedback: "แรงระหว่างลวดขนานอยู่ในแนวที่เชื่อมลวดทั้งสอง ทำให้ดูดหรือผลักกันตรง ๆ ไม่ได้บิด" }
    hints:
