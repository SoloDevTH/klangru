id: math.geometry.trig-ratios
subject: math
title: { th: อัตราส่วนตรีโกณมิติ, en: Trigonometric ratios }
summary: ใช้ไซน์ โคไซน์ และแทนเจนต์ในสามเหลี่ยมมุมฉาก จำค่ามุม 30 45 60 องศา และหาความสูงหรือระยะทางจากมุมเงยและมุมก้ม
difficulty: 5
minutes: 40
prerequisites: [math.geometry.pythagoras, math.geometry.similarity]
encompasses:
  - { id: math.geometry.pythagoras, weight: 0.3 }
  - { id: math.geometry.similarity, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: side-names.svg
    alt: "สามเหลี่ยมมุมฉาก มุม θ อยู่ที่มุมซ้ายล่าง มุมฉากอยู่ที่มุมขวาล่าง ด้านล่างที่แตะมุม θ คือด้านประชิดมุม θ (ชิด) ด้านแนวตั้งทางขวาที่ไม่แตะมุม θ คือด้านตรงข้ามมุม θ (ข้าม) ด้านเอียงที่ยาวที่สุดคือด้านตรงข้ามมุมฉาก (ฉาก)"
    caption: "ชื่อ \"ข้าม\" และ \"ชิด\" ขึ้นกับว่ามองจากมุมใด ส่วน \"ฉาก\" อยู่ตรงข้ามมุมฉากเสมอ"
  - type: worked-example
    title: หามุมของทางลาดด้วยแทนเจนต์ผกผัน
    problem: "ทางลาดสำหรับรถเข็นสูงขึ้น $0.5\\ \\mathrm{m}$ ในระยะแนวราบ $6\\ \\mathrm{m}$ (ความชัน $1 : 12$) ทางลาดทำมุมกับพื้นกี่องศา"
    steps:
      - text: "วาดสามเหลี่ยมมุมฉาก มุมที่ต้องการอยู่ที่ปลายล่างของทางลาด ความสูง $0.5\\ \\mathrm{m}$ เป็นด้านข้าม ระยะราบ $6\\ \\mathrm{m}$ เป็นด้านชิด"
      - text: "รู้ข้ามกับชิด จึงใช้ $\\tan\\theta = \\dfrac{0.5}{6} = \\dfrac{1}{12} \\approx 0.0833$"
        why: "เลือกอัตราส่วนจากด้านที่รู้ค่า ไม่ต้องหาด้านตรงข้ามมุมฉากก่อน"
      - text: "หามุม: $\\theta = \\tan^{-1}(0.0833) \\approx 4.8^\\circ$ (เครื่องคิดเลขโหมดองศา)"
        why: "$\\tan^{-1}$ ตอบคำถามว่ามุมใดมีแทนเจนต์เท่ากับค่านี้"
      - text: "ตรวจความสมเหตุสมผล: ทางลาดชันน้อย มุมจึงควรเล็กกว่า $45^\\circ$ มาก ✓"
    answer: "ประมาณ $4.8^\\circ$"
  - { type: check, problem: math.trig.p001, prompt: "ระบุด้านเทียบกับมุม θ ก่อนเลือกอัตราส่วน" }
  - type: worked-example
    title: แบริ่งสองช่วงของเรือประมง
    problem: "เรือออกจากท่าเรือ O แล่นทิศ $040^\\circ$ เป็นระยะ $20\\ \\mathrm{km}$ ถึง P แล้วเปลี่ยนไปแล่นทิศ $130^\\circ$ อีก $15\\ \\mathrm{km}$ ถึง Q เรืออยู่ห่างท่าเรือเท่าใด และอยู่ในทิศใดจากท่าเรือ"
    figure: { src: bearings.svg, alt: "แผนภาพแบริ่ง จากท่าเรือ O ลูกศรไปทิศ 40 องศาจากทิศเหนือ ยาว 20 km ถึง P จาก P ลูกศรไปทิศ 130 องศาจากทิศเหนือ ยาว 15 km ถึง Q มีเครื่องหมายมุมฉากที่ P และเส้นประเชื่อม O กับ Q" }
    steps:
      - text: "มุมที่ P: ทิศเปลี่ยนจาก $040^\\circ$ เป็น $130^\\circ$ ต่างกัน $90^\\circ$ จึงได้ $\\angle OPQ = 90^\\circ$"
        why: "ทิศกลับจาก P ไป O คือ $220^\\circ$ และ $220^\\circ - 130^\\circ = 90^\\circ$"
      - text: "ระยะ $OQ = \\sqrt{20^2 + 15^2} = \\sqrt{625} = 25\\ \\mathrm{km}$"
      - text: "มุมที่ O: $\\tan\\angle POQ = \\dfrac{15}{20}$ จึงได้ $\\angle POQ = \\tan^{-1} 0.75 \\approx 36.9^\\circ$"
        why: "เมื่อมองจาก O ด้าน $PQ$ เป็นด้านข้าม และ $OP$ เป็นด้านชิด"
      - text: "แบริ่งของ Q จาก O $= 40^\\circ + 36.9^\\circ \\approx 076.9^\\circ$"
        why: "Q อยู่ทางขวา (ตามเข็มนาฬิกา) ของแนว OP จึงบวกมุมเพิ่ม"
    answer: "ห่างท่าเรือ $25\\ \\mathrm{km}$ ในทิศประมาณ $077^\\circ$"
  - { type: check, problem: math.trig.p007, prompt: "มุมก้มกับมุมเงยสัมพันธ์กันอย่างไร" }
  - type: simulation
    title: สำรวจ sin cos tan บนวงกลม (PhET Trig Tour)
    url: https://phet.colorado.edu/en/simulations/trig-tour
    provider: phet
    note: ลากจุดบนวงกลมให้มุมอยู่ระหว่าง 0° ถึง 90° แล้วดูสามเหลี่ยมมุมฉากที่เกิดขึ้น ลองตั้งมุม 30° 45° 60° แล้วเทียบค่า sin cos tan กับตารางในบทเรียน
glossary:
  - { term: ด้านตรงข้ามมุมฉาก, definition: "ด้านที่ยาวที่สุดของสามเหลี่ยมมุมฉาก อยู่ตรงข้ามมุม $90^\\circ$" }
  - { term: ไซน์ (sin), definition: "อัตราส่วนของด้านตรงข้ามมุมต่อด้านตรงข้ามมุมฉาก" }
  - { term: โคไซน์ (cos), definition: "อัตราส่วนของด้านประชิดมุมต่อด้านตรงข้ามมุมฉาก" }
  - { term: แทนเจนต์ (tan), definition: "อัตราส่วนของด้านตรงข้ามมุมต่อด้านประชิดมุม" }
  - { term: มุมเงย, definition: "มุมระหว่างแนวระดับกับแนวสายตาเมื่อมองขึ้นไปยังวัตถุ" }
  - { term: มุมก้ม, definition: "มุมระหว่างแนวระดับกับแนวสายตาเมื่อมองลงไปยังวัตถุ" }
flashcards:
  - { front: "นิยาม sin cos tan ในสามเหลี่ยมมุมฉาก", back: "$\\sin\\theta = \\tfrac{\\text{ข้าม}}{\\text{ฉาก}}$, $\\cos\\theta = \\tfrac{\\text{ชิด}}{\\text{ฉาก}}$, $\\tan\\theta = \\tfrac{\\text{ข้าม}}{\\text{ชิด}}$" }
  - { front: "$\\sin 30^\\circ$, $\\cos 30^\\circ$, $\\tan 30^\\circ$ เท่ากับเท่าใด", back: "$\\tfrac{1}{2}$, $\\tfrac{\\sqrt{3}}{2}$ และ $\\tfrac{1}{\\sqrt{3}}$" }
  - { front: "$\\tan 45^\\circ$ เท่ากับเท่าใด เพราะอะไร", back: "เท่ากับ 1 เพราะสามเหลี่ยมมุมฉากที่มีมุม $45^\\circ$ เป็นสามเหลี่ยมหน้าจั่ว ด้านข้ามยาวเท่าด้านชิด" }
  - { front: "มุมก้มจากยอดตึกถึงรถเป็น $35^\\circ$ มุมเงยจากรถถึงยอดตึกเป็นเท่าใด", back: "$35^\\circ$ เท่ากัน เพราะเป็นมุมแย้งระหว่างแนวระดับสองเส้นที่ขนานกัน" }
