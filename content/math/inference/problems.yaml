problems:
  - id: math.stats.inference.p001
    topics: [math.stats.inference]
    difficulty: 1
    type: numeric
    stem: "ประชากรมีส่วนเบี่ยงเบนมาตรฐาน $\\sigma = 12$ สุ่มตัวอย่างขนาด $n = 36$ จงหาความคลาดเคลื่อนมาตรฐานของค่าเฉลี่ยตัวอย่าง $\\sigma_{\\bar{x}}$"
    answer: { value: 2 }
    hints:
      - "$\\sigma_{\\bar{x}} = \\dfrac{\\sigma}{\\sqrt{n}}$"
      - "$\\sqrt{36} = 6$"
    misconceptions:
      - { match: 0.333, feedback: "หารด้วย $n$ แทน $\\sqrt{n}$" }
      - { match: 12, feedback: "12 คือความแปรผันของค่าเดี่ยว ๆ ค่าเฉลี่ยของ 36 ค่าแปรผันน้อยกว่านั้น" }
    solution: "$\\sigma_{\\bar{x}} = \\dfrac{12}{\\sqrt{36}} = \\dfrac{12}{6} = 2$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.inference.p002
    topics: [math.stats.inference]
    difficulty: 1
    type: mcq
    stem: "เจ้าหน้าที่สงสัยว่าข้าวสารถุงที่ระบุน้ำหนัก 5 กิโลกรัมของโรงสีแห่งหนึ่งบรรจุไม่ครบ สมมติฐานใดเหมาะสม"
    choices:
      - { id: a, text: "$H_0: \\mu = 5$ และ $H_a: \\mu < 5$", correct: true }
      - { id: b, text: "$H_0: \\mu < 5$ และ $H_a: \\mu = 5$", feedback: "$H_0$ ต้องเป็นสถานะ \"ไม่มีอะไรผิดปกติ\" ที่มีเครื่องหมายเท่ากับ สิ่งที่สงสัยเป็น $H_a$" }
      - { id: c, text: "$H_0: \\mu = 5$ และ $H_a: \\mu > 5$", feedback: "ข้อสงสัยคือบรรจุ **ไม่ครบ** ทิศของ $H_a$ จึงเป็นน้อยกว่า" }
      - { id: d, text: "$H_0: \\bar{x} = 5$ และ $H_a: \\bar{x} < 5$", feedback: "สมมติฐานพูดถึงพารามิเตอร์ของประชากร $\\mu$ ไม่ใช่ค่าเฉลี่ยตัวอย่าง $\\bar{x}$ ซึ่งเรารู้ค่าอยู่แล้ว" }
    hints:
      - "$H_0$ คือข้อความที่ระบุไว้บนถุง (มีเครื่องหมายเท่ากับ)"
      - "$H_a$ คือสิ่งที่เจ้าหน้าที่สงสัย"
    solution: "$H_0: \\mu = 5$ (บรรจุตามที่ระบุ) และ $H_a: \\mu < 5$ (บรรจุไม่ครบ) เป็นการทดสอบทางเดียวด้านซ้าย สมมติฐานเขียนด้วยพารามิเตอร์ $\\mu$ เสมอ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.inference.p003
    topics: [math.stats.inference]
    difficulty: 2
    type: numeric
    stem: "สุ่มตัวอย่าง 100 ค่าได้ $\\bar{x} = 72$ ถ้ารู้ว่า $\\sigma = 10$ จงหาขอบล่างของช่วงความเชื่อมั่น 95% ของ $\\mu$"
    answer: { value: 70.04, tolerance: 0.01 }
    hints:
      - "ช่วงคือ $\\bar{x} \\pm 1.96\\dfrac{\\sigma}{\\sqrt{n}}$"
      - "$\\dfrac{10}{\\sqrt{100}} = 1$"
    misconceptions:
      - { match: 52.4, feedback: "ใช้ $\\sigma$ แทนความคลาดเคลื่อนมาตรฐาน $\\sigma/\\sqrt{n}$" }
      - { match: 70.355, feedback: "1.645 คือค่าวิกฤตของความเชื่อมั่น 90% ความเชื่อมั่น 95% ใช้ 1.96" }
    solution: "$72 - 1.96 \\times \\dfrac{10}{10} = 72 - 1.96 = 70.04$ (ช่วงเต็มคือ $(70.04,\\ 73.96)$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.inference.p004
    topics: [math.stats.inference]
    difficulty: 2
    type: match
    stem: "บริษัทยาทดสอบยาลดไข้ชนิดใหม่ $H_0$: ยาใหม่ไม่ได้ผลดีกว่ายาเดิม $H_a$: ยาใหม่ได้ผลดีกว่า จับคู่คำศัพท์กับความหมายในบริบทนี้"
    pairs:
      - { left: "ความคลาดเคลื่อนประเภทที่ 1", right: "สรุปว่ายาใหม่ดีกว่า ทั้งที่จริงไม่ได้ดีกว่า" }
      - { left: "ความคลาดเคลื่อนประเภทที่ 2", right: "สรุปว่าไม่มีหลักฐาน ทั้งที่ยาใหม่ดีกว่าจริง" }
      - { left: "ระดับนัยสำคัญ $\\alpha$", right: "โอกาสที่ยอมให้เกิดความคลาดเคลื่อนประเภทที่ 1" }
      - { left: "กำลังการทดสอบ", right: "โอกาสตรวจพบว่ายาใหม่ดีกว่า เมื่อยาใหม่ดีกว่าจริง" }
    hints:
      - "ประเภทที่ 1 คือปฏิเสธ $H_0$ ที่จริง ประเภทที่ 2 คือไม่ปฏิเสธ $H_0$ ที่เท็จ"
      - "กำลังการทดสอบ $= 1 - \\beta$"
    solution: "ประเภทที่ 1: ปฏิเสธ $H_0$ ที่จริง (อ้างว่ายาดีกว่าทั้งที่ไม่ใช่) โอกาสเท่ากับ $\\alpha$ ประเภทที่ 2: ไม่ปฏิเสธ $H_0$ ที่เท็จ (พลาดยาที่ดีจริง) โอกาส $\\beta$ และกำลังการทดสอบ $1 - \\beta$ คือโอกาสจับผลที่มีอยู่จริงได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.inference.p005
    topics: [math.stats.inference]
    difficulty: 2
    type: numeric
    stem: "ไข่ไก่จากฟาร์มแห่งหนึ่งในนครปฐมมีน้ำหนักเฉลี่ย 60 กรัม ส่วนเบี่ยงเบนมาตรฐาน 4.8 กรัม (ค่าสมมติ) สุ่มไข่ 36 ฟอง ความน่าจะเป็นที่น้ำหนักเฉลี่ยของ 36 ฟองนี้เกิน 61 กรัมเป็นเท่าใด (ตอบทศนิยมสี่ตำแหน่ง)"
    answer: { value: 0.1056, tolerance: 0.002 }
    hints:
      - "ตามทฤษฎีบทลิมิตสู่ส่วนกลาง $\\bar{x}$ ใกล้ปกติ มีส่วนเบี่ยงเบนมาตรฐาน $\\tfrac{4.8}{\\sqrt{36}}$"
      - "$z = \\dfrac{61 - 60}{0.8} = 1.25$ แล้วหา $P(Z > 1.25) = 1 - \\Phi(1.25)$"
    misconceptions:
      - { match: 0.4175, feedback: "ใช้ $\\sigma = 4.8$ ซึ่งเป็นความแปรผันของไข่ฟองเดียว ค่าเฉลี่ยของ 36 ฟองต้องใช้ $\\sigma/\\sqrt{n} = 0.8$" }
      - { match: 0.8944, feedback: "นี่คือ $P(Z < 1.25)$ โจทย์ถามความน่าจะเป็นที่ **เกิน** 61 กรัม" }
    solution: "$\\sigma_{\\bar{x}} = \\tfrac{4.8}{6} = 0.8$, $z = \\tfrac{61 - 60}{0.8} = 1.25$ จึง $P(\\bar{x} > 61) = 1 - \\Phi(1.25) = 1 - 0.8944 = 0.1056$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.inference.p006
    topics: [math.stats.inference]
    difficulty: 3
    type: numeric
    stem: "สำรวจนักศึกษามหาวิทยาลัยไทยแบบสุ่ม 400 คน พบว่า 248 คนใช้แอปเรียนออนไลน์ทุกวัน (ข้อมูลสมมติ) จงหาขอบเขตความคลาดเคลื่อนของช่วงความเชื่อมั่น 95% ของสัดส่วน ตอบเป็นจุดร้อยละ (เช่น 3.5 หมายถึง ±3.5%) ทศนิยมสองตำแหน่ง"
    answer: { value: 4.76, unit: "จุดร้อยละ", tolerance: 0.05 }
    hints:
      - "$\\hat{p} = \\tfrac{248}{400} = 0.62$"
      - "ขอบเขต $= 1.96\\sqrt{\\dfrac{\\hat{p}(1 - \\hat{p})}{n}}$ แล้วคูณ 100"
    misconceptions:
      - { match: 3.99, feedback: "1.645 คือค่าวิกฤตของความเชื่อมั่น 90%" }
      - { match: 4.9, feedback: "ใช้ $p = 0.5$ ได้ขอบเขตแบบอนุรักษ์ แต่โจทย์มี $\\hat{p} = 0.62$ แล้ว ให้ใช้ค่านั้น" }
    solution: "$\\hat{p} = 0.62$, SE $= \\sqrt{\\tfrac{0.62 \\times 0.38}{400}} \\approx 0.02427$ ขอบเขต $= 1.96 \\times 0.02427 \\approx 0.0476$ หรือ ±4.76 จุดร้อยละ ช่วงความเชื่อมั่นคือราว 57.2% ถึง 66.8%"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.inference.p007
    topics: [math.stats.inference]
    difficulty: 3
    type: numeric
    stem: "นักวิจัยต้องการประมาณค่าเฉลี่ยรายจ่ายค่าอาหารต่อวันของนักศึกษา ให้คลาดไม่เกิน 2 บาทที่ความเชื่อมั่น 95% ถ้าประมาณ $\\sigma = 15$ บาท ต้องใช้ตัวอย่างอย่างน้อยกี่คน"
    answer: { value: 217, unit: คน }
    hints:
      - "$n = \\Big(\\dfrac{z^{*}\\sigma}{E}\\Big)^2$"
      - "ได้ทศนิยมแล้วต้องปัดขึ้นเสมอ"
    misconceptions:
      - { match: 216, feedback: "ได้ 216.09 ต้องปัด **ขึ้น** เป็น 217 ถ้าปัดลงขอบเขตจะเกิน 2 บาท" }
      - { match: 15, feedback: "ลืมยกกำลังสอง $\\big(\\tfrac{1.96 \\times 15}{2}\\big) = 14.7$" }
    solution: "$n = \\big(\\tfrac{1.96 \\times 15}{2}\\big)^2 = 14.7^2 = 216.09$ ปัดขึ้นเป็น 217 คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.inference.p008
    topics: [math.stats.inference]
    difficulty: 3
    type: numeric
    stem: "สุ่มนักศึกษา 16 คน ได้ชั่วโมงนอนเฉลี่ย $\\bar{x} = 8.4$ ชั่วโมง $s = 1.2$ ชั่วโมง ประชากรใกล้ปกติ จงหาขอบล่างของช่วงความเชื่อมั่น 95% (ค่าวิกฤตที่องศาเสรี 15 คือ $t^{*} = 2.131$) ตอบทศนิยมสองตำแหน่ง"
    answer: { value: 7.76, unit: ชั่วโมง, tolerance: 0.01 }
    hints:
      - "ความคลาดเคลื่อนมาตรฐาน $= \\tfrac{s}{\\sqrt{n}} = \\tfrac{1.2}{4}$"
      - "ขอบล่าง $= \\bar{x} - t^{*}\\tfrac{s}{\\sqrt{n}}$"
    misconceptions:
      - { match: 7.81, feedback: "ใช้ $z^{*} = 1.96$ แต่ไม่รู้ $\\sigma$ และ $n$ เล็ก ต้องใช้ $t^{*} = 2.131$" }
      - { match: 5.84, feedback: "ใช้ $s$ แทน $s/\\sqrt{n}$" }
    solution: "$\\tfrac{1.2}{\\sqrt{16}} = 0.3$ ขอบเขต $= 2.131 \\times 0.3 = 0.639$ ขอบล่าง $= 8.4 - 0.639 \\approx 7.76$ ชั่วโมง (ช่วง $(7.76,\\ 9.04)$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.inference.p009
    topics: [math.stats.inference]
    difficulty: 2
    type: mcq
    stem: "ช่วงความเชื่อมั่น 95% ของส่วนสูงเฉลี่ยนักเรียนชายชั้น ม.6 ในจังหวัดหนึ่งคือ $(169.2,\\ 172.6)$ เซนติเมตร ข้อใดตีความถูกต้อง"
    choices:
      - { id: a, text: "ถ้าสุ่มตัวอย่างและสร้างช่วงด้วยวิธีนี้ซ้ำหลายครั้ง ราว 95% ของช่วงจะครอบค่าเฉลี่ยจริง", correct: true }
      - { id: b, text: "นักเรียนชาย 95% สูงระหว่าง 169.2 ถึง 172.6 เซนติเมตร", feedback: "ช่วงความเชื่อมั่นเป็นของ **ค่าเฉลี่ย** ไม่ใช่ของส่วนสูงรายคน ซึ่งกระจายกว้างกว่ามาก" }
      - { id: c, text: "ค่าเฉลี่ยตัวอย่างอยู่ในช่วงนี้ด้วยความน่าจะเป็น 95%", feedback: "ค่าเฉลี่ยตัวอย่างอยู่ตรงกลางช่วงแน่นอน (170.9) ช่วงนี้ใช้ประมาณค่าเฉลี่ยของประชากร" }
      - { id: d, text: "ถ้าเพิ่มขนาดตัวอย่าง ช่วงจะกว้างขึ้น", feedback: "$n$ มากขึ้น $\\sigma/\\sqrt{n}$ เล็กลง ช่วงจึงแคบลง" }
    hints:
      - "ช่วงประมาณค่าอะไร ค่ารายคนหรือค่าเฉลี่ยของประชากร"
      - "95% เป็นสมบัติของวิธีสร้างช่วงเมื่อสุ่มซ้ำ"
    solution: "ช่วงความเชื่อมั่นประมาณค่าเฉลี่ยของประชากร และ \"95%\" หมายถึงสัดส่วนของช่วงที่ครอบค่าจริงเมื่อทำซ้ำหลายครั้ง (ดูภาพ 20 ช่วงในบทเรียน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.inference.p010
    topics: [math.stats.inference]
    difficulty: 3
    type: numeric
    stem: "เครื่องบรรจุน้ำดื่มตั้งไว้ที่ 500 มิลลิลิตร $\\sigma = 8$ มิลลิลิตร สุ่ม 64 ขวดได้ $\\bar{x} = 497$ มิลลิลิตร จงหาตัวสถิติทดสอบ $z$ ของ $H_0: \\mu = 500$"
    answer: { value: -3 }
    hints:
      - "$z = \\dfrac{\\bar{x} - \\mu_0}{\\sigma/\\sqrt{n}}$"
      - "$\\sigma/\\sqrt{n} = 8/8 = 1$"
    misconceptions:
      - { match: -0.375, feedback: "หารด้วย $\\sigma$ แทน $\\sigma/\\sqrt{n}$" }
      - { match: 3, feedback: "$\\bar{x} - \\mu_0 = 497 - 500$ เป็นลบ" }
    solution: "$z = \\dfrac{497 - 500}{8/\\sqrt{64}} = \\dfrac{-3}{1} = -3$ ค่า p สองทางประมาณ 0.0027 จึงมีหลักฐานแรงว่าเครื่องเพี้ยน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.inference.p011
    topics: [math.stats.inference]
    difficulty: 4
    type: numeric
    stem: "ผู้สมัครนายก อบจ. คนหนึ่งอ้างว่ามีผู้สนับสนุนครึ่งหนึ่งของผู้มีสิทธิ์ โพลสุ่มถาม 600 คน มีผู้สนับสนุน 270 คน (ข้อมูลสมมติ) จงหาค่า p ของการทดสอบ $H_0: p = 0.5$ กับ $H_a: p \\ne 0.5$ ตอบเป็นร้อยละ ทศนิยมสองตำแหน่ง"
    answer: { value: 1.43, unit: "%", tolerance: 0.05 }
    hints:
      - "$\\hat{p} = 0.45$ และตัวส่วนใช้ $\\sqrt{p_0(1 - p_0)/n} = \\sqrt{0.25/600}$"
      - "ได้ $z \\approx -2.45$ ค่า p สองทาง $= 2P(Z < -2.45)$"
    misconceptions:
      - { match: 0.72, feedback: "นี่คือค่า p ทางเดียว $H_a$ เป็น $\\ne$ ต้องคูณ 2" }
      - { match: 98.57, feedback: "นี่คือ $1 - $ ค่า p ค่า p คือพื้นที่หางที่ไกลกว่าค่าที่เห็น" }
    solution: "$\\hat{p} = \\tfrac{270}{600} = 0.45$, SE $= \\sqrt{0.25/600} \\approx 0.02041$, $z = \\tfrac{0.45 - 0.5}{0.02041} \\approx -2.449$ ค่า p $= 2\\Phi(-2.449) \\approx 0.0143$ หรือ 1.43% น้อยกว่า 0.05 จึงปฏิเสธคำอ้าง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.inference.p012
    topics: [math.stats.inference]
    difficulty: 3
    type: mcq
    stem: "การทดสอบหนึ่งได้ค่า p = 0.03 ผู้วิจัยกำหนด $\\alpha = 0.01$ ไว้ล่วงหน้า ข้อสรุปใดถูกต้อง"
    choices:
      - { id: a, text: "ไม่ปฏิเสธ $H_0$: ยังไม่มีหลักฐานพอที่ระดับ 0.01", correct: true }
      - { id: b, text: "ปฏิเสธ $H_0$ เพราะค่า p น้อยกว่า 0.05", feedback: "ต้องเทียบกับ $\\alpha$ ที่กำหนดไว้ (0.01) ไม่ใช่ 0.05" }
      - { id: c, text: "ยอมรับว่า $H_0$ จริงแน่นอน", feedback: "การไม่ปฏิเสธ $H_0$ ไม่ได้พิสูจน์ว่า $H_0$ จริง แค่หลักฐานยังไม่พอ" }
      - { id: d, text: "$H_0$ จริงด้วยความน่าจะเป็น 0.03", feedback: "ค่า p ไม่ใช่ความน่าจะเป็นที่ $H_0$ จริง แต่เป็นโอกาสได้ข้อมูลสุดโต่งเท่านี้ **เมื่อ** $H_0$ จริง" }
    hints:
      - "เกณฑ์: ปฏิเสธเมื่อค่า p ≤ α"
      - "$0.03 > 0.01$"
    solution: "$0.03 > \\alpha = 0.01$ จึงไม่ปฏิเสธ $H_0$ สรุปว่าหลักฐานยังไม่พอที่ระดับนัยสำคัญ 0.01 (ถ้าเลือก $\\alpha = 0.05$ ตั้งแต่แรกจะปฏิเสธได้ จึงต้องกำหนด $\\alpha$ ก่อนดูข้อมูล)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.inference.p013
    topics: [math.stats.inference]
    difficulty: 3
    type: numeric
    stem: "ข้อกำหนดของปูนซีเมนต์ระบุเวลาแข็งตัวเฉลี่ย 10 ชั่วโมง ทดสอบ 25 ตัวอย่างได้ $\\bar{x} = 10.6$ ชั่วโมง $s = 1.5$ ชั่วโมง จงหาตัวสถิติทดสอบ $t$ ของ $H_0: \\mu = 10$"
    answer: { value: 2, tolerance: 0.01 }
    hints:
      - "$t = \\dfrac{\\bar{x} - \\mu_0}{s/\\sqrt{n}}$"
      - "$s/\\sqrt{n} = 1.5/5 = 0.3$"
    misconceptions:
      - { match: 0.4, feedback: "หารด้วย $s$ แทน $s/\\sqrt{n}$" }
    solution: "$t = \\dfrac{10.6 - 10}{1.5/5} = \\dfrac{0.6}{0.3} = 2$ ที่องศาเสรี 24 ค่าวิกฤตสองทางที่ $\\alpha = 0.05$ คือ 2.064 เนื่องจาก $2 < 2.064$ จึงยังไม่ปฏิเสธ $H_0$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.inference.p014
    topics: [math.stats.inference]
    difficulty: 5
    type: numeric
    stem: "ทดสอบ $H_0: \\mu = 100$ กับ $H_a: \\mu > 100$ ด้วย $\\sigma = 10$, $n = 25$ และ $\\alpha = 0.05$ (ปฏิเสธเมื่อ $z > 1.645$) ถ้าค่าเฉลี่ยจริงคือ $\\mu = 105$ ความน่าจะเป็นของความคลาดเคลื่อนประเภทที่ 2 ($\\beta$) เป็นเท่าใด (ตอบทศนิยมสามตำแหน่ง)"
    answer: { value: 0.196, tolerance: 0.005 }
    hints:
      - "ปฏิเสธเมื่อ $\\bar{x} > 100 + 1.645 \\times \\tfrac{10}{5} = 103.29$"
      - "$\\beta = P(\\bar{x} \\le 103.29)$ เมื่อ $\\mu = 105$ แปลงเป็น $z = \\tfrac{103.29 - 105}{2}$"
    misconceptions:
      - { match: 0.804, feedback: "นี่คือกำลังการทดสอบ $1 - \\beta$ โจทย์ถาม $\\beta$" }
      - { match: 0.05, feedback: "0.05 คือ $\\alpha$ (ความคลาดเคลื่อนประเภทที่ 1) ไม่ใช่ $\\beta$" }
    solution: "ค่าวิกฤต $\\bar{x}^{*} = 100 + 1.645(2) = 103.29$ เมื่อ $\\mu = 105$: $z = \\tfrac{103.29 - 105}{2} \\approx -0.855$ ได้ $\\beta = \\Phi(-0.855) \\approx 0.196$ กำลังการทดสอบ $\\approx 0.804$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.inference.p015
    topics: [math.stats.inference]
    difficulty: 3
    type: numeric
    stem: "ศูนย์วิจัยข้าวในสุพรรณบุรีสุ่มแบ่งแปลงนา 10 แปลงเป็นสองกลุ่ม กลุ่มใช้ปุ๋ยสูตรใหม่ได้ผลผลิต 712, 698, 725, 706, 719 กิโลกรัมต่อไร่ กลุ่มปุ๋ยเดิมได้ 690, 701, 684, 695, 688 กิโลกรัมต่อไร่ (ข้อมูลสมมติ) ผลต่างของค่าเฉลี่ย (ใหม่ − เดิม) เป็นกี่กิโลกรัมต่อไร่"
    answer: { value: 20.4, unit: กิโลกรัมต่อไร่, tolerance: 0.01 }
    hints:
      - "หาค่าเฉลี่ยของแต่ละกลุ่ม"
      - "ค่าเฉลี่ยกลุ่มใหม่ $= \\tfrac{3560}{5}$ และกลุ่มเดิม $= \\tfrac{3458}{5}$"
    misconceptions:
      - { match: 102, feedback: "นี่คือผลต่างของผลรวม ต้องหารด้วย 5" }
    solution: "กลุ่มใหม่ $\\tfrac{3560}{5} = 712$ กลุ่มเดิม $\\tfrac{3458}{5} = 691.6$ ผลต่าง $= 712 - 691.6 = 20.4$ กิโลกรัมต่อไร่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.inference.p016
    topics: [math.stats.inference]
    difficulty: 4
    type: mcq
    stem: "ต่อจากข้อมูลแปลงนา 10 แปลง (ปุ๋ยใหม่ดีกว่าเดิม 20.4 กิโลกรัมต่อไร่) คอมพิวเตอร์ลองแบ่ง 10 ค่านี้เป็นสองกลุ่มกลุ่มละ 5 ครบทุกแบบ 252 แบบ พบว่ามี 2 แบบที่ผลต่างของค่าเฉลี่ยอย่างน้อย 20.4 ข้อสรุปใดเหมาะสมที่สุดที่ $\\alpha = 0.05$"
    choices:
      - { id: a, text: "ค่า p ≈ 2/252 ≈ 0.008 ผลต่างใหญ่เกินกว่าที่การสุ่มแบ่งกลุ่มจะสร้างได้บ่อย มีหลักฐานว่าปุ๋ยใหม่ให้ผลผลิตสูงกว่า", correct: true }
      - { id: b, text: "ค่า p ≈ 250/252 จึงไม่มีหลักฐาน", feedback: "ค่า p นับแบบที่ได้ผลสุดโต่ง **อย่างน้อยเท่า** ผลจริง ไม่ใช่แบบที่น้อยกว่า" }
      - { id: c, text: "สรุปไม่ได้ เพราะต้องรู้ $\\sigma$ ของประชากรก่อน", feedback: "การทดสอบแบบสุ่มจัดกลุ่มใหม่ไม่ต้องรู้ $\\sigma$ และไม่ต้องสมมติว่าข้อมูลแจกแจงปกติ" }
      - { id: d, text: "พิสูจน์แล้วว่าปุ๋ยใหม่ดีกว่าในทุกแปลงทั่วประเทศ", feedback: "ผลมีนัยสำคัญกับแปลงทดลองนี้ การขยายผลไปทั่วประเทศต้องอาศัยการสุ่มแปลงจากประชากรนั้นด้วย" }
    hints:
      - "ภายใต้ $H_0$ (ปุ๋ยไม่มีผล) ทุกแบบการแบ่งมีโอกาสเท่ากัน"
      - "ค่า p = สัดส่วนของแบบที่ผลต่าง ≥ 20.4"
    solution: "ถ้าปุ๋ยไม่มีผล การแบ่งกลุ่มแบบใดก็เกิดได้เท่ากัน มีเพียง 2 ใน 252 แบบที่ให้ผลต่างอย่างน้อย 20.4 ค่า p ทางเดียว $\\approx 0.008 < 0.05$ จึงปฏิเสธ $H_0$ เพราะเป็นการทดลองที่สุ่มจัดกลุ่ม จึงสรุปได้ว่าปุ๋ยใหม่ **เป็นสาเหตุ** ให้ผลผลิตของแปลงเหล่านี้สูงขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.inference.p017
    topics: [math.stats.inference]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการทดสอบสมมติฐาน"
    items:
      - "ตั้ง $H_0$ และ $H_a$ จากคำถามวิจัย"
      - "กำหนดระดับนัยสำคัญ $\\alpha$"
      - "เก็บข้อมูลและคำนวณตัวสถิติทดสอบ"
      - "หาค่า p"
      - "เทียบค่า p กับ $\\alpha$ แล้วสรุปในบริบทของโจทย์"
    hints:
      - "$\\alpha$ ต้องกำหนดก่อนเห็นข้อมูล"
      - "ค่า p คำนวณจากตัวสถิติทดสอบ"
    solution: "ตั้งสมมติฐาน → กำหนด $\\alpha$ → คำนวณตัวสถิติ → หาค่า p → เทียบกับ $\\alpha$ และสรุปเป็นภาษาของโจทย์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.inference.p018
    topics: [math.stats.inference]
    difficulty: 4
    type: numeric
    stem: "การสำรวจหนึ่งใช้ตัวอย่าง 100 คนได้ขอบเขตความคลาดเคลื่อน ±4 จุดร้อยละ ถ้าต้องการลดขอบเขตเหลือ ±2 จุดร้อยละที่ความเชื่อมั่นเท่าเดิม (สัดส่วนใกล้เดิม) ต้องใช้ตัวอย่างประมาณกี่คน"
    answer: { value: 400, unit: คน }
    hints:
      - "ขอบเขตแปรผันตาม $\\tfrac{1}{\\sqrt{n}}$"
      - "ขอบเขตลดลงครึ่งหนึ่ง $\\sqrt{n}$ ต้องเพิ่มเป็นสองเท่า"
    misconceptions:
      - { match: 200, feedback: "เพิ่ม $n$ เป็นสองเท่าลดขอบเขตได้แค่ $\\tfrac{1}{\\sqrt2}$ เท่า (เหลือราว ±2.83)" }
      - { match: 50, feedback: "ตัวอย่างน้อยลงทำให้ขอบเขตกว้างขึ้น ไม่ใช่แคบลง" }
    solution: "$E \\propto \\tfrac{1}{\\sqrt{n}}$ จึง $\\tfrac{E_2}{E_1} = \\sqrt{\\tfrac{n_1}{n_2}}$: $\\tfrac{2}{4} = \\sqrt{\\tfrac{100}{n_2}}$ ได้ $n_2 = 100 \\times 4 = 400$ คน"
    license: CC-BY-SA-4.0
    ai_assisted: true
