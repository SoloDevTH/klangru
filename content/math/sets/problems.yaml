      - { id: c, text: "9 ตัว คือ 0.1 ถึง 0.9", feedback: "ยังมี 0.01, 0.15, $\\tfrac13$ และอื่น ๆ อีกมาก" }
      - { id: d, text: "99 ตัว", feedback: "ไม่ว่าจะนับกี่ตัว ก็หาจำนวนใหม่ระหว่างสองจำนวนได้เสมอ เช่น ค่าเฉลี่ยของทั้งสอง" }
    hints:
