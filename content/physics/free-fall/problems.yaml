      - { id: c, text: "ช่วง S ไม่มีแรงใดกระทำต่อนักดิ่งพสุธา", feedback: "ความเร็วคงตัวแปลว่าแรงลัพธ์เป็นศูนย์ ไม่ใช่ไม่มีแรง น้ำหนักยังกระทำอยู่ และแรงต้านอากาศเท่ากับน้ำหนักพอดี" }
      - { id: d, text: "ช่วง R นักดิ่งพสุธาเคลื่อนที่ขึ้น", feedback: "ความเร็วยังเป็นบวก (ทิศลง) ตลอด แค่ลดขนาดลง นักดิ่งพสุธายังตกลงแต่ช้าลง" }
      - { id: e, text: "ช่วง P ความเร่งเท่ากับ $9.8\\ \\mathrm{m/s^2}$ ตลอดช่วง", feedback: "ความชันลดลงเรื่อย ๆ ในช่วง P เพราะแรงต้านอากาศเพิ่มขึ้นตามความเร็ว มีเพียงตอนเริ่มต้นที่ความเร่งใกล้ $9.8\\ \\mathrm{m/s^2}$" }
