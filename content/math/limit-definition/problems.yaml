  - id: math.calculus.limit-definition.p015
    topics: [math.calculus.limit-definition]
    difficulty: 5
    type: numeric
    stem: "พิสูจน์ $\\lim_{x\\to 1}\\frac{1}{x}=1$ โดยจำกัด $|x-1|<0.5$ ก่อน หาขอบบน $M$ ของ $\\frac{1}{|x|}$ บนช่วงนั้น แล้วเลือก $\\delta=\\min\\left(0.5,\\frac{\\varepsilon}{M}\\right)$ เมื่อ $\\varepsilon=0.1$ จะได้ $\\delta$ เท่าไร (ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 0.05, tolerance: 0.0001 }
    hints:
      - "$\\left|\\frac{1}{x}-1\\right|=\\frac{|x-1|}{|x|}$"
      - "เมื่อ $|x-1|<0.5$ จะได้ $|x|>0.5$"
      - "ดังนั้น $\\left|\\frac{1}{x}-1\\right|<2|x-1|$"
    misconceptions:
      - { match: 0.1, feedback: "0.1 คือ $\\varepsilon$ เอง แต่ $\\frac{|x-1|}{|x|}$ มีตัวหาร $|x|$ ที่เล็กลงเมื่อ $x$ เข้าใกล้ 0.5 จึงต้องเลือก $\\delta$ เล็กกว่า" }
    solution: "เมื่อ $|x-1|<\\delta\\le 0.5$ จะได้ $|x|>0.5$ และ $\\left|\\frac{1}{x}-1\\right|<2|x-1|$ จึงเลือก $\\delta=\\min\\left(0.5,\\frac{0.1}{2}\\right)=0.05$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.calculus.limit-definition.p016
    topics: [math.calculus.limit-definition]
