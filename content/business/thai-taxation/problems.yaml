  - match: 1000
    feedback: ใช้อัตรา 5% แต่เงินได้ส่วนนี้อยู่ในขั้น 15%
  hints:
  - ค่าลดหย่อนที่หายไปทำให้เงินได้สุทธิเพิ่ม $20{,}000$ บาท
