<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" font-family="sans-serif" font-size="14">
<title>น้ำเกิดและน้ำตาย</title>
<rect x="0" y="0" width="820" height="330" fill="#ffffff"/>
<rect x="10" y="10" width="395" height="310" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="207.0" y="36.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">น้ำเกิด (น้ำขึ้นสูงมาก ลงต่ำมาก)</text>
<text x="207.0" y="56.0" text-anchor="middle" font-size="12" fill="#475569">วันเดือนดับและวันเพ็ญ: ดวงอาทิตย์ โลก ดวงจันทร์ อยู่แนวเดียวกัน</text>
<circle cx="40" cy="200" r="18" fill="#fcd34d" stroke="#d97706" stroke-width="2"/>
<text x="40.0" y="236.0" text-anchor="middle" font-size="11" fill="#222">ดวงอาทิตย์</text>
<text x="40.0" y="250.0" text-anchor="middle" font-size="10" fill="#64748b">(อยู่ไกลมาก)</text>
<ellipse cx="240" cy="200" rx="78" ry="48" transform="rotate(0 240 200)" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
<circle cx="240" cy="200" r="42" fill="#4ade80" stroke="#166534" stroke-width="2"/>
<text x="240.0" y="205.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">โลก</text>
<circle cx="380.0" cy="200.0" r="12" fill="#d1d5db" stroke="#374151" stroke-width="2"/>
<text x="380.0" y="230.0" text-anchor="middle" font-size="11" fill="#222">ดวงจันทร์</text>
<rect x="415" y="10" width="395" height="310" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="612.0" y="36.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">น้ำตาย (น้ำขึ้นลงน้อย)</text>
<text x="612.0" y="56.0" text-anchor="middle" font-size="12" fill="#475569">ขึ้น 8 ค่ำ และแรม 8 ค่ำ: ทำมุมฉากกัน</text>
<circle cx="445" cy="200" r="18" fill="#fcd34d" stroke="#d97706" stroke-width="2"/>
<text x="445.0" y="236.0" text-anchor="middle" font-size="11" fill="#222">ดวงอาทิตย์</text>
<text x="445.0" y="250.0" text-anchor="middle" font-size="10" fill="#64748b">(อยู่ไกลมาก)</text>
<ellipse cx="645" cy="200" rx="66" ry="58" transform="rotate(-90 645 200)" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
<circle cx="645" cy="200" r="42" fill="#4ade80" stroke="#166534" stroke-width="2"/>
<text x="645.0" y="205.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">โลก</text>
<circle cx="645.0" cy="88.0" r="12" fill="#d1d5db" stroke="#374151" stroke-width="2"/>
<text x="627.0" y="92.0" text-anchor="end" font-size="11" fill="#222">ดวงจันทร์</text>
<text x="808.0" y="316.0" text-anchor="end" font-size="11" fill="#64748b">ส่วนนูนของน้ำวาดใหญ่เกินจริงมาก</text>
</svg>