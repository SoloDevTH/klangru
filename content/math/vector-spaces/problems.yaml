    stem: "ให้ $A = \\begin{bmatrix}1 & 2 & 3\\\\ 2 & 5 & 7\\\\ 3 & 7 & k\\end{bmatrix}$ ค่า $k$ เท่าใดที่ทำให้หลักของ $A$ ไม่อิสระเชิงเส้น (แรงก์ 2)"
    answer: { value: 10 }
    hints:
