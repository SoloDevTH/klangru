<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" font-family="sans-serif" font-size="14">
<title>ระบบน้ำดีแรงโน้มถ่วงในอาคาร</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15211e"/></marker></defs>
<rect x="0" y="0" width="720" height="500" fill="#ffffff"/>
<text x="360.0" y="32.0" text-anchor="middle" font-size="16" fill="#15211e" font-weight="bold">ระบบน้ำดีแรงโน้มถ่วงในอาคารสองชั้น (แผนภาพจำลอง)</text>
<line x1="40.0" y1="460.0" x2="680.0" y2="460.0" stroke="#15211e" stroke-width="3"/>
<rect x="300.0" y="178.0" width="230.0" height="282.0" rx="0" fill="#ffffff" stroke="#15211e" stroke-width="2"/>
<line x1="300.0" y1="356.0" x2="530.0" y2="356.0" stroke="#555555" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="415.0" y="350.0" text-anchor="middle" font-size="12" fill="#555555">ชั้นสอง</text>
<rect x="340.0" y="118.0" width="150.0" height="60.0" rx="0" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="2"/>
<rect x="340.0" y="148.0" width="150.0" height="30.0" rx="0" fill="#9ccbe8" stroke="#1f5f8b" stroke-width="0"/>
<text x="415.0" y="140.0" text-anchor="middle" font-size="12" fill="#15211e">ถังน้ำบนดาดฟ้า</text>
<line x1="300.0" y1="148.0" x2="530.0" y2="148.0" stroke="#1f5f8b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="294.0" y="142.0" text-anchor="end" font-size="12" fill="#1f5f8b">ผิวน้ำในถัง</text>
<rect x="600.0" y="404.0" width="100.0" height="56.0" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="650.0" y="430.0" text-anchor="middle" font-size="12" fill="#15211e">ถังเก็บน้ำและปั๊ม</text>
<line x1="650.0" y1="404.0" x2="650.0" y2="148.0" stroke="#1f5f8b" stroke-width="3" marker-end="url(#ah)"/>
<line x1="650.0" y1="148.0" x2="490.0" y2="148.0" stroke="#1f5f8b" stroke-width="3"/>
<line x1="290.0" y1="148.0" x2="290.0" y2="436.0" stroke="#1f5f8b" stroke-width="4"/>
<line x1="290.0" y1="436.0" x2="330.0" y2="436.0" stroke="#1f5f8b" stroke-width="4"/>
<rect x="320.0" y="424.0" width="22.0" height="22.0" rx="0" fill="#ffffff" stroke="#15211e" stroke-width="2"/>
<text x="331.0" y="418.0" text-anchor="middle" font-size="12" fill="#15211e">ก๊อก</text>
<line x1="230.0" y1="148.0" x2="230.0" y2="436.0" stroke="#15211e" stroke-width="1.5"/>
<line x1="224.0" y1="148.0" x2="236.0" y2="148.0" stroke="#15211e" stroke-width="1.5"/>
<line x1="224.0" y1="436.0" x2="236.0" y2="436.0" stroke="#15211e" stroke-width="1.5"/>
<text x="220.0" y="297.0" text-anchor="end" font-size="13" fill="#15211e" font-weight="bold">h = 12 ม.</text>
<text x="40.0" y="484.0" text-anchor="start" font-size="12" fill="#555555">ระดับพื้นดิน</text>
<text x="360.0" y="480.0" text-anchor="middle" font-size="13" fill="#15211e">ความดันที่ก๊อก p = ρ g h โดยที่ h คือความสูงของผิวน้ำเหนือก๊อก</text>
</svg>
