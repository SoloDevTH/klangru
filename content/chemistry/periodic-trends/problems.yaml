      - { id: a, text: "ตะกั่ว ซึ่งสะสมในร่างกายและทำลายระบบประสาท โดยเฉพาะในเด็ก", correct: true, feedback: "ถูก ตะกั่วจากโรงแต่งแร่ปนเปื้อนดินตะกอนและน้ำในลำห้วย" }
      - { id: b, text: "ไอโอดีน ซึ่งทำให้เป็นคอพอก", feedback: "การขาดไอโอดีนต่างหากที่ทำให้เป็นคอพอก และไอโอดีนไม่ใช่โลหะหนัก" }
      - { id: c, text: "แคลเซียม ซึ่งทำให้กระดูกพรุน", feedback: "แคลเซียมจำเป็นต่อกระดูก ไม่ใช่สารปนเปื้อนในกรณีนี้" }
    hints:
      - "เป็นโลหะหนักที่เคยใช้ในน้ำมันเบนซินและสีทาบ้าน"
      - "เหมืองในบริเวณนั้นเป็นเหมืองแร่ที่มีโลหะชนิดนี้"
    solution: "ลำห้วยคลิตี้ปนเปื้อน **ตะกั่ว** จากโรงแต่งแร่ ตะกั่วสะสมในร่างกาย ทำลายระบบประสาทและพัฒนาการของเด็ก ตัวอย่างนี้แสดงว่าการใช้ประโยชน์จากธาตุต้องจัดการของเสียอย่างถูกต้อง"
