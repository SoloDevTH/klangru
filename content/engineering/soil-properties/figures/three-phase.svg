<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300">
  <title>แผนภาพสามสถานะของดิน: อากาศ น้ำ และของแข็ง</title>
  <rect width="420" height="300" fill="#ffffff"/>
  <rect x="130" y="40" width="150" height="66.0" fill="#f5f5f5" stroke="#222" stroke-width="1.5"/>
  <rect x="130" y="106.0" width="150" height="55.0" fill="#9ecae1" stroke="#222" stroke-width="1.5"/>
  <rect x="130" y="161.0" width="150" height="99.0" fill="#bdbdbd" stroke="#222" stroke-width="1.5"/>
  <text x="292" y="77.0" font-size="13" font-family="sans-serif">อากาศ (air)</text>
  <text x="292" y="137.5" font-size="13" font-family="sans-serif">น้ำ (water)</text>
  <text x="292" y="214.5" font-size="13" font-family="sans-serif">ของแข็ง (solids)</text>
  <line x1="110" y1="40" x2="110" y2="260" stroke="#222"/>
  <text x="102" y="154.0" font-size="13" text-anchor="end" font-family="sans-serif">ปริมาตรรวม V</text>
  <text x="205.0" y="290" font-size="13" text-anchor="middle" font-family="sans-serif">แผนภาพแสดงสัดส่วนสมมติ ไม่ใช่สเกลจริง</text>
</svg>
