  <title>แผนภูมิแกนต์ของเกม 10 วัน เก็บความต้องการวันที่ 1 ออกแบบด่านวันที่ 2 ถึง 3 เขียนโค้ดวันที่ 4 ถึง 8 ทำเสียงและภาพวันที่ 4 ถึง 5 พร้อมกัน ทดสอบวันที่ 9 ถึง 10</title>
