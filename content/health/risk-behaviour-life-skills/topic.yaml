id: health.safety.risk-behaviour-life-skills
subject: health
title: { th: "พฤติกรรมเสี่ยง สถานการณ์เสี่ยง และทักษะชีวิต", en: "Risk behaviours, risky situations and life skills" }
summary: ปัจจัยเสี่ยง พฤติกรรมเสี่ยง และสถานการณ์เสี่ยงต่อสุขภาพ การประเมินความเสี่ยงด้วยโอกาสเกิดคูณความรุนแรง ทักษะชีวิต ห้าขั้นตัดสินใจแก้ปัญหา การหลีกเลี่ยงสถานการณ์คับขัน และการขอความช่วยเหลือ
difficulty: 3.5
minutes: 30
prerequisites: [health.substances.tobacco-alcohol]
encompasses:
  - { id: health.substances.tobacco-alcohol, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ตารางประเมินความเสี่ยง
    src: risk-matrix.svg
    alt: "ตาราง 3 คูณ 3 แกนตั้งคือโอกาสเกิด 1 น้อย 2 ปานกลาง 3 มาก แกนนอนคือความรุนแรงถ้าเกิดเหตุ 1 เล็กน้อย 2 ปานกลาง 3 รุนแรง แต่ละช่องเขียนผลคูณ แถวโอกาส 3: 3 6 9 แถวโอกาส 2: 2 4 6 แถวโอกาส 1: 1 2 3 สีเขียวคือ 1–2 เสี่ยงต่ำ ทำได้แต่ระวัง สีเหลืองคือ 3–4 เสี่ยงปานกลาง ต้องมีวิธีลดความเสี่ยง สีแดงคือ 6–9 เสี่ยงสูง หลีกเลี่ยง"
    caption: "เครื่องมืออย่างง่ายสำหรับฝึกคิด ถ้าผลร้ายถึงชีวิตหรือผิดกฎหมาย ให้หลีกเลี่ยงไว้ก่อน"
  - type: figure
    title: ห้าขั้นตัดสินใจและแก้ปัญหา
    src: decision-steps.svg
    alt: "ผังห้ากล่องเรียงจากซ้ายไปขวาด้วยลูกศร 1 ระบุปัญหา อะไรคือปัญหา ใครเกี่ยวข้อง 2 หาทางเลือก คิดไว้หลายทาง อย่างน้อย 3 ทาง 3 ชั่งผลดีผลเสีย ต่อตัวเอง คนอื่น และกฎหมาย 4 เลือกและลงมือ เลือกทางที่ปลอดภัยที่สุด 5 ประเมินผล ได้ผลไหม ครั้งหน้าทำอย่างไร ด้านล่างเขียนว่าถ้าไม่แน่ใจหรือเสี่ยงสูง ขอความช่วยเหลือจากผู้ใหญ่ที่ไว้ใจได้ทุกขั้น"
  - type: worked-example
    title: เปรียบเทียบทางเลือกด้วยคะแนนความเสี่ยง
    problem: "ตอนเลิกเรียนฝนตกหนัก ฟ้ามีสามทางเลือก (ก) ขี่จักรยานฝ่าฝนกลับเอง (ข) ซ้อนจักรยานยนต์รุ่นพี่ที่ไม่มีหมวกนิรภัยให้ (ค) รอที่โรงเรียนแล้วโทรให้แม่มารับ ให้คะแนนและเลือกทางที่ปลอดภัยที่สุด"
    steps:
      - text: "(ก) ถนนลื่นและมองไม่ชัด โอกาสเกิดเหตุ 2 ความรุนแรง 2 ได้ $2 \\times 2 = 4$ เสี่ยงปานกลาง"
      - text: "(ข) ถนนลื่นและไม่มีหมวกนิรภัย โอกาส 2 ความรุนแรง 3 ได้ $2 \\times 3 = 6$ เสี่ยงสูง"
        why: "ไม่มีหมวกนิรภัยทำให้ถ้าล้ม การบาดเจ็บที่ศีรษะรุนแรงมาก"
      - text: "(ค) รอในโรงเรียน โอกาส 1 ความรุนแรง 1 ได้ $1 \\times 1 = 1$ เสี่ยงต่ำ"
      - text: "เลือก (ค) และถ้าต้องกลับเองจริง ๆ ให้รอฝนซาและสวมเสื้อกันฝนสีสว่างเพื่อลดความเสี่ยงของ (ก)"
    answer: "เลือกรอแม่มารับ (คะแนน 1) ส่วนการซ้อนโดยไม่มีหมวก (คะแนน 6) ควรหลีกเลี่ยง"
  - { type: check, problem: health.safety.risk-behaviour-life-skills.p003, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: worked-example
    title: ใช้ห้าขั้นในงานเลี้ยงวันเกิด
    problem: "ในงานวันเกิดเพื่อนตอนค่ำ มีรุ่นพี่นำเหล้าเข้ามาและเริ่มชวนน้อง ๆ ดื่ม เพื่อนสองคนเริ่มดื่มแล้ว ส่วนผู้ปกครองของเจ้าของงานไม่อยู่บ้าน แก้มควรทำอย่างไร"
    steps:
      - text: "ระบุปัญหา: มีแอลกอฮอล์ ไม่มีผู้ใหญ่ดูแล และมีแรงกดดันให้ดื่ม เป็นสถานการณ์เสี่ยง"
      - text: "หาทางเลือก: อยู่ต่อและดื่ม อยู่ต่อแต่ปฏิเสธ หรือกลับบ้าน"
      - text: "ชั่งผลดีผลเสีย: ดื่มผิดกฎหมายและเสี่ยงอันตราย อยู่ต่ออาจถูกกดดันและสถานการณ์อาจแย่ลง กลับบ้านปลอดภัยที่สุด"
        why: "ยิ่งดึกและคนดื่มมากขึ้น โอกาสเกิดเหตุร้ายยิ่งสูง"
      - text: "เลือกและลงมือ: ปฏิเสธ ส่งรหัสลับให้ผู้ปกครองมารับ และชวนเพื่อนที่ไม่ได้ดื่มกลับด้วย"
      - text: "ประเมินผล: ครั้งหน้าถามก่อนว่ามีผู้ใหญ่อยู่ไหม และตกลงเวลากลับกับผู้ปกครองตั้งแต่แรก"
    answer: "ปฏิเสธ ขอให้ผู้ปกครองมารับ ชวนเพื่อนกลับ และวางแผนให้ดีขึ้นในครั้งหน้า"
  - { type: check, problem: health.safety.risk-behaviour-life-skills.p009 }
glossary:
  - { term: ปัจจัยเสี่ยง, definition: "สิ่งที่เพิ่มโอกาสเกิดอันตรายหรือปัญหาสุขภาพ เช่น แรงกดดันจากเพื่อน ความเครียด ที่เปลี่ยว" }
  - { term: พฤติกรรมเสี่ยง, definition: "การกระทำที่อาจทำให้ตนเองหรือผู้อื่นได้รับอันตราย เช่น ไม่สวมหมวกนิรภัย ดื่มแล้วขับ" }
  - { term: สถานการณ์เสี่ยง, definition: "เหตุการณ์หรือสถานที่ที่มีโอกาสเกิดอันตรายสูง เช่น งานเลี้ยงที่มีคนเมา การนัดเจอคนแปลกหน้าตามลำพัง" }
  - { term: ทักษะชีวิต, definition: "ความสามารถที่ช่วยให้รับมือกับปัญหาในชีวิตได้ดี เช่น การตัดสินใจ การแก้ปัญหา การสื่อสาร และการจัดการอารมณ์" }
  - { term: สถานการณ์คับขัน, definition: "สถานการณ์ที่กดดันและอาจนำไปสู่อันตรายได้อย่างรวดเร็ว ต้องตัดสินใจหรือออกจากที่นั่นทันที" }
flashcards:
  - { front: "คะแนนความเสี่ยง", back: "โอกาสเกิด × ความรุนแรง (1–2 ต่ำ 3–4 ปานกลาง 6–9 สูง) ผลร้ายถึงชีวิตให้หลีกเลี่ยงไว้ก่อน" }
  - { front: "ห้าขั้นตัดสินใจ", back: "ระบุปัญหา → หาทางเลือก → ชั่งผลดีผลเสีย → เลือกและลงมือ → ประเมินผล" }
  - { front: "ลดความเสี่ยงได้สองทาง", back: "ลดโอกาสเกิด (ไปเป็นกลุ่ม บอกผู้ปกครอง) และลดความรุนแรง (หมวกนิรภัย เสื้อชูชีพ)" }
  - { front: "เบอร์ขอความช่วยเหลือ", back: "1669 เจ็บป่วยฉุกเฉิน 191 ตำรวจ 1300 ศูนย์ช่วยเหลือสังคม 1323 สุขภาพจิต" }
