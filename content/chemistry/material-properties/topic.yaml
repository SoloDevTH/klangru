id: chemistry.materials.material-properties
subject: chemistry
title: { th: สมบัติทางกายภาพของวัสดุ, en: Physical properties of materials }
summary: ทดลองเปรียบเทียบความแข็ง สภาพยืดหยุ่น การนำความร้อน และการนำไฟฟ้าของวัสดุอย่างยุติธรรม แล้วใช้สมบัติเหล่านี้เลือกวัสดุเพื่อออกแบบชิ้นงาน
difficulty: 1.8
minutes: 25
prerequisites: [chemistry.materials.everyday-materials]
encompasses:
  - { id: chemistry.materials.everyday-materials, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: heat-test.svg
    alt: "ชามน้ำร้อนมีไอลอยขึ้น จุ่มช้อนสามคันยาวเท่ากัน คือช้อนโลหะ ช้อนไม้ และช้อนพลาสติก ที่ปลายด้ามด้านบนของแต่ละช้อนติดเนยไว้ หลังผ่านไป 2 นาที เนยบนช้อนโลหะละลายไหลลงมา ส่วนเนยบนช้อนไม้และช้อนพลาสติกยังเป็นก้อนอยู่"
    caption: "การทดลองเปรียบเทียบการนำความร้อน: เนยบนช้อนโลหะละลายก่อน"
  - { type: check, problem: chemistry.materials.material-properties.p003, prompt: "ใช้หลักการขูดขีดตอบ" }
  - type: worked-example
    title: เรียงความแข็งจากผลการขูด
    problem: "ขูดวัสดุสามชนิดกัน: แก้วขูดเทียนไขเป็นรอย ตะปูเหล็กขูดเทียนไขเป็นรอย แก้วขูดตะปูไม่เป็นรอย แต่ตะปูขูดแก้วเป็นรอยเล็กน้อย เรียงจากอ่อนไปแข็ง"
    steps:
      - text: "เทียนไขถูกทั้งแก้วและตะปูขูดเป็นรอย จึงอ่อนที่สุด"
      - text: "เทียบแก้วกับตะปู: ตะปูขูดแก้วเป็นรอย แต่แก้วขูดตะปูไม่เป็นรอย ตะปูจึงแข็งกว่าแก้ว"
        why: "ดูเสมอว่าใครเป็นฝ่ายมีรอย ฝ่ายที่มีรอยคือฝ่ายที่อ่อนกว่า"
      - text: "รวมผลทั้งหมด"
    answer: "เทียนไข < แก้ว < ตะปูเหล็ก (ผลนี้ขึ้นกับชนิดของแก้วและเหล็กที่ใช้ทดลอง)"
  - type: worked-example
    title: ออกแบบกล่องเก็บน้ำแข็งให้ละลายช้า
    problem: "นักเรียนจะทำกล่องเก็บน้ำแข็งไปงานกีฬาสี มีกล่องกระดาษ แผ่นโฟม กระดาษฟอยล์อะลูมิเนียม และผ้า ควรใช้วัสดุใดบุผนังกล่อง"
    steps:
      - text: "บอกงาน: ต้องกันความร้อนจากอากาศภายนอกไม่ให้เข้าไปถึงน้ำแข็ง"
      - text: "เลือกสมบัติ: ต้องการวัสดุที่ **นำความร้อนไม่ดี**"
      - text: "เลือกวัสดุ: ฟอยล์อะลูมิเนียมเป็นโลหะ นำความร้อนดี ไม่เหมาะเป็นผนัง แผ่นโฟมมีอากาศอยู่ในเนื้อมาก นำความร้อนไม่ดี เหมาะที่สุด"
        why: "อากาศที่ถูกขังไว้เป็นฉนวนความร้อนที่ดี โฟมและผ้าหนาจึงกันความร้อนได้"
      - text: "ทดสอบ: ใส่น้ำแข็งเท่ากันในกล่องที่บุโฟมกับกล่องไม่บุ แล้วจับเวลาจนละลาย ถ้ายังละลายเร็ว ให้ปรับปรุง เช่น บุหนาขึ้น"
    answer: "บุด้วยแผ่นโฟม เพราะนำความร้อนไม่ดี แล้วทดสอบเทียบกับกล่องที่ไม่บุ"
  - { type: check, problem: chemistry.materials.material-properties.p005, prompt: "ใช้เรื่องการนำความร้อนตอบ" }
glossary:
  - { term: สมบัติทางกายภาพ, definition: สมบัติที่ทดสอบได้โดยวัสดุยังเป็นวัสดุเดิม เช่น ความแข็ง การนำความร้อน }
  - { term: ความแข็ง, definition: ความทนต่อการขูดขีด วัสดุที่ขูดอีกชนิดเป็นรอยได้แข็งกว่า }
  - { term: สภาพยืดหยุ่น, definition: สมบัติที่วัสดุเปลี่ยนรูปเมื่อมีแรงกระทำ แล้วกลับคืนรูปเดิมเมื่อเอาแรงออก }
  - { term: ตัวนำความร้อน, definition: วัสดุที่ความร้อนเคลื่อนผ่านได้ดี เช่น โลหะ }
  - { term: ฉนวนไฟฟ้า, definition: วัสดุที่ไฟฟ้าไหลผ่านไม่ได้ เช่น พลาสติก ยาง ไม้แห้ง }
flashcards:
  - { front: "ทดสอบความแข็งอย่างไร", back: "นำวัสดุสองชนิดขูดกัน ชนิดที่ทำให้อีกชนิดเป็นรอยแข็งกว่า" }
  - { front: "วัสดุใดนำความร้อนดี วัสดุใดนำความร้อนไม่ดี", back: "นำดี: โลหะ · นำไม่ดี: ไม้ พลาสติก ผ้า โฟม อากาศ" }
  - { front: "แม่เหล็กดูดโลหะทุกชนิดหรือไม่", back: "ไม่ ดูดเหล็ก แต่ไม่ดูดอะลูมิเนียมและทองแดง" }
  - { front: "การทดลองที่ยุติธรรมคืออะไร", back: "เปลี่ยนเพียงชนิดของวัสดุ สิ่งอื่นต้องเหมือนกันทุกอย่าง" }
