<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" font-family="sans-serif" font-size="14">
<title>โครงสร้างภายในโลกตามองค์ประกอบ</title>
<rect x="0" y="0" width="820" height="440" fill="#ffffff"/>
<path d="M30,410 L410.0,410 A380.0,380.0 0 0 0 30,30.0 Z" fill="#a16207" stroke="#1f2937" stroke-width="1.5"/>
<path d="M30,410 L405.2,410 A375.2,375.2 0 0 0 30,34.8 Z" fill="#ea580c" stroke="#1f2937" stroke-width="1.5"/>
<path d="M30,410 L237.6,410 A207.6,207.6 0 0 0 30,202.4 Z" fill="#facc15" stroke="#1f2937" stroke-width="1.5"/>
<path d="M30,410 L102.8,410 A72.8,72.8 0 0 0 30,337.2 Z" fill="#fde68a" stroke="#1f2937" stroke-width="1.5"/>
<line x1="207.3" y1="76.6" x2="462" y2="55" stroke="#334155"/>
<circle cx="207.3" cy="76.6" r="3" fill="#111"/>
<text x="470.0" y="60.0" text-anchor="start" font-size="15" font-weight="bold" fill="#222">เปลือกโลก</text>
<text x="470.0" y="79.0" text-anchor="start" font-size="13" fill="#222">หนา 5–70 km (วาดหนาเกินจริง)</text>
<text x="470.0" y="97.0" text-anchor="start" font-size="13" fill="#7c2d12">หินที่มี O, Si, Al มาก</text>
<line x1="225.6" y1="192.8" x2="462" y2="145" stroke="#334155"/>
<circle cx="225.6" cy="192.8" r="3" fill="#111"/>
<text x="470.0" y="150.0" text-anchor="start" font-size="15" font-weight="bold" fill="#222">เนื้อโลก</text>
<text x="470.0" y="169.0" text-anchor="start" font-size="13" fill="#222">ลึกถึงราว 2,900 km</text>
<text x="470.0" y="187.0" text-anchor="start" font-size="13" fill="#7c2d12">หินที่มี Si, O, Mg, Fe</text>
<line x1="144.8" y1="329.6" x2="462" y2="245" stroke="#334155"/>
<circle cx="144.8" cy="329.6" r="3" fill="#111"/>
<text x="470.0" y="250.0" text-anchor="start" font-size="15" font-weight="bold" fill="#222">แก่นโลกชั้นนอก</text>
<text x="470.0" y="269.0" text-anchor="start" font-size="13" fill="#222">ลึก 2,900–5,150 km</text>
<text x="470.0" y="287.0" text-anchor="start" font-size="13" fill="#7c2d12">เหล็กและนิกเกิลหลอมเหลว</text>
<line x1="62.4" y1="394.9" x2="462" y2="340" stroke="#334155"/>
<circle cx="62.4" cy="394.9" r="3" fill="#111"/>
<text x="470.0" y="345.0" text-anchor="start" font-size="15" font-weight="bold" fill="#222">แก่นโลกชั้นใน</text>
<text x="470.0" y="364.0" text-anchor="start" font-size="13" fill="#222">ลึก 5,150–6,371 km</text>
<text x="470.0" y="382.0" text-anchor="start" font-size="13" fill="#7c2d12">เหล็กและนิกเกิลที่เป็นของแข็ง</text>
<text x="220.0" y="432.0" text-anchor="middle" font-size="12" fill="#222">ศูนย์กลางโลก → ผิวโลก 6,371 km</text>
<text x="810.0" y="432.0" text-anchor="end" font-size="11" fill="#64748b">ความลึกของแต่ละชั้นตามมาตราส่วน ยกเว้นเปลือกโลก</text>
</svg>