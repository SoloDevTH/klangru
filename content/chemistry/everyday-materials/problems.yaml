problems:
  - id: chemistry.materials.everyday-materials.p001
    topics: [chemistry.materials.everyday-materials]
    difficulty: 1
    type: mcq
    stem: "ช้อนที่แม่ใช้ตักข้าวมีผิวมันวาวและแข็ง ช้อนนี้ทำจากวัสดุใด"
    choices:
      - { id: a, text: "โลหะ", correct: true, feedback: "ถูก ผิวมันวาวและแข็งเป็นสมบัติของโลหะ" }
      - { id: b, text: "ผ้า", feedback: "ผ้านุ่มและพับได้ ใช้ตักข้าวไม่ได้" }
      - { id: c, text: "ยาง", feedback: "ยางยืดได้และไม่มันวาว ช้อนยางจะงอเมื่อตักของหนัก" }
      - { id: d, text: "ช้อน", feedback: "ช้อนคือชื่อวัตถุ คำถามถามชื่อวัสดุที่ใช้ทำช้อน" }
    hints:
      - "ดูสมบัติที่โจทย์บอก: มันวาว และแข็ง"
      - "วัสดุชนิดใดในตารางของบทเรียนมีผิวมันวาว"
    solution: "ผิวมันวาวและแข็งเป็นสมบัติของ **โลหะ** ช้อนจึงทำจากโลหะ (ช้อนเป็นวัตถุ โลหะเป็นวัสดุ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.everyday-materials.p002
    topics: [chemistry.materials.everyday-materials]
    difficulty: 1
    type: match
    stem: "จับคู่วัตถุกับวัสดุที่ใช้ทำ"
    pairs:
      - { left: "ขวดน้ำดื่ม", right: "พลาสติก" }
      - { left: "หน้าต่างใส", right: "แก้ว" }
      - { left: "หนังสติ๊ก", right: "ยาง" }
      - { left: "ผ้าเช็ดหน้า", right: "ผ้า" }
      - { left: "ตะเกียบไม้", right: "ไม้" }
    hints:
      - "นึกถึงว่าวัตถุแต่ละชิ้นต้องใส ยืดได้ นุ่ม หรือแข็ง"
      - "หนังสติ๊กต้องยืดแล้วดีดกลับ วัสดุใดยืดได้"
    solution: "ขวดน้ำดื่ม → พลาสติก (เบา น้ำไม่ซึม) · หน้าต่างใส → แก้ว (มองทะลุได้) · หนังสติ๊ก → ยาง (ยืดแล้วหดกลับ) · ผ้าเช็ดหน้า → ผ้า (นุ่ม ดูดซับน้ำ) · ตะเกียบไม้ → ไม้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.everyday-materials.p003
    topics: [chemistry.materials.everyday-materials]
    difficulty: 1
    type: mcq
    stem: "ข้อใดบอก **วัตถุ** และ **วัสดุ** ของ \"เก้าอี้ไม้\" ได้ถูกต้อง"
    choices:
      - { id: a, text: "วัตถุคือเก้าอี้ วัสดุคือไม้", correct: true, feedback: "ถูก เก้าอี้เป็นสิ่งของ ไม้เป็นสิ่งที่ใช้ทำ" }
      - { id: b, text: "วัตถุคือไม้ วัสดุคือเก้าอี้", feedback: "สลับกัน วัสดุคือสิ่งที่ใช้ทำ ส่วนวัตถุคือของที่ทำเสร็จแล้ว" }
      - { id: c, text: "ทั้งเก้าอี้และไม้เป็นวัตถุ", feedback: "ไม้เป็นสิ่งที่ใช้ทำเก้าอี้ จึงเป็นวัสดุ" }
    hints:
      - "วัสดุคือสิ่งที่ใช้ทำของ"
      - "ถามตัวเองว่า เก้าอี้ทำจากอะไร"
    solution: "**วัตถุ** คือของที่เราใช้ คือ เก้าอี้ **วัสดุ** คือสิ่งที่ใช้ทำ คือ ไม้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.everyday-materials.p004
    topics: [chemistry.materials.everyday-materials]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นสมบัติของ **แก้ว** (เลือกได้มากกว่า 1 ข้อ)"
    choices:
      - { id: a, text: "ใส มองทะลุได้", correct: true, feedback: "ถูก เราจึงใช้แก้วทำหน้าต่าง" }
      - { id: b, text: "แข็ง แต่ตกพื้นแล้วแตกง่าย", correct: true, feedback: "ถูก ต้องระวังเมื่อหยิบจับ" }
      - { id: c, text: "ยืดได้แล้วหดกลับ", feedback: "นี่คือสมบัติของยาง แก้วยืดไม่ได้" }
      - { id: d, text: "นุ่ม พับได้", feedback: "นี่คือสมบัติของผ้า แก้วพับไม่ได้" }
    hints:
      - "นึกถึงแก้วน้ำและหน้าต่างที่เคยเห็น"
      - "ถ้าทำแก้วน้ำหล่น จะเกิดอะไรขึ้น"
    solution: "แก้ว **ใส มองทะลุได้** และ **แข็งแต่แตกง่าย** ส่วนยืดได้เป็นสมบัติของยาง และพับได้เป็นสมบัติของผ้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.everyday-materials.p005
    topics: [chemistry.materials.everyday-materials]
    difficulty: 2
    type: mcq
    stem: "นักเรียนหยดน้ำ 1 หยดเท่ากันบนผ้า A, B และ C แล้วรอ 1 นาที ได้ผลดังภาพ ผ้าใดเหมาะที่สุดสำหรับทำผ้าเช็ดตัว"
    figure:
      src: p-water-drop.svg
      alt: "ผ้าสามผืนวางเรียงกัน บนผ้า A หยดน้ำยังเป็นหยดกลมใหญ่อยู่ด้านบน ไม่มีรอยเปียก บนผ้า B ไม่มีหยดน้ำเหลือ มีรอยเปียกกว้างซึมในเนื้อผ้า บนผ้า C มีหยดน้ำเล็กเหลืออยู่ด้านบนและมีรอยเปียกเล็ก ๆ"
    choices:
      - { id: a, text: "ผ้า A", feedback: "น้ำยังเป็นหยดอยู่บนผ้า A แปลว่าผ้า A ไม่ดูดซับน้ำ เหมาะกับร่มมากกว่า" }
      - { id: b, text: "ผ้า B", correct: true, feedback: "ถูก น้ำซึมเข้าไปหมด ผ้า B ดูดซับน้ำได้ดีที่สุด" }
      - { id: c, text: "ผ้า C", feedback: "ผ้า C ดูดซับน้ำได้บ้าง แต่ยังมีหยดน้ำเหลือ ดูดซับได้น้อยกว่าผ้า B" }
    hints:
      - "ผ้าเช็ดตัวต้องซับน้ำออกจากตัวเรา"
      - "ผ้าผืนใดไม่มีหยดน้ำเหลืออยู่ด้านบนเลย"
    solution: "ผ้าเช็ดตัวต้อง **ดูดซับน้ำดี** บนผ้า B น้ำซึมเข้าไปหมดจนไม่เหลือหยด จึงดูดซับน้ำได้ดีที่สุด ส่วนผ้า A ไม่ดูดซับน้ำเลย และผ้า C ดูดซับได้บางส่วน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.everyday-materials.p006
    topics: [chemistry.materials.everyday-materials]
    difficulty: 2
    type: text
    stem: "ถุงมือล้างจานต้องกันน้ำและยืดสวมมือได้พอดี ควรทำจากวัสดุใด (ตอบเป็นคำเดียว)"
    accepted: ["ยาง", "ยางพารา", "rubber"]
    misconceptions:
      - { match: "ผ้า", feedback: "ผ้าดูดซับน้ำ มือจะเปียก ถุงมือล้างจานต้องกันน้ำ" }
      - { match: "พลาสติก", feedback: "พลาสติกกันน้ำได้ แต่พลาสติกส่วนใหญ่ยืดแล้วไม่หดกลับ สวมแล้วไม่กระชับมือ" }
    hints:
      - "ต้องการสองสมบัติ: น้ำซึมผ่านไม่ได้ และยืดได้แล้วหดกลับ"
      - "วัสดุชนิดเดียวกับยางรัดของ"
    solution: "ถุงมือล้างจานทำจาก **ยาง** เพราะยางกันน้ำ และยืดได้แล้วหดกลับ จึงสวมได้กระชับมือ ประเทศไทยปลูกยางพารามาก จึงผลิตถุงมือยางส่งขายทั่วโลก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.everyday-materials.p007
    topics: [chemistry.materials.everyday-materials]
    difficulty: 2
    type: mcq
    stem: "ทำไมเสื้อกันฝนจึงทำจากพลาสติก ไม่ทำจากผ้าฝ้าย"
    choices:
      - { id: a, text: "พลาสติกไม่ดูดซับน้ำ ฝนจึงไม่ซึมถึงตัว", correct: true, feedback: "ถูก สมบัติข้อนี้ตรงกับงานของเสื้อกันฝน" }
      - { id: b, text: "พลาสติกดูดซับน้ำได้ดีกว่าผ้าฝ้าย", feedback: "กลับกัน ผ้าฝ้ายดูดซับน้ำได้ดี พลาสติกไม่ดูดซับน้ำ" }
      - { id: c, text: "พลาสติกแข็งกว่าผ้าฝ้าย", feedback: "เสื้อกันฝนไม่ต้องแข็ง ต้องพับได้และกันน้ำ" }
    hints:
      - "เสื้อกันฝนมีไว้ทำอะไร"
      - "นึกถึงการหยดน้ำบนพลาสติกกับบนผ้า"
    solution: "เสื้อกันฝนต้องกันไม่ให้น้ำฝนถึงตัว พลาสติก **ไม่ดูดซับน้ำ** ส่วนผ้าฝ้ายดูดซับน้ำ ถ้าใช้ผ้าฝ้าย ฝนจะซึมจนเปียก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.everyday-materials.p008
    topics: [chemistry.materials.everyday-materials]
    difficulty: 3
    type: numeric
    stem: "ต้นเทน้ำ 50 มิลลิลิตรลงบนผ้าฝ้ายที่วางบนตะแกรง น้ำที่ไหลผ่านลงมาในแก้วมี 20 มิลลิลิตร ผ้าฝ้ายดูดซับน้ำไว้กี่มิลลิลิตร"
    answer: { value: 30, unit: มิลลิลิตร }
    misconceptions:
      - { match: 20, feedback: "20 มิลลิลิตรคือน้ำที่ไหลผ่านลงแก้ว ไม่ใช่น้ำที่ผ้าเก็บไว้" }
      - { match: 70, feedback: "ต้องลบ ไม่ใช่บวก น้ำที่ผ้าเก็บไว้ต้องน้อยกว่าน้ำที่เทลงไป" }
    hints:
      - "น้ำที่เทลงไปแบ่งเป็นสองส่วน: ส่วนที่ผ้าเก็บไว้ กับส่วนที่ไหลลงแก้ว"
      - "นำน้ำที่เทลงไปทั้งหมด ลบด้วยน้ำที่ไหลลงแก้ว"
    solution: "น้ำที่ผ้าดูดซับ = น้ำที่เท − น้ำที่ไหลผ่าน = $50 - 20 = 30$ มิลลิลิตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.everyday-materials.p009
    topics: [chemistry.materials.everyday-materials]
    difficulty: 3
    type: mcq
    stem: "ชาวบ้านทางภาคอีสานปั้นอิฐดินโดยผสมดินเหนียวกับฟางข้าว แล้วตากแดดให้แห้ง ฟางช่วยให้อิฐเป็นอย่างไร"
    choices:
      - { id: a, text: "แข็งแรงขึ้น และไม่แตกร้าวง่าย", correct: true, feedback: "ถูก ฟางยึดเนื้อดินไว้ด้วยกัน" }
      - { id: b, text: "ใสจนมองทะลุได้", feedback: "ดินและฟางมองทะลุไม่ได้ ผสมกันก็ยังมองทะลุไม่ได้" }
      - { id: c, text: "ยืดได้เหมือนยาง", feedback: "อิฐที่แห้งแล้วแข็ง ไม่ยืด" }
    hints:
      - "ดินเหนียวที่แห้งอย่างเดียวมักแตกเป็นร่อง"
      - "ฟางเป็นเส้นยาว ๆ แทรกอยู่ในเนื้อดิน ช่วยอะไรได้"
    solution: "ดินเหนียวล้วนเมื่อแห้งมักหดตัวและแตกร้าว ฟางที่ผสมลงไปทำหน้าที่ยึดเนื้อดินไว้ อิฐจึง **แข็งแรงขึ้นและไม่แตกร้าวง่าย** นี่คือตัวอย่างของการผสมวัสดุเพื่อให้ได้สมบัติใหม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.everyday-materials.p010
    topics: [chemistry.materials.everyday-materials]
    difficulty: 3
    type: mcq
    stem: "ช่างผสมปูนซีเมนต์ ทราย หิน และน้ำ แล้วเทลงแบบไม้ เมื่อผ่านไปหลายวัน ส่วนผสมนี้เปลี่ยนไปอย่างไร"
    choices:
      - { id: a, text: "จากเหลวที่เทได้ กลายเป็นของแข็งที่แข็งมาก", correct: true, feedback: "ถูก ได้คอนกรีตที่ใช้ทำเสาและพื้น" }
      - { id: b, text: "ยังเหลวเหมือนเดิม", feedback: "ถ้ายังเหลว จะสร้างบ้านไม่ได้ ส่วนผสมนี้แข็งตัวเมื่อเวลาผ่านไป" }
      - { id: c, text: "แยกกลับเป็นปูน ทราย หิน และน้ำเหมือนเดิม", feedback: "เมื่อแข็งตัวแล้ว แยกกลับเป็นส่วนผสมเดิมไม่ได้" }
    hints:
      - "นึกถึงพื้นปูนหรือเสาบ้านที่ช่างเทไว้"
      - "ตอนเทยังเหลว แล้วตอนเสร็จเป็นอย่างไร"
    solution: "ส่วนผสมนี้คือ **คอนกรีต** ตอนผสมเสร็จยังเหลวจึงเทลงแบบได้ เมื่อเวลาผ่านไปจะแข็งตัวมาก ใช้ทำเสา คาน และพื้น เป็นตัวอย่างที่การผสมวัสดุให้วัสดุที่มีสมบัติใหม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.everyday-materials.p011
    topics: [chemistry.materials.everyday-materials]
    difficulty: 3
    type: numeric
    stem: "น้องมิ้นต่อตัวต่อ 12 ชิ้นเป็นบ้าน แล้วแยกชิ้นออกทั้งหมด นำมาต่อใหม่เป็นรถโดยใช้ไป 9 ชิ้น เหลือตัวต่อที่ยังไม่ได้ใช้กี่ชิ้น"
    answer: { value: 3, unit: ชิ้น }
    misconceptions:
      - { match: 21, feedback: "ชิ้นส่วนไม่ได้เพิ่มขึ้น เมื่อแยกบ้านออกก็ยังมี 12 ชิ้นเท่าเดิม ต้องลบชิ้นที่ใช้ทำรถ" }
      - { match: 9, feedback: "9 ชิ้นคือชิ้นที่ใช้ทำรถ คำถามถามชิ้นที่เหลือ" }
    hints:
      - "เมื่อแยกบ้านออก จำนวนชิ้นส่วนยังเท่าเดิม"
      - "ชิ้นที่เหลือ = ชิ้นทั้งหมด − ชิ้นที่ใช้ทำรถ"
    solution: "แยกบ้านออกได้ชิ้นส่วนเดิม 12 ชิ้น ใช้ทำรถ 9 ชิ้น เหลือ $12 - 9 = 3$ ชิ้น ชิ้นส่วนไม่หายและไม่เพิ่ม แค่นำมาประกอบเป็นวัตถุใหม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.everyday-materials.p012
    topics: [chemistry.materials.everyday-materials]
    difficulty: 4
    type: order
    stem: "เรียงขั้นตอนการรีไซเคิลขวดน้ำพลาสติกที่ใช้แล้ว จากขั้นแรกถึงขั้นสุดท้าย"
    items:
      - "ดื่มน้ำหมดแล้วล้างขวดให้สะอาด"
      - "แยกขวดใส่ถังหรือถุงสำหรับขยะรีไซเคิล"
      - "ส่งให้ธนาคารขยะหรือร้านรับซื้อของเก่า"
      - "โรงงานบดขวดเป็นเกล็ดพลาสติก"
      - "หลอมเกล็ดพลาสติกแล้วทำเป็นของชิ้นใหม่"
    hints:
      - "เริ่มจากสิ่งที่เราทำเองที่บ้าน แล้วจึงถึงงานของโรงงาน"
      - "ต้องบดก่อนหลอม และต้องแยกขยะก่อนส่ง"
    solution: "ล้างขวด → แยกใส่ที่สำหรับขยะรีไซเคิล → ส่งธนาคารขยะหรือร้านรับซื้อ → โรงงานบดเป็นเกล็ด → หลอมแล้วขึ้นรูปเป็นของใหม่ เช่น เส้นใยผ้าหรือขวดใบใหม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.everyday-materials.p013
    topics: [chemistry.materials.everyday-materials]
    difficulty: 4
    type: mcq
