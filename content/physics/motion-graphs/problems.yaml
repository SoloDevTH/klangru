      - { match: 10, feedback: "นั่นคือความชันของเส้นตัดระหว่าง $t = 2$ กับ $t = 3\\ \\mathrm{s}$ ซึ่งเป็นความเร็วเฉลี่ยในช่วงนั้น ยังไม่ใช่ความเร็วขณะหนึ่งที่ $t = 3\\ \\mathrm{s}$" }
    solution: "จาก $x = \\tfrac{1}{2}at^2$ ที่ $t = 1\\ \\mathrm{s}$: $2 = \\tfrac{1}{2}a(1)^2$ ได้ $a = 4\\ \\mathrm{m/s^2}$ (ตรวจ: $\\tfrac{1}{2}(4)(3)^2 = 18\\ \\mathrm{m}$ ✓) ความเร็วที่ $t = 3\\ \\mathrm{s}$: $v = 0 + (4)(3) = 12\\ \\mathrm{m/s}$ ซึ่งเท่ากับความชันของเส้นสัมผัสกราฟที่จุดนั้น"
