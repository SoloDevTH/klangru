problems:
- id: english.writing.argumentative-essay.p001
  topics:
  - english.writing.argumentative-essay
  difficulty: 1
  type: mcq
  stem: ประโยคใดเป็น thesis statement ที่ชัดเจนที่สุดสำหรับเรียงความเรื่องโทรศัพท์ในห้องเรียนของโรงเรียนไทย
  choices:
  - id: a
    text: Phones are a topic that many people talk about.
    feedback: ไม่บอกจุดยืน เพียงบอกว่ามีคนพูดถึง
  - id: b
    text: Schools should ban phones during lessons, because they reduce students' attention and learning time.
    correct: true
    feedback: ถูก บอกจุดยืนชัดเจนและมีเหตุผลสำคัญ
  - id: c
    text: I like phones, and I use mine every day.
    feedback: เป็นความรู้สึกส่วนตัว ไม่ใช่จุดยืนที่โน้มน้าวผู้อ่านได้
  - id: d
    text: There are many kinds of phones on the market.
    feedback: เป็นข้อเท็จจริงทั่วไป ไม่มีจุดยืนให้โต้แย้ง
  hints:
  - thesis ต้องบอกว่าเราเห็นด้วยกับอะไร
  - ดูว่าประโยคมีเหตุผลที่สนับสนุนจุดยืนหรือไม่
  solution: ข้อ b บอกจุดยืนว่าโรงเรียนควรห้าม และบอกเหตุผลว่าลดสมาธิกับเวลาเรียน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.argumentative-essay.p002
  topics:
  - english.writing.argumentative-essay
  difficulty: 1
  type: match
  stem: จับคู่ส่วนของย่อหน้า PEEL กับหน้าที่ของแต่ละส่วน
  pairs:
  - left: 'Point (P)'
    right: ประโยคใจความที่บอกประเด็นของย่อหน้า
  - left: 'Evidence (E)'
    right: ข้อมูลหรือตัวอย่างที่สนับสนุนประเด็น
  - left: 'Explain (E)'
    right: อธิบายว่าหลักฐานสนับสนุนจุดยืนอย่างไร
  - left: 'Link (L)'
    right: เชื่อมกลับไปยัง thesis หรือย่อหน้าถัดไป
  hints:
  - P คือประโยคแรกของย่อหน้า
  - ขั้นที่ต้องอธิบายหลักฐานอยู่หลังหลักฐาน
  solution: 'Point → ประเด็น · Evidence → หลักฐาน · Explain → อธิบายหลักฐาน · Link → เชื่อมกลับ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.argumentative-essay.p003
  topics:
  - english.writing.argumentative-essay
  difficulty: 1
  type: text
  stem: 'เติมคำเชื่อมที่ใช้เพิ่มข้อมูลอีกข้อ: *___, the survey shows that most students check messages in class.*'
  accepted:
  - Furthermore
  - Moreover
  - In addition
  - Additionally
  misconceptions:
  - match: However
    feedback: However บอกการขัดแย้ง แต่ประโยคนี้เพิ่มข้อมูลที่สนับสนุนเดิม
  - match: Therefore
    feedback: Therefore บอกผลลัพธ์ แต่ประโยคนี้ไม่ได้บอกผลของสิ่งที่พูดก่อน
  hints:
  - ประโยคนี้เพิ่มข้อมูลที่สนับสนุนเรื่องเดียวกัน
  - คำเชื่อมที่แปลว่า "นอกจากนี้"
  solution: '*Furthermore, the survey shows that most students check messages in class.* ใช้คำเชื่อมเพื่อเพิ่มข้อมูล'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.argumentative-essay.p004
  topics:
  - english.writing.argumentative-essay
  difficulty: 2
  type: mcq
  stem: ข้อใดเรียบเรียงข้อโต้แย้งฝ่ายตรงข้ามได้ถูกต้องที่สุด
  choices:
  - id: a
    text: Some people argue that phones help students learn. However, the same tasks can be done on school computers during set times.
    correct: true
    feedback: ถูก ยอมรับข้อโต้แย้งก่อน แล้วตอบโต้ด้วยคำเชื่อมที่ชัดเจน
  - id: b
    text: Phones help students learn, so they are good.
    feedback: ไม่ได้ยอมรับข้อโต้แย้งอื่นและไม่มีการตอบโต้
  - id: c
    text: Some people argue phones are bad. Phones are good.
    feedback: ไม่มีคำเชื่อมและไม่ตอบข้อโต้แย้งอย่างมีเหตุผล
  - id: d
    text: Phones are useful, bad, cool, and boring.
    feedback: ไม่มีจุดยืนและไม่มีการตอบโต้
  hints:
  - โครงสร้างที่ดีคือยอมรับก่อนแล้วจึงตอบโต้
  - มองหาคำเชื่อมที่บอกการขัดแย้ง
  solution: ข้อ a ใช้ Some people argue ยอมรับความเห็นอื่น แล้วใช้ However ตอบโต้ด้วยเหตุผล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.argumentative-essay.p005
  topics:
  - english.writing.argumentative-essay
  difficulty: 2
  type: match
  stem: จับคู่คำเชื่อมกับความสัมพันธ์ที่คำนั้นบอก
  pairs:
  - left: Furthermore
    right: เพิ่มข้อมูลอีกข้อที่สนับสนุนเดียวกัน
  - left: On the other hand
    right: นำเสนอด้านตรงข้ามเพื่อเปรียบเทียบ
  - left: As a result
    right: บอกผลที่ตามมาจากเหตุก่อนหน้า
  - left: This suggests that
    right: ตีความจากหลักฐานที่เพิ่งยกมา
  hints:
  - Furthermore เป็นการเพิ่ม ไม่ใช่การแย้ง
  - As a result บอกผลลัพธ์
  solution: 'Furthermore → เพิ่มข้อมูล · On the other hand → ด้านตรงข้าม · As a result → ผลลัพธ์ · This suggests that → การตีความ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.argumentative-essay.p006
  topics:
  - english.writing.argumentative-essay
  difficulty: 2
  type: text
  stem: 'เขียนใหม่ให้เป็นทางการโดยเติมคำที่ขาด: *Teachers ___ always have time to check phones.*'
  accepted:
  - do not
  misconceptions:
  - match: don't
    feedback: don't ถูกไวยากรณ์ แต่เป็นรูปย่อ เรียงความทางการควรใช้รูปเต็ม do not
  - match: did not
    feedback: did not เป็นอดีต ไม่ตรงกับความหมายทั่วไปในปัจจุบัน
  - match: will not
    feedback: will not บอกอนาคต ไม่ตรงกับความหมายของประโยคนี้
  hints:
  - เรียงความใช้รูปเต็มแทนรูปย่อ
  - รูปเต็มของ don't
  solution: '*Teachers **do not** always have time to check phones.* เรียงความควรใช้รูปเต็มแทน don''t'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.argumentative-essay.p007
  topics:
  - english.writing.argumentative-essay
  difficulty: 2
  type: mcq
  stem: 'ต้นฉบับ: "Phones reduce attention in class." ข้อใดเป็นการถอดความที่ถูกต้องและยังคงความหมายเดิม'
  choices:
  - id: a
    text: Phones reduce attention in class.
    feedback: เป็นการลอกคำเดิม ไม่ใช่การถอดความ
  - id: b
    text: Mobile phones can lower students' focus during lessons.
    correct: true
    feedback: ถูก เปลี่ยนคำและโครงสร้างแต่คงความหมายเดิมไว้
  - id: c
    text: Phones are bad in class and should be removed.
    feedback: เปลี่ยนความหมาย เพราะเพิ่มข้อเสนอให้เอาออก ซึ่งต้นฉบับไม่ได้พูด
  - id: d
    text: Phones make students pay less attention in lessons, which is a serious problem.
    feedback: เพิ่มการประเมินว่าเป็นปัญหาร้ายแรง ซึ่งต้นฉบับไม่ได้บอก
  hints:
  - การถอดความต้องคงความหมายเดิมและไม่ลอกคำ
  - ตรวจว่าเพิ่มหรือตัดความหมายใดไปหรือไม่
  solution: ข้อ b คงความหมายเดิม ใช้คำใหม่ และไม่เพิ่มการประเมินหรือข้อเสนอที่ไม่มีในต้นฉบับ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.argumentative-essay.p008
  topics:
  - english.writing.argumentative-essay
  difficulty: 3
  type: order
  stem: เรียงประโยคของย่อหน้าเนื้อเรื่องเกี่ยวกับโทรศัพท์ในโรงเรียนไทยให้ถูกลำดับตามโครงสร้าง PEEL
  items:
  - Phones distract students during lessons in Thai schools.
  - In a survey of 200 students in one Bangkok school, most said they checked messages at least once every ten minutes.
  - This suggests that constant checking breaks students' concentration and makes it harder to follow the lesson.
  - Therefore, a clear rule on phone use would help students stay focused.
  hints:
  - ประโยคแรกเป็นประเด็นของย่อหน้า
  - ประโยคที่บอกผลสำรวจอยู่ก่อนประโยคที่อธิบาย
  solution: ลำดับคือ Point → Evidence → Explain → Link
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.argumentative-essay.p009
  topics:
  - english.writing.argumentative-essay
  difficulty: 3
  type: order
  stem: เรียงโครงร่างของเรียงความแสดงเหตุผลให้ถูกลำดับ
  items:
  - Schools should ban phones during lessons, because they reduce attention and learning time.
  - First, phones distract students during class and make it hard to follow the teacher.
  - Second, a ban would encourage face-to-face conversation between students.
  - Some people argue that phones help with research. However, the same research can be done on school computers.
  - In conclusion, a clear ban during lessons is a practical step toward better learning.
  hints:
  - thesis อยู่ต้นสุดของเรียงความ
  - การยอมรับและตอบโต้ฝ่ายตรงข้ามอยู่ก่อนบทสรุป
  solution: ลำดับคือ thesis → เนื้อเรื่องที่ 1 → เนื้อเรื่องที่ 2 → ข้อโต้แย้งฝ่ายตรงข้าม → บทสรุป
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.argumentative-essay.p010
  topics:
  - english.writing.argumentative-essay
  difficulty: 3
  type: mcq
  stem: 'เปรียบเทียบข้อมูลสองชุดนี้: ก) สำรวจนักเรียน 20 คนในห้องเรียนเดียว ข) สำรวจนักเรียน 3,000 คนใน 12 จังหวัด ข้อใดเป็นหลักฐานที่หนักแน่นกว่าสำหรับข้อสรุปเกี่ยวกับนักเรียนทั่วประเทศ'
  choices:
  - id: a
    text: ชุด ก เพราะเก็บข้อมูลในห้องเดียวทำได้ละเอียดกว่า
    feedback: ความละเอียดของห้องเดียวไม่ได้ทำให้ผลสรุปไปถึงนักเรียนทั่วประเทศ
  - id: b
    text: ชุด ข เพราะกลุ่มตัวอย่างใหญ่และครอบคลุมหลายจังหวัด
    correct: true
    feedback: ถูก กลุ่มตัวอย่างที่ใหญ่และหลากหลายให้หลักฐานที่น่าเชื่อถือกว่าสำหรับภาพรวม
  - id: c
    text: ทั้งสองชุดหนักแน่นเท่ากันเพราะเป็นการสำรวจ
    feedback: การเป็นการสำรวจไม่ได้ทำให้หลักฐานทั้งสองมีน้ำหนักเท่ากัน
  - id: d
    text: ไม่มีชุดใดให้หลักฐานได้เลย
    feedback: ทั้งสองชุดให้หลักฐาน แต่มีน้ำหนักต่างกัน
  hints:
  - ดูว่ากลุ่มตัวอย่างใหญ่แค่ไหนและครอบคลุมพื้นที่เท่าไร
  - หลักฐานที่ใช้สรุปภาพรวมต้องกว้างพอ
  solution: ข้อ b ถูก เพราะขนาดและความหลากหลายของกลุ่มตัวอย่างสำคัญต่อการสรุปถึงนักเรียนทั่วประเทศ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.argumentative-essay.p011
  topics:
  - english.writing.argumentative-essay
  difficulty: 3
  type: text
  stem: 'เขียนใหม่ให้เป็นทางการ: *a lot of* students → ___ students'
  accepted:
  - many
  - numerous
  - a large number of
  misconceptions:
  - match: lots
    feedback: lots เป็นภาษาไม่เป็นทางการ ในเรียงความให้ใช้ many
  - match: a lot
    feedback: a lot ไม่ใช้วางหน้าคำนามโดยตรงแบบนี้ ให้ใช้ many
  hints:
  - คำที่แปลว่า "จำนวนมาก" และใช้กับคำนามนับได้
  - ใช้คำที่เป็นทางการกว่าเดิม
  solution: '*many students* เป็นทางการกว่า a lot of (numerous หรือ a large number of ก็ใช้ได้)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.argumentative-essay.p012
  topics:
  - english.writing.argumentative-essay
  difficulty: 3
  type: mcq
  stem: ข้อใดแสดงความระมัดระวังในการสรุปจากข้อมูลที่มีจำกัด
  choices:
  - id: a
    text: Phones always ruin learning.
    feedback: เป็นการสรุปเกินข้อมูล ไม่มีความระมัดระวัง
  - id: b
    text: This evidence suggests that phones may reduce focus, although the sample was small.
    correct: true
    feedback: ถูก ใช้ suggests และ may บอกความไม่แน่นอน และยอมรับข้อจำกัดของกลุ่มตัวอย่าง
  - id: c
    text: Everyone knows phones are the problem.
    feedback: อ้างความรู้ทั่วไปแทนหลักฐาน ไม่มีความระมัดระวัง
  - id: d
    text: Phones are definitely the only cause of low grades.
    feedback: ใช้ definitely และ only ซึ่งเป็นการยืนยันแน่นอนเกินหลักฐาน
  hints:
  - มองหาคำที่บอกความไม่แน่นอนและการยอมรับข้อจำกัด
  - คำอย่าง always, definitely, only ทำให้ข้อความแน่นอนเกินไป
  solution: ข้อ b ใช้ suggests และ may รวมทั้งยอมรับว่ากลุ่มตัวอย่างเล็ก จึงระมัดระวังที่สุด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.argumentative-essay.p013
  topics:
  - english.writing.argumentative-essay
  difficulty: 4
  type: order
  stem: เรียงประโยคของย่อหน้าสังเคราะห์จากสามแหล่งให้ถูกลำดับ
  items:
  - Source A argues that phones can distract students during lessons.
  - Source B agrees, reporting that students who use phones less show better concentration.
  - In contrast, Source C suggests that phones can support research when teachers set clear rules.
  - Taken together, the sources suggest that the issue depends on how phones are managed.
  hints:
  - เริ่มจากแหล่งที่ให้ข้อโต้แย้งหลักก่อน
  - ประโยคสรุปรวมแหล่งทั้งหมดอยู่ท้ายสุด
  solution: ลำดับคือ แหล่ง A (ข้อโต้แย้งหลัก) → แหล่ง B (สนับสนุน) → แหล่ง C (ความต่าง) → การสังเคราะห์รวม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.argumentative-essay.p014
  topics:
  - english.writing.argumentative-essay
  difficulty: 4
  type: mcq
  stem: 'อ่านย่อหน้านี้แล้วตอบคำถาม: "Phones are bad for students. Everyone knows this. Teachers hate them, and so do parents. Schools should therefore ban them." จุดอ่อนที่สำคัญที่สุดของย่อหน้านี้คืออะไร'
  choices:
  - id: a
    text: ใช้คำศัพท์ยากเกินไป
    feedback: คำศัพท์ไม่ใช่ปัญหาหลักของย่อหน้านี้
  - id: b
    text: อ้างความรู้ทั่วไปแทนหลักฐานที่ตรวจสอบได้ และไม่มีการอธิบาย
    correct: true
    feedback: ถูก ย่อหน้านี้ใช้ Everyone knows และความเห็นของคนทั่วไปแทนหลักฐาน และไม่มีขั้น Explain
  - id: c
    text: ย่อหน้าสั้นเกินไป
    feedback: ความยาวไม่ใช่ปัญหาหลัก ปัญหาอยู่ที่หลักฐาน
  - id: d
    text: ไม่มีประโยคสรุป
    feedback: มีประโยคสรุป Schools should therefore ban them. แต่ขาดหลักฐานรองรับ
  hints:
  - ดูว่าย่อหน้ามีหลักฐานที่ตรวจได้หรือไม่
  - วลี Everyone knows ทำหน้าที่อะไรในการโต้แย้ง
  solution: ข้อ b ถูก เพราะย่อหน้าอาศัยการอ้างความรู้ทั่วไปและความรู้สึกของคนทั่วไป แทนหลักฐานที่ตรวจสอบได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.argumentative-essay.p015
  topics:
  - english.writing.argumentative-essay
  difficulty: 4
  type: text
  stem: 'เติมคำกริยาช่วยที่บอกความไม่แน่นอน: *Schools ___ consider a phone ban, although more evidence is needed.*'
  accepted:
  - may
  - might
  - could
  misconceptions:
