    solution: "เฟสตรงข้ามแปลว่า $1.5 = \\left(n + \\tfrac{1}{2}\\right)\\lambda$ ความยาวคลื่นยาวที่สุดเมื่อ $n = 0$: $\\lambda = 3.0\\ \\mathrm{m}$ จึงได้ $v = f\\lambda = 2 \\times 3.0 = 6\\ \\mathrm{m/s}$"
