id: english.speaking.everyday-conversations
subject: english
title: { th: "บทสนทนาในชีวิตประจำวันและสถานการณ์จริง", en: "Everyday conversations" }
summary: เปิด ถามตอบ คุยต่อ และปิดบทสนทนา แลกเปลี่ยนข้อมูลเรื่องตนเองและกิจกรรม ใช้ประโยคสุภาพในโรงเรียน ร้านค้า ร้านอาหาร การเดินทาง และชุมชน
difficulty: 3
minutes: 40
prerequisites: [english.grammar.questions, english.speaking.greetings-introductions, english.grammar.can-modals]
encompasses:
  - { id: english.grammar.questions, weight: 0.3 }
  - { id: english.speaking.greetings-introductions, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: conversation-steps.svg
    alt: "แผนภาพสี่ขั้นของบทสนทนาเรียงจากซ้ายไปขวาพร้อมลูกศร ขั้นที่ 1 เปิด (Open) เช่น Excuse me. Hi, Ken! Good morning. ขั้นที่ 2 ถาม–ตอบ (Ask & answer) เช่น How much is this? Where do you live? Do you like durian? ขั้นที่ 3 ต่อบทสนทนา (React & follow up) เช่น Really? That's great! What about you? Sorry? Could you ... ขั้นที่ 4 ปิด (Close) เช่น Thank you so much. See you tomorrow! Have a nice day."
    caption: "เปิด → ถาม–ตอบ → ต่อบทสนทนา → ปิด"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.speaking.everyday-conversations.p007, prompt: "I like กับ I'd like ต่างกันอย่างไร" }
  - type: figure
    src: menu.svg
    alt: "เมนูร้าน Auntie Noi's Kitchen (ร้านป้าน้อย) Pad Thai 60 baht, Fried rice with chicken 50 baht, Green curry with rice 70 baht, Mango sticky rice 60 baht, Thai iced tea 25 baht, Water 10 baht"
    caption: "เมนูร้านป้าน้อย ใช้ในตัวอย่างและโจทย์"
  - type: worked-example
    title: บทสนทนาที่ร้านอาหาร
    problem: "นักท่องเที่ยวมาที่ร้านป้าน้อย เขียนบทสนทนาสั้น ๆ: ทักทาย ถามว่าจะสั่งอะไร ลูกค้าสั่งข้าวเหนียวมะม่วงไม่ใส่น้ำแข็งในชาเย็น ถามว่ากินที่ร้านหรือกลับบ้าน และคิดเงิน"
    steps:
      - text: "เปิดและเสนอช่วย: *Staff: Hello! What would you like?*"
      - text: "ลูกค้าสั่งอย่างสุภาพด้วย I'd like: *Tourist: I'd like mango sticky rice and a Thai iced tea, please. No ice, please.*"
      - text: "ถามต่อ: *Staff: For here or to take away? / Tourist: For here, please.*"
      - text: "คิดเงินจากเมนู 60 + 25 = 85 บาท: *Staff: That's 85 baht.*"
        why: "ข้าวเหนียวมะม่วง 60 บาท ชาเย็น 25 บาท"
      - text: "ปิดบทสนทนา: *Tourist: Here you are. Thank you! / Staff: Enjoy your meal!*"
    answer: "บทสนทนาครบสี่ขั้น ราคารวม 85 บาท"
  - { type: check, problem: english.speaking.everyday-conversations.p009, prompt: "สำนวนถามกลับว่า แล้วเธอล่ะ" }
  - type: worked-example
    title: แลกเปลี่ยนข้อมูลกิจกรรมหลังเลิกเรียน
    problem: "นักเรียนแลกเปลี่ยนจากต่างประเทศถามว่า *What do you usually do after school?* ตอบให้คุยต่อได้"
    steps:
      - text: "ตอบคำถามตรง ๆ ด้วย present simple: *I usually play takraw with my friends.*"
      - text: "เพิ่มข้อมูลหนึ่งอย่าง อธิบายคำที่เพื่อนอาจไม่รู้: *It's a Thai sport. We kick a small ball over a net.*"
        why: "คู่สนทนาเป็นคนต่างชาติ การอธิบายสั้น ๆ ช่วยให้เข้าใจและคุยต่อได้"
      - text: "ถามกลับ: *What about you? What do you do after school?*"
      - text: "ถ้าฟังคำตอบไม่ทัน: *Sorry? Could you say that again, please?*"
    answer: "*I usually play takraw with my friends. It's a Thai sport. We kick a small ball over a net. What about you?*"
glossary:
  - { term: follow-up question, definition: "คำถามต่อจากคำตอบของอีกฝ่าย ช่วยให้บทสนทนาต่อเนื่อง เช่น What about you?" }
  - { term: I'd like, definition: "ย่อจาก I would like ใช้ขอหรือสั่งอย่างสุภาพ ต่างจาก I like ที่แปลว่า ชอบ" }
  - { term: Here you are., definition: "สำนวนตอนยื่นของให้ แปลว่า นี่ครับ/ค่ะ" }
  - { term: change, definition: "เงินทอน เช่น Here's your change." }
  - { term: the bill, definition: "ใบเสร็จค่าอาหาร (อเมริกันใช้ the check) ขอด้วย Can I have the bill, please?" }
flashcards:
  - { front: "ถามราคาของชิ้นเดียว / หลายชิ้น", back: "How much is this? / How much are these?" }
  - { front: "สั่งอาหารอย่างสุภาพ", back: "I'd like ..., please." }
  - { front: "\"เช็คบิล\" ภาษาอังกฤษพูดว่า", back: "Can I have the bill, please?" }
  - { front: "ฟังไม่ทัน พูดอย่างไร", back: "Sorry? Could you say that again, please?" }
  - { front: "ตอบแล้วถามกลับ", back: "..., what about you? / How about you?" }
