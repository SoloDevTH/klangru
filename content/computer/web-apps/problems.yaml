    stem: "ในการตรวจหน้าร้านขนม มีรูปภาพ 10 รูป และ 7 รูปมีข้อความ alt อธิบายแล้ว ร้อยละของรูปที่ยังไม่มี alt เป็นเท่าไร (ตอบเป็นตัวเลขร้อยละ ไม่ต้องใส่เครื่องหมาย %)"
    answer: { value: 30 }
    hints:
      - "หาจำนวนรูปที่ยังไม่มี alt ก่อน แล้วหารด้วยจำนวนรูปทั้งหมด"
      - "คูณผลหารด้วย 100 เพื่อได้ร้อยละ"
    misconceptions:
      - { match: 70, feedback: "70 คือร้อยละของรูปที่มี alt แล้ว แต่โจทย์ถามรูปที่ยังไม่มี" }
      - { match: 3, feedback: "3 คือจำนวนรูปที่ยังไม่มี alt ไม่ใช่ร้อยละ ต้องหารด้วย 10 แล้วคูณ 100" }
    solution: "รูปที่ยังไม่มี alt มี $10 - 7 = 3$ รูป คิดเป็น $3 / 10 \\times 100 = 30\\%$"
