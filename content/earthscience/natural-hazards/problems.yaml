    ai_assisted: true

  - id: earthscience.hazards.natural-hazards.p015
    topics: [earthscience.hazards.natural-hazards]
    difficulty: 4
    type: mcq
    stem: "ชุมชนหนึ่งเสนอทางแก้ดินถล่มสองทาง ทาง ก สร้างกำแพงคอนกรีตกันดินที่เชิงเขาหลังโรงเรียนแห่งเดียว ราคาสูง ทาง ข ปลูกป่าบนลาดเขา ติดกระบอกวัดฝน ฝึกอาสาสมัครเตือนภัย และซ้อมอพยพทุกปี ราคาต่ำ ข้อใดเปรียบเทียบได้ถูกต้องที่สุด"
    choices:
      - { id: a, text: "ทาง ข ปกป้องคนได้ทั้งหมู่บ้านและได้ผลระยะยาว แต่ป่าใช้เวลาโต ส่วนทาง ก ป้องกันได้เฉพาะจุดและอาจรับดินปริมาณมากไม่ไหว อาจใช้ทาง ก เสริมเฉพาะจุดที่อันตรายมาก", correct: true }
      - { id: b, text: "ทาง ก ดีกว่าเสมอเพราะคอนกรีตแข็งแรงที่สุด", feedback: "กำแพงป้องกันได้เฉพาะจุดที่สร้าง และดินถล่มใหญ่อาจข้ามหรือทำลายกำแพงได้ ไม่ได้ช่วยคนทั้งหมู่บ้าน" }
      - { id: c, text: "ทาง ข ไม่มีประโยชน์เพราะห้ามฝนไม่ได้", feedback: "เราห้ามฝนไม่ได้ แต่การเตือนภัยและการอพยพทันเวลาช่วยชีวิตคนได้ และป่าช่วยยึดดิน" }
      - { id: d, text: "สองทางเหมือนกัน เลือกทางใดก็ได้", feedback: "สองทางต่างกันทั้งพื้นที่ที่ปกป้อง ราคา และเวลาที่ได้ผล ต้องเทียบด้วยเกณฑ์" }
    hints:
      - "เทียบด้วยเกณฑ์ ปกป้องคนได้มากเพียงใด ราคา เวลาที่ได้ผล ข้อจำกัด"
      - "ทางแก้ที่ดีอาจใช้หลายวิธีร่วมกัน"
    solution: "ทาง ข ครอบคลุมคนทั้งหมู่บ้าน ราคาต่ำ และยั่งยืน แต่ป่าต้องใช้เวลาหลายปี ทาง ก ได้ผลทันทีแต่เฉพาะจุดและราคาแพง การใช้ทาง ข เป็นหลักและเสริมทาง ก ที่จุดเสี่ยงสูงจึงสมเหตุสมผลที่สุด"
