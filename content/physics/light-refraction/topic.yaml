id: physics.light.refraction
subject: physics
title: { th: การหักเหของแสงและเลนส์, en: Refraction of light and lenses }
summary: ดรรชนีหักเห กฎของสเนลล์ มุมวิกฤตและการสะท้อนกลับหมด และภาพที่เกิดจากเลนส์นูนกับเลนส์เว้า
difficulty: 5.5
minutes: 40
prerequisites: [physics.light.reflection, math.geometry.trig-ratios]
encompasses:
  - { id: physics.light.reflection, weight: 0.3 }
  - { id: math.geometry.trig-ratios, weight: 0.4 }
curriculum_tags: []
lessons:
  - type: figure
    src: snell-air-glass.svg
    alt: "รอยต่อแนวนอนระหว่างอากาศ (n = 1.00) ด้านบนกับแก้ว (n = 1.50) ด้านล่าง เส้นปกติเป็นเส้นประแนวดิ่ง รังสีแสงมาจากซ้ายบนทำมุม 50° กับเส้นปกติ เข้าแก้วแล้วเบนเข้าหาเส้นปกติ ทำมุม 30.7° กับเส้นปกติ มีแสงสะท้อนจาง ๆ บางส่วนออกไปทางขวาบนที่มุม 50°"
    caption: "เข้าตัวกลางที่ $n$ มากขึ้น แสงเบนเข้าหาเส้นปกติ: $1.00 \\sin 50^\\circ = 1.50 \\sin\\theta_2$ ได้ $\\theta_2 \\approx 30.7^\\circ$"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: apparent-depth.svg
    alt: "เหรียญวางอยู่ก้นน้ำ (n = 1.33) รังสีแสงสองเส้นจากเหรียญพุ่งขึ้นเกือบตั้งฉาก ถึงผิวน้ำแล้วเบนออกจากเส้นปกติไปยังตาผู้มองด้านบน แนวต่อของรังสีในอากาศย้อนลงไปเป็นเส้นประตัดกันที่จุดเหนือเหรียญ ซึ่งเป็นภาพของเหรียญ แถบด้านซ้ายแสดงว่าความลึกปรากฏน้อยกว่าความลึกจริง"
    caption: "ตาลากแนวรังสีย้อนกลับเป็นเส้นตรง จึงเห็นเหรียญตื้นกว่าความจริง"
  - type: worked-example
    title: สระว่ายน้ำลึกจริงเท่าใด
    problem: "มองลงไปในสระว่ายน้ำเกือบตั้งฉากกับผิวน้ำ เห็นกระเบื้องที่พื้นสระลึกประมาณ $1.2\\ \\mathrm{m}$ สระลึกจริงเท่าใด (น้ำ $n = 1.33$ อากาศ $n = 1.00$)"
    steps:
      - text: "ตาอยู่ในอากาศ วัตถุอยู่ในน้ำ: $\\dfrac{\\text{ลึกปรากฏ}}{\\text{ลึกจริง}} = \\dfrac{1.00}{1.33}$"
        why: "แสงออกจากน้ำสู่อากาศเบนออกจากเส้นปกติ ภาพจึงตื้นกว่าวัตถุ อัตราส่วนต้องน้อยกว่า 1"
      - text: "ลึกจริง $= 1.2 \\times 1.33 \\approx 1.60\\ \\mathrm{m}$"
      - text: "ตรวจ: ความลึกจริงมากกว่าความลึกที่เห็น สมเหตุสมผล"
    answer: "ประมาณ $1.6\\ \\mathrm{m}$ ลึกกว่าที่ตาเห็นราว $0.4\\ \\mathrm{m}$"
  - { type: check, problem: phy.refr.p003, prompt: "แสงเข้าน้ำเบนไปทางไหน" }
  - type: worked-example
    title: แว่นขยาย วาดรังสีแล้วคำนวณ
    problem: "ส่องตัวหนังสือสูง $4\\ \\mathrm{mm}$ ด้วยเลนส์นูนความยาวโฟกัส $20\\ \\mathrm{cm}$ โดยวางเลนส์ห่างตัวหนังสือ $12\\ \\mathrm{cm}$ ภาพเกิดที่ใด เป็นแบบใด และสูงเท่าใด"
    figure:
      src: magnifier-ray-diagram.svg
      alt: "แผนภาพรังสีของเลนส์นูน วัตถุอยู่ระหว่างจุดโฟกัส F กับเลนส์ รังสีขนานแกนจากปลายวัตถุหักเหผ่าน F′ อีกฝั่ง รังสีผ่านกึ่งกลางเลนส์เดินตรงไม่เบน รังสีหักเหทั้งสองกระจายออก แนวต่อย้อนกลับเป็นเส้นประไปตัดกันฝั่งเดียวกับวัตถุ ไกลกว่า F เกิดภาพเสมือนหัวตั้งขนาดใหญ่กว่าวัตถุ"
    steps:
      - text: "วาดรังสี (ภาพประกอบ): วัตถุอยู่ใกล้กว่า $f$ รังสีหักเหกระจายออก ต้องต่อแนวย้อนกลับ ได้ภาพเสมือน หัวตั้ง ใหญ่ขึ้น อยู่ฝั่งเดียวกับวัตถุ"
      - text: "สูตรเลนส์: $\\dfrac{1}{s'} = \\dfrac{1}{20} - \\dfrac{1}{12} = \\dfrac{3 - 5}{60} = -\\dfrac{1}{30}$ ได้ $s' = -30\\ \\mathrm{cm}$"
        why: "$s'$ เป็นลบยืนยันว่าเป็นภาพเสมือนฝั่งเดียวกับวัตถุ ตรงกับแผนภาพ"
      - text: "กำลังขยาย $m = \\dfrac{|s'|}{s} = \\dfrac{30}{12} = 2.5$ ภาพสูง $2.5 \\times 4 = 10\\ \\mathrm{mm}$"
    answer: "ภาพเสมือน หัวตั้ง ห่างเลนส์ $30\\ \\mathrm{cm}$ ฝั่งเดียวกับตัวหนังสือ สูง $10\\ \\mathrm{mm}$"
  - { type: check, problem: phy.refr.p014, prompt: "ดรรชนีหักเหมาก แสงเร็วหรือช้า" }
  - type: interactive
    title: มุมหักเหตามกฎของสเนลล์
    caption: แกนนอนคือมุมตกกระทบ แกนตั้งคือมุมหักเห (องศา) a คือดรรชนีหักเหของตัวกลางที่แสงเริ่มต้นอยู่ b คือของตัวกลางที่แสงเข้าไป เส้นที่สอง (y = x) คือกรณีที่แสงไม่เบน ลองตั้ง a = 1.5 และ b = 1 กราฟจะหยุดที่มุมวิกฤต เพราะมุมที่มากกว่านั้นแสงสะท้อนกลับหมด
    widget:
      kind: function-plot
      functions: ["\\frac{180}{\\pi}\\arcsin\\left(\\frac{a}{b}\\sin\\left(\\frac{\\pi x}{180}\\right)\\right)", "x"]
      sliders:
        - { name: a, min: 1, max: 2.5, step: 0.05, value: 1, label: ดรรชนีหักเหตัวกลางแรก }
        - { name: b, min: 1, max: 2.5, step: 0.05, value: 1.5, label: ดรรชนีหักเหตัวกลางที่สอง }
      x: [0, 90]
      y: [0, 90]
  - type: simulation
    title: การหักเหของแสง (PhET Bending Light)
    url: https://phet.colorado.edu/en/simulations/bending-light
    provider: phet
    note: ยิงเลเซอร์จากอากาศเข้าน้ำและแก้ว ใช้ไม้โปรแทรกเตอร์วัดมุมแล้วตรวจกฎของสเนลล์ จากนั้นสลับให้แสงออกจากแก้วสู่อากาศ ค่อย ๆ เพิ่มมุมจนแสงหักเหหายไปทั้งหมด นั่นคือมุมวิกฤต
  - type: simulation
    title: "ภาพจากเลนส์ (PhET Geometric Optics)"
    url: https://phet.colorado.edu/en/simulations/geometric-optics
    provider: phet
    note: เลือกหน้าจอเลนส์ (Lens) ลากวัตถุเข้าใกล้เลนส์นูนจนผ่านจุดโฟกัส สังเกตว่าภาพเปลี่ยนจากภาพจริงหัวกลับอีกฝั่งของเลนส์เป็นภาพเสมือนหัวตั้ง แล้วลองเปลี่ยนเป็นเลนส์เว้า
glossary:
  - { term: ดรรชนีหักเห, definition: "อัตราส่วนระหว่างอัตราเร็วแสงในสุญญากาศกับในตัวกลาง $n = \\tfrac{c}{v}$ ไม่มีหน่วย ยิ่งมากแสงยิ่งช้า" }
  - { term: มุมวิกฤต, definition: "มุมตกกระทบที่ทำให้มุมหักเหเป็น $90^\\circ$ เกิดเมื่อแสงไปจากตัวกลางที่ $n$ มากสู่ $n$ น้อย หาจาก $\\sin\\theta_c = \\tfrac{n_2}{n_1}$" }
  - { term: การสะท้อนกลับหมด, definition: "การที่แสงสะท้อนกลับทั้งหมดที่รอยต่อ เมื่อแสงไปจาก $n$ มากสู่ $n$ น้อยและมุมตกกระทบมากกว่ามุมวิกฤต" }
  - { term: เลนส์นูน และ เลนส์เว้า, definition: "เลนส์นูนตรงกลางหนา รวมแสง $f > 0$ เลนส์เว้าตรงกลางบาง กระจายแสง $f < 0$" }
flashcards:
  - { front: "นิยามดรรชนีหักเห", back: "$n = \\dfrac{c}{v}$ เมื่อ $c = 3.0 \\times 10^8\\ \\mathrm{m/s}$ เช่น แก้ว $n = 1.5$ แสงในแก้วเร็ว $2.0 \\times 10^8\\ \\mathrm{m/s}$" }
  - { front: "กฎของสเนลล์", back: "$n_1 \\sin\\theta_1 = n_2 \\sin\\theta_2$ เข้าตัวกลาง $n$ มากขึ้น แสงเบนเข้าหาเส้นปกติ" }
  - { front: "เงื่อนไขการสะท้อนกลับหมด", back: "แสงไปจาก $n$ มากสู่ $n$ น้อย และมุมตกกระทบมากกว่ามุมวิกฤต $\\sin\\theta_c = \\tfrac{n_2}{n_1}$" }
  - { front: "แว่นขยายใช้เลนส์อะไร วัตถุอยู่ตรงไหน", back: "เลนส์นูน วัตถุอยู่ใกล้กว่าจุดโฟกัส ได้ภาพเสมือน หัวตั้ง ขนาดใหญ่" }
