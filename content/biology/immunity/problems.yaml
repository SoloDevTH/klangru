      - { id: c, text: "ร่างกายสร้างภูมิคุ้มกันทำลายเซลล์ในจมูกของตัวเอง", feedback: "เป็นลักษณะของโรคภูมิต้านทานต่อเนื้อเยื่อตนเอง ไม่ใช่ภูมิแพ้" }
