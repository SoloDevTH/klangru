id: management.quality.iso-management-systems
subject: management
title: { th: ระบบมาตรฐานการจัดการ ISO และการตรวจติดตามภายใน, en: ISO management systems and internal auditing }
summary: ข้อกำหนด ISO 9001 รายข้อ (สรุปด้วยคำของเราเอง) การคิดบนฐานความเสี่ยง เอกสารและบันทึก การตรวจติดตามภายใน การทบทวนโดยฝ่ายบริหาร การแก้ไขและป้องกัน และโครงสร้างร่วมกับ ISO 14001 และ 45001
difficulty: 6
minutes: 45
prerequisites: [management.quality.concepts]
encompasses:
  - { id: management.quality.concepts, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: risk-matrix.svg
    alt: "เมทริกซ์ความเสี่ยง 5 × 5 แกนตั้งคือโอกาสเกิด 1 แทบไม่เกิด ถึง 5 เกิดเกือบแน่ แกนนอนคือผลกระทบ 1 น้อยมาก ถึง 5 รุนแรง ช่องระบายสีตามคะแนนโอกาสคูณผลกระทบ สีเขียว ต่ำ 1–4 สีเหลือง ปานกลาง 5–9 สีส้ม สูง 10–14 สีแดง สูงมาก 15–25 ช่องมุมล่างซ้ายเป็นสีเขียว มุมบนขวาเป็นสีแดง"
    caption: "เมทริกซ์ความเสี่ยงแบบหนึ่งที่องค์กรนิยมใช้ เกณฑ์แบ่งระดับแต่ละองค์กรกำหนดเอง"
  - type: worked-example
    title: ประเมินความเสี่ยงของโรงงานอาหารก่อนและหลังมีมาตรการ
    problem: "โรงงานน้ำพริกแห่งหนึ่ง (สมมติ) ประเมินความเสี่ยง \"ผู้ขายพริกแห้งส่งของที่มีสารอะฟลาท็อกซินเกินเกณฑ์\" ว่าโอกาสเกิด 4 ผลกระทบ 4 หลังเพิ่มมาตรการตรวจผลวิเคราะห์ทุกล็อตก่อนรับและคัดผู้ขายใหม่ โอกาสเกิดลดเหลือ 2 ใช้เมทริกซ์ในภาพหาระดับความเสี่ยงก่อนและหลัง"
    steps:
      - text: "ก่อนมีมาตรการ: $4 \\times 4 = 16$ อยู่ในช่วง 15–25 ระดับสูงมาก"
      - text: "หลังมีมาตรการ: $2 \\times 4 = 8$ อยู่ในช่วง 5–9 ระดับปานกลาง"
        why: "มาตรการตรวจรับลดโอกาสที่ของไม่ดีจะเข้าโรงงาน แต่ถ้าหลุดเข้ามา ผลกระทบต่อผู้บริโภคยังรุนแรงเท่าเดิม"
      - text: "ความเสี่ยงยังไม่ต่ำ จึงติดตามผลวิเคราะห์ของผู้ขายต่อเนื่อง และทบทวนในการประชุมทบทวนโดยฝ่ายบริหาร"
    answer: "ก่อน 16 (สูงมาก) หลัง 8 (ปานกลาง) ยังต้องเฝ้าระวังต่อ"
  - { type: check, problem: management.quality.iso-management-systems.p005 }
  - type: figure
    src: audit-flow.svg
    alt: "ผังเจ็ดขั้นของการตรวจติดตามภายใน: วางแผน (กำหนดขอบเขต เกณฑ์ และผู้ตรวจ) → เตรียม (ทบทวนเอกสาร ทำรายการตรวจ) → ประชุมเปิด → เก็บหลักฐาน (สัมภาษณ์ สังเกต สุ่มดูบันทึก) → สรุปข้อพบ (เทียบหลักฐานกับข้อกำหนด) → ประชุมปิดและรายงาน → ติดตามผล (ตรวจว่าแก้ไขได้ผลจริง) ด้านล่างมีกรอบบอกว่าข้อพบที่ดีมีสามส่วน คือ ข้อกำหนด หลักฐาน และข้อความสรุป เขียนตามข้อเท็จจริง ไม่กล่าวโทษบุคคล"
    caption: "ขั้นตอนการตรวจติดตามภายในและองค์ประกอบของข้อพบ"
  - type: worked-example
    title: เขียนข้อพบจากการตรวจติดตามภายใน
    problem: "ผู้ตรวจภายในของโรงพยาบาลสุ่มดูเครื่องวัดความดัน 10 เครื่องในหอผู้ป่วยอายุรกรรม พบ 3 เครื่องเลยกำหนดสอบเทียบ 2 เดือน ขั้นตอนของโรงพยาบาลกำหนดให้สอบเทียบทุก 12 เดือน และไม่มีผู้รับผิดชอบติดตามกำหนด จงเขียนข้อพบและเสนอสิ่งที่หอผู้ป่วยต้องทำ"
    steps:
      - text: "ข้อกำหนด: ขั้นตอนการสอบเทียบเครื่องมือของโรงพยาบาลกำหนดรอบ 12 เดือน (เกี่ยวกับทรัพยากรสำหรับการวัดในข้อ 7.1)"
      - text: "หลักฐาน: จาก 10 เครื่องที่สุ่ม พบ 3 เครื่อง (ระบุหมายเลขครุภัณฑ์) เลยกำหนด 2 เดือน"
        why: "หลักฐานต้องตรวจซ้ำได้ ระบุจำนวนที่สุ่ม จำนวนที่พบ และสิ่งที่ชี้บ่งได้"
      - text: "ข้อความสรุป: เครื่องมือวัดบางส่วนไม่ได้สอบเทียบตามรอบที่กำหนด และไม่มีการมอบหมายผู้ติดตามกำหนดสอบเทียบ"
      - text: "การแก้ไข: หยุดใช้ 3 เครื่องและส่งสอบเทียบ ตรวจผลการวัดย้อนหลังที่อาจได้รับผล"
      - text: "ปฏิบัติการแก้ไข: กำหนดผู้รับผิดชอบ ทำทะเบียนเครื่องมือพร้อมระบบแจ้งเตือนล่วงหน้า แล้วติดตามประสิทธิผลในการตรวจครั้งถัดไป"
        why: "สาเหตุคือไม่มีใครถูกมอบหมาย ถ้าแก้แค่ส่งเครื่องสอบเทียบ ปีหน้าจะเกิดซ้ำ"
    answer: "ข้อบกพร่องย่อย (ระบบมีแต่ปฏิบัติไม่ครบ) แก้ไขโดยหยุดใช้และสอบเทียบ แล้วกำจัดสาเหตุด้วยการมอบหมายผู้รับผิดชอบและระบบแจ้งเตือน"
  - { type: check, problem: management.quality.iso-management-systems.p003 }
glossary:
  - { term: ระบบบริหารคุณภาพ, definition: "ชุดของนโยบาย กระบวนการ และทรัพยากรที่องค์กรใช้กำกับให้ส่งมอบสินค้าและบริการตรงความต้องการได้สม่ำเสมอ" }
  - { term: โครงสร้างร่วม (harmonized structure), definition: "โครงข้อ 1–10 ที่มาตรฐานระบบการจัดการของ ISO ใช้ร่วมกัน ทำให้รวมหลายระบบเป็นระบบเดียวได้" }
  - { term: การตรวจติดตามภายใน, definition: "การตรวจโดยองค์กรเอง (ฝ่ายที่หนึ่ง) ว่าระบบเป็นไปตามข้อกำหนดและใช้ได้ผล" }
  - { term: การทบทวนโดยฝ่ายบริหาร, definition: "การประชุมตามรอบของผู้บริหารสูงสุดเพื่อประเมินความเหมาะสมและประสิทธิผลของระบบ และตัดสินใจปรับปรุง" }
  - { term: การปฏิบัติการแก้ไข, definition: "การกำจัดสาเหตุของสิ่งที่ไม่เป็นไปตามข้อกำหนดที่เกิดแล้ว เพื่อไม่ให้เกิดซ้ำ ต่างจากการแก้ไขที่จัดการแค่ผล" }
  - { term: ข้อมูลที่เป็นเอกสาร, definition: "เอกสารที่ต้องคงไว้ (บอกวิธีทำ) และบันทึกที่ต้องเก็บรักษา (หลักฐานว่าทำแล้ว)" }
flashcards:
  - { front: "ข้อ 4–10 ของ ISO 9001 กับ PDCA", back: "4–7 ส่วนใหญ่เป็น P · 8 เป็น D · 9 เป็น C · 10 เป็น A (ข้อ 5 ผู้นำอยู่ตรงกลางวงจร)" }
  - { front: "แก้ไข vs ปฏิบัติการแก้ไข vs ป้องกัน", back: "แก้ผลที่เกิด · กำจัดสาเหตุของสิ่งที่เกิดแล้ว · กำจัดสาเหตุของสิ่งที่ยังไม่เกิด" }
  - { front: "การตรวจฝ่ายที่ 1, 2, 3", back: "ตรวจตัวเอง · ลูกค้าตรวจผู้ขาย · หน่วยรับรองอิสระตรวจ" }
  - { front: "ข้อพบที่ดีมีอะไรบ้าง", back: "ข้อกำหนด · หลักฐานที่ตรวจซ้ำได้ · ข้อความสรุปว่าไม่เป็นไปตามอย่างไร" }
  - { front: "คะแนนความเสี่ยง", back: "โอกาสเกิด × ผลกระทบ แล้วเทียบเกณฑ์ระดับที่องค์กรกำหนด" }
