    stem: "เรียงเศษส่วนจากน้อยไปมาก"
    items: ["$\\dfrac{7}{12}$", "$\\dfrac{5}{8}$", "$\\dfrac{2}{3}$", "$\\dfrac{3}{4}$", "$\\dfrac{5}{6}$"]
    hints:
      - "ทำตัวส่วนให้เท่ากันทั้งหมด ค.ร.น. ของ 12, 8, 3, 4, 6 คือ 24"
      - "เขียนแต่ละจำนวนเป็นส่วน 24 แล้วเทียบตัวเศษ"
