id: health.community.diversity-inclusion
subject: health
title: { th: คุณค่าของความหลากหลาย อคติ การเลือกปฏิบัติ และการสร้างการมีส่วนร่วม, en: "The value of diversity, bias, discrimination and building participation" }
summary: เข้าใจความหลากหลายในชุมชน ที่มาของภาพเหมารวม อคติ และการเลือกปฏิบัติ และวิธีทำให้ทุกคนเข้าร่วมกิจกรรมชุมชนได้
difficulty: 3.5
minutes: 35
prerequisites: [health.sexuality.gender-and-respect]
encompasses:
  - { id: health.sexuality.gender-and-respect, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ห่วงโซ่จากภาพเหมารวมสู่ผลต่อคน
    src: stereotype-chain.svg
    alt: "ลูกศรเชื่อมสี่กล่องจากซ้ายไปขวา: ภาพเหมารวม (สรุปทั้งกลุ่มจากความเชื่อ) → อคติ (ความรู้สึกทางลบต่อกลุ่มคน) → การเลือกปฏิบัติ (ปฏิบัติต่อคนอย่างไม่เป็นธรรม) → ผลต่อคน (ไม่ได้รับการยอมรับและถูกกีดกัน)"
    caption: "การหยุดห่วงโซ่ตั้งแต่ต้นทางง่ายกว่าการแก้ผลที่เกิดขึ้นแล้ว"
  - { type: check, problem: health.community.diversity-inclusion.p003, prompt: "ลองคิดก่อนอ่านต่อ: ข้อใดเป็นตัวอย่างของภาพเหมารวม" }
  - type: worked-example
    title: สัดส่วนเปลี่ยนหรือไม่ เมื่อจำนวนคนเพิ่มขึ้น
    problem: "กิจกรรมเดิมมีผู้เข้าร่วม 20 คน ในนั้น 6 คนมาจากกลุ่มที่เคยเข้าร่วมน้อย ปีถัดมามีผู้เข้าร่วม 30 คน และ 9 คนมาจากกลุ่มนั้น สัดส่วนเปลี่ยนไปหรือไม่ (ข้อมูลสมมติ)"
    steps:
      - text: "สัดส่วนปีแรก: 6 ÷ 20 × 100 = 30%"
      - text: "สัดส่วนปีถัดมา: 9 ÷ 30 × 100 = 30%"
        why: "จำนวนคนที่มาจากกลุ่มนี้เพิ่มจาก 6 เป็น 9 แต่ต้องเทียบกับจำนวนผู้เข้าร่วมทั้งหมดที่เพิ่มด้วย"
      - text: "สรุป: สัดส่วนไม่เปลี่ยน (30% เท่ากัน) แม้จำนวนคนจะเพิ่มขึ้น"
        why: "การดูแค่จำนวนคนอาจทำให้เข้าใจว่ากิจกรรมทั่วถึงขึ้น ทั้งที่สัดส่วนยังไม่เปลี่ยน"
    answer: "สัดส่วนไม่เปลี่ยน ยังคงเป็น 30%"
  - type: worked-example
    title: ใช้งบให้ข้อเสนอเข้าถึงทุกคน
    problem: "ชุมชนมีงบ 12,000 บาท จ่ายค่าทางลาด 3,500 บาท และค่าป้ายสองภาษา 1,200 บาท จะเหลืองบเท่าไร"
    steps:
      - text: "รวมค่าใช้จ่ายสองรายการ: 3,500 + 1,200 = 4,700 บาท"
      - text: "หักจากงบทั้งหมด: 12,000 − 4,700 = 7,300 บาท"
        why: "ต้องหักทั้งสองรายการจึงจะได้งบที่เหลือจริง ไม่ใช่หักเพียงรายการเดียว"
      - text: "ตัดสินใจใช้งบที่เหลือ: เลือกข้อเสนออื่นที่ตอบความต้องการของกลุ่มอื่นด้วย"
        why: "การมีส่วนร่วมที่ดีต้องคิดถึงทุกกลุ่ม ไม่ใช่แค่กลุ่มที่เห็นได้ชัด"
    answer: "เหลือ 7,300 บาท"
  - { type: figure, title: ทางเข้าอาคารชุมชนสองแบบ, src: inclusive-access.svg, alt: "อาคารชุมชนที่มีทางเข้าสองทางระดับเดียวกันที่ธรณีประตู ทางเข้า A ทางซ้ายใช้บันไดสามขั้น ทางเข้า B ทางขวาใช้ทางลาดลาดเอียง มีตัวอักษร A และ B กำกับ", caption: "ดูว่าทางเข้าแต่ละแบบให้ใครเข้าได้บ้าง (ภาพไม่ได้วาดตามสัดส่วนจริง ทางลาดสำหรับรถเข็นจริงต้องยาวและลาดชันน้อยกว่าในภาพมาก)" }
glossary:
  - { term: ภาพเหมารวม, definition: "ความเชื่อกว้าง ๆ ที่สรุปทั้งกลุ่มจากลักษณะบางอย่าง โดยไม่ได้รู้จักคนจริงในกลุ่มนั้น" }
  - { term: อคติ, definition: "ความรู้สึกหรือทัศนคติทางลบที่มีต่อคนหรือกลุ่มคน ซึ่งมักเกิดจากภาพเหมารวม" }
  - { term: การเลือกปฏิบัติ, definition: "การปฏิบัติต่อคนหรือกลุ่มคนต่างกันอย่างไม่เป็นธรรมเพราะความแตกต่าง" }
  - { term: upstander, definition: "คนที่ยืนข้างผู้ถูกกระทำและลงมือช่วยหยุดเหตุการณ์ ต่างจาก bystander ซึ่งเห็นแล้วนิ่งเฉย" }
flashcards:
  - { front: "ห่วงโซ่ของการกีดกันเริ่มจากอะไรและไปถึงอะไร", back: "ภาพเหมารวม → อคติ → การเลือกปฏิบัติ → ผลต่อคน" }
  - { front: "upstander คืออะไร", back: "คนที่ยืนข้างผู้ถูกกระทำและช่วยหยุดเหตุการณ์ ไม่ใช่คนที่เห็นแล้วนิ่งเฉย" }
  - { front: "ข้อเสนอใดช่วยให้ทุกคนเข้าร่วมกิจกรรมได้", back: "ทางลาด ป้ายหลายภาษา และการปรับกิจกรรมให้ทุกคนเข้าร่วมได้" }
  - { front: "ถูกกลั่นแกล้งเพราะความแตกต่าง ควรติดต่อใคร", back: "ผู้ใหญ่ที่ไว้ใจ สายเด็ก 1387 หรือศูนย์ช่วยเหลือสังคม 1300" }
