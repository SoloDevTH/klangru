      - "ส่วนต่างต่อกิโลกรัมคูณด้วย 10"
    misconceptions:
      - { match: 3, feedback: "3 บาทคือส่วนต่างต่อกิโลกรัม ซื้อ 10 กิโลกรัมต้องคูณ 10" }
      - { match: 215, feedback: "ดูเหมือนนำราคา 3 กิโลกรัมของร้าน ก (105) ไปเทียบกับราคา 10 กิโลกรัมของร้าน ข ต้องหาราคา 10 กิโลกรัมของทั้งสองร้าน" }
    solution: "ร้าน ก: $105 \\div 3 = 35$ บาท/กก. 10 กก. $= 350$ บาท ร้าน ข: $32 \\times 10 = 320$ บาท ร้าน ข ถูกกว่า $350 - 320 = 30$ บาท"
