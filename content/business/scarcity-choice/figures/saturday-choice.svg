<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 285" width="640" height="285" font-family="sans-serif" font-size="14">
  <title>ทางเลือกสามทางของบ่ายวันเสาร์และค่าเสียโอกาส</title>
  <rect x="0" y="0" width="640" height="285" fill="#ffffff"/>
  <rect x="220.0" y="20.0" width="200.0" height="56.0" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="320.0" y="43.4" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">บ่ายวันเสาร์ของน้องแก้ม</text>
  <text x="320.0" y="62.3" text-anchor="middle" fill="#1f2937" font-size="14">มีเวลา 3 ชั่วโมง</text>
  <line x1="320.0" y1="76.0" x2="115.2" y2="128.7" stroke="#1f2937" stroke-width="2"/>
  <polygon points="110.0,130.0 117.2,124.5 118.9,131.3" fill="#1f2937"/>
  <rect x="20.0" y="130.0" width="180.0" height="70.0" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/>
  <text x="110.0" y="160.5" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">ช่วยป้าขายส้มตำ</text>
  <text x="110.0" y="179.4" text-anchor="middle" fill="#1f2937" font-size="14">ได้ค่าขนม 120 บาท</text>
  <line x1="320.0" y1="76.0" x2="320.0" y2="124.6" stroke="#1f2937" stroke-width="2"/>
  <polygon points="320.0,130.0 316.5,121.7 323.5,121.7" fill="#1f2937"/>
  <rect x="230.0" y="130.0" width="180.0" height="70.0" rx="8" fill="#ede9fe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="320.0" y="160.5" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">รับจ้างเก็บมะม่วง</text>
  <text x="320.0" y="179.4" text-anchor="middle" fill="#1f2937" font-size="14">ได้ค่าจ้าง 150 บาท</text>
  <line x1="320.0" y1="76.0" x2="524.8" y2="128.7" stroke="#1f2937" stroke-width="2"/>
  <polygon points="530.0,130.0 521.1,131.3 522.8,124.5" fill="#1f2937"/>
  <rect x="440.0" y="130.0" width="180.0" height="70.0" rx="8" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="530.0" y="160.5" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">อ่านหนังสือเตรียมสอบ</text>
  <text x="530.0" y="179.4" text-anchor="middle" fill="#1f2937" font-size="14">สิ่งที่เลือก</text>
  <text x="320.0" y="235.0" text-anchor="middle" fill="#1f2937" font-size="14">ทางเลือกที่ไม่ได้เลือกและดีที่สุดคือ เก็บมะม่วง (150 บาท)</text>
  <text x="320.0" y="262.0" text-anchor="middle" fill="#6d28d9" font-size="14" font-weight="bold">ค่าเสียโอกาสของการอ่านหนังสือ = 150 บาท (ไม่ใช่ 120 + 150)</text>
</svg>
