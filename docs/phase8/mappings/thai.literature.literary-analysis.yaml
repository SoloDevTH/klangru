  - { framework: th-core-2551-thai, indicators: ["ท 5.1 ม.3/2"], coverage: full, note: "วิถีไทยในตัวบท (ตลาดแพค้าขายทางน้ำ ชุมชนมอญที่เกร็ดและการแต่งกาย วัฒนธรรมหมากพลู) และคุณค่า" }
  - { framework: th-core-2551-thai, indicators: ["ท 5.1 ม.4-6/1"], coverage: full, note: "หลักการวิจารณ์เบื้องต้น 4 ขั้น การวิจารณ์จุดเด่นจุดด้อยโดยอ้างตัวบท และการพิจารณาขนบ (นิราศคร่ำครวญถึงหญิง) ก่อนตัดสิน" }
