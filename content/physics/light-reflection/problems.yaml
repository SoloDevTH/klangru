problems:
  - id: phy.refl.p001
    topics: [physics.light.reflection]
    difficulty: 1
    type: numeric
    stem: "แสงเลเซอร์ตกกระทบกระจกเงาราบด้วยมุมตกกระทบ $40^\\circ$ (วัดจากเส้นปกติ) มุมสะท้อนเป็นกี่องศา (ตอบเป็นตัวเลขในหน่วยองศา)"
    answer: { value: 40, unit: องศา }
    hints:
      - "กฎการสะท้อนบอกความสัมพันธ์ระหว่างมุมตกกระทบกับมุมสะท้อนอย่างไร"
      - "ทั้งสองมุมวัดจากเส้นปกติ จึงเทียบกันได้โดยตรง"
    misconceptions:
      - { match: 50, feedback: "นั่นคือมุมระหว่างรังสีสะท้อนกับผิวกระจก ($90^\\circ - 40^\\circ$) มุมสะท้อนวัดจากเส้นปกติเหมือนมุมตกกระทบ" }
      - { match: 80, feedback: "นั่นคือมุมระหว่างรังสีตกกระทบกับรังสีสะท้อน ($40^\\circ + 40^\\circ$) โจทย์ถามเฉพาะมุมสะท้อน" }
    solution: "กฎการสะท้อน $\\theta_r = \\theta_i = 40^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refl.p002
    topics: [physics.light.reflection]
    difficulty: 1
    type: numeric
    stem: "รังสีแสงตกกระทบกระจกเงาราบโดยทำมุม $25^\\circ$ กับ **ผิวกระจก** มุมสะท้อนเป็นกี่องศา (ตอบเป็นตัวเลขในหน่วยองศา)"
    answer: { value: 65, unit: องศา }
    hints:
      - "มุมตกกระทบต้องวัดจากเส้นปกติ ซึ่งตั้งฉากกับผิวกระจก"
      - "หามุมตกกระทบจาก $90^\\circ$ ลบมุมที่วัดจากผิว แล้วใช้กฎการสะท้อน"
    misconceptions:
      - { match: 25, feedback: "$25^\\circ$ วัดจากผิวกระจก แต่มุมสะท้อนต้องวัดจากเส้นปกติ เปลี่ยนเป็นมุมจากเส้นปกติก่อน" }
    solution: "มุมตกกระทบ $= 90^\\circ - 25^\\circ = 65^\\circ$ จากกฎการสะท้อน มุมสะท้อน $= 65^\\circ$ (รังสีสะท้อนก็ทำมุม $25^\\circ$ กับผิวกระจกเช่นกัน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refl.p003
    topics: [physics.light.reflection]
    difficulty: 2
    type: numeric
    stem: "ลูกค้าในร้านตัดผมนั่งห่างกระจกเงาราบบนผนัง $1.5\\ \\mathrm{m}$ ระยะระหว่างลูกค้ากับภาพของตัวเองในกระจกเป็นกี่เมตร (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 3, unit: m }
    hints:
      - "ภาพในกระจกเงาราบอยู่หลังกระจกเป็นระยะเท่าใด"
      - "รวมระยะจากลูกค้าถึงกระจก กับจากกระจกถึงภาพ"
    misconceptions:
      - { match: 1.5, feedback: "นั่นคือระยะจากลูกค้าถึงกระจก แต่ภาพอยู่ลึกเข้าไปหลังกระจกอีก $1.5\\ \\mathrm{m}$" }
    solution: "ภาพอยู่หลังกระจก $1.5\\ \\mathrm{m}$ เท่ากับระยะวัตถุ ระยะจากลูกค้าถึงภาพ $= 1.5 + 1.5 = 3\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refl.p004
    topics: [physics.light.reflection]
    difficulty: 2
    type: numeric
    stem: "ร้านทองตั้งกระจกเงาราบสองบานทำมุม $60^\\circ$ ต่อกัน แล้ววางสร้อยหนึ่งเส้นไว้ระหว่างกระจก ลูกค้าจะเห็นภาพของสร้อยในกระจกกี่ภาพ (ไม่นับสร้อยเส้นจริง ตอบเป็นจำนวนภาพ)"
    answer: { value: 5, unit: ภาพ }
    hints:
      - "ใช้สูตรจำนวนภาพจากกระจกสองบานทำมุม $\\theta$"
      - "$N = \\dfrac{360^\\circ}{\\theta} - 1$"
    misconceptions:
      - { match: 6, feedback: "$\\tfrac{360}{60} = 6$ นับรวมสร้อยเส้นจริงไปด้วย 1 เส้น ต้องลบ 1 ออกจึงเป็นจำนวนภาพ" }
    solution: "$N = \\dfrac{360^\\circ}{60^\\circ} - 1 = 6 - 1 = 5$ ภาพ (ถ้านับสร้อยจริงด้วย จะดูเหมือนมีสร้อย 6 เส้น)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refl.p005
    topics: [physics.light.reflection]
    difficulty: 2
    type: mcq
    stem: "กระจกโค้งที่ติดตามทางแยกในซอยเป็นกระจกนูน ภาพของรถที่เห็นในกระจกนี้มีลักษณะอย่างไร"
    choices:
      - { id: a, text: "ภาพเสมือน หัวตั้ง ขนาดเล็กกว่ารถจริง", correct: true }
      - { id: b, text: "ภาพจริง หัวกลับ ขนาดเล็กกว่ารถจริง", feedback: "กระจกนูนกระจายแสง รังสีสะท้อนไม่ไปตัดกันจริง จึงให้ภาพจริงไม่ได้ ภาพหัวตั้งเสมอ" }
      - { id: c, text: "ภาพเสมือน หัวตั้ง ขนาดเท่ารถจริง", feedback: "ภาพขนาดเท่าวัตถุเป็นลักษณะของกระจกเงาราบ กระจกนูนให้ภาพเล็กลง จึงเห็นได้กว้าง" }
      - { id: d, text: "ภาพเสมือน หัวตั้ง ขนาดใหญ่กว่ารถจริง", feedback: "ภาพเสมือนขนาดใหญ่ได้จากกระจกเว้าเมื่อวัตถุอยู่ใกล้กว่าจุดโฟกัส เช่น กระจกแต่งหน้า ไม่ใช่กระจกนูน" }
    hints:
      - "กระจกนูนรวมแสงหรือกระจายแสง"
      - "ทำไมกระจกตามทางแยกจึงเห็นถนนได้กว้าง ภาพต้องใหญ่หรือเล็ก"
    solution: "กระจกนูนกระจายแสง ภาพจึงเกิดจากแนวต่อของรังสีหลังกระจก เป็นภาพเสมือน หัวตั้ง และเล็กกว่าวัตถุเสมอ ทำให้มองเห็นบริเวณกว้าง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refl.p006
    topics: [physics.light.reflection]
    difficulty: 3
    type: match
    stem: "จับคู่กระจกและตำแหน่งวัตถุกับลักษณะของภาพที่เกิดขึ้น"
    pairs:
      - { left: "กระจกเงาราบ", right: "ภาพเสมือน หัวตั้ง ขนาดเท่าวัตถุ" }
      - { left: "กระจกนูน วัตถุอยู่ที่ระยะใดก็ได้", right: "ภาพเสมือน หัวตั้ง ขนาดเล็กกว่าวัตถุ" }
      - { left: "กระจกเว้า วัตถุอยู่ใกล้กว่าจุดโฟกัส", right: "ภาพเสมือน หัวตั้ง ขนาดใหญ่กว่าวัตถุ" }
      - { left: "กระจกเว้า วัตถุอยู่ไกลกว่าจุดศูนย์กลางความโค้ง $C$", right: "ภาพจริง หัวกลับ ขนาดเล็กกว่าวัตถุ" }
    hints:
      - "ภาพจริงเกิดได้เฉพาะเมื่อแสงสะท้อนไปตัดกันจริง ซึ่งเกิดกับกระจกเว้าเมื่อวัตถุอยู่ไกลกว่าจุดโฟกัส"
      - "ใช้ $m = \\tfrac{|s'|}{s}$ หรือนึกถึงกระจกแต่งหน้าและกระจกตามทางแยก"
    solution: "กระจกเงาราบ: เสมือน หัวตั้ง เท่าวัตถุ · กระจกนูน: เสมือน หัวตั้ง เล็กลงเสมอ · กระจกเว้า วัตถุใกล้กว่า $F$: เสมือน หัวตั้ง ใหญ่ขึ้น (กระจกแต่งหน้า) · กระจกเว้า วัตถุไกลกว่า $C$ ($s > 2f$): ภาพจริง หัวกลับ เล็กลง อยู่ระหว่าง $F$ กับ $C$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refl.p007
    topics: [physics.light.reflection]
    difficulty: 3
    type: numeric
    stem: "วางวัตถุห่างจากกระจกเว้าที่มีความยาวโฟกัส $10\\ \\mathrm{cm}$ เป็นระยะ $30\\ \\mathrm{cm}$ ภาพเกิดห่างจากกระจกกี่เซนติเมตร (ตอบเป็นตัวเลขในหน่วย cm ถ้าเป็นภาพเสมือนให้ใส่เครื่องหมายลบ)"
    answer: { value: 15, tolerance: 0.1, unit: cm }
    hints:
      - "ใช้ $\\dfrac{1}{f} = \\dfrac{1}{s} + \\dfrac{1}{s'}$ โดยกระจกเว้ามี $f$ เป็นบวก"
      - "จัดรูปเป็น $\\dfrac{1}{s'} = \\dfrac{1}{f} - \\dfrac{1}{s}$ ทำส่วนให้เท่ากัน"
      - "ได้ค่า $\\dfrac{1}{s'}$ แล้วอย่าลืมกลับเศษส่วน"
    misconceptions:
      - { match: 7.5, feedback: "ดูเหมือนบวกส่วนกลับ ($\\tfrac{1}{10} + \\tfrac{1}{30}$) ต้องลบ: $\\dfrac{1}{s'} = \\dfrac{1}{f} - \\dfrac{1}{s}$" }
      - { match: 20, feedback: "ดูเหมือนนำระยะมาลบกันตรง ๆ ($30 - 10$) สูตรกระจกต้องคิดด้วยส่วนกลับของระยะ" }
    solution: "$\\dfrac{1}{s'} = \\dfrac{1}{10} - \\dfrac{1}{30} = \\dfrac{3 - 1}{30} = \\dfrac{1}{15}$ จึงได้ $s' = +15\\ \\mathrm{cm}$ เป็นภาพจริง หัวกลับ อยู่หน้ากระจก ขนาด $m = \\tfrac{15}{30} = 0.5$ เท่าของวัตถุ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refl.p008
    topics: [physics.light.reflection]
    difficulty: 3
    type: numeric
    stem: "วางวัตถุสูง $2\\ \\mathrm{cm}$ ห่างจากกระจกเว้าที่มีความยาวโฟกัส $12\\ \\mathrm{cm}$ เป็นระยะ $18\\ \\mathrm{cm}$ ภาพสูงกี่เซนติเมตร (ตอบเป็นตัวเลขในหน่วย cm)"
    answer: { value: 4, tolerance: 0.05, unit: cm }
    hints:
      - "หาระยะภาพ $s'$ จากสูตรกระจกก่อน"
      - "กำลังขยาย $m = \\dfrac{|s'|}{s}$ แล้วนำไปคูณความสูงวัตถุ"
    misconceptions:
      - { match: 1, feedback: "ดูเหมือนใช้ $\\tfrac{s}{s'}$ กำลังขยายคือระยะภาพหารด้วยระยะวัตถุ $m = \\tfrac{|s'|}{s}$" }
      - { match: 0.8, feedback: "ดูเหมือนบวกส่วนกลับ ได้ $s' = 7.2\\ \\mathrm{cm}$ ต้องใช้ $\\dfrac{1}{s'} = \\dfrac{1}{f} - \\dfrac{1}{s}$" }
    solution: "$\\dfrac{1}{s'} = \\dfrac{1}{12} - \\dfrac{1}{18} = \\dfrac{3 - 2}{36} = \\dfrac{1}{36}$ → $s' = 36\\ \\mathrm{cm}$ (ภาพจริง หัวกลับ) กำลังขยาย $m = \\dfrac{36}{18} = 2$ ภาพสูง $2 \\times 2\\ \\mathrm{cm} = 4\\ \\mathrm{cm}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refl.p009
    topics: [physics.light.reflection]
    difficulty: 4
    type: numeric
    stem: "กระจกนูนมีความยาวโฟกัส $-20\\ \\mathrm{cm}$ วางวัตถุห่างกระจก $30\\ \\mathrm{cm}$ ภาพเกิดที่ระยะเท่าใด (ตอบเป็นตัวเลขในหน่วย cm ถ้าเป็นภาพเสมือนให้ใส่เครื่องหมายลบ)"
    answer: { value: -12, tolerance: 0.1, unit: cm }
    hints:
      - "กระจกนูนมี $f$ เป็นลบ ต้องแทนค่าพร้อมเครื่องหมาย"
      - "$\\dfrac{1}{s'} = \\dfrac{1}{f} - \\dfrac{1}{s}$ แทน $f = -20$ ทำส่วนให้เท่ากัน แล้วกลับเศษส่วน"
    misconceptions:
      - { match: 12, feedback: "ขนาดถูกแล้ว แต่เครื่องหมายผิด กระจกนูนให้ภาพเสมือนเสมอ $s'$ จึงต้องเป็นลบ" }
      - { match: 60, feedback: "ดูเหมือนใช้ $f = +20$ (ลืมเครื่องหมายลบของกระจกนูน) จึงได้ภาพจริง ซึ่งเป็นไปไม่ได้สำหรับกระจกนูน" }
    solution: "$\\dfrac{1}{s'} = \\dfrac{1}{-20} - \\dfrac{1}{30} = \\dfrac{-3 - 2}{60} = -\\dfrac{1}{12}$ → $s' = -12\\ \\mathrm{cm}$ ภาพเสมือน หัวตั้ง อยู่หลังกระจก $12\\ \\mathrm{cm}$ ขนาด $m = \\tfrac{12}{30} = 0.4$ เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refl.p010
    topics: [physics.light.reflection]
    difficulty: 4
    type: numeric
    stem: "ส่องแสงเลเซอร์ไปกระทบกระจกเงาราบ แล้วหมุนกระจกไป $15^\\circ$ โดยแสงตกกระทบยังอยู่ในทิศเดิม รังสีสะท้อนจะหมุนไปกี่องศา (ตอบเป็นตัวเลขในหน่วยองศา)"
    answer: { value: 30, unit: องศา }
    hints:
      - "เมื่อกระจกหมุน $15^\\circ$ เส้นปกติก็หมุน $15^\\circ$ มุมตกกระทบจึงเปลี่ยนไปเท่าใด"
      - "มุมสะท้อนเปลี่ยนเท่ากับมุมตกกระทบ ลองหามุมระหว่างรังสีตกกระทบกับรังสีสะท้อนก่อนและหลังหมุน"
    misconceptions:
      - { match: 15, feedback: "มุมตกกระทบเปลี่ยน $15^\\circ$ และมุมสะท้อนก็เปลี่ยน $15^\\circ$ ด้วย มุมระหว่างรังสีตกกระทบกับรังสีสะท้อน ($2\\theta_i$) จึงเปลี่ยน $30^\\circ$" }
    solution: "สมมติเดิมมุมตกกระทบ $\\theta$ มุมระหว่างรังสีตกกระทบกับรังสีสะท้อนคือ $2\\theta$ เมื่อหมุนกระจก $15^\\circ$ มุมตกกระทบกลายเป็น $\\theta + 15^\\circ$ มุมระหว่างรังสีกลายเป็น $2\\theta + 30^\\circ$ รังสีตกกระทบไม่ขยับ รังสีสะท้อนจึงหมุนไป $30^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refl.p011
    topics: [physics.light.reflection]
    difficulty: 3
    type: numeric
    stem: "ร้านเสื้อผ้าต้องการติดกระจกเงาราบบนผนังแนวตั้ง ให้ลูกค้าสูง $170\\ \\mathrm{cm}$ เห็นภาพตัวเองได้เต็มตัวตั้งแต่ศีรษะจรดเท้า กระจกต้องสูงอย่างน้อยกี่เซนติเมตร (ตอบเป็นตัวเลขในหน่วย cm)"
    answer: { value: 85, unit: cm }
    hints:
      - "แสงจากเท้าสะท้อนเข้าตาที่จุดกึ่งกลางระหว่างระดับตากับระดับเท้า"
      - "เช่นเดียวกับศีรษะ ความสูงของกระจกที่ต้องใช้เป็นสัดส่วนเท่าใดของความสูงตัว"
    misconceptions:
      - { match: 170, feedback: "กระจกไม่จำเป็นต้องสูงเท่าตัว เพราะแสงจากเท้าสะท้อนที่จุดกึ่งกลางระหว่างตากับเท้า กระจกจึงต้องสูงเพียงครึ่งหนึ่ง" }
    solution: "รังสีจากเท้าสะท้อนเข้าตาที่จุดกึ่งกลางระหว่างระดับตากับเท้า รังสีจากศีรษะสะท้อนที่กึ่งกลางระหว่างศีรษะกับตา ส่วนของกระจกที่ใช้จึงยาว $\\tfrac{1}{2}$ ของความสูงตัว $= \\tfrac{170}{2} = 85\\ \\mathrm{cm}$ ไม่ขึ้นกับระยะที่ยืนห่างกระจก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refl.p012
    topics: [physics.light.reflection]
    difficulty: 5
    type: numeric
    stem: "กระจกแต่งหน้าเป็นกระจกเว้าความยาวโฟกัส $25\\ \\mathrm{cm}$ ผู้ใช้ส่องหน้าห่างกระจก $15\\ \\mathrm{cm}$ ภาพของใบหน้าขยายกี่เท่า (ตอบเป็นตัวเลขกำลังขยาย)"
    answer: { value: 2.5, tolerance: 0.03 }
    hints:
      - "วัตถุอยู่ใกล้กว่าจุดโฟกัส คาดว่าจะได้ภาพชนิดใด"
      - "หา $s'$ จาก $\\dfrac{1}{s'} = \\dfrac{1}{f} - \\dfrac{1}{s}$ ซึ่งจะออกมาเป็นลบ"
      - "กำลังขยาย $m = \\dfrac{|s'|}{s}$"
    misconceptions:
      - { match: 0.4, feedback: "ดูเหมือนใช้ $\\tfrac{s}{|s'|}$ กำลังขยายคือระยะภาพหารด้วยระยะวัตถุ กระจกแต่งหน้าต้องขยายภาพให้ใหญ่ขึ้น" }
      - { match: 1.67, feedback: "ดูเหมือนนำ $\\tfrac{f}{s}$ มาเป็นกำลังขยาย ต้องหาระยะภาพ $s'$ จากสูตรกระจกก่อน แล้วใช้ $m = \\tfrac{|s'|}{s}$" }
    solution: "$\\dfrac{1}{s'} = \\dfrac{1}{25} - \\dfrac{1}{15} = \\dfrac{3 - 5}{75} = -\\dfrac{2}{75}$ → $s' = -37.5\\ \\mathrm{cm}$ (ภาพเสมือน หัวตั้ง อยู่หลังกระจก) กำลังขยาย $m = \\dfrac{37.5}{15} = 2.5$ เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refl.p013
    topics: [physics.light.reflection]
    difficulty: 4
    type: expression
    stem: "จากสูตรกระจก $\\dfrac{1}{f} = \\dfrac{1}{s} + \\dfrac{1}{s'}$ จงเขียนระยะภาพ $s'$ ในรูปของ $s$ และ $f$"
    prefix: "s' ="
    answer: { latex: "\\frac{sf}{s-f}", variables: [s, f] }
    misconceptions:
      - { match: "\\frac{sf}{s+f}", feedback: "ดูเหมือนบวกส่วนกลับ เมื่อย้าย $\\tfrac{1}{s}$ ไปอีกข้างต้องเป็นการลบ: $\\tfrac{1}{s'} = \\tfrac{1}{f} - \\tfrac{1}{s}$" }
      - { match: "\\frac{s-f}{sf}", feedback: "นั่นคือ $\\tfrac{1}{s'}$ ยังต้องกลับเศษส่วนอีกขั้นจึงจะได้ $s'$" }
    hints:
      - "ย้าย $\\tfrac{1}{s}$ ไปข้างซ้าย: $\\tfrac{1}{s'} = \\tfrac{1}{f} - \\tfrac{1}{s}$"
      - "รวมเศษส่วนข้างขวาด้วยตัวส่วนร่วม $sf$ แล้วกลับเศษส่วน"
    solution: "$\\dfrac{1}{s'} = \\dfrac{1}{f} - \\dfrac{1}{s} = \\dfrac{s - f}{sf}$ กลับเศษส่วนได้ $s' = \\dfrac{sf}{s - f}$ ตรวจ: $s = 30$, $f = 10$ ได้ $s' = \\tfrac{300}{20} = 15$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refl.p014
    topics: [physics.light.reflection]
    difficulty: 5
    type: numeric
    stem: "ในวิชาวิทยาศาสตร์ นักเรียนใช้กระจกเว้าฉายภาพเปลวเทียนลงบนฉากที่อยู่ห่างกระจก $60\\ \\mathrm{cm}$ ได้ภาพจริงที่สูงเป็น 3 เท่าของเปลวเทียน กระจกนี้มีความยาวโฟกัสกี่เซนติเมตร (ตอบเป็นตัวเลขในหน่วย cm)"
    answer: { value: 15, tolerance: 0.1, unit: cm }
    hints:
      - "ภาพอยู่บนฉาก จึงรู้ระยะภาพ $s'$ และใช้กำลังขยายหาระยะวัตถุ $s$"
      - "$m = \\dfrac{s'}{s} = 3$ จึงได้ $s = \\dfrac{s'}{3}$"
      - "แทน $s$ และ $s'$ ในสูตรกระจกแล้วกลับเศษส่วน"
    misconceptions:
      - { match: 20, feedback: "นั่นคือระยะวัตถุ (เปลวเทียนห่างกระจก) ยังต้องนำไปแทนในสูตรกระจกเพื่อหา $f$" }
      - { match: 30, feedback: "ดูเหมือนลบส่วนกลับ ($\\tfrac{1}{20} - \\tfrac{1}{60}$) สูตรกระจกคือ $\\tfrac{1}{f} = \\tfrac{1}{s} + \\tfrac{1}{s'}$ ต้องบวก" }
    solution: "$s' = 60\\ \\mathrm{cm}$ และ $m = 3$ จึงได้ $s = \\tfrac{60}{3} = 20\\ \\mathrm{cm}$ จากนั้น $\\dfrac{1}{f} = \\dfrac{1}{20} + \\dfrac{1}{60} = \\dfrac{3 + 1}{60} = \\dfrac{1}{15}$ → $f = 15\\ \\mathrm{cm}$"
    license: CC-BY-SA-4.0
    ai_assisted: true
