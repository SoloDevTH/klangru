  - { front: "F2 ของการผสมสองลักษณะ RrYy × RrYy", back: "ฟีโนไทป์ 9 : 3 : 3 : 1" }
  - { front: "พาหะ × พาหะ ของโรคยีนด้อย", back: "ลูกแต่ละคน ไม่มียีน 1/4 พาหะ 1/2 เป็นโรค 1/4" }
  - { front: "หมู่เลือด ABO มีกี่จีโนไทป์ กี่ฟีโนไทป์", back: "6 จีโนไทป์ 4 ฟีโนไทป์" }
