problems:
  - id: math.discrete.networks.p001
    topics: [math.discrete.networks]
    difficulty: 1
    type: mcq
    stem: "ถ้าใช้กราฟแทนแผนที่ถนนระหว่างอำเภอในจังหวัดหนึ่ง จุดยอดและเส้นเชื่อมควรแทนอะไร"
    choices:
      - { id: a, text: "จุดยอดแทนอำเภอ เส้นเชื่อมแทนถนนที่เชื่อมสองอำเภอ", correct: true }
      - { id: b, text: "จุดยอดแทนถนน เส้นเชื่อมแทนอำเภอ", feedback: "สลับกัน เส้นเชื่อมต้องเชื่อมสองสิ่ง ถนนเป็นสิ่งที่เชื่อมอำเภอสองแห่ง" }
      - { id: c, text: "ความยาวของเส้นเชื่อมในภาพแทนระยะทางจริง", feedback: "ความยาวที่วาดไม่มีความหมาย ถ้าต้องการระยะทางให้เขียนตัวเลข (น้ำหนัก) บนเส้นเชื่อม" }
      - { id: d, text: "จุดยอดแทนรถยนต์ เส้นเชื่อมแทนเส้นทางที่รถวิ่ง", feedback: "รถเคลื่อนที่ไปมา ไม่ใช่สิ่งที่ถูกเชื่อม สิ่งที่ถูกเชื่อมคืออำเภอ" }
    hints:
      - "เส้นเชื่อมแต่ละเส้นเชื่อมจุดยอดสองจุด"
      - "อะไรเป็นสิ่งที่ถนนเชื่อมเข้าด้วยกัน"
    solution: "อำเภอเป็นสิ่งที่สนใจ จึงเป็นจุดยอด ถนนเชื่อมอำเภอสองแห่ง จึงเป็นเส้นเชื่อม ความยาวที่วาดไม่สำคัญ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.discrete.networks.p002
    topics: [math.discrete.networks]
    difficulty: 1
    type: numeric
    figure:
      src: p-graph-g.svg
      alt: "กราฟ G มีจุดยอด 5 จุด A B C D E เส้นเชื่อม AB, AC, BC, BD, CD และ DE"
    stem: "กราฟ G ในภาพมีเส้นเชื่อมกี่เส้น"
    answer: { value: 6, unit: เส้น }
    hints:
      - "เส้นเชื่อมคือเส้นที่ต่อระหว่างจุดยอดสองจุด"
      - "ไล่นับทีละคู่ เช่น AB, AC, ..."
    misconceptions:
      - { match: 5, feedback: "นี่คือจำนวนจุดยอด (A ถึง E) โจทย์ถามจำนวนเส้นเชื่อม" }
      - { match: 12, feedback: "นี่คือผลรวมดีกรี ซึ่งนับเส้นเชื่อมแต่ละเส้นสองครั้ง" }
    solution: "เส้นเชื่อมคือ AB, AC, BC, BD, CD, DE รวม 6 เส้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.discrete.networks.p003
    topics: [math.discrete.networks]
    difficulty: 2
    type: numeric
    figure:
      src: p-graph-g.svg
      alt: "กราฟ G มีจุดยอด 5 จุด A B C D E เส้นเชื่อม AB, AC, BC, BD, CD และ DE"
    stem: "ในกราฟ G จุดยอด D มีดีกรีเท่าใด"
    answer: { value: 3 }
    hints:
      - "ดีกรีคือจำนวนเส้นเชื่อมที่ต่อกับจุดนั้น"
      - "ดูว่า D ต่อกับจุดใดบ้าง"
    misconceptions:
      - { match: 2, feedback: "ลืมเส้น DE ที่ไปยังจุด E ทางขวา" }
      - { match: 6, feedback: "นี่คือจำนวนเส้นเชื่อมทั้งกราฟ ดีกรีนับเฉพาะเส้นที่ต่อกับ D" }
    solution: "D ต่อกับ B, C และ E จึงมีดีกรี 3"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.discrete.networks.p004
    topics: [math.discrete.networks]
    difficulty: 2
    type: mcq
    figure:
      src: p-graph-g.svg
      alt: "กราฟ G มีจุดยอด 5 จุด A B C D E เส้นเชื่อม AB, AC, BC, BD, CD และ DE"
    stem: "ในกราฟ G จุดยอดใดบ้างมีดีกรีเป็นจำนวนคี่ (เลือกทุกข้อที่ถูก)"
    multiple: true
    choices:
      - { id: a, text: "A", feedback: "A ต่อกับ B และ C ดีกรี 2 เป็นจำนวนคู่" }
      - { id: b, text: "B", correct: true }
      - { id: c, text: "C", correct: true }
      - { id: d, text: "D", correct: true }
      - { id: e, text: "E", correct: true }
    hints:
      - "หาดีกรีของทุกจุดก่อน"
      - "ดีกรี: A 2, B ?, C ?, D 3, E ?"
    solution: "ดีกรี A = 2, B = 3, C = 3, D = 3, E = 1 จุดที่มีดีกรีคี่คือ B, C, D, E (4 จุด ซึ่งเป็นจำนวนคู่ตามที่ควรเป็น)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.discrete.networks.p005
    topics: [math.discrete.networks]
    difficulty: 2
    type: match
    stem: "จับคู่คำกับความหมาย"
    pairs:
      - { left: "จุดยอด", right: "จุดที่แทนสิ่งที่สนใจ เช่น สถานี" }
      - { left: "เส้นเชื่อม", right: "เส้นที่เชื่อมจุดยอดสองจุด" }
      - { left: "ดีกรี", right: "จำนวนเส้นเชื่อมที่ต่อกับจุดยอดหนึ่ง" }
      - { left: "วงจร", right: "แนวเดินที่กลับมาจบที่จุดเริ่มต้น" }
      - { left: "กราฟเชื่อมโยง", right: "เดินจากจุดใดไปจุดใดก็ได้" }
    hints:
      - "คำว่า ดีกรี เป็นจำนวน"
      - "วงจรมีจุดเริ่มกับจุดจบเป็นจุดเดียวกัน"
    solution: "จุดยอด = สิ่งที่สนใจ เส้นเชื่อม = เชื่อมสองจุด ดีกรี = จำนวนเส้นที่ต่อกับจุด วงจร = กลับมาที่จุดเริ่ม กราฟเชื่อมโยง = ไปถึงกันได้ทุกจุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.discrete.networks.p006
    topics: [math.discrete.networks]
    difficulty: 3
    type: numeric
    stem: "กราฟหนึ่งมีจุดยอด 5 จุด มีดีกรี 3, 3, 2, 2 และ 4 กราฟนี้มีเส้นเชื่อมกี่เส้น"
    answer: { value: 7, unit: เส้น }
    hints:
      - "ผลรวมดีกรีเกี่ยวข้องกับจำนวนเส้นเชื่อมอย่างไร"
      - "บวกดีกรีทั้งหมดแล้วหารด้วย 2"
    misconceptions:
      - { match: 14, feedback: "นี่คือผลรวมดีกรี เส้นเชื่อมแต่ละเส้นถูกนับสองครั้ง ต้องหารด้วย 2" }
      - { match: 5, feedback: "นี่คือจำนวนจุดยอด ไม่ใช่เส้นเชื่อม" }
    solution: "ผลรวมดีกรี $= 3 + 3 + 2 + 2 + 4 = 14$ จำนวนเส้นเชื่อม $= 14 \\div 2 = 7$ เส้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.discrete.networks.p007
    topics: [math.discrete.networks]
    difficulty: 3
    type: mcq
    stem: "รายการดีกรีของจุดยอดข้อใด **เป็นไปไม่ได้** สำหรับกราฟใด ๆ"
    choices:
      - { id: a, text: "3, 3, 3, 2, 2", correct: true }
      - { id: b, text: "2, 2, 2, 2", feedback: "เป็นไปได้ คือสี่เหลี่ยม 4 จุดต่อกันเป็นวง ผลรวม 8 เป็นจำนวนคู่" }
      - { id: c, text: "3, 3, 3, 3", feedback: "เป็นไปได้ คือ 4 จุดที่ต่อกันครบทุกคู่ ผลรวม 12 เป็นจำนวนคู่" }
      - { id: d, text: "1, 1, 2, 2", feedback: "เป็นไปได้ คือ 4 จุดเรียงเป็นแถว ผลรวม 6 เป็นจำนวนคู่" }
    hints:
      - "ผลรวมดีกรีต้องเท่ากับ 2 เท่าของจำนวนเส้นเชื่อม"
      - "ผลรวมดีกรีจึงต้องเป็นจำนวนคู่เสมอ"
    solution: "$3 + 3 + 3 + 2 + 2 = 13$ เป็นจำนวนคี่ ซึ่งเท่ากับ 2 เท่าของจำนวนเส้นเชื่อมไม่ได้ จึงเป็นไปไม่ได้ (มีจุดดีกรีคี่ 3 จุด ซึ่งเป็นจำนวนคี่)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.discrete.networks.p008
    topics: [math.discrete.networks]
    difficulty: 3
    type: numeric
    stem: "นักกีฬา 8 คนจับมือกันครบทุกคู่ คู่ละ 1 ครั้ง มีการจับมือทั้งหมดกี่ครั้ง"
    answer: { value: 28, unit: ครั้ง }
    hints:
      - "แต่ละคนจับมือกับอีก 7 คน"
      - "$8 \\times 7$ นับการจับมือแต่ละครั้งสองครั้ง (ครั้งละคน)"
    misconceptions:
      - { match: 56, feedback: "นับการจับมือแต่ละครั้งสองครั้ง A จับมือ B กับ B จับมือ A คือครั้งเดียวกัน ต้องหารด้วย 2" }
      - { match: 64, feedback: "ใช้ 8 × 8 ซึ่งรวมการจับมือกับตัวเองด้วย และนับซ้ำ" }
    solution: "แทนคนด้วยจุดยอด ทุกจุดมีดีกรี 7 ผลรวมดีกรี $= 8 \\times 7 = 56$ จำนวนเส้นเชื่อม $= \\tfrac{56}{2} = 28$ ครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.discrete.networks.p009
    topics: [math.discrete.networks]
    difficulty: 3
    type: mcq
    stem: "กราฟในภาพเป็นกราฟเชื่อมโยงหรือไม่"
    figure:
      src: p-components.svg
      alt: "กราฟมีจุดยอด 7 จุด K L M ต่อกันเป็นสามเหลี่ยม KL LM KM และ N O P Q ต่อกันเป็นสี่เหลี่ยม NO OQ QP PN ไม่มีเส้นเชื่อมระหว่างกลุ่ม K L M กับกลุ่ม N O P Q"
    choices:
      - { id: a, text: "ไม่เชื่อมโยง เพราะเดินจาก K ไป N ไม่ได้", correct: true }
      - { id: b, text: "เชื่อมโยง เพราะทุกจุดมีเส้นเชื่อมอย่างน้อยหนึ่งเส้น", feedback: "ทุกจุดมีเส้นเชื่อมยังไม่พอ ต้องเดินจากจุดใดไปจุดใดก็ได้ แต่จาก K ไป N ไม่มีทาง" }
      - { id: c, text: "เชื่อมโยง เพราะมีวงจรในกราฟ", feedback: "การมีวงจรไม่เกี่ยวกับความเชื่อมโยงทั้งกราฟ กราฟนี้มีสองก้อนที่ไม่ต่อกัน" }
      - { id: d, text: "ไม่เชื่อมโยง เพราะดีกรีของแต่ละจุดไม่เท่ากัน", feedback: "ดีกรีของทุกจุดเท่ากัน (2) และดีกรีไม่ได้บอกความเชื่อมโยง ต้องดูว่าเดินถึงกันได้ไหม" }
    hints:
      - "กราฟเชื่อมโยงเดินจากจุดใดไปจุดใดก็ได้"
      - "ลองหาทางเดินจาก K ไป N"
    solution: "กราฟแยกเป็นสองก้อน (K, L, M) กับ (N, O, P, Q) ไม่มีเส้นเชื่อมระหว่างก้อน จึงไม่เชื่อมโยง ต้องเพิ่มเส้นเชื่อมอย่างน้อย 1 เส้นระหว่างสองก้อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.discrete.networks.p010
    topics: [math.discrete.networks]
    difficulty: 4
    type: numeric
    stem: "จากเครือข่ายถนนในภาพ (ตัวเลขคือระยะทางเป็นกิโลเมตร) ระยะทางที่สั้นที่สุดจากหมู่บ้าน A ไปหมู่บ้าน F กี่กิโลเมตร"
    figure:
      src: p-towns.svg
      alt: "เครือข่ายถนนระหว่างหมู่บ้าน 6 แห่ง ระยะทางเป็นกิโลเมตร A–B 4, A–C 2, B–C 1, B–D 5, C–D 8, C–E 10, D–E 2, D–F 6, E–F 3"
    answer: { value: 13, unit: กม. }
    hints:
      - "หาระยะสั้นที่สุดจาก A ไปทีละจุด: C, B, D, E แล้วจึง F"
      - "ไป B ผ่าน C สั้นกว่าไปตรง และไป F ผ่าน E อาจสั้นกว่าผ่าน D ตรง ๆ"
    misconceptions:
      - { match: 14, feedback: "ได้ทาง A–C–B–D–F หรือ A–B–D–E–F ลองเทียบ D → F ตรง (6) กับ D → E → F (2 + 3) และ A → B ตรง (4) กับ A → C → B (3)" }
      - { match: 15, feedback: "เลือกทาง A–C–E–F ที่ผ่านจุดน้อย แต่ C–E ยาว 10 กม. ต้องรวมระยะจริง" }
    solution: "ระยะสั้นสุดจาก A: C = 2, B = 2 + 1 = 3, D = 3 + 5 = 8, E = 8 + 2 = 10 (ผ่าน C ตรงได้ 12), F = 10 + 3 = 13 (ผ่าน D ตรงได้ 14) เส้นทาง A → C → B → D → E → F ยาว 13 กม."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.discrete.networks.p011
    topics: [math.discrete.networks]
    difficulty: 4
    type: mcq
    figure:
      src: p-graph-g.svg
      alt: "กราฟ G มีจุดยอด 5 จุด A B C D E เส้นเชื่อม AB, AC, BC, BD, CD และ DE"
    stem: "ลากเส้นผ่านทุกเส้นเชื่อมของกราฟ G ครั้งเดียวพอดีโดยไม่ยกปากกาได้หรือไม่"
    choices:
      - { id: a, text: "ไม่ได้ เพราะมีจุดยอดดีกรีคี่ 4 จุด", correct: true }
      - { id: b, text: "ได้ ถ้าเริ่มที่ E", feedback: "เริ่มที่ E แล้วยังเหลือจุดดีกรีคี่อีก 3 จุดที่ต้องเป็นจุดจบ ซึ่งมีได้จุดเดียว" }
      - { id: c, text: "ได้ เพราะกราฟเชื่อมโยง", feedback: "เชื่อมโยงเป็นเงื่อนไขที่จำเป็น แต่ยังต้องมีจุดดีกรีคี่ 0 หรือ 2 จุด" }
      - { id: d, text: "ไม่ได้ เพราะมีจุด E ที่มีดีกรี 1", feedback: "จุดดีกรี 1 เป็นจุดเริ่มหรือจุดจบได้ ปัญหาคือมีจุดดีกรีคี่ถึง 4 จุด" }
    hints:
      - "หาดีกรีของทุกจุด แล้วนับจุดที่มีดีกรีคี่"
      - "แนวเดินออยเลอร์ต้องมีจุดดีกรีคี่ 0 หรือ 2 จุด"
    solution: "ดีกรี A 2, B 3, C 3, D 3, E 1 มีจุดดีกรีคี่ 4 จุด แนวเดินที่ผ่านทุกเส้นครั้งเดียวมีจุดดีกรีคี่ได้เฉพาะจุดเริ่มและจุดจบ (ไม่เกิน 2 จุด) จึงทำไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.discrete.networks.p012
    topics: [math.discrete.networks]
    difficulty: 4
    type: numeric
    stem: "ต้องการเดินสายอินเทอร์เน็ตเชื่อม 8 หมู่บ้านให้ทุกหมู่บ้านติดต่อถึงกันได้ (ผ่านหมู่บ้านอื่นได้) ใช้สายระหว่างสองหมู่บ้านน้อยที่สุดกี่เส้น"
    answer: { value: 7, unit: เส้น }
    hints:
      - "เครือข่ายที่ใช้สายน้อยที่สุดจะไม่มีวงจร เพราะวงจรมีสายเกิน"
      - "กราฟเชื่อมโยงที่ไม่มีวงจร (ต้นไม้) ที่มี n จุดยอดมีเส้นเชื่อมกี่เส้น"
    misconceptions:
      - { match: 28, feedback: "นี่คือการต่อทุกคู่ $\\tfrac{8 \\times 7}{2}$ ไม่จำเป็น เพราะส่งต่อผ่านหมู่บ้านอื่นได้" }
      - { match: 8, feedback: "8 เส้นจะเกิดวงจรหนึ่งวงเสมอ ซึ่งมีสายเกิน 1 เส้น" }
    solution: "เครือข่ายเชื่อมโยงที่ไม่มีวงจรคือต้นไม้ ต้นไม้ที่มี 8 จุดยอดมีเส้นเชื่อม $8 - 1 = 7$ เส้น เช่น ต่อเรียงเป็นแถวหรือต่อทุกหมู่บ้านเข้ากับหมู่บ้านกลาง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.discrete.networks.p013
    topics: [math.discrete.networks]
    difficulty: 4
    type: order
    stem: "เรียงขั้นตอนการตัดสินว่ากราฟหนึ่งมีแนวเดินที่ผ่านทุกเส้นเชื่อมครั้งเดียวพอดีหรือไม่"
    items:
      - "ตรวจว่ากราฟเชื่อมโยง"
      - "หาดีกรีของทุกจุดยอด"
      - "นับจำนวนจุดยอดที่มีดีกรีคี่"
      - "ถ้ามี 0 หรือ 2 จุด แสดงว่ามีแนวเดิน ถ้ามี 4 จุดขึ้นไป แสดงว่าไม่มี"
      - "ถ้ามี 2 จุด เริ่มเดินที่จุดดีกรีคี่จุดหนึ่ง"
    hints:
      - "ถ้ากราฟแยกเป็นก้อน ไม่ต้องคิดต่อเลย"
      - "เกณฑ์ของออยเลอร์ใช้จำนวนจุดดีกรีคี่"
    solution: "ตรวจความเชื่อมโยง → หาดีกรี → นับจุดดีกรีคี่ → ตัดสินด้วยเกณฑ์ 0 หรือ 2 จุด → เลือกจุดเริ่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.discrete.networks.p014
    topics: [math.discrete.networks]
