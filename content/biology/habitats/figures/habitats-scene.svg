<text x="290" y="40" font-weight="bold" fill="#1b5e20">1 บนต้นไม้</text>
<text x="290" y="60" font-size="13.5">นกทำรังบนกิ่ง กระรอกปีนลำต้น</text>
<text x="290" y="79" font-size="13.5">ใบไม้ให้ร่มเงา ผลเป็นอาหาร</text>
<rect x="560" y="120" width="250" height="64" rx="8" fill="#ffffff" fill-opacity="0.93" stroke="#6a1b9a" stroke-width="2"/>
<text x="570" y="140" font-weight="bold" fill="#6a1b9a">2 สนามหญ้าและดอกไม้</text>
<text x="570" y="160" font-size="13.5">ผีเสื้อดูดน้ำหวานจากดอก</text>
<text x="570" y="179" font-size="13.5">ตั๊กแตนกินใบหญ้า มีแดดมาก</text>
<rect x="20" y="300" width="190" height="83" rx="8" fill="#ffffff" fill-opacity="0.93" stroke="#424242" stroke-width="2"/>
<text x="30" y="320" font-weight="bold" fill="#424242">3 ใต้ก้อนหิน</text>
<text x="30" y="340" font-size="13.5">มืด ชื้น เย็น</text>
<text x="30" y="359" font-size="13.5">ไส้เดือน กิ้งกือ มด</text>
<text x="30" y="378" font-size="13.5">กินเศษใบไม้ผุ</text>
<rect x="660" y="448" width="220" height="64" rx="8" fill="#ffffff" fill-opacity="0.93" stroke="#1565c0" stroke-width="2"/>
<text x="670" y="468" font-weight="bold" fill="#1565c0">4 สระน้ำ</text>
<text x="670" y="488" font-size="13.5">ปลาว่ายในน้ำ กบวางไข่</text>
<text x="670" y="507" font-size="13.5">บัวลอยบนผิวน้ำ</text>
