          - { id: "S1-CYB-PP-14", level: "Specialty I", text: "Analyze social engineering techniques and how they exploit human cognitive biases and organizational weaknesses.", note: "Practice IC5, HCD12" }
          - { id: "S1-CYB-PP-15", level: "Specialty I", text: "Translate cybersecurity concepts, risks, and solutions clearly to both technical and nontechnical audiences.", note: "Practice IC3, HCD10" }
          - { id: "S2-CYB-PP-10", level: "Specialty II", text: "Analyze the benefits, risks, and ethical implications of AI in cybersecurity.", note: "Practice ESR1, CT6; AI-related" }
          - { id: "S2-CYB-PP-11", level: "Specialty II", text: "Analyze cybersecurity vulnerabilities and incidents to inform responsible disclosure practices.", note: "Practice ESR2, IC5" }
          - { id: "S2-CYB-PP-12", level: "Specialty II", text: "Create documentation of cybersecurity processes and decisions that supports team coordination and accountability.", note: "Practice IC4, IC5" }
  - id: DSC
    title: "Data Science (HS Specialty)"
    standards:
      - id: "DSC-CC"
        text: "Creation & Curation"
        indicators:
          - { id: "S1-DSC-CC-01", level: "Specialty I", text: "Apply exploratory data analysis techniques to non-hierarchical quantitative data.", note: "Practice CT7, HCD11" }
          - { id: "S1-DSC-CC-02", level: "Specialty I", text: "Interpret metadata when using data collected by others.", note: "Practice ESR2, CT6" }
          - { id: "S1-DSC-CC-03", level: "Specialty I", text: "Develop a program to manipulate and transform data to prepare for analysis.", note: "Practice CT6, CT8" }
          - { id: "S2-DSC-CC-01", level: "Specialty II", text: "Apply exploratory data analysis techniques to a hierarchical structured data source.", note: "Practice CT7, HCD11" }
          - { id: "S2-DSC-CC-02", level: "Specialty II", text: "Document the origin, structure, and preparation of a dataset to support clarity and reproducibility.", note: "Practice IC4, IC5" }
          - { id: "S2-DSC-CC-03", level: "Specialty II", text: "Develop a program to collect and integrate data from multiple sources.", note: "Practice CT8, CT9" }
          - { id: "S2-DSC-CC-04", level: "Specialty II", text: "Choose appropriate data to collect for a data science project based on available tools, skills, and project goals.", note: "Practice IC4, CT6" }
      - id: "DSC-AM"
        text: "Analysis & Modeling Techniques"
        indicators:
          - { id: "S1-DSC-AM-04", level: "Specialty I", text: "Apply appropriate analytic and visualization techniques for categorical and quantitative data.", note: "Practice CT6, HCD12" }
          - { id: "S1-DSC-AM-05", level: "Specialty I", text: "Examine missing data and its impact on data analysis.", note: "Practice ESR1, CT6" }
          - { id: "S1-DSC-AM-06", level: "Specialty I", text: "Analyze structured categorical and/or quantitative datasets, using computational tools and libraries.", note: "Practice CT6, CT8" }
          - { id: "S2-DSC-AM-05", level: "Specialty II", text: "Build a model to explain relationships, make predictions, and evaluate the influence of different variables.", note: "Practice CT6, CT8" }
          - { id: "S2-DSC-AM-06", level: "Specialty II", text: "Evaluate strategies for handling missing data.", note: "Practice ESR1, CT6" }
          - { id: "S2-DSC-AM-07", level: "Specialty II", text: "Analyze an unstructured, mixed-type, or high-dimensional dataset using computational tools and libraries.", note: "Practice CT7, CT8" }
      - id: "DSC-MI"
        text: "Model Interpretation & Reasoning"
        indicators:
          - { id: "S1-DSC-MI-07", level: "Specialty I", text: "Interpret the results of a data analysis to explain patterns, anomalies, and trends, and connect them back to the original problem or research question.", note: "Practice IC3, CT6" }
          - { id: "S1-DSC-MI-08", level: "Specialty I", text: "Explain the appropriateness of predictive models for the specific problem being addressed.", note: "Practice ESR1, CT6" }
          - { id: "S1-DSC-MI-09", level: "Specialty I", text: "Explain how dataset size affects model stability and performance.", note: "Practice CT7, CT9" }
          - { id: "S2-DSC-MI-08", level: "Specialty II", text: "Evaluate the performance of models using established metrics.", note: "Practice CT7, CT9" }
          - { id: "S2-DSC-MI-09", level: "Specialty II", text: "Analyze the trade-offs between interpretability, accuracy, and generalizability as they relate to model complexity.", note: "Practice CT7, HCD12" }
          - { id: "S2-DSC-MI-10", level: "Specialty II", text: "Analyze how adding or removing variables affects model behavior and performance.", note: "Practice CT7, CT9" }
      - id: "DSC-VZ"
        text: "Visualization"
        indicators:
          - { id: "S1-DSC-VZ-10", level: "Specialty I", text: "Create a data visualization that communicates key findings to diverse audiences.", note: "Practice CT8, HCD10" }
          - { id: "S1-DSC-VZ-11", level: "Specialty I", text: "Analyze how graphical conventions in data visualizations support accurate interpretation and how breaking conventions can mislead.", note: "Practice ESR1, IC3" }
          - { id: "S2-DSC-VZ-11", level: "Specialty II", text: "Create a visualization that accurately represents data and avoids misleading design choices.", note: "Practice ESR1, HCD10" }
          - { id: "S2-DSC-VZ-12", level: "Specialty II", text: "Critique a data visualization for misleading elements and their role in spreading misinformation.", note: "Practice ESR1, HCD10" }
      - id: "DSC-PP"
        text: "Professional Practice"
        indicators:
          - { id: "S1-DSC-PP-12", level: "Specialty I", text: "Apply ethical principles to data collection, analysis, and communication to promote privacy, transparency, and accountability.", note: "Practice ESR2, HCD10" }
          - { id: "S1-DSC-PP-13", level: "Specialty I", text: "Assess how data collection and use may impact marginalized and underrepresented groups.", note: "Practice ESR1, ESR2" }
          - { id: "S1-DSC-PP-14", level: "Specialty I", text: "Document data analysis results in a format appropriate for an audience with diverse backgrounds and perspectives.", note: "Practice IC3, HCD10" }
          - { id: "S2-DSC-PP-13", level: "Specialty II", text: "Evaluate ethical, legal, and social considerations when working with large-scale datasets, predictive models, and emerging technologies.", note: "Practice ESR1, ESR2" }
          - { id: "S2-DSC-PP-14", level: "Specialty II", text: "Evaluate protective measures in data collection, usage, and governance for privacy, security, and fairness.", note: "Practice ESR2, HCD12" }
          - { id: "S2-DSC-PP-15", level: "Specialty II", text: "Translate technical results for diverse audiences in professional communication artifacts.", note: "Practice IC3, HCD10" }
  - id: GMD
