<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="sans-serif" font-size="14">
  <title>ความต้องการไม่จำกัดแต่ทรัพยากรมีจำกัด จึงต้องเลือก และเกิดค่าเสียโอกาส</title>
  <rect x="0" y="0" width="720" height="250" fill="#ffffff"/>
  <rect x="20.0" y="30.0" width="200.0" height="70.0" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="120.0" y="60.4" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">ความต้องการของคน</text>
  <text x="120.0" y="79.3" text-anchor="middle" fill="#1f2937" font-size="14">มีไม่จำกัด</text>
  <rect x="20.0" y="150.0" width="200.0" height="70.0" rx="8" fill="#fef3c7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="120.0" y="180.5" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">ทรัพยากร</text>
  <text x="120.0" y="199.4" text-anchor="middle" fill="#1f2937" font-size="14">มีจำกัด</text>
  <rect x="270.0" y="90.0" width="130.0" height="70.0" rx="8" fill="#fee2e2" stroke="#1f2937" stroke-width="1.5"/>
  <text x="335.0" y="129.9" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">ความขาดแคลน</text>
  <rect x="440.0" y="90.0" width="110.0" height="70.0" rx="8" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="495.0" y="129.9" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">ต้องเลือก</text>
  <rect x="585.0" y="80.0" width="120.0" height="90.0" rx="8" fill="#ede9fe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="645.0" y="112.0" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">ค่าเสียโอกาส</text>
  <text x="645.0" y="129.6" text-anchor="middle" fill="#1f2937" font-size="13">สิ่งที่ดีที่สุด</text>
  <text x="645.0" y="147.1" text-anchor="middle" fill="#1f2937" font-size="13">ที่ไม่ได้เลือก</text>
  <line x1="220.0" y1="65.0" x2="266.1" y2="108.3" stroke="#1f2937" stroke-width="2"/>
  <polygon points="270.0,112.0 261.6,108.9 266.4,103.8" fill="#1f2937"/>
  <line x1="220.0" y1="185.0" x2="266.0" y2="143.6" stroke="#1f2937" stroke-width="2"/>
  <polygon points="270.0,140.0 266.2,148.2 261.5,142.9" fill="#1f2937"/>
  <line x1="400.0" y1="125.0" x2="434.6" y2="125.0" stroke="#1f2937" stroke-width="2"/>
  <polygon points="440.0,125.0 431.7,128.5 431.7,121.5" fill="#1f2937"/>
  <line x1="550.0" y1="125.0" x2="579.6" y2="125.0" stroke="#1f2937" stroke-width="2"/>
  <polygon points="585.0,125.0 576.7,128.5 576.7,121.5" fill="#1f2937"/>
  <text x="360.0" y="235.0" text-anchor="middle" fill="#6b7280" font-size="13">ทรัพยากรธรรมชาติ · ทรัพยากรมนุษย์ (แรงงาน) · ทุน (เครื่องมือ เครื่องจักร อาคาร)</text>
</svg>
