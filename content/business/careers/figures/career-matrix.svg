  <text x="28.0" y="177.6" text-anchor="start" fill="#1f2937" font-size="13">โอกาสมีงานทำ (× 2)</text>
  <text x="290.0" y="177.6" text-anchor="middle" fill="#1f2937" font-size="13">4</text>
  <line x1="210.0" y1="154.0" x2="210.0" y2="192.0" stroke="#1f2937" stroke-width="1"/>
