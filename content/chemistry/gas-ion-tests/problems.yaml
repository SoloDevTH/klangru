problems:
  - id: chemistry.analysis.gas-ion-tests.p001
    topics: [chemistry.analysis.gas-ion-tests]
    difficulty: 1
    type: match
    stem: "จับคู่แก๊สกับผลการทดสอบ"
    pairs:
      - { left: "ไฮโดรเจน", right: "ไม้ที่ลุกเป็นไฟจ่อปากหลอด เกิดเสียงป๊อก" }
      - { left: "ออกซิเจน", right: "ไม้ที่มีถ่านแดงลุกเป็นไฟอีกครั้ง" }
      - { left: "คาร์บอนไดออกไซด์", right: "น้ำปูนใสขุ่นขาว" }
      - { left: "คลอรีน", right: "ลิตมัสน้ำเงินชื้นเป็นแดงแล้วซีดขาว" }
    hints:
      - "แก๊สที่ช่วยให้ไฟติดกับแก๊สที่ติดไฟเองใช้ก้านไม้ต่างกัน"
      - "แก๊สที่ฟอกสีได้คือแก๊สที่ใช้ฆ่าเชื้อในน้ำประปา"
    solution: "H₂–เสียงป๊อก · O₂–ไม้ถ่านแดงลุกไฟ · CO₂–น้ำปูนใสขุ่น · Cl₂–ลิตมัสชื้นซีดขาว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.analysis.gas-ion-tests.p002
    topics: [chemistry.analysis.gas-ion-tests]
    difficulty: 1
    type: mcq
    stem: "ผ่านแก๊สชนิดหนึ่งลงในน้ำปูนใส แล้วน้ำปูนใสขุ่นขาว แก๊สนั้นน่าจะเป็นแก๊สใด"
    choices:
      - { id: a, text: "คาร์บอนไดออกไซด์", correct: true, feedback: "ถูก เกิดตะกอน CaCO₃ สีขาว" }
      - { id: b, text: "ออกซิเจน", feedback: "ออกซิเจนไม่ทำปฏิกิริยากับน้ำปูนใส ทดสอบด้วยไม้ที่มีถ่านแดง" }
      - { id: c, text: "ไฮโดรเจน", feedback: "ไฮโดรเจนทดสอบด้วยไม้ที่ลุกเป็นไฟ (เสียงป๊อก)" }
    hints:
      - "น้ำปูนใสคือ Ca(OH)₂ ละลายน้ำ"
      - "แก๊สที่ทำให้ Ca²⁺ กลายเป็นตะกอนคาร์บอเนต"
    solution: "**CO₂** ทำปฏิกิริยา $\\mathrm{Ca(OH)_2} + \\mathrm{CO_2} \\to \\mathrm{CaCO_3(s)} + \\mathrm{H_2O}$ ตะกอนขาวทำให้ขุ่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.analysis.gas-ion-tests.p003
    topics: [chemistry.analysis.gas-ion-tests]
    difficulty: 2
    type: match
    stem: "จับคู่ไอออนโลหะกับสีเปลวไฟ"
    pairs:
      - { left: "Li⁺", right: "แดงเข้ม" }
      - { left: "Na⁺", right: "เหลืองส้ม" }
      - { left: "K⁺", right: "ม่วงอ่อน (ไลแลก)" }
      - { left: "Ca²⁺", right: "ส้มแดง" }
      - { left: "Cu²⁺", right: "เขียว" }
    hints:
      - "เกลือแกงโรยลงไฟจากเตาแก๊สให้สีอะไร"
      - "โลหะที่ทำสายไฟให้สีเปลวไฟคล้ายสนิมของมัน (สีเขียว)"
    solution: "Li⁺ แดงเข้ม · Na⁺ เหลืองส้ม · K⁺ ม่วงอ่อน · Ca²⁺ ส้มแดง · Cu²⁺ เขียว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.analysis.gas-ion-tests.p004
    topics: [chemistry.analysis.gas-ion-tests]
    difficulty: 2
    type: mcq
    stem: "หยดสารละลาย NaOH ลงในสารละลายตัวอย่าง เกิดตะกอนสีฟ้า ตัวอย่างนี้มีไอออนใด"
    choices:
      - { id: a, text: "Cu²⁺", correct: true, feedback: "ถูก เกิด Cu(OH)₂ สีฟ้า" }
      - { id: b, text: "Fe³⁺", feedback: "Fe³⁺ ให้ตะกอนน้ำตาลแดง" }
      - { id: c, text: "Fe²⁺", feedback: "Fe²⁺ ให้ตะกอนเขียวหม่น" }
      - { id: d, text: "Ca²⁺", feedback: "Ca²⁺ ให้ตะกอนขาว" }
    hints:
      - "ดูตารางสีตะกอนไฮดรอกไซด์"
      - "สารละลายของไอออนนี้ก็มักเป็นสีฟ้าอยู่แล้ว"
    solution: "ตะกอนสีฟ้าคือ $\\mathrm{Cu(OH)_2}$: $\\mathrm{Cu^{2+}} + \\mathrm{2OH^-} \\to \\mathrm{Cu(OH)_2(s)}$ ตัวอย่างมี **Cu²⁺**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.analysis.gas-ion-tests.p005
    topics: [chemistry.analysis.gas-ion-tests]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นวิธีทดสอบแก๊สคลอรีนที่ถูกต้อง (ทำในตู้ดูดควันโดยครู)"
    choices:
      - { id: a, text: "จ่อกระดาษลิตมัสสีน้ำเงินที่ชื้น ถ้าเป็นแดงแล้วซีดขาวคือคลอรีน", correct: true, feedback: "ถูก คลอรีนละลายน้ำได้กรดและสารฟอกสี" }
      - { id: b, text: "จ่อกระดาษลิตมัสแห้ง", feedback: "แก๊สต้องละลายในน้ำบนกระดาษก่อน กระดาษแห้งจึงไม่เปลี่ยนสี" }
      - { id: c, text: "ผ่านลงในน้ำปูนใส", feedback: "น้ำปูนใสใช้ทดสอบ CO₂" }
      - { id: d, text: "ดมกลิ่นใกล้ ๆ ปากหลอด", feedback: "คลอรีนเป็นแก๊สพิษ ห้ามดมโดยตรง" }
    hints:
      - "คลอรีนใช้ฟอกสีและฆ่าเชื้อ"
      - "ลิตมัสต้องชื้นจึงจะเปลี่ยนสี"
    solution: "ใช้ **ลิตมัสน้ำเงินที่ชื้น** คลอรีนละลายน้ำเป็นกรด (แดง) และฟอกสีจนซีดขาว ห้ามดมแก๊สพิษ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.analysis.gas-ion-tests.p006
    topics: [chemistry.analysis.gas-ion-tests]
    difficulty: 3
    type: mcq
    stem: "ก่อนเติม AgNO₃ เพื่อทดสอบไอออนคลอไรด์ ต้องเติมกรดไนตริกเจือจางก่อน เหตุผลข้อใดถูกต้อง"
    choices:
      - { id: a, text: "กำจัดคาร์บอเนตที่อาจให้ตะกอนกับ Ag⁺ ได้ และ HNO₃ ไม่เพิ่ม Cl⁻", correct: true, feedback: "ถูก ถ้าใช้ HCl จะเติม Cl⁻ เข้าไปเอง ผลเป็นบวกเสมอ" }
      - { id: b, text: "กรดทำให้ AgCl ละลายน้ำ จึงเห็นชัดขึ้น", feedback: "AgCl ไม่ละลายในกรดเจือจาง และเราต้องการให้มันตกตะกอน" }
      - { id: c, text: "ใช้ HCl แทนก็ได้ เพราะเป็นกรดเหมือนกัน", feedback: "HCl มี Cl⁻ จะให้ตะกอน AgCl แม้ตัวอย่างไม่มีคลอไรด์" }
    hints:
      - "Ag⁺ เกิดตะกอนกับคาร์บอเนตได้เช่นกัน"
      - "กรดที่เลือกต้องไม่มีไอออนที่เรากำลังตรวจ"
    solution: "กรดกำจัด $\\mathrm{CO_3^{2-}}$ ออกเป็น CO₂ ไม่ให้เกิดตะกอนหลอก และต้องเป็น **HNO₃** เพราะไม่เติม Cl⁻"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.analysis.gas-ion-tests.p007
    topics: [chemistry.analysis.gas-ion-tests]
    difficulty: 3
    type: text
    stem: "เติม HCl เจือจางแล้วเติม BaCl₂ ลงในน้ำตัวอย่าง ได้ตะกอนขาว ตะกอนนี้มีสูตรเคมีว่าอะไร"
    accepted: ["BaSO4", "BaSO₄", "แบเรียมซัลเฟต", "barium sulfate", "barium sulphate"]
    misconceptions:
      - { match: "BaCl2", feedback: "BaCl₂ ละลายน้ำได้ดี เป็นสารที่เราเติมลงไป ไม่ใช่ตะกอน" }
      - { match: "BaCO3", feedback: "คาร์บอเนตถูกกำจัดด้วย HCl ที่เติมก่อนแล้ว ตะกอนในสารละลายกรดจึงเป็นซัลเฟต" }
    hints:
      - "การทดสอบนี้ใช้หาไอออนลบชนิดใด"
      - "Ba²⁺ + SO₄²⁻"
    solution: "$\\mathrm{Ba^{2+}} + \\mathrm{SO_4^{2-}} \\to$ **BaSO₄(s)** แบเรียมซัลเฟต ตะกอนขาว แสดงว่ามีซัลเฟต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.analysis.gas-ion-tests.p008
    topics: [chemistry.analysis.gas-ion-tests]
    difficulty: 3
    type: mcq
    stem: "เติม NaOH ลงในสารละลายเหล็ก 2 หลอด หลอด P ได้ตะกอนเขียวหม่นที่ผิวหน้าค่อย ๆ เป็นสีน้ำตาล หลอด Q ได้ตะกอนน้ำตาลแดงทันที ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "P มี Fe²⁺ และ Q มี Fe³⁺", correct: true, feedback: "ถูก Fe(OH)₂ เขียวหม่นถูกอากาศออกซิไดส์เป็น Fe(OH)₃ สีน้ำตาลแดง" }
      - { id: b, text: "P มี Fe³⁺ และ Q มี Fe²⁺", feedback: "สลับกัน Fe³⁺ ให้ตะกอนน้ำตาลแดง" }
      - { id: c, text: "ทั้งสองหลอดมี Cu²⁺", feedback: "Cu²⁺ ให้ตะกอนสีฟ้า" }
    hints:
      - "ตะกอนสีน้ำตาลแดงคือ Fe(OH)₃"
      - "ทำไมผิวหน้าที่สัมผัสอากาศจึงเปลี่ยนสี"
    solution: "P: Fe²⁺ → Fe(OH)₂ เขียวหม่น ที่ผิวถูกออกซิเจนออกซิไดส์เป็น Fe³⁺ (น้ำตาล) · Q: **Fe³⁺** → Fe(OH)₃ น้ำตาลแดง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.analysis.gas-ion-tests.p009
    topics: [chemistry.analysis.gas-ion-tests]
    difficulty: 3
    type: mcq
    stem: "ภาพแสดงผลการทดสอบสารละลาย X สามหลอด สารละลาย X น่าจะเป็นสารใด"
    figure:
      src: p-unknown-tubes.svg
      alt: "สามหลอดทดลองของสารละลาย X ซึ่งใสสีฟ้าอ่อน หลอด 1 เติม NaOH ได้ตะกอนสีฟ้า หลอด 2 เติม HCl แล้ว BaCl₂ ได้ตะกอนขาว หลอด 3 เติม HNO₃ แล้ว AgNO₃ ยังใส ไม่มีตะกอน"
    choices:
      - { id: a, text: "CuSO₄", correct: true, feedback: "ถูก ตะกอนฟ้ากับ NaOH คือ Cu²⁺ ตะกอนขาวกับ BaCl₂ คือ SO₄²⁻" }
      - { id: b, text: "CuCl₂", feedback: "ถ้ามี Cl⁻ หลอด 3 ต้องได้ตะกอน AgCl สีขาว" }
      - { id: c, text: "FeSO₄", feedback: "Fe²⁺ ให้ตะกอนเขียวหม่นกับ NaOH ไม่ใช่สีฟ้า" }
      - { id: d, text: "Na₂SO₄", feedback: "Na⁺ ไม่เกิดตะกอนกับ NaOH และสารละลายไม่มีสี" }
    hints:
      - "อ่านทีละหลอด: หลอด 1 บอกไอออนบวก หลอด 2 และ 3 บอกไอออนลบ"
      - "หลอด 3 ไม่มีตะกอน แปลว่าไม่มีเฮไลด์"
    solution: "หลอด 1 ตะกอนฟ้า → Cu²⁺ · หลอด 2 ตะกอนขาว → SO₄²⁻ · หลอด 3 ไม่มีตะกอน → ไม่มี Cl⁻ X คือ **CuSO₄**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.analysis.gas-ion-tests.p010
    topics: [chemistry.analysis.gas-ion-tests]
    difficulty: 4
    type: mcq
    stem: "สารละลาย A และ B ให้ตะกอนขาวกับ NaOH ทั้งคู่ และให้เปลวไฟไม่มีสีชัดเจน เมื่อเติม NaOH มากเกินพอ ตะกอนของ A ละลายเป็นสารละลายใส แต่ของ B ไม่ละลาย ข้อสรุปใดเหมาะสมที่สุด"
    choices:
      - { id: a, text: "A มี Al³⁺ (หรือ Zn²⁺) และ B มี Mg²⁺", correct: true, feedback: "ถูก ไฮดรอกไซด์ของ Al และ Zn ละลายใน NaOH มากเกินพอ ส่วน Mg(OH)₂ ไม่ละลาย และ Mg ไม่ให้สีเปลวไฟเด่นชัด" }
      - { id: b, text: "A มี Mg²⁺ และ B มี Al³⁺", feedback: "สลับกัน Mg(OH)₂ ไม่ละลายใน NaOH มากเกินพอ" }
      - { id: c, text: "B มี Ca²⁺", feedback: "Ca²⁺ ให้เปลวไฟสีส้มแดง โจทย์บอกว่าเปลวไฟไม่มีสีชัดเจน" }
    hints:
      - "ตะกอนขาวมีหลายไอออน ใช้ NaOH มากเกินพอแยก"
      - "ใช้ผลเปลวไฟตัด Ca²⁺ ออก"
    solution: "ตะกอนขาวที่ละลายใน NaOH มากเกินพอคือ Al(OH)₃ หรือ Zn(OH)₂ (A) ตะกอนขาวที่ไม่ละลายและไม่มีสีเปลวไฟคือ Mg(OH)₂ (B) เพราะ Ca²⁺ จะให้เปลวไฟส้มแดง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.analysis.gas-ion-tests.p011
    topics: [chemistry.analysis.gas-ion-tests]
    difficulty: 4
    type: numeric
    stem: "ศูนย์ตรวจน้ำนำน้ำบาดาล 250 mL มาเติม HCl และ BaCl₂ มากเกินพอ ได้ตะกอน BaSO₄ แห้ง 0.140 g น้ำนี้มีซัลเฟต (SO₄²⁻) กี่ mg/L (BaSO₄ 233.39 g/mol, SO₄²⁻ 96.06 g/mol ตอบจำนวนเต็ม ข้อมูลสมมติ)"
    answer: { value: 230, unit: mg/L, tolerance: 2 }
    misconceptions:
      - { match: 560, feedback: "นี่คือมวล BaSO₄ ต่อลิตร ต้องแปลงเป็นมวลของ SO₄²⁻ ด้วยอัตราส่วน 96.06/233.39 ก่อน" }
      - { match: 57.6, feedback: "นี่คือมวลซัลเฟต (mg) ในตัวอย่าง 250 mL ยังต้องหารด้วย 0.250 L" }
    hints:
      - "โมล BaSO₄ = โมล SO₄²⁻"
      - "มวลซัลเฟต = 0.140 × 96.06 / 233.39 g แล้วหารด้วย 0.250 L"
    solution: "โมล $= 0.140/233.39 = 6.00 \\times 10^{-4}$ mol มวล $\\mathrm{SO_4^{2-}} = 6.00 \\times 10^{-4} \\times 96.06 = 0.0576$ g $= 57.6$ mg ใน 0.250 L ได้ **230 mg/L** ใกล้เกณฑ์ 250 mg/L"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.analysis.gas-ion-tests.p012
    topics: [chemistry.analysis.gas-ion-tests]
    difficulty: 4
    type: numeric
    stem: "น้ำบาดาลเค็มจากบ่อในภาคอีสาน 50.0 mL เติม HNO₃ และ AgNO₃ มากเกินพอ ได้ตะกอน AgCl แห้ง 0.861 g น้ำนี้มีคลอไรด์กี่ mg/L (AgCl 143.32 g/mol, Cl 35.45 g/mol ข้อมูลสมมติ)"
    answer: { value: 4259, unit: mg/L, tolerance: 25 }
    misconceptions:
      - { match: 17220, feedback: "นี่คือมวล AgCl ต่อลิตร ต้องคิดเฉพาะส่วนที่เป็นคลอรีน (35.45/143.32)" }
      - { match: 213, feedback: "นี่คือมวลคลอไรด์ (mg) ในตัวอย่าง 50.0 mL ยังต้องหารด้วย 0.0500 L" }
    hints:
      - "AgCl 1 mol มี Cl 1 mol"
      - "มวล Cl = 0.861 × 35.45/143.32 g แล้วหารด้วย 0.0500 L"
    solution: "มวล Cl $= 0.861 \\times 35.45/143.32 = 0.213$ g $= 213$ mg ใน 0.0500 L ได้ **ราว 4,260 mg/L** สูงกว่าเกณฑ์ 250 mg/L ราว 17 เท่า ต้องใช้ RO หรือหาแหล่งน้ำอื่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.analysis.gas-ion-tests.p013
    topics: [chemistry.analysis.gas-ion-tests]
    difficulty: 4
    type: order
    stem: "เรียงขั้นตอนการทดสอบว่าสารละลายตัวอย่างมีไอออนเฮไลด์ชนิดใด"
    items:
      - "ตวงสารละลายตัวอย่างเล็กน้อยใส่หลอดทดลอง"
      - "เติมกรดไนตริกเจือจางเพื่อกำจัดคาร์บอเนต"
      - "หยดสารละลายซิลเวอร์ไนเตรต"
      - "สังเกตสีตะกอน: ขาว ขาวครีม หรือเหลือง"
      - "สรุปว่าเป็น Cl⁻ Br⁻ หรือ I⁻"
    hints:
      - "ต้องกำจัดสิ่งที่ให้ผลหลอกก่อนเติมสารทดสอบ"
      - "สังเกตก่อน แล้วจึงสรุป"
    solution: "ตวงตัวอย่าง → เติม HNO₃ → หยด AgNO₃ → ดูสีตะกอน → สรุปชนิดเฮไลด์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.analysis.gas-ion-tests.p014
    topics: [chemistry.analysis.gas-ion-tests]
    difficulty: 5
    type: mcq
