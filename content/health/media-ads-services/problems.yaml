  difficulty: 4
  type: mcq
  stem: คลินิกความงามแห่งหนึ่งโฆษณา "ฉีดหน้าใสลด 80% วันนี้วันเดียว ไม่ต้องปรึกษาแพทย์" วัยรุ่นควรพิจารณาอย่างไร
  choices:
  - id: a
    text: ไม่ตัดสินใจเพราะโปรโมชัน ตรวจว่าสถานพยาบาลมีใบอนุญาตและผู้ทำเป็นแพทย์ ปรึกษาผู้ปกครอง และคิดว่าจำเป็นต่อสุขภาพจริงหรือไม่
    correct: true
  - id: b
    text: รีบไปเพราะลดราคามาก
    feedback: การเร่งให้ตัดสินใจเป็นสัญญาณเตือน หัตถการที่ทำโดยผู้ไม่มีวิชาชีพอันตราย
  - id: c
    text: เลือกที่ราคาถูกที่สุดเสมอ
    feedback: ราคาถูกไม่ได้แปลว่าปลอดภัย ต้องดูใบอนุญาตและผู้ให้บริการ
  hints:
  - "ดูสัญญาณเตือน: ลดราคามาก วันเดียว ไม่ต้องปรึกษาแพทย์"
  - หลักเลือกบริการคือความปลอดภัยและความจำเป็น
  solution: ควรเลือกบริการจากความจำเป็น ใบอนุญาตของสถานพยาบาล และวิชาชีพของผู้ให้บริการ ไม่ใช่จากโปรโมชัน และปรึกษาผู้ปกครองก่อนเสมอ
