problems:
  - id: biology.diversity.biodiversity-classification.p001
    topics: [biology.diversity.biodiversity-classification]
    difficulty: 1
    type: mcq
    stem: "สิ่งมีชีวิตที่เซลล์มีนิวเคลียสทุกชนิดจัดอยู่ในโดเมนใด"
    choices:
      - { id: a, text: "ยูคาเรีย", correct: true }
      - { id: b, text: "แบคทีเรีย", feedback: "แบคทีเรียเป็นโพรแคริโอต ไม่มีนิวเคลียส" }
      - { id: c, text: "อาร์เคีย", feedback: "อาร์เคียเป็นโพรแคริโอต ไม่มีนิวเคลียสเช่นกัน" }
      - { id: d, text: "สัตว์", feedback: "สัตว์เป็นอาณาจักรหนึ่งในโดเมนยูคาเรีย ไม่ใช่โดเมน" }
    hints:
      - "ระบบ 3 โดเมนมีโดเมนที่เป็นโพรแคริโอต 2 โดเมน"
      - "ชื่อโดเมนนี้แปลว่ามีนิวเคลียสแท้"
    solution: "สิ่งมีชีวิตที่มีนิวเคลียสคือยูแคริโอต ซึ่งจัดอยู่ในโดเมนยูคาเรีย ได้แก่ โพรทิสต์ พืช ฟังไจ และสัตว์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.biodiversity-classification.p002
    topics: [biology.diversity.biodiversity-classification]
    difficulty: 1
    type: text
    stem: "นักวิทยาศาสตร์ผู้เทียบลำดับเบสของ rRNA แล้วเสนอระบบ 3 โดเมนชื่ออะไร (ตอบภาษาไทยหรืออังกฤษ)"
    accepted: ["วูส", "คาร์ล วูส", "Woese", "Carl Woese", "คาร์ล โวส", "โวส"]
    misconceptions:
      - { match: "วิตเทเคอร์", feedback: "วิตเทเคอร์เสนอระบบ 5 อาณาจักรในปี ค.ศ. 1969" }
      - { match: "ลินเนียส", feedback: "ลินเนียสวางระบบลำดับขั้นและชื่อทวินาม แบ่งสิ่งมีชีวิตเป็นพืชกับสัตว์" }
    hints:
      - "เสนอในปี ค.ศ. 1990 หลังจากศึกษา rRNA ของโพรแคริโอต"
      - "เป็นผู้ค้นพบว่าอาร์เคียต่างจากแบคทีเรีย"
    solution: "คาร์ล วูส (Carl Woese) เทียบลำดับเบสของ rRNA และพบว่าโพรแคริโอตแยกเป็นแบคทีเรียกับอาร์เคีย จึงเสนอระบบ 3 โดเมน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.biodiversity-classification.p003
    topics: [biology.diversity.biodiversity-classification]
    difficulty: 1
    type: match
    stem: "จับคู่กลุ่มสิ่งมีชีวิตกับตัวอย่าง"
    pairs:
      - { left: "แบคทีเรีย", right: "ไรโซเบียมในปมรากถั่ว" }
      - { left: "อาร์เคีย", right: "จุลินทรีย์ที่สร้างแก๊สมีเทนในนาข้าว" }
      - { left: "โพรทิสต์", right: "เชื้อมาลาเรีย Plasmodium" }
      - { left: "ฟังไจ", right: "ยีสต์ที่ใช้หมักข้าวหมาก" }
      - { left: "พืช", right: "เฟินก้านดำ" }
    hints:
      - "ฟังไจรวมทั้งเห็ด รา และยีสต์"
      - "จุลินทรีย์ที่สร้างมีเทนเป็นโพรแคริโอตที่ไม่ใช่แบคทีเรีย"
    solution: "ไรโซเบียมเป็นแบคทีเรีย จุลินทรีย์สร้างมีเทนเป็นอาร์เคีย Plasmodium เป็นโพรทิสต์ ยีสต์เป็นฟังไจ และเฟินเป็นพืช"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.biodiversity-classification.p004
    topics: [biology.diversity.biodiversity-classification]
    difficulty: 2
    type: order
    stem: "เรียงลำดับเหตุการณ์ในการเกิดสิ่งมีชีวิตบนโลกจากเกิดก่อนไปเกิดหลัง"
    items:
      - "สารอนินทรีย์ในบรรยากาศและน้ำทำปฏิกิริยาได้สารอินทรีย์โมเลกุลเล็ก"
      - "โมเลกุลเล็กรวมกันเป็นพอลิเมอร์ เช่น RNA"
      - "ลิพิดล้อมสารพันธุกรรมเป็นโพรโทเซลล์"
      - "ไซยาโนแบคทีเรียปล่อยออกซิเจนจนบรรยากาศมีออกซิเจนมากขึ้น"
      - "เซลล์ยูแคริโอตได้ไมโทคอนเดรียจากการกลืนแบคทีเรีย"
    hints:
      - "เริ่มจากโมเลกุลเล็ก แล้วจึงเป็นโมเลกุลใหญ่และเซลล์"
      - "ไมโทคอนเดรียมาจากแบคทีเรียที่ใช้ออกซิเจน จึงต้องเกิดหลังจากมีออกซิเจนมากพอ"
    solution: "สารอินทรีย์โมเลกุลเล็ก → พอลิเมอร์เช่น RNA → โพรโทเซลล์ → ไซยาโนแบคทีเรียปล่อยออกซิเจน → ยูแคริโอตได้ไมโทคอนเดรีย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.biodiversity-classification.p005
    topics: [biology.diversity.biodiversity-classification]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นหลักฐานสนับสนุนว่าไมโทคอนเดรียมาจากแบคทีเรียที่ถูกเซลล์ใหญ่กลืนเข้าไป (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ไมโทคอนเดรียมีเยื่อหุ้มสองชั้น", correct: true }
      - { id: b, text: "ไมโทคอนเดรียมี DNA วงกลมของตัวเอง", correct: true }
      - { id: c, text: "ไรโบโซมในไมโทคอนเดรียมีขนาดเล็กแบบของแบคทีเรีย", correct: true }
      - { id: d, text: "ไมโทคอนเดรียสร้าง ATP ได้", feedback: "การสร้าง ATP บอกหน้าที่ ไม่ได้บอกว่ามาจากแบคทีเรีย ไซโทพลาซึมของทุกเซลล์ก็สร้าง ATP ได้" }
      - { id: e, text: "เซลล์กล้ามเนื้อมีไมโทคอนเดรียมาก", feedback: "จำนวนไมโทคอนเดรียขึ้นกับความต้องการพลังงานของเซลล์ ไม่ใช่หลักฐานที่มา" }
    hints:
      - "หลักฐานต้องแสดงว่าไมโทคอนเดรียเคยเป็นสิ่งมีชีวิตอิสระ"
      - "สิ่งมีชีวิตอิสระต้องมีสารพันธุกรรมและเครื่องมือสร้างโปรตีนของตัวเอง"
    solution: "เยื่อหุ้มสองชั้น (ชั้นในมาจากแบคทีเรีย ชั้นนอกมาจากการกลืน) DNA วงกลม และไรโบโซมขนาดเล็กแบบแบคทีเรีย เป็นหลักฐานว่าไมโทคอนเดรียเคยเป็นแบคทีเรียอิสระ ส่วนการสร้าง ATP และจำนวนในเซลล์กล้ามเนื้อบอกเพียงหน้าที่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.biodiversity-classification.p006
    topics: [biology.diversity.biodiversity-classification]
    difficulty: 2
    type: mcq
    stem: "เกษตรกรเพาะเห็ดฟางในตะกร้าโดยใช้ฟางข้าวและไม่ต้องให้แสง เหตุผลข้อใดอธิบายได้ถูกต้องว่าทำไมเห็ดฟางจึงไม่จัดเป็นพืช"
    choices:
      - { id: a, text: "เห็ดฟางไม่มีคลอโรฟิลล์ ผนังเซลล์เป็นไคทิน และดูดซึมอาหารที่ย่อยจากฟางนอกเซลล์", correct: true }
      - { id: b, text: "เห็ดฟางเป็นเซลล์เดียวเหมือนแบคทีเรีย", feedback: "ดอกเห็ดประกอบด้วยเส้นใยจำนวนมาก เป็นสิ่งมีชีวิตหลายเซลล์" }
      - { id: c, text: "เห็ดฟางไม่มีนิวเคลียส", feedback: "ฟังไจเป็นยูแคริโอต เซลล์มีนิวเคลียส" }
      - { id: d, text: "เห็ดฟางเคลื่อนที่ได้เหมือนสัตว์", feedback: "เห็ดอยู่กับที่ ที่จัดแยกจากพืชเพราะวิธีได้อาหารและผนังเซลล์" }
    hints:
      - "พืชสร้างอาหารเองด้วยแสง เห็ดได้อาหารจากที่ใด"
      - "ผนังเซลล์ของพืชเป็นเซลลูโลส ของฟังไจเป็นอะไร"
    solution: "เห็ดฟางเป็นฟังไจ ไม่มีคลอโรฟิลล์จึงสร้างอาหารเองไม่ได้ ปล่อยเอนไซม์ย่อยฟางข้าวนอกเซลล์แล้วดูดซึม และผนังเซลล์เป็นไคทิน ไม่ใช่เซลลูโลส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.biodiversity-classification.p007
    topics: [biology.diversity.biodiversity-classification]
    difficulty: 2
    type: mcq
    stem: "จากไดโคโทมัสคีย์ของสัตว์ในป่าชายเลน 1ก มีกระดูกสันหลัง → ข้อ 2 1ข ไม่มีกระดูกสันหลัง → ข้อ 3 2ก มีขน → ลิงแสม 2ข ไม่มีขน มีครีบ → ปลาตีน 3ก มีขาเป็นข้อปล้อง → ข้อ 4 3ข ไม่มีขา → หอยจุ๊บแจง 4ก มีขา 10 ขา → ปูก้ามดาบ 4ข มีขา 6 ขา → หิ่งห้อย สัตว์ไม่มีกระดูกสันหลังที่มีขาข้อปล้อง 6 ขา ไล่คีย์ตามลำดับข้อใด"
    choices:
      - { id: a, text: "1ข → 3ก → 4ข", correct: true }
      - { id: b, text: "1ก → 2ข", feedback: "สัตว์นี้ไม่มีกระดูกสันหลัง ต้องเลือก 1ข" }
      - { id: c, text: "1ข → 3ข", feedback: "3ข คือไม่มีขา แต่สัตว์นี้มีขา 6 ขา" }
      - { id: d, text: "1ข → 3ก → 4ก", feedback: "4ก คือ 10 ขา ซึ่งเป็นของปู" }
    hints:
      - "เริ่มที่ข้อ 1 ทุกครั้ง แล้วเลือกทางที่ตรงกับสัตว์"
      - "ไม่มีกระดูกสันหลัง → มีขาข้อปล้อง → นับจำนวนขา"
    solution: "ไม่มีกระดูกสันหลังเลือก 1ข ไปข้อ 3 มีขาข้อปล้องเลือก 3ก ไปข้อ 4 มีขา 6 ขาเลือก 4ข ได้หิ่งห้อย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.biodiversity-classification.p008
    topics: [biology.diversity.biodiversity-classification]
    difficulty: 3
    type: mcq
    stem: "จากแคลโดแกรม สัตว์ชนิดใดเป็นญาติใกล้ชิดที่สุดของจิ้งจก"
    figure: { src: vertebrate-cladogram.svg, alt: "แคลโดแกรมแบบกิ่งมุมฉากของสัตว์ 6 ชนิดเรียงจากบนลงล่าง ปลาฉลาม ปลาทู กบ แมว จิ้งจก นกกระจอก ปลาฉลามแยกออกก่อน ตามด้วยปลาทู กบ และแมวตามลำดับ จิ้งจกกับนกกระจอกแยกออกจากกันที่จุดแตกกิ่งสุดท้าย บนกิ่งมีเครื่องหมายลักษณะใหม่ ได้แก่ โครงกระดูกแข็ง ขา 4 ขา ไข่มีถุงแอมเนียน กะโหลกไดแอปซิด ขนและต่อมน้ำนมบนกิ่งแมว และขนนกบนกิ่งนกกระจอก" }
    choices:
      - { id: a, text: "นกกระจอก", correct: true }
      - { id: b, text: "แมว", feedback: "แมวอยู่ติดกับจิ้งจกในแผนภาพ แต่บรรพบุรุษร่วมของแมวกับจิ้งจกเก่ากว่าของนกกับจิ้งจก" }
      - { id: c, text: "กบ", feedback: "กบแยกออกไปก่อนสัตว์ที่มีไข่มีถุงแอมเนียน จึงห่างจากจิ้งจกมากกว่า" }
      - { id: d, text: "ปลาฉลาม", feedback: "ปลาฉลามแยกออกเป็นกลุ่มแรก จึงห่างจากจิ้งจกที่สุด" }
    hints:
      - "หาจุดแตกกิ่งที่เป็นบรรพบุรุษร่วมของจิ้งจกกับแต่ละชนิด"
      - "บรรพบุรุษร่วมที่อยู่ใกล้ปลายกิ่งที่สุดคือญาติใกล้ที่สุด"
    solution: "จิ้งจกกับนกกระจอกแยกจากกันที่จุดแตกกิ่งสุดท้าย จึงมีบรรพบุรุษร่วมที่ใหม่ที่สุด นกกระจอกจึงเป็นญาติใกล้ชิดที่สุดของจิ้งจก แม้นกจะมีขนนกที่จิ้งจกไม่มี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.biodiversity-classification.p009
    topics: [biology.diversity.biodiversity-classification]
    difficulty: 3
    type: match
    stem: "จากแคลโดแกรมของพืช จับคู่ตำแหน่ง ก ข ค กับลักษณะที่เกิดขึ้นใหม่ที่ตำแหน่งนั้น"
    figure: { src: plant-cladogram.svg, alt: "แคลโดแกรมของพืช 4 ชนิดเรียงจากบนลงล่าง มอส เฟิน สน มะม่วง มอสแยกออกก่อน บนกิ่งที่นำไปสู่เฟิน สน และมะม่วงมีตำแหน่ง ก ถัดมาเฟินแยกออก บนกิ่งที่นำไปสู่สนและมะม่วงมีตำแหน่ง ข จากนั้นสนกับมะม่วงแยกจากกัน บนกิ่งของมะม่วงเพียงชนิดเดียวมีตำแหน่ง ค" }
    pairs:
      - { left: "ก", right: "มีเนื้อเยื่อลำเลียง" }
      - { left: "ข", right: "สืบพันธุ์ด้วยเมล็ด" }
      - { left: "ค", right: "มีดอกและผลห่อหุ้มเมล็ด" }
    hints:
      - "ลักษณะที่ตำแหน่งหนึ่งต้องมีในทุกชนิดที่อยู่ปลายกิ่งถัดจากตำแหน่งนั้น และไม่มีในชนิดที่แยกออกไปก่อน"
      - "มอสไม่มีท่อลำเลียง เฟินมีท่อลำเลียงแต่ไม่มีเมล็ด สนมีเมล็ดแต่ไม่มีดอก"
    solution: "ก อยู่ก่อนเฟิน สน มะม่วง ซึ่งมีเนื้อเยื่อลำเลียงแต่มอสไม่มี ข อยู่ก่อนสนกับมะม่วงซึ่งมีเมล็ด ค อยู่บนกิ่งมะม่วงเท่านั้น คือดอกและผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.biodiversity-classification.p010
    topics: [biology.diversity.biodiversity-classification]
    difficulty: 3
    type: numeric
    stem: "นักเรียนสร้างไดโคโทมัสคีย์เพื่อแยกปลา 7 ชนิดในบึงบอระเพ็ด ถ้าแต่ละข้อแยกเป็นสองทางและแต่ละชนิดมีคีย์ทางเดียว คีย์นี้ต้องมีกี่ข้อ"
    answer: { value: 6, unit: ข้อ }
    misconceptions:
      - { match: 7, feedback: "จำนวนข้อเท่ากับจำนวนชนิดลบหนึ่ง เพราะข้อสุดท้ายแยกได้สองชนิดพร้อมกัน" }
      - { match: 3, feedback: "3 ข้อเป็นจำนวนขั้นน้อยที่สุดที่ต้องไล่ถ้าแบ่งครึ่งทุกครั้ง แต่จำนวนข้อในคีย์ทั้งหมดคือจำนวนชนิดลบหนึ่ง" }
    hints:
      - "แต่ละข้อแยกกลุ่มหนึ่งกลุ่มออกเป็นสองกลุ่ม จำนวนกลุ่มเพิ่มขึ้นทีละหนึ่ง"
      - "เริ่มจาก 1 กลุ่ม ต้องแยกกี่ครั้งจึงได้ 7 กลุ่ม"
    solution: "ทุกข้อเพิ่มจำนวนกลุ่มขึ้น 1 เริ่มจาก 1 กลุ่มต้องการ 7 กลุ่ม จึงใช้ $7 - 1 = 6$ ข้อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.biodiversity-classification.p011
