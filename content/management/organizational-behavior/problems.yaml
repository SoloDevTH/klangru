    answer: { value: 41.0, unit: "%", tolerance: 0.1 }
    hints:
      - "แต่ละระดับคูณด้วย 0.8 ต่อกันไป ไม่ใช่ลบ 20 ทีละครั้ง"
      - "คำนวณ $0.8^4 \\times 100$"
    misconceptions:
      - { match: 20, feedback: "ดูเหมือนลบทีละร้อยละ 20 ของต้นฉบับ แต่แต่ละระดับเสียร้อยละ 20 ของสิ่งที่ตนได้รับ จึงต้องคูณต่อกัน" }
