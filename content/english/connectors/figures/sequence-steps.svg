<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 285" width="760" height="285" font-family="sans-serif">
<title>ขั้นตอนต้มบะหมี่กึ่งสำเร็จรูปสี่ขั้น First Next Then Finally</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="760" height="285" fill="#fff"/>
<rect x="20.0" y="20.0" width="160.0" height="245.0" rx="12" fill="#fff" stroke="#1f4e9c" stroke-width="2"/>
<text x="100.0" y="48.0" font-size="20" text-anchor="middle" fill="#1f4e9c" font-weight="bold">First,</text>
<path d="M65.0,155 L72.0,115 Q100.0,95 128.0,115 L135.0,155 Z" fill="#ddd" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M130.0,125 L150.0,110" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M85.0,95 q5,-6 0,-12 q-5,-6 0,-12" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M100.0,95 q5,-6 0,-12 q-5,-6 0,-12" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M115.0,95 q5,-6 0,-12 q-5,-6 0,-12" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="100.0" y="218.0" font-size="15" text-anchor="middle" fill="#111">boil the water.</text>
<line x1="182.0" y1="140.0" x2="204.0" y2="140.0" stroke="#111" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="206.0" y="20.0" width="160.0" height="245.0" rx="12" fill="#fff" stroke="#1f4e9c" stroke-width="2"/>
<text x="286.0" y="48.0" font-size="20" text-anchor="middle" fill="#1f4e9c" font-weight="bold">Next,</text>
<path d="M241.0,125 Q286.0,185 331.0,125 Z" fill="#f4f8fb" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M256.0,123 q5,-12 10,0 q5,12 10,0" fill="none" stroke="#b35900" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M271.0,123 q5,-12 10,0 q5,12 10,0" fill="none" stroke="#b35900" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M286.0,123 q5,-12 10,0 q5,12 10,0" fill="none" stroke="#b35900" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M301.0,123 q5,-12 10,0 q5,12 10,0" fill="none" stroke="#b35900" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="286.0" y="218.0" font-size="15" text-anchor="middle" fill="#111">put the noodles</text>
<text x="286.0" y="238.0" font-size="15" text-anchor="middle" fill="#111">in a bowl.</text>
<line x1="368.0" y1="140.0" x2="390.0" y2="140.0" stroke="#111" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="392.0" y="20.0" width="160.0" height="245.0" rx="12" fill="#fff" stroke="#1f4e9c" stroke-width="2"/>
<text x="472.0" y="48.0" font-size="20" text-anchor="middle" fill="#1f4e9c" font-weight="bold">Then,</text>
<path d="M432.0,155 Q472.0,191 512.0,155 Z" fill="#f4f8fb" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M432.0,90 L477.0,105 L472.0,130 L427.0,115 Z" fill="#ddd" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M475.0,113 Q484.0,135 480.0,153" fill="none" stroke="#4a90d9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472.0" y="218.0" font-size="15" text-anchor="middle" fill="#111">pour the hot</text>
<text x="472.0" y="238.0" font-size="15" text-anchor="middle" fill="#111">water on them.</text>
<line x1="554.0" y1="140.0" x2="576.0" y2="140.0" stroke="#111" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="578.0" y="20.0" width="160.0" height="245.0" rx="12" fill="#fff" stroke="#1f4e9c" stroke-width="2"/>
<text x="658.0" y="48.0" font-size="20" text-anchor="middle" fill="#1f4e9c" font-weight="bold">Finally,</text>
<circle cx="658.0" cy="125.0" r="34.0" fill="#fff" stroke="#111" stroke-width="3"/>
<line x1="658.0" y1="125.0" x2="658.0" y2="99.0" stroke="#111" stroke-width="3" stroke-linecap="round"/>
<line x1="658.0" y1="125.0" x2="676.0" y2="125.0" stroke="#111" stroke-width="3" stroke-linecap="round"/>
<text x="658.0" y="179.0" font-size="14" text-anchor="middle" fill="#555" font-weight="bold">3 min</text>
<text x="658.0" y="218.0" font-size="15" text-anchor="middle" fill="#111">wait three</text>
<text x="658.0" y="238.0" font-size="15" text-anchor="middle" fill="#111">minutes and eat.</text>
</svg>
