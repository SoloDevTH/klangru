    ai_assisted: true

  - id: chemistry.stoichiometry.reactions.p018
    topics: [chemistry.stoichiometry.reactions]
    difficulty: 5
    type: numeric
    stem: "นักเรียนบดเปลือกไข่ 1.25 g แล้วเติมกรดไฮโดรคลอริกมากเกินพอ $\\mathrm{CaCO_3 + 2HCl \\to CaCl_2 + H_2O + CO_2}$ ชั่งพบว่ามวลลดลง 0.517 g เพราะแก๊ส $\\mathrm{CO_2}$ หนีออกไป เปลือกไข่มี $\\mathrm{CaCO_3}$ ร้อยละเท่าใดโดยมวล (สมมติว่าสารอื่นในเปลือกไข่ไม่ให้แก๊ส · Ca = 40.08, C = 12.01, O = 16.00)"
    answer: { value: 94.1, tolerance: 0.3, unit: "%" }
    misconceptions:
      - { match: 41.4, feedback: "นี่คือร้อยละของมวล $\\mathrm{CO_2}$ เทียบกับเปลือกไข่ ต้องเปลี่ยนเป็นมวล $\\mathrm{CaCO_3}$ ก่อน" }
      - { match: 188.1, feedback: "ใช้อัตราส่วน $\\mathrm{HCl}$ ($2 : 1$) แทนอัตราส่วน $\\mathrm{CaCO_3 : CO_2} = 1 : 1$" }
    hints:
      - "มวลที่ลดลงคือมวลของ $\\mathrm{CO_2}$ เปลี่ยนเป็นโมล"
      - "โมล $\\mathrm{CaCO_3}$ = โมล $\\mathrm{CO_2}$ แล้วเปลี่ยนเป็นมวลและเทียบกับ 1.25 g"
    solution: "$\\mathrm{CO_2}$ $= 0.517 / 44.01 = 0.01175$ mol $= \\mathrm{CaCO_3}$ ได้มวล $0.01175 \\times 100.09 = 1.176$ g ร้อยละ $= \\dfrac{1.176}{1.25} \\times 100 =$ **94.1**"
    license: CC-BY-SA-4.0
    ai_assisted: true

