problems:
  - id: management.project.risk-management.p001
    topics: [management.project.risk-management]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเขียนเป็น **ความเสี่ยง** ได้ถูกต้อง ไม่ใช่ปัญหาที่เกิดแล้ว"
    choices:
      - { id: a, text: "เนื่องจากผู้รับเหมามีงานหลายแห่ง อาจส่งคนงานไม่ครบ ส่งผลให้งานหลังคาเสร็จช้ากว่ากำหนด", correct: true }
      - { id: b, text: "หลังคาอาคารรั่วเมื่อคืนนี้ ต้องซ่อมด่วน", feedback: "เกิดขึ้นแล้ว จึงเป็นปัญหา ไม่ใช่ความเสี่ยง" }
      - { id: c, text: "ไฟฟ้า", feedback: "กว้างเกินไป ไม่บอกเหตุการณ์ สาเหตุ หรือผลกระทบ" }
      - { id: d, text: "งบโครงการเกินไปแล้ว 12%", feedback: "เกิดขึ้นแล้ว จึงเป็นปัญหา" }
    hints:
      - "ความเสี่ยงยังไม่เกิดและไม่แน่นอน"
      - "ประโยคที่ดีมี สาเหตุ เหตุการณ์ และผลกระทบ"
    solution: "ข้อ ก บอกสาเหตุ (ผู้รับเหมามีงานหลายแห่ง) เหตุการณ์ที่อาจเกิด (ส่งคนไม่ครบ) และผลกระทบ (งานช้า) ส่วนข้ออื่นเป็นปัญหาที่เกิดแล้วหรือกว้างเกินไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.risk-management.p002
    topics: [management.project.risk-management]
    difficulty: 1
    type: match
    stem: "จับคู่การกระทำของโรงงานแปรรูปผลไม้ (สมมติ) กับกลยุทธ์ตอบสนองความเสี่ยง"
    pairs:
      - { left: "ยกเลิกการส่งออกไปประเทศที่กฎสารตกค้างเปลี่ยนบ่อย", right: "หลีกเลี่ยง" }
      - { left: "ติดตั้งเครื่องตรวจโลหะหน้าสายบรรจุ", right: "ลด" }
      - { left: "ทำประกันภัยสินค้าระหว่างขนส่ง", right: "ถ่ายโอน" }
      - { left: "กันเงินสำรองไว้กรณีค่าไฟขึ้น", right: "ยอมรับ" }
      - { left: "เพิ่มกะทำงานเพื่อให้รับคำสั่งซื้อพิเศษที่อาจเข้ามาได้ทัน", right: "เพิ่มโอกาส" }
      - { left: "ร่วมทุนกับผู้ส่งออกรายอื่นเพื่อชิงสัญญาใหญ่ที่ทำคนเดียวไม่ไหว", right: "แบ่งปันโอกาส" }
    hints:
      - "สี่แบบแรกเป็นของภัยคุกคาม สองแบบหลังเป็นของโอกาส"
      - "ถ่ายโอนคือให้คนอื่นรับผลกระทบแทน"
    solution: "ยกเลิกตลาดคือหลีกเลี่ยง เครื่องตรวจโลหะลดโอกาสเกิด ประกันภัยถ่ายโอนผลกระทบ เงินสำรองคือยอมรับ เพิ่มกะทำงานเพิ่มโอกาสได้คำสั่งซื้อ และร่วมทุนคือแบ่งปันโอกาส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.risk-management.p003
    topics: [management.project.risk-management]
    difficulty: 1
    type: numeric
    stem: "ความเสี่ยง \"ผู้ป่วยพลัดตกเตียง\" ได้คะแนนโอกาสเกิด 4 และผลกระทบ 3 (มาตรา 1–5) คะแนนความเสี่ยงเป็นเท่าไร"
    answer: { value: 12 }
    hints:
      - "คะแนนความเสี่ยง = โอกาส × ผลกระทบ"
      - "คูณ 4 กับ 3"
    misconceptions:
      - { match: 7, feedback: "บวกคะแนนสองด้าน ต้องคูณกัน" }
    solution: "$4 \\times 3 = 12$ อยู่ในระดับสูงตามเกณฑ์ตัวอย่างในบทเรียน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.risk-management.p004
    topics: [management.project.risk-management]
    difficulty: 2
    type: numeric
    stem: "โครงการสร้างหอประชุมโรงเรียน (สมมติ) มีโอกาส 25% ที่เหล็กเส้นจะขึ้นราคา ทำให้ต้นทุนเพิ่ม 400,000 บาท มูลค่าเงินที่คาดหมายของความเสี่ยงนี้เป็นกี่บาท (ตอบเป็นค่าลบเพราะเป็นภัยคุกคาม)"
    answer: { value: -100000, unit: บาท }
    hints:
      - "EMV = ความน่าจะเป็น × ผลกระทบ"
      - "ภัยคุกคามใช้ผลกระทบเป็นค่าลบ"
    misconceptions:
      - { match: -400000, feedback: "นั่นคือผลกระทบเต็ม ยังไม่ได้คูณความน่าจะเป็น" }
      - { match: 100000, feedback: "ขนาดถูก แต่ภัยคุกคามต้องเป็นค่าลบ" }
    solution: "$0.25 \\times (-400{,}000) = -100{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.risk-management.p005
    topics: [management.project.risk-management]
    difficulty: 2
    type: numeric
    stem: "ทะเบียนความเสี่ยงของโครงการ (สมมติ) มีภัยคุกคามสามข้อ โอกาส 0.2 เสียหาย 500,000 บาท โอกาส 0.1 เสียหาย 1,200,000 บาท โอกาส 0.4 เสียหาย 50,000 บาท และมีโอกาสด้านบวกหนึ่งข้อ โอกาส 0.3 ได้ประโยชน์ 200,000 บาท ถ้าตั้งเงินสำรองเผื่อเหตุเท่ากับขนาดของ EMV สุทธิ ต้องตั้งกี่บาท"
    answer: { value: 180000, unit: บาท }
    hints:
      - "หา EMV ของแต่ละข้อ ภัยคุกคามเป็นลบ โอกาสเป็นบวก"
      - "รวมทุกข้อแล้วใช้ขนาดของผลรวม"
    misconceptions:
      - { match: 240000, feedback: "ไม่ได้หักโอกาสด้านบวก (60,000 บาท)" }
      - { match: 1950000, feedback: "รวมผลกระทบเต็มโดยไม่คูณความน่าจะเป็น" }
      - { match: 300000, feedback: "บวกโอกาสด้านบวกเข้ากับภัยคุกคาม ต้องหักออกเพราะเป็นค่าบวก" }
    solution: "ภัยคุกคาม $-100{,}000 - 120{,}000 - 20{,}000 = -240{,}000$ โอกาส $+60{,}000$ EMV สุทธิ $-180{,}000$ ตั้งเงินสำรอง 180,000 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.risk-management.p006
    topics: [management.project.risk-management]
    difficulty: 2
    type: mcq
    stem: "ตามแนวคิดการรับมือความเสี่ยงและโอกาสในระบบบริหารคุณภาพ มาตรการรับมือที่เลือกควรมีลักษณะใด"
    choices:
      - { id: a, text: "ได้สัดส่วนกับผลที่อาจเกิดต่อคุณภาพของผลิตภัณฑ์และบริการ และรวมเข้าไปในกระบวนการทำงาน แล้วประเมินว่าได้ผลหรือไม่", correct: true }
      - { id: b, text: "ทำมาตรการเต็มรูปแบบกับทุกความเสี่ยงเท่ากันหมด", feedback: "ทำเท่ากันหมดเปลืองทรัพยากร มาตรการควรได้สัดส่วนกับผลกระทบ" }
      - { id: c, text: "เขียนเป็นเอกสารแยกไว้ตรวจประเมินโดยไม่ต้องเชื่อมกับงานประจำ", feedback: "มาตรการที่ไม่อยู่ในกระบวนการทำงานจริงจะไม่เกิดผล" }
      - { id: d, text: "ดูเฉพาะภัยคุกคาม ไม่ต้องพิจารณาโอกาส", feedback: "การคิดบนฐานความเสี่ยงรวมทั้งความเสี่ยงและโอกาส" }
    hints:
      - "ทรัพยากรมีจำกัด"
      - "มาตรการต้องอยู่ในงานจริงและวัดผลได้"
    solution: "มาตรการควรได้สัดส่วนกับผลที่อาจเกิด ฝังอยู่ในกระบวนการทำงาน และประเมินประสิทธิผล ทั้งสำหรับความเสี่ยงและโอกาส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.risk-management.p007
    topics: [management.project.risk-management]
    difficulty: 3
    type: numeric
    stem: "FMEA ของขั้นจ่ายยาผู้ป่วยในของโรงพยาบาลแห่งหนึ่ง (สมมติ) แบบล้มเหลว \"ให้ยาผิดคน\" มี $S = 8$, $O = 4$, $D = 6$ หลังใช้สายรัดข้อมือแบบบาร์โค้ด $O$ ลดเป็น 2 และ $D$ ลดเป็น 3 ($S$ เท่าเดิม) RPN ลดลงกี่เปอร์เซ็นต์"
    answer: { value: 75, unit: "%" }
    hints:
      - "RPN = S × O × D หาก่อนและหลัง"
      - "ร้อยละที่ลด = (ก่อน − หลัง) ÷ ก่อน × 100"
    misconceptions:
      - { match: 144, feedback: "นั่นคือจำนวนแต้มที่ลดลง (192 − 48) ยังไม่ได้คิดเป็นร้อยละ" }
      - { match: 300, feedback: "หารด้วย RPN หลังปรับปรุง ต้องหารด้วยค่าก่อนปรับปรุง" }
    solution: "ก่อน $8 \\times 4 \\times 6 = 192$ หลัง $8 \\times 2 \\times 3 = 48$ ลดลง $(192 - 48) \\div 192 \\times 100 = 75\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.risk-management.p008
    topics: [management.project.risk-management]
    difficulty: 3
    type: numeric
    stem: "โครงการจัดงานกาชาดประจำจังหวัด (สมมติ) มีความเสี่ยงอิสระกันสามข้อ ฝนตกหนัก (0.3) ไฟฟ้าดับ (0.1) ผู้แสดงหลักยกเลิก (0.2) ความน่าจะเป็นที่จะเกิดอย่างน้อยหนึ่งข้อเป็นเท่าไร (ตอบเป็นทศนิยม)"
    answer: { value: 0.496, tolerance: 0.005 }
    hints:
      - "หาความน่าจะเป็นที่ไม่เกิดเลยสักข้อก่อน"
      - "$1 - (1-0.3)(1-0.1)(1-0.2)$"
    misconceptions:
      - { match: 0.6, feedback: "บวกความน่าจะเป็นตรง ๆ ซึ่งนับซ้ำกรณีที่เกิดพร้อมกันหลายข้อ" }
      - { match: 0.006, feedback: "นั่นคือความน่าจะเป็นที่เกิดครบทั้งสามข้อพร้อมกัน ไม่ใช่อย่างน้อยหนึ่งข้อ" }
      - { match: 0.504, feedback: "นั่นคือความน่าจะเป็นที่ไม่เกิดเลยสักข้อ ต้องเอา 1 ลบ" }
    solution: "ไม่เกิดเลย $0.7 \\times 0.9 \\times 0.8 = 0.504$ เกิดอย่างน้อยหนึ่งข้อ $1 - 0.504 = 0.496$ เกือบครึ่งหนึ่ง จึงควรมีแผนรองรับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.risk-management.p009
    topics: [management.project.risk-management]
    difficulty: 3
    type: numeric
    stem: "จากต้นไม้การตัดสินใจในภาพ ให้คิดต้นทุนคาดหมายของแต่ละทาง (ค่าใช้จ่ายทันที + EMV ของความเสียหาย) ทางเลือกที่ต้นทุนคาดหมายต่ำกว่ามีต้นทุนต่ำกว่าอีกทางกี่บาท"
    figure:
      src: p-tree.svg
      alt: "ต้นไม้การตัดสินใจ ก. ซื้อเครื่องใหม่ จ่ายทันที 300,000 บาท ไฟดับนาน 0.15 ความเสียหาย 200,000 ไม่ดับนาน 0.85 ความเสียหาย 0 · ข. ไม่ซื้อ จ่ายทันที 0 ไฟดับนาน 0.15 ความเสียหาย 2,500,000 ไม่ดับนาน 0.85 ความเสียหาย 0"
    answer: { value: 45000, unit: บาท }
    hints:
      - "ต้นทุนคาดหมายของ ก. = 300,000 + 0.15 × 200,000"
      - "ต้นทุนคาดหมายของ ข. = 0.15 × 2,500,000 แล้วหาผลต่าง"
    misconceptions:
      - { match: 75000, feedback: "ลืมความเสียหาย 200,000 บาทที่ยังเกิดได้แม้มีเครื่องใหม่" }
      - { match: 2200000, feedback: "เทียบความเสียหายเต็มโดยไม่คูณความน่าจะเป็น" }
    solution: "ก. $300{,}000 + 0.15 \\times 200{,}000 = 330{,}000$ บาท ข. $0.15 \\times 2{,}500{,}000 = 375{,}000$ บาท ทาง ก. ต่ำกว่า $45{,}000$ บาท และยังลดกรณีเลวร้ายจาก 2.5 ล้านเหลือ 5 แสนบาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.risk-management.p010
    topics: [management.project.risk-management]
    difficulty: 3
    type: mcq
    stem: "ในเมทริกซ์ความเสี่ยงของโรงพยาบาลในบทเรียน R2 ให้ยาผิดคน (โอกาส 3 ผลกระทบ 4) และ R3 ผู้ป่วยพลัดตกเตียง (โอกาส 4 ผลกระทบ 3) ได้คะแนน 12 เท่ากัน ถ้าทรัพยากรพอแก้ได้ทีละเรื่อง ข้อใดเป็นเหตุผลที่ดีที่สุดในการตัดสินใจ"
    choices:
      - { id: a, text: "ดูความรุนแรงต่อผู้ป่วยเพิ่ม R2 ผลกระทบสูงกว่าและอาจถึงชีวิต จึงควรได้รับความสำคัญก่อน แล้ววางแผน R3 ต่อ", correct: true }
      - { id: b, text: "คะแนนเท่ากันจึงสุ่มเลือก", feedback: "คะแนนรวมเท่ากันไม่ได้แปลว่าสำคัญเท่ากัน ควรดูองค์ประกอบของคะแนนด้วย" }
      - { id: c, text: "เลือก R3 เพราะโอกาสเกิดสูงกว่า", feedback: "โอกาสสูงกว่าแต่ผลกระทบต่ำกว่า ในงานด้านความปลอดภัยของผู้ป่วยมักให้น้ำหนักกับผลกระทบรุนแรงก่อน" }
      - { id: d, text: "ไม่ต้องทำทั้งสองเรื่องเพราะยังไม่ถึงระดับสูงมาก", feedback: "ทั้งสองอยู่ในระดับสูง ต้องมีมาตรการ" }
    hints:
      - "คะแนน 12 มาจากองค์ประกอบต่างกัน"
      - "องค์กรนี้ยอมรับความเสี่ยงต่อชีวิตผู้ป่วยได้แค่ไหน"
    solution: "เมื่อคะแนนเท่ากัน ให้ดูว่าส่วนใดสูง R2 มีผลกระทบรุนแรงกว่าซึ่งเกี่ยวกับชีวิตผู้ป่วย ตามระดับความเสี่ยงที่ยอมรับได้ขององค์กรจึงควรแก้ก่อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.risk-management.p011
    topics: [management.project.risk-management]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนบริหารความเสี่ยงของโครงการจากก่อนไปหลัง"
    items:
      - "วางแผนวิธีบริหารความเสี่ยงและเกณฑ์ให้คะแนน"
      - "ระบุความเสี่ยงและบันทึกในทะเบียน"
      - "ให้คะแนนโอกาสและผลกระทบ"
      - "ประเมินเป็นตัวเงินด้วย EMV สำหรับความเสี่ยงสำคัญ"
      - "เลือกกลยุทธ์ตอบสนองและกำหนดเจ้าของความเสี่ยง"
      - "ดำเนินมาตรการและติดตามสัญญาณเตือน"
    hints:
      - "ต้องมีเกณฑ์ก่อนจึงให้คะแนนได้"
      - "วิเคราะห์เชิงคุณภาพก่อนเชิงปริมาณ"
    solution: "วางแผน → ระบุ → วิเคราะห์เชิงคุณภาพ → วิเคราะห์เชิงปริมาณ → วางแผนตอบสนอง → ดำเนินการและติดตาม แล้วทบทวนซ้ำเป็นวงจร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.risk-management.p012
    topics: [management.project.risk-management]
    difficulty: 4
    type: numeric
