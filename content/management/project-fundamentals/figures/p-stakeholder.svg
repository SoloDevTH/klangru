<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500" font-family="sans-serif" font-size="14">
<title>ตารางอำนาจและความสนใจของผู้มีส่วนได้ส่วนเสียสี่กลุ่ม</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="ahk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="0" y="0" width="600" height="500" fill="#ffffff"/>
<text x="300.0" y="28.0" text-anchor="middle" font-size="15" fill="#222" font-weight="bold" >ผู้มีส่วนได้ส่วนเสียของโครงการศูนย์พัฒนาเด็กเล็ก (สมมติ)</text>
<rect x="90.0" y="55.0" width="440.0" height="340.0" rx="0" fill="#fff" stroke="#222" stroke-width="1.5" />
<line x1="310.0" y1="55.0" x2="310.0" y2="395.0" stroke="#777" stroke-width="1.5" stroke-dasharray="5 4" />
<line x1="90.0" y1="225.0" x2="530.0" y2="225.0" stroke="#777" stroke-width="1.5" stroke-dasharray="5 4" />
<text x="310.0" y="425.0" text-anchor="middle" font-size="14" fill="#222" >ความสนใจต่อโครงการ (ต่ำ → สูง)</text>
<text x="40.0" y="225.0" text-anchor="middle" font-size="14" fill="#222" transform="rotate(-90 40 225.0)">อำนาจต่อโครงการ (ต่ำ → สูง)</text>
<circle cx="464.0" cy="95.8" r="15" fill="#6a3d9a" stroke="none" stroke-width="1.5"/>
<text x="464.0" y="100.8" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold" >A</text>
<circle cx="442.0" cy="327.0" r="15" fill="#6a3d9a" stroke="none" stroke-width="1.5"/>
<text x="442.0" y="332.0" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold" >B</text>
<circle cx="178.0" cy="123.0" r="15" fill="#6a3d9a" stroke="none" stroke-width="1.5"/>
<text x="178.0" y="128.0" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold" >C</text>
<circle cx="169.2" cy="344.0" r="15" fill="#6a3d9a" stroke="none" stroke-width="1.5"/>
<text x="169.2" y="349.0" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold" >D</text>
<text x="90.0" y="450.0" text-anchor="middle" font-size="1" fill="#222" ></text>
<text x="90.0" y="450.0" text-anchor="middle" font-size="1" fill="#222" ></text>
<text x="90.0" y="450.0" text-anchor="middle" font-size="1" fill="#222" ></text>
<text x="90.0" y="450.0" text-anchor="middle" font-size="1" fill="#222" ></text>
<text x="300.0" y="455.0" text-anchor="middle" font-size="13" fill="#222" >A ผู้บริหารเทศบาล (ผู้สนับสนุนโครงการ)   B ผู้ปกครองเด็ก</text>
<text x="300.0" y="478.0" text-anchor="middle" font-size="13" fill="#222" >C หน่วยงานที่อนุญาตการระบายน้ำ   D ร้านค้าห่างออกไปสองซอย</text>
</svg>
