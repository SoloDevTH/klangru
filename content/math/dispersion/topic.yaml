id: math.stats.dispersion
subject: math
title: { th: การวัดการกระจายของข้อมูล, en: Measures of dispersion }
summary: วัดว่าข้อมูลกระจายมากน้อยเพียงใดด้วยพิสัย ควอร์ไทล์ แผนภาพกล่อง และส่วนเบี่ยงเบนมาตรฐาน แล้วแปลความหมายเพื่อเปรียบเทียบข้อมูลสองชุด
difficulty: 4.5
minutes: 40
prerequisites: [math.stats.central-tendency, math.number.roots]
encompasses:
  - { id: math.stats.central-tendency, weight: 0.4 }
  - { id: math.number.roots, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: same-mean-different-spread.svg
    alt: "แผนภาพจุดสองชุดบนแกน 0 ถึง 40 นาที ร้าน ก มีเวลารอ 18, 19, 20, 20, 21, 22 นาที เกาะกลุ่มใกล้ 20 ร้าน ข มีเวลารอ 2, 10, 15, 25, 30, 38 นาที กระจายไปทั่ว ทั้งสองร้านมีค่าเฉลี่ย 20 นาทีเท่ากัน"
    caption: "ค่าเฉลี่ยเท่ากันที่ 20 นาที แต่ร้าน ข มีพิสัย 36 นาที ขณะที่ร้าน ก มีพิสัยเพียง 4 นาที"
  - { type: check, problem: math.disp.p013, prompt: "ลองคิดว่าค่าวัดไหนไวต่อค่าผิดปกติ" }
  - type: worked-example
    title: หา MAD และส่วนเบี่ยงเบนมาตรฐานของข้อมูลชุดเดียวกัน
    problem: "เวลารอคิวของร้าน ก (นาที): 18, 19, 20, 20, 21, 22 จงหา MAD และส่วนเบี่ยงเบนมาตรฐาน (ประชากร)"
    steps:
      - text: "ค่าเฉลี่ย $\\mu = \\tfrac{120}{6} = 20$ นาที ส่วนเบี่ยงเบน $x - \\mu$ คือ $-2, -1, 0, 0, 1, 2$"
      - text: "MAD: ระยะห่างคือ 2, 1, 0, 0, 1, 2 รวม 6 หารด้วย 6 ได้ $\\text{MAD} = 1$ นาที"
        why: "ใช้ค่าสัมบูรณ์ เพราะถ้ารวมแบบมีเครื่องหมายจะได้ 0"
      - text: "ส่วนเบี่ยงเบนมาตรฐาน: ยกกำลังสองได้ 4, 1, 0, 0, 1, 4 รวม 10 ความแปรปรวน $= \\tfrac{10}{6} \\approx 1.67$"
      - text: "$\\sigma = \\sqrt{1.67} \\approx 1.29$ นาที"
        why: "$\\sigma$ มักมากกว่า MAD เล็กน้อย เพราะการยกกำลังสองให้น้ำหนักกับระยะห่างที่มากกว่า"
    answer: "MAD $= 1$ นาที, $\\sigma \\approx 1.29$ นาที"
  - type: figure
    src: boxplot-outlier.svg
    alt: "แผนภาพกล่องบนแกน 10 ถึง 40 ค่าต่ำสุด 12 Q1 15 มัธยฐาน 18 Q3 21 หนวดขวาไปถึง 22 IQR เท่ากับ 6 เส้นประแนวตั้งที่ 30 คือ Q3 + 1.5 IQR และมีวงกลมกลวงที่ 40 ระบุว่าเป็นค่าผิดปกติ"
    caption: "ค่า 40 เกินเกณฑ์ $Q_3 + 1.5\\,\\text{IQR} = 30$ จึงวาดเป็นจุดแยก หนวดลากไปถึงค่าสูงสุดที่ไม่ผิดปกติคือ 22"
  - type: worked-example
    title: ตรวจหาค่าผิดปกติด้วยเกณฑ์ 1.5 IQR
    problem: "ห้าค่าของข้อมูลชุดหนึ่งคือ ต่ำสุด 3, $Q_1 = 20$, มัธยฐาน 26, $Q_3 = 32$, สูงสุด 58 มีค่าผิดปกติหรือไม่"
    steps:
      - text: "$\\text{IQR} = 32 - 20 = 12$ และ $1.5 \\times 12 = 18$"
      - text: "เกณฑ์ด้านบน $= Q_3 + 18 = 50$ ค่าสูงสุด 58 มากกว่า 50 จึงเป็นค่าผิดปกติ"
      - text: "เกณฑ์ด้านล่าง $= Q_1 - 18 = 2$ ค่าต่ำสุด 3 ไม่น้อยกว่า 2 จึงไม่เป็นค่าผิดปกติ"
        why: "ต้องตรวจทั้งสองด้าน ค่าที่ดูห่างจากกลุ่มอาจยังไม่ผิดปกติตามเกณฑ์"
      - text: "สรุป: มีค่าผิดปกติด้านบนอย่างน้อยหนึ่งค่า (58) ข้อมูลชุดนี้ควรสรุปด้วยมัธยฐานและ IQR มากกว่าค่าเฉลี่ยและ $\\sigma$"
    answer: "58 เป็นค่าผิดปกติ ส่วน 3 ไม่เป็น"
  - { type: check, problem: math.disp.p015, prompt: "เทียบความยาวของกล่องสองกล่อง" }
  - type: interactive
    title: ห้าค่าของแผนภาพกล่องบนเส้นจำนวน
    caption: ห้าค่าจากตัวอย่างที่ 1 (4, 7, 8, 10, 13, 15, 20) กล่องของแผนภาพกล่องคือช่วงจาก Q1 ถึง Q3 ยาวเท่ากับ IQR = 8 ส่วนระยะจากค่าต่ำสุดถึงค่าสูงสุดคือพิสัย 16 สังเกตว่าหนวดด้านขวายาวกว่าด้านซ้าย ข้อมูลจึงเบ้ไปทางค่ามาก
    widget:
      kind: number-line
      min: 0
      max: 22
      points:
        - { value: 4, label: ต่ำสุด }
        - { value: 7, label: Q1 }
        - { value: 10, label: มัธยฐาน }
        - { value: 15, label: Q3 }
        - { value: 20, label: สูงสุด }
      jumps:
        - { from: 7, to: 15, label: "IQR = 8" }
  - type: simulation
    title: ค่ากลางและการกระจายบนแผนภาพจุด (PhET Center and Variability)
    url: https://phet.colorado.edu/en/simulations/center-and-variability
    provider: phet
    note: เตะลูกบอลหลาย ๆ ครั้งให้เกิดแผนภาพจุด เปิดแสดงพิสัยและ IQR แล้วลากจุดหนึ่งไปไกล ๆ สังเกตว่าพิสัยเปลี่ยนมาก แต่ IQR แทบไม่เปลี่ยน
glossary:
  - { term: พิสัย, definition: "ค่าสูงสุดลบค่าต่ำสุดของข้อมูล" }
  - { term: ควอร์ไทล์, definition: "ค่าที่แบ่งข้อมูลที่เรียงแล้วออกเป็นสี่ส่วนเท่า ๆ กัน ได้แก่ $Q_1$, $Q_2$ (มัธยฐาน) และ $Q_3$" }
  - { term: พิสัยระหว่างควอร์ไทล์ (IQR), definition: "$Q_3 - Q_1$ คือความกว้างของข้อมูลครึ่งกลาง" }
  - { term: แผนภาพกล่อง, definition: "แผนภาพที่สรุปข้อมูลด้วยค่าต่ำสุด $Q_1$ มัธยฐาน $Q_3$ และค่าสูงสุด" }
  - { term: ส่วนเบี่ยงเบนมาตรฐาน, definition: "ค่าที่บอกว่าโดยเฉลี่ยข้อมูลอยู่ห่างจากค่าเฉลี่ยเท่าใด $\\sigma = \\sqrt{\\tfrac{\\sum (x - \\mu)^2}{N}}$" }
  - { term: ความแปรปรวน, definition: "กำลังสองของส่วนเบี่ยงเบนมาตรฐาน $\\sigma^2$" }
flashcards:
  - { front: "ตำแหน่งของ $Q_1$ และ $Q_3$ เมื่อมีข้อมูล $N$ ตัว", back: "$Q_1$ อยู่ตำแหน่ง $\\tfrac{N + 1}{4}$ และ $Q_3$ อยู่ตำแหน่ง $\\tfrac{3(N + 1)}{4}$ ของข้อมูลที่เรียงแล้ว" }
  - { front: "สูตรส่วนเบี่ยงเบนมาตรฐานของประชากร", back: "$\\sigma = \\sqrt{\\dfrac{\\sum (x - \\mu)^2}{N}}$" }
  - { front: "ทำไม IQR จึงทนต่อค่าผิดปกติได้ดีกว่าพิสัย", back: "IQR ใช้เฉพาะข้อมูลครึ่งกลาง ($Q_1$ ถึง $Q_3$) ส่วนพิสัยใช้ค่าต่ำสุดและสูงสุดซึ่งอาจเป็นค่าผิดปกติ" }
  - { front: "บวก 10 เข้ากับข้อมูลทุกตัว ส่วนเบี่ยงเบนมาตรฐานเปลี่ยนอย่างไร", back: "ไม่เปลี่ยน เพราะข้อมูลเลื่อนไปทั้งชุด ระยะห่างจากค่าเฉลี่ยเท่าเดิม" }
