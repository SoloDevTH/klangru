<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260" font-family="sans-serif" font-size="13">
<title>สตอรีบอร์ดสี่ช่องของเกมเก็บผลไม้ ช่องแรกเป็นฉากเริ่มต้นกับตัวละครหน้าประตู ช่องที่สองผู้เล่นกดปุ่มให้ตัวละครเดินไปทางขวา ช่องที่สามผลไม้ตกลงในตะกร้าและได้ 1 คะแนน ช่องที่สี่ด่านจบและแสดงคะแนนรวม</title>
<rect x="0" y="0" width="520" height="260" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<text x="70.0" y="34" text-anchor="middle" font-weight="bold" fill="#1f2937">1 ฉากเริ่มต้น</text>
<rect x="12" y="48" width="116" height="170" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<rect x="26" y="64" width="26" height="54" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/>
<circle cx="74" cy="108" r="9" fill="#60a5fa" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="70.0" y="188" text-anchor="middle" fill="#1f2937">ตัวละครยืน</text>
<text x="70.0" y="204" text-anchor="middle" fill="#1f2937">หน้าประตู</text>
<text x="200.0" y="34" text-anchor="middle" font-weight="bold" fill="#1f2937">2 ผู้เล่นกดปุ่ม</text>
<rect x="142" y="48" width="116" height="170" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<circle cx="172" cy="100" r="9" fill="#60a5fa" stroke="#1e3a8a" stroke-width="1.5"/>
<line x1="188" y1="100" x2="238" y2="100" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
<text x="200.0" y="188" text-anchor="middle" fill="#1f2937">ตัวละครเดิน</text>
<text x="200.0" y="204" text-anchor="middle" fill="#1f2937">ไปทางขวา</text>
<text x="330.0" y="34" text-anchor="middle" font-weight="bold" fill="#1f2937">3 เก็บผลไม้</text>
<rect x="272" y="48" width="116" height="170" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<circle cx="330.0" cy="78" r="9" fill="#f87171" stroke="#7f1d1d" stroke-width="1.5"/>
<rect x="306.0" y="110" width="48" height="16" rx="4" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="330.0" y="188" text-anchor="middle" fill="#1f2937">ผลไม้ตกลงตะกร้า</text>
<text x="330.0" y="204" text-anchor="middle" fill="#1f2937">ได้ +1 คะแนน</text>
<text x="460.0" y="34" text-anchor="middle" font-weight="bold" fill="#1f2937">4 จบด่าน</text>
<rect x="402" y="48" width="116" height="170" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="460.0" y="100" text-anchor="middle" font-weight="bold" font-size="24" fill="#1f2937">5</text>
<text x="460.0" y="188" text-anchor="middle" fill="#1f2937">แสดงคะแนน</text>
<text x="460.0" y="204" text-anchor="middle" fill="#1f2937">รวมเมื่อจบ</text>
<text x="260.0" y="250" text-anchor="middle" fill="#6b7280" font-size="12">อ่านจากซ้ายไปขวา ช่องแต่ละช่องคือหนึ่งจังหวะของการเล่น</text>
</svg>