<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230"><title>ตัวอย่างข้อความสีเทาอ่อนกับสีเทาเข้มบนพื้นขาว อัตราส่วนความคมชัดต่างกันมาก</title><rect width="720" height="230" fill="#ffffff"/><rect x="20" y="20" width="680" height="90" rx="0" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><text x="40" y="62" font-family="sans-serif" font-size="24" fill="#9ca3af" text-anchor="start" font-weight="normal">ข้อความสีเทาอ่อน #9ca3af</text><text x="40" y="94" font-family="sans-serif" font-size="13" fill="#b91c1c" text-anchor="start" font-weight="bold">อัตราส่วนความคมชัด 2.54 : 1 ไม่ผ่านเกณฑ์ AA (ต้อง 4.5 : 1)</text><rect x="20" y="125" width="680" height="90" rx="0" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><text x="40" y="167" font-family="sans-serif" font-size="24" fill="#595959" text-anchor="start" font-weight="normal">ข้อความสีเทาเข้ม #595959</text><text x="40" y="199" font-family="sans-serif" font-size="13" fill="#15803d" text-anchor="start" font-weight="bold">อัตราส่วนความคมชัด 7.00 : 1 ผ่านเกณฑ์ AA และ AAA</text></svg>
