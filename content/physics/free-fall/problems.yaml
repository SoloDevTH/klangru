  - id: phy.ff.p020
    topics: [physics.kinematics.free-fall]
    difficulty: 4
    type: numeric
    stem: "ปล่อยวัตถุจากหยุดนิ่งให้ตกอิสระ ในวินาทีที่ 2 (ระหว่าง $t = 1\\ \\mathrm{s}$ ถึง $t = 2\\ \\mathrm{s}$) วัตถุตกได้ระยะทางเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 14.7, tolerance: 0.05, unit: m }
    hints:
      - "หาระยะที่ตกได้ทั้งหมดเมื่อ $t = 2\\ \\mathrm{s}$ และเมื่อ $t = 1\\ \\mathrm{s}$"
      - "ระยะในวินาทีที่ 2 คือผลต่าง"
    misconceptions:
      - { match: 19.6, feedback: "นั่นคือระยะที่ตกได้ตั้งแต่เริ่มจนถึง $t = 2\\ \\mathrm{s}$ โจทย์ถามเฉพาะวินาทีที่ 2" }
      - { match: 4.9, feedback: "นั่นคือระยะในวินาทีแรก วัตถุเร็วขึ้นเรื่อย ๆ วินาทีที่ 2 จึงตกได้ไกลกว่า" }
    solution: "$s(2) = \\tfrac12(9.8)(2)^2 = 19.6\\ \\mathrm{m}$, $s(1) = 4.9\\ \\mathrm{m}$ ในวินาทีที่ 2 ตกได้ $19.6 - 4.9 = 14.7\\ \\mathrm{m}$ (ระยะในแต่ละวินาทีเป็น 4.9, 14.7, 24.5, ... เพิ่มขึ้นทีละ $9.8\\ \\mathrm{m}$)"
