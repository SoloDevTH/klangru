      - "ลองดูว่าตัวอย่างใดเกี่ยวกับสิ่งแวดล้อมโดยตรง"
    solution: "การติดต่อทั่วโลกเป็นผลที่ตั้งใจ การเข้าถึงที่ไม่เท่ากันเป็นผลที่ไม่ตั้งใจ และขยะเป็นผลต่อสิ่งแวดล้อม"
