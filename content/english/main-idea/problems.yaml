    *Every morning, Arthit walked past an old man who sold brooms at the market. Nobody seemed to buy them. One rainy day, Arthit bought a broom, although his family already had two. The old man''s face lit up. On the way home, Arthit realised that he felt happier than when he had won a new phone in a lucky draw.*'
  choices:
