- type: order
  difficulty: 5
  stem: เรียงประโยคต่อไปนี้ให้เป็นเรื่องเล่าที่ถูกต้อง (เรื่องนี้เกิดที่เชียงใหม่)
  items:
  - 我小时候住在清迈 (wǒ xiǎoshíhou zhù zài Qīngmài)。
  - 那时候 (nàshíhou)，我每天早上都去河边散步 (wǒ měitiān zǎoshang dōu qù hébiān sànbù)。
  - 有一天 (yǒu yì tiān)，我遇到了一位老爷爷 (wǒ yùdào le yí wèi lǎoyéye)。
  - 他教我画画 (tā jiāo wǒ huàhuà)，还送给我一本旧画册 (hái sònggěi wǒ yì běn jiù huàcè)。
  - 后来 (hòulái)，我也成了一个喜欢画画的人 (wǒ yě chéng le yí gè xǐhuan huàhuà de rén)。
  hints:
  - ประโยคแรกบอกช่วงชีวิตที่เกิดเรื่อง
  - 那时候 บอกเหตุการณ์ที่เป็นนิสัยประจำในช่วงนั้น
  - 有一天 บอกเหตุการณ์สำคัญที่เปลี่ยนเรื่อง และ 后来 เป็นผลลัพธ์
  solution: 'เรียง: ช่วงชีวิตในเชียงใหม่ → นิสัยตอนเช้า → วันหนึ่งได้พบคุณตา → คุณตาสอนวาดรูป → ต่อมากลายเป็นคนชอบวาดรูป'
