  difficulty: 4
  type: mcq
  stem: ข้อใดเป็น **การวิจารณ์** ตอนบางเดื่อที่ดีที่สุด
  choices:
  - id: a
    text: ไพเราะที่สุดในบรรดากลอนทั้งหมด
    feedback: ไม่มีเหตุผลและเกินจริง
  - id: b
    text: ไม่ดี เพราะพูดถึงแมลง
    feedback: ตัดสินจากความชอบ ไม่ได้ดูจุดประสงค์ของการเปรียบ
  - id: c
    text: สุนทรภู่คงไม่ชอบคนบางเดื่อ
    feedback: เดาเจตนาโดยไม่มีหลักฐาน และอ่านผิดว่าเป็นการว่าคนในตำบล
  - id: d
    text: จุดเด่นคือเล่นคำจากชื่อตำบลบางเดื่อสู่มะเดื่อ แล้วใช้อุปมาที่เห็นภาพชัด จุดที่ผู้อ่านปัจจุบันอาจไม่เข้าใจคือมะเดื่อมีแมลงหวี่ในผล จึงควรมีคำอธิบายประกอบ
    correct: true
    feedback: ถูก ชี้ทั้งจุดเด่นและข้อจำกัด อ้างตัวบท และมีเหตุผล
  hints:
  - การวิจารณ์ต้องมีทั้งดีและด้อยหรือไม่
  - มีตัวบทและเหตุผลรองรับหรือไม่
  solution: ข้อแรก **ชี้จุดเด่นจุดด้อยโดยอ้างตัวบทและเหตุผล**
