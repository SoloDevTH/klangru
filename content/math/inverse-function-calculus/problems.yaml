  - id: math.calculus.inverse-function-calculus.p018
    topics: [math.calculus.inverse-function-calculus]
    difficulty: 5
    type: numeric
    stem: "ปั๊มน้ำสูบน้ำจากคลองเข้าแปลงนาด้วยอัตรา $r(t)=\\frac{10}{1+t^2}$ ลิตรต่อนาที เมื่อ $t$ เป็นนาที จงหาปริมาณน้ำที่สูบเข้านาในหนึ่งนาทีแรก (หน่วยลิตร ตอบทศนิยม 3 ตำแหน่ง)"
    answer: { value: 7.854, tolerance: 0.001, unit: ลิตร }
    hints:
      - "ปริมาณน้ำคือปริพันธ์ของอัตราการไหลตั้งแต่ $t=0$ ถึง $t=1$"
      - "ดึงค่าคงที่ 10 ออกจากปริพันธ์ก่อน"
      - "ปริพันธ์ของ $\\frac{1}{1+t^2}$ คืออาร์กแทนเจนต์"
    misconceptions:
      - { match: 6.931, feedback: "6.931 คือ $10\\ln 2$ เกิดจากคิดว่า $\\int\\frac{dt}{1+t^2}=\\ln(1+t^2)$ แต่ตัวเศษไม่ใช่อนุพันธ์ของตัวส่วน ปริพันธ์นี้ได้อาร์กแทนเจนต์" }
    solution: "$\\int_0^1\\frac{10}{1+t^2}\\,dt=10\\left[\\arctan t\\right]_0^1=10\\cdot\\frac{\\pi}{4}=\\frac{5\\pi}{2}\\approx 7.854$ ลิตร"
    license: CC-BY-SA-4.0
    ai_assisted: true
