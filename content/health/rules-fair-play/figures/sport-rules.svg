<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="sans-serif">
<title>เปรียบเทียบกติกาพื้นฐานของกีฬายอดนิยม</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
<text x="380.0" y="30.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">กติกาพื้นฐานของกีฬายอดนิยม (การแข่งขันระดับสากล)</text>
<rect x="20.0" y="46.0" width="720.0" height="46.0" rx="0" fill="#1f4e9a" stroke="#1f4e9a" stroke-width="1.5" />
<text x="30.0" y="75.0" font-size="14" text-anchor="start" font-weight="bold" fill="#fff">กีฬา</text>
<text x="160.0" y="75.0" font-size="14" text-anchor="start" font-weight="bold" fill="#fff">ผู้เล่นฝ่ายละ</text>
<text x="255.0" y="75.0" font-size="14" text-anchor="start" font-weight="bold" fill="#fff">เวลาหรือการนับคะแนน</text>
<text x="525.0" y="75.0" font-size="14" text-anchor="start" font-weight="bold" fill="#fff">ข้อควรรู้</text>
<rect x="20.0" y="92.0" width="720.0" height="46.0" rx="0" fill="#f4f7fb" stroke="#c5cfdc" stroke-width="1" />
<text x="30.0" y="121.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">ฟุตบอล</text>
<text x="160.0" y="121.0" font-size="14" text-anchor="start" font-weight="normal" fill="#111">11 คน</text>
<text x="255.0" y="121.0" font-size="14" text-anchor="start" font-weight="normal" fill="#111">2 ครึ่ง ครึ่งละ 45 นาที</text>
<text x="525.0" y="121.0" font-size="14" text-anchor="start" font-weight="normal" fill="#111">ยิงประตูได้มากกว่าชนะ</text>
<rect x="20.0" y="138.0" width="720.0" height="46.0" rx="0" fill="#ffffff" stroke="#c5cfdc" stroke-width="1" />
<text x="30.0" y="167.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">ฟุตซอล</text>
<text x="160.0" y="167.0" font-size="14" text-anchor="start" font-weight="normal" fill="#111">5 คน</text>
<text x="255.0" y="167.0" font-size="14" text-anchor="start" font-weight="normal" fill="#111">2 ครึ่ง ครึ่งละ 20 นาที</text>
<text x="525.0" y="167.0" font-size="14" text-anchor="start" font-weight="normal" fill="#111">ยิงประตูได้มากกว่าชนะ</text>
<rect x="20.0" y="184.0" width="720.0" height="46.0" rx="0" fill="#f4f7fb" stroke="#c5cfdc" stroke-width="1" />
<text x="30.0" y="213.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">วอลเลย์บอล</text>
<text x="160.0" y="213.0" font-size="14" text-anchor="start" font-weight="normal" fill="#111">6 คน</text>
<text x="255.0" y="213.0" font-size="14" text-anchor="start" font-weight="normal" fill="#111">ชนะ 3 ใน 5 เซต เซตละ 25 คะแนน</text>
<text x="525.0" y="213.0" font-size="14" text-anchor="start" font-weight="normal" fill="#111">ต้องนำ 2 คะแนน เซต 5 เล่น 15</text>
<rect x="20.0" y="230.0" width="720.0" height="46.0" rx="0" fill="#ffffff" stroke="#c5cfdc" stroke-width="1" />
<text x="30.0" y="259.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">บาสเกตบอล</text>
<text x="160.0" y="259.0" font-size="14" text-anchor="start" font-weight="normal" fill="#111">5 คน</text>
<text x="255.0" y="259.0" font-size="14" text-anchor="start" font-weight="normal" fill="#111">ต้องยิงภายใน 24 วินาที (FIBA)</text>
<text x="525.0" y="259.0" font-size="14" text-anchor="start" font-weight="normal" fill="#111">ลูกยิง 2 หรือ 3 คะแนน ลูกโทษ 1</text>
<rect x="20.0" y="276.0" width="720.0" height="46.0" rx="0" fill="#f4f7fb" stroke="#c5cfdc" stroke-width="1" />
<text x="30.0" y="305.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">เซปักตะกร้อ</text>
<text x="160.0" y="305.0" font-size="14" text-anchor="start" font-weight="normal" fill="#111">3 คน</text>
<text x="255.0" y="305.0" font-size="14" text-anchor="start" font-weight="normal" fill="#111">ชนะ 2 ใน 3 เซต เซตละ 21 คะแนน</text>
<text x="525.0" y="305.0" font-size="14" text-anchor="start" font-weight="normal" fill="#111">ทีมละ 3 คน เรียกว่า เรกู</text>
<rect x="20.0" y="322.0" width="720.0" height="46.0" rx="0" fill="#ffffff" stroke="#c5cfdc" stroke-width="1" />
<text x="30.0" y="351.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">แบดมินตัน</text>
<text x="160.0" y="351.0" font-size="14" text-anchor="start" font-weight="normal" fill="#111">1 หรือ 2 คน</text>
<text x="255.0" y="351.0" font-size="14" text-anchor="start" font-weight="normal" fill="#111">ชนะ 2 ใน 3 เกม เกมละ 21 คะแนน</text>
<text x="525.0" y="351.0" font-size="14" text-anchor="start" font-weight="normal" fill="#111">ต้องนำ 2 คะแนน (สูงสุด 30)</text>
<line x1="150.0" y1="46.0" x2="150.0" y2="368.0" stroke="#c5cfdc" stroke-width="1"/>
<line x1="245.0" y1="46.0" x2="245.0" y2="368.0" stroke="#c5cfdc" stroke-width="1"/>
<line x1="515.0" y1="46.0" x2="515.0" y2="368.0" stroke="#c5cfdc" stroke-width="1"/>
<text x="20.0" y="404.0" font-size="13" text-anchor="start" font-weight="normal" fill="#333">กติกาของการแข่งขันในโรงเรียนหรือรุ่นอายุน้อยอาจปรับให้สั้นลงตามข้อตกลง</text>
</svg>
