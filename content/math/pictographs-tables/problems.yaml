  - id: math.stats.pictographs-tables.p019
    topics: [math.stats.pictographs-tables]
    difficulty: 5
    type: numeric
    stem: |
      ตารางสองทางของนักเรียนชั้น ป.5 ที่ชอบและไม่ชอบกินผัก มีบางช่องหายไป นักเรียนที่ชอบผักมากกว่านักเรียนที่ไม่ชอบผักกี่คน

      | | ชอบผัก | ไม่ชอบผัก | รวม |
      |---|---|---|---|
      | ชาย | ? | 9 | 25 |
      | หญิง | 18 | ? | ? |
      | รวม | ? | 15 | 49 |
    answer: { value: 19, unit: คน }
    hints:
      - "หาจำนวนที่ชอบผักทั้งหมดจากแถวรวม"
      - "ชอบผักทั้งหมด $= 49 - 15$ แล้วเทียบกับไม่ชอบผัก"
    misconceptions:
      - { match: 34, feedback: "34 คือจำนวนที่ชอบผักทั้งหมด โจทย์ถามว่ามากกว่าไม่ชอบผักกี่คน ต้องลบอีกขั้น" }
      - { match: 7, feedback: "เทียบแค่นักเรียนชาย (ชอบผัก 16 คน ไม่ชอบ 9 คน) ต้องใช้แถวรวมของนักเรียนทุกคน" }
    solution: "ชอบผักทั้งหมด $= 49 - 15 = 34$ คน ไม่ชอบผัก 15 คน มากกว่ากัน $34 - 15 = 19$ คน (ตรวจ: ชายชอบผัก $25 - 9 = 16$ คน หญิงชอบผัก 18 คน รวม $16 + 18 = 34$ คน)"
