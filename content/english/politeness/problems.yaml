problems:
  - id: english.culture.politeness.p001
    topics: [english.culture.politeness]
    difficulty: 1
    type: mcq
    stem: "พนักงานร้านยื่นถุงขนมให้ ควรพูดว่าอะไร"
    choices:
      - { id: a, text: "Thank you.", correct: true, feedback: "ถูก ได้รับของแม้เรื่องเล็กก็ขอบคุณ" }
      - { id: b, text: "Sorry.", feedback: "Sorry ใช้ขอโทษ" }
      - { id: c, text: "Excuse me.", feedback: "Excuse me ใช้ขอทางหรือเรียกความสนใจ" }
      - { id: d, text: "Please.", feedback: "Please ใช้ตอนขอ ไม่ใช่ตอนได้รับ" }
    hints:
      - "ได้รับของจากคนอื่น"
      - "คำที่แปลว่า ขอบคุณ"
    solution: "***Thank you.*** (หรือ *Thanks.*)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.politeness.p002
    topics: [english.culture.politeness]
    difficulty: 1
    type: match
    stem: "จับคู่สถานการณ์กับคำพูดที่เหมาะสม"
    pairs:
      - { left: "อยากเดินผ่านคนที่ยืนขวางทาง", right: "Excuse me." }
      - { left: "มีคนขอบคุณเรา", right: "You're welcome." }
      - { left: "ฟังไม่ทันว่าอีกฝ่ายพูดอะไร", right: "Sorry? Could you say that again?" }
      - { left: "ได้รับของขวัญวันเกิด", right: "Thank you so much!" }
    hints:
      - "Excuse me ใช้ขอทาง You're welcome ใช้ตอบคำขอบคุณ"
      - "Sorry? ที่เสียงขึ้นท้ายใช้ขอให้พูดซ้ำ"
    solution: "ขอทาง → Excuse me. · ตอบคำขอบคุณ → You're welcome. · ฟังไม่ทัน → Sorry? Could you say that again? · ได้ของขวัญ → Thank you so much!"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.politeness.p003
    topics: [english.culture.politeness]
    difficulty: 1
    type: mcq
    stem: "ทำโจทย์ไม่ได้ อยากขอให้ครูช่วย ข้อใดสุภาพที่สุด"
    choices:
      - { id: a, text: "Excuse me, could you help me, please?", correct: true, feedback: "ถูก มี Excuse me, could และ please" }
      - { id: b, text: "Help me.", feedback: "เป็นคำสั่ง ฟังห้วนกับครู" }
      - { id: c, text: "Hey! Help me!", feedback: "Hey! ไม่สุภาพกับครู และเป็นคำสั่ง" }
      - { id: d, text: "You help me now.", feedback: "ฟังเหมือนสั่งให้ทำทันที" }
    hints:
      - "คำขอร้องที่สุภาพไม่ใช่คำสั่ง"
      - "หา could และ please"
    solution: "***Excuse me, could you help me, please?***"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.politeness.p004
    topics: [english.culture.politeness]
    difficulty: 2
    type: order
    stem: "เรียงคำขอร้องจากห้วนที่สุดไปสุภาพที่สุด"
    items:
      - "Open the door."
      - "Open the door, please."
      - "Could you open the door, please?"
      - "Would you mind opening the door?"
    hints:
      - "คำสั่งไม่มี please ห้วนที่สุด"
      - "รูปคำถามสุภาพกว่าคำสั่ง Would you mind ...? สุภาพมาก"
    solution: "Open the door. → Open the door, please. → Could you open the door, please? → Would you mind opening the door?"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.politeness.p005
    topics: [english.culture.politeness]
    difficulty: 2
    type: text
    stem: "เติมกริยา close ในรูปที่ถูก: *Would you mind ___ the door?*"
    accepted: ["closing"]
    misconceptions:
      - { match: "close", feedback: "หลัง Would you mind ใช้กริยาเติม -ing: closing" }
      - { match: "to close", feedback: "หลัง mind ใช้ -ing ไม่ใช้ to + กริยา" }
      - { match: "closeing", feedback: "close ลงท้าย e ตัด e ก่อนเติม -ing: closing" }
    hints:
      - "mind ตามด้วยกริยา -ing"
      - "กริยาที่ลงท้ายด้วย e ตัด e ก่อนเติม -ing"
    solution: "*Would you mind **closing** the door?*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.politeness.p006
    topics: [english.culture.politeness]
    difficulty: 2
    type: mcq
    stem: "ที่ซิดนีย์ เราพูดกับคนขับรถเมล์ว่า *Thanks!* คำตอบใดที่คนออสเตรเลียนิยมพูด"
    choices:
      - { id: a, text: "No worries.", correct: true, feedback: "ถูก สำนวนตอบคำขอบคุณที่นิยมมากในออสเตรเลียและนิวซีแลนด์" }
      - { id: b, text: "Never mind.", feedback: "Never mind ใช้บอกให้ลืมเรื่องที่ไม่สำคัญ ไม่ใช้ตอบคำขอบคุณ" }
      - { id: c, text: "Bless you.", feedback: "Bless you ใช้เมื่อมีคนจาม" }
      - { id: d, text: "Excuse me.", feedback: "Excuse me ใช้ขอทางหรือเรียกความสนใจ" }
    hints:
      - "เป็นสำนวนตอบคำขอบคุณแบบเป็นกันเอง"
      - "แปลตรงตัวว่า ไม่ต้องกังวล"
    solution: "***No worries.*** (ความหมายเดียวกับ *You're welcome.* / *No problem.*)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.politeness.p007
    topics: [english.culture.politeness]
    difficulty: 2
    type: mcq
    stem: "อ่านอีเมลที่พลอยเขียนถึงครู บรรทัดใดไม่สุภาพและไม่เหมาะกับการเขียนถึงครู"
    figure: { src: email-quiz.svg, alt: "อีเมล To: Ms Taylor, Subject: Question about the homework มีหกบรรทัดกำกับหมายเลข 1 Dear Ms Taylor, 2 I hope you are well. 3 Could you explain question 5 of the homework, please? 4 Gimme the answer by tomorrow, OK? 5 Thank you very much. 6 Best regards, Ploy" }
    choices:
      - { id: a, text: "บรรทัด 4", correct: true, feedback: "ถูก Gimme เป็นภาษาพูดแบบเป็นกันเองมาก และเป็นคำสั่งที่เร่งครู" }
      - { id: b, text: "บรรทัด 1", feedback: "Dear Ms Taylor, เป็นคำขึ้นต้นที่สุภาพ" }
      - { id: c, text: "บรรทัด 3", feedback: "Could you ..., please? เป็นคำขอร้องที่สุภาพ" }
      - { id: d, text: "บรรทัด 6", feedback: "Best regards เป็นคำลงท้ายที่สุภาพ" }
    hints:
      - "หาคำที่เป็นภาษาแชตหรือคำสั่ง"
      - "Gimme = Give me"
    solution: "**บรรทัด 4** *Gimme the answer by tomorrow, OK?* เป็นคำสั่ง ใช้ภาษาแชต และขอคำตอบการบ้าน ควรตัดออกหรือเขียนใหม่อย่างสุภาพ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.politeness.p008
    topics: [english.culture.politeness]
    difficulty: 3
    type: mcq
    stem: "พลอยอยากให้ครูตอบอีเมลภายในวันศุกร์ ประโยคใดเหมาะที่สุดที่จะเขียนแทนบรรทัด 4"
    figure: { src: email-quiz.svg, alt: "อีเมล To: Ms Taylor, Subject: Question about the homework มีหกบรรทัดกำกับหมายเลข 1 Dear Ms Taylor, 2 I hope you are well. 3 Could you explain question 5 of the homework, please? 4 Gimme the answer by tomorrow, OK? 5 Thank you very much. 6 Best regards, Ploy" }
    choices:
      - { id: a, text: "Could you reply by Friday, if possible?", correct: true, feedback: "ถูก เป็นคำขอร้องและมี if possible ทำให้นุ่มนวล" }
      - { id: b, text: "Reply by Friday.", feedback: "เป็นคำสั่ง ฟังห้วนกับครู" }
      - { id: c, text: "You must reply by Friday.", feedback: "must ฟังเหมือนบังคับครู" }
      - { id: d, text: "Gimme a reply by Friday, OK?", feedback: "ยังใช้ภาษาแชตและเป็นคำสั่ง" }
    hints:
      - "เปลี่ยนคำสั่งเป็นคำถามขอร้อง"
      - "if possible = ถ้าเป็นไปได้"
    solution: "***Could you reply by Friday, if possible?***"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.politeness.p009
    topics: [english.culture.politeness]
    difficulty: 3
    type: match
    stem: "จับคู่คำไม่เป็นทางการ (ซ้าย) กับคำทางการที่มีความหมายเดียวกัน (ขวา)"
    pairs:
      - { left: "Thanks!", right: "Thank you very much." }
      - { left: "Hi Tom,", right: "Dear Mr Brown," }
      - { left: "Bye!", right: "Goodbye." }
      - { left: "Yeah.", right: "Yes." }
    hints:
      - "คำทางการมักยาวและครบกว่า"
      - "Hi + ชื่อต้น ใช้กับเพื่อน Dear + คำนำหน้า + นามสกุล ใช้ในอีเมลทางการ"
    solution: "Thanks! → Thank you very much. · Hi Tom, → Dear Mr Brown, · Bye! → Goodbye. · Yeah. → Yes."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.politeness.p010
    topics: [english.culture.politeness]
    difficulty: 3
    type: mcq
    stem: "นักเรียนไทยไปพักกับครอบครัวอุปถัมภ์ในอังกฤษ พบพ่อของครอบครัวครั้งแรกที่สนามบิน ข้อใดเหมาะที่สุด"
    choices:
      - { id: a, text: "ยิ้ม สบตา จับมือสั้น ๆ และพูดว่า Nice to meet you.", correct: true, feedback: "ถูก เป็นการทักทายครั้งแรกที่สุภาพตามธรรมเนียมทั่วไป" }
      - { id: b, text: "ก้มหน้าไม่สบตาและไม่พูดอะไร เพื่อแสดงความเคารพ", feedback: "ในวัฒนธรรมไทยอาจเป็นการให้เกียรติ แต่สำหรับเจ้าของภาษาอาจดูเหมือนไม่เป็นมิตรหรือไม่สนใจ" }
      - { id: c, text: "กอดแน่นแล้วถามว่า How old are you?", feedback: "กอดคนที่เพิ่งเจอครั้งแรกอาจทำให้อึดอัด และอายุเป็นคำถามส่วนตัว" }
      - { id: d, text: "ตบไหล่แล้วพูดว่า Hey, man!", feedback: "เป็นกันเองเกินไปกับผู้ใหญ่ที่เพิ่งพบ" }
    hints:
      - "พบผู้ใหญ่ครั้งแรก ควรสุภาพแต่เป็นมิตร"
      - "นึกถึงท่าทางที่เรียนในบทเรียน: จับมือ ยิ้ม สบตา"
    solution: "**ยิ้ม สบตา จับมือสั้น ๆ และพูดว่า *Nice to meet you.*** ถ้าไหว้ด้วยก็ไม่ผิด แต่ควรยื่นมือจับเมื่ออีกฝ่ายยื่นมือมา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.politeness.p011
    topics: [english.culture.politeness]
    difficulty: 3
    type: mcq
    stem: "ครูชาวอังกฤษคนใหม่เพิ่งมาสอนที่โรงเรียนในขอนแก่น คำถามใดอาจเป็นเรื่องส่วนตัวเกินไปสำหรับการพบกันครั้งแรก"
    choices:
      - { id: a, text: "How much money do you earn?", correct: true, feedback: "ถูก เงินเดือนมักถือเป็นเรื่องส่วนตัวกับคนที่ยังไม่สนิท" }
      - { id: b, text: "Where are you from in England?", feedback: "ถามบ้านเกิดเป็นคำถามทั่วไปที่สุภาพ" }
      - { id: c, text: "Do you like Thai food?", feedback: "เป็นคำถามทั่วไปที่ช่วยเริ่มบทสนทนา" }
      - { id: d, text: "Is this your first time in Khon Kaen?", feedback: "เป็นคำถามทั่วไปที่เป็นมิตร" }
    hints:
      - "เรื่องใดที่หลายคนไม่อยากบอกคนที่เพิ่งรู้จัก"
      - "อายุ น้ำหนัก เงินเดือน ศาสนา"
    solution: "***How much money do you earn?*** เงินเดือนมักเป็นเรื่องส่วนตัว คำถามอื่นเป็นคำถามทั่วไปที่ช่วยทำความรู้จัก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.politeness.p012
    topics: [english.culture.politeness]
    difficulty: 2
    type: text
    stem: "เพื่อนชาวอเมริกันจามในห้องเรียน เราพูดว่าอะไร (สองคำ)"
    accepted: ["Bless you", "Bless you!", "Bless you.", "God bless you", "God bless you!", "God bless you."]
    misconceptions:
      - { match: "Excuse me", feedback: "Excuse me คนที่จามเป็นคนพูดเอง เราพูดว่า Bless you!" }
      - { match: "Sorry", feedback: "เราไม่ได้ทำผิด คำที่พูดเมื่อคนอื่นจามคือ Bless you!" }
      - { match: "Thank you", feedback: "Thank you เป็นคำที่คนจามใช้ตอบเรา" }
    hints:
      - "คำอวยพรสั้น ๆ เมื่อมีคนจาม"
      - "ขึ้นต้นด้วย B คำที่สองคือ you"
    solution: "***Bless you!*** เพื่อนตอบ *Thank you.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.politeness.p013
    topics: [english.culture.politeness]
    difficulty: 4
    type: mcq
    stem: "ที่ป้ายรถเมล์ในลอนดอน มีคนยืนเรียงแถวรอรถอยู่ห้าคน เราเพิ่งมาถึง ควรทำอย่างไร"
    choices:
      - { id: a, text: "ไปต่อท้ายแถว", correct: true, feedback: "ถูก การเข้าแถว (queue) เป็นมารยาทสำคัญในสหราชอาณาจักร" }
      - { id: b, text: "ไปยืนใกล้ประตูรถเพื่อขึ้นก่อน", feedback: "เป็นการแซงคิว (queue-jumping) ซึ่งถือว่าเสียมารยาทมาก" }
      - { id: c, text: "ถามคนหัวแถวว่าขอแทรกได้ไหมเพราะรีบ", feedback: "ทำได้เฉพาะเหตุจำเป็นจริง ๆ โดยทั่วไปควรต่อท้ายแถว" }
      - { id: d, text: "ยืนห่าง ๆ แล้ววิ่งขึ้นรถเมื่อรถมา", feedback: "เป็นการแซงคิว ไม่สุภาพ" }
    hints:
      - "queue = แถว"
      - "คนที่มาก่อนได้ขึ้นก่อน"
    solution: "**ไปต่อท้ายแถว** (*join the end of the queue*) ถ้าไม่แน่ใจว่าแถวไหน ถาม *Excuse me, is this the queue for the bus?*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.politeness.p014
    topics: [english.culture.politeness]
    difficulty: 4
    type: mcq
    stem: "น้องชายทำโทรศัพท์ของ Sarah ตกจนจอแตก Sarah พูดว่า *Oh, thanks a lot.* ด้วยน้ำเสียงเรียบและหน้าบึ้ง Sarah หมายความว่าอะไร"
    choices:
      - { id: a, text: "เธอโกรธหรือไม่พอใจ และพูดประชด", correct: true, feedback: "ถูก น้ำเสียงและสีหน้าทำให้คำขอบคุณกลายเป็นการประชด" }
      - { id: b, text: "เธอขอบคุณน้องชายจริง ๆ", feedback: "สถานการณ์และน้ำเสียงไม่ใช่การขอบคุณจริง" }
      - { id: c, text: "เธอขอโทษน้องชาย", feedback: "thanks ไม่ได้แปลว่าขอโทษ และ Sarah ไม่ได้ทำผิด" }
      - { id: d, text: "เธอขอให้น้องชายช่วย", feedback: "ไม่มีคำขอร้องในประโยคนี้" }
    hints:
      - "ดูสถานการณ์: น้องทำของเสียหาย"
      - "น้ำเสียงเรียบ หน้าบึ้ง กับคำขอบคุณ ขัดกันหรือไม่"
    solution: "**เธอไม่พอใจและพูดประชด** คำเดียวกันมีความหมายต่างกันตามน้ำเสียงและสถานการณ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.politeness.p015
    topics: [english.culture.politeness]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "ในโรงเรียนของสหราชอาณาจักร นักเรียนเรียกครูแบบใดได้ตามธรรมเนียมทั่วไป (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "Miss (ครูผู้หญิง)", correct: true, feedback: "ถูก นักเรียนอังกฤษเรียกครูผู้หญิงว่า Miss กันทั่วไป" }
      - { id: b, text: "Sir (ครูผู้ชาย)", correct: true, feedback: "ถูก นักเรียนอังกฤษเรียกครูผู้ชายว่า Sir" }
      - { id: c, text: "Mr Brown", correct: true, feedback: "ถูก Mr + นามสกุล" }
      - { id: d, text: "Teacher!", feedback: "คนไทยเรียกว่า ครู ได้ แต่ในอังกฤษไม่นิยมเรียก Teacher" }
      - { id: e, text: "Brown!", feedback: "เรียกนามสกุลเฉย ๆ ไม่สุภาพ" }
    hints:
      - "มีคำตอบถูกสามข้อ"
      - "ครูมักถูกเรียกด้วยคำนำหน้า หรือคำนำหน้า + นามสกุล"
    solution: "**Miss**, **Sir** และ **Mr Brown** (Mr/Mrs/Ms + นามสกุล)"
