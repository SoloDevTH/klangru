<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" font-family="sans-serif" font-size="14">
<title>ฉลากโภชนาการสมมติของขนมปังกรอบ ใช้ฝึกอ่าน</title>
<rect x="1" y="1" width="358" height="468" fill="#ffffff" stroke="#111" stroke-width="2"/>
<text x="180.0" y="28" text-anchor="middle" font-size="20" font-weight="bold">ข้อมูลโภชนาการ</text>
<text x="12" y="54" >หนึ่งหน่วยบริโภค: ครึ่งซอง (30 ก.)</text>
<text x="12" y="74" >จำนวนหน่วยบริโภคต่อซอง: 2</text>
<line x1="10" y1="84" x2="350" y2="84" stroke="#111" stroke-width="4"/>
<text x="12" y="104" font-weight="bold">คุณค่าทางโภชนาการต่อหนึ่งหน่วยบริโภค</text>
<text x="12" y="126" font-weight="bold">พลังงานทั้งหมด 150 กิโลแคลอรี</text>
<text x="12" y="146" font-size="13">(พลังงานจากไขมัน 60 กิโลแคลอรี)</text>
<line x1="10" y1="156" x2="350" y2="156" stroke="#111" stroke-width="2"/>
<text x="348" y="174" text-anchor="end" font-size="12">ร้อยละของปริมาณที่แนะนำต่อวัน*</text>
<line x1="10" y1="182" x2="350" y2="182" stroke="#111" stroke-width="1"/>
<text x="12" y="202" font-weight="bold" xml:space="preserve">ไขมันทั้งหมด 7 ก.</text>
<text x="346" y="202" text-anchor="end" font-weight="bold">11%</text>
<line x1="10" y1="208" x2="350" y2="208" stroke="#111" stroke-width="1"/>
<text x="12" y="228" font-weight="normal" xml:space="preserve">   ไขมันอิ่มตัว 3 ก.</text>
<line x1="10" y1="234" x2="350" y2="234" stroke="#111" stroke-width="1"/>
<text x="12" y="254" font-weight="bold" xml:space="preserve">โปรตีน 3 ก.</text>
<line x1="10" y1="260" x2="350" y2="260" stroke="#111" stroke-width="1"/>
<text x="12" y="280" font-weight="bold" xml:space="preserve">คาร์โบไฮเดรตทั้งหมด 19 ก.</text>
<text x="346" y="280" text-anchor="end" font-weight="bold">6%</text>
<line x1="10" y1="286" x2="350" y2="286" stroke="#111" stroke-width="1"/>
<text x="12" y="306" font-weight="normal" xml:space="preserve">   ใยอาหาร 1 ก.</text>
<text x="346" y="306" text-anchor="end" font-weight="bold">4%</text>
<line x1="10" y1="312" x2="350" y2="312" stroke="#111" stroke-width="1"/>
<text x="12" y="332" font-weight="normal" xml:space="preserve">   น้ำตาล 6 ก.</text>
<line x1="10" y1="338" x2="350" y2="338" stroke="#111" stroke-width="1"/>
<text x="12" y="358" font-weight="bold" xml:space="preserve">โซเดียม 160 มก.</text>
<text x="346" y="358" text-anchor="end" font-weight="bold">8%</text>
<line x1="10" y1="364" x2="350" y2="364" stroke="#111" stroke-width="4"/>
<text x="12" y="382" font-size="12">*ร้อยละของปริมาณที่แนะนำต่อวัน คิดจากพลังงาน</text>
<text x="12" y="399" font-size="12">วันละ 2,000 กิโลแคลอรี ค่าอ้างอิงในฉลากฝึกนี้:</text>
<text x="12" y="416" font-size="12">ไขมัน 65 ก. คาร์โบไฮเดรต 300 ก. ใยอาหาร 25 ก.</text>
<text x="12" y="433" font-size="12">โซเดียม 2,000 มก.</text>
<text x="180.0" y="454" text-anchor="middle" font-size="12" fill="#555">(ฉลากสมมติสำหรับฝึกอ่าน ไม่ใช่สินค้าจริง)</text>
</svg>
