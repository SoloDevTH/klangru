id: biology.ecology.populations
subject: biology
title: { th: ประชากร, en: "Populations" }
summary: ความหนาแน่น การกระจาย โครงสร้างอายุ และอัตราการรอดชีวิตของประชากร การสำรวจด้วยแปลงสุ่มตัวอย่างและการจับซ้ำ การเพิ่มแบบเอ็กซ์โพเนนเชียลและลอจิสติก และปัจจัยควบคุมการเติบโต
difficulty: 6
minutes: 45
prerequisites: [biology.ecology.ecosystems, math.functions.exponential]
encompasses:
  - { id: biology.ecology.ecosystems, weight: 0.2 }
  - { id: math.functions.exponential, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: โครงสร้างอายุของประชากร 3 แบบ
    src: age-structure.svg
    alt: "พีระมิดอายุ 3 รูป แต่ละรูปมี 8 ชั้น ชั้นล่างสุดคือวัยเด็ก ชั้นบนสุดคือวัยสูงอายุ ด้านซ้ายสีน้ำเงินคือชาย ด้านขวาสีชมพูคือหญิง ประชากร ก ฐานกว้างที่สุดแล้วแคบลงเรื่อย ๆ จนยอดแหลม ร้อยละของแต่ละชั้นจากล่างขึ้นบนคือ 30, 26, 22, 18, 14, 10, 6, 3 ประชากร ข ชั้นล่าง ๆ กว้างใกล้เคียงกันแล้วแคบลงเฉพาะช่วงบน ค่าคือ 16, 16, 15, 15, 14, 13, 10, 6 ประชากร ค ฐานแคบกว่าส่วนกลาง กว้างที่สุดตรงกลาง ค่าคือ 10, 12, 14, 16, 17, 16, 14, 10 ข้อมูลสมมติ"
    caption: "รูปร่างของพีระมิดอายุบอกแนวโน้มของประชากร (ข้อมูลสมมติ วาดโดยทีมคลังรู้)"
  - type: figure
    title: เส้นโค้งการรอดชีวิต 3 แบบ
    src: survivorship.svg
    alt: "กราฟแกนนอนคืออายุเป็นร้อยละของอายุขัยสูงสุด 0 ถึง 100 แกนตั้งคือจำนวนที่รอดจาก 1,000 ตัวในสเกลลอการิทึม แบบที่ 1 สีแดงคงที่ใกล้ 1,000 ตลอดช่วงต้นและกลาง แล้วลดลงอย่างรวดเร็วเมื่อใกล้อายุขัยสูงสุด แบบที่ 2 สีเขียวเป็นเส้นตรงลาดลงสม่ำเสมอบนสเกลลอการิทึม แปลว่าตายในอัตราคงที่ทุกช่วงอายุ แบบที่ 3 สีน้ำเงินลดลงอย่างรวดเร็วตั้งแต่อายุน้อย เหลือราว 10 ตัวเมื่อถึงร้อยละ 15 ของอายุขัย แล้วค่อย ๆ ลดลงช้า ๆ"
    caption: "แบบที่ 1 ตายมากตอนแก่ แบบที่ 3 ตายมากตอนเล็ก (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ประมาณจำนวนปลาในบ่อด้วยการจับซ้ำ
    problem: "นักเรียนจับปลานิลในบ่อของโรงเรียนได้ 60 ตัว ตัดปลายครีบเล็กน้อยเป็นเครื่องหมายแล้วปล่อยคืน หนึ่งสัปดาห์ต่อมาจับได้ 50 ตัว มีเครื่องหมาย 12 ตัว บ่อนี้มีปลานิลประมาณกี่ตัว"
    steps:
      - text: "M = 60 (ทำเครื่องหมายครั้งแรก) C = 50 (จับครั้งที่สอง) R = 12 (มีเครื่องหมายในครั้งที่สอง)"
      - text: "สัดส่วนที่มีเครื่องหมายในครั้งที่สองควรเท่ากับสัดส่วนในบ่อ $\\frac{R}{C} = \\frac{M}{N}$"
        why: "ถ้าปลาที่มีเครื่องหมายกระจายปนกับปลาอื่นทั่วบ่อ การจับครั้งที่สองเป็นตัวอย่างสุ่มของทั้งบ่อ"
      - text: "$N = \\frac{M \\times C}{R} = \\frac{60 \\times 50}{12} = 250$ ตัว"
      - text: "ตรวจความสมเหตุสมผล ครั้งที่สองมีเครื่องหมาย $\\frac{12}{50} = 24\\%$ และ 60 ตัวเป็น 24% ของ 250 ตัวพอดี"
    answer: "ประมาณ 250 ตัว"
  - { type: check, problem: biology.ecology.populations.p005, prompt: "N = M × C ÷ R" }
  - type: figure
    title: การเพิ่มแบบเอ็กซ์โพเนนเชียลและแบบลอจิสติก
    src: growth-curves.svg
    alt: "กราฟจำนวนประชากรกับเวลา 0 ถึง 20 สัปดาห์ เริ่มที่ 20 ตัว อัตรา r เท่ากับ 0.5 ต่อสัปดาห์ (ข้อมูลสมมติ) เส้นสีแดงคือแบบเอ็กซ์โพเนนเชียลรูปตัว J เพิ่มเร็วขึ้นเรื่อย ๆ ผ่าน 1,000 ตัวราวสัปดาห์ที่ 8 และพุ่งเกินกราฟ เส้นสีน้ำเงินคือแบบลอจิสติกรูปตัว S เพิ่มช้าตอนแรก ชันที่สุดเมื่อประชากรราว 500 ตัวหรือ K/2 ราวสัปดาห์ที่ 8 แล้วค่อย ๆ ราบลงเข้าใกล้เส้นประ K เท่ากับ 1,000 ตัวซึ่งเป็นความสามารถในการรองรับ"
    caption: "ทรัพยากรที่จำกัดทำให้กราฟรูปตัว J กลายเป็นรูปตัว S (วาดโดยทีมคลังรู้)"
  - type: interactive
    title: ลองเปลี่ยน K และ r ในการเพิ่มแบบลอจิสติก
    caption: "เส้นแรกคือแบบลอจิสติก เส้นที่สองคือแบบเอ็กซ์โพเนนเชียลที่เริ่มจากค่าเดียวกัน สังเกตว่าสองเส้นซ้อนกันตอนต้น และเส้นลอจิสติกราบลงที่ K เสมอ ส่วน r เปลี่ยนเพียงความเร็วที่เข้าใกล้ K"
    widget:
      kind: function-plot
      functions: ["\\frac{K}{1+\\left(\\frac{K}{a}-1\\right)\\cdot e^{-r\\cdot x}}", "a\\cdot e^{r\\cdot x}"]
      sliders:
        - { name: K, min: 200, max: 1800, step: 100, value: 1000, label: ความสามารถในการรองรับ }
        - { name: r, min: 0.1, max: 1.5, step: 0.1, value: 0.5, label: อัตราการเพิ่มต่อหัว }
        - { name: a, min: 10, max: 200, step: 10, value: 20, label: จำนวนเริ่มต้น }
      x: [0, 20]
      y: [0, 2000]
  - type: worked-example
    title: อัตราการเพิ่มของประชากรแบบลอจิสติก
    problem: "ประชากรมี r = 0.5 ต่อสัปดาห์ และ K = 1,000 ตัว จงหาอัตราการเพิ่ม (ตัวต่อสัปดาห์) เมื่อ N = 500 และเมื่อ N = 900"
    steps:
      - text: "ใช้ $\\frac{dN}{dt} = rN\\left(\\frac{K - N}{K}\\right)$"
      - text: "N = 500: $0.5 \\times 500 \\times \\frac{500}{1{,}000} = 125$ ตัวต่อสัปดาห์"
      - text: "N = 900: $0.5 \\times 900 \\times \\frac{100}{1{,}000} = 45$ ตัวต่อสัปดาห์"
        why: "แม้ N มากขึ้น แต่ที่ว่างเหลือ $(K - N)$ น้อยลงมาก การแข่งขันจึงทำให้การเพิ่มช้าลง"
      - text: "อัตราสูงสุดที่ N = K/2 = 500 ตรงกับช่วงที่กราฟรูปตัว S ชันที่สุด"
    answer: "125 ตัวต่อสัปดาห์ที่ N = 500 และ 45 ตัวต่อสัปดาห์ที่ N = 900"
  - { type: check, problem: biology.ecology.populations.p009, prompt: "แทนค่าในสูตรลอจิสติก" }
glossary:
  - { term: ประชากร, definition: "สิ่งมีชีวิตชนิดเดียวกันที่อยู่ในพื้นที่เดียวกันในเวลาเดียวกัน" }
  - { term: ความหนาแน่นของประชากร, definition: "จำนวนสิ่งมีชีวิตต่อหน่วยพื้นที่หรือปริมาตร" }
  - { term: โครงสร้างอายุ, definition: "สัดส่วนของประชากรในแต่ละช่วงอายุ แสดงเป็นพีระมิดอายุ" }
  - { term: ความสามารถในการรองรับ (K), definition: "ขนาดประชากรสูงสุดที่สภาพแวดล้อมหนึ่งรองรับได้อย่างยั่งยืน" }
  - { term: การเพิ่มแบบเอ็กซ์โพเนนเชียล, definition: "การเพิ่มเมื่อทรัพยากรไม่จำกัด อัตราเพิ่มแปรผันตามขนาดประชากร กราฟรูปตัว J" }
  - { term: การเพิ่มแบบลอจิสติก, definition: "การเพิ่มที่ช้าลงเมื่อเข้าใกล้ K กราฟรูปตัว S" }
  - { term: ปัจจัยที่ขึ้นกับความหนาแน่น, definition: "ปัจจัยที่มีผลรุนแรงขึ้นเมื่อประชากรหนาแน่น เช่น การแข่งขัน โรค การถูกล่า" }
flashcards:
  - { front: "สูตรจับ ทำเครื่องหมาย และจับซ้ำ", back: "N = M × C ÷ R" }
  - { front: "ประชากรแบบลอจิสติกเพิ่มเร็วที่สุดเมื่อใด", back: "เมื่อ N = K/2" }
  - { front: "การกระจายแบบใดพบบ่อยที่สุด", back: "แบบกลุ่ม เพราะทรัพยากรและการอยู่รวมกันเป็นกลุ่ม" }
  - { front: "เส้นโค้งการรอดชีวิตแบบที่ 3", back: "ตายมากตอนเล็ก เช่น ปลาและหอยที่วางไข่จำนวนมาก" }
  - { front: "ตัวอย่างปัจจัยที่ไม่ขึ้นกับความหนาแน่น", back: "น้ำท่วม ภัยแล้ง ไฟป่า อากาศหนาวจัด" }
