problems:
  - id: math.dec.p001
    topics: [math.number.decimals]
    difficulty: 1
    type: numeric
    stem: "หาค่า $3.5 + 1.25$"
    answer: { value: 4.75, tolerance: 0.01 }
    hints:
      - "ตั้งจุดทศนิยมให้ตรงกันก่อน"
      - "เขียน 3.5 เป็น 3.50 ให้มีทศนิยมสองตำแหน่งเท่ากัน แล้วบวกทีละหลัก"
    misconceptions:
      - { match: 1.6, feedback: "ดูเหมือนตั้งเลขชิดขวา ($35 + 125 = 160$) ต้องตั้งจุดทศนิยมให้ตรงกัน หลักส่วนสิบบวกกับหลักส่วนสิบ" }
      - { match: 4.3, feedback: "ดูเหมือนบวกส่วนหลังจุดเป็นจำนวนเต็ม ($5 + 25 = 30$) แต่ 0.5 คือ 50 ส่วนร้อย ไม่ใช่ 5 ส่วนร้อย" }
    solution: "$3.50 + 1.25 = 4.75$ (ส่วนร้อย $0 + 5 = 5$, ส่วนสิบ $5 + 2 = 7$, หน่วย $3 + 1 = 4$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.dec.p002
    topics: [math.number.decimals]
    difficulty: 1
    type: mcq
    stem: "จำนวนใดมีค่ามากที่สุด"
    choices:
      - { id: a, text: "0.7", correct: true }
      - { id: b, text: "0.68", feedback: "ดูเหมือนเทียบ 68 กับ 7 เป็นจำนวนเต็ม ให้เทียบหลักส่วนสิบก่อน: 6 น้อยกว่า 7" }
      - { id: c, text: "0.659", feedback: "ทศนิยมที่มีหลายหลักไม่ได้มีค่ามากกว่าเสมอ หลักส่วนสิบของ 0.659 คือ 6 ซึ่งน้อยกว่า 7" }
      - { id: d, text: "0.07", feedback: "0.07 คือ 7 ส่วนร้อย ซึ่งน้อยกว่า 0.7 ที่เป็น 7 ส่วนสิบ ถึง 10 เท่า" }
    hints:
      - "เติม 0 ให้ทุกจำนวนมีทศนิยมสามตำแหน่ง"
      - "เทียบหลักส่วนสิบก่อน"
    solution: "เติม 0: 0.700, 0.680, 0.659, 0.070 หลักส่วนสิบคือ 7, 6, 6, 0 มากที่สุดคือ 0.7"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.dec.p003
    topics: [math.number.decimals]
    difficulty: 2
    type: numeric
    stem: "ซื้อขนมในร้านสะดวกซื้อราคา 37.75 บาท จ่ายด้วยธนบัตร 100 บาท จะได้เงินทอนกี่บาท"
    answer: { value: 62.25, unit: บาท, tolerance: 0.01 }
    hints:
      - "เขียน 100 เป็น 100.00 แล้วตั้งจุดให้ตรงกัน"
      - "ลบทีละหลักจากขวาไปซ้าย อย่าลืมการยืม"
    misconceptions:
      - { match: 63.75, feedback: "ดูเหมือนลบเฉพาะส่วนจำนวนเต็ม ($100 - 37 = 63$) แล้วนำ .75 มาต่อท้าย ต้องลบ 0.75 ด้วย ซึ่งต้องยืมจากหลักหน่วย" }
    solution: "$100.00 - 37.75 = 62.25$ บาท ตรวจ: $62.25 + 37.75 = 100.00$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.dec.p004
    topics: [math.number.decimals]
    difficulty: 2
    type: numeric
    stem: "หาค่า $0.3 \\times 0.2$"
    answer: { value: 0.06, tolerance: 0.0005 }
    hints:
      - "คูณ $3 \\times 2$ ก่อนโดยยังไม่สนจุด"
      - "นับตำแหน่งทศนิยมของตัวตั้งและตัวคูณรวมกัน แล้วใส่จุดในผลคูณให้มีทศนิยมเท่านั้น"
    misconceptions:
      - { match: 0.6, feedback: "ดูเหมือนนับทศนิยมแค่ 1 ตำแหน่ง ตัวตั้งมี 1 ตำแหน่งและตัวคูณมี 1 ตำแหน่ง รวมเป็น 2 ตำแหน่ง" }
      - { match: 6, feedback: "ลืมใส่จุดทศนิยม ผลคูณของจำนวนที่น้อยกว่า 1 สองจำนวนต้องน้อยกว่า 1" }
    solution: "$3 \\times 2 = 6$ ทศนิยมรวม $1 + 1 = 2$ ตำแหน่ง ได้ $0.06$ ตรวจด้วยเศษส่วน: $\\tfrac{3}{10} \\times \\tfrac{2}{10} = \\tfrac{6}{100}$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.dec.p005
    topics: [math.number.decimals]
    difficulty: 3
    type: numeric
    stem: "หาค่า $7.2 \\div 0.3$"
    answer: { value: 24 }
    hints:
      - "ทำตัวหารให้เป็นจำนวนเต็มก่อน"
      - "คูณทั้งตัวตั้งและตัวหารด้วย 10 แล้วหารตามปกติ"
    misconceptions:
      - { match: 2.4, feedback: "ดูเหมือนเลื่อนจุดเฉพาะตัวหาร ($7.2 \\div 3$) ต้องคูณ 10 ทั้งตัวตั้งและตัวหาร จึงเป็น $72 \\div 3$" }
      - { match: 2.16, feedback: "นั่นคือ $7.2 \\times 0.3$ โจทย์ให้หาร ลองคิดว่าใน 7.2 มี 0.3 อยู่กี่อัน" }
    solution: "$7.2 \\div 0.3 = \\dfrac{7.2 \\times 10}{0.3 \\times 10} = \\dfrac{72}{3} = 24$ ตรวจ: $24 \\times 0.3 = 7.2$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.dec.p006
    topics: [math.number.decimals]
    difficulty: 3
    type: numeric
    stem: "มังคุดราคากิโลกรัมละ 45.50 บาท แม่ซื้อ 2.4 กิโลกรัม ต้องจ่ายกี่บาท"
    answer: { value: 109.2, unit: บาท, tolerance: 0.01 }
    hints:
      - "ราคารวม = ราคาต่อกิโลกรัม × จำนวนกิโลกรัม"
      - "คูณ $4550 \\times 24$ ก่อน แล้วนับตำแหน่งทศนิยมของทั้งสองจำนวนรวมกัน"
    misconceptions:
      - { match: 1092, feedback: "ดูเหมือนนับตำแหน่งทศนิยมจากตัวเดียว 45.50 มี 2 ตำแหน่ง และ 2.4 มี 1 ตำแหน่ง รวม 3 ตำแหน่ง ลองประมาณ: ประมาณ 45 × 2 = 90 บาท ไม่ใช่หลักพัน" }
      - { match: 10.92, feedback: "ใส่จุดเกินไปหนึ่งตำแหน่ง ลองประมาณ: ซื้อมากกว่า 2 กิโลกรัม ต้องจ่ายมากกว่า 90 บาท" }
    solution: "$4550 \\times 24 = 109{,}200$ ทศนิยมรวม $2 + 1 = 3$ ตำแหน่ง ได้ $109.200 = 109.2$ บาท ตรวจ: $45.5 \\times 2.4 \\approx 45 \\times 2.5 = 112.5$ ใกล้เคียง ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.dec.p007
    topics: [math.number.decimals]
    difficulty: 3
    type: order
    stem: "เรียงทศนิยมต่อไปนี้จากน้อยไปมาก"
    items:
      - "2.05"
      - "2.055"
      - "2.5"
      - "2.505"
    hints:
      - "เติม 0 ให้ทุกจำนวนมีทศนิยมสามตำแหน่ง"
      - "ส่วนจำนวนเต็มเท่ากันหมด เทียบหลักส่วนสิบ แล้วหลักส่วนร้อย แล้วหลักส่วนพัน"
    solution: "เติม 0: 2.050, 2.055, 2.500, 2.505 จึงได้ 2.05 < 2.055 < 2.5 < 2.505"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.dec.p008
    topics: [math.number.decimals]
    difficulty: 3
    type: mcq
    stem: "ข้อใดเท่ากับ $\\dfrac{2}{3}$ พอดี"
    choices:
      - { id: a, text: "$0.\\dot{6}$", correct: true }
      - { id: b, text: "$0.6$", feedback: "$0.6 = \\tfrac{6}{10} = \\tfrac{3}{5}$ ไม่ใช่ $\\tfrac{2}{3}$ เมื่อหาร 2 ด้วย 3 จะได้ 6 ซ้ำไปเรื่อย ๆ ไม่จบที่หลักเดียว" }
      - { id: c, text: "$0.67$", feedback: "0.67 เป็นค่าประมาณที่ปัดเป็นทศนิยม 2 ตำแหน่ง ไม่ได้เท่ากับ $\\tfrac{2}{3}$ พอดี ($0.67 \\times 3 = 2.01$)" }
      - { id: d, text: "$1.5$", feedback: "1.5 คือ $3 \\div 2$ ดูเหมือนหารสลับกัน เศษส่วน $\\tfrac{2}{3}$ คือ 2 หารด้วย 3" }
    hints:
      - "เศษส่วนแปลงเป็นทศนิยมได้ด้วยการหารตัวเศษด้วยตัวส่วน"
      - "หาร $2 \\div 3$ ไปทีละหลัก สังเกตว่าเศษที่เหลือเป็นเท่าเดิมทุกครั้งหรือไม่"
    solution: "$2 \\div 3 = 0.666\\ldots$ ทุกขั้นเหลือเศษ 2 เท่าเดิม เลข 6 จึงซ้ำไม่รู้จบ เขียนเป็น $0.\\dot{6}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.dec.p009
    topics: [math.number.decimals]
    difficulty: 4
    type: numeric
    stem: "น้ำมันดีเซลราคาลิตรละ 32.45 บาท พ่อเติมน้ำมัน 500 บาท ได้น้ำมันกี่ลิตร (ปัดเป็นทศนิยม 2 ตำแหน่ง)"
    answer: { value: 15.41, unit: ลิตร, tolerance: 0.01 }
    hints:
      - "จำนวนลิตร = เงินที่จ่าย ÷ ราคาต่อลิตร"
      - "คูณทั้งตัวตั้งและตัวหารด้วย 100 ได้ $50000 \\div 3245$"
      - "หารไปถึงทศนิยมตำแหน่งที่ 3 แล้วปัดเป็น 2 ตำแหน่ง"
    misconceptions:
      - { match: 0.15, feedback: "ดูเหมือนเลื่อนจุดเฉพาะตัวหาร ($500 \\div 3245$) ต้องคูณ 100 ทั้งตัวตั้งและตัวหาร ลองประมาณ: 500 บาทน่าจะได้น้ำมันประมาณ 15 ลิตร" }
      - { match: 16225, feedback: "นั่นคือ $500 \\times 32.45$ โจทย์ถามว่า 500 บาทซื้อได้กี่ลิตร จึงต้องหารด้วยราคาต่อลิตร" }
    solution: "$500 \\div 32.45 = 50000 \\div 3245 = 15.408\\ldots$ หลักส่วนพันเป็น 8 ปัดขึ้น ได้ประมาณ 15.41 ลิตร ตรวจ: $15.41 \\times 32.45 \\approx 500$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.dec.p010
    topics: [math.number.decimals]
    difficulty: 4
    type: match
    stem: "จับคู่เศษส่วนกับทศนิยมที่เท่ากัน"
    pairs:
      - { left: "$\\tfrac{1}{4}$", right: "$0.25$" }
      - { left: "$\\tfrac{1}{8}$", right: "$0.125$" }
      - { left: "$\\tfrac{3}{5}$", right: "$0.6$" }
      - { left: "$\\tfrac{1}{3}$", right: "$0.\\dot{3}$" }
      - { left: "$\\tfrac{1}{11}$", right: "$0.\\dot{0}\\dot{9}$" }
    hints:
      - "หารตัวเศษด้วยตัวส่วน"
      - "ถ้าหารแล้วเศษวนกลับมาเป็นค่าเดิม ทศนิยมจะซ้ำ ใช้จุดบนตัวแรกและตัวสุดท้ายของชุดที่ซ้ำ"
    solution: "$1 \\div 4 = 0.25$, $1 \\div 8 = 0.125$, $3 \\div 5 = 0.6$, $1 \\div 3 = 0.333\\ldots = 0.\\dot{3}$, $1 \\div 11 = 0.0909\\ldots = 0.\\dot{0}\\dot{9}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.dec.p011
    topics: [math.number.decimals]
    difficulty: 5
    type: numeric
    stem: "หาค่า $(1.2 + 0.36) \\times 0.5 - 0.03 \\div 0.1$"
    answer: { value: 0.48, tolerance: 0.005 }
    hints:
      - "ลำดับการดำเนินการ: วงเล็บก่อน แล้วคูณหาร แล้วจึงบวกลบ"
      - "$0.03 \\div 0.1$ ให้คูณ 10 ทั้งตัวตั้งและตัวหาร"
      - "คำนวณ $(1.2 + 0.36) \\times 0.5$ และ $0.03 \\div 0.1$ แยกกัน แล้วนำมาลบกัน"
    misconceptions:
      - { match: 7.5, feedback: "ดูเหมือนลบก่อนหาร คือ $(0.78 - 0.03) \\div 0.1$ ต้องหาร $0.03 \\div 0.1$ ก่อน แล้วค่อยลบ" }
      - { match: 0.777, feedback: "ดูเหมือน $0.03 \\div 0.1$ ได้ 0.003 ซึ่งเป็นผลของการคูณ การหารด้วย 0.1 ทำให้ค่ามากขึ้น 10 เท่า ได้ 0.3" }
    solution: "วงเล็บ: $1.2 + 0.36 = 1.56$ · คูณ: $1.56 \\times 0.5 = 0.78$ · หาร: $0.03 \\div 0.1 = 0.3 \\div 1 = 0.3$ · ลบ: $0.78 - 0.3 = 0.48$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.dec.p012
    topics: [math.number.decimals]
    difficulty: 5
    type: numeric
    stem: "เชือกฟางยาว 12.8 เมตร ตัดเป็นท่อนยาวท่อนละ 0.45 เมตร เพื่อผูกถุงขนม ถ้าตัดให้ได้ท่อนเต็มมากที่สุด จะเหลือเชือกเศษยาวกี่เมตร (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 0.2, unit: m, tolerance: 0.005 }
    hints:
      - "หาก่อนว่าตัดได้กี่ท่อนเต็ม: $12.8 \\div 0.45$ แล้วเอาเฉพาะส่วนจำนวนเต็ม"
      - "คูณ 100 ทั้งตัวตั้งและตัวหาร ได้ $1280 \\div 45$"
      - "เศษเชือก = ความยาวทั้งหมด − (จำนวนท่อนเต็ม × 0.45)"
    misconceptions:
      - { match: 0.44, feedback: "0.44 คือส่วนทศนิยมของผลหาร $28.44\\ldots$ ซึ่งหมายถึง 0.44 ของท่อน ไม่ใช่ 0.44 เมตร ต้องคำนวณเศษจากความยาวที่เหลือจริง" }
    solution: "$12.8 \\div 0.45 = 1280 \\div 45 = 28.44\\ldots$ ตัดได้ 28 ท่อนเต็ม ใช้เชือก $28 \\times 0.45 = 12.6$ เมตร เหลือ $12.8 - 12.6 = 0.2$ เมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true
