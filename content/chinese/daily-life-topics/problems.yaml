  difficulty: 2
  type: match
  stem: จับคู่ชื่อวิชากับความหมาย
  pairs:
  - left: 数学 shùxué
    right: คณิตศาสตร์
  - left: 科学 kēxué
    right: วิทยาศาสตร์
  - left: 历史 lìshǐ
    right: ประวัติศาสตร์
  - left: 体育 tǐyù
    right: พลศึกษา
  - left: 美术 měishù
    right: ศิลปะ
  hints:
  - 数 = จำนวน นับ
  - 体 = ร่างกาย 美 = สวยงาม
  solution: 数学 คณิตศาสตร์ · 科学 วิทยาศาสตร์ · 历史 ประวัติศาสตร์ · 体育 พลศึกษา · 美术 ศิลปะ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.daily-life-topics.p004
  topics:
  - chinese.vocab.daily-life-topics
  difficulty: 2
  type: hanzi
  stem: เขียนอักษร 累 (lèi เหนื่อย) ตามลำดับขีด
  character: 累
  pinyin: lèi
  meaning: เหนื่อย
  hints:
  - 累 = 田 อยู่บน + 糸 อยู่ล่าง รวม 11 ขีด
  - เขียน 田 ให้ครบก่อน แล้วจึงเขียน 糸
  solution: '田: 竖 → 横折 → 横 → 竖 → 横 (5 ขีด) แล้ว 糸: 撇折 → 撇折 → 点 → 竖钩 → 撇 → 点 (6 ขีด) รวม 11 ขีด'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.vocab.daily-life-topics.p005
  topics:
  - chinese.vocab.daily-life-topics
  difficulty: 2
  type: mcq
  stem: '"ฉันขี่จักรยานไปตลาด" (市场 shìchǎng = ตลาด) ประโยคใดถูกต้อง'
  choices:
  - id: a
    text: 我开自行车去市场。
    feedback: 开 = ขับ ใช้กับรถยนต์
  - id: b
    text: 我自行车去市场。
    feedback: ขาดกริยา ต้องมี 骑
  - id: c
    text: 我骑自行车去市场。
    correct: true
    feedback: ถูก จักรยานนั่งคร่อม ใช้ 骑
  - id: d
    text: 我坐自行车去市场。
    feedback: 坐 ใช้กับยานพาหนะที่เรานั่งเป็นผู้โดยสาร เช่น รถเมล์ รถไฟ
  hints:
  - ภาษาไทยใช้ ขี่ ภาษาจีนก็มีกริยาเฉพาะ
  - 骑 qí มีส่วน 马 (ม้า) เพราะเดิมหมายถึงขี่ม้า
  solution: '**我骑自行车去市场。** Wǒ qí zìxíngchē qù shìchǎng.'
  license: CC-BY-SA-4.0
  ai_assisted: true
