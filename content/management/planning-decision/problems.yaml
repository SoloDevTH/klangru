      - "ทัศนคติต่อความเสี่ยงมีผลต่อการเลือก"
    solution: "ก ข ค ถูก EMV เป็นค่าเฉลี่ยระยะยาว ทางที่ EMV สูงอาจขาดทุนในบางสภาวะ และผู้ที่รับความเสี่ยงไม่ได้อาจเลือกทางที่ปลอดภัยกว่า ส่วน ง ผิดเพราะแต่ละครั้งได้ผลใดผลหนึ่ง และ จ ผิดเพราะความน่าจะเป็นต้องรวมเป็น 1"
