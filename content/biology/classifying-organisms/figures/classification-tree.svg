<text x="680.0" y="412.0" text-anchor="middle" font-size="12" fill="#37474f">งู เต่า</text>
<path d="M680.0,262.0 L680.0,301.0 L805.0,301.0 L805.0,340.0" fill="none" stroke="#607d8b" stroke-width="1.8"/>
