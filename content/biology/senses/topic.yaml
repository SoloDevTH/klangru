id: biology.animals.senses
subject: biology
title: { th: อวัยวะรับความรู้สึก, en: "Sense organs" }
summary: ตัวรับความรู้สึกส่งข้อมูลไปสมอง โครงสร้างและหน้าที่ของตา หู จมูก ลิ้น และผิวหนัง จุดบอด โฟเวีย ความไวในการรับสัมผัส และโรคที่พบบ่อยพร้อมแนวทางดูแล
difficulty: 6
minutes: 40
prerequisites: [biology.animals.nervous-system, health.body.nervous-endocrine-care]
encompasses:
  - { id: biology.animals.nervous-system, weight: 0.3 }
  - { id: health.body.nervous-endocrine-care, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: บัตรทดสอบจุดบอด
    src: blind-spot-card.svg
    alt: "บัตรสี่เหลี่ยมสีขาว ด้านซ้ายมีเครื่องหมายบวกสีดำ ด้านขวาห่างออกไปมีจุดกลมสีดำ ใต้ภาพเขียนว่า ปิดตาซ้าย ใช้ตาขวามองเครื่องหมายบวก แล้วค่อย ๆ เลื่อนหน้าเข้าหาหรือออกจากจอ"
    caption: "เมื่อภาพของจุดดำตกบนจุดบอด จุดดำจะหายไป (วาดโดยทีมคลังรู้)"
  - type: figure
    title: โครงสร้างของลูกตา
    src: eye-structure.svg
    alt: "ภาคตัดตามยาวของลูกตา แสงเข้าทางซ้ายผ่านกระจกตาที่โค้งนูน ผ่านรูม่านตาระหว่างม่านตาสีน้ำตาล ผ่านเลนส์ตารูปเลนส์นูน แล้วรวมกันที่โฟเวียซึ่งเป็นแอ่งเล็กบนเรตินาด้านหลังลูกตาตรงแนวสายตา ผนังลูกตามี 3 ชั้น ชั้นนอกคือสเคลอราหรือตาขาว ชั้นกลางคือโครอยด์ ชั้นในคือเรตินาที่มีเซลล์รูปแท่งและรูปกรวย ภายในลูกตาเป็นวุ้นตา ด้านล่างของโฟเวียเล็กน้อยมีเส้นประสาทตาออกจากลูกตา ตรงจุดที่เส้นประสาทตาออกคือจุดบอดซึ่งไม่มีเซลล์รับแสง"
    caption: "โฟเวียกับจุดบอดอยู่คนละตำแหน่ง (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: หามุมของจุดบอดจากบัตรทดสอบ
    problem: "บัตรทดสอบมีเครื่องหมาย + กับจุดดำห่างกัน 8 cm นักเรียนปิดตาซ้ายและจ้อง + ด้วยตาขวา พบว่าจุดดำหายไปเมื่อตาอยู่ห่างบัตร 30 cm จุดบอดอยู่ห่างจากแนวสายตากี่องศา"
    steps:
      - text: "ตาจ้อง + ภาพของ + จึงตกที่โฟเวีย แนวจากตาไปยัง + คือแนวสายตา"
      - text: "ตา + และจุดดำเป็นสามเหลี่ยมมุมฉาก มุมฉากอยู่ที่ + ด้านประชิดยาว 30 cm ด้านตรงข้ามยาว 8 cm"
        why: "บัตรตั้งฉากกับแนวสายตา"
      - text: "$\\tan\\theta = \\frac{8}{30} = 0.267$"
      - text: "$\\theta = \\tan^{-1} 0.267 \\approx 14.9^\\circ$"
      - text: "ผลใกล้ค่าที่ตำราระบุ (ราว 15 องศา) และจุดดำอยู่ทางขวาซึ่งเป็นด้านขมับของตาขวา เพราะภาพในตากลับด้าน จุดบอดจึงอยู่ด้านจมูกของเรตินา"
    answer: "ราว 15 องศาจากแนวสายตา"
  - { type: check, problem: biology.animals.senses.p005, prompt: "บริเวณใดของเรตินาไม่มีเซลล์รับแสง" }
  - type: figure
    title: โครงสร้างของหู
    src: ear-structure.svg
    alt: "แผนภาพหูแบ่งเป็นสามส่วนจากซ้ายไปขวา หูชั้นนอกมีใบหูและช่องหู สิ้นสุดที่เยื่อแก้วหูสีแดง หูชั้นกลางมีกระดูกค้อน ทั่ง โกลนต่อกันเป็นสาย ไปจรดช่องรูปไข่ และมีท่อยูสเตเชียนต่อลงไปที่คอหอย หูชั้นในมีคอเคลียรูปขดก้นหอยทำหน้าที่ได้ยิน หลอดกึ่งวงกลม 3 หลอดทำหน้าที่ทรงตัว และเส้นประสาทหูออกจากคอเคลียไปยังสมอง"
    caption: "เสียงเดินทางจากหูชั้นนอก ผ่านหูชั้นกลาง ไปหูชั้นใน (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ฟังเพลงเสียงดังได้นานเท่าไร
    problem: "WHO แนะนำว่าผู้ใหญ่ฟังเสียงเฉลี่ย 80 dB ได้ไม่เกิน 40 ชั่วโมงต่อสัปดาห์ และทุกครั้งที่เสียงดังขึ้น 3 dB พลังงานเสียงเพิ่มเป็น 2 เท่า เวลาที่ปลอดภัยจึงลดลงครึ่งหนึ่ง ถ้าฟังเพลงผ่านหูฟังที่ 89 dB ควรฟังไม่เกินกี่ชั่วโมงต่อสัปดาห์"
    steps:
      - text: "เสียงดังขึ้น $89 - 80 = 9$ dB"
      - text: "9 dB คือการเพิ่ม 3 dB สามครั้ง เวลาจึงลดครึ่งสามครั้ง"
        why: "ใช้หลักพลังงานเสียงรวมเท่ากัน เสียงดังเป็นสองเท่าของพลังงานต้องฟังสั้นลงครึ่งหนึ่ง"
      - text: "$40 \\div 2 \\div 2 \\div 2 = 40 \\div 2^3 = 5$ ชั่วโมงต่อสัปดาห์"
      - text: "ลดเสียงลงหรือฟังสั้นลงจึงปลอดภัยกว่า เพราะเซลล์ขนในคอเคลียที่ตายแล้วไม่สร้างใหม่"
    answer: "ไม่เกิน 5 ชั่วโมงต่อสัปดาห์"
  - { type: check, problem: biology.animals.senses.p004, prompt: "เสียงผ่านส่วนใดก่อนถึงคอเคลีย" }
glossary:
  - { term: ตัวรับความรู้สึก, definition: "เซลล์หรือปลายประสาทที่ตรวจจับสิ่งเร้าเฉพาะอย่างแล้วเปลี่ยนเป็นกระแสประสาท" }
  - { term: เรตินา, definition: "ชั้นในสุดของลูกตา มีเซลล์รูปแท่งและรูปกรวยที่รับแสง" }
  - { term: โฟเวีย, definition: "แอ่งกลางเรตินาที่มีเซลล์รูปกรวยหนาแน่น เห็นภาพชัดที่สุด" }
  - { term: จุดบอด, definition: "ตำแหน่งที่เส้นประสาทตาออกจากลูกตา ไม่มีเซลล์รับแสง" }
  - { term: คอเคลีย, definition: "อวัยวะรูปขดในหูชั้นใน มีเซลล์ขนเปลี่ยนการสั่นของของเหลวเป็นกระแสประสาท" }
  - { term: หลอดกึ่งวงกลม, definition: "หลอด 3 หลอดในหูชั้นใน รับรู้การหมุนของศีรษะเพื่อการทรงตัว" }
  - { term: ระยะสองจุด, definition: "ระยะห่างน้อยที่สุดที่ผิวหนังรู้สึกว่าถูกแตะเป็นสองจุด ยิ่งน้อยยิ่งไว" }
flashcards:
  - { front: "เซลล์รูปแท่งกับรูปกรวยต่างกันอย่างไร", back: "รูปแท่งทำงานในแสงสลัว ให้ภาพขาวดำ รูปกรวยทำงานในแสงสว่าง รับสีและรายละเอียด" }
  - { front: "โฟเวียกับจุดบอด", back: "โฟเวียมีเซลล์รูปกรวยแน่นที่สุด เห็นชัดที่สุด จุดบอดไม่มีเซลล์รับแสงเลย" }
  - { front: "ทางเดินของเสียง", back: "ช่องหู → เยื่อแก้วหู → ค้อน ทั่ง โกลน → ช่องรูปไข่ → คอเคลีย → เส้นประสาทหู → สมอง" }
  - { front: "รส 5 รสที่ลิ้นรับได้", back: "หวาน เค็ม เปรี้ยว ขม อูมามิ ทุกบริเวณของลิ้นรับได้ทุกรส" }
  - { front: "บริเวณใดของผิวหนังไวต่อสัมผัสที่สุด", back: "ปลายนิ้ว ริมฝีปาก ลิ้น เพราะมีตัวรับหนาแน่น ระยะสองจุดสั้นที่สุด" }
