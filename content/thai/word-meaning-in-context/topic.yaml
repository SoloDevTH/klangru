id: thai.reading.word-meaning-in-context
subject: thai
title: { th: ความหมายของคำและข้อความจากบริบท, en: "Word and passage meaning from context" }
summary: แยกความหมายโดยตรงกับโดยนัย อ่านคำหลายความหมาย คำเปรียบเทียบ ข้อความบรรยาย พรรณนา และโวหารอื่น และเดาความหมายคำยากจากตัวช่วยในบริบท
difficulty: 3
minutes: 30
prerequisites: [thai.reading.read-aloud]
encompasses: []
curriculum_tags: []
lessons:
  - type: figure
    src: context-clues.svg
    alt: "ประโยค หมู่บ้านนั้นทุรกันดาร ถนนขาดเป็นช่วง ๆ ไม่มีไฟฟ้า หน้าฝนรถเข้าไม่ถึง คำว่า ทุรกันดาร อยู่ในกรอบสีแดง ข้อความสามช่วงที่ตามมาขีดเส้นใต้และมีลูกศรชี้ไปที่กล่อง เดา: ไปมาลำบาก ห่างไกลความเจริญ ใต้กล่องเขียนว่า แทนกลับลงในประโยคแล้วได้ความ จึงตรวจกับพจนานุกรม ด้านล่างเป็นตัวช่วยในบริบท 4 แบบ: คำอธิบาย (คือ หมายถึง วงเล็บ) ตัวอย่าง (เช่น ได้แก่) คำตรงข้าม (แต่ ส่วน ตรงกันข้าม) เหตุและผล (เพราะ จึง ทำให้)"
    caption: "ข้อความรอบคำยากช่วยให้เดาความหมายได้"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: เดาความหมายจากบริบท
    problem: "\"แม่น้ำสายนี้ตื้นเขินลงทุกปี เพราะดิน ทราย และเศษใบไม้ที่น้ำพัดมาทับถมอยู่ที่ก้นแม่น้ำ\" คำว่า ตื้นเขิน หมายถึงอะไร"
    steps:
      - text: "อ่านทั้งประโยค: ประโยคบอกเหตุ (ดิน ทราย ทับถม) และผล (ตื้นเขิน)"
      - text: "หาตัวช่วย: คำว่า เพราะ เป็นตัวช่วยแบบเหตุและผล"
        why: "รู้เหตุแล้วจะเดาผลได้ ดินทรายทับถมที่ก้นแม่น้ำย่อมทำให้ก้นแม่น้ำสูงขึ้น"
      - text: "เดา: ตื้นเขิน คือ น้ำตื้นลงเพราะมีของทับถมที่ก้น"
      - text: "แทนลงในประโยค: แม่น้ำสายนี้น้ำตื้นลงทุกปีเพราะดินทรายทับถม ได้ความ"
    answer: "ตื้นเขิน หมายถึง แม่น้ำตื้นลงเพราะมีดิน ทราย หรือตะกอนทับถม"
  - { type: check, problem: thai.reading.word-meaning-in-context.p006, prompt: "รายละเอียดที่ตามมาบอกอะไรร่วมกัน" }
  - type: worked-example
    title: อ่านคำเปรียบเทียบ
    problem: "\"เด็กเหมือนผ้าขาว จะเป็นอย่างไรขึ้นอยู่กับผู้แต่งแต้ม\" อธิบายความหมายของข้อความ"
    steps:
      - text: "หาคำเชื่อม: เหมือน จึงเป็นอุปมา"
      - text: "อะไรเปรียบกับอะไร: เด็ก เปรียบกับ ผ้าขาว"
      - text: "เหมือนกันตรงไหน: ผ้าขาวยังไม่มีสี จะเป็นสีอะไรขึ้นกับคนแต้มสี เด็กยังไม่มีนิสัยติดตัวมาก จะเป็นอย่างไรขึ้นกับคนเลี้ยงดูและสั่งสอน"
        why: "การอ่านคำเปรียบเทียบต้องบอกให้ได้ว่าเหมือนกันในแง่ใด ไม่ใช่แค่บอกว่าเปรียบกับอะไร"
      - text: "สรุปความหมายโดยนัย: ผู้ใหญ่และสิ่งแวดล้อมมีผลต่อนิสัยของเด็ก ควรสอนสิ่งดี"
    answer: "ข้อความใช้อุปมาเปรียบเด็กกับผ้าขาว หมายถึงเด็กจะเป็นคนอย่างไรขึ้นอยู่กับการอบรมเลี้ยงดู"
  - { type: check, problem: thai.reading.word-meaning-in-context.p004, prompt: "หาคำเชื่อมการเปรียบเทียบก่อน" }
glossary:
  - { term: บริบท, definition: "ข้อความหรือสถานการณ์รอบคำที่ช่วยกำหนดความหมายของคำนั้น" }
  - { term: ความหมายโดยตรง, definition: "ความหมายตามตัวคำ เช่น เสือ ที่เป็นสัตว์" }
  - { term: ความหมายโดยนัย, definition: "ความหมายที่แฝงอยู่ ต้องตีความจากบริบท เช่น เสือ ที่หมายถึงคนเก่ง" }
  - { term: อุปมา, definition: "การเปรียบว่าสิ่งหนึ่งเหมือนอีกสิ่งหนึ่ง ใช้คำ เหมือน ดุจ ราวกับ ประหนึ่ง" }
  - { term: อุปลักษณ์, definition: "การเปรียบว่าสิ่งหนึ่งเป็นอีกสิ่งหนึ่ง ใช้คำ เป็น คือ" }
  - { term: พรรณนาโวหาร, definition: "ข้อความที่เล่าอย่างละเอียดให้ผู้อ่านเห็นภาพและรู้สึกตาม" }
flashcards:
  - { front: "ความหมายโดยนัยต่างจากความหมายโดยตรงอย่างไร", back: "โดยตรงคือตามตัวคำ โดยนัยคือความหมายแฝงที่ต้องตีความจากบริบท" }
  - { front: "ตัวช่วยในบริบท 4 แบบ", back: "คำอธิบาย ตัวอย่าง คำตรงข้าม เหตุและผล" }
  - { front: "อุปมา กับ อุปลักษณ์", back: "อุปมาใช้ เหมือน ดุจ ราวกับ · อุปลักษณ์ใช้ เป็น คือ" }
  - { front: "โวหาร 5 แบบ", back: "บรรยาย พรรณนา เทศนา สาธก อุปมา" }
  - { front: "เดาความหมายแล้วต้องทำอะไร", back: "แทนกลับลงในประโยคว่าได้ความ และตรวจกับพจนานุกรมเมื่อเป็นเรื่องสำคัญ" }
