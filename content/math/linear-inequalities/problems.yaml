  - id: math.ineq.p020
    topics: [math.algebra.linear-inequalities]
    difficulty: 5
    type: numeric
    stem: "ให้ $a$ เป็นจำนวนเต็ม ถ้าจำนวนเต็มที่น้อยที่สุดที่เป็นคำตอบของ $3x - a > 2x + 1$ คือ 5 จงหา $a$"
    answer: { value: 3 }
    hints:
      - "แก้อสมการหา $x$ ในรูปของ $a$ ก่อน"
      - "ได้ $x > a + 1$ ถ้าจำนวนเต็มที่น้อยที่สุดที่มากกว่า $a + 1$ คือ 5 แล้ว $a + 1$ ต้องมีค่าเท่าใด"
      - "ระวังว่าเป็น $>$ ไม่ใช่ $\\ge$ ตัว $a + 1$ เองไม่เป็นคำตอบ"
    misconceptions:
      - { match: 4, feedback: "ถ้า $a = 4$ จะได้ $x > 5$ จำนวนเต็มที่น้อยที่สุดคือ 6 ไม่ใช่ 5 เพราะ $>$ ไม่รวม $a + 1$" }
    solution: "$3x - a > 2x + 1$ → $x > a + 1$ จำนวนเต็มที่น้อยที่สุดที่มากกว่า $a + 1$ คือ 5 ดังนั้น $4 \\le a + 1 < 5$ และเมื่อ $a$ เป็นจำนวนเต็ม $a + 1 = 4$ จึงได้ $a = 3$ ตรวจ: $x > 4$ จำนวนเต็มที่น้อยที่สุดคือ 5 ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true
