<text x="260.0" y="280.0" text-anchor="middle" fill="#1f2937" font-size="13">3 ใช้งาน</text>
<rect x="7.0" y="143.0" width="176" height="44" rx="10" fill="#fecaca" stroke="#991b1b" stroke-width="2"/>
<text x="95.0" y="170.0" text-anchor="middle" fill="#1f2937" font-size="13">4 ซ่อม ใช้ซ้ำ รีไซเคิล</text>
<text x="260" y="171" text-anchor="middle" fill="#6b7280" font-size="12">ยืดอายุใช้งาน</text>
