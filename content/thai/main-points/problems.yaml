problems:
- id: thai.listening.main-points.p001
  topics:
  - thai.listening.main-points
  difficulty: 1
  type: mcq
  stem: '**ข้อความที่ได้ยิน:** "ผักบุ้งเป็นผักที่ปลูกง่าย มันโตเร็วจนเก็บกินได้ไว ขึ้นได้ทั้งในดินและในน้ำ และใช้พื้นที่ปลูกไม่มาก บ้านที่มีกระถางเล็ก ๆ ก็ปลูกได้"


    ใจความสำคัญของเรื่องนี้คือข้อใด'
  choices:
  - id: a
    text: ผักบุ้งปลูกง่าย
    correct: true
    feedback: ถูก ประโยคแรกบอกเรื่องหลัก ข้ออื่นอธิบายว่าง่ายอย่างไร
  - id: b
    text: ผักบุ้งโตเร็ว
    feedback: เป็นรายละเอียดข้อหนึ่งที่อธิบายว่าปลูกง่าย
  - id: c
    text: ผักบุ้งขึ้นในน้ำได้
    feedback: เป็นรายละเอียด ไม่คลุมเรื่องทั้งหมด
  - id: d
    text: บ้านทุกหลังมีกระถาง
    feedback: เรื่องไม่ได้พูดแบบนี้
  hints:
  - ใจความสำคัญต้องคลุมรายละเอียดทุกข้อ
  - ลองดูประโยคแรกของเรื่อง
  solution: ใจความสำคัญคือ **ผักบุ้งเป็นผักที่ปลูกง่าย** ส่วนโตเร็ว ขึ้นได้ทั้งดินและน้ำ ใช้พื้นที่น้อย เป็นรายละเอียด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.main-points.p002
  topics:
  - thai.listening.main-points
  difficulty: 1
  type: mcq
  stem: ถ้าอยากรู้ **เหตุผล** ของเรื่องที่ฟัง ควรใช้คำถามที่ขึ้นต้นด้วยคำใด
  choices:
  - id: a
    text: ทำไม
    correct: true
    feedback: ถูก ทำไม ถามหาเหตุผล
  - id: b
    text: ที่ไหน
    feedback: ที่ไหน ถามสถานที่
  - id: c
    text: เมื่อไร
    feedback: เมื่อไร ถามเวลา
  - id: d
    text: ใคร
    feedback: ใคร ถามบุคคล
  hints:
  - เหตุผลคือคำตอบที่มีคำว่า เพราะ
  - คำถามคู่กับคำตอบ เพราะ...
  solution: '**ทำไม** ใช้ถามเหตุผล คำตอบมักมีคำว่า เพราะ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.main-points.p003
  topics:
  - thai.listening.main-points
  difficulty: 2
  type: match
  stem: จับคู่คำถามกับข้อมูลที่คำถามนั้นต้องการ
  pairs:
  - left: ใคร
    right: บุคคล
  - left: ที่ไหน
    right: สถานที่
  - left: เมื่อไร
    right: เวลา
  - left: ทำไม
    right: เหตุผล
  - left: อย่างไร
    right: วิธีการ
  hints:
  - นี่คือคำถาม 5W1H
  - นึกคำตอบตัวอย่างของแต่ละคำถาม
  solution: ใคร–บุคคล · ที่ไหน–สถานที่ · เมื่อไร–เวลา · ทำไม–เหตุผล · อย่างไร–วิธีการ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.main-points.p004
  topics:
  - thai.listening.main-points
  difficulty: 2
  type: mcq
  stem: ดูภาพจากรายการข่าวโรงเรียน ข่าวนี้มีใจความสำคัญว่าอย่างไร
  figure: &id001
    src: news-screen.svg
    alt: ภาพจากรายการข่าวโรงเรียน มีโต๊ะวางหนังสือ 3 ตัวและนักเรียน 2 คน ป้ายมุมบนว่า ข่าวโรงเรียน แถบพาดหัวว่า ตลาดนัดหนังสือมือสอง รายได้ซื้อหนังสือเข้าห้องสมุด แถบตัวอักษรด้านล่างว่า ศุกร์ 13 พ.ย. · โรงอาหาร · 08.30–15.30 น. · เล่มละ 5–20 บาท
  choices:
  - id: a
    text: โรงเรียนจัดตลาดนัดหนังสือมือสองเพื่อหาเงินซื้อหนังสือเข้าห้องสมุด
    correct: true
    feedback: ถูก ได้จากพาดหัวข่าวซึ่งบอกเรื่องหลักและจุดประสงค์
  - id: b
    text: หนังสือราคาเล่มละ 5–20 บาท
    feedback: เป็นรายละเอียดเรื่องราคา
  - id: c
    text: ตลาดนัดอยู่ที่โรงอาหาร
    feedback: เป็นรายละเอียดเรื่องสถานที่
  - id: d
    text: นักเรียนสองคนกำลังเดินเล่น
    feedback: เป็นสิ่งที่เห็นในภาพ ไม่ใช่เรื่องที่ข่าวต้องการบอก
  hints:
  - ใจความมักอยู่ในพาดหัว
  - รายละเอียดเวลา สถานที่ ราคา อยู่ในแถบตัวอักษรด้านล่าง
  solution: 'ใจความ: **โรงเรียนจัดตลาดนัดหนังสือมือสอง รายได้ซื้อหนังสือเข้าห้องสมุด**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.main-points.p005
  topics:
  - thai.listening.main-points
  difficulty: 2
  type: text
  stem: ดูภาพจากรายการข่าวโรงเรียน ตลาดนัดจัดที่ไหน (ตอบสั้น ๆ)
  figure: *id001
  accepted:
  - โรงอาหาร
  - ที่โรงอาหาร
  - โรงอาหารของโรงเรียน
  misconceptions:
  - match: ห้องสมุด
    feedback: ห้องสมุดคือที่ที่จะได้หนังสือจากรายได้ ไม่ใช่ที่จัดตลาดนัด
  hints:
  - คำถาม ที่ไหน ถามสถานที่
  - ดูแถบตัวอักษรสีเหลืองด้านล่าง
  solution: ตลาดนัดจัดที่ **โรงอาหาร**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.main-points.p006
  topics:
  - thai.listening.main-points
  difficulty: 2
  type: mcq
  stem: '**ข้อความที่ได้ยิน:** "สุนัขของป้าแดงชื่อเจ้าด่าง มันเฝ้าบ้านเก่งมาก เมื่อมีคนแปลกหน้าเดินมา มันจะเห่าเสียงดังทันที คืนหนึ่งเจ้าด่างเห่าจนป้าตื่นมาเห็นขโมยวิ่งหนีไป"


    ข้อใด **เป็นรายละเอียด** ไม่ใช่ใจความสำคัญ'
  choices:
  - id: a
    text: สุนัขชื่อเจ้าด่าง
    correct: true
    feedback: ถูก ชื่อสุนัขช่วยเล่าเรื่อง แต่ไม่ใช่เรื่องหลัก
  - id: b
    text: เจ้าด่างเฝ้าบ้านเก่ง
    feedback: นี่คือใจความสำคัญ เรื่องทั้งหมดเล่าว่ามันเฝ้าบ้านเก่งอย่างไร
  hints:
  - ถามตัวเองว่าเรื่องนี้ต้องการบอกอะไร
  - เหตุการณ์ขโมยหนีเป็นตัวอย่างของอะไร
  solution: ใจความคือ **เจ้าด่างเฝ้าบ้านเก่ง** ส่วนชื่อสุนัขเป็นรายละเอียด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.main-points.p007
  topics:
  - thai.listening.main-points
  difficulty: 3
  type: mcq
  stem: '**ข้อความที่ได้ยิน:** "วันพฤหัสบดีนี้โรงเรียนจัดกีฬาสี ขอให้นักเรียนแต่งชุดพละตามสีของตน มาถึงโรงเรียนก่อน 7 โมงครึ่ง เพื่อเดินขบวนพาเหรด และนำขวดน้ำส่วนตัวมาด้วย เพราะโรงเรียนงดใช้แก้วพลาสติก"


    ข้อใด **สรุปใจความ** ได้ดีที่สุด'
  choices:
  - id: a
    text: วันพฤหัสบดีนี้มีกีฬาสี นักเรียนต้องแต่งชุดพละตามสี มาก่อน 7 โมงครึ่ง และนำขวดน้ำมาเอง
    correct: true
    feedback: ถูก บอกเรื่องหลักและสิ่งที่ต้องทำครบ
  - id: b
    text: นักเรียนต้องนำขวดน้ำมาเอง
    feedback: แคบเกินไป เป็นรายละเอียดข้อเดียว
  - id: c
    text: กีฬาช่วยให้ร่างกายแข็งแรง
    feedback: กว้างเกินไป และประกาศไม่ได้พูดเรื่องนี้
  - id: d
    text: โรงเรียนไม่ชอบแก้วพลาสติก
    feedback: เป็นเหตุผลของรายละเอียดข้อหนึ่ง ไม่ใช่เรื่องหลัก
  hints:
  - สรุปที่ดีต้องไม่แคบและไม่กว้างเกินไป
  - ตอบให้ได้ว่า มีงานอะไร เมื่อไร ต้องทำอะไร
  solution: 'สรุปที่ดี: **วันพฤหัสบดีนี้มีกีฬาสี แต่งชุดพละตามสี มาก่อน 7 โมงครึ่ง และนำขวดน้ำมาเอง**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.main-points.p008
  topics:
  - thai.listening.main-points
  difficulty: 3
  type: mcq
  stem: '**ข้อความที่ได้ยิน:** "วันพฤหัสบดีนี้โรงเรียนจัดกีฬาสี ขอให้นักเรียนแต่งชุดพละตามสีของตน มาถึงโรงเรียนก่อน 7 โมงครึ่ง เพื่อเดินขบวนพาเหรด และนำขวดน้ำส่วนตัวมาด้วย เพราะโรงเรียนงดใช้แก้วพลาสติก"


    ทำไมนักเรียนต้องนำขวดน้ำส่วนตัวมา'
  choices:
  - id: a
    text: เพราะโรงเรียนงดใช้แก้วพลาสติก
    correct: true
    feedback: ถูก ประกาศบอกเหตุผลไว้หลังคำว่า เพราะ
  - id: b
    text: เพราะต้องเดินขบวนพาเหรด
    feedback: การเดินขบวนเป็นเหตุผลที่ต้องมาก่อน 7 โมงครึ่ง
  - id: c
    text: เพราะอากาศร้อน
    feedback: อาจจริงในชีวิต แต่ประกาศไม่ได้บอก ต้องตอบจากเรื่องที่ฟัง
  - id: d
    text: เพราะต้องแต่งชุดพละ
    feedback: ไม่เกี่ยวกับขวดน้ำ
  hints:
  - หาคำว่า เพราะ ในประกาศ
  - ตอบจากข้อมูลในเรื่อง ไม่ใช่ความเห็นของเรา
  solution: นำขวดน้ำมา**เพราะโรงเรียนงดใช้แก้วพลาสติก**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.main-points.p009
  topics:
  - thai.listening.main-points
  difficulty: 3
  type: order
  stem: เรียงขั้นการฟังเพื่อจับใจความให้ถูกลำดับ
  items:
  - ดูชื่อเรื่องหรือพาดหัว ตั้งใจว่าจะฟังเพื่ออะไร
  - ฟังและจดคำสำคัญ
  - ตอบคำถาม ใคร ทำอะไร ที่ไหน เมื่อไร ทำไม อย่างไร
  - สรุปใจความด้วยคำของตัวเอง
  - ตรวจว่าสรุปคลุมรายละเอียดทุกข้อ
  hints:
  - เริ่มก่อนฟัง จบหลังฟัง
  - ต้องมีข้อมูลก่อนจึงสรุปได้
  solution: ก่อนฟัง → จดคำสำคัญ → ตอบ 5W1H → สรุป → ตรวจสรุป
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.main-points.p010
  topics:
  - thai.listening.main-points
  difficulty: 3
  type: mcq
  stem: '**ข้อความที่ได้ยิน:** "ฤดูร้อนปีหนึ่ง มดขนเมล็ดพืชเข้ารังทุกวัน ส่วนตั๊กแตนร้องเพลงเล่นทั้งวันและหัวเราะเยาะมด เมื่อถึงฤดูหนาว หญ้าเหี่ยวหมด ตั๊กแตนหิวจนต้องไปขออาหารจากมด แต่มดมีอาหารพอกินตลอดหน้าหนาว" (เล่าใหม่จากนิทานอีสป)


    ข้อใดเป็น **คำถามเชิงเหตุผล** เกี่ยวกับเรื่องนี้'
  choices:
  - id: a
    text: ทำไมมดจึงมีอาหารพอกินในฤดูหนาว
    correct: true
    feedback: ถูก ต้องเชื่อมเหตุ (ขยันเก็บอาหาร) กับผล (มีอาหารพอ)
  - id: b
    text: ตั๊กแตนทำอะไรในฤดูร้อน
    feedback: เป็นคำถามข้อมูล คำตอบอยู่ในเรื่องตรง ๆ
  - id: c
    text: เรื่องนี้มีตัวละครกี่ตัว
    feedback: เป็นคำถามข้อมูล นับได้จากเรื่อง
  - id: d
    text: มดขนอะไรเข้ารัง
    feedback: เป็นคำถามข้อมูล
  hints:
  - คำถามเชิงเหตุผลมักใช้ ทำไม หรือ เพราะอะไร
  - คำตอบต้องเชื่อมเหตุกับผล
  solution: '**ทำไมมดจึงมีอาหารพอกินในฤดูหนาว** ตอบว่า เพราะมดขยันเก็บอาหารไว้ตั้งแต่ฤดูร้อน'
  license: CC-BY-SA-4.0
  ai_assisted: true
