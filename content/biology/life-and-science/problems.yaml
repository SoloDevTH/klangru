      - { id: c, text: "เกลือไม่มีผลต่อการงอก เพราะทุกชุดมีเมล็ดงอกบ้าง", feedback: "จำนวนที่งอกลดจาก 47 เหลือ 9 เมื่อเกลือเข้มข้นขึ้น จึงมีผลชัดเจน" }
