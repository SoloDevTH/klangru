problems:
  - id: chemistry.states.real-gases-phase-diagrams.p001
    topics: [chemistry.states.real-gases-phase-diagrams]
    difficulty: 1
    type: mcq
    stem: 'สำหรับแก๊สอุดมคติ ค่าตัวประกอบการอัดตัว $Z = \frac{PV}{nRT}$ มีค่าเท่าใด'
    choices:
      - { id: a, text: '0', feedback: 'Z = 0 หมายถึงแก๊สไม่มีความดัน ซึ่งไม่ใช่แก๊สอุดมคติ' }
      - { id: b, text: '1', correct: true, feedback: 'ถูก แก๊สอุดมคติไม่มีแรงระหว่างโมเลกุลและไม่มีปริมาตรของโมเลกุล จึงทำให้ $PV = nRT$ พอดี' }
      - { id: c, text: 'มากกว่า 1 เสมอ', feedback: 'แก๊สจริงมี Z มากกว่า 1 เฉพาะที่ความดันสูง แต่แก๊สอุดมคติเท่ากับ 1' }
      - { id: d, text: 'น้อยกว่า 1 เสมอ', feedback: 'แก๊สจริงมี Z น้อยกว่า 1 เฉพาะที่ความดันปานกลาง แต่แก๊สอุดมคติเท่ากับ 1' }
    hints:
      - 'ดูว่าแก๊สอุดมคติเป็นไปตามกฎแก๊สอุดมคติ $PV = nRT$ หรือไม่'
      - 'ถ้า $PV$ เท่ากับ $nRT$ พอดี ค่า $Z$ เป็นเท่าใด'
    solution: 'แก๊สอุดมคติทำให้ $PV = nRT$ พอดี จึง $Z = 1$ ค่าที่เบี่ยงเบนไปจากหนึ่งบอกถึงความไม่เป็นอุดมคติของแก๊สจริง'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.states.real-gases-phase-diagrams.p002
    topics: [chemistry.states.real-gases-phase-diagrams]
    difficulty: 1
    type: mcq
    stem: 'เหตุใดน้ำมันพืชจึงข้นกว่าน้ำ (มีความหนืดสูงกว่า) มาก'
    choices:
      - { id: a, text: 'โมเลกุลมีแรงระหว่างโมเลกุลมากกว่าและยาวพันกันได้ จึงไหลยาก', correct: true, feedback: 'ถูก โมเลกุลไขมันขนาดใหญ่ดึงดูดและพันกันได้มาก ทำให้ของเหลวไหลช้า' }
      - { id: b, text: 'น้ำมันมีอุณหภูมิสูงกว่าน้ำเสมอ', feedback: 'อุณหภูมิไม่ใช่สาเหตุหลักของความข้นในนิยามนี้' }
      - { id: c, text: 'น้ำมันมีมวลโมเลกุลต่ำ', feedback: 'ตรงข้าม น้ำมันมีโมเลกุลใหญ่กว่าน้ำมาก' }
      - { id: d, text: 'น้ำมันมีความดันไอสูงกว่าน้ำมาก', feedback: 'ความดันไอสูงทำให้ของเหลวระเหยเร็ว ไม่ได้ทำให้ไหลช้า' }
    hints:
      - 'นึกถึงขนาดของโมเลกุลและแรงที่ดึงโมเลกุลให้ติดกัน'
      - 'ความหนืดเกี่ยวกับความต้านทานการไหลของของเหลว'
    solution: 'ความหนืดสูงเกิดจากแรงระหว่างโมเลกุลและการพันกันของโมเลกุลยาว น้ำมันพืชประกอบด้วยไตรกลีเซอไรด์ที่โมเลกุลใหญ่กว่าน้ำมาก'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.states.real-gases-phase-diagrams.p003
    topics: [chemistry.states.real-gases-phase-diagrams]
    difficulty: 2
    type: numeric
    stem: 'แก๊ส $\mathrm{CO_2}$ 1.00 mol ถูกอัดในภาชนะปริมาตร 0.500 L ที่ 300 K ถ้าเป็นแก๊สอุดมคติ ความดันเป็นกี่บาร์ กำหนด $R = 0.08314$ L·bar/(mol·K) (ตอบเป็น bar)'
    answer: { value: 49.88, tolerance: 0.02, unit: bar }
    hints:
      - 'ใช้กฎแก๊สอุดมคติ $PV = nRT$ ตัดหาความดัน $P$'
      - 'อุณหภูมิต้องเป็นเคลวินก่อนแทนค่า'
    misconceptions:
      - { match: 4.49, feedback: 'ใช้อุณหภูมิ 27 แทนเคลวิน ต้องบวก 273 เพื่อแปลงเป็นเคลวินก่อน (300 K ไม่ใช่ 27 K)' }
    solution: '$P = nRT / V = 1.00 \times 0.08314 \times 300 / 0.500 = 49.88$ bar'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.states.real-gases-phase-diagrams.p004
    topics: [chemistry.states.real-gases-phase-diagrams]
    difficulty: 2
    type: numeric
    stem: 'ใช้สมการแวนเดอร์วาลส์คำนวณความดันของ $\mathrm{CO_2}$ 1.00 mol ในภาชนะ 0.500 L ที่ 300 K กำหนด $a = 3.640$ L²·bar/mol² และ $b = 0.04267$ L/mol และ $R = 0.08314$ L·bar/(mol·K) (ตอบเป็น bar) ใช้สมการ $P = \frac{nRT}{V - nb} - \frac{a n^2}{V^2}$'
    answer: { value: 39.98, tolerance: 0.02, unit: bar }
    hints:
      - 'คำนวณพจน์แรก $nRT / (V - nb)$ โดยลบปริมาตรที่โมเลกุลกินที่ออกจาก $V$ ก่อน'
      - 'พจน์ที่สองเป็นแรงดึงดูด ซึ่งลดความดันลง ต้องนำมาหักออกจากพจน์แรก'
    misconceptions:
      - { match: 54.54, feedback: 'ลืมพจน์แรงดึงดูด $an^2/V^2$ ที่ลดความดันลง ค่า 54.54 จึงสูงเกินจริง' }
    solution: '$V - nb = 0.500 - 0.04267 = 0.45733$ L พจน์แรก $= 0.08314 \times 300 / 0.45733 = 54.54$ bar พจน์ดึงดูด $= 3.640 \times 1^2 / 0.500^2 = 14.56$ bar $P = 54.54 - 14.56 = 39.98$ bar'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.states.real-gases-phase-diagrams.p005
    topics: [chemistry.states.real-gases-phase-diagrams]
    difficulty: 2
    type: mcq
    stem: 'ในสมการแวนเดอร์วาลส์ พจน์ $a$ สะท้อนปัจจัยใด'
    choices:
      - { id: a, text: 'แรงดึงดูดระหว่างโมเลกุล', correct: true, feedback: 'ถูก ค่า a ใหญ่ขึ้นเมื่อโมเลกุลดึงดูดกันแรงกว่า เช่น $\mathrm{H_2O}$ มีค่า a สูง' }
      - { id: b, text: 'ปริมาตรที่โมเลกุลกินที่เอง', feedback: 'นั่นคือ $b$ ไม่ใช่ $a$' }
      - { id: c, text: 'อุณหภูมิของแก๊ส', feedback: 'อุณหภูมิอยู่ในพจน์ $RT$ ไม่ใช่ $a$' }
      - { id: d, text: 'จำนวนโมลของแก๊ส', feedback: 'จำนวนโมลอยู่ใน $n$ ไม่ใช่ค่าคงที่ $a$' }
    hints:
      - 'พจน์ $a$ อยู่ในส่วนที่หักออกจากความดัน'
      - 'ความดันถูกลดลงเมื่อโมเลกุลดึงดูดกัน'
    solution: 'พจน์ $an^2/V^2$ แก้ผลของแรงดึงดูดระหว่างโมเลกุลที่ทำให้ความดันที่วัดได้ต่ำกว่าค่าอุดมคติ'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.states.real-gases-phase-diagrams.p006
    topics: [chemistry.states.real-gases-phase-diagrams]
    difficulty: 2
    type: mcq
    stem: 'ในสมการแวนเดอร์วาลส์ พจน์ $b$ สะท้อนปัจจัยใด'
    choices:
      - { id: a, text: 'แรงดึงดูดระหว่างโมเลกุล', feedback: 'นั่นคือ $a$ ไม่ใช่ $b$' }
      - { id: b, text: 'ปริมาตรที่โมเลกุลกินที่เอง ทำให้ปริมาตรที่แก๊สเคลื่อนที่ได้ลดลง', correct: true, feedback: 'ถูก $V - nb$ คือปริมาตรที่เหลือให้โมเลกุลเคลื่อนที่ได้' }
      - { id: c, text: 'ความเร็วเฉลี่ยของโมเลกุล', feedback: 'ความเร็วเกี่ยวกับอุณหภูมิ ไม่ใช่ค่า $b$' }
      - { id: d, text: 'ความดันไอของของเหลว', feedback: 'ความดันไอไม่ได้อยู่ในสมการแวนเดอร์วาลส์โดยตรง' }
    hints:
      - 'ดูว่า $V - nb$ มีความหมายทางกายภาพว่าอย่างไร'
      - 'โมเลกุลแต่ละตัวมีขนาดจริง ไม่ใช่จุดศูนย์'
    solution: 'พจน์ $b$ คือปริมาตรที่โมเลกุลใช้เองต่อโมล เมื่อหักออกจากปริมาตรภาชนะจะได้ปริมาตรที่แก๊สเคลื่อนที่ได้จริง'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.states.real-gases-phase-diagrams.p007
    topics: [chemistry.states.real-gases-phase-diagrams]
    difficulty: 2
    type: match
    stem: 'จับคู่สมบัติของของเหลวกับคำอธิบายที่เหมาะสม'
    pairs:
      - { left: 'ความหนืด', right: 'ความต้านทานการไหลที่เกิดจากแรงระหว่างโมเลกุล' }
      - { left: 'ความตึงผิว', right: 'แรงดึงระหว่างโมเลกุลที่ผิวหน้าซึ่งโมเลกุลข้างในดึงลงมา' }
      - { left: 'ความดันไอ', right: 'ความดันจากโมเลกุลที่หนีจากของเหลวไปเป็นไอ' }
      - { left: 'จุดเดือดปกติ', right: 'อุณหภูมิที่ความดันไอเท่ากับ 1 atm' }
    hints:
      - 'สมบัติที่เกี่ยวกับการไหลคือความหนืด'
      - 'จุดเดือดขึ้นกับการที่ความดันไอเท่ากับความดันรอบข้าง'
    solution: 'ความหนืดเกี่ยวกับการไหล ความตึงผิวเกี่ยวกับโมเลกุลที่ผิว ความดันไอเกี่ยวกับการระเหย และจุดเดือดเกิดเมื่อความดันไอเท่ากับความดันภายนอก'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.states.real-gases-phase-diagrams.p008
    topics: [chemistry.states.real-gases-phase-diagrams]
    difficulty: 3
    type: numeric
    stem: 'ความดันไอของน้ำที่ 100 °C เท่ากับ 101.3 kPa และ $\Delta H_{vap} = 40.66$ kJ/mol ถ้าถือว่า $\Delta H_{vap}$ คงที่ จงคำนวณความดันไอของน้ำที่ 90 °C (ตอบเป็น kPa) กำหนด $R = 8.314$ J/(mol·K)'
    answer: { value: 70.6, tolerance: 0.5, unit: kPa }
    hints:
      - 'ใช้สมการเคลาซิอุส–คลาเปรอง $\ln\frac{P_2}{P_1} = -\frac{\Delta H}{R}\left(\frac{1}{T_2} - \frac{1}{T_1}\right)$ โดยเปลี่ยนอุณหภูมิเป็นเคลวินก่อน'
      - 'อุณหภูมิที่ต่ำกว่าจะให้ความดันไอต่ำกว่า จึงต้องได้ค่าที่น้อยกว่า 101.3 kPa'
    misconceptions:
      - { match: 145.3, feedback: 'สลับเครื่องหมายในสมการ ทำให้ความดันไอที่ 90 °C สูงกว่าที่ 100 °C ซึ่งไม่สมเหตุสมผล' }
    solution: '$T_1 = 373.15$ K $T_2 = 363.15$ K $\ln(P_2/101.3) = -(40660/8.314)(1/363.15 - 1/373.15) = -0.3609$ จึง $P_2 = 101.3 \times e^{-0.3609} = 70.6$ kPa (ค่าที่วัดจริงประมาณ 70.2 kPa)'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.states.real-gases-phase-diagrams.p009
    topics: [chemistry.states.real-gases-phase-diagrams]
    difficulty: 3
    type: mcq
    stem: 'เหตุใดน้ำแข็งแห้ง ($\mathrm{CO_2}$ แข็ง) ที่ความดัน 1 atm จึงระเหิดเป็นแก๊สโดยไม่หลอมเหลว'
    choices:
      - { id: a, text: 'จุดสามเฟสของ $\mathrm{CO_2}$ อยู่ที่ความดันสูงกว่า 1 atm ที่ 1 atm จึงไม่มีของเหลวเสถียร', correct: true, feedback: 'ถูก จุดสามเฟสอยู่ที่ประมาณ 5.1 atm ความดันต่ำกว่าจึงข้ามจากของแข็งเป็นแก๊สตรง' }
      - { id: b, text: 'น้ำแข็งแห้งมีจุดเดือดต่ำกว่าอุณหภูมิห้องเท่านั้น', feedback: 'จุดเดือดไม่ใช่เหตุผลหลัก เหตุผลคือความดันเมื่อเทียบกับจุดสามเฟส' }
      - { id: c, text: 'น้ำแข็งแห้งไม่มีแรงระหว่างโมเลกุลเลย', feedback: 'CO₂ มีแรงระหว่างโมเลกุลอยู่ แต่เหตุผลการระเหิดต่างออกไป' }
      - { id: d, text: 'น้ำแข็งแห้งมีความหนาแน่นสูงกว่าน้ำ', feedback: 'ความหนาแน่นไม่ได้ทำให้เกิดการระเหิด' }
    hints:
      - 'เทียบความดันที่ 1 atm กับความดันของจุดสามเฟสของ $\mathrm{CO_2}$'
      - 'ถ้าความดันต่ำกว่าจุดสามเฟส ของแข็งจะเปลี่ยนเป็นแก๊สโดยตรง'
    solution: 'จุดสามเฟสของ $\mathrm{CO_2}$ ประมาณ $5.1$ atm ที่ 1 atm ซึ่งต่ำกว่าจุดสามเฟส ของแข็งจึงระเหิดได้โดยไม่ผ่านเฟสของเหลว'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.states.real-gases-phase-diagrams.p010
    topics: [chemistry.states.real-gases-phase-diagrams]
    difficulty: 3
    type: mcq
    stem: 'จุดวิกฤตของสารหมายถึงสภาวะใด'
    choices:
      - { id: a, text: 'อุณหภูมิและความดันที่ของเหลวกับแก๊สแยกไม่ออก และสารเป็นของไหลวิกฤตยิ่งยวด', correct: true, feedback: 'ถูก เหนืออุณหภูมิวิกฤต ไม่ว่าจะเพิ่มความดันเท่าใดก็ไม่เกิดการควบแน่นเป็นของเหลวแยกออกมา' }
      - { id: b, text: 'จุดที่ของแข็ง ของเหลว และแก๊สอยู่ร่วมกัน', feedback: 'นั่นคือจุดสามเฟส ไม่ใช่จุดวิกฤต' }
      - { id: c, text: 'อุณหภูมิที่สารเริ่มหลอมเหลวที่ความดัน 1 atm', feedback: 'เป็นจุดหลอมเหลวปกติ ไม่ใช่จุดวิกฤต' }
      - { id: d, text: 'ความดันที่ของแข็งเริ่มระเหิดเป็นแก๊ส', feedback: 'เป็นความหมายของการระเหิด ไม่ใช่จุดวิกฤต' }
    hints:
      - 'จุดวิกฤตอยู่ที่ปลายสุดของเส้นระเหย'
      - 'ที่จุดนี้ความหนาแน่นของของเหลวกับแก๊สเท่ากัน'
    solution: 'จุดวิกฤตคือจุดสิ้นสุดของเส้นระเหย ที่นั่นความแตกต่างระหว่างของเหลวกับแก๊สหายไป เรียกว่าของไหลวิกฤตยิ่งยวด'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.states.real-gases-phase-diagrams.p011
    topics: [chemistry.states.real-gases-phase-diagrams]
    difficulty: 3
    type: numeric
    stem: 'ต้องใช้ความร้อนเท่าใดเพื่อทำให้น้ำ 36.0 g ที่ 100 °C ระเหยเป็นไอทั้งหมดที่ความดัน 1 atm ถ้า $\Delta H_{vap} = 40.66$ kJ/mol กำหนด $M(\mathrm{H_2O}) = 18.02$ g/mol (ตอบเป็น kJ)'
    answer: { value: 81.2, tolerance: 0.2, unit: kJ }
    hints:
      - 'แปลงมวลน้ำเป็นจำนวนโมลก่อนโดยหารด้วยมวลโมลาร์'
      - 'คูณจำนวนโมลกับ $\Delta H_{vap}$ ต่อโมล'
    misconceptions:
      - { match: 1463.8, feedback: 'ใช้มวลน้ำ 36.0 g แทนจำนวนโมล ค่า $\Delta H_{vap}$ เป็นต่อโมล จึงต้องหาจำนวนโมลก่อน' }
    solution: '$n = 36.0 \div 18.02 = 1.998$ mol $q = 1.998 \times 40.66 = 81.2$ kJ'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.states.real-gases-phase-diagrams.p012
    topics: [chemistry.states.real-gases-phase-diagrams]
    difficulty: 3
    type: mcq
    stem: 'เมื่อให้ความร้อนแก่น้ำแข็งที่อุณหภูมิ 0 °C ที่ความดัน 1 atm จนกลายเป็นน้ำ อุณหภูมิของระบบจะเป็นอย่างไรขณะที่กำลังหลอมเหลว'
