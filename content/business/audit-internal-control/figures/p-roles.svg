<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" font-family="sans-serif" font-size="14">
  <title>หน้าที่ของพนักงานในร้านขายยา (สมมติ)</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="640" height="260" fill="#ffffff"/>
  <text x="320.0" y="24.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">หน้าที่ของพนักงานร้านขายยา (สมมติ)</text>
  <rect x="20" y="40" width="600" height="50" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/>
