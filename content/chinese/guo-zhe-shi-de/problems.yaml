problems:
- id: chinese.grammar.guo-zhe-shi-de.p001
  topics:
  - chinese.grammar.guo-zhe-shi-de
  difficulty: 1
  type: mcq
  stem: 我去过清迈。 (Wǒ qùguo Qīngmài.) แปลว่าอะไร
  choices:
  - id: a
    text: ฉันจะไปเชียงใหม่
    feedback: อนาคตใช้ 要 หรือ 会
  - id: b
    text: ฉันไม่เคยไปเชียงใหม่
    feedback: ไม่เคย ใช้ 没 + กริยา + 过
  - id: c
    text: ฉันเคยไปเชียงใหม่
    correct: true
    feedback: ถูก กริยา + 过 = เคย…
  - id: d
    text: ฉันกำลังไปเชียงใหม่
    feedback: กำลังทำใช้ 在 หรือ 正在
  hints:
  - 过 guo อยู่หลังกริยา 去
  - 过 บอกประสบการณ์ เหมือนคำว่า เคย
  solution: '**ฉันเคยไปเชียงใหม่** 去过 = เคยไป'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.guo-zhe-shi-de.p002
  topics:
  - chinese.grammar.guo-zhe-shi-de
  difficulty: 2
  type: mcq
  stem: '"ฉันเคยกินต้มยำกุ้ง" (冬荫功 dōngyīngōng = ต้มยำกุ้ง) ประโยคใดถูกต้อง'
  choices:
  - id: a
    text: 我过吃冬荫功。
    feedback: ภาษาไทยวาง เคย หน้ากริยา แต่ภาษาจีนวาง 过 หลังกริยา
  - id: b
    text: 我吃冬荫功过。
    feedback: 过 ต้องติดอยู่หลังกริยา ก่อนกรรม
  - id: c
    text: 我是吃过的冬荫功。
    feedback: ไม่ต้องใช้ 是…的 ในประโยคบอกประสบการณ์ธรรมดา
  - id: d
    text: 我吃过冬荫功。
    correct: true
    feedback: ถูก 过 อยู่หลังกริยา 吃
  hints:
  - เคย ภาษาไทยอยู่หน้ากริยา
  - 过 ภาษาจีนอยู่หลังกริยาทันที
  solution: '**我吃过冬荫功。** Wǒ chīguo dōngyīngōng.'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.guo-zhe-shi-de.p003
  topics:
  - chinese.grammar.guo-zhe-shi-de
  difficulty: 2
  type: hanzi
  stem: เขียนอักษร 过 (guò) ตามลำดับขีด
  character: 过
  pinyin: guò
  meaning: ผ่าน ข้าม (ใช้เป็นคำบอกประสบการณ์ guo)
  hints:
  - 过 = 寸 + 辶 (การเดิน) รวม 6 ขีด
  - 辶 ที่โอบอยู่ด้านล่างซ้ายเขียนทีหลังสุด
  solution: '寸: 横 → 竖钩 → 点 แล้ว 辶: 点 → 横折折撇 → 平捺 รวม 6 ขีด'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.guo-zhe-shi-de.p004
  topics:
  - chinese.grammar.guo-zhe-shi-de
  difficulty: 2
  type: match
  stem: จับคู่ประโยคที่มี 着 กับความหมาย
  pairs:
  - left: 门开着。
    right: ประตูเปิดอยู่
  - left: 他坐着。
    right: เขานั่งอยู่
  - left: 墙上挂着一张地图。
    right: บนผนังแขวนแผนที่ไว้หนึ่งแผ่น
  - left: 她穿着校服。
    right: เธอสวมชุดนักเรียนอยู่
  hints:
  - 着 zhe หลังกริยา บอกสภาพที่ค้างอยู่ เหมือน …อยู่ ในภาษาไทย
  - 挂 guà = แขวน 穿 chuān = สวม
  solution: 门开着 ประตูเปิดอยู่ · 他坐着 เขานั่งอยู่ · 墙上挂着一张地图 บนผนังแขวนแผนที่ · 她穿着校服 เธอสวมชุดนักเรียน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.guo-zhe-shi-de.p005
  topics:
  - chinese.grammar.guo-zhe-shi-de
  difficulty: 3
  type: order
  stem: เพื่อนชาวจีนเพิ่งมาไทยครั้งแรก เรียงคำเป็นประโยค "ฉันไม่เคยกินทุเรียน" (榴莲 liúlián = ทุเรียน)
  items:
  - 我
  - 没
  - 吃
  - 过
  - 榴莲
  hints:
  - ไม่เคย = 没 + กริยา + 过
  - 没 อยู่หน้ากริยา 过 อยู่หลังกริยา
  solution: '**我没吃过榴莲。** Wǒ méi chīguo liúlián.'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.guo-zhe-shi-de.p006
  topics:
  - chinese.grammar.guo-zhe-shi-de
  difficulty: 3
  type: mcq
  stem: '"ฉันไม่เคยไปปักกิ่ง" ประโยคใดถูกต้อง'
  choices:
  - id: a
    text: 我不去过北京。
    feedback: ประสบการณ์ปฏิเสธด้วย 没 ไม่ใช่ 不
  - id: b
    text: 我没去北京过。
    feedback: 过 ต้องติดหลังกริยา
  - id: c
    text: 我没去了北京。
    feedback: 了 ไม่ใช้กับ 没 และ 了 ไม่ได้บอกประสบการณ์
  - id: d
    text: 我没去过北京。
    correct: true
    feedback: ถูก ปฏิเสธ 过 ด้วย 没 และยังคง 过 ไว้
  hints:
  - ประสบการณ์เป็นเรื่องที่เกิดหรือไม่เกิดมาแล้ว
  - ต่างจาก 了 ตรงที่ 过 ยังอยู่ในประโยคปฏิเสธ
  solution: '**我没去过北京。** Wǒ méi qùguo Běijīng. (了 หายไปเมื่อปฏิเสธ แต่ 过 ยังอยู่)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.guo-zhe-shi-de.p007
  topics:
  - chinese.grammar.guo-zhe-shi-de
  difficulty: 3
  type: mcq
  stem: เพื่อนถามว่า 你是怎么来的？ (Nǐ shì zěnme lái de?) เพื่อนอยากรู้อะไร
  choices:
  - id: a
    text: เรามาด้วยวิธีใด (เช่น นั่งรถไฟ)
    correct: true
    feedback: ถูก 是…的 + 怎么 ถามวิธีการของเรื่องที่เกิดขึ้นแล้ว
  - id: b
    text: เราจะมาหรือไม่
    feedback: 是…的 ใช้กับเรื่องที่เกิดแล้ว ไม่ใช่อนาคต
  - id: c
    text: ทำไมเราไม่มา
    feedback: ไม่มีคำปฏิเสธ
  - id: d
    text: เรามาเมื่อไร
    feedback: ถามเวลาใช้ 什么时候
  hints:
  - เพื่อนรู้แล้วว่าเรามาถึง
  - 怎么 = อย่างไร
  solution: ถาม **วิธีการ** ที่มา ตอบเช่น 我是坐火车来的。 (ฉันนั่งรถไฟมา)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.guo-zhe-shi-de.p008
  topics:
  - chinese.grammar.guo-zhe-shi-de
  difficulty: 3
  type: mcq
  stem: เจ้าหน้าที่ที่สนามบินสุวรรณภูมิถามนักท่องเที่ยวชาวจีนว่า 你是什么时候来泰国的？ คำตอบใดเหมาะที่สุด
  choices:
  - id: a
    text: 我是下个星期来的。
    feedback: 是…的 ใช้กับเรื่องที่เกิดแล้ว 下个星期 คืออนาคต
  - id: b
    text: 我是上个星期来的。
    correct: true
    feedback: ถูก ตอบเวลาด้วยรูป 是 + เวลา + กริยา + 的
  - id: c
    text: 我上个星期来。
    feedback: ขาด 的 และไม่มีคำบอกว่าเกิดแล้ว ตอบคำถาม 是…的 ควรใช้รูปเดียวกัน
  - id: d
    text: 我是坐飞机来的。
    feedback: ตอบวิธีการ แต่คำถามถามเวลา (什么时候)
  hints:
  - 什么时候 = เมื่อไร
  - 'คำตอบใช้รูปเดียวกับคำถาม: 是 + เวลา + 来 + 的'
  solution: '**我是上个星期来的。** Wǒ shì shàng ge xīngqī lái de. (上个星期 = สัปดาห์ที่แล้ว)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.guo-zhe-shi-de.p009
  topics:
  - chinese.grammar.guo-zhe-shi-de
  difficulty: 3
  type: numeric
  stem: เพื่อนชาวจีนเล่าว่า 我去过北京三次，去过上海两次。 (次 cì = ครั้ง) รวมแล้วเพื่อนเคยไปสองเมืองนี้กี่ครั้ง
  answer:
    value: 5
    unit: ครั้ง
  misconceptions:
  - match: 2
    feedback: 2 คือจำนวนเมือง ต้องนับครั้งของทั้งสองเมืองรวมกัน
  - match: 3
    feedback: อย่าลืมนับเซี่ยงไฮ้ 两次 ด้วย
  hints:
  - 三次 = 3 ครั้ง 两次 = 2 ครั้ง
  - บวกจำนวนครั้งของทั้งสองเมือง
  solution: $3 + 2 = 5$ ครั้ง (จำนวนครั้ง + 次 วางหลัง 过)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.guo-zhe-shi-de.p010
  topics:
  - chinese.grammar.guo-zhe-shi-de
  difficulty: 4
  type: mcq
  stem: 他去了北京。 กับ 他去过北京。 ต่างกันอย่างไร
  choices:
  - id: a
    text: ทั้งสองประโยคหมายถึง เคยไป เหมือนกัน
    feedback: 了 ไม่ได้บอกประสบการณ์ แค่บอกว่าไปแล้ว
  - id: b
    text: 去了 = เคยไป · 去过 = กำลังไป
    feedback: 过 ไม่ได้บอกว่ากำลังทำ
  - id: c
    text: 去过 ใช้กับอนาคต
    feedback: 过 ใช้กับประสบการณ์ในอดีต
  - id: d
    text: 去了 = ไปแล้ว อาจยังอยู่ที่ปักกิ่ง · 去过 = เคยไป เป็นประสบการณ์ ตอนนี้กลับมาแล้ว
    correct: true
    feedback: ถูก 了 บอกเหตุการณ์ที่เกิด 过 บอกประสบการณ์ที่จบไปแล้ว
  hints:
  - ดูภาพเส้นเวลาในบทเรียน
  - ถ้าเพื่อนบอก 他去了北京 แล้วเราอยากเจอเขาวันนี้ เขาอยู่ที่ไหน
  solution: '**去了** บอกว่าเขาไปแล้ว (อาจยังอยู่ที่นั่น) **去过** บอกว่าเขามีประสบการณ์เคยไป และการไปครั้งนั้นจบแล้ว'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.guo-zhe-shi-de.p011
  topics:
  - chinese.grammar.guo-zhe-shi-de
  difficulty: 4
  type: text
  stem: เขียน "ฉันมาโดยรถไฟ" แบบเน้นวิธีการด้วย 是…的 (坐火车 zuò huǒchē = นั่งรถไฟ; พิมพ์อักษรจีน)
  accepted:
  - 我是坐火车来的
  - 我是坐火车来的。
  - 我是坐火车来的.
  - 我是坐火车来的？
  - 我是坐火车来的?
  - 我坐火车来的
  - 我坐火车来的。
  - 我坐火车来的.
  - 我坐火车来的？
  - 我坐火车来的?
  - 我是坐火車來的
  - 我是坐火車來的。
  - 我是坐火車來的.
  - 我是坐火車來的？
  - 我是坐火車來的?
  - 我坐火車來的
  - 我坐火車來的。
  - 我坐火車來的.
  - 我坐火車來的？
  - 我坐火車來的?
  misconceptions:
  - match: 我是来坐火车的
    feedback: 'วิธีการวางหน้ากริยา 来: 是 + 坐火车 + 来 + 的'
  - match: 我是来坐火车的。
    feedback: 'วิธีการวางหน้ากริยา 来: 是 + 坐火车 + 来 + 的'
  - match: 我是来坐火车的？
    feedback: 'วิธีการวางหน้ากริยา 来: 是 + 坐火车 + 来 + 的'
  - match: 我是坐火车来
    feedback: ขาด 的 ท้ายประโยค
  - match: 我是坐火车来。
    feedback: ขาด 的 ท้ายประโยค
  - match: 我是坐火车来？
    feedback: ขาด 的 ท้ายประโยค
  - match: 我坐火车来了
    feedback: ประโยคนี้บอกว่ามาแล้ว แต่ไม่ได้เน้นวิธีการด้วย 是…的
  - match: 我坐火车来了。
    feedback: ประโยคนี้บอกว่ามาแล้ว แต่ไม่ได้เน้นวิธีการด้วย 是…的
  - match: 我坐火车来了？
    feedback: ประโยคนี้บอกว่ามาแล้ว แต่ไม่ได้เน้นวิธีการด้วย 是…的
  hints:
  - 'รูป: ประธาน + 是 + รายละเอียดที่เน้น + กริยา + 的'
  - รายละเอียดที่เน้นคือ 坐火车
  solution: '**我是坐火车来的。** Wǒ shì zuò huǒchē lái de. (是 ในประโยคบอกเล่าละได้)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.guo-zhe-shi-de.p012
  topics:
  - chinese.grammar.guo-zhe-shi-de
  difficulty: 4
  type: mcq
  stem: '"ฉันไม่ได้มาโดยเครื่องบิน" (เน้นว่าวิธีการไม่ใช่เครื่องบิน) ประโยคใดถูกต้อง'
  choices:
  - id: a
    text: 我不坐飞机来的。
    feedback: 'ประโยคปฏิเสธต้องคง 是 ไว้: 不是…的'
  - id: b
    text: 我不是坐飞机来的。
    correct: true
    feedback: ถูก ปฏิเสธ 是…的 ด้วย 不是 และต้องมี 是 เสมอ
  - id: c
    text: 我没是坐飞机来的。
    feedback: 是 ปฏิเสธด้วย 不 ไม่ใช่ 没
  - id: d
    text: 我是不坐飞机来的。
    feedback: 不 อยู่หน้า 是 ไม่ใช่หลัง
  hints:
  - รูปปฏิเสธคือ 不是…的
  - ในประโยคบอกเล่าละ 是 ได้ แต่ในประโยคปฏิเสธละไม่ได้
  solution: '**我不是坐飞机来的。** Wǒ bú shì zuò fēijī lái de.'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.guo-zhe-shi-de.p013
  topics:
  - chinese.grammar.guo-zhe-shi-de
  difficulty: 4
  type: mcq
  stem: 他笑着说："欢迎！" (欢迎 huānyíng = ยินดีต้อนรับ) หมายความว่าอะไร
  choices:
  - id: a
    text: เขาเคยยิ้มและพูด
    feedback: เคย ใช้ 过
  - id: b
    text: เขาจะยิ้มและพูด
    feedback: ไม่มีคำบอกอนาคต
  - id: c
    text: เขายิ้มพลางพูดว่า "ยินดีต้อนรับ"
    correct: true
    feedback: ถูก กริยา1 + 着 + กริยา2 = ทำ 2 ขณะอยู่ในท่าทาง 1
  - id: d
    text: เขาพูดแล้วจึงยิ้ม
    feedback: 着 ไม่ได้บอกลำดับก่อนหลัง แต่บอกว่าทำพร้อมกัน
  hints:
  - 笑 = ยิ้ม หัวเราะ
  - V1着 V2 บอกท่าทางที่ค้างอยู่ระหว่างทำอีกอย่าง
  solution: '**เขายิ้มพลางพูดว่า "ยินดีต้อนรับ"** 笑着说 = ยิ้มขณะพูด (เทียบ 坐着吃饭 นั่งกินข้าว)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.guo-zhe-shi-de.p014
  topics:
  - chinese.grammar.guo-zhe-shi-de
  difficulty: 4
  type: mcq
  stem: ห้องเรียนภาษาจีนที่โรงเรียนในภูเก็ต ครูถามว่า 黑板上写着什么？ (黑板 hēibǎn = กระดานดำ) คำตอบใดถูกต้อง ถ้าบนกระดานมีคำว่า 你好
  choices:
  - id: a
    text: 黑板上写过"你好"。
    feedback: 过 = เคยเขียน (ตอนนี้อาจลบไปแล้ว) ไม่ตรงกับสภาพตอนนี้
  - id: b
    text: '"你好"写着在黑板上。'
    feedback: 'รูปนี้ขึ้นต้นด้วยสถานที่: 黑板上写着…'
  - id: c
    text: 黑板上是写的"你好"。
    feedback: ไม่ใช่การเน้นรายละเอียดของเหตุการณ์ในอดีต จึงไม่ใช้ 是…的
  - id: d
    text: 黑板上写着"你好"。
    correct: true
    feedback: ถูก สถานที่ + กริยา + 着 + สิ่งของ บอกว่าที่นั่นมีอะไรอยู่ในสภาพนั้น
  hints:
