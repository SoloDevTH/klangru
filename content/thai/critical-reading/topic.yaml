id: thai.reading.critical-reading
subject: thai
title: { th: "การอ่านเชิงวิเคราะห์ วิจารณ์ และประเมินค่า", en: "Analytical and critical reading" }
summary: แปลความ ตีความ ขยายความ ระบุการชวนเชื่อและเหตุผลวิบัติ ประเมินความถูกต้องของข้อมูลและกราฟ วิจารณ์ลำดับความและความเป็นไปได้ เปรียบเทียบงานเขียน โต้แย้งพร้อมเสนอความคิดใหม่ และประเมินภาษาในสื่อ
difficulty: 6
minutes: 40
prerequisites: [thai.reading.fact-opinion, thai.reading.prediction-inference]
encompasses:
  - { id: thai.reading.fact-opinion, weight: 0.4 }
  - { id: thai.reading.prediction-inference, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: three-levels.svg
    alt: "ประโยค เขาใจกว้างดั่งมหาสมุทร อ่านได้ 3 ระดับ กล่องแรก แปลความ เรียบเรียงใหม่ ความหมายคงเดิม ได้ว่า เขาใจกว้างมาก กล่องที่สอง ตีความ หาความหมายแฝง เจตนา ได้ว่า ผู้เขียนชื่นชมเขา กล่องที่สาม ขยายความ อธิบายเพิ่ม ยกตัวอย่าง ได้ว่า ให้อภัยคนทำผิด รับฟังความเห็นต่าง มีลูกศรต่อกันและเขียนว่าลึกขึ้นทีละขั้น"
    caption: "แปลความ ตีความ ขยายความ ลึกขึ้นทีละขั้น"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: วิเคราะห์บทความแสดงความคิดเห็น
    problem: "วิเคราะห์บทความสมมติ ถึงเวลาเลื่อนเวลาเข้าเรียน (ดูภาพในโจทย์ข้อ 4) ว่าส่วนใดหนักแน่น ส่วนใดเป็นเหตุผลวิบัติ"
    steps:
      - text: "หาข้ออ้างหลัก: ประโยค (1) โรงเรียนทุกแห่งควรเลื่อนเวลาเข้าเรียนเป็นเก้าโมง"
      - text: "หาหลักฐาน: ประโยค (2) อ้างงานวิจัย มีน้ำหนักแต่ไม่บอกที่มา ควรถามว่างานวิจัยใด"
        why: "หลักฐานที่ดีต้องตรวจย้อนได้"
      - text: "ตรวจเหตุผล: (3) สรุปเกินข้อมูล · (4) โจมตีตัวบุคคล · (5) มีทางเลือกแค่สองทาง · (6) คำดูดีแต่กลวง"
      - text: "หาสิ่งที่ไม่ได้พูด: ผลต่อผู้ปกครองที่ทำงานเช้า และเวลาเลิกเรียนที่อาจเลื่อนตาม"
      - text: "ประเมินรวม: ข้อเสนอน่าสนใจและมีหลักฐานหนึ่งข้อ แต่เหตุผลส่วนใหญ่อ่อนและเสนอข้อมูลด้านเดียว"
    answer: "ประโยค (2) เป็นหลักฐานที่ควรตรวจที่มา (3)–(6) เป็นเหตุผลวิบัติหรือคำกลวง บทความขาดผลกระทบด้านอื่น จึงยังไม่หนักแน่นพอ"
  - { type: check, problem: thai.reading.critical-reading.p004, prompt: "ข้อมูลมาจากกี่คน ข้อสรุปพูดถึงกี่คน" }
  - type: worked-example
    title: อ่านกราฟให้ไม่ถูกหลอกตา
    problem: "กราฟสมมติแสดงคะแนนเฉลี่ย โรงเรียน ก 92 โรงเรียน ข 95 แกนตั้งเริ่มที่ 90 (ดูภาพในโจทย์ข้อ 8) ประเมินว่ากราฟสื่อความต่างตรงหรือไม่"
    steps:
      - text: "ดูแกน: แกนตั้งเริ่มที่ 90 ไม่ใช่ 0"
      - text: "ความสูงที่วาด: แท่ง ก = 92 − 90 = 2 แท่ง ข = 95 − 90 = 5 ภาพจึงต่างกัน 5 ÷ 2 = 2.5 เท่า"
      - text: "ความต่างจริง: 95 − 92 = 3 คะแนน หรือ 3 ÷ 92 × 100 ≈ ร้อยละ 3.26"
        why: "เทียบกับค่าของโรงเรียน ก เพราะถามว่า ข สูงกว่า ก เท่าใด"
      - text: "ดูแหล่ง: กราฟมาจากเพจของโรงเรียน ข ซึ่งอาจอยากให้ตนดูดี"
    answer: "กราฟทำให้ความต่างดูมากเกินจริง ความต่างจริงราวร้อยละ 3 ควรวาดแกนเริ่มที่ 0 หรือบอกตัวเลขให้ชัด"
  - { type: check, problem: thai.reading.critical-reading.p008, prompt: "ดูตัวเลขที่จุดเริ่มของแกนตั้ง" }
glossary:
  - { term: แปลความ, definition: "เรียบเรียงข้อความใหม่ด้วยคำของตน ความหมายคงเดิม" }
  - { term: ตีความ, definition: "หาความหมายที่แฝงอยู่ เจตนา หรือน้ำเสียงของผู้เขียน โดยมีหลักฐานจากตัวบท" }
  - { term: ขยายความ, definition: "อธิบายเพิ่มเติมด้วยตัวอย่าง เหตุผล หรือรายละเอียด" }
  - { term: เหตุผลวิบัติ, definition: "การให้เหตุผลที่ผิดพลาด (ศัพท์บัญญัติของ fallacy)" }
  - { term: การชวนเชื่อ, definition: "การโน้มน้าวด้วยกลวิธีที่ปิดบังเหตุผล เช่น ตั้งฉายา เสนอข้อมูลด้านเดียว" }
  - { term: กราฟแกนตัด, definition: "กราฟที่แกนตั้งไม่เริ่มที่ศูนย์ ทำให้ความต่างดูมากกว่าความจริง" }
flashcards:
  - { front: "แปลความ ตีความ ขยายความ", back: "คำของตนความหมายเดิม · ความหมายแฝง · เพิ่มตัวอย่างหรือเหตุผล" }
  - { front: "ใช้ 5 คนสรุปทั้งประเทศ", back: "เหตุผลวิบัติแบบสรุปเกินข้อมูล" }
  - { front: "คนที่ค้านคือคนไม่เข้าใจเด็ก", back: "โจมตีตัวบุคคล" }
  - { front: "ตรวจข้อมูลสนับสนุน", back: "ที่มา ความทันสมัย กลุ่มตัวอย่าง การคำนวณ" }
  - { front: "กราฟแท่งต่างกันมาก", back: "ดูว่าแกนตั้งเริ่มที่ศูนย์หรือไม่" }
