problems:
  - id: biology.genetics.genes-heredity.p001
    topics: [biology.genetics.genes-heredity]
    difficulty: 1
    type: mcq
    stem: "โครงสร้างใดอยู่ในนิวเคลียส ประกอบด้วยดีเอ็นเอพันรอบโปรตีน และเห็นเป็นแท่งได้ชัดขณะเซลล์แบ่งตัว"
    choices:
      - { id: a, text: "โครโมโซม", correct: true }
      - { id: b, text: "ยีน", feedback: "ยีนเป็นเพียงช่วงหนึ่งของดีเอ็นเอ เล็กเกินกว่าจะเห็นเป็นแท่ง" }
      - { id: c, text: "ไรโบโซม", feedback: "ไรโบโซมเป็นออร์แกเนลล์ที่สร้างโปรตีน ไม่ได้ประกอบด้วยดีเอ็นเอพันรอบโปรตีน" }
      - { id: d, text: "เยื่อหุ้มนิวเคลียส", feedback: "เยื่อหุ้มนิวเคลียสเป็นเยื่อที่ล้อมรอบนิวเคลียส ไม่ใช่สารพันธุกรรม" }
    hints:
      - "นึกถึงแบบจำลองห้องสมุดในบทเรียน"
      - "สิ่งที่เปรียบเหมือนหนังสือแต่ละเล่มคืออะไร"
    solution: "โครโมโซมคือดีเอ็นเอสายยาวที่พันรอบโปรตีนจนขดแน่น อยู่ในนิวเคลียส เห็นได้ชัดขณะเซลล์แบ่งตัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.genes-heredity.p002
    topics: [biology.genetics.genes-heredity]
    difficulty: 1
    type: order
    stem: "เรียงสิ่งต่อไปนี้จากเล็กที่สุดไปใหญ่ที่สุด"
    items:
      - "เบส (เช่น A หรือ T)"
      - "ยีน"
      - "โมเลกุลดีเอ็นเอหนึ่งสาย"
      - "นิวเคลียส"
      - "เซลล์"
    hints:
      - "ยีนเป็นช่วงหนึ่งของดีเอ็นเอ"
      - "ดีเอ็นเออยู่ในนิวเคลียส และนิวเคลียสอยู่ในเซลล์"
    solution: "เบส → ยีน (ลำดับเบสช่วงหนึ่ง) → โมเลกุลดีเอ็นเอ (มียีนจำนวนมาก) → นิวเคลียส → เซลล์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.genes-heredity.p003
    topics: [biology.genetics.genes-heredity]
    difficulty: 1
    type: match
    stem: "จับคู่คำศัพท์กับความหมาย"
    pairs:
      - { left: "ยีน", right: "ช่วงหนึ่งของดีเอ็นเอที่ควบคุมลักษณะหนึ่ง" }
      - { left: "แอลลีล", right: "รูปแบบต่าง ๆ ของยีนเดียวกัน เช่น P และ p" }
      - { left: "จีโนไทป์", right: "คู่ของแอลลีล เช่น Pp" }
      - { left: "ฟีโนไทป์", right: "ลักษณะที่ปรากฏ เช่น ดอกสีม่วง" }
    hints:
      - "จีโน มาจากยีน ฟีโน หมายถึงสิ่งที่ปรากฏ"
      - "P และ p เป็นยีนสีดอกเหมือนกันแต่ต่างรูปแบบ"
    solution: "ยีนคือช่วงของดีเอ็นเอ แอลลีลคือรูปแบบของยีน จีโนไทป์คือคู่ของแอลลีล และฟีโนไทป์คือลักษณะที่ปรากฏ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.genes-heredity.p004
    topics: [biology.genetics.genes-heredity]
    difficulty: 1
    type: numeric
    stem: "เซลล์ร่างกายของคนมีโครโมโซม 46 แท่ง อสุจิหนึ่งเซลล์มีโครโมโซมกี่แท่ง"
    answer: { value: 23, unit: แท่ง }
    hints:
      - "อสุจิสร้างด้วยไมโอซิส"
      - "ไมโอซิสลดจำนวนโครโมโซมลงครึ่งหนึ่ง"
    misconceptions:
      - { match: 46, feedback: "46 คือจำนวนในเซลล์ร่างกาย ถ้าอสุจิมี 46 ลูกจะมี 92 แท่ง" }
      - { match: 92, feedback: "จำนวนโครโมโซมลดลง ไม่ได้เพิ่มขึ้น" }
    solution: "ไมโอซิสลดจำนวนโครโมโซมลงครึ่งหนึ่ง อสุจิจึงมี $46 \\div 2 = 23$ แท่ง เมื่อปฏิสนธิกับเซลล์ไข่ (23 แท่ง) ไซโกตจึงมี 46 แท่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.genes-heredity.p005
    topics: [biology.genetics.genes-heredity]
    difficulty: 2
    type: mcq
    stem: "ถั่วลันเตาที่มีจีโนไทป์ Pp จะมีดอกสีอะไร (P ดอกสีม่วง เด่นต่อ p ดอกสีขาว)"
    choices:
      - { id: a, text: "สีม่วง", correct: true }
      - { id: b, text: "สีขาว", feedback: "แอลลีลด้อย p แสดงออกเมื่อเป็น pp เท่านั้น" }
      - { id: c, text: "สีม่วงอ่อน กึ่งกลางระหว่างม่วงกับขาว", feedback: "หัวข้อนี้เป็นกรณีที่แอลลีลเด่นข่มแอลลีลด้อยอย่างสมบูรณ์ จึงไม่มีสีกึ่งกลาง" }
    hints:
      - "Pp มีแอลลีลเด่นอยู่หนึ่งแอลลีล"
      - "แอลลีลเด่นแสดงออกแม้มีเพียงหนึ่งแอลลีล"
    solution: "P เด่นข่ม p อย่างสมบูรณ์ ต้น Pp จึงมีดอกสีม่วงเหมือนต้น PP"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.genes-heredity.p006
    topics: [biology.genetics.genes-heredity]
    difficulty: 2
    type: text
    stem: "ถั่วลันเตาดอกสีขาวมีจีโนไทป์เป็นฮอมอไซกัสหรือเฮเทอโรไซกัส (P ดอกสีม่วง เด่นต่อ p ดอกสีขาว)"
    accepted: ["ฮอมอไซกัส", "ฮอมอไซกัสด้อย", "homozygous", "homozygous recessive"]
    hints:
      - "ดอกสีขาวเป็นลักษณะด้อย"
      - "ลักษณะด้อยแสดงออกเมื่อแอลลีลทั้งคู่เป็นแอลลีลด้อย แล้วแอลลีลทั้งคู่เหมือนหรือต่างกัน"
    misconceptions:
      - { match: "เฮเทอโรไซกัส", feedback: "เฮเทอโรไซกัส (Pp) มีแอลลีลเด่นอยู่ จึงมีดอกสีม่วง" }
    solution: "ดอกสีขาวเป็นลักษณะด้อย จึงต้องมีจีโนไทป์ pp ซึ่งแอลลีลทั้งคู่เหมือนกัน เป็นฮอมอไซกัสด้อย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.genes-heredity.p007
    topics: [biology.genetics.genes-heredity]
    difficulty: 2
    type: numeric
    stem: "ผสมถั่วลันเตาดอกสีม่วง Pp กับดอกสีม่วง Pp ลูกแต่ละต้นมีโอกาสเป็นดอกสีขาวร้อยละเท่าใด"
    answer: { value: 25, unit: "%" }
    hints:
      - "วาดตารางพันเนตต์ 2 × 2"
      - "นับช่องที่เป็น pp แล้วหารด้วยจำนวนช่องทั้งหมด"
    misconceptions:
      - { match: 75, feedback: "นี่คือโอกาสเป็นดอกสีม่วง" }
      - { match: 50, feedback: "50% คือโอกาสเป็น Pp ต้องหาโอกาสเป็น pp" }
    solution: "ตารางพันเนตต์ได้ PP Pp Pp pp ดอกสีขาว (pp) มี 1 ใน 4 ช่อง $= \\frac14 = 25\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.genes-heredity.p008
    topics: [biology.genetics.genes-heredity]
    difficulty: 2
    type: mcq
    stem: "ภาพถ่ายการเลี้ยวเบนของรังสีเอกซ์ที่เป็นหลักฐานสำคัญว่าดีเอ็นเอเป็นเกลียว ซึ่งวอตสันและคริกนำไปใช้สร้างแบบจำลองเกลียวคู่ เป็นผลงานของใคร"
    choices:
      - { id: a, text: "โรซาลินด์ แฟรงคลิน", correct: true }
      - { id: b, text: "เกรกอร์ เมนเดล", feedback: "เมนเดลศึกษาการถ่ายทอดลักษณะของถั่วลันเตา ก่อนที่จะมีใครรู้จักดีเอ็นเอ" }
      - { id: c, text: "เจมส์ วอตสัน และฟรานซิส คริก", feedback: "วอตสันและคริกสร้างแบบจำลอง โดยใช้ข้อมูลรังสีเอกซ์จากห้องปฏิบัติการของวิลคินส์และแฟรงคลิน" }
      - { id: d, text: "ชาลส์ ดาร์วิน", feedback: "ดาร์วินเสนอทฤษฎีการคัดเลือกโดยธรรมชาติ ไม่ได้ศึกษาโครงสร้างดีเอ็นเอ" }
    hints:
      - "ผู้ที่สร้างแบบจำลองกับผู้ที่ถ่ายภาพเป็นคนละคนกัน"
      - "เธอทำงานในห้องปฏิบัติการเดียวกับมอริซ วิลคินส์"
    solution: "โรซาลินด์ แฟรงคลินถ่ายภาพการเลี้ยวเบนของรังสีเอกซ์ที่แสดงว่าดีเอ็นเอเป็นเกลียว วอตสันและคริกใช้ข้อมูลนี้เสนอแบบจำลองเกลียวคู่ในปี ค.ศ. 1953"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.genes-heredity.p009
    topics: [biology.genetics.genes-heredity]
    difficulty: 3
    type: numeric
    stem: "ผสมถั่วลันเตาดอกสีม่วง Pp กับดอกสีขาว pp ได้เมล็ด 200 เมล็ด นำไปปลูกทั้งหมด คาดว่าจะได้ต้นดอกสีม่วงประมาณกี่ต้น"
    answer: { value: 100, unit: ต้น }
    hints:
      - "ต้น pp สร้างเซลล์สืบพันธุ์ได้แบบเดียวคือ p"
      - "หาสัดส่วนของลูกดอกสีม่วงจากตารางพันเนตต์ แล้วคูณด้วย 200"
    misconceptions:
      - { match: 150, feedback: "ใช้อัตราส่วน 3 : 1 ซึ่งเป็นของ Pp × Pp แต่ข้อนี้ผสมกับ pp" }
      - { match: 200, feedback: "ลูกไม่ได้เป็นดอกสีม่วงทุกต้น เพราะต้นม่วงเป็น Pp ไม่ใช่ PP" }
    solution: "Pp × pp ได้ Pp : pp = 1 : 1 ดอกสีม่วงจึงมีโอกาส $\\frac12$ คาดว่าได้ $200 \\times \\frac12 = 100$ ต้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.genes-heredity.p010
    topics: [biology.genetics.genes-heredity]
    difficulty: 3
    type: mcq
    stem: "อัตราส่วนจีโนไทป์ของลูกจากการผสม Pp × Pp คือข้อใด"
    choices:
      - { id: a, text: "PP : Pp : pp = 1 : 2 : 1", correct: true }
      - { id: b, text: "ม่วง : ขาว = 3 : 1", feedback: "นี่คืออัตราส่วนฟีโนไทป์ ไม่ใช่จีโนไทป์" }
      - { id: c, text: "Pp : pp = 1 : 1 (ครึ่งหนึ่งเป็นเฮเทอโรไซกัส)", feedback: "นี่คือผลของ Pp × pp" }
      - { id: d, text: "PP : pp = 1 : 1 (มีแต่ฮอมอไซกัส)", feedback: "ลืมช่อง Pp สองช่องในตารางพันเนตต์" }
    hints:
      - "จีโนไทป์คือคู่ของแอลลีล ไม่ใช่สีดอก"
      - "นับจำนวนช่องของ PP Pp และ pp ในตาราง"
    solution: "ตารางพันเนตต์มี PP 1 ช่อง Pp 2 ช่อง pp 1 ช่อง อัตราส่วนจีโนไทป์จึงเป็น 1 : 2 : 1 ส่วนฟีโนไทป์เป็น 3 : 1"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.genes-heredity.p011
    topics: [biology.genetics.genes-heredity]
    difficulty: 3
    type: mcq
    stem: "ข้อใดเปรียบเทียบไมโทซิสกับไมโอซิสได้ถูกต้อง"
    choices:
      - { id: a, text: "ไมโทซิสได้ 2 เซลล์ที่มีโครโมโซมเท่าเดิม ไมโอซิสได้ 4 เซลล์ที่มีโครโมโซมครึ่งหนึ่ง", correct: true }
      - { id: b, text: "ไมโทซิสได้ 4 เซลล์ ไมโอซิสได้ 2 เซลล์", feedback: "สลับกัน ไมโทซิสได้ 2 เซลล์ ไมโอซิสได้ 4 เซลล์" }
      - { id: c, text: "ทั้งสองแบบได้เซลล์ที่มีพันธุกรรมเหมือนเซลล์เดิม", feedback: "ไมโอซิสได้เซลล์ที่มีชุดโครโมโซมผสมต่างกัน จึงไม่เหมือนเซลล์เดิม" }
      - { id: d, text: "ไมโอซิสเกิดในเซลล์ผิวหนังเพื่อซ่อมแซมบาดแผล", feedback: "การซ่อมแซมใช้ไมโทซิส ไมโอซิสเกิดในอวัยวะสืบพันธุ์" }
    hints:
      - "ไมโอซิสใช้สร้างเซลล์สืบพันธุ์"
      - "เซลล์สืบพันธุ์ต้องมีโครโมโซมครึ่งหนึ่ง"
    solution: "ไมโทซิสแบ่งครั้งเดียวได้ 2 เซลล์ที่เหมือนเดิม ใช้เจริญเติบโตและซ่อมแซม ไมโอซิสได้ 4 เซลล์ที่มีโครโมโซมครึ่งหนึ่งและพันธุกรรมต่างกัน ใช้สร้างเซลล์สืบพันธุ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.genes-heredity.p012
    topics: [biology.genetics.genes-heredity]
    difficulty: 3
    type: numeric
    stem: "ลักษณะข้าวเหนียวควบคุมด้วยแอลลีลด้อย wx ส่วนข้าวเจ้าควบคุมด้วยแอลลีลเด่น Wx ชาวนาปล่อยให้ต้นข้าวเจ้าที่มีจีโนไทป์ Wxwx ผสมตัวเอง ได้เมล็ด 1,200 เมล็ด คาดว่าจะเป็นเมล็ดข้าวเหนียวประมาณกี่เมล็ด"
    answer: { value: 300, unit: เมล็ด }
    hints:
      - "การผสมตัวเองของ Wxwx เหมือนกับ Wxwx × Wxwx"
      - "ข้าวเหนียวต้องเป็น wxwx หาโอกาสแล้วคูณด้วยจำนวนเมล็ด"
    misconceptions:
      - { match: 900, feedback: "นี่คือจำนวนเมล็ดข้าวเจ้า ข้าวเหนียวเป็นลักษณะด้อย" }
      - { match: 600, feedback: "1/2 คือโอกาสของ Wxwx ข้าวเหนียวต้องเป็น wxwx" }
    solution: "Wxwx × Wxwx ได้ข้าวเหนียว (wxwx) $\\frac14$ คาดว่าได้ $1{,}200 \\times \\frac14 = 300$ เมล็ด และข้าวเจ้า 900 เมล็ด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.genes-heredity.p013
    topics: [biology.genetics.genes-heredity]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการถ่ายทอดยีนสีดอกจากต้นพ่อแม่ไปสู่ต้นลูก"
    items:
      - "ไมโอซิสในอับเรณูและรังไข่ทำให้แอลลีลที่เป็นคู่แยกจากกัน"
      - "เซลล์สืบพันธุ์แต่ละเซลล์ได้แอลลีลสีดอกเพียงหนึ่งแอลลีล"
      - "เซลล์สืบพันธุ์จากสองต้นปฏิสนธิกันแบบสุ่ม"
      - "ไซโกตมีแอลลีลสีดอกครบคู่อีกครั้ง"
      - "ไซโกตแบ่งเซลล์แบบไมโทซิสจนเจริญเป็นต้นลูก"
    hints:
      - "เริ่มจากการสร้างเซลล์สืบพันธุ์"
      - "ขั้นสุดท้ายคือการเจริญเติบโต ซึ่งใช้การแบ่งเซลล์แบบที่ได้เซลล์เหมือนเดิม"
    solution: "ไมโอซิสแยกแอลลีล → เซลล์สืบพันธุ์มีหนึ่งแอลลีล → ปฏิสนธิแบบสุ่ม → ไซโกตมีแอลลีลครบคู่ → ไมโทซิสเจริญเป็นต้นลูก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.genes-heredity.p014
