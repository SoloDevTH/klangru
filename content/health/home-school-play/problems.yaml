  - id: health.safety.home-school-play.p014
    topics: [health.safety.home-school-play]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "จากแผนผังบ้าน ข้อใดเป็นการแก้ไขจุดอันตรายได้ถูกต้อง (เลือกทุกข้อที่ถูก)"
    figure:
      src: home-hazards-quiz.svg
      alt: "แผนผังบ้านสี่ห้อง ห้องครัวมีจุด A ที่มีดวางยื่นขอบเคาน์เตอร์ และจุด B ที่หม้อบนเตามีด้ามยื่นออกมา ห้องนั่งเล่นมีจุด C ที่ปลั๊กพ่วงเสียบหลายช่องและสายไฟหักงอเป็นรอย ห้องน้ำมีจุด D ที่พื้นมีแอ่งน้ำ จุด E ที่ขวดน้ำยาวางบนพื้น และจุด G ที่ถังน้ำเปิดฝา ห้องบันไดมีจุด F ที่ลูกบอลวางอยู่บนขั้นบันได"
    choices:
      - { id: a, text: "จุด B หมุนด้ามหม้อเข้าด้านในเตา", correct: true }
      - { id: b, text: "จุด E ย้ายน้ำยาไปเก็บในตู้สูงพ้นมือเด็ก", correct: true }
      - { id: c, text: "จุด F เก็บลูกบอลออกจากบันได", correct: true }
      - { id: d, text: "จุด E เทน้ำยาใส่ขวดน้ำดื่มเปล่าจะได้เก็บง่าย", feedback: "อันตรายมาก คนอื่นอาจเข้าใจผิดว่าเป็นน้ำแล้วดื่ม ต้องเก็บในขวดเดิมที่มีฉลาก" }
      - { id: e, text: "จุด C เสียบปลั๊กเพิ่มอีกหลายตัวให้ครบทุกช่อง", feedback: "เสียบมากเกินไปทำให้สายไฟร้อนจนไฟไหม้ได้ และสายที่ชำรุดต้องเปลี่ยน" }
    hints:
      - "การแก้ไขที่ดีทำให้เด็กเข้าถึงอันตรายไม่ได้ หรือเอาอันตรายออกไป"
      - "ข้อที่ถูกมีสามข้อ"
    solution: "การหมุนด้ามหม้อเข้าใน เก็บน้ำยาให้พ้นมือเด็ก และเก็บของเล่นออกจากบันได ช่วยลดอันตราย ส่วนเทน้ำยาใส่ขวดน้ำดื่มและเสียบปลั๊กเพิ่มทำให้อันตรายมากขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

