    figure: { src: price-tag.svg, alt: "ป้ายราคาสีเหลืองเขียนว่า 芒果 มะม่วง บรรทัดถัดมาเขียนว่า 一公斤 六十五块 และพินอิน yì gōngjīn liùshíwǔ kuài" }
    answer: { value: 130, unit: บาท }
    hints:
      - "一公斤 คือ 1 กิโลกรัม อ่านราคาจาก 六十五 ก่อน"
      - "六 อยู่หน้า 十 จึงเป็น 6 × 10 แล้วบวก 五"
    misconceptions:
