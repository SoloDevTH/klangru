      - { id: c, text: "ที่ 60 °C แป้งไม่มีอยู่แล้ว จึงยังเป็นสีน้ำเงิน", feedback: "สีน้ำเงินแปลว่ายังมีแป้งอยู่ แป้งไม่ถูกย่อยเพราะเอนไซม์เสียสภาพ" }
      - { id: d, text: "อุณหภูมิไม่มีผลต่ออะไมเลส", feedback: "เวลาที่ใช้ต่างกันมากตามอุณหภูมิ อุณหภูมิจึงมีผล" }
