  - id: biology.animals.movement.p013
    topics: [biology.animals.movement]
    difficulty: 4
    type: mcq
    stem: "เปรียบเทียบโครงร่างของไส้เดือนดิน แมลง และมนุษย์ ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "ทั้งสามใช้กล้ามเนื้อดึงกับโครงร่างบางแบบ ไส้เดือนใช้ของเหลวในช่องตัว แมลงใช้โครงร่างภายนอกที่กล้ามเนื้อยึดด้านใน มนุษย์ใช้โครงกระดูกภายในที่กล้ามเนื้อยึดด้านนอก", correct: true }
      - { id: b, text: "แมลงไม่มีกล้ามเนื้อ เคลื่อนที่ด้วยโครงร่างภายนอกอย่างเดียว", feedback: "แมลงมีกล้ามเนื้อยึดอยู่ด้านในโครงร่างภายนอก" }
      - { id: c, text: "ไส้เดือนดินไม่มีโครงร่าง จึงไม่ต้องใช้กล้ามเนื้อคู่ตรงข้าม", feedback: "ไส้เดือนดินมีโครงร่างค้ำจุนด้วยน้ำ และใช้กล้ามเนื้อวงกับกล้ามเนื้อตามยาวเป็นคู่ตรงข้าม" }
      - { id: d, text: "โครงร่างภายนอกของแมลงโตตามตัวได้เรื่อย ๆ จึงไม่ต้องลอกคราบ", feedback: "โครงร่างภายนอกขยายไม่ได้ แมลงจึงต้องลอกคราบเมื่อโตขึ้น" }
    hints:
      - "ทุกแบบต้องมีสิ่งที่กล้ามเนื้อดึงหรือดันได้"
      - "ต่างกันที่ตำแหน่งของโครงร่างเมื่อเทียบกับกล้ามเนื้อ"
    solution: "กล้ามเนื้อของทั้งสามทำงานเป็นคู่ตรงข้ามกับโครงร่างคนละแบบ ไส้เดือนใช้ของเหลว แมลงใช้โครงร่างภายนอกที่ต้องลอกคราบเมื่อโต มนุษย์ใช้กระดูกภายในที่โตไปพร้อมร่างกาย"
