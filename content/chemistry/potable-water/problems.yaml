    difficulty: 5
    type: numeric
    stem: "น้ำดิบของประปาหมู่บ้านมีความต้องการคลอรีน 1.2 mg/L ถังจุ 40 m³ ต้องการให้เหลือคลอรีนอิสระ 0.5 mg/L หลังทำปฏิกิริยาครบ ถ้าใช้ผงปูนคลอรีนที่มีคลอรีนใช้ได้ 60% ต้องเติมผงกี่กรัม (ตอบทศนิยมหนึ่งตำแหน่ง ค่าสมมติ)"
    answer: { value: 113.3, unit: g, tolerance: 1 }
    misconceptions:
      - { match: 33.3, feedback: "คิดเฉพาะคลอรีนที่ต้องการให้เหลือ ลืมส่วนที่ถูกใช้ไปกับสิ่งเจือปน (ความต้องการคลอรีน)" }
      - { match: 80, feedback: "คิดเฉพาะความต้องการคลอรีน ลืมบวกส่วนที่ต้องเหลือ 0.5 mg/L" }
      - { match: 68, feedback: "นี่คือมวลคลอรีนล้วน ต้องหารด้วย 0.60 เพื่อหามวลผง" }
    hints:
      - "ปริมาณที่ต้องเติม = ความต้องการคลอรีน + คลอรีนที่ต้องการให้เหลือ"
      - "เปลี่ยน mg/L เป็น g/m³ คูณปริมาตร แล้วหารด้วย 0.60"
    solution: "ต้องเติม $1.2 + 0.5 = 1.7$ mg/L คลอรีน $= 1.7 \\times 40 = 68$ g ผง $= 68 \\div 0.60 =$ **113.3 g**"
