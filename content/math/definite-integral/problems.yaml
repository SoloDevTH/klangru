  - id: math.calculus.definite-integral.p020
    topics: [math.calculus.definite-integral]
    difficulty: 5
    type: numeric
    stem: "จงหาค่า $k > 0$ ที่ทำให้ $\\displaystyle\\int_0^k (2x + 1)\\,dx = 12$"
    answer: { value: 3 }
    hints:
      - "$\\Big[x^2 + x\\Big]_0^k = k^2 + k$"
      - "แก้สมการกำลังสอง $k^2 + k - 12 = 0$"
    misconceptions:
      - { match: -4, feedback: "$k = -4$ เป็นรากของสมการ แต่โจทย์กำหนด $k > 0$" }
      - { match: 5.5, feedback: "ต้องหาปฏิยานุพันธ์ก่อน ไม่ใช่แก้ $2k + 1 = 12$" }
    solution: "$k^2 + k = 12$ ได้ $(k + 4)(k - 3) = 0$ เลือก $k = 3$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.calculus.definite-integral.p021
    topics: [math.calculus.definite-integral]
    difficulty: 2
    type: order
    stem: "เรียงขั้นการหา $\\displaystyle\\int_a^b f(x)\\,dx$ ด้วยทฤษฎีบทหลักมูล"
    items:
      - "ตรวจว่า $f$ ต่อเนื่องบน $[a, b]$"
      - "หาปฏิยานุพันธ์ $F$ ของ $f$ (ไม่ต้องใส่ $C$)"
      - "ตรวจ $F$ โดยหาอนุพันธ์กลับ"
      - "คำนวณ $F(b)$ และ $F(a)$"
      - "ตอบ $F(b) - F(a)$"
    hints:
      - "ทฤษฎีบทใช้ได้เมื่อฟังก์ชันต่อเนื่อง"
      - "ลบค่าที่ขอบล่างออกจากค่าที่ขอบบน"
    solution: "ตรวจความต่อเนื่อง → หาปฏิยานุพันธ์ → ตรวจด้วยอนุพันธ์ → แทนขอบบนและขอบล่าง → $F(b) - F(a)$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.calculus.definite-integral.p022
    topics: [math.calculus.definite-integral]
    difficulty: 3
    type: numeric
    stem: "สถานีวัดน้ำฝนในหาดใหญ่บันทึกพายุฝนช่วงหนึ่งที่มีความเข้มฝน $r(t) = 12t - 3t^2$ มิลลิเมตรต่อชั่วโมง ในช่วง $0 \\le t \\le 4$ ชั่วโมง (แบบจำลองสมมติ) ฝนตกสะสมทั้งหมดกี่มิลลิเมตร"
    answer: { value: 32, unit: มิลลิเมตร }
    hints:
      - "ฝนสะสม $= \\displaystyle\\int_0^4 (12t - 3t^2)\\,dt$"
      - "ปฏิยานุพันธ์ $6t^2 - t^3$"
    misconceptions:
      - { match: 12, feedback: "12 คือความเข้มฝนสูงสุด (ที่ $t = 2$) ไม่ใช่ปริมาณสะสม" }
      - { match: 0, feedback: "$r(4) = 0$ คือฝนหยุดตอนท้าย แต่ปริมาณสะสมคือพื้นที่ใต้กราฟทั้งช่วง" }
    solution: "$\\Big[6t^2 - t^3\\Big]_0^4 = 96 - 64 = 32$ มิลลิเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true
