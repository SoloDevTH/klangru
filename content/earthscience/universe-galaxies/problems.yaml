problems:
  - id: earthscience.astronomy.universe-galaxies.p001
    topics: [earthscience.astronomy.universe-galaxies]
    difficulty: 1
    type: mcq
    stem: "ปีแสงเป็นหน่วยของปริมาณใด"
    choices:
      - { id: a, text: "ระยะทาง", correct: true }
      - { id: b, text: "เวลา", feedback: "แม้มีคำว่า ปี แต่ปีแสงคือระยะที่แสงเดินทางได้ใน 1 ปี จึงเป็นหน่วยระยะทาง" }
      - { id: c, text: "ความสว่าง", feedback: "ความสว่างใช้หน่วยอื่น ปีแสงบอกระยะทาง" }
      - { id: d, text: "อัตราเร็ว", feedback: "อัตราเร็วของแสงคือ $3.00 \\times 10^5$ km/s ส่วนปีแสงคือระยะที่แสงไปได้ใน 1 ปี" }
    hints:
      - "แสงเดินทางได้ไกลเท่าใดใน 1 ปี"
      - "อัตราเร็ว × เวลา = ปริมาณอะไร"
    solution: "ปีแสงคือระยะที่แสงเดินทางได้ใน 1 ปี ประมาณ $9.46 \\times 10^{12}$ km จึงเป็นหน่วยระยะทาง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.universe-galaxies.p002
    topics: [earthscience.astronomy.universe-galaxies]
    difficulty: 1
    type: mcq
    stem: "ตามทฤษฎีบิกแบงและข้อมูลปัจจุบัน เอกภพมีอายุประมาณเท่าใด"
    choices:
      - { id: a, text: "13,800 ล้านปี", correct: true }
      - { id: b, text: "4,600 ล้านปี", feedback: "4,600 ล้านปีคืออายุของระบบสุริยะ ซึ่งเกิดทีหลังมาก" }
      - { id: c, text: "2.5 ล้านปี", feedback: "2.5 ล้านปีแสงคือระยะถึงดาราจักรแอนดรอเมดา ไม่ใช่อายุเอกภพ" }
      - { id: d, text: "380,000 ปี", feedback: "380,000 ปีคือช่วงที่อะตอมเกิดและแสงเดินทางได้อิสระ ไม่ใช่อายุปัจจุบัน" }
    hints:
      - "เอกภพต้องเก่ากว่าระบบสุริยะ"
      - "ตัวเลขนี้ใกล้กับ $1/H_0$"
    solution: "เอกภพมีอายุราว 13,800 ล้านปี มากกว่าอายุระบบสุริยะ (4,600 ล้านปี) ราวสามเท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.universe-galaxies.p003
    topics: [earthscience.astronomy.universe-galaxies]
    difficulty: 2
    type: order
    stem: "เรียงเหตุการณ์หลังบิกแบงจากก่อนไปหลัง"
    items:
      - "การพองตัวอย่างรวดเร็วของเอกภพ"
      - "ควาร์กรวมกันเป็นโปรตอนและนิวตรอน"
      - "เกิดนิวเคลียสของฮีเลียม"
      - "อิเล็กตรอนรวมกับนิวเคลียสเป็นอะตอม แสงเดินทางได้อิสระ"
      - "ดาวฤกษ์และกาแล็กซีรุ่นแรกเกิดขึ้น"
      - "ระบบสุริยะเกิดขึ้น"
    hints:
      - "อนุภาคเล็กต้องเกิดก่อนจะรวมเป็นสิ่งที่ใหญ่ขึ้น"
      - "อะตอมต้องเกิดก่อน แก๊สจึงรวมตัวเป็นดาวได้"
    solution: "การพองตัว (~$10^{-36}$ s) → ควาร์กรวมเป็นโปรตอนและนิวตรอน (~$10^{-6}$ s) → นิวเคลียสฮีเลียม (3–20 นาที) → อะตอม (380,000 ปี) → ดาวและกาแล็กซีแรก (100–200 ล้านปี) → ระบบสุริยะ (9,200 ล้านปี)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.universe-galaxies.p004
    topics: [earthscience.astronomy.universe-galaxies]
    difficulty: 2
    type: match
    stem: "จับคู่หลักฐานกับสิ่งที่หลักฐานนั้นบอก"
    pairs:
      - { left: "กาแล็กซีไกลกว่าถอยห่างเร็วกว่า", right: "อวกาศกำลังขยายตัว" }
      - { left: "ไมโครเวฟอุณหภูมิ 2.7 K มาจากทุกทิศ", right: "เอกภพเคยร้อนและหนาแน่นจนแสงออกมาไม่ได้" }
      - { left: "ดาวและแก๊สที่เก่าที่สุดมี H ราว 75% และ He ราว 25% โดยมวล", right: "นิวเคลียสเบาเกิดในไม่กี่นาทีแรก" }
    hints:
      - "การเลื่อนไปทางแดงบอกการเคลื่อนที่"
      - "รังสีพื้นหลังคือแสงที่หลุดออกมาเมื่อ 380,000 ปีหลังบิกแบง"
    solution: "กฎของฮับเบิลแสดงการขยายตัว ไมโครเวฟพื้นหลังเป็นแสงจากเอกภพยุคร้อน และสัดส่วน H/He ตรงกับการสร้างนิวเคลียสในไม่กี่นาทีแรก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.universe-galaxies.p005
    topics: [earthscience.astronomy.universe-galaxies]
    difficulty: 2
    type: mcq
    stem: "ทำไมเราจึงเห็นทางช้างเผือกเป็นแถบฝ้าพาดผ่านท้องฟ้า แทนที่จะเห็นเป็นรูปกังหัน"
    choices:
      - { id: a, text: "ระบบสุริยะอยู่ในจานของกาแล็กซี เมื่อมองตามแนวจานจึงเห็นดาวจำนวนมากซ้อนกันเป็นแถบ", correct: true }
      - { id: b, text: "ทางช้างเผือกเป็นเมฆในบรรยากาศของโลก", feedback: "แถบนี้อยู่ที่เดิมเมื่อเทียบกับดาว และกล้องสองตาแยกเป็นดาวจำนวนมากได้ จึงไม่ใช่เมฆในบรรยากาศ" }
      - { id: c, text: "ทางช้างเผือกเป็นกาแล็กซีอีกแห่งที่อยู่ไกลมาก", feedback: "ทางช้างเผือกคือกาแล็กซีที่เราอยู่ข้างใน ไม่ใช่กาแล็กซีอื่น" }
      - { id: d, text: "ระบบสุริยะอยู่ใจกลางกาแล็กซีพอดี", feedback: "ระบบสุริยะอยู่ห่างใจกลางราว 26,000 ปีแสง และถ้าอยู่ใจกลางจริงก็ยังเห็นเป็นแถบเพราะจานแบน" }
    hints:
      - "จานของกาแล็กซีกว้างมากแต่บาง"
      - "ลองนึกถึงการยืนอยู่ในจานแล้วมองรอบตัว"
    solution: "จานกว้างราว 100,000 ปีแสงแต่หนาราว 1,000 ปีแสง เมื่ออยู่ข้างในและมองตามแนวจานจะเห็นดาวซ้อนกันมาก มองออกนอกจานเห็นดาวน้อย จึงเห็นเป็นแถบรอบท้องฟ้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.universe-galaxies.p006
    topics: [earthscience.astronomy.universe-galaxies]
    difficulty: 2
    type: numeric
    stem: "ดาวพร็อกซิมาเซนทอรี ดาวฤกษ์ที่ใกล้ระบบสุริยะที่สุด อยู่ห่างราว 4.2 ปีแสง ระยะนี้เท่ากับกี่ $\\times 10^{13}$ km (1 ปีแสง $= 9.46 \\times 10^{12}$ km ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 3.97, tolerance: 0.03, unit: × 10¹³ km }
    misconceptions:
      - { match: 39.7, feedback: "39.7 คือคำตอบในหน่วย $10^{12}$ km โจทย์ให้ตอบในหน่วย $10^{13}$ km" }
      - { match: 2.25, feedback: "นำ 9.46 หารด้วย 4.2 ต้องคูณกัน" }
    hints:
      - "ระยะทาง = จำนวนปีแสง × ระยะของ 1 ปีแสง"
      - "$4.2 \\times 9.46 \\times 10^{12}$ แล้วเขียนในรูป $\\times 10^{13}$"
    solution: "$4.2 \\times 9.46 \\times 10^{12} = 3.97 \\times 10^{13}$ km แม้เป็นดาวที่ใกล้ที่สุด แสงยังใช้เวลา 4.2 ปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.universe-galaxies.p007
    topics: [earthscience.astronomy.universe-galaxies]
    difficulty: 3
    type: numeric
    stem: "กาแล็กซีหนึ่งอยู่ห่าง 100 Mpc ถ้า $H_0 = 70\\ \\mathrm{km/s/Mpc}$ กาแล็กซีนี้ถอยห่างด้วยอัตราเร็วกี่ km/s"
    answer: { value: 7000, tolerance: 10, unit: km/s }
    misconceptions:
      - { match: 1.43, feedback: "นำระยะทางหารด้วย $H_0$ กฎของฮับเบิลคือ $v = H_0 d$ ต้องคูณ" }
      - { match: 0.7, feedback: "นำ $H_0$ หารด้วยระยะทาง ต้องคูณ $H_0$ กับระยะทาง" }
    hints:
      - "กฎของฮับเบิล $v = H_0 d$"
      - "$70 \\times 100$"
    solution: "$v = 70 \\times 100 = 7{,}000$ km/s"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.universe-galaxies.p008
    topics: [earthscience.astronomy.universe-galaxies]
    difficulty: 3
    type: numeric
    stem: "เส้นสเปกตรัมไฮโดรเจน H-beta วัดในห้องปฏิบัติการได้ 486.1 nm แต่ในสเปกตรัมของกาแล็กซีหนึ่งวัดได้ 501.0 nm หาค่าการเลื่อนไปทางแดง $z$ (ตอบทศนิยม 4 ตำแหน่ง)"
    answer: { value: 0.0307, tolerance: 0.0003 }
    misconceptions:
      - { match: 0.0297, feedback: "หารด้วยความยาวคลื่นที่วัดได้ (501.0) ต้องหารด้วยความยาวคลื่นเดิม (486.1)" }
      - { match: 14.9, feedback: "14.9 nm คือผลต่างของความยาวคลื่น ยังต้องหารด้วย $\\lambda_0$" }
    hints:
      - "$z = (\\lambda_{\\text{วัด}} - \\lambda_0)/\\lambda_0$"
      - "$(501.0 - 486.1)/486.1$"
    solution: "$z = \\dfrac{501.0 - 486.1}{486.1} = \\dfrac{14.9}{486.1} \\approx 0.0307$ ค่าบวกแปลว่ากาแล็กซีกำลังถอยห่าง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.universe-galaxies.p009
    topics: [earthscience.astronomy.universe-galaxies]
    difficulty: 3
    type: numeric
    stem: "จากกราฟความเร็วถอยห่างกับระยะทางของกาแล็กซี 6 แห่ง ความชันของเส้นตรงที่เหมาะที่สุด (ค่าคงตัวของฮับเบิล) เท่ากับกี่ km/s/Mpc"
    figure: { src: p-hubble.svg, alt: "กราฟจุด แกนนอนระยะทาง 0 ถึง 200 Mpc แกนตั้งความเร็วถอยห่าง 0 ถึง 15,000 km/s จุดข้อมูล 6 จุด ที่ 20 Mpc 1,500 km/s, 50 Mpc 3,400 km/s, 80 Mpc 5,700 km/s, 110 Mpc 7,600 km/s, 150 Mpc 10,400 km/s, 190 Mpc 13,400 km/s เส้นประตรงผ่านจุดกำเนิดไปที่ 200 Mpc 14,000 km/s" }
    answer: { value: 70, tolerance: 2, unit: km/s/Mpc }
    misconceptions:
      - { match: 0.0143, feedback: "นำระยะทางหารด้วยความเร็ว ความชันคือความเร็ว ÷ ระยะทาง" }
      - { match: 14000, feedback: "14,000 km/s คือค่าความเร็วบนเส้นที่ 200 Mpc ยังต้องหารด้วยระยะทาง" }
    hints:
      - "เลือกสองจุดบนเส้นประที่อ่านง่าย เช่น จุดกำเนิดกับปลายเส้น"
      - "ความชัน = ความเร็วที่เปลี่ยน ÷ ระยะทางที่เปลี่ยน"
    solution: "เส้นผ่าน (0, 0) และ (200 Mpc, 14,000 km/s) ความชัน $= 14{,}000/200 = 70$ km/s/Mpc"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.universe-galaxies.p010
    topics: [earthscience.astronomy.universe-galaxies]
    difficulty: 3
    type: mcq
    stem: "ข้อใดบอกตำแหน่งของระบบสุริยะในกาแล็กซีทางช้างเผือกได้ถูกต้อง"
    choices:
      - { id: a, text: "อยู่ในจาน บนแขนย่อยนายพราน ห่างจากใจกลางราว 26,000 ปีแสง", correct: true }
      - { id: b, text: "อยู่ที่ใจกลางกาแล็กซี ข้างหลุมดำ", feedback: "ใจกลางอยู่ทางกลุ่มดาวคนยิงธนู ห่างจากเราราว 26,000 ปีแสง" }
      - { id: c, text: "อยู่ในฮาโลเหนือจานของกาแล็กซี", feedback: "ถ้าอยู่ในฮาโล เราจะเห็นจานทั้งจานเป็นรูปกังหัน ไม่ใช่แถบรอบท้องฟ้า" }
      - { id: d, text: "อยู่นอกกาแล็กซีทางช้างเผือก", feedback: "ดาวที่เห็นตอนกลางคืนเกือบทั้งหมดอยู่ในกาแล็กซีเดียวกับเรา" }
    hints:
      - "เราเห็นทางช้างเผือกเป็นแถบ แปลว่าเราอยู่ในส่วนใด"
      - "ส่วนที่สว่างที่สุดของแถบคือทิศของใจกลาง"
    solution: "ระบบสุริยะอยู่ในจาน ห่างใจกลางราว 26,000 ปีแสง จึงเห็นทางช้างเผือกเป็นแถบ และเห็นส่วนที่สว่างที่สุดทางกลุ่มดาวคนยิงธนูซึ่งเป็นทิศของใจกลาง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.universe-galaxies.p011
    topics: [earthscience.astronomy.universe-galaxies]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นองค์ประกอบของกาแล็กซีทางช้างเผือก (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ส่วนป่องใจกลางที่มีหลุมดำมวลยิ่งยวด", correct: true }
      - { id: b, text: "จานที่มีแขนกังหัน แก๊ส และฝุ่น", correct: true }
      - { id: c, text: "ฮาโลที่มีกระจุกดาวทรงกลมและสสารมืด", correct: true }
      - { id: d, text: "ดาราจักรแอนดรอเมดา", feedback: "แอนดรอเมดาเป็นกาแล็กซีอีกแห่ง ห่างไปราว 2.5 ล้านปีแสง ไม่ใช่ส่วนของทางช้างเผือก" }
    hints:
      - "กาแล็กซีกังหันมีสามส่วนหลัก"
      - "แอนดรอเมดาอยู่ไกลกว่าขนาดของทางช้างเผือกมาก"
    solution: "ทางช้างเผือกมีส่วนป่องใจกลาง จาน และฮาโล ส่วนแอนดรอเมดาเป็นกาแล็กซีเพื่อนบ้าน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.universe-galaxies.p012
    topics: [earthscience.astronomy.universe-galaxies]
    difficulty: 4
    type: numeric
    stem: "กาแล็กซีที่มี $z = 0.0307$ อยู่ห่างจากเรากี่เมกะพาร์เซก (ใช้ $v \\approx cz$, $c = 3.00 \\times 10^5$ km/s และ $H_0 = 70$ km/s/Mpc)"
    answer: { value: 132, tolerance: 2, unit: Mpc }
    misconceptions:
      - { match: 9210, feedback: "9,210 km/s คืออัตราเร็วถอยห่าง ยังต้องหารด้วย $H_0$" }
      - { match: 0.000439, feedback: "นำ $z$ หารด้วย $H_0$ โดยตรง ต้องแปลงเป็นอัตราเร็ว $v = cz$ ก่อน" }
    hints:
      - "หาอัตราเร็วจาก $v = cz$"
      - "แล้วใช้ $d = v/H_0$"
    solution: "$v = 3.00 \\times 10^5 \\times 0.0307 = 9{,}210$ km/s, $d = 9{,}210/70 \\approx 132$ Mpc หรือราว 430 ล้านปีแสง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.universe-galaxies.p013
    topics: [earthscience.astronomy.universe-galaxies]
    difficulty: 4
    type: numeric
    stem: "ประมาณอายุของเอกภพด้วยเวลาฮับเบิล $t \\approx 1/H_0$ เมื่อ $H_0 = 70$ km/s/Mpc ใช้ 1 Mpc $= 3.086 \\times 10^{19}$ km และ 1 ปี $= 3.156 \\times 10^7$ s ตอบเป็นพันล้านปี (ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 14.0, tolerance: 0.1, unit: พันล้านปี }
    misconceptions:
      - { match: 4.41e17, feedback: "$4.41 \\times 10^{17}$ คือคำตอบในหน่วยวินาที ต้องแปลงเป็นปีและพันล้านปี" }
