    starter: |
      def neighbors(grid, cell):
          pass
    tests: |
      G = ["....", ".##.", "...#", "#..."]
      assert sorted(neighbors(G, (2, 2))) == [(2, 1), (3, 2)], f"ได้ {sorted(neighbors(G, (2, 2)))}"
      assert sorted(neighbors(G, (0, 0))) == [(0, 1), (1, 0)], f"ได้ {sorted(neighbors(G, (0, 0)))}"
    reference: |
      def neighbors(grid, cell):
          r, c = cell
          out = []
          for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
              nr, nc = r + dr, c + dc
              if 0 <= nr < len(grid) and 0 <= nc < len(grid[0]) and grid[nr][nc] == ".":
                  out.append((nr, nc))
          return out
