    ai_assisted: true

  - id: physics.energy.simple-machines.p014
    topics: [physics.energy.simple-machines]
    difficulty: 4
    type: mcq
    stem: "ขวานสองเล่มน้ำหนักเท่ากัน เล่ม A ใบมีดบางและยาว เล่ม B ใบมีดหนาและสั้น ตอกด้วยแรงเท่ากัน เล่มใดผ่าฟืนได้ดีกว่า เพราะอะไร"
    choices:
      - { id: a, text: "เล่ม A เพราะลิ่มที่ยาวและบางมีการได้เปรียบเชิงกลมาก เปลี่ยนแรงตอกเป็นแรงดันด้านข้างที่มากกว่า", correct: true }
      - { id: b, text: "เล่ม B เพราะใบมีดหนาดันเนื้อไม้ออกได้กว้างกว่า", feedback: "ใบหนาแยกไม้ได้กว้างต่อระยะที่ตอก แต่ต้องใช้แรงดันมากกว่า MA ของลิ่มขึ้นกับความยาวเทียบกับความหนา" }
      - { id: c, text: "เท่ากัน เพราะแรงตอกเท่ากัน", feedback: "แรงตอกเท่ากันก็จริง แต่รูปร่างของลิ่มเปลี่ยนว่าแรงนั้นถูกขยายเป็นแรงด้านข้างได้กี่เท่า" }
    hints:
      - "ลิ่มคือพื้นเอียงสองด้าน"
      - "พื้นเอียงที่ยาวเทียบกับความสูงมาก ให้ MA มากหรือน้อย"
    solution: "ลิ่มทำงานเหมือนพื้นเอียง MA ประมาณความยาวของลิ่มหารด้วยความหนา ใบมีดบางและยาวจึงขยายแรงได้มากกว่า ผ่าไม้ได้ง่ายกว่า แต่ต้องตอกลึกกว่าเพื่อแยกไม้ให้กว้างเท่ากัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.simple-machines.p015
    topics: [physics.energy.simple-machines]
    difficulty: 5
    type: numeric
    stem: "แม่แรงแบบเกลียวมีระยะเกลียว $5.0\\ \\mathrm{mm}$ หมุนด้วยด้ามยาว $0.30\\ \\mathrm{m}$ (วัดจากแกน) ถ้าไม่คิดแรงเสียดทาน ต้องออกแรงที่ปลายด้ามเท่าใดเพื่อยกรถส่วนที่หนัก $7500\\ \\mathrm{N}$ (ตอบในหน่วย N)"
    answer: { value: 19.9, tolerance: 0.2, unit: N }
    misconceptions:
      - { match: 125, feedback: "ลืม $2\\pi$ มือเคลื่อนที่เป็นวงกลม ระยะต่อรอบคือ $2\\pi R$ ไม่ใช่ $R$" }
      - { match: 0.0199, feedback: "ใช้ระยะเกลียวเป็นมิลลิเมตรปนกับด้ามที่เป็นเมตร ต้องแปลง $5.0\\ \\mathrm{mm} = 0.0050\\ \\mathrm{m}$" }
    hints:
      - "หมุนหนึ่งรอบ มือเคลื่อนที่ $2\\pi R$ รถขึ้น $p$"
      - "$F \\times 2\\pi R = W \\times p$"
    solution: "$F = \\dfrac{W p}{2\\pi R} = \\dfrac{7500 \\times 0.0050}{2\\pi \\times 0.30} \\approx 19.9\\ \\mathrm{N}$ MA ในอุดมคติราว 377 แต่แม่แรงจริงมีแรงเสียดทานมาก ต้องออกแรงมากกว่านี้หลายเท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.simple-machines.p016
    topics: [physics.energy.simple-machines]
    difficulty: 5
    type: numeric
    stem: "รอกพวงมีเชือกรับชุดรอกเคลื่อนที่ 4 เส้น ชุดรอกเคลื่อนที่หนัก $40\\ \\mathrm{N}$ ใช้ยกกระสอบข้าวสารหนัก $600\\ \\mathrm{N}$ ด้วยความเร็วคงตัว ถ้าไม่คิดแรงเสียดทาน ต้องดึงเชือกด้วยแรงเท่าใด (ตอบในหน่วย N)"
    answer: { value: 160, tolerance: 1.6, unit: N }
    misconceptions:
      - { match: 150, feedback: "ลืมน้ำหนักของชุดรอกเคลื่อนที่ ซึ่งถูกยกขึ้นไปพร้อมกระสอบ" }
      - { match: 140, feedback: "นำน้ำหนักรอกไปลบ น้ำหนักรอกต้องบวกเพิ่ม เพราะต้องยกรอกด้วย" }
    hints:
      - "เชือก 4 เส้นรับน้ำหนักอะไรบ้าง"
      - "$F = \\dfrac{W_{\\text{ภาระ}} + W_{\\text{รอก}}}{4}$"
    solution: "เชือก 4 เส้นรับทั้งกระสอบและชุดรอก $F = \\dfrac{600 + 40}{4} = 160\\ \\mathrm{N}$ ประสิทธิภาพ $= \\dfrac{600}{4 \\times 160} \\times 100\\% \\approx 94\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.simple-machines.p017
    topics: [physics.energy.simple-machines]
    difficulty: 5
    type: numeric
    stem: "ครกกระเดื่องมีคานไม้ จุดหมุนอยู่ห่างปลายที่เหยียบ $0.50\\ \\mathrm{m}$ และห่างสาก $1.5\\ \\mathrm{m}$ สากหนัก $60\\ \\mathrm{N}$ ถ้าไม่คิดน้ำหนักคาน ต้องเหยียบด้วยแรงอย่างน้อยเท่าใดสากจึงเริ่มยกขึ้น (ตอบในหน่วย N)"
    answer: { value: 180, tolerance: 1.8, unit: N }
    misconceptions:
      - { match: 20, feedback: "กลับอัตราส่วน แขนของแรงที่เหยียบสั้นกว่าแขนของสาก จึงต้องใช้แรงมากกว่าน้ำหนักสาก" }
      - { match: 60, feedback: "ถ้าใช้แรงเท่าน้ำหนักสาก แขนทั้งสองข้างต้องยาวเท่ากัน" }
    hints:
      - "หลักของโมเมนต์: $F \\times 0.50 = 60 \\times 1.5$"
      - "แขนสั้นกว่า ต้องใช้แรงมากกว่า"
    solution: "$F \\times 0.50 = 60 \\times 1.5$ ได้ $F = 180\\ \\mathrm{N}$ MA $= \\tfrac{60}{180} = \\tfrac13$ เสียเปรียบเรื่องแรง แต่เมื่อเท้ากดลง $10\\ \\mathrm{cm}$ สากยกขึ้น $30\\ \\mathrm{cm}$ ได้ระยะและความเร็วในการตำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.simple-machines.p018
    topics: [physics.energy.simple-machines]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "นักเรียนดึงกล่องหนัก $20\\ \\mathrm{N}$ ขึ้นทางลาดสูง $0.50\\ \\mathrm{m}$ ด้วยเครื่องชั่งสปริง ได้ข้อมูลดังนี้ ทางยาว $1.0\\ \\mathrm{m}$ ใช้แรง $12\\ \\mathrm{N}$ ทางยาว $2.0\\ \\mathrm{m}$ ใช้แรง $7\\ \\mathrm{N}$ ทางยาว $4.0\\ \\mathrm{m}$ ใช้แรง $4.5\\ \\mathrm{N}$ ข้อสรุปใดสอดคล้องกับข้อมูล (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ทางลาดยิ่งยาว แรงที่ใช้ยิ่งน้อย", correct: true }
      - { id: b, text: "งานที่ใส่ (แรง × ความยาวทาง) มากกว่างานที่ได้ ($20 \\times 0.50 = 10\\ \\mathrm{J}$) ทุกครั้ง แสดงว่ามีแรงเสียดทาน", correct: true }
      - { id: c, text: "ทางลาดยาว 4.0 m ทำให้งานที่ใส่น้อยที่สุด", feedback: "งานที่ใส่ $4.5 \\times 4.0 = 18\\ \\mathrm{J}$ มากที่สุดในสามครั้ง ($12$ และ $14\\ \\mathrm{J}$) เพราะแรงเสียดทานทำงานตลอดระยะที่ยาวขึ้น" }
      - { id: d, text: "แรงที่ใช้ลดลงตามสัดส่วนพอดี ความยาวเพิ่ม 2 เท่า แรงลดเหลือครึ่งหนึ่งทุกครั้ง", feedback: "จาก 12 N เป็น 7 N ไม่ใช่ครึ่งหนึ่งพอดี เพราะมีแรงเสียดทานเพิ่มเข้ามา ถ้าไม่มีแรงเสียดทานจะได้ 10, 5 และ 2.5 N" }
    hints:
      - "คำนวณงานที่ใส่ของแต่ละทาง (แรง × ความยาว) แล้วเทียบกับ 10 J"
      - "ถ้าไม่มีแรงเสียดทาน แรงควรเป็นเท่าใดสำหรับแต่ละความยาว"
    solution: "แรงลดลงเมื่อทางยาวขึ้น และงานที่ใส่ $12$, $14$ และ $18\\ \\mathrm{J}$ มากกว่างานที่ได้ $10\\ \\mathrm{J}$ ทุกครั้ง แสดงว่ามีแรงเสียดทาน ประสิทธิภาพ $83\\%$, $71\\%$ และ $56\\%$ ลดลงเมื่อทางยาวขึ้นเพราะแรงเสียดทานทำงานเป็นระยะไกลขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true
