id: thai.composition.research-report
subject: thai
title: { th: การเขียนรายงานการศึกษาค้นคว้าและโครงงาน, en: "Writing research and project reports" }
summary: ขั้นตอนการศึกษาค้นคว้า บันทึกแบบคัดลอก ถอดความ สรุปความ ส่วนประกอบของรายงานและรายงานโครงงาน ภาษาเชิงวิชาการ อ้างอิงระบบนาม-ปี บรรณานุกรม และการหลีกเลี่ยงการลอกเลียนวรรณกรรม
difficulty: 5.5
minutes: 40
prerequisites: [thai.composition.essay, thai.composition.summary-writing]
encompasses:
  - { id: thai.composition.essay, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: report-structure.svg
    alt: "ภาพสองคอลัมน์ ซ้าย รายงานการศึกษาค้นคว้า ส่วนนำ ปก คำนำ สารบัญ ส่วนเนื้อเรื่อง บทนำ เนื้อหาตามโครงเรื่อง บทสรุป ส่วนท้าย บรรณานุกรม ภาคผนวก ขวา รายงานโครงงาน ส่วนนำ ปก บทคัดย่อ สารบัญ ส่วนเนื้อเรื่อง 5 บท บทที่ 1 บทนำ บทที่ 2 เอกสารที่เกี่ยวข้อง บทที่ 3 วิธีดำเนินการ บทที่ 4 ผลการศึกษา บทที่ 5 สรุป อภิปรายผล ข้อเสนอแนะ ส่วนท้าย บรรณานุกรม ภาคผนวก หมายเหตุท้ายภาพ ชื่อบทและรายการในส่วนนำอาจต่างกันเล็กน้อยตามแบบของแต่ละโรงเรียน"
    caption: "รายงานทั้งสองแบบมีส่วนนำ ส่วนเนื้อเรื่อง และส่วนท้าย"
  - type: worked-example
    title: จากบัตรบันทึกสู่ประโยคในรายงาน
    problem: "บัตรบันทึก (แหล่งสมมติ) คัดลอกจาก มาลี ทะเลงาม. (2565). ป่าชายเลนกับชายฝั่งไทย. หน้า 34 ว่า \"รากค้ำยันช่วยดักตะกอนและลดความแรงของคลื่นที่ซัดเข้าฝั่ง\" เขียนเป็นประโยคในรายงานแบบถอดความ"
    steps:
      - text: "อ่านจนเข้าใจ แล้วปิดบัตร: ใจความคือ รากช่วยเก็บดินและทำให้คลื่นอ่อนลง"
        why: "การปิดต้นฉบับช่วยไม่ให้ลอกรูปประโยคเดิมโดยไม่รู้ตัว"
      - text: "เขียนด้วยคำของตน: ตะกอนที่ติดอยู่ระหว่างรากโกงกางและคลื่นที่อ่อนแรงลงช่วยให้ชายฝั่งถูกกัดเซาะน้อยลง"
      - text: "เปิดเทียบต้นฉบับ: ความหมายตรงกัน ไม่ได้เพิ่มเกินต้นฉบับ และไม่ได้ใช้วลีเดิมยาว ๆ"
      - text: "ใส่อ้างอิงในเนื้อหา: (มาลี ทะเลงาม, 2565) การถอดความไม่จำเป็นต้องมีเลขหน้าตามแบบ APA แต่ใส่ได้เพื่อให้ผู้อ่านตรวจง่าย"
    answer: "ตะกอนที่ติดอยู่ระหว่างรากโกงกางและคลื่นที่อ่อนแรงลงช่วยให้ชายฝั่งถูกกัดเซาะน้อยลง (มาลี ทะเลงาม, 2565)"
  - { type: check, problem: thai.composition.research-report.p007, prompt: "ข้อความคัดลอกต้องบอกตำแหน่งในหนังสือ" }
  - type: worked-example
    title: จัดบรรณานุกรม
    problem: "จัดบรรณานุกรมจากแหล่งสมมติ 3 แหล่ง: หน้าเว็บ การปลูกป่าชายเลนในชุมชน ของศูนย์ศึกษาชายฝั่งสมมติ เผยแพร่ 5 มิถุนายน 2567 URL https://example.org/mangrove · หนังสือ ป่าชายเลนกับชายฝั่งไทย ของมาลี ทะเลงาม ปี 2565 สำนักพิมพ์สมมติ · หนังสือ Mangrove forests ของ A. Lee ปี 2021 Example Press"
    steps:
      - text: "เขียนแต่ละรายการตามรูปแบบ: ผู้แต่ง. (ปี). ชื่อเรื่องตัวเอียง. สำนักพิมพ์หรือ URL."
      - text: "มาลี ทะเลงาม. (2565). ป่าชายเลนกับชายฝั่งไทย. สำนักพิมพ์สมมติ."
      - text: "ศูนย์ศึกษาชายฝั่งสมมติ. (2567, 5 มิถุนายน). การปลูกป่าชายเลนในชุมชน. https://example.org/mangrove"
        why: "หน่วยงานเป็นผู้แต่ง และชื่อเว็บไซต์เป็นชื่อเดียวกัน จึงไม่ต้องเขียนชื่อเว็บไซต์ซ้ำ"
      - text: "Lee, A. (2021). Mangrove forests. Example Press."
      - text: "เรียง: ภาษาไทยก่อน ม (มาลี) มาก่อน ศ (ศูนย์...) แล้วจึงภาษาอังกฤษ"
    answer: "1 มาลี ทะเลงาม. (2565)... 2 ศูนย์ศึกษาชายฝั่งสมมติ. (2567, 5 มิถุนายน)... 3 Lee, A. (2021)..."
  - { type: check, problem: thai.composition.research-report.p004, prompt: "ใครเก็บข้อมูลนี้โดยตรง" }
glossary:
  - { term: แหล่งข้อมูลปฐมภูมิ, definition: "ข้อมูลจากต้นทางหรือที่ผู้จัดทำเก็บเอง เช่น สัมภาษณ์ สำรวจ ทดลอง" }
  - { term: แหล่งข้อมูลทุติยภูมิ, definition: "ข้อมูลที่ผู้อื่นเรียบเรียงจากแหล่งอื่นแล้ว เช่น หนังสือ บทความ สารานุกรม" }
  - { term: ถอดความ, definition: "เรียบเรียงข้อความใหม่ด้วยคำของตน ความหมายเท่าเดิม และต้องอ้างที่มา" }
  - { term: บรรณานุกรม, definition: "รายการแหล่งข้อมูลที่อ้างอิงในเนื้อหา อยู่ท้ายรายงาน" }
  - { term: บทคัดย่อ, definition: "ข้อความสั้น ๆ ต้นรายงานโครงงาน บอกวัตถุประสงค์ วิธีการ และผลสำคัญ" }
  - { term: การลอกเลียนวรรณกรรม, definition: "การนำงานหรือความคิดของผู้อื่นมาเสนอเหมือนเป็นของตน ศัพท์บัญญัติอีกคำคือ โจรกรรมทางวรรณกรรม" }
flashcards:
  - { front: "รายงาน 3 ส่วน", back: "ส่วนนำ ส่วนเนื้อเรื่อง ส่วนท้าย" }
  - { front: "รายงานโครงงาน 5 บท", back: "บทนำ เอกสารที่เกี่ยวข้อง วิธีดำเนินการ ผลการศึกษา สรุปอภิปรายผลและข้อเสนอแนะ" }
  - { front: "อ้างอิงข้อความที่คัดลอก (นาม-ปี)", back: "\"ข้อความ\" (ชื่อ นามสกุล, ปี, น. เลขหน้า)" }
  - { front: "เรียงบรรณานุกรมภาษาไทย", back: "ตามพยัญชนะต้นแบบพจนานุกรม ไม่นับสระหน้า แล้วจึงภาษาอังกฤษ" }
  - { front: "ป้องกันการลอกเลียน", back: "จดที่มาทุกครั้ง ใส่อัญประกาศเมื่อคัดลอก ถอดความจากความเข้าใจแล้วอ้างอิง" }
