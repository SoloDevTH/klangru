    solution: "$\\omega^2 = 3g/L = 24.5\\ \\mathrm{rad^2/s^2}$ ได้ $O = mg + m\\dfrac{3g}{L}\\dfrac{L}{2} = \\tfrac52mg = 147.2\\ \\mathrm{N}$ (ตรวจด้วยการอินทิเกรตสมการ $\\ddot\\theta = \\tfrac{3g}{2L}\\cos\\theta$ เชิงตัวเลขได้ $\\omega$ เดียวกัน)"
