problems:
  - id: math.number.financial-math.p001
    topics: [math.number.financial-math]
    difficulty: 1
    type: mcq
    stem: "ราคาสินค้าเพิ่มขึ้น 7% ราคาใหม่เท่ากับราคาเดิมคูณด้วยจำนวนใด"
    choices:
      - { id: a, text: "1.07", correct: true }
      - { id: b, text: "0.07", feedback: "คูณ 0.07 ได้แค่ส่วนที่เพิ่ม ต้องรวมราคาเดิม (100%) ด้วย" }
      - { id: c, text: "1.7", feedback: "7% = 0.07 ไม่ใช่ 0.7 ตัวคูณจึงเป็น 1 + 0.07" }
      - { id: d, text: "0.93", feedback: "0.93 คือตัวคูณของการลดลง 7%" }
    hints:
      - "ราคาใหม่ = 100% + 7% ของราคาเดิม"
      - "เปลี่ยน 107% เป็นทศนิยม"
    solution: "ราคาใหม่ $= (100\\% + 7\\%) \\times$ ราคาเดิม $= 1.07 \\times$ ราคาเดิม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.financial-math.p002
    topics: [math.number.financial-math]
    difficulty: 1
    type: numeric
    stem: "ฝากเงิน 10,000 บาท ได้ดอกเบี้ยคงต้น 2% ต่อปี (อัตราสมมติ) เป็นเวลา 3 ปี ได้ดอกเบี้ยรวมกี่บาท"
    answer: { value: 600, unit: บาท }
    hints:
      - "ดอกเบี้ยคงต้น $I = Prt$"
      - "$r = 0.02$ และ $t = 3$"
    misconceptions:
      - { match: 612.08, feedback: "นี่คือดอกเบี้ยทบต้น โจทย์ให้คิดแบบคงต้น" }
      - { match: 60000, feedback: "ใช้ $r = 2$ แทน $0.02$ ต้องเปลี่ยนร้อยละเป็นทศนิยมก่อน" }
    solution: "$I = 10{,}000 \\times 0.02 \\times 3 = 600$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.financial-math.p003
    topics: [math.number.financial-math]
    difficulty: 2
    type: numeric
    stem: "ฝากเงิน 50,000 บาท อัตรา 3% ต่อปี ทบต้นปีละครั้ง (อัตราสมมติ) เมื่อครบ 2 ปีจะมีเงินรวมกี่บาท"
    answer: { value: 53045, unit: บาท }
    hints:
      - "ทบต้นปีละครั้ง: $S = P(1 + r)^n$"
      - "คำนวณ $50{,}000 \\times 1.03 \\times 1.03$"
    misconceptions:
      - { match: 53000, feedback: "นี่คือดอกเบี้ยคงต้น ปีที่สองต้องคิดดอกเบี้ยจาก 51,500 บาท" }
      - { match: 3045, feedback: "3,045 บาทคือดอกเบี้ย โจทย์ถามเงินรวม" }
    solution: "ปีแรก $50{,}000 \\times 1.03 = 51{,}500$ ปีที่สอง $51{,}500 \\times 1.03 = 53{,}045$ บาท หรือ $50{,}000(1.03)^2 = 53{,}045$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.financial-math.p004
    topics: [math.number.financial-math]
    difficulty: 1
    type: numeric
    stem: "เสื้อนักเรียนราคา 450 บาท ร้านลดราคา 20% ต้องจ่ายกี่บาท"
    answer: { value: 360, unit: บาท }
    hints:
      - "ลด 20% คือจ่าย 80% ของราคาเดิม"
      - "คูณ 450 ด้วย 0.8"
    misconceptions:
      - { match: 90, feedback: "90 บาทคือส่วนลด ต้องจ่าย $450 - 90$" }
      - { match: 430, feedback: "ลด 20% ไม่ใช่ลด 20 บาท" }
    solution: "$450 \\times 0.8 = 360$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.financial-math.p005
    topics: [math.number.financial-math]
    difficulty: 2
    type: numeric
    stem: "บัญชีเงินฝากของธนาคารออมสินแบบหนึ่ง สมมติให้ดอกเบี้ย 2% ต่อปี ทบต้นทุก 6 เดือน (อัตราตัวอย่าง ไม่ใช่อัตราจริง) ฝาก 10,000 บาท ครบ 1 ปีจะมีเงินรวมกี่บาท"
    answer: { value: 10201, unit: บาท }
    hints:
      - "ทบทุก 6 เดือน คือปีละ 2 งวด อัตราต่องวด $i = \\tfrac{2\\%}{2} = 1\\%$"
      - "$S = 10{,}000(1.01)^2$"
    misconceptions:
      - { match: 10200, feedback: "คิดเหมือนทบปีละครั้ง ทบทุก 6 เดือนทำให้ครึ่งปีหลังได้ดอกเบี้ยจากดอกเบี้ยครึ่งปีแรกด้วย" }
      - { match: 10404, feedback: "ใช้ 2% ต่องวด แต่ 2% เป็นอัตราต่อปี ต้องแบ่งครึ่งเป็น 1% ต่องวด" }
    solution: "$i = 0.01$, $n = 2$: $S = 10{,}000(1.01)^2 = 10{,}201$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.financial-math.p006
    topics: [math.number.financial-math]
    difficulty: 3
    type: numeric
    stem: "ต้นต้องการมีเงิน 100,000 บาทในอีก 5 ปีเพื่อเป็นทุนเรียนมหาวิทยาลัย ถ้าฝากได้ดอกเบี้ย 4% ต่อปี ทบต้นปีละครั้ง (อัตราสมมติ) ต้องฝากวันนี้กี่บาท (ทศนิยมสองตำแหน่ง)"
    answer: { value: 82192.71, tolerance: 1, unit: บาท }
    hints:
      - "หามูลค่าปัจจุบันของ 100,000 บาทในอีก 5 ปี"
      - "$P = \\dfrac{S}{(1 + i)^n}$"
    misconceptions:
      - { match: 80000, feedback: "หักดอกเบี้ยแบบคงต้น $4\\% \\times 5 = 20\\%$ แต่ดอกเบี้ยทบต้น ต้องหารด้วย $(1.04)^5$" }
      - { match: 121665.29, feedback: "นี่คือมูลค่าอนาคตของ 100,000 บาท โจทย์ถามเงินที่ต้องฝากวันนี้" }
    solution: "$P = \\dfrac{100{,}000}{(1.04)^5} = \\dfrac{100{,}000}{1.216653} \\approx 82{,}192.71$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.financial-math.p007
    topics: [math.number.financial-math]
    difficulty: 3
    type: numeric
    stem: "ฝากเงิน 30,000 บาท อัตรา 6% ต่อปี ทบต้นทุกเดือน (อัตราสมมติ) เมื่อครบ 2 ปีมีเงินรวมกี่บาท (ทศนิยมสองตำแหน่ง)"
    answer: { value: 33814.79, tolerance: 1, unit: บาท }
    hints:
      - "อัตราต่อเดือน $i = \\tfrac{0.06}{12} = 0.005$"
      - "จำนวนงวด $n = 24$ เดือน"
    misconceptions:
      - { match: 33708, feedback: "ทบปีละครั้ง $30{,}000(1.06)^2$ แต่โจทย์ทบทุกเดือน" }
      - { match: 33600, feedback: "นี่คือดอกเบี้ยคงต้น $30{,}000(1 + 0.06 \\times 2)$" }
    solution: "$S = 30{,}000(1.005)^{24} \\approx 30{,}000 \\times 1.127160 = 33{,}814.79$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.financial-math.p008
    topics: [math.number.financial-math]
    difficulty: 3
    type: mcq
    stem: "บัตรเงินสดใบหนึ่งคิดดอกเบี้ย 12% ต่อปี ทบต้นทุกเดือน (อัตราสมมติ) อัตราดอกเบี้ยที่แท้จริงต่อปีใกล้เคียงข้อใดที่สุด"
    choices:
      - { id: a, text: "12.68%", correct: true }
      - { id: b, text: "12%", feedback: "12% คืออัตราที่ประกาศ แต่ทบทุกเดือนทำให้ดอกเบี้ยได้ดอกเบี้ยด้วย อัตราที่แท้จริงจึงสูงกว่า" }
      - { id: c, text: "1%", feedback: "1% คืออัตราต่อเดือน ไม่ใช่ต่อปี" }
      - { id: d, text: "144%", feedback: "ไม่ใช่ $12 \\times 12$ อัตราต่อเดือนคือ $12\\% \\div 12 = 1\\%$" }
    hints:
      - "อัตราต่อเดือน $i = 1\\%$"
      - "อัตราที่แท้จริงต่อปี $= (1 + i)^{12} - 1$"
    solution: "$(1.01)^{12} - 1 \\approx 1.126825 - 1 = 0.126825 \\approx 12.68\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.financial-math.p009
    topics: [math.number.financial-math]
    difficulty: 3
    type: numeric
    stem: "ฝ้ายฝากเงินทุกสิ้นเดือน เดือนละ 1,000 บาท เป็นเวลา 12 เดือน บัญชีให้ดอกเบี้ย 3% ต่อปี ทบต้นทุกเดือน (อัตราสมมติ) เมื่อฝากครบงวดที่ 12 มีเงินรวมกี่บาท (ทศนิยมสองตำแหน่ง)"
    answer: { value: 12166.38, tolerance: 0.5, unit: บาท }
    hints:
      - "อัตราต่อเดือน $i = 0.0025$ และ $n = 12$"
      - "ใช้มูลค่าอนาคตของค่ารายงวด $S = R\\,\\dfrac{(1 + i)^n - 1}{i}$"
    misconceptions:
      - { match: 12000, feedback: "นี่คือเงินที่ฝากรวม ยังไม่นับดอกเบี้ย" }
      - { match: 12196.8, feedback: "คิดเหมือนฝากต้นเดือน (งวดแรกได้ดอกเบี้ย 12 เดือน) แต่ฝากสิ้นเดือน งวดแรกได้ดอกเบี้ย 11 เดือน และงวดสุดท้ายไม่ได้ดอกเบี้ย" }
    solution: "$S = 1{,}000 \\times \\dfrac{(1.0025)^{12} - 1}{0.0025} \\approx 1{,}000 \\times 12.16638 = 12{,}166.38$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.financial-math.p010
    topics: [math.number.financial-math]
    difficulty: 4
    type: numeric
    stem: "ครอบครัวหนึ่งกู้ซื้อทาวน์เฮาส์ 1,000,000 บาท ผ่อนเท่ากันทุกสิ้นเดือน 15 ปี สมมติดอกเบี้ย 4.8% ต่อปี คิดแบบลดต้นลดดอกรายเดือน จงหาค่างวดต่อเดือน (บาท ทศนิยมสองตำแหน่ง)"
    answer: { value: 7804.14, tolerance: 1, unit: บาท }
    hints:
      - "$i = \\tfrac{0.048}{12} = 0.004$ และ $n = 15 \\times 12 = 180$"
      - "เงินกู้คือมูลค่าปัจจุบันของค่างวด $R = \\dfrac{Pi}{1 - (1 + i)^{-n}}$"
    misconceptions:
      - { match: 5555.56, feedback: "หารเงินต้นด้วย 180 งวดโดยไม่คิดดอกเบี้ย" }
      - { match: 9555.56, feedback: "คิดดอกเบี้ยจากเงินต้นเต็มตลอด 15 ปี (แบบ flat rate) แต่โจทย์คิดแบบลดต้นลดดอก" }
    solution: "$(1.004)^{-180} \\approx 0.48745$ จึง $R = \\dfrac{1{,}000{,}000 \\times 0.004}{1 - 0.48745} \\approx 7{,}804.14$ บาทต่อเดือน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.financial-math.p011
    topics: [math.number.financial-math]
    difficulty: 4
    type: numeric
    stem: "ฝากเงินก้อนหนึ่ง ได้ดอกเบี้ย 5% ต่อปี ทบต้นปีละครั้ง (อัตราสมมติ) ต้องฝากอย่างน้อยกี่ปีเต็ม เงินรวมจึงเพิ่มเป็นอย่างน้อยสองเท่าของเงินต้น"
    answer: { value: 15, unit: ปี }
    hints:
      - "ต้องการ $(1.05)^n \\ge 2$"
      - "ใช้ลอการิทึม $n \\ge \\dfrac{\\log 2}{\\log 1.05}$ แล้วปัดขึ้นเป็นจำนวนเต็ม"
    misconceptions:
      - { match: 20, feedback: "$100\\% \\div 5\\% = 20$ ปี คือคำตอบของดอกเบี้ยคงต้น ทบต้นถึงสองเท่าเร็วกว่า" }
      - { match: 14, feedback: "$n \\approx 14.2$ ถ้าฝาก 14 ปีได้ $(1.05)^{14} \\approx 1.98$ ยังไม่ถึงสองเท่า ต้องปัดขึ้น" }
    solution: "$n \\ge \\dfrac{\\log 2}{\\log 1.05} \\approx 14.2$ จึงต้องฝาก 15 ปี ตรวจ $(1.05)^{14} \\approx 1.980$ และ $(1.05)^{15} \\approx 2.079$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.financial-math.p012
    topics: [math.number.financial-math]
    difficulty: 4
    type: mcq
    stem: "รถจักรยานยนต์ราคา 60,000 บาท ร้านเสนอสองทาง (A) จ่ายเงินสดวันนี้ ลด 5% (B) ผ่อน 0% เดือนละ 5,000 บาท ทุกสิ้นเดือน 12 เดือน ถ้าเงินของผู้ซื้อฝากได้ดอกเบี้ย 0.5% ต่อเดือน ทบต้นรายเดือน (อัตราสมมติ) ทางใดถูกกว่าเมื่อเทียบมูลค่าปัจจุบัน"
    choices:
      - { id: a, text: "A ถูกกว่า (57,000 บาท เทียบกับมูลค่าปัจจุบันของค่างวดประมาณ 58,095 บาท)", correct: true }
      - { id: b, text: "B ถูกกว่า เพราะดอกเบี้ย 0% จ่ายแค่ 60,000 บาท", feedback: "B จ่ายรวม 60,000 บาทแต่จ่ายทีละงวด ต้องเทียบมูลค่าปัจจุบัน ซึ่งประมาณ 58,095 บาท ยังแพงกว่า 57,000 บาท" }
      - { id: c, text: "B ถูกกว่า เพราะมูลค่าปัจจุบันของค่างวดประมาณ 56,400 บาท", feedback: "56,400 บาทได้จากการหักดอกเบี้ย 0.5% × 12 = 6% ของค่างวดทุกงวด แต่งวดแรกห่างจากวันนี้แค่ 1 เดือน ต้องย้อนทีละงวด" }
      - { id: d, text: "เท่ากัน", feedback: "ทั้งสองทางมีมูลค่าปัจจุบันต่างกันประมาณ 1,095 บาท" }
    hints:
      - "มูลค่าปัจจุบันของค่ารายงวด $P = R\\,\\dfrac{1 - (1 + i)^{-n}}{i}$"
      - "$R = 5{,}000$, $i = 0.005$, $n = 12$ แล้วเทียบกับ $60{,}000 \\times 0.95$"
    solution: "ทาง A จ่าย $57{,}000$ บาท ทาง B มีมูลค่าปัจจุบัน $5{,}000 \\times \\dfrac{1 - (1.005)^{-12}}{0.005} \\approx 58{,}094.66$ บาท ทาง A จึงถูกกว่าประมาณ 1,095 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.financial-math.p013
    topics: [math.number.financial-math]
    difficulty: 3
    type: numeric
    stem: "เช่าซื้อรถยนต์ ยอดจัด 400,000 บาท ดอกเบี้ยแบบเงินต้นคงที่ (flat rate) 3% ต่อปี (อัตราสมมติ) ผ่อน 4 ปี 48 งวดเท่ากัน ดอกเบี้ยคิดจากยอดจัดเต็มทุกปี ค่างวดเดือนละกี่บาท (ทศนิยมสองตำแหน่ง)"
    answer: { value: 9333.33, tolerance: 0.5, unit: บาท }
    hints:
      - "ดอกเบี้ยรวม $= 400{,}000 \\times 0.03 \\times 4$"
      - "ค่างวด $= \\dfrac{\\text{ยอดจัด} + \\text{ดอกเบี้ยรวม}}{48}$"
    misconceptions:
      - { match: 8583.33, feedback: "คิดดอกเบี้ยแค่ปีเดียว ต้องคูณ 4 ปี" }
      - { match: 8333.33, feedback: "หารยอดจัดด้วย 48 โดยไม่รวมดอกเบี้ย" }
    solution: "ดอกเบี้ยรวม $400{,}000 \\times 0.03 \\times 4 = 48{,}000$ บาท ค่างวด $\\dfrac{448{,}000}{48} \\approx 9{,}333.33$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.financial-math.p014
    topics: [math.number.financial-math]
    difficulty: 5
    type: numeric
    stem: "จากการเช่าซื้อในข้อก่อน (ยอดจัด 400,000 บาท ค่างวด $9{,}333.33$ บาท 48 งวด) ถ้าคิดแบบลดต้นลดดอก อัตราต่อเดือน $i$ ที่ทำให้ $400{,}000 = 9{,}333.33 \\times \\dfrac{1 - (1 + i)^{-48}}{i}$ ประมาณ $0.4724\\%$ จงหาอัตราต่อปี $12i$ เป็นร้อยละ (ทศนิยมหนึ่งตำแหน่ง)"
    answer: { value: 5.7, tolerance: 0.1, unit: "%" }
    hints:
      - "อัตราต่อปีแบบลดต้นลดดอก $= 12 \\times$ อัตราต่อเดือน"
      - "$12 \\times 0.4724\\%$"
    misconceptions:
      - { match: 3, feedback: "3% คืออัตรา flat ที่ประกาศ อัตราลดต้นลดดอกที่เท่ากันสูงกว่ามาก เพราะ flat rate คิดดอกเบี้ยจากยอดที่ผ่อนคืนไปแล้วด้วย" }
      - { match: 0.5, feedback: "0.47% คืออัตราต่อเดือน ต้องคูณ 12" }
    solution: "$12 \\times 0.4724\\% \\approx 5.67\\% \\approx 5.7\\%$ ต่อปี เกือบสองเท่าของ 3% ที่ประกาศ (ตรวจ: แทน $i = 0.004724$ ได้มูลค่าปัจจุบันประมาณ 400,000 บาท)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.financial-math.p015
    topics: [math.number.financial-math]
    difficulty: 4
    type: numeric
    stem: "ผู้ได้รางวัลเลือกได้ว่าจะรับเงินก้อน 1,000,000 บาทวันนี้ หรือรับปีละ 120,000 บาท ทุกสิ้นปี 10 ปี ถ้าอัตราดอกเบี้ย 4% ต่อปี ทบต้นปีละครั้ง (อัตราสมมติ) จงหามูลค่าปัจจุบันของทางเลือกแบบรายปี (บาท ปัดเป็นจำนวนเต็ม)"
    answer: { value: 973307, tolerance: 2, unit: บาท }
    hints:
      - "$P = R\\,\\dfrac{1 - (1 + i)^{-n}}{i}$ เมื่อ $R = 120{,}000$, $i = 0.04$, $n = 10$"
