    stem: "มีข้อความส่งต่อกันว่า \"ฉีดวัคซีนแล้วจะป่วยเป็นโรคที่วัคซีนป้องกัน จึงไม่ควรฉีด\" ข้อใดตอบได้ถูกต้องตามหลักวิชาที่สุด"
    choices:
