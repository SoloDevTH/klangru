id: business.law.contracts
subject: business
title:
  th: 'กฎหมายธุรกิจ: สัญญา ซื้อขาย และการจดทะเบียนธุรกิจ'
  en: 'Business law: contracts, sale and business registration'
summary: นิติกรรมและสัญญาตามประมวลกฎหมายแพ่งและพาณิชย์ โมฆะและโมฆียะ ซื้อขาย เช่า กู้ยืม ค้ำประกัน รูปแบบธุรกิจและการจดทะเบียน และกฎหมายที่เกี่ยวกับการขายของออนไลน์
difficulty: 5
minutes: 45
prerequisites:
- management.principles.functions
- business.econ.consumer-rights
encompasses:
- id: business.econ.consumer-rights
  weight: 0.2
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  src: contract-validity.svg
  alt: ผังตรวจสัญญาห้าขั้นเรียงจากบนลงล่าง แต่ละขั้นถ้าไม่ผ่านมีลูกศรไปกล่องผลทางขวา ขั้น 1 คำเสนอและคำสนองตรงกันหรือไม่ ถ้าไม่ตรง ยังไม่เกิดสัญญา ขั้น 2 วัตถุประสงค์ผิดกฎหมาย พ้นวิสัย หรือขัดศีลธรรม ถ้าใช่ เป็นโมฆะ ขั้น 3 กฎหมายบังคับแบบ ถ้าไม่ทำตามแบบ เป็นโมฆะ ขั้น 4 สำคัญผิดในสาระสำคัญ ถ้าใช่ เป็นโมฆะ ขั้น 5 ผู้เยาว์ไม่ได้รับความยินยอม หรือถูกฉ้อฉล ข่มขู่ ถ้าใช่ เป็นโมฆียะ ผ่านทุกขั้นจึงเป็นสัญญาสมบูรณ์ หมายเหตุ โมฆะคือเสียเปล่าตั้งแต่ต้น โมฆียะคือสมบูรณ์จนกว่าจะถูกบอกล้าง และสัญญาบางชนิดต้องมีหลักฐานเป็นหนังสือจึงฟ้องร้องได้ เช่น กู้ยืมเงินเกิน 2,000 บาท
  caption: 'ตรวจสัญญาทีละขั้น: เกิดหรือยัง ผิดกฎหมายหรือไม่ ทำตามแบบหรือไม่ เจตนาบกพร่องหรือไม่'
- type: worked-example
  title: ตรวจสัญญาเช่าแผงตลาดนัด
  problem: นายวินัยตกลงเช่าแผงในตลาดนัด $2$ ปี ค่าเช่าเดือนละ $3{,}000$ บาท วางเงินประกัน $2$ เดือน ทั้งสองฝ่ายตกลงด้วยวาจา (สมมติ) ถ้าเกิดข้อพิพาท นายวินัยฟ้องร้องให้เจ้าของตลาดปฏิบัติตามสัญญาได้หรือไม่ และควรทำอย่างไร
  steps:
  - text: แผงในตลาดที่ติดกับพื้นที่ถือเป็นการเช่าอสังหาริมทรัพย์
    why: สิ่งปลูกสร้างและที่ดินเป็นอสังหาริมทรัพย์
  - text: การเช่าอสังหาริมทรัพย์ต้องมีหลักฐานเป็นหนังสือลงลายมือชื่อฝ่ายที่ต้องรับผิด จึงฟ้องร้องบังคับคดีได้
    why: ขาดหลักฐาน สัญญาไม่เป็นโมฆะ แต่ฟ้องบังคับไม่ได้
  - text: สัญญา $2$ ปีไม่เกิน $3$ ปี จึงไม่ต้องจดทะเบียน แต่ควรทำเป็นหนังสือ
  - text: ในหนังสือสัญญาควรระบุ แผงเลขที่ ระยะเวลา ค่าเช่าและวันชำระ เงินประกัน $2 \times 3{,}000 = 6{,}000$ บาท เงื่อนไขการคืนเงินประกัน และการเช่าช่วง แล้วลงชื่อทั้งสองฝ่าย
  answer: สัญญาด้วยวาจาไม่เป็นโมฆะ แต่ฟ้องร้องบังคับไม่ได้ ควรทำเป็นหนังสือ เงินประกัน $6{,}000$ บาท
- type: check
  problem: business.law.contracts.p007
  prompt: หักอะไรออกจากเงินประกันได้บ้าง
- type: figure
  src: business-forms.svg
  alt: ตารางเปรียบเทียบสี่รูปแบบธุรกิจ เจ้าของคนเดียว ผู้ก่อตั้ง 1 คน ไม่เป็นนิติบุคคล รับผิดไม่จำกัด จดทะเบียนพาณิชย์ เสียภาษีแบบบุคคลธรรมดา ห้างหุ้นส่วนสามัญ 2 คนขึ้นไป เป็นนิติบุคคลเมื่อจดทะเบียน หุ้นส่วนทุกคนรับผิดไม่จำกัดร่วมกัน จดที่กรมพัฒนาธุรกิจการค้า ภาษีบุคคลธรรมดาถ้าไม่จดทะเบียน ห้างหุ้นส่วนจำกัด 2 คนขึ้นไป ต้องจดทะเบียน มีหุ้นส่วนทั้งจำกัดและไม่จำกัดความรับผิด เสียภาษีนิติบุคคล บริษัทจำกัด ผู้เริ่มก่อการ 2 คนขึ้นไป ต้องจดทะเบียน ผู้ถือหุ้นรับผิดไม่เกินค่าหุ้นที่ยังไม่ชำระ เสียภาษีนิติบุคคล หมายเหตุว่าห้างหุ้นส่วนสามัญที่จดทะเบียนเสียภาษีนิติบุคคล และควรตรวจข้อมูลล่าสุดกับหน่วยงาน
  caption: รูปแบบธุรกิจต่างกันที่จำนวนผู้ก่อตั้ง ความเป็นนิติบุคคล และความรับผิดในหนี้
- type: worked-example
  title: ความรับผิดเมื่อธุรกิจขาดทุน
  problem: สามเพื่อนเปิดร้านกาแฟ (สมมติ) ลงทุนคนละ $200{,}000$ บาท ร้านปิดกิจการโดยมีหนี้เกินทรัพย์สิน $900{,}000$ บาท เปรียบเทียบความเสี่ยงของเพื่อนแต่ละคนถ้าตั้งเป็นห้างหุ้นส่วนสามัญ กับถ้าตั้งเป็นบริษัทจำกัดที่ชำระค่าหุ้นครบแล้ว
  steps:
  - text: 'ห้างหุ้นส่วนสามัญ: หุ้นส่วนทุกคนรับผิดร่วมกันโดยไม่จำกัด'
    why: เจ้าหนี้เรียกจากหุ้นส่วนคนใดก็ได้จนครบ
  - text: เจ้าหนี้เรียกหนี้ $900{,}000$ บาทจากคนใดคนหนึ่งเต็มจำนวนได้ คนที่จ่ายไปจึงไปเรียกส่วนของตน ($300{,}000$ บาท/คน ถ้าแบ่งเท่ากัน) จากเพื่อนภายหลัง
  - text: 'บริษัทจำกัด: ผู้ถือหุ้นรับผิดไม่เกินค่าหุ้นที่ยังชำระไม่ครบ'
    why: บริษัทเป็นนิติบุคคลแยกจากผู้ถือหุ้น
  - text: ชำระครบแล้ว จึงเสียเฉพาะเงินลงทุนคนละ $200{,}000$ บาท ไม่ต้องจ่ายหนี้ $900{,}000$ บาทจากทรัพย์สินส่วนตัว (เว้นแต่ไปค้ำประกันหนี้ของบริษัทไว้เป็นการส่วนตัว)
  answer: 'ห้างหุ้นส่วนสามัญ: อาจต้องจ่ายหนี้ถึง $900{,}000$ บาท · บริษัทจำกัด: เสียเพียงเงินลงหุ้น'
- type: check
  problem: business.law.contracts.p002
  prompt: คำว่า จำกัด หมายถึงอะไร
glossary:
- term: นิติกรรม
  definition: การกระทำโดยสมัครใจและชอบด้วยกฎหมาย มุ่งให้เกิดผลทางกฎหมาย เช่น ก่อ เปลี่ยน โอน หรือระงับสิทธิ
- term: สัญญา
  definition: นิติกรรมสองฝ่ายขึ้นไปที่เกิดจากคำเสนอและคำสนองถูกต้องตรงกัน
- term: โมฆะ
  definition: เสียเปล่า ไม่มีผลทางกฎหมายตั้งแต่ต้น ใครก็ยกขึ้นอ้างได้
- term: โมฆียะ
  definition: มีผลสมบูรณ์จนกว่าผู้มีสิทธิจะบอกล้าง ถ้าบอกล้างถือว่าเป็นโมฆะมาแต่แรก
- term: ผู้เยาว์
  definition: บุคคลที่ยังไม่บรรลุนิติภาวะ คือยังไม่ครบ 20 ปีบริบูรณ์และยังไม่ได้สมรสตามกฎหมาย
- term: หลักฐานเป็นหนังสือ
  definition: เอกสารลงลายมือชื่อฝ่ายที่ต้องรับผิด ใช้ฟ้องร้องบังคับคดีสำหรับสัญญาบางชนิด
- term: เช่าซื้อ
  definition: สัญญาที่เจ้าของให้เช่าทรัพย์และให้คำมั่นว่าจะขายหรือให้ทรัพย์เป็นของผู้เช่าเมื่อผ่อนครบ ต้องทำเป็นหนังสือ
- term: ค้ำประกัน
  definition: สัญญาที่บุคคลภายนอกตกลงชำระหนี้แทนเมื่อลูกหนี้ไม่ชำระ
- term: นิติบุคคล
  definition: บุคคลตามกฎหมาย เช่น บริษัทหรือห้างหุ้นส่วนที่จดทะเบียน มีสิทธิและหน้าที่แยกจากเจ้าของ
flashcards:
- front: โมฆะ กับ โมฆียะ
  back: โมฆะ = เสียเปล่าตั้งแต่ต้น (ผิดกฎหมาย ไม่ทำตามแบบ) · โมฆียะ = สมบูรณ์จนกว่าบอกล้าง (ผู้เยาว์ ฉ้อฉล ข่มขู่)
- front: ต้องทำเป็นหนังสือและจดทะเบียน
  back: ซื้อขายที่ดินและอสังหาริมทรัพย์ (ไม่ทำ = โมฆะ)
- front: ต้องมีหลักฐานเป็นหนังสือจึงฟ้องได้
  back: กู้ยืมเงินเกิน 2,000 บาท · เช่าอสังหาริมทรัพย์ · ค้ำประกัน
- front: เพดานดอกเบี้ยเงินกู้ระหว่างบุคคล
  back: ไม่เกิน 15% ต่อปี เกินแล้วข้อตกลงดอกเบี้ยโมฆะ
- front: บริษัทจำกัด
  back: ผู้เริ่มก่อการ 2 คนขึ้นไป · ผู้ถือหุ้นรับผิดไม่เกินค่าหุ้นที่ยังไม่ชำระ · จดที่กรมพัฒนาธุรกิจการค้า
