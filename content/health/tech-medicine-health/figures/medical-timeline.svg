<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" font-family="sans-serif">
<title>เส้นเวลาความก้าวหน้าทางการแพทย์บางเรื่อง</title>
<rect x="0" y="0" width="760" height="350" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="380.0" y="28.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">ความก้าวหน้าทางการแพทย์บางเรื่องที่เปลี่ยนสุขภาพของผู้คน</text>
<line x1="40.0" y1="215.0" x2="720.0" y2="215.0" stroke="#555" stroke-width="3"/>
<circle cx="76.0" cy="215.0" r="7" fill="#2e86c1" stroke="#1b4f72" stroke-width="1.5"/>
<line x1="76.0" y1="207.0" x2="76.0" y2="175.0" stroke="#888" stroke-width="1"/>
<text x="76.0" y="137.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b4f72">1796</text>
<text x="76.0" y="155.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">วัคซีนชนิดแรก</text>
<text x="76.0" y="171.0" font-size="11" text-anchor="middle" fill="#333">เจนเนอร์ ป้องกันฝีดาษ</text>
<circle cx="340.0" cy="215.0" r="7" fill="#2e86c1" stroke="#1b4f72" stroke-width="1.5"/>
<line x1="340.0" y1="223.0" x2="340.0" y2="255.0" stroke="#888" stroke-width="1"/>
<text x="340.0" y="273.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b4f72">1895</text>
<text x="340.0" y="291.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">ค้นพบรังสีเอกซ์</text>
<text x="340.0" y="307.0" font-size="11" text-anchor="middle" fill="#333">เรินต์เกน ใช้ถ่ายภาพกระดูก</text>
<circle cx="428.0" cy="215.0" r="7" fill="#2e86c1" stroke="#1b4f72" stroke-width="1.5"/>
<line x1="428.0" y1="207.0" x2="428.0" y2="175.0" stroke="#888" stroke-width="1"/>
<text x="428.0" y="137.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b4f72">1928</text>
<text x="428.0" y="155.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">ค้นพบเพนิซิลลิน</text>
<text x="428.0" y="171.0" font-size="11" text-anchor="middle" fill="#333">เฟลมมิง ยาปฏิชีวนะ</text>
<circle cx="566.7" cy="215.0" r="7" fill="#2e86c1" stroke="#1b4f72" stroke-width="1.5"/>
<line x1="566.7" y1="223.0" x2="566.7" y2="255.0" stroke="#888" stroke-width="1"/>
<text x="566.7" y="273.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b4f72">1980</text>
<text x="566.7" y="291.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">WHO ประกาศ</text>
<text x="566.7" y="307.0" font-size="11" text-anchor="middle" fill="#333">กวาดล้างไข้ทรพิษสำเร็จ</text>
<circle cx="588.0" cy="215.0" r="7" fill="#2e86c1" stroke="#1b4f72" stroke-width="1.5"/>
<line x1="588.0" y1="207.0" x2="588.0" y2="110.0" stroke="#888" stroke-width="1"/>
<text x="588.0" y="72.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b4f72">1988</text>
<text x="588.0" y="90.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">เริ่มกวาดล้างโปลิโอ</text>
<text x="588.0" y="106.0" font-size="11" text-anchor="middle" fill="#333">ผู้ป่วยลดลงกว่า 99%</text>
<circle cx="673.3" cy="215.0" r="7" fill="#2e86c1" stroke="#1b4f72" stroke-width="1.5"/>
<line x1="673.3" y1="207.0" x2="673.3" y2="175.0" stroke="#888" stroke-width="1"/>
<text x="673.3" y="137.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b4f72">ปัจจุบัน</text>
<text x="673.3" y="155.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">การแพทย์ทางไกล</text>
<text x="673.3" y="171.0" font-size="11" text-anchor="middle" fill="#333">แอปสุขภาพ พบแพทย์ออนไลน์</text>
<text x="380.0" y="342.0" font-size="11" text-anchor="middle" fill="#555">ระยะบนเส้นเวลาเป็นสัดส่วนกับจำนวนปี</text>
</svg>
