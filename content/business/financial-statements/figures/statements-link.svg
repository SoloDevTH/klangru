<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="sans-serif" font-size="14">
  <title>ความเชื่อมโยงของงบการเงินทั้งสี่ของร้านเครื่องเขียน</title>
  <rect x="0" y="0" width="820" height="400" fill="#ffffff"/>
  <rect x="20.0" y="30.0" width="230.0" height="150.0" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="135.0" y="83.2" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">งบกำไรขาดทุน</text>
  <text x="135.0" y="100.8" text-anchor="middle" fill="#1f2937" font-size="13">รายได้ 450,000</text>
  <text x="135.0" y="118.3" text-anchor="middle" fill="#1f2937" font-size="13">− ค่าใช้จ่าย 350,000</text>
  <text x="135.0" y="135.9" text-anchor="middle" fill="#1f2937" font-size="13">กำไรสุทธิ 100,000</text>
  <rect x="275.0" y="30.0" width="230.0" height="150.0" rx="8" fill="#ede9fe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="390.0" y="74.5" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">งบแสดงการเปลี่ยนแปลง</text>
  <text x="390.0" y="92.0" text-anchor="middle" fill="#1f2937" font-size="13">ส่วนของเจ้าของ</text>
  <text x="390.0" y="109.6" text-anchor="middle" fill="#1f2937" font-size="13">ทุนต้นงวด 200,000</text>
  <text x="390.0" y="127.1" text-anchor="middle" fill="#1f2937" font-size="13">+ กำไรสุทธิ 100,000</text>
  <text x="390.0" y="144.7" text-anchor="middle" fill="#1f2937" font-size="13">− ถอนใช้ 24,000 = 276,000</text>
  <rect x="575.0" y="30.0" width="230.0" height="330.0" rx="8" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="690.0" y="120.6" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">งบแสดงฐานะการเงิน</text>
  <text x="690.0" y="138.1" text-anchor="middle" fill="#1f2937" font-size="13">ณ 31 ธ.ค.</text>
  <text x="690.0" y="155.7" text-anchor="middle" fill="#1f2937" font-size="13"></text>
  <text x="690.0" y="173.2" text-anchor="middle" fill="#1f2937" font-size="13">เงินสด 225,000</text>
  <text x="690.0" y="190.8" text-anchor="middle" fill="#1f2937" font-size="13">สินทรัพย์อื่น 138,000</text>
  <text x="690.0" y="208.3" text-anchor="middle" fill="#1f2937" font-size="13">รวมสินทรัพย์ 363,000</text>
  <text x="690.0" y="225.9" text-anchor="middle" fill="#1f2937" font-size="13"></text>
  <text x="690.0" y="243.4" text-anchor="middle" fill="#1f2937" font-size="13">หนี้สิน 87,000</text>
  <text x="690.0" y="261.0" text-anchor="middle" fill="#1f2937" font-size="13">ส่วนของเจ้าของ 276,000</text>
  <text x="690.0" y="278.5" text-anchor="middle" fill="#1f2937" font-size="13">รวม 363,000</text>
  <rect x="20.0" y="230.0" width="485.0" height="130.0" rx="8" fill="#fef3c7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="262.5" y="282.0" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">งบกระแสเงินสด</text>
  <text x="262.5" y="299.6" text-anchor="middle" fill="#1f2937" font-size="13">ดำเนินงาน +59,000 · ลงทุน −60,000 · จัดหาเงิน +226,000</text>
  <text x="262.5" y="317.1" text-anchor="middle" fill="#1f2937" font-size="13">เงินสดเพิ่มขึ้นสุทธิ 225,000 (ต้นงวด 0)</text>
  <line x1="250.0" y1="140.0" x2="269.6" y2="140.0" stroke="#1f2937" stroke-width="2"/>
  <polygon points="275.0,140.0 266.7,143.5 266.7,136.5" fill="#1f2937"/>
  <text x="262.0" y="128.0" text-anchor="middle" fill="#1f2937" font-size="11"></text>
  <line x1="505.0" y1="105.0" x2="569.6" y2="105.0" stroke="#1f2937" stroke-width="2"/>
  <polygon points="575.0,105.0 566.7,108.5 566.7,101.5" fill="#1f2937"/>
  <text x="540.0" y="96.0" text-anchor="middle" fill="#6d28d9" font-size="11">ทุนปลายงวด</text>
  <line x1="505.0" y1="265.0" x2="569.6" y2="265.0" stroke="#1f2937" stroke-width="2"/>
  <polygon points="575.0,265.0 566.7,268.5 566.7,261.5" fill="#1f2937"/>
  <text x="540.0" y="256.0" text-anchor="middle" fill="#8a6d1f" font-size="11">เงินสดปลายงวด</text>
  <text x="410.0" y="390.0" text-anchor="middle" fill="#6b7280" font-size="12">กำไรสุทธิไหลไปที่ส่วนของเจ้าของ · เงินสดปลายงวดในงบกระแสเงินสดตรงกับเงินสดในงบแสดงฐานะการเงิน</text>
</svg>
