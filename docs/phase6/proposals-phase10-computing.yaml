  - { id: computer.systems.parallel-computing, title: "การประมวลผลแบบขนาน: อัลกอริทึมและสถาปัตยกรรม", difficulty: 6.5, prereq: [computer.systems.processor-organization, computer.algorithms.design-strategies], indicators: ["acm-cs2023:PDC-Programs", "acm-cs2023:PDC-Algorithms", "acm-cs2023:PDC-Evaluation", "acm-cs2023:AR-Heterogeneity", "acm-cs2023:SF-Foundations"], scope: "ประมวลผลตามลำดับกับแบบขนาน ขนานข้อมูลกับขนานงาน การแบ่งงานและรวมผล (map–reduce ผลรวมแบบต้นไม้ ผลบวกสะสมแบบขนาน) งานทั้งหมดกับเส้นทางวิกฤต (work–span) กฎของแอมดาห์ล อัตราเร่ง ประสิทธิภาพ และค่าใช้จ่ายการสื่อสาร สถาปัตยกรรมหลายแกน SIMD GPU และตัวเร่งเฉพาะงาน (TPU) การประมวลผลแบบกระจายหลายเครื่อง โจทย์โค้ดคำนวณอัตราเร่งตามกฎของแอมดาห์ล และจำลองผลรวมแบบต้นไม้แล้วนับจำนวนรอบ" }
  # ลำดับ 2
