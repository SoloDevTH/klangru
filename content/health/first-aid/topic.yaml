id: health.safety.first-aid
subject: health
title: { th: การปฐมพยาบาลเบื้องต้นและการเรียกความช่วยเหลือ, en: "Basic first aid and calling for help" }
summary: สังเกตเหตุฉุกเฉิน โทร 1669 ห้ามเลือด ปฐมพยาบาลแผลไหม้ ช่วยคนสำลัก และหลักการกดหน้าอกด้วยมือเปล่า บทเรียนนี้ไม่แทนการฝึกกับครูฝึก
difficulty: 2
minutes: 35
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: เมื่อพบคนล้ม ทำอะไรก่อนหลัง
    src: emergency-flow.svg
    alt: "ผังขั้นตอน: พบคนล้มหรือบาดเจ็บ → ที่เกิดเหตุปลอดภัยไหม ถ้าไม่ปลอดภัย ไม่เข้าไป โทร 1669 (ไฟไหม้ 199 ตำรวจ 191) รอผู้มีอุปกรณ์ ถ้าปลอดภัย → ตบไหล่ เรียกดัง ๆ รู้สึกตัวไหม ถ้ารู้สึกตัว ถามอาการ ดูแลตามเหตุ อาการหนักโทร 1669 ถ้าไม่รู้สึกตัว → ตะโกนขอความช่วยเหลือ โทร 1669 เปิดลำโพง ให้คนไปหา AED → หายใจปกติไหม (ดูไม่เกิน 10 วินาที) ถ้าหายใจปกติ จัดท่าพักฟื้นนอนตะแคงและเฝ้าดู ถ้าไม่หายใจหรือหายใจเฮือก กดหน้าอกทันที แรงและเร็ว 100–120 ครั้งต่อนาที ลึก 5–6 เซนติเมตร ใช้ AED ทันทีที่มาถึง"
    caption: "ความปลอดภัยของผู้ช่วยมาก่อนเสมอ และโทร 1669 ให้เร็วที่สุด"
  - type: worked-example
    title: โทรแจ้ง 1669 ให้ได้ข้อมูลครบ
    problem: "ระหว่างรอรถเมล์หน้าตลาด มีชายสูงอายุล้มลงและไม่ตอบสนองเมื่อเรียก คุณเป็นคนโทร 1669 ควรพูดอะไรบ้าง"
    steps:
      - text: "ดูความปลอดภัยก่อน: ผู้ป่วยไม่ได้อยู่กลางถนน ไม่มีสายไฟหรือไฟ จึงเข้าไปช่วยได้"
        why: "ถ้าผู้ช่วยบาดเจ็บเพิ่ม จะกลายเป็นผู้ป่วยสองคนและไม่มีใครช่วย"
      - text: "โทร 1669 เปิดลำโพง แล้วบอกว่าเกิดอะไรขึ้น: \"ผู้ชายสูงอายุหนึ่งคนล้มลง เรียกแล้วไม่ตอบ\""
      - text: "บอกสถานที่ให้ชัด พร้อมจุดสังเกต: \"ป้ายรถเมล์หน้าตลาด... ตรงข้ามร้านสะดวกซื้อ\""
        why: "ทีมกู้ชีพต้องหาเจอให้เร็วที่สุด จุดสังเกตช่วยได้มากในที่ที่ไม่มีเลขที่บ้าน"
      - text: "ตอบคำถามเรื่องอาการ เช่น หายใจปกติหรือไม่ แล้วให้ชื่อและเบอร์โทรกลับ"
      - text: "อย่าวางสายก่อนเจ้าหน้าที่บอก และทำตามคำแนะนำ เช่น เริ่มกดหน้าอกถ้าผู้ป่วยไม่หายใจปกติ"
        why: "เจ้าหน้าที่สอนวิธีช่วยทางโทรศัพท์ได้ และอาจถามข้อมูลเพิ่มขณะส่งรถออกมาแล้ว"
    answer: "บอกเหตุการณ์ จำนวนผู้ป่วย สถานที่และจุดสังเกต อาการ ชื่อและเบอร์โทรกลับ แล้วถือสายไว้และทำตามคำแนะนำ"
  - { type: check, problem: hlt.aid.p002, prompt: "ก่อนช่วยใคร ต้องคิดเรื่องนี้ก่อน" }
  - type: figure
    title: ตำแหน่งวางมือเมื่อกดหน้าอก
    src: cpr-hands.svg
    alt: "ภาพลำตัวด้านหน้าอย่างง่าย มีแท่งกระดูกหน้าอกตรงกลาง วงกลมสีแดงอยู่ที่ครึ่งล่างของกระดูกหน้าอก กึ่งกลางหน้าอก ป้ายว่าจุดวางส้นมือ กล่องข้อความ: 1 วางส้นมือข้างหนึ่งที่จุดนี้ อีกมือวางทับ 2 แขนตรง ไหล่อยู่เหนือมือ กดลงตรง ๆ 3 ผู้ใหญ่ลึก 5–6 เซนติเมตร อัตรา 100–120 ครั้งต่อนาที 4 ปล่อยให้หน้าอกคืนตัวสุดทุกครั้ง หยุดให้น้อยที่สุด"
    caption: "ภาพจำลองเพื่อให้เห็นตำแหน่ง ต้องฝึกกดกับหุ่นจำลองจึงจะรู้ว่าแรงและลึกพอ"
  - type: worked-example
    title: สำลักจนหมดสติ
    problem: "ระหว่างกินข้าวกลางวันที่โรงอาหาร เพื่อนคนหนึ่งเอามือกุมคอ พูดไม่ได้ และไอไม่ออก ควรทำอย่างไรตามลำดับ"
    steps:
      - text: "ถามว่า \"สำลักใช่ไหม\" ถ้าพยักหน้าแต่พูดหรือไอไม่ได้ แปลว่าทางเดินหายใจอุดกั้นรุนแรง ให้คนอื่นโทร 1669"
        why: "ถ้ายังไอแรงหรือพูดได้ ให้ไอต่อเอง การตบหลังหรือรัดท้องใช้เมื่ออุดกั้นรุนแรง"
      - text: "ยืนด้านหลัง ให้เพื่อนโน้มตัวไปข้างหน้า ตบหลังด้วยส้นมือระหว่างสะบัก 5 ครั้ง"
      - text: "ถ้าไม่หลุด ยืนด้านหลัง กำมือวางเหนือสะดือ อีกมือจับทับ รัดกระตุกเข้าและขึ้น 5 ครั้ง"
        why: "แนวทาง AHA ปี 2025 และสภากาชาดอเมริกันให้สลับตบหลัง 5 ครั้งกับรัดกระตุกหน้าท้อง 5 ครั้งในผู้ใหญ่และเด็กโต"
      - text: "ทำสลับต่อไปจนสิ่งแปลกปลอมหลุด หรือเพื่อนเริ่มไอ พูด หรือหายใจได้"
      - text: "ถ้าเพื่อนหมดสติ ประคองลงพื้น ให้แน่ใจว่ามีคนโทร 1669 แล้ว และเริ่มกดหน้าอกทันที"
        why: "ผู้ที่หมดสติจากการสำลักจะหายใจไม่ได้ การกดหน้าอกช่วยให้เลือดไปเลี้ยงสมองและอาจดันสิ่งแปลกปลอมออกได้"
    answer: "โทร 1669 ตบหลัง 5 ครั้งสลับรัดกระตุกหน้าท้อง 5 ครั้ง ถ้าหมดสติให้วางลงพื้นและเริ่มกดหน้าอก"
  - { type: check, problem: hlt.aid.p009, prompt: "ลองตอบก่อนไปต่อ" }
glossary:
  - { term: การปฐมพยาบาล, definition: "การช่วยเหลือเบื้องต้นก่อนถึงมือบุคลากรทางการแพทย์ เพื่อรักษาชีวิต ไม่ให้อาการแย่ลง และส่งต่อให้เร็ว" }
  - { term: "1669", definition: "หมายเลขสายด่วนการแพทย์ฉุกเฉินของประเทศไทย ดำเนินการโดยสถาบันการแพทย์ฉุกเฉินแห่งชาติ (สพฉ.) โทรฟรี" }
  - { term: การกดหน้าอกด้วยมือเปล่า (Hands-only CPR), definition: "การกดหน้าอกต่อเนื่องโดยไม่ช่วยหายใจ สำหรับผู้พบเห็นที่ไม่ได้ฝึกช่วยหายใจ เมื่อผู้ใหญ่หมดสติและไม่หายใจปกติ" }
  - { term: AED, definition: "เครื่องกระตุกหัวใจไฟฟ้าอัตโนมัติ วิเคราะห์จังหวะหัวใจเองและบอกขั้นตอนด้วยเสียง คนทั่วไปใช้ได้" }
  - { term: ท่าพักฟื้น, definition: "ท่านอนตะแคงสำหรับผู้ที่ไม่รู้สึกตัวแต่หายใจปกติ ช่วยให้ทางเดินหายใจโล่งและไม่สำลักสิ่งที่ออกจากปาก" }
flashcards:
  - { front: "เบอร์โทรเหตุเจ็บป่วยฉุกเฉินในไทย", back: "1669 (ไฟไหม้ 199 เหตุร้ายหรืออาชญากรรม 191)" }
  - { front: "กดหน้าอกผู้ใหญ่ ลึกและเร็วเท่าไร", back: "ลึก 5–6 ซม. อัตรา 100–120 ครั้งต่อนาที ที่ครึ่งล่างของกระดูกหน้าอก ปล่อยให้อกคืนตัวสุดทุกครั้ง" }
  - { front: "ผู้ใหญ่สำลัก พูดไม่ได้ ไอไม่ออก", back: "ตบหลัง 5 ครั้ง สลับรัดกระตุกหน้าท้อง 5 ครั้ง ถ้าหมดสติให้โทร 1669 และเริ่มกดหน้าอก" }
  - { front: "แผลไหม้ ทำอะไรก่อน", back: "ราดน้ำสะอาดไหลผ่านให้เร็วที่สุดนานหลายนาที (ราว 20 นาทีถ้าทำได้) ห้ามใช้น้ำแข็ง ยาสีฟัน เนย" }
  - { front: "เลือดออกมาก ทำอย่างไร", back: "ป้องกันมือตัวเอง ใช้ผ้าสะอาดกดตรงแผลแน่นและต่อเนื่อง ผ้าชุ่มให้วางผืนใหม่ทับ โทร 1669" }
