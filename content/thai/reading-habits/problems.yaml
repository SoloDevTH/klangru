problems:
- id: thai.reading.reading-habits.p001
  topics:
  - thai.reading.reading-habits
  difficulty: 1
  type: mcq
  stem: มะลิอยากรู้ว่าจะเลี้ยงปลากัดอย่างไร ควรเลือกหนังสือเล่มใด
  choices:
  - id: a
    text: คู่มือเลี้ยงปลาสวยงามสำหรับมือใหม่
    correct: true
    feedback: ถูก ตรงกับสิ่งที่อยากรู้
  - id: b
    text: นิทานเจ้าหญิงกับมังกร
    feedback: เป็นเรื่องแต่ง ไม่ได้บอกวิธีเลี้ยงปลา
  - id: c
    text: แผนที่ประเทศไทย
    feedback: ไม่เกี่ยวกับการเลี้ยงปลา
  - id: d
    text: หนังสือการ์ตูนตลก
    feedback: อ่านสนุก แต่ไม่ตอบคำถามที่อยากรู้
  hints:
  - มะลิอยากรู้เรื่องอะไร
  - เลือกเล่มที่ชื่อเรื่องตรงกับคำถาม
  solution: มะลิอยากรู้วิธีเลี้ยงปลา จึงควรเลือก **คู่มือเลี้ยงปลาสวยงาม**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.reading-habits.p002
  topics:
  - thai.reading.reading-habits
  difficulty: 1
  type: match
  stem: จับคู่ส่วนของหนังสือกับสิ่งที่บอกเรา
  pairs:
  - left: สารบัญ
    right: หัวข้อทั้งหมดในเล่มและเลขหน้า
  - left: คำโปรยหลังปก
    right: เรื่องย่อหรือจุดเด่นสั้น ๆ
  - left: ปีที่พิมพ์
    right: หนังสือออกมาเมื่อไร
  - left: ชื่อผู้แต่ง
    right: ใครเป็นคนเขียน
  hints:
  - สารบัญอยู่หน้าต้นเล่ม
  - ปีที่พิมพ์ช่วยดูว่าข้อมูลเก่าหรือใหม่
  solution: สารบัญ = หัวข้อและเลขหน้า · คำโปรย = เรื่องย่อ · ปีที่พิมพ์ = ออกเมื่อไร · ผู้แต่ง = คนเขียน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.reading-habits.p003
  topics:
  - thai.reading.reading-habits
  difficulty: 2
  type: mcq
  stem: ใช้ **กฎห้านิ้ว** ต้นอ่านหนังสือหนึ่งหน้า เจอคำที่ไม่รู้ความหมาย 2 คำ หนังสือเล่มนี้ยากแค่ไหนสำหรับต้น
  choices:
  - id: a
    text: พอดี ได้คำใหม่
    correct: true
    feedback: ถูก 2–3 คำถือว่าพอดี
  - id: b
    text: ง่ายเกินไป
    feedback: ง่ายคือ 0–1 คำ
  - id: c
    text: ยากเกินไป
    feedback: ยากเกินไปคือ 5 คำขึ้นไป
  - id: d
    text: อ่านไม่ได้เลย
    feedback: 2 คำยังอ่านเข้าใจได้
  hints:
  - ดูตารางกฎห้านิ้ว
  - 2 คำอยู่ในช่วงใด
  solution: คำที่ไม่รู้ 2–3 คำต่อหน้า = **พอดี**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.reading-habits.p004
  topics:
  - thai.reading.reading-habits
  difficulty: 2
  type: numeric
  stem: ฝ้ายตั้งใจอ่านหนังสือก่อนนอนวันละ 15 นาที ทุกวันเป็นเวลา 30 วัน ฝ้ายจะอ่านรวมกี่นาที
  answer:
    value: 450
    unit: นาที
  misconceptions:
  - match: 45
    feedback: นำ 15 กับ 30 มาบวกกัน ต้องคูณ
  - match: 7.5
    feedback: แปลงเป็นชั่วโมงแล้ว แต่โจทย์ถามเป็นนาที
  hints:
  - อ่านเท่ากันทุกวัน
  - นาทีต่อวัน × จำนวนวัน
  solution: $15 \times 30 = 450$ นาที (7 ชั่วโมงครึ่ง)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.reading-habits.p005
  topics:
  - thai.reading.reading-habits
  difficulty: 2
  type: mcq
  stem: อ่านบันทึกการอ่านในภาพ ข้อใดคือ **ความคิดเห็น** ของผู้อ่าน
  figure:
    src: reading-log.svg
    alt: 'บันทึกการอ่าน ชื่อเรื่อง ผึ้งน้อยนักสื่อสาร (หนังสือสมมุติ) ประเภท หนังสือความรู้ วิทยาศาสตร์ วันที่อ่าน 1–5 พฤศจิกายน วันละ 15 นาที สาระสำคัญ ผึ้งงานบอกเพื่อนว่าแหล่งดอกไม้อยู่ที่ไหน ด้วยการเต้นเป็นรูปเลขแปด ความคิดเห็น ชอบภาพถ่ายระยะใกล้ อธิบายเข้าใจง่าย แต่ท้ายเล่มสั้นไป คุณค่าที่ได้ ความรู้: สัตว์สื่อสารได้หลายวิธี นำไปใช้: ทำรายงานวิทยาศาสตร์ ให้คะแนน 4 ดาวจาก 5 แนะนำให้เพื่อนที่ชอบสัตว์'
  choices:
  - id: a
    text: ชอบภาพถ่ายระยะใกล้ อธิบายเข้าใจง่าย
    correct: true
    feedback: ถูก บอกความชอบและเหตุผลของผู้อ่าน
  - id: b
    text: ผึ้งงานเต้นเป็นรูปเลขแปด
    feedback: เป็นสาระสำคัญจากหนังสือ
  - id: c
    text: อ่านวันละ 15 นาที
    feedback: เป็นข้อมูลวันเวลาที่อ่าน
  - id: d
    text: หนังสือความรู้ วิทยาศาสตร์
    feedback: เป็นประเภทของหนังสือ
  hints:
  - ความคิดเห็นมักมีคำว่า ชอบ ไม่ชอบ ดี
  - ข้อใดเป็นมุมมองของผู้อ่าน ไม่ใช่ข้อมูลในหนังสือ
  solution: '**ชอบภาพถ่ายระยะใกล้ อธิบายเข้าใจง่าย** เป็นความคิดเห็นของผู้อ่าน'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.reading-habits.p006
  topics:
  - thai.reading.reading-habits
  difficulty: 3
  type: mcq
  stem: ข้อใดบอก **คุณค่า** ของหนังสือได้ดีที่สุด
  choices:
  - id: a
    text: ได้ความรู้ว่าผึ้งบอกทางแหล่งดอกไม้ด้วยการเต้น นำไปทำรายงานวิทยาศาสตร์ได้
    correct: true
    feedback: ถูก บอกด้านของคุณค่า ยกตัวอย่างจากเรื่อง และบอกการนำไปใช้
  - id: b
    text: หนังสือเล่มนี้ดีมาก
    feedback: กว้างเกินไป ไม่บอกว่าดีด้านใด
  - id: c
    text: สนุกและได้ความรู้
    feedback: ไม่ยกตัวอย่างว่าได้ความรู้อะไร
  - id: d
    text: หนังสือมี 64 หน้า
    feedback: เป็นข้อมูลของหนังสือ ไม่ใช่คุณค่า
  hints:
  - คุณค่าที่ดีต้องบอกด้านใดและยกตัวอย่าง
  - ข้อใดเจาะจงที่สุด
  solution: ข้อที่บอก **ด้านความรู้ + ตัวอย่างจากเรื่อง + การนำไปใช้** ดีที่สุด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.reading-habits.p007
  topics:
  - thai.reading.reading-habits
  difficulty: 3
  type: match
  stem: จับคู่ข้อความกับ **ด้านของคุณค่า** ที่ได้จากการอ่าน
  pairs:
  - left: รู้ว่าผีเสื้อมีวงจรชีวิต 4 ระยะ
    right: ด้านความรู้
  - left: ได้คิดว่าความอดทนทำให้สำเร็จ
    right: ด้านข้อคิดและแนวคิด
  - left: ชอบคำว่า ฟ้าสีครามใสกระจ่าง ไพเราะ
    right: ด้านภาษา
  - left: ทำตามวิธีจัดตารางเวลาแล้วส่งการบ้านทัน
    right: ด้านการนำไปใช้
  hints:
  - ความรู้ = ข้อมูล · ข้อคิด = คติ
  - ภาษา = ถ้อยคำ · นำไปใช้ = แก้ปัญหาจริง
  solution: ข้อมูล → ความรู้ · คติ → ข้อคิด · ถ้อยคำไพเราะ → ภาษา · ทำแล้วได้ผลจริง → การนำไปใช้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.reading-habits.p008
  topics:
  - thai.reading.reading-habits
  difficulty: 3
  type: numeric
  stem: หนังสือเล่มหนึ่งมี 120 หน้า ภูมิอ่านวันละ 8 หน้าเท่ากันทุกวัน จะอ่านจบในกี่วัน
  answer:
    value: 15
    unit: วัน
  misconceptions:
  - match: 960
    feedback: คูณแทนหาร
  - match: 112
    feedback: นำ 8 ไปลบ ต้องหาร
  hints:
  - ต้องแบ่ง 120 หน้าเป็นส่วนละ 8 หน้า
  - จำนวนหน้าทั้งหมด ÷ หน้าต่อวัน
  solution: $120 \div 8 = 15$ วัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.reading-habits.p009
  topics:
  - thai.reading.reading-habits
  difficulty: 3
  type: order
  stem: เรียงลำดับการ **เขียนแนะนำหนังสือ** ให้เพื่อนอ่าน ตามโครง 4 ส่วน
  items:
  - บอกชื่อเรื่อง ผู้แต่ง และประเภทของหนังสือ
  - เล่าสาระสำคัญหรือเรื่องย่อสั้น ๆ
  - บอกความคิดเห็นพร้อมเหตุผล
  - บอกคุณค่าที่ได้และใครควรอ่าน
  hints:
  - เริ่มจากข้อมูลว่าหนังสืออะไร
  - จบด้วยการแนะนำว่าใครควรอ่าน
  solution: ชื่อเรื่อง → เรื่องย่อ → ความคิดเห็น → คุณค่าและใครควรอ่าน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.reading-habits.p010
  topics:
  - thai.reading.reading-habits
  difficulty: 4
  type: mcq
  stem: อ่านบทความสองบทในภาพ บทความใดน่าเชื่อถือกว่า เพราะอะไร
  figure: &id001
    src: two-articles.svg
    alt: 'บทความออนไลน์สมมุติสองบท บทความ ก ชื่อ ดื่มน้ำอย่างไรให้พอ โดยฝ่ายสุขศึกษา โรงพยาบาลสมมุติ ปรับปรุงมีนาคม 2569 เนื้อหา: ควรดื่มน้ำสะอาดสม่ำเสมอตลอดวัน ดื่มเพิ่มเมื่อออกกำลังกายหรืออากาศร้อน ปัสสาวะสีเหลืองเข้มอาจแปลว่าดื่มน้อยไป มีแหล่งอ้างอิงเป็นเอกสารของหน่วยงานสาธารณสุข 2 รายการ บทความ ข ชื่อ น้ำวิเศษ ดื่มแล้วฉลาดขึ้น! ไม่ระบุผู้เขียน ไม่ระบุวันที่ เนื้อหา: ดื่มน้ำแร่ตราดาวเงินวันละ 3 ขวด สมองไวขึ้นภายใน 7 วัน รับรองผล สั่งซื้อวันนี้ ลด 50% ไม่มีแหล่งอ้างอิง'
  choices:
  - id: a
    text: บทความ ก เพราะบอกผู้เขียน วันที่ และแหล่งอ้างอิง
    correct: true
    feedback: ถูก ตรวจสอบได้ว่าใครเขียน เมื่อไร และอ้างข้อมูลจากที่ใด
  - id: b
    text: บทความ ข เพราะรับรองผลภายใน 7 วัน
    feedback: คำรับรองที่ไม่มีหลักฐานไม่ทำให้น่าเชื่อถือ
  - id: c
    text: บทความ ข เพราะลดราคา 50%
    feedback: ราคาไม่เกี่ยวกับความถูกต้องของข้อมูล
  - id: d
    text: น่าเชื่อถือเท่ากัน เพราะอยู่บนอินเทอร์เน็ตเหมือนกัน
    feedback: บทความออนไลน์ใครก็เขียนได้ ต้องตรวจทีละบท
  hints:
  - 'ถาม 4 ข้อ: ใครเขียน เมื่อไร อ้างแหล่งใด แหล่งอื่นตรงกันไหม'
  - บทความใดมุ่งขายสินค้า
  solution: '**บทความ ก** มีผู้เขียน วันที่ และแหล่งอ้างอิง ส่วนบทความ ข ไม่บอกผู้เขียน ไม่มีแหล่งอ้างอิง และมุ่งขายของ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.reading-habits.p011
  topics:
  - thai.reading.reading-habits
  difficulty: 4
  type: mcq
  stem: อ่านบทความ ข ในภาพ ข้อความใดเป็น **สัญญาณเตือน** ชัดที่สุดว่าบทความนี้มุ่งขายสินค้า
  figure: *id001
  choices:
  - id: a
    text: สั่งซื้อวันนี้ ลด 50%
    correct: true
    feedback: ถูก เชิญชวนให้ซื้อทันที แสดงจุดประสงค์เพื่อขาย
  - id: b
    text: ดื่มน้ำแร่วันละ 3 ขวด
    feedback: บอกวิธีใช้ แต่ยังไม่ใช่สัญญาณที่ชัดที่สุด
  - id: c
    text: ชื่อบทความมีเครื่องหมายตกใจ
    feedback: เป็นข้อสังเกตเล็กน้อย
  - id: d
    text: บทความมีสามข้อ
    feedback: จำนวนข้อไม่บอกจุดประสงค์
  hints:
  - สังเกตข้อความที่ชวนให้ทำอะไรทันที
  - ใครได้ประโยชน์ถ้าผู้อ่านทำตาม
  solution: '**สั่งซื้อวันนี้ ลด 50%** บอกชัดว่าบทความต้องการขายสินค้า จึงอาจเล่าแต่ข้อดี'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.reading-habits.p012
  topics:
  - thai.reading.reading-habits
  difficulty: 4
  type: mcq
  stem: 'แก้วทำรายงานเรื่องการปลูกผักบุ้ง อ่าน 3 แหล่ง: หนังสือบอกว่า "ต้องได้แดดหลายชั่วโมง" เว็บไซต์หน่วยงานเกษตรบอก "ต้องได้แดดหลายชั่วโมง" แต่คลิปหนึ่งบอก "ปลูกในที่ร่มได้ดีที่สุด" แก้วควรทำอย่างไร'
  choices:
  - id: a
    text: เชื่อข้อที่สองแหล่งตรงกัน และตรวจข้อที่ขัดกันเพิ่มจากแหล่งที่น่าเชื่อถือ
    correct: true
    feedback: ถูก ข้อที่หลายแหล่งตรงกันมักเชื่อถือได้ ข้อที่ต่างต้องตรวจเพิ่ม
  - id: b
    text: เชื่อคลิปเพราะดูง่ายที่สุด
    feedback: ความง่ายไม่ได้แปลว่าถูก
  - id: c
    text: เขียนทั้งสามแบบลงไปโดยไม่สรุป
    feedback: การสังเคราะห์ต้องเรียบเรียงเป็นข้อสรุปของเรา
  - id: d
    text: ทิ้งทุกแหล่งแล้วเดาเอง
    feedback: ควรใช้หลักฐานจากการอ่าน
  hints:
  - สังเกตว่าแหล่งใดบอกตรงกัน
  - ข้อที่ขัดกันต้องทำอย่างไร
  solution: ใช้ข้อที่ **ตรงกัน** เป็นหลัก และ **ตรวจเพิ่ม** ในข้อที่ขัดกัน แล้วเรียบเรียงข้อสรุปเอง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.reading-habits.p013
  topics:
  - thai.reading.reading-habits
  difficulty: 4
  type: order
  stem: เรียงขั้นการ **สังเคราะห์ความรู้** จากหลายแหล่ง
  items:
