<text x="60.0" y="280.0" text-anchor="start" font-size="14" fill="#222">อ่อน</text>
<text x="720.0" y="280.0" text-anchor="end" font-size="14" fill="#222">แข็ง</text>
<text x="380.0" y="280.0" text-anchor="middle" font-size="14" fill="#222">แร่ที่แข็งกว่าขูดแร่ที่อ่อนกว่าให้เป็นรอยได้</text>
<text x="380.0" y="305.0" text-anchor="middle" font-size="12" fill="#475569">ตัวเลขบอกลำดับ ไม่ใช่ปริมาณ (เพชรไม่ได้แข็งเป็น 10 เท่าของทัลก์)</text>
