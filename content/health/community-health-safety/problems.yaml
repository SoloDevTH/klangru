- id: health.community.community-health-safety.p016
  topics:
  - health.community.community-health-safety
  difficulty: 5
  type: mcq
  stem: หลังรณรงค์ 3 เดือน ค่า HI ของตำบลลดจาก 18 เหลือ 8 แต่จำนวนผู้ป่วยไข้เลือดออกกลับเพิ่มขึ้น ข้อสรุปใดสมเหตุสมผลที่สุด
  choices:
  - id: a
    text: HI เป็นตัวชี้วัดเพียงตัวเดียว ต้องตรวจคุณภาพการสำรวจ แหล่งเพาะพันธุ์นอกบ้าน เช่น โรงเรียนและวัด และการติดเชื้อจากนอกพื้นที่ แล้วปรับแผน
    correct: true
  - id: b
    text: การกำจัดลูกน้ำไม่ได้ผล ควรเลิกทำแล้วพ่นยาอย่างเดียว
    feedback: ข้อมูลเพียงรอบเดียวยังสรุปไม่ได้ และการพ่นยาไม่ได้กำจัดแหล่งเพาะพันธุ์
  - id: c
    text: ผู้ป่วยเพิ่มเพราะ HI ลดลง
    feedback: ไม่มีเหตุผลที่ลูกน้ำน้อยลงจะทำให้ป่วยมากขึ้น เป็นการสรุปเหตุและผลผิด
  - id: d
    text: ข้อมูลผู้ป่วยต้องผิดแน่นอน ให้ใช้เฉพาะค่า HI
    feedback: การเลือกเชื่อเฉพาะข้อมูลที่ตรงใจเป็นการประเมินที่ลำเอียง
  hints:
  - การประเมินผลต้องดูหลายตัวชี้วัด
  - คิดถึงแหล่งเพาะพันธุ์ที่ไม่ได้อยู่ในบ้าน และคนที่เดินทางไปที่อื่น
  solution: ขั้นประเมินผลต้องหาสาเหตุที่ผลไม่เป็นตามคาด เช่น สำรวจไม่ครบ ไม่ได้สำรวจโรงเรียนหรือวัด (ต้องมี CI = 0) หรือผู้ป่วยติดเชื้อจากที่อื่น แล้วนำไปปรับแผนรอบใหม่ ไม่ใช่ทิ้งมาตรการหรือเลือกเชื่อข้อมูลบางส่วน
