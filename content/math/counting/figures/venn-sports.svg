<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" font-family="sans-serif" font-size="16">
  <title>แผนภาพเวนน์ของนักเรียนที่ชอบฟุตบอลและแบดมินตัน</title>
  <rect x="10" y="10" width="420" height="280" rx="8" fill="#ffffff" stroke="#15211e" stroke-width="2"/>
  <text x="24" y="34" text-anchor="start" fill="#15211e" font-size="14" font-weight="bold">นักเรียนทั้งห้อง 40 คน</text>
  <circle cx="170" cy="180" r="90" fill="#d5ece6" stroke="#0a6b60" stroke-width="2.5" fill-opacity="0.7"/>
  <circle cx="270" cy="180" r="90" fill="#fbe3d3" stroke="#b4521f" stroke-width="2.5" fill-opacity="0.7"/>
  <text x="120" y="74" text-anchor="middle" fill="#0a6b60" font-size="14" font-weight="bold">ฟุตบอล 22 คน</text>
  <text x="320" y="74" text-anchor="middle" fill="#b4521f" font-size="14" font-weight="bold">แบดมินตัน 18 คน</text>
  <text x="220" y="187" text-anchor="middle" fill="#15211e" font-size="20" font-weight="bold">7</text>
  <text x="390" y="270" text-anchor="middle" fill="#15211e" font-size="22" font-weight="bold">?</text>
</svg>
