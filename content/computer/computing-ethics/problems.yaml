problems:
  - id: computer.society.computing-ethics.p001
    topics: [computer.society.computing-ethics]
    difficulty: 1
    type: mcq
    stem: "กรอบจริยธรรมแบบผลลัพธ์นิยม (utilitarianism) ตัดสินการกระทำจากสิ่งใด"
    choices:
      - { id: a, text: "การยึดหน้าที่และกฎโดยไม่สนผลที่ตามมา", feedback: "นั่นคือหน้าที่นิยม (deontology) ไม่ใช่ผลลัพธ์นิยม" }
      - { id: b, text: "ผลรวมของประโยชน์และความเสียหายที่เกิดขึ้น", correct: true }
      - { id: c, text: "ความเห็นของผู้มีอำนาจสูงสุดในองค์กร", feedback: "ความเห็นของผู้มีอำนาจไม่ใช่กรอบจริยธรรมที่ใช้วิเคราะห์ผลกระทบ" }
      - { id: d, text: "ความถูกใจของผู้ใช้ส่วนใหญ่เท่านั้น", feedback: "ผลลัพธ์นิยมดูผลรวมทั้งประโยชน์และความเสียหายของทุกฝ่าย ไม่ใช่เฉพาะความพอใจ" }
    hints:
      - "คำว่านิยมชี้ไปที่สิ่งที่ถูกใช้เป็นเกณฑ์ตัดสิน"
      - "ลองนึกถึงการเปรียบเทียบประโยชน์รวมกับความเสียหายรวม"
    solution: "ผลลัพธ์นิยมตัดสินจากผลรวมของประโยชน์และความเสียหายทั้งหมดที่เกิดกับทุกฝ่าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-ethics.p002
    topics: [computer.society.computing-ethics]
    difficulty: 1
    type: match
    stem: "จับคู่กรอบจริยธรรมกับจุดเน้นที่กรอบนั้นให้ความสำคัญ"
    pairs:
      - { left: "ผลลัพธ์นิยม", right: "ผลรวมของประโยชน์เทียบกับความเสียหาย" }
      - { left: "หน้าที่นิยม", right: "หน้าที่และกฎที่ยึดได้ไม่ว่าผลจะเป็นอย่างไร" }
      - { left: "คุณธรรมนิยม", right: "ลักษณะนิสัยที่ดีของผู้ตัดสินใจ" }
      - { left: "สัญญาประชาคม", right: "กติกาที่ทุกฝ่ายยอมรับได้ถ้าไม่รู้ว่าตนอยู่ฝ่ายใด" }
    hints:
      - "ผลลัพธ์นิยมเกี่ยวกับการนับผลรวม"
      - "คุณธรรมนิยมถามว่าคนดีจะทำอย่างไร"
    solution: "ผลลัพธ์นิยมดูผลรวม หน้าที่นิยมดูหน้าที่และกฎ คุณธรรมนิยมดูนิสัยของผู้ตัดสินใจ สัญญาประชาคมดูการยอมรับร่วมกันของทุกฝ่าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-ethics.p003
    topics: [computer.society.computing-ethics]
    difficulty: 1
    type: mcq
    stem: "ข้อใดนิยามผู้มีส่วนได้เสียในการวิเคราะห์ระบบได้ถูกต้องที่สุด"
    choices:
      - { id: a, text: "ทุกคนหรือทุกกลุ่มที่ได้รับผลกระทบจากระบบ ทั้งทางตรงและทางอ้อม", correct: true }
      - { id: b, text: "เฉพาะผู้ที่จ่ายเงินให้ระบบเท่านั้น", feedback: "ผู้จ่ายเงินเป็นกลุ่มหนึ่ง แต่ผู้ได้รับผลกระทบอาจไม่จ่ายเลย" }
      - { id: c, text: "เฉพาะทีมพัฒนาที่เขียนโค้ด", feedback: "ทีมพัฒนาเป็นผู้มีส่วนได้เสียคนหนึ่ง แต่ไม่ใช่ทั้งหมด" }
      - { id: d, text: "เฉพาะผู้ใช้ที่ลงทะเบียนแล้ว", feedback: "คนที่ไม่ได้ใช้ระบบก็อาจได้รับผลกระทบ เช่น คนในชุมชนที่อยู่ใกล้เส้นทาง" }
    hints:
      - "ลองนึกถึงคนที่ไม่ได้ใช้ระบบแต่ยังได้รับผลกระทบ"
      - "คำว่าทั้งทางตรงและทางอ้อมเป็นเบาะแส"
    solution: "ผู้มีส่วนได้เสียคือทุกคนที่ได้รับผลกระทบจากระบบ รวมผู้ที่ไม่ได้ใช้โดยตรงด้วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-ethics.p004
    topics: [computer.society.computing-ethics]
    difficulty: 2
    type: numeric
    stem: "ระบบคัดเลือกทุนการศึกษาให้ผ่านนักเรียนกลุ่ม A ร้อยละ 80 และนักเรียนกลุ่ม B ร้อยละ 50 ผลต่างของสองค่านี้กี่จุดเปอร์เซ็นต์ (ตอบเป็นจำนวนเต็ม)"
    answer: { value: 30, unit: จุดเปอร์เซ็นต์ }
    hints:
      - "ผลต่างระหว่างสองค่าร้อยละคือการลบกันโดยตรง"
      - "ค่าที่ได้เรียกเป็นจุดเปอร์เซ็นต์ ไม่ใช่เปอร์เซ็นต์ของค่าใดค่าหนึ่ง"
    misconceptions:
      - { match: 60, feedback: "60 คือผลต่างเทียบกับกลุ่ม B เป็นสัดส่วน ไม่ใช่ผลต่างเป็นจุดเปอร์เซ็นต์ที่โจทย์ถาม" }
      - { match: 37.5, feedback: "37.5 คือผลต่างเทียบกับกลุ่ม A เป็นสัดส่วน ซึ่งไม่ใช่ค่าที่โจทย์ต้องการ" }
    solution: "ผลต่าง $80 - 50 = 30$ จุดเปอร์เซ็นต์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-ethics.p005
    topics: [computer.society.computing-ethics]
    difficulty: 2
    type: mcq
    stem: "ตามจรรยาบรรณวิชาชีพที่องค์กรคอมพิวเตอร์เผยแพร่ เมื่อผู้ปฏิบัติงานพบว่าระบบของตนสร้างผลกระทบเชิงลบต่อกลุ่มหนึ่ง ควรทำอย่างไรเป็นอันดับแรก"
    choices:
      - { id: a, text: "ปล่อยไว้เพราะเป็นความเห็นของส่วนน้อย", feedback: "ผลกระทบต่อกลุ่มหนึ่งยังคงเป็นความรับผิดชอบของผู้ปฏิบัติงาน ไม่ควรละเลย" }
      - { id: b, text: "ลบบันทึกของปัญหาเพื่อไม่ให้ผู้บริหารกังวล", feedback: "การปกปิดปัญหาขัดกับหลักความรับผิดชอบและความโปร่งใส" }
      - { id: c, text: "ประเมินผลกระทบ แจ้งผู้มีอำนาจรับผิดชอบ และเสนอทางแก้ไข", correct: true }
      - { id: d, text: "รอให้ผู้ใช้ร้องเรียนก่อนแล้วจึงทำอะไร", feedback: "ผู้ปฏิบัติงานควรรู้และดำเนินการตั้งแต่พบปัญหา ไม่รอให้มีเรื่องร้องเรียน" }
    hints:
      - "เมื่อพบปัญหา ขั้นแรกคือทำให้ปัญหาเป็นที่รู้และเข้าใจ"
      - "ทางออกที่รับผิดชอบมีการประเมิน การแจ้ง และการแก้ไข"
    solution: "ประเมินผลกระทบให้เข้าใจ แจ้งผู้มีอำนาจรับผิดชอบ และเสนอทางแก้ไข"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-ethics.p006
    topics: [computer.society.computing-ethics]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการวิเคราะห์เชิงจริยธรรมของระบบใหม่ให้ถูกลำดับ"
    items:
      - "ระบุผู้มีส่วนได้เสียทั้งทางตรงและทางอ้อม"
      - "ระบุผลกระทบที่แต่ละกลุ่มได้รับ ทั้งด้านดีและด้านเสีย"
      - "วิเคราะห์ด้วยกรอบจริยธรรมอย่างน้อยสองแบบ"
      - "ชั่งน้ำหนักทางเลือกและอธิบายเหตุผลที่เลือก"
      - "เสนอข้อเสนอแนะและติดตามผลหลังนำไปใช้"
    hints:
      - "ก่อนประเมินต้องรู้ก่อนว่าใครได้รับผลกระทบ และได้รับผลอย่างไร"
      - "ขั้นสุดท้ายคือการลงมือและตรวจสอบผลที่เกิดขึ้น"
    solution: "ระบุผู้มีส่วนได้เสีย ระบุผลกระทบที่แต่ละกลุ่มได้รับ วิเคราะห์ด้วยหลายกรอบ ชั่งน้ำหนักทางเลือก แล้วเสนอและติดตามผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-ethics.p007
    topics: [computer.society.computing-ethics]
    difficulty: 2
    type: text
    stem: "ระบบคัดเลือกที่เรียนจากข้อมูลในอดีตให้ผลลัพธ์แย่กว่ากับกลุ่มหนึ่งอย่างสม่ำเสมอ ไม่ใช่เพราะความบังเอิญ ลักษณะนี้ภาษาไทยเรียกว่าอะไร (ตอบเป็นคำเดียว)"
    accepted: ["อคติ", "ความลำเอียง", "ลำเอียง"]
    misconceptions:
      - { match: "ข้อผิดพลาด", feedback: "ข้อผิดพลาดแบบสุ่มเกิดขึ้นกระจายทั่วไป แต่โจทย์ถามถึงผลที่เสียเปรียบกลุ่มหนึ่งอย่างสม่ำเสมอ" }
      - { match: "bug", feedback: "bug คือความผิดพลาดของโค้ด ซึ่งไม่ได้หมายถึงความลำเอียงที่แฝงในข้อมูลหรือการออกแบบ" }
    hints:
      - "คำนี้ใช้ได้ทั้งกับคน และกับระบบที่เรียนรู้จากข้อมูลของคน"
      - "มีความหมายว่าเอียงไปทางใดทางหนึ่งอย่างไม่เป็นกลาง"
    solution: "อคติ (bias) หมายถึงความลำเอียงที่ทำให้ผลลัพธ์เสียเปรียบกลุ่มใดกลุ่มหนึ่งอย่างเป็นระบบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-ethics.p008
    topics: [computer.society.computing-ethics]
    difficulty: 3
    type: mcq
    stem: "ทีมพัฒนาแอปการเรียนของโรงเรียนประกอบด้วยสมาชิกที่มีประสบการณ์คล้ายกันทั้งหมด ผลเสียที่เสี่ยงมากที่สุดคืออะไร"
    choices:
      - { id: a, text: "แอปจะใช้งานได้ช้าลงเพราะทีมเล็กเกินไป", feedback: "ขนาดทีมเกี่ยวกับความเร็วในการทำงาน แต่ปัญหาที่สำคัญกว่าคือการมองไม่เห็นความต้องการของผู้ใช้บางกลุ่ม" }
      - { id: b, text: "ผู้ใช้จะดาวน์โหลดแอปไม่ได้เลย", feedback: "ปัญหาไม่ได้ทำให้ดาวน์โหลดไม่ได้เสมอไป แต่ทำให้บางกลุ่มใช้งานได้ยากหรือไม่ได้" }
      - { id: c, text: "ค่าลิขสิทธิ์จะสูงขึ้น", feedback: "ค่าลิขสิทธิ์ไม่เกี่ยวกับความหลากหลายของทีมโดยตรง" }
      - { id: d, text: "มองไม่เห็นปัญหาที่ผู้ใช้กลุ่มอื่นเจอ เช่น ผู้ที่ใช้ตัวอ่านหน้าจอหรืออุปกรณ์รุ่นเก่า", correct: true }
    hints:
      - "ลองนึกว่าคนที่คิดเหมือนกันจะรู้จักความต้องการของใครบ้าง"
      - "ตัวอย่างในตัวเลือกควรเป็นกลุ่มที่แตกต่างจากทีมนั้น"
    solution: "ทีมที่คล้ายกันมักมองไม่เห็นความต้องการและข้อจำกัดของผู้ใช้ที่แตกต่าง ทำให้ระบบเข้าถึงไม่เท่าเทียม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-ethics.p009
    topics: [computer.society.computing-ethics]
    difficulty: 3
    type: mcq
    stem: "แอปนำทางให้เส้นทางที่เร็วที่สุดซึ่งผ่านซอยชุมชน ค่านิยมสองอย่างที่ขัดกันในกรณีนี้คืออะไร"
    choices:
      - { id: a, text: "ประสิทธิภาพของการเดินทางกับความปลอดภัยและความเป็นอยู่ของชุมชน", correct: true }
      - { id: b, text: "ความสวยงามของแผนที่กับความยาวของชื่อถนน", feedback: "เป็นเรื่องรูปลักษณ์ ไม่ใช่ค่านิยมหลักที่ขัดกันในกรณีนี้" }
      - { id: c, text: "ความเร็วของอินเทอร์เน็ตกับขนาดหน้าจอ", feedback: "เป็นประเด็นทางเทคนิค ไม่ใช่ค่านิยมที่ขัดกันของผู้มีส่วนได้เสีย" }
      - { id: d, text: "ราคาค่าโฆษณากับจำนวนผู้ใช้", feedback: "อาจเกี่ยวข้องทางธุรกิจ แต่ไม่ใช่ค่านิยมที่ขัดกันโดยตรงของเส้นทางนี้" }
    hints:
      - "ดูว่าใครได้ประโยชน์จากความเร็ว และใครเสี่ยงจากเส้นทางนั้น"
      - "ค่านิยมของผู้ใช้กับของคนในชุมชนอาจต่างกัน"
    solution: "ประสิทธิภาพของผู้ขับขี่ขัดกับความปลอดภัยและความเป็นอยู่ของคนในชุมชน ผู้ออกแบบต้องเลือกและอธิบายอย่างโปร่งใส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-ethics.p010
    topics: [computer.society.computing-ethics]
    difficulty: 3
    type: numeric
    stem: "ชุมชนหนึ่งมี 60 ครัวเรือน และ 42 ครัวเรือนมีอินเทอร์เน็ต ถ้าแอปให้ลงทะเบียนผ่านอินเทอร์เน็ตเท่านั้น ครัวเรือนที่ถูกกันออกคิดเป็นร้อยละเท่าไรของทั้งชุมชน (ตอบเป็นตัวเลขร้อยละ ไม่ต้องใส่ %)"
    answer: { value: 30, tolerance: 0.05 }
    hints:
      - "หาจำนวนครัวเรือนที่ยังไม่มีอินเทอร์เน็ตก่อน"
      - "นำจำนวนนั้นหารด้วยครัวเรือนทั้งหมด แล้วคูณด้วย 100"
    misconceptions:
      - { match: 70, feedback: "70 คือร้อยละของครัวเรือนที่มีอินเทอร์เน็ต แต่โจทย์ถามครัวเรือนที่ถูกกันออก" }
      - { match: 18, feedback: "18 คือจำนวนครัวเรือนที่ไม่มีอินเทอร์เน็ต ยังไม่ได้แปลงเป็นร้อยละ" }
    solution: "ครัวเรือนที่ไม่มีอินเทอร์เน็ต $60 - 42 = 18$ หลัง คิดเป็น $18 / 60 \\times 100 = 30$ เปอร์เซ็นต์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-ethics.p011
    topics: [computer.society.computing-ethics]
    difficulty: 3
    type: code
    stem: "เขียนฟังก์ชัน approval_rates(data) โดย data เป็นดิกชันนารีจากชื่อกลุ่มเป็นคู่ (จำนวนที่ผ่าน, จำนวนผู้สมัคร) ให้คืนดิกชันนารีจากชื่อกลุ่มเป็นอัตราผ่านเป็นเปอร์เซ็นต์ ปัดเป็นทศนิยม 1 ตำแหน่ง"
    starter: |
      def approval_rates(data):
          # คืนอัตราผ่านเป็นเปอร์เซ็นต์ของแต่ละกลุ่ม ปัด 1 ตำแหน่ง
          return {}
    tests: |
      assert approval_rates({"A": (60, 100), "B": (45, 90)}) == {"A": 60.0, "B": 50.0}, "A ได้ 60 เปอร์เซ็นต์ และ B ได้ 50 เปอร์เซ็นต์"
      assert approval_rates({"X": (1, 3)}) == {"X": 33.3}, "1 ใน 3 ปัดเป็น 33.3 เปอร์เซ็นต์"
    reference: |
      def approval_rates(data):
          return {k: round(passed / applied * 100, 1) for k, (passed, applied) in data.items()}
    hints:
      - "วนดูคู่ของแต่ละกลุ่มด้วย items() แล้วแตกคู่เป็นตัวแปรสองตัว"
