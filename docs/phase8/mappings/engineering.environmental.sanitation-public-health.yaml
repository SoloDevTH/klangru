topic: engineering.environmental.sanitation-public-health
rows:
  - { framework: th-coe-engineering-basics, indicators: ["ENV-3.9"], coverage: partial, note: "สอนระบบน้ำดีแรงโน้มถ่วง การเลือกปั๊มด้วย ρgQH/η ระบายน้ำเสียและน้ำฝน บ่อเกรอะ–บ่อซึม ที่ดักไขมัน และท่อระบายอากาศ ยังไม่สอนการคำนวณขนาดท่อด้วยหน่วยสุขภัณฑ์ การออกแบบท่อระบายอากาศตามมาตรฐาน และการออกแบบตามข้อกำหนดของแต่ละท้องถิ่น" }
  - { framework: th-coe-engineering-basics, indicators: ["ENV-3.13"], coverage: full, note: "ครอบคลุมโรคที่เกี่ยวกับน้ำและสุขาภิบาล ห่วงโซ่การติดต่อของโรค ดัชนีพื้นฐานทางระบาดวิทยา (attack rate, RR, CFR, อัตราป่วย) การควบคุมพาหะนำโรค และบทบาทของวิศวกรต่อสาธารณสุขตามที่กำหนดในขอบเขต" }
