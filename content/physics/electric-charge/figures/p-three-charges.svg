<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 150" width="480" height="150" font-family="sans-serif" font-size="15">
  <title>ประจุ A +4 ไมโครคูลอมบ์ที่ x = 0 ประจุ C +1 ไมโครคูลอมบ์ที่ x = 0.1 m และประจุ B +1 ไมโครคูลอมบ์ที่ x = 0.3 m</title>
  <rect x="0" y="0" width="480" height="150" fill="#ffffff"/>
  <line x1="40.0" y1="80.0" x2="440.0" y2="80.0" stroke="#6b7672" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="80.0" cy="80.0" r="14.0" fill="#fde9d9" stroke="#15211e" stroke-width="2"/>
  <text x="80.0" y="86.0" fill="#15211e" font-size="18" text-anchor="middle" font-weight="bold">+</text>
  <text x="80.0" y="50.0" fill="#15211e" font-size="14" text-anchor="middle">A (+4 μC)</text>
  <line x1="80.0" y1="100.0" x2="80.0" y2="110.0" stroke="#15211e" stroke-width="1.5" stroke-linecap="round"/>
  <text x="80.0" y="128.0" fill="#15211e" font-size="13" text-anchor="middle">x = 0 m</text>
  <circle cx="180.0" cy="80.0" r="14.0" fill="#fde9d9" stroke="#15211e" stroke-width="2"/>
  <text x="180.0" y="86.0" fill="#15211e" font-size="18" text-anchor="middle" font-weight="bold">+</text>
  <text x="180.0" y="50.0" fill="#15211e" font-size="14" text-anchor="middle">C (+1 μC)</text>
  <line x1="180.0" y1="100.0" x2="180.0" y2="110.0" stroke="#15211e" stroke-width="1.5" stroke-linecap="round"/>
  <text x="180.0" y="128.0" fill="#15211e" font-size="13" text-anchor="middle">x = 0.1 m</text>
  <circle cx="380.0" cy="80.0" r="14.0" fill="#fde9d9" stroke="#15211e" stroke-width="2"/>
  <text x="380.0" y="86.0" fill="#15211e" font-size="18" text-anchor="middle" font-weight="bold">+</text>
  <text x="380.0" y="50.0" fill="#15211e" font-size="14" text-anchor="middle">B (+1 μC)</text>
  <line x1="380.0" y1="100.0" x2="380.0" y2="110.0" stroke="#15211e" stroke-width="1.5" stroke-linecap="round"/>
  <text x="380.0" y="128.0" fill="#15211e" font-size="13" text-anchor="middle">x = 0.3 m</text>
</svg>
