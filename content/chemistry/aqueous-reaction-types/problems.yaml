problems:
  - id: chemistry.reactions.aqueous-reaction-types.p001
    topics: [chemistry.reactions.aqueous-reaction-types]
    difficulty: 1
    type: mcq
    stem: 'สารในข้อใดเป็นอิเล็กโทรไลต์แก่ (แตกเป็นไอออนเกือบหมดเมื่อละลายน้ำ)'
    choices:
      - { id: a, text: '$\mathrm{NaCl}$ เกลือแกง', correct: true, feedback: 'ถูก NaCl แตกเป็น $\mathrm{Na^{+}}$ และ $\mathrm{Cl^{-}}$ เกือบหมด' }
      - { id: b, text: '$\mathrm{C_{12}H_{22}O_{11}}$ น้ำตาลซูโครส', feedback: 'น้ำตาลละลายเป็นโมเลกุลคงรูป ไม่มีไอออน จึงเป็นนอนอิเล็กโทรไลต์' }
      - { id: c, text: '$\mathrm{CH_3COOH}$ กรดแอซีติก', feedback: 'แตกได้เพียงบางส่วน จึงเป็นอิเล็กโทรไลต์อ่อน ไม่ใช่แก่' }
      - { id: d, text: '$\mathrm{C_2H_5OH}$ เอทานอล', feedback: 'เอทานอลไม่แตกเป็นไอออนเมื่อละลายน้ำ จึงเป็นนอนอิเล็กโทรไลต์' }
    hints:
      - 'นึกถึงว่าสารแตกเป็นไอออนมากหรือน้อยเมื่อละลายน้ำ'
      - 'สารจำพวกเกลือไอออนิกมักแตกเกือบหมดเมื่ออยู่ในน้ำ'
    solution: 'เกลือแกงเป็นสารประกอบไอออนิก เมื่อละลายน้ำจะแตกเกือบสมบูรณ์เป็น $\mathrm{Na^{+}}$ และ $\mathrm{Cl^{-}}$ จึงเป็นอิเล็กโทรไลต์แก่'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.aqueous-reaction-types.p002
    topics: [chemistry.reactions.aqueous-reaction-types]
    difficulty: 1
    type: mcq
    stem: 'น้ำเกลือนำไฟฟ้าได้ เพราะเหตุใด'
    choices:
      - { id: a, text: 'มีไอออนที่เคลื่อนที่ได้ ซึ่งพาประจุไฟฟ้าผ่านสารละลาย', correct: true, feedback: 'ถูก การนำไฟฟ้าของสารละลายเกิดจากการเคลื่อนที่ของไอออนบวกและไอออนลบ' }
      - { id: b, text: 'มีอิเล็กตรอนอิสระกระจายอยู่ในน้ำเหมือนลวดทองแดง', feedback: 'อิเล็กตรอนอิสระแบบโลหะไม่มีในสารละลายเกลือ การนำไฟฟ้าเกิดจากไอออน' }
      - { id: c, text: 'น้ำเป็นโลหะจึงนำไฟฟ้า', feedback: 'น้ำบริสุทธิ์นำไฟฟ้าได้น้อยมาก และไม่ใช่โลหะ' }
      - { id: d, text: 'เกลือทำให้โมเลกุลน้ำสลายเป็นแก๊สไฮโดรเจนและออกซิเจน', feedback: 'การแยกน้ำด้วยไฟฟ้าเกิดเมื่อจ่ายไฟแรงพอ แต่ไม่ใช่เหตุผลที่สารละลายนำไฟฟ้าได้' }
    hints:
      - 'ลองคิดว่ามีอะไรในน้ำเกลือที่เคลื่อนที่ได้และพาประจุไปได้'
      - 'เกลือแกงละลายแล้วแตกเป็นอนุภาคที่มีประจุบวกและประจุลบ'
    solution: 'สารละลายเกลือมีไอออน $\mathrm{Na^{+}}$ และ $\mathrm{Cl^{-}}$ ที่เคลื่อนที่อิสระ เมื่อต่อแรงดันไฟฟ้า ไอออนบวกเคลื่อนไปขั้วลบและไอออนลบเคลื่อนไปขั้วบวก จึงเกิดกระแสไฟฟ้า'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.aqueous-reaction-types.p003
    topics: [chemistry.reactions.aqueous-reaction-types]
    difficulty: 2
    type: numeric
    stem: 'สารละลาย $\mathrm{AgNO_3}$ เข้มข้น 0.150 mol/L ปริมาตร 40.0 mL ผสมกับ $\mathrm{NaCl}$ ที่เติมเกินพอ ได้ตะกอน $\mathrm{AgCl}$ มวลกี่กรัม (ตอบเป็นกรัม) กำหนด $M(\mathrm{Ag}) = 107.87$ และ $M(\mathrm{Cl}) = 35.45$ g/mol'
    answer: { value: 0.8599, tolerance: 0.001, unit: g }
    hints:
      - 'หาจำนวนโมลของ $\mathrm{Ag^{+}}$ จากความเข้มข้นและปริมาตร โดยแปลง mL เป็น L ก่อน'
      - '$\mathrm{Cl^{-}}$ เกินพอ ดังนั้น $\mathrm{Ag^{+}}$ ทุกโมลตกเป็น $\mathrm{AgCl}$ ในอัตราส่วน 1 : 1'
      - 'มวลตะกอนเท่ากับจำนวนโมลคูณมวลโมลาร์ของ $\mathrm{AgCl}$ ซึ่งคำนวณจากผลรวมของ $M(\mathrm{Ag})$ และ $M(\mathrm{Cl})$'
    misconceptions:
      - { match: 1.0192, feedback: '1.019 g คือมวลของ $\mathrm{AgNO_3}$ ที่ใช้ ไม่ใช่มวลตะกอน ต้องใช้มวลโมลาร์ของ $\mathrm{AgCl}$ เป็น 143.32 g/mol' }
      - { match: 859.9, feedback: 'ลืมแปลง 40.0 mL เป็น 0.0400 L ก่อนคูณความเข้มข้น mol/L ทำให้จำนวนโมลใหญ่ขึ้น 1,000 เท่า' }
    solution: 'ปริมาณ $\mathrm{Ag^{+}}$: $n = 0.0400\ \mathrm{L} \times 0.150\ \mathrm{mol/L} = 6.00 \times 10^{-3}\ \mathrm{mol}$ $M(\mathrm{AgCl}) = 107.87 + 35.45 = 143.32\ \mathrm{g/mol}$ มวลตะกอน $= 6.00 \times 10^{-3} \times 143.32 = 0.8599\ \mathrm{g}$'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.aqueous-reaction-types.p004
    topics: [chemistry.reactions.aqueous-reaction-types]
    difficulty: 2
    type: match
    stem: 'จับคู่สมการกับชนิดของปฏิกิริยา'
    pairs:
      - { left: '$\mathrm{AgNO_3 + NaCl \rightarrow AgCl + NaNO_3}$', right: 'ปฏิกิริยาตกตะกอน' }
      - { left: '$\mathrm{HCl + NaOH \rightarrow NaCl + H_2O}$', right: 'ปฏิกิริยากรด-เบส (สะเทิน)' }
      - { left: '$\mathrm{Zn + CuSO_4 \rightarrow ZnSO_4 + Cu}$', right: 'ปฏิกิริยารีดอกซ์แบบแทนที่' }
      - { left: '$\mathrm{CH_4 + 2O_2 \rightarrow CO_2 + 2H_2O}$', right: 'ปฏิกิริยาการเผาไหม้' }
    hints:
      - 'ปฏิกิริยาตกตะกอนมีของแข็งที่ไม่ละลายน้ำเกิดขึ้น'
      - 'ดูว่ามีเลขออกซิเดชันเปลี่ยนหรือไม่ และมีออกซิเจนเป็นสารตั้งต้นหรือไม่'
    solution: 'ปฏิกิริยาตกตะกอนให้ $\mathrm{AgCl}$ ที่เป็นของแข็ง กรดกับเบสให้เกลือและน้ำ สังกะสีแทนที่ทองแดงโดยเลขออกซิเดชันเปลี่ยน และการเผาไหม้ใช้ $\mathrm{O_2}$ เป็นสารตั้งต้นให้ $\mathrm{CO_2}$ กับ $\mathrm{H_2O}$'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.aqueous-reaction-types.p005
    topics: [chemistry.reactions.aqueous-reaction-types]
    difficulty: 2
    type: mcq
    stem: 'สมการไอออนิกสุทธิของปฏิกิริยา $\mathrm{Na_2SO_4(aq) + BaCl_2(aq) \rightarrow BaSO_4(s) + 2NaCl(aq)}$ คือข้อใด'
    choices:
      - { id: a, text: '$\mathrm{Ba^{2+}(aq) + SO_4^{2-}(aq) \rightarrow BaSO_4(s)}$', correct: true, feedback: 'ถูก เหลือเฉพาะไอออนที่เปลี่ยนแปลงและตะกอนที่เกิดใหม่' }
      - { id: b, text: '$\mathrm{2Na^{+}(aq) + 2Cl^{-}(aq) \rightarrow 2NaCl(aq)}$', feedback: 'นี่คือไอออนผู้ชมที่อยู่ทั้งสองข้างเหมือนกัน ต้องตัดออก' }
      - { id: c, text: '$\mathrm{Ba^{2+} + Cl^{-} \rightarrow BaCl_2}$', feedback: 'ประจุไม่สมดุล (+1 ทางซ้าย, 0 ทางขวา) และ $\mathrm{BaCl_2}$ ละลายได้ จึงไม่ใช่ตะกอน' }
      - { id: d, text: '$\mathrm{2Na^{+} + SO_4^{2-} \rightarrow Na_2SO_4(s)}$', feedback: '$\mathrm{Na_2SO_4}$ ละลายได้ดี ไม่เป็นตะกอน และเป็นสารตั้งต้นไม่ใช่ผลิตภัณฑ์' }
    hints:
      - 'ระบุว่าไอออนไหนอยู่ทั้งสองข้างของสมการโดยไม่เปลี่ยนแปลง'
      - 'ดูว่าสารใดในผลิตภัณฑ์เป็นของแข็ง ซึ่งระบุด้วย (s)'
    solution: 'ไอออน $\mathrm{Na^{+}}$ และ $\mathrm{Cl^{-}}$ อยู่ทั้งสองข้างเป็นไอออนผู้ชม ตัดออกแล้วเหลือ $\mathrm{Ba^{2+}}$ กับ $\mathrm{SO_4^{2-}}$ รวมกันเป็นตะกอน $\mathrm{BaSO_4}$'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.aqueous-reaction-types.p006
    topics: [chemistry.reactions.aqueous-reaction-types]
    difficulty: 2
    type: numeric
    stem: 'กรดเกลือ $\mathrm{HCl}$ เข้มข้น 0.100 mol/L ต้องใช้กี่มิลลิลิตรเพื่อสะเทิน $\mathrm{NaOH}$ เข้มข้น 0.150 mol/L ปริมาตร 20.0 mL พอดี (ตอบเป็น mL)'
    answer: { value: 30.0, tolerance: 0.1, unit: mL }
    hints:
      - 'เขียนสมการ $\mathrm{HCl + NaOH \rightarrow NaCl + H_2O}$ แล้วดูอัตราส่วนโมลของสารทั้งสอง'
      - 'หาจำนวนโมลของ $\mathrm{NaOH}$ ก่อนจากความเข้มข้นและปริมาตร'
      - 'จำนวนโมลของ HCl ต้องเท่ากับจำนวนโมลของ NaOH แล้วหาปริมาตรจาก $n \div$ ความเข้มข้น'
    misconceptions:
      - { match: 13.33, feedback: 'สลับความเข้มข้นของสองสาร ต้องหาโมลของ NaOH ก่อนแล้วหารด้วยความเข้มข้นของ HCl' }
      - { match: 20.0, feedback: 'ปริมาตรเท่ากันไม่ได้หมายความว่าสะเทินพอดี ต้องดูความเข้มข้นด้วย' }
    solution: 'จำนวนโมล $\mathrm{NaOH} = 0.150 \times 0.0200 = 3.00 \times 10^{-3}$ mol ใช้ HCl เท่ากันในอัตราส่วน 1 : 1 จึงต้องใช้ HCl ปริมาตร $= 3.00 \times 10^{-3} \div 0.100 = 0.0300\ \mathrm{L} = 30.0\ \mathrm{mL}$'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.aqueous-reaction-types.p007
    topics: [chemistry.reactions.aqueous-reaction-types]
    difficulty: 3
    type: order
    stem: 'เรียงขั้นตอนการเขียนสมการไอออนิกสุทธิจากขั้นแรกไปขั้นสุดท้าย'
    items:
      - 'เขียนสมการโมเลกุลที่ดุลแล้ว'
      - 'เขียนสารที่ละลายได้ดีในรูปไอออน ส่วนตะกอน แก๊ส และน้ำคงรูปโมเลกุล'
      - 'ตัดไอออนผู้ชมที่อยู่ทั้งสองข้างออก'
      - 'ตรวจว่าประจุและจำนวนอะตอมทั้งสองข้างเท่ากัน'
    hints:
      - 'ต้องมีสมการที่ดุลแล้วก่อนจึงแยกเป็นไอออนได้'
      - 'ขั้นสุดท้ายเป็นการตรวจ ไม่ใช่การเขียนสมการใหม่'
    solution: 'เขียนสมการโมเลกุลให้ดุลก่อน แล้วแยกสารที่ละลายได้เป็นไอออน ตัดไอออนผู้ชมออก และตรวจประจุกับจำนวนอะตอมทั้งสองข้างเป็นขั้นสุดท้าย'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.aqueous-reaction-types.p008
    topics: [chemistry.reactions.aqueous-reaction-types]
    difficulty: 2
    type: mcq
    stem: 'เมื่อผสมสารละลายคู่ใดต่อไปนี้ จะเห็นตะกอนที่เกิดขึ้นชัดเจน'
    choices:
      - { id: a, text: '$\mathrm{Na_2SO_4}$ กับ $\mathrm{KCl}$', feedback: 'ผลิตภัณฑ์ที่เป็นไปได้คือ $\mathrm{K_2SO_4}$ และ $\mathrm{NaCl}$ ซึ่งละลายได้ทั้งคู่ จึงไม่มีตะกอน' }
      - { id: b, text: '$\mathrm{Pb(NO_3)_2}$ กับ $\mathrm{KI}$', correct: true, feedback: 'ถูก ได้ $\mathrm{PbI_2}$ ซึ่งไม่ละลายน้ำ และเห็นเป็นตะกอนสีเหลือง' }
      - { id: c, text: '$\mathrm{NaCl}$ กับ $\mathrm{KNO_3}$', feedback: 'ผลิตภัณฑ์ที่เป็นไปได้คือ $\mathrm{NaNO_3}$ และ $\mathrm{KCl}$ ซึ่งละลายได้ทั้งคู่ จึงไม่มีตะกอน' }
      - { id: d, text: '$\mathrm{HCl}$ กับ $\mathrm{NaOH}$', feedback: 'เกิดน้ำและ $\mathrm{NaCl}$ ที่ละลายได้ ไม่มีตะกอน' }
    hints:
      - 'เขียนผลิตภัณฑ์ที่เป็นไปได้โดยสลับคู่ไอออนของแต่ละสาร'
      - 'ตรวจว่าผลิตภัณฑ์คู่ใดเป็นของแข็งที่ไม่ละลายน้ำ'
    solution: 'ตะกอนสีเหลือง $\mathrm{PbI_2}$ เกิดจากการสลับคู่ของ $\mathrm{Pb^{2+}}$ กับ $\mathrm{I^{-}}$ ตามกฎการละลาย สารคู่อื่นให้ผลิตภัณฑ์ที่ละลายได้ทั้งหมด'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.aqueous-reaction-types.p009
    topics: [chemistry.reactions.aqueous-reaction-types]
    difficulty: 3
    type: numeric
    stem: 'หินปูนที่มีแคลเซียมคาร์บอเนต $\mathrm{CaCO_3}$ มวล 10.0 g ทำปฏิกิริยากับกรดเกลือเกินพอ ได้แก๊ส $\mathrm{CO_2}$ กี่ลิตรที่สภาวะมาตรฐาน (STP) เมื่อ 1 โมลของแก๊สมีปริมาตร 22.4 L กำหนด $M(\mathrm{CaCO_3}) = 100.09$ g/mol (ตอบเป็นลิตร)'
    answer: { value: 2.238, tolerance: 0.01, unit: L }
    hints:
      - 'เขียนสมการก่อน $\mathrm{CaCO_3 + 2HCl \rightarrow CaCl_2 + H_2O + CO_2}$ แล้วดูอัตราส่วนโมลของ $\mathrm{CaCO_3}$ กับ $\mathrm{CO_2}$'
      - 'หาจำนวนโมลของ $\mathrm{CaCO_3}$ จากมวลและมวลโมลาร์ก่อน'
      - 'อัตราส่วนโมลระหว่าง $\mathrm{CaCO_3}$ กับ $\mathrm{CO_2}$ เป็น 1 : 1 แล้วคูณด้วยปริมาตรโมลาร์ 22.4 L/mol'
    misconceptions:
      - { match: 5.59, feedback: 'ใช้มวลอะตอมของ Ca เพียงตัวเดียวเป็นมวลโมลาร์ ต้องรวม C และ O 3 อะตอมด้วย ($M = 100.09$ g/mol)' }
    solution: '$n(\mathrm{CaCO_3}) = 10.0 \div 100.09 = 0.09991\ \mathrm{mol}$ ตามอัตราส่วน 1 : 1 ได้ $n(\mathrm{CO_2}) = 0.09991\ \mathrm{mol}$ ปริมาตร $= 0.09991 \times 22.4 = 2.238\ \mathrm{L}$'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.aqueous-reaction-types.p010
    topics: [chemistry.reactions.aqueous-reaction-types]
    difficulty: 3
    type: mcq
    stem: 'ในเตาถ่านที่ใช้ในห้องปิด ข้อใดเป็นข้อปฏิบัติที่ถูกต้องตามหลักความปลอดภัย'
    choices:
      - { id: a, text: 'เผาไหม้ไม่สมบูรณ์จะได้แก๊ส CO ที่ไม่มีสีและไม่มีกลิ่น จึงต้องเผาในที่ที่มีอากาศถ่ายเทดี', correct: true, feedback: 'ถูก CO จับกับฮีโมโกลบินแรงกว่าออกซิเจน จึงอันตรายแม้ไม่มีกลิ่น' }
      - { id: b, text: 'ควันจากถ่านเป็นไอน้ำล้วน จึงไม่เป็นอันตราย', feedback: 'ควันมีแก๊สพิษ เช่น CO และอนุภาคขนาดเล็ก ไม่ใช่ไอน้ำล้วน' }
      - { id: c, text: 'การเผาไหม้ไม่สมบูรณ์ทำให้ได้ CO2 มากขึ้น จึงไม่เป็นอันตราย', feedback: 'CO2 มีพิษน้อยกว่า CO มาก แต่ CO คือแก๊สพิษที่เกิดจากการเผาไหม้ไม่สมบูรณ์' }
      - { id: d, text: 'ถ้าปิดประตูให้มิดชิด ถ่านจะเผาไหม้สมบูรณ์มากขึ้น', feedback: 'อากาศไม่พอและการระบายไม่ดีทำให้เผาไหม้ไม่สมบูรณ์และเกิด CO มากขึ้น' }
    hints:
      - 'ดูว่าผลิตภัณฑ์ของการเผาไหม้ไม่สมบูรณ์คืออะไร'
      - 'คิดถึงปัจจัยที่ทำให้มีแก๊สพิษสะสมในห้อง เช่น การระบายอากาศ'
    solution: 'แก๊สคาร์บอนมอนอกไซด์ (CO) เกิดเมื่อเผาไหม้ออกซิเจนไม่พอ ไม่มีสีและกลิ่น จึงต้องเผาในที่ที่มีอากาศถ่ายเทและไม่ปล่อยให้ควันค้างในห้องนอน'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.aqueous-reaction-types.p011
    topics: [chemistry.reactions.aqueous-reaction-types]
    difficulty: 3
    type: order
    stem: 'เรียงลำดับความสามารถนำไฟฟ้าของสารละลายความเข้มข้น 0.10 mol/L เท่ากันทั้งสามชนิด จากมากไปน้อย'
    items:
      - '$\mathrm{NaCl}$ อิเล็กโทรไลต์แก่'
      - '$\mathrm{CH_3COOH}$ อิเล็กโทรไลต์อ่อน'
      - '$\mathrm{C_{12}H_{22}O_{11}}$ นอนอิเล็กโทรไลต์'
    hints:
      - 'ดูว่าสารแต่ละชนิดสร้างไอออนได้มากหรือน้อยเมื่อละลายน้ำ'
      - 'อิเล็กโทรไลต์แก่สร้างไอออนได้มากที่สุด นอนอิเล็กโทรไลต์ไม่สร้างไอออนเลย'
    solution: 'NaCl แตกเกือบหมดจึงมีไอออนมากที่สุด CH₃COOH แตกได้เพียงบางส่วนจึงมีไอออนน้อยกว่า น้ำตาลซูโครสไม่แตกเป็นไอออนจึงไม่นำไฟฟ้า'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.aqueous-reaction-types.p012
    topics: [chemistry.reactions.aqueous-reaction-types]
    difficulty: 4
    type: numeric
    stem: 'แท่งสังกะสี (Zn) มวล 2.00 g จุ่มในสารละลาย $\mathrm{CuSO_4}$ ที่เติมเกินพอ สังกะสีละลายเข้าสู่สารละลายและทองแดงตกเกาะบนแท่งโลหะ มวลทองแดงที่ตกเกาะกี่กรัม (ตอบเป็นกรัม) กำหนด $M(\mathrm{Zn}) = 65.38$ และ $M(\mathrm{Cu}) = 63.55$ g/mol'
    answer: { value: 1.944, tolerance: 0.005, unit: g }
    hints:
      - 'เขียนสมการไอออนิกสุทธิ $\mathrm{Zn + Cu^{2+} \rightarrow Zn^{2+} + Cu}$ แล้วดูอัตราส่วนโมล'
      - 'หาจำนวนโมลของ Zn จากมวลและมวลโมลาร์'
      - 'Zn 1 โมลให้ Cu 1 โมล จึงแปลงโมลของ Cu เป็นกรัมด้วยมวลโมลาร์ของ Cu'
    misconceptions:
      - { match: 2.00, feedback: 'คิดว่ามวลทองแดงที่ได้เท่ากับมวลสังกะสีที่หายไป ต้องคูณด้วยอัตราส่วนของมวลโมลาร์ เพราะอะตอมแต่ละชนิดมีมวลไม่เท่ากัน' }
    solution: '$n(\mathrm{Zn}) = 2.00 \div 65.38 = 0.03059\ \mathrm{mol}$ จากอัตราส่วน 1 : 1 ได้ $n(\mathrm{Cu}) = 0.03059\ \mathrm{mol}$ มวล $= 0.03059 \times 63.55 = 1.944\ \mathrm{g}$'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.aqueous-reaction-types.p013
    topics: [chemistry.reactions.aqueous-reaction-types]
    difficulty: 4
    type: numeric
    stem: 'ในปฏิกิริยา $\mathrm{2Al(s) + 3CuSO_4(aq) \rightarrow Al_2(SO_4)_3(aq) + 3Cu(s)}$ อะตอม Al หนึ่งอะตอมสูญเสียอิเล็กตรอนไปกี่ตัว (ตอบเป็นจำนวนเต็ม)'
    answer: { value: 3, tolerance: 0 }
    hints:
      - 'เลขออกซิเดชันของ Al เปลี่ยนจาก 0 เป็นเท่าใดใน $\mathrm{Al_2(SO_4)_3}$'
      - 'ค่าที่เปลี่ยนไปของเลขออกซิเดชันต่ออะตอมคือจำนวนอิเล็กตรอนที่สูญเสีย'
    misconceptions:
      - { match: 6, feedback: '6 คือจำนวนอิเล็กตรอนทั้งหมดของ 2 อะตอม Al ในสมการที่ดุลแล้ว ไม่ใช่ของ Al หนึ่งอะตอม' }
      - { match: 2, feedback: '2 คือสัมประสิทธิ์ของ Al ในสมการ ไม่ใช่จำนวนอิเล็กตรอนที่ Al หนึ่งอะตอมสูญเสีย' }
    solution: 'Al เปลี่ยนจากเลขออกซิเดชัน 0 เป็น +3 ใน $\mathrm{Al_2(SO_4)_3}$ จึงเสียอิเล็กตรอน 3 ตัวต่อ 1 อะตอม (Al → Al³⁺ + 3e⁻)'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.aqueous-reaction-types.p014
    topics: [chemistry.reactions.aqueous-reaction-types]
    difficulty: 4
    type: numeric
    stem: 'เลขออกซิเดชันของโครเมียม (Cr) ในไอออน $\mathrm{Cr_2O_7^{2-}}$ เป็นเท่าใด (ตอบเป็นจำนวนเต็ม) กำหนดให้ออกซิเจนมีเลขออกซิเดชัน −2'
    answer: { value: 6, tolerance: 0 }
    hints:
      - 'ผลรวมของเลขออกซิเดชันทั้งหมดในไอออนเท่ากับประจุของไอออน'
      - 'ไอออนมี Cr 2 อะตอมและ O 7 อะตอม ให้ x เป็นเลขออกซิเดชันของ Cr'
    misconceptions:
      - { match: 7, feedback: 'ลืมประจุ −2 ของไอออน จึงตั้งสมการเป็น 2x − 14 = 0 ต้องใส่ประจุรวมด้วยเสมอ' }
    solution: 'ให้ x เป็นเลขออกซิเดชันของ Cr: $2x + 7(-2) = -2$ จะได้ $2x = 12$ จึง $x = +6$'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.aqueous-reaction-types.p015
    topics: [chemistry.reactions.aqueous-reaction-types]
    difficulty: 4
    type: numeric
    stem: 'เผาไหม้มีเทน $\mathrm{CH_4}$ 16.0 g อย่างสมบูรณ์ตามสมการ $\mathrm{CH_4 + 2O_2 \rightarrow CO_2 + 2H_2O}$ จะได้ $\mathrm{CO_2}$ กี่กรัม กำหนด $M(\mathrm{CH_4}) = 16.04$ และ $M(\mathrm{CO_2}) = 44.01$ g/mol (ตอบเป็นกรัม)'
    answer: { value: 43.9, tolerance: 0.05, unit: g }
    hints:
      - 'หาจำนวนโมลของ $\mathrm{CH_4}$ จากมวลและมวลโมลาร์'
      - 'อัตราส่วนของ $\mathrm{CH_4}$ ต่อ $\mathrm{CO_2}$ ในสมการเป็น 1 : 1'
      - 'แปลงจำนวนโมลของ $\mathrm{CO_2}$ เป็นกรัมด้วยมวลโมลาร์ของ $\mathrm{CO_2}$'
    misconceptions:
      - { match: 87.80, feedback: 'คิดว่า $\mathrm{CH_4}$ 1 โมลให้ $\mathrm{CO_2}$ 2 โมล เพราะเห็น O₂ 2 โมล แต่อัตราส่วนที่ถูกคือ $\mathrm{CH_4}$ : $\mathrm{CO_2}$ = 1 : 1' }
    solution: '$n(\mathrm{CH_4}) = 16.0 \div 16.04 = 0.9975\ \mathrm{mol}$ ได้ $n(\mathrm{CO_2}) = 0.9975\ \mathrm{mol}$ มวล $= 0.9975 \times 44.01 = 43.9\ \mathrm{g}$'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.aqueous-reaction-types.p016
    topics: [chemistry.reactions.aqueous-reaction-types]
    difficulty: 4
    type: mcq
    multiple: true
    stem: 'ตามกฎการละลายแบบย่อ ข้อใดเป็นสารประกอบที่ไม่ละลายน้ำ (เลือกทุกข้อที่ถูก)'
    choices:
      - { id: a, text: '$\mathrm{BaSO_4}$', correct: true, feedback: 'ถูก ซัลเฟตของ Ba²⁺ ไม่ละลายน้ำ' }
      - { id: b, text: '$\mathrm{NaNO_3}$', feedback: 'ผิด สารประกอบของโลหะกลุ่มที่ 1 และไนเทรตละลายได้ทั้งหมด' }
      - { id: c, text: '$\mathrm{AgCl}$', correct: true, feedback: 'ถูก คลอไรด์ของ Ag⁺ ไม่ละลายน้ำ' }
      - { id: d, text: '$\mathrm{KCl}$', feedback: 'ผิด สารประกอบของ K⁺ ละลายได้ทั้งหมด' }
    hints:
      - 'สารประกอบของโลหะกลุ่มที่ 1 และไนเทรตมักละลายได้'
      - 'ลองนึกถึงไอออนบวกของโลหะหนัก เช่น Ba²⁺ และ Ag⁺ ที่รวมกับซัลเฟตหรือคลอไรด์'
    solution: '$\mathrm{BaSO_4}$ และ $\mathrm{AgCl}$ ไม่ละลายน้ำ ส่วน $\mathrm{NaNO_3}$ และ $\mathrm{KCl}$ ละลายได้ทั้งหมดตามกฎการละลายแบบย่อ'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.aqueous-reaction-types.p017
    topics: [chemistry.reactions.aqueous-reaction-types]
    difficulty: 5
    type: numeric
    stem: 'ผสมสารละลาย $\mathrm{Pb(NO_3)_2}$ เข้มข้น 0.200 mol/L ปริมาตร 25.0 mL กับสารละลาย KI เข้มข้น 0.150 mol/L ปริมาตร 40.0 mL จนเกิดตะกอน $\mathrm{PbI_2}$ มวลตะกอนสูงสุดที่ได้กี่กรัม กำหนด $M(\mathrm{PbI_2}) = 461.0$ g/mol (ตอบเป็นกรัม)'
    answer: { value: 1.383, tolerance: 0.005, unit: g }
    hints:
      - 'คำนวณจำนวนโมลของ $\mathrm{Pb^{2+}}$ และ $\mathrm{I^{-}}$ ก่อนจากความเข้มข้นและปริมาตร'
      - 'ใน $\mathrm{PbI_2}$ อัตราส่วน $\mathrm{Pb^{2+}}$ : $\mathrm{I^{-}}$ เป็น 1 : 2 ดูว่าสารใดหมดก่อน'
      - 'มวลตะกอนสูงสุดขึ้นกับปริมาณของสารที่หมดก่อน'
    misconceptions:
      - { match: 2.305, feedback: 'คิดว่า $\mathrm{Pb^{2+}}$ หมดก่อน แต่จริงๆ $\mathrm{I^{-}}$ มีน้อยกว่าที่ต้องใช้ ทำให้ตะกอนได้เพียง 0.00300 mol' }
    solution: '$n(\mathrm{Pb^{2+}}) = 0.0250 \times 0.200 = 5.00 \times 10^{-3}$ mol และ $n(\mathrm{I^{-}}) = 0.0400 \times 0.150 = 6.00 \times 10^{-3}$ mol ต้องใช้ $\mathrm{I^{-}}$ 2 เท่าของ $\mathrm{Pb^{2+}}$ คือ $1.00 \times 10^{-2}$ mol ซึ่งมีไม่พอ จึง $\mathrm{I^{-}}$ เป็นตัวกำหนด ได้ $\mathrm{PbI_2}$ $= 3.00 \times 10^{-3}$ mol มวล $= 3.00 \times 10^{-3} \times 461.0 = 1.383\ \mathrm{g}$'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.aqueous-reaction-types.p018
    topics: [chemistry.reactions.aqueous-reaction-types]
    difficulty: 5
    type: numeric
    stem: 'น้ำส้มสายชูมีกรดแอซีติก $\mathrm{CH_3COOH}$ ประมาณ 5 g ต่อ 100 mL (ใช้เป็นค่าประมาณ) นำน้ำส้มสายชู 5.00 mL ไปไทเทรตด้วย $\mathrm{NaOH}$ เข้มข้น 0.100 mol/L จนสะเทินพอดี ต้องใช้ $\mathrm{NaOH}$ กี่มิลลิลิตร กำหนด $M(\mathrm{CH_3COOH}) = 60.05$ g/mol (ตอบเป็น mL)'
    answer: { value: 41.6, tolerance: 0.2, unit: mL }
    hints:
      - 'เปลี่ยนความเข้มข้นของน้ำส้มสายชูจาก g/100 mL เป็น mol/L ก่อน'
      - 'กรดแอซีติกมีโปรตอน (H⁺) ที่แตกได้ 1 ตัวต่อโมเลกุล ทำปฏิกิริยา 1 : 1 กับ $\mathrm{OH^{-}}$'
      - 'จำนวนโมลของกรดในตัวอย่างหารด้วยความเข้มข้นของ NaOH จะได้ปริมาตร'
    misconceptions:
      - { match: 83.3, feedback: 'คิดว่ากรดแอซีติกให้ H⁺ 2 ตัวต่อโมเลกุล แต่กรดแอซีติกเป็นกรดโมโนโปรติก จึงต้องใช้ NaOH เท่ากับจำนวนโมลของกรด' }
    solution: 'ความเข้มข้นของกรด $= (5.0 \div 0.100) \div 60.05 = 0.8326\ \mathrm{mol/L}$ จำนวนโมลในตัวอย่าง 5.00 mL $= 0.8326 \times 0.00500 = 4.163 \times 10^{-3}\ \mathrm{mol}$ ต้องใช้ NaOH $= 4.163 \times 10^{-3} \div 0.100 = 0.04163\ \mathrm{L} = 41.6\ \mathrm{mL}$ (ใช้ตัวอย่างน้อยเพื่อให้ปริมาตรที่ไทเทรตไม่เกินบิวเรตขนาด 50 mL)'
    license: CC-BY-SA-4.0
    ai_assisted: true
