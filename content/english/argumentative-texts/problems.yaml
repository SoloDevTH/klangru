problems:
- id: english.reading.argumentative-texts.p001
  topics:
  - english.reading.argumentative-texts
  difficulty: 1
  type: mcq
  stem: ประโยคใดเป็นข้อกล่าวอ้าง (claim) หลักของบทความแสดงความคิดเห็นเรื่องเวลาเรียนของนักเรียนไทย
  choices:
  - id: a
    text: Schools should start later, because students need more sleep.
    correct: true
    feedback: ถูก เป็นจุดยืนหลักที่ผู้เขียนต้องการให้ผู้อ่านเห็นด้วย และมีเหตุผลตามมา
  - id: b
    text: The school bell rings at 8 a.m. every day.
    feedback: เป็นข้อเท็จจริงที่บอกสถานการณ์ ไม่ใช่จุดยืนที่ต้องโน้มน้าว
  - id: c
    text: In a survey of 300 students, most said they were tired.
    feedback: เป็นหลักฐานที่สนับสนุนเหตุผล ไม่ใช่ข้อกล่าวอ้างหลัก
  - id: d
    text: Some parents disagree with the idea.
    feedback: เป็นข้อโต้แย้งฝ่ายตรงข้าม ไม่ใช่จุดยืนของผู้เขียน
  hints:
  - ดูว่าประโยคไหนเป็นจุดยืนที่ผู้เขียนพยายามทำให้ผู้อ่านเชื่อ
  - ข้อเท็จจริงและหลักฐานไม่ใช่ข้อกล่าวอ้างหลัก
  solution: ข้อ a คือข้อกล่าวอ้างของบทความ ส่วนข้อ b และ c เป็นข้อเท็จจริงและหลักฐาน ข้อ d เป็นข้อโต้แย้งฝ่ายตรงข้าม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.reading.argumentative-texts.p002
  topics:
  - english.reading.argumentative-texts
  difficulty: 1
  type: match
  stem: จับคู่จุดประสงค์การอ่านกับวิธีอ่านที่เหมาะที่สุด
  pairs:
  - left: หาวันที่ของการประชุมในบทความยาว
    right: อ่านหาข้อมูล (scanning)
  - left: ดูจุดยืนของผู้เขียนจากหัวเรื่องกับย่อหน้าแรก
    right: อ่านกวาด (skimming)
  - left: วิเคราะห์ว่าเหตุผลแต่ละข้อมีหลักฐานรองรับหรือไม่
    right: อ่านละเอียด (detailed reading)
  hints:
  - การหาวันที่ไม่ต้องอ่านทุกคำ
  - การดูหัวเรื่องและย่อหน้าแรกเพื่อจับจุดยืนคือการอ่านกวาด
  solution: 'หาวันที่ → scanning · ดูจุดยืนจากหัวเรื่อง → skimming · วิเคราะห์เหตุผลและหลักฐาน → detailed reading'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.reading.argumentative-texts.p003
  topics:
  - english.reading.argumentative-texts
  difficulty: 1
  type: mcq
  stem: 'เติมคำหน้าประโยคนี้เพื่อบอกว่าผู้เขียนมั่นใจไม่เต็มที่: ___, the new rule is unfair to small schools.'
  choices:
  - id: a
    text: Clearly
    feedback: clearly บอกความมั่นใจสูง ไม่ได้บอกว่าผู้เขียนยังไม่แน่ใจ
  - id: b
    text: Undoubtedly
    feedback: undoubtedly บอกว่าไม่ต้องสงสัย ซึ่งเป็นความมั่นใจสูง
  - id: c
    text: Arguably
    correct: true
    feedback: ถูก arguably แปลว่า อาจกล่าวได้ว่า แสดงว่าผู้เขียนยังไม่ยืนยันเต็มที่
  - id: d
    text: Obviously
    feedback: obviously บอกว่าเห็นได้ชัด ซึ่งเป็นความมั่นใจสูง
  hints:
  - มองหาคำที่บอกว่าเป็นการแสดงความเห็น ไม่ใช่ข้อเท็จจริง
  - คำนี้มักใช้กับการโต้แย้งที่ยังถกเถียงได้
  solution: ข้อ c arguably บอกว่าผู้เขียนเสนอความเห็นที่ยังถกเถียงได้ ต่างจากคำอื่นที่บอกความมั่นใจสูง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.reading.argumentative-texts.p004
  topics:
  - english.reading.argumentative-texts
  difficulty: 2
  type: text
  stem: 'เติมคำกริยาที่บอกว่าข้อมูลชี้ให้เห็นโดยยังไม่ยืนยันแน่นอน: *The data ___ that the scheme is working, though more research is needed.*'
  accepted:
  - suggest
  - indicate
  - suggests
  - indicates
  misconceptions:
  - match: prove
    feedback: prove หมายถึงพิสูจน์ได้แน่นอน แต่ผู้เขียนบอกว่ายังต้องวิจัยเพิ่ม
  - match: deny
    feedback: deny หมายถึงปฏิเสธ ซึ่งตรงข้ามกับการบอกว่าโครงการได้ผล
  hints:
  - ประโยคนี้บอกว่ายังต้องวิจัยเพิ่ม จึงไม่ใช่การยืนยันแน่นอน
  - กริยาที่แปลว่า "ชี้ให้เห็น" โดยไม่ยืนยันเต็มที่
  solution: '*The data **suggest** that the scheme is working, though more research is needed.* suggest หรือ indicate บอกความเป็นไปได้ที่ยังไม่แน่ชัด'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.reading.argumentative-texts.p005
  topics:
  - english.reading.argumentative-texts
  difficulty: 2
  type: mcq
  stem: 'ประโยคนี้บอกว่าผู้เขียนมั่นใจเพียงใด: *The new parking fees could, arguably, keep tourists away from the old town.*'
  choices:
  - id: a
    text: ผู้เขียนยืนยันว่าค่าจอดรถใหม่ทำให้นักท่องเที่ยวหายไปแน่นอน
    feedback: คำว่า arguably และ could บอกว่ายังไม่ยืนยันแน่นอน
  - id: b
    text: ผู้เขียนเสนอความเป็นไปได้ที่ยังไม่ยืนยันเต็มที่
    correct: true
    feedback: ถูก arguably และ could เป็นคำบอกความไม่แน่นอน
  - id: c
    text: ผู้เขียนไม่มีความเห็นเรื่องนักท่องเที่ยว
    feedback: ประโยคกล่าวถึงผลต่อนักท่องเที่ยวโดยตรง จึงมีความเห็นอยู่
  - id: d
    text: ผู้เขียนสนับสนุนค่าจอดรถใหม่อย่างแรง
    feedback: ประโยคบอกว่าค่าจอดรถอาจทำให้นักท่องเที่ยวไม่มา ซึ่งไม่ใช่การสนับสนุน
  hints:
  - ดูคำกริยาช่วย could และคำบอกความเห็นที่เป็นทางเลือก
  - ตรวจว่าผู้เขียนยืนยันหรืออ้างความเป็นไปได้
  solution: ข้อ b ถูก เพราะ arguably และ could บอกว่าผู้เขียนเสนอความเป็นไปได้ ไม่ใช่ข้อเท็จจริงที่แน่นอน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.reading.argumentative-texts.p006
  topics:
  - english.reading.argumentative-texts
  difficulty: 2
  type: match
  stem: จับคู่คำเชื่อมกับหน้าที่ของคำนั้นในข้อโต้แย้ง
  pairs:
  - left: however
    right: แย้งสิ่งที่พูดก่อนหน้า
  - left: therefore
    right: บอกผลลัพธ์ของเหตุผลก่อนหน้า
  - left: whereas
    right: เปรียบเทียบความต่างของสองฝ่าย
  - left: admittedly
    right: ยอมรับข้อโต้แย้งก่อนจะแย้ง
  hints:
  - however ใช้กับประโยคที่ต่างจากประโยคก่อนหน้า
  - admittedly มักตามด้วย but หรือ however
  solution: 'however → แย้ง · therefore → ผลลัพธ์ · whereas → เปรียบเทียบความต่าง · admittedly → ยอมรับก่อนแย้ง'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.reading.argumentative-texts.p007
  topics:
  - english.reading.argumentative-texts
  difficulty: 2
  type: text
  stem: 'จาก afford (มีเงินพอจ่าย) + -able (ทำได้) + un- (ไม่) คำศัพท์นี้คือ ___ หมายถึงแพงเกินกว่าที่คนทั่วไปจะจ่ายได้'
  accepted:
  - unaffordable
  misconceptions:
  - match: affordable
    feedback: affordable หมายถึงราคาที่จ่ายได้ ซึ่งตรงข้ามกับคำนี้ เพราะไม่มี un-
  - match: unafford
    feedback: unafford ไม่ใช่คำที่ใช้ได้ คำนี้ต้องมี -able ต่อท้าย
  hints:
  - เริ่มจากการประกอบส่วนประกอบของคำ
  - un- อยู่ข้างหน้าและ -able อยู่ข้างหลัง
  solution: un- + afford + -able = **unaffordable** หมายถึงแพงเกินกว่าจะจ่ายได้ ใช้วิธีแยกส่วนเดียวกับ unsustainable ในบทเรียน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.reading.argumentative-texts.p008
  topics:
  - english.reading.argumentative-texts
  difficulty: 3
  type: mcq
  stem: 'อ่านย่อหน้านี้แล้วตอบคำถาม: "Many people believe that cities should ban cars from the city centre altogether. Admittedly, a ban would reduce pollution and make the streets safer for people on foot. However, it could also hurt small shops that depend on customers who arrive by car, and older residents might find it harder to get around. A better solution may be to improve public transport first, so that people have a real choice before any ban is considered." จุดยืนของผู้เขียนคืออะไร'
  choices:
  - id: a
    text: ควรห้ามรถยนต์ในเมืองทั้งหมดทันที
    feedback: ผู้เขียนยอมรับผลดีของการห้าม แต่ไม่ได้สนับสนุนการห้ามทั้งหมด
  - id: b
    text: การห้ามรถยนต์ไม่มีประโยชน์เลย
    feedback: ผู้เขียนยอมรับว่าการห้ามช่วยลดมลพิษ
  - id: c
    text: ควรปรับปรุงระบบขนส่งสาธารณะแทนการห้ามรถยนต์ทั้งหมด
    correct: true
    feedback: ถูก ผู้เขียนยอมรับผลดี แย้งด้วยผลต่อร้านค้า และเสนอให้ปรับปรุงขนส่งสาธารณะแทน
  - id: d
    text: ผู้เขียนไม่สนใจเรื่องมลพิษ
    feedback: ผู้เขียนพูดถึงการลดมลพิษโดยตรง จึงไม่ใช่ข้อสรุปที่ถูก
  hints:
  - ดูประโยคที่ขึ้นต้นว่า A better solution may be
  - Admittedly และ However บอกว่าผู้เขียนชั่งน้ำหนักทั้งสองฝ่าย
  solution: ข้อ c ถูก เพราะผู้เขียนยอมรับผลดีของการห้าม แย้งด้วยผลต่อร้านค้า และเสนอทางเลือกที่ดีกว่า
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.reading.argumentative-texts.p009
  topics:
  - english.reading.argumentative-texts
  difficulty: 3
  type: order
  stem: เรียงประโยคของย่อหน้าโต้แย้งนี้ให้ถูกลำดับ
  items:
  - Schools in Thailand should reduce homework for primary students.
  - Many children spend more than two hours on homework each evening.
  - Admittedly, some parents believe that homework builds discipline.
  - However, research suggests that rest matters more for young learners.
  - Therefore, a clear limit on homework would benefit both students and families.
  hints:
  - ประโยคแรกคือข้อกล่าวอ้างของย่อหน้า
  - ประโยคที่ยอมรับความเห็นอีกฝ่ายอยู่ก่อนประโยคที่แย้ง และประโยคสรุปอยู่ท้ายสุด
  solution: ลำดับคือ ข้อกล่าวอ้าง → หลักฐาน → ข้อโต้แย้งฝ่ายตรงข้าม (Admittedly) → การตอบโต้ (However) → ข้อสรุป (Therefore)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.reading.argumentative-texts.p010
  topics:
  - english.reading.argumentative-texts
  difficulty: 3
  type: text
  stem: "เติมคำกริยาช่วยที่บอกความเป็นไปได้ 'The policy ___ have a positive effect on local farmers, but the evidence is still limited.'"
  accepted:
  - may
  - might
  - could
  misconceptions:
  - match: will
    feedback: will บอกความมั่นใจสูงกว่า ไม่เข้ากับ but the evidence is still limited
  - match: must
    feedback: must บอกความจำเป็นหรือความแน่นอนสูง ไม่ได้บอกความไม่แน่ใจ
  hints:
  - ประโยคหลัง but บอกว่าหลักฐานยังมีจำกัด
  - คำกริยาช่วยที่บอกความเป็นไปได้
  solution: 'The policy **may** have a positive effect on local farmers, but the evidence is still limited. might หรือ could ก็บอกความเป็นไปได้เช่นกัน'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.reading.argumentative-texts.p011
  topics:
  - english.reading.argumentative-texts
  difficulty: 3
  type: mcq
  stem: 'เลือกคำเชื่อมที่เหมาะที่สุดในช่องว่าง: The first study found clear benefits. ___, the second study found no clear effect.'
  choices:
  - id: a
    text: Therefore
    feedback: therefore บอกผลลัพธ์ แต่ประโยคหลังไม่ใช่ผลของการพบประโยชน์
  - id: b
    text: However
    correct: true
    feedback: ถูก ประโยคหลังต่างจากประโยคก่อน จึงต้องใช้คำแย้ง
  - id: c
    text: For example
    feedback: for example ใช้ยกตัวอย่างที่สนับสนุน ไม่ใช่การแย้ง
  - id: d
    text: As a result
    feedback: as a result บอกผลที่เกิดตามมา ไม่ได้บอกการแย้ง
  hints:
  - ดูว่าประโยคหลังสนับสนุนหรือขัดกับประโยคก่อน
  - ต้องการคำที่แปลว่า "อย่างไรก็ตาม"
  solution: ข้อ b ถูก however บอกว่าผลของการศึกษาที่สองขัดกับผลของการศึกษาแรก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.reading.argumentative-texts.p012
  topics:
  - english.reading.argumentative-texts
  difficulty: 4
  type: text
  stem: 'เติมคำกริยาที่เข้าคู่กับ threat ในภาษาวิชาการ: *Rising costs ___ a serious threat to small businesses in the region.*'
  accepted:
  - pose
  misconceptions:
  - match: make
    feedback: make ไม่ใช่คำที่เข้าคู่กับ threat ในภาษาวิชาการ ให้ใช้ pose a threat
  - match: give
    feedback: give ไม่ใช่คำที่เข้าคู่กับ threat ในภาษาวิชาการ ให้ใช้ pose a threat
  hints:
  - คู่คำที่แปลว่า "ก่อให้เกิดภัยคุกคาม"
  - ดูคอลโลเคชันของคำว่า threat
  solution: '*Rising costs **pose** a serious threat to small businesses in the region.* pose a threat เป็นคอลโลเคชันมาตรฐาน'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.reading.argumentative-texts.p013
  topics:
  - english.reading.argumentative-texts
  difficulty: 4
  type: mcq
  stem: 'อ่านข้อความแล้วตอบคำถาม: "The city council claims that its new recycling scheme has been a resounding success. Officials point to the bright new bins in every district and a popular advertising campaign. However, the figures released last month tell a different story: the amount of waste sent for recycling has fallen by a third since the scheme began, and two collection centres have already closed." ผู้เขียนแฝงความหมายว่าอย่างไร'
  choices:
  - id: a
    text: โครงการประสบความสำเร็จตามที่เทศบาลกล่าวจริง
    feedback: คำว่า claims และ tell a different story บอกว่าผู้เขียนไม่เห็นด้วยกับคำกล่าวนั้น
  - id: b
    text: ผู้เขียนสงสัยคำกล่าวอ้างของเทศบาล เพราะตัวเลขแสดงว่าขยะที่ส่งรีไซเคิลลดลงหนึ่งในสาม
    correct: true
    feedback: ถูก คำว่า claims และวลี tell a different story บอกว่าผู้เขียนไม่เชื่อตามคำกล่าวอ้าง เพราะข้อมูลแสดงการลดลง
  - id: c
    text: ตัวเลขไม่เกี่ยวข้องกับคำกล่าวอ้าง
    feedback: ตัวเลขถูกยกมาเพื่อขัดกับคำกล่าวอ้างโดยตรง
  - id: d
    text: ผู้เขียนสนับสนุนโครงการนี้อย่างเต็มที่
    feedback: ผู้เขียนแสดงข้อมูลที่ขัดกับคำกล่าวอ้างของกระทรวง
  hints:
  - คำว่า claims บอกอะไรเกี่ยวกับความเชื่อของผู้เขียน
  - However และ tell a different story นำข้อมูลที่ขัดกับคำกล่าวอ้าง
  solution: ข้อ b ถูก ผู้เขียนเลือกคำว่า claims แทน says แล้วยกตัวเลขที่ขัดกัน (ขยะรีไซเคิลลดลงหนึ่งในสาม ศูนย์รับขยะปิดสองแห่ง) จึงแฝงว่าไม่เชื่อคำกล่าวอ้างของเทศบาล ส่วนถังขยะใหม่และโฆษณาเป็นสิ่งที่มองเห็น ไม่ใช่ผลลัพธ์
