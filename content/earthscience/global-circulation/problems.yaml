    stem: "ข้อใดเป็นผลของแรงเสียดทานต่อลมใกล้ผิวพื้นในซีกโลกเหนือ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ลมช้าลงกว่าลมชั้นบนที่ความกดอากาศเปลี่ยนเท่ากัน", correct: true }
      - { id: b, text: "ลมพัดเฉียงข้ามไอโซบาร์เข้าหาความกดอากาศต่ำ", correct: true }
      - { id: c, text: "อากาศบรรจบกันที่ศูนย์กลางความกดอากาศต่ำแล้วยกตัว ทำให้เกิดเมฆและฝน", correct: true }
      - { id: d, text: "แรงคอริออลิสแรงขึ้นเพราะลมช้าลง", feedback: "แรงคอริออลิสแปรตามอัตราเร็ว $fv$ ลมช้าลงแรงคอริออลิสจึงอ่อนลง" }
      - { id: e, text: "ลมเปลี่ยนเป็นหมุนตามเข็มนาฬิการอบความกดอากาศต่ำ", feedback: "ทิศการหมุนยังเป็นทวนเข็มนาฬิกา แรงเสียดทานเพียงทำให้ลมเฉียงเข้าหาศูนย์กลาง" }
    hints:
      - "แรงเสียดทานชี้สวนทางกับลม"
      - "ลมช้าลง แรงคอริออลิส $fv$ เป็นอย่างไร"
    solution: "แรงเสียดทานทำให้ลมช้าลง แรงคอริออลิสจึงอ่อนลงและหักล้างแรงเกรเดียนต์ได้ไม่หมด ลมจึงเฉียงเข้าหาความกดอากาศต่ำ อากาศที่บรรจบกันต้องยกตัว ทิศการหมุนยังเป็นทวนเข็มนาฬิกา"
