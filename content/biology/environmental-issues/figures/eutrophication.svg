<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="850" height="260" font-family="sans-serif" font-size="14">
<title>ยูโทรฟิเคชัน: ธาตุอาหารล้นแหล่งน้ำ</title>
<rect x="0" y="0" width="850" height="260" fill="#ffffff"/>
<rect x="20.0" y="70.0" width="140.0" height="80.0" rx="8" fill="#eef7ee" stroke="#2a7a3a" stroke-width="1.5"/>
<text x="90.0" y="104.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">ปุ๋ยและน้ำทิ้ง</text>
<text x="90.0" y="126.0" text-anchor="middle" font-size="12" fill="#555">ไนเตรต ฟอสเฟต</text>
<line x1="162.0" y1="110.0" x2="180.0" y2="110.0" stroke="#333" stroke-width="2"/>
<polygon points="180.0,110.0 173.6,112.7 173.6,107.3" fill="#333"/>
<rect x="182.0" y="70.0" width="140.0" height="80.0" rx="8" fill="#eef7ee" stroke="#2a7a3a" stroke-width="1.5"/>
<text x="252.0" y="104.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">สาหร่ายเพิ่ม</text>
<text x="252.0" y="126.0" text-anchor="middle" font-size="12" fill="#555">น้ำเขียว บังแสง</text>
<line x1="324.0" y1="110.0" x2="342.0" y2="110.0" stroke="#333" stroke-width="2"/>
<polygon points="342.0,110.0 335.6,112.7 335.6,107.3" fill="#333"/>
<rect x="344.0" y="70.0" width="140.0" height="80.0" rx="8" fill="#fbecec" stroke="#a22" stroke-width="1.5"/>
<text x="414.0" y="104.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">สาหร่ายตาย</text>
<text x="414.0" y="126.0" text-anchor="middle" font-size="12" fill="#555">ผู้ย่อยสลายเพิ่ม</text>
<line x1="486.0" y1="110.0" x2="504.0" y2="110.0" stroke="#333" stroke-width="2"/>
<polygon points="504.0,110.0 497.6,112.7 497.6,107.3" fill="#333"/>
<rect x="506.0" y="70.0" width="140.0" height="80.0" rx="8" fill="#fbecec" stroke="#a22" stroke-width="1.5"/>
<text x="576.0" y="104.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">ออกซิเจน</text>
<text x="576.0" y="126.0" text-anchor="middle" font-size="12" fill="#555">ในน้ำลดลง</text>
<line x1="648.0" y1="110.0" x2="666.0" y2="110.0" stroke="#333" stroke-width="2"/>
<polygon points="666.0,110.0 659.6,112.7 659.6,107.3" fill="#333"/>
<rect x="668.0" y="70.0" width="140.0" height="80.0" rx="8" fill="#fbecec" stroke="#a22" stroke-width="1.5"/>
<text x="738.0" y="104.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">ปลาตาย</text>
<text x="738.0" y="126.0" text-anchor="middle" font-size="12" fill="#555">น้ำเน่าเสีย</text>
<text x="425.0" y="200.0" text-anchor="middle" font-size="13" fill="#333">ผู้ย่อยสลายใช้ออกซิเจนในการหายใจขณะย่อยซากสาหร่ายจำนวนมาก จึงเป็นสาเหตุหลักที่ออกซิเจนลดลง</text>
