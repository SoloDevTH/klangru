  - { framework: th-core-2551-thai, indicators: ["ท 2.1 ป.5/6"], coverage: partial, note: "เลือกรูปแบบให้ตรงเจตนา (แสดงความรู้สึก ความคิดเห็น) และเลือกข้อความแสดงความรู้สึกที่สุภาพพร้อมสาเหตุ แต่แอปตรวจงานเขียนอิสระของผู้เรียนไม่ได้" }
