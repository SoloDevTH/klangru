      - "$G'(x) = \\sqrt{1 + x^2}\\cdot 2x$"
    misconceptions:
      - { match: 2.24, feedback: "ลืมคูณอนุพันธ์ของขอบบน $(x^2)' = 2x$" }
      - { match: 1.73, feedback: "ต้องแทน $t = x^2 = 4$ ไม่ใช่ $t = x = 2$ และคูณ $2x$" }
    solution: "$G'(x) = \\sqrt{1 + x^2} \\cdot 2x$ จึง $G'(2) = \\sqrt5 \\cdot 4 \\approx 8.94$"
