<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="760" height="170" font-family="sans-serif" font-size="14">
  <title>ห้าขั้นจากการสำรวจตนเองสู่การเข้าสู่อาชีพ</title>
  <rect x="0" y="0" width="760" height="170" fill="#ffffff"/>
  <rect x="10.0" y="40.0" width="138.0" height="80.0" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
