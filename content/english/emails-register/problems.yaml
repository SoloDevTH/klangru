- id: english.writing.emails-register.p019
  topics:
  - english.writing.emails-register
  difficulty: 5
  type: order
  stem: เรียงอีเมลปฏิเสธคำเชิญเป็นกรรมการตัดสินการประกวดพร้อมเสนอทางเลือกให้ถูกลำดับ
  items:
  - 'Dear Ms Jaidee,'
  - Thank you for inviting me to judge the English speech contest on 25 November.
  - Unfortunately, I will be at a teachers' conference in Khon Kaen that week, so I'm afraid I won't be able to attend.
  - Would it be helpful if I asked my colleague, Mr Rakdee, whether he could judge instead?
  - Either way, I hope the contest is a great success.
  - Yours sincerely,
  - Anong Sukjai
  hints:
  - ขอบคุณก่อนปฏิเสธ แล้วบอกเหตุผลสั้น ๆ
  - Either way อ้างถึงข้อเสนอในประโยคก่อนหน้า จึงต้องอยู่หลังข้อเสนอทางเลือก
  solution: คำขึ้นต้น → ขอบคุณ → ปฏิเสธพร้อมเหตุผล → เสนอทางเลือก → แสดงความหวังดี (Either way) → คำลงท้าย → ชื่อ
