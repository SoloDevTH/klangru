id: thai.speaking.presentations
subject: thai
title: { th: "การพูดรายงาน พูดในโอกาสต่าง ๆ และพูดโน้มน้าว", en: "Oral reports, occasion speeches and persuasive speaking" }
summary: พูดให้ตรงวัตถุประสงค์ วางโครงสร้างการพูดรายงานพร้อมบอกแหล่งที่มา พูดต้อนรับ แนะนำ ขอบคุณ อวยพร พูดโน้มน้าว 5 ขั้นโดยเรียงหลักฐาน พูดแสดงทรรศนะ โต้แย้ง เสนอแนวคิดใหม่ และประเมินการพูด
difficulty: 5
minutes: 35
prerequisites: [thai.speaking.opinions-feelings]
encompasses:
  - { id: thai.speaking.opinions-feelings, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: persuasion-steps.svg
    alt: "บันไดห้าขั้นของการพูดโน้มน้าว ตัวอย่างชวนเพื่อนพกกระบอกน้ำ ขั้น 1 เร้าความสนใจ สัปดาห์ที่แล้ว ถังขยะหน้าโรงอาหารเต็มไปด้วยขวดพลาสติก ขั้น 2 ชี้ปัญหา ขวดล้นถังทุกวัน พร้อมตัวเลขจากการสำรวจของสภานักเรียน ขั้น 3 เสนอทางแก้ พกกระบอกน้ำมาเอง และใช้จุดเติมน้ำของโรงเรียน ขั้น 4 ให้เห็นภาพ ถ้าทำ ถังขยะโล่งและประหยัดเงิน ถ้าไม่ทำ ขยะเพิ่มทุกเดือน ขั้น 5 เรียกร้องให้ทำ พรุ่งนี้พกกระบอกน้ำมาคนละใบ"
    caption: "เร้าความสนใจ ชี้ปัญหา เสนอทางแก้ ให้เห็นภาพ เรียกร้องให้ทำ"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: เขียนบทกล่าวขอบคุณวิทยากร
    problem: "เขียนบทกล่าวขอบคุณคุณสมชาย ใจดี (สมมติ) ที่มาสอนปลูกผักไร้ดินในงานสัปดาห์วิทยาศาสตร์ ยาวไม่เกิน 1 นาที"
    steps:
      - text: "ทักทายตามลำดับ: เรียนท่านผู้อำนวยการ คุณสมชาย ใจดี คณะครู และเพื่อนนักเรียนทุกคน"
        why: "งานพิธีทักทายจากผู้มีตำแหน่งสูงสุดก่อน"
      - text: "ขอบคุณ: กระผมในนามของนักเรียนทุกคน ขอขอบพระคุณคุณสมชายที่กรุณาสละเวลามาให้ความรู้"
      - text: "บอกประโยชน์ที่ได้: วันนี้เราได้รู้วิธีผสมสารละลายธาตุอาหารและดูแลผักไร้ดินที่ทำได้ที่บ้าน"
        why: "การบอกประโยชน์ที่ได้จริงแสดงว่าผู้ฟังตั้งใจฟัง"
      - text: "ปิด: ขอเชิญท่านผู้อำนวยการมอบของที่ระลึก และขอให้ทุกคนปรบมือขอบคุณอีกครั้ง"
    answer: "ทักทายตามลำดับ → ขอบคุณ → บอกประโยชน์ที่ได้ → เชิญมอบของที่ระลึก ใช้ภาษาทางการและสั้น"
  - { type: check, problem: thai.speaking.presentations.p005, prompt: "แนะนำวิทยากรบอกความรู้ที่เกี่ยวกับหัวข้อ" }
  - type: worked-example
    title: วางบทพูดโน้มน้าวพร้อมหลักฐาน
    problem: "วางบทพูดโน้มน้าว 2 นาที ชวนเพื่อนแยกขยะในโรงอาหาร"
    steps:
      - text: "เร้าความสนใจ: เปิดด้วยภาพถังขยะล้นหลังโรงอาหาร"
      - text: "ชี้ปัญหาพร้อมหลักฐาน: ผลสำรวจของสภานักเรียนพบว่าขวดพลาสติกปนเศษอาหารเกือบทุกถัง (บอกว่าใครสำรวจ เมื่อไร)"
        why: "หลักฐานที่บอกที่มาทำให้ผู้ฟังเชื่อด้วยเหตุผล ไม่ใช่ด้วยอารมณ์"
      - text: "เสนอทางแก้: แยกเป็น 3 ถัง เศษอาหาร ขวดพลาสติก ขยะทั่วไป"
      - text: "ให้เห็นภาพ: ขวดที่แยกแล้วขายเป็นทุนกิจกรรม เศษอาหารทำปุ๋ยให้แปลงผัก"
      - text: "เรียกร้องให้ทำ: เริ่มพรุ่งนี้ ทิ้งให้ถูกถังทุกครั้ง"
    answer: "บทพูดเรียงปัญหา สาเหตุ ทางแก้ และผลดี โดยใช้หลักฐานที่บอกที่มา จบด้วยสิ่งที่ผู้ฟังทำได้ทันที"
  - { type: check, problem: thai.speaking.presentations.p013, prompt: "ปัญหา สาเหตุ ทางแก้" }
glossary:
  - { term: พูดรายงาน, definition: "การพูดเล่าสิ่งที่ศึกษาค้นคว้ามาอย่างเป็นลำดับ พร้อมบอกแหล่งที่มา" }
  - { term: พูดโน้มน้าว, definition: "การพูดให้ผู้ฟังเชื่อหรือทำตาม ด้วยเหตุผลและหลักฐาน" }
  - { term: ทรรศนะ, definition: "ความเห็นที่มีเหตุผล ประกอบด้วยที่มา ข้อสนับสนุน และข้อสรุป" }
  - { term: โต้แย้ง, definition: "การแสดงเหตุผลและหลักฐานเพื่อแย้งความเห็นอีกฝ่ายอย่างสุภาพ" }
  - { term: วิทยากร, definition: "ผู้ที่มาให้ความรู้ในการอบรมหรือการบรรยาย" }
flashcards:
  - { front: "พูดรายงาน 4 ส่วน", back: "บทนำ เนื้อหาพร้อมแหล่งที่มา สรุป ตอบคำถาม" }
  - { front: "พูดโน้มน้าว 5 ขั้น", back: "เร้าความสนใจ ชี้ปัญหา เสนอทางแก้ ให้เห็นภาพ เรียกร้องให้ทำ" }
  - { front: "ทรรศนะ 3 ส่วน", back: "ที่มา ข้อสนับสนุน ข้อสรุป" }
  - { front: "แนะนำวิทยากร", back: "ชื่อ ตำแหน่ง ความรู้หรือผลงานที่เกี่ยวกับหัวข้อ สั้น ๆ" }
  - { front: "โต้แย้งอย่างสร้างสรรค์", back: "ยอมรับส่วนที่ถูก ชี้จุดต่างด้วยหลักฐาน ไม่โจมตีบุคคล" }
