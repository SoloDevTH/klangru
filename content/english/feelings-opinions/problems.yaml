problems:
- id: english.speaking.feelings-opinions.p001
  topics:
  - english.speaking.feelings-opinions
  difficulty: 1
  type: text
  stem: 'เติมคำ bore ในรูปที่ถูก: *This film is too long. I''m ___.*'
  accepted:
  - bored
  misconceptions:
  - match: boring
    feedback: I'm boring แปลว่า ฉันเป็นคนน่าเบื่อ คนที่รู้สึกเบื่อใช้ bored
  - match: bore
    feedback: ต้องเป็นคุณศัพท์ -ed บอกความรู้สึกของคน
  hints:
  - ประธานคือ I (คน) กำลังบอกความรู้สึก
  - คนรู้สึก ใช้ -ed · สิ่งที่ทำให้รู้สึก ใช้ -ing
  solution: '*This film is too long. I''m **bored**.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.feelings-opinions.p002
  topics:
  - english.speaking.feelings-opinions
  difficulty: 1
  type: mcq
  stem: ข้อใด **แสดงความคิดเห็น**
  choices:
  - id: a
    text: In my opinion, the new park is too small.
    correct: true
    feedback: ถูก In my opinion นำความคิดเห็น
  - id: b
    text: The new park opened last Sunday.
    feedback: เป็นข้อเท็จจริงที่ตรวจสอบได้
  - id: c
    text: The new park is next to the hospital.
    feedback: เป็นข้อเท็จจริงเรื่องที่ตั้ง
  - id: d
    text: Is the new park open today?
    feedback: เป็นคำถามขอข้อมูล ไม่ได้แสดงความเห็น
  hints:
  - ความคิดเห็นมักขึ้นต้นด้วย I think, In my opinion, I believe
  - ข้อเท็จจริงตรวจสอบได้ ความเห็นเป็นการตัดสินของผู้พูด
  solution: '***In my opinion, the new park is too small.***'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.feelings-opinions.p003
  topics:
  - english.speaking.feelings-opinions
  difficulty: 1
  type: mcq
  stem: 'เติมคำที่ถูก: *I ___ with you. Durian is the king of fruits!*'
  choices:
  - id: a
    text: agree
    correct: true
    feedback: ถูก agree เป็นกริยา ใช้ต่อจาก I ได้เลย
  - id: b
    text: am agree
    feedback: agree เป็นกริยาอยู่แล้ว ไม่ต้องมี am
  - id: c
    text: agreeing
    feedback: ต้องมีกริยาแท้หลัง I ใช้ agree
  - id: d
    text: agrees
    feedback: I ไม่เติม s
  hints:
  - agree เป็นกริยาหรือคุณศัพท์
  - I + กริยารูปปกติ
  solution: '*I **agree** with you.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.feelings-opinions.p004
  topics:
  - english.speaking.feelings-opinions
  difficulty: 2
  type: text
  stem: 'เติมคำ interest ในรูปที่ถูก: *Our trip to Ayutthaya was very ___. We learned a lot about Thai history.*'
  accepted:
  - interesting
  misconceptions:
  - match: interested
    feedback: trip เป็นสิ่งที่ทำให้รู้สึก ใช้ -ing คนที่รู้สึกสนใจจึงใช้ interested
  - match: interest
    feedback: ต้องเป็นคุณศัพท์ หลัง very
  hints:
  - ประธานคือ our trip (สิ่ง ไม่ใช่คน)
  - สิ่งที่ทำให้รู้สึก ใช้ -ing
  solution: '*Our trip to Ayutthaya was very **interesting**.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.feelings-opinions.p005
  topics:
  - english.speaking.feelings-opinions
  difficulty: 2
  type: match
  stem: จับคู่สำนวนกับความหมาย
  pairs:
  - left: I can't stand ...
    right: ทนไม่ได้ เกลียดมาก
  - left: I don't mind ...
    right: ไม่ว่าอะไร ได้ทั้งนั้น
  - left: I'm keen on ...
    right: ชอบ สนใจ
  - left: I'm fed up with ...
    right: เบื่อหน่าย ทนมานานแล้ว
  hints:
  - ลองเรียงจากชอบไปไม่ชอบ
  - don't mind เป็นกลาง ๆ ส่วน can't stand ไม่ชอบที่สุด
  solution: can't stand = ทนไม่ได้ · don't mind = ไม่ว่าอะไร · keen on = ชอบ สนใจ · fed up with = เบื่อหน่าย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.feelings-opinions.p006
  topics:
  - english.speaking.feelings-opinions
  difficulty: 2
  type: mcq
  stem: เพื่อนพูดว่า *I love spicy food.* ถ้าเราก็ชอบเหมือนกัน ตอบอย่างไรได้ (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: So do I.
    correct: true
    feedback: ถูก ตอบรับประโยคบอกเล่า
  - id: b
    text: Me too.
    correct: true
    feedback: ถูก ใช้ได้ในภาษาพูด
  - id: c
    text: Neither do I.
    feedback: Neither ใช้ตอบประโยคปฏิเสธ แปลว่า ฉันก็ไม่ชอบ
  - id: d
    text: So am I.
    feedback: ประโยคเดิมใช้กริยา love (do) ไม่ใช่ be จึงต้องเป็น So do I
  hints:
  - ประโยคเดิมเป็นบอกเล่าหรือปฏิเสธ
  - กริยาเดิมคือ love จึงใช้ do ในคำตอบ
  solution: '***So do I.*** หรือ ***Me too.***'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.feelings-opinions.p007
  topics:
  - english.speaking.feelings-opinions
  difficulty: 2
  type: mcq
  stem: เพื่อนพูดว่า *I don't like horror films.* ถ้าเราก็ไม่ชอบเหมือนกัน ตอบอย่างไรได้ (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: Neither do I.
    correct: true
    feedback: ถูก ตอบรับประโยคปฏิเสธ
  - id: b
    text: Me neither.
    correct: true
    feedback: ถูก ใช้ได้ในภาษาพูด
  - id: c
    text: So do I.
    feedback: So do I แปลว่า ฉันก็ชอบ ใช้ตอบประโยคบอกเล่า
  - id: d
    text: Neither I do.
    feedback: ลำดับคำผิด ต้องเป็น Neither do I
  hints:
  - ประโยคเดิมเป็นปฏิเสธ (don't)
  - ปฏิเสธตอบด้วย Neither do I หรือ Me neither
  solution: '***Neither do I.*** หรือ ***Me neither.***'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.feelings-opinions.p008
  topics:
  - english.speaking.feelings-opinions
  difficulty: 2
  type: text
  stem: 'เติมคำ worry ในรูปที่ถูก: *I feel ___ about the haze in Chiang Mai because it is bad for our health.*'
  accepted:
  - worried
  misconceptions:
  - match: worrying
    feedback: ประธานคือ I (คน) ที่รู้สึก ใช้ worried ส่วน worrying ใช้กับสิ่งที่ทำให้กังวล
  - match: worry
    feedback: หลัง feel ใช้คุณศัพท์ worried
  hints:
  - คนที่รู้สึกใช้ -ed
  - worry → worried (y เปลี่ยนเป็น i แล้วเติม ed)
  solution: '*I feel **worried** about the haze in Chiang Mai because it is bad for our health.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.feelings-opinions.p009
  topics:
  - english.speaking.feelings-opinions
  difficulty: 3
  type: order
  stem: เรียงประโยคให้เป็นความคิดเห็นแบบ O-R-E-O
  items:
  - I think every school should have a vegetable garden.
  - Students can learn where their food comes from.
  - For example, at my school we grow morning glory and use it in the canteen.
  - That's why I believe school gardens are a great idea.
  hints:
  - เริ่มด้วยความเห็น (I think) จบด้วยการสรุปความเห็นซ้ำ (That's why)
  - For example นำตัวอย่าง ซึ่งอยู่หลังเหตุผล
  solution: Opinion (I think ...) → Reason (Students can learn ...) → Example (For example ...) → Opinion again (That's why ...)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.feelings-opinions.p010
  topics:
  - english.speaking.feelings-opinions
  difficulty: 3
  type: text
  stem: 'เติมวลีสองคำที่ใช้นำตัวอย่าง: *Cycling is good for you. ___, it makes your legs strong and your heart healthy.*'
  accepted:
  - For example
  - For instance
  misconceptions:
  - match: Because
    feedback: because นำเหตุผลและต้องตามด้วยอนุประโยคในประโยคเดียวกัน ไม่ใช้ขึ้นต้นแล้วตามด้วยจุลภาค
  - match: Such as
    feedback: such as ตามด้วยคำนามในประโยคเดียวกัน ไม่ขึ้นต้นประโยคแบบนี้
  - match: For examples
    feedback: 'ใช้ example รูปเอกพจน์: For example'
  hints:
  - ส่วนหลังจุลภาคเป็นตัวอย่างของประโยคแรก
  - วลีนำตัวอย่างที่ขึ้นต้นประโยคได้ เช่น For ...
  solution: '*Cycling is good for you. **For example**, it makes your legs strong and your heart healthy.* (ใช้ For instance ก็ได้)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.feelings-opinions.p011
  topics:
  - english.speaking.feelings-opinions
  difficulty: 3
  type: mcq
  stem: เพื่อนพูดว่า *I think we should have school on Saturdays too.* ข้อใดแย้งได้ **สุภาพและมีเหตุผล** ที่สุด
  choices:
  - id: a
    text: I see your point, but I don't really agree because we need time to rest and help our families.
    correct: true
    feedback: ถูก รับฟังก่อน แย้งอย่างสุภาพ และมีเหตุผล
  - id: b
    text: You're wrong.
    feedback: ไวยากรณ์ถูก แต่ห้วนและไม่มีเหตุผล ฟังดูไม่สุภาพ
  - id: c
    text: No. Bad idea.
    feedback: ห้วน ไม่สุภาพ และไม่มีเหตุผล
  - id: d
    text: I agree because we need time to rest.
    feedback: บอกว่าเห็นด้วยแต่เหตุผลขัดกับความเห็น เพราะเหตุผลนี้เป็นของฝ่ายที่ไม่เห็นด้วย
  hints:
  - 'แย้งอย่างสุภาพ: รับฟังก่อน แล้วค่อยบอกว่าไม่เห็นด้วย'
  - ต้องมีเหตุผลด้วย
  solution: '***I see your point, but I don''t really agree because we need time to rest and help our families.***'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.feelings-opinions.p012
  topics:
  - english.speaking.feelings-opinions
  difficulty: 3
  type: text
  stem: 'เติมกริยา read ในรูปที่ถูก: *I really enjoy ___ comics before bed.*'
  accepted:
  - reading
  misconceptions:
  - match: to read
    feedback: หลัง enjoy ใช้ V-ing ไม่ใช้ to + V
  - match: read
    feedback: หลัง enjoy ใช้ V-ing
  hints:
  - enjoy ตามด้วยกริยารูปใด
  - enjoy, don't mind, can't stand + V-ing
  solution: '*I really enjoy **reading** comics before bed.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.feelings-opinions.p013
  topics:
  - english.speaking.feelings-opinions
  difficulty: 3
  type: mcq
  stem: ข้อใดถูกต้อง
  choices:
  - id: a
    text: I like Thai boxing very much.
    correct: true
    feedback: ถูก very much อยู่หลังกรรม (Thai boxing)
  - id: b
    text: I very like Thai boxing.
    feedback: very ขยายกริยา like ตรง ๆ ไม่ได้ ใช้ really like หรือ like ... very much
  - id: c
    text: I like very much Thai boxing.
    feedback: very much ต้องอยู่หลังกรรม ไม่คั่นระหว่างกริยากับกรรม
  - id: d
    text: I am like Thai boxing very much.
    feedback: like เป็นกริยาแล้ว ไม่ต้องมี am
  hints:
  - very much วางไว้ท้ายประโยค หลังกรรม
  - ภาษาไทยพูดว่า ชอบมาก แต่ภาษาอังกฤษไม่ใช้ very หน้า like
  solution: '***I like Thai boxing very much.*** (หรือ *I really like Thai boxing.*)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.feelings-opinions.p014
  topics:
  - english.speaking.feelings-opinions
  difficulty: 4
  type: mcq
  stem: เพื่อนถามว่า *Should students have homework at weekends?* ข้อใดตอบได้ครบทั้ง **ความเห็น เหตุผล และตัวอย่าง**
  choices:
  - id: a
    text: I don't think so because students need time for hobbies. For example, my sister practises the ranat ek every weekend.
    correct: true
    feedback: ถูก มีความเห็น (I don't think so) เหตุผล (because ...) และตัวอย่าง (For example ...)
  - id: b
    text: I don't think so.
    feedback: มีแต่ความเห็น ไม่มีเหตุผลและตัวอย่าง
  - id: c
    text: I don't think so because students need time for hobbies.
    feedback: มีความเห็นและเหตุผล แต่ไม่มีตัวอย่าง
  - id: d
    text: My sister practises the ranat ek every weekend.
    feedback: เป็นตัวอย่างอย่างเดียว ไม่ได้บอกความเห็น
  hints:
  - 'นับส่วนประกอบ: ความเห็น เหตุผล ตัวอย่าง'
  - หาคำ because และ For example
  solution: '***I don''t think so because students need time for hobbies. For example, my sister practises the ranat ek every weekend.***'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.feelings-opinions.p015
  topics:
  - english.speaking.feelings-opinions
  difficulty: 4
  type: match
  stem: จับคู่คำถามกับคำตอบที่เหมาะสม
  pairs:
  - left: What do you think of the new canteen?
    right: I think it's great because the food is cheaper.
  - left: How did you feel when you won the contest?
    right: I was really excited.
  - left: Do you agree that phones should be banned in class?
    right: I partly agree. Phones are distracting, but they're useful for research.
  - left: Which do you prefer, the beach or the mountains?
    right: I prefer the mountains because it's cooler there.
  hints:
  - 'ดูคำสำคัญในคำถาม: think of, feel, agree, prefer'
  - คำตอบที่ดีตรงกับชนิดของคำถาม
  solution: think of → ความเห็น · feel → ความรู้สึก · agree → เห็นด้วยบางส่วน · prefer → เลือกพร้อมเหตุผล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.feelings-opinions.p016
  topics:
  - english.speaking.feelings-opinions
  difficulty: 4
  type: mcq
  stem: 'เลือกคำที่ถูก: *The students were ___ by the test results. Nobody expected such high scores.*'
  choices:
  - id: a
    text: surprised
    correct: true
    feedback: ถูก the students (คน) เป็นผู้รู้สึกประหลาดใจ
  - id: b
    text: surprising
    feedback: surprising บอกสิ่งที่ทำให้ประหลาดใจ (The results were surprising.)
  - id: c
    text: surprise
    feedback: หลัง were ต้องเป็นคุณศัพท์ surprised
  - id: d
    text: surprisingly
    feedback: เป็นคำกริยาวิเศษณ์ ไม่ใช้หลัง were ในประโยคนี้
  hints:
  - ใครรู้สึก
  - คนที่รู้สึกใช้ -ed
  solution: '*The students were **surprised** by the test results.* (ส่วน *The test results were surprising.*)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.feelings-opinions.p017
  topics:
  - english.speaking.feelings-opinions
  difficulty: 5
  type: mcq
  stem: 'อ่านข่าวแล้วเลือกคำตอบที่แสดง **ความรู้สึก ความคิดเห็น และเหตุผล** ได้เหมาะสมที่สุด


    *Our town will stop using foam food boxes at the night market from next month. Vendors will use paper boxes or banana leaves instead.*'
  choices:
  - id: a
    text: I'm pleased about this news because foam boxes take hundreds of years to break down. I think banana leaves are a smart idea since they come from nature.
    correct: true
    feedback: ถูก มีความรู้สึก (pleased) ความเห็น (I think ...) และเหตุผลสองข้อที่เกี่ยวกับข่าว
  - id: b
    text: I'm pleasing about this news because foam is bad.
    feedback: pleasing ใช้กับสิ่งที่ทำให้พอใจ คนที่พอใจใช้ pleased และเหตุผลสั้นเกินไป
  - id: c
    text: The night market will use paper boxes or banana leaves.
    feedback: เป็นการทวนข่าว ไม่มีความรู้สึกหรือความเห็น
  - id: d
    text: I'm pleased about this news. Banana is my favourite fruit.
    feedback: เหตุผลไม่เกี่ยวกับข่าว
  hints:
  - คำตอบที่ดีมีความรู้สึก ความเห็น และเหตุผลที่เกี่ยวกับข่าว
  - ระวัง -ed / -ing และเหตุผลที่ไม่เกี่ยวข้อง
  solution: '***I''m pleased about this news because foam boxes take hundreds of years to break down. I think banana leaves are a smart idea since they come from nature.***'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.feelings-opinions.p018
  topics:
  - english.speaking.feelings-opinions
  difficulty: 5
  type: order
  stem: เรียงบทสนทนาแลกเปลี่ยนความคิดเห็นให้เป็นลำดับที่สมเหตุสมผล
  items:
  - 'A: What do you think about the new bike lane on our street?'
  - 'B: I think it''s great because more people will cycle to school.'
  - 'A: That''s true, but some shop owners say they have nowhere to park.'
  - 'B: I see your point. For example, the noodle shop lost its parking space.'
  - 'A: Maybe the town could make a small car park behind the market.'
  hints:
  - เริ่มด้วยการถามความเห็น
  - B เห็นด้วยกับข้อกังวลของ A แล้วยกตัวอย่าง จากนั้น A เสนอทางออก
