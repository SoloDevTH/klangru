id: physics.electricity.electronics-intro
subject: physics
title: { th: ชิ้นส่วนอิเล็กทรอนิกส์และแผนภาพวงจร, en: Electronic components and circuit diagrams }
summary: สัญลักษณ์และแผนภาพวงจรของตัวต้านทานแบบอนุกรมและขนาน ตัวต้านทานปรับค่าได้ ไดโอด แอลอีดี ตัวเก็บประจุ และทรานซิสเตอร์ พร้อมการต่อวงจรอิเล็กทรอนิกส์อย่างง่าย
difficulty: 5
minutes: 35
prerequisites: [physics.electricity.circuits]
encompasses:
  - { id: physics.electricity.circuits, weight: 0.3 }
  - { id: physics.electricity.current-voltage, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: สัญลักษณ์ของชิ้นส่วนอิเล็กทรอนิกส์
    src: symbols.svg
    alt: "ตารางสัญลักษณ์แปดแบบ ตัวต้านทานเป็นเส้นซิกแซก ตัวต้านทานปรับค่าได้เป็นซิกแซกมีลูกศรพาดเฉียง ตัวต้านทานไวแสงเป็นซิกแซกมีลูกศรสองเส้นชี้เข้าหา ตัวเก็บประจุเป็นแผ่นขนานสองแผ่น ไดโอดเป็นสามเหลี่ยมชี้ไปที่ขีดตั้ง ขาซ้าย A ขาขวา K แอลอีดีเป็นสัญลักษณ์ไดโอดที่มีลูกศรเล็กสองเส้นพุ่งออก ทรานซิสเตอร์ NPN เป็นวงกลมมีขา B ทางซ้าย ขา C ด้านบน และขา E ด้านล่างที่มีหัวลูกศรชี้ออก แบตเตอรี่เป็นเส้นยาวสลับเส้นสั้นหนาสองชุด"
    caption: "ไดโอดและแอลอีดีให้กระแสไหลตามทิศหัวลูกศรจากแอโนด (A) ไปแคโทด (K)"
  - type: figure
    title: วงจรแอลอีดีพร้อมตัวต้านทานจำกัดกระแส
    src: led-circuit.svg
    alt: "แผนภาพวงจร แบตเตอรี่ 9 V อยู่ด้านล่าง ขั้วบวกทางซ้าย สายจากขั้วบวกขึ้นไปด้านบนผ่านสวิตช์ที่ปิดอยู่ แล้วผ่านตัวต้านทาน R = 350 Ω ไปทางขวา ลงมาผ่านแอลอีดีที่หัวลูกศรชี้ลง (ไบอัสตรง) กินความต่างศักย์ 2.0 V แล้วกลับเข้าขั้วลบ ลูกศรสีส้มบอกกระแส I = 20 mA"
    caption: "ตัวต้านทานรับความต่างศักย์ส่วนที่เหลือ 9 − 2 = 7 V จึงจำกัดกระแสไว้ที่ 7 ÷ 350 = 0.020 A"
  - type: worked-example
    title: เลือกตัวต้านทานให้แอลอีดี
    problem: "ต้องการต่อแอลอีดีสีแดง (2.0 V, 20 mA) กับถ่าน 9 V ต้องใช้ตัวต้านทานกี่โอห์ม และควรใช้แถบสีใด"
    steps:
      - text: "ความต่างศักย์ที่ตัวต้านทานต้องรับ $9 - 2.0 = 7.0\\ \\mathrm{V}$"
        why: "แอลอีดีกับตัวต้านทานต่ออนุกรม ความต่างศักย์ของแหล่งจ่ายแบ่งกันระหว่างสองชิ้นนี้"
      - text: "แปลงกระแส $20\\ \\mathrm{mA} = 0.020\\ \\mathrm{A}$ แล้ว $R = \\dfrac{7.0}{0.020} = 350\\ \\Omega$"
      - text: "ค่ามาตรฐานที่ใกล้และสูงกว่าคือ $390\\ \\Omega$ ให้กระแส $\\tfrac{7.0}{390} \\approx 18\\ \\mathrm{mA}$ ยังสว่างดีและปลอดภัย"
      - text: "$390 = 39 \\times 10^1$ แถบสีจึงเป็น ส้ม (3) ขาว (9) น้ำตาล (เติมศูนย์ 1 ตัว) ทอง"
    answer: "ใช้ตัวต้านทานอย่างน้อย 350 Ω เลือกค่ามาตรฐาน 390 Ω แถบ ส้ม ขาว น้ำตาล ทอง"
  - { type: check, problem: physics.electricity.electronics-intro.p009, prompt: "ลองคำนวณตัวต้านทานสำหรับแหล่งจ่ายอื่น" }
  - type: figure
    title: วงจรไฟกลางคืนอัตโนมัติ
    src: night-light.svg
    alt: "แผนภาพวงจร แบตเตอรี่ 6 V อยู่ทางขวา ขั้วบวกด้านบน รางบนเป็นขั้วบวก รางล่างเป็นขั้วลบ ทางซ้ายมีตัวต้านทาน R1 10 kΩ จากรางบนลงมาที่จุดกลาง และตัวต้านทานไวแสง LDR จากจุดกลางลงไปรางล่าง จุดกลางต่อผ่านตัวต้านทาน R2 ไปที่ขาเบส B ของทรานซิสเตอร์ NPN ขาคอลเลกเตอร์ C ต่อผ่านแอลอีดีขึ้นไปรางบน แอลอีดีหัวลูกศรชี้ลง ขาอิมิตเตอร์ E ต่อลงรางล่าง ข้อความด้านล่าง: มืด LDR มีความต้านทานสูง แรงดันที่ขา B สูงขึ้น ทรานซิสเตอร์นำกระแส LED สว่าง"
    caption: "R₁ กับ LDR เป็นตัวแบ่งความต่างศักย์ ความมืดทำให้ขาเบสได้แรงดันสูงพอเปิดทรานซิสเตอร์"
  - type: worked-example
    title: ทรานซิสเตอร์เป็นสวิตช์ควบคุมกระแส
    problem: "ในวงจรไฟกลางคืน ทรานซิสเตอร์มี β = 200 แอลอีดีต้องการกระแส 15 mA ตอนมืดขาเบสต้องได้กระแสอย่างน้อยเท่าใด และตอนกลางวันเกิดอะไรขึ้น"
    steps:
      - text: "กระแสแอลอีดีคือกระแสคอลเลกเตอร์ $I_C = 15\\ \\mathrm{mA}$"
      - text: "$I_B = \\dfrac{I_C}{\\beta} = \\dfrac{15}{200} = 0.075\\ \\mathrm{mA}$"
        why: "$I_C \\approx \\beta I_B$ กระแสเบสจึงเล็กกว่ากระแสคอลเลกเตอร์ $\\beta$ เท่า"
      - text: "ตอนกลางวัน LDR ความต้านทานต่ำ ความต่างศักย์ที่จุดกลางต่ำ กระแสเบสแทบไม่มี ทรานซิสเตอร์ไม่นำกระแส แอลอีดีดับ"
    answer: "ตอนมืดต้องมีกระแสเบสอย่างน้อยราว 0.075 mA ตอนกลางวันทรานซิสเตอร์ปิด แอลอีดีดับ"
  - { type: check, problem: physics.electricity.electronics-intro.p007, prompt: "ไล่ทิศกระแสผ่านไดโอด" }
  - type: interactive
    title: ตัวต้านทานจำกัดกระแสของแอลอีดี
    caption: "แกนนอนคือความต้านทาน (kΩ) แกนตั้งคือกระแสผ่านแอลอีดี (mA) สำหรับแอลอีดีที่กินความต่างศักย์ 2 V เลื่อนค่าแหล่งจ่าย V แล้วหาว่าต้องใช้ความต้านทานเท่าใดกระแสจึงไม่เกิน 20 mA"
    widget:
      kind: function-plot
      functions: ["\\frac{V-2}{x}", "20"]
      sliders:
        - { name: V, min: 3, max: 12, step: 0.5, value: 9, label: แหล่งจ่าย (V) }
      x: [0.05, 1]
      y: [0, 60]
glossary:
  - { term: ตัวต้านทาน, definition: "ชิ้นส่วนที่จำกัดกระแสในวงจร ค่าความต้านทานอ่านจากแถบสี หน่วยโอห์ม" }
  - { term: ตัวต้านทานไวแสง, definition: "ตัวต้านทาน (LDR) ที่ความต้านทานลดลงเมื่อได้รับแสงมาก และสูงในที่มืด" }
  - { term: ไดโอด, definition: "ชิ้นส่วนที่ให้กระแสไหลได้ทางเดียว จากขาแอโนดไปขาแคโทด" }
  - { term: ไบอัสตรง, definition: "การต่อไดโอดให้ขาแอโนดอยู่ทางขั้วบวก กระแสไหลผ่านได้" }
  - { term: ตัวเก็บประจุ, definition: "ชิ้นส่วนที่อัดประจุไว้แล้วคายประจุออกได้ภายหลัง หน่วยความจุคือฟารัด" }
  - { term: ทรานซิสเตอร์, definition: "ชิ้นส่วนสามขา (B, C, E) ใช้กระแสเบสเล็ก ๆ ควบคุมกระแสคอลเลกเตอร์ที่ใหญ่กว่า ทำหน้าที่เป็นสวิตช์หรือขยายสัญญาณ" }
flashcards:
  - { front: "แถบสีแดง แดง น้ำตาล ทอง", back: "$22 \\times 10 = 220\\ \\Omega$ คลาดเคลื่อน $\\pm 5\\%$" }
  - { front: "ทำไมต้องต่อตัวต้านทานอนุกรมกับแอลอีดี", back: "เพื่อจำกัดกระแส ถ้าไม่มี กระแสสูงเกินจนแอลอีดีเสีย" }
  - { front: "ขาไหนของแอลอีดีต่อทางขั้วบวก", back: "ขายาว (แอโนด)" }
  - { front: "ทรานซิสเตอร์ทำหน้าที่อะไรได้บ้าง", back: "สวิตช์ และขยายสัญญาณ โดย $I_C \\approx \\beta I_B$" }
  - { front: "ตัวเก็บประจุต่อขนานกับแอลอีดี ปิดสวิตช์แล้วเป็นอย่างไร", back: "แอลอีดีค่อย ๆ หรี่แล้วดับ เพราะตัวเก็บประจุคายประจุ" }
