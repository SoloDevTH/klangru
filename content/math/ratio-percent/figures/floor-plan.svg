<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 235" width="350" height="235" font-family="sans-serif" font-size="16">
  <title>แบบแปลนห้องนอนและห้องน้ำ มาตราส่วน 1 : 100</title>
  
  <polygon points="50.0,40.0 210.0,40.0 210.0,180.0 50.0,180.0" fill="#f4f1e8" stroke="#15211e" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="210.0,40.0 290.0,40.0 290.0,100.0 210.0,100.0" fill="#dbe8f7" stroke="#15211e" stroke-width="3" stroke-linejoin="round"/>
  <text x="130.0" y="110.0" text-anchor="middle" dominant-baseline="middle" font-size="15">ห้องนอน</text>
  <text x="250.0" y="70.0" text-anchor="middle" dominant-baseline="middle" font-size="13">ห้องน้ำ</text>
  <line x1="50.0" y1="26.0" x2="210.0" y2="26.0" stroke="#0a6b60" stroke-width="1.5"/>
  <line x1="50.0" y1="20.0" x2="50.0" y2="32.0" stroke="#0a6b60" stroke-width="1.5"/>
  <line x1="210.0" y1="20.0" x2="210.0" y2="32.0" stroke="#0a6b60" stroke-width="1.5"/>
  <text x="130.0" y="14.0" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#0a6b60">4 cm</text>
  <line x1="36.0" y1="40.0" x2="36.0" y2="180.0" stroke="#0a6b60" stroke-width="1.5"/>
  <line x1="30.0" y1="40.0" x2="42.0" y2="40.0" stroke="#0a6b60" stroke-width="1.5"/>
  <line x1="30.0" y1="180.0" x2="42.0" y2="180.0" stroke="#0a6b60" stroke-width="1.5"/>
  <text x="24" y="110.0" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#0a6b60" transform="rotate(-90 24 110.0)">3.5 cm</text>
  <text x="292.0" y="210.0" text-anchor="end" dominant-baseline="middle" font-size="14">มาตราส่วน 1 : 100</text>
