<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="sans-serif" font-size="14">
<title>โมเมนต์ความเฉื่อยของวัตถุทรงต่าง ๆ</title>
<rect x="0" y="0" width="700" height="300" fill="#ffffff"/>
<circle cx="80.0" cy="120.0" r="45.0" fill="none" stroke="#15211e" stroke-width="6"/>
<circle cx="80.0" cy="120.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="2"/>
<text x="80.0" y="200.0" text-anchor="middle" fill="#15211e" font-size="14">ห่วงบาง</text>
<text x="80.0" y="222.0" text-anchor="middle" fill="#15211e" font-size="15" font-weight="bold">MR²</text>
<circle cx="215.0" cy="120.0" r="45.0" fill="#dce8f5" stroke="#15211e" stroke-width="2.5"/>
<circle cx="215.0" cy="120.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="2"/>
<text x="215.0" y="200.0" text-anchor="middle" fill="#15211e" font-size="14">จาน/ทรงกระบอกตัน</text>
<text x="215.0" y="222.0" text-anchor="middle" fill="#15211e" font-size="15" font-weight="bold">½MR²</text>
<defs><radialGradient id="g" cx="0.35" cy="0.35"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9dbbdc"/></radialGradient></defs>
<circle cx="350.0" cy="120.0" r="45.0" fill="url(#g)" stroke="#15211e" stroke-width="2.5"/>
<circle cx="350.0" cy="120.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="2"/>
<text x="350.0" y="200.0" text-anchor="middle" fill="#15211e" font-size="14">ทรงกลมตัน</text>
<text x="350.0" y="222.0" text-anchor="middle" fill="#15211e" font-size="15" font-weight="bold">⅖MR²</text>
<rect x="440.0" y="114.0" width="100.0" height="12.0" rx="0" fill="#dce8f5" stroke="#15211e" stroke-width="2"/>
<line x1="490.0" y1="80.0" x2="490.0" y2="160.0" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4"/>
<text x="490.0" y="200.0" text-anchor="middle" fill="#15211e" font-size="14">แท่ง แกนกึ่งกลาง</text>
<text x="490.0" y="222.0" text-anchor="middle" fill="#15211e" font-size="15" font-weight="bold">(1/12)ML²</text>
<rect x="580.0" y="114.0" width="100.0" height="12.0" rx="0" fill="#dce8f5" stroke="#15211e" stroke-width="2"/>
<line x1="580.0" y1="80.0" x2="580.0" y2="160.0" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4"/>
<text x="630.0" y="200.0" text-anchor="middle" fill="#15211e" font-size="14">แท่ง แกนที่ปลาย</text>
<text x="630.0" y="222.0" text-anchor="middle" fill="#15211e" font-size="15" font-weight="bold">⅓ML²</text>
<text x="350.0" y="275.0" text-anchor="middle" fill="#777" font-size="13">จุดแดง: แกนหมุนตั้งฉากกับหน้ากระดาษ  เส้นประแดง: แกนหมุนของแท่ง</text>
</svg>
