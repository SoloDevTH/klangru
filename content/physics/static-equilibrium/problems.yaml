problems:
  - id: physics.rotation.static-equilibrium.p001
    topics: [physics.rotation.static-equilibrium]
    difficulty: 1
    type: mcq
    stem: "วัตถุจะอยู่ในสมดุลกลเมื่อเป็นไปตามข้อใด"
    choices:
      - { id: a, text: "แรงลัพธ์เป็นศูนย์ และผลรวมโมเมนต์เป็นศูนย์", correct: true }
      - { id: b, text: "แรงลัพธ์เป็นศูนย์อย่างเดียว", feedback: "แรงคู่ควบมีแรงลัพธ์เป็นศูนย์ แต่ยังทำให้วัตถุหมุน ต้องมีโมเมนต์ลัพธ์เป็นศูนย์ด้วย" }
      - { id: c, text: "ไม่มีแรงใดกระทำต่อวัตถุเลย", feedback: "หนังสือบนโต๊ะมีน้ำหนักและแรงจากโต๊ะกระทำ แต่ก็อยู่ในสมดุลได้ เพราะแรงหักล้างกันพอดี" }
    hints:
      - "สมดุลกลต้องไม่เลื่อนที่และไม่หมุน"
      - "อะไรทำให้เลื่อนที่ และอะไรทำให้หมุน"
    solution: "สมดุลต่อการเลื่อนที่ต้องมี $\\sum \\vec F = 0$ และสมดุลต่อการหมุนต้องมี $\\sum M = 0$ ต้องเป็นจริงทั้งสองข้อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.rotation.static-equilibrium.p002
    topics: [physics.rotation.static-equilibrium]
    difficulty: 1
    type: match
    stem: "จับคู่คำกับความหมาย"
    pairs:
      - { left: "ศูนย์กลางมวล", right: "จุดที่ออกแรงผ่านแล้ววัตถุเลื่อนที่โดยไม่หมุน" }
      - { left: "ศูนย์ถ่วง", right: "จุดที่น้ำหนักทั้งหมดของวัตถุเสมือนกระทำ" }
      - { left: "แรงคู่ควบ", right: "แรงขนาดเท่ากัน ทิศตรงข้าม ไม่อยู่ในแนวเดียวกัน ทำให้หมุนอย่างเดียว" }
      - { left: "เสถียรภาพ", right: "ความสามารถที่จะตั้งกลับเมื่อถูกทำให้เอียงเล็กน้อย" }
    hints:
      - "คำที่มีคำว่า \"ถ่วง\" เกี่ยวกับน้ำหนัก"
      - "พวงมาลัยรถที่หมุนด้วยสองมือเป็นตัวอย่างของแรงอะไร"
    solution: "ศูนย์กลางมวลคือจุดที่แรงผ่านแล้วไม่หมุน ศูนย์ถ่วงคือจุดที่น้ำหนักกระทำ แรงคู่ควบทำให้หมุนอย่างเดียว และเสถียรภาพคือความสามารถในการตั้งกลับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.rotation.static-equilibrium.p003
    topics: [physics.rotation.static-equilibrium]
    difficulty: 2
    type: numeric
    stem: "แรง $30\\ \\mathrm{N}$ ทางทิศตะวันออก และแรง $40\\ \\mathrm{N}$ ทางทิศเหนือ กระทำต่อกล่องที่จุดเดียวกัน แรงลัพธ์มีขนาดกี่นิวตัน"
    answer: { value: 50, tolerance: 0.5, unit: N }
    misconceptions:
      - { match: 70, feedback: "บวกขนาดตรง ๆ ใช้ได้เฉพาะแรงที่ชี้ทิศเดียวกัน แรงที่ตั้งฉากกันต้องรวมแบบเวกเตอร์" }
      - { match: 10, feedback: "ลบกันใช้ได้เฉพาะแรงที่ชี้ทิศตรงข้ามกัน แรงในข้อนี้ตั้งฉากกัน" }
    hints:
      - "แรงทั้งสองทำมุมกันกี่องศา"
      - "แรงตั้งฉากกันใช้ $R = \\sqrt{F_1^2 + F_2^2}$"
    solution: "$R = \\sqrt{30^2 + 40^2} = \\sqrt{2500} = 50\\ \\mathrm{N}$ ทิศเฉียงไปทางตะวันออกเฉียงเหนือ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.rotation.static-equilibrium.p004
    topics: [physics.rotation.static-equilibrium]
    difficulty: 2
    type: mcq
    stem: "ไม้บรรทัดวางอยู่บนพื้นน้ำแข็งที่ลื่นมาก ถ้าผลักไม้บรรทัดในแนวที่ผ่านศูนย์กลางมวลพอดี ไม้บรรทัดจะเคลื่อนที่อย่างไร"
    choices:
      - { id: a, text: "เลื่อนไปตามแนวแรงโดยไม่หมุน", correct: true }
      - { id: b, text: "หมุนรอบศูนย์กลางมวลโดยไม่เลื่อนที่", feedback: "การหมุนอย่างเดียวเกิดจากแรงคู่ควบ แรงที่ผ่านศูนย์กลางมวลไม่มีโมเมนต์รอบศูนย์กลางมวล" }
      - { id: c, text: "ทั้งเลื่อนที่และหมุน", feedback: "เกิดเมื่อแนวแรงไม่ผ่านศูนย์กลางมวล เช่น ผลักที่ปลายไม้บรรทัด" }
    hints:
      - "แรงที่ผ่านศูนย์กลางมวลมีแขนของโมเมนต์รอบศูนย์กลางมวลเท่าใด"
      - "ไม่มีโมเมนต์ ไม่มีการหมุน"
    solution: "แรงที่ผ่านศูนย์กลางมวลมีแขนของโมเมนต์เป็นศูนย์ ไม่ทำให้หมุน ไม้บรรทัดจึงเลื่อนที่ไปตามแนวแรงอย่างเดียว ถ้าผลักที่ปลาย ไม้บรรทัดจะทั้งเลื่อนและหมุน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.rotation.static-equilibrium.p005
    topics: [physics.rotation.static-equilibrium]
    difficulty: 2
    type: mcq
    stem: "ตุ๊กตาล้มลุกที่ขายตามงานวัด ผลักให้เอียงเท่าใดก็ตั้งกลับได้เสมอ เหตุผลใดถูกต้องที่สุด"
    choices:
      - { id: a, text: "ฐานโค้งถ่วงน้ำหนักไว้ ศูนย์ถ่วงอยู่ต่ำมาก น้ำหนักจึงสร้างโมเมนต์ดึงกลับทุกครั้งที่เอียง", correct: true }
      - { id: b, text: "ตุ๊กตาเบามาก จึงไม่มีน้ำหนักที่จะทำให้ล้ม", feedback: "ตุ๊กตาเบาก็ล้มได้ สิ่งที่สำคัญคือตำแหน่งของศูนย์ถ่วงเทียบกับจุดที่แตะพื้น" }
      - { id: c, text: "ด้านบนของตุ๊กตาหนักกว่าด้านล่าง", feedback: "ถ้าด้านบนหนัก ศูนย์ถ่วงจะสูง ตุ๊กตาจะล้มง่ายขึ้น" }
    hints:
      - "ศูนย์ถ่วงอยู่สูงหรือต่ำจึงตั้งกลับได้ดี"
      - "เมื่อเอียง น้ำหนักที่กระทำที่ศูนย์ถ่วงสร้างโมเมนต์ทิศใดรอบจุดที่แตะพื้น"
    solution: "ฐานของตุ๊กตาถ่วงน้ำหนักไว้ ศูนย์ถ่วงจึงต่ำกว่าจุดศูนย์กลางความโค้งของฐาน เมื่อเอียง แนวดิ่งผ่านศูนย์ถ่วงยังตกด้านในของจุดที่แตะพื้น น้ำหนักจึงสร้างโมเมนต์ดึงตุ๊กตากลับมาตั้งตรง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.rotation.static-equilibrium.p006
    topics: [physics.rotation.static-equilibrium]
    difficulty: 3
    type: numeric
    stem: "แรง $30\\ \\mathrm{N}$ และ $40\\ \\mathrm{N}$ กระทำที่จุดเดียวกัน ทำมุม $60^\\circ$ ต่อกัน แรงลัพธ์มีขนาดกี่นิวตัน (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 60.8, tolerance: 0.3, unit: N }
    misconceptions:
      - { match: 70, feedback: "บวกขนาดตรง ๆ ได้เฉพาะแรงที่ทิศเดียวกัน แรงที่ทำมุมกันได้ผลรวมน้อยกว่าผลบวกขนาด" }
      - { match: 36.1, feedback: "ใช้ $-2F_1F_2\\cos\\theta$ ซึ่งเป็นสูตรของผลต่างเวกเตอร์ แรงลัพธ์ใช้เครื่องหมายบวก" }
    hints:
      - "$R^2 = F_1^2 + F_2^2 + 2F_1F_2\\cos\\theta$"
      - "$\\cos 60^\\circ = 0.5$"
    solution: "$R^2 = 900 + 1600 + 2(30)(40)(0.5) = 3700$ ได้ $R = \\sqrt{3700} \\approx 60.8\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.rotation.static-equilibrium.p007
    topics: [physics.rotation.static-equilibrium]
    difficulty: 3
    type: numeric
    stem: "โคมไฟหนัก $60\\ \\mathrm{N}$ แขวนด้วยเชือกสองเส้นยาวเท่ากัน แต่ละเส้นทำมุม $30^\\circ$ กับแนวราบ แรงตึงในเชือกแต่ละเส้นเป็นกี่นิวตัน"
    answer: { value: 60, tolerance: 0.6, unit: N }
    misconceptions:
      - { match: 30, feedback: "แบ่งน้ำหนักครึ่งหนึ่งตรง ๆ ใช้ได้เมื่อเชือกตั้งดิ่ง เชือกที่เอียงใช้เพียงองค์ประกอบแนวดิ่ง $T\\sin 30^\\circ$ รับน้ำหนัก แรงตึงจึงมากกว่า" }
      - { match: 34.6, feedback: "ใช้ $\\cos 30^\\circ$ แทน $\\sin 30^\\circ$ มุมวัดจากแนวราบ องค์ประกอบแนวดิ่งคือ $T\\sin 30^\\circ$" }
    hints:
      - "แยกแรงตึงเป็นองค์ประกอบแนวดิ่งและแนวราบ องค์ประกอบแนวราบหักล้างกันเอง"
      - "$2T\\sin 30^\\circ = 60$"
    solution: "แนวดิ่ง: $2T\\sin 30^\\circ = 60\\ \\mathrm{N}$ จึงได้ $2T(0.5) = 60$ และ $T = 60\\ \\mathrm{N}$ เท่ากับน้ำหนักโคมทั้งดวง เชือกที่เกือบราบต้องรับแรงตึงมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.rotation.static-equilibrium.p008
    topics: [physics.rotation.static-equilibrium]
    difficulty: 3
    type: numeric
    stem: "แผ่นไม้สม่ำเสมอยาว $4.0\\ \\mathrm{m}$ หนัก $200\\ \\mathrm{N}$ วางพาดบนเสาสองต้นที่ปลายทั้งสอง คนหนัก $600\\ \\mathrm{N}$ ยืนห่างปลายซ้าย $1.0\\ \\mathrm{m}$ เสาด้านซ้ายรับแรงกี่นิวตัน"
    answer: { value: 550, tolerance: 2, unit: N }
    misconceptions:
      - { match: 250, feedback: "นี่คือแรงที่เสาด้านขวารับ คนยืนใกล้ปลายซ้าย เสาซ้ายต้องรับแรงมากกว่า" }
      - { match: 400, feedback: "แบ่งน้ำหนักรวม $800\\ \\mathrm{N}$ ครึ่งหนึ่งให้แต่ละเสา ใช้ได้เฉพาะเมื่อน้ำหนักอยู่กึ่งกลาง" }
    hints:
      - "ใช้ปลายขวาเป็นจุดหมุน แรงของเสาขวาจะไม่มีโมเมนต์"
      - "น้ำหนักแผ่นไม้กระทำที่กึ่งกลาง ห่างปลายขวา $2.0\\ \\mathrm{m}$ คนห่างปลายขวา $3.0\\ \\mathrm{m}$"
    solution: "โมเมนต์รอบปลายขวา: $N_L(4.0) = 200(2.0) + 600(3.0) = 2200$ ได้ $N_L = 550\\ \\mathrm{N}$ ตรวจ: $N_R = 800 - 550 = 250\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.rotation.static-equilibrium.p009
    topics: [physics.rotation.static-equilibrium]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการแก้โจทย์หาแรงที่ไม่รู้ค่าของวัตถุที่อยู่ในสมดุลกล"
    items:
      - "เลือกวัตถุที่จะพิจารณา"
      - "เขียนแผนภาพวัตถุอิสระแสดงแรงทุกแรงที่กระทำต่อวัตถุ"
      - "เลือกจุดหมุนที่มีแรงไม่รู้ค่าผ่านมากที่สุด"
      - "เขียนสมการผลรวมโมเมนต์เป็นศูนย์ แล้วแก้หาแรงตัวแรก"
      - "ใช้ผลรวมแรงแนวราบและแนวดิ่งเป็นศูนย์หาแรงที่เหลือ"
    hints:
      - "ต้องรู้ก่อนว่ามีแรงอะไรบ้างจึงจะเลือกจุดหมุนได้"
      - "สมการโมเมนต์ช่วยตัดแรงที่ไม่รู้ค่าออกไปก่อน"
    solution: "เลือกวัตถุ → แผนภาพวัตถุอิสระ → เลือกจุดหมุน → $\\sum M = 0$ → $\\sum F_x = 0$ และ $\\sum F_y = 0$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.rotation.static-equilibrium.p010
    topics: [physics.rotation.static-equilibrium]
    difficulty: 4
    type: numeric
    stem: "โคมไฟหนัก $100\\ \\mathrm{N}$ แขวนที่ปมเชือก เชือกเส้นที่ 1 ทำมุม $30^\\circ$ กับแนวราบไปทางซ้าย เชือกเส้นที่ 2 ทำมุม $60^\\circ$ กับแนวราบไปทางขวา แรงตึงในเชือกเส้นที่ 2 เป็นกี่นิวตัน (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 86.6, tolerance: 0.5, unit: N }
    misconceptions:
      - { match: 50, feedback: "นี่คือแรงตึงในเชือกเส้นที่ 1 เชือกที่ชันกว่ารับน้ำหนักมากกว่า" }
      - { match: 100, feedback: "เชือกเส้นที่ 2 ไม่ได้รับน้ำหนักทั้งหมด เพราะเชือกเส้นที่ 1 ช่วยรับด้วย" }
    hints:
      - "มุมระหว่างเชือกทั้งสองเท่ากับ $180^\\circ - 30^\\circ - 60^\\circ = 90^\\circ$ มุมระหว่างเชือกเส้นที่ 1 กับน้ำหนักเท่ากับ $90^\\circ + 30^\\circ$"
      - "ทฤษฎีของลามี $\\dfrac{T_2}{\\sin(\\text{มุมระหว่าง } T_1 \\text{ กับ } W)} = \\dfrac{W}{\\sin(\\text{มุมระหว่าง } T_1 \\text{ กับ } T_2)}$"
    solution: "มุมระหว่าง $T_1$ กับ $W$ คือ $120^\\circ$ มุมระหว่าง $T_1$ กับ $T_2$ คือ $90^\\circ$ ดังนั้น $T_2 = \\dfrac{W\\sin 120^\\circ}{\\sin 90^\\circ} = 100(0.866) = 86.6\\ \\mathrm{N}$ (ตรวจด้วยองค์ประกอบ: $T_1\\cos 30^\\circ = T_2\\cos 60^\\circ$ และ $T_1\\sin 30^\\circ + T_2\\sin 60^\\circ = 100$ ได้ $T_1 = 50\\ \\mathrm{N}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.rotation.static-equilibrium.p011
    topics: [physics.rotation.static-equilibrium]
    difficulty: 4
    type: numeric
    stem: "บันไดสม่ำเสมอยาว $5.0\\ \\mathrm{m}$ หนัก $240\\ \\mathrm{N}$ พิงผนังลื่น ปลายล่างห่างผนัง $1.4\\ \\mathrm{m}$ (ปลายบนสูง $4.8\\ \\mathrm{m}$) แรงเสียดทานที่พื้นกระทำต่อบันไดเป็นกี่นิวตัน"
    answer: { value: 35, tolerance: 0.4, unit: N }
    misconceptions:
      - { match: 70, feedback: "ใช้แขนของน้ำหนักเป็น $1.4\\ \\mathrm{m}$ แต่น้ำหนักกระทำที่กึ่งกลางบันได แขนจึงเป็นครึ่งหนึ่งของระยะแนวราบ" }
      - { match: 33.6, feedback: "ใช้ความยาวบันไดเป็นแขนของแรงจากผนัง แรงจากผนังอยู่ในแนวราบ แขนของมันคือความสูงแนวดิ่ง $4.8\\ \\mathrm{m}$" }
    hints:
      - "ผนังลื่นให้แรงในแนวราบเท่านั้น และแรงเสียดทานที่พื้นต้องเท่ากับแรงนี้"
      - "ใช้ปลายล่างเป็นจุดหมุน: แรงจากผนัง × $4.8$ = น้ำหนัก × $0.7$"
    solution: "รอบปลายล่าง: $N_1(4.8) = 240(0.7)$ ได้ $N_1 = 35\\ \\mathrm{N}$ แนวราบ: $f = N_1 = 35\\ \\mathrm{N}$ บันไดตั้งชัน แรงเสียดทานที่ต้องการจึงน้อย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.rotation.static-equilibrium.p012
    topics: [physics.rotation.static-equilibrium]
    difficulty: 4
    type: numeric
    stem: "ตู้เสื้อผ้าสม่ำเสมอกว้าง $0.60\\ \\mathrm{m}$ สูง $1.80\\ \\mathrm{m}$ ศูนย์ถ่วงอยู่กลางตู้ ถ้าค่อย ๆ เอียงตู้รอบขอบล่างด้านหนึ่ง เมื่อเอียงจากแนวดิ่งเกินกี่องศาตู้จะล้มเอง (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 18.4, tolerance: 0.2, unit: องศา }
    misconceptions:
      - { match: 33.7, feedback: "ใช้ความกว้างทั้งหมด $0.60\\ \\mathrm{m}$ แต่ศูนย์ถ่วงอยู่ห่างขอบเพียงครึ่งหนึ่งของความกว้าง" }
      - { match: 71.6, feedback: "ได้มุมกับแนวราบ ตู้จะล้มเมื่อเอียงจากแนวดิ่งเพียงเท่าที่แนวดิ่งผ่านศูนย์ถ่วงถึงขอบ" }
    hints:
      - "ตู้เริ่มล้มเมื่อศูนย์ถ่วงอยู่เหนือขอบที่เป็นจุดหมุนพอดี"
      - "ศูนย์ถ่วงห่างขอบตามแนวราบ $0.30\\ \\mathrm{m}$ สูง $0.90\\ \\mathrm{m}$ ใช้ $\\tan\\theta = \\dfrac{0.30}{0.90}$"
    solution: "ที่จุดล้ม แนวดิ่งผ่านศูนย์ถ่วงผ่านขอบล่างพอดี $\\tan\\theta = \\dfrac{0.30}{0.90} = 0.333$ ได้ $\\theta \\approx 18.4^\\circ$ ตู้ทรงสูงล้มง่าย จึงควรยึดตู้ไว้กับผนัง"
