problems:
  - id: biology.plants.plant-structure.p001
    topics: [biology.plants.plant-structure]
    difficulty: 1
    type: match
    stem: "จับคู่เนื้อเยื่อพืชกับหน้าที่หลัก"
    pairs:
      - { left: "ไซเลม", right: "ลำเลียงน้ำและธาตุอาหารจากรากขึ้นไป" }
      - { left: "โฟลเอ็ม", right: "ลำเลียงอาหารจากใบไปส่วนต่าง ๆ" }
      - { left: "เอพิเดอร์มิส", right: "ห่อหุ้มป้องกันส่วนด้านนอก" }
      - { left: "เนื้อเยื่อเจริญปลายราก", right: "แบ่งเซลล์ทำให้รากยืดยาว" }
      - { left: "สเกลอเรงคิมา", right: "ค้ำจุนให้ความแข็งแรง ผนังหนามีลิกนิน" }
    hints:
      - "ไซเลมกับโฟลเอ็มเป็นเนื้อเยื่อลำเลียงทั้งคู่ แต่ลำเลียงคนละสาร"
      - "เนื้อเยื่อเจริญเป็นเนื้อเยื่อเดียวที่ยังแบ่งเซลล์"
    solution: "ไซเลม → น้ำ, โฟลเอ็ม → อาหาร, เอพิเดอร์มิส → ห่อหุ้ม, เนื้อเยื่อเจริญปลายราก → ยืดยาว, สเกลอเรงคิมา → ค้ำจุน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-structure.p002
    topics: [biology.plants.plant-structure]
    difficulty: 1
    type: mcq
    stem: "เนื้อเยื่อพืชชนิดใดที่เซลล์ยังแบ่งตัวได้ตลอด ทำให้พืชเติบโต"
    choices:
      - { id: a, text: "เนื้อเยื่อเจริญ", correct: true }
      - { id: b, text: "พาเรงคิมา", feedback: "พาเรงคิมาเป็นเนื้อเยื่อถาวรที่สะสมอาหาร แม้จะมีชีวิตแต่ปกติไม่ได้แบ่งเซลล์ตลอด" }
      - { id: c, text: "ไซเลม", feedback: "เซลล์ลำเลียงของไซเลมตายแล้วเมื่อทำหน้าที่ จึงแบ่งเซลล์ไม่ได้" }
      - { id: d, text: "เอพิเดอร์มิส", feedback: "เอพิเดอร์มิสเป็นเนื้อเยื่อถาวรที่ห่อหุ้ม ไม่ได้ทำหน้าที่แบ่งเซลล์ให้พืชเติบโต" }
    hints:
      - "เนื้อเยื่อพืชแบ่งเป็นสองกลุ่มใหญ่ คือกลุ่มที่แบ่งเซลล์ได้และกลุ่มที่ไม่แบ่ง"
      - "พบที่ปลายยอด ปลายราก และแคมเบียม"
    solution: "เนื้อเยื่อเจริญมีเซลล์ขนาดเล็ก ผนังบาง นิวเคลียสใหญ่ แบ่งเซลล์ได้ตลอด พบที่ปลายยอด ปลายราก ด้านข้าง และเหนือข้อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-structure.p003
    topics: [biology.plants.plant-structure]
    difficulty: 2
    type: text
    stem: "เซลล์ที่อยู่เป็นคู่ล้อมรอบปากใบ และเปลี่ยนรูปร่างเพื่อเปิดปิดปากใบ เรียกว่าเซลล์อะไร"
    accepted: ["เซลล์คุม", "คุม", "guard cell", "guard cells"]
    hints:
      - "เป็นเซลล์ในเนื้อเยื่อเอพิเดอร์มิสที่เปลี่ยนแปลงไป"
      - "ต่างจากเซลล์ผิวใบอื่นตรงที่มีคลอโรพลาสต์"
    misconceptions:
      - { match: "เซลล์ขนราก", feedback: "เซลล์ขนรากอยู่ที่ราก ทำหน้าที่ดูดน้ำ ไม่ได้ล้อมปากใบ" }
      - { match: "แพลิเซด", feedback: "แพลิเซดมีโซฟิลล์อยู่ใต้เอพิเดอร์มิสด้านบน ทำหน้าที่สังเคราะห์ด้วยแสง ไม่ได้เปิดปิดปากใบ" }
    solution: "เซลล์คุม เป็นเซลล์เอพิเดอร์มิสที่เปลี่ยนแปลงไป อยู่เป็นคู่ ควบคุมการเปิดปิดของปากใบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-structure.p004
    topics: [biology.plants.plant-structure]
    difficulty: 2
    type: mcq
    stem: "ตัดลำต้นข้าวโพดตามขวางแล้วส่องกล้องจุลทรรศน์ จะพบมัดท่อลำเลียงเรียงตัวแบบใด"
    choices:
      - { id: a, text: "กระจายทั่วเนื้อเยื่อพื้น", correct: true }
      - { id: b, text: "เรียงเป็นวงเดียว มีพิธอยู่ตรงกลาง", feedback: "การเรียงเป็นวงพบในลำต้นพืชใบเลี้ยงคู่ ข้าวโพดเป็นพืชใบเลี้ยงเดี่ยว" }
      - { id: c, text: "ไซเลมเป็นแฉกอยู่ตรงกลาง", feedback: "ไซเลมรูปแฉกพบในรากพืชใบเลี้ยงคู่ ไม่ใช่ลำต้นข้าวโพด" }
      - { id: d, text: "เรียงเป็นวงปีหลายวง", feedback: "วงปีเกิดจากวาสคิวลาร์แคมเบียมของพืชใบเลี้ยงคู่ ข้าวโพดไม่มีแคมเบียม" }
    hints:
      - "ข้าวโพดเป็นพืชใบเลี้ยงเดี่ยวหรือใบเลี้ยงคู่"
      - "ลำต้นใบเลี้ยงเดี่ยวแยกคอร์เทกซ์กับพิธไม่ชัดเพราะอะไร"
    solution: "ข้าวโพดเป็นพืชใบเลี้ยงเดี่ยว มัดท่อลำเลียงกระจายทั่วเนื้อเยื่อพื้น จึงแยกคอร์เทกซ์กับพิธไม่ได้ และไม่มีวาสคิวลาร์แคมเบียม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-structure.p005
    topics: [biology.plants.plant-structure]
    difficulty: 2
    type: order
    stem: "เรียงชั้นในภาคตัดขวางของใบพืชใบเลี้ยงคู่ จากผิวด้านบนลงไปผิวด้านล่าง"
    items:
      - "คิวทิเคิล"
      - "เอพิเดอร์มิสด้านบน"
      - "แพลิเซดมีโซฟิลล์"
      - "สปองจีมีโซฟิลล์"
      - "เอพิเดอร์มิสด้านล่างที่มีปากใบ"
    hints:
      - "ชั้นที่เคลือบกันน้ำระเหยอยู่นอกสุด"
      - "เซลล์ที่มีคลอโรพลาสต์มากที่สุดอยู่ใกล้แสงมากกว่าเซลล์ที่มีช่องอากาศ"
    solution: "คิวทิเคิล → เอพิเดอร์มิสด้านบน → แพลิเซดมีโซฟิลล์ → สปองจีมีโซฟิลล์ → เอพิเดอร์มิสด้านล่าง (ปากใบส่วนใหญ่อยู่ด้านล่าง)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-structure.p006
    topics: [biology.plants.plant-structure]
    difficulty: 2
    type: mcq
    stem: "ลำต้นของต้นมะม่วงขยายขนาดออกด้านข้างทุกปีเพราะเนื้อเยื่อใด"
    choices:
      - { id: a, text: "วาสคิวลาร์แคมเบียม ซึ่งสร้างไซเลมด้านในและโฟลเอ็มด้านนอกเพิ่ม", correct: true }
      - { id: b, text: "เนื้อเยื่อเจริญปลายยอด", feedback: "เนื้อเยื่อเจริญปลายยอดทำให้ลำต้นยืดยาว ไม่ได้ทำให้ลำต้นอ้วนขึ้น" }
      - { id: c, text: "เอพิเดอร์มิส", feedback: "เอพิเดอร์มิสเป็นเนื้อเยื่อถาวรที่ห่อหุ้ม ไม่ได้แบ่งเซลล์เพิ่มขนาด" }
      - { id: d, text: "พิธ", feedback: "พิธเป็นพาเรงคิมากลางลำต้น ไม่ได้ทำให้ลำต้นขยายขนาด" }
    hints:
      - "การเพิ่มขนาดด้านข้างคือการเติบโตทุติยภูมิ"
      - "เนื้อเยื่อเจริญด้านข้างที่อยู่ระหว่างไซเลมกับโฟลเอ็มชื่ออะไร"
    solution: "วาสคิวลาร์แคมเบียมเป็นเนื้อเยื่อเจริญด้านข้าง แบ่งเซลล์สร้างไซเลมด้านในและโฟลเอ็มด้านนอก ลำต้นพืชใบเลี้ยงคู่จึงขยายขนาดและเกิดวงปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-structure.p007
    topics: [biology.plants.plant-structure]
    difficulty: 3
    type: numeric
    stem: "ภาพเป็นภาคตัดขวางของตอไม้สักที่ถูกตัดในสวนป่า ต้นสักนี้มีอายุประมาณกี่ปี (นับวงปีที่เห็นในภาพ)"
    figure: { src: tree-rings.svg, alt: "ภาคตัดขวางของลำต้นที่มีเปลือกสีน้ำตาลเข้มด้านนอก เนื้อไม้ด้านในมีแถบสีจางกว้างสลับกับแถบสีเข้มแคบ เรียงเป็นวงซ้อนกันรอบจุดกลาง นับแถบสีเข้มได้ 7 วง และแถบสีจางกว้าง 7 วง" }
    answer: { value: 7, unit: ปี }
    hints:
      - "เนื้อไม้ช่วงฝนสีจาง ช่วงแล้งสีเข้ม"
      - "แถบสีจางหนึ่งแถบกับแถบสีเข้มหนึ่งแถบรวมกันเป็น 1 ปี จึงนับเฉพาะแถบสีเข้ม"
    misconceptions:
      - { match: 14, feedback: "นับแถบสีจางและสีเข้มแยกกัน แต่ทั้งสองแถบเกิดในปีเดียวกัน คู่หนึ่งจึงนับเป็น 1 ปี" }
    solution: "มีแถบสีเข้ม 7 วง แต่ละวงคู่กับแถบสีจาง 1 แถบ เป็นวงปี 7 วง ต้นสักจึงมีอายุประมาณ 7 ปี (วงปีชัดในต้นสักเพราะประเทศไทยมีฤดูฝนและฤดูแล้ง)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-structure.p008
    topics: [biology.plants.plant-structure]
    difficulty: 3
    type: mcq
    stem: "ผนังเซลล์เอนโดเดอร์มิสในรากมีแถบแคสพาเรียนที่น้ำซึมผ่านไม่ได้ แถบนี้มีประโยชน์อย่างไร"
    choices:
      - { id: a, text: "บังคับให้น้ำและแร่ธาตุผ่านเยื่อหุ้มเซลล์ก่อนเข้าไซเลม พืชจึงคัดเลือกสารได้", correct: true }
      - { id: b, text: "ทำให้น้ำเข้ารากเร็วขึ้นโดยไม่ต้องผ่านเซลล์", feedback: "แถบแคสพาเรียนกั้นทางผ่านช่องระหว่างเซลล์ ไม่ได้ทำให้น้ำผ่านง่ายขึ้น" }
      - { id: c, text: "ช่วยสังเคราะห์ด้วยแสงในราก", feedback: "รากไม่ได้รับแสง และแถบแคสพาเรียนไม่เกี่ยวกับการสังเคราะห์ด้วยแสง" }
      - { id: d, text: "ทำให้รากยืดยาว", feedback: "การยืดยาวเกิดจากเนื้อเยื่อเจริญปลายราก" }
    hints:
      - "น้ำเคลื่อนผ่านรากได้สองทาง ผ่านช่องระหว่างเซลล์ และผ่านเข้าไปในเซลล์"
      - "ถ้าทางระหว่างเซลล์ถูกปิด น้ำต้องผ่านอะไรก่อน"
    solution: "แถบแคสพาเรียนกั้นทางระหว่างเซลล์ น้ำและแร่ธาตุจึงต้องผ่านเยื่อหุ้มเซลล์ของเอนโดเดอร์มิสก่อนเข้าสตีล ทำให้พืชควบคุมชนิดของสารที่เข้าไซเลมได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-structure.p009
    topics: [biology.plants.plant-structure]
    difficulty: 3
    type: mcq
    stem: "ภาคตัดขวางของรากชนิดหนึ่งมีไซเลมเรียงเป็นวงสลับกับโฟลเอ็มประมาณ 20 กลุ่ม และมีพิธขนาดใหญ่ตรงกลาง รากนี้น่าจะเป็นของพืชใด"
    choices:
      - { id: a, text: "ข้าว (พืชใบเลี้ยงเดี่ยว)", correct: true }
      - { id: b, text: "ถั่วเขียว (พืชใบเลี้ยงคู่)", feedback: "รากพืชใบเลี้ยงคู่มีไซเลมเป็นแฉก 3–5 แฉกตรงกลาง และไม่มีพิธหรือมีน้อย" }
      - { id: c, text: "เป็นลำต้น ไม่ใช่ราก", feedback: "โจทย์บอกว่าเป็นราก และไซเลมที่เรียงสลับกับโฟลเอ็มเป็นลักษณะของราก ในลำต้นไซเลมกับโฟลเอ็มอยู่ด้วยกันเป็นมัด" }
      - { id: d, text: "มะม่วง (พืชใบเลี้ยงคู่)", feedback: "มะม่วงเป็นพืชใบเลี้ยงคู่ รากมีไซเลมเป็นแฉกและมีการเติบโตทุติยภูมิ" }
    hints:
      - "เทียบจำนวนกลุ่มของไซเลมและการมีพิธ"
      - "รากใบเลี้ยงคู่มีแฉกไซเลมน้อย ไม่มีพิธ"
    solution: "ไซเลมจำนวนมากเรียงสลับกับโฟลเอ็มเป็นวงและมีพิธตรงกลาง เป็นลักษณะของรากพืชใบเลี้ยงเดี่ยว เช่น ข้าว ข้าวโพด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-structure.p010
    topics: [biology.plants.plant-structure]
    difficulty: 3
    type: match
    stem: "จับคู่เซลล์ในเนื้อเยื่อลำเลียงกับลักษณะ"
    pairs:
      - { left: "เวสเซลเมมเบอร์", right: "เซลล์ไซเลมที่ตายแล้ว ต่อกันเป็นท่อกว้าง ปลายทะลุถึงกัน" }
      - { left: "เทรคีด", right: "เซลล์ไซเลมที่ตายแล้ว ยาว ปลายแหลม น้ำผ่านทางรูข้างผนัง" }
      - { left: "ซีฟทิวบ์เมมเบอร์", right: "เซลล์โฟลเอ็มที่มีชีวิตแต่ไม่มีนิวเคลียส ปลายเป็นแผ่นตะแกรง" }
      - { left: "เซลล์คอมพาเนียน", right: "เซลล์ที่อยู่ข้างซีฟทิวบ์ มีนิวเคลียส ช่วยควบคุมการลำเลียงอาหาร" }
    hints:
      - "เซลล์ลำเลียงน้ำตายแล้ว ส่วนเซลล์ลำเลียงอาหารยังมีชีวิต"
      - "ซีฟ (sieve) แปลว่าตะแกรง"
    solution: "เวสเซลเมมเบอร์และเทรคีดเป็นเซลล์ไซเลมที่ตายแล้ว ซีฟทิวบ์เมมเบอร์เป็นเซลล์โฟลเอ็มที่ไม่มีนิวเคลียสและมีแผ่นตะแกรง เซลล์คอมพาเนียนช่วยควบคุมซีฟทิวบ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-structure.p011
    topics: [biology.plants.plant-structure]
    difficulty: 3
    type: mcq
    stem: "ทำไมแพลิเซดมีโซฟิลล์จึงอยู่ใต้เอพิเดอร์มิสด้านบน และมีคลอโรพลาสต์มากกว่าสปองจีมีโซฟิลล์"
    choices:
      - { id: a, text: "ด้านบนของใบได้รับแสงมากที่สุด เซลล์ที่สังเคราะห์ด้วยแสงมากจึงอยู่ใกล้แสง", correct: true }
      - { id: b, text: "เพื่อให้น้ำระเหยออกจากใบได้ง่าย", feedback: "การคายน้ำเกิดทางปากใบซึ่งส่วนใหญ่อยู่ด้านล่าง แพลิเซดไม่ได้อยู่ด้านบนเพื่อคายน้ำ" }
      - { id: c, text: "เพื่อลำเลียงอาหารลงสู่ราก", feedback: "การลำเลียงอาหารเป็นหน้าที่ของโฟลเอ็มในเส้นใบ" }
      - { id: d, text: "เพราะเอพิเดอร์มิสด้านบนมีคลอโรพลาสต์มาก", feedback: "เอพิเดอร์มิสด้านบนใสและไม่มีคลอโรพลาสต์ แสงจึงผ่านลงไปถึงแพลิเซดได้" }
    hints:
      - "คลอโรพลาสต์ใช้อะไรในการสร้างอาหาร"
      - "แสงส่องมาที่ใบจากด้านใด"
    solution: "แสงส่องลงที่ด้านบนของใบ เอพิเดอร์มิสด้านบนใส แสงจึงผ่านถึงแพลิเซดที่เรียงชิดและมีคลอโรพลาสต์มาก ได้สังเคราะห์ด้วยแสงมากที่สุด"
