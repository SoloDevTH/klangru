id: engineering.industrial.work-study-ergonomics
subject: engineering
title: { th: การศึกษางานและการยศาสตร์, en: Work study and ergonomics }
summary: ศึกษาวิธีทำงานและเวลาเพื่อกำหนดเวลามาตรฐาน จัดสมดุลสายการผลิต และออกแบบงานยกกับสถานีงานด้วยหลักการยศาสตร์ พร้อมคำนวณดัชนีการยกและระดับเสียงที่ยอมรับได้
difficulty: 5.5
minutes: 40
prerequisites: [management.operations.lean, math.stats.central-tendency]
encompasses:
  - { id: management.operations.lean, weight: 0.2 }
  - { id: math.stats.central-tendency, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - { type: check, problem: engineering.industrial.work-study-ergonomics.p003, prompt: "ลองคิดก่อนอ่านต่อ: การเปลี่ยนวิธีทำงานต่างจากการจับเวลาอย่างไร" }
  - type: figure
    title: แผนภูมิกระบวนการ
    src: process-chart.svg
    alt: "แผนภูมิกระบวนการแปดขั้นของการบรรจุน้ำพริกแกง เรียงจากบนลงล่าง มีสามเหลี่ยมคว่ำเป็นการเก็บ ลูกศรเป็นการเคลื่อนย้าย วงกลมสีน้ำเงินเป็นการปฏิบัติงาน สี่เหลี่ยมสีเขียวเป็นการตรวจสอบ และ D ในกรอบสีแดงเป็นการรอ"
    caption: "สัญลักษณ์มาตรฐานช่วยเห็นว่าขั้นใดเป็นการรอ การเก็บ หรือการเคลื่อนย้ายที่ซ้ำกัน"
  - type: worked-example
    title: จากเวลาที่จับได้สู่เวลามาตรฐาน
    problem: "จับเวลาเฉลี่ยของงานหนึ่งได้ 20.0 วินาที ผู้จับเวลาประเมินอัตราการทำงาน 90% และค่าเผื่อ 12% เวลามาตรฐานของงานนี้เป็นกี่วินาที"
    steps:
      - text: "เวลาปกติ $= 20.0 \\times 0.90 = 18.0$ วินาที"
        why: "อัตรา 90% แปลว่าผู้ปฏิบัติงานช้ากว่าปกติ เวลาที่จับได้จึงยาวกว่าที่คนทำงานด้วยอัตราปกติจะใช้ เวลาปกติจึงสั้นลง"
      - text: "เวลามาตรฐาน $= 18.0 \\times (1 + 0.12) = 18.0 \\times 1.12 = 20.16$ วินาที"
        why: "ค่าเผื่อคิดจากเวลาปกติ ไม่ใช่จากเวลาที่จับได้"
    answer: "เวลามาตรฐานประมาณ 20.16 วินาทีต่อรอบ ใช้วางแผนกำลังคนและค่าจ้างต่อชิ้นได้"
  - { type: check, problem: engineering.industrial.work-study-ergonomics.p010, prompt: "หาสถานีที่ช้าที่สุดก่อน แล้วค่อยคำนวณประสิทธิภาพ" }
  - type: worked-example
    title: ยกถังน้ำดื่มด้วยสมการ NIOSH แบบย่อ
    problem: "พนักงานยกวัตถุจากพื้น (V = 30 ซม.) ไปชั้นวางสูงขึ้น 70 ซม. มือจับห่างลำตัว 40 ซม. ไม่บิดตัว ยกหนัก 15 กิโลกรัม งานนี้เกินค่าแนะนำหรือไม่"
    steps:
      - text: "ตัวคูณแนวนอน $HM = \\frac{25}{40} = 0.625$"
        why: "ยิ่งมือจับไกลลำตัว ค่าที่ยอมให้ยิ่งลดลง"
      - text: "ตัวคูณแนวดิ่ง $VM = 1 - 0.003 \\times |30 - 75| = 0.865$"
        why: "จุดเริ่มยกที่ห่างจากระดับ 75 ซม. ทำให้ค่าที่ยอมให้ลดลง"
      - text: "ตัวคูณระยะยก $DM = 0.82 + \\frac{4.5}{70} \\approx 0.884$ และตัวคูณการบิด $AM = 1$"
      - text: "$\\mathrm{RWL} = 23 \\times 0.625 \\times 0.865 \\times 0.884 \\approx 11.0$ กิโลกรัม แล้ว $\\mathrm{LI} = \\frac{15}{11.0} \\approx 1.36$"
        why: "LI มากกว่า 1 หมายถึงหนักเกินค่าแนะนำ ควรลดน้ำหนักต่อครั้งหรือใช้อุปกรณ์ช่วยยก"
    answer: "งานนี้เกินค่าแนะนำ (LI ประมาณ 1.36) ควรปรับงานก่อนให้พนักงานยกเอง"
  - type: figure
    title: จัดสมดุลสายด้วยแผนภูมิแท่ง
    src: line-balance.svg
    alt: "แผนภูมิแท่งสามแท่งแสดงสามสถานีของสายประกอบ สถานีที่หนึ่งมีงาน A และ D รวมกัน 65 วินาที สถานีที่สองมีงาน B และ E รวมกัน 65 วินาที สถานีที่สามมีงาน C 50 วินาทีและมีช่องว่าง 20 วินาที เส้นประสีแดงที่ระดับ 70 วินาทีคือรอบเวลา"
    caption: "รอบเวลาถูกกำหนดโดยสถานีที่ช้าที่สุด งานที่ย้ายจากสถานีอื่นมาเติมช่องว่างได้ช่วยลดเวลาว่าง"
  - { type: check, problem: engineering.industrial.work-study-ergonomics.p013, prompt: "ดัชนี LI บอกอะไรเกี่ยวกับงานยกนี้" }
glossary:
  - { term: การศึกษาวิธีการทำงาน, definition: "การวิเคราะห์ว่างานควรทำด้วยวิธีใด เพื่อลดการเคลื่อนไหวและความสูญเปล่า (method study)" }
  - { term: อัตราการทำงาน (rating), definition: "การประเมินว่าผู้ปฏิบัติงานทำเร็วหรือช้ากว่าอัตราปกติ เป็นเปอร์เซ็นต์ (performance rating)" }
  - { term: เวลาปกติ, definition: "เวลาที่จับได้คูณด้วยอัตราการทำงาน แสดงเวลาที่คนทำงานปกติจะใช้" }
  - { term: ค่าเผื่อ, definition: "เวลาที่เผื่อไว้สำหรับความเมื่อยล้า ความล่าช้าที่ไม่ตั้งใจ และงานจำเป็นอื่น (allowance)" }
  - { term: การจัดสมดุลสายการผลิต, definition: "การจัดงานเข้าสถานีให้เวลาใกล้กันเพื่อให้รอบเวลาสม่ำเสมอและเวลาว่างน้อย (line balancing)" }
  - { term: ดัชนีการยก (LI), definition: "อัตราส่วนน้ำหนักจริงต่อน้ำหนักแนะนำสูงสุด (RWL) ค่ามากกว่า 1 หมายถึงงานหนักเกินค่าแนะนำ" }
  - { term: การยศาสตร์, definition: "การออกแบบงานและสิ่งแวดล้อมให้เข้ากับร่างกายและความสามารถของคน (ergonomics)" }
flashcards:
  - { front: "เวลามาตรฐานคำนวณอย่างไร", back: "เวลาปกติ × (1 + ค่าเผื่อ) โดยเวลาปกติ = เวลาที่จับได้ × rating" }
  - { front: "rating 110% หมายความว่าอย่างไร", back: "ผู้ปฏิบัติงานทำเร็วกว่าอัตราปกติ 10% จึงต้องคูณเวลาที่จับได้ด้วย 1.10" }
  - { front: "ประสิทธิภาพของสายการผลิต", back: "ผลรวมเวลางาน ÷ (จำนวนสถานี × รอบเวลา) × 100" }
  - { front: "ดัชนีการยก LI > 1 หมายความว่าอย่างไร", back: "งานหนักเกินค่าแนะนำ ต้องลดน้ำหนักต่อครั้งหรือปรับวิธียก" }
  - { front: "มาตรการควบคุมความเสี่ยงที่ควรเลือกเป็นอันดับแรก", back: "ควบคุมที่แหล่งกำเนิด เช่น ลดน้ำหนักหรือใช้อุปกรณ์ช่วย ก่อนการพึ่งพาพฤติกรรมของคน" }
