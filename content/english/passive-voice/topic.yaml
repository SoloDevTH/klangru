id: english.grammar.passive-voice
subject: english
title: { th: "Passive voice", en: "Passive voice" }
summary: is/are + V3 และ was/were + V3 เปลี่ยน active เป็น passive ใช้ by บอกผู้กระทำ อ่านป้าย คำแนะนำ และฉลากยาที่เขียนแบบ passive แล้วทำตาม
difficulty: 4.5
minutes: 40
prerequisites: [english.grammar.past-simple, english.grammar.present-perfect]
encompasses:
  - { id: english.grammar.past-simple, weight: 0.3 }
  - { id: english.grammar.present-perfect, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: active-passive.svg
    alt: "แผนภาพเปลี่ยน active เป็น passive แถวบน active: กล่อง Workers, clean, the classroom, every day. แถวล่าง passive: กล่อง The classroom, is cleaned, every day, (by workers). ลูกศรสีส้มจาก the classroom ไป The classroom เขียนว่า กรรม → ประธาน ลูกศรสีน้ำเงินจาก clean ไป is cleaned เขียนว่า be + V3 ลูกศรสีเทาจาก Workers ไป (by workers). เขียนว่า ผู้กระทำ → by ... (ตัดได้) ด้านล่างเขียนว่า is / are + V3 (ปัจจุบัน) · was / were + V3 (อดีต) · must / should + be + V3"
    caption: "กรรมของ active กลายเป็นประธานของ passive"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.grammar.passive-voice.p002, prompt: "passive ใช้กริยาช่องไหน" }
  - type: figure
    src: notice-label.svg
    alt: "ภาพสองส่วน ซ้ายเป็นป้าย CITY MUSEUM Visitor Information: Tickets: 80 baht. / Children under 12 are admitted free. / Bags must be left at the counter. / Tickets are checked at the gate. / Photography is not allowed in Room 3. / The museum is closed on Mondays. ขวาเป็นฉลากยา COUGH SYRUP X (60 ml) เขียนว่า ยาสมมุติ ไม่ใช่ยาจริง: This medicine should be taken three times a day after meals. Adults: 10 ml each time. Children 6–12 years: 5 ml each time. Must not be given to children under 6 years old. Must be kept below 30 °C. Ask a pharmacist if you are not sure."
    caption: "ป้ายและฉลากยา (สมมุติ) ที่ใช้ passive ใช้ในตัวอย่างและโจทย์"
  - type: worked-example
    title: เขียนป้ายห้องสมุดแบบ passive
    problem: "ห้องสมุดโรงเรียนมีกฎสองข้อ: \"ห้ามนำอาหารเข้ามา\" และ \"ต้องคืนหนังสือภายใน 7 วัน\" เขียนเป็นป้ายภาษาอังกฤษแบบ passive"
    steps:
      - text: "กฎข้อแรก สิ่งที่ถูกห้ามคือ food เป็นประธาน ใช้ปฏิเสธของ passive: *Food is not allowed.*"
        why: "food นับไม่ได้ ใช้ is และป้ายไม่ต้องบอกว่าใครห้าม"
      - text: "เติมสถานที่ให้ชัด: *Food is not allowed in the library.*"
      - text: "กฎข้อสอง สิ่งที่ต้องคืนคือ books (พหูพจน์) ใช้ must + be + V3: *Books must be returned*"
      - text: "เติมเวลา: *within 7 days.*"
    answer: "*Food is not allowed in the library. Books must be returned within 7 days.*"
  - { type: check, problem: english.grammar.passive-voice.p009, prompt: "ภาษาไทยไม่มีคำแบบ is แต่ passive ภาษาอังกฤษต้องมีอะไร" }
glossary:
  - { term: passive voice, definition: "กรรมวาจก ประโยคที่ประธานเป็นผู้ถูกกระทำ (be + V3)" }
  - { term: active voice, definition: "กรรตุวาจก ประโยคที่ประธานเป็นผู้กระทำ" }
  - { term: past participle (V3), definition: "กริยาช่อง 3 เช่น cleaned, built, spoken, stolen" }
  - { term: agent, definition: "ผู้กระทำใน passive ใส่หลัง by หรือตัดทิ้งได้" }
  - { term: intransitive verb, definition: "กริยาที่ไม่มีกรรม เช่น happen, arrive ใช้ passive ไม่ได้" }
flashcards:
  - { front: "โครงสร้าง passive ปัจจุบัน / อดีต", back: "is/are + V3 · was/were + V3" }
  - { front: "Photography is not allowed.", back: "ห้ามถ่ายรูป" }
  - { front: "Somebody stole my bike. → passive", back: "My bike was stolen." }
  - { front: "You must keep it cool. → passive", back: "It must be kept cool. (modal + be + V3)" }
  - { front: "The accident was happened. ผิดตรงไหน", back: "happen ไม่มีกรรม ใช้ passive ไม่ได้: The accident happened." }
