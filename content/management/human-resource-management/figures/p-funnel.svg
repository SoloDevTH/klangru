<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="sans-serif" font-size="14">
<title>กรวยการสรรหาพนักงานพร้อมอัตราผ่านแต่ละขั้น</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="ahk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
<text x="380.0" y="30.0" text-anchor="middle" font-size="16" fill="#222" font-weight="bold" >กรวยการสรรหาพนักงานฝ่ายผลิต (สมมติ)</text>
<polygon points="30.0,60.0 430.0,60.0 387.5,130.0 72.5,130.0" fill="#eef4fb" stroke="#1f5fa8" stroke-width="1.5" />
<text x="230.0" y="90.0" text-anchor="middle" font-size="14.5" fill="#222" font-weight="bold" >ผู้สมัครทั้งหมด</text>
<text x="230.0" y="112.0" text-anchor="middle" font-size="14" fill="#222" >? คน</text>
<polygon points="72.5,142.0 387.5,142.0 345.0,212.0 115.0,212.0" fill="#dfeaf7" stroke="#1f5fa8" stroke-width="1.5" />
<text x="230.0" y="172.0" text-anchor="middle" font-size="14.5" fill="#222" font-weight="bold" >ผ่านคัดกรองเอกสาร</text>
<text x="230.0" y="194.0" text-anchor="middle" font-size="14" fill="#222" >? คน</text>
<text x="445.0" y="146.0" text-anchor="start" font-size="13" fill="#333" >↓ ร้อยละ 40 ของผู้สมัคร (ทุกคนได้สัมภาษณ์)</text>
<polygon points="115.0,224.0 345.0,224.0 302.5,294.0 157.5,294.0" fill="#cfe0f3" stroke="#1f5fa8" stroke-width="1.5" />
<text x="230.0" y="254.0" text-anchor="middle" font-size="14.5" fill="#222" font-weight="bold" >ได้รับข้อเสนอจ้าง</text>
<text x="230.0" y="276.0" text-anchor="middle" font-size="14" fill="#222" >? คน</text>
<text x="445.0" y="228.0" text-anchor="start" font-size="13" fill="#333" >↓ 1 ใน 4 ของผู้ที่ได้สัมภาษณ์</text>
<polygon points="157.5,306.0 302.5,306.0 282.5,376.0 177.5,376.0" fill="#bcd3ee" stroke="#1f5fa8" stroke-width="1.5" />
<text x="230.0" y="336.0" text-anchor="middle" font-size="14.5" fill="#222" font-weight="bold" >ตอบรับเข้าทำงาน</text>
<text x="230.0" y="358.0" text-anchor="middle" font-size="14" fill="#222" >ต้องการ 6 คน</text>
<text x="445.0" y="310.0" text-anchor="start" font-size="13" fill="#333" >↓ ร้อยละ 75 ของผู้ได้รับข้อเสนอ</text>
</svg>
