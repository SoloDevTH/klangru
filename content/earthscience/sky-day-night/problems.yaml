  - id: earthscience.astronomy.sky-day-night.p017
    topics: [earthscience.astronomy.sky-day-night]
    difficulty: 5
    type: mcq
    stem: "ตอนหัวค่ำเดือนมกราคม นักเรียนเห็นกลุ่มดาวเต่า แต่ตอนหัวค่ำเดือนกรกฎาคมกลับมองหาไม่เจอ และเห็นกลุ่มดาวแมงป่องแทน ข้อใดอธิบายได้ถูกต้อง"
    choices:
      - { id: a, text: "โลกเคลื่อนที่ไปรอบดวงอาทิตย์ปีละรอบ ตอนกลางคืนในแต่ละฤดูเราจึงหันไปมองท้องฟ้าคนละส่วน", correct: true }
      - { id: b, text: "กลุ่มดาวเต่าดับไปในฤดูฝน แล้วกลับมาสว่างในฤดูหนาว", feedback: "ดาวส่องแสงตลอด กลุ่มดาวเต่ายังอยู่ แต่ตอนหัวค่ำเดือนกรกฎาคมมันอยู่ทางเดียวกับดวงอาทิตย์ จึงถูกแสงอาทิตย์กลบ" }
      - { id: c, text: "เพราะโลกหมุนรอบตัวเองวันละรอบ", feedback: "การหมุนรอบตัวเองทำให้ดาวขึ้นและตกในคืนเดียว แต่ไม่ได้ทำให้ดาวที่เห็นตอนหัวค่ำเปลี่ยนไปตามฤดู" }
      - { id: d, text: "เดือนกรกฎาคมมีเมฆมากทุกคืน จึงไม่มีวันเห็นกลุ่มดาวเต่า", feedback: "เมฆบังได้บางคืน แต่ถึงฟ้าใส ตอนหัวค่ำเดือนกรกฎาคมก็ไม่เห็นกลุ่มดาวเต่า เพราะมันอยู่ทางเดียวกับดวงอาทิตย์" }
    hints:
      - "ดาวที่เห็นตอนหัวค่ำเปลี่ยนไปตามเดือน แบบรูปนี้ซ้ำทุกปี"
      - "อะไรที่โลกทำครบรอบในหนึ่งปี"
    solution: "โลกเคลื่อนที่รอบดวงอาทิตย์ปีละหนึ่งรอบ ด้านกลางคืนของโลกจึงหันไปทางท้องฟ้าคนละส่วนในแต่ละฤดู ตอนหัวค่ำฤดูหนาวเห็นกลุ่มดาวเต่า ส่วนกลางปีกลุ่มดาวเต่าอยู่ทางเดียวกับดวงอาทิตย์ จึงเห็นกลุ่มดาวแมงป่องแทน และแบบรูปนี้ซ้ำทุกปี"
