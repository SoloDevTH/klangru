- id: chinese.grammar.modal-verbs.p011
  topics:
  - chinese.grammar.modal-verbs
  difficulty: 4
  type: match
  stem: จับคู่สถานการณ์กับกริยาช่วยที่เหมาะที่สุด
  pairs:
  - left: ขออนุญาตครูเข้าห้อง
    right: 可以
  - left: ว่ายน้ำได้ไกล 1 กิโลเมตร
    right: 能
  - left: เล่นกีตาร์เป็นเพราะเรียนมา
    right: 会
  - left: อยากกินส้มตำ
    right: 想
  hints:
  - ขออนุญาต → 可以 · ทักษะที่เรียนมา → 会
  - ทำได้ถึงระดับไหน (ความสามารถ ปริมาณ) → 能
  solution: ขออนุญาต 可以 (我可以进来吗？) · ว่ายได้ 1 กม. 能 (我能游一公里) · เล่นกีตาร์เป็น 会 · อยาก 想
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.modal-verbs.p012
  topics:
  - chinese.grammar.modal-verbs
  difficulty: 4
  type: mcq
  stem: ร้านในสำเพ็ง ลูกค้าชาวจีนถามว่า 可以刷卡吗？ (kěyǐ shuākǎ ma?) ลูกค้าต้องการรู้อะไร
  choices:
  - id: a
    text: ร้านต้องรูดบัตรไหม
    feedback: ต้องใช้ 要 หรือ 得
  - id: b
    text: จ่ายด้วยบัตรได้ไหม
    correct: true
    feedback: ถูก 刷卡 = รูดบัตร 可以…吗 = …ได้ไหม (ขออนุญาต)
  - id: c
    text: ลูกค้ารูดบัตรเป็นไหม
    feedback: ทำเป็นใช้ 会 และคำถามนี้ถามร้าน ไม่ใช่ถามความสามารถของลูกค้า
  - id: d
    text: ลูกค้าอยากรูดบัตร
    feedback: อยากใช้ 想 และประโยคนี้เป็นคำถาม
  hints:
  - 刷卡 shuākǎ = รูดบัตร
  - 可以…吗？ ใช้ขออนุญาต
  solution: '**จ่ายด้วยบัตรได้ไหม** ถ้ารับบัตรตอบ 可以 ถ้าไม่รับตอบ 不可以 หรือ 不行，只收现金 (ไม่ได้ รับเงินสดเท่านั้น)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.modal-verbs.p013
  topics:
  - chinese.grammar.modal-verbs
  difficulty: 4
  type: mcq
  stem: ข่าวพยากรณ์อากาศของกรุงเทพฯ พูดว่า 明天会下雨。 หมายความว่าอะไร
  choices:
  - id: a
    text: พรุ่งนี้ฝนตกแล้ว
    feedback: ไม่มี 了 และเป็นเรื่องอนาคต
  - id: b
    text: พรุ่งนี้อยากให้ฝนตก
    feedback: อยาก ใช้ 想
  - id: c
    text: พรุ่งนี้น่าจะมีฝนตก
    correct: true
    feedback: ถูก 会 + กริยา บอกการคาดการณ์ว่าน่าจะเกิดขึ้นได้ด้วย
  - id: d
    text: พรุ่งนี้ฝนตกเป็น
    feedback: 会 ในที่นี้ไม่ได้หมายถึงทักษะ
  hints:
  - ฝนไม่มีทักษะ 会 จึงมีความหมายอื่น
  - 会 บอกได้ว่าสิ่งหนึ่ง จะ/น่าจะ เกิดขึ้น
  solution: '**พรุ่งนี้น่าจะมีฝนตก** 会 บอกความเป็นไปได้ในอนาคต (ปฏิเสธ: 明天不会下雨)'
  license: CC-BY-SA-4.0
  ai_assisted: true
