- id: english.speaking.presentations.p016
  topics:
  - english.speaking.presentations
  difficulty: 5
  type: mcq
  stem: >-
    อ่านบทถอดความการพูดนี้แล้วตอบคำถาม: "Schools should cut plastic. First of all, plastic lasts for centuries. Moving on to my second point, recycling programmes save money. What's really important is that students can start helping today without spending much money. To sum up, we should begin this term." ประเด็นใดคือประเด็นที่ผู้พูดต้องการให้ผู้ฟังจำมากที่สุด
  choices:
  - id: a
    text: พลาสติกอยู่ได้นานหลายศตวรรษ
    feedback: เป็นประเด็นแรกที่ใช้อธิบายปัญหา แต่ผู้พูดไม่ได้เน้นว่าสำคัญที่สุด
  - id: b
    text: โครงการรีไซเคิลช่วยประหยัดเงิน
    feedback: เป็นประเด็นที่สอง แต่วลี What's really important is ไม่ได้ตามหลังประเด็นนี้
  - id: c
    text: นักเรียนเริ่มช่วยได้ทันทีโดยไม่ต้องใช้เงินมาก
    correct: true
    feedback: ถูก วลี What's really important is ตามด้วยประเด็นนี้ จึงเป็นประเด็นที่ผู้พูดเน้น
  - id: d
    text: ควรเริ่มในเทอมนี้
    feedback: เป็นการสรุปปิด ไม่ใช่ประเด็นที่ถูกเน้นในเนื้อหา
  hints:
  - มองหาวลีที่บอกว่าประเด็นนั้นสำคัญ
  - ดูว่าประโยคที่ตามหลังวลีนั้นพูดถึงอะไร
  solution: วลี What's really important is เป็นสัญญาณว่าประเด็นต่อจากนั้นคือประเด็นที่ผู้พูดเน้น คือ นักเรียนเริ่มช่วยได้ทันทีโดยไม่ต้องใช้เงินมาก
