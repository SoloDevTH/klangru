<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 430" width="420" height="430" font-family="sans-serif" font-size="14">
  <title>ข้อความ SMS สมมติที่อ้างว่าพัสดุตกค้าง</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="420" height="430" fill="#ffffff"/>
  <rect x="60.0" y="10.0" width="300.0" height="410.0" rx="26" fill="#111827" stroke="#111827" stroke-width="1.5"/>
  <rect x="74.0" y="40.0" width="272.0" height="360.0" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="210.0" y="68.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ผู้ส่ง: PARCEL-TH</text>
