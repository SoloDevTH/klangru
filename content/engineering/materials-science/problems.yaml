  - id: engineering.materials.materials-science.p015
    topics: [engineering.materials.materials-science]
    difficulty: 5
    type: numeric
    stem: "ทองแดงมีอะตอม $N = 8.0 \\times 10^{28}$ อะตอมต่อลูกบาศก์เมตร พลังงานการเกิดช่องว่าง $Q_v = 0.90\\ \\mathrm{eV}$ ต่ออะตอม ที่อุณหภูมิ $1000^\\circ\\mathrm{C}$ มีช่องว่างกี่อะตอมต่อลูกบาศก์เมตร ตอบเป็นหน่วย $10^{25}\\ \\mathrm{m^{-3}}$ ($k = 8.62 \\times 10^{-5}\\ \\mathrm{eV/K}$)"
    answer: { value: 2.19, tolerance: 0.03, unit: "× 10²⁵ m⁻³" }
    misconceptions:
      - { match: 0.234, feedback: "ใช้อุณหภูมิเป็นองศาเซลเซียส ($1000$) ต้องแปลงเป็นเคลวิน $1273\\ \\mathrm{K}$" }
    hints:
      - "$N_v = N\\,e^{-Q_v/kT}$ โดย $T$ เป็นเคลวิน"
      - "$Q_v/kT = 0.90/(8.62 \\times 10^{-5} \\times 1273) = 8.20$"
    solution: "$T = 1273\\ \\mathrm{K}$ $e^{-8.20} = 2.74 \\times 10^{-4}$ $N_v = 8.0 \\times 10^{28} \\times 2.74 \\times 10^{-4} = 2.19 \\times 10^{25}\\ \\mathrm{m^{-3}}$ ประมาณ 3 ช่องว่างต่ออะตอม 10,000 ตัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.materials.materials-science.p016
