      - "ระวังข้อสรุปที่ไกลเกินข้อมูล"
    solution: "ข้าวทองมีทุนหมุนเวียน $2.0$ เท่า กำไรสุทธิ $9.33\\%$ หนี้สินต่อสินทรัพย์ $50\\%$ จึงมีสภาพคล่องและกำไรต่อยอดขายดีกว่า และกู้น้อยกว่าค่าเฉลี่ย (ข้อ ก ข) แต่ทุนหมุนเวียนสูงอาจเพราะถือสินค้ามาก (ข้อ ค) ข้อ ง สรุปเกินข้อมูล อัตราส่วนปีเดียวรับประกันอนาคตไม่ได้"
