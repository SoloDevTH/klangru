id: physics.energy.simple-machines
subject: physics
title: { th: เครื่องกลอย่างง่าย, en: Simple machines }
summary: คาน รอก พื้นเอียง ล้อกับเพลา ลิ่ม และสกรู หลักได้แรงแต่เสียระยะ การได้เปรียบเชิงกลจากงานและโมเมนต์ ประสิทธิภาพ และการใช้ในชีวิตประจำวัน
difficulty: 5
minutes: 35
prerequisites: [physics.rotation.torque, physics.energy.work]
encompasses:
  - { id: physics.rotation.torque, weight: 0.3 }
  - { id: physics.energy.work, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: รอกสามแบบ
    src: pulleys.svg
    alt: "สามภาพ ก. รอกเดี่ยวตายตัวแขวนจากเพดาน เชือกพาดรอก ข้างหนึ่งแขวนภาระ 200 N อีกข้างดึงลงด้วยแรง F = 200 N เชือกรับภาระ 1 เส้น ได้เปรียบเชิงกล 1 ข. รอกเดี่ยวเคลื่อนที่ ปลายเชือกผูกกับเพดาน ลงมาอ้อมใต้รอกที่แขวนภาระ 200 N แล้วขึ้นไปที่มือที่ดึงขึ้นด้วยแรง F = 100 N เชือกรับภาระ 2 เส้น ได้เปรียบเชิงกล 2 ค. รอกพวง มีรอกตายตัวสองตัวด้านบนและรอกเคลื่อนที่สองตัวด้านล่างที่แขวนภาระ 200 N เชือกที่รับชุดรอกล่างมี 4 เส้น มีเลข 1 ถึง 4 กำกับ เส้นสุดท้ายลงมาที่มือดึงลงด้วยแรง F = 50 N ได้เปรียบเชิงกล 4"
    caption: "นับเฉพาะเส้นเชือกที่รับชุดรอกเคลื่อนที่ (รอกเบาและลื่น)"
  - type: worked-example
    title: ยกกระสอบปุ๋ยขึ้นยุ้งด้วยรอกพวง
    problem: "ใช้รอกพวงที่มีเชือกรับชุดรอกเคลื่อนที่ 4 เส้น ยกกระสอบปุ๋ยหนัก 500 N ขึ้นสูง 3.0 m ถ้ารอกเบาและลื่น ต้องออกแรงเท่าใด ดึงเชือกยาวเท่าใด และใช้งานเท่าใด"
    steps:
      - text: "แรงดึง $F = \\dfrac{500}{4} = 125\\ \\mathrm{N}$"
        why: "เชือก 4 เส้นแบ่งกันรับน้ำหนักเท่า ๆ กัน และแรงตึงตลอดเส้นเชือกเท่ากัน"
      - text: "ภาระขึ้น $3.0\\ \\mathrm{m}$ เชือกทั้ง 4 เส้นต้องสั้นลงเส้นละ $3.0\\ \\mathrm{m}$ จึงต้องดึงเชือกยาว $4 \\times 3.0 = 12\\ \\mathrm{m}$"
      - text: "งานที่ใส่ $125 \\times 12 = 1500\\ \\mathrm{J}$ งานที่ได้ $500 \\times 3.0 = 1500\\ \\mathrm{J}$ เท่ากัน"
        why: "เครื่องกลในอุดมคติลดแรงแต่ไม่ลดงาน"
    answer: "ออกแรง 125 N ดึงเชือก 12 m งานเท่ากับการยกตรง ๆ คือ 1500 J"
  - { type: check, problem: physics.energy.simple-machines.p009, prompt: "นับเส้นเชือกที่รับภาระในภาพ" }
  - type: figure
    title: พื้นเอียงและล้อกับเพลา
    src: ramp-wheel.svg
    alt: "สองภาพ ก. พื้นเอียงรูปสามเหลี่ยม ความยาวตามแนวลาด L = 4 m ความสูง h = 1 m มีกล่องบนพื้นเอียงและแรง F ขนานกับพื้นเอียงชี้ขึ้น ใต้ภาพเขียนว่า ไม่มีแรงเสียดทาน F × L = W × h ข. รอกบ่อน้ำแบบล้อกับเพลา วงกลมเส้นประใหญ่รัศมี R คือทางเดินของมือจับ วงกลมเล็กรัศมี r คือเพลาที่เชือกพัน เชือกแขวนถังน้ำหนัก W แรง F กดที่มือจับ ใต้ภาพเขียนว่า F × R = W × r ได้เปรียบเชิงกล = R ÷ r"
    caption: "ทั้งสองแบบใช้หลักเดียวกัน คือออกแรงน้อยเป็นระยะไกล"
  - type: worked-example
    title: วิเคราะห์ประสิทธิภาพของทางลาดจากข้อมูล
    problem: "ช่างเข็นรถเข็นปูนหนัก 800 N ขึ้นทางลาดยาว 5.0 m สูง 1.0 m วัดแรงเข็นได้ 200 N หาการได้เปรียบเชิงกลในอุดมคติ การได้เปรียบเชิงกลจริง และประสิทธิภาพ"
    steps:
      - text: "MA ในอุดมคติ $= \\dfrac{L}{h} = \\dfrac{5.0}{1.0} = 5$ ถ้าไม่มีแรงเสียดทานควรใช้แรง $800 \\div 5 = 160\\ \\mathrm{N}$"
      - text: "MA จริง $= \\dfrac{800}{200} = 4$"
      - text: "ประสิทธิภาพ $= \\dfrac{800 \\times 1.0}{200 \\times 5.0} \\times 100\\% = \\dfrac{800}{1000} \\times 100\\% = 80\\%$"
        why: "งาน $200\\ \\mathrm{J}$ ที่เกินมาถูกใช้สู้แรงเสียดทานของล้อและพื้น กลายเป็นความร้อน"
    answer: "MA ในอุดมคติ 5, MA จริง 4, ประสิทธิภาพ 80%"
  - { type: check, problem: physics.energy.simple-machines.p006, prompt: "ใช้หลักงานที่ใส่เท่ากับงานที่ได้" }
  - type: simulation
    title: "สมดุลของคาน (PhET Balancing Act)"
    url: https://phet.colorado.edu/en/simulations/balancing-act
    provider: phet
    note: "หน้า Balance Lab วางอิฐหนักใกล้จุดหมุนข้างหนึ่ง แล้วหาตำแหน่งที่อิฐเบากว่าอีกข้างทำให้คานสมดุล สังเกตว่าวัตถุที่เบากว่าต้องอยู่ไกลจุดหมุนกว่ากี่เท่า เชื่อมกับหลักได้แรงแต่เสียระยะ"
glossary:
  - { term: เครื่องกลอย่างง่าย, definition: "อุปกรณ์ที่ช่วยเปลี่ยนขนาดหรือทิศของแรง ได้แก่ คาน รอก พื้นเอียง ล้อกับเพลา ลิ่ม และสกรู" }
  - { term: การได้เปรียบเชิงกล, definition: "อัตราส่วนแรงของภาระต่อแรงพยายาม บอกว่าเครื่องกลขยายแรงได้กี่เท่า" }
  - { term: ประสิทธิภาพ, definition: "งานที่ได้หารด้วยงานที่ใส่ คูณ 100% เครื่องกลจริงมีค่าน้อยกว่า 100% เพราะแรงเสียดทาน" }
  - { term: รอกพวง, definition: "ระบบรอกตายตัวและรอกเคลื่อนที่หลายตัว การได้เปรียบเชิงกลในอุดมคติเท่ากับจำนวนเส้นเชือกที่รับชุดรอกเคลื่อนที่" }
  - { term: ล้อกับเพลา, definition: "ล้อรัศมีใหญ่ยึดกับเพลารัศมีเล็กหมุนไปด้วยกัน การได้เปรียบเชิงกล = R ÷ r" }
  - { term: ระยะเกลียว, definition: "ระยะที่สกรูเคลื่อนเข้าไปเมื่อหมุนครบหนึ่งรอบ" }
flashcards:
  - { front: "เครื่องกลอย่างง่ายช่วยลดงานได้หรือไม่", back: "ไม่ได้ ช่วยลดแรงแต่ต้องเพิ่มระยะ งานในอุดมคติเท่าเดิม" }
  - { front: "รอกเดี่ยวตายตัวมีประโยชน์อะไร", back: "เปลี่ยนทิศของแรง MA = 1" }
  - { front: "MA ในอุดมคติของรอกพวง", back: "จำนวนเส้นเชือกที่รับชุดรอกเคลื่อนที่" }
  - { front: "MA ของพื้นเอียงยาว L สูง h", back: "L ÷ h (ไม่มีแรงเสียดทาน)" }
  - { front: "MA ในอุดมคติของแม่แรงเกลียว", back: "$2\\pi R \\div p$ เมื่อ R คือความยาวด้าม p คือระยะเกลียว" }
