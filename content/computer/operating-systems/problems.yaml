    ai_assisted: true

  - id: computer.systems.operating-systems.p015
    topics: [computer.systems.operating-systems]
    difficulty: 5
    type: numeric
    stem: |
      งานสี่งานมาถึงไม่พร้อมกัน จัดคิวแบบ **งานสั้นที่สุดก่อนแบบไม่แย่ง** (งานที่เริ่มแล้วทำจนเสร็จ และเลือกเฉพาะงานที่มาถึงแล้ว) เวลารอเฉลี่ยเป็นกี่หน่วยเวลา

      | งาน | เวลามาถึง | เวลาที่ใช้ |
      |---|---|---|
      | P1 | 0 | 7 |
      | P2 | 1 | 4 |
      | P3 | 2 | 1 |
      | P4 | 3 | 2 |
    answer: { value: 4.75, tolerance: 0.02, unit: หน่วยเวลา }
    hints:
      - "เวลา 0 มีแค่ P1 จึงเริ่ม P1 และทำจนเสร็จที่เวลา 7"
      - "ที่เวลา 7 ทุกงานมาถึงแล้ว เลือกงานสั้นที่สุดก่อน เวลารอ = เวลาเริ่ม − เวลามาถึง"
    misconceptions:
      - { match: 6, feedback: "นี่คือคำตอบแบบมาก่อนได้ก่อน (P1, P2, P3, P4) หลัง P1 เสร็จต้องเลือกงานที่สั้นที่สุดก่อน" }
      - { match: 8.25, feedback: "นี่คือเวลาตลอดงานเฉลี่ย ต้องหักเวลาที่แต่ละงานทำงานออก" }
    solution: "P1 ทำ 0–7 (รอ 0) จากนั้นเลือก P3 (1) ทำ 7–8 รอ 7 − 2 = 5 แล้ว P4 (2) ทำ 8–10 รอ 8 − 3 = 5 แล้ว P2 (4) ทำ 10–14 รอ 10 − 1 = 9 เฉลี่ย (0 + 5 + 5 + 9) ÷ 4 = 4.75"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.operating-systems.p016
