<text x="719.0" y="362.0" text-anchor="middle" font-size="14" fill="#222">นกกินปลา</text>
<text x="22" y="210" text-anchor="middle" font-size="13" transform="rotate(-90 22 210)">ppm (สเกลลอการิทึม)</text>
<text x="440.0" y="405.0" text-anchor="middle" font-size="12" fill="#666">ข้อมูลตัวอย่าง เรียงจากซ้ายไปขวาตามลำดับขั้นในโซ่อาหาร แกนตั้งแต่ละช่องเพิ่มขึ้น 10 เท่า</text>
