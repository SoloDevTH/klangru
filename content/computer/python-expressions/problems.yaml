  - id: computer.programming.python-expressions.p019
    topics: [computer.programming.python-expressions]
    difficulty: 5
    type: code
    stem: |
      เขียนฟังก์ชัน `average_text(s)` ที่รับข้อความตัวเลขที่คั่นด้วยเครื่องหมายจุลภาค เช่น "70,85,90" แล้วคืนค่าเฉลี่ยเป็นทศนิยม 1 ตำแหน่งด้วยฟังก์ชัน round
    starter: |
      def average_text(s):
          return 0
    tests: |
      assert average_text("70,85,90") == 81.7, f"average_text('70,85,90') ควรได้ 81.7 แต่ได้ {average_text('70,85,90')}"
      assert average_text("10") == 10.0, "ข้อความที่มีตัวเลขเดียวควรได้ค่าของตัวเลขนั้น"
      assert average_text("1,2") == 1.5, "ค่าเฉลี่ยของ 1 และ 2 ควรได้ 1.5"
    reference: |
      def average_text(s):
          nums = [float(x) for x in s.split(",")]
          return round(sum(nums) / len(nums), 1)
    hints:
      - "ใช้เมธอด split(\",\") แยกข้อความออกเป็นรายการของข้อความย่อย"
      - "แปลงแต่ละส่วนเป็นทศนิยมด้วย float แล้วหาค่าเฉลี่ยและปัดด้วย round"
    solution: "แยกด้วย split แปลงด้วย float รวมแล้วหารด้วยจำนวนค่า เช่น (70 + 85 + 90) ÷ 3 ≈ 81.67 ปัดเป็น 81.7"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.python-expressions.p020
    topics: [computer.programming.python-expressions]
    difficulty: 4
    type: code
    stem: |
      รถสองแถวในเมืองคิดค่าโดยสารเริ่มต้น 35 บาท และเพิ่มกิโลเมตรละ 5 บาท ฟังก์ชัน `fare_message(km)` ต้องคืนข้อความ เช่น `fare_message(10)` ได้ `"ค่าโดยสาร 85 บาท"` แต่เมื่อรันโค้ดเริ่มต้นจะเกิดข้อผิดพลาดนี้

      ```
      TypeError: can only concatenate str (not "int") to str
      ```

      อ่านชนิดและข้อความของข้อผิดพลาด แล้วแก้โค้ดให้คืนข้อความที่ถูกต้อง
    starter: |
      def fare_message(km):
          fare = 35 + 5 * km
          return "ค่าโดยสาร " + fare + " บาท"
    tests: |
      r = fare_message(10)
      assert r == "ค่าโดยสาร 85 บาท", f"fare_message(10) ควรได้ 'ค่าโดยสาร 85 บาท' แต่ได้ {r!r}"
      assert fare_message(0) == "ค่าโดยสาร 35 บาท", f"fare_message(0) ควรได้ 'ค่าโดยสาร 35 บาท' แต่ได้ {fare_message(0)!r}"
      assert fare_message(12) == "ค่าโดยสาร 95 บาท", f"fare_message(12) ควรได้ 'ค่าโดยสาร 95 บาท' แต่ได้ {fare_message(12)!r}"
    reference: |
      def fare_message(km):
          fare = 35 + 5 * km
          return "ค่าโดยสาร " + str(fare) + " บาท"
    hints:
      - "TypeError บอกว่าใช้ค่าผิดชนิด ข้อความบอกว่าเอาข้อความ (str) ไปต่อกับจำนวนเต็ม (int) ไม่ได้"
      - "ตัวแปร fare เป็นจำนวนเต็ม ต้องแปลงเป็นข้อความด้วย str() ก่อนนำไปต่อกับข้อความอื่น"
    solution: "แก้บรรทัด return เป็น \"ค่าโดยสาร \" + str(fare) + \" บาท\" เช่น km = 10 ได้ค่าโดยสาร 35 + 5 × 10 = 85 บาท (ใช้ f-string f\"ค่าโดยสาร {fare} บาท\" ก็ได้)"
    license: CC-BY-SA-4.0
    ai_assisted: true
