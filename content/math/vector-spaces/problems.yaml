    solution: "หลังกำจัดได้ $\\begin{bmatrix}1 & 2 & 3\\\\ 0 & 1 & 1\\\\ 0 & 0 & k - 10\\end{bmatrix}$ ถ้า $k = 10$ ตัวนำที่สามหายไป แรงก์ 2 หลักที่สาม = หลักแรก + หลักที่สอง (ตรวจ: $(1 + 2, 2 + 5, 3 + 7) = (3, 7, 10)$)"
