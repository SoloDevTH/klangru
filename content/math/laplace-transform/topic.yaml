id: math.de.laplace-transform
subject: math
title:
  th: การแปลงลาปลาซและการแก้ปัญหาค่าเริ่มต้น
  en: The Laplace transform and initial value problems
summary: นิยามการแปลงลาปลาซและตาราง ทฤษฎีบทการเลื่อนแกน การแปลงของอนุพันธ์ และการแก้สมการเชิงอนุพันธ์ที่มีค่าเริ่มต้นด้วยเศษส่วนย่อย
difficulty: 9
