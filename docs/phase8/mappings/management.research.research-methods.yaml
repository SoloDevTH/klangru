  - { framework: th-tqf-public-administration, indicators: ["5.2(3)"], coverage: full, note: "สอนวิธีค้นและอ่านบทคัดย่อของงานวิจัยปัจจุบันจากวารสารวิชาการไทย ฐานข้อมูลวิทยานิพนธ์ และ Google Scholar รวมการทบทวนวรรณกรรมและการจดสรุปด้วยคำของตนเอง ไม่ได้สรุปผลงานวิจัยรายสาขาของรัฐประศาสนศาสตร์โดยตรง" }
  - { framework: th-tqf-public-administration, indicators: ["5.5(1)"], coverage: partial, note: "สอนการค้นข้อมูลวิชาการ ฟังก์ชันสเปรดชีตพื้นฐาน (AVERAGE STDEV.S COUNTIF) และการนำเสนอผลด้วยตารางและกราฟให้เหมาะกับผู้อ่าน (บทเรียน และ p016 แผนภูมิแท่ง) ยังไม่ได้ฝึกใช้สเปรดชีตหรือซอฟต์แวร์สถิติจริงเป็นขั้นตอน และไม่มีโจทย์ฝึกออกแบบการนำเสนอหลายรูปแบบ" }
  - { framework: th-tqf-public-administration, indicators: ["5.5(2)"], coverage: partial, note: "สอนการเลือกสถิติพื้นฐานให้ตรงกับคำถาม การอ่านค่า p และการคำนวณค่าเฉลี่ยกับ Cronbach alpha และ IOC (p007 p008 p009 p010 p012 p013) การคำนวณค่าสถิติทดสอบอยู่ใน math.stats.inference และยังไม่ได้สอนในหัวข้อนี้" }
  - { framework: th-tqf-logistics, indicators: ["5.2(3)"], coverage: full, note: "สอนการติดตามความรู้ใหม่จากงานวิจัยด้วยการค้นและอ่านบทคัดย่อ และการทบทวนวรรณกรรมที่ใช้ได้ทั้งสาขาโลจิสติกส์และศาสตร์ที่เกี่ยวข้อง (บทเรียนทบทวนวรรณกรรม)" }
