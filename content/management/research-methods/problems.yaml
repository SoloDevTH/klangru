      - "เลือกปัญหาที่ชัดเจนและมีความสำคัญต่อการทำงาน"
      - "ทบทวนวรรณกรรมและงานวิจัยที่เกี่ยวข้อง"
      - "ตั้งคำถามวิจัยและวัตถุประสงค์ที่วัดได้"
      - "กำหนดกรอบแนวคิดและตัวแปร"
      - "กำหนดประชากร กลุ่มตัวอย่าง และสร้างแบบสอบถาม"
      - "ทดสอบเครื่องมือเรื่องความตรงและความเชื่อถือได้"
      - "เก็บข้อมูล แล้ววิเคราะห์ด้วยสถิติที่เหมาะกับคำถาม"
      - "สรุปผลและอภิปรายข้อจำกัดของการศึกษา"
    hints:
      - "ต้องรู้ปัญหาก่อน จึงค้นวรรณกรรมได้ตรงประเด็น"
      - "เครื่องมือต้องทดสอบก่อนเก็บข้อมูลจริง"
    solution: "ปัญหา → ทบทวนวรรณกรรม → คำถามและวัตถุประสงค์ → กรอบแนวคิดและตัวแปร → ประชากร กลุ่มตัวอย่าง และเครื่องมือ → ทดสอบเครื่องมือ → เก็บและวิเคราะห์ข้อมูล → สรุปผลและข้อจำกัด ลำดับนี้เป็นแบบที่ใช้กันทั่วไป การวิจัยจริงย้อนกลับไปปรับได้"
