<text x="160.0" y="229.0" text-anchor="start" font-size="15" fill="#15211e">ชั่งและบรรจุน้ำพริก 500 กรัม</text>
<line x1="120.0" y1="240.0" x2="120.0" y2="266.0" stroke="#555555" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="70.0" y="287.0" text-anchor="middle" font-size="14" fill="#15211e" font-weight="bold">4</text>
<rect x="108.0" y="270.0" width="24.0" height="24.0" rx="0" fill="#2e7d32" stroke="#2e7d32" stroke-width="2"/>
<text x="160.0" y="287.0" text-anchor="start" font-size="15" fill="#15211e">ตรวจน้ำหนักและรอยปิดผนึก</text>
<line x1="120.0" y1="298.0" x2="120.0" y2="324.0" stroke="#555555" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="70.0" y="345.0" text-anchor="middle" font-size="14" fill="#15211e" font-weight="bold">5</text>
<rect x="107.0" y="327.0" width="26.0" height="26.0" rx="0" fill="#ffffff" stroke="#b3261e" stroke-width="2.5"/>
<text x="120.0" y="345.0" text-anchor="middle" font-size="15" fill="#b3261e" font-weight="bold">D</text>
<text x="160.0" y="345.0" text-anchor="start" font-size="15" fill="#15211e">รอให้ฉลากแห้งก่อนติด</text>
<line x1="120.0" y1="356.0" x2="120.0" y2="382.0" stroke="#555555" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="70.0" y="403.0" text-anchor="middle" font-size="14" fill="#15211e" font-weight="bold">6</text>
