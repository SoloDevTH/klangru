  - id: biology.diversity.biodiversity-classification.p015
    topics: [biology.diversity.biodiversity-classification]
    difficulty: 4
    type: numeric
    stem: "นักวิจัยเทียบลำดับเบสยาว 20 เบสของยีนเดียวกันในปลากัดสองชนิด พบว่าต่างกัน 3 ตำแหน่ง ลำดับเบสนี้เหมือนกันร้อยละเท่าใด"
    answer: { value: 85, unit: "%" }
    misconceptions:
