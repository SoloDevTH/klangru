id: math.stats.chi-square-tests
subject: math
title:
  th: การทดสอบไคกำลังสอง
  en: Chi-square tests
summary: ใช้การแจกแจงไคกำลังสองทดสอบความเหมาะสม ความเป็นอิสระ ความเป็นเอกพันธ์ และความแปรปรวนของประชากรเดียว พร้อมเงื่อนไขและการเปรียบเทียบ
difficulty: 8.5
minutes: 40
prerequisites:
- math.stats.inference
- math.prob.conditional
encompasses:
- id: math.prob.conditional
  weight: 0.3
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  src: gof-bars.svg
  alt: แผนภูมิแท่งคู่สี่แท่ง แต่ละสีมีแท่งสังเกตและแท่งคาดหวัง แท่งสังเกตสูงกว่าสีแดงและต่ำกว่าสีเขียวเล็กน้อย แท่งคาดหวังทุกสีเท่ากัน
  caption: ลูกอมสี่สี (ข้อมูลสมมติ) เทียบความถี่สังเกตกับความถี่คาดหวังที่เท่ากันทุกสี
- type: worked-example
  title: 'ทดสอบความเหมาะสม: สัดส่วนสีลูกอม (ข้อมูลสมมติ)'
  problem: ถุงลูกอม 100 เม็ดมี 4 สี ผู้ผลิตอ้างว่าแต่ละสีมีสัดส่วนเท่ากัน ตัวอย่างนับได้ $30, 22, 28, 20$ เม็ด (ข้อมูลสมมติ) ทดสอบที่ระดับ $0.05$
  steps:
  - text: ความถี่คาดหวังของแต่ละสีคือ $100/4 = 25$ เม็ด
    why: ถ้าคำอ้างจริง ทุกสีควรมีจำนวนเท่ากัน
  - text: $\chi^2 = \dfrac{(30-25)^2 + (22-25)^2 + (28-25)^2 + (20-25)^2}{25} = \dfrac{25 + 9 + 9 + 25}{25} = 2.72$
    why: ยกกำลังสองความต่างก่อนหารด้วยความถี่คาดหวัง
  - text: องศาอิสระ $\nu = 4 - 1 = 3$ ค่าวิกฤตที่ระดับ $0.05$ คือ $7.815$ (ตาราง $\chi^2$ ของ NIST)
    why: ค่าวิกฤตเป็นค่าที่ทำให้พื้นที่หางขวาเท่ากับ $0.05$
  - text: $2.72 < 7.815$ จึงไม่ปฏิเสธ $H_0$ ไม่มีหลักฐานว่าสัดส่วนสีต่างจากที่อ้าง
  answer: ไม่ปฏิเสธ $H_0$ ที่ระดับ $0.05$ (ข้อมูลสมมติ)
- type: check
  problem: math.stats.chi-square-tests.p001
  prompt: ลองนับองศาอิสระของการทดสอบลูกเต๋าก่อนอ่านต่อ
- type: worked-example
  title: ทดสอบความเป็นอิสระในตารางการณ์จร 2×2 (ข้อมูลสมมติ)
  problem: นักเรียน 100 คนจำแนกตามการมาตรงเวลาและการเข้านอนก่อนสี่ทุ่ม (ข้อมูลสมมติ) มาตรงเวลาและนอนก่อนสี่ทุ่ม 42 คน มาตรงเวลาแต่ไม่นอนก่อนสี่ทุ่ม 18 คน ไม่มาตรงเวลาแต่นอนก่อนสี่ทุ่ม 18 คน และไม่มาตรงเวลาและไม่นอนก่อนสี่ทุ่ม 22 คน ทดสอบว่าสองตัวแปรเป็นอิสระต่อกันหรือไม่
  steps:
  - text: ผลรวมแถวคือ $60$ และ $40$ ผลรวมคอลัมน์คือ $60$ และ $40$ ทั้งหมด $N = 100$
    why: ผลรวมเหล่านี้ใช้คำนวณความถี่คาดหวังทุกช่อง
  - text: ความถี่คาดหวัง $E = \dfrac{\text{แถว}\times\text{คอลัมน์}}{N}$ ได้ $36, 24, 24, 16$
    why: ถ้าสองตัวแปรเป็นอิสระ สัดส่วนในแต่ละแถวควรเท่ากันทุกแถว
  - text: $\chi^2 = \dfrac{36}{36} + \dfrac{36}{24} + \dfrac{36}{24} + \dfrac{36}{16} = 6.25$ ที่ $\nu = (2-1)(2-1) = 1$
    why: องศาอิสระของตารางการณ์จร $r\times c$ คือ $(r-1)(c-1)$
  - text: ค่าวิกฤตที่ $\nu = 1$ และระดับ $0.05$ คือ $3.841$ จึง $6.25 > 3.841$ ปฏิเสธ $H_0$ สรุปว่าสองตัวแปรสัมพันธ์กัน (ข้อมูลสมมติ)
  answer: $\chi^2 = 6.25$ ปฏิเสธความเป็นอิสระที่ระดับ $0.05$ (ข้อมูลสมมติ)
- type: check
  problem: math.stats.chi-square-tests.p009
  prompt: จับคู่สถานการณ์กับการทดสอบ ก่อนอ่านหัวข้อการเปรียบเทียบ
- type: figure
  src: chi-square-tail.svg
  alt: กราฟการแจกแจงไคกำลังสององศาอิสระ 3 เอียงขวา พื้นที่หางขวาตั้งแต่ค่า 7.815 เป็นไปทางขวาถูกระบายสี เป็นพื้นที่ 0.05
  caption: ค่าวิกฤต $7.815$ ของ $\chi^2$ องศาอิสระ 3 แบ่งพื้นที่หางขวาไว้ $0.05$
glossary:
- term: การแจกแจงไคกำลังสอง
  definition: การแจกแจงของผลรวมกำลังสองของตัวแปรปกติมาตรฐานอิสระ $k$ ตัว มีค่าเฉลี่ย $k$ และเบ้ขวาเมื่อ $k$ น้อย
- term: ความถี่คาดหวัง
  definition: จำนวนที่ควรสังเกตได้ในแต่ละช่องถ้าสมมติฐานว่างเป็นจริง
- term: องศาอิสระของ χ²
  definition: จำนวนค่าที่เป็นอิสระต่อกันหลังถูกบังคับด้วยผลรวม และหักพารามิเตอร์ที่ประมาณจากข้อมูล
- term: ตารางการณ์จร
  definition: ตารางจำนวนนับที่จำแนกหน่วยตัวอย่างตามตัวแปรสองตัวพร้อมกัน ใช้ทดสอบความเป็นอิสระหรือเอกพันธ์
flashcards:
- front: สูตรสถิติ $\chi^2$
  back: $\displaystyle\sum \frac{(O-E)^2}{E}$
- front: ความถี่คาดหวังในตารางการณ์จร
  back: $E = \dfrac{\text{ผลรวมแถว}\times\text{ผลรวมคอลัมน์}}{N}$
- front: องศาอิสระของตารางการณ์จร $r\times c$
  back: $(r-1)(c-1)$
- front: สถิติของการทดสอบความแปรปรวนประชากรเดียว
  back: $\chi^2 = \dfrac{(n-1)s^2}{\sigma_0^2}$ ที่ $\nu = n-1$
