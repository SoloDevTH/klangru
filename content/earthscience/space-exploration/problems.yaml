  - id: earthscience.astronomy.space-exploration.p013
    topics: [earthscience.astronomy.space-exploration]
    difficulty: 4
    type: numeric
    stem: "สัญญาณโทรศัพท์ผ่านดาวเทียมค้างฟ้าที่สูง 35,786 km ต้องเดินทางขึ้นไปถึงดาวเทียมแล้วลงมาที่พื้น ใช้เวลาอย่างน้อยกี่วินาที (ใช้ $c = 3.0 \\times 10^8\\ \\mathrm{m/s}$ ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 0.24, tolerance: 0.01, unit: s }
    misconceptions:
      - { match: 0.12, feedback: "นี่คือเวลาขาขึ้นอย่างเดียว สัญญาณต้องขึ้นไปและลงมา" }
      - { match: 0.00024, feedback: "ใช้ระยะทางเป็นกิโลเมตรโดยไม่แปลงเป็นเมตร ต้องคูณ $10^3$ ก่อนหารด้วย $c$" }
    hints:
      - "ระยะทางรวม = ขึ้น + ลง"
      - "$t = d/c$ และแปลงกิโลเมตรเป็นเมตร"
    solution: "$d = 2 \\times 35{,}786 \\times 10^3 = 7.16 \\times 10^7\\ \\mathrm{m}$, $t = \\dfrac{7.16 \\times 10^7}{3.0 \\times 10^8} \\approx 0.24\\ \\mathrm{s}$ จึงเกิดความหน่วงที่รู้สึกได้ในการคุยผ่านดาวเทียมค้างฟ้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.space-exploration.p014
    topics: [earthscience.astronomy.space-exploration]
    difficulty: 4
    type: mcq
    stem: "กล้องโทรทรรศน์วิทยุแห่งชาติมีจานกว้าง 40 m ใหญ่กว่ากระจกของกล้องที่ดอยอินทนนท์ (2.4 m) มาก แต่เมื่อรับคลื่นยาว 1.36 cm กลับแยกรายละเอียดได้หยาบกว่ากล้องแสงที่ 550 nm ราว 1,500 เท่า เพราะเหตุใด"
    choices:
      - { id: a, text: "กำลังแยกแปรผันตาม λ/D และความยาวคลื่นวิทยุยาวกว่าแสงหลายหมื่นเท่า จึงมากกว่าผลของจานที่ใหญ่ขึ้น", correct: true }
      - { id: b, text: "คลื่นวิทยุเดินทางช้ากว่าแสง", feedback: "คลื่นวิทยุและแสงเป็นคลื่นแม่เหล็กไฟฟ้า เดินทางในสุญญากาศด้วยอัตราเร็วเท่ากัน" }
      - { id: c, text: "จานที่ใหญ่กว่าทำให้ภาพพร่ามัวลงเสมอ", feedback: "จานใหญ่ขึ้นทำให้ θ เล็กลง แยกรายละเอียดได้ดีขึ้น แต่ λ ที่ยาวมากชดเชยไปมากกว่า" }
      - { id: d, text: "บรรยากาศดูดกลืนคลื่นวิทยุทั้งหมด", feedback: "คลื่นวิทยุช่วงนี้อยู่ในหน้าต่างบรรยากาศ ผ่านลงมาได้" }
    hints:
      - "ดูสูตร $\\theta \\approx 1.22\\lambda/D$"
      - "เทียบอัตราส่วนของ λ กับอัตราส่วนของ D"
    solution: "λ วิทยุ / λ แสง $= 0.0136 / (5.5 \\times 10^{-7}) \\approx 24{,}700$ เท่า ส่วน D ใหญ่กว่า $40/2.4 \\approx 17$ เท่า θ ของกล้องวิทยุจึงใหญ่กว่าราว $24{,}700/17 \\approx 1{,}500$ เท่า นักดาราศาสตร์จึงต่อกล้องวิทยุหลายตัวที่อยู่ห่างกันให้ทำงานร่วมกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.space-exploration.p015
    topics: [earthscience.astronomy.space-exploration]
    difficulty: 4
    type: mcq
    stem: "กล้องอินฟราเรดบนพื้นโลกมักสร้างบนยอดเขาสูงที่อากาศแห้งมาก ส่วนกล้องเจมส์ เว็บบ์ถูกส่งไปไกลและทำให้เย็นจัด ข้อใดอธิบายทั้งสองเรื่องได้ถูกต้อง"
    choices:
      - { id: a, text: "ไอน้ำในอากาศดูดกลืนอินฟราเรด และวัตถุอุ่น ๆ รวมทั้งตัวกล้องเองก็แผ่อินฟราเรดรบกวนสัญญาณ", correct: true }
      - { id: b, text: "อินฟราเรดเดินทางได้เฉพาะในที่เย็น", feedback: "อินฟราเรดเดินทางได้ทุกที่ ปัญหาคือการดูดกลืนโดยไอน้ำและการแผ่รังสีรบกวนจากวัตถุอุ่น" }
      - { id: c, text: "ยอดเขาสูงอยู่ใกล้ดาวมากกว่า", feedback: "ความสูงไม่กี่กิโลเมตรไม่ทำให้ใกล้ดาวอย่างมีความหมาย เหตุผลคือไอน้ำที่อยู่ใต้ยอดเขา" }
      - { id: d, text: "ความเย็นทำให้กระจกใหญ่ขึ้น", feedback: "ความเย็นทำให้วัสดุหดเล็กน้อย ไม่ได้ทำให้ใหญ่ขึ้น และไม่ใช่เหตุผลของการทำให้เย็น" }
    hints:
      - "อะไรในบรรยากาศดูดกลืนอินฟราเรดได้ดี"
      - "วัตถุที่มีอุณหภูมิปกติแผ่รังสีช่วงใดออกมา"
    solution: "ไอน้ำในบรรยากาศดูดกลืนอินฟราเรด จึงต้องไปอยู่เหนือไอน้ำส่วนใหญ่ และวัตถุอุ่นแผ่อินฟราเรดออกมา ถ้ากล้องอุ่น สัญญาณจางจากอวกาศจะจมอยู่ในรังสีจากตัวกล้องเอง จึงต้องทำให้เย็นจัด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.space-exploration.p016
    topics: [earthscience.astronomy.space-exploration]
    difficulty: 5
    type: numeric
    stem: "คลื่นวิทยุยาว 21 cm จากแก๊สไฮโดรเจนในกาแล็กซี ถ้าต้องการกำลังแยก 1 ลิปดา ($2.91 \\times 10^{-4}\\ \\mathrm{rad}$) ซึ่งใกล้เคียงกับตาคน ต้องใช้จานกว้างกี่เมตร (ใช้ $\\theta \\approx 1.22\\lambda/D$)"
    answer: { value: 880, tolerance: 10, unit: m }
    misconceptions:
      - { match: 722, feedback: "ลืมคูณ 1.22 ในสูตรกำลังแยก" }
      - { match: 88041, feedback: "ใช้ λ เป็น 21 m แทน 0.21 m ต้องแปลงเซนติเมตรเป็นเมตรก่อน" }
    hints:
      - "จัดสูตรให้ $D = 1.22\\lambda/\\theta$"
      - "แปลง $\\lambda = 21\\ \\mathrm{cm} = 0.21\\ \\mathrm{m}$"
    solution: "$D = \\dfrac{1.22 \\times 0.21}{2.91 \\times 10^{-4}} \\approx 880\\ \\mathrm{m}$ จานเดี่ยวขนาดนี้สร้างยากมาก จึงใช้กล้องหลายตัวที่อยู่ห่างกันทำงานร่วมกันแทน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.space-exploration.p017
    topics: [earthscience.astronomy.space-exploration]
    difficulty: 5
    type: mcq
    stem: "มีผู้เสนอว่า ประเทศไทยควรเลิกใช้หอดูดาวบนดอยอินทนนท์ แล้วส่งกล้องขึ้นอวกาศทั้งหมด เพราะอวกาศอยู่ใกล้ดาวมากกว่า ข้อใดประเมินข้อเสนอนี้ได้ดีที่สุด"
    choices:
      - { id: a, text: "เหตุผลเรื่องระยะใกล้ผิด ข้อดีของอวกาศคือพ้นการดูดกลืนและความปั่นป่วนของบรรยากาศ แต่กล้องบนพื้นถูกกว่ามาก ใหญ่ได้มาก ซ่อมและปรับปรุงง่าย จึงควรใช้ทั้งสองแบบตามงาน", correct: true }
      - { id: b, text: "ข้อเสนอถูก เพราะกล้องอวกาศเห็นทุกอย่างได้ดีกว่ากล้องบนพื้นเสมอ", feedback: "กล้องอวกาศมีขนาดจำกัดและแพงมาก กล้องบนพื้นขนาดใหญ่รวมแสงได้มากกว่าและเหมาะกับหลายงาน" }
      - { id: c, text: "ข้อเสนอผิด เพราะกล้องอวกาศเห็นได้เฉพาะดาวเคราะห์", feedback: "กล้องอวกาศสังเกตได้ทุกอย่างตั้งแต่ดาวเคราะห์ถึงกาแล็กซีไกล ๆ ข้อนี้ไม่ใช่เหตุผลที่ถูก" }
      - { id: d, text: "ข้อเสนอผิด เพราะคลื่นแม่เหล็กไฟฟ้าเดินทางในอวกาศไม่ได้", feedback: "คลื่นแม่เหล็กไฟฟ้าเดินทางในสุญญากาศได้ แสงจากดาวจึงมาถึงเรา" }
    hints:
      - "แยกก่อนว่าเหตุผลที่อ้างถูกหรือผิด"
      - "ชั่งข้อดีข้อเสียของกล้องบนพื้นและกล้องในอวกาศ"
    solution: "การขึ้นไปสูงไม่กี่ร้อยกิโลเมตรไม่ได้ทำให้ใกล้ดาวอย่างมีความหมาย ข้อดีจริงของอวกาศคือรับคลื่นที่บรรยากาศดูดกลืนและได้ภาพที่ไม่สั่นไหว แต่กล้องบนพื้นถูกกว่า สร้างให้ใหญ่ได้ และซ่อมง่าย นักดาราศาสตร์จึงใช้ทั้งสองแบบร่วมกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.space-exploration.p018
    topics: [earthscience.astronomy.space-exploration]
    difficulty: 5
    type: mcq
    stem: "นักเรียนเสนอโครงงานใช้เทคโนโลยีอวกาศช่วยลดหมอกควันในภาคเหนือช่วงหน้าแล้ง แนวคิดใดใช้ความรู้เรื่องดาวเทียมได้เหมาะสมที่สุด"
    choices:
      - { id: a, text: "ใช้ข้อมูลจุดความร้อนจากดาวเทียมวงโคจรต่ำทุกวัน ร่วมกับภาพพื้นที่เผาไหม้ แจ้งเตือนชุมชนและวางแผนจัดการเชื้อเพลิงก่อนฤดูเผา", correct: true }
      - { id: b, text: "ส่งดาวเทียมค้างฟ้าขึ้นไปเป่าลมไล่ควัน", feedback: "ดาวเทียมอยู่เหนือบรรยากาศและเปลี่ยนทิศลมไม่ได้" }
      - { id: c, text: "ใช้กล้องโทรทรรศน์วิทยุ 40 เมตรถ่ายภาพไฟป่า", feedback: "กล้องวิทยุหันไปที่ท้องฟ้าเพื่อรับคลื่นจากอวกาศ ไม่ได้ออกแบบมาเพื่อติดตามพื้นที่บนโลก" }
      - { id: d, text: "ให้สถานีอวกาศนานาชาติหยุดอยู่เหนือภาคเหนือตลอดเวลา", feedback: "สถานีอวกาศโคจรรอบโลกราว 92 นาที หยุดนิ่งเหนือจุดเดียวไม่ได้" }
    hints:
