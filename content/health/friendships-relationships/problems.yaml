problems:
  - id: health.family.friendships-relationships.p001
    topics: [health.family.friendships-relationships]
    difficulty: 1
    type: mcq
    stem: "ข้อใดบอกความสำคัญของเพื่อนได้ถูกต้อง"
    choices:
      - { id: a, text: "เพื่อนช่วยเหลือกัน ให้กำลังใจ และทำให้เรามีความสุข", correct: true }
      - { id: b, text: "เพื่อนมีไว้ให้ทำการบ้านแทนเรา", feedback: "การให้เพื่อนทำการบ้านแทนไม่ใช่การช่วยเหลือที่ถูกต้อง เพื่อนช่วยอธิบายให้เราเข้าใจได้" }
      - { id: c, text: "เพื่อนมีไว้ให้ของเล่นกับเรา", feedback: "เพื่อนสำคัญเพราะความจริงใจและการช่วยเหลือกัน ไม่ใช่เพราะสิ่งของ" }
    hints:
      - "นึกถึงตอนที่เพื่อนช่วยให้เรารู้สึกดีขึ้น"
      - "ความสำคัญของเพื่อนอยู่ที่สิ่งที่ทำให้กัน ไม่ใช่สิ่งของ"
    solution: "เพื่อนช่วยเหลือกัน ให้กำลังใจ ได้เรียนรู้ร่วมกัน และทำให้มีความสุข"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.family.friendships-relationships.p002
    topics: [health.family.friendships-relationships]
    difficulty: 1
    type: mcq
    stem: "ข้อใดแสดงว่าเป็นเพื่อนที่ดี"
    choices:
      - { id: a, text: "เตือนเพื่อนเมื่อเห็นเพื่อนจะลอกการบ้าน", correct: true }
      - { id: b, text: "ล้อเพื่อนที่ใส่แว่นให้คนอื่นหัวเราะ", feedback: "การล้อเลียนความแตกต่างทำให้เพื่อนเสียใจ เพื่อนที่ดีให้เกียรติกัน" }
      - { id: c, text: "เล่าความลับของเพื่อนให้ทั้งห้องฟัง", feedback: "เพื่อนที่ดีรักษาความลับที่เพื่อนไว้ใจ (ยกเว้นเรื่องที่ทำให้เพื่อนไม่ปลอดภัย)" }
    hints:
      - "เพื่อนที่ดีชวนกันทำดี"
      - "ข้อที่ถูกคือข้อที่ช่วยให้เพื่อนไม่ทำผิด"
    solution: "การเตือนเพื่อนไม่ให้ทำผิดเป็นลักษณะของเพื่อนที่ดี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.family.friendships-relationships.p003
    topics: [health.family.friendships-relationships]
    difficulty: 1
    type: text
    stem: "เผลอเดินชนเพื่อนจนดินสอของเพื่อนหล่น ควรพูดคำใดกับเพื่อนก่อน (ตอบเป็นคำพูดสั้น ๆ)"
    accepted: ["ขอโทษ", "ขอโทษนะ", "ขอโทษครับ", "ขอโทษค่ะ", "ขอโทษนะครับ", "ขอโทษนะคะ"]
    misconceptions:
      - { match: "ขอบคุณ", feedback: "ขอบคุณใช้เมื่อมีคนช่วยเรา เมื่อเราทำให้เพื่อนเดือดร้อนต้องขอโทษ" }
    hints:
      - "เราเป็นฝ่ายที่ทำให้เพื่อนเดือดร้อน"
      - "คำนี้แสดงว่าเรารู้ตัวว่าทำผิด"
    solution: "พูดว่า \"ขอโทษ\" แล้วช่วยเก็บดินสอให้เพื่อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.family.friendships-relationships.p004
    topics: [health.family.friendships-relationships]
    difficulty: 2
    type: numeric
    stem: "จากแผนภูมิผลสำรวจ ห้องนี้มีนักเรียนตอบแบบสำรวจทั้งหมดกี่คน (ตอบเป็นคน)"
    figure:
      src: friend-survey.svg
      alt: "แผนภูมิแท่งแนวนอน สิ่งที่ชอบที่สุดในตัวเพื่อนสนิท สำรวจห้องหนึ่ง คนละ 1 คำตอบ ซื่อสัตย์จริงใจ 12 คน ใจดีช่วยเหลือกัน 9 คน ตลกเล่นด้วยแล้วสนุก 5 คน เรียนเก่ง 3 คน มีของเล่นเยอะ 1 คน"
    answer: { value: 30, unit: คน }
    misconceptions:
      - { match: 12, feedback: "12 คือแท่งที่ยาวที่สุด ต้องรวมทุกแท่ง" }
      - { match: 5, feedback: "5 คือจำนวนตัวเลือก ไม่ใช่จำนวนนักเรียน" }
    hints:
      - "แต่ละคนตอบได้ 1 คำตอบ"
      - "นำตัวเลขทุกแท่งมาบวกกัน"
    solution: "12 + 9 + 5 + 3 + 1 = 30 คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.family.friendships-relationships.p005
    topics: [health.family.friendships-relationships]
    difficulty: 2
    type: match
    stem: "จับคู่สถานการณ์กับวิธีสร้างสัมพันธภาพที่เหมาะสม"
    pairs:
      - { left: "มีเพื่อนใหม่ย้ายมาและนั่งคนเดียว", right: "ยิ้ม แนะนำตัว และชวนมานั่งด้วย" }
      - { left: "ยายทำกับข้าวมื้อเย็นอยู่คนเดียว", right: "เข้าไปช่วยล้างผักและจัดโต๊ะ" }
      - { left: "เพื่อนช่วยอธิบายโจทย์คณิตศาสตร์ให้", right: "พูดขอบคุณเพื่อน" }
      - { left: "พี่ชายเล่าเรื่องที่โรงเรียนตอนกินข้าว", right: "วางโทรศัพท์และฟังอย่างตั้งใจ" }
    hints:
      - "สัมพันธภาพสร้างจากการกระทำเล็ก ๆ ทุกวัน"
      - "ดูว่าอีกฝ่ายต้องการอะไรในสถานการณ์นั้น"
    solution: "เพื่อนใหม่-ชวนมานั่งด้วย, ยายทำกับข้าว-ช่วยงาน, เพื่อนช่วย-ขอบคุณ, พี่เล่าเรื่อง-ฟังอย่างตั้งใจ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.family.friendships-relationships.p006
    topics: [health.family.friendships-relationships]
    difficulty: 2
    type: mcq
    stem: "เพื่อนแซงคิวซื้อขนมทุกวัน ข้อใดเป็นการพูดแบบใช้ \"ฉัน\" ที่ให้เกียรติ"
    choices:
      - { id: a, text: "\"เราไม่สบายใจที่เธอแซงคิว เพราะเรารอมานานแล้ว ช่วยไปต่อท้ายได้ไหม\"", correct: true }
      - { id: b, text: "\"เธอนี่เห็นแก่ตัวที่สุดในโรงเรียนเลย\"", feedback: "เป็นการตัดสินและต่อว่านิสัยของเพื่อน ทำให้ทะเลาะกันมากขึ้น" }
      - { id: c, text: "ไม่พูดอะไร แต่ไปเล่าให้คนอื่นฟังลับหลัง", feedback: "การพูดลับหลังทำให้ความสัมพันธ์แย่ลงและปัญหาไม่ได้แก้" }
    hints:
      - "พูดแบบใช้ ฉัน บอกความรู้สึก สิ่งที่เกิดขึ้น เหตุผล และสิ่งที่ขอ"
      - "ไม่ตัดสินว่าเพื่อนเป็นคนไม่ดี"
    solution: "ข้อ a บอกความรู้สึก (ไม่สบายใจ) สิ่งที่เกิดขึ้น (แซงคิว) เหตุผล (รอมานาน) และสิ่งที่ขอ (ไปต่อท้าย)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.family.friendships-relationships.p007
    topics: [health.family.friendships-relationships]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นลักษณะของสมาชิกที่ดีของครอบครัว (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ช่วยพับผ้าและเก็บของใช้ของตัวเอง", correct: true }
      - { id: b, text: "บอกพ่อแม่ทุกครั้งว่าจะไปที่ไหน กับใคร", correct: true }
      - { id: c, text: "ดูแลน้องเมื่อน้องไม่สบาย", correct: true }
      - { id: d, text: "พูดตะคอกเมื่อพี่ขอเปลี่ยนช่องทีวี", feedback: "การพูดตะคอกทำให้ครอบครัวไม่มีความสุข ควรพูดคุยและตกลงกัน" }
      - { id: e, text: "ทำแต่สิ่งที่ตัวเองชอบ ไม่ช่วยงานบ้าน", feedback: "สมาชิกที่ดีทำหน้าที่ของตนในครอบครัวด้วย" }
    hints:
      - "สมาชิกที่ดีทำหน้าที่ของตนและดูแลกัน"
      - "ข้อที่ถูกมีสามข้อ"
    solution: "ช่วยงานบ้าน บอกครอบครัวว่าไปไหน และดูแลกันเมื่อเจ็บป่วย เป็นลักษณะของสมาชิกที่ดี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.family.friendships-relationships.p008
    topics: [health.family.friendships-relationships]
    difficulty: 3
    type: numeric
    stem: "จากแผนภูมิผลสำรวจ นักเรียนที่เลือก \"ซื่อสัตย์ จริงใจ\" คิดเป็นร้อยละเท่าไรของทั้งห้อง (ตอบเป็นร้อยละ)"
    figure:
      src: friend-survey.svg
      alt: "แผนภูมิแท่งแนวนอน สิ่งที่ชอบที่สุดในตัวเพื่อนสนิท สำรวจห้องหนึ่ง คนละ 1 คำตอบ ซื่อสัตย์จริงใจ 12 คน ใจดีช่วยเหลือกัน 9 คน ตลกเล่นด้วยแล้วสนุก 5 คน เรียนเก่ง 3 คน มีของเล่นเยอะ 1 คน"
    answer: { value: 40, unit: "%" }
    misconceptions:
      - { match: 12, feedback: "12 คือจำนวนคน ต้องหารด้วยจำนวนทั้งหมดแล้วคูณ 100" }
      - { match: 60, feedback: "60 คือร้อยละของคนที่ไม่ได้เลือกข้อนี้" }
    hints:
      - "หาจำนวนนักเรียนทั้งหมดก่อน"
      - "ร้อยละ = 12 ÷ ทั้งหมด × 100"
    solution: "ทั้งหมด 30 คน, 12 ÷ 30 × 100 = 40 คือร้อยละ 40"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.family.friendships-relationships.p009
    topics: [health.family.friendships-relationships]
    difficulty: 3
    type: order
    stem: "เรียงประโยคต่อไปนี้ให้เป็นการพูดแบบใช้ \"ฉัน\" ที่สมบูรณ์"
    items:
      - "เรารู้สึกน้อยใจ"
      - "ที่เธอไม่ชวนเราเล่นตอนพักเที่ยง"
      - "เพราะเราอยากเล่นกับเธอ"
      - "พรุ่งนี้ชวนเราเล่นด้วยได้ไหม"
    hints:
      - "ลำดับคือ ฉันรู้สึก... เมื่อ... เพราะ... ฉันอยากให้..."
      - "ประโยคที่เป็นคำขอมาเป็นลำดับสุดท้าย"
    solution: "ความรู้สึก (น้อยใจ) → สิ่งที่เกิดขึ้น (ไม่ชวนเล่น) → เหตุผล (อยากเล่นด้วย) → สิ่งที่ขอ (ชวนเล่นพรุ่งนี้)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.family.friendships-relationships.p010
    topics: [health.family.friendships-relationships]
    difficulty: 3
    type: mcq
    stem: "ตอนบ่าย เพื่อนสนิทชวนโดดเรียนวิชาพละไปเล่นเกมที่ร้านหน้าโรงเรียน และบอกว่า \"ถ้าไม่ไป ก็ไม่ใช่เพื่อนกันแล้ว\" ข้อใดเป็นการตอบที่ดีที่สุด"
    choices:
      - { id: a, text: "\"เราไม่ไปนะ ถ้าโดดเรียนจะโดนตำหนิ แต่เลิกเรียนแล้วไปเตะบอลกันไหม\"", correct: true }
      - { id: b, text: "ไปด้วย เพราะกลัวเพื่อนเลิกคบ", feedback: "เพื่อนที่ดีไม่บังคับให้ทำผิด การทำตามเพราะกลัวทำให้เราเดือดร้อน" }
      - { id: c, text: "\"เธอนี่นิสัยเสีย ไม่คบแล้ว\"", feedback: "การต่อว่าทำให้ทะเลาะกัน ควรปฏิเสธอย่างสุภาพและชวนทำสิ่งอื่นแทน" }
    hints:
      - "ปฏิเสธอย่างสุภาพแต่ชัดเจน"
      - "เสนอกิจกรรมอื่นที่ทำร่วมกันได้"
    solution: "ปฏิเสธชัดเจน บอกเหตุผล และชวนทำกิจกรรมอื่นแทน รักษาทั้งความปลอดภัยของเราและความเป็นเพื่อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.family.friendships-relationships.p011
    topics: [health.family.friendships-relationships]
    difficulty: 3
    type: mcq
    stem: "เพื่อนสนิทเล่าให้ฟังว่าโดนผู้ใหญ่คนหนึ่งตีจนตัวเขียวบ่อย ๆ แล้วขอว่า \"อย่าบอกใครนะ\" ควรทำอย่างไร"
    choices:
      - { id: a, text: "บอกครูหรือผู้ใหญ่ที่ไว้ใจ เพราะเป็นเรื่องที่ทำให้เพื่อนไม่ปลอดภัย", correct: true }
      - { id: b, text: "เก็บเป็นความลับ เพราะเพื่อนที่ดีต้องรักษาความลับทุกเรื่อง", feedback: "ความลับที่ทำให้เพื่อนถูกทำร้ายต้องบอกผู้ใหญ่ เพื่อให้เพื่อนได้รับความช่วยเหลือ" }
      - { id: c, text: "เล่าให้เพื่อนทั้งห้องฟัง", feedback: "การบอกทุกคนทำให้เพื่อนอับอาย ควรบอกผู้ใหญ่ที่ช่วยได้" }
    hints:
      - "ความลับบางเรื่องต้องบอกผู้ใหญ่"
      - "เรื่องที่ทำให้เพื่อนบาดเจ็บหรือไม่ปลอดภัยคือเรื่องที่ต้องบอก"
    solution: "บอกครูหรือผู้ใหญ่ที่ไว้ใจ ซึ่งจะประสานความช่วยเหลือ เช่น ศูนย์ช่วยเหลือสังคม 1300 การบอกไม่ใช่การทรยศเพื่อน แต่เป็นการช่วยให้เพื่อนปลอดภัย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.family.friendships-relationships.p012
    topics: [health.family.friendships-relationships]
    difficulty: 3
    type: mcq
    stem: "ข้าวปั้นเล่นเกมออนไลน์แล้วมีคนที่ไม่เคยเจอตัวจริงทักมาคุยทาง LINE ทุกวัน ต่อมาขอรูปและชวนไปเจอที่ห้างคนเดียว ข้าวปั้นควรทำอย่างไร"
    choices:
      - { id: a, text: "ไม่ส่งรูป ไม่ไปตามนัด และบอกพ่อแม่หรือผู้ใหญ่ที่ไว้ใจ", correct: true }
      - { id: b, text: "ไปเจอ เพราะคุยกันมานานแล้ว", feedback: "คนที่รู้จักทางออนไลน์อาจไม่ใช่คนที่บอกไว้ การไปเจอคนเดียวเสี่ยงอันตราย" }
      - { id: c, text: "ส่งรูปให้ แต่ไม่ไปเจอ", feedback: "รูปที่ส่งไปแล้วอาจถูกนำไปใช้ในทางที่ไม่ดี ไม่ควรส่งรูปให้คนที่ไม่รู้จักตัวจริง" }
    hints:
      - "เรารู้จริงหรือไม่ว่าอีกฝ่ายเป็นใคร"
      - "สัญญาณอันตรายคือการขอรูปและนัดให้มาคนเดียว"
    solution: "ไม่ส่งรูป ไม่ไปตามนัด และเล่าให้ผู้ใหญ่ที่ไว้ใจฟัง เพื่อนที่ดีไม่ขอให้เราทำสิ่งที่ไม่ปลอดภัยหรือเป็นความลับจากผู้ปกครอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.family.friendships-relationships.p013
    topics: [health.family.friendships-relationships]
    difficulty: 4
    type: numeric
