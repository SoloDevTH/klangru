  - id: computer.programming.recursion.p017
    topics: [computer.programming.recursion]
    difficulty: 4
    type: mcq
    stem: |
      นักเรียนลืมคำว่า `return` หน้าการเรียกซ้ำ เรียก `broken(3)` แล้วเกิดอะไรขึ้น

      ```python
      def broken(n):
          if n == 0:
              return 0
          n + broken(n - 1)
      ```
    choices:
      - { id: a, text: "เกิด TypeError เพราะ broken(1) คืน None แล้ว broken(2) นำ None ไปบวกกับ 2", correct: true }
      - { id: b, text: "คืน 6 ตามปกติ", feedback: "บรรทัดสุดท้ายคำนวณแต่ไม่ได้ return ฟังก์ชันที่ไม่มี return คืน None" }
      - { id: c, text: "เกิด RecursionError", feedback: "n ลดลงจนถึง 0 ได้ กรณีฐานทำงาน ปัญหาอยู่ที่ค่าที่คืนกลับขึ้นมา" }
      - { id: d, text: "คืน 0", feedback: "broken(0) คืน 0 จริง แต่ชั้นบน ๆ ไม่ได้ส่งค่านั้นต่อ" }
    hints:
      - "broken(0) คืน 0 แล้ว broken(1) ทำ 1 + 0 แต่ไม่ return ค่านั้น broken(1) จึงคืนอะไร"
      - "broken(2) คำนวณ 2 + ค่าที่ broken(1) คืน"
    solution: "broken(0) คืน 0 → broken(1) คำนวณ 1 + 0 แต่ไม่ return จึงคืน None → broken(2) คำนวณ 2 + None เกิด TypeError ทันที แก้โดยเขียน return n + broken(n - 1)"
