id: physics.dynamics.gravitation
subject: physics
title: { th: กฎความโน้มถ่วงสากล, en: "Newton's law of universal gravitation" }
summary: วัตถุทุกคู่ในเอกภพดึงดูดกัน แรงแปรผันตรงกับผลคูณของมวลและแปรผกผันกับกำลังสองของระยะห่าง ใช้หาค่า g บนดาวต่าง ๆ และเข้าใจการโคจรของดาวเทียม
difficulty: 5.5
minutes: 40
prerequisites: [physics.dynamics.newton-second, math.number.scientific-notation]
encompasses:
  - { id: physics.dynamics.newton-second, weight: 0.3 }
  - { id: math.number.scientific-notation, weight: 0.5 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: field-earth.svg
    alt: "โลกเป็นวงกลม มีเส้นสนามโน้มถ่วงสีเทาชี้เข้าหาโลกในแนวรัศมีจากทุกทิศ คนสี่คนยืนบนผิวโลกที่ตำแหน่งต่าง ๆ รวมทั้งประเทศไทยด้านบนและอีกฟากของโลกด้านล่าง แต่ละคนมีลูกศรน้ำหนักสีส้มยาวเท่ากันชี้เข้าหาจุดศูนย์กลางโลก"
    caption: "สนามโน้มถ่วงชี้เข้าหาจุดศูนย์กลางโลก \"ลง\" ของทุกคนจึงชี้เข้าหาจุดศูนย์กลาง"
  - type: figure
    src: g-vs-r.svg
    alt: "กราฟความเร่งโน้มถ่วง g กับระยะจากจุดศูนย์กลางโลก r ในหน่วยรัศมีโลก R เส้นโค้งลดลงจาก 9.80 m/s² ที่ผิวโลก (r = R) เป็น 2.45 ที่ 2R, 1.09 ที่ 3R และ 0.61 ที่ 4R"
    caption: "ระยะเพิ่มเป็น 2 เท่า g เหลือหนึ่งในสี่ ตามกฎกำลังสองผกผัน"
  - type: worked-example
    title: มวลและน้ำหนักบนดวงจันทร์
    problem: "นักบินอวกาศมวล $70\\ \\mathrm{kg}$ เดินทางจากโลกไปดวงจันทร์ หามวลและน้ำหนักของเขาที่ผิวโลก ($g = 9.8\\ \\mathrm{N/kg}$) และที่ผิวดวงจันทร์ ($g = 1.6\\ \\mathrm{N/kg}$)"
    steps:
      - text: "มวลเป็นปริมาณเนื้อสาร ไม่ขึ้นกับสถานที่ จึงเป็น $70\\ \\mathrm{kg}$ ทั้งสองที่"
      - text: "บนโลก: $W = mg = (70)(9.8) = 686\\ \\mathrm{N}$"
      - text: "บนดวงจันทร์: $W = (70)(1.6) = 112\\ \\mathrm{N}$"
        why: "ดวงจันทร์มีมวลและรัศมีน้อยกว่าโลก ความเข้มสนามโน้มถ่วงที่ผิวจึงน้อยกว่า"
    answer: "มวล $70\\ \\mathrm{kg}$ เท่าเดิม น้ำหนักบนโลก $686\\ \\mathrm{N}$ บนดวงจันทร์ $112\\ \\mathrm{N}$ (ประมาณ $\\tfrac16$)"
  - { type: check, problem: phy.grav.p015, prompt: "ลองคิดน้ำหนักบนดวงจันทร์" }
  - type: worked-example
    title: ดวงอาทิตย์กับดวงจันทร์ ใครดึงโลกแรงกว่า
    problem: "ใช้ $G = 6.67 \\times 10^{-11}\\ \\mathrm{N\\cdot m^2/kg^2}$ มวลดวงอาทิตย์ $1.99 \\times 10^{30}\\ \\mathrm{kg}$ มวลโลก $5.97 \\times 10^{24}\\ \\mathrm{kg}$ มวลดวงจันทร์ $7.35 \\times 10^{22}\\ \\mathrm{kg}$ ระยะโลก–ดวงอาทิตย์ $1.5 \\times 10^{11}\\ \\mathrm{m}$ และระยะโลก–ดวงจันทร์ $3.84 \\times 10^{8}\\ \\mathrm{m}$ เทียบแรงที่ดวงอาทิตย์และดวงจันทร์ดึงโลก"
    steps:
      - text: "ดวงอาทิตย์: $F = \\dfrac{(6.67 \\times 10^{-11})(1.99 \\times 10^{30})(5.97 \\times 10^{24})}{(1.5 \\times 10^{11})^2} \\approx 3.5 \\times 10^{22}\\ \\mathrm{N}$"
        why: "ยกกำลังสองของระยะ: $(1.5 \\times 10^{11})^2 = 2.25 \\times 10^{22}$ ต้องยกกำลังสองทั้งตัวเลขหน้าและเลขชี้กำลัง"
      - text: "ดวงจันทร์: $F = \\dfrac{(6.67 \\times 10^{-11})(7.35 \\times 10^{22})(5.97 \\times 10^{24})}{(3.84 \\times 10^{8})^2} \\approx 2.0 \\times 10^{20}\\ \\mathrm{N}$"
      - text: "อัตราส่วน $\\dfrac{3.5 \\times 10^{22}}{2.0 \\times 10^{20}} \\approx 180$ เท่า"
        why: "ดวงอาทิตย์อยู่ไกลกว่ามาก แต่มีมวลมากกว่ามหาศาล ผลรวมจึงแรงกว่า โลกจึงโคจรรอบดวงอาทิตย์"
    answer: "ดวงอาทิตย์ดึงโลกแรงกว่าดวงจันทร์ประมาณ 180 เท่า"
  - { type: check, problem: phy.grav.p018, prompt: "ทิศ \"ลง\" อยู่ที่ไหน" }
  - type: interactive
    title: ค่า g ลดลงเมื่อขึ้นไปสูงจากผิวโลก
    caption: แกนนอนคือความสูงจากผิวโลก (กิโลเมตร) แกนตั้งคือความเร่งโน้มถ่วง (m/s²) จาก g = 9.8 × (R/(R + h))² เมื่อรัศมีโลก R ≈ 6370 km ที่ความสูงราว 400 km ซึ่งสถานีอวกาศนานาชาติโคจรอยู่ g ยังมีค่าราว 8.7 m/s² หรือเกือบ 90% ของที่ผิวโลก ส่วนที่ความสูงราว 35,800 km (วงโคจรค้างฟ้า) g เหลือเพียงราว 0.22 m/s²
    widget:
      kind: function-plot
      functions: ["9.8\\left(\\frac{6370}{6370 + x}\\right)^2"]
      x: [0, 40000]
      y: [0, 10]
  - type: simulation
    title: แรงดึงดูดระหว่างมวลสองก้อน (PhET Gravity Force Lab Basics)
    url: https://phet.colorado.edu/en/simulations/gravity-force-lab-basics
    provider: phet
    note: ลากมวลสองก้อนให้ห่างกันเป็นสองเท่า แล้วดูว่าแรงลดลงเหลือหนึ่งในสี่ ลองเพิ่มมวลก้อนหนึ่งเป็นสองเท่า แรงจะเพิ่มเป็นสองเท่า และสังเกตว่าลูกศรแรงที่กระทำต่อทั้งสองก้อนยาวเท่ากันเสมอ
  - type: simulation
    title: ดาวเทียมและดาวเคราะห์โคจร (PhET Gravity and Orbits)
    url: https://phet.colorado.edu/en/simulations/gravity-and-orbits
    provider: phet
    note: เลือกโลกกับดาวเทียม เปิดแสดงแรงโน้มถ่วงและความเร็ว แล้วสังเกตว่าแรงชี้เข้าหาโลกตลอดเวลา ขณะที่ความเร็วตั้งฉากกับแรง ลองปิดแรงโน้มถ่วงแล้วดูว่าดาวเทียมจะพุ่งออกไปเป็นเส้นตรง
glossary:
  - { term: กฎความโน้มถ่วงสากล, definition: "วัตถุสองก้อนดึงดูดกันด้วยแรง $F = \\dfrac{Gm_1m_2}{r^2}$ เมื่อ $r$ คือระยะระหว่างจุดศูนย์กลางมวล" }
  - { term: ค่าคงตัวความโน้มถ่วงสากล (G), definition: "$G = 6.67 \\times 10^{-11}\\ \\mathrm{N\\cdot m^2/kg^2}$ มีค่าเท่ากันทั่วเอกภพ" }
  - { term: สนามโน้มถ่วง, definition: "แรงโน้มถ่วงต่อมวล 1 กิโลกรัม ณ ตำแหน่งหนึ่ง มีค่าเท่ากับ $g = \\dfrac{GM}{r^2}$ หน่วย $\\mathrm{N/kg}$ ซึ่งเท่ากับ $\\mathrm{m/s^2}$" }
  - { term: ดาวเทียม, definition: "วัตถุที่โคจรรอบดาวดวงอื่น มันกำลังตกเข้าหาดาวตลอดเวลา แต่มีความเร็วในแนวข้างมากพอจึงตกเลยผิวดาวไปเรื่อย ๆ" }
flashcards:
  - { front: "กฎความโน้มถ่วงสากลของนิวตัน", back: "$F = \\dfrac{Gm_1m_2}{r^2}$ โดย $G = 6.67 \\times 10^{-11}\\ \\mathrm{N\\cdot m^2/kg^2}$" }
  - { front: "ระยะห่างเพิ่มเป็น 3 เท่า แรงโน้มถ่วงเป็นกี่เท่า", back: "$\\tfrac{1}{9}$ เท่า เพราะแรงแปรผกผันกับ $r^2$" }
  - { front: "ค่า $g$ ที่ผิวดาวมวล $M$ รัศมี $R$", back: "$g = \\dfrac{GM}{R^2}$ ไม่ขึ้นกับมวลของวัตถุที่ตก" }
  - { front: "มวลกับน้ำหนักต่างกันอย่างไร", back: "มวล (kg) เท่าเดิมทุกที่ น้ำหนัก $W = mg$ (N) ขึ้นกับความเข้มสนามโน้มถ่วง $g$ ของดาวนั้น" }
  - { front: "ทำไมนักบินอวกาศในสถานีอวกาศจึงลอยตัว", back: "ทั้งนักบินและสถานีตกอิสระรอบโลกไปพร้อมกัน ไม่ใช่เพราะไม่มีแรงโน้มถ่วง ($g$ ที่ระดับนั้นยังราว $8.7\\ \\mathrm{m/s^2}$)" }
