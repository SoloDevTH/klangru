id: management.org.leadership-motivation
subject: management
title: { th: ภาวะผู้นำ การจูงใจ และการทำงานเป็นทีม, en: Leadership, motivation and teamwork }
summary: ทฤษฎีลำดับขั้นความต้องการ ทฤษฎีสองปัจจัย ทฤษฎีความคาดหวัง แบบภาวะผู้นำและภาวะผู้นำตามสถานการณ์ ขั้นพัฒนาการของทีม และบทบาทผู้อำนวยความสะดวกในทีมปรับปรุงคุณภาพ
difficulty: 4.5
minutes: 40
prerequisites: [management.principles.organizing]
encompasses:
  - { id: management.principles.organizing, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: maslow.svg
    alt: "พีระมิดห้าชั้น จากฐานขึ้นยอด 1 ความต้องการทางกาย (ค่าจ้างพอใช้จ่าย เวลาพัก น้ำดื่ม) 2 ความมั่นคงปลอดภัย (สัญญาจ้างชัดเจน ที่ทำงานปลอดภัย สวัสดิการ) 3 ความรักและการยอมรับในกลุ่ม (เพื่อนร่วมงานที่ดี ทีมที่อบอุ่น) 4 การได้รับการยกย่อง (คำชมเชย ตำแหน่ง รางวัล) 5 ความสำเร็จสมหวังในชีวิต (งานท้าทาย ได้ใช้ศักยภาพเต็มที่)"
    caption: "ลำดับขั้นความต้องการของมาสโลว์กับตัวอย่างในที่ทำงาน"
  - type: worked-example
    title: ทำไมโบนัสจึงไม่จูงใจพยาบาล
    problem: "โรงพยาบาลแห่งหนึ่ง (สมมติ) ประกาศโบนัสถ้าลดเวลารอที่แผนกผู้ป่วยนอกได้ตามเป้า พยาบาลประเมินว่าถ้าพยายามจะทำได้ (E = 0.7) อยากได้โบนัส (V = 0.8) แต่ปีก่อนเคยประกาศแล้วไม่จ่าย จึงเชื่อว่าจะได้จริงเพียง I = 0.3 ถ้าผู้บริหารประกาศเกณฑ์ชัดเจนและจ่ายตรงเวลาจน I เพิ่มเป็น 0.9 แรงจูงใจเปลี่ยนไปเท่าใด"
    steps:
      - text: "ก่อนปรับ: $M = 0.7 \\times 0.3 \\times 0.8 = 0.168$"
      - text: "หลังปรับ: $M = 0.7 \\times 0.9 \\times 0.8 = 0.504$"
      - text: "อัตราส่วน: $0.504 \\div 0.168 = 3$ เท่า"
        why: "ทุกตัวคูณกัน การเพิ่มตัวที่ต่ำที่สุดจึงได้ผลมากที่สุด ขณะที่การเพิ่มเงินโบนัส (V) แทบไม่ช่วยถ้าคนไม่เชื่อว่าจะได้จริง"
    answer: "แรงจูงใจเพิ่มจาก 0.168 เป็น 0.504 หรือ 3 เท่า โดยไม่ต้องเพิ่มเงินโบนัสเลย แค่ทำให้ระบบรางวัลน่าเชื่อถือ"
  - { type: check, problem: management.org.leadership-motivation.p004, prompt: "คูณทั้งสามตัว ไม่ใช่บวก" }
  - type: figure
    src: situational.svg
    alt: "ตารางสองคูณสอง แกนนอนคือพฤติกรรมมุ่งงานมากขึ้นไปทางขวา แกนตั้งคือพฤติกรรมมุ่งสัมพันธ์มากขึ้นขึ้นไปด้านบน ช่องบนซ้าย S3 ร่วมมือ (สนับสนุน ฟัง ให้มีส่วนร่วม) ช่องบนขวา S2 สอนงาน (อธิบาย ชี้แนะ ให้กำลังใจ) ช่องล่างซ้าย S4 มอบหมาย (ให้ตัดสินใจและรับผิดชอบเอง) ช่องล่างขวา S1 สั่งการ (บอกชัดว่าทำอะไร ติดตามใกล้ชิด) ด้านล่างมีแถบความพร้อมของผู้ตามจากสูงไปต่ำ R4 ทำได้และมั่นใจ ใต้ S4 R3 ทำได้แต่ไม่มั่นใจ ใต้ S3 R2 ยังทำไม่ได้แต่อยากทำ ใต้ S2 R1 ยังทำไม่ได้และไม่มั่นใจ ใต้ S1"
    caption: "เลือกแบบการนำ S1–S4 ให้ตรงกับความพร้อม R1–R4 ของผู้ตามในงานนั้น"
  - { type: check, problem: management.org.leadership-motivation.p005 }
  - type: worked-example
    title: จัดลำดับความคิดด้วยเทคนิคกลุ่มระบุ
    problem: "ทีมปรับปรุงบริการของสำนักงานเขต 4 คน เสนอทางลดเวลารอ 3 ทาง ก แบบฟอร์มออนไลน์ ข เพิ่มช่องบริการช่วงเที่ยง ค ป้ายรายการเอกสาร ให้แต่ละคนจัดอันดับแบบลับ (อันดับ 1 ได้ 3 คะแนน อันดับ 2 ได้ 2 อันดับ 3 ได้ 1) ได้ คนที่ 1: ก ข ค · คนที่ 2: ข ก ค · คนที่ 3: ค ก ข · คนที่ 4: ก ค ข ทีมควรเลือกทางใดก่อน"
    steps:
      - text: "ทาง ก: $3 + 2 + 2 + 3 = 10$"
      - text: "ทาง ข: $2 + 3 + 1 + 1 = 7$"
      - text: "ทาง ค: $1 + 1 + 3 + 2 = 7$"
      - text: "ทาง ก ได้คะแนนสูงสุด แม้จะได้อันดับ 1 เพียงสองเสียง"
        why: "การรวมคะแนนจัดอันดับใช้ความเห็นของทุกคนทั้งหมด ไม่ใช่นับแค่อันดับหนึ่ง และการให้คะแนนแบบลับลดอิทธิพลของคนที่ตำแหน่งสูง"
    answer: "เลือกทาง ก (10 คะแนน) ก่อน ส่วน ข และ ค เสมอกันที่ 7 คะแนน อาจอภิปรายเพิ่มก่อนตัดสินลำดับถัดไป"
glossary:
  - { term: ปัจจัยค้ำจุน, definition: "ปัจจัยที่ถ้าขาดทำให้ไม่พอใจ แต่ถ้ามีไม่ได้สร้างแรงจูงใจ เช่น เงินเดือน สภาพการทำงาน" }
  - { term: ปัจจัยจูงใจ, definition: "ปัจจัยที่ทำให้อยากทุ่มเท เช่น ความสำเร็จ การยอมรับ ความรับผิดชอบ ความก้าวหน้า" }
  - { term: ทฤษฎีความคาดหวัง, definition: "แรงจูงใจ = ความคาดหวัง × ความเป็นเครื่องมือ × คุณค่าของรางวัล" }
  - { term: ภาวะผู้นำตามสถานการณ์, definition: "แนวคิดที่ให้เลือกแบบการนำ (สั่งการ สอนงาน ร่วมมือ มอบหมาย) ตามความพร้อมของผู้ตาม" }
  - { term: ผู้นำแบบเปลี่ยนสภาพ, definition: "ผู้นำที่สร้างวิสัยทัศน์ ปลุกแรงบันดาลใจ และพัฒนาผู้ตามให้มุ่งเป้าหมายที่ใหญ่กว่าตัวเอง" }
  - { term: ผู้อำนวยความสะดวก, definition: "ผู้ดูแลกระบวนการทำงานของทีมให้ทุกคนมีส่วนร่วมและบรรลุวาระ โดยวางตัวเป็นกลางต่อเนื้อหา" }
flashcards:
  - { front: "มาสโลว์ 5 ขั้น (ล่างขึ้นบน)", back: "ทางกาย → ความมั่นคงปลอดภัย → ความรักและการยอมรับ → การยกย่อง → ความสำเร็จสมหวัง" }
  - { front: "เฮิร์ซเบิร์ก: เงินเดือนอยู่กลุ่มไหน", back: "ปัจจัยค้ำจุน ขาดแล้วไม่พอใจ มีแล้วไม่ได้จูงใจระยะยาว" }
  - { front: "วรูม", back: "M = E × I × V ตัวใดเป็นศูนย์ แรงจูงใจเป็นศูนย์" }
  - { front: "ขั้นพัฒนาการของทีมของทักแมน", back: "ก่อตัว → ปะทะ → ปรับตัว → ทำงานเต็มที่ → สลายตัว" }
  - { front: "R2 ยังทำไม่ได้แต่อยากทำ ใช้แบบไหน", back: "S2 สอนงาน: อธิบาย ชี้แนะ และให้กำลังใจ" }
