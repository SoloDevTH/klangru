      - "$3.5 \\times 10^{4} = 0.35 \\times 10^{5}$"
    misconceptions:
      - { match: 7.7, feedback: "บวกสัมประสิทธิ์ $4.2 + 3.5$ ทั้งที่เลขชี้กำลังต่างกัน ต้องทำเลขชี้กำลังให้เท่ากันก่อน ($3.5 \\times 10^4 = 0.35 \\times 10^5$)" }
      - { match: 0.77, feedback: "ดูเหมือนบวก $4.2 + 3.5$ แล้วปรับรูป ทั้งสองจำนวนมีเลขชี้กำลังต่างกัน ต้องปรับก่อนบวก" }
    solution: "$4.2 \\times 10^{5} + 0.35 \\times 10^{5} = 4.55 \\times 10^{5}$ ตรวจ: $420{,}000 + 35{,}000 = 455{,}000$ ✓"
