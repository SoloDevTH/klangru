    text: สองแบบสูสีมาก ผลขึ้นกับว่าชุมชนให้ความสำคัญกับอะไร ควรถามผู้ใช้ก่อนตั้งน้ำหนัก และพิจารณารวมจุดเด่นของสองแบบ
    correct: true
    feedback: ถูก ผลที่พลิกเมื่อปรับน้ำหนักเล็กน้อยแปลว่าสูสี
  - id: b
    text: เมทริกซ์ใช้ไม่ได้ ควรเลือกตามความชอบของทีม
    feedback: เมทริกซ์ยังมีประโยชน์ บอกว่าต้องหาข้อมูลเพิ่ม
  - id: c
