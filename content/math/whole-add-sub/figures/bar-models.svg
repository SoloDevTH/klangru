<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="sans-serif" font-size="16">
  <title>แบบจำลองแท่ง ส่วนย่อยกับทั้งหมด และการเปรียบเทียบ</title>
  <rect x="0" y="0" width="720" height="330" fill="#ffffff"/>
  <text x="20.0" y="30.0" font-size="17" text-anchor="start" fill="#15211e" font-weight="bold">ส่วนย่อยและทั้งหมด</text>
  <rect x="90.0" y="60.0" width="390.0" height="40.0" rx="0" fill="#e2f0ed" stroke="#0a6b60" stroke-width="2"/>
  <text x="285.0" y="86.0" font-size="17" text-anchor="middle" fill="#15211e">ทั้งหมด 13</text>
  <rect x="90.0" y="100.0" width="240.0" height="40.0" rx="0" fill="#fde7c8" stroke="#c2410c" stroke-width="2"/>
  <text x="210.0" y="126.0" font-size="17" text-anchor="middle" fill="#15211e">8</text>
  <rect x="330.0" y="100.0" width="150.0" height="40.0" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="405.0" y="126.0" font-size="17" text-anchor="middle" fill="#15211e">5</text>
  <text x="500.0" y="110.0" font-size="17" text-anchor="start" fill="#15211e">8 + 5 = 13</text>
  <text x="500.0" y="136.0" font-size="17" text-anchor="start" fill="#15211e">13 − 8 = 5</text>
  <text x="500.0" y="162.0" font-size="17" text-anchor="start" fill="#15211e">13 − 5 = 8</text>
  <text x="20.0" y="186.0" font-size="17" text-anchor="start" fill="#15211e" font-weight="bold">การเปรียบเทียบ</text>
  <text x="80.0" y="226.0" font-size="15" text-anchor="end" fill="#15211e">มะม่วง</text>
  <rect x="90.0" y="200.0" width="360.0" height="40.0" rx="0" fill="#fde7c8" stroke="#c2410c" stroke-width="2"/>
  <text x="270.0" y="226.0" font-size="17" text-anchor="middle" fill="#15211e">12</text>
  <text x="80.0" y="276.0" font-size="15" text-anchor="end" fill="#15211e">ส้ม</text>
  <rect x="90.0" y="250.0" width="210.0" height="40.0" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="195.0" y="276.0" font-size="17" text-anchor="middle" fill="#15211e">7</text>
  <rect x="300.0" y="250.0" width="150.0" height="40.0" rx="0" fill="none" stroke="#6b7a76" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="375.0" y="276.0" font-size="14" text-anchor="middle" fill="#6b7a76">ต่างกันกี่ผล?</text>
  <text x="500.0" y="260.0" font-size="17" text-anchor="start" fill="#15211e">12 − 7 = 5</text>
</svg>
