    figure: { src: venn-sports.svg, alt: "แผนภาพเวนน์ในกรอบสี่เหลี่ยมที่แทนนักเรียนทั้งห้อง 40 คน วงกลมซ้ายคือชอบฟุตบอล 22 คน วงกลมขวาคือชอบแบดมินตัน 18 คน ส่วนที่ซ้อนกันมีเลข 7 และบริเวณนอกวงกลมทั้งสองมีเครื่องหมายคำถาม" }
    answer: { value: 7, unit: คน }
    hints:
      - "นักเรียน 7 คนที่ชอบทั้งสองอย่างถูกนับอยู่ในทั้ง 22 คนและ 18 คน"
      - "จำนวนคนที่ชอบอย่างน้อยหนึ่งอย่าง $= 22 + 18 - 7$ แล้วนำไปลบออกจาก 40"
    misconceptions:
      - { match: 0, feedback: "ลบ $40 - 22 - 18$ เท่ากับนับ 7 คนที่ชอบทั้งสองอย่างซ้ำสองครั้ง ต้องบวก 7 คืนหนึ่งครั้ง" }
    solution: "ชอบอย่างน้อยหนึ่งอย่าง $= 22 + 18 - 7 = 33$ คน ไม่ชอบทั้งสองอย่าง $= 40 - 33 = 7$ คน ตรวจด้วยแผนภาพ: ฟุตบอลอย่างเดียว 15 คน แบดมินตันอย่างเดียว 11 คน ทั้งสองอย่าง 7 คน รวม 33 คน"
