  - แยกช่อดอกกับสารสกัด
  solution: ช่อดอกกัญชาเป็นสมุนไพรควบคุม ขายได้เฉพาะผู้มีใบอนุญาตให้ผู้มีใบสั่งจ่าย ห้ามขายออนไลน์และโฆษณา ส่วนสารสกัดที่มี THC เกินร้อยละ 0.2 ยังเป็นยาเสพติดให้โทษประเภท 5 และรัฐบาลกำลังร่างกฎหมายฉบับใหม่
