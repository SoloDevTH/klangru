    ai_assisted: true

  - id: biology.ecology.environmental-issues.p016
    topics: [biology.ecology.environmental-issues]
    difficulty: 5
    type: mcq
    stem: "เมือง ก มีประชากร 1 ล้านคน ใช้น้ำเฉลี่ยคนละ 250 ลิตรต่อวัน เมือง ข มีประชากร 2 ล้านคน ใช้น้ำคนละ 100 ลิตรต่อวัน (ข้อมูลสมมติ) ข้อสรุปใดได้รับการสนับสนุนจากข้อมูลมากที่สุด"
    choices:
      - { id: a, text: "เมือง ก ใช้น้ำรวมมากกว่าแม้ประชากรน้อยกว่า ผลกระทบต่อแหล่งน้ำจึงขึ้นกับทั้งจำนวนประชากรและการใช้ต่อคน", correct: true }
      - { id: b, text: "เมือง ข ใช้น้ำรวมมากกว่าเพราะประชากรมากกว่า", feedback: "เมือง ข ใช้ 200 ล้านลิตรต่อวัน น้อยกว่าเมือง ก ที่ใช้ 250 ล้านลิตรต่อวัน" }
      - { id: c, text: "จำนวนประชากรไม่มีผลต่อการใช้ทรัพยากร", feedback: "จำนวนประชากรมีผล แต่ต้องคิดร่วมกับการใช้ต่อคน" }
      - { id: d, text: "การลดการใช้ต่อคนไม่ช่วยอะไร ต้องลดประชากรเท่านั้น", feedback: "ข้อมูลแสดงว่าการใช้ต่อคนต่างกัน 2.5 เท่า การลดการใช้ต่อคนจึงช่วยได้มาก" }
    hints:
      - "คำนวณการใช้น้ำรวมของแต่ละเมือง"
      - "การใช้รวม = ประชากร × การใช้ต่อคน"
    solution: "เมือง ก ใช้ $1{,}000{,}000 \\times 250 = 250$ ล้านลิตรต่อวัน เมือง ข ใช้ $2{,}000{,}000 \\times 100 = 200$ ล้านลิตรต่อวัน ผลกระทบรวมจึงขึ้นกับทั้งจำนวนประชากรและการบริโภคต่อคน ทางแก้จึงต้องรวมการลดการใช้ต่อคน เช่น อุปกรณ์ประหยัดน้ำและการใช้น้ำซ้ำ"
