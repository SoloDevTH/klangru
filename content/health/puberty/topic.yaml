id: health.sexuality.puberty
subject: health
title: { th: "การเปลี่ยนแปลงทางเพศเมื่อเข้าสู่วัยรุ่นและการปรับตัว", en: "Puberty: changes and adjusting" }
summary: การเปลี่ยนแปลงของร่างกายเมื่อเข้าสู่วัยเริ่มเจริญพันธุ์ ประจำเดือน การหลั่งน้ำอสุจิขณะหลับ สุขอนามัย อารมณ์ที่เปลี่ยนไป วิธีปรับตัว และเมื่อใดควรปรึกษาแพทย์
difficulty: 3.5
minutes: 30
prerequisites: [health.body.circulatory-respiratory-reproductive-care]
encompasses:
  - { id: health.body.circulatory-respiratory-reproductive-care, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ช่วงอายุโดยทั่วไป
    src: puberty-ages.svg
    alt: "แผนภูมิช่วงอายุ แกนนอนอายุ 6 ถึง 18 ปี แถบแรก เริ่มเข้าสู่วัยรุ่น ช่วง 8 ถึง 14 ปี แถบที่สอง ประจำเดือนครั้งแรก ช่วง 8 ถึง 17 ปี มีเส้นเน้นที่ 12 ปี เขียนว่าส่วนใหญ่ราว 12 ปี แถวล่าง ควรปรึกษาแพทย์ ถ้าเริ่มก่อน 8 ปี หรือยังไม่เริ่มเมื่อ 15 ปี หัวภาพเขียนว่าแต่ละคนเริ่มไม่พร้อมกัน และปกติทั้งหมด ที่มาของช่วงอายุและเกณฑ์ปรึกษาแพทย์คือ NHS"
  - type: worked-example
    title: จดรอบประจำเดือนเพื่อเตรียมตัว
    problem: "ประจำเดือนของพลอยเริ่มวันที่ 25 เมษายน (เดือนเมษายนมี 30 วัน) และครั้งถัดไปเริ่มวันที่ 23 พฤษภาคม รอบนี้ยาวกี่วัน ถ้ารอบถัดไปยาวเท่าเดิม ควรเตรียมผ้าอนามัยไว้ราววันใด"
    steps:
      - text: "ความยาวรอบนับจากวันแรกที่มีประจำเดือนถึงวันก่อนครั้งถัดไป"
      - text: "วันที่ 25–30 เมษายน นับได้ $30 - 25 + 1 = 6$ วัน บวกวันที่ 1–22 พฤษภาคมอีก 22 วัน รวม 28 วัน"
        why: "วันที่ 23 พฤษภาคมเป็นวันแรกของรอบใหม่ จึงไม่นับรวมในรอบเดิม"
      - text: "รอบถัดไปเริ่มราว $23 + 28 = 51$ ซึ่งเกินเดือนพฤษภาคม (31 วัน) ไป $51 - 31 = 20$ คือราววันที่ 20 มิถุนายน"
      - text: "รอบในวัยรุ่นอาจไม่สม่ำเสมอ จึงควรพกผ้าอนามัยไว้ก่อนหน้านั้นหลายวัน"
    answer: "รอบยาว 28 วัน ครั้งถัดไปน่าจะเริ่มราว 20 มิถุนายน ควรพกผ้าอนามัยไว้ล่วงหน้า"
  - { type: check, problem: health.sexuality.puberty.p001, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: worked-example
    title: เตรียมตัวไปค่ายลูกเสือ
    problem: "โรงเรียนจัดค่ายลูกเสือ 3 วัน 2 คืน ปุ้ย (12 ปี) เพิ่งมีประจำเดือนได้ 2 เดือนและกังวลว่าจะมาช่วงค่าย ส่วนต้นกังวลเรื่องกลิ่นตัวและฝันเปียกเพราะต้องนอนรวมกับเพื่อน ทั้งสองควรเตรียมตัวอย่างไร"
    steps:
      - text: "ปุ้ยพกผ้าอนามัยให้พอใช้หลายวัน ถุงสำหรับห่อทิ้ง และกางเกงชั้นในสำรอง"
      - text: "ปุ้ยบอกครูผู้ดูแลที่ไว้ใจล่วงหน้า เพื่อรู้ว่าจะขอความช่วยเหลือหรือเปลี่ยนได้ที่ไหน"
        why: "การบอกล่วงหน้าทำให้ไม่ต้องกังวลระหว่างทำกิจกรรม และครูช่วยได้ทันที"
      - text: "ต้นพกเสื้อผ้าและกางเกงชั้นในสำรอง ถุงใส่ผ้าใช้แล้ว และอาบน้ำหลังทำกิจกรรมทุกวัน"
      - text: "ถ้ามีใครล้อ ทั้งสองบอกได้ว่าเป็นเรื่องปกติของวัยรุ่น และแจ้งครูถ้าการล้อไม่หยุด"
    answer: "เตรียมของใช้ส่วนตัวให้พอ บอกครูที่ไว้ใจ ดูแลความสะอาดทุกวัน และรู้ว่าทุกอย่างเป็นเรื่องปกติ"
  - { type: check, problem: health.sexuality.puberty.p008 }
glossary:
  - { term: วัยเริ่มเจริญพันธุ์, definition: "ช่วงที่ร่างกายเปลี่ยนจากเด็กเป็นผู้ใหญ่และเริ่มสืบพันธุ์ได้ เริ่มได้ตามปกติตั้งแต่อายุ 8–14 ปี" }
  - { term: ประจำเดือน, definition: "เลือดและเยื่อบุผนังมดลูกที่หลุดออกทางช่องคลอดเมื่อไม่มีการตั้งครรภ์ มักนาน 2–7 วัน" }
  - { term: ความยาวรอบประจำเดือน, definition: "จำนวนวันนับจากวันแรกที่มีประจำเดือนถึงวันก่อนประจำเดือนครั้งถัดไป ส่วนใหญ่ 21–35 วัน" }
  - { term: การหลั่งน้ำอสุจิขณะหลับ, definition: "การหลั่งน้ำอสุจิระหว่างนอนหลับโดยไม่ได้ตั้งใจ หรือฝันเปียก เป็นเรื่องปกติของเด็กผู้ชายวัยรุ่น" }
flashcards:
  - { front: "การเข้าสู่วัยเริ่มเจริญพันธุ์เริ่มเมื่อไร", back: "ปกติอายุ 8–14 ปี ถ้าเริ่มก่อน 8 ปีหรือยังไม่เริ่มเมื่อ 15 ปี ควรปรึกษาแพทย์" }
  - { front: "ประจำเดือนครั้งแรก", back: "ส่วนใหญ่ราว 12 ปี (ช่วง 8–17 ปี) ช่วงแรกอาจมาไม่สม่ำเสมอ" }
  - { front: "ฝันเปียก", back: "การหลั่งน้ำอสุจิขณะหลับ เป็นเรื่องปกติ ไม่ใช่โรค ไม่ใช่ปัสสาวะ" }
  - { front: "สิวในวัยรุ่น", back: "ล้างหน้าวันละ 2 ครั้ง ไม่บีบหรือแกะ สิวมากปรึกษาเภสัชกรหรือแพทย์" }
  - { front: "ต้องรีบไปโรงพยาบาลทันที", back: "ปวดอัณฑะรุนแรงขึ้นมาทันที" }
