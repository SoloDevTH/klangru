id: thai.grammar.dictionary-use
subject: thai
title: { th: การใช้พจนานุกรม, en: "Using a Thai dictionary" }
summary: เรียงคำตามพยัญชนะ สระ และวรรณยุกต์แบบพจนานุกรมฉบับราชบัณฑิตยสถาน อ่านคำนำทาง คำตั้ง คำอ่าน ชนิดของคำ และเลือกความหมายให้ตรงบริบท
difficulty: 2
minutes: 25
prerequisites: [thai.writing.spelling-basics]
encompasses:
  - { id: thai.writing.spelling-basics, weight: 0.2 }
  - { id: thai.writing.consonants, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: dictionary-page.svg
    alt: "หน้าพจนานุกรมจำลอง หัวกระดาษมีคำนำทาง ขนม (ซ้าย) และ ขยัน (ขวา) คำตั้งในหน้าเรียงลงมา: ขนม [ขะ-หนม] น. ของกินที่ทำจากแป้ง น้ำตาล หรือกะทิ มักมีรสหวาน / ขนาด [ขะ-หนาด] น. ความใหญ่หรือเล็กของสิ่งต่าง ๆ / ขนุน [ขะ-หนุน] น. ไม้ยืนต้นชนิดหนึ่ง ผลใหญ่ เนื้อสีเหลือง รสหวาน / ขม ว. มีรสอย่างบอระเพ็ด / ขยัน [ขะ-หยัน] ว. ตั้งใจทำงานสม่ำเสมอ ไม่เกียจคร้าน ด้านขวาอธิบายสีของแต่ละส่วน: คำนำทาง คำตั้ง (ตัวหนา) คำอ่าน (วงเล็บเหลี่ยม) ชนิดของคำ (น. ก. ว.) ความหมาย"
    caption: "ส่วนต่าง ๆ ในหน้าพจนานุกรม (ความหมายเขียนใหม่โดยคลังรู้)"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: เรียงคำตามพจนานุกรม
    problem: "เรียงคำ เกม / กิน / กอด / กา ตามลำดับในพจนานุกรม"
    steps:
      - text: "ทุกคำอยู่หมวด ก (เกม ก็อยู่หมวด ก เพราะไม่นับสระหน้า)"
      - text: "ดูตัวถัดจาก ก: เกม = เ · กิน = ิ · กอด = อ · กา = า"
      - text: "อ เป็นพยัญชนะ จึงมาก่อน: กอด"
        why: "ในพจนานุกรม พยัญชนะมาก่อนรูปสระทุกตัว"
      - text: "สระเรียง ะ ั า ำ ิ ี ... เ แ โ ใ ไ: กา (า) → กิน (ิ) → เกม (เ)"
    answer: "กอด → กา → กิน → เกม"
  - { type: check, problem: thai.grammar.dictionary-use.p009, prompt: "อ เป็นพยัญชนะหรือสระ" }
  - type: worked-example
    title: เลือกความหมายจากหลายข้อ
    problem: "\"แม่ใช้ขันตักน้ำ\" คำว่า ขัน ใช้ความหมายข้อใด (ขัน ๑ น. ภาชนะ · ขัน ๒ ก. ร้องอย่างไก่ · ขัน ๓ ก. หมุนให้แน่น · ขัน ๔ ว. น่าหัวเราะ)"
    steps:
      - text: "ดูหน้าที่ในประโยค: แม่ใช้ ขัน ทำบางอย่าง ขัน เป็นสิ่งของ จึงเป็นคำนาม"
      - text: "ความหมายที่เป็นคำนามมีข้อเดียว คือ ขัน ๑"
      - text: "แทนลงในประโยค: แม่ใช้ภาชนะตักน้ำ ได้ความ"
        why: "การแทนความหมายลงในประโยคเป็นวิธีตรวจคำตอบที่ดีที่สุด"
    answer: "ขัน ๑ (น.) ภาชนะสำหรับตักหรือใส่น้ำ"
  - { type: check, problem: thai.grammar.dictionary-use.p007, prompt: "ขัน ในประโยคเป็นการกระทำหรือสิ่งของ" }
  - type: figure
    src: entry-khan.svg
    alt: "คำอธิบายศัพท์ในพจนานุกรมจำลอง: ขัน ๑ น. ภาชนะสำหรับตักหรือใส่น้ำ เช่น ใช้ขันตักน้ำ / ขัน ๒ ก. ร้องอย่างไก่ตัวผู้ เช่น ไก่ขันตอนเช้ามืด / ขัน ๓ ก. หมุนให้แน่น เช่น ขันน็อต ขันฝาขวด / ขัน ๔ ว. น่าหัวเราะ เช่น เรื่องนี้ขันดี"
    caption: "คำเดียวมีหลายความหมาย พจนานุกรมใส่เลขกำกับ"
glossary:
  - { term: พจนานุกรม, definition: "หนังสือรวบรวมคำ เรียงตามลำดับอักษร บอกวิธีอ่าน ชนิดของคำ และความหมาย" }
  - { term: คำตั้ง, definition: "คำที่พจนานุกรมอธิบาย พิมพ์ตัวหนาไว้ต้นคำอธิบาย" }
  - { term: คำนำทาง, definition: "คำแรกและคำสุดท้ายของหน้า พิมพ์ที่หัวกระดาษ ช่วยให้หาคำได้เร็ว" }
  - { term: คำอ่าน, definition: "วิธีอ่านออกเสียงที่เขียนในวงเล็บเหลี่ยม เช่น ขยัน [ขะ-หยัน]" }
  - { term: บริบท, definition: "ข้อความรอบ ๆ คำที่ช่วยบอกว่าคำนั้นใช้ในความหมายใด" }
flashcards:
  - { front: "เงิน อยู่หมวดใดในพจนานุกรม", back: "หมวด ง (ไม่นับสระหน้า เ)" }
  - { front: "พยัญชนะกับสระ อะไรมาก่อน", back: "พยัญชนะ เช่น กอด มาก่อน กะทิ" }
  - { front: "ลำดับรูปสระในพจนานุกรม", back: "ะ ั า ำ ิ ี ึ ื ุ ู เ แ โ ใ ไ" }
  - { front: "ขา ข่า ข้า เรียงอย่างไร", back: "ไม่มีวรรณยุกต์ก่อน แล้ว ่ ้ ๊ ๋ : ขา ข่า ข้า" }
  - { front: "ฤ อยู่ตรงไหนในพจนานุกรม", back: "ต่อจากหมวด ร ก่อนหมวด ล" }
