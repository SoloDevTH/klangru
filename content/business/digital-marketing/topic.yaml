id: business.marketing.digital-marketing
subject: business
title:
  th: การตลาดดิจิทัลและการวัดผล
  en: Digital marketing and metrics
summary: ช่องทางออนไลน์ กรวยการขาย ตัวชี้วัด CTR อัตราการเปลี่ยนเป็นผู้ซื้อ CPC CAC ROAS มูลค่าลูกค้าตลอดอายุ การทดลองแบบ A/B และการตลาดออนไลน์อย่างรับผิดชอบ
difficulty: 5
minutes: 40
prerequisites:
- business.marketing.marketing-mix
- business.stats.descriptive
