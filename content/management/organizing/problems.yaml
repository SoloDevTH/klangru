problems:
  - id: management.principles.organizing.p001
    topics: [management.principles.organizing]
    difficulty: 1
    type: mcq
    stem: "หัวหน้าพยาบาลหอผู้ป่วยอายุรกรรมมีพยาบาลรายงานต่อตนโดยตรง 14 คน ตัวเลข 14 นี้เรียกว่าอะไร"
    choices:
      - { id: a, text: "ช่วงการบังคับบัญชา", correct: true }
      - { id: b, text: "สายการบังคับบัญชา", feedback: "สายการบังคับบัญชาคือเส้นอำนาจจากบนลงล่างว่าใครรายงานต่อใคร ไม่ใช่จำนวนลูกน้อง" }
      - { id: c, text: "เอกภาพการบังคับบัญชา", feedback: "เอกภาพการบังคับบัญชาคือหลักที่ให้แต่ละคนมีหัวหน้าคนเดียว ไม่ได้นับจำนวนลูกน้อง" }
      - { id: d, text: "การแบ่งงานตามความชำนาญ", feedback: "การแบ่งงานคือการแยกงานใหญ่เป็นงานย่อย ไม่ใช่จำนวนคนที่รายงานต่อหัวหน้า" }
    hints:
      - "คำถามคือจำนวนคนที่รายงานต่อหัวหน้าหนึ่งคนโดยตรง"
      - "คำที่หมายถึงความกว้างของการดูแลของหัวหน้าคือคำใด"
    solution: "จำนวนผู้ใต้บังคับบัญชาที่รายงานต่อหัวหน้าหนึ่งคนโดยตรงคือช่วงการบังคับบัญชา หัวหน้าพยาบาลคนนี้มีช่วงการบังคับบัญชา 14 คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.organizing.p002
    topics: [management.principles.organizing]
    difficulty: 1
    type: match
    stem: "จับคู่รูปแบบโครงสร้างองค์การกับตัวอย่างที่ตรงที่สุด"
    pairs:
      - { left: "ตามหน้าที่", right: "บริษัทแบ่งเป็นฝ่ายผลิต ฝ่ายการตลาด ฝ่ายบัญชี" }
      - { left: "ตามผลิตภัณฑ์", right: "บริษัทแบ่งเป็นกลุ่มเครื่องดื่ม กลุ่มขนม กลุ่มอาหารแช่แข็ง" }
      - { left: "ตามพื้นที่", right: "บริษัทแบ่งเป็นสำนักงานภาคเหนือ ภาคอีสาน ภาคใต้" }
      - { left: "แบบเมทริกซ์", right: "วิศวกรสังกัดฝ่ายวิศวกรรมและทำงานให้ผู้จัดการโครงการไปพร้อมกัน" }
    hints:
      - "ดูว่าหน่วยงานระดับที่สองแบ่งตามเกณฑ์อะไร: ประเภทงาน สินค้า หรือพื้นที่"
      - "แบบที่พนักงานมีหัวหน้าสองสายคือแบบเมทริกซ์"
    solution: "แบ่งตามประเภทงานคือตามหน้าที่ ตามกลุ่มสินค้าคือตามผลิตภัณฑ์ ตามภาคคือตามพื้นที่ และพนักงานที่รายงานทั้งหัวหน้าฝ่ายและผู้จัดการโครงการคือแบบเมทริกซ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.organizing.p003
    topics: [management.principles.organizing]
    difficulty: 1
    type: mcq
    stem: "พนักงานคลังสินค้าคนหนึ่งได้รับคำสั่งจากหัวหน้าคลังให้จัดของล็อตหนึ่งก่อน แต่ผู้จัดการฝ่ายขายเดินมาสั่งให้จัดอีกล็อตก่อน ทั้งที่ไม่ใช่หัวหน้าโดยตรง สถานการณ์นี้ขัดกับหลักใดมากที่สุด"
    choices:
      - { id: a, text: "เอกภาพการบังคับบัญชา", correct: true }
      - { id: b, text: "ช่วงการบังคับบัญชา", feedback: "ช่วงการบังคับบัญชาคือจำนวนลูกน้องของหัวหน้า ปัญหานี้คือการได้รับคำสั่งจากสองคน" }
      - { id: c, text: "การกระจายอำนาจ", feedback: "การกระจายอำนาจคือการให้ระดับล่างตัดสินใจเอง ไม่ใช่การมีคนสั่งงานหลายคน" }
      - { id: d, text: "ความเป็นทางการ", feedback: "ความเป็นทางการคือระดับของกฎระเบียบที่เขียนไว้ ไม่ได้ตรงกับปัญหาคำสั่งขัดกัน" }
    hints:
      - "พนักงานได้รับคำสั่งจากกี่คน"
      - "หลักใดบอกว่าพนักงานหนึ่งคนควรมีหัวหน้าโดยตรงคนเดียว"
    solution: "เอกภาพการบังคับบัญชาให้พนักงานรับคำสั่งจากหัวหน้าโดยตรงคนเดียว เมื่อมีคนนอกสายสั่งงานซ้อน พนักงานจะได้คำสั่งขัดกัน ผู้จัดการฝ่ายขายควรประสานผ่านหัวหน้าคลัง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.organizing.p004
    topics: [management.principles.organizing]
    difficulty: 2
    type: numeric
    stem: "จากแผนผังองค์การของบริษัทนาคราชอาหารแช่แข็ง (บริษัทสมมติ) ในภาพ กรรมการผู้จัดการมีช่วงการบังคับบัญชากี่คน (ตอบเป็นจำนวนคน)"
    figure:
      src: p-orgchart.svg
      alt: "แผนผังองค์การ กรรมการผู้จัดการอยู่บนสุด มีที่ปรึกษากฎหมายต่อด้วยเส้นประด้านข้าง ใต้กรรมการผู้จัดการมีเส้นทึบลงไปยังผู้จัดการฝ่ายผลิต ฝ่ายขาย ฝ่ายบัญชี และฝ่ายบุคคล ใต้ผู้จัดการฝ่ายผลิตมีหัวหน้าแผนกแปรรูป แผนกบรรจุ และแผนกซ่อมบำรุง ใต้ผู้จัดการฝ่ายขายมีทีมขายภาคเหนือและทีมขายภาคใต้ ใต้หัวหน้าแผนกบรรจุมีพนักงานบรรจุ 2 คน คำอธิบายภาพ: เส้นทึบคือสายการบังคับบัญชา เส้นประคือหน่วยที่ปรึกษา"
    answer: { value: 4, unit: คน }
    hints:
      - "นับเฉพาะกล่องที่ต่อลงมาจากกรรมการผู้จัดการโดยตรงด้วยเส้นทึบ"
      - "ที่ปรึกษากฎหมายต่อด้วยเส้นประ เป็นหน่วยที่ปรึกษา"
    misconceptions:
      - { match: 5, feedback: "ที่ปรึกษากฎหมายต่อด้วยเส้นประ เป็นหน่วยที่ปรึกษา ไม่ได้อยู่ในสายการบังคับบัญชา" }
      - { match: 14, feedback: "นั่นคือการนับทุกคนที่อยู่ใต้ลงไปทุกระดับ ช่วงการบังคับบัญชานับเฉพาะผู้ที่รายงานโดยตรง" }
    solution: "ผู้ที่รายงานต่อกรรมการผู้จัดการโดยตรงด้วยเส้นทึบมี 4 คน คือผู้จัดการฝ่ายผลิต ขาย บัญชี และบุคคล ที่ปรึกษากฎหมายเป็นหน่วยที่ปรึกษา จึงไม่นับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.organizing.p005
    topics: [management.principles.organizing]
    difficulty: 2
    type: mcq
    stem: "จากแผนผังองค์การในภาพ ฝ่ายขายแบ่งหน่วยงานย่อยด้วยเกณฑ์ใด"
    figure:
      src: p-orgchart.svg
      alt: "แผนผังองค์การ กรรมการผู้จัดการอยู่บนสุด มีที่ปรึกษากฎหมายต่อด้วยเส้นประ ใต้กรรมการผู้จัดการมีผู้จัดการฝ่ายผลิต ฝ่ายขาย ฝ่ายบัญชี ฝ่ายบุคคล ใต้ฝ่ายผลิตมีหัวหน้าแผนกแปรรูป แผนกบรรจุ แผนกซ่อมบำรุง ใต้ฝ่ายขายมีทีมขายภาคเหนือและทีมขายภาคใต้ ใต้แผนกบรรจุมีพนักงานบรรจุ 2 คน"
    choices:
      - { id: a, text: "ตามพื้นที่", correct: true }
      - { id: b, text: "ตามหน้าที่", feedback: "ระดับที่สองของบริษัท (ผลิต ขาย บัญชี บุคคล) แบ่งตามหน้าที่ แต่ใต้ฝ่ายขายแบ่งเป็นภาคเหนือกับภาคใต้" }
      - { id: c, text: "ตามผลิตภัณฑ์", feedback: "ทีมขายทั้งสองไม่ได้แยกตามกลุ่มสินค้า แต่แยกตามภาคที่ดูแล" }
      - { id: d, text: "แบบเมทริกซ์", feedback: "ในภาพไม่มีใครรายงานต่อหัวหน้าสองสาย ทุกเส้นเป็นเส้นเดียวจากบนลงล่าง" }
    hints:
      - "ดูชื่อของสองกล่องใต้ผู้จัดการฝ่ายขาย"
      - "ภาคเหนือและภาคใต้คือการแบ่งด้วยอะไร"
    solution: "ใต้ฝ่ายขายมีทีมขายภาคเหนือและภาคใต้ จึงแบ่งตามพื้นที่ บริษัทนี้จึงเป็นโครงสร้างผสม ระดับบนแบ่งตามหน้าที่ แต่ฝ่ายขายแบ่งตามพื้นที่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.organizing.p006
    topics: [management.principles.organizing]
    difficulty: 2
    type: order
    stem: "จากแผนผังองค์การในภาพ เรียงสายการบังคับบัญชาของพนักงานบรรจุ จากตำแหน่งของพนักงานขึ้นไปถึงผู้บริหารสูงสุด"
    figure:
      src: p-orgchart.svg
      alt: "แผนผังองค์การ กรรมการผู้จัดการอยู่บนสุด มีที่ปรึกษากฎหมายต่อด้วยเส้นประ ใต้กรรมการผู้จัดการมีผู้จัดการฝ่ายผลิต ฝ่ายขาย ฝ่ายบัญชี ฝ่ายบุคคล ใต้ฝ่ายผลิตมีหัวหน้าแผนกแปรรูป แผนกบรรจุ แผนกซ่อมบำรุง ใต้ฝ่ายขายมีทีมขายภาคเหนือและทีมขายภาคใต้ ใต้แผนกบรรจุมีพนักงานบรรจุ 2 คน"
    items:
      - "พนักงานบรรจุ"
      - "หัวหน้าแผนกบรรจุ"
      - "ผู้จัดการฝ่ายผลิต"
      - "กรรมการผู้จัดการ"
    hints:
      - "เริ่มที่กล่องของพนักงานบรรจุ แล้วไล่เส้นทึบขึ้นไปทีละกล่อง"
      - "ที่ปรึกษากฎหมายไม่ได้อยู่ในสายนี้"
    solution: "พนักงานบรรจุ → หัวหน้าแผนกบรรจุ → ผู้จัดการฝ่ายผลิต → กรรมการผู้จัดการ ไล่ตามเส้นทึบขึ้นไปทีละระดับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.organizing.p007
    topics: [management.principles.organizing]
    difficulty: 2
    type: numeric
    stem: "โรงพยาบาลชุมชนแห่งหนึ่ง (สมมติ) มีผู้ช่วยเหลือคนไข้ 120 คน ถ้ากำหนดให้หัวหน้าเวรแต่ละคนดูแลผู้ช่วยเหลือคนไข้โดยตรง 12 คน ต้องมีหัวหน้าเวรกี่คน (ตอบเป็นจำนวนคน)"
    answer: { value: 10, unit: คน }
    hints:
      - "จำนวนหัวหน้า = จำนวนพนักงาน ÷ ช่วงการบังคับบัญชา"
      - "ถ้าหารไม่ลงตัวต้องปัดขึ้น"
    misconceptions:
      - { match: 1440, feedback: "ต้องหาร ไม่ใช่คูณ หัวหน้าหนึ่งคนดูแล 12 คน" }
      - { match: 132, feedback: "นั่นคือจำนวนคนรวมหัวหน้า โจทย์ถามเฉพาะจำนวนหัวหน้าเวร" }
    solution: "$120 \\div 12 = 10$ คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.organizing.p008
    topics: [management.principles.organizing]
    difficulty: 3
    type: numeric
    stem: "โรงงานประกอบอุปกรณ์อิเล็กทรอนิกส์แห่งหนึ่งมีพนักงานระดับปฏิบัติ 4,096 คน ถ้าหัวหน้าทุกระดับดูแลลูกน้องโดยตรง 8 คน ต้องมีหัวหน้าและผู้จัดการรวมทุกระดับ (รวมผู้บริหารสูงสุด 1 คน) กี่คน (ตอบเป็นจำนวนคน)"
    answer: { value: 585, unit: คน }
    hints:
      - "หารด้วย 8 ซ้ำทีละระดับ: 4,096 ÷ 8 แล้วนำผลมาหาร 8 อีก จนเหลือ 1"
      - "รวมจำนวนหัวหน้าของทุกระดับเข้าด้วยกัน"
    misconceptions:
      - { match: 512, feedback: "นั่นคือหัวหน้าระดับแรกเท่านั้น ยังต้องมีหัวหน้าของหัวหน้าอีกหลายระดับ" }
      - { match: 584, feedback: "ลืมนับผู้บริหารสูงสุด 1 คน" }
    solution: "ระดับต่าง ๆ: $4{,}096 \\div 8 = 512$, $512 \\div 8 = 64$, $64 \\div 8 = 8$, $8 \\div 8 = 1$ รวม $512 + 64 + 8 + 1 = 585$ คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.organizing.p009
    topics: [management.principles.organizing]
    difficulty: 3
    type: numeric
    stem: "องค์กรหนึ่งมีพนักงานระดับปฏิบัติ 729 คน หัวหน้าทุกคนดูแลลูกน้องโดยตรง 9 คน จะมีระดับผู้บังคับบัญชาเหนือพนักงานระดับปฏิบัติกี่ระดับ (นับรวมระดับผู้บริหารสูงสุด ตอบเป็นจำนวนระดับ)"
    answer: { value: 3, unit: ระดับ }
    hints:
      - "หาร 9 ซ้ำไปเรื่อย ๆ นับว่าหารกี่ครั้งจึงเหลือ 1"
      - "$9^3 = 729$"
    misconceptions:
      - { match: 81, feedback: "81 คือจำนวนหัวหน้าระดับแรก โจทย์ถามจำนวนระดับ" }
      - { match: 91, feedback: "91 คือจำนวนหัวหน้ารวมทุกระดับ ($81 + 9 + 1$) โจทย์ถามจำนวนระดับ" }
    solution: "$729 \\div 9 = 81$ (ระดับ 1), $81 \\div 9 = 9$ (ระดับ 2), $9 \\div 9 = 1$ (ระดับ 3) จึงมี 3 ระดับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.organizing.p010
    topics: [management.principles.organizing]
    difficulty: 4
    type: numeric
    stem: "บริษัทที่มีพนักงานระดับปฏิบัติ 4,096 คน กำลังเปลี่ยนช่วงการบังคับบัญชาจาก 4 คนเป็น 8 คนในทุกระดับ จำนวนหัวหน้าและผู้จัดการรวมทุกระดับ (รวมผู้บริหารสูงสุด) จะลดลงกี่คน (ตอบเป็นจำนวนคน)"
    answer: { value: 780, unit: คน }
    hints:
      - "คำนวณจำนวนหัวหน้ารวมทุกระดับของแต่ละแบบแยกกัน แล้วลบกัน"
      - "ช่วง 4: 1,024 + 256 + ... จนถึง 1 ช่วง 8: 512 + 64 + ... จนถึง 1"
    misconceptions:
      - { match: 512, feedback: "นั่นคือผลต่างเฉพาะระดับล่างสุด (1,024 − 512) ต้องรวมทุกระดับ" }
      - { match: 1365, feedback: "นั่นคือจำนวนหัวหน้าทั้งหมดของช่วง 4 ยังต้องลบด้วยของช่วง 8" }
    solution: "ช่วง 4: $1{,}024 + 256 + 64 + 16 + 4 + 1 = 1{,}365$ คน (6 ระดับ) ช่วง 8: $512 + 64 + 8 + 1 = 585$ คน (4 ระดับ) ลดลง $1{,}365 - 585 = 780$ คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.organizing.p011
