      - { id: b, text: "นักเขียนได้ค่าลิขสิทธิ์จากหนังสือ จึงมีเงินเขียนเล่มต่อไป", feedback: "เป็นผลดีของกฎหมาย คือสร้างแรงจูงใจให้สร้างงานใหม่" }
      - { id: c, text: "ผู้พัฒนาเกมเลือกเปิดซอร์สด้วยสัญญา MIT", feedback: "เป็นการเลือกแบ่งปันของผู้สร้าง ไม่ใช่ผลเสียของกฎหมาย" }
      - { id: d, text: "ศิลปินฟ้องร้องคนที่นำเพลงไปขายโดยไม่ได้รับอนุญาต", feedback: "เป็นการคุ้มครองผู้สร้างตามวัตถุประสงค์ของกฎหมาย" }
    hints:
      - "กฎหมายคุ้มครองผู้สร้าง แต่ถ้ากว้างหรือนานเกินไปจะกระทบใคร"
      - "หาข้อที่คนอื่นต่อยอดหรือสร้างสิ่งใหม่ได้ยากขึ้น"
    solution: "การคุ้มครองที่กว้างเกินไปอาจกีดกันการต่อยอด ผู้พัฒนาใหม่สร้างสิ่งที่ทำงานร่วมกันหรือดีกว่าเดิมได้ยาก ข้อ ข และ ง เป็นผลดี ข้อ ค เป็นทางเลือกของผู้สร้าง"
