topic: math.calculus.inverse-function-calculus
rows:
  - { framework: university-foundations, indicators: ["CALC1 3.7"], coverage: full, note: "อนุพันธ์ของฟังก์ชันผกผัน (f^-1)'(a) = 1/f'(f^-1(a)) พร้อมเงื่อนไข f' ≠ 0 และอนุพันธ์ของ arcsin arccos arctan กับ x^(m/n)" }
  - { framework: university-foundations, indicators: ["CALC1 5.4", "CALC2 1.4"], coverage: full, note: "ตารางปริพันธ์พื้นฐานของ sin cos sec^2 e^x a^x และ 1/x ทฤษฎีบทการเปลี่ยนแปลงสุทธิ และความต่างระหว่างระยะทางกับการกระจัด" }
  - { framework: university-foundations, indicators: ["CALC1 5.6", "CALC2 1.6"], coverage: full, note: "ปริพันธ์ที่ได้ ln|u| และ e^u ด้วยการแทนค่า (รูป g'/g และ g'e^g) ปริพันธ์ของ a^x และตัวอย่าง ∫x/(x²+1)dx กับ ∫e^(2x)dx" }
  - { framework: university-foundations, indicators: ["CALC1 5.7", "CALC2 1.7"], coverage: full, note: "ปริพันธ์ ∫du/√(a²−u²) และ ∫du/(a²+u²) ที่ได้ฟังก์ชันตรีโกณมิติผกผัน รวมการเติมกำลังสองและปริพันธ์ของฟังก์ชันคู่หรือคี่บนช่วงสมมาตร" }
