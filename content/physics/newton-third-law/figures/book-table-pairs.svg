<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" font-family="sans-serif" font-size="15">
  <title>หนังสือวางบนโต๊ะ แรงที่กระทำต่อหนังสือและแรงที่หนังสือกระทำต่อโต๊ะและโลก</title>
  <rect x="0" y="0" width="560" height="340" fill="#ffffff"/>
  <rect x="150" y="170" width="260" height="14" rx="0" fill="#d9c7a6" stroke="#15211e" stroke-width="2"/>
  <line x1="170" y1="184" x2="170" y2="300" stroke="#15211e" stroke-width="4" stroke-linecap="round"/>
  <line x1="390" y1="184" x2="390" y2="300" stroke="#15211e" stroke-width="4" stroke-linecap="round"/>
  <line x1="40" y1="300" x2="520" y2="300" stroke="#15211e" stroke-width="2.5" stroke-linecap="round"/>
  <text x="500" y="322" font-size="13" fill="#6b7472" text-anchor="end">โลก</text>
  <rect x="240" y="140" width="80" height="30" rx="0" fill="#cfe0f3" stroke="#15211e" stroke-width="2"/>
  <line x1="268" y1="155" x2="268" y2="214" stroke="#b4521f" stroke-width="3" stroke-linecap="round"/><polygon points="268,225 263.1,214 272.9,214" fill="#b4521f" stroke="#b4521f" stroke-width="1" stroke-linejoin="round"/>
  <line x1="292" y1="155" x2="292" y2="96" stroke="#0a6b60" stroke-width="3" stroke-linecap="round"/><polygon points="292,85 296.9,96 287.1,96" fill="#0a6b60" stroke="#0a6b60" stroke-width="1" stroke-linejoin="round"/>
  <line x1="305" y1="172" x2="305" y2="216" stroke="#0a6b60" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/><polygon points="305,227 300.1,216 309.9,216" fill="#0a6b60" stroke="#0a6b60" stroke-width="1" stroke-linejoin="round"/>
  <line x1="280" y1="300" x2="280" y2="256" stroke="#b4521f" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/><polygon points="280,245 284.9,256 275.1,256" fill="#b4521f" stroke="#b4521f" stroke-width="1" stroke-linejoin="round"/>
  <circle cx="280" cy="155" r="3.5" fill="#15211e" stroke="#15211e" stroke-width="1"/>
  <text x="260" y="221" font-size="13" fill="#b4521f" text-anchor="end">โลกดึงหนังสือ (W)</text>
  <text x="300" y="95" font-size="13" fill="#0a6b60">โต๊ะดันหนังสือ (N)</text>
  <text x="312" y="220" font-size="13" fill="#0a6b60">หนังสือกดโต๊ะ</text>
  <text x="288" y="262" font-size="13" fill="#b4521f">หนังสือดึงโลก</text>
  <text x="40" y="30" font-size="13">เส้นทึบ: แรงที่กระทำต่อหนังสือ</text>
  <text x="40" y="50" font-size="13">เส้นประ: แรงที่หนังสือกระทำต่อสิ่งอื่น</text>
  <text x="40" y="70" font-size="13" fill="#6b7472">สีเดียวกัน = คู่กิริยา–ปฏิกิริยา</text>
</svg>
