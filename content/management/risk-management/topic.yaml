id: management.project.risk-management
subject: management
title: { th: การบริหารความเสี่ยงในองค์กรและโครงการ, en: Risk management in organizations and projects }
summary: ทะเบียนความเสี่ยง เมทริกซ์โอกาสและผลกระทบ มูลค่าเงินที่คาดหมาย ต้นไม้การตัดสินใจ FMEA และ RPN กลยุทธ์ตอบสนองภัยคุกคามและโอกาส ความต่อเนื่องทางธุรกิจ และการติดตาม
difficulty: 6
minutes: 40
prerequisites: [management.project.project-fundamentals, math.prob.probability]
encompasses:
  - { id: math.prob.probability, weight: 0.3 }
  - { id: management.project.project-fundamentals, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: heat-map.svg
    alt: "เมทริกซ์ 5 คูณ 5 แกนนอนผลกระทบ 1 ถึง 5 แกนตั้งโอกาสเกิด 1 ถึง 5 แต่ละช่องระบายสีตามคะแนนโอกาสคูณผลกระทบ เขียว 1–4 ต่ำ เหลือง 5–9 ปานกลาง ส้ม 10–14 สูง แดง 15–25 สูงมาก ความเสี่ยงของโรงพยาบาลชุมชน (สมมติ) R1 ไฟฟ้าดับระหว่างผ่าตัด โอกาส 2 ผลกระทบ 5 คะแนน 10 · R2 ให้ยาผิดคน 3 × 4 = 12 · R3 ผู้ป่วยพลัดตกเตียง 4 × 3 = 12 · R4 เวชระเบียนถูกโจมตีทางไซเบอร์ 2 × 4 = 8 · R5 น้ำท่วมทางเข้าโรงพยาบาล 3 × 3 = 9 · R6 ขาดพยาบาลเวรดึก 4 × 2 = 8 หมายเหตุเกณฑ์แบ่งระดับเป็นตัวอย่าง แต่ละองค์กรกำหนดเอง"
    caption: "เมทริกซ์ความเสี่ยงของโรงพยาบาลชุมชน (ข้อมูลสมมติ)"
  - type: worked-example
    title: มาตรการลดความเสี่ยงคุ้มหรือไม่
    problem: "โรงพยาบาลชุมชน (สมมติ) ประเมินว่าปีนี้มีโอกาส 0.25 ที่น้ำจะท่วมทางเข้าจนรถพยาบาลเข้าไม่ได้ ความเสียหายรวมประมาณ 1,600,000 บาท ถ้าลงทุนทำแนวกันน้ำชั่วคราวและทางลาดสำรอง 150,000 บาท โอกาสจะลดเหลือ 0.10 ควรลงทุนหรือไม่"
    steps:
      - text: "EMV ก่อนมาตรการ $0.25 \\times 1{,}600{,}000 = 400{,}000$ บาท"
      - text: "EMV หลังมาตรการ $0.10 \\times 1{,}600{,}000 = 160{,}000$ บาท"
      - text: "ความเสียหายคาดหมายที่ลดได้ $400{,}000 - 160{,}000 = 240{,}000$ บาท"
      - text: "ประโยชน์สุทธิ $240{,}000 - 150{,}000 = 90{,}000$ บาทต่อปี จึงคุ้ม"
        why: "เทียบความเสียหายคาดหมายที่ลดได้กับค่าใช้จ่ายของมาตรการ ไม่ใช่เทียบกับความเสียหายเต็ม 1.6 ล้านบาท"
      - text: "ยังเหลือความเสี่ยงคงเหลือ EMV 160,000 บาท ต้องมีแผนเผชิญเหตุสำหรับกรณีที่น้ำยังท่วม"
    answer: "ควรลงทุน ได้ประโยชน์สุทธิคาดหมาย 90,000 บาทต่อปี"
  - { type: check, problem: management.project.risk-management.p004 }
  - type: worked-example
    title: โอกาสที่อย่างน้อยหนึ่งความเสี่ยงจะเกิด
    problem: "โครงการติดตั้งระบบเวชระเบียนใหม่ (สมมติ) มีความเสี่ยงอิสระกันสี่ข้อ โอกาสเกิด 0.10, 0.05, 0.20 และ 0.15 โอกาสที่จะเกิดอย่างน้อยหนึ่งข้อเป็นเท่าไร"
    steps:
      - text: "โอกาสที่แต่ละข้อไม่เกิด $0.90,\\ 0.95,\\ 0.80,\\ 0.85$"
      - text: "โอกาสที่ไม่เกิดเลยสักข้อ $0.90 \\times 0.95 \\times 0.80 \\times 0.85 = 0.5814$"
        why: "เหตุการณ์อิสระกัน ความน่าจะเป็นที่ไม่เกิดทุกข้อจึงคูณกันได้"
      - text: "โอกาสเกิดอย่างน้อยหนึ่งข้อ $1 - 0.5814 = 0.4186$"
      - text: "ถ้าบวกตรง ๆ จะได้ 0.50 ซึ่งเกินจริง และถ้ามีความเสี่ยงมากข้อผลบวกอาจเกิน 1 ซึ่งเป็นไปไม่ได้"
    answer: "ประมาณ 0.42 หรือ 42%"
  - { type: check, problem: management.project.risk-management.p008 }
  - type: figure
    src: p-tree.svg
    alt: "ต้นไม้การตัดสินใจ จุดตัดสินใจรูปสี่เหลี่ยมแยกสองทาง ก. ซื้อเครื่องใหม่ จ่ายทันที 300,000 บาท แล้วแยกเป็น ไฟดับนาน ความน่าจะเป็น 0.15 ความเสียหาย 200,000 บาท และไฟไม่ดับนาน 0.85 ความเสียหาย 0 · ข. ไม่ซื้อ จ่ายทันที 0 แล้วแยกเป็น ไฟดับนาน 0.15 ความเสียหาย 2,500,000 บาท และไฟไม่ดับนาน 0.85 ความเสียหาย 0"
    caption: "ต้นไม้การตัดสินใจเรื่องเครื่องกำเนิดไฟฟ้าสำรอง (ข้อมูลสมมติ ใช้ในโจทย์ข้อ 9)"
glossary:
  - { term: ความเสี่ยง, definition: "เหตุการณ์ไม่แน่นอนที่ถ้าเกิดจะกระทบเป้าหมาย อาจเป็นภัยคุกคามหรือโอกาส" }
  - { term: ทะเบียนความเสี่ยง, definition: "ตารางบันทึกความเสี่ยงทุกข้อ พร้อมสาเหตุ คะแนน วิธีตอบสนอง เจ้าของ สัญญาณเตือน และสถานะ" }
  - { term: มูลค่าเงินที่คาดหมาย (EMV), definition: "ความน่าจะเป็นคูณผลกระทบเป็นเงิน ภัยคุกคามเป็นลบ โอกาสเป็นบวก" }
  - { term: เงินสำรองเผื่อเหตุ, definition: "เงินที่กันไว้รองรับความเสี่ยงที่ระบุแล้ว มักตั้งจากผลรวม EMV" }
  - { term: RPN, definition: "ค่าลำดับความสำคัญของความเสี่ยงใน FMEA เท่ากับความรุนแรง × โอกาสเกิด × ความยากในการตรวจพบ" }
  - { term: ความเสี่ยงทุติยภูมิ, definition: "ความเสี่ยงใหม่ที่เกิดจากมาตรการตอบสนองความเสี่ยงเดิม" }
  - { term: แผนความต่อเนื่องทางธุรกิจ, definition: "แผนให้กระบวนการสำคัญกลับมาทำงานภายในเวลาที่กำหนดเมื่อเกิดเหตุร้ายแรง" }
flashcards:
  - { front: "ความเสี่ยงกับปัญหาต่างกันอย่างไร", back: "ความเสี่ยงยังไม่เกิดและไม่แน่นอน ปัญหาเกิดขึ้นแล้ว" }
  - { front: "EMV", back: "ความน่าจะเป็น × ผลกระทบเป็นเงิน (ภัยคุกคามลบ โอกาสบวก)" }
  - { front: "RPN", back: "S × O × D (ความรุนแรง × โอกาสเกิด × ความยากในการตรวจพบ)" }
  - { front: "ตอบสนองภัยคุกคามสี่แบบ", back: "หลีกเลี่ยง · ลด · ถ่ายโอน · ยอมรับ" }
  - { front: "โอกาสเกิดอย่างน้อยหนึ่งความเสี่ยง", back: "1 − (1 − p₁)(1 − p₂)…(1 − pₙ)" }
