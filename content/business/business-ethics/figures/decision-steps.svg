<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200" font-family="sans-serif" font-size="14">
  <title>ห้าขั้นของการตัดสินใจเชิงจริยธรรม</title>
  <rect x="0" y="0" width="760" height="200" fill="#ffffff"/>
  <rect x="10.0" y="40.0" width="138.0" height="90.0" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="79.0" y="80.8" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">1. รวบรวม</text>
  <text x="79.0" y="98.3" text-anchor="middle" fill="#1f2937" font-size="13">ข้อเท็จจริง</text>
  <line x1="148.0" y1="85.0" x2="155.8" y2="85.0" stroke="#1f2937" stroke-width="2"/>
  <polygon points="160.0,85.0 153.6,87.7 153.6,82.3" fill="#1f2937"/>
  <rect x="160.0" y="40.0" width="138.0" height="90.0" rx="8" fill="#fef3c7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="229.0" y="80.8" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">2. ระบุประเด็น</text>
  <text x="229.0" y="98.3" text-anchor="middle" fill="#1f2937" font-size="13">และผู้มีส่วนได้เสีย</text>
  <line x1="298.0" y1="85.0" x2="305.8" y2="85.0" stroke="#1f2937" stroke-width="2"/>
  <polygon points="310.0,85.0 303.6,87.7 303.6,82.3" fill="#1f2937"/>
  <rect x="310.0" y="40.0" width="138.0" height="90.0" rx="8" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="379.0" y="80.8" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">3. หาทางเลือก</text>
  <text x="379.0" y="98.3" text-anchor="middle" fill="#1f2937" font-size="13">ให้ครบ</text>
  <line x1="448.0" y1="85.0" x2="455.8" y2="85.0" stroke="#1f2937" stroke-width="2"/>
  <polygon points="460.0,85.0 453.6,87.7 453.6,82.3" fill="#1f2937"/>
  <rect x="460.0" y="40.0" width="138.0" height="90.0" rx="8" fill="#ede9fe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="529.0" y="72.0" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">4. ประเมิน</text>
  <text x="529.0" y="89.5" text-anchor="middle" fill="#1f2937" font-size="13">กฎหมาย จรรยาบรรณ</text>
  <text x="529.0" y="107.1" text-anchor="middle" fill="#1f2937" font-size="13">ผลกระทบ</text>
  <line x1="598.0" y1="85.0" x2="605.8" y2="85.0" stroke="#1f2937" stroke-width="2"/>
  <polygon points="610.0,85.0 603.6,87.7 603.6,82.3" fill="#1f2937"/>
  <rect x="610.0" y="40.0" width="138.0" height="90.0" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/>
  <text x="679.0" y="80.8" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">5. ตัดสินใจ</text>
  <text x="679.0" y="98.3" text-anchor="middle" fill="#1f2937" font-size="13">ลงมือ และบันทึก</text>
  <text x="380.0" y="165.0" text-anchor="middle" fill="#6b7280" font-size="13">คำถามทดสอบ: ถ้าเรื่องนี้ลงข่าวพรุ่งนี้ เราจะอธิบายได้อย่างสบายใจหรือไม่</text>
</svg>
