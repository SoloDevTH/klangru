id: biology.plants.photosynthesis-intro
subject: biology
title: { th: การสังเคราะห์ด้วยแสงเบื้องต้น, en: "Introduction to photosynthesis" }
summary: ปัจจัยที่จำเป็น (แสง คลอโรฟิลล์ น้ำ แก๊สคาร์บอนไดออกไซด์) ผลผลิตคือน้ำตาลและออกซิเจน หลักฐานจากการทดลอง ความสำคัญต่อสิ่งมีชีวิตและสิ่งแวดล้อม และการร่วมปลูกดูแลต้นไม้
difficulty: 3
minutes: 35
prerequisites: [biology.cells.cell-basics]
encompasses:
  - { id: biology.cells.cell-basics, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: สิ่งที่ใบใช้และผลผลิต
    src: leaf-inputs-outputs.svg
    alt: "ใบไม้สีเขียวมีป้ายคลอโรฟิลล์ในคลอโรพลาสต์ ลูกศรสีเหลืองจากดวงอาทิตย์คือแสงเข้าสู่ใบ ลูกศรสีเทาคือแก๊สคาร์บอนไดออกไซด์เข้าทางปากใบ ลูกศรสีฟ้าจากก้านใบคือน้ำจากราก ลูกศรสีน้ำเงินออกจากใบคือแก๊สออกซิเจนออกทางปากใบ และลูกศรสีชมพูออกจากใบคือน้ำตาลที่เปลี่ยนเป็นแป้งและส่งไปส่วนอื่นของพืช"
    caption: "วัตถุดิบคือแก๊สคาร์บอนไดออกไซด์และน้ำ ใช้พลังงานแสงที่คลอโรฟิลล์ดูดกลืน ได้น้ำตาลและออกซิเจน (วาดโดยทีมคลังรู้)"
  - type: figure
    title: ขั้นตอนการตรวจหาแป้งในใบ
    src: starch-test.svg
    alt: "4 ขั้นเรียงจากซ้ายไปขวา 1 ต้มใบสีเขียวในบีกเกอร์น้ำเดือดบนตะเกียงราว 1 นาที 2 แช่ใบในหลอดแอลกอฮอล์ที่ตั้งอยู่ในบีกเกอร์น้ำร้อน ใบซีดเป็นสีขาว 3 ล้างใบสีขาวในจานน้ำอุ่นให้นิ่ม 4 หยดสารละลายไอโอดีนจากหลอดหยดลงบนใบในจาน ใบที่มีแป้งเป็นสีน้ำเงินดำ"
    caption: "แอลกอฮอล์ติดไฟง่าย ต้องอุ่นในน้ำร้อน ห้ามตั้งบนไฟโดยตรง (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ออกแบบการทดลองว่าต้องใช้แสงหรือไม่
    problem: "ออกแบบการทดลองเพื่อตรวจว่าการสังเคราะห์ด้วยแสงต้องใช้แสงหรือไม่ โดยใช้ต้นชบาในกระถาง กระดาษสีดำ และชุดตรวจหาแป้ง"
    steps:
      - text: "นำกระถางไว้ในที่มืด 2 วัน ให้แป้งเดิมในใบถูกใช้ไป"
        why: "ถ้ามีแป้งเก่าค้างอยู่ จะบอกไม่ได้ว่าแป้งที่พบเกิดระหว่างการทดลองหรือไม่"
      - text: "ใช้กระดาษสีดำหนีบปิดใบเพียงบางส่วน ทั้งด้านบนและด้านล่างของใบ ส่วนที่ไม่ปิดเป็นชุดควบคุม"
      - text: "ตั้งกระถางกลางแดด 4–6 ชั่วโมง แล้วเด็ดใบนั้นมาตรวจหาแป้ง"
      - text: "ถ้าส่วนที่ปิดเป็นสีน้ำตาล ส่วนที่ไม่ปิดเป็นสีน้ำเงินดำ แสดงว่าต้องใช้แสง"
    answer: "ตัวแปรต้นคือแสง ตัวแปรตามคือการมีแป้ง ตัวแปรควบคุมคือใบเดียวกัน เวลาเท่ากัน และวิธีตรวจแบบเดียวกัน"
  - { type: check, problem: biology.plants.photosynthesis-intro.p004, prompt: "นึกถึงสีของไอโอดีนเมื่อพบแป้ง" }
  - type: worked-example
    title: เทียบอัตราการเกิดฟองแก๊ส
    problem: "สาหร่ายหางกระรอกที่วางห่างหลอดไฟ 15 เซนติเมตร ปล่อยฟองแก๊ส 120 ฟองใน 3 นาที เมื่อเลื่อนหลอดไฟไปห่าง 45 เซนติเมตร นับได้ 39 ฟองใน 3 นาที อัตราการเกิดฟองต่อนาทีลดลงกี่ฟอง"
    steps:
      - text: "ที่ 15 เซนติเมตร: $120 \\div 3 = 40$ ฟองต่อนาที"
        why: "เปลี่ยนเป็นจำนวนต่อนาทีเพื่อเทียบอัตรา"
      - text: "ที่ 45 เซนติเมตร: $39 \\div 3 = 13$ ฟองต่อนาที"
      - text: "ลดลง $40 - 13 = 27$ ฟองต่อนาที เพราะแสงที่ไกลขึ้นอ่อนลง"
    answer: "ลดลง 27 ฟองต่อนาที"
  - { type: check, problem: biology.plants.photosynthesis-intro.p007, prompt: "บริเวณที่สร้างแป้งได้ต้องมีครบทั้งสองอย่าง" }
glossary:
  - { term: การสังเคราะห์ด้วยแสง, definition: "กระบวนการที่พืชใช้พลังงานแสงเปลี่ยนแก๊สคาร์บอนไดออกไซด์และน้ำเป็นน้ำตาล และได้แก๊สออกซิเจน" }
  - { term: คลอโรฟิลล์, definition: "สารสีเขียวในคลอโรพลาสต์ ทำหน้าที่ดูดกลืนพลังงานแสง" }
  - { term: คลอโรพลาสต์, definition: "ออร์แกเนลล์ในเซลล์พืชที่มีคลอโรฟิลล์ เป็นที่เกิดการสังเคราะห์ด้วยแสง" }
  - { term: ปากใบ, definition: "รูเล็ก ๆ ที่ผิวใบ เป็นทางเข้าออกของแก๊สและไอน้ำ" }
  - { term: สารละลายไอโอดีน, definition: "สารสีน้ำตาลที่ใช้ทดสอบแป้ง เมื่อเจอแป้งจะเปลี่ยนเป็นสีน้ำเงินดำ" }
flashcards:
  - { front: "ปัจจัยที่จำเป็นต่อการสังเคราะห์ด้วยแสง", back: "แสง คลอโรฟิลล์ น้ำ แก๊สคาร์บอนไดออกไซด์" }
  - { front: "ผลผลิตของการสังเคราะห์ด้วยแสง", back: "น้ำตาล (เปลี่ยนเป็นแป้งเก็บไว้) และแก๊สออกซิเจน" }
  - { front: "ใบด่างใช้พิสูจน์อะไร", back: "ต้องใช้คลอโรฟิลล์ เพราะเฉพาะส่วนสีเขียวมีแป้ง" }
  - { front: "ทดสอบแก๊สออกซิเจนอย่างไร", back: "สอดธูปที่เหลือแต่ถ่านแดงเข้าไป ธูปลุกเป็นเปลว" }
  - { front: "มวลของต้นไม้มาจากไหนเป็นส่วนใหญ่", back: "แก๊สคาร์บอนไดออกไซด์ในอากาศและน้ำ ไม่ใช่ดิน" }
