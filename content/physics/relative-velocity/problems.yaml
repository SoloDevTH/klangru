    answer: { value: 75, tolerance: 0.5, unit: s }
    hints:
      - ต้องหาก่อนว่าหัวเรือต้องทำมุมเท่าไร โดยองค์ประกอบทวนน้ำเท่ากับกระแสน้ำ
      - ความเร็วข้ามฝั่งคือ $5\cos\theta$ แล้วจึงหาเวลา
    misconceptions:
      - { match: 60, feedback: 'หันหัวเรือตั้งฉากทำให้เวลาน้อยที่สุดแต่เรือจะถูกพัดไปไม่ถึงจุดตรงข้าม' }
      - { match: 100, feedback: 'ใช้องค์ประกอบทวนน้ำแทนองค์ประกอบข้ามฝั่งในการหาเวลา' }
    solution: '$\sin\theta = \frac{3}{5}$ จึงได้ $\cos\theta = 0.8$ ความเร็วข้ามฝั่ง $= 5 \times 0.8 = 4\,\mathrm{m/s}$ และ $t = \frac{300}{4} = 75\,\mathrm{s}$'
