<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="sans-serif">
<title>โครงสร้าง OREO ของการแสดงความคิดเห็น</title>
<rect x="0" y="0" width="700" height="400" fill="#fff"/>
<text x="350.0" y="32.0" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">O-R-E-O: ความเห็น → เหตุผล → ตัวอย่าง → สรุปความเห็น</text>
<rect x="30.0" y="56.0" width="640.0" height="72.0" rx="30" fill="#5b3a29" stroke="#3b2418" stroke-width="2"/>
<circle cx="74.0" cy="92.0" r="24.0" fill="#fff" stroke="#3b2418" stroke-width="2"/>
<text x="74.0" y="100.0" font-size="22" text-anchor="middle" fill="#3b2418" font-weight="bold">O</text>
<text x="112.0" y="86.0" font-size="16" text-anchor="start" fill="#fff" font-weight="bold">Opinion</text>
<text x="112.0" y="112.0" font-size="16" text-anchor="start" fill="#fff" font-weight="normal" font-style="italic">I think students should learn to swim at school.</text>
<rect x="30.0" y="138.0" width="640.0" height="72.0" rx="30" fill="#f5efe0" stroke="#3b2418" stroke-width="2"/>
<circle cx="74.0" cy="174.0" r="24.0" fill="#fff" stroke="#3b2418" stroke-width="2"/>
<text x="74.0" y="182.0" font-size="22" text-anchor="middle" fill="#3b2418" font-weight="bold">R</text>
<text x="112.0" y="168.0" font-size="16" text-anchor="start" fill="#111" font-weight="bold">Reason</text>
<text x="112.0" y="194.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal" font-style="italic">because Thailand has many rivers, canals and beaches.</text>
<rect x="30.0" y="220.0" width="640.0" height="72.0" rx="30" fill="#f5efe0" stroke="#3b2418" stroke-width="2"/>
<circle cx="74.0" cy="256.0" r="24.0" fill="#fff" stroke="#3b2418" stroke-width="2"/>
<text x="74.0" y="264.0" font-size="22" text-anchor="middle" fill="#3b2418" font-weight="bold">E</text>
<text x="112.0" y="250.0" font-size="16" text-anchor="start" fill="#111" font-weight="bold">Example</text>
<text x="112.0" y="276.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal" font-style="italic">For example, every student at my cousin's school can swim.</text>
<rect x="30.0" y="302.0" width="640.0" height="72.0" rx="30" fill="#5b3a29" stroke="#3b2418" stroke-width="2"/>
<circle cx="74.0" cy="338.0" r="24.0" fill="#fff" stroke="#3b2418" stroke-width="2"/>
<text x="74.0" y="346.0" font-size="22" text-anchor="middle" fill="#3b2418" font-weight="bold">O</text>
<text x="112.0" y="332.0" font-size="16" text-anchor="start" fill="#fff" font-weight="bold">Opinion again</text>
<text x="112.0" y="358.0" font-size="16" text-anchor="start" fill="#fff" font-weight="normal" font-style="italic">That's why I believe swimming lessons are important.</text>
</svg>
