      - "ลองคำนวณค่าเฉลี่ยของทั้งสองร้านด้วย แล้วเทียบว่าค่าเฉลี่ยบอกเรื่องเดียวกับมัธยฐานหรือไม่"
    misconceptions:
      - { match: -0.71, feedback: "นั่นคือผลต่างของค่าเฉลี่ย ($60 - 60.71$) ค่าเฉลี่ยของร้าน A ถูกวันที่ขายได้ 120 จานดึงขึ้น โจทย์ถามผลต่างของมัธยฐาน" }
    solution: "ร้าน A เรียงได้ 48, 49, 50, **51**, 52, 55, 120 มัธยฐาน 51 จาน ร้าน B เรียงได้ 57, 58, 59, **60**, 61, 62, 63 มัธยฐาน 60 จาน ผลต่าง $60 - 51 = 9$ จาน ถ้าเทียบค่าเฉลี่ย ร้าน A ได้ $425 \\div 7 \\approx 60.7$ ร้าน B ได้ 60 ดูเหมือน A ขายดีกว่า แต่เป็นเพราะค่าผิดปกติวันเดียว มัธยฐานบอกได้ดีกว่าว่าในวันปกติร้าน B ขายได้มากกว่า"
