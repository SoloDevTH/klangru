<line x1="106.0" y1="166.0" x2="134.0" y2="166.0" stroke="#b35c00" stroke-width="4"/>
<polygon points="134.0,166.0 126.0,159.0 126.0,173.0" fill="#b35c00" stroke="#b35c00" stroke-width="2"/>
<text x="160.0" y="171.0" text-anchor="start" font-size="15" fill="#15211e">เคลื่อนย้ายด้วยรถเข็นไปโต๊ะชั่ง</text>
<line x1="120.0" y1="182.0" x2="120.0" y2="208.0" stroke="#555555" stroke-width="1.5" stroke-dasharray="4 3"/>
