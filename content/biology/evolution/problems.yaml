      - { id: c, text: "แบบแยกทาง", feedback: "แบบแยกทางให้ค่าสุดขั้วทั้งสองข้างได้เปรียบ ตรงข้ามกับข้อมูลนี้" }
      - { id: d, text: "ไม่ใช่การคัดเลือก เพราะเกิดในคน", feedback: "การคัดเลือกโดยธรรมชาติเกิดกับทุกสิ่งมีชีวิต รวมทั้งคน" }
    hints:
