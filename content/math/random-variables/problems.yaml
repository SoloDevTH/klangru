      - { id: c, text: "ทอยลูกเต๋า แต้ม 1 ได้ ก แต้ม 2 ได้ ข แต้มอื่นได้ ค", feedback: "ค มีโอกาส $\\tfrac46$ มากกว่าคนอื่น" }
      - { id: d, text: "โยนเหรียญหนึ่งเหรียญ หัวได้ ก ก้อยให้ ข กับ ค ตกลงกันเอง", feedback: "ก มีโอกาส $\\tfrac12$ ไม่เท่ากับอีกสองคน" }
    hints:
