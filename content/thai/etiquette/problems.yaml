    feedback: บอกที่มาก็จริง แต่งานทั้งเล่มไม่ใช่งานของเรา การอ้างอิงใช้กับบางส่วนเท่านั้น
  - id: c
    text: คัดลอกข้อความ แล้วเปลี่ยนบางคำให้ต่างไปเล็กน้อย ไม่บอกที่มา
