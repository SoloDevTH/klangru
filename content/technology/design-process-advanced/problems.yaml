  difficulty: 5
  type: numeric
  stem: ต่อยอดเครื่องเตือนให้บอร์ดตื่นทุก 60 วินาที ตื่นนาน 2 วินาทีใช้กระแส 80 mA อีก 58 วินาทีพักเครื่องใช้ 0.5 mA ถ้าแบตเตอรี่สำรองจุ 2,000 mAh จะใช้ได้นานประมาณกี่ **วัน** (ตอบทศนิยม 1 ตำแหน่ง)
  answer:
