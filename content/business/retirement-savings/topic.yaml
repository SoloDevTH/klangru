id: business.econ.retirement-savings
subject: business
title:
  th: การออมเพื่อวัยเกษียณ ประกันสังคม และกองทุนบำนาญ
  en: Saving for retirement, social security and pension funds
summary: ระบบบำนาญของไทย (ประกันสังคม กอช. กองทุนสำรองเลี้ยงชีพ) และ superannuation ของออสเตรเลีย ผลของการเริ่มออมเร็วและค่าธรรมเนียม รวมถึงเงินเฟ้อที่กัดกร่อนเป้าหมาย
difficulty: 4
minutes: 35
prerequisites:
- business.econ.saving-investment
encompasses:
- id: business.econ.saving-investment
  weight: 0.4
- id: business.econ.money-banking
  weight: 0.2
- id: math.number.ratio-percent
  weight: 0.2
curriculum_tags: []
lessons:
- type: figure
  src: pension-layers.svg
  alt: แผนภาพแนวคิดซ้อนกันสามชั้นจากล่างขึ้นบน ชั้นล่างคือความช่วยเหลือจากรัฐ ชั้นกลางคือภาคบังคับจากประกันสังคม มาตรา 33 ที่ลูกจ้างและนายจ้างจ่ายสมทบ ชั้นบนคือภาคสมัครใจ ได้แก่ กอช. กองทุนสำรองเลี้ยงชีพ กองทุนรวมเพื่อการเลี้ยงชีพ และประกันบำนาญ ลูกศรแนวตั้งบอกว่ายิ่งขึ้นบนยิ่งต้องออมเอง
  caption: ระบบบำนาญหลายชั้น แต่ละชั้นมาจากแหล่งต่างกัน ไม่มีชั้นใดครอบคลุมทุกคนครบทุกด้าน (ภาพแนวคิด)
- type: explanation
  file: lesson.md
- type: worked-example
  title: ฝากปีละ 12,000 บาท ทบต้น 4% เป็นเวลา 3 ปี
  problem: ออมเงินปีละ 12,000 บาททุกสิ้นปี ดอกเบี้ย $4\%$ ต่อปีทบต้น เมื่อสิ้นปีที่ 3 จะมีเงินรวมเท่าไร
  steps:
  - text: "ก้อนที่ฝากปีแรกได้ดอกเบี้ย 2 ปี จึงเป็น $12{,}000 \\times 1.04^2 = 12{,}979.20$ บาท"
    why: เงินที่ฝากปลายปีแรกยังไม่ได้ดอกเบี้ยในปีแรก แต่จะได้ดอกเบี้ยในปีที่สองและสาม
  - text: "ก้อนที่ฝากปีที่สองได้ดอกเบี้ย 1 ปี จึงเป็น $12{,}000 \\times 1.04 = 12{,}480$ บาท"
  - text: "ก้อนที่ฝากปีที่สามเพิ่งฝากสิ้นปี จึงยังเป็น $12{,}000$ บาท"
    why: ฝากสิ้นปีแล้วทันทีจึงยังไม่ได้ดอกเบี้ย
  - text: "รวมทั้งหมด $12{,}979.20 + 12{,}480 + 12{,}000 = 37{,}459.20$ บาท"
  answer: "เงินรวมสิ้นปีที่ 3 ประมาณ $37{,}459.20$ บาท ซึ่งมากกว่าฝากเงินรวมกัน $36{,}000$ บาท เพราะดอกเบี้ยทบต้น"
- type: check
  problem: business.econ.retirement-savings.p007
  prompt: ทดลองคิดก่อนอ่านต่อ ทบต้นต่างจากดอกเบี้ยอย่างง่ายอย่างไร
- type: figure
  src: growth-by-start-age.svg
  alt: กราฟเส้นสองเส้นของเงินรวมตั้งแต่อายุ 25 ถึง 55 ปี แกนนอนคืออายุ แกนตั้งคือเงินรวมบาท เส้นสีน้ำเงินของคนแรกที่เริ่มออมตอนอายุ 25 ปีค่อย ๆ โค้งขึ้นถึงประมาณ 673,019 บาทตอนอายุ 55 ปี เส้นสีแดงของคนที่สองเริ่มตอนอายุ 35 ปี เป็นศูนย์จนถึงอายุ 35 แล้วขึ้นถึงประมาณ 357,337 บาทตอนอายุ 55 ปี
  caption: ออมปีละเท่ากันทั้งคู่ แต่คนที่เริ่มเร็วกว่า 10 ปีมีเงินมากกว่าเกือบเท่าตัว เพราะดอกเบี้ยทบต้นมีเวลาทำงานนานกว่า
- type: worked-example
  title: ค่าธรรมเนียมทำให้เงินหายไปเท่าไร
  problem: ลงทุน 300,000 บาท ผลตอบแทนก่อนค่าธรรมเนียม $5\%$ ต่อปีทบต้น ถ้ามีค่าธรรมเนียม $1.5\%$ ต่อปีหักจากเงินลงทุนทุกปี เป็นเวลา 15 ปี เงินปลายทางต่างกันเท่าไร
  steps:
  - text: "ไม่มีค่าธรรมเนียม: $300{,}000 \\times 1.05^{15} = 623{,}678.45$ บาท"
  - text: "มีค่าธรรมเนียม ผลตอบแทนสุทธิคือ $5\\% - 1.5\\% = 3.5\\%$ จึงได้ $300{,}000 \\times 1.035^{15} = 502{,}604.65$ บาท"
    why: ค่าธรรมเนียมหักทุกปี จึงลดอัตราที่เงินทบต้นได้จริงลงทุกปี
  - text: "ส่วนต่าง $623{,}678.45 - 502{,}604.65 = 121{,}073.80$ บาท"
  answer: "ค่าธรรมเนียม $1.5\\%$ ต่อปีทำให้ปลายทางหายไปประมาณ $121{,}074$ บาท ทั้งที่ดูเป็นตัวเลขเล็กน้อยทุกปี"
- type: figure
  src: fee-effect.svg
  alt: แผนภูมิแท่งสองแท่ง แท่งซ้ายคือเงินรวมหลัง 15 ปีถ้าไม่มีค่าธรรมเนียม ประมาณ 623,678 บาท แท่งขวาคือถ้ามีค่าธรรมเนียม 1.5% ต่อปี ประมาณ 502,605 บาท แท่งขวาเตี้ยกว่าอย่างเห็นได้ชัด
  caption: ค่าธรรมเนียมที่ดูน้อยต่อปีกลายเป็นส่วนต่างก้อนใหญ่เมื่อทบต้นหลายปี
- type: interactive
  title: ลองปรับอัตราผลตอบแทนแล้วดูเงินรวม
  caption: ออมปีละ 12,000 บาท ทุกสิ้นปี ลองเลื่อนอัตราผลตอบแทน a แล้วสังเกตว่าเส้นโค้งสูงขึ้นมากแค่ไหนเมื่อครบ 40 ปี
  widget:
    kind: function-plot
    functions:
    - 12000\cdot\frac{(1+a)^{x}-1}{a}
    sliders:
    - { name: a, min: 0.01, max: 0.1, step: 0.01, value: 0.04, label: อัตราผลตอบแทนต่อปี }
    x: [0, 40]
    y: [0, 2500000]
glossary:
- term: บำนาญ
  definition: เงินที่จ่ายเป็นงวด ๆ ตลอดช่วงหลังเกษียณ
- term: บำเหน็จ
  definition: เงินก้อนที่จ่ายครั้งเดียว ต่างจากบำนาญที่จ่ายเป็นงวด
- term: กองทุนการออมแห่งชาติ (กอช.)
  definition: กองทุนที่ตั้งขึ้นเพื่อการออมเพื่อวัยเกษียณแบบสมัครใจ รัฐร่วมสมทบตามเงื่อนไขที่กำหนดในกฎกระทรวง
- term: กองทุนรวมเพื่อการเลี้ยงชีพ (RMF)
  definition: กองทุนรวมที่ผู้ลงทุนลดหย่อนภาษีได้ตามเกณฑ์ที่กรมสรรพากรกำหนด และต้องถือจนถึงเกณฑ์อายุที่กำหนด
- term: superannuation
  definition: ระบบเงินบำนาญของออสเตรเลียที่นายจ้างต้องจ่ายสมทบเข้ากองทุนของพนักงานตามกฎหมาย
- term: เงินเฟ้อ
  definition: การที่ระดับราคาสินค้าและบริการเพิ่มขึ้นต่อเนื่อง ทำให้เงินจำนวนเท่าเดิมซื้อของได้น้อยลง
flashcards:
- front: บำนาญ กับ บำเหน็จ ต่างกันอย่างไร
  back: บำนาญจ่ายเป็นงวดตลอดหลังเกษียณ บำเหน็จจ่ายเป็นก้อนครั้งเดียว
- front: เงินสมทบประกันสังคม มาตรา 33 (ลูกจ้าง)
  back: ร้อยละ 5 ของค่าจ้างไม่เกินเพดาน เพดานเดิม 15,000 บาทจึงสูงสุดเดือนละ 750 บาท (มีรายงานว่าเพดานขึ้นเป็น 17,500 บาทตั้งแต่ปี 2569 ต้องตรวจอัตราปัจจุบัน)
- front: สูตรเงินรวมเมื่อฝากปีละ $P$ ทบต้น $r$ เป็นเวลา $n$ ปี
  back: $FV = P\cdot\frac{(1+r)^n-1}{r}$
- front: ทำไมค่าธรรมเนียม 1% จึงกินเงินเยอะ
  back: เพราะถูกหักทุกปี และเงินที่หายไปแล้วไม่ได้ทบต้นต่อ
