<text x="380.0" y="213.0" text-anchor="start" font-size="13" fill="#374151">พบ: กระดูกและรอยเท้าไดโนเสาร์</text>
<rect x="60" y="230" width="300" height="70" fill="#d6d3d1" stroke="#44403c"/>
