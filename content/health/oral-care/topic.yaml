id: health.hygiene.oral-care
subject: health
title: { th: การแปรงฟันและการดูแลสุขภาพช่องปาก, en: "Tooth brushing and oral health care" }
summary: ฟันน้ำนมและฟันแท้ สาเหตุของฟันผุ การแปรงฟันสูตร 2-2-2 วิธีแปรงแบบขยับแล้วปัด ยาสีฟันผสมฟลูออไรด์ตามวัย ไหมขัดฟัน อาหารกับฟัน และการพบทันตแพทย์
difficulty: 1
minutes: 25
prerequisites: [health.hygiene.national-health-rules]
encompasses:
  - { id: health.hygiene.national-health-rules, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: แปรงฟันแบบขยับแล้วปัด
    src: brushing-steps.svg
    alt: "ภาพสี่ช่องแสดงการแปรงฟัน ช่อง 1 ฟันบน: วางแปรงเอียง 45 องศาที่ขอบเหงือก ขยับสั้น ๆ เบา ๆ แล้วปัดลง ช่อง 2 ฟันล่าง: วางแปรงเอียง 45 องศาที่ขอบเหงือก ขยับสั้น ๆ แล้วปัดขึ้น ช่อง 3 ด้านบดเคี้ยวของฟันกราม: ถูแปรงไปมา ช่อง 4 ด้านในของฟันหน้า: ตั้งแปรงตามแนวฟัน แล้วปัดจากโคนฟันออกไปทางปลายฟัน"
    caption: "ปัดจากเหงือกไปทางปลายฟันเสมอ ฟันบนปัดลง ฟันล่างปัดขึ้น"
  - type: worked-example
    title: จัดเวลาแปรงฟันตามสูตร 2-2-2
    problem: "ใบเฟิร์นกินข้าวเย็นเวลา 18:00 น. ชอบกินผลไม้ตอนดูทีวีเวลา 19:30 น. และเข้านอนเวลา 21:00 น. ใบเฟิร์นควรแปรงฟันก่อนนอนเวลาใด และหลังแปรงแล้วกินอะไรได้หรือไม่"
    steps:
      - text: "สูตร 2-2-2 คือ แปรงวันละ 2 ครั้ง เช้าและก่อนนอน แปรงนาน 2 นาที และไม่กินหรือดื่มหลังแปรง 2 ชั่วโมง"
      - text: "ของกินชิ้นสุดท้ายของวันคือผลไม้เวลา 19:30 น. จึงควรแปรงฟันหลังจากนั้น เช่น เวลา 20:30 น. ก่อนเข้านอน"
        why: "ถ้าแปรงก่อนกินผลไม้ เศษอาหารและน้ำตาลจะติดฟันไปตลอดคืน ซึ่งเป็นช่วงที่น้ำลายออกน้อย"
      - text: "หลังแปรงเวลา 20:30 น. ต้องงดกินและดื่มเครื่องดื่มถึงเวลา 22:30 น. ซึ่งเลยเวลานอนแล้ว จึงไม่กินอะไรอีกจนถึงเช้า"
        why: "ให้ฟลูออไรด์อยู่บนผิวฟันนาน และไม่ให้มีน้ำตาลเหลือให้เชื้อโรคสร้างกรด"
    answer: "แปรงฟันหลังกินผลไม้ เช่น 20:30 น. นานอย่างน้อย 2 นาที แล้วไม่กินอะไรอีกจนเข้านอน"
  - { type: check, problem: health.hygiene.oral-care.p002, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: figure
    title: ปริมาณยาสีฟันตามวัย
    src: toothpaste-amount.svg
    alt: "แปรงสีฟันสามอัน อันแรกอายุ 0–3 ปี ยาสีฟันแตะขนแปรงพอเปียก อันที่สองอายุ 3–6 ปี ยาสีฟันยาวเท่าความกว้างของแปรง เป็นก้อนเล็ก อันที่สามอายุมากกว่า 6 ปี ยาสีฟันยาวเท่าความยาวของหัวแปรง"
    caption: "ปริมาณตามคำแนะนำของกรมอนามัย ผู้ใหญ่ควรช่วยบีบยาสีฟันให้เด็กเล็ก"
  - type: worked-example
    title: หาจุดที่แปรงไม่สะอาด
    problem: "หลังแปรงฟัน ภูเคี้ยวเม็ดสีย้อมคราบฟันที่ทันตแพทย์ให้มา พบสีชมพูติดมากที่ขอบเหงือกของฟันหน้าล่างด้านใน และที่ซอกฟัน ภูควรปรับวิธีแปรงอย่างไร"
    steps:
      - text: "สีที่ติดแสดงว่าตรงนั้นยังมีคราบจุลินทรีย์ คือยังแปรงไม่สะอาด"
      - text: "ด้านในของฟันหน้าล่าง ให้ตั้งแปรงตามแนวฟัน แล้วปัดจากเหงือกขึ้นไปทางปลายฟันหลาย ๆ ครั้ง"
        why: "แปรงที่วางแนวนอนเข้าไม่ถึงด้านในของฟันหน้าซึ่งโค้งและแคบ"
      - text: "ขอบเหงือก ให้วางขนแปรงเอียง 45 องศาตรงขอบเหงือก ขยับสั้น ๆ เบา ๆ ก่อนปัด"
      - text: "ซอกฟันแปรงเข้าไม่ถึง ให้ผู้ใหญ่ช่วยใช้ไหมขัดฟัน"
    answer: "ตั้งแปรงปัดด้านในฟันหน้า วางแปรง 45 องศาที่ขอบเหงือกแล้วขยับก่อนปัด และใช้ไหมขัดฟันที่ซอกฟัน"
  - { type: check, problem: health.hygiene.oral-care.p006 }
glossary:
  - { term: ฟันน้ำนม, definition: "ฟันชุดแรก มี 20 ซี่ จะหลุดและมีฟันแท้ขึ้นแทน" }
  - { term: ฟันแท้, definition: "ฟันชุดที่สอง มีครบ 32 ซี่ ใช้ไปตลอดชีวิต ไม่มีชุดใหม่มาแทน" }
  - { term: คราบจุลินทรีย์, definition: "ชั้นบาง ๆ ของเชื้อโรคที่เกาะบนผิวฟัน ใช้น้ำตาลสร้างกรดที่ทำให้ฟันผุ" }
  - { term: ฟลูออไรด์, definition: "สารที่ผสมในยาสีฟัน ช่วยให้ผิวฟันแข็งแรงและป้องกันฟันผุ" }
  - { term: ไหมขัดฟัน, definition: "เส้นใยสำหรับทำความสะอาดซอกฟันที่แปรงสีฟันเข้าไม่ถึง" }
flashcards:
  - { front: "แปรงฟันสูตร 2-2-2 คืออะไร", back: "แปรงอย่างน้อยวันละ 2 ครั้ง เช้าและก่อนนอน แปรงนาน 2 นาที และงดกินดื่ม 2 ชั่วโมงหลังแปรง" }
  - { front: "ฟันน้ำนมกี่ซี่ ฟันแท้กี่ซี่", back: "ฟันน้ำนม 20 ซี่ ฟันแท้ 32 ซี่" }
  - { front: "แปรงฟันบนและฟันล่างปัดไปทางไหน", back: "ปัดจากเหงือกไปทางปลายฟัน ฟันบนปัดลง ฟันล่างปัดขึ้น" }
  - { front: "เด็กอายุมากกว่า 6 ปี บีบยาสีฟันเท่าไร", back: "ยาวเท่าความยาวของแปรง (เด็ก 3–6 ปี เท่าความกว้างของแปรง เด็ก 0–3 ปี แตะพอเปียก)" }
