  difficulty: 5
  type: numeric
  stem: เมื่อปีก่อนดัชนีราคาผู้บริโภคเท่ากับ $104.0$ แพรได้เงินเดือน $18{,}000$ บาท ปีนี้ดัชนีเท่ากับ $109.2$ แพรต้องได้เงินเดือนเท่าไรจึงจะมีอำนาจซื้อเท่าเดิม (ตอบเป็นบาท)
  answer:
    value: 18900
    unit: บาท
  misconceptions:
  - match: 18936.0
    feedback: เพิ่มตามจุดของดัชนี (5.2 จุด) แต่ต้องใช้ร้อยละ
  - match: 19656.0
    feedback: ใช้ดัชนีปีนี้เทียบปีฐาน 100 แต่ต้องเทียบกับดัชนีปีก่อน
  hints:
  - เงินเดือนต้องเพิ่มในสัดส่วนเดียวกับดัชนีราคา
  - เงินเดือนใหม่ $= 18{,}000 \times \dfrac{109.2}{104.0}$
  solution: $18{,}000 \times \dfrac{109.2}{104.0} = 18{,}000 \times 1.05 = 18{,}900$ บาท (ดัชนีเพิ่ม $5\%$)
