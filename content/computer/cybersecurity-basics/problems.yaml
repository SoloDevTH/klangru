      - { id: d, text: "ติดตั้งแอนติไวรัสหลังจากถูกโจมตีแล้ว", feedback: "อาจลบตัวมัลแวร์ได้ แต่ไฟล์ที่ถูกเข้ารหัสแล้วยังอ่านไม่ได้" }
    hints:
