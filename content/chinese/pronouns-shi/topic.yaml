id: chinese.grammar.pronouns-shi
subject: chinese
title: { th: "สรรพนาม ประโยค 是 และ 的", en: "Pronouns, 是 sentences and possessive 的" }
summary: สรรพนามบุคคล 我 你 他 她 我们 คำชี้ 这 那 ประโยค 是 และ 不是 และการบอกความเป็นเจ้าของด้วย 的
difficulty: 1.5
minutes: 25
prerequisites: [chinese.vocab.greetings]
encompasses:
  - { id: chinese.vocab.greetings, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: possessive-order.svg
    alt: "แผนภาพสองส่วน ส่วนบน: ภาษาไทยเรียง หนังสือ + ของ + ฉัน ภาษาจีนเรียง 我 wǒ + 的 de + 书 shū มีลูกศรไขว้แสดงว่าเจ้าของกับสิ่งของสลับตำแหน่งกัน ส่วนล่าง: ผู้พูด 我 กับหนังสือที่อยู่ใกล้ใช้ 这 zhè นี่ หนังสือที่อยู่ไกลใช้ 那 nà นั่น"
    caption: "ภาษาจีนวางเจ้าของไว้หน้า: 我的书 = หนังสือของฉัน"
  - { type: check, problem: chinese.grammar.pronouns-shi.p007, prompt: "ลองเขียน หนังสือของฉัน" }
  - type: worked-example
    title: แนะนำตัวและเพื่อน
    problem: "นักเรียนไทยชื่อต้นต้องการบอกครูชาวจีนว่า \"ผมเป็นคนไทย เขา (เพื่อนผู้หญิง) ไม่ใช่คนจีน เขาเป็นคนไทย\" ใช้ประโยค 是 อย่างไร"
    steps:
      - text: "ผมเป็นคนไทย: ประธาน 我 + 是 + 泰国人 → 我是泰国人。"
      - text: "เพื่อนเป็นผู้หญิง จึงใช้ 她 tā"
        why: "他 她 อ่านเหมือนกัน แต่เขียนต่างกันตามเพศ"
      - text: "เขาไม่ใช่คนจีน: วาง 不 หน้า 是 → 她不是中国人。"
      - text: "เขาเป็นคนไทย: 她是泰国人。"
    answer: "我是泰国人。她不是中国人，她是泰国人。"
  - type: worked-example
    title: เลือก 这 หรือ 那 และ 的
    problem: "ต้นชี้โทรศัพท์บนโต๊ะครูซึ่งอยู่ไกลจากตัว แล้วถามว่าเป็นของครูหรือไม่ ครูตอบว่า \"ไม่ใช่ นั่นเป็นของนักเรียนคนหนึ่ง (ผู้ชาย)\" ส่วนของคำตอบเขียนอย่างไร"
    steps:
      - text: "ปฏิเสธก่อน: 不是"
      - text: "โทรศัพท์อยู่ไกล ใช้ 那 nà"
      - text: "เป็นของเขา (ผู้ชาย): 他的 และไม่ต้องพูด 手机 ซ้ำเพราะรู้กันอยู่แล้ว"
        why: "เจ้าของ + 的 ใช้แทนคำนามที่พูดถึงไปแล้วได้"
      - text: "รวมเป็น 不是，那是他的。"
    answer: "不是，那是他的。 Bú shì, nà shì tā de."
  - { type: check, problem: chinese.grammar.pronouns-shi.p010, prompt: "是 ใช้กับคำบอกลักษณะได้หรือไม่" }
glossary:
  - { term: "我 wǒ", definition: "ฉัน ผม หนู ใช้ได้ทุกเพศทุกวัย" }
  - { term: "他 / 她 / 它 tā", definition: "เขา (ชาย) / เขา (หญิง) / มัน (สัตว์ สิ่งของ) อ่านเหมือนกัน เขียนต่างกัน" }
  - { term: "们 men", definition: "คำต่อท้ายสรรพนามบอกพหูพจน์ เช่น 我们 พวกเรา 你们 พวกคุณ" }
  - { term: "是 shì", definition: "เป็น คือ ใช้เชื่อมประธานกับคำนาม ปฏิเสธด้วย 不是 bú shì" }
  - { term: "的 de", definition: "ของ วางระหว่างเจ้าของกับสิ่งของ: เจ้าของ + 的 + สิ่งของ" }
flashcards:
  - { front: "หนังสือของฉัน", back: "我的书 wǒ de shū (เจ้าของมาก่อน)" }
  - { front: "这 กับ 那", back: "这 zhè นี่ (ใกล้) · 那 nà นั่น (ไกล)" }
  - { front: "เขาไม่ใช่ครู", back: "他不是老师。 Tā bú shì lǎoshī." }
  - { front: "ฉันยุ่ง พูดว่า 我是忙 ได้ไหม", back: "ไม่ได้ ใช้ 我很忙 เพราะ 是 ใช้กับคำนาม" }
references:
