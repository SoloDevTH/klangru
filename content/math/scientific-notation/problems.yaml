  - id: math.sci.p016
    topics: [math.number.scientific-notation]
    difficulty: 2
    type: mcq
    stem: "แบคทีเรียตัวหนึ่งยาวประมาณ $2 \\times 10^{-6}\\ \\mathrm{m}$ หน่วยใดเหมาะที่สุดในการบอกความยาวนี้ให้อ่านง่าย"
    choices:
      - { id: a, text: "ไมโครเมตร (ได้ 2 ไมโครเมตร)", correct: true }
      - { id: b, text: "มิลลิเมตร", feedback: "ได้ $0.002\\ \\mathrm{mm}$ ยังมีศูนย์นำหน้าหลายตัว ไมโคร ($10^{-6}$) ตรงกับเลขชี้กำลังพอดี" }
      - { id: c, text: "เซนติเมตร", feedback: "ได้ $0.0002\\ \\mathrm{cm}$ อ่านยากกว่าเดิม" }
      - { id: d, text: "นาโนเมตร", feedback: "ได้ $2{,}000$ นาโนเมตร ใช้ได้แต่ตัวเลขใหญ่เกินจำเป็น ไมโครเมตรได้ตัวเลขหลักเดียว" }
    hints:
      - "คำนำหน้าหน่วยแต่ละตัวคือกำลังของสิบ"
      - "ไมโคร $= 10^{-6}$ มิลลิ $= 10^{-3}$ นาโน $= 10^{-9}$"
    solution: "$2 \\times 10^{-6}\\ \\mathrm{m} = 2\\ \\text{ไมโครเมตร}$ ($\\mu\\mathrm{m}$) เพราะไมโครหมายถึง $10^{-6}$ ได้ตัวเลขหลักเดียวที่อ่านง่าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.sci.p017
    topics: [math.number.scientific-notation]
    difficulty: 1
