id: math.geometry.area-perimeter
subject: math
title: { th: พื้นที่และเส้นรอบรูป, en: Area and perimeter }
summary: หาความยาวรอบรูปและพื้นที่ของสี่เหลี่ยม สามเหลี่ยม สี่เหลี่ยมคางหมู วงกลม และรูปประกอบ พร้อมใช้หน่วยให้ถูกต้อง
difficulty: 2.5
minutes: 35
prerequisites: [math.number.fractions, math.number.decimals, math.measure.area-units]
encompasses:
  - { id: math.number.decimals, weight: 0.3 }
  - { id: math.number.fractions, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - { type: check, problem: math.area.p015, prompt: "ลองนับตารางหน่วยด้วยตัวเอง" }
  - type: figure
    src: same-area-different-perimeter.svg
    alt: "สี่เหลี่ยมผืนผ้าสามรูปบนตาราง ขนาด 6 คูณ 2, 4 คูณ 3 และ 12 คูณ 1 ทุกรูปมี 12 ช่องหรือพื้นที่ 12 ตารางหน่วย แต่เส้นรอบรูปเป็น 16, 14 และ 26 หน่วยตามลำดับ"
    caption: "พื้นที่เท่ากันทั้งสามรูป แต่เส้นรอบรูปต่างกัน รูปที่ยาวแคบมีเส้นรอบรูปมากที่สุด"
  - { type: check, problem: math.area.p017, prompt: "ถ้าเส้นรอบรูปเท่ากัน พื้นที่จะเท่ากันไหม" }
  - type: figure
    src: circle-rearranged.svg
    alt: "ซ้ายคือวงกลมรัศมี r ที่ตัดเป็น 16 ชิ้นเท่ากัน ระบายสีสลับสองสี ขวาคือชิ้นเหล่านั้นเรียงสลับหัวกลับหาง ได้รูปคล้ายสี่เหลี่ยมด้านขนาน ฐานยาวประมาณครึ่งเส้นรอบวงหรือ πr และสูงประมาณ r"
    caption: "รูปที่ได้มีพื้นที่ประมาณ $\\pi r \\times r = \\pi r^2$ ยิ่งตัดชิ้นเล็ก ยิ่งใกล้สี่เหลี่ยมผืนผ้า"
  - type: worked-example
    title: หาด้านที่ไม่รู้จากพื้นที่ แล้วหาเส้นรอบรูป
    problem: "ห้องเรียนรูปสี่เหลี่ยมผืนผ้ามีพื้นที่ $63\\ \\mathrm{m^2}$ ยาว $9\\ \\mathrm{m}$ ถ้าจะติดแถบสีรอบผนังห้องหนึ่งรอบ ต้องใช้แถบยาวกี่เมตร"
    steps:
      - text: "เขียนสูตรพื้นที่โดยให้ความกว้างเป็นตัวที่ไม่รู้: $9 \\times w = 63$"
        why: "โจทย์ให้พื้นที่และความยาว ความกว้างจึงเป็นตัวประกอบที่หายไปของการคูณ"
      - text: "หาความกว้าง: $w = 63 \\div 9 = 7\\ \\mathrm{m}$"
      - text: "แถบสีรอบผนังคือเส้นรอบรูป: $2(9 + 7) = 2 \\times 16 = 32\\ \\mathrm{m}$"
        why: "โจทย์ถามความยาวรอบห้อง ไม่ใช่ขนาดผิวพื้น หน่วยจึงเป็นเมตร ไม่ใช่ตารางเมตร"
    answer: "ใช้แถบยาว $32\\ \\mathrm{m}$ (ห้องกว้าง $7\\ \\mathrm{m}$)"
  - type: worked-example
    title: พื้นที่ทางเดินรอบสนามวงกลม
    problem: "สนามหญ้าวงกลมเส้นผ่านศูนย์กลาง $14\\ \\mathrm{m}$ ทำทางเดินกว้าง $1\\ \\mathrm{m}$ ล้อมรอบด้านนอก ทางเดินมีพื้นที่กี่ตารางเมตร (ใช้ $\\pi \\approx \\tfrac{22}{7}$)"
    steps:
      - text: "รัศมีสนามหญ้า $= 14 \\div 2 = 7\\ \\mathrm{m}$ รัศมีวงนอก (รวมทางเดิน) $= 7 + 1 = 8\\ \\mathrm{m}$"
        why: "ทางเดินกว้าง 1 m ล้อมรอบ รัศมีจึงเพิ่มขึ้น 1 m ไม่ใช่ 2 m (เส้นผ่านศูนย์กลางต่างหากที่เพิ่ม 2 m)"
      - text: "พื้นที่วงนอก: $\\tfrac{22}{7} \\times 8^2 = \\tfrac{22}{7} \\times 64$"
      - text: "พื้นที่สนามหญ้า: $\\tfrac{22}{7} \\times 7^2 = \\tfrac{22}{7} \\times 49 = 154\\ \\mathrm{m^2}$"
      - text: "ทางเดิน = วงนอก − สนามหญ้า $= \\tfrac{22}{7}(64 - 49) = \\tfrac{22}{7} \\times 15 = \\tfrac{330}{7} \\approx 47.14\\ \\mathrm{m^2}$"
        why: "ดึง $\\tfrac{22}{7}$ เป็นตัวร่วมก่อนแล้วค่อยคูณ ทำให้คำนวณง่ายขึ้น"
    answer: "ทางเดินมีพื้นที่ประมาณ $47.14\\ \\mathrm{m^2}$"
  - type: simulation
    title: ต่อรูปจากตารางหน่วย (PhET Area Builder)
    url: https://phet.colorado.edu/en/simulations/area-builder
    provider: phet
    note: ลองต่อรูปหลายแบบที่มีพื้นที่ 12 ตารางหน่วยเท่ากัน แล้วสังเกตว่าความยาวรอบรูปของแต่ละแบบไม่เท่ากัน
  - type: interactive
    title: รั้วยาวเท่าเดิม แต่พื้นที่เปลี่ยนได้
    caption: "แกน x คือความกว้างของแปลงสี่เหลี่ยมผืนผ้า แกน y คือพื้นที่เมื่อใช้รั้วยาว p เมตรล้อมรอบ ลองเลื่อน p แล้วดูว่าความกว้างเท่าใดให้พื้นที่มากที่สุด"
    widget:
      kind: function-plot
      functions: ["x\\left(\\frac{p}{2}-x\\right)"]
      sliders:
        - { name: p, min: 4, max: 20, step: 2, value: 12, label: ความยาวรั้ว (m) }
      x: [0, 10]
      y: [0, 26]
glossary:
  - { term: เส้นรอบรูป, definition: "ความยาวรอบขอบของรูปทั้งหมด มีหน่วยเป็นความยาว เช่น เมตร (m)" }
  - { term: พื้นที่, definition: "ขนาดของบริเวณที่รูปครอบคลุม นับเป็นจำนวนตารางหน่วย เช่น ตารางเมตร ($\\mathrm{m^2}$)" }
  - { term: ความสูง (ของรูป), definition: "ระยะที่วัดตั้งฉากกับฐาน ไม่ใช่ความยาวของด้านเอียง" }
  - { term: เส้นรอบวง, definition: "เส้นรอบรูปของวงกลม มีค่า $2\\pi r$ หรือ $\\pi d$" }
flashcards:
  - { front: "พื้นที่สามเหลี่ยม", back: "$\\tfrac{1}{2} \\times \\text{ฐาน} \\times \\text{สูง}$ โดยความสูงต้องตั้งฉากกับฐาน" }
  - { front: "พื้นที่สี่เหลี่ยมคางหมู", back: "$\\tfrac{1}{2} \\times (\\text{ผลบวกด้านคู่ขนาน}) \\times \\text{สูง}$" }
  - { front: "เส้นรอบวงและพื้นที่วงกลมรัศมี $r$", back: "เส้นรอบวง $2\\pi r$ (หน่วยความยาว) พื้นที่ $\\pi r^2$ (หน่วยตาราง)" }
  - { front: "$1\\ \\mathrm{m^2}$ เท่ากับกี่ $\\mathrm{cm^2}$", back: "$100 \\times 100 = 10{,}000\\ \\mathrm{cm^2}$ ไม่ใช่ 100" }
  - { front: "1 ไร่ เท่ากับกี่ตารางเมตร", back: "1 ไร่ = 4 งาน = 400 ตารางวา = $1{,}600\\ \\mathrm{m^2}$" }
