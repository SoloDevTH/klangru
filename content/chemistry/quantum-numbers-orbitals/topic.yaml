id: chemistry.matter.quantum-numbers-orbitals
subject: chemistry
title: { th: แบบจำลองอะตอมเชิงควอนตัม เลขควอนตัม และรูปร่างออร์บิทัล, en: Quantum atomic model, quantum numbers and orbital shapes }
summary: ทวิภาวะของอิเล็กตรอนและหลักความไม่แน่นอน เลขควอนตัมสี่ตัวและจำนวนออร์บิทัลในแต่ละชั้น รูปร่างของ s p d และการใช้หลักของเพาลีกับฮุนด์
difficulty: 7
minutes: 40
prerequisites: [chemistry.matter.atomic-structure, physics.modern.quantum-atom]
encompasses:
  - { id: chemistry.matter.atomic-structure, weight: 0.3 }
  - { id: physics.modern.quantum-atom, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: orbital-shapes.svg
    alt: "ภาพตัดรูปร่างออร์บิทัลสามแบบ ซ้ายเป็นออร์บิทัล s เป็นวงกลมสีส้มรอบนิวเคลียสตรงกลาง กลางเป็นออร์บิทัล p ที่มีสองกลีบ กลีบบนมีเครื่องหมายบวกสีส้ม กลีบล่างมีเครื่องหมายลบสีเขียว และมีเส้นประระนาบโหนดผ่านนิวเคลียส ขวาเป็นออร์บิทัล d สี่กลีบจัดเป็นรูปกากบาท สลับสีส้มกับเขียว มีเส้นประสองเส้นตั้งฉากกันผ่านนิวเคลียส"
    caption: "ออร์บิทัล s เป็นทรงกลม p มีสองกลีบที่มีเครื่องหมายตรงข้ามกัน ส่วน d มีสี่กลีบในภาพตัดนี้"
  - type: worked-example
    title: หาชุดเลขควอนตัมที่เป็นไปได้ของชั้นย่อย 3p
    problem: "ชั้นย่อย 3p มีอิเล็กตรอนได้สูงสุดกี่ตัว และแต่ละตัวมีชุดเลขควอนตัม $(n, l, m_l, m_s)$ เป็นอย่างไรได้บ้าง"
    steps:
      - text: "ชั้นย่อย 3p มี $n = 3$ และ $l = 1$"
        why: "ตัวอักษร p ตรงกับ $l = 1$ ส่วนเลข 3 คือค่า $n$"
      - text: "$m_l$ มีได้ $-1, 0, +1$ จึงมี 3 ออร์บิทัลในชั้นย่อยนี้"
        why: "จำนวนออร์บิทัลในชั้นย่อยคือ $2l + 1$"
      - text: "$m_s$ มีได้ $+\\frac{1}{2}$ หรือ $-\\frac{1}{2}$ สำหรับแต่ละออร์บิทัล รวมเป็น $3 \\times 2 = 6$ ชุด"
        why: "ทุกออร์บิทัลรับอิเล็กตรอนได้สูงสุด 2 ตัวที่มีสปินต่างกัน ดังนั้นความจุของ 3p คือ 6 อิเล็กตรอน"
    answer: "ชั้นย่อย 3p บรรจุอิเล็กตรอนได้ 6 ตัว โดยมีชุดเลขควอนตัมที่เป็นไปได้ 6 ชุด ได้แก่ $(3, 1, -1, \\pm\\frac{1}{2})$, $(3, 1, 0, \\pm\\frac{1}{2})$ และ $(3, 1, +1, \\pm\\frac{1}{2})$"
  - { type: check, problem: chemistry.matter.quantum-numbers-orbitals.p002, prompt: "ดูว่า l = 1 ตรงกับชนิดออร์บิทัลใด" }
  - type: worked-example
    title: หาจำนวนอิเล็กตรอนไม่จับคู่ของออกซิเจนด้วยกฎของฮุนด์
    problem: "อะตอม O (Z = 8) ในสถานะพื้นมีอิเล็กตรอนไม่จับคู่กี่ตัว"
    steps:
      - text: "การจัดอิเล็กตรอนของ O คือ $1s^2 2s^2 2p^4$"
        why: "ประจุนิวเคลียส 8 หมายถึงอิเล็กตรอน 8 ตัวเมื่อเป็นกลาง"
      - text: "ชั้นย่อย 2p มี 3 ออร์บิทัลและมี 4 อิเล็กตรอน"
      - text: "ตามกฎของฮุนด์ อิเล็กตรอนสามตัวแรกเข้าออร์บิทัลละหนึ่งตัวก่อน ตัวที่สี่จึงจับคู่กับตัวหนึ่ง"
        why: "อิเล็กตรอนชอบกระจายตัวในออร์บิทัลที่มีพลังงานเท่ากันก่อนจับคู่ เพราะแรงผลักระหว่างอิเล็กตรอนน้อยกว่า"
      - text: "จึงเหลืออิเล็กตรอนไม่จับคู่ใน 2p 2 ตัว"
    answer: "O มีอิเล็กตรอนไม่จับคู่ 2 ตัว อะตอม O จึงเป็นพาราแมกเนติก (ถูกดึงดูดเข้าหาสนามแม่เหล็ก)"
  - { type: check, problem: chemistry.matter.quantum-numbers-orbitals.p007, prompt: "นึกถึงสิ่งที่ห้ามเกิดขึ้นในออร์บิทัลเดียวกัน" }
glossary:
  - { term: ทวิภาวะของอนุภาคคลื่น, definition: "สมบัติที่อิเล็กตรอนและอนุภาคอื่นแสดงทั้งลักษณะอนุภาคและลักษณะคลื่น" }
  - { term: หลักความไม่แน่นอนของไฮเซนเบิร์ก, definition: "ข้อจำกัดที่ตำแหน่งและโมเมนตัมของอนุภาคไม่อาจทราบพร้อมกันได้อย่างแม่นยำ" }
  - { term: ออร์บิทัล, definition: "ฟังก์ชันคลื่นของอิเล็กตรอนในอะตอม ใช้บอกบริเวณที่มีความน่าจะเป็นสูงที่จะพบอิเล็กตรอน" }
  - { term: โหนด, definition: "บริเวณที่ความน่าจะเป็นที่จะพบอิเล็กตรอนเป็นศูนย์" }
  - { term: หลักกีดกันของเพาลี, definition: "อิเล็กตรอนสองตัวในอะตอมเดียวกันมีเลขควอนตัมทั้งสี่ตัวเหมือนกันไม่ได้" }
  - { term: กฎของฮุนด์, definition: "ในชั้นย่อยที่มีออร์บิทัลระดับเดียวกัน อิเล็กตรอนจะเข้าออร์บิทัลทีละตัวก่อนจึงจับคู่" }
flashcards:
  - { front: "เลขควอนตัมสี่ตัวคืออะไรบ้าง", back: "$n$ (หลัก) $l$ (โคจร) $m_l$ (แม่เหล็ก) $m_s$ (สปิน)" }
  - { front: "ค่า $l$ ที่เป็นไปได้ในชั้น $n$", back: "0 ถึง $n - 1$ เช่น n = 3 ได้ $l$ = 0, 1, 2" }
  - { front: "ชั้นย่อย d บรรจุอิเล็กตรอนได้กี่ตัว", back: "10 ตัว (5 ออร์บิทัล × 2)" }
  - { front: "ออร์บิทัลกับวงโคจรต่างกันอย่างไร", back: "ออร์บิทัลเป็นบริเวณความน่าจะเป็น ไม่ใช่เส้นทางที่อิเล็กตรอนวิ่งตาม" }
