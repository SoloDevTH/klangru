problems:
- id: technology.design.materials-tools.p001
  topics:
  - technology.design.materials-tools
  difficulty: 1
  type: match
  stem: จับคู่เครื่องมือกับงานที่เหมาะสม
  pairs:
  - left: เลื่อยฉลุ
    right: ตัดไม้อัดบางเป็นเส้นโค้ง
  - left: ปากกาจับชิ้นงาน
    right: ยึดชิ้นงานไว้ขณะเลื่อยหรือเจาะ
  - left: ตะไบ
    right: แต่งขอบชิ้นงานให้เรียบ
  - left: หัวแร้ง
    right: บัดกรีสายไฟเข้ากับชิ้นส่วน
  - left: ฉาก
    right: ตรวจมุมให้ได้ 90 องศา
  hints:
  - นึกถึงรูปร่างของเครื่องมือ
  - เครื่องมือแต่ละชิ้นออกแบบมาสำหรับงานเฉพาะ
  solution: ใช้เครื่องมือให้ถูกกับงานทำให้งานเรียบร้อยและปลอดภัย เช่น เลื่อยฉลุใบเล็กจึงตัดโค้งได้ ปากกาจับชิ้นงานทำให้มือว่างและไม่ต้องจับใกล้ใบเลื่อย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.materials-tools.p002
  topics:
  - technology.design.materials-tools
  difficulty: 1
  type: text
  stem: เครื่องมือที่ใช้หลอมตะกั่วบัดกรีเพื่อเชื่อมสายไฟกับชิ้นส่วนอิเล็กทรอนิกส์ เรียกว่าอะไร
  accepted:
  - หัวแร้ง
  - หัวแร้งบัดกรี
  - หัวแร้งไฟฟ้า
  misconceptions:
  - match: ปืนกาว
    feedback: ปืนกาวร้อนใช้ติดวัสดุ ไม่ได้ใช้บัดกรีสายไฟ
  - match: คีม
    feedback: คีมใช้จับหรือตัดสายไฟ ไม่ได้หลอมตะกั่ว
  hints:
  - ปลายร้อนหลายร้อยองศาเซลเซียส
  - ต้องวางบนแท่นวางเสมอ
  solution: '**หัวแร้ง** ใช้หลอมตะกั่วบัดกรี ปลายร้อนมาก ต้องวางบนแท่น บัดกรีในที่อากาศถ่ายเท และล้างมือหลังใช้'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.materials-tools.p003
  topics:
  - technology.design.materials-tools
  difficulty: 1
  type: mcq
  stem: ควรสวม **แว่นตานิรภัย** เมื่อทำงานใด
  choices:
  - id: a
    text: เจาะไม้ด้วยสว่านไฟฟ้า
    correct: true
  - id: b
    text: วัดความยาวด้วยตลับเมตร
    feedback: การวัดไม่มีเศษวัสดุกระเด็น
  - id: c
    text: ร่างแบบด้วยดินสอ
    feedback: ไม่มีอันตรายต่อดวงตา
  - id: d
    text: อ่านคู่มือการใช้เครื่องมือ
    feedback: ไม่มีอันตรายต่อดวงตา แต่เป็นสิ่งที่ควรทำก่อนใช้เครื่องมือ
  hints:
  - งานใดทำให้เศษวัสดุกระเด็น
  - การเลื่อย เจาะ ตะไบ และบัดกรี
  solution: การเจาะทำให้เศษไม้หรือโลหะกระเด็นเข้าตาได้ ต้องสวมแว่นตานิรภัยทุกครั้ง รวมทั้งเมื่อเลื่อย ตะไบ และบัดกรี
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.materials-tools.p004
  topics:
  - technology.design.materials-tools
  difficulty: 2
  type: mcq
  stem: ชมรมจะทำบ้านนกไว้ที่ต้นไม้หน้าโรงเรียนซึ่งโดนฝนทุกวัน ควรเลือกวัสดุใด
  choices:
  - id: a
    text: ไม้ที่ทาสีหรือเคลือบกันน้ำ ยึดด้วยสกรู
    correct: true
  - id: b
    text: กระดาษลังติดเทปใส
    feedback: กระดาษลังดูดน้ำและเปื่อยเมื่อโดนฝน
  - id: c
    text: ฟิวเจอร์บอร์ดติดกาวลาเท็กซ์
    feedback: ฟิวเจอร์บอร์ดเหมาะกับต้นแบบ แต่แผ่นบางและกาวลาเท็กซ์ไม่ทนน้ำ
  - id: d
    text: แผ่นเหล็กบางที่ไม่ได้ทาสี
    feedback: เหล็กเป็นสนิมเมื่อโดนน้ำ และร้อนจัดเมื่อตากแดด ไม่เหมาะกับนก
  hints:
  - งานนี้ต้องทนน้ำและแดด
  - คิดถึงทั้งวัสดุและวิธียึด
  solution: ไม้ที่เคลือบกันน้ำแข็งแรง ทนฝนได้ ไม่ร้อนจัด และยึดด้วยสกรูที่แน่นกว่ากาว
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.materials-tools.p005
  topics:
  - technology.design.materials-tools
  difficulty: 2
  type: mcq
  stem: ข้อใดเป็นการใช้คัตเตอร์ตัดฟิวเจอร์บอร์ดที่ปลอดภัยที่สุด
  choices:
  - id: a
    text: วางบนแผ่นรองตัด ใช้ไม้บรรทัดเหล็กนำแนว ลากใบมีดออกจากตัว มือที่กดไม้บรรทัดอยู่ห่างจากแนวใบมีด
    correct: true
  - id: b
    text: ถือแผ่นงานไว้ในมือแล้วตัดเข้าหาตัว
    feedback: ถ้าใบมีดลื่นจะพุ่งเข้าหาตัวและมือ
  - id: c
    text: ใช้ไม้บรรทัดพลาสติกนำแนวและตัดบนโต๊ะเรียน
    feedback: ใบมีดเฉือนไม้บรรทัดพลาสติกได้ และทำให้โต๊ะเสียหาย
  - id: d
    text: ดันใบมีดออกยาวที่สุดเพื่อตัดให้ขาดในครั้งเดียว
    feedback: ใบมีดยาวหักง่าย ควรตัดหลายรอบเบา ๆ
  hints:
  - ทิศที่ใบมีดเคลื่อนต้องไม่พุ่งเข้าหาร่างกาย
  - ไม้บรรทัดเหล็กกันใบมีดเฉือนได้
  solution: ตัดบนแผ่นรองตัด ใช้ไม้บรรทัดเหล็ก ตัดออกจากตัว ตัดหลายรอบเบา ๆ และดันใบมีดเก็บทุกครั้งที่วาง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.materials-tools.p006
  topics:
  - technology.design.materials-tools
  difficulty: 2
  type: mcq
  stem: ข้อใด **ไม่ถูกต้อง** เมื่อใช้สว่านไฟฟ้าเจาะไม้
  choices:
  - id: a
    text: สวมถุงมือผ้าเพื่อกันมือบาด
    correct: true
    feedback: ถูกต้องที่เลือกข้อนี้ ถุงมืออาจถูกดอกสว่านที่หมุนดึงพัน ทำให้นิ้วบาดเจ็บรุนแรง
  - id: b
    text: ยึดชิ้นงานด้วยปากกาจับหรือแคลมป์
    feedback: เป็นการปฏิบัติที่ถูก ชิ้นงานจะไม่หมุนตามดอกสว่าน
  - id: c
    text: ถอดปลั๊กก่อนเปลี่ยนดอกสว่าน
    feedback: เป็นการปฏิบัติที่ถูก กันสว่านทำงานโดยไม่ตั้งใจ
  - id: d
    text: มัดผมยาวและไม่สวมเสื้อแขนหลวม
    feedback: เป็นการปฏิบัติที่ถูก กันผมและผ้าถูกดึงเข้าไปพัน
  hints:
  - โจทย์ถามข้อที่ไม่ถูกต้อง
  - อะไรที่อาจถูกดอกสว่านที่หมุนดึงเข้าไปพันได้
  solution: ห้ามสวมถุงมือขณะใช้สว่านหรือเครื่องมือที่หมุน เพราะเนื้อผ้าอาจพันกับดอกสว่าน ข้ออื่นเป็นการปฏิบัติที่ปลอดภัย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.materials-tools.p007
  topics:
  - technology.design.materials-tools
  difficulty: 2
  type: order
  stem: เรียงขั้นตอนการบัดกรีสายไฟเข้ากับขาแอลอีดีอย่างปลอดภัย
  items:
  - สวมแว่นตานิรภัย เปิดหน้าต่างหรือพัดลมระบายอากาศ
  - วางหัวแร้งบนแท่นวางแล้วเสียบปลั๊กรอให้ร้อน
  - ยึดชิ้นงานด้วยที่จับ แตะปลายหัวแร้งที่จุดต่อแล้วป้อนตะกั่ว
  - วางหัวแร้งกลับบนแท่นวาง รอให้จุดบัดกรีเย็น
  - ถอดปลั๊ก เก็บอุปกรณ์ และล้างมือ
  hints:
  - เตรียมความปลอดภัยก่อนเปิดเครื่องมือ
  - ล้างมือเป็นขั้นสุดท้าย
  solution: เตรียมความปลอดภัย → ให้หัวแร้งร้อนบนแท่น → บัดกรีโดยยึดชิ้นงาน → วางหัวแร้งกลับและรอให้เย็น → ถอดปลั๊ก เก็บของ ล้างมือ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.materials-tools.p008
  topics:
  - technology.design.materials-tools
  difficulty: 3
  type: numeric
  stem: จากภาพ เฟืองขับ 12 ฟันหมุนนาทีละ 60 รอบ เฟืองตาม 36 ฟันจะหมุนนาทีละกี่รอบ
  answer:
    value: 20
    unit: รอบ/นาที
  misconceptions:
  - match: 180
    feedback: คูณด้วย 36/12 กลับด้าน เฟืองใหญ่ต้องหมุนช้ากว่า ไม่ใช่เร็วกว่า
  - match: 60
    feedback: คิดว่าเฟืองทุกตัวหมุนเท่ากัน
  hints:
  - ฟันที่ขบกันต่อนาทีของสองเฟืองเท่ากัน
  - 12 × 60 = 36 × รอบของเฟืองตาม
  solution: $12 \times 60 = 36 \times n_2$ ได้ $n_2 = \frac{720}{36} = 20$ รอบต่อนาที เฟืองตามใหญ่กว่าจึงหมุนช้ากว่า แต่แรงบิดมากขึ้น
  figure:
    src: mechanisms.svg
    alt: 'แผนภาพกลไกสามแบบ ซ้าย: เฟืองขับ 12 ฟันขบกับเฟืองตาม 36 ฟัน หมุนในทิศตรงข้ามกัน กลาง: ลูกเบี้ยวรูปไข่หมุนอยู่ใต้ก้านตัวตามที่มีรางนำ ทำให้ตัวตามขึ้นลง ขวา: ข้อเหวี่ยงบนจานหมุนต่อกับก้านต่อที่ดันตัวเลื่อนในรางให้เลื่อนไปมา'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.materials-tools.p009
  topics:
  - technology.design.materials-tools
  difficulty: 3
  type: mcq
  stem: ของเล่นไม้ที่หมุนมือหมุนแล้วตุ๊กตาด้านบนกระโดดขึ้นลง ใช้กลไกใดเปลี่ยนการหมุนเป็นการขึ้นลง
  choices:
  - id: a
    text: ลูกเบี้ยวและตัวตาม
    correct: true
  - id: b
    text: รอก
    feedback: รอกเปลี่ยนทิศของแรงดึงเชือก ไม่ได้เปลี่ยนการหมุนเป็นการขึ้นลงเป็นจังหวะ
  - id: c
    text: ล้อและเพลา
    feedback: ล้อและเพลาส่งการหมุนเป็นการหมุน
  - id: d
    text: สายพาน
    feedback: สายพานส่งการหมุนไปอีกเพลาหนึ่ง
  hints:
  - ส่วนที่หมุนมีรูปร่างไม่กลม
  - ตัวที่วางบนลูกเบี้ยวจะถูกยกขึ้นลง
  solution: ลูกเบี้ยวมีรูปร่างไม่กลม เมื่อหมุน ตัวตามที่วางอยู่จะถูกยกขึ้นและลดลงเป็นจังหวะ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.materials-tools.p010
  topics:
  - technology.design.materials-tools
  difficulty: 3
  type: match
  stem: จับคู่กลไกกับตัวอย่างในชีวิตประจำวัน
  pairs:
  - left: รอก
    right: ชักธงขึ้นเสาหน้าโรงเรียน
  - left: โซ่และเฟือง
    right: ปั่นจักรยาน
  - left: ข้อเหวี่ยงและก้านต่อ
    right: เข็มจักรเย็บผ้าขยับขึ้นลง
  - left: คาน
    right: ชะแลงงัดหิน
  - left: ล้อและเพลา
    right: ไขควงหมุนสกรู
  hints:
  - รอกเปลี่ยนทิศของแรง
  - ข้อเหวี่ยงเปลี่ยนการหมุนเป็นการเลื่อนไปมา
  solution: กลไกแต่ละแบบเหมาะกับงานต่างกัน การเลือกกลไกให้ตรงกับการเคลื่อนที่ที่ต้องการเป็นทักษะสำคัญของงานออกแบบ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.materials-tools.p011
  topics:
  - technology.design.materials-tools
  difficulty: 3
  type: numeric
  stem: จักรยานมีจานหน้า 48 ฟัน และเฟืองหลัง 16 ฟัน ปั่นบันได 1 รอบ ล้อหลังหมุนกี่รอบ
  answer:
    value: 3
    unit: รอบ
  misconceptions:
  - match: 0.33
    feedback: หารกลับด้าน เฟืองหลังเล็กกว่าจึงหมุนมากกว่า
  hints:
  - โซ่ส่งฟันผ่านจานหน้าและเฟืองหลังเท่ากัน
  - 48 ÷ 16
  solution: $48 \times 1 = 16 \times n$ ได้ $n = 3$ รอบ เปลี่ยนไปใช้เฟืองหลังที่ใหญ่ขึ้นจะปั่นเบาขึ้นแต่ช้าลง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.materials-tools.p012
  topics:
  - technology.design.materials-tools
  difficulty: 3
  type: mcq
  stem: ต่อวงจรแอลอีดีกับถ่านและตัวต้านทานแล้วแอลอีดีไม่ติด ตรวจแล้วถ่านยังมีไฟและสายต่อครบ สาเหตุที่เป็นไปได้มากที่สุดคืออะไร
  choices:
  - id: a
    text: ต่อแอลอีดีกลับขั้ว (ขาสั้นอยู่ฝั่งขั้วบวก)
    correct: true
  - id: b
    text: ตัวต้านทานทำให้กระแสไหลไม่ได้เลย
    feedback: ตัวต้านทานลดกระแสแต่ไม่ได้ทำให้เป็นศูนย์
  - id: c
    text: แอลอีดีต้องใช้ไฟบ้านเท่านั้น
    feedback: แอลอีดีขนาดเล็กใช้ไฟจากถ่านได้
  - id: d
    text: วงจรปิดแล้วไฟจึงไม่ไหล
    feedback: กระแสไหลได้เมื่อวงจรปิด
  hints:
  - แอลอีดีเป็นไดโอด ยอมให้กระแสไหลทางเดียว
  - ขาที่ยาวกว่าเป็นขั้วบวก
  solution: แอลอีดีให้กระแสไหลทางเดียว ถ้าต่อกลับขั้ว (ขาสั้นอยู่ฝั่งบวก) จะไม่ติด ให้กลับด้านแอลอีดี
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.materials-tools.p013
  topics:
  - technology.design.materials-tools
  difficulty: 4
  type: numeric
  stem: จากภาพวงจร แหล่งจ่าย 5 V แอลอีดีใช้ 2 V และต้องการกระแส 0.02 A ควรใช้ตัวต้านทานกี่โอห์ม
  answer:
    value: 150
    unit: Ω
  misconceptions:
  - match: 250
    feedback: ใช้แรงดันทั้งหมด 5 V ลืมหักแรงดันของแอลอีดี
  - match: 100
    feedback: ใช้แรงดันของแอลอีดี 2 V แทนแรงดันที่ตกคร่อมตัวต้านทาน
  hints:
  - ตัวต้านทานรับแรงดันส่วนที่เหลือจากแอลอีดี
  - R = (V แหล่ง − V แอลอีดี) ÷ I
  solution: $R = \frac{5 - 2}{0.02} = \frac{3}{0.02} = 150\,\Omega$
  figure:
    src: led-circuit.svg
    alt: แผนภาพวงจรอนุกรม แหล่งจ่าย 5 V ต่อกับสวิตช์ ตัวต้านทาน R และแอลอีดีสีแดงที่ใช้ 2 V กระแส 0.02 A แล้วกลับมาที่ขั้วลบของแหล่งจ่าย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.materials-tools.p014
  topics:
  - technology.design.materials-tools
  difficulty: 4
  type: numeric
  stem: ใช้ชะแลงงัดหินหนัก 600 N จุดหมุนห่างจากหิน 0.2 m และห่างจากมือที่กด 1.2 m ต้องออกแรงกดอย่างน้อยกี่นิวตัน
  answer:
    value: 100
    unit: N
  misconceptions:
  - match: 3600
    feedback: สลับระยะ ใช้ 600 × 1.2 ÷ 0.2
  - match: 500
    feedback: นำ 600 ลบ 100 หรือใช้ผลต่างระยะ ต้องใช้หลักโมเมนต์
  hints:
  - 'ใช้หลักโมเมนต์: แรง × ระยะจากจุดหมุน ทั้งสองข้างเท่ากัน'
  - F × 1.2 = 600 × 0.2
  solution: $F \times 1.2 = 600 \times 0.2 = 120$ ได้ $F = \frac{120}{1.2} = 100$ N แขนของแรงยาวกว่าแขนของน้ำหนัก 6 เท่า จึงออกแรงน้อยลง 6 เท่า (ดู [โมเมนต์ของแรงและสมดุลการหมุน](/topic/physics.rotation.torque/))
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.materials-tools.p015
  topics:
  - technology.design.materials-tools
  difficulty: 4
  type: mcq
  stem: นักเรียนใช้บอร์ด KidBright ทำไฟหน้ารถเข็นให้ติดเองเมื่อมืด ข้อใดระบุส่วนต่าง ๆ ได้ถูกต้อง
  choices:
  - id: a
    text: เซนเซอร์แสงเป็นตัวป้อน โปรแกรมบนบอร์ดเทียบค่ากับเกณฑ์ แอลอีดีเป็นผลผลิต
    correct: true
  - id: b
    text: แอลอีดีเป็นตัวป้อน เซนเซอร์แสงเป็นผลผลิต
    feedback: สลับกัน เซนเซอร์รับข้อมูลเข้า แอลอีดีแสดงผลออก
  - id: c
    text: บอร์ดเป็นผลผลิต เพราะมีไฟกะพริบ
    feedback: บอร์ดทำหน้าที่ประมวลผลตามโปรแกรม
  - id: d
    text: ไม่ต้องมีโปรแกรม เซนเซอร์สั่งแอลอีดีได้เอง
    feedback: ไมโครคอนโทรลเลอร์ต้องมีโปรแกรมตัดสินใจว่าค่าแสงเท่าใดจึงเปิดไฟ
  hints:
  - เซนเซอร์รับข้อมูลจากสิ่งแวดล้อม
  - อุปกรณ์ที่ทำงานตามคำสั่งเป็นผลผลิต
  solution: ไมโครคอนโทรลเลอร์รับค่าจากเซนเซอร์ (ตัวป้อน) ประมวลผลตามโปรแกรม (กระบวนการ) แล้วสั่งแอลอีดี (ผลผลิต) ทำงาน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.materials-tools.p016
  topics:
  - technology.design.materials-tools
  difficulty: 5
  type: mcq
  stem: เพื่อนต่อสายไฟจากขั้วบวกไปขั้วลบของแบตเตอรี่ลิเทียมโดยตรง "เพื่อทดสอบว่ายังมีไฟไหม" แล้วสายร้อนมาก ข้อใดอธิบายและแก้ไขได้ถูกต้องที่สุด
  choices:
  - id: a
    text: เป็นการลัดวงจร กระแสไหลมากเพราะไม่มีความต้านทาน ให้ปลดสายออกด้วยความระวัง แล้วใช้มัลติมิเตอร์วัดแรงดันแทน
    correct: true
  - id: b
    text: สายร้อนเป็นเรื่องปกติ ต่อไว้นาน ๆ จะรู้ว่าแบตเตอรี่แรงแค่ไหน
    feedback: การลัดวงจรนานทำให้สายไหม้ และแบตเตอรี่ลิเทียมบวมหรือติดไฟได้
  - id: c
    text: ใช้สายที่เล็กลงจะได้ร้อนน้อยลง
    feedback: สายเล็กยิ่งร้อนเร็วและไหม้ง่าย ปัญหาคือไม่มีภาระในวงจร
  - id: d
    text: เอาน้ำราดแบตเตอรี่ให้เย็นทันที
    feedback: น้ำกับไฟฟ้าและแบตเตอรี่ลิเทียมเป็นอันตราย ให้ปลดวงจรและแจ้งครู
  hints:
  - วงจรที่ไม่มีอุปกรณ์มาลดกระแสเรียกว่าอะไร
  - เครื่องมือใดวัดแรงดันได้อย่างปลอดภัย
  solution: การต่อขั้วบวกกับขั้วลบโดยตรงคือการลัดวงจร กระแสสูงทำให้สายร้อนและแบตเตอรี่เสี่ยงติดไฟ ทดสอบแบตเตอรี่ด้วยมัลติมิเตอร์ และถ้าแบตเตอรี่บวมหรือร้อนผิดปกติให้แจ้งครู
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.materials-tools.p017
  topics:
  - technology.design.materials-tools
  difficulty: 5
  type: mcq
  stem: ชมรมจะทำรถเข็นจำลองที่มีมอเตอร์ขับล้อ บรรทุกของได้ 500 กรัม และมีไฟหน้า แผนใดเลือกวัสดุ กลไก ไฟฟ้า และความปลอดภัยได้เหมาะสมที่สุด
  choices:
  - id: a
    text: โครงไม้อัดยึดสกรู มอเตอร์ส่งกำลังผ่านเฟืองทดให้ล้อหมุนช้าลงแต่มีแรงบิดมาก ไฟหน้าแอลอีดีต่อตัวต้านทาน และเลื่อยหรือเจาะโดยยึดชิ้นงานและสวมแว่นตานิรภัย
    correct: true
  - id: b
    text: โครงกระดาษลัง ต่อมอเตอร์เข้ากับล้อตรง ๆ และต่อแอลอีดีตรงกับแบตเตอรี่
    feedback: กระดาษลังอาจรับน้ำหนักไม่ไหว มอเตอร์ขับตรงอาจแรงบิดไม่พอ และแอลอีดีไม่มีตัวต้านทานจะเสีย
  - id: c
    text: โครงเหล็กหนาเพื่อความแข็งแรงที่สุด ใช้เฟืองตามเล็กกว่าเฟืองขับเพื่อให้วิ่งเร็ว
    feedback: เหล็กหนักเกินสำหรับมอเตอร์เล็ก และเฟืองทดขึ้นทำให้แรงบิดน้อยลงจนอาจออกตัวไม่ได้
  - id: d
    text: เลือกวัสดุที่สีสวยที่สุด แล้วค่อยคิดเรื่องอื่นตอนลงมือ
    feedback: การเลือกวัสดุและกลไกต้องคิดจากความต้องการของงานตั้งแต่แรก
  hints:
  - 'ตรวจทีละด้าน: วัสดุรับน้ำหนักได้ไหม กลไกให้แรงบิดพอไหม วงจรปลอดภัยไหม'
  - เฟืองตามใหญ่กว่าเฟืองขับทำให้แรงบิดมากขึ้น
  solution: แผนแรกใช้วัสดุแข็งแรงพอและไม่หนักเกิน เฟืองทดลงเพิ่มแรงบิด วงจรมีตัวต้านทาน และมีมาตรการความปลอดภัยในการใช้เครื่องมือ
  license: CC-BY-SA-4.0
  ai_assisted: true
