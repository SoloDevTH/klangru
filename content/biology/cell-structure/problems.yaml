  - id: biology.cells.cell-structure.p014
    topics: [biology.cells.cell-structure]
    difficulty: 4
    type: numeric
    stem: "นักเรียนวาดภาพเซลล์พารามีเซียมที่เห็นผ่านกล้อง แล้วบอกว่าภาพวาดขยาย 400 เท่า ภาพวาดยาว 30 มิลลิเมตร พารามีเซียมตัวนี้ยาวจริงกี่ไมโครเมตร"
    answer: { value: 75, unit: µm }
    hints:
      - "ขนาดจริง = ขนาดของภาพ ÷ กำลังขยาย"
      - "แปลง 30 มิลลิเมตรเป็นไมโครเมตรก่อนหรือหลังหารก็ได้ (1 มิลลิเมตร = 1,000 ไมโครเมตร)"
    misconceptions:
      - { match: 0.075, feedback: "นี่คือคำตอบในหน่วยมิลลิเมตร ต้องคูณ 1,000 เพื่อเปลี่ยนเป็นไมโครเมตร" }
      - { match: 12000, feedback: "นำขนาดภาพคูณกำลังขยาย ขนาดจริงเล็กกว่าภาพ จึงต้องหาร" }
    solution: "$30\\ \\mathrm{mm} = 30{,}000\\ \\mu\\mathrm{m}$ ขนาดจริง $= \\frac{30{,}000}{400} = 75\\ \\mu\\mathrm{m}$"
