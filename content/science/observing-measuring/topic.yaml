id: science.inquiry.observing-measuring
subject: science
title:
  th: การสังเกตและการวัดในการสำรวจทางวิทยาศาสตร์ ใช้เครื่องมืออย่างปลอดภัยและบันทึกผล
  en: Observing and measuring in scientific investigation, using equipment safely and recording results
summary: สังเกตด้วยประสาทสัมผัสอย่างปลอดภัย อ่านค่าจากเครื่องมือที่มีสเกลรวมถึงค่าระหว่างขีด เลือกเครื่องมือให้เหมาะ วัดซ้ำหาค่าเฉลี่ย และบันทึกผลในตารางพร้อมหน่วย
difficulty: 1.5
minutes: 30
prerequisites:
  - math.measure.length
  - science.inquiry.investigation-design
encompasses:
  - { id: math.measure.length, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ความปลอดภัยเมื่อสังเกต
    src: observe-safely.svg
    alt: "สามช่อง ช่องซ้ายเป็นขวดสารที่ไม่รู้จักมีเครื่องหมายคำถามและเครื่องหมายห้าม ช่องกลางเป็นขวดเล็กกับลูกศรประที่ชี้ไปยังจมูกของคนที่หันหน้าตรง แสดงว่าให้กลิ่นลอยเข้าหาจมูกเบา ๆ ช่องขวาเป็นดวงอาทิตย์ที่มีเครื่องหมายห้ามมองตรง ๆ ด้านล่างเขียนว่าให้ดูภาพที่ฉายผ่านรูเข็มลงกระดาษแทน"
    caption: สังเกตด้วยประสาทสัมผัสได้ แต่ไม่ชิม ไม่ดมตรง ๆ และไม่มองดวงอาทิตย์
  - type: figure
    title: อ่านไม้บรรทัดที่เริ่มไม่ที่ศูนย์
    src: ruler-offset.svg
    alt: "ไม้บรรทัดหน่วยเซนติเมตรตั้งแต่ 0 ถึง 12 แท่งไม้สีส้มเริ่มที่ขีด 2.0 และปลายอยู่ที่ขีด 9.4 มีเส้นประลงมาจากปลายทั้งสองไปถึงไม้บรรทัด ด้านล่างเขียนว่า ความยาวเท่ากับ 9.4 ลบ 2.0 เท่ากับ 7.4 เซนติเมตร"
    caption: ความยาวได้จากการลบตำแหน่งด้านเริ่มออกจากตำแหน่งอีกด้านหนึ่ง
  - type: check
    problem: science.inquiry.observing-measuring.p003
    prompt: ลองนับช่องก่อนอ่านต่อ
  - type: interactive
    title: ความยาวคือปลายลบจุดเริ่ม
    caption: แถบสีส้มคือระยะจากจุดเริ่ม 2.0 ถึงจุดปลาย 9.4 ลองเปรียบเทียบกับไม้บรรทัดในภาพก่อนหน้า
    widget:
      kind: number-line
      min: 0
      max: 12
      points:
        - { value: 2.0, label: เริ่ม }
        - { value: 9.4, label: ปลาย }
      jumps:
        - { from: 2.0, to: 9.4, label: "ยาว 7.4 cm" }
  - type: worked-example
    title: ค่าเฉลี่ยของการวัดใบไม้ 3 ครั้ง
    problem: วัดความยาวใบไม้ 3 ครั้งได้ 9.8 cm, 9.6 cm และ 9.7 cm ควรบันทึกค่าเฉลี่ยเป็นเท่าไร
    steps:
      - text: 'รวมค่าทั้งสามเข้าด้วยกัน: $9.8 + 9.6 + 9.7 = 29.1\,\mathrm{cm}$'
      - text: 'หารด้วยจำนวนครั้งที่วัด คือ 3: $29.1 \div 3 = 9.7\,\mathrm{cm}$'
        why: ค่าเฉลี่ยคือผลรวมหารด้วยจำนวนครั้งที่วัด
      - text: ค่าที่วัดมีทศนิยมหนึ่งตำแหน่ง จึงบันทึกค่าเฉลี่ยด้วยทศนิยมหนึ่งตำแหน่งเช่นกัน
        why: ค่าเฉลี่ยที่มีทศนิยมมากกว่าค่าที่วัดทำให้ดูละเอียดเกินความจริง
    answer: 'บันทึกค่าเฉลี่ยเป็น $9.7\,\mathrm{cm}$'
  - type: figure
    title: ระดับสายตาตอนอ่านกระบอกตวง
    src: eye-level.svg
    alt: "สองภาพกระบอกตวงที่มีระดับน้ำเท่ากัน ภาพซ้ายตาอยู่สูงกว่าและเส้นสายตาเฉียงลงไปที่ผิวน้ำ ทำให้อ่านค่าเพี้ยน ภาพขวาตาอยู่ระดับเดียวกับผิวน้ำ เส้นสายตาเป็นแนวราบไปถึงจุดต่ำสุดของผิวโค้ง อ่านค่าได้ถูกต้อง"
    caption: มองให้ระดับสายตาเท่ากับผิวน้ำ แล้วอ่านที่จุดต่ำสุดของผิวโค้ง
  - type: worked-example
    title: หาปริมาตรน้ำที่เทออกจากกระบอกตวง
    problem: ระดับน้ำในกระบอกตวงอ่านได้ 52.0 mL ก่อนเท และ 38.5 mL หลังเท น้ำที่เทออกมีปริมาตรเท่าไร
    steps:
      - text: ระบุค่าที่อ่านได้ทั้งสองครั้งพร้อมหน่วย คือ 52.0 mL ก่อนเท และ 38.5 mL หลังเท
        why: หน่วยต้องเหมือนกันจึงลบกันได้
      - text: 'เอาค่าก่อนเทลบด้วยค่าหลังเท: $52.0 - 38.5 = 13.5\,\mathrm{mL}$'
        why: น้ำที่เทออกคือส่วนที่ลดลงจากระดับเดิม
      - text: ค่านี้มีทศนิยมหนึ่งตำแหน่งเท่ากับค่าที่อ่าน จึงไม่ต้องเขียนเกินนั้น
    answer: 'น้ำที่เทออกมีปริมาตร $13.5\,\mathrm{mL}$'
  - { type: check, problem: science.inquiry.observing-measuring.p006, prompt: "ลองอ่านระดับน้ำในกระบอกตวงก่อนดูเฉลย" }
glossary:
  - { term: ขีดที่เล็กที่สุด, definition: "ระยะระหว่างขีดสองขีดที่อยู่ใกล้กันที่สุดบนเครื่องมือวัด เป็นตัวกำหนดความละเอียดของการอ่านค่า" }
  - { term: ความละเอียดของเครื่องมือ, definition: "ค่าน้อยที่สุดที่เครื่องมือแยกให้เห็นได้ ปกติเท่ากับขีดที่เล็กที่สุด" }
  - { term: ระดับสายตา, definition: "ตำแหน่งที่ตาอยู่ในระดับเดียวกับผิวของเหลวหรือขีดที่กำลังอ่าน ช่วยไม่ให้ค่าที่อ่านเพี้ยนจากมุมมอง" }
  - { term: เมนิสคัส, definition: "ผิวโค้งของของเหลวในภาชนะ เช่น น้ำมีผิวโค้งเว้า ต้องอ่านค่าที่จุดต่ำสุดของผิวโค้ง" }
  - { term: เครื่องบันทึกข้อมูล, definition: "อุปกรณ์ที่วัดค่าซ้ำตามช่วงเวลาที่ตั้งไว้และเก็บค่าไว้ในหน่วยความจำเพื่อนำไปวิเคราะห์" }
flashcards:
  - { front: อ่านค่าที่อยู่ระหว่างขีดอย่างไร, back: "ดูขีดเล็กที่สุดก่อน ถ้าค่าอยู่ระหว่างขีดให้ประมาณเพิ่มอีกหนึ่งตำแหน่งทศนิยม" }
  - { front: ความยาวของแท่งที่ไม่เริ่มที่ 0, back: "ปลายด้านที่มากกว่า ลบ ปลายด้านที่น้อยกว่า" }
  - { front: ทำไมต้องวัดซ้ำและหาค่าเฉลี่ย, back: "เพื่อลดผลของความผิดพลาดแบบสุ่มและทำให้ผลน่าเชื่อถือมากขึ้น" }
  - { front: ค่าเฉลี่ยควรมีทศนิยมเท่าไร, back: "เท่ากับค่าที่วัดได้ เช่น ค่าที่วัดมีทศนิยมหนึ่งตำแหน่ง ค่าเฉลี่ยก็มีหนึ่งตำแหน่ง" }
  - { front: สังเกตกับอนุมานต่างกันอย่างไร, back: "การสังเกตคือสิ่งที่เห็นหรือวัดได้จริง การอนุมานคือการคาดเดาจากสิ่งที่สังเกต" }
