id: computer.systems.virtualization-cloud
subject: computer
title: { th: เวอร์ชวลไลเซชัน คอนเทนเนอร์ และการแยกระบบ, en: "Virtualization, containers and isolation" }
summary: เครื่องเสมือนและไฮเปอร์ไวเซอร์ คอนเทนเนอร์เทียบกับเครื่องเสมือน การแยกและสิทธิ์น้อยที่สุด บริการคลาวด์ IaaS PaaS SaaS ความรับผิดชอบร่วม และการป้องกันระดับฮาร์ดแวร์
difficulty: 5.5
minutes: 40
prerequisites: [computer.systems.operating-systems, computer.networks.internet-basics]
encompasses:
  - { id: computer.systems.operating-systems, weight: 0.3 }
  - { id: computer.networks.internet-basics, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: vm-vs-container.svg
    alt: "สองคอลัมน์เทียบกัน คอลัมน์ซ้ายเป็นเครื่องเสมือนที่มีไฮเปอร์ไวเซอร์อยู่บนฮาร์ดแวร์ และมีระบบปฏิบัติการแขกสองชุดแยกกันพร้อมแอป A กับแอป B คอลัมน์ขวาเป็นคอนเทนเนอร์ที่มีระบบปฏิบัติการโฮสต์และเคอร์เนลร่วมอยู่บนฮาร์ดแวร์ และมีเอนจินคอนเทนเนอร์กับคอนเทนเนอร์ A และ B"
    caption: "เครื่องเสมือนแยกทั้งระบบปฏิบัติการ ส่วนคอนเทนเนอร์แยกเฉพาะแอปบนเคอร์เนลเดียวกัน"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: cloud-responsibility.svg
    alt: "ตารางเจ็ดแถวกับสามคอลัมน์ IaaS PaaS และ SaaS แถวบนสุดคือข้อมูลและการตั้งค่าสิทธิ์ที่ผู้ใช้ดูแลในทุกระดับ แถวกลางเป็นแอปพลิเคชันที่ผู้ใช้ดูแลใน IaaS กับ PaaS แต่ผู้ให้บริการดูแลใน SaaS และแถวล่างเป็นศูนย์ข้อมูลที่ผู้ให้บริการดูแลทุกระดับ"
    caption: "ความรับผิดชอบเปลี่ยนไปตามระดับบริการ ยิ่งเป็น SaaS ผู้ใช้ยิ่งดูแลน้อยลง แต่ข้อมูลยังเป็นของผู้ใช้เสมอ"
  - type: worked-example
    title: เช่าเครื่องเสมือนหรือซื้อเครื่องเอง
    problem: "ค่าเช่าเครื่องเสมือน 2 บาทต่อชั่วโมง (ค่าสมมติ) ถ้าซื้อเครื่องราคา 30,000 บาท ใช้ 36 เดือน (ไม่รวมค่าไฟและการดูแล) ระหว่างการรันวันละ 8 ชั่วโมงเฉพาะ 22 วันทำการต่อเดือน กับรันตลอด 24 ชั่วโมงทุกวันต่อเดือน 30 วัน แบบใดคุ้มกว่า"
    steps:
      - text: "กรณีรันวันละ 8 ชั่วโมง 22 วัน: ค่าเช่าต่อเดือน = 2 × 8 × 22 = 352 บาท ตลอด 36 เดือนได้ 352 × 36 = 12,672 บาท"
        why: "ต้องคิดเฉพาะชั่วโมงที่ใช้จริง ถ้าคิดตลอดเวลาจะไม่ยุติธรรมกับการใช้งานแบบนี้"
      - text: "เทียบกับการซื้อ 30,000 บาท กรณีนี้การเช่าถูกกว่า"
        why: "การใช้น้อยทำให้ค่าเช่ารวมต่ำกว่าเงินลงทุนของเครื่อง"
      - text: "กรณีรันตลอด 24 ชั่วโมง 30 วัน: ค่าเช่าต่อเดือน = 2 × 24 × 30 = 1,440 บาท ตลอด 36 เดือนได้ 51,840 บาท"
      - text: "เทียบกับการซื้อ 30,000 บาท กรณีนี้การซื้อเครื่องถูกกว่า"
        why: "เมื่อใช้งานตลอดเวลา ค่าเช่าสะสมจะสูงกว่าเงินลงทุนได้ จึงต้องคำนวณทุกครั้งก่อนตัดสินใจ"
    answer: "การใช้น้อยเหมาะกับการเช่า ส่วนการใช้ตลอดเวลาเหมาะกับการซื้อเครื่องในกรณีตัวเลขสมมตินี้ และยังต้องรวมค่าไฟและการดูแลในการตัดสินใจจริง"
  - { type: check, problem: computer.systems.virtualization-cloud.p003, prompt: "ไฮเปอร์ไวเซอร์ชนิดที่ 2 ทำงานอย่างไร" }
  - type: worked-example
    title: กำหนดสิทธิ์ให้โปรแกรมรายงานแบบสิทธิ์น้อยที่สุด
    problem: "โปรแกรมสรุปยอดขายต้องอ่านไฟล์ทั้งหมดในโฟลเดอร์ sales และเขียนผลลัพธ์ลงไฟล์ report.csv หนึ่งไฟล์ โปรแกรมนี้ควรได้สิทธิ์อะไรบ้าง"
    steps:
      - text: "ระบุสิ่งที่งานต้องทำจริง คือ อ่านโฟลเดอร์ sales และเขียนไฟล์ report.csv เท่านั้น"
        why: "การเริ่มจากงานจริงทำให้เห็นว่าสิทธิ์ใดจำเป็นและสิทธิ์ใดไม่จำเป็น"
      - text: "ให้สิทธิ์อ่านกับโฟลเดอร์ sales และให้สิทธิ์เขียนเฉพาะไฟล์ report.csv"
      - text: "ไม่ให้สิทธิ์ลบ ไม่ให้สิทธิ์ผู้ดูแลระบบ และไม่ให้สิทธิ์เขียนลงโฟลเดอร์ทั้งหมด"
        why: "ถ้าโปรแกรมถูกโจมตีหรือมีบั๊ก ความเสียหายจะถูกจำกัดอยู่ในสิ่งที่ให้สิทธิ์ไว้เท่านั้น"
      - text: "ทดสอบว่าการลบไฟล์ในโฟลเดอร์ sales ถูกปฏิเสธ และการเขียน report.csv ทำได้"
    answer: "อ่านได้เฉพาะโฟลเดอร์ sales เขียนได้เฉพาะ report.csv และไม่มีสิทธิ์อื่นที่งานไม่ต้องใช้"
  - { type: check, problem: computer.systems.virtualization-cloud.p011, prompt: "การแยกระหว่างกระบวนการทำงานอย่างไร" }
glossary:
  - { term: เครื่องเสมือน (virtual machine), definition: "ซอฟต์แวร์ที่จำลองฮาร์ดแวร์ให้รันระบบปฏิบัติการหนึ่งชุดหรือมากกว่าได้บนเครื่องจริงเครื่องเดียว" }
  - { term: ไฮเปอร์ไวเซอร์ (hypervisor), definition: "ซอฟต์แวร์ที่จัดสรรและควบคุมเครื่องเสมือน ชนิดที่ 1 รันบนฮาร์ดแวร์ ชนิดที่ 2 รันบนระบบปฏิบัติการปกติ" }
  - { term: คอนเทนเนอร์ (container), definition: "การแยกแอปโดยใช้เคอร์เนลของระบบปฏิบัติการร่วมกัน ทำให้เริ่มเร็วและใช้ทรัพยากรน้อย" }
  - { term: สิทธิ์น้อยที่สุด (least privilege), definition: "หลักการให้สิทธิ์เฉพาะเท่าที่งานต้องการ เพื่อจำกัดความเสียหายเมื่อเกิดข้อผิดพลาดหรือการโจมตี" }
  - { term: ช่องทางข้างเคียง (side-channel), definition: "ช่องทางที่ผู้โจมตีอนุมานข้อมูลจากผลข้างเคียงที่วัดได้ เช่น เวลาตอบสนองหรือการใช้แคชร่วมกัน" }
flashcards:
  - { front: "ไฮเปอร์ไวเซอร์ชนิดที่ 1 กับชนิดที่ 2 ต่างกันอย่างไร", back: "ชนิดที่ 1 รันบนฮาร์ดแวร์โดยตรง ชนิดที่ 2 รันบนระบบปฏิบัติการปกติ" }
  - { front: "ทำไมคอนเทนเนอร์เริ่มเร็วกว่าเครื่องเสมือน", back: "ไม่ต้องบูตระบบปฏิบัติการใหม่ทั้งชุด เพราะใช้เคอร์เนลร่วมกับโฮสต์" }
  - { front: "IaaS, PaaS และ SaaS ต่างกันตรงไหน", back: "IaaS ให้เช่าโครงสร้างพื้นฐาน PaaS ให้แพลตฟอร์มรันแอป SaaS ให้ใช้โปรแกรมสำเร็จรูปผ่านเว็บ" }
  - { front: "ความรับผิดชอบร่วมด้านความปลอดภัยคืออะไร", back: "ผู้ให้บริการดูแลโครงสร้างพื้นฐาน ผู้ใช้ดูแลข้อมูล สิทธิ์ และซอฟต์แวร์ที่ตนนำขึ้น" }
