<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="sans-serif" font-size="14">
  <title>แผนภาพต้นไม้ผลต่างวัตถุดิบทางตรง: ผลต่างราคาและผลต่างปริมาณ</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="800" height="380" fill="#ffffff"/>
  <rect x="250.0" y="16.0" width="300.0" height="64.0" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="400.0" y="43.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">ต้นทุนจริง</text>
  <text x="400.0" y="62.0" text-anchor="middle" fill="#1f2937" font-size="13">AQ × AP</text>
  <rect x="250.0" y="150.0" width="300.0" height="64.0" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="400.0" y="177.1" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">ปริมาณจริง × ราคามาตรฐาน</text>
  <text x="400.0" y="196.1" text-anchor="middle" fill="#1f2937" font-size="13">AQ × SP</text>
  <rect x="250.0" y="284.0" width="300.0" height="64.0" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="400.0" y="311.1" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">ต้นทุนมาตรฐานของผลผลิตจริง</text>
  <text x="400.0" y="330.1" text-anchor="middle" fill="#1f2937" font-size="13">SQ × SP</text>
  <line x1="400.0" y1="80.0" x2="400.0" y2="148.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="400.0" y1="214.0" x2="400.0" y2="282.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="20.0" y="90.0" width="200.0" height="64.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="120.0" y="117.1" text-anchor="middle" fill="#1f2937" font-size="13.5" font-weight="bold">ผลต่างราคา</text>
  <text x="120.0" y="135.6" text-anchor="middle" fill="#1f2937" font-size="12.5">(AP − SP) × AQ</text>
  <rect x="20.0" y="224.0" width="200.0" height="64.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="120.0" y="251.1" text-anchor="middle" fill="#1f2937" font-size="13.5" font-weight="bold">ผลต่างปริมาณ</text>
  <text x="120.0" y="269.6" text-anchor="middle" fill="#1f2937" font-size="12.5">(AQ − SQ) × SP</text>
  <line x1="398.0" y1="115.0" x2="224.0" y2="120.0" stroke="#1f2937" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="398.0" y1="249.0" x2="224.0" y2="254.0" stroke="#1f2937" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <rect x="590.0" y="150.0" width="190.0" height="64.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="685.0" y="177.1" text-anchor="middle" fill="#1f2937" font-size="13.5" font-weight="bold">ผลต่างรวม</text>
  <text x="685.0" y="195.6" text-anchor="middle" fill="#1f2937" font-size="12.5">AQ×AP − SQ×SP</text>
  <path d="M550,48 L685,48 L685,148" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <path d="M550,316 L685,316 L685,216" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="400.0" y="368.0" text-anchor="middle" fill="#6b7280" font-size="12">ผลต่างราคา: จัดซื้อรับผิดชอบ · ผลต่างปริมาณ: ฝ่ายผลิตรับผิดชอบ · ใช้จริงน้อยกว่ามาตรฐาน = ผลต่างที่น่าพอใจ (F)</text>
</svg>
