<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" font-family="sans-serif"><title>แผนผังบล็อกของระบบวัดจากเซนเซอร์ถึงจอแสดงผล</title><rect x="0" y="0" width="900" height="230" fill="#ffffff"/><rect x="30" y="80" width="180" height="80" rx="8" fill="#eef4fb" stroke="#1f3a5f" stroke-width="2"/><text x="120.0" y="114.0" text-anchor="middle" font-size="17" fill="#111">เซนเซอร์</text><text x="120.0" y="136.0" text-anchor="middle" font-size="13" fill="#333">แปลงปริมาณจริงเป็นสัญญาณ</text><line x1="210" y1="120" x2="244.0" y2="120.0" stroke="#1f3a5f" stroke-width="2.5"/><polygon points="250,120 240.0,114.0 240.0,126.0" fill="#1f3a5f"/><rect x="250" y="80" width="180" height="80" rx="8" fill="#eef4fb" stroke="#1f3a5f" stroke-width="2"/><text x="340.0" y="114.0" text-anchor="middle" font-size="17" fill="#111">ปรับสภาพสัญญาณ</text><text x="340.0" y="136.0" text-anchor="middle" font-size="13" fill="#333">ขยายและกรองให้อยู่ในช่วง</text><line x1="430" y1="120" x2="464.0" y2="120.0" stroke="#1f3a5f" stroke-width="2.5"/><polygon points="470,120 460.0,114.0 460.0,126.0" fill="#1f3a5f"/><rect x="470" y="80" width="150" height="80" rx="8" fill="#eef4fb" stroke="#1f3a5f" stroke-width="2"/><text x="545.0" y="114.0" text-anchor="middle" font-size="17" fill="#111">ADC</text><text x="545.0" y="136.0" text-anchor="middle" font-size="13" fill="#333">แปลงเป็นเลขฐานสอง</text><line x1="620" y1="120" x2="654.0" y2="120.0" stroke="#1f3a5f" stroke-width="2.5"/><polygon points="660,120 650.0,114.0 650.0,126.0" fill="#1f3a5f"/><rect x="660" y="80" width="210" height="80" rx="8" fill="#eef4fb" stroke="#1f3a5f" stroke-width="2"/><text x="765.0" y="120.0" text-anchor="middle" font-size="17" fill="#111">จอแสดงผลหรือตัวควบคุม</text><text x="30" y="195" font-size="15" fill="#333">เซนเซอร์รับปริมาณทางกายภาพ (อุณหภูมิ ความดัน ระดับ การไหล) แล้วส่งออกเป็นแรงดันหรือกระแส</text><text x="30" y="218" font-size="15" fill="#333">ADC ส่งออกเป็นตัวเลข ซึ่งจอแสดงผลหรือตัวควบคุมนำไปใช้ต่อ</text></svg>
