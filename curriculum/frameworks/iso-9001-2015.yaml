# ISO 9001:2015 ระบบบริหารงานคุณภาพ ข้อกำหนด (โครงข้อกำหนดเท่านั้น) และหลักการบริหารคุณภาพ 7 ข้อของ ISO 9000:2015
#
# ที่มา (ตรวจเมื่อ 2026-10-24)
# - www.iso.org (รวมหน้าตัวอย่าง OBP) ใช้ระบบกันบอต ตอบ HTTP 403 กับ curl, WebFetch และเบราว์เซอร์อัตโนมัติ จึงยังไม่ได้อ่านจากหน้า ISO โดยตรง
# - เลขข้อ 4-10 และข้อย่อยระดับสอง (4.1-10.3) ตรวจจากสารบัญหนังสือ "Praxisbuch ISO 9001:2015" (Hanser) ที่ห้องสมุด HTW Berlin
#   สแกนเผยแพร่ ซึ่งเรียงข้อย่อยตามมาตรฐาน (ภาษาเยอรมัน) และเทียบกับชื่อหมวดใหญ่ใน Wikipedia "ISO 9000 family"
#   ชื่อข้อในไฟล์นี้เป็นคำอธิบายภาษาไทยของเราเอง ไม่ใช่คำแปลอย่างเป็นทางการ (ฉบับแปลไทยคือ มอก. 9001 ซึ่งจำหน่ายโดย สมอ.)
# - หลักการบริหารคุณภาพ 7 ข้อ (QMP 1-7) ตรวจจาก Wikipedia "ISO 9000 family"
# - แหล่งข่าวรองหลายแห่ง (NSF, ANSI) รายงานว่า ISO 9001:2026 ประกาศใช้ 16 ก.ย. 2026 และจะมีช่วงเปลี่ยนผ่านราวสามปี
#   ยังยืนยันจาก iso.org ไม่ได้ ไฟล์นี้เก็บฉบับ 2015 ตามที่ใช้รับรองกันอยู่ ถ้าใช้ฉบับใหม่ต้องตรวจเลขข้อใหม่
#
# รหัส: เลขข้อตามมาตรฐาน ("4.1" ถึง "10.3") และ "QMP1" ถึง "QMP7" (ISO 9000:2015 ใช้ชื่อ QMP 1-7)
# ไม่เก็บข้อ 1-3 (ขอบข่าย เอกสารอ้างอิง คำศัพท์) และไม่เก็บข้อย่อยระดับสาม (เช่น 7.1.5)
id: iso-9001-2015
title: "ISO 9001:2015 Quality management systems — Requirements (โครงข้อกำหนด) และหลักการบริหารคุณภาพของ ISO 9000:2015"
short: ISO 9001:2015
kind: international-standard
subjects: [management]
language: th
sources:
  - { title: "ISO 9001:2015 Quality management systems — Requirements (หน้าแคตตาล็อก ตอบ HTTP 403 จากเครือข่ายของเรา)", url: "https://www.iso.org/standard/62085.html", publisher: "International Organization for Standardization (ISO)", retrieved: "2026-10-24" }
  - { title: "Praxisbuch ISO 9001:2015 (สารบัญ ใช้ตรวจเลขข้อย่อย 4.1-10.3)", url: "https://sisis.rz.htw-berlin.de/inh2016/12482062.pdf", publisher: "Carl Hanser Verlag / HTW Berlin Bibliothek", retrieved: "2026-10-24", pages: "สารบัญ หน้า VII-IX" }
  - { title: "ISO 9000 family (Wikipedia)", url: "https://en.wikipedia.org/wiki/ISO_9000_family", publisher: "Wikipedia", retrieved: "2026-10-24" }
copyright: "© ISO สงวนสิทธิ์ทั้งหมด ข้อความมาตรฐานขายโดย ISO และหน่วยงานมาตรฐานแห่งชาติ (ในไทยคือ มอก. 9001 ของ สมอ.) ห้ามทำซ้ำ ไฟล์นี้เก็บเฉพาะเลขข้อและคำอธิบายสั้นด้วยคำของคลังรู้ ไม่มีข้อความจากมาตรฐาน"
completeness: structure-and-summary
strands:
  - id: QMP
    title: หลักการบริหารคุณภาพ 7 ข้อ (ISO 9000:2015)
    standards:
      - id: QMP
        text: "หลักการที่มาตรฐานตระกูล ISO 9000 ใช้เป็นฐาน (สรุปความ)"
        indicators:
          - { id: QMP1, text: "มุ่งเน้นลูกค้า: ตอบสนองและพยายามให้เกินความคาดหวังของลูกค้า" }
          - { id: QMP2, text: "ความเป็นผู้นำ: ผู้นำทุกระดับกำหนดทิศทางและสร้างเงื่อนไขให้ทุกคนมุ่งสู่วัตถุประสงค์คุณภาพ" }
          - { id: QMP3, text: "การมีส่วนร่วมของบุคลากร: บุคลากรที่มีความสามารถและได้รับมอบอำนาจมีส่วนร่วมทั่วทั้งองค์กร" }
          - { id: QMP4, text: "การบริหารเชิงกระบวนการ: จัดการกิจกรรมเป็นกระบวนการที่เชื่อมโยงกันเป็นระบบ" }
          - { id: QMP5, text: "การปรับปรุง: องค์กรที่ประสบความสำเร็จมุ่งปรับปรุงอย่างต่อเนื่อง" }
          - { id: QMP6, text: "การตัดสินใจจากหลักฐาน: วิเคราะห์ข้อมูลและสารสนเทศก่อนตัดสินใจ" }
          - { id: QMP7, text: "การบริหารความสัมพันธ์: จัดการความสัมพันธ์กับผู้มีส่วนได้ส่วนเสีย เช่น ผู้ส่งมอบ" }
  - id: "4"
    title: ข้อ 4 บริบทขององค์กร
    standards:
      - id: "4"
        text: "เข้าใจองค์กร ผู้เกี่ยวข้อง และขอบเขตของระบบ (สรุปความ)"
        indicators:
          - { id: "4.1", text: "ระบุประเด็นภายในและภายนอกที่มีผลต่อทิศทางและระบบบริหารคุณภาพ" }
          - { id: "4.2", text: "ระบุผู้มีส่วนได้ส่วนเสียที่เกี่ยวข้องและความต้องการของพวกเขา" }
          - { id: "4.3", text: "กำหนดขอบเขตของระบบบริหารคุณภาพ" }
          - { id: "4.4", text: "จัดทำระบบบริหารคุณภาพและกระบวนการที่จำเป็น พร้อมลำดับและการเชื่อมโยงของกระบวนการ" }
  - id: "5"
    title: ข้อ 5 ความเป็นผู้นำ
    standards:
      - id: "5"
        text: "บทบาทของผู้บริหารสูงสุด (สรุปความ)"
        indicators:
          - { id: "5.1", text: "ผู้บริหารแสดงภาวะผู้นำและความมุ่งมั่นต่อระบบ รวมถึงการมุ่งเน้นลูกค้า" }
          - { id: "5.2", text: "กำหนดและสื่อสารนโยบายคุณภาพ" }
          - { id: "5.3", text: "มอบหมายบทบาท ความรับผิดชอบ และอำนาจหน้าที่ในองค์กร" }
  - id: "6"
    title: ข้อ 6 การวางแผน
    standards:
      - id: "6"
        text: "วางแผนระบบ (ขั้น P ของวงจร PDCA) (สรุปความ)"
        indicators:
          - { id: "6.1", text: "วางการดำเนินการรับมือความเสี่ยงและโอกาส" }
          - { id: "6.2", text: "ตั้งวัตถุประสงค์คุณภาพและวางแผนให้บรรลุ" }
          - { id: "6.3", text: "วางแผนการเปลี่ยนแปลงของระบบอย่างมีการควบคุม" }
  - id: "7"
    title: ข้อ 7 การสนับสนุน
    standards:
      - id: "7"
        text: "ทรัพยากรและสิ่งที่ทำให้ระบบทำงานได้ (สรุปความ)"
        indicators:
          - { id: "7.1", text: "จัดทรัพยากร: บุคลากร โครงสร้างพื้นฐาน สภาพแวดล้อมการทำงาน ทรัพยากรสำหรับการเฝ้าระวังและการวัด และความรู้ขององค์กร" }
          - { id: "7.2", text: "ความสามารถของบุคลากรที่ทำงานซึ่งมีผลต่อคุณภาพ" }
          - { id: "7.3", text: "ความตระหนักของบุคลากรต่อนโยบาย วัตถุประสงค์ และบทบาทของตน" }
          - { id: "7.4", text: "การสื่อสารภายในและภายนอก" }
          - { id: "7.5", text: "ข้อมูลที่เป็นเอกสาร: การจัดทำ ปรับปรุง และควบคุม" }
  - id: "8"
    title: ข้อ 8 การดำเนินงาน
    standards:
      - id: "8"
        text: "การผลิตสินค้าและให้บริการ (ขั้น D ของวงจร PDCA) (สรุปความ)"
        indicators:
          - { id: "8.1", text: "วางแผนและควบคุมการดำเนินงาน" }
          - { id: "8.2", text: "กำหนดและทบทวนข้อกำหนดของสินค้าและบริการ รวมถึงการสื่อสารกับลูกค้า" }
          - { id: "8.3", text: "การออกแบบและพัฒนาสินค้าและบริการ" }
          - { id: "8.4", text: "ควบคุมกระบวนการ สินค้า และบริการที่ได้จากผู้ให้บริการภายนอก" }
          - { id: "8.5", text: "การผลิตและการให้บริการ: การควบคุม การชี้บ่งและสอบกลับ ทรัพย์สินของลูกค้า การเก็บรักษา และกิจกรรมหลังส่งมอบ" }
          - { id: "8.6", text: "การปล่อยสินค้าและบริการหลังตรวจว่าผ่านข้อกำหนด" }
          - { id: "8.7", text: "ควบคุมผลลัพธ์ที่ไม่เป็นไปตามข้อกำหนด" }
  - id: "9"
    title: ข้อ 9 การประเมินผลการดำเนินงาน
    standards:
      - id: "9"
        text: "วัดและทบทวนผล (ขั้น C ของวงจร PDCA) (สรุปความ)"
        indicators:
          - { id: "9.1", text: "การเฝ้าระวัง การวัด การวิเคราะห์ และการประเมิน รวมถึงความพึงพอใจของลูกค้า" }
          - { id: "9.2", text: "การตรวจติดตามคุณภาพภายใน" }
          - { id: "9.3", text: "การทบทวนโดยฝ่ายบริหาร" }
  - id: "10"
    title: ข้อ 10 การปรับปรุง
    standards:
      - id: "10"
        text: "แก้ไขและปรับปรุงต่อเนื่อง (ขั้น A ของวงจร PDCA) (สรุปความ)"
        indicators:
          - { id: "10.1", text: "หลักทั่วไปของการปรับปรุง" }
          - { id: "10.2", text: "สิ่งที่ไม่เป็นไปตามข้อกำหนดและการปฏิบัติการแก้ไข" }
          - { id: "10.3", text: "การปรับปรุงอย่างต่อเนื่อง" }
