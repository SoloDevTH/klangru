id: technology.design.technology-project
subject: technology
title:
  th: โครงงานเทคโนโลยี
  en: Technology projects
summary: ประยุกต์ความรู้หลายศาสตร์และทรัพยากรทำโครงงาน เลือกหัวข้อ เขียนเค้าโครง วางแผนด้วยแผนภูมิแกนต์และเส้นทางวิกฤต งบประมาณ สมุดบันทึก ทดสอบ นำเสนอ และประเมินด้วยเกณฑ์ให้คะแนน
difficulty: 5
minutes: 40
prerequisites:
- technology.design.design-process-advanced
encompasses:
- id: technology.design.design-process-advanced
  weight: 0.3
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  title: แผนภูมิแกนต์ของโครงงาน
  src: farm-gantt.svg
  alt: 'แผนภูมิแกนต์โครงงานรดน้ำแปลงผักอัตโนมัติ 12 สัปดาห์ (แผนสมมติ) A สำรวจปัญหาและเลือกหัวข้อ สัปดาห์ 1 B ศึกษาข้อมูลและความรู้ สัปดาห์ 2–3 C เขียนเค้าโครงและขออนุมัติ สัปดาห์ 4 D ออกแบบวงจรและเขียนโปรแกรม สัปดาห์ 5–6 E จัดซื้ออุปกรณ์ สัปดาห์ 5 F สร้างต้นแบบ สัปดาห์ 7–8 รอทั้ง D และ E G ทดสอบและปรับปรุง สัปดาห์ 9–10 H เขียนรายงาน สัปดาห์ 9–11 I เตรียมและนำเสนอ สัปดาห์ 12 รอทั้ง G และ H แท่งสีแดงคืองานบนเส้นทางวิกฤต A B C D F H I แท่งสีน้ำเงินคืองานที่มีเวลาเผื่อ E และ G'
  caption: งานรวมกัน 15 สัปดาห์ แต่เสร็จใน 12 สัปดาห์เพราะบางงานทำพร้อมกัน
- type: worked-example
  title: เลือกหัวข้อและเขียนวัตถุประสงค์ที่วัดได้
  problem: กลุ่มนักเรียนเสนอหัวข้อ "ใช้เทคโนโลยีช่วยเกษตรกร" มีเวลา 12 สัปดาห์ งบ 1,500 บาท ปรับหัวข้อและเขียนวัตถุประสงค์
  steps:
  - text: 'ตรวจหัวข้อ: กว้างเกินไป ไม่รู้ว่าแก้ปัญหาอะไรของใคร'
  - text: 'หาปัญหาจริงใกล้ตัว: แปลงผักของโรงเรียนเหี่ยวทุกวันหยุดยาวเพราะไม่มีคนรดน้ำ'
  - text: 'ตรวจความเป็นไปได้: อุปกรณ์รวมราว 1,170 บาท ไม่เกินงบ สมาชิกเคยเขียนโปรแกรมบอร์ดไมโครคอนโทรลเลอร์ ใช้ปั๊มแรงดันต่ำจึงปลอดภัย'
    why: หัวข้อที่ดีต้องทำได้จริงภายใต้เวลา งบ ทักษะ และปลอดภัย
  - text: 'ตั้งชื่อ: ระบบรดน้ำแปลงผักอัตโนมัติด้วยเซนเซอร์ความชื้นในดิน'
  - text: 'เขียนวัตถุประสงค์ที่วัดได้: 1) รักษาความชื้นในดินให้อยู่ในช่วงที่ตั้งไว้ตลอดวันหยุด 3 วัน 2) ใช้น้ำน้อยกว่ารดด้วยมืออย่างน้อยร้อยละ 20'
    why: ตัวเลขทำให้ตอนทดสอบบอกได้ว่าบรรลุหรือไม่
  answer: เปลี่ยนเป็นหัวข้อระบบรดน้ำแปลงผักอัตโนมัติ ซึ่งเป็นปัญหาจริง ทำได้ในเวลาและงบ และมีวัตถุประสงค์ที่วัดได้ 2 ข้อ
- type: check
  problem: technology.design.technology-project.p004
  prompt: หัวข้อใดทำได้จริงภายใต้เวลาและงบ
- type: worked-example
  title: ใช้เกณฑ์ประเมินตนเองก่อนนำเสนอ
  problem: ทีมประเมินโครงงานของตนด้วยเกณฑ์ในบทเรียน ได้ระดับ 4, 3, 3, 2, 4, 3 (จากเต็ม 4) ตามลำดับด้าน ปัญหา การออกแบบ ชิ้นงาน การทดสอบ เอกสาร การนำเสนอ หาคะแนนรวมและบอกว่าควรปรับด้านใดก่อน
  steps:
  - text: 'คะแนนแต่ละด้าน = น้ำหนัก × ระดับ ÷ 4: 15 × 4/4 = 15 · 20 × 3/4 = 15 · 25 × 3/4 = 18.75 · 15 × 2/4 = 7.5 · 10 × 4/4 = 10 · 15 × 3/4 = 11.25'
  - text: รวม 15 + 15 + 18.75 + 7.5 + 10 + 11.25 = 77.5 คะแนน จาก 100
  - text: 'หาด้านที่เสียคะแนนมากที่สุด: การทดสอบเสีย 7.5 ชิ้นงานเสีย 6.25 การออกแบบเสีย 5'
    why: ด้านที่ระดับต่ำสุดหรือมีน้ำหนักมากมักเพิ่มคะแนนได้มากที่สุดเมื่อปรับ
  - text: 'แผนปรับ: ทดสอบซ้ำวันหยุดจริง 3 วัน บันทึกความชื้นทุกชั่วโมง เทียบกับวัตถุประสงค์ และใส่ผลการปรับปรุงในรายงาน'
  answer: ได้ 77.5 คะแนน ควรปรับด้านการทดสอบและปรับปรุงก่อน เพราะเสียคะแนนมากที่สุด (7.5 คะแนน)
- type: check
  problem: technology.design.technology-project.p007
  prompt: S ต้องรอทั้ง Q และ R
glossary:
- term: โครงงานเทคโนโลยี
  definition: งานที่ประยุกต์ความรู้และทักษะจากหลายศาสตร์รวมทั้งทรัพยากร เพื่อแก้ปัญหาหรือพัฒนางาน
- term: เค้าโครงโครงงาน
  definition: แผนที่เขียนก่อนลงมือ บอกที่มา วัตถุประสงค์ ขอบเขต วิธีดำเนินงาน แผนปฏิบัติงาน งบประมาณ และผลที่คาดว่าจะได้รับ
- term: แผนภูมิแกนต์
  definition: แผนภูมิแสดงงานย่อยเป็นแท่งตามช่วงเวลาที่ทำ ใช้วางแผนและติดตามงาน
- term: เส้นทางวิกฤต
  definition: สายของงานที่ต้องทำต่อกันซึ่งยาวที่สุด งานบนสายนี้ช้าเท่าไร โครงงานก็ช้าเท่านั้น
- term: เวลาเผื่อ
  definition: เวลาที่งานหนึ่งช้าได้โดยไม่ทำให้โครงงานเสร็จช้าลง
- term: สมุดบันทึกการปฏิบัติงาน
  definition: บันทึกวันที่ งานที่ทำ ผลที่วัดได้ ปัญหา และสิ่งที่จะทำต่อ ทุกครั้งที่ทำโครงงาน
- term: เกณฑ์ให้คะแนน (rubric)
  definition: ตารางบอกด้านที่ประเมิน น้ำหนัก และลักษณะของงานแต่ละระดับ
flashcards:
- front: ส่วนของเค้าโครงโครงงาน
  back: ชื่อ ผู้จัดทำ ที่ปรึกษา ที่มาและความสำคัญ วัตถุประสงค์ ขอบเขต วิธีดำเนินงาน แผนปฏิบัติงาน งบประมาณ ผลที่คาดว่าจะได้รับ เอกสารอ้างอิง
- front: ระยะเวลาของโครงงานเท่ากับอะไร
  back: ความยาวของเส้นทางวิกฤต ไม่ใช่ผลรวมเวลาของทุกงาน
- front: งานที่มีเวลาเผื่อ 1 สัปดาห์ช้า 2 สัปดาห์
  back: โครงงานเสร็จช้าลง 1 สัปดาห์
- front: บันทึกการปฏิบัติงานต้องมีอะไร
  back: วันที่ ผู้บันทึก งานที่ทำ ผลพร้อมหน่วย ปัญหา สิ่งที่จะทำต่อ
- front: คะแนนจากเกณฑ์ถ่วงน้ำหนัก
  back: ผลรวมของ น้ำหนัก × ระดับที่ได้ ÷ ระดับเต็ม
