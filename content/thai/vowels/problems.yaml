problems:
- id: thai.writing.vowels.p001
  topics:
  - thai.writing.vowels
  difficulty: 1
  type: mcq
  stem: คำว่า **ปลา** ใช้สระอะไร
  choices:
  - id: a
    text: สระอา
    correct: true
    feedback: ถูก ป + ล + า อ่านว่า ปลา
  - id: b
    text: สระอะ
    feedback: สระอะเป็นเสียงสั้น เขียนด้วย ะ แต่ ปลา ลากเสียงยาวและเขียนด้วย า
  - id: c
    text: สระออ
    feedback: ถ้าเป็นสระออจะเขียนว่า ปลอ ในคำนี้มี า
  - id: d
    text: ไม่มีสระ
    feedback: ทุกพยางค์ต้องมีสระ ตัว า หลัง ล คือสระอา
  hints:
  - หารูปสระที่อยู่หลังพยัญชนะ
  - รูป า เรียกว่าลากข้าง เป็นสระอะไร
  solution: ปลา = ป + ล (ควบกล้ำ) + **สระอา** (รูป า ลากข้าง)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.vowels.p002
  topics:
  - thai.writing.vowels
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็น **สระเสียงสั้น**
  choices:
  - id: a
    text: อุ
    correct: true
    feedback: ถูก อุ เป็นเสียงสั้น คู่กับ อู ที่เป็นเสียงยาว
  - id: b
    text: อู
    feedback: อู เป็นเสียงยาว คู่กับ อุ
  - id: c
    text: อา
    feedback: อา เป็นเสียงยาว คู่กับ อะ
  - id: d
    text: อี
    feedback: อี เป็นเสียงยาว คู่กับ อิ
  hints:
  - ลองอ่านแต่ละตัวช้า ๆ ตัวไหนหยุดเร็ว
  - สระคู่ อุ–อู ตัวไหนสั้น
  solution: '**อุ** เป็นสระเสียงสั้น ส่วน อู อา อี เป็นสระเสียงยาว'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.vowels.p003
  topics:
  - thai.writing.vowels
  difficulty: 1
  type: match
  stem: จับคู่สระเสียงสั้นกับสระเสียงยาวที่เป็นคู่กัน
  pairs:
  - left: อิ
    right: อี
  - left: อุ
    right: อู
  - left: เอะ
    right: เอ
  - left: โอะ
    right: โอ
  hints:
  - สระคู่มีรูปคล้ายกัน แต่เสียงยาวลากได้นาน
  - อิ กับ อี ต่างกันที่ฝนทอง
  solution: อิ–อี · อุ–อู · เอะ–เอ · โอะ–โอ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.vowels.p004
  topics:
  - thai.writing.vowels
  difficulty: 1
  type: text
  stem: 'เขียนคำ: **ม + สระอือ** (มีไว้หยิบจับของ)'
  accepted:
  - มือ
  misconceptions:
  - match: มื
    feedback: สระอือที่ไม่มีตัวสะกดต้องมีตัว อ ต่อท้ายเสมอ
  - match: มึ
    feedback: ึ คือสระอึ (เสียงสั้น) สระอือใช้ฟันหนูและตัว อ
  hints:
  - สระอือมีส่วนประกอบ 3 อย่าง
  - พินทุ์อิ + ฟันหนู อยู่บน ม แล้วมีตัว อ ตามหลัง
  solution: ม + สระอือ = **มือ** (เขียน ม ◌ื แล้วตามด้วย อ)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.vowels.p005
  topics:
  - thai.writing.vowels
  difficulty: 1
  type: mcq
  stem: ดูป้ายร้าน คำใดในป้ายใช้ **ใ ไม้ม้วน**
  figure:
    src: shop-sign.svg
    alt: 'ป้ายร้านอาหารพื้นสีครีม หัวป้ายเขียนว่า ร้านป้าใจ รายการอาหาร 4 บรรทัด: ก๋วยเตี๋ยวเรือ / ข้าวมันไก่ / ส้มตำ ไข่เจียว / น้ำเปล่า โอเลี้ยง'
  choices:
  - id: a
    text: ใจ
    correct: true
    feedback: ถูก ใจ เป็นหนึ่งใน 20 คำที่ใช้ไม้ม้วน
  - id: b
    text: ไก่
    feedback: ไก่ ใช้ ไ ไม้มลาย
  - id: c
    text: ไข่
    feedback: ไข่ ใช้ ไ ไม้มลาย
  - id: d
    text: โอเลี้ยง
    feedback: โอ ใช้ โ ไม้โอ ไม่ใช่ไม้ม้วน
  hints:
  - ไม้ม้วนมีหางม้วนเข้า ไม้มลายมีหางตั้งขึ้น
  - หาในหัวป้ายชื่อร้าน
  solution: ร้านป้า**ใจ** ใช้ใ ไม้ม้วน ส่วน ไก่ ไข่ ใช้ ไ ไม้มลาย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.vowels.p006
  topics:
  - thai.writing.vowels
  difficulty: 2
  type: numeric
  stem: รูปสระในภาษาไทยมีทั้งหมดกี่รูป
  answer:
    value: 21
    tolerance: 0
    unit: รูป
  misconceptions:
  - match: 32
    feedback: 32 คือจำนวนสระตามแบบเรียน (ตัวสระ) แต่รูปสระคือเครื่องหมายที่ใช้เขียน มีน้อยกว่า
  - match: 18
    feedback: 18 คือจำนวนสระเดี่ยว (เสียง) ไม่ใช่จำนวนรูป
  hints:
  - รูปสระคือเครื่องหมาย เช่น ะ า ิ เ
  - สระหลายตัวใช้รูปร่วมกัน รูปจึงน้อยกว่าตัวสระ
  solution: รูปสระมี **21 รูป** เช่น วิสรรชนีย์ ไม้หันอากาศ ลากข้าง พินทุ์อิ ... ตัว ฦๅ ส่วนสระตามแบบเรียนมี 32 ตัว
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.vowels.p007
  topics:
  - thai.writing.vowels
  difficulty: 2
  type: mcq
  stem: สระ **เอีย** ในคำว่า เสีย อยู่ตำแหน่งใดของพยัญชนะ ส
  choices:
  - id: a
    text: ข้างหน้า ข้างบน และข้างหลัง
    correct: true
    feedback: ถูก เ อยู่หน้า ◌ี อยู่บน ย อยู่หลัง
  - id: b
    text: ข้างหน้าอย่างเดียว
    feedback: เ อยู่ข้างหน้าก็จริง แต่ยังมี ◌ี ข้างบน และ ย ข้างหลัง
  - id: c
    text: ข้างบนอย่างเดียว
    feedback: ยังมี เ ข้างหน้า และ ย ข้างหลังด้วย
  - id: d
    text: ข้างล่าง
    feedback: สระข้างล่างมีแค่ ◌ุ ◌ู
  hints:
  - แยกรูปทุกชิ้นที่ไม่ใช่ ส
  - เ ◌ี ย แต่ละชิ้นอยู่ที่ใด
  solution: เสีย = เ (หน้า) + ส + ◌ี (บน) + ย (หลัง) สระเอียจึงอยู่ **หลายตำแหน่ง**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.vowels.p008
  topics:
  - thai.writing.vowels
  difficulty: 2
  type: order
  stem: เรียงการแจกลูก ก กับสระ ตามลำดับสระในแบบเรียน (บนสุดคือตัวแรก)
  items:
  - กะ
  - กา
  - กิ
  - กี
  - กึ
  - กือ
  - กุ
  - กู
  hints:
  - ลำดับสระเริ่มที่ อะ อา
  - 'สระเรียงเป็นคู่ สั้นแล้วยาว: อะ อา, อิ อี, อึ อือ, อุ อู'
  solution: ลำดับคือ กะ กา กิ กี กึ กือ กุ กู (อะ อา อิ อี อึ อือ อุ อู)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.vowels.p009
  topics:
  - thai.writing.vowels
  difficulty: 2
  type: mcq
  stem: คำว่า **ส้มตำ** พยางค์หลัง (ตำ) ใช้สระอะไร
  choices:
  - id: a
    text: สระอำ
    correct: true
    feedback: ถูก ต + อำ = ตำ
  - id: b
    text: สระอา
    feedback: มีลากข้างก็จริง แต่มีหยาดน้ำค้างอยู่ข้างบนด้วย รวมเป็นสระอำ
  - id: c
    text: สระอะ
    feedback: ตำ ไม่มีวิสรรชนีย์ ะ
  - id: d
    text: สระอัว
    feedback: สระอัวใช้ไม้หันอากาศกับ ว
  hints:
  - ดูรูปที่อยู่หลัง ต
  - วงกลมเล็กข้างบนกับลากข้าง รวมกันเป็นสระอะไร
  solution: ตำ = ต + **สระอำ** (หยาดน้ำค้าง + ลากข้าง) สระอำเป็นสระเกิน มีเสียง อะ + ม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.vowels.p010
  topics:
  - thai.writing.vowels
  difficulty: 3
  type: mcq
  stem: คำใดมี **สระลดรูป**
  choices:
  - id: a
    text: คน
    correct: true
    feedback: ถูก ค + โอะ + น ไม่เห็นรูปสระโอะเลย
  - id: b
    text: กัน
    feedback: กัน มีสระอะ **เปลี่ยนรูป** เป็นไม้หันอากาศ ยังมีรูปอยู่
  - id: c
    text: เด็ก
    feedback: เด็ก มีสระเอะ **เปลี่ยนรูป** เป็นไม้ไต่คู้
  - id: d
    text: ตา
    feedback: ตา ใช้สระอาเต็มรูป
  hints:
  - ลดรูป คือรูปสระหายไปบางส่วนหรือทั้งหมด
  - คำไหนไม่เห็นรูปสระเลย แต่ยังอ่านมีเสียงสระ
  solution: '**คน** = ค + โอะ + น สระโอะหายไปทั้งตัว จึงเป็นสระลดรูป ส่วน กัน และ เด็ก เป็นสระเปลี่ยนรูป'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.vowels.p011
  topics:
  - thai.writing.vowels
  difficulty: 3
  type: text
  stem: คำว่า **ขวด** ใช้สระอะไร (ตอบชื่อสระ เช่น สระอา)
  accepted:
  - สระอัว
  - อัว
  - สระ อัว
  misconceptions:
  - match: สระโอะ
    feedback: ขวด ไม่ใช่แบบ นก คน ที่สระโอะหายไป เพราะ ว ไม่ได้อ่านเป็นเสียง วอ ลองอ่านช้า ๆ ข + อัว + ด
  - match: โอะ
    feedback: ขวด ไม่ใช่แบบ นก คน ที่สระโอะหายไป เพราะ ว ไม่ได้อ่านเป็นเสียง วอ ลองอ่านช้า ๆ ข + อัว + ด
  - match: สระอะ
    feedback: ไม่มีเสียง อะ ใน ขวด ลองอ่านช้า ๆ
  hints:
  - ข คือพยัญชนะต้น ด คือตัวสะกด
  - ว ตรงกลางไม่ได้อ่านว่า วอ ลองนึกถึงคำว่า ตัว
  solution: ขวด = ข + **สระอัว** + ด สระอัวลดรูป (ไม่มีไม้หันอากาศ) เหลือแค่ ว
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.vowels.p012
  topics:
  - thai.writing.vowels
  difficulty: 3
  type: match
  stem: จับคู่คำกับสระที่ **เปลี่ยนรูปหรือลดรูป** อยู่ในคำนั้น
  pairs:
  - left: วัน
    right: สระอะ
  - left: เดิน
    right: สระเออ
  - left: แข็ง
    right: สระแอะ
  - left: นก
    right: สระโอะ
  - left: พร
    right: สระออ
  hints:
  - เขียนสระที่ได้ยินลงไปเต็มรูป แล้วเทียบกับคำจริง
  - วัน = ว + อะ + น · พร อ่านว่า พอน
  solution: วัน (อะ → ไม้หันอากาศ) · เดิน (เออ → พินทุ์อิ) · แข็ง (แอะ → ไม้ไต่คู้) · นก (โอะ หายทั้งตัว) · พร (ออ หาย อ่านว่า พอน)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.vowels.p013
  topics:
  - thai.writing.vowels
  difficulty: 3
  type: mcq
  stem: ข้อใดเป็นสระเสียงยาว **ทุกพยางค์**
  choices:
  - id: a
    text: ตาดูเอง
    correct: true
    feedback: ถูก ตา (อา) ดู (อู) เอง (เอ) เป็นเสียงยาวทั้งหมด
  - id: b
    text: ทะเลสาบ
    feedback: ทะ เป็นสระอะ เสียงสั้น
  - id: c
    text: นักเรียน
    feedback: นัก มีสระอะเปลี่ยนรูป เป็นเสียงสั้น
  - id: d
    text: จิตใจ
    feedback: จิต (อิ) เป็นเสียงสั้น และ ใจ (ใอ) ก็เป็นเสียงสั้น
  hints:
  - อ่านทีละพยางค์ แล้วถามว่าลากเสียงได้นานไหม
  - สระที่มีตัวสะกดก็ยังสั้นหรือยาวตามสระเดิม เช่น นัก มาจาก อะ
  solution: ตา–ดู–เอง ใช้ อา อู เอ เป็นสระเสียงยาวทั้งหมด ส่วนตัวเลือกอื่นมี ทะ นัก จิต ใจ ที่เป็นเสียงสั้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.vowels.p014
  topics:
  - thai.writing.vowels
  difficulty: 4
  type: mcq
  stem: 'เติมคำให้ถูก: "แม่ซื้อเสื้อตัว ___ ให้น้อง" (แปลว่า ยังไม่เคยใช้)'
  choices:
  - id: a
    text: ใหม่
    correct: true
    feedback: ถูก ใหม่ อยู่ในกลอนไม้ม้วน 20 คำ
  - id: b
    text: ไหม่
    feedback: ใหม่ ต้องใช้ ใ ไม้ม้วน ไม่ใช่ ไ ไม้มลาย
  - id: c
    text: ไหม
    feedback: ไหม เป็นคำอื่น เช่น ผ้าไหม หรือคำถาม ไปไหม และไม่มีไม้เอก
  - id: d
    text: ใหม
    feedback: ขาดไม้เอก คำนี้ออกเสียงเอก ต้องเขียน ่ บน ม
  hints:
  - คำนี้มีอยู่ในกลอน ผู้ใหญ่หาผ้าใหม่
  - ตรวจทั้งรูปสระ ใ/ไ และรูปวรรณยุกต์
  solution: ผ้า**ใหม่** ใช้ ใ ไม้ม้วน และมีไม้เอก ส่วน ไหม (ผ้าไหม คำถาม) เป็นคนละคำ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.vowels.p015
  topics:
  - thai.writing.vowels
  difficulty: 4
  type: numeric
  stem: คำว่า **เรือ** ใช้ **รูปสระ** กี่รูป (นับรูปที่ประกอบกันเป็นสระเอือ)
  answer:
    value: 4
    tolerance: 0
    unit: รูป
  misconceptions:
  - match: 2
    feedback: นับแค่ เ กับ ◌ื แต่ ◌ื ยังแยกได้เป็นพินทุ์อิกับฟันหนู และยังมีตัว อ
  - match: 3
    feedback: ยังขาดหนึ่งรูป ◌ื ประกอบด้วยพินทุ์อิ + ฟันหนู
  - match: 1
    feedback: สระเอือเป็นสระตัวเดียว แต่เขียนด้วยหลายรูป
  hints:
  - แยกทุกเครื่องหมายที่ไม่ใช่ ร
  - ◌ื เกิดจากพินทุ์อิกับฟันหนู
  solution: เรือ = ไม้หน้า (เ) + พินทุ์อิ + ฟันหนู + ตัว อ รวม **4 รูป** ประกอบเป็นสระเอือ 1 ตัว
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.vowels.p016
  topics:
  - thai.writing.vowels
  difficulty: 4
  type: mcq
  stem: คำว่า **เลย** ใช้สระอะไร
  choices:
  - id: a
    text: สระเออ (ลดรูป)
    correct: true
    feedback: ถูก ล + เออ + ย ตัว อ ของสระเออหายไปเมื่อมี ย สะกด
  - id: b
    text: สระเอ
