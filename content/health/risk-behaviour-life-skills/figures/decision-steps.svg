<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="sans-serif">
<title>ห้าขั้นตัดสินใจแก้ปัญหา</title>
<rect x="0" y="0" width="760" height="250" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="380.0" y="28.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">ห้าขั้นตัดสินใจและแก้ปัญหา</text>
<rect x="15.0" y="60.0" width="130.0" height="130.0" rx="10" fill="#d6eaf8" stroke="#333" stroke-width="1.5"/>
<text x="80.0" y="92.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#111">1 ระบุปัญหา</text>
<text x="80.0" y="126.0" font-size="12" text-anchor="middle" fill="#111">อะไรคือปัญหา</text>
<text x="80.0" y="146.0" font-size="12" text-anchor="middle" fill="#111">ใครเกี่ยวข้อง</text>
<line x1="147.0" y1="125.0" x2="161.0" y2="125.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="163.0" y="60.0" width="130.0" height="130.0" rx="10" fill="#d5f5e3" stroke="#333" stroke-width="1.5"/>
<text x="228.0" y="92.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#111">2 หาทางเลือก</text>
<text x="228.0" y="126.0" font-size="12" text-anchor="middle" fill="#111">คิดไว้หลายทาง</text>
<text x="228.0" y="146.0" font-size="12" text-anchor="middle" fill="#111">อย่างน้อย 3 ทาง</text>
<line x1="295.0" y1="125.0" x2="309.0" y2="125.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="311.0" y="60.0" width="130.0" height="130.0" rx="10" fill="#fcf3cf" stroke="#333" stroke-width="1.5"/>
<text x="376.0" y="92.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#111">3 ชั่งผลดีผลเสีย</text>
<text x="376.0" y="126.0" font-size="12" text-anchor="middle" fill="#111">ต่อตัวเอง คนอื่น</text>
<text x="376.0" y="146.0" font-size="12" text-anchor="middle" fill="#111">และกฎหมาย</text>
<line x1="443.0" y1="125.0" x2="457.0" y2="125.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="459.0" y="60.0" width="130.0" height="130.0" rx="10" fill="#fadbd8" stroke="#333" stroke-width="1.5"/>
<text x="524.0" y="92.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#111">4 เลือกและลงมือ</text>
<text x="524.0" y="126.0" font-size="12" text-anchor="middle" fill="#111">เลือกทางที่</text>
<text x="524.0" y="146.0" font-size="12" text-anchor="middle" fill="#111">ปลอดภัยที่สุด</text>
<line x1="591.0" y1="125.0" x2="605.0" y2="125.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="607.0" y="60.0" width="130.0" height="130.0" rx="10" fill="#e8daef" stroke="#333" stroke-width="1.5"/>
<text x="672.0" y="92.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#111">5 ประเมินผล</text>
<text x="672.0" y="126.0" font-size="12" text-anchor="middle" fill="#111">ได้ผลไหม</text>
<text x="672.0" y="146.0" font-size="12" text-anchor="middle" fill="#111">ครั้งหน้าทำอย่างไร</text>
<text x="380.0" y="225.0" font-size="13" text-anchor="middle" fill="#333">ถ้าไม่แน่ใจหรือเสี่ยงสูง ขอความช่วยเหลือจากผู้ใหญ่ที่ไว้ใจได้ทุกขั้น</text>
</svg>
