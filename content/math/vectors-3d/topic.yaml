id: math.calculus.vectors-3d
subject: math
title: { th: เวกเตอร์ในสามมิติ, en: Vectors in three dimensions }
summary: เวกเตอร์ในปริภูมิสามมิติ ขนาดและการดำเนินการ ผลคูณเชิงสเกลาร์กับมุมและงาน ผลคูณเชิงเวกเตอร์กับพื้นที่และทอร์ก และสมการเส้นตรงกับระนาบ
difficulty: 7
minutes: 40
prerequisites: [math.geometry.vectors, math.geometry.pythagoras]
encompasses:
  - { id: math.geometry.vectors, weight: 0.4 }
  - { id: math.geometry.pythagoras, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: cross-product.svg
    alt: "แกน x y z เวกเตอร์ u = ⟨2, 0, 0⟩ สีแดงตามแกน x และ v = ⟨1, 2, 0⟩ สีน้ำเงินบนระนาบ xy สร้างสี่เหลี่ยมด้านขนานที่แรเงา มีป้ายว่าพื้นที่ = |u × v| = 4 เวกเตอร์ u × v = ⟨0, 0, 4⟩ สีเขียวชี้ขึ้นตามแกน z มีเครื่องหมายมุมฉากกับ u และ v ข้อความด้านขวาบอกกฎมือขวา: นิ้วทั้งสี่วนจาก u ไป v นิ้วโป้งชี้ทิศ u × v"
    caption: "u × v ตั้งฉากกับทั้ง u และ v และยาวเท่ากับพื้นที่สี่เหลี่ยมด้านขนาน"
  - type: worked-example
    title: มุมระหว่างเวกเตอร์สองตัว
    problem: "จงหามุมระหว่าง $\\mathbf{u} = \\langle 1, 2, 2 \\rangle$ และ $\\mathbf{v} = \\langle 2, -1, 2 \\rangle$"
    steps:
      - text: "ผลคูณจุด: $\\mathbf{u} \\cdot \\mathbf{v} = 1(2) + 2(-1) + 2(2) = 4$"
      - text: "ขนาด: $|\\mathbf{u}| = \\sqrt{1 + 4 + 4} = 3$ และ $|\\mathbf{v}| = \\sqrt{4 + 1 + 4} = 3$"
      - text: "$\\cos\\theta = \\dfrac{\\mathbf{u} \\cdot \\mathbf{v}}{|\\mathbf{u}||\\mathbf{v}|} = \\dfrac{4}{9}$"
        why: "มาจาก $\\mathbf{u} \\cdot \\mathbf{v} = |\\mathbf{u}||\\mathbf{v}|\\cos\\theta$"
      - text: "$\\theta = \\cos^{-1}\\tfrac49 \\approx 63.6^\\circ$ เป็นมุมแหลมเพราะผลคูณจุดเป็นบวก"
    answer: "ประมาณ $63.6^\\circ$"
  - { type: check, problem: math.calculus.vectors-3d.p006, prompt: "หาผลคูณจุดและขนาดก่อน แล้วใช้ cos" }
  - type: figure
    src: plane-normal.svg
    alt: "ระนาบรูปสี่เหลี่ยมด้านขนาน มีจุด P₀(x₀, y₀, z₀) และจุด P(x, y, z) บนระนาบ ลูกศรสีแดงจาก P₀ ไป P อยู่ในระนาบ ลูกศรสีเขียว n = ⟨a, b, c⟩ ชี้ขึ้นจาก P₀ ตั้งฉากกับระนาบ มีเครื่องหมายมุมฉากระหว่าง n กับ P₀P ด้านล่างเขียนว่า n · (P − P₀) = 0 จึงได้ a(x − x₀) + b(y − y₀) + c(z − z₀) = 0"
    caption: "ทุกเวกเตอร์ที่อยู่ในระนาบตั้งฉากกับเวกเตอร์แนวฉาก n"
  - type: worked-example
    title: ระนาบที่ผ่านสามจุด
    problem: "จงหาสมการระนาบที่ผ่าน $P(1, 0, 0)$, $Q(0, 2, 0)$ และ $R(0, 0, 3)$"
    steps:
      - text: "สร้างเวกเตอร์บนระนาบ: $\\overrightarrow{PQ} = \\langle -1, 2, 0 \\rangle$ และ $\\overrightarrow{PR} = \\langle -1, 0, 3 \\rangle$"
      - text: "เวกเตอร์แนวฉาก $\\mathbf{n} = \\overrightarrow{PQ} \\times \\overrightarrow{PR} = \\langle 2(3) - 0(0),\\ 0(-1) - (-1)(3),\\ (-1)(0) - 2(-1) \\rangle = \\langle 6, 3, 2 \\rangle$"
        why: "ผลคูณไขว้ตั้งฉากกับเวกเตอร์ทั้งสองที่อยู่ในระนาบ จึงตั้งฉากกับระนาบ"
      - text: "ใช้จุด $P$: $6(x - 1) + 3(y - 0) + 2(z - 0) = 0$ ได้ $6x + 3y + 2z = 6$"
      - text: "ตรวจ: $Q$ ให้ $3(2) = 6$ และ $R$ ให้ $2(3) = 6$ จริงทั้งสองจุด"
    answer: "$6x + 3y + 2z = 6$"
  - { type: check, problem: math.calculus.vectors-3d.p010, prompt: "พื้นที่สามเหลี่ยมคือครึ่งหนึ่งของขนาดผลคูณไขว้" }
glossary:
  - { term: ผลคูณเชิงสเกลาร์ (ผลคูณจุด), definition: "u · v = u₁v₁ + u₂v₂ + u₃v₃ = |u||v| cos θ ผลลัพธ์เป็นจำนวน" }
  - { term: ผลคูณเชิงเวกเตอร์ (ผลคูณไขว้), definition: "u × v เวกเตอร์ที่ตั้งฉากกับ u และ v ทิศตามกฎมือขวา ขนาด |u||v| sin θ" }
  - { term: เวกเตอร์แสดงทิศทาง, definition: "เวกเตอร์ที่ขนานกับเส้นตรง ใช้เขียนสมการเส้นตรง r = r₀ + tv" }
  - { term: เวกเตอร์แนวฉาก, definition: "เวกเตอร์ที่ตั้งฉากกับระนาบ ใช้เขียนสมการระนาบ ax + by + cz = d" }
  - { term: ทอร์ก, definition: "โมเมนต์ของแรง τ = r × F วัดความสามารถของแรงในการทำให้วัตถุหมุน หน่วยนิวตันเมตร" }
flashcards:
  - { front: "ขนาดของ ⟨a, b, c⟩", back: "√(a² + b² + c²)" }
  - { front: "u · v = 0 หมายความว่าอะไร", back: "u ตั้งฉากกับ v (เมื่อทั้งสองไม่ใช่เวกเตอร์ศูนย์)" }
  - { front: "|u × v| มีความหมายทางเรขาคณิตอย่างไร", back: "พื้นที่สี่เหลี่ยมด้านขนานที่มี u และ v เป็นด้าน (สามเหลี่ยมคือครึ่งหนึ่ง)" }
  - { front: "v × u เทียบกับ u × v", back: "v × u = −(u × v) ขนาดเท่ากันแต่ทิศตรงข้าม" }
  - { front: "สมการระนาบที่มีเวกเตอร์แนวฉาก ⟨a, b, c⟩ ผ่าน (x₀, y₀, z₀)", back: "a(x − x₀) + b(y − y₀) + c(z − z₀) = 0" }
