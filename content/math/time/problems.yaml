problems:
  - id: math.measure.time.p001
    topics: [math.measure.time]
    difficulty: 1
    type: order
    stem: "เรียงกิจกรรมในวันเรียนของน้องแป้งจากเช้าไปกลางคืน"
    items: ["ตื่นนอนแปรงฟัน", "เข้าแถวเคารพธงชาติ", "กินข้าวกลางวัน", "เลิกเรียนกลับบ้าน", "เข้านอน"]
    hints:
      - "อะไรทำตอนเช้าที่สุด อะไรทำตอนกลางคืน"
      - "กินข้าวกลางวันอยู่ตรงกลางวัน"
    solution: "เช้าตื่นนอนแปรงฟัน → เข้าแถวเคารพธงชาติ → กลางวันกินข้าว → เย็นเลิกเรียนกลับบ้าน → กลางคืนเข้านอน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.time.p002
    topics: [math.measure.time]
    difficulty: 1
    type: mcq
    stem: "นาฬิกาในภาพบอกเวลาใด"
    figure: { src: clock-3-00.svg, alt: "นาฬิกาเข็ม เข็มสั้นชี้เลข 3 เข็มยาวชี้เลข 12" }
    choices:
      - { id: a, text: "3 นาฬิกาตรง", correct: true }
      - { id: b, text: "12 นาฬิกา 15 นาที", feedback: "อ่านสลับเข็ม เข็มสั้นบอกชั่วโมง เข็มยาวบอกนาที" }
      - { id: c, text: "3 นาฬิกา 12 นาที", feedback: "เข็มยาวชี้ 12 แปลว่าตรงชั่วโมง ไม่ใช่ 12 นาที" }
    hints:
      - "เข็มสั้นชี้เลขอะไร"
      - "เข็มยาวชี้ 12 แปลว่าตรง"
    solution: "เข็มสั้นชี้ 3 เข็มยาวชี้ 12 จึงเป็น 3 นาฬิกาตรง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.time.p003
    topics: [math.measure.time]
    difficulty: 1
    type: numeric
    stem: "1 ชั่วโมง มีกี่นาที"
    answer: { value: 60, unit: นาที }
    hints:
      - "เข็มยาวเดินรอบหน้าปัดหนึ่งรอบใช้เวลา 1 ชั่วโมง"
      - "หน้าปัดมีขีดเล็กกี่ขีด"
    misconceptions:
      - { match: 100, feedback: "เวลาไม่ได้นับทีละร้อยเหมือนเงินหรือความยาว 1 ชั่วโมงมี 60 นาที" }
      - { match: 12, feedback: "12 คือจำนวนตัวเลขบนหน้าปัด แต่ละตัวห่างกัน 5 นาที" }
    solution: "1 ชั่วโมง = 60 นาที เท่ากับขีดเล็ก 60 ขีดรอบหน้าปัด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.time.p004
    topics: [math.measure.time]
    difficulty: 2
    type: mcq
    stem: "นาฬิกาในภาพบอกเวลาตอนเช้าเวลาใด"
    figure: { src: clock-7-30.svg, alt: "นาฬิกาเข็ม เข็มสั้นอยู่กลางระหว่างเลข 7 กับเลข 8 เข็มยาวชี้เลข 6" }
    choices:
      - { id: a, text: "7.30 น.", correct: true }
      - { id: b, text: "8.30 น.", feedback: "เข็มสั้นยังไม่ถึง 8 ให้อ่านตัวเลขที่น้อยกว่า" }
      - { id: c, text: "7.06 น.", feedback: "เข็มยาวชี้ 6 คือ $6 \\times 5 = 30$ นาที ไม่ใช่ 6 นาที" }
    hints:
      - "เข็มสั้นอยู่ระหว่าง 7 กับ 8 อ่านตัวเลขใด"
      - "เข็มยาวชี้ 6 คือครึ่งชั่วโมง"
    solution: "เข็มสั้นเลย 7 มาครึ่งทาง เข็มยาวชี้ 6 คือ 30 นาที เวลา 7.30 น."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.time.p005
    topics: [math.measure.time]
    difficulty: 2
    type: mcq
    stem: "วันนี้วันพุธ อีก 10 วันจะเป็นวันอะไร"
    choices:
      - { id: a, text: "วันเสาร์", correct: true }
      - { id: b, text: "วันพุธ", feedback: "สัปดาห์หนึ่งมี 7 วัน อีก 7 วันจึงเป็นวันพุธ แต่โจทย์ถามอีก 10 วัน" }
      - { id: c, text: "วันศุกร์", feedback: "นับวันนี้เป็นวันที่ 1 ด้วย ต้องเริ่มนับจากพรุ่งนี้" }
      - { id: d, text: "วันอาทิตย์", feedback: "นับเกินไป 1 วัน อีก 7 วันเป็นวันพุธ แล้วนับต่ออีก 3 วัน" }
    hints:
      - "อีก 7 วันจะเป็นวันเดียวกับวันนี้"
      - "10 = 7 + 3 นับต่อจากวันพุธอีก 3 วัน"
    solution: "อีก 7 วันเป็นวันพุธ อีก 3 วันต่อจากนั้นคือ พฤหัสบดี ศุกร์ เสาร์ จึงเป็นวันเสาร์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.time.p006
    topics: [math.measure.time]
    difficulty: 2
    type: match
    stem: "จับคู่เวลาแบบ 24 ชั่วโมงกับคำที่ใช้พูด"
    pairs:
      - { left: "07.00 น.", right: "เจ็ดโมงเช้า" }
      - { left: "12.00 น.", right: "เที่ยงวัน" }
      - { left: "13.00 น.", right: "บ่ายโมง" }
      - { left: "19.00 น.", right: "หนึ่งทุ่ม" }
      - { left: "02.00 น.", right: "ตีสอง" }
    hints:
      - "หลังเที่ยงคือบ่าย ทุ่มใช้ตอนค่ำหลังหกโมงเย็น ตีใช้หลังเที่ยงคืน"
      - "13.00 คือหนึ่งชั่วโมงหลังเที่ยง 19.00 คือหนึ่งชั่วโมงหลังหกโมงเย็น"
    solution: "07.00 เจ็ดโมงเช้า 12.00 เที่ยงวัน 13.00 บ่ายโมง 19.00 หนึ่งทุ่ม 02.00 ตีสอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.time.p007
    topics: [math.measure.time]
    difficulty: 2
    type: text
    stem: "นาฬิกาในภาพเป็นเวลาตอนบ่าย เขียนบอกเวลาแบบ 24 ชั่วโมงโดยใช้จุด (เช่น 13.10)"
    figure: { src: clock-4-25.svg, alt: "นาฬิกาเข็ม เข็มสั้นอยู่ระหว่างเลข 4 กับเลข 5 ค่อนมาทางเลข 4 เข็มยาวชี้เลข 5" }
    accepted: ["16.25", "16.25 น.", "16:25", "16.25น."]
    misconceptions:
      - { match: "4.25", feedback: "เวลาถูกแล้วบนหน้าปัด แต่ตอนบ่ายต้องบวก 12 กับชั่วโมง" }
      - { match: "16.05", feedback: "เข็มยาวชี้ 5 คือ $5 \\times 5 = 25$ นาที ไม่ใช่ 5 นาที" }
      - { match: "17.25", feedback: "เข็มสั้นยังไม่ถึง 5 ให้อ่านตัวเลขที่น้อยกว่าคือ 4" }
    hints:
      - "เข็มสั้นอยู่ระหว่าง 4 กับ 5 เข็มยาวชี้ 5 คือกี่นาที"
      - "ได้ 4 นาฬิกา 25 นาที ตอนบ่ายต้องบวก 12 กับชั่วโมง"
    solution: "หน้าปัดอ่านได้ 4 นาฬิกา 25 นาที ตอนบ่ายจึงเป็น $4 + 12 = 16$ เขียน 16.25 น."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.time.p008
    topics: [math.measure.time]
    difficulty: 3
    type: numeric
    stem: "3 นาที เท่ากับกี่วินาที"
    answer: { value: 180, unit: วินาที }
    hints:
      - "1 นาที = 60 วินาที"
      - "$3 \\times 60$"
    misconceptions:
      - { match: 300, feedback: "ใช้ 1 นาที = 100 วินาที ที่ถูกคือ 60 วินาที" }
      - { match: 63, feedback: "บวก 3 กับ 60 ต้องคูณ เพราะมี 60 วินาทีอยู่ 3 ชุด" }
    solution: "$3 \\times 60 = 180$ วินาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.time.p009
    topics: [math.measure.time]
    difficulty: 3
    type: numeric
    stem: "ละครทีวีเริ่ม 18.45 น. จบ 20.10 น. ละครยาวกี่นาที (ตอบในหน่วยนาที)"
    answer: { value: 85, unit: นาที }
    hints:
      - "นับจาก 18.45 ไปถึง 19.00 ก่อน"
      - "แล้วนับจาก 19.00 ถึง 20.00 และจาก 20.00 ถึง 20.10"
    misconceptions:
      - { match: 125, feedback: "ลบแบบทศนิยมได้ 1.65 แล้วอ่านเป็น 1 ชั่วโมง 65 นาที แต่ 1 ชั่วโมงมีแค่ 60 นาที" }
      - { match: 165, feedback: "ลบ 2010 − 1845 เหมือนจำนวนธรรมดา แต่ 1 ชั่วโมงมี 60 นาที ไม่ใช่ 100" }
    solution: "18.45 → 19.00 ได้ 15 นาที, 19.00 → 20.00 ได้ 60 นาที, 20.00 → 20.10 ได้ 10 นาที รวม $15 + 60 + 10 = 85$ นาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.time.p010
    topics: [math.measure.time]
    difficulty: 3
    type: numeric
    stem: "ดูปฏิทิน วันนี้วันที่ 5 ตุลาคม โรงเรียนจะแข่งกีฬาสีวันที่ 23 ตุลาคม อีกกี่วันจะถึงวันแข่งกีฬาสี (ตอบเป็นจำนวนวัน)"
    figure: { src: calendar-oct-2569.svg, alt: "ปฏิทินเดือนตุลาคม 2569 หัวคอลัมน์ อา. จ. อ. พ. พฤ. ศ. ส. วันที่ 1 ตรงกับวันพฤหัสบดี วันที่ 2 วันศุกร์ วันที่ 3 วันเสาร์ แถวต่อไปเริ่มวันอาทิตย์ที่ 4 ถึงวันเสาร์ที่ 10 แล้ว 11 ถึง 17, 18 ถึง 24 และ 25 ถึง 31" }
    answer: { value: 18, unit: วัน }
    hints:
      - "เดือนเดียวกัน หาได้ด้วยการลบวันที่"
      - "$23 - 5$"
    misconceptions:
      - { match: 19, feedback: "นับวันนี้รวมไปด้วย คำว่าอีกกี่วันเริ่มนับจากพรุ่งนี้" }
      - { match: 28, feedback: "บวกวันที่ ต้องลบ" }
    solution: "$23 - 5 = 18$ วัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.time.p011
    topics: [math.measure.time]
    difficulty: 2
    type: mcq
    stem: "ดูปฏิทินเดือนตุลาคม 2569 วันที่ 23 ตุลาคม ตรงกับวันอะไร"
    figure: { src: calendar-oct-2569.svg, alt: "ปฏิทินเดือนตุลาคม 2569 หัวคอลัมน์ อา. จ. อ. พ. พฤ. ศ. ส. วันที่ 1 ตรงกับวันพฤหัสบดี แถวที่สองเริ่มวันอาทิตย์ที่ 4 แถวที่สามเริ่มวันอาทิตย์ที่ 11 แถวที่สี่เริ่มวันอาทิตย์ที่ 18 แถวที่ห้าเริ่มวันอาทิตย์ที่ 25" }
    choices:
      - { id: a, text: "วันศุกร์", correct: true }
      - { id: b, text: "วันพฤหัสบดี", feedback: "อ่านคอลัมน์ผิดไปหนึ่งช่อง วันที่ 22 เป็นวันพฤหัสบดี" }
      - { id: c, text: "วันเสาร์", feedback: "วันเสาร์ในสัปดาห์นั้นคือวันที่ 24" }
    hints:
      - "หาเลข 23 ในตาราง"
      - "ไล่ขึ้นไปดูหัวคอลัมน์"
    solution: "แถวที่สี่เริ่มวันอาทิตย์ที่ 18 นับ 18 อา., 19 จ., 20 อ., 21 พ., 22 พฤ., 23 ศ. วันที่ 23 จึงเป็นวันศุกร์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.time.p012
    topics: [math.measure.time]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "เดือนใดมี 30 วัน (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "เมษายน", correct: true }
      - { id: b, text: "กันยายน", correct: true }
      - { id: c, text: "พฤศจิกายน", correct: true }
      - { id: d, text: "กรกฎาคม", feedback: "ลงท้ายด้วย \"คม\" มี 31 วัน" }
      - { id: e, text: "กุมภาพันธ์", feedback: "กุมภาพันธ์มี 28 วัน หรือ 29 วันในปีอธิกสุรทิน" }
    hints:
      - "ดูคำลงท้ายของชื่อเดือน"
      - "ลงท้าย \"ยน\" มี 30 วัน"
    solution: "เมษายน กันยายน พฤศจิกายน ลงท้ายด้วย \"ยน\" มี 30 วัน (อีกเดือนคือมิถุนายน) กรกฎาคมมี 31 วัน กุมภาพันธ์มี 28 หรือ 29 วัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.time.p013
    topics: [math.measure.time]
    difficulty: 3
    type: numeric
    stem: "2 วัน 5 ชั่วโมง เท่ากับกี่ชั่วโมง"
    answer: { value: 53, unit: ชั่วโมง }
    hints:
      - "1 วัน = 24 ชั่วโมง"
      - "2 วัน = 48 ชั่วโมง แล้วบวก 5"
    misconceptions:
      - { match: 29, feedback: "ใช้ 1 วัน = 12 ชั่วโมง แต่ 1 วันมี 24 ชั่วโมง (กลางวันและกลางคืนรวมกัน)" }
      - { match: 7, feedback: "บวก 2 กับ 5 โดยไม่เปลี่ยนวันเป็นชั่วโมงก่อน" }
    solution: "$2 \\times 24 + 5 = 48 + 5 = 53$ ชั่วโมง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.time.p014
    topics: [math.measure.time]
    difficulty: 4
    type: numeric
    stem: "ดูตารางเวลารถไฟ (สมมติ) รถไฟขบวนนี้ใช้เวลาเดินทางจากสถานีอยุธยาถึงสถานีนครสวรรค์กี่นาที (ตอบในหน่วยนาที)"
    figure: { src: train-timetable.svg, alt: "ตารางเวลารถไฟเที่ยวขึ้น (สมมติ) สองคอลัมน์ สถานีและเวลาออก กรุงเทพอภิวัฒน์ 08.30 น. อยุธยา 09.50 น. ลพบุรี 11.05 น. นครสวรรค์ 12.40 น." }
    answer: { value: 170, unit: นาที }
    hints:
      - "อยุธยา 09.50 น. นครสวรรค์ 12.40 น. นับต่อจาก 09.50 ไปถึง 10.00"
      - "10 นาที + จาก 10.00 ถึง 12.00 + จาก 12.00 ถึง 12.40"
    misconceptions:
      - { match: 290, feedback: "ลบ 1240 − 950 เหมือนจำนวนธรรมดา แต่ 1 ชั่วโมงมี 60 นาที" }
      - { match: 250, feedback: "นี่คือเวลาจากกรุงเทพอภิวัฒน์ถึงนครสวรรค์ โจทย์ถามจากอยุธยา" }
    solution: "09.50 → 10.00 ได้ 10 นาที, 10.00 → 12.00 ได้ 120 นาที, 12.00 → 12.40 ได้ 40 นาที รวม 170 นาที (2 ชั่วโมง 50 นาที)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.time.p015
    topics: [math.measure.time]
    difficulty: 4
    type: text
    stem: "ยายเริ่มนึ่งขนมเวลา 10.40 น. นึ่งนาน 1 ชั่วโมง 35 นาที ขนมจะสุกเวลาใด (ตอบแบบ 24 ชั่วโมงใช้จุด เช่น 09.05)"
    accepted: ["12.15", "12.15 น.", "12:15", "12.15น."]
    misconceptions:
      - { match: "11.75", feedback: "40 + 35 = 75 นาที ซึ่งเกิน 60 ต้องทดเป็น 1 ชั่วโมง 15 นาที" }
      - { match: "12.75", feedback: "นาทีเกิน 60 ไม่ได้ 75 นาทีคือ 1 ชั่วโมง 15 นาที" }
    hints:
      - "บวก 1 ชั่วโมงก่อน แล้วบวก 35 นาที"
      - "ถ้านาทีรวมถึง 60 ให้ทดเป็น 1 ชั่วโมง"
    solution: "10.40 + 1 ชั่วโมง = 11.40 น. แล้วบวก 35 นาที: $40 + 35 = 75$ นาที = 1 ชั่วโมง 15 นาที ได้ 12.15 น."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.time.p016
    topics: [math.measure.time]
    difficulty: 4
    type: text
    stem: "ตั๋วเครื่องบินเขียนเวลาออกเป็น 9:20 p.m. แบบ 12 ชั่วโมง เขียนแบบ 24 ชั่วโมงใช้จุดได้อย่างไร"
    accepted: ["21.20", "21.20 น.", "21:20", "21.20น."]
    misconceptions:
      - { match: "9.20", feedback: "p.m. คือหลังเที่ยง ต้องบวก 12 กับชั่วโมง" }
      - { match: "19.20", feedback: "บวก 10 ต้องบวก 12" }
    hints:
      - "p.m. คือหลังเที่ยง a.m. คือก่อนเที่ยง"
      - "หลังเที่ยงให้บวก 12 กับชั่วโมง"
    solution: "9:20 p.m. คือ 9 นาฬิกา 20 นาทีหลังเที่ยง $9 + 12 = 21$ เขียน 21.20 น."
