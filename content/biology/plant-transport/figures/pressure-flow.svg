<text x="480.0" y="235.0" text-anchor="end" font-size="13" font-weight="bold" fill="#e65100">ความดันสูง</text>
<text x="480.0" y="330.0" text-anchor="end" font-size="13" font-weight="bold" fill="#e65100">ความดันต่ำ</text>
<text x="450.0" y="500.0" text-anchor="middle" font-size="15" fill="#222">สารละลายในโฟลเอ็มไหลทั้งก้อนจากที่ความดันสูงไปที่ความดันต่ำ</text>
<text x="450.0" y="526.0" text-anchor="middle" font-size="15" fill="#222">ส่วนน้ำในไซเลมถูกดึงขึ้นด้วยแรงจากการคายน้ำ</text>
</svg>