problems:
  - id: physics.electricity.electronics-intro.p001
    topics: [physics.electricity.electronics-intro]
    difficulty: 1
    type: mcq
    stem: "ในแผนภาพวงจร ชิ้นส่วนใดมีสัญลักษณ์เป็นรูปสามเหลี่ยมชี้ไปที่ขีดตั้ง (ไม่มีลูกศรเล็กพุ่งออก)"
    choices:
      - { id: a, text: "ไดโอด", correct: true }
      - { id: b, text: "ตัวเก็บประจุ", feedback: "ตัวเก็บประจุเขียนเป็นแผ่นขนานสองแผ่น ไม่มีสามเหลี่ยม" }
      - { id: c, text: "ตัวต้านทาน", feedback: "ตัวต้านทานเขียนเป็นเส้นซิกแซก (หรือสี่เหลี่ยมผืนผ้า)" }
      - { id: d, text: "แอลอีดี", feedback: "แอลอีดีมีสามเหลี่ยมกับขีดเหมือนไดโอด แต่มีลูกศรเล็กสองเส้นพุ่งออกแทนแสง" }
    hints:
      - "สามเหลี่ยมชี้ทิศที่กระแสไหลได้"
      - "ชิ้นส่วนใดให้กระแสผ่านได้ทางเดียว"
    solution: "สามเหลี่ยมชี้ไปที่ขีดคือสัญลักษณ์ไดโอด หัวสามเหลี่ยมบอกทิศที่กระแสไหลได้ (จากแอโนดไปแคโทด) ถ้ามีลูกศรเล็กพุ่งออกจะเป็นแอลอีดี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.electronics-intro.p002
    topics: [physics.electricity.electronics-intro]
    difficulty: 1
    type: text
    stem: "ชิ้นส่วนอิเล็กทรอนิกส์ที่เปล่งแสงเมื่อมีกระแสไหลผ่านในทิศไบอัสตรง เรียกว่าอะไร (ตอบชื่อหรือตัวย่อภาษาอังกฤษ)"
    accepted: ["แอลอีดี", "LED", "ไดโอดเปล่งแสง", "light-emitting diode", "light emitting diode"]
    misconceptions:
      - { match: "หลอดไฟ", feedback: "หลอดไส้ให้แสงได้ทั้งสองทิศของกระแส ชิ้นส่วนที่ให้แสงเฉพาะทิศไบอัสตรงคือไดโอดชนิดพิเศษ" }
      - { match: "ไดโอด", feedback: "ใกล้แล้ว ไดโอดธรรมดาไม่เปล่งแสง ชนิดที่เปล่งแสงมีชื่อเฉพาะ" }
    hints:
      - "เป็นไดโอดชนิดหนึ่ง"
      - "ตัวย่อภาษาอังกฤษสามตัวอักษร"
    solution: "ไดโอดเปล่งแสงหรือแอลอีดี (LED: light-emitting diode)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.electronics-intro.p003
    topics: [physics.electricity.electronics-intro]
    difficulty: 2
    type: match
    stem: "จับคู่ชิ้นส่วนอิเล็กทรอนิกส์กับหน้าที่"
    pairs:
      - { left: "ตัวต้านทาน", right: "จำกัดกระแสและแบ่งความต่างศักย์" }
      - { left: "ตัวต้านทานปรับค่าได้", right: "ปรับความดังหรือหรี่ไฟ" }
      - { left: "ไดโอด", right: "ให้กระแสผ่านได้ทางเดียว" }
      - { left: "ตัวเก็บประจุ", right: "อัดประจุไว้แล้วคายประจุออกภายหลัง" }
      - { left: "ทรานซิสเตอร์", right: "ใช้กระแสเล็กควบคุมกระแสใหญ่ เป็นสวิตช์หรือขยายสัญญาณ" }
    hints:
      - "ชิ้นส่วนใดมีสามขา ชิ้นส่วนใดมีแผ่นตัวนำสองแผ่น"
      - "ชิ้นส่วนที่มีลูกศรพาดในสัญลักษณ์ปรับค่าได้"
    solution: "ตัวต้านทานจำกัดกระแส ตัวต้านทานปรับค่าได้ใช้ปรับความดังหรือความสว่าง ไดโอดให้กระแสทางเดียว ตัวเก็บประจุเก็บและคายประจุ ทรานซิสเตอร์ใช้กระแสเบสเล็ก ๆ ควบคุมกระแสคอลเลกเตอร์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.electronics-intro.p004
    topics: [physics.electricity.electronics-intro]
    difficulty: 2
    type: mcq
    stem: "แอลอีดีมีขาสองขายาวไม่เท่ากัน ต้องต่ออย่างไรแอลอีดีจึงสว่าง"
    choices:
      - { id: a, text: "ขายาว (แอโนด) ต่อทางขั้วบวก ขาสั้น (แคโทด) ต่อทางขั้วลบ โดยมีตัวต้านทานต่ออนุกรม", correct: true }
      - { id: b, text: "ขาสั้นต่อทางขั้วบวก ขายาวต่อทางขั้วลบ", feedback: "แบบนี้เป็นไบอัสกลับ กระแสไม่ไหล แอลอีดีไม่สว่าง" }
      - { id: c, text: "ต่อขาใดก็ได้ เพราะแอลอีดีเหมือนหลอดไส้", feedback: "แอลอีดีเป็นไดโอด ให้กระแสผ่านทางเดียว ต่อกลับขั้วจะไม่สว่าง" }
    hints:
      - "แอลอีดีเป็นไดโอดชนิดหนึ่ง"
      - "ขาไหนคือแอโนด และแอโนดต้องอยู่ทางขั้วใด"
    solution: "แอลอีดีให้กระแสผ่านจากแอโนด (ขายาว) ไปแคโทด (ขาสั้น) จึงต้องให้ขายาวอยู่ทางขั้วบวก และต้องมีตัวต้านทานอนุกรมจำกัดกระแส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.electronics-intro.p005
    topics: [physics.electricity.electronics-intro]
    difficulty: 2
    type: numeric
    stem: "ตัวต้านทานมีแถบสี น้ำตาล ดำ แดง ทอง มีความต้านทานกี่โอห์ม (ตอบในหน่วย Ω)"
    answer: { value: 1000, tolerance: 1, unit: Ω }
    misconceptions:
      - { match: 102, feedback: "อ่านแถบที่ 3 เป็นตัวเลขหลักที่สาม แถบที่ 3 เป็นตัวคูณ แดง (2) แปลว่าเติมศูนย์ 2 ตัว" }
      - { match: 100, feedback: "แดงเป็นตัวคูณ $10^2$ ไม่ใช่ $10^1$" }
    hints:
      - "น้ำตาล = 1, ดำ = 0, แดง = 2"
      - "แถบที่ 3 บอกจำนวนศูนย์ที่ต้องเติมท้ายตัวเลขสองหลักแรก"
    solution: "ตัวเลข 1 และ 0 ได้ 10 แถบแดงคือเติมศูนย์ 2 ตัว ได้ $10 \\times 10^2 = 1000\\ \\Omega = 1\\ \\mathrm{k\\Omega}$ แถบทองคือ $\\pm 5\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.electronics-intro.p006
    topics: [physics.electricity.electronics-intro]
    difficulty: 3
    type: numeric
    stem: "ตัวต้านทานในภาพมีความต้านทานกี่กิโลโอห์ม (ตอบในหน่วย kΩ)"
    figure: { src: p-bands.svg, alt: "ตัวต้านทานมีแถบสีสี่แถบ เรียงจากซ้ายไปขวาเป็น เหลือง ม่วง ส้ม และแถบที่สี่สีทองซึ่งอยู่ห่างออกไปทางขวา" }
    answer: { value: 47, tolerance: 0.5, unit: kΩ }
    misconceptions:
      - { match: 4.7, feedback: "ส้มคือ 3 ต้องเติมศูนย์ 3 ตัว ได้ 47 000 Ω ไม่ใช่ 4 700 Ω" }
      - { match: 473, feedback: "อ่านแถบที่ 3 เป็นตัวเลข แถบที่ 3 คือจำนวนศูนย์" }
    hints:
      - "เหลือง = 4, ม่วง = 7, ส้ม = 3"
      - "เขียนเป็นโอห์มก่อน แล้วหารด้วย 1000 เป็นกิโลโอห์ม"
    solution: "เหลือง ม่วง = 47 ส้มคือเติมศูนย์ 3 ตัว ได้ $47\\,000\\ \\Omega = 47\\ \\mathrm{k\\Omega}$ ความคลาดเคลื่อน $\\pm 5\\%$ (แถบทอง)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.electronics-intro.p007
    topics: [physics.electricity.electronics-intro]
    difficulty: 3
    type: mcq
    stem: "วงจร ก และ ข ต่างกันเฉพาะทิศของไดโอด แบตเตอรี่ทั้งสองมีขั้วบวกอยู่ทางซ้าย หลอดไฟในวงจรใดสว่าง"
    figure: { src: p-diode.svg, alt: "วงจรสองวงจร แบตเตอรี่อยู่ด้านล่าง ขั้วบวกทางซ้าย ขั้วลบทางขวา สายจากขั้วบวกขึ้นไปด้านบนผ่านไดโอดแล้วผ่านหลอดไฟทางขวากลับมาขั้วลบ วงจร ก ไดโอดมีหัวสามเหลี่ยมชี้ไปทางขวา (ทางหลอดไฟ) วงจร ข ไดโอดมีหัวสามเหลี่ยมชี้ไปทางซ้าย (ทางขั้วบวก)" }
    choices:
      - { id: a, text: "วงจร ก เท่านั้น", correct: true }
      - { id: b, text: "วงจร ข เท่านั้น", feedback: "ในวงจร ข หัวลูกศรของไดโอดชี้สวนทางกับกระแสที่ออกจากขั้วบวก เป็นไบอัสกลับ กระแสไม่ไหล" }
      - { id: c, text: "สว่างทั้งสองวงจร", feedback: "ไดโอดให้กระแสผ่านทางเดียว ทิศของไดโอดจึงมีผล" }
      - { id: d, text: "ไม่สว่างทั้งสองวงจร", feedback: "วงจร ก ต่อไดโอดแบบไบอัสตรง กระแสไหลได้" }
    hints:
      - "ไล่ทิศกระแสจากขั้วบวกไปด้านบนของวงจร"
      - "กระแสผ่านไดโอดได้เมื่อไหลไปทางเดียวกับหัวลูกศร"
    solution: "กระแสออกจากขั้วบวกทางซ้าย ขึ้นไปแล้วไหลไปทางขวาผ่านไดโอด วงจร ก หัวลูกศรชี้ไปทางขวา เป็นไบอัสตรง หลอดสว่าง วงจร ข หัวลูกศรชี้กลับ เป็นไบอัสกลับ หลอดไม่สว่าง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.electronics-intro.p008
    topics: [physics.electricity.electronics-intro]
    difficulty: 3
    type: mcq
    stem: "แผนภาพใดแสดง $R_1$ ต่อขนานกับ $R_2$ แล้วต่ออนุกรมกับ $R_3$"
    figure: { src: p-diagrams.svg, alt: "แผนภาพวงจรสามแบบ แต่ละแบบมีแบตเตอรี่และตัวต้านทาน R1 R2 R3 แบบ ก R1 R2 R3 เรียงต่อกันบนสายด้านบนเส้นเดียว แบบ ข สายด้านบนแยกเป็นสองทางที่จุดต่อ ทางหนึ่งผ่าน R1 อีกทางผ่าน R2 แล้วรวมกันที่จุดต่ออีกจุด จากนั้นผ่าน R3 แล้วกลับแบตเตอรี่ แบบ ค R1 R2 R3 ตั้งเรียงกันอยู่ระหว่างสายด้านบนกับสายด้านล่าง ทุกตัวต่อกับแบตเตอรี่ที่อยู่ด้านซ้าย" }
    choices:
      - { id: a, text: "แบบ ข", correct: true }
      - { id: b, text: "แบบ ก", feedback: "แบบ ก ตัวต้านทานทั้งสามอยู่บนเส้นทางเดียว เป็นการต่ออนุกรมทั้งหมด" }
      - { id: c, text: "แบบ ค", feedback: "แบบ ค ตัวต้านทานทั้งสามต่อคร่อมระหว่างสายสองเส้นเดียวกัน เป็นการต่อขนานทั้งหมด" }
    hints:
      - "ต่อขนานคือแยกทางที่จุดต่อหนึ่ง แล้วรวมกันที่อีกจุดต่อหนึ่ง"
      - "หาแบบที่มีสองตัวแยกทางกัน แล้วกระแสทั้งหมดต้องผ่านตัวที่สาม"
    solution: "แบบ ข กระแสแยกผ่าน $R_1$ และ $R_2$ ที่จุดต่อ (ต่อขนาน) แล้วรวมกันผ่าน $R_3$ (ต่ออนุกรม)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.electronics-intro.p009
    topics: [physics.electricity.electronics-intro]
    difficulty: 3
    type: numeric
    stem: "ต่อแอลอีดีกับแหล่งจ่าย $6.0\\ \\mathrm{V}$ แอลอีดีกินความต่างศักย์ $2.0\\ \\mathrm{V}$ และต้องการกระแส $16\\ \\mathrm{mA}$ ต้องใช้ตัวต้านทานอนุกรมกี่โอห์ม (ตอบในหน่วย Ω)"
    answer: { value: 250, tolerance: 2.5, unit: Ω }
    misconceptions:
      - { match: 375, feedback: "ใช้ความต่างศักย์ทั้งหมด $6.0\\ \\mathrm{V}$ แต่ตัวต้านทานรับเฉพาะส่วนที่เหลือจากแอลอีดี $6.0 - 2.0$" }
      - { match: 0.25, feedback: "ใช้กระแสเป็นมิลลิแอมแปร์ ต้องแปลง $16\\ \\mathrm{mA} = 0.016\\ \\mathrm{A}$" }
    hints:
      - "ความต่างศักย์คร่อมตัวต้านทาน = แหล่งจ่าย − แอลอีดี"
      - "$R = V/I$ โดยใช้กระแสเป็นแอมแปร์"
    solution: "ความต่างศักย์คร่อมตัวต้านทาน $6.0 - 2.0 = 4.0\\ \\mathrm{V}$ ได้ $R = \\dfrac{4.0}{0.016} = 250\\ \\Omega$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.electronics-intro.p010
    topics: [physics.electricity.electronics-intro]
    difficulty: 3
    type: mcq
    stem: "โคมไฟหัวเตียงต่อตัวต้านทานปรับค่าได้แบบอนุกรมกับหลอดไฟ ถ้าหมุนปุ่มให้ความต้านทานเพิ่มขึ้น หลอดไฟจะเป็นอย่างไร"
    choices:
      - { id: a, text: "หรี่ลง เพราะกระแสในวงจรลดลง", correct: true }
      - { id: b, text: "สว่างขึ้น เพราะความต้านทานเพิ่มพลังงาน", feedback: "ตัวต้านทานไม่ได้เพิ่มพลังงาน ความต้านทานรวมมากขึ้นทำให้กระแสลดลง" }
      - { id: c, text: "สว่างเท่าเดิม เพราะแหล่งจ่ายเท่าเดิม", feedback: "แหล่งจ่ายเท่าเดิม แต่ความต้านทานรวมเพิ่ม กระแส $I = V/R_{\\text{รวม}}$ จึงลดลง" }
    hints:
      - "ต่ออนุกรม ความต้านทานรวมเปลี่ยนอย่างไร"
      - "ความต้านทานรวมมากขึ้น กระแสเป็นอย่างไร"
    solution: "ตัวต้านทานปรับค่าได้ต่ออนุกรมกับหลอดไฟ เพิ่มความต้านทานแล้วความต้านทานรวมเพิ่ม กระแสลดลง และความต่างศักย์คร่อมหลอดลดลง หลอดจึงหรี่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.electronics-intro.p011
    topics: [physics.electricity.electronics-intro]
    difficulty: 4
    type: numeric
    stem: "ทรานซิสเตอร์มีอัตราขยายกระแส $\\beta = 150$ ถ้ากระแสเบสเป็น $0.10\\ \\mathrm{mA}$ กระแสคอลเลกเตอร์เป็นเท่าใด (ตอบในหน่วย mA)"
    answer: { value: 15, tolerance: 0.15, unit: mA }
    misconceptions:
      - { match: 0.000667, feedback: "นำกระแสเบสหารด้วย $\\beta$ กระแสคอลเลกเตอร์ใหญ่กว่ากระแสเบส จึงต้องคูณ" }
      - { match: 1.5, feedback: "เลื่อนจุดทศนิยมผิด $150 \\times 0.10 = 15$" }
    hints:
      - "$I_C = \\beta I_B$"
      - "กระแสคอลเลกเตอร์ควรใหญ่หรือเล็กกว่ากระแสเบส"
    solution: "$I_C = \\beta I_B = 150 \\times 0.10\\ \\mathrm{mA} = 15\\ \\mathrm{mA}$ กระแสเบสเล็ก ๆ ควบคุมกระแสที่ใหญ่กว่า 150 เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.electronics-intro.p012
    topics: [physics.electricity.electronics-intro]
    difficulty: 4
    type: mcq
    stem: "วงจรมีถ่าน สวิตช์ ตัวต้านทาน และแอลอีดี และมีตัวเก็บประจุ $1000\\ \\mu\\mathrm{F}$ ต่อขนานกับแอลอีดี เมื่อเปิดสวิตช์ตัดถ่านออก แอลอีดีจะเป็นอย่างไร"
    choices:
      - { id: a, text: "ค่อย ๆ หรี่แล้วดับ เพราะตัวเก็บประจุคายประจุผ่านแอลอีดี", correct: true }
      - { id: b, text: "ดับทันที เพราะไม่มีถ่านแล้ว", feedback: "ถ้าไม่มีตัวเก็บประจุจะดับทันที แต่ตัวเก็บประจุที่อัดประจุไว้จะจ่ายกระแสให้แอลอีดีต่อได้ระยะหนึ่ง" }
      - { id: c, text: "สว่างขึ้นกว่าเดิมชั่วครู่", feedback: "ตัวเก็บประจุคายประจุออกมาเท่าที่เก็บไว้ ความต่างศักย์ค่อย ๆ ลดลง แอลอีดีจึงหรี่ลง ไม่ได้สว่างขึ้น" }
    hints:
      - "ขณะที่ถ่านยังต่ออยู่ ตัวเก็บประจุทำอะไร"
      - "เมื่อตัดถ่าน ประจุที่เก็บไว้ไหลไปทางไหน"
    solution: "ขณะต่อถ่าน ตัวเก็บประจุอัดประจุไว้ เมื่อตัดถ่าน มันคายประจุผ่านแอลอีดี ความต่างศักย์ค่อย ๆ ลดลง แอลอีดีจึงหรี่ลงแล้วดับ"
