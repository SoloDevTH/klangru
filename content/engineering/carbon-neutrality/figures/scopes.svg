<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" font-family="sans-serif" font-size="14">
<title>ขอบเขต 1 2 และ 3 ของการปล่อยก๊าซเรือนกระจก</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15211e"/></marker></defs>
<rect x="0" y="0" width="720" height="480" fill="#ffffff"/>
<text x="360.0" y="30.0" text-anchor="middle" font-size="16" fill="#15211e" font-weight="bold">ขอบเขตการปล่อยก๊าซเรือนกระจกขององค์กร (Scope 1, 2, 3)</text>
<rect x="250.0" y="190.0" width="220.0" height="110.0" rx="12" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="2.5"/>
<text x="360.0" y="228.0" text-anchor="middle" font-size="16" fill="#15211e" font-weight="bold">องค์กร</text>
<text x="360.0" y="252.0" text-anchor="middle" font-size="13" fill="#15211e">ขอบเขตการรายงาน</text>
<text x="360.0" y="272.0" text-anchor="middle" font-size="12" fill="#555555">(โรงงาน สำนักงาน ยานพาหนะ)</text>
<rect x="40.0" y="60.0" width="190.0" height="90.0" rx="10" fill="#fff3e0" stroke="#b35c00" stroke-width="2"/>
<text x="135.0" y="88.0" text-anchor="middle" font-size="14" fill="#15211e" font-weight="bold">Scope 1 โดยตรง</text>
<text x="135.0" y="110.0" text-anchor="middle" font-size="12" fill="#15211e">การเผาไหม้ในสถานที่</text>
<text x="135.0" y="128.0" text-anchor="middle" font-size="12" fill="#15211e">และยานพาหนะของบริษัท</text>
<line x1="230.0" y1="105.0" x2="250.0" y2="230.0" stroke="#b35c00" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="265.0" y="60.0" width="190.0" height="90.0" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="360.0" y="88.0" text-anchor="middle" font-size="14" fill="#15211e" font-weight="bold">Scope 2 ทางอ้อมจากพลังงาน</text>
<text x="360.0" y="110.0" text-anchor="middle" font-size="12" fill="#15211e">ไฟฟ้าหรือความร้อนที่ซื้อ</text>
<text x="360.0" y="128.0" text-anchor="middle" font-size="12" fill="#15211e">จากภายนอก</text>
<line x1="360.0" y1="150.0" x2="360.0" y2="190.0" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="490.0" y="60.0" width="190.0" height="90.0" rx="10" fill="#f3e5f5" stroke="#6a4c93" stroke-width="2"/>
<text x="585.0" y="88.0" text-anchor="middle" font-size="14" fill="#15211e" font-weight="bold">Scope 3 ห่วงโซ่คุณค่า</text>
<text x="585.0" y="110.0" text-anchor="middle" font-size="12" fill="#15211e">ผู้ขาย การขนส่ง การใช้งาน</text>
<text x="585.0" y="128.0" text-anchor="middle" font-size="12" fill="#15211e">และการกำจัดของผลิตภัณฑ์</text>
<line x1="490.0" y1="105.0" x2="470.0" y2="230.0" stroke="#6a4c93" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="360.0" y="350.0" text-anchor="middle" font-size="13" fill="#15211e">Scope 1 และ 2 เป็นส่วนที่องค์กรควบคุมได้โดยตรงมากกว่า</text>
<text x="360.0" y="372.0" text-anchor="middle" font-size="13" fill="#15211e">ในหลายองค์กร Scope 3 เป็นส่วนที่ใหญ่ที่สุดของการปล่อยทั้งหมด</text>
<text x="360.0" y="420.0" text-anchor="middle" font-size="12" fill="#555555">แผนภาพจำลองเพื่อการสอน ไม่ได้แสดงสัดส่วนของอุตสาหกรรมใดโดยเฉพาะ</text>
</svg>
