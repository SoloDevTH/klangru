  stem: '**ข้อความที่ได้ยิน:** "ฤดูร้อนปีหนึ่ง มดขนเมล็ดพืชเข้ารังทุกวัน ส่วนตั๊กแตนร้องเพลงเล่นทั้งวันและหัวเราะเยาะมด เมื่อถึงฤดูหนาว หญ้าเหี่ยวหมด ตั๊กแตนหิวจนต้องไปขออาหารจากมด แต่มดมีอาหารพอกินตลอดหน้าหนาว" (เล่าใหม่จากนิทานอีสป)


    ข้อใดเป็น **ข้อคิด** ของเรื่องที่ดีที่สุด'
  choices:
  - id: a
    text: ควรขยันและเตรียมพร้อมไว้ก่อนถึงเวลาลำบาก
    correct: true
    feedback: ถูก มดเตรียมอาหารไว้ก่อน จึงไม่ลำบากเมื่อหน้าหนาวมาถึง
  - id: b
    text: ตั๊กแตนร้องเพลงเพราะ
    feedback: เป็นรายละเอียดในเรื่อง ไม่ใช่ข้อคิด
  - id: c
    text: ฤดูหนาวหญ้าเหี่ยว
    feedback: เป็นรายละเอียดฉาก
  - id: d
    text: ไม่ควรร้องเพลง
    feedback: ตีความผิด เรื่องไม่ได้ห้ามร้องเพลง แต่สอนให้เตรียมพร้อม
  hints:
  - ข้อคิดคือสิ่งที่ผู้ฟังนำไปใช้ในชีวิตได้
  - เปรียบเทียบสิ่งที่มดกับตั๊กแตนทำ แล้วดูผลที่ได้
  solution: 'ข้อคิด: **ควรขยันและเตรียมพร้อมไว้ก่อนถึงเวลาลำบาก**'
