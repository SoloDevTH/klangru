<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" font-family="sans-serif">
<title>โฆษณาสมมติผลิตภัณฑ์เพิ่มความสูง</title>
<rect x="0" y="0" width="520" height="400" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect x="10.0" y="10.0" width="500.0" height="380.0" rx="14" fill="#fffbea" stroke="#c0392b" stroke-width="3"/>
<text x="260.0" y="50.0" font-size="26" text-anchor="middle" font-weight="bold" fill="#c0392b">สูงไว ซูเปอร์ไฮท์</text>
<text x="260.0" y="78.0" font-size="12" text-anchor="middle" fill="#555">(โฆษณาสมมติ ไม่ใช่สินค้าจริง)</text>
<circle cx="150.0" cy="204.0" r="14.0" fill="#f5cba7" stroke="#333" stroke-width="1.5"/>
<rect x="132.0" y="220.0" width="36.0" height="80.0" rx="6" fill="#85c1e9" stroke="#333" stroke-width="1.5"/>
<text x="150.0" y="322.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">ก่อนกิน</text>
<circle cx="370.0" cy="164.0" r="14.0" fill="#f5cba7" stroke="#333" stroke-width="1.5"/>
<rect x="352.0" y="180.0" width="36.0" height="120.0" rx="6" fill="#85c1e9" stroke="#333" stroke-width="1.5"/>
<text x="370.0" y="322.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">หลังกิน 30 วัน</text>
<line x1="215.0" y1="230.0" x2="300.0" y2="230.0" stroke="#333" stroke-width="3" marker-end="url(#ah)"/>
<text x="260.0" y="348.0" font-size="13" text-anchor="middle" fill="#111">&quot;สูงเพิ่ม 10 ซม. ใน 30 วัน ทุกวัย แม้หยุดสูงแล้ว&quot;</text>
<text x="260.0" y="366.9" font-size="13" text-anchor="middle" fill="#111">&quot;ดาราชื่อดังใช้จริง  หมอแนะนำ  ซื้อวันนี้ลด 70%&quot;</text>
</svg>
