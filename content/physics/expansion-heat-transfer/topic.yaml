id: physics.thermal.expansion-heat-transfer
subject: physics
title: { th: การขยายตัวของสสารและการถ่ายโอนความร้อน, en: Thermal expansion and heat transfer }
summary: การใช้เทอร์มอมิเตอร์ การขยายตัวและหดตัวของสสารด้วยแบบจำลองอนุภาค รอยต่อสะพาน การนำ การพา และการแผ่รังสีความร้อน และการออกแบบอุปกรณ์เก็บหรือระบายความร้อน
difficulty: 3
minutes: 35
prerequisites: [chemistry.matter.particle-model]
encompasses:
  - { id: chemistry.matter.particle-model, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: อนุภาคเมื่อเย็นและเมื่อร้อน
    src: particles-expansion.svg
    alt: "ซ้าย: อนุภาคของแข็งเมื่อเย็นเรียงชิดกัน 6 คูณ 6 สั่นน้อย ขวา: เมื่อร้อน อนุภาคจำนวนเท่าเดิมขนาดเท่าเดิม แต่สั่นแรงขึ้นและอยู่ห่างกันมากขึ้น กรอบทั้งก้อนจึงใหญ่ขึ้น ใต้ภาพเขียนว่าอนุภาคแต่ละตัวมีขนาดเท่าเดิม แต่ระยะห่างเพิ่มขึ้น ก้อนวัตถุจึงขยายตัว"
  - { type: check, problem: physics.thermal.expansion-heat-transfer.p002, prompt: "อนุภาคใหญ่ขึ้น หรืออยู่ห่างกันมากขึ้น" }
  - type: figure
    title: รอยต่อขยายตัวของสะพาน
    src: bridge-joint.svg
    alt: "พื้นสะพานสองท่อนมีรอยต่อแบบฟันหวีตรงกลาง วันที่อากาศเย็น ช่องว่างระหว่างสองท่อนกว้าง วันที่อากาศร้อน พื้นสะพานยืดเข้าหากันตามลูกศร ช่องว่างแคบลง ฟันหวีช่วยให้ล้อรถวิ่งผ่านได้ทุกฤดู"
  - type: worked-example
    title: รอยต่อของสะพานต้องกว้างเท่าใด
    problem: "สะพานเหล็กช่วงหนึ่งยาว $50$ เมตร อุณหภูมิพื้นสะพานเปลี่ยนจาก $20\\ ^\\circ\\mathrm{C}$ ตอนเช้ามืด เป็น $50\\ ^\\circ\\mathrm{C}$ ตอนบ่าย (ค่าสมมติ) เหล็กยาว 1 เมตรยืด $0.012$ มิลลิเมตรทุก $1\\ ^\\circ\\mathrm{C}$ รอยต่อต้องรับการยืดได้อย่างน้อยเท่าใด"
    steps:
      - text: "อุณหภูมิเปลี่ยน $50 - 20 = 30\\ ^\\circ\\mathrm{C}$"
        why: "ใช้ผลต่างของอุณหภูมิ ไม่ใช่อุณหภูมิสูงสุด"
      - text: "เหล็ก 1 เมตร ร้อนขึ้น $30\\ ^\\circ\\mathrm{C}$ ยืด $0.012 \\times 30 = 0.36$ มิลลิเมตร"
      - text: "สะพาน $50$ เมตร ยืด $0.36 \\times 50 = 18$ มิลลิเมตร"
        why: "ยิ่งยาว ยิ่งยืดมาก เพราะทุกเมตรยืดเท่ากัน"
    answer: "อย่างน้อย $18$ มิลลิเมตร วิศวกรมักเผื่อเพิ่มให้ปลอดภัย"
  - { type: check, problem: physics.thermal.expansion-heat-transfer.p006, prompt: "คูณทั้งความยาวและอุณหภูมิที่เพิ่ม" }
  - type: figure
    title: การถ่ายโอนความร้อนสามแบบ
    src: heat-transfer-modes.svg
    alt: "หม้อน้ำตั้งบนเตาไฟ ในหม้อมีลูกศรวนสองวง น้ำร้อนลอยขึ้นตรงกลาง น้ำเย็นจมลงด้านข้าง เป็นการพาความร้อน ด้ามโลหะของหม้อร้อนตามขึ้นมาเป็นการนำความร้อน ดวงอาทิตย์ด้านซ้ายบนส่งเส้นคลื่นมายังหม้อ และมือที่ยื่นข้างเตารู้สึกร้อน เป็นการแผ่รังสีซึ่งไม่ต้องมีตัวกลาง"
  - type: worked-example
    title: ออกแบบกล่องเก็บน้ำแข็ง
    problem: "จะใช้วัสดุใดและออกแบบอย่างไร ให้กล่องเก็บน้ำแข็งสำหรับไปเที่ยวทะเลเก็บน้ำแข็งได้นานที่สุด"
    steps:
      - text: "ความร้อนจากภายนอกเข้ามาละลายน้ำแข็ง ต้องลดการถ่ายโอนความร้อนทั้งสามแบบ"
      - text: "ลดการนำ: ผนังทำด้วยโฟมหนาหรือผนังสองชั้นที่มีอากาศคั่น"
        why: "โฟมมีอากาศเล็ก ๆ ขังอยู่ อากาศที่ไม่เคลื่อนที่นำความร้อนได้น้อยมาก"
      - text: "ลดการพา: ฝาปิดสนิท ไม่ให้อากาศร้อนไหลเข้า และไม่เปิดบ่อย"
      - text: "ลดการแผ่รังสี: ผิวนอกสีขาวหรือมันวาว และวางไว้ในที่ร่ม"
    answer: "กล่องโฟมหนา ฝาปิดสนิท สีขาว วางในที่ร่ม"
  - type: simulation
    title: "รูปแบบพลังงานและการเปลี่ยนแปลง (PhET Energy Forms and Changes)"
    url: https://phet.colorado.edu/en/simulations/energy-forms-and-changes
    provider: phet
    note: "ในหน้า Intro วางก้อนเหล็กกับก้อนอิฐบนเตาแล้วให้ความร้อนเท่ากัน สังเกตว่าอุณหภูมิขึ้นเร็วไม่เท่ากัน ลองวางน้ำ แล้วนำก้อนร้อนไปแตะก้อนเย็น ดูลูกศรพลังงานไหลจากก้อนที่ร้อนกว่าไปยังก้อนที่เย็นกว่า"
glossary:
  - { term: เทอร์มอมิเตอร์, definition: "เครื่องมือวัดอุณหภูมิ แบบกระเปาะใช้การขยายตัวของของเหลวในหลอดแก้ว (thermometer)" }
  - { term: การขยายตัวเนื่องจากความร้อน, definition: "การที่สสารมีขนาดหรือปริมาตรเพิ่มขึ้นเมื่อร้อนขึ้น เพราะอนุภาคอยู่ห่างกันมากขึ้น (thermal expansion)" }
  - { term: การนำความร้อน, definition: "การถ่ายโอนความร้อนผ่านเนื้อวัตถุ โดยอนุภาคส่งพลังงานต่อกัน ตัวกลางไม่เคลื่อนที่ไปด้วย (conduction)" }
  - { term: การพาความร้อน, definition: "การถ่ายโอนความร้อนโดยของเหลวหรือแก๊สที่ร้อนเคลื่อนที่พาความร้อนไปด้วย (convection)" }
  - { term: การแผ่รังสีความร้อน, definition: "การถ่ายโอนความร้อนโดยไม่ต้องมีตัวกลาง เช่น ความร้อนจากดวงอาทิตย์ (radiation)" }
  - { term: ฉนวนความร้อน, definition: "วัสดุที่นำความร้อนได้ไม่ดี เช่น โฟม ไม้ พลาสติก อากาศที่ถูกขังไว้ (thermal insulator)" }
flashcards:
  - { front: "สสารร้อนขึ้น อนุภาคเปลี่ยนอย่างไร", back: "สั่นแรงขึ้นและอยู่ห่างกันมากขึ้น ขนาดของอนุภาคเท่าเดิม" }
  - { front: "ทำไมสะพานต้องมีรอยต่อ", back: "ให้พื้นสะพานยืดเมื่อร้อนและหดเมื่อเย็นได้ โดยไม่ดันกันจนเสียหาย" }
  - { front: "การถ่ายโอนความร้อนสามแบบ", back: "การนำ (ผ่านเนื้อวัตถุ) การพา (ของไหลเคลื่อนที่) การแผ่รังสี (ไม่ต้องมีตัวกลาง)" }
  - { front: "กระติกน้ำแข็งที่ดี", back: "ผนังเป็นฉนวน ฝาปิดสนิท ผิวมันวาวหรือสีขาว" }
