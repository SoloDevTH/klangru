id: computer.systems.troubleshooting
subject: computer
title: { th: การแก้ปัญหาฮาร์ดแวร์และซอฟต์แวร์อย่างเป็นระบบ, en: "Systematic hardware and software troubleshooting" }
summary: บอกอาการเสียด้วยคำที่ถูกต้อง ใช้กลยุทธ์แก้ปัญหาทั่วไป แยกปัญหาฮาร์ดแวร์กับซอฟต์แวร์ ไล่หาสาเหตุทีละอย่างและแบ่งครึ่ง และเขียนคู่มือแก้ปัญหาให้ผู้อื่นใช้
difficulty: 3
minutes: 30
prerequisites: [computer.systems.computer-systems]
encompasses:
  - { id: computer.systems.computer-systems, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: no-display-flowchart.svg
    alt: "ผังงานแก้ปัญหา อาการ กดเปิดเครื่องแล้วจอไม่มีภาพ คำถามแรก ไฟที่ตัวเครื่องติดและพัดลมหมุนหรือไม่ ถ้าไม่ ให้ตรวจปลั๊ก สายไฟ สวิตช์ปลั๊กพ่วง และลองเสียบเต้ารับอื่น ถ้าใช่ ถามต่อว่าไฟที่จอภาพติดหรือไม่ ถ้าไม่ ให้ตรวจสายไฟของจอและกดปุ่มเปิดจอ ถ้าใช่ ให้ตรวจสายสัญญาณภาพทั้งสองปลายและเลือกช่องสัญญาณของจอให้ถูก จากนั้นถามว่าลองจอที่รู้ว่าใช้ได้แล้วมีภาพหรือไม่ ถ้าใช่ จอเดิมเสีย แจ้งครูหรือช่างเปลี่ยนจอ ถ้าไม่ ปัญหาอยู่ที่ตัวเครื่อง เช่น การ์ดจอหรือ RAM ให้จดสิ่งที่ลองแล้วและแจ้งครูหรือช่าง ด้านข้างเขียนว่าถ้าแก้ได้ที่ขั้นใดให้หยุดแล้วทดสอบ และห้ามเปิดฝาเครื่องหรือแหล่งจ่ายไฟเอง"
    caption: "เรียงคำถามจากสิ่งที่ง่ายและพบบ่อยไปหาสิ่งที่ยาก"
  - type: worked-example
    title: ลำโพงห้องเรียนไม่มีเสียง
    problem: "ครูเปิดคลิปวิดีโอจากคอมพิวเตอร์ในห้องเรียน ภาพขึ้นปกติแต่ลำโพงไม่มีเสียง ให้แก้อย่างเป็นระบบ"
    steps:
      - text: "บอกอาการให้ชัด: ภาพปกติ ไม่มีเสียงจากลำโพงภายนอก เกิดกับคลิปนี้ ยังไม่รู้ว่าเป็นกับทุกคลิปหรือไม่"
      - text: "ตรวจสิ่งง่ายก่อน: ไฟที่ลำโพงติด สายเสียบแน่น ปุ่มปรับเสียงที่ลำโพงไม่ได้หมุนไปที่ศูนย์ พบว่าทุกอย่างปกติ"
        why: "สายหลวมและปุ่มเสียงเป็นสาเหตุที่พบบ่อยที่สุดและตรวจได้ในไม่กี่วินาที"
      - text: "ตรวจการตั้งค่า: ไอคอนลำโพงในระบบไม่ได้ปิดเสียง แต่อุปกรณ์เสียงที่เลือกไว้คือ จอภาพ ไม่ใช่ ลำโพง"
      - text: "เปลี่ยนเพียงอย่างเดียว: เลือกอุปกรณ์เสียงเป็นลำโพง แล้วเปิดคลิปเดิมอีกครั้ง มีเสียงแล้ว"
        why: "เปลี่ยนทีละอย่าง จึงมั่นใจได้ว่าการตั้งค่าอุปกรณ์เสียงคือสาเหตุจริง"
      - text: "บันทึกไว้ข้างเครื่อง: ถ้าไม่มีเสียง ให้ตรวจว่าเลือกอุปกรณ์เสียงเป็นลำโพงหรือไม่"
    answer: "สาเหตุคือระบบส่งเสียงออกทางจอภาพ แก้โดยเลือกอุปกรณ์เสียงเป็นลำโพงและจดวิธีไว้ให้คนต่อไป"
  - { type: check, problem: computer.systems.troubleshooting.p002, prompt: "อาการแต่ละแบบควรตรวจอะไรก่อน" }
  - type: figure
    src: half-split.svg
    alt: "สายโซ่ 8 ชิ้นเรียงจากซ้ายไปขวา ทำสามแถวแสดงการแบ่งครึ่ง แถวแรก ทดสอบครั้งที่ 1 ตรวจที่กึ่งกลางหลังชิ้นที่ 4 สัญญาณผ่าน ปัญหาจึงอยู่ครึ่งขวา แถวที่สอง ทดสอบครั้งที่ 2 ตรวจหลังชิ้นที่ 6 สัญญาณไม่ผ่าน ปัญหาจึงอยู่ที่ชิ้น 5 หรือ 6 แถวที่สาม ทดสอบครั้งที่ 3 ตรวจหลังชิ้นที่ 5 สัญญาณไม่ผ่าน ชิ้นที่ 5 เสีย ใต้ภาพเขียนว่า 8 ชิ้นใช้การทดสอบ 3 ครั้ง เพราะแต่ละครั้งตัดชิ้นที่ต้องสงสัยทิ้งครึ่งหนึ่ง 8 เป็น 4 เป็น 2 เป็น 1"
    caption: "การแบ่งครึ่งหาชิ้นที่เสียได้เร็วกว่าการตรวจทีละชิ้น"
  - type: worked-example
    title: เน็ตหลุดทั้งแถวหลังห้อง
    problem: "ห้องคอมพิวเตอร์มี 30 เครื่อง วันนี้เครื่องหมายเลข 25 ถึง 30 ซึ่งอยู่แถวหลังเข้าอินเทอร์เน็ตไม่ได้พร้อมกัน ส่วนเครื่องอื่นใช้ได้ปกติ ควรสงสัยอะไรก่อน และทดสอบอย่างไร"
    steps:
      - text: "สังเกตรูปแบบ: เสีย 6 เครื่องพร้อมกัน และอยู่ติดกันทั้งแถว ส่วนเครื่องอื่นในห้องปกติ"
        why: "ความเป็นไปได้ที่ 6 เครื่องจะเสียเองพร้อมกันมีน้อย สาเหตุน่าจะเป็นสิ่งที่ 6 เครื่องนี้ใช้ร่วมกัน"
      - text: "ตั้งสมมติฐาน: สวิตช์ตัวเล็กที่แถวหลังใช้ร่วมกัน หรือสายที่ต่อจากสวิตช์นั้นไปยังจุดกลางของห้อง เพราะเครื่องอื่นใช้เราเตอร์ตัวเดียวกันแล้วยังปกติ"
      - text: "ทดสอบทีละอย่าง: ดูไฟของสวิตช์แถวหลัง พบว่าดับ ตรวจปลั๊กของสวิตช์ พบว่าหลุดจากปลั๊กพ่วงตอนทำความสะอาด"
      - text: "แก้และตรวจ: เสียบปลั๊กสวิตช์ รอไฟติด แล้วลองเปิดเว็บจากเครื่อง 25 ถึง 30 ทุกเครื่อง ใช้ได้ทั้งหมด"
      - text: "บันทึก: ติดป้ายที่ปลั๊กของสวิตช์ว่า ห้ามถอด"
    answer: "สงสัยอุปกรณ์ที่ 6 เครื่องใช้ร่วมกันก่อน คือสวิตช์แถวหลัง ซึ่งปลั๊กหลุด"
  - { type: check, problem: computer.systems.troubleshooting.p006, prompt: "ใช้การแบ่งครึ่งกับสายโซ่ที่ยาวขึ้น" }
glossary:
  - { term: อาการ (symptom), definition: "สิ่งที่สังเกตเห็นว่าผิดปกติ เช่น จอไม่มีภาพ โปรแกรมค้าง ข้อความแจ้งข้อผิดพลาด" }
  - { term: ค้าง (freeze), definition: "อาการที่โปรแกรมหรือเครื่องไม่ตอบสนองต่อการกดหรือการคลิก" }
  - { term: รีสตาร์ต (restart), definition: "การปิดแล้วเปิดเครื่องหรือโปรแกรมใหม่ เพื่อล้างสถานะผิดพลาดชั่วคราว" }
  - { term: การสลับกับของที่ใช้ได้ (swap test), definition: "การเปลี่ยนชิ้นส่วนที่สงสัยเป็นชิ้นที่รู้ว่าดี เพื่อดูว่าปัญหาหายหรือไม่" }
  - { term: การแบ่งครึ่ง (half-splitting), definition: "การทดสอบที่กึ่งกลางของสายโซ่ชิ้นส่วน เพื่อตัดชิ้นที่ต้องสงสัยทิ้งครั้งละครึ่ง" }
  - { term: คู่มือแก้ปัญหา (troubleshooting guide), definition: "เอกสารที่เรียงขั้นตอนตรวจและแก้ปัญหาให้ผู้อื่นทำตามได้ พร้อมจุดที่ต้องเรียกผู้รู้และข้อห้ามเพื่อความปลอดภัย" }
flashcards:
  - { front: "บอกอาการเสียให้ดีต้องมีอะไร", back: "เกิดอะไร ข้อความแจ้งข้อผิดพลาด เกิดเมื่อไรหรือทุกครั้งหรือไม่ และมีอะไรเปลี่ยนก่อนหน้า" }
  - { front: "ทำไมต้องเปลี่ยนทีละอย่าง", back: "เพื่อให้รู้ว่าสิ่งใดคือสาเหตุจริงเมื่อปัญหาหาย" }
  - { front: "16 ชิ้นต่อเป็นสาย ใช้การแบ่งครึ่งอย่างมากกี่ครั้ง", back: "4 ครั้ง (16 → 8 → 4 → 2 → 1)" }
  - { front: "หลายเครื่องเสียพร้อมกัน ควรสงสัยอะไรก่อน", back: "อุปกรณ์หรือบริการที่เครื่องเหล่านั้นใช้ร่วมกัน เช่น สวิตช์ เราเตอร์ เซิร์ฟเวอร์" }
