problems:
  - id: thai.cons.p001
    topics: [thai.writing.consonants]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นอักษรกลางทั้งหมด"
    choices:
      - { id: a, text: "ก จ ด ต", correct: true, feedback: "ถูก ทั้งสี่ตัวอยู่ในประโยค ไก่ จิก เด็ก ตาย" }
      - { id: b, text: "ข ฉ ถ ผ", feedback: "ทั้งสี่ตัวเป็นอักษรสูง อยู่ในประโยค ผี ฝาก ถุง ข้าว สาร ให้ ฉัน" }
      - { id: c, text: "ค ช ท พ", feedback: "ทั้งสี่ตัวเป็นอักษรต่ำ (อักษรต่ำคู่) ไม่อยู่ในรายชื่ออักษรกลาง 9 ตัว" }
      - { id: d, text: "ก ข ค ง", feedback: "นี่คือพยัญชนะ 4 ตัวแรกตามลำดับตัวอักษร แต่มีเพียง ก ที่เป็นอักษรกลาง ข เป็นอักษรสูง ค และ ง เป็นอักษรต่ำ" }
    hints:
      - "นึกถึงประโยคช่วยจำของอักษรกลาง"
      - "ไก่ จิก เด็ก ตาย บน ปาก โอ่ง แทน ก จ ด ฎ ต ฏ บ ป อ ตรวจว่าตัวเลือกใดมีแต่ตัวในรายชื่อนี้"
    solution: "อักษรกลางมี 9 ตัว คือ ก จ ฎ ฏ ด ต บ ป อ ตัวเลือก ก จ ด ต อยู่ในรายชื่อนี้ทั้งหมด ส่วน ข ฉ ถ ผ เป็นอักษรสูง และ ค ช ท พ เป็นอักษรต่ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.cons.p002
    topics: [thai.writing.consonants]
    difficulty: 1
    type: order
    stem: "เรียงพยัญชนะต่อไปนี้ตามลำดับตัวอักษรไทย"
    items: ["จ", "ฉ", "ช", "ซ", "ฌ", "ญ"]
    hints:
      - "ท่องพยัญชนะจาก ก ไปเรื่อย ๆ จนถึงกลุ่มนี้"
      - "หลัง ง คือกลุ่มที่ขึ้นต้นด้วย จ จาน แล้วไล่ต่อไปจนถึง ญ หญิง"
    solution: "ลำดับคือ จ (จาน) ฉ (ฉิ่ง) ช (ช้าง) ซ (โซ่) ฌ (เฌอ) ญ (หญิง)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.cons.p003
    topics: [thai.writing.consonants]
    difficulty: 2
    type: numeric
    stem: "อักษรสูงมีทั้งหมดกี่ตัว (ตอบเป็นตัวเลข)"
    answer: { value: 11, unit: ตัว }
    hints:
      - "ใช้ประโยคช่วยจำ ผี ฝาก ถุง ข้าว สาร ให้ ฉัน"
      - "บางคำแทนพยัญชนะมากกว่าหนึ่งตัว เช่น สาร แทน ศ ษ ส นับให้ครบทุกตัว"
    misconceptions:
      - { match: 9, feedback: "9 ตัวคือจำนวนอักษรกลาง อักษรสูงมีมากกว่านั้น" }
      - { match: 7, feedback: "ดูเหมือนนับคำในประโยคช่วยจำ 7 คำ แต่คำว่า ถุง ข้าว สาร แทนพยัญชนะหลายตัว (ถ ฐ, ข ฃ, ศ ษ ส)" }
      - { match: 24, feedback: "24 ตัวคือจำนวนอักษรต่ำ" }
    solution: "อักษรสูงมี 11 ตัว คือ ข ฃ ฉ ฐ ถ ผ ฝ ศ ษ ส ห"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.cons.p004
    topics: [thai.writing.consonants]
    difficulty: 2
    type: match
    stem: "จับคู่พยัญชนะกับหมู่ของพยัญชนะ"
    pairs:
      - { left: "ป", right: "อักษรกลาง" }
      - { left: "ฝ", right: "อักษรสูง" }
      - { left: "ฟ", right: "อักษรต่ำคู่" }
      - { left: "ม", right: "อักษรต่ำเดี่ยว" }
    hints:
      - "ป อยู่ในคำว่า ปาก ส่วน ฝ อยู่ในคำว่า ฝาก ของประโยคช่วยจำคนละประโยค"
      - "ฟ ออกเสียงเหมือน ฝ แต่ไม่ใช่อักษรสูง ส่วน ม ไม่มีอักษรสูงที่ออกเสียงเดียวกัน"
    solution: "ป เป็นอักษรกลาง (ปาก) · ฝ เป็นอักษรสูง (ฝาก) · ฟ เป็นอักษรต่ำคู่ เพราะออกเสียงคู่กับ ฝ · ม เป็นอักษรต่ำเดี่ยว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.cons.p005
    topics: [thai.writing.consonants]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "เลือกพยัญชนะที่เป็น **อักษรสูง** ให้ครบทุกตัว"
    choices:
      - { id: a, text: "ข", correct: true }
      - { id: b, text: "ศ", correct: true }
      - { id: c, text: "ซ", feedback: "ซ ออกเสียงเหมือน ส แต่เป็นอักษรต่ำคู่" }
      - { id: d, text: "ห", correct: true }
      - { id: e, text: "ฮ", feedback: "ฮ ออกเสียงเหมือน ห แต่เป็นอักษรต่ำคู่" }
      - { id: f, text: "ฐ", correct: true }
    hints:
      - "อย่าตัดสินจากเสียงอย่างเดียว อักษรต่ำคู่ออกเสียงเหมือนอักษรสูง"
      - "ตรวจกับรายชื่อ ข ฃ ฉ ฐ ถ ผ ฝ ศ ษ ส ห ทีละตัว"
    solution: "อักษรสูงคือ ข ฃ ฉ ฐ ถ ผ ฝ ศ ษ ส ห จึงตอบ ข ศ ห ฐ ส่วน ซ และ ฮ เป็นอักษรต่ำคู่ที่ออกเสียงเหมือน ส และ ห"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.cons.p006
    topics: [thai.writing.consonants]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "เมนูร้านอาหารตามสั่งมีคำว่า ต้ม ยำ แกง ส้ม ผัด ทอด พยางค์ใดมีพยัญชนะต้นเป็น **อักษรต่ำ** (เลือกให้ครบ)"
    choices:
      - { id: a, text: "ต้ม", feedback: "ต เป็นอักษรกลาง (ตาย)" }
      - { id: b, text: "ยำ", correct: true }
      - { id: c, text: "แกง", feedback: "พยัญชนะต้นคือ ก ซึ่งเป็นอักษรกลาง สระ แ อยู่หน้าพยัญชนะแต่ไม่ใช่พยัญชนะต้น" }
      - { id: d, text: "ส้ม", feedback: "ส เป็นอักษรสูง (สาร)" }
      - { id: e, text: "ผัด", feedback: "ผ เป็นอักษรสูง (ผี)" }
      - { id: f, text: "ทอด", correct: true }
    hints:
      - "หาพยัญชนะต้นของแต่ละพยางค์ก่อน ระวังสระที่เขียนอยู่หน้าพยัญชนะ"
      - "ตัดตัวที่เป็นอักษรกลาง (ไก่จิกเด็กตายบนปากโอ่ง) และอักษรสูง (ผีฝากถุงข้าวสารให้ฉัน) ออก ที่เหลือคืออักษรต่ำ"
    solution: "พยัญชนะต้น: ต้ม = ต (กลาง), ยำ = ย (ต่ำเดี่ยว), แกง = ก (กลาง), ส้ม = ส (สูง), ผัด = ผ (สูง), ทอด = ท (ต่ำคู่) จึงตอบ ยำ และ ทอด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.cons.p007
    topics: [thai.writing.consonants]
    difficulty: 3
    type: text
    stem: "คำว่า **ลาภ** (อ่านว่า ลาบ) มีตัวสะกดอยู่ในมาตราใด (ตอบเช่น แม่กก)"
    accepted: ["แม่กบ", "กบ", "มาตราแม่กบ", "มาตรากบ"]
    misconceptions:
      - { match: "แม่กภ", feedback: "ไม่มีมาตรานี้ ให้ดูจากเสียง ภ สะกดออกเสียง /บ/" }
      - { match: "แม่ก กา", feedback: "คำนี้มี ภ เป็นตัวสะกดท้ายพยางค์ จึงไม่ใช่แม่ ก กา" }
    hints:
      - "ตัวสะกดคือพยัญชนะท้ายพยางค์ คำนี้ลงท้ายด้วย ภ"
      - "ฟังเสียงท้ายของคำว่า ลาบ แล้วหามาตราที่ออกเสียงเดียวกัน"
    solution: "ตัวสะกดคือ ภ ซึ่งออกเสียง /บ/ เหมือน บ ป พ ฟ จึงอยู่ในมาตรา **แม่กบ**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.cons.p008
    topics: [thai.writing.consonants]
    difficulty: 3
    type: match
    stem: "จับคู่คำกับมาตราตัวสะกด"
    pairs:
      - { left: "เมฆ", right: "แม่กก" }
      - { left: "อากาศ", right: "แม่กด" }
      - { left: "ภาพ", right: "แม่กบ" }
      - { left: "คุณ", right: "แม่กน" }
    hints:
      - "หาตัวสะกดของแต่ละคำ: ฆ ศ พ ณ"
      - "อ่านออกเสียงแต่ละคำแล้วฟังเสียงท้าย ว่าเป็น /ก/ /ด/ /บ/ หรือ /น/"
    solution: "เมฆ: ฆ ออกเสียง /ก/ → แม่กก · อากาศ: ศ ออกเสียง /ด/ → แม่กด · ภาพ: พ ออกเสียง /บ/ → แม่กบ · คุณ: ณ ออกเสียง /น/ → แม่กน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.cons.p009
    topics: [thai.writing.consonants]
    difficulty: 4
    type: order
    stem: "เรียงคำต่อไปนี้ตามลำดับที่พบในพจนานุกรม (เรียงตามพยัญชนะต้น)"
    items: ["ไก่", "ขา", "เงิน", "ปลา", "ฝน"]
    hints:
      - "พจนานุกรมเรียงตามพยัญชนะต้น ไม่ได้ดูสระที่เขียนอยู่หน้าพยัญชนะ"
      - "หาพยัญชนะต้นของแต่ละคำ (ก ข ง ป ฝ) แล้วเรียงตามลำดับตัวอักษร"
    solution: "พยัญชนะต้นคือ ไก่ = ก, ขา = ข, เงิน = ง, ปลา = ป, ฝน = ฝ เรียงตามลำดับตัวอักษร ก ข ง ป ฝ ได้ ไก่ ขา เงิน ปลา ฝน (สระ ไ และ เ ไม่ได้ใช้เรียง)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.cons.p010
    topics: [thai.writing.consonants]
    difficulty: 4
    type: mcq
    stem: "ข้อใดเป็น **อักษรต่ำเดี่ยว** ทั้งหมด"
    choices:
      - { id: a, text: "ง ณ ม ร", correct: true, feedback: "ถูก ทั้งสี่ตัวไม่มีอักษรสูงที่ออกเสียงเดียวกัน" }
      - { id: b, text: "ค ช ท พ", feedback: "ทั้งสี่ตัวเป็นอักษรต่ำคู่ เพราะออกเสียงเหมือน ข ฉ ถ ผ" }
      - { id: c, text: "ง ซ ม ฮ", feedback: "ซ และ ฮ เป็นอักษรต่ำคู่ (คู่กับ ส และ ห)" }
      - { id: d, text: "น ม ห ย", feedback: "ห เป็นอักษรสูง ไม่ใช่อักษรต่ำ" }
    hints:
      - "อักษรต่ำเดี่ยวคือตัวที่ไม่มีอักษรสูงออกเสียงเดียวกัน"
      - "ใช้ประโยค งู ใหญ่ นอน อยู่ ณ ริม วัด โม ฬี โลก ตรวจทีละตัว"
    solution: "อักษรต่ำเดี่ยวมี 10 ตัว คือ ง ญ ณ น ม ย ร ล ว ฬ ตัวเลือก ง ณ ม ร อยู่ในรายชื่อนี้ทั้งหมด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.cons.p011
    topics: [thai.writing.consonants]
    difficulty: 4
    type: text
    stem: "ป้ายรถเมล์เขียนว่า **หมอชิต** พยางค์ที่สอง (ชิต) มีตัวสะกดอยู่ในมาตราใด"
    accepted: ["แม่กด", "กด", "มาตราแม่กด", "มาตรากด"]
    misconceptions:
      - { match: "แม่กต", feedback: "ไม่มีมาตรานี้ ต สะกดออกเสียง /ด/" }
    hints:
      - "ตัวสะกดของคำว่า ชิต คือพยัญชนะตัวสุดท้าย"
      - "ต เมื่อเป็นตัวสะกดออกเสียงเหมือน ด"
    solution: "ชิต มี ต เป็นตัวสะกด ออกเสียง /ด/ จึงอยู่มาตรา **แม่กด**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.cons.p012
    topics: [thai.writing.consonants]
    difficulty: 5
    type: text
    stem: "ชื่อจังหวัด **กาญจนบุรี** อ่านว่า กาน-จะ-นะ-บุ-รี พยางค์แรก (กาญ) มี ญ เป็นตัวสะกด ญ ตัวนี้อยู่ในมาตราใด"
    accepted: ["แม่กน", "กน", "มาตราแม่กน", "มาตรากน"]
    misconceptions:
      - { match: "แม่เกย", feedback: "ญ ต้นคำออกเสียงคล้าย ย แต่เมื่อเป็นตัวสะกดออกเสียง /น/ ฟังจากคำอ่านว่า กาน" }
      - { match: "แม่กญ", feedback: "ไม่มีมาตรานี้ ให้ดูจากเสียงท้ายของพยางค์" }
    hints:
      - "ฟังเสียงท้ายจากคำอ่านของพยางค์แรก คือ กาน"
      - "หามาตราที่ออกเสียงท้ายเหมือน น"
    solution: "พยางค์แรกอ่านว่า กาน ตัวสะกด ญ ออกเสียง /น/ เหมือน น ณ ร ล ฬ จึงอยู่มาตรา **แม่กน**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.cons.p013
    topics: [thai.writing.consonants]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "คำใดมีตัวสะกดอยู่ใน **มาตราแม่กน** (เลือกให้ครบ)"
    choices:
      - { id: a, text: "คุณ", correct: true }
      - { id: b, text: "พร", correct: true }
      - { id: c, text: "ศีล", correct: true }
      - { id: d, text: "ครุฑ", feedback: "ฑ เป็นตัวสะกดออกเสียง /ด/ คำนี้อ่านว่า ครุด จึงอยู่แม่กด" }
      - { id: e, text: "สุข", feedback: "ข เป็นตัวสะกดออกเสียง /ก/ จึงอยู่แม่กก" }
      - { id: f, text: "ลาภ", feedback: "ภ เป็นตัวสะกดออกเสียง /บ/ จึงอยู่แม่กบ" }
    hints:
      - "แม่กน คือตัวสะกดที่ออกเสียง /น/ ไม่จำเป็นต้องเขียนด้วย น"
      - "ตัวสะกดแม่กน ได้แก่ น ญ ณ ร ล ฬ ตรวจตัวสุดท้ายของแต่ละคำ"
    solution: "คุณ (ณ), พร (ร) และ ศีล (ล) ออกเสียงท้าย /น/ จึงอยู่แม่กน ส่วน ครุฑ อยู่แม่กด สุข อยู่แม่กก และ ลาภ อยู่แม่กบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.cons.p014
    topics: [thai.writing.consonants]
    difficulty: 1
    type: mcq
    stem: "พยัญชนะที่ไม่ออกเสียง เช่น ร ในคำว่า การ์ตูน มีเครื่องหมายใดกำกับอยู่ข้างบน"
    choices:
      - { id: a, text: "ไม้ทัณฑฆาต ( ์ )", correct: true, feedback: "ถูก พยัญชนะที่มีไม้ทัณฑฆาตกำกับเรียกว่าตัวการันต์ และไม่ออกเสียง" }
      - { id: b, text: "ไม้ยมก ( ๆ )", feedback: "ไม้ยมกใช้บอกให้อ่านคำหรือวลีซ้ำ เช่น เด็ก ๆ ไม่ได้ทำให้พยัญชนะไม่ออกเสียง" }
      - { id: c, text: "ไม้ไต่คู้ ( ็ )", feedback: "ไม้ไต่คู้ทำให้สระออกเสียงสั้น เช่น เด็ก ไม่เกี่ยวกับการไม่ออกเสียงของพยัญชนะ" }
      - { id: d, text: "ไม้หันอากาศ ( ั )", feedback: "ไม้หันอากาศคือรูปของสระอะเมื่อมีตัวสะกด เช่น กัน" }
    hints:
      - "พยัญชนะที่ไม่ออกเสียงเรียกว่า ตัวการันต์"
      - "ดูคำว่า การ์ตูน จันทร์ ศุกร์ เครื่องหมายบนตัวที่ไม่ออกเสียงเป็นรูปเดียวกัน"
    solution: "ตัวการันต์คือพยัญชนะที่มี **ไม้ทัณฑฆาต** ( ์ ) กำกับ ไม่ต้องออกเสียง เช่น การ์ตูน อ่านว่า กา-ตูน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.cons.p015
    topics: [thai.writing.consonants]
    difficulty: 1
    type: text
    stem: "ครูให้ท่อง ก ไก่ ข ไข่ ... พยัญชนะ **ฆ** มีชื่อเรียกว่า ฆ อะไร (ตอบชื่อที่ตามหลัง ฆ)"
    accepted: ["ระฆัง", "ฆ ระฆัง", "ฆระฆัง"]
    misconceptions:
      - { match: "ควาย", feedback: "ค ควาย เป็นพยัญชนะอีกตัวหนึ่ง สังเกตว่า ฆ มีหยักที่หัวต่างจาก ค" }
      - { match: "คน", feedback: "ฅ คน เป็นพยัญชนะที่เลิกใช้แล้ว ฆ เป็นคนละตัว" }
    hints:
      - "ฆ อยู่ถัดจาก ฅ คน และอยู่ก่อน ง งู"
      - "ชื่อของ ฆ เป็นสิ่งที่ตีให้มีเสียงดังในวัด"
    solution: "ฆ ชื่อว่า **ฆ ระฆัง** เรียงต่อจาก ค ควาย ฅ คน และก่อน ง งู"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.cons.p016
    topics: [thai.writing.consonants]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "คำใดมี **คำควบกล้ำแท้** คือออกเสียงพยัญชนะต้นทั้งสองตัวควบกัน (เลือกให้ครบ)"
    choices:
      - { id: a, text: "ปลา", correct: true }
      - { id: b, text: "กราบ", correct: true }
      - { id: c, text: "ขวาน", correct: true }
      - { id: d, text: "จริง", feedback: "จริง อ่านว่า จิง ไม่ออกเสียง ร จึงเป็นคำควบกล้ำไม่แท้" }
      - { id: e, text: "ทราย", feedback: "ทร ในคำนี้ออกเสียงเป็น ซ (ซาย) จึงเป็นคำควบกล้ำไม่แท้" }
      - { id: f, text: "ตลาด", feedback: "ตลาด อ่านว่า ตะ-หลาด แยกเป็นสองพยางค์ ต กับ ล ไม่ได้ออกเสียงควบกัน" }
    hints:
      - "อ่านออกเสียงช้า ๆ แล้วฟังว่าได้ยินพยัญชนะต้นทั้งสองตัวในพยางค์เดียวหรือไม่"
      - "ควบกล้ำแท้มักเป็น ร ล ว ตามหลัง ก ข ค ต ป พ"
    solution: "ปลา (ป+ล) กราบ (ก+ร) ขวาน (ข+ว) ออกเสียงทั้งสองตัว จึงเป็นควบกล้ำแท้ ส่วน จริง และ ทราย เป็นควบกล้ำไม่แท้ และ ตลาด อ่านแยกเป็น ตะ-หลาด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.cons.p017
    topics: [thai.writing.consonants]
    difficulty: 2
    type: text
    stem: "แจกลูกแล้วประกอบเป็นคำ: พยัญชนะต้น ข + ไม้โท + สระ อา + ตัวสะกด ว ได้คำว่าอะไร (พิมพ์คำ)"
    accepted: ["ข้าว"]
    misconceptions:
      - { match: "ขาว", feedback: "ยังไม่ได้ใส่ไม้โท คำที่ได้ต้องมีไม้โทอยู่บน ข" }
      - { match: "ข่าว", feedback: "นั่นคือไม้เอก โจทย์ให้ใส่ไม้โท ( ้ )" }
    hints:
      - "เขียนพยัญชนะต้นก่อน แล้ววางวรรณยุกต์ไว้บนพยัญชนะต้น"
      - "สระ อา เขียนตามหลังพยัญชนะ และตัวสะกดอยู่ท้ายสุด"
    solution: "ข + ◌้ + า + ว = **ข้าว** (มาตราแม่เกอว)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.cons.p018
    topics: [thai.writing.consonants]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ป้ายร้านในภาพมีพยางค์ใดที่ตัวสะกด **ไม่ตรงมาตรา** คือรูปตัวสะกดไม่ใช่ ก ด บ ง น ม ย ว (เลือกให้ครบ)"
    figure: { src: shop-sign.svg, alt: "ป้ายร้านพื้นสีแดงเข้ม บรรทัดบนเขียนว่า ร้านอาหาร รสเด็ด บรรทัดล่างเขียนว่า บริการด่วน" }
    choices:
      - { id: a, text: "หาร (ในคำว่า อาหาร)", correct: true }
      - { id: b, text: "รส", correct: true }
      - { id: c, text: "การ (ในคำว่า บริการ)", correct: true }
      - { id: d, text: "ร้าน", feedback: "ร้าน สะกดด้วย น ตรงกับแม่กน จึงตรงมาตรา" }
      - { id: e, text: "เด็ด", feedback: "เด็ด สะกดด้วย ด ตรงกับแม่กด จึงตรงมาตรา" }
      - { id: f, text: "ด่วน", feedback: "ด่วน สะกดด้วย น ตรงกับแม่กน จึงตรงมาตรา" }
    hints:
      - "หาตัวสะกดของแต่ละพยางค์ก่อน"
      - "ตัวสะกดตรงมาตรามี 8 ตัว คือ ก ด บ ง น ม ย ว ตัวอื่นที่ทำหน้าที่ตัวสะกดถือว่าไม่ตรงมาตรา"
    solution: "หาร และ การ สะกดด้วย ร (ออกเสียง /น/ แม่กน) และ รส สะกดด้วย ส (ออกเสียง /ด/ แม่กด) จึงไม่ตรงมาตรา ส่วน ร้าน ด่วน (น) และ เด็ด (ด) ตรงมาตรา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.cons.p019
    topics: [thai.writing.consonants]
    difficulty: 3
    type: mcq
    stem: "ปฏิทินเขียนว่า **วันจันทร์** ในคำว่า จันทร์ พยัญชนะใดไม่ออกเสียง"
    choices:
      - { id: a, text: "ท และ ร", correct: true, feedback: "ถูก ทร์ เป็นตัวการันต์ จันทร์ อ่านว่า จัน" }
      - { id: b, text: "ร เท่านั้น", feedback: "ถ้าอ่าน ท ด้วยจะเป็น จันท ซึ่งไม่ใช่เสียงที่ใช้ คำนี้อ่านว่า จัน ไม้ทัณฑฆาตบน ร ทำให้ ทร ไม่ออกเสียงทั้งคู่" }
      - { id: c, text: "น", feedback: "น เป็นตัวสะกดที่ออกเสียง ทำให้คำนี้อยู่แม่กน" }
      - { id: d, text: "จ", feedback: "จ เป็นพยัญชนะต้น ต้องออกเสียงเสมอ" }
    hints:
      - "คำนี้อ่านว่า จัน"
      - "เทียบเสียงที่อ่านกับตัวที่เขียน พยัญชนะใดเหลืออยู่โดยไม่มีเสียง"
    solution: "จันทร์ อ่านว่า จัน: จ เป็นพยัญชนะต้น น เป็นตัวสะกด (แม่กน) ส่วน ทร์ เป็นตัวการันต์ ไม่ออกเสียงทั้ง ท และ ร (คล้ายกับ พระอินทร์ ที่ ทร์ ไม่ออกเสียง)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.cons.p020
    topics: [thai.writing.consonants]
    difficulty: 4
    type: mcq
    stem: "เจ้าหน้าที่พูดผ่านวิทยุสื่อสารว่า **ทราบแล้วเปลี่ยน** คำว่า ทราบ อ่านออกเสียงอย่างไร"
    choices:
      - { id: a, text: "ซาบ", correct: true, feedback: "ถูก ทร เป็นควบกล้ำไม่แท้ที่ออกเสียงเป็น ซ เหมือน ทราย ทรัพย์ แทรก" }
      - { id: b, text: "ทะ-ราบ", feedback: "ทร อยู่ในพยางค์เดียวกัน ไม่ได้แยกเป็นสองพยางค์" }
      - { id: c, text: "ทราบ (ออกเสียง ท และ ร ควบกัน)", feedback: "ทร ในคำไทยแท้ส่วนใหญ่ไม่ออกเสียงควบแบบ กร หรือ ปร แต่เปลี่ยนเป็นเสียง ซ" }
      - { id: d, text: "ทาบ", feedback: "ควบกล้ำไม่แท้ส่วนใหญ่อ่านแค่ตัวหน้า แต่ ทร เป็นกรณีพิเศษที่เปลี่ยนเป็นเสียง ซ" }
    hints:
      - "นึกถึงคำว่า ทราย ซึ่งมี ทร เหมือนกัน"
      - "ทร เป็นควบกล้ำไม่แท้ที่เปลี่ยนเสียงทั้งคู่เป็นเสียงเดียว"
    solution: "ทร เป็นคำควบกล้ำไม่แท้ ออกเสียงเป็น ซ ทราบ จึงอ่านว่า **ซาบ** ตัวสะกด บ อยู่แม่กบ"
