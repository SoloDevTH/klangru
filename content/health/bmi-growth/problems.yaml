  - id: hlt.bmi.p020
    topics: [health.body.bmi-growth]
    difficulty: 5
    type: expression
    stem: "ถ้าน้ำหนักเป็น $w$ กิโลกรัม และส่วนสูงเป็น $h$ **เซนติเมตร** เขียนสูตร BMI (หน่วย kg/m²) ในรูปของ $w$ และ $h$"
    prefix: "\\text{BMI} ="
    answer: { latex: "\\frac{10000w}{h^2}", variables: [w, h] }
    hints:
      - "เปลี่ยน $h$ เซนติเมตรเป็นเมตรก่อน: $\\frac{h}{100}$ เมตร"
      - "แทนในสูตร $\\frac{w}{(\\text{ส่วนสูงเป็นเมตร})^2}$ แล้วจัดรูป"
    misconceptions:
      - { match: "\\frac{w}{h^2}", feedback: "ยังไม่ได้เปลี่ยนเซนติเมตรเป็นเมตร ค่าที่ได้จะเล็กกว่าจริง 10,000 เท่า" }
      - { match: "\\frac{100w}{h^2}", feedback: "เปลี่ยนหน่วยแล้ว แต่ต้องยกกำลังสองตัวแปลงหน่วยด้วย $(100)^2 = 10{,}000$" }
    solution: "ส่วนสูงเป็นเมตรคือ $\\frac{h}{100}$ ดังนั้น $\\text{BMI} = \\dfrac{w}{\\left(\\frac{h}{100}\\right)^2} = \\dfrac{10000w}{h^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.bmi.p021
    topics: [health.body.bmi-growth]
    difficulty: 5
    type: numeric
    stem: "ผู้ใหญ่คนหนึ่งหนัก 64 กิโลกรัม และมี BMI เท่ากับ 25 kg/m² พอดี สูงกี่เมตร (ตอบเป็นตัวเลขในหน่วย m ทศนิยม 2 ตำแหน่ง)"
