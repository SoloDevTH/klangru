<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" font-family="sans-serif" font-size="14">
  <title>การทำงานของ fact(4) ขาลงเรียกตัวเองจนถึงกรณีฐาน fact(0) คืน 1 ขาขึ้นคูณค่ากลับได้ 1 1 2 6 และ 24</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="860" height="360" fill="#ffffff"/>
  <rect x="30.0" y="20.0" width="200.0" height="48.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="130.0" y="50.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" font-family="monospace" xml:space="preserve">fact(4)</text>
  <rect x="360.0" y="20.0" width="220.0" height="48.0" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="470.0" y="50.0" font-size="15" text-anchor="middle" fill="#1f2937" xml:space="preserve">4 × 6 = 24</text>
  <line x1="90.0" y1="68.0" x2="130.0" y2="84.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M480,84 L440,68" stroke="#c2410c" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <line x1="232.0" y1="44.0" x2="358.0" y2="44.0" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="90.0" y="84.0" width="200.0" height="48.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="190.0" y="114.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" font-family="monospace" xml:space="preserve">fact(3)</text>
  <rect x="420.0" y="84.0" width="220.0" height="48.0" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="530.0" y="114.0" font-size="15" text-anchor="middle" fill="#1f2937" xml:space="preserve">3 × 2 = 6</text>
  <line x1="150.0" y1="132.0" x2="190.0" y2="148.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M540,148 L500,132" stroke="#c2410c" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <line x1="292.0" y1="108.0" x2="418.0" y2="108.0" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="150.0" y="148.0" width="200.0" height="48.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="250.0" y="178.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" font-family="monospace" xml:space="preserve">fact(2)</text>
  <rect x="480.0" y="148.0" width="220.0" height="48.0" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="590.0" y="178.0" font-size="15" text-anchor="middle" fill="#1f2937" xml:space="preserve">2 × 1 = 2</text>
  <line x1="210.0" y1="196.0" x2="250.0" y2="212.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M600,212 L560,196" stroke="#c2410c" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <line x1="352.0" y1="172.0" x2="478.0" y2="172.0" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="210.0" y="212.0" width="200.0" height="48.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="310.0" y="242.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" font-family="monospace" xml:space="preserve">fact(1)</text>
  <rect x="540.0" y="212.0" width="220.0" height="48.0" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="650.0" y="242.0" font-size="15" text-anchor="middle" fill="#1f2937" xml:space="preserve">1 × 1 = 1</text>
  <line x1="270.0" y1="260.0" x2="310.0" y2="276.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M660,276 L620,260" stroke="#c2410c" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <line x1="412.0" y1="236.0" x2="538.0" y2="236.0" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="270.0" y="276.0" width="200.0" height="48.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="370.0" y="306.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" font-family="monospace" xml:space="preserve">fact(0)</text>
  <rect x="600.0" y="276.0" width="220.0" height="48.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="710.0" y="306.0" font-size="15" text-anchor="middle" fill="#1f2937" xml:space="preserve">กรณีฐาน คืน 1</text>
  <line x1="472.0" y1="300.0" x2="598.0" y2="300.0" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="150.0" y="350.0" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold" xml:space="preserve">ขาลง: เรียกตัวเองกับค่าที่เล็กลง</text>
  <text x="600.0" y="350.0" font-size="13" text-anchor="middle" fill="#c2410c" font-weight="bold" xml:space="preserve">ขาขึ้น: คืนค่าและคูณย้อนกลับ</text>
</svg>
