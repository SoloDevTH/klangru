  choices:
  - id: a
    text: ตะโกนเรียกผู้ใหญ่ โทร 1669 ถ้ายังหายใจให้จัดท่านอนตะแคง และอยู่ด้วยจนเจ้าหน้าที่มาถึง
    correct: true
  - id: b
    text: ปล่อยไว้เพราะเดี๋ยวก็ฟื้นเอง
    feedback: สารระเหยทำให้หัวใจเต้นผิดจังหวะและหยุดหายใจได้ ต้องได้รับความช่วยเหลือทันที
  - id: c
    text: ถ่ายคลิปลงโซเชียลเพื่อเตือนคนอื่น
    feedback: การถ่ายคลิปไม่ช่วยชีวิตและละเมิดความเป็นส่วนตัว ต้องเรียกความช่วยเหลือก่อน
  hints:
  - หมดสติและหายใจแผ่วเป็นเหตุฉุกเฉิน
  - ท่านอนตะแคงช่วยไม่ให้สำลัก
  solution: เป็นเหตุฉุกเฉินที่อาจถึงชีวิต ต้องเรียกผู้ใหญ่ โทร 1669 จัดท่านอนตะแคงถ้ายังหายใจ และเฝ้าดูจนความช่วยเหลือมาถึง ทำตามคำแนะนำของเจ้าหน้าที่
