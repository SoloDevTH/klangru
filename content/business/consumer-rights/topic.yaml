id: business.econ.consumer-rights
subject: business
title: { th: "ผู้บริโภคที่รู้เท่าทันและสิทธิผู้บริโภค", en: "Smart consumers and consumer rights" }
summary: "ปัจจัยที่มีผลต่อการเลือกซื้อ ผู้บริโภคที่รู้เท่าทัน ค่านิยมการบริโภค สิทธิผู้บริโภค 5 ประการตามกฎหมายไทย การร้องเรียน และความรับผิดชอบของผู้ขาย"
difficulty: 2.5
minutes: 30
prerequisites: [business.econ.personal-budget]
encompasses:
  - { id: business.econ.personal-budget, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: five-rights.svg
    alt: "แผนภาพห้ากล่องเรียงกัน สิทธิของผู้บริโภค 5 ประการตาม พ.ร.บ.คุ้มครองผู้บริโภค พ.ศ. 2522 คือ 1 ได้รับข่าวสาร (ฉลากและโฆษณาบอกความจริงครบถ้วน) 2 เลือกซื้ออย่างอิสระ (สมัครใจ ไม่ถูกบังคับหรือชักจูงไม่เป็นธรรม) 3 ได้รับความปลอดภัย (สินค้าได้มาตรฐาน ใช้แล้วไม่เป็นอันตราย) 4 เป็นธรรมในสัญญา 5 ได้รับการชดเชยเมื่อถูกละเมิดสิทธิข้อ 1 ถึง 4 กล่องด้านล่างบอกว่าเมื่อถูกละเมิดสิทธิให้เก็บหลักฐาน ติดต่อผู้ขาย แล้วร้องเรียน สคบ. สายด่วน 1166 อาหาร ยา เครื่องสำอางร้องเรียน อย. บริการการเงินร้องเรียน ธปท. 1213"
    caption: "สิทธิทั้งห้าข้อ และช่องทางเมื่อถูกละเมิดสิทธิ"
  - { type: check, problem: business.econ.consumer-rights.p003, prompt: "ลองจับคู่ก่อนอ่านต่อ" }
  - type: worked-example
    title: "ซื้อนมแบบไหนคุ้มกว่า"
    problem: "ร้านสะดวกซื้อขายนมยี่ห้อเดียวกันสองแบบ แบบ ก กล่อง $225$ มล. แพ็ก 4 กล่อง ราคา $52$ บาท แบบ ข ขวด $830$ มล. ราคา $45$ บาท ลด $5$ บาท แบบใดถูกกว่าต่อ $100$ มล. และถูกกว่ากี่บาท"
    steps:
      - { text: "แบบ ก: ปริมาณรวม $4 \\times 225 = 900$ มล. ราคาต่อ $100$ มล. $= 52 \\div 9 \\approx 5.78$ บาท", why: "ต้องรวมปริมาณทั้งแพ็กก่อน เพราะราคา $52$ บาทเป็นราคาทั้งแพ็ก" }
      - { text: "แบบ ข: ราคาหลังลด $45 - 5 = 40$ บาท ราคาต่อ $100$ มล. $= 40 \\div 8.3 \\approx 4.82$ บาท" }
      - { text: "เทียบ: $5.78 - 4.82 \\approx 0.96$ บาท แบบ ข ถูกกว่าต่อ $100$ มล." }
      - { text: "คิดต่อว่าดื่มหมดก่อนเสียหรือไม่ ขวดใหญ่เปิดแล้วต้องแช่เย็นและดื่มให้หมดเร็ว ถ้าดื่มไม่ทัน ของถูกต่อหน่วยก็ไม่คุ้ม", why: "ผู้บริโภคที่รู้เท่าทันดูทั้งราคาต่อหน่วยและความจำเป็นในการใช้" }
    answer: "แบบ ข ถูกกว่าประมาณ $0.96$ บาทต่อ $100$ มล. ถ้าดื่มหมดทัน"
  - type: worked-example
    title: "พาวเวอร์แบงก์ร้อนผิดปกติ"
    problem: "เจซื้อพาวเวอร์แบงก์ (สมมติ) จากร้านออนไลน์ ร้านโฆษณาว่ามีเครื่องหมาย มอก. แต่ของที่ได้ไม่มีเครื่องหมาย และร้อนจัดตอนชาร์จทั้งที่ใช้ตามคู่มือ เจควรทำอย่างไร"
    steps:
      - { text: "ระบุสิทธิที่ถูกละเมิด: โฆษณาไม่ตรงความจริง (สิทธิได้รับข่าวสาร) และสินค้าอาจไม่ปลอดภัย (สิทธิได้รับความปลอดภัย)" }
      - { text: "หยุดใช้ทันที แล้วเก็บหลักฐาน: ภาพหน้าจอโฆษณา สลิปโอนเงิน แชตกับร้าน รูปสินค้าที่ไม่มีเครื่องหมาย", why: "หลักฐานทำให้ร้านและหน่วยงานตรวจสอบได้ว่าเกิดอะไรขึ้น" }
      - { text: "แจ้งร้านพร้อมหลักฐาน ขอคืนเงินหรือเปลี่ยนเป็นสินค้าที่ได้มาตรฐาน" }
      - { text: "ถ้าร้านไม่ตอบหรือไม่แก้ไข ร้องเรียน สคบ. ทางสายด่วน 1166 หรือช่องทางออนไลน์ พร้อมแนบหลักฐาน แล้วติดตามผล", why: "สิทธิได้รับการพิจารณาและชดเชยความเสียหายใช้ได้เมื่อสิทธิข้ออื่นถูกละเมิด" }
    answer: "หยุดใช้ เก็บหลักฐาน แจ้งร้าน และร้องเรียน สคบ. ถ้าร้านไม่แก้ไข"
  - { type: check, problem: business.econ.consumer-rights.p006, prompt: "โปรแถมทำให้ราคาต่อชิ้นเหลือเท่าไร" }
glossary:
  - { term: "ผู้บริโภค", definition: "ผู้ซื้อหรือผู้ได้รับบริการจากผู้ประกอบธุรกิจ รวมถึงผู้ที่ใช้สินค้าหรือบริการนั้น" }
  - { term: "ผู้บริโภคที่รู้เท่าทัน", definition: "ผู้ที่ซื้ออย่างมีเหตุผล หาข้อมูล เทียบราคาและคุณภาพ ไม่หลงโฆษณา และรู้สิทธิของตน" }
  - { term: "ราคาต่อหน่วย", definition: "ราคา ÷ ปริมาณ ใช้เทียบความคุ้มค่าของสินค้าที่ขนาดต่างกัน" }
  - { term: "ค่านิยมการบริโภค", definition: "ความเชื่อของคนในสังคมว่าการซื้อหรือใช้แบบใดดีหรือน่ามี ซึ่งส่งผลต่อพฤติกรรมการซื้อ" }
  - { term: "สคบ.", definition: "สำนักงานคณะกรรมการคุ้มครองผู้บริโภค หน่วยงานที่รับเรื่องร้องทุกข์และดูแลการคุ้มครองผู้บริโภค สายด่วน 1166" }
  - { term: "เลขสารบบอาหาร", definition: "เลข 13 หลักในกรอบเครื่องหมาย อย. บนฉลากอาหาร แสดงว่าอาหารนั้นผ่านการอนุญาตหรือจดแจ้ง" }
flashcards:
  - { front: "สิทธิผู้บริโภค 5 ประการ", back: "ได้รับข่าวสาร · เลือกอย่างอิสระ · ได้รับความปลอดภัย · เป็นธรรมในสัญญา · ได้รับการพิจารณาและชดเชยความเสียหาย" }
  - { front: "ร้องเรียนเรื่องสินค้าและบริการทั่วไป", back: "สคบ. สายด่วน 1166 หรือร้องทุกข์ออนไลน์ (บริการทางการเงิน: ธปท. 1213 · อาหาร ยา เครื่องสำอาง: อย.)" }
  - { front: "ลด 30% แล้วลดอีก 10% เท่ากับลดกี่ %", back: "0.7 × 0.9 = 0.63 จ่าย 63% จึงเท่ากับลด 37% ไม่ใช่ 40%" }
  - { front: "หน้าที่ของผู้บริโภคหลังซื้อ", back: "เก็บหลักฐาน (ใบเสร็จ สัญญา โฆษณา สินค้า) และร้องเรียนเมื่อถูกละเมิดสิทธิ" }
