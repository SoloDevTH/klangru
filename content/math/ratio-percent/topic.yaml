id: math.number.ratio-percent
subject: math
title: { th: อัตราส่วนและร้อยละ, en: Ratio and percentage }
summary: ใช้อัตราส่วนและสัดส่วนเปรียบเทียบปริมาณ คิดร้อยละ ส่วนลด กำไรขาดทุน และดอกเบี้ยอย่างง่ายจากสถานการณ์ในชีวิตประจำวัน
difficulty: 2.5
minutes: 40
prerequisites: [math.number.fractions, math.number.decimals]
encompasses:
  - { id: math.number.fractions, weight: 0.3 }
  - { id: math.number.decimals, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: proportional-graphs.svg
    alt: "กราฟราคา (บาท) กับน้ำหนัก (กิโลกรัม) สองเส้น เส้นทึบสีน้ำเงินของผลไม้ y = 30x เริ่มที่จุดกำเนิดผ่าน (1, 30) ถึง (5, 150) เส้นประสีส้มของค่าส่ง y = 40 + 20x เริ่มที่ (0, 40) สองเส้นตัดกันที่ (4, 120)"
    caption: "ทั้งสองเป็นเส้นตรง แต่เฉพาะเส้นที่ผ่าน $(0, 0)$ เท่านั้นที่เป็นความสัมพันธ์แบบสัดส่วน"
  - type: worked-example
    title: ตรวจว่าเป็นสัดส่วนหรือไม่ แล้วหาค่าคงตัว
    problem: "ร้านผลไม้ขายส้ม 2 kg ราคา 90 บาท 3 kg ราคา 135 บาท 5 kg ราคา 225 บาท ส่วนบริการส่งของคิด 1 kg 60 บาท 2 kg 80 บาท 3 kg 100 บาท ราคาใดเป็นสัดส่วนกับน้ำหนัก และส้ม 7 kg ราคาเท่าใด"
    steps:
      - text: "ส้ม: $\\tfrac{90}{2} = 45$, $\\tfrac{135}{3} = 45$, $\\tfrac{225}{5} = 45$ ได้ค่าเท่ากันทุกคู่"
        why: "ความสัมพันธ์แบบสัดส่วนต้องมี $\\tfrac{y}{x}$ คงที่"
      - text: "ค่าส่ง: $\\tfrac{60}{1} = 60$ แต่ $\\tfrac{80}{2} = 40$ ไม่เท่ากัน จึงไม่เป็นสัดส่วน"
        why: "ค่าส่งเพิ่มทีละ 20 บาทต่อกิโลกรัม แต่มีค่าเริ่มต้น 40 บาท กราฟจึงไม่ผ่านจุดกำเนิด"
      - text: "ราคาส้มเขียนเป็น $y = 45x$ ค่าคงตัว $k = 45$ บาทต่อกิโลกรัม"
      - text: "ส้ม 7 kg: $y = 45 \\times 7 = 315$ บาท"
    answer: "ราคาส้มเป็นสัดส่วน ($y = 45x$) ค่าส่งไม่เป็นสัดส่วน ส้ม 7 kg ราคา 315 บาท"
  - { type: check, problem: math.rp.p002, prompt: "อัตราส่วนที่เท่ากันได้จากการคูณ ไม่ใช่การบวก" }
  - type: worked-example
    title: ลดราคาแล้วบวก VAT ด้วยตัวคูณ
    problem: "โทรทัศน์ราคาก่อนภาษี 12,000 บาท ร้านลดราคา 15% แล้วคิดภาษีมูลค่าเพิ่ม 7% ลูกค้าต้องจ่ายเท่าไร ถ้าคิด VAT ก่อนแล้วค่อยลด 15% จะต่างกันไหม"
    steps:
      - text: "ลด 15% คือคูณด้วย $1 - 0.15 = 0.85$ และบวก VAT 7% คือคูณด้วย $1.07$"
        why: "เหลือ 85% ของราคาเดิม และจ่ายเพิ่มอีก 7% ของราคาหลังลด"
      - text: "จ่าย $12{,}000 \\times 0.85 \\times 1.07 = 10{,}200 \\times 1.07 = 10{,}914$ บาท"
      - text: "ถ้าสลับลำดับ: $12{,}000 \\times 1.07 \\times 0.85 = 12{,}840 \\times 0.85 = 10{,}914$ บาท เท่ากัน"
        why: "การคูณสลับที่ได้ ลำดับของการเพิ่มและลดร้อยละจึงไม่มีผล"
      - text: "เทียบกับการบวกลบร้อยละตรง ๆ ($-15\\% + 7\\% = -8\\%$) ได้ $12{,}000 \\times 0.92 = 11{,}040$ บาท ซึ่งผิด"
        why: "7% คิดจากราคาหลังลด ไม่ใช่จากราคาเดิม"
    answer: "จ่าย 10,914 บาท ทั้งสองลำดับให้ผลเท่ากัน"
  - { type: check, problem: math.rp.p004, prompt: "ลองใช้ทางลัดตัวคูณ" }
  - type: interactive
    title: ราคาเดิมกับราคาหลังลด
    caption: แกนนอนคือราคาเดิม (บาท) เส้นแรกคือราคาเดิม เส้นที่สองคือราคาหลังลด p% ลองเลื่อน p แล้วสังเกตว่าเส้นราคาหลังลดยังผ่านจุด (0, 0) และเป็นเส้นตรงเสมอ แปลว่าราคาหลังลดเป็นสัดส่วนกับราคาเดิม
    widget:
      kind: function-plot
      functions: ["x", "(1-\\frac{p}{100})x"]
      sliders:
        - { name: p, min: 0, max: 90, step: 5, value: 20, label: ส่วนลด (%) }
      x: [0, 1000]
      y: [0, 1000]
  - type: simulation
    title: สนามเด็กเล่นสัดส่วน (PhET Proportion Playground)
    url: https://phet.colorado.edu/en/simulations/proportion-playground
    provider: phet
    note: ผสมสีด้วยจำนวนหยดสีฟ้าและสีเหลืองในอัตราส่วน 1 ต่อ 2 แล้วลอง 2 ต่อ 4 สีที่ได้จะเหมือนกัน เพราะเป็นอัตราส่วนที่เท่ากัน
glossary:
  - { term: อัตราส่วน, definition: "การเปรียบเทียบปริมาณสองปริมาณ เขียนเป็น a : b หรือ a/b เช่น น้ำแดงต่อน้ำเปล่าเป็น 1 : 4" }
  - { term: สัดส่วน, definition: "ประโยคที่บอกว่าอัตราส่วนสองอัตราส่วนเท่ากัน เช่น 1 : 4 = 3 : 12" }
  - { term: ร้อยละ, definition: "อัตราส่วนที่เทียบกับ 100 เช่น ร้อยละ 25 หรือ 25% หมายถึง 25 ใน 100" }
  - { term: ทุน, definition: "ราคาที่ผู้ขายซื้อสินค้ามา กำไรและขาดทุนร้อยละคิดเทียบกับทุนเสมอ" }
  - { term: ดอกเบี้ยอย่างง่าย, definition: "ดอกเบี้ยที่คิดจากเงินต้นเท่าเดิมทุกปี เท่ากับ เงินต้น × อัตราดอกเบี้ยต่อปี × จำนวนปี" }
flashcards:
  - { front: "หา 25% ของ 80", back: "$\\tfrac{25}{100} \\times 80 = 20$" }
  - { front: "กำไรร้อยละคิดเทียบกับอะไร", back: "เทียบกับทุนเสมอ: กำไรร้อยละ $= \\dfrac{\\text{กำไร}}{\\text{ทุน}} \\times 100$" }
  - { front: "ลด 20% แล้วลดอีก 10% เท่ากับลดทั้งหมดกี่ %", back: "28% ไม่ใช่ 30% เพราะราคาเหลือ $0.8 \\times 0.9 = 0.72$ ของราคาเดิม" }
  - { front: "สูตรดอกเบี้ยอย่างง่าย", back: "$I = Prt$ เมื่อ $P$ คือเงินต้น $r$ คืออัตราดอกเบี้ยต่อปี (เป็นทศนิยม) และ $t$ คือจำนวนปี" }
