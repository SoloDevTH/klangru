      - { match: 0, feedback: "สารไม่ได้ผสมกันพอดี ต้องหาว่าสารใดหมดก่อน" }
      - { match: 11, feedback: "คิดว่า $\\mathrm{H_2}$ มวลน้อยกว่าจึงหมดก่อน แต่ $\\mathrm{H_2}$ 5.00 g มีถึง 2.48 mol" }
    hints:
      - "เปลี่ยนเป็นโมลแล้วหารด้วยสัมประสิทธิ์ เพื่อหาสารกำหนดปริมาณ"
      - "หามวลของสารที่มากเกินพอซึ่งถูกใช้ไป แล้วนำไปลบจากมวลเริ่มต้น"
    solution: "$\\mathrm{H_2}$ $= 5.00 / 2.016 = 2.48$ mol (÷2 = 1.24) · $\\mathrm{O_2}$ $= 16.0 / 32.00 = 0.500$ mol (÷1 = 0.500) $\\mathrm{O_2}$ หมดก่อน ใช้ $\\mathrm{H_2}$ $2 \\times 0.500 = 1.00$ mol $= 2.016$ g เหลือ $\\mathrm{H_2}$ $5.00 - 2.016 =$ **2.98 g**"
