      - "เทียบจำนวนของเสียกับเลขยอมรับ"
      - "ล็อตที่ผ่านติดป้าย \"ผ่าน\" เข้าคลัง ล็อตที่ไม่ผ่านกักกันและแจ้งผู้ขาย"
