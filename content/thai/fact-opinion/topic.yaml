id: thai.reading.fact-opinion
subject: thai
title: { th: ข้อเท็จจริง ข้อคิดเห็น และเหตุกับผล, en: "Fact, opinion, and cause and effect" }
summary: แยกข้อเท็จจริงกับข้อคิดเห็นรวมถึงกรณีที่ปนกัน ประเมินข้อมูลสนับสนุน หาเหตุและผลจากคำเชื่อมและลูกโซ่เหตุผล วิเคราะห์และแสดงความคิดเห็นต่อบทความ แล้วนำไปใช้แก้ปัญหา
difficulty: 4
minutes: 30
prerequisites: [thai.reading.comprehension]
encompasses:
  - { id: thai.reading.comprehension, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: opinion-signals.svg
    alt: "ตารางสองช่อง ข้อเท็จจริง ตรวจสอบได้ ได้แก่ ตัวเลข วันที่ สถานที่ ผลการวัด ผลสำรวจ เหตุการณ์ที่เกิดขึ้นแล้ว ถามว่าตรวจได้ไหมว่าจริง ข้อคิดเห็น เป็นความเชื่อ ความรู้สึก การประเมิน คำบ่งชี้ ได้แก่ ควร น่าจะ คงจะ อาจ คิดว่า เชื่อว่า เห็นว่า ดีที่สุด สวย อร่อย แย่ การคาดการณ์อนาคต และข้อเสนอแนะ"
    caption: "ข้อเท็จจริงตรวจสอบได้ ข้อคิดเห็นมักมีคำบ่งชี้"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: cause-chain.svg
    alt: "ลูกโซ่เหตุและผล 4 กล่องเรียงจากซ้ายไปขวา ฝนตกหนัก เป็นเหตุ ไปสู่ น้ำท่วมถนน เป็นผลและเป็นเหตุต่อไป ไปสู่ รถติดยาว เป็นผลและเป็นเหตุต่อไป ไปสู่ นักเรียนมาสาย เป็นผล ด้านล่างเขียนคำเชื่อมที่พบบ่อย เพราะ เนื่องจาก จึง ดังนั้น ทำให้ ส่งผลให้"
    caption: "ผลของข้อหนึ่งอาจเป็นเหตุของข้อถัดไป"
  - type: worked-example
    title: แยกข้อเท็จจริงกับข้อคิดเห็นในประโยคเดียว
    problem: "แยกประโยคโฆษณา \"นมยี่ห้อนี้อร่อยที่สุด มีแคลเซียม 250 มิลลิกรัมต่อกล่อง เด็กทุกคนควรดื่มทุกวัน\" (สินค้าสมมุติ)"
    steps:
      - text: "แบ่งเป็นส่วน: (ก) อร่อยที่สุด (ข) มีแคลเซียม 250 มิลลิกรัมต่อกล่อง (ค) เด็กทุกคนควรดื่มทุกวัน"
        why: "ประโยคเดียวอาจมีทั้งสองแบบ ต้องแยกก่อน"
      - text: "(ก) อร่อยที่สุด เป็นการประเมิน → ข้อคิดเห็น"
      - text: "(ข) ตรวจได้จากฉลากหรือการวิเคราะห์ → ข้อเท็จจริง"
      - text: "(ค) มีคำว่า ควร เป็นข้อเสนอแนะ → ข้อคิดเห็น"
    answer: "ข้อเท็จจริง: มีแคลเซียม 250 มิลลิกรัมต่อกล่อง · ข้อคิดเห็น: อร่อยที่สุด และ เด็กทุกคนควรดื่มทุกวัน"
  - { type: check, problem: thai.reading.fact-opinion.p003, prompt: "หาคำว่า คิดว่า และ ดีที่สุด" }
  - type: worked-example
    title: หาเหตุและผล และตรวจว่าสมเหตุสมผล
    problem: "\"ปีนี้หมู่บ้านปลูกต้นไม้ริมคลองหลายร้อยต้น ตลิ่งจึงพังน้อยลง\" หาเหตุ ผล และบอกว่าการให้เหตุผลนี้ฟังขึ้นหรือไม่"
    steps:
      - text: "หาคำเชื่อม: จึง อยู่หน้าผล"
      - text: "เหตุ: ปลูกต้นไม้ริมคลองหลายร้อยต้น · ผล: ตลิ่งพังน้อยลง"
      - text: "ตรวจความเชื่อมโยง: รากต้นไม้ช่วยยึดดิน จึงมีเหตุผลรองรับ ไม่ใช่แค่เกิดก่อนหลัง"
        why: "เหตุและผลที่ดีต้องอธิบายได้ว่าเหตุทำให้เกิดผลอย่างไร"
      - text: "ข้อสังเกต: ถ้าปีนี้ฝนน้อยกว่าปกติ ตลิ่งอาจพังน้อยเพราะฝนด้วย ควรหาข้อมูลเพิ่ม"
    answer: "เหตุ: ปลูกต้นไม้ริมคลอง ผล: ตลิ่งพังน้อยลง ฟังขึ้นเพราะรากช่วยยึดดิน แต่ควรตรวจเหตุอื่น เช่น ปริมาณฝน"
  - { type: check, problem: thai.reading.fact-opinion.p004, prompt: "เพราะ อยู่หน้าเหตุ" }
glossary:
  - { term: ข้อเท็จจริง, definition: "ข้อความที่ตรวจสอบได้ว่าจริงหรือไม่ เช่น ตัวเลข ผลการวัด เหตุการณ์ที่เกิดแล้ว" }
  - { term: ข้อคิดเห็น, definition: "ความเชื่อ ความรู้สึก การประเมิน การคาดการณ์ หรือข้อเสนอแนะ ซึ่งผู้อื่นเห็นต่างได้" }
  - { term: ข้อมูลสนับสนุน, definition: "ข้อเท็จจริง ตัวเลข ตัวอย่าง หรือคำของผู้เชี่ยวชาญที่ใช้หนุนความเห็น" }
  - { term: เหตุ, definition: "สิ่งที่ทำให้เกิดผล มักอยู่หลังคำว่า เพราะ เนื่องจาก" }
  - { term: ผล, definition: "สิ่งที่เกิดจากเหตุ มักอยู่หลังคำว่า จึง ดังนั้น ทำให้" }
flashcards:
  - { front: "ข้อเท็จจริงทดสอบอย่างไร", back: "ถามว่าตรวจสอบได้ไหมว่าจริงหรือไม่" }
  - { front: "คำบ่งชี้ข้อคิดเห็น", back: "คิดว่า ควร น่าจะ คงจะ ดีที่สุด สวย อร่อย" }
  - { front: "ข้อมูลสนับสนุนที่ดี", back: "เกี่ยวข้อง เพียงพอ และมาจากแหล่งที่เชื่อถือได้" }
  - { front: "เกิดก่อน = เป็นเหตุ?", back: "ไม่เสมอไป ต้องอธิบายได้ว่าเหตุทำให้เกิดผลอย่างไร" }
