    figure:
      src: statements.svg
      alt: "งบการเงินของบริษัท ข้าวทองแปรรูป จำกัด (สมมติ) หน่วยพันบาท งบแสดงฐานะการเงิน ณ 31 ธ.ค. ปี 2568 และ 2567 ตามลำดับ: เงินสด 300 และ 250 ลูกหนี้การค้า 900 และ 700 สินค้าคงเหลือ 1,200 และ 1,000 รวมสินทรัพย์หมุนเวียน 2,400 และ 1,950 ที่ดิน อาคาร อุปกรณ์สุทธิ 3,600 และ 3,550 รวมสินทรัพย์ 6,000 และ 5,500 เจ้าหนี้การค้า 800 และ 650 เงินกู้ระยะสั้น 400 และ 350 รวมหนี้สินหมุนเวียน 1,200 และ 1,000 เงินกู้ระยะยาว 1,800 และ 1,900 รวมหนี้สิน 3,000 และ 2,900 ส่วนของผู้ถือหุ้น 3,000 และ 2,600 รวมหนี้สินและส่วนของผู้ถือหุ้น 6,000 และ 5,500 งบกำไรขาดทุนปี 2568 และ 2567: ขาย 9,000 และ 8,000 ต้นทุนขาย 6,300 และ 5,440 กำไรขั้นต้น 2,700 และ 2,560 ค่าใช้จ่ายในการขายและบริหาร 1,500 และ 1,400 กำไรก่อนดอกเบี้ยและภาษี 1,200 และ 1,160 ดอกเบี้ยจ่าย 150 และ 160 กำไรก่อนภาษี 1,050 และ 1,000 ภาษีเงินได้ 210 และ 200 กำไรสุทธิ 840 และ 800 ข้อมูลเพิ่มเติมปี 2568: ค่าเสื่อมราคาทั้งปี 300 พันบาท ค่าเฉลี่ยอุตสาหกรรม (สมมติ) อัตราส่วนทุนหมุนเวียน 1.5 เท่า อัตรากำไรสุทธิ 7% หนี้สินต่อสินทรัพย์รวม 60%"
    answer: { value: 54.1, tolerance: 0.2, unit: "วัน" }
    hints:
      - "เจ้าหนี้การค้าเฉลี่ย $= \\dfrac{800 + 650}{2} = 725$"
      - "ระยะชำระหนี้ $= 365 \\times 725 \\div 6{,}300$ วงจรเงินสด $=$ ขายสินค้า $+$ เก็บหนี้ $-$ ชำระหนี้"
    misconceptions:
      - { match: 96.1, feedback: "ยังไม่ได้หักระยะเวลาชำระหนี้ เจ้าหนี้ให้เครดิตช่วยลดวงจรเงินสด" }
      - { match: 138.1, feedback: "บวกระยะชำระหนี้ ต้องหักออก" }
    solution: "ระยะชำระหนี้ $= 365 \\times 725 \\div 6{,}300 \\approx 42.0$ วัน วงจรเงินสด $= 63.7 + 32.4 - 42.0 \\approx 54.1$ วัน เงินของบริษัทจมอยู่ในสินค้าและลูกหนี้ประมาณ $54$ วันก่อนกลับมาเป็นเงินสด ต้องมีเงินทุนหมุนเวียนรองรับช่วงนี้"
