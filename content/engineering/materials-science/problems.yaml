      - { id: d, text: "กำมะถันทำให้ยางนำไฟฟ้าได้", feedback: "การวัลคาไนซ์ไม่ได้ทำให้ยางนำไฟฟ้า สมบัติที่เปลี่ยนคือความยืดหยุ่นและความทนความร้อน" }
