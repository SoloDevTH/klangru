topic: engineering.environmental.noise-control
rows:
  - { framework: th-coe-engineering-basics, indicators: ["ENV-3.8"], coverage: partial, note: "สอนหน่วย dB การถ่วงน้ำหนัก dB(A) การรวมระดับเสียงจากหลายแหล่ง การลดระดับตามระยะของแหล่งจุดและแหล่งเส้นในพื้นที่โล่ง ระดับเสียงเทียบเท่า Leq ระดับเสียงกลางวัน–กลางคืน Ldn (แนวคิดและสูตร) ผลต่อสุขภาพในภาพรวม และลำดับการควบคุมที่แหล่ง ทางผ่าน และผู้รับ ยังไม่สอนการคำนวณประสิทธิภาพกำแพงกั้นและวัสดุดูดซับเชิงปริมาณ การควบคุมเสียงในอาคารและการสั่นสะเทือน และยังไม่สอนมาตรฐานระดับเสียงทั่วไปและเสียงในที่ทำงานของไทยหรือเวลาสัมผัสที่ยอมรับได้ (ต้องตรวจก่อนเผยแพร่) ขอบเขตในแผนจึงสอนได้เพียงบางส่วน" }
