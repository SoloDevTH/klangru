    misconceptions:
      - { match: 392, feedback: "นั่นคือแรงเสียดทานสถิตสูงสุดทั้งหมด ทั้งสองคนผลักอยู่แล้ว $300\\ \\mathrm{N}$ ต้องหักออก" }
      - { match: 242, feedback: "ดูเหมือนนับแรงผลักของคนเดียว ทั้งสองคนผลักทางเดียวกัน แรงรวมคือ $300\\ \\mathrm{N}$" }
    solution: "$\\mu_s mg = 0.5 \\times 80 \\times 9.8 = 392\\ \\mathrm{N}$ ผลักอยู่ $300\\ \\mathrm{N}$ ต้องเพิ่มอีกอย่างน้อย $392 - 300 = 92\\ \\mathrm{N}$"
