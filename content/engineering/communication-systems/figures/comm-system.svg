<svg xmlns="http://www.w3.org/2000/svg" width="700" height="230" viewBox="0 0 700 230" font-family="sans-serif"><title>แผนผังระบบสื่อสารจากแหล่งข่าวสาร ตัวส่ง ช่องสัญญาณ ถึงตัวรับ</title><rect x="0" y="0" width="700" height="230" fill="#ffffff"/><rect x="20" y="100" width="130" height="70" rx="8" fill="#eef4fb" stroke="#1f3a5f" stroke-width="2"/><text x="85.0" y="135.0" text-anchor="middle" font-size="17" fill="#111">แหล่งข่าวสาร</text><line x1="150" y1="135" x2="179.0" y2="135.0" stroke="#1f3a5f" stroke-width="2.5"/><polygon points="185,135 175.0,129.0 175.0,141.0" fill="#1f3a5f"/><rect x="185" y="100" width="130" height="70" rx="8" fill="#eef4fb" stroke="#1f3a5f" stroke-width="2"/><text x="250.0" y="129.0" text-anchor="middle" font-size="17" fill="#111">ตัวส่ง</text><text x="250.0" y="151.0" text-anchor="middle" font-size="13" fill="#333">มอดูเลต</text><line x1="315" y1="135" x2="344.0" y2="135.0" stroke="#1f3a5f" stroke-width="2.5"/><polygon points="350,135 340.0,129.0 340.0,141.0" fill="#1f3a5f"/><rect x="350" y="100" width="150" height="70" rx="8" fill="#eef4fb" stroke="#1f3a5f" stroke-width="2"/><text x="425.0" y="129.0" text-anchor="middle" font-size="17" fill="#111">ช่องสัญญาณ</text><text x="425.0" y="151.0" text-anchor="middle" font-size="13" fill="#333">มีสัญญาณรบกวน</text><line x1="500" y1="135" x2="529.0" y2="135.0" stroke="#1f3a5f" stroke-width="2.5"/><polygon points="535,135 525.0,129.0 525.0,141.0" fill="#1f3a5f"/><rect x="535" y="100" width="130" height="70" rx="8" fill="#eef4fb" stroke="#1f3a5f" stroke-width="2"/><text x="600.0" y="129.0" text-anchor="middle" font-size="17" fill="#111">ตัวรับ</text><text x="600.0" y="151.0" text-anchor="middle" font-size="13" fill="#333">ดีมอดูเลต</text><text x="30" y="210" font-size="15" fill="#333">ข่าวสารเดินทางจากซ้ายไปขวา ช่องสัญญาณเพิ่มสัญญาณรบกวนที่ตัวรับต้องแยกออกจากข่าวสาร</text></svg>
