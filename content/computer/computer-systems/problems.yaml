problems:
  - id: computer.systems.computer-systems.p001
    topics: [computer.systems.computer-systems]
    difficulty: 1
    type: match
    stem: "จับคู่อุปกรณ์กับหน่วยของคอมพิวเตอร์"
    pairs:
      - { left: "ไมโครโฟน", right: "หน่วยรับเข้า" }
      - { left: "ลำโพง", right: "หน่วยส่งออก" }
      - { left: "ซีพียู", right: "หน่วยประมวลผลกลาง" }
      - { left: "SSD", right: "หน่วยเก็บถาวร" }
    hints:
      - "อุปกรณ์รับข้อมูลจากภายนอก หรือแสดงผลออกไปข้างนอก"
      - "ข้อมูลที่เก็บไว้แม้ปิดเครื่องอยู่ในหน่วยใด"
    solution: "ไมโครโฟนรับเสียงเข้า = หน่วยรับเข้า, ลำโพงส่งเสียงออก = หน่วยส่งออก, ซีพียู = หน่วยประมวลผลกลาง, SSD เก็บไฟล์ถาวร = หน่วยเก็บถาวร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.computer-systems.p002
    topics: [computer.systems.computer-systems]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็น **ซอฟต์แวร์**"
    choices:
      - { id: a, text: "แอปเครื่องคิดเลขในโทรศัพท์", correct: true }
      - { id: b, text: "จอสัมผัสของโทรศัพท์", feedback: "จอสัมผัสจับต้องได้ เป็นฮาร์ดแวร์ (ทั้งรับเข้าและส่งออก)" }
      - { id: c, text: "แบตเตอรี่", feedback: "แบตเตอรี่เป็นชิ้นส่วนที่จับต้องได้ จึงเป็นฮาร์ดแวร์" }
      - { id: d, text: "สาย USB", feedback: "สายเป็นสื่อกลางที่จับต้องได้ จึงเป็นฮาร์ดแวร์" }
    hints:
      - "ซอฟต์แวร์คือชุดคำสั่ง จับต้องไม่ได้"
      - "ข้อใดเป็นโปรแกรมที่ติดตั้งหรือลบออกได้โดยไม่ต้องถอดชิ้นส่วน"
    solution: "แอปเครื่องคิดเลขเป็นชุดคำสั่งที่ทำงานบนโทรศัพท์ จึงเป็นซอฟต์แวร์ (ซอฟต์แวร์ประยุกต์) ข้ออื่นเป็นฮาร์ดแวร์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.computer-systems.p003
    topics: [computer.systems.computer-systems]
    difficulty: 2
    type: mcq
    stem: "มดพิมพ์รายงานไปครึ่งหน้า ยังไม่ได้กดบันทึก แล้วไฟดับ เมื่อเปิดเครื่องใหม่ งานครึ่งหน้านั้นหายไป เพราะเหตุใด"
    choices:
      - { id: a, text: "งานที่ยังไม่บันทึกอยู่ใน RAM ซึ่งข้อมูลหายเมื่อไฟดับ", correct: true }
      - { id: b, text: "งานถูกเก็บใน SSD แต่ SSD ลบข้อมูลทุกครั้งที่ไฟดับ", feedback: "SSD เป็นหน่วยเก็บถาวร ข้อมูลไม่หายเมื่อไฟดับ ปัญหาคืองานยังไม่ได้ถูกบันทึกลง SSD" }
      - { id: c, text: "ซีพียูเสียเพราะไฟดับ", feedback: "ถ้าซีพียูเสีย เครื่องจะเปิดไม่ได้ งานหายเพราะยังอยู่ในหน่วยความจำที่ต้องใช้ไฟ" }
      - { id: d, text: "จอภาพลบงานทิ้ง", feedback: "จอเป็นหน่วยส่งออก แค่แสดงผล ไม่ได้เก็บงาน" }
    hints:
      - "ระหว่างพิมพ์ เอกสารถูกเก็บไว้ในหน่วยความจำแบบใด"
      - "หน่วยความจำแบบใดต้องมีไฟเลี้ยงตลอดเวลา"
    solution: "ระหว่างทำงาน เอกสารอยู่ใน RAM ซึ่งต้องมีไฟเลี้ยง เมื่อไฟดับข้อมูลจึงหาย การกดบันทึกคือการคัดลอกงานจาก RAM ไปเก็บใน SSD ซึ่งไม่หายเมื่อไฟดับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.computer-systems.p004
    topics: [computer.systems.computer-systems]
    difficulty: 2
    type: order
    stem: "เรียงลำดับสิ่งที่เกิดขึ้นเมื่อกดตัว ก บนแป้นพิมพ์ จนตัว ก ปรากฏในโปรแกรมพิมพ์งาน"
    items:
      - "แป้นพิมพ์ส่งรหัสของปุ่มที่ถูกกด"
      - "ไดรเวอร์และระบบปฏิบัติการรับรหัสแล้วส่งให้โปรแกรมที่ใช้อยู่"
      - "โปรแกรมพิมพ์งานเพิ่ม ก ลงในเอกสารที่อยู่ใน RAM"
      - "โปรแกรมสั่งวาดตัวอักษรใหม่บนหน้าจอ"
      - "จอภาพแสดงตัว ก"
    hints:
      - "เริ่มที่หน่วยรับเข้า และจบที่หน่วยส่งออก"
      - "ซอฟต์แวร์ระบบต้องรับข้อมูลจากฮาร์ดแวร์ก่อนส่งต่อให้ซอฟต์แวร์ประยุกต์"
    solution: "แป้นพิมพ์ส่งรหัส → ไดรเวอร์และระบบปฏิบัติการรับ → โปรแกรมพิมพ์งานแก้เอกสารใน RAM → สั่งวาด → จอแสดงผล ฮาร์ดแวร์และซอฟต์แวร์ทำงานร่วมกันทุกขั้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.computer-systems.p005
    topics: [computer.systems.computer-systems]
    difficulty: 2
    type: numeric
    stem: "ซีพียูมีสัญญาณนาฬิกาความถี่ 2 GHz (2 พันล้านจังหวะต่อวินาที) หนึ่งจังหวะใช้เวลากี่นาโนวินาที (1 วินาที = $10^9$ นาโนวินาที)"
    answer: { value: 0.5, tolerance: 0.01, unit: นาโนวินาที }
    hints:
      - "เวลาของหนึ่งจังหวะ = 1 ÷ จำนวนจังหวะต่อวินาที"
      - "ได้คำตอบเป็นวินาทีแล้วคูณ $10^9$ เพื่อเปลี่ยนเป็นนาโนวินาที"
    misconceptions:
      - { match: 2, feedback: "2 คือจำนวนจังหวะต่อนาโนวินาที คำถามถามเวลาต่อจังหวะ ต้องกลับเศษเป็นส่วน" }
    solution: "เวลาต่อจังหวะ = 1 ÷ (2 × $10^9$) วินาที = 0.5 × $10^{-9}$ วินาที = 0.5 นาโนวินาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.computer-systems.p006
    topics: [computer.systems.computer-systems]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็น **ส่วนภายใน** ของเครื่องคอมพิวเตอร์ตั้งโต๊ะ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "เมนบอร์ด", correct: true }
      - { id: b, text: "RAM", correct: true }
      - { id: c, text: "เครื่องพิมพ์", feedback: "เครื่องพิมพ์ต่ออยู่นอกตัวเครื่อง เป็นอุปกรณ์ต่อพ่วง" }
      - { id: d, text: "เว็บแคม", feedback: "เว็บแคมของเครื่องตั้งโต๊ะเสียบผ่านพอร์ต USB เป็นอุปกรณ์ต่อพ่วง" }
    hints:
      - "ส่วนภายในอยู่ในกล่องเครื่อง ส่วนอุปกรณ์ต่อพ่วงเสียบเพิ่มจากข้างนอก"
      - "ถ้าถอดออกแล้วเครื่องยังเปิดได้ตามปกติ มักเป็นอุปกรณ์ต่อพ่วง"
    solution: "เมนบอร์ดและ RAM อยู่ในกล่องเครื่องและจำเป็นต่อการทำงาน ส่วนเครื่องพิมพ์และเว็บแคมเป็นอุปกรณ์ต่อพ่วงที่เสียบจากภายนอก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.computer-systems.p007
    topics: [computer.systems.computer-systems]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนที่ซีพียูทำกับคำสั่งหนึ่งคำสั่ง ตั้งแต่เริ่มจนพร้อมทำคำสั่งถัดไป"
    items:
      - "อ่านที่อยู่ของคำสั่งจากตัวนับโปรแกรม (PC)"
      - "ดึงคำสั่งจากหน่วยความจำหลักมาไว้ในรีจิสเตอร์คำสั่ง (IR)"
      - "เพิ่มค่า PC ให้ชี้คำสั่งถัดไป"
      - "หน่วยควบคุมถอดรหัสคำสั่ง"
      - "ALU ทำคำสั่งแล้วเก็บผล"
    hints:
      - "ต้องรู้ก่อนว่าคำสั่งอยู่ที่ไหน จึงจะดึงมาได้"
      - "ขั้นดึง (fetch) จบด้วยการเลื่อน PC จากนั้นจึงถอดรหัสและทำคำสั่ง"
    solution: "อ่าน PC → ดึงคำสั่งมาไว้ใน IR → เพิ่ม PC → ถอดรหัส → ทำคำสั่งและเก็บผล แล้ววนกลับไปอ่าน PC ใหม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.computer-systems.p008
    topics: [computer.systems.computer-systems]
    difficulty: 3
    type: numeric
    stem: "คอมพิวเตอร์จำลองในภาพเริ่มทำงานที่ PC = 0 เมื่อโปรแกรมหยุด หน่วยความจำที่อยู่ 7 เก็บค่าใด"
    figure:
      src: toy-program.svg
      alt: "ตารางหน่วยความจำของคอมพิวเตอร์จำลอง ที่อยู่ 0 เก็บ LOAD 5 ที่อยู่ 1 เก็บ ADD 6 ที่อยู่ 2 เก็บ STORE 7 ที่อยู่ 3 เก็บ HALT ที่อยู่ 4 เก็บ 0 ที่อยู่ 5 เก็บ 12 ที่อยู่ 6 เก็บ 30 ที่อยู่ 7 เก็บ 0 กล่องข้าง ๆ อธิบายคำสั่ง LOAD a คือ ACC รับค่าในที่อยู่ a ADD a คือ ACC รับค่า ACC บวกค่าในที่อยู่ a STORE a คือ ค่าในที่อยู่ a รับค่า ACC HALT คือหยุดทำงาน เริ่มที่ PC เท่ากับ 0 และ ACC เท่ากับ 0"
    answer: { value: 42 }
    hints:
      - "ตัวเลขหลังคำสั่งคือที่อยู่ ให้ไปอ่านค่าที่เก็บในที่อยู่นั้น"
      - "ไล่ทีละคำสั่ง: LOAD 5 ทำให้ ACC เป็นเท่าใด แล้ว ADD 6 บวกค่าใดเข้าไป"
    misconceptions:
      - { match: 18, feedback: "บวกเลขที่อยู่ 6 เข้าไปตรง ๆ ADD 6 หมายถึงบวกค่าที่เก็บในที่อยู่ 6 คือ 30" }
      - { match: 0, feedback: "ค่าเดิมของที่อยู่ 7 คือ 0 แต่คำสั่ง STORE 7 เขียนค่า ACC ทับลงไปก่อนหยุด" }
      - { match: 11, feedback: "บวกเลขที่อยู่ 5 กับ 6 เข้าด้วยกัน ต้องใช้ค่าที่เก็บในที่อยู่เหล่านั้น คือ 12 และ 30" }
    solution: "LOAD 5: ACC = 12 → ADD 6: ACC = 12 + 30 = 42 → STORE 7: ที่อยู่ 7 = 42 → HALT หยุด ที่อยู่ 7 จึงเก็บ 42"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.computer-systems.p009
    topics: [computer.systems.computer-systems]
    difficulty: 3
    type: numeric
    stem: "เกมในโทรศัพท์ของต้นมีไฟล์อัปเดตขนาด 1.5 GB (1 GB = 1,000 MB) อินเทอร์เน็ตไฟเบอร์ที่บ้านดาวน์โหลดได้ 200 Mbps ถ้าความเร็วคงที่ จะดาวน์โหลดเสร็จในกี่วินาที"
    answer: { value: 60, unit: วินาที }
    hints:
      - "เปลี่ยนขนาดไฟล์เป็น MB แล้วเป็นเมกะบิต (1 ไบต์ = 8 บิต)"
      - "เวลา = ขนาดข้อมูลเป็นบิต ÷ ความเร็วเป็นบิตต่อวินาที"
    misconceptions:
      - { match: 7.5, feedback: "ลืมเปลี่ยนไบต์เป็นบิต ความเร็ว 200 Mbps เป็นเมกะบิต ต้องคูณขนาดไฟล์ด้วย 8 ก่อน" }
      - { match: 0.06, feedback: "ไม่ได้เปลี่ยน GB เป็น MB ก่อนหาร 1.5 GB = 1,500 MB" }
    solution: "1.5 GB = 1,500 MB = 1,500 × 8 = 12,000 Mb เวลา = 12,000 ÷ 200 = 60 วินาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.computer-systems.p010
    topics: [computer.systems.computer-systems]
    difficulty: 3
    type: mcq
    stem: "ข้อใดอธิบายลำดับชั้นหน่วยความจำได้ถูกต้อง"
    choices:
      - { id: a, text: "แคชเร็วกว่า RAM แต่จุน้อยกว่า จึงเก็บเฉพาะข้อมูลที่เพิ่งใช้หรือใช้บ่อย", correct: true }
      - { id: b, text: "RAM จุมากกว่า SSD และเก็บข้อมูลได้แม้ปิดเครื่อง", feedback: "ในเครื่องทั่วไป SSD จุมากกว่า RAM และ RAM ข้อมูลหายเมื่อไฟดับ" }
      - { id: c, text: "ฮาร์ดดิสก์เร็วที่สุดเพราะจุมากที่สุด", feedback: "ความจุมากไม่ได้แปลว่าเร็ว ฮาร์ดดิสก์อยู่ชั้นล่างสุด ช้าที่สุดในภาพ" }
      - { id: d, text: "ทุกชั้นเร็วเท่ากัน ต่างกันแค่ราคา", feedback: "ชั้นต่าง ๆ เร็วต่างกันหลายพันถึงหลายล้านเท่า นี่คือเหตุผลที่ต้องจัดเป็นชั้น" }
    hints:
      - "ชั้นที่อยู่ใกล้ซีพียูเร็วกว่าแต่เล็กกว่า"
      - "ดูภาพพีระมิดในบทเรียน"
    solution: "ยิ่งใกล้ซีพียูยิ่งเร็วแต่จุน้อยและแพง แคชอยู่ในชิปซีพียู เร็วกว่า RAM แต่จุน้อย จึงเก็บสำเนาข้อมูลที่ใช้บ่อยเพื่อลดเวลารอ RAM"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.computer-systems.p011
    topics: [computer.systems.computer-systems]
    difficulty: 3
    type: match
    stem: "จับคู่สื่อกลางการสื่อสารกับงานที่เหมาะสม"
    pairs:
      - { left: "บลูทูท", right: "ต่อหูฟังไร้สายกับโทรศัพท์ในระยะใกล้" }
      - { left: "ใยแก้วนำแสง", right: "ส่งข้อมูลปริมาณมากระยะไกลเข้าบ้านหรืออาคาร" }
      - { left: "Wi-Fi", right: "ให้หลายเครื่องในบ้านใช้อินเทอร์เน็ตแบบไร้สาย" }
      - { left: "สาย USB", right: "ต่อเครื่องพิมพ์หรือแฟลชไดรฟ์กับคอมพิวเตอร์" }
    hints:
      - "แยกสื่อแบบมีสายกับไร้สายก่อน"
      - "ระยะทางและปริมาณข้อมูลบอกได้ว่าควรใช้สื่อใด"
    solution: "บลูทูทใช้ระยะใกล้ (หูฟัง), ใยแก้วนำแสงส่งข้อมูลมากระยะไกล (อินเทอร์เน็ตไฟเบอร์), Wi-Fi ให้หลายเครื่องต่อไร้สายภายในบ้าน, สาย USB ต่ออุปกรณ์ต่อพ่วงกับเครื่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.computer-systems.p012
    topics: [computer.systems.computer-systems]
    difficulty: 4
    type: mcq
    stem: "ชมรมวิดีโอของโรงเรียนมีงบอัปเกรดเครื่องได้หนึ่งอย่าง เครื่องตอนนี้มี RAM 4 GB เก็บไฟล์ในฮาร์ดดิสก์ เมื่อเปิดโปรแกรมตัดต่อพร้อมคลิปหลายไฟล์ ตัวจัดการงานแสดงว่า RAM ถูกใช้เต็ม 100% ตลอดเวลา ส่วนซีพียูใช้แค่ราว 40% ควรอัปเกรดอะไรก่อน"
    choices:
      - { id: a, text: "เพิ่ม RAM เป็น 16 GB", correct: true }
      - { id: b, text: "เปลี่ยนซีพียูให้ความถี่สูงขึ้น", feedback: "ซีพียูยังว่างอยู่ราว 60% ยังไม่ใช่คอขวด การเปลี่ยนซีพียูจึงช่วยได้น้อย" }
      - { id: c, text: "ซื้อจอภาพที่ใหญ่ขึ้น", feedback: "จอใหญ่ทำให้ดูง่าย แต่ไม่ช่วยให้โปรแกรมทำงานเร็วขึ้น" }
      - { id: d, text: "ซื้อลำโพงใหม่", feedback: "ลำโพงเป็นหน่วยส่งออกเสียง ไม่เกี่ยวกับความเร็วของการตัดต่อ" }
    hints:
      - "หาว่าชิ้นส่วนใดถูกใช้เต็มจนงานต้องรอ (คอขวด)"
      - "เมื่อ RAM เต็ม ระบบต้องย้ายข้อมูลไปมากับหน่วยเก็บถาวรที่ช้ากว่ามาก"
    solution: "RAM เต็ม 100% แปลว่าเป็นคอขวด ระบบต้องสลับข้อมูลไปเก็บในฮาร์ดดิสก์ที่ช้ากว่ามาก ส่วนซีพียูยังว่าง การเพิ่ม RAM จึงช่วยมากที่สุด ถ้ามีงบรอบต่อไปค่อยเปลี่ยนฮาร์ดดิสก์เป็น SSD"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.computer-systems.p013
    topics: [computer.systems.computer-systems]
    difficulty: 4
    type: numeric
    stem: "ในโปรแกรมหนึ่ง ซีพียูหาข้อมูลเจอในแคช 90% ของครั้ง ใช้เวลาครั้งละ 2 นาโนวินาที อีก 10% หาไม่เจอต้องไปอ่าน RAM ใช้เวลาครั้งละ 100 นาโนวินาที เวลาเฉลี่ยต่อการอ่านข้อมูลหนึ่งครั้งเป็นกี่นาโนวินาที"
    answer: { value: 11.8, tolerance: 0.1, unit: นาโนวินาที }
    hints:
      - "เวลาเฉลี่ยถ่วงน้ำหนัก = (สัดส่วนที่เจอ × เวลาเมื่อเจอ) + (สัดส่วนที่ไม่เจอ × เวลาเมื่อไม่เจอ)"
      - "ใช้ 0.9 และ 0.1 แทน 90% และ 10%"
    misconceptions:
      - { match: 51, feedback: "หาค่าเฉลี่ยของ 2 กับ 100 ตรง ๆ แต่สองกรณีเกิดบ่อยไม่เท่ากัน ต้องถ่วงน้ำหนักด้วย 90% และ 10%" }
      - { match: 100, feedback: "ใช้แต่เวลาของ RAM ที่จริงส่วนใหญ่ (90%) หาเจอในแคชซึ่งเร็วกว่ามาก" }
    solution: "เวลาเฉลี่ย = 0.9 × 2 + 0.1 × 100 = 1.8 + 10 = 11.8 นาโนวินาที เร็วกว่าการอ่าน RAM ทุกครั้ง (100 นาโนวินาที) มาก นี่คือเหตุผลที่ต้องมีแคช"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.computer-systems.p014
    topics: [computer.systems.computer-systems]
    difficulty: 4
    type: mcq
    stem: "ข้อใดอธิบายได้ดีที่สุดว่า ทำไมเปลี่ยนจากซีพียู 2 แกนเป็น 8 แกน แล้วโปรแกรมบางโปรแกรมไม่ได้เร็วขึ้น 4 เท่า"
    choices:
      - { id: a, text: "งานบางส่วนต้องทำทีละขั้นตามลำดับ แบ่งให้หลายแกนทำพร้อมกันไม่ได้ ส่วนนั้นจึงใช้เวลาเท่าเดิม", correct: true }
      - { id: b, text: "แกนที่เพิ่มมาไม่ได้ต่อกับหน่วยความจำ", feedback: "ทุกแกนเข้าถึงหน่วยความจำได้ เหตุผลหลักคือโครงสร้างของงาน" }
      - { id: c, text: "แกนยิ่งมาก ความถี่ของแต่ละแกนจะลดลงเหลือศูนย์", feedback: "ความถี่ไม่ได้ลดลงเป็นศูนย์ ข้อนี้ไม่จริง" }
      - { id: d, text: "โปรแกรมทุกโปรแกรมใช้ได้แค่แกนเดียวเสมอ", feedback: "หลายโปรแกรม เช่น ตัดต่อวิดีโอ แบ่งงานให้หลายแกนได้ แต่มักแบ่งได้ไม่หมด" }
    hints:
      - "ลองนึกถึงการทำกับข้าว บางขั้นหลายคนช่วยกันได้ บางขั้นต้องรอทีละขั้น"
      - "เวลารวมขึ้นกับส่วนที่แบ่งไม่ได้ด้วย"
    solution: "โปรแกรมมีทั้งส่วนที่ทำพร้อมกันได้และส่วนที่ต้องทำตามลำดับ แกนที่เพิ่มขึ้นช่วยเฉพาะส่วนแรก ส่วนหลังยังใช้เวลาเท่าเดิม ความเร็วรวมจึงเพิ่มน้อยกว่าจำนวนเท่าของแกน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.computer-systems.p015
    topics: [computer.systems.computer-systems]
    difficulty: 4
    type: numeric
    stem: "โทรศัพท์มีความจุ 128 GB ระบบและแอปใช้ไปแล้ว 20 GB ถ้ารูปถ่ายแต่ละรูปมีขนาด 4 MB เก็บรูปเพิ่มได้อีกมากที่สุดกี่รูป (ใช้ 1 GB = 1,000 MB)"
    answer: { value: 27000, unit: รูป }
    hints:
      - "หาพื้นที่ว่างก่อน แล้วเปลี่ยนเป็น MB"
      - "จำนวนรูป = พื้นที่ว่าง ÷ ขนาดต่อรูป"
    misconceptions:
      - { match: 32000, feedback: "ใช้ความจุทั้งหมด 128 GB แต่ระบบและแอปใช้ไปแล้ว 20 GB ต้องหักออกก่อน" }
      - { match: 27, feedback: "ลืมเปลี่ยน GB เป็น MB ก่อนหารด้วย 4 MB" }
    solution: "พื้นที่ว่าง 128 − 20 = 108 GB = 108,000 MB เก็บรูปได้ 108,000 ÷ 4 = 27,000 รูป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.computer-systems.p016
    topics: [computer.systems.computer-systems]
    difficulty: 5
    type: numeric
    stem: "โปรแกรมคำนวณภาพมีคำสั่ง $6 \\times 10^9$ คำสั่ง ซีพียูแกนเดียวความถี่ 3 GHz ทำได้ 1 คำสั่งต่อจังหวะ ถ้าเปลี่ยนไปใช้ 4 แกนความถี่เท่าเดิม โดยงาน 75% แบ่งให้ 4 แกนทำพร้อมกันได้ แต่อีก 25% ต้องทำทีละขั้นบนแกนเดียว โปรแกรมจะใช้เวลากี่วินาที"
    answer: { value: 0.875, tolerance: 0.01, unit: วินาที }
    hints:
      - "หาเวลาเมื่อใช้แกนเดียวก่อน: จำนวนคำสั่ง ÷ จำนวนคำสั่งต่อวินาที"
      - "แยกเวลาเป็นสองส่วน ส่วน 25% ใช้เวลาเท่าเดิม ส่วน 75% หารด้วย 4 แล้วนำมาบวกกัน"
    misconceptions:
      - { match: 0.5, feedback: "หารเวลาทั้งหมดด้วย 4 แต่ส่วน 25% แบ่งให้หลายแกนไม่ได้ ยังใช้เวลาเท่าเดิม" }
      - { match: 2, feedback: "2 วินาทีคือเวลาเมื่อใช้แกนเดียว ยังไม่ได้คิดผลของ 4 แกน" }
    solution: "แกนเดียว: $6 \\times 10^9$ ÷ $3 \\times 10^9$ = 2 วินาที เมื่อใช้ 4 แกน: ส่วนทำทีละขั้น 0.25 × 2 = 0.5 วินาที ส่วนแบ่งได้ 0.75 × 2 ÷ 4 = 0.375 วินาที รวม 0.875 วินาที เร็วขึ้นราว 2.3 เท่า ไม่ถึง 4 เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.computer-systems.p017
    topics: [computer.systems.computer-systems]
    difficulty: 5
    type: mcq
    stem: "ขณะที่ซีพียูกำลังคำนวณภาพในเกมอยู่ ผู้เล่นกดปุ่มบนจอยเกม ข้อใดอธิบายกลไกที่ทำให้ซีพียูรับรู้การกดปุ่มได้ทันทีโดยไม่ต้องคอยถามจอยตลอดเวลา"
    choices:
      - { id: a, text: "จอยส่งสัญญาณขัดจังหวะ (interrupt) ซีพียูพักงานที่ทำอยู่ ไปทำโปรแกรมรับข้อมูลจากจอยสั้น ๆ แล้วกลับมาทำงานเดิมต่อ", correct: true }
      - { id: b, text: "ซีพียูหยุดคำนวณภาพทั้งหมดจนกว่าผู้เล่นจะปล่อยปุ่ม", feedback: "ถ้าเป็นแบบนี้เกมจะค้างทุกครั้งที่กดปุ่ม ซีพียูพักงานเพียงช่วงสั้นมากแล้วกลับมาทำต่อ" }
      - { id: c, text: "จอยเขียนข้อมูลลง SSD แล้วซีพียูเปิดไฟล์อ่านหลังเกมจบ", feedback: "การกดปุ่มต้องตอบสนองทันที การรอจนเกมจบใช้ไม่ได้" }
      - { id: d, text: "จอยมีซีพียูของตัวเองที่วาดภาพเกมแทน", feedback: "จอยเป็นอุปกรณ์รับเข้า ไม่ได้วาดภาพเกม" }
    hints:
      - "อุปกรณ์รับเข้ามีวิธี \"สะกิด\" ซีพียูเมื่อมีข้อมูลใหม่"
      - "ซีพียูต้องกลับมาทำงานเดิมต่อได้ หลังรับข้อมูลแล้ว"
    solution: "อุปกรณ์รับเข้าส่งสัญญาณขัดจังหวะผ่านบัส ซีพียูเก็บสถานะงานปัจจุบัน ไปทำโปรแกรมจัดการสัญญาณขัดจังหวะ (รับค่าปุ่ม) แล้วกลับมาทำงานเดิม วิธีนี้ไม่ต้องเสียเวลาถามอุปกรณ์ซ้ำ ๆ"
