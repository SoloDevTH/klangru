  - topic: management.hr.human-resource-management
    indicators: [CMQOE VII.A, CMQOE VII.B, CMQOE VII.D, CQE II.F]
    coverage: full
    note: "แผนการฝึกอบรม: หลักสูตร กลุ่มเป้าหมาย วิธี งบ ตัววัดผล และการวางชั่วโมงอบรม (p014)"
