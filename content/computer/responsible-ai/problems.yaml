problems:
  - id: computer.ai.responsible-ai.p001
    topics: [computer.ai.responsible-ai]
    difficulty: 1
    type: mcq
    stem: "ความโปร่งใส (transparency) ของระบบ AI หมายถึงข้อใด"
    choices:
      - { id: a, text: "ระบบต้องทำงานเร็วที่สุดเท่าที่จะทำได้", feedback: "ความเร็วเป็นคุณสมบัติทางเทคนิค ไม่ใช่ความโปร่งใส" }
      - { id: b, text: "ผู้ใช้รู้ว่ามี AI เข้ามาเกี่ยวข้องและรู้ข้อจำกัดของมัน", correct: true }
      - { id: c, text: "ซอร์สโค้ดต้องเปิดให้ทุกคนดาวน์โหลดได้เสมอ", feedback: "ความโปร่งใสไม่จำเป็นต้องเปิดโค้ดทั้งหมด แต่ต้องบอกให้ผู้ใช้เข้าใจว่าระบบทำอะไรและข้อจำกัด" }
      - { id: d, text: "ผลของระบบต้องเหมือนกันทุกครั้งที่ถาม", feedback: "นั่นเป็นความสม่ำเสมอของผล ไม่ใช่ความโปร่งใส" }
    hints:
      - "ลองนึกว่าผู้ใช้ควรรู้อะไรเกี่ยวกับระบบที่ตัดสินใจเกี่ยวกับตัวเอง"
      - "ดูว่าตัวเลือกใดพูดถึงการรู้ว่ามีอะไรเกิดขึ้นและข้อจำกัด"
    solution: "ความโปร่งใสคือการบอกให้ผู้ใช้รู้ว่ามี AI เกี่ยวข้อง รู้ข้อจำกัด และเข้าใจบทบาทของระบบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.responsible-ai.p002
    topics: [computer.ai.responsible-ai]
    difficulty: 1
    type: match
    stem: "จับคู่หลักการของ AI ที่รับผิดชอบกับตัวอย่างการปฏิบัติ"
    pairs:
      - { left: "ความเป็นธรรม", right: "ตรวจผลแยกตามกลุ่มผู้ใช้ก่อนนำไปใช้" }
      - { left: "ความเป็นส่วนตัว", right: "เก็บเฉพาะข้อมูลที่จำเป็นและได้รับความยินยอม" }
      - { left: "ความรับผิดชอบ", right: "มีผู้รับผิดชอบเมื่อระบบผิดพลาด" }
      - { left: "การอธิบายได้", right: "บอกเหตุผลสำคัญของการตัดสินใจให้ผู้ได้รับผลกระทบ" }
    hints:
      - "ความเป็นธรรมเกี่ยวกับการไม่เสียเปรียบกลุ่มใด"
      - "การอธิบายได้เกี่ยวกับการบอกเหตุผล"
    solution: "แต่ละหลักการมีแนวปฏิบัติที่เกี่ยวข้องโดยตรง เช่น ความเป็นธรรมต้องตรวจผลแยกกลุ่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.responsible-ai.p003
    topics: [computer.ai.responsible-ai]
    difficulty: 1
    type: mcq
    stem: "ข้อใดอธิบายความต่างระหว่างระบบแบบกฎกับระบบที่เรียนรู้จากข้อมูลได้ถูกต้อง"
    choices:
      - { id: a, text: "ระบบแบบกฎมีเงื่อนไขที่มนุษย์เขียนไว้และอ่านได้ ส่วนระบบเรียนรู้สร้างเงื่อนไขจากข้อมูลและอธิบายยากกว่า", correct: true }
      - { id: b, text: "ระบบแบบกฎใช้ข้อมูลตัวอย่างสร้างเงื่อนไขเอง ส่วนระบบเรียนรู้เขียนกฎด้วยมือ", feedback: "ข้อนี้สลับกัน ระบบแบบกฎเขียนเงื่อนไขด้วยมือ ส่วนระบบเรียนรู้สร้างเงื่อนไขจากข้อมูล" }
      - { id: c, text: "ระบบแบบกฎไม่สามารถตัดสินใจได้เลย", feedback: "ระบบแบบกฎตัดสินใจได้ตามเงื่อนไขที่กำหนด แค่ไม่ยืดหยุ่นกับข้อมูลใหม่" }
      - { id: d, text: "ระบบเรียนรู้จากข้อมูลไม่มีอคติเสมอ", feedback: "ระบบเรียนรู้สืบทอดอคติของข้อมูลได้ จึงไม่ได้เป็นกลางโดยอัตโนมัติ" }
    hints:
      - "ถามว่าใครเป็นคนเขียนเงื่อนไข"
      - "ดูว่าอ่านเงื่อนไขภายในระบบได้หรือไม่"
    solution: "ระบบแบบกฎใช้เงื่อนไขที่มนุษย์เขียนไว้ อ่านและตรวจได้ ส่วนระบบเรียนรู้สร้างเงื่อนไขจากข้อมูลจึงอธิบายได้ยากกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.responsible-ai.p004
    topics: [computer.ai.responsible-ai]
    difficulty: 2
    type: mcq
    stem: "โรงเรียนจะใช้ AI จัดลำดับผู้สมัครเรียนต่อ ข้อใดคือการออกแบบที่รับผิดชอบที่สุด"
    choices:
      - { id: a, text: "ปฏิเสธผู้สมัครทุกคนที่ระบบจัดให้อยู่ท้ายลำดับโดยอัตโนมัติ", feedback: "การปฏิเสธอัตโนมัติโดยไม่มีคนตรวจกระทบผู้ได้รับผลกระทบมาก และอุทธรณ์ยาก" }
      - { id: b, text: "ไม่บอกผู้สมัครว่าใช้ AI เพื่อหลีกเลี่ยงการโต้แย้ง", feedback: "การไม่บอกทำลายความโปร่งใสและทำให้ผู้สมัครไม่รู้ว่าควรอุทธรณ์อย่างไร" }
      - { id: c, text: "ให้ AI เสนอลำดับ แต่มีคนตรวจทานก่อนตัดสินและผู้สมัครอุทธรณ์ได้", correct: true }
      - { id: d, text: "ใช้ผลจากปีก่อนโดยไม่ตรวจว่ามีอคติหรือไม่", feedback: "ข้อมูลในอดีตอาจมีอคติ ต้องตรวจก่อนนำมาใช้ฝึกหรือเป็นเกณฑ์" }
    hints:
      - "ดูว่าใครเป็นผู้ตัดสินสุดท้าย และผู้สมัครมีทางโต้แย้งหรือไม่"
      - "การออกแบบที่รับผิดชอบเกี่ยวข้องกับมนุษย์ในวงจรการตัดสินใจ"
    solution: "ให้ AI เป็นเพียงคำแนะนำ มีมนุษย์ตรวจสุดท้าย บอกผู้สมัครตามจริง และเปิดช่องอุทธรณ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.responsible-ai.p005
    topics: [computer.ai.responsible-ai]
    difficulty: 2
    type: numeric
    stem: "ระบบจัดลำดับผู้สมัครงานผ่านกลุ่ม X ร้อยละ 78 และกลุ่ม Y ร้อยละ 52 ผลต่างของอัตราผ่านสองกลุ่มกี่จุดเปอร์เซ็นต์ (ตอบเป็นจำนวนเต็ม)"
    answer: { value: 26, unit: จุดเปอร์เซ็นต์ }
    hints:
      - "ลบอัตราของสองกลุ่มโดยตรง"
      - "คำตอบเป็นจุดเปอร์เซ็นต์ ไม่ใช่เปอร์เซ็นต์ของค่าใดค่าหนึ่ง"
    misconceptions:
      - { match: 50, feedback: "50 คือผลต่างเทียบกับกลุ่ม Y เป็นสัดส่วน ไม่ใช่ผลต่างเป็นจุดเปอร์เซ็นต์ที่โจทย์ถาม" }
      - { match: 78, feedback: "78 คืออัตราของกลุ่ม X เพียงอย่างเดียว ต้องนำมาลบกับกลุ่ม Y" }
    solution: "ผลต่าง $78 - 52 = 26$ จุดเปอร์เซ็นต์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.responsible-ai.p006
    topics: [computer.ai.responsible-ai]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการทำเอกสารกำกับและบันทึกสายส่งข้อมูลของโมเดลให้ถูกลำดับ"
    items:
      - "บันทึกที่มาและการยินยอมของข้อมูลฝึก"
      - "บันทึกเวอร์ชันและค่าตั้งของโมเดลตอนฝึก"
      - "ประเมินผลแยกตามกลุ่มผู้ใช้"
      - "จัดทำ model card และ datasheet"
      - "ติดตามผลหลังใช้งานและรับเรื่องร้องเรียน"
    hints:
      - "ขั้นแรกต้องรู้ที่มาของข้อมูลก่อนจะฝึกได้"
      - "การติดตามหลังใช้งานเป็นขั้นสุดท้ายแต่ทำต่อเนื่อง"
    solution: "บันทึกที่มาของข้อมูล บันทึกเวอร์ชันตอนฝึก ประเมินแยกกลุ่ม จัดทำเอกสารกำกับ แล้วติดตามหลังใช้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.responsible-ai.p007
    topics: [computer.ai.responsible-ai]
    difficulty: 2
    type: text
    stem: "กฎหมายว่าด้วยปัญญาประดิษฐ์ของสหภาพยุโรปที่ใช้แนวทางแบ่งตามระดับความเสี่ยงมีชื่อภาษาอังกฤษว่าอะไร (ตอบชื่อย่อที่รู้จัก)"
    accepted: ["EU AI Act", "AI Act", "Artificial Intelligence Act", "EU Artificial Intelligence Act"]
    misconceptions:
      - { match: "GDPR", feedback: "GDPR เป็นกฎหมายคุ้มครองข้อมูลส่วนบุคคลของสหภาพยุโรป ไม่ได้เป็นกฎหมาย AI โดยตรง" }
      - { match: "PDPA", feedback: "PDPA เป็นกฎหมายคุ้มครองข้อมูลส่วนบุคคลของไทย ไม่ใช่กฎหมาย AI ของสหภาพยุโรป" }
    hints:
      - "ชื่อมีคำว่า AI และมีคำว่า Act"
      - "กฎหมายนี้มีผลบังคับตั้งแต่ปี 2024 ตามที่ระบุในบทเรียน"
    solution: "EU AI Act (Regulation (EU) 2024/1689) เป็นกฎหมายว่าด้วย AI ของสหภาพยุโรป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.responsible-ai.p008
    topics: [computer.ai.responsible-ai]
    difficulty: 2
    type: mcq
    stem: "ข้อใดไม่ควรปรากฏในเอกสารกำกับ model card ของโมเดลจัดลำดับ"
    choices:
      - { id: a, text: "วัตถุประสงค์และการใช้งานที่ไม่เหมาะสม", feedback: "วัตถุประสงค์และข้อห้ามใช้เป็นองค์ประกอบปกติของ model card" }
      - { id: b, text: "ผลการประเมินแยกตามกลุ่มผู้ใช้", feedback: "การประเมินแยกกลุ่มเป็นสิ่งที่ model card ควรบันทึกไว้" }
      - { id: c, text: "ข้อจำกัดและสถานการณ์ที่โมเดลทำงานได้แย่", feedback: "ข้อจำกัดเป็นข้อมูลสำคัญที่ควรเปิดเผย" }
      - { id: d, text: "รหัสผ่านของระบบที่ใช้เข้าถึงฐานข้อมูลจริง", correct: true }
    hints:
      - "model card เป็นเอกสารที่เปิดให้ผู้เกี่ยวข้องอ่าน ไม่ควรมีข้อมูลลับ"
      - "มองหาตัวเลือกที่เป็นข้อมูลลับของระบบ"
    solution: "model card ควรบอกวัตถุประสงค์ การประเมิน และข้อจำกัด แต่ไม่ควรมีความลับด้านความปลอดภัย เช่น รหัสผ่าน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.responsible-ai.p009
    topics: [computer.ai.responsible-ai]
    difficulty: 3
    type: code
    stem: "เขียนฟังก์ชัน parity_gap(decisions) โดย decisions เป็นลิสต์ของคู่ (กลุ่ม, ผ่านหรือไม่) ให้คำนวณอัตราผ่านเป็นเปอร์เซ็นต์ของแต่ละกลุ่ม แล้วคืนผลต่างระหว่างอัตราที่สูงที่สุดกับต่ำที่สุด ปัดเป็นทศนิยม 1 ตำแหน่ง"
    starter: |
      def parity_gap(decisions):
          # ตอนนี้คืน 0 เสมอ ยังไม่ได้คำนวณ
          return 0
    tests: |
      data = [("A", True), ("A", True), ("A", True), ("A", False), ("B", True), ("B", False), ("B", False), ("B", False)]
      assert parity_gap(data) == 50.0, f"กลุ่ม A ผ่าน 75 เปอร์เซ็นต์ B ผ่าน 25 เปอร์เซ็นต์ ผลต่างควรเป็น 50.0 แต่ได้ {parity_gap(data)}"
      same = [("X", True), ("X", False), ("Y", True), ("Y", False)]
      assert parity_gap(same) == 0.0, "อัตราผ่านเท่ากันทุกกลุ่มต้องได้ผลต่าง 0.0"
    reference: |
      def parity_gap(decisions):
          totals = {}
          for group, passed in decisions:
              n, k = totals.get(group, (0, 0))
              totals[group] = (n + 1, k + (1 if passed else 0))
          rates = [k / n * 100 for n, k in totals.values()]
          return round(max(rates) - min(rates), 1)
    hints:
      - "นับจำนวนผู้สมัครและจำนวนที่ผ่านของแต่ละกลุ่มก่อน ด้วยดิกชันนารี"
      - "อัตราผ่าน = จำนวนที่ผ่าน / จำนวนทั้งหมด × 100 แล้วหาค่าสูงสุดลบต่ำสุด"
    solution: "รวมจำนวนและจำนวนที่ผ่านของแต่ละกลุ่ม คำนวณอัตราเป็นเปอร์เซ็นต์ แล้วคืน max - min ปัด 1 ตำแหน่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.responsible-ai.p010
    topics: [computer.ai.responsible-ai]
    difficulty: 3
    type: code
    stem: "เขียนฟังก์ชัน missing_fields(card, required) โดย card เป็นดิกชันนารีของเอกสารกำกับโมเดล และ required เป็นลิสต์ชื่อฟิลด์ที่ต้องมี ให้คืนลิสต์ของชื่อฟิลด์ที่ไม่มีอยู่ในการ์ด หรือมีค่าเป็นสตริงว่างหรือ None โดยเรียงตามลำดับของ required"
    starter: |
      def missing_fields(card, required):
          # ตอนนี้คืนลิสต์ว่างเสมอ
          return []
    tests: |
      card = {"purpose": "จัดลำดับเอกสาร", "limitations": "", "group_metrics": None, "owner": "ทีมคลังรู้"}
      req = ["purpose", "limitations", "group_metrics", "owner", "training_data"]
      assert missing_fields(card, req) == ["limitations", "group_metrics", "training_data"], f"ควรขาด limitations, group_metrics และ training_data แต่ได้ {missing_fields(card, req)}"
      assert missing_fields({"purpose": "x"}, ["purpose"]) == [], "มีครบแล้วต้องได้ลิสต์ว่าง"
    reference: |
      def missing_fields(card, required):
          return [f for f in required if card.get(f) in (None, "")]
    hints:
      - "วนดูฟิลด์ที่ต้องมีตามลำดับของ required"
      - "ใช้ card.get(f) เพื่อไม่ให้เกิดข้อผิดพลาดเมื่อไม่มีคีย์ แล้วตรวจว่าเป็น None หรือสตริงว่าง"
    solution: "คืน [f for f in required if card.get(f) in (None, \"\")] ซึ่งรักษาลำดับและครอบคลุมทั้งกรณีไม่มีคีย์และค่าว่าง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.responsible-ai.p011
    topics: [computer.ai.responsible-ai]
    difficulty: 3
    type: numeric
    stem: "ระบบจัดลำดับเอกสารแม่นยำ 88 จาก 100 กรณีสำหรับกลุ่ม A และ 70 จาก 100 กรณีสำหรับกลุ่ม B ผลต่างความแม่นยำระหว่างสองกลุ่มกี่จุดเปอร์เซ็นต์ (ตอบเป็นจำนวนเต็ม)"
    answer: { value: 18, unit: จุดเปอร์เซ็นต์ }
    hints:
      - "คำนวณความแม่นยำของแต่ละกลุ่มเป็นเปอร์เซ็นต์ก่อน"
      - "แล้วลบค่าของสองกลุ่มโดยตรง"
    misconceptions:
