problems:
  - id: health.hygiene.national-health-rules.p001
    topics: [health.hygiene.national-health-rules]
    difficulty: 1
    type: numeric
    stem: "สุขบัญญัติแห่งชาติมีทั้งหมดกี่ข้อ (ตอบเป็นตัวเลขในหน่วยข้อ)"
    answer: { value: 10, unit: ข้อ }
    misconceptions:
      - { match: 9, feedback: "9 ข้อคือโภชนบัญญัติ (ข้อปฏิบัติการกินอาหาร) ส่วนสุขบัญญัติแห่งชาติมี 10 ข้อ" }
      - { match: 5, feedback: "5 คืออาหารหลัก 5 หมู่ ส่วนสุขบัญญัติแห่งชาติมี 10 ข้อ" }
    hints:
      - "นับจากภาพหรือรายการในบทเรียน"
      - "ข้อสุดท้ายคือ มีสำนึกต่อส่วนรวม ร่วมสร้างสรรค์สังคม"
    solution: "สุขบัญญัติแห่งชาติมี 10 ประการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.hygiene.national-health-rules.p002
    topics: [health.hygiene.national-health-rules]
    difficulty: 1
    type: mcq
    stem: "ตามสุขบัญญัติแห่งชาติ ควรล้างมือให้สะอาดเมื่อใด"
    choices:
      - { id: a, text: "ก่อนกินอาหารและหลังขับถ่าย", correct: true }
      - { id: b, text: "เฉพาะเมื่อมือเปื้อนจนเห็นชัด", feedback: "เชื้อโรคมองไม่เห็นด้วยตา แม้มือดูสะอาดก็ควรล้างก่อนกินอาหารและหลังเข้าห้องน้ำ" }
      - { id: c, text: "เฉพาะก่อนนอน", feedback: "ช่วงที่เชื้อโรคเข้าปากง่ายคือก่อนกินอาหาร และหลังขับถ่ายมือมักสัมผัสเชื้อโรค" }
      - { id: d, text: "สัปดาห์ละครั้ง", feedback: "ต้องล้างทุกครั้งก่อนกินอาหารและหลังขับถ่าย" }
    hints:
      - "เป็นสุขบัญญัติข้อที่ 3"
      - "คิดถึงช่วงที่มือจะนำเชื้อโรคเข้าปาก และช่วงที่มือสัมผัสเชื้อโรคมาก"
    solution: "สุขบัญญัติข้อ 3 ล้างมือให้สะอาดก่อนกินอาหารและหลังขับถ่าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.hygiene.national-health-rules.p003
    topics: [health.hygiene.national-health-rules]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นลักษณะของการมีสุขภาพดี"
    choices:
      - { id: a, text: "ร่างกายแข็งแรง จิตใจร่าเริงแจ่มใส และเล่นกับเพื่อนได้ดี", correct: true }
      - { id: b, text: "ไม่มีไข้ แต่เศร้าและไม่อยากคุยกับใครทุกวัน", feedback: "สุขภาพดีรวมถึงสุขภาพใจและสังคม ไม่ใช่แค่ไม่มีไข้" }
      - { id: c, text: "ตัวสูงกว่าเพื่อนทุกคน", feedback: "ความสูงอย่างเดียวไม่ได้บอกว่าสุขภาพดี แต่ละคนเติบโตต่างกัน" }
      - { id: d, text: "กินขนมได้มากที่สุด", feedback: "การกินขนมมากไม่ใช่สัญญาณของสุขภาพดี" }
    hints:
      - "สุขภาพมีทั้งด้านกาย ใจ และสังคม"
      - "หาข้อที่ครบทุกด้าน"
    solution: "คนที่มีสุขภาพดีมีร่างกายแข็งแรง จิตใจร่าเริง และอยู่ร่วมกับผู้อื่นได้ดี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.hygiene.national-health-rules.p004
    topics: [health.hygiene.national-health-rules]
    difficulty: 2
    type: match
    stem: "จับคู่พฤติกรรมกับสุขบัญญัติแห่งชาติที่ตรงที่สุด"
    pairs:
      - { left: "อาบน้ำ สระผม และตัดเล็บ", right: "ข้อ 1 ดูแลรักษาร่างกายและของใช้ให้สะอาด" }
      - { left: "กินอาหารที่ปรุงสุกใหม่", right: "ข้อ 4 กินอาหารสุก สะอาด ปราศจากสารอันตราย" }
      - { left: "เล่าเรื่องที่โรงเรียนให้พ่อแม่ฟังทุกเย็น", right: "ข้อ 6 สร้างความสัมพันธ์ในครอบครัวให้อบอุ่น" }
      - { left: "สวมหมวกนิรภัยเมื่อซ้อนจักรยานยนต์", right: "ข้อ 7 ป้องกันอุบัติภัยด้วยความไม่ประมาท" }
      - { left: "ไม่ทิ้งขยะลงคลอง", right: "ข้อ 10 มีสำนึกต่อส่วนรวม ร่วมสร้างสรรค์สังคม" }
    hints:
      - "หาคำสำคัญ เช่น สะอาด อาหาร ครอบครัว อุบัติภัย ส่วนรวม"
      - "การไม่ทิ้งขยะลงคลองช่วยคนอื่นในชุมชนด้วย"
    solution: "อาบน้ำ ตัดเล็บ → ข้อ 1, อาหารสุกใหม่ → ข้อ 4, คุยกับพ่อแม่ → ข้อ 6, หมวกนิรภัย → ข้อ 7, ไม่ทิ้งขยะลงคลอง → ข้อ 10"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.hygiene.national-health-rules.p005
    topics: [health.hygiene.national-health-rules]
    difficulty: 2
    type: numeric
    stem: "จากตารางบันทึกพฤติกรรมของน้ำใส ในสัปดาห์นี้น้ำใสออกกำลังกายอย่างน้อย 60 นาทีกี่วัน (ตอบเป็นตัวเลขในหน่วยวัน)"
    figure:
      src: habit-tracker.svg
      alt: "ตารางบันทึก 7 วัน (จันทร์ถึงอาทิตย์) ของน้ำใส 4 พฤติกรรม เครื่องหมายถูกคือทำ กากบาทคือไม่ได้ทำ แปรงฟันก่อนนอน: ทำ ทำ ทำ ทำ ไม่ได้ทำ ทำ ทำ ล้างมือก่อนกินข้าวกลางวัน: ทำ ไม่ได้ทำ ทำ ไม่ได้ทำ ทำ ทำ ทำ ออกกำลังกายอย่างน้อย 60 นาที: ทำ ไม่ได้ทำ ทำ ไม่ได้ทำ ทำ ไม่ได้ทำ ทำ สวมหมวกนิรภัยเมื่อซ้อนจักรยานยนต์: ทำทุกวัน"
    answer: { value: 4, unit: วัน }
    misconceptions:
      - { match: 3, feedback: "นับเครื่องหมายกากบาทแทนเครื่องหมายถูก ต้องนับวันที่ทำ" }
    hints:
      - "ดูแถวที่สามของตาราง"
      - "นับเฉพาะเครื่องหมายถูกสีเขียว"
    solution: "แถวออกกำลังกายมีเครื่องหมายถูกวันจันทร์ พุธ ศุกร์ และอาทิตย์ รวม 4 วัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.hygiene.national-health-rules.p006
    topics: [health.hygiene.national-health-rules]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดแสดงว่ามีสุขภาพดี (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "มีแรงเล่นและเรียนได้ทั้งวัน ไม่ค่อยเจ็บป่วย", correct: true }
      - { id: b, text: "อารมณ์ดี ยิ้มแย้ม เมื่อโกรธก็ค่อย ๆ สงบลงได้", correct: true }
      - { id: c, text: "มีเพื่อนเล่นด้วย ช่วยเหลือเพื่อนได้", correct: true }
      - { id: d, text: "นอนดึกทุกคืนจนง่วงในห้องเรียน", feedback: "นอนไม่พอทำให้ร่างกายอ่อนเพลียและอารมณ์ไม่ดี ไม่ใช่สัญญาณของสุขภาพดี" }
      - { id: e, text: "เก็บตัวไม่คุยกับใครเลยเพราะไม่มีความสุข", feedback: "ความไม่มีความสุขต่อเนื่องเป็นสัญญาณว่าสุขภาพใจต้องการการดูแล ควรคุยกับผู้ใหญ่ที่ไว้ใจ" }
    hints:
      - "ดูให้ครบทั้งด้านกาย ใจ และสังคม"
      - "ข้อที่ถูกมีสามข้อ"
    solution: "ข้อที่ถูกคือ แข็งแรงไม่ค่อยป่วย (กาย) อารมณ์ดีจัดการอารมณ์ได้ (ใจ) และมีเพื่อน ช่วยเหลือผู้อื่น (สังคม)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.hygiene.national-health-rules.p007
    topics: [health.hygiene.national-health-rules]
    difficulty: 2
    type: text
    stem: "เติมคำในสุขบัญญัติข้อ 9: ทำจิตใจให้ ______ แจ่มใสอยู่เสมอ"
    accepted: ["ร่าเริง"]
    misconceptions:
      - { match: "สะอาด", feedback: "คำว่าสะอาดอยู่ในข้อ 1 และข้อ 3 ข้อ 9 พูดถึงจิตใจที่ร่าเริง" }
    hints:
      - "เป็นคำที่บอกว่าใจสดชื่น สนุก"
      - "คำนี้มักใช้คู่กับคำว่าแจ่มใส"
    solution: "ทำจิตใจให้ร่าเริงแจ่มใสอยู่เสมอ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.hygiene.national-health-rules.p008
    topics: [health.hygiene.national-health-rules]
    difficulty: 3
    type: numeric
    stem: "จากตารางบันทึกพฤติกรรมของน้ำใส น้ำใสล้างมือก่อนกินข้าวกลางวันคิดเป็นร้อยละเท่าใดของ 7 วัน (ตอบทศนิยม 2 ตำแหน่ง หน่วยร้อยละ)"
    figure:
      src: habit-tracker.svg
      alt: "ตารางบันทึก 7 วัน (จันทร์ถึงอาทิตย์) ของน้ำใส 4 พฤติกรรม เครื่องหมายถูกคือทำ กากบาทคือไม่ได้ทำ แปรงฟันก่อนนอน: ทำ ทำ ทำ ทำ ไม่ได้ทำ ทำ ทำ ล้างมือก่อนกินข้าวกลางวัน: ทำ ไม่ได้ทำ ทำ ไม่ได้ทำ ทำ ทำ ทำ ออกกำลังกายอย่างน้อย 60 นาที: ทำ ไม่ได้ทำ ทำ ไม่ได้ทำ ทำ ไม่ได้ทำ ทำ สวมหมวกนิรภัยเมื่อซ้อนจักรยานยนต์: ทำทุกวัน"
    answer: { value: 71.43, unit: "%", tolerance: 0.5 }
    misconceptions:
      - { match: 140, feedback: "หารกลับด้าน ต้องเอาจำนวนวันที่ทำ (5) หารด้วยจำนวนวันทั้งหมด (7)" }
      - { match: 28.57, feedback: "นี่คือร้อยละของวันที่ไม่ได้ล้างมือ (2 วัน) คำถามถามวันที่ล้างมือ" }
    hints:
      - "นับวันที่มีเครื่องหมายถูกในแถวล้างมือ"
      - "ร้อยละ = จำนวนวันที่ทำ ÷ จำนวนวันทั้งหมด × 100"
    solution: "ล้างมือ 5 วันจาก 7 วัน $\\frac{5}{7} \\times 100 \\approx 71.43\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.hygiene.national-health-rules.p009
    topics: [health.hygiene.national-health-rules]
    difficulty: 3
    type: mcq
    stem: "งานบุญในหมู่บ้านมีอาหารหลายอย่าง ข้อใดเลือกตามสุขบัญญัติข้อ 4 ได้ดีที่สุด"
    choices:
      - { id: a, text: "ลาบหมูที่ปรุงสุก และแกงที่เพิ่งต้มเสร็จ", correct: true }
      - { id: b, text: "ลาบหมูดิบ เพราะคนในหมู่บ้านกินกันมานาน", feedback: "เนื้อหมูดิบอาจมีพยาธิและเชื้อแบคทีเรียที่ทำให้ป่วยรุนแรง ควรกินอาหารที่ปรุงสุก" }
      - { id: c, text: "ขนมสีชมพูสดที่ไม่รู้ว่าใช้สีอะไร", feedback: "สุขบัญญัติข้อ 4 ให้หลีกเลี่ยงอาหารสีฉูดฉาด เพราะอาจใช้สีที่ไม่ปลอดภัย" }
      - { id: d, text: "ส้มตำที่เผ็ดและเค็มจัดมาก", feedback: "สุขบัญญัติข้อ 4 ให้หลีกเลี่ยงอาหารรสจัด" }
    hints:
      - "ข้อ 4 คือ กินอาหารสุก สะอาด ปราศจากสารอันตราย และหลีกเลี่ยงอาหารรสจัด สีฉูดฉาด"
      - "ตัดตัวเลือกที่ดิบ สีจัด หรือรสจัดออก"
    solution: "อาหารที่ปรุงสุกใหม่ปลอดภัยที่สุด อาหารดิบ สีฉูดฉาด และรสจัดขัดกับสุขบัญญัติข้อ 4"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.hygiene.national-health-rules.p010
    topics: [health.hygiene.national-health-rules]
    difficulty: 3
    type: mcq
    stem: "สุขบัญญัติข้อใดช่วยสุขภาพใจโดยตรงมากที่สุด"
    choices:
      - { id: a, text: "ข้อ 9 ทำจิตใจให้ร่าเริงแจ่มใสอยู่เสมอ", correct: true }
      - { id: b, text: "ข้อ 2 รักษาฟันให้แข็งแรงและแปรงฟันทุกวันอย่างถูกต้อง", feedback: "ข้อ 2 ดูแลสุขภาพช่องปาก ซึ่งเป็นสุขภาพกาย" }
      - { id: c, text: "ข้อ 3 ล้างมือให้สะอาดก่อนกินอาหารและหลังขับถ่าย", feedback: "ข้อ 3 ป้องกันเชื้อโรค ซึ่งช่วยสุขภาพกาย" }
      - { id: d, text: "ข้อ 4 กินอาหารสุก สะอาด", feedback: "ข้อ 4 ดูแลเรื่องอาหาร ซึ่งช่วยสุขภาพกายเป็นหลัก" }
    hints:
      - "หาข้อที่มีคำว่าจิตใจ"
      - "สุขภาพใจคือความรู้สึกและอารมณ์"
    solution: "ข้อ 9 ทำจิตใจให้ร่าเริงแจ่มใส เกี่ยวกับสุขภาพใจโดยตรง (ข้อ 6 ครอบครัวอบอุ่นก็ช่วยสุขภาพใจเช่นกัน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.hygiene.national-health-rules.p011
    topics: [health.hygiene.national-health-rules]
    difficulty: 3
    type: numeric
    stem: "จากตารางบันทึกพฤติกรรมของน้ำใส ทั้งสัปดาห์มีเครื่องหมายถูกรวมทั้งหมดกี่ช่อง (ตอบเป็นตัวเลขในหน่วยช่อง)"
    figure:
      src: habit-tracker.svg
      alt: "ตารางบันทึก 7 วัน (จันทร์ถึงอาทิตย์) ของน้ำใส 4 พฤติกรรม เครื่องหมายถูกคือทำ กากบาทคือไม่ได้ทำ แปรงฟันก่อนนอน: ทำ ทำ ทำ ทำ ไม่ได้ทำ ทำ ทำ ล้างมือก่อนกินข้าวกลางวัน: ทำ ไม่ได้ทำ ทำ ไม่ได้ทำ ทำ ทำ ทำ ออกกำลังกายอย่างน้อย 60 นาที: ทำ ไม่ได้ทำ ทำ ไม่ได้ทำ ทำ ไม่ได้ทำ ทำ สวมหมวกนิรภัยเมื่อซ้อนจักรยานยนต์: ทำทุกวัน"
    answer: { value: 22, unit: ช่อง }
    misconceptions:
      - { match: 28, feedback: "28 คือจำนวนช่องทั้งหมด (4 แถว × 7 วัน) ต้องลบช่องที่เป็นกากบาทออก" }
      - { match: 6, feedback: "6 คือจำนวนช่องกากบาท คำถามถามช่องที่มีเครื่องหมายถูก" }
    hints:
      - "นับเครื่องหมายถูกทีละแถว แล้วนำมาบวกกัน"
      - "หรือนับช่องทั้งหมดแล้วลบช่องกากบาท"
    solution: "แปรงฟัน 6 + ล้างมือ 5 + ออกกำลังกาย 4 + หมวกนิรภัย 7 = 22 ช่อง (หรือ 28 − 6 = 22)"
    license: CC-BY-SA-4.0
