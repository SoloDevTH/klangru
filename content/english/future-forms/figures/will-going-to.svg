<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" font-family="sans-serif">
<title>เลือก will หรือ be going to</title>
<rect x="0" y="0" width="760" height="310" fill="#fff"/>
<rect x="30.0" y="20.0" width="340.0" height="110.0" rx="10" fill="#eef4fb" stroke="#1f4e9c" stroke-width="2"/>
<text x="200.0" y="58.2" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">will</text>
<text x="200.0" y="80.2" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">ตัดสินใจทันทีตอนพูด เสนอช่วย สัญญา</text>
<text x="200.0" y="102.2" font-size="15" text-anchor="middle" fill="#111" font-weight="normal" font-style="italic">I'll carry your bag.</text>
<rect x="390.0" y="20.0" width="340.0" height="110.0" rx="10" fill="#eaf6ea" stroke="#2e7d32" stroke-width="2"/>
<text x="560.0" y="58.2" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">be going to</text>
<text x="560.0" y="80.2" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">แผนหรือความตั้งใจที่คิดไว้ก่อน</text>
<text x="560.0" y="102.2" font-size="15" text-anchor="middle" fill="#111" font-weight="normal" font-style="italic">I'm going to visit Grandma on Saturday.</text>
<rect x="30.0" y="150.0" width="340.0" height="110.0" rx="10" fill="#eef4fb" stroke="#1f4e9c" stroke-width="2"/>
<text x="200.0" y="188.2" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">will</text>
<text x="200.0" y="210.2" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">คาดเดาจากความคิดเห็น (I think ...)</text>
<text x="200.0" y="232.2" font-size="15" text-anchor="middle" fill="#111" font-weight="normal" font-style="italic">I think Thailand will win.</text>
<rect x="390.0" y="150.0" width="340.0" height="110.0" rx="10" fill="#eaf6ea" stroke="#2e7d32" stroke-width="2"/>
<text x="560.0" y="188.2" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">be going to</text>
<text x="560.0" y="210.2" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">คาดเดาจากสิ่งที่เห็นตอนนี้</text>
<text x="560.0" y="232.2" font-size="15" text-anchor="middle" fill="#111" font-weight="normal" font-style="italic">Look at the clouds! It's going to rain.</text>
<text x="380.0" y="292.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal">ทั้งสองแบบตามด้วยกริยารูปเดิม: will go · am/is/are going to go</text>
</svg>
