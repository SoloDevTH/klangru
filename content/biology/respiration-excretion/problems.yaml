  - id: biology.humans.respiration-excretion.p017
    topics: [biology.humans.respiration-excretion]
    difficulty: 5
    type: numeric
    stem: "อากาศหายใจเข้ามีออกซิเจนร้อยละ 21 อากาศหายใจออกมีร้อยละ 16 ถ้าหายใจครั้งละ 500 มิลลิลิตร นาทีละ 15 ครั้ง ร่างกายรับออกซิเจนไว้ประมาณกี่มิลลิลิตรต่อนาที (สมมติว่าปริมาตรอากาศเข้าและออกเท่ากัน)"
    answer: { value: 375, unit: mL/นาที }
    hints:
      - "ในการหายใจแต่ละครั้ง ออกซิเจนหายไปร้อยละ 21 − 16 ของ 500 มิลลิลิตร"
      - "หาออกซิเจนที่รับต่อครั้งก่อน แล้วคูณด้วย 15"
    misconceptions:
      - { match: 25, feedback: "นี่คือออกซิเจนที่รับต่อการหายใจครั้งเดียว ต้องคูณด้วย 15 ครั้งต่อนาที" }
      - { match: 1200, feedback: "นี่คือออกซิเจนที่ยังเหลือในลมหายใจออก (ร้อยละ 16) ต้องใช้ส่วนที่หายไป คือร้อยละ 5" }
    solution: "ออกซิเจนที่รับต่อครั้ง $= 500 \\times \\frac{21 - 16}{100} = 25$ มิลลิลิตร ต่อนาที $= 25 \\times 15 = 375$ มิลลิลิตร"
    license: CC-BY-SA-4.0
    ai_assisted: true
