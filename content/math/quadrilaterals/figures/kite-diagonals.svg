  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7a76"/></marker></defs>
  <polygon points="135.0,25.0 210.0,100.0 135.0,265.0 60.0,100.0" fill="#e2f0ed" stroke="#15211e" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="135.0" y1="25.0" x2="135.0" y2="265.0" stroke="#15211e" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="60.0" y1="100.0" x2="210.0" y2="100.0" stroke="#15211e" stroke-width="2" stroke-dasharray="6 4"/>
