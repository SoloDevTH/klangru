<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="sans-serif" font-size="15">
  <title>วงจรรับรู้ คิด และลงมือของหุ่นยนต์ดูดฝุ่น รับรู้ด้วยเซนเซอร์ชนและกล้อง คิดด้วยแผนที่ห้องและการเลือกเส้นทาง ลงมือด้วยล้อและแปรง แล้วผลจากการลงมือเปลี่ยนสิ่งที่รับรู้ในรอบถัดไป</title>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
  <rect x="30.0" y="50.0" width="200.0" height="120.0" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="130.0" y="85.0" font-size="18" text-anchor="middle" fill="#1d4ed8" font-weight="bold" xml:space="preserve">รับรู้ (sense)</text>
  <text x="130.0" y="118.0" font-size="14" text-anchor="middle" fill="#111827" xml:space="preserve">เซนเซอร์ชน กล้อง</text>
  <text x="130.0" y="144.0" font-size="14" text-anchor="middle" fill="#111827" xml:space="preserve">เซนเซอร์วัดระยะ</text>
  <rect x="280.0" y="50.0" width="200.0" height="120.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="380.0" y="85.0" font-size="18" text-anchor="middle" fill="#b45309" font-weight="bold" xml:space="preserve">คิด (think)</text>
  <text x="380.0" y="118.0" font-size="14" text-anchor="middle" fill="#111827" xml:space="preserve">สร้างแผนที่ห้อง</text>
  <text x="380.0" y="144.0" font-size="14" text-anchor="middle" fill="#111827" xml:space="preserve">เลือกเส้นทาง เลี่ยงสิ่งกีดขวาง</text>
  <rect x="530.0" y="50.0" width="200.0" height="120.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="630.0" y="85.0" font-size="18" text-anchor="middle" fill="#15803d" font-weight="bold" xml:space="preserve">ลงมือ (act)</text>
  <text x="630.0" y="118.0" font-size="14" text-anchor="middle" fill="#111827" xml:space="preserve">หมุนล้อ เปิดแปรง</text>
  <text x="630.0" y="144.0" font-size="14" text-anchor="middle" fill="#111827" xml:space="preserve">กลับแท่นชาร์จ</text>
  <line x1="232.0" y1="110.0" x2="278.0" y2="110.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="482.0" y1="110.0" x2="528.0" y2="110.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <polyline points="630.0,172.0 630.0,230.0 130.0,230.0 130.0,176.0" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="124,180 136,180 130,172" fill="#7c3aed"/>
  <text x="380.0" y="220.0" font-size="14" text-anchor="middle" fill="#7c3aed" font-weight="bold" xml:space="preserve">สิ่งรอบตัวเปลี่ยน แล้วรับรู้ใหม่ในรอบถัดไป</text>
  <text x="380.0" y="280.0" font-size="14" text-anchor="middle" fill="#4b5563" xml:space="preserve">ระบบ AI ทางกายภาพทำวงจรนี้ซ้ำหลายครั้งต่อวินาที</text>
</svg>
