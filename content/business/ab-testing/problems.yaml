problems:
- id: business.marketing.ab-testing.p001
  topics:
  - business.marketing.ab-testing
  difficulty: 1
  type: mcq
  stem: ทำไมการทดลอง A/B ต้อง **สุ่ม** ผู้ใช้เข้ากลุ่ม A หรือ B
  choices:
  - id: a
    text: เพื่อให้สองกลุ่มเหมือนกันโดยเฉลี่ยในทุกเรื่อง ผลต่างที่เกิดจึงมาจากสิ่งที่เปลี่ยนเท่านั้น (หรือความบังเอิญ)
    correct: true
  - id: b
    text: เพื่อให้ได้ผู้ใช้จำนวนมากขึ้น
    feedback: การสุ่มไม่เพิ่มจำนวนคน แต่ทำให้กลุ่มเปรียบเทียบกันได้
  - id: c
    text: เพื่อให้กลุ่ม B ได้ลูกค้าที่ซื้อบ่อย
    feedback: นั่นคือการเลือกแบบลำเอียง ผลต่างจะมาจากตัวลูกค้า ไม่ใช่จากหน้าเว็บ
  - id: d
    text: เพื่อไม่ต้องมีกลุ่มควบคุม
    feedback: กลุ่ม A คือกลุ่มควบคุม จำเป็นต้องมีเพื่อเทียบ
  hints:
  - ถ้าให้ลูกค้าประจำเห็นแบบ B ทั้งหมด ผลต่างมาจากอะไร
  - การสุ่มป้องกันตัวแปรแทรกซ้อน
  solution: การสุ่มจัดกลุ่มทำให้ตัวแปรที่เราไม่ได้วัด เช่น อายุ อุปกรณ์ ความภักดี กระจายเท่า ๆ กันในสองกลุ่ม ผลต่างที่เหลือจึงมาจากสิ่งที่เปลี่ยน (ตัวแปรต้น) หรือความบังเอิญ ซึ่งการทดสอบทางสถิติช่วยแยกได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.ab-testing.p002
  topics:
  - business.marketing.ab-testing
  difficulty: 1
  type: match
  stem: จับคู่คำกับความหมายในการทดลอง A/B
  pairs:
  - left: สมมติฐานว่าง $H_0$
    right: $p_A = p_B$ หน้าใหม่ไม่ได้เปลี่ยนอัตราการซื้อ
  - left: ค่า p
    right: ความน่าจะเป็นที่จะได้ผลต่างอย่างน้อยเท่าที่เห็น ถ้า $H_0$ เป็นจริง
  - left: ระดับนัยสำคัญ $\alpha$
    right: เกณฑ์ที่ตั้งไว้ก่อนทดลอง มักเป็น 0.05
  - left: กำลังการทดสอบ
    right: ความน่าจะเป็นที่จะตรวจพบผลต่างเมื่อผลต่างนั้นมีอยู่จริง
  hints:
  - ค่า p คำนวณภายใต้สมมติฐานว่าง
  - กำลังการทดสอบ $= 1 - \beta$
  solution: $H_0$ คือไม่มีผลต่าง ค่า p วัดว่าข้อมูลขัดกับ $H_0$ เพียงใด $\alpha$ ตั้งไว้ก่อนเก็บข้อมูล และกำลังการทดสอบคือโอกาสจับผลต่างจริงได้ ซึ่งขึ้นกับขนาดตัวอย่าง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.ab-testing.p003
  topics:
  - business.marketing.ab-testing
  difficulty: 2
  type: numeric
  stem: แอปสั่งอาหาร (สมมติ) ทดสอบหน้าชำระเงินใหม่ กลุ่ม A ซื้อ $4\%$ กลุ่ม B ซื้อ $5\%$ B ดีกว่า A กี่ **เปอร์เซ็นต์เมื่อเทียบกับ A** (relative lift)
  answer:
    value: 25.0
    unit: '%'
  misconceptions:
  - match: 1.0
    feedback: นั่นคือผลต่างเป็นจุดเปอร์เซ็นต์ ไม่ใช่เทียบกับ A
  - match: 20.0
    feedback: หารด้วย B แทน A
  hints:
  - ผลต่างสัมบูรณ์ $= 5 - 4 = 1$ จุดเปอร์เซ็นต์
  - 'เทียบกับ A: $1/4$'
  solution: ผลต่างสัมบูรณ์ 1 จุดเปอร์เซ็นต์ เทียบกับ A $= 1/4 = 25\%$ รายงานทั้งสองแบบให้ชัด เพราะ "เพิ่ม 25%" กับ "เพิ่ม 1%" ฟังต่างกันมากแต่มาจากข้อมูลเดียวกัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.ab-testing.p004
  topics:
  - business.marketing.ab-testing
  difficulty: 2
  type: numeric
  stem: กลุ่ม A ผู้เข้าชม $4{,}000$ คน ซื้อ $160$ คน กลุ่ม B ผู้เข้าชม $2{,}500$ คน ซื้อ $150$ คน จงหาสัดส่วนรวม (pooled) $\hat p$ ที่ใช้ในการทดสอบ z ภายใต้ $H_0$ (ตอบเป็นร้อยละ ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 4.769231
    tolerance: 0.02
    unit: '%'
  misconceptions:
  - match: 5.0
    feedback: เฉลี่ยสองสัดส่วนตรง ๆ ใช้ได้เฉพาะเมื่อสองกลุ่มขนาดเท่ากัน
  hints:
  - $\hat p = \dfrac{x_A + x_B}{n_A + n_B}$
  - รวมผู้ซื้อและผู้เข้าชมของสองกลุ่มก่อนหาร
  solution: $\hat p = \dfrac{160 + 150}{4{,}000 + 2{,}500} = \dfrac{310}{6{,}500} = 0.0477$ หรือ $4.77\%$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.ab-testing.p005
  topics:
  - business.marketing.ab-testing
  difficulty: 2
  type: mcq
  stem: การทดลองได้ค่า p $= 0.03$ ข้อใดตีความถูกต้อง
  choices:
  - id: a
    text: ถ้าหน้าใหม่ไม่ได้ต่างจากหน้าเดิมจริง โอกาสที่จะเห็นผลต่างมากเท่านี้หรือมากกว่ามีราว 3%
    correct: true
  - id: b
    text: มีโอกาส 97% ที่หน้าใหม่ดีกว่า
    feedback: ค่า p ไม่ใช่ความน่าจะเป็นที่สมมติฐานเป็นจริง คำนวณภายใต้สมมติฐานว่าง
  - id: c
    text: มีโอกาส 3% ที่ผลการทดลองผิด
    feedback: ค่า p ไม่ได้บอกความน่าจะเป็นที่ข้อสรุปผิดโดยตรง
  - id: d
    text: หน้าใหม่เพิ่มยอดขาย 3%
    feedback: ค่า p ไม่ได้วัดขนาดของผล ต้องดูผลต่างและช่วงความเชื่อมั่น
  hints:
  - ค่า p คำนวณโดยสมมติว่าอะไรเป็นจริง
  - ค่า p ไม่ใช่ขนาดของผล
  solution: ค่า p คือ $P(\text{ผลต่างอย่างน้อยเท่าที่เห็น} \mid H_0)$ ค่าเล็กหมายความว่าข้อมูลไม่ค่อยเข้ากับ $H_0$ จึงปฏิเสธ $H_0$ ที่ $\alpha = 0.05$ แต่ไม่ได้บอกว่าผลใหญ่แค่ไหนหรือหน้าใหม่ดีกว่ากี่เปอร์เซ็นต์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.ab-testing.p006
  topics:
  - business.marketing.ab-testing
  difficulty: 2
  type: mcq
  stem: ข้อใด **ไม่เหมาะสม** ทางจริยธรรมในการทดลอง A/B ของแอปธนาคาร
  choices:
  - id: a
    text: แสดงอัตราดอกเบี้ยเงินกู้ต่างกันให้ลูกค้าสองกลุ่มโดยไม่บอก เพื่อดูว่ากลุ่มใดยอมกู้มากกว่า
    correct: true
  - id: b
    text: ทดสอบสีปุ่มสองแบบกับผู้ใช้ที่ยอมรับนโยบายการใช้ข้อมูลแล้ว
    feedback: เป็นการเปลี่ยนการออกแบบที่ไม่ทำให้ผู้ใช้เสียประโยชน์ และใช้ข้อมูลตามที่ได้รับความยินยอม
  - id: c
    text: ทดสอบข้อความแจ้งเตือนชำระบิลสองแบบเพื่อดูว่าแบบใดช่วยให้จ่ายตรงเวลามากขึ้น
    feedback: ทั้งสองแบบให้ข้อมูลถูกต้องและเป็นประโยชน์กับผู้ใช้
  - id: d
    text: เก็บเฉพาะข้อมูลที่จำเป็นต่อการวัดผล และรายงานผลแบบไม่ระบุตัวบุคคล
    feedback: เป็นแนวปฏิบัติที่ดีตามหลักการคุ้มครองข้อมูลส่วนบุคคล
  hints:
  - การทดลองใดทำให้ผู้ใช้กลุ่มหนึ่งเสียประโยชน์ทางการเงินโดยไม่รู้ตัว
  - 'จริยธรรมของการทดลอง: ไม่ทำอันตราย ความยินยอม ความเป็นธรรม'
  solution: การทดลองกับมนุษย์ต้องไม่ทำให้ผู้เข้าร่วมเสียหาย ต้องเคารพความยินยอมและความเป็นส่วนตัว (ประเทศไทยมีกฎหมายคุ้มครองข้อมูลส่วนบุคคล) การให้อัตราดอกเบี้ยต่างกันโดยไม่เปิดเผยทำให้ลูกค้าบางกลุ่มเสียเงินจริงและไม่เป็นธรรม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.ab-testing.p007
  topics:
  - business.marketing.ab-testing
  difficulty: 3
  type: numeric
  stem: ร้านผ้าไหมออนไลน์ (สมมติ ดูตาราง) ทดสอบสีปุ่ม จงหาค่าสถิติทดสอบ z ของผลต่างสองสัดส่วน (B − A) โดยใช้สัดส่วนรวม
  answer:
    value: 2.182314
    tolerance: 0.03
  misconceptions:
  - match: 3.086258
    feedback: ใช้ $1/n$ ของกลุ่มเดียว ต้องรวม $1/n_A + 1/n_B$
  - match: 529.165858
    feedback: ลืมถอดรากที่สอง
  figure: &id001
    src: p-dashboard.svg
    alt: ตารางผลการทดลอง A/B ของร้านผ้าไหมออนไลน์ (สมมติ) กลุ่ม A ปุ่มใส่ตะกร้าสีเทา (เดิม) ผู้เข้าชม 5,000 คน ผู้ซื้อ 200 คน กลุ่ม B ปุ่มใส่ตะกร้าสีส้ม (ใหม่) ผู้เข้าชม 5,000 คน ผู้ซื้อ 245 คน ใต้ตารางเขียนว่าสุ่มผู้เข้าชมเข้ากลุ่มละครึ่ง ทดลองพร้อมกัน 14 วัน
  hints:
  - $\hat p_A = 0.040$, $\hat p_B = 0.049$, $\hat p = 445/10{,}000$
  - $z = \dfrac{\hat p_B - \hat p_A}{\sqrt{\hat p(1 - \hat p)\left(\frac{1}{n_A} + \frac{1}{n_B}\right)}}$
  solution: '$\hat p = 0.0445$, $SE = \sqrt{0.0445(0.9555)(2/5{,}000)} = 0.00412$ ได้ $z = 0.009/0.00412 = 2.18$ (ตรวจ: $z^2$ เท่ากับไคกำลังสองของตาราง 2 × 2)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.ab-testing.p008
  topics:
  - business.marketing.ab-testing
  difficulty: 3
  type: numeric
  stem: จากข้อก่อน ($z = 2.18$) ค่า p แบบสองทางเป็นกี่เปอร์เซ็นต์ (เช่น ค่า p $= 0.123$ ตอบ $12.3$)
  answer:
    value: 2.908639
    tolerance: 0.1
    unit: '%'
  misconceptions:
  - match: 1.45432
    feedback: นั่นคือหางเดียว ต้องคูณ 2
  - match: 98.54568
    feedback: นั่นคือพื้นที่ทางซ้าย ไม่ใช่หาง
  figure: *id001
  hints:
  - ค่า p สองทาง $= 2\,P(Z > |z|)$
  - ใช้ตารางปกติมาตรฐานหรือ NormalDist().cdf ของ python
  solution: $P(Z > 2.18) = 0.0145$ ค่า p สองทาง $= 0.029$ หรือ $2.9\%$ น้อยกว่า $0.05$ จึงปฏิเสธ $H_0$ ที่ระดับนัยสำคัญ 0.05
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.ab-testing.p009
  topics:
  - business.marketing.ab-testing
  difficulty: 3
  type: numeric
  stem: จากตารางเดียวกัน จงหาขอบบนของช่วงความเชื่อมั่น 95% ของผลต่าง $p_B - p_A$ (ตอบเป็นจุดเปอร์เซ็นต์ ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 1.708124
    tolerance: 0.02
    unit: จุดเปอร์เซ็นต์
  misconceptions:
  - match: 1.578247
    feedback: ใช้ 1.645 ซึ่งเป็นค่าของช่วง 90%
  - match: 0.903332
    feedback: ลืมถอดรากที่สองของความแปรปรวน
  figure: *id001
  hints:
  - 'ช่วงความเชื่อมั่นใช้ $SE$ แบบไม่รวม: $\sqrt{\frac{\hat p_A(1-\hat p_A)}{n_A} + \frac{\hat p_B(1-\hat p_B)}{n_B}}$'
  - $(\hat p_B - \hat p_A) \pm 1.96\,SE$
  solution: $SE = \sqrt{0.04(0.96)/5{,}000 + 0.049(0.951)/5{,}000} = 0.00412$ ช่วง $= 0.009 \pm 1.96(0.00412) = (0.0009, 0.0171)$ หรือ $0.09$ ถึง $1.71$ จุดเปอร์เซ็นต์ ไม่ครอบคลุมศูนย์ สอดคล้องกับค่า p < 0.05
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.ab-testing.p010
  topics:
  - business.marketing.ab-testing
  difficulty: 3
  type: order
  stem: เรียงขั้นตอนการทำการทดลอง A/B ให้ถูกต้อง
  items:
  - กำหนดตัวชี้วัดหลัก สมมติฐาน และผลต่างเล็กที่สุดที่มีความหมายทางธุรกิจ
  - คำนวณขนาดตัวอย่างและระยะเวลาทดลอง
  - สุ่มผู้ใช้เข้ากลุ่ม A และ B แล้วทดลองพร้อมกัน
  - เก็บข้อมูลจนครบขนาดตัวอย่างที่วางไว้ โดยไม่หยุดก่อนเพราะเห็นผลดี
  - ทดสอบนัยสำคัญ หาช่วงความเชื่อมั่น แล้วตัดสินใจ
  hints:
  - ขนาดตัวอย่างต้องรู้ก่อนเริ่มเก็บข้อมูล
  - การวิเคราะห์ทำเมื่อเก็บข้อมูลครบ
  solution: วางแผน (ตัวชี้วัด สมมติฐาน ผลต่างที่มีความหมาย) → ขนาดตัวอย่าง → สุ่มและทดลองพร้อมกัน → เก็บข้อมูลจนครบ → วิเคราะห์และตัดสินใจ การกำหนดทุกอย่างไว้ก่อนช่วยป้องกันการเลือกผลที่ถูกใจภายหลัง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.ab-testing.p011
  topics:
  - business.marketing.ab-testing
  difficulty: 4
  type: numeric
  stem: ร้านค้าออนไลน์มีอัตราการซื้อเดิม $4\%$ ต้องการตรวจจับการเพิ่มเป็น $5\%$ ที่ $\alpha = 0.05$ (สองทาง) และกำลังการทดสอบ $80\%$ ใช้ $z_{0.025} = 1.96$, $z_{0.20} = 0.84$ ต้องการผู้เข้าชมกลุ่มละประมาณกี่คน
  answer:
    value: 6735.0
    tolerance: 30.0
    unit: คน
  misconceptions:
  - match: 3299.9344
    feedback: ไม่ได้รวม $z_\beta$ ของกำลังการทดสอบ
  - match: 67.3456
    feedback: ลืมยกกำลังสองผลต่าง
  hints:
  - $n \approx \dfrac{(z_{\alpha/2} + z_\beta)^2\left[p_1(1-p_1) + p_2(1-p_2)\right]}{(p_2 - p_1)^2}$
  - $(2.8)^2 = 7.84$ และ $p_1(1-p_1) + p_2(1-p_2) = 0.0384 + 0.0475$
  solution: $n \approx \dfrac{7.84 \times 0.0859}{0.01^2} = 6{,}734.6$ ปัดขึ้นเป็น $6{,}735$ คนต่อกลุ่ม (ใช้ค่า z ละเอียดจะได้ราว 6{,}742) ผลต่างเล็กต้องใช้ตัวอย่างมากเพราะ $n$ แปรผกผันกับกำลังสองของผลต่าง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.ab-testing.p012
  topics:
  - business.marketing.ab-testing
  difficulty: 4
  type: mcq
