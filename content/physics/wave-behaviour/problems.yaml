    ai_assisted: true

  - id: phy.wbeh.p017
    topics: [physics.waves.wave-behaviour]
    difficulty: 3
    type: numeric
    stem: "ในถาดคลื่น คลื่นน้ำมีความยาวคลื่น $2.0\\ \\mathrm{cm}$ ในเขตน้ำลึก เมื่อเข้าสู่เขตน้ำตื้นความยาวคลื่นเหลือ $1.5\\ \\mathrm{cm}$ ถ้ามุมตกกระทบเป็น $40^\\circ$ มุมหักเหเป็นกี่องศา (ตอบเป็นตัวเลขในหน่วยองศา ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 28.8, tolerance: 0.3, unit: องศา }
    hints:
      - "ความถี่คงที่ อัตราส่วนของอัตราเร็วจึงเท่ากับอัตราส่วนของความยาวคลื่น"
      - "$\\sin\\theta_2 = \\sin\\theta_1 \\times \\dfrac{\\lambda_2}{\\lambda_1}$"
    misconceptions:
      - { match: 59, feedback: "ดูเหมือนกลับอัตราส่วน คลื่นเข้าน้ำตื้นช้าลง ต้องเบนเข้าหาเส้นปกติ มุมหักเหต้องเล็กกว่ามุมตกกระทบ" }
      - { match: 30, feedback: "ดูเหมือนคูณมุมด้วย $\\tfrac{1.5}{2.0}$ โดยตรง สิ่งที่เป็นสัดส่วนกับความยาวคลื่นคือ $\\sin\\theta$ ไม่ใช่ตัวมุม" }
    solution: "$\\sin\\theta_2 = \\sin 40^\\circ \\times \\dfrac{1.5}{2.0} = 0.643 \\times 0.75 \\approx 0.482$ จึงได้ $\\theta_2 \\approx 28.8^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wbeh.p018
    topics: [physics.waves.wave-behaviour]
    difficulty: 3
    type: numeric
    stem: "ในภาพรูปแบบการแทรกสอดของคลื่นน้ำจากแหล่ง $S_1$ และ $S_2$ ซึ่งเฟสตรงกัน คลื่นมีความยาวคลื่น $1.5\\ \\mathrm{cm}$ จุด X เป็นจุดใดก็ได้บนแนว $N_2$ ระยะจาก X ถึงแหล่งทั้งสองต่างกันกี่เซนติเมตร (ตอบเป็นตัวเลขในหน่วย cm)"
    figure:
      src: interference-pattern.svg
      alt: "แหล่งกำเนิดคลื่นน้ำ S1 และ S2 วงกลมทึบคือสันคลื่น วงกลมประคือท้องคลื่น เส้นสีส้มคือแนวปฏิบัพ A0 ตรงกลาง แล้ว A1, A2 ออกไปทั้งสองข้าง เส้นประสีน้ำเงินคือแนวบัพ N1, N2, N3 ทั้งสองข้าง โดย N1 อยู่ระหว่าง A0 กับ A1 และ N2 อยู่ระหว่าง A1 กับ A2"
    answer: { value: 2.25, tolerance: 0.02, unit: cm }
    hints:
      - "แนวบัพที่ $n$ มีผลต่างระยะทาง $(n - \\tfrac{1}{2})\\lambda$"
      - "แทน $n = 2$ และ $\\lambda = 1.5\\ \\mathrm{cm}$"
    misconceptions:
      - { match: 3, feedback: "นี่คือผลต่างระยะทางของแนวปฏิบัพที่ 2 ($2\\lambda$) แนวบัพที่ 2 อยู่ก่อนถึงแนวนั้นครึ่งความยาวคลื่น" }
      - { match: 3.75, feedback: "ดูเหมือนใช้ $(n + \\tfrac{1}{2})\\lambda$ แนวบัพแนวแรก ($N_1$) มีผลต่างระยะทาง $0.5\\lambda$ แนวที่สองจึงเป็น $1.5\\lambda$" }
    solution: "แนวบัพที่ 2 มีผลต่างระยะทาง $(2 - \\tfrac{1}{2})\\lambda = 1.5 \\times 1.5 = 2.25\\ \\mathrm{cm}$ ที่จุดนี้สันจากแหล่งหนึ่งพบท้องจากอีกแหล่งเสมอ น้ำจึงแทบนิ่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wbeh.p019
    topics: [physics.waves.wave-behaviour]
    difficulty: 4
    type: numeric
    stem: "คลื่นน้ำเคลื่อนจากเขตน้ำลึกเข้าสู่เขตน้ำตื้น มุมตกกระทบ $45^\\circ$ มุมหักเห $30^\\circ$ ถ้าในเขตน้ำตื้นคลื่นมีอัตราเร็ว $20\\ \\mathrm{cm/s}$ ในเขตน้ำลึกคลื่นมีอัตราเร็วเท่าใด (ตอบเป็นตัวเลขในหน่วย cm/s ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 28.3, tolerance: 0.2, unit: cm/s }
    hints:
      - "$\\dfrac{\\sin\\theta_1}{\\sin\\theta_2} = \\dfrac{v_1}{v_2}$ โดยตัวห้อย 1 คือเขตน้ำลึก"
      - "$v_1 = v_2 \\times \\dfrac{\\sin 45^\\circ}{\\sin 30^\\circ}$"
    misconceptions:
      - { match: 14.1, feedback: "ดูเหมือนกลับอัตราส่วน น้ำลึกต้องมีคลื่นเร็วกว่าน้ำตื้น คำตอบจึงต้องมากกว่า $20\\ \\mathrm{cm/s}$" }
      - { match: 30, feedback: "ดูเหมือนใช้อัตราส่วนของมุม $\\tfrac{45}{30}$ โดยตรง ต้องใช้อัตราส่วนของ $\\sin$" }
    solution: "$v_1 = 20 \\times \\dfrac{\\sin 45^\\circ}{\\sin 30^\\circ} = 20 \\times \\dfrac{0.707}{0.5} \\approx 28.3\\ \\mathrm{cm/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wbeh.p020
    topics: [physics.waves.wave-behaviour]
    difficulty: 4
    type: mcq
