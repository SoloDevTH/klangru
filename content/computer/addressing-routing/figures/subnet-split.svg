<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250"><title>แถบที่อยู่ 192.168.10.0 ถึง 192.168.10.255 แบ่งเป็นสี่บล็อกขนาด 64 ที่อยู่</title><rect width="720" height="250" fill="#ffffff"/><rect x="40.0" y="110" width="160.0" height="56" rx="0" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.5"/><text x="120.0" y="135" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">192.168.10.0</text><text x="120.0" y="155" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal">ที่อยู่ 0 ถึง 63</text><text x="120.0" y="98" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle" font-weight="normal">ซับเน็ต /26</text><rect x="200.0" y="110" width="160.0" height="56" rx="0" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.5"/><text x="280.0" y="135" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">192.168.10.64</text><text x="280.0" y="155" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal">ที่อยู่ 64 ถึง 127</text><text x="280.0" y="98" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle" font-weight="normal">ซับเน็ต /26</text><rect x="360.0" y="110" width="160.0" height="56" rx="0" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.5"/><text x="440.0" y="135" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">192.168.10.128</text><text x="440.0" y="155" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal">ที่อยู่ 128 ถึง 191</text><text x="440.0" y="98" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle" font-weight="normal">ซับเน็ต /26</text><rect x="520.0" y="110" width="160.0" height="56" rx="0" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.5"/><text x="600.0" y="135" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">192.168.10.192</text><text x="600.0" y="155" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal">ที่อยู่ 192 ถึง 255</text><text x="600.0" y="98" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle" font-weight="normal">ซับเน็ต /26</text><line x1="233.2549019607843" y1="166" x2="233.2549019607843" y2="188" stroke="#b91c1c" stroke-width="2"/><text x="233.2549019607843" y="206" font-family="sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="bold">.77 (เครื่องนี้อยู่ในบล็อก .64 – .127)</text><text x="40" y="40" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="normal">ซับเน็ตมาสก์ 255.255.255.192 หรือ /26: 26 บิตแรกเป็นส่วนเครือข่าย เหลือ 6 บิตเป็นส่วนโฮสต์</text><text x="40" y="66" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="normal">แต่ละบล็อกมี 2^6 = 64 ที่อยู่ ใช้ได้จริง 62 ที่อยู่ (ตัดที่อยู่เครือข่ายกับที่อยู่กระจายข่าว)</text><text x="40" y="230" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">หมายเหตุ: ตัวเลขด้านบนแต่ละบล็อกเป็นส่วนท้ายสุดของที่อยู่ (ค่า octet สุดท้าย)</text></svg>
