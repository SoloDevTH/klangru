  - { framework: th-tqf-accounting, indicators: ["8.1.7"], coverage: partial, note: "หลักนิติกรรมสัญญา โมฆะ โมฆียะ แบบและหลักฐาน ซื้อขาย เช่า เช่าซื้อ กู้ยืม (เพดานดอกเบี้ย ดอกเบี้ยผิดนัด) ค้ำประกัน รูปแบบธุรกิจและการจดทะเบียน ภาษีมูลค่าเพิ่ม และกฎหมายการขายออนไลน์ ยังไม่มีกฎหมายวิชาชีพบัญชี กฎหมายการบัญชี กฎหมายแรงงาน กฎหมายบริษัทมหาชนและหลักทรัพย์โดยละเอียด และตั๋วเงิน" }
