problems:
  - id: phy.cons.p001
    topics: [physics.energy.conservation]
    difficulty: 1
    type: numeric
    stem: 'ปล่อยลูกบอลมวล $0.5\ \mathrm{kg}$ จากหยุดนิ่งที่ความสูง $10\ \mathrm{m}$ เหนือพื้น ไม่คิดแรงต้านอากาศ ขณะลูกบอลกำลังจะกระทบพื้น มีพลังงานจลน์เท่าใด ใช้ $g = 9.8\ \mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย J)'
    answer: { value: 49, tolerance: 0.5, unit: J }
    hints:
      - 'ไม่มีแรงต้าน พลังงานกลคงตัว พลังงานศักย์ที่ด้านบนเปลี่ยนเป็นพลังงานจลน์ที่พื้นทั้งหมด'
      - 'หาพลังงานศักย์ตอนเริ่มด้วย $mgh$'
    misconceptions:
      - { match: 5, feedback: 'ดูเหมือนลืมคูณ $g$ พลังงานศักย์คือ $mgh$' }
      - { match: 24.5, feedback: 'ดูเหมือนใส่ $\tfrac{1}{2}$ เข้าไปในพลังงานศักย์ ไม่ต้องหาอัตราเร็วก่อน พลังงานจลน์ที่พื้นเท่ากับ $mgh$ พอดี' }
    solution: 'ด้านบน $E_k = 0$ และ $E_p = mgh = (0.5\ \mathrm{kg})(9.8\ \mathrm{m/s^2})(10\ \mathrm{m}) = 49\ \mathrm{J}$ ที่พื้น $E_p = 0$ ดังนั้น $E_k = 49\ \mathrm{J}$'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.cons.p002
    topics: [physics.energy.conservation]
    difficulty: 2
    type: mcq
    stem: 'ลูกตุ้มแกว่งไปมาโดยไม่มีแรงต้าน ข้อใดถูกต้องเกี่ยวกับพลังงาน ณ **จุดต่ำสุด** ของการแกว่ง'
    choices:
      - { id: a, text: 'พลังงานจลน์มากที่สุด พลังงานศักย์น้อยที่สุด', correct: true }
      - { id: b, text: 'พลังงานศักย์มากที่สุด พลังงานจลน์น้อยที่สุด', feedback: 'สลับกัน พลังงานศักย์มากที่สุดที่ **ปลายการแกว่ง** ซึ่งเป็นตำแหน่งสูงสุด ส่วนจุดต่ำสุดลูกตุ้มเคลื่อนที่เร็วที่สุด' }
      - { id: c, text: 'พลังงานกลมากที่สุด', feedback: 'ไม่มีแรงต้าน พลังงานกลคงตัวทุกตำแหน่ง มีแค่การเปลี่ยนรูประหว่างพลังงานจลน์กับพลังงานศักย์' }
      - { id: d, text: 'พลังงานจลน์และพลังงานศักย์เป็นศูนย์ทั้งคู่', feedback: 'ถ้าใช้จุดต่ำสุดเป็นระดับอ้างอิง พลังงานศักย์เป็นศูนย์ได้ แต่ลูกตุ้มกำลังเคลื่อนที่เร็วที่สุด พลังงานจลน์จึงไม่เป็นศูนย์' }
    hints:
      - 'ที่ตำแหน่งใดลูกตุ้มอยู่ต่ำที่สุด และที่ตำแหน่งใดเคลื่อนที่เร็วที่สุด'
      - 'พลังงานกลรวมคงตัว ถ้าพลังงานศักย์ลดลง พลังงานจลน์ต้องเพิ่มขึ้นเท่ากัน'
    solution: 'จุดต่ำสุดมีความสูงน้อยที่สุด พลังงานศักย์จึงน้อยที่สุด และเพราะพลังงานกลคงตัว พลังงานที่ลดลงไปกลายเป็นพลังงานจลน์ ลูกตุ้มจึงเร็วที่สุดและมีพลังงานจลน์มากที่สุด ณ จุดนี้'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.cons.p003
    topics: [physics.energy.conservation]
    difficulty: 2
    type: numeric
    stem: 'ลูกมะพร้าวหลุดจากขั้วบนต้นสูง $20\ \mathrm{m}$ ตกลงมาจากหยุดนิ่ง ไม่คิดแรงต้านอากาศ ลูกมะพร้าวกระทบพื้นด้วยอัตราเร็วเท่าใด ใช้ $g = 9.8\ \mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย m/s ทศนิยม 1 ตำแหน่ง)'
    answer: { value: 19.8, tolerance: 0.2, unit: m/s }
    hints:
      - 'พลังงานศักย์ด้านบนเปลี่ยนเป็นพลังงานจลน์ที่พื้น $mgh = \tfrac{1}{2}mv^2$'
      - 'มวลตัดกันได้ ไม่จำเป็นต้องรู้มวลของมะพร้าว'
      - 'จัดรูปได้ $v = \sqrt{2gh}$ แล้วแทนค่า'
    misconceptions:
      - { match: 392, feedback: 'นี่คือค่าของ $v^2 = 2gh$ (หน่วย $\mathrm{m^2/s^2}$) ยังต้องถอดรากที่สองอีกขั้นหนึ่ง' }
      - { match: 14, feedback: 'ดูเหมือนลืมเลข 2 ใน $v = \sqrt{2gh}$ ซึ่งมาจาก $\tfrac{1}{2}$ ใน $\tfrac{1}{2}mv^2$' }
    solution: '$mgh = \tfrac{1}{2}mv^2$ → $v = \sqrt{2gh} = \sqrt{2(9.8\ \mathrm{m/s^2})(20\ \mathrm{m})} = \sqrt{392}\ \mathrm{m/s} \approx 19.8\ \mathrm{m/s}$'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.cons.p004
    topics: [physics.energy.conservation]
    difficulty: 3
    type: numeric
    stem: 'รถไฟเหาะในสวนสนุกเริ่มเคลื่อนที่จากหยุดนิ่งที่ยอดรางสูง $5\ \mathrm{m}$ จากพื้น ถ้ารางลื่นและไม่คิดแรงต้าน เมื่อรถลงมาถึงตำแหน่งที่สูงจากพื้น $1.8\ \mathrm{m}$ จะมีอัตราเร็วเท่าใด ใช้ $g = 9.8\ \mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย m/s ทศนิยม 2 ตำแหน่ง)'
    answer: { value: 7.92, tolerance: 0.08, unit: m/s }
    hints:
      - 'เขียนพลังงานกลที่ยอดรางและที่ความสูง $1.8\ \mathrm{m}$ แล้วให้เท่ากัน'
      - 'ความสูงที่ลดลงจริงคือ $5 - 1.8$ เมตร'
      - '$\tfrac{1}{2}mv^2 = mg(h_1 - h_2)$ มวลตัดกัน แล้วแก้หา $v$'
    misconceptions:
      - { match: 5.94, feedback: 'ดูเหมือนใช้ความสูง $1.8\ \mathrm{m}$ ซึ่งเป็นตำแหน่งปลาย ต้องใช้ความสูงที่ **ลดลง** คือ $5 - 1.8 = 3.2\ \mathrm{m}$' }
      - { match: 9.90, feedback: 'นี่คืออัตราเร็วเมื่อลงถึงพื้น ($h = 5\ \mathrm{m}$) แต่ตำแหน่งที่ถามยังสูงจากพื้น $1.8\ \mathrm{m}$ พลังงานบางส่วนยังเป็นพลังงานศักย์อยู่' }
    solution: '$mg(5) = \tfrac{1}{2}mv^2 + mg(1.8)$ → $v = \sqrt{2g(5 - 1.8)} = \sqrt{2(9.8)(3.2)}\ \mathrm{m/s} = \sqrt{62.72}\ \mathrm{m/s} \approx 7.92\ \mathrm{m/s}$'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.cons.p005
    topics: [physics.energy.conservation]
    difficulty: 3
    type: mcq
    stem: 'เด็กมวล $20\ \mathrm{kg}$ และผู้ใหญ่มวล $60\ \mathrm{kg}$ ไถลจากหยุดนิ่งลงจากยอดสไลเดอร์น้ำอันเดียวกัน ถ้าไม่คิดแรงเสียดทานและแรงต้านอากาศ เมื่อถึงด้านล่าง ใครมีอัตราเร็วมากกว่า'
    choices:
      - { id: a, text: 'เท่ากัน', correct: true }
      - { id: b, text: 'ผู้ใหญ่ เพราะหนักกว่า', feedback: 'ผู้ใหญ่มีพลังงานศักย์มากกว่าจริง แต่ก็ต้องใช้พลังงานจลน์มากกว่าด้วยจึงจะเร็วเท่ากัน มวลตัดกันใน $mgh = \tfrac{1}{2}mv^2$' }
      - { id: c, text: 'เด็ก เพราะเบากว่า', feedback: 'ความเบาไม่ได้ทำให้เร็วขึ้น เมื่อไม่มีแรงเสียดทาน $v = \sqrt{2gh}$ ไม่ขึ้นกับมวลเลย' }
      - { id: d, text: 'ผู้ใหญ่เร็วกว่า 3 เท่า เพราะมวลมากกว่า 3 เท่า', feedback: 'มวล 3 เท่าทำให้ **พลังงาน** 3 เท่า ไม่ใช่อัตราเร็ว 3 เท่า และเมื่อหารด้วยมวลแล้ว อัตราเร็วเท่ากันพอดี' }
    hints:
      - 'ตั้งสมการอนุรักษ์พลังงาน $mgh = \tfrac{1}{2}mv^2$ สำหรับแต่ละคน'
      - 'สังเกตว่าเมื่อจัดรูปหา $v$ มวล $m$ ยังเหลืออยู่หรือไม่'
    solution: 'จาก $mgh = \tfrac{1}{2}mv^2$ มวลตัดกัน ได้ $v = \sqrt{2gh}$ ทั้งสองคนลงจากความสูงเท่ากัน จึงมีอัตราเร็วเท่ากัน (ในความจริงแรงเสียดทานและแรงต้านอากาศทำให้ผลต่างกันเล็กน้อย)'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.cons.p006
    topics: [physics.energy.conservation]
    difficulty: 3
    type: numeric
    stem: 'น้องนั่งชิงช้าที่สวนสาธารณะ ณ จุดต่ำสุดชิงช้ามีอัตราเร็ว $4\ \mathrm{m/s}$ ถ้าไม่คิดแรงต้าน ชิงช้าจะแกว่งขึ้นไปได้สูงกว่าจุดต่ำสุดเท่าใด ใช้ $g = 9.8\ \mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย m ทศนิยม 2 ตำแหน่ง)'
    answer: { value: 0.82, tolerance: 0.01, unit: m }
    hints:
      - 'ที่จุดสูงสุดชิงช้าหยุดนิ่งชั่วขณะ พลังงานจลน์ทั้งหมดเปลี่ยนเป็นพลังงานศักย์'
      - 'ตั้งสมการ $\tfrac{1}{2}mv^2 = mgh$ มวลตัดกัน'
      - 'จัดรูปได้ $h = \tfrac{v^2}{2g}$'
    misconceptions:
      - { match: 1.63, feedback: 'ดูเหมือนลืมเลข 2 ใน $h = \tfrac{v^2}{2g}$ ซึ่งมาจาก $\tfrac{1}{2}$ ใน $\tfrac{1}{2}mv^2$' }
      - { match: 0.41, feedback: 'ดูเหมือนนำ $\tfrac{v}{g}$ ซึ่งเป็นเวลา (หน่วยวินาที) ไม่ใช่ความสูง ต้องยกกำลังสองอัตราเร็วด้วย: $h = \tfrac{v^2}{2g}$' }
    solution: '$\tfrac{1}{2}mv^2 = mgh$ → $h = \dfrac{v^2}{2g} = \dfrac{(4\ \mathrm{m/s})^2}{2(9.8\ \mathrm{m/s^2})} = \dfrac{16}{19.6}\ \mathrm{m} \approx 0.82\ \mathrm{m}$'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.cons.p007
    topics: [physics.energy.conservation]
    difficulty: 4
    type: numeric
    stem: 'เด็กมวล $25\ \mathrm{kg}$ ไถลจากหยุดนิ่งลงสไลเดอร์ในสนามเด็กเล่นที่โรงเรียน ยอดสไลเดอร์สูง $2.5\ \mathrm{m}$ เมื่อถึงด้านล่างมีอัตราเร็ว $5\ \mathrm{m/s}$ พลังงานกลสูญเสียไปเพราะแรงเสียดทานเท่าใด ใช้ $g = 9.8\ \mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย J)'
    answer: { value: 300, tolerance: 3, unit: J }
    hints:
      - 'หาพลังงานกลที่ยอดสไลเดอร์ (พลังงานศักย์อย่างเดียว) และที่ด้านล่าง (พลังงานจลน์อย่างเดียว)'
      - 'พลังงานที่สูญเสีย = พลังงานกลต้น − พลังงานกลปลาย'
    misconceptions:
      - { match: 612.5, feedback: 'นี่คือพลังงานกลทั้งหมดตอนเริ่ม ยังต้องลบพลังงานจลน์ที่ด้านล่างออก จึงจะได้ส่วนที่สูญเสีย' }
      - { match: 312.5, feedback: 'นี่คือพลังงานจลน์ที่ด้านล่าง ซึ่งเป็นพลังงานที่ **เหลือ** ไม่ใช่ที่สูญเสีย' }
    solution: 'ต้น: $mgh = (25)(9.8)(2.5) = 612.5\ \mathrm{J}$ ปลาย: $\tfrac{1}{2}mv^2 = \tfrac{1}{2}(25)(5)^2 = 312.5\ \mathrm{J}$ สูญเสีย $= 612.5 - 312.5 = 300\ \mathrm{J}$ (กลายเป็นความร้อน)'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.cons.p008
    topics: [physics.energy.conservation]
    difficulty: 4
    type: expression
    stem: 'วัตถุเคลื่อนที่บนรางลื่นด้วยอัตราเร็ว $u$ แล้วไถลลงไปยังจุดที่ต่ำกว่าเดิม $h$ ไม่คิดแรงเสียดทาน ใช้ความเร่งโน้มถ่วง $g$ จงเขียนนิพจน์ของอัตราเร็ว $v$ ที่จุดต่ำนั้น'
    prefix: 'v ='
    answer: { latex: '\sqrt{u^2+2gh}', variables: [u, g, h] }
    misconceptions:
      - { match: 'u+\sqrt{2gh}', feedback: 'อัตราเร็วบวกกันตรง ๆ ไม่ได้ สิ่งที่อนุรักษ์คือ **พลังงาน** ต้องบวกในรูป $v^2 = u^2 + 2gh$ แล้วจึงถอดราก' }
      - { match: '\sqrt{2gh}', feedback: 'นี่คือกรณีเริ่มจากหยุดนิ่ง ข้อนี้มีอัตราเร็วต้น $u$ ด้วย พลังงานจลน์ต้น $\tfrac{1}{2}mu^2$ ต้องรวมเข้าไป' }
    hints:
      - 'ตั้งสมการ พลังงานจลน์ต้น + พลังงานศักย์ที่ลดลง = พลังงานจลน์ปลาย'
      - '$\tfrac{1}{2}mu^2 + mgh = \tfrac{1}{2}mv^2$ แล้วหารด้วย $\tfrac{1}{2}m$ ทั้งสองข้าง'
      - 'ได้ $v^2$ ก่อน แล้วจึงถอดรากที่สอง'
    solution: '$\tfrac{1}{2}mu^2 + mgh = \tfrac{1}{2}mv^2$ → $u^2 + 2gh = v^2$ → $v = \sqrt{u^2 + 2gh}$ (สมการเดียวกับ $v^2 = u^2 + 2as$ ของการตกอิสระ)'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.cons.p009
    topics: [physics.energy.conservation]
    difficulty: 4
    type: numeric
    stem: 'สปริงค่านิจ $500\ \mathrm{N/m}$ ตั้งอยู่ในแนวดิ่ง ถูกกดลง $10\ \mathrm{cm}$ แล้ววางลูกบอลมวล $0.1\ \mathrm{kg}$ ไว้บนสปริง เมื่อปล่อย สปริงดีดลูกบอลขึ้นไปในแนวดิ่ง ลูกบอลขึ้นไปได้สูงกว่าจุดที่ปล่อยเท่าใด ไม่คิดแรงต้านและมวลของสปริง ใช้ $g = 9.8\ \mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย m ทศนิยม 2 ตำแหน่ง)'
    answer: { value: 2.55, tolerance: 0.03, unit: m }
    hints:
      - 'พลังงานศักย์ยืดหยุ่นในสปริงเปลี่ยนเป็นพลังงานศักย์โน้มถ่วงที่จุดสูงสุด'
      - 'หาพลังงานในสปริง $\tfrac{1}{2}kx^2$ โดย $x$ เป็นเมตร'
      - 'ตั้ง $\tfrac{1}{2}kx^2 = mgh$ แล้วแก้หา $h$'
    misconceptions:
      - { match: 5.10, feedback: 'ดูเหมือนลืม $\tfrac{1}{2}$ ในพลังงานของสปริง $\tfrac{1}{2}kx^2$' }
      - { match: 25, feedback: 'ดูเหมือนลืมคูณ $g$ ในพลังงานศักย์โน้มถ่วง $mgh$' }
    solution: '$x = 0.1\ \mathrm{m}$ พลังงานในสปริง $= \tfrac{1}{2}(500)(0.1)^2 = 2.5\ \mathrm{J}$ จาก $2.5 = (0.1)(9.8)h$ ได้ $h = \dfrac{2.5}{0.98}\ \mathrm{m} \approx 2.55\ \mathrm{m}$'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.cons.p010
    topics: [physics.energy.conservation]
    difficulty: 5
    type: numeric
    stem: 'กล่องมวล $2\ \mathrm{kg}$ ไถลจากหยุดนิ่งลงรางโค้งลื่นสูง $1.5\ \mathrm{m}$ แล้วไถลต่อบนพื้นราบที่ขรุขระ ซึ่งมีแรงเสียดทานคงตัว $6\ \mathrm{N}$ ต้านการเคลื่อนที่ กล่องไถลบนพื้นราบได้ไกลเท่าใดจึงหยุด ใช้ $g = 9.8\ \mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย m)'
    answer: { value: 4.9, tolerance: 0.05, unit: m }
    hints:
      - 'บนรางโค้งลื่น พลังงานกลคงตัว ที่ก้นรางกล่องมีพลังงานจลน์เท่ากับ $mgh$'
      - 'บนพื้นขรุขระ แรงเสียดทานทำงานเป็นลบจนพลังงานจลน์หมด'
