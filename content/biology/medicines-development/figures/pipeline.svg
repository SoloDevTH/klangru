<text x="20.0" y="464.0" text-anchor="start" font-size="11" fill="#555">สารที่เข้าสู่ระยะที่ 1 ราว 9 ใน 10 ไม่ผ่านถึงการอนุมัติ (ค่าโดยประมาณ ต่างกันตามโรค)</text>
