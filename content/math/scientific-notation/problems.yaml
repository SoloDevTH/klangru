    stem: "เขียน $7.06 \\times 10^{5}$ เป็นจำนวนในรูปทศนิยมปกติ (ไม่มีเลขยกกำลัง)"
    answer: { value: 706000 }
    hints:
      - "$10^{5}$ คือเลื่อนจุดทศนิยมไปทางขวา 5 ตำแหน่ง"
      - "เติมศูนย์ให้ครบเมื่อตัวเลขหมด"
    misconceptions:
      - { match: 70600, feedback: "เลื่อนจุดไปเพียง 4 ตำแหน่ง ต้องเลื่อน 5 ตำแหน่งตามเลขชี้กำลัง" }
      - { match: 7060000, feedback: "เลื่อนจุดไป 6 ตำแหน่ง ต้องเลื่อน 5 ตำแหน่ง ลองนับ: 7.06 → 70.6 → 706 → 7,060 → 70,600 → 706,000" }
    solution: "$7.06 \\times 10^{5}$ เลื่อนจุดไปทางขวา 5 ตำแหน่ง: $706{,}000$"
