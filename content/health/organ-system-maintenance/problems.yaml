problems:
- id: health.body.organ-system-maintenance.p001
  topics:
  - health.body.organ-system-maintenance
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็นตัวอย่างของการรักษาดุลยภาพของร่างกาย
  choices:
  - id: a
    text: เหงื่อออกเมื่อร่างกายร้อน เพื่อให้อุณหภูมิกลับมาใกล้ 37 องศาเซลเซียส
    correct: true
  - id: b
    text: ส่วนสูงเพิ่มขึ้นในวัยรุ่น
    feedback: เป็นการเจริญเติบโต ไม่ใช่การรักษาสภาพภายในให้คงที่
  - id: c
    text: ผมยาวขึ้นทุกเดือน
    feedback: เป็นการเจริญของเส้นผม ไม่ใช่การปรับสมดุล
  - id: d
    text: เรียนรู้คำศัพท์ใหม่
    feedback: เป็นการเรียนรู้ของสมอง ไม่ใช่การรักษาสภาพภายใน
  hints:
  - ดุลยภาพคือการรักษาสภาพภายในให้คงที่
  - ร่างกายทำอะไรเมื่อร้อนเกินไป
  solution: การขับเหงื่อเพื่อลดอุณหภูมิเป็นการรักษาดุลยภาพ ระบบประสาทรับรู้ความร้อน แล้วสั่งให้ผิวหนังขับเหงื่อ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.organ-system-maintenance.p002
  topics:
  - health.body.organ-system-maintenance
  difficulty: 1
  type: match
  stem: จับคู่ระบบอวัยวะกับวิธีสร้างเสริมที่ตรงที่สุด
  pairs:
  - left: ระบบหมุนเวียนเลือดและหายใจ
    right: ออกกำลังกายแบบแอโรบิกสม่ำเสมอ
  - left: กล้ามเนื้อและกระดูก
    right: อาหารที่มีแคลเซียมและการออกกำลังกายแบบลงน้ำหนัก
  - left: ย่อยอาหารและขับถ่าย
    right: กินผัก ผลไม้ และดื่มน้ำให้พอ
  - left: ภูมิคุ้มกัน
    right: รับวัคซีนตามวัยและนอนให้พอ
  - left: ประสาทและต่อมไร้ท่อ
    right: นอนหลับให้พอและจัดการความเครียด
  hints:
  - นึกถึงหน้าที่ของแต่ละระบบ
  - ใยอาหารช่วยระบบไหน
  solution: หัวใจและปอดพัฒนาจากการออกกำลังกายแบบแอโรบิก กระดูกต้องการแคลเซียมและแรงกระแทก ระบบย่อยต้องการใยอาหารและน้ำ ภูมิคุ้มกันได้จากวัคซีนและการนอน ระบบประสาทและต่อมไร้ท่อต้องการการนอนและการจัดการความเครียด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.organ-system-maintenance.p003
  topics:
  - health.body.organ-system-maintenance
  difficulty: 2
  type: mcq
  stem: ขณะวิ่งเร็ว กล้ามเนื้อต้องการออกซิเจนมากขึ้น ระบบใดตอบสนองโดยตรงด้วยการหายใจเร็วและลึกขึ้น
  choices:
  - id: a
    text: ระบบหายใจ
    correct: true
  - id: b
    text: ระบบย่อยอาหาร
    feedback: ระบบย่อยอาหารทำงานลดลงขณะออกกำลังกายหนัก
  - id: c
    text: ระบบสืบพันธุ์
    feedback: ไม่เกี่ยวกับการส่งออกซิเจนให้กล้ามเนื้อ
  - id: d
    text: ระบบขับถ่าย
    feedback: ไตช่วยรักษาน้ำ แต่ไม่ได้รับออกซิเจนเข้าร่างกาย
  hints:
  - ออกซิเจนเข้าสู่ร่างกายทางไหน
  - ระบบนี้ทำงานคู่กับระบบหมุนเวียนเลือด
  solution: ระบบหายใจเพิ่มอัตราและความลึกของการหายใจ ส่วนระบบหมุนเวียนเลือดเพิ่มการสูบฉีดเพื่อส่งออกซิเจนไปยังกล้ามเนื้อ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.organ-system-maintenance.p004
  topics:
  - health.body.organ-system-maintenance
  difficulty: 2
  type: mcq
  stem: ข้อใดทำลายระบบหายใจและระบบหมุนเวียนเลือด (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: สูบบุหรี่หรือบุหรี่ไฟฟ้า
    correct: true
    feedback: ถูก
  - id: b
    text: อยู่กลางแจ้งนานในวันที่ฝุ่น PM2.5 สูงโดยไม่ป้องกัน
    correct: true
    feedback: ถูก
  - id: c
    text: กินอาหารเค็มจัดเป็นประจำ
    correct: true
    feedback: ถูก เพิ่มความดันโลหิต
  - id: d
    text: ปั่นจักรยานสัปดาห์ละ 4 วัน
    feedback: เป็นการสร้างเสริมระบบหัวใจและหายใจ
  - id: e
    text: ดื่มน้ำเปล่าแทนน้ำหวาน
    feedback: ดีต่อสุขภาพ
  hints:
  - ดูตารางสิ่งที่ทำลาย
  - เกลือมากเกินมีผลต่อหลอดเลือด
  solution: บุหรี่ ฝุ่น PM2.5 และอาหารเค็มจัดทำลายระบบหายใจและหลอดเลือด ส่วนการปั่นจักรยานและดื่มน้ำเปล่าเป็นการสร้างเสริม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.organ-system-maintenance.p005
  topics:
  - health.body.organ-system-maintenance
  difficulty: 2
  type: order
  stem: เรียงขั้นตอนการวางแผนดูแลสุขภาพตนเองและครอบครัว
  items:
  - ประเมินข้อมูลสุขภาพของแต่ละคน
  - ตั้งเป้าหมายที่ชัดและวัดได้
  - วางกิจกรรมให้เหมาะกับวัยและข้อจำกัด
  - ลงมือทำและบันทึก
  - ประเมินผลและปรับแผน
  hints:
  - ต้องรู้สภาพปัจจุบันก่อนตั้งเป้า
  - การประเมินผลทำหลังลงมือแล้ว
  solution: ประเมิน → ตั้งเป้าหมาย → วางกิจกรรม → ลงมือและบันทึก → ประเมินและปรับ แล้ววนซ้ำ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.organ-system-maintenance.p006
  topics:
  - health.body.organ-system-maintenance
  difficulty: 2
  type: numeric
  stem: จากตารางข้อมูลครอบครัวของฝน ดัชนีมวลกายของพ่อเท่ากับเท่าใด (ตอบทศนิยม 1 ตำแหน่ง)
  answer:
    value: 29.4
    tolerance: 0.1
    unit: กก./ม.²
  misconceptions:
  - match: 50.0
    feedback: ต้องหารด้วยส่วนสูงยกกำลังสอง ไม่ใช่ส่วนสูงครั้งเดียว
  - match: 0.3
    feedback: ต้องแปลงส่วนสูงเป็นเมตรก่อน
  hints:
  - แปลงส่วนสูงเป็นเมตร 170 ซม. = 1.70 ม.
  - 85 ÷ (1.70 × 1.70)
  solution: $\text{BMI} = \frac{85}{1.70^2} = \frac{85}{2.89} \approx 29.4$ กก./ม.² สูงกว่าช่วงปกติของผู้ใหญ่
  figure: &id001
    src: family-data.svg
    alt: ตารางข้อมูลสุขภาพครอบครัวของฝน ข้อมูลสมมติ ยาย อายุ 71 ความดันโลหิตสูง กินยาประจำ เดินช้าลง เคยเกือบหกล้ม พ่อ อายุ 48 หนัก 85 กก. สูง 170 ซม. รอบเอว 96 ซม. สูบบุหรี่วันละ 10 มวน แม่ อายุ 42 ตรวจหาเชื้อเอชพีวีครั้งล่าสุดอายุ 38 นั่งทำงานทั้งวัน ฝน อายุ 16 BMI ตามอายุอยู่ในเกณฑ์ นอนวันละ 6 ชั่วโมง น้องต้น อายุ 9 ฟันผุ 2 ซี่ ดื่มน้ำหวานวันละ 2 แก้ว
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.organ-system-maintenance.p007
  topics:
  - health.body.organ-system-maintenance
  difficulty: 3
  type: numeric
  stem: กรมอนามัยแนะนำว่ารอบเอวไม่ควรเกินส่วนสูงหารสอง จากตาราง รอบเอวของพ่อเกินเกณฑ์นี้กี่เซนติเมตร
  answer:
    value: 11.0
    unit: ซม.
  misconceptions:
  - match: -11
    feedback: รอบเอวมากกว่าเกณฑ์ คำตอบจึงเป็นค่าบวก
  - match: 74
    feedback: ต้องลบด้วยครึ่งหนึ่งของส่วนสูง ไม่ใช่ส่วนสูงทั้งหมด
  hints:
  - เกณฑ์รอบเอวคือ 170 ÷ 2
  - นำรอบเอวจริงลบเกณฑ์
  solution: เกณฑ์ $170 \div 2 = 85$ ซม. รอบเอวจริง 96 ซม. เกิน $96 - 85 = 11$ ซม. แสดงว่ามีไขมันหน้าท้องมาก ซึ่งเพิ่มความเสี่ยงโรคไม่ติดต่อ
  figure: *id001
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.organ-system-maintenance.p008
  topics:
  - health.body.organ-system-maintenance
  difficulty: 3
  type: mcq
  stem: ฝนต้องการปรับการนอน เป้าหมายใดเขียนได้ดีที่สุด
  choices:
  - id: a
    text: เข้านอนไม่เกิน 22:00 น. และปิดจอก่อนนอน 30 นาที อย่างน้อย 5 คืนต่อสัปดาห์ เป็นเวลา 4 สัปดาห์
    correct: true
  - id: b
    text: จะนอนให้มากขึ้น
    feedback: กว้างเกินไป วัดไม่ได้และไม่มีกำหนดเวลา
  - id: c
    text: จะนอนวันละ 12 ชั่วโมงทุกวันตั้งแต่พรุ่งนี้
    feedback: ไม่สมจริงกับเวลาเรียน และเกินคำแนะนำสำหรับวัยรุ่น
  - id: d
    text: จะไม่ง่วงในห้องเรียนอีก
    feedback: เป็นผลที่อยากได้ แต่ไม่บอกว่าจะทำอะไร
  hints:
  - เป้าหมายที่ดีชัด วัดได้ ทำได้จริง และมีกำหนดเวลา
  - ระบุพฤติกรรมที่จะทำ ไม่ใช่แค่ผลลัพธ์
  solution: เป้าหมายแรกระบุพฤติกรรมชัด (เวลาเข้านอน ปิดจอ) วัดได้ (5 คืนต่อสัปดาห์) ทำได้จริง และมีกำหนดเวลา (4 สัปดาห์) จึงประเมินผลได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.organ-system-maintenance.p009
  topics:
  - health.body.organ-system-maintenance
  difficulty: 3
  type: mcq
  stem: จากตาราง พ่อของฝนอายุ 48 ปี ตามบริการตรวจคัดกรองที่เรียน ข้อใดเหมาะกับพ่อ (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: ตรวจคัดกรองเบาหวานและความดันโลหิตสูงปีละครั้ง
    correct: true
    feedback: ถูก สำหรับอายุ 35 ปีขึ้นไป
  - id: b
    text: ปรึกษาการเลิกบุหรี่ เช่น สาย 1600
    correct: true
    feedback: ถูก พ่อสูบบุหรี่วันละ 10 มวน
  - id: c
    text: วางแผนตรวจหาเลือดแฝงในอุจจาระเมื่ออายุครบ 50 ปี
    correct: true
    feedback: ถูก การคัดกรองมะเร็งลำไส้ใหญ่เริ่มที่อายุ 50–70 ปี
  - id: d
    text: ตรวจหาเชื้อเอชพีวีเพื่อคัดกรองมะเร็งปากมดลูก
    feedback: เป็นการคัดกรองสำหรับผู้หญิง
  - id: e
    text: ไม่ต้องตรวจเพราะยังไม่มีอาการ
    feedback: ความดันโลหิตสูงและเบาหวานระยะแรกมักไม่มีอาการ
  hints:
  - ดูอายุและเพศของพ่อ
  - ข้อมูลพฤติกรรมในตารางบอกปัจจัยเสี่ยงเพิ่ม
  solution: พ่ออายุเกิน 35 ปีจึงควรตรวจเบาหวานและความดันปีละครั้ง ควรได้รับความช่วยเหลือเลิกบุหรี่ และเมื่ออายุ 50 ปีเริ่มคัดกรองมะเร็งลำไส้ใหญ่ การตรวจเอชพีวีเป็นของผู้หญิง
  figure: *id001
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.organ-system-maintenance.p010
  topics:
  - health.body.organ-system-maintenance
  difficulty: 3
  type: numeric
  stem: แม่ของฝนตรวจหาเชื้อเอชพีวีครั้งล่าสุดเมื่ออายุ 38 ปี และผลปกติ ถ้าตรวจทุก 5 ปีตามบริการคัดกรอง แม่ควรตรวจครั้งถัดไปเมื่ออายุกี่ปี
  answer:
    value: 43
    unit: ปี
  misconceptions:
  - match: 47
    feedback: ต้องเริ่มนับจากอายุที่ตรวจครั้งล่าสุด 38 ปี ไม่ใช่อายุปัจจุบัน
  - match: 39
    feedback: ช่วงห่างคือ 5 ปี ไม่ใช่ทุกปี
  hints:
  - บวกช่วงห่าง 5 ปีกับอายุที่ตรวจครั้งล่าสุด
  - 38 + 5
  solution: $38 + 5 = 43$ ปี ตอนนี้แม่อายุ 42 ปี จึงควรนัดตรวจในปีหน้า
  figure: *id001
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.organ-system-maintenance.p011
  topics:
  - health.body.organ-system-maintenance
  difficulty: 4
  type: mcq
  stem: ข้อใดอธิบายผลของการสูบบุหรี่ต่อการทำงานของร่างกายได้ครบที่สุด
  choices:
  - id: a
    text: ทำลายปอดจึงรับออกซิเจนได้น้อยลง หลอดเลือดเสื่อมจนหัวใจทำงานหนัก และเพิ่มโอกาสมะเร็ง ร่างกายจึงออกกำลังกายได้น้อยลง
    correct: true
  - id: b
    text: มีผลต่อปอดเท่านั้น
    feedback: สารในควันบุหรี่เข้าสู่กระแสเลือดและกระทบหลายระบบ
  - id: c
    text: ทำให้ผ่อนคลายจึงดีต่อหัวใจ
    feedback: นิโคตินทำให้หัวใจเต้นเร็วและหลอดเลือดหดตัว
  - id: d
    text: ไม่มีผลถ้าสูบน้อยกว่าวันละ 10 มวน
    feedback: ไม่มีปริมาณที่ปลอดภัย
  hints:
  - ระบบอวัยวะเชื่อมกัน ผลต่อระบบหนึ่งกระทบระบบอื่น
  - ออกซิเจนต้องผ่านทั้งปอดและหลอดเลือด
  solution: บุหรี่กระทบระบบหายใจ หลอดเลือด และหัวใจพร้อมกัน ร่างกายจึงรับและส่งออกซิเจนได้แย่ลง และเพิ่มความเสี่ยงมะเร็งและโรคหัวใจ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.organ-system-maintenance.p012
  topics:
  - health.body.organ-system-maintenance
  difficulty: 4
  type: mcq
  stem: ยายของฝนอายุ 71 ปี เดินช้าลงและเคยเกือบหกล้ม แผนข้อใดเหมาะที่สุด
  choices:
  - id: a
    text: ปรับบ้าน เช่น ติดราวจับในห้องน้ำ แผ่นกันลื่น ไฟส่องทางเดินตอนกลางคืน ชวนออกกำลังกายฝึกการทรงตัวอย่างปลอดภัย และพาไปตรวจสายตาและทบทวนยากับแพทย์
    correct: true
  - id: b
    text: ให้ยายนั่งเฉย ๆ ทั้งวันจะได้ไม่ล้ม
