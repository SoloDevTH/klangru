id: earthscience.astronomy.star-formation-energy
subject: earthscience
title: { th: การเกิดดาวฤกษ์และพลังงานของดาวฤกษ์, en: "Star formation and stellar energy" }
summary: เนบิวลายุบตัวเป็นดาวฤกษ์ก่อนเกิด การเปลี่ยนความดัน อุณหภูมิ และขนาดจนเข้าสู่ลำดับหลัก ปฏิกิริยาลูกโซ่โปรตอน-โปรตอน วัฏจักรคาร์บอน–ไนโตรเจน–ออกซิเจน และพลังงานที่มาถึงโลก
difficulty: 6
minutes: 40
prerequisites: [physics.nuclear.nuclear-energy-particles, physics.dynamics.gravitation]
encompasses:
  - { id: physics.nuclear.nuclear-energy-particles, weight: 0.3 }
  - { id: physics.dynamics.gravitation, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ดาวฤกษ์ก่อนเกิดเข้าสู่แถบลำดับหลัก
    src: hr-premain.svg
    alt: "แผนภาพเฮิรตซ์สปรัง–รัสเซลล์ แกนนอนเป็นอุณหภูมิผิว 40,000 K ทางซ้ายถึง 3,000 K ทางขวา แกนตั้งเป็นกำลังส่องสว่างเทียบกับดวงอาทิตย์ 10 ยกกำลังลบ 4 ถึง 10 ยกกำลัง 6 แบบลอการิทึม แถบลำดับหลักเป็นแถบเฉียงจากซ้ายบน (ร้อนและสว่าง) ลงมาขวาล่าง (เย็นและหรี่) มีจุดดาวมวล 10, 3, 1 และ 0.2 เท่าของดวงอาทิตย์เรียงจากบนลงล่าง เส้นประสีส้มคือเส้นทางของดาวฤกษ์ก่อนเกิดมวล 1 เท่าของดวงอาทิตย์ เริ่มที่อุณหภูมิราว 4,300 K กำลังส่องสว่างราว 100 เท่า ลงมาในแนวดิ่งขณะหดตัว แล้วเลี้ยวไปทางซ้ายเข้าสู่ลำดับหลักที่จุดของดวงอาทิตย์"
    caption: "ดาวฤกษ์ก่อนเกิดสว่างจากพลังงานโน้มถ่วงขณะหดตัว และหยุดหดเมื่อแกนเริ่มหลอมไฮโดรเจน (วาดโดยทีมคลังรู้ แผนภาพอย่างง่าย)"
  - type: worked-example
    title: มวลที่หายไปและพลังงานจากการหลอมไฮโดรเจน
    problem: "คำนวณพลังงานที่ได้จาก $4\\,{^1\\mathrm{H}} \\rightarrow {^4\\mathrm{He}}$ เมื่อมวลอะตอม $^1\\mathrm{H} = 1.007825\\ \\mathrm{u}$, $^4\\mathrm{He} = 4.002603\\ \\mathrm{u}$ และ $1\\ \\mathrm{u} = 931.5\\ \\mathrm{MeV}/c^2$ และหาว่ามวลหายไปร้อยละเท่าใด"
    steps:
      - text: "มวลก่อน $= 4 \\times 1.007825 = 4.031300\\ \\mathrm{u}$"
      - text: "$\\Delta m = 4.031300 - 4.002603 = 0.028697\\ \\mathrm{u}$"
      - text: "$E = 0.028697 \\times 931.5 \\approx 26.7\\ \\mathrm{MeV}$"
        why: "ใช้มวลอะตอม (รวมอิเล็กตรอน) ผลลัพธ์จึงรวมพลังงานจากโพซิตรอนที่ประลัยกับอิเล็กตรอนแล้ว"
      - text: "ร้อยละที่หายไป $= \\dfrac{0.028697}{4.031300} \\times 100 \\approx 0.71\\%$"
    answer: "ได้พลังงานราว 26.7 MeV มวลหายไปราวร้อยละ 0.71"
  - { type: check, problem: earthscience.astronomy.star-formation-energy.p005, prompt: "มวลก่อนลบมวลหลัง" }
  - type: figure
    title: ปฏิกิริยาลูกโซ่โปรตอน-โปรตอน
    src: pp-chain.svg
    alt: "ขั้นที่ 1 ซึ่งช้าที่สุด ไฮโดรเจน-1 สองนิวเคลียสรวมกันได้ดิวเทอเรียม ไฮโดรเจน-2 พร้อมโพซิตรอนและนิวทริโน เกิดสองครั้ง ขั้นที่ 2 ดิวเทอเรียมรวมกับไฮโดรเจน-1 ได้ฮีเลียม-3 และรังสีแกมมา เกิดสองครั้ง ขั้นที่ 3 ฮีเลียม-3 สองนิวเคลียสรวมกันได้ฮีเลียม-4 และไฮโดรเจน-1 สองนิวเคลียส ผลรวม 4 ไฮโดรเจน-1 กลายเป็นฮีเลียม-4 สองโพซิตรอน สองนิวทริโน และพลังงานราว 26.7 MeV"
    caption: "โปรตอน 6 ตัวเข้าสู่ปฏิกิริยา ได้คืน 2 ตัว จึงใช้สุทธิ 4 ตัว (วาดโดยทีมคลังรู้)"
  - { type: check, problem: earthscience.astronomy.star-formation-energy.p004, prompt: "นับโปรตอนที่ใช้ไปสุทธิ" }
  - type: worked-example
    title: ดาวมวลมากอายุสั้นกว่า
    problem: "ถ้า $L \\propto M^{3.5}$ และดวงอาทิตย์อยู่ในลำดับหลักได้ราว 10,000 ล้านปี ดาวมวล 2 เท่าของดวงอาทิตย์จะสว่างกี่เท่า และอยู่ในลำดับหลักได้ราวกี่ปี"
    steps:
      - text: "กำลังส่องสว่าง $= 2^{3.5} \\approx 11.3$ เท่าของดวงอาทิตย์"
      - text: "เชื้อเพลิงมากเป็น 2 เท่า แต่ใช้เร็วกว่า 11.3 เท่า อายุ $\\propto \\dfrac{M}{L} = \\dfrac{2}{11.3} \\approx 0.177$"
        why: "อายุคือเชื้อเพลิงที่มีหารด้วยอัตราการใช้"
      - text: "อายุ $\\approx 0.177 \\times 10{,}000$ ล้านปี $\\approx 1{,}770$ ล้านปี"
    answer: "สว่างราว 11 เท่า อยู่ในลำดับหลักราว 1,800 ล้านปี สั้นกว่าดวงอาทิตย์มาก"
glossary:
  - { term: เนบิวลา, definition: "กลุ่มแก๊สและฝุ่นในอวกาศ เมฆโมเลกุลที่เย็นและหนาแน่นเป็นแหล่งกำเนิดดาวฤกษ์" }
  - { term: ดาวฤกษ์ก่อนเกิด, definition: "ก้อนแก๊สที่ยุบตัวจนร้อนและทึบแสง ส่องสว่างจากพลังงานโน้มถ่วง ยังไม่หลอมไฮโดรเจนที่แกน (โปรโตสตาร์)" }
  - { term: สมดุลอุทกสถิต, definition: "สภาวะที่แรงดันของแก๊สร้อนภายในดาวต้านแรงโน้มถ่วงได้พอดี ดาวจึงไม่หดและไม่ขยาย" }
  - { term: แถบลำดับหลัก, definition: "แถบบนแผนภาพเฮิรตซ์สปรัง–รัสเซลล์ที่ดาวซึ่งหลอมไฮโดรเจนเป็นฮีเลียมที่แกนอยู่ ดาวใช้เวลาส่วนใหญ่ของชีวิตในช่วงนี้" }
  - { term: ปฏิกิริยาลูกโซ่โปรตอน-โปรตอน, definition: "ลำดับปฏิกิริยาที่รวมโปรตอนเป็นดิวเทอเรียม ฮีเลียม-3 และฮีเลียม-4 เป็นแหล่งพลังงานหลักของดาวมวลเท่าดวงอาทิตย์หรือน้อยกว่า" }
  - { term: วัฏจักรคาร์บอน–ไนโตรเจน–ออกซิเจน, definition: "ลำดับปฏิกิริยาที่ใช้นิวเคลียสคาร์บอน ไนโตรเจน และออกซิเจนเป็นตัวเร่งเปลี่ยนไฮโดรเจนเป็นฮีเลียม เด่นในดาวที่มีมวลมากกว่าราว 1.3 เท่าของดวงอาทิตย์" }
  - { term: ดาวแคระน้ำตาล, definition: "วัตถุที่เกิดเหมือนดาวฤกษ์แต่มวลน้อยกว่าราว 0.08 เท่าของดวงอาทิตย์ แกนร้อนไม่พอจะหลอมไฮโดรเจนอย่างต่อเนื่อง" }
  - { term: นิวทริโน, definition: "อนุภาคที่ไม่มีประจุและแทบไม่ทำปฏิกิริยากับสสาร เกิดจากปฏิกิริยาในแกนดาวและหนีออกมาได้ทันที" }
flashcards:
  - { front: "ดาวฤกษ์ก่อนเกิดหดตัว ความดัน อุณหภูมิ และขนาดเปลี่ยนอย่างไร", back: "ความดันและอุณหภูมิที่แกนเพิ่มขึ้น ขนาดเล็กลง จนแกนร้อนราว 10 ล้าน K แล้วเริ่มหลอมไฮโดรเจน" }
  - { front: "ผลรวมของปฏิกิริยาลูกโซ่โปรตอน-โปรตอน", back: "4 ¹H → ⁴He + 2e⁺ + 2ν + พลังงานราว 26.7 MeV" }
  - { front: "วัฏจักร CNO ต่างจากลูกโซ่ pp อย่างไร", back: "ใช้ C N O เป็นตัวเร่ง ต้องการอุณหภูมิสูงกว่า เด่นในดาวมวลมากกว่าราว 1.3 เท่าของดวงอาทิตย์" }
  - { front: "ดวงอาทิตย์เปลี่ยนมวลเป็นพลังงานวินาทีละเท่าใด", back: "L/c² ≈ 4.3 × 10⁹ kg/s" }
  - { front: "ทำไมดาวมวลมากอายุสั้น", back: "L ∝ M^3.5 ใช้เชื้อเพลิงเร็วกว่ามาก อายุ ∝ M/L ∝ M^−2.5" }
