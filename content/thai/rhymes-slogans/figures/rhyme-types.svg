<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="sans-serif">
<title>สัมผัสสระและสัมผัสอักษร</title>
<rect x="0" y="0" width="860" height="400" fill="#fff"/>
<rect x="20.0" y="20.0" width="400.0" height="360.0" rx="12" fill="#fdf2f0" stroke="#c0392b" stroke-width="2.5"/>
<rect x="440.0" y="20.0" width="400.0" height="360.0" rx="12" fill="#eef3fb" stroke="#1f5fbf" stroke-width="2.5"/>
<text x="220.0" y="60.0" font-size="26" text-anchor="middle" fill="#c0392b" font-weight="bold">สัมผัสสระ</text>
<text x="220.0" y="88.0" font-size="17" text-anchor="middle" fill="#333" font-weight="normal">สระเสียงเดียวกัน + ตัวสะกดมาตราเดียวกัน</text>
<text x="640.0" y="60.0" font-size="26" text-anchor="middle" fill="#1f5fbf" font-weight="bold">สัมผัสอักษร</text>
<text x="640.0" y="88.0" font-size="17" text-anchor="middle" fill="#333" font-weight="normal">พยัญชนะต้นเสียงเดียวกัน</text>
<text x="220.0" y="140.0" font-size="30" text-anchor="middle" fill="#111" font-weight="bold">กา – ปลา</text>
<text x="220" y="172" font-size="19" text-anchor="middle"><tspan fill="#333" font-weight="normal">ก + </tspan><tspan fill="#c0392b" font-weight="bold">อา</tspan><tspan fill="#333" font-weight="normal"> · ปล + </tspan><tspan fill="#c0392b" font-weight="bold">อา</tspan></text>
<text x="220.0" y="222.0" font-size="30" text-anchor="middle" fill="#111" font-weight="bold">ขัน – กัน</text>
<text x="220" y="254" font-size="19" text-anchor="middle"><tspan fill="#333" font-weight="normal">ข + </tspan><tspan fill="#c0392b" font-weight="bold">อะ + น</tspan><tspan fill="#333" font-weight="normal"> · ก + </tspan><tspan fill="#c0392b" font-weight="bold">อะ + น</tspan></text>
<text x="220.0" y="304.0" font-size="30" text-anchor="middle" fill="#111" font-weight="bold">รัก – หัก</text>
<text x="220" y="336" font-size="19" text-anchor="middle"><tspan fill="#333" font-weight="normal">ร + </tspan><tspan fill="#c0392b" font-weight="bold">อะ + ก</tspan><tspan fill="#333" font-weight="normal"> · ห + </tspan><tspan fill="#c0392b" font-weight="bold">อะ + ก</tspan></text>
<text x="640.0" y="140.0" font-size="30" text-anchor="middle" fill="#111" font-weight="bold">สวย – ใส</text>
<text x="640" y="172" font-size="19" text-anchor="middle"><tspan fill="#1f5fbf" font-weight="bold">ส</tspan><tspan fill="#333" font-weight="normal"> + อัว + ย · </tspan><tspan fill="#1f5fbf" font-weight="bold">ส</tspan><tspan fill="#333" font-weight="normal"> + ไอ</tspan></text>
<text x="640.0" y="222.0" font-size="30" text-anchor="middle" fill="#111" font-weight="bold">เก่ง – กล้า</text>
<text x="640" y="254" font-size="19" text-anchor="middle"><tspan fill="#1f5fbf" font-weight="bold">ก</tspan><tspan fill="#333" font-weight="normal"> + เอะ + ง · </tspan><tspan fill="#1f5fbf" font-weight="bold">ก</tspan><tspan fill="#333" font-weight="normal">ล + อา</tspan></text>
<text x="640.0" y="304.0" font-size="30" text-anchor="middle" fill="#111" font-weight="bold">ดำ – ดี</text>
<text x="640" y="336" font-size="19" text-anchor="middle"><tspan fill="#1f5fbf" font-weight="bold">ด</tspan><tspan fill="#333" font-weight="normal"> + อำ · </tspan><tspan fill="#1f5fbf" font-weight="bold">ด</tspan><tspan fill="#333" font-weight="normal"> + อี</tspan></text>
</svg>
