      - "นับอิเล็กตรอนในออร์บิทัลพันธะและแอนติบอนดิงของ N₂ แยกกัน"
      - "ใช้สูตร (พันธะ − แอนติบอนดิง) / 2"
    solution: "N₂ มีอิเล็กตรอนวงนอก 10 ตัว: ในออร์บิทัลพันธะ 8 ตัว และแอนติบอนดิง 2 ตัว อันดับพันธะ = (8 − 2) / 2 = **3**"
