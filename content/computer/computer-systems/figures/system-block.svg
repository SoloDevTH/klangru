<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" font-family="sans-serif" font-size="14">
  <title>แผนภาพระบบคอมพิวเตอร์ หน่วยรับเข้า หน่วยประมวลผลกลาง หน่วยความจำหลัก หน่วยเก็บถาวร และหน่วยส่งออก เชื่อมกันด้วยบัส</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="860" height="420" fill="#ffffff"/>
  <rect x="20.0" y="150.0" width="150.0" height="110.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="95.0" y="183.2" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">หน่วยรับเข้า</text>
  <text x="95.0" y="200.8" font-size="13" text-anchor="middle" fill="#1f2937">แป้นพิมพ์ เมาส์</text>
  <text x="95.0" y="218.3" font-size="13" text-anchor="middle" fill="#1f2937">ไมโครโฟน กล้อง</text>
  <text x="95.0" y="235.9" font-size="13" text-anchor="middle" fill="#1f2937">จอสัมผัส เซนเซอร์</text>
  <rect x="250.0" y="40.0" width="360.0" height="220.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="430.0" y="66.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">หน่วยประมวลผลกลาง (CPU)</text>
  <rect x="270.0" y="85.0" width="150.0" height="70.0" rx="6" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="345.0" y="115.8" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">หน่วยควบคุม (CU)</text>
  <text x="345.0" y="133.3" font-size="13" text-anchor="middle" fill="#1f2937">สั่งงาน ถอดรหัสคำสั่ง</text>
  <rect x="440.0" y="85.0" width="150.0" height="70.0" rx="6" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="515.0" y="115.8" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">หน่วยคำนวณ (ALU)</text>
  <text x="515.0" y="133.3" font-size="13" text-anchor="middle" fill="#1f2937">บวก ลบ เปรียบเทียบ</text>
  <rect x="270.0" y="170.0" width="150.0" height="70.0" rx="6" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="345.0" y="200.8" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">รีจิสเตอร์</text>
  <text x="345.0" y="218.3" font-size="13" text-anchor="middle" fill="#1f2937">PC  IR  ACC</text>
  <rect x="440.0" y="170.0" width="150.0" height="70.0" rx="6" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="515.0" y="200.8" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">แคช</text>
  <text x="515.0" y="218.3" font-size="13" text-anchor="middle" fill="#1f2937">จำของที่ใช้บ่อย</text>
  <rect x="690.0" y="150.0" width="150.0" height="110.0" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="765.0" y="183.2" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">หน่วยส่งออก</text>
