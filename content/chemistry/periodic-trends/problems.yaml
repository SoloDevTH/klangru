problems:
  - id: chemistry.matter.periodic-trends.p001
    topics: [chemistry.matter.periodic-trends]
    difficulty: 1
    type: mcq
    stem: "เมื่อลงล่างในหมู่เดียวกัน (เช่น Li → Na → K) ขนาดอะตอมเปลี่ยนอย่างไร เพราะอะไร"
    choices:
      - { id: a, text: "ใหญ่ขึ้น เพราะจำนวนชั้นของอิเล็กตรอนเพิ่มขึ้น", correct: true, feedback: "ถูก เวเลนซ์อิเล็กตรอนอยู่ไกลนิวเคลียสขึ้น" }
      - { id: b, text: "เล็กลง เพราะโปรตอนเพิ่มขึ้นดึงแรงขึ้น", feedback: "เหตุผลนี้ใช้กับการไปทางขวาในคาบ เมื่อลงล่างในหมู่ จำนวนชั้นเพิ่มซึ่งมีผลมากกว่า" }
      - { id: c, text: "เท่าเดิม เพราะอยู่หมู่เดียวกัน", feedback: "หมู่เดียวกันมีเวเลนซ์อิเล็กตรอนเท่ากัน แต่จำนวนชั้นไม่เท่ากัน" }
    hints:
      - "Li มี 2 ชั้น Na มี 3 ชั้น K มี 4 ชั้น"
      - "ชั้นยิ่งมาก อิเล็กตรอนชั้นนอกยิ่งอยู่ไกล"
    solution: "ลงล่างในหมู่ **จำนวนชั้นเพิ่ม** และอิเล็กตรอนชั้นในบังแรงดึงมากขึ้น อะตอมจึงใหญ่ขึ้น: Li 152, Na 186, K 227 pm"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.periodic-trends.p002
    topics: [chemistry.matter.periodic-trends]
    difficulty: 2
    type: order
    stem: "เรียงธาตุคาบ 3 ต่อไปนี้ตามขนาดอะตอมจาก **ใหญ่ที่สุด** ไป **เล็กที่สุด**"
    items: ["Na", "Mg", "Si", "Cl"]
    hints:
      - "ทั้งหมดมี 3 ชั้น สิ่งที่ต่างคือจำนวนโปรตอน"
      - "ไปทางขวาในคาบ ประจุนิวเคลียสยังผลเพิ่ม อะตอมเล็กลง"
    solution: "ในคาบเดียวกัน ยิ่งไปทางขวาประจุยังผลยิ่งมาก อะตอมยิ่งเล็ก: Na (186) > Mg (160) > Si (117) > Cl (99 pm)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.periodic-trends.p003
    topics: [chemistry.matter.periodic-trends]
    difficulty: 2
    type: mcq
    stem: "ธาตุใดนำไฟฟ้าได้ดีและมักเสียอิเล็กตรอนเกิดเป็นไอออนบวก"
    choices:
      - { id: a, text: "แมกนีเซียม (Mg)", correct: true, feedback: "ถูก Mg เป็นโลหะ IE ต่ำ เสีย 2 อิเล็กตรอนเป็น Mg²⁺" }
      - { id: b, text: "กำมะถัน (S)", feedback: "S เป็นอโลหะ ไม่นำไฟฟ้า และมักรับอิเล็กตรอนเป็น S²⁻" }
      - { id: c, text: "คลอรีน (Cl)", feedback: "Cl เป็นอโลหะ มักรับอิเล็กตรอนเป็น Cl⁻" }
    hints:
      - "โลหะอยู่ทางซ้ายของตารางธาตุ"
      - "โลหะมี IE ต่ำ จึงเสียอิเล็กตรอนง่าย"
    solution: "**Mg** เป็นโลหะ มีเวเลนซ์อิเล็กตรอน 2 ตัวที่ถูกดึงไม่แน่น จึงนำไฟฟ้าและเสียอิเล็กตรอนง่าย ส่วน S และ Cl เป็นอโลหะที่มักรับอิเล็กตรอน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.periodic-trends.p004
    topics: [chemistry.matter.periodic-trends]
    difficulty: 2
    type: mcq
    stem: "อะตอม Cl กับไอออน $\\mathrm{Cl^-}$ อนุภาคใดใหญ่กว่า"
    choices:
      - { id: a, text: "$\\mathrm{Cl^-}$ เพราะอิเล็กตรอนเพิ่มขึ้นแต่โปรตอนเท่าเดิม อิเล็กตรอนผลักกันมากขึ้น", correct: true, feedback: "ถูก Cl 99 pm และ Cl⁻ 181 pm" }
      - { id: b, text: "Cl เพราะไอออนเล็กกว่าอะตอมเสมอ", feedback: "ไอออนบวกเล็กกว่าอะตอม แต่ไอออนลบใหญ่กว่า" }
      - { id: c, text: "เท่ากัน เพราะโปรตอนเท่ากัน", feedback: "จำนวนอิเล็กตรอนต่างกัน ขนาดจึงต่างกัน" }
    hints:
      - "$\\mathrm{Cl^-}$ มีอิเล็กตรอนมากกว่า Cl กี่ตัว"
      - "อิเล็กตรอนเพิ่มแต่แรงดึงจากนิวเคลียสเท่าเดิม"
    solution: "$\\mathrm{Cl^-}$ มีอิเล็กตรอน 18 ตัวแต่โปรตอนยังเป็น 17 อิเล็กตรอนผลักกันมากขึ้น ไอออนจึง **ใหญ่กว่า** อะตอม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.periodic-trends.p005
    topics: [chemistry.matter.periodic-trends]
    difficulty: 3
    type: numeric
    stem: "ใช้การประมาณ ประจุนิวเคลียสยังผล ≈ จำนวนโปรตอน − จำนวนอิเล็กตรอนชั้นใน หาประจุยังผลที่เวเลนซ์อิเล็กตรอนของคลอรีน ($Z = 17$ จัดเรียง 2, 8, 7) รู้สึก"
    answer: { value: 7 }
    misconceptions:
      - { match: 17, feedback: "อิเล็กตรอนชั้นใน 10 ตัวบังแรงดึงไว้ ต้องลบออกจากจำนวนโปรตอน" }
      - { match: 10, feedback: "10 คือจำนวนอิเล็กตรอนชั้นใน ต้องนำไปลบจากจำนวนโปรตอน" }
    hints:
      - "อิเล็กตรอนชั้นในคือชั้นที่ 1 และ 2: 2 + 8"
      - "17 − 10"
    solution: "ประจุยังผล $\\approx 17 - (2 + 8) = 7$ มากกว่าของ Na ($11 - 10 = 1$) มาก เวเลนซ์อิเล็กตรอนของ Cl จึงถูกดึงแน่นกว่า อะตอม Cl เล็กกว่าและ IE สูงกว่า Na"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.periodic-trends.p006
    topics: [chemistry.matter.periodic-trends]
    difficulty: 3
    type: order
    stem: "เรียงไอออนที่มีอิเล็กตรอน 10 ตัวเท่ากันต่อไปนี้จาก **ใหญ่ที่สุด** ไป **เล็กที่สุด**"
    items: ["O²⁻", "F⁻", "Na⁺", "Mg²⁺"]
    hints:
      - "อิเล็กตรอนเท่ากัน สิ่งที่ต่างคือจำนวนโปรตอน"
      - "โปรตอนยิ่งมาก ดึงอิเล็กตรอน 10 ตัวยิ่งแน่น"
    solution: "โปรตอน O 8, F 9, Na 11, Mg 12 ยิ่งมากยิ่งดึงแน่น ไอออนยิ่งเล็ก: $\\mathrm{O^{2-}}$ (140) > $\\mathrm{F^-}$ (133) > $\\mathrm{Na^+}$ (102) > $\\mathrm{Mg^{2+}}$ (72 pm)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.periodic-trends.p007
    topics: [chemistry.matter.periodic-trends]
    difficulty: 3
    type: mcq
    stem: "พลังงานไอออไนเซชันลำดับที่ 1 ของ Mg (738 kJ/mol) สูงกว่าของ Al (578 kJ/mol) ทั้งที่ Al อยู่ทางขวา เหตุผลใดถูกต้อง"
    choices:
      - { id: a, text: "อิเล็กตรอนที่ถูกดึงออกจาก Al อยู่ใน 3p ซึ่งมีพลังงานสูงกว่าและอยู่ห่างกว่า 3s ของ Mg", correct: true, feedback: "ถูก อิเล็กตรอน 3p หลุดง่ายกว่า" }
      - { id: b, text: "Al มีโปรตอนน้อยกว่า Mg", feedback: "Al มีโปรตอน 13 มากกว่า Mg ซึ่งมี 12" }
      - { id: c, text: "Al มีจำนวนชั้นมากกว่า Mg", feedback: "ทั้งสองอยู่คาบ 3 มี 3 ชั้นเท่ากัน" }
    hints:
      - "เขียนการจัดเรียง: Mg [Ne]3s² และ Al [Ne]3s² 3p¹"
      - "อิเล็กตรอนตัวที่ถูกดึงออกอยู่ในระดับย่อยใด"
    solution: "Al เสียอิเล็กตรอนตัวเดียวใน **3p** ซึ่งพลังงานสูงกว่า 3s และถูกอิเล็กตรอน 3s บังบางส่วน จึงดึงออกง่ายกว่าอิเล็กตรอน 3s ของ Mg"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.periodic-trends.p008
    topics: [chemistry.matter.periodic-trends]
    difficulty: 3
    type: match
    stem: "จับคู่ธาตุกับการใช้ประโยชน์"
    pairs:
      - { left: "ไทเทเนียม", right: "ข้อเข่าและข้อสะโพกเทียม" }
      - { left: "ซิลิคอน", right: "เซลล์สุริยะบนหลังคา" }
      - { left: "ไอโอดีน", right: "เกลือเสริมป้องกันโรคคอพอก" }
      - { left: "แพลทินัมและแพลเลเดียม", right: "ตัวเร่งปฏิกิริยาในเครื่องฟอกไอเสียรถยนต์" }
      - { left: "ฟลูออรีน (ฟลูออไรด์)", right: "ยาสีฟันป้องกันฟันผุ" }
    hints:
      - "ธาตุที่ร่างกายต้องการน้อยแต่ขาดไม่ได้ ใช้เติมในเกลือ"
      - "โลหะแทรนซิชันมักเป็นตัวเร่งปฏิกิริยา"
    solution: "ไทเทเนียม: ข้อเทียม (แข็งแรง เบา ไม่ทำปฏิกิริยากับร่างกาย) · ซิลิคอน: เซลล์สุริยะ · ไอโอดีน: เกลือเสริมไอโอดีน · Pt Pd: ตัวเร่งปฏิกิริยา · ฟลูออไรด์: ยาสีฟัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.periodic-trends.p009
    topics: [chemistry.matter.periodic-trends]
    difficulty: 3
    type: numeric
    stem: "ด่างทับทิม $\\mathrm{KMnO_4}$ สีม่วงใช้ล้างผัก เลขออกซิเดชันของ Mn เป็นเท่าใด (K = +1, O = −2 และผลรวมในสารประกอบเป็นศูนย์)"
    answer: { value: 7 }
    misconceptions:
      - { match: 9, feedback: "ใช้เลขออกซิเดชันของ K ผิดเครื่องหมาย K เป็น +1 จึงเขียน $x + 1 - 8 = 0$" }
      - { match: 8, feedback: "ต้องรวม K ด้วย: $(+1) + x + 4(-2) = 0$" }
    hints:
      - "ให้ Mn เป็น $x$ แล้วเขียน $(+1) + x + 4(-2) = 0$"
      - "แก้หา $x$"
    solution: "$1 + x - 8 = 0$ จะได้ $x = +7$ Mn ในสารอื่นมีเลขออกซิเดชันได้ตั้งแต่ +2 ถึง +7 เป็นตัวอย่างของโลหะแทรนซิชันที่มีเลขออกซิเดชันหลายค่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.periodic-trends.p010
    topics: [chemistry.matter.periodic-trends]
    difficulty: 4
    type: mcq
    stem: "ธาตุใดมีสัมพรรคภาพอิเล็กตรอน (คายพลังงานเมื่อรับอิเล็กตรอน) **มากที่สุด**"
    choices:
      - { id: a, text: "Cl (349 kJ/mol)", correct: true, feedback: "ถูก Cl คายมากกว่า F เป็นข้อยกเว้นที่ควรจำ" }
      - { id: b, text: "F (328 kJ/mol)", feedback: "F มี EN สูงสุด แต่อะตอมเล็กมาก อิเล็กตรอนที่เข้ามาถูกผลัก EA จึงน้อยกว่า Cl" }
      - { id: c, text: "Br (325 kJ/mol)", feedback: "Br อยู่ต่ำกว่า Cl อะตอมใหญ่กว่า ดึงอิเล็กตรอนที่เข้ามาได้น้อยกว่า" }
      - { id: d, text: "Na (53 kJ/mol)", feedback: "โลหะไม่ค่อยรับอิเล็กตรอน EA น้อย" }
    hints:
      - "แฮโลเจนคาย EA มาก เพราะรับแล้วครบออกเตต"
      - "ดูตัวเลขที่ให้ในตัวเลือก และคิดว่าทำไม F ไม่ใช่ตัวสูงสุด"
    solution: "แนวโน้มทั่วไปบอกว่า F ควรสูงสุด แต่ F เล็กมาก อิเล็กตรอน 2p ที่อัดแน่นผลักอิเล็กตรอนตัวใหม่ **Cl จึงคายพลังงานมากที่สุด** (349 kJ/mol)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.periodic-trends.p011
    topics: [chemistry.matter.periodic-trends]
    difficulty: 4
    type: mcq
    stem: "ในคาบ 3 ซิลิคอนมีจุดหลอมเหลวสูงที่สุด (1,414 °C) ขณะที่ฟอสฟอรัสหลอมที่ 44 °C เหตุผลใดถูกต้อง"
    choices:
      - { id: a, text: "Si เป็นโครงผลึกร่างตาข่าย ต้องทำลายพันธะโคเวเลนต์จำนวนมาก ส่วน P เป็นโมเลกุล P₄ ที่ยึดกันด้วยแรงอ่อน", correct: true, feedback: "ถูก ชนิดโครงสร้างเป็นตัวตัดสิน" }
      - { id: b, text: "Si มีอิเล็กตรอนมากกว่า P", feedback: "P มีอิเล็กตรอนมากกว่า Si" }
      - { id: c, text: "Si เป็นโลหะ", feedback: "Si เป็นกึ่งโลหะที่มีโครงสร้างร่างตาข่ายแบบเพชร ไม่ได้ยึดด้วยพันธะโลหะ" }
    hints:
      - "การหลอมเหลวต้องทำลายแรงชนิดใดใน Si และใน P"
      - "พันธะโคเวเลนต์แข็งแรงกว่าแรงระหว่างโมเลกุลมาก"
    solution: "Si อะตอมต่อกันด้วยพันธะโคเวเลนต์ทั้งก้อน (**ร่างตาข่าย**) การหลอมต้องทำลายพันธะเหล่านั้น ส่วน P อยู่เป็นโมเลกุล $\\mathrm{P_4}$ การหลอมแค่แยกโมเลกุลที่ยึดกันด้วยแรงอ่อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.periodic-trends.p012
    topics: [chemistry.matter.periodic-trends]
    difficulty: 4
    type: mcq
    stem: "หยดน้ำคลอรีน ($\\mathrm{Cl_2}$) ลงในสารละลาย KBr สารละลายเปลี่ยนเป็นสีส้ม แต่หยดน้ำโบรมีน ($\\mathrm{Br_2}$) ลงในสารละลาย KCl ไม่มีอะไรเปลี่ยน ข้อใดอธิบายได้ถูกต้อง"
    choices:
      - { id: a, text: "Cl รับอิเล็กตรอนได้ดีกว่า Br จึงดึงอิเล็กตรอนจาก Br⁻ ได้ เกิด Br₂ สีส้ม แต่ Br ดึงอิเล็กตรอนจาก Cl⁻ ไม่ได้", correct: true, feedback: "ถูก แฮโลเจนที่อยู่สูงกว่าว่องไวกว่า" }
      - { id: b, text: "Br รับอิเล็กตรอนได้ดีกว่า Cl เพราะอะตอมใหญ่กว่า", feedback: "อะตอมใหญ่ อิเล็กตรอนที่เข้ามาอยู่ไกลนิวเคลียส จึงรับได้ยากกว่า" }
      - { id: c, text: "สีส้มเกิดจาก K⁺", feedback: "K⁺ ไม่มีสี และมีอยู่ทั้งสองการทดลอง สีส้มมาจาก Br₂" }
    hints:
      - "สมการ: $\\mathrm{Cl_2 + 2Br^- \\rightarrow 2Cl^- + Br_2}$"
      - "ลงล่างในหมู่ 17 ความสามารถในการรับอิเล็กตรอนเป็นอย่างไร"
    solution: "Cl อยู่สูงกว่า อะตอมเล็กกว่า รับอิเล็กตรอนได้ดีกว่า จึงแทนที่ได้: $\\mathrm{Cl_2 + 2KBr \\rightarrow 2KCl + Br_2}$ (สีส้ม) ปฏิกิริยาย้อนกลับไม่เกิด แฮโลเจนจึง **ว่องไวลดลงเมื่อลงล่าง**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.periodic-trends.p013
    topics: [chemistry.matter.periodic-trends]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นสมบัติของโลหะแทรนซิชัน เช่น เหล็กและทองแดง เมื่อเทียบกับโซเดียม (เลือกได้มากกว่า 1 ข้อ)"
    choices:
      - { id: a, text: "จุดหลอมเหลวและความหนาแน่นสูงกว่า", correct: true, feedback: "ถูก Fe 1,538 °C 7.87 g/cm³ เทียบ Na 98 °C 0.97 g/cm³" }
      - { id: b, text: "มีเลขออกซิเดชันได้หลายค่า", correct: true, feedback: "ถูก เช่น Fe²⁺ และ Fe³⁺, Cu⁺ และ Cu²⁺" }
