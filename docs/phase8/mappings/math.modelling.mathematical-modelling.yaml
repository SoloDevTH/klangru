  - { framework: au-ac9-mathematics, indicators: ["AC9M6N09", "AC9M7M06", "AC9M8M07"], coverage: full, note: "สร้างแบบจำลองจากร้อยละ อัตราส่วน และอัตรา รวมบริบทการเงิน (ส่วนลดสมาชิกสหกรณ์ อัตราส่วนผสมคอนกรีต ค่าแท็กซี่ต่อกิโลเมตร น้ำรั่วต่อวัน ความหนาแน่นประชากร) พร้อมตีความ ปัดเศษในบริบท และประเมินความเหมาะสมของแบบจำลอง" }
  - { framework: au-ac9-mathematics, indicators: ["AC9M9M05", "AC9M10M05"], coverage: full, note: "แปรผันตรง มาตราส่วนแผนที่ การย่อขยายวัตถุ (ความยาว k พื้นที่ k² ปริมาตร k³ โมเดลเจดีย์) และการประเมินและปรับแบบจำลองตามวงจรการสร้างแบบจำลอง" }
  - { framework: au-ac9-mathematics, indicators: ["AC9M9A05"], coverage: full, note: "เลือกแบบจำลองเชิงเส้นหรือกำลังสองจากตารางและสถานการณ์ (ผลต่างครั้งแรกและครั้งที่สอง กำไรสูงสุด แปลงผักติดคลอง) ตีความและประเมินช่วงที่ใช้ได้ (ยอดขายติดลบ)" }
