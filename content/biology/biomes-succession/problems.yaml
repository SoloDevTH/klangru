  - id: biology.ecology.biomes-succession.p013
    topics: [biology.ecology.biomes-succession]
    difficulty: 4
    type: mcq
    stem: "ป่าดิบชื้นเขตร้อนมีความหลากหลายสูงมาก แต่เมื่อตัดป่าทำไร่ ดินกลับเสื่อมเร็วภายในไม่กี่ปี เพราะเหตุใด"
    choices:
      - { id: a, text: "ธาตุอาหารส่วนใหญ่อยู่ในมวลชีวภาพของพืช และถูกหมุนเวียนกลับอย่างรวดเร็ว ดินชั้นบนจึงบาง เมื่อตัดป่าและฝนชะ ธาตุอาหารจึงหายไปเร็ว", correct: true }
      - { id: b, text: "ป่าดิบชื้นไม่มีผู้ย่อยสลาย", feedback: "ป่าดิบชื้นมีผู้ย่อยสลายมาก และย่อยเร็วเพราะร้อนชื้น" }
      - { id: c, text: "ดินในป่าดิบชื้นหนาวเกินไปสำหรับพืชไร่", feedback: "ป่าดิบชื้นอยู่ในเขตร้อน อุณหภูมิไม่ใช่ปัญหา" }
      - { id: d, text: "ฝนน้อยเกินไปหลังตัดป่า", feedback: "ป่าดิบชื้นมีฝนชุก ฝนกลับชะล้างธาตุอาหารออกไป" }
    hints:
      - "ในที่ร้อนชื้น ซากถูกย่อยเร็วมาก ธาตุอาหารอยู่ในดินนานหรือไม่"
      - "เมื่อไม่มีรากพืชดูดซับ ฝนชุกทำอะไรกับธาตุอาหาร"
    solution: "ในป่าดิบชื้น ซากถูกย่อยและพืชดูดธาตุอาหารกลับเร็วมาก ธาตุอาหารจึงอยู่ในต้นไม้มากกว่าในดิน เมื่อตัดและเผาป่า ธาตุอาหารบางส่วนหายไป ที่เหลือถูกฝนชะล้าง ดินจึงเสื่อมเร็ว"
