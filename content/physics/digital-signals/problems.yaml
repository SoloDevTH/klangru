problems:
  - id: physics.waves.digital-signals.p001
    topics: [physics.waves.digital-signals]
    difficulty: 1
    type: mcq
    multiple: true
    stem: "ข้อใดเก็บหรือส่งข้อมูลเป็นสัญญาณดิจิทัล (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ไฟล์เพลงในโทรศัพท์มือถือ", correct: true }
      - { id: b, text: "ภาพถ่ายในแฟลชไดรฟ์", correct: true }
      - { id: c, text: "ช่องทีวีดิจิทัลภาคพื้นดิน", correct: true }
      - { id: d, text: "ร่องบนแผ่นเสียงไวนิล", feedback: "ร่องแผ่นเสียงคดเคี้ยวต่อเนื่องตามรูปคลื่นเสียง จึงเป็นการเก็บแบบแอนะล็อก" }
      - { id: e, text: "ปรอทในเทอร์โมมิเตอร์ที่ขยับขึ้นลงต่อเนื่อง", feedback: "ระดับปรอทเปลี่ยนได้ทุกค่าอย่างต่อเนื่อง จึงเป็นการแสดงผลแบบแอนะล็อก" }
    hints:
      - "ดิจิทัลเก็บเป็นตัวเลข 0 กับ 1 ที่แยกเป็นระดับ"
      - "แอนะล็อกเปลี่ยนต่อเนื่องตามสิ่งที่วัด"
    solution: "ไฟล์เพลง ภาพในแฟลชไดรฟ์ และทีวีดิจิทัลเก็บหรือส่งเป็นบิต 0 กับ 1 ส่วนร่องแผ่นเสียงและปรอทในเทอร์โมมิเตอร์เปลี่ยนต่อเนื่อง จึงเป็นแอนะล็อก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.digital-signals.p002
    topics: [physics.waves.digital-signals]
    difficulty: 1
    type: text
    stem: "ใช้ตารางรหัสมอร์สในภาพ ถอดรหัสข้อความ `... --- ...` (มีช่องว่างคั่นระหว่างตัวอักษร) (ตอบเป็นตัวอักษรภาษาอังกฤษ)"
    figure: { src: morse-table.svg, alt: "ตารางรหัสมอร์ส 10 ตัวอักษร จุดคือสัญญาณสั้น ขีดคือสัญญาณยาว A จุดขีด, D ขีดจุดจุด, E จุด, H จุดจุดจุดจุด, I จุดจุด, M ขีดขีด, N ขีดจุด, O ขีดขีดขีด, S จุดจุดจุด, T ขีด" }
    accepted: ["SOS", "S O S"]
    misconceptions:
      - { match: "OSO", feedback: "สลับจุดกับขีด จุด (สั้น) สามตัวคือ S ส่วนขีด (ยาว) สามตัวคือ O" }
    hints:
      - "แยกเป็นสามกลุ่มตามช่องว่าง"
      - "จุดสามตัวคืออักษรใด ขีดสามตัวคืออักษรใด"
    solution: "`...` = S, `---` = O, `...` = S จึงเป็น SOS ซึ่งเป็นสัญญาณขอความช่วยเหลือสากล ส่งด้วยเสียง แสงไฟ หรือวิทยุก็ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.digital-signals.p003
    topics: [physics.waves.digital-signals]
    difficulty: 2
    type: numeric
    stem: "ถ้าแปลงค่าที่สุ่มวัดได้ให้เป็นเลขฐานสอง 3 บิต จะแยกได้กี่ระดับ (ตอบเป็นจำนวนระดับ)"
    answer: { value: 8, unit: ระดับ }
    hints:
      - "ลองเขียนเลข 3 บิตทั้งหมด เริ่มจาก 000, 001, ..."
      - "จำนวนระดับคือ 2 ยกกำลังจำนวนบิต"
    misconceptions:
      - { match: 6, feedback: "ดูเหมือนคิดเป็น 2 × 3 แต่แต่ละบิตเพิ่มจำนวนแบบเป็น 2 เท่า จึงเป็น 2 × 2 × 2" }
      - { match: 9, feedback: "ดูเหมือนคิดเป็น 3 ยกกำลัง 2 ต้องเป็น 2 ยกกำลัง 3 เพราะแต่ละบิตมี 2 ค่า และมี 3 บิต" }
    solution: "$2^3 = 8$ ระดับ ได้แก่ 000, 001, 010, 011, 100, 101, 110, 111"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.digital-signals.p004
    topics: [physics.waves.digital-signals]
    difficulty: 2
    type: mcq
    stem: "ทำไมสัญญาณดิจิทัลที่ส่งมาไกลจึงยังกู้คืนข้อมูลได้ถูกต้อง แม้มีสัญญาณรบกวนปนมา"
    choices:
      - { id: a, text: "ผู้รับเพียงตัดสินว่าแต่ละช่วงเป็น 0 หรือ 1 จึงสร้างสัญญาณที่สะอาดขึ้นใหม่ได้", correct: true }
      - { id: b, text: "สัญญาณดิจิทัลไม่มีสัญญาณรบกวนปนเลย", feedback: "สัญญาณดิจิทัลก็มีสัญญาณรบกวนปน แต่ตราบใดที่ยังแยกระดับสูงกับต่ำออก ผู้รับก็ตัดสินบิตได้ถูก" }
      - { id: c, text: "สัญญาณดิจิทัลเดินทางเร็วกว่าสัญญาณแอนะล็อก จึงไม่ทันถูกรบกวน", feedback: "ถ้าส่งด้วยคลื่นชนิดเดียวกัน ความเร็วเท่ากัน ข้อดีของดิจิทัลอยู่ที่การตัดสินแค่สองระดับ" }
    hints:
      - "สัญญาณดิจิทัลมีกี่ระดับ"
      - "ผู้รับต้องรู้ค่าที่แน่นอน หรือแค่รู้ว่าสูงหรือต่ำ"
    solution: "ผู้รับเทียบสัญญาณกับระดับตัดสิน ถ้าสูงกว่าเป็น 1 ต่ำกว่าเป็น 0 สัญญาณรบกวนที่ไม่แรงพอจะข้ามระดับตัดสินจึงไม่ทำให้ข้อมูลผิด และสร้างสัญญาณใหม่ที่สะอาดได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.digital-signals.p005
    topics: [physics.waves.digital-signals]
    difficulty: 2
    type: mcq
    stem: "เทปคาสเซ็ตเพลงที่อัดต่อกันเป็นทอด ๆ เสียงซ่าเพิ่มขึ้นทุกครั้ง แต่ไฟล์เพลงที่คัดลอกต่อกันกี่ทอดก็ยังเหมือนต้นฉบับ เพราะเหตุใด"
    choices:
      - { id: a, text: "สำเนาดิจิทัลคัดลอกบิต 0 และ 1 ได้ตรงทุกบิต ส่วนสำเนาแอนะล็อกรับสัญญาณรบกวนเพิ่มทุกครั้งที่อัด", correct: true }
      - { id: b, text: "เทปคาสเซ็ตเก็บเสียงได้น้อยกว่า จึงต้องอัดซ้ำ", feedback: "ปัญหาไม่ได้อยู่ที่ความจุ แต่อยู่ที่สัญญาณรบกวนที่ปนเข้ามาทุกครั้งและแยกออกไม่ได้" }
      - { id: c, text: "ไฟล์ดิจิทัลถูกบีบอัด จึงไม่มีเสียงซ่า", feedback: "การบีบอัดไม่ได้เป็นเหตุ ไฟล์ที่ไม่บีบอัดก็คัดลอกได้ตรงเช่นกัน เพราะคัดลอกเป็นบิต" }
    hints:
      - "สัญญาณรบกวนในสำเนาแอนะล็อกแยกออกจากเสียงจริงได้หรือไม่"
      - "การคัดลอกไฟล์คือคัดลอกอะไร"
    solution: "การอัดแอนะล็อกต่อทอดรับสัญญาณรบกวนเพิ่มและสะสมไปเรื่อย ๆ ส่วนการคัดลอกดิจิทัลคือคัดลอกบิต ซึ่งตรวจสอบได้ว่าตรงทุกบิต สำเนาจึงเหมือนต้นฉบับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.digital-signals.p006
    topics: [physics.waves.digital-signals]
    difficulty: 3
    type: numeric
    stem: "ซีดีเพลงแปลงแต่ละค่าที่สุ่มวัดเป็นเลข 16 บิต ค่าที่สุ่มวัดแต่ละค่ามีได้กี่ระดับ (ตอบเป็นจำนวนระดับ)"
    answer: { value: 65536, unit: ระดับ }
    hints:
      - "จำนวนระดับคือ 2 ยกกำลังจำนวนบิต"
      - "คำนวณ $2^{16}$"
    misconceptions:
      - { match: 32, feedback: "ดูเหมือนคิดเป็น 2 × 16 แต่จำนวนระดับคือ 2 ยกกำลัง 16 เพิ่มเป็นสองเท่าทุกบิต" }
      - { match: 256, feedback: "256 คือจำนวนระดับของ 8 บิต ($2^8$) ซีดีใช้ 16 บิต" }
    solution: "$2^{16} = 65{,}536$ ระดับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.digital-signals.p007
    topics: [physics.waves.digital-signals]
    difficulty: 3
    type: numeric
    stem: "ระบบโทรศัพท์บ้านแบบดิจิทัลสุ่มวัดเสียง 8,000 ครั้งต่อวินาที เก็บครั้งละ 8 บิต ช่องสัญญาณเดียว อัตราบิตเป็นกี่กิโลบิตต่อวินาที (1 กิโลบิต = 1,000 บิต) (ตอบในหน่วย kbit/s)"
    answer: { value: 64, unit: kbit/s }
    hints:
      - "อัตราบิต = อัตราสุ่มวัด × จำนวนบิตต่อค่า × จำนวนช่อง"
      - "ได้เป็นบิตต่อวินาทีแล้วหารด้วย 1,000"
    misconceptions:
      - { match: 1, feedback: "ดูเหมือนนำ 8,000 หาร 8 ต้องคูณ เพราะทุกครั้งที่วัดต้องใช้ 8 บิต" }
      - { match: 64000, feedback: "64,000 คือบิตต่อวินาที โจทย์ถามเป็นกิโลบิตต่อวินาที ต้องหาร 1,000" }
    solution: "$8{,}000 \\times 8 \\times 1 = 64{,}000$ บิตต่อวินาที $= 64\\ \\mathrm{kbit/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.digital-signals.p008
    topics: [physics.waves.digital-signals]
    difficulty: 3
    type: match
    stem: "จับคู่ขั้นตอนหรือเทคนิคของระบบดิจิทัลกับหน้าที่"
    pairs:
      - { left: "การสุ่มวัด", right: "วัดค่าสัญญาณเป็นจังหวะเวลาเท่ากัน" }
      - { left: "การแปลงเป็นระดับ", right: "ปัดค่าที่วัดได้เป็นระดับที่ใกล้ที่สุดแล้วเขียนเป็นเลขฐานสอง" }
      - { left: "บิตภาวะคู่", right: "ตรวจว่ามีบิตผิดระหว่างทางหรือไม่" }
      - { left: "การบีบอัดข้อมูล", right: "ลดจำนวนบิตที่ต้องเก็บหรือส่ง" }
    hints:
      - "การแปลงเสียงเป็นดิจิทัลเริ่มจากวัดค่าเป็นจังหวะ แล้วจึงปัด"
      - "บิตภาวะคู่ทำให้จำนวนเลข 1 เป็นเลขคู่เสมอ"
    solution: "สุ่มวัด → วัดเป็นจังหวะเวลาเท่ากัน แปลงเป็นระดับ → ปัดเป็นระดับและเขียนเป็นเลขฐานสอง บิตภาวะคู่ → ตรวจจับบิตผิด บีบอัด → ลดจำนวนบิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.digital-signals.p009
    topics: [physics.waves.digital-signals]
    difficulty: 3
    type: numeric
    stem: "ระบบใช้บิตภาวะคู่ (เติมบิตท้ายให้จำนวนเลข 1 ทั้งหมดเป็นเลขคู่) ถ้าข้อมูลคือ 1101011 ต้องเติมบิตภาวะคู่เป็น 0 หรือ 1 (ตอบ 0 หรือ 1)"
    answer: { value: 1 }
    hints:
      - "นับจำนวนเลข 1 ในข้อมูล"
      - "ถ้าจำนวนเลข 1 เป็นเลขคี่ ต้องเติม 1 ให้เป็นเลขคู่"
    misconceptions:
      - { match: 5, feedback: "5 คือจำนวนเลข 1 ในข้อมูล คำตอบต้องเป็นบิตเดียว 0 หรือ 1 ที่ทำให้จำนวนรวมเป็นเลขคู่" }
    solution: "1101011 มีเลข 1 อยู่ 5 ตัว (คี่) จึงต้องเติมบิตภาวะคู่เป็น 1 รวมเป็น 6 ตัว (คู่) ข้อมูลที่ส่งคือ 11010111"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.digital-signals.p010
    topics: [physics.waves.digital-signals]
    difficulty: 4
    type: mcq
    stem: "ระบบใช้บิตภาวะคู่ (จำนวนเลข 1 ทั้ง 8 บิตต้องเป็นเลขคู่) ผู้รับได้ข้อมูล 10110110 ผู้รับควรสรุปอย่างไร"
    choices:
      - { id: a, text: "มีบิตผิดอย่างน้อยหนึ่งบิต ควรขอให้ส่งใหม่", correct: true }
      - { id: b, text: "ข้อมูลถูกต้อง เพราะได้ครบ 8 บิต", feedback: "ครบ 8 บิตไม่ได้แปลว่าถูก ต้องนับเลข 1 ซึ่งมี 5 ตัว เป็นเลขคี่" }
      - { id: c, text: "รู้ได้ว่าบิตที่ 3 ผิด แล้วแก้เองได้", feedback: "บิตภาวะคู่บอกได้เพียงว่ามีบิตผิด ไม่ได้บอกว่าผิดที่ตำแหน่งใด จึงแก้เองไม่ได้" }
    hints:
      - "นับเลข 1 ในข้อมูลที่ได้รับ"
      - "ถ้าจำนวนเป็นเลขคี่ แปลว่าอะไร"
    solution: "10110110 มีเลข 1 อยู่ 5 ตัว เป็นเลขคี่ ขัดกับกติกาบิตภาวะคู่ แสดงว่ามีบิตพลิกระหว่างทาง แต่ไม่รู้ว่าบิตใด จึงขอให้ส่งใหม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.digital-signals.p011
    topics: [physics.waves.digital-signals]
    difficulty: 4
    type: numeric
    stem: "เสียงพูดในโทรศัพท์มีความถี่สูงสุดที่ต้องการเก็บประมาณ 4,000 Hz อัตราสุ่มวัดต่ำสุดที่ยังเก็บรายละเอียดของเสียงนี้ได้คือกี่ครั้งต่อวินาที (ตอบในหน่วย Hz)"
    answer: { value: 8000, unit: Hz }
    hints:
      - "ต้องสุ่มวัดอย่างน้อยกี่เท่าของความถี่สูงสุด"
      - "คูณ 4,000 ด้วย 2"
    misconceptions:
      - { match: 4000, feedback: "สุ่มวัดเท่ากับความถี่ของเสียงจะได้เพียงจุดเดียวต่อรอบคลื่น เก็บรูปคลื่นไม่ได้ ต้องอย่างน้อย 2 เท่า" }
      - { match: 2000, feedback: "ต้องสุ่มวัดถี่กว่าความถี่ของเสียง ไม่ใช่น้อยกว่า อย่างน้อย 2 เท่าของความถี่สูงสุด" }
    solution: "อัตราสุ่มวัดต้องอย่างน้อย 2 เท่าของความถี่สูงสุด: $2 \\times 4{,}000 = 8{,}000$ Hz ระบบโทรศัพท์ดิจิทัลจึงสุ่มวัด 8,000 ครั้งต่อวินาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.digital-signals.p012
    topics: [physics.waves.digital-signals]
    difficulty: 4
    type: text
    stem: "ตัวแปลงสัญญาณ 3 บิตแบ่งแรงดันเป็น 8 ระดับ คือ 0, 1, 2, ..., 7 โวลต์ แทนด้วยเลขฐานสอง 000 ถึง 111 ถ้าสุ่มวัดได้ 5.4 V ตัวแปลงจะเก็บเป็นเลขฐานสองอะไร (ตอบเป็นเลข 3 บิต)"
    accepted: ["101"]
    misconceptions:
      - { match: "110", feedback: "110 คือระดับ 6 V แต่ 5.4 V ใกล้ 5 V มากกว่า ต้องปัดลงเป็นระดับ 5" }
      - { match: "100", feedback: "100 คือระดับ 4 V ลองแปลงใหม่: 5 = 4 + 1 เขียนเป็นฐานสองได้อย่างไร" }
    hints:
      - "ปัด 5.4 V เป็นระดับที่ใกล้ที่สุดก่อน"
      - "แปลงระดับนั้นเป็นเลขฐานสอง 3 หลัก (หลักละ 4, 2, 1)"
    solution: "5.4 V ใกล้ระดับ 5 V ที่สุด $5 = 4 + 1$ จึงเขียนเป็น 101 ความคลาดเคลื่อนจากการแปลงเป็นระดับคือ $5.4 - 5 = 0.4$ V"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.digital-signals.p013
    topics: [physics.waves.digital-signals]
    difficulty: 4
    type: mcq
    stem: "ลูกเสือต้องส่งข้อความสั้น ๆ ข้ามสนามฟุตบอลตอนกลางคืน ระหว่างที่งานวัดข้าง ๆ เปิดเพลงเสียงดังมาก วิธีใดเหมาะที่สุด"
    choices:
      - { id: a, text: "กะพริบไฟฉายเป็นรหัสมอร์ส", correct: true }
      - { id: b, text: "ตีกลองเป็นจังหวะรหัสมอร์ส", feedback: "เสียงกลองจะถูกเสียงเพลงจากงานวัดกลบ ผู้รับแยกจังหวะไม่ออก" }
      - { id: c, text: "โบกธงสัญญาณ", feedback: "ตอนกลางคืนมองเห็นธงได้ยากมาก ถ้าไม่มีไฟส่อง" }
      - { id: d, text: "ตะโกนบอกข้อความ", feedback: "ระยะไกลและเสียงเพลงดังทำให้ผู้รับฟังไม่ชัด" }
    hints:
      - "ตอนกลางคืนอะไรมองเห็นได้ไกล"
      - "สิ่งรบกวนในสถานการณ์นี้คือเสียง วิธีที่ดีต้องไม่ถูกเสียงรบกวน"
    solution: "สิ่งรบกวนคือเสียงดังและความมืด ไฟฉายมองเห็นได้ไกลในที่มืดและไม่ถูกเสียงรบกวน การกะพริบสั้นยาวเป็นรหัสมอร์สจึงเหมาะที่สุด"
