- id: business.econ.inflation-unemployment.p019
  topics:
  - business.econ.inflation-unemployment
  difficulty: 2
  type: order
  stem: เรียงขั้นตอนการคำนวณอัตราเงินเฟ้อจากตะกร้าสินค้า
  items:
  - เลือกตะกร้าสินค้าและบริการที่ครัวเรือนซื้อเป็นประจำ
  - สำรวจราคาของสินค้าในตะกร้าแต่ละปี
  - คิดค่าใช้จ่ายของตะกร้า (ปริมาณคงที่) ในแต่ละปี
  - หารด้วยค่าตะกร้าปีฐานแล้วคูณ 100 ได้ดัชนีราคา
  - เทียบดัชนีปีนี้กับปีก่อนเป็นร้อยละ ได้อัตราเงินเฟ้อ
  hints:
  - ต้องมีตะกร้าก่อนจึงสำรวจราคาได้
  - อัตราเงินเฟ้อคำนวณจากดัชนีสองปี
  solution: ตะกร้า → สำรวจราคา → ค่าตะกร้า → ดัชนี (เทียบปีฐาน) → อัตราเงินเฟ้อ (เทียบปีก่อน)
