id: business.econ.circular-flow
subject: business
title:
  th: 'ความสัมพันธ์ทางเศรษฐกิจ: ครัวเรือน ผู้ผลิต ธนาคาร และรัฐ'
  en: 'Economic relationships: households, producers, banks and government'
summary: การทำงานสุจริตและแหล่งรายได้ ผู้ซื้อกับผู้ขาย แผนภาพการหมุนเวียนของรายได้ระหว่างครัวเรือน ธุรกิจ ธนาคาร และรัฐ การพึ่งพาอาศัยกันและการแข่งขันในประเทศ
difficulty: 3
minutes: 35
prerequisites:
- business.econ.money-banking
- business.econ.production-factors
encompasses:
- id: business.econ.production-factors
  weight: 0.3
- id: business.econ.money-banking
  weight: 0.2
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  src: circular-flow.svg
  alt: แผนภาพการหมุนเวียนของรายได้ ครัวเรือนอยู่ซ้าย (เป็นเจ้าของปัจจัยการผลิต ซื้อสินค้า) ธุรกิจอยู่ขวา (จ้างปัจจัยการผลิต ผลิตและขาย) ด้านบนเป็นตลาดสินค้าและบริการ ครัวเรือนจ่ายเงินซื้อสินค้า (เส้นทึบ) ธุรกิจได้รายรับจากการขาย สินค้าและบริการไหลจากธุรกิจผ่านตลาดไปครัวเรือน (เส้นประ) ด้านล่างเป็นตลาดปัจจัยการผลิต ครัวเรือนให้แรงงาน ที่ดิน ทุน (เส้นประ) แก่ธุรกิจ ธุรกิจจ่ายค่าจ้าง ค่าเช่า ดอกเบี้ย กำไร กลับเป็นรายได้ของครัวเรือน (เส้นทึบ) ตรงกลางมีธนาคาร ครัวเรือนฝากเงินออม ธนาคารให้ธุรกิจกู้ไปลงทุน และรัฐบาล ครัวเรือนและธุรกิจจ่ายภาษีให้รัฐ รัฐให้สวัสดิการและบริการแก่ครัวเรือน และซื้อสินค้าจากธุรกิจ
  caption: เงินไหลวนระหว่างครัวเรือน ธุรกิจ ธนาคาร และรัฐบาล ส่วนสินค้าและปัจจัยการผลิตไหลสวนทาง
- type: check
  problem: business.econ.circular-flow.p006
  prompt: ลองอ่านลูกศรในแผนภาพ
- type: worked-example
  title: เงินเดือนของแม่ไปไหนบ้าง
  problem: แม่ของนิดทำงานโรงงานได้เงินเดือน $20{,}000$ บาท ถูกหักภาษีและเงินสมทบประกันสังคม $900$ บาท ฝากธนาคาร $3{,}000$ บาท ที่เหลือใช้ซื้ออาหารและของใช้ (สมมติ) บอกว่าเงินแต่ละส่วนไหลไปที่ภาคส่วนใดในแผนภาพ และเท่าไร
  steps:
  - text: เงินเดือน $20{,}000$ บาท คือรายได้จากปัจจัยแรงงาน ไหลจากธุรกิจ (โรงงาน) มาที่ครัวเรือน
    why: เป็นลูกศรจากตลาดปัจจัยการผลิตมาที่ครัวเรือน
  - text: ภาษีและเงินสมทบ $900$ บาท ไหลไปรัฐบาล
  - text: เงินฝาก $3{,}000$ บาท ไหลไปธนาคาร ซึ่งนำไปให้ธุรกิจหรือครัวเรือนอื่นกู้ต่อ
    why: เงินออมไม่ได้หายไป แต่ไหลกลับเข้าวงจรผ่านการกู้ยืม
  - text: ใช้จ่าย $= 20{,}000 - 900 - 3{,}000 = 16{,}100$ บาท ไหลไปธุรกิจผ่านตลาดสินค้าและบริการ
  answer: รัฐบาล $900$ บาท ธนาคาร $3{,}000$ บาท ธุรกิจ $16{,}100$ บาท
- type: check
  problem: business.econ.circular-flow.p004
  prompt: ใครได้ประโยชน์จากการซื้อขาย
- type: worked-example
  title: เงินหมุนเวียนในชุมชน
  problem: นักท่องเที่ยวซื้อผ้าทอจากกลุ่มแม่บ้าน $5{,}000$ บาท กลุ่มแม่บ้านใช้จ่ายต่อในชุมชน $50\%$ (ซื้อด้าย จ้างคนย้อมผ้า) คนที่ได้รับก็ใช้จ่ายในชุมชนต่ออีก $50\%$ (สมมติ) นับ $3$ รอบ เงินหมุนเวียนในชุมชนรวมเท่าไร
  steps:
  - text: รอบ 1 $= 5{,}000$ บาท
  - text: รอบ 2 $= 5{,}000 \times 0.5 = 2{,}500$ บาท
    why: อีกครึ่งหนึ่งถูกเก็บออมหรือใช้จ่ายนอกชุมชน
  - text: รอบ 3 $= 2{,}500 \times 0.5 = 1{,}250$ บาท
  - text: รวม $= 5{,}000 + 2{,}500 + 1{,}250 = 8{,}750$ บาท
  answer: $8{,}750$ บาท ซื้อของในชุมชนช่วยให้เงินหมุนหลายรอบ
glossary:
- term: ครัวเรือน
  definition: บุคคลหรือครอบครัวที่เป็นเจ้าของปัจจัยการผลิต มีรายได้ และซื้อสินค้าและบริการ
- term: ธุรกิจ (หน่วยผลิต)
  definition: ผู้ที่นำปัจจัยการผลิตมาผลิตสินค้าและบริการเพื่อขาย
- term: ตลาดสินค้าและบริการ
  definition: ที่ที่ครัวเรือน รัฐบาล และธุรกิจซื้อสินค้าและบริการจากผู้ผลิต
- term: ตลาดปัจจัยการผลิต
  definition: ที่ที่ธุรกิจจ้างหรือซื้อแรงงาน ที่ดิน และทุนจากครัวเรือน
- term: แผนภาพการหมุนเวียน
  definition: แผนภาพแสดงการไหลของเงิน สินค้า และปัจจัยการผลิตระหว่างภาคเศรษฐกิจ
- term: การรั่วไหลและการอัดฉีด
  definition: เงินออมและภาษีรั่วออกจากวงจรการใช้จ่าย การลงทุนและรายจ่ายรัฐฉีดกลับเข้ามา
- term: การพึ่งพาอาศัยกันทางเศรษฐกิจ
  definition: การที่ผู้ผลิต ผู้บริโภค สถาบันการเงิน และรัฐต่างต้องอาศัยกันในการผลิต ซื้อขาย และให้บริการ
flashcards:
- front: ผลตอบแทนของปัจจัยการผลิต
  back: แรงงาน → ค่าจ้าง · ที่ดิน → ค่าเช่า · ทุน → ดอกเบี้ย · ผู้ประกอบการ → กำไร
- front: สองตลาดในแผนภาพการหมุนเวียน
  back: ตลาดสินค้าและบริการ · ตลาดปัจจัยการผลิต
- front: ธนาคารในวงจรเศรษฐกิจ
  back: รับเงินออมจากครัวเรือน → ให้ธุรกิจกู้ไปลงทุน
- front: รัฐบาลในวงจรเศรษฐกิจ
  back: เก็บภาษี → จัดบริการสาธารณะ สวัสดิการ และซื้อสินค้าจากธุรกิจ
- front: รายจ่ายของคนหนึ่ง
  back: คือรายรับของอีกคนหนึ่ง เศรษฐกิจทั้งระบบจึงพึ่งพากัน
