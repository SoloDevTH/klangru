topic: engineering.environmental.solid-hazardous-waste
rows:
  - { framework: th-coe-engineering-basics, indicators: ["ENV-3.6"], coverage: partial, note: "สอนลำดับชั้นการจัดการขยะ การคำนวณปริมาณและเที่ยวรถเก็บขน การหมักทำปุ๋ย หลุมฝังกลบและสมดุลน้ำชะ และการจำแนกของเสียอันตรายและใบกำกับในระดับแนวคิด (รายละเอียดระบบของไทยต้องตรวจก่อนเผยแพร่) แต่ยังไม่สอนการออกแบบระบบเตาเผาและการคัดแยกเชิงอุตสาหกรรมอย่างละเอียด" }
  - { framework: th-coe-engineering-basics, indicators: ["ENV-3.16"], coverage: partial, note: "สอนวิธีฟื้นฟูดินและน้ำใต้ดินที่ปนเปื้อนเชิงแนวคิด (ขุดออก สูบบำบัด บำบัดทางชีวภาพ) และการคำนวณมวลดินที่ต้องขุด แต่ยังไม่สอนการออกแบบระบบสูบบำบัดหรือการประเมินความเสี่ยงของพื้นที่" }
  - { framework: th-coe-engineering-basics, indicators: ["IE-3.2"], coverage: partial, note: "สอนการจัดการของเสียอันตรายและการติดตามด้วยใบกำกับในภาพรวม แต่ยังไม่สอนระบบความปลอดภัยอุตสาหกรรม และการประเมินความเสี่ยงในโรงงาน ส่วนกากกัมมันตรังสีสอนเฉพาะหลักการ (ครึ่งชีวิต การแยกและกักเก็บ) ไม่มีโจทย์ และชื่อกฎหมายกับหน่วยงานกำกับของไทยต้องตรวจก่อนเผยแพร่" }
  - { framework: th-coe-engineering-basics, indicators: ["CHE-3.12"], coverage: partial, note: "สอนหลักการจัดการของเสียและลำดับชั้นการจัดการที่เชื่อมกับการคำนวณดุลมวล แต่ยังไม่สอนการบำบัดน้ำเสียและการลดการปล่อยก๊าซเรือนกระจกอย่างเป็นระบบ" }
