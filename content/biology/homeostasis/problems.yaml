      - { id: b, text: "วัดชีพจรของนักเรียน 1 คนหลังวิ่ง 1 ครั้ง แล้วสรุปผล", feedback: "ไม่มีค่าก่อนออกกำลังกายให้เทียบ และข้อมูลคนเดียวเชื่อถือได้น้อย" }
      - { id: c, text: "ให้นักเรียนแต่ละคนออกกำลังกายต่างชนิดกันและวัดเมื่อสะดวก", feedback: "ไม่ได้ควบคุมตัวแปร ผลจึงเทียบกันไม่ได้" }
      - { id: d, text: "วัดชีพจรก่อนออกกำลังกายเท่านั้น", feedback: "ต้องติดตามค่าหลังออกกำลังกายจึงเห็นการกลับสู่ปกติ" }
    hints:
      - "การทดลองที่ดีต้องมีค่าเริ่มต้นสำหรับเทียบ ควบคุมตัวแปร และทำซ้ำ"
      - "ต้องวัดหลายครั้งหลังออกกำลังกายจึงเห็นแนวโน้ม"
    solution: "แผน a มีค่าพื้นฐาน ควบคุมชนิดและเวลาการออกกำลังกาย วัดเป็นช่วงเวลาสม่ำเสมอจนค่ากลับสู่ระดับเดิม และใช้หลายคน จึงเป็นหลักฐานที่ดีที่สุด"
