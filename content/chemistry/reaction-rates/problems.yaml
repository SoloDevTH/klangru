problems:
  - id: chemistry.kinetics.reaction-rates.p001
    topics: [chemistry.kinetics.reaction-rates]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นปฏิกิริยาที่เกิดเร็วที่สุด"
    choices:
      - { id: a, text: "ดินปืนในพลุลอยกระทงระเบิด", correct: true, feedback: "ถูก ปฏิกิริยาเกิดเสร็จในเสี้ยววินาที" }
      - { id: b, text: "รั้วเหล็กเป็นสนิม", feedback: "การเกิดสนิมใช้เวลาหลายวันถึงหลายปี" }
      - { id: c, text: "กล้วยค่อย ๆ สุกบนโต๊ะ", feedback: "ใช้เวลาหลายวัน" }
      - { id: d, text: "การผุพังของหินปูนจากฝน", feedback: "ใช้เวลาหลายสิบถึงหลายร้อยปี" }
    hints:
      - "เปรียบเทียบเวลาที่ใช้จนปฏิกิริยาเสร็จ"
      - "ปฏิกิริยาที่เห็นผลทันทีเร็วที่สุด"
    solution: "การระเบิดของดินปืนเกิดเสร็จในเสี้ยววินาที จึง **เร็วที่สุด** ข้ออื่นใช้เวลาเป็นวันถึงเป็นปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.kinetics.reaction-rates.p002
    topics: [chemistry.kinetics.reaction-rates]
    difficulty: 2
    type: numeric
    stem: "ใส่ลวดแมกนีเซียมในกรดไฮโดรคลอริก เก็บแก๊สไฮโดรเจนได้ 60 cm³ ใน 30 วินาทีแรก อัตราเฉลี่ยของการเกิดแก๊สเป็นกี่ cm³/s"
    answer: { value: 2.0, tolerance: 0.02, unit: "cm³/s" }
    misconceptions:
      - { match: 0.5, feedback: "หารกลับด้าน อัตราคือปริมาตรหารด้วยเวลา" }
      - { match: 1800, feedback: "คูณกันไม่ได้ อัตราคือปริมาณที่เปลี่ยนต่อหน่วยเวลา" }
    hints:
      - "อัตรา = ปริมาณที่เปลี่ยน ÷ เวลา"
      - "หาร 60 ด้วย 30"
    solution: "อัตราเฉลี่ย $= \\dfrac{60}{30} =$ **2.0 cm³/s**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.kinetics.reaction-rates.p003
    topics: [chemistry.kinetics.reaction-rates]
    difficulty: 2
    type: mcq
    stem: "ถ้าวัดความเข้มข้นของสารตั้งต้นที่ลดลงในหน่วย $\\mathrm{mol/dm^3}$ และเวลาเป็นวินาที อัตราการเกิดปฏิกิริยามีหน่วยใด"
    choices:
      - { id: a, text: "$\\mathrm{mol/(dm^3 \\cdot s)}$", correct: true, feedback: "ถูก ความเข้มข้นหารด้วยเวลา" }
      - { id: b, text: "$\\mathrm{mol/dm^3}$", feedback: "นี่คือหน่วยของความเข้มข้น ยังไม่ได้หารด้วยเวลา" }
      - { id: c, text: "$\\mathrm{mol \\cdot s/dm^3}$", feedback: "คูณเวลาแทนการหาร" }
      - { id: d, text: "$\\mathrm{s}$", feedback: "วินาทีคือหน่วยของเวลา" }
    hints:
      - "อัตรา = การเปลี่ยนแปลงของความเข้มข้น ÷ เวลา"
      - "นำหน่วยมาหารกัน"
    solution: "$\\dfrac{\\mathrm{mol/dm^3}}{\\mathrm{s}} =$ **mol/(dm³·s)** หรือเขียนว่า $\\mathrm{mol\\,dm^{-3}\\,s^{-1}}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.kinetics.reaction-rates.p004
    topics: [chemistry.kinetics.reaction-rates]
    difficulty: 3
    type: numeric
    stem: "ความเข้มข้นของสาร A ลดลงจาก $0.80$ เป็น $0.50\\ \\mathrm{mol/dm^3}$ ใน 60 วินาที อัตราเฉลี่ยของการลดลงของ A เป็นกี่ $\\times 10^{-3}\\ \\mathrm{mol/(dm^3 \\cdot s)}$ (เช่น ถ้าได้ $2.0 \\times 10^{-3}$ ให้ตอบ 2.0)"
    answer: { value: 5.0, tolerance: 0.05, unit: "× 10⁻³ mol/(dm³·s)" }
    misconceptions:
      - { match: 13.3, feedback: "ใช้ความเข้มข้นเริ่มต้นหารเวลา ต้องใช้ผลต่าง $0.80 - 0.50$" }
      - { match: 8.3, feedback: "ใช้ความเข้มข้นสุดท้ายหารเวลา ต้องใช้ผลต่าง $0.80 - 0.50$" }
    hints:
      - "หาความเข้มข้นที่ลดลงก่อน"
      - "หารด้วย 60 s แล้วเขียนในรูป $\\times 10^{-3}$"
    solution: "$\\dfrac{0.80 - 0.50}{60} = \\dfrac{0.30}{60} = 0.0050 = 5.0 \\times 10^{-3}\\ \\mathrm{mol/(dm^3 \\cdot s)}$ ตอบ **5.0**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.kinetics.reaction-rates.p005
    topics: [chemistry.kinetics.reaction-rates]
    difficulty: 3
    type: numeric
    stem: "ปฏิกิริยา $\\mathrm{2H_2O_2 \\to 2H_2O + O_2}$ ความเข้มข้นของ $\\mathrm{H_2O_2}$ ลดลงด้วยอัตรา $0.040\\ \\mathrm{mol/(dm^3 \\cdot min)}$ อัตราการเกิด $\\mathrm{O_2}$ เป็นกี่ $\\mathrm{mol/(dm^3 \\cdot min)}$"
    answer: { value: 0.020, tolerance: 0.0005, unit: "mol/(dm³·min)" }
    misconceptions:
      - { match: 0.04, feedback: "สัมประสิทธิ์ของ $\\mathrm{H_2O_2}$ (2) กับ $\\mathrm{O_2}$ (1) ไม่เท่ากัน อัตราจึงไม่เท่ากัน" }
      - { match: 0.08, feedback: "คูณ 2 กลับด้าน $\\mathrm{O_2}$ เกิดได้ครึ่งหนึ่งของ $\\mathrm{H_2O_2}$ ที่หายไป" }
    hints:
      - "$\\mathrm{H_2O_2}$ หายไป 2 mol ได้ $\\mathrm{O_2}$ กี่โมล"
      - "คูณด้วยอัตราส่วนสัมประสิทธิ์ $\\tfrac12$"
    solution: "อัตราเกิด $\\mathrm{O_2} = 0.040 \\times \\dfrac{1}{2} =$ **0.020 mol/(dm³·min)**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.kinetics.reaction-rates.p006
    topics: [chemistry.kinetics.reaction-rates]
    difficulty: 4
    type: numeric
    stem: "กราฟแสดงปริมาตรแก๊ส $\\mathrm{CO_2}$ ที่เกิดจากหินปูนทำปฏิกิริยากับกรดไฮโดรคลอริก จงหาอัตราเฉลี่ยของการเกิดแก๊สในช่วงเวลา 20 ถึง 60 วินาที (cm³/s)"
    figure:
      src: p-gas-volume-graph.svg
      alt: "กราฟเส้นโค้ง แกนนอนเวลา 0 ถึง 120 วินาที แกนตั้งปริมาตร CO₂ 0 ถึง 80 cm³ มีจุดข้อมูลที่ (0 s, 0 cm³), (20 s, 30 cm³), (40 s, 48 cm³), (60 s, 60 cm³), (80 s, 68 cm³), (100 s, 72 cm³), (120 s, 74 cm³) เส้นชันตอนต้นแล้วค่อย ๆ ราบลง"
    answer: { value: 0.75, tolerance: 0.02, unit: "cm³/s" }
    misconceptions:
      - { match: 1.0, feedback: "ใช้ช่วงตั้งแต่ 0 ถึง 60 วินาที แต่โจทย์ถามช่วง 20 ถึง 60 วินาที" }
      - { match: 1.5, feedback: "ใช้ปริมาตรที่ 60 วินาทีหารด้วยช่วงเวลา 40 วินาที ต้องใช้ผลต่างของปริมาตร" }
    hints:
      - "อ่านปริมาตรที่ 20 s และ 60 s จากกราฟ"
      - "อัตราเฉลี่ย = ผลต่างปริมาตร ÷ ผลต่างเวลา"
    solution: "ที่ 20 s ได้ 30 cm³ ที่ 60 s ได้ 60 cm³ อัตราเฉลี่ย $= \\dfrac{60 - 30}{60 - 20} = \\dfrac{30}{40} =$ **0.75 cm³/s**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.kinetics.reaction-rates.p007
    topics: [chemistry.kinetics.reaction-rates]
    difficulty: 3
    type: mcq
    stem: "จากกราฟปริมาตรแก๊สกับเวลาที่ชันตอนต้นแล้วค่อย ๆ ราบลง ทำไมอัตราการเกิดแก๊สจึงลดลงเมื่อเวลาผ่านไป"
    choices:
      - { id: a, text: "สารตั้งต้นเหลือน้อยลง ความเข้มข้นลดลง อนุภาคจึงชนกันน้อยลงต่อหน่วยเวลา", correct: true, feedback: "ถูก เมื่อสารตั้งต้นหมด อัตราจะเป็นศูนย์และกราฟราบ" }
      - { id: b, text: "แก๊สที่เกิดขึ้นทำให้ปฏิกิริยาร้อนเกินไป", feedback: "ปฏิกิริยานี้คายความร้อนเพียงเล็กน้อย และอุณหภูมิที่สูงขึ้นจะทำให้เร็วขึ้น ไม่ใช่ช้าลง" }
      - { id: c, text: "พลังงานก่อกัมมันต์เพิ่มขึ้นตามเวลา", feedback: "พลังงานก่อกัมมันต์เป็นสมบัติของปฏิกิริยา ไม่เปลี่ยนตามเวลา" }
    hints:
      - "อะไรถูกใช้ไประหว่างปฏิกิริยา"
      - "ความเข้มข้นมีผลต่อความถี่ของการชนอย่างไร"
    solution: "สารตั้งต้นถูกใช้ไปเรื่อย ๆ **ความเข้มข้นลดลง** การชนที่เกิดปฏิกิริยาต่อหน่วยเวลาจึงลดลง อัตราลดลง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.kinetics.reaction-rates.p008
    topics: [chemistry.kinetics.reaction-rates]
    difficulty: 3
    type: match
    stem: "จับคู่การเปลี่ยนแปลงกับเหตุผลที่ทำให้ปฏิกิริยาเร็วขึ้น"
    pairs:
      - { left: "เพิ่มความเข้มข้นของกรด", right: "อนุภาคต่อปริมาตรมากขึ้น ชนกันบ่อยขึ้นต่อหน่วยเวลา" }
      - { left: "บดหินปูนเป็นผง", right: "อนุภาคที่ผิวสัมผัสกับกรดได้มากขึ้น" }
      - { left: "เพิ่มอุณหภูมิ", right: "การชนที่มีพลังงานถึงพลังงานก่อกัมมันต์มีสัดส่วนมากขึ้น" }
      - { left: "เติมตัวเร่งปฏิกิริยา", right: "เกิดทางเลือกที่มีพลังงานก่อกัมมันต์ต่ำลง" }
    hints:
      - "ทุกปัจจัยอธิบายด้วยทฤษฎีการชน"
      - "บางปัจจัยเพิ่มจำนวนการชน บางปัจจัยเพิ่มสัดส่วนการชนที่มีพลังงานพอ"
    solution: "ความเข้มข้นและพื้นที่ผิวเพิ่มจำนวนการชน อุณหภูมิเพิ่มสัดส่วนการชนที่มีพลังงานพอ ตัวเร่งลดพลังงานก่อกัมมันต์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.kinetics.reaction-rates.p009
    topics: [chemistry.kinetics.reaction-rates]
    difficulty: 2
    type: mcq
    stem: "แกงเขียวหวานที่แช่ตู้เย็นเก็บได้นานกว่าแกงที่วางไว้นอกตู้ในอากาศร้อนของไทย เพราะเหตุใด"
    choices:
      - { id: a, text: "อุณหภูมิต่ำทำให้ปฏิกิริยาเคมีและการเติบโตของจุลินทรีย์ที่ทำให้อาหารเสียช้าลง", correct: true, feedback: "ถูก อุณหภูมิต่ำ อนุภาคมีพลังงานถึงพลังงานก่อกัมมันต์น้อยลง" }
      - { id: b, text: "ตู้เย็นเพิ่มความเข้มข้นของอาหาร", feedback: "ตู้เย็นไม่ได้เปลี่ยนความเข้มข้นของอาหาร ปัจจัยหลักคืออุณหภูมิ" }
      - { id: c, text: "ความเย็นเป็นตัวเร่งปฏิกิริยา", feedback: "ตัวเร่งทำให้ปฏิกิริยาเร็วขึ้น ไม่ใช่ช้าลง และความเย็นไม่ใช่สาร" }
    hints:
      - "ปัจจัยใดที่ตู้เย็นเปลี่ยน"
      - "อุณหภูมิต่ำมีผลต่ออัตราอย่างไร"
    solution: "ตู้เย็น **ลดอุณหภูมิ** ปฏิกิริยาที่ทำให้อาหารบูดเน่าจึงเกิดช้าลง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.kinetics.reaction-rates.p010
    topics: [chemistry.kinetics.reaction-rates]
    difficulty: 3
    type: mcq
    stem: "โรงสีข้าวต้องควบคุมฝุ่นแป้งและฝุ่นรำในอากาศ และห้ามจุดไฟในบริเวณนั้น แม้ข้าวเป็นกองจะติดไฟยาก เหตุผลใดถูกต้องที่สุด"
    choices:
      - { id: a, text: "ฝุ่นละเอียดมีพื้นที่ผิวรวมมาก สัมผัสออกซิเจนได้ทั่ว เมื่อมีประกายไฟจึงเผาไหม้เร็วมากจนระเบิดได้", correct: true, feedback: "ถูก สารเดียวกันแต่พื้นที่ผิวมาก ปฏิกิริยาเร็วขึ้นมหาศาล" }
      - { id: b, text: "ฝุ่นแป้งเป็นสารคนละชนิดกับเมล็ดข้าว", feedback: "ฝุ่นแป้งเป็นสารชนิดเดียวกับในเมล็ดข้าว ความต่างคือขนาดอนุภาค" }
      - { id: c, text: "ฝุ่นทำให้อุณหภูมิในโรงสีต่ำลง", feedback: "ฝุ่นไม่ได้ลดอุณหภูมิ และอุณหภูมิต่ำทำให้ปฏิกิริยาช้าลง" }
    hints:
      - "เปรียบเทียบกองข้าวกับฝุ่นละเอียดที่ลอยในอากาศ"
      - "ปัจจัยใดเปลี่ยนเมื่อของแข็งแตกเป็นผงละเอียด"
    solution: "ฝุ่นละเอียดมี **พื้นที่ผิวมาก** และกระจายปนกับออกซิเจน การเผาไหม้จึงเกิดเร็วมากจนเป็นการระเบิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.kinetics.reaction-rates.p011
    topics: [chemistry.kinetics.reaction-rates]
    difficulty: 4
    type: numeric
    stem: "ปฏิกิริยาหนึ่งมีพลังงานของสารตั้งต้น 50 kJ สารเชิงซ้อนกัมมันต์ 130 kJ และผลิตภัณฑ์ 20 kJ พลังงานก่อกัมมันต์ของ **ปฏิกิริยาย้อนกลับ** (ผลิตภัณฑ์กลับเป็นสารตั้งต้น) เป็นกี่ kJ"
    answer: { value: 110, unit: kJ }
    misconceptions:
      - { match: 80, feedback: "80 kJ คือพลังงานก่อกัมมันต์ของปฏิกิริยาไปข้างหน้า ปฏิกิริยาย้อนกลับเริ่มจากระดับผลิตภัณฑ์" }
      - { match: 30, feedback: "30 kJ คือขนาดของ $\\Delta H$ ไม่ใช่พลังงานก่อกัมมันต์" }
    hints:
      - "ปฏิกิริยาย้อนกลับเริ่มที่ระดับพลังงานใด"
      - "พลังงานก่อกัมมันต์ = ยอด − ระดับเริ่มต้น"
    solution: "ปฏิกิริยาย้อนกลับเริ่มที่ผลิตภัณฑ์ (20 kJ) ต้องขึ้นไปถึงยอด 130 kJ จึงมี $E_a = 130 - 20 =$ **110 kJ**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.kinetics.reaction-rates.p012
    topics: [chemistry.kinetics.reaction-rates]
    difficulty: 4
    type: mcq
    stem: "เติมแมงกานีส(IV) ออกไซด์เล็กน้อยลงในไฮโดรเจนเปอร์ออกไซด์ แก๊สออกซิเจนเกิดเร็วขึ้นมาก เมื่อปฏิกิริยาหมดแล้วกรองและชั่ง $\\mathrm{MnO_2}$ ได้มวลเท่าเดิม ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "$\\mathrm{MnO_2}$ เป็นตัวเร่งปฏิกิริยา ลดพลังงานก่อกัมมันต์ แต่ไม่เปลี่ยน $\\Delta H$ และปริมาณ $\\mathrm{O_2}$ ทั้งหมดที่ได้", correct: true, feedback: "ถูก ตัวเร่งได้คืนครบและทำให้ได้ผลิตภัณฑ์เท่าเดิมแต่เร็วขึ้น" }
      - { id: b, text: "$\\mathrm{MnO_2}$ ทำให้ได้ $\\mathrm{O_2}$ มากขึ้น", feedback: "ปริมาณ $\\mathrm{O_2}$ ขึ้นกับปริมาณ $\\mathrm{H_2O_2}$ ตัวเร่งเปลี่ยนแค่ความเร็ว" }
      - { id: c, text: "$\\mathrm{MnO_2}$ ทำให้ปฏิกิริยาคายความร้อนมากขึ้น", feedback: "ตัวเร่งไม่เปลี่ยนพลังงานของสารตั้งต้นและผลิตภัณฑ์ $\\Delta H$ จึงเท่าเดิม" }
