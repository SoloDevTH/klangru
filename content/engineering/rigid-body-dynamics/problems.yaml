  - id: engineering.mechanics.rigid-body-dynamics.p015
    topics: [engineering.mechanics.rigid-body-dynamics]
    difficulty: 3
    type: expression
    stem: "จานกลมตันมวล $m$ กลิ้งโดยไม่ไถลด้วยความเร็วจุดศูนย์กลาง $v$ จงเขียนพลังงานจลน์รวม"
    prefix: "T ="
    answer: { latex: "\\frac{3}{4}mv^2", variables: [m, v] }
    misconceptions:
      - { match: "\\frac{1}{2}mv^2", feedback: "คิดเฉพาะการเลื่อน ลืมพลังงานการหมุน $\\tfrac12I_G\\omega^2$" }
      - { match: "mv^2", feedback: "ใช้ $I_G = mr^2$ ของวงแหวน จานตันมี $I_G = \\tfrac12mr^2$" }
    hints:
      - "$T = \\tfrac12mv^2 + \\tfrac12I_G\\omega^2$"
      - "$I_G = \\tfrac12mr^2$ และ $\\omega = v/r$"
    solution: "$T = \\tfrac12mv^2 + \\tfrac12\\left(\\tfrac12mr^2\\right)\\dfrac{v^2}{r^2} = \\tfrac12mv^2 + \\tfrac14mv^2 = \\tfrac34mv^2$ หรือใช้ $\\tfrac12I_C\\omega^2$ รอบจุดสัมผัส $I_C = \\tfrac32mr^2$ ได้ผลเดียวกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.mechanics.rigid-body-dynamics.p016
    topics: [engineering.mechanics.rigid-body-dynamics]
