    choices:
      - { id: a, text: "ชี้เข้าหาศูนย์กลางโลก เหมือนน้ำหนักของนักเรียนไทย", correct: true }
      - { id: b, text: "ชี้ออกจากโลก เพราะเพื่อนอยู่กลับหัวเมื่อเทียบกับเรา", feedback: "ถ้าน้ำหนักชี้ออกจากโลก เพื่อนจะลอยหลุดออกไป แรงโน้มถ่วงดึงทุกคนเข้าหาศูนย์กลางโลก" }
      - { id: c, text: "ชี้ไปทางเดียวกับน้ำหนักของนักเรียนไทยในอวกาศพอดี", feedback: "\"ลง\" ของคนที่อยู่คนละฟากโลกเป็นทิศตรงข้ามกันในอวกาศ เพราะต่างคนต่างถูกดึงเข้าหาศูนย์กลางโลก" }
      - { id: d, text: "ไม่มีน้ำหนัก เพราะอยู่ด้านล่างของโลก", feedback: "โลกไม่มีด้านบนหรือด้านล่างจริง ทุกคนบนผิวโลกมีน้ำหนักเท่ากับ $mg$" }
    hints:
