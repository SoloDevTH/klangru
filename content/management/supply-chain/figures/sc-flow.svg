<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" font-family="sans-serif" font-size="13">
<title>โซ่อุปทานทุเรียนส่งออกจากจันทบุรีไปจีน (สมมติ) แสดงการไหลของสินค้า ข้อมูล และเงิน</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="940" height="400" fill="#ffffff"/>
<text x="470.0" y="26.0" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">โซ่อุปทานทุเรียนส่งออก จันทบุรี → จีน (ภาพรวม)</text>
<rect x="20.0" y="150.0" width="118.0" height="70.0" rx="8" fill="#f7f7f7" stroke="#1f5fa8" stroke-width="2"/>
<text x="79.0" y="180.0" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">สวนทุเรียน</text>
<text x="79.0" y="201.0" text-anchor="middle" font-size="12" fill="#222">จันทบุรี</text>
<rect x="150.3" y="150.0" width="118.0" height="70.0" rx="8" fill="#f7f7f7" stroke="#1f5fa8" stroke-width="2"/>
<text x="209.3" y="180.0" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">ล้ง (โรงคัดบรรจุ)</text>
<text x="209.3" y="201.0" text-anchor="middle" font-size="12" fill="#222">คัด ชั่ง บรรจุ ตรวจ</text>
<rect x="280.7" y="150.0" width="118.0" height="70.0" rx="8" fill="#f7f7f7" stroke="#1f5fa8" stroke-width="2"/>
<text x="339.7" y="180.0" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">ขนส่ง</text>
<text x="339.7" y="201.0" text-anchor="middle" font-size="12" fill="#222">ถนน ราง หรือเรือ</text>
<rect x="411.0" y="150.0" width="118.0" height="70.0" rx="8" fill="#f7f7f7" stroke="#1f5fa8" stroke-width="2"/>
<text x="470.0" y="180.0" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">ด่าน / ท่าเรือ</text>
<text x="470.0" y="201.0" text-anchor="middle" font-size="12" fill="#222">พิธีการศุลกากร</text>
<rect x="541.3" y="150.0" width="118.0" height="70.0" rx="8" fill="#f7f7f7" stroke="#1f5fa8" stroke-width="2"/>
<text x="600.3" y="180.0" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">ผู้นำเข้า</text>
<text x="600.3" y="201.0" text-anchor="middle" font-size="12" fill="#222">ในจีน</text>
<rect x="671.7" y="150.0" width="118.0" height="70.0" rx="8" fill="#f7f7f7" stroke="#1f5fa8" stroke-width="2"/>
<text x="730.7" y="180.0" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">ตลาดค้าส่ง</text>
<text x="730.7" y="201.0" text-anchor="middle" font-size="12" fill="#222">และร้านค้าปลีก</text>
<rect x="802.0" y="150.0" width="118.0" height="70.0" rx="8" fill="#f7f7f7" stroke="#1f5fa8" stroke-width="2"/>
<text x="861.0" y="180.0" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">ผู้บริโภค</text>
<line x1="139.0" y1="185.0" x2="148.3" y2="185.0" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="269.3" y1="185.0" x2="278.7" y2="185.0" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="399.7" y1="185.0" x2="409.0" y2="185.0" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="530.0" y1="185.0" x2="539.3" y2="185.0" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="660.3" y1="185.0" x2="669.7" y2="185.0" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="790.7" y1="185.0" x2="800.0" y2="185.0" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="470.0" y="135.0" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">สินค้าไหลไปข้างหน้า (ปลายน้ำ) →</text>
<line x1="861.0" y1="240.0" x2="79.0" y2="240.0" stroke="#1f5fa8" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#ah)"/>
<text x="470.0" y="262.0" text-anchor="middle" font-size="14" fill="#1f5fa8">← ข้อมูลไหลย้อนกลับ: คำสั่งซื้อ ยอดขาย สต็อก ผลตรวจคุณภาพ</text>
<line x1="861.0" y1="290.0" x2="79.0" y2="290.0" stroke="#b26a00" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#ah)"/>
<text x="470.0" y="312.0" text-anchor="middle" font-size="14" fill="#b26a00">← เงินไหลย้อนกลับ: ค่าสินค้า ค่าขนส่ง ค่าธรรมเนียม</text>
<text x="20.0" y="70.0" text-anchor="start" font-size="15" fill="#222" font-weight="bold">ต้นน้ำ</text>
<text x="920.0" y="70.0" text-anchor="end" font-size="15" fill="#222" font-weight="bold">ปลายน้ำ</text>
<line x1="80.0" y1="65.0" x2="860.0" y2="65.0" stroke="#888" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="470.0" y="360.0" text-anchor="middle" font-size="12" fill="#555">ข้อมูลในภาพเป็นโครงสร้างทั่วไป เส้นทางและผู้เกี่ยวข้องจริงต่างกันไปตามผู้ส่งออกแต่ละราย</text>
</svg>
