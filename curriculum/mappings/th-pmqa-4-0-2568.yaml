# หัวข้อในคลังที่สอนเนื้อหาของประเด็น PMQA 4.0 บางส่วน (คลังยังไม่มีหัวข้อที่สอนเกณฑ์ PMQA โดยตรง)
framework: th-pmqa-4-0-2568
mappings:
  - topic: management.quality.qc-tools
    indicators: ["4.1"]
    coverage: partial
    note: "เก็บข้อมูลด้วยใบตรวจสอบ วิเคราะห์ด้วยพาเรโตและแผนภูมิควบคุม พร้อมตัวอย่างโรงพยาบาลและไปรษณีย์ ยังไม่มีการกำหนดตัววัดระดับยุทธศาสตร์"
  - topic: management.operations.lean
    indicators: ["6.1", "6.2"]
    coverage: partial
    note: "ออกแบบและปรับปรุงกระบวนการตั้งแต่ต้นจนจบด้วยแนวคิดลีน ไคเซ็น และประสิทธิภาพรอบกระบวนการ (ตัวอย่างสำนักงานที่ดินและหน่วยราชการ) ยังไม่มีนวัตกรรมบริการดิจิทัลและการวัดผลกระทบต่อประเทศ"
  - topic: management.operations.maintenance-reliability
    indicators: ["6.3"]
    coverage: partial
    note: การเตรียมรับภาวะฉุกเฉินของหน่วยงานรัฐ (ระบบไฟสำรองศูนย์ข้อมูล) ยังไม่ได้สอนการมุ่งงานที่ส่งผลต่อยุทธศาสตร์ประเทศ
  - topic: management.quality.quality-planning
    indicators: ["3.1", "3.3"]
    coverage: partial
    note: รวบรวมความต้องการของผู้รับบริการและเห็นการเปลี่ยนแปลงตามเวลา (คาโน) แต่ไม่ได้สอนระบบข้อมูลสารสนเทศ
  - topic: management.quality.quality-planning
    indicators: ["3.2"]
    coverage: full
    note: ใช้ความพึงพอใจและข้อร้องเรียนปรับปรุงบริการ และออกแบบบริการเพิ่มสำหรับกลุ่มที่ใช้ไม่ได้ (p011 p015)
  - topic: management.quality.spc
    indicators: ["4.1"]
    coverage: partial
    note: ใช้แผนภูมิ I-MR ติดตามตัวชี้วัดรายเดือนของหน่วยงานรัฐ ยังไม่ได้สอนการเลือกตัววัดระดับยุทธศาสตร์
  - topic: management.hr.human-resource-management
    indicators: ["5.1"]
    coverage: partial
    note: บริหารกำลังคนตามความต้องการ (FTE) และค่าตอบแทน สภาพแวดล้อมการทำงานกล่าวสั้น ๆ
  - topic: management.hr.human-resource-management
    indicators: ["5.3"]
    coverage: full
    note: พัฒนาทักษะรวมทักษะดิจิทัล (p016) และวัดผลการพัฒนาสี่ระดับ
  - topic: management.operations.capacity-scheduling
    indicators: ["6.1", "7.6"]
    coverage: partial
    note: ออกแบบลำดับงานและติดตามกระบวนการบริการ (ห้องปฏิบัติการ ห้องเอกซเรย์ คิวผู้ป่วย) ยังไม่ได้สอนการออกแบบกระบวนการตั้งแต่ต้นจนจบ
  - topic: management.org.organizational-behavior
    indicators: ["5.2"]
    coverage: partial
    note: วัฒนธรรมการทำงานและความผูกพันของบุคลากร ตัวอย่างหน่วยงานรัฐ (p002 p016) ส่วนนวัตกรรมยังไม่ได้สอน
  - topic: management.public.public-administration
    indicators: ["1.1"]
    coverage: partial
    note: ประโยชน์สุขของประชาชนเป็นเป้าหมายของภาครัฐ ธรรมาภิบาล และการตอบสนองประชาชน ยังไม่ได้สอนการกำหนดทิศทางที่เชื่อมยุทธศาสตร์ชาติ (อยู่ใน strategic-management)
  - topic: management.public.public-administration
    indicators: ["1.2"]
    coverage: full
    note: ผลประโยชน์ทับซ้อน การประเมินความเสี่ยงการทุจริต มาตรการป้องกัน การเปิดเผยข้อมูล และ ITA (p012 p013 p015)
  - topic: management.public.public-policy
    indicators: ["1.3", "7.5"]
    coverage: full
    note: จัดการความกังวลของสาธารณะต่อโครงการและติดตามผลกระทบ (p014 p009)
  - topic: management.quality.excellence-self-assessment
    indicators: ["4.2", "4.3", "7.1", "7.2", "7.3", "7.4"]
    coverage: full
    note: ข้อมูลถูกต้อง ปลอดภัย ความมั่นคงไซเบอร์ (p018)
  - topic: management.quality.excellence-self-assessment
    indicators: ["6.2"]
    coverage: partial
    note: ตัดสินใจทำต่อ ปรับ หรือหยุดนวัตกรรมบริการ (p020) ไม่ได้สอนวิธีสร้างนวัตกรรม
  - topic: management.strategy.strategic-management
    indicators: ["2.1", "2.3"]
    coverage: full
    note: วิเคราะห์ความท้าทายและโอกาส กำหนดยุทธศาสตร์และเป้าหมาย (p005 p006 p016)
  - topic: management.strategy.strategic-management
    indicators: ["2.2"]
    coverage: partial
    note: แปลงยุทธศาสตร์เป็นแผน ตัวชี้วัด และทรัพยากร (p009 p010) ความเชื่อมโยงกับยุทธศาสตร์ชาติกล่าวโดยทั่วไป ไม่ลงรายละเอียดแผนระดับชาติ
