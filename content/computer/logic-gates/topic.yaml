id: computer.systems.logic-gates
subject: computer
title: { th: ตรรกะบูลีนและเกตตรรกะ, en: Boolean logic and logic gates }
summary: สัญญาณดิจิทัลกับแอนะล็อก ค่าความจริง เกต AND OR NOT XOR ตารางค่าความจริง การต่อเกตเป็นวงจร วงจรบวกบิต และเครื่องสถานะจำกัดเบื้องต้น
difficulty: 3.5
minutes: 40
prerequisites: [computer.data.binary]
encompasses:
  - { id: computer.data.binary, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: gate-symbols.svg
    alt: "สัญลักษณ์เกตสี่แบบพร้อมตารางค่าความจริง AND ด้านหลังตรงด้านหน้าโค้ง เอาต์พุต 0 0 0 1 สำหรับอินพุต 00 01 10 11 OR ด้านหลังเว้าด้านหน้าแหลม เอาต์พุต 0 1 1 1 XOR เหมือน OR แต่มีเส้นโค้งเพิ่มด้านหลัง เอาต์พุต 0 1 1 0 NOT เป็นสามเหลี่ยมมีวงกลมเล็กที่ปลาย อินพุต 0 ได้ 1 อินพุต 1 ได้ 0"
    caption: "เกตพื้นฐานสี่แบบ แถวของตารางเรียงเหมือนนับเลขฐานสอง 00, 01, 10, 11"
  - type: figure
    src: switch-circuits.svg
    alt: "วงจรสองวงจร ซ้ายมือคือแบตเตอรี่ สวิตช์ A และ B ต่ออนุกรมเรียงกันบนเส้นเดียว และหลอดไฟ ไฟติดเมื่อเปิดสวิตช์ A และ B ทั้งคู่ ขวามือคือสวิตช์ A และ B ต่อขนานกันเป็นสองทางแยก ไฟติดเมื่อเปิดสวิตช์ A หรือ B อย่างน้อยหนึ่งตัว"
    caption: "สวิตช์อนุกรมทำงานแบบ AND สวิตช์ขนานทำงานแบบ OR ในชิปจริงสวิตช์คือทรานซิสเตอร์"
  - { type: check, problem: computer.systems.logic-gates.p004, prompt: "ระวังความต่างระหว่าง OR กับ XOR" }
  - type: worked-example
    title: หาเอาต์พุตของวงจรสัญญาณกันขโมย
    problem: "สัญญาณกันขโมย $Q = (D + W) \\cdot S$ เมื่อ $D$ = ประตูเปิด $W$ = หน้าต่างเปิด $S$ = เปิดระบบไว้ (1 = ใช่) ถ้าประตูปิด หน้าต่างเปิด และเปิดระบบไว้ สัญญาณดังหรือไม่"
    steps:
      - text: "แทนค่า: $D = 0$, $W = 1$, $S = 1$"
      - text: "เกต OR ชั้นแรก: $D + W = 0 + 1 = 1$"
        why: "OR เป็น 1 เมื่ออินพุตอย่างน้อยหนึ่งตัวเป็น 1"
      - text: "เกต AND ชั้นที่สอง: $1 \\cdot S = 1 \\cdot 1 = 1$"
        why: "นำเอาต์พุตของเกตชั้นแรกมาเป็นอินพุตของเกตถัดไป AND เป็น 1 เมื่อทั้งสองอินพุตเป็น 1"
      - text: "$Q = 1$ สัญญาณดัง ถ้าปิดระบบ ($S = 0$) ผลของ AND จะเป็น 0 ไม่ว่าประตูหรือหน้าต่างจะเปิด"
    answer: "$Q = 1$ สัญญาณดัง"
  - type: figure
    src: half-adder.svg
    alt: "วงจรบวกครึ่ง อินพุต A และ B แยกสายไปเข้าเกตสองตัว เกต XOR ด้านบนให้เอาต์พุต S คือผลบวก เกต AND ด้านล่างให้เอาต์พุต C คือตัวทด"
    caption: "XOR ให้หลักผลบวก AND ให้ตัวทด: 1 + 1 ได้ S = 0 ทด C = 1 คือ $10_2$"
  - type: worked-example
    title: ไล่เครื่องสถานะของประตูหมุน
    problem: "ประตูหมุนเริ่มที่สถานะ ล็อก มีเหตุการณ์ตามลำดับ: หยอดเหรียญ, ดัน, หยอดเหรียญ, ดัน, ดัน มีคนเดินผ่านกี่คน และสุดท้ายประตูอยู่สถานะใด"
    figure:
      src: turnstile-fsm.svg
      alt: "แผนภาพเครื่องสถานะจำกัด วงกลมสองวง ล็อก และ ปลดล็อก ลูกศรเริ่มชี้เข้าวง ล็อก จาก ล็อก ไป ปลดล็อก เมื่อหยอดเหรียญ จาก ปลดล็อก กลับ ล็อก เมื่อดันและคนเดินผ่าน 1 คน ล็อก มีลูกศรวนกลับตัวเองเมื่อดัน ปลดล็อก มีลูกศรวนกลับตัวเองเมื่อหยอดเหรียญ"
    steps:
      - text: "ล็อก + หยอดเหรียญ → ปลดล็อก"
      - text: "ปลดล็อก + ดัน → คนผ่านคนที่ 1 กลับเป็นล็อก"
      - text: "ล็อก + หยอดเหรียญ → ปลดล็อก"
      - text: "ปลดล็อก + ดัน → คนผ่านคนที่ 2 กลับเป็นล็อก"
      - text: "ล็อก + ดัน → ยังล็อก ไม่มีใครผ่าน"
        why: "อินพุต ดัน เหมือนกัน แต่ผลต่างกันเพราะสถานะตอนนั้นต่างกัน นี่คือเหตุที่ต้องจำสถานะ"
    answer: "มีคนผ่าน 2 คน สุดท้ายอยู่สถานะ ล็อก"
  - { type: check, problem: computer.systems.logic-gates.p007, prompt: "ไล่จากเกตชั้นแรกไปเกตสุดท้าย" }
  - type: figure
    src: analog-digital.svg
    alt: "กราฟสองกราฟ ซ้ายคือสัญญาณแอนะล็อกเป็นเส้นโค้งขึ้นลงต่อเนื่องตามเวลา ขวาคือสัญญาณดิจิทัลเป็นเส้นขั้นบันไดที่มีแค่สองระดับ 0 และ 1 ลำดับบิต 0 1 1 0 1 0 0 1"
    caption: "สัญญาณดิจิทัลมีแค่สองระดับ จึงแยกได้ชัดแม้มีสัญญาณรบกวน"
glossary:
  - { term: เกตตรรกะ (logic gate), definition: "วงจรที่รับบิตเข้าแล้วให้บิตออกตามกฎตรรกะ เช่น AND OR NOT XOR" }
  - { term: ตารางค่าความจริง (truth table), definition: "ตารางแสดงเอาต์พุตของทุกกรณีของอินพุต อินพุต n ตัวมี $2^n$ แถว" }
  - { term: พีชคณิตบูลีน (Boolean algebra), definition: "การคำนวณกับค่าความจริง 0 และ 1 ด้วยตัวดำเนินการ AND OR NOT" }
  - { term: วงจรบวกครึ่ง (half adder), definition: "วงจรบวกบิตหนึ่งหลัก ผลบวกได้จาก XOR ตัวทดได้จาก AND" }
  - { term: สถานะ (state), definition: "ข้อมูลที่ระบบจำไว้จากเหตุการณ์ก่อนหน้า ซึ่งมีผลต่อการตอบสนองต่ออินพุตถัดไป" }
  - { term: เครื่องสถานะจำกัด (finite-state machine), definition: "แบบจำลองระบบที่มีสถานะจำนวนจำกัด และย้ายสถานะตามอินพุต" }
flashcards:
  - { front: "AND, OR, XOR ให้ 1 เมื่อใด", back: "AND: ทุกอินพุตเป็น 1 / OR: อย่างน้อยหนึ่งเป็น 1 / XOR: อินพุตต่างกัน" }
  - { front: "ในพีชคณิตบูลีน $1 + 1$ เท่ากับเท่าใด", back: "1 เพราะ $+$ คือ OR" }
  - { front: "อินพุต 3 ตัว ตารางค่าความจริงมีกี่แถว", back: "$2^3 = 8$ แถว" }
  - { front: "วงจรบวกครึ่งใช้เกตอะไร", back: "XOR ให้ผลบวก S และ AND ให้ตัวทด C" }
  - { front: "สวิตช์ต่ออนุกรมและต่อขนานเหมือนเกตอะไร", back: "อนุกรม = AND, ขนาน = OR" }
