  difficulty: 4
  type: numeric
  stem: ดูป้ายราคาในภาพ ซื้อ 一件T恤 กับ 一盒牛奶 แล้วจ่ายธนบัตร 50 หยวน จะได้เงินทอน (找钱 zhǎoqián) กี่หยวน
  figure: *id001
  answer:
    value: 11.2
    unit: หยวน
    tolerance: 0.01
  misconceptions:
  - match: 15
    feedback: อย่าลืมราคานม 3.80 หยวน
  - match: 46.2
    feedback: อย่าลืมราคาเสื้อยืด 35 หยวน
  - match: 38.8
    feedback: 38.80 คือราคารวม ต้องนำไปลบออกจาก 50
  hints:
