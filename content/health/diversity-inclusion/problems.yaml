problems:
- id: health.community.diversity-inclusion.p001
  topics:
  - health.community.diversity-inclusion
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็นตัวอย่างของความหลากหลายในชุมชนได้ครอบคลุมที่สุด
  choices:
  - id: a
    text: ทุกคนในชุมชนต้องนับถือศาสนาเดียวกัน
    feedback: ความหลากหลายไม่ได้หมายถึงการที่ทุกคนต้องเหมือนกัน
  - id: b
    text: มีคนที่ต่างกันทั้งศาสนา ภาษา ความพิการ รูปแบบครอบครัว และฐานะ
    correct: true
  - id: c
    text: ทุกคนพูดภาษาเดียวกันและทำกิจกรรมเหมือนกัน
    feedback: ความเหมือนกันทุกด้านไม่ใช่ความหลากหลาย
  - id: d
    text: ความหลากหลายไม่มีผลต่อสุขภาวะของคนในชุมชน
    feedback: เมื่อคนรู้สึกเป็นส่วนหนึ่งหรือถูกกีดกัน สุขภาวะได้รับผลต่างกัน
  hints:
  - ความหลากหลายหมายถึงความต่างของคนในชุมชน ไม่ใช่เรื่องที่ทุกคนเหมือนกัน
  - ลองดูข้อที่บอกความต่างหลายด้านพร้อมกัน
  solution: ความหลากหลายในชุมชนรวมถึงศาสนา ภาษา ความพิการ รูปแบบครอบครัว และฐานะ ซึ่งแตกต่างกันได้ในคนเดียวกันหลายด้าน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.community.diversity-inclusion.p002
  topics:
  - health.community.diversity-inclusion
  difficulty: 1
  type: match
  stem: จับคู่คำศัพท์กับความหมาย
  pairs:
  - left: ภาพเหมารวม
    right: ความเชื่อกว้าง ๆ ที่ยังไม่ได้ตรวจสอบเกี่ยวกับคนกลุ่มหนึ่ง
  - left: อคติ
    right: ความรู้สึกหรือทัศนคติทางลบต่อกลุ่มคน
  - left: การเลือกปฏิบัติ
    right: การปฏิบัติต่อคนอย่างไม่เป็นธรรมเพราะความแตกต่าง
  - left: upstander
    right: คนที่ยืนข้างผู้ถูกกระทำและช่วยหยุดเหตุการณ์
  hints:
  - ภาพเหมารวมคือความเชื่อกว้าง ๆ เกี่ยวกับคนกลุ่มหนึ่งที่ยังไม่ได้ตรวจสอบ
  - upstander คือคนที่ลงมือช่วยผู้ถูกกระทำ
  solution: ภาพเหมารวม = ความเชื่อกว้าง ๆ ที่ยังไม่ได้ตรวจสอบ, อคติ = ความรู้สึกหรือทัศนคติทางลบต่อกลุ่ม, การเลือกปฏิบัติ = การปฏิบัติต่อคนอย่างไม่เป็นธรรมเพราะความแตกต่าง, upstander = คนที่ยืนข้างผู้ถูกกระทำและช่วยหยุดเหตุการณ์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.community.diversity-inclusion.p003
  topics:
  - health.community.diversity-inclusion
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็นตัวอย่างของภาพเหมารวม
  choices:
  - id: a
    text: คนที่ใช้รถเข็นคงทำอะไรเองไม่ได้เลย
    correct: true
  - id: b
    text: เพื่อนคนนี้ช่วยงานห้องสมุดทุกวันพุธ
    feedback: เป็นข้อเท็จจริงเกี่ยวกับคนหนึ่งคน ไม่ใช่การสรุปทั้งกลุ่ม
  - id: c
    text: ครอบครัวนี้ทำอาหารร่วมกันทุกสุดสัปดาห์
    feedback: เป็นข้อเท็จจริงเกี่ยวกับครอบครัวหนึ่ง ไม่ใช่ภาพเหมารวม
  - id: d
    text: กลุ่มเราช่วยกันออกแบบโปสเตอร์
    feedback: เป็นการเล่าเหตุการณ์หนึ่ง ไม่ได้สรุปทั้งกลุ่ม
  hints:
  - ภาพเหมารวมคือการสรุปว่าทุกคนในกลุ่มหนึ่งเป็นแบบเดียวกันโดยไม่ได้รู้จักจริง
  - ลองดูว่าข้อไหนสรุปทั้งกลุ่มโดยไม่มีหลักฐานจากคนจริง
  solution: การบอกว่าคนที่ใช้รถเข็นทำอะไรเองไม่ได้เลยเป็นการสรุปทั้งกลุ่ม ซึ่งไม่ตรงกับความจริงของแต่ละคน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.community.diversity-inclusion.p004
  topics:
  - health.community.diversity-inclusion
  difficulty: 2
  type: numeric
  stem: ในห้องเรียน 40 คน มี 6 คนที่ใช้ภาษาต่างจากภาษาที่ใช้ในโรงเรียน คิดเป็นร้อยละเท่าไรของห้อง (ตอบเป็นร้อยละ)
  answer:
    value: 15.0
    tolerance: 0
    unit: '%'
  misconceptions:
  - match: 6
    feedback: นั่นคือจำนวนคน ยังไม่ได้เทียบกับทั้งห้องเป็นร้อยละ
  hints:
  - ร้อยละคือจำนวนที่ต้องการหารด้วยจำนวนทั้งหมด แล้วคูณ 100
  - ตัวเลขนี้เป็นตัวอย่างสมมติ
  solution: 6 ÷ 40 × 100 = 15%
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.community.diversity-inclusion.p005
  topics:
  - health.community.diversity-inclusion
  difficulty: 2
  type: text
  stem: การยืนข้างผู้ถูกกระทำและช่วยหยุดเหตุการณ์ เรียกเป็นภาษาอังกฤษว่าอะไร (ตอบเป็นคำ)
  accepted:
  - upstander
  - Upstander
  hints:
  - คำนี้มาจาก stand up คือลุกขึ้นทำอะไรบางอย่าง
  - ตรงข้ามกับคนที่เห็นแล้วเดินผ่านไป
  solution: เรียกว่า upstander คือคนที่ลงมือช่วยเมื่อเห็นการกระทำไม่เป็นธรรม ต่างจาก bystander ซึ่งเห็นแล้วนิ่งเฉย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.community.diversity-inclusion.p006
  topics:
  - health.community.diversity-inclusion
  difficulty: 2
  type: mcq
  stem: ข้อใดเป็นการเลือกปฏิบัติ (เลือกได้หลายข้อ)
  multiple: true
  choices:
  - id: a
    text: ไม่รับเด็กเข้ากลุ่มเพราะพูดสำเนียงต่างจากคนอื่น
    correct: true
  - id: b
    text: ให้คนพิการนั่งเฉพาะด้านหลังห้องโดยไม่ถามความต้องการ
    correct: true
  - id: c
    text: ให้ทุกคนเลือกกิจกรรมตามความสนใจ
    feedback: เป็นการเปิดโอกาสให้ทุกคน จึงไม่ใช่การเลือกปฏิบัติ
  - id: d
    text: จัดกิจกรรมให้เข้าถึงได้ด้วยทางลาด
    feedback: เป็นการออกแบบที่ทำให้ทุกคนเข้าร่วมได้ จึงไม่ใช่การเลือกปฏิบัติ
  hints:
  - การเลือกปฏิบัติคือการปฏิบัติต่อคนต่างกันอย่างไม่เป็นธรรม เพราะความแตกต่าง
  - ลองดูว่าข้อไหนกีดกันคนบางกลุ่มโดยไม่มีเหตุผลที่ยุติธรรม
  solution: การไม่รับเด็กเข้ากลุ่มเพราะสำเนียงพูด และการจัดให้คนพิการนั่งหลังห้องโดยไม่ถามความต้องการ เป็นการปฏิบัติต่างกันอย่างไม่เป็นธรรม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.community.diversity-inclusion.p007
  topics:
  - health.community.diversity-inclusion
  difficulty: 2
  type: order
  stem: เรียงขั้นตอนเมื่อเห็นเพื่อนถูกล้อเพราะรูปลักษณ์ (จากขั้นแรกไปขั้นสุดท้าย)
  items:
  - สังเกตและยอมรับว่าเหตุการณ์นี้ไม่ควรเกิด
  - ยืนข้างเพื่อนและพูดหยุดอย่างปลอดภัย
  - ชวนเพื่อนออกจากสถานการณ์นั้น
  - แจ้งผู้ใหญ่ที่ไว้ใจ และบันทึกเหตุการณ์ไว้ถ้าจำเป็น
  hints:
  - เริ่มจากการสังเกตและยอมรับว่าเหตุการณ์นี้ไม่ควรเกิด
  - ขั้นสุดท้ายคือแจ้งผู้ใหญ่ที่ไว้ใจ
  solution: สังเกตและยอมรับว่าไม่ควรเกิด ยืนข้างเพื่อนและพูดหยุดอย่างปลอดภัย ชวนเพื่อนออกจากสถานการณ์ แล้วแจ้งผู้ใหญ่ที่ไว้ใจ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.community.diversity-inclusion.p008
  topics:
  - health.community.diversity-inclusion
  difficulty: 3
  type: mcq
  stem: ป้ายประกาศในหมู่บ้านควรทำอย่างไรให้ทุกคนเข้าใจได้
  choices:
  - id: a
    text: ใช้ภาษาที่คนในชุมชนใช้ มีภาพประกอบ และตัวอักษรขนาดอ่านง่าย
    correct: true
  - id: b
    text: เขียนภาษาเดียวตามที่เจ้าหน้าที่สะดวก
    feedback: คนที่อ่านภาษานั้นไม่ได้จะไม่เข้าใจข้อมูล
  - id: c
    text: เขียนตัวอักษรเล็กที่สุดเพื่อความสวยงาม
    feedback: ตัวอักษรเล็กทำให้หลายคนอ่านไม่ได้
  - id: d
    text: ใช้ศัพท์เฉพาะทางโดยไม่อธิบาย
    feedback: คนทั่วไปอาจเข้าใจไม่ได้
  hints:
  - ลองนึกว่าใครบ้างในชุมชนที่ต้องอ่านป้ายนี้
  - การใช้ภาษาเดียวหรือตัวอักษรเล็กจะทำให้บางคนเข้าถึงข้อมูลไม่ได้
  solution: ใช้ภาษาที่คนในชุมชนใช้ ใช้ภาพประกอบ และตัวอักษรขนาดอ่านง่าย จะช่วยให้ข้อมูลเข้าถึงคนหลายกลุ่มได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.community.diversity-inclusion.p009
  topics:
  - health.community.diversity-inclusion
  difficulty: 3
  type: numeric
  stem: กิจกรรมเดิมมีผู้เข้าร่วม 25 คน ในนั้น 5 คนมาจากกลุ่มที่เคยเข้าร่วมน้อย ปีถัดมามีผู้เข้าร่วม 48 คน และ 12 คนมาจากกลุ่มนั้น (ข้อมูลสมมติ) สัดส่วนของกลุ่มนี้เปลี่ยนไปกี่จุดร้อยละ (ตอบเป็นจุดร้อยละ)
  answer:
    value: 5
    tolerance: 0.05
    unit: จุดร้อยละ
  misconceptions:
  - match: 7
    feedback: นั่นคือจำนวนคนที่เพิ่มขึ้น (12 − 5) ยังไม่ได้เทียบเป็นสัดส่วนของกิจกรรม
  - match: 25
    feedback: นั่นคือการเพิ่มขึ้นเทียบกับค่าเดิม ((25 − 20) ÷ 20 × 100) เป็นเปอร์เซ็นต์ ไม่ใช่จุดร้อยละ
  hints:
  - หาสัดส่วนของกลุ่มนี้ในแต่ละปีก่อน แล้วค่อยเทียบกัน
  - จำนวนคนที่เพิ่มขึ้นไม่เท่ากับสัดส่วนที่เปลี่ยน
  solution: ปีแรก 5 ÷ 25 × 100 = 20% ปีถัดมา 12 ÷ 48 × 100 = 25% สัดส่วนเพิ่มขึ้น 25 − 20 = 5 จุดร้อยละ ซึ่งน้อยกว่าที่จำนวนคน (5 เป็น 12) ทำให้ดูเหมือน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.community.diversity-inclusion.p010
  topics:
  - health.community.diversity-inclusion
  difficulty: 3
  type: mcq
  stem: จากภาพ ทางเข้าใดเหมาะกับผู้ใช้รถเข็นมากที่สุด
  choices:
  - id: a
    text: ทางเข้า A ที่มีบันได
    feedback: บันไดทำให้ผู้ใช้รถเข็นเข้าไม่ได้
  - id: b
    text: ทางเข้า B ที่มีทางลาด
    correct: true
  - id: c
    text: ทั้งสองทางเหมาะเท่ากัน
    feedback: ทางเข้า A มีบันไดซึ่งทำให้ผู้ใช้รถเข็นเข้าไม่ได้
  - id: d
    text: ไม่มีทางเข้าใดเหมาะเลย
    feedback: ทางเข้า B มีทางลาดที่ผู้ใช้รถเข็นใช้ได้
  hints:
  - ดูว่าทางเข้าไหนไม่มีขั้นบันได
  - ลองนึกว่าผู้ใช้รถเข็นขึ้นทางต่างระดับได้หรือไม่
  solution: ทางเข้า B มีทางลาดแทนบันได ผู้ใช้รถเข็น ผู้สูงอายุ และคนที่เข็นรถเข็นเด็กหรือของหนักเข้าได้โดยไม่ต้องขึ้นบันได
  figure:
    src: inclusive-access.svg
    alt: ภาพอาคารชุมชนมีทางเข้าสองทาง มีป้ายกำกับ A และ B ทางเข้า A มีบันไดสามขั้นขึ้นไปที่ประตู ทางเข้า B มีทางลาดลาดเอียงขึ้นไปที่ประตู
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.community.diversity-inclusion.p011
  topics:
  - health.community.diversity-inclusion
  difficulty: 3
  type: mcq
  stem: ผู้ใหญ่ในชุมชนจัดกิจกรรม แต่ไม่มีใครในกลุ่มที่ต้องการทางลาดได้เข้าร่วม ทั้งที่ไม่ได้ตั้งใจกีดกันใคร ปัญหานี้เกิดจากอะไร
  choices:
  - id: a
    text: การออกแบบกิจกรรมที่ไม่คำนึงถึงทุกคนทำให้บางกลุ่มเข้าไม่ได้
    correct: true
  - id: b
    text: ความพร้อมของผู้เข้าร่วมที่ไม่เพียงพอ
    feedback: ปัญหาอยู่ที่การออกแบบกิจกรรม ไม่ใช่ที่ตัวผู้เข้าร่วม
  - id: c
    text: ความบังเอิญที่ไม่มีใครควบคุมได้
    feedback: การออกแบบที่ไม่ทั่วถึงเป็นสิ่งที่ควบคุมและแก้ได้
  - id: d
    text: ความชอบส่วนตัวของผู้จัดงาน
    feedback: ปัญหาอยู่ที่การไม่คิดถึงความต้องการของทุกคน
  hints:
  - ลองนึกว่าการจัดกิจกรรมคำนึงถึงทุกคนหรือไม่
  - การไม่ตั้งใจก็ยังทำให้บางคนเข้าไม่ได้ได้
  solution: การออกแบบกิจกรรมที่ไม่คำนึงถึงทุกคนทำให้บางกลุ่มเข้าร่วมไม่ได้ แม้จะไม่ได้ตั้งใจ จึงควรถามและออกแบบให้ทั่วถึงตั้งแต่ต้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.community.diversity-inclusion.p012
  topics:
  - health.community.diversity-inclusion
  difficulty: 4
  type: mcq
  stem: ทำไมภาพเหมารวมจึงมีผลต่อการเลือกของเรา เช่น การเลือกกีฬาหรือเพื่อน
  choices:
  - id: a
    text: เพราะเราอาจตัดสินใจโดยไม่ได้ตรวจสอบความจริงจากประสบการณ์ของตัวเอง
    correct: true
  - id: b
    text: เพราะภาพเหมารวมทำให้เราตัดสินถูกเสมอ
