    solution: "CC BY อนุญาตให้ใช้แม้เพื่อการค้า เมื่อให้เครดิตผู้สร้างและบอกสัญญาอนุญาต ส่วน CC BY-NC ห้ามใช้เพื่อการค้า ภาพทั่วไปจากการค้นหาและภาพที่ตัดลายน้ำใช้ไม่ได้ ทางที่ปลอดภัยที่สุดคือถ่ายภาพเอง"
