  # ---------- สังคม จริยธรรม และอาชีพ ----------
  # ลำดับ 2
  - { id: computer.society.computing-ethics, title: การวิเคราะห์เชิงจริยธรรมและจรรยาบรรณวิชาชีพคอมพิวเตอร์, difficulty: 5.5, prereq: [computer.society.responsible-ict, computer.society.computing-impacts, computer.ai.intro], indicators: ["acm-cs2023:SEP-Ethical-Analysis", "acm-cs2023:SEP-Professional-Ethics", "acm-cs2023:SEP-Context", "acm-cs2023:AL-SEP", "acm-cs2023:HCI-Accountability", "csta-k12-cs-2026:MS-ALG-IM-11", "csta-k12-cs-2026:HS-ALG-IM-11", "csta-k12-cs-2026:MS-SOC-HU-43", "csta-k12-cs-2026:HS-SOC-HU-43", "csta-k12-cs-2026:MS-SOC-ET-41", "csta-k12-cs-2026:MS-SOC-ET-42", "csta-k12-cs-2026:HS-SOC-ET-41", "csta-k12-cs-2026:HS-SOC-ET-42", "csta-k12-cs-2026:HS-SOC-HI-39"], scope: "กรอบวิเคราะห์จริยธรรม (ผลลัพธ์นิยม หน้าที่นิยม คุณธรรม สัญญาประชาคม) และการวิเคราะห์ผู้มีส่วนได้เสีย จรรยาบรรณของ ACM และ IEEE ความรับผิดชอบของผู้ออกแบบต่อผลของระบบ ค่านิยมที่แฝงในระบบอัลกอริทึม (ประสิทธิภาพกับความเป็นธรรม) ปรับอัลกอริทึมเพื่อลดอคติหรือผลกระทบทางสังคม ผลของทีมพัฒนาที่ไม่หลากหลาย การตัดสินใจของผู้ใช้ ผู้ออกแบบ และผู้กำกับดูแลที่มีผลระยะยาว การออกแบบเทคโนโลยีใหม่ทำให้ชุมชนต่างกันได้รับประสบการณ์ต่างกันและเกิดความไม่เท่าเทียม ถกผลของเทคโนโลยีใหม่ต่อชุมชนท้องถิ่น ออกแบบทางแก้ปัญหาจริงด้วยเทคโนโลยีใหม่ระดับแนวคิดพร้อมชั่งผลดีผลเสีย และเสนอแก้นโยบายหรือกฎหมายให้ส่งเสริมนวัตกรรมอย่างมีจริยธรรม ผ่านกรณีศึกษา" }
