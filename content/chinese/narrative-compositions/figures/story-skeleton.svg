<line x1="788" y1="205.0" x2="810" y2="205.0" stroke="#555" stroke-width="3" stroke-linecap="round"/>
<rect x="814" y="90" width="168" height="230" rx="12" fill="#fff" stroke="#5b3e96" stroke-width="3"/>
