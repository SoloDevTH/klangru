  - ทดสอบตามข้อจำกัดและเกณฑ์ทีละข้อ
  - บันทึกผลทดสอบ รวมทั้งที่ไม่ผ่าน
  - ถามว่าทำไมจนพบเหตุของข้อบกพร่อง
  - ปรับปรุงแบบให้ตรงกับเหตุ
  - ทดสอบซ้ำด้วยวิธีเดิมแล้วเทียบผล
  hints:
  - ต้องมีของก่อนจึงทดสอบได้
  - หาเหตุก่อนแก้ และทดสอบซ้ำเป็นขั้นสุดท้าย
  solution: สร้าง → ทดสอบ → บันทึก → หาเหตุ → ปรับปรุง → ทดสอบซ้ำด้วยวิธีเดิม
