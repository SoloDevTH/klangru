id: computer.data.digital-data-basics
subject: computer
title: { th: การสร้าง จัดเก็บ และนำเสนอข้อมูลด้วยเทคโนโลยี, en: "Creating, storing and presenting data with technology" }
summary: เลือกซอฟต์แวร์ให้เหมาะกับงาน สร้าง ตั้งชื่อ คัดลอก ค้นหา และลบไฟล์ จัดโฟลเดอร์ รวบรวมข้อมูลแล้วนำเสนอเป็นแผนภูมิ และอ่านแบบรูปเพื่อคาดการณ์
difficulty: 1.5
minutes: 30
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - type: figure
    src: folder-tree.svg
    alt: "ผังโฟลเดอร์แบบต้นไม้ บนสุดคือโฟลเดอร์ เอกสาร ข้างในมีโฟลเดอร์ งานโรงเรียน ป.3 ซึ่งแยกเป็นโฟลเดอร์ย่อยสามโฟลเดอร์ ภาษาไทยมีไฟล์ เรียงความ-วันแม่.docx วิทยาศาสตร์มีไฟล์ รายงาน-ต้นถั่วงอก.docx และ ภาพ-ต้นถั่วงอก-สัปดาห์1.jpg คณิตศาสตร์มีไฟล์ คะแนนสอบย่อย.xlsx"
    caption: "โฟลเดอร์ซ้อนกันได้ แยกไฟล์ตามวิชาทำให้หาง่าย ชื่อไฟล์บอกว่าข้างในคืออะไร"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: same-data-charts.svg
    alt: "ข้อมูลผลไม้ที่ชอบของนักเรียนชุดเดียวกันแสดงสามแบบ แบบที่ 1 ตารางรอยขีด มะม่วง 8 กล้วย 5 ส้ม 6 แตงโม 3 แบบที่ 2 แผนภูมิรูปภาพ วงกลม 1 วงแทนนักเรียน 1 คน มะม่วง 8 วง กล้วย 5 วง ส้ม 6 วง แตงโม 3 วง แบบที่ 3 แผนภูมิแท่ง แกนตั้งคือจำนวนคน 0 ถึง 8 แท่งมะม่วงสูงที่สุด แตงโมต่ำที่สุด"
    caption: "ตัวเลขเท่ากันทั้งสามแบบ แต่แผนภูมิทำให้เปรียบเทียบได้เร็วกว่า"
  - { type: check, problem: computer.data.digital-data-basics.p004, prompt: "ก่อนดูตัวอย่าง ลองเลือกชื่อไฟล์ที่ดีที่สุด" }
  - type: worked-example
    title: จากรอยขีดเป็นแผนภูมิแท่ง แล้วสรุปผล
    problem: "ห้อง ป.2 สำรวจผลไม้ที่ชอบ ได้รอยขีด มะม่วง 8 กล้วย 5 ส้ม 6 แตงโม 3 จะนำเสนอเป็นแผนภูมิแท่งอย่างไร และโรงอาหารควรเพิ่มผลไม้ชนิดใด"
    steps:
      - text: "นับรอยขีดเป็นตัวเลข: มะม่วง 8, กล้วย 5, ส้ม 6, แตงโม 3 รวม 22 คน"
        why: "รวมทุกกลุ่มเพื่อตรวจว่าเท่ากับจำนวนนักเรียนที่ตอบจริง ถ้าไม่เท่าแสดงว่านับผิดหรือมีคนตอบซ้ำ"
      - text: "ในโปรแกรมตารางคำนวณ พิมพ์ชื่อผลไม้ในคอลัมน์หนึ่ง และจำนวนคนในอีกคอลัมน์หนึ่ง"
      - text: "เลือกตารางแล้วสั่งสร้างแผนภูมิแท่ง ตั้งชื่อแผนภูมิและชื่อแกนตั้งว่า จำนวนคน"
        why: "แผนภูมิแท่งเหมาะกับการเปรียบเทียบหลายกลุ่ม และชื่อแกนบอกผู้อ่านว่าความสูงของแท่งหมายถึงอะไร"
      - text: "อ่านแผนภูมิ: แท่งมะม่วงสูงที่สุด (8 คน) แท่งแตงโมต่ำที่สุด (3 คน)"
    answer: "แผนภูมิแท่งแสดงว่ามะม่วงเป็นที่ชอบมากที่สุด โรงอาหารจึงควรเพิ่มมะม่วง"
  - type: worked-example
    title: ใช้แบบรูปคาดการณ์เงินออม
    problem: "ต้นออมเงินใส่กระปุก ยอดเงินรวมเมื่อจบสัปดาห์ที่ 1 ถึง 4 คือ 15, 30, 45 และ 60 บาท ถ้าออมแบบเดิมต่อไป จบสัปดาห์ที่ 6 จะมีเงินเท่าใด และจะมีครบ 120 บาทเมื่อจบสัปดาห์ใด"
    steps:
      - text: "หาผลต่างของสัปดาห์ที่ติดกัน: 30 − 15 = 15, 45 − 30 = 15, 60 − 45 = 15"
        why: "ผลต่างเท่ากันทุกครั้ง แปลว่ายอดเงินเพิ่มขึ้นคงที่สัปดาห์ละ 15 บาท นี่คือแบบรูปของข้อมูล"
      - text: "ต่อแบบรูป: สัปดาห์ที่ 5 มี 60 + 15 = 75 บาท สัปดาห์ที่ 6 มี 75 + 15 = 90 บาท"
      - text: "ต่อไปอีก: สัปดาห์ที่ 7 มี 105 บาท สัปดาห์ที่ 8 มี 120 บาท"
        why: "ยอดเงินจบสัปดาห์ที่ n คือ 15 × n จึงได้ 120 เมื่อ n = 8"
    answer: "จบสัปดาห์ที่ 6 มี 90 บาท และจะครบ 120 บาทเมื่อจบสัปดาห์ที่ 8 (ถ้ายังออมเท่าเดิม)"
  - { type: check, problem: computer.data.digital-data-basics.p009, prompt: "ข้อมูลแบบนี้ควรใช้แผนภูมิแบบใด" }
glossary:
  - { term: ข้อมูล (data), definition: "ข้อเท็จจริงที่เก็บจากการนับ วัด หรือถาม อยู่ในรูปตัวเลข ข้อความ ภาพ สัญลักษณ์ หรือเสียง" }
  - { term: สารสนเทศ (information), definition: "ข้อมูลที่จัดระเบียบ ประมวลผล และสรุปแล้วจนนำไปใช้ตัดสินใจได้" }
  - { term: ไฟล์ (file), definition: "ชุดข้อมูลที่บันทึกไว้ในอุปกรณ์ด้วยชื่อหนึ่งชื่อ เช่น เอกสาร ภาพ หรือเพลง" }
  - { term: โฟลเดอร์ (folder), definition: "ที่เก็บไฟล์แบบแฟ้ม ใช้จัดไฟล์เป็นหมวดหมู่ และซ้อนกันได้หลายชั้น" }
  - { term: นามสกุลไฟล์, definition: "ส่วนท้ายชื่อไฟล์หลังจุด เช่น .docx .jpg .mp3 บอกชนิดของไฟล์" }
  - { term: แบบรูป (pattern), definition: "ลักษณะที่เกิดซ้ำหรือเปลี่ยนแปลงอย่างสม่ำเสมอในข้อมูล ใช้คาดการณ์ค่าถัดไป" }
flashcards:
  - { front: "คัดลอกไฟล์ต่างจากย้ายไฟล์อย่างไร", back: "คัดลอกแล้วไฟล์เดิมยังอยู่ที่เดิม ย้ายแล้วไฟล์หายจากที่เดิมไปอยู่ที่ใหม่" }
  - { front: "ชื่อไฟล์ที่ดีมีลักษณะอย่างไร", back: "บอกว่าข้างในคืออะไร เช่น ใส่เรื่องและวันที่ ปี-เดือน-วัน และใช้วิธีตั้งชื่อที่ตกลงกัน" }
  - { front: "ข้อมูลเปลี่ยนตามเวลา ควรใช้แผนภูมิแบบใด", back: "กราฟเส้น" }
  - { front: "ขั้นตอนใช้ข้อมูลแก้ปัญหา", back: "ตั้งคำถาม → รวบรวม → ตรวจและประมวลผล → นำเสนอ → สรุปผล" }
