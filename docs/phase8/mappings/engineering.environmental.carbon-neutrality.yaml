  - { framework: th-coe-engineering-basics, indicators: ["ENV-3.18"], coverage: full, note: "ครอบคลุม GWP และ CO₂e การคำนวณการปล่อยจากกิจกรรมและสมการการเผาไหม้ ขอบเขต 1 2 3 คาร์บอนฟุตพรินต์ ลำดับการลดการปล่อย ความเป็นกลางทางคาร์บอนกับสุทธิเป็นศูนย์ และคาร์บอนเครดิต เป้าหมายของไทยต้องตรวจกับแหล่งปัจจุบัน" }
  - { framework: th-coe-engineering-basics, indicators: ["CHE-3.12"], coverage: partial, note: "สอนส่วนการปล่อยก๊าซเรือนกระจกกับความเป็นกลางทางคาร์บอนเท่านั้น ยังไม่สอนหลักการจัดการและบำบัดของเสียหรือวิศวกรรมกระบวนการด้านสิ่งแวดล้อมที่ลดการปล่อยในกระบวนการเคมีโดยตรง" }
  - { framework: th-coe-engineering-basics, indicators: ["ENV-3.17"], coverage: partial, note: "สอนมิติคาร์บอนของการพัฒนาอย่างยั่งยืน ยังไม่ครอบคลุมมิติทรัพยากรน้ำ ความหลากหลายทางชีวภาพ และผลกระทบทางสังคมของการพัฒนา (ดู engineering.environmental.eia)" }
