id: computer.society.digital-economy
subject: computer
title: { th: เศรษฐศาสตร์ของการคำนวณและงานในยุคอัตโนมัติ, en: "Economics of computing and work in an automated age" }
summary: ต้นทุนส่วนเพิ่มของซอฟต์แวร์ที่ใกล้ศูนย์ ผลของเครือข่ายและแพลตฟอร์มสองฝั่ง การผูกขาดและการผูกติดผู้ขาย โมเดลรายได้ โอเพนซอร์ส และผลของระบบอัตโนมัติต่อการทำงาน
difficulty: 4.5
minutes: 40
prerequisites: [computer.society.computing-impacts, computer.society.responsible-ict]
encompasses:
  - { id: computer.society.computing-impacts, weight: 0.3 }
  - { id: computer.society.responsible-ict, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: cost-curve.svg
    alt: "กราฟเส้นตรงสองเส้นบนแกนจำนวนชุดที่ขายตั้งแต่ 0 ถึง 5,000 และแกนต้นทุนรวมตั้งแต่ 0 ถึง 1,000,000 บาท เส้นสีส้มของสินค้าทั่วไปเริ่มที่ศูนย์และพุ่งขึ้นถึง 1,000,000 บาท เส้นสีดำของซอฟต์แวร์เริ่มที่ 600,000 บาทแล้วเกือบเป็นเส้นระดับ ทั้งสองเส้นตัดกันที่ประมาณ 3,000 ชุด"
    caption: "ค่าสมมติ: ซอฟต์แวร์มีต้นทุนพัฒนา 600,000 บาท และต้นทุนต่อชุดใกล้ศูนย์ ส่วนสินค้าทั่วไปมีต้นทุน 200 บาทต่อชิ้น"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: ต้นทุนเฉลี่ยต่อชุดเมื่อขายได้มากขึ้น
    problem: "แอปหนึ่งมีต้นทุนพัฒนา 600,000 บาท (ค่าสมมติ) และค่าใช้จ่ายต่อชุดเป็นศูนย์ ต้นทุนเฉลี่ยต่อชุดเป็นเท่าใดเมื่อขายได้ 3,000 ชุด และเมื่อขายได้ 30,000 ชุด"
    steps:
      - text: "เมื่อขาย 3,000 ชุด ต้นทุนรวมคือต้นทุนพัฒนา 600,000 บาท เพราะค่าใช้จ่ายส่วนเพิ่มเป็นศูนย์"
        why: "ต้นทุนรวมคือทุกอย่างที่ต้องจ่าย ซึ่งในกรณีนี้มีเพียงต้นทุนพัฒนา"
      - text: "ต้นทุนเฉลี่ย = 600,000 ÷ 3,000 = 200 บาทต่อชุด"
      - text: "เมื่อขาย 30,000 ชุด ต้นทุนรวมยังเป็น 600,000 บาท เพราะไม่มีค่าใช้จ่ายเพิ่มต่อชุด"
        why: "ต้นทุนคงที่ไม่เปลี่ยนตามจำนวนชุดที่ขาย"
      - text: "ต้นทุนเฉลี่ย = 600,000 ÷ 30,000 = 20 บาทต่อชุด"
    answer: "ขาย 3,000 ชุดได้ต้นทุนเฉลี่ย 200 บาทต่อชุด และขาย 30,000 ชุดได้ 20 บาทต่อชุด"
  - { type: check, problem: computer.society.digital-economy.p001, prompt: "ลองคิดก่อนอ่านต่อ" }
  - type: figure
    src: network-effect.svg
    alt: "แผนภูมิแท่งสี่แท่งแสดงจำนวนการเชื่อมต่อแบบคู่ของเครือข่าย 4 คนได้ 6 คู่ 8 คนได้ 28 คู่ 12 คนได้ 66 คู่ และ 16 คนได้ 120 คู่ แท่งสุดท้ายเป็นสีส้ม ความสูงของแท่งเพิ่มเร็วกว่าจำนวนคน"
    caption: "จำนวนการเชื่อมต่อเพิ่มเร็วกว่าจำนวนผู้ใช้ เพราะผู้ใช้ใหม่แต่ละคนเชื่อมได้กับทุกคนที่อยู่ก่อนแล้ว"
  - type: worked-example
    title: จำนวนการเชื่อมต่อในกลุ่มเพื่อน 5 คนและ 10 คน
    problem: "กลุ่มเพื่อนกลุ่มแรกมี 5 คน และกลุ่มที่สองมี 10 คน แต่ละคนเชื่อมต่อกับทุกคนอื่นหนึ่งครั้ง โดยนับคู่โดยไม่สนลำดับ แต่ละกลุ่มมีกี่คู่ และเมื่อจำนวนคนเพิ่มเป็นสองเท่า จำนวนการเชื่อมต่อเพิ่มเป็นกี่เท่า"
    steps:
      - text: "กลุ่ม 5 คน คนแรกเชื่อมกับคนอื่นได้ 4 คน คนที่สองเชื่อมกับคนที่เหลือได้อีก 3 คน ต่อไปเป็น 2 และ 1 รวมเป็น 4 + 3 + 2 + 1 = 10 คู่"
        why: "เมื่อถึงคนถัดไป การเชื่อมกับคนก่อนหน้าถูกนับไปแล้ว จึงไม่นับซ้ำ"
      - text: "ตรวจด้วยสูตร n(n − 1) ÷ 2 = 5 × 4 ÷ 2 = 10 ได้ผลตรงกัน"
      - text: "กลุ่ม 10 คน ได้ 10 × 9 ÷ 2 = 45 คู่"
      - text: "ผู้ใช้เพิ่มจาก 5 เป็น 10 คน หรือสองเท่า แต่จำนวนการเชื่อมต่อเพิ่มจาก 10 เป็น 45 คู่ หรือ 4.5 เท่า"
        why: "การเชื่อมต่อเพิ่มเร็วกว่าจำนวนคนเพราะทุกคนใหม่เชื่อมได้กับทุกคนเดิม"
    answer: "กลุ่ม 5 คนมี 10 คู่ กลุ่ม 10 คนมี 45 คู่ ผู้ใช้เพิ่มสองเท่า แต่การเชื่อมต่อเพิ่ม 4.5 เท่า"
  - { type: check, problem: computer.society.digital-economy.p006, prompt: "ตัวอย่างใดแสดงผลของเครือข่าย" }
glossary:
  - { term: ต้นทุนคงที่ (fixed cost), definition: "ต้นทุนที่จ่ายครั้งเดียวหรือไม่เปลี่ยนตามจำนวนหน่วยที่ผลิตหรือขาย เช่น ค่าพัฒนาซอฟต์แวร์" }
  - { term: ต้นทุนส่วนเพิ่ม (marginal cost), definition: "ค่าใช้จ่ายที่เพิ่มขึ้นเมื่อผลิตหรือให้บริการอีกหนึ่งหน่วย" }
  - { term: ผลของเครือข่าย (network effect), definition: "สถานการณ์ที่บริการมีคุณค่ามากขึ้นเมื่อมีผู้ใช้มากขึ้น" }
  - { term: แพลตฟอร์มสองฝั่ง (two-sided platform), definition: "บริการที่เชื่อมผู้ใช้สองกลุ่ม เช่น ผู้ซื้อกับผู้ขาย ซึ่งคุณค่าของแต่ละฝั่งขึ้นกับจำนวนอีกฝั่ง" }
  - { term: การผูกติดผู้ขาย (vendor lock-in), definition: "สถานการณ์ที่ผู้ใช้ย้ายไปผู้ให้บริการอื่นได้ยากเพราะต้นทุนการเปลี่ยนสูง" }
  - { term: งานบนแพลตฟอร์ม (gig work), definition: "งานรายชิ้นหรือรายครั้งที่รับผ่านแอปหรือแพลตฟอร์ม เช่น ส่งอาหาร ผู้ทำงานยืดหยุ่นแต่มักไม่มีสวัสดิการแบบลูกจ้าง" }
flashcards:
  - { front: "ต้นทุนส่วนเพิ่มของซอฟต์แวร์ที่ผลิตซ้ำเป็นอย่างไร", back: "ใกล้ศูนย์ เพราะค่าพัฒนาเกิดครั้งเดียว และการคัดลอกเพิ่มแทบไม่มีค่าใช้จ่าย" }
  - { front: "กลุ่ม n คนมีการเชื่อมต่อแบบคู่กี่คู่", back: "n(n − 1) ÷ 2 คู่ เช่น 5 คนได้ 10 คู่" }
  - { front: "โมเดลรายได้จากโฆษณาทำงานอย่างไร", back: "ผู้ใช้ได้บริการฟรี ส่วนผู้จ่ายเงินคือผู้ลงโฆษณาที่ต้องการให้สินค้าปรากฏต่อผู้ใช้" }
  - { front: "โอเพนซอร์สฟรีหรือไม่", back: "ใช้ได้ฟรีโดยไม่ต้องจ่ายค่าใช้สิทธิ์ แต่ยังมีต้นทุนการพัฒนา ดูแล และอัปเดต" }
