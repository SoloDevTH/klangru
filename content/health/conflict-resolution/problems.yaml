- id: health.family.conflict-resolution.p015
  topics:
  - health.family.conflict-resolution
  difficulty: 5
  type: mcq
  stem: ฟ้าบอกครูว่าแฟนของเพื่อนสนิทชอบเช็กโทรศัพท์ บังคับไม่ให้คุยกับใคร และขู่ว่าจะทำร้ายถ้าเลิกกัน ข้อใดเป็นคำแนะนำที่เหมาะสมที่สุด
  choices:
  - id: a
    text: เป็นความสัมพันธ์ที่ไม่ปลอดภัย ไม่ใช่ความผิดของเพื่อน ควรช่วยให้เพื่อนเล่าให้ผู้ใหญ่ที่ไว้ใจฟัง และใช้ช่องทางช่วยเหลือเช่น 1300 ถ้าอยู่ในอันตรายโทร 191
    correct: true
  - id: b
    text: ให้เพื่อนยอมตามแฟนทุกอย่างจะได้ไม่ทะเลาะกัน
    feedback: การบังคับและข่มขู่ไม่ใช่ความขัดแย้งธรรมดา การยอมตามทำให้เพื่อนตกอยู่ในอันตรายมากขึ้น
  - id: c
    text: ให้ฟ้าไปต่อว่าแฟนของเพื่อนเอง
    feedback: อาจทำให้ฟ้าและเพื่อนไม่ปลอดภัย ควรให้ผู้ใหญ่ช่วยจัดการ
  hints:
  - การบังคับ ควบคุม และขู่ทำร้ายต่างจากความเห็นไม่ตรงกันธรรมดา
  - สถานการณ์ที่มีความรุนแรงต้องใช้ผู้ใหญ่ช่วย
  solution: การควบคุมและขู่ทำร้ายเป็นสัญญาณของความสัมพันธ์ที่ไม่ปลอดภัย ไม่ใช่ความผิดของผู้ถูกกระทำ ควรขอความช่วยเหลือจากผู้ใหญ่ ศูนย์ช่วยเหลือสังคม 1300 และตำรวจ 191 เมื่ออยู่ในอันตราย
