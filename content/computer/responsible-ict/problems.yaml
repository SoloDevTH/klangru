      - { left: "เพื่อนในกลุ่มรุมแต่งข้อความล้อเลียนคนหนึ่ง", right: "พฤติกรรม (conduct)" }
      - { left: "เกมชวนเติมเงินซื้อกล่องสุ่มโดยไม่บอกโอกาสที่จะได้ของ", right: "การค้า (commerce)" }
    hints:
      - "เนื้อหาคือสิ่งที่เห็น การติดต่อคือคนที่เข้ามาหาเรา"
      - "พฤติกรรมคือการกระทำของผู้ใช้ต่อกัน การค้าเกี่ยวกับเงินและการซื้อขาย"
    solution: "คลิปรุนแรง = เนื้อหา, คนแปลกหน้าขอข้อมูล = การติดต่อ, รุมล้อเลียน = พฤติกรรม, กล่องสุ่มที่ไม่บอกโอกาส = การค้า ทุกแบบควรหยุด เก็บหลักฐาน รายงาน และบอกผู้ใหญ่ที่ไว้ใจ"
