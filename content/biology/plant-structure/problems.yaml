    ai_assisted: true

  - id: biology.plants.plant-structure.p012
    topics: [biology.plants.plant-structure]
    difficulty: 4
    type: numeric
    stem: "นักเรียนลอกผิวใบด้านล่างของใบผักบุ้งไปส่องได้ภาพดังรูป วงกลมที่มองเห็นมีเส้นผ่านศูนย์กลาง 0.40 มิลลิเมตร ความหนาแน่นของปากใบเป็นกี่ปากต่อตารางมิลลิเมตร (ใช้ $\\pi = 3.14$ ตอบทศนิยม 1 ตำแหน่ง)"
    figure: { src: stomata-field.svg, alt: "วงกลมที่มองเห็นผ่านกล้องจุลทรรศน์ เห็นเซลล์ผิวใบรูปจิ๊กซอว์เต็มวง และมีปากใบซึ่งเป็นเซลล์คุมรูปถั่วสองเซลล์ประกบกันกระจายอยู่ทั้งหมด 12 ปาก" }
    answer: { value: 95.5, tolerance: 1, unit: ปากต่อ mm² }
    hints:
      - "นับปากใบในภาพ แล้วหาพื้นที่วงกลมที่มองเห็นด้วย $\\pi r^2$"
      - "รัศมีเท่ากับครึ่งหนึ่งของเส้นผ่านศูนย์กลาง แล้วนำจำนวนปากใบหารด้วยพื้นที่"
    misconceptions:
      - { match: 23.9, feedback: "ใช้เส้นผ่านศูนย์กลาง 0.40 mm เป็นรัศมี รัศมีคือ 0.20 mm" }
      - { match: 30, feedback: "หารด้วยเส้นผ่านศูนย์กลาง ต้องหารด้วยพื้นที่วงกลม $\\pi r^2$" }
    solution: "มีปากใบ 12 ปาก รัศมี $0.20\\ \\mathrm{mm}$ พื้นที่ $= 3.14 \\times 0.20^2 = 0.1256\\ \\mathrm{mm^2}$ ความหนาแน่น $= \\frac{12}{0.1256} \\approx 95.5$ ปากต่อตารางมิลลิเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-structure.p013
