id: thai.literature.folk-literature
subject: thai
title: { th: วรรณกรรมพื้นบ้าน เพลงพื้นบ้าน และบทร้องเล่น, en: "Thai folk literature, folk songs and children's rhymes" }
summary: รู้จักบทร้องเล่นของเด็ก เพลงกล่อมเด็ก เพลงพื้นบ้านของแต่ละภาค และนิทานพื้นบ้าน บอกข้อคิดจากนิทาน และอธิบายภูมิปัญญาทางภาษาในคำคล้องจองและคำเก่า
difficulty: 2.5
minutes: 30
prerequisites: [thai.reading.comprehension]
encompasses:
  - { id: thai.reading.comprehension, weight: 0.1 }
curriculum_tags: []
lessons:
  - type: figure
    src: folk-types.svg
    alt: "แผนภาพวรรณกรรมพื้นบ้าน เล่าหรือร้องปากต่อปาก ไม่รู้ผู้แต่ง มีหลายสำนวน แบ่งเป็น 4 กลุ่ม บทร้องเล่น ร้องประกอบการเล่น เช่น รีรีข้าวสาร มอญซ่อนผ้า จ้ำจี้ เพลงกล่อมเด็ก ร้องให้เด็กนอน เช่น เจ้าเนื้อละมุน นกขมิ้น ภาคใต้เรียกเพลงร้องเรือ เพลงพื้นบ้าน ผู้ใหญ่ร้องโต้ตอบ เช่น เพลงฉ่อย ลำตัด ซอ หมอลำ เพลงบอก นิทานพื้นบ้าน เล่าเรื่องมีข้อคิด เช่น ปลาบู่ทอง ก่องข้าวน้อย ผาแดงนางไอ่"
    caption: "วรรณกรรมพื้นบ้าน 4 กลุ่ม"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: riri-rhyme.svg
    alt: "บทร้องเล่นรีรีข้าวสาร 6 วรรค แยกเป็นคำ คำที่คล้องจองด้วยสระ -าน ระบายสีแดงและมีเส้นเชื่อมกัน ได้แก่ สาร ท้ายวรรคที่ 1 ลาน ท้ายวรรคที่ 3 ร้าน ท้ายวรรคที่ 4 จาน ท้ายวรรคที่ 5 และ พาน คำแรกของวรรคที่ 6 คำที่คล้องจองด้วยสระ เ-ือ ระบายสีน้ำเงิน ได้แก่ เปลือก ท้ายวรรคที่ 2 กับ เลือก คำแรกของวรรคที่ 3"
    caption: "คำคล้องจองในรีรีข้าวสาร ทำให้จำและร้องต่อได้ง่าย"
  - type: worked-example
    title: หาคำคล้องจองและคำเก่าในบทร้องเล่น
    problem: "บทร้องเล่น \"โยกเยก\" (วิกิซอร์ซ): โยกเยกเอย / น้ำท่วมเมฆ / กระต่ายลอยคอ / หมาหางงอ / กอดคอโยกเยก หาคำคล้องจอง และบอกว่าบทนี้ร้องเล่นอย่างไร"
    steps:
      - text: "อ่านคำท้ายแต่ละวรรค: เยก เมฆ คอ งอ เยก"
      - text: "จับคู่เสียงที่เหมือนกัน: เยก–เมฆ (สระ เ- เสียงตัวสะกด ก) และ คอ–งอ (สระ -อ)"
        why: "คำคล้องจองต้องมีเสียงสระและเสียงตัวสะกดตรงกัน เมฆ สะกดด้วย ฆ แต่ออกเสียงแม่กก"
      - text: "วรรคสุดท้าย กอดคอโยกเยก มีทั้ง คอ และ โยกเยก ร้อยทุกวรรคเข้าด้วยกัน"
      - text: "คำว่า โยกเยก และ กอดคอ บอกท่าทาง เด็กจึงกอดคอกันโยกตัวไปมาตามจังหวะ"
    answer: "คำคล้องจอง: เยก–เมฆ และ คอ–งอ เด็กร้องพร้อมกอดคอโยกตัวไปมาตามจังหวะ"
  - { type: check, problem: thai.literature.folk-literature.p004, prompt: "หาคำที่มีสระ -อ เหมือน คอ" }
  - type: worked-example
    title: บอกข้อคิดจากนิทานพื้นบ้าน
    problem: "นิทานอีสาน ก่องข้าวน้อยฆ่าแม่: ลูกชายหิวมาก แม่นำข้าวมาส่งช้าและดูน้อยเกินไปเพราะก่องข้าวใบเล็ก ลูกโกรธจนทำร้ายแม่ แล้วจึงพบว่ากินข้าวไม่หมด เขาเสียใจจึงสร้างเจดีย์ไถ่โทษ นิทานนี้ให้ข้อคิดอะไร"
    steps:
      - text: "ตัวละครทำอะไร: ลูกทำร้ายแม่เพราะโกรธและหิว"
      - text: "ผลเป็นอย่างไร: ข้าวเพียงพอ ลูกเข้าใจผิด เสียใจภายหลังแต่แก้ไขไม่ได้"
        why: "ผลร้ายที่แก้ไม่ได้ ชี้ว่าการกระทำนั้นไม่ควรทำ"
      - text: "สรุปเป็นข้อคิดที่ใช้ได้กับทุกคน: อย่าทำสิ่งใดตอนโกรธ และต้องกตัญญูต่อพ่อแม่"
    answer: "อย่าตัดสินใจทำสิ่งใดตอนโกรธ และควรกตัญญูต่อพ่อแม่"
glossary:
  - { term: วรรณกรรมพื้นบ้าน, definition: "เรื่องเล่า เพลง และบทร้องที่ชาวบ้านสืบทอดกันมา ไม่รู้ผู้แต่ง" }
  - { term: มุขปาฐะ, definition: "การบอกเล่าต่อ ๆ กันมาโดยไม่ได้เขียนเป็นตัวอักษร" }
  - { term: บทร้องเล่น, definition: "บทที่เด็กร้องประกอบการเล่น เช่น รีรีข้าวสาร" }
  - { term: เพลงกล่อมเด็ก, definition: "เพลงที่ผู้ใหญ่ร้องให้เด็กนอน ภาคใต้เรียกเพลงร้องเรือ" }
  - { term: ลูกคู่, definition: "คนร้องรับต้นเสียงในเพลงพื้นบ้าน" }
  - { term: ภูมิปัญญาทางภาษา, definition: "ความรู้ที่อยู่ในถ้อยคำ เช่น คำคล้องจอง คำเก่า การเปรียบเทียบ" }
flashcards:
  - { front: "ลักษณะวรรณกรรมพื้นบ้าน", back: "ปากต่อปาก ไม่รู้ผู้แต่ง มีหลายสำนวน ภาษาง่ายคล้องจอง" }
  - { front: "เพลงพื้นบ้าน 4 ภาค", back: "กลาง: ฉ่อย ลำตัด · เหนือ: ซอ · อีสาน: หมอลำ · ใต้: เพลงบอก" }
  - { front: "ทะนาน เบี้ย คด", back: "เครื่องตวงข้าว · เปลือกหอยที่ใช้เป็นเงิน · ตักข้าวออกจากหม้อ" }
  - { front: "ข้อคิดจากก่องข้าวน้อยฆ่าแม่", back: "อย่าทำสิ่งใดตอนโกรธ และกตัญญูต่อพ่อแม่" }
