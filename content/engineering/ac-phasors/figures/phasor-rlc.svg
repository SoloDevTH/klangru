<text x="130.0" y="30.0" text-anchor="middle" fill="#15211e" font-size="15" font-weight="bold">ตัวต้านทาน R</text>
<line x1="40.0" y1="160.0" x2="240.0" y2="160.0" stroke="#777" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="130.0" y1="60.0" x2="130.0" y2="260.0" stroke="#777" stroke-width="1" stroke-dasharray="4 4"/>
