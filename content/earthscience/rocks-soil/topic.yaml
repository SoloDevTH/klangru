id: earthscience.geology.rocks-soil
subject: earthscience
title: { th: หินและดินรอบตัว, en: "Rocks and soil around us" }
summary: สังเกตสี เนื้อหิน และความแข็งของหิน ดินเกิดจากเศษหินกับซากพืชซากสัตว์ ส่วนประกอบของดิน ดินร่วน ดินเหนียว ดินทราย และการใช้ประโยชน์จากหินและดิน
difficulty: 1.2
minutes: 25
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ลักษณะภายนอกของหินสี่ชนิด
    src: rock-features.svg
    alt: "การ์ดสี่ใบ หินแกรนิต เนื้อหยาบ มีเม็ดแร่ สีขาว ดำ ชมพูปนกัน แข็งมาก หินปูน เนื้อละเอียด สีเทาหรือขาว ขูดด้วยตะปูเป็นรอย หินทราย มีเม็ดทรายเล็ก ๆ ผิวสาก บางก้อนเป็นชั้น ถูแรง ๆ ทรายหลุด หินพัมมิซ มีรูพรุนทั่วก้อน สีอ่อน น้ำหนักเบา ลอยน้ำได้"
    caption: "สังเกตสี เนื้อหิน ความแข็ง และน้ำหนัก (วาดโดยทีมคลังรู้ ไม่ใช่ภาพถ่าย)"
  - type: worked-example
    title: จัดกลุ่มหินจากสิ่งที่สังเกตได้
    problem: "มีหิน 4 ก้อน ก้อนที่ 1 เนื้อหยาบหลายสี ก้อนที่ 2 เนื้อละเอียดสีเทา ก้อนที่ 3 มีเม็ดทรายผิวสาก ก้อนที่ 4 มีรูพรุนลอยน้ำได้ จัดกลุ่มตามเนื้อหิน"
    steps:
      - text: "เลือกเกณฑ์ก่อน ครั้งนี้ใช้ เนื้อหิน คือดูว่าหยาบหรือละเอียด"
        why: "จัดกลุ่มครั้งละเกณฑ์เดียว จะได้ไม่สับสน"
      - text: "ก้อนที่ 1 เห็นเม็ดแร่ชัด และก้อนที่ 3 มีเม็ดทราย จัดเป็นกลุ่มเนื้อหยาบ"
      - text: "ก้อนที่ 2 เนื้อละเอียดเรียบ จัดเป็นกลุ่มเนื้อละเอียด"
      - text: "ก้อนที่ 4 มีรูพรุน แยกเป็นอีกกลุ่ม หรือถ้าใช้เกณฑ์ ลอยหรือจม ก้อนนี้อยู่กลุ่มลอยน้ำได้เพียงก้อนเดียว"
    answer: "เนื้อหยาบ: ก้อนที่ 1 และ 3 เนื้อละเอียด: ก้อนที่ 2 มีรูพรุน: ก้อนที่ 4"
  - { type: check, problem: earthscience.geology.rocks-soil.p006, prompt: "หินที่เป็นรอยคือหินที่อ่อนกว่า" }
  - type: figure
    title: ชั้นของดินเมื่อขุดลงไป
    src: soil-layers.svg
    alt: "ภาพตัดดินจากบนลงล่าง บนผิวดินมีต้นกล้าสามต้น รากอยู่ในดินชั้นบน ชั้นที่ 1 ดินชั้นบน สีน้ำตาลเข้ม มีซากพืชซากสัตว์ผุพัง (ฮิวมัส) ร่วนซุย รากพืชอยู่มาก ชั้นที่ 2 ดินชั้นล่าง สีอ่อนกว่า แน่นกว่า มีฮิวมัสน้อย ชั้นที่ 3 หินผุ มีเศษหินก้อนเล็ก ๆ ปนกับดิน ชั้นที่ 4 หินแข็ง หินก้อนใหญ่ที่ยังไม่ผุ"
    caption: "ดินเกิดจากหินที่ผุพังผสมกับซากพืชซากสัตว์ ใช้เวลานานมาก (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: figure
    title: ส่วนประกอบของดิน
    src: soil-parts.svg
    alt: "แผนภูมิวงกลมส่วนประกอบของดินที่เหมาะกับการปลูกพืช เศษหินและแร่ประมาณ 45 ส่วนใน 100 ส่วน ซากพืชซากสัตว์ (ฮิวมัส) ประมาณ 5 ส่วน น้ำประมาณ 25 ส่วน อากาศประมาณ 25 ส่วน"
    caption: "ค่าประมาณโดยปริมาตร ดินแต่ละที่มีส่วนผสมต่างกัน (วาดโดยทีมคลังรู้)"
  - { type: check, problem: earthscience.geology.rocks-soil.p005, prompt: "ฟองที่ผุดขึ้นมาคืออะไร" }
  - type: worked-example
    title: บอกชนิดของดินจากการปั้น
    problem: "ต้นหยิบดินชื้นมาบีบ ดินจับตัวเป็นก้อนได้ แต่พอปั้นเป็นเส้นก็แตกออก เนื้อดินนุ่มมือ ดินนี้น่าจะเป็นดินชนิดใด และเหมาะกับอะไร"
    steps:
      - text: "ดูการจับตัว ดินจับเป็นก้อนได้ จึงไม่ใช่ดินทราย เพราะดินทรายปั้นเป็นก้อนไม่ได้"
      - text: "ปั้นเป็นเส้นแล้วแตก จึงไม่ใช่ดินเหนียว เพราะดินเหนียวปั้นเป็นเส้นยาวได้"
      - text: "ดินที่จับตัวพอปั้นได้แต่แตกง่าย และนุ่มมือ คือดินร่วน"
        why: "ใช้เกณฑ์สองอย่าง คือเนื้อดินและการจับตัว"
    answer: "ดินร่วน เหมาะกับการปลูกผักและไม้ดอกทั่วไป"
  - { type: check, problem: earthscience.geology.rocks-soil.p009, prompt: "ดินเหนียวอุ้มน้ำไว้มาก" }
glossary:
  - { term: เนื้อหิน, definition: "ลักษณะของผิวและเม็ดในหิน เช่น หยาบ ละเอียด มีรูพรุน หรือเป็นชั้น" }
  - { term: ฮิวมัส, definition: "ซากพืชซากสัตว์ที่ผุพังอยู่ในดิน มีสีเข้ม ทำให้ดินร่วนซุยและมีอาหารสำหรับพืช" }
  - { term: ดินร่วน, definition: "ดินที่นุ่มมือ จับตัวพอปั้นได้แต่แตกง่าย เก็บน้ำได้พอดี เหมาะกับการปลูกพืช" }
  - { term: ดินเหนียว, definition: "ดินเนื้อละเอียดมาก จับตัวแน่น ปั้นเป็นเส้นได้ อุ้มน้ำได้มาก" }
  - { term: ดินทราย, definition: "ดินเนื้อหยาบ ไม่จับตัว น้ำไหลผ่านเร็ว เก็บน้ำได้น้อย" }
flashcards:
  - { front: "ดินเกิดจากอะไร", back: "หินที่ผุพังเป็นเม็ดเล็ก ผสมกับซากพืชซากสัตว์ที่ผุพัง (ฮิวมัส)" }
  - { front: "ในดินมีอะไรบ้าง", back: "เศษหินและแร่ ฮิวมัส น้ำ และอากาศ" }
  - { front: "ดินชนิดใดปั้นเป็นเส้นยาวได้", back: "ดินเหนียว ใช้ปั้นโอ่ง อิฐ และทำนาข้าว" }
  - { front: "ทดสอบความแข็งของหินอย่างไร", back: "นำหินสองก้อนมาขูดกัน ก้อนที่เป็นรอยคือก้อนที่อ่อนกว่า" }
