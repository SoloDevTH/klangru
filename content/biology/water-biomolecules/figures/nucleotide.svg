<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 300" width="830" height="300" font-family="sans-serif" font-size="15">
<title>ส่วนประกอบของนิวคลีโอไทด์ และความต่างของ DNA กับ RNA</title>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<circle cx="60" cy="90" r="30" fill="#f6d365" stroke="#7a5c00" stroke-width="2"/><text x="60" y="96" text-anchor="middle" font-weight="bold" font-size="18">P</text>
<text x="60" y="140" text-anchor="middle" font-size="13">หมู่ฟอสเฟต</text>
<polygon points="150.0,96.0 182.3,119.5 170.0,157.5 130.0,157.5 117.7,119.5" fill="#bfe3c0" stroke="#1f5e22" stroke-width="2"/>
<text x="150" y="136" text-anchor="middle" font-size="13">น้ำตาล</text>
<text x="150" y="188" text-anchor="middle" font-size="13">น้ำตาลเพนโทส (5 C)</text>
<line x1="88" y1="98" x2="120" y2="116" stroke="#333" stroke-width="3"/>
<line x1="182" y1="120" x2="212" y2="102" stroke="#333" stroke-width="3"/>
<rect x="212" y="58" width="84" height="58" rx="6" fill="#c9daf8" stroke="#1f4e79" stroke-width="2"/>
<text x="254" y="82" text-anchor="middle" font-size="13">เบส</text>
<text x="254" y="104" text-anchor="middle" font-size="13">ไนโตรเจน</text>
<text x="170" y="222" text-anchor="middle" font-weight="bold">1 นิวคลีโอไทด์</text>
<rect x="340" y="30" width="100" height="44" fill="#eef5fb" stroke="#888"/>
<text x="390.0" y="57" text-anchor="middle" font-size="13.5" font-weight="bold"></text>
<rect x="440" y="30" width="180" height="44" fill="#eef5fb" stroke="#888"/>
<text x="530.0" y="57" text-anchor="middle" font-size="13.5" font-weight="bold">DNA</text>
<rect x="620" y="30" width="190" height="44" fill="#eef5fb" stroke="#888"/>
<text x="715.0" y="57" text-anchor="middle" font-size="13.5" font-weight="bold">RNA</text>
<rect x="340" y="74" width="100" height="44" fill="#ffffff" stroke="#888"/>
<text x="390.0" y="101" text-anchor="middle" font-size="13.5" font-weight="bold">น้ำตาล</text>
<rect x="440" y="74" width="180" height="44" fill="#ffffff" stroke="#888"/>
<text x="530.0" y="101" text-anchor="middle" font-size="13.5">ดีออกซีไรโบส</text>
<rect x="620" y="74" width="190" height="44" fill="#ffffff" stroke="#888"/>
<text x="715.0" y="101" text-anchor="middle" font-size="13.5">ไรโบส</text>
<rect x="340" y="118" width="100" height="44" fill="#f6f6f6" stroke="#888"/>
<text x="390.0" y="145" text-anchor="middle" font-size="13.5" font-weight="bold">เบส</text>
<rect x="440" y="118" width="180" height="44" fill="#f6f6f6" stroke="#888"/>
<text x="530.0" y="145" text-anchor="middle" font-size="13.5">A T C G</text>
<rect x="620" y="118" width="190" height="44" fill="#f6f6f6" stroke="#888"/>
<text x="715.0" y="145" text-anchor="middle" font-size="13.5">A U C G</text>
<rect x="340" y="162" width="100" height="44" fill="#ffffff" stroke="#888"/>
<text x="390.0" y="189" text-anchor="middle" font-size="13.5" font-weight="bold">จำนวนสาย</text>
<rect x="440" y="162" width="180" height="44" fill="#ffffff" stroke="#888"/>
<text x="530.0" y="189" text-anchor="middle" font-size="13.5">2 สาย (เกลียวคู่)</text>
<rect x="620" y="162" width="190" height="44" fill="#ffffff" stroke="#888"/>
<text x="715.0" y="189" text-anchor="middle" font-size="13.5">สายเดี่ยว</text>
<rect x="340" y="206" width="100" height="44" fill="#f6f6f6" stroke="#888"/>
<text x="390.0" y="233" text-anchor="middle" font-size="13.5" font-weight="bold">หน้าที่หลัก</text>
<rect x="440" y="206" width="180" height="44" fill="#f6f6f6" stroke="#888"/>
<text x="530.0" y="233" text-anchor="middle" font-size="13.5">เก็บข้อมูลพันธุกรรม</text>
<rect x="620" y="206" width="190" height="44" fill="#f6f6f6" stroke="#888"/>
<text x="715.0" y="233" text-anchor="middle" font-size="13.5">นำข้อมูลไปสร้างโปรตีน</text>
<text x="340" y="280" font-size="13">A = อะดีนีน  T = ไทมีน  U = ยูราซิล  C = ไซโทซีน  G = กัวนีน</text>
</svg>