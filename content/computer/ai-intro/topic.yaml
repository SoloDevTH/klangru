id: computer.ai.intro
subject: computer
title: { th: ปัญญาประดิษฐ์เบื้องต้น, en: "Introduction to artificial intelligence" }
summary: AI ในซอฟต์แวร์และระบบรอบตัว ค้นหาในเกมด้วยมินิแมกซ์ การเรียนรู้ของเครื่องด้วยข้อมูลฝึกและข้อมูลทดสอบ จำแนกด้วยเพื่อนบ้านใกล้ที่สุด ความลำเอียง และข้อจำกัดของ AI แบบรู้สร้าง
difficulty: 5.5
minutes: 55
prerequisites: [computer.algorithms.searching-sorting, computer.data.data-processing, computer.society.computing-impacts, computer.programming.recursion]
encompasses:
  - { id: computer.algorithms.searching-sorting, weight: 0.2 }
  - { id: computer.data.data-processing, weight: 0.3 }
  - { id: computer.society.computing-impacts, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: sense-think-act.svg
    alt: "วงจรสามขั้นของหุ่นยนต์ดูดฝุ่น กล่องรับรู้ (sense) ใช้เซนเซอร์ชน กล้อง และเซนเซอร์วัดระยะ ลูกศรไปกล่องคิด (think) สร้างแผนที่ห้อง เลือกเส้นทาง เลี่ยงสิ่งกีดขวาง ลูกศรไปกล่องลงมือ (act) หมุนล้อ เปิดแปรง กลับแท่นชาร์จ เส้นประจากลงมือย้อนกลับไปรับรู้ เขียนว่าสิ่งรอบตัวเปลี่ยน แล้วรับรู้ใหม่ในรอบถัดไป"
    caption: "ระบบ AI ทางกายภาพทำงานเป็นวงจรรับรู้ คิด และลงมือ"
  - type: figure
    src: minimax-tree.svg
    alt: "ต้นไม้เกมสองชั้น รากเป็นชั้น MAX ของคอมพิวเตอร์ มีสองทาง ทางซ้ายไปโหนดชั้น MIN ของคู่แข่งที่มีคะแนนท้ายเกม 3 และ 5 จึงได้ค่า 3 ทางขวาไปโหนด MIN ที่มีคะแนน 2 และ 9 จึงได้ค่า 2 รากเลือกค่ามากกว่าคือ 3 เส้นทางซ้ายเป็นสีน้ำเงินหนา"
    caption: "MIN ส่งค่าน้อยที่สุดขึ้นไป MAX เลือกค่ามากที่สุด คอมพิวเตอร์จึงเดินทางซ้าย"
  - type: worked-example
    title: หาค่ามินิแมกซ์ของเกมหยิบไม้ 3 อัน
    problem: "เกมหยิบไม้ (หยิบได้ 1 หรือ 2 อัน ใครหยิบอันสุดท้ายชนะ) เหลือไม้ 3 อันและเป็นตาคอมพิวเตอร์ ให้ใช้มินิแมกซ์หาว่าคอมพิวเตอร์จะชนะได้หรือไม่ (+1 ชนะ −1 แพ้)"
    steps:
      - text: "ทางเลือกของคอมพิวเตอร์: หยิบ 1 เหลือ 2 หรือหยิบ 2 เหลือ 1 ถึงตาคู่แข่ง"
      - text: "ถ้าเหลือ 1 ตาคู่แข่ง: คู่แข่งหยิบ 1 อันสุดท้ายแล้วชนะ คะแนนของกิ่งนี้คือ −1"
      - text: "ถ้าเหลือ 2 ตาคู่แข่ง: คู่แข่งหยิบ 2 อันแล้วชนะ (−1) หรือหยิบ 1 ให้คอมพิวเตอร์หยิบอันสุดท้าย (+1) คู่แข่งเป็นชั้น MIN จึงเลือก −1"
        why: "มินิแมกซ์สมมติว่าคู่แข่งเลือกทางที่แย่ที่สุดสำหรับคอมพิวเตอร์เสมอ"
      - text: "ชั้น MAX ของคอมพิวเตอร์: max(−1, −1) = −1"
      - text: "สรุป: ไม่ว่าหยิบเท่าใด ถ้าคู่แข่งเล่นดีที่สุด คอมพิวเตอร์แพ้ ตรงกับผลของ minimax(3, True) ที่ได้ −1"
        why: "จำนวนไม้ที่หารด้วย 3 ลงตัวเป็นตำแหน่งแพ้ของผู้ที่ต้องเดิน"
    answer: "ค่ามินิแมกซ์คือ −1 คอมพิวเตอร์แพ้ถ้าคู่แข่งเล่นดีที่สุด"
  - { type: check, problem: computer.ai.intro.p007, prompt: "ลองส่งค่าขึ้นจากใบไปถึงรากของต้นไม้ในโจทย์" }
  - type: figure
    src: knn-mango.svg
    alt: "แผนภาพการกระจาย แกนนอนความเหลืองของผิว 0 ถึง 10 แกนตั้งความนิ่มเมื่อกด 0 ถึง 10 มะม่วงสุก (วงกลมสีส้ม) 4 ผลที่ (8, 7), (7, 9), (9, 6), (6, 8) มะม่วงดิบ (สี่เหลี่ยมสีเขียว) 4 ผลที่ (2, 2), (3, 4), (1, 3), (4, 1) ผลใหม่ (ดาวสีน้ำเงิน) ที่ (6, 6) เส้นประไปเพื่อนบ้านใกล้ที่สุด 3 ผล คือ (6, 8) ระยะ 2, (8, 7) ระยะ 2.24 และ (9, 6) ระยะ 3 ซึ่งอยู่ในวงกลมและสุกทั้งหมด"
    caption: "สามเพื่อนบ้านใกล้ที่สุดของผลใหม่สุกทั้งหมด จึงทำนายว่าสุก"
  - type: worked-example
    title: วัดความแม่นยำแยกตามกลุ่ม
    problem: "ระบบแปลงเสียงพูดเป็นข้อความของแอปหนึ่ง ทดสอบกับประโยค 250 ประโยค จากผู้พูดสำเนียงกลาง 200 ประโยค ถูก 180 ประโยค และสำเนียงใต้ 50 ประโยค ถูก 30 ประโยค ให้หาความแม่นยำรวมและแยกกลุ่ม แล้วประเมินความเป็นธรรม"
    steps:
      - text: "ความแม่นยำรวม: (180 + 30) ÷ 250 × 100 = 84%"
      - text: "สำเนียงกลาง: 180 ÷ 200 × 100 = 90%"
      - text: "สำเนียงใต้: 30 ÷ 50 × 100 = 60%"
        why: "ตัวเลขรวมถูกกลุ่มใหญ่ดึงขึ้น ต้องแยกกลุ่มจึงเห็นปัญหา"
      - text: "ประเมิน: ผู้พูดสำเนียงใต้ได้ผลแย่กว่ามาก ระบบไม่เป็นธรรมกับกลุ่มนี้ สาเหตุที่เป็นไปได้คือข้อมูลฝึกมีเสียงสำเนียงใต้น้อย"
      - text: "แนวทางแก้: เก็บเสียงจากผู้พูดหลายสำเนียงเพิ่มในข้อมูลฝึก แล้ววัดความแม่นยำแยกกลุ่มซ้ำก่อนเปิดใช้"
    answer: "รวม 84% แต่สำเนียงกลาง 90% และสำเนียงใต้ 60% ต้องเพิ่มข้อมูลสำเนียงใต้แล้ววัดซ้ำ"
  - { type: check, problem: computer.ai.intro.p003, prompt: "ลองคำนวณความแม่นยำจากข้อมูลทดสอบ" }
glossary:
  - { term: ปัญญาประดิษฐ์ (artificial intelligence; AI), definition: "ระบบคอมพิวเตอร์ที่ทำงานซึ่งปกติต้องใช้ความสามารถแบบมนุษย์ เช่น รับรู้ ตัดสินใจ วางแผน หรือเรียนรู้จากตัวอย่าง" }
  - { term: มินิแมกซ์ (minimax), definition: "อัลกอริทึมค้นหาในต้นไม้เกมสองฝ่าย ชั้นของเราเลือกค่ามากที่สุด ชั้นของคู่แข่งเลือกค่าน้อยที่สุด" }
  - { term: การเรียนรู้ของเครื่อง (machine learning), definition: "วิธีให้คอมพิวเตอร์หารูปแบบจากตัวอย่างแทนการเขียนกติกาทุกข้อเอง" }
  - { term: คุณลักษณะ (feature), definition: "ค่าที่วัดได้ของตัวอย่าง เช่น ความเหลืองและความนิ่มของมะม่วง" }
  - { term: ป้ายกำกับ (label), definition: "คำตอบที่ถูกของตัวอย่าง เช่น สุก หรือ ดิบ" }
  - { term: ข้อมูลฝึกและข้อมูลทดสอบ, definition: "ข้อมูลฝึกใช้สร้างแบบจำลอง ข้อมูลทดสอบเก็บแยกไว้ใช้วัดผลกับข้อมูลที่แบบจำลองไม่เคยเห็น" }
  - { term: k เพื่อนบ้านใกล้ที่สุด (k-nearest neighbours), definition: "วิธีจำแนกที่ให้ k ตัวอย่างที่ใกล้ข้อมูลใหม่ที่สุดโหวตป้ายกำกับ" }
  - { term: ความลำเอียงของข้อมูล (data bias), definition: "ข้อมูลที่ไม่เป็นตัวแทนของทุกกลุ่ม หรือสะท้อนการตัดสินใจที่ไม่เป็นธรรมในอดีต ทำให้แบบจำลองไม่เป็นธรรม" }
  - { term: hallucination, definition: "การที่ AI แบบรู้สร้างสร้างข้อมูลผิดหรือแหล่งอ้างอิงที่ไม่มีจริง แต่ฟังดูน่าเชื่อ" }
flashcards:
  - { front: "มินิแมกซ์สมมติอะไรเกี่ยวกับคู่แข่ง", back: "คู่แข่งเล่นดีที่สุด คือเลือกทางที่แย่ที่สุดสำหรับเรา (MIN)" }
  - { front: "ทำไมต้องแยกข้อมูลทดสอบออกจากข้อมูลฝึก", back: "เพื่อวัดผลกับข้อมูลที่แบบจำลองไม่เคยเห็น ถ้าวัดด้วยข้อมูลฝึกจะได้ผลดีเกินจริง" }
  - { front: "kNN ทำนายอย่างไร", back: "วัดระยะไปทุกตัวอย่างฝึก เลือก k ตัวที่ใกล้ที่สุด แล้วโหวตป้ายกำกับ" }
  - { front: "ความแม่นยำรวมสูงแปลว่าเป็นธรรมกับทุกกลุ่มหรือไม่", back: "ไม่จำเป็น ต้องวัดความแม่นยำแยกตามกลุ่ม" }
  - { front: "AI แบบรู้สร้างให้แหล่งอ้างอิงมา ต้องทำอะไร", back: "เปิดตรวจแหล่งต้นทางว่ามีจริงและพูดแบบนั้นจริง ก่อนนำไปอ้าง" }
