    现在，曼谷的超市里塑料袋越来越多。不少人觉得，一个袋子不算什么。其实，很多小事加在一起，就会影响环境。我们不是要完全不用塑料袋，而是可以带一个布袋去菜市场买菜。这样做既省钱，也能保护环境。我希望大家都从身边的小事做起。'
