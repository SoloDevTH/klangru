<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="sans-serif" font-size="14">
<title>แผนภาพกระบวนการของเครื่องระเหยในโรงงานน้ำตาล</title>
<rect x="0" y="0" width="700" height="330" fill="#ffffff"/>
<rect x="260.0" y="110.0" width="180.0" height="110.0" rx="8" fill="#eef4fb" stroke="#15211e" stroke-width="2.5"/>
<text x="350.0" y="165.0" text-anchor="middle" fill="#15211e" font-size="16" font-weight="bold">เครื่องระเหย</text>
<text x="350.0" y="187.0" text-anchor="middle" fill="#777" font-size="13">(evaporator)</text>
<line x1="40.0" y1="165.0" x2="244.8" y2="165.0" stroke="#15211e" stroke-width="2.5"/>
<polygon points="255.0,165.0 243.0,159.6 243.0,170.4" fill="#15211e" stroke="#15211e" stroke-width="1" stroke-linejoin="round"/>
<text x="48.0" y="140.0" text-anchor="start" fill="#15211e" font-size="14">น้ำอ้อย F = 100 t/h</text>
<text x="48.0" y="192.0" text-anchor="start" fill="#15211e" font-size="14">น้ำตาล 15% โดยมวล</text>
<line x1="350.0" y1="105.0" x2="350.0" y2="50.2" stroke="#1f5fa8" stroke-width="2.5"/>
<polygon points="350.0,40.0 344.6,52.0 355.4,52.0" fill="#1f5fa8" stroke="#1f5fa8" stroke-width="1" stroke-linejoin="round"/>
<text x="362.0" y="52.0" text-anchor="start" fill="#1f5fa8" font-size="14">ไอน้ำที่ระเหยออก W = ?</text>
<text x="362.0" y="72.0" text-anchor="start" fill="#1f5fa8" font-size="13">(น้ำบริสุทธิ์)</text>
<line x1="445.0" y1="165.0" x2="649.8" y2="165.0" stroke="#15211e" stroke-width="2.5"/>
<polygon points="660.0,165.0 648.0,159.6 648.0,170.4" fill="#15211e" stroke="#15211e" stroke-width="1" stroke-linejoin="round"/>
<text x="455.0" y="140.0" text-anchor="start" fill="#15211e" font-size="14">น้ำเชื่อม S = ?</text>
<text x="455.0" y="192.0" text-anchor="start" fill="#15211e" font-size="14">น้ำตาล 65% โดยมวล</text>
<line x1="300.0" y1="300.0" x2="300.0" y2="235.2" stroke="#c0392b" stroke-width="2.5"/>
<polygon points="300.0,225.0 294.6,237.0 305.4,237.0" fill="#c0392b" stroke="#c0392b" stroke-width="1" stroke-linejoin="round"/>
<text x="290.0" y="292.0" text-anchor="end" fill="#c0392b" font-size="13">ไอน้ำร้อนให้ความร้อน</text>
<line x1="400.0" y1="225.0" x2="400.0" y2="289.8" stroke="#c0392b" stroke-width="2.5"/>
<polygon points="400.0,300.0 405.4,288.0 394.6,288.0" fill="#c0392b" stroke="#c0392b" stroke-width="1" stroke-linejoin="round"/>
<text x="410.0" y="292.0" text-anchor="start" fill="#c0392b" font-size="13">น้ำควบแน่นกลับหม้อไอน้ำ</text>
</svg>
