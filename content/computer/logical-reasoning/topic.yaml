id: computer.algorithms.logical-reasoning
subject: computer
title: { th: เหตุผลเชิงตรรกะในการแก้ปัญหา, en: Logical reasoning in problem solving }
summary: ใช้เงื่อนไข ถ้า...แล้ว และ หรือ ไม่ อธิบายการทำงานและคาดการณ์ผลลัพธ์ ออกแบบวิธีแก้ปัญหาในชีวิตประจำวัน และเปรียบเทียบอัลกอริทึมเพื่อเลือกแบบที่เหมาะที่สุด
difficulty: 2
minutes: 35
prerequisites: [computer.algorithms.intro]
encompasses:
  - { id: computer.algorithms.intro, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: hall-light.svg
    alt: "ผังงานไฟทางเดินอัตโนมัติ เริ่ม แล้วถามว่ามืดหรือไม่ ถ้าไม่ใช่ไปที่ปิดไฟ ถ้าใช่ถามต่อว่ามีคนเดินผ่านหรือไม่ ถ้าไม่ใช่ไปที่ปิดไฟ ถ้าใช่เปิดไฟ 1 นาที ทั้งสองทางไปจบ"
    caption: "ไฟเปิดได้ทางเดียวคือมืด และ มีคนเดินผ่าน"
  - { type: check, problem: computer.algorithms.logical-reasoning.p005, prompt: "ใช้ผังงานด้านบนตอบ" }
  - type: worked-example
    title: คาดการณ์ค่าส่งจากเงื่อนไขซ้อน
    problem: "ร้านค้าออนไลน์คิดค่าส่งดังนี้: ถ้ายอดซื้อตั้งแต่ 500 บาทขึ้นไป ส่งฟรี ไม่เช่นนั้น ถ้าเป็นสมาชิก ค่าส่ง 20 บาท ไม่เช่นนั้นค่าส่ง 50 บาท แม่ไม่ได้เป็นสมาชิก ซื้อผ้าขาวม้า 3 ผืน ผืนละ 160 บาท ต้องจ่ายทั้งหมดเท่าใด"
    steps:
      - text: "หายอดซื้อ: 3 × 160 = 480 บาท"
      - text: "ตรวจเงื่อนไขแรก: 480 ≥ 500 หรือไม่ → เท็จ จึงไม่ได้ส่งฟรี ไปทาง ไม่เช่นนั้น"
        why: "ต้องตรวจเงื่อนไขตามลำดับ เงื่อนไขที่สองถูกตรวจเฉพาะเมื่อเงื่อนไขแรกเป็นเท็จ"
      - text: "ตรวจเงื่อนไขที่สอง: เป็นสมาชิกหรือไม่ → เท็จ จึงคิดค่าส่ง 50 บาท"
      - text: "รวม 480 + 50 = 530 บาท"
        why: "ยอดที่เกิน 500 หลังบวกค่าส่งไม่ได้ทำให้ส่งฟรี เพราะเงื่อนไขดูจากยอดซื้อสินค้าก่อนบวกค่าส่ง"
    answer: "ต้องจ่าย 530 บาท"
  - type: worked-example
    title: เลือกอัลกอริทึมทายตัวเลข
    problem: "เพื่อนคิดเลข 1 ถึง 100 ไว้ ทุกครั้งที่ทาย เพื่อนจะบอก ถูก มากไป หรือ น้อยไป วิธีที่ 1 ทาย 1, 2, 3, … ไปเรื่อย ๆ วิธีที่ 2 ทายเลขกลางของช่วงที่เหลือทุกครั้ง แต่ละวิธีต้องทายมากที่สุดกี่ครั้ง ควรเลือกวิธีใด"
    steps:
      - text: "วิธีที่ 1 ถ้าเพื่อนคิด 100 ต้องทายครบ 100 ครั้ง"
        why: "เปรียบเทียบอัลกอริทึมต้องดูกรณีที่แย่ที่สุด ไม่ใช่กรณีโชคดีที่ทายครั้งแรกถูก"
      - text: "วิธีที่ 2 ทายแต่ละครั้งตัดตัวเลขที่เหลือได้ประมาณครึ่งหนึ่ง: 100 → 50 → 25 → 12 → 6 → 3 → 1"
      - text: "ไล่จริงทุกตัวเลขพบว่าวิธีที่ 2 ใช้มากที่สุด 7 ครั้ง"
        why: "ทาย k ครั้งแยกตัวเลขได้ไม่เกิน 1 + 2 + 4 + … ตัว ซึ่ง 7 ครั้งครอบคลุมได้ 127 ตัว พอสำหรับ 100"
      - text: "ทั้งสองวิธีหาเลขได้ถูกเสมอ แต่วิธีที่ 2 ใช้ครั้งน้อยกว่ามาก"
    answer: "วิธีที่ 1 มากที่สุด 100 ครั้ง วิธีที่ 2 มากที่สุด 7 ครั้ง ควรเลือกวิธีที่ 2"
  - { type: check, problem: computer.algorithms.logical-reasoning.p010, prompt: "ใช้แนวคิดตัดตัวเลือกทิ้งให้ได้มากที่สุดต่อครั้ง" }
glossary:
  - { term: เหตุผลเชิงตรรกะ (logical reasoning), definition: "การใช้ข้อเท็จจริงและกฎที่เป็นจริงหาข้อสรุปทีละขั้นอย่างมีเหตุผล" }
  - { term: เงื่อนไข (condition), definition: "ข้อความที่เป็นได้แค่จริงหรือเท็จ ใช้ตัดสินว่าจะทำคำสั่งใด" }
  - { term: และ (AND), definition: "เชื่อมเงื่อนไข ผลเป็นจริงเมื่อเงื่อนไขทั้งสองเป็นจริง" }
  - { term: หรือ (OR), definition: "เชื่อมเงื่อนไข ผลเป็นจริงเมื่อเงื่อนไขอย่างน้อยหนึ่งเป็นจริง" }
  - { term: กรณีที่แย่ที่สุด (worst case), definition: "สถานการณ์ที่อัลกอริทึมต้องใช้ขั้นมากที่สุด ใช้เปรียบเทียบอัลกอริทึมอย่างยุติธรรม" }
flashcards:
  - { front: "ถ้าฝนตก แล้วสนามเปียก เห็นสนามเปียก สรุปว่าฝนตกได้หรือไม่", back: "ไม่ได้ สนามอาจเปียกจากเหตุอื่น เช่น รดน้ำ" }
  - { front: "และ กับ หรือ ต่างกันอย่างไร", back: "และ ต้องจริงทั้งสองเงื่อนไข หรือ จริงอย่างน้อยหนึ่งเงื่อนไขก็พอ" }
  - { front: "หาเหรียญปลอมที่หนักกว่าใน 9 เหรียญด้วยตาชั่งสองแขน ใช้น้อยที่สุดกี่ครั้ง", back: "2 ครั้ง แบ่งเป็น 3 กลุ่ม กลุ่มละ 3 เหรียญ" }
  - { front: "เกณฑ์เปรียบเทียบอัลกอริทึม", back: "ถูกต้องทุกกรณี ใช้ขั้นน้อย (ดูกรณีแย่ที่สุด) และง่ายหรือปลอดภัย" }
