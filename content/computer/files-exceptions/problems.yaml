  - id: computer.programming.files-exceptions.p016
    topics: [computer.programming.files-exceptions]
    difficulty: 4
    type: code
    stem: |
      เขียนฟังก์ชัน `save_and_load(rows)` ที่รับลิสต์ของลิสต์ (แต่ละลิสต์คือหนึ่งแถวของตาราง) เขียนลงข้อความ CSV ในหน่วยความจำด้วย `io.StringIO` แล้วอ่านกลับเป็นลิสต์ของแถวด้วย `csv.reader` และ **คืนค่า** ผลลัพธ์นั้น ถ้า rows ว่างให้คืน `[]`
    starter: |
      import csv
      import io

      def save_and_load(rows):
          pass
    tests: |
      r = save_and_load([["ชื่อ", "คะแนน"], ["ฟ้า", "18"], ["ต้น", "12"]])
      assert r is not None, "ยังไม่ได้คืนค่า (ได้ None) ต้องใช้ return"
      assert r == [["ชื่อ", "คะแนน"], ["ฟ้า", "18"], ["ต้น", "12"]], f"อ่านกลับไม่ตรงกับที่เขียน ได้ {r}"
      assert save_and_load([]) == [], f"rows ว่างควรคืน [] แต่ได้ {save_and_load([])}"
      assert save_and_load([["a,b", "c"]]) == [["a,b", "c"]], "ค่าที่มีจุลภาคต้องถูกเก็บในเครื่องหมายคำพูดและอ่านกลับได้ตรงเดิม"
    reference: |
      import csv
      import io

      def save_and_load(rows):
          buf = io.StringIO()
          writer = csv.writer(buf)
          writer.writerows(rows)
          buf.seek(0)
          return list(csv.reader(buf))
    hints:
      - "สร้าง `io.StringIO()` แล้วส่งให้ `csv.writer` เขียน และ `writerows` เขียนทั้งลิสต์ได้ทีเดียว"
      - "หลังเขียนต้องเรียก `seek(0)` ก่อนส่งให้ `csv.reader` อ่าน"
    solution: "สร้างบัฟเฟอร์ เขียนด้วย csv.writer แล้ว seek(0) และคืน list(csv.reader(buf)) เครื่องหมายคำพูดของค่าที่มีจุลภาคจะถูกจัดการโดย csv โดยอัตโนมัติ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.files-exceptions.p017
    topics: [computer.programming.files-exceptions]
    difficulty: 5
    type: code
    stem: |
      ฝ่ายบัญชีร้านกาแฟมีข้อความ CSV ของยอดขายที่มีหัวตารางเป็น `item,qty,price` บางแถวอาจเสียจนอ่านจำนวนหรือราคาไม่ได้ เขียนฟังก์ชัน `sum_sales(text)` ที่คำนวณยอดรวมจาก qty × price ของแถวที่ถูกต้อง และนับจำนวนแถวที่เสียโดยไม่หยุดโปรแกรม ให้ **คืนค่า** เป็นทูเพิล `(ยอดรวม, จำนวนแถวที่เสีย)` โดยจับเฉพาะ `ValueError` และ `TypeError` ที่เกิดจากการแปลงค่า
    starter: |
      import csv
      import io

      def sum_sales(text):
          pass
    tests: |
      text = "item,qty,price\nลาเต้,2,65\nครัวซองต์,1,45\nน้ำส้ม,x,25\nชา,3,\nกาแฟดำ,2\n"
      r = sum_sales(text)
      assert r is not None, "ยังไม่ได้คืนค่า (ได้ None) ต้องใช้ return"
      assert r == (175, 3), f"ควรได้ (175, 3) คือยอดรวมของแถวที่ถูกและจำนวนแถวเสีย 3 แถว แต่ได้ {r}"
      assert sum_sales("item,qty,price\n") == (0, 0), f"ไม่มีแถวข้อมูลควรได้ (0, 0) แต่ได้ {sum_sales('item,qty,price' + chr(10))}"
      assert sum_sales("item,qty,price\nชา,4,10\n") == (40, 0), "แถวเดียวที่ถูกต้องควรได้ (40, 0)"
    reference: |
      import csv
      import io

      def sum_sales(text):
          total = 0
          bad = 0
          for row in csv.DictReader(io.StringIO(text)):
              try:
                  total += int(row["qty"]) * int(row["price"])
              except (ValueError, TypeError):
                  bad += 1
          return (total, bad)
    hints:
      - "อ่านด้วย `csv.DictReader` แล้วดึง qty และ price ของแต่ละแถวด้วยชื่อคอลัมน์"
      - "ห่อการแปลงด้วย `try` และจับ `ValueError` กับ `TypeError` เพราะช่องว่าง `\"\"` ทำให้ int() เกิด ValueError ส่วนแถวที่มีช่องไม่ครบจะได้ค่า None ซึ่งทำให้เกิด TypeError"
      - "นับแถวที่เสียในตัวแปรแยกต่างหาก และคืนทูเพิลเมื่อวนครบทั้งหมด"
    solution: "วนแถวด้วย DictReader ใน try แปลง qty กับ price ด้วย int() แล้วคูณรวม ถ้าเกิด ValueError หรือ TypeError นับเป็นแถวเสีย ผลได้ 2×65 + 1×45 = 175 และมีสามแถวเสีย (น้ำส้มจำนวนเป็น x ชาไม่มีราคา และกาแฟดำมีช่องไม่ครบ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.files-exceptions.p018
    topics: [computer.programming.files-exceptions]
    difficulty: 5
    type: code
    stem: |
      ระบบบันทึกคะแนนต้องรับค่าเป็นข้อความ เขียนคลาสข้อยกเว้น `ScoreError` ที่สืบทอดจาก `ValueError` และฟังก์ชัน `parse_score(text)` ที่แปลงข้อความเป็นจำนวนเต็ม แล้ว **คืนค่า** ถ้าข้อความไม่ใช่จำนวนเต็มให้โยน `ScoreError` พร้อมข้อความที่มีข้อความนั้น และถ้าค่าอยู่นอกช่วง 0 ถึง 100 ให้โยน `ScoreError` พร้อมข้อความที่บอกค่าที่ได้
    starter: |
      class ScoreError(ValueError):
          pass

      def parse_score(text):
          pass
    tests: |
      assert parse_score("18") == 18, f"parse_score('18') ควรได้ 18 แต่ได้ {parse_score('18')}"
      assert parse_score("100") == 100, "ขอบบน 100 ต้องรับได้"
      def expect_error(text):
          try:
              parse_score(text)
          except ScoreError as e:
              return str(e)
          raise AssertionError(f"parse_score({text!r}) ควรโยน ScoreError แต่ไม่โยน")
      msg = expect_error("abc")
      assert "abc" in msg, f"ข้อความข้อยกเว้นควรบอกข้อความที่ผิด แต่ได้ {msg!r}"
      msg2 = expect_error("120")
      assert "120" in msg2, f"ข้อความข้อยกเว้นควรบอกค่าที่เกินช่วง แต่ได้ {msg2!r}"
      assert isinstance(ScoreError("x"), ValueError), "ScoreError ต้องสืบทอดจาก ValueError"
    reference: |
      class ScoreError(ValueError):
          pass

      def parse_score(text):
          try:
              value = int(text)
          except ValueError:
              raise ScoreError(f"ไม่ใช่จำนวนเต็ม: {text!r}") from None
          if not 0 <= value <= 100:
              raise ScoreError(f"คะแนนต้องอยู่ระหว่าง 0 ถึง 100 แต่ได้ {value}")
          return value
    hints:
      - "ใช้ `try` กับ `int(text)` และจับเฉพาะ `ValueError` ที่เกิดจากการแปลง"
      - "ในบล็อก except ให้ `raise ScoreError(...)` พร้อมข้อความที่มีค่าที่ผิด ส่วนการตรวจช่วงทำหลังแปลงสำเร็จ"
    solution: "class ScoreError(ValueError) แล้วใน parse_score ใช้ try int(text) except ValueError raise ScoreError(f\"...{text!r}\") จากนั้นตรวจ 0 <= value <= 100 แล้วคืน value"
    license: CC-BY-SA-4.0
    ai_assisted: true
