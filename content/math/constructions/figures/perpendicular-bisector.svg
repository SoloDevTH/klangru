<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="sans-serif" font-size="16">
  <title>การสร้างเส้นแบ่งครึ่งตั้งฉากของ AB</title>
  <rect x="0" y="0" width="720" height="360" fill="#ffffff"/>
  <line x1="170.0" y1="200.0" x2="430.0" y2="200.0" stroke="#15211e" stroke-width="3" stroke-linecap="round"/>
  <path d="M 274.4 334.2 A 170.0 170.0 0 0 0 274.4 65.8" fill="none" stroke="#1d4ed8" stroke-width="1.8"/>
  <path d="M 325.6 65.8 A 170.0 170.0 0 0 0 325.6 334.2" fill="none" stroke="#c2410c" stroke-width="1.8"/>
  <line x1="300.0" y1="65.5" x2="300.0" y2="334.5" stroke="#0a6b60" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="170.0" cy="200.0" r="4.5" fill="#15211e" stroke="#15211e" stroke-width="1"/>
  <circle cx="430.0" cy="200.0" r="4.5" fill="#15211e" stroke="#15211e" stroke-width="1"/>
  <circle cx="300.0" cy="90.5" r="4.5" fill="#15211e" stroke="#15211e" stroke-width="1"/>
  <circle cx="300.0" cy="309.5" r="4.5" fill="#15211e" stroke="#15211e" stroke-width="1"/>
  <circle cx="300.0" cy="200.0" r="4.5" fill="#15211e" stroke="#15211e" stroke-width="1"/>
  <text x="154.0" y="206.0" font-size="17" text-anchor="middle" fill="#15211e" font-weight="bold">A</text>
  <text x="446.0" y="206.0" font-size="17" text-anchor="middle" fill="#15211e" font-weight="bold">B</text>
  <text x="316.0" y="84.5" font-size="17" text-anchor="middle" fill="#15211e" font-weight="bold">P</text>
  <text x="316.0" y="325.5" font-size="17" text-anchor="middle" fill="#15211e" font-weight="bold">Q</text>
  <text x="284.0" y="222.0" font-size="17" text-anchor="middle" fill="#15211e" font-weight="bold">M</text>
  <polyline points="312.0,200.0 312.0,188.0 300.0,188.0" fill="none" stroke="#15211e" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="480.0" y="100.0" font-size="15" text-anchor="start" fill="#15211e">1. กางวงเวียนเกินครึ่งของ AB</text>
  <text x="480.0" y="134.0" font-size="15" text-anchor="start" fill="#15211e">2. เขียนส่วนโค้งจาก A และจาก B</text>
  <text x="480.0" y="168.0" font-size="15" text-anchor="start" fill="#15211e">    ด้วยรัศมีเดิม ตัดกันที่ P และ Q</text>
  <text x="480.0" y="202.0" font-size="15" text-anchor="start" fill="#15211e">3. ลาก PQ ตัด AB ที่ M</text>
  <text x="480.0" y="236.0" font-size="15" text-anchor="start" fill="#0a6b60" font-weight="bold">AM = MB และ PQ ⟂ AB</text>
</svg>
