<text x="265.0" y="133.0" font-size="14" text-anchor="start" fill="#1f4e9c" font-weight="normal">shàngbian · บน</text>
<text x="265.0" y="326.0" font-size="20" text-anchor="start" fill="#1a1a1a" font-weight="bold">下边</text>
<text x="265.0" y="345.0" font-size="14" text-anchor="start" fill="#1f4e9c" font-weight="normal">xiàbian · ล่าง ใต้</text>
<text x="110.0" y="167.0" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="bold">左边</text>
<text x="110.0" y="186.0" font-size="14" text-anchor="middle" fill="#1f4e9c" font-weight="normal">zuǒbian · ซ้าย</text>
<text x="360.0" y="167.0" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="bold">右边</text>
<text x="360.0" y="186.0" font-size="14" text-anchor="middle" fill="#1f4e9c" font-weight="normal">yòubian · ขวา</text>
<text x="235.0" y="252.0" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="bold">里边</text>
<text x="235.0" y="271.0" font-size="14" text-anchor="middle" fill="#1f4e9c" font-weight="normal">lǐbian · ใน</text>
