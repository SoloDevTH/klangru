  ai_assisted: true
- id: chinese.vocab.daily-life-topics.p007
  topics:
  - chinese.vocab.daily-life-topics
  difficulty: 3
  type: mcq
  stem: ดูตารางเรียน 星期三第三节是什么课？
  figure: &id001
    src: timetable.svg
    alt: 'ตารางเรียนสมมติ 课程表 ของห้อง ม.2/1 คาบละหนึ่งชั่วโมง 第一节 8:30 第二节 9:30 第三节 10:30 พักกินข้าว 午饭 12:00–13:00 และ 第四节 13:00 · 星期一: 数学 英语 汉语 体育 · 星期二: 汉语 科学 数学 音乐 · 星期三: 英语 数学 历史 美术 · 星期四: 科学 汉语 英语 体育 · 星期五: 数学 历史 汉语 音乐 (เรียงจากคาบ 1 ถึงคาบ 4)'
    caption: ตารางเรียนสมมติ
  choices:
  - id: a
    text: 历史课
    correct: true
    feedback: ถูก วันพุธคาบที่ 3 เป็นวิชาประวัติศาสตร์
  - id: b
    text: 数学课
    feedback: 数学 เป็นคาบที่ 2 ของวันพุธ
  - id: c
    text: 汉语课
    feedback: 汉语 อยู่คาบที่ 3 ของวันจันทร์และวันศุกร์ ไม่ใช่วันพุธ
  - id: d
    text: 美术课
    feedback: 美术 เป็นคาบที่ 4 (ตอนบ่าย) ของวันพุธ
  hints:
  - 星期三 = วันพุธ (คอลัมน์ที่ 3)
  - 第三节 = คาบที่ 3 (เวลา 10:30)
  solution: คอลัมน์ 星期三 แถว 第三节 คือ **历史** (ประวัติศาสตร์)
  license: CC-BY-SA-4.0
  ai_assisted: true
