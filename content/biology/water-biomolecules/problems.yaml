problems:
  - id: biology.molecules.water-biomolecules.p001
    topics: [biology.molecules.water-biomolecules]
    difficulty: 1
    type: mcq
    stem: "ธาตุใดมีมากที่สุดเมื่อคิดเป็นร้อยละโดยมวลของร่างกายมนุษย์"
    choices:
      - { id: a, text: "ออกซิเจน", correct: true }
      - { id: b, text: "คาร์บอน", feedback: "คาร์บอนเป็นแกนของสารชีวโมเลกุล แต่มีราวร้อยละ 18.5 น้อยกว่าออกซิเจนซึ่งอยู่ในน้ำที่มีมากในร่างกาย" }
      - { id: c, text: "ไฮโดรเจน", feedback: "ไฮโดรเจนมีจำนวนอะตอมมากที่สุด แต่อะตอมเบามาก จึงคิดเป็นมวลเพียงราวร้อยละ 9.5" }
      - { id: d, text: "แคลเซียม", feedback: "แคลเซียมมีมากในกระดูก แต่รวมทั้งร่างกายราวร้อยละ 1.5 ของมวลเท่านั้น" }
    hints:
      - "สารใดมีมากที่สุดในร่างกาย"
      - "น้ำประกอบด้วยธาตุใดที่หนักที่สุด"
    solution: "ร่างกายมีน้ำราว 60% และออกซิเจนเป็นมวลส่วนใหญ่ของน้ำ ออกซิเจนจึงมีมากที่สุดราวร้อยละ 65 โดยมวล ตามด้วยคาร์บอนราว 18.5 และไฮโดรเจนราว 9.5"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.molecules.water-biomolecules.p002
    topics: [biology.molecules.water-biomolecules]
    difficulty: 1
    type: match
    stem: "จับคู่สารชีวโมเลกุลกับหน่วยย่อยที่ต่อกันเป็นสารนั้น"
    pairs:
      - { left: "แป้งและไกลโคเจน", right: "มอโนแซ็กคาไรด์ (กลูโคส)" }
      - { left: "โปรตีน", right: "กรดอะมิโน" }
      - { left: "DNA และ RNA", right: "นิวคลีโอไทด์" }
      - { left: "ไตรกลีเซอไรด์", right: "กลีเซอรอลและกรดไขมัน" }
    hints:
      - "ชื่อหน่วยย่อยของโปรตีนมีคำว่า อะมิโน"
      - "กรดนิวคลิอิกประกอบด้วยหน่วยที่มีฟอสเฟต น้ำตาล และเบส"
    solution: "แป้งและไกลโคเจน → กลูโคส (มอโนแซ็กคาไรด์), โปรตีน → กรดอะมิโน, DNA และ RNA → นิวคลีโอไทด์, ไตรกลีเซอไรด์ → กลีเซอรอล 1 โมเลกุลกับกรดไขมัน 3 โมเลกุล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.molecules.water-biomolecules.p003
    topics: [biology.molecules.water-biomolecules]
    difficulty: 2
    type: mcq
    stem: "ทำไมน้ำแข็งจึงลอยบนน้ำ"
    choices:
      - { id: a, text: "พันธะไฮโดรเจนจัดโมเลกุลน้ำในน้ำแข็งเป็นโครงร่างที่โปร่ง น้ำแข็งจึงมีความหนาแน่นน้อยกว่าน้ำ", correct: true }
      - { id: b, text: "น้ำแข็งมีอากาศอยู่ข้างในเสมอ", feedback: "น้ำแข็งใสที่ไม่มีฟองอากาศก็ยังลอย เหตุผลอยู่ที่การจัดเรียงโมเลกุลด้วยพันธะไฮโดรเจน" }
      - { id: c, text: "โมเลกุลน้ำในน้ำแข็งเบากว่าโมเลกุลน้ำในของเหลว", feedback: "โมเลกุลน้ำมีมวลเท่ากันทุกสถานะ ต่างกันที่ระยะห่างระหว่างโมเลกุล" }
      - { id: d, text: "พันธะโคเวเลนต์ O–H ในน้ำแข็งยาวขึ้น", feedback: "พันธะภายในโมเลกุลแทบไม่เปลี่ยน สิ่งที่เปลี่ยนคือการจัดเรียงระหว่างโมเลกุล" }
    hints:
      - "สิ่งที่ลอยต้องมีความหนาแน่นน้อยกว่าของเหลวที่อยู่ล่าง"
      - "เมื่อน้ำแข็งตัว พันธะไฮโดรเจนจัดโมเลกุลให้อยู่ห่างกันอย่างเป็นระเบียบ"
    solution: "ในน้ำแข็ง โมเลกุลน้ำแต่ละโมเลกุลยึดกับเพื่อนบ้าน 4 โมเลกุลด้วยพันธะไฮโดรเจนเป็นโครงร่างหกเหลี่ยมที่มีช่องว่าง น้ำแข็งจึงหนาแน่นน้อยกว่าน้ำ (ราว 0.92 เทียบกับ 1.00 กรัมต่อลูกบาศก์เซนติเมตร) และลอยได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.molecules.water-biomolecules.p004
    topics: [biology.molecules.water-biomolecules]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นพอลิแซ็กคาไรด์ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "แป้งในข้าว", correct: true }
      - { id: b, text: "ไกลโคเจนในตับ", correct: true }
      - { id: c, text: "เซลลูโลสในผนังเซลล์พืช", correct: true }
      - { id: d, text: "ซูโครสในน้ำตาลทราย", feedback: "ซูโครสเป็นไดแซ็กคาไรด์ เกิดจากน้ำตาลเพียง 2 โมเลกุล (กลูโคสกับฟรักโทส)" }
      - { id: e, text: "กลูโคส", feedback: "กลูโคสเป็นมอโนแซ็กคาไรด์ คือหน่วยย่อยที่ต่อกันเป็นพอลิแซ็กคาไรด์" }
    hints:
      - "พอลิ แปลว่า มาก"
      - "พอลิแซ็กคาไรด์เกิดจากกลูโคสหลายร้อยถึงหลายพันหน่วยต่อกัน"
    solution: "แป้ง ไกลโคเจน และเซลลูโลส ล้วนเป็นพอลิเมอร์ของกลูโคสจำนวนมาก ต่างกันที่รูปแบบการต่อและการแตกกิ่ง ซูโครสเป็นไดแซ็กคาไรด์ และกลูโคสเป็นมอโนแซ็กคาไรด์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.molecules.water-biomolecules.p005
    topics: [biology.molecules.water-biomolecules]
    difficulty: 2
    type: text
    stem: "กระทรวงสาธารณสุขกำหนดให้เติมธาตุชนิดหนึ่งในเกลือบริโภคและน้ำปลา เพื่อป้องกันโรคคอพอก เพราะร่างกายใช้ธาตุนี้สร้างฮอร์โมนไทรอกซิน ธาตุนี้คืออะไร"
    accepted: ["ไอโอดีน", "I", "iodine"]
    hints:
      - "เกลือชนิดนี้มักเขียนบนถุงว่า เกลือเสริม..."
      - "ธาตุนี้อยู่ในหมู่เดียวกับคลอรีน"
    misconceptions:
      - { match: "เหล็ก", feedback: "การขาดเหล็กทำให้เป็นโลหิตจาง ส่วนโรคคอพอกเกิดจากขาดธาตุที่ใช้สร้างฮอร์โมนของต่อมไทรอยด์" }
      - { match: "แคลเซียม", feedback: "แคลเซียมใช้สร้างกระดูกและฟัน ไม่ได้ใช้สร้างไทรอกซิน" }
    solution: "ไอโอดีน (I) ต่อมไทรอยด์ใช้ไอโอดีนสร้างฮอร์โมนไทรอกซิน เมื่อขาดไอโอดีน ต่อมไทรอยด์จะโตขึ้นเป็นโรคคอพอก จึงต้องเติมไอโอดีนในเกลือบริโภค"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.molecules.water-biomolecules.p006
    topics: [biology.molecules.water-biomolecules]
    difficulty: 2
    type: numeric
    stem: "พอลิเพปไทด์สายหนึ่งประกอบด้วยกรดอะมิโน 150 หน่วยต่อกันเป็นสายตรง มีพันธะเพปไทด์กี่พันธะ (ตอบเป็นจำนวน)"
    answer: { value: 149, unit: พันธะ }
    hints:
      - "ลองนับกรณีเล็ก ๆ ก่อน กรดอะมิโน 2 หน่วยมีพันธะกี่พันธะ 3 หน่วยมีกี่พันธะ"
      - "พันธะอยู่ระหว่างหน่วยที่ติดกัน"
    misconceptions:
      - { match: 150, feedback: "พันธะอยู่ระหว่างกรดอะมิโนที่อยู่ติดกัน สายตรง n หน่วยจึงมีพันธะ n − 1 พันธะ ไม่ใช่ n" }
      - { match: 300, feedback: "แต่ละพันธะเพปไทด์เชื่อมกรดอะมิโน 2 หน่วย แต่ไม่ได้ต้องใช้ 2 พันธะต่อหน่วย" }
    solution: "กรดอะมิโน 2 หน่วยมีพันธะ 1 พันธะ 3 หน่วยมี 2 พันธะ สายตรง $n$ หน่วยจึงมี $n - 1$ พันธะ ได้ $150 - 1 = 149$ พันธะ และการสร้างสายนี้ให้น้ำ 149 โมเลกุลด้วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.molecules.water-biomolecules.p007
    topics: [biology.molecules.water-biomolecules]
    difficulty: 3
    type: numeric
    stem: "มอลโทสเกิดจากกลูโคส 2 โมเลกุลต่อกันด้วยปฏิกิริยาควบแน่น ถ้ากลูโคสมีมวลโมเลกุล 180.16 และน้ำมีมวลโมเลกุล 18.02 มอลโทสมีมวลโมเลกุลเท่าใด (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 342.30, tolerance: 0.05 }
    hints:
      - "ปฏิกิริยาควบแน่นให้อะไรออกมาด้วย"
      - "รวมมวลกลูโคส 2 โมเลกุล แล้วหักมวลของน้ำที่ออกไป 1 โมเลกุล"
    misconceptions:
      - { match: 360.32, feedback: "นี่คือมวลของกลูโคส 2 โมเลกุลรวมกัน ยังไม่ได้หักน้ำ 1 โมเลกุลที่ออกไปเมื่อสร้างพันธะไกลโคซิดิก" }
      - { match: 378.34, feedback: "การต่อน้ำตาลทำให้น้ำออกไป ไม่ได้เพิ่มน้ำเข้ามา ต้องลบ 18.02 ไม่ใช่บวก" }
    solution: "$2 \\times 180.16 - 18.02 = 360.32 - 18.02 = 342.30$ ตรงกับสูตร $\\mathrm{C_{12}H_{22}O_{11}}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.molecules.water-biomolecules.p008
    topics: [biology.molecules.water-biomolecules]
    difficulty: 3
    type: numeric
    stem: "DNA สายคู่จากแบคทีเรียชนิดหนึ่งมีเบสอะดีนีน (A) ร้อยละ 30 ของเบสทั้งหมด จะมีเบสกัวนีน (G) ร้อยละเท่าใด"
    answer: { value: 20, unit: "%" }
    hints:
      - "ใน DNA สายคู่ A จับคู่กับ T และ G จับคู่กับ C"
      - "หา A + T ก่อน แล้วแบ่งส่วนที่เหลือให้ G กับ C เท่า ๆ กัน"
    misconceptions:
      - { match: 30, feedback: "A เท่ากับ T ไม่ใช่ G เบสที่จับคู่กันเท่านั้นจึงมีปริมาณเท่ากัน" }
      - { match: 40, feedback: "40 คือ G กับ C รวมกัน ต้องแบ่งครึ่งเพราะ G เท่ากับ C" }
      - { match: 70, feedback: "70 คือ 100 − 30 ซึ่งยังรวม T ไว้ด้วย ต้องหัก T ที่เท่ากับ A ออกอีก" }
    solution: "T = A = 30% รวม A + T = 60% ที่เหลือ G + C = 40% และ G = C จึงได้ G = 20%"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.molecules.water-biomolecules.p009
    topics: [biology.molecules.water-biomolecules]
    difficulty: 3
    type: mcq
    stem: "ในช่วงหน้าหนาวที่เชียงใหม่ น้ำมันมะพร้าวในขวดกลายเป็นไขสีขาว แต่น้ำมันถั่วเหลืองยังใสเป็นของเหลว ข้อใดอธิบายได้ดีที่สุด"
    choices:
      - { id: a, text: "น้ำมันมะพร้าวมีกรดไขมันอิ่มตัวมาก สายกรดไขมันตรงจึงเรียงชิดกันและแข็งตัวง่าย ส่วนน้ำมันถั่วเหลืองมีกรดไขมันไม่อิ่มตัวมากที่สายหักงอ", correct: true }
      - { id: b, text: "น้ำมันมะพร้าวมีน้ำปนอยู่ จึงแข็งตัวเป็นน้ำแข็ง", feedback: "ไขที่เห็นคือลิพิดแข็งตัว ไม่ใช่น้ำ น้ำแข็งตัวที่ 0 องศาเซลเซียส ซึ่งอากาศหนาวในเชียงใหม่ไม่ได้เย็นขนาดนั้น" }
      - { id: c, text: "น้ำมันถั่วเหลืองมีกรดไขมันอิ่มตัวมากกว่า จึงยังเป็นของเหลว", feedback: "กลับกัน กรดไขมันอิ่มตัวทำให้แข็งตัวง่าย กรดไขมันไม่อิ่มตัวที่มีพันธะคู่ทำให้เป็นของเหลว" }
      - { id: d, text: "น้ำมันมะพร้าวเป็นคาร์โบไฮเดรต ไม่ใช่ลิพิด", feedback: "น้ำมันมะพร้าวเป็นไตรกลีเซอไรด์ซึ่งเป็นลิพิดเหมือนน้ำมันถั่วเหลือง" }
    hints:
      - "นึกถึงความต่างระหว่างกรดไขมันอิ่มตัวกับไม่อิ่มตัว"
      - "พันธะคู่ทำให้สายกรดไขมันหักงอ เรียงชิดกันไม่ได้"
    solution: "กรดไขมันอิ่มตัวไม่มีพันธะคู่ สายตรงเรียงชิดกันได้ดี จุดหลอมเหลวจึงสูง น้ำมันมะพร้าวมีกรดไขมันอิ่มตัวมากจึงแข็งตัวเมื่ออากาศเย็นราว 20 องศาเซลเซียส ส่วนน้ำมันถั่วเหลืองมีกรดไขมันไม่อิ่มตัวมาก สายหักงอ จึงยังเป็นของเหลว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.molecules.water-biomolecules.p010
    topics: [biology.molecules.water-biomolecules]
    difficulty: 3
    type: mcq
    stem: "ทำไมฟอสโฟลิพิดจึงเรียงตัวเป็นสองชั้นในเยื่อหุ้มเซลล์"
    choices:
      - { id: a, text: "หัวที่มีหมู่ฟอสเฟตชอบน้ำจึงหันออกหาน้ำทั้งด้านนอกและด้านในเซลล์ ส่วนหางกรดไขมันไม่ชอบน้ำจึงหันเข้าหากันตรงกลาง", correct: true }
      - { id: b, text: "ฟอสโฟลิพิดทั้งโมเลกุลชอบน้ำ จึงละลายน้ำเป็นสองชั้น", feedback: "ถ้าทั้งโมเลกุลชอบน้ำก็จะละลายไปในน้ำ ไม่เรียงเป็นชั้น หางกรดไขมันไม่ชอบน้ำ" }
      - { id: c, text: "ฟอสโฟลิพิดเชื่อมกันด้วยพันธะเพปไทด์", feedback: "พันธะเพปไทด์อยู่ในโปรตีน ฟอสโฟลิพิดอยู่รวมกันด้วยแรงที่หางไม่ชอบน้ำหลบน้ำ" }
      - { id: d, text: "หางกรดไขมันชอบน้ำจึงหันออกนอก", feedback: "หางกรดไขมันเป็นสายไฮโดรคาร์บอนที่ไม่มีขั้ว จึงไม่ชอบน้ำ" }
    hints:
      - "ทั้งภายนอกและภายในเซลล์มีน้ำ"
      - "ส่วนใดของฟอสโฟลิพิดชอบน้ำ ส่วนใดไม่ชอบน้ำ"
    solution: "ฟอสโฟลิพิดมีหัวมีขั้วที่ชอบน้ำ และหางกรดไขมัน 2 สายที่ไม่ชอบน้ำ เมื่ออยู่ในน้ำ หัวจะหันออกหาน้ำทั้งสองด้าน หางหลบน้ำเข้าหากันตรงกลาง เกิดเป็นชั้นฟอสโฟลิพิดสองชั้นของเยื่อหุ้มเซลล์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.molecules.water-biomolecules.p011
    topics: [biology.molecules.water-biomolecules]
    difficulty: 3
    type: numeric
