id: biology.plants.plant-transport
subject: biology
title: { th: การแลกเปลี่ยนแก๊สและการลำเลียงในพืช, en: "Gas exchange and transport in plants" }
summary: ความจำเป็นของระบบลำเลียง ปากใบและเซลล์คุม การแลกเปลี่ยนแก๊ส การคายน้ำและโพโทมิเตอร์ กลไกการลำเลียงน้ำและธาตุอาหาร ธาตุอาหารที่จำเป็น และการลำเลียงอาหารทางโฟลเอ็ม
difficulty: 5.5
minutes: 50
prerequisites: [biology.plants.plant-structure, biology.cells.membrane-transport, biology.plants.transport-nutrients]
encompasses:
  - { id: biology.plants.transport-nutrients, weight: 0.3 }
  - { id: biology.cells.membrane-transport, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: เซลล์คุมเมื่อปากใบเปิดและปิด
    src: stomata.svg
    alt: "ภาพ 2 ช่อง ช่อง ก. ปากใบเปิด เซลล์คุมสองเซลล์รูปไตสีเขียวโป่งออก ผนังด้านที่ติดช่องปากใบหนาสีเขียวเข้ม ตรงกลางมีช่องปากใบเปิดกว้าง ลูกศรสีน้ำเงิน H₂O ชี้เข้าเซลล์คุมจากสองข้าง ข้อความ K⁺ เข้าเซลล์คุม → น้ำเข้าโดยออสโมซิส เซลล์เต่ง ผนังด้านในหนาจึงโค้งออก ช่อง ข. ปากใบปิด เซลล์คุมแฟบ ผนังด้านในชิดกัน ลูกศรสีส้ม H₂O ชี้ออกจากเซลล์คุม ข้อความ K⁺ ออกจากเซลล์คุม → น้ำออก เซลล์เหี่ยว ช่องปากใบปิด"
    caption: "ผนังด้านในที่หนาและยืดได้น้อยทำให้เซลล์คุมโค้งออกเมื่อเต่ง (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: worked-example
    title: หาอัตราการดูดน้ำจากโพโทมิเตอร์
    problem: "โพโทมิเตอร์มีหลอดแก้วรัศมีภายใน 0.4 mm ฟองอากาศเคลื่อนที่ 50 mm ใน 5 นาที หาอัตราการดูดน้ำเป็น mm³ ต่อนาที"
    steps:
      - text: "อัตราการเคลื่อนของฟองอากาศ $= 50 \\div 5 = 10$ mm/min"
      - text: "พื้นที่หน้าตัดของหลอด $= \\pi r^2 = \\pi (0.4)^2 \\approx 0.503\\ \\mathrm{mm^2}$"
        why: "น้ำที่หายไปจากหลอดเป็นทรงกระบอก ปริมาตร = พื้นที่หน้าตัด × ความยาว"
      - text: "อัตราการดูดน้ำ $= 0.503 \\times 10 \\approx 5.03\\ \\mathrm{mm^3/min}$"
    answer: "ประมาณ 5.03 mm³ ต่อนาที ซึ่งใกล้เคียงอัตราการคายน้ำของกิ่งนั้น"
  - { type: check, problem: biology.plants.plant-transport.p008, prompt: "ใช้ขั้นตอนเดียวกันกับข้อมูลชุดนี้" }
  - type: figure
    title: สมมติฐานการไหลเนื่องจากความดัน
    src: pressure-flow.svg
    alt: "แผนภาพท่อสองท่อแนวตั้ง ท่อซ้ายคือไซเลม มีลูกศรสีน้ำเงินชี้ขึ้น ท่อขวาคือโฟลเอ็ม (ซีฟทิวบ์) มีลูกศรสีส้มชี้ลง ด้านบนขวามีกล่องแหล่งสร้าง (ใบ) ซูโครสถูกลำเลียงแบบใช้พลังงานเข้าโฟลเอ็ม ลูกศรชี้จากกล่องเข้าโฟลเอ็มด้านบน ลูกศรสีน้ำเงินจากไซเลมเข้าโฟลเอ็มด้านบน ข้อความ น้ำเข้าโดยออสโมซิส และป้าย ความดันสูง ด้านล่างขวามีกล่องแหล่งรับ (ราก ผล) ซูโครสออกจากโฟลเอ็มไปใช้หรือเก็บเป็นแป้ง ลูกศรสีน้ำเงินจากโฟลเอ็มกลับไปไซเลมด้านล่าง ข้อความ น้ำออกกลับสู่ไซเลม และป้าย ความดันต่ำ ใต้ภาพ สารละลายในโฟลเอ็มไหลทั้งก้อนจากที่ความดันสูงไปที่ความดันต่ำ ส่วนน้ำในไซเลมถูกดึงขึ้นด้วยแรงจากการคายน้ำ"
    caption: "แหล่งรับอาจอยู่สูงกว่าแหล่งสร้างก็ได้ เช่น ยอดอ่อนหรือผลบนกิ่ง (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ใช้ตำแหน่งของอาการขาดธาตุวินิจฉัย
    problem: "ต้นข้าวโพดมีใบแก่ด้านล่างเหลืองระหว่างเส้นใบ แต่ใบอ่อนด้านบนยังเขียวดี น่าจะขาดธาตุใด"
    steps:
      - text: "อาการเกิดที่ใบแก่ก่อน แปลว่าเป็นธาตุที่เคลื่อนย้ายได้ในพืช เช่น N P K Mg"
        why: "เมื่อขาด พืชย้ายธาตุที่เคลื่อนย้ายได้จากใบแก่ไปเลี้ยงใบอ่อน ใบแก่จึงแสดงอาการก่อน"
      - text: "อาการเหลืองเฉพาะระหว่างเส้นใบ (เส้นใบยังเขียว) เป็นลักษณะของการขาดแมกนีเซียม ส่วนขาดไนโตรเจนใบเหลืองทั้งใบ"
      - text: "แมกนีเซียมเป็นองค์ประกอบของคลอโรฟิลล์ เมื่อขาดใบจึงเหลือง"
    answer: "น่าจะขาดแมกนีเซียม"
  - { type: check, problem: biology.plants.plant-transport.p010, prompt: "ครั้งนี้อาการเกิดที่ใบอ่อน คิดแบบเดียวกัน" }
glossary:
  - { term: เซลล์คุม, definition: "เซลล์ผิวรูปไต 2 เซลล์ที่ล้อมปากใบ ควบคุมการเปิดปิดด้วยการรับและเสียน้ำ" }
  - { term: โพโทมิเตอร์, definition: "เครื่องมือวัดอัตราการดูดน้ำของกิ่งพืช ซึ่งใกล้เคียงอัตราการคายน้ำ" }
  - { term: แถบแคสพาเรียน, definition: "แถบซูเบอรินในผนังเซลล์เอนโดเดอร์มิส กั้นไม่ให้น้ำผ่านทางอโพพลาสต์" }
  - { term: แรงดึงจากการคายน้ำ, definition: "แรงที่เกิดเมื่อน้ำระเหยจากใบ ดึงลำน้ำในไซเลมขึ้นมา โดยอาศัยแรงโคฮีชันและแอดฮีชัน" }
  - { term: การคายน้ำเป็นหยด, definition: "การที่น้ำออกเป็นหยดทางรูเปิดที่ปลายเส้นใบ เกิดจากแรงดันราก มักเห็นตอนเช้ามืด" }
  - { term: แหล่งสร้างและแหล่งรับ, definition: "ส่วนของพืชที่ส่งน้ำตาลออก (เช่น ใบ) และส่วนที่รับน้ำตาลไปใช้หรือเก็บ (เช่น ราก ผล)" }
flashcards:
  - { front: "ปากใบเปิดเพราะอะไร", back: "K⁺ เข้าเซลล์คุม น้ำเข้าโดยออสโมซิส เซลล์คุมเต่งและโค้งออก" }
  - { front: "แรงหลักที่ดึงน้ำขึ้นต้นไม้สูง", back: "แรงดึงจากการคายน้ำ ร่วมกับแรงโคฮีชันและแอดฮีชัน" }
  - { front: "ทำไมรากต้องการออกซิเจนเพื่อดูดธาตุอาหาร", back: "ธาตุอาหารเข้าแบบใช้พลังงาน ต้องใช้ ATP จากการหายใจ" }
  - { front: "ขาดธาตุที่เคลื่อนย้ายได้ อาการเกิดที่ใด", back: "ใบแก่ เช่น ขาด N หรือ Mg" }
  - { front: "สมมติฐานการไหลเนื่องจากความดัน", back: "ซูโครสเข้าโฟลเอ็มที่แหล่งสร้าง น้ำตามเข้า ความดันสูง สารละลายไหลไปแหล่งรับที่ความดันต่ำ" }
