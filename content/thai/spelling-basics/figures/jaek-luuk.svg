<text x="475.0" y="228.0" font-size="34" text-anchor="middle" fill="#111" font-weight="bold">มู</text>
<rect x="540.0" y="180.0" width="130.0" height="70.0" rx="0" fill="#fff" stroke="#888" stroke-width="1.2"/>
