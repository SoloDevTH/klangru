    solution: "วูสเทียบลำดับเบสของ rRNA พบว่าโพรแคริโอตมีสองสายที่ต่างกันมากพอ ๆ กับที่ต่างจากยูแคริโอต จึงแยกเป็นแบคทีเรียกับอาร์เคีย การจำแนกเปลี่ยนเพราะมีหลักฐานใหม่เกี่ยวกับความสัมพันธ์ทางวิวัฒนาการ"
