      - { id: b, text: "ให้เพื่อนตรวจโค้ดผ่านคำขอรวมก่อนรวมเข้ากิ่งหลัก", correct: true, feedback: "จับบั๊กได้ก่อนถึงผู้ใช้และกระจายความรู้" }
      - { id: c, text: "มีไฟล์ README และ docstring อธิบายวิธีใช้", correct: true, feedback: "คนใหม่ในทีมเริ่มงานได้เร็ว" }
      - { id: d, text: "ใส่รหัสผ่านฐานข้อมูลไว้ในโค้ดที่คอมมิต เพื่อให้ทุกคนใช้ได้", feedback: "ประวัติ Git ลบยาก คลังสาธารณะใครก็อ่านได้ เก็บรหัสผ่านแยกนอกคลัง" }
      - { id: e, text: "ทุกคนแก้บนกิ่งหลักโดยตรงเพื่อความเร็ว", feedback: "งานที่ยังไม่ผ่านการตรวจจะปนเข้ากิ่งหลักและชนกันบ่อย" }
    hints:
