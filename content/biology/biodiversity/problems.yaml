    ai_assisted: true

  - id: biology.diversity.biodiversity.p017
    topics: [biology.diversity.biodiversity]
    difficulty: 5
    type: mcq
    stem: "ในอนาคต ถ้าน้ำทะเลหนุนสูงจนนาข้าวริมชายฝั่งเค็มขึ้น นักปรับปรุงพันธุ์ต้องการสร้างข้าวพันธุ์ใหม่ที่ทนเค็ม เหตุผลข้อใดอธิบายได้ดีที่สุดว่าทำไมการเก็บข้าวพันธุ์พื้นเมืองจำนวนมากไว้ในธนาคารเชื้อพันธุ์จึงสำคัญ"
    choices:
      - { id: a, text: "พันธุ์พื้นเมืองบางพันธุ์อาจมียีนทนเค็มอยู่แล้ว จึงใช้เป็นพ่อแม่พันธุ์ผสมกับพันธุ์ที่ให้ผลผลิตสูงได้", correct: true }
      - { id: b, text: "ธนาคารเชื้อพันธุ์ทำให้ข้าวทุกพันธุ์กลายพันธุ์เป็นข้าวทนเค็มเองระหว่างเก็บ", feedback: "การเก็บที่อุณหภูมิต่ำมีไว้รักษาสารพันธุกรรมเดิม ไม่ได้ทำให้ข้าวเปลี่ยนลักษณะ" }
      - { id: c, text: "เก็บไว้เพื่อให้มีข้าวพันธุ์เดียวกันปลูกทั้งประเทศ", feedback: "ตรงข้าม จุดประสงค์คือรักษาความหลากหลายทางพันธุกรรมไว้ ไม่ใช่ให้เหลือพันธุ์เดียว" }
    hints:
      - "การปรับปรุงพันธุ์ต้องมียีนที่ต้องการอยู่ในพ่อแม่พันธุ์"
      - "ธนาคารเชื้อพันธุ์เก็บความหลากหลายทางพันธุกรรมไว้"
    solution: "การสร้างพันธุ์ใหม่ต้องเริ่มจากพ่อแม่พันธุ์ที่มียีนที่ต้องการ ข้าวพื้นเมืองที่หลากหลายอาจมียีนทนเค็มหรือทนน้ำท่วม ธนาคารเชื้อพันธุ์จึงเก็บความหลากหลายทางพันธุกรรมไว้ใช้เมื่อสภาพแวดล้อมเปลี่ยน"
