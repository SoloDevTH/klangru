<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 370" width="520" height="370" font-family="sans-serif">
<title>รายการซื้อของของแม่</title>
<rect x="0" y="0" width="520" height="370" fill="#fff"/>
<rect x="60.0" y="20.0" width="400.0" height="330.0" rx="8" fill="#fffbea" stroke="#a08a3c" stroke-width="2.5"/>
<line x1="80.0" y1="130.0" x2="440.0" y2="130.0" stroke="#d9cfa0" stroke-width="1.2" stroke-linecap="round"/>
<line x1="80.0" y1="180.0" x2="440.0" y2="180.0" stroke="#d9cfa0" stroke-width="1.2" stroke-linecap="round"/>
<line x1="80.0" y1="230.0" x2="440.0" y2="230.0" stroke="#d9cfa0" stroke-width="1.2" stroke-linecap="round"/>
<line x1="80.0" y1="280.0" x2="440.0" y2="280.0" stroke="#d9cfa0" stroke-width="1.2" stroke-linecap="round"/>
<line x1="80.0" y1="330.0" x2="440.0" y2="330.0" stroke="#d9cfa0" stroke-width="1.2" stroke-linecap="round"/>
<line x1="80.0" y1="380.0" x2="440.0" y2="380.0" stroke="#d9cfa0" stroke-width="1.2" stroke-linecap="round"/>
<text x="260.0" y="75.0" font-size="28" text-anchor="middle" fill="#5b4a12" font-weight="bold">รายการซื้อของ</text>
<text x="100.0" y="120.0" font-size="26" text-anchor="start" fill="#1d2a6b" font-weight="normal">๑. ไข่ไก่ ๑๐ ฟอง</text>
<text x="100.0" y="170.0" font-size="26" text-anchor="start" fill="#1d2a6b" font-weight="normal">๒. น้ำปลา ๑ ขวด</text>
<text x="100.0" y="220.0" font-size="26" text-anchor="start" fill="#1d2a6b" font-weight="normal">๓. ข้าวสาน ๑ ถุง</text>
<text x="100.0" y="270.0" font-size="26" text-anchor="start" fill="#1d2a6b" font-weight="normal">๔. ผักบุ้ง ๒ กำ</text>
<text x="100.0" y="320.0" font-size="26" text-anchor="start" fill="#1d2a6b" font-weight="normal">๕. กล้วยหอม ๑ หวี</text>
</svg>
