    ai_assisted: true

  - id: management.org.organizational-behavior.p014
    topics: [management.org.organizational-behavior]
    difficulty: 4
    type: mcq
    stem: "แผนกผู้ป่วยนอกต้องการห้องประชุมใหญ่ทุกเช้าวันพุธ แผนกการเงินก็ต้องการห้องเดียวกันในเวลาเดียวกัน เมื่อคุยกันพบว่าผู้ป่วยนอกต้องการพื้นที่กว้างสำหรับอบรมการปฐมพยาบาล ส่วนการเงินต้องการแค่จอภาพและเงียบ วิธีใดเป็นการเจรจาแบบบูรณาการ"
    choices:
      - { id: a, text: "ให้ผู้ป่วยนอกใช้ห้องใหญ่ ส่วนการเงินใช้ห้องเล็กที่มีจอภาพ ทั้งสองแผนกได้สิ่งที่ต้องการจริง", correct: true }
      - { id: b, text: "แบ่งกันใช้ห้องใหญ่คนละชั่วโมง", feedback: "นี่คือการประนีประนอม ทั้งสองฝ่ายได้แค่ครึ่งเดียวทั้งที่ความต้องการแท้จริงไม่ขัดกัน" }
      - { id: c, text: "ให้ผู้อำนวยการตัดสินว่าแผนกใดสำคัญกว่า", feedback: "เป็นการให้ผู้มีอำนาจชี้ขาด ฝ่ายหนึ่งได้ อีกฝ่ายเสีย ไม่ได้ขยายผลประโยชน์รวม" }
      - { id: d, text: "สลับกันใช้สัปดาห์เว้นสัปดาห์", feedback: "ยังเป็นการแบ่งของก้อนเดิม ไม่ได้มองที่ความต้องการแท้จริงของแต่ละฝ่าย" }
    hints:
      - "แยกจุดยืน (ต้องการห้องนี้) ออกจากความต้องการแท้จริง (ทำไมต้องการ)"
      - "การเจรจาแบบบูรณาการหาทางที่ทั้งสองฝ่ายได้สิ่งที่ต้องการจริง"
    solution: "จุดยืนของทั้งสองแผนกคือห้องเดียวกัน แต่ความต้องการแท้จริงต่างกัน ผู้ป่วยนอกต้องการพื้นที่ การเงินต้องการจอและความเงียบ ทางออกที่ตอบทั้งสองความต้องการคือแบบบูรณาการ"
