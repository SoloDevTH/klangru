<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" font-family="sans-serif">
<title>ฉลากอาหารสมมติสำหรับฝึกอ่าน</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="0" y="0" width="640" height="430" fill="#ffffff"/>
<rect x="20.0" y="20.0" width="600.0" height="390.0" rx="14" fill="#fffaf0" stroke="#8a6d3b" stroke-width="2" />
<text x="320.0" y="62.0" font-size="24" text-anchor="middle" font-weight="bold" fill="#7a2e0e">ข้าวเกรียบรสต้มยำ ตราใบเตย</text>
<text x="320.0" y="88.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#555">(ฉลากสมมติเพื่อการเรียน ไม่ใช่สินค้าจริง)</text>
<rect x="40.0" y="108.0" width="300.0" height="44.0" rx="4" fill="#fff" stroke="#1f4e9a" stroke-width="2.5" />
<rect x="40.0" y="108.0" width="56.0" height="44.0" rx="4" fill="#1f4e9a" stroke="#1f4e9a" stroke-width="1.5" />
<text x="68.0" y="138.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">อย.</text>
<text x="218.0" y="138.0" font-size="19" text-anchor="middle" font-weight="bold" fill="#1f4e9a">10-1-12345-6-0001</text>
<text x="360.0" y="122.0" font-size="15" text-anchor="start" font-weight="normal" fill="#111">น้ำหนักสุทธิ 30 กรัม</text>
<text x="360.0" y="142.2" font-size="15" text-anchor="start" font-weight="normal" fill="#111">ผลิต: 15/01/69</text>
<text x="360.0" y="162.5" font-size="15" text-anchor="start" font-weight="normal" fill="#111">ควรบริโภคก่อน: 15/07/69</text>
<text x="40.0" y="190.0" font-size="14" text-anchor="start" font-weight="normal" fill="#111">ส่วนประกอบ: แป้งมันสำปะหลัง 60%  กุ้ง 20%  น้ำมันปาล์ม</text>
<text x="40.0" y="212.0" font-size="14" text-anchor="start" font-weight="normal" fill="#111">เครื่องปรุงรสต้มยำ  เกลือ  น้ำตาล</text>
<rect x="40.0" y="226.0" width="560.0" height="34.0" rx="6" fill="#ffe9e3" stroke="#c62828" stroke-width="1.5" />
<text x="52.0" y="249.0" font-size="15" text-anchor="start" font-weight="bold" fill="#b71c1c">ข้อมูลสำหรับผู้แพ้อาหาร: มีกุ้ง  อาจมีถั่วลิสง</text>
<text x="40.0" y="284.0" font-size="14" text-anchor="start" font-weight="normal" fill="#111">ใช้วัตถุกันเสีย</text>
<text x="40.0" y="306.0" font-size="14" text-anchor="start" font-weight="normal" fill="#111">ผลิตโดย: บริษัท ขนมสมมติ จำกัด  เขตบางกะปิ กรุงเทพมหานคร</text>
<text x="40.0" y="328.0" font-size="14" text-anchor="start" font-weight="normal" fill="#111">เก็บในที่แห้งและเย็น ปิดถุงให้สนิทหลังเปิด</text>
<text x="40.0" y="362.0" font-size="13" text-anchor="start" font-weight="normal" fill="#555">วันที่บนฉลากเขียนแบบ วัน/เดือน/ปี พ.ศ. สองหลักท้าย</text>
<text x="40.0" y="384.0" font-size="13" text-anchor="start" font-weight="normal" fill="#555">เช่น 15/07/69 คือ 15 กรกฎาคม 2569</text>
</svg>
