<rect x="40.0" y="392.0" width="640.0" height="62.0" rx="10" fill="#dbe8f8" stroke="#1f4e9c" stroke-width="2"/>
<text x="360.0" y="418.0" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="normal">ถามใช่หรือไม่: ประโยคบอกเล่า + 吗？  他是老师。 → 他是老师吗？</text>
<text x="360.0" y="442.0" font-size="16" text-anchor="middle" fill="#1f4e9c" font-weight="bold">ถ้ามีคำแสดงคำถามอยู่แล้ว ไม่ต้องเติม 吗</text>
