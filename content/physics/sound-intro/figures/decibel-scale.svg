<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" width="560" height="430" font-family="sans-serif" font-size="14">
<title>ระดับเสียงเป็นเดซิเบลของเสียงรอบตัว ตั้งแต่ 0 ถึง 140 เดซิเบล เสียงตั้งแต่ 85 เดซิเบลขึ้นไปอันตรายถ้าฟังนาน</title>
<rect x="0" y="0" width="560" height="430" fill="#ffffff"/>
<rect x="150.0" y="30.0" width="34.0" height="145.4" rx="0" fill="#f4c7b8" stroke="none" stroke-width="0"/>
<rect x="150.0" y="175.4" width="34.0" height="224.6" rx="0" fill="#cfe3c4" stroke="none" stroke-width="0"/>
<rect x="150.0" y="30.0" width="34.0" height="370.0" rx="0" fill="none" stroke="#15211e" stroke-width="1.5"/>
<line x1="144.0" y1="400.0" x2="150.0" y2="400.0" stroke="#15211e" stroke-width="1.5"/>
<text x="140.0" y="405.0" text-anchor="end" fill="#15211e" font-size="13">0</text>
<line x1="144.0" y1="347.1" x2="150.0" y2="347.1" stroke="#15211e" stroke-width="1.5"/>
<text x="140.0" y="352.1" text-anchor="end" fill="#15211e" font-size="13">20</text>
<line x1="144.0" y1="294.3" x2="150.0" y2="294.3" stroke="#15211e" stroke-width="1.5"/>
<text x="140.0" y="299.3" text-anchor="end" fill="#15211e" font-size="13">40</text>
<line x1="144.0" y1="241.4" x2="150.0" y2="241.4" stroke="#15211e" stroke-width="1.5"/>
<text x="140.0" y="246.4" text-anchor="end" fill="#15211e" font-size="13">60</text>
<line x1="144.0" y1="188.6" x2="150.0" y2="188.6" stroke="#15211e" stroke-width="1.5"/>
<text x="140.0" y="193.6" text-anchor="end" fill="#15211e" font-size="13">80</text>
<line x1="144.0" y1="135.7" x2="150.0" y2="135.7" stroke="#15211e" stroke-width="1.5"/>
<text x="140.0" y="140.7" text-anchor="end" fill="#15211e" font-size="13">100</text>
<line x1="144.0" y1="82.9" x2="150.0" y2="82.9" stroke="#15211e" stroke-width="1.5"/>
<text x="140.0" y="87.9" text-anchor="end" fill="#15211e" font-size="13">120</text>
<line x1="144.0" y1="30.0" x2="150.0" y2="30.0" stroke="#15211e" stroke-width="1.5"/>
<text x="140.0" y="35.0" text-anchor="end" fill="#15211e" font-size="13">140</text>
<text x="100.0" y="215.0" text-anchor="middle" fill="#15211e" font-size="13" transform="rotate(-90 100 215.0)">ระดับเสียง (dB)</text>
<line x1="146.0" y1="175.4" x2="190.0" y2="175.4" stroke="#b4521f" stroke-width="2.5"/>
<text x="167.0" y="167.4" text-anchor="middle" fill="#b4521f" font-size="12" font-weight="bold">85</text>
<circle cx="184.0" cy="400.0" r="3.0" fill="#15211e" stroke="#15211e" stroke-width="1"/>
<line x1="184.0" y1="400.0" x2="210.0" y2="400.0" stroke="#777" stroke-width="1"/>
<text x="216.0" y="405.0" text-anchor="start" fill="#15211e" font-size="13">0 dB เสียงเบาที่สุดที่หูได้ยิน</text>
<circle cx="184.0" cy="320.7" r="3.0" fill="#15211e" stroke="#15211e" stroke-width="1"/>
<line x1="184.0" y1="320.7" x2="210.0" y2="320.7" stroke="#777" stroke-width="1"/>
<text x="216.0" y="325.7" text-anchor="start" fill="#15211e" font-size="13">30 dB เสียงกระซิบ</text>
<circle cx="184.0" cy="241.4" r="3.0" fill="#15211e" stroke="#15211e" stroke-width="1"/>
<line x1="184.0" y1="241.4" x2="210.0" y2="241.4" stroke="#777" stroke-width="1"/>
<text x="216.0" y="246.4" text-anchor="start" fill="#15211e" font-size="13">60 dB พูดคุยตามปกติ</text>
<circle cx="184.0" cy="188.6" r="3.0" fill="#15211e" stroke="#15211e" stroke-width="1"/>
<line x1="184.0" y1="188.6" x2="210.0" y2="188.6" stroke="#777" stroke-width="1"/>
<text x="216.0" y="193.6" text-anchor="start" fill="#15211e" font-size="13">80 dB ถนนที่รถติด</text>
<circle cx="184.0" cy="135.7" r="3.0" fill="#15211e" stroke="#15211e" stroke-width="1"/>
<line x1="184.0" y1="135.7" x2="210.0" y2="135.7" stroke="#777" stroke-width="1"/>
<text x="216.0" y="140.7" text-anchor="start" fill="#15211e" font-size="13">100 dB ลำโพงในงานคอนเสิร์ต</text>
<circle cx="184.0" cy="82.9" r="3.0" fill="#15211e" stroke="#15211e" stroke-width="1"/>
<line x1="184.0" y1="82.9" x2="210.0" y2="82.9" stroke="#777" stroke-width="1"/>
<text x="216.0" y="87.9" text-anchor="start" fill="#15211e" font-size="13">120 dB ประทัดหรือแตรรถใกล้หู (เจ็บหู)</text>
<circle cx="184.0" cy="30.0" r="3.0" fill="#15211e" stroke="#15211e" stroke-width="1"/>
<line x1="184.0" y1="30.0" x2="210.0" y2="30.0" stroke="#777" stroke-width="1"/>
<text x="216.0" y="35.0" text-anchor="start" fill="#15211e" font-size="13">140 dB เครื่องบินไอพ่นขึ้นใกล้ ๆ</text>
<text x="216.0" y="170.1" text-anchor="start" fill="#b4521f" font-size="12">ตั้งแต่ 85 dB: ฟังนานหลายชั่วโมงทำลายการได้ยิน</text>
</svg>
