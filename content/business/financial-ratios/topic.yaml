id: business.finance.financial-ratios
subject: business
title: { th: "การวิเคราะห์งบการเงินด้วยอัตราส่วน", en: "Financial statement analysis with ratios" }
summary: "อัตราส่วนสภาพคล่อง ประสิทธิภาพการใช้สินทรัพย์ ความสามารถทำกำไร และโครงสร้างเงินทุน การแยก ROE แบบดูปองท์ การวิเคราะห์แนวโน้ม การเทียบอุตสาหกรรม กระแสเงินสดและวงจรเงินสด"
difficulty: 6
minutes: 45
prerequisites: [business.accounting.financial-statements, math.number.ratio-percent]
encompasses:
  - { id: business.accounting.financial-statements, weight: 0.4 }
  - { id: math.number.ratio-percent, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: statements.svg
    alt: "งบการเงินของบริษัท ข้าวทองแปรรูป จำกัด (สมมติ) หน่วยพันบาท งบแสดงฐานะการเงิน ณ 31 ธ.ค. ปี 2568 และ 2567 ตามลำดับ: เงินสด 300 และ 250 ลูกหนี้การค้า 900 และ 700 สินค้าคงเหลือ 1,200 และ 1,000 รวมสินทรัพย์หมุนเวียน 2,400 และ 1,950 ที่ดิน อาคาร อุปกรณ์สุทธิ 3,600 และ 3,550 รวมสินทรัพย์ 6,000 และ 5,500 เจ้าหนี้การค้า 800 และ 650 เงินกู้ระยะสั้น 400 และ 350 รวมหนี้สินหมุนเวียน 1,200 และ 1,000 เงินกู้ระยะยาว 1,800 และ 1,900 รวมหนี้สิน 3,000 และ 2,900 ส่วนของผู้ถือหุ้น 3,000 และ 2,600 รวมหนี้สินและส่วนของผู้ถือหุ้น 6,000 และ 5,500 งบกำไรขาดทุนปี 2568 และ 2567: ขาย 9,000 และ 8,000 ต้นทุนขาย 6,300 และ 5,440 กำไรขั้นต้น 2,700 และ 2,560 ค่าใช้จ่ายในการขายและบริหาร 1,500 และ 1,400 กำไรก่อนดอกเบี้ยและภาษี 1,200 และ 1,160 ดอกเบี้ยจ่าย 150 และ 160 กำไรก่อนภาษี 1,050 และ 1,000 ภาษีเงินได้ 210 และ 200 กำไรสุทธิ 840 และ 800 ข้อมูลเพิ่มเติมปี 2568: ค่าเสื่อมราคาทั้งปี 300 พันบาท ค่าเฉลี่ยอุตสาหกรรม (สมมติ) อัตราส่วนทุนหมุนเวียน 1.5 เท่า อัตรากำไรสุทธิ 7% หนี้สินต่อสินทรัพย์รวม 60%"
    caption: "งบการเงินสองปีของบริษัทสมมติที่ใช้ในบทเรียนและโจทย์"
  - { type: check, problem: business.finance.financial-ratios.p005, prompt: "ตัดสินค้าคงเหลือออกแล้วสภาพคล่องเป็นอย่างไร" }
  - type: worked-example
    title: "อ่านสุขภาพทางการเงินของข้าวทองปี 2568"
    problem: "จากงบในภาพ หาอัตราส่วนหลักหนึ่งตัวจากแต่ละกลุ่ม แล้วสรุปจุดแข็งและสิ่งที่ควรระวัง"
    steps:
      - { text: "สภาพคล่อง: ทุนหมุนเวียน $2{,}400 \\div 1{,}200 = 2.0$ เท่า ทุนหมุนเวียนเร็ว $1{,}200 \\div 1{,}200 = 1.0$ เท่า", why: "ดูทั้งสองตัว เพราะครึ่งหนึ่งของสินทรัพย์หมุนเวียนเป็นสินค้าคงเหลือ" }
      - { text: "ประสิทธิภาพ: ระยะเก็บหนี้ $365 \\times 800 \\div 9{,}000 \\approx 32.4$ วัน ระยะขายสินค้า $365 \\times 1{,}100 \\div 6{,}300 \\approx 63.7$ วัน" }
      - { text: "กำไร: อัตรากำไรสุทธิ $840 \\div 9{,}000 \\approx 9.33\\%$ (ปีก่อน $10\\%$) ROE $840 \\div 2{,}800 = 30\\%$" }
      - { text: "โครงสร้างเงินทุน: หนี้สินต่อสินทรัพย์ $50\\%$ (อุตสาหกรรม $60\\%$) จ่ายดอกเบี้ยได้ $8$ เท่า" }
      - { text: "สรุป: สภาพคล่องดี หนี้ไม่สูง แต่อัตรากำไรลดลงและสินค้าค้างนานราวสองเดือน ควรดูราคาวัตถุดิบและการจัดการสต็อก", why: "อัตราส่วนบอกอาการ ต้องหาข้อมูลอื่นเพื่อหาสาเหตุ" }
    answer: "ฐานะการเงินมั่นคง แต่ต้องเฝ้าระวังอัตรากำไรที่ลดลงและสินค้าคงเหลือ"
  - type: figure
    src: dupont.svg
    alt: "แผนภาพดูปองท์ กล่องบน ROE เท่ากับกำไรสุทธิหารส่วนของผู้ถือหุ้นเฉลี่ย แยกเป็นสามกล่องที่คูณกัน อัตรากำไรสุทธิ (กำไรสุทธิหารขาย ทำกำไรจากยอดขายได้ดีแค่ไหน) คูณ การหมุนของสินทรัพย์ (ขายหารสินทรัพย์เฉลี่ย ใช้สินทรัพย์สร้างยอดขายคุ้มแค่ไหน) คูณ ตัวคูณทุน (สินทรัพย์เฉลี่ยหารทุนเฉลี่ย ใช้เงินกู้มากแค่ไหน) ทั้งสามคูณกันได้ ROE เพราะขายและสินทรัพย์เฉลี่ยตัดกันหมด"
    caption: "ROE สูงได้จากสามทาง: กำไรดี ใช้สินทรัพย์คุ้ม หรือกู้มาก"
  - type: worked-example
    title: "กำไรเท่ากัน แต่เงินสดต่างกัน"
    problem: "บริษัท ก และ ข (สมมติ) มีกำไรสุทธิเท่ากัน $500$ พันบาท ค่าเสื่อมราคา $100$ พันบาทเท่ากัน บริษัท ก ลูกหนี้เพิ่ม $50$ สินค้าเพิ่ม $30$ เจ้าหนี้เพิ่ม $40$ บริษัท ข ลูกหนี้เพิ่ม $350$ สินค้าเพิ่ม $250$ เจ้าหนี้ลด $20$ (พันบาท) เปรียบเทียบกระแสเงินสดจากการดำเนินงาน"
    steps:
      - { text: "บริษัท ก: $500 + 100 - 50 - 30 + 40 = 560$ พันบาท" }
      - { text: "บริษัท ข: $500 + 100 - 350 - 250 - 20 = -20$ พันบาท", why: "เจ้าหนี้ลดแปลว่าจ่ายเงินคืนผู้ขายมากกว่าที่ซื้อเชื่อเพิ่ม เงินสดจึงลด" }
      - { text: "บริษัท ข มีกำไรแต่เงินสดจากการดำเนินงานติดลบ เพราะเงินจมในลูกหนี้และสินค้า อาจต้องกู้มาจ่ายค่าใช้จ่าย" }
    answer: "ก ได้เงินสด $560$ พันบาท ข ติดลบ $20$ พันบาท แม้กำไรเท่ากัน"
  - { type: check, problem: business.finance.financial-ratios.p010, prompt: "ใช้ต้นทุนขายหรือยอดขาย" }
glossary:
  - { term: "อัตราส่วนทุนหมุนเวียน", definition: "สินทรัพย์หมุนเวียน ÷ หนี้สินหมุนเวียน วัดความสามารถจ่ายหนี้ระยะสั้น" }
  - { term: "อัตราส่วนทุนหมุนเวียนเร็ว", definition: "(สินทรัพย์หมุนเวียน − สินค้าคงเหลือ) ÷ หนี้สินหมุนเวียน" }
  - { term: "ระยะเวลาเก็บหนี้", definition: "365 ÷ (ขาย ÷ ลูกหนี้เฉลี่ย) จำนวนวันโดยเฉลี่ยที่เก็บเงินจากลูกค้าได้" }
  - { term: ROE, definition: "อัตราผลตอบแทนผู้ถือหุ้น = กำไรสุทธิ ÷ ส่วนของผู้ถือหุ้นเฉลี่ย" }
  - { term: "ตัวคูณทุน", definition: "สินทรัพย์รวมเฉลี่ย ÷ ส่วนของผู้ถือหุ้นเฉลี่ย ยิ่งสูงยิ่งใช้หนี้สินมาก" }
  - { term: "ความสามารถในการจ่ายดอกเบี้ย", definition: "กำไรก่อนดอกเบี้ยและภาษี ÷ ดอกเบี้ยจ่าย" }
  - { term: "วงจรเงินสด", definition: "ระยะเวลาขายสินค้า + ระยะเวลาเก็บหนี้ − ระยะเวลาชำระหนี้" }
  - { term: "การวิเคราะห์ตามแนวดิ่ง", definition: "แสดงทุกรายการในงบเป็นร้อยละของยอดขายหรือสินทรัพย์รวม เพื่อเทียบบริษัทที่ขนาดต่างกัน" }
flashcards:
  - { front: "สี่กลุ่มของอัตราส่วนทางการเงิน", back: "สภาพคล่อง · ประสิทธิภาพการใช้สินทรัพย์ · ความสามารถทำกำไร · โครงสร้างเงินทุน/ความสามารถชำระหนี้" }
  - { front: "ดูปองท์", back: "ROE = อัตรากำไรสุทธิ × การหมุนของสินทรัพย์ × ตัวคูณทุน" }
  - { front: "อัตราการหมุนของสินค้าใช้อะไรเป็นตัวตั้ง", back: "ต้นทุนขาย (ไม่ใช่ยอดขาย) ÷ สินค้าคงเหลือเฉลี่ย" }
  - { front: "กระแสเงินสดจากการดำเนินงาน (ทางอ้อม)", back: "กำไรสุทธิ + ค่าเสื่อมราคา − ลูกหนี้/สินค้าที่เพิ่ม + เจ้าหนี้ที่เพิ่ม" }
  - { front: "วงจรเงินสด", back: "ระยะขายสินค้า + ระยะเก็บหนี้ − ระยะชำระหนี้" }
