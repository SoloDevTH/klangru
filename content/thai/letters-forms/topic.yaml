id: thai.composition.letters-forms
subject: thai
title: { th: การเขียนจดหมายและกรอกแบบรายการ, en: "Writing letters and filling in forms" }
summary: ส่วนประกอบของจดหมาย คำขึ้นต้นและคำลงท้าย จดหมายถึงพ่อแม่ ครู และเพื่อน จดหมายลาครู จดหมายกิจธุระ การจ่าหน้าซอง และการกรอกแบบรายการรวมถึงแบบสมัครงาน
difficulty: 3
minutes: 35
prerequisites: [thai.composition.word-choice]
encompasses:
  - { id: thai.composition.word-choice, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: letter-layout.svg
    alt: "แผนผังหน้าจดหมาย ส่วนที่ 1 ที่อยู่ผู้เขียน มุมขวาบน ส่วนที่ 2 วัน เดือน ปี ใต้ที่อยู่ เริ่มประมาณกลางหน้า กรอบประ เรื่อง มีเฉพาะจดหมายกิจธุระ อยู่ชิดซ้ายเหนือคำขึ้นต้น ส่วนที่ 3 คำขึ้นต้น ชิดซ้าย ส่วนที่ 4 เนื้อความ บรรทัดแรกของย่อหน้าเว้นเข้าไป ส่วนที่ 5 คำลงท้าย ตรงกับแนววันที่ ส่วนที่ 6 ลงชื่อ ใต้คำลงท้าย และกรอบประ ชื่อเต็มในวงเล็บ มีเฉพาะจดหมายกิจธุระ"
    caption: "ส่วนประกอบของจดหมาย กรอบประมีเฉพาะจดหมายกิจธุระ"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: envelope.svg
    alt: "ด้านหน้าซองจดหมาย มุมซ้ายบนเป็นผู้ส่ง ด.ญ.ใบเตย ใจดี 12 หมู่ 3 ต.บ้านสวน อ.เมือง จ.สุขสันต์ (สมมุติ) 12345 มุมขวาบนเป็นแสตมป์ กลางซองค่อนไปทางขวาล่างเป็นผู้รับ กรุณาส่ง นางบุญมา ใจดี 45 หมู่ 7 ต.ท่าน้ำ อ.ริมคลอง จ.สุขสันต์ (สมมุติ) 12340"
    caption: "จ่าหน้าซอง: ผู้ส่งซ้ายบน แสตมป์ขวาบน ผู้รับกลางค่อนขวาล่าง (ชื่อและที่อยู่สมมุติ)"
  - type: worked-example
    title: เขียนจดหมายลาป่วย
    problem: "เด็กหญิงมะปราง รักเรียน ชั้น ป.3/1 เป็นไข้หวัด แพทย์ให้พัก 2 วัน คือวันที่ 9 และ 10 พฤศจิกายน 2569 เขียนจดหมายลาครูประจำชั้น"
    steps:
      - text: "ส่วนหัว: ที่อยู่ที่บ้านมุมขวาบน และวันที่เขียน 9 พฤศจิกายน 2569"
      - text: "เรื่อง ขอลาป่วย / เรียน คุณครูประจำชั้น ป.3/1"
        why: "เรื่อง บอกจุดประสงค์ ครูอ่านบรรทัดเดียวก็รู้"
      - text: "เนื้อความ: ข้าพเจ้า เด็กหญิงมะปราง รักเรียน นักเรียนชั้น ป.3/1 ป่วยเป็นไข้หวัด จึงขอลาป่วยตั้งแต่วันที่ 9 ถึงวันที่ 10 พฤศจิกายน 2569 รวม 2 วัน"
        why: "ต้องครบ ใครลา ลาเพราะอะไร ลาวันไหนถึงวันไหน รวมกี่วัน"
      - text: "ปิด: จึงเรียนมาเพื่อโปรดพิจารณา / ด้วยความเคารพ"
      - text: "ลงชื่อนักเรียน ชื่อเต็มในวงเล็บ และให้ผู้ปกครองลงชื่อรับรอง"
    answer: "ใบลามีที่อยู่ วันที่ เรื่อง เรียน เนื้อความครบ (ชื่อ ชั้น สาเหตุ วันที่ลา 9–10 พ.ย. รวม 2 วัน) จึงเรียนมาเพื่อโปรดพิจารณา ด้วยความเคารพ ลงชื่อนักเรียนและผู้ปกครอง"
  - { type: check, problem: thai.composition.letters-forms.p006, prompt: "ใบลาต้องบอกวันที่ลา" }
  - type: worked-example
    title: กรอกจำนวนเงินเป็นตัวอักษร
    problem: "ใบสมัครเข้าค่ายมีค่าสมัคร 1,500 บาท เขียนจำนวนเงินเป็นตัวอักษร"
    steps:
      - text: "แยกหลัก: 1 พัน 5 ร้อย 0 สิบ 0 หน่วย"
      - text: "อ่านเป็นคำ: หนึ่งพันห้าร้อย"
      - text: "เติมหน่วยเงินและคำว่า ถ้วน เพราะไม่มีสตางค์"
        why: "คำว่า ถ้วน ป้องกันการเติมตัวเลขหรือสตางค์ภายหลัง"
    answer: "หนึ่งพันห้าร้อยบาทถ้วน"
  - { type: check, problem: thai.composition.letters-forms.p008, prompt: "อย่าลืมคำลงท้ายของจำนวนเต็มบาท" }
glossary:
  - { term: คำขึ้นต้น, definition: "คำทักผู้รับตอนต้นจดหมาย เช่น กราบเท้า... เรียน... ต้องเข้าคู่กับคำลงท้าย" }
  - { term: จดหมายส่วนตัว, definition: "จดหมายถึงคนที่รู้จัก เช่น พ่อแม่ ญาติ เพื่อน" }
  - { term: จดหมายกิจธุระ, definition: "จดหมายติดต่องาน เช่น ขอความอนุเคราะห์ ขอข้อมูล สั่งซื้อ ใช้ภาษาทางการ" }
  - { term: จ่าหน้าซอง, definition: "การเขียนชื่อและที่อยู่ผู้รับและผู้ส่งบนซอง" }
  - { term: แบบรายการ, definition: "แบบฟอร์มที่มีช่องให้กรอกข้อมูล เช่น ใบสมัคร ใบฝากเงิน" }
  - { term: รหัสไปรษณีย์, definition: "ตัวเลข 5 หลักประจำท้องที่ ช่วยให้คัดแยกจดหมายได้เร็ว" }
flashcards:
  - { front: "ส่วนประกอบของจดหมาย 6 ส่วน", back: "ที่อยู่ วันที่ คำขึ้นต้น เนื้อความ คำลงท้าย ลงชื่อ" }
  - { front: "ใบลาต้องบอกอะไร", back: "ใครลา ลาเพราะอะไร ลาวันไหนถึงวันไหน รวมกี่วัน และผู้ปกครองลงชื่อ" }
  - { front: "ด้านหน้าซอง", back: "ผู้ส่งซ้ายบน แสตมป์ขวาบน ผู้รับกลางค่อนขวาล่าง พร้อมรหัสไปรษณีย์" }
  - { front: "250 บาท เขียนเป็นตัวอักษร", back: "สองร้อยห้าสิบบาทถ้วน" }
