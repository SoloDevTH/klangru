topic: computer.society.computing-impacts
rows:
  - { framework: csta-k12-cs, indicators: ["1A-IC-16", "1B-IC-18", "2-IC-20", "3A-IC-24", "3B-IC-25"], coverage: full, note: "เปรียบเทียบงานเดียวกันก่อนและหลังมีเทคโนโลยี เทคโนโลยีกับวัฒนธรรมสองทาง ข้อแลกเปลี่ยนต่อชีวิตประจำวันและอาชีพ ประเมินผลกระทบห้าด้าน และเสนอวิธีเพิ่มผลดีลดผลเสีย (p012)" }
  - { framework: csta-k12-cs, indicators: ["3B-IC-26"], coverage: partial, note: "ช่องว่างทางดิจิทัลและการเข้าถึง (p009, p016) ส่วนการกระจายทรัพยากรคอมพิวเตอร์ระดับโลกกล่าวถึงเพียงประโยคเดียว" }
  - { framework: csta-k12-cs, indicators: ["3B-IC-27"], coverage: partial, note: "คาดการณ์ด้วยแบบจำลองเท่าตัว (กฎของมัวร์ p013, p017) และข้อควรระวัง แต่ไม่ได้วิเคราะห์นวัตกรรมเฉพาะเรื่องอย่างลึก" }
  - { framework: csta-k12-cs, indicators: ["3B-IC-28"], coverage: partial, note: "อภิปรายผลดีผลเสียของกฎหมายต่อผู้ใช้และผู้พัฒนาหนึ่งกรณี (p014) กฎหมายไทยจริงอยู่ใน computer.society.responsible-ict" }
  - { framework: acm-cs2023, indicators: ["SEP-Context"], coverage: partial, note: "ผลต่อบุคคลและสังคมและการเข้าถึงไม่ได้ครบ ผลของความไม่หลากหลายของทีมพัฒนามีเพียงประเด็นความแม่นยำที่ลำเอียงในโจทย์ p012" }
  - { framework: acm-cs2023, indicators: ["SEP-History"], coverage: partial, note: "เส้นเวลาฮาร์ดแวร์และเหตุการณ์สำคัญโดยย่อ รวมประวัติในไทย ยังไม่มีประวัติซอฟต์แวร์และองค์กรอย่างละเอียด" }
  - { framework: uk-nc-computing, indicators: ["UKNC-CO-KS1-05"], coverage: full, note: "ตัวอย่างการใช้ IT นอกโรงเรียน (ATM บัตรโดยสาร แอปนำทาง QR) และโจทย์ p001" }
