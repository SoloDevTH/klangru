problems:
  - id: biology.humans.nutrition-digestion.p001
    topics: [biology.humans.nutrition-digestion]
    difficulty: 1
    type: match
    stem: "จับคู่สารอาหารกับอาหารที่พบสารนั้นมาก"
    pairs:
      - { left: "คาร์โบไฮเดรต", right: "ข้าวสวย" }
      - { left: "โปรตีน", right: "ไข่ต้ม" }
      - { left: "ไขมัน", right: "กะทิ" }
      - { left: "วิตามินซี", right: "ฝรั่ง" }
      - { left: "แร่ธาตุแคลเซียม", right: "ปลาเล็กปลาน้อยทอดกรอบ" }
    hints:
      - "อาหารที่ทำจากแป้งให้คาร์โบไฮเดรต"
      - "ปลาที่กินได้ทั้งก้างให้แร่ธาตุที่สร้างกระดูก"
    solution: "ข้าว → คาร์โบไฮเดรต, ไข่ → โปรตีน, กะทิ → ไขมัน, ฝรั่ง → วิตามินซี, ปลาเล็กปลาน้อย → แคลเซียม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nutrition-digestion.p002
    topics: [biology.humans.nutrition-digestion]
    difficulty: 1
    type: mcq
    stem: "สารอาหารใดช่วยสร้างและซ่อมแซมส่วนที่สึกหรอของร่างกาย"
    choices:
      - { id: a, text: "โปรตีน", correct: true }
      - { id: b, text: "คาร์โบไฮเดรต", feedback: "คาร์โบไฮเดรตให้พลังงานเป็นหลัก ไม่ได้ใช้สร้างเนื้อเยื่อเป็นหลัก" }
      - { id: c, text: "น้ำ", feedback: "น้ำช่วยลำเลียงสารและระบายความร้อน แต่ไม่ได้ใช้สร้างเนื้อเยื่อใหม่" }
      - { id: d, text: "วิตามิน", feedback: "วิตามินช่วยให้ร่างกายทำงานปกติ ร่างกายต้องการเพียงเล็กน้อย ไม่ได้เป็นวัตถุดิบสร้างเนื้อเยื่อ" }
    hints:
      - "เด็กที่กำลังโตต้องการสารอาหารนี้มาก"
      - "พบมากในเนื้อสัตว์ ไข่ นม และถั่ว"
    solution: "โปรตีนใช้สร้างกล้ามเนื้อ ผิวหนัง และซ่อมแซมส่วนที่สึกหรอ พบมากในเนื้อสัตว์ ไข่ นม และถั่ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nutrition-digestion.p003
    topics: [biology.humans.nutrition-digestion]
    difficulty: 1
    type: text
    stem: "อวัยวะใดในทางเดินอาหารที่ดูดซึมสารอาหารเข้าสู่เลือดมากที่สุด"
    accepted: ["ลำไส้เล็ก", "small intestine"]
    hints:
      - "อวัยวะนี้ยาวที่สุดในทางเดินอาหาร"
      - "ผนังด้านในมีวิลลัสจำนวนมาก"
    misconceptions:
      - { match: "กระเพาะอาหาร", feedback: "กระเพาะอาหารย่อยโปรตีนและคลุกเคล้าอาหาร แต่ดูดซึมสารอาหารได้น้อยมาก" }
      - { match: "ลำไส้ใหญ่", feedback: "ลำไส้ใหญ่ดูดน้ำและแร่ธาตุบางส่วน สารอาหารส่วนใหญ่ถูกดูดซึมไปก่อนแล้วที่ลำไส้เล็ก" }
    solution: "ลำไส้เล็ก ย่อยอาหารจนสมบูรณ์และดูดซึมสารอาหารผ่านวิลลัสเข้าสู่เลือด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nutrition-digestion.p004
    topics: [biology.humans.nutrition-digestion]
    difficulty: 2
    type: order
    stem: "เรียงลำดับอวัยวะที่อาหารเคลื่อนผ่าน ตั้งแต่เข้าปากจนออกจากร่างกาย"
    items:
      - "ปาก"
      - "หลอดอาหาร"
      - "กระเพาะอาหาร"
      - "ลำไส้เล็ก"
      - "ลำไส้ใหญ่"
      - "ทวารหนัก"
    hints:
      - "หลอดอาหารต่อจากปากลงไปที่กระเพาะ"
      - "ลำไส้เล็กอยู่ก่อนลำไส้ใหญ่"
    solution: "ปาก → หลอดอาหาร → กระเพาะอาหาร → ลำไส้เล็ก → ลำไส้ใหญ่ → ทวารหนัก (ตับและตับอ่อนไม่อยู่ในเส้นทางนี้)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nutrition-digestion.p005
    topics: [biology.humans.nutrition-digestion]
    difficulty: 2
    type: match
    stem: "จับคู่ชนิดของฟันกับหน้าที่"
    pairs:
      - { left: "ฟันตัด", right: "ตัดอาหาร เช่น กัดแตงโม" }
      - { left: "ฟันเขี้ยว", right: "ฉีกอาหาร เช่น ฉีกเนื้อย่าง" }
      - { left: "ฟันกราม", right: "บดอาหารให้ละเอียด" }
    hints:
      - "ฟันแหลมใช้ฉีก"
      - "ฟันที่ผิวกว้างอยู่ด้านในใช้บด"
    solution: "ฟันตัดแบนคมใช้ตัด ฟันเขี้ยวแหลมใช้ฉีก ฟันกรามผิวกว้างใช้บด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nutrition-digestion.p006
    topics: [biology.humans.nutrition-digestion]
    difficulty: 2
    type: mcq
    stem: "ต้นกล้ากินข้าวมันไก่กับน้ำอัดลมเป็นมื้อกลางวันทุกวัน ควรเพิ่มอาหารใดเพื่อให้ได้สารอาหารครบมากขึ้น"
    choices:
      - { id: a, text: "ผักลวกและผลไม้ เช่น ส้ม", correct: true }
      - { id: b, text: "ข้าวเหนียวอีกห่อ", feedback: "ข้าวมันไก่มีแป้งมากพอแล้ว ข้าวเหนียวให้คาร์โบไฮเดรตเพิ่มอีก ไม่ได้เติมสารอาหารที่ขาด" }
      - { id: c, text: "หนังไก่ทอด", feedback: "ข้าวมันหุงด้วยน้ำมันไก่ ได้ไขมันมากแล้ว หนังไก่ทอดเพิ่มไขมันอีก" }
      - { id: d, text: "น้ำอัดลมอีกขวด", feedback: "น้ำอัดลมให้น้ำตาลซึ่งเป็นพลังงาน แต่ไม่มีวิตามินหรือแร่ธาตุ" }
    hints:
      - "ข้าวมันไก่มีคาร์โบไฮเดรต โปรตีน และไขมันแล้ว"
      - "สารอาหารใดที่ได้จากผักและผลไม้"
    solution: "ข้าวมันไก่ขาดผักและผลไม้ ควรเพิ่มผักและผลไม้เพื่อให้ได้วิตามิน แร่ธาตุ และใยอาหาร และเปลี่ยนน้ำอัดลมเป็นน้ำเปล่าหรือนมจืด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nutrition-digestion.p007
    topics: [biology.humans.nutrition-digestion]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "เลือกอาหารริมทางที่ปลอดภัยต่อสุขภาพ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ไข่เจียวที่ทอดใหม่ ๆ ร้อน ๆ", correct: true }
      - { id: b, text: "ผลไม้ตัดแต่งในตู้ที่มีฝาปิด แช่น้ำแข็ง", correct: true }
      - { id: c, text: "ลูกชิ้นสีชมพูสดจัดที่วางไว้กลางแดดไม่มีฝาปิด", feedback: "สีที่ฉูดฉาดอาจมาจากสีที่ไม่ใช่สีผสมอาหาร และอาหารที่ไม่ปิดอาจมีแมลงวันตอม" }
      - { id: d, text: "ยำหอยแครงลวกแบบยังไม่สุก", feedback: "อาหารทะเลดิบหรือสุก ๆ ดิบ ๆ อาจมีเชื้อโรคที่ทำให้ท้องเสีย" }
    hints:
      - "อาหารที่ผ่านความร้อนจนสุกทั่วปลอดภัยกว่า"
      - "ดูว่าอาหารมีการปิดป้องกันแมลงและฝุ่นหรือไม่"
    solution: "เลือกอาหารที่สุกใหม่ สะอาด และปิดมิดชิด เลี่ยงอาหารสีฉูดฉาด อาหารไม่สุก และอาหารที่วางทิ้งไว้ไม่ปิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nutrition-digestion.p008
    topics: [biology.humans.nutrition-digestion]
    difficulty: 3
    type: numeric
    stem: "ภาพแสดงฟันแท้ของขากรรไกรบน ขากรรไกรล่างมีฟันแต่ละชนิดเท่ากับขากรรไกรบน ทั้งปากมีฟันที่ใช้บดอาหาร (ฟันกรามน้อยและฟันกราม) รวมกี่ซี่"
    figure: { src: teeth.svg, alt: "ฟันแท้ขากรรไกรบน 16 ซี่เรียงเป็นโค้ง คำอธิบายสี: ฟันตัด 4 ซี่ อยู่ด้านหน้า ฟันเขี้ยว 2 ซี่ ฟันกรามน้อย 4 ซี่ และฟันกราม 6 ซี่อยู่ด้านในสุด" }
    answer: { value: 20, unit: ซี่ }
    hints:
      - "ขากรรไกรบนมีฟันกรามน้อยและฟันกรามรวมกันกี่ซี่"
      - "ขากรรไกรล่างมีเท่ากัน ให้คูณ 2"
    misconceptions:
      - { match: 10, feedback: "นับเฉพาะขากรรไกรบน ต้องรวมขากรรไกรล่างด้วย" }
      - { match: 12, feedback: "นับเฉพาะฟันกราม ต้องรวมฟันกรามน้อยด้วย" }
    solution: "ขากรรไกรบนมีฟันกรามน้อย 4 + ฟันกราม 6 = 10 ซี่ ขากรรไกรล่างเท่ากัน ทั้งปาก $10 \\times 2 = 20$ ซี่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nutrition-digestion.p009
    topics: [biology.humans.nutrition-digestion]
    difficulty: 3
    type: numeric
    stem: "ฉลากขนมปังกรอบห่อหนึ่งเขียนว่า น้ำหนักสุทธิ 25 กรัม พลังงาน 1,800 kJ ต่อ 100 กรัม ถ้ากินหมดห่อจะได้พลังงานกี่กิโลจูล"
    answer: { value: 450, unit: kJ }
    hints:
      - "1,800 kJ เป็นพลังงานของขนม 100 กรัม ไม่ใช่ทั้งห่อ"
      - "ห่อนี้หนักเป็นกี่ส่วนของ 100 กรัม แล้วคูณกับ 1,800"
    misconceptions:
      - { match: 1800, feedback: "นี่คือพลังงานของขนม 100 กรัม ห่อนี้หนักแค่ 25 กรัม" }
      - { match: 45000, feedback: "คูณ 1,800 กับ 25 แล้วลืมหารด้วย 100" }
    solution: "$1800 \\times \\frac{25}{100} = 450\\ \\mathrm{kJ}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nutrition-digestion.p010
    topics: [biology.humans.nutrition-digestion]
    difficulty: 3
    type: mcq
    stem: "ถ้าอมข้าวสวยไว้ในปากนาน ๆ จะรู้สึกหวาน เพราะเหตุใด"
    choices:
      - { id: a, text: "น้ำลายมีเอนไซม์ที่ย่อยแป้งให้เป็นน้ำตาล", correct: true }
      - { id: b, text: "ฟันบดข้าวจนกลายเป็นน้ำตาล", feedback: "ฟันทำให้ข้าวชิ้นเล็กลง (ย่อยเชิงกล) แต่การเปลี่ยนแป้งเป็นน้ำตาลต้องใช้เอนไซม์ในน้ำลาย" }
      - { id: c, text: "ข้าวมีน้ำตาลอยู่แล้ว แค่ละลายออกมา", feedback: "ข้าวมีแป้งเป็นส่วนใหญ่ ซึ่งไม่หวาน ความหวานเกิดจากแป้งถูกย่อยเป็นน้ำตาล" }
      - { id: d, text: "กรดในกระเพาะไหลย้อนขึ้นมา", feedback: "การย่อยแป้งเริ่มที่ปาก และกรดในกระเพาะมีรสเปรี้ยว ไม่หวาน" }
    hints:
      - "การย่อยแป้งเริ่มที่อวัยวะใด"
      - "แป้งไม่หวาน แต่น้ำตาลหวาน"
    solution: "น้ำลายมีเอนไซม์ที่ย่อยแป้งเป็นน้ำตาล การย่อยเชิงเคมีของแป้งจึงเริ่มที่ปาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nutrition-digestion.p011
    topics: [biology.humans.nutrition-digestion]
    difficulty: 3
    type: order
    stem: "เรียงการส่งต่อพลังงาน จากต้นกำเนิดจนถึงเด็กที่วิ่งเล่นได้หลังกินไข่เจียว"
    items:
      - "ดวงอาทิตย์ให้แสง"
      - "ต้นข้าวโพดใช้แสงสร้างอาหารเก็บในเมล็ด"
      - "แม่ไก่กินข้าวโพดแล้วออกไข่"
      - "เด็กกินไข่เจียว"
      - "ร่างกายเด็กใช้พลังงานวิ่งเล่น"
    hints:
      - "พลังงานในอาหารทุกชนิดเริ่มจากแหล่งเดียวกัน"
      - "พืชได้พลังงานก่อน แล้วส่งต่อให้สัตว์ที่กินพืช"
    solution: "ดวงอาทิตย์ → ข้าวโพด → ไก่และไข่ → เด็ก → การเคลื่อนไหว พลังงานในอาหารของเราเคยเป็นพลังงานจากดวงอาทิตย์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nutrition-digestion.p012
    topics: [biology.humans.nutrition-digestion]
    difficulty: 4
    type: numeric
    stem: "แก้วอายุ 11 ปี ต้องการพลังงานวันละประมาณ 1,600 กิโลแคลอรี วันนี้มื้อเช้าได้ 400 มื้อกลางวัน 600 และขนมบ่าย 150 กิโลแคลอรี มื้อเย็นควรได้พลังงานประมาณกี่กิโลแคลอรี จึงจะพอดีกับความต้องการ"
    answer: { value: 450, unit: kcal }
    hints:
      - "รวมพลังงานที่กินไปแล้วก่อน"
      - "นำความต้องการทั้งวันลบด้วยพลังงานที่ได้ไปแล้ว"
    misconceptions:
      - { match: 1150, feedback: "นี่คือพลังงานที่กินไปแล้ว ต้องนำไปลบออกจาก 1,600" }
      - { match: 600, feedback: "ลืมหักขนมบ่าย 150 กิโลแคลอรี" }
    solution: "กินไปแล้ว $400 + 600 + 150 = 1150$ กิโลแคลอรี มื้อเย็นควรได้ $1600 - 1150 = 450$ กิโลแคลอรี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nutrition-digestion.p013
    topics: [biology.humans.nutrition-digestion]
    difficulty: 4
    type: mcq
    stem: "ผนังด้านในของลำไส้เล็กมีวิลลัสยื่นออกมาจำนวนมาก ลักษณะนี้ช่วยอย่างไร"
    choices:
      - { id: a, text: "เพิ่มพื้นที่ผิวในการดูดซึมสารอาหาร", correct: true }
      - { id: b, text: "ช่วยบดอาหารให้ละเอียด", feedback: "การบดอาหารเป็นหน้าที่ของฟันและการบีบตัวของกระเพาะ วิลลัสไม่ได้บด" }
      - { id: c, text: "ช่วยดูดน้ำกลับเป็นหลัก", feedback: "การดูดน้ำกลับเป็นหน้าที่สำคัญของลำไส้ใหญ่ วิลลัสในลำไส้เล็กเน้นดูดซึมสารอาหาร" }
      - { id: d, text: "ทำให้อาหารเคลื่อนเร็วขึ้น", feedback: "วิลลัสไม่ได้ดันอาหาร อาหารเคลื่อนเพราะลำไส้บีบตัว" }
    hints:
      - "ผ้าขนหนูที่มีขนยื่นออกมาซับน้ำได้ดีกว่าผ้าเรียบ"
      - "หน้าที่หลักของลำไส้เล็กคือย่อยจนสมบูรณ์และอะไรอีก"
    solution: "วิลลัสเพิ่มพื้นที่ผิวของผนังลำไส้เล็กมาก สารอาหารจึงถูกดูดซึมเข้าสู่เลือดได้มากและเร็ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.nutrition-digestion.p014
    topics: [biology.humans.nutrition-digestion]
    difficulty: 4
    type: numeric
    stem: "จากฉลากในภาพ ถั่วลิสงอบ 1 ถุงให้พลังงานมากกว่าข้าวเกรียบกุ้ง 1 ถุงกี่กิโลจูล"
