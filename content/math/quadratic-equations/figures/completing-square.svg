<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 300" width="330" height="300" font-family="sans-serif" font-size="16">
  <title>แบบจำลองพื้นที่ของการทำกำลังสองสมบูรณ์ x² + 6x</title>
  
  <polygon points="60.0,40.0 210.0,40.0 210.0,190.0 60.0,190.0" fill="#dbe8f7" stroke="#15211e" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="210.0,40.0 300.0,40.0 300.0,190.0 210.0,190.0" fill="#e2f0ed" stroke="#15211e" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="60.0,190.0 210.0,190.0 210.0,280.0 60.0,280.0" fill="#e2f0ed" stroke="#15211e" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="210.0,190.0 300.0,190.0 300.0,280.0 210.0,280.0" fill="#fbe9df" stroke="#b4521f" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="135.0" y="115.0" text-anchor="middle" dominant-baseline="middle" font-size="24" font-weight="bold" font-style="italic" fill="#1f5fa8">x²</text>
  <text x="255.0" y="115.0" text-anchor="middle" dominant-baseline="middle" font-size="20" font-weight="bold" font-style="italic" fill="#0a6b60">3x</text>
  <text x="135.0" y="235.0" text-anchor="middle" dominant-baseline="middle" font-size="20" font-weight="bold" font-style="italic" fill="#0a6b60">3x</text>
  <text x="255.0" y="225.0" text-anchor="middle" dominant-baseline="middle" font-size="20" font-weight="bold" fill="#b4521f">9</text>
  <text x="255.0" y="249.0" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#b4521f">(ที่ขาด)</text>
  <text x="135.0" y="26.0" text-anchor="middle" dominant-baseline="middle" font-style="italic" fill="#0a6b60">x</text>
  <text x="255.0" y="26.0" text-anchor="middle" dominant-baseline="middle" fill="#0a6b60">3</text>
  <text x="46.0" y="115.0" text-anchor="middle" dominant-baseline="middle" font-style="italic" fill="#0a6b60">x</text>
  <text x="46.0" y="235.0" text-anchor="middle" dominant-baseline="middle" fill="#0a6b60">3</text>
</svg>
