<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="sans-serif">
<title>ตัวอย่างประเภทของกิจกรรมนันทนาการ</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
<rect x="230.0" y="14.0" width="300.0" height="50.0" rx="12" fill="#1f4e9a" stroke="#1f4e9a" stroke-width="1.5" />
<text x="380.0" y="46.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#fff">ประเภทของกิจกรรมนันทนาการ</text>
<rect x="20.0" y="84.0" width="350.0" height="64.0" rx="10" fill="#eef3fa" stroke="#1f4e9a" stroke-width="1.5" />
<circle cx="50.0" cy="116.0" r="17.0" fill="#1f4e9a" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="50.0" y="122.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#fff">1</text>
<text x="78.0" y="111.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">ศิลปหัตถกรรม</text>
<text x="78.0" y="134.0" font-size="13" text-anchor="start" font-weight="normal" fill="#333">เช่น วาดภาพ จักสาน พับกระดาษ</text>
<rect x="390.0" y="84.0" width="350.0" height="64.0" rx="10" fill="#eef3fa" stroke="#1f4e9a" stroke-width="1.5" />
<circle cx="420.0" cy="116.0" r="17.0" fill="#1f4e9a" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="420.0" y="122.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#fff">2</text>
<text x="448.0" y="111.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">เกมและกีฬา</text>
<text x="448.0" y="134.0" font-size="13" text-anchor="start" font-weight="normal" fill="#333">เช่น ฟุตบอล หมากรุก ตะกร้อ</text>
<rect x="20.0" y="160.0" width="350.0" height="64.0" rx="10" fill="#eef3fa" stroke="#1f4e9a" stroke-width="1.5" />
<circle cx="50.0" cy="192.0" r="17.0" fill="#1f4e9a" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="50.0" y="198.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#fff">3</text>
<text x="78.0" y="187.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">ดนตรีและการร้องเพลง</text>
<text x="78.0" y="210.0" font-size="13" text-anchor="start" font-weight="normal" fill="#333">เช่น เล่นอังกะลุง ร้องประสานเสียง</text>
<rect x="390.0" y="160.0" width="350.0" height="64.0" rx="10" fill="#eef3fa" stroke="#1f4e9a" stroke-width="1.5" />
<circle cx="420.0" cy="192.0" r="17.0" fill="#1f4e9a" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="420.0" y="198.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#fff">4</text>
<text x="448.0" y="187.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">เต้นรำและนาฏศิลป์</text>
<text x="448.0" y="210.0" font-size="13" text-anchor="start" font-weight="normal" fill="#333">เช่น รำวง เต้นแอโรบิก</text>
<rect x="20.0" y="236.0" width="350.0" height="64.0" rx="10" fill="#eef3fa" stroke="#1f4e9a" stroke-width="1.5" />
<circle cx="50.0" cy="268.0" r="17.0" fill="#1f4e9a" stroke="#1f4e9a" stroke-width="1.5"/>
