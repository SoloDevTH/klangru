problems:
- id: business.accounting.budgeting-variance.p001
  topics:
  - business.accounting.budgeting-variance
  difficulty: 1
  type: mcq
  stem: ผลต่างค่าใช้จ่ายแบบ **น่าพอใจ (Favorable, F)** หมายถึงข้อใด
  choices:
  - id: a
    text: ค่าใช้จ่ายจริงต่ำกว่างบประมาณที่ควรเป็น
    correct: true
  - id: b
    text: ค่าใช้จ่ายจริงสูงกว่างบประมาณ
    feedback: นั่นคือผลต่างไม่น่าพอใจ (U)
  - id: c
    text: ไม่มีผลต่างเลย
    feedback: ผลต่างเป็นศูนย์คือเท่างบพอดี
  - id: d
    text: ผู้จัดการทำงานดีแน่นอน
    feedback: ผลต่าง F อาจเกิดจากการลดคุณภาพหรือเลื่อนค่าใช้จ่ายที่จำเป็น ต้องหาสาเหตุก่อนสรุป
  hints:
  - F = ผลดีต่อกำไร
  - ค่าใช้จ่ายน้อยกว่าที่คาดทำให้กำไรมากขึ้นหรือน้อยลง
  solution: ผลต่างของค่าใช้จ่ายเป็น **F** เมื่อจ่ายจริงต่ำกว่างบ (กำไรสูงขึ้น) และเป็น **U** เมื่อจ่ายจริงสูงกว่างบ แต่ F ไม่ได้แปลว่าดีเสมอ ต้องวิเคราะห์สาเหตุ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.budgeting-variance.p002
  topics:
  - business.accounting.budgeting-variance
  difficulty: 1
  type: match
  stem: จับคู่งบประมาณกับคำถามที่งบนั้นตอบ
  pairs:
  - left: งบประมาณขาย
    right: จะขายได้กี่หน่วย และมีรายได้เท่าไร
  - left: งบประมาณการผลิต
    right: ต้องผลิตกี่หน่วยให้พอขายและเหลือสต็อกตามต้องการ
  - left: งบประมาณเงินสด
    right: เงินสดจะพอจ่ายหรือไม่ ต้องกู้ช่วงไหน
  - left: งบประมาณยืดหยุ่น
    right: ต้นทุนควรเป็นเท่าไรที่ระดับกิจกรรมจริง
  hints:
  - งบประมาณขายเป็นจุดเริ่มของงบอื่นทั้งหมด
  - งบยืดหยุ่นปรับตามจำนวนที่ทำได้จริง
  solution: งบขาย → หน่วยและรายได้ · งบการผลิต → จำนวนที่ต้องผลิต · งบเงินสด → สภาพคล่อง · งบยืดหยุ่น → ต้นทุนที่ควรเป็นตามกิจกรรมจริง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.budgeting-variance.p003
  topics:
  - business.accounting.budgeting-variance
  difficulty: 2
  type: numeric
  stem: ร้านกาแฟ (สมมติ) พยากรณ์ว่าเดือนหน้าจะขายได้ $6{,}000$ แก้ว ตั้งราคาแก้วละ $60$ บาท งบประมาณขาย (รายได้) เป็นกี่บาท (ตอบเป็นบาท)
  answer:
    value: 360000
    unit: บาท
  misconceptions:
  - match: 132000
    feedback: ใช้ต้นทุนแทนราคาขาย
  hints:
  - งบประมาณขาย $=$ จำนวนที่คาดว่าจะขาย $\times$ ราคาต่อหน่วย
  - ตัวเลขจำนวนแก้วมาจากการพยากรณ์ยอดขาย
  solution: งบประมาณขาย $= 6{,}000 \times 60 = 360{,}000$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.budgeting-variance.p004
  topics:
  - business.accounting.budgeting-variance
  difficulty: 2
  type: numeric
  stem: โรงคั่วกาแฟ (สมมติ) คาดว่าเดือนเมษายนจะขายกาแฟสกัดเย็นบรรจุขวด $4{,}000$ ขวด ต้องการให้มีสินค้าปลายเดือนเท่ากับ $20\%$ ของยอดขายเดือนพฤษภาคม (คาดว่าขาย $5{,}000$ ขวด) และมีสินค้าต้นเดือนเมษายน $800$ ขวด ต้องผลิตในเดือนเมษายนกี่ขวด (ตอบเป็นขวด)
  answer:
    value: 4200
    unit: ขวด
  misconceptions:
  - match: 5800
    feedback: บวกสินค้าต้นงวด ต้องลบเพราะมีอยู่แล้ว ไม่ต้องผลิตเพิ่ม
  - match: 3800
    feedback: สลับเครื่องหมายของปลายงวดและต้นงวด
  hints:
  - สินค้าปลายงวดที่ต้องการ $= 20\% \times 5{,}000$
  - ผลิต $=$ ขาย $+$ ปลายงวดที่ต้องการ $-$ ต้นงวด
  solution: ปลายงวดที่ต้องการ $= 0.2 \times 5{,}000 = 1{,}000$ ขวด ผลิต $= 4{,}000 + 1{,}000 - 800 = 4{,}200$ ขวด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.budgeting-variance.p005
  topics:
  - business.accounting.budgeting-variance
  difficulty: 2
  type: numeric
  stem: ร้านกาแฟตั้งงบไว้ว่า ต้นทุนผันแปรแก้วละ $22$ บาท ต้นทุนคงที่เดือนละ $120{,}000$ บาท เดือนนี้ขายได้จริง $6{,}500$ แก้ว งบประมาณยืดหยุ่นของ **ต้นทุนรวม** เป็นกี่บาท (ตอบเป็นบาท)
  answer:
    value: 263000
    unit: บาท
  misconceptions:
  - match: 252000
    feedback: ใช้จำนวนแก้วตามงบเดิม (6,000) แต่งบยืดหยุ่นใช้จำนวนที่ขายจริง
  - match: 273000
    feedback: ปรับต้นทุนคงที่ตามจำนวนแก้วด้วย แต่ต้นทุนคงที่ไม่เปลี่ยนตามปริมาณ
  hints:
  - ต้นทุนผันแปรปรับตามจำนวนแก้วจริง ต้นทุนคงที่ไม่ปรับ
  - งบยืดหยุ่น $=$ ต้นทุนคงที่ $+$ ต้นทุนผันแปรต่อหน่วย $\times$ จำนวนจริง
  solution: งบยืดหยุ่น $= 120{,}000 + 22 \times 6{,}500 = 120{,}000 + 143{,}000 = 263{,}000$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.budgeting-variance.p006
  topics:
  - business.accounting.budgeting-variance
  difficulty: 3
  type: numeric
  stem: จากรายงานในภาพ ถ้าทำงบประมาณยืดหยุ่นที่จำนวนแก้วที่ขายจริง กำไรจากการดำเนินงานตามงบยืดหยุ่นเป็นกี่บาท (ตอบเป็นบาท)
  figure:
    src: p-report.svg
    alt: ตารางรายงานผลร้านกาแฟบ้านสวน เดือนมีนาคม (สมมติ) หน่วยบาท สองคอลัมน์ งบประมาณคงที่ และผลจริง จำนวนแก้ว 6,000 และ 6,500 รายได้ 360,000 และ 377,000 ต้นทุนผันแปร 132,000 และ 148,200 กำไรส่วนเกิน 228,000 และ 228,800 ต้นทุนคงที่ 120,000 และ 123,000 กำไรจากการดำเนินงาน 108,000 และ 105,800 หมายเหตุว่างบประมาณตั้งราคาแก้วละ 60 บาท ต้นทุนผันแปรแก้วละ 22 บาท ต้นทุนคงที่เดือนละ 120,000 บาท
  answer:
    value: 127000
    unit: บาท
  misconceptions:
  - match: 108000
    feedback: นั่นคือกำไรตามงบคงที่ที่ 6,000 แก้ว
  - match: 105800
    feedback: นั่นคือกำไรจริง
  hints:
  - รายได้ตามงบยืดหยุ่น $=$ ราคาตามงบ $\times$ จำนวนจริง
  - หักต้นทุนผันแปรตามงบต่อแก้ว $\times$ จำนวนจริง และต้นทุนคงที่ตามงบ
  solution: รายได้ $= 60 \times 6{,}500 = 390{,}000$ ต้นทุนผันแปร $= 22 \times 6{,}500 = 143{,}000$ กำไรส่วนเกิน $= 247{,}000$ หักต้นทุนคงที่ $120{,}000$ ได้กำไร $127{,}000$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.budgeting-variance.p007
  topics:
  - business.accounting.budgeting-variance
  difficulty: 3
  type: numeric
  stem: จากรายงานในภาพ กำไรจริงต่ำกว่ากำไรตามงบยืดหยุ่น (ผลต่างงบยืดหยุ่นของกำไร) กี่บาท (ตอบเป็นจำนวนบวก หน่วยบาท)
  figure:
    src: p-report.svg
    alt: ตารางรายงานผลร้านกาแฟบ้านสวน เดือนมีนาคม (สมมติ) หน่วยบาท สองคอลัมน์ งบประมาณคงที่ และผลจริง จำนวนแก้ว 6,000 และ 6,500 รายได้ 360,000 และ 377,000 ต้นทุนผันแปร 132,000 และ 148,200 กำไรส่วนเกิน 228,000 และ 228,800 ต้นทุนคงที่ 120,000 และ 123,000 กำไรจากการดำเนินงาน 108,000 และ 105,800 หมายเหตุว่างบประมาณตั้งราคาแก้วละ 60 บาท ต้นทุนผันแปรแก้วละ 22 บาท ต้นทุนคงที่เดือนละ 120,000 บาท
  answer:
    value: 21200
    unit: บาท
  misconceptions:
  - match: 2200
    feedback: เทียบกับงบคงที่ ซึ่งปนผลของจำนวนแก้วที่ขายได้มากขึ้นเข้าไปด้วย
  - match: 19000
    feedback: นั่นคือผลต่างจากปริมาณขาย (F)
  hints:
  - หากำไรตามงบยืดหยุ่นที่ 6,500 แก้วก่อน
  - ผลต่าง $=$ กำไรตามงบยืดหยุ่น $-$ กำไรจริง
  solution: งบยืดหยุ่น $127{,}000$ − จริง $105{,}800$ $= 21{,}200$ บาท (U) มาจากราคาขายต่ำกว่างบ $13{,}000$ บาท ต้นทุนผันแปรเกินงบ $5{,}200$ บาท และต้นทุนคงที่เกินงบ $3{,}000$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.budgeting-variance.p008
  topics:
  - business.accounting.budgeting-variance
  difficulty: 3
  type: numeric
  stem: ร้านอาหาร (สมมติ) ได้รับเงินสด $70\%$ ของยอดขายในเดือนที่ขาย และอีก $30\%$ (ขายผ่านบัตรและบริษัทคู่สัญญา) ได้รับในเดือนถัดไป ยอดขายกุมภาพันธ์ $300{,}000$ บาท มีนาคม $340{,}000$ บาท งบประมาณเงินสดรับเดือนมีนาคมเป็นกี่บาท (ตอบเป็นบาท)
  answer:
    value: 328000
    unit: บาท
  misconceptions:
  - match: 340000
    feedback: ใช้ยอดขายทั้งหมดของมีนาคม แต่ 30% จะได้รับเดือนเมษายน
  - match: 340000
    feedback: ใช้ 30% ของมีนาคม ต้องใช้ 30% ของกุมภาพันธ์ที่เก็บได้ในมีนาคม
  hints:
  - เงินรับเดือนมีนาคมมาจากยอดขายสองเดือน
  - $70\%$ ของมีนาคม $+ 30\%$ ของกุมภาพันธ์
  solution: เงินสดรับ $= 0.7 \times 340{,}000 + 0.3 \times 300{,}000 = 238{,}000 + 90{,}000 = 328{,}000$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.budgeting-variance.p009
  topics:
  - business.accounting.budgeting-variance
  difficulty: 3
  type: mcq
  stem: ร้านกาแฟขายได้มากกว่างบ $500$ แก้ว ต้นทุนผันแปรจริงจึงสูงกว่างบประมาณคงที่ ผู้จัดการถูกตำหนิว่า "ใช้ต้นทุนเกินงบ" ข้อใดเป็นการประเมินที่เหมาะสมกว่า
  choices:
  - id: a
    text: เทียบต้นทุนจริงกับงบยืดหยุ่นที่จำนวนแก้วจริง เพราะขายมากขึ้นต้นทุนผันแปรต้องสูงขึ้นอยู่แล้ว
    correct: true
  - id: b
    text: เทียบกับงบคงที่ต่อไป เพราะงบคืองบ
    feedback: งบคงที่ไม่ได้ปรับตามปริมาณ จึงลงโทษผู้ที่ขายได้มาก
  - id: c
    text: ไม่ต้องเทียบงบ ดูแค่กำไรปีที่แล้ว
    feedback: การเทียบกับปีก่อนไม่บอกว่าต้นทุนที่ระดับกิจกรรมนี้ควรเป็นเท่าไร
  - id: d
    text: ตัดต้นทุนคงที่ออกจากรายงาน
    feedback: ต้นทุนคงที่ยังต้องควบคุม แต่ไม่ต้องปรับตามปริมาณ
  hints:
  - งบคงที่ทำไว้ที่ 6,000 แก้ว
  - ต้นทุนผันแปรควรเพิ่มตามจำนวนแก้วเสมอ
  solution: งบประมาณยืดหยุ่นปรับต้นทุนผันแปรตามกิจกรรมจริง จึงแยกได้ว่าผลต่างเกิดจากปริมาณขาย (นอกการควบคุมต้นทุนบางส่วน) หรือจากการใช้ทรัพยากรไม่มีประสิทธิภาพ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.budgeting-variance.p010
  topics:
  - business.accounting.budgeting-variance
  difficulty: 3
  type: numeric
  stem: มาตรฐานของร้านกาแฟคือใช้เมล็ดกาแฟแก้วละ $18$ กรัม ราคามาตรฐานกรัมละ $0.80$ บาท เดือนนี้ขาย $6{,}500$ แก้ว ซื้อและใช้เมล็ดกาแฟจริง $123{,}500$ กรัม ราคาจริงกรัมละ $0.76$ บาท (สมมติ) **ผลต่างราคา** วัตถุดิบเป็นกี่บาท (ตอบขนาดเป็นจำนวนบวก หน่วยบาท)
  answer:
    value: 4940
    unit: บาท
  misconceptions:
  - match: 4680
    feedback: คูณด้วยปริมาณมาตรฐาน ผลต่างราคาต้องคูณปริมาณจริง
  - match: 5200
    feedback: นั่นคือผลต่างปริมาณ
  hints:
  - ผลต่างราคา $= (AP - SP) \times AQ$
  - ใช้ปริมาณที่ซื้อและใช้จริง ไม่ใช่ปริมาณมาตรฐาน
  solution: $(0.76 - 0.80) \times 123{,}500 = -4{,}940$ บาท ขนาด $4{,}940$ บาท เป็นผลต่าง **F** เพราะซื้อได้ถูกกว่ามาตรฐาน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.budgeting-variance.p011
  topics:
  - business.accounting.budgeting-variance
  difficulty: 4
  type: numeric
  stem: จากข้อมูลเดียวกัน (มาตรฐาน $18$ กรัมต่อแก้ว ราคามาตรฐาน $0.80$ บาทต่อกรัม ขาย $6{,}500$ แก้ว ใช้จริง $123{,}500$ กรัม) **ผลต่างปริมาณ** วัตถุดิบเป็นกี่บาท (ตอบขนาดเป็นจำนวนบวก หน่วยบาท)
  answer:
    value: 5200
    unit: บาท
  misconceptions:
  - match: 12400
    feedback: ใช้ SQ จากจำนวนแก้วตามงบ (6,000) ต้องใช้จำนวนแก้วที่ขายจริง
  - match: 4940
    feedback: คูณด้วยราคาจริง ผลต่างปริมาณต้องคูณราคามาตรฐาน
  hints:
  - ปริมาณมาตรฐานของผลผลิตจริง $SQ = 6{,}500 \times 18$
  - ผลต่างปริมาณ $= (AQ - SQ) \times SP$
  solution: $SQ = 6{,}500 \times 18 = 117{,}000$ กรัม ผลต่าง $= (123{,}500 - 117{,}000) \times 0.80 = 5{,}200$ บาท เป็น **U** เพราะใช้เมล็ดมากกว่ามาตรฐาน $6{,}500$ กรัม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.budgeting-variance.p012
  topics:
  - business.accounting.budgeting-variance
  difficulty: 4
  type: mcq
  stem: ผลต่างเมล็ดกาแฟเดือนนี้ ผลต่างราคา F แต่ผลต่างปริมาณ U มากกว่า สาเหตุใดสมเหตุสมผลที่สุด และควรทำอย่างไร
  choices:
  - id: a
    text: ฝ่ายจัดซื้อซื้อเมล็ดเกรดต่ำราคาถูก คั่วแล้วเสียมาก ต้องใช้เมล็ดมากขึ้น ควรทบทวนการเลือกผู้ขายร่วมกันทั้งฝ่ายซื้อและฝ่ายผลิต
    correct: true
  - id: b
    text: ทุกอย่างดีแล้ว เพราะมีผลต่าง F อยู่หนึ่งรายการ
    feedback: ผลต่างรวมยังเป็น U และสองผลต่างอาจมีสาเหตุเดียวกัน
  - id: c
    text: ควรลงโทษบาริสต้าทันทีเพราะผลต่างปริมาณ U
    feedback: ต้องหาสาเหตุก่อน ผลต่างปริมาณอาจมาจากวัตถุดิบคุณภาพต่ำที่ฝ่ายซื้อเลือก
  - id: d
    text: ควรยกเลิกการใช้ต้นทุนมาตรฐาน
    feedback: มาตรฐานช่วยให้เห็นปัญหานี้ ควรใช้ต่อและปรับปรุงให้เหมาะสม
  hints:
  - ผลต่างสองรายการอาจเกี่ยวกัน
  - ราคาถูกอาจแลกกับคุณภาพ
  solution: การซื้อของถูกกว่ามาตรฐานแต่คุณภาพต่ำ อาจทำให้ใช้ปริมาณมากขึ้นหรือเสียมากขึ้น ผลต่างราคา F จึงถูกกลบด้วยผลต่างปริมาณ U การวิเคราะห์ผลต่างจึงต้องหาสาเหตุและผู้รับผิดชอบร่วมกัน ไม่ตัดสินจากตัวเลขรายการเดียว
