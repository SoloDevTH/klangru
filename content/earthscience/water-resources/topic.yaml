id: earthscience.hydrosphere.water-resources
subject: earthscience
title: { th: แหล่งน้ำผิวดิน น้ำใต้ดิน และการใช้น้ำอย่างยั่งยืน, en: "Surface water, groundwater and sustainable water use" }
summary: ปัจจัยและกระบวนการเกิดแหล่งน้ำผิวดินและน้ำใต้ดิน ความพรุนและความซึมได้ ชั้นหินอุ้มน้ำ ผลของการใช้น้ำเกินสมดุล และการวางแผนใช้น้ำอย่างยั่งยืนในท้องถิ่น
difficulty: 3
minutes: 35
prerequisites: [earthscience.hydrosphere.water-cycle, earthscience.geology.earth-structure-surface]
encompasses:
  - { id: earthscience.hydrosphere.water-cycle, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: น้ำใต้ดินและชั้นหินอุ้มน้ำ
    src: aquifer.svg
    alt: "ภาพตัดพื้นดินที่ลาดลงจากเนินด้านซ้ายไปหาแม่น้ำด้านขวา ฝนตกบนเนินซึ่งเป็นพื้นที่รับน้ำ มีลูกศรแสดงน้ำซึมลง ชั้นบนสุดเป็นชั้นทราย แบ่งเป็นเขตอิ่มอากาศ (น้ำในดิน) ด้านบนกับเขตอิ่มน้ำด้านล่าง คั่นด้วยเส้นประระดับน้ำใต้ดินซึ่งลาดลงไปบรรจบแม่น้ำ ชั้นทรายส่วนที่อิ่มน้ำคือชั้นหินอุ้มน้ำไม่มีแรงดัน ใต้ลงไปเป็นชั้นหินกันน้ำ (ดินเหนียว) แล้วเป็นชั้นหินอุ้มน้ำมีแรงดัน (ทราย กรวด) ซึ่งโผล่ถึงผิวดินบนเนิน ล่างสุดเป็นหินแข็ง บ่อน้ำตื้นเจาะลงไปใต้ระดับน้ำใต้ดินเล็กน้อย บ่อน้ำบาดาลพุเจาะทะลุดินเหนียวลงไปถึงชั้นที่มีแรงดัน น้ำพุ่งขึ้นเหนือพื้น เส้นจุดสีม่วงแสดงระดับแรงดันของน้ำในชั้นที่มีแรงดัน ซึ่งอยู่สูงกว่าผิวดินตรงบ่อน้ำบาดาลพุ"
    caption: "น้ำใต้ดินอยู่ในช่องว่างของดินและหิน ไม่ใช่แม่น้ำใต้ดิน (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน ความหนาของชั้นขยายในแนวตั้ง)"
  - type: worked-example
    title: ชั้นหินอุ้มน้ำเก็บน้ำได้เท่าใด
    problem: "ชั้นกรวดใต้ทุ่งนาแห่งหนึ่งกว้าง 2 km ยาว 3 km หนา 8 m ความพรุน 0.20 ถ้าหมู่บ้านใช้น้ำวันละ $500\\ \\mathrm{m^3}$ น้ำในชั้นนี้เทียบได้กับน้ำที่หมู่บ้านใช้กี่วัน (ถ้าไม่มีน้ำเติมเลย)"
    steps:
      - text: "ปริมาตรชั้นกรวด $= 2000 \\times 3000 \\times 8 = 4.8 \\times 10^7\\ \\mathrm{m^3}$"
        why: "แปลงทุกความยาวเป็นเมตรก่อนคูณ"
      - text: "น้ำในช่องว่าง $= 4.8 \\times 10^7 \\times 0.20 = 9.6 \\times 10^6\\ \\mathrm{m^3}$"
        why: "น้ำอยู่เฉพาะในช่องว่าง ซึ่งมี 20% ของปริมาตร"
      - text: "จำนวนวัน $= 9.6 \\times 10^6 / 500 = 19{,}200$ วัน หรือราว 53 ปี"
      - text: "ในความจริงสูบออกได้น้อยกว่านี้ เพราะน้ำบางส่วนเกาะติดเม็ดกรวด และถ้าระดับน้ำลดมากบ่อจะแห้งก่อน"
    answer: "ราว 19,200 วัน (ค่าสูงสุดตามทฤษฎี) การใช้อย่างยั่งยืนจึงดูที่น้ำที่เติมเข้ามาแต่ละปี ไม่ใช่น้ำที่สะสมไว้ทั้งหมด"
  - { type: check, problem: earthscience.hydrosphere.water-resources.p004, prompt: "การทดลองนี้วัดความพรุนหรือความซึมได้" }
  - type: worked-example
    title: วางแผนน้ำฤดูแล้งของโรงเรียน
    problem: "โรงเรียนในจังหวัดบุรีรัมย์มีหลังคาอาคาร $600\\ \\mathrm{m^2}$ ฝนในฤดูฝนรวม 1,000 mm (ค่าสมมติ) โรงเรียนต้องการน้ำรดแปลงผักวันละ $2\\ \\mathrm{m^3}$ ตลอดฤดูแล้ง 150 วัน น้ำฝนจากหลังคาพอหรือไม่ และควรทำอะไรเพิ่ม"
    steps:
      - text: "น้ำฝนที่เก็บได้ $= 600 \\times 1.0 \\times 0.8 = 480\\ \\mathrm{m^3}$"
        why: "ใช้สัดส่วน 0.8 เพราะน้ำบางส่วนระเหยและกระเด็นออกนอกราง"
      - text: "น้ำที่ต้องใช้ $= 2 \\times 150 = 300\\ \\mathrm{m^3}$"
      - text: "น้ำฝนมากกว่าความต้องการ แต่ต้องมีที่เก็บอย่างน้อย $300\\ \\mathrm{m^3}$ ไว้ใช้ในฤดูแล้ง"
        why: "ฝนตกในฤดูฝน แต่ใช้น้ำในฤดูแล้ง ปัญหาจึงอยู่ที่การเก็บ ไม่ใช่ปริมาณฝน"
      - text: "ทางเลือก เช่น ถังเก็บน้ำหลายใบ หรือสระที่บดอัดดินเหนียวรองก้น ปลูกต้นไม้บังลมลดการระเหย และให้น้ำแบบน้ำหยดเพื่อลดน้ำที่ต้องใช้"
    answer: "น้ำฝนพอ (480 m³ > 300 m³) ถ้ามีที่เก็บอย่างน้อย 300 m³ และใช้น้ำอย่างประหยัด"
  - { type: check, problem: earthscience.hydrosphere.water-resources.p007 }
glossary:
  - { term: น้ำผิวดิน, definition: "น้ำบนผิวโลก เช่น แม่น้ำ ลำคลอง ทะเลสาบ บึง และอ่างเก็บน้ำ" }
  - { term: ลุ่มน้ำ, definition: "พื้นที่ที่รับน้ำฝนแล้วไหลลงแม่น้ำสายเดียวกัน แบ่งกับลุ่มน้ำอื่นด้วยสันปันน้ำ" }
  - { term: น้ำในดิน, definition: "น้ำในเขตอิ่มอากาศ ช่องว่างมีทั้งอากาศและน้ำ พืชดูดน้ำส่วนนี้ไปใช้" }
  - { term: น้ำบาดาล, definition: "น้ำในเขตอิ่มน้ำ ซึ่งช่องว่างในชั้นดินและชั้นหินเต็มไปด้วยน้ำ" }
  - { term: ระดับน้ำใต้ดิน, definition: "รอยต่อระหว่างเขตอิ่มอากาศกับเขตอิ่มน้ำ ขึ้นในฤดูฝนและลดลงในฤดูแล้ง" }
  - { term: ความพรุน, definition: "สัดส่วนของช่องว่างต่อปริมาตรทั้งหมดของดินหรือหิน" }
  - { term: ความซึมได้, definition: "ความสามารถของดินหรือหินที่ให้น้ำไหลผ่าน ขึ้นกับขนาดและการต่อกันของช่องว่าง" }
  - { term: ชั้นหินอุ้มน้ำ, definition: "ชั้นดินหรือหินที่เก็บน้ำได้มากและให้น้ำไหลผ่านได้ดี เช่น ทราย กรวด" }
  - { term: ชั้นหินกันน้ำ, definition: "ชั้นที่น้ำซึมผ่านได้ยาก เช่น ดินเหนียว หินดินดาน" }
flashcards:
  - { front: "น้ำในดิน กับ น้ำบาดาล ต่างกันอย่างไร", back: "น้ำในดินอยู่ในเขตอิ่มอากาศเหนือระดับน้ำใต้ดิน น้ำบาดาลอยู่ในเขตอิ่มน้ำใต้ระดับน้ำใต้ดิน" }
  - { front: "ความพรุน กับ ความซึมได้", back: "ความพรุนบอกว่าเก็บน้ำได้มากเท่าใด ความซึมได้บอกว่าน้ำไหลผ่านได้ง่ายเท่าใด ดินเหนียวพรุนมากแต่ซึมได้น้อย" }
  - { front: "ปริมาณน้ำในชั้นหินอุ้มน้ำ", back: "ปริมาตรชั้นหิน × ความพรุน" }
  - { front: "ใช้น้ำใต้ดินอย่างยั่งยืน", back: "สูบไม่เกินที่ฝนเติมให้ในแต่ละปี และป้องกันไม่ให้น้ำปนเปื้อน" }
  - { front: "สูบน้ำบาดาลมากเกินไปทำให้เกิดอะไร", back: "ระดับน้ำใต้ดินลด บ่อแห้ง แผ่นดินทรุด และน้ำเค็มรุกเข้าชั้นหินอุ้มน้ำใกล้ชายฝั่ง" }
