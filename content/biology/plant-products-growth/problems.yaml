problems:
  - id: biology.plants.plant-products-growth.p001
    topics: [biology.plants.plant-products-growth]
    difficulty: 1
    type: mcq
    stem: "หยดสารละลายเบเนดิกต์ลงในน้ำองุ่นแล้วต้มในน้ำเดือด ได้ตะกอนสีแดงอิฐ แสดงว่าน้ำองุ่นมีสารใด"
    choices:
      - { id: a, text: "น้ำตาลรีดิวซ์ เช่น กลูโคส", correct: true }
      - { id: b, text: "แป้ง", feedback: "แป้งทดสอบด้วยสารละลายไอโอดีน ได้สีน้ำเงินเข้ม" }
      - { id: c, text: "โปรตีน", feedback: "โปรตีนทดสอบด้วยสารละลายไบยูเรต ได้สีม่วง" }
      - { id: d, text: "ลิพิด", feedback: "ลิพิดทดสอบด้วยการถูบนกระดาษหรือซูดานทรี" }
    hints:
      - "สารละลายเบเนดิกต์ใช้ทดสอบน้ำตาล"
      - "ตะกอนสีแดงอิฐเกิดเมื่อมีน้ำตาลรีดิวซ์มาก"
    solution: "เบเนดิกต์ที่ต้มแล้วได้ตะกอนสีแดงอิฐแสดงว่ามีน้ำตาลรีดิวซ์ เช่น กลูโคสและฟรักโทสในน้ำองุ่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-products-growth.p002
    topics: [biology.plants.plant-products-growth]
    difficulty: 1
    type: match
    stem: "จับคู่สารที่ใช้ทดสอบกับผลเมื่อพบสารอาหาร"
    pairs:
      - { left: "สารละลายไอโอดีน", right: "สีน้ำเงินเข้มเมื่อพบแป้ง" }
      - { left: "สารละลายเบเนดิกต์ (ต้ม)", right: "ตะกอนสีแดงอิฐเมื่อพบน้ำตาลรีดิวซ์" }
      - { left: "สารละลายไบยูเรต", right: "สีม่วงเมื่อพบโปรตีน" }
      - { left: "ซูดานทรี", right: "ชั้นน้ำมันสีแดงเมื่อพบลิพิด" }
    hints:
      - "สารที่ต้องต้มคือสารที่ใช้ทดสอบน้ำตาล"
      - "ไบยูเรตใช้ทดสอบสารที่มีพันธะเพปไทด์"
    solution: "ไอโอดีนทดสอบแป้ง เบเนดิกต์ทดสอบน้ำตาลรีดิวซ์ ไบยูเรตทดสอบโปรตีน และซูดานทรีทดสอบลิพิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-products-growth.p003
    topics: [biology.plants.plant-products-growth]
    difficulty: 1
    type: text
    stem: "หยดสารละลายไอโอดีนบนหัวมันสำปะหลังที่ผ่าครึ่ง ได้สีน้ำเงินเข้มเกือบดำ หัวมันสำปะหลังมีสารอาหารใดมาก"
    accepted: ["แป้ง", "starch", "สตาร์ช"]
    hints:
      - "สารละลายไอโอดีนใช้ทดสอบสารอาหารชนิดเดียว"
      - "มันสำปะหลังใช้ทำแป้งมันและสาคู"
    misconceptions:
      - { match: "น้ำตาล", feedback: "น้ำตาลทดสอบด้วยเบเนดิกต์ ไอโอดีนเปลี่ยนสีเมื่อพบแป้ง" }
      - { match: "โปรตีน", feedback: "โปรตีนทดสอบด้วยไบยูเรต" }
    solution: "สารละลายไอโอดีนเปลี่ยนจากสีน้ำตาลเป็นสีน้ำเงินเข้มเมื่อพบแป้ง หัวมันสำปะหลังเป็นที่สะสมแป้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-products-growth.p004
    topics: [biology.plants.plant-products-growth]
    difficulty: 2
    type: mcq
    stem: "นักเรียนต้องการทดสอบว่าแสงมีผลต่อการเจริญเติบโตของต้นกล้าถั่วเขียวหรือไม่ จึงวางกระถางหนึ่งในที่สว่างและอีกกระถางในกล่องทึบ ข้อใดเป็นตัวแปรควบคุม"
    choices:
      - { id: a, text: "ปริมาณน้ำที่รดในแต่ละวัน", correct: true }
      - { id: b, text: "การได้รับแสงหรือไม่ได้รับแสง", feedback: "นี่คือตัวแปรต้น คือสิ่งที่ตั้งใจเปลี่ยน" }
      - { id: c, text: "ความสูงของต้นกล้าในวันที่ 7", feedback: "นี่คือตัวแปรตาม คือสิ่งที่วัดผล" }
    hints:
      - "ตัวแปรควบคุมคือสิ่งที่ต้องทำให้เท่ากันทุกชุด"
      - "ถ้าสิ่งนี้ต่างกัน จะสรุปไม่ได้ว่าผลเกิดจากแสง"
    solution: "ตัวแปรต้นคือแสง ตัวแปรตามคือความสูง ส่วนปริมาณน้ำต้องเท่ากันทุกชุดจึงเป็นตัวแปรควบคุม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-products-growth.p005
    topics: [biology.plants.plant-products-growth]
    difficulty: 2
    type: match
    stem: "จับคู่พืชกับการใช้ประโยชน์จากสารที่พืชสร้าง"
    pairs:
      - { left: "สะเดา", right: "สารสกัดไล่และยับยั้งหนอนศัตรูพืช" }
      - { left: "ฟ้าทะลายโจร", right: "ยาบรรเทาอาการหวัด" }
      - { left: "คราม", right: "สีน้ำเงินสำหรับย้อมผ้า" }
      - { left: "ตะไคร้หอม", right: "น้ำมันไล่ยุง" }
    hints:
      - "พืชเหล่านี้สร้างสารเพื่อป้องกันตัวเอง คนจึงนำมาใช้ต่อ"
      - "ผ้าที่ย้อมในสกลนครมีสีน้ำเงิน"
    solution: "สะเดาใช้ไล่หนอน ฟ้าทะลายโจรใช้บรรเทาหวัด ครามใช้ย้อมสีน้ำเงิน และตะไคร้หอมใช้ไล่ยุง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-products-growth.p006
    topics: [biology.plants.plant-products-growth]
    difficulty: 2
    type: numeric
    stem: "จากกราฟ ในวันที่ 7 ต้นกล้าในที่มืดสูงกว่าต้นกล้าในที่สว่างโดยเฉลี่ยกี่เซนติเมตร"
    figure: { src: seedling-height.svg, alt: "กราฟเส้นความสูงเฉลี่ยของต้นกล้าถั่วเขียวชุดละ 20 ต้น แกนนอนเป็นวันที่ 0 ถึง 7 แกนตั้งเป็นความสูงเฉลี่ยเป็นเซนติเมตร ต้นในที่สว่างใบสีเขียว สูง 0, 1.0, 2.5, 4.0, 5.2, 6.3, 7.1, 7.8 ต้นในที่มืดใบสีเหลืองซีด สูง 0, 1.2, 3.4, 5.9, 8.5, 11.0, 13.2, 15.0 เป็นข้อมูลสมมติ" }
    answer: { value: 7.2, unit: cm, tolerance: 0.05 }
    hints:
      - "อ่านค่าความสูงของทั้งสองเส้นที่วันที่ 7"
      - "นำค่าที่มากกว่าลบค่าที่น้อยกว่า"
    misconceptions:
      - { match: 1.92, feedback: "นี่คืออัตราส่วน ข้อนี้ถามผลต่าง" }
      - { match: 15, feedback: "นี่คือความสูงของต้นในที่มืด ยังไม่ได้ลบความสูงของต้นในที่สว่าง" }
    solution: "วันที่ 7 ต้นในที่มืดสูง 15.0 cm ต้นในที่สว่างสูง 7.8 cm ผลต่าง $15.0 - 7.8 = 7.2$ cm"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-products-growth.p007
    topics: [biology.plants.plant-products-growth]
    difficulty: 3
    type: mcq
    stem: "จากกราฟ ต้นกล้าในที่มืดสูงกว่าแต่ใบมีสีเหลืองซีด ข้อใดอธิบายได้ถูกต้องที่สุด"
    figure: { src: seedling-height.svg, alt: "กราฟเส้นความสูงเฉลี่ยของต้นกล้าถั่วเขียวชุดละ 20 ต้น แกนนอนเป็นวันที่ 0 ถึง 7 แกนตั้งเป็นความสูงเฉลี่ยเป็นเซนติเมตร ต้นในที่สว่างใบสีเขียว สูง 0, 1.0, 2.5, 4.0, 5.2, 6.3, 7.1, 7.8 ต้นในที่มืดใบสีเหลืองซีด สูง 0, 1.2, 3.4, 5.9, 8.5, 11.0, 13.2, 15.0 เป็นข้อมูลสมมติ" }
    choices:
      - { id: a, text: "ในที่มืดต้นกล้าไม่สร้างคลอโรฟิลล์และยืดตัวโดยใช้อาหารที่สะสมในเมล็ด", correct: true }
      - { id: b, text: "ในที่มืดต้นกล้าสังเคราะห์ด้วยแสงได้มากกว่า จึงสูงกว่า", feedback: "การสังเคราะห์ด้วยแสงต้องใช้แสง ในที่มืดจึงสร้างอาหารไม่ได้" }
      - { id: c, text: "แสงทำลายต้นกล้า ต้นในที่สว่างจึงเตี้ยกว่า", feedback: "แสงจำเป็นต่อการสร้างอาหาร ต้นในที่สว่างเตี้ยกว่าเพราะไม่ยืดตัว แต่แข็งแรงกว่า" }
    hints:
      - "สีเขียวของใบมาจากสารอะไร และต้องใช้อะไรในการสร้าง"
      - "ในที่มืดต้นกล้าได้พลังงานมาจากไหน"
    solution: "ในที่มืดต้นกล้าไม่สร้างคลอโรฟิลล์ ใบจึงเหลืองซีด ต้นกล้ายืดตัวเพื่อหาแสงโดยใช้อาหารที่สะสมในเมล็ด ความสูงจึงไม่ได้แปลว่าเติบโตดีกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-products-growth.p008
    topics: [biology.plants.plant-products-growth]
    difficulty: 3
    type: mcq
    stem: "นักเรียนทดสอบน้ำอ้อยสดคั้นใหม่ด้วยสารละลายเบเนดิกต์และต้มแล้ว สีแทบไม่เปลี่ยน ทั้งที่น้ำอ้อยหวานมาก ข้อใดอธิบายได้ถูกต้อง"
    choices:
      - { id: a, text: "น้ำตาลส่วนใหญ่ในน้ำอ้อยเป็นซูโครส ซึ่งไม่ใช่น้ำตาลรีดิวซ์", correct: true }
      - { id: b, text: "น้ำอ้อยไม่มีน้ำตาลเลย ความหวานมาจากแป้ง", feedback: "แป้งไม่มีรสหวาน และอ้อยสะสมน้ำตาลซูโครสไว้ในลำต้น" }
      - { id: c, text: "ต้มนานเกินไป น้ำตาลจึงระเหยไปหมด", feedback: "น้ำตาลไม่ระเหยเมื่อต้มในน้ำเดือด ปัญหาอยู่ที่ชนิดของน้ำตาล" }
    hints:
      - "น้ำตาลทุกชนิดให้ผลกับเบเนดิกต์หรือไม่"
      - "อ้อยลำเลียงและสะสมน้ำตาลชนิดใด"
    solution: "อ้อยสะสมซูโครส ซึ่งไม่ใช่น้ำตาลรีดิวซ์ จึงให้ผลกับเบเนดิกต์น้อย ถ้าต้มกับกรดเจือจางก่อน ซูโครสจะแตกเป็นกลูโคสและฟรักโทส แล้วจึงให้ตะกอนสีแดงอิฐ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-products-growth.p009
    topics: [biology.plants.plant-products-growth]
    difficulty: 3
    type: numeric
    stem: "จากกราฟ ต้นกล้าในที่สว่างสูงขึ้นเฉลี่ยวันละกี่เซนติเมตร ตั้งแต่วันที่ 0 ถึงวันที่ 7 ตอบทศนิยม 2 ตำแหน่ง"
    figure: { src: seedling-height.svg, alt: "กราฟเส้นความสูงเฉลี่ยของต้นกล้าถั่วเขียวชุดละ 20 ต้น แกนนอนเป็นวันที่ 0 ถึง 7 แกนตั้งเป็นความสูงเฉลี่ยเป็นเซนติเมตร ต้นในที่สว่างใบสีเขียว สูง 0, 1.0, 2.5, 4.0, 5.2, 6.3, 7.1, 7.8 ต้นในที่มืดใบสีเหลืองซีด สูง 0, 1.2, 3.4, 5.9, 8.5, 11.0, 13.2, 15.0 เป็นข้อมูลสมมติ" }
    answer: { value: 1.11, unit: cm/วัน, tolerance: 0.01 }
    hints:
      - "อัตราการเติบโต = ความสูงที่เพิ่มขึ้น ÷ จำนวนวัน"
      - "จากวันที่ 0 ถึงวันที่ 7 ผ่านไปกี่วัน"
    misconceptions:
      - { match: 0.98, feedback: "หารด้วย 8 ซึ่งเป็นจำนวนจุดข้อมูล แต่ผ่านไปเพียง 7 วัน" }
      - { match: 2.14, feedback: "นี่คืออัตราของต้นในที่มืด" }
    solution: "ความสูงเพิ่มจาก 0 เป็น 7.8 cm ใน 7 วัน อัตรา $7.8 \\div 7 \\approx 1.11$ cm ต่อวัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-products-growth.p010
    topics: [biology.plants.plant-products-growth]
    difficulty: 3
    type: numeric
    stem: "จากกราฟ อุณหภูมิที่เหมาะสมที่สุดต่อการเจริญเติบโตของต้นถั่วเขียวในการทดลองนี้คือกี่องศาเซลเซียส"
    figure: { src: dry-mass-temperature.svg, alt: "กราฟแท่งมวลแห้งรวมของต้นถั่วเขียว 10 ต้นหลังปลูก 3 สัปดาห์ที่อุณหภูมิต่าง ๆ 15 °C 1.2 กรัม 20 °C 2.6 กรัม 25 °C 3.9 กรัม 30 °C 4.4 กรัม 35 °C 3.1 กรัม 40 °C 0.9 กรัม เป็นข้อมูลสมมติ ตัวแปรอื่นควบคุมให้เท่ากัน" }
    answer: { value: 30, unit: "°C" }
    hints:
      - "อุณหภูมิที่เหมาะสมคืออุณหภูมิที่พืชเติบโตได้มากที่สุด"
      - "หาแท่งที่สูงที่สุด แล้วอ่านอุณหภูมิใต้แท่งนั้น"
    misconceptions:
      - { match: 40, feedback: "40 °C เป็นอุณหภูมิสูงสุดที่ทดลอง แต่พืชเติบโตได้น้อยที่สุด อุณหภูมิสูงเกินไปไม่ได้ดีกว่าเสมอ" }
      - { match: 4.4, feedback: "4.4 คือมวลแห้งเป็นกรัม ข้อนี้ถามอุณหภูมิ" }
    solution: "มวลแห้งมากที่สุด 4.4 g ที่ 30 °C อุณหภูมิที่เหมาะสมในการทดลองนี้จึงประมาณ 30 °C"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-products-growth.p011
    topics: [biology.plants.plant-products-growth]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการทดสอบว่าเมล็ดถั่วเหลืองมีโปรตีนหรือไม่"
    items:
      - "บดเมล็ดถั่วเหลืองที่แช่น้ำแล้วกับน้ำกลั่นเล็กน้อย แล้วกรอง"
      - "แบ่งของเหลวใส่หลอดทดลอง และเตรียมหลอดน้ำกลั่นเป็นชุดควบคุม"
      - "หยดสารละลายไบยูเรตลงทั้งสองหลอดในปริมาณเท่ากัน"
      - "สังเกตและบันทึกสีของทั้งสองหลอด"
      - "สรุปผลโดยเทียบกับหลอดน้ำกลั่น"
    hints:
      - "ต้องเตรียมตัวอย่างให้เป็นของเหลวก่อน"
      - "ชุดควบคุมต้องได้รับสารทดสอบเหมือนชุดทดลอง"
    solution: "บดและกรองตัวอย่าง → แบ่งใส่หลอดพร้อมหลอดน้ำกลั่น → หยดไบยูเรต → สังเกตสี → สรุปเทียบกับชุดควบคุม ถ้าหลอดถั่วเหลืองเป็นสีม่วงแต่หลอดน้ำกลั่นยังเป็นสีฟ้า แสดงว่ามีโปรตีน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-products-growth.p012
    topics: [biology.plants.plant-products-growth]
    difficulty: 4
    type: numeric
    stem: "จากกราฟ เมื่ออุณหภูมิเพิ่มจาก 30 °C เป็น 40 °C มวลแห้งลดลงร้อยละเท่าใด ตอบทศนิยม 1 ตำแหน่ง"
