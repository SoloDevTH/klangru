id: math.algebra.polynomials
subject: math
title: { th: พหุนามและการคูณพหุนาม, en: Polynomials and multiplying polynomials }
summary: รู้จักเอกนาม พหุนาม และดีกรี บวก ลบ คูณพหุนามด้วยการกระจาย และใช้ผลคูณพิเศษ เช่น กำลังสองของผลบวก และผลบวกคูณผลต่าง
difficulty: 3.5
minutes: 35
prerequisites: [math.algebra.expressions, math.number.exponents]
encompasses:
  - { id: math.algebra.expressions, weight: 0.5 }
  - { id: math.number.exponents, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: square-of-sum.svg
    alt: "สี่เหลี่ยมจัตุรัสด้านยาว a + b แบ่งเป็นสี่ส่วน สี่เหลี่ยมจัตุรัส a² มุมซ้ายบน สี่เหลี่ยมจัตุรัส b² มุมขวาล่าง และสี่เหลี่ยมผืนผ้า ab สองชิ้น"
    caption: "$(a + b)^2 = a^2 + 2ab + b^2$ มีสี่เหลี่ยมผืนผ้า $ab$ สองชิ้น จึงไม่เท่ากับ $a^2 + b^2$"
  - { type: check, problem: math.poly.p014, prompt: "ดูตัวแปรและเลขชี้กำลังของแต่ละพจน์" }
  - type: worked-example
    title: คูณทวินามด้วยตาราง
    problem: "กระจาย $(x + 5)(x - 2)$"
    steps:
      - text: "วางพจน์ของวงเล็บแรก $x$ และ $5$ ไว้ด้านข้าง และพจน์ของวงเล็บที่สอง $x$ และ $-2$ ไว้ด้านบนของตาราง $2 \\times 2$"
        why: "ตารางคือแบบจำลองพื้นที่ แต่ละช่องคือผลคูณของพจน์หนึ่งคู่ จึงไม่ลืมพจน์ใด"
      - text: "เติมช่อง: $x \\cdot x = x^2$, $x \\cdot (-2) = -2x$, $5 \\cdot x = 5x$, $5 \\cdot (-2) = -10$"
      - text: "รวมพจน์คล้าย: $-2x + 5x = 3x$"
      - text: "ได้ $x^2 + 3x - 10$ ตรวจด้วย $x = 1$: $(6)(-1) = -6$ และ $1 + 3 - 10 = -6$ ✓"
    answer: "$(x + 5)(x - 2) = x^2 + 3x - 10$"
  - type: worked-example
    title: พิสูจน์เอกลักษณ์แล้วใช้คิดเลข
    problem: "แสดงว่า $(n + 1)^2 - n^2 = 2n + 1$ สำหรับทุกจำนวน $n$ แล้วหา $51^2 - 50^2$"
    steps:
      - text: "กระจาย $(n + 1)^2 = n^2 + 2n + 1$"
        why: "ใช้ผลคูณพิเศษ $(a + b)^2 = a^2 + 2ab + b^2$ โดย $a = n$, $b = 1$"
      - text: "ลบ $n^2$: $n^2 + 2n + 1 - n^2 = 2n + 1$ ซึ่งเท่ากับข้างขวา จึงเป็นจริงทุกค่าของ $n$"
        why: "การพิสูจน์ต้องจัดรูปข้างหนึ่งให้เหมือนอีกข้างด้วยกฎพีชคณิต ไม่ใช่แค่ลองแทนตัวเลขบางค่า"
      - text: "ความหมาย: จำนวนกำลังสองที่ติดกันต่างกันเป็นจำนวนคี่ 3, 5, 7, … เสมอ"
      - text: "แทน $n = 50$: $51^2 - 50^2 = 2(50) + 1 = 101$ ตรวจ: $2601 - 2500 = 101$ ✓"
    answer: "$(n + 1)^2 - n^2 = 2n + 1$ และ $51^2 - 50^2 = 101$"
  - { type: check, problem: math.poly.p018, prompt: "คิดว่าการดำเนินการใดให้ผลเป็นพหุนามเสมอ" }
  - type: simulation
    title: แบบจำลองพื้นที่กับพีชคณิต (PhET Area Model Algebra)
    url: https://phet.colorado.edu/en/simulations/area-model-algebra
    provider: phet
    note: ตั้งความกว้างและความยาวของสี่เหลี่ยมเป็นพหุนาม เช่น x + 3 และ x + 2 แล้วดูว่าพื้นที่แบ่งเป็นชิ้นย่อยกี่ชิ้น แต่ละชิ้นคือพจน์หนึ่งในผลคูณที่กระจายแล้ว
glossary:
  - { term: เอกนาม, definition: "นิพจน์ที่เป็นผลคูณของค่าคงตัวกับตัวแปรที่มีเลขชี้กำลังเป็นจำนวนเต็มบวกหรือศูนย์ เช่น $5$, $-3x^2$, $4xy^3$" }
  - { term: พหุนาม, definition: "เอกนามหรือผลบวกของเอกนามหลายตัว เช่น $2x^2 - 3x + 7$" }
  - { term: ดีกรี, definition: "ดีกรีของเอกนามคือผลบวกเลขชี้กำลังของตัวแปรทุกตัว ดีกรีของพหุนามคือดีกรีสูงสุดของพจน์ในพหุนามนั้น" }
  - { term: พจน์คล้าย, definition: "เอกนามที่มีตัวแปรชุดเดียวกันและเลขชี้กำลังของแต่ละตัวแปรเท่ากัน เช่น $3x^2$ กับ $-5x^2$ บวกลบรวมกันได้" }
flashcards:
  - { front: "$(a + b)^2$ เท่ากับเท่าใด", back: "$a^2 + 2ab + b^2$ (ไม่ใช่ $a^2 + b^2$)" }
  - { front: "$(a - b)^2$ เท่ากับเท่าใด", back: "$a^2 - 2ab + b^2$" }
  - { front: "$(a + b)(a - b)$ เท่ากับเท่าใด", back: "$a^2 - b^2$ (ผลต่างกำลังสอง พจน์กลางหักล้างกันหมด)" }
  - { front: "$x^2 \\cdot x^3$ เท่ากับเท่าใด", back: "$x^5$ คูณเลขยกกำลังฐานเดียวกันให้บวกเลขชี้กำลัง" }
  - { front: "ดีกรีของ $3x^2y^3$ คือเท่าใด", back: "$2 + 3 = 5$ บวกเลขชี้กำลังของทุกตัวแปร" }
