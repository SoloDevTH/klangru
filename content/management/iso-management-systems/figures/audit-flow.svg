<text x="822.0" y="126.0" text-anchor="middle" font-size="12" fill="#222">ตรวจว่าแก้ไข</text>
<text x="822.0" y="146.0" text-anchor="middle" font-size="12" fill="#222">ได้ผลจริง</text>
<rect x="24.0" y="210.0" width="852.0" height="100.0" rx="8" fill="#fffaf0" stroke="#a0581c" stroke-width="1.5"/>
<text x="40.0" y="236.0" text-anchor="start" font-size="14" font-weight="bold" fill="#222">ข้อพบที่ไม่เป็นไปตามข้อกำหนดที่เขียนดีมีสามส่วน</text>
<text x="40.0" y="262.0" text-anchor="start" font-size="13" fill="#222">1) ข้อกำหนด: ระบบกำหนดว่าอะไร · 2) หลักฐาน: พบอะไรจริง ที่ไหน กี่รายการ</text>
<text x="40.0" y="286.0" text-anchor="start" font-size="13" fill="#222">3) ข้อความสรุป: สิ่งที่พบไม่เป็นไปตามข้อกำหนดอย่างไร (เขียนตามข้อเท็จจริง ไม่กล่าวโทษบุคคล)</text>
</svg>