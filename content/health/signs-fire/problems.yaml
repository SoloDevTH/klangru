problems:
  - id: health.safety.signs-fire.p001
    topics: [health.safety.signs-fire]
    difficulty: 1
    type: mcq
    stem: "ป้ายสี่เหลี่ยมสีเขียว มีรูปคนวิ่งออกประตู หมายถึงอะไร"
    choices:
      - { id: a, text: "ทางหนีไฟหรือทางออกฉุกเฉิน", correct: true }
      - { id: b, text: "ห้ามวิ่ง", feedback: "ป้ายห้ามเป็นวงกลมขอบแดงมีขีดคาด ป้ายสีเขียวบอกทางที่ปลอดภัย" }
      - { id: c, text: "ระวังคนวิ่งชน", feedback: "ป้ายเตือนเป็นสามเหลี่ยมสีเหลือง ป้ายสีเขียวบอกทางที่ปลอดภัย" }
    hints:
      - "สีเขียวหมายถึงปลอดภัย"
      - "รูปคนกำลังออกจากประตู"
    solution: "ป้ายสี่เหลี่ยมสีเขียวรูปคนวิ่งออกประตู คือทางหนีไฟหรือทางออกฉุกเฉิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.signs-fire.p002
    topics: [health.safety.signs-fire]
    difficulty: 1
    type: mcq
    stem: "เห็นไฟไหม้ร้านค้าในตลาด ผู้ใหญ่ควรโทรแจ้งเบอร์ใด"
    choices:
      - { id: a, text: "199", correct: true }
      - { id: b, text: "1669", feedback: "1669 เรียกรถพยาบาลเมื่อมีคนเจ็บ ไฟไหม้ต้องโทร 199" }
      - { id: c, text: "1784", feedback: "1784 เป็นสายด่วนสาธารณภัย ไฟไหม้ที่กำลังเกิดขึ้นโทร 199 เพื่อเรียกรถดับเพลิง" }
    hints:
      - "เป็นเลขสามหลัก"
      - "เบอร์เรียกรถดับเพลิง"
    solution: "ไฟไหม้โทร 199 ถ้ามีคนบาดเจ็บโทร 1669 ด้วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.signs-fire.p003
    topics: [health.safety.signs-fire]
    difficulty: 1
    type: text
    stem: "เมื่อเห็นไฟไหม้ในบ้าน คำแรกที่ควรตะโกนบอกทุกคนคือคำว่าอะไร"
    accepted: ["ไฟไหม้", "ไฟไหม้!", "ไฟไหม้ไฟไหม้"]
    misconceptions:
      - { match: "ช่วยด้วย", feedback: "\"ช่วยด้วย\" ไม่ได้บอกว่าเกิดอะไร ต้องตะโกนว่า \"ไฟไหม้\" ให้ทุกคนรู้และหนีออกมา" }
    hints:
      - "ทุกคนต้องรู้ทันทีว่าเกิดอะไร"
      - "คำสั้น ๆ สองพยางค์"
    solution: "ตะโกน \"ไฟไหม้\" ให้ทุกคนรู้และออกจากบ้านทันที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.signs-fire.p004
    topics: [health.safety.signs-fire]
    difficulty: 2
    type: match
    stem: "ดูป้าย A ถึง E แล้วจับคู่กับความหมาย"
    figure:
      src: safety-signs-quiz.svg
      alt: "ป้ายห้าป้ายติดตัวอักษร A สี่เหลี่ยมสีเขียวมีรูปคนวิ่งออกประตู B วงกลมขอบแดงรูปเปลวไฟมีขีดคาด C สี่เหลี่ยมสีแดงมีรูปถังดับเพลิง D สามเหลี่ยมสีเหลืองขอบดำมีรูปสายฟ้า E วงกลมสีฟ้ามีรูปศีรษะสวมหมวก"
    pairs:
      - { left: "A", right: "ทางหนีไฟ" }
      - { left: "B", right: "ห้ามจุดไฟ" }
      - { left: "C", right: "ที่ตั้งถังดับเพลิง" }
      - { left: "D", right: "ระวังไฟฟ้าแรงสูง" }
      - { left: "E", right: "ต้องสวมหมวกนิรภัย" }
    hints:
      - "ดูสีและรูปร่างก่อน แล้วค่อยดูรูปข้างใน"
      - "แดงขีดคาด = ห้าม เหลืองสามเหลี่ยม = ระวัง ฟ้าวงกลม = ต้องทำ เขียว = ปลอดภัย แดงสี่เหลี่ยม = อุปกรณ์ดับเพลิง"
    solution: "A ทางหนีไฟ B ห้ามจุดไฟ C ถังดับเพลิง D ระวังไฟฟ้าแรงสูง E ต้องสวมหมวกนิรภัย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.signs-fire.p005
    topics: [health.safety.signs-fire]
    difficulty: 2
    type: mcq
    stem: "ป้ายแบบใดหมายถึง \"ระวังอันตราย\""
    choices:
      - { id: a, text: "สามเหลี่ยมพื้นสีเหลือง ขอบดำ", correct: true }
      - { id: b, text: "วงกลมพื้นสีฟ้า", feedback: "วงกลมสีฟ้าคือป้ายบังคับ หมายถึงต้องทำ" }
      - { id: c, text: "สี่เหลี่ยมพื้นสีเขียว", feedback: "สี่เหลี่ยมสีเขียวบอกทางหรือจุดที่ปลอดภัย" }
      - { id: d, text: "วงกลมขอบแดงมีขีดคาด", feedback: "วงกลมขอบแดงมีขีดคาดคือป้ายห้าม" }
    hints:
      - "สีที่สะดุดตาเหมือนไฟจราจรสีเหลือง"
      - "รูปร่างมีสามมุม"
    solution: "ป้ายเตือนเป็นสามเหลี่ยมพื้นสีเหลืองขอบดำ เช่น ระวังพื้นลื่น ระวังไฟฟ้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.signs-fire.p006
    topics: [health.safety.signs-fire]
    difficulty: 2
    type: order
    stem: "ไฟไหม้ในบ้านขณะที่เราอยู่ในห้องนั่งเล่น เรียงสิ่งที่ควรทำ"
    items:
      - "ตะโกนบอกทุกคนว่า \"ไฟไหม้\""
      - "ก้มต่ำ ปิดจมูก แล้วออกจากบ้านทางที่ใกล้และปลอดภัยที่สุด"
      - "ไปรวมกันที่จุดนัดพบนอกบ้าน และนับว่าครบทุกคน"
      - "ให้ผู้ใหญ่โทร 199 และไม่กลับเข้าไปในบ้าน"
    hints:
      - "เตือนคนอื่นก่อน แล้วจึงหนี"
      - "การโทรแจ้งทำเมื่ออยู่ในที่ปลอดภัยแล้ว"
    solution: "ตะโกนเตือน → ก้มต่ำปิดจมูกออกจากบ้าน → ไปจุดนัดพบนับคน → โทร 199 และไม่กลับเข้าไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.signs-fire.p007
    topics: [health.safety.signs-fire]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นสาเหตุของไฟไหม้ในบ้านได้ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "เสียบปลั๊กพ่วงต่อกันหลายอันจนปลั๊กร้อน", correct: true }
      - { id: b, text: "จุดเทียนทิ้งไว้ใกล้ผ้าม่านแล้วออกจากห้อง", correct: true }
      - { id: c, text: "ทิ้งกระทะน้ำมันไว้บนเตาที่เปิดอยู่", correct: true }
      - { id: d, text: "ปิดวาล์วแก๊สทุกครั้งหลังทำอาหาร", feedback: "การปิดวาล์วแก๊สเป็นการป้องกันอัคคีภัย" }
      - { id: e, text: "เก็บไฟแช็กไว้ในที่สูงพ้นมือเด็ก", feedback: "การเก็บไฟแช็กให้พ้นมือเด็กเป็นการป้องกัน" }
    hints:
      - "นึกถึงสามเหลี่ยมของไฟ: อะไรทำให้เกิดความร้อนใกล้เชื้อเพลิง"
      - "ข้อที่ถูกมีสามข้อ"
    solution: "ปลั๊กพ่วงร้อน เทียนใกล้ผ้าม่าน และกระทะน้ำมันบนเตาที่ไม่มีคนดู เป็นสาเหตุของไฟไหม้ ส่วนการปิดแก๊สและเก็บไฟแช็กเป็นการป้องกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.signs-fire.p008
    topics: [health.safety.signs-fire]
    difficulty: 2
    type: mcq
    stem: "ขวดยาฆ่าแมลงมีรูปหัวกะโหลกไขว้บนฉลาก หมายถึงอะไร"
    choices:
      - { id: a, text: "มีพิษ เป็นอันตรายถึงชีวิตถ้ากินหรือสูดดม", correct: true }
      - { id: b, text: "เป็นของสำหรับวันฮาโลวีน", feedback: "บนฉลากสินค้า รูปหัวกะโหลกไขว้เป็นสัญลักษณ์อันตรายจากสารพิษ" }
      - { id: c, text: "ไวไฟ", feedback: "สัญลักษณ์ไวไฟคือรูปเปลวไฟ หัวกะโหลกไขว้หมายถึงมีพิษ" }
    hints:
      - "สัญลักษณ์นี้เกี่ยวกับความตาย"
      - "เตือนเรื่องการกินหรือสูดดม"
    solution: "หัวกะโหลกไขว้หมายถึงสารพิษ ห้ามเด็กหยิบใช้ และผู้ใหญ่ต้องเก็บให้พ้นมือเด็ก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.signs-fire.p009
    topics: [health.safety.signs-fire]
    difficulty: 3
    type: mcq
    stem: "ระหว่างหนีไฟ เจอประตูที่ปิดอยู่ ควรทำอย่างไรก่อนเปิด"
    choices:
      - { id: a, text: "ใช้หลังมือแตะประตูและลูกบิด ถ้าร้อนอย่าเปิด ให้ใช้ทางอื่น", correct: true }
      - { id: b, text: "เปิดประตูออกไปทันทีให้เร็วที่สุด", feedback: "ถ้าอีกฝั่งมีไฟ การเปิดทันทีทำให้ไฟและควันพุ่งเข้าหาเรา" }
      - { id: c, text: "ใช้ฝ่ามือกำลูกบิดแน่น ๆ แล้วหมุน", feedback: "ลูกบิดอาจร้อนจนลวกฝ่ามือ ควรแตะด้วยหลังมือก่อน" }
    hints:
      - "อีกฝั่งของประตูอาจมีไฟ"
      - "แตะด้วยส่วนของมือที่ถ้าร้อนจะดึงออกได้เร็วและไม่เสียฝ่ามือ"
    solution: "ใช้หลังมือแตะประตูและลูกบิด ถ้าร้อนแสดงว่าอีกฝั่งมีไฟ ห้ามเปิด ให้ใช้ทางอื่น ถ้าไม่ร้อนให้เปิดช้า ๆ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.signs-fire.p010
    topics: [health.safety.signs-fire]
    difficulty: 3
    type: mcq
    stem: "ขณะจุดพลุในงานลอยกระทง ไฟติดชายเสื้อของต่อ ต่อควรทำอย่างไร"
    choices:
      - { id: a, text: "หยุด ล้มลงกับพื้น ใช้มือปิดหน้า แล้วกลิ้งไปมาจนไฟดับ", correct: true }
      - { id: b, text: "วิ่งไปหาแม่ที่อยู่ไกล ๆ", feedback: "การวิ่งทำให้มีลมพัด ไฟจะลุกแรงขึ้น" }
      - { id: c, text: "ใช้มือตบไฟที่เสื้อขณะยืนอยู่", feedback: "การยืนทำให้เปลวไฟลอยขึ้นหาใบหน้า และมืออาจถูกไฟลวก" }
    hints:
      - "ไฟต้องการออกซิเจน"
      - "จำคำว่า หยุด ล้ม กลิ้ง"
    solution: "หยุด ล้มลง ปิดหน้า แล้วกลิ้ง เพื่อทับไฟไม่ให้ได้ออกซิเจนและป้องกันใบหน้า จากนั้นบอกผู้ใหญ่ให้ดูแลแผลไหม้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.signs-fire.p011
    topics: [health.safety.signs-fire]
    difficulty: 3
    type: numeric
    stem: "โรงเรียนซ้อมหนีไฟสองครั้ง ครั้งแรกนักเรียนออกมาถึงจุดรวมพลครบในเวลา 5 นาที 20 วินาที ครั้งที่สองใช้เวลา 3 นาที 50 วินาที ครั้งที่สองเร็วขึ้นกี่วินาที (ตอบเป็นวินาที)"
    answer: { value: 90, unit: วินาที }
    misconceptions:
      - { match: 150, feedback: "150 ได้จาก 2 นาที 30 วินาที โดยกลับด้านลบวินาที (50 − 20) แต่ 20 วินาทีน้อยกว่า 50 วินาที ต้องเปลี่ยนเป็นวินาทีทั้งหมดก่อนลบ" }
      - { match: 1.7, feedback: "1.7 ได้จากลบแบบทศนิยม 5.20 − 3.50 แต่ 1 นาทีมี 60 วินาที ไม่ใช่ 100" }
    hints:
      - "เปลี่ยนเวลาทั้งสองครั้งเป็นวินาที (1 นาที = 60 วินาที)"
      - "5 × 60 + 20 และ 3 × 60 + 50 แล้วนำมาลบกัน"
    solution: "ครั้งแรก 5 × 60 + 20 = 320 วินาที ครั้งที่สอง 3 × 60 + 50 = 230 วินาที เร็วขึ้น 320 − 230 = 90 วินาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.signs-fire.p012
    topics: [health.safety.signs-fire]
    difficulty: 3
    type: mcq
    stem: "แม่ทอดไข่เจียว แล้วน้ำมันในกระทะลุกเป็นไฟ แม่ปิดเตาและเอาฝาหม้อปิดกระทะจนไฟดับ การปิดฝาทำให้ไฟดับเพราะตัดสิ่งใดออก"
    choices:
      - { id: a, text: "ออกซิเจน", correct: true }
      - { id: b, text: "เชื้อเพลิง", feedback: "น้ำมันยังอยู่ในกระทะ ฝาปิดกันอากาศไม่ให้เข้าไป" }
      - { id: c, text: "น้ำ", feedback: "น้ำไม่ใช่หนึ่งในสามเหลี่ยมของไฟ และห้ามราดน้ำลงบนน้ำมันที่ลุกไหม้ เพราะไฟจะกระเด็น" }
    hints:
      - "สามเหลี่ยมของไฟมีความร้อน เชื้อเพลิง และออกซิเจน"
      - "ฝาปิดกันอะไรไม่ให้เข้าไปในกระทะ"
    solution: "ฝาหม้อกันอากาศ จึงตัดออกซิเจน ส่วนการปิดเตาช่วยลดความร้อน ห้ามราดน้ำลงน้ำมันที่ลุกไหม้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.signs-fire.p013
    topics: [health.safety.signs-fire]
    difficulty: 3
    type: numeric
    stem: "จากที่นั่งในห้องเรียนถึงบันไดหนีไฟยาว 30 เมตร ถ้าเดินเร็วอย่างเป็นระเบียบ 1.5 เมตรต่อวินาที จะใช้เวลากี่วินาที (ตอบเป็นวินาที)"
    answer: { value: 20, unit: วินาที }
    misconceptions:
      - { match: 45, feedback: "นำ 30 × 1.5 ไม่ถูก เวลา = ระยะทาง ÷ อัตราเร็ว" }
      - { match: 0.05, feedback: "นำ 1.5 ÷ 30 กลับด้าน ต้องนำระยะทางหารด้วยอัตราเร็ว" }
    hints:
      - "เวลา = ระยะทาง ÷ อัตราเร็ว"
      - "นำ 30 หารด้วย 1.5"
    solution: "30 ÷ 1.5 = 20 วินาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.signs-fire.p014
    topics: [health.safety.signs-fire]
    difficulty: 4
    type: mcq
    stem: "บ้านของน้ำจุดธูปเทียนไหว้พระทุกเย็น หิ้งพระอยู่ใต้หน้าต่างที่มีผ้าม่าน และบางวันทุกคนออกไปกินข้าวนอกบ้านทั้งที่เทียนยังไม่ดับ ข้อใดป้องกันอัคคีภัยได้ตรงจุดที่สุด"
    choices:
      - { id: a, text: "ย้ายหิ้งหรือผ้าม่านให้ห่างกัน วางเทียนบนจานกันไฟ และดับธูปเทียนก่อนออกจากบ้านทุกครั้ง", correct: true }
      - { id: b, text: "เลิกไหว้พระ", feedback: "ไม่จำเป็นต้องเลิก แค่ต้องแยกเปลวไฟออกจากเชื้อเพลิงและไม่ทิ้งไว้โดยไม่มีคนดู" }
      - { id: c, text: "ซื้อเทียนเล่มเล็กลง", feedback: "เทียนเล็กก็จุดผ้าม่านได้ ปัญหาคือเปลวไฟอยู่ใกล้ผ้าม่านและไม่มีคนดู" }
    hints:
      - "หาว่าความร้อนอยู่ใกล้เชื้อเพลิงอะไร"
      - "การแก้ต้องแยกไฟจากเชื้อเพลิง และไม่ทิ้งไฟไว้"
    solution: "แยกเปลวไฟ (ความร้อน) ออกจากผ้าม่าน (เชื้อเพลิง) วางบนภาชนะกันไฟ และดับทุกครั้งก่อนออกจากบ้าน"
