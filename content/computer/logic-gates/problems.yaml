    stem: "ระบบใดต้องใช้ **วงจรเชิงลำดับ** ที่จำสถานะได้ ไม่สามารถใช้วงจรเชิงผสมอย่างเดียว"
    choices:
      - { id: a, text: "ไฟจราจรที่เปลี่ยนจากเขียว เป็นเหลือง เป็นแดง วนตามลำดับ", correct: true }
      - { id: b, text: "วงจรบวกครึ่งที่บวกบิตสองบิต", feedback: "ผลบวกขึ้นกับอินพุตตอนนี้เท่านั้น จึงเป็นวงจรเชิงผสม" }
      - { id: c, text: "ไฟทางเดินที่ติดเมื่อมืดและมีคนเดินผ่าน", feedback: "ผลขึ้นกับเซนเซอร์ตอนนี้เท่านั้น ไม่ต้องจำอดีต" }
      - { id: d, text: "สัญญาณกันขโมย $(D + W) \\cdot S$", feedback: "เอาต์พุตคำนวณจากอินพุตปัจจุบันทั้งหมด จึงเป็นวงจรเชิงผสม" }
    hints:
      - "ระบบใดต้องรู้ว่าตอนนี้อยู่ขั้นไหน จึงจะรู้ว่าขั้นต่อไปคืออะไร"
      - "วงจรเชิงผสมดูแค่อินพุตตอนนี้"
    solution: "ไฟจราจรต้องจำว่าตอนนี้เป็นสีอะไร จึงจะเปลี่ยนเป็นสีถัดไปได้ถูก จึงต้องมีสถานะ ส่วนข้ออื่นคำนวณจากอินพุตปัจจุบันอย่างเดียว"
