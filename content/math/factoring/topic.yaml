id: math.algebra.factoring
subject: math
title: { th: การแยกตัวประกอบของพหุนาม, en: Factoring polynomials }
summary: เขียนพหุนามดีกรีสองให้อยู่ในรูปผลคูณ ด้วยการดึงตัวร่วม การหาคู่จำนวน ผลต่างกำลังสอง และกำลังสองสมบูรณ์
difficulty: 4.5
minutes: 35
prerequisites: [math.algebra.polynomials, math.number.factors-multiples]
encompasses:
  - { id: math.algebra.polynomials, weight: 0.5 }
  - { id: math.number.factors-multiples, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: area-model.svg
    alt: "สี่เหลี่ยมผืนผ้าแบ่งเป็นสี่ช่อง ด้านบนยาว x + 3 แบ่งเป็นส่วน x กับ 3 ด้านซ้ายยาว x + 2 แบ่งเป็นส่วน x กับ 2 ช่องทั้งสี่มีพื้นที่ x², 3x, 2x และ 6"
    caption: "พื้นที่ทั้งหมด $x^2 + 5x + 6$ เท่ากับ กว้าง × ยาว $= (x + 2)(x + 3)$ การแยกตัวประกอบคือการหาด้านทั้งสองจากพื้นที่"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: ดึงตัวร่วมแล้วแยกต่อด้วยผลต่างกำลังสอง
    problem: "แยกตัวประกอบ $5x^2 - 20$ ให้ละเอียดที่สุด"
    steps:
      - text: "ห.ร.ม. ของ $5$ กับ $20$ คือ $5$ ดึงออกได้ $5x^2 - 20 = 5(x^2 - 4)$"
        why: "ดึงตัวร่วมก่อนเสมอ ตัวเลขในวงเล็บจะเล็กลงและเห็นรูปแบบพิเศษง่ายขึ้น"
      - text: "ในวงเล็บคือ $x^2 - 4 = x^2 - 2^2$ เป็นผลต่างกำลังสอง"
      - text: "ใช้ $a^2 - b^2 = (a + b)(a - b)$ ได้ $5(x + 2)(x - 2)$"
      - text: "ตรวจด้วย $x = 3$: นิพจน์เดิม $5(9) - 20 = 25$ และ $5(5)(1) = 25$ ✓"
        why: "แทนค่าตัวเลขเดียวกันในรูปเดิมและรูปผลคูณ ถ้าได้ค่าไม่ตรงกันแปลว่าแยกผิด"
    answer: "$5x^2 - 20 = 5(x + 2)(x - 2)$"
  - { type: check, problem: math.fac.p003, prompt: "ลองแยกตัวประกอบด้วยการหาคู่จำนวนดู" }
  - type: figure
    src: zeros-graph.svg
    alt: "กราฟพาราโบลา y = x² − 2x − 3 หรือ y = (x + 1)(x − 3) บนระนาบพิกัด เปิดขึ้น จุดต่ำสุดที่ (1, −4) ตัดแกน y ที่ −3 และตัดแกน x สองจุดที่ (−1, 0) และ (3, 0)"
    caption: "จุดที่กราฟตัดแกน $x$ คือค่า $x$ ที่ทำให้ตัวประกอบตัวใดตัวหนึ่งเป็นศูนย์"
  - type: worked-example
    title: จรวดขวดน้ำตกถึงพื้นเมื่อใด
    problem: "จรวดขวดน้ำของชมรมวิทยาศาสตร์มีความสูง $h = -5t^2 + 15t + 20$ เมตร เมื่อเวลาผ่านไป $t$ วินาที จรวดตกถึงพื้นเมื่อใด"
    steps:
      - text: "ถึงพื้นแปลว่า $h = 0$ จึงต้องแก้ $-5t^2 + 15t + 20 = 0$"
      - text: "ดึงตัวร่วม $-5$ ออก: $-5(t^2 - 3t - 4) = 0$"
        why: "ดึงจำนวนลบออกจะทำให้สัมประสิทธิ์ของ $t^2$ ในวงเล็บเป็น $1$ หาคู่จำนวนง่ายขึ้น"
      - text: "หาคู่ที่คูณได้ $-4$ และบวกได้ $-3$ คือ $-4$ กับ $1$ ได้ $-5(t - 4)(t + 1) = 0$"
      - text: "ผลคูณเป็นศูนย์ จึงได้ $t - 4 = 0$ หรือ $t + 1 = 0$ คือ $t = 4$ หรือ $t = -1$"
        why: "สมบัติผลคูณเป็นศูนย์: ตัวประกอบอย่างน้อยหนึ่งตัวต้องเป็นศูนย์ ส่วน $-5$ ไม่มีทางเป็นศูนย์"
      - text: "เวลาหลังปล่อยจรวดติดลบไม่ได้ จึงตัด $t = -1$ ทิ้ง ตรวจ: $-5(16) + 15(4) + 20 = -80 + 60 + 20 = 0$ ✓"
    answer: "จรวดตกถึงพื้นเมื่อ $t = 4$ วินาที"
  - { type: check, problem: math.fac.p017, prompt: "ใช้รูปผลคูณหาจุดตัดแกน x" }
  - type: interactive
    title: หา p กับ q ที่ทำให้กราฟสองเส้นทับกัน
    caption: เส้นแรกคือ x² + bx + c เส้นที่สองคือ (x + p)(x + q) เลื่อน p กับ q จนกราฟทับกันสนิท แล้วสังเกตว่า p + q เท่ากับ b และ pq เท่ากับ c เสมอ
    widget:
      kind: function-plot
      functions: ["x^2 + b x + c", "(x + p)(x + q)"]
      sliders:
        - { name: b, min: -8, max: 8, step: 1, value: 5, label: สัมประสิทธิ์ของ x }
        - { name: c, min: -12, max: 12, step: 1, value: 6, label: ค่าคงตัว }
        - { name: p, min: -6, max: 6, step: 1, value: 1 }
        - { name: q, min: -6, max: 6, step: 1, value: 1 }
      x: [-8, 4]
      y: [-6, 10]
  - type: simulation
    title: แบบจำลองพื้นที่กับพีชคณิต (PhET Area Model Algebra)
    url: https://phet.colorado.edu/en/simulations/area-model-algebra
    provider: phet
    note: ดูว่าผลคูณของพหุนามสองตัวคือพื้นที่ของสี่เหลี่ยมผืนผ้า การแยกตัวประกอบคือการหาด้านกว้างและยาวจากพื้นที่ที่รู้
glossary:
  - { term: การแยกตัวประกอบ, definition: "การเขียนพหุนามให้อยู่ในรูปผลคูณของพหุนามที่มีดีกรีต่ำกว่า เช่น $x^2 + 5x + 6 = (x + 2)(x + 3)$" }
  - { term: ตัวร่วม, definition: "นิพจน์ที่หารทุกพจน์ลงตัว ตัวร่วมที่มากที่สุดคือ ห.ร.ม. ของทุกพจน์" }
  - { term: ผลต่างกำลังสอง, definition: "นิพจน์รูป $a^2 - b^2$ ซึ่งแยกได้เป็น $(a + b)(a - b)$" }
  - { term: กำลังสองสมบูรณ์, definition: "พหุนามรูป $a^2 \\pm 2ab + b^2$ ซึ่งเท่ากับ $(a \\pm b)^2$" }
flashcards:
  - { front: "แยกตัวประกอบ $x^2 + bx + c$ อย่างไร", back: "หาจำนวน $p, q$ ที่ $pq = c$ และ $p + q = b$ แล้วเขียน $(x + p)(x + q)$" }
  - { front: "$a^2 - b^2$ แยกตัวประกอบได้เป็น", back: "$(a + b)(a - b)$" }
  - { front: "$x^2 + 10x + 25$ เป็นกำลังสองสมบูรณ์หรือไม่", back: "เป็น เพราะ $2 \\times x \\times 5 = 10x$ จึงเท่ากับ $(x + 5)^2$" }
  - { front: "ขั้นแรกของการแยกตัวประกอบทุกครั้งคืออะไร", back: "ดึงตัวร่วม (ห.ร.ม. ของทุกพจน์) ออกก่อน" }
  - { front: "ตรวจคำตอบการแยกตัวประกอบอย่างไร", back: "กระจายผลคูณกลับ ต้องได้พหุนามเดิม" }
