<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 320" width="340" height="320" font-family="sans-serif">
  <title>กราฟ f(x) = 3x − 1 รอบจุด x = 2 มีแถบแนวนอนรอบค่า 5 ที่กว้าง ε และแถบแนวตั้งรอบ x = 2 ที่กว้าง δ โดยเส้นกราฟผ่านมุมของกรอบพอดี</title>
  <rect x="125.0" y="80.0" width="100.0" height="120.0" fill="#e2f0ed" stroke="none"/>
  <line x1="50" y1="240" x2="300" y2="240" stroke="#15211e" stroke-width="1.2"/>
  <line x1="50" y1="240" x2="50" y2="19.99999999999997" stroke="#15211e" stroke-width="1.2"/>
  <line x1="50.0" y1="140.0" x2="300.0" y2="140.0" stroke="#15211e" stroke-width="0.6" stroke-dasharray="2 3"/>
  <line x1="125.00000000000001" y1="240" x2="125.00000000000001" y2="19.99999999999997" stroke="#0a6b60" stroke-width="1.6" stroke-dasharray="6 4"/>
  <line x1="225.00000000000006" y1="240" x2="225.00000000000006" y2="19.99999999999997" stroke="#0a6b60" stroke-width="1.6" stroke-dasharray="6 4"/>
  <line x1="50" y1="80.00000000000003" x2="300" y2="80.00000000000003" stroke="#b4521f" stroke-width="1.6" stroke-dasharray="6 4"/>
  <line x1="50" y1="199.99999999999997" x2="300" y2="199.99999999999997" stroke="#b4521f" stroke-width="1.6" stroke-dasharray="6 4"/>
  <polyline points="100.0,230.0 250.0,50.0" fill="none" stroke="#15211e" stroke-width="2.6"/>
  <circle cx="175.0" cy="140.0" r="4" fill="#15211e"/>
  <text x="168.0" y="128.0" text-anchor="end" font-size="13" fill="#15211e">(2, 5)</text>
  <text x="54" y="75.00000000000003" font-size="12" fill="#b4521f" font-weight="bold">L + ε</text>
  <text x="54" y="213.99999999999997" font-size="12" fill="#b4521f" font-weight="bold">L − ε</text>
  <text x="121.00000000000001" y="256" text-anchor="end" font-size="12" fill="#0a6b60" font-weight="bold">a − δ</text>
  <text x="229.00000000000006" y="256" font-size="12" fill="#0a6b60" font-weight="bold">a + δ</text>
  <text x="296" y="274" text-anchor="end" font-size="13" fill="#15211e">x</text>
  <text x="56" y="23.99999999999997" font-size="13" fill="#15211e">y</text>
  <text x="170.0" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#15211e">ทุก x ในแถบ δ ให้ y ในแถบ ε</text>
  <text x="170.0" y="312" text-anchor="middle" font-size="12" fill="#15211e">f(x) = 3x − 1 ที่ ε = 0.6 และ δ = 0.2 = ε/3</text>
</svg>
