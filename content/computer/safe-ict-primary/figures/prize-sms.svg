<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="360" height="380" font-family="sans-serif" font-size="15">
  <title>หน้าจอโทรศัพท์แสดงข้อความ SMS จากเบอร์ที่ไม่รู้จัก แจ้งว่าได้รับรางวัลและให้กดลิงก์ภายใน 1 ชั่วโมง</title>
  <rect x="0" y="0" width="360" height="380" fill="#ffffff"/>
  <rect x="40.0" y="10.0" width="280.0" height="360.0" rx="28" fill="#f7f8f8" stroke="#15211e" stroke-width="3" />
  <rect x="56.0" y="40.0" width="248.0" height="40.0" rx="0" fill="#fff" stroke="#cfd5d3" stroke-width="1" />
  <text x="180.0" y="66.0" text-anchor="middle" fill="#6b7672" font-weight="normal" font-size="14" >ข้อความจาก 0X-XXX-XXXX</text>
  <rect x="62.0" y="96.0" width="232.0" height="210.0" rx="14" fill="#eef1f0" stroke="#cfd5d3" stroke-width="1" />
  <text x="76.0" y="124.0" text-anchor="start" fill="#15211e" font-weight="normal" font-size="15" >ยินดีด้วย! เบอร์ของคุณได้รับ</text>
  <text x="76.0" y="150.0" text-anchor="start" fill="#15211e" font-weight="normal" font-size="15" >รางวัลโทรศัพท์มือถือ 1 เครื่อง</text>
  <text x="76.0" y="176.0" text-anchor="start" fill="#15211e" font-weight="normal" font-size="15" >กรอกชื่อ ที่อยู่ และรหัสผ่าน</text>
  <text x="76.0" y="202.0" text-anchor="start" fill="#15211e" font-weight="normal" font-size="15" >เพื่อรับรางวัลภายใน 1 ชั่วโมง</text>
  <text x="76.0" y="228.0" text-anchor="start" fill="#15211e" font-weight="normal" font-size="15" >มิฉะนั้นสิทธิ์จะถูกยกเลิก!</text>
  <text x="76.0" y="262.0" text-anchor="start" fill="#15211e" font-weight="normal" font-size="14" >กดเลย:</text>
  <text x="76.0" y="288.0" text-anchor="start" fill="#1f4e9c" font-weight="normal" font-size="12" text-decoration="underline">http://rangwan-free.example/claim</text>
  <text x="180.0" y="340.0" text-anchor="middle" fill="#6b7672" font-weight="normal" font-size="12" >เวลา 20:15</text>
</svg>
