problems:
  - id: biology.foundations.life-and-science.p001
    topics: [biology.foundations.life-and-science]
    difficulty: 1
    type: mcq
    stem: "หน่วยที่เล็กที่สุดที่ยังมีชีวิตคือข้อใด"
    choices:
      - { id: a, text: "เซลล์", correct: true }
      - { id: b, text: "อะตอม", feedback: "อะตอมเล็กกว่าเซลล์ แต่อะตอมไม่มีชีวิต ไม่มีเมแทบอลิซึมและสืบพันธุ์ไม่ได้" }
      - { id: c, text: "ออร์แกเนลล์", feedback: "ออร์แกเนลล์เป็นส่วนประกอบในเซลล์ แยกออกมาเดี่ยว ๆ แล้วดำรงชีวิตเองไม่ได้" }
      - { id: d, text: "เนื้อเยื่อ", feedback: "เนื้อเยื่อเกิดจากเซลล์หลายเซลล์รวมกัน จึงใหญ่กว่าหน่วยที่เล็กที่สุด" }
    hints:
      - "สิ่งมีชีวิตเซลล์เดียว เช่น แบคทีเรีย มีชีวิตอยู่ได้ด้วยเซลล์เพียงเซลล์เดียว"
      - "ระดับที่ต่ำกว่านี้ยังไม่มีสมบัติของสิ่งมีชีวิตครบ"
    solution: "เซลล์เป็นหน่วยที่เล็กที่สุดที่มีสมบัติของสิ่งมีชีวิตครบ ทั้งเมแทบอลิซึม การตอบสนอง และการสืบพันธุ์ อะตอม โมเลกุล และออร์แกเนลล์ยังไม่มีชีวิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.foundations.life-and-science.p002
    topics: [biology.foundations.life-and-science]
    difficulty: 1
    type: text
    stem: "ในการทดลอง สิ่งที่ผู้ทดลองตั้งใจเปลี่ยนให้แต่ละชุดต่างกัน เรียกว่าตัวแปรอะไร"
    accepted: ["ตัวแปรต้น", "ตัวแปรอิสระ"]
    hints:
      - "ตัวแปรนี้เป็น \"ต้นเหตุ\" ที่เราคาดว่าทำให้ผลเปลี่ยน"
      - "ตัวแปรที่เราวัดผลเรียกว่าตัวแปรตาม ส่วนตัวที่เราเปลี่ยนเองเรียกอีกชื่อหนึ่ง"
    misconceptions:
      - { match: "ตัวแปรตาม", feedback: "ตัวแปรตามคือผลที่วัดได้ ส่วนสิ่งที่ผู้ทดลองตั้งใจเปลี่ยนคือตัวแปรต้น" }
      - { match: "ตัวแปรควบคุม", feedback: "ตัวแปรควบคุมคือสิ่งที่ต้องให้เท่ากันทุกชุด ไม่ใช่สิ่งที่ตั้งใจเปลี่ยน" }
    solution: "สิ่งที่ผู้ทดลองตั้งใจเปลี่ยนคือ ตัวแปรต้น (ตัวแปรอิสระ) เช่น ความเข้มข้นของเกลือในการทดลองการงอกของเมล็ด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.foundations.life-and-science.p003
    topics: [biology.foundations.life-and-science]
    difficulty: 2
    type: match
    stem: "จับคู่เหตุการณ์กับสมบัติของสิ่งมีชีวิตที่แสดงให้เห็น"
    pairs:
      - { left: "วิ่งกลางแดดแล้วเหงื่อออกเพื่อลดอุณหภูมิร่างกาย", right: "รักษาดุลยภาพของร่างกาย" }
      - { left: "แบคทีเรียหนึ่งเซลล์แบ่งตัวเป็นสองเซลล์", right: "สืบพันธุ์" }
      - { left: "ลูกอ๊อดเจริญเป็นกบ", right: "เจริญเติบโตและพัฒนา" }
      - { left: "ตั๊กแตนใบไม้มีสีและรูปร่างเหมือนใบไม้ จึงรอดจากนกได้มากกว่า", right: "ปรับตัวและวิวัฒนาการ" }
      - { left: "เซลล์สลายกลูโคสเพื่อให้ได้พลังงาน", right: "เมแทบอลิซึม" }
      - { left: "รูม่านตาหดเล็กลงเมื่อเจอแสงจ้า", right: "ตอบสนองต่อสิ่งเร้า" }
    hints:
      - "ดุลยภาพคือการรักษาสภาพภายในให้คงที่ ส่วนการตอบสนองคือการตอบกลับสิ่งที่มากระตุ้นจากภายนอก"
      - "การเปลี่ยนรูปร่างระหว่างช่วงชีวิตคือพัฒนาการ ส่วนลักษณะที่ช่วยให้ประชากรรอดในสิ่งแวดล้อมคือการปรับตัว"
    solution: "เหงื่อออกเพื่อลดอุณหภูมิ → รักษาดุลยภาพ, แบคทีเรียแบ่งตัว → สืบพันธุ์, ลูกอ๊อดเป็นกบ → เจริญเติบโตและพัฒนา, ตั๊กแตนใบไม้ → ปรับตัวและวิวัฒนาการ, สลายกลูโคส → เมแทบอลิซึม, รูม่านตาหด → ตอบสนองต่อสิ่งเร้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.foundations.life-and-science.p004
    topics: [biology.foundations.life-and-science]
    difficulty: 2
    type: mcq
    stem: "ปลาทูทุกตัวที่อาศัยอยู่ในอ่าวไทยในปีเดียวกัน จัดเป็นการจัดระบบระดับใด"
    choices:
      - { id: a, text: "ประชากร", correct: true }
      - { id: b, text: "กลุ่มสิ่งมีชีวิต", feedback: "กลุ่มสิ่งมีชีวิตต้องมีสิ่งมีชีวิตหลายชนิด โจทย์พูดถึงปลาทูชนิดเดียว" }
      - { id: c, text: "ระบบนิเวศ", feedback: "ระบบนิเวศต้องรวมสิ่งมีชีวิตทุกชนิดและสิ่งไม่มีชีวิต เช่น น้ำทะเล แสง ด้วย" }
      - { id: d, text: "สิ่งมีชีวิต", feedback: "ระดับสิ่งมีชีวิตคือปลาทูหนึ่งตัว โจทย์พูดถึงปลาทูทุกตัว" }
    hints:
      - "มีสิ่งมีชีวิตกี่ชนิดในกลุ่มนี้"
      - "สิ่งมีชีวิตชนิดเดียวกันหลายตัวในที่เดียวกัน เวลาเดียวกัน"
    solution: "ปลาทูชนิดเดียวกันหลายตัวที่อยู่ในที่เดียวกัน (อ่าวไทย) ในช่วงเวลาเดียวกัน คือ ประชากร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.foundations.life-and-science.p005
    topics: [biology.foundations.life-and-science]
    difficulty: 2
    type: order
    stem: "เรียงระดับการจัดระบบของสิ่งมีชีวิตจากเล็กไปใหญ่"
    items:
      - "เซลล์"
      - "เนื้อเยื่อ"
      - "อวัยวะ"
      - "ระบบอวัยวะ"
      - "สิ่งมีชีวิต"
      - "ประชากร"
      - "ระบบนิเวศ"
    hints:
      - "เซลล์ชนิดเดียวกันรวมกันเป็นอะไร และอะไรรวมเป็นอวัยวะ"
      - "ระบบนิเวศรวมทั้งสิ่งมีชีวิตหลายชนิดและสิ่งไม่มีชีวิต จึงใหญ่ที่สุดในรายการนี้"
    solution: "เซลล์ → เนื้อเยื่อ → อวัยวะ → ระบบอวัยวะ → สิ่งมีชีวิต → ประชากร → ระบบนิเวศ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.foundations.life-and-science.p006
    topics: [biology.foundations.life-and-science]
    difficulty: 3
    type: mcq
    stem: "นักเรียนสงสัยว่า \"แสงมีผลต่อการงอกของเมล็ดถั่วเขียวหรือไม่\" ข้อใดเป็นสมมติฐานที่เหมาะสมที่สุด"
    choices:
      - { id: a, text: "ถ้าเมล็ดถั่วเขียวได้รับแสง ดังนั้นจำนวนเมล็ดที่งอกจะต่างจากเมล็ดที่อยู่ในที่มืด", correct: true }
      - { id: b, text: "เมล็ดถั่วเขียวเป็นพืชที่มีประโยชน์", feedback: "ข้อนี้เป็นความคิดเห็น ไม่ได้ตอบปัญหาเรื่องแสงกับการงอก และไม่ได้บอกว่าจะวัดอะไร" }
      - { id: c, text: "แสงมีผลต่อการงอกของเมล็ดถั่วเขียวหรือไม่", feedback: "ข้อนี้คือปัญหาที่ยังเป็นคำถาม สมมติฐานต้องเป็นคำตอบที่คาดไว้" }
      - { id: d, text: "ถ้ารดน้ำมาก ดังนั้นต้นถั่วจะสูง", feedback: "ข้อนี้พูดถึงน้ำ ไม่สอดคล้องกับปัญหาที่ถามเรื่องแสงและการงอก" }
    hints:
      - "สมมติฐานคือคำตอบที่คาดไว้ของปัญหา ไม่ใช่คำถาม"
      - "สมมติฐานต้องมีตัวแปรเดียวกับปัญหา คือแสงและการงอก"
    solution: "สมมติฐานที่ดีตอบปัญหา ใช้ตัวแปรเดียวกับปัญหา และตรวจสอบได้ ข้อ ก. บอกตัวแปรต้น (แสง) และตัวแปรตาม (จำนวนเมล็ดที่งอก) ในรูป ถ้า... ดังนั้น..."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.foundations.life-and-science.p007
    topics: [biology.foundations.life-and-science]
    difficulty: 3
    type: mcq
    stem: "นักเรียนแช่เมล็ดถั่วเขียวชุดละ 50 เมล็ดในน้ำเกลือความเข้มข้นต่าง ๆ แล้วนับเมล็ดที่งอกหลัง 5 วัน ได้ผลตามกราฟ ข้อใดคือตัวแปรต้นของการทดลองนี้"
    figure: { src: salt-germination.svg, alt: "กราฟแท่งจำนวนเมล็ดที่งอกจากชุดละ 50 เมล็ดหลัง 5 วัน แกนนอนคือความเข้มข้นของเกลือในน้ำ ร้อยละโดยมวล 0, 0.5, 1 และ 2 แกนตั้งคือจำนวนเมล็ดที่งอก 0 ถึง 50 แท่งสูง 47, 42, 30 และ 9 ตามลำดับ" }
    choices:
      - { id: a, text: "ความเข้มข้นของเกลือในน้ำ", correct: true }
      - { id: b, text: "จำนวนเมล็ดที่งอก", feedback: "จำนวนเมล็ดที่งอกคือผลที่วัด จึงเป็นตัวแปรตาม" }
      - { id: c, text: "จำนวนเมล็ดในแต่ละชุด (50 เมล็ด)", feedback: "จำนวนเมล็ดเท่ากันทุกชุด จึงเป็นตัวแปรควบคุม" }
      - { id: d, text: "ระยะเวลา 5 วัน", feedback: "ทุกชุดใช้เวลาเท่ากัน จึงเป็นตัวแปรควบคุม" }
    hints:
      - "ตัวแปรต้นมักอยู่บนแกนนอนของกราฟ"
      - "ผู้ทดลองตั้งใจทำให้อะไรต่างกันในแต่ละชุด"
    solution: "ผู้ทดลองตั้งใจเปลี่ยนความเข้มข้นของเกลือ (0, 0.5, 1, 2%) จึงเป็นตัวแปรต้น จำนวนเมล็ดที่งอกเป็นตัวแปรตาม ส่วนจำนวนเมล็ดต่อชุดและเวลาเป็นตัวแปรควบคุม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.foundations.life-and-science.p008
    topics: [biology.foundations.life-and-science]
    difficulty: 3
    type: numeric
    stem: "จากกราฟการทดลองเรื่องน้ำเกลือ ชุดที่ใช้น้ำเกลือเข้มข้นร้อยละ 1 มีเมล็ดงอกคิดเป็นร้อยละเท่าใดของเมล็ดในชุด (ตอบเป็นร้อยละ)"
    figure: { src: salt-germination.svg, alt: "กราฟแท่งจำนวนเมล็ดที่งอกจากชุดละ 50 เมล็ดหลัง 5 วัน แกนนอนคือความเข้มข้นของเกลือในน้ำ ร้อยละโดยมวล 0, 0.5, 1 และ 2 แกนตั้งคือจำนวนเมล็ดที่งอก 0 ถึง 50 แท่งสูง 47, 42, 30 และ 9 ตามลำดับ" }
    answer: { value: 60, unit: "%" }
    hints:
      - "อ่านจำนวนเมล็ดที่งอกของชุดร้อยละ 1 จากกราฟ"
      - "ร้อยละ = จำนวนที่งอก ÷ จำนวนเมล็ดทั้งหมดในชุด × 100"
    misconceptions:
      - { match: 30, feedback: "30 คือจำนวนเมล็ดที่งอก ยังต้องหารด้วย 50 แล้วคูณ 100 เพื่อเปลี่ยนเป็นร้อยละ" }
      - { match: 40, feedback: "40 คือร้อยละของเมล็ดที่ไม่งอก (20 จาก 50) โจทย์ถามเมล็ดที่งอก" }
    solution: "ชุดร้อยละ 1 งอก 30 เมล็ดจาก 50 เมล็ด คิดเป็น $\\frac{30}{50} \\times 100 = 60\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.foundations.life-and-science.p009
    topics: [biology.foundations.life-and-science]
    difficulty: 3
    type: mcq
    stem: "ในการทดลองเรื่องน้ำเกลือกับการงอกของเมล็ด ชุดใดเป็นชุดควบคุม"
    choices:
      - { id: a, text: "ชุดที่ใช้น้ำไม่ผสมเกลือ (ร้อยละ 0)", correct: true }
      - { id: b, text: "ชุดที่ใช้น้ำเกลือเข้มข้นที่สุด", feedback: "ชุดที่เข้มข้นที่สุดก็ได้รับตัวแปรต้น จึงเป็นชุดทดลองชุดหนึ่ง" }
      - { id: c, text: "ชุดที่มีเมล็ดงอกมากที่สุด", feedback: "ชุดควบคุมกำหนดไว้ก่อนทดลองจากการไม่ได้รับตัวแปรต้น ไม่ได้ตัดสินจากผลที่ได้" }
      - { id: d, text: "ไม่ต้องมีชุดควบคุม เพราะมีหลายความเข้มข้นอยู่แล้ว", feedback: "ถ้าไม่มีชุดที่ไม่ใส่เกลือ จะไม่รู้ว่าเมล็ดงอกได้เท่าไรในสภาพปกติ" }
    hints:
      - "ชุดควบคุมไม่ได้รับตัวแปรต้น"
      - "ตัวแปรต้นของการทดลองนี้คือเกลือ"
    solution: "ชุดควบคุมคือชุดที่ไม่ได้รับตัวแปรต้น ได้แก่ น้ำไม่ผสมเกลือ ใช้เป็นฐานเทียบว่าเกลือทำให้การงอกเปลี่ยนไปเท่าไร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.foundations.life-and-science.p010
    topics: [biology.foundations.life-and-science]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "ในการทดลองเรื่องน้ำเกลือกับการงอกของเมล็ดถั่วเขียว ข้อใดเป็นตัวแปรควบคุม (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "พันธุ์ของเมล็ดถั่วเขียว", correct: true }
      - { id: b, text: "ปริมาณน้ำหรือน้ำเกลือที่ใส่แต่ละชุด", correct: true }
      - { id: c, text: "อุณหภูมิและแสงบริเวณที่วาง", correct: true }
      - { id: d, text: "ความเข้มข้นของเกลือ", feedback: "ความเข้มข้นของเกลือเป็นสิ่งที่ตั้งใจเปลี่ยน จึงเป็นตัวแปรต้น" }
      - { id: e, text: "จำนวนเมล็ดที่งอก", feedback: "จำนวนเมล็ดที่งอกเป็นผลที่วัด จึงเป็นตัวแปรตาม" }
    hints:
      - "ตัวแปรควบคุมคือสิ่งที่อาจมีผลต่อการงอก จึงต้องให้เท่ากันทุกชุด"
      - "ตัดสิ่งที่ตั้งใจเปลี่ยนและสิ่งที่วัดออกก่อน"
    solution: "พันธุ์เมล็ด ปริมาณของเหลว อุณหภูมิ และแสง มีผลต่อการงอกได้ จึงต้องให้เท่ากันทุกชุด เป็นตัวแปรควบคุม ความเข้มข้นของเกลือเป็นตัวแปรต้น จำนวนเมล็ดที่งอกเป็นตัวแปรตาม"
