id: health.family.conflict-resolution
subject: health
title: { th: "ความขัดแย้งในครอบครัวและกลุ่มเพื่อน: สาเหตุและการแก้ไข", en: "Conflict in families and friendship groups: causes and resolution" }
summary: สาเหตุและผลของความขัดแย้งในครอบครัว กลุ่มเพื่อน และเยาวชนในชุมชน พฤติกรรมที่พึงประสงค์ ห้าขั้นแก้ความขัดแย้ง การเลือกวิธีรับมือ การเจรจา และการขอความช่วยเหลือ
difficulty: 3
minutes: 30
prerequisites: [health.family.friendships-relationships]
encompasses:
  - { id: health.family.friendships-relationships, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ห้าขั้นแก้ความขัดแย้ง
    src: conflict-steps.svg
    alt: "ผังห้าขั้นเรียงจากซ้ายไปขวา 1 หยุดให้ใจสงบ หายใจช้า ๆ แยกกันพักก่อน 2 ฟังให้เข้าใจ ไม่พูดแทรก ถามกลับให้ชัด 3 พูดแบบใช้ ฉัน บอกความรู้สึกและสิ่งที่ต้องการ 4 หาทางเลือกร่วมกัน คิดหลายทาง ทุกฝ่ายรับได้ 5 ตกลง ลองทำ ทบทวน ไม่ได้ผลก็คุยใหม่ ด้านล่างเขียนว่าถ้ามีการข่มขู่หรือทำร้ายร่างกาย ให้ออกจากสถานการณ์และขอความช่วยเหลือจากผู้ใหญ่ทันที"
  - type: worked-example
    title: แก้เรื่องรีโมตด้วยห้าขั้น
    problem: "พี่อยากดูฟุตบอลนัดสำคัญ น้องอยากดูการ์ตูนตอนเดียวกัน ทั้งคู่เริ่มขึ้นเสียง จะใช้ห้าขั้นแก้อย่างไร"
    steps:
      - text: "หยุด: ทั้งคู่วางรีโมตแล้วแยกกันไปดื่มน้ำ 5 นาที"
        why: "ตอนโกรธเราคิดหาทางออกได้ไม่ดี"
      - text: "ฟัง: น้องเล่าว่าการ์ตูนตอนนี้เป็นตอนจบ พี่เล่าว่าฟุตบอลเป็นนัดชิงชนะเลิศ"
      - text: "พูดแบบใช้ ฉัน: \"พี่อยากดูสดเพราะเป็นนัดชิง\" \"หนูเสียใจที่พี่แย่งรีโมตไปเลย หนูอยากดูตอนจบด้วย\""
      - text: "หาทางเลือก: ดูฟุตบอลสดแล้วให้น้องดูการ์ตูนย้อนหลังในแอป หรือแบ่งดูคนละครึ่ง"
      - text: "ตกลง: เลือกดูฟุตบอลสด น้องดูตอนจบย้อนหลังหลังจบเกม และสัปดาห์หน้าน้องได้เลือกก่อน"
        why: "ข้อตกลงที่ทุกคนได้สิ่งที่สำคัญกับตัวเองคือการร่วมมือ"
    answer: "ทั้งสองได้ดูสิ่งที่ต้องการ และตกลงผลัดกันเลือกในครั้งต่อไป"
  - { type: check, problem: health.family.conflict-resolution.p004, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: figure
    title: วิธีรับมือความขัดแย้ง 5 แบบ
    src: conflict-styles.svg
    alt: "แผนภาพสองแกน แกนตั้งคือการใส่ใจความต้องการของตัวเอง แกนนอนคือการใส่ใจความต้องการของอีกฝ่าย มุมซ้ายบน เอาชนะ ฉันได้ เธอเสีย มุมขวาบน ร่วมมือ หาทางที่ทุกคนได้ ตรงกลาง ประนีประนอม ต่างคนยอมคนละนิด มุมซ้ายล่าง หลีกเลี่ยง ไม่คุย ปล่อยไว้ก่อน มุมขวาล่าง ยอมตาม เธอได้ ฉันยอม"
    caption: "ดัดแปลงจากแนวคิดของ Thomas และ Kilmann"
  - { type: check, problem: health.family.conflict-resolution.p010 }
glossary:
  - { term: ความขัดแย้ง, definition: "สถานการณ์ที่คนสองฝ่ายขึ้นไปต้องการ คิด หรือรู้สึกไม่ตรงกัน" }
  - { term: การพูดแบบใช้ "ฉัน", definition: "การบอกความรู้สึก เหตุการณ์ และสิ่งที่ต้องการของตัวเอง แทนการกล่าวหาอีกฝ่าย" }
  - { term: การเจรจาต่อรอง, definition: "การพูดคุยเพื่อหาข้อตกลงที่ทุกฝ่ายยอมรับได้" }
  - { term: การไกล่เกลี่ย, definition: "การให้คนกลางที่ทั้งสองฝ่ายเชื่อใจช่วยให้คุยกันอย่างยุติธรรมและหาทางออกเอง" }
flashcards:
  - { front: "ห้าขั้นแก้ความขัดแย้ง", back: "หยุด → ฟัง → พูดแบบใช้ ฉัน → หาทางเลือก → ตกลงและทบทวน" }
  - { front: "วิธีรับมือ 5 แบบ", back: "หลีกเลี่ยง ยอมตาม เอาชนะ ประนีประนอม ร่วมมือ" }
  - { front: "เมื่อไรควรหลีกเลี่ยง", back: "เมื่อเรื่องเล็กมาก หรือมีอันตราย เช่น อีกฝ่ายเมาหรือกำลังจะทำร้าย" }
  - { front: "ถูกข่มขู่หรือทำร้าย", back: "ไม่ใช่ความผิดของเรา บอกผู้ใหญ่ที่ไว้ใจ โทร 1300 1387 อยู่ในอันตรายโทร 191" }
