problems:
- id: english.speaking.presentations.p001
  topics:
  - english.speaking.presentations
  difficulty: 1
  type: mcq
  stem: ประโยคใดเหมาะที่สุดสำหรับเปิดการนำเสนอเรื่องการคัดแยกขยะในโรงเรียน
  choices:
  - id: a
    text: Good morning, everyone. Today I'm going to talk about sorting rubbish at our school.
    correct: true
    feedback: ถูก ทักทายผู้ฟังและบอกหัวข้อตั้งแต่ต้น
  - id: b
    text: Rubbish is bad, so listen now.
    feedback: ไม่ทักทายและไม่บอกว่าจะพูดเรื่องอะไรอย่างชัดเจน
  - id: c
    text: Okay, I forgot what to say.
    feedback: เป็นการเปิดที่ทำให้ผู้ฟังไม่มั่นใจในผู้พูด
  - id: d
    text: Let me give you an example.
    feedback: วลีนี้ใช้ตอนยกตัวอย่างในเนื้อหา ไม่ใช่ตอนเปิด
  hints:
  - ส่วนเปิดควรทักทายและบอกหัวข้อ
  - ดูว่าประโยคไหนบอกผู้ฟังว่ากำลังจะพูดเรื่องอะไร
  solution: ส่วนเปิดที่ดีประกอบด้วยการทักทาย และบอกหัวข้อของการนำเสนอ เช่นประโยค a
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.presentations.p002
  topics:
  - english.speaking.presentations
  difficulty: 1
  type: text
  stem: 'เติมคำที่ขาดในวลีบอกทิศทางเมื่อขึ้นประเด็นแรก: *___ of all, let me explain the rules.*'
  accepted:
  - First
  misconceptions:
  - match: Second
    feedback: Second ใช้เมื่อขึ้นประเด็นที่สอง ไม่ใช่ประเด็นแรก
  - match: Finally
    feedback: Finally ใช้ตอนใกล้จบ ไม่ใช่ตอนเริ่มประเด็นแรก
  hints:
  - วลีนี้แปลว่า "ก่อนอื่นเลย"
  - คำที่ใช้ขึ้นต้นประเด็นแรก
  solution: '*First of all, let me explain the rules.* ใช้ First of all เพื่อเริ่มประเด็นแรกของการนำเสนอ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.presentations.p003
  topics:
  - english.speaking.presentations
  difficulty: 1
  type: match
  stem: จับคู่วลีบอกทิศทางกับหน้าที่ของวลีนั้นในการนำเสนอ
  pairs:
  - left: 'First of all,'
    right: เริ่มประเด็นแรก
  - left: 'Moving on to my second point,'
    right: เปลี่ยนไปยังประเด็นถัดไป
  - left: 'Let me give you an example.'
    right: ยกตัวอย่างประกอบประเด็น
  - left: 'To sum up,'
    right: สรุปประเด็นก่อนจบ
  hints:
  - วลีที่ขึ้นต้นด้วย Moving on บอกการเปลี่ยนเรื่อง
  - ดูว่าวลีนั้นอยู่ส่วนเปิด เนื้อหา หรือส่วนปิด
  solution: 'First of all → เริ่มประเด็นแรก · Moving on to → เปลี่ยนประเด็น · Let me give you an example → ยกตัวอย่าง · To sum up → สรุป'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.presentations.p004
  topics:
  - english.speaking.presentations
  difficulty: 2
  type: order
  stem: เรียงส่วนของการนำเสนอเรื่องการรีไซเคิลในโรงเรียนให้ถูกลำดับ
  items:
  - Good morning, everyone. Today I'm going to talk about recycling at our school.
  - My presentation is divided into three parts.
  - First of all, let's look at how many bottles our school collects each month.
  - Moving on to my second point, let me explain how the bottles are sorted.
  - Finally, let's see how students can join the project.
  - To sum up, the school can recycle much more than it does now.
  - Thank you for listening. Any questions?
  hints:
  - เริ่มด้วยการทักทายและบอกแผน แล้วจึงเข้าเนื้อหาตามลำดับประเด็น
  - ส่วนสรุปและการเชิญให้ถามอยู่ท้ายสุด
  solution: ลำดับคือ ส่วนเปิด (ทักทาย บอกหัวข้อ บอกแผน) → เนื้อหาทีละประเด็น → สรุป → ขอบคุณและเชิญถาม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.presentations.p005
  topics:
  - english.speaking.presentations
  difficulty: 2
  type: mcq
  stem: ประโยคใดใช้คำบอกทิศทางเพื่อเน้นประเด็นสำคัญ
  choices:
  - id: a
    text: What's really important is that we start today.
    correct: true
    feedback: ถูก What's really important is ใช้เน้นประเด็นที่ต้องการให้ผู้ฟังจำ
  - id: b
    text: Let me give you an example.
    feedback: ใช้ยกตัวอย่าง ไม่ได้เน้นประเด็น
  - id: c
    text: To sum up, we finished the project.
    feedback: ใช้สรุปตอนจบ ไม่ได้เน้นประเด็นกลางเรื่อง
  - id: d
    text: Moving on to the next slide.
    feedback: ใช้เปลี่ยนเรื่องหรือภาพ ไม่ได้เน้นประเด็น
  hints:
  - มองหาวลีที่บอกว่าประเด็นนี้สำคัญ
  - ดูว่าแต่ละวลีทำหน้าที่อะไรในการพูด
  solution: ข้อ a ใช้ What's really important is เพื่อบอกผู้ฟังว่าประเด็นนี้สำคัญที่สุด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.presentations.p006
  topics:
  - english.speaking.presentations
  difficulty: 2
  type: text
  stem: 'เติมคำขยายที่บอกขนาดการเปลี่ยนแปลง: *There was a ___ rise between March and April.* (จาก 35 เป็น 71 กิโลกรัม)'
  accepted:
  - sharp
  misconceptions:
  - match: slight
    feedback: slight หมายถึงเล็กน้อย แต่การเปลี่ยนแปลงจาก 35 เป็น 71 มากจนเกือบเท่าตัว
  - match: steady
    feedback: steady หมายถึงค่อยเป็นค่อยไป แต่ค่านี้เพิ่มขึ้นในเดือนเดียว
  hints:
  - ดูว่าค่าเพิ่มจาก 35 เป็น 71 มากแค่ไหน
  - คำที่แปลว่า "อย่างรวดเร็วและเห็นได้ชัด"
  solution: '*There was a **sharp** rise between March and April.* ค่าเพิ่มจาก 35 เป็น 71 กิโลกรัม จึงใช้ sharp'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.presentations.p007
  topics:
  - english.speaking.presentations
  difficulty: 2
  type: numeric
  stem: ดูแผนภูมิแท่งของโรงเรียนทุ่งนาวิทยา ผลต่างระหว่างเดือนที่เก็บขวดได้มากที่สุดกับเดือนที่เก็บได้น้อยที่สุดคือกี่กิโลกรัม
  figure:
    src: recycling-bars.svg
    alt: แผนภูมิแท่งข้อมูลสมมุติ แสดงน้ำหนักขวดพลาสติกที่โรงเรียนเก็บได้ต่อเดือน มกราคม 42 กิโลกรัม กุมภาพันธ์ 58 กิโลกรัม มีนาคม 35 กิโลกรัม เมษายน 71 กิโลกรัม และพฤษภาคม 64 กิโลกรัม
  answer:
    value: 36
    tolerance: 0
    unit: กิโลกรัม
  misconceptions:
  - match: 35
    feedback: 35 คือค่าต่ำสุด ไม่ใช่ผลต่าง ต้องนำค่าสูงสุดลบด้วยค่าต่ำสุด
  - match: 106
    feedback: 71 + 35 เป็นการบวก แต่โจทย์ถามผลต่าง
  hints:
  - หาแท่งที่สูงที่สุดและแท่งที่ต่ำที่สุดก่อน
  - ผลต่างคือค่าสูงสุดลบค่าต่ำสุด
  solution: 'สูงสุด = เมษายน 71 กก. ต่ำสุด = มีนาคม 35 กก. ผลต่าง = 71 − 35 = **36 กิโลกรัม**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.presentations.p008
  topics:
  - english.speaking.presentations
  difficulty: 3
  type: mcq
  stem: ดูแผนภูมิแท่งจากโจทย์ข้อก่อนหน้า ข้อใดบรรยายแผนภูมิได้ถูกต้อง
  figure:
    src: recycling-bars.svg
    alt: แผนภูมิแท่งข้อมูลสมมุติ แสดงน้ำหนักขวดพลาสติกที่โรงเรียนเก็บได้ต่อเดือน มกราคม 42 กิโลกรัม กุมภาพันธ์ 58 กิโลกรัม มีนาคม 35 กิโลกรัม เมษายน 71 กิโลกรัม และพฤษภาคม 64 กิโลกรัม
  choices:
  - id: a
    text: The highest figure is in May, at 64 kg.
    feedback: 64 เป็นค่าของพฤษภาคม แต่ค่าสูงสุดอยู่ที่เมษายนซึ่งเป็น 71 kg
  - id: b
    text: Figures rose every month from January to May.
    feedback: ไม่ถูก ค่าลดลงทั้งในเดือนมีนาคมและพฤษภาคม
  - id: c
    text: The highest figure is in April, at 71 kg, and figures fell slightly in May.
    correct: true
    feedback: ถูก เมษายนสูงสุดที่ 71 kg และพฤษภาคมลดลงเล็กน้อยเหลือ 64 kg
  - id: d
    text: The lowest figure is in February, at 58 kg.
    feedback: 58 เป็นค่าของกุมภาพันธ์ ส่วนค่าต่ำสุดอยู่ที่มีนาคม (35 kg)
  hints:
  - หาแท่งที่สูงที่สุดและแท่งที่เตี้ยที่สุดก่อน
  - ตรวจทีละข้อว่าเดือนและค่าตรงกับแผนภูมิหรือไม่
  solution: ข้อ c ถูก เพราะเมษายนสูงสุดที่ 71 kg และค่าลดลงเล็กน้อยในพฤษภาคม (71 → 64)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.presentations.p009
  topics:
  - english.speaking.presentations
  difficulty: 3
  type: order
  stem: เรียงประโยคที่อธิบายขั้นตอนการทำปุ๋ยหมักจากเศษอาหารในโรงอาหารของโรงเรียนให้ถูกลำดับ
  items:
  - First, food scraps are collected from the canteen after lunch.
  - Then they are mixed with dry leaves from the school garden.
  - After that, the mixture is turned over once a week for about two months.
  - Finally, the finished compost is spread on the vegetable beds.
  hints:
  - ประโยคแรกบอกว่าวัตถุดิบมาจากไหน
  - ใช้คำเรียงลำดับ first, then, after that, finally เป็นตัวช่วย
  solution: ลำดับคือ เก็บเศษอาหาร → ผสมกับใบไม้แห้ง → พลิกกองทุกสัปดาห์ → นำปุ๋ยไปใช้ในแปลงผัก ใช้ passive voice (are collected, are mixed, is turned, is spread)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.presentations.p010
  topics:
  - english.speaking.presentations
  difficulty: 3
  type: mcq
  stem: น้ำหนักขวดที่เก็บได้ลดลงจาก 71 kg ในเดือนเมษายนเป็น 64 kg ในเดือนพฤษภาคม ควรบรรยายด้วยคำใด
  choices:
  - id: a
    text: rose slightly
    feedback: rose แปลว่าเพิ่มขึ้น แต่ค่าลดลง
  - id: b
    text: fell slightly
    correct: true
    feedback: ถูก fell (ลดลง) และ slightly (เล็กน้อย) ตรงกับการลดลง 7 kg
  - id: c
    text: rose sharply
    feedback: ทั้ง rose และ sharply ไม่ตรงกับการลดลงเล็กน้อย
  - id: d
    text: stayed the same
    feedback: ค่าเปลี่ยนจาก 71 เป็น 64 ไม่ได้คงที่
  hints:
  - ดูทิศทาง ขึ้นหรือลง
  - ดูขนาด มากหรือเล็กน้อย
  solution: 'Figures **fell slightly** in May. ลดลง 7 kg ซึ่งไม่มาก จึงใช้ slightly'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.presentations.p011
  topics:
  - english.speaking.presentations
  difficulty: 3
  type: match
  stem: จับคู่วลีภาษาอังกฤษในการนำเสนอกับความหมายภาษาไทย
  pairs:
  - left: a key point
    right: ประเด็นสำคัญ
  - left: in conclusion
    right: สรุปปิดท้าย
  - left: a slight increase
    right: การเพิ่มขึ้นเล็กน้อย
  - left: a sharp decline
    right: การลดลงอย่างรวดเร็ว
  hints:
  - sharp และ slight บอกขนาดของการเปลี่ยนแปลง
  - decline เป็นคำนามที่แปลว่าการลดลง
  solution: 'a key point → ประเด็นสำคัญ · in conclusion → สรุปปิดท้าย · a slight increase → เพิ่มเล็กน้อย · a sharp decline → ลดอย่างรวดเร็ว'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.presentations.p012
  topics:
  - english.speaking.presentations
  difficulty: 4
  type: text
  stem: 'เติมคำกริยาในอดีตให้ประโยคบรรยาย: *Figures ___ slightly in May, from 71 kg to 64 kg.*'
  accepted:
  - fell
  - decreased
  - dropped
  misconceptions:
  - match: rose
    feedback: rose แปลว่าเพิ่มขึ้น แต่ค่าลดจาก 71 เป็น 64
  - match: increased
    feedback: increased แปลว่าเพิ่มขึ้น ไม่ตรงกับการลดลงในพฤษภาคม
  hints:
  - ดูว่าค่าในพฤษภาคมมากกว่าหรือน้อยกว่าเมษายน
  - ใช้กริยาช่องที่สอง (past simple) เพราะเป็นเหตุการณ์ที่เกิดแล้ว
  solution: '*Figures **fell** slightly in May, from 71 kg to 64 kg.* ใช้ past simple เพราะบรรยายข้อมูลที่เกิดขึ้นแล้ว'
  license: CC-BY-SA-4.0
  ai_assisted: true
