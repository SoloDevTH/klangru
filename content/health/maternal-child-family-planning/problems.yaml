- id: health.family.maternal-child-family-planning.p014
  topics:
  - health.family.maternal-child-family-planning
  difficulty: 4
  type: mcq
  stem: แนนอายุ 17 ปี เพิ่งรู้ว่าตั้งครรภ์ 8 สัปดาห์ แฟนสูบบุหรี่ในบ้าน และแนนกินข้าวน้อยเพราะเครียด ข้อใดวิเคราะห์ปัจจัยและเสนอทางช่วยได้เหมาะสมที่สุด
  choices:
  - id: a
    text: อายุน้อย ควันบุหรี่มือสอง โภชนาการ และความเครียดเป็นปัจจัยเสี่ยง ควรฝากครรภ์ทันที ขอให้งดสูบบุหรี่ในบ้าน กินอาหารและยาเสริมตามที่เจ้าหน้าที่แนะนำ และปรึกษาผู้ใหญ่ที่ไว้ใจหรือ 1663
    correct: true
  - id: b
    text: ควรรอให้ท้องโตก่อนจึงบอกครอบครัวและไปฝากครรภ์
    feedback: การรอทำให้พลาดการคัดกรองช่วงต้น ควรฝากครรภ์ก่อน 12 สัปดาห์
  - id: c
    text: ปัญหาทั้งหมดเป็นความผิดของแนน จึงต้องจัดการเองคนเดียว
    feedback: การตำหนิไม่ช่วยแม่และลูก ทุกการตั้งครรภ์ควรได้รับการดูแลและความช่วยเหลือ
  - id: d
    text: ควันบุหรี่ไม่เป็นไรเพราะแนนไม่ได้สูบเอง
    feedback: ควันบุหรี่มือสองทำให้ทารกเสี่ยงน้ำหนักแรกเกิดน้อยและคลอดก่อนกำหนด
  hints:
  - ระบุปัจจัยเสี่ยงให้ครบทุกด้าน
  - ทางช่วยที่ดีไม่ตำหนิและเริ่มได้ทันที
  solution: ปัจจัยเสี่ยงคืออายุน้อย ควันบุหรี่มือสอง โภชนาการ และความเครียด สิ่งที่ช่วยได้ทันทีคือฝากครรภ์ ลดควันบุหรี่ในบ้าน ดูแลอาหาร และหาผู้ช่วยเหลือ แนนยังมีสิทธิเรียนต่อตาม พ.ร.บ. การป้องกันและแก้ไขปัญหาการตั้งครรภ์ในวัยรุ่น พ.ศ. 2559
