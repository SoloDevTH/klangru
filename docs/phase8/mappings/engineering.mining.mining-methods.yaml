topic: engineering.mining.mining-methods
rows:
  - { framework: th-coe-engineering-basics, indicators: ["MIN-2.4"], coverage: partial, note: "สอนการประเมินปริมาณแร่ด้วยหน้าตัดและบล็อก เกรดเฉลี่ยถ่วงน้ำหนัก ค่าตัดเกรด ความแตกต่างของทรัพยากรกับแร่สำรอง ลักษณะแหล่งแร่ แนวคิดธรณีสถิติ และการค้ำยันช่องเปิดในหินเชิงแนวคิด แต่ยังไม่สอนธรณีสถิติขั้นสูง การเก็บตัวอย่างเจาะสำรวจอย่างเป็นระบบ และการออกแบบฐานรากหรือการเสริมความแข็งแรงของอุโมงค์ในเชิงปริมาณ" }
  - { framework: th-coe-engineering-basics, indicators: ["MIN-2.5"], coverage: partial, note: "สอนการเปรียบเทียบเหมืองผิวดินกับใต้ดินในระดับแนวคิด อัตราส่วนหินทิ้งต่อแร่ ขั้นบันได berm มุมลาดรวม และปริมาตรหลุม แต่ยังไม่สอนการออกแบบเหมืองใต้ดิน การขนส่ง การระบายอากาศ และการวางแผนการผลิตทั้งระบบ" }
  - { framework: th-coe-engineering-basics, indicators: ["MIN-2.8"], coverage: partial, note: "สอนหลักความปลอดภัยและการควบคุมภาพรวมของการระเบิดหิน (พื้นที่หวงห้าม การเฝ้าระวัง การจัดการจุดระเบิดไม่สมบูรณ์ การติดตามการสั่นสะเทือนและหินปลิว) โดยเจตนาไม่มีการออกแบบการเจาะระเบิดหรือปริมาณวัตถุระเบิด เพราะต้องดำเนินการโดยผู้เชี่ยวชาญที่มีใบอนุญาต ขอบเขตในแผนเรื่องรูปแบบการเจาะระเบิดและอัตราการใช้วัตถุระเบิดจึงไม่ได้สอน" }
