  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.read-aloud.p011
  topics:
  - thai.reading.read-aloud
  difficulty: 4
  type: mcq
  stem: ข้อใด **ไม่ใช่** หลักการอ่านทำนองเสนาะ
  choices:
  - id: a
    text: เปลี่ยนเสียงวรรณยุกต์ของคำให้เข้ากับทำนอง
    correct: true
    feedback: ถูก ห้ามเปลี่ยนเสียงจนคำผิดความหมาย
  - id: b
    text: แบ่งจังหวะตามชนิดของบท
    feedback: เป็นหลักการสำคัญ
  - id: c
    text: เน้นคำสัมผัสให้ได้ยินชัด
    feedback: เป็นหลักการที่ทำให้ไพเราะ
  - id: d
    text: ทอดเสียงท้ายวรรค
    feedback: เป็นหลักการอ่านทำนองเสนาะ
  hints:
  - ทำนองเสนาะต้องไพเราะและยังสื่อความหมายถูก
  - ข้อใดทำให้ผู้ฟังเข้าใจคำผิด
  solution: การ**เปลี่ยนเสียงวรรณยุกต์ให้เข้าทำนอง**ไม่ใช่หลักการ คำต้องออกเสียงถูกเสมอ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.read-aloud.p012
  topics:
  - thai.reading.read-aloud
  difficulty: 4
  type: mcq
  stem: นักเรียนได้รับมอบหมายให้อ่านเรื่องสั้นตอนที่ "ยายจากไปอย่างสงบ หลานทุกคนร้องไห้" ควรอ่านอย่างไร **เหมาะสมกับเรื่อง**
  choices:
  - id: a
    text: อ่านช้าลง เสียงเบาและนุ่ม
    correct: true
    feedback: ถูก เข้ากับอารมณ์เศร้าของเรื่อง
  - id: b
    text: อ่านเร็วและเสียงร่าเริง
    feedback: ไม่เข้ากับอารมณ์ของเรื่อง
  - id: c
    text: อ่านเสียงดังแข็งเหมือนประกาศ
    feedback: เหมาะกับประกาศ ไม่เหมาะกับเรื่องเศร้า
  - id: d
    text: อ่านเสียงเรียบเดียวทั้งเรื่องโดยไม่สนใจเนื้อหา
    feedback: ถูกต้องแต่ไม่เหมาะสม ผู้ฟังไม่รู้สึกตาม
  hints:
  - อารมณ์ของตอนนี้คืออะไร
  - น้ำเสียงต้องเข้ากับอารมณ์
  solution: อ่าน**ช้าลง เสียงเบาและนุ่ม**ให้เข้ากับความเศร้า
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.read-aloud.p013
  topics:
  - thai.reading.read-aloud
  difficulty: 4
  type: text
  stem: เขียนคำอ่านของคำว่า **ราชการ** แบ่งพยางค์ด้วยขีด (-)
  accepted:
  - ราด-ชะ-กาน
  - ราดชะกาน
  - ราด ชะ กาน
  misconceptions:
  - match: ราช-การ
    feedback: นี่คือการแยกตามตัวเขียน ต้องเขียนตามเสียง และมีพยางค์ ชะ เพิ่ม
  - match: ราด-กาน
    feedback: ลืมพยางค์ ชะ ซึ่งเกิดจากการอ่านเชื่อม
  - match: รา-ชะ-กาน
    feedback: พยางค์แรกมี ช สะกด ออกเสียง ราด
  hints:
  - ราชการ อ่านเชื่อมพยางค์เหมือน ราชวัง (ราด-ชะ-วัง)
  - ช เป็นทั้งตัวสะกดของพยางค์แรกและออกเสียงเป็น ชะ
  solution: ราชการ อ่านว่า **ราด-ชะ-กาน**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.read-aloud.p014
  topics:
  - thai.reading.read-aloud
  difficulty: 4
  type: mcq
  stem: กลอน "...นกร้องก้องกังวานเสียงแสนหวาน / ลมโชยพัดดอกไม้หอมทั่วลาน..." เวลาอ่านทำนองเสนาะ ควรเน้นคู่ใดเพราะเป็นสัมผัสระหว่างวรรค
  choices:
  - id: a
    text: หวาน – ลาน
    correct: true
    feedback: ถูก คำท้ายวรรครับสัมผัสกับคำท้ายวรรครอง
  - id: b
    text: ร้อง – ก้อง
    feedback: เป็นสัมผัสภายในวรรคเดียวกัน ไม่ใช่สัมผัสระหว่างวรรค
  - id: c
    text: ลม – โชย
    feedback: ไม่ได้สัมผัสกัน
  - id: d
    text: เสียง – ดอก
    feedback: ไม่ได้สัมผัสกัน
  hints:
  - ดูคำท้ายของวรรคแรกและวรรคที่สอง
  - คำสัมผัสระหว่างวรรคมีเสียงสระและตัวสะกดเหมือนกัน
  solution: '**หวาน – ลาน** (อา + น)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.read-aloud.p015
  topics:
  - thai.reading.read-aloud
  difficulty: 5
  type: mcq
  stem: 'ข้อความในหนังสือ: "นกน้อยบินกลับรังเมื่อตะวันตกดิน" นักเรียนอ่านว่า "นกน้อยบินกลับบ้านเมื่อตะวันตก" อ่านผิดแบบใดบ้าง (เลือกทุกข้อที่ถูก)'
  multiple: true
  choices:
  - id: a
    text: อ่านเปลี่ยนคำ (รัง เป็น บ้าน)
    correct: true
    feedback: ถูก เปลี่ยนคำในหนังสือเป็นคำอื่น
  - id: b
    text: อ่านตก (ไม่อ่านคำว่า ดิน)
    correct: true
    feedback: ถูก ข้ามคำท้ายประโยค
  - id: c
    text: อ่านเติมคำที่ไม่มีในหนังสือ
    feedback: ไม่มีคำเกินจากหนังสือ บ้าน มาแทน รัง ไม่ได้เพิ่มเข้าไป
  - id: d
    text: อ่านซ้ำคำเดิม
    feedback: ไม่มีคำที่อ่านซ้ำ
  hints:
  - เทียบทีละคำระหว่างหนังสือกับที่นักเรียนอ่าน
  - หาคำที่หายไปและคำที่ถูกเปลี่ยน
  solution: อ่าน**เปลี่ยนคำ** (รัง → บ้าน) และ**อ่านตก** (ดิน)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.read-aloud.p016
  topics:
  - thai.reading.read-aloud
