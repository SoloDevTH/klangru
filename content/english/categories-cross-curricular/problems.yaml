problems:
  - id: english.vocabulary.categories-cross-curricular.p001
    topics: [english.vocabulary.categories-cross-curricular]
    difficulty: 1
    type: mcq
    stem: "คำไหนเป็นสัตว์ (animal)"
    choices:
      - { id: a, text: "elephant", correct: true, feedback: "ถูก elephant คือช้าง เป็นสัตว์" }
      - { id: b, text: "teacher", feedback: "teacher คือครู เป็นคน (people)" }
      - { id: c, text: "chair", feedback: "chair คือเก้าอี้ เป็นสิ่งของ (things)" }
      - { id: d, text: "pencil", feedback: "pencil คือดินสอ เป็นสิ่งของ (things)" }
    hints:
      - "สัตว์หายใจ กินอาหาร และไม่ใช่คน"
      - "แปลแต่ละคำเป็นภาษาไทยก่อน"
    solution: "**elephant** (ช้าง) เป็นสัตว์ ส่วน teacher เป็นคน chair และ pencil เป็นสิ่งของ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.categories-cross-curricular.p002
    topics: [english.vocabulary.categories-cross-curricular]
    difficulty: 1
    type: match
    stem: "จับคู่หมวดกับคำที่อยู่ในหมวดนั้น"
    pairs:
      - { left: "people", right: "farmer" }
      - { left: "animals", right: "rabbit" }
      - { left: "things", right: "spoon" }
    hints:
      - "people = คน, animals = สัตว์, things = สิ่งของ"
      - "farmer = ชาวนา rabbit = กระต่าย spoon = ช้อน"
    solution: "people → farmer (ชาวนา) · animals → rabbit (กระต่าย) · things → spoon (ช้อน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.categories-cross-curricular.p003
    topics: [english.vocabulary.categories-cross-curricular]
    difficulty: 1
    type: mcq
    stem: "แม่ซื้อของที่ตลาดนัดหน้าโรงเรียน คำไหนไม่เข้าพวก (odd one out): *mango, banana, carrot, papaya*"
    choices:
      - { id: a, text: "carrot", correct: true, feedback: "ถูก carrot (แครอท) เป็นผัก อีกสามคำเป็นผลไม้" }
      - { id: b, text: "mango", feedback: "mango (มะม่วง) เป็นผลไม้ เหมือน banana และ papaya" }
      - { id: c, text: "banana", feedback: "banana (กล้วย) เป็นผลไม้ เหมือน mango และ papaya" }
      - { id: d, text: "papaya", feedback: "papaya (มะละกอ) เป็นผลไม้ เหมือน mango และ banana" }
    hints:
      - "แปลแต่ละคำ แล้วดูว่าคำไหนเป็นคนละหมวดย่อย"
      - "สามคำเป็นผลไม้ (fruit) อีกคำเป็นผัก (vegetable)"
    solution: "**carrot** เป็นผัก (vegetable) ส่วน mango, banana, papaya เป็นผลไม้ (fruit) ทั้งหมดอยู่ในหมวดใหญ่ food"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.categories-cross-curricular.p004
    topics: [english.vocabulary.categories-cross-curricular]
    difficulty: 2
    type: text
    stem: "อ่านโจทย์คณิต 3 + 4 = 7 เป็นภาษาอังกฤษ เขียนคำที่หายไปเป็นตัวหนังสือ: *Three plus four equals ___.*"
    accepted: ["seven"]
    misconceptions:
      - { match: "7", feedback: "คำตอบถูก แต่โจทย์ให้เขียนเป็นตัวหนังสือภาษาอังกฤษ" }
      - { match: "one", feedback: "plus แปลว่า บวก ไม่ใช่ ลบ 3 + 4 ไม่ใช่ 4 − 3" }
      - { match: "twelve", feedback: "plus แปลว่า บวก ไม่ใช่ คูณ" }
    hints:
      - "plus = บวก"
      - "คิด 3 + 4 แล้วเขียนผลลัพธ์เป็นคำภาษาอังกฤษ"
    solution: "3 + 4 = 7 → *Three plus four equals **seven**.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.categories-cross-curricular.p005
    topics: [english.vocabulary.categories-cross-curricular]
    difficulty: 2
    type: mcq
    stem: "ข้อใดอ่าน 10 − 6 = 4 ได้ถูกต้อง"
    choices:
      - { id: a, text: "Ten minus six equals four.", correct: true, feedback: "ถูก minus = ลบ" }
      - { id: b, text: "Ten plus six equals four.", feedback: "plus = บวก แต่เครื่องหมายในโจทย์คือลบ" }
      - { id: c, text: "Six minus ten equals four.", feedback: "สลับตัวเลข ต้องอ่านจากซ้ายไปขวา: ten minus six" }
      - { id: d, text: "Ten times six equals four.", feedback: "times = คูณ แต่เครื่องหมายในโจทย์คือลบ" }
    hints:
      - "เครื่องหมาย − อ่านว่าอะไร"
      - "อ่านตัวเลขเรียงจากซ้ายไปขวา"
    solution: "***Ten minus six equals four.*** (หรือ *Ten take away six is four.*)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.categories-cross-curricular.p006
    topics: [english.vocabulary.categories-cross-curricular]
    difficulty: 2
    type: match
    stem: "ดูภาพต้นไม้ จับคู่หมายเลขกับชื่อส่วนของต้นไม้"
    figure: { src: plant-quiz.svg, alt: "ภาพต้นไม้มีหมายเลขชี้ส่วนต่าง ๆ หมายเลข 1 ชี้ดอกสีชมพูบนสุด หมายเลข 2 ชี้ใบสีเขียวที่ติดลำต้น หมายเลข 3 ชี้แท่งตั้งตรงที่ต่อจากดิน หมายเลข 4 ชี้เส้นที่แตกแขนงอยู่ใต้ดิน" }
    pairs:
      - { left: "1", right: "flower" }
      - { left: "2", right: "leaf" }
      - { left: "3", right: "stem" }
      - { left: "4", right: "root" }
    hints:
      - "ส่วนที่อยู่ใต้ดินคืออะไร"
      - "flower = ดอก, leaf = ใบ, stem = ลำต้น, root = ราก"
    solution: "1 → flower (ดอก) · 2 → leaf (ใบ) · 3 → stem (ลำต้น) · 4 → root (ราก)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.categories-cross-curricular.p007
    topics: [english.vocabulary.categories-cross-curricular]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "เลือกคำที่เป็นคน (people) ทุกคำ"
    choices:
      - { id: a, text: "nurse", correct: true, feedback: "nurse คือพยาบาล เป็นคน" }
      - { id: b, text: "farmer", correct: true, feedback: "farmer คือชาวนาหรือเกษตรกร เป็นคน" }
      - { id: c, text: "monkey", feedback: "monkey คือลิง เป็นสัตว์" }
      - { id: d, text: "cook", correct: true, feedback: "cook ที่เป็นคำนามคือพ่อครัวหรือแม่ครัว เป็นคน" }
      - { id: e, text: "table", feedback: "table คือโต๊ะ เป็นสิ่งของ" }
    hints:
      - "คำชื่ออาชีพเป็นคำเรียกคน"
      - "มีคำตอบมากกว่าหนึ่งข้อ"
    solution: "คน: **nurse, farmer, cook** · monkey เป็นสัตว์ · table เป็นสิ่งของ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.categories-cross-curricular.p008
    topics: [english.vocabulary.categories-cross-curricular]
    difficulty: 2
    type: text
    stem: "พิมพ์คำที่ไม่เข้าพวก: *tiger, lion, sofa, elephant*"
    accepted: ["sofa"]
    misconceptions:
      - { match: "elephant", feedback: "elephant เป็นสัตว์เหมือน tiger และ lion" }
      - { match: "lion", feedback: "lion (สิงโต) เป็นสัตว์เหมือน tiger และ elephant" }
    hints:
      - "สามคำเป็นสัตว์ป่า"
      - "หาคำที่เป็นสิ่งของในบ้าน"
    solution: "**sofa** (โซฟา) เป็นสิ่งของ อีกสามคำเป็นสัตว์ป่า (wild animals)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.categories-cross-curricular.p009
    topics: [english.vocabulary.categories-cross-curricular]
    difficulty: 3
    type: order
    stem: "อ่านแล้วเรียงห่วงโซ่อาหาร (food chain) เริ่มจากสิ่งที่ถูกกินก่อน: *The frog eats the grasshopper. The snake eats the frog. The grasshopper eats grass.*"
    items:
      - "grass"
      - "grasshopper"
      - "frog"
      - "snake"
    hints:
      - "หาสิ่งที่ไม่ได้กินอะไรเลยในเรื่องนี้ นั่นคือตัวแรก"
      - "A eats B แปลว่า A กิน B ดังนั้น B มาก่อน A"
    solution: "grass → grasshopper → frog → snake (ตั๊กแตนกินหญ้า กบกินตั๊กแตน งูกินกบ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.categories-cross-curricular.p010
    topics: [english.vocabulary.categories-cross-curricular]
    difficulty: 3
    type: match
    stem: "จับคู่ให้เป็นประโยคที่บอกความสัมพันธ์ได้ถูกต้อง"
    pairs:
      - { left: "A fish", right: "lives in water." }
      - { left: "A bird", right: "has wings." }
      - { left: "A cow", right: "gives us milk." }
      - { left: "A pencil", right: "is for writing." }
    hints:
      - "has = มี, lives in = อาศัยอยู่ใน, is for = มีไว้สำหรับ"
      - "สัตว์ตัวไหนมีปีก ตัวไหนอยู่ในน้ำ ตัวไหนให้นม"
    solution: "A fish lives in water. · A bird has wings. · A cow gives us milk. · A pencil is for writing."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.categories-cross-curricular.p011
    topics: [english.vocabulary.categories-cross-curricular]
    difficulty: 3
    type: numeric
    stem: "อ่านแล้วตอบเป็นตัวเลข: *Twelve minus five equals ...?*"
    answer: { value: 7 }
    misconceptions:
      - { match: 17, feedback: "minus แปลว่า ลบ ไม่ใช่ บวก" }
      - { match: 60, feedback: "minus แปลว่า ลบ ไม่ใช่ คูณ" }
    hints:
      - "twelve = 12, five = 5"
      - "minus = ลบ คิด 12 − 5"
    solution: "*twelve* = 12, *minus* = ลบ, *five* = 5 → 12 − 5 = **7** (*Twelve minus five equals seven.*)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.categories-cross-curricular.p012
    topics: [english.vocabulary.categories-cross-curricular]
    difficulty: 3
    type: mcq
    stem: "คำ *root, magnet, thermometer, seed* เป็นคำศัพท์ของวิชาใด"
    choices:
      - { id: a, text: "Science", correct: true, feedback: "ถูก ราก แม่เหล็ก เทอร์โมมิเตอร์ และเมล็ด เป็นเรื่องวิทยาศาสตร์" }
      - { id: b, text: "Maths", feedback: "คำคณิตศาสตร์เช่น plus, minus, number, half" }
      - { id: c, text: "Music", feedback: "คำดนตรีเช่น sing, song, drum, guitar" }
      - { id: d, text: "Art", feedback: "คำศิลปะเช่น draw, paint, brush, colour" }
    hints:
      - "แปลแต่ละคำก่อน: root = ราก, seed = เมล็ด"
      - "magnet = แม่เหล็ก, thermometer = เครื่องวัดอุณหภูมิ ใช้ในวิชาไหน"
    solution: "ทุกคำเป็นคำศัพท์วิชา **Science** (วิทยาศาสตร์)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.categories-cross-curricular.p013
    topics: [english.vocabulary.categories-cross-curricular]
    difficulty: 4
    type: text
    stem: "อ่าน 2 × 6 = 12 เป็นภาษาอังกฤษ เขียนผลลัพธ์เป็นตัวหนังสือ: *Two times six is ___.*"
    accepted: ["twelve"]
    misconceptions:
      - { match: "eight", feedback: "times แปลว่า คูณ ไม่ใช่ บวก (2 + 6 = 8)" }
      - { match: "four", feedback: "times แปลว่า คูณ ไม่ใช่ ลบ (6 − 2 = 4)" }
      - { match: "12", feedback: "คำตอบถูก แต่โจทย์ให้เขียนเป็นตัวหนังสือภาษาอังกฤษ" }
      - { match: "twelf", feedback: "สะกดผิด ที่ถูกคือ twelve" }
    hints:
      - "times = คูณ"
      - "คิด 2 × 6 แล้วเขียนเป็นคำ"
    solution: "2 × 6 = 12 → *Two times six is **twelve**.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.categories-cross-curricular.p014
    topics: [english.vocabulary.categories-cross-curricular]
    difficulty: 4
    type: mcq
    stem: "นักเรียน ป.4 รวบรวมคำศัพท์เพื่อนำเสนอเรื่อง แผนที่ประเทศไทย ในวิชาสังคมศึกษา เช่น แม่น้ำเจ้าพระยา ดอยอินทนนท์ อ่าวไทย เกาะสมุย กลุ่มคำใดเหมาะที่สุด"
    choices:
      - { id: a, text: "river, mountain, sea, island", correct: true, feedback: "ถูก แม่น้ำ ภูเขา ทะเล เกาะ ตรงกับสิ่งที่อยู่บนแผนที่" }
      - { id: b, text: "add, minus, half, equal", feedback: "เป็นคำศัพท์คณิตศาสตร์ ไม่ใช่ภูมิศาสตร์" }
      - { id: c, text: "drum, guitar, song, dance", feedback: "เป็นคำศัพท์ดนตรีและนาฏศิลป์" }
      - { id: d, text: "run, jump, kick, throw", feedback: "เป็นคำศัพท์พลศึกษา (กริยาท่าทาง)" }
    hints:
      - "แม่น้ำ ภูเขา ทะเล เกาะ ภาษาอังกฤษว่าอะไร"
      - "เลือกกลุ่มคำที่เป็นสิ่งบนแผนที่ (geography)"
    solution: "***river, mountain, sea, island*** → Chao Phraya River, Doi Inthanon (mountain), the Gulf of Thailand (sea), Ko Samui (island)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.categories-cross-curricular.p015
    topics: [english.vocabulary.categories-cross-curricular]
    difficulty: 4
    type: numeric
    stem: "ร้านเครื่องเขียนในตลาดมีป้ายว่า *There are fifteen red pens and nine blue pens.* มีปากกาทั้งหมดกี่ด้าม"
    answer: { value: 24, unit: "ด้าม" }
    misconceptions:
      - { match: 6, feedback: "โจทย์ถามจำนวนทั้งหมด ต้องบวก ไม่ใช่ลบ" }
      - { match: 14, feedback: "fifteen คือ 15 ไม่ใช่ 50 หรือ 5 ลองอ่านตัวเลขอีกครั้ง (fifteen = 15, nine = 9)" }
    hints:
      - "fifteen = 15, nine = 9"
      - "ทั้งหมด = นำสองจำนวนมาบวกกัน"
    solution: "fifteen = 15, nine = 9 → 15 + 9 = **24** ด้าม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.categories-cross-curricular.p016
    topics: [english.vocabulary.categories-cross-curricular]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "เลือกประโยคที่ถูกต้องตามความจริงทุกข้อ"
    choices:
      - { id: a, text: "A plant needs water and sun.", correct: true, feedback: "ถูก ต้นไม้ต้องการน้ำและแสงแดด" }
      - { id: b, text: "A leaf is part of a plant.", correct: true, feedback: "ถูก ใบเป็นส่วนหนึ่งของต้นไม้" }
      - { id: c, text: "A fish lives in a tree.", feedback: "ปลาอาศัยอยู่ในน้ำ (lives in water)" }
      - { id: d, text: "A spoon is an animal.", feedback: "ช้อนเป็นสิ่งของ (a thing)" }
      - { id: e, text: "Elephants live in Thailand.", correct: true, feedback: "ถูก ประเทศไทยมีช้างทั้งช้างป่าและช้างเลี้ยง" }
    hints:
      - "แปลแต่ละประโยค แล้วคิดว่าจริงหรือไม่"
      - "is part of = เป็นส่วนหนึ่งของ, lives in = อาศัยอยู่ใน"
    solution: "ประโยคที่จริง: **A plant needs water and sun.**, **A leaf is part of a plant.**, **Elephants live in Thailand.** ส่วนปลาอยู่ในน้ำ และช้อนเป็นสิ่งของ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.categories-cross-curricular.p017
    topics: [english.vocabulary.categories-cross-curricular]
    difficulty: 5
    type: text
    stem: "เติมชื่อหมวดย่อยที่แปลว่า สัตว์เลี้ยง (คำเดียว): *A cat, a dog and a rabbit are ___.*"
    accepted: ["pets"]
    misconceptions:
      - { match: "pet", feedback: "สัตว์หลายตัวต้องใช้รูปพหูพจน์ เติม s" }
      - { match: "animals", feedback: "ถูกว่าเป็นสัตว์ แต่โจทย์ถามหมวดย่อย สัตว์เลี้ยง" }
      - { match: "wild animals", feedback: "wild animals คือสัตว์ป่า แมว หมา กระต่ายเป็นสัตว์ที่เลี้ยงไว้ในบ้าน" }
    hints:
      - "สัตว์ที่เลี้ยงไว้ในบ้านเรียกว่าอะไร"
      - "มีสัตว์สามตัว ใช้รูปพหูพจน์"
    solution: "*A cat, a dog and a rabbit are **pets**.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.categories-cross-curricular.p018
    topics: [english.vocabulary.categories-cross-curricular]
    difficulty: 5
    type: mcq
    stem: "มะลินำเสนอสมุดคำศัพท์ของเธอ ข้อใดพูดได้ถูกต้องทั้งความหมายและไวยากรณ์"
    choices:
      - { id: a, text: "These are music words: sing, drum and guitar.", correct: true, feedback: "ถูก sing, drum, guitar เป็นคำศัพท์ดนตรี และ These are ใช้กับหลายคำ" }
