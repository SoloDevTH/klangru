  solution: $\Delta a \approx \dfrac{2GM_\mathrm{m}R_\mathrm{E}}{d^3} = \dfrac{2(6.674\times10^{-11})(7.342\times10^{22})(6.371\times10^{6})}{(3.844\times10^{8})^3} \approx 1.099e-06\,\mathrm{m/s^2} = 1.10\,\mu\mathrm{m/s^2}$
