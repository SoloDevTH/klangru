id: computer.systems.computer-systems
subject: computer
title: { th: ระบบคอมพิวเตอร์และเทคโนโลยีการสื่อสาร, en: "Computer systems and communication technology" }
summary: ฮาร์ดแวร์ ซอฟต์แวร์ และผู้ใช้ หน่วยรับเข้า ซีพียู หน่วยความจำ หน่วยเก็บถาวร หน่วยส่งออก วงรอบดึง ถอดรหัส ทำคำสั่ง ลำดับชั้นหน่วยความจำ และการสื่อสารระหว่างอุปกรณ์
difficulty: 3
minutes: 35
prerequisites: [computer.data.binary, computer.data.digital-data-basics]
encompasses:
  - { id: computer.data.binary, weight: 0.2 }
  - { id: computer.data.digital-data-basics, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: system-block.svg
    alt: "แผนภาพระบบคอมพิวเตอร์ ซ้ายสุดคือหน่วยรับเข้า เช่น แป้นพิมพ์ เมาส์ ไมโครโฟน กล้อง จอสัมผัส เซนเซอร์ ลูกศรข้อมูลเข้าชี้ไปที่กล่องใหญ่ตรงกลางคือหน่วยประมวลผลกลาง CPU ข้างในมีหน่วยควบคุม CU สั่งงานและถอดรหัสคำสั่ง หน่วยคำนวณ ALU บวก ลบ เปรียบเทียบ รีจิสเตอร์ PC IR ACC และแคช จาก CPU มีลูกศรผลลัพธ์ไปที่หน่วยส่งออกทางขวา เช่น จอภาพ ลำโพง เครื่องพิมพ์ มอเตอร์ หลอดไฟ ด้านล่างมีแถบบัสเชื่อมทุกหน่วย และต่อกับหน่วยความจำหลัก RAM ที่ข้อมูลหายเมื่อไฟดับและ ROM กับหน่วยเก็บถาวร SSD ฮาร์ดดิสก์ แฟลชไดรฟ์"
    caption: "ห้าหน่วยของคอมพิวเตอร์ส่งข้อมูลถึงกันผ่านบัส"
  - type: figure
    src: fetch-cycle.svg
    alt: "วงรอบสามขั้นของซีพียู ขั้น 1 ดึง ใช้ที่อยู่ใน PC อ่านคำสั่งจากหน่วยความจำมาไว้ใน IR แล้ว PC เพิ่มขึ้น 1 ขั้น 2 ถอดรหัส หน่วยควบคุมแปลว่าคำสั่งให้ทำอะไรกับข้อมูลใด ขั้น 3 ทำคำสั่ง ALU คำนวณหรือย้ายข้อมูลแล้วเก็บผลไว้ แล้ววนกลับไปขั้น 1 จนพบคำสั่ง HALT ทางขวาเป็นตารางหน่วยความจำตัวอย่าง ที่อยู่ 0 LOAD 4 ที่อยู่ 1 ADD 5 ที่อยู่ 2 STORE 6 ที่อยู่ 3 HALT ที่อยู่ 4 เก็บ 7 ที่อยู่ 5 เก็บ 8 ที่อยู่ 6 เก็บ 0 คำสั่งและข้อมูลอยู่ในหน่วยความจำเดียวกัน"
    caption: "คำสั่งและข้อมูลอยู่ในหน่วยความจำเดียวกัน ซีพียูดึงมาทำทีละคำสั่ง"
  - type: worked-example
    title: ไล่วงรอบดึง ถอดรหัส ทำคำสั่ง
    problem: "จากตารางหน่วยความจำในภาพวงรอบ (LOAD 4, ADD 5, STORE 6, HALT และข้อมูล 7, 8, 0) โดย LOAD a คือ ACC ← ค่าในที่อยู่ a, ADD a คือ ACC ← ACC + ค่าในที่อยู่ a, STORE a คือ ค่าในที่อยู่ a ← ACC เริ่มที่ PC = 0 เมื่อโปรแกรมหยุด ที่อยู่ 6 เก็บค่าใด และ CPU ทำวงรอบกี่รอบ"
    steps:
      - text: "รอบ 1: ดึงคำสั่งที่ที่อยู่ 0 คือ LOAD 4 แล้ว PC เป็น 1 ถอดรหัสได้ว่าให้โหลด ทำคำสั่ง ACC = ค่าในที่อยู่ 4 = 7"
        why: "ตัวเลขหลังคำสั่งคือที่อยู่ ไม่ใช่ค่า ต้องไปอ่านค่าที่เก็บในที่อยู่นั้น"
      - text: "รอบ 2: ดึง ADD 5 แล้ว PC เป็น 2 ทำคำสั่ง ACC = 7 + ค่าในที่อยู่ 5 = 7 + 8 = 15"
      - text: "รอบ 3: ดึง STORE 6 แล้ว PC เป็น 3 ทำคำสั่ง เขียน 15 ลงที่อยู่ 6"
      - text: "รอบ 4: ดึง HALT แล้วหยุด ไม่มีการคำนวณ"
        why: "HALT ก็ต้องถูกดึงและถอดรหัสเหมือนคำสั่งอื่น จึงนับเป็นหนึ่งรอบ"
    answer: "ที่อยู่ 6 เก็บ 15 และทำวงรอบ 4 รอบ"
  - { type: check, problem: computer.systems.computer-systems.p008, prompt: "ลองไล่โปรแกรมของคอมพิวเตอร์จำลองอีกโปรแกรมหนึ่ง" }
  - type: figure
    src: memory-pyramid.svg
    alt: "พีระมิดลำดับชั้นหน่วยความจำ จากบนลงล่าง รีจิสเตอร์ในซีพียู เวลาเข้าถึงน้อยกว่า 1 นาโนวินาที จุไม่กี่ร้อยไบต์ แคชในชิปซีพียู ราว 1 ถึง 10 นาโนวินาที จุระดับ KB ถึง MB หน่วยความจำหลัก RAM บนเมนบอร์ด ราว 100 นาโนวินาที จุหลาย GB SSD ราว 0.1 มิลลิวินาที จุหลายร้อย GB ถึง TB ฮาร์ดดิสก์ ราว 10 มิลลิวินาที จุหลาย TB ลูกศรชี้ลงบอกว่ายิ่งล่างยิ่งช้า จุมากขึ้น และราคาต่อ GB ถูกลง รีจิสเตอร์ แคช และ RAM ข้อมูลหายเมื่อไฟดับ ส่วน SSD และฮาร์ดดิสก์ไม่หาย"
    caption: "ชั้นบนเร็วแต่จุน้อย ชั้นล่างจุมากแต่ช้า"
  - type: worked-example
    title: ส่งไฟล์ผ่านอินเทอร์เน็ตใช้เวลาเท่าไร
    problem: "นิดอัปโหลดคลิปงานกลุ่มขนาด 300 MB ผ่านอินเทอร์เน็ตที่อัปโหลดได้ 50 Mbps ถ้าความเร็วคงที่ตลอด จะใช้เวลากี่วินาที"
    steps:
      - text: "ขนาดไฟล์บอกเป็นไบต์ แต่ความเร็วบอกเป็นบิตต่อวินาที ต้องแปลงให้เป็นหน่วยเดียวกันก่อน"
        why: "MB คือเมกะไบต์ Mbps คือเมกะบิตต่อวินาที ตัว B ใหญ่คือไบต์ b เล็กคือบิต"
      - text: "แปลงไฟล์เป็นบิต: 300 MB × 8 = 2,400 Mb"
      - text: "เวลา = ขนาด ÷ ความเร็ว = 2,400 Mb ÷ 50 Mb/s = 48 วินาที"
      - text: "ตรวจความสมเหตุสมผล: ถ้าลืมคูณ 8 จะได้ 6 วินาที ซึ่งเร็วเกินจริง 8 เท่า"
    answer: "ใช้เวลา 48 วินาที (ในทางปฏิบัติอาจนานกว่านี้เล็กน้อยเพราะความเร็วจริงไม่คงที่)"
  - { type: check, problem: computer.systems.computer-systems.p009, prompt: "ใช้วิธีเดียวกันกับการดาวน์โหลดไฟล์" }
glossary:
  - { term: หน่วยประมวลผลกลาง (CPU), definition: "ชิปที่ดึงคำสั่งจากหน่วยความจำมาถอดรหัสและทำตาม มีหน่วยควบคุม หน่วยคำนวณและตรรกะ และรีจิสเตอร์" }
  - { term: หน่วยความจำหลัก (RAM), definition: "หน่วยความจำที่เก็บโปรแกรมและข้อมูลที่กำลังทำงาน เร็วกว่า SSD แต่ข้อมูลหายเมื่อไฟดับ" }
  - { term: หน่วยเก็บถาวร (storage), definition: "อุปกรณ์เก็บไฟล์ไว้แม้ปิดเครื่อง เช่น SSD ฮาร์ดดิสก์ แฟลชไดรฟ์" }
  - { term: ตัวนับโปรแกรม (PC), definition: "รีจิสเตอร์ที่เก็บที่อยู่ของคำสั่งถัดไปที่ซีพียูจะดึงมาทำ" }
  - { term: แคช (cache), definition: "หน่วยความจำขนาดเล็กและเร็วในชิปซีพียู เก็บสำเนาข้อมูลที่ใช้บ่อยเพื่อไม่ต้องรอ RAM" }
  - { term: บัส (bus), definition: "ทางส่งข้อมูล ที่อยู่ และสัญญาณควบคุมระหว่างหน่วยต่าง ๆ ของคอมพิวเตอร์" }
  - { term: ไดรเวอร์ (driver), definition: "ซอฟต์แวร์ระบบที่ทำให้ระบบปฏิบัติการสื่อสารกับฮาร์ดแวร์ชิ้นหนึ่งได้" }
flashcards:
  - { front: "ห้าหน่วยของคอมพิวเตอร์", back: "หน่วยรับเข้า หน่วยประมวลผลกลาง หน่วยความจำหลัก หน่วยเก็บถาวร หน่วยส่งออก" }
  - { front: "วงรอบการทำงานของซีพียู", back: "ดึง (fetch) → ถอดรหัส (decode) → ทำคำสั่ง (execute) แล้ววนซ้ำ" }
  - { front: "RAM ต่างจาก SSD อย่างไร", back: "RAM เร็ว ใช้ระหว่างทำงาน ข้อมูลหายเมื่อไฟดับ SSD ช้ากว่า แต่เก็บไฟล์ถาวร" }
  - { front: "ไฟล์ 100 MB ส่งด้วยความเร็ว 100 Mbps ใช้เวลาเท่าไร", back: "8 วินาที (100 MB = 800 Mb แล้วหารด้วย 100 Mb/s)" }
  - { front: "สถาปัตยกรรมฟอน นอยมันน์", back: "เก็บทั้งคำสั่งและข้อมูลไว้ในหน่วยความจำเดียวกัน ซีพียูดึงคำสั่งมาทำทีละคำสั่ง" }
