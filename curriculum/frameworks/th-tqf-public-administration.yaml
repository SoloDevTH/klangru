# มาตรฐานคุณวุฒิระดับปริญญาตรี สาขาวิชารัฐประศาสนศาสตร์ พ.ศ. ๒๕๕๘ (มคอ.๑) เอกสารแนบท้ายประกาศกระทรวงศึกษาธิการ
#
# ที่มาและสถานะ (ตรวจเมื่อ 2026-10-24)
# - อยู่ในรายการ มคอ.๑ ระดับปริญญาตรีที่สำนักงานปลัดกระทรวงศึกษาธิการรวบรวมไว้ (หน้านั้นสะกดว่า "รัฐประศาสสนศาสตร์" ซึ่งน่าจะพิมพ์ผิด)
# - ไฟล์ที่ใช้เป็นเอกสารแนบท้ายประกาศที่มหาวิทยาลัยราชภัฏกำแพงเพชรเผยแพร่ซ้ำ ไม่มีหน้าประกาศที่ลงนาม และยังหาหน้าราชกิจจานุเบกษาไม่พบ
#   หลักสูตร รป.บ. ของหลายมหาวิทยาลัย (เช่น มหาวิทยาลัยราชภัฏลำปาง มหาวิทยาลัยบูรพา) อ้างมาตรฐานฉบับนี้
# - ยังไม่พบฉบับแก้ไขหรือยกเลิก แต่กฎกระทรวงมาตรฐานคุณวุฒิระดับอุดมศึกษา พ.ศ. 2565 เปลี่ยนกรอบระดับชาติแล้ว
#
# โครงและรหัส
# - ใช้เลขข้อของต้นฉบับ (เขียนเป็นเลขอารบิก) ข้อย่อย (๑) (๒) ใช้รูป "5.1(1)"
#   strand 5 = ข้อ ๕ มาตรฐานผลการเรียนรู้ (standard = ด้าน ๕.๑-๕.๕)
#   strand 8 = ข้อ ๘ เนื้อหาสาระสำคัญของสาขาวิชา ต้นฉบับมีห้ากลุ่มองค์ความรู้ ๘.๑-๘.๕ ไม่มีข้อย่อย
#   จึงใช้ standard "8" หนึ่งรายการ และเชื่อมชื่อกลุ่มกับคำอธิบายด้วย ": " (แบบเดียวกับ th-tqf-accounting)
# - ไม่ได้เก็บข้อ ๑-๔, ๖-๗, ข้อความเชื่อมกลุ่มองค์ความรู้กับผลการเรียนรู้ (ก.-จ.) และข้อ ๙ เป็นต้นไป
# - ชั้นข้อความของ PDF (ฟอนต์ Angsana/Browallia New แบบ WinAnsi) ทำสระอำหาย ("ผู้นา" แทน "ผู้นำ") และแทรกช่องว่างกลางคำ
#   ("โครงสร้ าง สายการบั งคั บ บั ญชา") จึงแก้ทีละคำ และตรวจทานกับภาพหน้า PDF (หน้า 4-7 ของไฟล์ = หน้า ๒-๕ ของ มคอ.๑)
