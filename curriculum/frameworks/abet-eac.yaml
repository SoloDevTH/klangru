strands:
- id: DEF
  title: Definitions (นิยามที่ใช้ตีความเกณฑ์)
  standards:
  - id: DEF
    text: นิยามของ EAC ที่กำหนดขอบเขตวิชาพื้นฐาน (สรุปความ)
    indicators:
    - id: DEF Basic Science
      text: 'วิทยาศาสตร์พื้นฐาน: สาขาที่ศึกษาธรรมชาติในระดับหลักการ ได้แก่ เคมี ฟิสิกส์ และวิทยาศาสตร์ธรรมชาติอื่น เช่น ชีววิทยา โลกและอวกาศ'
    - id: DEF College-Level Mathematics
      text: 'คณิตศาสตร์ระดับมหาวิทยาลัย: ต้องยากอย่างน้อยเท่าแคลคูลัสเบื้องต้น ตัวอย่างที่เกณฑ์ยกไว้คือ แคลคูลัส สมการเชิงอนุพันธ์ ความน่าจะเป็น สถิติ พีชคณิตเชิงเส้น และคณิตศาสตร์ไม่ต่อเนื่อง'
    - id: DEF Engineering Science
      text: 'วิทยาศาสตร์วิศวกรรม: วิชาที่ต่อยอดจากคณิตศาสตร์และวิทยาศาสตร์พื้นฐานไปสู่การแก้ปัญหาวิศวกรรม เป็นสะพานระหว่างวิทยาศาสตร์กับการปฏิบัติงานวิศวกรรม'
    - id: DEF Engineering Design
      text: 'การออกแบบทางวิศวกรรม: กระบวนการวนซ้ำเพื่อสร้างระบบ ชิ้นส่วน หรือกระบวนการให้ตรงความต้องการภายใต้ข้อจำกัด ตั้งแต่กำหนดความต้องการ วิเคราะห์ สร้างทางเลือกหลายแบบ ประเมินความเสี่ยง และชั่งน้ำหนักได้เสีย'
    - id: DEF Complex Engineering Problems
      text: 'ปัญหาวิศวกรรมที่ซับซ้อน: ปัญหาที่มีลักษณะอย่างน้อยหนึ่งข้อ เช่น ประเด็นเทคนิคกว้างหรือขัดกันเอง ไม่มีคำตอบชัดเจน อยู่นอกมาตรฐานที่มี มีหลายส่วนย่อย ข้ามหลายสาขา หรือส่งผลกระทบสูง'
- id: GC
  title: General Criteria for Baccalaureate Level Programs (เกณฑ์ทั่วไประดับปริญญาตรี)
  standards:
  - id: Criterion 3
    text: 'Student Outcomes: ผลลัพธ์ที่บัณฑิตทุกหลักสูตรต้องทำได้เมื่อจบ (สรุปความ)'
    indicators:
    - id: Criterion 3 (1)
      text: ระบุ ตั้งโจทย์ และแก้ปัญหาวิศวกรรมที่ซับซ้อนได้ โดยใช้หลักวิศวกรรม วิทยาศาสตร์ และคณิตศาสตร์
    - id: Criterion 3 (2)
      text: ใช้การออกแบบทางวิศวกรรมสร้างทางแก้ที่ตรงความต้องการ โดยคำนึงถึงสาธารณสุข ความปลอดภัย สวัสดิภาพ และปัจจัยระดับโลก วัฒนธรรม สังคม สิ่งแวดล้อม และเศรษฐกิจ
    - id: Criterion 3 (3)
      text: สื่อสารได้อย่างมีประสิทธิภาพกับผู้ฟังหลายกลุ่ม
    - id: Criterion 3 (4)
      text: ตระหนักถึงความรับผิดชอบเชิงจริยธรรมและวิชาชีพ และตัดสินใจโดยพิจารณาผลกระทบของงานวิศวกรรมต่อโลก เศรษฐกิจ สิ่งแวดล้อม และสังคม
    - id: Criterion 3 (5)
      text: ทำงานเป็นทีมได้ดี ร่วมกันเป็นผู้นำ สร้างบรรยากาศร่วมมือ ตั้งเป้าหมาย วางแผนงาน และบรรลุเป้าหมาย
    - id: Criterion 3 (6)
      text: ออกแบบและทำการทดลองที่เหมาะสม วิเคราะห์และตีความข้อมูล และใช้วิจารณญาณทางวิศวกรรมสรุปผล
    - id: Criterion 3 (7)
      text: แสวงหาและประยุกต์ความรู้ใหม่ตามที่ต้องการ ด้วยกลยุทธ์การเรียนรู้ที่เหมาะสม
  - id: Criterion 5
    text: 'Curriculum: องค์ประกอบหลักสูตรที่ต้องมี โดยไม่กำหนดรายวิชาเฉพาะ (สรุปความ)'
    indicators:
    - id: Criterion 5 a.
      text: คณิตศาสตร์ระดับมหาวิทยาลัยรวมกับวิทยาศาสตร์พื้นฐานอย่างน้อย 30 หน่วยกิตทวิภาค (หรือเทียบเท่า) และมีประสบการณ์การทดลองที่เหมาะกับหลักสูตร
      note: ร่างแก้ไขที่เปิดรับความเห็นถึง 15 มิ.ย. 2569 จะให้นับวิชาคณิตศาสตร์/วิทยาศาสตร์ที่หลักสูตรกำหนดให้เรียนก่อนเข้าได้ ถ้ามีหลักฐาน (มีผลเร็วสุดรอบประเมิน 2027-28)
    - id: Criterion 5 b.
      text: หัวข้อวิศวกรรมอย่างน้อย 45 หน่วยกิตทวิภาค (หรือเทียบเท่า) ประกอบด้วยวิศวกรรมศาสตร์ วิทยาการคอมพิวเตอร์ และการออกแบบทางวิศวกรรม และใช้เครื่องมือวิศวกรรมสมัยใหม่
    - id: Criterion 5 c.
      text: ส่วนการศึกษาทั่วไปที่เสริมเนื้อหาเทคนิคและสอดคล้องกับวัตถุประสงค์ของหลักสูตร
    - id: Criterion 5 d.
      text: งานออกแบบทางวิศวกรรมใหญ่ช่วงท้ายหลักสูตร (capstone) ที่ใช้มาตรฐานวิศวกรรมและข้อจำกัดหลายด้าน และต่อยอดจากความรู้ในวิชาก่อนหน้า
- id: PC
  title: Program Criteria (เกณฑ์เฉพาะสาขา ส่วนหลักสูตร)
  standards:
  - id: PC Aerospace
    text: Aerospace and Similarly Named Engineering Programs (สรุปข้อกำหนดด้านหลักสูตร)
    indicators:
    - id: Aerospace 1
      text: ต้องมีการสร้างแบบจำลอง การจำลอง การคำนวณ และการทดสอบ ใช้กับการออกแบบและวิเคราะห์ระบบอากาศยาน/อวกาศยาน หลักสูตรการบินต้องครอบคลุมการบินในบรรยากาศ หลักสูตรอวกาศต้องครอบคลุมการบินในอวกาศ หลักสูตร aerospace ต้องมีทั้งสองด้าน และมีประสบการณ์ออกแบบที่ตรงชื่อหลักสูตร
  - id: PC Biomedical
    text: Bioengineering and Biomedical and Similarly Named Engineering Programs (สรุปข้อกำหนดด้านหลักสูตร)
    indicators:
    - id: Biomedical 1.a
      text: ประยุกต์หลักวิศวกรรม ชีววิทยา สรีรวิทยามนุษย์ เคมี ฟิสิกส์ที่ใช้แคลคูลัส คณิตศาสตร์ถึงสมการเชิงอนุพันธ์ และสถิติ
    - id: Biomedical 1.b
      text: แก้ปัญหาวิศวกรรมชีวภาพ/ชีวการแพทย์ รวมถึงปฏิสัมพันธ์ระหว่างระบบที่มีชีวิตกับไม่มีชีวิต
    - id: Biomedical 1.c
      text: วิเคราะห์ สร้างแบบจำลอง ออกแบบ และสร้างอุปกรณ์ ระบบ ชิ้นส่วน หรือกระบวนการทางวิศวกรรมชีวการแพทย์
    - id: Biomedical 1.d
      text: วัดและตีความข้อมูลจากระบบที่มีชีวิต
  - id: PC Chemical
    text: Chemical, Biochemical, Biomolecular, and Similarly Named Engineering Programs (สรุปข้อกำหนดด้านหลักสูตร)
    indicators:
    - id: Chemical 1.a
      text: ประยุกต์คณิตศาสตร์ รวมถึงสมการเชิงอนุพันธ์และสถิติ กับปัญหาวิศวกรรม
    - id: Chemical 1.b
      text: เคมีและฟิสิกส์ระดับมหาวิทยาลัย บางส่วนเป็นระดับสูง ตามวัตถุประสงค์หลักสูตร
    - id: Chemical 1.c
      text: ประยุกต์วิทยาศาสตร์เหล่านี้กับการออกแบบ วิเคราะห์ และควบคุมกระบวนการ รวมถึงอันตรายของกระบวนการ หลักสูตรชีวเคมี/ชีวโมเลกุลต้องมีการประยุกต์ทางชีวภาพด้วย
      note: ร่างเกณฑ์ใหม่ (Proposed) เพิ่มข้อระบุหัวข้อ ดุลมวลและพลังงาน อุณหพลศาสตร์ กลศาสตร์ของไหล การถ่ายเทความร้อนและมวล วิศวกรรมปฏิกิริยา การควบคุมกระบวนการ และการแยก
  - id: PC Civil
    text: Civil and Similarly Named Engineering Programs (สรุปข้อกำหนดด้านหลักสูตร)
    indicators:
    - id: Civil 1.a
      text: ประยุกต์ (i) คณิตศาสตร์ถึงสมการเชิงอนุพันธ์ ความน่าจะเป็นและสถิติ ฟิสิกส์ที่ใช้แคลคูลัส เคมี และวิทยาการคอมพิวเตอร์หรือวิทยาการข้อมูลหรือวิทยาศาสตร์พื้นฐานอีกสาขา (ii) กลศาสตร์วิศวกรรม วัสดุศาสตร์ และระเบียบวิธีเชิงตัวเลข (iii) ความยั่งยืน ความเสี่ยง และความยืดหยุ่นต่อภัย (iv) กระบวนการออกแบบในงานโยธาอย่างน้อยสองบริบท (v) จรรยาบรรณวิศวกรกับปัญหาจริยธรรม
    - id: Civil 1.b
      text: แก้ปัญหาวิศวกรรมที่ซับซ้อนในสาขาเฉพาะของงานโยธาอย่างน้อยสี่สาขา
    - id: Civil 1.c
      text: ทำการทดลองในบริบทงานโยธาอย่างน้อยสองบริบทและรายงานผล
    - id: Civil 1.d
      text: อธิบายหลักการบริหารโครงการและเศรษฐศาสตร์วิศวกรรม และทัศนคติ ความรับผิดชอบทางวิชาชีพของวิศวกรโยธา รวมถึงใบอนุญาตและความปลอดภัย
  - id: PC Electrical
    text: Electrical, Computer, Communications, Telecommunication(s), and Similarly Named Engineering Programs (สรุปข้อกำหนดด้านหลักสูตร)
    indicators:
    - id: Electrical 1
      text: ทุกหลักสูตรในกลุ่มนี้ต้องมีความน่าจะเป็นและสถิติ คณิตศาสตร์ถึงแคลคูลัสเชิงอนุพันธ์และปริพันธ์ วิทยาศาสตร์ (ชีวภาพ เคมี หรือกายภาพ) และหัวข้อวิศวกรรมรวมวิทยาการคอมพิวเตอร์ที่พอจะวิเคราะห์และออกแบบอุปกรณ์ ซอฟต์แวร์ และระบบฮาร์ดแวร์-ซอฟต์แวร์ที่ซับซ้อน หลักสูตรไฟฟ้า/อิเล็กทรอนิกส์/สื่อสารต้องเพิ่มคณิตศาสตร์ขั้นสูง เช่น สมการเชิงอนุพันธ์ พีชคณิตเชิงเส้น ตัวแปรเชิงซ้อน และคณิตศาสตร์ไม่ต่อเนื่อง หลักสูตรคอมพิวเตอร์ต้องมีคณิตศาสตร์ไม่ต่อเนื่อง หลักสูตรสื่อสาร/โทรคมนาคมต้องมีทฤษฎีและระบบสื่อสาร และหลักสูตรโทรคมนาคมต้องมีการออกแบบและดำเนินงานเครือข่าย
  - id: PC Environmental
    text: Environmental Engineering and Similarly Named Engineering Programs (สรุปข้อกำหนดด้านหลักสูตร)
    indicators:
    - id: Environmental 1.a
      text: คณิตศาสตร์ถึงสมการเชิงอนุพันธ์ ความน่าจะเป็นและสถิติ ฟิสิกส์ที่ใช้แคลคูลัส เคมี (ปริมาณสัมพันธ์ สมดุล จลนศาสตร์) วิทยาศาสตร์โลก ชีววิทยา และกลศาสตร์ของไหล
    - id: Environmental 1.b
      text: ดุลมวลและพลังงาน การเคลื่อนย้ายและการเปลี่ยนแปลงของสารในอากาศ น้ำ และดิน และหลักการขั้นสูงตามวัตถุประสงค์หลักสูตร
    - id: Environmental 1.c
      text: การทดลองปฏิบัติการและการวิเคราะห์ข้อมูลในงานสิ่งแวดล้อมมากกว่าหนึ่งด้าน
    - id: Environmental 1.d
      text: การออกแบบระบบวิศวกรรมสิ่งแวดล้อมที่คำนึงถึงความเสี่ยง ความไม่แน่นอน ความยั่งยืน วัฏจักรชีวิต และผลกระทบต่อสิ่งแวดล้อม
    - id: Environmental 1.e
      text: แนวคิดการปฏิบัติวิชาชีพ การบริหารโครงการ และบทบาทของหน่วยงานรัฐและเอกชนต่อนโยบายและกฎระเบียบสิ่งแวดล้อม
  - id: PC Industrial
    text: Industrial and Similarly Named Engineering Programs (สรุปข้อกำหนดด้านหลักสูตร)
    indicators:
    - id: Industrial 1
      text: ต้องครอบคลุมการออกแบบ วิเคราะห์ ดำเนินงาน และปรับปรุงระบบบูรณาการที่ผลิตสินค้าหรือบริการอย่างมีประสิทธิภาพและยั่งยืน ใช้ประสบการณ์จริงและมุมมองธุรกิจ และต้องมีหัวข้อการวิเคราะห์ผลิตภาพ การวิจัยดำเนินงาน ความน่าจะเป็น สถิติ เศรษฐศาสตร์วิศวกรรม และปัจจัยมนุษย์
  - id: PC Materials
    text: Materials, Metallurgical, Ceramics, and Similarly Named Engineering Programs (สรุปข้อกำหนดด้านหลักสูตร)
    indicators:
    - id: Materials 1.a
      text: หัวข้อที่รองรับสี่องค์ประกอบหลักของสาขา คือ โครงสร้าง สมบัติ กระบวนการผลิต และสมรรถนะของวัสดุ
    - id: Materials 1.b
      text: การเลือกและออกแบบวัสดุ กระบวนการ หรือทั้งสองอย่าง
    - id: Materials 1.c
      text: ใช้วิธีการทดลอง สถิติ และการคำนวณกับปัญหาด้านวัสดุ
  - id: PC Mechanical
    text: Mechanical and Similarly Named Engineering Programs (สรุปข้อกำหนดด้านหลักสูตร)
    indicators:
    - id: Mechanical 1.a
      text: หลักวิศวกรรม วิทยาศาสตร์พื้นฐาน และคณิตศาสตร์ รวมถึงแคลคูลัสหลายตัวแปรและสมการเชิงอนุพันธ์
    - id: Mechanical 1.b
      text: ประยุกต์หัวข้อเหล่านี้กับการสร้างแบบจำลอง วิเคราะห์ ออกแบบ และสร้างระบบ ชิ้นส่วน หรือกระบวนการทางกายภาพ
    - id: Mechanical 1.c
      text: ครอบคลุมทั้งระบบความร้อนและระบบกล
    - id: Mechanical 1.d
      text: ลงลึกในระบบความร้อนหรือระบบกลอย่างใดอย่างหนึ่ง
  - id: PC Mechatronics
    text: Mechatronics, Robotics, and Similarly Named Engineering Programs (สรุปข้อกำหนดด้านหลักสูตร)
    indicators:
    - id: Mechatronics 1
      text: ต้องมีแคลคูลัสเชิงอนุพันธ์และปริพันธ์ สมการเชิงอนุพันธ์ พีชคณิตเชิงเส้น ฟิสิกส์ที่ใช้แคลคูลัส หัวข้อระบบกล วงจรอิเล็กทรอนิกส์ ระบบควบคุม วิทยาการคอมพิวเตอร์ เซนเซอร์ แอกชูเอเตอร์ และตัวควบคุมแบบฝังตัว และการออกแบบระบบที่รวมฮาร์ดแวร์กับซอฟต์แวร์เพื่อควบคุมระบบกล
  - id: PC Mining
    text: Mining and Similarly Named Engineering Programs (สรุปข้อกำหนดด้านหลักสูตร)
    indicators:
    - id: Mining 1.a
      text: คณิตศาสตร์ถึงสมการเชิงอนุพันธ์ ฟิสิกส์ที่ใช้แคลคูลัส เคมีทั่วไป และความน่าจะเป็นและสถิติที่ใช้กับงานเหมืองแร่
    - id: Mining 1.b
      text: ธรณีวิทยา ได้แก่ ลักษณะแหล่งแร่ ธรณีวิทยากายภาพ ธรณีวิทยาโครงสร้างหรือธรณีวิทยาวิศวกรรม และการจำแนกแร่และหิน
    - id: Mining 1.c
      text: หัวข้อวิศวกรรม ได้แก่ สถิตศาสตร์ พลศาสตร์ กำลังวัสดุ กลศาสตร์ของไหล อุณหพลศาสตร์ และวงจรไฟฟ้า ปัญหาและการออกแบบงานเหมืองผิวดินและใต้ดิน และปฏิบัติการด้านธรณีวิทยา กลศาสตร์หิน และการระบายอากาศในเหมือง
  - id: PC Software
    text: Software and Similarly Named Engineering Programs (สรุปข้อกำหนดด้านหลักสูตร)
    indicators:
    - id: Software 1
      text: ต้องมีพื้นฐานการคำนวณ การออกแบบและสร้างซอฟต์แวร์ การวิเคราะห์ความต้องการ ความปลอดภัย การทวนสอบและตรวจสอบความถูกต้อง กระบวนการและเครื่องมือวิศวกรรมซอฟต์แวร์สำหรับระบบซับซ้อน และคณิตศาสตร์ไม่ต่อเนื่อง ความน่าจะเป็น และสถิติที่ใช้กับงานซอฟต์แวร์
