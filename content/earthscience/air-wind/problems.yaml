problems:
  - id: earthscience.atmosphere.air-wind.p001
    topics: [earthscience.atmosphere.air-wind]
    difficulty: 1
    type: mcq
    stem: "ข้อใดแสดงว่ามีอากาศอยู่รอบตัวเรา"
    choices:
      - { id: a, text: "เป่าลมเข้าลูกโป่ง แล้วลูกโป่งพองขึ้น", correct: true }
      - { id: b, text: "เรามองเห็นอากาศเป็นสีฟ้าในห้องเรียน", feedback: "อากาศในห้องไม่มีสี เรามองไม่เห็นอากาศ" }
      - { id: c, text: "ก้อนหินจมน้ำ", feedback: "ก้อนหินจมน้ำเพราะหนัก ไม่ได้บอกว่ามีอากาศ" }
      - { id: d, text: "ไฟในห้องสว่าง", feedback: "ไฟสว่างเพราะไฟฟ้า ไม่ได้แสดงว่ามีอากาศ" }
    hints:
      - "อากาศมองไม่เห็น แต่มีอยู่และใช้ที่"
      - "อะไรเข้าไปในลูกโป่งจนพอง"
    solution: "ลูกโป่งพองเพราะมีอากาศเข้าไปอยู่ข้างใน แสดงว่าอากาศมีอยู่จริงและต้องการที่อยู่ แม้เรามองไม่เห็น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.air-wind.p002
    topics: [earthscience.atmosphere.air-wind]
    difficulty: 1
    type: text
    stem: "อากาศที่เคลื่อนที่ เรียกว่าอะไร"
    accepted: ["ลม", "wind"]
    misconceptions:
      - { match: "พายุ", feedback: "พายุคือลมที่แรงมาก แต่อากาศที่เคลื่อนที่ทั่วไปเรียกว่าลม" }
      - { match: "ออกซิเจน", feedback: "ออกซิเจนเป็นแก๊สชนิดหนึ่งในอากาศ อากาศที่เคลื่อนที่เรียกว่าลม" }
    hints:
      - "เรารู้สึกได้เมื่อมันพัดผ่านหน้า"
      - "คำนี้มีพยางค์เดียว"
    solution: "อากาศที่เคลื่อนที่เรียกว่า ลม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.air-wind.p003
    topics: [earthscience.atmosphere.air-wind]
    difficulty: 1
    type: mcq
    stem: "คนและสัตว์ใช้แก๊สใดในอากาศในการหายใจ"
    choices:
      - { id: a, text: "ออกซิเจน", correct: true }
      - { id: b, text: "ไนโตรเจน", feedback: "ไนโตรเจนมีมากที่สุดในอากาศ แต่ร่างกายใช้ออกซิเจนในการหายใจ" }
      - { id: c, text: "คาร์บอนไดออกไซด์", feedback: "คาร์บอนไดออกไซด์เป็นแก๊สที่เราหายใจออก และพืชใช้สร้างอาหาร" }
    hints:
      - "ไฟก็ต้องใช้แก๊สนี้จึงลุกไหม้ได้"
      - "แก๊สนี้มีประมาณ 21 ส่วนใน 100 ส่วน"
    solution: "คนและสัตว์ใช้ออกซิเจนในการหายใจ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.air-wind.p004
    topics: [earthscience.atmosphere.air-wind]
    difficulty: 2
    type: numeric
    stem: "ถ้าแบ่งอากาศแห้งเป็น 100 ส่วน จะมีไนโตรเจนประมาณกี่ส่วน"
    answer: { value: 78, tolerance: 1, unit: ส่วน }
    misconceptions:
      - { match: 21, feedback: "21 ส่วนคือออกซิเจน โจทย์ถามไนโตรเจน" }
      - { match: 1, feedback: "1 ส่วนคือแก๊สอื่น ๆ เช่น อาร์กอน" }
    hints:
      - "ไนโตรเจนเป็นแก๊สที่มีมากที่สุดในอากาศ"
      - "มากกว่าสามในสี่ของอากาศ"
    solution: "อากาศแห้ง 100 ส่วน มีไนโตรเจนประมาณ 78 ส่วน ออกซิเจนประมาณ 21 ส่วน และแก๊สอื่นประมาณ 1 ส่วน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.air-wind.p005
    topics: [earthscience.atmosphere.air-wind]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดทำให้เกิดฝุ่น PM2.5 และควันในอากาศ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "เผาขยะและใบไม้", correct: true }
      - { id: b, text: "เผาไร่อ้อยและตอซังข้าว", correct: true }
      - { id: c, text: "ควันจากท่อไอเสียรถยนต์", correct: true }
      - { id: d, text: "ปลูกต้นไม้ริมถนน", feedback: "ต้นไม้ช่วยดักฝุ่นบางส่วนและให้ร่มเงา ไม่ได้ทำให้เกิดฝุ่น" }
    hints:
      - "ฝุ่นและควันมาจากการเผาไหม้"
      - "ข้อไหนไม่มีการเผาเลย"
    solution: "การเผาขยะ การเผาไร่ และควันจากรถเกิดจากการเผาไหม้ จึงทำให้เกิดฝุ่น PM2.5 และควัน ส่วนการปลูกต้นไม้ช่วยให้อากาศดีขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.air-wind.p006
    topics: [earthscience.atmosphere.air-wind]
    difficulty: 2
    type: mcq
    stem: "ภาพแสดงธงหน้าโรงเรียนในสามวัน วันใดลมแรงที่สุด"
    figure: { src: p-flags.svg, alt: "เสาธงสามต้น ธง ก ผืนธงกางออกเกือบตั้งฉากกับเสา ธง ข ผืนธงห้อยแนบเสา ธง ค ผืนธงเอียงลงประมาณครึ่งทาง" }
    choices:
      - { id: a, text: "วันที่เห็นธง ก", correct: true }
      - { id: b, text: "วันที่เห็นธง ข", feedback: "ธง ข ห้อยแนบเสา แปลว่าลมสงบหรือแทบไม่มีลม" }
      - { id: c, text: "วันที่เห็นธง ค", feedback: "ธง ค ยกขึ้นเพียงครึ่งหนึ่ง แปลว่าลมอ่อน" }
    hints:
      - "ลมยิ่งแรง ธงยิ่งสะบัดกางออก"
      - "หาธงที่กางออกตั้งฉากกับเสามากที่สุด"
    solution: "ธง ก กางออกเกือบตั้งฉากกับเสา แสดงว่าลมแรงที่สุด ธง ค ลมอ่อน ธง ข ลมสงบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.air-wind.p007
    topics: [earthscience.atmosphere.air-wind]
    difficulty: 2
    type: match
    stem: "จับคู่การใช้ลมกับสิ่งที่ได้"
    pairs:
      - { left: "กังหันลมผลิตไฟฟ้า", right: "ได้ไฟฟ้าใช้" }
      - { left: "กังหันวิดน้ำในนาเกลือ", right: "ได้น้ำทะเลเข้านาโดยไม่ต้องใช้น้ำมัน" }
      - { left: "ตากผ้าในที่มีลม", right: "ผ้าแห้งเร็ว" }
      - { left: "เรือใบ", right: "เรือแล่นไปได้" }
    hints:
      - "ลมดันสิ่งต่าง ๆ ให้เคลื่อนที่ได้"
      - "ลมยังช่วยพาน้ำที่ระเหยออกไปจากผ้า"
    solution: "ลมหมุนกังหันได้ไฟฟ้า หมุนกังหันวิดน้ำเข้านาเกลือ พาไอน้ำออกจากผ้าจึงแห้งเร็ว และดันใบเรือให้เรือแล่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.air-wind.p008
    topics: [earthscience.atmosphere.air-wind]
    difficulty: 3
    type: order
    stem: "เรียงขั้นการเกิดลมระหว่างลานคอนกรีตกลางแดดกับใต้ร่มไม้"
    items:
      - "แดดทำให้ลานคอนกรีตร้อน"
      - "อากาศเหนือลานคอนกรีตร้อนขึ้น"
      - "อากาศร้อนลอยสูงขึ้น"
      - "อากาศเย็นจากใต้ร่มไม้เคลื่อนเข้าแทนที่ เกิดเป็นลม"
    hints:
      - "เริ่มจากสิ่งที่ทำให้เกิดความร้อน"
      - "อากาศร้อนลอยขึ้นก่อน แล้วอากาศเย็นจึงเข้ามาแทนที่"
    solution: "แดดทำให้ลานร้อน → อากาศเหนือลานร้อนขึ้น → อากาศร้อนลอยขึ้น → อากาศเย็นจากใต้ร่มไม้เคลื่อนเข้าแทนที่ อากาศที่เคลื่อนที่นี้คือลม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.air-wind.p009
    topics: [earthscience.atmosphere.air-wind]
    difficulty: 3
    type: mcq
    stem: "ครูจุดเทียนไว้ แล้วถือธูปที่จุดไว้ใกล้ ๆ ฐานเทียน ควันธูปเคลื่อนเข้าหาเปลวเทียน แล้วลอยขึ้นไปเหนือเปลวเทียน การทดลองนี้เป็นหลักฐานของเรื่องใด"
    choices:
      - { id: a, text: "อากาศร้อนลอยขึ้น และอากาศรอบ ๆ เคลื่อนเข้าแทนที่ ซึ่งเป็นการเกิดลม", correct: true }
      - { id: b, text: "ควันธูปหนักกว่าอากาศ", feedback: "ถ้าควันหนักกว่าอากาศ ควันจะจมลง แต่ในการทดลองควันลอยขึ้น" }
      - { id: c, text: "เปลวเทียนดูดควันเพราะเป็นแม่เหล็ก", feedback: "เปลวไฟไม่ใช่แม่เหล็ก ควันเคลื่อนที่ไปพร้อมอากาศที่ไหล" }
      - { id: d, text: "อากาศร้อนจมลงใต้โต๊ะ", feedback: "อากาศร้อนลอยขึ้น ดูได้จากควันที่ลอยขึ้นเหนือเปลวเทียน" }
    hints:
      - "อากาศเหนือเปลวเทียนเป็นอย่างไร"
      - "ควันช่วยให้เราเห็นทางที่อากาศเคลื่อนที่"
    solution: "อากาศเหนือเปลวเทียนร้อนขึ้นและลอยขึ้น อากาศรอบ ๆ จึงเคลื่อนเข้ามาแทนที่ ควันธูปเคลื่อนตามอากาศนั้น เราจึงเห็นทางของลมเล็ก ๆ ที่เกิดจากความร้อนต่างกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.air-wind.p010
    topics: [earthscience.atmosphere.air-wind]
    difficulty: 3
    type: mcq
    stem: "เช้าวันหนึ่งในเดือนมีนาคม แอป Air4Thai แสดงคุณภาพอากาศในเชียงใหม่เป็นสีแดง นักเรียนควรทำอย่างไร"
    choices:
      - { id: a, text: "อยู่ในอาคารมากขึ้น งดวิ่งเล่นกลางแจ้ง และสวมหน้ากากที่กันฝุ่นได้เมื่อออกไปข้างนอก", correct: true }
      - { id: b, text: "ออกไปวิ่งออกกำลังกายกลางแจ้งนาน ๆ", feedback: "ตอนวิ่ง เราหายใจแรงและเร็ว ฝุ่นจะเข้าปอดมากขึ้น" }
      - { id: c, text: "ไม่ต้องทำอะไร เพราะมองไม่เห็นฝุ่น", feedback: "ฝุ่น PM2.5 เล็กจนมองไม่เห็นทีละเม็ด แต่เข้าปอดได้ลึก" }
      - { id: d, text: "ช่วยกันเผาใบไม้ให้หมดเร็ว ๆ", feedback: "การเผาใบไม้ทำให้เกิดฝุ่นและควันเพิ่มขึ้น" }
    hints:
      - "สีแดงหมายความว่าอากาศดีหรือไม่ดี"
      - "จะลดฝุ่นที่เข้าร่างกายได้อย่างไร"
    solution: "สีแดงคืออากาศมีผลต่อสุขภาพ ควรอยู่ในอาคาร งดกิจกรรมกลางแจ้ง และสวมหน้ากากที่กันฝุ่นได้เมื่อต้องออกไป ถ้าไอมากหรือหายใจลำบากให้บอกผู้ใหญ่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.air-wind.p011
    topics: [earthscience.atmosphere.air-wind]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ครอบครัวของน้ำฝนอยากช่วยลดมลพิษทางอากาศ ข้อใดช่วยได้ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "นำใบไม้แห้งไปทำปุ๋ยหมักแทนการเผา", correct: true }
      - { id: b, text: "ปั่นจักรยานไปตลาดที่อยู่ใกล้บ้าน", correct: true }
      - { id: c, text: "ดับเครื่องยนต์เมื่อจอดรถรอนาน ๆ", correct: true }
      - { id: d, text: "จุดไฟเผาขยะพลาสติกหลังบ้าน", feedback: "การเผาขยะ โดยเฉพาะพลาสติก ทำให้เกิดฝุ่นและแก๊สพิษ" }
    hints:
      - "หาวิธีที่ลดการเผาไหม้"
      - "รถยนต์ที่ติดเครื่องปล่อยควันตลอดเวลา"
    solution: "การทำปุ๋ยหมักแทนการเผา การปั่นจักรยาน และการดับเครื่องยนต์เมื่อจอดรอ ช่วยลดควันและฝุ่น ส่วนการเผาขยะทำให้มลพิษเพิ่มขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.air-wind.p012
    topics: [earthscience.atmosphere.air-wind]
    difficulty: 3
    type: match
    stem: "จับคู่ลักษณะของถุงลมที่สนามบินกับแรงลม"
    pairs:
      - { left: "ถุงลมห้อยลงแนบเสา", right: "ลมสงบ" }
      - { left: "ถุงลมยกขึ้นประมาณครึ่งหนึ่ง", right: "ลมอ่อน" }
      - { left: "ถุงลมพองตั้งตรง", right: "ลมแรง" }
    hints:
      - "ลมยิ่งแรง ถุงลมยิ่งพองและยกขึ้น"
      - "ไม่มีลม ถุงลมก็ห้อยลง"
    solution: "ถุงลมห้อยลงคือลมสงบ ยกขึ้นครึ่งหนึ่งคือลมอ่อน พองตั้งตรงคือลมแรง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.air-wind.p013
    topics: [earthscience.atmosphere.air-wind]
    difficulty: 4
    type: mcq
    stem: "ที่สนามบิน ถุงลมพองตั้งตรงและชี้ไปทางทิศตะวันตก ลมพัดมาจากทิศใด"
    choices:
      - { id: a, text: "ทิศตะวันออก", correct: true }
      - { id: b, text: "ทิศตะวันตก", feedback: "ถุงลมชี้ไปทางที่ลมพัดไป ลมจึงพัดไปทางตะวันตก และพัดมาจากทิศตรงข้าม" }
      - { id: c, text: "ทิศเหนือ", feedback: "ทิศเหนือตั้งฉากกับทิศที่ถุงลมชี้ ไม่ใช่ทิศที่ลมพัดมา" }
      - { id: d, text: "บอกไม่ได้", feedback: "ถุงลมบอกทิศได้ ปากถุงหันรับลม ปลายถุงชี้ไปทางที่ลมพัดไป" }
    hints:
      - "ลมพัดเข้าปากถุง แล้วดันปลายถุงไปทางเดียวกับลม"
      - "ทิศที่ลมพัดมาอยู่ตรงข้ามกับทิศที่ถุงลมชี้"
    solution: "ถุงลมชี้ไปทางที่ลมพัดไป คือทิศตะวันตก ลมจึงพัดมาจากทิศตรงข้าม คือทิศตะวันออก และถุงลมพองตั้งตรงแสดงว่าลมแรง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.air-wind.p014
    topics: [earthscience.atmosphere.air-wind]
    difficulty: 4
    type: numeric
    stem: "ห้องเรียนหนึ่งมีอากาศ 200 ลูกบาศก์เมตร ในอากาศนี้มีออกซิเจนประมาณกี่ลูกบาศก์เมตร (ออกซิเจนประมาณ 21 ส่วนใน 100 ส่วน)"
    answer: { value: 42, tolerance: 1, unit: ลูกบาศก์เมตร }
    misconceptions:
      - { match: 156, feedback: "156 คือไนโตรเจน (78 ส่วนใน 100 ส่วน) โจทย์ถามออกซิเจน" }
