topic: computer.ai.responsible-ai
rows:
  - { framework: acm-cs2023, indicators: ["AI-SEP"], coverage: partial, note: "สอนหลักจริยธรรม AI (ความเป็นธรรม ความโปร่งใส การอธิบายได้ ความรับผิดชอบ ความเป็นส่วนตัว ความปลอดภัย) ผลต่อสังคม มนุษย์ในวงจร และกรอบกฎหมายแบบภาพรวม แต่ยังไม่สอนการประเมินระบบ AI เชิงเทคนิคอย่างลึก" }
  - { framework: csta-k12-cs-2026, indicators: ["HS-ALG-IM-10"], coverage: full, note: "ประเมินนัยทางจริยธรรม ผลต่อสังคม และอคติของระบบแบบกฎและแบบเรียนจากข้อมูล (บทเรียนและโจทย์ p003 p004 p009 p010 p014)" }
  - { framework: csta-k12-cs-2026, indicators: ["S1-AIN-HR-08"], coverage: partial, note: "วางมาตรการป้องกันระบบ AI ให้คุ้มครองผู้คนและความเป็นส่วนตัวพร้อมมนุษย์ตัดสินใจ สอนหลักมนุษย์ในวงจร (p004 p014) แต่การวางมาตรการจริงในระบบยังไม่มีแบบฝึกเชิงปฏิบัติ" }
  - { framework: csta-k12-cs-2026, indicators: ["S1-AIN-HR-10"], coverage: partial, note: "สอนผลกระทบต่อสิ่งแวดล้อมจากการฝึกและการใช้ AI ในระดับหลักการ ตัวเลขเฉพาะยังต้องตรวจก่อนเผยแพร่ (p013) จึงเป็นบางส่วน" }
  - { framework: csta-k12-cs-2026, indicators: ["S2-AIN-HR-06"], coverage: partial, note: "สอนโครงสร้างนโยบายความโปร่งใส (ผู้ใช้รู้ เหตุผล อุทธรณ์) และเอกสารกำกับ model card datasheet (p015 p008) แต่ยังไม่ได้ร่างนโยบายจริงให้ผู้เรียนทำ" }
  - { framework: csta-k12-cs-2026, indicators: ["S1-AIN-PP-12"], coverage: partial, note: "สอนประเด็นที่ AI กระทบผู้ใช้ต่างกันตามภูมิหลัง (ผลการประเมินแยกกลุ่ม p009 p011) แต่ยังไม่ได้วิเคราะห์ประสบการณ์ผู้ใช้จริงหลายกลุ่ม" }
  - { framework: csta-k12-cs-2026, indicators: ["S1-AIN-PP-13"], coverage: partial, note: "สอนความยินยอมและการเก็บข้อมูลไปฝึกโดยไม่แจ้ง (p012) และหลักการที่เกี่ยวข้องกับลิขสิทธิ์ แต่ยังไม่ได้วิเคราะห์กรณีการฝึกโมเดลจริง" }
  - { framework: csta-k12-cs-2026, indicators: ["S1-AIN-PP-14"], coverage: partial, note: "สอนว่าประเด็นจริยธรรม AI เปลี่ยนไปตามเวลาและกรอบกฎหมายต่างกันตามประเทศ (EU AI Act แบบภาพรวม) โดยต้องตรวจสถานะปัจจุบันก่อนเผยแพร่" }
  - { framework: csta-k12-cs-2026, indicators: ["S2-AIN-PP-10"], coverage: partial, note: "สอนความหลากหลายของกรอบกำกับ AI (แบ่งตามความเสี่ยง) แต่การอภิปรายเชิงนโยบายเปรียบเทียบประเทศเป็นกิจกรรมกลุ่มที่แอปไม่ได้จัด" }
  - { framework: csta-k12-cs-2026, indicators: ["S2-AIN-DS-04"], coverage: partial, note: "สอนเอกสารกำกับชุดข้อมูลและสายส่งข้อมูลที่ตรวจสอบได้ (datasheet บันทึกเวอร์ชัน) แต่ยังไม่มีแบบฝึกสร้าง metadata ของระบบจริง" }
  - { framework: csta-k12-cs-2026, indicators: ["HS-SOC-HU-44"], coverage: partial, note: "สอนการถกเถียงว่า AI กับปัญญามนุษย์ต่างกันอย่างไร และคำถามความรับผิดชอบทางจริยธรรม (p019) แต่เป็นการสรุปแนวคิดมากกว่าการอภิปรายเป็นกลุ่ม" }
  - { framework: csta-k12-cs-2026, indicators: ["MS-SOC-ET-40"], coverage: partial, note: "สอนการเลือกว่าเมื่อใดควรและไม่ควรใช้ AI โดยพิจารณาข้อจำกัดและผลกระทบ (บทเรียนส่วนสุดท้ายและ p014) แต่ยังไม่ได้วิเคราะห์โจทย์ของผู้เรียนเองจริง" }
  - { framework: csta-k12-cs-2026, indicators: ["S2-CYB-PP-10"], coverage: partial, note: "สอนประโยชน์และความเสี่ยงของ AI ทั้งฝั่งป้องกันและฝั่งที่ถูกใช้หลอกลวง (ระดับแนวคิด) และการประเมินความเสี่ยงก่อนเผยแพร่เครื่องมือ (p018) โดยไม่มีรายละเอียดเทคนิคการโจมตี" }
