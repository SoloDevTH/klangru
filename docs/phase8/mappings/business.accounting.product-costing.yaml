topic: business.accounting.product-costing
rows:
  - { framework: th-tqf-accounting, indicators: ["8.1.2"], coverage: partial, note: "ส่วนต้นทุนผลิตภัณฑ์: ส่วนประกอบของต้นทุน ต้นทุนเบื้องต้นและแปรสภาพ ต้นทุนการผลิต อัตราค่าใช้จ่ายการผลิตกำหนดล่วงหน้า ปันส่วนเกินขาด ต้นทุนงานสั่งทำ ต้นทุนช่วงแบบถัวเฉลี่ยถ่วงน้ำหนัก การเลือกฐานปันส่วน และการตั้งราคาแบบต้นทุนบวกส่วนเพิ่ม ยังไม่มีงบประมาณ การพยากรณ์เชิงบัญชี การวิเคราะห์ผลต่าง การวัดผลส่วนงาน และต้นทุนฐานกิจกรรม (อยู่ใน business.accounting.budgeting-variance ตามแผน)" }
