problems:
- id: business.international.global-business.p001
  topics:
  - business.international.global-business
  difficulty: 1
  type: match
  stem: จับคู่เหตุการณ์ (สมมติ) กับปัจจัยในสภาพแวดล้อมทางธุรกิจแบบ PESTEL
  pairs:
  - left: ประเทศคู่ค้าขึ้นภาษีนำเข้าสินค้าเกษตรจากไทย
    right: การเมืองและนโยบายการค้า
  - left: ค่าเงินบาทแข็งค่าขึ้นมากในครึ่งปี
    right: เศรษฐกิจ
  - left: ผู้บริโภคในตลาดใหม่นิยมอาหารฮาลาลและอ่านฉลากภาษาท้องถิ่น
    right: สังคมและวัฒนธรรม
  - left: กฎหมายคุ้มครองข้อมูลส่วนบุคคลกำหนดวิธีเก็บข้อมูลลูกค้าออนไลน์
    right: กฎหมาย
  hints:
  - P การเมือง E เศรษฐกิจ S สังคม T เทคโนโลยี E สิ่งแวดล้อม L กฎหมาย
  - ค่าเงินเป็นตัวแปรทางเศรษฐกิจ ส่วนภาษีนำเข้าเป็นการตัดสินใจเชิงนโยบาย
  solution: ภาษีนำเข้าของคู่ค้า = การเมือง/นโยบายการค้า ค่าเงิน = เศรษฐกิจ ความนิยมและภาษาท้องถิ่น = สังคมและวัฒนธรรม การคุ้มครองข้อมูลส่วนบุคคล = กฎหมาย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.international.global-business.p002
  topics:
  - business.international.global-business
  difficulty: 1
  type: mcq
  stem: อัตราแลกเปลี่ยนเปลี่ยนจาก $33$ เป็น $35$ บาทต่อ 1 ดอลลาร์สหรัฐ หมายความว่าอย่างไร
  choices:
  - id: a
    text: เงินบาทอ่อนค่าลง ต้องใช้เงินบาทมากขึ้นเพื่อแลก 1 ดอลลาร์
    correct: true
  - id: b
    text: เงินบาทแข็งค่าขึ้น เพราะตัวเลขเพิ่มขึ้น
    feedback: ตัวเลขนี้คือราคาของ 1 ดอลลาร์ในหน่วยบาท ดอลลาร์แพงขึ้นแปลว่าบาทอ่อนลง
  - id: c
    text: ดอลลาร์อ่อนค่าลง
    feedback: 1 ดอลลาร์แลกบาทได้มากขึ้น ดอลลาร์จึงแข็งค่าขึ้นเมื่อเทียบกับบาท
  - id: d
    text: ไม่มีผลต่อผู้ส่งออก
    feedback: ผู้ส่งออกที่ขายเป็นดอลลาร์ได้เงินบาทมากขึ้น
  hints:
  - ตัวเลขบอกว่า 1 ดอลลาร์ราคากี่บาท
  - ดอลลาร์แพงขึ้น แปลว่าบาทเป็นอย่างไร
  solution: อัตราแบบบาทต่อดอลลาร์คือราคาของดอลลาร์ เมื่อเพิ่มจาก 33 เป็น 35 บาท ดอลลาร์แพงขึ้น บาทจึงอ่อนค่าลง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.international.global-business.p003
  topics:
  - business.international.global-business
  difficulty: 2
  type: numeric
  stem: ผู้ส่งออกทุเรียนแช่แข็ง (สมมติ) ได้รับเงิน $2{,}000$ ดอลลาร์สหรัฐ อัตราแลกเปลี่ยน $33.50$ บาทต่อดอลลาร์ (ไม่คิดส่วนต่างของธนาคาร) ได้เงินกี่บาท
  answer:
    value: 67000.0
    unit: บาท
  misconceptions:
  - match: 59.701493
    feedback: หารแทนคูณ ได้หน่วยที่ไม่ใช่บาท
  hints:
  - บาท $=$ ดอลลาร์ $\times$ บาทต่อดอลลาร์
  - $2{,}000 \times 33.50$
  solution: $2{,}000 \times 33.50 = 67{,}000$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.international.global-business.p004
  topics:
  - business.international.global-business
  difficulty: 2
  type: numeric
  stem: ร้านค้าออนไลน์ไทยต้องจ่ายค่าเครื่องจักร $50{,}000$ บาท ให้ผู้ขายต่างประเทศที่รับเป็นดอลลาร์ อัตรา $34.00$ บาทต่อดอลลาร์ ต้องจ่ายกี่ดอลลาร์ (ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 1470.588235
    tolerance: 0.5
    unit: USD
  misconceptions:
  - match: 1700000
    feedback: คูณแทนหาร
  hints:
  - ดอลลาร์ $=$ บาท $\div$ บาทต่อดอลลาร์
  - $50{,}000 \div 34$
  solution: $50{,}000 \div 34 \approx 1{,}470.59$ ดอลลาร์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.international.global-business.p005
  topics:
  - business.international.global-business
  difficulty: 2
  type: mcq
  stem: ถ้าเงินบาทอ่อนค่าลงมาก ใครได้ประโยชน์โดยตรงมากที่สุด (สมมติว่าปัจจัยอื่นคงที่)
  choices:
  - id: a
    text: ผู้ส่งออกไทยที่ขายสินค้าเป็นเงินดอลลาร์และใช้วัตถุดิบในประเทศ
    correct: true
  - id: b
    text: ผู้นำเข้าน้ำมันที่จ่ายเป็นดอลลาร์
    feedback: ต้องใช้บาทมากขึ้นซื้อดอลลาร์ ต้นทุนจึงสูงขึ้น
  - id: c
    text: นักเรียนไทยที่จะไปเรียนต่างประเทศ
    feedback: ค่าเล่าเรียนและค่าครองชีพในต่างประเทศคิดเป็นบาทแพงขึ้น
  - id: d
    text: บริษัทไทยที่มีหนี้เงินกู้เป็นดอลลาร์
    feedback: ภาระหนี้คิดเป็นบาทสูงขึ้น
  hints:
  - บาทอ่อน = ดอลลาร์แลกบาทได้มากขึ้น
  - ใครได้รับดอลลาร์ และใครต้องจ่ายดอลลาร์
  solution: ผู้ส่งออกที่ได้รับดอลลาร์แลกได้บาทมากขึ้น ขณะที่ต้นทุนเป็นบาท จึงได้ประโยชน์ ส่วนผู้นำเข้า ผู้ที่ต้องใช้เงินต่างประเทศ และผู้มีหนี้สกุลต่างประเทศเสียประโยชน์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.international.global-business.p006
  topics:
  - business.international.global-business
  difficulty: 3
  type: numeric
  stem: จากกระดานของธนาคาร ผู้ส่งออกนำเงิน $10{,}000$ ดอลลาร์สหรัฐมาขายให้ธนาคาร จะได้เงินกี่บาท
  answer:
    value: 332000.0
    unit: บาท
  misconceptions:
  - match: 336000.0
    feedback: ใช้อัตราธนาคารขาย แต่ลูกค้ากำลังขายดอลลาร์ให้ธนาคาร
  - match: 334000.0
    feedback: ใช้ค่ากลาง ธนาคารซื้อขายที่อัตราของตัวเอง
  figure: &id001
    src: p-board.svg
    alt: กระดานอัตราแลกเปลี่ยนของธนาคาร (สมมติ) หน่วยบาทต่อ 1 หน่วยเงินตรา USD ธนาคารรับซื้อ 33.20 ธนาคารขาย 33.60 EUR รับซื้อ 36.10 ขาย 36.70 JPY ต่อ 100 เยน รับซื้อ 21.90 ขาย 22.40
  hints:
  - ผู้ส่งออก **ขาย** ดอลลาร์ ธนาคาร **รับซื้อ**
  - ใช้อัตราธนาคารรับซื้อ ซึ่งต่ำกว่าอัตราขาย
  solution: 'ใช้อัตรารับซื้อ $33.20$: $10{,}000 \times 33.20 = 332{,}000$ บาท'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.international.global-business.p007
  topics:
  - business.international.global-business
  difficulty: 3
  type: numeric
  stem: จากกระดานเดียวกัน ผู้นำเข้าต้องซื้อดอลลาร์ $10{,}000$ ดอลลาร์ไปจ่ายค่าสินค้า ต้องใช้เงินกี่บาท
  answer:
    value: 336000.0
    unit: บาท
  misconceptions:
  - match: 332000.0
    feedback: ใช้อัตรารับซื้อ แต่ลูกค้ากำลังซื้อดอลลาร์จากธนาคาร
  figure: *id001
  hints:
  - ผู้นำเข้า **ซื้อ** ดอลลาร์จากธนาคาร
  - ใช้อัตราธนาคารขาย
  solution: $10{,}000 \times 33.60 = 336{,}000$ บาท ส่วนต่าง $4{,}000$ บาทจากข้อที่แล้วคือรายได้ของธนาคารจากการซื้อขายเงินตรา
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.international.global-business.p008
  topics:
  - business.international.global-business
  difficulty: 3
  type: numeric
  stem: อัตราตลาด (สมมติ) 1 ดอลลาร์ $= 33.00$ บาท และ 1 ดอลลาร์ $= 150$ เยน อัตราไขว้ 100 เยนเท่ากับกี่บาท
  answer:
    value: 22.0
    tolerance: 0.01
    unit: บาท
  misconceptions:
  - match: 454.545455
    feedback: กลับเศษส่วน
  - match: 0.22
    feedback: ลืมคูณ 100
  hints:
  - 1 เยน $= \dfrac{33}{150}$ บาท
  - คูณ 100 เพื่อได้ราคาต่อ 100 เยน
  solution: 1 เยน $= 33 / 150 = 0.22$ บาท 100 เยน $= 22$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.international.global-business.p009
  topics:
  - business.international.global-business
  difficulty: 3
  type: numeric
  stem: อัตราแลกเปลี่ยนเปลี่ยนจาก $36.00$ เป็น $33.00$ บาทต่อดอลลาร์ ค่าเงินบาทเทียบกับดอลลาร์เปลี่ยนไปกี่เปอร์เซ็นต์ (ตอบเป็นค่าบวกถ้าแข็งค่า ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 9.090909
    tolerance: 0.02
    unit: '%'
  misconceptions:
  - match: -8.33
    feedback: คำนวณการเปลี่ยนแปลงของราคาดอลลาร์ ไม่ใช่ค่าของบาท
  - match: 8.33
    feedback: ใช้ $(36 - 33)/36$ ซึ่งเป็นการเปลี่ยนของดอลลาร์
  hints:
  - ค่าของ 1 บาทเป็นดอลลาร์ $= 1/36$ และ $1/33$
  - ร้อยละที่เปลี่ยน $= \dfrac{1/33 - 1/36}{1/36} \times 100 = \dfrac{36}{33} - 1$
  solution: $\dfrac{36}{33} - 1 \approx 9.09\%$ บาทแข็งค่าขึ้น $9.09\%$ (ส่วนดอลลาร์อ่อนค่าลง $1 - 33/36 \approx 8.33\%$)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.international.global-business.p010
  topics:
  - business.international.global-business
  difficulty: 3
  type: order
  stem: เรียงรูปแบบการเข้าสู่ตลาดต่างประเทศจาก **เงินลงทุนและการควบคุมน้อยที่สุด** ไป **มากที่สุด**
  items:
  - ส่งออกผ่านตัวแทน
  - ให้สิทธิใช้ตราสินค้า (licensing)
  - แฟรนไชส์
  - กิจการร่วมค้ากับบริษัทท้องถิ่น
  - ตั้งบริษัทลูกที่ถือหุ้นทั้งหมด
  hints:
  - ส่งออกแทบไม่ต้องลงทุนในต่างประเทศ
  - บริษัทลูกที่ถือหุ้นทั้งหมดลงทุนเองและควบคุมทุกอย่าง
  solution: ส่งออก → licensing → แฟรนไชส์ → กิจการร่วมค้า → บริษัทลูก 100% ยิ่งไปทางขวา บริษัทควบคุมการดำเนินงานได้มาก ได้ส่วนแบ่งกำไรมาก แต่ใช้เงินลงทุนและรับความเสี่ยงสูงขึ้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.international.global-business.p011
  topics:
  - business.international.global-business
  difficulty: 4
  type: numeric
  stem: ผู้ส่งออกข้าวหอมมะลิ (สมมติ) ทำสัญญาขาย $50{,}000$ ดอลลาร์ รับเงินอีก 90 วัน วันทำสัญญาอัตรา $34.00$ บาท แต่วันรับเงินอัตรา $32.50$ บาท ถ้าไม่ป้องกันความเสี่ยง ได้เงิน **น้อยกว่า** ที่คาดไว้วันทำสัญญากี่บาท
  answer:
    value: 75000.0
    unit: บาท
  misconceptions:
  - match: 1.5
    feedback: นั่นคือส่วนต่างต่อดอลลาร์ ต้องคูณจำนวนดอลลาร์
  - match: 1625000
    feedback: นั่นคือเงินที่ได้จริง ไม่ใช่ส่วนที่ขาด
  hints:
  - คาดว่าจะได้ $50{,}000 \times 34.00$
  - ได้จริง $50{,}000 \times 32.50$
  solution: คาด $1{,}700{,}000$ บาท ได้จริง $1{,}625{,}000$ บาท น้อยกว่า $75{,}000$ บาท นี่คือความเสี่ยงจากธุรกรรม (transaction risk)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.international.global-business.p012
  topics:
  - business.international.global-business
  difficulty: 4
  type: numeric
  stem: ต่อจากข้อที่แล้ว ถ้าวันทำสัญญาผู้ส่งออกทำสัญญาซื้อขายเงินตราล่วงหน้ากับธนาคารที่ $33.80$ บาทต่อดอลลาร์ เมื่อเทียบกับไม่ป้องกันความเสี่ยง (ได้ $32.50$) ได้เงินมากกว่ากี่บาท
  answer:
    value: 65000.0
    unit: บาท
  misconceptions:
  - match: 10000.0
    feedback: เทียบกับอัตราวันทำสัญญา โจทย์ให้เทียบกับกรณีไม่ป้องกัน
  - match: 75000
    feedback: นั่นคือส่วนที่ขาดถ้าไม่ป้องกัน เทียบกับ 34.00
  hints:
  - สัญญาล่วงหน้าล็อกอัตรา $33.80$ ไม่ว่าวันรับเงินอัตราตลาดเป็นเท่าใด
  - เทียบ $50{,}000 \times 33.80$ กับ $50{,}000 \times 32.50$
  solution: ป้องกันความเสี่ยงได้ $1{,}690{,}000$ บาท ไม่ป้องกันได้ $1{,}625{,}000$ บาท มากกว่า $65{,}000$ บาท แต่ถ้าบาทอ่อนค่าแทน สัญญาล่วงหน้าจะทำให้พลาดกำไร จุดประสงค์คือความแน่นอน ไม่ใช่การเก็งกำไร
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.international.global-business.p013
  topics:
  - business.international.global-business
  difficulty: 4
  type: mcq
  stem: ข้อใดเป็นลักษณะหรือบทบาทของ **บริษัทข้ามชาติ** และ **โลกาภิวัตน์** เลือกทุกข้อที่ถูก
  multiple: true
  choices:
  - id: a
    text: ห่วงโซ่การผลิตกระจายหลายประเทศ เช่น ออกแบบที่หนึ่ง ประกอบอีกที่หนึ่ง
    correct: true
  - id: b
    text: บริษัทข้ามชาตินำเงินทุน เทคโนโลยี และการจ้างงานไปยังประเทศที่ตั้งฐานผลิต
    correct: true
  - id: c
    text: เหตุการณ์ในประเทศหนึ่ง เช่น ค่าเงินหรือภัยพิบัติ กระทบธุรกิจในประเทศอื่นได้เร็ว
    correct: true
  - id: d
    text: โลกาภิวัตน์ทำให้ทุกประเทศได้ประโยชน์เท่ากันและไม่มีผู้เสียประโยชน์
    feedback: ผลกระทบไม่เท่ากัน บางอุตสาหกรรมหรือแรงงานบางกลุ่มอาจเสียประโยชน์ จึงต้องมีนโยบายรองรับ
  - id: e
    text: บริษัทข้ามชาติไม่ต้องปฏิบัติตามกฎหมายของประเทศที่ไปลงทุน
    feedback: ต้องปฏิบัติตามกฎหมายของทุกประเทศที่ดำเนินงาน
  hints:
  - โลกาภิวัตน์คือการเชื่อมโยงด้านการค้า การลงทุน เทคโนโลยี และข้อมูลข้ามประเทศ
  - คิดทั้งผลดีและผลเสีย
