    ai_assisted: true

  - id: physics.electricity.electronics-intro.p014
    topics: [physics.electricity.electronics-intro]
    difficulty: 4
    type: mcq
    stem: "ในวงจรไฟกลางคืนอัตโนมัติ ตัวต้านทาน $R_1$ ต่อจากขั้วบวกมาที่จุดกลาง และ LDR ต่อจากจุดกลางลงไปขั้วลบ จุดกลางต่อไปที่ขาเบสของทรานซิสเตอร์ ถ้าสลับตำแหน่ง $R_1$ กับ LDR วงจรจะทำงานอย่างไร"
    choices:
      - { id: a, text: "แอลอีดีสว่างตอนกลางวันและดับตอนกลางคืน", correct: true }
      - { id: b, text: "ทำงานเหมือนเดิม เพราะชิ้นส่วนยังครบ", feedback: "ตำแหน่งมีผล ความต่างศักย์ที่จุดกลางขึ้นกับว่าตัวไหนอยู่ด้านล่าง (ทางขั้วลบ)" }
      - { id: c, text: "แอลอีดีสว่างตลอดเวลา", feedback: "แสงยังเปลี่ยนความต้านทานของ LDR ได้ จุดกลางจึงยังเปลี่ยนตามแสง เพียงแต่กลับทิศ" }
    hints:
      - "ความต่างศักย์ที่จุดกลางเท่ากับความต่างศักย์คร่อมตัวที่อยู่ด้านล่าง"
      - "ถ้า LDR อยู่ด้านบน ตอนสว่างความต้านทานของ LDR ต่ำ ความต่างศักย์คร่อมตัวด้านล่างเป็นอย่างไร"
    solution: "เมื่อ LDR อยู่ด้านบน ตอนกลางวัน LDR ความต้านทานต่ำ ความต่างศักย์ตกคร่อม $R_1$ ด้านล่างมาก ขาเบสได้แรงดันสูง ทรานซิสเตอร์นำกระแส แอลอีดีสว่าง ตอนกลางคืนกลับกัน แอลอีดีดับ วงจรกลายเป็นตัวตรวจแสงสว่างแทน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.electronics-intro.p015
    topics: [physics.electricity.electronics-intro]
    difficulty: 5
    type: numeric
    stem: "ต่อแอลอีดี (กินความต่างศักย์ $2.0\\ \\mathrm{V}$) อนุกรมกับตัวต้านทาน $150\\ \\Omega$ และแหล่งจ่าย $5.0\\ \\mathrm{V}$ กระแสในวงจรเป็นกี่มิลลิแอมแปร์ (ตอบในหน่วย mA)"
    answer: { value: 20, tolerance: 0.2, unit: mA }
    misconceptions:
      - { match: 33.3, feedback: "ใช้ความต่างศักย์ทั้งหมด $5.0\\ \\mathrm{V}$ คร่อมตัวต้านทาน ต้องหักส่วนที่แอลอีดีกินไปก่อน" }
      - { match: 13.3, feedback: "ใช้ความต่างศักย์ของแอลอีดีคร่อมตัวต้านทาน ตัวต้านทานรับส่วนที่เหลือ $5.0 - 2.0$" }
    hints:
      - "ความต่างศักย์คร่อมตัวต้านทาน = $5.0 - 2.0$"
      - "$I = V/R$ แล้วแปลงเป็นมิลลิแอมแปร์"
    solution: "$I = \\dfrac{5.0 - 2.0}{150} = 0.020\\ \\mathrm{A} = 20\\ \\mathrm{mA}$ ซึ่งพอดีกับกระแสที่แอลอีดีทั่วไปทนได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.electronics-intro.p016
    topics: [physics.electricity.electronics-intro]
    difficulty: 5
    type: numeric
    stem: "ป้ายไฟร้านค้าใช้แอลอีดีสองดวงต่ออนุกรมกัน แต่ละดวงกินความต่างศักย์ $2.0\\ \\mathrm{V}$ ใช้แหล่งจ่าย $9.0\\ \\mathrm{V}$ และต้องการกระแส $15\\ \\mathrm{mA}$ ต้องใช้ตัวต้านทานอนุกรมกี่โอห์ม (ตอบในหน่วย Ω)"
    answer: { value: 333, tolerance: 3.4, unit: Ω }
    misconceptions:
      - { match: 467, feedback: "หักความต่างศักย์ของแอลอีดีเพียงดวงเดียว แอลอีดีสองดวงอนุกรมกินรวม $4.0\\ \\mathrm{V}$" }
      - { match: 600, feedback: "ไม่ได้หักความต่างศักย์ของแอลอีดีเลย" }
    hints:
      - "แอลอีดีสองดวงอนุกรมกินความต่างศักย์รวมกัน"
      - "$R = \\dfrac{9.0 - 2(2.0)}{0.015}$"
    solution: "ความต่างศักย์คร่อมตัวต้านทาน $9.0 - 4.0 = 5.0\\ \\mathrm{V}$ ได้ $R = \\dfrac{5.0}{0.015} \\approx 333\\ \\Omega$ ในทางปฏิบัติเลือกค่ามาตรฐานที่สูงกว่าเล็กน้อย เช่น $330\\ \\Omega$ ที่ทำให้กระแสสูงขึ้นเพียงเล็กน้อย หรือ $390\\ \\Omega$ เพื่อความปลอดภัย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.electronics-intro.p017
    topics: [physics.electricity.electronics-intro]
    difficulty: 5
