problems:
  - id: biology.cells.enzymes.p001
    topics: [biology.cells.enzymes]
    difficulty: 1
    type: mcq
    stem: "เอนไซม์ส่วนใหญ่ในร่างกายเป็นสารชีวโมเลกุลประเภทใด"
    choices:
      - { id: a, text: "โปรตีน", correct: true }
      - { id: b, text: "คาร์โบไฮเดรต", feedback: "คาร์โบไฮเดรตเป็นแหล่งพลังงานและโครงสร้าง เอนไซม์ส่วนใหญ่เป็นโปรตีนที่พับเป็นรูปสามมิติ" }
      - { id: c, text: "ลิพิด", feedback: "ลิพิดเป็นแหล่งสะสมพลังงานและส่วนของเยื่อหุ้มเซลล์ ไม่ใช่เอนไซม์" }
      - { id: d, text: "แร่ธาตุ", feedback: "แร่ธาตุบางชนิดเป็นโคแฟกเตอร์ที่ช่วยเอนไซม์ แต่ตัวเอนไซม์ส่วนใหญ่เป็นโปรตีน" }
    hints:
      - "เอนไซม์เสียสภาพได้เมื่อโดนความร้อน เหมือนไข่ขาว"
      - "สารชีวโมเลกุลชนิดใดสร้างจากกรดอะมิโน"
    solution: "เอนไซม์ส่วนใหญ่เป็นโปรตีน รูปร่างสามมิติของโปรตีนทำให้เกิดบริเวณเร่งที่จำเพาะกับซับสเตรต และเสียสภาพได้เมื่อร้อนเกินไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.enzymes.p002
    topics: [biology.cells.enzymes]
    difficulty: 1
    type: match
    stem: "จับคู่คำกับความหมาย"
    pairs:
      - { left: "ซับสเตรต", right: "สารที่เอนไซม์จับและเปลี่ยนเป็นผลิตภัณฑ์" }
      - { left: "บริเวณเร่ง", right: "ร่องบนเอนไซม์ที่ซับสเตรตเข้าจับ" }
      - { left: "พลังงานก่อกัมมันต์", right: "พลังงานขั้นต่ำที่ต้องได้รับก่อนเกิดปฏิกิริยา" }
      - { left: "การเสียสภาพ", right: "รูปร่างของโปรตีนถูกทำลาย เช่น เพราะความร้อน" }
    hints:
      - "บริเวณเร่งเป็นส่วนหนึ่งของเอนไซม์"
      - "พลังงานก่อกัมมันต์คือความสูงของเนินในแผนภาพพลังงาน"
    solution: "ซับสเตรต → สารที่เอนไซม์จับ, บริเวณเร่ง → ร่องที่ซับสเตรตจับ, พลังงานก่อกัมมันต์ → พลังงานขั้นต่ำก่อนเกิดปฏิกิริยา, การเสียสภาพ → รูปร่างโปรตีนถูกทำลาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.enzymes.p003
    topics: [biology.cells.enzymes]
    difficulty: 2
    type: match
    stem: "จับคู่ปฏิกิริยาในสิ่งมีชีวิตกับประเภทตามพลังงาน"
    pairs:
      - { left: "การหายใจระดับเซลล์ สลายกลูโคสเป็นคาร์บอนไดออกไซด์และน้ำ", right: "คายพลังงาน" }
      - { left: "การสังเคราะห์ด้วยแสง สร้างกลูโคสจากคาร์บอนไดออกไซด์และน้ำ", right: "ดูดพลังงาน" }
    hints:
      - "สารโมเลกุลใหญ่ที่มีพลังงานสะสมมาก ถูกสลายเป็นสารเล็ก จะได้พลังงานออกมาหรือต้องใช้พลังงาน"
      - "การสังเคราะห์ด้วยแสงต้องใช้แสงเป็นแหล่งพลังงาน"
    solution: "การหายใจระดับเซลล์สลายกลูโคสที่มีพลังงานสูงเป็นสารพลังงานต่ำ จึงคายพลังงาน (เซลล์นำไปสร้าง ATP) ส่วนการสังเคราะห์ด้วยแสงสร้างกลูโคสโดยใช้พลังงานแสง จึงดูดพลังงาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.enzymes.p004
    topics: [biology.cells.enzymes]
    difficulty: 2
    type: text
    stem: "พลังงานขั้นต่ำที่สารตั้งต้นต้องได้รับก่อนที่ปฏิกิริยาจะเกิดขึ้นได้ เรียกว่าอะไร"
    accepted: ["พลังงานก่อกัมมันต์", "activation energy", "Ea"]
    hints:
      - "เอนไซม์ทำให้พลังงานนี้ลดลง"
      - "ในแผนภาพพลังงาน คือความสูงจากสารตั้งต้นถึงยอดเนิน"
    misconceptions:
      - { match: "พลังงานที่ปล่อยออก", feedback: "พลังงานที่ปล่อยออกคือผลต่างระหว่างสารตั้งต้นกับผลิตภัณฑ์ ส่วนพลังงานขั้นต่ำก่อนเกิดปฏิกิริยามีชื่อเฉพาะ" }
      - { match: "ATP", feedback: "ATP เป็นสารที่เซลล์ใช้เก็บและส่งต่อพลังงาน ไม่ใช่ชื่อของพลังงานขั้นต่ำก่อนเกิดปฏิกิริยา" }
    solution: "พลังงานก่อกัมมันต์ ($E_a$) คือพลังงานขั้นต่ำที่ต้องได้รับก่อนเกิดปฏิกิริยา เอนไซม์ทำให้ค่านี้ลดลง ปฏิกิริยาจึงเกิดได้เร็วที่อุณหภูมิร่างกาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.enzymes.p005
    topics: [biology.cells.enzymes]
    difficulty: 2
    type: mcq
    stem: "ข้อใดอธิบายผลของเอนไซม์ต่อปฏิกิริยาได้ถูกต้อง"
    choices:
      - { id: a, text: "ลดพลังงานก่อกัมมันต์ โดยพลังงานของสารตั้งต้นและผลิตภัณฑ์ไม่เปลี่ยน", correct: true }
      - { id: b, text: "เพิ่มพลังงานให้สารตั้งต้นจนเกิดปฏิกิริยา", feedback: "เอนไซม์ไม่ได้ให้พลังงาน เอนไซม์ทำให้เส้นทางของปฏิกิริยาต้องการพลังงานน้อยลง" }
      - { id: c, text: "ทำให้ปฏิกิริยาคายพลังงานออกมามากขึ้น", feedback: "ผลต่างพลังงานระหว่างสารตั้งต้นกับผลิตภัณฑ์เท่าเดิม เอนไซม์เปลี่ยนแค่ความสูงของเนิน" }
      - { id: d, text: "ถูกใช้หมดไปเมื่อปฏิกิริยาเสร็จ", feedback: "เอนไซม์กลับเป็นรูปเดิมหลังปล่อยผลิตภัณฑ์ และใช้ซ้ำได้หลายครั้ง" }
    hints:
      - "ในแผนภาพพลังงาน เส้นที่มีเอนไซม์ต่างจากเส้นที่ไม่มีเอนไซม์ตรงไหน"
      - "ระดับของสารตั้งต้นและผลิตภัณฑ์เปลี่ยนหรือไม่"
    solution: "เอนไซม์ลดความสูงของเนิน (พลังงานก่อกัมมันต์) แต่ไม่เปลี่ยนระดับพลังงานของสารตั้งต้นและผลิตภัณฑ์ และไม่ถูกใช้หมดไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.enzymes.p006
    topics: [biology.cells.enzymes]
    difficulty: 3
    type: numeric
    stem: "จากแผนภาพพลังงาน พลังงานก่อกัมมันต์ของปฏิกิริยาเมื่อไม่มีเอนไซม์มีค่ากี่กิโลจูล"
    figure: { src: energy-data.svg, alt: "แผนภาพพลังงาน แกนตั้งเป็นกิโลจูล 0 ถึง 180 สารตั้งต้นอยู่ที่ 40 ผลิตภัณฑ์อยู่ที่ 100 เส้นสีแดงไม่มีเอนไซม์มียอดที่ 160 เส้นสีน้ำเงินมีเอนไซม์มียอดที่ 110" }
    answer: { value: 120, unit: kJ }
    hints:
      - "พลังงานก่อกัมมันต์วัดจากระดับใดถึงระดับใด"
      - "นำค่าที่ยอดเนินของเส้นสีแดงลบด้วยระดับสารตั้งต้น"
    misconceptions:
      - { match: 160, feedback: "160 คือระดับยอดเนินซึ่งวัดจากศูนย์ ต้องวัดจากระดับสารตั้งต้นที่ 40" }
      - { match: 60, feedback: "60 คือระยะจากผลิตภัณฑ์ถึงยอดเนิน หรือผลต่างของผลิตภัณฑ์กับสารตั้งต้น พลังงานก่อกัมมันต์ต้องวัดจากสารตั้งต้นถึงยอดเนิน" }
      - { match: 70, feedback: "70 คือพลังงานก่อกัมมันต์ของเส้นสีน้ำเงินที่มีเอนไซม์ โจทย์ถามเมื่อไม่มีเอนไซม์" }
    solution: "$E_a = 160 - 40 = 120\\ \\mathrm{kJ}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.enzymes.p007
    topics: [biology.cells.enzymes]
    difficulty: 3
    type: numeric
    stem: "จากแผนภาพพลังงานเดียวกัน เอนไซม์ลดพลังงานก่อกัมมันต์ลงกี่กิโลจูล"
    figure: { src: energy-data.svg, alt: "แผนภาพพลังงาน แกนตั้งเป็นกิโลจูล 0 ถึง 180 สารตั้งต้นอยู่ที่ 40 ผลิตภัณฑ์อยู่ที่ 100 เส้นสีแดงไม่มีเอนไซม์มียอดที่ 160 เส้นสีน้ำเงินมีเอนไซม์มียอดที่ 110" }
    answer: { value: 50, unit: kJ }
    hints:
      - "หาพลังงานก่อกัมมันต์ทั้งสองกรณีก่อน หรือเทียบความสูงของยอดเนินทั้งสอง"
      - "ระดับสารตั้งต้นเท่ากันทั้งสองเส้น จึงเทียบยอดเนินได้เลย"
    misconceptions:
      - { match: 70, feedback: "70 คือพลังงานก่อกัมมันต์เมื่อมีเอนไซม์ โจทย์ถามว่าลดลงเท่าไร" }
      - { match: 110, feedback: "110 คือระดับยอดเนินเมื่อมีเอนไซม์ ต้องหาผลต่างกับยอดเนินเมื่อไม่มีเอนไซม์" }
    solution: "ไม่มีเอนไซม์ $E_a = 160 - 40 = 120$ kJ มีเอนไซม์ $E_a = 110 - 40 = 70$ kJ ลดลง $120 - 70 = 50$ kJ (เท่ากับ $160 - 110$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.enzymes.p008
    topics: [biology.cells.enzymes]
    difficulty: 3
    type: mcq
    stem: "จากแผนภาพพลังงานเดียวกัน (สารตั้งต้น 40 kJ ผลิตภัณฑ์ 100 kJ) ข้อใดถูกต้อง"
    figure: { src: energy-data.svg, alt: "แผนภาพพลังงาน แกนตั้งเป็นกิโลจูล 0 ถึง 180 สารตั้งต้นอยู่ที่ 40 ผลิตภัณฑ์อยู่ที่ 100 เส้นสีแดงไม่มีเอนไซม์มียอดที่ 160 เส้นสีน้ำเงินมีเอนไซม์มียอดที่ 110" }
    choices:
      - { id: a, text: "เป็นปฏิกิริยาดูดพลังงาน 60 kJ ทั้งเมื่อมีและไม่มีเอนไซม์", correct: true }
      - { id: b, text: "เป็นปฏิกิริยาคายพลังงาน 60 kJ", feedback: "ผลิตภัณฑ์มีพลังงานสูงกว่าสารตั้งต้น ปฏิกิริยาจึงต้องดูดพลังงานเข้าไป" }
      - { id: c, text: "เมื่อมีเอนไซม์ ปฏิกิริยาดูดพลังงานน้อยลงเหลือ 10 kJ", feedback: "เอนไซม์ไม่เปลี่ยนระดับพลังงานของผลิตภัณฑ์ ผลต่าง 60 kJ จึงเท่าเดิม" }
      - { id: d, text: "ปฏิกิริยาดูดพลังงาน 120 kJ", feedback: "120 kJ คือพลังงานก่อกัมมันต์เมื่อไม่มีเอนไซม์ ไม่ใช่พลังงานที่ดูดสุทธิ" }
    hints:
      - "เทียบระดับของผลิตภัณฑ์กับสารตั้งต้น"
      - "เอนไซม์เปลี่ยนเฉพาะความสูงของเนิน"
    solution: "ผลิตภัณฑ์ (100 kJ) สูงกว่าสารตั้งต้น (40 kJ) อยู่ 60 kJ จึงเป็นปฏิกิริยาดูดพลังงาน 60 kJ และค่านี้ไม่เปลี่ยนเมื่อมีเอนไซม์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.enzymes.p009
    topics: [biology.cells.enzymes]
    difficulty: 3
    type: mcq
    stem: "แม่ทำวุ้นเจลาตินใส่สับปะรด ถ้าใช้สับปะรดสด วุ้นไม่แข็งตัว แต่ถ้าใช้สับปะรดกระป๋อง วุ้นแข็งตัวได้ เพราะเหตุใด"
    choices:
      - { id: a, text: "สับปะรดสดมีเอนไซม์โบรมีเลนที่ย่อยโปรตีนเจลาติน ส่วนสับปะรดกระป๋องผ่านความร้อนจนเอนไซม์เสียสภาพแล้ว", correct: true }
      - { id: b, text: "สับปะรดกระป๋องมีน้ำตาลมากกว่าจึงทำให้วุ้นแข็ง", feedback: "น้ำตาลไม่ได้ทำให้เจลาตินแข็งตัว ความต่างอยู่ที่เอนไซม์ในสับปะรดสดซึ่งถูกทำลายด้วยความร้อนในสับปะรดกระป๋อง" }
      - { id: c, text: "สับปะรดสดเย็นกว่า จึงทำให้วุ้นละลาย", feedback: "ความเย็นช่วยให้เจลาตินแข็งตัว ไม่ได้ทำให้ละลาย" }
      - { id: d, text: "เจลาตินเป็นคาร์โบไฮเดรตที่ถูกย่อยด้วยอะไมเลส", feedback: "เจลาตินเป็นโปรตีน และเอนไซม์ในสับปะรดคือโบรมีเลนซึ่งย่อยโปรตีน" }
    hints:
      - "เจลาตินเป็นสารชีวโมเลกุลประเภทใด"
      - "การบรรจุกระป๋องต้องผ่านความร้อนสูง เอนไซม์จะเป็นอย่างไร"
    solution: "เจลาตินเป็นโปรตีน สับปะรดสดมีโบรมีเลนที่ย่อยโปรตีน เจลาตินจึงถูกย่อยจนแข็งตัวไม่ได้ สับปะรดกระป๋องผ่านความร้อนสูง โบรมีเลนเสียสภาพ จึงไม่ย่อยเจลาติน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.enzymes.p010
    topics: [biology.cells.enzymes]
    difficulty: 3
    type: mcq
    stem: "เอนไซม์ในร่างกายคนมีอุณหภูมิที่เหมาะสมราว 37 องศาเซลเซียส ถ้าอุณหภูมิเพิ่มเป็น 60 องศาเซลเซียส อัตราการเกิดปฏิกิริยาจะเป็นอย่างไร"
    choices:
      - { id: a, text: "ลดลงมาก เพราะเอนไซม์เสียสภาพ บริเวณเร่งเสียรูปร่าง", correct: true }
      - { id: b, text: "เพิ่มขึ้นมาก เพราะโมเลกุลเคลื่อนที่เร็วขึ้น", feedback: "เกินอุณหภูมิที่เหมาะสม ผลของการเสียสภาพมีมากกว่าผลของการชนกันบ่อยขึ้น อัตราจึงลดลง" }
      - { id: c, text: "เท่าเดิม เพราะเอนไซม์ไม่ถูกใช้หมดไป", feedback: "เอนไซม์ไม่ถูกใช้หมดไปในปฏิกิริยา แต่ความร้อนทำลายรูปร่างของเอนไซม์ได้" }
