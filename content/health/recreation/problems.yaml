  - id: health.movement.recreation.p015
    topics: [health.movement.recreation]
    difficulty: 5
    type: mcq
    stem: "แผนจัดกิจกรรมของสภานักเรียนเขียนว่า \"พาน้อง ป.2 จำนวน 40 คนไปเล่นน้ำในคลองหลังวัดช่วงหน้าน้ำ ใช้รุ่นพี่ ม.2 ดูแล 4 คน ไม่ต้องเตรียมอุปกรณ์\" ข้อใดเป็นสิ่งที่ต้องแก้ไขเป็นอันดับแรก"
    choices:
      - { id: a, text: "ความปลอดภัย: เปลี่ยนเป็นกิจกรรมหรือสถานที่ที่ไม่เสี่ยงจมน้ำ หรือต้องมีผู้ใหญ่และเจ้าหน้าที่ช่วยชีวิต พร้อมอุปกรณ์ลอยน้ำ", correct: true }
      - { id: b, text: "เปลี่ยนสีเสื้อทีมให้สวยขึ้น", feedback: "การตกแต่งไม่สำคัญเท่าความเสี่ยงต่อชีวิตของเด็ก" }
      - { id: c, text: "เพิ่มเวลาเล่นน้ำให้นานขึ้น", feedback: "ยิ่งเพิ่มเวลา ยิ่งเพิ่มความเสี่ยง ถ้ายังไม่แก้เรื่องความปลอดภัย" }
      - { id: d, text: "ให้น้องจ่ายค่าเข้าร่วมคนละ 50 บาท", feedback: "งบประมาณเป็นเรื่องรอง สิ่งที่ต้องแก้ก่อนคือความปลอดภัย" }
    hints:
      - "คลองช่วงหน้าน้ำลึกและไหลแรง เด็กเล็กยังว่ายน้ำไม่แข็ง"
      - "หลักนันทนาการข้อใดถูกละเลย"
    solution: "แผนนี้ขัดกับหลักความปลอดภัยอย่างร้ายแรง เด็ก ป.2 จำนวนมากในคลองที่น้ำไหลแรง ผู้ดูแลเป็นเด็กเพียง 4 คน และไม่มีอุปกรณ์ ต้องเปลี่ยนกิจกรรมหรือสถานที่ หรือมีผู้ใหญ่ เจ้าหน้าที่ และอุปกรณ์ช่วยชีวิตก่อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.recreation.p016
    topics: [health.movement.recreation]
    difficulty: 5
    type: numeric
    stem: "ชมรมได้งบจัดกิจกรรมพับกระดาษให้น้อง 30 คน รวม 1,200 บาท ค่ากระดาษและอุปกรณ์ 450 บาท เงินที่เหลือทั้งหมดใช้ซื้อนมและขนมแบ่งให้น้องเท่า ๆ กัน น้องจะได้ค่านมและขนมคนละกี่บาท (ตอบเป็นตัวเลขในหน่วยบาท)"
    answer: { value: 25, unit: บาท }
    misconceptions:
      - { match: 40, feedback: "หารงบทั้งหมดด้วยจำนวนคน แต่ต้องหักค่าอุปกรณ์ 450 บาทออกก่อน" }
      - { match: 750, feedback: "750 คือเงินที่เหลือทั้งหมด ยังไม่ได้แบ่งให้ 30 คน" }
    hints:
      - "หาเงินที่เหลือหลังซื้ออุปกรณ์ก่อน"
      - "นำเงินที่เหลือหารด้วยจำนวนน้อง"
    solution: "เหลือ $1200 - 450 = 750$ บาท แบ่ง $750 \\div 30 = 25$ บาทต่อคน"
