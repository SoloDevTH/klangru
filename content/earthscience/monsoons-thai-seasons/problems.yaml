problems:
  - id: earthscience.atmosphere.monsoons-thai-seasons.p001
    topics: [earthscience.atmosphere.monsoons-thai-seasons]
    difficulty: 1
    type: mcq
    stem: "ตอนเที่ยงที่ชายหาด ได้รับแสงอาทิตย์เท่ากัน อะไรร้อนขึ้นเร็วกว่า"
    choices:
      - { id: a, text: "พื้นทรายบนฝั่ง", correct: true }
      - { id: b, text: "น้ำทะเล", feedback: "น้ำทะเลร้อนขึ้นช้ากว่า ลองนึกถึงทรายที่ร้อนจนเท้าแทบทนไม่ได้ขณะที่น้ำทะเลยังเย็น" }
      - { id: c, text: "ร้อนเท่ากัน", feedback: "แม้ได้แสงเท่ากัน แต่พื้นดินกับพื้นน้ำร้อนขึ้นไม่เท่ากัน" }
    hints:
      - "เดินเท้าเปล่าบนทรายตอนเที่ยงรู้สึกอย่างไร"
      - "ลงไปในน้ำทะเลตอนเที่ยงรู้สึกอย่างไร"
    solution: "พื้นดินและทรายร้อนขึ้นเร็วกว่าน้ำทะเล ความแตกต่างนี้ทำให้เกิดลมทะเลตอนกลางวัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.monsoons-thai-seasons.p002
    topics: [earthscience.atmosphere.monsoons-thai-seasons]
    difficulty: 1
    type: match
    stem: "จับคู่ฤดูของประเทศไทยกับช่วงเวลาตามกรมอุตุนิยมวิทยา"
    pairs:
      - { left: "ฤดูร้อน", right: "กลางเดือนกุมภาพันธ์ ถึงกลางเดือนพฤษภาคม" }
      - { left: "ฤดูฝน", right: "กลางเดือนพฤษภาคม ถึงกลางเดือนตุลาคม" }
      - { left: "ฤดูหนาว", right: "กลางเดือนตุลาคม ถึงกลางเดือนกุมภาพันธ์" }
    hints:
      - "ฤดูฝนตรงกับช่วงมรสุมตะวันตกเฉียงใต้"
      - "ฤดูหนาวตรงกับช่วงมรสุมตะวันออกเฉียงเหนือ"
    solution: "ฤดูร้อน กลาง ก.พ.–กลาง พ.ค. ฤดูฝน กลาง พ.ค.–กลาง ต.ค. ฤดูหนาว กลาง ต.ค.–กลาง ก.พ."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.monsoons-thai-seasons.p003
    topics: [earthscience.atmosphere.monsoons-thai-seasons]
    difficulty: 1
    type: mcq
    stem: "ลมทะเลพัดจากที่ใดไปที่ใด และเกิดเวลาใด"
    choices:
      - { id: a, text: "พัดจากทะเลเข้าหาฝั่ง ตอนกลางวัน", correct: true }
      - { id: b, text: "พัดจากฝั่งออกสู่ทะเล ตอนกลางวัน", feedback: "ลมที่พัดจากฝั่งออกทะเลคือลมบก และเกิดตอนกลางคืน" }
      - { id: c, text: "พัดจากทะเลเข้าหาฝั่ง ตอนกลางคืน", feedback: "กลางคืนพื้นดินเย็นกว่าทะเล ลมจึงพัดจากฝั่งออกทะเล" }
      - { id: d, text: "พัดจากฝั่งออกสู่ทะเล ตอนกลางคืน", feedback: "นี่คือลมบก ชื่อลมบอกว่าลมพัดมาจากไหน" }
    hints:
      - "ชื่อลมบอกที่ที่ลมพัดมา"
      - "ตอนไหนพื้นดินร้อนกว่าทะเล"
    solution: "ลมทะเลพัดมาจากทะเลเข้าหาฝั่ง เกิดตอนกลางวันเมื่อพื้นดินร้อนกว่าทะเล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.monsoons-thai-seasons.p004
    topics: [earthscience.atmosphere.monsoons-thai-seasons]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการเกิดลมทะเลตอนกลางวัน"
    items:
      - "แสงอาทิตย์ทำให้พื้นดินร้อนเร็วกว่าน้ำทะเล"
      - "อากาศเหนือพื้นดินร้อนขึ้นและลอยสูงขึ้น"
      - "อากาศเย็นเหนือทะเลเคลื่อนเข้าไปแทนที่"
      - "เรารู้สึกลมพัดจากทะเลเข้าหาฝั่ง"
    hints:
      - "ต้องมีที่ร้อนกับที่เย็นก่อน"
      - "อากาศร้อนลอยขึ้นก่อน อากาศเย็นจึงเคลื่อนเข้าแทนที่"
    solution: "พื้นดินร้อนเร็ว → อากาศเหนือดินร้อนลอยขึ้น → อากาศเย็นจากทะเลเข้าแทนที่ → เกิดลมทะเล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.monsoons-thai-seasons.p005
    topics: [earthscience.atmosphere.monsoons-thai-seasons]
    difficulty: 2
    type: mcq
    stem: "มรสุมตะวันตกเฉียงใต้ที่พัดมาจากมหาสมุทรอินเดีย ทำให้ประเทศไทยเป็นอย่างไร"
    choices:
      - { id: a, text: "มีเมฆมากและฝนตกชุก เป็นฤดูฝน", correct: true }
      - { id: b, text: "อากาศเย็นและแห้ง เป็นฤดูหนาว", feedback: "อากาศเย็นและแห้งมากับมรสุมตะวันออกเฉียงเหนือจากจีน" }
      - { id: c, text: "ร้อนอบอ้าว ไม่มีฝน", feedback: "ลมที่พัดผ่านมหาสมุทรมาไกลมีความชื้นมาก จึงนำฝนมา" }
      - { id: d, text: "ไม่มีผลต่ออากาศ", feedback: "มรสุมตะวันตกเฉียงใต้ทำให้ประเทศไทยเข้าสู่ฤดูฝน" }
    hints:
      - "ลมที่พัดผ่านมหาสมุทรได้ความชื้นมาก"
      - "มรสุมนี้พัดช่วงกลางเดือนพฤษภาคมถึงกลางเดือนตุลาคม"
    solution: "มรสุมตะวันตกเฉียงใต้นำอากาศชื้นจากมหาสมุทรอินเดีย ทำให้เมฆมากและฝนตกชุกทั่วประเทศ คือฤดูฝน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.monsoons-thai-seasons.p006
    topics: [earthscience.atmosphere.monsoons-thai-seasons]
    difficulty: 2
    type: text
    stem: "ลมที่พัดเปลี่ยนทิศตามฤดูกาล เพราะทวีปกับมหาสมุทรร้อนไม่เท่ากัน เรียกว่าลมอะไร"
    accepted: ["มรสุม", "ลมมรสุม", "monsoon"]
    misconceptions:
      - { match: "ลมทะเล", feedback: "ลมทะเลเปลี่ยนทิศระหว่างกลางวันกับกลางคืน ไม่ใช่ตามฤดู" }
      - { match: "พายุ", feedback: "พายุเป็นลมแรงที่เกิดเป็นครั้งคราว ไม่ได้พัดประจำฤดู" }
    hints:
      - "ประเทศไทยมีลมชนิดนี้สองชนิด คือ ตะวันตกเฉียงใต้กับตะวันออกเฉียงเหนือ"
      - "ขึ้นต้นด้วย มร"
    solution: "มรสุม คือลมประจำฤดูที่พัดเปลี่ยนทิศตามฤดูกาล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.monsoons-thai-seasons.p007
    topics: [earthscience.atmosphere.monsoons-thai-seasons]
    difficulty: 2
    type: mcq
    stem: "ชาวประมงพื้นบ้านที่ใช้เรือใบในสมัยก่อน ควรออกเรือไปทะเลเวลาใดจึงได้ลมช่วยพัดเรือออกไป"
    choices:
      - { id: a, text: "ช่วงกลางคืนถึงเช้ามืด ที่มีลมบก", correct: true }
      - { id: b, text: "ช่วงบ่าย ที่มีลมทะเล", feedback: "ลมทะเลพัดเข้าหาฝั่ง จึงช่วยพาเรือกลับฝั่ง ไม่ใช่พาออก" }
      - { id: c, text: "เวลาใดก็ได้ ลมไม่เปลี่ยนทิศ", feedback: "ลมใกล้ชายฝั่งเปลี่ยนทิศระหว่างกลางวันกับกลางคืน" }
      - { id: d, text: "ตอนเที่ยงวัน ที่มีลมบก", feedback: "ตอนเที่ยงพื้นดินร้อนกว่าทะเล ลมจึงพัดเข้าฝั่ง" }
    hints:
      - "เรือต้องการลมที่พัดจากฝั่งออกไปทะเล"
      - "ลมชนิดใดพัดจากฝั่งออกทะเล และเกิดตอนไหน"
    solution: "ลมบกพัดจากฝั่งออกสู่ทะเลตอนกลางคืนถึงเช้ามืด ชาวประมงจึงออกเรือช่วงนั้น และกลับฝั่งตอนบ่ายด้วยลมทะเล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.monsoons-thai-seasons.p008
    topics: [earthscience.atmosphere.monsoons-thai-seasons]
    difficulty: 3
    type: mcq
    stem: "กราฟแสดงปริมาณฝนรายเดือนของสถานี ก และสถานี ข สถานีใดน่าจะอยู่ภาคใต้ฝั่งตะวันออก และเพราะเหตุใด"
    figure: { src: p-rainfall.svg, alt: "กราฟแท่งปริมาณฝนรายเดือน ข้อมูลสมมติ หน่วยมิลลิเมตร สถานี ก: ม.ค. 10 ก.พ. 20 มี.ค. 40 เม.ย. 90 พ.ค. 210 มิ.ย. 190 ก.ค. 190 ส.ค. 220 ก.ย. 320 ต.ค. 230 พ.ย. 50 ธ.ค. 10 สถานี ข: ม.ค. 150 ก.พ. 60 มี.ค. 60 เม.ย. 80 พ.ค. 120 มิ.ย. 100 ก.ค. 110 ส.ค. 110 ก.ย. 140 ต.ค. 280 พ.ย. 600 ธ.ค. 450" }
    choices:
      - { id: a, text: "สถานี ข เพราะฝนมากที่สุดช่วงพฤศจิกายนถึงธันวาคม ซึ่งเป็นช่วงมรสุมตะวันออกเฉียงเหนือ", correct: true }
      - { id: b, text: "สถานี ก เพราะฝนมากช่วงพฤษภาคมถึงตุลาคม", feedback: "ฝนช่วงพฤษภาคมถึงตุลาคมมาจากมรสุมตะวันตกเฉียงใต้ ซึ่งเป็นแบบของภาคกลางและภาคอื่น ๆ ส่วนใหญ่" }
      - { id: c, text: "สถานี ก เพราะฝนน้อยในเดือนธันวาคม", feedback: "ภาคใต้ฝั่งตะวันออกมีฝนชุกในเดือนธันวาคม ไม่ใช่ฝนน้อย" }
      - { id: d, text: "บอกไม่ได้จากกราฟ", feedback: "รูปแบบฝนตามเดือนบอกได้ว่ามรสุมใดนำฝนมา" }
    hints:
      - "ภาคใต้ฝั่งตะวันออกได้ฝนจากมรสุมใดมากที่สุด"
      - "มรสุมนั้นพัดช่วงเดือนใด"
    solution: "สถานี ข มีฝนมากที่สุดในเดือนพฤศจิกายน (600 มม.) และธันวาคม (450 มม.) ช่วงมรสุมตะวันออกเฉียงเหนือที่พาความชื้นจากอ่าวไทยมา จึงน่าจะอยู่ภาคใต้ฝั่งตะวันออก ส่วนสถานี ก ฝนมากช่วงมรสุมตะวันตกเฉียงใต้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.monsoons-thai-seasons.p009
    topics: [earthscience.atmosphere.monsoons-thai-seasons]
    difficulty: 3
    type: numeric
    stem: "จากกราฟเดิม สถานี ก มีฝนเดือนพฤษภาคมถึงตุลาคม 210, 190, 190, 220, 320 และ 230 มิลลิเมตร รวมฝนในช่วงฤดูฝนกี่มิลลิเมตร"
    figure: { src: p-rainfall.svg, alt: "กราฟแท่งปริมาณฝนรายเดือน ข้อมูลสมมติ หน่วยมิลลิเมตร สถานี ก: ม.ค. 10 ก.พ. 20 มี.ค. 40 เม.ย. 90 พ.ค. 210 มิ.ย. 190 ก.ค. 190 ส.ค. 220 ก.ย. 320 ต.ค. 230 พ.ย. 50 ธ.ค. 10 สถานี ข: ม.ค. 150 ก.พ. 60 มี.ค. 60 เม.ย. 80 พ.ค. 120 มิ.ย. 100 ก.ค. 110 ส.ค. 110 ก.ย. 140 ต.ค. 280 พ.ย. 600 ธ.ค. 450" }
    answer: { value: 1360, unit: mm }
    misconceptions:
      - { match: 1580, feedback: "1,580 มม. คือฝนทั้งปี โจทย์ถามเฉพาะพฤษภาคมถึงตุลาคม" }
      - { match: 1130, feedback: "ลืมนับเดือนใดเดือนหนึ่ง ต้องรวมให้ครบ 6 เดือน" }
    hints:
      - "บวกฝนทั้ง 6 เดือน"
      - "จับคู่บวกทีละสองเดือนเพื่อลดความผิดพลาด"
    solution: "$210 + 190 + 190 + 220 + 320 + 230 = 1{,}360$ มิลลิเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.monsoons-thai-seasons.p010
    topics: [earthscience.atmosphere.monsoons-thai-seasons]
    difficulty: 3
    type: mcq
    stem: "ช่วงเดือนพฤศจิกายนถึงธันวาคม ภาคเหนือของไทยอากาศหนาวและแห้ง แต่จังหวัดนครศรีธรรมราชและสงขลามีฝนตกหนัก เพราะเหตุใด"
    choices:
      - { id: a, text: "มรสุมตะวันออกเฉียงเหนือพัดผ่านอ่าวไทย นำความชื้นไปตกที่ภาคใต้ฝั่งตะวันออก", correct: true }
      - { id: b, text: "มรสุมตะวันตกเฉียงใต้ยังพัดอยู่ที่ภาคใต้", feedback: "มรสุมตะวันตกเฉียงใต้หมดไปตั้งแต่กลางเดือนตุลาคม" }
      - { id: c, text: "ภาคใต้อยู่ใกล้ดวงอาทิตย์กว่า", feedback: "ระยะห่างจากดวงอาทิตย์ของแต่ละภาคแทบไม่ต่างกัน ฝนเกิดจากลมที่นำความชื้นมา" }
      - { id: d, text: "อากาศเย็นจากจีนทำให้เกิดหิมะละลาย", feedback: "ประเทศไทยไม่มีหิมะ ฝนเกิดจากความชื้นที่ลมพามา" }
    hints:
      - "ช่วงนี้มรสุมใดพัดปกคลุมประเทศไทย"
      - "ก่อนถึงภาคใต้ฝั่งตะวันออก ลมพัดผ่านอะไร"
    solution: "ช่วงนี้มรสุมตะวันออกเฉียงเหนือพัดจากจีนมาเป็นอากาศแห้ง ภาคเหนือจึงหนาวและแห้ง แต่ลมที่พัดผ่านอ่าวไทยได้ความชื้นจากทะเล เมื่อถึงชายฝั่งภาคใต้ฝั่งตะวันออกจึงเกิดฝนตกหนัก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.monsoons-thai-seasons.p011
    topics: [earthscience.atmosphere.monsoons-thai-seasons]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นผลของมรสุมตะวันตกเฉียงใต้ต่อสิ่งมีชีวิตและสิ่งแวดล้อมในประเทศไทย (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ชาวนาเริ่มปลูกข้าวนาปีเพราะมีน้ำฝน", correct: true }
      - { id: b, text: "คลื่นลมในทะเลอันดามันแรง อุทยานแห่งชาติทางทะเลหลายแห่งปิดเกาะ", correct: true }
      - { id: c, text: "บางพื้นที่เกิดน้ำท่วมและดินถล่มเมื่อฝนตกหนัก", correct: true }
      - { id: d, text: "ภาคเหนือหนาวจัดและเกิดน้ำค้างแข็งบนยอดดอย", feedback: "อากาศหนาวและน้ำค้างแข็งเกิดช่วงมรสุมตะวันออกเฉียงเหนือ" }
    hints:
      - "มรสุมนี้นำฝนมามาก"
      - "มรสุมนี้พัดมาจากทางทะเลอันดามันและมหาสมุทรอินเดีย"
    solution: "มรสุมตะวันตกเฉียงใต้นำฝนมาให้ปลูกข้าว แต่ก็ทำให้น้ำท่วมและดินถล่มได้ และทำให้คลื่นลมในทะเลอันดามันแรง ส่วนความหนาวเย็นเป็นผลของมรสุมตะวันออกเฉียงเหนือ"
    license: CC-BY-SA-4.0
