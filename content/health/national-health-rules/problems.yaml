      - { id: a, text: "เมื่อทำทุกวันจนเป็นนิสัย ร่างกายและจิตใจแข็งแรง ป้องกันโรค และคนรอบข้างปลอดภัยไปด้วย", correct: true }
      - { id: b, text: "ทำเฉพาะวันที่ครูตรวจก็พอ เพราะเป็นกฎของโรงเรียน", feedback: "สุขบัญญัติไม่ใช่การทำเพื่อครู แต่เป็นนิสัยเพื่อสุขภาพของเราเองทุกวัน" }
      - { id: c, text: "ทำแล้วจะไม่ป่วยเลยตลอดชีวิต", feedback: "สุขบัญญัติลดโอกาสเจ็บป่วยได้มาก แต่ไม่ได้รับประกันว่าจะไม่ป่วยเลย ถ้าป่วยก็ต้องพบแพทย์" }
      - { id: d, text: "สำคัญเฉพาะผู้ใหญ่ เด็กยังไม่ต้องทำ", feedback: "นิสัยที่ดีควรเริ่มตั้งแต่เด็ก เพราะจะติดตัวไปเมื่อโตขึ้น" }
    hints:
