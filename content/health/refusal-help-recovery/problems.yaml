  stem: ลูกพี่ลูกน้องของเตยพูดว่า "บางทีก็อยากเลิกบุหรี่ไฟฟ้านะ แต่กลัวเครียดแล้วอดไม่ไหว" เขาอยู่ช่วงลังเล วิธีชวนแบบใดเหมาะที่สุด
  choices:
  - id: a
    text: ถามว่าอะไรทำให้อยากเลิก ฟังเหตุผลของเขา และบอกว่ามีสายเลิกบุหรี่ 1600 ช่วยวางแผนรับมือความเครียดได้
    correct: true
  - id: b
    text: บังคับให้เลิกวันนี้และค้นกระเป๋าทุกวัน
    feedback: การบังคับมักทำให้ปิดบัง และไม่สร้างความตั้งใจของเขาเอง
  - id: c
    text: บอกว่าถ้ายังลังเลแปลว่าไม่ตั้งใจจริง
    feedback: ความลังเลเป็นช่วงปกติของการเปลี่ยนพฤติกรรม
  - id: d
    text: ให้ข้อมูลโทษของนิโคตินยาว ๆ ทุกวัน
    feedback: การให้ข้อมูลซ้ำ ๆ โดยไม่ฟังมักทำให้รู้สึกถูกตำหนิ
  hints:
