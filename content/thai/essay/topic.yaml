id: thai.composition.essay
subject: thai
title: { th: การวางโครงเรื่องและเขียนเรียงความ, en: "Outlining and writing essays" }
summary: วางแผนภาพความคิดและแผนภาพโครงเรื่อง เขียนคำนำ เนื้อเรื่อง และสรุป สร้างย่อหน้าที่มีเอกภาพ สัมพันธภาพ และสารัตถภาพ และประเมินงานเขียนของผู้อื่นด้วยเกณฑ์เพื่อพัฒนางานของตน
difficulty: 5
minutes: 35
prerequisites: [thai.composition.narrative-descriptive]
encompasses:
  - { id: thai.composition.narrative-descriptive, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: essay-structure.svg
    alt: "โครงสร้างเรียงความเรื่อง ประโยชน์ของการปลูกผักสวนครัว กล่องบนสุด คำนำ เปิดเรื่องให้น่าสนใจและบอกประเด็นหลัก กล่องกลาง เนื้อเรื่อง ย่อหน้าละหนึ่งประเด็นย่อย มี 3 ย่อหน้า ประหยัดค่าใช้จ่าย ได้ผักปลอดภัย ทำกิจกรรมกับครอบครัว แต่ละย่อหน้ามีประโยคใจความด้านบน และประโยคขยายความ ตัวอย่าง เหตุผล ข้อมูล ด้านล่าง กล่องล่างสุด สรุป สรุปประเด็นด้วยคำใหม่ ฝากข้อคิด หรือเชิญชวน ไม่เปิดประเด็นใหม่ ท้ายภาพเขียนว่า ย่อหน้าที่ดี เอกภาพ สัมพันธภาพ สารัตถภาพ"
    caption: "คำนำ เนื้อเรื่องหลายย่อหน้า และสรุป แต่ละย่อหน้ามีประโยคใจความหนึ่งประโยค"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: จากแผนภาพความคิดสู่แผนภาพโครงเรื่อง
    problem: "วางโครงเรื่องเรียงความ 5 ย่อหน้าเรื่อง การปั่นจักรยานไปโรงเรียน"
    steps:
      - text: "กำหนดประเด็นหลัก: การปั่นจักรยานไปโรงเรียนดีต่อสุขภาพ ประหยัด และลดมลพิษ"
        why: "ประเด็นที่บอกแง่มุมชัดจะแตกเป็นย่อหน้าได้ง่าย"
      - text: "แผนภาพความคิด: เขียนประเด็นไว้กลาง แตกกิ่ง สุขภาพ ค่าเดินทาง มลพิษ ความปลอดภัย ที่จอด"
      - text: "เลือก 3 กิ่งที่หนุนประเด็นหลักโดยตรง: สุขภาพ ค่าเดินทาง มลพิษ ส่วนความปลอดภัยใช้เป็นข้อควรระวังในสรุป"
      - text: "เรียงแผนภาพโครงเรื่อง: 1 คำนำ (ตั้งคำถามเรื่องรถติดหน้าโรงเรียน) 2.1 สุขภาพ 2.2 ประหยัดค่าเดินทาง 2.3 ลดมลพิษ 3 สรุป (ทวนประโยชน์ เตือนให้สวมหมวกกันน็อก และชวนลองปั่น)"
    answer: "โครงเรื่อง 5 ส่วน: คำนำ · สุขภาพ · ประหยัด · ลดมลพิษ · สรุปพร้อมข้อควรระวังและเชิญชวน"
  - { type: check, problem: thai.composition.essay.p005, prompt: "ประโยคใดไม่เกี่ยวกับการประหยัด" }
  - type: worked-example
    title: ประเมินงานเพื่อนแล้วแก้งานตน
    problem: "เพื่อนได้คะแนน เนื้อหา 4 โครงสร้าง 3 การใช้ภาษา 4 การสะกดคำ 2 จากเต็มด้านละ 5 เขียนข้อเสนอแนะ แล้วบอกว่าจะนำมาใช้กับงานของตนอย่างไร"
    steps:
      - text: "รวมคะแนน 4 + 3 + 4 + 2 = 13 จาก 20 ด้านที่ต่ำที่สุดคือการสะกดคำ"
      - text: "ชี้จุดที่ชัด: ย่อหน้าที่ 2 เขียน กระเพรา (ที่ถูกคือ กะเพรา)"
        why: "ข้อเสนอแนะที่บอกตำแหน่งช่วยให้เพื่อนแก้ได้ทันที"
      - text: "บอกวิธีแก้: ตรวจคำที่ไม่แน่ใจกับพจนานุกรมฉบับราชบัณฑิตยสถานก่อนส่ง"
      - text: "นำมาใช้กับตน: ตรวจงานของตนด้วยเกณฑ์ 4 ด้านเดียวกัน และทำรายการคำที่ตนสะกดผิดบ่อย"
    answer: "ข้อเสนอแนะชี้ว่าย่อหน้าที่ 2 สะกด กะเพรา ผิด และแนะให้ตรวจพจนานุกรม ส่วนตนเองใช้เกณฑ์เดียวกันตรวจงานก่อนส่ง"
  - { type: check, problem: thai.composition.essay.p011, prompt: "บวกคะแนนทุกด้าน" }
glossary:
  - { term: เรียงความ, definition: "งานเขียนร้อยแก้วหลายย่อหน้าตามหัวข้อ มีคำนำ เนื้อเรื่อง และสรุป" }
  - { term: แผนภาพโครงเรื่อง, definition: "ลำดับหัวข้อที่จะเขียน แบ่งเป็นคำนำ หัวข้อย่อยของเนื้อเรื่อง และสรุป" }
  - { term: ประโยคใจความ, definition: "ประโยคที่บอกประเด็นของย่อหน้า" }
  - { term: เอกภาพ, definition: "ย่อหน้ามีใจความเดียว ทุกประโยคเกี่ยวกับใจความนั้น" }
  - { term: สัมพันธภาพ, definition: "ประโยคในย่อหน้าต่อเนื่องกัน เชื่อมด้วยคำเชื่อมที่เหมาะ" }
  - { term: สารัตถภาพ, definition: "การเน้นใจความให้เด่นชัดและมีรายละเอียดสนับสนุนพอ" }
flashcards:
  - { front: "เรียงความ 3 ส่วน", back: "คำนำ เนื้อเรื่อง สรุป" }
  - { front: "ย่อหน้าที่ดี 3 ข้อ", back: "เอกภาพ สัมพันธภาพ สารัตถภาพ" }
  - { front: "วิธีเปิดเรื่อง", back: "ตั้งคำถาม เล่าเหตุการณ์ ยกคำพูดหรือสุภาษิต บอกข้อเท็จจริงที่น่าสนใจ" }
  - { front: "สรุปไม่ควรทำอะไร", back: "เปิดประเด็นใหม่ หรือคัดคำนำมาซ้ำ" }
  - { front: "ข้อเสนอแนะที่ดี", back: "ชี้จุดชัด ตรงเกณฑ์ และบอกวิธีแก้" }
