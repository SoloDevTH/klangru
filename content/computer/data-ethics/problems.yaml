problems:
  - id: computer.society.data-ethics.p001
    topics: [computer.society.data-ethics]
    difficulty: 1
    type: mcq
    stem: "เมทาดาทาหมายถึงอะไร"
    choices:
      - { id: a, text: "ข้อมูลที่อธิบายข้อมูลอื่น เช่น เวลาที่ส่งข้อความ ตำแหน่ง และความยาวของการโทร", correct: true }
      - { id: b, text: "ข้อมูลที่ผู้ใช้พิมพ์ลงในแอปเอง", feedback: "นั่นคือข้อมูลที่ผู้ใช้ให้โดยตรง ไม่ใช่เมทาดาทา" }
      - { id: c, text: "รหัสผ่านที่ใช้เข้าระบบ", feedback: "รหัสผ่านเป็นข้อมูลความปลอดภัย ไม่ได้เป็นข้อมูลที่อธิบายข้อมูลอื่น" }
      - { id: d, text: "ผลการประมวลผลที่ระบบสร้างขึ้นมาใหม่", feedback: "ผลลัพธ์ที่ได้จากการประมวลผลเป็นข้อมูลชุดใหม่ ไม่ใช่คำอธิบายข้อมูลเดิม" }
    hints:
      - "คำว่า meta แปลว่า เกี่ยวกับตัวมันเอง หรือ อยู่เหนือระดับหนึ่ง"
      - "ลองนึกถึงข้อมูลที่บอกว่าข้อมูลอื่นถูกเก็บ ถูกส่ง หรือถูกใช้เมื่อไรและที่ไหน"
    solution: "เมทาดาทาคือข้อมูลที่อธิบายข้อมูลอื่น เช่น เวลา ตำแหน่ง และความถี่ของการใช้งาน ซึ่งอาจเผยรูปแบบชีวิตของคนได้แม้ไม่มีเนื้อหาข้อความ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.data-ethics.p002
    topics: [computer.society.data-ethics]
    difficulty: 1
    type: match
    stem: "จับคู่ขั้นตอนของงานข้อมูลกับตัวอย่างความเอนเอียงที่อาจเกิดขึ้นในขั้นนั้น"
    pairs:
      - { left: "การเก็บข้อมูล", right: "เก็บจากผู้ที่ใช้แอปเท่านั้น จึงขาดผู้สูงอายุและคนในพื้นที่ห่างไกล" }
      - { left: "การติดป้ายข้อมูล", right: "ผู้ติดป้ายแต่ละคนให้ป้ายต่างกันกับภาพเดียวกัน ตามความเข้าใจของตนเอง" }
      - { left: "การเลือกตัวแปร", right: "ใช้รหัสไปรษณีย์แทนรายได้ จึงลากความเหลื่อมล้ำเข้ามาในผลลัพธ์" }
      - { left: "การนำไปใช้", right: "ใช้ผลที่ถูกต้องกับกลุ่มหนึ่ง กับกลุ่มอื่นที่ข้อมูลไม่เคยครอบคลุม" }
    hints:
      - "ลองถามว่าความเอนเอียงนั้นเกิดขึ้นก่อนหรือหลังที่โมเดลจะถูกสร้าง"
      - "ตัวอย่างที่เกี่ยวกับการเลือกว่าจะเก็บหรือไม่เก็บใคร มักอยู่ในขั้นการเก็บข้อมูล"
    solution: "การเก็บข้อมูลจากกลุ่มที่เข้าถึงง่ายทำให้ขาดกลุ่มอื่น การติดป้ายขึ้นกับผู้ติดป้าย การเลือกตัวแปรที่เป็นตัวแทนอาจพาความเหลื่อมล้ำมา และการนำไปใช้กับกลุ่มที่ไม่เคยเห็นทำให้ผลพลาด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.data-ethics.p003
    topics: [computer.society.data-ethics]
    difficulty: 2
    type: numeric
    stem: "เมืองหนึ่งมีประชากร 10,000 คน ประชากรอายุ 18–35 ปีคิดเป็น 30% แบบสำรวจเก็บข้อมูลผ่านแอปเท่านั้น มีผู้ใช้แอป 3,000 คน ในจำนวนนี้ 2,400 คนอายุ 18–35 ปี ค่าสัดส่วนของกลุ่มอายุนี้ในตัวอย่างสูงกว่าประชากรจริงกี่เปอร์เซ็นต์จุด (ค่าสมมติ)"
    answer: { value: 50, unit: เปอร์เซ็นต์จุด }
    hints:
      - "หาสัดส่วนของกลุ่มอายุ 18–35 ในตัวอย่างก่อน คือ 2,400 หารด้วย 3,000"
      - "เปรียบเทียบกับสัดส่วนในประชากรจริงที่ 30% แล้วหาผลต่าง"
      - "ผลต่างของสัดส่วนเป็นเปอร์เซ็นต์จุด ไม่ใช่อัตราส่วน"
    misconceptions:
      - { match: 2.67, feedback: "นั่นคืออัตราส่วน 80 ÷ 30 ซึ่งไม่ใช่ผลต่างที่โจทย์ถาม โจทย์ถามว่าสูงกว่ากี่เปอร์เซ็นต์จุด" }
    solution: "สัดส่วนในตัวอย่าง = 2,400 ÷ 3,000 = 80% ประชากรจริง 30% ผลต่าง = 80 − 30 = 50 เปอร์เซ็นต์จุด ตัวอย่างนี้แสดงว่าผลสำรวจจากแอปจะไม่สะท้อนประชากรทั้งเมือง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.data-ethics.p004
    topics: [computer.society.data-ethics]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นตัวอย่างของข้อมูลอ่อนไหว ตามแนวคิดของกฎหมายคุ้มครองข้อมูลส่วนบุคคลไทย ที่ต้องได้รับการคุ้มครองเข้มกว่า"
    choices:
      - { id: b, text: "ชื่อเล่นที่แสดงในกลุ่มเรียนสาธารณะ", feedback: "ชื่อเล่นเป็นข้อมูลส่วนบุคคลที่ต้องคุ้มครองตามปกติ แต่ไม่ใช่ข้อมูลอ่อนไหวโดยหลักการ" }
      - { id: a, text: "ประวัติการรักษาพยาบาลของบุคคล", correct: true }
      - { id: c, text: "จำนวนครั้งที่กดไลก์ในโพสต์หนึ่ง", feedback: "จำนวนการกดไลก์เป็นสถิติการใช้งาน ไม่ได้อยู่ในกลุ่มข้อมูลอ่อนไหว" }
      - { id: d, text: "ผลสอบวิชาคณิตศาสตร์ของห้องเรียน", feedback: "ผลสอบเป็นข้อมูลการศึกษาที่ต้องดูแลอย่างดี แต่ไม่ใช่กลุ่มข้อมูลอ่อนไหวตามหลักการ" }
    hints:
      - "ข้อมูลอ่อนไหวมักเกี่ยวกับเรื่องที่หากรั่วไหลแล้วอาจทำให้ถูกเลือกปฏิบัติ"
      - "ตัวเลือกที่เกี่ยวกับร่างกายหรือสุขภาพเป็นเรื่องที่ควรตรวจก่อน"
    solution: "กลุ่มข้อมูลอ่อนไหวรวมถึงข้อมูลสุขภาพ เชื้อชาติ ความเชื่อทางศาสนาหรือปรัชญา และข้อมูลชีวภาพ ประวัติการรักษาพยาบาลจึงเป็นตัวอย่างที่ตรงที่สุด (รายการข้อมูลอ่อนไหวอยู่ในมาตรา 26 ของ พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.data-ethics.p005
    topics: [computer.society.data-ethics]
    difficulty: 2
    type: numeric
    stem: "แบบสอบถามออนไลน์ของโรงเรียนแห่งหนึ่งได้ผู้ตอบ 1,200 คน ในจำนวนนี้ 960 คนเข้าอินเทอร์เน็ตทุกวัน ส่วนประชากรจริงของโรงเรียนที่เข้าอินเทอร์เน็ตทุกวันมี 60% (ค่าสมมติ) ค่าสัดส่วนนี้ในตัวอย่างสูงกว่าประชากรจริงกี่เปอร์เซ็นต์จุด"
    answer: { value: 20, unit: เปอร์เซ็นต์จุด }
    hints:
      - "หาสัดส่วนของผู้ที่เข้าอินเทอร์เน็ตทุกวันในผู้ตอบ คือ 960 หารด้วย 1,200"
      - "เปรียบเทียบกับ 60% ของประชากรจริง"
    misconceptions:
      - { match: 40, feedback: "นั่นคือส่วนที่เหลือของประชากร แต่โจทย์ถามผลต่างระหว่างสัดส่วนในตัวอย่างกับประชากร" }
    solution: "สัดส่วนในตัวอย่าง = 960 ÷ 1,200 = 80% ผลต่าง = 80 − 60 = 20 เปอร์เซ็นต์จุด แบบสำรวจออนไลน์จึงได้ผู้ที่เข้าถึงอินเทอร์เน็ตมากกว่าความเป็นจริง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.data-ethics.p006
    topics: [computer.society.data-ethics]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นตัวอย่างของการลดข้อมูล (data minimisation) ก่อนเผยแพร่สถิติ"
    choices:
      - { id: b, text: "เผยแพร่ตารางพร้อมชื่อและนามสกุลของผู้ตอบทุกคน", feedback: "การเผยแพร่ชื่อผู้ตอบไม่จำเป็นต่อการรายงานสถิติ และเพิ่มความเสี่ยงโดยไม่มีเหตุผล" }
      - { id: c, text: "เก็บเลขบัตรประชาชนไว้เผื่อใช้ในอนาคต", feedback: "การเก็บข้อมูลที่ไม่มีวัตถุประสงค์ชัดเจนขัดกับหลักการเก็บเท่าที่จำเป็น" }
      - { id: a, text: "รายงานกลุ่มอายุเป็นช่วง 20–29 ปี แทนการระบุอายุของแต่ละคน", correct: true }
      - { id: d, text: "เก็บข้อมูลทุกอย่างที่หาได้ไว้ก่อนเสมอ", feedback: "หลักการลดข้อมูลตรงข้ามกับการเก็บทุกอย่างไว้ก่อน" }
    hints:
      - "ถามว่าการรายงานผลสถิติต้องใช้รายละเอียดระดับบุคคลหรือไม่"
      - "การทำให้รายละเอียดหยาบลงเป็นวิธีหนึ่งของการลดข้อมูล"
    solution: "การรายงานเป็นช่วงอายุยังให้ข้อมูลสถิติที่ใช้ได้ แต่ไม่เปิดเผยอายุของแต่ละคน ซึ่งเป็นการเก็บและเผยแพร่เท่าที่จำเป็น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.data-ethics.p007
    topics: [computer.society.data-ethics]
    difficulty: 2
    type: text
    stem: "เรียกการแทนที่ชื่อจริงด้วยรหัส โดยเก็บตารางจับคู่รหัสกับชื่อแยกไว้อย่างปลอดภัย ว่าอะไร (ตอบเป็นคำไทยหรืออังกฤษ)"
    accepted: ["แฝงชื่อ", "การแฝงชื่อ", "pseudonymisation", "pseudonymization", "pseudonymous"]
    misconceptions:
      - { match: "ลบชื่อ", feedback: "การลบชื่อทิ้งไปเฉย ๆ ต่างจากการแทนด้วยรหัสที่ยังเชื่อมกลับได้ด้วยตารางจับคู่ และยังไม่รับประกันว่าไม่ระบุตัวตน" }
    hints:
      - "คำนี้มีความหมายว่าใช้ชื่อปลอมหรือรหัสแทนชื่อจริง"
      - "ตารางจับคู่ยังมีอยู่ ดังนั้นยังย้อนกลับไปหาตัวบุคคลได้ถ้ามีคนเข้าถึง"
    solution: "การแฝงชื่อ (pseudonymisation) แทนชื่อด้วยรหัสและเก็บตารางจับคู่แยกต่างหาก ทำให้การวิเคราะห์ทำได้โดยไม่เปิดเผยชื่อ แต่ยังไม่ใช่การทำให้ไม่ระบุตัวตนเด็ดขาด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.data-ethics.p008
    topics: [computer.society.data-ethics]
    difficulty: 2
    type: text
    stem: "การที่ผู้เก็บข้อมูลต้องบอกก่อนว่าจะนำข้อมูลไปทำอะไร เรียกเป็นคำไทยสั้น ๆ ว่าอะไร"
    accepted: ["แจ้งวัตถุประสงค์", "การแจ้งวัตถุประสงค์", "ความโปร่งใสของวัตถุประสงค์"]
    hints:
      - "คำนี้เกี่ยวข้องกับการบอกเป้าหมายการใช้ข้อมูลให้ชัดก่อนเก็บ"
      - "เป้าหมายที่แจ้งไว้เป็นเกณฑ์ที่ใช้ตัดสินว่าเก็บมากเกินไปหรือไม่"
    solution: "การแจ้งวัตถุประสงค์คือการบอกให้ชัดว่าจะเก็บข้อมูลเพื่ออะไร เพราะวัตถุประสงค์เป็นเกณฑ์ที่ใช้ตัดสินว่าข้อมูลใดจำเป็นและใช้ได้หรือไม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.data-ethics.p009
    topics: [computer.society.data-ethics]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนของธรรมาภิบาลข้อมูลสำหรับชุดข้อมูลหนึ่ง จากขั้นแรกไปจนถึงขั้นสุดท้าย"
    items:
      - "กำหนดนโยบายและวัตถุประสงค์ของการใช้ข้อมูลให้ชัด"
      - "เก็บเฉพาะข้อมูลที่จำเป็นตามวัตถุประสงค์ที่แจ้งไว้"
      - "กำหนดสิทธิ์เข้าถึงว่าใครดูหรือแก้ไขข้อมูลได้บ้าง"
      - "กำหนดระยะเวลาเก็บและลบข้อมูลเมื่อหมดความจำเป็น"
      - "ตรวจสอบการปฏิบัติตามนโยบายและรายงานผลต่อผู้เกี่ยวข้อง"
    hints:
      - "ก่อนเก็บอะไรต้องรู้ก่อนว่าจะใช้ทำอะไร"
      - "การตรวจสอบเป็นขั้นสุดท้ายที่มองว่าทุกขั้นก่อนหน้าเป็นไปตามที่กำหนดหรือไม่"
    solution: "เริ่มจากนโยบายและวัตถุประสงค์ ตามด้วยการเก็บเท่าที่จำเป็น กำหนดสิทธิ์เข้าถึง กำหนดระยะเวลาเก็บและลบ และปิดท้ายด้วยการตรวจสอบและรายงาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.data-ethics.p010
    topics: [computer.society.data-ethics]
    difficulty: 3
    type: numeric
    stem: "ระบบประเมินผลมีความถูกต้อง 90% ในกลุ่ม A ที่มี 900 ตัวอย่าง และถูกต้อง 60% ในกลุ่ม B ที่มี 100 ตัวอย่าง ความถูกต้องโดยรวมของตัวอย่างทั้ง 1,000 รายการคิดเป็นกี่เปอร์เซ็นต์ (ตอบเป็นเปอร์เซ็นต์)"
    answer: { value: 87, unit: เปอร์เซ็นต์ }
    hints:
      - "หาจำนวนคำตอบที่ถูกในแต่ละกลุ่มก่อน คือ 90% ของ 900 และ 60% ของ 100"
      - "รวมจำนวนที่ถูกทั้งหมดแล้วหารด้วย 1,000"
      - "ค่าเฉลี่ยของเปอร์เซ็นต์สองกลุ่มโดยไม่ถ่วงน้ำหนักจะให้ผลต่างจากนี้"
    misconceptions:
      - { match: 75, feedback: "หาค่าเฉลี่ยของสองเปอร์เซ็นต์โดยไม่ถ่วงน้ำหนักด้วยจำนวนตัวอย่าง ซึ่งไม่ถูกต้องเพราะกลุ่ม A มีตัวอย่างมากกว่ามาก" }
