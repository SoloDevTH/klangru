id: biology.humans.nutrition-digestion
subject: biology
title: { th: สารอาหารและระบบย่อยอาหาร, en: "Nutrients and the digestive system" }
summary: สารอาหาร 6 ประเภทและประโยชน์ การเลือกอาหารให้ครบ พอดีกับเพศและวัย และปลอดภัย พลังงานบนฉลาก อวัยวะในระบบย่อยอาหาร ฟัน การย่อย การดูดซึม และการดูแลรักษา
difficulty: 2.2
minutes: 35
prerequisites: [biology.humans.body-parts]
encompasses:
  - { id: biology.humans.body-parts, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: อวัยวะในระบบย่อยอาหารของคน
    src: digestive-system.svg
    alt: "ภาพลำตัวคนแสดงอวัยวะในระบบย่อยอาหาร จากบนลงล่าง: ปาก (ฟัน ลิ้น ต่อมน้ำลาย) ต่อกับหลอดอาหารที่ลงไปถึงกระเพาะอาหารรูปตัว J ทางขวาของภาพ ตับขนาดใหญ่อยู่ทางซ้ายของภาพเหนือกระเพาะ มีถุงน้ำดีสีเขียวอยู่ใต้ตับ ตับอ่อนเป็นแท่งยาวสีเหลืองใต้กระเพาะ ลำไส้เล็กขดไปมาอยู่ตรงกลางท้อง ลำไส้ใหญ่เป็นกรอบล้อมลำไส้เล็กสามด้าน มีไส้ติ่งที่มุมล่างซ้ายของภาพ ปลายลำไส้ใหญ่ต่อกับไส้ตรงและทวารหนักที่ล่างสุด"
    caption: "อาหารผ่านปาก หลอดอาหาร กระเพาะอาหาร ลำไส้เล็ก ลำไส้ใหญ่ และทวารหนัก ส่วนตับ ถุงน้ำดี และตับอ่อนส่งน้ำดีและน้ำย่อยมาที่ลำไส้เล็ก (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ติดตามข้าวผัดไก่ในระบบย่อยอาหาร
    problem: "ข้าวผัดไก่มีแป้งจากข้าว โปรตีนจากไก่ และไขมันจากน้ำมัน บอกว่าสารอาหารแต่ละชนิดถูกย่อยที่ใดบ้าง และดูดซึมที่ใด"
    steps:
      - text: "ที่ปาก ฟันบดข้าวและไก่ให้ชิ้นเล็กลง (ย่อยเชิงกล) และเอนไซม์ในน้ำลายเริ่มย่อยแป้ง"
      - text: "หลอดอาหารบีบตัวดันอาหารลงกระเพาะ ไม่มีการย่อย"
      - text: "ที่กระเพาะอาหาร น้ำย่อยที่มีกรดเริ่มย่อยโปรตีนจากไก่"
      - text: "ที่ลำไส้เล็ก น้ำดีจากตับทำให้น้ำมันแตกเป็นหยดเล็ก น้ำย่อยจากตับอ่อนและผนังลำไส้ย่อยแป้ง โปรตีน และไขมันจนสมบูรณ์"
        why: "ไขมันไม่ละลายน้ำ ต้องแตกเป็นหยดเล็กก่อน น้ำย่อยจึงเข้าถึงได้ทั่ว"
      - text: "สารอาหารที่ย่อยแล้วถูกดูดซึมผ่านวิลลัสของลำไส้เล็กเข้าสู่เลือด ลำไส้ใหญ่ดูดน้ำกลับ"
    answer: "แป้งเริ่มย่อยที่ปาก โปรตีนเริ่มที่กระเพาะ ไขมันที่ลำไส้เล็ก ทั้งหมดย่อยจนสมบูรณ์และดูดซึมที่ลำไส้เล็ก"
  - { type: check, problem: biology.humans.nutrition-digestion.p004, prompt: "ใช้ภาพระบบย่อยอาหารช่วยเรียง" }
  - type: figure
    title: ฟันแท้ขากรรไกรบน
    src: teeth.svg
    alt: "ฟันแท้ขากรรไกรบน 16 ซี่เรียงเป็นโค้งรูปเกือกม้า ด้านหน้าตรงริมฝีปากเป็นฟันตัด 4 ซี่สีฟ้า ถัดไปข้างละ 1 ซี่เป็นฟันเขี้ยวปลายแหลมสีส้ม ถัดไปข้างละ 2 ซี่เป็นฟันกรามน้อยสีเขียว และด้านในสุดข้างละ 3 ซี่เป็นฟันกรามขนาดใหญ่สีม่วง รวมฟันกราม 6 ซี่"
    caption: "ขากรรไกรล่างมีฟันแต่ละชนิดเท่ากับขากรรไกรบน ฟันแท้ทั้งปากจึงมี 32 ซี่ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: อ่านพลังงานจากฉลากแล้ววางแผนมื้ออาหาร
    problem: "เด็กอายุ 12 ปีต้องการพลังงานราว 1,600 กิโลแคลอรีต่อวัน ดื่มนมจืด 1 กล่องได้ 130 กิโลแคลอรี กินข้าวกะเพราไก่ไข่ดาวได้ 630 กิโลแคลอรี และขนมถุงหนึ่ง 120 กิโลแคลอรี ยังเหลือพลังงานสำหรับมื้ออื่นอีกเท่าไร"
    steps:
      - text: "รวมพลังงานที่ได้แล้ว: $130 + 630 + 120 = 880$ กิโลแคลอรี"
      - text: "หาพลังงานที่เหลือ: $1600 - 880 = 720$ กิโลแคลอรี"
      - text: "แบ่งให้มื้อที่เหลือ เช่น มื้อเย็นราว 600 และผลไม้ราว 120 กิโลแคลอรี"
        why: "ค่าความต้องการเป็นค่าประมาณ ใช้เป็นแนวทางเลือกอาหาร ไม่ต้องนับให้ตรงทุกแคลอรี"
    answer: "เหลือราว 720 กิโลแคลอรี"
  - { type: check, problem: biology.humans.nutrition-digestion.p010, prompt: "คิดว่าแป้งเริ่มถูกย่อยที่ไหน" }
glossary:
  - { term: สารอาหาร, definition: "สารในอาหารที่ร่างกายนำไปใช้ ได้แก่ คาร์โบไฮเดรต โปรตีน ไขมัน วิตามิน แร่ธาตุ และน้ำ" }
  - { term: การย่อยอาหาร, definition: "การทำให้อาหารมีขนาดเล็กลงจนเป็นโมเลกุลที่ร่างกายดูดซึมได้ มีทั้งเชิงกลและเชิงเคมี" }
  - { term: การดูดซึม, definition: "การที่สารอาหารที่ย่อยแล้วผ่านผนังลำไส้เล็กเข้าสู่เลือด" }
  - { term: วิลลัส, definition: "ส่วนที่ยื่นออกมาเล็ก ๆ จำนวนมากบนผนังด้านในของลำไส้เล็ก เพิ่มพื้นที่ดูดซึม" }
  - { term: น้ำดี, definition: "ของเหลวที่ตับสร้าง เก็บในถุงน้ำดี และส่งไปลำไส้เล็กเพื่อทำให้ไขมันแตกเป็นหยดเล็ก" }
  - { term: ใยอาหาร, definition: "ส่วนของพืชที่ร่างกายย่อยไม่ได้ ช่วยให้ขับถ่ายสะดวก" }
