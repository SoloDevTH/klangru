  - id: computer.programming.control-flow.p016
    topics: [computer.programming.control-flow]
    difficulty: 4
    type: code
    stem: |
      เขียนฟังก์ชัน `is_prime(n)` ที่คืน `True` เมื่อ `n` เป็นจำนวนเฉพาะ และคืน `False` เมื่อไม่ใช่

      ให้ใช้วงวนตาม `d` ตั้งแต่ 2 ถึงรากที่สองของ `n` ถ้าพบตัวหารให้ `break` และใช้ `else` ของวงวนคืน `True` เมื่อไม่พบตัวหารเลย จำนวนที่น้อยกว่า 2 ไม่ใช่จำนวนเฉพาะ
    starter: |
      def is_prime(n):
          return True
    tests: |
      assert is_prime(1) is False, f"1 ไม่ใช่จำนวนเฉพาะ แต่ได้ {is_prime(1)!r}"
      assert is_prime(2) is True, f"2 เป็นจำนวนเฉพาะ แต่ได้ {is_prime(2)!r}"
      assert is_prime(9) is False, f"9 = 3 × 3 ไม่ใช่จำนวนเฉพาะ แต่ได้ {is_prime(9)!r}"
      assert is_prime(17) is True, f"17 เป็นจำนวนเฉพาะ แต่ได้ {is_prime(17)!r}"
      assert is_prime(91) is False, f"91 = 7 × 13 ไม่ใช่จำนวนเฉพาะ แต่ได้ {is_prime(91)!r}"
      assert is_prime(97) is True, f"97 เป็นจำนวนเฉพาะ แต่ได้ {is_prime(97)!r}"
    reference: |
      def is_prime(n):
          if n < 2:
              return False
          for d in range(2, int(n ** 0.5) + 1):
              if n % d == 0:
                  break
          else:
              return True
          return False
    hints:
      - "ตรวจก่อนว่า n น้อยกว่า 2 หรือไม่ ถ้าใช่ คืน False ทันที"
      - "วนตาม d แล้วตรวจว่า n % d == 0 หรือไม่ ถ้าเจอให้ break"
      - "ใช้ else ของ for คืน True เมื่อวงวนจบโดยไม่เจอตัวหาร แล้วคืน False หลังวงวน"
    solution: "จำนวนที่น้อยกว่า 2 คืน False ตัวหาร d ตั้งแต่ 2 ถึงรากที่สองของ n ถ้าเจอ n % d == 0 จะ break และคืน False เมื่อวงจบโดยไม่ break ส่วน else คืน True ตัวอย่าง 91 เจอ 7 จึงคืน False"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.control-flow.p017
    topics: [computer.programming.control-flow]
    difficulty: 4
    type: numeric
    stem: |
      ดูโค้ดแล้วตอบค่าของ `count` หลังโปรแกรมทำงานจบ

      ```python
      count = 0
      for i in range(4):
          for j in range(4):
              if i == j:
                  continue
              count += 1
      ```
    answer: { value: 12 }
    hints:
      - "คู่ (i, j) ที่ i เท่ากับ j ถูกข้ามไป มีทั้งหมด 4 คู่"
      - "จำนวนคู่ทั้งหมดในตาราง 4 × 4 คือ 16"
      - "`continue` ข้ามเฉพาะรอบของวงในที่ i เท่ากับ j ไม่ได้ข้ามทั้งวงนอก"
    misconceptions:
      - { match: 6, feedback: "ใช้ continue เหมือน break ทำให้วงในหยุดตั้งแต่ j เท่ากับ i จึงนับได้แค่ 0 + 1 + 2 + 3" }
      - { match: 16, feedback: "ลืม continue ทำให้นับทุกคู่รวมที่ i เท่ากับ j ด้วย" }
    solution: "วงซ้อน 4 × 4 มี 16 คู่ ข้ามคู่ที่ i เท่ากับ j จำนวน 4 คู่ จึงนับ count ได้ 16 − 4 = 12"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.control-flow.p018
    topics: [computer.programming.control-flow]
    difficulty: 5
    type: code
    stem: |
      เขียนฟังก์ชัน `first_pair_product(nums, target)` ที่หาคู่แรกของตำแหน่ง `(i, j)` โดยที่ `i < j` และ `nums[i] * nums[j] == target` ให้สแกน `i` จากน้อยไปมาก และในแต่ละ `i` สแกน `j` จาก `i + 1` ไปมาก คืนค่าเป็น tuple `(i, j)` ของคู่แรกที่เจอ ถ้าไม่มีคู่ใดเลยให้คืน `None`
    starter: |
      def first_pair_product(nums, target):
          return None
    tests: |
      assert first_pair_product([2, 3, 4, 6], 12) == (0, 3), f"ควรได้ (0, 3) แต่ได้ {first_pair_product([2, 3, 4, 6], 12)}"
      assert first_pair_product([2, 3, 4, 6], 18) == (1, 3), f"ควรได้ (1, 3) แต่ได้ {first_pair_product([2, 3, 4, 6], 18)}"
      assert first_pair_product([1, 2], 5) is None, "ไม่มีคู่ที่คูณได้ 5 ต้องคืน None"
      assert first_pair_product([0, 7], 0) == (0, 1), f"0 × 7 = 0 ควรได้ (0, 1) แต่ได้ {first_pair_product([0, 7], 0)}"
      assert first_pair_product([], 1) is None, "ลิสต์ว่างต้องคืน None"
    reference: |
      def first_pair_product(nums, target):
          for i in range(len(nums)):
              for j in range(i + 1, len(nums)):
                  if nums[i] * nums[j] == target:
                      return (i, j)
          return None
    hints:
      - "วงนอกวนตาม i และวงในวนตาม j เริ่มที่ i + 1 เหมือนโจทย์นับคู่"
      - "เมื่อพบคู่แรกที่ตรงกับเงื่อนไข ให้ return ทันที ไม่ต้องรอให้วงวนจบ"
      - "ถ้าวงซ้อนจบทั้งหมดโดยไม่เคย return ให้ return None หลังวงวน"
    solution: "สแกนคู่ตามลำดับ (0,1), (0,2), (0,3), ... คู่ (0,3) ให้ 2 × 6 = 12 เป็นคู่แรกที่ตรง ส่วน target 18 คู่แรกคือ (1,3) เพราะ 3 × 6 = 18 เมื่อไม่มีคู่ตรงให้คืน None"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.control-flow.p019
    topics: [computer.programming.control-flow]
    difficulty: 3
    type: code
    stem: |
      เขียนฟังก์ชัน `letter_triangle(n)` ที่สร้างรูปสามเหลี่ยมตัวอักษร `n` บรรทัด แล้วคืนเป็นลิสต์ของสตริง บรรทัดที่ 1 มีตัว `A` หนึ่งตัว บรรทัดที่ 2 มี `AB` บรรทัดที่ 3 มี `ABC` ไปเรื่อย ๆ เช่น `letter_triangle(3)` ได้ `["A", "AB", "ABC"]` ถ้า `n` เป็น 0 ให้คืนลิสต์ว่าง

      ใช้วงวนซ้อน: วงนอกนับบรรทัด และวงในเติมตัวอักษรทีละตัว (ตัวอักษรถัดไปของ `"A"` หาได้จาก `chr(ord("A") + j)`)
    starter: |
      def letter_triangle(n):
          lines = []
          return lines
    tests: |
      assert letter_triangle(1) == ["A"], f"n = 1 ควรได้ ['A'] แต่ได้ {letter_triangle(1)}"
      assert letter_triangle(3) == ["A", "AB", "ABC"], f"n = 3 ควรได้ ['A', 'AB', 'ABC'] แต่ได้ {letter_triangle(3)}"
      assert letter_triangle(0) == [], f"n = 0 ต้องได้ลิสต์ว่าง แต่ได้ {letter_triangle(0)}"
      assert len(letter_triangle(5)) == 5, "n = 5 ต้องมี 5 บรรทัด"
      assert letter_triangle(5)[-1] == "ABCDE", f"บรรทัดสุดท้ายของ n = 5 ควรเป็น 'ABCDE' แต่ได้ {letter_triangle(5)[-1]!r}"
      assert all(len(line) == i + 1 for i, line in enumerate(letter_triangle(6))), "บรรทัดที่ i ต้องมีตัวอักษร i ตัว"
    reference: |
      def letter_triangle(n):
          lines = []
          for i in range(1, n + 1):
              line = ""
              for j in range(i):
                  line += chr(ord("A") + j)
              lines.append(line)
          return lines
    hints:
      - "วงนอกวนตาม i ตั้งแต่ 1 ถึง n แต่ละรอบสร้างหนึ่งบรรทัด"
      - "วงในวน i รอบ เติมตัวอักษร chr(ord('A') + j) ต่อท้ายสตริงของบรรทัดนั้น"
      - "เมื่อวงในจบ ให้ append สตริงของบรรทัดลงในลิสต์ แล้วเริ่มสตริงใหม่ในรอบถัดไป"
    solution: "วงนอกนับบรรทัด i = 1 ถึง n วงในวน j = 0 ถึง i − 1 แล้วเติม chr(ord('A') + j) จึงได้บรรทัดที่ i ยาว i ตัว เช่น i = 3 ได้ A, B, C รวมเป็น 'ABC' เมื่อ n = 0 วงนอกไม่ทำงานเลยจึงคืนลิสต์ว่าง"
    license: CC-BY-SA-4.0
    ai_assisted: true
