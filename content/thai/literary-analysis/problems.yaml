- id: thai.literature.literary-analysis.p017
  topics:
  - thai.literature.literary-analysis
  difficulty: 5
  type: order
  stem: เรียงประโยคให้เป็นย่อหน้าวิเคราะห์วรรณคดีที่ดี
  items:
  - ตอนพระเจดีย์ภูเขาทองชำรุด สุนทรภู่สื่อแนวคิดเรื่องความไม่เที่ยง
  - ดังที่ว่า "กระนี้หรือชื่อเสียงเกียรติยศ · จะมิหมดล่วงหน้าทันตาเห็น"
  - กวีเชื่อมพระเจดีย์ที่ผู้สร้างตั้งใจให้ยั่งยืนแต่กลับร้าวพัง กับชื่อเสียงของคนที่ไม่จีรัง
  - ข้อคิดนี้ใช้ได้กับปัจจุบัน คือไม่ควรยึดติดกับชื่อเสียงและสิ่งที่ได้มา
  hints:
  - เริ่มด้วยข้อสรุปของย่อหน้า แล้วยกตัวบท
  - อธิบายตัวบทก่อนบอกคุณค่าที่นำไปใช้
  solution: ข้อสรุป → ยกตัวบท → อธิบายตัวบท → คุณค่าและการนำไปใช้
