      - { id: c, text: "15-15-15", feedback: "สูตรเสมอใช้บำรุงทั่วไป แต่มีโพแทสเซียมน้อยกว่าอีกสูตรหนึ่งในภาพ" }
      - { id: d, text: "ไม่ต้องใส่ปุ๋ย ผลจะหวานเองเมื่อแก่", feedback: "อาการขอบใบไหม้บอกว่าต้นขาดธาตุอาหาร ควรเติมให้" }
    hints:
