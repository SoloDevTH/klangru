<text x="20.0" y="30.0" text-anchor="start" fill="#15211e" font-size="13">ตอนตก (ลูกศรแนวนอน): ผ่านอากาศยาวมาก</text>
<text x="20.0" y="50.0" text-anchor="start" fill="#777" font-size="12">สีน้ำเงินถูกกระเจิงออกหมด เหลือสีแดงส้ม</text>
<line x1="60.0" y1="152.0" x2="50.5" y2="126.6" stroke="#1f5fa8" stroke-width="1.5"/>
<polygon points="48.0,120.0 47.2,127.8 53.7,125.3" fill="#1f5fa8" stroke="#1f5fa8" stroke-width="1" stroke-linejoin="round"/>
<line x1="120.0" y1="152.0" x2="110.5" y2="126.6" stroke="#1f5fa8" stroke-width="1.5"/>
<polygon points="108.0,120.0 107.2,127.8 113.7,125.3" fill="#1f5fa8" stroke="#1f5fa8" stroke-width="1" stroke-linejoin="round"/>
<line x1="180.0" y1="152.0" x2="170.5" y2="126.6" stroke="#1f5fa8" stroke-width="1.5"/>
<polygon points="168.0,120.0 167.2,127.8 173.7,125.3" fill="#1f5fa8" stroke="#1f5fa8" stroke-width="1" stroke-linejoin="round"/>
<line x1="240.0" y1="152.0" x2="230.5" y2="126.6" stroke="#1f5fa8" stroke-width="1.5"/>
<polygon points="228.0,120.0 227.2,127.8 233.7,125.3" fill="#1f5fa8" stroke="#1f5fa8" stroke-width="1" stroke-linejoin="round"/>
<text x="150.0" y="110.0" text-anchor="middle" fill="#1f5fa8" font-size="12">สีน้ำเงินกระเจิงออก</text>
