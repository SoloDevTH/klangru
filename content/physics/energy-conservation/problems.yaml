    solution: 'พลังงานต้น $= mgh = (2)(9.8)(1.5) = 29.4\ \mathrm{J}$ ซึ่งเป็นพลังงานจลน์ที่ก้นราง บนพื้นขรุขระ $fd = 29.4\ \mathrm{J}$ ได้ $d = \dfrac{29.4\ \mathrm{J}}{6\ \mathrm{N}} = 4.9\ \mathrm{m}$'
