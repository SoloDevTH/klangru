problems:
  - id: business.stats.forecasting.p001
    topics: [business.stats.forecasting]
    difficulty: 1
    type: mcq
    stem: "ร้านขายเครื่องดื่มเย็นมียอดขายสูงทุกเดือนเมษายนเกือบทุกปี รูปแบบนี้เป็นส่วนประกอบใดของอนุกรมเวลา"
    choices:
      - { id: a, text: "ฤดูกาล", correct: true }
      - { id: b, text: "แนวโน้ม", feedback: "แนวโน้มคือทิศทางระยะยาวหลายปี ไม่ใช่การขึ้นลงซ้ำทุกปี" }
      - { id: c, text: "ความผันแปรไม่ปกติ", feedback: "ความผันแปรไม่ปกติเกิดแบบสุ่ม ไม่ซ้ำทุกปี" }
      - { id: d, text: "วัฏจักร", feedback: "วัฏจักรเป็นการขึ้นลงตามภาวะเศรษฐกิจในช่วงหลายปี ไม่ได้ผูกกับเดือนใดเดือนหนึ่ง" }
    hints:
      - "รูปแบบนี้ซ้ำทุกปีหรือไม่"
      - "ส่วนประกอบใดเกิดซ้ำตามช่วงเวลาของปี"
    solution: "รูปแบบที่ซ้ำในช่วงเดียวกันทุกปีคือ **ฤดูกาล** (หน้าร้อนและสงกรานต์)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.stats.forecasting.p002
    topics: [business.stats.forecasting]
    difficulty: 1
    type: match
    stem: "จับคู่เหตุการณ์กับส่วนประกอบของอนุกรมเวลา"
    pairs:
      - { left: "ยอดขายออนไลน์ของร้านเพิ่มขึ้นต่อเนื่องตลอด 5 ปี", right: "แนวโน้ม" }
      - { left: "ร้านเสื้อนักเรียนขายดีทุกเดือนพฤษภาคมก่อนเปิดเทอม", right: "ฤดูกาล" }
      - { left: "น้ำท่วมถนนหน้าร้านหนึ่งสัปดาห์จนลูกค้าเข้าไม่ได้", right: "ความผันแปรไม่ปกติ" }
    hints:
      - "แนวโน้มคือทิศทางระยะยาว ฤดูกาลซ้ำทุกปี"
      - "ความผันแปรไม่ปกติเกิดแบบคาดไม่ได้"
    solution: "ยอดขายออนไลน์เพิ่มต่อเนื่อง 5 ปี → แนวโน้ม · ร้านเสื้อนักเรียนขายดีทุกเดือนพฤษภาคม → ฤดูกาล · น้ำท่วมถนนหน้าร้านหนึ่งสัปดาห์ → ความผันแปรไม่ปกติ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.stats.forecasting.p003
    topics: [business.stats.forecasting]
    difficulty: 2
    type: numeric
    stem: "ยอดขายสามเดือนล่าสุดของร้านชา (พันบาท) คือ $60,\\ 66,\\ 70$ ใช้ค่าเฉลี่ยเคลื่อนที่ 3 เดือนพยากรณ์ยอดขายเดือนหน้า ได้กี่พันบาท (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 65.33, tolerance: 0.01, unit: "พันบาท" }
    hints:
      - "รวมสามเดือนล่าสุด"
      - "หารด้วย $3$"
    misconceptions:
      - { match: 98, feedback: "หารด้วย $2$ ต้องหารด้วยจำนวนเดือน $3$" }
      - { match: 196, feedback: "นั่นคือผลรวม ยังไม่ได้หาร" }
    solution: "$\\dfrac{60 + 66 + 70}{3} = \\dfrac{196}{3} \\approx 65.33$ พันบาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.stats.forecasting.p004
    topics: [business.stats.forecasting]
    difficulty: 2
    type: mcq
    stem: "จากกราฟในภาพ เดือนใดมีจำนวนห้องพักที่ขายได้ **เพิ่มขึ้นจากเดือนก่อนมากที่สุด**"
    figure:
      src: hotel-line.svg
      alt: "กราฟเส้นจำนวนห้องพักที่ขายได้รายเดือนของโรงแรมในเชียงราย ปี 2568 (สมมติ) หน่วยร้อยห้อง-คืน แกนตั้ง 30 ถึง 70 มีเส้นตารางทุก 5 ค่ารายเดือนคือ ม.ค. 40 ก.พ. 38 มี.ค. 45 เม.ย. 52 พ.ค. 47 มิ.ย. 41 ก.ค. 36 ส.ค. 39 ก.ย. 44 ต.ค. 58 พ.ย. 62 ธ.ค. 65"
    choices:
      - { id: a, text: "ตุลาคม", correct: true }
      - { id: b, text: "ธันวาคม", feedback: "ธันวาคมมีค่าสูงสุด แต่เพิ่มจากพฤศจิกายนแค่ $3$" }
      - { id: c, text: "เมษายน", feedback: "เมษายนเพิ่ม $7$ (จาก $45$ เป็น $52$) น้อยกว่าตุลาคม" }
      - { id: d, text: "พฤศจิกายน", feedback: "พฤศจิกายนเพิ่มแค่ $4$" }
    hints:
      - "อ่านค่าแต่ละเดือนจากเส้นตาราง"
      - "หาผลต่างจากเดือนก่อนหน้าทีละเดือน ไม่ใช่หาเดือนที่ค่าสูงสุด"
    solution: "ผลต่างจากเดือนก่อน: มี.ค. $+7$ เม.ย. $+7$ ส.ค. $+3$ ก.ย. $+5$ ต.ค. $+14$ พ.ย. $+4$ ธ.ค. $+3$ ตุลาคมเพิ่มมากที่สุด ($44 \\to 58$ ร้อยห้อง-คืน) เมื่อเข้าฤดูท่องเที่ยว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.stats.forecasting.p005
    topics: [business.stats.forecasting]
    difficulty: 2
    type: numeric
    stem: "ยอดขายสามเดือนล่าสุด (พันบาท) คือ $60,\\ 66,\\ 70$ (เดือนล่าสุดคือ $70$) ถ้าใช้ค่าเฉลี่ยเคลื่อนที่ถ่วงน้ำหนัก $3, 2, 1$ โดยให้น้ำหนัก $3$ กับเดือนล่าสุด ค่าพยากรณ์เป็นกี่พันบาท"
    answer: { value: 67, tolerance: 0.01, unit: "พันบาท" }
    hints:
      - "คูณแต่ละเดือนด้วยน้ำหนัก: เดือนล่าสุด $\\times 3$"
      - "หารด้วยผลรวมน้ำหนัก $3 + 2 + 1 = 6$"
    misconceptions:
      - { match: 63.67, feedback: "ให้น้ำหนัก $3$ กับเดือนเก่าสุด ($60$) ต้องให้เดือนล่าสุด" }
      - { match: 134, feedback: "หารด้วย $3$ (จำนวนเดือน) ต้องหารด้วยผลรวมน้ำหนัก $6$" }
    solution: "$\\dfrac{3(70) + 2(66) + 1(60)}{6} = \\dfrac{402}{6} = 67$ พันบาท สูงกว่าค่าเฉลี่ยธรรมดา ($65.33$) เพราะให้เดือนล่าสุดซึ่งสูงที่สุดมีน้ำหนักมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.stats.forecasting.p006
    topics: [business.stats.forecasting]
    difficulty: 3
    type: numeric
    stem: "เส้นแนวโน้มยอดขายของร้านชาคือ $\\hat{y} = 48.47 + 3.49t$ (พันบาท) โดย $t = 1$ คือเดือนแรกของข้อมูล ข้อมูลมี 6 เดือน ยอดขายที่พยากรณ์ของ **เดือนที่ 8** เป็นกี่พันบาท (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 76.39, tolerance: 0.05, unit: "พันบาท" }
    hints:
      - "แทน $t = 8$"
      - "$3.49 \\times 8$ แล้วบวก $48.47$"
    misconceptions:
      - { match: 55.45, feedback: "แทน $t = 2$ (นับสองเดือนหลังข้อมูล) แต่ $t$ คือลำดับเดือนนับจากเดือนแรก เดือนที่ 8 คือ $t = 8$" }
      - { match: 72.9, feedback: "นั่นคือเดือนที่ 7" }
    solution: "$\\hat{y} = 48.47 + 3.49(8) = 48.47 + 27.92 = 76.39$ พันบาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.stats.forecasting.p007
    topics: [business.stats.forecasting]
    difficulty: 3
    type: mcq
    stem: "ร้านค้าพบว่างบโฆษณารายเดือนกับยอดขายมีสัมประสิทธิ์สหสัมพันธ์ $r = 0.85$ ข้อใดสรุปได้ **สมเหตุสมผลที่สุด**"
    choices:
      - { id: a, text: "สัมพันธ์เชิงบวกค่อนข้างแรง แต่ยังสรุปไม่ได้ว่าโฆษณาเป็นสาเหตุให้ยอดขายเพิ่ม", correct: true }
      - { id: b, text: "โฆษณาทำให้ยอดขายเพิ่มขึ้นแน่นอน", feedback: "สหสัมพันธ์ไม่ใช่เหตุและผล อาจมีตัวแปรอื่นที่ทำให้ทั้งสองเพิ่มพร้อมกัน" }
      - { id: c, text: "ยอดขาย $85\\%$ มาจากโฆษณา", feedback: "$r$ ไม่ได้บอกสัดส่วนของยอดขาย" }
      - { id: d, text: "ทั้งสองแทบไม่สัมพันธ์กัน", feedback: "$0.85$ ใกล้ $1$ จึงสัมพันธ์ค่อนข้างแรง" }
    hints:
      - "$r$ บอกทิศทางและความแรงของความสัมพันธ์เชิงเส้น"
      - "สหสัมพันธ์พิสูจน์เหตุและผลได้หรือไม่"
    solution: "$r = 0.85$ คือสัมพันธ์เชิงบวกค่อนข้างแรง เดือนที่โฆษณามากมักขายได้มาก แต่ยังสรุปไม่ได้ว่าโฆษณาเป็นสาเหตุ อาจมีตัวแปรอื่น เช่น เทศกาล ที่ทำให้ทั้งสองเพิ่มพร้อมกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.stats.forecasting.p008
    topics: [business.stats.forecasting]
    difficulty: 3
    type: numeric
    stem: "ร้านพยากรณ์ยอดขาย 4 สัปดาห์ได้ $125,\\ 130,\\ 132,\\ 133$ แก้ว แต่ขายจริง $120,\\ 135,\\ 128,\\ 140$ แก้ว ค่าเฉลี่ยความคลาดเคลื่อนสัมบูรณ์ (MAD) เป็นกี่แก้ว (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 5.25, tolerance: 0.01, unit: "แก้ว" }
    hints:
      - "หา $|\\text{จริง} - \\text{พยากรณ์}|$ ทีละสัปดาห์"
      - "เฉลี่ยค่าสัมบูรณ์ทั้งสี่ค่า"
    misconceptions:
      - { match: 3.25, feedback: "ไม่ได้ใส่ค่าสัมบูรณ์ ความคลาดเคลื่อน $-5, +5, -4, +7$ จึงหักล้างกัน" }
      - { match: 21, feedback: "นั่นคือผลรวม ยังไม่ได้หารด้วย $4$" }
    solution: "ความคลาดเคลื่อนสัมบูรณ์ $= 5, 5, 4, 7$ MAD $= \\dfrac{5 + 5 + 4 + 7}{4} = \\dfrac{21}{4} = 5.25$ แก้ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.stats.forecasting.p009
    topics: [business.stats.forecasting]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการพยากรณ์ยอดขายอย่างเป็นระบบ"
    items:
      - "กำหนดสิ่งที่จะพยากรณ์และช่วงเวลา"
      - "เก็บข้อมูลย้อนหลังและวาดกราฟเส้น"
      - "เลือกวิธีให้เหมาะกับรูปแบบของข้อมูล"
      - "คำนวณค่าพยากรณ์"
      - "วัดความคลาดเคลื่อนเมื่อได้ค่าจริง"
      - "ปรับวิธีหรือค่าพยากรณ์เมื่อมีข้อมูลใหม่"
    hints:
      - "ต้องรู้ว่าจะพยากรณ์อะไรและดูข้อมูลก่อนเลือกวิธี"
      - "หลังได้ยอดจริงต้องวัดความคลาดเคลื่อน"
    solution: "กำหนดสิ่งที่จะพยากรณ์และช่วงเวลา → เก็บข้อมูลและวาดกราฟเส้น → เลือกวิธีตามรูปแบบข้อมูล → คำนวณค่าพยากรณ์ → เทียบกับค่าจริงด้วย MAD หรือ MAPE → ปรับวิธีหรือค่าพยากรณ์เมื่อมีข้อมูลใหม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.stats.forecasting.p010
    topics: [business.stats.forecasting]
    difficulty: 4
    type: numeric
    stem: "ยอดขายห้าไตรมาสของร้านขายอุปกรณ์การเกษตร (แสนบาท สมมติ) คือ $20,\\ 24,\\ 23,\\ 28,\\ 30$ ให้ $t = 1, 2, 3, 4, 5$ หาเส้นแนวโน้มกำลังสองน้อยสุด แล้วพยากรณ์ไตรมาสที่ $6$ (ตอบเป็นแสนบาท ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 32.2, tolerance: 0.05, unit: "แสนบาท" }
    hints:
      - "$\\bar{t} = 3$, $\\bar{y} = 25$ หา $\\sum (t - \\bar{t})(y - \\bar{y})$ และ $\\sum (t - \\bar{t})^2$"
      - "$b = \\dfrac{\\sum (t - \\bar{t})(y - \\bar{y})}{\\sum (t - \\bar{t})^2}$, $a = \\bar{y} - b\\bar{t}$ แล้วแทน $t = 6$"
    misconceptions:
      - { match: 25, feedback: "ใช้ค่าเฉลี่ยของทุกไตรมาส ซึ่งไม่สะท้อนแนวโน้มขาขึ้น" }
      - { match: 29.8, feedback: "แทน $t = 5$ ซึ่งเป็นไตรมาสสุดท้ายของข้อมูล ไตรมาสถัดไปคือ $t = 6$" }
    solution: "$\\sum (t - \\bar{t})(y - \\bar{y}) = (-2)(-5) + (-1)(-1) + 0 + (1)(3) + (2)(5) = 24$ และ $\\sum (t - \\bar{t})^2 = 10$ ได้ $b = 2.4$, $a = 25 - 2.4(3) = 17.8$ พยากรณ์ $\\hat{y} = 17.8 + 2.4(6) = 32.2$ แสนบาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.stats.forecasting.p011
    topics: [business.stats.forecasting]
    difficulty: 4
    type: numeric
    stem: "ค่าพยากรณ์ตามแนวโน้มของยอดขายไตรมาส 2 ปีหน้าคือ $120$ พันบาท และดัชนีฤดูกาลของไตรมาส 2 คือ $1.30$ ค่าพยากรณ์ที่ปรับฤดูกาลแล้วเป็นกี่พันบาท"
    answer: { value: 156, tolerance: 0.01, unit: "พันบาท" }
    hints:
      - "ดัชนี $1.30$ แปลว่าไตรมาสนี้สูงกว่าค่าเฉลี่ย $30\\%$"
      - "คูณค่าตามแนวโน้มด้วยดัชนี"
    misconceptions:
      - { match: 92.31, feedback: "หารด้วยดัชนี การหารใช้ตอนขจัดฤดูกาลออกจากค่าจริง ส่วนการพยากรณ์ต้องคูณ" }
      - { match: 121.3, feedback: "บวกดัชนีเข้าไปตรง ๆ ต้องคูณ" }
    solution: "พยากรณ์ $= 120 \\times 1.30 = 156$ พันบาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.stats.forecasting.p012
    topics: [business.stats.forecasting]
    difficulty: 4
    type: numeric
    stem: "จากข้อมูลเดียวกับที่ร้านพยากรณ์ยอดขายได้ $125,\\ 130,\\ 132,\\ 133$ แก้ว แต่ขายจริง $120,\\ 135,\\ 128,\\ 140$ แก้ว ค่า MAPE เป็นกี่เปอร์เซ็นต์ (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 4, tolerance: 0.05, unit: "%" }
    hints:
      - "หา $\\dfrac{|\\text{จริง} - \\text{พยากรณ์}|}{\\text{จริง}}$ ทีละสัปดาห์"
      - "เฉลี่ยแล้วคูณ $100$"
    misconceptions:
      - { match: 0.04, feedback: "ลืมคูณ $100$ โจทย์ให้ตอบเป็นเปอร์เซ็นต์" }
      - { match: 16, feedback: "ลืมหารด้วยจำนวนสัปดาห์ $4$" }
    solution: "$\\dfrac{5}{120} + \\dfrac{5}{135} + \\dfrac{4}{128} + \\dfrac{7}{140} \\approx 0.0417 + 0.0370 + 0.0313 + 0.0500 = 0.1600$ เฉลี่ย $\\approx 0.0400$ MAPE $\\approx 4.00\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.stats.forecasting.p013
    topics: [business.stats.forecasting]
    difficulty: 4
    type: mcq
    stem: "สถานการณ์ใดทำให้การพยากรณ์ด้วยเส้นแนวโน้มจากข้อมูลในอดีต **น่าเชื่อถือน้อยลง** (เลือกได้มากกว่าหนึ่งข้อ)"
    multiple: true
    choices:
      - { id: a, text: "มีห้างใหญ่เปิดใหม่ข้างร้าน", correct: true }
      - { id: b, text: "ใช้ข้อมูล 6 เดือนพยากรณ์ยอดขายอีก 3 ปีข้างหน้า", correct: true }
      - { id: c, text: "มีข้อมูลแค่ 4 เดือน และเดือนหนึ่งมีงานเทศกาลใหญ่", correct: true }
      - { id: d, text: "มีข้อมูลรายเดือนครบ 5 ปีในสภาพตลาดที่ค่อนข้างคงที่", feedback: "ข้อมูลยาวและตลาดคงที่ทำให้การพยากรณ์น่าเชื่อถือขึ้น" }
    hints:
      - "เส้นแนวโน้มสมมติว่ารูปแบบเดิมจะเกิดต่อ"
      - "อะไรทำให้รูปแบบเดิมเปลี่ยน"
    solution: "ข้อ ก ข และ ค ทำให้รูปแบบในอดีตไม่ใช้กับอนาคต (สถานการณ์เปลี่ยน พยากรณ์ไกลเกินช่วงข้อมูล ข้อมูลน้อยและมีค่าผิดปกติ) ข้อ ง ทำให้ข้อมูลมีคุณภาพดีขึ้น"
