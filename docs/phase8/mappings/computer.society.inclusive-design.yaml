topic: computer.society.inclusive-design
rows:
  - { framework: csta-k12-cs, indicators: ["1B-IC-19", "1B-IC-20", "2-CS-01", "2-IC-21"], coverage: full, note: "ระดมความคิดปรับปรุงการเข้าถึงได้และการใช้งาน การหามุมมองจากผู้ใช้ที่หลากหลาย การสังเกตคุณตาใช้รีโมตและวิเคราะห์ตู้กดบัตรคิวแล้วเสนอการปรับปรุง และอคติกับความเหลื่อมล้ำในเทคโนโลยีที่มีอยู่" }
  - { framework: csta-k12-cs, indicators: ["3A-AP-21", "3A-IC-25"], coverage: partial, note: "ประเมินและเสนอการปรับปรุงชิ้นงานที่ให้มา (ความต่างของสี ป้ายชื่อช่องกรอก ข้อความแทนภาพ) และวิเคราะห์ผลทดสอบแยกตามกลุ่มเพื่อลดอคติ แต่ผู้เรียนไม่ได้ทดสอบและแก้ชิ้นงานของตนเองกับผู้ใช้จริงในแอป" }
  - { framework: acm-cs2023, indicators: ["HCI-Accessibility"], coverage: full, note: "ข้อจำกัดถาวร ชั่วคราว ตามสถานการณ์ หลัก WCAG สี่ข้อ อัตราส่วนความต่างของสี ข้อความแทนภาพ และเทคโนโลยีช่วยเหลือ" }
  - { framework: acm-cs2023, indicators: ["HCI-User"], coverage: partial, note: "การสังเกตผู้ใช้จริงและการทดสอบกับผู้ใช้หลากหลาย ส่วนการออกแบบที่ยึดผู้ใช้เป็นศูนย์กลางแบบเต็ม (user story ต้นแบบ การประเมิน) อยู่ใน computer.design.user-centred-design" }
  - { framework: acm-cs2023, indicators: ["SEP-DEIA"], coverage: partial, note: "อคติจากข้อมูลและทีมผู้สร้าง ความเสมอภาคในการเข้าถึง และการแยกผลตามกลุ่ม ยังไม่ได้กล่าวถึงความหลากหลายของบุคลากรในวงการคอมพิวเตอร์" }
