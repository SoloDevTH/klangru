id: health.environment.environment-health
subject: health
title: { th: "สิ่งแวดล้อมกับสุขภาพและความรับผิดชอบต่อส่วนรวม", en: "Environment, health and responsibility for community health" }
summary: มลพิษทางอากาศ ฝุ่น PM2.5 น้ำ ขยะ และเสียง มีผลต่อสุขภาพอย่างไร การอ่านดัชนีคุณภาพอากาศ การป้องกันตัวเองและแก้ที่ต้นเหตุ และพฤติกรรมที่รับผิดชอบต่อสุขภาพของส่วนรวม
difficulty: 2.5
minutes: 30
prerequisites: [health.disease.communicable]
encompasses:
  - { id: health.disease.communicable, weight: 0.15 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ดัชนีคุณภาพอากาศ 5 ระดับ
    src: aqi-scale.svg
    alt: "ตารางสีดัชนีคุณภาพอากาศของประเทศไทย 5 ระดับ สีฟ้า AQI 0–25 PM2.5 0–15 ดีมาก ทำกิจกรรมได้ตามปกติ สีเขียว AQI 26–50 PM2.5 15.1–25 ดี ทำกิจกรรมกลางแจ้งได้ กลุ่มเสี่ยงสังเกตอาการ สีเหลือง AQI 51–100 PM2.5 25.1–37.5 ปานกลาง ลดกิจกรรมกลางแจ้งที่ใช้แรงมาก สีส้ม AQI 101–200 PM2.5 37.6–75 เริ่มมีผลกระทบต่อสุขภาพ สวมหน้ากากกัน PM2.5 ลดเวลานอกอาคาร สีแดง AQI 201 ขึ้นไป PM2.5 75.1 ขึ้นไป มีผลกระทบต่อสุขภาพ งดกิจกรรมกลางแจ้ง ค่ามาตรฐาน PM2.5 เฉลี่ย 24 ชั่วโมงคือ 37.5 มคก./ลบ.ม. เท่ากับ AQI 100 ตั้งแต่ 1 มิถุนายน 2566"
    caption: "ค่าตามประกาศกรมควบคุมมลพิษ เรื่องดัชนีคุณภาพอากาศของประเทศไทย พ.ศ. 2566"
  - type: worked-example
    title: อ่านค่าฝุ่นแล้วตัดสินใจ
    problem: "เช้าวันศุกร์ แอปรายงานค่า PM2.5 เฉลี่ย 24 ชั่วโมงที่หน้าโรงเรียน 62 มคก./ลบ.ม. ครูพละวางแผนให้วิ่งรอบสนาม 20 นาที ควรทำอย่างไร"
    steps:
      - text: "เทียบ 62 กับช่วงในตาราง: 62 อยู่ในช่วง 37.6–75 จึงเป็นระดับสีส้ม"
      - text: "สีส้มหมายถึงเกินค่ามาตรฐาน 37.5 แล้ว และเริ่มมีผลกระทบต่อสุขภาพ"
        why: "การวิ่งทำให้หายใจเร็วและลึก จึงสูดฝุ่นเข้าปอดมากกว่าตอนนั่ง"
      - text: "ปรับแผน: ย้ายเป็นกิจกรรมในอาคาร หรือเลื่อนวิ่งไปวันที่ค่าฝุ่นลดลง"
      - text: "ถ้าต้องอยู่นอกอาคาร ให้สวมหน้ากากที่กันฝุ่นละเอียดได้ และให้นักเรียนที่เป็นหืดหรือภูมิแพ้อยู่ในห้อง สังเกตอาการไอ หายใจลำบาก"
    answer: "ระดับสีส้ม ควรย้ายกิจกรรมที่ใช้แรงมากเข้าในอาคาร และใช้หน้ากากกัน PM2.5 เมื่ออยู่นอกอาคาร"
  - { type: check, problem: health.environment.environment-health.p002, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: worked-example
    title: นับวันที่ฝุ่นเกินมาตรฐาน
    problem: "จากแผนภูมิค่า PM2.5 รายวัน 7 วัน (ข้อมูลสมมติ) มีกี่วันที่ค่าเกินมาตรฐาน และค่าเฉลี่ยทั้งสัปดาห์บอกเรื่องนี้ได้หรือไม่"
    figure:
      src: pm25-week.svg
      alt: "แผนภูมิแท่ง ค่า PM2.5 เฉลี่ยรายวันหน้าโรงเรียน 7 วัน ข้อมูลสมมติ หน่วย มคก./ลบ.ม. วันจันทร์ 28 อังคาร 35 พุธ 42 พฤหัสบดี 51 ศุกร์ 39 เสาร์ 33 อาทิตย์ 24"
    steps:
      - text: "ค่ามาตรฐานคือ 37.5 มคก./ลบ.ม. ไล่ดูทีละวัน: พุธ 42 พฤหัสบดี 51 ศุกร์ 39 เกินมาตรฐาน รวม 3 วัน"
      - text: "ค่าเฉลี่ยทั้งสัปดาห์: (28 + 35 + 42 + 51 + 39 + 33 + 24) ÷ 7 = 252 ÷ 7 = 36"
      - text: "ค่าเฉลี่ย 36 ต่ำกว่ามาตรฐาน แต่มี 3 วันที่เกิน"
        why: "ค่าเฉลี่ยเกลี่ยวันที่สูงกับวันที่ต่ำเข้าหากัน วันที่ฝุ่นสูงจึงถูกซ่อนไว้"
    answer: "เกินมาตรฐาน 3 วัน ค่าเฉลี่ย 36 จึงบอกไม่ได้ ต้องดูค่ารายวันเพื่อป้องกันตัวในวันที่ฝุ่นสูง"
  - { type: check, problem: health.environment.environment-health.p010 }
glossary:
  - { term: PM2.5, definition: "ฝุ่นละอองขนาดไม่เกิน 2.5 ไมโครเมตร เล็กจนเข้าไปลึกถึงปอดได้" }
  - { term: ดัชนีคุณภาพอากาศ (AQI), definition: "ตัวเลขและสีที่บอกคุณภาพอากาศ แบ่งเป็น 5 ระดับ ฟ้า เขียว เหลือง ส้ม แดง ค่า 100 เท่ากับค่ามาตรฐาน" }
  - { term: กลุ่มเสี่ยง, definition: "คนที่ได้รับผลจากมลพิษง่ายกว่าคนทั่วไป เช่น เด็ก ผู้สูงอายุ หญิงตั้งครรภ์ และผู้มีโรคประจำตัว" }
  - { term: ขยะอันตราย, definition: "ขยะที่มีสารพิษ ไวไฟ หรือกัดกร่อน เช่น ถ่านไฟฉาย กระป๋องสเปรย์ ทิ้งในถังสีแดง" }
  - { term: 3R, definition: "หลักลดขยะ ลดการใช้ (Reduce) ใช้ซ้ำ (Reuse) และนำกลับมาใช้ใหม่ (Recycle)" }
flashcards:
  - { front: "ค่ามาตรฐาน PM2.5 เฉลี่ย 24 ชั่วโมง", back: "ไม่เกิน 37.5 มคก./ลบ.ม. (ตั้งแต่ 1 มิ.ย. 2566)" }
  - { front: "AQI สีส้ม ควรทำอย่างไร", back: "สวมหน้ากากกัน PM2.5 เมื่อออกนอกอาคาร ลดกิจกรรมกลางแจ้งที่ใช้แรงมาก" }
  - { front: "ถังขยะ 4 สี", back: "เขียว อินทรีย์ / เหลือง รีไซเคิล / น้ำเงิน ทั่วไป / แดง อันตราย" }
  - { front: "แก้ฝุ่นที่ต้นเหตุ", back: "ไม่เผาขยะหรือใบไม้ ดับเครื่องยนต์เมื่อจอด ใช้รถสาธารณะ ปลูกต้นไม้" }
