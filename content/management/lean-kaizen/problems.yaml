problems:
  - id: mgt.lean.p001
    topics: [management.operations.lean]
    difficulty: 1
    type: match
    stem: "จับคู่สถานการณ์กับประเภทของความสูญเปล่า"
    pairs:
      - { left: "ร้านข้าวมันไก่ต้มไก่เกินยอดขายจนเหลือทิ้งทุกวัน", right: "ผลิตมากเกินไป" }
      - { left: "โกดังมีกล่องบรรจุภัณฑ์กองไว้ใช้ได้อีก 8 เดือน", right: "สินค้าคงคลังเกิน" }
      - { left: "รถยกขนชิ้นงานไปพักที่อาคารอื่นแล้วขนกลับมาประกอบ", right: "การขนส่ง" }
      - { left: "ช่างต้องก้มเอื้อมหยิบเครื่องมือจากชั้นล่างสุดทุกครั้ง", right: "การเคลื่อนไหว" }
      - { left: "ผู้ป่วยนั่งรอผลเลือดก่อนพบแพทย์ 1 ชั่วโมง", right: "การรอคอย" }
      - { left: "เจ้าหน้าที่พิมพ์ข้อมูลชุดเดียวกันลงสามระบบ", right: "กระบวนการเกินจำเป็น" }
      - { left: "เสื้อเย็บตะเข็บเบี้ยวต้องเลาะแล้วเย็บใหม่", right: "ของเสีย" }
    hints:
      - "การขนส่งคือการย้าย 'ของ' ส่วนการเคลื่อนไหวคือการขยับตัวของ 'คน' ขณะทำงาน"
      - "ผลิตมากเกินคือทำของออกมามากกว่าที่ลูกค้าต้องการ ส่วนสินค้าคงคลังคือของที่กองรอใช้"
    solution: "ไก่เหลือทิ้ง = ผลิตมากเกิน · กล่องกองในโกดัง = สินค้าคงคลัง · ขนชิ้นงานไปกลับ = การขนส่ง · ก้มเอื้อมหยิบเครื่องมือ = การเคลื่อนไหว · ผู้ป่วยรอผล = การรอคอย · พิมพ์ซ้ำสามระบบ = กระบวนการเกินจำเป็น · เย็บใหม่ = ของเสีย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.lean.p002
    topics: [management.operations.lean]
    difficulty: 1
    type: mcq
    stem: "สำนักงานเขตเริ่มทำ 5ส โดยให้ทุกคนแยกเอกสารและอุปกรณ์ที่ไม่ได้ใช้เกิน 1 ปีออกจากโต๊ะทำงานแล้วนำไปทิ้งหรือส่งคืน ขั้นนี้คือ ส ใด"
    choices:
      - { id: a, text: "สะสาง", correct: true }
      - { id: b, text: "สะดวก", feedback: "สะดวกคือการจัดวางของที่จำเป็นให้หยิบง่ายและมีป้าย ซึ่งทำหลังจากแยกของไม่จำเป็นออกแล้ว" }
      - { id: c, text: "สะอาด", feedback: "สะอาดคือการทำความสะอาดและตรวจสิ่งผิดปกติ ไม่ใช่การแยกของจำเป็นกับไม่จำเป็น" }
      - { id: d, text: "สร้างนิสัย", feedback: "สร้างนิสัยเป็นขั้นสุดท้าย คือทำ 5ส จนเป็นนิสัย ไม่ใช่การคัดแยกครั้งแรก" }
    hints:
      - "ขั้นนี้ทำอะไรกับของที่ไม่จำเป็น"
      - "ส แรกของ 5ส คือการแยกและเอาของไม่จำเป็นออก"
    solution: "การแยกของจำเป็นกับไม่จำเป็นแล้วเอาของไม่จำเป็นออกคือ **สะสาง** ซึ่งเป็น ส แรกของ 5ส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.lean.p003
    topics: [management.operations.lean]
    difficulty: 1
    type: order
    stem: "เรียงขั้นของ 5ส ตามลำดับที่ถูกต้อง"
    items:
      - "สะสาง: แยกและเอาของไม่จำเป็นออก"
      - "สะดวก: จัดที่วางและติดป้ายให้หยิบง่าย"
      - "สะอาด: ทำความสะอาดพร้อมตรวจหาสิ่งผิดปกติ"
      - "สุขลักษณะ: รักษามาตรฐานสามข้อแรกให้คงอยู่"
      - "สร้างนิสัย: ทุกคนทำจนเป็นนิสัย"
    hints:
      - "ต้องเอาของไม่จำเป็นออกก่อน จึงจัดที่วางของที่เหลือได้"
      - "สองขั้นสุดท้ายเป็นการรักษาสิ่งที่ทำไว้ให้ยั่งยืน"
    solution: "สะสาง → สะดวก → สะอาด → สุขลักษณะ → สร้างนิสัย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.lean.p004
    topics: [management.operations.lean]
    difficulty: 2
    type: numeric
    stem: "โรงงานประกอบรีโมตทำงานกะละ 8 ชั่วโมง พัก 30 นาที ลูกค้าต้องการรีโมตกะละ 900 ชิ้น เวลาแท็กต์เป็นกี่วินาทีต่อชิ้น (ตอบเป็นตัวเลขในหน่วยวินาที)"
    answer: { value: 30, unit: วินาที }
    hints:
      - "หักเวลาพักออกจากเวลากะก่อน แล้วแปลงเป็นวินาที"
      - "เวลาแท็กต์ = เวลาที่ใช้ได้จริง ÷ ความต้องการ"
    misconceptions:
      - { match: 32, feedback: "ดูเหมือนใช้เวลาเต็ม 8 ชั่วโมงโดยไม่หักเวลาพัก 30 นาที" }
      - { match: 0.5, feedback: "นั่นคือคำตอบในหน่วยนาที โจทย์ถามเป็นวินาที" }
    solution: "เวลาที่ใช้ได้ $= 8 \\times 60 - 30 = 450$ นาที $= 27{,}000$ วินาที เวลาแท็กต์ $= 27{,}000 \\div 900 = 30$ วินาทีต่อชิ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.lean.p005
    topics: [management.operations.lean]
    difficulty: 2
    type: numeric
    stem: "พนักงาน 6 คนทำงานคนละ 8 ชั่วโมง บรรจุลำไยอบแห้งได้ 1,200 ถุง ผลิตภาพแรงงานเป็นกี่ถุงต่อชั่วโมงแรงงาน (ตอบเป็นตัวเลข)"
    answer: { value: 25, unit: ถุงต่อชั่วโมงแรงงาน }
    hints:
      - "ชั่วโมงแรงงาน = จำนวนคน × จำนวนชั่วโมงที่แต่ละคนทำงาน"
      - "ผลิตภาพแรงงาน = ผลผลิต ÷ ชั่วโมงแรงงาน"
    misconceptions:
      - { match: 200, feedback: "นั่นคือจำนวนถุงต่อคนต่อวัน ($1{,}200 \\div 6$) ต้องหารด้วยชั่วโมงแรงงานทั้งหมด" }
      - { match: 150, feedback: "นั่นคือจำนวนถุงต่อชั่วโมงของทั้งทีม ($1{,}200 \\div 8$) ยังไม่ได้หารด้วยจำนวนคน" }
    solution: "ชั่วโมงแรงงาน $= 6 \\times 8 = 48$ ชั่วโมง ผลิตภาพแรงงาน $= 1{,}200 \\div 48 = 25$ ถุงต่อชั่วโมงแรงงาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.lean.p006
    topics: [management.operations.lean]
    difficulty: 2
    type: mcq
    stem: "ร้านขนมปังอบขนมปังไส้สังขยาวันละ 300 ชิ้น \"เผื่อไว้ก่อน\" ทั้งที่ขายได้เฉลี่ยวันละ 220 ชิ้น ที่เหลือต้องทิ้งตอนเย็น ความสูญเปล่าหลักคือข้อใด"
    choices:
      - { id: a, text: "ผลิตมากเกินไป", correct: true }
      - { id: b, text: "ของเสีย", feedback: "ขนมปังไม่ได้ทำผิดสเปก ต้นเหตุคือทำมากกว่าความต้องการ ซึ่งทำให้เหลือทิ้ง" }
      - { id: c, text: "การรอคอย", feedback: "ไม่มีใครหรือเครื่องใดรออยู่ ปัญหาคือปริมาณที่ผลิตเกินยอดขาย" }
      - { id: d, text: "การเคลื่อนไหว", feedback: "การเคลื่อนไหวคือการขยับตัวที่ไม่จำเป็นของคนทำงาน ไม่เกี่ยวกับสถานการณ์นี้" }
    hints:
      - "เทียบจำนวนที่ผลิตกับจำนวนที่ลูกค้าต้องการ"
      - "ความสูญเปล่าข้อใดเรียกว่า 'แม่ของความสูญเปล่า' เพราะทำให้เกิดสินค้าคงคลังและของทิ้งตามมา"
    solution: "อบ 300 ชิ้นแต่ขายได้ 220 ชิ้น คือการ **ผลิตมากเกินไป** ซึ่งก่อความสูญเปล่าอื่นตามมา ทั้งวัตถุดิบ แรงงาน และพลังงานที่ใช้ทำขนมที่ต้องทิ้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.lean.p007
    topics: [management.operations.lean]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นลักษณะของไคเซ็นมากที่สุด"
    choices:
      - { id: a, text: "พนักงานหน้างานเสนอและทดลองปรับปรุงเล็ก ๆ อย่างสม่ำเสมอ เช่น ย้ายที่วางเครื่องมือให้หยิบง่ายขึ้น", correct: true }
      - { id: b, text: "ผู้บริหารซื้อเครื่องจักรใหม่ทั้งสายการผลิตครั้งเดียวด้วยงบหลายสิบล้านบาท", feedback: "นั่นคือการเปลี่ยนแปลงครั้งใหญ่ (นวัตกรรมหรือการลงทุน) ไคเซ็นเน้นการปรับปรุงเล็ก ๆ ต่อเนื่องโดยทุกคน" }
      - { id: c, text: "จ้างที่ปรึกษามาเขียนรายงานปีละครั้ง โดยพนักงานไม่ต้องมีส่วนร่วม", feedback: "ไคเซ็นให้ทุกคนมีส่วนร่วม โดยเฉพาะคนหน้างานที่รู้ปัญหาดีที่สุด" }
      - { id: d, text: "ปรับปรุงเฉพาะเมื่อมีลูกค้าร้องเรียนรุนแรง", feedback: "ไคเซ็นเป็นการปรับปรุงต่อเนื่องเป็นประจำ ไม่รอให้มีปัญหาใหญ่ก่อน" }
    hints:
      - "ไคเซ็นแปลว่า 'เปลี่ยนให้ดีขึ้น' เน้นขนาดของการเปลี่ยนแบบใด"
      - "ใครเป็นผู้มีส่วนร่วมในไคเซ็น"
    solution: "ไคเซ็นคือการปรับปรุงทีละน้อย ต่อเนื่อง ใช้งบน้อย และให้ทุกคนโดยเฉพาะคนหน้างานมีส่วนร่วม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.lean.p008
    topics: [management.operations.lean]
    difficulty: 3
    type: numeric
    stem: "ทีมบรรจุลำไยอบแห้งเดิมมี 6 คน ทำงานคนละ 8 ชั่วโมง ได้ 1,200 ถุง (25 ถุงต่อชั่วโมงแรงงาน) หลังทำไคเซ็นจัดโต๊ะใหม่ ทีม 6 คนทำงานคนละ 7.5 ชั่วโมงได้ 1,260 ถุง ผลิตภาพแรงงานเพิ่มขึ้นร้อยละเท่าใด (ตอบเป็นตัวเลขในหน่วย %)"
    answer: { value: 12, tolerance: 0.1, unit: "%" }
    hints:
      - "หาผลิตภาพแรงงานหลังปรับปรุงก่อน (ชั่วโมงแรงงานใหม่ = 6 × 7.5)"
      - "ร้อยละที่เพิ่ม = (ใหม่ − เดิม) ÷ เดิม × 100"
    misconceptions:
      - { match: 5, feedback: "นั่นคือร้อยละที่ผลผลิตเพิ่ม ($1{,}260$ เทียบ $1{,}200$) แต่ชั่วโมงแรงงานก็ลดลงด้วย ต้องเทียบผลิตภาพ" }
      - { match: 3, feedback: "นั่นคือผลต่างของผลิตภาพเป็นถุงต่อชั่วโมงแรงงาน ($28 - 25$) ยังไม่ได้แปลงเป็นร้อยละ" }
    solution: "ชั่วโมงแรงงานใหม่ $= 6 \\times 7.5 = 45$ ผลิตภาพใหม่ $= 1{,}260 \\div 45 = 28$ ถุงต่อชั่วโมงแรงงาน เพิ่มขึ้น $\\dfrac{28 - 25}{25} \\times 100 = 12\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.lean.p009
    topics: [management.operations.lean]
    difficulty: 3
    type: numeric
    stem: "ห้องจ่ายยาผู้ป่วยนอกของโรงพยาบาลเปิด 08:30–16:30 น. ปิดพักเที่ยง 1 ชั่วโมง วันหนึ่งมีใบสั่งยาเฉลี่ย 630 ใบ เวลาแท็กต์ของห้องจ่ายยาเป็นกี่วินาทีต่อใบ (ตอบเป็นตัวเลขในหน่วยวินาที)"
    answer: { value: 40, unit: วินาที }
    hints:
      - "เวลาเปิดทำการ 08:30–16:30 คือกี่ชั่วโมง แล้วหักเวลาพัก"
      - "แปลงเวลาที่ใช้ได้เป็นวินาที แล้วหารด้วยจำนวนใบสั่งยา"
    misconceptions:
      - { match: 45.71, feedback: "ดูเหมือนใช้ 8 ชั่วโมงเต็มโดยไม่หักพักเที่ยง 1 ชั่วโมง" }
      - { match: 0.67, feedback: "นั่นคือคำตอบในหน่วยนาที โจทย์ถามเป็นวินาที" }
    solution: "เปิด 8 ชั่วโมง หักพัก 1 ชั่วโมง เหลือ 7 ชั่วโมง $= 420$ นาที $= 25{,}200$ วินาที เวลาแท็กต์ $= 25{,}200 \\div 630 = 40$ วินาทีต่อใบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.lean.p010
    topics: [management.operations.lean]
    difficulty: 3
    type: numeric
    stem: "การประกอบหม้อทอดไร้น้ำมันหนึ่งเครื่องใช้เวลางานรวม 4.2 นาที เวลาแท็กต์คือ 0.75 นาที สายการผลิตต้องมีอย่างน้อยกี่สถานี (ตอบเป็นจำนวนสถานี)"
    answer: { value: 6, unit: สถานี }
    hints:
      - "จำนวนสถานีน้อยที่สุด = เวลางานรวม ÷ เวลาแท็กต์"
      - "ผลหารไม่เป็นจำนวนเต็ม ควรปัดขึ้นหรือปัดลง ลองคิดว่าถ้าปัดลงจะเกิดอะไรขึ้น"
    misconceptions:
      - { match: 5, feedback: "ปัดลงไม่ได้ 5 สถานีรับงานได้แค่ $5 \\times 0.75 = 3.75$ นาที ไม่พอสำหรับงาน 4.2 นาที" }
      - { match: 5.6, feedback: "จำนวนสถานีต้องเป็นจำนวนเต็ม และต้องปัดขึ้น" }
    solution: "$\\dfrac{4.2}{0.75} = 5.6$ ปัดขึ้นเป็น **6 สถานี** เพราะ 5 สถานีรับงานได้เพียง 3.75 นาทีต่อรอบแท็กต์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.lean.p011
    topics: [management.operations.lean]
    difficulty: 3
    type: mcq
    stem: "สายประกอบมีเวลาแท็กต์ 45 วินาที สถานีส่วนใหญ่ใช้ 38–44 วินาที แต่สถานีขันสกรูใช้ 50 วินาที ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "สถานีขันสกรูเป็นคอขวด สายผลิตไม่ทันความต้องการ ควรลดรอบเวลาของสถานีนี้ เช่น ย้ายงานบางส่วนไปสถานีที่ว่าง", correct: true }
      - { id: b, text: "สายผลิตทันความต้องการ เพราะรอบเวลาเฉลี่ยของทุกสถานีต่ำกว่า 45 วินาที", feedback: "กำลังผลิตของสายขึ้นกับสถานีที่ช้าที่สุด ไม่ใช่ค่าเฉลี่ย ทุกสถานีต้องรอสถานีขันสกรู" }
      - { id: c, text: "ควรเพิ่มความเร็วของสถานีที่เร็วที่สุดเพื่อชดเชย", feedback: "การเร่งสถานีที่เร็วอยู่แล้วทำให้งานไปกองรอหน้าคอขวดมากขึ้น ไม่ได้เพิ่มผลผลิต" }
      - { id: d, text: "ควรเปลี่ยนเวลาแท็กต์เป็น 50 วินาที", feedback: "เวลาแท็กต์มาจากความต้องการของลูกค้า เปลี่ยนตามใจไม่ได้ ถ้าใช้ 50 วินาทีจะผลิตได้น้อยกว่าที่ลูกค้าต้องการ" }
    hints:
      - "สถานีใดกำหนดจังหวะของทั้งสาย"
      - "เทียบรอบเวลาของสถานีนั้นกับเวลาแท็กต์"
    solution: "สถานีขันสกรู 50 วินาทีนานกว่าแท็กต์ 45 วินาที จึงเป็นคอขวดที่ทำให้สายผลิตไม่ทัน วิธีแก้คือลดรอบเวลาของสถานีนั้น เช่น ย้ายงานไปสถานีที่มีเวลาว่าง ใช้ไขควงไฟฟ้า หรือทำไคเซ็นลดการเคลื่อนไหว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.lean.p012
    topics: [management.operations.lean]
    difficulty: 3
    type: numeric
    stem: "สำนักงานที่ดินจับเวลาคำขอโอนที่ดินหนึ่งเรื่อง ตั้งแต่ยื่นจนได้รับเอกสารใช้เวลารวม 5 ชั่วโมง แต่เวลาที่เจ้าหน้าที่ลงมือตรวจและบันทึกจริงรวมเพียง 15 นาที ประสิทธิภาพรอบกระบวนการเป็นร้อยละเท่าใด (ตอบเป็นตัวเลขในหน่วย %)"
    answer: { value: 5, unit: "%" }
    hints:
      - "ประสิทธิภาพรอบกระบวนการ = เวลาเพิ่มคุณค่า ÷ เวลานำรวม × 100"
      - "แปลงให้เป็นหน่วยเดียวกันก่อน 5 ชั่วโมง = กี่นาที"
    misconceptions:
      - { match: 300, feedback: "ดูเหมือนหารสลับกันหรือไม่ได้แปลงหน่วย ต้องใช้ 15 นาที ÷ 300 นาที" }
      - { match: 20, feedback: "นั่นคือ $300 \\div 15$ ต้องเอาเวลาเพิ่มคุณค่าเป็นตัวตั้ง" }
    solution: "5 ชั่วโมง $= 300$ นาที ประสิทธิภาพรอบกระบวนการ $= \\dfrac{15}{300} \\times 100 = 5\\%$ เวลาอีก 95% เป็นการรอคิว รอเซ็น หรือส่งเอกสารระหว่างโต๊ะ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.lean.p013
    topics: [management.operations.lean]
    difficulty: 4
    type: numeric
    stem: "โรงงานแปรรูปมะม่วงในเดือนหนึ่งมีมูลค่าผลผลิต 600,000 บาท ใช้ค่าแรง 150,000 บาท วัตถุดิบ 220,000 บาท และพลังงาน 30,000 บาท ผลิตภาพรวมหลายปัจจัย (มูลค่าผลผลิตต่อบาทของปัจจัยนำเข้า) เป็นเท่าใด (ตอบเป็นตัวเลข)"
    answer: { value: 1.5, tolerance: 0.01 }
    hints:
      - "ผลิตภาพรวมหลายปัจจัยใช้ปัจจัยนำเข้าทุกตัวรวมกันเป็นตัวหาร"
      - "รวมค่าแรง วัตถุดิบ และพลังงานก่อน"
    misconceptions:
      - { match: 4, feedback: "นั่นคือผลิตภาพแรงงานเชิงมูลค่า ($600{,}000 \\div 150{,}000$) ผลิตภาพรวมหลายปัจจัยต้องรวมวัตถุดิบและพลังงานด้วย" }
      - { match: 2.73, feedback: "ดูเหมือนใช้แค่วัตถุดิบเป็นตัวหาร ต้องรวมทุกปัจจัย" }
    solution: "ปัจจัยนำเข้ารวม $= 150{,}000 + 220{,}000 + 30{,}000 = 400{,}000$ บาท ผลิตภาพ $= 600{,}000 \\div 400{,}000 = 1.5$ บาทผลผลิตต่อบาทของปัจจัยนำเข้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.lean.p014
    topics: [management.operations.lean]
    difficulty: 4
    type: numeric
    stem: "สายประกอบหม้อทอดในข้อก่อนหน้า (เวลางานรวม 4.2 นาที) จัดเป็น 6 สถานี สถานีที่ช้าที่สุดใช้ 0.75 นาที ประสิทธิภาพสมดุลสายเป็นร้อยละเท่าใด (ตอบเป็นตัวเลขในหน่วย % ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 93.3, tolerance: 0.1, unit: "%" }
    hints:
      - "ประสิทธิภาพสมดุลสาย = เวลางานรวม ÷ (จำนวนสถานี × รอบเวลาคอขวด) × 100"
      - "ตัวหารคือเวลาที่ทุกสถานีรวมกันต้องใช้ต่อหนึ่งชิ้น"
    misconceptions:
      - { match: 107.1, feedback: "ดูเหมือนหารสลับกัน ($4.5 \\div 4.2$) ประสิทธิภาพเกิน 100% ไม่ได้" }
      - { match: 560, feedback: "ดูเหมือนไม่ได้คูณจำนวนสถานี ($4.2 \\div 0.75 \\times 100$)" }
    solution: "$\\dfrac{4.2}{6 \\times 0.75} \\times 100 = \\dfrac{4.2}{4.5} \\times 100 \\approx 93.3\\%$ เวลาว่างรวมในสายคือ $4.5 - 4.2 = 0.3$ นาทีต่อชิ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.lean.p015
    topics: [management.operations.lean]
    difficulty: 4
    type: numeric
    stem: "สายบรรจุน้ำพริกมีเวลาทำงานได้จริงวันละ 25,200 วินาที ลูกค้าสั่งวันละ 525 กระปุก สถานีปิดฝาซึ่งช้าที่สุดใช้กระปุกละ 56 วินาที สถานีอื่นใช้ไม่เกิน 45 วินาที สายนี้ผลิตได้จริงวันละกี่กระปุก (ตอบเป็นตัวเลขในหน่วยกระปุก)"
    answer: { value: 450, unit: กระปุก }
    hints:
      - "กำลังผลิตของสายถูกกำหนดโดยสถานีใด"
      - "กำลังผลิต = เวลาที่ใช้ได้ ÷ รอบเวลาของคอขวด"
    misconceptions:
      - { match: 525, feedback: "นั่นคือความต้องการของลูกค้า ไม่ใช่กำลังผลิต สายผลิตได้เร็วเท่าสถานีที่ช้าที่สุดเท่านั้น" }
      - { match: 560, feedback: "ดูเหมือนใช้รอบเวลา 45 วินาทีของสถานีอื่น แต่ทุกกระปุกต้องผ่านสถานีปิดฝาซึ่งใช้ 56 วินาที" }
    solution: "คอขวดคือสถานีปิดฝา 56 วินาที กำลังผลิต $= 25{,}200 \\div 56 = 450$ กระปุกต่อวัน น้อยกว่าความต้องการ 525 กระปุก (เวลาแท็กต์ $= 25{,}200 \\div 525 = 48$ วินาที)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.lean.p016
    topics: [management.operations.lean]
    difficulty: 4
    type: mcq
    stem: "เจ้าหน้าที่ธุรการคนหนึ่งในหน่วยราชการเขียนโปรแกรมตารางคำนวณเป็น และเคยเสนอวิธีรวมรายงานสามฉบับให้ทำอัตโนมัติ แต่หัวหน้าบอกว่า \"ทำตามที่เคยทำมาก็พอ\" ทำให้ทุกคนยังกรอกรายงานด้วยมือวันละ 2 ชั่วโมง สถานการณ์นี้แสดงความสูญเปล่าข้อใดชัดเจนที่สุด"
    choices:
      - { id: a, text: "ทักษะที่ไม่ได้ใช้", correct: true }
      - { id: b, text: "การขนส่ง", feedback: "ไม่มีการย้ายของหรือเอกสารไปมา ปัญหาคือความสามารถและความคิดของพนักงานไม่ได้ถูกนำมาใช้" }
      - { id: c, text: "ผลิตมากเกินไป", feedback: "รายงานไม่ได้ทำเกินความต้องการ ประเด็นหลักคือการไม่ใช้ความคิดของพนักงาน" }
      - { id: d, text: "สินค้าคงคลังเกิน", feedback: "ไม่มีของหรือเอกสารกองค้าง ประเด็นหลักคือทักษะของคนที่ไม่ได้ใช้" }
    hints:
      - "ความสูญเปล่าข้อที่ 8 ที่เพิ่มเข้ามาภายหลังเกี่ยวกับอะไร"
      - "สิ่งที่สูญเปล่าในสถานการณ์นี้คือของ คน หรือความคิด"
    solution: "ความคิดและทักษะของพนักงานไม่ถูกนำมาใช้ คือ **ทักษะที่ไม่ได้ใช้** (ความสูญเปล่าข้อที่ 8) ซึ่งส่งผลให้เกิดกระบวนการเกินจำเป็น (กรอกรายงานซ้ำด้วยมือ) ตามมา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.lean.p017
    topics: [management.operations.lean]
    difficulty: 3
    type: order
    stem: "ทีมงานร้านอาหารทำไคเซ็นเพื่อลดเวลาเตรียมโต๊ะ เรียงขั้นตอนให้ถูกต้อง"
    items:
      - "เลือกปัญหา: เตรียมโต๊ะใหม่ใช้เวลานานจนลูกค้ารอหน้าร้าน"
      - "วัดสภาพปัจจุบัน: จับเวลาเตรียมโต๊ะได้เฉลี่ย 6 นาที"
      - "หาสาเหตุ: พนักงานเดินไปเอาช้อนส้อมและผ้าเช็ดโต๊ะคนละมุมร้าน"
      - "ทดลองแก้: วางรถเข็นที่มีอุปกรณ์ครบชุดไว้กลางร้าน"
      - "วัดผล: เวลาเตรียมโต๊ะลดเหลือเฉลี่ย 3 นาที"
      - "ทำเป็นมาตรฐาน: กำหนดรายการของบนรถเข็นและผู้เติมของทุกกะ"
    hints:
      - "ไคเซ็นเดินตามวงจร PDCA"
      - "ต้องวัดสภาพปัจจุบันก่อนแก้ จึงรู้ว่าหลังแก้ดีขึ้นจริงหรือไม่"
    solution: "เลือกปัญหา → วัดสภาพปัจจุบัน → หาสาเหตุ → ทดลองแก้ → วัดผล → ทำเป็นมาตรฐาน (สี่ขั้นแรกคือ P กับ D ต่อด้วย C และ A)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.lean.p018
    topics: [management.operations.lean]
    difficulty: 5
    type: numeric
    stem: "สายผลิตชิ้นส่วนมีงานระหว่างทำค้างอยู่ในสายเฉลี่ย 360 ชิ้น และผลิตเสร็จเฉลี่ยชั่วโมงละ 120 ชิ้น ตามกฎของลิตเติล เวลานำเฉลี่ย = งานระหว่างทำ ÷ อัตราผลผลิต ถ้าเวลาเพิ่มคุณค่าของชิ้นส่วนหนึ่งชิ้นรวม 9 นาที ประสิทธิภาพรอบกระบวนการเป็นร้อยละเท่าใด (ตอบเป็นตัวเลขในหน่วย %)"
    answer: { value: 5, unit: "%" }
    hints:
      - "หาเวลานำเฉลี่ยก่อน: 360 ÷ 120 ได้ในหน่วยชั่วโมง"
      - "แปลงเวลานำเป็นนาทีให้หน่วยตรงกับเวลาเพิ่มคุณค่า"
      - "ประสิทธิภาพรอบกระบวนการ = เวลาเพิ่มคุณค่า ÷ เวลานำ × 100"
    misconceptions:
      - { match: 300, feedback: "ดูเหมือนนำ 9 นาทีหารด้วย 3 ชั่วโมงโดยไม่แปลงหน่วย ต้องแปลง 3 ชั่วโมงเป็น 180 นาทีก่อน" }
      - { match: 45, feedback: "ดูเหมือนหารกลับด้านเป็น $120 \\div 360 = \\tfrac{1}{3}$ ชั่วโมง (20 นาที) กฎของลิตเติลใช้งานระหว่างทำ ÷ อัตราผลผลิต" }
    solution: "เวลานำ $= 360 \\div 120 = 3$ ชั่วโมง $= 180$ นาที ประสิทธิภาพรอบกระบวนการ $= \\dfrac{9}{180} \\times 100 = 5\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.lean.p019
    topics: [management.operations.lean]
    difficulty: 5
    type: numeric
    stem: "ลูกค้าสั่งพัดลมเดือนละ 21,600 เครื่อง โรงงานทำงานเดือนละ 20 วัน วันละ 2 กะ กะละ 8 ชั่วโมง แต่ละกะมีเวลาพักและประชุมรวม 1 ชั่วโมง เวลาแท็กต์เป็นกี่วินาทีต่อเครื่อง (ตอบเป็นตัวเลขในหน่วยวินาที ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 46.67, tolerance: 0.05, unit: วินาที }
    hints:
      - "หาความต้องการต่อวันก่อน (21,600 ÷ 20)"
      - "เวลาที่ใช้ได้ต่อวัน = 2 กะ × (8 − 1) ชั่วโมง แล้วแปลงเป็นวินาที"
      - "เวลาแท็กต์ = เวลาที่ใช้ได้ต่อวัน ÷ ความต้องการต่อวัน"
    misconceptions:
      - { match: 53.33, feedback: "ดูเหมือนใช้ 16 ชั่วโมงเต็มโดยไม่หักเวลาพักและประชุม 1 ชั่วโมงต่อกะ" }
      - { match: 23.33, feedback: "ดูเหมือนคิดเวลาเพียงกะเดียว (7 ชั่วโมง) แต่ความต้องการเป็นของทั้งวันซึ่งมี 2 กะ" }
    solution: "ความต้องการ $= 21{,}600 \\div 20 = 1{,}080$ เครื่องต่อวัน เวลาที่ใช้ได้ $= 2 \\times 7 = 14$ ชั่วโมง $= 50{,}400$ วินาที เวลาแท็กต์ $= 50{,}400 \\div 1{,}080 \\approx 46.67$ วินาทีต่อเครื่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.lean.p020
    topics: [management.operations.lean]
    difficulty: 5
    type: numeric
    stem: "งานประกอบโคมไฟมี 6 งานย่อยที่ต้องทำตามลำดับห้ามสลับ ใช้เวลา 0.6, 0.9, 0.4, 0.7, 0.5 และ 0.3 นาที เวลาแท็กต์ 1.0 นาที ถ้าจัดงานย่อยเรียงตามลำดับเข้าสถานี โดยใส่งานถัดไปในสถานีเดิมเมื่อรวมแล้วไม่เกินแท็กต์ มิฉะนั้นเปิดสถานีใหม่ จะใช้กี่สถานี (ตอบเป็นจำนวนสถานี)"
    answer: { value: 5, unit: สถานี }
    hints:
      - "เริ่มจากงาน 0.6 ในสถานีที่ 1 แล้วลองใส่งานถัดไป ถ้ารวมเกิน 1.0 ให้เปิดสถานีใหม่"
      - "จดเวลารวมของแต่ละสถานีไว้ทีละขั้น"
      - "เปรียบเทียบผลกับค่าทางทฤษฎี (เวลางานรวม ÷ แท็กต์ ปัดขึ้น) ซึ่งเป็นแค่ขอบเขตล่าง"
    misconceptions:
      - { match: 4, feedback: "4 คือจำนวนสถานีน้อยที่สุดตามทฤษฎี ($\\lceil 3.4 / 1.0 \\rceil$) แต่เมื่อห้ามสลับลำดับงาน งานบางคู่รวมกันเกินแท็กต์ จึงต้องใช้มากกว่านั้น" }
      - { match: 6, feedback: "งานสุดท้ายสองงาน (0.5 + 0.3 = 0.8 นาที) รวมอยู่ในสถานีเดียวกันได้" }
    solution: "สถานี 1: 0.6 (บวก 0.9 เกิน) · สถานี 2: 0.9 (บวก 0.4 เกิน) · สถานี 3: 0.4 (บวก 0.7 = 1.1 เกิน) · สถานี 4: 0.7 (บวก 0.5 = 1.2 เกิน) · สถานี 5: 0.5 + 0.3 = 0.8 รวม **5 สถานี** มากกว่าค่าทางทฤษฎี $\\lceil 3.4 \\rceil = 4$ เพราะข้อจำกัดเรื่องลำดับงาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.lean.p021
    topics: [management.operations.lean]
