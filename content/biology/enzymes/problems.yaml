    solution: "ที่ 37 °C แป้งหมดเร็วที่สุด (2 นาที) จึงใกล้อุณหภูมิที่เหมาะสม ที่ 20 °C ช้ากว่าเพราะโมเลกุลชนกันน้อย ที่ 60 °C แป้งยังอยู่เพราะอะไมเลสเสียสภาพ"
