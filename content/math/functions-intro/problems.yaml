      - "หาช่วงที่กราฟเป็นเส้นแนวนอน"
    solution: "ตั้งแต่นาทีที่ 5 ถึง 12 ระยะทางจากบ้านคงที่ 400 เมตร (กราฟราบ) แปลว่าหยุดอยู่ที่ร้าน 7 นาที ช่วงอื่นระยะทางเพิ่มขึ้น จึงกำลังเดิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.func.p018
    topics: [math.functions.functions-intro]
    difficulty: 3
    type: mcq
    stem: "ฟังก์ชัน $f(x) = 3x + 2$ และฟังก์ชันเชิงเส้น $g$ ที่กำหนดด้วยตาราง $x$: 0, 2, 4 และ $g(x)$: 1, 6, 11 ฟังก์ชันใดมีอัตราการเปลี่ยนแปลง (ค่า $y$ ที่เพิ่มเมื่อ $x$ เพิ่ม 1) มากกว่า"
    choices:
      - { id: a, text: "$f$ มากกว่า", correct: true }
      - { id: b, text: "$g$ มากกว่า", feedback: "ในตาราง $g$ เพิ่มทีละ 5 ก็จริง แต่ $x$ เพิ่มทีละ 2 อัตราต่อ 1 หน่วยจึงเป็น $5 \\div 2 = 2.5$ น้อยกว่า 3" }
      - { id: c, text: "เท่ากัน", feedback: "อัตราของ $f$ คือ 3 ส่วนของ $g$ คือ $\\frac{11 - 1}{4 - 0} = 2.5$ ไม่เท่ากัน" }
      - { id: d, text: "เปรียบเทียบไม่ได้ เพราะเขียนคนละแบบ", feedback: "เปรียบเทียบได้ โดยหาอัตราการเปลี่ยนแปลงของแต่ละฟังก์ชันออกมาเป็นตัวเลขก่อน" }
    hints:
      - "อัตราการเปลี่ยนแปลงของ $f(x) = 3x + 2$ คือสัมประสิทธิ์ของ $x$"
      - "สำหรับ $g$ ใช้ $\\frac{\\Delta y}{\\Delta x}$ ดูให้ดีว่า $x$ ในตารางเพิ่มทีละเท่าใด"
    solution: "$f$ มีอัตรา 3 ส่วน $g$ มีอัตรา $\\frac{6 - 1}{2 - 0} = \\frac{5}{2} = 2.5$ ดังนั้น $f$ เปลี่ยนเร็วกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.func.p019
    topics: [math.functions.functions-intro]
    difficulty: 4
    type: numeric
    stem: "ต้มน้ำในหม้อ ให้ $T(m) = 25 + 15m$ เป็นอุณหภูมิของน้ำ (°C) หลังต้มไป $m$ นาที สำหรับ $0 \\le m \\le 5$ ถ้า $T(m) = 85$ แล้ว $m$ มีค่าเท่าใด และหมายถึงอะไร (ตอบค่า $m$ ในหน่วยนาที)"
    answer: { value: 4, unit: นาที }
    hints:
      - "$T(m) = 85$ บอกค่าออก (อุณหภูมิ) ให้หาค่าเข้า (เวลา) ไม่ใช่ให้แทน $m = 85$"
      - "ตั้งสมการ $25 + 15m = 85$ แล้วแก้หา $m$"
    misconceptions:
      - { match: 1300, feedback: "นั่นคือ $T(85)$ ซึ่งแทน $m = 85$ แต่โจทย์บอกว่าค่าของฟังก์ชันเท่ากับ 85 ต้องแก้สมการหา $m$" }
      - { match: 7.33, feedback: "ดูเหมือนแก้ $15m = 85 + 25$ ต้องย้าย 25 ไปลบ: $15m = 85 - 25$" }
    solution: "$25 + 15m = 85$ → $15m = 60$ → $m = 4$ หมายความว่าหลังต้มไป 4 นาที น้ำมีอุณหภูมิ 85 °C (อยู่ในโดเมน $0 \\le m \\le 5$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.func.p020
    topics: [math.functions.functions-intro]
    difficulty: 4
    type: mcq
    stem: "แม่ค้าขายขนมครกถาดละ 120 บาท รายได้ต่อวันคือ $P(n) = 120n$ บาท เมื่อขายได้ $n$ ถาด และทำได้วันละไม่เกิน 30 ถาด โดเมนที่เหมาะสมกับสถานการณ์นี้คือข้อใด"
    choices:
      - { id: a, text: "$\\{0, 1, 2, \\ldots, 30\\}$", correct: true }
      - { id: b, text: "จำนวนจริงทุกตัวที่ $0 \\le n \\le 30$", feedback: "ขายเป็นถาด ขาย $2.5$ หรือ $\\sqrt{2}$ ถาดไม่ได้ $n$ ต้องเป็นจำนวนเต็ม" }
      - { id: c, text: "$\\{0, 120, 240, \\ldots, 3600\\}$", feedback: "นี่คือรายได้ที่เป็นไปได้ ซึ่งเป็นเรนจ์ ไม่ใช่โดเมน โดเมนคือค่าที่ใส่เข้า คือจำนวนถาด" }
      - { id: d, text: "จำนวนเต็มทุกตัว", feedback: "จำนวนถาดติดลบไม่ได้ และเกิน 30 ถาดไม่ได้เพราะทำได้วันละไม่เกิน 30" }
    hints:
      - "โดเมนคือค่าที่ใส่เข้าไปได้ ในที่นี้คือจำนวนถาดที่ขายได้จริง"
      - "จำนวนถาดเป็นจำนวนแบบใด และมีค่าน้อยที่สุดและมากที่สุดเท่าใด"
    solution: "$n$ คือจำนวนถาด ต้องเป็นจำนวนเต็มที่ไม่ติดลบ และไม่เกิน 30 โดเมนจึงเป็น $\\{0, 1, 2, \\ldots, 30\\}$ ส่วนเรนจ์คือ $\\{0, 120, \\ldots, 3600\\}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.func.p021
    topics: [math.functions.functions-intro]
    difficulty: 5
    type: numeric
    stem: "บอลลูนตรวจอากาศลอยขึ้นจากพื้นด้วยความสูง $h(t) = 0.5t$ กิโลเมตร เมื่อเวลาผ่านไป $t$ นาที และอุณหภูมิอากาศที่ความสูง $h$ กิโลเมตรคือ $T(h) = 30 - 6h$ องศาเซลเซียส อุณหภูมิรอบบอลลูนเป็น 0 °C เมื่อเวลาผ่านไปกี่นาที (ตอบในหน่วยนาที)"
    answer: { value: 10, unit: นาที }
    hints:
      - "อุณหภูมิรอบบอลลูนเป็นฟังก์ชันประกอบ $T(h(t))$"
      - "แทน $h(t) = 0.5t$ ลงใน $T$ ได้ $T(h(t)) = 30 - 6(0.5t)$"
      - "ตั้งสมการให้ฟังก์ชันประกอบเท่ากับ 0 แล้วแก้หา $t$"
    misconceptions:
      - { match: 5, feedback: "5 คือความสูง (กิโลเมตร) ที่อุณหภูมิเป็น 0 °C ยังต้องแปลงเป็นเวลาด้วย $h(t) = 0.5t$" }
      - { match: 2.5, feedback: "ดูเหมือนนำความสูง 5 กิโลเมตรไปคูณ 0.5 แต่ $h = 0.5t$ แปลว่า $t = h \\div 0.5$" }
    solution: "$T(h(t)) = 30 - 6(0.5t) = 30 - 3t$ ให้เท่ากับ 0: $3t = 30$ → $t = 10$ นาที ตรวจ: $h(10) = 5$ กิโลเมตร และ $T(5) = 30 - 30 = 0$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true
