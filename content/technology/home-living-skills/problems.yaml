problems:
- id: technology.living.home-living-skills.p001
  topics:
  - technology.living.home-living-skills
  difficulty: 1
  type: mcq
  stem: "ก่อนซักเสื้อผ้า ข้อใดเป็นขั้นแรกที่เหมาะสม"
  choices:
  - id: a
    text: "ซักทุกชิ้นรวมกันด้วยน้ำร้อนจัดเพื่อให้สะอาดเร็ว"
    feedback: "น้ำร้อนจัดอาจทำให้ผ้าหดหรือสีตก และผ้าบางชนิดไม่ควรซักด้วยน้ำร้อน"
  - id: b
    text: "อ่านป้ายดูแลผ้าและแยกผ้าสีเข้มออกจากผ้าขาว"
    correct: true
  - id: c
    text: "ตากผ้าก่อนซักเพื่อให้แห้งเร็วขึ้น"
    feedback: "การตากก่อนซักไม่ได้ช่วยอะไร และคราบอาจติดแน่นขึ้น"
  - id: d
    text: "ใช้น้ำยาฟอกขาวกับผ้าทุกชิ้นเพื่อความขาว"
    feedback: "น้ำยาฟอกขาวไม่เหมาะกับผ้าทุกชนิด และอาจทำให้สีผ้าซีด"
  hints:
  - "ป้ายบนเสื้อบอกวิธีดูแลที่ผู้ผลิตแนะนำ"
  - "ผ้าสีอาจตกลงไปติดผ้าขาวได้ ถ้าซักรวมกัน"
  solution: "อ่านป้ายดูแลผ้าเพื่อรู้วิธีที่ผู้ผลิตแนะนำ และแยกผ้าสีเข้มกับผ้าขาวเพื่อป้องกันสีตกติดผ้าอื่น"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.home-living-skills.p002
  topics:
  - technology.living.home-living-skills
  difficulty: 1
  type: order
  stem: "เรียงลำดับขั้นตอนการเตรียมวัตถุดิบและต้มแกงจืดผัก"
  items:
  - "ล้างผักให้สะอาดและสะเด็ดน้ำ"
  - "หั่นผักเป็นชิ้นพอดีคำ"
  - "ตั้งหม้อน้ำให้เดือด"
  - "ใส่ผักที่สุกช้ากว่าลงไปก่อน"
  - "ใส่ผักที่สุกเร็วและปรุงรสตามชอบ"
  hints:
  - "วัตถุดิบต้องสะอาดก่อนนำไปหั่นและต้ม"
  - "น้ำต้องเดือดก่อนจึงใส่ผักลงไป"
  - "ผักที่ใช้เวลาต้มนานควรลงไปก่อนผักที่สุกเร็ว"
  solution: "ล้างผัก หั่นผัก ตั้งหม้อให้เดือด ใส่ผักที่สุกช้าก่อน แล้วค่อยใส่ผักที่สุกเร็วและปรุงรส เพราะวัตถุดิบต้องสะอาดก่อน และน้ำร้อนต้องพร้อมก่อนจึงใส่ผักได้"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.home-living-skills.p003
  topics:
  - technology.living.home-living-skills
  difficulty: 2
  type: mcq
  stem: "ป้ายดูแลผ้ามีรูปเตารีดที่มีจุดสามจุด หมายความว่าอย่างไร"
  choices:
  - id: a
    text: "รีดได้ที่อุณหภูมิสูง"
    correct: true
  - id: b
    text: "ห้ามรีด"
    feedback: "ห้ามรีดจะใช้กากบาททับรูปเตารีด ไม่ใช่จุดสามจุด"
  - id: c
    text: "รีดได้ที่อุณหภูมิต่ำเท่านั้น"
    feedback: "หนึ่งจุดเป็นอุณหภูมิต่ำ ส่วนสามจุดเป็นอุณหภูมิสูง"
  - id: d
    text: "ซักด้วยเครื่องได้"
    feedback: "สัญลักษณ์เตารีดเกี่ยวกับการรีดไม่ใช่การซัก"
  hints:
  - "จำนวนจุดบนรูปเตารีดบอกระดับความร้อน"
  - "ลองนึกถึงลำดับจากจุดเดียวไปจนถึงสามจุด"
  solution: "สัญลักษณ์เตารีดใช้จำนวนจุดบอกระดับอุณหภูมิ หนึ่งจุดคืออุณหภูมิต่ำ สองจุดปานกลาง และสามจุดคืออุณหภูมิสูง"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.home-living-skills.p004
  topics:
  - technology.living.home-living-skills
  difficulty: 2
  type: match
  stem: "จับคู่สัญลักษณ์ดูแลผ้ากับความหมายของสัญลักษณ์นั้น"
  pairs:
  - left: "รูปอ่างน้ำที่มีรูปมืออยู่ในอ่าง"
    right: "ซักด้วยมือเท่านั้น"
  - left: "รูปสามเหลี่ยมมีกากบาททับ"
    right: "ห้ามใช้น้ำยาฟอกขาว"
  - left: "รูปเตารีดที่มีจุดเดียว"
    right: "รีดที่อุณหภูมิต่ำ"
  - left: "รูปสี่เหลี่ยมมีวงกลมและมีกากบาททับ"
    right: "ห้ามอบแห้งด้วยเครื่อง"
  hints:
  - "สัญลักษณ์แต่ละรูปเกี่ยวกับการซัก ฟอก รีด หรืออบแห้ง"
  - "กากบาทหมายถึงห้ามทำสิ่งนั้น"
  - "จุดบนเตารีดบอกระดับความร้อน"
  solution: "รูปอ่างน้ำที่มีมือคือซักด้วยมือ รูปสามเหลี่ยมมีกากบาทคือห้ามฟอกขาว รูปเตารีดจุดเดียวคือรีดอุณหภูมิต่ำ และรูปสี่เหลี่ยมมีวงกลมที่มีกากบาทคือห้ามอบแห้งด้วยเครื่อง"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.home-living-skills.p005
  topics:
  - technology.living.home-living-skills
  difficulty: 2
  type: numeric
  stem: "สูตรแกงจืดผักกาดขาวใช้ผักกาดขาว 300 กรัมสำหรับ 4 คน ถ้าทำให้ 6 คน ต้องใช้ผักกาดขาวกี่กรัม (ตอบเป็นกรัม)"
  answer:
    value: 450
    tolerance: 0
    unit: "กรัม"
  misconceptions:
  - match: 200
    feedback: "ตอบ 200 เกิดจากสลับจำนวนคน คือ 300 ÷ 6 × 4"
  - match: 300
    feedback: "ตอบ 300 คือปริมาณเดิมที่ไม่ได้ปรับตามจำนวนคน"
  hints:
  - "หาก่อนว่าปริมาณต่อคนคือเท่าใด"
  - "คูณปริมาณต่อคนด้วยจำนวนคนที่ต้องการทำ"
  solution: "ปริมาณต่อคน 300 ÷ 4 = 75 กรัม ทำให้ 6 คนต้องใช้ 75 × 6 = 450 กรัม (ตรวจด้วย python3: 300/4*6 = 450)"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.home-living-skills.p006
  topics:
  - technology.living.home-living-skills
  difficulty: 2
  type: text
  stem: "วิธีเย็บที่เย็บไปข้างหน้าสั้น ๆ แล้วลากเข็มกลับมาทับรอยเดิม เพื่อให้ตะเข็บแน่น เรียกว่าอะไร (ตอบเป็นคำ 2 คำ)"
  accepted:
  - "ด้นถอยหลัง"
  misconceptions:
  - match: "เย็บตรง"
    feedback: "การเย็บตรงธรรมดาไม่ได้ลากทับรอยเดิม ตะเข็บจึงแน่นน้อยกว่า"
  hints:
  - "วิธีนี้ทำให้ตะเข็บแน่นกว่าการเย็บตรงธรรมดา"
  - "ลองนึกถึงทิศทางที่เข็มเดินกลับมาทับรอยเดิม"
  solution: "วิธีนี้เรียกว่าด้นถอยหลัง เย็บไปข้างหน้าสั้น ๆ แล้วลากเข็มกลับมาทับรอยเดิม ทำให้ตะเข็บแน่นและทนการดึงได้ดีกว่า"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.home-living-skills.p007
  topics:
  - technology.living.home-living-skills
  difficulty: 2
  type: mcq
  stem: "ข้อใดเป็นการปฏิบัติตามหลักความปลอดภัยของอาหาร"
  choices:
  - id: a
    text: "แยกเขียงสำหรับเนื้อดิบออกจากเขียงสำหรับผักที่กินสด"
    correct: true
  - id: b
    text: "วางอาหารที่ปรุงสุกแล้วไว้ที่อุณหภูมิห้องทั้งคืน"
    feedback: "อุณหภูมิห้องเป็นช่วงที่จุลินทรีย์เติบโตได้ดี การทิ้งไว้ทั้งคืนเสี่ยงมาก"
  - id: c
    text: "ใช้น้ำที่ไม่สะอาดล้างวัตถุดิบเพื่อประหยัด"
    feedback: "น้ำที่ไม่สะอาดทำให้วัตถุดิบปนเปื้อนเชื้อ"
  - id: d
    text: "หั่นเนื้อดิบแล้วหั่นผักสดต่อทันทีโดยไม่ล้างเขียง"
    feedback: "เชื้อจากเนื้อดิบอาจปนไปกับผักที่กินสด"
  hints:
  - "ดูว่าอาหารดิบกับอาหารที่กินสดควรแยกกันหรือไม่"
  - "ข้อที่ถูกต้องป้องกันการปนเปื้อนข้ามอาหาร"
  solution: "การแยกเขียงช่วยไม่ให้เชื้อจากเนื้อดิบปนไปกับอาหารที่กินสด ส่วนการวางอาหารไว้ทั้งคืน การใช้น้ำไม่สะอาด และการไม่ล้างเขียงเสี่ยงต่อการปนเปื้อนและทำให้ป่วย"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.home-living-skills.p008
  topics:
  - technology.living.home-living-skills
  difficulty: 2
  type: numeric
  stem: "ปลูกคะน้าในกระถาง 12 ต้น รดต้นละ 250 มิลลิลิตรทุกวัน ตลอด 7 วัน รวมแล้วต้องใช้น้ำกี่ลิตร (ตอบเป็นลิตร)"
  answer:
    value: 21
    tolerance: 0
    unit: "ลิตร"
  misconceptions:
  - match: 3
    feedback: "ตอบ 3 คือปริมาณน้ำที่รดใน 1 วัน ยังไม่ได้คูณ 7 วัน"
  - match: 21000
    feedback: "ตอบ 21000 เป็นค่าในหน่วยมิลลิลิตร ต้องหารด้วย 1000 เพื่อเป็นลิตร"
  hints:
  - "หาปริมาณน้ำที่รดต่อวันทั้งหมดก่อน"
  - "นำปริมาณต่อวันคูณด้วยจำนวนวัน แล้วแปลงมิลลิลิตรเป็นลิตร"
  solution: "ต่อวันใช้ 12 × 250 = 3,000 มิลลิลิตร ทั้ง 7 วันใช้ 21,000 มิลลิลิตร = 21 ลิตร (ตรวจด้วย python3: 12*250*7/1000 = 21)"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.home-living-skills.p009
  topics:
  - technology.living.home-living-skills
  difficulty: 2
  type: order
  stem: "เรียงลำดับขั้นตอนการซ่อมกระดุมที่หลุดให้แน่น"
  items:
  - "เลือกด้ายให้สีใกล้เคียงกับกระดุมและเส้นแข็งแรง"
  - "ร้อยด้ายเข้าเข็มและเริ่มเย็บจากด้านหลังผ้าเพื่อซ่อนปม"
  - "เย็บผ่านรูกระดุมและผ้าหลายรอบให้แน่น"
  - "ผูกปมด้านหลังและตัดด้ายส่วนที่เกิน"
  hints:
  - "ก่อนเริ่มเย็บต้องเตรียมวัสดุให้พร้อม"
  - "ปมควรซ่อนอยู่ด้านหลัง จึงต้องเริ่มและจบที่ด้านหลัง"
  - "ขั้นสุดท้ายคือทำให้ปมแน่นและตัดด้ายส่วนที่เหลือ"
  solution: "เลือกด้ายและเตรียมเข็ม เริ่มเย็บจากด้านหลังให้ซ่อนปม เย็บผ่านรูกระดุมหลายรอบให้แน่น แล้วผูกปมด้านหลังและตัดด้ายส่วนเกิน เพื่อให้กระดุมแน่นและทนการใช้งาน"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.home-living-skills.p010
  topics:
  - technology.living.home-living-skills
  difficulty: 3
  type: mcq
  stem: "ตามหลักทั่วไป ตู้เย็นควรตั้งอุณหภูมิไม่เกินกี่องศาเซลเซียส"
  choices:
  - id: a
    text: "5"
    correct: true
  - id: b
    text: "10"
    feedback: "10 องศายังอยู่ในช่วงที่จุลินทรีย์เติบโตได้ จึงเย็นไม่พอสำหรับการเก็บอาหารสดให้ปลอดภัย"
  - id: c
    text: "15"
    feedback: "อุณหภูมินี้สูงเกินไปสำหรับการเก็บอาหารสดให้ปลอดภัย"
  - id: d
    text: "25"
    feedback: "เป็นอุณหภูมิห้องทั่วไป อาหารเสียได้เร็ว"
  hints:
  - "ช่วงที่จุลินทรีย์เติบโตเร็วคือ 5 ถึง 60 องศาเซลเซียส"
  - "ตู้เย็นต้องเย็นต่ำกว่าช่วงนั้น"
  solution: "ตู้เย็นควรเย็นไม่เกิน 5 องศาเซลเซียส เพื่อให้อาหารอยู่นอกช่วงที่จุลินทรีย์เติบโตเร็ว"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.home-living-skills.p011
  topics:
  - technology.living.home-living-skills
  difficulty: 3
  type: numeric
  stem: "น้ำยาทำความสะอาดตามฉลากให้ผสมน้ำยา 1 ส่วนต่อน้ำ 10 ส่วน ต้องการน้ำยาที่ผสมแล้วทั้งหมด 1,100 มิลลิลิตร ต้องใช้น้ำยาเข้มข้นกี่มิลลิลิตร (ตอบเป็นมิลลิลิตร)"
  answer:
    value: 100
    tolerance: 0
    unit: "มิลลิลิตร"
  misconceptions:
  - match: 110
    feedback: "ตอบ 110 เกิดจาก 1,100 ÷ 10 โดยไม่รวมน้ำยาเป็นหนึ่งส่วนของทั้งหมด"
  - match: 1000
    feedback: "ตอบ 1,000 คือปริมาณน้ำ ไม่ใช่น้ำยาเข้มข้น"
  hints:
  - "รวมจำนวนส่วนทั้งหมดก่อน คือน้ำยา 1 ส่วนกับน้ำ 10 ส่วน"
  - "น้ำยาเป็นหนึ่งในสิบเอ็ดส่วนของปริมาณทั้งหมด"
  solution: "ทั้งหมด 11 ส่วน น้ำยาเป็น 1 ส่วน ได้ 1,100 ÷ 11 = 100 มิลลิลิตร (ตรวจด้วย python3: 1100/11 = 100)"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.home-living-skills.p012
  topics:
  - technology.living.home-living-skills
  difficulty: 3
  type: text
  stem: "ก่อนนำเสื้อที่เปื้อนน้ำมันไปซัก ขั้นแรกที่ควรทำคืออะไร (ตอบเป็นคำ 2 คำ)"
  accepted:
  - "ขจัดคราบ"
  misconceptions:
  - match: "ตากแดด"
    feedback: "ความร้อนอาจทำให้คราบน้ำมันติดแน่นขึ้น จึงควรขจัดคราบก่อน"
  hints:
  - "คราบน้ำมันควรได้รับการจัดการก่อนจะติดแน่น"
  - "ขั้นนี้ทำก่อนการซักทั่วไป"
  solution: "ขจัดคราบน้ำมันเบื้องต้นด้วยน้ำยาล้างจานเล็กน้อยหลังทดสอบที่ชายผ้าแล้ว จึงซักตามป้ายดูแล เพราะความร้อนหรือการปล่อยทิ้งไว้ทำให้คราบติดแน่นขึ้น"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.home-living-skills.p013
  topics:
  - technology.living.home-living-skills
  difficulty: 3
  type: mcq
  stem: "เนื้อสัตว์ดิบที่ซื้อมาควรเก็บในตู้เย็นอย่างไรให้ปลอดภัย"
  choices:
  - id: a
    text: "วางไว้ชั้นบนสุดเพื่อหยิบใช้ได้สะดวก"
    feedback: "น้ำจากเนื้อดิบอาจหยดลงไปปนกับอาหารที่อยู่ชั้นล่าง"
  - id: b
