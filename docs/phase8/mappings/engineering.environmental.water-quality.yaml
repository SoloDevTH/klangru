topic: engineering.environmental.water-quality
rows:
  - { framework: th-coe-engineering-basics, indicators: ["ENV-2.10"], coverage: full, note: "สอนการแปลงหน่วยความเข้มข้น (ppm, mg/L, ppb, µg/L, mol/L, µmol/L) ภาระมลพิษ kg/d จากอัตราการไหล และการแปลงหน่วยเวลาและปริมาตร" }
  - { framework: th-coe-engineering-basics, indicators: ["ENV-3.1"], coverage: partial, note: "สอน BOD (รวมการทดสอบ BOD5 และเส้นโค้ง BOD เชิงเอกซ์โพเนนเชียล) COD ความกระด้าง pH ออกซิเจนละลาย และของแข็งแขวนลอย แต่ยังไม่สอนโคลิฟอร์ม โลหะหนัก ไนโตรเจนและฟอสฟอรัสเชิงปริมาณ การทดสอบความขุ่นกับสี และการหย่อนออกซิเจนในแม่น้ำ" }
  - { framework: th-coe-engineering-basics, indicators: ["ENV-3.14"], coverage: partial, note: "สอนแนวคิดของมาตรฐานและหน่วยที่ใช้รายงาน แต่ยังไม่ระบุค่ามาตรฐานของไทยเพราะยังไม่ได้ยืนยันจากแหล่งทางการ (ต้องตรวจก่อนเผยแพร่) และยังไม่สอนการตัดสินว่าผ่านหรือไม่ผ่านมาตรฐาน ขอบเขตในแผนเรื่องการอ่านมาตรฐานน้ำผิวดินและน้ำทิ้งของไทยจึงสอนได้เพียงบางส่วน" }
  - { framework: th-coe-engineering-basics, indicators: ["ENV-2.6"], coverage: partial, note: "สอนการคำนวณ pH และความเข้มข้นไฮโดรเจนไอออน และความกระด้างที่เกี่ยวกับการแลกเปลี่ยนไอออน แต่ยังไม่สอนค่าคงที่สมดุลและการคำนวณสมดุลเคมีอย่างเป็นระบบ" }
