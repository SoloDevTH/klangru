  - เติมคู่ของ 与其 ให้ครบ
  solution: '**不如 (bùrú)** เขียนว่า 与其每天晚上熬夜 (yǔqí měitiān wǎnshang áoyè)，不如早一点睡觉 (bùrú zǎo yìdiǎn shuìjiào)。 (แทนที่จะอดนอนทุกคืน ไม่สู้เข้านอนเร็วหน่อย)'
