id: chinese.vocab.daily-life-topics
subject: chinese
title: { th: "คำศัพท์ชีวิตประจำวัน: การเรียน การเดินทาง อาหาร และความรู้สึก", en: "Daily-life vocabulary: school, travel, food and feelings" }
summary: คำศัพท์กิจวัตรในบ้าน วิชาเรียนและตารางเรียน การเดินทาง การสั่งอาหาร ความรู้สึก กีฬา และอาชีพ พร้อมกริยาที่ต้องใช้คู่กันให้ถูก เช่น 坐 骑 踢 打
difficulty: 3
minutes: 35
prerequisites: [chinese.vocab.self-introduction, chinese.grammar.modal-verbs]
encompasses:
  - { id: chinese.vocab.self-introduction, weight: 0.2 }
  - { id: chinese.grammar.modal-verbs, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: verb-collocations.svg
    alt: "ตาราง 3 คอลัมน์ ยานพาหนะ: 坐 zuò นั่ง (เป็นผู้โดยสาร) + 公共汽车 รถเมล์ 地铁 รถไฟใต้ดิน 飞机 เครื่องบิน · 骑 qí ขี่ (คร่อม) + 自行车 จักรยาน 摩托车 มอเตอร์ไซค์ · 开 kāi ขับ + 车 รถ กีฬา: 踢 tī เตะ (ใช้เท้า) + 足球 ฟุตบอล · 打 dǎ ตี (ใช้มือ) + 篮球 บาสเกตบอล 羽毛球 แบดมินตัน · ไม่ต้องเติมกริยา 游泳 ว่ายน้ำ 跑步 วิ่ง อาหาร: 吃 กิน + 米饭 面条 · 喝 ดื่ม + 茶 咖啡 · 点 สั่ง + 菜 อาหาร"
    caption: "เลือกกริยาให้ตรงกับคำนาม: 坐 กับ 骑 ไม่ใช่คำเดียวกัน 踢 กับ 打 ก็เช่นกัน"
  - { type: check, problem: chinese.vocab.daily-life-topics.p005, prompt: "ขี่จักรยานใช้กริยาอะไร" }
  - type: worked-example
    title: เล่าการเดินทางไปโรงเรียน
    problem: "เขียนภาษาจีน 2 ประโยค: \"ทุกวันฉันตื่นหกโมง\" และ \"ฉันนั่งรถเมล์ไปโรงเรียน\""
    steps:
      - text: "หาคำศัพท์: ทุกวัน = 每天 · ตื่นนอน = 起床 · รถเมล์ = 公共汽车 · โรงเรียน = 学校"
      - text: "ประโยคแรก วางเวลาไว้หน้ากริยา: 我每天六点起床。"
        why: "ภาษาจีนวางเวลาหน้ากริยาเสมอ ไม่วางท้ายประโยคแบบภาษาไทย"
      - text: "ประโยคที่สอง ใช้ 坐 กับรถเมล์ เพราะเรานั่งเป็นผู้โดยสาร แล้วตามด้วย 去 + สถานที่: 我坐公共汽车去学校。"
    answer: "我每天六点起床。我坐公共汽车去学校。"
  - type: worked-example
    title: สั่งอาหารและบอกความรู้สึก
    problem: "อยู่ที่ร้านอาหารจีน อยากได้เกี๊ยวหนึ่งจาน (一盘 yì pán) กับชานมหนึ่งแก้ว (一杯奶茶 yì bēi nǎichá) แล้วบอกเพื่อนว่า \"อร่อยมาก ตอนนี้ฉันอิ่มแล้ว\" (饱 bǎo = อิ่ม)"
    steps:
      - text: "เรียกพนักงานแล้วใช้ 我要 + จำนวน + ลักษณนาม + สิ่งของ: 服务员，我要一盘饺子和一杯奶茶。"
      - text: "ชมอาหารด้วย 好吃 (ถ้าชมเครื่องดื่มใช้ 好喝): 很好吃！"
        why: "好吃 ใช้กับของกิน 好喝 ใช้กับของดื่ม"
      - text: "บอกความรู้สึกที่เปลี่ยนไปด้วย คุณศัพท์ + 了 ไม่ใช้ 是: 我饱了。"
    answer: "服务员，我要一盘饺子和一杯奶茶。……很好吃！我饱了。"
  - { type: check, problem: chinese.vocab.daily-life-topics.p011, prompt: "ความรู้สึกใช้ 是 ได้ไหม" }
glossary:
  - { term: "课程表 kèchéngbiǎo", definition: "ตารางเรียน · 第一节课 = คาบที่ 1" }
  - { term: "坐 zuò / 骑 qí / 开 kāi", definition: "นั่ง (เป็นผู้โดยสาร) / ขี่ (คร่อม) / ขับ ใช้กับยานพาหนะต่างกัน" }
  - { term: "踢 tī / 打 dǎ", definition: "เตะ (กีฬาที่ใช้เท้า เช่น 足球) / ตี (กีฬาที่ใช้มือหรือไม้ เช่น 篮球 羽毛球)" }
  - { term: "觉得 juéde", definition: "รู้สึก คิดว่า เช่น 我觉得很累" }
  - { term: "饿 è / 渴 kě", definition: "หิวข้าว / หิวน้ำ" }
  - { term: "当 dāng", definition: "เป็น ทำหน้าที่ ใช้กับอาชีพ เช่น 我想当医生" }
flashcards:
