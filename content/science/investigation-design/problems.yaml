  - id: d
    text: มีจานที่ไม่ได้รับแสง
    feedback: จานที่ไม่ได้รับแสงจำเป็น เพราะแสงเป็นตัวแปรต้น
  - id: e
    text: ใช้เมล็ดถั่วเขียว
    feedback: ถั่วเขียวงอกเร็ว เหมาะกับการทดลองนี้
  hints:
  - ตัวแปรต้นคือแสง สิ่งอื่นต้องเหมือนกัน
  - 'ตรวจทีละเรื่อง: น้ำ จำนวนเมล็ด อุณหภูมิ'
  solution: สองจานควรต่างกันเพียงเรื่องแสง ต้องรดน้ำเท่ากันตามเวลา ใช้เมล็ดจำนวนเท่ากัน และวางในที่อุณหภูมิใกล้เคียงกัน รวมทั้งควรทำซ้ำหลายจาน
