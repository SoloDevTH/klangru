problems:
  - id: chemistry.solutions.solution-process-colligative.p001
    topics: [chemistry.solutions.solution-process-colligative]
    difficulty: 1
    type: mcq
    stem: "เปิดขวดน้ำอัดลมแล้วทิ้งไว้ในที่อุ่น ฟองแก๊สหลุดออกมาเร็วขึ้น เพราะเหตุใด"
    choices:
      - { id: a, text: "ความดันในขวดเพิ่มขึ้นเมื่ออุ่น", feedback: "เมื่อเปิดฝา ความดันในขวดลดลงเหลือความดันบรรยากาศ ไม่ได้เพิ่มขึ้น" }
      - { id: b, text: "การละลายของ CO₂ ในน้ำลดลงเมื่ออุณหภูมิสูงขึ้น", correct: true, feedback: "ถูก แก๊สละลายได้น้อยลงเมื่ออุ่น แก๊สที่ละลายอยู่จึงหนีออกมา" }
      - { id: c, text: "การละลายของ CO₂ ในน้ำเพิ่มขึ้นเมื่ออุ่น", feedback: "สำหรับแก๊สส่วนใหญ่ การอุ่นทำให้ละลายได้น้อยลง" }
      - { id: d, text: "น้ำระเหยไปจนเหลือ CO₂ น้อยลง", feedback: "น้ำระเหยเล็กน้อยไม่ใช่สาเหตุหลัก สาเหตุหลักคือการละลายที่ลดลง" }
    hints:
      - "นึกถึงกฎของเฮนรี แก๊สละลายได้มากขึ้นเมื่อใด"
      - "ลองดูว่าอุณหภูมิทำให้การละลายของแก๊สเปลี่ยนไปทางใด"
    solution: "CO₂ ละลายได้น้อยลงเมื่ออุณหภูมิสูงขึ้น แก๊สที่เหลืออยู่จึงหนีออกมาเป็นฟอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.solutions.solution-process-colligative.p002
    topics: [chemistry.solutions.solution-process-colligative]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นคอลลอยด์"
    choices:
      - { id: a, text: "น้ำเกลือ (NaCl ละลายในน้ำ)", feedback: "น้ำเกลือเป็นสารละลาย อนุภาคเล็กกว่า 1 nm" }
      - { id: b, text: "น้ำโคลนที่ตั้งทิ้งไว้แล้วตกตะกอน", feedback: "น้ำโคลนเป็นสารแขวนลอย อนุภาคใหญ่และตกตะกอน" }
      - { id: c, text: "นม", correct: true, feedback: "ถูก นมเป็นอิมัลชันที่ไขมันกระจายตัวในน้ำ จึงกระจายแสงได้" }
      - { id: d, text: "น้ำตาลทรายที่ละลายในน้ำชา", feedback: "น้ำตาลละลายเป็นสารละลายที่ใส ไม่ใช่คอลลอยด์" }
    hints:
      - "คอลลอยด์มีอนุภาคขนาด 1 ถึง 1000 nm ไม่ตกตะกอนง่าย"
      - "นมมีไขมันกระจายตัวอยู่ในน้ำ"
    solution: "นมเป็นอิมัลชัน (ของเหลวในของเหลว) ซึ่งเป็นคอลลอยด์ชนิดหนึ่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.solutions.solution-process-colligative.p003
    topics: [chemistry.solutions.solution-process-colligative]
    difficulty: 2
    type: numeric
    stem: "สมมติว่าที่ความดัน 1.0 atm แก๊สชนิดหนึ่งละลายในน้ำได้ 1.2 g/L ที่อุณหภูมิคงที่ ถ้าความดันเพิ่มเป็น 2.5 atm จะละลายได้กี่ g/L (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 3.0, tolerance: 0.05, unit: "g/L" }
    misconceptions:
      - { match: 0.48, feedback: "หารแทนการคูณ กฎของเฮนรีกำหนดให้ความเข้มข้นเป็นสัดส่วนตรงกับความดัน" }
    hints:
      - "กฎของเฮนรีคือ C = kP ดังนั้น C₂/C₁ = P₂/P₁"
      - "ความเข้มข้นเพิ่มขึ้นเท่ากับอัตราส่วนของความดัน"
    solution: "C₂ = C₁ × (P₂ / P₁) = 1.2 × (2.5 / 1.0) = **3.0 g/L** (ค่าสมมติ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.solutions.solution-process-colligative.p004
    topics: [chemistry.solutions.solution-process-colligative]
    difficulty: 2
    type: numeric
    stem: "ละลายซูโครส (C₁₂H₂₂O₁₁) 34.2 g ในน้ำ 500 g (มวลอะตอม C 12.011, H 1.008, O 15.999; M = 342.3 g/mol) จุดเดือดของสารละลายเพิ่มขึ้นกี่ °C (K_b ของน้ำ = 0.512 °C·kg/mol) ตอบทศนิยม 3 ตำแหน่ง"
    answer: { value: 0.102, tolerance: 0.002, unit: "°C" }
    misconceptions:
      - { match: 0.372, feedback: "ใช้ K_f แทน K_b ซึ่งเป็นค่าของการเยือกแข็ง ไม่ใช่การเดือด" }
      - { match: 0.0001, feedback: "ใช้มวลน้ำ 500 g เป็น 500 kg ทำให้โมแลลิตีเล็กเกินไป" }
    hints:
      - "หาจำนวนโมลของซูโครสก่อน: 34.2 / 342.3"
      - "แปลงมวลน้ำเป็นกิโลกรัมแล้วหาโมแลลิตี"
    solution: "n = 34.2 / 342.3 = 0.0999 mol โมแลลิตี m = 0.0999 / 0.500 = 0.1998 mol/kg ΔT_b = 0.512 × 0.1998 × 1 = **0.102 °C**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.solutions.solution-process-colligative.p005
    topics: [chemistry.solutions.solution-process-colligative]
    difficulty: 2
    type: numeric
    stem: "ละลาย NaCl 5.85 g ในน้ำ 500 g (มวลอะตอม Na 22.990, Cl 35.45; M = 58.44 g/mol) จุดเยือกแข็งลดลงกี่ °C (K_f = 1.86 °C·kg/mol) ตอบทศนิยม 3 ตำแหน่ง"
    answer: { value: 0.745, tolerance: 0.005, unit: "°C" }
    misconceptions:
      - { match: 0.372, feedback: "ลืมตัวประกอบ i = 2 ของ NaCl ซึ่งแตกเป็น Na⁺ และ Cl⁻" }
    hints:
      - "NaCl แตกตัวเป็นสองอนุภาคในน้ำ"
      - "คำนวณ m = n / kg ของน้ำ แล้วคูณ K_f และ i"
    solution: "n = 5.85 / 58.44 = 0.1001 mol, m = 0.1001 / 0.500 = 0.2002 mol/kg, i = 2 ΔT_f = 1.86 × 0.2002 × 2 = **0.745 °C**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.solutions.solution-process-colligative.p006
    topics: [chemistry.solutions.solution-process-colligative]
    difficulty: 3
    type: numeric
    stem: "น้ำเกลือ 0.9% NaCl (9 g NaCl ในสารละลาย 1 L; M = 58.44 g/mol) ที่ 298 K มีความดันออสโมติกประมาณกี่ atm (ใช้ R = 0.08206 L·atm/(mol·K) ตอบทศนิยม 2 ตำแหน่ง) ตัวเลขนี้ใช้เพื่อการคำนวณเท่านั้น"
    answer: { value: 7.54, tolerance: 0.02, unit: "atm" }
    misconceptions:
      - { match: 3.77, feedback: "ลืมตัวประกอบ i = 2 ของ NaCl" }
    hints:
      - "หาความเข้มข้นโมลาร์ของ NaCl ก่อนจาก 9 g/L"
      - "ใช้ π = iMRT โดย i = 2"
    solution: "M = 9 / 58.44 = 0.1540 mol/L, π = 2 × 0.1540 × 0.08206 × 298 = **7.54 atm**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.solutions.solution-process-colligative.p007
    topics: [chemistry.solutions.solution-process-colligative]
    difficulty: 3
    type: numeric
    stem: "กลูโคส (C₆H₁₂O₆; M = 180.16 g/mol) 10.0 g ละลายในน้ำ 250 g ที่ 25 °C ความดันไอของน้ำในสารละลายเป็นกี่ torr ถ้าความดันไอของน้ำบริสุทธิ์ที่ 25 °C คือ 23.7 torr (มวลอะตอม H 1.008 และ O 15.999) ตอบทศนิยม 1 ตำแหน่ง"
    answer: { value: 23.6, tolerance: 0.05, unit: "torr" }
    misconceptions:
      - { match: 0.094, feedback: "ใช้เศษส่วนโมลของกลูโคส (ตัวถูกละลาย) แทนตัวทำละลาย" }
    hints:
      - "คำนวณจำนวนโมลของกลูโคสและน้ำ (น้ำ M = 18.015 g/mol)"
      - "ความดันไอใช้เศษส่วนโมลของน้ำ ไม่ใช่ของกลูโคส"
    solution: "n(กลูโคส) = 10.0 / 180.16 = 0.0555 mol, n(น้ำ) = 250 / 18.015 = 13.877 mol X(น้ำ) = 13.877 / 13.933 = 0.9960 P = 0.9960 × 23.7 = **23.6 torr**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.solutions.solution-process-colligative.p008
    topics: [chemistry.solutions.solution-process-colligative]
    difficulty: 2
    type: order
    stem: "เรียงสารละลายที่มีความเข้มข้น 1.0 mol/kg เท่ากัน จากจุดเดือดต่ำไปสูง"
    items: ["กลูโคส 1.0 m", "NaCl 1.0 m", "CaCl₂ 1.0 m"]
    hints:
      - "จุดเดือดขึ้นกับจำนวนอนุภาคทั้งหมด ไม่ขึ้นกับชนิดของอนุภาค"
      - "CaCl₂ แตกได้สามอนุภาคต่อหนึ่งหน่วยสูตร"
    solution: "กลูโคส i = 1, NaCl i ≈ 2, CaCl₂ i ≈ 3 จุดเดือดของ CaCl₂ สูงที่สุด จึงเรียงได้ กลูโคส < NaCl < CaCl₂"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.solutions.solution-process-colligative.p009
    topics: [chemistry.solutions.solution-process-colligative]
    difficulty: 2
    type: match
    stem: "จับคู่ชนิดของคอลลอยด์กับตัวอย่าง"
    pairs:
      - { left: "โซล (ของแข็งกระจายในของเหลว)", right: "สีน้ำ" }
      - { left: "อิมัลชัน (ของเหลวกระจายในของเหลว)", right: "นม" }
      - { left: "โฟม (แก๊สกระจายในของเหลว)", right: "วิปครีม" }
      - { left: "แอโรซอล (ของเหลวกระจายในแก๊ส)", right: "สเปรย์ฉีดผม" }
    hints:
      - "ดูว่าสถานะของอนุภาคที่กระจายและตัวกลางคืออะไร"
      - "นมมีไขมันเป็นหยดกระจายอยู่ในน้ำ"
    solution: "โซลตรงกับสีน้ำ อิมัลชันตรงกับนม โฟมตรงกับวิปครีม และแอโรซอลตรงกับสเปรย์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.solutions.solution-process-colligative.p010
    topics: [chemistry.solutions.solution-process-colligative]
    difficulty: 2
    type: text
    stem: "คอลลอยด์ที่ของเหลวหนึ่งกระจายตัวอยู่ในของเหลวอีกชนิดซึ่งไม่เข้ากัน เรียกว่าอะไร"
    accepted: ["อิมัลชัน", "อิมัลชั่น", "emulsion"]
    misconceptions:
      - { match: "โซล", feedback: "โซลเป็นของแข็งกระจายในของเหลว ไม่ใช่ของเหลวในของเหลว" }
    hints:
      - "นมและน้ำสลัดมีชนิดคอลลอยด์แบบนี้"
      - "คำนี้ลงท้ายด้วยคำที่ใช้เรียกการผสมของสองของเหลว"
    solution: "ของเหลวในของเหลวเรียกว่า **อิมัลชัน (emulsion)**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.solutions.solution-process-colligative.p011
    topics: [chemistry.solutions.solution-process-colligative]
    difficulty: 3
    type: mcq
    stem: "สบู่ช่วยให้น้ำมันกระจายตัวในน้ำได้ เพราะเหตุใด"
    choices:
      - { id: a, text: "สบู่ทำให้น้ำมันละลายเป็นสารละลายที่ใส", feedback: "สบู่ไม่ได้ทำให้น้ำมันละลายจนใส แต่ช่วยให้หยดน้ำมันกระจายตัว" }
      - { id: b, text: "โมเลกุลสบู่มีทั้งส่วนชอบน้ำและส่วนชอบน้ำมัน จึงล้อมหยดน้ำมันให้กระจายในน้ำได้", correct: true, feedback: "ถูก อิมัลซิไฟเออร์ทำให้แรงตึงระหว่างน้ำมันกับน้ำลดลงและกระจายหยดน้ำมัน" }
      - { id: c, text: "สบู่ทำให้น้ำมันหนักขึ้นจนลอยได้", feedback: "มวลไม่ได้เป็นสาเหตุ สาเหตุคือโครงสร้างโมเลกุลที่มีสองส่วน" }
      - { id: d, text: "สบู่ทำให้น้ำร้อนขึ้นจนน้ำมันกระจาย", feedback: "อุณหภูมิไม่ใช่สาเหตุหลักของการกระจายตัว" }
    hints:
      - "นึกถึงโมเลกุลอิมัลซิไฟเออร์ที่มีสองด้าน"
      - "ด้านหนึ่งเข้ากับน้ำได้ อีกด้านเข้ากับน้ำมันได้"
    solution: "โมเลกุลสบู่มีปลายชอบน้ำและปลายชอบน้ำมัน จึงห่อหุ้มหยดน้ำมันไว้ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.solutions.solution-process-colligative.p012
    topics: [chemistry.solutions.solution-process-colligative]
    difficulty: 3
    type: mcq
    stem: "เหตุใดการกรองน้ำทะเลด้วยออสโมซิสผันกลับต้องใช้ความดันสูง"
    choices:
      - { id: a, text: "เพราะน้ำทะเลมีความดันไอต่ำกว่าน้ำจืด", feedback: "ความดันไอไม่ใช่สาเหตุหลักของการใช้ความดันสูง" }
      - { id: b, text: "เพราะต้องเอาชนะความดันออสโมติกของน้ำเค็มเพื่อบังคับให้น้ำบริสุทธิ์ไหลผ่านเยื่อ", correct: true, feedback: "ถูก น้ำจืดจะไหลเข้าสู่น้ำเค็มเองตามธรรมชาติ ต้องใช้ความดันเกินค่าออสโมติกเพื่อให้ไหลกลับทาง" }
      - { id: c, text: "เพราะน้ำทะเลมีจุดเดือดสูงกว่า", feedback: "จุดเดือดไม่เกี่ยวกับการกรองแบบออสโมซิส" }
      - { id: d, text: "เพราะเยื่อกรองต้องทำให้น้ำร้อน", feedback: "การกรองแบบนี้ไม่ได้ใช้ความร้อนเป็นหลัก" }
    hints:
      - "ออสโมซิสตามธรรมชาติไหลจากทางใด"
      - "ออสโมซิสผันกลับคือการทำให้ไหลทางตรงข้าม"
    solution: "น้ำจืดจะไหลเข้าน้ำเค็มเองตามธรรมชาติ จึงต้องใช้ความดันมากกว่าความดันออสโมติกเพื่อดันทิศทางกลับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.solutions.solution-process-colligative.p013
    topics: [chemistry.solutions.solution-process-colligative]
    difficulty: 4
    type: numeric
    stem: "สมมติว่า CaCl₂ 0.10 mol/kg แตกตัวสมบูรณ์เป็นสามอนุภาค (i = 3) จุดเดือดของสารละลายในน้ำจะเพิ่มขึ้นกี่ °C (K_b = 0.512 °C·kg/mol) ตอบทศนิยม 3 ตำแหน่ง"
    answer: { value: 0.154, tolerance: 0.002, unit: "°C" }
    misconceptions:
      - { match: 0.051, feedback: "ลืมตัวประกอบ i = 3" }
    hints:
      - "ΔT_b = K_b · m · i"
      - "i = 3 เพราะ CaCl₂ แตกเป็น Ca²⁺ กับ Cl⁻ สองตัว"
    solution: "ΔT_b = 0.512 × 0.10 × 3 = **0.154 °C**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.solutions.solution-process-colligative.p014
    topics: [chemistry.solutions.solution-process-colligative]
    difficulty: 4
    type: numeric
    stem: "เอทิลีนไกลคอล (C₂H₆O₂; M = 62.07 g/mol) หนัก 300 g ละลายในน้ำ 1.00 kg (ไม่แตกตัว) จุดเยือกแข็งของสารละลายเป็นกี่ °C (K_f = 1.86 °C·kg/mol) ตอบทศนิยม 1 ตำแหน่ง"
    answer: { value: -9.0, tolerance: 0.1, unit: "°C" }
    misconceptions:
      - { match: -4.8, feedback: "ลืมคูณด้วย K_f และได้ค่าโมแลลิตีเป็นค่าของการลดลงของจุดเยือกแข็ง" }
    hints:
      - "หา m = (300 / 62.07) / 1.00"
      - "ΔT_f = K_f · m · i โดย i = 1 เพราะไม่แตกตัว"
    solution: "m = 4.833 mol/kg ΔT_f = 1.86 × 4.833 × 1 = 8.99 °C จุดเยือกแข็ง = 0.0 − 8.99 = **−9.0 °C**"
    license: CC-BY-SA-4.0
