      - { match: 2216.51, feedback: "เครื่องหมายผิด $\\cos 210^\\circ$ เป็นลบ แนวชี้ไปทางใต้ $N$ จึงลดลง" }
      - { match: 1875, feedback: "ใช้ $\\sin$ กับ $\\Delta N$ ได้ $250\\sin 210^\\circ = -125$ ซึ่งคือ $\\Delta E$" }
    hints:
      - "$\\Delta N = L\\cos\\alpha$ เครื่องหมายมาจากโคไซน์เอง"
      - "$\\cos 210^\\circ = -\\cos 30^\\circ$"
    solution: "$\\Delta N = 250\\cos 210^\\circ = -216.506\\ \\mathrm{m}$ จึงได้ $N_B = 2000.000 - 216.506 = 1783.49\\ \\mathrm{m}$ (และ $\\Delta E = 250\\sin 210^\\circ = -125\\ \\mathrm{m}$, $E_B = 875.000\\ \\mathrm{m}$)"
