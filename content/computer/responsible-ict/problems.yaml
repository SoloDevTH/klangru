problems:
  - id: computer.society.responsible-ict.p001
    topics: [computer.society.responsible-ict]
    difficulty: 1
    type: mcq
    stem: "บีมวาดการ์ตูนลงในแท็บเล็ตเสร็จเมื่อวาน ยังไม่ได้ไปจดทะเบียนที่ไหนเลย ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "บีมมีลิขสิทธิ์ในภาพนั้นแล้ว เพราะลิขสิทธิ์เกิดทันทีที่สร้างงาน", correct: true }
      - { id: b, text: "ยังไม่มีลิขสิทธิ์จนกว่าจะจดทะเบียน", feedback: "กฎหมายลิขสิทธิ์ไทยให้ความคุ้มครองทันทีที่สร้างงาน ไม่ต้องจดทะเบียน" }
      - { id: c, text: "ภาพที่วาดด้วยคอมพิวเตอร์ไม่มีลิขสิทธิ์", feedback: "เครื่องมือที่ใช้ไม่สำคัญ งานที่สร้างสรรค์เองมีลิขสิทธิ์ทั้งที่วาดบนกระดาษและบนแท็บเล็ต" }
      - { id: d, text: "ต้องใส่เครื่องหมาย © ก่อน จึงจะมีลิขสิทธิ์", feedback: "เครื่องหมาย © ช่วยบอกผู้อื่น แต่ไม่จำเป็นต่อการมีลิขสิทธิ์" }
    hints:
      - "ลิขสิทธิ์ต่างจากสิทธิบัตรตรงที่ไม่ต้องยื่นคำขอ"
      - "ลิขสิทธิ์เริ่มเมื่อใด"
    solution: "ตาม พ.ร.บ.ลิขสิทธิ์ ลิขสิทธิ์เกิดขึ้นทันทีที่ผู้สร้างสรรค์สร้างงาน ไม่ต้องจดทะเบียนและไม่ต้องใส่ © ภาพของบีมจึงมีลิขสิทธิ์แล้ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.responsible-ict.p002
    topics: [computer.society.responsible-ict]
    difficulty: 1
    type: match
    stem: "จับคู่ส่วนของสัญญาอนุญาตครีเอทีฟคอมมอนส์กับความหมาย"
    pairs:
      - { left: "BY", right: "ต้องให้เครดิตผู้สร้าง" }
      - { left: "SA", right: "งานดัดแปลงต้องใช้สัญญาเดียวกัน" }
      - { left: "NC", right: "ห้ามใช้เพื่อการค้า" }
      - { left: "ND", right: "ห้ามดัดแปลง" }
    hints:
      - "BY มาจาก attribution คือแสดงที่มา NC มาจาก non-commercial"
      - "SA มาจาก share-alike ND มาจาก no derivatives"
    solution: "BY = แสดงที่มา (ให้เครดิต), SA = อนุญาตแบบเดียวกัน, NC = ไม่ใช้เพื่อการค้า, ND = ห้ามดัดแปลง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.responsible-ict.p003
    topics: [computer.society.responsible-ict]
    difficulty: 2
    type: mcq
    stem: "แพรใช้ภาพ \"ตลาดน้ำยามเช้า\" ของ ภูผา ใจงาม จาก photos.example/12345 ซึ่งใช้สัญญา CC BY 4.0 ในรายงาน ควรเขียนเครดิตแบบใด"
    choices:
      - { id: a, text: "\"ตลาดน้ำยามเช้า\" โดย ภูผา ใจงาม จาก photos.example/12345 สัญญา CC BY 4.0", correct: true }
      - { id: b, text: "ภาพจากอินเทอร์เน็ต", feedback: "ไม่บอกชื่องาน ผู้สร้าง แหล่งที่มา และสัญญา ผู้อ่านตามไปหาต้นฉบับไม่ได้" }
      - { id: c, text: "ภาพโดย แพร", feedback: "แพรไม่ได้ถ่ายภาพนี้ การใส่ชื่อตัวเองคือการแอบอ้างผลงานผู้อื่น" }
      - { id: d, text: "ขอบคุณเจ้าของภาพ", feedback: "สุภาพแต่ไม่บอกว่าเจ้าของคือใคร มาจากไหน และใช้สัญญาใด" }
    hints:
      - "เครดิตที่ดีมี 4 ส่วน: ชื่องาน ผู้สร้าง แหล่งที่มา สัญญาอนุญาต"
      - "ข้อใดมีครบทั้ง 4 ส่วน"
    solution: "เครดิตที่ครบต้องมีชื่องาน (ตลาดน้ำยามเช้า) ผู้สร้าง (ภูผา ใจงาม) แหล่งที่มา (photos.example/12345) และสัญญา (CC BY 4.0) ซึ่งตรงกับข้อ ก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.responsible-ict.p004
    topics: [computer.society.responsible-ict]
    difficulty: 2
    type: mcq
    stem: "นักเรียนต้องการเพลงประกอบเกมที่จะนำไปขายในงานตลาดนัดของโรงเรียน เพลงใดใช้ได้โดยไม่ต้องขออนุญาตเพิ่ม"
    choices:
      - { id: a, text: "เพลงที่เจ้าของประกาศเป็น CC0", correct: true }
      - { id: b, text: "เพลงฮิตที่ดาวน์โหลดจากเว็บแชร์ไฟล์", feedback: "เพลงทั่วไปมีลิขสิทธิ์ การนำไปใช้ในเกมที่ขายต้องได้รับอนุญาตจากเจ้าของ" }
      - { id: c, text: "เพลงที่ใช้สัญญา CC BY-NC", feedback: "NC ห้ามใช้เพื่อการค้า เกมที่นำไปขายจึงใช้ไม่ได้" }
      - { id: d, text: "เพลงที่ใช้สัญญา CC BY-ND แล้วตัดมาเฉพาะท่อนฮุก", feedback: "ND ห้ามดัดแปลง การตัดท่อนมาเรียบเรียงใหม่ในเกมถือเป็นการดัดแปลง" }
    hints:
      - "เกมนี้จะนำไปขาย จึงเป็นการใช้เพื่อการค้า"
      - "หาสื่อที่ไม่มีเงื่อนไขห้ามการค้าหรือห้ามดัดแปลง"
    solution: "CC0 คือเจ้าของยกงานให้เป็นสาธารณะ ใช้ได้ทุกแบบรวมถึงการค้า (ให้เครดิตเป็นมารยาทที่ดี) ส่วน NC ห้ามการค้า ND ห้ามดัดแปลง และเพลงทั่วไปต้องขออนุญาต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.responsible-ict.p005
    topics: [computer.society.responsible-ict]
    difficulty: 2
    type: numeric
    stem: "นักเขียนคนหนึ่งเขียนนิยายเมื่อ พ.ศ. 2500 และเสียชีวิตใน พ.ศ. 2520 ตาม พ.ร.บ.ลิขสิทธิ์ (ตลอดอายุผู้สร้างสรรค์และอีก 50 ปีหลังเสียชีวิต นับถึงสิ้นปีปฏิทิน) ลิขสิทธิ์ในนิยายเรื่องนี้หมดอายุเมื่อสิ้นปี พ.ศ. ใด"
    answer: { value: 2570 }
    hints:
      - "อายุลิขสิทธิ์นับจากปีที่ผู้สร้างสรรค์เสียชีวิต ไม่ใช่ปีที่เขียน"
      - "บวก 50 ปีเข้ากับปีที่เสียชีวิต"
    misconceptions:
      - { match: 2550, feedback: "นับ 50 ปีจากปีที่เขียน (2500) แต่กฎหมายนับจากปีที่ผู้สร้างสรรค์เสียชีวิต" }
      - { match: 2540, feedback: "นับแค่ 20 ปีหลังเสียชีวิต กฎหมายไทยคุ้มครองต่ออีก 50 ปี" }
    solution: "งานของบุคคลคุ้มครองตลอดชีวิตผู้สร้างสรรค์และอีก 50 ปีหลังเสียชีวิต 2520 + 50 = 2570 ลิขสิทธิ์จึงหมดเมื่อสิ้นปี พ.ศ. 2570 หลังจากนั้นนิยายเป็นสาธารณสมบัติ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.responsible-ict.p006
    topics: [computer.society.responsible-ict]
    difficulty: 2
    type: match
    stem: "จับคู่การกระทำกับมาตราของ พ.ร.บ.ว่าด้วยการกระทำความผิดเกี่ยวกับคอมพิวเตอร์ที่เกี่ยวข้องมากที่สุด"
    pairs:
      - { left: "แอบใช้รหัสผ่านของเพื่อนเข้าบัญชีเกม", right: "มาตรา 5 เข้าระบบที่มีมาตรการป้องกันโดยมิชอบ" }
      - { left: "ปล่อยโปรแกรมที่ทำให้เว็บไซต์ของโรงเรียนล่ม", right: "มาตรา 10 ทำให้ระบบของผู้อื่นทำงานตามปกติไม่ได้" }
      - { left: "ส่งต่อข่าวปลอมเรื่องเขื่อนแตกทั้งที่รู้ว่าไม่จริง จนคนแตกตื่น", right: "มาตรา 14 ข้อมูลเท็จและการส่งต่อโดยรู้อยู่แล้ว" }
      - { left: "ตัดต่อภาพเพื่อนให้ดูน่าอับอายแล้วโพสต์ในกลุ่มสาธารณะ", right: "มาตรา 16 ภาพของผู้อื่นที่ตัดต่อให้เสียชื่อเสียง" }
    hints:
      - "มาตรา 5 เกี่ยวกับการเข้า มาตรา 10 เกี่ยวกับการทำให้ระบบใช้ไม่ได้"
      - "มาตรา 14 เกี่ยวกับเนื้อหาเท็จ มาตรา 16 เกี่ยวกับภาพของผู้อื่น"
    solution: "ใช้รหัสผ่านคนอื่น = มาตรา 5, ทำให้เว็บล่ม = มาตรา 10, ส่งต่อข่าวเท็จที่ทำให้ประชาชนตื่นตระหนกโดยรู้อยู่แล้ว = มาตรา 14, ตัดต่อภาพให้อับอาย = มาตรา 16"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.responsible-ict.p007
    topics: [computer.society.responsible-ict]
    difficulty: 3
    type: mcq
    stem: "ต้นได้รับข้อความในกลุ่มแชตว่า \"พรุ่งนี้น้ำประปาทั้งจังหวัดมีสารพิษ ห้ามดื่ม\" ต้นสงสัยว่าไม่จริง ข้อใดเป็นการกระทำที่รับผิดชอบที่สุด"
    choices:
      - { id: a, text: "ไม่ส่งต่อ ตรวจกับแหล่งทางการ เช่น หน่วยงานประปาหรือศูนย์ต่อต้านข่าวปลอม แล้วบอกในกลุ่มว่าข่าวนี้ยังไม่ได้รับการยืนยัน", correct: true }
      - { id: b, text: "ส่งต่อทันทีเผื่อเป็นเรื่องจริง", feedback: "ถ้าข่าวเป็นเท็จจะทำให้คนตื่นตระหนก และการส่งต่อข้อมูลเท็จโดยรู้อยู่แล้วอาจผิดมาตรา 14" }
      - { id: c, text: "ส่งต่อพร้อมเขียนว่า \"ไม่รู้จริงไหม\"", feedback: "การเขียนแบบนี้ยังทำให้ข่าวเท็จแพร่ไปและสร้างความตื่นตระหนก" }
      - { id: d, text: "ลบข้อความแล้วไม่ทำอะไรต่อ", feedback: "ไม่ผิด แต่ยังไม่ช่วยคนอื่นในกลุ่มที่อาจเชื่อข่าวนี้" }
    hints:
      - "คิดถึงผลต่อคนจำนวนมากถ้าข่าวนี้เป็นเท็จ"
      - "การกระทำที่ดีที่สุดทั้งไม่เพิ่มการแพร่กระจายและช่วยหาความจริง"
    solution: "ข่าวที่อาจทำให้ประชาชนตื่นตระหนกต้องตรวจก่อนแชร์ การส่งต่อข้อมูลเท็จโดยรู้อยู่แล้วเป็นความผิดตามมาตรา 14 (5) การตรวจกับแหล่งทางการแล้วเตือนในกลุ่มจึงรับผิดชอบที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.responsible-ict.p008
    topics: [computer.society.responsible-ict]
    difficulty: 3
    type: mcq
    stem: "ชมรมถ่ายภาพจะทำโปสเตอร์ **ขาย** หาทุนไปทัศนศึกษา โดยอยากใช้ภาพตามหน้าข้อมูลในภาพ ข้อใดถูกต้อง"
    figure:
      src: photo-card.svg
      alt: "หน้าข้อมูลภาพถ่ายบนเว็บไซต์แจกภาพสมมติ ภาพชื่อ ตลาดน้ำยามเช้า ผู้ถ่ายภาพ ภูผา ใจงาม อัปโหลด 12 มีนาคม 2567 สัญญาอนุญาต CC BY-NC-SA 4.0 ที่อยู่ภาพ photos.example/12345 ใต้ภาพเขียนว่าชื่อบุคคลและเว็บไซต์เป็นชื่อสมมติ"
    choices:
      - { id: a, text: "ใช้ไม่ได้ถ้าไม่ได้รับอนุญาตเพิ่ม เพราะสัญญามี NC ห้ามใช้เพื่อการค้า", correct: true }
      - { id: b, text: "ใช้ได้ถ้าให้เครดิตครบ", feedback: "การให้เครดิตทำตามเงื่อนไข BY เท่านั้น แต่ NC ยังห้ามการขาย" }
      - { id: c, text: "ใช้ได้เพราะชมรมเป็นของโรงเรียน ไม่ใช่บริษัท", feedback: "การขายโปสเตอร์เป็นการใช้หารายได้ ไม่ว่าผู้ขายจะเป็นใคร" }
      - { id: d, text: "ใช้ได้ถ้าดัดแปลงสีของภาพก่อน", feedback: "การดัดแปลงไม่ได้ลบเงื่อนไข NC และงานดัดแปลงต้องใช้สัญญาเดิม (SA) ด้วย" }
    hints:
      - "อ่านสัญญาอนุญาตของภาพทีละส่วน: BY, NC, SA"
      - "ขายโปสเตอร์ถือเป็นการใช้แบบใด"
    solution: "สัญญา CC BY-NC-SA ห้ามใช้เพื่อการค้า (NC) การพิมพ์โปสเตอร์ขายจึงใช้ไม่ได้ ชมรมต้องขออนุญาตช่างภาพ หรือหาภาพที่ใช้ CC BY, CC BY-SA หรือ CC0 แทน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.responsible-ict.p009
    topics: [computer.society.responsible-ict]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการนำไลบรารีโอเพนซอร์สจากอินเทอร์เน็ตมาใช้ในโปรแกรมที่จะเผยแพร่"
    items:
      - "อ่านสัญญาอนุญาตของไลบรารี"
      - "ตรวจว่าสัญญานั้นเข้ากับสัญญาที่เราจะใช้กับโปรแกรมได้"
      - "นำไลบรารีมาใช้โดยคงข้อความลิขสิทธิ์และสัญญาเดิมไว้"
      - "เขียนเครดิตในคอมเมนต์หรือไฟล์ README ว่าใช้อะไร จากไหน"
      - "เผยแพร่โปรแกรมตามเงื่อนไขของสัญญา"
    hints:
      - "ต้องรู้เงื่อนไขก่อนตัดสินใจใช้"
      - "การเผยแพร่เป็นขั้นสุดท้าย หลังทำทุกอย่างให้ครบเงื่อนไขแล้ว"
    solution: "อ่านสัญญา → ตรวจว่าเข้ากันได้ → ใช้โดยคงข้อความลิขสิทธิ์ → เขียนเครดิต → เผยแพร่ตามเงื่อนไข"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.responsible-ict.p010
    topics: [computer.society.responsible-ict]
    difficulty: 3
    type: mcq
    stem: "ทีมของภูมิเขียนแอปแล้วจะเผยแพร่ให้คนดาวน์โหลด ในแอปใช้ไลบรารีที่ใช้สัญญา GPL ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "เมื่อเผยแพร่แอปที่รวมโค้ด GPL ต้องเปิดซอร์สโค้ดของแอปภายใต้สัญญา GPL ด้วย", correct: true }
      - { id: b, text: "ใช้ได้ทุกแบบโดยไม่มีเงื่อนไข เพราะเป็นโอเพนซอร์ส", feedback: "โอเพนซอร์สทุกแบบมีเงื่อนไข GPL เป็นแบบ copyleft ที่บังคับให้งานที่เผยแพร่ต่อใช้ GPL" }
      - { id: c, text: "เปลี่ยนชื่อไลบรารีแล้วปิดซอร์สได้", feedback: "การเปลี่ยนชื่อไม่ได้ยกเลิกเงื่อนไขของสัญญา และอาจเป็นการลอกงาน" }
      - { id: d, text: "ต้องจ่ายเงินให้ผู้สร้างไลบรารีทุกครั้ง", feedback: "GPL ไม่ได้บังคับจ่ายเงิน เงื่อนไขหลักคือเปิดซอร์สเมื่อเผยแพร่" }
    hints:
      - "GPL เป็นสัญญาแบบ copyleft"
      - "copyleft บังคับเรื่องใดเมื่อนำโค้ดไปเผยแพร่ต่อ"
    solution: "GPL เป็นสัญญาแบบ copyleft ถ้าเผยแพร่โปรแกรมที่รวมโค้ด GPL ต้องให้ซอร์สโค้ดภายใต้ GPL ด้วย ถ้าทีมไม่ต้องการเปิดซอร์ส ควรเลือกไลบรารีที่ใช้สัญญาผ่อนปรน เช่น MIT"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.responsible-ict.p011
