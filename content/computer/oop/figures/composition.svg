<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="sans-serif" font-size="15">
  <title>วัตถุ cart ของคลาส Cart มีแอตทริบิวต์ items เป็นลิสต์ของวัตถุ Item สองตัว ดินสอ ราคา 6 จำนวน 5 subtotal 30 และสมุด ราคา 15 จำนวน 3 subtotal 45 cart.total() รวมได้ 75</title>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
  <rect x="20.0" y="80.0" width="230.0" height="130.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="135.0" y="110.0" font-size="17" text-anchor="middle" fill="#b45309" font-weight="bold" font-family="monospace" xml:space="preserve">cart : Cart</text>
  <text x="36.0" y="145.0" font-size="15" text-anchor="start" fill="#111827" font-family="monospace" xml:space="preserve">items = [ ... ]</text>
  <text x="36.0" y="180.0" font-size="15" text-anchor="start" fill="#111827" font-family="monospace" xml:space="preserve">total() → 75</text>
  <rect x="400.0" y="30.0" width="330.0" height="110.0" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="416.0" y="58.0" font-size="16" text-anchor="start" fill="#1d4ed8" font-weight="bold" font-family="monospace" xml:space="preserve">Item</text>
  <text x="416.0" y="86.0" font-size="14" text-anchor="start" fill="#111827" font-family="monospace" xml:space="preserve">name="ดินสอ" price=6 qty=5</text>
  <text x="416.0" y="116.0" font-size="14" text-anchor="start" fill="#111827" font-family="monospace" xml:space="preserve">subtotal() → 30</text>
  <line x1="252.0" y1="145.0" x2="396.0" y2="85.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="400.0" y="165.0" width="330.0" height="110.0" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="416.0" y="193.0" font-size="16" text-anchor="start" fill="#1d4ed8" font-weight="bold" font-family="monospace" xml:space="preserve">Item</text>
  <text x="416.0" y="221.0" font-size="14" text-anchor="start" fill="#111827" font-family="monospace" xml:space="preserve">name="สมุด" price=15 qty=3</text>
  <text x="416.0" y="251.0" font-size="14" text-anchor="start" fill="#111827" font-family="monospace" xml:space="preserve">subtotal() → 45</text>
  <line x1="252.0" y1="145.0" x2="396.0" y2="220.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <text x="380.0" y="292.0" font-size="14" text-anchor="middle" fill="#4b5563" xml:space="preserve">total() เรียก subtotal() ของทุก Item แล้วรวม: 30 + 45 = 75</text>
  <text x="318.0" y="150.0" font-size="15" text-anchor="middle" fill="#4b5563" xml:space="preserve">มี</text>
</svg>
