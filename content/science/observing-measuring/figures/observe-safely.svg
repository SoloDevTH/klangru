<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" font-family="sans-serif">
<title>ความปลอดภัยเมื่อสังเกต: ไม่ชิม ไม่ดมตรง ๆ และไม่มองดวงอาทิตย์</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect x="0" y="0" width="840" height="300" fill="#ffffff"/>
<rect x="20" y="16" width="260" height="268" rx="12" fill="none" stroke="#333" stroke-width="2"/><text x="150" y="50" font-size="17" font-weight="bold" text-anchor="middle" fill="#222">ห้ามชิม ห้ามดมตรง ๆ</text><text x="150" y="72" font-size="15" text-anchor="middle" fill="#222">สารที่ไม่รู้จัก</text><rect x="112" y="128" width="32" height="26" fill="#d6e4f0" stroke="#333" stroke-width="2"/><rect x="96" y="152" width="64" height="100" rx="10" fill="#d6e4f0" stroke="#333" stroke-width="2"/><text x="128" y="215" font-size="36" font-weight="bold" text-anchor="middle" fill="#333">?</text><circle cx="236" cy="92" r="22" fill="none" stroke="#c0392b" stroke-width="5"/><line x1="220.6" y1="107.4" x2="251.4" y2="76.6" stroke="#c0392b" stroke-width="5"/><text x="150" y="272" font-size="14" text-anchor="middle" fill="#333">ไม่รู้ว่าเป็นอะไร ห้ามชิมและห้ามก้มดม</text><rect x="290" y="16" width="260" height="268" rx="12" fill="none" stroke="#333" stroke-width="2"/><text x="420" y="50" font-size="17" font-weight="bold" text-anchor="middle" fill="#222">ทำได้: โบกกลิ่น</text><text x="420" y="72" font-size="15" text-anchor="middle" fill="#222">เข้าหาจมูกเบา ๆ</text><rect x="322" y="148" width="26" height="22" fill="#d6e4f0" stroke="#333" stroke-width="2"/><rect x="312" y="168" width="46" height="72" rx="8" fill="#d6e4f0" stroke="#333" stroke-width="2"/><circle cx="470" cy="170" r="42" fill="#f5d0b0" stroke="#333" stroke-width="2"/><polygon points="428,160 412,178 428,184" fill="#f5d0b0" stroke="#333" stroke-width="2"/><circle cx="470" cy="150" r="3" fill="#333"/><path d="M 368 180 Q 390 150 408 178" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#ar)"/><path d="M 380 160 q 6 -10 0 -20" fill="none" stroke="#666" stroke-width="2"/><path d="M 395 160 q 6 -10 0 -20" fill="none" stroke="#666" stroke-width="2"/><circle cx="520" cy="92" r="22" fill="none" stroke="#1e8449" stroke-width="5"/><polyline points="510,92 517,100 531,83" fill="none" stroke="#1e8449" stroke-width="5"/><text x="420" y="262" font-size="14" text-anchor="middle" fill="#333">ให้กลิ่นลอยเข้าหาจมูก</text><rect x="560" y="16" width="260" height="268" rx="12" fill="none" stroke="#333" stroke-width="2"/><text x="690" y="50" font-size="17" font-weight="bold" text-anchor="middle" fill="#222">ห้ามมองดวงอาทิตย์</text><text x="690" y="72" font-size="15" text-anchor="middle" fill="#222">ตรง ๆ แม้ชั่วครู่</text><circle cx="622" cy="170" r="34" fill="#f7c948" stroke="#333" stroke-width="2"/><line x1="666.0" y1="170.0" x2="678.0" y2="170.0" stroke="#d68910" stroke-width="4"/><line x1="653.1" y1="201.1" x2="661.6" y2="209.6" stroke="#d68910" stroke-width="4"/><line x1="622.0" y1="214.0" x2="622.0" y2="226.0" stroke="#d68910" stroke-width="4"/><line x1="590.9" y1="201.1" x2="582.4" y2="209.6" stroke="#d68910" stroke-width="4"/><line x1="578.0" y1="170.0" x2="566.0" y2="170.0" stroke="#d68910" stroke-width="4"/><line x1="590.9" y1="138.9" x2="582.4" y2="130.4" stroke="#d68910" stroke-width="4"/><line x1="622.0" y1="126.0" x2="622.0" y2="114.0" stroke="#d68910" stroke-width="4"/><line x1="653.1" y1="138.9" x2="661.6" y2="130.4" stroke="#d68910" stroke-width="4"/><circle cx="806" cy="92" r="22" fill="none" stroke="#c0392b" stroke-width="5"/><line x1="790.6" y1="107.4" x2="821.4" y2="76.6" stroke="#c0392b" stroke-width="5"/><text x="690" y="262" font-size="14" text-anchor="middle" fill="#333">ดูภาพที่ฉายผ่านรูเข็มลงกระดาษแทน</text></svg>
