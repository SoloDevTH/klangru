    note: "สอนครบ: ป.3/2 (อาหารหลัก 5 หมู่ มีโจทย์จำแนกและจับคู่) บางส่วน: ป.4/3 สอนฉลากโภชนาการและฉลากจีดีเอครบ แต่ยังไม่มีฉลากผลิตภัณฑ์สุขภาพอื่น (ยา เครื่องสำอาง เลข อย.); ป.2/2 ป.3/3 ม.1/1 สอนหลักการเลือกอาหารตามธงโภชนาการแยกตามวัยและระดับพลังงาน แต่การเลือกกินจริงเป็นพฤติกรรม; ป.5/3 มีโจทย์ประเมินข้อความโฆษณาอาหาร (hlt.nut.p026) ยังไม่ครอบคลุมโฆษณาผลิตภัณฑ์สุขภาพทั่วไป"
