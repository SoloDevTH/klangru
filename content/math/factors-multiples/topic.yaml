id: math.number.factors-multiples
subject: math
title: { th: ตัวประกอบและพหุคูณ, en: Factors and multiples }
summary: หาตัวประกอบ พหุคูณ และจำนวนเฉพาะ แยกตัวประกอบเฉพาะ แล้วใช้ ห.ร.ม. และ ค.ร.น. แก้โจทย์ปัญหาเรื่องการแบ่งของและเหตุการณ์ที่เกิดซ้ำ
difficulty: 2
minutes: 35
prerequisites: [math.number.integers]
encompasses:
  - { id: math.number.integers, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: factor-trees.svg
    alt: "แผนภาพต้นไม้สองต้นของ 60 ต้นซ้ายแตก 60 เป็น 6 กับ 10 แล้ว 6 เป็น 2 กับ 3 และ 10 เป็น 2 กับ 5 ต้นขวาแตก 60 เป็น 4 กับ 15 แล้ว 4 เป็น 2 กับ 2 และ 15 เป็น 3 กับ 5 ทั้งสองต้นได้ 60 = 2 × 2 × 3 × 5"
    caption: "เริ่มแตกต่างกันแต่ได้จำนวนเฉพาะชุดเดียวกัน การแยกตัวประกอบเฉพาะมีแบบเดียว"
  - { type: check, problem: math.fm.p014, prompt: "ลองนับคู่ตัวประกอบดูก่อนอ่านตัวอย่าง" }
  - type: worked-example
    title: หา ห.ร.ม. และ ค.ร.น. ด้วยวิธีหารสั้น
    problem: "หา ห.ร.ม. และ ค.ร.น. ของ 18 และ 30"
    steps:
      - text: "ทั้ง 18 และ 30 เป็นเลขคู่ หารด้วย 2 พร้อมกัน ได้ 9 กับ 15"
      - text: "9 กับ 15 หารด้วย 3 ลงตัวทั้งคู่ ($9 = 3 \\times 3$, $15 = 3 \\times 5$) หารด้วย 3 ได้ 3 กับ 5"
      - text: "3 กับ 5 ไม่มีตัวหารร่วมนอกจาก 1 จึงหยุด"
        why: "ถ้าหารต่อด้วยจำนวนที่หารลงตัวแค่ตัวเดียว จะไม่ใช่ตัวหารร่วมแล้ว"
      - text: "ห.ร.ม. คือผลคูณของตัวหารด้านซ้าย $2 \\times 3 = 6$"
      - text: "ค.ร.น. คือตัวหารด้านซ้ายคูณกับผลหารแถวล่าง $2 \\times 3 \\times 3 \\times 5 = 90$"
        why: "ค.ร.น. ต้องมีตัวประกอบครบทั้งของ 18 ($2 \\times 3 \\times 3$) และของ 30 ($2 \\times 3 \\times 5$) โดยใช้ส่วนที่ซ้ำกันเพียงครั้งเดียว"
      - text: "ตรวจ: $6 \\times 90 = 540 = 18 \\times 30$ ✓"
    answer: "ห.ร.ม. $= 6$ และ ค.ร.น. $= 90$"
  - type: worked-example
    title: ใช้แผนภาพเวนน์กับจำนวนที่ใหญ่ขึ้น
    problem: "หา ห.ร.ม. และ ค.ร.น. ของ 72 และ 120"
    figure: { src: venn-72-120.svg, alt: "แผนภาพเวนน์สองวง วง 72 ด้านซ้ายมีเลข 3 อยู่เฉพาะในวง ส่วนที่ซ้อนกันตรงกลางมี 2, 2, 2, 3 และวง 120 ด้านขวามีเลข 5 อยู่เฉพาะในวง" }
    steps:
      - text: "แยกตัวประกอบเฉพาะ: $72 = 2 \\times 2 \\times 2 \\times 3 \\times 3$ และ $120 = 2 \\times 2 \\times 2 \\times 3 \\times 5$"
      - text: "จับคู่ตัวที่มีร่วมกัน: 2 สามตัว และ 3 หนึ่งตัว วางไว้ตรงกลาง"
        why: "3 มีในทั้งสองจำนวน แต่ 72 มี 3 สองตัว ส่วน 120 มีตัวเดียว จึงร่วมกันได้เพียงตัวเดียว"
      - text: "ที่เหลือของ 72 คือ 3 ใส่วงซ้าย ที่เหลือของ 120 คือ 5 ใส่วงขวา"
      - text: "ห.ร.ม. คือผลคูณตรงกลาง $2 \\times 2 \\times 2 \\times 3 = 24$"
      - text: "ค.ร.น. คือผลคูณของทุกตัวในภาพ $3 \\times 24 \\times 5 = 360$"
      - text: "ตรวจ: $24 \\times 360 = 8640 = 72 \\times 120$ ✓"
    answer: "ห.ร.ม. $= 24$ และ ค.ร.น. $= 360$"
  - { type: check, problem: math.fm.p015, prompt: "ใช้ ห.ร.ม. เขียนผลบวกเป็นผลคูณ" }
  - type: interactive
    title: กระโดดทีละ 4 กับทีละ 6 แล้วมาเจอกันที่ไหน
    caption: กระโดดจาก 0 ทีละ 4 (ด้านบน) และทีละ 6 สังเกตว่าจุดแรกที่ทั้งสองแบบลงพร้อมกันคือ 12 ซึ่งเป็น ค.ร.น. ของ 4 และ 6 ส่วนจุดถัดไปคือ 24 เป็นพหุคูณร่วมเช่นกัน
    widget:
      kind: number-line
      min: 0
      max: 24
      points:
        - { value: 12, label: "ค.ร.น. = 12" }
        - { value: 24, label: "24" }
      jumps:
        - { from: 0, to: 4, label: "+4" }
        - { from: 4, to: 8, label: "+4" }
        - { from: 8, to: 12, label: "+4" }
        - { from: 12, to: 16, label: "+4" }
        - { from: 16, to: 20, label: "+4" }
        - { from: 20, to: 24, label: "+4" }
        - { from: 0, to: 6, label: "+6" }
        - { from: 6, to: 12, label: "+6" }
        - { from: 12, to: 18, label: "+6" }
        - { from: 18, to: 24, label: "+6" }
  - type: simulation
    title: คูณ แยกตัวประกอบ หาร (PhET Arithmetic)
    url: https://phet.colorado.edu/en/simulations/arithmetic
    provider: phet
    note: ในหน้า Factor ลองหาคู่ตัวประกอบที่คูณกันได้ผลลัพธ์ที่กำหนด จำนวนที่มีคู่ตัวประกอบมากจะมีตัวประกอบมาก
glossary:
  - { term: ตัวประกอบ, definition: "จำนวนนับที่หารจำนวนนั้นได้ลงตัว เช่น ตัวประกอบของ 12 คือ 1, 2, 3, 4, 6, 12" }
  - { term: พหุคูณ, definition: "ผลคูณของจำนวนนั้นกับจำนวนนับ เช่น พหุคูณของ 4 คือ 4, 8, 12, 16, …" }
  - { term: จำนวนเฉพาะ, definition: "จำนวนนับที่มีตัวประกอบเพียงสองตัว คือ 1 กับตัวมันเอง เช่น 2, 3, 5, 7, 11 (1 ไม่ใช่จำนวนเฉพาะ)" }
  - { term: ห.ร.ม., definition: "หารร่วมมาก คือตัวประกอบร่วมที่มากที่สุดของจำนวนตั้งแต่สองจำนวนขึ้นไป" }
  - { term: ค.ร.น., definition: "คูณร่วมน้อย คือพหุคูณร่วมที่น้อยที่สุด (ไม่นับ 0) ของจำนวนตั้งแต่สองจำนวนขึ้นไป" }
flashcards:
  - { front: "1 เป็นจำนวนเฉพาะหรือไม่", back: "ไม่เป็น เพราะ 1 มีตัวประกอบเพียงตัวเดียว จำนวนเฉพาะต้องมีตัวประกอบสองตัวพอดี" }
  - { front: "โจทย์แบบใดใช้ ห.ร.ม.", back: "โจทย์แบ่งของหรือตัดของออกเป็นส่วนเท่ากัน 'ให้ใหญ่ที่สุด' หรือ 'ให้ได้มากที่สุด' โดยไม่เหลือเศษ" }
  - { front: "โจทย์แบบใดใช้ ค.ร.น.", back: "โจทย์เหตุการณ์ที่เกิดซ้ำเป็นรอบแล้วถามว่า 'จะเกิดพร้อมกันอีกครั้งเมื่อใด'" }
  - { front: "ห.ร.ม. และ ค.ร.น. ของ 24 กับ 36", back: "24 = 2 × 2 × 2 × 3, 36 = 2 × 2 × 3 × 3 ห.ร.ม. = 12, ค.ร.น. = 72" }
