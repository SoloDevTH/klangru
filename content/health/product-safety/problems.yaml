  - id: health.consumer.product-safety.p015
    topics: [health.consumer.product-safety]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นข้อมูลที่ฉลากอาหารบรรจุภาชนะต้องแสดงตามประกาศกระทรวงสาธารณสุข (ฉบับที่ 367) (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ชื่ออาหาร และเลขสารบบอาหาร", correct: true }
      - { id: b, text: "ชื่อและที่ตั้งของผู้ผลิตหรือผู้นำเข้า", correct: true }
      - { id: c, text: "ปริมาณสุทธิ และวันที่ควรบริโภคก่อน", correct: true }
      - { id: d, text: "ชื่อพนักงานที่บรรจุถุง", feedback: "ไม่ใช่ข้อมูลที่กฎหมายกำหนด ฉลากต้องบอกผู้ผลิตหรือผู้นำเข้าที่รับผิดชอบ" }
      - { id: e, text: "ราคาส่งสำหรับร้านค้า", feedback: "ราคาไม่ใช่ข้อมูลบังคับบนฉลากตามประกาศฉบับนี้" }
    hints:
      - "ฉลากต้องบอกว่าอาหารคืออะไร ใครผลิต มีเท่าไร และบริโภคได้ถึงเมื่อใด"
      - "ข้อที่ถูกมีสามข้อ"
    solution: "ฉลากต้องแสดงชื่ออาหาร เลขสารบบอาหาร ผู้ผลิตหรือผู้นำเข้า ปริมาณสุทธิ ส่วนประกอบ ข้อมูลผู้แพ้อาหาร และวันควรบริโภคก่อน เป็นต้น ชื่อพนักงานและราคาส่งไม่ใช่ข้อมูลบังคับ"
