      - { id: c, text: "ผิด โลกร้อนไม่เกี่ยวกับฝนเลย", feedback: "อากาศที่อุ่นขึ้นเก็บไอน้ำได้มากขึ้น ฝนตกหนักจึงมีแนวโน้มรุนแรงขึ้นในหลายพื้นที่" }
      - { id: d, text: "ผิด เพราะประเทศไทยปล่อยแก๊สเรือนกระจกน้อย", feedback: "ภูมิอากาศเปลี่ยนทั้งโลกจากแก๊สที่ทุกประเทศปล่อยรวมกัน ผลไม่ได้ขึ้นกับว่าประเทศนั้นปล่อยเท่าใด" }
    hints:
      - "เหตุการณ์หนึ่งครั้งมีได้หลายสาเหตุร่วมกัน"
