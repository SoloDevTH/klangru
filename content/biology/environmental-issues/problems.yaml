    ai_assisted: true

  - id: biology.ecology.environmental-issues.p014
    topics: [biology.ecology.environmental-issues]
    difficulty: 4
    type: numeric
    stem: "ปี พ.ศ. 2566 ไทยมีพื้นที่ป่าราว 101.8 ล้านไร่ จากพื้นที่ประเทศราว 323.5 ล้านไร่ ถ้าเป้าหมายคือมีป่าร้อยละ 40 ของประเทศ ต้องเพิ่มพื้นที่ป่าอีกประมาณกี่ล้านไร่ (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 27.6, unit: "ล้านไร่", tolerance: 0.2 }
    misconceptions:
      - { match: 129.4, feedback: "129.4 ล้านไร่คือพื้นที่ป่าตามเป้าหมาย ต้องลบพื้นที่ป่าที่มีอยู่แล้ว" }
      - { match: 8.5, feedback: "8.5 คือผลต่างเป็นจุดร้อยละ ต้องแปลงเป็นพื้นที่ด้วยการคูณกับพื้นที่ประเทศ" }
    hints:
      - "พื้นที่ป่าตามเป้าหมาย = 0.40 × 323.5 ล้านไร่"
      - "ลบพื้นที่ป่าที่มีอยู่แล้ว 101.8 ล้านไร่"
    solution: "เป้าหมาย $0.40 \\times 323.5 = 129.4$ ล้านไร่ ต้องเพิ่ม $129.4 - 101.8 = 27.6$ ล้านไร่ ซึ่งใหญ่กว่าพื้นที่หลายจังหวัดรวมกัน การเพิ่มป่าจึงต้องอาศัยทั้งการปลูก การฟื้นฟูตามธรรมชาติ และป่าชุมชน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.environmental-issues.p015
    topics: [biology.ecology.environmental-issues]
    difficulty: 4
    type: mcq
    stem: "โรงเรียนต้องการติดตามว่ามาตรการ 'จอดรถดับเครื่องหน้าโรงเรียน' ลด PM2.5 ได้หรือไม่ ด้วยเครื่องวัดฝุ่นราคาถูก แผนใดเหมาะสมที่สุด"
    choices:
      - { id: a, text: "วัดหน้าโรงเรียนช่วงรับส่งนักเรียนทุกวัน 4 สัปดาห์ก่อนและหลังเริ่มมาตรการ ใช้เครื่องเดิมที่สอบเทียบกับสถานีของรัฐ และเทียบกับจุดอ้างอิงที่ไม่มีมาตรการในช่วงเดียวกัน", correct: true }
      - { id: b, text: "วัดหนึ่งครั้งหลังเริ่มมาตรการ ถ้าค่าต่ำแปลว่าได้ผล", feedback: "ไม่มีค่าก่อนเริ่มให้เทียบ และค่าฝุ่นเปลี่ยนตามสภาพอากาศแต่ละวัน" }
      - { id: c, text: "วัดก่อนเริ่มในเดือนมีนาคมและหลังเริ่มในเดือนกรกฎาคม", feedback: "ฤดูต่างกันมาก ฝนในเดือนกรกฎาคมลดฝุ่นอยู่แล้ว จึงแยกผลของมาตรการไม่ได้" }
      - { id: d, text: "ถามความรู้สึกผู้ปกครองว่าอากาศดีขึ้นหรือไม่", feedback: "ความรู้สึกไม่ใช่การวัดที่เชื่อถือได้ของ PM2.5" }
    hints:
      - "ต้องมีข้อมูลก่อนและหลังที่เทียบกันได้"
      - "ฝุ่นขึ้นกับสภาพอากาศ จึงควรมีจุดอ้างอิงในช่วงเวลาเดียวกัน"
    solution: "แผนที่ดีวัดซ้ำหลายวันทั้งก่อนและหลัง ช่วงเวลาเดียวกันของวัน ใช้เครื่องที่สอบเทียบแล้ว และมีจุดอ้างอิงเพื่อแยกผลของสภาพอากาศออกจากผลของมาตรการ"
