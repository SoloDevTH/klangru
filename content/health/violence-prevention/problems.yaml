  - WHO ระบุว่าการลดการเข้าถึงสุราและอาวุธช่วยป้องกันความรุนแรง
  solution: การควบคุมสุราและอาวุธ และจัดกิจกรรมทางเลือก เป็นแนวทางระดับชุมชนที่ตรงกับปัจจัยในข่าว ควรทำร่วมกับการฝึกทักษะระดับบุคคลด้วย
