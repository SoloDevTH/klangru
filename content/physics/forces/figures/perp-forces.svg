  <line x1="325.0" y1="70.0" x2="367.0" y2="70.0" stroke="#15211e" stroke-width="1.8" stroke-linecap="butt"/>
  <polygon points="375.0,70.0 367.0,73.6 367.0,66.4" fill="#15211e"/>
  <text x="382.0" y="75.0" fill="#15211e" font-size="13" text-anchor="start" font-weight="bold">E</text>
