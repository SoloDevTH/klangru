id: chinese.writing.short-messages
subject: chinese
title: { th: "การเขียนข้อความสั้นและแนะนำตัวเป็นภาษาจีน", en: "Writing short messages and self-introductions in Chinese" }
summary: โครงสร้างข้อความแชต โปสการ์ด อีเมล และประกาศ คำขึ้นต้นและลงท้ายที่สุภาพ การเรียงย่อหน้าแนะนำตัว การเขียนบนกระดาษตาราง 稿纸 และการเขียนอักษรด้วยมือ
difficulty: 4
minutes: 40
prerequisites: [chinese.reading.short-texts, chinese.vocab.self-introduction]
encompasses:
  - { id: chinese.reading.short-texts, weight: 0.3 }
  - { id: chinese.grammar.compound-sentences, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: chat-central.svg
    alt: "หน้าจอแชตกับหวังหมิง (王明) หวังหมิง: 明天你有空吗？ เรา: 有空！我们去Central商场逛街，好吗？ หวังหมิง: 好啊！几点见？ เรา: 下午两点，在一楼星巴克门口见。 หวังหมิง: 好的，明天见！"
    caption: "ข้อความนัดหมายที่ดีบอกทั้งเวลาและจุดนัด (บทสนทนาสมมติ)"
  - type: figure
    src: postcard.svg
    alt: "โปสการ์ดจากภูเก็ต ด้านซ้ายมีป้ายบอกส่วนประกอบ บรรทัด 李明： = 称呼 คำขึ้นต้น · 你好！ (เว้นสองช่อง) = 问候 คำทักทาย · 我现在在普吉岛。这里的海很蓝，天气也很好。我每天都去游泳，还吃了很多海鲜。 = 正文 เนื้อความ · 祝你 (เว้นสองช่อง) / 天天开心！ (ชิดซ้าย) = 祝福 คำอวยพร · 小美 (ชิดขวา) = 署名 ผู้เขียน · 11月2日 = 日期 วันที่ ด้านขวาเป็นช่องแสตมป์และที่อยู่ 北京市 李明 收"
    caption: "ส่วนประกอบของโปสการ์ดภาษาจีน (สมมติ)"
  - { type: check, problem: chinese.writing.short-messages.p004, prompt: "เขียนถึงครูขึ้นต้นอย่างไร" }
  - type: figure
    src: gaozhi.svg
    alt: "กระดาษตาราง 稿纸 สองแถว แถวละ 20 ช่อง แถวแรกเว้นว่าง 2 ช่องแรก (ป้ายสีน้ำเงิน: เว้น 2 ช่องต้นย่อหน้า) แล้วเขียน 我叫林小美，今年十四岁，是泰国人。我 แถวสอง 家在清迈。家里有爸爸、妈妈、哥哥和我。 ช่องของเครื่องหมาย ， มีกรอบสีเขียว (เครื่องหมายก็กิน 1 ช่อง)"
    caption: "1 ช่อง = 1 อักษรหรือ 1 เครื่องหมาย ขึ้นย่อหน้าเว้น 2 ช่อง"
  - type: worked-example
    title: เขียนข้อความนัดเพื่อนให้ครบ
    problem: "เพื่อนชาวจีนชวนไปกินข้าวพรุ่งนี้ เราว่างตอนเย็น อยากนัด 6 โมงเย็นที่ร้านอาหารชั้น 3 ของห้าง เขียนข้อความตอบ"
    steps:
      - text: "ตอบรับก่อน: 好啊！"
      - text: "บอกเวลา (晚上六点) และสถานที่ (商场三楼的饭馆) ในประโยคเดียว: 明天晚上六点在商场三楼的饭馆见，好吗？ (饭馆 fànguǎn = ร้านอาหาร)"
        why: "ถ้าขาดเวลาหรือสถานที่ เพื่อนต้องถามกลับ"
      - text: "ปิดข้อความ: 明天见！"
    answer: "好啊！明天晚上六点在商场三楼的饭馆见，好吗？明天见！"
  - type: worked-example
    title: ขยายแนะนำตัวให้ถึง 100 ตัวอักษร
    problem: "ฉบับร่างมีแค่ 我叫林小美。我十四岁。我是泰国人。 (17 ตัวอักษรรวมเครื่องหมาย) จะเพิ่มเนื้อหาอย่างไร"
    steps:
      - text: "รวมสามประโยคแรกด้วย ， ให้ต่อกัน: 我叫林小美，今年十四岁，是泰国人。"
      - text: "เพิ่มเรื่องครอบครัว โรงเรียน งานอดิเรก ตามลำดับ: 我家在清迈……我在曼谷上学……我的爱好是游泳和画画。"
      - text: "ใช้คำเชื่อมเพิ่มเหตุผลและความหวัง: 我很喜欢学汉语，因为我希望将来能去中国留学。"
        why: "คำเชื่อมทำให้ประโยคต่อกันเป็นย่อหน้า และเพิ่มจำนวนตัวอักษรอย่างมีเนื้อหา"
      - text: "นับตัวอักษรรวมเครื่องหมาย ถ้ายังไม่ถึง 100 ให้เพิ่มรายละเอียด เช่น ทำไมชอบงานอดิเรกนั้น"
    answer: "เรียง: ข้อมูลส่วนตัว → ครอบครัว → โรงเรียน → งานอดิเรก → ความหวัง แล้วเชื่อมด้วย 因为 而且 但是"
  - { type: check, problem: chinese.writing.short-messages.p006, prompt: "เรียงวันที่อย่างไร" }
glossary:
  - { term: "称呼 chēnghu", definition: "คำขึ้นต้น ชื่อหรือตำแหน่งของผู้รับ ตามด้วย ：" }
  - { term: "祝福 zhùfú", definition: "คำอวยพรท้ายข้อความ เช่น 祝你天天开心 · 祝您身体健康" }
  - { term: "署名 shǔmíng / 日期 rìqī", definition: "ชื่อผู้เขียนและวันที่ อยู่ท้ายข้อความ ชิดขวา" }
  - { term: "主题 zhǔtí", definition: "หัวเรื่องของอีเมล เช่น 主题：请假" }
  - { term: "明信片 míngxìnpiàn", definition: "โปสการ์ด" }
  - { term: "稿纸 gǎozhǐ", definition: "กระดาษตารางสำหรับเขียนเรียงความ 1 ช่องต่อ 1 อักษรหรือเครื่องหมาย ขึ้นย่อหน้าเว้น 2 ช่อง" }
flashcards:
  - { front: "ส่วนของจดหมายจากบนลงล่าง", back: "称呼 → 问候 → 正文 → 祝福 → 署名 → 日期" }
  - { front: "เขียนถึงครูขึ้นต้นว่า", back: "王老师：您好！" }
  - { front: "อวยพรให้สุขภาพแข็งแรง", back: "祝您身体健康！" }
  - { front: "ข้อความนัดหมายต้องมี", back: "เวลา + สถานที่ เช่น 下午两点在星巴克门口见" }
  - { front: "稿纸 ขึ้นย่อหน้า", back: "เว้น 2 ช่อง · 1 ช่อง = 1 อักษรหรือ 1 เครื่องหมาย" }
