  - { framework: university-foundations, indicators: ["MIT2.001 12", "MIT2.001 16"], coverage: full, note: "สภาวะความเค้นบนชิ้นส่วนเล็ก ความเค้นระนาบ สมการแปลงความเค้น ความเค้นหลักและมุมระนาบหลัก ความเค้นเฉือนสูงสุดในระนาบและสัมบูรณ์ วงกลมของมอร์ (บทเรียน ตัวอย่างแสดงวิธีทำ 1, p001–p009 p012 p017 p018)" }
  - { framework: university-foundations, indicators: ["MIT2.001 13", "MIT2.001 17"], coverage: full, note: "กฎของฮุกแบบทั่วไปสามแกน (p010) การแปลงความเครียดด้วย γ/2 และโรเซตต์ 0°–45°–90° (p011)" }
  - { framework: university-foundations, indicators: ["MIT2.001 18"], coverage: partial, note: "สอนเกณฑ์การครากของวัสดุเหนียว เทรสกาและฟอนมิเซส กับเพลารับแรงตามแนวแกนร่วมกับแรงบิด (ตัวอย่างแสดงวิธีทำ 2, p013–p016) เกณฑ์ของวัสดุเปราะ (ความเค้นตั้งฉากสูงสุด มอร์–คูลอมบ์) กล่าวถึงเพียงชื่อ ไม่มีโจทย์" }
  - { framework: th-coe-engineering-basics, indicators: ["ME-2.4"], coverage: partial, note: "ตัวชี้วัดกว้างทั้งกลุ่มวัสดุวิศวกรรมและกลศาสตร์ของแข็ง หัวข้อนี้เติมส่วนความเค้นหลายแกน การแปลงความเค้นและความเครียด และเกณฑ์การวิบัติ ต่อจาก stress-strain และ beam-bending" }
