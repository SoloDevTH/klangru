  <rect x="40" y="126" width="260" height="38" fill="#ffffff" stroke="#9fb0ab" stroke-width="1"/>
  <text x="100" y="152" text-anchor="middle" fill="#2b5f9e" font-size="18" font-weight="bold">2<tspan dy="-9" font-size="13">2</tspan></text>
  <text x="230" y="152" text-anchor="middle" fill="#15211e" font-size="18" font-weight="bold">4</text>
  <path d="M 310 147.0 C 350 149.0 350 179.0 310 181.0" fill="none" stroke="#b4521f" stroke-width="2"/>
  <polygon points="312,181 320,184.6 320,177.4" fill="#b4521f"/>
