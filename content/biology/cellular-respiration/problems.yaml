    solution: "ปฏิกิริยาต้องสลายพันธะในกลูโคสและ O₂ (ใช้พลังงาน) และเกิดพันธะใน CO₂ และ H₂O (ปล่อยพลังงาน) พันธะใหม่แข็งแรงกว่าและปล่อยพลังงานมากกว่า จึงมีพลังงานสุทธิราว 2,870 kJ ต่อกลูโคส 1 โมล ส่วนหนึ่งเก็บใน ATP อะตอมทั้งหมดยังอยู่ครบ"
