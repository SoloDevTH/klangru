  - id: phy.ohm.p017
    topics: [physics.electricity.current-voltage]
    difficulty: 2
    type: numeric
    stem: "ชาวสวนยางใช้ไฟฉายคาดหัวตอนกรีดยางกลางดึก หลอดไฟมีกระแส $0.15\\ \\mathrm{A}$ ไหลผ่าน ถ้าเปิดไฟนาน $2$ ชั่วโมง มีประจุไหลผ่านหลอดกี่คูลอมบ์ (ตอบเป็นตัวเลขในหน่วย C)"
    answer: { value: 1080, tolerance: 1, unit: C }
    hints:
      - "แปลงเวลาเป็นวินาที"
      - "ใช้ $Q = It$"
    misconceptions:
      - { match: 0.3, feedback: "ดูเหมือนใช้เวลาเป็นชั่วโมง ต้องแปลงเป็นวินาที $2 \\times 3600$" }
      - { match: 18, feedback: "ดูเหมือนแปลงชั่วโมงเป็นนาที ($120$) ต้องแปลงเป็นวินาที" }
    solution: "$t = 2 \\times 3600 = 7200\\ \\mathrm{s}$ ดังนั้น $Q = (0.15)(7200) = 1080\\ \\mathrm{C}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.ohm.p018
    topics: [physics.electricity.current-voltage]
    difficulty: 4
    type: numeric
    stem: "แบตเตอรี่รถกระบะขนาด $12\\ \\mathrm{V}$ ระบุความจุ $60\\ \\mathrm{Ah}$ (แอมแปร์-ชั่วโมง) ความจุนี้เท่ากับประจุกี่คูลอมบ์ (ตอบเป็นตัวเลขในหน่วย C)"
    answer: { value: 216000, tolerance: 100, unit: C }
    hints:
      - "แอมแปร์ × เวลา = ประจุ"
      - "$1\\ \\mathrm{Ah}$ คือกระแส $1\\ \\mathrm{A}$ นาน $3600\\ \\mathrm{s}$"
    misconceptions:
      - { match: 3600, feedback: "นั่นคือประจุของ $1\\ \\mathrm{Ah}$ ยังต้องคูณ 60" }
      - { match: 2592000, feedback: "นั่นคือพลังงาน $QV$ ในหน่วยจูล โจทย์ถามประจุ ไม่ต้องคูณ $12\\ \\mathrm{V}$" }
    solution: "$Q = 60\\ \\mathrm{A} \\times 3600\\ \\mathrm{s} = 216\\,000\\ \\mathrm{C}$ (ถ้าคูณ $12\\ \\mathrm{V}$ จะได้พลังงานที่เก็บไว้ประมาณ $2.6 \\times 10^6\\ \\mathrm{J}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.ohm.p019
    topics: [physics.electricity.current-voltage]
    difficulty: 4
    type: numeric
    stem: "จากกราฟกระแสกับความต่างศักย์ของหลอดไส้ในรูป เมื่อความต่างศักย์เพิ่มจาก $2\\ \\mathrm{V}$ เป็น $6\\ \\mathrm{V}$ ความต้านทานของหลอดเพิ่มขึ้นกี่โอห์ม (ตอบเป็นตัวเลขในหน่วย Ω)"
    figure: { src: p-lamp-iv.svg, alt: "กราฟกระแส I (แอมแปร์) กับความต่างศักย์ V (โวลต์) ของหลอดไส้ เป็นเส้นโค้งลาดน้อยลงเรื่อย ๆ ผ่านจุดที่ทำเครื่องหมายไว้ (2 V, 0.16 A), (4 V, 0.24 A) และ (6 V, 0.30 A)" }
    answer: { value: 7.5, tolerance: 0.1, unit: Ω }
    hints:
      - "หาความต้านทาน $R = V/I$ ที่ $2\\ \\mathrm{V}$ และที่ $6\\ \\mathrm{V}$ แยกกัน"
      - "นำค่าที่ $6\\ \\mathrm{V}$ ลบด้วยค่าที่ $2\\ \\mathrm{V}$"
    misconceptions:
      - { match: 28.57, feedback: "ดูเหมือนใช้ความชันระหว่างสองจุด $\\tfrac{\\Delta V}{\\Delta I} = \\tfrac{4}{0.14}$ ความต้านทานของแต่ละจุดคือ $V/I$ ของจุดนั้นเอง" }
      - { match: 0, feedback: "หลอดไส้ไม่ใช่ตัวต้านทานโอห์มมิก กราฟไม่เป็นเส้นตรง ความต้านทานจึงไม่คงที่" }
    solution: "ที่ $2\\ \\mathrm{V}$: $R = \\tfrac{2}{0.16} = 12.5\\ \\Omega$ ที่ $6\\ \\mathrm{V}$: $R = \\tfrac{6}{0.30} = 20\\ \\Omega$ เพิ่มขึ้น $7.5\\ \\Omega$ เพราะไส้หลอดร้อนขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.ohm.p020
    topics: [physics.electricity.current-voltage]
    difficulty: 4
    type: numeric
    stem: "ชุมนุมอิเล็กทรอนิกส์ของโรงเรียนต่อหลอด LED กับพอร์ต USB ซึ่งจ่ายไฟ $5\\ \\mathrm{V}$ หลอด LED ทำงานที่ความต่างศักย์ $2.0\\ \\mathrm{V}$ และกระแส $20\\ \\mathrm{mA}$ ต้องต่อตัวต้านทานค่ากี่โอห์มอนุกรมกับหลอด (ตอบเป็นตัวเลขในหน่วย Ω)"
    answer: { value: 150, tolerance: 1, unit: Ω }
    hints:
      - "ตัวต้านทานต้องรับความต่างศักย์ส่วนที่เหลือจาก LED"
      - "ความต่างศักย์คร่อมตัวต้านทาน $= 5 - 2.0$ และกระแสผ่านตัวต้านทานเท่ากับกระแสผ่าน LED"
      - "แปลง $20\\ \\mathrm{mA}$ เป็นแอมแปร์ แล้วใช้ $R = V/I$"
    misconceptions:
      - { match: 250, feedback: "ดูเหมือนใช้ $5\\ \\mathrm{V}$ ทั้งหมด LED รับไปแล้ว $2.0\\ \\mathrm{V}$ ตัวต้านทานรับเพียง $3\\ \\mathrm{V}$" }
      - { match: 0.15, feedback: "ดูเหมือนไม่ได้แปลง mA เป็น A ($20\\ \\mathrm{mA} = 0.020\\ \\mathrm{A}$)" }
    solution: "ความต่างศักย์คร่อมตัวต้านทาน $5 - 2.0 = 3.0\\ \\mathrm{V}$ กระแส $0.020\\ \\mathrm{A}$ ดังนั้น $R = \\dfrac{3.0}{0.020} = 150\\ \\Omega$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.ohm.p021
    topics: [physics.electricity.current-voltage]
    difficulty: 5
    type: numeric
    stem: "นักเรียนทดลองวัดกระแสผ่านตัวต้านทานที่ความต่างศักย์ต่าง ๆ ได้กราฟดังรูป เส้นตรงที่เหมาะสมไม่ผ่านจุดกำเนิดแต่ตัดแกนกระแสที่ $0.02\\ \\mathrm{A}$ เพราะแอมมิเตอร์มีความคลาดเคลื่อนศูนย์ ความต้านทานของตัวต้านทานเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย Ω)"
    figure: { src: p-iv-offset.svg, alt: "กราฟกระแส I (แอมแปร์) กับความต่างศักย์ V (โวลต์) มีจุดข้อมูลรูปกากบาท 6 จุดที่ 1 ถึง 6 V เส้นตรงที่เหมาะสมตัดแกนกระแสที่ 0.02 A และผ่านจุด (7 V, 0.30 A) ตรงมุมขวาบนของกราฟพอดี" }
    answer: { value: 25, tolerance: 0.3, unit: Ω }
    hints:
      - "ความคลาดเคลื่อนศูนย์ทำให้เส้นเลื่อนขึ้นทั้งเส้น แต่ไม่เปลี่ยนความชัน"
      - "หาความชันจากสองจุดบนเส้น เช่น $(0, 0.02)$ และ $(7, 0.30)$"
      - "ความชันของกราฟ $I$–$V$ คือ $\\tfrac{1}{R}$"
    misconceptions:
      - { match: 22.73, feedback: "ดูเหมือนใช้ $V/I$ ของจุดข้อมูลที่ $5\\ \\mathrm{V}$ ซึ่งรวมความคลาดเคลื่อนศูนย์ $0.02\\ \\mathrm{A}$ ไว้ด้วย ต้องใช้ความชันของเส้น" }
      - { match: 0.04, feedback: "นั่นคือความชัน $\\tfrac{1}{R}$ ยังต้องกลับเศษส่วน" }
    solution: "ความชัน $= \\dfrac{0.30 - 0.02}{7 - 0} = \\dfrac{0.28}{7} = 0.04\\ \\mathrm{A/V}$ ดังนั้น $R = \\dfrac{1}{0.04} = 25\\ \\Omega$ การใช้ความชันตัดผลของความคลาดเคลื่อนศูนย์ออก ส่วน $V/I$ ของจุดเดี่ยวยังมีความคลาดเคลื่อนอยู่"
    license: CC-BY-SA-4.0
    ai_assisted: true
