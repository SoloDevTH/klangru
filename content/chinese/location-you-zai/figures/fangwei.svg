<text x="640.0" y="169.0" font-size="14" text-anchor="middle" fill="#7a5a00" font-weight="normal">hòubian · หลัง</text>
<line x1="650.0" y1="176.0" x2="650.0" y2="270.0" stroke="#7a5a00" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a7a5a00)"/>
<text x="555.0" y="345.0" font-size="13" text-anchor="middle" fill="#666" font-weight="normal">ด้านหน้าคือด้านที่หันหาผู้ดู</text>
<text x="555.0" y="412.0" font-size="14" text-anchor="middle" fill="#666" font-weight="normal">里边 = 里 · 上边 = 上 (ใช้สั้น ๆ ได้)</text>
<text x="555.0" y="434.0" font-size="14" text-anchor="middle" fill="#666" font-weight="normal">เติม 面 แทน 边 ได้: 上面 里面</text>
</svg>
