completeness: full-text
strands:
  - id: "5"
    title: มาตรฐานผลการเรียนรู้
    standards:
      - id: "5.1"
        text: "คุณธรรม จริยธรรม"
        indicators:
          - { id: "5.1", text: "นักศึกษาต้องยึดมั่นในคุณธรรม และจริยธรรม มีวินัย ซื่อสัตย์สุจริต ตรงต่อเวลา มีจรรยาบรรณในการประกอบอาชีพ มีจิตสำนึกที่ดีและมีความรับผิดชอบต่อหน้าที่ สามารถปรับวิถีชีวิตอย่างสร้างสรรค์ในสังคมที่มีความขัดแย้งสูง ยึดฐานคิดทางศีลธรรมทั้งในเรื่องส่วนตัว และสังคม" }
      - id: "5.2"
        text: "ความรู้"
        indicators:
          - { id: "5.2(1)", text: "รู้ และเข้าใจหลักการและทฤษฎีพื้นฐานด้านโลจิสติกส์ และสามารถนำไปประยุกต์ได้ในการวางแผนและแก้ปัญหาในกิจกรรมด้านโลจิสติกส์และโซ่อุปทาน" }
          - { id: "5.2(2)", text: "รู้และเข้าใจหลักการของศาสตร์อื่นที่เกี่ยวข้องกับโลจิสติกส์ เช่น หลักเศรษฐศาสตร์ หลักกฎหมาย หลักการจัดการ เป็นต้น โดยสามารถนำมาประยุกต์หรือเป็นพื้นฐานของโลจิสติกส์" }
          - { id: "5.2(3)", text: "ติดตามความเปลี่ยนแปลงทางวิชาการ อันเกิดจากการวิจัยทั้งในศาสตร์โลจิสติกส์และศาสตร์ที่เกี่ยวข้อง" }
      - id: "5.3"
        text: "ทักษะทางปัญญา"
        indicators:
          - { id: "5.3", text: "มีความสามารถในการวิเคราะห์สถานการณ์ และประยุกต์ความรู้ ความเข้าใจในแนวคิด หลักการ ทฤษฎี และกระบวนการต่าง ๆ ไปใช้ในการแก้ปัญหาได้อย่างสร้างสรรค์ โดยเฉพาะสามารถแก้ปัญหาทางโลจิสติกส์ได้อย่างเหมาะสม" }
      - id: "5.4"
        text: "ทักษะความสัมพันธ์ระหว่างบุคคล และความรับผิดชอบ"
        indicators:
          - { id: "5.4", text: "มีความสามารถในการทำงานกับผู้อื่นได้อย่างมีประสิทธิภาพมีความรับผิดชอบต่อตนเองและสังคม สามารถปรับตัวเข้ากับสถานการณ์ และวัฒนธรรมองค์กรที่ไปปฏิบัติงานได้เป็นอย่างดี ตลอดจนต้องมีภาวะผู้นำ" }
      - id: "5.5"
        text: "ทักษะการวิเคราะห์เชิงตัวเลข การสื่อสาร และการใช้เทคโนโลยีสารสนเทศ"
        indicators:
          - { id: "5.5", text: "มีทักษะ และความสามารถในการใช้ภาษาไทยในการสื่อสารได้อย่างมีประสิทธิภาพ ทั้งการพูด การเขียน และการใช้เทคโนโลยีสารสนเทศ อีกทั้งมีความรู้ทางคณิตศาสตร์ และสถิติ ในอันที่จะวิเคราะห์สถานการณ์ตลอดจนการนำเสนอข้อมูลโดยใช้คณิตศาสตร์และสถิติที่เหมาะกับบริบท นอกจากนี้ควรมีความรู้ภาษาอังกฤษหรือภาษาต่างประเทศอื่นเพียงพอที่จะสื่อสารได้" }
  - id: "8"
    title: เนื้อหาสาระสำคัญของสาขา
    standards:
      - id: "8.1"
        text: "วิชาเอกบังคับ จะต้องประกอบด้วยเนื้อหา ดังต่อไปนี้"
        indicators:
          - { id: "8.1.1", text: "การจัดการโลจิสติกส์ และ/หรือ โซ่อุปทาน (Logistics and/or Supply Chain Management)" }
          - { id: "8.1.2", text: "การจัดการสินค้าคงคลัง และ/หรือ คลังสินค้า (Inventory and/or Warehouse Management)" }
          - { id: "8.1.3", text: "การขนส่ง และ/หรือ การกระจายสินค้า (Transportation and/or Distribution)" }
          - { id: "8.1.4", text: "การฝึกงาน / สหกิจศึกษา (Cooperative Education)" }
      - id: "8.2"
        text: "วิชาเอกเลือก แต่ละสถาบันอุดมศึกษาอาจจัดวิชาเลือกตามความเชี่ยวชาญ และความถนัดของตน โดยอาจมีเนื้อหาสาระดังนี้"
        indicators:
          - { id: "8.2.1", text: "ระบบสารสนเทศสำหรับโลจิสติกส์" }
          - { id: "8.2.2", text: "กฎหมายเกี่ยวกับการประกันภัยของการขนส่ง หรือกฎหมายที่เกี่ยวข้องกับโลจิสติกส์" }
          - { id: "8.2.3", text: "การบริหารการจัดซื้อ" }
          - { id: "8.2.4", text: "ระบบบรรจุภัณฑ์" }
          - { id: "8.2.5", text: "การขนส่งต่อเนื่องหลายรูปแบบ หรือการขนส่งทางอากาศ หรือการขนส่งทางทะเล" }
          - { id: "8.2.6", text: "ระบบขนถ่ายวัสดุ" }
          - { id: "8.2.7", text: "การจัดการการผลิตและปฏิบัติการ" }
          - { id: "8.2.8", text: "การวิจัยดำเนินการ" }
