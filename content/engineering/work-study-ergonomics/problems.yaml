  - id: engineering.industrial.work-study-ergonomics.p020
    topics:
      - engineering.industrial.work-study-ergonomics
    difficulty: 5
    type: code
    stem: เขียนฟังก์ชัน `standard_time(observed, rating_pct, allowance_pct)` ที่คืนค่าเวลามาตรฐานของงาน โดย observed คือเวลาที่จับได้ (วินาที) rating_pct คืออัตราการทำงาน (เช่น 110) และ allowance_pct คือค่าเผื่อเป็นเปอร์เซ็นต์ (เช่น 15)
    starter: "def standard_time(observed, rating_pct, allowance_pct):\n    pass\n"
    tests: 'r = standard_time(12.2, 110, 15)

      assert r is not None, "ฟังก์ชันยังไม่ได้คืนค่า ให้ใช้ return ไม่ใช่ print"

      assert abs(r - 15.433) < 0.01, f"standard_time(12.2, 110, 15) ควรได้ประมาณ 15.43 แต่ได้ {r}"

      assert abs(standard_time(10, 100, 0) - 10) < 1e-9, "เมื่อ rating 100 และค่าเผื่อ 0 ควรได้เวลาเท่าเดิม"

      assert abs(standard_time(10, 80, 20) - 9.6) < 1e-9, f"standard_time(10, 80, 20) ควรได้ 9.6 แต่ได้ {standard_time(10, 80, 20)} (ตรวจว่าใช้ rating คูณ ไม่ใช่หาร)"

      '
    reference: "def standard_time(observed, rating_pct, allowance_pct):\n    return observed * rating_pct / 100 * (1 + allowance_pct / 100)\n"
    hints:
      - เวลาปกติ = เวลาที่จับได้ × rating_pct ÷ 100
      - เวลามาตรฐาน = เวลาปกติ × (1 + allowance_pct ÷ 100) แล้วคืนค่าด้วย return
    solution: เวลาปกติ = observed × rating_pct ÷ 100 เวลามาตรฐาน = เวลาปกติ × (1 + allowance_pct ÷ 100) เช่น 12.2 × 1.10 × 1.15 ≈ 15.43
    license: CC-BY-SA-4.0
    ai_assisted: true
