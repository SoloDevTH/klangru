    difficulty: 5
    type: numeric
    stem: "อุปกรณ์ตรวจวัดในฟาร์ม 200 เครื่องแต่ละเครื่องส่งข้อมูลขนาด 256 ไบต์ทุก 5 นาที ตลอด 1 วัน (ค่าสมมติ) ข้อมูลรวมทั้งหมดเท่ากับกี่กิโลไบต์ โดย 1 กิโลไบต์ = 1,000 ไบต์ (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 14745.6, tolerance: 0.1, unit: กิโลไบต์ }
    hints:
      - "หาจำนวนครั้งที่เครื่องหนึ่งส่งต่อวัน คือ 24 × 60 ÷ 5"
