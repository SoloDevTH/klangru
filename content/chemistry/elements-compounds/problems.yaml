problems:
  - id: chemistry.matter.elements-compounds.p001
    topics: [chemistry.matter.elements-compounds]
    difficulty: 1
    type: mcq
    stem: "สารในข้อใดเป็นธาตุ"
    choices:
      - { id: a, text: "แก๊สออกซิเจน ($\\mathrm{O_2}$)", correct: true, feedback: "ถูก มีอะตอมชนิดเดียวคือออกซิเจน แม้จะอยู่เป็นโมเลกุลก็ยังเป็นธาตุ" }
      - { id: b, text: "น้ำ ($\\mathrm{H_2O}$)", feedback: "น้ำมีอะตอม 2 ชนิด (H และ O) จึงเป็นสารประกอบ" }
      - { id: c, text: "คาร์บอนไดออกไซด์ ($\\mathrm{CO_2}$)", feedback: "มีอะตอม 2 ชนิด (C และ O) จึงเป็นสารประกอบ" }
      - { id: d, text: "อากาศ", feedback: "อากาศเป็นสารผสมของแก๊สหลายชนิด ไม่ใช่สารบริสุทธิ์" }
    hints:
      - "ธาตุมีอะตอมกี่ชนิด"
      - "นับจำนวนสัญลักษณ์ธาตุที่ต่างกันในสูตร"
    solution: "$\\mathrm{O_2}$ มีสัญลักษณ์ธาตุเดียว จึงเป็น **ธาตุ** ส่วน $\\mathrm{H_2O}$ และ $\\mathrm{CO_2}$ เป็นสารประกอบ อากาศเป็นสารผสม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.elements-compounds.p002
    topics: [chemistry.matter.elements-compounds]
    difficulty: 2
    type: match
    stem: "จับคู่ธาตุกับกลุ่มของธาตุ"
    pairs:
      - { left: "ทองแดง ใช้ทำสายไฟ", right: "โลหะ" }
      - { left: "กำมะถัน ผงสีเหลือง เปราะ", right: "อโลหะ" }
      - { left: "ซิลิคอน ใช้ทำชิปคอมพิวเตอร์", right: "กึ่งโลหะ" }
      - { left: "ยูเรเนียม ใช้เป็นเชื้อเพลิงโรงไฟฟ้านิวเคลียร์", right: "ธาตุกัมมันตรังสี" }
    hints:
      - "โลหะนำไฟฟ้าดีและตีแผ่ได้ อโลหะของแข็งมักเปราะ"
      - "กึ่งโลหะนำไฟฟ้าได้เล็กน้อย ธาตุกัมมันตรังสีแผ่รังสีได้เอง"
    solution: "ทองแดงเป็นโลหะ กำมะถันเป็นอโลหะ ซิลิคอนเป็นกึ่งโลหะ ยูเรเนียมเป็นธาตุกัมมันตรังสี (ยูเรเนียมเป็นโลหะด้วย แต่จุดเด่นคือการแผ่รังสี)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.elements-compounds.p003
    topics: [chemistry.matter.elements-compounds]
    difficulty: 2
    type: numeric
    stem: "กลูโคสมีสูตร $\\mathrm{C_6H_{12}O_6}$ กลูโคส 1 โมเลกุลมีอะตอมรวมกี่อะตอม"
    answer: { value: 24, unit: อะตอม }
    misconceptions:
      - { match: 3, feedback: "3 คือจำนวนชนิดของธาตุ (C, H, O) โจทย์ถามจำนวนอะตอมทั้งหมด" }
      - { match: 432, feedback: "ตัวเลขห้อยต้องนำมาบวกกัน ไม่ใช่คูณกัน" }
    hints:
      - "ตัวเลขห้อยบอกจำนวนอะตอมของธาตุที่อยู่หน้าตัวเลข"
      - "บวกจำนวนอะตอมของทุกธาตุ"
    solution: "C 6 + H 12 + O 6 = **24 อะตอม**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.elements-compounds.p004
    topics: [chemistry.matter.elements-compounds]
    difficulty: 2
    type: mcq
    stem: "ธาตุ X มีผิวมันวาว ตีเป็นแผ่นบางได้ และต่อในวงจรแล้วหลอดไฟสว่าง ธาตุ X น่าจะเป็นธาตุกลุ่มใด"
    choices:
      - { id: a, text: "โลหะ", correct: true, feedback: "ถูก มันวาว ตีแผ่ได้ และนำไฟฟ้าดี เป็นสมบัติของโลหะครบทุกข้อ" }
      - { id: b, text: "อโลหะ", feedback: "อโลหะที่เป็นของแข็งมักเปราะและไม่นำไฟฟ้า" }
      - { id: c, text: "กึ่งโลหะ", feedback: "กึ่งโลหะมันวาวได้ แต่เปราะ ตีเป็นแผ่นไม่ได้" }
    hints:
      - "พิจารณาสมบัติทีละข้อ"
      - "ธาตุกลุ่มใดตีแผ่ได้"
    solution: "การตีแผ่ได้ร่วมกับการนำไฟฟ้าดีและผิวมันวาว บอกว่า X เป็น **โลหะ**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.elements-compounds.p005
    topics: [chemistry.matter.elements-compounds]
    difficulty: 3
    type: mcq
    stem: "จากภาพแบบจำลองอนุภาค กล่องใดแสดง **สารประกอบ**"
    figure:
      src: p-particle-boxes.svg
      alt: "4 กล่อง กล่อง ก: อนุภาค 4 ตัว แต่ละตัวเป็นอะตอม C สีเทาเข้มหนึ่งอะตอมอยู่ตรงกลางระหว่างอะตอม O สีแดงสองอะตอม ทุกอนุภาคเหมือนกัน กล่อง ข: มีอนุภาค 2 แบบปนกัน คืออะตอม H สีขาวสองอะตอมติดกัน 4 ตัว และอะตอม O สีแดงสองอะตอมติดกัน 3 ตัว กล่อง ค: อะตอม Ne สีส้มอยู่เดี่ยว ๆ 8 อะตอม กล่อง ง: อะตอม N สีน้ำเงินสองอะตอมติดกัน 6 ตัว"
    choices:
      - { id: a, text: "กล่อง ก", correct: true, feedback: "ถูก ทุกอนุภาคเหมือนกัน และแต่ละอนุภาคมีอะตอม 2 ชนิด (C และ O) คือ $\\mathrm{CO_2}$" }
      - { id: b, text: "กล่อง ข", feedback: "มีอะตอมสองชนิดก็จริง แต่ H กับ O อยู่คนละอนุภาค กล่องนี้เป็นสารผสมของธาตุ 2 ชนิด" }
      - { id: c, text: "กล่อง ค", feedback: "อะตอมชนิดเดียวอยู่เดี่ยว ๆ เป็นธาตุ" }
      - { id: d, text: "กล่อง ง", feedback: "แต่ละโมเลกุลมีอะตอม N ชนิดเดียว เป็นโมเลกุลของธาตุ ไม่ใช่สารประกอบ" }
    hints:
      - "สารประกอบมีอนุภาคเหมือนกันทุกตัว"
      - "และในอนุภาคหนึ่งต้องมีอะตอมมากกว่าหนึ่งชนิดยึดกันอยู่"
    solution: "กล่อง ก มีอนุภาคแบบเดียว ทุกอนุภาคมี C 1 อะตอมกับ O 2 อะตอม จึงเป็น **สารประกอบ** กล่อง ข เป็นสารผสม กล่อง ค และ ง เป็นธาตุ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.elements-compounds.p006
    topics: [chemistry.matter.elements-compounds]
    difficulty: 2
    type: text
    stem: "ซิลิคอนผิวมันวาว แต่เปราะ และนำไฟฟ้าได้เล็กน้อย จึงใช้ทำแผงโซลาร์เซลล์ ซิลิคอนจัดเป็นธาตุกลุ่มใด"
    accepted: ["กึ่งโลหะ", "ธาตุกึ่งโลหะ", "metalloid", "semimetal"]
    misconceptions:
      - { match: "โลหะ", feedback: "ผิวมันวาวอย่างเดียวไม่พอ ซิลิคอนเปราะและนำไฟฟ้าได้น้อยกว่าโลหะมาก" }
      - { match: "อโลหะ", feedback: "ซิลิคอนนำไฟฟ้าได้บ้างและมันวาว ต่างจากอโลหะทั่วไป" }
    hints:
      - "มีสมบัติบางอย่างเหมือนโลหะ บางอย่างเหมือนอโลหะ"
      - "ชื่อกลุ่มนี้บอกว่าอยู่ระหว่างกลาง"
    solution: "ซิลิคอนมีทั้งสมบัติแบบโลหะ (มันวาว) และแบบอโลหะ (เปราะ นำไฟฟ้าได้น้อย) จึงเป็น **กึ่งโลหะ**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.elements-compounds.p007
    topics: [chemistry.matter.elements-compounds]
    difficulty: 3
    type: numeric
    stem: "แอมโมเนียมซัลเฟต $\\mathrm{(NH_4)_2SO_4}$ เป็นปุ๋ยที่ชาวนาไทยใช้กันมาก หนึ่งหน่วยสูตรมีอะตอมไฮโดรเจนกี่อะตอม"
    answer: { value: 8, unit: อะตอม }
    misconceptions:
      - { match: 4, feedback: "ลืมคูณด้วย 2 ที่อยู่นอกวงเล็บ กลุ่ม $\\mathrm{NH_4}$ มี 2 กลุ่ม" }
      - { match: 6, feedback: "บวก 4 กับ 2 ไม่ได้ ตัวเลข 2 นอกวงเล็บต้องคูณ" }
    hints:
      - "H อยู่ในวงเล็บ $\\mathrm{(NH_4)}$"
      - "ตัวเลขห้อยหลังวงเล็บคูณทุกอะตอมในวงเล็บ"
    solution: "ในวงเล็บมี H 4 อะตอม และมี 2 กลุ่ม จึงมี H $4 \\times 2 =$ **8 อะตอม**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.elements-compounds.p008
    topics: [chemistry.matter.elements-compounds]
    difficulty: 3
    type: mcq
    stem: "เมื่อผ่านไฟฟ้ากระแสตรงลงในน้ำ (เติมเกลือเล็กน้อยให้นำไฟฟ้า) ได้แก๊สไฮโดรเจนและแก๊สออกซิเจน ข้อสรุปใดถูกต้องที่สุด"
    choices:
      - { id: a, text: "น้ำเป็นสารประกอบ เพราะแยกด้วยวิธีทางเคมีได้เป็นธาตุ 2 ชนิด", correct: true, feedback: "ถูก สารประกอบแยกด้วยวิธีกายภาพไม่ได้ แต่แยกด้วยวิธีทางเคมีได้" }
      - { id: b, text: "น้ำเป็นธาตุ เพราะเป็นสารบริสุทธิ์", feedback: "สารบริสุทธิ์มีทั้งธาตุและสารประกอบ ธาตุแยกเป็นสารที่ง่ายกว่าไม่ได้" }
      - { id: c, text: "น้ำเป็นสารผสมของไฮโดรเจนกับออกซิเจน", feedback: "สารผสมแยกด้วยวิธีกายภาพได้ และมีสมบัติของสารเดิม แต่น้ำมีสมบัติต่างจากแก๊สทั้งสองชนิดอย่างสิ้นเชิง" }
    hints:
      - "ธาตุแยกให้เป็นสารที่ง่ายกว่าได้หรือไม่"
      - "การผ่านไฟฟ้าเป็นวิธีทางเคมี"
    solution: "น้ำแยกเป็นไฮโดรเจนและออกซิเจนได้ด้วยวิธีทางเคมี และมีสมบัติต่างจากแก๊สทั้งสอง จึงเป็น **สารประกอบ**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.elements-compounds.p009
    topics: [chemistry.matter.elements-compounds]
    difficulty: 3
    type: order
    stem: "นักเรียนต่อวงจรหลอดไฟทดสอบแท่งธาตุ 3 ชนิดที่ขนาดเท่ากัน เรียงจาก **นำไฟฟ้าได้ดีที่สุด** ไป **นำไฟฟ้าได้น้อยที่สุด**"
    items:
      - "ทองแดง"
      - "ซิลิคอน"
      - "กำมะถัน"
    hints:
      - "จัดกลุ่มแต่ละธาตุก่อนว่าเป็นโลหะ อโลหะ หรือกึ่งโลหะ"
      - "กึ่งโลหะนำไฟฟ้าได้น้อยกว่าโลหะ แต่มากกว่าอโลหะ"
    solution: "ทองแดง (โลหะ) นำไฟฟ้าดีมาก > ซิลิคอน (กึ่งโลหะ) นำได้เล็กน้อย > กำมะถัน (อโลหะ) แทบไม่นำไฟฟ้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.elements-compounds.p010
    topics: [chemistry.matter.elements-compounds]
    difficulty: 3
    type: numeric
    stem: "ไอโอดีน-131 มีครึ่งชีวิต 8 วัน ถ้าเริ่มต้นมี 64 mg ผ่านไป 16 วันจะเหลือไอโอดีน-131 กี่มิลลิกรัม"
    answer: { value: 16, unit: mg }
    misconceptions:
      - { match: 0, feedback: "ไม่ได้ลดลงครั้งละ 32 mg แต่ลดลงครั้งละครึ่งหนึ่งของที่เหลืออยู่" }
      - { match: 32, feedback: "32 mg คือที่เหลือหลัง 8 วัน (หนึ่งครึ่งชีวิต) แต่ 16 วันคือสองครึ่งชีวิต" }
    hints:
      - "16 วันเท่ากับกี่ครึ่งชีวิต"
      - "แบ่งครึ่งทีละครั้งตามจำนวนครึ่งชีวิต"
    solution: "$16 \\div 8 = 2$ ครึ่งชีวิต: 64 → 32 → **16 mg**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.elements-compounds.p011
    topics: [chemistry.matter.elements-compounds]
    difficulty: 4
    type: numeric
    stem: "คาร์บอน-14 มีครึ่งชีวิต 5,730 ปี ไม้จากโบราณสถานชิ้นหนึ่งมีคาร์บอน-14 เหลือ $\\tfrac14$ ของไม้ที่เพิ่งตัด ไม้ชิ้นนี้มีอายุประมาณกี่ปี"
    answer: { value: 11460, tolerance: 10, unit: ปี }
    misconceptions:
      - { match: 22920, feedback: "เหลือ $\\tfrac14$ ไม่ได้แปลว่าผ่านไป 4 ครึ่งชีวิต $\\tfrac12 \\times \\tfrac12 = \\tfrac14$ คือ 2 ครึ่งชีวิต" }
      - { match: 5730, feedback: "หนึ่งครึ่งชีวิตเหลือ $\\tfrac12$ แต่ไม้ชิ้นนี้เหลือ $\\tfrac14$" }
    hints:
      - "แบ่งครึ่งกี่ครั้งจึงเหลือ $\\tfrac14$"
      - "คูณจำนวนครึ่งชีวิตด้วย 5,730 ปี"
    solution: "$1 \\to \\tfrac12 \\to \\tfrac14$ คือ 2 ครึ่งชีวิต อายุ $= 2 \\times 5{,}730 =$ **11,460 ปี**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.elements-compounds.p012
    topics: [chemistry.matter.elements-compounds]
    difficulty: 3
    type: mcq
    stem: "ชาวอำเภอร่อนพิบูลย์ จังหวัดนครศรีธรรมราช เคยป่วยเป็นโรคไข้ดำจากสารหนูที่ปนเปื้อนในน้ำ ข้อใดอธิบายถูกต้อง"
    choices:
      - { id: a, text: "สารหนูเป็นกึ่งโลหะ ปนเปื้อนจากการทำเหมืองแร่ ควรตรวจคุณภาพน้ำก่อนใช้", correct: true, feedback: "ถูก สารหนูมาจากกากแร่ของเหมืองดีบุก การตรวจน้ำและใช้น้ำประปาที่ปลอดภัยช่วยป้องกันได้" }
      - { id: b, text: "สารหนูเป็นธาตุกัมมันตรังสี จึงทำให้ผิวไหม้", feedback: "สารหนูไม่ใช่ธาตุกัมมันตรังสี เป็นพิษเพราะเป็นสารเคมีอันตราย" }
      - { id: c, text: "ต้มน้ำให้เดือดก็กำจัดสารหนูได้", feedback: "การต้มฆ่าเชื้อโรคได้ แต่ไม่กำจัดธาตุที่ละลายอยู่ น้ำที่ระเหยไปยิ่งทำให้สารหนูเข้มข้นขึ้น" }
      - { id: d, text: "สารหนูเป็นโลหะ จึงตกตะกอนเองหมดเมื่อตั้งน้ำทิ้งไว้", feedback: "สารหนูเป็นกึ่งโลหะ และสารประกอบของมันละลายอยู่ในน้ำได้ ไม่ตกตะกอนเอง" }
    hints:
      - "สารหนูอยู่กลุ่มเดียวกับซิลิคอนและโบรอน"
      - "นึกถึงแหล่งที่มาของสารพิษในพื้นที่ที่มีเหมืองแร่"
    solution: "สารหนูเป็น **กึ่งโลหะ** ที่ปนเปื้อนจากการทำเหมืองแร่ การต้มน้ำไม่ช่วย ต้องตรวจคุณภาพน้ำและใช้แหล่งน้ำที่ปลอดภัย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.elements-compounds.p013
    topics: [chemistry.matter.elements-compounds]
    difficulty: 3
    type: mcq
