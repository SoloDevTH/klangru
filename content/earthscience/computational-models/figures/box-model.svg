<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="sans-serif" font-size="14">
<title>แบบจำลองกล่องคาร์บอนอย่างง่าย</title>
<rect x="0" y="0" width="800" height="330" fill="#ffffff"/>
<rect x="20.0" y="110.0" width="200.0" height="110.0" rx="8" fill="#e7e5e4" stroke="#334155" stroke-width="1.5"/>
<text x="120.0" y="136.0" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">แหล่งปล่อย</text>
<text x="120.0" y="160.0" text-anchor="middle" font-size="12" fill="#222">เผาเชื้อเพลิงซากดึกดำบรรพ์</text>
<text x="120.0" y="178.0" text-anchor="middle" font-size="12" fill="#222">ตัดป่า ผลิตปูนซีเมนต์</text>
<rect x="300.0" y="90.0" width="200.0" height="150.0" rx="8" fill="#dbeafe" stroke="#334155" stroke-width="1.5"/>
<text x="400.0" y="116.0" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">บรรยากาศ (สต็อก A)</text>
<text x="400.0" y="140.0" text-anchor="middle" font-size="12" fill="#222">A = คาร์บอนในอากาศ (GtC)</text>
<text x="400.0" y="158.0" text-anchor="middle" font-size="12" fill="#222">1 ppm = 2.12 GtC</text>
<text x="400.0" y="176.0" text-anchor="middle" font-size="12" fill="#222">ปัจจุบัน 420 ppm ≈ 890 GtC</text>
<text x="400.0" y="194.0" text-anchor="middle" font-size="12" fill="#222">ก่อนอุตสาหกรรม A₀ ≈ 594 GtC</text>
<rect x="580.0" y="110.0" width="200.0" height="110.0" rx="8" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/>
<text x="680.0" y="136.0" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">แหล่งดูดกลับ</text>
<text x="680.0" y="160.0" text-anchor="middle" font-size="12" fill="#222">มหาสมุทร</text>
<text x="680.0" y="178.0" text-anchor="middle" font-size="12" fill="#222">พืชบนบกและดิน</text>
<line x1="222.0" y1="165.0" x2="296.0" y2="165.0" stroke="#b45309" stroke-width="4"/>
<polygon points="296.0,165.0 284.0,170.1 284.0,159.9" fill="#b45309" stroke="#b45309" stroke-width="1"/>
<text x="259.0" y="150.0" text-anchor="middle" font-size="15" fill="#b45309" font-weight="bold">E</text>
<text x="259.0" y="192.0" text-anchor="middle" font-size="12" fill="#b45309">ปล่อย</text>
<line x1="502.0" y1="165.0" x2="576.0" y2="165.0" stroke="#15803d" stroke-width="4"/>
<polygon points="576.0,165.0 564.0,170.1 564.0,159.9" fill="#15803d" stroke="#15803d" stroke-width="1"/>
<text x="539.0" y="150.0" text-anchor="middle" font-size="14" fill="#15803d" font-weight="bold">k(A − A₀)</text>
<text x="539.0" y="192.0" text-anchor="middle" font-size="12" fill="#15803d">ดูดกลับ</text>
<text x="400.0" y="40.0" text-anchor="middle" font-size="15" fill="#111" font-weight="bold">อัตราการเปลี่ยนของสต็อก = อัตราเข้า − อัตราออก</text>
<text x="400.0" y="282.0" text-anchor="middle" font-size="15" fill="#1e3a8a" font-weight="bold">A ปีถัดไป = A + E − k × (A − A₀)</text>
<text x="400.0" y="308.0" text-anchor="middle" font-size="12" fill="#555">ตัวอย่างในบทเรียน E = 10 GtC ต่อปี k = 0.02 ต่อปี (ค่าโดยประมาณ)</text>
</svg>