  - id: biology.plants.plant-products-growth.p013
    topics: [biology.plants.plant-products-growth]
    difficulty: 4
    type: mcq
    stem: "นักเรียนต้องการทดสอบว่าปุ๋ยยูเรียช่วยให้ผักบุ้งโตดีขึ้นหรือไม่ จึงปลูกผักบุ้ง 1 ต้นในดินร่วนผสมปุ๋ยวางไว้ในห้อง และอีก 1 ต้นในดินทรายไม่ใส่ปุ๋ยวางไว้กลางแดด การออกแบบนี้มีข้อบกพร่องสำคัญที่สุดอย่างไร"
    choices:
      - { id: a, text: "เปลี่ยนตัวแปรหลายตัวพร้อมกันและมีเพียงชุดละ 1 ต้น จึงสรุปไม่ได้ว่าผลเกิดจากปุ๋ย", correct: true }
      - { id: b, text: "ไม่ได้ใช้ปุ๋ยหลายสูตร", feedback: "การทดลองนี้ถามเฉพาะปุ๋ยยูเรีย ไม่จำเป็นต้องใช้หลายสูตร ปัญหาคือตัวแปรอื่นไม่ถูกควบคุม" }
      - { id: c, text: "ผักบุ้งไม่ต้องการธาตุไนโตรเจน", feedback: "ผักบุ้งต้องการไนโตรเจนเพื่อสร้างโปรตีนและคลอโรฟิลล์ ปัญหาอยู่ที่การออกแบบ" }
    hints:
      - "นอกจากปุ๋ยแล้ว สองชุดนี้ต่างกันในเรื่องใดอีก"
      - "ถ้ามีต้นเดียวและต้นนั้นผิดปกติ ผลจะเชื่อถือได้หรือไม่"
    solution: "สองชุดต่างกันทั้งปุ๋ย ชนิดดิน และแสง จึงบอกไม่ได้ว่าความต่างเกิดจากปัจจัยใด และมีชุดละต้นเดียวทำให้ผลขึ้นกับต้นที่ผิดปกติได้ ควรเปลี่ยนเฉพาะปุ๋ย ควบคุมดินและแสงให้เท่ากัน และใช้หลายต้นต่อชุด"
