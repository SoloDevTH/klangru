    hints:
      - "จุดคุ้มทุนคือจุดตัดของกราฟรายได้กับกราฟต้นทุน ให้ $70x = 0.5x^2 + 650$"
      - "คูณด้วย 2 แล้วจัดรูป ได้ $x^2 - 140x + 1300 = 0$ แยกตัวประกอบ"
    misconceptions:
      - { match: 130, feedback: "130 จานเป็นจุดคุ้มทุนอีกจุด หลังจากนั้นต้นทุนจะสูงกว่ารายได้ โจทย์ถามจำนวนน้อยที่สุด" }
      - { match: 9, feedback: "ลองแทน $x = 9$: รายได้ 630 บาท ต้นทุน 690.5 บาท ยังขาดทุน" }
    solution: "$x^2 - 140x + 1300 = (x - 10)(x - 130) = 0$ ได้ $x = 10$ หรือ $130$ ขายอย่างน้อย 10 จานจึงคุ้มทุน (ตรวจ: รายได้ 700 บาท ต้นทุน $50 + 650 = 700$ บาท)"
