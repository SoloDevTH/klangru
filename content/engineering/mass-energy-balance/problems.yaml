      - "ปฏิกิริยาเคมีจัดเรียงอะตอมใหม่"
    solution: "ปฏิกิริยาเคมีไม่สร้างหรือทำลายอะตอม ดุลอะตอมของแต่ละธาตุ (และมวลรวม) จึงเป็น เข้า = ออก ส่วนโมเลกุลแต่ละชนิดต้องมีพจน์เกิดหรือใช้ไป"
