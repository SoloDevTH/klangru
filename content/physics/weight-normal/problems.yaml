      - { match: 240.1, feedback: "ดูเหมือนนำน้ำหนักคูณ $g$ มวลคือน้ำหนัก **หาร** ด้วย $g$" }
    solution: "เข็มชี้ประมาณ $24.5\\ \\mathrm{N}$ จึงได้ $m = \\dfrac{24.5}{9.8} = 2.5\\ \\mathrm{kg}$"
