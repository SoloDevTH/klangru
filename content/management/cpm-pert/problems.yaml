  - id: management.project.cpm-pert.p015
    topics: [management.project.cpm-pert]
    difficulty: 5
    type: numeric
    stem: "ข่ายงานห้องสมุดในภาพปกติใช้ 17 วัน ค่าใช้จ่ายทางอ้อม (ควบคุมงาน เช่าเครื่องมือ) วันละ 4,000 บาท ต้นทุนเร่งต่อวันและจำนวนวันที่เร่งได้สูงสุด A 1,000 (1 วัน) B 3,000 (2 วัน) C 1,500 (1 วัน) D 2,000 (2 วัน) E 2,500 (2 วัน) F 5,000 (1 วัน) G 6,000 (1 วัน) ต้นทุนรวม (ค่าเร่ง + ค่าใช้จ่ายทางอ้อม) ต่ำสุดเป็นกี่บาท"
