<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 435" width="760" height="435" font-family="sans-serif">
<title>หน่วยงานรับเรื่องร้องเรียนด้านสุขภาพของผู้บริโภค</title>
<rect x="0" y="0" width="760" height="435" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="380.0" y="28.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">ปัญหาแบบนี้ ติดต่อหน่วยงานใด</text>
<rect x="20.0" y="55.0" width="470.0" height="58.0" rx="8" fill="#d6eaf8" stroke="#999" stroke-width="1.5"/>
<text x="34.0" y="79.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="#111">สินค้าหรือบริการทั่วไปไม่เป็นธรรม</text>
<text x="34.0" y="100.0" font-size="12" text-anchor="start" fill="#333">สัญญาเอาเปรียบ โฆษณาหลอกลวง ไม่ส่งของ</text>
<line x1="495.0" y1="84.0" x2="545.0" y2="84.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="550.0" y="55.0" width="190.0" height="58.0" rx="8" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="645.0" y="80.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">สคบ.</text>
<text x="645.0" y="102.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f5d99">โทร 1166</text>
<rect x="20.0" y="125.0" width="470.0" height="58.0" rx="8" fill="#d5f5e3" stroke="#999" stroke-width="1.5"/>
<text x="34.0" y="149.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="#111">อาหาร ยา เครื่องสำอาง เครื่องมือแพทย์</text>
<text x="34.0" y="170.0" font-size="12" text-anchor="start" fill="#333">ไม่ปลอดภัย ไม่มีเลข อย. โฆษณาเกินจริง</text>
<line x1="495.0" y1="154.0" x2="545.0" y2="154.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="550.0" y="125.0" width="190.0" height="58.0" rx="8" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="645.0" y="150.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">อย.</text>
<text x="645.0" y="172.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f5d99">โทร 1556</text>
<rect x="20.0" y="195.0" width="470.0" height="58.0" rx="8" fill="#fcf3cf" stroke="#999" stroke-width="1.5"/>
<text x="34.0" y="219.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="#111">สิทธิหลักประกันสุขภาพ (บัตรทอง)</text>
<text x="34.0" y="240.0" font-size="12" text-anchor="start" fill="#333">ถูกเรียกเก็บเงิน ใช้สิทธิไม่ได้</text>
<line x1="495.0" y1="224.0" x2="545.0" y2="224.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="550.0" y="195.0" width="190.0" height="58.0" rx="8" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="645.0" y="220.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">สปสช.</text>
<text x="645.0" y="242.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f5d99">โทร 1330</text>
<rect x="20.0" y="265.0" width="470.0" height="58.0" rx="8" fill="#fadbd8" stroke="#999" stroke-width="1.5"/>
<text x="34.0" y="289.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="#111">เจ็บป่วยฉุกเฉินวิกฤต</text>
<text x="34.0" y="310.0" font-size="12" text-anchor="start" fill="#333">แจ้งเหตุ และใช้สิทธิ UCEP 72 ชั่วโมงแรก</text>
<line x1="495.0" y1="294.0" x2="545.0" y2="294.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="550.0" y="265.0" width="190.0" height="58.0" rx="8" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="645.0" y="290.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">สพฉ.</text>
<text x="645.0" y="312.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f5d99">โทร 1669</text>
<rect x="20.0" y="335.0" width="470.0" height="58.0" rx="8" fill="#e8daef" stroke="#999" stroke-width="1.5"/>
<text x="34.0" y="359.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="#111">ถูกหลอกขายที่เป็นความผิดอาญา</text>
<text x="34.0" y="380.0" font-size="12" text-anchor="start" fill="#333">ของปลอม หลอกโอนเงิน</text>
<line x1="495.0" y1="364.0" x2="545.0" y2="364.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="550.0" y="335.0" width="190.0" height="58.0" rx="8" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="645.0" y="360.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">บก.ปคบ.</text>
<text x="645.0" y="382.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f5d99">โทร 1135</text>
<text x="380.0" y="425.0" font-size="12" text-anchor="middle" fill="#555">ถ้าบาดเจ็บหรือแพ้รุนแรง ไปพบแพทย์หรือโทร 1669 ก่อน แล้วจึงร้องเรียน</text>
</svg>
