    stem: "ข้อใดเป็น **ข้อมูลส่วนบุคคล** ตาม พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562 (ข้อมูลที่ระบุตัวบุคคลได้ทั้งทางตรงหรือทางอ้อม) (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "เลขประจำตัวประชาชน", correct: true }
      - { id: b, text: "ภาพใบหน้าที่เห็นชัด", correct: true }
      - { id: c, text: "ชื่อเล่น ห้อง และเลขที่ของนักเรียนในโรงเรียนหนึ่ง เมื่อนำมารวมกัน", correct: true }
      - { id: d, text: "จำนวนนักเรียนทั้งโรงเรียนที่มาโรงเรียนวันนี้", feedback: "เป็นตัวเลขสรุปรวม ไม่ได้ระบุว่าคนใดคนหนึ่งคือใคร" }
    hints:
      - "ข้อมูลส่วนบุคคลไม่จำเป็นต้องมีชื่อจริง ถ้ารวมกันแล้วรู้ว่าเป็นใครก็นับ"
      - "ถามว่าข้อมูลนี้ชี้ไปที่คนคนหนึ่งได้หรือไม่"
    solution: "เลขประจำตัวประชาชนและภาพใบหน้าระบุตัวได้ทางตรง ชื่อเล่นรวมกับห้องและเลขที่ระบุตัวได้ทางอ้อม ส่วนจำนวนนักเรียนทั้งโรงเรียนเป็นข้อมูลสรุปที่ไม่ชี้ไปที่ใคร"
