id: management.operations.lean
subject: management
title: { th: ลีน ไคเซ็น และผลิตภาพ, en: "Lean, kaizen and productivity" }
summary: แยกงานที่เพิ่มคุณค่ากับความสูญเปล่า 7 ประการและทักษะที่ไม่ได้ใช้ ทำ 5ส และไคเซ็น คำนวณเวลาแท็กต์ สมดุลสายการผลิต และผลิตภาพ
difficulty: 5
minutes: 40
prerequisites: [management.quality.concepts]
encompasses:
  - { id: management.quality.concepts, weight: 0.3 }
  - { id: math.number.ratio-percent, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: vsm.svg
    alt: "แผนผังสายธารคุณค่าของโรงงานตัดเย็บเสื้อ งานไหลจากซ้ายไปขวาผ่านสี่ขั้นตอน ตัดผ้า รอบเวลา 40 วินาที เย็บ 90 วินาที ตรวจ 20 วินาที แพ็ก 30 วินาที แล้วส่งลูกค้า ก่อนแต่ละขั้นมีสามเหลี่ยมสินค้าคงคลังรออยู่ 2 วัน 1.5 วัน 1 วัน และ 0.5 วัน ตามลำดับ เส้นเวลาด้านล่างสรุปว่าเวลานำรวมประมาณ 5 วัน แต่เวลาเพิ่มคุณค่ารวมเพียง 40 + 90 + 20 + 30 = 180 วินาที"
    caption: "เวลาส่วนใหญ่ของเสื้อหนึ่งตัวคือการรอในกอง ไม่ใช่การลงมือทำ"
  - { type: check, problem: mgt.lean.p022, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: worked-example
    title: เวลาแท็กต์ของโรงงานขนมเปี๊ยะ
    problem: "โรงงานขนมเปี๊ยะทำงานกะละ 8 ชั่วโมง พัก 30 นาที ร้านค้าสั่งขนมวันละ 540 กล่อง ปัจจุบันสถานีห่อกล่องใช้เวลากล่องละ 55 วินาที สายการผลิตผลิตทันความต้องการหรือไม่"
    steps:
      - text: "เวลาที่ใช้ได้จริง: $8 \\times 60 - 30 = 450$ นาที $= 450 \\times 60 = 27{,}000$ วินาที"
        why: "เวลาพักไม่ได้ใช้ผลิต จึงต้องหักออกก่อน"
      - text: "เวลาแท็กต์: $\\dfrac{27{,}000}{540} = 50$ วินาทีต่อกล่อง"
      - text: "เทียบรอบเวลา: สถานีห่อกล่องใช้ 55 วินาที นานกว่าแท็กต์ 50 วินาที"
        why: "ทุก 50 วินาทีลูกค้าต้องการขนม 1 กล่อง แต่สถานีนี้ทำได้ 1 กล่องทุก 55 วินาที งานจะค้างสะสมเรื่อย ๆ"
      - text: "กำลังผลิตจริงต่อวัน: $\\dfrac{27{,}000}{55} \\approx 490$ กล่อง ขาดไปราว 50 กล่อง"
    answer: "เวลาแท็กต์ 50 วินาที สถานีห่อกล่อง (55 วินาที) เป็นคอขวด ผลิตได้ราว 490 กล่องต่อวัน ไม่ทันความต้องการ 540 กล่อง ต้องลดรอบเวลาของสถานีนี้ เช่น ทำไคเซ็นหรือเพิ่มคน"
  - { type: check, problem: mgt.lean.p004 }
  - type: worked-example
    title: จัดสมดุลสายประกอบพัดลม
    problem: "สายประกอบพัดลมมี 5 สถานี รอบเวลา 40, 44, 50, 38 และ 42 วินาที เวลาที่ใช้ได้จริงวันละ 27,000 วินาที ลูกค้าต้องการวันละ 600 เครื่อง จงหาเวลาแท็กต์ จำนวนสถานีน้อยที่สุดตามทฤษฎี และประสิทธิภาพสมดุลสายก่อนและหลังย้ายงาน 6 วินาทีจากสถานีที่ 3 ไปสถานีที่ 4"
    figure:
      src: line-balance.svg
      alt: "กราฟแท่งรอบเวลาของ 5 สถานี สถานี 1 = 40 วินาที สถานี 2 = 44 สถานี 3 = 50 (สีส้ม เป็นคอขวด) สถานี 4 = 38 สถานี 5 = 42 มีเส้นประแนวนอนที่ 45 วินาทีแทนเวลาแท็กต์ สถานี 3 เป็นแท่งเดียวที่สูงเกินเส้น"
    steps:
      - text: "เวลาแท็กต์: $\\dfrac{27{,}000}{600} = 45$ วินาที สถานีที่ 3 (50 วินาที) เกินแท็กต์จึงเป็นคอขวด"
      - text: "เวลางานรวม: $40 + 44 + 50 + 38 + 42 = 214$ วินาที จำนวนสถานีน้อยที่สุด $\\left\\lceil \\dfrac{214}{45} \\right\\rceil = \\lceil 4.76 \\rceil = 5$ สถานี"
        why: "4 สถานีรับงานได้แค่ $4 \\times 45 = 180$ วินาที น้อยกว่า 214 วินาที จึงต้องปัดขึ้น"
      - text: "ประสิทธิภาพสมดุลสายก่อนปรับ: $\\dfrac{214}{5 \\times 50} \\times 100 = 85.6\\%$"
        why: "ทุกสถานีต้องรอตามจังหวะของคอขวด 50 วินาที เวลาที่สถานีอื่นว่างจึงเป็นการรอคอย"
      - text: "หลังย้ายงาน 6 วินาที: รอบเวลาเป็น 40, 44, 44, 44, 42 คอขวดใหม่ 44 วินาที ไม่เกินแท็กต์ ประสิทธิภาพ $\\dfrac{214}{5 \\times 44} \\times 100 \\approx 97.3\\%$"
    answer: "แท็กต์ 45 วินาที ต้องใช้อย่างน้อย 5 สถานี ประสิทธิภาพสมดุลสายเพิ่มจาก 85.6% เป็นประมาณ 97.3% และผลิตทันความต้องการโดยไม่ต้องเพิ่มคน"
glossary:
  - { term: ความสูญเปล่า (มูดะ), definition: "กิจกรรมที่ใช้ทรัพยากรแต่ไม่เพิ่มคุณค่าในมุมของลูกค้า แบ่งเป็น 7 ประการ ได้แก่ ผลิตมากเกิน สินค้าคงคลัง การขนส่ง การเคลื่อนไหว การรอคอย กระบวนการเกินจำเป็น ของเสีย และนิยมเพิ่มข้อที่ 8 คือทักษะที่ไม่ได้ใช้" }
  - { term: 5ส, definition: "สะสาง สะดวก สะอาด สุขลักษณะ สร้างนิสัย หลักจัดระเบียบที่ทำงานที่เป็นพื้นฐานของลีน" }
  - { term: ไคเซ็น, definition: "การปรับปรุงทีละน้อยอย่างต่อเนื่องโดยทุกคนในองค์กร" }
  - { term: เวลาแท็กต์, definition: "เวลาทำงานที่ใช้ได้จริงหารด้วยความต้องการของลูกค้า เป็นจังหวะที่ต้องผลิตแต่ละชิ้นให้ทัน" }
  - { term: ผลิตภาพ, definition: "อัตราส่วนผลผลิตต่อปัจจัยนำเข้า เช่น จำนวนชิ้นต่อชั่วโมงแรงงาน" }
flashcards:
  - { front: "สูตรเวลาแท็กต์", back: "เวลาทำงานที่ใช้ได้จริง (หักเวลาพักแล้ว) ÷ ความต้องการของลูกค้า" }
  - { front: "ความสูญเปล่า 7 ประการ + 1", back: "ผลิตมากเกิน · สินค้าคงคลัง · การขนส่ง · การเคลื่อนไหว · การรอคอย · กระบวนการเกินจำเป็น · ของเสีย + ทักษะที่ไม่ได้ใช้" }
  - { front: "5ส เรียงตามลำดับ", back: "สะสาง → สะดวก → สะอาด → สุขลักษณะ → สร้างนิสัย" }
  - { front: "จำนวนสถานีน้อยที่สุดตามทฤษฎี", back: "เวลางานรวมต่อชิ้น ÷ เวลาแท็กต์ แล้วปัดขึ้นเป็นจำนวนเต็ม" }
  - { front: "ผลิตภาพแรงงาน", back: "ผลผลิต ÷ ชั่วโมงแรงงาน (จำนวนคน × ชั่วโมงที่ทำงาน)" }
