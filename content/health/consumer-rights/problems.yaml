  - id: c
    text: ไม่ต้องทำอะไรเลย กินยาต่อไป
    feedback: ถ้าสงสัยว่ายาไม่ปลอดภัย ควรหยุดใช้และให้ผู้เชี่ยวชาญตรวจสอบ
  hints:
