problems:
  - id: business.accounting.double-entry.p001
    topics: [business.accounting.double-entry]
    difficulty: 1
    type: match
    stem: "จับคู่ชื่อบัญชีกับหมวดในผังบัญชี"
    pairs:
      - { left: "ลูกหนี้การค้า", right: "1 สินทรัพย์" }
      - { left: "เจ้าหนี้การค้า", right: "2 หนี้สิน" }
      - { left: "ถอนใช้ส่วนตัว", right: "3 ส่วนของเจ้าของ" }
      - { left: "รายได้ค่าบริการ", right: "4 รายได้" }
      - { left: "ค่าสาธารณูปโภค", right: "5 ค่าใช้จ่าย" }
    hints:
      - "ลูกหนี้คือคนที่ค้างจ่ายเรา เจ้าหนี้คือคนที่เราค้างจ่าย"
      - "ถอนใช้ส่วนตัวลดส่วนของเจ้าของโดยตรง ไม่ใช่ค่าใช้จ่ายของกิจการ"
    solution: "ลูกหนี้การค้า → สินทรัพย์ · เจ้าหนี้การค้า → หนี้สิน · ถอนใช้ส่วนตัว → ส่วนของเจ้าของ · รายได้ค่าบริการ → รายได้ · ค่าสาธารณูปโภค → ค่าใช้จ่าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.double-entry.p002
    topics: [business.accounting.double-entry]
    difficulty: 1
    type: mcq
    stem: "เมื่อ **สินทรัพย์เพิ่มขึ้น** ต้องบันทึกในบัญชีนั้นด้านใด"
    choices:
      - { id: a, text: "ด้านเดบิต (ซ้าย)", correct: true }
      - { id: b, text: "ด้านเครดิต (ขวา)", feedback: "ด้านเครดิตใช้บันทึกการลดของสินทรัพย์" }
      - { id: c, text: "บันทึกทั้งสองด้านของบัญชีเดียวกัน", feedback: "บัญชีคู่หมายถึงบันทึกอย่างน้อยสองบัญชี ไม่ใช่สองด้านของบัญชีเดียว" }
      - { id: d, text: "แล้วแต่ว่าเป็นเงินสดหรือไม่", feedback: "สินทรัพย์ทุกชนิดใช้หลักเดียวกัน คือเพิ่มทางเดบิต" }
    hints:
      - "สินทรัพย์อยู่ทางซ้ายของสมการบัญชี"
      - "บัญชีทางซ้ายของสมการเพิ่มด้านซ้าย"
    solution: "สินทรัพย์อยู่ทางซ้ายของสมการบัญชี จึงเพิ่มทางเดบิต (ด้านซ้าย) และลดทางเครดิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.double-entry.p003
    topics: [business.accounting.double-entry]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "บัญชีใดมี **ยอดคงเหลือปกติด้านเดบิต** (เลือกได้มากกว่าหนึ่งข้อ)"
    choices:
      - { id: a, text: "เงินฝากธนาคาร", correct: true }
      - { id: b, text: "เงินเดือน (ค่าใช้จ่าย)", correct: true }
      - { id: c, text: "ถอนใช้ส่วนตัว", correct: true }
      - { id: d, text: "เงินกู้ยืม", feedback: "เงินกู้ยืมเป็นหนี้สิน เพิ่มทางเครดิต ยอดปกติจึงอยู่ด้านเครดิต" }
      - { id: e, text: "รายได้ค่าบริการ", feedback: "รายได้เพิ่มส่วนของเจ้าของ เพิ่มทางเครดิต ยอดปกติด้านเครดิต" }
    hints:
      - "ยอดคงเหลือปกติอยู่ด้านที่บัญชีนั้นเพิ่ม"
      - "สินทรัพย์ ค่าใช้จ่าย และถอนใช้ส่วนตัว เพิ่มทางเดบิต"
    solution: "เงินฝากธนาคาร (สินทรัพย์) เงินเดือน (ค่าใช้จ่าย) และถอนใช้ส่วนตัว มียอดปกติด้านเดบิต ส่วนเงินกู้ยืมและรายได้มียอดปกติด้านเครดิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.double-entry.p004
    topics: [business.accounting.double-entry]
    difficulty: 2
    type: mcq
    stem: "ร้านเสริมสวยในหาดใหญ่ (ร้านสมมติ) ซื้อเก้าอี้ทำผม (อุปกรณ์) $15{,}000$ บาท เป็นเงินเชื่อ บันทึกในสมุดรายวันทั่วไปอย่างไร"
    choices:
      - { id: a, text: "Dr. อุปกรณ์ $15{,}000$ / Cr. เจ้าหนี้การค้า $15{,}000$", correct: true }
      - { id: b, text: "Dr. อุปกรณ์ $15{,}000$ / Cr. เงินสด $15{,}000$", feedback: "ซื้อเป็นเงินเชื่อ ยังไม่ได้จ่ายเงินสด สิ่งที่เพิ่มคือหนี้ที่ต้องจ่ายผู้ขาย" }
      - { id: c, text: "Dr. เจ้าหนี้การค้า $15{,}000$ / Cr. อุปกรณ์ $15{,}000$", feedback: "สลับด้าน อุปกรณ์เพิ่มต้องเดบิต เจ้าหนี้เพิ่มต้องเครดิต" }
      - { id: d, text: "Dr. ค่าใช้จ่าย $15{,}000$ / Cr. เจ้าหนี้การค้า $15{,}000$", feedback: "เก้าอี้ใช้ได้หลายปี เป็นสินทรัพย์ (อุปกรณ์) ไม่ใช่ค่าใช้จ่ายทั้งก้อน" }
    hints:
      - "ร้านได้อะไรมา และมีภาระอะไรเพิ่ม"
      - "สินทรัพย์เพิ่ม → เดบิต หนี้สินเพิ่ม → เครดิต"
    solution: "อุปกรณ์ (สินทรัพย์) เพิ่ม บันทึกเดบิต เจ้าหนี้การค้า (หนี้สิน) เพิ่ม บันทึกเครดิต จำนวน $15{,}000$ บาทเท่ากันทั้งสองด้าน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.double-entry.p005
    topics: [business.accounting.double-entry]
    difficulty: 2
    type: mcq
    stem: "กิจการได้รับเงินสด $4{,}000$ บาท จากลูกค้าที่เคยใช้บริการเป็นเงินเชื่อเมื่อเดือนก่อน บันทึกอย่างไร"
    choices:
      - { id: a, text: "Dr. เงินสด $4{,}000$ / Cr. ลูกหนี้การค้า $4{,}000$", correct: true }
      - { id: b, text: "Dr. เงินสด $4{,}000$ / Cr. รายได้ค่าบริการ $4{,}000$", feedback: "รายได้บันทึกไปแล้วตอนให้บริการเดือนก่อน ถ้าบันทึกอีกครั้งรายได้จะซ้ำ" }
      - { id: c, text: "Dr. ลูกหนี้การค้า $4{,}000$ / Cr. เงินสด $4{,}000$", feedback: "สลับด้าน เงินสดเพิ่มต้องเดบิต ลูกหนี้ลดต้องเครดิต" }
      - { id: d, text: "ไม่ต้องบันทึก เพราะสินทรัพย์รวมไม่เปลี่ยน", feedback: "ยอดรวมไม่เปลี่ยนก็จริง แต่เงินสดเพิ่มและลูกหนี้ลด ต้องบันทึกทั้งสองบัญชี" }
    hints:
      - "รายได้ของบริการนี้บันทึกไปแล้วเมื่อใด"
      - "ตอนนี้เงินสดเพิ่ม และสิ่งใดลดลง"
    solution: "เงินสด (สินทรัพย์) เพิ่ม → เดบิต ลูกหนี้การค้า (สินทรัพย์) ลด → เครดิต รายได้บันทึกแล้วตอนให้บริการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.double-entry.p006
    topics: [business.accounting.double-entry]
    difficulty: 2
    type: numeric
    stem: "จากบัญชีแยกประเภทเงินสดในภาพ ยอดคงเหลือของบัญชีเงินสดสิ้นเดือนเป็นกี่บาท (ตอบเป็นบาท)"
    figure: { src: cash-ledger.svg, alt: "บัญชีแยกประเภทเงินสดเลขที่ 101 แบบตัวที ด้านเดบิต มีนาคม 1 ทุน 50,000 วันที่ 15 รายได้ค่าบริการ 12,500 วันที่ 20 ลูกหนี้การค้า 3,000 ด้านเครดิต มีนาคม 2 อุปกรณ์ 18,000 วันที่ 25 ค่าเช่า 6,000 วันที่ 28 ถอนใช้ส่วนตัว 2,000" }
    answer: { value: 39500, unit: บาท }
    hints:
      - "รวมด้านเดบิตและรวมด้านเครดิตแยกกัน"
      - "ยอดคงเหลือคือผลต่างของสองด้าน อยู่ด้านที่มากกว่า"
    misconceptions:
      - { match: 91500, feedback: "นำทั้งสองด้านมาบวกกัน ด้านเครดิตของเงินสดคือเงินที่จ่ายออก ต้องลบ" }
      - { match: 65500, feedback: "นั่นคือผลรวมด้านเดบิตอย่างเดียว ยังไม่ได้หักเงินที่จ่ายออก" }
    solution: "เดบิตรวม $= 50{,}000 + 12{,}500 + 3{,}000 = 65{,}500$ บาท เครดิตรวม $= 18{,}000 + 6{,}000 + 2{,}000 = 26{,}000$ บาท ยอดคงเหลือ $= 39{,}500$ บาท ด้านเดบิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.double-entry.p007
    topics: [business.accounting.double-entry]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการบันทึกบัญชีตั้งแต่เกิดรายการค้าจนได้งบทดลอง"
    items:
      - "วิเคราะห์รายการค้าว่ากระทบบัญชีใด เพิ่มหรือลด"
      - "บันทึกรายการในสมุดรายวันทั่วไป"
      - "ผ่านรายการไปบัญชีแยกประเภท"
      - "หายอดคงเหลือของแต่ละบัญชี"
      - "จัดทำงบทดลอง"
    hints:
      - "สมุดรายวันเป็นสมุดบันทึกรายการขั้นต้น บัญชีแยกประเภทเป็นขั้นปลาย"
      - "งบทดลองใช้ยอดคงเหลือของทุกบัญชี"
    solution: "วิเคราะห์ → สมุดรายวันทั่วไป → บัญชีแยกประเภท → ยอดคงเหลือ → งบทดลอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.double-entry.p008
    topics: [business.accounting.double-entry]
    difficulty: 3
    type: match
    stem: "ร้านรับจัดดอกไม้ในเชียงใหม่ (ร้านสมมติ) มีรายการค้าต่อไปนี้ จับคู่กับการบันทึกบัญชีที่ถูกต้อง"
    pairs:
      - { left: "จัดดอกไม้งานแต่งงาน รับเงินสด", right: "Dr. เงินสด / Cr. รายได้ค่าบริการ" }
      - { left: "จัดดอกไม้ให้โรงแรม เก็บเงินสิ้นเดือน", right: "Dr. ลูกหนี้การค้า / Cr. รายได้ค่าบริการ" }
      - { left: "จ่ายค่าจ้างผู้ช่วยด้วยเงินสด", right: "Dr. เงินเดือน / Cr. เงินสด" }
      - { left: "ซื้อริบบิ้นและโฟมจัดดอกไม้เป็นเงินเชื่อ", right: "Dr. วัสดุสิ้นเปลือง / Cr. เจ้าหนี้การค้า" }
      - { left: "เจ้าของหยิบเงินในลิ้นชักไปจ่ายค่าเทอมลูก", right: "Dr. ถอนใช้ส่วนตัว / Cr. เงินสด" }
    hints:
      - "ดูว่ารายการใดรับเงินทันที รายการใดเป็นเงินเชื่อ"
      - "ค่าเทอมลูกเป็นเรื่องส่วนตัวของเจ้าของ ไม่ใช่ค่าใช้จ่ายของร้าน"
    solution: "รับเงินสด → Dr. เงินสด Cr. รายได้ · เก็บเงินทีหลัง → Dr. ลูกหนี้ Cr. รายได้ · ค่าจ้าง → Dr. เงินเดือน Cr. เงินสด · ซื้อวัสดุเงินเชื่อ → Dr. วัสดุสิ้นเปลือง Cr. เจ้าหนี้ · ค่าเทอมลูก → Dr. ถอนใช้ส่วนตัว Cr. เงินสด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.double-entry.p009
    topics: [business.accounting.double-entry]
    difficulty: 3
    type: numeric
    stem: "งบทดลองของกิจการหนึ่งมียอดคงเหลือดังนี้ เงินสด $42{,}000$ ลูกหนี้การค้า $8{,}500$ วัสดุสิ้นเปลือง $3{,}200$ อุปกรณ์ $36{,}000$ เจ้าหนี้การค้า $7{,}700$ เงินกู้ยืม $20{,}000$ ทุน ? ถอนใช้ส่วนตัว $2{,}000$ รายได้ค่าบริการ $31{,}000$ ค่าเช่า $5{,}000$ เงินเดือน $9{,}000$ (บาท) ถ้างบทดลองยอดสองด้านเท่ากัน บัญชีทุนมียอดกี่บาท (ตอบเป็นบาท)"
    answer: { value: 47000, unit: บาท }
    hints:
      - "แยกบัญชีที่มียอดด้านเดบิต (สินทรัพย์ ค่าใช้จ่าย ถอนใช้ส่วนตัว) และด้านเครดิต (หนี้สิน ทุน รายได้)"
      - "ทุน $=$ ยอดเดบิตรวม $-$ ยอดเครดิตรวมของบัญชีอื่น"
    misconceptions:
      - { match: 51000, feedback: "นำถอนใช้ส่วนตัวไปไว้ด้านเครดิต ถอนใช้ส่วนตัวมียอดด้านเดบิต" }
      - { match: 43000, feedback: "ไม่ได้รวมถอนใช้ส่วนตัวไว้ด้านเดบิต" }
    solution: "เดบิตรวม $= 42{,}000 + 8{,}500 + 3{,}200 + 36{,}000 + 2{,}000 + 5{,}000 + 9{,}000 = 105{,}700$ บาท เครดิตที่รู้ $= 7{,}700 + 20{,}000 + 31{,}000 = 58{,}700$ บาท ทุน $= 105{,}700 - 58{,}700 = 47{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.double-entry.p010
    topics: [business.accounting.double-entry]
    difficulty: 3
    type: mcq
    stem: "บริษัทรับทำบัญชีให้บริการลูกค้ารายหนึ่ง $12{,}000$ บาท ลูกค้าจ่ายเงินสดทันที $5{,}000$ บาท ที่เหลือจะจ่ายเดือนหน้า บันทึกอย่างไร"
    choices:
      - { id: a, text: "Dr. เงินสด $5{,}000$, Dr. ลูกหนี้การค้า $7{,}000$ / Cr. รายได้ค่าบริการ $12{,}000$", correct: true }
      - { id: b, text: "Dr. เงินสด $5{,}000$ / Cr. รายได้ค่าบริการ $5{,}000$", feedback: "ให้บริการครบ $12{,}000$ บาทแล้ว รายได้จึงเป็น $12{,}000$ บาท ส่วนที่ยังไม่ได้รับเป็นลูกหนี้" }
      - { id: c, text: "Dr. เงินสด $12{,}000$ / Cr. รายได้ค่าบริการ $12{,}000$", feedback: "ได้รับเงินสดจริงเพียง $5{,}000$ บาท" }
      - { id: d, text: "Dr. เงินสด $5{,}000$, Dr. ลูกหนี้การค้า $7{,}000$ / Cr. เจ้าหนี้การค้า $12{,}000$", feedback: "กิจการไม่ได้เป็นหนี้ใคร รายการนี้เป็นรายได้จากการให้บริการ" }
    hints:
      - "รายการเดียวมีบัญชีเดบิตได้มากกว่าหนึ่งบัญชี (รายการรวม)"
      - "รายได้นับตามบริการที่ทำเสร็จ ไม่ใช่ตามเงินที่ได้รับ"
    solution: "เงินสดเพิ่ม $5{,}000$ ลูกหนี้เพิ่ม $7{,}000$ (เดบิตทั้งคู่) รายได้ค่าบริการเพิ่ม $12{,}000$ (เครดิต) ยอดเดบิตรวม $12{,}000$ เท่ากับเครดิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.double-entry.p011
    topics: [business.accounting.double-entry]
    difficulty: 3
    type: numeric
    stem: "บัญชีลูกหนี้การค้าเริ่มเดือนที่ 0 บาท ระหว่างเดือน (4) ให้บริการเป็นเงินเชื่อ $12{,}000$ บาท (10) รับชำระจากลูกหนี้ $5{,}000$ บาท (18) ให้บริการเป็นเงินเชื่อ $7{,}500$ บาท (26) รับชำระจากลูกหนี้ $9{,}000$ บาท สิ้นเดือนบัญชีลูกหนี้การค้ามียอดคงเหลือกี่บาท (ตอบเป็นบาท)"
    answer: { value: 5500, unit: บาท }
    hints:
      - "ให้บริการเป็นเงินเชื่อ → เดบิตลูกหนี้ รับชำระ → เครดิตลูกหนี้"
      - "ยอดคงเหลือ $=$ เดบิตรวม $-$ เครดิตรวม"
    misconceptions:
      - { match: 33500, feedback: "นำทุกจำนวนมาบวกกัน การรับชำระทำให้ลูกหนี้ลด ต้องลบ" }
      - { match: 19500, feedback: "นั่นคือเดบิตรวม ยังไม่ได้หักเงินที่รับชำระแล้ว" }
    solution: "เดบิต $12{,}000 + 7{,}500 = 19{,}500$ บาท เครดิต $5{,}000 + 9{,}000 = 14{,}000$ บาท ยอดคงเหลือ $= 5{,}500$ บาท ด้านเดบิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.double-entry.p012
    topics: [business.accounting.double-entry]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "ข้อผิดพลาดใดที่ **ทำให้งบทดลองยังมียอดสองด้านเท่ากัน** จึงหาไม่พบจากงบทดลอง (เลือกได้มากกว่าหนึ่งข้อ)"
    choices:
      - { id: a, text: "ลืมบันทึกการจ่ายค่าไฟทั้งรายการ", correct: true }
      - { id: b, text: "จ่ายค่าเช่าแต่บันทึกเดบิตบัญชีค่าสาธารณูปโภคแทน", correct: true }
      - { id: c, text: "บันทึกค่าซ่อม $850$ บาทเป็น $580$ บาททั้งด้านเดบิตและเครดิต", correct: true }
      - { id: d, text: "ผ่านรายการด้านเดบิตไปบัญชีแยกประเภทแล้ว แต่ลืมผ่านด้านเครดิต", feedback: "ด้านหนึ่งขาดไป ยอดสองด้านของงบทดลองจะไม่เท่ากัน จึงหาพบได้" }
      - { id: e, text: "ผ่านรายการเครดิตของเจ้าหนี้ไปไว้ด้านเดบิต", feedback: "ด้านเดบิตเกินและด้านเครดิตขาด ผลต่างเป็นสองเท่าของจำนวนนั้น งบทดลองจึงไม่เท่ากัน" }
    hints:
      - "ถามตัวเองว่าข้อผิดพลาดนั้นเปลี่ยนเดบิตและเครดิตเท่ากันหรือไม่"
      - "ถ้าทั้งสองด้านผิดเท่ากันหรือไม่ถูกบันทึกเลย ยอดรวมยังเท่ากัน"
    solution: "ลืมทั้งรายการ ผิดบัญชีแต่ถูกด้าน และจำนวนผิดเท่ากันสองด้าน ทำให้สองด้านยังเท่ากัน ส่วนผ่านรายการด้านเดียวและผ่านผิดด้านทำให้งบทดลองไม่เท่ากัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.double-entry.p013
    topics: [business.accounting.double-entry]
    difficulty: 4
    type: numeric
    stem: "สมุดรายวันบันทึกค่าเช่า $5{,}400$ บาทถูกต้อง แต่ตอนผ่านรายการไปบัญชีค่าเช่า (ด้านเดบิต) เขียนเป็น $4{,}500$ บาท ส่วนบัญชีเงินสดผ่านถูก งบทดลองจะมียอดสองด้านต่างกันกี่บาท (ตอบเป็นบาท)"
    answer: { value: 900, unit: บาท }
    hints:
      - "ด้านเดบิตขาดไปเท่าใดเมื่อเทียบกับที่ควรเป็น"
      - "ด้านเครดิตถูกต้อง ผลต่างจึงเท่ากับส่วนที่ด้านเดบิตขาด"
    misconceptions:
      - { match: 1800, feedback: "คูณสองเหมือนกรณีผ่านผิดด้าน แต่กรณีนี้ผิดเฉพาะจำนวนในด้านเดียว ผลต่างคือ $5{,}400 - 4{,}500$" }
      - { match: 9900, feedback: "นำสองจำนวนมาบวกกัน ต้องหาผลต่างของจำนวนที่ถูกกับที่เขียนผิด" }
    solution: "ด้านเดบิตขาด $5{,}400 - 4{,}500 = 900$ บาท ด้านเครดิตจึงมากกว่า $900$ บาท ผลต่าง $900$ หารด้วย $9$ ลงตัว ($100$) เป็นสัญญาณของการเขียนตัวเลขสลับหลัก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.double-entry.p014
    topics: [business.accounting.double-entry]
    difficulty: 4
    type: numeric
    stem: "ร้านกาแฟในอยุธยา (ร้านสมมติ) มียอดคงเหลือสิ้นเดือน เงินสด $25{,}600$ ลูกหนี้การค้า $4{,}400$ วัสดุสิ้นเปลือง $1{,}800$ อุปกรณ์ $40{,}000$ เจ้าหนี้การค้า $6{,}300$ ทุน $55{,}000$ รายได้จากการขาย $18{,}500$ เงินเดือน $6{,}000$ ค่าสาธารณูปโภค $1{,}200$ ถอนใช้ส่วนตัว $800$ (บาท) ยอดรวมด้านเดบิตของงบทดลองเป็นกี่บาท (ตอบเป็นบาท)"
    answer: { value: 79800, unit: บาท }
    hints:
      - "เลือกเฉพาะบัญชีที่มียอดปกติด้านเดบิต: สินทรัพย์ ค่าใช้จ่าย ถอนใช้ส่วนตัว"
      - "ตรวจคำตอบโดยรวมด้านเครดิต (เจ้าหนี้ ทุน รายได้) ต้องได้เท่ากัน"
    misconceptions:
      - { match: 71800, feedback: "รวมเฉพาะสินทรัพย์ ลืมค่าใช้จ่ายและถอนใช้ส่วนตัวซึ่งอยู่ด้านเดบิตด้วย" }
      - { match: 159600, feedback: "รวมทุกบัญชีทั้งสองด้าน งบทดลองแยกยอดเดบิตและเครดิตออกจากกัน" }
    solution: "เดบิต $= 25{,}600 + 4{,}400 + 1{,}800 + 40{,}000 + 6{,}000 + 1{,}200 + 800 = 79{,}800$ บาท ตรวจ: เครดิต $= 6{,}300 + 55{,}000 + 18{,}500 = 79{,}800$ บาท เท่ากัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.double-entry.p015
    topics: [business.accounting.double-entry]
    difficulty: 2
    type: order
    stem: "เรียงบรรทัดในช่องรายการของสมุดรายวันทั่วไป สำหรับรายการ \"จ่ายค่าเช่าร้านด้วยเงินสด\""
    items:
      - "ค่าเช่า (ชิดซ้าย ตัวเลขในช่องเดบิต)"
      - "เงินสด (เขียนย่อหน้า ตัวเลขในช่องเครดิต)"
      - "คำอธิบายรายการ: จ่ายค่าเช่าร้านประจำเดือน"
    hints:
      - "บัญชีเดบิตเขียนก่อนเสมอ"
      - "คำอธิบายรายการอยู่บรรทัดสุดท้ายของรายการ"
    solution: "บัญชีเดบิต (ค่าเช่า) → บัญชีเครดิตย่อหน้า (เงินสด) → คำอธิบายรายการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.double-entry.p016
    topics: [business.accounting.double-entry]
    difficulty: 5
    type: numeric
    stem: "ต้นเดือนกิจการมีเงินสด $15{,}000$ บาท ระหว่างเดือน (1) เจ้าของนำเงินสดมาลงทุนเพิ่ม $20{,}000$ บาท (2) ซื้อวัสดุสิ้นเปลืองด้วยเงินสด $2{,}400$ บาท (3) ให้บริการเป็นเงินเชื่อ $8{,}000$ บาท (4) ให้บริการรับเงินสด $11{,}500$ บาท (5) จ่ายเงินเดือน $6{,}000$ บาท (6) รับชำระจากลูกหนี้ $3{,}000$ บาท (7) ซื้ออุปกรณ์เป็นเงินเชื่อ $9{,}000$ บาท (8) ถอนเงินสดใช้ส่วนตัว $1{,}500$ บาท สิ้นเดือนบัญชีเงินสดมียอดคงเหลือกี่บาท (ตอบเป็นบาท)"
    answer: { value: 39600, unit: บาท }
    hints:
      - "เลือกเฉพาะรายการที่มีเงินสดเข้าหรือออกจริง รายการเงินเชื่อไม่กระทบเงินสด"
      - "เงินสดเข้า: (1) (4) (6) เงินสดออก: (2) (5) (8)"
    misconceptions:
      - { match: 38600, feedback: "นับรายการ (3) และ (7) ซึ่งเป็นเงินเชื่อ รายการเงินเชื่อไม่ทำให้เงินสดเปลี่ยน" }
      - { match: 36600, feedback: "ไม่ได้นับเงินที่รับชำระจากลูกหนี้ (6) ซึ่งเป็นเงินสดเข้าจริง" }
    solution: "$15{,}000 + 20{,}000 - 2{,}400 + 11{,}500 - 6{,}000 + 3{,}000 - 1{,}500 = 39{,}600$ บาท รายการ (3) และ (7) เป็นเงินเชื่อ ไม่กระทบเงินสด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.double-entry.p017
    topics: [business.accounting.double-entry]
    difficulty: 5
    type: mcq
    stem: "กิจการซื้อเครื่องพิมพ์ $30{,}000$ บาท จ่ายเงินสด $10{,}000$ บาท ส่วนที่เหลือค้างชำระผู้ขาย และในวันเดียวกันเจ้าของนำโน้ตบุ๊กส่วนตัวมูลค่า $12{,}000$ บาทมาใช้ในกิจการเป็นการลงทุนเพิ่ม การบันทึกข้อใดถูกต้องทั้งสองรายการ"
    choices:
      - { id: a, text: "(1) Dr. อุปกรณ์ $30{,}000$ / Cr. เงินสด $10{,}000$, Cr. เจ้าหนี้การค้า $20{,}000$ (2) Dr. อุปกรณ์ $12{,}000$ / Cr. ทุน $12{,}000$", correct: true }
      - { id: b, text: "(1) Dr. อุปกรณ์ $10{,}000$ / Cr. เงินสด $10{,}000$ (2) Dr. อุปกรณ์ $12{,}000$ / Cr. ทุน $12{,}000$", feedback: "บันทึกเครื่องพิมพ์แค่ส่วนที่จ่ายเงิน กิจการได้เครื่องพิมพ์ราคาเต็ม $30{,}000$ บาท และมีหนี้ $20{,}000$ บาท" }
      - { id: c, text: "(1) Dr. อุปกรณ์ $30{,}000$ / Cr. เงินสด $10{,}000$, Cr. เจ้าหนี้การค้า $20{,}000$ (2) Dr. อุปกรณ์ $12{,}000$ / Cr. รายได้ $12{,}000$", feedback: "สินทรัพย์ที่เจ้าของนำมาลงทุนเพิ่มทุน ไม่ใช่รายได้จากการดำเนินงาน" }
      - { id: d, text: "(1) Dr. อุปกรณ์ $30{,}000$ / Cr. เจ้าหนี้การค้า $30{,}000$ (2) ไม่ต้องบันทึก เพราะไม่มีเงินสดเปลี่ยนมือ", feedback: "จ่ายเงินสดไปแล้ว $10{,}000$ บาท และการลงทุนด้วยสินทรัพย์อื่นที่ไม่ใช่เงินสดก็ต้องบันทึก" }
    hints:
      - "รายการ (1) มีบัญชีเครดิตสองบัญชี (รายการรวม)"
      - "เจ้าของนำสินทรัพย์มาลงทุน ส่วนของเจ้าของเพิ่มโดยไม่ต้องมีเงินสด"
    solution: "(1) อุปกรณ์เพิ่ม $30{,}000$ (Dr.) เงินสดลด $10{,}000$ และเจ้าหนี้เพิ่ม $20{,}000$ (Cr.) (2) อุปกรณ์เพิ่ม $12{,}000$ (Dr.) ทุนเพิ่ม $12{,}000$ (Cr.)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.double-entry.p018
    topics: [business.accounting.double-entry]
    difficulty: 5
    type: numeric
    stem: "งบทดลองมียอดเดบิตรวม $152{,}400$ บาท และเครดิตรวม $147{,}900$ บาท ผู้ตรวจพบว่ามีข้อผิดพลาดเพียงจุดเดียว คือ รายการรับชำระหนี้จากลูกหนี้ ผ่านไปบัญชีลูกหนี้การค้าด้านเดบิตแทนที่จะเป็นด้านเครดิต (บัญชีเงินสดผ่านถูก) รายการรับชำระหนี้นี้มีจำนวนกี่บาท (ตอบเป็นบาท)"
    answer: { value: 2250, unit: บาท }
    hints:
      - "หาผลต่างของสองด้านก่อน"
      - "ผ่านผิดด้านทำให้ด้านหนึ่งเกินและอีกด้านขาดเท่ากับจำนวนนั้น ผลต่างจึงเป็นสองเท่าของจำนวนรายการ"
    misconceptions:
      - { match: 4500, feedback: "นั่นคือผลต่างของงบทดลอง ซึ่งเป็นสองเท่าของจำนวนรายการ ต้องหารด้วย 2" }
    solution: "ผลต่าง $= 152{,}400 - 147{,}900 = 4{,}500$ บาท การผ่านผิดด้านทำให้เดบิตเกิน $x$ และเครดิตขาด $x$ จึงได้ $2x = 4{,}500$ ดังนั้น $x = 2{,}250$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true
