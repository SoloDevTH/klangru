id: engineering.environmental.sanitation-public-health
subject: engineering
title: { th: ระบบสุขาภิบาลในอาคารและสาธารณสุขพื้นฐาน, en: Building sanitation and basic public health }
summary: ระบบน้ำดี น้ำเสีย และน้ำฝนในอาคาร รวมถึงบ่อเกรอะ บ่อซึม และที่ดักไขมัน กับหลักระบาดวิทยาพื้นฐานและการควบคุมพาหะนำโรคในชุมชน
difficulty: 6
minutes: 40
prerequisites: [physics.matter.pressure-fluids, health.disease.communicable]
encompasses:
  - { id: physics.matter.pressure-fluids, weight: 0.3 }
  - { id: health.disease.communicable, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - { type: check, problem: engineering.environmental.sanitation-public-health.p001, prompt: "ลองคิดก่อนอ่านต่อ: อะไรกำหนดความดันที่ก๊อกในระบบแรงโน้มถ่วง" }
  - type: figure
    title: ระบบน้ำดีแรงโน้มถ่วง
    src: water-supply.svg
    alt: "แผนภาพอาคารสองชั้นที่มีถังน้ำบนดาดฟ้า ผิวน้ำในถังสูงกว่าก๊อกที่ชั้นล่าง 12 เมตร มีลูกศรแสดงความสูง h และท่อจากถังใต้ดินพร้อมปั๊มสูบขึ้นไปยังถังบนดาดฟ้า"
    caption: "ความดันที่ก๊อกขึ้นกับความสูงของผิวน้ำเหนือก๊อก ไม่ใช่ขนาดของถัง"
  - type: worked-example
    title: ความดันที่ก๊อกเมื่อหักแรงเสียดทานในท่อ
    problem: "ถังน้ำอยู่สูงกว่าก๊อก 12 เมตร และแรงเสียดทานในท่อเทียบเท่าการสูญเสียความสูงน้ำ 2.5 เมตร ความดันที่ก๊อกเป็นเท่าไร (ใช้ $\\rho = 1000\\ \\mathrm{kg/m^3}$ และ $g = 9.81\\ \\mathrm{m/s^2}$)"
    steps:
      - text: "ความสูงสุทธิ $h = 12 - 2.5 = 9.5$ เมตร"
        why: "แรงเสียดทานทำให้พลังงานสูญเสีย เทียบได้กับความสูงของน้ำที่หายไปในท่อ"
      - text: "$p = \\rho g h = 1000 \\times 9.81 \\times 9.5 = 93{,}195\\ \\mathrm{Pa}$"
      - text: "หารด้วย 1000 ได้ $93.2\\ \\mathrm{kPa}$"
        why: "ปาสกาลเป็นหน่วยเล็ก การแปลงเป็นกิโลปาสกาลทำให้เทียบกับค่าความดันบรรยากาศได้ง่ายขึ้น"
    answer: "ความดันที่ก๊อกประมาณ 93.2 kPa ต่ำกว่า 117.7 kPa ที่ได้ถ้าไม่หักแรงเสียดทาน"
  - { type: check, problem: engineering.environmental.sanitation-public-health.p004, prompt: "นึกถึงสิ่งที่ไขมันทำเมื่อเย็นลงในท่อ" }
  - type: figure
    title: ภาพตัดบ่อเกรอะและบ่อซึม
    src: septic-system.svg
    alt: "ภาพตัดบ่อเกรอะรูปสี่เหลี่ยมมีผนังกั้นแนวตั้งสองแผ่น ชั้นบนสุดเป็นชั้นฝ้า ตรงกลางเป็นน้ำใสค่อนข้างนิ่ง ก้นบ่อเป็นชั้นตะกอน ท่อจากบ่อเกรอะไปยังบ่อซึมที่มีกรวดและดินระบายน้ำ"
    caption: "ตะกอนที่สะสมมากเกินไปจะไหลไปอุดบ่อซึม ทำให้ระบบทั้งหมดใช้งานไม่ได้"
  - type: worked-example
    title: อัตราป่วยและความเสี่ยงสัมพัทธ์จากการระบาดในชุมชน
    problem: "(ข้อมูลสมมติ) ผู้ที่ดื่มน้ำจากบ่อตื้น 50 คน ป่วย 20 คน และผู้ที่ไม่ได้ดื่ม 50 คน ป่วย 2 คน ความเสี่ยงสัมพัทธ์ของการป่วยในกลุ่มที่ดื่มน้ำบ่อเทียบกับกลุ่มที่ไม่ดื่มเป็นเท่าไร"
    steps:
      - text: "อัตราป่วยกลุ่มที่สัมผัส $= \\frac{20}{50} \\times 100 = 40\\%$"
      - text: "อัตราป่วยกลุ่มที่ไม่สัมผัส $= \\frac{2}{50} \\times 100 = 4\\%$"
      - text: "ความเสี่ยงสัมพัทธ์ $RR = \\frac{40}{4} = 10$"
        why: "RR มากกว่า 1 บ่งว่าการสัมผัสเกี่ยวข้องกับการป่วย แต่ยังไม่พิสูจน์สาเหตุ ต้องตรวจตัวอย่างน้ำและดูปัจจัยร่วมต่อ"
    answer: "กลุ่มที่ดื่มน้ำบ่อมีความเสี่ยงป่วยสูงกว่าประมาณ 10 เท่า ควรตรวจคุณภาพน้ำบ่อเป็นลำดับแรก"
  - { type: check, problem: engineering.environmental.sanitation-public-health.p010, prompt: "ดูที่แหล่งเพาะพันธุ์ก่อนพิจารณาวิธีอื่น" }
glossary:
  - { term: ระบบน้ำดีแรงโน้มถ่วง, definition: "ระบบที่ใช้ความสูงของถังน้ำเหนือก๊อกสร้างความดันโดยไม่ต้องใช้ปั๊มตลอดเวลา (gravity water supply)" }
  - { term: บ่อเกรอะ, definition: "ถังกักน้ำเสียให้ตะกอนนอนก้นและไขมันลอยขึ้น เพื่อให้น้ำใสไหลต่อไปได้ (septic tank)" }
  - { term: บ่อซึม, definition: "บ่อที่มีกรวดและดินระบายน้ำใสจากบ่อเกรอะให้ซึมลงดิน (soak pit)" }
  - { term: ที่ดักไขมัน, definition: "อุปกรณ์แยกไขมันและน้ำมันออกจากน้ำเสียจากครัวก่อนเข้าท่อหลัก (grease trap)" }
  - { term: ห่วงโซ่การติดต่อของโรค, definition: "ลำดับองค์ประกอบที่ทำให้เชื้อก่อโรคจากแหล่งรังโรคเข้าสู่ผู้รับเชื้อ ตัดห่วงใดก็หยุดการติดต่อได้ (chain of infection)" }
  - { term: อัตราป่วยโจมตี, definition: "สัดส่วนของกลุ่มที่สัมผัสที่ป่วยภายในช่วงการระบาด (attack rate)" }
  - { term: ความเสี่ยงสัมพัทธ์, definition: "อัตราส่วนระหว่างอัตราป่วยของกลุ่มที่สัมผัสกับกลุ่มที่ไม่สัมผัส (relative risk)" }
  - { term: อัตราป่วยตาย, definition: "สัดส่วนผู้เสียชีวิตต่อจำนวนผู้ป่วยทั้งหมดของโรคนั้น (case fatality rate)" }
flashcards:
  - { front: "ความดันที่ก๊อกในระบบแรงโน้มถ่วงคำนวณอย่างไร", back: "p = ρgh โดย h คือความสูงของผิวน้ำเหนือก๊อก หักการสูญเสียในท่อก่อน" }
  - { front: "ทำไมต้องติดที่ดักไขมันก่อนน้ำจากครัวรวมท่อ", back: "ไขมันแข็งตัวและเกาะผนังท่อจนอุดตัน" }
  - { front: "ห่วงโซ่การติดต่อของโรคมีองค์ประกอบใดบ้าง", back: "เชื้อ แหล่งรังโรค ทางออก วิธีการติดต่อ ทางเข้า และผู้รับเชื้อ" }
  - { front: "ความเสี่ยงสัมพัทธ์บอกอะไร", back: "อัตราป่วยกลุ่มสัมผัสหารด้วยอัตราป่วยกลุ่มไม่สัมผัส ค่ามากกว่า 1 บ่งว่าการสัมผัสเกี่ยวข้องกับการป่วย" }
  - { front: "วิธีควบคุมพาหะนำโรคที่ได้ผลระยะยาว", back: "กำจัดแหล่งเพาะพันธุ์ เช่น น้ำขังในภาชนะ และยางรถ" }
