<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="sans-serif" font-size="14">
<title>ภาพตัดระบบบ่อเกรอะและบ่อซึม</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15211e"/></marker></defs>
<rect x="0" y="0" width="720" height="460" fill="#ffffff"/>
<text x="360.0" y="32.0" text-anchor="middle" font-size="16" fill="#15211e" font-weight="bold">ภาพตัดระบบบ่อเกรอะ–บ่อซึม (แผนภาพจำลอง)</text>
<rect x="120.0" y="110.0" width="300.0" height="210.0" rx="0" fill="#f5f5f5" stroke="#15211e" stroke-width="2.5"/>
<rect x="122.0" y="112.0" width="296.0" height="40.0" rx="0" fill="#ffe0b2" stroke="none" stroke-width="0"/>
<text x="270.0" y="136.0" text-anchor="middle" font-size="12" fill="#15211e">ชั้นฝ้า (ไขมันและสิ่งลอยตัว)</text>
<rect x="122.0" y="152.0" width="296.0" height="110.0" rx="0" fill="#e3f2fd" stroke="none" stroke-width="0"/>
<text x="270.0" y="210.0" text-anchor="middle" font-size="12" fill="#15211e">น้ำใสค่อนข้างนิ่ง</text>
<rect x="122.0" y="262.0" width="296.0" height="56.0" rx="0" fill="#bcaaa4" stroke="none" stroke-width="0"/>
<text x="270.0" y="296.0" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">ชั้นตะกอนที่ต้องสูบออกเป็นรอบ</text>
<line x1="220.0" y1="152.0" x2="220.0" y2="260.0" stroke="#15211e" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="320.0" y1="152.0" x2="320.0" y2="260.0" stroke="#15211e" stroke-width="2" stroke-dasharray="6 4"/>
<text x="220.0" y="102.0" text-anchor="middle" font-size="12" fill="#555555">ผนังกั้น</text>
<line x1="50.0" y1="140.0" x2="130.0" y2="140.0" stroke="#15211e" stroke-width="6"/>
<text x="48.0" y="130.0" text-anchor="start" font-size="12" fill="#15211e">จากสุขภัณฑ์</text>
<line x1="130.0" y1="140.0" x2="130.0" y2="150.0" stroke="#15211e" stroke-width="6"/>
<line x1="420.0" y1="220.0" x2="530.0" y2="220.0" stroke="#15211e" stroke-width="6"/>
<text x="475.0" y="206.0" text-anchor="middle" font-size="12" fill="#15211e">ไปยังบ่อซึม</text>
<rect x="530.0" y="200.0" width="120.0" height="160.0" rx="0" fill="#eeeeee" stroke="#15211e" stroke-width="2"/>
<circle cx="550.0" cy="330.0" r="4.0" fill="#9e9e9e" stroke="#9e9e9e" stroke-width="1"/>
<circle cx="572.0" cy="338.0" r="4.0" fill="#9e9e9e" stroke="#9e9e9e" stroke-width="1"/>
<circle cx="594.0" cy="330.0" r="4.0" fill="#9e9e9e" stroke="#9e9e9e" stroke-width="1"/>
<circle cx="616.0" cy="338.0" r="4.0" fill="#9e9e9e" stroke="#9e9e9e" stroke-width="1"/>
<circle cx="638.0" cy="330.0" r="4.0" fill="#9e9e9e" stroke="#9e9e9e" stroke-width="1"/>
<text x="590.0" y="260.0" text-anchor="middle" font-size="13" fill="#15211e" font-weight="bold">บ่อซึม</text>
<text x="590.0" y="278.0" text-anchor="middle" font-size="12" fill="#15211e">กรวดและดินระบายน้ำ</text>
<text x="360.0" y="418.0" text-anchor="middle" font-size="12" fill="#555555">น้ำจากบ่อเกรอะมีตะกอนและไขมันน้อยลง แต่ยังมีเชื้อโรค ต้องไม่ให้ไหลลงแหล่งน้ำดื่มโดยตรง</text>
