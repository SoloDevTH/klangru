<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220"><title>ลำดับการประมวลผลเชิงตรรกะของคำสั่ง SELECT จาก FROM ไปถึง ORDER BY</title><rect width="720" height="220" fill="#ffffff"/><rect x="20" y="80" width="104" height="70" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.3"/><text x="72" y="108" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">FROM</text><text x="72" y="130" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">รวมตารางที่ใช้</text><line x1="124" y1="115" x2="138" y2="115" stroke="#1f2937" stroke-width="1.8"/><rect x="138" y="80" width="104" height="70" rx="8" fill="#dcfce7" stroke="#1f2937" stroke-width="1.3"/><text x="190" y="108" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">WHERE</text><text x="190" y="130" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">กรองแถว</text><line x1="242" y1="115" x2="256" y2="115" stroke="#1f2937" stroke-width="1.8"/><rect x="256" y="80" width="104" height="70" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.3"/><text x="308" y="108" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">GROUP BY</text><text x="308" y="130" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">จัดกลุ่มแถว</text><line x1="360" y1="115" x2="374" y2="115" stroke="#1f2937" stroke-width="1.8"/><rect x="374" y="80" width="104" height="70" rx="8" fill="#dcfce7" stroke="#1f2937" stroke-width="1.3"/><text x="426" y="108" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">HAVING</text><text x="426" y="130" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">กรองกลุ่ม</text><line x1="478" y1="115" x2="492" y2="115" stroke="#1f2937" stroke-width="1.8"/><rect x="492" y="80" width="104" height="70" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.3"/><text x="544" y="108" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">SELECT</text><text x="544" y="130" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">เลือกคอลัมน์ผล</text><line x1="596" y1="115" x2="610" y2="115" stroke="#1f2937" stroke-width="1.8"/><rect x="610" y="80" width="104" height="70" rx="8" fill="#dcfce7" stroke="#1f2937" stroke-width="1.3"/><text x="662" y="108" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">ORDER BY</text><text x="662" y="130" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">เรียงผลลัพธ์</text><text x="360" y="50" font-family="sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="normal">ลำดับที่เขียนในคำสั่งต่างจากลำดับที่ระบบประมวลผลจริง</text><text x="360" y="190" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">ตัวอย่าง: HAVING ใช้ได้เพราะรันหลัง GROUP BY แต่ WHERE ใช้กรองฟังก์ชันรวมไม่ได้</text></svg>
