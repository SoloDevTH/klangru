id: physics.fields.field-forces
subject: physics
title: { th: สนามแม่เหล็ก สนามไฟฟ้า และสนามโน้มถ่วง, en: "Magnetic, electric and gravitational fields" }
summary: แหล่งของสนามโน้มถ่วง สนามไฟฟ้า และสนามแม่เหล็ก ทิศของแรงในแต่ละสนาม การเขียนแผนภาพแรง และแรงที่ลดลงเมื่อวัตถุอยู่ห่างจากแหล่งของสนาม
difficulty: 3.5
minutes: 30
prerequisites: [physics.magnetism.magnets, physics.dynamics.forces]
encompasses:
  - { id: physics.magnetism.magnets, weight: 0.3 }
  - { id: physics.dynamics.forces, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: แหล่งและทิศของสนามสามชนิด
    src: field-sources.svg
    alt: "สามภาพ ก. วงกลมแทนโลก มีลูกศรแปดลูกจากรอบนอกชี้เข้าหาศูนย์กลางโลกทุกทิศ ข. ประจุบวกตรงกลาง มีลูกศรสิบสองลูกพุ่งออกจากประจุในทุกทิศ ใต้ภาพเขียนว่าถ้าเป็นประจุลบลูกศรจะพุ่งเข้า ค. แท่งแม่เหล็กขั้วเหนือทางซ้าย ขั้วใต้ทางขวา เส้นสนามโค้งออกจากขั้วเหนือไปเข้าขั้วใต้ทั้งด้านบนและด้านล่าง เส้นใกล้แท่งแม่เหล็กอยู่ชิดกัน เส้นที่ไกลออกไปห่างกัน"
    caption: "เส้นสนามอยู่ชิดกันบริเวณใกล้แหล่ง แปลว่าแรงมากที่นั่น"
  - type: figure
    title: แผนภาพแรงในสามสนาม
    src: force-diagrams.svg
    alt: "สามภาพ ก. มะม่วงกำลังหล่น มีลูกศร W ชี้ลงลูกเดียว ข. ลูกโป่งมีประจุลบแขวนด้วยด้ายจากเพดาน ด้ายเอียงเพราะลูกโป่งถูกดูดเข้าหาแท่งประจุบวกทางซ้าย มีสามลูกศร คือ W ชี้ลง F แรงไฟฟ้าชี้ไปทางซ้ายเข้าหาแท่ง และ T แรงตึงเชือกชี้ขึ้นไปตามแนวด้าย ค. คลิปเหล็กลอยอยู่ใต้แท่งแม่เหล็กโดยมีด้ายผูกคลิปไว้กับโต๊ะ มีลูกศร F แรงแม่เหล็กชี้ขึ้นยาว และลูกศร W กับ T ชี้ลงสั้นกว่า ใต้ภาพเขียนว่าแรงแม่เหล็กขึ้นเท่ากับ W บวก T"
    caption: "ความยาวลูกศรในแต่ละภาพเป็นสัดส่วนกับขนาดของแรง และวัตถุที่อยู่นิ่งมีแรงลัพธ์เป็นศูนย์"
  - type: worked-example
    title: เขียนแผนภาพแรงของลูกโป่งที่แขวนอยู่
    problem: "ลูกโป่งที่ถูกับผมจนมีประจุลบ แขวนด้วยด้ายจากเพดาน เมื่อนำแท่งพลาสติกที่มีประจุบวกมาใกล้ทางซ้าย ด้ายเอียงไปทางซ้ายแล้วลูกโป่งอยู่นิ่ง มีแรงอะไรกระทำต่อลูกโป่งบ้าง แต่ละแรงมีทิศใด"
    steps:
      - text: "สิ่งที่แตะลูกโป่งมีด้ายเส้นเดียว จึงมีแรงตึงเชือก $T$ ทิศตามแนวด้ายขึ้นไปหาเพดาน"
        why: "เชือกดึงได้อย่างเดียว ดันไม่ได้ แรงตึงจึงชี้ออกจากวัตถุไปตามเชือกเสมอ"
      - text: "ลูกโป่งอยู่ในสนามโน้มถ่วงของโลก มีน้ำหนัก $W$ ชี้ลงเข้าหาศูนย์กลางโลก"
      - text: "ลูกโป่งอยู่ในสนามไฟฟ้าของแท่งพลาสติก ประจุต่างชนิดกันดูดกัน แรงไฟฟ้า $F$ จึงชี้ไปทางซ้ายเข้าหาแท่ง"
      - text: "ลูกโป่งอยู่นิ่ง แรงทั้งสามต้องหักล้างกัน ลูกศร $T$ จึงเอียงไปทางขวาบนเพื่อสู้กับ $F$ ที่ดึงไปทางซ้าย และ $W$ ที่ดึงลง"
        why: "ถ้าแรงไม่หักล้างกัน ลูกโป่งจะเริ่มเคลื่อนที่"
    answer: "มีสามแรง คือ น้ำหนักชี้ลง แรงไฟฟ้าชี้เข้าหาแท่ง และแรงตึงเชือกชี้ขึ้นตามแนวด้าย"
  - { type: check, problem: physics.fields.field-forces.p006, prompt: "ประจุต่างชนิดกันดูดหรือผลักกัน" }
  - type: worked-example
    title: อ่านข้อมูลแรงไฟฟ้ากับระยะห่าง
    problem: "นักเรียนวัดแรงไฟฟ้าระหว่างลูกบอลโลหะเล็กสองลูกที่มีประจุ ได้ข้อมูลว่า ระยะ $10\\ \\mathrm{cm}$ แรง $0.36\\ \\mathrm{N}$ ระยะ $20\\ \\mathrm{cm}$ แรง $0.09\\ \\mathrm{N}$ ระยะ $30\\ \\mathrm{cm}$ แรง $0.04\\ \\mathrm{N}$ ข้อมูลนี้บอกอะไร"
    steps:
      - text: "ระยะเพิ่มขึ้น แรงลดลงทุกครั้ง แรงไฟฟ้าจึงอ่อนลงเมื่อห่างจากแหล่งของสนาม"
      - text: "ระยะเพิ่มจาก $10$ เป็น $20\\ \\mathrm{cm}$ (2 เท่า) แรงลดจาก $0.36$ เป็น $0.09\\ \\mathrm{N}$ คือเหลือ $\\tfrac{0.09}{0.36} = \\tfrac{1}{4}$"
        why: "เทียบเป็นอัตราส่วนจะเห็นแบบรูปชัดกว่าดูผลต่าง"
      - text: "ระยะเพิ่มเป็น 3 เท่า แรงเหลือ $\\tfrac{0.04}{0.36} = \\tfrac{1}{9}$ แบบรูปคือแรงลดลงตาม (จำนวนเท่าของระยะ)$^2$"
    answer: "แรงไฟฟ้าลดลงเมื่อระยะเพิ่ม และลดเร็วกว่าแบบครึ่งต่อครึ่ง ระยะ 2 เท่า แรงเหลือ 1/4 ระยะ 3 เท่า แรงเหลือ 1/9"
  - { type: check, problem: physics.fields.field-forces.p007, prompt: "แรงชนิดใดบ้างที่ขึ้นกับระยะห่าง" }
  - type: simulation
    title: "แรงโน้มถ่วงระหว่างมวลสองก้อน (PhET Gravity Force Lab)"
    url: https://phet.colorado.edu/en/simulations/gravity-force-lab
    provider: phet
    note: "เลื่อนมวลก้อนหนึ่งให้ห่างออกทีละขั้นแล้วจดแรง จากนั้นคงระยะไว้แล้วเพิ่มมวล สังเกตว่าแรงที่มวลทั้งสองออกต่อกันเท่ากันเสมอ และเป็นแรงดูดทุกครั้ง"
glossary:
  - { term: สนาม, definition: "บริเวณรอบแหล่งของสนามที่วัตถุอื่นที่เหมาะสมเข้าไปแล้วถูกแรงกระทำโดยไม่ต้องสัมผัส" }
  - { term: แรงไม่สัมผัส, definition: "แรงที่วัตถุออกต่อกันโดยไม่ต้องแตะกัน ได้แก่ แรงโน้มถ่วง แรงไฟฟ้า และแรงแม่เหล็ก" }
  - { term: สนามโน้มถ่วง, definition: "สนามรอบวัตถุที่มีมวล ดึงวัตถุที่มีมวลอื่นเข้าหาเสมอ" }
  - { term: สนามไฟฟ้า, definition: "สนามรอบวัตถุที่มีประจุ ทิศพุ่งออกจากประจุบวกและพุ่งเข้าประจุลบ" }
  - { term: สนามแม่เหล็ก, definition: "สนามรอบแม่เหล็กหรือลวดที่มีกระแสไฟฟ้า ทิศออกจากขั้วเหนือเข้าสู่ขั้วใต้" }
  - { term: แผนภาพแรง, definition: "ภาพวัตถุพร้อมลูกศรแทนแรงทุกแรงที่กระทำต่อวัตถุนั้น ความยาวลูกศรบอกขนาดของแรง" }
flashcards:
  - { front: "แหล่งของสนามโน้มถ่วง สนามไฟฟ้า และสนามแม่เหล็ก", back: "มวล ประจุไฟฟ้า และแม่เหล็กหรือกระแสไฟฟ้า ตามลำดับ" }
  - { front: "แรงโน้มถ่วงของโลกชี้ไปทางไหน", back: "เข้าหาศูนย์กลางโลก ไม่ว่าอยู่ที่ใดบนโลก" }
  - { front: "แรงชนิดใดดูดอย่างเดียว ไม่เคยผลัก", back: "แรงโน้มถ่วง" }
  - { front: "ระยะห่างเพิ่มขึ้น แรงจากสนามเป็นอย่างไร", back: "ลดลง แรงไฟฟ้าและแรงโน้มถ่วงลดเหลือ 1/4 เมื่อระยะเพิ่ม 2 เท่า" }
