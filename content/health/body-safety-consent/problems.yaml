problems:
  - id: health.sexuality.body-safety-consent.p001
    topics: [health.sexuality.body-safety-consent]
    difficulty: 1
    type: mcq
    stem: "ส่วนที่เป็นส่วนตัวของร่างกายคือส่วนใด"
    choices:
      - { id: a, text: "ส่วนที่ชุดชั้นในหรือชุดว่ายน้ำปิดไว้", correct: true }
      - { id: b, text: "มือและแขน", feedback: "มือและแขนไม่ได้ถูกชุดชั้นในปิด แต่ถ้าใครแตะแล้วเราไม่สบายใจ ก็บอกให้หยุดได้" }
      - { id: c, text: "หัวไหล่", feedback: "หัวไหล่ไม่ใช่ส่วนที่เป็นส่วนตัวตามกฎชุดชั้นใน" }
    hints:
      - "นึกถึงกฎชุดชั้นใน"
      - "ส่วนที่เราปิดไว้เมื่อใส่ชุดว่ายน้ำ"
    solution: "ส่วนที่เป็นส่วนตัวคือส่วนที่ชุดชั้นในหรือชุดว่ายน้ำปิด ได้แก่ อวัยวะเพศ ก้น และหน้าอก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sexuality.body-safety-consent.p002
    topics: [health.sexuality.body-safety-consent]
    difficulty: 1
    type: mcq
    stem: "ใครมีสิทธิ์ตัดสินใจว่าใครจะแตะตัวเราได้"
    choices:
      - { id: a, text: "ตัวเราเอง เพราะร่างกายของเราเป็นของเรา", correct: true }
      - { id: b, text: "ผู้ใหญ่ทุกคน", feedback: "แม้เป็นผู้ใหญ่ก็ต้องเคารพร่างกายของเด็ก ถ้าเราไม่สบายใจ เราบอกให้หยุดได้" }
      - { id: c, text: "เพื่อนที่สนิทที่สุด", feedback: "เพื่อนสนิทก็ต้องถามและเคารพคำตอบของเรา" }
    hints:
      - "ร่างกายของเราเป็นของใคร"
      - "คนอื่นก็มีสิทธิ์แบบเดียวกันกับร่างกายของเขา"
    solution: "ร่างกายของเราเป็นของเรา เราจึงมีสิทธิ์ตัดสินใจว่าใครแตะตัวเราได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sexuality.body-safety-consent.p003
    topics: [health.sexuality.body-safety-consent]
    difficulty: 2
    type: match
    stem: "จับคู่สถานการณ์กับประเภทของสัมผัส"
    pairs:
      - { left: "แม่กอดก่อนนอน", right: "สัมผัสที่ปลอดภัย" }
      - { left: "มีคนผลักเราแรง ๆ จนล้ม", right: "สัมผัสที่ไม่ปลอดภัย" }
      - { left: "ญาติจั๊กจี้ต่อทั้งที่เราบอกให้หยุดแล้ว", right: "สัมผัสที่ทำให้สับสน" }
    hints:
      - "สัมผัสที่ปลอดภัยทำให้รู้สึกดีและได้รับการดูแล"
      - "สัมผัสที่ทำให้สับสนอาจเริ่มจากการเล่น แต่เราไม่สบายใจและอีกฝ่ายไม่หยุด"
    solution: "กอดก่อนนอน-ปลอดภัย, ผลักจนล้ม-ไม่ปลอดภัย, จั๊กจี้ต่อเมื่อบอกให้หยุด-ทำให้สับสน ซึ่งควรบอกผู้ใหญ่ที่ไว้ใจ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sexuality.body-safety-consent.p004
    topics: [health.sexuality.body-safety-consent]
    difficulty: 2
    type: mcq
    stem: "ความลับข้อใดที่ต้องบอกผู้ใหญ่ที่ไว้ใจ"
    choices:
      - { id: a, text: "มีคนแตะตัวเราแล้วเรารู้สึกไม่สบายใจ และเขาให้ขนมพร้อมบอกว่าห้ามบอกใคร", correct: true }
      - { id: b, text: "ของขวัญเซอร์ไพรส์วันเกิดแม่", feedback: "เป็นเรื่องเซอร์ไพรส์ที่สุดท้ายทุกคนจะรู้และมีความสุข เก็บไว้ได้" }
      - { id: c, text: "เพื่อนแอบชอบเพลงลูกทุ่ง", feedback: "เป็นเรื่องส่วนตัวที่ไม่ทำให้ใครไม่ปลอดภัย" }
    hints:
      - "ความลับที่ไม่ดีทำให้เรากลัวหรือไม่สบายใจ"
      - "คำว่า ห้ามบอกใคร ร่วมกับของรางวัล เป็นสัญญาณเตือน"
    solution: "ความลับที่ทำให้ไม่สบายใจหรือมีการให้ของแลกกับการเงียบ ต้องบอกผู้ใหญ่ที่ไว้ใจเสมอ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sexuality.body-safety-consent.p005
    topics: [health.sexuality.body-safety-consent]
    difficulty: 2
    type: order
    stem: "เมื่อมีใครทำให้เรารู้สึกไม่ปลอดภัย เรียงขั้นตอนการป้องกันตัวเอง"
    items:
      - "พูดว่า \"ไม่\" หรือ \"หยุด\" เสียงดังชัดเจน"
      - "ออกไปยังที่ที่มีคนอื่นอยู่"
      - "บอกผู้ใหญ่ที่ไว้ใจทันที"
      - "ถ้าผู้ใหญ่คนแรกไม่ช่วย บอกคนต่อไป"
    hints:
      - "จำสามคำ: ปฏิเสธ ออกไป บอก"
      - "การบอกต้องทำจนกว่าจะมีคนช่วย"
    solution: "ปฏิเสธ → ออกไป → บอกผู้ใหญ่ที่ไว้ใจ → ถ้าไม่มีใครช่วย บอกคนต่อไปหรือโทร 1300 หรือ 1387"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sexuality.body-safety-consent.p006
    topics: [health.sexuality.body-safety-consent]
    difficulty: 2
    type: text
    stem: "สายด่วนศูนย์ช่วยเหลือสังคม กระทรวงการพัฒนาสังคมและความมั่นคงของมนุษย์ ซึ่งให้บริการตลอด 24 ชั่วโมง คือหมายเลขใด"
    accepted: ["1300"]
    misconceptions:
      - { match: "1669", feedback: "1669 คือเบอร์เรียกรถพยาบาลเมื่อเจ็บป่วยฉุกเฉิน" }
      - { match: "1323", feedback: "1323 คือสายด่วนสุขภาพจิต" }
    hints:
      - "เป็นตัวเลขสี่หลัก ขึ้นต้นด้วย 13"
      - "ลงท้ายด้วย 00"
    solution: "1300 ศูนย์ช่วยเหลือสังคม ตลอด 24 ชั่วโมง เด็กโทรหามูลนิธิสายเด็ก 1387 ได้ด้วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sexuality.body-safety-consent.p007
    topics: [health.sexuality.body-safety-consent]
    difficulty: 3
    type: mcq
    stem: "ในงานบุญที่บ้าน ป้าที่ไม่ค่อยได้เจอขอหอมแก้มน้ำฝน แต่น้ำฝนไม่อยาก น้ำฝนควรทำอย่างไร"
    choices:
      - { id: a, text: "ยกมือไหว้หรือโบกมือทักทายป้าแทน แล้วพูดอย่างสุภาพว่าไม่อยากให้หอมแก้ม", correct: true }
      - { id: b, text: "ยอมให้หอมทั้งที่ไม่อยาก เพราะปฏิเสธผู้ใหญ่ไม่ได้", feedback: "เราปฏิเสธการแตะตัวได้แม้กับญาติ โดยยังแสดงความเคารพด้วยวิธีอื่น" }
      - { id: c, text: "ตะโกนใส่ป้าว่าน่ารำคาญ", feedback: "เราปฏิเสธได้ แต่ควรพูดอย่างสุภาพ เพราะป้าอาจไม่รู้ว่าเราไม่ชอบ" }
    hints:
      - "เรามีสิทธิ์ตอบว่าไม่ แม้กับญาติ"
      - "การไหว้เป็นการทักทายแบบไทยที่ให้เกียรติโดยไม่ต้องแตะตัว"
    solution: "น้ำฝนปฏิเสธได้อย่างสุภาพ และทักทายด้วยการไหว้หรือโบกมือแทน ซึ่งยังให้เกียรติป้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sexuality.body-safety-consent.p008
    topics: [health.sexuality.body-safety-consent]
    difficulty: 3
    type: mcq
    stem: "บอสกับเพื่อนตกลงเล่นปล้ำกันบนเบาะ สักพักเพื่อนพูดว่า \"หยุดก่อน เจ็บแล้ว\" บอสควรทำอย่างไร"
    choices:
      - { id: a, text: "หยุดทันทีและถามว่าเพื่อนเป็นอะไรไหม", correct: true }
      - { id: b, text: "เล่นต่อ เพราะเพื่อนตกลงตั้งแต่แรกแล้ว", feedback: "ความยินยอมเปลี่ยนได้ทุกเมื่อ เมื่อเพื่อนบอกให้หยุดต้องหยุด" }
      - { id: c, text: "เล่นต่ออีกนิดแล้วค่อยหยุด", feedback: "เมื่อมีคนบอกให้หยุดต้องหยุดทันที ไม่ใช่ต่ออีกนิด" }
    hints:
      - "ความยินยอมเปลี่ยนใจได้"
      - "เคารพคำว่า หยุด ของคนอื่น"
    solution: "แม้ตกลงกันตอนแรก แต่เมื่อเพื่อนบอกให้หยุด บอสต้องหยุดทันที เพราะความยินยอมเปลี่ยนได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sexuality.body-safety-consent.p009
    topics: [health.sexuality.body-safety-consent]
    difficulty: 3
    type: mcq
    stem: "มีคนที่รู้จักกันในเกมออนไลน์ขอรูปถ่ายของปลาในชุดว่ายน้ำ และบอกว่าห้ามบอกพ่อแม่ ปลาควรทำอย่างไร"
    choices:
      - { id: a, text: "ไม่ส่งรูป หยุดคุย และบอกพ่อแม่หรือผู้ใหญ่ที่ไว้ใจทันที", correct: true }
      - { id: b, text: "ส่งรูปไปรูปเดียวเพราะเขาเป็นเพื่อนในเกม", feedback: "รูปที่ส่งออกไปแล้วเอาคืนไม่ได้ และคนที่ขอรูปพร้อมบอกให้ปิดบังพ่อแม่เป็นสัญญาณอันตราย" }
      - { id: c, text: "เก็บเป็นความลับตามที่เขาขอ", feedback: "คำขอให้ปิดบังพ่อแม่เป็นความลับที่ไม่ดี ต้องบอกผู้ใหญ่" }
    hints:
      - "คนที่ขอรูปร่างกายและขอให้เก็บเป็นความลับมีเจตนาไม่ดี"
      - "จำ ปฏิเสธ ออกไป บอก ใช้กับโลกออนไลน์ด้วย"
    solution: "ไม่ส่งรูป หยุดคุย และบอกผู้ใหญ่ที่ไว้ใจ ผู้ใหญ่ช่วยเก็บหลักฐานและแจ้งเจ้าหน้าที่ได้ ปลาไม่ได้ทำอะไรผิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sexuality.body-safety-consent.p010
    topics: [health.sexuality.body-safety-consent]
    difficulty: 3
    type: match
    stem: "จับคู่สถานการณ์กับวิธีลดโอกาสเสี่ยง"
    pairs:
      - { left: "จะไปเล่นบ้านเพื่อนหลังเลิกเรียน", right: "บอกผู้ปกครองว่าไปไหน กับใคร กลับกี่โมง" }
      - { left: "คนที่รู้จักชวนขึ้นรถไปส่งบ้าน แต่ผู้ปกครองไม่ได้บอกไว้", right: "ปฏิเสธแล้วรอผู้ปกครองกับครู" }
      - { left: "ต้องเดินผ่านซอยเปลี่ยวตอนเย็น", right: "เดินกับเพื่อนเป็นกลุ่มหรือใช้ทางที่มีคน" }
      - { left: "มีคนให้เงินแลกกับการเก็บความลับ", right: "ไม่รับและบอกผู้ใหญ่ที่ไว้ใจ" }
    hints:
      - "ผู้ปกครองต้องรู้ว่าเราอยู่ที่ไหน"
      - "ของรางวัลที่แลกกับความลับเป็นสัญญาณเตือน"
    solution: "ไปบ้านเพื่อน-บอกผู้ปกครอง, ชวนขึ้นรถ-ปฏิเสธและรอผู้ปกครอง, ซอยเปลี่ยว-ไปเป็นกลุ่ม, ให้เงินแลกความลับ-ไม่รับและบอกผู้ใหญ่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sexuality.body-safety-consent.p011
    topics: [health.sexuality.body-safety-consent]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "การพูดปฏิเสธแบบใดทำให้อีกฝ่ายรู้ว่าเราจริงจัง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "พูดเสียงดังและชัดเจน", correct: true }
      - { id: b, text: "มองหน้าและยืนตัวตรง", correct: true }
      - { id: c, text: "พูดสั้น ๆ ว่า \"ไม่\" หรือ \"หยุด\" โดยไม่ต้องขอโทษ", correct: true }
      - { id: d, text: "กระซิบเบา ๆ แล้วก้มหน้า", feedback: "เสียงเบาและท่าทางลังเลทำให้อีกฝ่ายคิดว่าเราไม่จริงจัง" }
      - { id: e, text: "หัวเราะไปพร้อมกับพูดว่าไม่", feedback: "การหัวเราะทำให้คำปฏิเสธดูเหมือนเป็นการเล่น" }
    hints:
      - "ทั้งคำพูด น้ำเสียง และท่าทางต้องไปทางเดียวกัน"
      - "ข้อที่ถูกมีสามข้อ"
    solution: "พูดเสียงดังชัด มองหน้า ยืนตรง และพูดสั้น ๆ โดยไม่ต้องขอโทษ แล้วออกไปบอกผู้ใหญ่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sexuality.body-safety-consent.p012
    topics: [health.sexuality.body-safety-consent]
    difficulty: 4
    type: mcq
    stem: "ข้อใดเป็นข้อยกเว้นที่เหมาะสมของกฎชุดชั้นใน"
    choices:
      - { id: a, text: "แพทย์ตรวจร่างกายที่โรงพยาบาล โดยมีแม่อยู่ด้วยและแพทย์บอกเหตุผลก่อน", correct: true }
      - { id: b, text: "คนแปลกหน้าบอกว่าเป็นหมอ ขอตรวจร่างกายในห้องที่ปิดไว้ตามลำพัง", feedback: "การตรวจที่ถูกต้องเกิดในสถานพยาบาล มีผู้ปกครองอยู่ด้วย และไม่ใช่ในที่ลับตามลำพัง" }
      - { id: c, text: "คนรู้จักบอกว่าเป็นเกมที่ต้องเก็บเป็นความลับ", feedback: "ไม่มีเกมใดที่ต้องแตะหรือดูส่วนที่เป็นส่วนตัวและต้องเก็บเป็นความลับ ต้องบอกผู้ใหญ่ที่ไว้ใจ" }
    hints:
      - "ข้อยกเว้นต้องมีเหตุผลด้านสุขภาพและมีผู้ปกครองรู้เห็น"
      - "คำว่า ความลับ และ ตามลำพัง เป็นสัญญาณเตือน"
    solution: "ข้อยกเว้นคือการดูแลสุขภาพ เช่น แพทย์ตรวจโดยมีผู้ปกครองอยู่ด้วยและอธิบายเหตุผล ไม่ใช่ในที่ลับหรือเป็นความลับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.sexuality.body-safety-consent.p013
    topics: [health.sexuality.body-safety-consent]
    difficulty: 4
    type: mcq
    stem: "เพื่อนสนิทกระซิบเล่าว่า มีคนแตะส่วนที่เป็นส่วนตัวของเพื่อน และขู่ว่าห้ามบอกใคร เพื่อนร้องไห้และกลัวมาก เราควรทำอย่างไร"
    choices:
      - { id: a, text: "ฟังและเชื่อเพื่อน บอกว่าไม่ใช่ความผิดของเขา แล้วชวนกันไปบอกครูหรือผู้ใหญ่ที่ไว้ใจ", correct: true }
