problems:
  - id: bus.acc.p001
    topics: [business.accounting.equation]
    difficulty: 1
    type: numeric
    stem: "ร้านซ่อมจักรยานมีสินทรัพย์รวม $80{,}000$ บาท และหนี้สินรวม $30{,}000$ บาท ตามแผนภาพ ส่วนของเจ้าของเท่ากับกี่บาท (ตอบเป็นบาท)"
    figure: { src: missing-equity.svg, alt: "แผนภาพแท่งสองแท่งสูงเท่ากัน แท่งซ้ายคือสินทรัพย์รวม 80,000 บาท แท่งขวาแบ่งเป็นหนี้สิน 30,000 บาทอยู่ด้านล่าง และส่วนของเจ้าของที่ไม่บอกค่า (เครื่องหมายคำถาม) อยู่ด้านบน มีเครื่องหมายเท่ากับระหว่างสองแท่ง" }
    answer: { value: 50000, unit: บาท }
    hints:
      - "สินทรัพย์ $=$ หนี้สิน $+$ ส่วนของเจ้าของ"
      - "ย้ายหนี้สินไปอีกข้าง: ส่วนของเจ้าของ $=$ สินทรัพย์ $-$ หนี้สิน"
    misconceptions:
      - { match: 110000, feedback: "นำสินทรัพย์บวกหนี้สิน แต่หนี้สินเป็นส่วนที่ต้องคืนคนอื่น ต้องหักออก" }
    solution: "ส่วนของเจ้าของ $= 80{,}000 - 30{,}000 = 50{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.acc.p002
    topics: [business.accounting.equation]
    difficulty: 1
    type: match
    stem: "จับคู่รายการของร้านกาแฟกับหมวดทางบัญชี"
    pairs:
      - { left: "เงินสดในลิ้นชักเก็บเงิน", right: "สินทรัพย์" }
      - { left: "เงินกู้จากธนาคาร", right: "หนี้สิน" }
      - { left: "เงินที่เจ้าของนำมาลงทุนเปิดร้าน", right: "ส่วนของเจ้าของ" }
      - { left: "ค่าเช่าร้านที่จ่ายเดือนนี้", right: "ค่าใช้จ่าย" }
    hints:
      - "สินทรัพย์คือสิ่งที่ร้านมี หนี้สินคือสิ่งที่ร้านต้องคืนคนอื่น"
      - "เงินที่ใช้ไปแล้วเพื่อดำเนินงานในงวดนี้และไม่ได้อะไรกลับมาเป็นทรัพย์สิน คือค่าใช้จ่าย"
    solution: "เงินสด → สินทรัพย์ · เงินกู้ → หนี้สิน · เงินลงทุนของเจ้าของ → ส่วนของเจ้าของ · ค่าเช่าเดือนนี้ → ค่าใช้จ่าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.acc.p003
    topics: [business.accounting.equation]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็น **หนี้สิน** ของร้านขายของชำ"
    choices:
      - { id: a, text: "ค่าสินค้าที่ซื้อเชื่อจากร้านค้าส่งและยังไม่ได้จ่าย", correct: true }
      - { id: b, text: "เงินที่ลูกค้าประจำค้างจ่ายร้าน", feedback: "เงินที่คนอื่นค้างจ่ายเราคือลูกหนี้ เป็นสินทรัพย์ของร้าน เพราะร้านจะได้รับเงินในอนาคต" }
      - { id: c, text: "ตู้แช่เย็นที่ซื้อมาแล้วจ่ายเงินครบ", feedback: "ตู้แช่เป็นของที่ร้านเป็นเจ้าของและใช้ประโยชน์ได้ จึงเป็นสินทรัพย์" }
      - { id: d, text: "กำไรของเดือนที่แล้ว", feedback: "กำไรทำให้ส่วนของเจ้าของเพิ่ม ไม่ใช่ภาระที่ต้องคืนคนอื่น" }
    hints:
      - "หนี้สินคือสิ่งที่ร้านต้องชดใช้ให้คนอื่นในอนาคต"
      - "ระวังสับสน เงินที่ \"คนอื่นค้างเรา\" กับ \"เราค้างคนอื่น\""
    solution: "ค่าสินค้าที่ซื้อเชื่อแล้วยังไม่จ่ายคือเจ้าหนี้การค้า เป็นหนี้สิน ส่วนลูกหนี้และตู้แช่เป็นสินทรัพย์ และกำไรเพิ่มส่วนของเจ้าของ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.acc.p004
    topics: [business.accounting.equation]
    difficulty: 2
    type: numeric
    stem: "ร้านก๋วยเตี๋ยวเดือนนี้มีรายได้จากการขาย $48{,}000$ บาท ค่าวัตถุดิบ $18{,}000$ บาท ค่าเช่าร้าน $8{,}000$ บาท ค่าน้ำค่าไฟ $2{,}500$ บาท กำไรสุทธิของเดือนเท่ากับกี่บาท (ตอบเป็นบาท)"
    answer: { value: 19500, unit: บาท }
    hints:
      - "กำไรสุทธิ $=$ รายได้ $-$ ค่าใช้จ่ายทั้งหมด"
      - "รวมค่าใช้จ่ายทุกรายการก่อน แล้วนำไปลบจากรายได้"
    misconceptions:
      - { match: 30000, feedback: "หักแค่ค่าวัตถุดิบ ค่าเช่าและค่าน้ำค่าไฟก็เป็นค่าใช้จ่ายต้องหักด้วย" }
    solution: "ค่าใช้จ่ายรวม $= 18{,}000 + 8{,}000 + 2{,}500 = 28{,}500$ บาท กำไรสุทธิ $= 48{,}000 - 28{,}500 = 19{,}500$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.acc.p005
    topics: [business.accounting.equation]
    difficulty: 2
    type: numeric
    stem: "กิจการหนึ่งมีส่วนของเจ้าของ $65{,}000$ บาท และหนี้สิน $25{,}000$ บาท สินทรัพย์รวมเท่ากับกี่บาท (ตอบเป็นบาท)"
    answer: { value: 90000, unit: บาท }
    hints:
      - "สินทรัพย์มาจากสองแหล่ง คือ ยืมคนอื่น กับ เงินของเจ้าของ"
      - "แทนค่าในสมการบัญชีโดยตรง"
    misconceptions:
      - { match: 40000, feedback: "นำส่วนของเจ้าของลบหนี้สิน แต่สมการคือ สินทรัพย์ $=$ หนี้สิน $+$ ส่วนของเจ้าของ ต้องบวก" }
    solution: "สินทรัพย์ $= 25{,}000 + 65{,}000 = 90{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.acc.p006
    topics: [business.accounting.equation]
    difficulty: 2
    type: mcq
    stem: "ร้านกาแฟซื้อเครื่องบดกาแฟ $12{,}000$ บาท จ่ายเป็นเงินสดทันที รายการนี้มีผลต่อสมการบัญชีอย่างไร"
    choices:
      - { id: a, text: "อุปกรณ์เพิ่ม $12{,}000$ เงินสดลด $12{,}000$ สินทรัพย์รวมเท่าเดิม", correct: true }
      - { id: b, text: "สินทรัพย์ลด $12{,}000$ และส่วนของเจ้าของลด $12{,}000$", feedback: "นั่นคือการบันทึกเป็นค่าใช้จ่าย แต่เครื่องบดยังอยู่และใช้งานได้อีกนาน จึงเป็นสินทรัพย์" }
      - { id: c, text: "สินทรัพย์เพิ่ม $12{,}000$ และหนี้สินเพิ่ม $12{,}000$", feedback: "หนี้สินเพิ่มเมื่อซื้อเชื่อ รายการนี้จ่ายเงินสดครบแล้ว" }
      - { id: d, text: "ไม่มีผลต่อสมการบัญชีเลย", feedback: "ยอดรวมไม่เปลี่ยนก็จริง แต่สินทรัพย์สองรายการเปลี่ยน คือเงินสดลดและอุปกรณ์เพิ่ม ต้องบันทึกทั้งสองรายการ" }
    hints:
      - "หลังซื้อ ร้านมีเงินสดน้อยลง แต่มีอะไรเพิ่มขึ้น"
      - "สิ่งที่ได้มาเป็นสินทรัพย์ที่ใช้ได้หลายปี ไม่ได้หายไป"
    solution: "เงินสดเปลี่ยนรูปเป็นอุปกรณ์ สินทรัพย์ชนิดหนึ่งเพิ่ม อีกชนิดลดเท่ากัน หนี้สินและส่วนของเจ้าของไม่เปลี่ยน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.acc.p007
    topics: [business.accounting.equation]
    difficulty: 2
    type: mcq
    stem: "ร้านอาหารกู้เงินธนาคาร $20{,}000$ บาทเพื่อซ่อมร้าน (ยังไม่ได้ใช้เงิน) รายการนี้มีผลอย่างไร"
    choices:
      - { id: a, text: "สินทรัพย์เพิ่ม $20{,}000$ หนี้สินเพิ่ม $20{,}000$", correct: true }
      - { id: b, text: "สินทรัพย์เพิ่ม $20{,}000$ ส่วนของเจ้าของเพิ่ม $20{,}000$ เพราะเป็นรายได้", feedback: "เงินกู้ต้องคืนธนาคาร จึงเป็นหนี้สิน ไม่ใช่รายได้ และไม่ทำให้ร้านรวยขึ้น" }
      - { id: c, text: "หนี้สินเพิ่ม $20{,}000$ ส่วนของเจ้าของลด $20{,}000$", feedback: "ร้านได้เงินสดเข้ามา สินทรัพย์จึงเพิ่ม ส่วนของเจ้าของไม่เปลี่ยน" }
      - { id: d, text: "สินทรัพย์เพิ่ม $20{,}000$ อย่างเดียว", feedback: "ถ้าเปลี่ยนแค่ฝั่งเดียวสมการจะไม่สมดุล อีกฝั่งที่เปลี่ยนคือหนี้สิน" }
    hints:
      - "ร้านได้อะไรมา และมีภาระอะไรเพิ่มขึ้น"
      - "ทุกรายการค้าต้องทำให้สองฝั่งของสมการยังเท่ากัน"
    solution: "เงินสด (สินทรัพย์) เพิ่ม $20{,}000$ บาท และร้านมีภาระต้องคืนธนาคาร หนี้สินเพิ่ม $20{,}000$ บาท สมการยังสมดุล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.acc.p008
    topics: [business.accounting.equation]
    difficulty: 2
    type: numeric
    stem: "ร้านขายขนมเดือนแรกมีรายได้ $12{,}000$ บาท แต่มีค่าใช้จ่ายรวม $15{,}500$ บาท กำไรสุทธิเท่ากับกี่บาท (ถ้าขาดทุนให้ตอบเป็นจำนวนติดลบ)"
    answer: { value: -3500, unit: บาท }
    hints:
      - "กำไรสุทธิ $=$ รายได้ $-$ ค่าใช้จ่าย"
      - "ค่าใช้จ่ายมากกว่ารายได้ ผลลบจึงติดลบ"
    misconceptions:
      - { match: 3500, feedback: "ค่าใช้จ่ายมากกว่ารายได้ ร้านขาดทุน คำตอบต้องติดลบ" }
      - { match: 27500, feedback: "นำรายได้บวกค่าใช้จ่าย ต้องนำค่าใช้จ่ายไปลบออกจากรายได้" }
    solution: "$12{,}000 - 15{,}500 = -3{,}500$ บาท คือขาดทุนสุทธิ $3{,}500$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.acc.p009
    topics: [business.accounting.equation]
    difficulty: 3
    type: numeric
    stem: "ต้นเดือนร้านมีสินทรัพย์ $50{,}000$ บาท หนี้สิน $10{,}000$ บาท ระหว่างเดือน (1) ซื้อวัตถุดิบเป็นเงินเชื่อ $4{,}000$ บาท (2) จ่ายชำระหนี้เจ้าหนี้ด้วยเงินสด $3{,}000$ บาท สิ้นเดือนสินทรัพย์รวมเท่ากับกี่บาท (ตอบเป็นบาท)"
    answer: { value: 51000, unit: บาท }
    hints:
      - "ซื้อเชื่อ: ได้ของเพิ่มแต่ยังไม่จ่ายเงิน สินทรัพย์และหนี้สินเพิ่ม"
      - "จ่ายชำระหนี้: เงินสดลดและหนี้สินลด แล้วรวมผลต่อสินทรัพย์ทั้งสองรายการ"
    misconceptions:
      - { match: 47000, feedback: "ดูเหมือนคิดว่าการซื้อเชื่อทำให้เงินสดลด แต่ซื้อเชื่อยังไม่ได้จ่ายเงิน สินทรัพย์จึงเพิ่ม $4{,}000$" }
      - { match: 54000, feedback: "ลืมว่าการจ่ายชำระหนี้ $3{,}000$ บาททำให้เงินสดลดด้วย" }
    solution: "(1) สินทรัพย์ $+4{,}000$ หนี้สิน $+4{,}000$ (2) สินทรัพย์ $-3{,}000$ หนี้สิน $-3{,}000$ สินทรัพย์สิ้นเดือน $= 50{,}000 + 4{,}000 - 3{,}000 = 51{,}000$ บาท (หนี้สิน $11{,}000$ ส่วนของเจ้าของ $40{,}000$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.acc.p010
    topics: [business.accounting.equation]
    difficulty: 3
    type: numeric
    stem: "ต้นปีส่วนของเจ้าของร้านดอกไม้มี $40{,}000$ บาท ระหว่างปีเจ้าของนำเงินมาลงทุนเพิ่ม $10{,}000$ บาท ร้านมีกำไรสุทธิ $12{,}000$ บาท และเจ้าของถอนไปใช้ส่วนตัว $5{,}000$ บาท ส่วนของเจ้าของปลายปีเท่ากับกี่บาท (ตอบเป็นบาท)"
    answer: { value: 57000, unit: บาท }
    hints:
      - "อะไรทำให้ส่วนของเจ้าของเพิ่ม อะไรทำให้ลด"
      - "ต้นงวด $+$ ลงทุนเพิ่ม $+$ กำไรสุทธิ $-$ ถอนใช้ส่วนตัว"
    misconceptions:
      - { match: 67000, feedback: "นำเงินที่ถอนไปใช้ส่วนตัวมาบวก การถอนทำให้ส่วนของเจ้าของในกิจการลดลง" }
      - { match: 47000, feedback: "ลืมเงินลงทุนเพิ่ม $10{,}000$ บาท ซึ่งเพิ่มส่วนของเจ้าของ" }
    solution: "$40{,}000 + 10{,}000 + 12{,}000 - 5{,}000 = 57{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.acc.p011
    topics: [business.accounting.equation]
    difficulty: 3
    type: expression
    stem: "ให้ $A$ เป็นสินทรัพย์ และ $L$ เป็นหนี้สิน เขียนสูตรส่วนของเจ้าของ $E$"
    prefix: "E ="
    answer: { latex: "A - L", variables: [A, L] }
    hints:
      - "เริ่มจาก $A = L + E$"
      - "ลบ $L$ ทั้งสองข้างของสมการ"
    misconceptions:
      - { match: "A + L", feedback: "หนี้สินเป็นสิทธิของเจ้าหนี้ ต้องหักออกจากสินทรัพย์ ไม่ใช่บวก" }
      - { match: "L - A", feedback: "ลบสลับข้าง ถ้าสินทรัพย์มากกว่าหนี้สิน ส่วนของเจ้าของต้องเป็นบวก" }
    solution: "$A = L + E \\Rightarrow E = A - L$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.acc.p012
    topics: [business.accounting.equation]
    difficulty: 3
    type: mcq
    stem: "เจ้าของร้านขายของออนไลน์โอนเงิน $2{,}000$ บาทจากบัญชีร้านไปจ่ายค่าเทอมลูก ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "เป็นการถอนใช้ส่วนตัว สินทรัพย์ลดและส่วนของเจ้าของลด แต่ไม่ใช่ค่าใช้จ่ายในงบกำไรขาดทุน", correct: true }
      - { id: b, text: "เป็นค่าใช้จ่ายของร้าน ต้องนำไปหักในงบกำไรขาดทุน", feedback: "ค่าเทอมลูกไม่ได้ใช้เพื่อหารายได้ให้ร้าน จึงไม่ใช่ค่าใช้จ่ายของกิจการ ถ้านับจะทำให้กำไรต่ำเกินจริง" }
      - { id: c, text: "สินทรัพย์ลดและหนี้สินลด", feedback: "ร้านไม่ได้ชำระหนี้ให้ใคร เงินออกไปให้เจ้าของ จึงลดส่วนของเจ้าของ" }
      - { id: d, text: "ไม่ต้องบันทึก เพราะเป็นเงินของเจ้าของอยู่แล้ว", feedback: "กิจการแยกจากเจ้าของในทางบัญชี เงินในบัญชีร้านลดลงจริงจึงต้องบันทึก" }
    hints:
      - "เงินก้อนนี้ใช้เพื่อหารายได้ให้ร้านหรือไม่"
      - "ทางบัญชีแยกเงินของกิจการกับเงินส่วนตัวของเจ้าของ"
    solution: "เงินออกจากกิจการไปให้เจ้าของใช้ส่วนตัว คือการถอนใช้ส่วนตัว เงินสด (สินทรัพย์) ลด $2{,}000$ และส่วนของเจ้าของลด $2{,}000$ โดยไม่ผ่านงบกำไรขาดทุน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.acc.p013
    topics: [business.accounting.equation]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนหาส่วนของเจ้าของปลายเดือนจากรายการค้าของร้าน"
    items:
      - "รวบรวมรายได้ทั้งหมดของเดือน รวมยอดขายเชื่อ"
      - "รวบรวมค่าใช้จ่ายทั้งหมดของเดือน ไม่รวมการถอนใช้ส่วนตัว"
      - "หากำไรสุทธิ = รายได้ − ค่าใช้จ่าย"
      - "นำส่วนของเจ้าของต้นเดือนบวกเงินลงทุนเพิ่มและกำไรสุทธิ แล้วลบการถอนใช้ส่วนตัว"
      - "ตรวจว่าสินทรัพย์ปลายเดือนเท่ากับหนี้สินบวกส่วนของเจ้าของ"
    hints:
      - "ต้องรู้กำไรสุทธิก่อนจึงจะหาส่วนของเจ้าของปลายงวดได้"
      - "กำไรสุทธิมาจากรายได้และค่าใช้จ่าย ส่วนการตรวจสมการทำเป็นขั้นสุดท้าย"
    solution: "รายได้ → ค่าใช้จ่าย → กำไรสุทธิ → ส่วนของเจ้าของปลายงวด → ตรวจสมการบัญชี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.acc.p014
    topics: [business.accounting.equation]
    difficulty: 3
    type: numeric
    stem: "ร้านเบเกอรี่มีสินทรัพย์ $145{,}000$ บาท และส่วนของเจ้าของ $98{,}500$ บาท ร้านมีหนี้สินกี่บาท (ตอบเป็นบาท)"
    answer: { value: 46500, unit: บาท }
    hints:
      - "จัดรูปสมการบัญชีให้หนี้สินอยู่ข้างเดียว"
      - "หนี้สิน $=$ สินทรัพย์ $-$ ส่วนของเจ้าของ"
    misconceptions:
      - { match: 243500, feedback: "นำสองค่ามาบวกกัน แต่สินทรัพย์คือผลรวมของหนี้สินกับส่วนของเจ้าของอยู่แล้ว ต้องลบ" }
    solution: "หนี้สิน $= 145{,}000 - 98{,}500 = 46{,}500$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.acc.p015
    topics: [business.accounting.equation]
    difficulty: 4
    type: numeric
    stem: "ต้นเดือนร้านขนมจีบมีเงินสด $5{,}000$ บาท ระหว่างเดือน: เจ้าของนำเงินมาลงทุนเพิ่ม $15{,}000$ บาท ขายได้เงินสด $22{,}000$ บาท จ่ายค่าเช่า $3{,}000$ บาท จ่ายหนี้ค่าแป้งที่ซื้อเชื่อไว้เดือนก่อน $4{,}000$ บาท กู้เงินสหกรณ์ $10{,}000$ บาท ซื้อเตานึ่งด้วยเงินสด $12{,}000$ บาท และถอนไปใช้ส่วนตัว $2{,}500$ บาท สิ้นเดือนมีเงินสดกี่บาท (ตอบเป็นบาท)"
    answer: { value: 30500, unit: บาท }
    hints:
      - "ทำตารางเงินสด: รายการไหนทำให้เงินสดเข้า รายการไหนทำให้ออก"
      - "เงินเข้า: ลงทุนเพิ่ม ขาย กู้ เงินออก: ค่าเช่า จ่ายหนี้ ซื้อเตา ถอนใช้ส่วนตัว แล้วรวมทั้งหมดกับยอดต้นเดือน"
    misconceptions:
      - { match: 20500, feedback: "ลืมเงินกู้ $10{,}000$ บาท เงินกู้ไม่ใช่รายได้ แต่เป็นเงินสดที่เข้ามาจริง" }
      - { match: 33000, feedback: "ลืมหักเงินที่ถอนไปใช้ส่วนตัว $2{,}500$ บาท ซึ่งทำให้เงินสดของร้านลดลง" }
    solution: "เงินเข้า $15{,}000 + 22{,}000 + 10{,}000 = 47{,}000$ เงินออก $3{,}000 + 4{,}000 + 12{,}000 + 2{,}500 = 21{,}500$ เงินสดสิ้นเดือน $= 5{,}000 + 47{,}000 - 21{,}500 = 30{,}500$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.acc.p016
    topics: [business.accounting.equation]
    difficulty: 4
    type: numeric
    stem: "ส่วนของเจ้าของร้านซักรีดต้นปี $60{,}000$ บาท ปลายปี $71{,}000$ บาท ระหว่างปีเจ้าของลงทุนเพิ่ม $5{,}000$ บาท และถอนใช้ส่วนตัว $3{,}000$ บาท ร้านมีกำไรสุทธิทั้งปีกี่บาท (ตอบเป็นบาท)"
    answer: { value: 9000, unit: บาท }
    hints:
      - "ปลายงวด $=$ ต้นงวด $+$ ลงทุนเพิ่ม $+$ กำไรสุทธิ $-$ ถอนใช้ส่วนตัว"
      - "แทนค่าที่รู้แล้วแก้สมการหากำไรสุทธิ"
    misconceptions:
      - { match: 11000, feedback: "นั่นคือการเปลี่ยนแปลงของส่วนของเจ้าของทั้งหมด ซึ่งรวมผลของเงินลงทุนเพิ่มและการถอนด้วย ต้องแยกสองรายการนี้ออก" }
      - { match: 3000, feedback: "ดูเหมือนลบการถอนใช้ส่วนตัวออกอีก การถอนทำให้ส่วนของเจ้าของลด จึงต้องบวกกลับเมื่อหากำไร" }
    solution: "$71{,}000 = 60{,}000 + 5{,}000 + P - 3{,}000 \\Rightarrow P = 71{,}000 - 62{,}000 = 9{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.acc.p017
    topics: [business.accounting.equation]
    difficulty: 4
    type: mcq
    stem: "รายการค้าใดทำให้สมการบัญชีเปลี่ยนแบบนี้: สินทรัพย์เพิ่ม หนี้สินไม่เปลี่ยน ส่วนของเจ้าของเพิ่ม"
    choices:
      - { id: a, text: "ทำความสะอาดแอร์ให้ลูกค้าและได้รับเงินสดทันที", correct: true }
      - { id: b, text: "ซื้อน้ำยาแอร์เป็นเงินเชื่อ", feedback: "ซื้อเชื่อทำให้สินทรัพย์เพิ่มพร้อมหนี้สิน (เจ้าหนี้) ส่วนของเจ้าของไม่เปลี่ยน" }
      - { id: c, text: "รับเงินที่ลูกค้าค้างจ่ายจากงานเดือนก่อน", feedback: "เงินสดเพิ่มแต่ลูกหนี้ลดเท่ากัน สินทรัพย์รวมเท่าเดิม รายได้นับไปแล้วตอนทำงานเดือนก่อน" }
      - { id: d, text: "กู้เงินธนาคารมาซื้อเครื่องมือ", feedback: "เงินกู้เพิ่มหนี้สิน ส่วนของเจ้าของไม่เปลี่ยน" }
    hints:
      - "ส่วนของเจ้าของเพิ่มได้สองทาง คือเจ้าของลงทุนเพิ่ม หรือกิจการมีรายได้"
      - "ตัวเลือกไหนเป็นรายได้ที่เพิ่งเกิดขึ้นและได้รับเงินแล้ว"
    solution: "ให้บริการแล้วได้เงินสดทันที: เงินสด (สินทรัพย์) เพิ่ม และรายได้ทำให้ส่วนของเจ้าของเพิ่ม หนี้สินไม่เปลี่ยน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.acc.p018
    topics: [business.accounting.equation]
    difficulty: 4
    type: numeric
    stem: "ร้านรับทำเค้กเดือนนี้ขายได้เงินสด $20{,}000$ บาท และขายเชื่อให้บริษัทแห่งหนึ่ง $7{,}000$ บาท (บริษัทจะจ่ายเดือนหน้า) มีค่าใช้จ่ายรวม $16{,}000$ บาท กำไรสุทธิของเดือนนี้เท่ากับกี่บาท (ตอบเป็นบาท)"
    answer: { value: 11000, unit: บาท }
    hints:
      - "รายได้นับเมื่อส่งมอบสินค้าแล้ว แม้ยังไม่ได้รับเงิน"
      - "รวมยอดขายเงินสดกับยอดขายเชื่อเป็นรายได้ แล้วหักค่าใช้จ่าย"
    misconceptions:
      - { match: 4000, feedback: "ไม่ได้นับยอดขายเชื่อ $7{,}000$ บาท ร้านส่งเค้กแล้วจึงมีรายได้ แม้เงินจะเข้าเดือนหน้า (บันทึกเป็นลูกหนี้)" }
    solution: "รายได้ $= 20{,}000 + 7{,}000 = 27{,}000$ บาท กำไรสุทธิ $= 27{,}000 - 16{,}000 = 11{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.acc.p019
    topics: [business.accounting.equation]
    difficulty: 4
    type: expression
    stem: "ให้ $B$ เป็นส่วนของเจ้าของต้นงวด $I$ เป็นเงินลงทุนเพิ่ม $P$ เป็นกำไรสุทธิ และ $W$ เป็นการถอนใช้ส่วนตัว เขียนสูตรส่วนของเจ้าของปลายงวด $E$"
    prefix: "E ="
    answer: { latex: "B + I + P - W", variables: [B, I, P, W] }
    hints:
      - "รายการใดทำให้ส่วนของเจ้าของเพิ่ม รายการใดทำให้ลด"
      - "ลงทุนเพิ่มและกำไรทำให้เพิ่ม การถอนใช้ส่วนตัวทำให้ลด"
    misconceptions:
      - { match: "B + I + P + W", feedback: "การถอนใช้ส่วนตัวนำเงินออกจากกิจการ ต้องลบ" }
      - { match: "B + P - W", feedback: "ลืมเงินลงทุนเพิ่ม $I$ ซึ่งเพิ่มส่วนของเจ้าของ" }
    solution: "$E = B + I + P - W$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.acc.p020
    topics: [business.accounting.equation]
    difficulty: 5
    type: numeric
    stem: "ร้านซ่อมโทรศัพท์ ต้นปีส่วนของเจ้าของ $60{,}000$ บาท ปลายปีมีสินทรัพย์ $120{,}000$ บาท หนี้สิน $45{,}000$ บาท ระหว่างปีเจ้าของไม่ได้ลงทุนเพิ่ม แต่ถอนใช้ส่วนตัว $6{,}000$ บาท ค่าใช้จ่ายทั้งปี $30{,}000$ บาท รายได้ทั้งปีเท่ากับกี่บาท (ตอบเป็นบาท)"
    answer: { value: 51000, unit: บาท }
    hints:
      - "หาส่วนของเจ้าของปลายปีจากสมการบัญชีก่อน"
      - "จากนั้นหากำไรสุทธิจากสูตรส่วนของเจ้าของปลายงวด แล้วใช้ รายได้ $=$ กำไรสุทธิ $+$ ค่าใช้จ่าย"
    misconceptions:
      - { match: 45000, feedback: "ลืมผลของการถอนใช้ส่วนตัว กำไรจริงต้องบวกเงินที่ถอนกลับ $15{,}000 + 6{,}000 = 21{,}000$ บาท" }
      - { match: 39000, feedback: "ลบการถอนใช้ส่วนตัวผิดทิศ การถอนทำให้ส่วนของเจ้าของลด จึงต้องบวกกลับเมื่อย้อนหากำไร" }
    solution: "ส่วนของเจ้าของปลายปี $= 120{,}000 - 45{,}000 = 75{,}000$ บาท กำไรสุทธิ $P$: $75{,}000 = 60{,}000 + P - 6{,}000 \\Rightarrow P = 21{,}000$ บาท รายได้ $= 21{,}000 + 30{,}000 = 51{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.acc.p021
    topics: [business.accounting.equation]
    difficulty: 5
    type: numeric
    stem: "นักเรียนทำบัญชีร้านค้าสหกรณ์โรงเรียน และบันทึกเงินกู้ $15{,}000$ บาทเป็นรายได้ ส่วนรายการอื่นถูกต้องทั้งหมด งบกำไรขาดทุนจึงแสดงกำไรสุทธิ $18{,}000$ บาท กำไรสุทธิที่ถูกต้องเท่ากับกี่บาท (ตอบเป็นบาท)"
    answer: { value: 3000, unit: บาท }
    hints:
      - "เงินกู้ต้องคืน จึงเป็นหนี้สิน ไม่ใช่รายได้"
      - "นำรายได้ที่นับเกินไปออกจากกำไรที่รายงาน"
    misconceptions:
      - { match: 33000, feedback: "รายได้ถูกนับเกินไป $15{,}000$ บาท กำไรจริงจึงต่ำกว่าที่รายงาน ต้องลบออก ไม่ใช่บวกเพิ่ม" }
    solution: "รายได้ถูกนับเกินไป $15{,}000$ บาท กำไรสุทธิที่ถูกต้อง $= 18{,}000 - 15{,}000 = 3{,}000$ บาท และต้องบันทึก $15{,}000$ บาทเป็นหนี้สินแทน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.acc.p022
    topics: [business.accounting.equation]
    difficulty: 4
    type: numeric
    stem: "รายการของร้านขายต้นไม้ออนไลน์: เงินสด $12{,}000$ บาท เงินฝากธนาคาร $35{,}000$ บาท อุปกรณ์ $28{,}000$ บาท เจ้าหนี้การค้า $9{,}500$ บาท เงินกู้ $20{,}000$ บาท ส่วนของเจ้าของเท่ากับกี่บาท (ตอบเป็นบาท)"
    answer: { value: 45500, unit: บาท }
    hints:
      - "แยกรายการเป็นสินทรัพย์และหนี้สินก่อน"
      - "รวมแต่ละกลุ่ม แล้วนำสินทรัพย์รวมลบหนี้สินรวม"
    misconceptions:
      - { match: 75000, feedback: "นั่นคือสินทรัพย์รวม ยังไม่ได้หักหนี้สิน $29{,}500$ บาท" }
      - { match: 104500, feedback: "ดูเหมือนรวมทุกรายการเข้าด้วยกัน เจ้าหนี้และเงินกู้เป็นหนี้สิน ต้องหักออก" }
    solution: "สินทรัพย์ $= 12{,}000 + 35{,}000 + 28{,}000 = 75{,}000$ บาท หนี้สิน $= 9{,}500 + 20{,}000 = 29{,}500$ บาท ส่วนของเจ้าของ $= 75{,}000 - 29{,}500 = 45{,}500$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true
