    ai_assisted: true

  - id: phy.wn.p017
    topics: [physics.dynamics.weight-normal]
    difficulty: 3
    type: mcq
    stem: "ถังน้ำมวล $5\\ \\mathrm{kg}$ วางบนพื้น เด็กดึงหูถังขึ้นตรง ๆ ด้วยแรง $15\\ \\mathrm{N}$ แต่ถังยังไม่ลอย แผนภาพแรงของถังที่ถูกต้องคือข้อใด ($W$ น้ำหนัก, $T$ แรงดึงของเด็ก, $N$ แรงที่พื้นดันถัง)"
    choices:
      - { id: a, text: "$W = 49\\ \\mathrm{N}$ ชี้ลง, $T = 15\\ \\mathrm{N}$ ชี้ขึ้น, $N = 34\\ \\mathrm{N}$ ชี้ขึ้น", correct: true }
      - { id: b, text: "$W = 49\\ \\mathrm{N}$ ชี้ลง, $T = 15\\ \\mathrm{N}$ ชี้ขึ้น, $N = 49\\ \\mathrm{N}$ ชี้ขึ้น", feedback: "ถ้า $N = 49\\ \\mathrm{N}$ แรงขึ้นรวมจะเป็น $64\\ \\mathrm{N}$ มากกว่าน้ำหนัก ถังจะเร่งขึ้น แต่ถังนิ่ง พื้นจึงดันเพียงส่วนที่ยังขาด" }
      - { id: c, text: "$W = 49\\ \\mathrm{N}$ ชี้ลง, $T = 15\\ \\mathrm{N}$ ชี้ขึ้น, $N = 64\\ \\mathrm{N}$ ชี้ขึ้น", feedback: "แรงดึงขึ้นของเด็กช่วยรับน้ำหนักบางส่วน พื้นจึงดันน้อยลง ไม่ใช่มากขึ้น" }
      - { id: d, text: "$W = 5\\ \\mathrm{N}$ ชี้ลง, $T = 15\\ \\mathrm{N}$ ชี้ขึ้น, ไม่มีแรงจากพื้น", feedback: "น้ำหนักต้องเป็น $mg = 49\\ \\mathrm{N}$ ไม่ใช่ $5$ (นั่นคือมวลในหน่วย kg) และถ้าแรงขึ้นมากกว่าน้ำหนัก ถังจะลอยขึ้น" }
    hints:
      - "ถังนิ่ง แรงขึ้นรวมต้องเท่ากับแรงลงรวม"
      - "$N + T = W$ โดย $W = mg$"
    solution: "$W = 5 \\times 9.8 = 49\\ \\mathrm{N}$ ชี้ลง ถังนิ่งจึงได้ $N + T = W$ หรือ $N = 49 - 15 = 34\\ \\mathrm{N}$ ชี้ขึ้น พร้อมกับแรงดึง $T = 15\\ \\mathrm{N}$ ชี้ขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wn.p018
    topics: [physics.dynamics.weight-normal]
