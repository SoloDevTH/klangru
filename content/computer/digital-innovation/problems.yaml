problems:
  - id: computer.projects.digital-innovation.p001
    topics: [computer.projects.digital-innovation]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นการใช้สื่อดิจิทัลเพิ่มมูลค่าให้ผ้าทอของกลุ่มทอผ้าในหมู่บ้าน"
    choices:
      - { id: a, text: "ติดคิวอาร์โค้ดที่ป้ายสินค้า พาไปดูคลิปเล่าขั้นตอนการทอและความหมายของลาย", correct: true }
      - { id: b, text: "ขึ้นราคาผ้าทุกผืนอีก 20% โดยไม่เปลี่ยนอะไรเลย", feedback: "ขึ้นราคาอย่างเดียวไม่ได้ทำให้สินค้ามีคุณค่าต่อลูกค้ามากขึ้น และไม่ได้ใช้สื่อดิจิทัล" }
      - { id: c, text: "ซื้อคอมพิวเตอร์เครื่องใหม่มาวางไว้ที่ร้าน", feedback: "มีอุปกรณ์แต่ไม่ได้ใช้ทำอะไร มูลค่าของสินค้าไม่เปลี่ยน" }
      - { id: d, text: "ใช้ภาพผ้าของร้านอื่นที่สวยกว่ามาโพสต์ขาย", feedback: "ภาพไม่ตรงกับสินค้าจริงทำให้ลูกค้าเข้าใจผิดและละเมิดสิทธิ์ของเจ้าของภาพ" }
    hints:
      - "การเพิ่มมูลค่าคือทำให้ลูกค้าเห็นคุณค่าของสินค้ามากขึ้น"
      - "สื่อดิจิทัล เช่น คลิป ภาพ เรื่องเล่า ต้องตรงกับความจริงด้วย"
    solution: "คลิปเล่าขั้นตอนการทอและความหมายของลายเป็นสื่อดิจิทัลที่ทำให้ลูกค้าเห็นคุณค่าของงานฝีมือ จึงเพิ่มมูลค่า ส่วนการขึ้นราคาเฉย ๆ หรือซื้ออุปกรณ์มาวางไม่ได้เพิ่มคุณค่า และการใช้ภาพของร้านอื่นเป็นการหลอกลวง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.projects.digital-innovation.p002
    topics: [computer.projects.digital-innovation]
    difficulty: 1
    type: match
    stem: "จับคู่ความรู้หรือเครื่องมือกับตัวอย่างการใช้ในโครงงานกล้วยตาก"
    pairs:
      - { left: "วิทยาการคอมพิวเตอร์", right: "เขียนโปรแกรมคำนวณค่าส่งตามน้ำหนักพัสดุโดยอัตโนมัติ" }
      - { left: "สื่อดิจิทัล", right: "คลิปสั้นเล่าว่ากล้วยมาจากสวนในชุมชน" }
      - { left: "เทคโนโลยีสารสนเทศ", right: "แบบฟอร์มสั่งซื้อออนไลน์ที่ส่งข้อมูลเข้าตารางคำนวณของกลุ่ม" }
      - { left: "การวิเคราะห์ข้อมูล", right: "หาว่าสินค้าแบบใดทำกำไรรวมต่อเดือนมากที่สุด" }
    hints:
      - "วิทยาการคอมพิวเตอร์เน้นอัลกอริทึมและโปรแกรม"
      - "เทคโนโลยีสารสนเทศเน้นการเก็บ ส่ง และจัดการข้อมูล"
    solution: "โปรแกรมคำนวณค่าส่งเป็นวิทยาการคอมพิวเตอร์ คลิปเป็นสื่อดิจิทัล แบบฟอร์มที่ส่งข้อมูลเข้าตารางเป็นเทคโนโลยีสารสนเทศ และการหาสินค้าที่กำไรรวมมากที่สุดเป็นการวิเคราะห์ข้อมูล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.projects.digital-innovation.p003
    topics: [computer.projects.digital-innovation]
    difficulty: 2
    type: numeric
    stem: "กล้วยอบน้ำผึ้งขายถุงละ 80 บาท ต้นทุนถุงละ 50 บาท เดือนนี้ขายได้ 70 ถุง กำไรรวมของสินค้านี้เดือนนี้เป็นกี่บาท"
    answer: { value: 2100, unit: "บาท" }
    hints:
      - "หากำไรต่อถุงก่อน"
      - "กำไรรวม = (ราคา − ต้นทุน) × จำนวนที่ขายได้"
    misconceptions:
      - { match: 5600, feedback: "5,600 บาทคือรายได้ (ราคา × จำนวน) ยังไม่ได้หักต้นทุน" }
      - { match: 30, feedback: "30 บาทคือกำไรต่อถุง ต้องคูณจำนวนที่ขายได้" }
    solution: "กำไรต่อถุง 80 − 50 = 30 บาท × 70 ถุง = 2,100 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.projects.digital-innovation.p004
    topics: [computer.projects.digital-innovation]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนของโครงงานใช้เทคโนโลยีเพิ่มมูลค่าให้สินค้าของชุมชน"
    items:
      - "พูดคุยกับผู้ผลิตและลูกค้าเพื่อระบุปัญหาที่แท้จริง"
      - "รวบรวมข้อมูลยอดขายและแบบสอบถามลูกค้า"
      - "วิเคราะห์ข้อมูลเพื่อเลือกว่าจะเพิ่มมูลค่าที่จุดใด"
      - "เลือกและเชื่อมเครื่องมือ แล้วสร้างสื่อและต้นแบบ"
      - "ให้ผู้ใช้จริงลองใช้และวัดผลเทียบกับก่อนทำ"
      - "ปรับปรุงสื่อและระบบจากผลที่วัดได้"
    hints:
      - "ข้อมูลต้องมาก่อนการตัดสินใจ และการตัดสินใจต้องมาก่อนการสร้าง"
      - "การวัดผลต้องทำหลังมีต้นแบบให้ผู้ใช้ลอง แล้วจึงปรับปรุง"
    solution: "ระบุปัญหากับผู้ใช้ → เก็บข้อมูล → วิเคราะห์ → สร้างด้วยเครื่องมือที่เลือก → ทดสอบและวัดผลกับผู้ใช้จริง → ปรับปรุง (แล้ววนรอบได้อีก)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.projects.digital-innovation.p005
    topics: [computer.projects.digital-innovation]
    difficulty: 2
    type: mcq
    stem: "นักเรียนทำหน้าขายน้ำพริกของกลุ่มแม่บ้านออนไลน์ ข้อความใดทำให้หน้าเว็บ **น่าเชื่อถือ** ที่สุด"
    choices:
      - { id: a, text: "ภาพถ่ายสินค้าจริง ส่วนผสม วันผลิต วันหมดอายุ และเลขที่ได้รับอนุญาตจากหน่วยงานที่เกี่ยวข้อง (ถ้ามี)", correct: true }
      - { id: b, text: "รีวิวห้าดาว 50 รายการที่นักเรียนเขียนขึ้นเอง", feedback: "รีวิวปลอมเป็นการหลอกลวงลูกค้า เมื่อถูกจับได้ความน่าเชื่อถือจะหายไปทั้งหมด" }
      - { id: c, text: "ข้อความว่า กินแล้วช่วยลดความดันและรักษาเบาหวาน", feedback: "อาหารอ้างสรรพคุณรักษาโรคไม่ได้ และไม่มีหลักฐานรองรับ" }
      - { id: d, text: "ภาพที่แต่งสีจนน้ำพริกดูแดงสดกว่าของจริงมาก", feedback: "ภาพที่ต่างจากของจริงมากทำให้ลูกค้าผิดหวังเมื่อได้รับสินค้า" }
    hints:
      - "ข้อมูลที่น่าเชื่อถือคือข้อมูลที่จริงและตรวจได้"
      - "ตัดตัวเลือกที่หลอกลวงหรืออ้างเกินจริงออก"
    solution: "ภาพจริงและข้อมูลที่ตรวจได้ (ส่วนผสม วันผลิต วันหมดอายุ) ทำให้ลูกค้าเชื่อถือ ส่วนรีวิวปลอม การอ้างรักษาโรค และภาพที่แต่งเกินจริงเป็นการหลอกลวง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.projects.digital-innovation.p006
    topics: [computer.projects.digital-innovation]
    difficulty: 3
    type: numeric
    stem: "จากแผนภูมิ ยอดขายเฉลี่ยต่อเดือนช่วง เม.ย.–มิ.ย. (หลังติด QR) เพิ่มขึ้นจากช่วง ม.ค.–มี.ค. (ก่อนติด QR) ร้อยละเท่าไร"
    figure:
      src: monthly-sales.svg
      alt: "แผนภูมิแท่งจำนวนถุงกล้วยตากที่ขายได้ต่อเดือน ม.ค. 80 ถุง ก.พ. 76 ถุง มี.ค. 84 ถุง เส้นประสีแดงก่อนเดือน เม.ย. เขียนว่าเริ่มติด QR บนถุง เม.ย. 98 ถุง พ.ค. 104 ถุง มิ.ย. 110 ถุง"
    answer: { value: 30, unit: "%" }
    hints:
      - "หาค่าเฉลี่ยของสามเดือนก่อนและสามเดือนหลัง"
      - "ร้อยละที่เปลี่ยนไป = (ค่าหลัง − ค่าก่อน) ÷ ค่าก่อน × 100"
    misconceptions:
      - { match: 37.5, feedback: "เทียบแค่ ม.ค. กับ มิ.ย. ซึ่งไม่ใช่ค่าเฉลี่ยของแต่ละช่วง" }
      - { match: 24, feedback: "24 ถุงคือส่วนต่างของค่าเฉลี่ย ต้องหารด้วยค่าก่อนแล้วคูณ 100" }
    solution: "ก่อน (80 + 76 + 84) ÷ 3 = 80 ถุง หลัง (98 + 104 + 110) ÷ 3 = 104 ถุง เพิ่มขึ้น (104 − 80) ÷ 80 × 100 = 30% แต่ยังต้องตรวจว่ามีปัจจัยอื่นในช่วงเดียวกันหรือไม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.projects.digital-innovation.p007
    topics: [computer.projects.digital-innovation]
    difficulty: 3
    type: text
    stem: "นักเรียนตัดคลิปเล่าเรื่องยาว 3 นาทีให้เป็นคลิปแนวตั้ง 30 วินาทีสำหรับผู้ชมบนโทรศัพท์ และทำโปสเตอร์จากภาพนิ่งในคลิป การนำสื่อเดิมไปปรับเป็นรูปแบบใหม่สำหรับผู้ชมหรือช่องทางใหม่ เรียกเป็นภาษาอังกฤษว่าอะไร (คำเดียว ขึ้นต้นด้วย re)"
    accepted: ["repurpose", "re-purpose", "repurposing", "re-purposing", "re purpose"]
    misconceptions:
      - { match: "reuse", feedback: "reuse คือนำสื่อเดิมไปใช้ซ้ำแบบเดิม แต่ข้อนี้เปลี่ยนรูปแบบของสื่อด้วย" }
      - { match: "revise", feedback: "revise คือแก้ไขปรับปรุงชิ้นเดิม เช่น แก้เสียงที่เบา ไม่ได้เปลี่ยนเป็นสื่อรูปแบบใหม่" }
    hints:
      - "บทเรียนแยก re-use, revise และอีกคำหนึ่ง"
      - "คำนี้หมายถึงให้สื่อมีจุดประสงค์ (purpose) ใหม่"
    solution: "re-purpose คือดัดแปลงสื่อที่มีอยู่ไปใช้ในรูปแบบใหม่ เช่น คลิปยาวเป็นคลิปสั้น ภาพนิ่งจากคลิปเป็นโปสเตอร์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.projects.digital-innovation.p008
    topics: [computer.projects.digital-innovation]
    difficulty: 3
    type: mcq
    stem: "กลุ่มเกษตรกรปลูกมะม่วงอยากรับสั่งจองจากลูกค้าทั่วประเทศก่อนฤดูเก็บเกี่ยว และรู้ว่าต้องเตรียมกล่องกี่ใบไปแต่ละจังหวัด ชุดเครื่องมือใดเหมาะที่สุด"
    choices:
      - { id: a, text: "แบบฟอร์มออนไลน์รับจอง → ตารางคำนวณรวมจำนวนตามจังหวัดด้วยสูตร → กราฟสรุปให้กลุ่มดูบนโทรศัพท์", correct: true }
      - { id: b, text: "ให้ลูกค้าส่งข้อความส่วนตัวมา แล้วจดลงสมุด", feedback: "ข้อมูลกระจายอยู่ในแชตและสมุด รวมยอดตามจังหวัดยากและผิดง่ายเมื่อมีลูกค้ามาก" }
      - { id: c, text: "ทำคลิปโฆษณาสวยงามอย่างเดียว", feedback: "คลิปช่วยให้คนรู้จัก แต่ไม่ได้เก็บข้อมูลการจองหรือรวมยอด" }
      - { id: d, text: "เขียนแอปโทรศัพท์ใหม่ทั้งหมดตั้งแต่ศูนย์", feedback: "ทำได้แต่ใช้เวลาและต้องมีคนดูแลต่อ เครื่องมือที่มีอยู่แล้วเชื่อมกันทำงานนี้ได้เร็วกว่า" }
    hints:
      - "งานนี้มีสามส่วน รับข้อมูล รวมยอดตามจังหวัด และแสดงผลให้กลุ่มเห็น"
      - "เลือกชุดที่ทำครบสามส่วนและดูแลต่อได้ง่าย"
    solution: "แบบฟอร์มเก็บข้อมูลในรูปแบบเดียวกัน ตารางคำนวณรวมยอดตามจังหวัดอัตโนมัติ และกราฟทำให้เห็นภาพรวมบนโทรศัพท์ เป็นการเลือกและเชื่อมหลายเครื่องมือให้ตรงกับงาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.projects.digital-innovation.p009
    topics: [computer.projects.digital-innovation]
    difficulty: 3
    type: numeric
    stem: "เดิมแม่บ้านสรุปคำสั่งซื้อด้วยมือวันละ 40 รายการ รายการละ 3 นาที หลังใช้แบบฟอร์มกับตารางคำนวณที่สรุปให้อัตโนมัติ เวลาส่วนนี้แทบเป็นศูนย์ ถ้าทำงาน 26 วันต่อเดือน ประหยัดเวลาได้กี่ชั่วโมงต่อเดือน"
    answer: { value: 52, unit: "ชั่วโมง" }
    hints:
      - "หาเวลาต่อวันเป็นนาทีก่อน"
      - "คูณจำนวนวัน แล้วหารด้วย 60 เพื่อแปลงเป็นชั่วโมง"
    misconceptions:
      - { match: 2, feedback: "2 ชั่วโมงคือเวลาต่อวัน ต้องคูณ 26 วัน" }
      - { match: 3120, feedback: "3,120 คือนาทีต่อเดือน ต้องหารด้วย 60 เป็นชั่วโมง" }
    solution: "40 × 3 = 120 นาทีต่อวัน × 26 วัน = 3,120 นาที ÷ 60 = 52 ชั่วโมงต่อเดือน เวลาที่ได้คืนมาเป็นมูลค่าเพิ่มอย่างหนึ่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.projects.digital-innovation.p010
    topics: [computer.projects.digital-innovation]
    difficulty: 4
    type: mcq
    stem: "นักเรียนให้ลูกค้าสูงอายุ 5 คนลองสั่งซื้อผ่านหน้าเว็บ พบว่า 3 คนหาปุ่มสั่งซื้อไม่เจอ เพราะปุ่มอยู่ล่างสุดหลังคลิปและภาพ 8 ภาพ และตัวอักษรบนปุ่มเล็ก ควรปรับอย่างไร"
    choices:
      - { id: a, text: "ย้ายปุ่มสั่งซื้อขึ้นมาใกล้ส่วนบน ทำปุ่มใหญ่และสีตัดกัน แล้วให้ลูกค้ากลุ่มเดิมลองใหม่", correct: true }
      - { id: b, text: "เพิ่มภาพสินค้าอีก 10 ภาพให้หน้าเว็บน่าสนใจขึ้น", feedback: "ยิ่งเพิ่มภาพ ปุ่มยิ่งอยู่ไกลลงไป ปัญหาที่พบจะแย่ลง" }
      - { id: c, text: "ไม่ต้องแก้ เพราะยังมี 2 คนที่สั่งได้", feedback: "3 ใน 5 คนทำงานหลักไม่สำเร็จ แปลว่าหน้าเว็บยังใช้ไม่ได้สำหรับกลุ่มผู้ใช้นี้" }
