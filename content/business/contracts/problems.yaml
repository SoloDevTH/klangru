problems:
- id: business.law.contracts.p001
  topics:
  - business.law.contracts
  difficulty: 1
  type: mcq
  stem: สัญญาซื้อขายทั่วไปเกิดขึ้นเมื่อใด
  choices:
  - id: a
    text: เมื่อคำเสนอของฝ่ายหนึ่งและคำสนองของอีกฝ่ายถูกต้องตรงกัน
    correct: true
  - id: b
    text: เมื่อผู้ซื้อจ่ายเงินครบเท่านั้น
    feedback: การจ่ายเงินเป็นการชำระหนี้ตามสัญญา สัญญาเกิดได้ก่อนจ่ายเงิน
  - id: c
    text: เมื่อทำเป็นหนังสือทุกครั้ง
    feedback: สัญญาส่วนใหญ่ทำด้วยวาจาได้ เว้นแต่กฎหมายกำหนดแบบไว้
  - id: d
    text: เมื่อไปจดทะเบียนที่อำเภอ
    feedback: การจดทะเบียนจำเป็นเฉพาะทรัพย์บางชนิด เช่น ที่ดิน
  hints:
  - สัญญาเป็นนิติกรรมสองฝ่าย
  - ต้องมีฝ่ายเสนอและฝ่ายตกลงรับ
  solution: สัญญาเกิดเมื่อ **คำเสนอและคำสนองถูกต้องตรงกัน** เช่น แม่ค้าบอกขายมะม่วงกิโลละ 50 บาท ลูกค้าตกลงซื้อ 2 กิโลกรัม สัญญาซื้อขายเกิดแล้ว แม้ยังไม่ได้เขียนอะไร
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.contracts.p002
  topics:
  - business.law.contracts
  difficulty: 1
  type: match
  stem: จับคู่รูปแบบธุรกิจกับความรับผิดในหนี้ของเจ้าของ
  pairs:
  - left: กิจการเจ้าของคนเดียว
    right: เจ้าของรับผิดในหนี้ทั้งหมดไม่จำกัด
  - left: ห้างหุ้นส่วนสามัญ
    right: หุ้นส่วนทุกคนรับผิดร่วมกันโดยไม่จำกัด
  - left: ห้างหุ้นส่วนจำกัด
    right: มีหุ้นส่วนทั้งจำพวกจำกัดและไม่จำกัดความรับผิด
  - left: บริษัทจำกัด
    right: ผู้ถือหุ้นรับผิดไม่เกินค่าหุ้นที่ยังชำระไม่ครบ
  hints:
  - คำว่า "จำกัด" บอกเรื่องความรับผิด
  - ห้างหุ้นส่วนจำกัดต้องมีหุ้นส่วนไม่จำกัดความรับผิดอย่างน้อยหนึ่งคน
  solution: เจ้าของคนเดียว → ไม่จำกัด · ห้างหุ้นส่วนสามัญ → ทุกคนไม่จำกัด · ห้างหุ้นส่วนจำกัด → มีทั้งสองจำพวก · บริษัทจำกัด → ไม่เกินค่าหุ้นที่ยังไม่ชำระ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.contracts.p003
  topics:
  - business.law.contracts
  difficulty: 2
  type: mcq
  stem: น้องต้น อายุ $16$ ปี ซื้อโทรศัพท์ราคา $25{,}000$ บาทโดยพ่อแม่ไม่ได้ให้ความยินยอม สัญญาซื้อขายนี้มีผลอย่างไร
  choices:
  - id: a
    text: เป็นโมฆียะ พ่อแม่ในฐานะผู้แทนโดยชอบธรรมบอกล้างได้
    correct: true
  - id: b
    text: เป็นโมฆะ ไม่มีผลตั้งแต่ต้น
    feedback: การขาดความสามารถของผู้เยาว์ทำให้เป็นโมฆียะ ไม่ใช่โมฆะ
  - id: c
    text: สมบูรณ์ เพราะน้องต้นจ่ายเงินแล้ว
    feedback: การจ่ายเงินไม่ได้แก้ความบกพร่องเรื่องความสามารถ
  - id: d
    text: สมบูรณ์ เพราะอายุเกิน 15 ปีแล้ว
    feedback: ผู้เยาว์คือผู้ที่ยังไม่บรรลุนิติภาวะ (อายุยังไม่ครบ 20 ปีและยังไม่สมรสตามกฎหมาย)
  hints:
  - บุคคลบรรลุนิติภาวะเมื่ออายุ 20 ปีบริบูรณ์ หรือสมรสตามกฎหมาย
  - นิติกรรมที่ผู้เยาว์ทำโดยไม่ได้รับความยินยอม และไม่ใช่ของใช้จำเป็นเล็กน้อย มีผลอย่างไร
  solution: ผู้เยาว์ทำนิติกรรมต้องได้รับความยินยอมจากผู้แทนโดยชอบธรรม มิฉะนั้นเป็น **โมฆียะ** ผู้แทนโดยชอบธรรมบอกล้างได้ ยกเว้นนิติกรรมที่ทำให้ได้สิทธิอย่างเดียว หรือเป็นการสมแก่ฐานานุรูปและจำเป็นในการดำรงชีพ เช่น ซื้ออาหารกลางวัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.contracts.p004
  topics:
  - business.law.contracts
  difficulty: 2
  type: numeric
  stem: ตามประมวลกฎหมายแพ่งและพาณิชย์ ผู้ให้กู้ที่เป็นบุคคลธรรมดา (ไม่ใช่สถาบันการเงิน) เรียกดอกเบี้ยได้ไม่เกิน $15\%$ ต่อปี ถ้ากู้ $50{,}000$ บาท $1$ ปี ดอกเบี้ยสูงสุดที่เรียกได้ตามกฎหมายคือกี่บาท (ตอบเป็นบาท)
  answer:
    value: 7500
    unit: บาท
  misconceptions:
  - match: 625
    feedback: หาร 12 คิดเป็นรายเดือน แต่โจทย์ถาม 1 ปี
  - match: 57500
    feedback: นั่นคือเงินต้นรวมดอกเบี้ย
  hints:
  - ดอกเบี้ย $=$ เงินต้น $\times$ อัตรา $\times$ เวลา
  - $15\% = 0.15$
  solution: ดอกเบี้ยสูงสุด $= 50{,}000 \times 0.15 \times 1 = 7{,}500$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.contracts.p005
  topics:
  - business.law.contracts
  difficulty: 2
  type: mcq
  stem: ป้าแดงให้เพื่อนบ้านกู้เงิน $5{,}000$ บาทด้วยวาจา ไม่มีเอกสารใดเลย ต่อมาเพื่อนบ้านไม่คืน ข้อใดถูกต้อง
  choices:
  - id: a
    text: ป้าแดงฟ้องร้องบังคับคดีไม่ได้ เพราะกู้เงินเกิน 2,000 บาทต้องมีหลักฐานเป็นหนังสือลงลายมือชื่อผู้กู้
    correct: true
  - id: b
    text: สัญญาเป็นโมฆะ ป้าแดงไม่มีสิทธิได้เงินคืนเลย
    feedback: สัญญาไม่ได้เป็นโมฆะ ถ้าผู้กู้ยอมคืนเองก็คืนได้ แต่ฟ้องบังคับคดีไม่ได้เพราะขาดหลักฐาน
  - id: c
    text: ฟ้องได้แน่นอน เพราะมีเพื่อนบ้านเห็นตอนให้เงิน
    feedback: พยานบุคคลใช้แทนหลักฐานเป็นหนังสือที่กฎหมายกำหนดไม่ได้
  - id: d
    text: ฟ้องได้เพราะกู้ไม่ถึง 10,000 บาท
    feedback: เกณฑ์ตามกฎหมายคือเกิน 2,000 บาท
  hints:
  - กู้ยืมเงินเกินกี่บาทต้องมีหลักฐานเป็นหนังสือ
  - หลักฐานต้องลงลายมือชื่อฝ่ายใด
  solution: การกู้ยืมเงินเกิน $2{,}000$ บาท ต้องมีหลักฐานเป็นหนังสือลงลายมือชื่อผู้ยืม มิฉะนั้นฟ้องร้องบังคับคดีไม่ได้ หลักฐานอาจเป็นข้อความแชตหรืออีเมลที่ยืนยันตัวผู้กู้ได้ตามกฎหมายธุรกรรมทางอิเล็กทรอนิกส์ จึงควรเก็บหลักฐานทุกครั้ง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.contracts.p006
  topics:
  - business.law.contracts
  difficulty: 3
  type: match
  stem: จับคู่สัญญากับข้อกำหนดเรื่องแบบหรือหลักฐานตามกฎหมาย
  pairs:
  - left: ซื้อขายที่ดิน
    right: ต้องทำเป็นหนังสือและจดทะเบียนต่อพนักงานเจ้าหน้าที่ มิฉะนั้นเป็นโมฆะ
  - left: เช่าซื้อรถจักรยานยนต์
    right: ต้องทำเป็นหนังสือ มิฉะนั้นเป็นโมฆะ
  - left: เช่าตึกแถว 5 ปี
    right: ต้องมีหลักฐานเป็นหนังสือ และจดทะเบียนจึงฟ้องร้องได้เกิน 3 ปี
  - left: ซื้อขายมะม่วงที่ตลาด 100 บาท
    right: ทำด้วยวาจาได้ ไม่ต้องมีแบบหรือหลักฐาน
  hints:
  - แบบ (ทำไม่ครบเป็นโมฆะ) ต่างจากหลักฐาน (ไม่มีฟ้องไม่ได้)
  - เช่าอสังหาริมทรัพย์เกิน 3 ปีต้องจดทะเบียน
  solution: ที่ดิน → หนังสือ + จดทะเบียน (แบบ) · เช่าซื้อ → ทำเป็นหนังสือ (แบบ) · เช่าตึก 5 ปี → หลักฐานเป็นหนังสือ และจดทะเบียน ไม่เช่นนั้นฟ้องได้เพียง 3 ปี · มะม่วง 100 บาท → วาจาก็พอ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.contracts.p007
  topics:
  - business.law.contracts
  difficulty: 3
  type: numeric
  stem: จากสัญญาในภาพ เมื่อสัญญาครบกำหนด นายวินัยยังค้างค่าเช่าเดือนสุดท้าย และทำหลังคาแผงเสียหาย ค่าซ่อม $2{,}000$ บาท นางสมพรต้องคืนเงินประกันให้นายวินัยกี่บาท (ตอบเป็นบาท)
  figure:
    src: p-stall-contract.svg
    alt: ข้อความสัญญาเช่าแผงค้า ตลาดนัดชุมชนบ้านสวน (สมมติ) ผู้ให้เช่า นางสมพร ผู้เช่า นายวินัย ข้อ 1 เช่าแผงเลขที่ 12 ขนาด 2 คูณ 3 เมตร กำหนด 1 ปี ข้อ 2 ค่าเช่าเดือนละ 4,500 บาท ชำระภายในวันที่ 5 ของทุกเดือน ข้อ 3 ผู้เช่าวางเงินประกันเท่ากับค่าเช่า 3 เดือน ข้อ 4 เมื่อสัญญาสิ้นสุด ผู้ให้เช่าคืนเงินประกันภายใน 30 วัน หลังหักค่าเช่าค้างชำระและค่าซ่อมความเสียหายที่ผู้เช่าก่อ ข้อ 5 ห้ามนำแผงไปให้ผู้อื่นเช่าช่วงโดยไม่ได้รับอนุญาตเป็นหนังสือ มีช่องลงชื่อทั้งสองฝ่าย
  answer:
    value: 7000
    unit: บาท
  misconceptions:
  - match: 11500
    feedback: ลืมหักค่าเช่าที่ค้าง
  - match: 13500
    feedback: ไม่ได้หักอะไรเลย สัญญาข้อ 4 ให้หักค่าเช่าค้างและค่าซ่อมได้
  hints:
  - เงินประกัน $=$ ค่าเช่า $3$ เดือน
  - หักค่าเช่าค้าง $1$ เดือนและค่าซ่อมตามข้อ 4
  solution: เงินประกัน $= 4{,}500 \times 3 = 13{,}500$ บาท คืน $= 13{,}500 - 4{,}500 - 2{,}000 = 7{,}000$ บาท ภายใน 30 วัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.contracts.p008
  topics:
  - business.law.contracts
  difficulty: 3
  type: mcq
  stem: ลุงชมตกลงขายที่ดินให้นายเก่งด้วยวาจา นายเก่งจ่ายเงินครบ แต่ไม่ได้ทำเป็นหนังสือและไม่ได้ไปจดทะเบียนที่สำนักงานที่ดิน สัญญานี้มีผลอย่างไร
  choices:
  - id: a
    text: เป็นโมฆะ เพราะไม่ได้ทำตามแบบที่กฎหมายบังคับ
    correct: true
  - id: b
    text: สมบูรณ์ เพราะจ่ายเงินครบแล้ว
    feedback: การจ่ายเงินไม่ได้แทนการทำตามแบบ ซื้อขายอสังหาริมทรัพย์ต้องทำเป็นหนังสือและจดทะเบียน
  - id: c
    text: เป็นโมฆียะ นายเก่งบอกล้างได้
    feedback: การไม่ทำตามแบบทำให้เป็นโมฆะ ไม่ใช่โมฆียะ
  - id: d
    text: สมบูรณ์ แต่ฟ้องร้องไม่ได้
    feedback: ข้อนี้ใช้กับกรณีขาดหลักฐานเป็นหนังสือ แต่ซื้อขายที่ดินเป็นเรื่องแบบ
  hints:
  - ซื้อขายอสังหาริมทรัพย์มีแบบที่กฎหมายบังคับ
  - ไม่ทำตามแบบ ผลคือโมฆะ
  solution: การซื้อขายอสังหาริมทรัพย์ต้องทำเป็นหนังสือและจดทะเบียนต่อพนักงานเจ้าหน้าที่ มิฉะนั้นเป็น **โมฆะ** นายเก่งเรียกเงินคืนได้ตามหลักลาภมิควรได้ ถ้าต้องการผูกพันกันก่อนโอน ควรทำสัญญาจะซื้อจะขายเป็นหนังสือหรือวางมัดจำ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.contracts.p009
  topics:
  - business.law.contracts
  difficulty: 3
  type: numeric
  stem: ร้านค้าส่ง (สมมติ) ขายสินค้าเชื่อให้ร้านอาหาร $120{,}000$ บาท โดยไม่ได้ตกลงดอกเบี้ยกันไว้ ร้านอาหารผิดนัดชำระ $ 73 $ วัน ถ้าดอกเบี้ยผิดนัดตามกฎหมายคือ $5\%$ ต่อปี ($3\%$ บวก $2\%$) ร้านค้าส่งเรียกดอกเบี้ยผิดนัดได้กี่บาท (ใช้ 1 ปี $= 365$ วัน ตอบเป็นบาท)
  answer:
    value: 1200
    unit: บาท
  misconceptions:
  - match: 720
    feedback: ใช้อัตรา 3% ซึ่งเป็นอัตราดอกเบี้ยทั่วไป ดอกเบี้ยผิดนัดต้องบวกอีก 2%
  - match: 6000
    feedback: คิดดอกเบี้ยเต็มปี แต่ผิดนัดเพียง 73 วัน
  hints:
  - 'แปลงวันเป็นปี: $73/365$'
  - ดอกเบี้ย $=$ หนี้ $\times 0.05 \times$ เวลา (ปี)
  solution: ดอกเบี้ย $= 120{,}000 \times 0.05 \times \dfrac{73}{365} = 1{,}200$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.contracts.p010
  topics:
  - business.law.contracts
  difficulty: 3
  type: mcq
  stem: ร้านขายเสื้อผ้าออนไลน์ของเอมมีรายรับจากการขายปีละประมาณ $2.1$ ล้านบาท ข้อใดถูกต้องเรื่องภาษีมูลค่าเพิ่ม
  choices:
  - id: a
    text: ต้องจดทะเบียนภาษีมูลค่าเพิ่ม เพราะรายรับเกิน 1.8 ล้านบาทต่อปี
    correct: true
  - id: b
    text: ไม่ต้องจด เพราะขายออนไลน์ไม่ต้องเสียภาษี
    feedback: การขายออนไลน์ก็เป็นการประกอบกิจการ ต้องเสียภาษีตามกฎหมายเหมือนหน้าร้าน
  - id: c
    text: ไม่ต้องจด เพราะยังไม่ได้ตั้งบริษัท
    feedback: บุคคลธรรมดาที่รายรับเกินเกณฑ์ก็ต้องจดทะเบียนภาษีมูลค่าเพิ่ม
  - id: d
    text: ต้องจดเฉพาะเมื่อรายรับเกิน 5 ล้านบาท
    feedback: เกณฑ์คือรายรับเกิน 1.8 ล้านบาทต่อปี
  hints:
