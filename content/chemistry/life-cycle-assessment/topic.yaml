id: chemistry.industry.life-cycle-assessment
subject: chemistry
title: { th: การประเมินวัฏจักรชีวิตผลิตภัณฑ์และการรีไซเคิล, en: Life cycle assessment and recycling }
summary: ประเมินผลกระทบต่อสิ่งแวดล้อมทุกขั้นของผลิตภัณฑ์ ตั้งแต่วัตถุดิบ การผลิต การใช้ จนถึงการทิ้ง เปรียบเทียบผลิตภัณฑ์ และตัดสินว่ารีไซเคิลวัสดุใดคุ้มค่า
difficulty: 4
minutes: 35
prerequisites: [chemistry.materials.everyday-materials, chemistry.materials.polymers-ceramics-composites]
encompasses:
  - { id: chemistry.materials.polymers-ceramics-composites, weight: 0.2 }
  - { id: chemistry.materials.everyday-materials, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: lca-stages.svg
    alt: "ผังวัฏจักรชีวิตผลิตภัณฑ์ 5 กล่องเรียงจากซ้ายไปขวาด้วยลูกศร: 1 วัตถุดิบ (ขุดแร่ เจาะน้ำมัน ปลูกพืช) 2 การผลิต (แปรรูป ขึ้นรูป บรรจุ) 3 การขนส่ง 4 การใช้งาน (ล้าง ชาร์จ ซ่อม ใช้ซ้ำ) 5 หมดอายุ (ฝังกลบ เผา หรือรีไซเคิล) ด้านบนมีลูกศรสีน้ำเงินชี้เข้าทุกกล่อง เขียนว่าใช้เข้า พลังงาน น้ำ วัตถุดิบ ด้านล่างมีลูกศรสีแดงชี้ออกจากทุกกล่อง เขียนว่าปล่อยออก แก๊สเรือนกระจก น้ำเสีย ของเสีย และมีเส้นประสีเขียวจากกล่อง 5 วนกลับไปกล่อง 2 เขียนว่ารีไซเคิล วัสดุกลับไปเป็นวัตถุดิบของการผลิต"
    caption: "LCA รวมผลกระทบของทุกขั้น การรีไซเคิลส่งวัสดุกลับไปแทนวัตถุดิบใหม่"
  - { type: check, problem: chemistry.industry.life-cycle-assessment.p003, prompt: "แต่ละกิจกรรมเกิดในช่วงใดของชีวิตผลิตภัณฑ์" }
  - type: worked-example
    title: รวมผลกระทบทุกขั้นแล้วหาขั้นที่สำคัญที่สุด
    problem: "เสื้อยืดฝ้ายหนึ่งตัว (ข้อมูลสมมติ) ปล่อยแก๊สเรือนกระจกขั้นวัตถุดิบ 2.0 kg CO₂e การผลิต 1.5 kg การขนส่ง 0.3 kg การใช้งาน (ซักรีด 50 ครั้ง) 1.2 kg และการทิ้ง 0.1 kg จงหาผลรวมและขั้นที่ควรปรับปรุงก่อน"
    steps:
      - text: "รวมทุกขั้น: $2.0 + 1.5 + 0.3 + 1.2 + 0.1 = 5.1\\,\\mathrm{kg\\,CO_2e}$"
      - text: "ขั้นที่มากที่สุดคือวัตถุดิบ 2.0 kg คิดเป็น $2.0/5.1 \\times 100 \\approx 39\\%$"
        why: "การปรับปรุงขั้นที่ใหญ่ที่สุดลดผลรวมได้มากที่สุด"
      - text: "แนวทาง เช่น ใช้ฝ้ายที่ปลูกโดยใช้ปุ๋ยน้อยลง หรือผ้าจากเส้นใยรีไซเคิล และใส่เสื้อให้นานขึ้น ส่วนขั้นใช้งานลดได้ด้วยการซักน้ำเย็นและตากแดดแทนเครื่องอบผ้า"
    answer: "รวม 5.1 kg CO₂e ขั้นวัตถุดิบมีผลมากที่สุด (ราว 39%)"
  - type: worked-example
    title: แก้วใช้ซ้ำต้องใช้กี่ครั้งจึงคุ้ม
    problem: "แก้วเซรามิกปล่อยแก๊สเรือนกระจกตอนผลิตและทิ้งรวม 1,000 g CO₂e และการล้างแต่ละครั้งปล่อย 10 g ส่วนแก้วกระดาษใช้ครั้งเดียวปล่อย 30 g ต่อใบ (ข้อมูลสมมติ) ต้องใช้แก้วเซรามิกอย่างน้อยกี่ครั้งจึงปล่อยน้อยกว่าแก้วกระดาษ"
    steps:
      - text: "ใช้หน่วยหน้าที่เดียวกัน: ดื่มกาแฟ $n$ ครั้ง"
      - text: "แก้วเซรามิก: $1000 + 10n$ · แก้วกระดาษ: $30n$"
        why: "ผลกระทบตอนผลิตเกิดครั้งเดียว แต่การล้างเกิดทุกครั้ง"
      - text: "จุดคุ้มทุน: $1000 + 10n = 30n$ ได้ $20n = 1000$ และ $n = 50$"
      - text: "ใช้มากกว่า 50 ครั้ง แก้วเซรามิกจะปล่อยน้อยกว่า"
    answer: "ต้องใช้มากกว่า 50 ครั้ง"
  - { type: check, problem: chemistry.industry.life-cycle-assessment.p005, prompt: "ผลกระทบตอนผลิตถุงผ้าเกิดครั้งเดียว" }
glossary:
  - { term: การประเมินวัฏจักรชีวิต (LCA), definition: การประเมินผลกระทบต่อสิ่งแวดล้อมของผลิตภัณฑ์ตลอดทุกขั้น ตั้งแต่ได้วัตถุดิบจนหมดอายุ }
  - { term: คาร์บอนฟุตพรินต์, definition: ปริมาณแก๊สเรือนกระจกทั้งหมดที่ปล่อย คิดเทียบเป็นคาร์บอนไดออกไซด์ (CO₂e) }
  - { term: หน่วยหน้าที่, definition: หน้าที่ที่ใช้เป็นฐานเปรียบเทียบผลิตภัณฑ์ เช่น บรรจุน้ำ 1 ลิตร หรือใช้ 1 ครั้ง }
  - { term: จุดคุ้มทุนของการใช้ซ้ำ, definition: จำนวนครั้งที่ต้องใช้ของใช้ซ้ำให้ผลกระทบรวมเท่ากับของใช้ครั้งเดียว }
  - { term: การรีไซเคิล, definition: การนำวัสดุที่ใช้แล้วไปแปรรูปเป็นวัตถุดิบสำหรับผลิตของใหม่ }
flashcards:
  - { front: "ขั้นของวัฏจักรชีวิตผลิตภัณฑ์", back: "วัตถุดิบ → การผลิต → การขนส่ง → การใช้งาน → การจัดการเมื่อหมดอายุ" }
  - { front: "หน่วยหน้าที่คืออะไร", back: "หน้าที่ที่ใช้เทียบผลิตภัณฑ์ให้ยุติธรรม เช่น ต่อลิตร หรือต่อการใช้ 1 ครั้ง" }
  - { front: "วัสดุที่รีไซเคิลคุ้มที่สุด", back: "อะลูมิเนียม ใช้พลังงานราว 5% ของการผลิตจากแร่ และคุณภาพไม่ลด" }
  - { front: "ข้อจำกัดของ LCA", back: "ผลกระทบบางอย่างวัดเป็นตัวเลขยาก ข้อมูลขึ้นกับสมมติฐาน และอาจรายงานไม่ครบเพื่อโฆษณา" }
