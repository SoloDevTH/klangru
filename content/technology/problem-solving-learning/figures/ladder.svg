<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" width="760" height="530" font-family="sans-serif">
<title>ผังถามทำไมห้าครั้งเรื่องผักเหี่ยว</title>
<rect width="760" height="530" fill="#ffffff"/>
<text x="380.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">ถามทำไมซ้ำ ๆ จนถึงต้นเหตุ</text>
<rect x="150" y="50" width="460" height="50" rx="10" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="136" y="80.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111827">ปัญหา</text>
<text x="164" y="80.0" font-size="14" fill="#111827">ผักกวางตุ้งที่ซื้อมาเหี่ยวภายใน 2 วัน</text>
<line x1="380.0" y1="100" x2="380.0" y2="118" stroke="#334155" stroke-width="2.5"/>
<polygon points="380.0,126 374.0,116 386.0,116" fill="#334155"/>
<rect x="150" y="126" width="460" height="50" rx="10" fill="#e0f2fe" stroke="#334155" stroke-width="2"/>
<text x="136" y="156.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111827">ทำไม 1</text>
<text x="164" y="156.0" font-size="14" fill="#111827">ใบผักเสียน้ำออกทางใบเร็วกว่าปกติ</text>
<line x1="380.0" y1="176" x2="380.0" y2="194" stroke="#334155" stroke-width="2.5"/>
<polygon points="380.0,202 374.0,192 386.0,192" fill="#334155"/>
<rect x="150" y="202" width="460" height="50" rx="10" fill="#e0f2fe" stroke="#334155" stroke-width="2"/>
<text x="136" y="232.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111827">ทำไม 2</text>
<text x="164" y="232.0" font-size="14" fill="#111827">วางผักใกล้ช่องที่มีลมเย็นเป่าโดนตรง และไม่ได้ห่อให้ชื้น</text>
<line x1="380.0" y1="252" x2="380.0" y2="270" stroke="#334155" stroke-width="2.5"/>
<polygon points="380.0,278 374.0,268 386.0,268" fill="#334155"/>
<rect x="150" y="278" width="460" height="50" rx="10" fill="#e0f2fe" stroke="#334155" stroke-width="2"/>
<text x="136" y="308.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111827">ทำไม 3</text>
<text x="164" y="308.0" font-size="14" fill="#111827">ไม่เคยรู้ว่าช่องไหนของตู้เย็นมีลมเป่าแรง</text>
<line x1="380.0" y1="328" x2="380.0" y2="346" stroke="#334155" stroke-width="2.5"/>
<polygon points="380.0,354 374.0,344 386.0,344" fill="#334155"/>
<rect x="150" y="354" width="460" height="50" rx="10" fill="#e0f2fe" stroke="#334155" stroke-width="2"/>
<text x="136" y="384.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111827">ทำไม 4</text>
<text x="164" y="384.0" font-size="14" fill="#111827">ยังไม่เคยอ่านคู่มือตู้เย็นหรือถามผู้รู้เรื่องการเก็บผัก</text>
<line x1="380.0" y1="404" x2="380.0" y2="422" stroke="#334155" stroke-width="2.5"/>
<polygon points="380.0,430 374.0,420 386.0,420" fill="#334155"/>
<rect x="150" y="430" width="460" height="50" rx="10" fill="#dcfce7" stroke="#334155" stroke-width="2"/>
<text x="136" y="460.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111827">ต้นเหตุ</text>
<text x="164" y="460.0" font-size="14" fill="#111827">ขาดความรู้ จึงต้องทดลองวางผักในช่องอื่นและบันทึกผล</text>
<text x="380.0" y="516" text-anchor="middle" font-size="14" fill="#374151">ทำแต่ละครั้งด้วยคำถามว่า "ทำไม" จนได้สิ่งที่แก้ได้จริง</text>
</svg>
