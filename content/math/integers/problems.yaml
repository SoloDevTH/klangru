      - { match: -22, feedback: "$-18 - 4 = -22$ คือลบกลับด้าน โจทย์ถามว่าอุ่นกว่ากี่องศา จึงตอบเป็นขนาดของผลต่าง" }
    solution: "$4 - (-18) = 4 + 18 = 22$ องศาเซลเซียส (จาก $-18$ ขึ้นมาถึง 0 ได้ 18 องศา และจาก 0 ถึง 4 อีก 4 องศา)"
