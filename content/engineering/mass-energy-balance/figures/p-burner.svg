<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="sans-serif" font-size="14">
<title>เตาเผาไบโอแก๊ส</title>
<rect x="0" y="0" width="700" height="300" fill="#ffffff"/>
<rect x="270.0" y="90.0" width="170.0" height="120.0" rx="8" fill="#fff4e0" stroke="#15211e" stroke-width="2.5"/>
<text x="355.0" y="156.0" text-anchor="middle" fill="#15211e" font-size="16" font-weight="bold">เตาเผา</text>
<line x1="40.0" y1="120.0" x2="254.8" y2="120.0" stroke="#15211e" stroke-width="2.5"/>
<polygon points="265.0,120.0 253.0,114.6 253.0,125.4" fill="#15211e" stroke="#15211e" stroke-width="1" stroke-linejoin="round"/>
<text x="48.0" y="98.0" text-anchor="start" fill="#15211e" font-size="14">ไบโอแก๊ส 100 mol/h</text>
<text x="48.0" y="145.0" text-anchor="start" fill="#15211e" font-size="13">CH₄ 60%, CO₂ 40% โดยโมล</text>
<line x1="40.0" y1="190.0" x2="254.8" y2="190.0" stroke="#15211e" stroke-width="2.5"/>
<polygon points="265.0,190.0 253.0,184.6 253.0,195.4" fill="#15211e" stroke="#15211e" stroke-width="1" stroke-linejoin="round"/>
<text x="48.0" y="178.0" text-anchor="start" fill="#15211e" font-size="14">อากาศ (O₂ 21%, N₂ 79%)</text>
<text x="48.0" y="215.0" text-anchor="start" fill="#15211e" font-size="13">มากเกินพอ 20%</text>
<line x1="445.0" y1="150.0" x2="649.8" y2="150.0" stroke="#15211e" stroke-width="2.5"/>
<polygon points="660.0,150.0 648.0,144.6 648.0,155.4" fill="#15211e" stroke="#15211e" stroke-width="1" stroke-linejoin="round"/>
<text x="455.0" y="128.0" text-anchor="start" fill="#15211e" font-size="14">แก๊สไอเสีย</text>
<text x="455.0" y="176.0" text-anchor="start" fill="#15211e" font-size="13">CO₂, H₂O, O₂, N₂</text>
<text x="350.0" y="270.0" text-anchor="middle" fill="#15211e" font-size="14">CH₄ + 2O₂ → CO₂ + 2H₂O (เผาไหม้สมบูรณ์)</text>
</svg>
