  - id: b
    text: Moving on to my third point, ...
    correct: true
    feedback: ถูก บอกผู้ฟังว่าจบประเด็นที่สองและกำลังเริ่มประเด็นที่สาม
  - id: c
    text: To sum up, ...
    feedback: ใช้ตอนสรุปปิด ไม่ควรใช้ตอนที่ยังมีประเด็นเหลือ
