      - { id: b, text: "$2^{30}$ มากกว่า เพราะเลขชี้กำลังมากกว่า", feedback: "เทียบเลขชี้กำลังได้เมื่อฐานเท่ากันเท่านั้น ลองเขียนให้เลขชี้กำลังเท่ากัน: $2^{30} = 8^{10}$ และ $3^{20} = 9^{10}$" }
      - { id: c, text: "เท่ากัน เพราะ $2 \\times 30 = 3 \\times 20$", feedback: "เลขยกกำลังไม่ได้มีค่าเท่ากับฐานคูณเลขชี้กำลัง $2^{30} = 8^{10}$ น้อยกว่า $3^{20} = 9^{10}$" }
    hints:
      - "ฐานต่างกันและเลขชี้กำลังต่างกัน ลองทำให้เลขชี้กำลังเท่ากัน"
      - "$2^{30} = (2^3)^{10}$ และ $3^{20} = (3^2)^{10}$"
    solution: "$2^{30} = (2^3)^{10} = 8^{10}$ และ $3^{20} = (3^2)^{10} = 9^{10}$ เลขชี้กำลังเท่ากันที่ 10 และ $9 > 8$ จึงได้ $3^{20} > 2^{30}$ (จริง ๆ แล้ว $3^{20} \\approx 3.49 \\times 10^9$ และ $2^{30} \\approx 1.07 \\times 10^9$)"
