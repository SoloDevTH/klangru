id: physics.light.light-shadows
subject: physics
title: { th: แสง การมองเห็น และเงา, en: "Light, seeing and shadows" }
summary: แหล่งกำเนิดแสง แสงเดินทางเป็นเส้นตรง การมองเห็นเมื่อแสงเข้าตา การถนอมดวงตา วัตถุโปร่งใส โปร่งแสง ทึบแสง และการเกิดเงามืดเงามัว
difficulty: 1.5
minutes: 25
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - type: figure
    title: เรามองเห็นได้อย่างไร
    src: seeing.svg
    alt: "ดวงอาทิตย์ซึ่งเป็นแหล่งกำเนิดแสงอยู่ซ้ายบน ลูกศรเส้นตรงที่หนึ่งจากดวงอาทิตย์ลงมาถึงดอกไม้ มีป้ายว่า แสงเดินทางเป็นเส้นตรง ลูกศรเส้นที่สองจากดอกไม้ไปยังตาทางขวา มีป้ายว่า แสงสะท้อนเข้าตา ไม่มีลูกศรออกจากตา"
    caption: "ลูกศรออกจากแหล่งกำเนิดแสงและเข้าสู่ตาเสมอ ตาไม่ได้ส่งแสงออกไป"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: อธิบายว่าทำไมมองเห็นหนังสือบนโต๊ะ
    problem: "ตอนกลางคืน เปิดไฟในห้องแล้วมองเห็นหนังสือบนโต๊ะ แต่เมื่อปิดไฟจนห้องมืดสนิทกลับมองไม่เห็น อธิบายด้วยทางเดินของแสง"
    steps:
      - text: "หาแหล่งกำเนิดแสง: หลอดไฟที่เปิดอยู่ให้แสงออกมา หนังสือไม่ได้ให้แสงเอง"
      - text: "แสงจากหลอดไฟเดินทางเป็นเส้นตรงไปกระทบหนังสือ"
      - text: "แสงสะท้อนจากหนังสือเดินทางเข้าตา เราจึงมองเห็นหนังสือ"
        why: "เรามองเห็นวัตถุเมื่อแสงจากวัตถุเข้าตา ตาเป็นตัวรับแสง ไม่ได้ส่งแสง"
      - text: "เมื่อปิดไฟ ไม่มีแสงไปกระทบหนังสือ จึงไม่มีแสงสะท้อนเข้าตา เรามองไม่เห็น"
        why: "ความมืดคือการไม่มีแสง"
    answer: "มองเห็นเพราะแสงจากหลอดไฟสะท้อนจากหนังสือเข้าตา เมื่อไม่มีแสงก็ไม่มีอะไรเข้าตา"
  - { type: check, problem: physics.light.light-shadows.p002, prompt: "ลองคิดก่อนอ่านต่อ" }
  - type: figure
    title: แผนภาพรังสีของเงามืดและเงามัว
    src: umbra-penumbra.svg
    alt: "สองภาพซ้อนกัน ภาพบน แหล่งกำเนิดแสงเป็นจุดเล็กทางซ้าย มีวัตถุทึบแสงแนวตั้งอยู่ตรงกลาง เส้นตรงสองเส้นจากจุดแสงผ่านขอบบนและขอบล่างของวัตถุไปถึงฉากทางขวา บริเวณระหว่างสองเส้นหลังวัตถุเป็นเงามืดสีเทาเข้ม ขอบคม ภาพล่าง แหล่งกำเนิดแสงเป็นหลอดไฟยาวแนวตั้ง ลากเส้นตรงสี่เส้นจากปลายบนและปลายล่างของหลอดไฟผ่านขอบของวัตถุ เส้นที่ไม่ไขว้กันล้อมเงามืดสีเทาเข้มตรงกลาง เส้นที่ไขว้กันล้อมบริเวณเงามัวสีเทาอ่อนด้านบนและด้านล่างของเงามืด"
    caption: "แหล่งกำเนิดแสงจุดให้แต่เงามืด แหล่งกำเนิดแสงขนาดใหญ่ให้เงามืดตรงกลางและเงามัวรอบนอก"
  - type: worked-example
    title: ขนาดเงาหนังตะลุง
    problem: "รูปหนังตะลุงสูง 30 cm อยู่ห่างดวงไฟ 1 m และจอผ้าอยู่ห่างดวงไฟ 3 m ถ้าถือว่าดวงไฟเล็กมาก เงาบนจอสูงเท่าใด และถ้าอยากให้เงาใหญ่ขึ้นต้องทำอย่างไร"
    steps:
      - text: "แสงเดินทางเป็นเส้นตรงจากดวงไฟผ่านขอบบนและขอบล่างของรูปหนัง ถ่างออกไปถึงจอ"
      - text: "จออยู่ไกลจากดวงไฟเป็น 3 ÷ 1 = 3 เท่าของระยะถึงรูปหนัง"
        why: "เส้นตรงที่ถ่างออกจากจุดเดียวกัน ระยะห่างระหว่างเส้นเพิ่มตามระยะทางจากจุดนั้น"
      - text: "เงาจึงสูง 30 × 3 = 90 cm"
      - text: "ถ้าเลื่อนรูปหนังเข้าใกล้ดวงไฟ เช่น ห่าง 0.5 m จอจะไกลเป็น 6 เท่า เงาจะสูง 180 cm"
    answer: "เงาสูง 90 cm ถ้าอยากให้เงาใหญ่ขึ้นให้เลื่อนรูปหนังเข้าหาดวงไฟ"
  - { type: check, problem: physics.light.light-shadows.p009, prompt: "ใช้แบบรูปของขนาดเงาตอบ" }
glossary:
  - { term: แหล่งกำเนิดแสง, definition: "สิ่งที่ให้แสงออกมาเอง เช่น ดวงอาทิตย์ หลอดไฟที่เปิดอยู่ เปลวเทียน หิ่งห้อย" }
  - { term: รังสีของแสง, definition: "เส้นตรงมีหัวลูกศรที่ใช้แทนทางเดินของแสง" }
  - { term: ตัวกลางโปร่งใส, definition: "วัตถุที่แสงผ่านได้เกือบหมด มองผ่านเห็นชัด เช่น กระจกใส น้ำใส" }
  - { term: ตัวกลางโปร่งแสง, definition: "วัตถุที่แสงผ่านได้บางส่วน มองผ่านเห็นไม่ชัด เช่น กระดาษไข กระจกฝ้า" }
  - { term: วัตถุทึบแสง, definition: "วัตถุที่แสงผ่านไม่ได้ ทำให้เกิดเงา เช่น แผ่นไม้ ผนังปูน" }
  - { term: เงามืด, definition: "บริเวณหลังวัตถุทึบแสงที่แสงจากแหล่งกำเนิดแสงไปไม่ถึงเลย" }
  - { term: เงามัว, definition: "บริเวณรอบเงามืดที่แสงจากบางส่วนของแหล่งกำเนิดแสงไปถึงได้ จึงมืดไม่สนิท" }
flashcards:
  - { front: "เรามองเห็นวัตถุได้อย่างไร", back: "แสงจากวัตถุ (ที่ให้แสงเองหรือสะท้อนแสง) เดินทางเข้าสู่ตา" }
  - { front: "ดวงจันทร์เป็นแหล่งกำเนิดแสงหรือไม่", back: "ไม่ใช่ ดวงจันทร์สะท้อนแสงจากดวงอาทิตย์" }
  - { front: "ทำไมเงามีรูปร่างเหมือนวัตถุ", back: "เพราะแสงเดินทางเป็นเส้นตรง แสงที่ผ่านขอบวัตถุจึงวาดโครงร่างของวัตถุบนฉาก" }
  - { front: "อยากให้เงาใหญ่ขึ้นต้องทำอย่างไร", back: "เลื่อนวัตถุเข้าใกล้ดวงไฟ" }
  - { front: "เงามืดกับเงามัวต่างกันอย่างไร", back: "เงามืดไม่ได้รับแสงเลย เงามัวได้รับแสงจากบางส่วนของแหล่งกำเนิดแสง" }
