id: math.number.fractions
subject: math
title: { th: เศษส่วน, en: Fractions }
summary: เข้าใจเศษส่วนเป็นส่วนแบ่งที่เท่ากัน ทำให้เป็นเศษส่วนอย่างต่ำ บวก ลบ คูณ หารเศษส่วน และแปลงระหว่างเศษส่วนกับทศนิยม
difficulty: 2
minutes: 35
prerequisites: [math.number.integers]
encompasses:
  - { id: math.number.integers, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: simulation
    title: แบ่งพิซซ่าและแท่งช็อกโกแลต (PhET Fractions Intro)
    url: https://phet.colorado.edu/en/simulations/fractions-intro
    provider: phet
    note: ลองเปลี่ยนตัวส่วนเป็น 2, 3, 4 แล้วสังเกตว่าชิ้นเล็กลงเรื่อย ๆ ขณะที่ตัวเศษบอกจำนวนชิ้นที่หยิบมา
glossary:
  - { term: "ตัวเศษ", definition: "ตัวเลขด้านบนของเศษส่วน บอกว่าหยิบมากี่ส่วน" }
  - { term: "ตัวส่วน", definition: "ตัวเลขด้านล่างของเศษส่วน บอกว่าแบ่งทั้งหมดออกเป็นกี่ส่วนเท่า ๆ กัน (ห้ามเป็น 0)" }
  - { term: "เศษส่วนอย่างต่ำ", definition: "เศษส่วนที่ตัวเศษและตัวส่วนไม่มีตัวประกอบร่วมนอกจาก 1 เช่น $\\tfrac{2}{3}$" }
  - { term: "ส่วนกลับ", definition: "เศษส่วนที่สลับตัวเศษกับตัวส่วน เช่น ส่วนกลับของ $\\tfrac{3}{4}$ คือ $\\tfrac{4}{3}$" }
flashcards:
  - { front: "บวกเศษส่วนที่ตัวส่วนไม่เท่ากันอย่างไร", back: "ทำตัวส่วนให้เท่ากันก่อน (ใช้ ค.ร.น.) แล้วบวกเฉพาะตัวเศษ เช่น $\\tfrac{1}{2} + \\tfrac{1}{3} = \\tfrac{3}{6} + \\tfrac{2}{6} = \\tfrac{5}{6}$" }
  - { front: "หารเศษส่วนอย่างไร", back: "คูณด้วยส่วนกลับของตัวหาร เช่น $\\tfrac{3}{4} \\div \\tfrac{1}{2} = \\tfrac{3}{4} \\times \\tfrac{2}{1} = \\tfrac{3}{2}$" }
  - { front: "ทำ $\\tfrac{12}{18}$ ให้เป็นเศษส่วนอย่างต่ำ", back: "หารทั้งเศษและส่วนด้วย ห.ร.ม. คือ 6 ได้ $\\tfrac{2}{3}$" }
  - { front: "$0.75$ เป็นเศษส่วนอย่างต่ำคืออะไร", back: "$0.75 = \\tfrac{75}{100}$ หารด้วย 25 ทั้งเศษและส่วน ได้ $\\tfrac{3}{4}$" }
