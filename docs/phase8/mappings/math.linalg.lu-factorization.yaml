  - { framework: university-foundations, indicators: ["MIT18.06 4"], coverage: full, note: "การกำจัดแบบเกาส์เป็น A = LU และ A = LDU พร้อมตัวอย่างการคำนวณตัวคูณและพิวอต" }
  - { framework: university-foundations, indicators: ["MIT18.06 5"], coverage: full, note: "ทรานสโพส (AB)^T = B^T A^T เมทริกซ์สมมาตร และเมทริกซ์การเรียงสับเปลี่ยน P ที่ใช้กับ PA = LU" }
  - { framework: university-foundations, indicators: ["MIT18.06 8"], coverage: full, note: "PA = LU สำหรับเมทริกซ์ m×n (U เป็นรูปขั้นบันได แรงก์คือจำนวนพิวอต) พร้อมตัวอย่างเมทริกซ์ 2×3 ผลเฉลยทั้งหมด x = x_p + x_n จำนวนตัวแปรอิสระ n − r และสี่กรณีของแรงก์" }
  - { framework: university-foundations, indicators: ["MIT18.06 38"], coverage: partial, note: "การเลือกพิวอตบางส่วน การขยายข้อผิดพลาดจากตัวคูณใหญ่ และเลขเงื่อนไข κ = ‖A‖‖A⁻¹‖ เชิงแนวคิดพร้อมตัวอย่างระบบที่ไวต่อข้อผิดพลาด ยังไม่มีการคำนวณนอร์ม การวิเคราะห์ข้อผิดพลาดย้อนหลัง และวิธีทำซ้ำ" }
  - { framework: university-foundations, indicators: ["MIT18.06 39"], coverage: partial, note: "มีต้นทุนการคำนวณ n^3/3 เทียบกับ n^2 ของการแทนค่า และการใช้ LU ซ้ำกับหลายระบบ ส่วนที่เหลือของคาบ (ภาพรวมการคำนวณทางวิทยาศาสตร์และการใช้ซอฟต์แวร์กับระบบขนาดใหญ่) ไม่ใช่เนื้อหาเดี่ยวที่สอนได้ในบทเรียน" }
