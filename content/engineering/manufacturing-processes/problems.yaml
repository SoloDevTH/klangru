    solution: N = 1000 × 120 ÷ (π × 80) = 120,000 ÷ 251.3 ≈ 477.5 รอบต่อนาที ถ้าตั้งความเร็วรอบต่ำเกินไปจะตัดช้าและเปลืองเวลา
