id: physics.dynamics.weight-normal
subject: physics
title: { th: น้ำหนักและแรงปฏิกิริยาตั้งฉาก, en: Weight and normal force }
summary: แยกมวลกับน้ำหนัก คำนวณน้ำหนักจากมวลและความเร่งโน้มถ่วง หาแรงปฏิกิริยาตั้งฉากจากพื้น และอธิบายว่าทำไมตาชั่งในลิฟต์อ่านค่าเปลี่ยนไป
difficulty: 4
minutes: 35
prerequisites: [physics.dynamics.newton-second]
encompasses:
  - { id: physics.dynamics.newton-second, weight: 0.5 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: weight-toward-centre.svg
    alt: "โลกเป็นวงกลม มีคนยืนอยู่หกตำแหน่งรอบโลก รวมทั้งที่ประเทศไทยด้านบนและอีกฟากโลกด้านล่าง ลูกศรสีแดงแทนน้ำหนักของแต่ละคน ทุกลูกศรชี้เข้าหาจุดศูนย์กลางโลก"
    caption: "น้ำหนักชี้เข้าหาศูนย์กลางโลกเสมอ คำว่า \"ลง\" ของคนแต่ละที่บนโลกจึงไม่ใช่ทิศเดียวกัน"
  - type: worked-example
    title: ชั่งน้ำหนักบนดาวอังคาร
    problem: "ก้อนหินมวล $2.5\\ \\mathrm{kg}$ ชั่งด้วยเครื่องชั่งสปริงบนโลกและบนดาวอังคาร ($g = 3.7\\ \\mathrm{N/kg}$) เครื่องชั่งอ่านได้เท่าใดในแต่ละที่ และมวลของก้อนหินเปลี่ยนหรือไม่ (บนโลกใช้ $g = 9.8\\ \\mathrm{N/kg}$)"
    steps:
      - text: "เครื่องชั่งสปริงวัดแรงที่สปริงต้องดึงไว้ ซึ่งเท่ากับน้ำหนัก $W = mg$"
        why: "ก้อนหินนิ่ง แรงดึงของสปริงจึงเท่ากับน้ำหนักพอดี"
      - text: "บนโลก: $W = 2.5 \\times 9.8 = 24.5\\ \\mathrm{N}$"
      - text: "บนดาวอังคาร: $W = 2.5 \\times 3.7 = 9.25\\ \\mathrm{N}$"
      - text: "มวลยังเป็น $2.5\\ \\mathrm{kg}$ เท่าเดิม เพราะเนื้อสารของก้อนหินไม่ได้เปลี่ยน"
        why: "หน่วย $\\mathrm{N/kg}$ บอกว่ามวล $1\\ \\mathrm{kg}$ ถูกดึงด้วยแรงกี่นิวตัน ค่านี้ต่างกันในแต่ละดาว"
    answer: "บนโลก $24.5\\ \\mathrm{N}$ บนดาวอังคาร $9.25\\ \\mathrm{N}$ มวลเท่าเดิม $2.5\\ \\mathrm{kg}$"
  - { type: check, problem: phy.wn.p014, prompt: "ลองอ่านเครื่องชั่งสปริง" }
  - type: figure
    src: fbd-normal.svg
    alt: "แผนภาพแรงสามกรณี ความยาวลูกศรเป็นสัดส่วนกับขนาดแรง (1) หนังสือ 2 kg วางนิ่ง: น้ำหนัก W = 19.6 N ชี้ลง แรงปฏิกิริยาตั้งฉาก N = 19.6 N ชี้ขึ้น ยาวเท่ากัน (2) กล่อง 4 kg มีมือกดลง F = 10 N: W = 39.2 N ชี้ลง N = 49.2 N ชี้ขึ้น ยาวกว่า W (3) ถัง 5 kg ถูกดึงขึ้นด้วยแรง T = 15 N แต่ยังไม่ลอย: W = 49 N ชี้ลง N = 34 N และ T = 15 N ชี้ขึ้น"
    caption: "ในทุกกรณีวัตถุนิ่ง แรงขึ้นรวมเท่ากับแรงลงรวม $N$ จึงไม่เท่ากับ $mg$ เสมอไป"
  - type: worked-example
    title: ลิฟต์กำลังจะหยุดขณะลง
    problem: "เด็กมวล $45\\ \\mathrm{kg}$ ยืนบนตาชั่งในลิฟต์ที่กำลังลง ลิฟต์ชะลอความเร็วเพื่อหยุดที่ชั้นล่างด้วยความเร่งขนาด $0.8\\ \\mathrm{m/s^2}$ ตาชั่งอ่านได้เท่าใด"
    steps:
      - text: "วาดแผนภาพแรงของเด็ก: น้ำหนัก $mg$ ชี้ลง และแรงจากตาชั่ง $N$ ชี้ขึ้น"
      - text: "หาทิศของความเร่ง: ลิฟต์เคลื่อนที่ลงแต่กำลังช้าลง ความเร่งจึงมีทิศ **ขึ้น** $a = +0.8\\ \\mathrm{m/s^2}$ (ให้ทิศขึ้นเป็นบวก)"
        why: "เมื่อวัตถุช้าลง ความเร่งมีทิศตรงข้ามกับความเร็ว ความเร็วชี้ลง ความเร่งจึงชี้ขึ้น"
      - text: "กฎข้อที่ 2: $N - mg = ma$ จึงได้ $N = m(g + a) = 45(9.8 + 0.8)$"
      - text: "$N = 45 \\times 10.6 = 477\\ \\mathrm{N}$ มากกว่าน้ำหนักจริง $441\\ \\mathrm{N}$"
    answer: "ตาชั่งอ่านได้ $477\\ \\mathrm{N}$ เด็กจึงรู้สึกตัวหนักขึ้นตอนลิฟต์กำลังจะหยุดที่ชั้นล่าง"
  - { type: check, problem: phy.wn.p017 }
  - type: interactive
    title: ตาชั่งในลิฟต์อ่านได้เท่าใด
    caption: แกนนอนคือความเร่งของลิฟต์ (m/s²) ค่าบวกคือเร่งขึ้น ค่าลบคือเร่งลง แกนตั้งคือแรงที่ตาชั่งดันเท้า (N) จาก N = m(g + a) เมื่อ g = 9.8 m/s² สังเกตว่าที่ a = 0 ตาชั่งอ่านได้เท่ากับน้ำหนัก mg และที่ a = −9.8 (ลิฟต์ตกอิสระ) ตาชั่งอ่านได้ศูนย์
    widget:
      kind: function-plot
      functions: ["(9.8 + x) m"]
      sliders:
        - { name: m, min: 20, max: 100, step: 5, value: 50, label: มวลของคน (kg) }
      x: [-10, 5]
      y: [0, 1500]
glossary:
  - { term: มวล, definition: "ปริมาณเนื้อสารและความเฉื่อยของวัตถุ หน่วยกิโลกรัม ($\\mathrm{kg}$) มีค่าเท่าเดิมไม่ว่าวัตถุอยู่ที่ใด" }
  - { term: น้ำหนัก, definition: "แรงที่โลก (หรือดาวดวงอื่น) ดึงดูดวัตถุ $W = mg$ หน่วยนิวตัน ($\\mathrm{N}$) มีทิศเข้าหาศูนย์กลางของดาว" }
  - { term: แรงปฏิกิริยาตั้งฉาก, definition: "แรงที่ผิวสัมผัสดันวัตถุในทิศตั้งฉากกับผิว เขียนแทนด้วย $N$ มีขนาดเท่าที่จำเป็นเพื่อไม่ให้วัตถุจมเข้าไปในผิว" }
  - { term: น้ำหนักปรากฏ, definition: "ค่าที่ตาชั่งอ่านได้ ซึ่งเท่ากับแรงปฏิกิริยาตั้งฉากที่ตาชั่งดันเรา อาจมากหรือน้อยกว่าน้ำหนักจริงเมื่อมีความเร่งในแนวดิ่ง" }
flashcards:
  - { front: "มวล $60\\ \\mathrm{kg}$ มีน้ำหนักบนโลกเท่าใด ($g = 9.8\\ \\mathrm{m/s^2}$)", back: "$W = mg = 60 \\times 9.8 = 588\\ \\mathrm{N}$" }
  - { front: "ไปดวงจันทร์แล้ว มวลหรือน้ำหนักที่เปลี่ยน", back: "น้ำหนักเปลี่ยน (เพราะ $g$ ต่างกัน) มวลเท่าเดิม" }
  - { front: "แรงปฏิกิริยาตั้งฉากในลิฟต์ที่มีความเร่ง $a$ ทิศขึ้น", back: "$N = m(g + a)$ ถ้าเร่งลงด้วยขนาด $a$ จะได้ $N = m(g - a)$" }
  - { front: "ลิฟต์เคลื่อนที่ขึ้นด้วยความเร็วคงตัว ตาชั่งอ่านค่ามากกว่าน้ำหนักหรือไม่", back: "ไม่ ความเร่งเป็นศูนย์ จึงอ่านได้เท่ากับน้ำหนัก $mg$ พอดี" }
