  - id: computer.society.computing-careers-history.p016
    topics: [computer.society.computing-careers-history]
    difficulty: 4
    type: numeric
    stem: "สมมติว่าศูนย์รีไซเคิลแห่งหนึ่งรับขยะอิเล็กทรอนิกส์ 240 กิโลกรัมในเดือนแรก เดือนที่สองรับเพิ่มขึ้น 25 เปอร์เซ็นต์จากเดือนแรก และเดือนที่สามรับลดลง 10 เปอร์เซ็นต์จากเดือนที่สอง เดือนที่สามรับขยะกี่กิโลกรัม"
    answer: { value: 270, tolerance: 0, unit: "กิโลกรัม" }
    hints:
      - "คำนวณเดือนที่สองก่อนจากเดือนแรกที่เพิ่มขึ้น 25 เปอร์เซ็นต์"
      - "เดือนที่สามคำนวณจากค่าของเดือนที่สอง ไม่ใช่จากเดือนแรก"
    solution: "เดือนที่สอง 240 × 1.25 = 300 กิโลกรัม เดือนที่สาม 300 × 0.90 = 270 กิโลกรัม"
    misconceptions:
      - { match: 300, feedback: "300 คือเดือนที่สอง ยังไม่ได้ลดลง 10 เปอร์เซ็นต์สำหรับเดือนที่สาม" }
      - { match: 264, feedback: "264 เกิดจากการคิดว่าเดือนที่สามเพิ่มขึ้น 10 เปอร์เซ็นต์จากเดือนแรก แทนการลด" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-careers-history.p017
    topics: [computer.society.computing-careers-history]
    difficulty: 4
    type: mcq
    stem: "ครูต้องการคอมพิวเตอร์สำหรับพิมพ์เอกสารและเรียนออนไลน์ ควรเลือกโดยดูอะไรเป็นอันดับแรก"
    choices:
      - { id: a, text: "ความต้องการของผู้ใช้และข้อกำหนดขั้นต่ำที่งานต้องการ", correct: true }
      - { id: b, text: "สีของเครื่อง", feedback: "สีไม่ได้ช่วยให้งานพิมพ์และเรียนออนไลน์ทำได้ดีขึ้น" }
      - { id: c, text: "เครื่องที่แพงที่สุดในร้าน", feedback: "ราคาสูงไม่ได้บอกว่าเหมาะกับงานที่ต้องทำ" }
      - { id: d, text: "รุ่นที่เพิ่งออกใหม่ที่สุดเท่านั้น", feedback: "รุ่นใหม่ไม่ได้หมายความว่าเหมาะกับงาน และการเปลี่ยนบ่อยทำให้เกิดขยะ" }
    hints:
      - "เริ่มจากถามว่างานที่จะทำต้องการอะไรขั้นต่ำ"
      - "คนที่ใช้งานคือใคร และต้องการทำอะไรเป็นหลัก"
    solution: "การเลือกเครื่องควรเริ่มจากความต้องการของผู้ใช้และข้อกำหนดขั้นต่ำของงาน แล้วจึงดูผลต่อราคาและสิ่งแวดล้อมประกอบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-careers-history.p018
    topics: [computer.society.computing-careers-history]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "ถ้าต้องการเตรียมตัวทำงานด้านคอมพิวเตอร์ในอนาคต ข้อใดเหมาะสม (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "เรียนรู้การตั้งคำถามและแก้ปัญหาทีละขั้น", correct: true }
      - { id: b, text: "ฝึกทำงานกับคนที่คิดต่างจากตนเอง", correct: true }
      - { id: c, text: "เรียนรู้ทักษะใหม่ต่อเนื่องเมื่อเทคโนโลยีเปลี่ยน", correct: true }
      - { id: d, text: "เชื่อว่าความรู้ที่เรียนครั้งเดียวจะใช้ได้ตลอดชีวิต", feedback: "เทคโนโลยีเปลี่ยนเร็ว ความรู้จึงต้องอัปเดตอยู่เสมอ" }
    hints:
      - "คิดถึงทักษะที่ใช้ได้ไม่ว่าเทคโนโลยีใหม่จะเป็นอะไร"
      - "งานคอมพิวเตอร์สมัยใหม่มักทำเป็นทีม"
    solution: "การแก้ปัญหาทีละขั้น การทำงานร่วมกับคนต่างความคิด และการเรียนรู้ต่อเนื่องเป็นทักษะที่สำคัญ ส่วนการเชื่อว่าเรียนครั้งเดียวพอไม่เป็นความจริง"
