- id: technology.design.design-process-advanced.p012
  topics:
  - technology.design.design-process-advanced
  difficulty: 4
  type: mcq
  stem: ทดสอบเสียงไซเรนที่ชุมชน (สมมติ) พบว่าบ้านท้ายซอยไม่ได้ยิน ทีมถามว่า "ทำไม" ได้ว่า ไซเรนอยู่ที่ท่าน้ำ → ห่างบ้านท้ายซอย 300 เมตร → มีบ้านหลายหลังบังเสียง ข้อใดเป็น **แนวทางปรับปรุง** ที่ตรงกับเหตุมากที่สุด
  choices:
  - id: a
    text: เปลี่ยนลูกลอยเป็นรุ่นแพงขึ้น
    feedback: ลูกลอยไม่ใช่สาเหตุ
  - id: b
    text: เพิ่มน้ำหนักเกณฑ์ราคา
    feedback: ไม่เกี่ยวกับการได้ยิน
  - id: c
    text: บอกบ้านท้ายซอยให้ตั้งใจฟังมากขึ้น
    feedback: โยนปัญหาให้ผู้ใช้ ไม่ได้แก้ที่แบบ
  - id: d
    text: ต่อสายจากตัววัดไปเปิดไซเรนหรือไฟกะพริบอีกจุดกลางซอย แล้วทดสอบเสียงที่บ้านท้ายซอยซ้ำ
    correct: true
    feedback: ถูก แก้ที่ระยะและสิ่งกีดขวาง และทดสอบซ้ำ
  hints:
