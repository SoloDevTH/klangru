<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 294" width="900" height="294" font-family="'Sarabun','Noto Sans Thai','Noto Sans Thai UI','Leelawadee UI','Tahoma','Loma',sans-serif">
<title>ตัวบทนิราศภูเขาทอง ค้างคืนกลางทุ่ง 4 บรรทัด</title>
<defs></defs>
<rect x="0" y="0" width="900" height="294" fill="#fff"/>
<rect x="10.0" y="10.0" width="880.0" height="274.0" rx="10" fill="#fffaf0" stroke="#8d6e63" stroke-width="2"/>
<text x="30.0" y="46.0" font-size="18" text-anchor="start" fill="#5d4037" font-weight="bold">ตัวบท: ค้างคืนกลางทุ่ง</text>
<text x="30.0" y="92.0" font-size="15" text-anchor="start" fill="#8d6e63" font-weight="bold">1</text>
<text x="60.0" y="92.0" font-size="19" text-anchor="start" fill="#111" font-weight="normal">แสนวิตกอกเอ๋ยมาอ้างว้าง</text>
<text x="470.0" y="92.0" font-size="19" text-anchor="start" fill="#111" font-weight="normal">ในทุ่งกว้างเห็นแต่แขมแซมสลอน</text>
<text x="30.0" y="138.0" font-size="15" text-anchor="start" fill="#8d6e63" font-weight="bold">2</text>
<text x="60.0" y="138.0" font-size="19" text-anchor="start" fill="#111" font-weight="normal">จนดึกดาวพราวพร่างกลางอัมพร</text>
<text x="470.0" y="138.0" font-size="19" text-anchor="start" fill="#111" font-weight="normal">กาเรียนร่อนร้องก้องเมื่อสองยาม</text>
<text x="30.0" y="184.0" font-size="15" text-anchor="start" fill="#8d6e63" font-weight="bold">3</text>
<text x="60.0" y="184.0" font-size="19" text-anchor="start" fill="#111" font-weight="normal">ทั้งกบเขียดเกรียดกรีดจังหรีดเรื่อย</text>
<text x="470.0" y="184.0" font-size="19" text-anchor="start" fill="#111" font-weight="normal">พระพายเฉื่อยฉิวฉิววะหวิวหวาม</text>
<text x="30.0" y="230.0" font-size="15" text-anchor="start" fill="#8d6e63" font-weight="bold">4</text>
<text x="60.0" y="230.0" font-size="19" text-anchor="start" fill="#111" font-weight="normal">วังเวงจิตคิดคะนึงรำพึงความ</text>
<text x="470.0" y="230.0" font-size="19" text-anchor="start" fill="#111" font-weight="normal">ถึงเมื่อยามยังอุดมโสมนัส</text>
<text x="870.0" y="268.0" font-size="14" text-anchor="end" fill="#555" font-weight="normal">สุนทรภู่ นิราศภูเขาทอง (ตามวิกิซอร์ซ)</text>
</svg>
