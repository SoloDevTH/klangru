<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 445" width="700" height="445" font-family="sans-serif">
<title>ประโยคสามชนิดและ relative clause แสดงเป็นกล่องอนุประโยค</title>
<rect x="0" y="0" width="700" height="445" fill="#fff"/>
<text x="350.0" y="34.0" font-size="20" text-anchor="middle" fill="#111" font-weight="bold">Sentence types: กล่องอนุประโยค</text>
<text x="24.0" y="78.0" font-size="17" text-anchor="start" fill="#1d3f75" font-weight="bold">simple</text>
<text x="24.0" y="100.0" font-size="15" text-anchor="start" fill="#444" font-weight="normal">ความเดียว</text>
<rect x="170.0" y="70.0" width="173.1" height="40.0" rx="6" fill="#dbe8fb" stroke="#2f5fa8" stroke-width="2"/>
<text x="256.6" y="96.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">Nok plays the khim.</text>
<text x="24.0" y="160.0" font-size="17" text-anchor="start" fill="#1d3f75" font-weight="bold">compound</text>
<text x="24.0" y="182.0" font-size="15" text-anchor="start" fill="#444" font-weight="normal">ความรวม</text>
<rect x="170.0" y="152.0" width="168.6" height="40.0" rx="6" fill="#dbe8fb" stroke="#2f5fa8" stroke-width="2"/>
<text x="254.3" y="178.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">Nok plays the khim</text>
<text x="369.6" y="176.0" font-size="17" text-anchor="middle" fill="#b3261e" font-weight="bold">, but</text>
<rect x="394.6" y="152.0" width="250.2" height="40.0" rx="6" fill="#dbe8fb" stroke="#2f5fa8" stroke-width="2"/>
<text x="519.7" y="178.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">her brother plays the guitar.</text>
<text x="24.0" y="242.0" font-size="17" text-anchor="start" fill="#1d3f75" font-weight="bold">complex</text>
<text x="24.0" y="264.0" font-size="15" text-anchor="start" fill="#444" font-weight="normal">ความซ้อน</text>
<rect x="170.0" y="234.0" width="203.8" height="40.0" rx="6" fill="#dbe8fb" stroke="#2f5fa8" stroke-width="2"/>
<text x="271.9" y="260.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">Nok practises the khim</text>
<rect x="381.8" y="234" width="184.5" height="40" rx="6" fill="#fde7cf" stroke="#c46a12" stroke-width="2" stroke-dasharray="6 4"/>
<text x="474.1" y="260" font-size="16" text-anchor="middle" fill="#111"><tspan fill="#b3261e" font-weight="bold">when</tspan> she gets home.</text>
<text x="24.0" y="324.0" font-size="17" text-anchor="start" fill="#1d3f75" font-weight="bold">relative clause</text>
<text x="24.0" y="346.0" font-size="15" text-anchor="start" fill="#444" font-weight="normal">ขยายคำนาม</text>
<rect x="170.0" y="316.0" width="110.9" height="40.0" rx="6" fill="#dbe8fb" stroke="#2f5fa8" stroke-width="2"/>
<text x="225.4" y="342.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">The woman</text>
<rect x="288.9" y="316" width="167.4" height="40" rx="6" fill="#fde7cf" stroke="#c46a12" stroke-width="2" stroke-dasharray="6 4"/>
<text x="372.6" y="342" font-size="16" text-anchor="middle" fill="#111"><tspan fill="#b3261e" font-weight="bold">who</tspan> sells som tam</text>
<rect x="464.2" y="316.0" width="148.3" height="40.0" rx="6" fill="#dbe8fb" stroke="#2f5fa8" stroke-width="2"/>
<text x="538.4" y="342.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">is very friendly.</text>
<rect x="40.0" y="401.0" width="34.0" height="22.0" rx="4" fill="#dbe8fb" stroke="#2f5fa8" stroke-width="2"/>
<text x="84.0" y="417.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">อนุประโยคหลัก (ยืนเดี่ยวได้)</text>
<rect x="300" y="401" width="34" height="22" rx="4" fill="#fde7cf" stroke="#c46a12" stroke-width="2" stroke-dasharray="6 4"/>
<text x="344.0" y="417.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">อนุประโยคย่อย (ยืนเดี่ยวไม่ได้)</text>
<text x="600.0" y="417.0" font-size="15" text-anchor="start" fill="#b3261e" font-weight="bold">คำเชื่อม</text>
</svg>
