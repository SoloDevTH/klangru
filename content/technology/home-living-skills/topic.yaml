id: technology.living.home-living-skills
subject: technology
title:
  th: "งานเพื่อการดำรงชีวิต: ดูแลเสื้อผ้า เตรียมและเก็บอาหาร และดูแลที่อยู่อาศัย"
  en: "Daily living skills: clothing, food and home care"
summary: การดูแลเสื้อผ้าตามป้ายและซ่อมเล็กน้อย การเตรียมและเก็บอาหารให้ปลอดภัยตามหลัก 5 ประการและช่วงอุณหภูมิอันตราย การทำความสะอาดที่ไม่ผสมสารเคมี การซ่อมแซมเล็กน้อยอย่างปลอดภัย และการปลูกผักในกระถาง
difficulty: 3.5
minutes: 35
prerequisites:
- technology.living.self-care-household
- health.nutrition.basics
encompasses:
- id: technology.living.self-care-household
  weight: 0.2
- id: health.nutrition.basics
  weight: 0.2
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  title: ช่วงอุณหภูมิอันตรายของอาหาร
  src: danger-zone.svg
  alt: เส้นแกนอุณหภูมิตั้งแต่ 0 ถึง 70 องศาเซลเซียส มีแถบสีแดงตั้งแต่ 5 ถึง 60 องศาเซลเซียสระบุว่าเป็นช่วงที่จุลินทรีย์เติบโตเร็ว มีเส้นประชี้ที่ 5 องศาว่าตู้เย็นควรไม่เกินค่านี้ และเส้นประที่ 60 องศาว่าอาหารร้อนควรอยู่เหนือค่านี้
- type: worked-example
  title: จัดตู้เย็นอย่างไรให้อาหารปลอดภัย
  problem: ซื้อเนื้อหมูดิบ ผักกาดขาวที่ล้างแล้ว และแกงที่ปรุงสุกมาจากตลาด ควรจัดเข้าตู้เย็นอย่างไร
  steps:
  - text: แยกของสุกออกจากของดิบ
    why: เพื่อไม่ให้ของดิบปนเปื้อนของที่กินโดยไม่ปรุง
  - text: ใส่เนื้อหมูดิบในภาชนะปิดไว้ชั้นล่างสุด
    why: น้ำจากเนื้อจะไม่หยดลงไปปนกับอาหารชั้นอื่น
  - text: ใส่ผักกาดขาวที่ล้างแล้วในภาชนะปิดไว้ชั้นกลาง
  - text: ใส่แกงที่ปรุงสุกแล้วในภาชนะตื้นและเก็บไว้ชั้นบน
    why: ภาชนะตื้นช่วยให้เย็นเร็วขึ้น ทำให้อาหารผ่านช่วงอุณหภูมิอันตรายได้เร็ว
  - text: ตรวจว่าตู้เย็นเย็นไม่เกิน 5 องศาเซลเซียส
  answer: เนื้อดิบชั้นล่างในภาชนะปิด ผักชั้นกลาง แกงสุกในภาชนะตื้นชั้นบน และตู้เย็นไม่เกิน 5 องศาเซลเซียส
- type: check
  problem: technology.living.home-living-skills.p010
  prompt: ลองตรวจตู้เย็นที่บ้านดูว่าตั้งอุณหภูมิไว้เท่าไร
- type: worked-example
  title: อ่านป้ายดูแลผ้าก่อนซักเสื้อสีขาว
  problem: เสื้อนักเรียนสีขาวมีป้ายรูปอ่างน้ำที่มีมือ รูปสามเหลี่ยมมีกากบาท และรูปเตารีดมีสองจุด ควรดูแลอย่างไร
  steps:
  - text: รูปอ่างน้ำที่มีมือหมายถึงควรซักด้วยมือ ไม่ควรใช้เครื่อง
    why: การซักด้วยมือช่วยป้องกันการเสียรูปของผ้าที่บอบบาง
  - text: รูปสามเหลี่ยมที่มีกากบาทหมายถึงห้ามใช้น้ำยาฟอกขาว
    why: น้ำยาฟอกขาวอาจทำให้ผ้าซีดหรือเสื่อมได้
  - text: รูปเตารีดที่มีสองจุดหมายถึงรีดที่อุณหภูมิปานกลาง
    why: ช่วยให้ผ้าไม่ไหม้จากความร้อนสูงเกินไป
  answer: ซักด้วยมือโดยไม่ใช้ฟอกขาว และรีดที่อุณหภูมิปานกลาง
- type: check
  problem: technology.living.home-living-skills.p003
  prompt: ลองดูป้ายดูแลผ้าบนเสื้อผ้าของคุณและอ่านสัญลักษณ์ที่มีจุดบนเตารีด
glossary:
- term: ป้ายดูแลผ้า
  definition: ป้ายที่ติดกับเสื้อผ้าซึ่งใช้สัญลักษณ์มาตรฐานบอกวิธีซัก ฟอก รีด และอบแห้งที่ผู้ผลิตแนะนำ
- term: ช่วงอุณหภูมิอันตราย
  definition: ช่วงอุณหภูมิประมาณ 5 ถึง 60 องศาเซลเซียสที่จุลินทรีย์เติบโตเร็ว ควรให้อาหารผ่านช่วงนี้อย่างรวดเร็ว
- term: ด้นถอยหลัง
  definition: วิธีเย็บที่เย็บไปข้างหน้าสั้น ๆ แล้วลากเข็มกลับมาทับรอยเดิม ทำให้ตะเข็บแน่น
- term: หลักความปลอดภัยของอาหาร 5 ประการ
  definition: แนวทางขององค์การอนามัยโลก ได้แก่ ทำให้สะอาด แยกดิบกับสุก ทำให้สุกทั่วถึง เก็บที่อุณหภูมิปลอดภัย และใช้น้ำกับวัตถุดิบที่ปลอดภัย
- term: ปลูกผักในกระถาง
  definition: การปลูกผักสวนครัวในภาชนะที่มีรูระบายน้ำ ใช้ดินร่วน และดูแลการรดน้ำกับแสงให้เหมาะกับพืช
flashcards:
- front: ช่วงอุณหภูมิอันตรายของอาหารคือช่วงใด
  back: ประมาณ 5 ถึง 60 องศาเซลเซียส ซึ่งจุลินทรีย์เติบโตเร็ว
- front: ตู้เย็นควรตั้งอุณหภูมิไม่เกินเท่าใด
  back: 5 องศาเซลเซียส
- front: รูปสามเหลี่ยมที่มีกากบาททับหมายความว่าอย่างไร
  back: ห้ามใช้น้ำยาฟอกขาว
- front: เนื้อดิบควรเก็บในตู้เย็นอย่างไร
  back: ไว้ชั้นล่างสุดในภาชนะปิด เพื่อไม่ให้น้ำจากเนื้อหยดลงไปปนกับอาหารอื่น
