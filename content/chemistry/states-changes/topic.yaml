id: chemistry.matter.states-changes
subject: chemistry
title: { th: สถานะของสสารและการเปลี่ยนแปลงของสาร, en: States of matter and changes }
summary: ของแข็ง ของเหลว แก๊ส การวัดมวลและปริมาตร การเปลี่ยนสถานะเมื่อร้อนขึ้นหรือเย็นลง การละลาย การเปลี่ยนแปลงทางเคมี และการเปลี่ยนแปลงที่ผันกลับได้และไม่ได้
difficulty: 1.8
minutes: 30
prerequisites: [chemistry.materials.everyday-materials]
encompasses:
  - { id: chemistry.materials.everyday-materials, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: states-particles.svg
    alt: "สามกรอบแสดงอนุภาค ของแข็ง: อนุภาคเรียงชิดกันเป็นแถวเป็นระเบียบ สั่นอยู่กับที่ ของเหลว: อนุภาคชิดกันแต่ไม่เป็นระเบียบ อยู่ส่วนล่างของกรอบ เคลื่อนที่ผ่านกันได้ แก๊ส: อนุภาคไม่กี่ตัวอยู่ห่างกันมาก มีลูกศรแสดงการเคลื่อนที่เร็วทุกทิศ ลูกศรสีแดง (ได้รับความร้อน) จากของแข็งไปของเหลวเขียนว่า หลอมเหลว จากของเหลวไปแก๊สเขียนว่า กลายเป็นไอ และเส้นโค้งจากของแข็งไปแก๊สเขียนว่า ระเหิด ลูกศรสีน้ำเงิน (คายความร้อน) จากของเหลวไปของแข็งเขียนว่า แข็งตัว จากแก๊สไปของเหลวเขียนว่า ควบแน่น และเส้นประจากแก๊สไปของแข็งเขียนว่า การตกสะสม"
    caption: "อนุภาคในสามสถานะ และชื่อการเปลี่ยนสถานะ"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: chemistry.matter.states-changes.p003, prompt: "ใช้ชื่อการเปลี่ยนสถานะในภาพตอบ" }
  - type: worked-example
    title: หาปริมาตรและมวลของก้อนหิน
    problem: "ชั่งก้อนหินได้ 45 g ใส่น้ำในกระบอกตวง 30 mL แล้วหย่อนก้อนหินลงไป ระดับน้ำขึ้นไปที่ 48 mL ก้อนหินมีปริมาตรเท่าใด"
    steps:
      - text: "ก้อนหินรูปร่างไม่แน่นอน วัดด้วยไม้บรรทัดไม่ได้ จึงใช้การแทนที่น้ำ"
      - text: "ก้อนหินดันน้ำขึ้นมาเท่ากับปริมาตรของมันเอง"
        why: "ของแข็งกับน้ำอยู่ที่เดียวกันพร้อมกันไม่ได้ เพราะสสารต้องการที่อยู่"
      - text: "ปริมาตรหิน $= 48 - 30 = 18$ mL ส่วนมวล 45 g ได้จากเครื่องชั่ง"
    answer: "ก้อนหินมีปริมาตร 18 mL (18 cm³) และมวล 45 g"
  - type: worked-example
    title: ผันกลับได้หรือไม่ได้
    problem: "ทำวุ้นกะทิ: (1) ละลายผงวุ้นในน้ำร้อน (2) ใส่น้ำตาลจนละลาย (3) เทใส่พิมพ์ทิ้งไว้ให้เย็นจนแข็งตัว ถ้านำวุ้นที่แข็งตัวไปอุ่น จะเหลวอีก ขั้นใดผันกลับได้"
    steps:
      - text: "ขั้น (2) น้ำตาลละลายในน้ำ ยังเป็นน้ำตาลเดิม ถ้าระเหยน้ำออกจะได้น้ำตาลคืน จึงผันกลับได้"
      - text: "ขั้น (3) วุ้นแข็งตัวเมื่อเย็นและเหลวเมื่ออุ่น สลับไปมาได้ จึงผันกลับได้"
      - text: "เทียบกับการทอดไข่ ซึ่งอุ่นอีกเท่าไรก็ไม่กลับเป็นไข่ดิบ จึงผันกลับไม่ได้"
        why: "การเปลี่ยนที่เกิดสารใหม่ทำให้ย้อนกลับไม่ได้ด้วยการเปลี่ยนอุณหภูมิ"
    answer: "การละลายน้ำตาลและการแข็งตัวของวุ้นผันกลับได้"
  - { type: check, problem: chemistry.matter.states-changes.p010, prompt: "มองหาหลักฐานของสารใหม่" }
  - type: simulation
    title: อนุภาคในสามสถานะ (PhET States of Matter Basics)
    url: https://phet.colorado.edu/en/simulations/states-of-matter-basics
    provider: phet
    note: เพิ่มหรือลดความร้อน แล้วดูว่าอนุภาคของน้ำเคลื่อนที่อย่างไรเมื่อเป็นของแข็ง ของเหลว และแก๊ส
glossary:
  - { term: สสาร, definition: สิ่งที่มีมวลและต้องการที่อยู่ มี 3 สถานะ คือ ของแข็ง ของเหลว แก๊ส }
  - { term: การหลอมเหลว, definition: การเปลี่ยนจากของแข็งเป็นของเหลวเมื่อได้รับความร้อน }
  - { term: การควบแน่น, definition: การเปลี่ยนจากแก๊สเป็นของเหลวเมื่อเย็นลง }
  - { term: การระเหิด, definition: การเปลี่ยนจากของแข็งเป็นแก๊สโดยไม่เป็นของเหลวก่อน }
  - { term: การละลาย, definition: การที่สารกระจายตัวไปในของเหลวจนกลายเป็นสารละลาย มวลรวมไม่เปลี่ยน }
  - { term: การเปลี่ยนแปลงทางเคมี, definition: การเปลี่ยนแปลงที่เกิดสารใหม่ที่มีสมบัติต่างจากเดิม }
flashcards:
  - { front: "รูปร่างและปริมาตรของสามสถานะ", back: "ของแข็ง: คงที่ทั้งคู่ · ของเหลว: ปริมาตรคงที่ รูปร่างตามภาชนะ · แก๊ส: เปลี่ยนทั้งคู่" }
  - { front: "วัดปริมาตรก้อนหินอย่างไร", back: "ใส่ในกระบอกตวงที่มีน้ำ ปริมาตรหิน = ระดับน้ำหลัง − ระดับน้ำก่อน" }
  - { front: "หลักฐานของการเปลี่ยนแปลงทางเคมี", back: "สีเปลี่ยน มีฟองแก๊ส มีความร้อนหรือแสง กลิ่นเปลี่ยน มีตะกอน" }
  - { front: "การเปลี่ยนสถานะทำให้มวลเปลี่ยนไหม", back: "ไม่ เช่น น้ำแข็ง 100 g ละลายได้น้ำ 100 g" }
