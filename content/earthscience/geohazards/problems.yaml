problems:
  - id: earthscience.geology.geohazards.p001
    topics: [earthscience.geology.geohazards]
    difficulty: 1
    type: mcq
    stem: "ขณะเรียนอยู่ในห้องเรียนชั้น 3 เกิดแผ่นดินไหว พื้นสั่นแรง นักเรียนควรทำอย่างไรทันที"
    choices:
      - { id: a, text: "หมอบลง มุดใต้โต๊ะที่แข็งแรง ป้องศีรษะ และเกาะขาโต๊ะไว้", correct: true }
      - { id: b, text: "วิ่งลงบันไดออกจากอาคารทันที", feedback: "ขณะพื้นยังสั่น การวิ่งทำให้ล้มหรือถูกของตกใส่ ควรหมอบ ป้อง เกาะ จนการสั่นหยุดแล้วจึงออก" }
      - { id: c, text: "ใช้ลิฟต์ลงไปชั้นล่าง", feedback: "ลิฟต์อาจค้างหรือตกเมื่อไฟฟ้าดับหรือโครงสร้างเสียหาย" }
      - { id: d, text: "ยืนชิดหน้าต่างเพื่อดูข้างนอก", feedback: "กระจกอาจแตกใส่ ควรอยู่ห่างหน้าต่าง" }
    hints:
      - "จำคำสามคำ หมอบ ป้อง เกาะ"
      - "อันตรายส่วนใหญ่มาจากของที่ตกหล่นและกระจกแตก"
    solution: "ขณะพื้นสั่นให้หมอบ ป้อง เกาะ ใต้โต๊ะที่แข็งแรง อยู่ห่างหน้าต่าง เมื่อหยุดสั่นจึงออกจากอาคารทางบันไดไปที่โล่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.geohazards.p002
    topics: [earthscience.geology.geohazards]
    difficulty: 1
    type: match
    stem: "จับคู่คำกับความหมาย"
    pairs:
      - { left: "จุดเกิดแผ่นดินไหว", right: "ตำแหน่งใต้ดินที่หินเริ่มเลื่อนตัว" }
      - { left: "จุดเหนือศูนย์เกิดแผ่นดินไหว", right: "ตำแหน่งบนผิวโลกที่อยู่ตรงเหนือจุดเกิด" }
      - { left: "ขนาดของแผ่นดินไหว", right: "พลังงานที่ปล่อยออกมา มีค่าเดียวต่อครั้ง" }
      - { left: "ความรุนแรงของแผ่นดินไหว", right: "ผลและความเสียหายในแต่ละที่ วัดด้วยมาตราเมร์คัลลี" }
    hints:
      - "จุดหนึ่งอยู่ใต้ดิน อีกจุดอยู่บนผิวโลก"
      - "ค่าใดเปลี่ยนไปตามสถานที่"
    solution: "จุดเกิดอยู่ใต้ดิน จุดเหนือศูนย์เกิดอยู่บนผิวโลก ขนาดบอกพลังงานและมีค่าเดียว ความรุนแรงบอกผลในแต่ละที่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.geohazards.p003
    topics: [earthscience.geology.geohazards]
    difficulty: 2
    type: mcq
    stem: "นักท่องเที่ยวบนชายหาดป่าตอง จังหวัดภูเก็ต เห็นน้ำทะเลลดลงไปไกลผิดปกติอย่างรวดเร็ว ควรทำอย่างไร"
    choices:
      - { id: a, text: "หนีขึ้นที่สูงหรือลึกเข้าไปในแผ่นดินทันทีตามป้ายเส้นทางหนีภัย", correct: true }
      - { id: b, text: "เดินลงไปเก็บปลาและเปลือกหอยบนหาด", feedback: "เมื่อ 26 ธันวาคม 2547 หลายคนเสียชีวิตเพราะเดินลงไปดูหาดที่น้ำลด" }
      - { id: c, text: "รอฟังประกาศให้แน่ใจก่อน", feedback: "น้ำลดผิดปกติเป็นสัญญาณเตือนตามธรรมชาติ คลื่นอาจมาถึงภายในไม่กี่นาที ต้องหนีทันทีโดยไม่ต้องรอ" }
      - { id: d, text: "ลงเรือออกไปกลางทะเลจากชายหาด", feedback: "การออกเรือจากชายหาดเมื่อคลื่นใกล้มาถึงอันตรายมาก ควรหนีขึ้นที่สูง" }
    hints:
      - "เหตุการณ์ปี 2547 น้ำทะเลลดลงก่อนคลื่นมาถึง"
      - "สัญญาณเตือนตามธรรมชาติมีเวลาให้หนีไม่มาก"
    solution: "น้ำทะเลลดลงเร็วผิดปกติเป็นสัญญาณของสึนามิ ให้หนีขึ้นที่สูงหรือเข้าไปในแผ่นดินทันที ถ้าหนีไม่ทันให้ขึ้นชั้นบนของอาคารคอนกรีตที่แข็งแรง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.geohazards.p004
    topics: [earthscience.geology.geohazards]
    difficulty: 2
    type: mcq
    stem: "แผ่นดินไหวในเมียนมาเมื่อ 28 มีนาคม 2568 มีขนาด 7.7 คนที่มัณฑะเลย์ เชียงใหม่ และกรุงเทพฯ รายงานการสั่นต่างกันมาก ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "ขนาดมีค่าเดียวคือ 7.7 แต่ความรุนแรงต่างกันในแต่ละเมือง", correct: true }
      - { id: b, text: "แต่ละเมืองมีขนาดแผ่นดินไหวไม่เท่ากัน", feedback: "ขนาดบอกพลังงานที่ปล่อยออกมาจากจุดเกิด จึงมีค่าเดียวต่อครั้ง" }
      - { id: c, text: "ทุกเมืองต้องมีความรุนแรงเท่ากันเพราะเป็นแผ่นดินไหวครั้งเดียวกัน", feedback: "ความรุนแรงขึ้นกับระยะทาง ชนิดดิน และอาคาร จึงต่างกันในแต่ละที่" }
      - { id: d, text: "กรุงเทพฯ อยู่ไกลจึงไม่มีผลกระทบเลย", feedback: "กรุงเทพฯ ได้รับผลกระทบมาก เพราะดินเหนียวอ่อนขยายการสั่น" }
    hints:
      - "ขนาดกับความรุนแรงต่างกันอย่างไร"
      - "ค่าใดขึ้นกับสถานที่"
    solution: "ขนาด 7.7 เป็นค่าเดียวของแผ่นดินไหวครั้งนั้น ส่วนความรุนแรงตามมาตราเมร์คัลลีต่างกันตามระยะทาง ชนิดดิน และอาคารในแต่ละเมือง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.geohazards.p005
    topics: [earthscience.geology.geohazards]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการเกิดสึนามิจากแผ่นดินไหวใต้ทะเล"
    items:
      - "แผ่นธรณีมุดตัว หินที่ติดกันสะสมพลังงาน"
      - "หินเลื่อนตัวฉับพลัน พื้นทะเลยกตัวขึ้น"
      - "น้ำทะเลทั้งแนวถูกดันขึ้นแล้วกระจายออกเป็นคลื่น"
      - "คลื่นเดินทางผ่านทะเลลึกอย่างรวดเร็ว คลื่นยังเตี้ย"
      - "คลื่นเข้าน้ำตื้น ช้าลงและสูงขึ้น แล้วซัดฝั่ง"
    hints:
      - "เริ่มจากสาเหตุใต้ดิน"
      - "คลื่นสูงขึ้นมากเมื่อเข้าใกล้ฝั่งเท่านั้น"
    solution: "สะสมพลังงานที่แนวมุดตัว → หินเลื่อนตัว พื้นทะเลยก → น้ำถูกดันเป็นคลื่น → เดินทางเร็วในทะเลลึก → ช้าลงและสูงขึ้นที่น้ำตื้นแล้วซัดฝั่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.geohazards.p006
    topics: [earthscience.geology.geohazards]
    difficulty: 2
    type: text
    stem: "สายด่วนของกรมป้องกันและบรรเทาสาธารณภัย ที่ใช้แจ้งเหตุและสอบถามข้อมูลสาธารณภัย เช่น สึนามิ หมายเลขอะไร"
    accepted: ["1784"]
    misconceptions:
      - { match: "1669", feedback: "1669 คือสายด่วนเจ็บป่วยฉุกเฉิน ใช้เมื่อมีผู้บาดเจ็บ" }
      - { match: "1182", feedback: "1182 คือสายด่วนกรมอุตุนิยมวิทยา" }
    hints:
      - "เป็นตัวเลข 4 หลัก ขึ้นต้นด้วย 17"
      - "ลงท้ายด้วย 84"
    solution: "1784 เป็นสายด่วนของกรมป้องกันและบรรเทาสาธารณภัย ส่วนผู้บาดเจ็บให้โทร 1669"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.geohazards.p007
    topics: [earthscience.geology.geohazards]
    difficulty: 3
    type: numeric
    stem: "ภาพแสดงคลื่นไหวสะเทือนที่สถานีแห่งหนึ่ง ใช้ความสัมพันธ์ ระยะทาง (km) ≈ 8 × ช่วงเวลาระหว่างคลื่น P กับคลื่น S (วินาที) สถานีอยู่ห่างจากจุดเกิดแผ่นดินไหวประมาณกี่กิโลเมตร"
    figure: { src: p-seismogram.svg, alt: "กราฟคลื่นไหวสะเทือน แกนนอนเป็นเวลา 0 ถึง 60 วินาที เส้นเรียบจนถึงวินาทีที่ 12 ซึ่งมีเส้นประสีน้ำเงินเขียนว่า P มาถึง คลื่นสั่นเล็ก ๆ ต่อไปจนถึงวินาทีที่ 37 ซึ่งมีเส้นประสีแดงเขียนว่า S มาถึง หลังจากนั้นคลื่นสั่นแรงขึ้นมาก" }
    answer: { value: 200, tolerance: 8, unit: km }
    misconceptions:
      - { match: 96, feedback: "96 km มาจาก 8 × 12 คือใช้เวลาที่คลื่น P มาถึง ต้องใช้ช่วงห่างระหว่าง P กับ S" }
      - { match: 296, feedback: "296 km มาจาก 8 × 37 ต้องใช้ช่วงห่างระหว่าง P กับ S ไม่ใช่เวลาที่ S มาถึง" }
    hints:
      - "อ่านเวลาที่คลื่น P และคลื่น S มาถึงจากภาพ"
      - "ช่วงเวลา = เวลาที่ S มาถึง − เวลาที่ P มาถึง"
    solution: "P มาถึงวินาทีที่ 12 S มาถึงวินาทีที่ 37 ช่วงห่าง $37 - 12 = 25$ วินาที ระยะทาง $\\approx 8 \\times 25 = 200$ km"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.geohazards.p008
    topics: [earthscience.geology.geohazards]
    difficulty: 3
    type: numeric
    stem: "ขนาดแผ่นดินไหวเพิ่มขึ้น 1 พลังงานเพิ่มขึ้น $10^{1.5}$ เท่า แผ่นดินไหวขนาด 8.0 ปล่อยพลังงานมากกว่าขนาด 7.0 ประมาณกี่เท่า"
    answer: { value: 31.6, tolerance: 0.5, unit: เท่า }
    misconceptions:
      - { match: 10, feedback: "10 เท่าคือแอมพลิจูดของคลื่น พลังงานเพิ่มมากกว่านั้น" }
      - { match: 1.14, feedback: "หาร 8 ด้วย 7 ไม่ได้ เพราะมาตราขนาดเป็นมาตราลอการิทึม" }
    hints:
      - "ขนาดต่างกัน 1"
      - "คำนวณ $10^{1.5}$"
    solution: "$10^{1.5} = 10 \\times \\sqrt{10} \\approx 31.6$ เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.geohazards.p009
    topics: [earthscience.geology.geohazards]
    difficulty: 3
    type: mcq
    stem: "ภูเขาไฟลูกหนึ่งกว้างหลายสิบกิโลเมตร ลาดเขาค่อย ๆ ลาด และมักมีลาวาร้อนจัดไหลออกมาเป็นสายยาวโดยไม่ค่อยระเบิด ข้อใดอธิบายได้ถูกต้อง"
    choices:
      - { id: a, text: "เป็นภูเขาไฟรูปโล่ แมกมาบะซอลต์มีซิลิกาน้อย หนืดน้อย แก๊สออกง่าย", correct: true }
      - { id: b, text: "เป็นภูเขาไฟสลับชั้น แมกมาหนืดมาก", feedback: "แมกมาที่หนืดมากไหลไม่ไกล สะสมเป็นภูเขาลาดชันและระเบิดรุนแรง" }
      - { id: c, text: "เป็นภูเขาไฟรูปโล่ แมกมามีซิลิกามากจึงไหลง่าย", feedback: "ซิลิกามากทำให้แมกมาหนืดมาก ไม่ใช่ไหลง่าย" }
      - { id: d, text: "เป็นภูเขาไฟที่ดับแล้ว", feedback: "ภูเขาไฟที่ยังมีลาวาไหลออกมายังมีพลังอยู่" }
    hints:
      - "ลาวาที่ไหลได้ไกลต้องหนืดมากหรือน้อย"
      - "ความหนืดขึ้นกับปริมาณซิลิกา"
    solution: "ลาวาบะซอลต์มีซิลิกาน้อย หนืดน้อย ไหลได้ไกล ทับถมเป็นภูเขากว้างลาดค่อย ๆ คือภูเขาไฟรูปโล่ เช่น เมานาโลอา และแก๊สออกง่ายจึงไม่ค่อยระเบิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.geohazards.p010
    topics: [earthscience.geology.geohazards]
    difficulty: 3
    type: mcq
    stem: "แผ่นดินไหวขนาด 7.7 ในเมียนมาเมื่อปี 2568 อยู่ห่างกรุงเทพฯ ราว 1,000 km แต่อาคารสูงในกรุงเทพฯ สั่นแรงและอาคารที่กำลังก่อสร้างถล่ม เหตุผลทางธรณีวิทยาข้อใดสำคัญที่สุด"
    choices:
      - { id: a, text: "กรุงเทพฯ ตั้งบนดินเหนียวอ่อนหนา ซึ่งขยายการสั่นแบบช้า ๆ ที่เข้ากับการโยกของอาคารสูง", correct: true }
      - { id: b, text: "กรุงเทพฯ อยู่บนรอยเลื่อนสะกาย", feedback: "รอยเลื่อนสะกายอยู่ในเมียนมา ไม่ได้ผ่านกรุงเทพฯ" }
      - { id: c, text: "คลื่นไหวสะเทือนแรงขึ้นเมื่อเดินทางไกล", feedback: "คลื่นอ่อนลงเมื่อเดินทางไกล แต่ดินอ่อนขยายการสั่นที่ปลายทาง" }
      - { id: d, text: "มีสึนามิเข้ามาในกรุงเทพฯ", feedback: "แผ่นดินไหวครั้งนี้เกิดบนแผ่นดินและไม่ได้ทำให้เกิดสึนามิในอ่าวไทย" }
    hints:
      - "ความรุนแรงขึ้นกับชนิดดินด้วย"
      - "คลื่นจากที่ไกลมีการสั่นแบบช้า ๆ อาคารประเภทใดโยกช้า"
    solution: "คลื่นไหวสะเทือนจากที่ไกลเหลือการสั่นแบบคาบยาว ดินเหนียวอ่อนใต้กรุงเทพฯ ขยายการสั่นนี้ และอาคารสูงโยกด้วยคาบใกล้เคียงกัน จึงสั่นแรงทั้งที่จุดเกิดอยู่ไกล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.geohazards.p011
    topics: [earthscience.geology.geohazards]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อมูลใดช่วยเตือนว่าภูเขาไฟอาจใกล้ปะทุ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "แผ่นดินไหวเล็ก ๆ ใต้ภูเขาไฟเกิดถี่ขึ้น", correct: true }
      - { id: b, text: "GPS วัดได้ว่าพื้นดินบนภูเขาไฟโป่งขึ้น", correct: true }
      - { id: c, text: "แก๊สซัลเฟอร์ไดออกไซด์จากปล่องเพิ่มขึ้นมาก", correct: true }
      - { id: d, text: "คืนนั้นเป็นคืนวันเพ็ญ", feedback: "ข้างขึ้นข้างแรมไม่ใช่ข้อมูลที่ใช้เตือนการปะทุ" }
    hints:
      - "แมกมาที่เคลื่อนขึ้นมาดันหินและพื้นดิน"
      - "แมกมาที่ขึ้นมาใกล้ผิวปล่อยแก๊สออกมา"
