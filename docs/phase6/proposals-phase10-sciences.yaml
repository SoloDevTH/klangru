  # ลำดับ 1
  - id: chemistry.reactions.aqueous-reaction-types
    title: อิเล็กโทรไลต์และประเภทของปฏิกิริยาในสารละลาย
    difficulty: 5.5
    prereq: [chemistry.stoichiometry.reactions, chemistry.bonding.ionic]
    indicators:
      - university-foundations:CHEM 4.2
      - university-foundations:CHEM 11.2
    scope: >-
      อิเล็กโทรไลต์แก่ อิเล็กโทรไลต์อ่อน และนอนอิเล็กโทรไลต์ ทดสอบด้วยการนำไฟฟ้า ปฏิกิริยาตกตะกอนกับกฎการละลายของสารประกอบไอออนิก
      การเขียนสมการโมเลกุล สมการไอออนิกเต็ม และสมการไอออนิกสุทธิ ปฏิกิริยากรด-เบส (สะเทิน เกิดเกลือกับน้ำหรือแก๊ส) ปฏิกิริยารีดอกซ์
      แบบแทนที่ของโลหะเบื้องต้นด้วยเลขออกซิเดชัน และการเผาไหม้ จำแนกปฏิกิริยาจากสมการ และทำนายผลิตภัณฑ์จากการผสมสารละลายสองชนิด
  # ลำดับ 1
  - id: chemistry.thermochem.enthalpy-hess
    title: เอนทัลปี กฎของเฮสส์ และเอนทัลปีของการเกิดมาตรฐาน
    difficulty: 6
    prereq: [chemistry.stoichiometry.reactions, chemistry.bonding.covalent-naming-energy, physics.thermal.temperature-heat]
    indicators:
      - university-foundations:CHEM 5.3
    scope: >-
      เอนทัลปีเป็นฟังก์ชันสถานะ ΔH = q ที่ความดันคงตัว สมการเทอร์โมเคมีและการปรับ ΔH เมื่อกลับสมการหรือคูณสัมประสิทธิ์ สถานะมาตรฐาน
      เอนทัลปีของการเผาไหม้และของการเกิดมาตรฐาน ΔH°f กฎของเฮสส์ รวมสมการหลายขั้นหา ΔH ของปฏิกิริยาที่วัดตรงไม่ได้
      ΔH°rxn = ΣnΔH°f(ผลิตภัณฑ์) − ΣnΔH°f(สารตั้งต้น) เทียบผลกับการประมาณจากพลังงานพันธะ และค่าความร้อนของเชื้อเพลิง (LPG แก๊สชีวภาพ เอทานอล)
  # ---------- เคมี: โครงสร้างอะตอมและพันธะ ----------
  # ลำดับ 2
  - id: chemistry.matter.quantum-numbers-orbitals
    title: แบบจำลองอะตอมเชิงควอนตัม เลขควอนตัม และรูปร่างออร์บิทัล
    difficulty: 7
    prereq: [chemistry.matter.atomic-structure, physics.modern.quantum-atom]
    indicators:
      - university-foundations:CHEM 6.3
    scope: >-
      ทวิภาวะของอิเล็กตรอนและหลักความไม่แน่นอนของไฮเซนเบิร์ก เหตุที่วงโคจรแบบโบร์ใช้ไม่ได้ ฟังก์ชันคลื่นและความหนาแน่นความน่าจะเป็นเชิงแนวคิด
      เลขควอนตัมสี่ตัว n, l, m_l, m_s ค่าที่เป็นไปได้และความหมาย จำนวนออร์บิทัลในแต่ละชั้นย่อย รูปร่างและทิศของออร์บิทัล s p d
      ปมของออร์บิทัล และใช้เลขควอนตัมอธิบายหลักของเพาลีกับความจุของชั้นย่อย
  # ลำดับ 2
  - id: chemistry.bonding.formal-charge-resonance
    title: ข้อยกเว้นของกฎออกเตต ประจุฟอร์มัล และโครงสร้างเรโซแนนซ์
    difficulty: 6
    prereq: [chemistry.bonding.covalent, chemistry.bonding.polarity-intermolecular]
    indicators:
      - university-foundations:CHEM 7.3
      - university-foundations:CHEM 7.4
    scope: >-
      ขั้นตอนเขียนโครงสร้างลิวอิสของโมเลกุลและไอออนหลายอะตอม ข้อยกเว้นของกฎออกเตต (จำนวนอิเล็กตรอนคี่ เช่น NO, อะตอมกลางขาดออกเตต
      เช่น BF₃, ออกเตตขยายเช่น PCl₅ SF₆) ประจุฟอร์มัลและการเลือกโครงสร้างที่เหมาะสมที่สุด โครงสร้างเรโซแนนซ์ของ O₃ NO₃⁻ CO₃²⁻
      ลูกผสมเรโซแนนซ์ ความยาวพันธะเฉลี่ย และอันดับพันธะ
  # ลำดับ 2
  - id: chemistry.bonding.hybridization
    title: ทฤษฎีพันธะเวเลนซ์ ออร์บิทัลไฮบริด และพันธะซิกมากับพาย
    difficulty: 7
    prereq: [chemistry.matter.quantum-numbers-orbitals, chemistry.bonding.formal-charge-resonance]
    indicators:
      - university-foundations:CHEM 8.1
      - university-foundations:CHEM 8.2
      - university-foundations:CHEM 8.3
    scope: >-
      ทฤษฎีพันธะเวเลนซ์ การซ้อนเหลื่อมของออร์บิทัลและพลังงานกับระยะห่างของ H₂ ออร์บิทัลไฮบริด sp sp² sp³ sp³d sp³d² กับรูปทรงตาม VSEPR
      หาชนิดไฮบริดจากจำนวนกลุ่มอิเล็กตรอน พันธะซิกมาและพันธะพายในพันธะคู่และพันธะสาม การหมุนรอบพันธะคู่ไม่ได้ และนับพันธะ σ π
      ในเอทีน เอไทน์ CO₂ และโมเลกุลอินทรีย์
  # ลำดับ 3
  - id: chemistry.bonding.molecular-orbitals
    title: ทฤษฎีออร์บิทัลเชิงโมเลกุล
    difficulty: 7.5
    prereq: [chemistry.bonding.hybridization]
    indicators:
      - university-foundations:CHEM 8.4
    scope: >-
      การรวมออร์บิทัลอะตอมเป็นออร์บิทัลเชิงโมเลกุลแบบพันธะและแอนติบอนดิง σ และ π แผนภาพระดับพลังงานของโมเลกุลอะตอมคู่คาบที่ 1 และ 2
      การเติมอิเล็กตรอน อันดับพันธะ = (พันธะ − แอนติบอนดิง)/2 ทำนายว่าโมเลกุลมีอยู่ได้หรือไม่ (He₂) อธิบายสมบัติพาราแมกเนติกของ O₂
      ที่โครงสร้างลิวอิสอธิบายไม่ได้ และการสลับลำดับ σ2p กับ π2p ของ B₂ C₂ N₂
  # ---------- เคมี: สถานะของสารและสารละลาย ----------
