id: health.safety.first-aid-common-injuries
subject: health
title: { th: "ปฐมพยาบาลเมื่อบาดเจ็บจากการเล่นและกีฬา ใช้ยาผิด สารเคมี และแมลงสัตว์กัดต่อย", en: "First aid for play and sports injuries, wrong medicines, chemicals, bites and stings" }
summary: แผลถลอก ข้อเคล็ดและหลัก PRICE การป้องกันการบาดเจ็บจากกีฬา การได้รับยาผิดหรือสารเคมี ผึ้งต่อย สุนัขกัด งูกัด และการเคลื่อนย้ายผู้บาดเจ็บอย่างปลอดภัย ต้องฝึกปฏิบัติจริงกับผู้ฝึก
difficulty: 3
minutes: 35
prerequisites: [health.safety.first-aid, health.safety.medicine-use]
encompasses:
  - { id: health.safety.first-aid, weight: 0.25 }
  - { id: health.safety.medicine-use, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: หลัก PRICE
    src: price.svg
    alt: "ห้ากล่องเรียงกัน P Protection ป้องกัน หยุดเล่นทันที ไม่ให้บาดเจ็บซ้ำ R Rest พัก ไม่ลงน้ำหนักบนส่วนที่เจ็บ I Ice ประคบเย็น ห่อผ้าก่อนประคบ ครั้งละไม่เกิน 20 นาที C Compression พันกระชับ พันผ้ายืดพอแน่น ไม่รัดจนชาหรือซีด E Elevation ยกสูง วางบนหมอน ยกให้สูงไว้ ด้านล่างเขียนว่าปวดมาก บวมมาก ผิดรูป หรือลงน้ำหนักไม่ได้ อาจกระดูกหัก อย่าขยับ ดามไว้และไปโรงพยาบาล"
    caption: "ใช้ใน 2–3 วันแรกตามคำแนะนำของ NHS"
  - type: worked-example
    title: ข้อเท้าพลิกในชั่วโมงพละ
    problem: "พลอยกระโดดลงพื้นแล้วข้อเท้าพลิก ข้อเท้าบวมและปวด แต่ยังขยับนิ้วเท้าได้และไม่ผิดรูป ครูควรช่วยอย่างไร"
    steps:
      - text: "ตรวจอาการ: ไม่ผิดรูป ยังขยับนิ้วได้ น่าจะเป็นข้อเคล็ด ถ้าผิดรูปหรือลงน้ำหนักไม่ได้เลยต้องไปโรงพยาบาล"
      - text: "P และ R: ให้หยุดเล่น นั่งพัก ไม่ลงน้ำหนักบนข้อเท้า"
      - text: "I: ห่อน้ำแข็งด้วยผ้า ประคบไม่เกิน 20 นาที"
        why: "ความเย็นทำให้หลอดเลือดหดตัว ลดบวมและปวด ผ้ากันผิวบาดเจ็บจากความเย็น"
      - text: "C และ E: พันผ้ายืดพอแน่น แล้ววางเท้าบนหมอนหรือกระเป๋าให้สูง ตรวจว่านิ้วเท้าไม่ซีดหรือชา"
      - text: "แจ้งผู้ปกครอง งดนวดและประคบร้อนใน 2–3 วันแรก ถ้าไม่ดีขึ้นให้ไปพบแพทย์"
    answer: "ใช้หลัก PRICE และงดความร้อนกับการนวดในช่วงแรก ถ้าอาการรุนแรงขึ้นให้พบแพทย์"
  - { type: check, problem: health.safety.first-aid-common-injuries.p005, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: worked-example
    title: งูกัดที่ปลายนา
    problem: "ตาถูกงูกัดที่ข้อเท้าขณะเดินกลับจากนา หลานอยู่ด้วย ควรทำอย่างไร"
    figure:
      src: snakebite.svg
      alt: "ตารางสองฝั่ง ฝั่งซ้ายควรทำ ตั้งสติ ถอยออกห่างจากงู ให้ผู้ถูกกัดอยู่นิ่ง ขยับน้อยที่สุด ดามส่วนที่ถูกกัดด้วยไม้หรือของแข็ง ถอดแหวน กำไล นาฬิกาก่อนบวม รีบไปโรงพยาบาลหรือโทร 1669 จำสีและลายงูหรือถ่ายรูปจากที่ไกลถ้าปลอดภัย ฝั่งขวาห้ามทำ ขันชะเนาะหรือรัดเชือกแน่นเหนือแผล กรีดแผล ใช้ปากดูดพิษ จี้ไฟ พอกยา หรือโปะน้ำแข็ง ไล่จับหรือตีงู ให้ผู้ถูกกัดเดินหรือวิ่งไปเอง ดื่มเหล้าหรือกินยาที่ไม่ได้สั่ง"
    steps:
      - text: "พาตาถอยออกห่างจากงู ให้นั่งลงนิ่ง ๆ และตั้งสติ"
      - text: "โทร 1669 บอกสถานที่ อาการ และเวลาที่ถูกกัด"
      - text: "ถอดกำไลข้อเท้าหรือสิ่งที่รัด ดามขาด้วยไม้ให้ขยับน้อยที่สุด"
        why: "ยิ่งขยับ พิษยิ่งกระจายเร็ว และส่วนที่ถูกกัดอาจบวมจนสิ่งที่สวมรัดแน่น"
      - text: "ไม่ขันชะเนาะ ไม่กรีด ไม่ดูดพิษ ไม่พอกยา ไม่ไล่จับงู"
        why: "การขันชะเนาะทำให้ขาขาดเลือด การกรีดและดูดทำให้ติดเชื้อ"
      - text: "นำส่งโรงพยาบาลโดยให้ตาเดินน้อยที่สุด"
    answer: "ให้อยู่นิ่ง ดาม ถอดสิ่งที่รัด และรีบไปโรงพยาบาลหรือโทร 1669 โดยไม่ทำตามความเชื่อเก่า"
  - { type: check, problem: health.safety.first-aid-common-injuries.p010 }
glossary:
  - { term: ข้อเคล็ด, definition: "การบาดเจ็บของเอ็นรอบข้อต่อจากการบิดหรือยืดเกิน เช่น ข้อเท้าพลิก" }
  - { term: PRICE, definition: "หลักดูแลข้อเคล็ดและกล้ามเนื้อบาดเจ็บ ป้องกัน พัก ประคบเย็น พันกระชับ ยกสูง" }
  - { term: เหล็กใน, definition: "อวัยวะปลายท้องของผึ้งที่ฝังในผิวพร้อมถุงพิษ ต้องขูดออกด้านข้าง" }
  - { term: ขันชะเนาะ, definition: "การรัดเชือกหรือผ้าให้แน่นเหนือแผล ไม่แนะนำสำหรับงูกัดเพราะทำให้ขาดเลือดและเนื้อตาย" }
  - { term: ศูนย์พิษวิทยา, definition: "หน่วยงานให้คำปรึกษาเมื่อได้รับสารพิษหรือยาเกินขนาด ศูนย์พิษวิทยารามาธิบดีโทร 1367" }
flashcards:
  - { front: "ข้อเท้าพลิก 2–3 วันแรก", back: "PRICE: ป้องกัน พัก ประคบเย็น (≤ 20 นาที) พันกระชับ ยกสูง ไม่นวด ไม่ประคบร้อน" }
  - { front: "กลืนสารเคมี", back: "ไม่ทำให้อาเจียน เก็บภาชนะ โทร 1669 หรือ 1367" }
  - { front: "สุนัขกัด", back: "ล้างแผลด้วยน้ำและสบู่อย่างน้อย 15 นาที แล้วพบแพทย์เรื่องวัคซีนพิษสุนัขบ้า" }
  - { front: "งูกัด ห้ามทำอะไร", back: "ห้ามขันชะเนาะ กรีด ดูดพิษ พอกยา และไล่จับงู" }
  - { front: "สงสัยบาดเจ็บที่คอหรือหลัง", back: "ไม่เคลื่อนย้าย ให้อยู่นิ่ง โทร 1669" }
