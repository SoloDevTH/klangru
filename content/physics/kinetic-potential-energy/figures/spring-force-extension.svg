<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" width="460" height="330" font-family="sans-serif" font-size="15">
  <title>กราฟแรงดึงสปริงกับระยะยืดเป็นเส้นตรง พื้นที่ใต้กราฟคือพลังงานศักย์ยืดหยุ่น</title>
  <rect x="0" y="0" width="460" height="330" fill="#ffffff"/>
  <line x1="80" y1="270" x2="405" y2="270" stroke="#15211e" stroke-width="2" stroke-linecap="round"/><polygon points="414,270 405,274.1 405,265.9" fill="#15211e" stroke="#15211e" stroke-width="1" stroke-linejoin="round"/>
  <line x1="80" y1="270" x2="80" y2="45" stroke="#15211e" stroke-width="2" stroke-linecap="round"/><polygon points="80,36 84,45 76,45" fill="#15211e" stroke="#15211e" stroke-width="1" stroke-linejoin="round"/>
  <text x="240" y="312" font-size="14" text-anchor="middle">ระยะยืด x</text>
  <text x="34" y="160" font-size="14" text-anchor="middle" transform="rotate(-90 34 160)">แรงดึง F</text>
  <polygon points="80,270 340,270 340,80" fill="#f6dccb" stroke="none" stroke-width="0" stroke-linejoin="round"/>
  <line x1="80" y1="270" x2="380" y2="50.8" stroke="#b4521f" stroke-width="3" stroke-linecap="round"/>
  <line x1="340" y1="270" x2="340" y2="80" stroke="#6b7472" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="80" y1="80" x2="340" y2="80" stroke="#6b7472" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
  <text x="340" y="290" font-size="15" text-anchor="middle" font-style="italic">x</text>
  <text x="72" y="85" font-size="15" text-anchor="end" font-style="italic">kx</text>
  <text x="245" y="230" font-size="14" text-anchor="middle">พื้นที่ = ½ (x)(kx)</text>
  <text x="245" y="250" font-size="14" text-anchor="middle">= ½kx² = งานที่ใช้ยืด</text>
  <polyline points="160,211.5 220,211.5 220,167.7" fill="none" stroke="#0a6b60" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="226" y="194.6" font-size="14" fill="#0a6b60">ความชัน = k</text>
  <text x="386" y="44.8" font-size="15" fill="#b4521f" text-anchor="end" font-weight="bold">F = kx</text>
</svg>
