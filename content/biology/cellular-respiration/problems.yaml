      - { id: d, text: "กำจัดกลูโคสส่วนเกินออกจากเซลล์", feedback: "จุดประสงค์คือให้ได้ ATP ต่อไปเมื่อออกซิเจนไม่พอ ไม่ใช่กำจัดกลูโคส" }
    hints:
