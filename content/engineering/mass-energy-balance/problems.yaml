  - id: engineering.process.mass-energy-balance.p014
    topics: [engineering.process.mass-energy-balance]
    difficulty: 5
    type: numeric
    stem: "จากเตาเผาไบโอแก๊สในโจทย์ก่อนหน้า ($100\\ \\mathrm{mol/h}$ มี $\\mathrm{CH_4}$ 60%, $\\mathrm{CO_2}$ 40% อากาศมากเกินพอ 20% เผาไหม้สมบูรณ์) เครื่องวิเคราะห์แก๊สวัดแบบแห้ง (ไม่นับไอน้ำ) จะอ่าน $\\mathrm{CO_2}$ ได้ร้อยละเท่าใดโดยโมล (ทศนิยม 1 ตำแหน่ง)"
    figure: { src: p-burner.svg, alt: "แผนภาพกระบวนการ เตาเผาหนึ่งกล่อง กระแสเข้าสองกระแส คือไบโอแก๊ส 100 mol/h มี CH4 60% CO2 40% โดยโมล และอากาศ (O2 21% N2 79%) มากเกินพอ 20% กระแสออกคือแก๊สไอเสียที่มี CO2 H2O O2 N2 ใต้ภาพเขียนสมการ CH4 + 2O2 → CO2 + 2H2O" }
    answer: { value: 15.0, tolerance: 0.15, unit: "%" }
