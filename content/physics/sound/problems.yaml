  - id: phy.snd.p014
    topics: [physics.waves.sound]
    difficulty: 1
    type: mcq
    stem: "วางเมล็ดข้าวสารไว้บนหนังกลองใบหนึ่ง แล้วตีกลองอีกใบที่วางอยู่ข้าง ๆ โดยกลองสองใบไม่ได้แตะกัน เมล็ดข้าวกระโดดขึ้นลง ข้อใดอธิบายได้ถูกต้อง"
    choices:
      - { id: a, text: "เสียงจากกลองที่ถูกตีพาพลังงานผ่านอากาศ ทำให้หนังกลองอีกใบสั่น", correct: true }
      - { id: b, text: "ลมจากไม้ตีกลองพัดเมล็ดข้าวให้กระโดด", feedback: "ไม้ตีอยู่คนละใบและไม่ได้พัดลมไปถึงกลองอีกใบ สิ่งที่เดินทางมาคือคลื่นเสียง ซึ่งอนุภาคอากาศสั่นอยู่กับที่ แต่พลังงานถูกส่งต่อไป" }
      - { id: c, text: "แรงโน้มถ่วงของกลองใบที่ถูกตีดึงเมล็ดข้าว", feedback: "แรงโน้มถ่วงระหว่างกลองเล็กมากและไม่เปลี่ยนเมื่อตีกลอง เมล็ดข้าวกระโดดเพราะหนังกลองสั่น" }
    hints:
      - "เสียงเกิดจากการสั่น และเดินทางผ่านอากาศ"
      - "เมื่อคลื่นเสียงไปถึงหนังกลองอีกใบ จะทำอะไรกับหนังกลองนั้น"
    solution: "กลองที่ถูกตีสั่นและทำให้อากาศรอบ ๆ สั่นเป็นคลื่นเสียง คลื่นเสียงพาพลังงานไปถึงหนังกลองอีกใบให้สั่นตาม เมล็ดข้าวบนหนังกลองจึงกระโดด เสียงทำให้วัตถุสั่นได้ เหมือนที่ทำให้เยื่อแก้วหูสั่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.snd.p015
    topics: [physics.waves.sound]
    difficulty: 3
    type: numeric
    stem: "ความเข้มเสียงในห้องเรียนขณะนักเรียนคุยกันเท่ากับ $1.0 \\times 10^{-6}\\ \\mathrm{W/m^2}$ ระดับความเข้มเสียงเป็นกี่เดซิเบล ใช้ $I_0 = 10^{-12}\\ \\mathrm{W/m^2}$ (ตอบเป็นตัวเลขในหน่วย dB)"
    answer: { value: 60, tolerance: 0.1, unit: dB }
    hints:
      - "ใช้ $\\beta = 10\\log\\dfrac{I}{I_0}$"
      - "$\\dfrac{10^{-6}}{10^{-12}} = 10^{6}$ แล้วหาลอการิทึมฐานสิบ"
    misconceptions:
      - { match: 6, feedback: "นี่คือค่าในหน่วยเบล ($\\log 10^6$) เดซิเบลต้องคูณ 10" }
      - { match: -60, feedback: "ดูเหมือนสลับเศษกับส่วนเป็น $\\tfrac{I_0}{I}$ ความเข้มของเสียงจริงต้องอยู่ที่ตัวเศษ" }
    solution: "$\\beta = 10\\log\\dfrac{10^{-6}}{10^{-12}} = 10\\log 10^{6} = 10 \\times 6 = 60\\ \\mathrm{dB}$ ตรงกับระดับเสียงการพูดคุยปกติ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.snd.p016
