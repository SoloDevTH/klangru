<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="sans-serif"><title>การซ้อนเหลื่อมของออร์บิทัล s สองตัว: แบบเฟสเดียวกันให้ออร์บิทัลพันธะ แบบต่างเฟสให้แอนติบอนดิงที่มีระนาบโหนด</title><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f2937"/></marker></defs><rect width="760" height="300" fill="#ffffff"/><text x="130" y="40" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">1s ของ A และ 1s ของ B</text>
<ellipse cx="60" cy="150" rx="46" ry="46" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.5"/>
<ellipse cx="200" cy="150" rx="46" ry="46" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.5"/>
<circle cx="60" cy="150" r="6" fill="#111" stroke="#111" stroke-width="1"/>
<circle cx="200" cy="150" r="6" fill="#111" stroke="#111" stroke-width="1"/>
<text x="130" y="236" font-size="13" text-anchor="middle" fill="#374151" font-weight="normal">เครื่องหมายเฟสเป็นบวกทั้งคู่</text>
<text x="380" y="40" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">เฟสเดียวกัน → σ (พันธะ)</text>
<ellipse cx="380" cy="150" rx="118" ry="50" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.5"/>
<circle cx="310" cy="150" r="6" fill="#111" stroke="#111" stroke-width="1"/>
<circle cx="450" cy="150" r="6" fill="#111" stroke="#111" stroke-width="1"/>
<text x="380" y="236" font-size="13" text-anchor="middle" fill="#374151" font-weight="normal">ไม่มีโหนด อิเล็กตรอนอยู่ระหว่างนิวเคลียส</text>
<text x="630" y="40" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">ต่างเฟส → σ* (แอนติบอนดิง)</text>
<ellipse cx="564" cy="150" rx="50" ry="46" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.5"/>
<ellipse cx="696" cy="150" rx="50" ry="46" fill="#fecaca" stroke="#1f2937" stroke-width="1.5"/>
<line x1="630" y1="96" x2="630" y2="204" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="560" cy="150" r="6" fill="#111" stroke="#111" stroke-width="1"/>
<circle cx="700" cy="150" r="6" fill="#111" stroke="#111" stroke-width="1"/>
<text x="630" y="236" font-size="13" text-anchor="middle" fill="#374151" font-weight="normal">มีระนาบโหนดตรงกลาง</text>
<text x="380" y="278" font-size="12" text-anchor="middle" fill="#4b5563" font-weight="normal">สีฟ้า = เฟสบวก สีแดง = เฟสลบ (เครื่องหมายของฟังก์ชันคลื่น ไม่ใช่ประจุไฟฟ้า) จุดดำคือนิวเคลียส</text></svg>
