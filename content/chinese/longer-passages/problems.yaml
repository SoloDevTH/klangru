    feedback: การไปสิงคโปร์ (最近) เกิดหลังสุดในสี่เหตุการณ์นี้
  - id: c
    text: ทำงานเองได้ภายในสามเดือน → เริ่มงานอย่างเครียด → เข้างานเช้าขึ้น → ไปสิงคโปร์
    feedback: การทำงานเองได้เกิดหลังจากสามเดือนของการพยายาม
  - id: d
    text: เข้างานเช้าขึ้น → ไปสิงคโปร์ → เริ่มงานอย่างเครียด → ทำงานเองได้
