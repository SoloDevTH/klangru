<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 370" width="860" height="370" font-family="sans-serif">
<title>บทความเรื่องธนาคารขยะของโรงเรียน (เรื่องสมมุติ)</title>
<defs></defs>
<rect x="0" y="0" width="860" height="370" fill="#fff"/>
<rect x="10.0" y="10.0" width="840.0" height="350.0" rx="10" fill="#fffdf5" stroke="#b08900" stroke-width="2"/>
<text x="30.0" y="48.0" font-size="23" text-anchor="start" fill="#7a5c00" font-weight="bold">ธนาคารขยะของโรงเรียน</text>
<text x="830.0" y="48.0" font-size="14" text-anchor="end" fill="#777" font-weight="normal">(เรื่องสมมุติ)</text>
<text x="30.0" y="95.0" font-size="19" text-anchor="start" fill="#111" font-weight="normal">(1) โรงเรียนบ้านหนองบัวเปิดธนาคารขยะทุกวันศุกร์ตอนพักกลางวัน</text>
<text x="30.0" y="135.0" font-size="19" text-anchor="start" fill="#111" font-weight="normal">(2) นักเรียนนำขวดพลาสติก กระป๋อง และกระดาษที่แยกแล้วมาชั่งน้ำหนัก</text>
<text x="30.0" y="175.0" font-size="19" text-anchor="start" fill="#111" font-weight="normal">(3) ครูจดน้ำหนักลงสมุดบัญชีของนักเรียนแต่ละคน</text>
<text x="30.0" y="215.0" font-size="19" text-anchor="start" fill="#111" font-weight="normal">(4) เมื่อครบภาคเรียน โรงเรียนขายขยะให้ร้านรับซื้อของเก่า</text>
<text x="64.0" y="255.0" font-size="19" text-anchor="start" fill="#111" font-weight="normal">แล้วคืนเงินให้นักเรียนตามน้ำหนักที่ฝาก</text>
<text x="30.0" y="295.0" font-size="19" text-anchor="start" fill="#111" font-weight="normal">(5) ปีนี้ขยะในถังหน้าอาคารลดลงจนเห็นได้ชัด</text>
<text x="30.0" y="335.0" font-size="19" text-anchor="start" fill="#111" font-weight="normal">(6) ธนาคารขยะจึงช่วยให้โรงเรียนสะอาด และสอนให้นักเรียนรู้คุณค่าของสิ่งของ</text>
</svg>
