problems:
- id: thai.literature.literary-analysis.p001
  topics:
  - thai.literature.literary-analysis
  difficulty: 1
  type: order
  stem: เรียงหลักการวิจารณ์วรรณคดีเบื้องต้น 4 ขั้น
  items:
  - อ่านให้เข้าใจและถอดความ
  - วิเคราะห์แยกด้านเนื้อหา วรรณศิลป์ และสังคม
  - วิจารณ์จุดเด่นจุดด้อยโดยยกตัวบท
  - ประเมินคุณค่าและนำไปใช้
  hints:
  - ต้องเข้าใจก่อนจึงแยกส่วนได้
  - ประเมินคุณค่าเป็นขั้นสรุป
  solution: อ่านและถอดความ → วิเคราะห์ → วิจารณ์โดยยกตัวบท → ประเมินคุณค่าและนำไปใช้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.literary-analysis.p002
  topics:
  - thai.literature.literary-analysis
  difficulty: 1
  type: match
  stem: จับคู่รสวรรณคดีกับลักษณะ (ตามที่แบบเรียนไทยนิยมแบ่ง)
  pairs:
  - left: เสาวรจนี
    right: ชมความงาม
  - left: นารีปราโมทย์
    right: เกี้ยวพาราสี แสดงความรัก
  - left: พิโรธวาทัง
    right: โกรธ ตัดพ้อ ประชดประชัน
  - left: สัลลาปังคพิไสย
    right: โศกเศร้า คร่ำครวญ
  hints:
  - พิโรธ แปลว่า โกรธ
  - เสาวรจนี เกี่ยวกับความงาม
  solution: เสาวรจนี → ชมความงาม · นารีปราโมทย์ → เกี้ยวพาราสี · พิโรธวาทัง → โกรธ ตัดพ้อ · สัลลาปังคพิไสย → โศกเศร้า
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.literary-analysis.p003
  topics:
  - thai.literature.literary-analysis
  difficulty: 1
  type: text
  stem: ความคิดหลักที่ผู้แต่งต้องการสื่อผ่านเรื่องทั้งเรื่อง เรียกว่าอะไร
  accepted:
  - แนวคิด
  - แก่นเรื่อง
  - แนวคิดของเรื่อง
  - แก่นของเรื่อง
  - theme
  misconceptions:
  - match: โครงเรื่อง
    feedback: โครงเรื่องคือลำดับเหตุการณ์ ไม่ใช่ความคิดหลัก
  - match: ฉาก
    feedback: ฉากคือสถานที่และเวลา
  - match: ข้อคิด
    feedback: ข้อคิดคือสิ่งที่ผู้อ่านนำไปใช้ ส่วนความคิดหลักของเรื่องมีชื่อเรียกเฉพาะ
  hints:
  - ไม่ใช่ลำดับเหตุการณ์
  - แบบเรียนบางเล่มเรียกว่า แก่นเรื่อง
  solution: เรียกว่า **แนวคิด** หรือ **แก่นเรื่อง**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.literary-analysis.p004
  topics:
  - thai.literature.literary-analysis
  difficulty: 2
  type: mcq
  stem: ดูตัวบทในภาพ บรรทัดที่ 4 วรรคหลัง "เหมือนนกไร้รังเร่อยู่เอกา" ใช้ภาพพจน์ใด และเปรียบอะไรกับอะไร
  figure:
    src: bang-thorani.svg
    alt: ตัวบทนิราศภูเขาทองของสุนทรภู่ ตามวิกิซอร์ซ ตอนผ่านบางธรณี 4 บรรทัด บรรทัด 1 มาถึงบางธรณีทวีโศก ยามวิโยคยากใจให้สะอื้น บรรทัด 2 โอ้สุธาหนาแน่นเป็นแผ่นพื้น ถึงสี่หมื่นสองแสนทั้งแดนไตร บรรทัด 3 เมื่อเคราะห์ร้ายกายเราก็เท่านี้ ไม่มีที่พสุธาจะอาศัย บรรทัด 4 ล้วนหนามเหน็บเจ็บแสบคับแคบใจ เหมือนนกไร้รังเร่อยู่เอกา
  choices:
  - id: a
    text: อุปลักษณ์ เพราะบอกว่ากวีเป็นนก
    feedback: ไม่มีคำว่า เป็น หรือ คือ แต่ใช้ เหมือน
  - id: b
    text: บุคคลวัต เพราะนกทำอย่างคน
    feedback: นกบินเร่ร่อนตามธรรมชาติ ไม่ได้ทำอย่างคน
  - id: c
    text: ไม่มีภาพพจน์ เป็นการเล่าเรื่องนก
    feedback: กวีไม่ได้เล่าเรื่องนก แต่ใช้นกเปรียบตนเอง
  - id: d
    text: อุปมา เปรียบตัวกวีที่ไม่มีที่อยู่กับนกที่ไม่มีรังต้องบินเร่ร่อนตัวเดียว
    correct: true
    feedback: ถูก มีคำว่า เหมือน และบอกได้ว่าเปรียบอะไรกับอะไร
  hints:
  - หาคำเชื่อมการเปรียบ
  - ใครคือสิ่งที่ถูกเปรียบ
  solution: เป็น **อุปมา** (มีคำว่า เหมือน) เปรียบ **ตัวกวีที่ไร้ที่พึ่ง** กับ **นกไร้รัง**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.literary-analysis.p005
  topics:
  - thai.literature.literary-analysis
  difficulty: 2
  type: mcq
  stem: ดูตัวบทในภาพ บรรทัดที่ 3 "ทั้งกบเขียดเกรียดกรีดจังหรีดเรื่อย · พระพายเฉื่อยฉิวฉิววะหวิวหวาม" เด่นด้านวรรณศิลป์เรื่องใด
  figure:
    src: night-field.svg
    alt: ตัวบทนิราศภูเขาทองของสุนทรภู่ ตามวิกิซอร์ซ ตอนค้างคืนกลางทุ่ง 4 บรรทัด บรรทัด 1 แสนวิตกอกเอ๋ยมาอ้างว้าง ในทุ่งกว้างเห็นแต่แขมแซมสลอน บรรทัด 2 จนดึกดาวพราวพร่างกลางอัมพร กาเรียนร่อนร้องก้องเมื่อสองยาม บรรทัด 3 ทั้งกบเขียดเกรียดกรีดจังหรีดเรื่อย พระพายเฉื่อยฉิวฉิววะหวิวหวาม บรรทัด 4 วังเวงจิตคิดคะนึงรำพึงความ ถึงเมื่อยามยังอุดมโสมนัส
  choices:
  - id: a
    text: ใช้อุปลักษณ์เปรียบกบเป็นลม
    feedback: ไม่มีการเปรียบว่าสิ่งหนึ่งเป็นอีกสิ่ง
  - id: b
    text: ใช้คำราชาศัพท์
    feedback: ไม่มีคำราชาศัพท์ในบรรทัดนี้
  - id: c
    text: ใช้คำเลียนเสียงธรรมชาติ ให้ได้ยินเสียงสัตว์และเสียงลมในทุ่งตอนกลางคืน
    correct: true
    feedback: ถูก เกรียดกรีด ฉิวฉิว วะหวิว เป็นคำเลียนเสียง
  - id: d
    text: ใช้คำถามเชิงวาทศิลป์
    feedback: ไม่มีคำถาม
  hints:
  - อ่านออกเสียงคำ เกรียดกรีด ฉิวฉิว
  - คำเหล่านี้เลียนอะไร
  solution: ใช้ **คำเลียนเสียงธรรมชาติ** (แบบเรียนบางเล่มเรียก สัทพจน์) ให้ผู้อ่านได้ยินเสียงทุ่งยามดึก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.literary-analysis.p006
  topics:
  - thai.literature.literary-analysis
  difficulty: 2
  type: mcq
  stem: ข้อใดเป็นการ **วิเคราะห์** วรรณคดี ไม่ใช่เพียงสรุปเรื่อง
  choices:
  - id: a
    text: สุนทรภู่ล่องเรือผ่านบางเดื่อแล้วไปต่อ
    feedback: เป็นการเล่าเหตุการณ์
  - id: b
    text: ตอนผ่านบางเดื่อ กวีใช้อุปมาเทียบคนพาลกับมะเดื่อที่ข้างนอกดูดีแต่ข้างในมีแมลง ทำให้คำสอนเห็นภาพและจำง่าย
    correct: true
    feedback: ถูก บอกกลวิธี ยกตัวบท และอธิบายผล
  - id: c
    text: สุนทรภู่ไปอยุธยาเพื่อนมัสการพระเจดีย์
    feedback: เป็นการสรุปเรื่อง
  - id: d
    text: นิราศภูเขาทองมีหลายตำบล
    feedback: บอกข้อมูล ไม่ได้วิเคราะห์
  hints:
  - การวิเคราะห์ตอบว่า อย่างไร และ ได้ผลอย่างไร
  - ดูว่ามีการอธิบายกลวิธีหรือไม่
  solution: ข้อแรก **ระบุกลวิธี ยกตัวบท และบอกผลต่อผู้อ่าน** จึงเป็นการวิเคราะห์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.literary-analysis.p007
  topics:
  - thai.literature.literary-analysis
  difficulty: 3
  type: mcq
  stem: ดูตัวบทในภาพ ทั้ง 4 บรรทัดแสดงรสวรรณคดีใดเด่นที่สุด
  figure:
    src: night-field.svg
    alt: ตัวบทนิราศภูเขาทองของสุนทรภู่ ตามวิกิซอร์ซ ตอนค้างคืนกลางทุ่ง 4 บรรทัด บรรทัด 1 แสนวิตกอกเอ๋ยมาอ้างว้าง ในทุ่งกว้างเห็นแต่แขมแซมสลอน บรรทัด 2 จนดึกดาวพราวพร่างกลางอัมพร กาเรียนร่อนร้องก้องเมื่อสองยาม บรรทัด 3 ทั้งกบเขียดเกรียดกรีดจังหรีดเรื่อย พระพายเฉื่อยฉิวฉิววะหวิวหวาม บรรทัด 4 วังเวงจิตคิดคะนึงรำพึงความ ถึงเมื่อยามยังอุดมโสมนัส
  choices:
  - id: a
    text: สัลลาปังคพิไสย เพราะมีคำ แสนวิตก อ้างว้าง วังเวง และรำพึงถึงความสุขในอดีต
    correct: true
    feedback: ถูก
  - id: b
    text: เสาวรจนี เพราะชมความงามของดาว
    feedback: มีภาพดาวพราว แต่ทั้งตอนเน้นความเหงาเศร้า
  - id: c
    text: พิโรธวาทัง
    feedback: ไม่มีถ้อยคำโกรธหรือตัดพ้อใคร
  - id: d
    text: นารีปราโมทย์
    feedback: ไม่ได้เกี้ยวพาราสีใคร
  hints:
  - หาคำที่บอกอารมณ์
  - อ้างว้าง วังเวง เป็นอารมณ์แบบใด
  solution: คำ **แสนวิตก อ้างว้าง วังเวง** และการรำพึงถึงอดีตที่สุขสบาย แสดงรส **สัลลาปังคพิไสย**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.literary-analysis.p008
  topics:
  - thai.literature.literary-analysis
  difficulty: 3
  type: mcq
  stem: ดูตัวบทในภาพ **ฉาก** ของตอนนี้คืออะไร และช่วยเสริมอารมณ์อย่างไร
  figure:
    src: night-field.svg
    alt: ตัวบทนิราศภูเขาทองของสุนทรภู่ ตามวิกิซอร์ซ ตอนค้างคืนกลางทุ่ง 4 บรรทัด บรรทัด 1 แสนวิตกอกเอ๋ยมาอ้างว้าง ในทุ่งกว้างเห็นแต่แขมแซมสลอน บรรทัด 2 จนดึกดาวพราวพร่างกลางอัมพร กาเรียนร่อนร้องก้องเมื่อสองยาม บรรทัด 3 ทั้งกบเขียดเกรียดกรีดจังหรีดเรื่อย พระพายเฉื่อยฉิวฉิววะหวิวหวาม บรรทัด 4 วังเวงจิตคิดคะนึงรำพึงความ ถึงเมื่อยามยังอุดมโสมนัส
  choices:
  - id: a
    text: ในวังตอนเช้า มีผู้คนมากมาย
    feedback: ตัวบทบอกว่าอยู่ในทุ่งกว้างยามดึก
  - id: b
    text: ตลาดริมน้ำตอนกลางวัน
    feedback: ไม่ตรงกับตัวบท
  - id: c
    text: ฉากไม่มีผลต่ออารมณ์ของเรื่อง
    feedback: ฉากช่วยสร้างบรรยากาศและอารมณ์
  - id: d
    text: กลางทุ่งกว้างยามดึก มีแต่ต้นแขม เสียงสัตว์ และลม ความโล่งเปล่าเสริมความรู้สึกอ้างว้างของกวี
    correct: true
    feedback: ถูก ฉากกับอารมณ์สอดคล้องกัน
  hints:
  - หาคำบอกสถานที่และเวลา
  - ทุ่งกว้าง ดึก สองยาม
  solution: ฉากคือ **ทุ่งกว้างยามดึก** ความเงียบเปล่าเสริมรส **ความอ้างว้าง**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.literary-analysis.p009
  topics:
  - thai.literature.literary-analysis
  difficulty: 3
  type: mcq
  stem: นิราศภูเขาทองกล่าวว่า "ไปพ้นวัดทัศนาริมท่าน้ำ · แพประจำจอดรายเขาขายของ / มีแพรผ้าสารพัดสีม่วงตอง · ทั้งสิ่งของขาวเหลืองเครื่องสำเภา" ตอนนี้สะท้อน **วิถีชีวิต** ในอดีตอย่างไร
  choices:
  - id: a
    text: ผู้คนเดินทางด้วยรถไฟ
    feedback: ไม่มีในตัวบท
  - id: b
    text: ชาวบ้านไม่ค้าขาย ปลูกข้าวอย่างเดียว
    feedback: ขัดกับตัวบทที่บอกว่ามีแพขายของ
  - id: c
    text: ผู้คนค้าขายทางน้ำ มีแพร้านค้าจอดริมแม่น้ำ ขายผ้าและสินค้าที่มากับเรือสำเภา
    correct: true
    feedback: ถูก ตัวบทบอกแพขายของและเครื่องสำเภา
  - id: d
    text: ตลาดอยู่ในห้างสรรพสินค้า
    feedback: ไม่ตรงกับยุคสมัย
  hints:
  - แพประจำจอดราย เขาทำอะไร
  - เครื่องสำเภา คือสินค้าที่มากับอะไร
  solution: สะท้อน **การค้าขายทางน้ำ** มีแพร้านค้าริมน้ำและสินค้าที่มากับเรือสำเภา
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.literary-analysis.p010
  topics:
  - thai.literature.literary-analysis
  difficulty: 3
  type: numeric
  stem: สุนทรภู่แต่งนิราศภูเขาทองเมื่อ พ.ศ. 2371 ในตัวบทกล่าวถึงการพระราชทานนาม "ปทุมธานี" ซึ่งประวัติจังหวัดระบุว่าเกิดเมื่อ พ.ศ. 2358 เหตุการณ์ทั้งสองห่างกันกี่ปี
  answer:
    value: 13
    unit: ปี
  misconceptions:
  - match: 14
    feedback: นับรวมทั้งปีต้นและปีปลาย ระยะห่างคือ 2371 − 2358
  - match: 4729
    feedback: บวกปีเข้าด้วยกัน ต้องลบ
  hints:
  - ระยะห่าง = ปีหลัง − ปีก่อน
  - 2371 − 2358
  solution: $2371 - 2358 = 13$ ปี กวีจึงเขียนถึงชื่อเมืองที่ตั้งได้ไม่นาน และยังจำได้ว่าเป็นพระราชทานจากกษัตริย์ที่ตนเคยรับใช้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.literary-analysis.p011
  topics:
  - thai.literature.literary-analysis
  difficulty: 4
  type: match
  stem: จับคู่ตัวบทจากนิราศภูเขาทองกับ **คุณค่า** ที่เด่นที่สุด
  pairs:
  - left: ดูน้ำวิ่งกลิ้งเชี่ยวเป็นเกลียวกลอก · กลับกระฉอกฉาดฉันฉวัดเฉวียน
    right: ด้านวรรณศิลป์ (เล่นเสียงให้เห็นภาพน้ำวน)
  - left: ถึงเกร็ดย่านบ้านมอญแต่ก่อนเก่า · ผู้หญิงเกล้ามวยงามตามภาษา
    right: ด้านสังคมและวัฒนธรรม (ชุมชนมอญและการแต่งกาย)
  - left: เป็นผู้ดีมีมากแล้วยากเย็น · คิดก็เป็นอนิจจังเสียทั้งนั้น
    right: ด้านเนื้อหา (แนวคิดเรื่องความไม่เที่ยง)
  - left: เหมือนคนพาลหวานนอกย่อมขมใน · อุปไมยเหมือนมะเดื่อเหลือระอา
    right: ด้านการนำไปใช้ (ระวังคนที่ดีแต่ภายนอก)
  hints:
  - เสียงและภาพ = วรรณศิลป์
  - วิถีชีวิตของผู้คน = สังคม ส่วนคำสอนที่ใช้กับชีวิต = การนำไปใช้
  solution: น้ำวน → วรรณศิลป์ · บ้านมอญ → สังคม · อนิจจัง → เนื้อหา · มะเดื่อ → การนำไปใช้ (ตัวบทหนึ่งมีคุณค่าได้หลายด้าน แต่ด้านนี้เด่นที่สุด)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.literary-analysis.p012
