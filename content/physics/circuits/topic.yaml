id: physics.electricity.circuits
subject: physics
title: { th: วงจรอนุกรม วงจรขนาน และวงจรผสม, en: Series and parallel circuits }
summary: หาความต้านทานรวมของตัวต้านทานที่ต่ออนุกรม ขนาน และผสม แบ่งกระแสและแรงดันในวงจร และเข้าใจว่าทำไมเครื่องใช้ไฟฟ้าในบ้านต่อแบบขนาน
difficulty: 5
minutes: 40
prerequisites: [physics.electricity.current-voltage, math.number.fractions]
encompasses:
  - { id: physics.electricity.current-voltage, weight: 0.6 }
  - { id: math.number.fractions, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: symbols.svg
    alt: "ตารางสัญลักษณ์วงจรไฟฟ้า 8 ชนิด: เซลล์ไฟฟ้าเป็นขีดยาวบางคู่กับขีดสั้นหนา ขีดยาวคือขั้วบวก แบตเตอรี่เป็นเซลล์หลายคู่ต่อกัน ตัวต้านทานเป็นเส้นซิกแซก หลอดไฟเป็นวงกลมมีกากบาท สวิตช์เป็นเส้นที่ยกขึ้นจากจุดหนึ่ง แอมมิเตอร์เป็นวงกลมมีตัว A โวลต์มิเตอร์เป็นวงกลมมีตัว V และจุดต่อสายไฟเป็นจุดทึบตรงที่สายมาบรรจบกัน"
    caption: "สัญลักษณ์มาตรฐานที่ใช้เขียนแผนภาพวงจร"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: อ่านค่าแอมมิเตอร์และโวลต์มิเตอร์ในวงจรอนุกรม
    problem: "จากแผนภาพวงจร แบตเตอรี่ $6\\ \\mathrm{V}$ ต่ออนุกรมกับตัวต้านทาน $10\\ \\Omega$ และ $20\\ \\Omega$ แอมมิเตอร์และโวลต์มิเตอร์จะอ่านค่าได้เท่าใด"
    figure:
      src: we-series.svg
      alt: "แผนภาพวงจรอนุกรม แบตเตอรี่ 6 V อยู่ด้านซ้าย สายด้านบนมีตัวต้านทาน 10 โอห์มต่อกับ 20 โอห์ม สายด้านล่างมีแอมมิเตอร์ และมีโวลต์มิเตอร์ต่อคร่อมตัวต้านทาน 20 โอห์ม"
    steps:
      - text: "ตัวต้านทานต่อเรียงเป็นทางเดียว จึงเป็นอนุกรม: $R = 10 + 20 = 30\\ \\Omega$"
      - text: "กระแสในวงจร $I = \\dfrac{V}{R} = \\dfrac{6\\ \\mathrm{V}}{30\\ \\Omega} = 0.2\\ \\mathrm{A}$ แอมมิเตอร์จึงอ่านได้ $0.2\\ \\mathrm{A}$"
        why: "ในวงจรอนุกรมกระแสเท่ากันทุกจุด จะวางแอมมิเตอร์ตรงไหนของวงก็อ่านได้เท่ากัน"
      - text: "โวลต์มิเตอร์คร่อมตัวต้านทาน $20\\ \\Omega$ อ่านได้ $V_2 = IR_2 = (0.2)(20) = 4\\ \\mathrm{V}$"
        why: "ใช้กระแส $0.2\\ \\mathrm{A}$ คูณความต้านทานของตัวที่ถูกคร่อมเท่านั้น ไม่ใช่ $6\\ \\mathrm{V}$ ของแบตเตอรี่"
      - text: "ตรวจด้วยกฎของวงปิด: $V_1 = (0.2)(10) = 2\\ \\mathrm{V}$ และ $2 + 4 = 6\\ \\mathrm{V}$ เท่ากับแบตเตอรี่ ✓"
    answer: "แอมมิเตอร์อ่านได้ $0.2\\ \\mathrm{A}$ และโวลต์มิเตอร์อ่านได้ $4\\ \\mathrm{V}$"
  - { type: check, problem: phy.circuit.p016, prompt: "ใช้กฎของจุดต่อ" }
  - type: worked-example
    title: วิเคราะห์วงจรผสมให้ครบทุกตัว
    problem: "จากแผนภาพ ตัวต้านทาน $4\\ \\Omega$ ต่ออนุกรมกับกลุ่มขนานของ $6\\ \\Omega$ และ $12\\ \\Omega$ ทั้งหมดต่อกับแบตเตอรี่ $24\\ \\mathrm{V}$ หากระแสและความต่างศักย์ของตัวต้านทานทุกตัว"
    figure:
      src: we-mixed.svg
      alt: "แผนภาพวงจรผสม แบตเตอรี่ 24 V อยู่ด้านซ้าย สายด้านบนมีตัวต้านทาน 4 โอห์ม แล้วแยกเป็นสองทางแนวตั้งที่มีตัวต้านทาน 6 โอห์มและ 12 โอห์มต่อขนานกัน ก่อนกลับมารวมที่สายด้านล่าง"
    steps:
      - text: "ยุบกลุ่มขนานก่อน: $\\dfrac{6 \\times 12}{6 + 12} = \\dfrac{72}{18} = 4\\ \\Omega$"
        why: "กลุ่มขนานต้องถูกแทนด้วยตัวต้านทานตัวเดียวก่อน จึงจะรวมแบบอนุกรมกับ $4\\ \\Omega$ ได้"
      - text: "ความต้านทานรวม $R = 4 + 4 = 8\\ \\Omega$ กระแสรวม $I = \\dfrac{24}{8} = 3\\ \\mathrm{A}$ ซึ่งไหลผ่านตัว $4\\ \\Omega$ ทั้งหมด"
      - text: "ความต่างศักย์คร่อมตัว $4\\ \\Omega$: $(3)(4) = 12\\ \\mathrm{V}$ เหลือคร่อมกลุ่มขนาน $24 - 12 = 12\\ \\mathrm{V}$"
        why: "กฎของวงปิด: ความต่างศักย์ที่ตกคร่อมทุกส่วนตามทางเดินหนึ่งรวมกันได้ $24\\ \\mathrm{V}$"
      - text: "กระแสแยก: $I_6 = \\dfrac{12}{6} = 2\\ \\mathrm{A}$ และ $I_{12} = \\dfrac{12}{12} = 1\\ \\mathrm{A}$"
        why: "ตัวต้านทานที่ขนานกันได้ความต่างศักย์เท่ากันคือ $12\\ \\mathrm{V}$ ไม่ใช่ $24\\ \\mathrm{V}$"
      - text: "ตรวจด้วยกฎของจุดต่อ: $2 + 1 = 3\\ \\mathrm{A}$ เท่ากับกระแสรวม ✓"
    answer: "ตัว $4\\ \\Omega$: $3\\ \\mathrm{A}$, $12\\ \\mathrm{V}$ · ตัว $6\\ \\Omega$: $2\\ \\mathrm{A}$, $12\\ \\mathrm{V}$ · ตัว $12\\ \\Omega$: $1\\ \\mathrm{A}$, $12\\ \\mathrm{V}$"
  - { type: check, problem: phy.circuit.p022, prompt: "ลองออกแบบวงจรเอง" }
  - type: simulation
    title: ชุดต่อวงจรไฟฟ้ากระแสตรง (PhET Circuit Construction Kit DC)
    url: https://phet.colorado.edu/en/simulations/circuit-construction-kit-dc
    provider: phet
    note: ต่อหลอดไฟสองดวงแบบอนุกรมแล้วถอดดวงหนึ่งออก ดวงที่เหลือจะดับ จากนั้นต่อแบบขนานแล้วถอดดวงหนึ่ง ดวงที่เหลือยังสว่างเท่าเดิม ใช้แอมมิเตอร์และโวลต์มิเตอร์ในชุดวัดค่าเปรียบเทียบกับที่คำนวณ
  - type: interactive
    title: ความต้านทานรวมแบบอนุกรมและแบบขนาน
    caption: แกนนอนคือค่าของตัวต้านทานตัวที่สอง R₂ (Ω) แกนตั้งคือความต้านทานรวม (Ω) เส้นตรงคือแบบอนุกรม R₁ + R₂ เส้นโค้งคือแบบขนาน R₁R₂/(R₁ + R₂) ตั้งค่า R₁ ด้วยแถบเลื่อน a แล้วสังเกตว่าเส้นขนานอยู่ต่ำกว่า a เสมอ (น้อยกว่าตัวที่น้อยที่สุด) และเมื่อ R₂ = a ความต้านทานขนานเท่ากับครึ่งหนึ่งของ a พอดี
    widget:
      kind: function-plot
      functions: ["a + x", "\\frac{a x}{a + x}"]
      sliders:
        - { name: a, min: 1, max: 10, step: 1, value: 6, label: ความต้านทาน R₁ (Ω) }
      x: [0, 20]
      y: [0, 30]
glossary:
  - { term: วงจรอนุกรม, definition: "วงจรที่อุปกรณ์ต่อเรียงกันเป็นทางเดียว กระแสเท่ากันทุกตัว ความต้านทานรวม $R = R_1 + R_2 + \\dots$" }
  - { term: วงจรขนาน, definition: "วงจรที่อุปกรณ์ต่อคร่อมจุดสองจุดเดียวกัน ความต่างศักย์เท่ากันทุกตัว $\\dfrac{1}{R} = \\dfrac{1}{R_1} + \\dfrac{1}{R_2} + \\dots$" }
  - { term: เบรกเกอร์, definition: "อุปกรณ์ตัดวงจรอัตโนมัติเมื่อกระแสรวมเกินค่าที่กำหนด ต่ออนุกรมกับสายเมนของวงจรในบ้าน" }
  - { term: การลัดวงจร, definition: "การมีทางที่แทบไม่มีความต้านทานต่อคร่อมอุปกรณ์หรือแหล่งกำเนิด กระแสจึงไหลผ่านทางนั้นแทนและกระแสรวมสูงขึ้นมาก" }
flashcards:
  - { front: "ความต้านทานรวมของ $R_1$ และ $R_2$ ที่ต่อขนาน (สองตัว)", back: "$R = \\dfrac{R_1 R_2}{R_1 + R_2}$ (ผลคูณหารด้วยผลบวก)" }
  - { front: "ในวงจรอนุกรม ปริมาณใดเท่ากันทุกตัว และในวงจรขนาน ปริมาณใดเท่ากันทุกตัว", back: "อนุกรม: กระแสเท่ากัน · ขนาน: ความต่างศักย์เท่ากัน" }
  - { front: "ต่อตัวต้านทาน $6\\ \\Omega$ สองตัวแบบขนาน ได้ความต้านทานรวมเท่าใด", back: "$3\\ \\Omega$ (ตัวต้านทานเท่ากัน $n$ ตัวต่อขนานได้ $\\tfrac{R}{n}$)" }
  - { front: "ทำไมเครื่องใช้ไฟฟ้าในบ้านต่อแบบขนาน", back: "ทุกเครื่องได้ความต่างศักย์ $220\\ \\mathrm{V}$ เต็ม และเปิดปิดแยกกันได้ เครื่องหนึ่งเสียเครื่องอื่นยังใช้ได้" }
  - { front: "กฎของจุดต่อและกฎของวงปิด", back: "กระแสเข้าจุดต่อ = กระแสออก · ผลรวมความต่างศักย์ที่ตกคร่อมอุปกรณ์รอบวงปิด = ความต่างศักย์ของแบตเตอรี่" }
