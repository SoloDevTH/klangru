    solution: "$t = \\dfrac{840\\,000\\ \\mathrm{J}}{50\\ \\mathrm{W}} = 16\\,800\\ \\mathrm{s} = \\dfrac{16\\,800}{3600} \\approx 4.67$ ชั่วโมง"
