    misconceptions:
      - { match: 2, feedback: "2 มาจาก 1 ÷ 0.5 ซึ่งใช้ความเสี่ยงสัมพัทธ์ ต้องใช้ความเสี่ยงสัมบูรณ์ที่ลดลง" }
      - { match: 250, feedback: "250 มาจาก 1 ÷ 0.004 ซึ่งคือความเสี่ยงเดิม ต้องหาความเสี่ยงที่ลดลงจริงก่อน" }
    hints:
      - "ความเสี่ยงใหม่ = 0.4% × (1 − 0.5)"
