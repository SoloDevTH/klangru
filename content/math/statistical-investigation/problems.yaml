      - "ยังต้องเป็นคำถามที่คำตอบแตกต่างกัน"
    solution: "ข้อแรกระบุกลุ่ม (นักเรียน ม.1 ในโรงเรียน) สิ่งที่วัดและหน่วย (ชั่วโมงต่อวันในวันเรียน) และคำตอบแตกต่างกันในแต่ละคน"
