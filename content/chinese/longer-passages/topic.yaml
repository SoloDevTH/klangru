id: chinese.reading.longer-passages
subject: chinese
title:
  th: การอ่านเรื่องเล่าและบทความสั้นภาษาจีนราว 500 ตัวอักษร
  en: Reading Chinese stories and short articles of about 500 characters
summary: อ่านเรื่องเล่าและข้อความอธิบายที่ยาวไม่เกิน 500 ตัวอักษร หาใจความและรายละเอียด ตามลำดับเหตุการณ์ด้วย 首先 后来 最后 เดาคำจากส่วนประกอบและบริบท และตอบคำถาม
difficulty: 5.5
minutes: 40
