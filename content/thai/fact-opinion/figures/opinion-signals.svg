<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" font-family="sans-serif">
<title>คำที่มักบอกว่าเป็นข้อคิดเห็น</title>
<defs></defs>
<rect x="0" y="0" width="860" height="260" fill="#fff"/>
<text x="20.0" y="32.0" font-size="19" text-anchor="start" fill="#1f5fbf" font-weight="bold">ข้อเท็จจริง ตรวจสอบได้ · ข้อคิดเห็น เป็นความเชื่อ ความรู้สึก การประเมิน</text>
<rect x="20.0" y="55.0" width="400.0" height="190.0" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="220.0" y="88.0" font-size="20" text-anchor="middle" fill="#1565c0" font-weight="bold">ข้อเท็จจริง</text>
<text x="220.0" y="125.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">ตัวเลข วันที่ สถานที่</text>
<text x="220.0" y="155.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">ผลการวัด ผลสำรวจ</text>
<text x="220.0" y="185.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">เหตุการณ์ที่เกิดขึ้นแล้ว</text>
<text x="220.0" y="215.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">ถาม: ตรวจได้ไหมว่าจริง?</text>
<rect x="440.0" y="55.0" width="400.0" height="190.0" rx="10" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
<text x="640.0" y="88.0" font-size="20" text-anchor="middle" fill="#ad1457" font-weight="bold">ข้อคิดเห็น</text>
<text x="640.0" y="125.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">ควร · น่าจะ · คงจะ · อาจ</text>
<text x="640.0" y="155.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">คิดว่า · เชื่อว่า · เห็นว่า</text>
<text x="640.0" y="185.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">ดีที่สุด · สวย · อร่อย · แย่</text>
<text x="640.0" y="215.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">คาดการณ์อนาคต · ข้อเสนอแนะ</text>
</svg>
