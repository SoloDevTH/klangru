    solution: "$\\dfrac{F_e}{F_g} = \\dfrac{(9.0 \\times 10^9)(1.6 \\times 10^{-19})^2}{(6.67 \\times 10^{-11})(9.11 \\times 10^{-31})(1.67 \\times 10^{-27})} = \\dfrac{2.30 \\times 10^{-28}}{1.01 \\times 10^{-67}} \\approx 2.27 \\times 10^{39}$"
