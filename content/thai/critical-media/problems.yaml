- id: thai.listening.critical-media.p013
  topics:
  - thai.listening.critical-media
  difficulty: 4
  type: numeric
  stem: โฆษณาหนึ่ง (สมมติ) บอกว่า "ยอดขายเพิ่มขึ้นร้อยละ 200" แต่ตัวเลขจริงคือยอดขายจาก 150 ชิ้นเป็น 300 ชิ้น ยอดขายเพิ่มขึ้นจริง **ร้อยละเท่าไร**
  answer:
    value: 100
    unit: '%'
  misconceptions:
  - match: 200
    feedback: 300 เป็น 2 เท่าของ 150 แต่ เพิ่มขึ้น คิดจากส่วนที่เพิ่ม 150 ชิ้น
  - match: 150
    feedback: เป็นจำนวนชิ้นที่เพิ่ม ต้องเทียบเป็นร้อยละ
  hints:
  - ส่วนที่เพิ่ม = 300 − 150
  - ร้อยละที่เพิ่ม = ส่วนที่เพิ่ม ÷ ค่าเดิม × 100
  solution: เพิ่ม $300 - 150 = 150$ ชิ้น · $150 \div 150 \times 100 = 100$ ร้อยละ (เพิ่มเป็น 2 เท่า = เพิ่มร้อยละ 100)
