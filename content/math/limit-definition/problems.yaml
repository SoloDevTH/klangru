    stem: "จงหา $\\delta$ ที่มากที่สุดสำหรับ $\\lim_{(x,y)\\to(0,0)}(x^2+y^2)=0$ เมื่อ $\\varepsilon=0.01$ โดยใช้ย่านวงกลม $\\sqrt{x^2+y^2}<\\delta$ (ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 0.1, tolerance: 0.0001 }
    hints:
      - "ให้ $r=\\sqrt{x^2+y^2}$ จะได้ $x^2+y^2=r^2$"
      - "ต้องการ $r^2<0.01$"
      - "ถอดรากที่สองทั้งสองข้าง"
    misconceptions:
      - { match: 0.01, feedback: "0.01 คือ $\\varepsilon$ เอง แต่ $x^2+y^2=r^2<\\delta^2$ จึงต้องการ $\\delta=\\sqrt{\\varepsilon}$" }
    solution: "$|x^2+y^2-0|=r^2<\\delta^2$ ต้องการ $\\delta^2\\le 0.01$ จึงเลือก $\\delta=0.1$"
