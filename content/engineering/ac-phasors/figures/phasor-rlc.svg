<text x="630.0" y="285.0" text-anchor="middle" fill="#15211e" font-size="13">I นำหน้า V อยู่ 90°</text>
<text x="630.0" y="310.0" text-anchor="middle" fill="#1f5fa8" font-size="14">Z = 1/(jωC) = −j/(ωC)</text>
