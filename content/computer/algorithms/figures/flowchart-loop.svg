<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 600" width="470" height="600" font-family="sans-serif" font-size="15">
  <title>ผังงานที่มีการวนซ้ำ: บวก n เข้า total ขณะที่ n ไม่เกิน 9 และเพิ่ม n ทีละ 2</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15211e"/></marker></defs>
  <rect x="0" y="0" width="470" height="600" fill="#ffffff"/>
  <rect x="130.0" y="18.0" width="120" height="44" rx="22.0" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="190" y="45" text-anchor="middle" font-size="15" fill="#15211e" font-weight="normal">เริ่ม</text>
  <polyline points="190,62 190,98" fill="none" stroke="#15211e" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="95.0" y="100.0" width="190" height="50" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="190" y="130" text-anchor="middle" font-size="15" fill="#15211e" font-weight="normal">n = 1, total = 0</text>
  <polyline points="190,150 190,192" fill="none" stroke="#15211e" stroke-width="2" marker-end="url(#arr)"/>
  <polygon points="190,192.0 275.0,240 190,288.0 105.0,240" fill="#fff4e8" stroke="#15211e" stroke-width="2"/>
  <text x="190" y="245" text-anchor="middle" font-size="15" fill="#15211e" font-weight="normal">n &lt;= 9 ?</text>
  <polyline points="190,288 190,338" fill="none" stroke="#15211e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="204" y="315" text-anchor="start" font-size="14" fill="#b4521f" font-weight="bold">ใช่</text>
  <rect x="85.0" y="340.0" width="210" height="50" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="190" y="370" text-anchor="middle" font-size="15" fill="#15211e" font-weight="normal">total = total + n</text>
  <polyline points="190,390 190,432" fill="none" stroke="#15211e" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="105.0" y="433.0" width="170" height="50" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="190" y="463" text-anchor="middle" font-size="15" fill="#15211e" font-weight="normal">n = n + 2</text>
  <polyline points="105,458 30,458 30,240 103,240" fill="none" stroke="#15211e" stroke-width="2" marker-end="url(#arr)"/>
  <polyline points="275,240 380,240 380,470" fill="none" stroke="#15211e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="290" y="231" text-anchor="start" font-size="14" fill="#b4521f" font-weight="bold">ไม่ใช่</text>
  <polygon points="326.0,472.0 450.0,472.0 434.0,522.0 310.0,522.0" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="380" y="502" text-anchor="middle" font-size="15" fill="#15211e" font-weight="normal">แสดง total</text>
  <polyline points="380,522 380,548" fill="none" stroke="#15211e" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="325.0" y="550.0" width="110" height="40" rx="20.0" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="380" y="575" text-anchor="middle" font-size="15" fill="#15211e" font-weight="normal">จบ</text>
</svg>
