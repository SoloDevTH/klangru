      - { match: 0.225, feedback: "0.225 คือหญิง **และ** ชอบกีฬา ($\\frac{9}{40}$) โจทย์ถาม หรือ ซึ่งรวมทุกคนที่เข้าเงื่อนไขอย่างน้อยหนึ่งอย่าง" }
    solution: "$\\frac{20}{40} + \\frac{23}{40} - \\frac{9}{40} = \\frac{34}{40} = 0.85$ หรือนับตรง ๆ: หญิง 20 คน บวกชายที่ชอบกีฬา 14 คน รวม 34 คน ตรวจด้วยเหตุการณ์ตรงข้าม: ชายที่ไม่ชอบกีฬา 6 คน $1 - \\frac{6}{40} = 0.85$ ✓"
