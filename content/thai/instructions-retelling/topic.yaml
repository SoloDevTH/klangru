id: thai.listening.instructions-retelling
subject: thai
title: { th: "การฟังคำแนะนำ คำสั่ง และเล่าเรื่องที่ฟัง", en: "Following spoken instructions and retelling" }
summary: แยกคำสั่งกับคำแนะนำ จับคำสำคัญและคำบอกลำดับเพื่อทำตามคำสั่งหลายขั้น ตอบคำถาม เล่ารายละเอียด และเล่าเรื่องย่อจากเรื่องที่ฟังและดู
difficulty: 1.5
minutes: 30
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - type: figure
    src: listening-steps.svg
    alt: "แผนภาพ 3 ช่วงของการฟัง เรียงจากซ้ายไปขวาด้วยลูกศร 1. ก่อนฟัง: วางของในมือ มองผู้พูด ตั้งใจฟังให้จบ 2. ขณะฟัง: จับคำสำคัญ ใคร ทำอะไร ที่ไหน เมื่อไร อย่างไร คำบอกลำดับ ก่อน แล้ว สุดท้าย ตัวเลข และคำว่า ห้าม อย่า 3. หลังฟัง: ทวนในใจหรือพูดทวน ไม่เข้าใจ ยกมือถาม ทำตามทีละขั้น"
    caption: "ฟังให้ครบทั้งก่อน ขณะ และหลังฟัง"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: จดคำสำคัญจากประกาศ
    problem: "ข้อความที่ได้ยิน: \"พรุ่งนี้วันพุธ คุณหมอฟันจะมาตรวจฟันนักเรียน ป.1 ที่ห้องประชุม ตอนสิบโมงเช้า ทุกคนแปรงฟันหลังอาหารเช้ามาให้เรียบร้อย ไม่ต้องนำแปรงสีฟันมา\" ต้องจำอะไรบ้าง"
    steps:
      - text: "ใคร: นักเรียน ป.1 (เราอยู่ในกลุ่มนี้ไหม)"
      - text: "ทำอะไร ที่ไหน เมื่อไร: ตรวจฟัน ที่ห้องประชุม วันพุธ สิบโมงเช้า"
      - text: "ต้องเตรียมอะไร: แปรงฟันหลังอาหารเช้า"
      - text: "ห้ามหรือไม่ต้องทำอะไร: ไม่ต้องนำแปรงสีฟันมา"
        why: "คำว่า ไม่ต้อง มักอยู่ท้ายประโยค ถ้าฟังไม่จบจะพลาด"
    answer: "ป.1 ตรวจฟัน ห้องประชุม วันพุธ 10 โมง แปรงฟันมาก่อน ไม่ต้องนำแปรงสีฟัน"
  - { type: check, problem: thai.listening.instructions-retelling.p003, prompt: "ลองให้คนอื่นอ่านให้ฟังโดยไม่ดูข้อความ" }
  - type: figure
    src: school-map.svg
    alt: "แผนผังโรงเรียน ทิศเหนืออยู่ด้านบน ประตูโรงเรียนอยู่ด้านล่างตรงกลาง ข้างประตูทางซ้ายมีป้อมยาม จากประตูมีทางเดินตรงขึ้นไปทางเหนือถึงเสาธง เหนือเสาธงคือสนามฟุตบอล ทางเดินฝั่งตะวันตก: ด้านเหนือคือห้องสมุด ด้านใต้คืออาคาร ๑ ทางเดินฝั่งตะวันออก ด้านเหนือคือโรงอาหาร (หลังแรก) และห้องพยาบาล (หลังที่สอง) ด้านใต้คือห้องดนตรี (หลังแรก) และห้องคอม (หลังที่สอง)"
    caption: "แผนผังโรงเรียน (ใช้ในโจทย์ฟังคำบอกทาง)"
  - type: worked-example
    title: ฟังคำบอกทาง
    problem: "ดูแผนผัง ข้อความที่ได้ยิน: \"เดินเข้าประตู ตรงไปถึงเสาธง เลี้ยวขวา อาคารหลังแรกทางขวามือ\" ไปถึงที่ใด"
    steps:
      - text: "เดินเข้าประตู มุ่งหน้าขึ้นไปทางเหนือ ถึงเสาธง"
      - text: "เลี้ยวขวา ตอนนี้หันหน้าไปทางตะวันออก"
        why: "ซ้ายขวาขึ้นกับทิศที่เราหันหน้า ไม่ใช่ซ้ายขวาของแผนผัง"
      - text: "เมื่อหันไปทางตะวันออก ขวามือคือฝั่งใต้"
      - text: "อาคารหลังแรกฝั่งใต้คือห้องดนตรี"
    answer: "ห้องดนตรี"
  - { type: check, problem: thai.listening.instructions-retelling.p008, prompt: "เลี้ยวซ้ายแล้วหันไปทางไหน" }
glossary:
  - { term: คำสั่ง, definition: "ถ้อยคำที่บอกให้ทำหรือห้ามทำ มักมีคำว่า จง ให้ ห้าม อย่า" }
  - { term: คำแนะนำ, definition: "ถ้อยคำที่บอกวิธีที่ดีให้เลือกทำ มักมีคำว่า ควร ลอง น่าจะ" }
  - { term: คำบอกลำดับ, definition: "คำที่บอกว่าทำอะไรก่อนหลัง เช่น ก่อนอื่น แล้ว จากนั้น สุดท้าย" }
  - { term: เรื่องย่อ, definition: "การเล่าเรื่องให้สั้นแต่ได้ใจความ เรียงลำดับ ใช้ภาษาของตนเอง ไม่ใส่ความเห็น" }
  - { term: ข้อคิด, definition: "บทเรียนจากเรื่องที่นำไปใช้ในชีวิตจริงได้" }
flashcards:
  - { front: "คำสั่งกับคำแนะนำต่างกันอย่างไร", back: "คำสั่ง = ต้องทำ/ห้ามทำ (จง ให้ ห้าม อย่า) · คำแนะนำ = วิธีที่ดี เลือกทำได้ (ควร ลอง)" }
  - { front: "คำสำคัญที่ต้องจับขณะฟัง", back: "ใคร ทำอะไร ที่ไหน เมื่อไร อย่างไร คำบอกลำดับ ตัวเลข และคำห้าม" }
  - { front: "ฟังแล้วไม่เข้าใจควรทำอย่างไร", back: "รอให้ผู้พูดพูดจบ แล้วยกมือถามอย่างสุภาพ" }
  - { front: "เรื่องย่อที่ดีมีลักษณะอย่างไร", back: "สั้น เรียงตามลำดับ ใช้ภาษาของเราเอง ไม่ใส่ความเห็น" }
