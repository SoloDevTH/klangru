problems:
- id: thai.listening.critical-media.p001
  topics:
  - thai.listening.critical-media
  difficulty: 1
  type: mcq
  stem: 'ฟังประกาศเสียงตามสาย (สมมติ): "พรุ่งนี้โรงเรียนจัดตรวจสุขภาพฟันที่ห้องพยาบาล เวลาเก้าโมง ฟันสวยทำให้ทุกคนมั่นใจที่สุด" ข้อใดเป็น **ข้อเท็จจริง**'
  choices:
  - id: a
    text: ฟันสวยทำให้ทุกคนมั่นใจที่สุด
    feedback: มีคำประเมิน ที่สุด และสรุปถึงทุกคน
  - id: b
    text: ทุกข้อเป็นข้อเท็จจริงเพราะประกาศจากโรงเรียน
    feedback: ประกาศอาจมีความเห็นปนอยู่
  - id: c
    text: พรุ่งนี้ตรวจสุขภาพฟันที่ห้องพยาบาล เวลาเก้าโมง
    correct: true
    feedback: ถูก ตรวจสอบได้
  - id: d
    text: ทุกข้อเป็นข้อคิดเห็น
    feedback: วัน เวลา สถานที่ ตรวจได้
  hints:
  - ข้อเท็จจริงตรวจสอบได้
  - คำว่า ที่สุด บอกอะไร
  solution: '**วัน เวลา สถานที่** เป็นข้อเท็จจริง ส่วน "มั่นใจที่สุด" เป็นข้อคิดเห็น'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.critical-media.p002
  topics:
  - thai.listening.critical-media
  difficulty: 1
  type: match
  stem: จับคู่ข้อความโฆษณา (สมมติ) กับกลวิธีโน้มน้าว
  pairs:
  - left: คนทั้งประเทศเลือกแล้ว
    right: ใคร ๆ ก็ใช้
  - left: ดาราดังถือสินค้าแล้วยิ้ม
    right: อ้างคนมีชื่อเสียง
  - left: เหลือ 20 ชิ้น วันนี้เท่านั้น
    right: เร่งให้รีบ
  - left: ถ้าไม่ใช้ ลูกอาจป่วย
    right: สร้างความกลัว
  hints:
  - ข้อใดทำให้รู้สึกว่าต้องรีบ
  - ข้อใดทำให้กลัว
  solution: ทั้งประเทศ = ใคร ๆ ก็ใช้ · ดารา = อ้างคนมีชื่อเสียง · เหลือ 20 ชิ้น = เร่งให้รีบ · ลูกอาจป่วย = สร้างความกลัว
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.critical-media.p003
  topics:
  - thai.listening.critical-media
  difficulty: 2
  type: mcq
  stem: ดูโพสต์ในภาพ เมื่อเห็นโพสต์นี้ในกลุ่มแชตของครอบครัว ควรทำอย่างไร **เป็นอย่างแรก**
  figure:
    src: lemon-post.svg
    alt: โพสต์สมมติจากเพจชื่อ สุขภาพดีทุกวัน ทันข่าว ไม่มีวันที่ ข้อความว่า ด่วน!!! แชร์ต่อก่อนถูกลบ ดื่มน้ำมะนาวผสมโซดาทุกเช้า รักษาได้ 100 โรค ได้ผล 100% ผู้เชี่ยวชาญต่างประเทศยืนยันแล้ว สิ่งที่หมอไม่อยากให้คุณรู้!! มีภาพแก้วน้ำมะนาว ถูกใจ 3.2 พัน แชร์ 5.6 พัน ความคิดเห็น 840
  choices:
  - id: a
    text: หยุดก่อน ไม่แชร์ต่อ แล้วตรวจว่าใครเป็นผู้โพสต์และมีหลักฐานหรือไม่
    correct: true
    feedback: ถูก ขั้นแรกคือหยุด
  - id: b
    text: แชร์ต่อทันทีเพราะมีคนแชร์หลายพันครั้ง
    feedback: จำนวนแชร์ไม่ได้บอกว่าจริง
  - id: c
    text: ลองดื่มเลยเพราะน้ำมะนาวไม่อันตราย
    feedback: ยังไม่ได้ตรวจว่ารักษาโรคได้จริง
  - id: d
    text: ตอบในกลุ่มว่าเป็นเรื่องโกหกแน่นอน
    feedback: ยังไม่ได้ตรวจ จึงยังสรุปไม่ได้
  hints:
  - โพสต์เร่งให้แชร์ เราควรตอบสนองอย่างไร
  - ขั้นที่ 1 ของการตรวจคืออะไร
  solution: ขั้นแรกคือ **หยุด** ไม่เชื่อและไม่แชร์ทันที แล้วจึงตรวจแหล่ง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.critical-media.p004
  topics:
  - thai.listening.critical-media
  difficulty: 2
  type: mcq
  stem: ดูโพสต์ในภาพ ข้อใดเป็น **สัญญาณ** ว่าโพสต์อาจเป็นข่าวลวง (เลือกทุกข้อที่ถูก)
  figure:
    src: lemon-post.svg
    alt: โพสต์สมมติจากเพจชื่อ สุขภาพดีทุกวัน ทันข่าว ไม่มีวันที่ ข้อความว่า ด่วน!!! แชร์ต่อก่อนถูกลบ ดื่มน้ำมะนาวผสมโซดาทุกเช้า รักษาได้ 100 โรค ได้ผล 100% ผู้เชี่ยวชาญต่างประเทศยืนยันแล้ว สิ่งที่หมอไม่อยากให้คุณรู้!! มีภาพแก้วน้ำมะนาว ถูกใจ 3.2 พัน แชร์ 5.6 พัน ความคิดเห็น 840
  multiple: true
  choices:
  - id: a
    text: เร่งให้แชร์ก่อนถูกลบ
    correct: true
    feedback: ถูก
  - id: b
    text: อ้างผู้เชี่ยวชาญโดยไม่บอกชื่อ
    correct: true
    feedback: ถูก ตรวจสอบไม่ได้
  - id: c
    text: อ้างว่ารักษาได้ 100 โรค ได้ผล 100%
    correct: true
    feedback: ถูก เป็นคำกล่าวอ้างเกินจริง
  - id: d
    text: มีภาพประกอบ
    feedback: ภาพประกอบอย่างเดียวไม่ได้บอกว่าจริงหรือลวง
  hints:
  - ดูคำเร่ง คำกล่าวอ้าง และแหล่งที่มา
  - มีภาพไม่ได้แปลว่าจริงหรือไม่จริง
  solution: 'สัญญาณ: **เร่งให้แชร์ · อ้างผู้เชี่ยวชาญไม่ระบุชื่อ · อ้างเกินจริง 100%** (และไม่มีวันที่)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.critical-media.p005
  topics:
  - thai.listening.critical-media
  difficulty: 2
  type: order
  stem: เรียงขั้นตอนตรวจความน่าเชื่อถือของข่าวที่ได้ฟังหรือดู
  items:
  - หยุด ไม่เชื่อและไม่แชร์ทันที
  - ดูว่าใครเป็นผู้ผลิตและเผยแพร่เมื่อไร
  - หาแหล่งอื่นที่เชื่อถือได้มายืนยัน
  - ย้อนหาต้นฉบับของข้อมูลที่อ้างถึง
  hints:
  - เริ่มจากหยุดก่อน
  - ต้นฉบับเป็นขั้นที่ลึกที่สุด
  solution: หยุด → ดูแหล่ง → หาแหล่งอื่น → ย้อนหาต้นฉบับ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.critical-media.p006
  topics:
  - thai.listening.critical-media
  difficulty: 3
  type: mcq
  stem: ดูโฆษณาในภาพ ข้อความ "ผู้ใช้ 9 ใน 10 คนพอใจ" มีปัญหาอย่างไร
  figure:
    src: shoe-ad.svg
    alt: โฆษณาสมมติ รองเท้าวิ่ง ตราลมกรด ข้อความ นักวิ่งทั่วประเทศเลือกใช้! · ดาราดังใส่วิ่งทุกเช้า · สูตรพื้นนุ่มพิเศษ วิ่งไกลไม่รู้จบ · ผู้ใช้ 9 ใน 10 คนพอใจ (มีดอกจัน) · เหลือเพียง 20 คู่ ลดราคาวันนี้วันเดียว! · ราคาปกติ 1,990 บาท เหลือ 1,490 บาท · หมายเหตุตัวเล็กด้านล่าง ดอกจัน สำรวจจากผู้ซื้อ 10 คนที่ร้านสาขาแรก
  choices:
  - id: a
    text: ตัวเลขผิด เพราะ 9 ใน 10 ไม่ใช่ร้อยละ 90
    feedback: 9 ใน 10 คือร้อยละ 90 จริง
  - id: b
    text: ดอกจันบอกว่าสำรวจเพียง 10 คนที่ร้านเดียว จึงใช้สรุปถึงผู้ใช้ทั่วประเทศไม่ได้
    correct: true
    feedback: ถูก กลุ่มตัวอย่างเล็กและเลือกเฉพาะผู้ซื้อ
  - id: c
    text: ไม่มีปัญหา เพราะเป็นตัวเลข
    feedback: ตัวเลขต้องดูว่ามาจากไหน
  - id: d
    text: ปัญหาคือใช้ตัวหนังสือสีเหลือง
    feedback: สีไม่ใช่ประเด็น
  hints:
  - อ่านข้อความตัวเล็กใต้ดอกจัน
  - ถามคนกี่คน และเป็นใคร
  solution: สำรวจแค่ **ผู้ซื้อ 10 คนที่ร้านเดียว** ใช้สรุปถึงผู้ใช้ทั้งหมดไม่ได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.critical-media.p007
  topics:
  - thai.listening.critical-media
  difficulty: 3
  type: numeric
  stem: ดูโฆษณาในภาพ รองเท้าลดราคาไปกี่บาท
  figure:
    src: shoe-ad.svg
    alt: โฆษณาสมมติ รองเท้าวิ่ง ตราลมกรด ข้อความ นักวิ่งทั่วประเทศเลือกใช้! · ดาราดังใส่วิ่งทุกเช้า · สูตรพื้นนุ่มพิเศษ วิ่งไกลไม่รู้จบ · ผู้ใช้ 9 ใน 10 คนพอใจ (มีดอกจัน) · เหลือเพียง 20 คู่ ลดราคาวันนี้วันเดียว! · ราคาปกติ 1,990 บาท เหลือ 1,490 บาท · หมายเหตุตัวเล็กด้านล่าง ดอกจัน สำรวจจากผู้ซื้อ 10 คนที่ร้านสาขาแรก
  answer:
    value: 500
    unit: บาท
  misconceptions:
  - match: 1490
    feedback: เป็นราคาหลังลด ไม่ใช่ส่วนลด
  - match: 3480
    feedback: บวกราคาสองตัว ต้องลบกัน
  hints:
  - ส่วนลด = ราคาปกติ − ราคาหลังลด
  - 1,990 − 1,490
  solution: $1990 - 1490 = 500$ บาท (ประมาณร้อยละ 25 ของราคาปกติ)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.critical-media.p008
  topics:
  - thai.listening.critical-media
  difficulty: 3
  type: mcq
  stem: มีข่าวว่า "เขื่อนในจังหวัดหนึ่งจะปล่อยน้ำคืนนี้ ให้ชาวบ้านริมน้ำย้ายของขึ้นที่สูง" แหล่งใด **น่าเชื่อถือที่สุด** ในการตรวจข่าวนี้
  choices:
  - id: a
    text: ข้อความส่งต่อในกลุ่มแชตที่ไม่บอกที่มา
    feedback: ไม่รู้ว่าใครเขียน และอาจเป็นข้อความเก่า
  - id: b
    text: คลิปที่มีคนดูมากที่สุด
    feedback: ยอดวิวไม่ได้บอกความถูกต้อง
  - id: c
    text: ความเห็นของเพื่อนบ้านที่ได้ยินมาอีกที
    feedback: เป็นข่าวต่อปาก
  - id: d
    text: ประกาศของหน่วยงานที่ดูแลเขื่อนหรือของจังหวัด ซึ่งมีชื่อหน่วยงานและวันเวลา
    correct: true
    feedback: ถูก เป็นผู้รู้ข้อมูลโดยตรงและรับผิดชอบได้
  hints:
  - ใครรู้เรื่องนี้โดยตรง
  - แหล่งที่ดีบอกชื่อผู้รับผิดชอบและวันเวลา
  solution: แหล่งที่น่าเชื่อถือที่สุดคือ **หน่วยงานที่รับผิดชอบโดยตรง** และมีวันเวลาชัดเจน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.critical-media.p009
  topics:
  - thai.listening.critical-media
  difficulty: 3
  type: mcq
  stem: ข่าวสองสำนัก (สมมติ) รายงานเหตุการณ์เดียวกัน (ก) "ฝูงชนแห่บุกห้างแย่งของลดราคา" (ข) "ลูกค้าจำนวนมากเข้าห้างตั้งแต่เช้าเพื่อซื้อสินค้าลดราคา" ข้อใดวิเคราะห์ได้ถูกต้อง
  choices:
  - id: a
    text: (ก) เป็นข้อเท็จจริงมากกว่าเพราะตื่นเต้นกว่า
    feedback: ความตื่นเต้นไม่ได้ทำให้จริงกว่า
  - id: b
    text: ทั้งสองข่าวใช้ภาษาเหมือนกัน
    feedback: บุก แย่ง ให้ความรู้สึกต่างจาก เข้า ซื้อ
  - id: c
    text: (ก) ใช้คำที่มีน้ำหนักทางอารมณ์ เช่น ฝูงชน บุก แย่ง ส่วน (ข) ใช้คำเป็นกลางกว่า
    correct: true
    feedback: ถูก เหตุการณ์เดียวกันแต่เลือกคำต่างกัน
  - id: d
    text: (ข) ผิดเพราะไม่ตื่นเต้น
    feedback: ข่าวไม่จำเป็นต้องตื่นเต้น
  hints:
  - เทียบคำกริยาที่ใช้
  - คำใดทำให้รู้สึกว่าวุ่นวายหรือรุนแรง
  solution: (ก) ใช้ **คำที่มีน้ำหนักทางอารมณ์** (บุก แย่ง) ส่วน (ข) เป็นกลางกว่า
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.critical-media.p010
  topics:
  - thai.listening.critical-media
  difficulty: 4
  type: mcq
  stem: คลิปหนึ่งบอกว่า "งานวิจัยพบว่านักเรียนที่กินข้าวเช้าทุกวันได้คะแนนสอบสูงขึ้น" วิธีใด **ตรวจได้ดีที่สุด**
  choices:
  - id: a
    text: ดูคอมเมนต์ใต้คลิปว่ามีคนเห็นด้วยกี่คน
    feedback: ความเห็นของผู้ชมไม่ใช่หลักฐาน
  - id: b
    text: ค้นหางานวิจัยต้นฉบับหรือข่าวจากสื่อที่เชื่อถือได้ที่อ้างงานวิจัยนั้น ดูว่าใครทำ ทำกับใคร และสรุปอย่างไร
    correct: true
    feedback: ถูก ย้อนหาต้นฉบับและหาแหล่งอื่นยืนยัน
  - id: c
    text: ดูคลิปซ้ำอีกสามรอบ
    feedback: ดูซ้ำไม่ได้ช่วยตรวจ
  - id: d
    text: เชื่อทันทีเพราะมีคำว่า งานวิจัย
    feedback: ต้องดูว่างานวิจัยจริงหรือไม่และสรุปตรงหรือไม่
  hints:
  - ขั้น ย้อนหาต้นฉบับ
  - งานวิจัยจริงมีผู้ทำและกลุ่มตัวอย่าง
  solution: '**ย้อนหาต้นฉบับ** และ **หาแหล่งอื่นยืนยัน** ว่างานวิจัยมีจริงและสรุปตรงกับที่คลิปบอก'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.listening.critical-media.p011
  topics:
  - thai.listening.critical-media
  difficulty: 4
  type: mcq
  stem: คลิปรณรงค์ (สมมติ) ให้บริจาคเงินช่วยสัตว์ ใช้ดนตรีเศร้า ภาพสุนัขผอมช้า ๆ และไม่บอกว่าเงินจะนำไปใช้อย่างไร ข้อใดวิเคราะห์ได้ **ครบถ้วน** ที่สุด
  choices:
  - id: a
