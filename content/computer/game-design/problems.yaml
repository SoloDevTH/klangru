problems:
  - id: computer.games.game-design.p001
    topics: [computer.games.game-design]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นองค์ประกอบของเกมที่กำหนดว่าผู้เล่นทำอะไรได้บ้าง"
    choices:
      - { id: a, text: "กติกา", correct: true }
      - { id: b, text: "ชื่อเกม", feedback: "ชื่อเกมบอกว่าเกมชื่ออะไร แต่ไม่ได้กำหนดการเล่น" }
      - { id: c, text: "ภาพหน้าปกของเกม", feedback: "ภาพหน้าปกทำให้เกมน่าสนใจ แต่ไม่ได้กำหนดว่าทำอะไรได้บ้าง" }
      - { id: d, text: "เสียงเพลงพักหน้าจอ", feedback: "เสียงประกอบช่วยบรรยากาศ แต่ไม่ได้กำหนดการกระทำของผู้เล่น" }
    hints:
      - "ลองนึกว่าอะไรบอกว่าการกระทำใดถูกหรือไม่ถูกในเกม"
      - "ดูว่าข้อใดเกี่ยวกับการกระทำโดยตรง"
    solution: "กติกาคือสิ่งที่บอกว่าผู้เล่นทำอะไรได้และทำอะไรไม่ได้ ส่วนชื่อเกม ภาพหน้าปก และเสียงประกอบไม่ได้กำหนดการเล่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.games.game-design.p002
    topics: [computer.games.game-design]
    difficulty: 1
    type: match
    stem: "จับคู่องค์ประกอบของเกมกับความหมาย"
    pairs:
      - { left: "ผู้เล่น", right: "คนหรือตัวแทนที่ตัดสินใจในเกม" }
      - { left: "เป้าหมาย", right: "สิ่งที่ผู้เล่นพยายามทำให้สำเร็จ" }
      - { left: "ผลลัพธ์", right: "สิ่งที่เกิดขึ้นเมื่อผู้เล่นกระทำ เช่น ได้คะแนน" }
    hints:
      - "ผู้เล่นเป็นฝ่ายที่ตัดสินใจ ส่วนเป้าหมายคือสิ่งที่อยากให้เกิด"
      - "ผลลัพธ์คือสิ่งที่ตามมาหลังการกระทำ"
    solution: "ผู้เล่นคือผู้ตัดสินใจในเกม เป้าหมายคือสิ่งที่ต้องทำให้สำเร็จ และผลลัพธ์คือสิ่งที่เกิดตามการกระทำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.games.game-design.p003
    topics: [computer.games.game-design]
    difficulty: 1
    type: order
    stem: "เรียงขั้นตอนการวางแผนสตอรีบอร์ดของเกมให้ถูกต้อง"
    items:
      - "วาดช่องแรกแสดงฉากเริ่มต้นและตัวละคร"
      - "เขียนสิ่งที่ผู้เล่นทำในช่องถัดไป"
      - "วาดผลลัพธ์ของการกระทำนั้น"
      - "ตรวจว่าเรื่องต่อเนื่องและผู้เล่นเข้าใจว่าต้องทำอะไร"
    hints:
      - "เริ่มจากฉากเริ่มต้นก่อนเสมอ"
      - "การตรวจความต่อเนื่องทำหลังวางช่องครบแล้ว"
    solution: "เริ่มจากฉากเริ่มต้น แล้วเขียนการกระทำของผู้เล่น วาดผลลัพธ์ และตรวจความต่อเนื่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.games.game-design.p004
    topics: [computer.games.game-design]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นตัวอย่างของวงจรแกนของการเล่นเกม"
    choices:
      - { id: a, text: "ทำกิจกรรมเล็ก ๆ ได้รางวัล แล้วเจอความท้าทายที่ยากขึ้นเล็กน้อย จากนั้นวนกลับไปทำกิจกรรมใหม่", correct: true }
      - { id: b, text: "อ่านกติกาทั้งหมดก่อนเริ่มเล่นครั้งแรก", feedback: "การอ่านกติกาเป็นการเตรียมตัว ไม่ใช่วงจรที่วนซ้ำระหว่างเล่น" }
      - { id: c, text: "เปลี่ยนชื่อเกมทุกเดือน", feedback: "ชื่อเกมไม่เกี่ยวกับการทำซ้ำของผู้เล่นในเกม" }
      - { id: d, text: "ปิดเกมทันทีเมื่อจบด่านแรก", feedback: "การปิดเกมทันทีไม่ใช่วงจรแกนที่ผู้เล่นทำซ้ำในการเล่น" }
    hints:
      - "วงจรแกนคือสิ่งที่ผู้เล่นทำซ้ำ ๆ ระหว่างเล่น"
      - "ดูว่าข้อใดมีการทำซ้ำและการปรับความยากอยู่ด้วย"
    solution: "วงจรแกนคือการทำกิจกรรมซ้ำ ได้รางวัล เจอความท้าทาย แล้ววนกลับ ซึ่งตรงกับตัวเลือกแรก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.games.game-design.p005
    topics: [computer.games.game-design]
    difficulty: 2
    type: numeric
    stem: "ชมรมคอมพิวเตอร์ของโรงเรียนทดสอบเกมเก็บผลไม้ มีนักเรียน 50 คนเริ่มเล่นด่านแรก และ 12 คนเลิกเล่นกลางคัน อัตราเลิกเล่นเป็นกี่เปอร์เซ็นต์"
    answer: { value: 24, tolerance: 0, unit: "%" }
    hints:
      - "อัตราเลิกเล่นคือจำนวนคนที่เลิกเทียบกับจำนวนคนที่เริ่มเล่น"
      - "หารจำนวนคนที่เลิกด้วยจำนวนคนที่เริ่ม แล้วคูณด้วย 100"
    solution: "12 ÷ 50 × 100 = 24 เปอร์เซ็นต์"
    misconceptions:
      - { match: 12, feedback: "12 คือจำนวนคนที่เลิกเล่น ยังไม่ได้เปลี่ยนเป็นเปอร์เซ็นต์ของคนที่เริ่มทั้งหมด" }
      - { match: 76, feedback: "76 คือร้อยละของคนที่เล่นต่อ ไม่ใช่อัตราเลิกเล่น" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.games.game-design.p006
    topics: [computer.games.game-design]
    difficulty: 2
    type: numeric
    stem: "เวอร์ชัน A ผ่านด่านเฉลี่ย 7.2 นาที เวอร์ชัน B ผ่านด่านเฉลี่ย 5.4 นาที เวอร์ชัน B ใช้เวลาน้อยกว่า A กี่นาที"
    answer: { value: 1.8, tolerance: 0.001, unit: "นาที" }
    hints:
      - "หาผลต่างระหว่างเวลาเฉลี่ยของสองเวอร์ชัน"
      - "ลบค่าที่น้อยกว่าออกจากค่าที่มากกว่า"
    solution: "7.2 − 5.4 = 1.8 นาที"
    misconceptions:
      - { match: 7.2, feedback: "7.2 คือเวลาเฉลี่ยของเวอร์ชัน A ไม่ใช่ผลต่าง" }
      - { match: 5.4, feedback: "5.4 คือเวลาเฉลี่ยของเวอร์ชัน B ไม่ใช่ผลต่าง" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.games.game-design.p007
    topics: [computer.games.game-design]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นแนวทางที่ช่วยให้การแจ้งผลในเกมเข้าถึงได้สำหรับทุกคน"
    choices:
      - { id: a, text: "ใช้ไอคอนหรือตัวอักษรร่วมกับสี เพื่อให้คนตาบอดสีเข้าใจความหมายได้", correct: true }
      - { id: b, text: "ใช้สีแดงกับสีเขียวเพียงอย่างเดียวบอกว่าถูกหรือผิด", feedback: "คนตาบอดสีแดงเขียวอาจแยกสีไม่ออกและไม่เข้าใจผลที่แจ้ง" }
      - { id: c, text: "ตั้งตัวอักษรให้เล็กที่สุดเพื่อให้หน้าจอดูสวย", feedback: "ตัวอักษรเล็กเกินไปทำให้คนสายตาไม่ดีอ่านไม่ได้" }
      - { id: d, text: "ไม่มีคำบรรยายสำหรับเสียงสำคัญเพื่อให้เกมเงียบ", feedback: "คำบรรยายช่วยให้ผู้เล่นที่ได้ยินไม่ชัดหรือไม่ได้ยินเข้าใจได้" }
    hints:
      - "ลองนึกว่าผู้เล่นที่แยกสีไม่ออกจะรับรู้ผลได้จากอะไร"
      - "ดูว่าข้อใดช่วยให้ข้อมูลไม่พึ่งพาสีอย่างเดียว"
    solution: "การเพิ่มไอคอนหรือตัวอักษรร่วมกับสีทำให้ผู้เล่นทุกคนเข้าใจผลได้ โดยไม่ต้องแยกสีอย่างเดียว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.games.game-design.p008
    topics: [computer.games.game-design]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นการออกแบบส่วนต่อประสานที่ช่วยให้ใช้ง่าย (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ปรับขนาดปุ่มและตัวอักษรได้ตามความต้องการ", correct: true }
      - { id: b, text: "มีคำบรรยายสำหรับเสียงสำคัญ", correct: true }
      - { id: c, text: "เลือกใช้ได้ทั้งแป้นพิมพ์และหน้าจอสัมผัส", correct: true }
      - { id: d, text: "ซ่อนเมนูหลักไว้ในที่ที่หาได้ยาก", feedback: "ผู้เล่นจะหาเมนูหลักไม่เจอและใช้เกมได้ยากขึ้น" }
    hints:
      - "คิดว่าผู้เล่นที่ต่างกันต้องการอะไรเพื่อใช้เกมได้"
      - "ข้อที่ทำให้ผู้เล่นหาสิ่งสำคัญยากไม่ใช่การออกแบบที่ดี"
    solution: "การปรับขนาด คำบรรยาย และการเลือกอุปกรณ์ได้หลายแบบช่วยให้ใช้ง่าย ส่วนการซ่อนเมนูหลักทำให้ใช้ยาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.games.game-design.p009
    topics: [computer.games.game-design]
    difficulty: 3
    type: numeric
    stem: "เวอร์ชัน B ที่ชมรมคอมพิวเตอร์ของโรงเรียนทดสอบมีนักเรียน 50 คนเริ่มเล่น และ 6 คนเลิกเล่นกลางคัน อัตราเลิกเล่นของเวอร์ชัน B เป็นกี่เปอร์เซ็นต์"
    answer: { value: 12, tolerance: 0, unit: "%" }
    hints:
      - "ใช้สูตรเดียวกับการหาอัตราเลิกเล่นของเวอร์ชันอื่น"
      - "หาร 6 ด้วย 50 แล้วคูณด้วย 100"
    solution: "6 ÷ 50 × 100 = 12 เปอร์เซ็นต์"
    misconceptions:
      - { match: 6, feedback: "6 คือจำนวนคนที่เลิกเล่น ยังไม่ได้เปลี่ยนเป็นเปอร์เซ็นต์" }
      - { match: 88, feedback: "88 คือร้อยละของคนที่ยังเล่นต่อ ไม่ใช่อัตราเลิกเล่น" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.games.game-design.p010
    topics: [computer.games.game-design]
    difficulty: 3
    type: numeric
    stem: "เวอร์ชัน A มีอัตราเลิกเล่น 24 เปอร์เซ็นต์ และเวอร์ชัน B มี 12 เปอร์เซ็นต์ อัตราเลิกเล่นลดลงกี่จุดร้อยละ"
    answer: { value: 12, tolerance: 0, unit: "จุดร้อยละ" }
    hints:
      - "จุดร้อยละคือผลต่างของค่าร้อยละสองค่า"
      - "ลบค่าของเวอร์ชัน B ออกจากค่าของเวอร์ชัน A"
    solution: "24 − 12 = 12 จุดร้อยละ"
    misconceptions:
      - { match: 50, feedback: "50 คือการเทียบกับค่าเดิม (12 ÷ 24) ซึ่งเป็นการลดลงคิดเป็นร้อยละ แต่โจทย์ถามเป็นจุดร้อยละ" }
      - { match: 24, feedback: "24 คืออัตราเลิกเล่นของเวอร์ชัน A ยังไม่ได้หาผลต่าง" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.games.game-design.p011
    topics: [computer.games.game-design]
    difficulty: 3
    type: mcq
    stem: "จากการทดสอบกับผู้เล่น 40 คน เวอร์ชัน B ดีกว่า A ข้อใดควรระวังมากที่สุดก่อนสรุป"
    choices:
      - { id: a, text: "ตัวอย่างเพียง 40 คนอาจไม่สะท้อนผู้เล่นทั้งหมด จึงควรทดสอบเพิ่มกับผู้เล่นที่หลากหลาย", correct: true }
      - { id: b, text: "ผลนี้แน่นอนว่าเวอร์ชัน B จะดีกับทุกคนทุกสถานการณ์", feedback: "การทดสอบกับกลุ่มเดียวไม่สามารถรับประกันได้ว่าดีกับทุกคน" }
      - { id: c, text: "ไม่ควรเปรียบเทียบเลยเพราะ 40 คนไม่มีค่าเลย", feedback: "กลุ่มตัวอย่างเล็กมีข้อจำกัด แต่ยังให้ข้อมูลที่ช่วยปรับเกมได้ ควรระวังมากกว่าทิ้งไป" }
      - { id: d, text: "ควรทดสอบกับเพื่อนสนิทกลุ่มเดียวเพื่อให้ได้ผลเร็วขึ้น", feedback: "การทดสอบกับกลุ่มคล้ายกันทำให้ผลลำเอียงและไม่รู้ปัญหาของผู้เล่นทั่วไป" }
    hints:
      - "ลองคิดว่าผู้เล่น 40 คนเป็นตัวแทนของผู้เล่นทั้งหมดได้เต็มที่หรือไม่"
      - "การทดสอบที่ดีควรให้กลุ่มตัวอย่างหลากหลาย"
    solution: "ตัวอย่างเล็กและไม่หลากหลายอาจทำให้ผลไม่สะท้อนผู้เล่นทั้งหมด จึงควรทดสอบเพิ่มกับกลุ่มที่หลากหลายก่อนสรุป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.games.game-design.p012
    topics: [computer.games.game-design]
    difficulty: 3
    type: match
    stem: "จับคู่อุปกรณ์รับเข้ากับลักษณะประสบการณ์ที่ได้"
    pairs:
      - { left: "แป้นพิมพ์", right: "มีปุ่มให้เลือกมากและกดได้แม่นยำ" }
      - { left: "จอยสติ๊ก", right: "เหมาะกับการเคลื่อนไหวต่อเนื่อง" }
      - { left: "หน้าจอสัมผัส", right: "ลงมือกับวัตถุบนจอได้โดยตรง" }
      - { left: "เซนเซอร์การเคลื่อนไหว", right: "ใช้ร่างกายควบคุม และต้องคำนึงถึงความปลอดภัย" }
    hints:
      - "ลองคิดว่าผู้เล่นใช้มือ นิ้ว หรือร่างกายส่วนใดในการควบคุม"
      - "ดูว่าอุปกรณ์แต่ละแบบเหมาะกับการเคลื่อนไหวแบบไหน"
    solution: "แป้นพิมพ์มีปุ่มมากและกดได้แม่นยำ จอยสติ๊กเหมาะกับการเคลื่อนไหวต่อเนื่อง หน้าจอสัมผัสลงมือโดยตรง และเซนเซอร์ใช้ร่างกาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.games.game-design.p013
    topics: [computer.games.game-design]
    difficulty: 3
    type: mcq
    stem: "สตอรีบอร์ดช่วยการพัฒนาเกมได้อย่างไร"
    choices:
      - { id: a, text: "วางแผนลำดับเรื่องและการโต้ตอบของผู้เล่นก่อนลงมือโปรแกรม", correct: true }
      - { id: b, text: "ใช้แทนการทดสอบการเล่นกับผู้เล่นจริงทั้งหมด", feedback: "สตอรีบอร์ดช่วยวางแผน แต่ไม่สามารถแทนการทดสอบกับผู้เล่นจริงได้" }
      - { id: c, text: "ทำให้ไม่ต้องคิดกติกาของเกมอีก", feedback: "กติกายังต้องกำหนดเองให้ชัดเจน สตอรีบอร์ดเพียงช่วยแสดงลำดับ" }
      - { id: d, text: "เป็นตัวเลขที่ใช้วัดอัตราเลิกเล่น", feedback: "อัตราเลิกเล่นคำนวณจากจำนวนผู้เล่น ไม่ได้มาจากสตอรีบอร์ด" }
    hints:
      - "ลองนึกว่าสตอรีบอร์ดเป็นภาพที่ทำให้เห็นอะไรล่วงหน้า"
      - "ดูว่าข้อใดตรงกับจุดประสงค์ของการวาดเป็นช่อง"
    solution: "สตอรีบอร์ดช่วยให้ทีมวางแผนลำดับเรื่องและการโต้ตอบของผู้เล่นก่อนเขียนโปรแกรม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.games.game-design.p014
    topics: [computer.games.game-design]
    difficulty: 4
    type: numeric
    stem: "เกมทายคำศัพท์ไทยมีผู้เล่น 60 คนที่เริ่มเล่น และ 15 คนผ่านด่านแรก อัตราการผ่านด่านแรกเป็นกี่เปอร์เซ็นต์"
    answer: { value: 25, tolerance: 0, unit: "%" }
    hints:
      - "อัตราการผ่านคือจำนวนคนที่ผ่านเทียบกับจำนวนคนที่เริ่มเล่นทั้งหมด"
      - "หาร 15 ด้วย 60 แล้วคูณด้วย 100"
    solution: "15 ÷ 60 × 100 = 25 เปอร์เซ็นต์"
    misconceptions:
      - { match: 15, feedback: "15 คือจำนวนคนที่ผ่าน ยังไม่ได้เปลี่ยนเป็นเปอร์เซ็นต์ของคนที่เริ่มทั้งหมด" }
      - { match: 75, feedback: "75 คือร้อยละของคนที่ไม่ผ่านด่านแรก ไม่ใช่อัตราผ่านที่โจทย์ถาม" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.games.game-design.p015
    topics: [computer.games.game-design]
    difficulty: 4
    type: mcq
    stem: "กล่องสุ่มในเกมอาจก่อปัญหาอะไรต่อผู้เล่นเด็ก"
    choices:
      - { id: a, text: "อาจกระตุ้นให้ใช้จ่ายซ้ำ ๆ เพื่อหวังรางวัลที่ไม่แน่นอน คล้ายการพนัน จึงต้องออกแบบและจำกัดอย่างรับผิดชอบ", correct: true }
      - { id: b, text: "ทำให้เกมเร็วขึ้นทุกครั้ง", feedback: "การสุ่มไม่ได้ทำให้เกมทำงานเร็วขึ้น" }
      - { id: c, text: "ไม่มีผลเพราะเป็นการสุ่มเพียงเล็กน้อย", feedback: "แม้เป็นการสุ่มเล็กน้อย ก็อาจกระตุ้นการใช้จ่ายซ้ำได้" }
      - { id: d, text: "ช่วยให้เด็กเรียนคณิตศาสตร์เองทุกครั้งที่เปิดกล่อง", feedback: "กล่องสุ่มไม่ได้สอนคณิตศาสตร์โดยตรง และไม่ใช่ประโยชน์ที่ตั้งใจ" }
    hints:
      - "ลองนึกว่าการหวังรางวัลที่ไม่แน่นอนมีผลต่อการตัดสินใจอย่างไร"
      - "ดูว่าข้อใดกล่าวถึงผลเสียต่อเด็กโดยตรง"
    solution: "กล่องสุ่มที่ให้รางวัลไม่แน่นอนอาจกระตุ้นการใช้จ่ายซ้ำ คล้ายการพนัน จึงควรออกแบบและจำกัดอย่างรับผิดชอบ โดยเฉพาะกับเด็ก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.games.game-design.p016
    topics: [computer.games.game-design]
    difficulty: 4
    type: code
    stem: |
      เขียนฟังก์ชัน `quit_rate(started, quit)` ที่รับจำนวนผู้เล่นที่เริ่มเล่น และจำนวนผู้เล่นที่เลิกกลางคัน แล้ว **คืนค่า** อัตราเลิกเล่นเป็นเปอร์เซ็นต์ ปัดเป็นทศนิยม 1 ตำแหน่ง
    starter: |
      def quit_rate(started, quit):
          return 0
    tests: |
      assert quit_rate(40, 10) == 25.0, f"quit_rate(40, 10) ควรได้ 25.0 แต่ได้ {quit_rate(40, 10)}"
      assert quit_rate(40, 4) == 10.0, f"quit_rate(40, 4) ควรได้ 10.0 แต่ได้ {quit_rate(40, 4)}"
      assert quit_rate(60, 15) == 25.0, f"quit_rate(60, 15) ควรได้ 25.0 แต่ได้ {quit_rate(60, 15)}"
      assert quit_rate(3, 1) == 33.3, f"quit_rate(3, 1) ควรได้ 33.3 แต่ได้ {quit_rate(3, 1)}"
    reference: |
      def quit_rate(started, quit):
          return round(quit / started * 100, 1)
    hints:
      - "อัตราคือจำนวนที่เลิกหารด้วยจำนวนที่เริ่ม แล้วคูณด้วย 100"
      - "ใช้ round เพื่อปัดทศนิยมให้เหลือ 1 ตำแหน่ง"
    solution: "return round(quit / started * 100, 1) เช่น round(10 / 40 * 100, 1) = 25.0"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.games.game-design.p017
    topics: [computer.games.game-design]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นการคุ้มครองความเป็นส่วนตัวของผู้เล่นเด็ก (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "เก็บเฉพาะข้อมูลที่จำเป็นต่อการทำงานของเกม", correct: true }
      - { id: b, text: "ขอความยินยอมจากผู้ปกครองก่อนเก็บข้อมูลส่วนบุคคลเมื่อจำเป็น", correct: true }
      - { id: c, text: "ไม่เปิดเผยตำแหน่งของผู้เล่นต่อคนแปลกหน้า", correct: true }
      - { id: d, text: "เก็บประวัติการเล่นและบันทึกเสียงทุกอย่างเพื่อขายให้ผู้โฆษณา", feedback: "การเก็บข้อมูลเกินจำเป็นและขายให้ผู้อื่นละเมิดความเป็นส่วนตัวของเด็ก" }
    hints:
      - "คิดว่าข้อมูลใดจำเป็นจริงต่อการเล่นและข้อมูลใดเกินจำเป็น"
      - "การขอความยินยอมและการไม่เปิดเผยตำแหน่งช่วยปกป้องเด็ก"
    solution: "การเก็บเฉพาะข้อมูลจำเป็น ขอความยินยอมจากผู้ปกครอง และไม่เปิดเผยตำแหน่งต่อคนแปลกหน้า ช่วยคุ้มครองเด็ก ส่วนการเก็บข้อมูลเกินจำเป็นและนำไปขายไม่เหมาะสม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.games.game-design.p018
    topics: [computer.games.game-design]
    difficulty: 5
    type: mcq
    stem: "เกมนำเพลงลิขสิทธิ์มาใช้โดยไม่ได้ขออนุญาต เกมจะมีความเสี่ยงอะไร"
    choices:
      - { id: a, text: "อาจถูกเรียกร้องค่าเสียหาย หรือต้องถอนเกมออกจากการจำหน่าย", correct: true }
      - { id: b, text: "ไม่มีความเสี่ยงเพราะเพลงหาฟังฟรีในอินเทอร์เน็ต", feedback: "การหาฟังได้ฟรีไม่ได้หมายความว่าใช้ในเกมได้โดยไม่ได้รับอนุญาต" }
      - { id: c, text: "ปลอดภัยเพราะใส่ชื่อนักร้องไว้ในเครดิตแล้ว", feedback: "การใส่เครดิตไม่ได้แทนการได้รับอนุญาตให้ใช้ผลงาน" }
      - { id: d, text: "ได้รับการคุ้มครองโดยอัตโนมัติเพราะเป็นเกมเพื่อการศึกษา", feedback: "การเป็นเกมเพื่อการศึกษาไม่ได้ยกเว้นการละเมิดลิขสิทธิ์โดยอัตโนมัติ" }
    hints:
      - "ลองคิดว่าผู้สร้างเพลงมีสิทธิ์อะไรบ้างกับผลงานของตน"
      - "ดูว่าข้อใดยังไม่ใช่การได้รับอนุญาตที่ถูกต้อง"
    solution: "การใช้ผลงานโดยไม่ได้รับอนุญาตอาจถูกเรียกร้องค่าเสียหายหรือถูกถอนออกจากการจำหน่าย ส่วนการหาฟังได้ฟรี การใส่เครดิต และการเป็นเกมการศึกษาไม่ได้ยกเว้นการละเมิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.games.game-design.p019
    topics: [computer.games.game-design]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นตัวชี้วัดที่เหมาะกับการเปรียบเทียบสองเวอร์ชันของเกม (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "อัตราเลิกเล่นกลางคัน เทียบกับจำนวนคนที่เริ่มเล่น", correct: true }
      - { id: b, text: "เวลาเฉลี่ยที่ใช้ในการผ่านด่านแรก", correct: true }
      - { id: c, text: "จำนวนครั้งที่ผู้เล่นกลับมาเล่นซ้ำในสัปดาห์เดียวกัน", correct: true }
      - { id: d, text: "จำนวนตัวอักษรในคำอธิบายเกมบนหน้าร้าน", feedback: "จำนวนตัวอักษรไม่ได้บอกว่าผู้เล่นสนุกหรือใช้เกมได้ดีหรือไม่" }
    hints:
      - "ตัวชี้วัดที่ดีควรวัดพฤติกรรมของผู้เล่นขณะเล่นจริง"
      - "ดูว่าข้อใดสะท้อนประสบการณ์ของผู้เล่นโดยตรง"
    solution: "อัตราเลิกเล่น เวลาผ่านด่าน และการกลับมาเล่นซ้ำ สะท้อนพฤติกรรมของผู้เล่นขณะเล่นจริง จึงใช้เปรียบเทียบเวอร์ชันได้ ส่วนจำนวนตัวอักษรไม่เกี่ยวกับการเล่น"
    license: CC-BY-SA-4.0
    ai_assisted: true
