<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" width="620" height="260" font-family="sans-serif" font-size="14">
<title>แสงอาทิตย์ตอนเที่ยงผ่านบรรยากาศระยะสั้น ตอนพระอาทิตย์ตกผ่านบรรยากาศระยะยาวมาก แสงสีน้ำเงินถูกกระเจิงออกไประหว่างทาง เหลือแสงสีแดงและส้ม</title>
<rect x="0" y="0" width="620" height="260" fill="#ffffff"/>
<path d="M -38.6 271.7 A 600 600 0 0 1 658.6 271.7" fill="none" stroke="#2e7d32" stroke-width="3"/>
