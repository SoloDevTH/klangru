      - "กำหนดโดเมนที่เป็นไปได้ของตัวแปร"
      - "หาจุดวิกฤตจาก $f'(x) = 0$ หรือ $f'$ หาค่าไม่ได้"
      - "ยืนยันค่าสูงสุดหรือต่ำสุดด้วยการทดสอบอนุพันธ์หรือเทียบกับปลายช่วง"
