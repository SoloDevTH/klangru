    difficulty: 3
    type: mcq
    stem: "ร้านสะดวกซื้อเครือหนึ่ง (สมมติ) เปลี่ยนนโยบาย ให้ผู้จัดการแต่ละสาขาเลือกสินค้าท้องถิ่นมาวางขายและจัดโปรโมชันเองได้โดยไม่ต้องรอสำนักงานใหญ่อนุมัติ นี่คือการเปลี่ยนแปลงแบบใด"
    choices:
      - { id: a, text: "กระจายอำนาจมากขึ้น", correct: true }
      - { id: b, text: "รวมอำนาจมากขึ้น", feedback: "การรวมอำนาจคือให้ผู้บริหารระดับสูงตัดสินใจ แต่กรณีนี้อำนาจย้ายลงไปที่สาขา" }
      - { id: c, text: "เพิ่มความเป็นทางการ", feedback: "ความเป็นทางการคือการมีกฎระเบียบเขียนไว้มากขึ้น แต่กรณีนี้ลดขั้นตอนการขออนุมัติ" }
      - { id: d, text: "เปลี่ยนเป็นโครงสร้างแบบเมทริกซ์", feedback: "ไม่มีใครได้หัวหน้าสองสาย แค่ย้ายอำนาจตัดสินใจลงไประดับสาขา" }
    hints:
      - "อำนาจตัดสินใจย้ายจากระดับใดไปสู่ระดับใด"
      - "ระดับล่างตัดสินใจเองได้มากขึ้นเรียกว่าอะไร"
    solution: "อำนาจตัดสินใจเรื่องสินค้าและโปรโมชันย้ายจากสำนักงานใหญ่ลงไปที่ผู้จัดการสาขาซึ่งใกล้ลูกค้ามากกว่า จึงเป็นการกระจายอำนาจ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.organizing.p012
    topics: [management.principles.organizing]
    difficulty: 3
    type: mcq
    stem: "บริษัทก่อสร้างแห่งหนึ่งใช้โครงสร้างแบบเมทริกซ์ วิศวกรโยธาคนหนึ่งบ่นว่าผู้จัดการโครงการสั่งให้ทำงานล่วงเวลาเพื่อเร่งงาน แต่หัวหน้าฝ่ายวิศวกรรมสั่งให้ไปอบรมในวันเดียวกัน ข้อใดเป็นวิธีลดปัญหานี้ที่ตรงจุดที่สุด"
    choices:
      - { id: a, text: "ตกลงให้ชัดว่าเรื่องใดผู้จัดการโครงการตัดสิน เรื่องใดหัวหน้าฝ่ายตัดสิน และให้ทั้งสองวางแผนกำลังคนร่วมกัน", correct: true }
      - { id: b, text: "ให้วิศวกรเลือกทำตามคนที่ตำแหน่งสูงกว่าเสมอ", feedback: "ภาระการตัดสินใจตกไปอยู่ที่พนักงานซึ่งไม่ได้เห็นภาพรวม และความขัดแย้งยังเกิดซ้ำ" }
      - { id: c, text: "เพิ่มช่วงการบังคับบัญชาของหัวหน้าฝ่ายวิศวกรรม", feedback: "จำนวนลูกน้องไม่เกี่ยวกับปัญหาคำสั่งขัดกันของหัวหน้าสองสาย" }
      - { id: d, text: "ยกเลิกฝ่ายวิศวกรรม ให้วิศวกรทุกคนสังกัดโครงการถาวร", feedback: "แก้ปัญหานี้ได้แต่เสียข้อดีของเมทริกซ์ คือการใช้ผู้เชี่ยวชาญร่วมกันและรักษามาตรฐานวิชาชีพ จึงไม่ใช่วิธีที่ตรงจุดที่สุด" }
    hints:
      - "ปัญหาหลักของเมทริกซ์คือหัวหน้าสองสาย"
      - "วิธีที่ดีคงข้อดีของเมทริกซ์ไว้ แต่ทำให้อำนาจตัดสินใจชัดเจน"
    solution: "ปัญหาเกิดจากหัวหน้าสองสายสั่งงานขัดกัน วิธีที่ตรงจุดคือกำหนดอำนาจตัดสินใจให้ชัดและวางแผนกำลังคนร่วมกัน จึงยังได้ประโยชน์ของการใช้ผู้เชี่ยวชาญร่วมกันหลายโครงการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.organizing.p013
    topics: [management.principles.organizing]
    difficulty: 3
    type: order
    stem: "เรียงลำดับชั้นของราชการบริหารส่วนกลางของไทย จากหน่วยงานใหญ่ที่สุดไปเล็กที่สุด"
    items:
      - "กระทรวง"
      - "กรม"
      - "กองหรือสำนัก"
      - "กลุ่มงานหรือฝ่าย"
    hints:
      - "หน่วยงานระดับที่มีรัฐมนตรีเป็นผู้บังคับบัญชาสูงสุดอยู่บนสุด"
      - "กรมแบ่งย่อยเป็นกองหรือสำนัก"
    solution: "กระทรวง → กรม → กองหรือสำนัก → กลุ่มงานหรือฝ่าย กระทรวงหนึ่งมีหลายกรม แต่ละกรมแบ่งเป็นหลายกองหรือสำนัก และแบ่งย่อยลงไปอีก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.organizing.p014
    topics: [management.principles.organizing]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "สถานการณ์ใดทำให้หัวหน้าหนึ่งคนดูแลลูกน้องได้จำนวนมาก (ช่วงการบังคับบัญชากว้าง) โดยไม่เสียคุณภาพงาน เลือกทุกข้อที่ถูก"
    choices:
      - { id: a, text: "งานเป็นงานประจำที่คล้ายกันและมีขั้นตอนมาตรฐานชัด", correct: true }
      - { id: b, text: "ลูกน้องมีประสบการณ์และทักษะสูง", correct: true }
      - { id: c, text: "ลูกน้องทำงานอยู่ในสถานที่เดียวกัน", correct: true }
      - { id: d, text: "งานซับซ้อนและเปลี่ยนแปลงบ่อย", feedback: "งานซับซ้อนต้องให้หัวหน้าช่วยตัดสินใจบ่อย ช่วงควรแคบลง" }
      - { id: e, text: "ลูกน้องส่วนใหญ่เป็นพนักงานใหม่", feedback: "พนักงานใหม่ต้องสอนงานและติดตามใกล้ชิด ช่วงควรแคบลง" }
    hints:
      - "ถามว่าลูกน้องต้องพึ่งหัวหน้ามากหรือน้อย"
      - "ยิ่งต้องพึ่งหัวหน้าน้อย ช่วงยิ่งกว้างได้"
    solution: "ช่วงกว้างได้เมื่องานเป็นมาตรฐาน ลูกน้องเก่ง และอยู่ที่เดียวกัน (ก ข ค) ส่วนงานซับซ้อนหรือพนักงานใหม่ต้องการการดูแลใกล้ชิด ช่วงจึงควรแคบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.organizing.p015
    topics: [management.principles.organizing]
    difficulty: 4
    type: mcq
    stem: "บริษัทผลิตปุ๋ยแห่งหนึ่ง (สมมติ) จัดโครงสร้างตามหน้าที่ ขายในประเทศอย่างเดียว ต่อมาขยายไปขายในลาว กัมพูชา และเมียนมา ซึ่งดินและพืชที่ปลูก กฎหมาย และช่องทางขายต่างกันมาก ควรปรับระดับที่สองของโครงสร้างเป็นแบบใด"
    choices:
      - { id: a, text: "ตามพื้นที่ (แยกหน่วยไทย ลาว กัมพูชา เมียนมา)", correct: true }
      - { id: b, text: "ตามหน้าที่แบบเดิม", feedback: "ฝ่ายขายฝ่ายเดียวต้องเข้าใจกฎหมายและตลาดสี่ประเทศ จะตอบสนองแต่ละตลาดได้ช้า" }
      - { id: c, text: "ตามผลิตภัณฑ์", feedback: "ความแตกต่างหลักอยู่ที่ประเทศ ไม่ใช่ที่สินค้า ปุ๋ยชนิดเดียวกันอาจต้องปรับตามแต่ละประเทศ" }
      - { id: d, text: "ไม่มีโครงสร้าง ให้ทุกคนรายงานกรรมการผู้จัดการโดยตรง", feedback: "ช่วงการบังคับบัญชาของกรรมการผู้จัดการจะกว้างเกินดูแลได้ และไม่มีใครรับผิดชอบแต่ละตลาด" }
    hints:
      - "ลูกค้ากลุ่มต่าง ๆ แตกต่างกันตามอะไรมากที่สุด"
      - "โครงสร้างใดให้แต่ละหน่วยดูแลลูกค้าในท้องถิ่นได้ครบวงจร"
    solution: "ความต่างหลักอยู่ที่ประเทศ (ดิน พืช กฎหมาย ช่องทางขาย) โครงสร้างตามพื้นที่ให้แต่ละหน่วยตอบสนองตลาดท้องถิ่นได้เร็ว แลกกับต้นทุนที่ซ้ำซ้อนบ้าง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.organizing.p016
    topics: [management.principles.organizing]
    difficulty: 4
    type: match
    stem: "จับคู่โครงสร้างองค์การกับข้อเสียที่พบบ่อยที่สุด"
    pairs:
      - { left: "ตามหน้าที่", right: "แต่ละฝ่ายมองแต่งานของตัวเอง ประสานข้ามฝ่ายช้า" }
      - { left: "ตามผลิตภัณฑ์", right: "งานสนับสนุนซ้ำซ้อน เช่น ทุกกลุ่มสินค้ามีฝ่ายขายของตัวเอง" }
      - { left: "แบบเมทริกซ์", right: "พนักงานมีหัวหน้าสองสายและอาจได้คำสั่งขัดกัน" }
      - { left: "โครงสร้างแบบสูง (ช่วงแคบ)", right: "มีหลายระดับ ข้อมูลและการตัดสินใจเดินทางช้า" }
    hints:
      - "นึกถึงว่าแต่ละโครงสร้างจัดกลุ่มคนตามอะไร แล้วอะไรจะหายไป"
      - "โครงสร้างแบบสูงคือโครงสร้างที่มีระดับมาก"
    solution: "ตามหน้าที่ทำให้ประสานข้ามฝ่ายยาก ตามผลิตภัณฑ์ทำให้งานซ้ำซ้อน เมทริกซ์มีหัวหน้าสองสาย และโครงสร้างแบบสูงมีหลายระดับจึงสื่อสารช้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.organizing.p017
    topics: [management.principles.organizing]
    difficulty: 5
    type: numeric
    stem: "สำนักงานเขตแห่งหนึ่ง (สมมติ) มีพนักงานปฏิบัติการ 1,200 คน ผู้บริหารต้องการให้มีระดับผู้บังคับบัญชาเหนือพนักงานปฏิบัติการไม่เกิน 4 ระดับ (นับรวมผู้บริหารสูงสุด) ถ้าทุกระดับใช้ช่วงการบังคับบัญชาเท่ากัน ช่วงการบังคับบัญชาที่น้อยที่สุดที่ทำได้คือกี่คน (ตอบเป็นจำนวนคน)"
    answer: { value: 6, unit: คน }
    hints:
      - "ถ้าช่วงคือ $s$ และมี 4 ระดับ ผู้บริหารสูงสุดหนึ่งคนครอบคลุมพนักงานได้ไม่เกิน $s^4$ คน"
      - "หาจำนวนเต็ม $s$ ที่น้อยที่สุดที่ $s^4 \\ge 1{,}200$ แล้วตรวจด้วยการหารซ้ำ"
    misconceptions:
      - { match: 5, feedback: "$5^4 = 625$ น้อยกว่า 1,200 ช่วง 5 ต้องใช้ 5 ระดับ (240, 48, 10, 2, 1)" }
      - { match: 300, feedback: "1,200 ÷ 4 ไม่ใช่วิธีหาช่วง จำนวนระดับทำงานแบบยกกำลัง ไม่ใช่การหาร" }
    solution: "ต้องการ $s^4 \\ge 1{,}200$: $5^4 = 625$ ไม่พอ $6^4 = 1{,}296$ พอ ตรวจ: $1{,}200 \\div 6 = 200$, $200 \\div 6 \\approx 33.3 \\to 34$, $34 \\div 6 \\approx 5.7 \\to 6$, $6 \\div 6 = 1$ ได้ 4 ระดับพอดี ช่วงน้อยที่สุดคือ 6 คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.organizing.p018
    topics: [management.principles.organizing]
    difficulty: 5
    type: mcq
    stem: "โรงพยาบาลจังหวัดแห่งหนึ่ง (สมมติ) จัดโครงสร้างตามหน้าที่ล้วน (แพทย์ พยาบาล เภสัชกร นักกายภาพ อยู่คนละกลุ่มงาน) พบว่าผู้ป่วยโรคหลอดเลือดสมองได้รับการดูแลไม่ต่อเนื่อง แต่ละวิชาชีพนัดผู้ป่วยแยกกัน ข้อเสนอใดตรงกับปัญหาและคงข้อดีของโครงสร้างเดิมไว้มากที่สุด"
    choices:
      - { id: a, text: "ตั้งทีมดูแลผู้ป่วยโรคหลอดเลือดสมองข้ามวิชาชีพ มีผู้ประสานงานทีม ขณะที่แต่ละคนยังสังกัดกลุ่มงานวิชาชีพเดิม", correct: true }
      - { id: b, text: "ยุบกลุ่มงานวิชาชีพทั้งหมด แล้วแบ่งโรงพยาบาลตามโรค", feedback: "แก้ปัญหาการประสานงานได้ แต่เสียการรวมผู้เชี่ยวชาญแต่ละวิชาชีพไว้ด้วยกัน งานซ้ำซ้อนมากและไม่ได้คงข้อดีของโครงสร้างเดิม" }
      - { id: c, text: "ให้ผู้อำนวยการโรงพยาบาลอนุมัติการนัดผู้ป่วยทุกครั้งด้วยตนเอง", feedback: "เป็นการรวมอำนาจที่ทำให้ช้าลง และผู้อำนวยการดูแลไม่ไหว" }
      - { id: d, text: "เพิ่มจำนวนหัวหน้าในแต่ละกลุ่มงานวิชาชีพ", feedback: "ทำให้ช่วงการบังคับบัญชาแคบลงภายในวิชาชีพ แต่ปัญหาอยู่ที่การประสานข้ามวิชาชีพ" }
    hints:
      - "ปัญหาเป็นข้อเสียของโครงสร้างตามหน้าที่ข้อใด"
      - "โครงสร้างใดให้คนสังกัดหน่วยวิชาชีพและทำงานเป็นทีมรอบผู้ป่วยไปพร้อมกัน"
    solution: "ปัญหาคือการประสานข้ามหน้าที่ ทีมข้ามวิชาชีพที่สมาชิกยังสังกัดกลุ่มงานเดิมเป็นโครงสร้างแบบเมทริกซ์ ได้ทั้งความต่อเนื่องของการดูแลและการรักษามาตรฐานวิชาชีพ แต่ต้องกำหนดบทบาทของผู้ประสานงานทีมให้ชัด"
    license: CC-BY-SA-4.0
    ai_assisted: true
