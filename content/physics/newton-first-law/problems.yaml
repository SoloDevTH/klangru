  - id: phy.n1.p020
    topics: [physics.dynamics.newton-first]
    difficulty: 4
    type: numeric
    stem: "ในห้างสรรพสินค้า ลูกค้าเข็นรถเข็นด้วยแรง $100\\ \\mathrm{N}$ ตามแนวด้ามจับซึ่งเอียงลงทำมุม $30^\\circ$ กับแนวราบ รถเข็นเคลื่อนที่ไปข้างหน้าด้วยความเร็วคงตัว แรงต้านที่พื้นกระทำต่อรถเข็นในแนวราบมีขนาดเท่าใด (ตอบเป็นตัวเลขในหน่วย N ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 86.6, tolerance: 0.9, unit: N }
    hints:
      - "ความเร็วคงตัว แรงลัพธ์ในแนวราบเป็นศูนย์"
      - "แยกแรงเข็นเป็นองค์ประกอบแนวราบ $100\\cos 30^\\circ$ และแนวดิ่ง $100\\sin 30^\\circ$"
    misconceptions:
      - { match: 100, feedback: "แรง $100\\ \\mathrm{N}$ เอียงลง มีเพียงองค์ประกอบแนวราบที่ดันรถไปข้างหน้า" }
      - { match: 50, feedback: "นั่นคือองค์ประกอบแนวดิ่ง $100\\sin 30^\\circ$ ซึ่งกดรถลงพื้น องค์ประกอบแนวราบคือ $100\\cos 30^\\circ$" }
    solution: "องค์ประกอบแนวราบ $= 100\\cos 30^\\circ \\approx 86.6\\ \\mathrm{N}$ สมดุลจลน์จึงได้แรงต้าน $86.6\\ \\mathrm{N}$ ส่วนองค์ประกอบ $50\\ \\mathrm{N}$ ที่กดลงทำให้แรงตั้งฉากจากพื้นมากกว่าน้ำหนักของรถเข็น"
