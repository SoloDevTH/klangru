    figure: { src: p-skydiver.svg, alt: "กราฟความเร็ว–เวลา ช่วง P ความเร็วเพิ่มขึ้นเร็วจากศูนย์ ช่วง Q ความเร็วเกือบคงที่ประมาณ 55 m/s ที่ t = 10 ถึง 20 s ช่วง R ความเร็วลดลงอย่างรวดเร็วหลัง t = 20 s ช่วง S ความเร็วคงที่ประมาณ 6 m/s" }
    choices:
