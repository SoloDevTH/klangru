    stem: "ใช้ปริพันธ์สามชั้นหาปริมาตรของทรงสี่หน้า $x \\ge 0$, $y \\ge 0$, $z \\ge 0$, $x + y + z \\le 1$ (ตอบทศนิยมสามตำแหน่ง)"
