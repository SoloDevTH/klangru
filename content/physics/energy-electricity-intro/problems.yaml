    answer: { value: 9, unit: เท่า }
    hints:
      - "จากกราฟแท่ง ความเร็ว 1 เป็น 3 พลังงานเปลี่ยนจาก 1 เป็นเท่าไร"
      - "พลังงานจลน์เพิ่มตามความเร็วคูณตัวเอง"
    misconceptions:
      - { match: 3, feedback: "พลังงานไม่ได้เพิ่มเท่ากับความเร็ว ความเร็ว 2 เท่าทำให้พลังงานเพิ่ม 4 เท่า ความเร็ว 3 เท่าจึงเพิ่มมากกว่า 3 เท่า" }
      - { match: 6, feedback: "ดูเหมือนคูณ 3 ด้วย 2 แต่พลังงานเพิ่มตามความเร็วคูณความเร็ว คือ 3 × 3" }
    solution: "พลังงานจลน์เพิ่มตามกำลังสองของความเร็ว ความเร็ว 3 เท่า พลังงานเพิ่ม $3 \\times 3 = 9$ เท่า การขี่จักรยานเร็วจึงอันตรายกว่ามากเมื่อชน"
