<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" font-family="sans-serif" font-size="14">
  <title>กองการเรียกของ sum_to(3) กรอบซ้อนจากล่างขึ้นบน sum_to(3) sum_to(2) sum_to(1) และ sum_to(0) ที่คืน 0 แล้วค่าคืนกลับลงมาเป็น 1 3 และ 6</title>
  <defs><marker id="ah15803d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="820" height="380" fill="#ffffff"/>
  <text x="30.0" y="30.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="bold" xml:space="preserve">ขณะลึกที่สุด: กรอบซ้อนกัน 4 กรอบ</text>
  <rect x="60.0" y="50.0" width="330.0" height="62.0" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="74.0" y="75.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="bold" font-family="monospace" xml:space="preserve">sum_to(0)</text>
  <text x="74.0" y="98.0" font-size="14" text-anchor="start" fill="#1f2937" font-family="monospace" xml:space="preserve">n = 0</text>
  <text x="210.0" y="87.0" font-size="14" text-anchor="start" fill="#1f2937" xml:space="preserve">กรณีฐาน: return 0</text>
  <rect x="60.0" y="120.0" width="330.0" height="62.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="74.0" y="145.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="bold" font-family="monospace" xml:space="preserve">sum_to(1)</text>
  <text x="74.0" y="168.0" font-size="14" text-anchor="start" fill="#1f2937" font-family="monospace" xml:space="preserve">n = 1</text>
  <text x="210.0" y="157.0" font-size="14" text-anchor="start" fill="#1f2937" xml:space="preserve">รอ 1 + sum_to(0)</text>
  <rect x="60.0" y="190.0" width="330.0" height="62.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="74.0" y="215.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="bold" font-family="monospace" xml:space="preserve">sum_to(2)</text>
  <text x="74.0" y="238.0" font-size="14" text-anchor="start" fill="#1f2937" font-family="monospace" xml:space="preserve">n = 2</text>
  <text x="210.0" y="227.0" font-size="14" text-anchor="start" fill="#1f2937" xml:space="preserve">รอ 2 + sum_to(1)</text>
  <rect x="60.0" y="260.0" width="330.0" height="62.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="74.0" y="285.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="bold" font-family="monospace" xml:space="preserve">sum_to(3)</text>
  <text x="74.0" y="308.0" font-size="14" text-anchor="start" fill="#1f2937" font-family="monospace" xml:space="preserve">n = 3</text>
  <text x="210.0" y="297.0" font-size="14" text-anchor="start" fill="#1f2937" xml:space="preserve">รอ 3 + sum_to(2)</text>
  <text x="225.0" y="350.0" font-size="13" text-anchor="middle" fill="#6b7280" xml:space="preserve">▲ เรียกครั้งแรกอยู่ล่างสุด กรอบใหม่วางซ้อนข้างบน</text>
  <text x="30.0" y="370.0" font-size="13" text-anchor="start" fill="#6b7280" xml:space="preserve">ขาลง: เรียกซ้ำจนถึงกรณีฐาน (ยังไม่มีการบวก)</text>
  <text x="470.0" y="30.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="bold" xml:space="preserve">ขาขึ้น: กรอบบนสุดคืนค่าแล้วถูกยกออก</text>
  <rect x="470.0" y="58.0" width="320.0" height="46.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="630.0" y="86.2" font-size="15" text-anchor="middle" fill="#1f2937" xml:space="preserve">sum_to(0) คืน 0</text>
  <line x1="630.0" y1="104.0" x2="630.0" y2="128.0" stroke="#15803d" stroke-width="1.8" marker-end="url(#ah15803d)"/>
  <rect x="470.0" y="128.0" width="320.0" height="46.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="630.0" y="156.2" font-size="15" text-anchor="middle" fill="#1f2937" xml:space="preserve">sum_to(1) คืน 1 + 0 = 1</text>
  <line x1="630.0" y1="174.0" x2="630.0" y2="198.0" stroke="#15803d" stroke-width="1.8" marker-end="url(#ah15803d)"/>
  <rect x="470.0" y="198.0" width="320.0" height="46.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="630.0" y="226.2" font-size="15" text-anchor="middle" fill="#1f2937" xml:space="preserve">sum_to(2) คืน 2 + 1 = 3</text>
  <line x1="630.0" y1="244.0" x2="630.0" y2="268.0" stroke="#15803d" stroke-width="1.8" marker-end="url(#ah15803d)"/>
  <rect x="470.0" y="268.0" width="320.0" height="46.0" rx="6" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="630.0" y="296.2" font-size="15" text-anchor="middle" fill="#1f2937" xml:space="preserve">sum_to(3) คืน 3 + 3 = 6</text>
  <line x1="398.0" y1="81.0" x2="464.0" y2="81.0" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah6b7280)"/>
  <line x1="398.0" y1="151.0" x2="464.0" y2="151.0" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah6b7280)"/>
  <line x1="398.0" y1="221.0" x2="464.0" y2="221.0" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah6b7280)"/>
  <line x1="398.0" y1="291.0" x2="464.0" y2="291.0" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah6b7280)"/>
  <text x="630.0" y="350.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ผลสุดท้าย 6</text>
</svg>
