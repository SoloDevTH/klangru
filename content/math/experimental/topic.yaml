id: math.prob.experimental
subject: math
title: { th: ความน่าจะเป็นเชิงทดลองและการจำลอง, en: Experimental probability and simulation }
summary: บรรยายโอกาสด้วยคำและตัวเลข 0 ถึง 1 ทดลองซ้ำหาความถี่สัมพัทธ์ จำลองด้วยคอมพิวเตอร์ คาดการณ์ผล และหาโอกาสของเหตุการณ์ และ กับ หรือ
difficulty: 3.5
minutes: 40
prerequisites: [math.number.fractions, math.stats.data-display]
encompasses:
  - { id: math.number.fractions, weight: 0.3 }
  - { id: math.stats.data-display, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: likelihood-scale.svg
    alt: "มาตราส่วนโอกาสเป็นแถบจาก 0 ถึง 1 ใต้แถบเขียน เป็นไปไม่ได้ ที่ 0 ไม่น่าจะเกิด ที่ประมาณหนึ่งในสี่ เท่า ๆ กัน ที่ 1/2 น่าจะเกิด ที่ประมาณสามในสี่ และแน่นอน ที่ 1 มีจุด A ที่ 0 คือทอยเต๋าได้ 7, B ที่ 1/6 คือทอยเต๋าได้ 6, C ที่ 1/2 คือโยนเหรียญได้หัว, D ที่ 5/6 คือทอยเต๋าได้มากกว่า 1 และ E ที่ 1 คือทอยเต๋าได้น้อยกว่า 7"
    caption: "มาตราส่วนความน่าจะเป็น 0 ถึง 1 พร้อมตัวอย่างจากการทอยลูกเต๋าและโยนเหรียญ"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: running-frequency.svg
    alt: "กราฟเส้นสามเส้นของความถี่สัมพัทธ์ของการได้หัวเมื่อโยนเหรียญสะสมจาก 1 ถึง 1,000 ครั้ง แกนนอนเป็นสเกลลอการิทึม ช่วงแรกทั้งสามเส้นแกว่งมากระหว่าง 0 ถึง 1 เมื่อโยนเกิน 100 ครั้งทั้งสามเส้นเข้าใกล้เส้นประที่ 0.5 ที่ 1,000 ครั้งได้ 0.482, 0.488 และ 0.500"
    caption: "จำลองการโยนเหรียญ 1,000 ครั้ง สามรอบ ช่วงแรกผลแกว่งมาก เมื่อโยนมากขึ้นทุกเส้นเข้าใกล้ 0.5"
  - { type: check, problem: math.prob.experimental.p005, prompt: "เหรียญจำผลเก่าได้หรือไม่" }
  - type: worked-example
    title: ประมาณความน่าจะเป็นแล้วคาดการณ์
    problem: "นักเรียนโยนแก้วกระดาษ 80 ครั้ง ตกตะแคง 52 ครั้ง ตั้งหงาย 20 ครั้ง คว่ำ 8 ครั้ง ประมาณความน่าจะเป็นที่ตกตะแคง และคาดว่าถ้าโยน 500 ครั้งจะตกตะแคงกี่ครั้ง"
    steps:
      - text: "ตรวจว่าผลรวมครบ: $52 + 20 + 8 = 80$ ครั้ง"
      - text: "ความถี่สัมพัทธ์ของการตกตะแคง $= \\tfrac{52}{80} = 0.65$"
        why: "แก้วกระดาษไม่ได้มีโอกาสตกแต่ละแบบเท่ากัน จึงคำนวณจากรูปร่างไม่ได้ ต้องใช้ผลการทดลอง"
      - text: "ใช้ 0.65 เป็นค่าประมาณความน่าจะเป็น"
      - text: "คาดการณ์: $500 \\times 0.65 = 325$ ครั้ง"
        why: "จำนวนครั้งที่คาด $= n \\times P$ ผลจริงอาจต่างไปบ้างเพราะความแปรผัน"
    answer: "ความน่าจะเป็นประมาณ 0.65 คาดว่าตกตะแคงราว 325 ครั้งจาก 500 ครั้ง"
  - type: worked-example
    title: จำลองฝนตกสามวัน
    problem: "โอกาสฝนตกแต่ละวันเป็น 30% อิสระกัน ใช้การจำลองประมาณโอกาสที่ฝนตกอย่างน้อย 1 วันใน 3 วัน"
    steps:
      - text: "แบบจำลอง: สุ่มเลข 1–10 สามตัวแทน 3 วัน ถ้าเลขใดเป็น 1, 2 หรือ 3 วันนั้นฝนตก"
        why: "3 ใน 10 แบบคือโอกาส 30% พอดี"
      - text: "จำลอง 10 รอบได้ [6, 3, 7] [1, 2, 9] [2, 6, 10] [1, 9, 4] [1, 2, 7] [7, 2, 4] [2, 9, 7] [1, 10, 2] [4, 10, 1] [10, 10, 7]"
      - text: "รอบที่มีเลข 1–3 อย่างน้อยหนึ่งตัวมี 9 รอบ (ยกเว้นรอบสุดท้าย) ได้ค่าประมาณ $\\tfrac{9}{10} = 0.9$"
      - text: "เทียบค่าตามทฤษฎี: $1 - 0.7^3 = 1 - 0.343 = 0.657$"
        why: "ฝนไม่ตกเลยคือไม่ตกทั้งสามวัน โอกาส $0.7 \\times 0.7 \\times 0.7$"
      - text: "0.9 ต่างจาก 0.657 มาก เพราะจำลองแค่ 10 รอบ ต้องจำลองหลายร้อยรอบ (เช่น ในตารางคำนวณ) ค่าจึงจะเข้าใกล้ 0.657"
    answer: "จาก 10 รอบได้ประมาณ 0.9 แต่ค่าจริงประมาณ 0.66 การจำลองต้องทำจำนวนมากครั้งจึงเชื่อถือได้"
  - { type: check, problem: math.prob.experimental.p011, prompt: "แบบจำลองต้องให้โอกาสเท่าใด" }
glossary:
  - { term: การทดลองสุ่ม, definition: "การกระทำที่รู้ว่าผลเป็นอะไรได้บ้าง แต่ทำนายผลแต่ละครั้งไม่ได้" }
  - { term: ความถี่สัมพัทธ์, definition: "จำนวนครั้งที่เหตุการณ์เกิด หารด้วยจำนวนครั้งที่ทดลองทั้งหมด ใช้ประมาณความน่าจะเป็น" }
  - { term: การจำลอง, definition: "การใช้ผลสุ่มที่มีโอกาสเท่ากับสถานการณ์จริง (เช่น จากคอมพิวเตอร์) แทนการทดลองจริง" }
  - { term: กฎจำนวนมาก, definition: "เมื่อทดลองซ้ำมากครั้งขึ้น ความถี่สัมพัทธ์จะเข้าใกล้ความน่าจะเป็นตามทฤษฎี" }
  - { term: เหตุการณ์อิสระ, definition: "เหตุการณ์ที่ผลของอย่างหนึ่งไม่มีผลต่อโอกาสของอีกอย่าง" }
flashcards:
  - { front: "ความถี่สัมพัทธ์", back: "$\\dfrac{\\text{จำนวนครั้งที่เกิด}}{\\text{จำนวนครั้งที่ทดลอง}}$" }
  - { front: "ทดลอง $n$ ครั้ง คาดว่าเกิดกี่ครั้ง", back: "ประมาณ $n \\times P$ ครั้ง (ผลจริงแปรผันได้)" }
  - { front: "ทดลองมากครั้งขึ้น เกิดอะไรกับความถี่สัมพัทธ์", back: "แกว่งน้อยลงและเข้าใกล้ความน่าจะเป็นตามทฤษฎี (กฎจำนวนมาก)" }
  - { front: "\"หรือ\" แบบรวม กับแบบแยก", back: "แบบรวม: อย่างน้อยหนึ่งอย่าง (นับคนที่อยู่ทั้งสองกลุ่มครั้งเดียว) แบบแยก: อย่างใดอย่างหนึ่งเท่านั้น" }
  - { front: "โยนเหรียญได้หัว 5 ครั้งติด ครั้งถัดไป", back: "ยังมีโอกาสได้หัว $\\tfrac12$ เพราะการโยนแต่ละครั้งเป็นอิสระกัน" }
