<text x="340.0" y="30.0" text-anchor="middle" font-size="12" fill="#475569">ข้อมูลจำลองของกาแล็กซี 6 แห่ง เส้นประคือเส้นตรงที่เหมาะที่สุดผ่านจุดกำเนิด</text>
