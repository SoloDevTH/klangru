<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" font-family="'Sarabun','Noto Sans Thai','Noto Sans Thai UI','Leelawadee UI','Tahoma','Loma',sans-serif">
<title>แผนภาพการวิเคราะห์วรรณคดี 3 ด้าน และการประเมินคุณค่า</title>
<defs><marker id="a555" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="0" y="0" width="900" height="590" fill="#fff"/>
<text x="450.0" y="30.0" font-size="20" text-anchor="middle" fill="#111" font-weight="bold">วิเคราะห์วรรณคดีจากตัวบท</text>
<rect x="330.0" y="200.0" width="240.0" height="90.0" rx="14" fill="#37474f" stroke="#37474f" stroke-width="1.5"/>
<text x="450.0" y="238.0" font-size="22" text-anchor="middle" fill="#fff" font-weight="bold">ตัวบท</text>
<text x="450.0" y="268.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="normal">ยกมาเป็นหลักฐานทุกครั้ง</text>
<rect x="30.0" y="60.0" width="280.0" height="170.0" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.2"/>
<text x="170.0" y="90.0" font-size="17" text-anchor="middle" fill="#1565c0" font-weight="bold">ด้านเนื้อหา</text>
<text x="50.0" y="122.0" font-size="14.5" text-anchor="start" fill="#111" font-weight="normal">• เรื่อง (สรุปตามลำดับ)</text>
<text x="50.0" y="150.0" font-size="14.5" text-anchor="start" fill="#111" font-weight="normal">• ตัวละครหรือผู้เล่า</text>
<text x="50.0" y="178.0" font-size="14.5" text-anchor="start" fill="#111" font-weight="normal">• ฉาก (ที่ไหน เมื่อไร)</text>
<text x="50.0" y="206.0" font-size="14.5" text-anchor="start" fill="#111" font-weight="normal">• แนวคิด (แก่นเรื่อง)</text>
<rect x="590.0" y="60.0" width="280.0" height="170.0" rx="12" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2.2"/>
<text x="730.0" y="90.0" font-size="17" text-anchor="middle" fill="#6a1b9a" font-weight="bold">ด้านวรรณศิลป์</text>
<text x="610.0" y="122.0" font-size="14.5" text-anchor="start" fill="#111" font-weight="normal">• สรรคำ เล่นเสียง เล่นคำ</text>
<text x="610.0" y="150.0" font-size="14.5" text-anchor="start" fill="#111" font-weight="normal">• ภาพพจน์ (เปรียบอะไรกับอะไร)</text>
<text x="610.0" y="178.0" font-size="14.5" text-anchor="start" fill="#111" font-weight="normal">• รสวรรณคดี</text>
<text x="610.0" y="206.0" font-size="14.5" text-anchor="start" fill="#111" font-weight="normal">• ขนบของคำประพันธ์</text>
<rect x="30.0" y="330.0" width="280.0" height="170.0" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.2"/>
<text x="170.0" y="360.0" font-size="17" text-anchor="middle" fill="#2e7d32" font-weight="bold">ด้านสังคมและวัฒนธรรม</text>
<text x="50.0" y="392.0" font-size="14.5" text-anchor="start" fill="#111" font-weight="normal">• วิถีชีวิต อาชีพ การแต่งกาย</text>
<text x="50.0" y="420.0" font-size="14.5" text-anchor="start" fill="#111" font-weight="normal">• ความเชื่อ ศาสนา ค่านิยม</text>
<text x="50.0" y="448.0" font-size="14.5" text-anchor="start" fill="#111" font-weight="normal">• เชื่อมกับประวัติศาสตร์</text>
<text x="50.0" y="476.0" font-size="14.5" text-anchor="start" fill="#111" font-weight="normal">• (ตรวจกับแหล่งอื่น)</text>
<rect x="590.0" y="330.0" width="280.0" height="170.0" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.2"/>
<text x="730.0" y="360.0" font-size="17" text-anchor="middle" fill="#ef6c00" font-weight="bold">ประเมินคุณค่าและนำไปใช้</text>
<text x="610.0" y="392.0" font-size="14.5" text-anchor="start" fill="#111" font-weight="normal">• ชี้จุดเด่น จุดด้อย พร้อมเหตุผล</text>
<text x="610.0" y="420.0" font-size="14.5" text-anchor="start" fill="#111" font-weight="normal">• คุณค่าด้านวรรณศิลป์ เนื้อหา</text>
<text x="610.0" y="448.0" font-size="14.5" text-anchor="start" fill="#111" font-weight="normal">• สังคม และการนำไปใช้</text>
<text x="610.0" y="476.0" font-size="14.5" text-anchor="start" fill="#111" font-weight="normal">• ข้อคิดสำหรับชีวิตปัจจุบัน</text>
<line x1="330.0" y1="215.0" x2="312.0" y2="190.0" stroke="#555" stroke-width="2" stroke-linecap="round" marker-end="url(#a555)"/>
<line x1="570.0" y1="215.0" x2="588.0" y2="190.0" stroke="#555" stroke-width="2" stroke-linecap="round" marker-end="url(#a555)"/>
<line x1="330.0" y1="280.0" x2="312.0" y2="330.0" stroke="#555" stroke-width="2" stroke-linecap="round" marker-end="url(#a555)"/>
<line x1="570.0" y1="280.0" x2="588.0" y2="330.0" stroke="#555" stroke-width="2" stroke-linecap="round" marker-end="url(#a555)"/>
<rect x="40.0" y="540.0" width="190.0" height="34.0" rx="8" fill="#fafafa" stroke="#90a4ae" stroke-width="1.5"/>
<text x="135.0" y="562.0" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">1 อ่านและถอดความ</text>
<line x1="232.0" y1="557.0" x2="253.0" y2="557.0" stroke="#555" stroke-width="2" stroke-linecap="round" marker-end="url(#a555)"/>
<rect x="255.0" y="540.0" width="190.0" height="34.0" rx="8" fill="#fafafa" stroke="#90a4ae" stroke-width="1.5"/>
<text x="350.0" y="562.0" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">2 วิเคราะห์</text>
<line x1="447.0" y1="557.0" x2="468.0" y2="557.0" stroke="#555" stroke-width="2" stroke-linecap="round" marker-end="url(#a555)"/>
<rect x="470.0" y="540.0" width="190.0" height="34.0" rx="8" fill="#fafafa" stroke="#90a4ae" stroke-width="1.5"/>
<text x="565.0" y="562.0" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">3 วิจารณ์</text>
<line x1="662.0" y1="557.0" x2="683.0" y2="557.0" stroke="#555" stroke-width="2" stroke-linecap="round" marker-end="url(#a555)"/>
<rect x="685.0" y="540.0" width="190.0" height="34.0" rx="8" fill="#fafafa" stroke="#90a4ae" stroke-width="1.5"/>
<text x="780.0" y="562.0" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">4 ประเมินคุณค่า</text>
<text x="450.0" y="526.0" font-size="14" text-anchor="middle" fill="#555" font-weight="normal">หลักการวิจารณ์เบื้องต้น 4 ขั้น</text>
</svg>
