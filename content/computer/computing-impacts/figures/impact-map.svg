<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="sans-serif" font-size="13">
  <title>ผังประเมินผลกระทบของแอปสั่งอาหารห้าด้าน แต่ละด้านมีผลดีและผลเสีย</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="860" height="470" fill="#ffffff"/>
  <rect x="335.0" y="203.0" width="190.0" height="64.0" rx="6" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="430.0" y="230.1" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">แอปสั่งอาหาร</text>
  <text x="430.0" y="250.4" font-size="15" text-anchor="middle" fill="#1f2937">ใครได้ ใครเสีย</text>
  <rect x="30.0" y="30.0" width="250.0" height="100.0" rx="6" fill="#fff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="155.0" y="56.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">ส่วนบุคคล</text>
  <text x="44.0" y="86.0" font-size="13" text-anchor="start" fill="#15803d">+ สะดวก ไม่ต้องออกจากบ้าน</text>
  <text x="44.0" y="112.0" font-size="13" text-anchor="start" fill="#b91c1c">− ใช้เงินเกินตัวง่ายขึ้น</text>
  <rect x="580.0" y="30.0" width="250.0" height="100.0" rx="6" fill="#fff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="705.0" y="56.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">เศรษฐกิจ</text>
  <text x="594.0" y="86.0" font-size="13" text-anchor="start" fill="#15803d">+ ร้านเล็กขายได้ไกลขึ้น</text>
  <text x="594.0" y="112.0" font-size="13" text-anchor="start" fill="#b91c1c">− ร้านเสียค่าคอมมิชชัน</text>
  <rect x="30.0" y="340.0" width="250.0" height="100.0" rx="6" fill="#fff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="155.0" y="366.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">สังคม</text>
  <text x="44.0" y="396.0" font-size="13" text-anchor="start" fill="#15803d">+ เกิดงานไรเดอร์จำนวนมาก</text>
  <text x="44.0" y="422.0" font-size="13" text-anchor="start" fill="#b91c1c">− ไรเดอร์ไม่มีสวัสดิการประจำ</text>
  <rect x="580.0" y="340.0" width="250.0" height="100.0" rx="6" fill="#fff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="705.0" y="366.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">วัฒนธรรม</text>
  <text x="594.0" y="396.0" font-size="13" text-anchor="start" fill="#15803d">+ ลองอาหารต่างถิ่นได้ง่าย</text>
  <text x="594.0" y="422.0" font-size="13" text-anchor="start" fill="#b91c1c">− คนกินข้าวด้วยกันน้อยลง</text>
  <rect x="305.0" y="370.0" width="250.0" height="92.0" rx="6" fill="#fff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="430.0" y="394.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">จริยธรรม</text>
  <text x="319.0" y="422.0" font-size="13" text-anchor="start" fill="#15803d">+ ให้คะแนนร้านอย่างเปิดเผย</text>
  <text x="319.0" y="448.0" font-size="13" text-anchor="start" fill="#b91c1c">− แอปเก็บตำแหน่งและข้อมูลการกิน</text>
  <line x1="280.0" y1="110.0" x2="350.0" y2="203.0" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="580.0" y1="110.0" x2="510.0" y2="203.0" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="280.0" y1="360.0" x2="335.0" y2="255.0" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="580.0" y1="360.0" x2="525.0" y2="255.0" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="430.0" y1="370.0" x2="430.0" y2="267.0" stroke="#6b7280" stroke-width="1.2"/>
  <text x="430.0" y="20.0" font-size="13" text-anchor="middle" fill="#6b7280">เขียนให้ครบทั้งผลดี (+) และผลเสีย (−) ในทุกด้าน</text>
</svg>
