problems:
  - id: biology.humans.body-parts.p001
    topics: [biology.humans.body-parts]
    difficulty: 1
    type: mcq
    stem: "เราใช้ส่วนใดของร่างกายมองเห็นสีของดอกไม้"
    choices:
      - { id: a, text: "ตา", correct: true }
      - { id: b, text: "หู", feedback: "หูใช้ฟังเสียง ไม่ได้ใช้มองเห็น" }
      - { id: c, text: "จมูก", feedback: "จมูกใช้ดมกลิ่นดอกไม้ แต่มองเห็นสีไม่ได้" }
      - { id: d, text: "มือ", feedback: "มือใช้จับและรู้สึกผิวของดอกไม้ แต่บอกสีไม่ได้" }
    hints:
      - "ถ้าหลับตา เราจะยังเห็นสีไหม"
      - "ส่วนนี้อยู่บนใบหน้า มี 2 ข้าง"
    solution: "เรามองเห็นสีและรูปร่างด้วยตา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.body-parts.p002
    topics: [biology.humans.body-parts]
    difficulty: 1
    type: match
    stem: "จับคู่ส่วนของร่างกายกับสิ่งที่ส่วนนั้นรับรู้"
    pairs:
      - { left: "ตา", right: "มองเห็น" }
      - { left: "หู", right: "ได้ยินเสียง" }
      - { left: "จมูก", right: "ดมกลิ่น" }
      - { left: "ลิ้น", right: "รับรส" }
      - { left: "ผิวหนัง", right: "รู้สึกร้อนหรือเย็น" }
    hints:
      - "ลองนึกว่าเวลากินส้มตำ เรารู้ว่าเผ็ดหรือเค็มด้วยส่วนไหน"
      - "เวลาจับแก้วน้ำแข็ง ส่วนไหนรู้ว่าเย็น"
    solution: "ตา → มองเห็น, หู → ได้ยินเสียง, จมูก → ดมกลิ่น, ลิ้น → รับรส, ผิวหนัง → รู้สึกร้อนหรือเย็น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.body-parts.p003
    topics: [biology.humans.body-parts]
    difficulty: 1
    type: text
    stem: "ส่วนของพืชที่อยู่ในดิน ใช้ดูดน้ำและยึดต้นไว้ไม่ให้ล้ม เรียกว่าอะไร"
    accepted: ["ราก"]
    hints:
      - "ส่วนนี้มองไม่เห็นเพราะอยู่ใต้ดิน"
      - "เวลาถอนต้นหญ้า ส่วนนี้จะติดดินขึ้นมาด้วย"
    misconceptions:
      - { match: "ลำต้น", feedback: "ลำต้นอยู่เหนือดิน ชูใบและดอก ส่วนที่อยู่ในดินและดูดน้ำคือราก" }
      - { match: "ใบ", feedback: "ใบอยู่บนต้น ใช้รับแสงสร้างอาหาร ส่วนที่ดูดน้ำจากดินคือราก" }
    solution: "ราก อยู่ในดิน ดูดน้ำให้ต้นพืช และยึดต้นไว้กับดิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.body-parts.p004
    topics: [biology.humans.body-parts]
    difficulty: 2
    type: match
    stem: "ดูภาพ แล้วจับคู่หมายเลขกับชื่อส่วนของร่างกาย"
    figure: { src: body-numbered.svg, alt: "ภาพเด็กยืนตรง มีวงกลมหมายเลขชี้ส่วนต่าง ๆ: 1 ชี้ที่ส่วนบนสุดของร่างกายที่มีผม 2 ชี้ที่ข้อพับกลางแขน 3 ชี้ที่ปลายแขนที่มีนิ้ว 4 ชี้ที่ข้อพับกลางขา 5 ชี้ที่ปลายขาซึ่งใช้ยืน" }
    pairs:
      - { left: "หมายเลข 1", right: "ศีรษะ" }
      - { left: "หมายเลข 2", right: "ข้อศอก" }
      - { left: "หมายเลข 3", right: "มือ" }
      - { left: "หมายเลข 4", right: "เข่า" }
      - { left: "หมายเลข 5", right: "เท้า" }
    hints:
      - "ข้อศอกอยู่กลางแขน เข่าอยู่กลางขา"
      - "มืออยู่ปลายแขน เท้าอยู่ปลายขา"
    solution: "1 ศีรษะ (บนสุด มีผม), 2 ข้อศอก (ข้อพับกลางแขน), 3 มือ (ปลายแขน), 4 เข่า (ข้อพับกลางขา), 5 เท้า (ปลายขา)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.body-parts.p005
    topics: [biology.humans.body-parts]
    difficulty: 2
    type: mcq
    stem: "ปลานิลในบ่อหายใจด้วยส่วนใด"
    choices:
      - { id: a, text: "เหงือก", correct: true }
      - { id: b, text: "ครีบ", feedback: "ครีบใช้พยุงตัวและว่ายน้ำ ไม่ได้ใช้หายใจ" }
      - { id: c, text: "จมูกเหมือนคน", feedback: "ปลาไม่ได้หายใจด้วยจมูกแบบคน ปลาใช้เหงือกที่อยู่ข้างหัว" }
      - { id: d, text: "เกล็ด", feedback: "เกล็ดหุ้มและป้องกันลำตัว ไม่ได้ใช้หายใจ" }
    hints:
      - "ส่วนนี้อยู่ด้านข้างของหัวปลา ขยับเปิดปิดตลอดเวลา"
      - "ส่วนนี้ช่วยให้ปลาได้อากาศที่ละลายอยู่ในน้ำ"
    solution: "ปลาหายใจด้วยเหงือก น้ำไหลผ่านเหงือก และเหงือกรับอากาศที่ละลายอยู่ในน้ำเข้าสู่ร่างกาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.body-parts.p006
    topics: [biology.humans.body-parts]
    difficulty: 2
    type: mcq
    stem: "นกกระจอกใช้ส่วนใดจิกเมล็ดข้าวกิน"
    choices:
      - { id: a, text: "จะงอยปาก", correct: true }
      - { id: b, text: "ปีก", feedback: "ปีกใช้บิน ไม่ได้ใช้จิกอาหาร" }
      - { id: c, text: "นิ้วเท้า", feedback: "นิ้วเท้าใช้เกาะกิ่งไม้และเดิน นกจิกอาหารด้วยปาก" }
      - { id: d, text: "ขน", feedback: "ขนให้ความอบอุ่นและช่วยบิน ไม่ได้ใช้กินอาหาร" }
    hints:
      - "นกไม่มีมือ จึงใช้ส่วนอื่นหยิบอาหาร"
      - "ส่วนนี้แข็ง อยู่ที่หัวนก"
    solution: "นกใช้จะงอยปากซึ่งแข็งและแหลมจิกเมล็ดข้าว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.body-parts.p007
    topics: [biology.humans.body-parts]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "น้องฝนรับลูกบอลที่เพื่อนโยนมาได้ น้องฝนใช้ส่วนใดของร่างกายทำงานร่วมกันเป็นหลัก (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ตา มองลูกบอล", correct: true }
      - { id: b, text: "แขน ยื่นออกไป", correct: true }
      - { id: c, text: "มือ จับลูกบอล", correct: true }
      - { id: d, text: "ลิ้น รับรส", feedback: "การรับลูกบอลไม่ต้องใช้การรับรส" }
      - { id: e, text: "จมูก ดมกลิ่น", feedback: "การดมกลิ่นไม่ได้ช่วยรับลูกบอล" }
    hints:
      - "ต้องรู้ก่อนว่าลูกบอลอยู่ไหน แล้วจึงเอื้อมไปจับ"
      - "มีสามส่วนที่ใช้ดู ยื่น และจับ"
    solution: "ตามองลูกบอล แขนยื่นออกไป และมือจับลูกบอล ส่วนเหล่านี้ทำงานร่วมกัน ลิ้นและจมูกไม่ได้ใช้ในการรับลูกบอล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.body-parts.p008
    topics: [biology.humans.body-parts]
    difficulty: 2
    type: order
    stem: "เรียงการทำงานของส่วนต่าง ๆ ของร่างกายเมื่อกินข้าวเหนียวมะม่วง"
    items:
      - "ตามองข้าวเหนียวมะม่วงในจาน"
      - "มือตักข้าวเหนียวมะม่วงเข้าปาก"
      - "ฟันเคี้ยวให้ละเอียด และลิ้นรับรสหวาน"
      - "กลืนอาหารลงคอ"
    hints:
      - "ก่อนตักต้องเห็นอาหารก่อน"
      - "ต้องเคี้ยวก่อนจึงกลืนได้"
    solution: "ตามอง → มือตักเข้าปาก → ฟันเคี้ยวและลิ้นรับรส → กลืนลงคอ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.body-parts.p009
    topics: [biology.humans.body-parts]
    difficulty: 3
    type: mcq
    stem: "ข้อใดเป็นการดูแลตาที่ถูกต้อง"
    choices:
      - { id: a, text: "อ่านหนังสือในที่ที่มีแสงสว่างพอ และไม่มองดวงอาทิตย์ตรง ๆ", correct: true }
      - { id: b, text: "ขยี้ตาแรง ๆ เมื่อมีฝุ่นเข้าตา", feedback: "การขยี้ตาอาจทำให้ฝุ่นขูดตาเป็นแผล ให้กะพริบตาหรือล้างด้วยน้ำสะอาด" }
      - { id: c, text: "เล่นโทรศัพท์ในห้องมืดนาน ๆ ก่อนนอน", feedback: "การจ้องจอในที่มืดนาน ๆ ทำให้ตาล้า ควรพักสายตาและเปิดไฟให้สว่าง" }
      - { id: d, text: "ใช้ผ้าเช็ดหน้าผืนเดียวกับเพื่อนที่ตาแดง", feedback: "โรคตาแดงติดต่อกันได้ทางผ้าเช็ดหน้า ไม่ควรใช้ของร่วมกัน" }
    hints:
      - "แสงแดดจ้าและแสงที่น้อยเกินไปทำร้ายตาได้"
      - "เลือกข้อที่ไม่ทำให้ตาบาดเจ็บหรือติดเชื้อ"
    solution: "การอ่านหนังสือในที่สว่างพอช่วยไม่ให้ตาล้า และการไม่มองดวงอาทิตย์ตรง ๆ ป้องกันไม่ให้ตาบาดเจ็บ ข้ออื่นทำให้ตาเสี่ยงบาดเจ็บหรือติดเชื้อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.body-parts.p010
    topics: [biology.humans.body-parts]
    difficulty: 3
    type: mcq
    stem: "ก่อนกินข้าวกลางวันที่โรงเรียน น้องเก่งเพิ่งเล่นฟุตบอลเสร็จ น้องเก่งควรทำอย่างไรกับมือ"
    choices:
      - { id: a, text: "ล้างมือด้วยสบู่และน้ำสะอาดก่อนกินข้าว", correct: true }
      - { id: b, text: "เช็ดมือกับเสื้อแล้วกินได้เลย", feedback: "เสื้อที่ใส่เล่นกีฬามีเหงื่อและฝุ่น เชื้อโรคยังอยู่ที่มือ" }
      - { id: c, text: "ล้างแค่น้ำเปล่าเร็ว ๆ ไม่ต้องใช้สบู่", feedback: "สบู่ช่วยชะล้างคราบสกปรกและเชื้อโรคได้ดีกว่าน้ำเปล่า" }
      - { id: d, text: "ไม่ต้องล้าง เพราะจะใช้ช้อนกิน", feedback: "มือยังจับช้อนและอาหาร เชื้อโรคที่มือจึงเข้าปากได้" }
    hints:
      - "มือสัมผัสลูกบอลและพื้นสนาม"
      - "สิ่งใดช่วยล้างเชื้อโรคออกจากมือได้ดี"
    solution: "ควรล้างมือด้วยสบู่และน้ำสะอาดก่อนกินอาหาร เพราะมือที่เล่นกีฬามาสัมผัสฝุ่นและเชื้อโรค"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.body-parts.p011
    topics: [biology.humans.body-parts]
    difficulty: 3
    type: mcq
    stem: "คืนวันลอยกระทง มีคนจุดประทัดเสียงดังใกล้ ๆ น้องแพรควรทำอย่างไรเพื่อดูแลหู"
    choices:
      - { id: a, text: "เดินออกห่างจากที่จุดประทัด และใช้มือปิดหูเมื่อมีเสียงดัง", correct: true }
      - { id: b, text: "เข้าไปดูใกล้ ๆ เพื่อฟังให้ชัด", feedback: "เสียงดังมากในระยะใกล้ทำให้หูอื้อหรือเสียการได้ยินได้" }
      - { id: c, text: "ใช้ไม้แคะหูแหย่หูไว้กันเสียง", feedback: "ห้ามใส่ของแหลมในหู อาจทำให้แก้วหูทะลุ" }
      - { id: d, text: "ไม่ต้องทำอะไร เพราะหูทนเสียงดังได้ทุกระดับ", feedback: "หูบาดเจ็บได้จากเสียงที่ดังมาก ควรอยู่ห่างจากเสียงดัง" }
    hints:
      - "เสียงดังมากทำร้ายหูได้"
      - "ยิ่งอยู่ไกลจากเสียง เสียงก็ยิ่งเบาลง"
    solution: "ควรอยู่ห่างจากเสียงดังและปิดหูเมื่อมีเสียงดังมาก ไม่ใส่ของแหลมเข้าไปในหู ถ้าหูอื้อหรือปวดหูให้บอกผู้ใหญ่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.body-parts.p012
    topics: [biology.humans.body-parts]
    difficulty: 3
    type: numeric
    stem: "คนมีมือ 2 ข้าง ข้างละ 5 นิ้ว และมีเท้า 2 ข้าง ข้างละ 5 นิ้ว นิ้วมือและนิ้วเท้ารวมกันมีกี่นิ้ว"
    answer: { value: 20, unit: นิ้ว }
    hints:
      - "นับนิ้วมือทั้งสองข้างก่อน แล้วนับนิ้วเท้าทั้งสองข้าง"
      - "นิ้วมือ 5 + 5 แล้วบวกนิ้วเท้า 5 + 5"
    misconceptions:
      - { match: 10, feedback: "10 คือนิ้วมือทั้งสองข้าง หรือนิ้วเท้าทั้งสองข้างอย่างเดียว ต้องรวมทั้งสองอย่าง" }
      - { match: 5, feedback: "5 คือนิ้วของมือหรือเท้าข้างเดียว ยังต้องนับข้างอื่นด้วย" }
    solution: "นิ้วมือ $5 + 5 = 10$ นิ้ว นิ้วเท้า $5 + 5 = 10$ นิ้ว รวม $10 + 10 = 20$ นิ้ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.body-parts.p013
    topics: [biology.humans.body-parts]
    difficulty: 4
    type: mcq
    stem: "คุณยายย้ายต้นพริกจากกระถางลงแปลง แต่รากขาดเกือบหมด ไม่กี่ชั่วโมงต่อมาใบพริกเหี่ยว เพราะเหตุใด"
    choices:
      - { id: a, text: "รากที่ขาดดูดน้ำจากดินได้น้อย ต้นพริกจึงขาดน้ำ", correct: true }
      - { id: b, text: "ใบพริกไม่ได้รับแสง", feedback: "ต้นพริกยังอยู่กลางแจ้งและได้แสงเหมือนเดิม ส่วนที่เสียหายคือราก" }
      - { id: c, text: "ดอกพริกหลุดร่วง", feedback: "ดอกไม่ได้ทำหน้าที่ส่งน้ำให้ใบ ใบเหี่ยวเพราะขาดน้ำ" }
      - { id: d, text: "ลำต้นยาวเกินไป", feedback: "ความยาวลำต้นไม่ได้เปลี่ยน ปัญหาคือรากขาดจึงดูดน้ำไม่ได้" }
    hints:
      - "ส่วนใดของพืชดูดน้ำจากดิน"
      - "ใบเหี่ยวเป็นสัญญาณว่าพืชขาดอะไร"
    solution: "รากดูดน้ำจากดิน แล้วลำต้นส่งน้ำขึ้นไปที่ใบ เมื่อรากขาด ต้นพริกได้น้ำไม่พอ ใบจึงเหี่ยว ส่วนต่าง ๆ ของพืชทำงานร่วมกันเหมือนร่างกายของเรา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.body-parts.p014
    topics: [biology.humans.body-parts]
    difficulty: 4
    type: match
    stem: "จับคู่สัตว์กับส่วนที่ใช้เคลื่อนที่เป็นหลัก"
    pairs:
      - { left: "ปลาทู", right: "ครีบและหาง" }
      - { left: "นกพิราบ", right: "ปีก" }
      - { left: "แมว", right: "ขา 4 ขา" }
