    misconceptions:
      - { match: 208, feedback: "คูณ 200 ด้วย 1.04 ทำให้จำนวนที่ต้องส่งออกน้อยเกินไป ต้องหารด้วย 0.96 เพราะ 4% หายไประหว่างทาง" }
      - { match: 8, feedback: "นั่นคือจำนวนกล่องที่เสียหาย ไม่ใช่จำนวนที่ต้องส่งออก" }
    solution: "ให้ส่งออก $x$ กล่อง มีกล่องดีราว $0.96x \\ge 200$ จึง $x \\ge \\dfrac{200}{0.96} \\approx 208.33$ ปัดขึ้นได้ 209 กล่อง"
