problems:
- id: thai.grammar.idioms-proverbs.p001
  topics:
  - thai.grammar.idioms-proverbs
  difficulty: 1
  type: mcq
  stem: สำนวน **วัวหายล้อมคอก** หมายความว่าอย่างไร
  choices:
  - id: a
    text: เรื่องเกิดขึ้นแล้วจึงคิดแก้ไข
    correct: true
    feedback: ถูก
  - id: b
    text: ต้องสร้างคอกวัวให้แข็งแรง
    feedback: แปลตามตัว ไม่ใช่ความหมายของสำนวน
  - id: c
    text: คนที่ทำดีแต่ไม่มีใครเห็น
    feedback: เป็นความหมายของ ปิดทองหลังพระ
  - id: d
    text: มีรายได้มาเรื่อย ๆ
    feedback: เป็นความหมายของ น้ำซึมบ่อทราย
  hints:
  - วัวหายไปแล้ว คนจึงค่อยล้อมคอก
  - ล้อมคอกตอนนี้ช้าไปหรือไม่
  solution: '**เรื่องเกิดขึ้นแล้วจึงคิดแก้ไข** เหมือนวัวหายแล้วจึงล้อมคอก'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.idioms-proverbs.p002
  topics:
  - thai.grammar.idioms-proverbs
  difficulty: 1
  type: match
  stem: จับคู่สำนวนกับความหมาย
  pairs:
  - left: น้ำซึมบ่อทราย
    right: มีรายได้มาเรื่อย ๆ
  - left: คมในฝัก
    right: มีความสามารถแต่ยังไม่แสดงออก
  - left: ผักชีโรยหน้า
    right: ทำความดีเพียงผิวเผิน
  - left: ไก่อ่อน
    right: มีประสบการณ์น้อย ไม่รู้ทันเล่ห์เหลี่ยม
  hints:
  - นึกภาพตามตัวก่อน แล้วคิดว่าเปรียบกับคนอย่างไร
  - น้ำซึมบ่อทรายไหลมาทีละน้อยไม่ขาด
  solution: น้ำซึมบ่อทราย = รายได้มาเรื่อย ๆ · คมในฝัก = เก่งแต่ไม่แสดง · ผักชีโรยหน้า = ดีแค่ผิว · ไก่อ่อน = ประสบการณ์น้อย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.idioms-proverbs.p003
  topics:
  - thai.grammar.idioms-proverbs
  difficulty: 2
  type: mcq
  stem: '"วิชัยวาดรูปเก่งที่สุดในห้อง แต่ไม่เคยอวด จนวันแข่งวาดภาพจึงได้รางวัลที่ 1" สำนวนใดเหมาะกับวิชัย'
  choices:
  - id: a
    text: คมในฝัก
    correct: true
    feedback: ถูก มีความสามารถแต่ไม่แสดงออกจนถึงเวลา
  - id: b
    text: ผักชีโรยหน้า
    feedback: ใช้กับการทำดีแค่ภายนอก ไม่ตรงเรื่อง
  - id: c
    text: ไก่อ่อน
    feedback: ใช้กับคนที่ประสบการณ์น้อย
  - id: d
    text: วัวหายล้อมคอก
    feedback: ใช้กับการแก้ไขหลังเกิดเรื่อง
  hints:
  - วิชัยเก่งแต่ไม่อวด
  - สำนวนใดพูดถึงความสามารถที่ซ่อนไว้
  solution: วิชัยเก่งแต่ไม่แสดงออก จึงเหมาะกับ **คมในฝัก**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.idioms-proverbs.p004
  topics:
  - thai.grammar.idioms-proverbs
  difficulty: 2
  type: text
  stem: 'เติมสำนวนให้ครบ: "หนีเสือปะ___" (พิมพ์คำที่หายไป)'
  accepted:
  - จระเข้
  misconceptions:
  - match: จรเข้
    feedback: สะกดผิด เขียนว่า จระเข้
  - match: ช้าง
    feedback: สำนวนนี้คือ หนีเสือปะจระเข้
  hints:
  - สำนวนนี้หมายถึง หนีภัยหนึ่งไปเจออีกภัยหนึ่ง
  - สัตว์ร้ายในน้ำ
  solution: '**หนีเสือปะจระเข้** หนีภัยหนึ่งแล้วไปพบอีกภัยหนึ่ง'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.idioms-proverbs.p005
  topics:
  - thai.grammar.idioms-proverbs
  difficulty: 2
  type: mcq
  stem: ข้อใดเป็น **สุภาษิต** (สอนให้ทำหรือไม่ทำอย่างตรง ๆ)
  choices:
  - id: a
    text: น้ำขึ้นให้รีบตัก
    correct: true
    feedback: ถูก สอนว่ามีโอกาสดีควรรีบทำ
  - id: b
    text: ไก่อ่อน
    feedback: เป็นวลีสั้นบอกลักษณะคน (สำนวน)
  - id: c
    text: ขี่ช้างจับตั๊กแตน
    feedback: เปรียบเหตุการณ์ ไม่ได้สั่งสอนตรง ๆ (คำพังเพย)
  - id: d
    text: ผักชีโรยหน้า
    feedback: วลีบอกลักษณะการกระทำ (สำนวน)
  hints:
  - สุภาษิตมักมีคำสั่งสอน เช่น ให้ อย่า ควร
  - ข้อใดบอกให้ทำอะไร
  solution: '**น้ำขึ้นให้รีบตัก** สอนตรง ๆ ว่ามีโอกาสดีให้รีบทำ จึงเป็นสุภาษิต'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.idioms-proverbs.p006
  topics:
  - thai.grammar.idioms-proverbs
  difficulty: 3
  type: mcq
  stem: '"พี่เตรียมงานวันเกิดให้น้องอยู่เบื้องหลังทั้งคืน แต่ไม่มีใครรู้ว่าพี่ทำ" สำนวนใดเหมาะที่สุด'
  choices:
  - id: a
    text: ปิดทองหลังพระ
    correct: true
    feedback: ถูก ทำดีแต่ไม่มีใครเห็น
  - id: b
    text: ผักชีโรยหน้า
    feedback: หมายถึงทำดีแค่ผิวเผิน แต่พี่ทำจริงจัง
  - id: c
    text: ชักใบให้เรือเสีย
    feedback: หมายถึงทำให้เรื่องเขว
  - id: d
    text: น้ำซึมบ่อทราย
    feedback: หมายถึงรายได้มาเรื่อย ๆ
  hints:
  - พี่ทำดีจริงหรือแค่ภายนอก
  - มีคนเห็นหรือไม่
  solution: พี่ทำดีจริงแต่ไม่มีใครเห็น จึงเป็น **ปิดทองหลังพระ**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.idioms-proverbs.p007
  topics:
  - thai.grammar.idioms-proverbs
  difficulty: 3
  type: match
  stem: จับคู่สำนวนกับ **ที่มา**
  pairs:
  - left: ชักใบให้เรือเสีย
    right: การเดินเรือ
  - left: ปิดทองหลังพระ
    right: ศาสนา
  - left: รำไม่ดีโทษปี่โทษกลอง
    right: การแสดง
  - left: คมในฝัก
    right: อาวุธ
  hints:
  - นึกภาพตามตัวของแต่ละสำนวน
  - ปี่และกลองใช้ประกอบอะไร
  solution: ใบเรือ = การเดินเรือ · ปิดทองพระพุทธรูป = ศาสนา · รำ ปี่ กลอง = การแสดง · ฝักมีดดาบ = อาวุธ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.idioms-proverbs.p008
  topics:
  - thai.grammar.idioms-proverbs
  difficulty: 3
  type: mcq
  stem: '"เมื่อทีมแพ้ กัปตันกลับบอกว่าเพราะลูกบอลไม่ดีและสนามลื่น" สำนวนใดเหมาะกับกัปตัน'
  choices:
  - id: a
    text: รำไม่ดีโทษปี่โทษกลอง
    correct: true
    feedback: ถูก ทำไม่ดีแล้วโทษสิ่งอื่น
  - id: b
    text: หนีเสือปะจระเข้
    feedback: หมายถึงหนีภัยหนึ่งไปเจออีกภัย
  - id: c
    text: วัวหายล้อมคอก
    feedback: หมายถึงแก้ไขหลังเกิดเรื่อง
  - id: d
    text: สอนจระเข้ให้ว่ายน้ำ
    feedback: หมายถึงสอนคนที่ถนัดอยู่แล้ว
  hints:
  - กัปตันยอมรับว่าตัวเองพลาดหรือไม่
  - สำนวนใดพูดถึงการโทษผู้อื่น
  solution: กัปตันไม่รับผิด แต่โทษลูกบอลและสนาม ตรงกับ **รำไม่ดีโทษปี่โทษกลอง**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.idioms-proverbs.p009
  topics:
  - thai.grammar.idioms-proverbs
  difficulty: 3
  type: mcq
  stem: '"ลุงนั่งแท็กซี่ไปไกลเพื่อซื้อขนมราคา 10 บาท ค่ารถหมดไป 300 บาท" สำนวนใดเหมาะที่สุด'
  choices:
  - id: a
    text: ขี่ช้างจับตั๊กแตน
    correct: true
    feedback: ถูก ลงทุนมากแต่ได้ผลนิดเดียว
  - id: b
    text: น้ำซึมบ่อทราย
    feedback: หมายถึงรายได้มาเรื่อย ๆ
  - id: c
    text: คมในฝัก
    feedback: หมายถึงเก่งแต่ไม่แสดง
  - id: d
    text: น้ำขึ้นให้รีบตัก
    feedback: หมายถึงรีบใช้โอกาส
  hints:
  - เทียบสิ่งที่เสียไปกับสิ่งที่ได้มา
  - สำนวนใดพูดถึงการลงทุนไม่คุ้ม
  solution: เสีย 300 บาทเพื่อของ 10 บาท ลงทุนมากได้ผลน้อย จึงเป็น **ขี่ช้างจับตั๊กแตน**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.idioms-proverbs.p010
  topics:
  - thai.grammar.idioms-proverbs
  difficulty: 4
  type: mcq
  stem: ข้อใดอธิบายความต่างของ **ปิดทองหลังพระ** กับ **ผักชีโรยหน้า** ได้ถูกต้อง
  choices:
  - id: a
    text: ปิดทองหลังพระ ทำดีจริงแต่ไม่มีใครเห็น ส่วนผักชีโรยหน้า ทำดีเพียงภายนอกให้คนเห็น
    correct: true
    feedback: ถูก
  - id: b
    text: ทั้งสองหมายถึงการทำดีที่ไม่มีใครเห็น
    feedback: ผักชีโรยหน้าทำให้คนเห็น แต่ดีแค่ผิว
  - id: c
    text: ปิดทองหลังพระ เป็นคำติ ส่วนผักชีโรยหน้า เป็นคำชม
    feedback: กลับกัน ผักชีโรยหน้าเป็นคำติ
  - id: d
    text: ทั้งสองพูดถึงการทำอาหาร
    feedback: ปิดทองหลังพระมาจากศาสนา
  hints:
  - คนทำดีจริงหรือไม่ และมีคนเห็นหรือไม่
  - สำนวนใดเป็นคำติ
  solution: '**ปิดทองหลังพระ** = ทำดีจริงแต่ไม่มีใครเห็น · **ผักชีโรยหน้า** = ทำดีแค่ภายนอก (เป็นคำติ)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.idioms-proverbs.p011
  topics:
  - thai.grammar.idioms-proverbs
  difficulty: 4
  type: mcq
  stem: ประโยคใดใช้สำนวน **ถูกต้อง**
  choices:
  - id: a
    text: ลุงทำสวนมาสามสิบปี หลานจะสอนลุงปลูกมะม่วง ก็เหมือนสอนจระเข้ให้ว่ายน้ำ
    correct: true
    feedback: ถูก สอนคนที่ถนัดอยู่แล้ว
  - id: b
    text: น้องสอบได้ที่หนึ่งเพราะขยันมาก เป็นวัวหายล้อมคอก
    feedback: วัวหายล้อมคอกใช้กับการแก้ไขหลังเกิดเรื่อง
  - id: c
    text: พ่อค้าขายของได้กำไรเยอะในวันเดียว เป็นน้ำซึมบ่อทราย
    feedback: น้ำซึมบ่อทรายคือรายได้มาทีละน้อยเรื่อย ๆ ไม่ใช่ครั้งเดียวมาก ๆ
  - id: d
    text: ครูชมนักเรียนว่าเป็นผักชีโรยหน้า
    feedback: ผักชีโรยหน้าเป็นคำติ ไม่ใช่คำชม
  hints:
  - ตรวจทุกส่วนของความหมายกับสถานการณ์
  - ระวังคำติที่ใช้เป็นคำชม
  solution: ข้อแรกถูก **สอนจระเข้ให้ว่ายน้ำ** = สอนสิ่งที่เขาถนัดอยู่แล้ว ข้ออื่นใช้ผิดความหมาย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.idioms-proverbs.p012
  topics:
  - thai.grammar.idioms-proverbs
  difficulty: 4
  type: order
  stem: เรียงขั้นตอนการเลือกใช้สำนวนให้เหมาะกับสถานการณ์
  items:
  - เข้าใจความหมายของสำนวนให้ถูก ไม่แปลตามตัว
  - ดูว่าสำนวนเป็นคำชมหรือคำติ
  - ตรวจว่าสถานการณ์ตรงกับความหมายทุกส่วน
  - คิดถึงผู้ฟังว่าใช้แล้วเหมาะสมหรือไม่
  hints:
  - ต้องรู้ความหมายก่อนทุกอย่าง
  - ขั้นสุดท้ายคิดถึงผู้ฟัง
  solution: เข้าใจความหมาย → ดูว่าชมหรือติ → ตรวจสถานการณ์ทุกส่วน → คิดถึงผู้ฟัง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.idioms-proverbs.p013
  topics:
  - thai.grammar.idioms-proverbs
  difficulty: 4
  type: mcq
  stem: เพื่อนกำลังโกรธจัดเพราะทำของหาย น้องจะเข้าไปเถียงว่าเป็นความผิดของเพื่อนเอง แม่เตือนด้วยถ้อยคำใดเหมาะที่สุด
  choices:
  - id: a
    text: น้ำเชี่ยวอย่าขวางเรือ
    correct: true
    feedback: ถูก อย่าขวางคนที่กำลังโกรธจัด
  - id: b
    text: น้ำขึ้นให้รีบตัก
    feedback: หมายถึงรีบใช้โอกาส จะยิ่งยุให้เถียง
  - id: c
    text: วัวหายล้อมคอก
    feedback: ไม่ได้เตือนเรื่องการขวางคนที่โกรธ
  - id: d
    text: คมในฝัก
    feedback: หมายถึงเก่งแต่ไม่แสดง
  hints:
  - สถานการณ์คือคนกำลังโกรธจัด
  - สุภาษิตใดเตือนว่า อย่า...
  solution: '**น้ำเชี่ยวอย่าขวางเรือ** สอนว่าอย่าขวางผู้มีอำนาจหรือคนที่กำลังโกรธจัด'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.idioms-proverbs.p014
  topics:
  - thai.grammar.idioms-proverbs
  difficulty: 5
  type: mcq
  stem: ข้อใด **วิเคราะห์และเปรียบเทียบ** "ขี่ช้างจับตั๊กแตน" กับ "น้ำขึ้นให้รีบตัก" ได้ถูกต้อง
  choices:
  - id: a
    text: ขี่ช้างจับตั๊กแตน เปรียบเหตุการณ์ให้ตีความเอง (คำพังเพย) ส่วนน้ำขึ้นให้รีบตัก สอนตรง ๆ ว่าควรทำ (สุภาษิต)
    correct: true
    feedback: ถูก
  - id: b
    text: ทั้งสองเป็นสุภาษิตเพราะสอนใจ
    feedback: ขี่ช้างจับตั๊กแตนไม่ได้บอกว่าควรทำอะไร
  - id: c
    text: ทั้งสองเป็นวลีสั้นบอกลักษณะคน
    feedback: ทั้งสองบรรยายเหตุการณ์หรือการกระทำ ไม่ใช่ลักษณะคน
  - id: d
