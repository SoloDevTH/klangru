id: health.community.community-health-safety
subject: health
title:
  th: สุขภาพและความปลอดภัยในชุมชน
  en: Community health and safety
summary: รวบรวมข้อมูลและจัดลำดับปัญหาสุขภาพชุมชน ดัชนีลูกน้ำยุงลาย บทบาทของบุคคลและ อสม. วางแผนลดอุบัติเหตุด้วยหลัก 5E และการมีส่วนร่วมพัฒนาชุมชน
difficulty: 4.5
minutes: 35
prerequisites:
- health.disease.ncd-leading-causes
encompasses:
- id: health.disease.ncd-leading-causes
  weight: 0.2
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  title: วงจรแก้ปัญหาสุขภาพชุมชน
  src: cycle.svg
  alt: แผนภาพวงกลมห้าขั้น 1 รวบรวมข้อมูล (สถิติ รพ.สต. แบบสำรวจ แผนที่ชุมชน จุดเสี่ยง) 2 วิเคราะห์ จัดลำดับ (ขนาด ความรุนแรง ความยากง่าย ความร่วมมือ) 3 วางแผน (เป้าหมายวัดได้ กิจกรรม ผู้รับผิดชอบ งบ ตัวชี้วัด) 4 ลงมือทำ (คนในชุมชน อสม. รพ.สต. อบต. โรงเรียน) 5 ประเมินผล (เทียบก่อน–หลัง ปรับแผน) แล้ววนกลับขั้นที่ 1 ตรงกลางเขียนว่าชุมชนร่วมคิด ร่วมทำ ร่วมประเมิน
  caption: ผลการประเมินคือข้อมูลตั้งต้นของรอบถัดไป
- type: worked-example
  title: คำนวณดัชนีลูกน้ำยุงลายและเทียบเกณฑ์
  problem: อสม. สำรวจหมู่บ้านหนึ่ง 40 หลังคาเรือน พบลูกน้ำ 6 หลัง ภาชนะขังน้ำทั้งหมด 250 ใบ พบลูกน้ำ 10 ใบ หา HI CI BI และบอกว่าผ่านเกณฑ์ชุมชนหรือไม่
  steps:
  - text: $\mathrm{HI} = \frac{6}{40} \times 100 = 15$
    why: HI นับจำนวนบ้าน ไม่ใช่จำนวนภาชนะ
  - text: $\mathrm{CI} = \frac{10}{250} \times 100 = 4$
  - text: $\mathrm{BI} = \frac{10}{40} \times 100 = 25$ ภาชนะต่อบ้าน 100 หลัง
    why: BI ใช้ภาชนะเป็นตัวตั้งแต่หารด้วยจำนวนบ้าน
  - text: เกณฑ์ชุมชนคือ HI ไม่เกิน 10 แต่ได้ 15 จึง **ไม่ผ่าน**
  - text: 'แนวทาง: ทุกบ้านปิดฝาโอ่ง เปลี่ยนน้ำแจกันและจานรองกระถางทุกสัปดาห์ เก็บขยะที่ขังน้ำ แล้วสำรวจซ้ำใน 1 สัปดาห์'
  answer: HI 15, CI 4, BI 25 ไม่ผ่านเกณฑ์ HI ต้องเร่งกำจัดแหล่งเพาะพันธุ์
- type: check
  problem: health.community.community-health-safety.p005
  prompt: ลองใช้ตารางคำนวณเอง
- type: figure
  title: ผลสำรวจลูกน้ำยุงลาย 4 หมู่บ้าน
  src: survey.svg
  alt: ตารางผลสำรวจลูกน้ำยุงลาย 4 หมู่บ้าน ข้อมูลสมมติ หมู่ 1 สำรวจ 60 บ้าน พบลูกน้ำ 9 บ้าน ภาชนะ 420 พบลูกน้ำ 15 หมู่ 2 สำรวจ 45 บ้าน พบ 3 บ้าน ภาชนะ 300 พบ 4 หมู่ 3 สำรวจ 80 บ้าน พบ 14 บ้าน ภาชนะ 560 พบ 22 หมู่ 4 สำรวจ 50 บ้าน พบ 5 บ้าน ภาชนะ 350 พบ 6
  caption: ข้อมูลสมมติสำหรับฝึกคำนวณ ใช้ในโจทย์ของหัวข้อนี้
- type: worked-example
  title: จัดลำดับปัญหาและวางแผนด้วยหลัก 5E
  problem: สภานักเรียนพบสองปัญหา (1) รถล้มที่ทางโค้งหน้าโรงเรียน คะแนนขนาด 3 ความรุนแรง 4 ความยากง่าย 2 ความร่วมมือ 3 (2) ขยะในคลอง คะแนน 3, 2, 3, 2 ควรแก้ปัญหาใดก่อน และวางแผนอย่างไร
  steps:
  - text: ปัญหา 1 รวม $3+4+2+3 = 12$ ปัญหา 2 รวม $3+2+3+2 = 10$
  - text: ปัญหา 1 ได้คะแนนสูงกว่า เพราะรุนแรงถึงขั้นบาดเจ็บหรือเสียชีวิต จึงแก้ก่อน
    why: ความรุนแรงเป็นเกณฑ์ที่ทำให้ปัญหาอุบัติเหตุมีน้ำหนักมาก
  - text: 'เป้าหมาย: ภายใน 6 เดือน ผู้ขับขี่และผู้ซ้อนสวมหมวกนิรภัยอย่างน้อยร้อยละ 70 และไม่มีรถล้มที่ทางโค้ง'
  - text: 'กิจกรรมตาม 5E: รณรงค์หมวกนิรภัย (Education) ขอ อบต. ติดไฟและป้าย (Engineering) ตำรวจตั้งจุดตรวจ (Enforcement) ติดเบอร์ 1669 (Emergency)'
  - text: 'ประเมินผล (Evaluation): นับผู้สวมหมวกและจำนวนรถล้มก่อนและหลัง แล้วรายงานต่อชุมชน'
  answer: แก้ปัญหาทางโค้งก่อน (12 คะแนน) ด้วยแผนที่ใช้หลัก 5E ครบและมีเป้าหมายวัดได้
- type: check
  problem: health.community.community-health-safety.p008
glossary:
- term: อสม.
  definition: อาสาสมัครสาธารณสุขประจำหมู่บ้าน คนในชุมชนที่ผ่านการอบรม ทำงานส่งเสริมสุขภาพและป้องกันโรคร่วมกับ รพ.สต.
- term: ดัชนีบ้านที่พบลูกน้ำ (HI)
  definition: ร้อยละของบ้านที่สำรวจแล้วพบลูกน้ำยุงลาย เกณฑ์ชุมชนคือไม่เกิน 10
- term: ดัชนีภาชนะที่พบลูกน้ำ (CI)
  definition: ร้อยละของภาชนะขังน้ำที่พบลูกน้ำ ในโรงเรียนและโรงพยาบาลต้องเป็น 0
- term: หลัก 5E
  definition: แนวทางลดอุบัติเหตุ 5 ด้าน คือ ให้ความรู้ ปรับสิ่งแวดล้อม บังคับใช้กฎ เตรียมรับเหตุฉุกเฉิน และประเมินผล
- term: การจัดลำดับความสำคัญของปัญหา
  definition: การให้คะแนนปัญหาตามเกณฑ์ เช่น ขนาด ความรุนแรง ความยากง่าย และความร่วมมือ เพื่อเลือกแก้ปัญหาที่สำคัญก่อน
flashcards:
- front: ห้าขั้นการแก้ปัญหาสุขภาพชุมชน
  back: รวบรวมข้อมูล → วิเคราะห์จัดลำดับ → วางแผน → ลงมือทำ → ประเมินผล
- front: เกณฑ์ดัชนีลูกน้ำยุงลายของกรมควบคุมโรค
  back: ชุมชน HI ไม่เกิน 10 ส่วนโรงเรียน โรงพยาบาล สถานบริการสาธารณสุข CI = 0
- front: หลัก 5E ลดอุบัติเหตุ
  back: Education, Engineering, Enforcement, Emergency, Evaluation
- front: 1669 / 191 / 199 / 1784
  back: เจ็บป่วยฉุกเฉิน / เหตุด่วนเหตุร้าย / ไฟไหม้ / สาธารณภัย
