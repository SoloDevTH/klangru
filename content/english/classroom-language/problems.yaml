problems:
  - id: english.vocabulary.classroom-language.p001
    topics: [english.vocabulary.classroom-language]
    difficulty: 1
    type: mcq
    stem: "ครูพูดว่า *Stand up, please.* นักเรียนควรทำอะไร"
    choices:
      - { id: a, text: "ลุกขึ้นยืน", correct: true, feedback: "ถูก stand up แปลว่าลุกขึ้นยืน" }
      - { id: b, text: "นั่งลง", feedback: "นั่งลงคือ sit down ส่วน stand up ตรงข้ามกัน" }
      - { id: c, text: "ยกมือ", feedback: "ยกมือคือ raise your hand" }
      - { id: d, text: "เปิดหนังสือ", feedback: "เปิดหนังสือคือ open your book" }
    hints:
      - "คำกริยาในคำสั่งคือ stand"
      - "up แปลว่าขึ้น"
    solution: "*Stand up.* = **ลุกขึ้นยืน** ส่วน please ทำให้คำสั่งสุภาพขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.classroom-language.p002
    topics: [english.vocabulary.classroom-language]
    difficulty: 1
    type: match
    stem: "ดูภาพนักเรียน 4 ภาพ แล้วจับคู่หมายเลขภาพกับคำสั่งที่นักเรียนทำตาม"
    figure: { src: classroom-actions-quiz.svg, alt: "ภาพตัวการ์ตูนเส้น 4 ช่อง มีหมายเลขมุมซ้ายบน ภาพ 1 คนยืนยกแขนข้างหนึ่งขึ้นสูง ภาพ 2 คนยืนถือหนังสือที่เปิดอยู่ ภาพ 3 คนนั่งบนเก้าอี้ ภาพ 4 คนยืนข้างเก้าอี้ มีลูกศรชี้ขึ้นแสดงว่าเพิ่งลุกขึ้น" }
    pairs:
      - { left: "ภาพ 1", right: "Raise your hand." }
      - { left: "ภาพ 2", right: "Open your book." }
      - { left: "ภาพ 3", right: "Sit down." }
      - { left: "ภาพ 4", right: "Stand up." }
    hints:
      - "ดูท่าทางของแต่ละภาพ: ยืน นั่ง ยกมือ หรือถือหนังสือ"
      - "raise = ยกขึ้น, sit down = นั่งลง, stand up = ลุกขึ้นยืน"
    solution: "ภาพ 1 ยกมือ = *Raise your hand.* · ภาพ 2 เปิดหนังสือ = *Open your book.* · ภาพ 3 นั่ง = *Sit down.* · ภาพ 4 ลุกขึ้นยืน = *Stand up.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.classroom-language.p003
    topics: [english.vocabulary.classroom-language]
    difficulty: 1
    type: text
    stem: "เติมคำสั่งให้ได้ความว่า **เปิดหนังสือหน้า 10**: *___ your book to page 10.* (พิมพ์คำเดียว)"
    accepted: ["Open", "open"]
    misconceptions:
      - { match: "close", feedback: "close แปลว่าปิด ส่วนเปิดคือ open" }
      - { match: "opens", feedback: "ประโยคคำสั่งใช้คำกริยารูปเดิม ไม่เติม s" }
      - { match: "opening", feedback: "ประโยคคำสั่งใช้คำกริยารูปเดิม ไม่เติม ing" }
    hints:
      - "ประโยคคำสั่งขึ้นต้นด้วยคำกริยา"
      - "เปิด (หนังสือ ประตู หน้าต่าง) ภาษาอังกฤษคือคำว่าอะไร"
    solution: "*__Open__ your book to page 10.* ขึ้นต้นด้วยคำกริยารูปเดิม open"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.classroom-language.p004
    topics: [english.vocabulary.classroom-language]
    difficulty: 1
    type: mcq
    stem: "ครูพูดว่า *Be quiet, please.* หมายความว่าอะไร"
    choices:
      - { id: a, text: "เงียบหน่อย", correct: true, feedback: "ถูก quiet แปลว่าเงียบ" }
      - { id: b, text: "พูดดัง ๆ", feedback: "พูดดังคือ speak loudly ตรงข้ามกับ be quiet" }
      - { id: c, text: "รีบหน่อย", feedback: "รีบคือ hurry up" }
      - { id: d, text: "ตั้งใจฟัง", feedback: "ตั้งใจฟังคือ listen carefully" }
    hints:
      - "quiet เป็นคำคุณศัพท์ แปลว่าอะไร"
      - "be + คุณศัพท์ ในประโยคคำสั่ง หมายถึง ทำตัวให้เป็นอย่างนั้น"
    solution: "*Be quiet.* = **เงียบ** ครูใช้เมื่อห้องเสียงดัง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.classroom-language.p005
    topics: [english.vocabulary.classroom-language]
    difficulty: 2
    type: mcq
    stem: "ประโยคคำสั่ง \"นั่งลง\" ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "Sit down.", correct: true, feedback: "ถูก ประโยคคำสั่งขึ้นต้นด้วยกริยารูปเดิม" }
      - { id: b, text: "Sits down.", feedback: "ประโยคคำสั่งไม่เติม s ที่กริยา" }
      - { id: c, text: "Sitting down.", feedback: "รูป ing ไม่ใช้ในประโยคคำสั่ง" }
      - { id: d, text: "To sit down.", feedback: "ประโยคคำสั่งไม่มี to นำหน้ากริยา" }
    hints:
      - "ประโยคคำสั่งไม่มีประธาน"
      - "ใช้คำกริยารูปเดิม ไม่เติมอะไรเลย"
    solution: "**Sit down.** คำกริยารูปเดิมขึ้นต้นประโยค"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.classroom-language.p006
    topics: [english.vocabulary.classroom-language]
    difficulty: 2
    type: text
    stem: "ทำให้เป็นคำสั่งห้าม **อย่าวิ่งในห้องเรียน**: *___ run in the classroom.*"
    accepted: ["Don't", "don't", "Do not", "do not"]
    misconceptions:
      - { match: "no", feedback: "ภาษาไทยพูดว่า ห้ามวิ่ง แต่ภาษาอังกฤษไม่ใช้ No + กริยา ให้ใช้ Don't" }
      - { match: "not", feedback: "not ต้องมี do นำหน้า: Don't (Do not)" }
      - { match: "doesn't", feedback: "ประโยคคำสั่งพูดกับ you จึงใช้ Don't ไม่ใช่ doesn't" }
    hints:
      - "คำสั่งห้ามมีคำหนึ่งวางหน้าคำกริยา"
      - "คำนั้นย่อมาจาก do not"
    solution: "*__Don't__ run in the classroom.* (Do not run in the classroom.) คำสั่งห้ามใช้ Don't + กริยารูปเดิม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.classroom-language.p007
    topics: [english.vocabulary.classroom-language]
    difficulty: 2
    type: order
    stem: "เรียงคำให้เป็นคำขอร้อง \"กรุณาปิดประตู\""
    items: ["Please", "close", "the", "door."]
    hints:
      - "please วางหน้าประโยคได้ สังเกตตัวพิมพ์ใหญ่"
      - "ต่อด้วยคำกริยา แล้วจึงเป็นสิ่งที่ปิด"
    solution: "*Please close the door.* = please + กริยา close + the door"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.classroom-language.p008
    topics: [english.vocabulary.classroom-language]
    difficulty: 2
    type: mcq
    stem: "ระหว่างคาบภาษาอังกฤษ ต้นปวดท้องอยากไปห้องน้ำ ต้นควรพูดกับครูว่าอะไร"
    choices:
      - { id: a, text: "May I go to the toilet, please?", correct: true, feedback: "ถูก May I ...? เป็นการขออนุญาตที่สุภาพ" }
      - { id: b, text: "I go toilet.", feedback: "ประโยคนี้บอกเฉย ๆ ว่าไป ไม่ได้ขออนุญาต และขาด to the" }
      - { id: c, text: "Go to the toilet!", feedback: "ประโยคนี้เป็นคำสั่งให้คนฟังไปห้องน้ำ ไม่ใช่การขออนุญาต" }
      - { id: d, text: "Do I go to the toilet?", feedback: "Do I ...? ถามว่าฉันไปไหม ไม่ได้ขออนุญาต" }
    hints:
      - "ต้องการขออนุญาตครู ไม่ใช่สั่งครู"
      - "การขออนุญาตใช้ May I ...? หรือ Can I ...?"
    solution: "ขออนุญาตใช้ **May I go to the toilet, please?** (Can I go to the toilet, please? ก็ได้)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.classroom-language.p009
    topics: [english.vocabulary.classroom-language]
    difficulty: 3
    type: match
    stem: "จับคู่ประโยคที่นักเรียนใช้กับความหมาย"
    pairs:
      - { left: "Sorry, I don't understand.", right: "ขอโทษ ไม่เข้าใจ" }
      - { left: "Can you say that again, please?", right: "ช่วยพูดอีกครั้งได้ไหม" }
      - { left: "How do you say \"ส้มตำ\" in English?", right: "ส้มตำ ภาษาอังกฤษพูดว่าอะไร" }
      - { left: "What does \"quiet\" mean?", right: "quiet แปลว่าอะไร" }
      - { left: "I'm finished.", right: "ทำเสร็จแล้ว" }
    hints:
      - "how do you say ... ถามคำในภาษาอังกฤษ ส่วน what does ... mean ถามความหมาย"
      - "again = อีกครั้ง, finished = เสร็จ"
    solution: "Sorry, I don't understand. = ไม่เข้าใจ · Can you say that again? = พูดอีกครั้ง · How do you say ...? = ภาษาอังกฤษพูดว่าอะไร · What does ... mean? = แปลว่าอะไร · I'm finished. = เสร็จแล้ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.classroom-language.p010
    topics: [english.vocabulary.classroom-language]
    difficulty: 3
    type: text
    stem: "เติมคำสั่งให้ได้ความว่า **ดูที่กระดาน**: *___ at the board.*"
    accepted: ["Look", "look"]
    misconceptions:
      - { match: "see", feedback: "see แปลว่าเห็น ไม่ใช้กับ at คำสั่งให้หันไปดูใช้ Look at" }
      - { match: "watch", feedback: "watch ใช้กับสิ่งที่เคลื่อนไหวนาน ๆ เช่น watch TV และไม่ใช้กับ at คำสั่งนี้ใช้ Look at" }
      - { match: "looks", feedback: "ประโยคคำสั่งไม่เติม s ที่กริยา" }
    hints:
      - "คำกริยาที่ตามด้วย at แปลว่าดู"
      - "look at = มองไปที่"
    solution: "*__Look__ at the board.* ใช้ look at เมื่อบอกให้หันไปมองสิ่งใดสิ่งหนึ่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.classroom-language.p011
    topics: [english.vocabulary.classroom-language]
    difficulty: 3
    type: mcq
    stem: "ก่อนสอบ ครูพูดว่า *Take out your pencil. Write your name at the top of the paper. Don't open the test yet.* ตอนนี้นักเรียน **ห้าม** ทำอะไร"
    choices:
      - { id: a, text: "เปิดข้อสอบ", correct: true, feedback: "ถูก Don't open the test yet. แปลว่าอย่าเพิ่งเปิดข้อสอบ" }
      - { id: b, text: "หยิบดินสอออกมา", feedback: "Take out your pencil. เป็นคำสั่งให้ทำ ไม่ได้ห้าม" }
      - { id: c, text: "เขียนชื่อบนกระดาษ", feedback: "Write your name ... เป็นคำสั่งให้ทำ" }
      - { id: d, text: "ไม่มีข้อใดถูก", feedback: "มีประโยคหนึ่งขึ้นต้นด้วย Don't ซึ่งเป็นคำสั่งห้าม" }
    hints:
      - "หาประโยคที่ขึ้นต้นด้วย Don't"
      - "yet ในประโยคปฏิเสธแปลว่า ยัง หรือ อย่าเพิ่ง"
    solution: "ประโยค *Don't open the test yet.* เป็นคำสั่งห้าม นักเรียนจึง **ห้ามเปิดข้อสอบ** ตอนนี้ ส่วนหยิบดินสอและเขียนชื่อต้องทำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.classroom-language.p012
    topics: [english.vocabulary.classroom-language]
    difficulty: 3
    type: order
    stem: "ครูพูดว่า *Stand up. Push in your chair. Then line up at the door.* เรียงสิ่งที่นักเรียนต้องทำตามลำดับ"
    items: ["ลุกขึ้นยืน", "ดันเก้าอี้เข้าที่", "ไปเข้าแถวที่ประตู"]
    hints:
      - "ทำตามลำดับที่ครูพูด"
      - "then แปลว่า แล้วจึง ใช้บอกขั้นต่อไป"
    solution: "Stand up = ลุกขึ้นยืน → Push in your chair = ดันเก้าอี้เข้าที่ → Then line up at the door = แล้วไปเข้าแถวที่ประตู"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.classroom-language.p013
    topics: [english.vocabulary.classroom-language]
    difficulty: 3
    type: mcq
    stem: "ตอนเช้าก่อนเคารพธงชาติ ครูพูดว่า *Line up, please.* นักเรียนควรทำอะไร"
    choices:
      - { id: a, text: "เข้าแถว", correct: true, feedback: "ถูก line up แปลว่าเข้าแถว" }
      - { id: b, text: "ร้องเพลงชาติ", feedback: "ร้องเพลงคือ sing ส่วน line up คือเข้าแถว" }
      - { id: c, text: "นั่งลงที่พื้น", feedback: "นั่งลงคือ sit down" }
      - { id: d, text: "กลับเข้าห้องเรียน", feedback: "กลับเข้าห้องคือ go back to the classroom" }
    hints:
      - "line แปลว่า เส้น หรือ แถว"
      - "line up คือทำให้เป็นแถว"
    solution: "*Line up.* = **เข้าแถว**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.classroom-language.p014
    topics: [english.vocabulary.classroom-language]
    difficulty: 4
    type: text
    stem: "ห้องเรียนสว่างแล้ว ครูอยากให้นักเรียน **ปิดไฟ**: *___ the light, please.* (พิมพ์สองคำ)"
    accepted: ["Turn off", "turn off", "Switch off", "switch off"]
    misconceptions:
      - { match: "close", feedback: "ภาษาไทยพูดว่า ปิดไฟ แต่ภาษาอังกฤษไม่ใช้ close กับไฟ ใช้ turn off" }
      - { match: "close off", feedback: "ภาษาอังกฤษไม่มี close off กับไฟ ใช้ turn off หรือ switch off" }
      - { match: "turn on", feedback: "turn on แปลว่าเปิดไฟ ส่วนปิดไฟคือ turn off" }
      - { match: "open", feedback: "open แปลว่าเปิด และไม่ใช้กับไฟ ให้ใช้ turn on (เปิด) หรือ turn off (ปิด)" }
    hints:
      - "เครื่องใช้ไฟฟ้า (ไฟ พัดลม ทีวี) ไม่ใช้ open/close"
      - "เปิดไฟคือ turn on ปิดไฟคือ turn ... อะไร"
    solution: "*__Turn off__ the light, please.* (หรือ Switch off) เครื่องใช้ไฟฟ้าใช้ turn on/turn off ไม่ใช้ open/close แบบภาษาไทย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.classroom-language.p015
    topics: [english.vocabulary.classroom-language]
    difficulty: 4
    type: mcq
    stem: "ฝนลืมยางลบ อยากขอยืมยางลบจากเพื่อน ประโยคใด **สุภาพและถูกต้อง** ที่สุด"
    choices:
      - { id: a, text: "Can you lend me your eraser, please?", correct: true, feedback: "ถูก Can you ...? กับ please เป็นคำขอร้องที่สุภาพ" }
      - { id: b, text: "Give me your eraser.", feedback: "ประโยคนี้ถูกไวยากรณ์ แต่เป็นคำสั่งห้วน ๆ ไม่สุภาพ" }
      - { id: c, text: "You give eraser.", feedback: "ประโยคนี้ไม่ใช่คำขอร้อง และขาด me กับ your" }
      - { id: d, text: "Please you give me eraser.", feedback: "หลัง please ใช้กริยาเลย ไม่ต้องมี you และควรมี your หน้า eraser" }
    hints:
      - "คำขอร้องที่สุภาพมักเป็นคำถาม"
      - "Can you ...? + please"
    solution: "**Can you lend me your eraser, please?** เป็นคำขอร้องที่สุภาพ (lend = ให้ยืม)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.classroom-language.p016
    topics: [english.vocabulary.classroom-language]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "เลือกประโยคคำสั่งหรือคำขอร้องที่ **ถูกต้อง** ทั้งหมด"
    choices:
      - { id: a, text: "Please be quiet.", correct: true }
      - { id: b, text: "Don't talk, please.", correct: true }
      - { id: c, text: "Turn on the fan, please.", correct: true }
      - { id: d, text: "Don't to run.", feedback: "หลัง Don't ใช้กริยารูปเดิมทันที ไม่มี to: Don't run." }
      - { id: e, text: "Opens the window.", feedback: "ประโยคคำสั่งไม่เติม s: Open the window." }
      - { id: f, text: "Please you sit down.", feedback: "หลัง please ไม่ใส่ you: Please sit down." }
    hints:
      - "ตรวจว่ากริยาเป็นรูปเดิมหรือไม่"
      - "หลัง Don't และ please ต้องตามด้วยกริยาทันที"
    solution: "ถูก: *Please be quiet.* · *Don't talk, please.* · *Turn on the fan, please.* ผิด: Don't to run → Don't run · Opens → Open · Please you sit down → Please sit down"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.vocabulary.classroom-language.p017
