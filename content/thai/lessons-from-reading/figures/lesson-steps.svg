<text x="569.0" y="92.0" font-size="14" text-anchor="start" fill="#111" font-weight="bold">สรุปเป็นข้อคิด</text>
<text x="605.0" y="132.0" font-size="15" text-anchor="middle" fill="#333" font-weight="normal">อย่าดูถูก</text>
<text x="605.0" y="156.0" font-size="15" text-anchor="middle" fill="#333" font-weight="normal">ผู้ที่เล็กกว่า</text>
<rect x="700.0" y="30.0" width="148.0" height="290.0" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
