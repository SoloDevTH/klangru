id: management.operations.linear-programming
subject: management
title: { th: "การวิจัยดำเนินงานเบื้องต้น: กำหนดการเชิงเส้น", en: "Introduction to operations research: linear programming" }
summary: สร้างแบบจำลองกำหนดการเชิงเส้นของส่วนผสมผลิตภัณฑ์และการจัดสรรทรัพยากร แก้ด้วยกราฟสองตัวแปรและจุดมุม ราคาเงา และปัญหาการขนส่งเบื้องต้น
difficulty: 7
minutes: 50
prerequisites: [math.algebra.linear-inequalities, math.functions.linear-graphs, management.principles.planning-decision, math.algebra.inequality-regions]
encompasses:
  - { id: math.algebra.linear-inequalities, weight: 0.3 }
  - { id: math.functions.linear-graphs, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: feasible.svg
    alt: "กราฟแกนนอนคือจำนวนตะกร้า x 0 ถึง 90 แกนตั้งคือจำนวนกระเป๋า y 0 ถึง 50 เส้นสีฟ้าแรงงาน 2x + 4y = 160 ผ่าน (0, 40) และ (80, 0) เส้นสีส้มเส้นกก 3x + 2y = 180 ผ่าน (60, 0) และ (30, 45) เส้นสีม่วงตลาด y = 35 บริเวณที่เป็นไปได้สีเขียวเป็นห้าเหลี่ยมมีจุดมุม (0, 0) (60, 0) (50, 15) (10, 35) (0, 35) เส้นประสีแดง P = 120x + 200y = 9,000 แตะบริเวณที่จุด (50, 15) ซึ่งมีวงกลมสีแดงล้อมไว้"
    caption: "เส้นกำไรคงที่เลื่อนออกไปจนแตะบริเวณที่เป็นไปได้ครั้งสุดท้ายที่จุดมุม (50, 15)"
  - type: worked-example
    title: หาจุดมุมและตรวจว่าอยู่ในบริเวณที่เป็นไปได้
    problem: "จากแบบจำลองตะกร้าและกระเป๋า เส้นตลาด $y = 35$ ตัดเส้นแรงงานและเส้นเส้นกก จงหาจุดตัดทั้งสองและบอกว่าจุดใดเป็นจุดมุมของบริเวณที่เป็นไปได้"
    steps:
      - text: "ตลาดกับแรงงาน: แทน $y = 35$ ใน $2x + 4y = 160$ ได้ $2x = 20$ จึงได้ $x = 10$ จุด (10, 35)"
      - text: "ตรวจข้อจำกัดเส้นกก: $3(10) + 2(35) = 100 \\le 180$ ผ่าน จุด (10, 35) จึงเป็นจุดมุม"
      - text: "ตลาดกับเส้นกก: แทน $y = 35$ ใน $3x + 2y = 180$ ได้ $3x = 110$ จึงได้ $x \\approx 36.7$"
      - text: "ตรวจข้อจำกัดแรงงาน: $2(36.7) + 4(35) \\approx 213 > 160$ ไม่ผ่าน จุดนี้อยู่นอกบริเวณ"
        why: "จุดตัดของสองเส้นใดก็ได้ไม่จำเป็นต้องเป็นจุดมุม ต้องตรวจกับข้อจำกัดที่เหลือทุกข้อ"
      - text: "จึงแทนค่ากำไรเฉพาะ (10, 35) ได้ $120(10) + 200(35) = 8{,}200$ บาท"
    answer: "(10, 35) เป็นจุดมุม กำไร 8,200 บาท ส่วน (36.7, 35) ใช้แรงงานเกิน จึงไม่ใช่จุดมุมและไม่ต้องนำมาเทียบ"
  - { type: check, problem: management.operations.linear-programming.p006 }
  - type: worked-example
    title: ขนส่งข้าวสารจากสองโรงสีไปสามร้านค้าส่ง
    problem: "โรงสีในขอนแก่น (A) มีข้าวสาร 70 ตัน โรงสีในนครราชสีมา (B) มี 50 ตัน ร้านค้าส่ง 1, 2, 3 ต้องการ 40, 50, 30 ตัน ต้นทุนขนส่ง (บาทต่อตัน) จาก A: 800, 600, 1,000 จาก B: 900, 1,200, 700 (สมมติ) จงหาแผนขนส่งด้วยวิธีต้นทุนต่ำสุดและตรวจว่าดีที่สุดหรือไม่"
    steps:
      - text: "อุปทานรวม $70 + 50 = 120$ เท่ากับอุปสงค์รวม $40 + 50 + 30 = 120$ เป็นปัญหาสมดุล"
      - text: "ช่องถูกสุด A→2 (600) ส่ง 50 ตัน ร้าน 2 ครบ A เหลือ 20"
      - text: "ช่องถูกถัดไป B→3 (700) ส่ง 30 ตัน ร้าน 3 ครบ B เหลือ 20"
      - text: "ถัดไป A→1 (800) ส่ง 20 ตัน A หมด แล้ว B→1 (900) ส่ง 20 ตัน ร้าน 1 ครบ"
      - text: "ต้นทุน $50(600) + 30(700) + 20(800) + 20(900) = 85{,}000$ บาท"
      - text: "ตรวจด้วยผลต่าง A − B: ร้าน 1 = −100 ร้าน 2 = −600 ร้าน 3 = +300 ให้ A ส่งร้าน 2 ก่อน (50 ตัน) แล้วร้าน 1 (20 ตัน) ได้แผนเดียวกัน จึงดีที่สุด"
        why: "เมื่อมีสองแหล่ง ทุกตันที่ A ส่งแทน B ทำให้ต้นทุนเปลี่ยนเท่ากับผลต่าง A − B ของปลายทางนั้น A จึงควรส่งไปที่ผลต่างต่ำสุดก่อน"
    answer: "A→2 50 ตัน A→1 20 ตัน B→1 20 ตัน B→3 30 ตัน ต้นทุนรวม 85,000 บาท ซึ่งต่ำสุดแล้ว"
  - type: figure
    src: p-feasible.svg
    alt: "กราฟแกน x และ y 0 ถึง 12 เส้นสีฟ้า x + y = 10 เส้นสีส้ม 2x + y = 16 เส้นสีม่วง y = 7 บริเวณที่เป็นไปได้แรเงาสีฟ้า มีจุดมุม (0, 0) (8, 0) (6, 4) (3, 7) (0, 7)"
    caption: "บริเวณที่เป็นไปได้สำหรับโจทย์ข้อ 7 และ 8"
glossary:
  - { term: กำหนดการเชิงเส้น, definition: "วิธีหาค่ามากสุดหรือน้อยสุดของฟังก์ชันเชิงเส้น ภายใต้ข้อจำกัดที่เป็นอสมการเชิงเส้น" }
  - { term: ตัวแปรตัดสินใจ, definition: "ปริมาณที่ผู้ตัดสินใจเลือกได้ เช่น จำนวนสินค้าแต่ละชนิดที่จะผลิต" }
  - { term: บริเวณที่เป็นไปได้, definition: "เซตของจุดที่สอดคล้องกับข้อจำกัดทุกข้อพร้อมกัน" }
  - { term: จุดมุม, definition: "จุดยอดของบริเวณที่เป็นไปได้ เกิดจากเส้นขอบของข้อจำกัดสองเส้นตัดกัน" }
  - { term: ข้อจำกัดที่ตึง, definition: "ข้อจำกัดที่ทรัพยากรถูกใช้หมดพอดีที่คำตอบที่ดีที่สุด" }
  - { term: ส่วนเหลือ, definition: "ปริมาณทรัพยากรที่ยังไม่ได้ใช้ที่คำตอบที่ดีที่สุด" }
  - { term: ราคาเงา, definition: "ค่าฟังก์ชันเป้าหมายที่เปลี่ยนไปเมื่อทรัพยากรเพิ่มขึ้นหนึ่งหน่วย" }
  - { term: ปัญหาการขนส่ง, definition: "LP ที่หาปริมาณส่งจากแหล่งผลิตไปยังปลายทางให้ต้นทุนรวมต่ำสุด ภายใต้อุปทานและอุปสงค์" }
flashcards:
  - { front: "ส่วนประกอบของแบบจำลอง LP", back: "ตัวแปรตัดสินใจ ฟังก์ชันเป้าหมาย ข้อจำกัด (รวมข้อจำกัดไม่ติดลบ)" }
  - { front: "ทฤษฎีบทจุดมุม", back: "ถ้ามีคำตอบที่ดีที่สุด จะมีจุดมุมของบริเวณที่เป็นไปได้ให้คำตอบนั้นเสมอ" }
  - { front: "ราคาเงา", back: "กำไรที่เพิ่มเมื่อทรัพยากรเพิ่ม 1 หน่วย ข้อจำกัดที่มีส่วนเหลือมีราคาเงาเป็น 0" }
  - { front: "วิธีต้นทุนต่ำสุด", back: "เลือกช่องถูกสุด ส่งให้มากที่สุด ตัดแถวหรือคอลัมน์ที่หมด ทำซ้ำ ได้คำตอบเริ่มต้นที่ยังต้องตรวจ" }
  - { front: "กรณีพิเศษของ LP", back: "ไม่มีบริเวณที่เป็นไปได้ · ไม่มีขอบเขต · คำตอบมีหลายจุด" }
