  - { framework: th-core-2551-health-pe, indicators: ["พ 5.1 ป.2/1"], coverage: partial, note: "สอนการเดินและข้ามถนน (มองขวา ซ้าย ขวา) หมวกนิรภัย เข็มขัดนิรภัยและคาร์ซีตตาม พ.ร.บ.จราจรทางบก ฉบับที่ 13 พ.ศ. 2565 การป้องกันการจมน้ำและหลักตะโกน โยน ยื่น ตามกรมควบคุมโรค แต่ตัวชี้วัดให้ ปฏิบัติตน ซึ่งต้องฝึกจริง (การข้ามถนน การลอยตัว) แอปตรวจไม่ได้" }
  - { framework: th-core-2551-health-pe, indicators: ["พ 5.1 ป.3/1"], coverage: partial, note: "แถวเพิ่มจากแผน (แผนผูก ป.3/1 กับ health.safety.home-school-play แต่ notes-health-3 เสนอให้ส่วน การเดินทาง อยู่ที่หัวข้อนี้) สอนการโดยสารรถสาธารณะ รถสองแถว เรือ และการวางแผนการเดินทาง ส่วนบ้านและโรงเรียนอยู่ใน home-school-play การปฏิบัติตนจริงแอปตรวจไม่ได้" }
