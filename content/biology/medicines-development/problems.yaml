problems:
  - id: biology.health.medicines-development.p001
    topics: [biology.health.medicines-development]
    difficulty: 1
    type: order
    stem: "เรียงขั้นตอนการพัฒนายาใหม่ตั้งแต่ต้นจนหลังวางจำหน่าย"
    items:
      - "ค้นพบสารต้นแบบที่จับกับเป้าหมายของโรค"
      - "ทดสอบก่อนคลินิกในเซลล์และสัตว์ทดลอง"
      - "ทดลองทางคลินิกระยะที่ 1 ในอาสาสมัครจำนวนน้อย"
      - "ทดลองทางคลินิกระยะที่ 2 ในผู้ป่วยหลายสิบถึงหลายร้อยคน"
      - "ทดลองทางคลินิกระยะที่ 3 ในผู้ป่วยหลายร้อยถึงหลายพันคน"
      - "หน่วยงานกำกับยาตรวจหลักฐานและอนุมัติ"
      - "เฝ้าระวังความปลอดภัยหลังวางจำหน่าย (ระยะที่ 4)"
    hints:
      - "ต้องทดสอบนอกร่างกายคนก่อนให้คน"
      - "จำนวนคนในการทดลองเพิ่มขึ้นทีละระยะ"
    solution: "ค้นพบสารต้นแบบ → ก่อนคลินิก → ระยะที่ 1 → ระยะที่ 2 → ระยะที่ 3 → อนุมัติ → ระยะที่ 4 เฝ้าระวังหลังวางจำหน่าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.health.medicines-development.p002
    topics: [biology.health.medicines-development]
    difficulty: 1
    type: match
    stem: "จับคู่ระยะของการทดลองทางคลินิกกับคำถามหลักของระยะนั้น"
    pairs:
      - { left: "ระยะที่ 1", right: "ยาปลอดภัยหรือไม่ ขนาดเท่าใดที่ร่างกายทนได้" }
      - { left: "ระยะที่ 2", right: "ยาได้ผลกับโรคหรือไม่ ขนาดใดเหมาะ" }
      - { left: "ระยะที่ 3", right: "ยาได้ผลจริงเมื่อเทียบกับยาหลอกหรือยามาตรฐานในคนจำนวนมาก" }
      - { left: "ระยะที่ 4", right: "มีผลข้างเคียงที่พบน้อยหรือเกิดหลังใช้นานหรือไม่" }
    hints:
      - "ระยะแรกสุดสนใจความปลอดภัยก่อน"
      - "ระยะใดเกิดหลังยาวางจำหน่ายแล้ว"
    solution: "ระยะที่ 1 ความปลอดภัยและขนาดยา ระยะที่ 2 ได้ผลหรือไม่ ระยะที่ 3 ยืนยันผลในคนจำนวนมาก ระยะที่ 4 เฝ้าระวังผลข้างเคียงหลังวางจำหน่าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.health.medicines-development.p003
    topics: [biology.health.medicines-development]
    difficulty: 1
    type: mcq
    stem: "\"ยาหลอก\" ในการทดลองทางคลินิกคืออะไร"
    choices:
      - { id: a, text: "สิ่งที่หน้าตาเหมือนยาจริงแต่ไม่มีตัวยาที่ทดสอบ ให้กลุ่มควบคุม", correct: true }
      - { id: b, text: "ยาปลอมที่ขายผิดกฎหมาย", feedback: "ยาหลอกใช้ในการวิจัยอย่างเปิดเผยตามที่ผู้เข้าร่วมยินยอม ไม่ใช่ยาปลอม" }
      - { id: c, text: "ยาจริงที่ให้ขนาดสูงกว่าปกติ", feedback: "ยาหลอกไม่มีตัวยาที่ทดสอบเลย" }
      - { id: d, text: "ยาที่ทดสอบแล้วว่าไม่ได้ผล", feedback: "ยาหลอกตั้งใจทำให้ไม่มีตัวยา เพื่อใช้เปรียบเทียบ ไม่ใช่ยาที่ทดสอบแล้วล้มเหลว" }
    hints:
      - "กลุ่มควบคุมต้องได้รับสิ่งที่ดูเหมือนกันทุกอย่าง"
      - "ทำไมต้องให้หน้าตาเหมือนยาจริง"
    solution: "ยาหลอกหน้าตาเหมือนยาจริงแต่ไม่มีตัวยาที่ทดสอบ ใช้กับกลุ่มควบคุม เพื่อแยกผลของยาจริงออกจากผลของความเชื่อว่าได้รับการรักษา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.health.medicines-development.p004
    topics: [biology.health.medicines-development]
    difficulty: 2
    type: mcq
    stem: "ทำไมการทดลองยาต้อง \"สุ่ม\" แบ่งผู้ป่วยเข้ากลุ่ม แทนที่จะให้แพทย์เลือกเอง"
    choices:
      - { id: a, text: "เพื่อให้สองกลุ่มคล้ายกันทั้งปัจจัยที่รู้และไม่รู้ ความแตกต่างของผลจึงมาจากยา", correct: true }
      - { id: b, text: "เพื่อให้ผู้ป่วยอาการหนักได้ยาใหม่ทุกคน", feedback: "ถ้าแพทย์ให้ยาใหม่เฉพาะคนอาการหนัก สองกลุ่มจะต่างกันตั้งแต่ต้น ผลที่ได้จึงเทียบกันไม่ได้" }
      - { id: c, text: "เพื่อให้การทดลองเสร็จเร็วขึ้น", feedback: "การสุ่มไม่ได้ทำให้เร็วขึ้น แต่ทำให้การเปรียบเทียบยุติธรรม" }
      - { id: d, text: "เพื่อให้ไม่ต้องมีกลุ่มควบคุม", feedback: "การสุ่มคือการแบ่งเข้ากลุ่มทดลองและกลุ่มควบคุม ยังต้องมีกลุ่มควบคุม" }
    hints:
      - "ถ้าแพทย์เลือกคนที่น่าจะหายให้ได้ยาใหม่ จะเกิดอะไรขึ้น"
      - "การสุ่มทำให้สองกลุ่มต่างกันเพียงอย่างเดียว"
    solution: "การสุ่มทำให้สองกลุ่มคล้ายกันทั้งอายุ ความรุนแรงของโรค และปัจจัยที่เราไม่รู้ ถ้าผลต่างกัน จึงสรุปได้ว่าเกิดจากยา ไม่ใช่จากการเลือกคน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.health.medicines-development.p005
    topics: [biology.health.medicines-development]
    difficulty: 2
    type: mcq
    stem: "การทดลองยาแก้ปวดแบบ \"ปกปิดสองทาง\" หมายความว่าอย่างไร และช่วยอะไร"
    choices:
      - { id: a, text: "ทั้งผู้ป่วยและผู้วัดผลไม่รู้ว่าใครได้ยาจริงหรือยาหลอก จึงไม่มีความคาดหวังมาทำให้ผลเอนเอียง", correct: true }
      - { id: b, text: "ผู้ป่วยไม่รู้ว่าเข้าร่วมการทดลอง", feedback: "ผู้เข้าร่วมต้องรู้และยินยอมก่อนเข้าร่วม สิ่งที่ปกปิดคือว่าอยู่กลุ่มใด" }
      - { id: c, text: "ทดลองซ้ำสองครั้ง", feedback: "การทำซ้ำเป็นอีกเรื่องหนึ่ง การปกปิดสองทางหมายถึงสองฝ่ายไม่รู้กลุ่ม" }
      - { id: d, text: "ปกปิดผลการทดลองไม่ให้คนทั่วไปรู้", feedback: "ผลการทดลองควรเปิดเผย การปกปิดใช้เฉพาะระหว่างทดลองเพื่อลดความเอนเอียง" }
    hints:
      - "\"สองทาง\" คือสองฝ่ายใดบ้าง"
      - "อาการปวดเป็นความรู้สึก ความคาดหวังมีผลมาก"
    solution: "ผู้ป่วยไม่รู้จึงไม่มีความคาดหวังต่างกัน ผู้วัดผลไม่รู้จึงไม่ประเมินเอนเอียง ผลที่ต่างกันจึงมาจากตัวยา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.health.medicines-development.p006
    topics: [biology.health.medicines-development]
    difficulty: 2
    type: mcq
    stem: "ข้อใด **ไม่ถูกต้อง** เกี่ยวกับความยินยอมโดยได้รับข้อมูลในการวิจัยยา"
    choices:
      - { id: a, text: "เมื่อลงชื่อยินยอมแล้ว ผู้เข้าร่วมถอนตัวไม่ได้จนกว่าการวิจัยจะจบ", correct: true }
      - { id: b, text: "ผู้เข้าร่วมต้องได้รู้วัตถุประสงค์ ประโยชน์ และความเสี่ยงก่อนตัดสินใจ", feedback: "ข้อนี้ถูก เป็นหัวใจของความยินยอมโดยได้รับข้อมูล" }
      - { id: c, text: "ต้องตัดสินใจเองโดยไม่ถูกบังคับหรือกดดัน", feedback: "ข้อนี้ถูก ความยินยอมต้องเป็นไปโดยสมัครใจ" }
      - { id: d, text: "ผู้ที่ไม่เข้าร่วมหรือถอนตัวยังได้รับการรักษาตามปกติ", feedback: "ข้อนี้ถูก การไม่เข้าร่วมต้องไม่ทำให้เสียสิทธิการรักษา" }
    hints:
      - "หาข้อที่ขัดกับหลักความสมัครใจ"
      - "ปฏิญญาเฮลซิงกิให้สิทธิผู้เข้าร่วมทำอะไรได้ทุกเมื่อ"
    solution: "ผู้เข้าร่วมถอนตัวได้ทุกเมื่อโดยไม่ต้องให้เหตุผลและไม่เสียสิทธิการรักษา ข้อที่บอกว่าถอนตัวไม่ได้จึงผิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.health.medicines-development.p007
    topics: [biology.health.medicines-development]
    difficulty: 2
    type: text
    stem: "หน่วยงานในกระทรวงสาธารณสุขของไทยที่ตรวจหลักฐานและออกทะเบียนตำรับยา ก่อนยาวางจำหน่ายได้ มีชื่อย่อว่าอะไร"
    accepted: ["อย.", "อย", "สำนักงานคณะกรรมการอาหารและยา", "Thai FDA"]
    misconceptions:
      - { match: "สปสช.", feedback: "สปสช. คือสำนักงานหลักประกันสุขภาพแห่งชาติ ดูแลสิทธิการรักษา ไม่ได้อนุมัติยา" }
      - { match: "สสส.", feedback: "สสส. คือสำนักงานกองทุนสนับสนุนการสร้างเสริมสุขภาพ ไม่ได้อนุมัติยา" }
    hints:
      - "หน่วยงานนี้ดูแลทั้งอาหารและยา"
      - "ชื่อย่อมีสองตัวอักษร"
    solution: "สำนักงานคณะกรรมการอาหารและยา (อย.) ตรวจคุณภาพ ความปลอดภัย และประสิทธิผล แล้วออกทะเบียนตำรับยา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.health.medicines-development.p008
    topics: [biology.health.medicines-development]
    difficulty: 3
    type: numeric
    stem: "กราฟแสดงผลการทดลองยาป้องกันโรคชนิดหนึ่ง (ข้อมูลสมมติ) แต่ละกลุ่มมี 20,000 คน หาประสิทธิผลของยา $= 1 - RR$ เป็นเปอร์เซ็นต์ เมื่อ $RR$ คือสัดส่วนผู้ป่วยในกลุ่มยาใหม่หารด้วยสัดส่วนผู้ป่วยในกลุ่มยาหลอก"
    figure: { src: p-results.svg, alt: "กราฟแท่งจำนวนผู้ที่ป่วยเป็นโรคระหว่างการทดลอง 1 ปี ข้อมูลสมมติ กลุ่มยาหลอก 20,000 คน ป่วย 160 คน กลุ่มยาใหม่ 20,000 คน ป่วย 40 คน" }
    answer: { value: 75, tolerance: 0.5, unit: "%" }
    misconceptions:
      - { match: 25, feedback: "25% คือ RR (40/160) ประสิทธิผลคือ 1 − RR" }
      - { match: 120, feedback: "120 คือผลต่างของจำนวนคน ไม่ใช่ประสิทธิผล ต้องเทียบเป็นสัดส่วน" }
    hints:
      - "สัดส่วนผู้ป่วยในแต่ละกลุ่ม = จำนวนผู้ป่วย ÷ 20,000"
      - "RR = สัดส่วนกลุ่มยาใหม่ ÷ สัดส่วนกลุ่มยาหลอก แล้วหา 1 − RR"
    solution: "กลุ่มยาหลอก $160/20{,}000 = 0.8\\%$ กลุ่มยาใหม่ $40/20{,}000 = 0.2\\%$ $RR = 0.2/0.8 = 0.25$ ประสิทธิผล $1 - 0.25 = 0.75$ หรือ 75%"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.health.medicines-development.p009
    topics: [biology.health.medicines-development]
    difficulty: 3
    type: numeric
    stem: "ในการทดลองยาป้องกันโรคหลอดเลือดสมอง (ข้อมูลสมมติ) ภายใน 5 ปี กลุ่มยาหลอกเป็นโรค 10% กลุ่มยาใหม่เป็นโรค 8% ต้องให้ยากี่คนจึงป้องกันการเกิดโรคได้ 1 คน (จำนวนที่ต้องรักษา NNT)"
    answer: { value: 50, tolerance: 0.5, unit: คน }
    misconceptions:
      - { match: 5, feedback: "5 มาจาก 1 ÷ 0.2 ซึ่งใช้ความเสี่ยงที่ลดลงแบบสัมพัทธ์ (20%) NNT ต้องใช้ความเสี่ยงสัมบูรณ์ที่ลดลง" }
      - { match: 12.5, feedback: "12.5 มาจาก 1 ÷ 0.08 ต้องใช้ผลต่างของความเสี่ยงสองกลุ่ม" }
    hints:
      - "ความเสี่ยงสัมบูรณ์ลดลง = 10% − 8%"
      - "NNT = 1 ÷ ความเสี่ยงสัมบูรณ์ที่ลดลง (เขียนเป็นทศนิยม)"
    solution: "ความเสี่ยงสัมบูรณ์ลดลง $0.10 - 0.08 = 0.02$ $NNT = 1/0.02 = 50$ คน ส่วนความเสี่ยงสัมพัทธ์ลดลง $0.02/0.10 = 20\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.health.medicines-development.p010
    topics: [biology.health.medicines-development]
    difficulty: 3
    type: mcq
    stem: "โรงพยาบาลแห่งหนึ่งในไทยจะทดลองยาวัณโรคสูตรใหม่ ซึ่งวัณโรคมียามาตรฐานที่รักษาหายได้อยู่แล้ว กลุ่มควบคุมควรได้รับอะไร"
    choices:
      - { id: a, text: "ยามาตรฐานที่ใช้รักษาวัณโรคอยู่ในปัจจุบัน", correct: true }
      - { id: b, text: "ยาหลอกอย่างเดียว", feedback: "เมื่อมียาที่ได้ผลอยู่แล้ว การให้ยาหลอกอย่างเดียวทำให้ผู้ป่วยไม่ได้รับการรักษาและอาจแพร่เชื้อ ผิดจริยธรรม" }
      - { id: c, text: "ไม่ต้องมีกลุ่มควบคุม เพราะรู้แล้วว่าวัณโรครักษาได้", feedback: "ต้องเทียบกับยามาตรฐานจึงรู้ว่ายาใหม่ดีกว่า เท่ากัน หรือแย่กว่า" }
      - { id: d, text: "ไม่ให้ยาอะไรเลยและไม่บอกผู้ป่วย", feedback: "ผิดหลักความยินยอมโดยได้รับข้อมูลและผิดจริยธรรมอย่างร้ายแรง" }
    hints:
      - "ปฏิญญาเฮลซิงกิกำหนดว่าผู้ป่วยต้องไม่เสียโอกาสได้รับการรักษาที่ได้ผล"
      - "คำถามจริงของการทดลองนี้คือยาใหม่ดีกว่ายาเดิมหรือไม่"
    solution: "เมื่อมียาที่ได้ผลอยู่แล้ว กลุ่มควบคุมต้องได้ยามาตรฐาน การให้ยาหลอกอย่างเดียวทำให้ผู้ป่วยเสียโอกาสหายจากโรค จึงผิดจริยธรรม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.health.medicines-development.p011
    topics: [biology.health.medicines-development]
    difficulty: 3
    type: mcq
    stem: "เหตุการณ์ทาลิโดไมด์ช่วงปลายทศวรรษ 1950 ถึงต้นทศวรรษ 1960 สอนอะไรเกี่ยวกับการพัฒนายา"
    choices:
      - { id: a, text: "ต้องทดสอบความปลอดภัยในกลุ่มที่จะใช้ยาจริง เช่น หญิงตั้งครรภ์ และต้องมีกฎหมายและการเฝ้าระวังที่เข้มงวด", correct: true }
