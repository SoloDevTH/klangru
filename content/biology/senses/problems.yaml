    type: mcq
    stem: "ยายได้กลิ่นดอกมะลิในงานวันแม่แล้วนึกถึงบ้านเกิดในวัยเด็กทันที ข้อใดอธิบายเหตุการณ์ได้ครบที่สุด"
    choices:
      - { id: a, text: "เซลล์รับกลิ่นส่งกระแสประสาทไปสมอง สมองแปลเป็นกลิ่นมะลิแล้วเชื่อมกับความจำเดิมที่เคยเก็บไว้คู่กับกลิ่นนี้", correct: true }
      - { id: b, text: "จมูกเก็บความจำของกลิ่นไว้แล้วส่งภาพบ้านเกิดไปสมอง", feedback: "จมูกมีตัวรับเท่านั้น ความจำเก็บและเรียกใช้ในสมอง" }
      - { id: c, text: "กลิ่นมะลิเดินทางไปตามเลือดถึงสมองโดยตรง", feedback: "โมเลกุลกลิ่นจับกับตัวรับในจมูก ข้อมูลไปสมองเป็นกระแสประสาท" }
