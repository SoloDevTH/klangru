id: management.operations.capacity-scheduling
subject: management
title: { th: การวางแผนกำลังการผลิตและการจัดตารางงาน, en: Capacity planning and scheduling }
summary: กำลังการผลิตที่ออกแบบและที่ได้ผล อัตราการใช้และประสิทธิภาพ แผนการผลิตรวมแบบคงที่และตามความต้องการ กฎ FCFS SPT EDD แผนภูมิแกนต์ และกฎของจอห์นสัน
difficulty: 6
minutes: 45
prerequisites: [management.operations.lean, business.stats.forecasting]
encompasses:
  - { id: management.operations.lean, weight: 0.2 }
  - { id: business.stats.forecasting, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - { type: check, problem: management.operations.capacity-scheduling.p004, prompt: "ประสิทธิภาพเทียบกับกำลังการผลิตที่ได้ผล ไม่ใช่ที่ออกแบบ" }
  - type: worked-example
    title: เทียบต้นทุนแผนผลิตคงที่กับแผนผลิตตามความต้องการ
    problem: "โรงงานน้ำพริก (สมมติ) พยากรณ์ความต้องการสี่ไตรมาสเป็น 1,100, 1,200, 1,500 และ 1,600 ลัง ไม่มีคงคลังต้นปีและไม่ต้องการคงคลังปลายปี ต้นทุนเก็บสินค้า 20 บาทต่อลังต่อไตรมาส (คิดจากคงคลังปลายไตรมาส) ไตรมาสก่อนหน้าผลิต 1,350 ลัง การเพิ่มอัตราผลิตมีต้นทุน 50 บาทต่อลัง การลดมีต้นทุน 30 บาทต่อลัง แผนใดถูกกว่า"
    steps:
      - text: "แผนคงที่: ผลิต $(1{,}100 + 1{,}200 + 1{,}500 + 1{,}600) \\div 4 = 1{,}350$ ลังทุกไตรมาส"
      - text: "คงคลังปลายไตรมาส: $1{,}350 - 1{,}100 = 250$, $250 + 1{,}350 - 1{,}200 = 400$, $400 + 1{,}350 - 1{,}500 = 250$, $250 + 1{,}350 - 1{,}600 = 0$"
        why: "ต้องตรวจว่าไม่มีไตรมาสใดติดลบ ถ้าติดลบแปลว่าขาดของส่งลูกค้า"
      - text: "ต้นทุนแผนคงที่ $(250 + 400 + 250 + 0) \\times 20 = 18{,}000$ บาท"
      - text: "แผนตามความต้องการ: ลด 250 ลัง ($7{,}500$) เพิ่ม 100 ($5{,}000$) เพิ่ม 300 ($15{,}000$) เพิ่ม 100 ($5{,}000$) รวม $32{,}500$ บาท"
        why: "ไตรมาสแรกเทียบกับอัตรา 1,350 ของไตรมาสก่อนหน้า"
      - text: "แผนคงที่ถูกกว่า $32{,}500 - 18{,}000 = 14{,}500$ บาท และกำลังคนคงที่ไม่ต้องจ้างและเลิกจ้างบ่อย"
    answer: "แผนผลิตคงที่ 1,350 ลังต่อไตรมาส ต้นทุน 18,000 บาท ถูกกว่าแผนตามความต้องการ (32,500 บาท) ถ้าน้ำพริกเก็บได้นานพอ"
  - type: figure
    src: aggregate.svg
    alt: "แผนภูมิแท่งสี่ไตรมาส แท่งสีฟ้าคือความต้องการ 1,100 1,200 1,500 1,600 แท่งสีส้มคือสินค้าคงคลังปลายไตรมาส 250 400 250 0 เส้นประสีแดงแนวนอนที่ 1,350 คืออัตราผลิตคงที่ ไตรมาส 1–2 ผลิตเกินความต้องการจึงสะสมคงคลัง ไตรมาส 3–4 ความต้องการสูงกว่าอัตราผลิตจึงใช้คงคลังที่สะสมไว้"
    caption: "แผนผลิตคงที่สะสมคงคลังในช่วงความต้องการต่ำไว้ใช้ช่วงความต้องการสูง"
  - type: worked-example
    title: จัดลำดับงานเฟอร์นิเจอร์ OTOP ด้วยกฎของจอห์นสัน
    problem: "กลุ่มทำเฟอร์นิเจอร์ไม้ (สมมติ) มีงานห้างานต้องผ่านเครื่องตัดแล้วเครื่องพ่นสี เวลา (ชั่วโมง) เครื่องตัด/เครื่องพ่นสี: A 5/2, B 1/6, C 9/7, D 3/8, E 10/4 จงหาลำดับที่ทำให้ห้างานเสร็จเร็วที่สุด"
    steps:
      - text: "เวลาน้อยสุดคือ 1 (B ที่เครื่องตัด) วาง B ไว้หน้าสุด: B _ _ _ _"
      - text: "ที่เหลือ เวลาน้อยสุดคือ 2 (A ที่เครื่องพ่นสี) วาง A ไว้ท้ายสุด: B _ _ _ A"
        why: "งานที่เครื่องที่ 2 ใช้เวลาสั้นควรอยู่ท้าย เพื่อให้งานสุดท้ายเสร็จเร็วหลังเครื่องที่ 1 ว่าง"
      - text: "ที่เหลือ C D E เวลาน้อยสุดคือ 3 (D ที่เครื่องตัด) วางหน้า: B D _ _ A"
      - text: "ที่เหลือ C E เวลาน้อยสุดคือ 4 (E ที่เครื่องพ่นสี) วางท้ายที่ว่าง: B D _ E A แล้ว C อยู่ช่องที่เหลือ"
      - text: "ลำดับ B–D–C–E–A วาดแผนภูมิแกนต์ (ดูภาพ) งานสุดท้ายเสร็จที่ 30 ชั่วโมง เครื่องพ่นสีว่างรวม 3 ชั่วโมง ถ้าทำตามลำดับ A–B–C–D–E จะเสร็จที่ 34 ชั่วโมง"
    answer: "ลำดับ B–D–C–E–A เสร็จทั้งหมดใน 30 ชั่วโมง เร็วกว่าลำดับตามตัวอักษร 4 ชั่วโมง"
  - type: figure
    src: johnson-gantt.svg
    alt: "แผนภูมิแกนต์สองแถว แกนเวลา 0–30 ชั่วโมง เครื่องตัด: B 0–1, D 1–4, C 4–13, E 13–23, A 23–28 เครื่องพ่นสี: B 1–7, D 7–15, C 15–22, ว่าง 22–23, E 23–27, ว่าง 27–28, A 28–30 เครื่องพ่นสียังว่างช่วง 0–1 ก่อนงานแรกมาถึง"
    caption: "แผนภูมิแกนต์ของลำดับตามกฎของจอห์นสัน งานสุดท้ายเสร็จที่ 30 ชั่วโมง"
  - { type: check, problem: management.operations.capacity-scheduling.p012 }
glossary:
  - { term: กำลังการผลิตที่ออกแบบ, definition: "ผลผลิตสูงสุดตามทฤษฎีเมื่อทุกอย่างทำงานเต็มที่ไม่หยุด" }
  - { term: กำลังการผลิตที่ได้ผล, definition: "ผลผลิตสูงสุดที่ทำได้จริงหลังหักการหยุดตามแผน เช่น เปลี่ยนรุ่น บำรุงรักษา และพัก" }
  - { term: อัตราการใช้, definition: "ผลผลิตจริงหารด้วยกำลังการผลิตที่ออกแบบ" }
  - { term: ประสิทธิภาพ, definition: "ผลผลิตจริงหารด้วยกำลังการผลิตที่ได้ผล" }
  - { term: แผนการผลิตรวม, definition: "แผนระยะกลางในหน่วยรวมที่กำหนดอัตราผลิต กำลังคน และสินค้าคงคลังให้ตรงกับความต้องการที่พยากรณ์ไว้" }
  - { term: เวลาในระบบ, definition: "เวลาตั้งแต่เริ่มจัดตารางจนงานนั้นเสร็จ" }
  - { term: makespan, definition: "เวลาที่งานสุดท้ายในชุดงานเสร็จ" }
  - { term: กฎของจอห์นสัน, definition: "วิธีจัดลำดับงานที่ผ่านสองเครื่องตามลำดับเดียวกัน ให้ makespan สั้นที่สุด" }
flashcards:
  - { front: "อัตราการใช้กับประสิทธิภาพ", back: "อัตราการใช้ = ผลผลิตจริง ÷ กำลังที่ออกแบบ · ประสิทธิภาพ = ผลผลิตจริง ÷ กำลังที่ได้ผล" }
  - { front: "SPT กับ EDD", back: "SPT ทำให้เวลาเฉลี่ยในระบบต่ำสุด · EDD ทำให้ความล่าช้าสูงสุดต่ำสุด" }
  - { front: "กฎของจอห์นสัน", back: "หาเวลาน้อยสุด ถ้าอยู่เครื่อง 1 วางหน้าสุด ถ้าอยู่เครื่อง 2 วางท้ายสุด ตัดออกแล้วทำซ้ำ" }
  - { front: "ผลิตคงที่กับผลิตตามความต้องการ", back: "คงที่: กำลังคนคงที่ มีต้นทุนเก็บสินค้า · ตามความต้องการ: ไม่มีคงคลัง มีต้นทุนปรับกำลังการผลิต" }
  - { front: "จำนวนงานเฉลี่ยในระบบ", back: "ผลรวมเวลาในระบบของทุกงาน ÷ เวลาเสร็จของงานสุดท้าย" }
