      - { id: b, text: "สรุปได้ว่าปุ๋ยได้ผล เพราะกระถางที่ใส่ปุ๋ยโตกว่ามาก", feedback: "มีตัวแปรสองตัวที่ต่างกันพร้อมกัน (ปุ๋ยและแสง) จึงบอกไม่ได้ว่าอะไรทำให้โตกว่า" }
      - { id: c, text: "การทดลองถูกต้อง เพราะมีทั้งชุดควบคุมและชุดทดลอง", feedback: "การมีชุดควบคุมยังไม่พอ ตัวแปรอื่นทุกตัวต้องเท่ากันด้วย" }
      - { id: d, text: "ควรเพิ่มปุ๋ยให้มากขึ้นแล้วทดลองซ้ำที่เดิม", feedback: "ปัญหาอยู่ที่ตัวแปรควบคุมไม่เท่ากัน การเพิ่มปุ๋ยไม่ได้แก้ปัญหานั้น" }
    hints:
