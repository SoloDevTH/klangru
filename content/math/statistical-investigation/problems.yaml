      - { id: a, text: "จากนักเรียน ม.1 ที่สุ่มถาม 40 คน ครึ่งหนึ่งนอนไม่ถึง 7 ชั่วโมงในวันเรียน และแต่ละคนนอนต่างกันได้ถึง 5 ชั่วโมง ผลนี้ใช้ได้กับ ม.1 โรงเรียนเรา แต่อาจไม่ตรงกับช่วงปิดเทอม", correct: true }
      - { id: b, text: "มัธยฐาน = 7 พิสัย = 5", feedback: "มีแต่ตัวเลข ไม่ได้บอกว่าหมายถึงอะไร ไม่ได้ตอบคำถามในบริบท" }
      - { id: c, text: "นักเรียนไทยนอนน้อยเกินไป", feedback: "สรุปเกินกลุ่มที่สำรวจ และไม่มีตัวเลขสนับสนุน" }
      - { id: d, text: "นักเรียน ม.1 ทุกคนนอน 7 ชั่วโมง", feedback: "มัธยฐานคือค่ากลาง ไม่ใช่ค่าของทุกคน พิสัย 5 ชั่วโมงบอกว่าแต่ละคนนอนต่างกันมาก" }
    hints:
      - "รายงานที่ดีตอบคำถามเดิม ใช้ตัวเลขพร้อมความหมาย"
      - "บอกด้วยว่าผลใช้ได้กับกลุ่มใด และมีข้อจำกัดอะไร"
    solution: "ข้อแรกตอบคำถามเดิม แปลมัธยฐานและพิสัยเป็นความหมายในบริบท บอกขนาดกลุ่มตัวอย่าง และบอกข้อจำกัดของการสรุป ข้ออื่นขาดบริบท สรุปเกินข้อมูล หรือแปลค่าสถิติผิด"
