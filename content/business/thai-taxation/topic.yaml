lessons:
- type: explanation
  file: lesson.md
- type: worked-example
  title: ภาษีเงินเดือนของพนักงานใหม่
  problem: มิ้นท์ได้เงินเดือน $35{,}000$ บาทต่อเดือน ไม่มีเงินได้อื่น โสด จ่ายประกันสังคมทั้งปี $9{,}000$ บาท (สมมติ) นายจ้างหักภาษีไว้ทั้งปี $5{,}500$ บาท หาภาษีที่ต้องเสียและเงินที่ได้คืน
  steps:
  - text: เงินได้พึงประเมิน $= 35{,}000 \times 12 = 420{,}000$ บาท
  - text: ค่าใช้จ่าย $50\%$ $= 210{,}000$ เกินเพดาน หักได้ $100{,}000$ บาท
    why: เงินเดือนหักค่าใช้จ่ายได้ร้อยละ 50 แต่ไม่เกิน 100,000 บาท
  - text: เงินได้สุทธิ $= 420{,}000 - 100{,}000 - 60{,}000 - 9{,}000 = 251{,}000$ บาท
  - text: ภาษี $= (251{,}000 - 150{,}000) \times 5\% = 5{,}050$ บาท
    why: 150,000 บาทแรกยกเว้น ส่วนที่เหลืออยู่ในขั้น 5% ทั้งหมด
  - text: ถูกหักไว้แล้ว $5{,}500$ บาท มากกว่าภาษีจริง ขอคืนได้ $450$ บาท
  answer: ภาษี $5{,}050$ บาท ขอคืน $450$ บาท
- type: check
  problem: business.law.thai-taxation.p004
  prompt: 150,000 บาทแรกเสียภาษีไหม
- type: figure
  src: vat-chain.svg
  alt: แผนภาพห่วงโซ่ภาษีมูลค่าเพิ่มสามทอด (สมมติ) ผู้ผลิตขายให้ร้านค้าส่ง 100,000 บาท ภาษีขาย 7,000 นำส่ง 7,000 ร้านค้าส่งขายให้ร้านค้าปลีก 150,000 บาท ภาษีขาย 10,500 หักภาษีซื้อ 7,000 นำส่ง 3,500 ร้านค้าปลีกขายให้ผู้บริโภค 200,000 บาท ภาษีขาย 14,000 หักภาษีซื้อ 10,500 นำส่ง 3,500 รวมภาษีที่รัฐได้ 14,000 บาท เท่ากับที่ผู้บริโภคจ่าย และเท่ากับ 7% ของราคาขายสุดท้าย
  caption: ภาษีมูลค่าเพิ่มเก็บทีละทอดตามมูลค่าที่เพิ่ม รวมแล้วเท่ากับ 7% ของราคาที่ผู้บริโภคจ่าย (ราคาก่อนภาษี สมมติ)
- type: worked-example
  title: 'ภาษีของบริษัทเล็ก: ภาษีมูลค่าเพิ่ม หัก ณ ที่จ่าย และนิติบุคคล'
  problem: บริษัท SME สมมติ เดือนหนึ่งขาย $400{,}000$ บาท ซื้อ $250{,}000$ บาท (ก่อนภาษีมูลค่าเพิ่ม) จ้างบริษัทออกแบบ $30{,}000$ บาท (ก่อนภาษีมูลค่าเพิ่ม) และทั้งปีมีกำไรสุทธิทางภาษี $900{,}000$ บาท
  steps:
  - text: ภาษีขาย $= 400{,}000 \times 7\% = 28{,}000$ ภาษีซื้อ $= (250{,}000 + 30{,}000) \times 7\% = 19{,}600$ บาท
    why: ค่าออกแบบที่มีใบกำกับภาษีก็เป็นภาษีซื้อ
  - text: นำส่งภาษีมูลค่าเพิ่ม $= 28{,}000 - 19{,}600 = 8{,}400$ บาท
  - text: หัก ณ ที่จ่ายค่าออกแบบ $= 30{,}000 \times 3\% = 900$ บาท โอนให้ $30{,}000 + 2{,}100 - 900 = 31{,}200$ บาท
    why: หัก ณ ที่จ่ายคิดจากค่าบริการก่อนภาษีมูลค่าเพิ่ม
  - text: ภาษีเงินได้นิติบุคคล $= (900{,}000 - 300{,}000) \times 15\% = 90{,}000$ บาท
  answer: VAT $8{,}400$ บาท · หัก ณ ที่จ่าย $900$ บาท · ภาษีนิติบุคคล $90{,}000$ บาท
- type: check
  problem: business.law.thai-taxation.p007
  prompt: ภาษีขายหักภาษีซื้อ
glossary:
- term: เงินได้พึงประเมิน
  definition: เงินได้ที่ต้องนำมาคำนวณภาษีเงินได้บุคคลธรรมดา แบ่งเป็น 8 ประเภท
- term: ค่าใช้จ่าย (ทางภาษี)
  definition: จำนวนที่หักจากเงินได้พึงประเมินตามประเภทเงินได้ เช่น เงินเดือนหัก 50% ไม่เกิน 100,000 บาท
- term: ค่าลดหย่อน
  definition: จำนวนที่หักต่อหลังหักค่าใช้จ่าย เช่น ส่วนตัว ประกันสังคม ประกันชีวิต
- term: เงินได้สุทธิ
  definition: เงินได้พึงประเมินหักค่าใช้จ่ายและค่าลดหย่อน ใช้คูณอัตราภาษี
- term: ภาษีหัก ณ ที่จ่าย
  definition: ภาษีที่ผู้จ่ายเงินหักไว้ก่อนแล้วนำส่งรัฐ ผู้รับเงินนำไปเครดิตภายหลัง
- term: กำไรสุทธิทางภาษี
  definition: กำไรที่ใช้คิดภาษีนิติบุคคล หลังปรับรายการที่หักทางภาษีไม่ได้
- term: ภาษีขาย ภาษีซื้อ
  definition: ภาษีมูลค่าเพิ่มที่เก็บจากลูกค้า และที่จ่ายเมื่อซื้อสินค้าหรือบริการ
- term: ราคา CIF
  definition: ราคาสินค้ารวมค่าประกันภัยและค่าขนส่งถึงประเทศผู้นำเข้า
flashcards:
- front: 'เงินเดือน: ค่าใช้จ่าย'
  back: $50\%$ ไม่เกิน $100{,}000$ บาท
- front: ขั้นภาษีบุคคลธรรมดา
  back: $150{,}000$ แรกยกเว้น แล้ว 5 · 10 · 15 · 20 · 25 · 30 · 35%
- front: ภาษีมูลค่าเพิ่มที่ต้องชำระ
  back: ภาษีขาย − ภาษีซื้อ · ส่งออก 0%
- front: SME นิติบุคคล
  back: 300,000 แรกยกเว้น · ถึง 3 ล้าน 15% · เกิน 20%
- front: หัก ณ ที่จ่ายค่าบริการ
  back: $3\%$ ของค่าบริการก่อนภาษีมูลค่าเพิ่ม
