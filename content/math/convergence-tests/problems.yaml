- id: math.calculus.convergence-tests.p015
  topics:
  - math.calculus.convergence-tests
  difficulty: 4
  type: numeric
  stem: 'จงหาผลบวกย่อย $S_4$ ของอนุกรม $\displaystyle\sum_{n=1}^{\infty}\frac{(-1)^{n+1}}{2n-1}$ (ตอบทศนิยม 4 ตำแหน่ง)'
  answer:
    value: 0.7238
    tolerance: 0.0001
  hints:
  - ตัวส่วนของพจน์ที่ $n$ คือ $2n-1$ จึงเป็นเลขคี่ 1, 3, 5, 7
  - เขียนพจน์สี่พจน์แรกพร้อมเครื่องหมายแล้วรวม
  misconceptions:
  - match: 0.8667
    feedback: รวมเพียงสามพจน์แรกแล้วหยุด ซึ่งได้ $S_3$ ไม่ใช่ $S_4$
  - match: 1.6762
    feedback: ลืมสลับเครื่องหมาย รวมทุกพจน์เป็นบวก
  solution: $S_4 = 1 - \frac{1}{3} + \frac{1}{5} - \frac{1}{7} = \frac{76}{105} \approx 0.7238$
