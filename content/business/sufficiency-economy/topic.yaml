id: business.econ.sufficiency-economy
subject: business
title: { th: "ปรัชญาของเศรษฐกิจพอเพียงกับการดำเนินชีวิตและธุรกิจ", en: "The Sufficiency Economy Philosophy in daily life and business" }
summary: "ความเป็นมาและหลักสามห่วงสองเงื่อนไข การใช้ในครอบครัว โรงเรียน ชุมชน และธุรกิจ ทฤษฎีใหม่ และการวิเคราะห์ปัญหาเศรษฐกิจชุมชนพร้อมเสนอทางแก้"
difficulty: 3
minutes: 35
prerequisites: [business.econ.production-factors]
encompasses:
  - { id: business.econ.production-factors, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: three-rings.svg
    alt: "แผนภาพวงกลมสามวงซ้อนกัน วงบนคือความพอประมาณ วงซ้ายล่างคือความมีเหตุผล วงขวาล่างคือการมีภูมิคุ้มกันที่ดีในตัว ตรงกลางที่สามวงซ้อนกันเขียนว่าทางสายกลาง ใต้วงกลมมีสองกล่องเป็นฐาน คือเงื่อนไขความรู้ (รอบรู้ รอบคอบ ระมัดระวัง) และเงื่อนไขคุณธรรม (ซื่อสัตย์ อดทน เพียร แบ่งปัน) ด้านบนเขียนผลลัพธ์ว่าสมดุล มั่นคง ยั่งยืน ทั้งเศรษฐกิจ สังคม สิ่งแวดล้อม และวัฒนธรรม"
    caption: "สามห่วงตั้งอยู่บนสองเงื่อนไข นำไปสู่ความสมดุล มั่นคง ยั่งยืน"
  - { type: check, problem: business.econ.sufficiency-economy.p003, prompt: "ตัวอย่างใดคือภูมิคุ้มกัน" }
  - type: worked-example
    title: "ซื้อรถกระบะคันใหม่ดีไหม"
    problem: "ครอบครัวลุงสม (สมมติ) มีรายได้เดือนละ $30{,}000$ บาท รายจ่ายจำเป็น $18{,}000$ บาท ผ่อนหนี้เดิม $4{,}000$ บาท อยากซื้อรถกระบะใหม่ค่างวด $9{,}500$ บาท หรือรถมือสองค่างวด $5{,}000$ บาท ใช้หลักสามห่วงสองเงื่อนไขช่วยตัดสินใจ"
    steps:
      - { text: "ความมีเหตุผล: หาเงินเหลือแต่ละทาง รถใหม่ $30{,}000 - 18{,}000 - 4{,}000 - 9{,}500 = -1{,}500$ บาท รถมือสอง $30{,}000 - 18{,}000 - 4{,}000 - 5{,}000 = 3{,}000$ บาท", why: "ตัดสินใจจากตัวเลขจริง ไม่ใช่จากความอยากได้" }
      - { text: "ความพอประมาณ: รถใหม่ทำให้ติดลบทุกเดือน เกินกำลัง รถมือสองยังมีเงินเหลือ" }
      - { text: "ภูมิคุ้มกัน: เงินเหลือ $3{,}000$ บาทต่อเดือนใช้สะสมเป็นเงินสำรองยามฉุกเฉินและค่าซ่อมรถได้", why: "รถมือสองอาจซ่อมบ่อยกว่า จึงต้องมีเงินสำรอง" }
      - { text: "ความรู้: ให้ช่างที่ไว้ใจตรวจสภาพรถ และอ่านสัญญาเช่าซื้อทุกข้อ · คุณธรรม: ผ่อนตรงเวลาตามสัญญา" }
    answer: "เลือกรถมือสองที่ผ่อนไหวและยังเหลือเงินออม"
  - { type: figure, src: new-theory.svg, alt: "แผนภาพที่ดินรูปสี่เหลี่ยมแบ่งเป็นสี่ส่วนตามสัดส่วนจริง สระน้ำ 30% นาข้าว 30% พืชไร่พืชสวน 30% และบ้านกับที่เลี้ยงสัตว์ 10% ใต้ภาพเขียนว่าน้ำในสระใช้ทำนาและปลูกพืชได้ตลอดปี พื้นที่จริงปรับตามดินและปริมาณฝน", caption: "ทฤษฎีใหม่แบ่งที่ดินประมาณ 30:30:30:10" }
  - { type: check, problem: business.econ.sufficiency-economy.p008, prompt: "การกระทำของร้านขนมตรงกับหลักใด" }
glossary:
  - { term: "ปรัชญาของเศรษฐกิจพอเพียง", definition: "แนวทางการดำเนินชีวิตและการพัฒนาตามทางสายกลาง ประกอบด้วยความพอประมาณ ความมีเหตุผล และภูมิคุ้มกัน บนเงื่อนไขความรู้และคุณธรรม" }
  - { term: "ความพอประมาณ", definition: "ความพอดีที่ไม่มากและไม่น้อยเกินไป ไม่เบียดเบียนตนเองและผู้อื่น" }
  - { term: "ความมีเหตุผล", definition: "การตัดสินใจโดยพิจารณาเหตุปัจจัยและผลที่คาดว่าจะเกิดอย่างรอบคอบ" }
  - { term: "การมีภูมิคุ้มกันที่ดีในตัว", definition: "การเตรียมพร้อมรับผลกระทบจากความเปลี่ยนแปลงทั้งในระยะใกล้และไกล" }
  - { term: "ทฤษฎีใหม่", definition: "แนวพระราชดำริการจัดการที่ดินและน้ำของเกษตรกรรายย่อย แบ่งพื้นที่ประมาณ 30:30:30:10 (สระน้ำ นาข้าว พืชไร่พืชสวน ที่อยู่อาศัย)" }
  - { term: "เกษตรเชิงเดี่ยว", definition: "การปลูกพืชชนิดเดียวในพื้นที่ทั้งหมด เสี่ยงเมื่อราคาหรือผลผลิตของพืชนั้นตก" }
flashcards:
  - { front: "สามห่วงสองเงื่อนไข", back: "ห่วง: พอประมาณ · มีเหตุผล · มีภูมิคุ้มกัน — เงื่อนไข: ความรู้ · คุณธรรม" }
  - { front: "ผลลัพธ์ที่มุ่งหวังของปรัชญาของเศรษฐกิจพอเพียง", back: "สมดุล มั่นคง ยั่งยืน ทั้งด้านเศรษฐกิจ สังคม สิ่งแวดล้อม และวัฒนธรรม" }
  - { front: "ทฤษฎีใหม่แบ่งที่ดินอย่างไร", back: "สระน้ำ 30% · นาข้าว 30% · พืชไร่พืชสวน 30% · ที่อยู่อาศัยและเลี้ยงสัตว์ 10% (ปรับตามพื้นที่)" }
  - { front: "เก็บเงินสำรองยามฉุกเฉินคือหลักใด", back: "การมีภูมิคุ้มกันที่ดีในตัว" }
  - { front: "เศรษฐกิจพอเพียงห้ามกู้เงินหรือไม่", back: "ไม่ห้าม กู้ได้อย่างมีเหตุผลและผ่อนไหว ไม่เกินกำลัง" }
