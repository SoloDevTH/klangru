    solution: "วงนอกเดินที่ i ทุกค่า วงในเริ่มที่ i + 1 ทำให้ตรวจแต่ละคู่เพียงครั้ง เมื่อ nums[i] + nums[j] เท่ากับ target จึงเพิ่มตัวนับ ตัวอย่าง [1, 2, 3] กับ 4 มีคู่ (1, 3) คือ 1 + 3 = 4 เท่านั้น"
