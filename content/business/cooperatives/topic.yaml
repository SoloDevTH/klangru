- type: figure
  src: coop-structure.svg
  alt: แผนภาพโครงสร้างสหกรณ์ แถวบนมีสามกล่อง สมาชิก (ถือหุ้นและใช้บริการ 1 คน 1 เสียง) ลูกศรไปที่ประชุมใหญ่ (กำหนดนโยบาย ข้อบังคับ เลือกกรรมการ) ลูกศรไปคณะกรรมการดำเนินการ (บริหารตามมติ จ้างผู้จัดการ) คณะกรรมการมีลูกศรลงไปกล่องธุรกิจของสหกรณ์ผ่านผู้จัดการและเจ้าหน้าที่ ธุรกิจมีทั้งซื้อปัจจัยการผลิต รวบรวมผลผลิตไปขาย ร้านค้า รับฝากเงิน และให้กู้ สมาชิกมีลูกศรเส้นประไปที่ธุรกิจว่าทำธุรกิจกับสหกรณ์ ธุรกิจมีลูกศรลงไปกล่องกำไรสุทธิประจำปี ซึ่งแบ่งออกเป็นสามกล่อง ทุนสำรองที่แบ่งให้สมาชิกไม่ได้ เงินปันผลตามหุ้นในอัตราจำกัด และเงินเฉลี่ยคืนตามส่วนธุรกิจ ข้อความเสริมว่ามีทุนสวัสดิการ ทุนสาธารณประโยชน์ และโบนัสกรรมการตามข้อบังคับด้วย
  caption: สมาชิกเป็นทั้งเจ้าของ ผู้ควบคุม และผู้ใช้บริการ กำไรจึงกลับคืนสู่สมาชิก
- type: check
  problem: business.econ.cooperatives.p001
  prompt: สหกรณ์ต่างจากบริษัทตรงไหน
- type: worked-example
  title: ปันผลและเฉลี่ยคืนของสมาชิกสหกรณ์ร้านค้า
  problem: พี่ฟ้าถือหุ้นสหกรณ์ร้านค้า $300$ หุ้น หุ้นละ $10$ บาท ซื้อของจากสหกรณ์ทั้งปี $12{,}000$ บาท ที่ประชุมใหญ่อนุมัติปันผล $4\%$ ของค่าหุ้น และเฉลี่ยคืน $3\%$ ของยอดซื้อ (สมมติ) พี่ฟ้าได้เงินรวมเท่าไร
  steps:
  - text: ค่าหุ้น $= 300 \times 10 = 3{,}000$ บาท
    why: ปันผลคิดจากเงินค่าหุ้น ไม่ใช่จำนวนหุ้น
  - text: เงินปันผล $= 3{,}000 \times 0.04 = 120$ บาท
  - text: เงินเฉลี่ยคืน $= 12{,}000 \times 0.03 = 360$ บาท
    why: สมาชิกที่ใช้บริการมากได้คืนมาก ตามหลักการมีส่วนร่วมทางเศรษฐกิจ
  - text: รวม $= 120 + 360 = 480$ บาท
  answer: ปันผล $120$ บาท เฉลี่ยคืน $360$ บาท รวม $480$ บาท
- type: worked-example
  title: จัดสรรกำไรสุทธิของสหกรณ์การเกษตร
  problem: สหกรณ์การเกษตร (สมมติ) มีกำไรสุทธิ $600{,}000$ บาท ค่าหุ้นรวม $2{,}000{,}000$ บาท ข้อบังคับให้กันทุนสำรอง $10\%$ ของกำไรสุทธิ ปันผล $5\%$ ของค่าหุ้น ทุนสวัสดิการและทุนสาธารณประโยชน์รวม $10\%$ ของกำไรสุทธิ ที่เหลือเป็นเงินเฉลี่ยคืน ถ้ายอดขายผลผลิตผ่านสหกรณ์ของสมาชิกรวม $40{,}000{,}000$ บาท อัตราเฉลี่ยคืนเป็นเท่าไร
  steps:
  - text: ทุนสำรอง $= 600{,}000 \times 0.10 = 60{,}000$ บาท
    why: กฎหมายสหกรณ์กำหนดให้กันทุนสำรองไม่น้อยกว่าร้อยละ 10 ของกำไรสุทธิ
  - text: ปันผล $= 2{,}000{,}000 \times 0.05 = 100{,}000$ บาท
  - text: ทุนสวัสดิการและสาธารณประโยชน์ $= 600{,}000 \times 0.10 = 60{,}000$ บาท
  - text: เงินเฉลี่ยคืน $= 600{,}000 - 60{,}000 - 100{,}000 - 60{,}000 = 380{,}000$ บาท
  - text: อัตราเฉลี่ยคืน $= \dfrac{380{,}000}{40{,}000{,}000} = 0.0095$ คือ $0.95\%$ หรือ $95$ สตางค์ต่อยอดขาย $100$ บาท
    why: สมาชิกที่ขายผลผลิตผ่านสหกรณ์มากจะได้คืนมาก
  answer: เงินเฉลี่ยคืน $380{,}000$ บาท อัตรา $0.95\%$ ของยอดขาย
- type: check
  problem: business.econ.cooperatives.p008
  prompt: เงินเฉลี่ยคืนแบ่งตามอะไร
glossary:
- term: สหกรณ์
  definition: องค์การที่บุคคลรวมกันโดยสมัครใจ ดำเนินธุรกิจที่เป็นเจ้าของร่วมกันและควบคุมแบบประชาธิปไตย เพื่อประโยชน์ทางเศรษฐกิจและสังคมของสมาชิก
- term: ที่ประชุมใหญ่
  definition: การประชุมของสมาชิกทั้งหมด (หรือผู้แทน) เป็นอำนาจสูงสุดของสหกรณ์ อนุมัติงบการเงิน การจัดสรรกำไร และเลือกคณะกรรมการ
- term: คณะกรรมการดำเนินการ
  definition: สมาชิกที่ที่ประชุมใหญ่เลือกให้บริหารสหกรณ์ตามกฎหมาย ข้อบังคับ และมติที่ประชุม
- term: ทุนสำรอง
  definition: กำไรส่วนที่กันไว้เพื่อความมั่นคงของสหกรณ์ แบ่งคืนให้สมาชิกไม่ได้
- term: เงินปันผลตามหุ้น
  definition: ผลตอบแทนที่จ่ายตามค่าหุ้นของสมาชิก ในอัตราที่กฎหมายและข้อบังคับจำกัดไว้
- term: เงินเฉลี่ยคืน
  definition: เงินที่คืนให้สมาชิกตามปริมาณธุรกิจที่ทำกับสหกรณ์ เช่น ยอดซื้อ ยอดขาย หรือดอกเบี้ยเงินกู้ที่จ่าย
- term: วิสาหกิจชุมชน
  definition: กิจการของคนในชุมชนที่รวมกันผลิตสินค้าหรือบริการ จดทะเบียนตามกฎหมายส่งเสริมวิสาหกิจชุมชน
- term: กรมส่งเสริมสหกรณ์
  definition: หน่วยงานของรัฐที่แนะนำ ส่งเสริม และกำกับดูแลสหกรณ์ โดยอธิบดีเป็นนายทะเบียนสหกรณ์
