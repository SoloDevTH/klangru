id: thai.literature.lessons-from-reading
subject: thai
title: { th: ข้อคิดจากวรรณกรรมและการนำไปใช้, en: "Lessons from literature and applying them to life" }
summary: แยกเหตุการณ์กับข้อคิด หาข้อคิดจากนิทานและร้อยกรองด้วย 4 ขั้น ถอดความร้อยกรองก่อนสรุป แยกความรู้กับข้อคิด สังเคราะห์ข้อคิดจากหลายเรื่อง และนำไปใช้ในชีวิตอย่างเจาะจง
difficulty: 3
minutes: 30
prerequisites: [thai.reading.comprehension]
encompasses:
  - { id: thai.reading.comprehension, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: lesson-steps.svg
    alt: "บันได 4 ขั้นจากเรื่องไปสู่ข้อคิด ตัวอย่างนิทานอีสปราชสีห์กับหนู ขั้นที่ 1 ตัวละครทำอะไร ราชสีห์ปล่อยหนู ขั้นที่ 2 ผลเป็นอย่างไร หนูกัดตาข่ายช่วยราชสีห์ ขั้นที่ 3 ทำไม ราชสีห์เมตตา หนูรู้คุณ ขั้นที่ 4 สรุปเป็นข้อคิด อย่าดูถูกผู้ที่เล็กกว่า แล้วลูกศรชี้ไปกล่องนำไปใช้ ในชีวิตของฉัน ชวนน้องที่ตัวเล็กมาเล่นในทีมด้วย"
    caption: "จากเรื่อง → ข้อคิด → ชีวิตจริง"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: หาข้อคิดจากเรื่องสั้น แล้วนำไปใช้
    problem: "เรื่องสมมุติ: โบรับหน้าที่รดน้ำต้นไม้ของห้อง แต่ไปเตะฟุตบอลจนลืมรดน้ำสามวัน ใบไม้เหี่ยว โบบอกครูตามตรง ขอโทษเพื่อน ทำป้ายเตือนและรดน้ำก่อนไปเล่นทุกวัน สองสัปดาห์ต่อมาต้นไม้แตกใบใหม่ หาข้อคิดและบอกการนำไปใช้"
    steps:
      - text: "การกระทำ: โบลืมหน้าที่ แล้วยอมรับผิดและแก้ไข"
      - text: "ผล: ต้นไม้เหี่ยวเมื่อขาดน้ำ แต่ฟื้นเมื่อโบแก้ไข และครูชม"
      - text: "เหตุ: ผลร้ายเกิดจากเล่นก่อนทำหน้าที่ ผลดีเกิดจากความรับผิดชอบ"
        why: "ข้อคิดต้องอธิบายได้ว่าทำไมจึงเกิดผลนั้น"
      - text: "ข้อคิด: ควรทำหน้าที่ให้เสร็จก่อนเล่น และเมื่อทำผิดควรยอมรับและแก้ไข"
      - text: "นำไปใช้ (เจาะจง): ฉันจะทำการบ้านให้เสร็จก่อนเปิดเกมทุกวัน"
    answer: "ข้อคิด: ทำหน้าที่ก่อนเล่น และยอมรับผิดแล้วแก้ไข นำไปใช้: ทำการบ้านให้เสร็จก่อนเล่นเกม"
  - { type: check, problem: thai.literature.lessons-from-reading.p004, prompt: "เหตุการณ์บอกสิ่งที่เกิดกับตัวละคร" }
  - type: worked-example
    title: ถอดความร้อยกรองก่อนหาข้อคิด
    problem: "\"อันอ้อยตาลหวานลิ้นแล้วสิ้นซาก แต่ลมปากหวานหูไม่รู้หาย\" (สุนทรภู่ เพลงยาวถวายโอวาท) ถอดความและบอกข้อคิด"
    steps:
      - text: "หาความหมายคำ: สิ้นซาก = หมดไม่เหลือร่องรอย · ลมปาก = ถ้อยคำที่พูด"
      - text: "ถอดความวรรคแรก: อ้อยและน้ำตาลหวานอยู่ที่ลิ้นแล้วก็หมดไป"
      - text: "ถอดความวรรคสอง: คำพูดดีที่ได้ยินยังอยู่ในใจไม่รู้หาย"
        why: "กวีใช้ความหวานของอาหารเปรียบกับความไพเราะของคำพูด"
      - text: "สรุปข้อคิด: คำพูดดีมีค่าและอยู่นานกว่าสิ่งของ จึงควรพูดดีต่อกัน"
    answer: "ความหวานของอ้อยตาลหมดไป แต่คำพูดดีจำไม่ลืม ข้อคิด: ควรพูดดีต่อกัน เพราะคำพูดอยู่ในใจคนนาน"
  - { type: check, problem: thai.literature.lessons-from-reading.p009, prompt: "ดูคำรอบข้าง เหน็บ ให้ เจ็บใจ" }
glossary:
  - { term: ข้อคิด, definition: "ประเด็นที่เรื่องชวนให้คิดและนำไปใช้กับชีวิตได้" }
  - { term: เหตุการณ์, definition: "สิ่งที่เกิดขึ้นกับตัวละครในเรื่อง" }
  - { term: ถอดความ, definition: "เล่าความหมายของร้อยกรองด้วยร้อยแก้วตามคำของตนเอง" }
  - { term: ร้อยแก้ว, definition: "ข้อความที่เขียนเป็นความเรียงธรรมดา ไม่มีบังคับสัมผัส" }
  - { term: ร้อยกรอง, definition: "ข้อความที่แต่งตามฉันทลักษณ์ เช่น กลอน กาพย์ โคลง" }
flashcards:
  - { front: "ข้อคิดที่ดีมีลักษณะอย่างไร", back: "มาจากเรื่อง ใช้ได้กับคนทั่วไป และบอกได้ว่าจะทำอะไร" }
  - { front: "หาข้อคิด 4 ขั้น", back: "การกระทำ → ผล → เหตุ → สรุปเป็นข้อคิด" }
  - { front: "อ่านร้อยกรองแล้วหาข้อคิด", back: "ถอดความเป็นร้อยแก้วก่อน" }
  - { front: "นำข้อคิดไปใช้ให้ดี", back: "บอกสถานการณ์และการกระทำที่เจาะจง" }
