  - id: computer.programming.recursion.p016
    topics: [computer.programming.recursion]
    difficulty: 5
    type: numeric
    stem: |
      โปรแกรมนี้แสดงตัวเลขใด (ไล่ค่าจากกรณีเล็กขึ้นไป)

      ```python
      def g(n):
          if n <= 1:
              return 1
          return g(n - 1) + g(n - 2) + 1

      print(g(4))
      ```
    answer: { value: 9 }
    hints:
      - "g(0) = 1 และ g(1) = 1 จากกรณีฐาน"
      - "g(2) = g(1) + g(0) + 1 แล้วหา g(3) และ g(4) ต่อ"
    misconceptions:
      - { match: 5, feedback: "5 คือ g(3) ยังต้องคำนวณ g(4) = g(3) + g(2) + 1" }
      - { match: 7, feedback: "ใช้ g(0) = 0 แต่กรณีฐาน n <= 1 คืน 1 ทั้ง g(0) และ g(1)" }
    solution: "g(0) = g(1) = 1, g(2) = 1 + 1 + 1 = 3, g(3) = 3 + 1 + 1 = 5, g(4) = 5 + 3 + 1 = 9 สังเกตว่า g(n) เท่ากับจำนวนครั้งที่ fib(n) ถูกเรียก (fib(4) เรียก 9 ครั้ง)"
