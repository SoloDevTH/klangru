    ai_assisted: true

  - id: chemistry.states.real-gases-phase-diagrams.p017
    topics: [chemistry.states.real-gases-phase-diagrams]
    difficulty: 5
    type: numeric
    stem: 'บรรจุภัณฑ์อาหารแช่แข็งใช้น้ำแข็งแห้ง ($\mathrm{CO_2}$ แข็ง) 100 g ระเหิดหมดที่ความดัน 1 atm และ 25 °C ถ้าถือเป็นแก๊สอุดมคติ จะได้แก๊สกี่ลิตร กำหนด $M(\mathrm{CO_2}) = 44.01$ g/mol และ $R = 0.082057$ L·atm/(mol·K) (ตอบเป็นลิตร)'
    answer: { value: 55.6, tolerance: 0.2, unit: L }
    hints:
      - 'หาจำนวนโมลของ $\mathrm{CO_2}$ จากมวลและมวลโมลาร์'
