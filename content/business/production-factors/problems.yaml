    stem: "ชุมชนประมงชายฝั่งแห่งหนึ่งพบว่าปลาที่จับได้ลดลงทุกปี ถ้าคิดทั้งความรับผิดชอบของผู้ผลิตและการใช้ทรัพยากรอย่างยั่งยืน ข้อเสนอใดดีที่สุด"
    choices:
      - { id: a, text: "ตกลงกันงดจับในฤดูปลาวางไข่ ใช้อวนที่ตาไม่ถี่จนติดลูกปลา และช่วยกันปลูกป่าชายเลนเป็นแหล่งอนุบาลสัตว์น้ำ", correct: true }
      - { id: b, text: "ซื้อเรือใหญ่ขึ้นเพื่อออกไปจับให้ได้มากกว่าเดิมก่อนชุมชนอื่น", feedback: "จับมากขึ้นทำให้ปลาหมดเร็วขึ้น ไม่ได้แก้ต้นเหตุ" }
      - { id: c, text: "ใช้อวนตาถี่เพื่อให้ได้ปลาทุกขนาด", feedback: "ลูกปลาถูกจับก่อนโต ปีต่อไปจะยิ่งมีปลาน้อย" }
      - { id: d, text: "เลิกทำประมงทั้งหมดทันทีโดยไม่มีอาชีพรองรับ", feedback: "แก้ปัญหาทรัพยากรแต่ทำให้คนในชุมชนไม่มีรายได้ ไม่ใช่ทางที่พอประมาณและมีเหตุผล" }
