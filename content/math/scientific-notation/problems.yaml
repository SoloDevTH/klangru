problems:
  - id: math.sci.p001
    topics: [math.number.scientific-notation]
    difficulty: 1
    type: numeric
    stem: "$2^{-3}$ มีค่าเท่าใด (ตอบเป็นทศนิยม)"
    answer: { value: 0.125, tolerance: 0.001 }
    hints:
      - "เลขชี้กำลังลบหมายถึงส่วนกลับ ไม่ได้ทำให้ค่าติดลบ"
      - "$a^{-n} = \\dfrac{1}{a^{n}}$"
      - "หา $2^3$ ก่อน แล้วนำ 1 หารด้วยผลนั้น"
    misconceptions:
      - { match: -8, feedback: "เลขชี้กำลังลบไม่ได้ทำให้ผลลัพธ์ติดลบ แต่หมายถึงส่วนกลับ: $2^{-3} = \\dfrac{1}{2^3}$" }
      - { match: -6, feedback: "ดูเหมือนนำ 2 คูณ $-3$ แต่เลขยกกำลังไม่ใช่การคูณฐานกับเลขชี้กำลัง $2^{-3} = \\dfrac{1}{2 \\times 2 \\times 2}$" }
    solution: "$2^{-3} = \\dfrac{1}{2^3} = \\dfrac{1}{8} = 0.125$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.sci.p002
    topics: [math.number.scientific-notation]
    difficulty: 1
    type: mcq
    stem: "จำนวนในข้อใดเขียนอยู่ในรูปสัญกรณ์วิทยาศาสตร์ที่ถูกต้อง"
    choices:
      - { id: a, text: "$4.7 \\times 10^{5}$", correct: true }
      - { id: b, text: "$47 \\times 10^{4}$", feedback: "มีค่าเท่ากัน แต่สัมประสิทธิ์ 47 ไม่น้อยกว่า 10 จึงยังไม่ใช่สัญกรณ์วิทยาศาสตร์" }
      - { id: c, text: "$0.47 \\times 10^{6}$", feedback: "มีค่าเท่ากัน แต่สัมประสิทธิ์ 0.47 น้อยกว่า 1 สัมประสิทธิ์ต้องอยู่ในช่วง $1 \\le a < 10$" }
    hints:
      - "รูปที่ถูกต้องคือ $a \\times 10^{n}$ โดย $a$ มีเงื่อนไขบางอย่าง"
      - "ตรวจว่าสัมประสิทธิ์แต่ละข้อมากกว่าหรือเท่ากับ 1 และน้อยกว่า 10 หรือไม่"
    solution: "ทั้งสามข้อมีค่าเท่ากับ 470,000 แต่มีเพียง $4.7 \\times 10^{5}$ ที่สัมประสิทธิ์อยู่ในช่วง $1 \\le a < 10$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.sci.p003
    topics: [math.number.scientific-notation]
    difficulty: 2
    type: numeric
    stem: "เขียน $0.00052$ ในรูป $5.2 \\times 10^{n}$ แล้ว $n$ มีค่าเท่าใด"
    answer: { value: -4 }
    hints:
      - "จำนวนเดิมน้อยกว่า 1 เลขชี้กำลังต้องเป็นบวกหรือลบ"
      - "นับว่าต้องเลื่อนจุดทศนิยมไปทางขวากี่ตำแหน่งจึงได้ 5.2 (นับตำแหน่งที่เลื่อน ไม่ใช่นับเลขศูนย์)"
    misconceptions:
      - { match: 4, feedback: "จำนวนตำแหน่งถูกแล้ว แต่ 0.00052 น้อยกว่า 1 เลขชี้กำลังจึงต้องเป็นลบ" }
      - { match: -3, feedback: "ดูเหมือนนับเลขศูนย์หลังจุดทศนิยม (มี 3 ตัว) แต่ต้องนับตำแหน่งที่จุดเลื่อนไปจนอยู่หลังเลข 5 ซึ่งมี 4 ตำแหน่ง" }
    solution: "เลื่อนจุดทศนิยมไปทางขวา 4 ตำแหน่ง: 0.00052 → 5.2 จึงได้ $0.00052 = 5.2 \\times 10^{-4}$ ตรวจ: $5.2 \\times \\dfrac{1}{10000} = 0.00052$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.sci.p004
    topics: [math.number.scientific-notation]
    difficulty: 2
    type: match
    stem: "จับคู่จำนวนกับรูปสัญกรณ์วิทยาศาสตร์ที่เท่ากัน"
    pairs:
      - { left: "$3{,}000{,}000$", right: "$3 \\times 10^{6}$" }
      - { left: "$300$", right: "$3 \\times 10^{2}$" }
      - { left: "$3$", right: "$3 \\times 10^{0}$" }
      - { left: "$0.3$", right: "$3 \\times 10^{-1}$" }
      - { left: "$0.003$", right: "$3 \\times 10^{-3}$" }
    hints:
      - "จำนวนที่มากกว่า 10 ได้เลขชี้กำลังบวก จำนวนที่น้อยกว่า 1 ได้เลขชี้กำลังลบ"
      - "$10^{0} = 1$"
      - "นับว่าต้องเลื่อนจุดทศนิยมกี่ตำแหน่งจึงได้ 3"
    solution: "$3{,}000{,}000 = 3 \\times 10^{6}$ · $300 = 3 \\times 10^{2}$ · $3 = 3 \\times 10^{0}$ · $0.3 = 3 \\times 10^{-1}$ · $0.003 = 3 \\times 10^{-3}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.sci.p005
    topics: [math.number.scientific-notation]
    difficulty: 2
    type: numeric
    stem: "ประเทศไทยมีพื้นที่ประมาณ 513,000 ตารางกิโลเมตร ถ้าเขียนเป็น $5.13 \\times 10^{n}$ ตารางกิโลเมตร แล้ว $n$ มีค่าเท่าใด"
    answer: { value: 5 }
    hints:
      - "วางจุดทศนิยมหลังเลข 5 ได้ 5.13"
      - "นับว่าจุดทศนิยมเลื่อนจากท้ายจำนวนมาอยู่หลังเลข 5 กี่ตำแหน่ง"
    misconceptions:
      - { match: 3, feedback: "ดูเหมือนนับเฉพาะเลขศูนย์ท้ายจำนวน ต้องนับทุกหลักที่จุดทศนิยมเลื่อนผ่าน รวมทั้งเลข 1 และ 3 ด้วย" }
      - { match: 6, feedback: "ดูเหมือนนับจำนวนหลักทั้งหมด (6 หลัก) แต่หลักแรกยังอยู่หน้าจุดทศนิยม จุดจึงเลื่อนแค่ 5 ตำแหน่ง" }
    solution: "513,000 → 5.13 จุดทศนิยมเลื่อนไปทางซ้าย 5 ตำแหน่ง จึงได้ $5.13 \\times 10^{5}\\ \\mathrm{km^2}$ ตรวจ: $5.13 \\times 100{,}000 = 513{,}000$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.sci.p006
    topics: [math.number.scientific-notation]
    difficulty: 3
    type: text
    stem: "เขียน $0.0000407$ ในรูปสัญกรณ์วิทยาศาสตร์ (พิมพ์ในรูปเช่น 3.1x10^-5)"
    accepted: ["4.07x10^-5", "4.07×10^-5", "4.07*10^-5", "4.07x10^(-5)", "4.07×10^(-5)", "4.07*10^(-5)", "4.07e-5", "4.07x10^{-5}", "4.07×10^{-5}"]
    hints:
      - "สัมประสิทธิ์ต้องอยู่ระหว่าง 1 ถึงน้อยกว่า 10 จึงต้องเลื่อนจุดจนอยู่หลังเลข 4"
      - "จำนวนนี้น้อยกว่า 1 เลขชี้กำลังจึงเป็นลบ"
      - "นับจำนวนตำแหน่งที่จุดทศนิยมเลื่อนไปทางขวา แล้วใส่เครื่องหมายลบ"
    misconceptions:
      - { match: "4.07x10^-4", feedback: "ดูเหมือนนับเลขศูนย์หลังจุด (4 ตัว) แต่ต้องนับตำแหน่งที่จุดเลื่อนจนอยู่หลังเลข 4 ซึ่งมี 5 ตำแหน่ง" }
      - { match: "4.07x10^5", feedback: "จำนวนตำแหน่งถูกแล้ว แต่ 0.0000407 น้อยกว่า 1 เลขชี้กำลังต้องเป็นลบ" }
      - { match: "407x10^-7", feedback: "มีค่าเท่ากัน แต่สัมประสิทธิ์ 407 เกิน 10 ต้องเลื่อนจุดให้เหลือหลักเดียวหน้าจุด" }
    solution: "เลื่อนจุดทศนิยมไปทางขวา 5 ตำแหน่ง: 0.0000407 → 4.07 จึงได้ $4.07 \\times 10^{-5}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.sci.p007
    topics: [math.number.scientific-notation]
    difficulty: 3
    type: numeric
    stem: "$(6 \\times 10^{4}) \\times (5 \\times 10^{7})$ เขียนในสัญกรณ์วิทยาศาสตร์ได้ $3 \\times 10^{n}$ แล้ว $n$ มีค่าเท่าใด"
    answer: { value: 12 }
    hints:
      - "คูณสัมประสิทธิ์ด้วยกัน และจัดการเลขชี้กำลังด้วยกัน"
      - "$10^{4} \\times 10^{7}$ ให้บวกเลขชี้กำลัง"
      - "สัมประสิทธิ์ที่ได้เกิน 10 ต้องปรับรูปอีกครั้ง แล้วเลขชี้กำลังจะเปลี่ยนตาม"
    misconceptions:
      - { match: 11, feedback: "ได้ $30 \\times 10^{11}$ ถูกแล้ว แต่ลืมปรับรูป $30 = 3 \\times 10^{1}$ เลขชี้กำลังจึงต้องเพิ่มอีก 1" }
      - { match: 28, feedback: "ดูเหมือนคูณเลขชี้กำลัง $4 \\times 7$ เมื่อคูณเลขยกกำลังฐานเดียวกันต้องบวกเลขชี้กำลัง" }
    solution: "$(6 \\times 5) \\times 10^{4+7} = 30 \\times 10^{11} = 3 \\times 10^{1} \\times 10^{11} = 3 \\times 10^{12}$ จึงได้ $n = 12$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.sci.p008
    topics: [math.number.scientific-notation]
    difficulty: 3
    type: mcq
    stem: "$\\dfrac{8 \\times 10^{-3}}{2 \\times 10^{5}}$ มีค่าเท่าใด"
    choices:
      - { id: a, text: "$4 \\times 10^{-8}$", correct: true }
      - { id: b, text: "$4 \\times 10^{2}$", feedback: "ดูเหมือนบวกเลขชี้กำลัง $-3 + 5$ เมื่อหารต้องลบเลขชี้กำลัง $-3 - 5$" }
      - { id: c, text: "$6 \\times 10^{-8}$", feedback: "เลขชี้กำลังถูกแล้ว แต่สัมประสิทธิ์ต้องหาร $8 \\div 2$ ไม่ใช่ลบ $8 - 2$" }
      - { id: d, text: "$4 \\times 10^{-15}$", feedback: "ดูเหมือนคูณเลขชี้กำลัง $-3 \\times 5$ เมื่อหารเลขยกกำลังฐานเดียวกันต้องลบเลขชี้กำลัง" }
    hints:
      - "หารสัมประสิทธิ์ด้วยกัน และจัดการเลขชี้กำลังด้วยกัน"
      - "$\\dfrac{10^{m}}{10^{n}} = 10^{m-n}$ ระวังเครื่องหมายของ $-3$"
    solution: "$\\dfrac{8}{2} \\times 10^{-3-5} = 4 \\times 10^{-8}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.sci.p009
    topics: [math.number.scientific-notation]
    difficulty: 3
    type: order
    stem: "เรียงจำนวนต่อไปนี้จากน้อยไปมาก"
    items:
      - "$8 \\times 10^{-5}$"
      - "$1.5 \\times 10^{-4}$"
      - "$3.2 \\times 10^{-4}$"
      - "$6 \\times 10^{2}$"
      - "$2 \\times 10^{3}$"
    hints:
      - "เทียบเลขชี้กำลังก่อน เลขชี้กำลังมากกว่าแปลว่าจำนวนมากกว่า"
      - "$-5$ น้อยกว่า $-4$"
      - "ถ้าเลขชี้กำลังเท่ากัน ให้เทียบสัมประสิทธิ์"
    solution: "เลขชี้กำลังเรียงจากน้อยไปมาก: $-5 < -4 < 2 < 3$ สองจำนวนที่มี $10^{-4}$ เทียบสัมประสิทธิ์ $1.5 < 3.2$ จึงได้ $8 \\times 10^{-5}$ (0.00008) < $1.5 \\times 10^{-4}$ (0.00015) < $3.2 \\times 10^{-4}$ (0.00032) < $6 \\times 10^{2}$ (600) < $2 \\times 10^{3}$ (2000)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.sci.p010
    topics: [math.number.scientific-notation]
    difficulty: 4
    type: numeric
    stem: "ฝุ่น PM2.5 อนุภาคหนึ่งมีเส้นผ่านศูนย์กลาง $2.5 \\times 10^{-6}\\ \\mathrm{m}$ ส่วนเส้นผมเส้นหนึ่งมีเส้นผ่านศูนย์กลาง $7 \\times 10^{-5}\\ \\mathrm{m}$ เส้นผมหนากว่าฝุ่นนี้กี่เท่า"
    answer: { value: 28, unit: เท่า }
    hints:
      - "\"กี่เท่า\" หาได้จากการหาร ขนาดที่ใหญ่กว่าหารด้วยขนาดที่เล็กกว่า"
      - "หารสัมประสิทธิ์ $7 \\div 2.5$ และลบเลขชี้กำลัง"
      - "เลขชี้กำลังคือ (ของตัวตั้ง) ลบ (ของตัวหาร) ระวังการลบจำนวนลบ"
    misconceptions:
      - { match: 0.28, feedback: "สัมประสิทธิ์ถูกแล้ว แต่ลบเลขชี้กำลังกลับด้าน ต้องเป็น $-5 - (-6) = 1$ ไม่ใช่ $-6 - (-5)$" }
      - { match: 0.036, feedback: "ดูเหมือนนำขนาดฝุ่นหารด้วยขนาดเส้นผม ผลที่ได้น้อยกว่า 1 แปลว่าฝุ่นเล็กกว่า ถ้าถามว่าเส้นผมหนากว่ากี่เท่า ต้องเอาขนาดเส้นผมเป็นตัวตั้ง" }
    solution: "$\\dfrac{7 \\times 10^{-5}}{2.5 \\times 10^{-6}} = \\dfrac{7}{2.5} \\times 10^{-5-(-6)} = 2.8 \\times 10^{1} = 28$ เท่า (หน่วยเมตรตัดกันหมด)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.sci.p011
    topics: [math.number.scientific-notation]
    difficulty: 4
    type: numeric
    stem: "สมมติว่างบประมาณรายจ่ายประจำปีของประเทศเท่ากับ 3.5 ล้านล้านบาท หรือ $3.5 \\times 10^{12}$ บาท และมีประชากร $7 \\times 10^{7}$ คน ถ้าเฉลี่ยงบประมาณให้ทุกคนเท่ากัน จะได้คนละกี่บาท (ตอบเป็นตัวเลขเต็ม)"
    answer: { value: 50000, unit: บาท }
    hints:
      - "หารงบประมาณด้วยจำนวนประชากร"
      - "หารสัมประสิทธิ์ $3.5 \\div 7$ แล้วลบเลขชี้กำลัง $12 - 7$"
      - "สัมประสิทธิ์ที่ได้น้อยกว่า 1 ให้ปรับรูปให้ถูกทิศก่อนแปลงเป็นจำนวนเต็ม"
    misconceptions:
      - { match: 5000000, feedback: "ได้ $0.5 \\times 10^{5}$ ถูกแล้ว แต่ปรับรูปผิดทิศ เมื่อสัมประสิทธิ์โตขึ้น 10 เท่า (0.5 → 5) เลขชี้กำลังต้องลดลง 1 ได้ $5 \\times 10^{4}$" }
      - { match: 50, feedback: "ดูเหมือนใช้ล้านล้านเป็น $10^{9}$ แต่หนึ่งล้านล้าน = $10^{6} \\times 10^{6} = 10^{12}$" }
    solution: "$\\dfrac{3.5 \\times 10^{12}}{7 \\times 10^{7}} = 0.5 \\times 10^{5} = 5 \\times 10^{4} = 50{,}000$ บาทต่อคน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.sci.p012
    topics: [math.number.scientific-notation]
    difficulty: 5
    type: numeric
    stem: "สมมติว่าคนไทย $6.6 \\times 10^{7}$ คน ใช้น้ำคนละ $2 \\times 10^{2}$ ลิตรต่อวัน ใน 1 ปี ($3.65 \\times 10^{2}$ วัน) จะใช้น้ำรวมกี่ลิตร ถ้าเขียนคำตอบในสัญกรณ์วิทยาศาสตร์เป็น $a \\times 10^{n}$ ลิตร แล้ว $n$ มีค่าเท่าใด"
    answer: { value: 12 }
    hints:
      - "น้ำรวม = จำนวนคน × น้ำต่อคนต่อวัน × จำนวนวัน"
      - "คูณสัมประสิทธิ์ทั้งสามตัว และบวกเลขชี้กำลังทั้งสามตัว"
      - "สัมประสิทธิ์ที่ได้ต้องปรับให้อยู่ระหว่าง 1 ถึงน้อยกว่า 10 แล้วปรับเลขชี้กำลังตาม"
    misconceptions:
      - { match: 11, feedback: "ได้ $48.18 \\times 10^{11}$ ถูกแล้ว แต่ลืมปรับรูป $48.18 = 4.818 \\times 10^{1}$ เลขชี้กำลังจึงต้องเพิ่มอีก 1" }
      - { match: 28, feedback: "ดูเหมือนคูณเลขชี้กำลัง $7 \\times 2 \\times 2$ เมื่อคูณเลขยกกำลังฐานเดียวกันต้องบวกเลขชี้กำลัง" }
    solution: "$(6.6 \\times 2 \\times 3.65) \\times 10^{7+2+2} = 48.18 \\times 10^{11} = 4.818 \\times 10^{12}$ ลิตร จึงได้ $n = 12$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.sci.p013
    topics: [math.number.scientific-notation]
    difficulty: 3
    type: numeric
    stem: "ประมาณประชากรไทยเป็น $7 \\times 10^{7}$ คน และประชากรโลกเป็น $8 \\times 10^{9}$ คน ประชากรโลกมากกว่าประชากรไทยประมาณกี่เท่า (ตอบเป็นจำนวนเต็มที่ใกล้ที่สุด)"
    answer: { value: 114, tolerance: 1, unit: เท่า }
    hints:
      - "หาร $\\dfrac{8 \\times 10^{9}}{7 \\times 10^{7}}$"
      - "หารสัมประสิทธิ์ $\\tfrac{8}{7}$ และลบเลขชี้กำลัง $9 - 7$"
    misconceptions:
      - { match: 1.14, feedback: "นั่นคือ $\\tfrac{8}{7}$ อย่างเดียว ยังต้องคูณ $10^{9 - 7} = 100$" }
      - { match: 0.01, feedback: "ดูเหมือนหารกลับด้าน ($\\tfrac{7 \\times 10^7}{8 \\times 10^9}$) ได้ส่วนของไทยในโลก โจทย์ถามโลกมากกว่าไทยกี่เท่า" }
    solution: "$\\dfrac{8 \\times 10^{9}}{7 \\times 10^{7}} = \\dfrac{8}{7} \\times 10^{2} \\approx 1.14 \\times 10^{2} \\approx 114$ เท่า"
