    choices:
      - { id: a, text: "ชื่อ ที่อยู่ และเลขประจำตัวประชาชนของเพื่อน", correct: true, feedback: "เป็นข้อมูลส่วนบุคคลของผู้อื่น ข้อความที่พิมพ์อาจถูกเก็บไว้" }
      - { id: b, text: "รหัสผ่านบัญชีของโรงเรียน", correct: true, feedback: "รหัสผ่านต้องไม่ให้ใครหรือระบบใดเห็นเลย" }
      - { id: c, text: "ผลตรวจสุขภาพของคุณแม่พร้อมชื่อจริง", correct: true, feedback: "ข้อมูลสุขภาพเป็นข้อมูลอ่อนไหว และเป็นของคนอื่น" }
      - { id: d, text: "คำถามว่าการสังเคราะห์ด้วยแสงคืออะไร", feedback: "คำถามความรู้ทั่วไปไม่มีข้อมูลส่วนตัว พิมพ์ได้ แต่ต้องตรวจคำตอบกับแหล่งที่เชื่อถือได้" }
    hints:
      - "ข้อความที่พิมพ์ลงในบริการออนไลน์อาจถูกเก็บและนำไปใช้ต่อ"
      - "ทบทวนเรื่องข้อมูลส่วนบุคคลและข้อมูลอ่อนไหว"
    solution: "ข้อมูลส่วนบุคคลของผู้อื่น รหัสผ่าน และข้อมูลสุขภาพไม่ควรพิมพ์ลงในบริการ AI เพราะอาจถูกเก็บไว้และหลุดออกไปได้ คำถามความรู้ทั่วไปไม่มีความเสี่ยงด้านความเป็นส่วนตัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.intro.p013
    topics: [computer.ai.intro]
    difficulty: 4
    type: mcq
    stem: "แบบจำลองแยกขยะรีไซเคิลจากภาพได้ความแม่นยำ 100% กับข้อมูลฝึก แต่ได้ 62% กับข้อมูลทดสอบ ข้อใดอธิบายได้ดีที่สุด"
    choices:
      - { id: a, text: "แบบจำลองเรียนรู้เกิน (overfitting) คือจำรายละเอียดของภาพฝึก แต่ไม่ได้เรียนรูปแบบที่ใช้กับภาพใหม่ได้", correct: true }
      - { id: b, text: "ข้อมูลทดสอบผิด เพราะแบบจำลองได้ 100% แล้ว", feedback: "ผลกับข้อมูลทดสอบคือผลที่ใกล้การใช้งานจริงที่สุด ผล 100% กับข้อมูลฝึกต่างหากที่หลอกตา" }
      - { id: c, text: "แบบจำลองดีมาก ควรนำไปใช้ได้ทันที", feedback: "62% กับข้อมูลใหม่ยังทำนายผิดเกือบ 4 ใน 10 ครั้ง" }
      - { id: d, text: "ควรนำข้อมูลทดสอบไปรวมกับข้อมูลฝึกแล้ววัดใหม่ จะได้ตัวเลขสูงขึ้น", feedback: "จะไม่มีข้อมูลที่แบบจำลองไม่เคยเห็นเหลือไว้วัดผลอีก ตัวเลขที่ได้จะสูงเกินจริง" }
    hints:
      - "ความต่างมากระหว่างผลกับข้อมูลฝึกและข้อมูลทดสอบบอกอะไร"
      - "ทบทวนเรื่องการเรียนรู้เกินในบทเรียน"
    solution: "ผลกับข้อมูลฝึกดีมากแต่ผลกับข้อมูลใหม่แย่ แปลว่าแบบจำลองจำข้อมูลฝึก ไม่ได้เรียนรูปแบบทั่วไป แก้ได้ เช่น เพิ่มข้อมูลฝึกที่หลากหลาย หรือใช้แบบจำลองที่ซับซ้อนน้อยลง แล้ววัดด้วยข้อมูลทดสอบอีกครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.intro.p014
    topics: [computer.ai.intro]
    difficulty: 5
    type: numeric
    stem: |
      ใช้ฟังก์ชัน `minimax` และ `best_move` ของเกมหยิบไม้ในบทเรียน (หยิบได้ 1 หรือ 2 อัน ใครหยิบอันสุดท้ายชนะ) `print(best_move(8))` แสดงตัวเลขใด
    answer: { value: 2, unit: "อัน" }
    hints:
      - "best_move เลือกการหยิบที่ทำให้ minimax ของตำแหน่งที่เหลือ (ตาคู่แข่ง) มีค่ามากที่สุด"
      - "ตำแหน่งที่จำนวนไม้หารด้วย 3 ลงตัวเป็นตำแหน่งแพ้ของผู้ที่ต้องเดิน ลองดูว่าหยิบเท่าใดแล้วเหลือแบบนั้นให้คู่แข่ง"
    misconceptions:
      - { match: 1, feedback: "หยิบ 1 เหลือ 7 คู่แข่งหยิบ 1 ให้เหลือ 6 แล้วคอมพิวเตอร์จะแพ้ minimax ของกิ่งนี้เป็น −1" }
    solution: "หยิบ 1 เหลือ 7 ตาคู่แข่ง ได้ค่า −1 (คู่แข่งหยิบ 1 ให้เหลือ 6) หยิบ 2 เหลือ 6 ตาคู่แข่ง ได้ค่า +1 (6 หารด้วย 3 ลงตัว คู่แข่งหยิบเท่าใด คอมพิวเตอร์ก็ทำให้เหลือ 3 แล้วเหลือ 0 ได้) best_move จึงคืน 2"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.intro.p015
    topics: [computer.ai.intro]
    difficulty: 5
    type: numeric
    stem: "ตรวจคัดกรองโรคหายากในคน 1,000 คน มีผู้ป่วยจริง 10 คน แบบจำลอง A ตรวจพบผู้ป่วยจริง 8 คน และบอกผิดว่าคนปกติ 40 คนป่วย ส่วนที่เหลือทำนายถูก ความแม่นยำของแบบจำลอง A เป็นร้อยละเท่าไร"
    answer: { value: 95.8, tolerance: 0.05, unit: "%" }
    hints:
      - "ทำนายถูก = ผู้ป่วยที่ตรวจพบ + คนปกติที่บอกว่าปกติ"
      - "คนปกติมี 990 คน บอกผิด 40 คน จึงบอกถูกกี่คน"
    misconceptions:
      - { match: 99, feedback: "99% คือความแม่นยำของแบบจำลองที่บอกว่าทุกคนปกติ (990 ÷ 1,000) ไม่ใช่แบบจำลอง A" }
      - { match: 80, feedback: "80% คือร้อยละของผู้ป่วยที่ตรวจพบ (8 ÷ 10) ไม่ใช่ความแม่นยำรวม" }
    solution: "ทำนายถูก = 8 + (990 − 40) = 958 คน ความแม่นยำ 958 ÷ 1,000 × 100 = 95.8% น่าสนใจว่าแบบจำลองที่ตอบว่าปกติทุกคนได้ 99% แต่พบผู้ป่วย 0 คน ความแม่นยำอย่างเดียวจึงไม่พอสำหรับข้อมูลที่กลุ่มหนึ่งมีน้อยมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.intro.p016
    topics: [computer.ai.intro]
    difficulty: 5
    type: mcq
    stem: "บริษัทหนึ่งโฆษณาว่า AI ตรวจโรคหายากที่พบในคน 1 ใน 100 ของตนแม่นยำ 99% ข้อใดเป็นการประเมินข้ออ้างนี้ที่ดีที่สุด"
    choices:
      - { id: a, text: "ต้องถามว่าตรวจพบผู้ป่วยจริงได้กี่คนจากผู้ป่วยทั้งหมด เพราะระบบที่ตอบว่าปกติทุกคนก็ได้ 99% โดยไม่พบผู้ป่วยเลย และต้องรู้ว่าทดสอบกับข้อมูลชุดใด", correct: true }
      - { id: b, text: "99% สูงมาก แสดงว่าระบบดีและพร้อมใช้", feedback: "เมื่อผู้ป่วยมีแค่ 1% ระบบที่ไม่เคยตอบว่าป่วยก็ได้ 99% ตัวเลขนี้อย่างเดียวจึงบอกไม่ได้ว่าระบบมีประโยชน์" }
      - { id: c, text: "99% แปลว่าผู้ที่ระบบบอกว่าป่วยจะป่วยจริง 99 ใน 100 คน", feedback: "ความแม่นยำรวมนับทุกคน ไม่ได้บอกว่าในคนที่ถูกบอกว่าป่วย มีกี่คนป่วยจริง" }
      - { id: d, text: "AI ผิดได้แค่ 1% จึงไม่ต้องให้แพทย์ตรวจซ้ำ", feedback: "การตัดสินใจทางการแพทย์ต้องมีแพทย์ตรวจยืนยัน และ 1% ของคนจำนวนมากก็เป็นคนจำนวนมาก" }
    hints:
      - "ลองคิดว่าระบบที่ตอบว่าปกติทุกคนได้ความแม่นยำเท่าไร"
      - "สิ่งที่ผู้ใช้อยากรู้จริงคือระบบพบผู้ป่วยได้หรือไม่"
    solution: "ถ้าผู้ป่วยมี 1% ระบบที่ตอบว่าปกติเสมอก็ได้ความแม่นยำ 99% จึงต้องดูว่าพบผู้ป่วยจริงได้สัดส่วนเท่าไร บอกผิดว่าป่วยกี่คน และทดสอบกับข้อมูลทดสอบที่เป็นตัวแทนของผู้ใช้จริงหรือไม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

