  - id: biology.evolution.evolution.p013
    topics: [biology.evolution.evolution]
    difficulty: 4
    type: numeric
    stem: "(ข้อมูลสมมติ) ประชากรผีเสื้อกลางคืน 1,000 ตัวบนต้นไม้เปลือกสีเข้ม มีตัวสีเข้ม 100 ตัว และสีอ่อน 900 ตัว นกจับกินจนตัวสีเข้มรอด 60% และตัวสีอ่อนรอด 20% หลังการล่า ตัวสีเข้มคิดเป็นร้อยละเท่าใดของผีเสื้อที่รอด"
    answer: { value: 25, unit: "%" }
    misconceptions:
      - { match: 75, feedback: "นำอัตรารอดมาเทียบกันตรง ๆ (60 กับ 20) โดยไม่คิดจำนวนเริ่มต้นที่ต่างกันมาก" }
      - { match: 6, feedback: "หารด้วยจำนวนเริ่มต้น 1,000 แต่ต้องหารด้วยจำนวนที่รอดทั้งหมด" }
      - { match: 10, feedback: "10% คือสัดส่วนก่อนการล่า" }
    hints:
      - "หาจำนวนที่รอดของแต่ละสี"
      - "ร้อยละ = สีเข้มที่รอด ÷ ผีเสื้อที่รอดทั้งหมด × 100"
    solution: "สีเข้มรอด $100 \\times 0.6 = 60$ ตัว สีอ่อนรอด $900 \\times 0.2 = 180$ ตัว สีเข้มคิดเป็น $\\tfrac{60}{240} \\times 100 = 25$ เปอร์เซ็นต์ เพิ่มจาก 10% ในรุ่นเดียว เป็นการคัดเลือกแบบมีทิศทาง"
