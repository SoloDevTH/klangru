- id: business.accounting.budgeting-variance.p013
  topics:
  - business.accounting.budgeting-variance
  difficulty: 4
  type: numeric
  stem: โรงงานเฟอร์นิเจอร์ (สมมติ) กำหนดมาตรฐานค่าแรงทางตรงตัวละ $3$ ชั่วโมง อัตรามาตรฐานชั่วโมงละ $120$ บาท เดือนนี้ผลิต $1{,}000$ ตัว ใช้แรงงานจริง $3{,}150$ ชั่วโมง จ่ายจริงชั่วโมงละ $118$ บาท **ผลต่างประสิทธิภาพแรงงาน** เป็นกี่บาท (ตอบขนาดเป็นจำนวนบวก หน่วยบาท)
  answer:
    value: 18000
    unit: บาท
  misconceptions:
  - match: 17700
    feedback: คูณด้วยอัตราจริง ต้องคูณอัตรามาตรฐาน
  - match: 6300
    feedback: นั่นคือผลต่างอัตราค่าแรง
  hints:
  - ชั่วโมงมาตรฐานของผลผลิตจริง $= 1{,}000 \times 3$
  - ผลต่างประสิทธิภาพ $= (AH - SH) \times SR$
  solution: SH $= 3{,}000$ ชั่วโมง ผลต่างประสิทธิภาพ $= (3{,}150 - 3{,}000) \times 120 = 18{,}000$ บาท (**U** ใช้เวลามากกว่ามาตรฐาน) ส่วนผลต่างอัตรา $= (118 - 120) \times 3{,}150 = -6{,}300$ บาท (F)
