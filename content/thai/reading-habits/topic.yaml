id: thai.reading.reading-habits
subject: thai
title: { th: การเลือกอ่านและการประเมินคุณค่าสิ่งที่อ่าน, en: "Choosing what to read and evaluating its value" }
summary: เลือกหนังสือและสื่อตามความสนใจและระดับที่เหมาะ อ่านสม่ำเสมอ นำเสนอเรื่องที่อ่าน บอกคุณค่าที่ได้ ตรวจสื่อออนไลน์ และสังเคราะห์ความรู้จากหลายแหล่งไปพัฒนาตน
difficulty: 3
minutes: 30
prerequisites: [thai.reading.comprehension]
encompasses:
  - { id: thai.reading.comprehension, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: reading-log.svg
    alt: "บันทึกการอ่าน 7 ช่อง ชื่อเรื่อง ผึ้งน้อยนักสื่อสาร (หนังสือสมมุติ) ประเภท หนังสือความรู้ วิทยาศาสตร์ วันที่อ่าน 1–5 พฤศจิกายน วันละ 15 นาที สาระสำคัญ ผึ้งงานบอกเพื่อนว่าแหล่งดอกไม้อยู่ที่ไหนด้วยการเต้นเป็นรูปเลขแปด ความคิดเห็น ชอบภาพถ่ายระยะใกล้ อธิบายเข้าใจง่าย แต่ท้ายเล่มสั้นไป คุณค่าที่ได้ ความรู้ว่าสัตว์สื่อสารได้หลายวิธี และนำไปทำรายงานวิทยาศาสตร์ ให้คะแนน 4 ดาวจาก 5 แนะนำให้เพื่อนที่ชอบสัตว์"
    caption: "บันทึกการอ่านช่วยให้เห็นว่าอ่านอะไร ชอบอะไร และได้อะไร"
  - type: worked-example
    title: บอกคุณค่าของหนังสือให้เจาะจง
    problem: "เด่นอ่านนิทานเรื่องหนึ่ง แล้วเขียนว่า \"หนังสือดีมาก ได้ความรู้\" ช่วยเขียนใหม่ให้บอกคุณค่าได้ชัดเจน (นิทานเล่าเรื่องเด็กชายที่ฝึกว่ายน้ำทุกวันจนช่วยน้องที่ตกคลองได้ และท้ายเล่มมีวิธีลอยตัวในน้ำ)"
    steps:
      - text: "ถามว่าได้คุณค่าด้านใด: ด้านความรู้ (วิธีลอยตัว) และด้านข้อคิด (ฝึกฝนสม่ำเสมอ)"
        why: "คำว่า ดีมาก ไม่บอกว่าดีด้านใด ผู้ฟังจึงไม่รู้ว่าควรอ่านหรือไม่"
      - text: "ยกตัวอย่างจากเรื่อง: ท้ายเล่มสอนวิธีลอยตัวในน้ำ เด็กชายฝึกว่ายน้ำทุกวัน"
      - text: "บอกการนำไปใช้: จะฝึกลอยตัวกับครูพลศึกษา"
    answer: "\"ได้ความรู้เรื่องวิธีลอยตัวในน้ำจากท้ายเล่ม และได้ข้อคิดว่าการฝึกทุกวันทำให้ช่วยคนอื่นได้ ฉันจะฝึกลอยตัวกับครูพลศึกษา\""
  - { type: check, problem: thai.reading.reading-habits.p006, prompt: "ข้อใดบอกด้านและยกตัวอย่าง" }
  - type: figure
    src: synthesis.svg
    alt: "แผนภาพการสังเคราะห์ความรู้ คำถาม จะปลูกผักบุ้งในกระถางที่ระเบียงห้องได้อย่างไร มี 3 แหล่ง หนังสือห้องสมุดบอกว่าแดดวันละหลายชั่วโมงและรดน้ำเช้าเย็น เว็บไซต์ของหน่วยงานบอกว่าแดดวันละหลายชั่วโมงและดินร่วนระบายน้ำดี สัมภาษณ์ป้าที่ปลูกผักบอกว่ารดน้ำเช้าเย็นและตัดยอดแล้วแตกใหม่ ลูกศรจากทั้งสามแหล่งรวมเป็นข้อสรุปของเรา วางกระถางที่ได้แดดหลายชั่วโมง ใช้ดินร่วน รดน้ำเช้าเย็น และเก็บโดยตัดยอดเพื่อให้แตกใหม่ แล้วนำไปสู่แผน ลองปลูก 1 กระถาง จดผลทุกสัปดาห์"
    caption: "สังเคราะห์: รวมสิ่งที่หลายแหล่งบอก เป็นข้อสรุปและแผนของเราเอง"
  - type: worked-example
    title: ตรวจบทความออนไลน์ก่อนเชื่อ
    problem: "พบบทความ \"กินกล้วยวันละ 10 ลูก สูงขึ้น 5 เซนติเมตรในเดือนเดียว\" ไม่บอกผู้เขียน ไม่มีวันที่ ท้ายบทความมีลิงก์ขายผงกล้วย ควรเชื่อหรือไม่"
    steps:
      - text: "ใครเขียน: ไม่บอก จึงตรวจไม่ได้ว่าผู้เขียนรู้เรื่องนี้จริงหรือไม่"
      - text: "เขียนเมื่อไร: ไม่มีวันที่"
      - text: "อ้างแหล่งข้อมูลหรือไม่: ไม่มี และมีลิงก์ขายสินค้า"
        why: "บทความที่มุ่งขายมักเล่าแต่ข้อดีหรือเกินจริง"
      - text: "แหล่งอื่นตรงกันไหม: ควรหาจากหนังสือหรือเว็บไซต์ของหน่วยงานสาธารณสุขก่อนเชื่อ"
    answer: "ยังไม่ควรเชื่อ เพราะไม่รู้ผู้เขียน ไม่มีวันที่และแหล่งอ้างอิง และมุ่งขายสินค้า ต้องตรวจกับแหล่งที่น่าเชื่อถือก่อน"
  - { type: check, problem: thai.reading.reading-habits.p003, prompt: "2 คำอยู่ช่วงใดของกฎห้านิ้ว" }
glossary:
  - { term: คำโปรย, definition: "ข้อความสั้น ๆ หลังปกที่เล่าเรื่องย่อหรือจุดเด่นของหนังสือ" }
  - { term: สารบัญ, definition: "รายการหัวข้อในหนังสือพร้อมเลขหน้า" }
  - { term: บันทึกการอ่าน, definition: "การจดชื่อเรื่อง สาระสำคัญ ความคิดเห็น และคุณค่าที่ได้จากการอ่านแต่ละครั้ง" }
  - { term: คุณค่า, definition: "ประโยชน์ที่ได้จากสิ่งที่อ่าน ด้านความรู้ ข้อคิด ภาษา หรือการนำไปใช้" }
  - { term: สังเคราะห์, definition: "นำความรู้จากหลายแหล่งมารวมเป็นข้อสรุปใหม่ของตนเอง" }
flashcards:
  - { front: "กฎห้านิ้ว", back: "อ่าน 1 หน้า นับคำที่ไม่รู้ 2–3 คำพอดี 5 คำขึ้นไปยากเกินไป" }
  - { front: "คุณค่า 4 ด้านของสิ่งที่อ่าน", back: "ความรู้ ข้อคิดและแนวคิด ภาษา การนำไปใช้" }
  - { front: "ตรวจบทความออนไลน์ 4 ข้อ", back: "ใครเขียน เมื่อไร อ้างแหล่งใด แหล่งอื่นตรงกันไหม" }
  - { front: "แนะนำหนังสือ 4 ส่วน", back: "ชื่อเรื่องและผู้แต่ง เรื่องย่อ ความคิดเห็นพร้อมเหตุผล คุณค่าและใครควรอ่าน" }
