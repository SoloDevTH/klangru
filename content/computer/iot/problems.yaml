problems:
  - id: computer.systems.iot.p001
    topics: [computer.systems.iot]
    difficulty: 1
    type: mcq
    stem: "อินเทอร์เน็ตของสรรพสิ่ง (IoT) หมายถึงอะไร"
    choices:
      - { id: a, text: "อุปกรณ์ทั่วไปที่มีเซนเซอร์หรือตัวควบคุม และเชื่อมต่อเครือข่ายเพื่อแลกเปลี่ยนข้อมูลกัน", correct: true }
      - { id: b, text: "คอมพิวเตอร์ตั้งโต๊ะที่มีแป้นพิมพ์และจอภาพครบชุด", feedback: "คอมพิวเตอร์ตั้งโต๊ะทั่วไปไม่ได้เป็นนิยามของ IoT" }
      - { id: c, text: "เว็บไซต์ที่เปิดให้ทุกคนเข้าชมได้โดยไม่ต้องเข้าสู่ระบบ", feedback: "เว็บไซต์เป็นบริการบนอินเทอร์เน็ต แต่ไม่ได้ระบุว่าเป็นอุปกรณ์ที่มีเซนเซอร์หรือตัวควบคุม" }
      - { id: d, text: "โปรแกรมที่ช่วยจัดเก็บไฟล์เอกสารในคอมพิวเตอร์", feedback: "โปรแกรมจัดเก็บไฟล์ไม่ได้เชื่อมโยงกับการวัดค่าและควบคุมอุปกรณ์จริง" }
    hints:
      - "คำว่า สรรพสิ่ง หมายถึงของใช้ทั่วไปรอบตัว"
      - "ลองนึกถึงอุปกรณ์ที่วัดค่าหรือสั่งงานได้และต่อเครือข่ายได้"
    solution: "IoT คืออุปกรณ์ทั่วไปที่มีเซนเซอร์หรือตัวควบคุมและเชื่อมต่อเครือข่ายเพื่อส่งและรับข้อมูล เช่น เซนเซอร์วัดอุณหภูมิในโรงเรือน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.iot.p002
    topics: [computer.systems.iot]
    difficulty: 1
    type: match
    stem: "จับคู่ส่วนประกอบของระบบ IoT กับหน้าที่ที่ตรงที่สุด"
    pairs:
      - { left: "เซนเซอร์", right: "วัดค่าจากสิ่งแวดล้อม เช่น อุณหภูมิหรือความชื้น" }
      - { left: "แอคชูเอเตอร์", right: "ทำให้เกิดการเปลี่ยนแปลง เช่น เปิดปั๊มน้ำหรือสลับรีเลย์" }
      - { left: "เกตเวย์", right: "จุดเชื่อมระหว่างอุปกรณ์ในพื้นที่กับอินเทอร์เน็ต" }
      - { left: "MQTT", right: "โพรโทคอลแบบเผยแพร่–บอกรับที่ใช้ข้อความขนาดเล็ก" }
    hints:
      - "เซนเซอร์รับค่าเข้า แอคชูเอเตอร์ส่งผลออกไปยังโลกจริง"
      - "เกตเวย์อยู่ระหว่างกลุ่มอุปกรณ์ในพื้นที่กับคลาวด์"
    solution: "เซนเซอร์วัดค่า แอคชูเอเตอร์ทำให้เกิดการเปลี่ยนแปลง เกตเวย์เชื่อมอุปกรณ์กับอินเทอร์เน็ต และ MQTT เป็นโพรโทคอลแบบเผยแพร่–บอกรับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.iot.p003
    topics: [computer.systems.iot]
    difficulty: 2
    type: mcq
    stem: "เหตุใด MQTT จึงเหมาะกับอุปกรณ์ IoT มากกว่า HTTP ในหลายกรณี"
    choices:
      - { id: b, text: "MQTT ส่งข้อมูลได้ใหญ่กว่าและช้ากว่าเสมอ", feedback: "ข้อความของ MQTT ออกแบบให้เล็กและเหมาะกับอุปกรณ์ที่มีทรัพยากรจำกัด" }
      - { id: a, text: "ข้อความมีขนาดเล็ก ส่งแบบเผยแพร่–บอกรับ และใช้พลังงานกับแบนด์วิดท์น้อย", correct: true }
      - { id: c, text: "MQTT ไม่ต้องมีการเชื่อมต่อเครือข่ายเลย", feedback: "MQTT ยังต้องใช้เครือข่ายในการส่งข้อความ" }
      - { id: d, text: "MQTT เข้ารหัสข้อมูลอัตโนมัติจนไม่ต้องทำอะไรเพิ่ม", feedback: "MQTT ไม่ได้รับประกันการเข้ารหัสโดยอัตโนมัติ ต้องตั้งค่าและยืนยันตัวตนแยกต่างหาก" }
    hints:
      - "คิดถึงขนาดข้อความและจำนวนทรัพยากรที่อุปกรณ์เล็กมี"
      - "ลองดูว่าแบบเผยแพร่–บอกรับต่างจากถามตอบอย่างไร"
    solution: "MQTT ใช้ข้อความขนาดเล็กและการเผยแพร่–บอกรับผ่านตัวกลาง จึงประหยัดพลังงานและแบนด์วิดท์ ซึ่งเหมาะกับเซนเซอร์ที่ส่งค่าบ่อยแต่เล็ก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.iot.p004
    topics: [computer.systems.iot]
    difficulty: 2
    type: numeric
    stem: "เซนเซอร์ในโรงเรือนผักจำนวน 24 ตัว ส่งค่าทุก 30 วินาที ในหนึ่งชั่วโมงระบบจะได้รับข้อความรวมกี่ข้อความ (ตอบเป็นข้อความ)"
    answer: { value: 2880, unit: ข้อความ }
    hints:
      - "หาจำนวนข้อความต่อเซนเซอร์ต่อหนึ่งนาทีก่อน"
      - "ทุก 30 วินาทีส่งได้ 2 ครั้งในหนึ่งนาที"
      - "คูณจำนวนนาทีในหนึ่งชั่วโมง จำนวนเซนเซอร์ และจำนวนครั้งต่อนาที"
    misconceptions:
      - { match: 1440, feedback: "คิดว่าเซนเซอร์ส่งหนึ่งครั้งต่อนาที แต่โจทย์กำหนดให้ส่งทุก 30 วินาที จึงส่งสองครั้งต่อนาที" }
    solution: "หนึ่งชั่วโมงมี 60 นาที แต่ละนาทีมีการส่ง 2 ครั้งต่อเซนเซอร์ รวม 24 × 2 × 60 = 2,880 ข้อความ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.iot.p005
    topics: [computer.systems.iot]
    difficulty: 2
    type: mcq
    stem: "เกตเวย์ในระบบ IoT ทำหน้าที่สำคัญที่สุดอย่างไร"
    choices:
      - { id: b, text: "ผลิตเซนเซอร์ใหม่ทุกครั้งที่ระบบต้องการ", feedback: "เกตเวย์ไม่ได้ผลิตเซนเซอร์ มันทำหน้าที่เชื่อมและแปลงข้อมูลระหว่างอุปกรณ์กับอินเทอร์เน็ต" }
      - { id: c, text: "เก็บรหัสผ่านทั้งหมดของอุปกรณ์ไว้ในที่สาธารณะ", feedback: "การเก็บรหัสผ่านไว้สาธารณะเป็นการกระทำที่ไม่ปลอดภัย และไม่ใช่หน้าที่ของเกตเวย์" }
      - { id: a, text: "รับข้อมูลจากอุปกรณ์หลายชนิดที่ใช้โพรโทคอลต่างกัน แล้วแปลงและส่งต่อไปยังคลาวด์หรือแอป", correct: true }
      - { id: d, text: "แทนที่อินเทอร์เน็ตทั้งระบบด้วยเครือข่ายภายในห้อง", feedback: "เกตเวย์เชื่อมอุปกรณ์กับอินเทอร์เน็ต ไม่ได้แทนที่อินเทอร์เน็ต" }
    hints:
      - "อุปกรณ์แต่ละชนิดอาจพูดภาษาสื่อสารต่างกัน ใครเป็นคนแปลให้"
      - "เกตเวย์อยู่ตรงกลางระหว่างกลุ่มอุปกรณ์กับคลาวด์"
    solution: "เกตเวย์รวมข้อมูลจากอุปกรณ์หลายชนิด แปลงโพรโทคอลให้เข้ากันแล้วส่งขึ้นคลาวด์ และส่งคำสั่งจากคลาวด์กลับลงมาได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.iot.p006
    topics: [computer.systems.iot]
    difficulty: 2
    type: text
    stem: "การประมวลผลใกล้อุปกรณ์เพื่อลดการส่งข้อมูลขึ้นคลาวด์และลดความหน่วง เรียกว่าอะไร (ตอบเป็นคำไทยหรืออังกฤษ)"
    accepted: ["การประมวลผลที่ขอบเครือข่าย", "ประมวลผลที่ขอบ", "ขอบเครือข่าย", "edge computing", "edge computation"]
    hints:
      - "คำว่า edge แปลว่า ขอบ หรือ ปลาย"
      - "การประมวลผลเกิดที่จุดใกล้ตัวอุปกรณ์มากกว่าที่ศูนย์ข้อมูลไกล ๆ"
    solution: "การประมวลผลที่ขอบเครือข่าย (edge computing) คือการคัดกรองหรือสรุปข้อมูลใกล้อุปกรณ์ ก่อนส่งเฉพาะที่จำเป็นขึ้นคลาวด์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.iot.p007
    topics: [computer.systems.iot]
    difficulty: 2
    type: mcq
    stem: "ความเสี่ยงโดยตรงของการใช้รหัสผ่านเริ่มต้นจากโรงงานในอุปกรณ์ IoT คืออะไร"
    choices:
      - { id: b, text: "อุปกรณ์จะเสียทันทีที่เปิดเครื่องครั้งแรก", feedback: "รหัสผ่านเริ่มต้นไม่ได้ทำให้อุปกรณ์เสียทันที ความเสี่ยงคือการถูกเข้าควบคุม" }
      - { id: c, text: "อุปกรณ์จะเชื่อมต่อเครือข่ายได้เร็วขึ้น", feedback: "รหัสผ่านไม่ได้ทำให้การเชื่อมต่อเร็วขึ้น" }
      - { id: d, text: "อุปกรณ์จะส่งค่าได้ถี่ขึ้นโดยอัตโนมัติ", feedback: "รหัสผ่านไม่ได้เกี่ยวกับความถี่ในการส่งข้อมูล" }
      - { id: a, text: "ผู้โจมตีอาจลองรหัสที่ใช้ทั่วไปแล้วเข้าควบคุมอุปกรณ์ได้โดยไม่ต้องเดา", correct: true }
    hints:
      - "คิดว่ารหัสที่เหมือนกันและไม่มีการเปลี่ยนจะเป็นประโยชน์กับใคร"
      - "ความเสี่ยงสำคัญคือการเข้าถึงโดยไม่ได้รับอนุญาต"
    solution: "รหัสเริ่มต้นที่เหมือนกันทั้งรุ่นหรือทั้งฝูงทำให้ผู้โจมตีลองเข้าได้หลายเครื่องพร้อมกัน จึงต้องเปลี่ยนรหัสทันทีที่ติดตั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.iot.p008
    topics: [computer.systems.iot]
    difficulty: 3
    type: order
    stem: "เรียงลำดับเส้นทางข้อมูลของระบบ IoT ตั้งแต่ต้นจนถึงผู้ใช้ปลายทาง"
    items:
      - "เซนเซอร์วัดค่าอุณหภูมิในโรงเรือน"
      - "อุปกรณ์ส่งค่าผ่านการสื่อสารระยะใกล้ไปยังเกตเวย์"
      - "เกตเวย์ส่งต่อข้อมูลขึ้นคลาวด์ด้วยโพรโทคอลที่เหมาะสม"
      - "แอปของเจ้าของฟาร์มแสดงผลและส่งคำสั่งกลับลงมา"
    hints:
      - "ข้อมูลเริ่มจากการวัดค่าก่อนเสมอ"
      - "คำสั่งจากแอปไปถึงอุปกรณ์ได้ด้วยเส้นทางเดียวกันแต่กลับทิศ"
    solution: "เซนเซอร์วัดค่า ส่งให้เกตเวย์ผ่านการสื่อสารระยะใกล้ เกตเวย์ส่งขึ้นคลาวด์ และแอปแสดงผลหรือส่งคำสั่งกลับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.iot.p009
    topics: [computer.systems.iot]
    difficulty: 3
    type: numeric
    stem: "โรงเรียนมีอุปกรณ์ IoT 500 ตัวที่ใช้รหัสผ่านจากโรงงานชุดเดียวกัน ต้องเปลี่ยนรหัสทีละเครื่อง ใช้เวลาเครื่องละ 3 นาที รวมกันต้องใช้กี่ชั่วโมง (ตอบเป็นชั่วโมง)"
    answer: { value: 25, unit: ชั่วโมง }
    hints:
      - "หาเวลารวมเป็นนาทีก่อน คือ 500 × 3"
      - "แปลงนาทีเป็นชั่วโมงโดยหารด้วย 60"
    misconceptions:
      - { match: 1500, feedback: "นั่นคือเวลารวมเป็นนาที โจทย์ถามเป็นชั่วโมง ต้องหารด้วย 60" }
      - { match: 8.33, feedback: "หารจำนวนเครื่องด้วย 60 โดยไม่ได้คูณด้วยเวลาที่ใช้ต่อเครื่อง" }
    solution: "เวลารวม = 500 × 3 = 1,500 นาที = 1,500 ÷ 60 = 25 ชั่วโมง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.iot.p010
    topics: [computer.systems.iot]
    difficulty: 3
    type: mcq
    stem: "เหตุใดการอัปเดตเฟิร์มแวร์ของอุปกรณ์ IoT จึงสำคัญ"
    choices:
      - { id: a, text: "ช่องโหว่ที่ถูกพบภายหลังมักแก้ได้ด้วยการอัปเดต ถ้าไม่อัปเดต ช่องโหว่นั้นจะยังเปิดอยู่", correct: true }
      - { id: b, text: "การอัปเดตทำให้อุปกรณ์ใช้ไฟน้อยลงเสมอ", feedback: "การอัปเดตไม่ได้ลดการใช้ไฟเสมอไป และนั่นไม่ใช่เหตุผลหลักที่ต้องอัปเดต" }
      - { id: c, text: "การอัปเดตทำให้เปลี่ยนรหัสผ่านโดยไม่ต้องทำอะไร", feedback: "การอัปเดตเฟิร์มแวร์ไม่ได้เปลี่ยนรหัสผ่านให้โดยอัตโนมัติ" }
      - { id: d, text: "การอัปเดตทำให้อุปกรณ์ไม่ต้องต่อเครือข่าย", feedback: "การอัปเดตไม่เกี่ยวกับการยกเลิกการเชื่อมต่อเครือข่าย" }
    hints:
      - "คิดถึงสิ่งที่ผู้พัฒนาทำหลังพบปัญหาในซอฟต์แวร์"
      - "ถ้าอุปกรณ์ยังเป็นเวอร์ชันเก่า ปัญหาที่แก้ไปแล้วจะยังอยู่"
    solution: "ผู้ผลิตมักแก้ช่องโหว่ในเวอร์ชันใหม่ อุปกรณ์ที่ไม่อัปเดตจึงยังเปิดช่องโหว่ไว้ให้ผู้โจมตี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.iot.p011
    topics: [computer.systems.iot]
    difficulty: 3
    type: mcq
    stem: "ข้อใดเป็นการป้องกันบอตเน็ตที่เกี่ยวข้องกับอุปกรณ์ IoT ได้ดีที่สุด"
    choices:
      - { id: b, text: "ปล่อยให้อุปกรณ์ทุกตัวเปิดพอร์ตทั้งหมดไว้เพื่อความสะดวก", feedback: "การเปิดพอร์ตทั้งหมดเพิ่มจุดเข้าให้ผู้โจมตี" }
      - { id: a, text: "เปลี่ยนรหัสผ่าน อัปเดตเฟิร์มแวร์ ปิดบริการที่ไม่จำเป็น และแยกเครือข่ายของอุปกรณ์", correct: true }
      - { id: c, text: "ใช้รหัสผ่านเดียวกันทุกเครื่องเพื่อจำง่าย", feedback: "รหัสเดียวกันทำให้เมื่อหลุดหนึ่งเครื่องเสี่ยงทั้งหมด" }
