rows:
  - { framework: us-ccss-math, indicators: ["A-REI.7"], coverage: full, note: "แก้ระบบเส้นตรงกับพาราโบลาและเส้นตรงกับวงกลม ทั้งด้วยพีชคณิตและกราฟ รวมตัวอย่าง y = −3x กับ x² + y² = 3 ตามตัวชี้วัด" }
  - { framework: us-ccss-math, indicators: ["A-REI.11"], coverage: partial, note: "อธิบายว่าพิกัด x ของจุดตัดเป็นคำตอบของ f(x) = g(x) ประมาณคำตอบด้วยกราฟ ตาราง และการประมาณซ้ำ กับฟังก์ชันเชิงเส้น พหุนาม ค่าสัมบูรณ์ และเลขชี้กำลัง ยังไม่มีฟังก์ชันตรรกยะและลอการิทึม และแอปไม่ได้ให้ใช้โปรแกรมวาดกราฟเอง (มีกราฟโต้ตอบเส้นตรงกับพาราโบลา)" }
