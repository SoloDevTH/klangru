<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="sans-serif">
<title>เวลาฟังที่ปลอดภัยต่อสัปดาห์ตามระดับเสียง (WHO)</title>
<rect x="0" y="0" width="800" height="380" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="400.0" y="28.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">ระดับเสียงยิ่งดัง เวลาฟังที่ปลอดภัยต่อสัปดาห์ยิ่งสั้น</text>
<line x1="150.0" y1="55.0" x2="150.0" y2="300.0" stroke="#ddd" stroke-width="1"/>
<text x="150.0" y="318.0" font-size="11" text-anchor="middle" fill="#444">6 นาที</text>
<line x1="286.7" y1="55.0" x2="286.7" y2="300.0" stroke="#ddd" stroke-width="1"/>
<text x="286.7" y="318.0" font-size="11" text-anchor="middle" fill="#444">1 ชม.</text>
<line x1="423.3" y1="55.0" x2="423.3" y2="300.0" stroke="#ddd" stroke-width="1"/>
<text x="423.3" y="318.0" font-size="11" text-anchor="middle" fill="#444">10 ชม.</text>
<line x1="560.0" y1="55.0" x2="560.0" y2="300.0" stroke="#ddd" stroke-width="1"/>
<text x="560.0" y="318.0" font-size="11" text-anchor="middle" fill="#444">100 ชม.</text>
<text x="355.0" y="340.0" font-size="11" text-anchor="middle" fill="#333">เวลาฟังที่ปลอดภัยต่อสัปดาห์ (สเกลลอการิทึม แต่ละเส้นเพิ่มขึ้น 10 เท่า)</text>
<text x="20.0" y="58.0" font-size="12" text-anchor="start" font-weight="bold" fill="#333">ระดับเสียง</text>
<text x="640.0" y="58.0" font-size="12" text-anchor="start" font-weight="bold" fill="#333">ตัวอย่างเสียง</text>
<text x="20.0" y="96.0" font-size="14" text-anchor="start" font-weight="bold" fill="#111">80 dB</text>
<rect x="150.0" y="75.0" width="355.6" height="30.0" rx="0" fill="#a9dfbf" stroke="#666" stroke-width="1.5"/>
<text x="511.6" y="95.0" font-size="12" text-anchor="start" fill="#222">40 ชั่วโมง</text>
<text x="640.0" y="95.0" font-size="12" text-anchor="start" fill="#333">เสียงกริ่งประตู</text>
<text x="20.0" y="142.0" font-size="14" text-anchor="start" font-weight="bold" fill="#111">85 dB</text>
<rect x="150.0" y="121.0" width="286.6" height="30.0" rx="0" fill="#f9e79f" stroke="#666" stroke-width="1.5"/>
<text x="442.6" y="141.0" font-size="12" text-anchor="start" fill="#222">12 ชั่วโมง 30 นาที</text>
<text x="640.0" y="141.0" font-size="12" text-anchor="start" fill="#333">รถติดหนาแน่น (ในรถ)</text>
<text x="20.0" y="188.0" font-size="14" text-anchor="start" font-weight="bold" fill="#111">90 dB</text>
<rect x="150.0" y="167.0" width="218.9" height="30.0" rx="0" fill="#f8c471" stroke="#666" stroke-width="1.5"/>
<text x="374.9" y="187.0" font-size="12" text-anchor="start" fill="#222">4 ชั่วโมง</text>
<text x="640.0" y="187.0" font-size="12" text-anchor="start" fill="#333">ตะโกนคุยกัน</text>
<text x="20.0" y="234.0" font-size="14" text-anchor="start" font-weight="bold" fill="#111">95 dB</text>
<rect x="150.0" y="213.0" width="149.9" height="30.0" rx="0" fill="#f0b27a" stroke="#666" stroke-width="1.5"/>
<text x="305.9" y="233.0" font-size="12" text-anchor="start" fill="#222">1 ชั่วโมง 15 นาที</text>
<text x="640.0" y="233.0" font-size="12" text-anchor="start" fill="#333">รถจักรยานยนต์</text>
<text x="20.0" y="280.0" font-size="14" text-anchor="start" font-weight="bold" fill="#111">100 dB</text>
<rect x="150.0" y="259.0" width="71.5" height="30.0" rx="0" fill="#ec7063" stroke="#666" stroke-width="1.5"/>
<text x="227.5" y="279.0" font-size="12" text-anchor="start" fill="#222">20 นาที</text>
<text x="640.0" y="279.0" font-size="12" text-anchor="start" fill="#333">ไดร์เป่าผม</text>
<text x="400.0" y="368.0" font-size="11" text-anchor="middle" fill="#555">ที่มา: WHO (ตัวอย่างคำแนะนำ: ตั้งเสียงไม่เกิน 60% ของระดับสูงสุด)</text>
</svg>
