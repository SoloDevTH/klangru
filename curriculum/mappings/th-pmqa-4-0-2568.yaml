# หัวข้อในคลังที่สอนเนื้อหาของประเด็น PMQA 4.0 บางส่วน (คลังยังไม่มีหัวข้อที่สอนเกณฑ์ PMQA โดยตรง)
framework: th-pmqa-4-0-2568
mappings:
  - topic: management.quality.qc-tools
    indicators: ["4.1"]
    coverage: partial
    note: "เก็บข้อมูลด้วยใบตรวจสอบ วิเคราะห์ด้วยพาเรโตและแผนภูมิควบคุม พร้อมตัวอย่างโรงพยาบาลและไปรษณีย์ ยังไม่มีการกำหนดตัววัดระดับยุทธศาสตร์"
  - topic: management.operations.lean
    indicators: ["6.1", "6.2"]
    coverage: partial
    note: "ออกแบบและปรับปรุงกระบวนการตั้งแต่ต้นจนจบด้วยแนวคิดลีน ไคเซ็น และประสิทธิภาพรอบกระบวนการ (ตัวอย่างสำนักงานที่ดินและหน่วยราชการ) ยังไม่มีนวัตกรรมบริการดิจิทัลและการวัดผลกระทบต่อประเทศ"
  - topic: management.operations.maintenance-reliability
    indicators: ["6.3"]
    coverage: partial
    note: การเตรียมรับภาวะฉุกเฉินของหน่วยงานรัฐ (ระบบไฟสำรองศูนย์ข้อมูล) ยังไม่ได้สอนการมุ่งงานที่ส่งผลต่อยุทธศาสตร์ประเทศ
  - topic: management.quality.quality-planning
    indicators: ["3.1", "3.3"]
    coverage: partial
    note: รวบรวมความต้องการของผู้รับบริการและเห็นการเปลี่ยนแปลงตามเวลา (คาโน) แต่ไม่ได้สอนระบบข้อมูลสารสนเทศ
  - topic: management.quality.quality-planning
    indicators: ["3.2"]
    coverage: full
    note: ใช้ความพึงพอใจและข้อร้องเรียนปรับปรุงบริการ และออกแบบบริการเพิ่มสำหรับกลุ่มที่ใช้ไม่ได้ (p011 p015)
  - topic: management.quality.spc
    indicators: ["4.1"]
    coverage: partial
    note: ใช้แผนภูมิ I-MR ติดตามตัวชี้วัดรายเดือนของหน่วยงานรัฐ ยังไม่ได้สอนการเลือกตัววัดระดับยุทธศาสตร์
