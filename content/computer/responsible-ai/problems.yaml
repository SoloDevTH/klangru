  - id: computer.ai.responsible-ai.p017
    topics: [computer.ai.responsible-ai]
    difficulty: 4
    type: code
    stem: "เขียนฟังก์ชัน explain_decision(features, weights) โดย features และ weights เป็นดิกชันนารีที่มีคีย์เดียวกัน ให้คำนวณผลคูณ features[k] × weights[k] ของแต่ละคีย์ แล้วคืนลิสต์ของชื่อคีย์เรียงจากการมีส่วนมากไปน้อย ถ้าเท่ากันเรียงตามชื่อ"
    starter: |
      def explain_decision(features, weights):
          # ตอนนี้คืนชื่อคีย์ตามลำดับเดิมโดยไม่ได้คำนวณ
          return list(features)
    tests: |
      f = {"คะแนนเฉลี่ย": 3, "ระยะทาง": 2, "กิจกรรม": 4}
      w = {"คะแนนเฉลี่ย": 2, "ระยะทาง": -1, "กิจกรรม": 1}
      assert explain_decision(f, w) == ["คะแนนเฉลี่ย", "กิจกรรม", "ระยะทาง"], f"ควรได้ คะแนนเฉลี่ย (6) กิจกรรม (4) ระยะทาง (-2) แต่ได้ {explain_decision(f, w)}"
      assert explain_decision({"a": 1, "b": 1}, {"a": 1, "b": 1}) == ["a", "b"], "ค่าเท่ากันต้องเรียงตามชื่อ"
    reference: |
      def explain_decision(features, weights):
          contrib = {k: features[k] * weights[k] for k in features}
          return sorted(contrib, key=lambda k: (-contrib[k], k))
    hints:
      - "คำนวณการมีส่วนของแต่ละคีย์เป็นผลคูณก่อน แล้วเก็บในดิกชันนารี"
      - "ใช้ sorted กับ key ที่เป็นทูเพิลของค่าติดลบ (เพื่อเรียงมากไปน้อย) และชื่อคีย์"
    solution: "คำนวณผลคูณของแต่ละคีย์ แล้ว sorted โดย key เป็น (-ค่า, ชื่อ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

