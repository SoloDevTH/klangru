problems:
- id: english.grammar.passive-voice.p001
  topics:
  - english.grammar.passive-voice
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็นประโยค **passive**
  choices:
  - id: a
    text: The windows are cleaned every Friday.
    correct: true
    feedback: ถูก are + V3 (cleaned) ประธาน the windows เป็นสิ่งที่ถูกทำความสะอาด
  - id: b
    text: We clean the windows every Friday.
    feedback: ประธาน We เป็นผู้กระทำ เป็น active
  - id: c
    text: The windows are clean.
    feedback: clean ในประโยคนี้เป็นคุณศัพท์ (สะอาด) ไม่ใช่ V3
  - id: d
    text: We are cleaning the windows.
    feedback: are + V-ing เป็น present continuous แบบ active
  hints:
  - passive = be + V3
  - ประธานต้องเป็นสิ่งที่ถูกกระทำ
  solution: '***The windows are cleaned every Friday.***'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.passive-voice.p002
  topics:
  - english.grammar.passive-voice
  difficulty: 1
  type: text
  stem: 'เติม V3 ของ speak: *English is ___ in many countries.*'
  accepted:
  - spoken
  misconceptions:
  - match: spoke
    feedback: 'spoke เป็นช่อง 2 passive ใช้ช่อง 3: spoken'
  - match: speaked
    feedback: speak เป็นกริยาอปกติ V3 คือ spoken
  - match: speaking
    feedback: is speaking เป็น active และไม่มีความหมายในประโยคนี้
  hints:
  - passive = is + V3
  - speak – spoke – ?
  solution: '*English is **spoken** in many countries.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.passive-voice.p003
  topics:
  - english.grammar.passive-voice
  difficulty: 2
  type: text
  stem: 'เติม is หรือ are: *Rice ___ grown in the north-east of Thailand.*'
  accepted:
  - is
  misconceptions:
  - match: are
    feedback: rice เป็นนามนับไม่ได้ ใช้ is
  - match: be
    feedback: ต้องผัน be ให้ตรงกับประธาน
  hints:
  - rice นับได้หรือนับไม่ได้
  - นามนับไม่ได้ใช้ is
  solution: '*Rice **is** grown in the north-east of Thailand.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.passive-voice.p004
  topics:
  - english.grammar.passive-voice
  difficulty: 2
  type: text
  stem: 'เติม was หรือ were: *The Grand Palace in Bangkok ___ built in 1782.*'
  accepted:
  - was
  misconceptions:
  - match: were
    feedback: The Grand Palace เป็นเอกพจน์ ใช้ was
  - match: is
    feedback: 1782 เป็นอดีต ใช้ was
  hints:
  - in 1782 = อดีต
  - ประธานเอกพจน์ ใช้ was
  solution: '*The Grand Palace in Bangkok **was** built in 1782.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.passive-voice.p005
  topics:
  - english.grammar.passive-voice
  difficulty: 2
  type: mcq
  stem: ป้าย *Photography is not allowed.* หมายความว่าอะไร
  choices:
  - id: a
    text: ห้ามถ่ายรูป
    correct: true
    feedback: ถูก is not allowed = ไม่อนุญาต
  - id: b
    text: ถ่ายรูปได้ตามสบาย
    feedback: not allowed แปลว่า ไม่อนุญาต
  - id: c
    text: มีบริการถ่ายรูป
    feedback: ป้ายไม่ได้พูดถึงบริการ
  - id: d
    text: ต้องถ่ายรูปก่อนเข้า
    feedback: not allowed คือห้าม ไม่ใช่ต้องทำ
  hints:
  - allow = อนุญาต
  - is not allowed = ไม่ถูกอนุญาต
  solution: '*Photography **is not allowed**.* = **ห้ามถ่ายรูป**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.passive-voice.p006
  topics:
  - english.grammar.passive-voice
  difficulty: 2
  type: match
  stem: จับคู่ประโยค active กับประโยค passive ที่ความหมายเดียวกัน
  pairs:
  - left: They sell fresh fruit here.
    right: Fresh fruit is sold here.
  - left: They sold the old bus.
    right: The old bus was sold.
  - left: Someone writes the menu every day.
    right: The menu is written every day.
  - left: Someone wrote these letters by hand.
    right: These letters were written by hand.
  hints:
  - 'ดูเวลา: ปัจจุบัน (sell, writes) ใช้ is/are · อดีต (sold, wrote) ใช้ was/were'
  - ดูประธานใหม่ว่าเอกพจน์หรือพหูพจน์
  solution: sell → is sold · sold → was sold · writes → is written · wrote → were written
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.passive-voice.p007
  topics:
  - english.grammar.passive-voice
  difficulty: 3
  type: text
  stem: 'เติมคำหนึ่งคำ: *The Mona Lisa was painted ___ Leonardo da Vinci.*'
  accepted:
  - by
  misconceptions:
  - match: from
    feedback: บอกผู้กระทำใน passive ใช้ by ไม่ใช่ from
  - match: with
    feedback: with บอกเครื่องมือ (with a brush) ผู้กระทำใช้ by
  hints:
  - ใส่ผู้กระทำใน passive ด้วยคำใด
  - be + V3 + ... + ผู้กระทำ
  solution: '*The Mona Lisa was painted **by** Leonardo da Vinci.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.passive-voice.p008
  topics:
  - english.grammar.passive-voice
  difficulty: 3
  type: mcq
  stem: 'เลือกคำที่ถูก: *The thief ___ by the police last night.*'
  choices:
  - id: a
    text: was caught
    correct: true
    feedback: ถูก โจรเป็นผู้ถูกจับ เป็นอดีต (last night) ใช้ was + V3
  - id: b
    text: caught
    feedback: caught แบบ active แปลว่า โจรจับ ... แต่มี by the police แสดงว่าโจรถูกจับ
  - id: c
    text: was catch
    feedback: 'หลัง was ต้องใช้ V3: caught'
  - id: d
    text: is caught
    feedback: last night เป็นอดีต ใช้ was
  hints:
  - ใครจับใคร
  - อดีต + ถูกกระทำ = was/were + V3
  solution: '*The thief **was caught** by the police last night.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.passive-voice.p009
  topics:
  - english.grammar.passive-voice
  difficulty: 3
  type: text
  stem: 'เปลี่ยนเป็น passive แล้วพิมพ์ทั้งประโยค (ไม่ต้องใส่ผู้กระทำ): *They clean the classroom every day.*'
  accepted:
  - The classroom is cleaned every day.
  - The classroom is cleaned every day
  - Every day, the classroom is cleaned.
  - Every day, the classroom is cleaned
  - Every day the classroom is cleaned.
  - Every day the classroom is cleaned
  - The classroom is cleaned every day by them.
  - The classroom is cleaned every day by them
  misconceptions:
  - match: The classroom cleaned every day.
    feedback: ขาด is ภาษาไทยพูดว่า ห้องถูกทำความสะอาด แต่ภาษาอังกฤษต้องมี be
  - match: The classroom is clean every day.
    feedback: 'clean เป็นคุณศัพท์ (สะอาด) ต้องใช้ V3: cleaned'
  - match: The classroom was cleaned every day.
    feedback: ประโยคเดิมเป็นปัจจุบัน (clean) ใช้ is
  - match: The classroom are cleaned every day.
    feedback: the classroom เป็นเอกพจน์ ใช้ is
  hints:
  - กรรม the classroom ไปเป็นประธาน
  - ปัจจุบัน + เอกพจน์ → is + V3
  solution: '***The classroom is cleaned every day.***'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.passive-voice.p010
  topics:
  - english.grammar.passive-voice
  difficulty: 3
  type: numeric
  stem: ดูฉลากยาสมมุติ เด็กอายุ 8 ขวบต้องกินยานี้วันละกี่มิลลิลิตร
  figure: &id001
    src: notice-label.svg
    alt: 'ภาพสองส่วน ซ้ายเป็นป้าย CITY MUSEUM Visitor Information: Tickets: 80 baht. / Children under 12 are admitted free. / Bags must be left at the counter. / Tickets are checked at the gate. / Photography is not allowed in Room 3. / The museum is closed on Mondays. ขวาเป็นฉลากยา COUGH SYRUP X (60 ml) เขียนว่า ยาสมมุติ ไม่ใช่ยาจริง: This medicine should be taken three times a day after meals. Adults: 10 ml each time. Children 6–12 years: 5 ml each time. Must not be given to children under 6 years old. Must be kept below 30 °C. Ask a pharmacist if you are not sure.'
  answer:
    value: 15
    tolerance: 0
    unit: ml
  misconceptions:
  - match: 5
    feedback: 5 ml คือครั้งเดียว ฉลากบอกว่ากินวันละสามครั้ง
  - match: 30
    feedback: 30 ml เป็นขนาดของผู้ใหญ่ (10 ml × 3)
  - match: 10
    feedback: 10 ml เป็นขนาดต่อครั้งของผู้ใหญ่
  hints:
  - อ่านบรรทัด Children 6–12 years และ should be taken three times a day
  - ขนาดต่อครั้ง × จำนวนครั้งต่อวัน
  solution: 'เด็ก 6–12 ปี กินครั้งละ 5 ml วันละ 3 ครั้ง: 5 × 3 = **15 ml ต่อวัน** (ยาสมมุติ เรื่องยาจริงให้ถามเภสัชกร)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.passive-voice.p011
  topics:
  - english.grammar.passive-voice
  difficulty: 3
  type: mcq
  stem: ที่วัดมีป้าย *Shoes must be removed before entering the main hall.* ผู้มาเยือนต้องทำอะไร
  choices:
  - id: a
    text: ถอดรองเท้าก่อนเข้าพระอุโบสถ
    correct: true
    feedback: ถูก must be removed = ต้องถูกถอดออก
  - id: b
    text: ซื้อรองเท้าก่อนเข้า
    feedback: remove แปลว่า ถอด เอาออก ไม่ใช่ซื้อ
  - id: c
    text: ใส่รองเท้าเข้าไปได้
    feedback: must be removed บอกว่าต้องถอด
  - id: d
    text: ฝากรองเท้าไว้ที่บ้าน
    feedback: ป้ายบอกให้ถอดก่อนเข้า ไม่ได้บอกให้ทิ้งไว้ที่บ้าน
  hints:
  - remove = ถอด เอาออก
  - must be + V3 = ต้องถูก...
  solution: '*Shoes **must be removed** before entering.* = ต้อง **ถอดรองเท้า** ก่อนเข้า'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.passive-voice.p012
  topics:
  - english.grammar.passive-voice
  difficulty: 4
  type: text
  stem: 'เปลี่ยนเป็น passive แล้วพิมพ์ทั้งประโยค (ไม่ต้องใส่ผู้กระทำ): *Somebody stole my bike yesterday.*'
  accepted:
  - My bike was stolen yesterday.
  - My bike was stolen yesterday
  - Yesterday, my bike was stolen.
  - Yesterday, my bike was stolen
  - Yesterday my bike was stolen.
  - Yesterday my bike was stolen
  - My bike was stolen yesterday by somebody.
  - My bike was stolen yesterday by somebody
  - My bike was stolen by somebody yesterday.
  - My bike was stolen by somebody yesterday
  misconceptions:
  - match: My bike was stole yesterday.
    feedback: 'stole เป็นช่อง 2 passive ใช้ V3: stolen'
  - match: My bike is stolen yesterday.
    feedback: yesterday เป็นอดีต ใช้ was
  - match: My bike stolen yesterday.
    feedback: ขาด was
  - match: My bike was stealed yesterday.
    feedback: steal เป็นกริยาอปกติ V3 คือ stolen
  hints:
  - กรรม my bike ไปเป็นประธาน ไม่รู้ว่าใครขโมยจึงตัด somebody ทิ้ง
  - อดีต + เอกพจน์ → was + V3 (steal – stole – stolen)
  solution: '***My bike was stolen yesterday.***'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.passive-voice.p013
  topics:
  - english.grammar.passive-voice
  difficulty: 4
  type: text
  stem: 'เติมกริยา allow ในรูปปฏิเสธของ passive (สามคำหรือสองคำถ้าใช้รูปย่อ): *Food ___ in the library.*'
  accepted:
  - is not allowed
  - isn't allowed
  misconceptions:
  - match: not allowed
    feedback: ขาด is
  - match: does not allowed
    feedback: passive ใช้ be ไม่ใช้ do
  - match: doesn't allowed
    feedback: passive ใช้ be ไม่ใช้ do
  - match: is not allow
    feedback: 'หลัง is ต้องใช้ V3: allowed'
  - match: are not allowed
    feedback: food เป็นนามนับไม่ได้ ใช้ is
  hints:
  - passive ปฏิเสธ = is not + V3
  - food นับไม่ได้ ใช้ is
  solution: '*Food **is not allowed** in the library.* (หรือ *isn''t allowed*)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.passive-voice.p014
  topics:
  - english.grammar.passive-voice
  difficulty: 4
  type: numeric
  stem: ดูป้ายพิพิธภัณฑ์ ครอบครัวหนึ่งมีพ่อ แม่ ลูกอายุ 8 ขวบ และลูกอายุ 14 ปี ต้องจ่ายค่าตั๋วรวมกี่บาท
  figure: *id001
  answer:
    value: 240
    tolerance: 0
    unit: บาท
  misconceptions:
  - match: 160
    feedback: เด็กอายุ 14 ปีไม่ได้อยู่ในกลุ่ม under 12 จึงต้องจ่ายด้วย
  - match: 320
    feedback: เด็กอายุ 8 ขวบเข้าฟรี (Children under 12 are admitted free)
  hints:
  - Children under 12 are admitted free = เด็กอายุต่ำกว่า 12 เข้าฟรี
  - นับคนที่ต้องจ่าย แล้วคูณ 80
  solution: 'ลูก 8 ขวบเข้าฟรี ต้องจ่าย 3 คน (พ่อ แม่ ลูก 14 ปี): 3 × 80 = **240 บาท**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.passive-voice.p015
  topics:
  - english.grammar.passive-voice
  difficulty: 4
  type: order
  stem: เรียงเป็นคำถาม passive
  items:
  - Was
  - this temple
  - built
  - in the Ayutthaya period?
  hints:
  - 'คำถาม passive อดีต: Was + ประธาน + V3'
  - ส่วนที่มี ? อยู่ท้าย
  solution: '*Was this temple built in the Ayutthaya period?*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.passive-voice.p016
  topics:
  - english.grammar.passive-voice
  difficulty: 4
  type: mcq
  stem: ดูป้ายพิพิธภัณฑ์ ข้อใด **ถูก** ตามป้าย
  figure: *id001
  choices:
  - id: a
    text: You must leave your bag at the counter.
    correct: true
    feedback: ถูก ป้ายเขียน Bags must be left at the counter.
  - id: b
    text: You can take photos in Room 3.
    feedback: Photography is not allowed in Room 3 = ห้ามถ่ายรูปในห้อง 3
  - id: c
    text: Children under 12 pay 80 baht.
    feedback: Children under 12 are admitted free = เข้าฟรี
  - id: d
    text: You can visit on Monday.
    feedback: The museum is closed on Mondays
  hints:
  - อ่านป้ายทีละบรรทัดแล้วเปลี่ยนเป็นภาษาของเรา
  - must be left = ต้องฝากไว้ · is not allowed = ห้าม · is closed = ปิด
  solution: '***You must leave your bag at the counter.*** ตรงกับ *Bags must be left at the counter.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.passive-voice.p017
  topics:
  - english.grammar.passive-voice
  difficulty: 5
  type: text
  stem: 'เปลี่ยนเป็น passive แล้วพิมพ์ทั้งประโยค: *You must keep this medicine in the fridge.*'
  accepted:
  - This medicine must be kept in the fridge.
  - This medicine must be kept in the fridge
  misconceptions:
  - match: This medicine must kept in the fridge.
    feedback: หลัง must ต้องมี be ก่อน V3
  - match: This medicine must be keep in the fridge.
    feedback: 'หลัง must be ใช้ V3: kept'
  - match: This medicine must be keeped in the fridge.
    feedback: keep เป็นกริยาอปกติ V3 คือ kept
  - match: This medicine is kept in the fridge.
    feedback: 'ประโยคเดิมมี must ต้องคงไว้: must be kept'
  hints:
  - กรรม this medicine ไปเป็นประธาน
  - modal + be + V3 (keep – kept – kept)
  solution: '***This medicine must be kept in the fridge.***'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.passive-voice.p018
  topics:
  - english.grammar.passive-voice
  difficulty: 5
  type: mcq
  stem: ข้อใด **ถูกต้อง**
  choices:
  - id: a
    text: The accident happened on the main road last night.
    correct: true
    feedback: ถูก happen ไม่มีกรรม จึงใช้ passive ไม่ได้
  - id: b
    text: The accident was happened on the main road last night.
    feedback: happen เป็นกริยาที่ไม่มีกรรม ไม่มีรูป passive
  - id: c
    text: The accident is happened on the main road last night.
    feedback: happen ไม่มีรูป passive และ last night เป็นอดีต
  - id: d
    text: The accident was happen on the main road last night.
    feedback: happen ไม่มีรูป passive และไม่ใช้ was หน้ากริยาช่อง 1
  hints:
  - passive ใช้ได้เฉพาะกริยาที่มีกรรม
  - happen, arrive, die ไม่มีกรรม
  solution: '***The accident happened on the main road last night.***'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.passive-voice.p019
  topics:
  - english.grammar.passive-voice
  difficulty: 5
  type: numeric
  stem: ดูฉลากยาสมมุติ ยาขวดนี้มี 60 ml ถ้าเด็กอายุ 10 ขวบกินตามฉลาก ยาจะหมดในกี่วัน
  figure: *id001
  answer:
    value: 4
    tolerance: 0
    unit: วัน
  misconceptions:
  - match: 12
    feedback: 60 ÷ 5 = 12 คือจำนวนครั้ง ไม่ใช่จำนวนวัน ต้องหารด้วยปริมาณต่อวัน
  - match: 2
    feedback: 60 ÷ 30 = 2 ใช้ขนาดของผู้ใหญ่ เด็ก 10 ขวบใช้ 5 ml ต่อครั้ง
  hints:
  - หาปริมาณต่อวันของเด็ก 6–12 ปีก่อน
  - ปริมาณทั้งขวด ÷ ปริมาณต่อวัน
  solution: เด็กกินวันละ 5 × 3 = 15 ml ยา 60 ml หมดใน 60 ÷ 15 = **4 วัน** (ยาสมมุติ เรื่องยาจริงให้ถามเภสัชกร)
  license: CC-BY-SA-4.0
  ai_assisted: true
