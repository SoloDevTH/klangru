id: health.substances.drugs-prevention
subject: health
title: { th: "สารเสพติด: โทษ ปัจจัย และการป้องกัน", en: "Drugs: harms, risk factors and prevention" }
summary: สารเสพติดและสารอันตรายใกล้ตัว โทษต่อร่างกาย จิตใจ อารมณ์ สังคม และสติปัญญา ความเกี่ยวข้องกับโรคและอุบัติเหตุ ปัจจัยเสี่ยงและปัจจัยปกป้อง สัญญาณของการติด กฎหมายไทย และสายด่วน 1165
difficulty: 3.5
minutes: 35
prerequisites: [health.substances.tobacco-alcohol]
encompasses:
  - { id: health.substances.tobacco-alcohol, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ผลกระทบ 5 ด้าน
    src: harm-dimensions.svg
    alt: "แผนภาพวงกลมกลางเขียนว่าการใช้สารเสพติด มีลูกศรชี้ไปห้ากล่อง ร่างกาย หัวใจเต้นผิดจังหวะ น้ำหนักลด นอนไม่หลับ เสี่ยงติดเชื้อ อุบัติเหตุ จิตใจ ระแวง หูแว่ว ภาพหลอน อยากใช้ซ้ำจนควบคุมไม่ได้ อารมณ์ หงุดหงิด ก้าวร้าว วิตกกังวล ซึมเศร้า สังคม เสียการเรียน งาน และเงิน ครอบครัวทุกข์ ปัญหากฎหมาย สติปัญญา ความจำ สมาธิ การตัดสินใจแย่ลง สมองวัยรุ่นได้รับผลมาก"
  - type: figure
    title: ปัจจัยเสี่ยงกับปัจจัยปกป้อง
    src: risk-protective.svg
    alt: "ภาพตาชั่งกระดานหก ฝั่งซ้ายยกสูงคือปัจจัยเสี่ยง อยากรู้อยากลอง เพื่อนชวนหรือกดดัน เครียด มีปัญหาครอบครัว เข้าใจผิดว่าไม่อันตราย หาซื้อง่าย สื่อทำให้ดูเท่ ฝั่งขวาหนักกว่าคือปัจจัยปกป้อง ครอบครัวอบอุ่น คุยกันได้ เพื่อนที่ดี กิจกรรม กีฬา งานอดิเรก รู้ข้อเท็จจริง ทักษะปฏิเสธ จัดการความเครียด ใต้ภาพเขียนว่ายิ่งมีปัจจัยปกป้องมาก ความเสี่ยงยิ่งลดลง"
  - type: worked-example
    title: วิเคราะห์ผลกระทบให้ครบ 5 ด้าน
    problem: "ข่าวเล่าว่าชายวัยรุ่นคนหนึ่งใช้ยาบ้ามาหลายเดือน นอนไม่หลับ น้ำหนักลด ระแวงว่ามีคนจะทำร้าย หงุดหงิดจนทะเลาะกับแม่ ขาดเรียนจนถูกพักการเรียน และจำบทเรียนไม่ได้ จัดผลกระทบตามด้านต่าง ๆ"
    steps:
      - text: "ร่างกาย: นอนไม่หลับ น้ำหนักลด"
      - text: "จิตใจ: ระแวงว่ามีคนจะทำร้าย อารมณ์: หงุดหงิด"
        why: "จิตใจเกี่ยวกับความคิดและการรับรู้ ส่วนอารมณ์เกี่ยวกับความรู้สึกที่แสดงออก"
      - text: "สังคม: ทะเลาะกับแม่ ถูกพักการเรียน"
      - text: "สติปัญญา: จำบทเรียนไม่ได้"
      - text: "ทางออก: การติดเป็นโรคที่รักษาได้ ครอบครัวปรึกษาสายด่วน 1165 หรือโรงพยาบาลของรัฐ"
    answer: "ได้ครบทั้ง 5 ด้าน แสดงว่าสารเสพติดกระทบทุกด้านของชีวิต และควรพาเข้าสู่การบำบัด"
  - { type: check, problem: health.substances.drugs-prevention.p004, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: worked-example
    title: เพิ่มปัจจัยปกป้องให้ตัวเอง
    problem: "มายด์ อายุ 13 ปี เพิ่งย้ายมาอยู่กับป้าในอำเภอใหม่ ยังไม่มีเพื่อน และเครียดเรื่องเรียน มีกลุ่มวัยรุ่นในซอยชวนไปนั่งเล่นตอนกลางคืน มายด์จะลดความเสี่ยงได้อย่างไร"
    steps:
      - text: "ระบุปัจจัยเสี่ยง: ไม่มีเพื่อน เครียด และมีคนชวนออกไปตอนกลางคืน"
      - text: "เพิ่มปัจจัยปกป้องด้านเพื่อนและกิจกรรม: สมัครชมรมหรือกีฬาที่โรงเรียน"
        why: "กิจกรรมที่ชอบทำให้มีเพื่อนกลุ่มใหม่และใช้เวลาว่างอย่างปลอดภัย"
      - text: "เพิ่มปัจจัยปกป้องด้านครอบครัว: เล่าเรื่องความเครียดให้ป้าฟัง และตกลงเวลากลับบ้าน"
      - text: "เตรียมทักษะปฏิเสธ: \"ไม่ไปนะ ป้ารออยู่ ไว้เจอกันที่สนามบอลตอนเย็น\""
    answer: "ลดปัจจัยเสี่ยงและเพิ่มปัจจัยปกป้องทั้งด้านเพื่อน กิจกรรม ครอบครัว และทักษะปฏิเสธ"
  - { type: check, problem: health.substances.drugs-prevention.p010 }
glossary:
  - { term: สารเสพติด, definition: "สารที่ทำให้ร่างกายและจิตใจต้องการซ้ำ ต้องเพิ่มปริมาณขึ้น เกิดอาการขาดยาเมื่อหยุด และทำให้สุขภาพเสื่อม" }
  - { term: อาการขาดยา, definition: "อาการผิดปกติทางร่างกายและจิตใจเมื่อหยุดใช้สารเสพติดที่ใช้มานาน" }
  - { term: ปัจจัยปกป้อง, definition: "สิ่งที่ช่วยลดโอกาสใช้สารเสพติด เช่น ครอบครัวอบอุ่น เพื่อนที่ดี กิจกรรมที่ชอบ และทักษะปฏิเสธ" }
  - { term: สมุนไพรควบคุม, definition: "สมุนไพรที่กฎหมายกำหนดให้การศึกษาวิจัย ส่งออก จำหน่าย หรือแปรรูปเพื่อการค้าต้องได้รับอนุญาต ช่อดอกกัญชาเป็นสมุนไพรควบคุมตั้งแต่ 26 มิ.ย. 2568" }
flashcards:
  - { front: "สายด่วนบำบัดยาเสพติด", back: "1165 (สบยช.) 24 ชั่วโมง ถ้าหมดสติหรือหายใจผิดปกติ โทร 1669" }
  - { front: "กัญชาตามกฎหมายไทย (ข้อมูล ณ ต.ค. 2569)", back: "ช่อดอกเป็นสมุนไพรควบคุม ขายได้เฉพาะผู้มีใบอนุญาตให้ผู้มีใบสั่งจ่าย สารสกัด THC เกินร้อยละ 0.2 เป็นยาเสพติดประเภท 5" }
  - { front: "สารระเหย (กาว ทินเนอร์ สเปรย์)", back: "กดประสาท อาจทำให้หัวใจเต้นผิดจังหวะจนเสียชีวิตได้แม้ใช้ครั้งเดียว" }
  - { front: "การติดสารเสพติด", back: "โรคเรื้อรังของสมองที่รักษาได้ ไม่ใช่เรื่องนิสัยไม่ดี การตีตราทำให้คนไม่กล้าขอความช่วยเหลือ" }
