      - { match: 3, feedback: "นับเฉพาะการเลื่อนตัว (ตัวซ้ายมากกว่า) ต้องนับการเทียบที่ทำให้หยุดด้วย" }
    solution: "i=1 แทรก 1: เทียบ 3 (เลื่อน) แล้ว j หลุดต้นลิสต์ = 1 ครั้ง ได้ [1, 3, 2, 5, 4] i=2 แทรก 2: เทียบ 3 (เลื่อน) เทียบ 1 (หยุด) = 2 ครั้ง i=3 แทรก 5: เทียบ 3 (หยุด) = 1 ครั้ง i=4 แทรก 4: เทียบ 5 (เลื่อน) เทียบ 3 (หยุด) = 2 ครั้ง รวม 6 ครั้ง"
