id: english.vocabulary.classroom-language
subject: english
title: { th: "ภาษาในห้องเรียน: คำสั่งและคำขอร้อง", en: "Classroom language: instructions and requests" }
summary: เข้าใจและทำตามคำสั่งในห้องเรียน เช่น Stand up. Open your book. ใช้ Don't และ please และพูดขออนุญาตหรือขอความช่วยเหลือจากครูได้
difficulty: 1
minutes: 25
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - type: figure
    src: classroom-commands.svg
    alt: "ภาพตัวการ์ตูนเส้น 4 ช่อง ช่องที่ 1 Stand up. ลุกขึ้นยืน: คนยืนข้างเก้าอี้ มีลูกศรชี้ขึ้น ช่องที่ 2 Sit down. นั่งลง: คนนั่งบนเก้าอี้ ช่องที่ 3 Raise your hand. ยกมือ: คนยืนยกแขนขึ้นสูง ช่องที่ 4 Open your book. เปิดหนังสือ: คนยืนถือหนังสือที่เปิดอยู่"
    caption: "คำสั่งในห้องเรียนขึ้นต้นด้วยคำกริยา ฟังแล้วทำตามได้ทันที"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.vocabulary.classroom-language.p001, prompt: "ฟังคำกริยาในคำสั่ง แล้วนึกภาพท่าทาง" }
  - type: worked-example
    title: เปลี่ยนคำพูดภาษาไทยเป็นคำขอร้อง
    problem: "อยากบอกเพื่อนเป็นภาษาอังกฤษว่า \"ปิดหน้าต่างหน่อยนะ\""
    steps:
      - text: "หาคำกริยา: ปิด (หน้าต่าง ประตู หนังสือ) ใช้ **close**"
        why: "หน้าต่างเป็นสิ่งที่เปิดปิดได้จริง จึงใช้ close ส่วนไฟและพัดลมใช้ turn off"
      - text: "ประโยคคำสั่งขึ้นต้นด้วยกริยารูปเดิมเลย: *Close the window.*"
      - text: "เติม please ให้สุภาพ วางหน้าหรือท้ายประโยคก็ได้"
    answer: "*Please close the window.* หรือ *Close the window, please.*"
  - type: worked-example
    title: เปลี่ยนคำสั่งเป็นคำสั่งห้าม
    problem: "ป้ายในห้องสมุดเขียนว่า *Talk quietly.* ถ้าครูอยากบอกว่า \"อย่ากินขนมในห้องสมุด\" จะพูดอย่างไร"
    steps:
      - text: "คำกริยาคือ กิน = eat ส่วนที่เหลือคือ ขนม = snacks และ ในห้องสมุด = in the library"
      - text: "คำสั่งห้ามใส่ **Don't** ไว้หน้าคำกริยา"
        why: "ภาษาอังกฤษไม่ใช้ No + กริยา แบบ \"ห้ามกิน\" ในภาษาไทย"
      - text: "กริยาหลัง Don't ใช้รูปเดิม"
    answer: "*Don't eat snacks in the library.*"
  - { type: check, problem: english.vocabulary.classroom-language.p010, prompt: "คำกริยาใดใช้กับการดู" }
glossary:
  - { term: ประโยคคำสั่ง (imperative), definition: "ประโยคที่ขึ้นต้นด้วยคำกริยารูปเดิม ไม่มีประธาน ใช้บอกให้คนฟังทำ เช่น Sit down." }
  - { term: Don't, definition: "ย่อมาจาก do not วางหน้าคำกริยาเพื่อบอกว่าอย่าทำ เช่น Don't run." }
  - { term: please, definition: "คำที่ทำให้คำสั่งสุภาพขึ้น วางหน้าหรือท้ายประโยค เช่น Please sit down." }
  - { term: คำขอร้อง (request), definition: "การขอให้ผู้อื่นช่วยทำอย่างสุภาพ เช่น Can you help me, please?" }
flashcards:
  - { front: "ประโยคคำสั่งขึ้นต้นด้วยอะไร", back: "ขึ้นต้นด้วยคำกริยารูปเดิม เช่น Open your book." }
  - { front: "\"อย่าวิ่ง\" ภาษาอังกฤษพูดว่าอย่างไร", back: "Don't run. (ไม่ใช่ No run.)" }
  - { front: "\"ปิดไฟหน่อย\" ภาษาอังกฤษใช้กริยาอะไร", back: "turn off: Turn off the light, please. (ไม่ใช่ close the light)" }
  - { front: "อยากไปห้องน้ำ ขออนุญาตครูอย่างไร", back: "May I go to the toilet, please?" }
  - { front: "ไม่เข้าใจที่ครูพูด ขอให้ครูพูดอีกครั้งอย่างไร", back: "Sorry, I don't understand. Can you say that again, please?" }
