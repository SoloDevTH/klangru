problems:
  - id: math.stats.discrete-distributions.p001
    topics: [math.stats.discrete-distributions]
    difficulty: 1
    type: numeric
    stem: "ทดลองซ้ำอย่างอิสระ โดยแต่ละครั้งสำเร็จด้วยความน่าจะเป็น $0.2$ จงหาความน่าจะเป็นที่การสำเร็จครั้งแรกเกิดขึ้นที่ครั้งที่ 4 (ตอบทศนิยม 4 ตำแหน่ง)"
    answer: { value: 0.1024, tolerance: 0.0005 }
    hints:
      - "ก่อนครั้งที่ 4 ต้องพลาดกี่ครั้งติดกัน และครั้งที่ 4 ต้องเป็นอย่างไร"
      - "ความน่าจะเป็นของการพลาดหนึ่งครั้งคือ $1-0.2$ ส่วนการสำเร็จหนึ่งครั้งคือ $0.2$"
      - "ใช้สูตร $P(X=k)=(1-p)^{k-1}p$ โดยแทน $p=0.2$ และ $k=4$"
    misconceptions:
      - { match: 0.4096, feedback: "0.4096 คือความน่าจะเป็นที่สำเร็จหนึ่งครั้งจากสี่ครั้ง (การแจกแจงทวินาม) โจทย์ถามว่าครั้งแรกที่สำเร็จคือครั้งที่ 4 จึงต้องพลาดสามครั้งแรกก่อน" }
      - { match: 0.08192, feedback: "ยกกำลังผิด: ต้องพลาดสามครั้งก่อน จึงใช้ $0.8$ ยกกำลัง $3$ ไม่ใช่ยกกำลัง $4$" }
    solution: "$P(X=4)=(1-0.2)^{3}\\cdot 0.2 = 0.8^3\\cdot 0.2 = 0.512\\cdot 0.2 = 0.1024$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.discrete-distributions.p002
    topics: [math.stats.discrete-distributions]
    difficulty: 1
    type: mcq
    stem: "การแจกแจงแบบใดใช้นับจำนวนครั้งที่ต้องทดลองซ้ำอย่างอิสระจนได้ผลสำเร็จครั้งแรก"
    choices:
      - { id: a, text: "ทวินาม", feedback: "ทวินามนับจำนวนครั้งที่สำเร็จในจำนวนครั้งที่ทดลองไว้ล่วงหน้า ไม่ได้หยุดเมื่อสำเร็จครั้งแรก" }
      - { id: b, text: "เรขาคณิต", correct: true }
      - { id: c, text: "ไฮเปอร์จีโอเมตริก", feedback: "ไฮเปอร์จีโอเมตริกใช้กับการหยิบโดยไม่ใส่คืนจากประชากรที่มีสองประเภท" }
      - { id: d, text: "ปกติ", feedback: "การแจกแจงปกติเป็นตัวแปรต่อเนื่อง ไม่ได้นับจำนวนครั้ง" }
    hints:
      - "ดูว่าโจทย์ให้นับอะไร จำนวนครั้งทั้งหมดจนถึงครั้งแรก หรือจำนวนครั้งที่สำเร็จในจำนวนครั้งที่กำหนด"
      - "คำว่า 'ครั้งแรก' บอกว่าการทดลองหยุดเมื่อใด"
    solution: "การแจกแจงเรขาคณิตนับจำนวนครั้งจนสำเร็จครั้งแรก ค่าที่เป็นไปได้คือ 1, 2, 3, ... จึงตรงกับโจทย์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.discrete-distributions.p003
    topics: [math.stats.discrete-distributions]
    difficulty: 2
    type: numeric
    stem: "เครื่องจักรผลิตชิ้นงาน แต่ละชิ้นเสียด้วยความน่าจะเป็น $0.25$ อย่างอิสระ ตรวจทีละชิ้นจนพบชิ้นเสียชิ้นแรก โดยเฉลี่ยต้องตรวจทั้งหมดกี่ชิ้น (ตอบจำนวนเต็ม)"
    answer: { value: 4, tolerance: 0 }
    hints:
      - "ค่าเฉลี่ยของการแจกแจงเรขาคณิตมีสูตรง่าย ๆ ที่เกี่ยวข้องกับ $p$ เพียงตัวเดียว"
      - "โอกาสเจอชิ้นเสียในแต่ละครั้งคือ $0.25$ ลองนึกว่าโดยเฉลี่ยต้องลองกี่ครั้งจึงจะเจอ"
      - "ใช้ $E(X)=\\frac{1}{p}$ โดยแทน $p=0.25$"
    misconceptions:
      - { match: 3, feedback: "3 คือ $\\frac{1-p}{p}$ ซึ่งนับเฉพาะชิ้นดีที่ตรวจก่อนพบชิ้นเสีย แต่โจทย์นับทุกชิ้นที่ตรวจ รวมชิ้นเสียชิ้นสุดท้ายด้วย" }
    solution: "$E(X)=\\frac{1}{p}=\\frac{1}{0.25}=4$ ชิ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.discrete-distributions.p004
    topics: [math.stats.discrete-distributions]
    difficulty: 2
    type: numeric
    stem: "ทดลองซ้ำอย่างอิสระ โดยแต่ละครั้งสำเร็จด้วยความน่าจะเป็น $0.2$ จงหาความน่าจะเป็นที่การสำเร็จครั้งแรกเกิดขึ้นภายในสามครั้งแรก นั่นคือ $P(X \\le 3)$ (ตอบทศนิยม 3 ตำแหน่ง)"
    answer: { value: 0.488, tolerance: 0.0005 }
    hints:
      - "$P(X \\le 3)$ รวมค่า $k=1,2,3$ หรือคิดจากเหตุการณ์ตรงข้ามก็ได้"
      - "เหตุการณ์ตรงข้ามคือพลาดทั้งสามครั้งแรก ซึ่งมีความน่าจะเป็น $(1-p)^3$"
      - "ใช้ $P(X \\le 3)=1-(1-p)^3$ โดยแทน $p=0.2$"
    misconceptions:
      - { match: 0.128, feedback: "0.128 คือ $P(X=3)$ เท่านั้น โจทย์ถาม $P(X \\le 3)$ ต้องรวมความน่าจะเป็นของ $k=1,2,3$ หรือคิดจากเหตุการณ์ตรงข้าม" }
      - { match: 0.512, feedback: "0.512 คือ $0.8^3$ ซึ่งเป็นความน่าจะเป็นที่พลาดสามครั้งแรก ไม่ใช่ความน่าจะเป็นที่สำเร็จภายในสามครั้ง" }
    solution: "$P(X\\le 3)=1-(1-0.2)^3=1-0.512=0.488$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.discrete-distributions.p005
    topics: [math.stats.discrete-distributions]
    difficulty: 3
    type: numeric
    stem: "ทดลองซ้ำอย่างอิสระ โดยแต่ละครั้งสำเร็จด้วยความน่าจะเป็น $0.2$ ทราบแล้วว่าสองครั้งแรกยังไม่สำเร็จ จงหาความน่าจะเป็นที่ต้องทดลองมากกว่า 5 ครั้ง จึงจะสำเร็จ นั่นคือ $P(X>5 \\mid X>2)$ (ตอบทศนิยม 3 ตำแหน่ง)"
    answer: { value: 0.512, tolerance: 0.0005 }
    hints:
      - "เงื่อนไข $X>2$ บอกว่าสองครั้งแรกพลาดแล้ว สิ่งที่ต้องคิดคือหลังจากนั้น"
      - "เขียน $P(X>5 \\mid X>2)=\\frac{P(X>5)}{P(X>2)}$ และจำว่า $P(X>n)=(1-p)^n$"
      - "ลองคำนวณ $\\frac{(0.8)^5}{(0.8)^2}$ แล้วลดรูป"
    misconceptions:
      - { match: 0.32768, feedback: "0.32768 คือ $P(X>5)$ โดยไม่ใช้เงื่อนไข ต้องหารด้วย $P(X>2)=0.8^2$ เพราะรู้แล้วว่าสองครั้งแรกพลาด" }
    solution: "$P(X>5\\mid X>2)=\\frac{P(X>5)}{P(X>2)}=\\frac{0.8^5}{0.8^2}=0.8^3=0.512$ ซึ่งเท่ากับ $P(X>3)$ ตามสมบัติไม่มีความจำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.discrete-distributions.p006
    topics: [math.stats.discrete-distributions]
    difficulty: 3
    type: numeric
    stem: "ทดลองซ้ำอย่างอิสระ โดยแต่ละครั้งสำเร็จด้วยความน่าจะเป็น $0.2$ จำนวนครั้งที่ทดลองจนได้สำเร็จครั้งแรกมีความแปรปรวนเท่ากับเท่าไร (ตอบจำนวนเต็ม)"
    answer: { value: 20, tolerance: 0 }
    hints:
      - "สูตรความแปรปรวนของการแจกแจงเรขาคณิตมี $p$ อยู่ในตัวส่วนยกกำลังสอง"
      - "ใช้ $\\mathrm{Var}(X)=\\frac{1-p}{p^2}$ แล้วแทน $p=0.2$"
      - "ตรวจว่าตัวส่วนเป็น $0.2^2=0.04$ ไม่ใช่ $0.2$"
    misconceptions:
      - { match: 4, feedback: "4 คือ $\\frac{1-p}{p}$ ซึ่งลืมยกกำลังสองของ $p$ ที่ตัวส่วน" }
      - { match: 5, feedback: "5 คือค่าเฉลี่ย $\\frac{1}{p}$ ไม่ใช่ความแปรปรวน" }
    solution: "$\\mathrm{Var}(X)=\\frac{1-p}{p^2}=\\frac{0.8}{0.04}=20$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.discrete-distributions.p007
    topics: [math.stats.discrete-distributions]
    difficulty: 3
    type: expression
    stem: "สำหรับการแจกแจงเรขาคณิตที่มีความน่าจะเป็นสำเร็จ $p$ จงเขียนสูตร $P(X=k)$ ในรูปนิพจน์ของ $p$ และ $k$"
    prefix: "P(X=k) ="
    answer: { latex: "p\\cdot(1-p)^{k-1}", variables: [p, k] }
    misconceptions:
      - { match: "(1-p)^{k}\\cdot p", feedback: "ยกกำลังเกินไปหนึ่ง: ต้องพลาดเพียง $k-1$ ครั้งก่อนสำเร็จครั้งที่ $k$" }
      - { match: "(1-p)^{k-1}", feedback: "ลืมคูณด้วยความน่าจะเป็นที่ครั้งที่ $k$ สำเร็จ ซึ่งคือ $p$" }
      - { match: "\\frac{(1-p)^{k-1}}{p}", feedback: "ผิดที่หาร: ต้องคูณด้วย $p$ ไม่ใช่หารด้วย $p$" }
    hints:
      - "ผลสำเร็จครั้งแรกเกิดขึ้นที่ครั้งที่ $k$ ดังนั้นก่อนหน้านั้นต้องพลาดกี่ครั้ง"
      - "ความน่าจะเป็นของการพลาดหนึ่งครั้งคือ $1-p$ และของการสำเร็จหนึ่งครั้งคือ $p$"
      - "คูณความน่าจะเป็นของการพลาด $k-1$ ครั้งกับความน่าจะเป็นของการสำเร็จครั้งที่ $k$"
    solution: "ต้องพลาด $k-1$ ครั้งแรก (ความน่าจะเป็น $(1-p)^{k-1}$) แล้วสำเร็จครั้งที่ $k$ (ความน่าจะเป็น $p$) จึงได้ $P(X=k)=p\\cdot(1-p)^{k-1}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.discrete-distributions.p008
    topics: [math.stats.discrete-distributions]
    difficulty: 3
    type: numeric
    stem: "ทดลองซ้ำอย่างอิสระ โดยแต่ละครั้งสำเร็จด้วยความน่าจะเป็น $0.1$ จงหาความน่าจะเป็นที่การสำเร็จครั้งแรกเกิดขึ้นที่ครั้งที่ 10 (ตอบทศนิยม 4 ตำแหน่ง)"
    answer: { value: 0.0387, tolerance: 0.0001 }
    hints:
      - "ก่อนครั้งที่ 10 ต้องพลาดกี่ครั้ง"
      - "การพลาดหนึ่งครั้งมีความน่าจะเป็น $0.9$"
      - "ใช้ $P(X=k)=(1-p)^{k-1}p$ โดยแทน $p=0.1$ และ $k=10$"
    misconceptions:
      - { match: 0.09, feedback: "0.09 คือ $P(X=2)$ เพราะยกกำลังเพียง 1 โจทย์ต้องยกกำลัง $k-1=9$" }
      - { match: 0.1, feedback: "0.1 คือ $p$ เอง เป็นความน่าจะเป็นของการสำเร็จในครั้งเดียว ยังไม่ได้คิดถึงการพลาด 9 ครั้งก่อนหน้า" }
    solution: "$P(X=10)=(1-0.1)^{9}\\cdot 0.1 = 0.9^9\\cdot 0.1 = 0.387420489\\cdot 0.1 \\approx 0.0387$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.discrete-distributions.p009
    topics: [math.stats.discrete-distributions]
    difficulty: 3
    type: text
    stem: "ระบบตรวจสินค้าทดสอบชิ้นงานทีละชิ้น โดยแต่ละชิ้นไม่ผ่านการทดสอบด้วยความน่าจะเป็นคงที่และอิสระกัน ระบบจะหยุดเมื่อพบชิ้นที่ไม่ผ่านชิ้นแรก จำนวนชิ้นที่ทดสอบจึงไม่มีขอบบน การแจกแจงนี้ชื่อว่าอะไร (ตอบชื่อภาษาไทยหรือภาษาอังกฤษ)"
    accepted: ["การแจกแจงเรขาคณิต", "เรขาคณิต", "geometric", "geometric distribution"]
    misconceptions:
      - { match: "การแจกแจงทวินาม", feedback: "ทวินามนับจำนวนครั้งที่สำเร็จในจำนวนครั้งที่กำหนดไว้ล่วงหน้า โจทย์นี้ไม่ได้กำหนดจำนวนครั้งและหยุดเมื่อพบครั้งแรก" }
      - { match: "การแจกแจงไฮเปอร์จีโอเมตริก", feedback: "ไฮเปอร์จีโอเมตริกต้องหยิบจากประชากรจำกัดที่มีสองประเภทโดยไม่ใส่คืน โจทย์นี้ไม่มีการหยิบจากกลุ่มเช่นนั้น" }
    hints:
      - "ดูว่าโจทย์นับอะไร จำนวนครั้งที่ทดลองจนสำเร็จครั้งแรก หรือจำนวนความสำเร็จในจำนวนครั้งที่กำหนด"
      - "โอกาสคงที่และอิสระกัน รวมถึงการหยุดเมื่อพบครั้งแรก คือลักษณะเด่นของการแจกแจงนี้"
    solution: "ตัวแปร $X$ คือจำนวนชิ้นที่ทดสอบจนพบชิ้นที่ไม่ผ่านชิ้นแรก เป็นการแจกแจงเรขาคณิต (geometric distribution) ซึ่งมีค่าได้เป็น 1, 2, 3, ... ไม่มีขอบบน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.discrete-distributions.p010
    topics: [math.stats.discrete-distributions]
    difficulty: 3
    type: numeric
    stem: "กล่องมีลูกบอลทั้งหมด 20 ลูก ในนั้นมี 4 ลูกชำรุด สุ่มหยิบ 5 ลูกโดยไม่ใส่คืน จงหาความน่าจะเป็นที่ไม่มีลูกชำรุดเลย (ตอบทศนิยม 4 ตำแหน่ง)"
    answer: { value: 0.2817, tolerance: 0.0001 }
    hints:
      - "จำนวนลูกชำรุดในตัวอย่างเป็นการแจกแจงไฮเปอร์จีโอเมตริก โดยมี $N=20$, $K=4$, $n=5$"
      - "นับวิธีเลือก 5 ลูกที่ดีทั้งหมดจาก 16 ลูกที่ดี แล้วหารด้วยวิธีเลือก 5 ลูกจาก 20 ลูก"
      - "ใช้ $P(X=0)=\\frac{\\binom{4}{0}\\binom{16}{5}}{\\binom{20}{5}}$"
    misconceptions:
      - { match: 0.32768, feedback: "0.32768 คือ $0.8^5$ ซึ่งเป็นความน่าจะเป็นแบบทวินาม (หยิบใส่คืน) โจทย์หยิบโดยไม่ใส่คืนจึงต้องใช้การจัดหมู่" }
    solution: "$P(X=0)=\\frac{\\binom{4}{0}\\binom{16}{5}}{\\binom{20}{5}}=\\frac{4368}{15504}\\approx 0.2817$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.discrete-distributions.p011
    topics: [math.stats.discrete-distributions]
    difficulty: 3
    type: numeric
    stem: "กล่องมีลูกบอล 20 ลูก ในนั้นชำรุด 4 ลูก สุ่มหยิบ 5 ลูกโดยไม่ใส่คืน จงหาความน่าจะเป็นที่พบลูกชำรุดพอดี 1 ลูก (ตอบทศนิยม 4 ตำแหน่ง)"
    answer: { value: 0.4696, tolerance: 0.0001 }
    hints:
      - "ใช้การแจกแจงไฮเปอร์จีโอเมตริกโดยมี $N=20$, $K=4$, $n=5$ และ $k=1$"
      - "นับวิธีเลือกลูกชำรุด 1 ลูกจาก 4 ลูก และลูกดี 4 ลูกจาก 16 ลูก"
      - "หารด้วยวิธีเลือก 5 ลูกจาก 20 ลูกทั้งหมด"
    misconceptions:
      - { match: 0.4096, feedback: "0.4096 คือค่าของทวินามที่หยิบใส่คืน ซึ่งไม่ได้คิดว่าการหยิบแต่ละลูกเปลี่ยนสัดส่วนของลูกชำรุดในกล่อง" }
    solution: "$P(X=1)=\\frac{\\binom{4}{1}\\binom{16}{4}}{\\binom{20}{5}}=\\frac{4\\cdot 1820}{15504}=\\frac{7280}{15504}\\approx 0.4696$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.discrete-distributions.p012
    topics: [math.stats.discrete-distributions]
    difficulty: 4
    type: numeric
    stem: "กล่องมีลูกบอล 20 ลูก ชำรุด 4 ลูก สุ่มหยิบ 5 ลูกโดยไม่ใส่คืน ให้ $X$ เป็นจำนวนลูกชำรุดที่หยิบได้ จงหาค่าเฉลี่ย $E(X)$ (ตอบจำนวนเต็ม)"
    answer: { value: 1, tolerance: 0 }
    hints:
      - "ค่าเฉลี่ยของไฮเปอร์จีโอเมตริกเกี่ยวข้องกับจำนวนที่หยิบ $n$ และสัดส่วน $\\frac{K}{N}$"
      - "สัดส่วนของลูกชำรุดในกล่องคือ $\\frac{4}{20}$"
