  difficulty: 4
  type: numeric
  stem: จากตารางในภาพ ต้นจะได้รับเงินปันผลรวมกับเงินเฉลี่ยคืนทั้งหมดกี่บาท (ตอบเป็นบาท)
  figure:
    src: p-members.svg
    alt: ตารางสหกรณ์ร้านค้าโรงเรียนบ้านหนองบัว (สมมติ) สามแถว ดาวถือ 150 หุ้น ยอดซื้อทั้งปี 4,200 บาท ต้นถือ 80 หุ้น ยอดซื้อ 6,500 บาท ฝนถือ 200 หุ้น ยอดซื้อ 2,800 บาท หุ้นละ 10 บาท ข้อความใต้ตารางบอกว่าที่ประชุมใหญ่อนุมัติปันผล 5% ของค่าหุ้นและเฉลี่ยคืน 4% ของยอดซื้อ
  answer:
    value: 300
    unit: บาท
  misconceptions:
  - match: 264
    feedback: คิดปันผลจากจำนวนหุ้น ต้องคูณ 10 บาทต่อหุ้นก่อน
  - match: 365
    feedback: ใช้อัตรา 5% กับทั้งค่าหุ้นและยอดซื้อ เฉลี่ยคืนใช้อัตรา 4%
  hints:
  - ปันผลคิดจากค่าหุ้น (จำนวนหุ้น × 10 บาท)
  - เฉลี่ยคืนคิดจากยอดซื้อ แล้วนำสองยอดมารวมกัน
  solution: ค่าหุ้นของต้น $= 80 \times 10 = 800$ บาท ปันผล $= 800 \times 0.05 = 40$ บาท · เฉลี่ยคืน $= 6{,}500 \times 0.04 = 260$ บาท · รวม $= 300$ บาท ต้นถือหุ้นน้อยแต่ซื้อของมาก จึงได้เงินเฉลี่ยคืนมากกว่าปันผล
