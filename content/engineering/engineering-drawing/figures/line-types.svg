<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="sans-serif" font-size="14">
<title>ชนิดของเส้นในแบบวิศวกรรม</title>
<rect x="0" y="0" width="640" height="330" fill="#ffffff"/>
<text x="20.0" y="45.0" text-anchor="start" fill="#15211e" font-size="14" font-weight="bold">เส้นเต็มหนา</text>
<line x1="180.0" y1="40.0" x2="360.0" y2="40.0" stroke="#15211e" stroke-width="3"/>
<text x="380.0" y="45.0" text-anchor="start" fill="#15211e" font-size="13">ขอบและเส้นรอบรูปที่มองเห็น</text>
<text x="20.0" y="95.0" text-anchor="start" fill="#15211e" font-size="14" font-weight="bold">เส้นประ</text>
<line x1="180.0" y1="90.0" x2="360.0" y2="90.0" stroke="#15211e" stroke-width="2" stroke-dasharray="10 6"/>
<text x="380.0" y="95.0" text-anchor="start" fill="#15211e" font-size="13">ขอบที่ถูกบังหรือมองไม่เห็น</text>
<text x="20.0" y="145.0" text-anchor="start" fill="#15211e" font-size="14" font-weight="bold">เส้นลูกโซ่บาง</text>
