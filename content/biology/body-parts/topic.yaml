id: biology.humans.body-parts
subject: biology
title: { th: ส่วนต่าง ๆ ของร่างกายมนุษย์ สัตว์ และพืช, en: "Parts of the human body, animals and plants" }
summary: ชื่อ ลักษณะ และหน้าที่ของส่วนต่าง ๆ ของร่างกายคน สัตว์ และพืช อวัยวะรับความรู้สึก การทำงานร่วมกันในกิจกรรมประจำวัน และการดูแลร่างกาย
difficulty: 1
minutes: 20
prerequisites: [biology.life.living-things]
encompasses: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ส่วนต่าง ๆ ของร่างกายมนุษย์
    src: body-parts.svg
    alt: "ภาพเด็กยืนตรง มีป้ายชี้ส่วนต่าง ๆ ด้านซ้าย: ผม ไหล่ ข้อศอก นิ้วมือ ขา เท้า ด้านขวา: ศีรษะ คอ แขน ลำตัว มือ เข่า"
    caption: "แขนงอได้ตรงข้อศอก ขางอได้ตรงเข่า (วาดโดยทีมคลังรู้)"
  - type: figure
    title: อวัยวะรับความรู้สึก 5 อย่าง
    src: senses.svg
    alt: "ภาพใบหน้าและมือ มีป้ายชี้ ตา มองเห็นสีและรูปร่าง, หู ได้ยินเสียง, จมูก ดมกลิ่น, ลิ้น รับรสเปรี้ยว หวาน เค็ม ขม, ผิวหนังที่มือ รับสัมผัส ร้อน เย็น เจ็บ"
    caption: "ร่างกายรับรู้สิ่งรอบตัวด้วยตา หู จมูก ลิ้น และผิวหนัง (วาดโดยทีมคลังรู้)"
  - { type: check, problem: biology.humans.body-parts.p002, prompt: "ลองจับคู่ก่อนอ่านต่อ" }
  - type: worked-example
    title: ร่างกายทำงานร่วมกันตอนรับลูกบอล
    problem: "เพื่อนโยนลูกบอลมาให้น้องมด น้องมดรับได้ น้องมดใช้ส่วนใดของร่างกายบ้าง และแต่ละส่วนทำอะไร"
    steps:
      - text: "ก่อนรับ ต้องรู้ว่าลูกบอลอยู่ที่ไหน ใช้ตามองลูกบอล"
      - text: "ยื่นแขนออกไปหาลูกบอล แขนงอได้ตรงข้อศอก"
      - text: "ใช้มือและนิ้วมือจับลูกบอลไว้"
      - text: "ขาและเท้าช่วยยืนให้มั่นคง หรือก้าวไปหาลูกบอล"
        why: "ร่างกายไม่ได้ใช้ส่วนเดียว หลายส่วนทำหน้าที่ของตัวเองพร้อมกันจึงรับลูกบอลได้"
    answer: "ใช้ตามอง แขนยื่น มือจับ และขากับเท้ายืนหรือก้าว ทุกส่วนทำงานร่วมกัน"
  - type: figure
    title: ส่วนต่าง ๆ ของปลา นก และพืช
    src: animal-plant-parts.svg
    alt: "ภาพสามช่อง ช่องปลา: ตา มองหาอาหาร, ครีบ พยุงตัวและว่ายน้ำ, เหงือก หายใจในน้ำ, เกล็ด ป้องกันลำตัว, หาง พาตัวไปข้างหน้า ช่องนก: จะงอยปาก จิกกินอาหาร, ปีก ใช้บิน, ขาและนิ้วเท้า เดินและเกาะกิ่งไม้, ขน ให้ความอบอุ่น ช่องพืช: ดอก สร้างผลและเมล็ด, ใบ สร้างอาหาร, ผล ห่อหุ้มเมล็ด, ลำต้น ชูใบ ลำเลียงน้ำ, ราก ดูดน้ำ ยึดดิน"
    caption: "สัตว์และพืชมีส่วนต่าง ๆ ที่ช่วยให้กิน หายใจ เคลื่อนที่ และมีลูกได้ (วาดโดยทีมคลังรู้)"
  - { type: check, problem: biology.humans.body-parts.p005, prompt: "ดูภาพปลาแล้วตอบ" }
glossary:
  - { term: อวัยวะ, definition: "ส่วนของร่างกายที่ทำหน้าที่เฉพาะ เช่น ตา หู หัวใจ ปอด" }
  - { term: อวัยวะรับความรู้สึก, definition: "ส่วนของร่างกายที่รับรู้สิ่งรอบตัว ได้แก่ ตา หู จมูก ลิ้น และผิวหนัง" }
  - { term: เหงือก, definition: "อวัยวะที่ปลาใช้หายใจในน้ำ อยู่ด้านข้างของหัว" }
  - { term: จะงอยปาก, definition: "ปากแข็งของนก ใช้จิก ฉีก หรือกะเทาะอาหาร" }
flashcards:
  - { front: "อวัยวะรับความรู้สึก 5 อย่างมีอะไรบ้าง", back: "ตา (มองเห็น) หู (ได้ยิน) จมูก (ดมกลิ่น) ลิ้น (รับรส) ผิวหนัง (รับสัมผัส)" }
  - { front: "แขนงอได้ตรงไหน ขางอได้ตรงไหน", back: "แขนงอที่ข้อศอก ขางอที่เข่า" }
  - { front: "ปลาและนกใช้ส่วนใดเคลื่อนที่", back: "ปลาใช้ครีบและหางว่ายน้ำ นกใช้ปีกบินและใช้ขาเดิน" }
  - { front: "ส่วนต่าง ๆ ของพืชมีอะไรบ้าง", back: "ราก ลำต้น ใบ ดอก และผล" }
  - { front: "ดูแลมืออย่างไร", back: "ล้างมือด้วยสบู่ก่อนกินอาหารและหลังเข้าห้องน้ำ ตัดเล็บให้สั้น" }
