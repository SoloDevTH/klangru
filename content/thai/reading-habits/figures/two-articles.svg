<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="sans-serif">
<title>บทความออนไลน์สมมุติสองบทเรื่องการดื่มน้ำ</title>
<defs></defs>
<rect x="0" y="0" width="860" height="300" fill="#fff"/>
<rect x="15.0" y="15.0" width="405.0" height="270.0" rx="10" fill="#fff" stroke="#555" stroke-width="2"/>
<rect x="15.0" y="15.0" width="405.0" height="40.0" rx="10" fill="#eceff1" stroke="#555" stroke-width="2"/>
<text x="31.0" y="42.0" font-size="17" text-anchor="start" fill="#111" font-weight="bold">บทความ ก: ดื่มน้ำอย่างไรให้พอ</text>
<text x="31.0" y="82.0" font-size="13" text-anchor="start" fill="#555" font-weight="normal">โดย ฝ่ายสุขศึกษา โรงพยาบาลสมมุติ · ปรับปรุง มีนาคม 2569</text>
<text x="31.0" y="130.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">• ควรดื่มน้ำสะอาดสม่ำเสมอตลอดวัน</text>
<text x="31.0" y="170.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">• ดื่มเพิ่มเมื่อออกกำลังกายหรืออากาศร้อน</text>
<text x="31.0" y="210.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">• ปัสสาวะสีเหลืองเข้มอาจแปลว่าดื่มน้อยไป</text>
<text x="31.0" y="260.0" font-size="14" text-anchor="start" fill="#555" font-weight="normal">แหล่งอ้างอิง: เอกสารของหน่วยงานสาธารณสุข 2 รายการ</text>
<rect x="440.0" y="15.0" width="405.0" height="270.0" rx="10" fill="#fff" stroke="#555" stroke-width="2"/>
<rect x="440.0" y="15.0" width="405.0" height="40.0" rx="10" fill="#eceff1" stroke="#555" stroke-width="2"/>
<text x="456.0" y="42.0" font-size="17" text-anchor="start" fill="#111" font-weight="bold">บทความ ข: น้ำวิเศษ ดื่มแล้วฉลาดขึ้น!</text>
<text x="456.0" y="82.0" font-size="13" text-anchor="start" fill="#555" font-weight="normal">ไม่ระบุผู้เขียน · ไม่ระบุวันที่</text>
<text x="456.0" y="130.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">• ดื่มน้ำแร่ตราดาวเงินวันละ 3 ขวด</text>
<text x="456.0" y="170.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">• สมองไวขึ้นภายใน 7 วัน รับรองผล</text>
<text x="456.0" y="210.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">• สั่งซื้อวันนี้ ลด 50%</text>
<text x="456.0" y="260.0" font-size="14" text-anchor="start" fill="#555" font-weight="normal">ไม่มีแหล่งอ้างอิง</text>
</svg>
