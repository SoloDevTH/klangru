problems:
  - id: phy.suvat.p001
    topics: [physics.kinematics.constant-acceleration]
    difficulty: 1
    type: numeric
    stem: "รถไฟฟ้าออกจากสถานีจากหยุดนิ่ง ด้วยความเร่งคงตัว $3\\ \\mathrm{m/s^2}$ หลังผ่านไป $4\\ \\mathrm{s}$ มีความเร็วเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s)"
    answer: { value: 12, unit: m/s }
    hints:
      - "รู้ $u$, $a$, $t$ และต้องการหา $v$ ไม่เกี่ยวกับการกระจัด"
      - "ใช้ $v = u + at$ โดยเริ่มจากหยุดนิ่งแปลว่า $u = 0$"
    misconceptions:
      - { match: 24, feedback: "นั่นคือค่าของ $\\tfrac{1}{2}at^2$ ซึ่งเป็นระยะทาง (หน่วย m) ไม่ใช่ความเร็ว โจทย์ถามความเร็ว ใช้ $v = u + at$" }
      - { match: 0.75, feedback: "ดูเหมือนนำความเร่งหารด้วยเวลา ความเร่ง $3\\ \\mathrm{m/s^2}$ แปลว่าความเร็วเพิ่ม $3\\ \\mathrm{m/s}$ ทุกวินาที จึงต้องคูณกับเวลา" }
    solution: "$v = u + at = 0 + (3\\ \\mathrm{m/s^2})(4\\ \\mathrm{s}) = 12\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.suvat.p002
    topics: [physics.kinematics.constant-acceleration]
    difficulty: 2
    type: match
    stem: "สมการแต่ละสมการของความเร่งคงตัวไม่มีตัวแปรใดอยู่ จับคู่ให้ถูกต้อง"
    pairs:
      - { left: "$v = u + at$", right: "ไม่มีการกระจัด $s$" }
      - { left: "$s = ut + \\tfrac{1}{2}at^2$", right: "ไม่มีความเร็วปลาย $v$" }
      - { left: "$v^2 = u^2 + 2as$", right: "ไม่มีเวลา $t$" }
      - { left: "$s = \\tfrac{(u + v)t}{2}$", right: "ไม่มีความเร่ง $a$" }
    hints:
      - "ตัวแปรทั้งหมดมี 5 ตัว คือ $u$, $v$, $a$, $t$, $s$"
      - "ไล่ดูทีละสมการว่าตัวแปรใดในห้าตัวนี้ไม่ปรากฏ"
    solution: "$v = u + at$ ไม่มี $s$ · $s = ut + \\tfrac{1}{2}at^2$ ไม่มี $v$ · $v^2 = u^2 + 2as$ ไม่มี $t$ · $s = \\tfrac{(u + v)t}{2}$ ไม่มี $a$ จึงเลือกสมการจากตัวแปรที่โจทย์ไม่ให้และไม่ถาม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.suvat.p003
    topics: [physics.kinematics.constant-acceleration]
    difficulty: 2
    type: numeric
    stem: "รถจักรยานยนต์เริ่มจากหยุดนิ่ง เร่งด้วยความเร่งคงตัว $2\\ \\mathrm{m/s^2}$ เป็นเวลา $5\\ \\mathrm{s}$ ได้ระยะทางกี่เมตร (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 25, unit: m }
    hints:
      - "รู้ $u$, $a$, $t$ ต้องการหา $s$ โดยไม่รู้ $v$"
      - "ใช้ $s = ut + \\tfrac{1}{2}at^2$ เมื่อ $u = 0$ พจน์แรกเป็นศูนย์"
      - "ยกกำลังสองเวลาก่อน แล้วคูณด้วย $\\tfrac{1}{2}$ และ $a$"
    misconceptions:
      - { match: 50, feedback: "ดูเหมือนลืม $\\tfrac{1}{2}$ ใน $\\tfrac{1}{2}at^2$ ทำให้ได้ระยะทางมากเป็นสองเท่า" }
      - { match: 10, feedback: "นั่นคือ $at$ ซึ่งเป็นความเร็วปลาย ($\\mathrm{m/s}$) ไม่ใช่ระยะทาง ต้องใช้ $s = ut + \\tfrac{1}{2}at^2$" }
    solution: "$s = ut + \\tfrac{1}{2}at^2 = 0 + \\tfrac{1}{2}(2\\ \\mathrm{m/s^2})(5\\ \\mathrm{s})^2 = \\tfrac{1}{2}(2)(25)\\ \\mathrm{m} = 25\\ \\mathrm{m}$ ตรวจ: $v = 10\\ \\mathrm{m/s}$ และ $s = \\tfrac{(0 + 10)(5)}{2} = 25\\ \\mathrm{m}$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.suvat.p004
    topics: [physics.kinematics.constant-acceleration]
    difficulty: 3
    type: numeric
    stem: "รถยนต์วิ่งด้วยความเร็ว $20\\ \\mathrm{m/s}$ คนขับเหยียบเบรกทำให้มีความเร่ง $-5\\ \\mathrm{m/s^2}$ (ทิศที่รถวิ่งเป็นบวก) จนรถหยุด รถไถลไปได้ไกลกี่เมตร (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 40, unit: m }
    hints:
      - "รถหยุดแปลว่า $v = 0$ โจทย์ไม่ให้และไม่ถามเวลา"
      - "สมการที่ไม่มี $t$ คือ $v^2 = u^2 + 2as$"
      - "แทนค่าแล้วจัดรูปหา $s$: $0 = 20^2 + 2(-5)s$"
    misconceptions:
      - { match: 80, feedback: "ดูเหมือนลืมเลข 2 ใน $2as$ ตรวจสมการอีกครั้ง: $v^2 = u^2 + 2as$" }
      - { match: -40, feedback: "ระยะไถลเป็นลบไม่ได้ เพราะรถวิ่งไปข้างหน้า ดูเหมือนใช้ $a = +5$ หรือเครื่องหมายหายตอนจัดรูป ความเร่งที่ใช้เบรกต้องเป็นลบ" }
    solution: "$v^2 = u^2 + 2as$ → $0 = (20\\ \\mathrm{m/s})^2 + 2(-5\\ \\mathrm{m/s^2})s$ → $10s = 400$ → $s = 40\\ \\mathrm{m}$ ตรวจหน่วย: $\\dfrac{\\mathrm{m^2/s^2}}{\\mathrm{m/s^2}} = \\mathrm{m}$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.suvat.p005
    topics: [physics.kinematics.constant-acceleration]
    difficulty: 3
    type: mcq
    stem: "โจทย์บอกความเร็วต้น $u$ ความเร่ง $a$ และการกระจัด $s$ แล้วถามความเร็วปลาย $v$ โดยไม่ได้บอกเวลา ควรใช้สมการใดจึงหาคำตอบได้ในขั้นเดียว"
    choices:
      - { id: a, text: "$v^2 = u^2 + 2as$", correct: true }
      - { id: b, text: "$v = u + at$", feedback: "สมการนี้ต้องรู้เวลา $t$ ซึ่งโจทย์ไม่ได้ให้ มีตัวไม่รู้สองตัวในสมการเดียวจึงแก้ไม่ได้" }
      - { id: c, text: "$s = ut + \\tfrac{1}{2}at^2$", feedback: "สมการนี้ไม่มี $v$ อยู่เลย จึงหาความเร็วปลายจากสมการนี้โดยตรงไม่ได้" }
      - { id: d, text: "$s = \\tfrac{(u + v)t}{2}$", feedback: "สมการนี้มี $t$ อยู่ด้วย ซึ่งโจทย์ไม่ได้ให้ จึงมีตัวไม่รู้สองตัว" }
    hints:
      - "ตัวแปรที่โจทย์ไม่ให้และไม่ถามคือตัวใด"
      - "หาสมการที่ไม่มีตัวแปรนั้นอยู่เลย"
    solution: "โจทย์ไม่ให้และไม่ถาม $t$ จึงเลือกสมการที่ไม่มี $t$ คือ $v^2 = u^2 + 2as$ ซึ่งมีตัวไม่รู้ตัวเดียวคือ $v$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.suvat.p006
    topics: [physics.kinematics.constant-acceleration]
    difficulty: 4
    type: numeric
    stem: "ปล่อยลูกบอลจากหยุดนิ่งบนตึกสูง ลูกบอลตกอิสระนาน $3\\ \\mathrm{s}$ ก่อนถึงพื้น ตึกสูงกี่เมตร ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ และไม่คิดแรงต้านอากาศ (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 44.1, tolerance: 0.05, unit: m }
    hints:
      - "ตั้งทิศลงเป็นบวก จะได้ $u = 0$ และ $a = +9.8\\ \\mathrm{m/s^2}$"
      - "รู้ $u$, $a$, $t$ ต้องการหา $s$ ใช้ $s = ut + \\tfrac{1}{2}at^2$"
      - "อย่าลืม $\\tfrac{1}{2}$ และยกกำลังสองของเวลา"
    misconceptions:
      - { match: 88.2, feedback: "ดูเหมือนลืม $\\tfrac{1}{2}$ ใน $\\tfrac{1}{2}at^2$ ทำให้ได้ค่ามากเป็นสองเท่า" }
      - { match: 45, feedback: "ดูเหมือนใช้ $g = 10\\ \\mathrm{m/s^2}$ วิธีคิดถูกแล้ว แต่ข้อนี้กำหนด $g = 9.8\\ \\mathrm{m/s^2}$" }
    solution: "ทิศลงเป็นบวก: $s = ut + \\tfrac{1}{2}gt^2 = 0 + \\tfrac{1}{2}(9.8\\ \\mathrm{m/s^2})(3\\ \\mathrm{s})^2 = 4.9 \\times 9\\ \\mathrm{m} = 44.1\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.suvat.p007
    topics: [physics.kinematics.constant-acceleration]
    difficulty: 4
    type: numeric
    stem: "รถยนต์เร่งความเร็วอย่างสม่ำเสมอจาก $10\\ \\mathrm{m/s}$ เป็น $30\\ \\mathrm{m/s}$ ในระยะทาง $100\\ \\mathrm{m}$ ความเร่งเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s²)"
    answer: { value: 4, unit: m/s² }
    hints:
      - "รู้ $u$, $v$, $s$ ไม่รู้และไม่ถามเวลา"
      - "ใช้ $v^2 = u^2 + 2as$ แล้วจัดรูปให้ $a$ อยู่ข้างเดียว"
      - "$a = \\dfrac{v^2 - u^2}{2s}$ ระวังต้องยกกำลังสองแต่ละตัวก่อนลบ"
    misconceptions:
      - { match: 8, feedback: "ดูเหมือนลืมหารด้วย 2 ตอนจัดรูป จาก $v^2 - u^2 = 2as$ ได้ $a = \\dfrac{v^2 - u^2}{2s}$" }
      - { match: 0.2, feedback: "ดูเหมือนนำความเร็วที่เปลี่ยนไปหารด้วยระยะทาง แต่ความเร่งคือความเร็วที่เปลี่ยนไปหารด้วย **เวลา** เมื่อไม่รู้เวลาให้ใช้ $v^2 = u^2 + 2as$" }
    solution: "$a = \\dfrac{v^2 - u^2}{2s} = \\dfrac{(30\\ \\mathrm{m/s})^2 - (10\\ \\mathrm{m/s})^2}{2(100\\ \\mathrm{m})} = \\dfrac{900 - 100}{200}\\ \\mathrm{m/s^2} = 4\\ \\mathrm{m/s^2}$ ตรวจ: $t = \\dfrac{30 - 10}{4} = 5\\ \\mathrm{s}$ และ $s = \\tfrac{(10 + 30)(5)}{2} = 100\\ \\mathrm{m}$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.suvat.p008
    topics: [physics.kinematics.constant-acceleration]
    difficulty: 5
    type: numeric
    stem: "โยนลูกบอลขึ้นตรง ๆ ด้วยความเร็ว $14.7\\ \\mathrm{m/s}$ ลูกบอลขึ้นไปได้สูงสุดกี่เมตรเหนือจุดที่ปล่อย ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ และไม่คิดแรงต้านอากาศ (ตอบเป็นตัวเลขในหน่วย m ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 11.025, tolerance: 0.05, unit: m }
    hints:
      - "ที่จุดสูงสุด ลูกบอลหยุดชั่วขณะ ความเร็วปลายจึงเป็นเท่าใด"
      - "ตั้งทิศขึ้นเป็นบวก จะได้ $u = +14.7\\ \\mathrm{m/s}$ และ $a = -9.8\\ \\mathrm{m/s^2}$ ไม่รู้และไม่ถามเวลา"
      - "ใช้ $v^2 = u^2 + 2as$ โดยให้ $v = 0$ แล้วจัดรูปหา $s$"
    misconceptions:
      - { match: 22.05, feedback: "ดูเหมือนลืมเลข 2 ใน $2as$ จาก $0 = u^2 - 2gs$ ได้ $s = \\dfrac{u^2}{2g}$" }
      - { match: 10.805, feedback: "ดูเหมือนใช้ $g = 10\\ \\mathrm{m/s^2}$ วิธีคิดถูกแล้ว แต่ข้อนี้กำหนด $g = 9.8\\ \\mathrm{m/s^2}$" }
    solution: "ทิศขึ้นเป็นบวก ที่จุดสูงสุด $v = 0$: $0 = (14.7\\ \\mathrm{m/s})^2 + 2(-9.8\\ \\mathrm{m/s^2})s$ → $19.6s = 216.09$ → $s = \\dfrac{216.09}{19.6}\\ \\mathrm{m} \\approx 11.03\\ \\mathrm{m}$ (ตรวจอีกทาง: ใช้เวลาขึ้น $t = \\dfrac{14.7}{9.8} = 1.5\\ \\mathrm{s}$ และ $s = \\tfrac{(14.7 + 0)(1.5)}{2} = 11.025\\ \\mathrm{m}$ ✓)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.suvat.p009
    topics: [physics.kinematics.constant-acceleration]
    difficulty: 3
    type: numeric
    stem: "เครื่องบินโดยสารที่สนามบินสุวรรณภูมิเริ่มวิ่งบนรันเวย์จากหยุดนิ่ง ด้วยความเร่งคงตัว $2.5\\ \\mathrm{m/s^2}$ และต้องมีความเร็ว $75\\ \\mathrm{m/s}$ จึงจะขึ้นจากพื้นได้ รันเวย์ต้องยาวอย่างน้อยกี่เมตร (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 1125, unit: m }
    hints:
      - "รู้ $u = 0$, $v$, $a$ ต้องการหา $s$ โดยไม่รู้เวลา"
      - "ใช้ $v^2 = u^2 + 2as$ ซึ่งเป็นสมการที่ไม่มี $t$"
      - "จัดรูปได้ $s = \\dfrac{v^2 - u^2}{2a}$ แล้วแทนค่า"
    misconceptions:
      - { match: 2250, feedback: "ดูเหมือนลืมเลข 2 ใน $2as$ จาก $v^2 = 2as$ ต้องหารด้วย $2a$ ไม่ใช่แค่ $a$" }
      - { match: 30, feedback: "นั่นคือเวลาที่ใช้ ($t = \\tfrac{v}{a} = 30\\ \\mathrm{s}$) ไม่ใช่ความยาวรันเวย์ โจทย์ถามระยะทาง" }
    solution: "$s = \\dfrac{v^2 - u^2}{2a} = \\dfrac{(75\\ \\mathrm{m/s})^2 - 0}{2(2.5\\ \\mathrm{m/s^2})} = \\dfrac{5625}{5}\\ \\mathrm{m} = 1125\\ \\mathrm{m}$ ตรวจ: $t = \\tfrac{75}{2.5} = 30\\ \\mathrm{s}$ และ $s = \\tfrac{(0 + 75)(30)}{2} = 1125\\ \\mathrm{m}$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.suvat.p010
    topics: [physics.kinematics.constant-acceleration]
    difficulty: 4
    type: numeric
    stem: "คนขับรถเมล์ที่วิ่งด้วยความเร็ว $12\\ \\mathrm{m/s}$ เห็นไฟแดงและเริ่มเบรกเมื่ออยู่ห่างเส้นหยุดรถ $30\\ \\mathrm{m}$ ถ้าเบรกด้วยความเร่งคงตัว รถต้องมีความเร่ง **ขนาด** อย่างน้อยเท่าใดจึงจะหยุดได้พอดีที่เส้น (ตอบเป็นตัวเลขบวกในหน่วย m/s²)"
    answer: { value: 2.4, tolerance: 0.02, unit: m/s² }
    hints:
      - "รถหยุดแปลว่า $v = 0$ และระยะเบรกคือ $s = 30\\ \\mathrm{m}$ โจทย์ไม่ให้เวลา"
      - "ใช้ $v^2 = u^2 + 2as$ ให้ทิศที่รถวิ่งเป็นบวก จะได้ $a$ เป็นลบ"
      - "$0 = 12^2 + 2a(30)$ แก้หา $a$ แล้วตอบเฉพาะขนาด"
    misconceptions:
      - { match: 4.8, feedback: "ดูเหมือนลืมเลข 2 ใน $2as$ จาก $0 = u^2 + 2as$ ได้ขนาด $a = \\dfrac{u^2}{2s}$" }
      - { match: 0.4, feedback: "ดูเหมือนนำความเร็วหารด้วยระยะทาง ($\\tfrac{12}{30}$) ซึ่งไม่ได้ให้หน่วย $\\mathrm{m/s^2}$ เมื่อรู้ระยะทางแต่ไม่รู้เวลา ให้ใช้ $v^2 = u^2 + 2as$" }
    solution: "$0 = (12\\ \\mathrm{m/s})^2 + 2a(30\\ \\mathrm{m})$ → $60a = -144$ → $a = -2.4\\ \\mathrm{m/s^2}$ ขนาดของความเร่งจึงเป็น $2.4\\ \\mathrm{m/s^2}$ (เครื่องหมายลบบอกว่าความเร่งมีทิศตรงข้ามกับการเคลื่อนที่) ตรวจ: ใช้เวลา $t = \\tfrac{0 - 12}{-2.4} = 5\\ \\mathrm{s}$ และ $s = \\tfrac{(12 + 0)(5)}{2} = 30\\ \\mathrm{m}$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.suvat.p011
    topics: [physics.kinematics.constant-acceleration]
    difficulty: 1
    type: numeric
    stem: "รถยนต์เร่งอย่างสม่ำเสมอจาก $10\\ \\mathrm{m/s}$ เป็น $20\\ \\mathrm{m/s}$ ในเวลา $4\\ \\mathrm{s}$ รถเคลื่อนที่ได้ระยะทางเท่าใดในช่วงนี้ (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 60, tolerance: 0.1, unit: m }
    hints:
      - "รู้ $u$, $v$ และ $t$ ไม่รู้และไม่ถาม $a$"
      - "ใช้ $s = \\dfrac{(u + v)t}{2}$"
    misconceptions:
      - { match: 80, feedback: "ดูเหมือนใช้ความเร็วปลาย $20\\ \\mathrm{m/s}$ ตลอดช่วง แต่รถเร็วขึ้นจาก $10$ ต้องใช้ความเร็วเฉลี่ย $15\\ \\mathrm{m/s}$" }
      - { match: 40, feedback: "ดูเหมือนใช้ความเร็วต้น $10\\ \\mathrm{m/s}$ ตลอดช่วง ต้องใช้ความเร็วเฉลี่ย $\\tfrac{u + v}{2}$" }
    solution: "$s = \\dfrac{(10 + 20)(4)}{2} = 60\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.suvat.p012
    topics: [physics.kinematics.constant-acceleration]
    difficulty: 1
    type: mcq
    stem: "กราฟความเร็ว–เวลาของวัตถุที่เคลื่อนที่ด้วยความเร่งคงตัว (ไม่เป็นศูนย์) มีลักษณะอย่างไร"
    choices:
      - { id: a, text: "เส้นตรงที่เอียง", correct: true }
      - { id: b, text: "เส้นตรงแนวนอน", feedback: "เส้นแนวนอนหมายถึงความเร็วคงที่ ความเร่งเป็นศูนย์" }
      - { id: c, text: "เส้นโค้งพาราโบลา", feedback: "พาราโบลาคือรูปของกราฟ **ตำแหน่ง**–เวลา ($s = ut + \\tfrac12 at^2$) ส่วนกราฟความเร็ว–เวลาเป็นเส้นตรงเพราะ $v = u + at$" }
      - { id: d, text: "เส้นโค้งที่ชันขึ้นเรื่อย ๆ", feedback: "กราฟที่ชันขึ้นเรื่อย ๆ หมายถึงความเร่งเพิ่มขึ้น ไม่ใช่ความเร่งคงตัว" }
    hints:
      - "ความชันของกราฟ v–t คือความเร่ง"
      - "ความชันคงที่แปลว่ากราฟเป็นรูปใด"
    solution: "$v = u + at$ เป็นสมการเส้นตรงที่มีความชัน $a$ ความเร่งคงตัวแต่ไม่เป็นศูนย์ กราฟจึงเป็นเส้นตรงที่เอียง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.suvat.p013
    topics: [physics.kinematics.constant-acceleration]
    difficulty: 2
    type: numeric
    stem: "รถไฟฟ้าบีทีเอสออกจากสถานีจากหยุดนิ่ง ด้วยความเร่งคงตัว $1.0\\ \\mathrm{m/s^2}$ เป็นเวลา $12\\ \\mathrm{s}$ รถเคลื่อนที่ได้ระยะทางเท่าใด (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 72, tolerance: 0.1, unit: m }
    hints:
      - "รู้ $u = 0$, $a$ และ $t$ ต้องการ $s$"
      - "ใช้ $s = ut + \\tfrac12 at^2$"
    misconceptions:
      - { match: 144, feedback: "ลืม $\\tfrac12$ ใน $\\tfrac12 at^2$" }
      - { match: 12, feedback: "นั่นคือความเร็วที่ $t = 12\\ \\mathrm{s}$ ($v = at$) ไม่ใช่ระยะทาง" }
    solution: "$s = 0 + \\tfrac12(1.0)(12)^2 = 72\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.suvat.p014
    topics: [physics.kinematics.constant-acceleration]
    difficulty: 2
    type: expression
    stem: "จาก $v^2 = u^2 + 2as$ เขียนการกระจัด $s$ ในรูปของ $u$, $v$ และ $a$"
    prefix: "s ="
    answer: { latex: "\\frac{v^2-u^2}{2a}", variables: [u, v, a] }
    hints:
      - "ย้าย $u^2$ ไปอีกข้างก่อน"
      - "จากนั้นหารทั้งสองข้างด้วย $2a$"
    misconceptions:
      - { match: "\\frac{v^2-u^2}{a}", feedback: "ลืมหารด้วย 2 สัมประสิทธิ์ของ $s$ คือ $2a$" }
      - { match: "\\frac{(v-u)^2}{2a}", feedback: "$v^2 - u^2 \\ne (v - u)^2$ ลองแทน $u = 1$, $v = 3$ จะได้ 8 กับ 4 ไม่เท่ากัน" }
    solution: "$v^2 = u^2 + 2as$ → $2as = v^2 - u^2$ → $s = \\dfrac{v^2 - u^2}{2a}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.suvat.p015
    topics: [physics.kinematics.constant-acceleration]
    difficulty: 3
    type: numeric
    stem: "กราฟความเร็ว–เวลาของรถยนต์เป็นดังรูป รถเคลื่อนที่ได้ระยะทางทั้งหมดเท่าใดตั้งแต่ $t = 0$ ถึง $t = 13\\ \\mathrm{s}$ (ตอบเป็นตัวเลขในหน่วย m)"
    figure: { src: p-vt-area.svg, alt: "กราฟความเร็ว–เวลา เส้นตรงขึ้นจาก (0, 0) ถึง (4 s, 12 m/s) เป็นเส้นแนวนอนที่ 12 m/s จนถึง 10 s แล้วเป็นเส้นตรงลงถึง (13 s, 0)" }
    answer: { value: 114, tolerance: 0.5, unit: m }
    hints:
      - "ระยะทางคือพื้นที่ใต้กราฟความเร็ว–เวลา"
      - "แบ่งพื้นที่เป็นสามเหลี่ยม สี่เหลี่ยมผืนผ้า และสามเหลี่ยม แล้วรวมกัน"
    misconceptions:
      - { match: 156, feedback: "ดูเหมือนคิดว่ารถวิ่ง $12\\ \\mathrm{m/s}$ ตลอด 13 วินาที ช่วงเร่งและช่วงเบรกเป็นสามเหลี่ยม ต้องคูณ $\\tfrac12$" }
    solution: "ช่วงเร่ง $\\tfrac12(4)(12) = 24\\ \\mathrm{m}$ ช่วงคงที่ $(6)(12) = 72\\ \\mathrm{m}$ ช่วงเบรก $\\tfrac12(3)(12) = 18\\ \\mathrm{m}$ รวม $114\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.suvat.p016
    topics: [physics.kinematics.constant-acceleration]
    difficulty: 3
    type: numeric
    stem: "รถกระบะวิ่งบนถนนมิตรภาพด้วยความเร็ว $72\\ \\mathrm{km/h}$ คนขับเห็นวัวเดินข้ามถนน ใช้เวลาตอบสนอง $0.8\\ \\mathrm{s}$ แล้วเบรกด้วยความเร่ง $-5\\ \\mathrm{m/s^2}$ จนหยุด ระยะหยุดรถทั้งหมดเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 56, tolerance: 0.5, unit: m }
    hints:
      - "แปลง $72\\ \\mathrm{km/h}$ เป็น m/s ก่อน"
      - "ระยะหยุดรถ = ระยะคิด (ความเร็วคงที่ระหว่างตอบสนอง) + ระยะเบรก"
      - "ระยะเบรกใช้ $v^2 = u^2 + 2as$ โดย $v = 0$"
    misconceptions:
      - { match: 40, feedback: "นั่นคือระยะเบรกอย่างเดียว ลืมระยะที่รถวิ่งไปก่อนคนขับเริ่มเบรก ($20 \\times 0.8$)" }
      - { match: 16, feedback: "นั่นคือระยะคิดอย่างเดียว ยังต้องบวกระยะเบรก" }
    solution: "$u = 20\\ \\mathrm{m/s}$ ระยะคิด $20 \\times 0.8 = 16\\ \\mathrm{m}$ ระยะเบรก $\\dfrac{20^2}{2 \\times 5} = 40\\ \\mathrm{m}$ รวม $56\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.suvat.p017
    topics: [physics.kinematics.constant-acceleration]
    difficulty: 4
    type: numeric
    stem: "ผลการศึกษาพบว่าผู้ขับขี่ที่ดื่มสุรามีเวลาตอบสนองนานขึ้นจากราว $0.7\\ \\mathrm{s}$ เป็น $1.5\\ \\mathrm{s}$ ถ้าผู้ขับขี่ที่ดื่มสุราขับรถด้วยความเร็ว $90\\ \\mathrm{km/h}$ และเบรกด้วยความเร่ง $-6.25\\ \\mathrm{m/s^2}$ ระยะหยุดรถทั้งหมดเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 87.5, tolerance: 0.5, unit: m }
    hints:
      - "$90\\ \\mathrm{km/h} = 25\\ \\mathrm{m/s}$"
      - "ใช้เวลาตอบสนองของผู้ที่ดื่มสุรา $1.5\\ \\mathrm{s}$ หาระยะคิด"
      - "ระยะเบรก $= \\dfrac{u^2}{2a}$"
    misconceptions:
      - { match: 67.5, feedback: "นั่นคือระยะหยุดรถเมื่อเวลาตอบสนอง $0.7\\ \\mathrm{s}$ (ไม่ดื่ม) โจทย์ถามกรณีดื่มสุรา" }
      - { match: 50, feedback: "นั่นคือระยะเบรกอย่างเดียว ต้องบวกระยะคิด $25 \\times 1.5$" }
    solution: "ระยะคิด $25 \\times 1.5 = 37.5\\ \\mathrm{m}$ ระยะเบรก $\\dfrac{25^2}{2 \\times 6.25} = 50\\ \\mathrm{m}$ รวม $87.5\\ \\mathrm{m}$ ไกลกว่าตอนไม่ดื่ม ($17.5 + 50 = 67.5\\ \\mathrm{m}$) ถึง $20\\ \\mathrm{m}$ ซึ่งยาวกว่ารถเก๋งสี่คันต่อกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.suvat.p018
    topics: [physics.kinematics.constant-acceleration]
    difficulty: 3
    type: numeric
    stem: "รถเร่งอย่างสม่ำเสมอ ผ่านเสา A ด้วยความเร็ว $5\\ \\mathrm{m/s}$ และผ่านเสา B ซึ่งอยู่ห่างออกไป $60\\ \\mathrm{m}$ ด้วยความเร็ว $15\\ \\mathrm{m/s}$ รถใช้เวลาเดินทางจาก A ถึง B นานเท่าใด (ตอบเป็นตัวเลขในหน่วย s)"
    answer: { value: 6, tolerance: 0.05, unit: s }
    hints:
      - "รู้ $u$, $v$, $s$ ไม่รู้และไม่ถาม $a$"
      - "ใช้ $s = \\dfrac{(u + v)t}{2}$ แล้วจัดรูปหา $t$"
    misconceptions:
      - { match: 4, feedback: "ดูเหมือนใช้ความเร็วปลาย $15\\ \\mathrm{m/s}$ ตลอดทาง ต้องใช้ความเร็วเฉลี่ย $10\\ \\mathrm{m/s}$" }
      - { match: 12, feedback: "ดูเหมือนใช้ความเร็วต้น $5\\ \\mathrm{m/s}$ ตลอดทาง ต้องใช้ความเร็วเฉลี่ย" }
    solution: "$t = \\dfrac{2s}{u + v} = \\dfrac{2(60)}{5 + 15} = 6\\ \\mathrm{s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.suvat.p019
    topics: [physics.kinematics.constant-acceleration]
    difficulty: 5
    type: numeric
    stem: "รถจักรยานยนต์วิ่งด้วยความเร็วคงที่ $15\\ \\mathrm{m/s}$ ผ่านรถยนต์ที่จอดนิ่งอยู่ ขณะนั้นพอดีรถยนต์เริ่มออกตัวไปทางเดียวกันด้วยความเร่งคงตัว $2.5\\ \\mathrm{m/s^2}$ รถยนต์ไล่ทันรถจักรยานยนต์หลังจากออกตัวกี่วินาที (ตอบเป็นตัวเลขในหน่วย s)"
    answer: { value: 12, tolerance: 0.05, unit: s }
    hints:
      - "เขียนตำแหน่งของทั้งสองคันจากจุดเดียวกัน: รถจักรยานยนต์ $15t$ รถยนต์ $\\tfrac12(2.5)t^2$"
      - "ตามทันเมื่อตำแหน่งเท่ากัน ตั้งสมการแล้วแก้หา $t$ ที่ไม่เป็นศูนย์"
    misconceptions:
      - { match: 6, feedback: "นั่นคือเวลาที่รถยนต์มีความเร็วเท่ารถจักรยานยนต์ ($15 = 2.5t$) ซึ่งตอนนั้นรถยนต์ยังตามหลังอยู่ไกลที่สุด ยังไม่ทัน" }
    solution: "$15t = 1.25t^2$ → $t(1.25t - 15) = 0$ → $t = 12\\ \\mathrm{s}$ (ไม่นับ $t = 0$) ขณะนั้นทั้งสองอยู่ห่างจุดเริ่ม $15 \\times 12 = 180\\ \\mathrm{m}$ และรถยนต์มีความเร็ว $30\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.suvat.p020
    topics: [physics.kinematics.constant-acceleration]
    difficulty: 5
    type: numeric
    stem: "ถนนหน้าโรงเรียนแห่งหนึ่ง ผู้ขับขี่ต้องหยุดรถให้ได้ภายใน $30\\ \\mathrm{m}$ เมื่อเห็นเด็กวิ่งตัดหน้า ถ้าเวลาตอบสนองเป็น $0.6\\ \\mathrm{s}$ และเบรกได้ด้วยความเร่งขนาด $6\\ \\mathrm{m/s^2}$ ความเร็วสูงสุดที่ขับได้อย่างปลอดภัยเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 15.71, tolerance: 0.15, unit: m/s }
    hints:
      - "ระยะหยุดรถ $= 0.6u + \\dfrac{u^2}{2(6)}$ ต้องไม่เกิน $30\\ \\mathrm{m}$"
      - "ตั้ง $0.6u + \\dfrac{u^2}{12} = 30$ คูณ 12 ตลอดได้สมการกำลังสอง $u^2 + 7.2u - 360 = 0$"
      - "ใช้สูตรสมการกำลังสองและเลือกคำตอบที่เป็นบวก"
    misconceptions:
      - { match: 18.97, feedback: "นั่นคือคำตอบเมื่อไม่คิดระยะคิด ($\\sqrt{2 \\times 6 \\times 30}$) ระหว่างที่ผู้ขับขี่ตอบสนอง รถยังวิ่งด้วยความเร็วเดิม" }
    solution: "$u^2 + 7.2u - 360 = 0$ → $u = \\dfrac{-7.2 + \\sqrt{7.2^2 + 4(360)}}{2} = \\dfrac{-7.2 + 38.62}{2} \\approx 15.7\\ \\mathrm{m/s}$ หรือประมาณ $57\\ \\mathrm{km/h}$ ตรวจ: $0.6(15.7) + \\tfrac{15.7^2}{12} \\approx 9.4 + 20.6 = 30\\ \\mathrm{m}$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.suvat.p021
    topics: [physics.kinematics.constant-acceleration]
    difficulty: 4
    type: numeric
    stem: "วัตถุเริ่มจากหยุดนิ่งและเคลื่อนที่ด้วยความเร่งคงตัว $4\\ \\mathrm{m/s^2}$ ระยะทางที่วัตถุเคลื่อนที่ได้ **ในวินาทีที่ 3** (ระหว่าง $t = 2\\ \\mathrm{s}$ ถึง $t = 3\\ \\mathrm{s}$) เป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 10, tolerance: 0.05, unit: m }
    hints:
      - "หาระยะทางรวมเมื่อ $t = 3\\ \\mathrm{s}$ และเมื่อ $t = 2\\ \\mathrm{s}$"
      - "ระยะทางในวินาทีที่ 3 คือผลต่างของสองค่านี้"
    misconceptions:
      - { match: 18, feedback: "นั่นคือระยะทางรวมตั้งแต่เริ่มจนถึง $t = 3\\ \\mathrm{s}$ โจทย์ถามเฉพาะวินาทีที่ 3" }
      - { match: 2, feedback: "นั่นคือระยะทางในวินาทีแรก $\\tfrac12(4)(1)^2$ วัตถุเร็วขึ้นเรื่อย ๆ วินาทีหลังจึงไปได้ไกลกว่า" }
    solution: "$s(3) = \\tfrac12(4)(3)^2 = 18\\ \\mathrm{m}$, $s(2) = \\tfrac12(4)(2)^2 = 8\\ \\mathrm{m}$ ระยะในวินาทีที่ 3 $= 18 - 8 = 10\\ \\mathrm{m}$ (ระยะในแต่ละวินาทีเป็น 2, 6, 10, 14, ... เพิ่มขึ้นทีละ $a \\times 1^2 = 4\\ \\mathrm{m}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true
