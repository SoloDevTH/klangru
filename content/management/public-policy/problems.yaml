      - { id: b, text: "สร้างให้เสร็จก่อนแล้วค่อยชี้แจงว่าไม่มีผลกระทบ", feedback: "การฟังหลังตัดสินใจทำให้ขาดความไว้วางใจ และอาจต้องหยุดโครงการกลางทาง" }
      - { id: c, text: "ย้ายไปสร้างในพื้นที่ที่ชาวบ้านไม่ค่อยร้องเรียน", feedback: "ผลักภาระไปให้ชุมชนที่มีเสียงน้อยกว่า ขัดหลักความเป็นธรรม" }
      - { id: d, text: "ยกเลิกโครงการทันทีเมื่อมีคนคัดค้าน", feedback: "ปัญหาขยะยังอยู่ ควรรับฟังและหาทางลดผลกระทบก่อนตัดสินใจ" }
    hints:
      - "การจัดการความกังวลของสาธารณะเริ่มเมื่อใด"
      - "ต้องมีทั้งการรับฟัง มาตรการลดผลกระทบ และการติดตามผล"
    solution: "การรับฟังตั้งแต่ต้น ให้ข้อมูลครบ ปรับแบบ มีมาตรการลดผลกระทบ และติดตามผลอย่างเปิดเผย เป็นการจัดการความเสี่ยงและความกังวลของสาธารณะ"
