  - id: earthscience.astronomy.celestial-sphere-time.p014
    topics: [earthscience.astronomy.celestial-sphere-time]
    difficulty: 5
    type: numeric
    stem: "นักเรียนโรงเรียนหนึ่งทางภาคเหนือจับเวลาด้วยเงาไม้ พบว่าดวงอาทิตย์ผ่านเมริเดียนเวลา 12:13 น. (เวลาประเทศไทย UTC+7 เส้นมาตรฐาน 105° ตะวันออก) ในวันที่สมการเวลา (เวลาปรากฏ − เวลาปานกลาง) เท่ากับ +16 นาที โรงเรียนอยู่ที่ลองจิจูดกี่องศาตะวันออก"
    answer: { value: 97.75, tolerance: 0.1, unit: "° ตะวันออก" }
    misconceptions:
      - { match: 105.75, feedback: "ใส่เครื่องหมายสมการเวลาผิด สมการเวลาเป็นบวก ดวงอาทิตย์จริงผ่านเมริเดียนก่อนเที่ยงปานกลาง เที่ยงปานกลางจึงเป็น 12:13 + 16 = 12:29 น." }
      - { match: 101.75, feedback: "ลืมคิดสมการเวลา ใช้เฉพาะ 13 นาที" }
    hints:
      - "เที่ยงปานกลางท้องถิ่น = เวลาที่ดวงอาทิตย์จริงผ่านเมริเดียน + สมการเวลา"
      - "ช้ากว่า 12:00 น. กี่นาที หารด้วย 4 ได้ผลต่างลองจิจูดจาก 105°"
    solution: "เที่ยงปานกลาง $= 12{:}13 + 16 = 12{:}29$ น. ช้ากว่าเส้นมาตรฐาน 29 นาที $= 29/4 = 7.25^\\circ$ ลองจิจูด $= 105 - 7.25 = 97.75^\\circ$ ตะวันออก (ราวจังหวัดแม่ฮ่องสอน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.celestial-sphere-time.p015
