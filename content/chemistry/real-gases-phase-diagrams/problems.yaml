  - id: chemistry.states.real-gases-phase-diagrams.p013
    topics: [chemistry.states.real-gases-phase-diagrams]
    difficulty: 4
    type: numeric
    stem: 'ที่ยอดดอยอินทนนท์สูง 2,565 m ความดันบรรยากาศโดยประมาณ 74.7 kPa ถ้าใช้ $\Delta H_{vap} = 40.66$ kJ/mol และ $R = 8.314$ J/(mol·K) และจุดเดือดปกติ 373.15 K ที่ 101.3 kPa น้ำจะเดือดที่อุณหภูมิกี่องศาเซลเซียส (ตอบเป็น °C)'
    answer: { value: 91.5, tolerance: 0.5, unit: °C }
    hints:
      - 'ใช้สมการเคลาซิอุส–คลาเปรองโดยแทน $P_1 = 101.3$, $T_1 = 373.15$ K และ $P_2 = 74.7$ kPa'
      - 'หาค่า $1/T_2$ ก่อนแล้วจึงกลับเป็น $T_2$ แล้วลบ 273.15'
    misconceptions:
      - { match: 100, feedback: 'คิดว่าจุดเดือดไม่เปลี่ยนตามความดัน แต่ความดันที่ลดลงทำให้น้ำเดือดที่อุณหภูมิต่ำลง' }
    solution: '$\frac{1}{T_2} = \frac{1}{373.15} - \frac{8.314}{40660}\ln\frac{74.7}{101.3} = 0.0027422$ จึง $T_2 = 364.7$ K $= 91.5$ °C การต้มน้ำบนที่สูงจึงใช้เวลาและพลังงานมากกว่าที่ระดับน้ำทะเล'
