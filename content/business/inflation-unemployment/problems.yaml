  difficulty: 5
  type: mcq
  stem: จังหวัดหนึ่งมีโรงงานเปลี่ยนไปใช้เครื่องจักรอัตโนมัติ คนงานจำนวนมากตกงาน ขณะที่บริษัทซ่อมบำรุงเครื่องจักรขาดช่างเทคนิค นโยบายใด **แก้ตรงสาเหตุที่สุด**
  choices:
  - id: a
    text: จัดฝึกอบรมทักษะใหม่ให้คนงานไปทำงานซ่อมบำรุงหรืองานที่ขาดแคลน
    correct: true
  - id: b
    text: ให้ธนาคารลดดอกเบี้ยเพื่อกระตุ้นการบริโภคทั่วไป
    feedback: การกระตุ้นการใช้จ่ายช่วยการว่างงานตามวัฏจักร แต่ทักษะของคนงานยังไม่ตรงกับงานที่ว่าง
  - id: c
    text: ห้ามโรงงานใช้เครื่องจักร
    feedback: ทำให้ผลิตภาพลดลงและไม่ได้สร้างทักษะที่ตลาดต้องการ
  - id: d
    text: ไม่ต้องทำอะไร เพราะเป็นการว่างงานชั่วคราว
    feedback: มีงานว่างแต่ทักษะไม่ตรง จัดเป็นการว่างงานเชิงโครงสร้าง ซึ่งไม่หายเองเร็ว
  hints:
