<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="sans-serif">
<title>เทคนิคการปฏิเสธเมื่อถูกกดดันซ้ำ</title>
<rect x="0" y="0" width="760" height="360" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="380.0" y="28.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">เทคนิคการปฏิเสธเมื่อถูกกดดันซ้ำ (ใช้ร่วมกันได้)</text>
<rect x="25.0" y="55.0" width="225.0" height="115.0" rx="8" fill="#fadbd8" stroke="#333" stroke-width="1.5"/>
<text x="137.5" y="87.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">ปฏิเสธชัดและซ้ำ</text>
<text x="137.5" y="117.0" font-size="13" text-anchor="middle" fill="#111">&quot;ไม่เอา&quot; พูดประโยคเดิม</text>
<text x="137.5" y="139.0" font-size="13" text-anchor="middle" fill="#111">น้ำเสียงหนักแน่น</text>
<rect x="270.0" y="55.0" width="225.0" height="115.0" rx="8" fill="#fcf3cf" stroke="#333" stroke-width="1.5"/>
<text x="382.5" y="87.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">บอกความรู้สึกและเหตุผล</text>
<text x="382.5" y="117.0" font-size="13" text-anchor="middle" fill="#111">&quot;เราไม่สบายใจ</text>
<text x="382.5" y="139.0" font-size="13" text-anchor="middle" fill="#111">เราอยากเตะบอลให้ไหว&quot;</text>
<rect x="515.0" y="55.0" width="225.0" height="115.0" rx="8" fill="#d5f5e3" stroke="#333" stroke-width="1.5"/>
<text x="627.5" y="87.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">เสนอทางเลือก</text>
<text x="627.5" y="117.0" font-size="13" text-anchor="middle" fill="#111">&quot;ไปกินน้ำแข็งใส</text>
<text x="627.5" y="139.0" font-size="13" text-anchor="middle" fill="#111">กันดีกว่า&quot;</text>
<rect x="25.0" y="190.0" width="225.0" height="115.0" rx="8" fill="#d6eaf8" stroke="#333" stroke-width="1.5"/>
<text x="137.5" y="222.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">ผัดผ่อนหรือขอตัว</text>
<text x="137.5" y="252.0" font-size="13" text-anchor="middle" fill="#111">&quot;แม่โทรตามแล้ว</text>
<text x="137.5" y="274.0" font-size="13" text-anchor="middle" fill="#111">ไปก่อนนะ&quot;</text>
<rect x="270.0" y="190.0" width="225.0" height="115.0" rx="8" fill="#e8daef" stroke="#333" stroke-width="1.5"/>
<text x="382.5" y="222.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">หลีกเลี่ยงและออกไป</text>
<text x="382.5" y="252.0" font-size="13" text-anchor="middle" fill="#111">เลี่ยงที่และเวลาเสี่ยง</text>
<text x="382.5" y="274.0" font-size="13" text-anchor="middle" fill="#111">กลับไปหาเพื่อนที่ปลอดภัย</text>
<rect x="515.0" y="190.0" width="225.0" height="115.0" rx="8" fill="#fdebd0" stroke="#333" stroke-width="1.5"/>
<text x="627.5" y="222.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">ขอความช่วยเหลือ</text>
<text x="627.5" y="252.0" font-size="13" text-anchor="middle" fill="#111">บอกผู้ปกครองหรือครู</text>
<text x="627.5" y="274.0" font-size="13" text-anchor="middle" fill="#111">เมื่อถูกขู่หรือถูกจ้าง</text>
<text x="380.0" y="345.0" font-size="13" text-anchor="middle" fill="#333">ภาษากาย: สบตา ยืนตรง พูดเสียงชัด ไม่หัวเราะตามเมื่อพูดว่า &quot;ไม่&quot;</text>
</svg>
