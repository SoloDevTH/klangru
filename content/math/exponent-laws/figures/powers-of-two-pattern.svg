  <text x="100" y="190" text-anchor="middle" fill="#2b5f9e" font-size="18" font-weight="bold">2<tspan dy="-9" font-size="13">1</tspan></text>
  <text x="230" y="190" text-anchor="middle" fill="#15211e" font-size="18" font-weight="bold">2</text>
  <path d="M 310 185.0 C 350 187.0 350 217.0 310 219.0" fill="none" stroke="#b4521f" stroke-width="2"/>
  <polygon points="312,219 320,222.6 320,215.4" fill="#b4521f"/>
