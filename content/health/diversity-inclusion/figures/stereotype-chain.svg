<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="sans-serif">
<title>ห่วงโซ่จากภาพเหมารวมไปสู่ผลต่อคน</title>
<rect x="0" y="0" width="800" height="300" fill="#ffffff"/>
<rect x="24" y="60" width="170" height="150" rx="12" fill="#cfe3f5" stroke="#222" stroke-width="2.5"/>
<text x="109.0" y="98" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">ภาพเหมารวม</text>
<text x="109.0" y="144" text-anchor="middle" font-size="16" fill="#222">สรุปทั้งกลุ่ม</text>
<text x="109.0" y="170" text-anchor="middle" font-size="16" fill="#222">จากความเชื่อ</text>
<line x1="198" y1="135.0" x2="210" y2="135.0" stroke="#222" stroke-width="3"/>
<polygon points="218,135.0 208,128.0 208,142.0" fill="#222"/>
<rect x="222" y="60" width="170" height="150" rx="12" fill="#fbe7b5" stroke="#222" stroke-width="2.5"/>
<text x="307.0" y="98" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">อคติ</text>
<text x="307.0" y="144" text-anchor="middle" font-size="16" fill="#222">ความรู้สึกทางลบ</text>
<text x="307.0" y="170" text-anchor="middle" font-size="16" fill="#222">ต่อกลุ่มคน</text>
<line x1="396" y1="135.0" x2="408" y2="135.0" stroke="#222" stroke-width="3"/>
<polygon points="416,135.0 406,128.0 406,142.0" fill="#222"/>
<rect x="420" y="60" width="170" height="150" rx="12" fill="#f5d0d0" stroke="#222" stroke-width="2.5"/>
<text x="505.0" y="98" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">การเลือกปฏิบัติ</text>
<text x="505.0" y="144" text-anchor="middle" font-size="16" fill="#222">ปฏิบัติต่อคน</text>
<text x="505.0" y="170" text-anchor="middle" font-size="16" fill="#222">อย่างไม่เป็นธรรม</text>
<line x1="594" y1="135.0" x2="606" y2="135.0" stroke="#222" stroke-width="3"/>
<polygon points="614,135.0 604,128.0 604,142.0" fill="#222"/>
<rect x="618" y="60" width="170" height="150" rx="12" fill="#dcd0f0" stroke="#222" stroke-width="2.5"/>
<text x="703.0" y="98" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">ผลต่อคน</text>
<text x="703.0" y="144" text-anchor="middle" font-size="16" fill="#222">ไม่ได้รับการยอมรับ</text>
<text x="703.0" y="170" text-anchor="middle" font-size="16" fill="#222">และถูกกีดกัน</text>
<text x="24" y="270" font-size="18" fill="#222">ท้าทายได้ตั้งแต่ต้นทาง: ถามหาหลักฐาน พบคนจริง และยืนข้างผู้ถูกกระทำ (upstander)</text>
</svg>
