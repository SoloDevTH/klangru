  - { framework: cefr, indicators: ["CEFR-B2-reading"], coverage: partial, note: "สอนการระบุจุดยืน ข้อกล่าวอ้าง เหตุผล และข้อโต้แย้งฝ่ายตรงข้าม การปรับวิธีอ่าน และคำบอกความมั่นใจกับคำเชื่อม ฝึกด้วยประโยคเดี่ยวและย่อหน้าสมมุติยาวไม่เกินราว 90 คำ (ย่อหน้ายาวที่สุด 3 ข้อมี 62–86 คำ) ยังไม่มีบทความ 500–800 คำเต็มชิ้นตามขอบเขตในแผน และแอปไม่วัดความเร็วในการอ่าน" }
  - { framework: cefr, indicators: ["CEFR-C1-reading"], coverage: partial, note: "สอนการอนุมานความหมายแฝง น้ำเสียง และการเดาคำจากรากศัพท์และบริบท แต่ข้อความยาวและซับซ้อนระดับ C1 ยังไม่ครอบคลุม และแอปวัดได้เพียงความเข้าใจผ่านคำถาม" }
