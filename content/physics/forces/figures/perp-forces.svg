  <polygon points="100.0,140.0 105.4,152.0 94.6,152.0" fill="#1f5fa8"/>
  <text x="90.0" y="200.0" fill="#1f5fa8" font-size="14" text-anchor="end" font-weight="bold">400 N</text>
  <line x1="100.0" y1="260.0" x2="182.2" y2="150.4" stroke="#b4521f" stroke-width="3.6" stroke-linecap="butt"/>
  <polygon points="190.0,140.0 186.9,153.9 177.5,146.9" fill="#b4521f"/>
