problems:
  - id: health.family.family-and-self.p001
    topics: [health.family.family-and-self]
    difficulty: 1
    type: mcq
    stem: "แม่ของพ่อ เราเรียกว่าอะไร"
    choices:
      - { id: a, text: "ย่า", correct: true }
      - { id: b, text: "ยาย", feedback: "ยายคือแม่ของแม่ ส่วนแม่ของพ่อคือย่า" }
      - { id: c, text: "ป้า", feedback: "ป้าคือพี่สาวของพ่อหรือแม่ ไม่ใช่แม่ของพ่อ" }
      - { id: d, text: "น้า", feedback: "น้าคือน้องของแม่" }
    hints:
      - "ญาติทางพ่อเรียกว่าปู่กับย่า ญาติทางแม่เรียกว่าตากับยาย"
      - "ปู่เป็นผู้ชาย ย่าเป็นผู้หญิง"
    solution: "แม่ของพ่อคือย่า (พ่อของพ่อคือปู่ พ่อของแม่คือตา แม่ของแม่คือยาย)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.family.family-and-self.p002
    topics: [health.family.family-and-self]
    difficulty: 1
    type: mcq
    stem: "ข้อใดแสดงความรักความผูกพันระหว่างสมาชิกในครอบครัว"
    choices:
      - { id: a, text: "แม่เช็ดตัวและป้อนยาให้ลูกที่เป็นไข้", correct: true }
      - { id: b, text: "พี่แย่งขนมของน้องไปกินคนเดียว", feedback: "การแย่งของทำให้น้องเสียใจ ไม่ได้แสดงความรัก" }
      - { id: c, text: "ลูกไม่พูดกับยายเพราะเล่นเกมทั้งวัน", feedback: "การไม่สนใจกันทำให้ห่างเหิน ไม่ได้แสดงความผูกพัน" }
      - { id: d, text: "พ่อตะโกนดุลูกทุกครั้งที่ลูกถาม", feedback: "การตะโกนใส่ทำให้ลูกกลัว ความรักแสดงด้วยการรับฟังและพูดอย่างอ่อนโยน" }
    hints:
      - "ความรักดูได้จากการกระทำที่ใส่ใจและดูแลกัน"
      - "ข้อใดที่ทำให้อีกคนรู้สึกปลอดภัยและอบอุ่นใจ"
    solution: "การดูแลลูกเมื่อป่วยแสดงความรักความห่วงใย ข้ออื่นทำให้สมาชิกเสียใจหรือห่างเหินกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.family.family-and-self.p003
    topics: [health.family.family-and-self]
    difficulty: 1
    type: match
    stem: "จับคู่สมาชิกในครอบครัวกับตัวอย่างบทบาทหน้าที่"
    pairs:
      - { left: "พ่อแม่หรือผู้ปกครอง", right: "หาเลี้ยงครอบครัวและดูแลเมื่อลูกป่วย" }
      - { left: "ปู่ย่าตายาย", right: "เล่าประเพณีและให้คำแนะนำหลาน" }
      - { left: "พี่", right: "ช่วยสอนการบ้านน้อง" }
      - { left: "ตัวเรา", right: "ตั้งใจเรียนและช่วยงานบ้านตามวัย" }
    hints:
      - "ผู้ใหญ่ที่หารายได้ให้บ้านคือใคร"
      - "ผู้สูงอายุในบ้านมักมีประสบการณ์มาก"
    solution: "พ่อแม่ → หาเลี้ยงและดูแล, ปู่ย่าตายาย → ให้คำแนะนำและเล่าประเพณี, พี่ → ช่วยสอนน้อง, ตัวเรา → ตั้งใจเรียนและช่วยงานบ้าน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.family.family-and-self.p004
    topics: [health.family.family-and-self]
    difficulty: 2
    type: text
    stem: "ดูแผนผังครอบครัวของต้นข้าว วิชัยเป็นอะไรกับต้นข้าว (ตอบคำเรียกญาติคำเดียว)"
    figure:
      src: family-tree.svg
      alt: "แผนผังครอบครัวสามรุ่น รุ่นบนซ้าย: สมศักดิ์ (ชาย) แต่งงานกับบุญมี (หญิง) มีลูกสองคนคือ วิชัย (ชาย พี่ของพ่อ) และธนา (ชาย เป็นพ่อ) รุ่นบนขวา: ประเสริฐ (ชาย) แต่งงานกับจันทร์ (หญิง) มีลูกสองคนคือ มาลี (หญิง เป็นแม่) และสุดา (หญิง น้องของแม่) ธนาแต่งงานกับมาลี มีลูกสองคนคือ ต้นข้าว (หญิง ตัวเรา) และภูผา (ชาย น้องของต้นข้าว)"
    accepted: ["ลุง"]
    misconceptions:
      - { match: "อา", feedback: "อาคือน้องของพ่อ แต่วิชัยเป็นพี่ของพ่อ" }
      - { match: "น้า", feedback: "น้าคือน้องของแม่ วิชัยเป็นญาติทางพ่อ" }
    hints:
      - "วิชัยเป็นพี่หรือน้องของพ่อ"
      - "พี่ผู้ชายของพ่อหรือแม่ใช้คำเรียกเดียวกัน"
    solution: "วิชัยเป็นพี่ชายของพ่อ (ธนา) จึงเป็นลุงของต้นข้าว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.family.family-and-self.p005
    topics: [health.family.family-and-self]
    difficulty: 2
    type: text
    stem: "จากแผนผังครอบครัวของต้นข้าว สุดาเป็นอะไรกับต้นข้าว (ตอบคำเรียกญาติคำเดียว)"
    figure:
      src: family-tree.svg
      alt: "แผนผังครอบครัวสามรุ่น รุ่นบนซ้าย: สมศักดิ์ (ชาย) แต่งงานกับบุญมี (หญิง) มีลูกสองคนคือ วิชัย (ชาย พี่ของพ่อ) และธนา (ชาย เป็นพ่อ) รุ่นบนขวา: ประเสริฐ (ชาย) แต่งงานกับจันทร์ (หญิง) มีลูกสองคนคือ มาลี (หญิง เป็นแม่) และสุดา (หญิง น้องของแม่) ธนาแต่งงานกับมาลี มีลูกสองคนคือ ต้นข้าว (หญิง ตัวเรา) และภูผา (ชาย น้องของต้นข้าว)"
    accepted: ["น้า"]
    misconceptions:
      - { match: "ป้า", feedback: "ป้าคือพี่สาวของพ่อหรือแม่ แต่สุดาเป็นน้องของแม่" }
      - { match: "อา", feedback: "อาคือน้องของพ่อ สุดาเป็นน้องของแม่" }
    hints:
      - "สุดาเป็นญาติทางพ่อหรือทางแม่"
      - "น้องของแม่ไม่ว่าชายหรือหญิงใช้คำเดียวกัน"
    solution: "สุดาเป็นน้องสาวของแม่ (มาลี) จึงเป็นน้าของต้นข้าว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.family.family-and-self.p006
    topics: [health.family.family-and-self]
    difficulty: 2
    type: text
    stem: "จากแผนผังครอบครัวของต้นข้าว บุญมีเป็นอะไรกับต้นข้าว (ตอบคำเรียกญาติคำเดียว)"
    figure:
      src: family-tree.svg
      alt: "แผนผังครอบครัวสามรุ่น รุ่นบนซ้าย: สมศักดิ์ (ชาย) แต่งงานกับบุญมี (หญิง) มีลูกสองคนคือ วิชัย (ชาย พี่ของพ่อ) และธนา (ชาย เป็นพ่อ) รุ่นบนขวา: ประเสริฐ (ชาย) แต่งงานกับจันทร์ (หญิง) มีลูกสองคนคือ มาลี (หญิง เป็นแม่) และสุดา (หญิง น้องของแม่) ธนาแต่งงานกับมาลี มีลูกสองคนคือ ต้นข้าว (หญิง ตัวเรา) และภูผา (ชาย น้องของต้นข้าว)"
    accepted: ["ย่า"]
    misconceptions:
      - { match: "ยาย", feedback: "ยายคือแม่ของแม่ แต่บุญมีเป็นแม่ของพ่อ" }
    hints:
      - "ไล่เส้นจากบุญมีลงมา บุญมีเป็นแม่ของใคร"
      - "แม่ของพ่อกับแม่ของแม่ใช้คำเรียกต่างกัน"
    solution: "บุญมีเป็นแม่ของธนาซึ่งเป็นพ่อ จึงเป็นย่าของต้นข้าว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.family.family-and-self.p007
    topics: [health.family.family-and-self]
    difficulty: 2
    type: numeric
    stem: "บ้านของต้นกล้ามีสมาชิกอยู่ด้วยกัน ได้แก่ ปู่ ย่า พ่อ แม่ อา 1 คน ต้นกล้า และน้องของต้นกล้าอีก 2 คน บ้านนี้มีสมาชิกทั้งหมดกี่คน (ตอบเป็นตัวเลขในหน่วยคน)"
    answer: { value: 8, unit: คน }
    misconceptions:
      - { match: 7, feedback: "อย่าลืมนับต้นกล้าเองด้วย" }
      - { match: 6, feedback: "น่าจะนับน้องเป็นคนเดียว แต่น้องมี 2 คน และต้องนับต้นกล้าด้วย" }
    hints:
      - "เขียนรายชื่อสมาชิกทีละคน แล้วนับ"
      - "น้องมี 2 คน และต้องนับตัวต้นกล้าด้วย"
    solution: "ปู่ 1 + ย่า 1 + พ่อ 1 + แม่ 1 + อา 1 + ต้นกล้า 1 + น้อง 2 = 8 คน บ้านนี้เป็นครอบครัวขยาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.family.family-and-self.p008
    topics: [health.family.family-and-self]
    difficulty: 2
    type: mcq
    stem: "พ่อแม่ของแป้งไปทำงานที่กรุงเทพฯ แป้งอยู่กับตายายที่ขอนแก่น ตายายดูแลแป้งทุกวัน ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "ตายายกับแป้งเป็นครอบครัว เพราะอยู่ด้วยกันและดูแลกัน", correct: true }
      - { id: b, text: "แป้งไม่มีครอบครัว เพราะไม่ได้อยู่กับพ่อแม่", feedback: "ครอบครัวมีหลายรูปแบบ ญาติที่เลี้ยงดูกันก็เป็นครอบครัว และพ่อแม่ของแป้งก็ยังเป็นครอบครัวของแป้ง" }
      - { id: c, text: "ครอบครัวของแป้งดีน้อยกว่าครอบครัวที่มีพ่อแม่อยู่บ้าน", feedback: "ไม่มีรูปแบบครอบครัวใดดีกว่ากัน สิ่งสำคัญคือความรักและการดูแล" }
    hints:
      - "ครอบครัวคือกลุ่มคนที่อยู่ด้วยกันและดูแลกัน"
      - "ทบทวนรูปแบบครอบครัวในบทเรียน"
    solution: "แป้งอยู่ในครอบครัวที่ญาติเลี้ยงดู ตายายดูแลแป้งด้วยความรัก และพ่อแม่ที่ไปทำงานก็ยังเป็นสมาชิกในครอบครัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.family.family-and-self.p009
    topics: [health.family.family-and-self]
    difficulty: 3
    type: mcq
    stem: "ข้าวปั้นวาดรูปเก่ง แต่ยังอ่านหนังสือช้ากว่าเพื่อน ข้อใดแสดงว่าข้าวปั้นรู้จักและเห็นคุณค่าในตนเอง"
    choices:
      - { id: a, text: "ภูมิใจในฝีมือวาดรูป และตั้งใจฝึกอ่านหนังสือทุกวัน", correct: true }
      - { id: b, text: "คิดว่าตัวเองไม่เก่งอะไรเลย เพราะอ่านช้า", feedback: "ทุกคนมีจุดเด่นและจุดด้อย การอ่านช้าไม่ได้ลบความสามารถด้านอื่น" }
      - { id: c, text: "คิดว่าวาดรูปเก่งแล้ว ไม่ต้องฝึกอ่าน", feedback: "จุดด้อยควรฝึกให้ดีขึ้น ไม่ใช่ปล่อยไว้" }
      - { id: d, text: "อวดว่าตัวเองเก่งกว่าทุกคนในห้อง", feedback: "ภูมิใจได้โดยไม่ต้องดูถูกคนอื่น เพื่อนแต่ละคนก็เก่งคนละด้าน" }
    hints:
      - "ความภาคภูมิใจที่ดีมองทั้งจุดเด่นและจุดด้อย"
      - "จุดด้อยคือสิ่งที่ฝึกให้ดีขึ้นได้"
    solution: "ข้าวปั้นภูมิใจในจุดเด่น (วาดรูป) และพัฒนาจุดด้อย (การอ่าน) โดยไม่ดูถูกตัวเองหรือคนอื่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.family.family-and-self.p010
    topics: [health.family.family-and-self]
    difficulty: 3
    type: numeric
    stem: "หลังกินข้าวเย็นมีงานบ้าน 6 อย่าง พ่อ แม่ และลูกอีก 1 คน แบ่งงานกันทำคนละเท่า ๆ กัน แต่ละคนทำงานบ้านกี่อย่าง (ตอบเป็นตัวเลขในหน่วยอย่าง)"
    answer: { value: 2, unit: อย่าง }
    misconceptions:
      - { match: 3, feedback: "ดูเหมือนแบ่งให้ 2 คน แต่ในบ้านมีพ่อ แม่ และลูก รวม 3 คน" }
      - { match: 18, feedback: "การแบ่งเท่า ๆ กันใช้การหาร ไม่ใช่การคูณ" }
    hints:
      - "นับก่อนว่ามีคนช่วยกันกี่คน"
      - "แบ่งงาน 6 อย่างให้คนกลุ่มนั้นเท่า ๆ กัน"
    solution: "มี 3 คน $6 \\div 3 = 2$ อย่างต่อคน เมื่อทุกคนช่วยกัน งานเสร็จเร็วและไม่มีใครเหนื่อยคนเดียว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.family.family-and-self.p011
    topics: [health.family.family-and-self]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นลักษณะของครอบครัวที่อบอุ่นตามวัฒนธรรมไทย (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "หลานไหว้และพูดจาสุภาพกับปู่ย่าตายาย", correct: true }
      - { id: b, text: "พาครอบครัวไปรดน้ำดำหัวผู้ใหญ่ในวันสงกรานต์", correct: true }
      - { id: c, text: "ช่วยเหลือญาติเมื่อเดือดร้อน", correct: true }
      - { id: d, text: "ต่างคนต่างกินข้าวในห้องตัวเองทุกวัน ไม่คุยกัน", feedback: "การไม่พูดคุยกันทำให้ห่างเหิน ครอบครัวอบอุ่นมีเวลาอยู่ร่วมกัน" }
      - { id: e, text: "ไม่ยอมให้อภัยเมื่อน้องทำผิดเล็กน้อย", feedback: "การให้อภัยกันช่วยรักษาความสัมพันธ์ในครอบครัว" }
    hints:
      - "วัฒนธรรมไทยให้ความสำคัญกับการเคารพผู้ใหญ่และการนับถือญาติ"
      - "ข้อที่ถูกมีสามข้อ"
    solution: "ข้อที่ถูกคือ การเคารพผู้ใหญ่ การทำกิจกรรมตามประเพณีร่วมกัน และการช่วยเหลือญาติ ส่วนการไม่คุยกันและไม่ให้อภัยกันทำให้ครอบครัวห่างเหิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.family.family-and-self.p012
    topics: [health.family.family-and-self]
    difficulty: 3
    type: numeric
    stem: "วันสงกรานต์ บัวจะไปรดน้ำดำหัวปู่ ย่า ตา ยาย และลุงอีก 2 คน โดยเตรียมพวงมาลัยให้คนละ 1 พวง พวงละ 25 บาท บัวต้องใช้เงินซื้อพวงมาลัยทั้งหมดกี่บาท (ตอบเป็นตัวเลขในหน่วยบาท)"
    answer: { value: 150, unit: บาท }
    misconceptions:
