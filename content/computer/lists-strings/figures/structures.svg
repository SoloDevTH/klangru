<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="sans-serif" font-size="14">
  <title>เปรียบเทียบสามโครงสร้าง ลิสต์เก็บเรียงตามดัชนีและซ้ำได้ ดิกชันนารีเก็บคู่คีย์กับค่า ใช้ชื่อเมนูหาราคา เซตเก็บสมาชิกไม่ซ้ำ ใส่เชียงใหม่สองครั้งก็เหลือครั้งเดียว</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="900" height="330" fill="#ffffff"/>
