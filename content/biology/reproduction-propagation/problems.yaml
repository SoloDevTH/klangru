  - id: biology.plants.reproduction-propagation.p015
    topics: [biology.plants.reproduction-propagation]
    difficulty: 5
    type: numeric
    stem: "นักเรียนทำแบบจำลองเมล็ดยางนาจากกระดาษ ปล่อยจากความสูง 2 เมตร จับเวลาที่ตกถึงพื้นได้ 2.3 2.5 และ 2.4 วินาที ถ้ามีลมพัดในแนวราบด้วยอัตรา 0.5 เมตรต่อวินาที และเมล็ดเคลื่อนไปกับลมตลอดเวลาที่ตก โดยใช้เวลาเฉลี่ย เมล็ดจะตกห่างจากจุดปล่อยในแนวราบกี่เมตร"
    answer: { value: 1.2, tolerance: 0.02, unit: m }
    hints:
      - "หาเวลาเฉลี่ยของการทดลอง 3 ครั้งก่อน"
      - "ระยะทาง = อัตราเร็วของลม × เวลา"
    misconceptions:
      - { match: 3.6, feedback: "ใช้เวลารวมของ 3 ครั้ง ต้องหารด้วย 3 เพื่อหาเวลาเฉลี่ยก่อน" }
      - { match: 4.8, feedback: "หารเวลาด้วยอัตราเร็ว ต้องคูณกัน (ระยะทาง = อัตราเร็ว × เวลา)" }
    solution: "เวลาเฉลี่ย $= \\frac{2.3 + 2.5 + 2.4}{3} = 2.4$ วินาที ระยะทาง $= 0.5 \\times 2.4 = 1.2$ เมตร ปีกที่ทำให้ตกช้าลงจึงช่วยให้เมล็ดลอยไปได้ไกลขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

