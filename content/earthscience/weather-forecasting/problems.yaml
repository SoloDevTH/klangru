    solution: "ควรงดออกเรือ เตรียมของจำเป็น ติดตามประกาศล่าสุด และอพยพตามคำแนะนำ ไม่ควรเชื่อว่าลมสงบตอนตาพายุผ่านคือพายุหมดแล้ว และไม่ควรออกเรือเพราะคลื่นลมแรงมาถึงก่อนศูนย์กลางพายุ"
