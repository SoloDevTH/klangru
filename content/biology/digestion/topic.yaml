id: biology.animals.digestion
subject: biology
title: { th: การย่อยอาหาร, en: "Digestion in animals and humans" }
summary: การย่อยภายในและภายนอกเซลล์ สัตว์ที่ไม่มีทางเดินอาหาร ทางเดินอาหารไม่สมบูรณ์ของไฮดราและพลานาเรีย ทางเดินอาหารสมบูรณ์ เอนไซม์และการดูดซึมในมนุษย์ และแบคทีเรียในลำไส้
difficulty: 5
minutes: 45
prerequisites: [biology.cells.enzymes]
encompasses:
  - { id: biology.cells.enzymes, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ทางเดินอาหารของไฮดรา พลานาเรีย และไส้เดือนดิน
    src: animal-tracts.svg
    alt: "สามภาพ ซ้ายคือไฮดรา ลำตัวทรงกระบอกสีเขียว มีเทนทาเคิล 4 เส้นที่มีจุดเข็มพิษรอบปากด้านบน ภายในเป็นช่องว่างลำตัวสีส้มที่มีเหยื่ออยู่ ปากเป็นทางเดียวทั้งรับอาหารและขับกาก ผนังลำตัวมี 2 ชั้น กลางคือพลานาเรีย ลำตัวแบนสีม่วงมีจุดรับแสงสองจุดที่หัว ทางเดินอาหารสีส้มแตกแขนงทั่วตัว แขนงหน้าหนึ่งแขนงและแขนงหลังสองแขนง คอหอยสีแดงเข้มยื่นออกทางด้านล่างกลางลำตัว ปากอยู่ที่ปลายคอหอย ขวาคือไส้เดือนดิน ลำตัวยาวเป็นปล้อง ทางเดินอาหารจากบนลงล่าง: ปาก คอหอย หลอดอาหาร กระเพาะพักอาหาร กึ๋นสีน้ำตาล ลำไส้ยาว และทวารหนักที่ปลายล่าง"
    caption: "ไฮดราและพลานาเรียมีช่องเปิดทางเดียว ไส้เดือนดินมีปากและทวารหนัก (วาดโดยทีมคลังรู้ ไม่ได้ใช้มาตราส่วนเดียวกัน)"
  - type: worked-example
    title: เปรียบเทียบการย่อยอาหารของไฮดรากับคน
    problem: "บอกว่าไฮดรากับคนเหมือนและต่างกันอย่างไรในเรื่องทางเดินอาหาร ที่ที่ย่อย และทางขับกาก"
    steps:
      - text: "ไฮดรามีช่องเปิดทางเดียว (ทางเดินอาหารไม่สมบูรณ์) คนมีปากและทวารหนัก (สมบูรณ์)"
      - text: "ไฮดราย่อยภายนอกเซลล์ในช่องว่างลำตัวก่อน แล้วย่อยต่อภายในเซลล์ในฟูดแวคิวโอล"
      - text: "คนย่อยภายนอกเซลล์ในทางเดินอาหารจนได้โมเลกุลเล็กที่สุด แล้วจึงดูดซึมที่ลำไส้เล็ก"
        why: "ทางเดินอาหารที่แบ่งเป็นส่วน ๆ และมีน้ำย่อยหลายชนิดทำให้ย่อยได้สมบูรณ์โดยไม่ต้องย่อยในเซลล์"
      - text: "ไฮดราขับกากทางปาก คนขับกากทางทวารหนัก"
    answer: "เหมือน: ใช้เอนไซม์ย่อยภายนอกเซลล์ ต่าง: ไฮดรามีช่องเปิดทางเดียวและย่อยต่อภายในเซลล์ คนมีทางเดินอาหารสมบูรณ์และย่อยจนเสร็จภายนอกเซลล์"
  - { type: check, problem: biology.animals.digestion.p007, prompt: "ลองคิดข้อดีของทางเดินอาหารแบบสมบูรณ์" }
  - type: figure
    title: โครงสร้างของวิลลัส
    src: villus.svg
    alt: "วิลลัสรูปนิ้วยื่นขึ้นจากผนังลำไส้เล็ก ผิวนอกเป็นเซลล์บุผิวชั้นเดียวที่มีไมโครวิลลัสเป็นขนเล็ก ๆ ด้านนอก ภายในมีหลอดเลือดฝอยสีแดงเป็นวงโค้งและแตกแขนงขวาง และตรงกลางมีหลอดน้ำเหลืองสีเหลืองเรียกว่าแลกทีล ข้างภาพเขียนว่า สารที่เข้าหลอดเลือดฝอยคือกลูโคส กรดอะมิโน วิตามินที่ละลายในน้ำ แร่ธาตุ แล้วไปตามเส้นเลือดดำสู่ตับ สารที่เข้าแลกทีลคือกรดไขมันและกลีเซอรอลที่รวมกลับเป็นไขมัน และวิตามิน A D E K ไปสู่ระบบน้ำเหลือง"
    caption: "ผนังบาง พื้นที่ผิวมาก และหลอดเลือดหนาแน่น ทำให้วิลลัสดูดซึมได้ดี (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ติดตามขนมปังทาเนยในระบบย่อยอาหาร
    problem: "ขนมปังทาเนยมีแป้งเป็นหลักและมีไขมันจากเนย บอกเอนไซม์และผลผลิตตามลำดับอวัยวะจนถึงการดูดซึม"
    steps:
      - text: "ปาก: อะไมเลสในน้ำลายย่อยแป้งบางส่วนเป็นมอลโทส"
      - text: "กระเพาะอาหาร: กรดทำให้อะไมเลสหยุดทำงาน แป้งและไขมันแทบไม่ถูกย่อยในกระเพาะ"
        why: "อะไมเลสทำงานได้ดีที่ pH ใกล้กลาง กรดในกระเพาะทำให้เสียสภาพ"
      - text: "ดูโอดีนัม: โซเดียมไฮโดรเจนคาร์บอเนตสะเทินกรด น้ำดีตีเนยให้แตกเป็นหยดเล็ก อะไมเลสและไลเพสจากตับอ่อนย่อยแป้งเป็นมอลโทส และไขมันเป็นกรดไขมันกับกลีเซอรอล"
      - text: "ผนังลำไส้เล็ก: มอลเทสย่อยมอลโทสเป็นกลูโคส"
      - text: "ดูดซึม: กลูโคสเข้าหลอดเลือดฝอย กรดไขมันและกลีเซอรอลรวมเป็นไขมันแล้วเข้าแลกทีล"
    answer: "แป้ง → มอลโทส → กลูโคส (เข้าเลือด) ไขมัน → กรดไขมัน + กลีเซอรอล (เข้าแลกทีล)"
  - { type: check, problem: biology.animals.digestion.p006, prompt: "ทบทวนบทบาทของน้ำดี" }
glossary:
  - { term: การย่อยภายในเซลล์, definition: "การย่อยอาหารในฟูดแวคิวโอลที่รวมกับไลโซโซม เช่น ในฟองน้ำ อะมีบา" }
  - { term: การย่อยภายนอกเซลล์, definition: "การที่เซลล์หลั่งเอนไซม์ออกมาย่อยอาหารในช่องหรือท่อทางเดินอาหาร" }
  - { term: ทางเดินอาหารไม่สมบูรณ์, definition: "ทางเดินอาหารที่มีช่องเปิดทางเดียว ใช้เป็นทั้งปากและทางขับกาก เช่น ไฮดรา พลานาเรีย" }
  - { term: เข็มพิษ, definition: "โครงสร้างในเซลล์บนเทนทาเคิลของไฮดราและแมงกะพรุน ยิงเส้นใยพิษใส่เหยื่อ (นีมาโทซิสต์)" }
  - { term: แลกทีล, definition: "หลอดน้ำเหลืองในวิลลัส รับไขมันที่ดูดซึมแล้ว" }
  - { term: เพปซิโนเจน, definition: "รูปที่ยังไม่ทำงานของเพปซิน กรดในกระเพาะเปลี่ยนให้เป็นเพปซิน" }
flashcards:
  - { front: "ทางเดินอาหาร 3 แบบและตัวอย่าง", back: "ไม่มีทางเดินอาหาร (ฟองน้ำ) / ไม่สมบูรณ์ (ไฮดรา พลานาเรีย) / สมบูรณ์ (ไส้เดือนดิน นก คน)" }
  - { front: "เอนไซม์จากตับอ่อน", back: "อะไมเลส ทริปซิน ไลเพส และมีโซเดียมไฮโดรเจนคาร์บอเนตสะเทินกรด" }
  - { front: "น้ำดีทำอะไร", back: "ไม่มีเอนไซม์ ทำให้ไขมันแตกเป็นหยดเล็ก ไลเพสจึงย่อยได้เร็ว" }
  - { front: "สารใดเข้าหลอดเลือดฝอย สารใดเข้าแลกทีล", back: "กลูโคส กรดอะมิโน → หลอดเลือดฝอย / กรดไขมัน กลีเซอรอล → แลกทีล" }
  - { front: "ความสำคัญของแบคทีเรียในลำไส้", back: "ย่อยใยอาหารบางส่วน สร้างวิตามินเค และแย่งพื้นที่กับเชื้อก่อโรค" }
