  file: lesson.md
- type: figure
  src: connective-map.svg
  alt: 'แผนภาพคำเชื่อมคู่ 6 กลุ่ม: เพิ่มเติม (不仅…还) ยอมรับ (即使…也) เงื่อนไขที่พอ (只要…就) และที่จำเป็น (只有…才) ไม่มีเงื่อนไข (无论/不管…都) เหตุที่รู้แล้ว (既然…就) ลำดับทันทีและความยิ่ง (一…就, 越…越) และแถวล่างแม้แต่ (连…都) กับยกเว้น (除了…以外)'
  caption: คู่คำเชื่อมจัดตามความหมาย จำว่าแต่ละคู่บอกอะไร แล้วเลือกคู่ให้ตรงกับความหมายที่ต้องการ
- type: check
  problem: chinese.grammar.complex-connectives.p003
  prompt: 'ลองคิดก่อนดูเฉลย: ฝนตกไปแล้วจริงหรือยังไม่เกิด'
- type: worked-example
  title: แปลประโยคไทยที่บอกว่า ‘ไม่ว่า…ก็’
  problem: ไม่ว่าฝนจะตกหนักแค่ไหน เขาก็ยังไปทำงาน
  steps:
  - text: เลือกคู่คำเชื่อม ความหมายคือไม่มีเงื่อนไขใดเปลี่ยนผลได้ จึงใช้ 无论 และ 都
    why: ถ้าเป็นเงื่อนไขที่พอหรือจำเป็นจะใช้ 只要 หรือ 只有 ซึ่งไม่ตรงกับความหมายนี้
  - text: ส่วนที่เป็นเงื่อนไขคือ ‘ฝนตกหนักแค่ไหน’ ใช้ 雨下得多大 (下得 + 多大 ถามระดับ)
    why: ใช้ 多大 ถามระดับ ไม่ใช้ 怎么 ซึ่งถามวิธี
  - text: 'ประโยคหลังวางประธาน 他 ไว้หน้า 都 แล้วตามด้วยกริยา 去上班: 他都去上班'
  answer: 无论雨下得多大，他都去上班。
- type: worked-example
  title: เลือกคู่คำเชื่อมจากความหมายว่า ‘ต้องทำก่อนจึงจะได้ผล’
  problem: ต้องฝึกทุกวัน จึงจะพูดภาษาจีนคล่อง
  steps:
  - text: ดูคำว่า ‘ต้อง…จึง’ ซึ่งเป็นเงื่อนไขที่จำเป็น จึงใช้ 只有 และ 才
    why: 只有 บอกว่าสิ่งนี้เป็นเงื่อนไขเดียวที่จะทำให้ผลเกิด
  - text: 'ใส่เงื่อนไขหลัง 只有: 只有每天练习'
  - text: ใส่ผลหลัง 才 และต่อด้วยคำว่า 能 (能说得流利)
    why: เงื่อนไขที่จำเป็นใช้ 才 ไม่ใช้ 就 และ 才 วางหน้า 能
  answer: 只有每天练习，才能说得流利。
- type: check
  problem: chinese.grammar.complex-connectives.p019
  prompt: 'ทบทวน 只要 กับ 只有 ก่อนไปต่อ: อันไหนบอกว่าเงื่อนไขเพียงพอ อันไหนบอกว่าจำเป็น'
glossary:
- term: 不仅…而且… bùjǐn…érqiě…
  definition: ไม่เพียง…แต่ยัง… ใช้เพิ่มข้อมูล ฝั่งหลังใช้ 而且 หรือ 还 ได้
- term: 即使…也… jíshǐ…yě…
  definition: แม้…ก็… ใช้กับสมมติหรือกรณีสุดโต่ง ไม่ใช้กับเรื่องที่เกิดแล้ว
- term: 只要…就… zhǐyào…jiù…
  definition: ขอแค่…ก็… บอกว่าเงื่อนไขนั้นเพียงพอให้ผลเกิด
- term: 只有…才… zhǐyǒu…cái…
  definition: ต้อง…จึง…/ถึงจะ… บอกว่าเงื่อนไขนั้นจำเป็น ถ้าไม่มีผลจะไม่เกิด
- term: 无论 / 不管…都… wúlùn / bùguǎn…dōu…
  definition: ไม่ว่า…ก็… ใช้กับคำถามหรือทางเลือกหลายทาง ผลไม่เปลี่ยน
- term: 既然…就… jìrán…jiù…
  definition: ในเมื่อ…ก็… ใช้กับเหตุที่รู้กันแล้ว แล้วสรุปหรือแนะนำ
flashcards:
- front: ไม่เพียงฉลาด แต่ยังสวยด้วย
  back: 不仅聪明，而且漂亮。
- front: แม้ฝนตก เราก็จะไป (สมมติ)
  back: 即使下雨，我们也去。
- front: ขอแค่มีเวลา ก็จะไปเยี่ยมเธอ
  back: 只要有时间，就去看你。
- front: ต้องฝึกทุกวัน จึงจะพูดคล่อง
  back: 只有每天练习，才能说得流利。
- front: ไม่ว่าใครมา เราก็ยินดี
  back: 无论谁来，我们都欢迎。
