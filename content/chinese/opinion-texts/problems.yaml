  - มีคำว่า 也 ซึ่งบอกว่ามีผลเสียอีกข้อหนึ่ง
  - นับผลเสียที่ระบุในประโยคเดียวทั้งหมด
  solution: '**2 ข้อ** คือ ทำให้ตอนกลางวันไม่มีแรง (没有精神 (méiyǒu jīngshen)) และทำให้ประสิทธิภาพการเรียนต่ำ (学习效率也不高 (xuéxí xiàolǜ yě bù gāo))'
