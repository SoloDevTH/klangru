<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="sans-serif" font-size="14">
<title>ลำดับขั้นอนุกรมวิธานของเสือโคร่ง แมวบ้าน และสุนัข</title>
<rect x="0" y="0" width="980" height="560" fill="#ffffff"/>
