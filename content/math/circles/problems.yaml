problems:
  - id: math.circ.p001
    topics: [math.geometry.circles]
    difficulty: 1
    type: match
    stem: "จับคู่ชื่อส่วนของวงกลมกับความหมาย"
    pairs:
      - { left: "รัศมี", right: "ส่วนของเส้นตรงจากจุดศูนย์กลางถึงวงกลม" }
      - { left: "คอร์ด", right: "ส่วนของเส้นตรงที่เชื่อมจุดสองจุดบนวงกลม" }
      - { left: "เส้นผ่านศูนย์กลาง", right: "คอร์ดที่ผ่านจุดศูนย์กลาง" }
      - { left: "ส่วนโค้ง", right: "ส่วนหนึ่งของเส้นรอบวง" }
      - { left: "เซกเตอร์", right: "บริเวณที่ล้อมด้วยรัศมีสองเส้นกับส่วนโค้ง" }
      - { left: "เส้นสัมผัส", right: "เส้นตรงที่แตะวงกลมเพียงจุดเดียว" }
    hints:
      - "รัศมีเริ่มที่จุดศูนย์กลาง ส่วนคอร์ดเริ่มและจบบนวงกลม"
      - "เซกเตอร์เป็นบริเวณ (มีพื้นที่) ส่วนโค้งเป็นเส้น (มีความยาว)"
    solution: "รัศมี: จุดศูนย์กลางถึงวงกลม · คอร์ด: เชื่อมสองจุดบนวงกลม · เส้นผ่านศูนย์กลาง: คอร์ดที่ผ่านจุดศูนย์กลาง · ส่วนโค้ง: ส่วนหนึ่งของเส้นรอบวง · เซกเตอร์: บริเวณระหว่างรัศมีสองเส้นกับส่วนโค้ง · เส้นสัมผัส: แตะวงกลมจุดเดียว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.circ.p002
    topics: [math.geometry.circles]
    difficulty: 1
    type: numeric
    stem: "วงกลมรัศมี $10\\ \\mathrm{cm}$ ส่วนโค้งที่รองรับมุมที่จุดศูนย์กลาง $90^\\circ$ ยาวกี่เซนติเมตร (ใช้ $\\pi \\approx 3.14$ ตอบในหน่วย cm)"
    answer: { value: 15.7, tolerance: 0.16, unit: cm }
    hints:
      - "$90^\\circ$ คือหนึ่งในสี่ของหนึ่งรอบ ($360^\\circ$)"
      - "หาเส้นรอบวง $2\\pi r$ แล้วนำมาหนึ่งในสี่"
    misconceptions:
      - { match: 78.5, feedback: "นั่นคือพื้นที่เซกเตอร์ $\\tfrac{1}{4}\\pi r^2$ (หน่วย $\\mathrm{cm^2}$) ส่วนโค้งเป็นความยาว ใช้ $2\\pi r$" }
      - { match: 62.8, feedback: "นั่นคือเส้นรอบวงทั้งวง ส่วนโค้งนี้เป็นเพียง $\\tfrac{90}{360} = \\tfrac{1}{4}$ ของวง" }
    solution: "ส่วนโค้ง $= \\tfrac{90}{360} \\times 2\\pi r \\approx \\tfrac{1}{4} \\times 2 \\times 3.14 \\times 10 = 15.7\\ \\mathrm{cm}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.circ.p003
    topics: [math.geometry.circles]
    difficulty: 2
    type: numeric
    stem: "ขนมหม้อแกงอบในถาดกลมเส้นผ่านศูนย์กลาง $28\\ \\mathrm{cm}$ ตัดจากตรงกลางเป็น 8 ชิ้นเท่ากัน หน้าขนมหนึ่งชิ้นมีพื้นที่กี่ตารางเซนติเมตร (ใช้ $\\pi \\approx 3.14$ ตอบในหน่วย $\\mathrm{cm^2}$)"
    answer: { value: 76.93, tolerance: 0.77, unit: cm² }
    hints:
      - "หนึ่งชิ้นเป็นเซกเตอร์ที่มีขนาด $\\tfrac{1}{8}$ ของวงกลม"
      - "หารัศมีจากเส้นผ่านศูนย์กลางก่อน"
      - "คำนวณ $\\tfrac{1}{8} \\times \\pi r^2$"
    misconceptions:
      - { match: 307.72, feedback: "ดูเหมือนใช้ $28\\ \\mathrm{cm}$ เป็นรัศมี รัศมีคือครึ่งหนึ่งของเส้นผ่านศูนย์กลาง $= 14\\ \\mathrm{cm}$" }
      - { match: 10.99, feedback: "นั่นคือความยาวขอบโค้งของชิ้น ($\\tfrac{1}{8} \\times 2\\pi r$) โจทย์ถามพื้นที่หน้าขนม ใช้ $\\pi r^2$" }
    solution: "$r = 14\\ \\mathrm{cm}$ พื้นที่ทั้งถาด $\\approx 3.14 \\times 14^2 = 615.44\\ \\mathrm{cm^2}$ หนึ่งชิ้น $= 615.44 \\div 8 = 76.93\\ \\mathrm{cm^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.circ.p004
    topics: [math.geometry.circles]
    difficulty: 2
    type: mcq
    stem: "จุด $A$, $B$, $C$ อยู่บนวงกลมที่มีจุดศูนย์กลาง $O$ ถ้า $\\angle AOB = 100^\\circ$ และ $\\angle ACB$ รองรับส่วนโค้ง $AB$ เดียวกัน $\\angle ACB$ มีขนาดเท่าใด"
    choices:
      - { id: a, text: "$50^\\circ$", correct: true }
      - { id: b, text: "$100^\\circ$", feedback: "มุมในส่วนโค้งไม่เท่ากับมุมที่จุดศูนย์กลาง จุด $C$ อยู่ไกลจากส่วนโค้งกว่า $O$ มุมจึงแคบกว่า เป็นครึ่งหนึ่ง" }
      - { id: c, text: "$200^\\circ$", feedback: "ดูเหมือนกลับความสัมพันธ์ มุมที่จุดศูนย์กลางเป็นสองเท่าของมุมในส่วนโค้ง ไม่ใช่กลับกัน" }
      - { id: d, text: "$80^\\circ$", feedback: "ดูเหมือนนำ $180^\\circ - 100^\\circ$ ไม่มีมุมใดในรูปนี้ที่ประกอบกันเป็นเส้นตรง ใช้กฎมุมในส่วนโค้งเป็นครึ่งหนึ่งของมุมที่จุดศูนย์กลาง" }
    hints:
      - "มุมที่จุดศูนย์กลางกับมุมในส่วนโค้งที่รองรับส่วนโค้งเดียวกันสัมพันธ์กันอย่างไร"
      - "มุมในส่วนโค้ง $= \\tfrac{1}{2} \\times$ มุมที่จุดศูนย์กลาง"
    solution: "$\\angle ACB = \\tfrac{1}{2}\\angle AOB = \\tfrac{1}{2} \\times 100^\\circ = 50^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.circ.p005
    topics: [math.geometry.circles]
    difficulty: 3
    type: numeric
    stem: "$AB$ เป็นเส้นผ่านศูนย์กลางของวงกลม และจุด $C$ อยู่บนวงกลม ถ้า $\\angle CAB = 35^\\circ$ แล้ว $\\angle ABC$ มีขนาดกี่องศา (ตอบในหน่วยองศา)"
    answer: { value: 55, unit: องศา }
    hints:
      - "$\\angle ACB$ เป็นมุมในครึ่งวงกลม มีขนาดเท่าใดเสมอ"
      - "มุมภายในของ $\\triangle ABC$ รวมกันได้ $180^\\circ$"
    misconceptions:
      - { match: 145, feedback: "ดูเหมือนนำ $180^\\circ - 35^\\circ$ โดยลืมมุม $C$ ซึ่งเป็นมุมในครึ่งวงกลม มีขนาด $90^\\circ$" }
    solution: "$\\angle ACB = 90^\\circ$ (มุมในครึ่งวงกลม) ดังนั้น $\\angle ABC = 180^\\circ - 90^\\circ - 35^\\circ = 55^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.circ.p006
    topics: [math.geometry.circles]
    difficulty: 3
    type: expression
    stem: "มุม $60^\\circ$ เท่ากับกี่เรเดียน (ตอบในรูปที่มี $\\pi$ เช่น \\pi/4 สำหรับ $45^\\circ$)"
    prefix: "60° ="
    answer: { latex: "\\frac{\\pi}{3}", variables: [] }
    hints:
      - "$180^\\circ = \\pi$ เรเดียน"
      - "คูณจำนวนองศาด้วย $\\tfrac{\\pi}{180}$ แล้วทำเศษส่วนให้เป็นอย่างต่ำ"
    misconceptions:
      - { match: "\\frac{\\pi}{6}", feedback: "ดูเหมือนใช้ $360^\\circ = \\pi$ ที่ถูกคือครึ่งรอบ $180^\\circ = \\pi$ เรเดียน" }
      - { match: "3\\pi", feedback: "ดูเหมือนนำ $180 \\div 60$ ต้องคูณ 60 ด้วย $\\tfrac{\\pi}{180}$ จึงได้ $\\tfrac{60}{180}\\pi$" }
    solution: "$60^\\circ = 60 \\times \\tfrac{\\pi}{180} = \\tfrac{\\pi}{3}$ เรเดียน ($\\approx 1.047$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.circ.p007
    topics: [math.geometry.circles]
    difficulty: 3
    type: numeric
    stem: "วงกลมรัศมี $5\\ \\mathrm{cm}$ ส่วนโค้งที่รองรับมุมที่จุดศูนย์กลาง $1.2$ เรเดียน ยาวกี่เซนติเมตร (ตอบในหน่วย cm)"
    answer: { value: 6, tolerance: 0.06, unit: cm }
    hints:
      - "เมื่อมุมเป็นเรเดียน ความยาวส่วนโค้งคือรัศมีคูณมุม"
      - "ใช้ $s = r\\theta$"
    misconceptions:
      - { match: 15, feedback: "นั่นคือพื้นที่เซกเตอร์ $\\tfrac{1}{2}r^2\\theta$ (หน่วย $\\mathrm{cm^2}$) ส่วนโค้งใช้ $s = r\\theta$" }
      - { match: 0.24, feedback: "ดูเหมือนนำมุมหารด้วยรัศมี ความหมายของเรเดียนคือ ส่วนโค้ง = รัศมี × มุม จึงต้องคูณ" }
    solution: "$s = r\\theta = 5\\ \\mathrm{cm} \\times 1.2 = 6\\ \\mathrm{cm}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.circ.p008
    topics: [math.geometry.circles]
    difficulty: 4
    type: numeric
    stem: "รัศมีวงกลมยาว $9\\ \\mathrm{cm}$ และส่วนโค้งยาว $6.28\\ \\mathrm{cm}$ มุมที่จุดศูนย์กลางที่รองรับส่วนโค้งนี้มีขนาดกี่องศา (ใช้ $\\pi \\approx 3.14$ ตอบในหน่วยองศา)"
    answer: { value: 40, tolerance: 0.4, unit: องศา }
    hints:
      - "เส้นรอบวงทั้งวงยาวเท่าใด"
      - "ส่วนโค้งนี้เป็นเศษส่วนเท่าใดของเส้นรอบวง"
      - "นำเศษส่วนนั้นคูณ $360^\\circ$"
    misconceptions:
      - { match: 0.698, feedback: "นั่นคือมุมในหน่วยเรเดียน ($\\tfrac{s}{r}$) โจทย์ถามเป็นองศา ต้องคูณ $\\tfrac{180}{\\pi}$ หรือใช้เศษส่วนของ $360^\\circ$" }
      - { match: 80, feedback: "ดูเหมือนใช้ $\\pi r$ เป็นเส้นรอบวงทั้งวง เส้นรอบวงคือ $2\\pi r$" }
    solution: "เส้นรอบวง $= 2 \\times 3.14 \\times 9 = 56.52\\ \\mathrm{cm}$ ส่วนโค้งเป็น $\\tfrac{6.28}{56.52} = \\tfrac{1}{9}$ ของวง มุม $= \\tfrac{1}{9} \\times 360^\\circ = 40^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.circ.p009
    topics: [math.geometry.circles]
    difficulty: 4
    type: numeric
    stem: "นาฬิกาแขวนผนังมีเข็มนาทียาว $7\\ \\mathrm{cm}$ ในเวลา 20 นาที ปลายเข็มนาทีเคลื่อนที่เป็นระยะทางตามแนวโค้งกี่เซนติเมตร (ใช้ $\\pi \\approx 3.14$ ตอบในหน่วย cm)"
    answer: { value: 14.65, tolerance: 0.15, unit: cm }
    hints:
      - "เข็มนาทีหมุนครบหนึ่งรอบใน 60 นาที"
      - "20 นาทีคือ $\\tfrac{20}{60} = \\tfrac{1}{3}$ รอบ หรือมุม $120^\\circ$"
      - "ระยะที่ปลายเข็มเคลื่อนที่คือส่วนโค้ง $\\tfrac{1}{3} \\times 2\\pi r$"
    misconceptions:
      - { match: 43.96, feedback: "นั่นคือเส้นรอบวงทั้งวง ซึ่งเข็มนาทีใช้เวลา 60 นาที ใน 20 นาทีเข็มหมุนแค่ $\\tfrac{1}{3}$ รอบ" }
      - { match: 7.33, feedback: "ดูเหมือนลืมคูณ 2 ในเส้นรอบวง $2\\pi r$" }
    solution: "ส่วนโค้ง $= \\tfrac{20}{60} \\times 2\\pi r \\approx \\tfrac{1}{3} \\times 2 \\times 3.14 \\times 7 = \\tfrac{43.96}{3} \\approx 14.65\\ \\mathrm{cm}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.circ.p010
    topics: [math.geometry.circles]
    difficulty: 4
    type: mcq
    stem: "จุด $A$, $B$, $C$, $D$ อยู่บนวงกลม โดย $C$ และ $D$ อยู่บนส่วนโค้งฝั่งเดียวกันของคอร์ด $AB$ ถ้า $\\angle ACB = 40^\\circ$ แล้ว $\\angle ADB$ มีขนาดเท่าใด"
    choices:
      - { id: a, text: "$40^\\circ$", correct: true }
      - { id: b, text: "$80^\\circ$", feedback: "$80^\\circ$ คือมุมที่จุดศูนย์กลาง $\\angle AOB$ แต่ $D$ อยู่บนวงกลม จึงเป็นมุมในส่วนโค้งเหมือน $\\angle ACB$" }
      - { id: c, text: "$140^\\circ$", feedback: "$180^\\circ - 40^\\circ$ ใช้กับจุดที่อยู่ฝั่งตรงข้ามของคอร์ด แต่ $C$ และ $D$ อยู่ฝั่งเดียวกัน" }
      - { id: d, text: "$20^\\circ$", feedback: "ดูเหมือนหารสองซ้ำ $\\angle ACB$ เป็นมุมในส่วนโค้งอยู่แล้ว ไม่ใช่มุมที่จุดศูนย์กลาง" }
    hints:
      - "ทั้ง $\\angle ACB$ และ $\\angle ADB$ รองรับส่วนโค้ง $AB$ เดียวกัน"
      - "แต่ละมุมเป็นครึ่งหนึ่งของ $\\angle AOB$ เท่ากัน"
    solution: "มุมในส่วนโค้งที่รองรับส่วนโค้งเดียวกันเท่ากัน เพราะต่างเป็นครึ่งหนึ่งของ $\\angle AOB = 80^\\circ$ ดังนั้น $\\angle ADB = \\angle ACB = 40^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.circ.p011
    topics: [math.geometry.circles]
    difficulty: 5
    type: numeric
    stem: "ที่ปัดน้ำฝนรถยนต์ยาว $45\\ \\mathrm{cm}$ จากจุดหมุน ยางปัดติดอยู่ช่วงนอก $30\\ \\mathrm{cm}$ (ห่างจากจุดหมุน $15$ ถึง $45\\ \\mathrm{cm}$) แกว่งไปได้มุม $120^\\circ$ บริเวณกระจกที่ถูกปัดมีพื้นที่กี่ตารางเซนติเมตร (ใช้ $\\pi \\approx 3.14$ ตอบในหน่วย $\\mathrm{cm^2}$)"
    answer: { value: 1884, tolerance: 19, unit: cm² }
    hints:
      - "บริเวณที่ถูกปัดคือเซกเตอร์ใหญ่รัศมี $45\\ \\mathrm{cm}$ ที่เจาะเซกเตอร์เล็กรัศมี $15\\ \\mathrm{cm}$ ออก"
      - "มุม $120^\\circ$ คือ $\\tfrac{1}{3}$ ของรอบ"
      - "คำนวณ $\\tfrac{1}{3}\\pi(45^2 - 15^2)$"
    misconceptions:
      - { match: 2119.5, feedback: "นั่นคือเซกเตอร์รัศมี $45\\ \\mathrm{cm}$ ทั้งชิ้น แต่ช่วงใกล้จุดหมุน $15\\ \\mathrm{cm}$ ไม่มียาง ต้องลบเซกเตอร์เล็กออก" }
      - { match: 942, feedback: "ดูเหมือนใช้ความยาวยาง $30\\ \\mathrm{cm}$ เป็นรัศมี ยางไม่ได้เริ่มที่จุดหมุน ต้องใช้ $45^2 - 15^2$ ไม่ใช่ $30^2$" }
    solution: "พื้นที่ $= \\tfrac{120}{360}\\pi(45^2 - 15^2) \\approx \\tfrac{1}{3} \\times 3.14 \\times (2{,}025 - 225) = \\tfrac{1}{3} \\times 3.14 \\times 1{,}800 = 1{,}884\\ \\mathrm{cm^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.circ.p012
    topics: [math.geometry.circles]
    difficulty: 5
    type: numeric
    stem: "วงกลมรัศมี $10\\ \\mathrm{cm}$ มีคอร์ด $AB$ ที่ทำให้ $\\angle AOB = 90^\\circ$ ($O$ คือจุดศูนย์กลาง) ส่วนของวงกลมที่อยู่ระหว่างคอร์ด $AB$ กับส่วนโค้งเล็ก $AB$ มีพื้นที่กี่ตารางเซนติเมตร (ใช้ $\\pi \\approx 3.14$ ตอบในหน่วย $\\mathrm{cm^2}$)"
    answer: { value: 28.5, tolerance: 0.29, unit: cm² }
    hints:
      - "บริเวณนี้คือเซกเตอร์ $AOB$ ที่ตัดสามเหลี่ยม $AOB$ ออก"
      - "เซกเตอร์ $90^\\circ$ คือ $\\tfrac{1}{4}$ ของวงกลม และ $\\triangle AOB$ เป็นสามเหลี่ยมมุมฉากที่มีขายาวเท่ารัศมี"
      - "พื้นที่ $= \\tfrac{1}{4}\\pi r^2 - \\tfrac{1}{2}r^2$"
    misconceptions:
      - { match: 78.5, feedback: "นั่นคือพื้นที่เซกเตอร์ทั้งชิ้น ยังต้องลบพื้นที่สามเหลี่ยม $AOB$ ซึ่งอยู่ระหว่างคอร์ดกับจุดศูนย์กลาง" }
      - { match: 128.5, feedback: "ดูเหมือนบวกพื้นที่สามเหลี่ยมเข้าไป สามเหลี่ยม $AOB$ อยู่ในเซกเตอร์แต่ไม่อยู่ในส่วนของวงกลมนี้ จึงต้องลบออก" }
    solution: "เซกเตอร์ $= \\tfrac{1}{4} \\times 3.14 \\times 10^2 = 78.5\\ \\mathrm{cm^2}$ สามเหลี่ยม $= \\tfrac{1}{2} \\times 10 \\times 10 = 50\\ \\mathrm{cm^2}$ ส่วนของวงกลม $= 78.5 - 50 = 28.5\\ \\mathrm{cm^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.circ.p013
    topics: [math.geometry.circles]
    difficulty: 5
    type: numeric
    stem: "จุด $A$, $B$, $C$ อยู่บนวงกลมจุดศูนย์กลาง $O$ และ $\\angle ACB$ รองรับส่วนโค้ง $AB$ เดียวกับ $\\angle AOB$ ถ้า $\\angle AOB = (3x - 10)^\\circ$ และ $\\angle ACB = (x + 15)^\\circ$ จงหาค่า $x$"
    answer: { value: 40 }
    hints:
      - "มุมที่จุดศูนย์กลางเป็นสองเท่าของมุมในส่วนโค้งที่รองรับส่วนโค้งเดียวกัน"
      - "ตั้งสมการ $3x - 10 = 2(x + 15)$"
      - "กระจายวงเล็บแล้วรวม $x$ ไว้ข้างเดียว"
    misconceptions:
      - { match: 12.5, feedback: "ดูเหมือนตั้งให้สองมุมเท่ากัน มุมที่จุดศูนย์กลางเป็นสองเท่าของมุมในส่วนโค้ง จึงต้องเป็น $3x - 10 = 2(x + 15)$" }
      - { match: 7, feedback: "ดูเหมือนคูณ 2 ผิดข้าง ($2(3x - 10) = x + 15$) มุมที่จุดศูนย์กลาง $\\angle AOB$ เป็นมุมที่ใหญ่กว่า ต้องเท่ากับสองเท่าของ $\\angle ACB$" }
    solution: "$3x - 10 = 2(x + 15) = 2x + 30$ → $x = 40$ ตรวจ: $\\angle AOB = 110^\\circ$ และ $\\angle ACB = 55^\\circ$ ซึ่งเป็นครึ่งหนึ่งพอดี ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.circ.p014
    topics: [math.geometry.circles]
    difficulty: 1
    type: mcq
    stem: "เส้นสัมผัสวงกลมกับรัศมีที่ลากไปยังจุดสัมผัสทำมุมกันเท่าใด"
    choices:
      - { id: a, text: "$90^\\circ$", correct: true }
      - { id: b, text: "$180^\\circ$", feedback: "ถ้าเป็น $180^\\circ$ เส้นสัมผัสกับรัศมีจะอยู่ในแนวเดียวกัน และเส้นนั้นจะผ่านเข้าไปในวงกลม ไม่ใช่แค่แตะ" }
      - { id: c, text: "$45^\\circ$", feedback: "ถ้าเอียงเป็นมุมแหลม เส้นจะตัดเข้าไปในวงกลม ไม่ใช่แตะเพียงจุดเดียว" }
      - { id: d, text: "ขึ้นกับขนาดของวงกลม", feedback: "สมบัตินี้จริงกับวงกลมทุกขนาด" }
    hints:
      - "เส้นสัมผัสแตะวงกลมเพียงจุดเดียว"
      - "จุดสัมผัสเป็นจุดบนเส้นสัมผัสที่อยู่ใกล้จุดศูนย์กลางที่สุด ระยะที่สั้นที่สุดจากจุดไปยังเส้นตรงคือระยะที่ตั้งฉาก"
    solution: "เส้นสัมผัสตั้งฉากกับรัศมีที่จุดสัมผัสเสมอ จึงทำมุม $90^\\circ$ เหตุผล: จุดอื่นบนเส้นสัมผัสอยู่นอกวงกลมทั้งหมด จึงห่างจากจุดศูนย์กลางมากกว่ารัศมี จุดสัมผัสจึงเป็นจุดที่ใกล้ที่สุด และเส้นที่สั้นที่สุดจากจุดไปยังเส้นตรงต้องตั้งฉาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.circ.p015
    topics: [math.geometry.circles]
    difficulty: 2
    type: numeric
    stem: "รูปสี่เหลี่ยม $ABCD$ แนบในวงกลม (จุดยอดทั้งสี่อยู่บนวงกลม) ถ้า $\\angle DAB = 105^\\circ$ มุม $BCD$ มีขนาดกี่องศา"
    figure: { src: cyclic-quadrilateral.svg, alt: "รูปสี่เหลี่ยม ABCD ที่จุดยอดทั้งสี่อยู่บนวงกลม A อยู่ด้านบน B ซ้าย C ล่าง D ขวา มุมที่ A ระบุว่า 105 องศา มุมที่ C มีเครื่องหมายคำถาม" }
    answer: { value: 75, unit: องศา }
    hints:
      - "มุม $A$ กับมุม $C$ เป็นมุมตรงข้ามของรูปสี่เหลี่ยมแนบในวงกลม"
      - "มุมตรงข้ามของรูปสี่เหลี่ยมแนบในวงกลมรวมกันได้ $180^\\circ$"
    misconceptions:
      - { match: 105, feedback: "มุมตรงข้ามของรูปสี่เหลี่ยมแนบในวงกลมไม่เท่ากัน (ยกเว้นเป็นมุมฉากทั้งคู่) แต่รวมกันได้ $180^\\circ$" }
      - { match: 255, feedback: "ใช้ $360^\\circ$ ซึ่งเป็นผลรวมของมุมทั้งสี่มุม สำหรับมุมตรงข้ามคู่เดียวรวมกันได้ $180^\\circ$" }
    solution: "$\\angle A$ รองรับส่วนโค้ง $BCD$ และ $\\angle C$ รองรับส่วนโค้ง $BAD$ สองส่วนโค้งรวมกันเป็นวงกลมทั้งวง ($360^\\circ$ ที่จุดศูนย์กลาง) มุมในส่วนโค้งเป็นครึ่งหนึ่ง จึงรวมกันได้ $180^\\circ$ ดังนั้น $\\angle BCD = 180^\\circ - 105^\\circ = 75^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.circ.p016
    topics: [math.geometry.circles]
    difficulty: 2
    type: numeric
    stem: "ชิงช้าในสนามเด็กเล่นมีโซ่ยาว $2.5\\ \\mathrm{m}$ จากจุดแขวน เด็กแกว่งชิงช้าจากข้างหนึ่งไปอีกข้างหนึ่งได้มุม $60^\\circ$ ที่นั่งเคลื่อนที่ไปตามแนวโค้งยาวกี่เมตร (ใช้ $\\pi \\approx 3.14$ ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 2.62, tolerance: 0.03, unit: m }
    hints:
      - "ที่นั่งเคลื่อนที่บนส่วนโค้งของวงกลมรัศมี $2.5\\ \\mathrm{m}$"
      - "ส่วนโค้ง $= \\tfrac{60}{360} \\times 2\\pi r$"
    misconceptions:
      - { match: 150, feedback: "คูณรัศมีกับมุมที่เป็นองศาตรง ๆ สูตร $s = r\\theta$ ใช้ได้เมื่อ $\\theta$ เป็นเรเดียน ($60^\\circ = \\tfrac{\\pi}{3}$)" }
      - { match: 15.7, feedback: "นั่นคือเส้นรอบวงทั้งวง มุม $60^\\circ$ เป็นเพียง $\\tfrac{1}{6}$ ของรอบ" }
    solution: "ส่วนโค้ง $= \\tfrac{60}{360} \\times 2 \\times 3.14 \\times 2.5 = \\tfrac{1}{6} \\times 15.7 \\approx 2.62\\ \\mathrm{m}$ หรือใช้เรเดียน: $2.5 \\times \\tfrac{\\pi}{3} \\approx 2.62\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.circ.p017
    topics: [math.geometry.circles]
    difficulty: 3
    type: numeric
    stem: "วงกลมจุดศูนย์กลาง $O$ รัศมี $13\\ \\mathrm{cm}$ มีคอร์ด $AB$ ที่อยู่ห่างจาก $O$ เป็นระยะ $5\\ \\mathrm{cm}$ (วัดตั้งฉาก) ตามภาพ คอร์ด $AB$ ยาวกี่เซนติเมตร"
    figure: { src: chord-distance.svg, alt: "วงกลมจุดศูนย์กลาง O มีคอร์ด AB แนวนอนอยู่ใต้ O ลากเส้นตั้งฉากจาก O ลงไปพบคอร์ดยาว 5 และลากรัศมีจาก O ไปยัง B ยาว 13 ไม่ได้บอกความยาวของคอร์ด" }
    answer: { value: 24, unit: cm }
    hints:
      - "เส้นตั้งฉากจากจุดศูนย์กลางไปยังคอร์ดแบ่งครึ่งคอร์ดเสมอ"
      - "สามเหลี่ยมที่มีรัศมี 13 เป็นด้านตรงข้ามมุมฉาก และขาข้างหนึ่งยาว 5 ใช้ทฤษฎีบทพีทาโกรัสหาครึ่งคอร์ด"
    misconceptions:
      - { match: 12, feedback: "นั่นคือครึ่งหนึ่งของคอร์ด เส้นตั้งฉากจาก $O$ แบ่งคอร์ดออกเป็นสองส่วนเท่ากัน คอร์ดทั้งเส้นจึงยาวสองเท่า" }
      - { match: 16, feedback: "ดูเหมือนนำ $13 - 5 = 8$ แล้วคูณ 2 ด้านในสามเหลี่ยมมุมฉากต้องใช้ทฤษฎีบทพีทาโกรัส ไม่ใช่ลบกันตรง ๆ" }
    solution: "ครึ่งคอร์ด $= \\sqrt{13^2 - 5^2} = \\sqrt{169 - 25} = \\sqrt{144} = 12\\ \\mathrm{cm}$ เส้นตั้งฉากจาก $O$ แบ่งครึ่งคอร์ด จึงได้ $AB = 2 \\times 12 = 24\\ \\mathrm{cm}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.circ.p018
    topics: [math.geometry.circles]
    difficulty: 3
    type: numeric
    stem: "จากจุด $P$ นอกวงกลม ลากเส้นสัมผัส $PA$ และ $PB$ ไปแตะวงกลมที่จุด $A$ และ $B$ ตามภาพ ถ้า $\\angle AOB = 130^\\circ$ ($O$ คือจุดศูนย์กลาง) มุม $APB$ มีขนาดกี่องศา"
    figure: { src: tangents-external-point.svg, alt: "วงกลมจุดศูนย์กลาง O จุด P อยู่นอกวงกลมทางขวา เส้นสัมผัส PA และ PB แตะวงกลมที่ A ด้านบนและ B ด้านล่าง มีเครื่องหมายมุมฉากที่ A และ B ระหว่างรัศมีกับเส้นสัมผัส มุม AOB ระบุว่า 130 องศา มุม APB มีเครื่องหมายคำถาม" }
    answer: { value: 50, unit: องศา }
    hints:
      - "รูปสี่เหลี่ยม $OAPB$ มีมุมภายในรวม $360^\\circ$"
      - "มุม $OAP$ และ $OBP$ เป็นมุมฉาก เพราะเส้นสัมผัสตั้งฉากกับรัศมี"
    misconceptions:
      - { match: 130, feedback: "มุมที่ $P$ ไม่เท่ากับมุมที่จุดศูนย์กลาง ในรูปสี่เหลี่ยม $OAPB$ มีมุมฉากสองมุม มุมที่ $P$ กับมุมที่ $O$ จึงรวมกันได้ $180^\\circ$" }
      - { match: 65, feedback: "นั่นคือครึ่งหนึ่งของ $130^\\circ$ ซึ่งเป็นกฎของมุมในส่วนโค้ง แต่ $P$ อยู่นอกวงกลม ต้องใช้รูปสี่เหลี่ยม $OAPB$" }
    solution: "ในรูปสี่เหลี่ยม $OAPB$: $\\angle OAP = \\angle OBP = 90^\\circ$ (เส้นสัมผัสตั้งฉากกับรัศมี) จึงได้ $\\angle APB = 360^\\circ - 90^\\circ - 90^\\circ - 130^\\circ = 50^\\circ$ สังเกตว่ามุมที่ $P$ (มุมที่ล้อมวงกลม) $= 180^\\circ -$ มุมที่จุดศูนย์กลางเสมอ และเส้นสัมผัสสองเส้นจาก $P$ ยาวเท่ากัน $PA = PB$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.circ.p019
    topics: [math.geometry.circles]
    difficulty: 4
    type: numeric
    stem: "สระน้ำกลมในสวนสาธารณะมีรัศมี $8\\ \\mathrm{m}$ น้องยืนที่จุด $P$ ห่างจากจุดศูนย์กลางสระ $17\\ \\mathrm{m}$ แล้วเดินเป็นเส้นตรงไปยังขอบสระในแนวที่แตะขอบสระพอดี (แนวเส้นสัมผัส) ระยะที่เดินยาวกี่เมตร"
    answer: { value: 15, unit: m }
    hints:
      - "รัศมีที่ลากไปยังจุดสัมผัสตั้งฉากกับเส้นสัมผัส จึงเกิดสามเหลี่ยมมุมฉาก"
      - "ด้านตรงข้ามมุมฉากคือระยะจาก $P$ ถึงจุดศูนย์กลาง ($17$) ขาข้างหนึ่งคือรัศมี ($8$)"
    misconceptions:
      - { match: 9, feedback: "นั่นคือ $17 - 8$ ซึ่งเป็นระยะจาก $P$ ถึงขอบสระในแนวตรงเข้าหาจุดศูนย์กลาง ไม่ใช่แนวเส้นสัมผัส ต้องใช้ทฤษฎีบทพีทาโกรัส" }
      - { match: 18.79, feedback: "บวกกำลังสองทั้งสองด้าน แต่ $17$ เป็นด้านตรงข้ามมุมฉาก (ยาวที่สุด) จึงต้องลบ: $\\sqrt{17^2 - 8^2}$" }
    solution: "สามเหลี่ยม $O$–จุดสัมผัส–$P$ มีมุมฉากที่จุดสัมผัส ระยะที่เดิน $= \\sqrt{17^2 - 8^2} = \\sqrt{289 - 64} = \\sqrt{225} = 15\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.circ.p020
    topics: [math.geometry.circles]
    difficulty: 4
    type: numeric
    stem: "บนวงกลมหนึ่งหน่วย (รัศมี 1) มุมที่จุดศูนย์กลางมุมหนึ่งรองรับส่วนโค้งยาว $0.8$ หน่วย ถ้าใช้มุมเดียวกันนี้กับวงกลมรัศมี $15\\ \\mathrm{cm}$ ส่วนโค้งที่รองรับจะยาวกี่เซนติเมตร"
    answer: { value: 12, unit: cm }
    hints:
      - "วงกลมทุกวงคล้ายกัน เมื่อมุมเท่าเดิม ความยาวส่วนโค้งแปรผันตรงกับรัศมี"
      - "ส่วนโค้งบนวงกลมหนึ่งหน่วยคือขนาดของมุมในหน่วยเรเดียน จึงใช้ $s = r\\theta$ ได้"
    misconceptions:
      - { match: 15.8, feedback: "บวก $0.8$ เข้ากับรัศมี แต่ส่วนโค้งขยายตามรัศมีแบบคูณ ไม่ใช่บวก" }
      - { match: 18.75, feedback: "หาร $15 \\div 0.8$ ต้องคูณ: รัศมีใหญ่ขึ้น 15 เท่า ส่วนโค้งก็ยาวขึ้น 15 เท่า" }
    solution: "มุมนี้มีขนาด $0.8$ เรเดียน (ความยาวส่วนโค้งบนวงกลมหนึ่งหน่วย) บนวงกลมรัศมี 15: $s = r\\theta = 15 \\times 0.8 = 12\\ \\mathrm{cm}$ หรือคิดว่ารัศมีใหญ่ขึ้น 15 เท่า ส่วนโค้งที่รองรับมุมเดียวกันก็ยาวขึ้น 15 เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.circ.p021
    topics: [math.geometry.circles]
    difficulty: 4
    type: expression
    stem: "เซกเตอร์ของวงกลมรัศมี $6\\ \\mathrm{cm}$ มีมุมที่จุดศูนย์กลาง $120^\\circ$ เซกเตอร์นี้มีพื้นที่กี่ตารางเซนติเมตร ตอบค่าที่แม่นยำในรูปพหุคูณของ $\\pi$"
    prefix: "A ="
    answer: { latex: "12\\pi", variables: [] }
    hints:
      - "$120^\\circ$ เป็นเศษเท่าใดของ $360^\\circ$"
      - "พื้นที่เซกเตอร์ $= \\tfrac{120}{360} \\times \\pi r^2$ ไม่ต้องแทนค่า $\\pi$"
    misconceptions:
      - { match: "4\\pi", feedback: "นั่นคือความยาวส่วนโค้ง ($\\tfrac{1}{3} \\times 2\\pi \\times 6$) โจทย์ถามพื้นที่ ใช้ $\\pi r^2$" }
      - { match: "36\\pi", feedback: "นั่นคือพื้นที่วงกลมทั้งวง เซกเตอร์ $120^\\circ$ เป็นเพียง $\\tfrac{1}{3}$ ของวงกลม" }
      - { match: "720\\pi", feedback: "คูณ $\\pi r^2$ ด้วย 120 ตรง ๆ ต้องคูณด้วยสัดส่วน $\\tfrac{120}{360}$" }
    solution: "$A = \\tfrac{120}{360} \\times \\pi \\times 6^2 = \\tfrac{1}{3} \\times 36\\pi = 12\\pi\\ \\mathrm{cm^2}$ (ประมาณ $37.7\\ \\mathrm{cm^2}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.circ.p022
    topics: [math.geometry.circles]
    difficulty: 5
    type: numeric
    stem: "ซุ้มประตูโค้งหน้าวัดเป็นส่วนโค้งของวงกลม ฐานซุ้มกว้าง $8\\ \\mathrm{m}$ และยอดโค้งสูงจากแนวฐาน $2\\ \\mathrm{m}$ ตามภาพ วงกลมที่ส่วนโค้งนี้อยู่มีรัศมีกี่เมตร"
    figure: { src: arch.svg, alt: "ส่วนโค้งของวงกลมคล้ายซุ้มประตู ฐานที่เชื่อมปลายทั้งสองยาว 8 m เส้นประตั้งฉากจากกลางฐานขึ้นไปถึงยอดโค้งยาว 2 m ไม่ได้แสดงจุดศูนย์กลางของวงกลม" }
    answer: { value: 5, unit: m }
    hints:
      - "ฐานซุ้มเป็นคอร์ด และเส้นจากกลางคอร์ดขึ้นไปถึงยอดโค้งอยู่บนเส้นที่ผ่านจุดศูนย์กลาง"
