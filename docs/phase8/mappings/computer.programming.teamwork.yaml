topic: computer.programming.teamwork
rows:
  - { framework: acm-cs2023, indicators: ["SE-Teamwork"], coverage: full, note: "บทบาทในทีม กระบวนการแบบ agile (รอบสั้น บอร์ดงาน คุยสั้นทุกวัน ทบทวนท้ายรอบ) การสื่อสาร กติกาทีม การแก้ความขัดแย้งด้วยข้อมูลจากผู้ใช้ และการเขียนโปรแกรมเป็นคู่" }
  - { framework: acm-cs2023, indicators: ["SE-Tools"], coverage: full, note: "แนวคิดของระบบควบคุมเวอร์ชัน คอมมิต กิ่ง คำขอรวม การรวม และความขัดแย้งในการรวม (ตรวจเครื่องหมายด้วย git จริงในเครื่องผู้เขียน) และ IDE" }
  - { framework: csta-k12-cs, indicators: ["3B-AP-23"], coverage: full, note: "ประเมินคุณภาพของโปรแกรมผ่านการตรวจโค้ดตามลำดับ ถูกต้อง ปลอดภัย อ่านง่าย มีกรณีทดสอบ และเขียนความเห็นที่เจาะจงและสุภาพ (ตัวอย่างฟังก์ชันคะแนนติดลบ ค่าเฉลี่ยของลิสต์ว่าง)" }
  - { framework: csta-k12-cs, indicators: ["1B-AP-16", "3A-AP-22"], coverage: partial, note: "บทบาทในทีม (ผู้แทนผู้ใช้ ผู้ออกแบบ นักพัฒนา ผู้ทดสอบ ผู้ประสานงาน) การสลับบทบาท และเครื่องมือทำงานร่วมกัน แต่การรับบทบาทและสร้างชิ้นงานร่วมกับทีมจริงทำนอกแอป" }
  - { framework: csta-k12-cs, indicators: ["2-AP-18"], coverage: partial, note: "แตกงาน ระบุงานที่ต้องรอกัน วาดแผนภูมิแกนต์ หาเวลาที่สั้นที่สุด และติดตามความคืบหน้าด้วยอัตราการทำงาน แต่การดูแลกำหนดเวลาของโครงงานจริงทำนอกแอป" }
  - { framework: csta-k12-cs, indicators: ["2-IC-22"], coverage: partial, note: "การระดมจากมวลชน (วิกิพีเดีย OpenStreetMap) และการออกแบบแบบสำรวจที่เป็นกลางและได้ผู้ตอบหลายกลุ่ม แต่การเก็บความเห็นจากคนจำนวนมากจริงทำนอกแอป" }
  - { framework: csta-k12-cs, indicators: ["3A-IC-27"], coverage: partial, note: "เครื่องมือออนไลน์สำหรับทำงานกับคนต่างโรงเรียน ต่างอาชีพ ต่างประเทศ การคิดเขตเวลา และการเคารพวัฒนธรรมการทำงาน แต่ไม่ได้ทำโครงงานร่วมกับคนต่างวัฒนธรรมจริง" }
  - { framework: csta-k12-cs, indicators: ["3B-AP-20"], coverage: partial, note: "ขั้นตอนใช้ Git กับคลังกลาง คำขอรวม IDE docstring และ README และการไม่คอมมิตรหัสผ่าน แต่ผู้เรียนไม่ได้ใช้คลังจริงในโครงงานกลุ่ม" }
  - { framework: au-ac9-digital-technologies, indicators: ["AC9TDI8P12", "AC9TDI10P12"], coverage: partial, note: "แชร์เนื้อหาออนไลน์อย่างรับผิดชอบ (ตั้งสิทธิ์ แยกข้อมูลส่วนบุคคล) บอร์ดงานแบบ agile แผนภูมิแกนต์ คะแนนความเสี่ยง (โอกาส × ผลกระทบ) และผู้รับผิดชอบ แต่การบริหารโครงงานจริงด้วยเครื่องมือทำนอกแอป" }
