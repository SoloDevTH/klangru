    choices:
      - { id: a, text: "$\\mathrm{XCl_2}$", correct: true, feedback: "ถูก X เสียอิเล็กตรอน 2 ตัวง่าย เป็น X²⁺" }
      - { id: b, text: "$\\mathrm{XCl}$", feedback: "IE₂ ยังไม่กระโดดมาก X จึงเสียได้ 2 ตัว" }
      - { id: c, text: "$\\mathrm{XCl_3}$", feedback: "IE₃ สูงกว่า IE₂ ราว 5 เท่า การเสียตัวที่ 3 ต้องดึงจากชั้นใน จึงไม่เกิดในสารประกอบทั่วไป" }
      - { id: d, text: "$\\mathrm{X_2Cl}$", feedback: "X เป็นโลหะที่เสียอิเล็กตรอน คลอรีนรับได้ตัวละ 1 จึงต้องมี Cl มากกว่า" }
