problems:
  - id: health.safety.medicine-use.p001
    topics: [health.safety.medicine-use]
    difficulty: 1
    type: mcq
    stem: "ข้าวปั้นปวดหัวตอนอยู่บ้านคนเดียว ในตู้มียาหลายกล่อง ข้าวปั้นควรทำอย่างไร"
    choices:
      - { id: a, text: "โทรบอกพ่อแม่หรือผู้ใหญ่ที่ไว้ใจ และให้ผู้ใหญ่เป็นคนบอกหรือให้ยา", correct: true }
      - { id: b, text: "เลือกยากล่องที่สวยที่สุดมากินเอง", feedback: "สีหรือรูปกล่องไม่ได้บอกว่ายาตรงกับอาการ เด็กไม่ควรเลือกยากินเอง" }
      - { id: c, text: "กินยาที่เพื่อนเคยให้ไว้", feedback: "ยาของคนอื่นอาจไม่ตรงโรคและขนาดไม่เหมาะกับเรา" }
    hints:
      - "เด็กใช้ยาเมื่อผู้ใหญ่ แพทย์ หรือเภสัชกรเป็นคนให้"
      - "เลือกข้อที่มีผู้ใหญ่ช่วยตัดสินใจ"
    solution: "เด็กไม่ควรหยิบยากินเอง ให้บอกผู้ใหญ่ที่ไว้ใจ ผู้ใหญ่จะเลือกยาและขนาดที่เหมาะ หรือพาไปพบเภสัชกรหรือแพทย์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.medicine-use.p002
    topics: [health.safety.medicine-use]
    difficulty: 1
    type: text
    stem: "ยาที่ อย. อนุญาตให้ขายในร้านขายของชำได้ มีคำใดเขียนอยู่ในกรอบสีเขียวบนฉลาก"
    accepted: ["ยาสามัญประจำบ้าน", "ยาสามัญ"]
    misconceptions:
      - { match: "ยาอันตราย", feedback: "ยาอันตรายต้องขายในร้านยาที่มีเภสัชกร ไม่ขายในร้านขายของชำ" }
    hints:
      - "เป็นชื่อของยาที่ทุกบ้านควรมีไว้"
      - "ชื่อนี้คือชื่อของบทเรียนนี้"
    solution: "ยาสามัญประจำบ้าน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.medicine-use.p003
    topics: [health.safety.medicine-use]
    difficulty: 2
    type: match
    stem: "จับคู่อาการกับยาสามัญประจำบ้านที่ใช้บรรเทาอาการนั้น"
    pairs:
      - { left: "ท้องเสีย", right: "ผงน้ำตาลเกลือแร่" }
      - { left: "ไข้ ปวดหัว", right: "ยาเม็ดพาราเซตามอล" }
      - { left: "แพ้ น้ำมูกไหล", right: "ยาเม็ดคลอร์เฟนิรามีน" }
      - { left: "ท้องอืด ท้องเฟ้อ", right: "ยาลดกรด อะลูมินา-แมกนีเซีย" }
      - { left: "แผลถลอก", right: "ยาใส่แผล โพวิโดน-ไอโอดีน" }
    hints:
      - "ผงน้ำตาลเกลือแร่ทดแทนน้ำที่เสียไป"
      - "ยาที่ทาที่แผลไม่ใช่ยากิน"
    solution: "ท้องเสีย-ผงน้ำตาลเกลือแร่, ไข้-พาราเซตามอล, แพ้-คลอร์เฟนิรามีน, ท้องอืด-ยาลดกรด, แผลถลอก-โพวิโดน-ไอโอดีน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.medicine-use.p004
    topics: [health.safety.medicine-use]
    difficulty: 2
    type: mcq
    stem: "จากฉลากยาในภาพ ยานี้ใช้บรรเทาอาการใด"
    figure:
      src: medicine-label.svg
      alt: "ฉลากยาตัวอย่างสมมติ ยาสามัญประจำบ้าน ยาเม็ดแก้แพ้ ลดน้ำมูก คลอร์เฟนิรามีน สรรพคุณ บรรเทาอาการแพ้ เช่น ลมพิษ น้ำมูกไหล คำเตือน ไม่ควรใช้ติดต่อกันนานเกิน 7 วัน ยานี้อาจทำให้ง่วงซึม ไม่ควรขับขี่ยานพาหนะ เก็บในที่แห้ง ไม่โดนแสงแดด ไม่เกิน 30 องศาเซลเซียส เก็บให้พ้นมือเด็ก MFG. 03/2569 EXP. 08/2571"
    choices:
      - { id: a, text: "อาการแพ้ เช่น ลมพิษ น้ำมูกไหล", correct: true }
      - { id: b, text: "ไข้และปวดหัว", feedback: "ฉลากไม่ได้เขียนว่าลดไข้ ยาลดไข้คือยาอื่น เช่น พาราเซตามอล" }
      - { id: c, text: "ท้องเสีย", feedback: "ยาบรรเทาท้องเสียคือผงน้ำตาลเกลือแร่ ดูหัวข้อสรรพคุณบนฉลาก" }
    hints:
      - "ดูหัวข้อ สรรพคุณ บนฉลาก"
      - "สรรพคุณบอกว่ายาใช้กับอาการอะไร"
    solution: "สรรพคุณบนฉลากเขียนว่า บรรเทาอาการแพ้ เช่น ลมพิษ น้ำมูกไหล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.medicine-use.p005
    topics: [health.safety.medicine-use]
    difficulty: 2
    type: numeric
    stem: "ฉลากยาเขียนว่า EXP. 08/2571 ยานี้ใช้ได้ถึงวันที่เท่าไรของเดือนสิงหาคม 2571 (ตอบเป็นวันที่)"
    answer: { value: 31 }
    misconceptions:
      - { match: 1, feedback: "ถ้าฉลากบอกเฉพาะเดือนและปี ยาใช้ได้ถึงวันสุดท้ายของเดือน ไม่ใช่วันแรก" }
      - { match: 8, feedback: "08 คือเดือนที่ 8 (สิงหาคม) ไม่ใช่วันที่" }
    hints:
      - "08 คือเดือน 2571 คือปี ฉลากไม่ได้บอกวันที่"
      - "ถ้าไม่บอกวันที่ ให้นับวันสุดท้ายของเดือนนั้น เดือนสิงหาคมมีกี่วัน"
    solution: "ยาหมดอายุวันสุดท้ายของเดือนสิงหาคม คือวันที่ 31 สิงหาคม 2571"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.medicine-use.p006
    topics: [health.safety.medicine-use]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนที่ผู้ใหญ่ควรทำก่อนให้ยาสามัญประจำบ้านแก่เด็กที่ไม่สบาย"
    items:
      - "ถามอาการว่าเป็นอะไร ตั้งแต่เมื่อไร"
      - "เลือกยาที่สรรพคุณตรงกับอาการ"
      - "อ่านฉลาก ขนาด วิธีใช้ คำเตือน และวันสิ้นอายุ"
      - "สังเกตว่ายาไม่มีลักษณะเสื่อม"
      - "ให้ยาตามขนาดและเวลาที่ฉลากบอก"
    hints:
      - "ต้องรู้ก่อนว่าป่วยเป็นอะไร จึงจะเลือกยาได้"
      - "ตรวจยาให้เรียบร้อยก่อนให้ยาเป็นขั้นสุดท้าย"
    solution: "ถามอาการ → เลือกยาตรงอาการ → อ่านฉลากและวันสิ้นอายุ → สังเกตลักษณะยา → ให้ยาตามขนาดและเวลา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.medicine-use.p007
    topics: [health.safety.medicine-use]
    difficulty: 2
    type: mcq
    stem: "พี่ชายของฝนมียาแก้ไอที่หมอให้มาเมื่อเดือนก่อน วันนี้ฝนไอเหมือนพี่ ฝนควรทำอย่างไร"
    choices:
      - { id: a, text: "ไม่ใช้ยาของพี่ บอกพ่อแม่ให้พาไปพบแพทย์หรือเภสัชกร", correct: true }
      - { id: b, text: "กินยาของพี่ เพราะอาการเหมือนกัน", feedback: "ยาของใครของคนนั้น อาการคล้ายกันอาจเป็นคนละโรค และขนาดยาของพี่อาจไม่เหมาะกับฝน" }
      - { id: c, text: "กินยาของพี่ครึ่งหนึ่ง เพราะฝนตัวเล็กกว่า", feedback: "การแบ่งยาเองไม่ได้ทำให้ขนาดถูกต้อง ต้องให้แพทย์หรือเภสัชกรเป็นผู้กำหนด" }
    hints:
      - "นึกถึงหลักถูกคน"
      - "ยาที่แพทย์สั่งเป็นยาเฉพาะของคนที่ได้รับการตรวจ"
    solution: "ไม่ใช้ยาของผู้อื่น เพราะอาจไม่ตรงโรคและขนาดไม่เหมาะ ควรให้ผู้ใหญ่พาไปพบแพทย์หรือเภสัชกร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.medicine-use.p008
    topics: [health.safety.medicine-use]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นลักษณะของยาที่เสื่อมสภาพ ไม่ควรใช้ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ยาเม็ดมีจุดด่างและสีเปลี่ยน", correct: true }
      - { id: b, text: "ยาน้ำใสกลายเป็นขุ่นและมีตะกอน", correct: true }
      - { id: c, text: "ยาแคปซูลบวม เยิ้ม ติดกัน", correct: true }
      - { id: d, text: "ยาเม็ดสีขาวสม่ำเสมอ ผิวเรียบ ยังไม่ถึงวันสิ้นอายุ", feedback: "เป็นลักษณะของยาปกติ" }
      - { id: e, text: "ยาน้ำแขวนตะกอนที่เขย่าแล้วกระจายเป็นเนื้อเดียวกัน", feedback: "ยาน้ำแขวนตะกอนปกติมีตะกอนนอนก้น เมื่อเขย่าแล้วต้องกระจายเป็นเนื้อเดียว ถ้าเขย่าแล้วไม่กระจายจึงเป็นยาเสื่อม" }
    hints:
      - "ยาเสื่อมมีสี รูปร่าง หรือความใสเปลี่ยนไป"
      - "ข้อที่ถูกมีสามข้อ"
    solution: "ยาเม็ดด่างหรือสีเปลี่ยน ยาน้ำใสขุ่นมีตะกอน และแคปซูลบวมเยิ้ม เป็นยาเสื่อม ห้ามใช้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.medicine-use.p009
    topics: [health.safety.medicine-use]
    difficulty: 3
    type: mcq
    stem: "ครอบครัวของต้นกล้าจะจัดที่เก็บยาสามัญประจำบ้าน ที่ใดเหมาะสมที่สุด"
    choices:
      - { id: a, text: "ตู้ยาในห้องนั่งเล่นที่แห้ง ไม่โดนแดด และอยู่สูงพ้นมือเด็ก", correct: true }
      - { id: b, text: "ช่องเก็บของในรถยนต์ จะได้หยิบใช้ได้ทุกที่", feedback: "รถที่จอดกลางแดดร้อนมาก ทำให้ยาเสื่อมเร็ว" }
      - { id: c, text: "ชั้นวางของในห้องน้ำ", feedback: "ห้องน้ำชื้น ความชื้นทำให้ยาเสื่อม" }
      - { id: d, text: "โต๊ะริมหน้าต่างที่แดดส่องถึง", feedback: "แสงแดดและความร้อนทำให้ยาเสื่อม" }
    hints:
      - "ความร้อน ความชื้น และแสงแดดทำให้ยาเสื่อม"
      - "อย่าลืมเรื่องความปลอดภัยของเด็กเล็ก"
    solution: "เก็บยาในที่แห้ง ไม่โดนแดด อุณหภูมิไม่สูง และพ้นมือเด็ก ไม่เก็บในรถ ห้องน้ำ หรือห้องครัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.medicine-use.p010
    topics: [health.safety.medicine-use]
    difficulty: 3
    type: text
    stem: "\"ยาของใครของคนนั้น ไม่ใช้ยาของผู้อื่นแม้อาการคล้ายกัน\" ตรงกับหลักใช้ยาข้อใด (ตอบ ถูก...)"
    accepted: ["ถูกคน"]
    misconceptions:
      - { match: "ถูกโรค", feedback: "ถูกโรคหมายถึงยาตรงกับอาการ ข้อนี้เน้นว่ายาเป็นของใคร" }
      - { match: "ถูกขนาด", feedback: "ถูกขนาดหมายถึงจำนวนยาที่ใช้ ข้อนี้เน้นว่ายาเป็นของใคร" }
    hints:
      - "หลัก 5 ถูก: ถูกคน ถูกโรค ถูกขนาด ถูกเวลา ถูกวิธี"
      - "ประโยคนี้พูดถึงตัวผู้ใช้ยา"
    solution: "ถูกคน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.medicine-use.p011
    topics: [health.safety.medicine-use]
    difficulty: 3
    type: match
    stem: "จับคู่การกระทำกับหลักใช้ยา 5 ถูกที่การกระทำนั้นทำตาม"
    pairs:
      - { left: "ใช้ผงน้ำตาลเกลือแร่เมื่อท้องเสีย ไม่ใช้ตอนท้องผูก", right: "ถูกโรค" }
      - { left: "ใช้จำนวนเม็ดตามที่ฉลากหรือเภสัชกรบอก", right: "ถูกขนาด" }
      - { left: "กินยาหลังอาหารตามที่ฉลากเขียน", right: "ถูกเวลา" }
      - { left: "ยาทาใช้ทาเท่านั้น ไม่นำมากิน", right: "ถูกวิธี" }
      - { left: "ไม่ใช้ยาของเพื่อน", right: "ถูกคน" }
    hints:
      - "ดูว่าการกระทำนั้นเน้นเรื่องอะไร: อาการ จำนวน เวลา วิธี หรือผู้ใช้"
      - "ก่อนอาหาร หลังอาหาร ก่อนนอน เป็นเรื่องเวลา"
    solution: "ผงเกลือแร่เมื่อท้องเสีย-ถูกโรค, จำนวนเม็ดตามฉลาก-ถูกขนาด, หลังอาหาร-ถูกเวลา, ยาทาไม่กิน-ถูกวิธี, ไม่ใช้ยาเพื่อน-ถูกคน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.medicine-use.p012
    topics: [health.safety.medicine-use]
    difficulty: 3
    type: mcq
    stem: "ช่วงฤดูฝน ลุงข้างบ้านมีไข้สูงลอย ปวดศีรษะ ปวดกระบอกตา สงสัยว่าเป็นไข้เลือดออก ข้อใดถูกต้องตามคำแนะนำของกรมควบคุมโรค"
    choices:
      - { id: a, text: "ไม่ซื้อยาลดไข้กลุ่มเอ็นเสด เช่น ไอบูโพรเฟน แอสไพริน มากินเอง และรีบไปพบแพทย์", correct: true }
      - { id: b, text: "กินแอสไพรินเพราะลดไข้ได้ดี", feedback: "แอสไพรินเป็นยากลุ่มเอ็นเสด กรมควบคุมโรคเตือนว่าผู้ที่สงสัยไข้เลือดออกไม่ควรใช้ เพราะเสี่ยงเลือดออกและเสียชีวิต" }
      - { id: c, text: "ซื้อยาชุดจากร้านขายของชำมากิน", feedback: "ยาชุดมักมียาหลายชนิดรวมกันที่ไม่รู้ว่าเป็นอะไร อาจมียากลุ่มเอ็นเสดหรือยาที่เป็นอันตราย" }
    hints:
      - "ยาลดไข้บางชนิดเป็นอันตรายต่อผู้ป่วยไข้เลือดออก"
      - "หลักถูกโรค: ยาต้องเหมาะกับโรคที่เป็น"
    solution: "ผู้ที่สงสัยไข้เลือดออกไม่ควรใช้ยากลุ่มเอ็นเสด เช่น ไอบูโพรเฟน แอสไพริน หรือยาชุด ควรรีบไปพบแพทย์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.medicine-use.p013
    topics: [health.safety.medicine-use]
    difficulty: 4
    type: numeric
