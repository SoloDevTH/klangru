  color: "#c0392b"
- id: computer
  title: { th: คอมพิวเตอร์, en: Computer science }
  description: การแทนข้อมูล อัลกอริทึม การเขียนโปรแกรม ระบบคอมพิวเตอร์ และการใช้เทคโนโลยีอย่างปลอดภัย
  color: "#0e7490"
- id: health
