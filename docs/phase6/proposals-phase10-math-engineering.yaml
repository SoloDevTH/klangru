  - { id: engineering.environmental.sanitation-public-health, title: "ระบบสุขาภิบาลในอาคารและสาธารณสุขพื้นฐาน", difficulty: 6, prereq: [physics.matter.pressure-fluids, health.disease.communicable], indicators: ["th-coe-engineering-basics:ENV-3.9", "th-coe-engineering-basics:ENV-3.13"], scope: "ระบบน้ำดีในอาคาร (ถังเก็บน้ำ ปั๊ม ถังสูง ความดันที่ก๊อก) หน่วยสุขภัณฑ์และการกำหนดขนาดท่อ ระบบน้ำเสียและท่อระบายอากาศ ที่ดักไขมัน บ่อเกรอะ–บ่อซึมและถังบำบัดสำเร็จรูป การระบายน้ำฝน โรคที่เกี่ยวกับน้ำและสุขาภิบาล ห่วงโซ่การติดต่อของโรค ดัชนีพื้นฐานทางระบาดวิทยา (อัตราป่วย อัตราตาย) การควบคุมพาหะนำโรค และบทบาทของวิศวกรสิ่งแวดล้อมต่อสาธารณสุข" }
  # ลำดับ 2
  - { id: engineering.environmental.eia, title: "การประเมินผลกระทบสิ่งแวดล้อมและเครื่องมือการจัดการสิ่งแวดล้อม", difficulty: 6, prereq: [chemistry.industry.life-cycle-assessment, management.quality.iso-management-systems], indicators: ["th-coe-engineering-basics:ENV-3.10", "th-coe-engineering-basics:ENV-3.11", "th-coe-engineering-basics:ENV-3.17", "th-coe-engineering-basics:MIN-2.7", "abet-eac:Environmental 1.d", "abet-eac:Environmental 1.e"], scope: "ประเภทโครงการที่ต้องจัดทำรายงาน EIA EHIA และ IEE ในไทย ขั้นตอนการศึกษา (กำหนดขอบเขต สำรวจสภาพปัจจุบัน ทำนายผลกระทบ มาตรการป้องกันและติดตาม) เมทริกซ์ผลกระทบ การมีส่วนร่วมของประชาชน เครื่องมือการจัดการสิ่งแวดล้อม (ISO 14001 เทคโนโลยีสะอาด ฉลากสิ่งแวดล้อม การประเมินวัฏจักรชีวิต) การพัฒนาที่ยั่งยืนและเป้าหมาย SDGs การคำนึงถึงความเสี่ยงและความไม่แน่นอนในการออกแบบระบบสิ่งแวดล้อม และกรณีศึกษาโครงการเหมืองแร่" }
  # ลำดับ 2
  - { id: engineering.environmental.environmental-law, title: "กฎหมายสิ่งแวดล้อมและมาตรฐานคุณภาพสิ่งแวดล้อมของไทย", difficulty: 6.5, prereq: [engineering.environmental.water-quality], indicators: ["th-coe-engineering-basics:ENV-3.15", "th-coe-engineering-basics:ENV-3.14", "th-coe-engineering-basics:MET-2.10", "abet-eac:Environmental 1.e"], scope: "หลักผู้ก่อมลพิษเป็นผู้จ่ายและหลักการป้องกันไว้ก่อน พระราชบัญญัติส่งเสริมและรักษาคุณภาพสิ่งแวดล้อมแห่งชาติ พระราชบัญญัติโรงงานกับกฎหมายลูกที่เกี่ยวกับน้ำทิ้ง อากาศ และกากอุตสาหกรรม พระราชบัญญัติการสาธารณสุขกับเหตุรำคาญ หน่วยงานรัฐที่รับผิดชอบ (กรมควบคุมมลพิษ กรมโรงงานอุตสาหกรรม องค์กรปกครองส่วนท้องถิ่น) ประเภทมาตรฐาน (คุณภาพสิ่งแวดล้อมในบรรยากาศ/แหล่งรับ กับมาตรฐานควบคุมการปล่อย) การตรวจสอบการปฏิบัติตาม บทบาทของภาคเอกชนและวิศวกรในนโยบายสิ่งแวดล้อม และหมายเหตุว่ากฎหมายมีการแก้ไขจึงต้องตรวจฉบับปัจจุบัน" }
  # ลำดับ 2
  - { id: engineering.environmental.carbon-neutrality, title: "บัญชีก๊าซเรือนกระจก ความเป็นกลางทางคาร์บอน และเป้าหมายสุทธิเป็นศูนย์", difficulty: 6, prereq: [earthscience.atmosphere.climate-change, chemistry.stoichiometry.reactions], indicators: ["th-coe-engineering-basics:ENV-3.18", "th-coe-engineering-basics:CHE-3.12", "th-coe-engineering-basics:ENV-3.17"], scope: "ก๊าซเรือนกระจกหลักและศักยภาพในการทำให้โลกร้อน (GWP) หน่วย tCO₂e การคำนวณการปล่อยจากข้อมูลกิจกรรม × ค่าการปล่อย (ไฟฟ้า เชื้อเพลิง) และจากปริมาณสัมพันธ์การเผาไหม้ ขอบเขต 1 2 3 ขององค์กร คาร์บอนฟุตพรินต์ของผลิตภัณฑ์ ลำดับการลดการปล่อย (ประสิทธิภาพพลังงาน พลังงานหมุนเวียน การดักจับคาร์บอน) คาร์บอนเครดิตและการชดเชย ความต่างระหว่างความเป็นกลางทางคาร์บอนกับสุทธิเป็นศูนย์ และเป้าหมายของประเทศไทย" }
