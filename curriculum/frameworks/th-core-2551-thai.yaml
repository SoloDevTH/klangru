          - { id: "ท 4.1 ป.2/1", level: ป.2, text: "บอกและเขียนพยัญชนะ สระ วรรณยุกต์ และเลขไทย", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “สระ|วรรณยุกต์” เว้นวรรค" }
          - { id: "ท 4.1 ป.2/2", level: ป.2, text: "เขียนสะกดคำและบอกความหมายของคำ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ความหมาย|ของคำ” ไม่เว้นวรรค" }
          - { id: "ท 4.1 ป.2/3", level: ป.2, text: "เรียบเรียงคำเป็นประโยคได้ตรงตามเจตนาของการสื่อสาร" }
          - { id: "ท 4.1 ป.2/4", level: ป.2, text: "บอกลักษณะคำคล้องจอง" }
          - { id: "ท 4.1 ป.2/5", level: ป.2, text: "เลือกใช้ภาษาไทยมาตรฐานและภาษาถิ่นได้เหมาะสมกับกาลเทศะ" }
          - { id: "ท 4.1 ป.3/1", level: ป.3, text: "เขียนสะกดคำและบอกความหมายของคำ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ความหมาย|ของคำ” ไม่เว้นวรรค" }
          - { id: "ท 4.1 ป.3/2", level: ป.3, text: "ระบุชนิด และหน้าที่ของคำในประโยค" }
          - { id: "ท 4.1 ป.3/3", level: ป.3, text: "ใช้พจนานุกรมค้นหาความหมายของคำ" }
          - { id: "ท 4.1 ป.3/4", level: ป.3, text: "แต่งประโยคง่ายๆ" }
          - { id: "ท 4.1 ป.3/5", level: ป.3, text: "แต่งคำคล้องจองและคำขวัญ" }
          - { id: "ท 4.1 ป.3/6", level: ป.3, text: "เลือกใช้ภาษาไทยมาตรฐานและภาษาถิ่นได้เหมาะสมกับกาลเทศะ" }
          - { id: "ท 4.1 ป.4/1", level: ป.4, text: "สะกดคำและบอกความหมายของคำในบริบทต่างๆ" }
          - { id: "ท 4.1 ป.4/2", level: ป.4, text: "ระบุชนิด และหน้าที่ของคำในประโยค" }
          - { id: "ท 4.1 ป.4/3", level: ป.4, text: "ใช้พจนานุกรมค้นหาความหมายของคำ" }
          - { id: "ท 4.1 ป.4/4", level: ป.4, text: "แต่งประโยคได้ถูกต้องตามหลักภาษา" }
          - { id: "ท 4.1 ป.4/5", level: ป.4, text: "แต่งบทร้อยกรองและคำขวัญ" }
          - { id: "ท 4.1 ป.4/6", level: ป.4, text: "บอกความหมายของสำนวน" }
          - { id: "ท 4.1 ป.4/7", level: ป.4, text: "เปรียบเทียบภาษาไทยมาตรฐานกับภาษาถิ่นได้" }
          - { id: "ท 4.1 ป.5/1", level: ป.5, text: "ระบุชนิดและหน้าที่ของคำในประโยค" }
          - { id: "ท 4.1 ป.5/2", level: ป.5, text: "จำแนกส่วนประกอบของประโยค" }
          - { id: "ท 4.1 ป.5/3", level: ป.5, text: "เปรียบเทียบภาษาไทยมาตรฐานกับภาษาถิ่น" }
          - { id: "ท 4.1 ป.5/4", level: ป.5, text: "ใช้คำราชาศัพท์" }
          - { id: "ท 4.1 ป.5/5", level: ป.5, text: "บอกคำภาษาต่างประเทศในภาษาไทย" }
          - { id: "ท 4.1 ป.5/6", level: ป.5, text: "แต่งบทร้อยกรอง" }
          - { id: "ท 4.1 ป.5/7", level: ป.5, text: "ใช้สำนวนได้ถูกต้อง" }
          - { id: "ท 4.1 ป.6/1", level: ป.6, text: "วิเคราะห์ชนิดและหน้าที่ของคำในประโยค" }
          - { id: "ท 4.1 ป.6/2", level: ป.6, text: "ใช้คำได้เหมาะสมกับกาลเทศะและบุคคล", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “กับกาลเทศะ|และบุคคล” ไม่เว้นวรรค" }
          - { id: "ท 4.1 ป.6/3", level: ป.6, text: "รวบรวมและบอกความหมายของคำภาษาต่างประเทศที่ใช้ในภาษาไทย" }
          - { id: "ท 4.1 ป.6/4", level: ป.6, text: "ระบุลักษณะของประโยค" }
          - { id: "ท 4.1 ป.6/5", level: ป.6, text: "แต่งบทร้อยกรอง" }
          - { id: "ท 4.1 ป.6/6", level: ป.6, text: "วิเคราะห์และเปรียบเทียบสำนวนที่เป็นคำพังเพย และสุภาษิต" }
          - { id: "ท 4.1 ม.1/1", level: ม.1, text: "อธิบายลักษณะของเสียงในภาษาไทย" }
          - { id: "ท 4.1 ม.1/2", level: ม.1, text: "สร้างคำในภาษาไทย" }
          - { id: "ท 4.1 ม.1/3", level: ม.1, text: "วิเคราะห์ชนิดและหน้าที่ของคำในประโยค" }
          - { id: "ท 4.1 ม.1/4", level: ม.1, text: "วิเคราะห์ความแตกต่างของภาษาพูดและภาษาเขียน" }
          - { id: "ท 4.1 ม.1/5", level: ม.1, text: "แต่งบทร้อยกรอง" }
          - { id: "ท 4.1 ม.1/6", level: ม.1, text: "จำแนกและใช้สำนวนที่เป็นคำพังเพย และสุภาษิต" }
          - { id: "ท 4.1 ม.2/1", level: ม.2, text: "สร้างคำในภาษาไทย" }
          - { id: "ท 4.1 ม.2/2", level: ม.2, text: "วิเคราะห์โครงสร้างประโยคสามัญ ประโยครวม และประโยคซ้อน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ประโยคสามัญ|ประโยครวม” เว้นวรรค" }
          - { id: "ท 4.1 ม.2/3", level: ม.2, text: "แต่งบทร้อยกรอง" }
          - { id: "ท 4.1 ม.2/4", level: ม.2, text: "ใช้คำราชาศัพท์" }
          - { id: "ท 4.1 ม.2/5", level: ม.2, text: "รวบรวมและอธิบายความหมายของคำภาษาต่างประเทศที่ใช้ในภาษาไทย" }
          - { id: "ท 4.1 ม.3/1", level: ม.3, text: "จำแนกและใช้คำภาษาต่างประเทศที่ใช้ในภาษาไทย" }
          - { id: "ท 4.1 ม.3/2", level: ม.3, text: "วิเคราะห์โครงสร้างประโยคซับซ้อน" }
          - { id: "ท 4.1 ม.3/3", level: ม.3, text: "วิเคราะห์ระดับภาษา" }
          - { id: "ท 4.1 ม.3/4", level: ม.3, text: "ใช้คำทับศัพท์และศัพท์บัญญัติ" }
          - { id: "ท 4.1 ม.3/5", level: ม.3, text: "อธิบายความหมายคำศัพท์ทางวิชาการและวิชาชีพ" }
          - { id: "ท 4.1 ม.3/6", level: ม.3, text: "แต่งบทร้อยกรอง" }
          - { id: "ท 4.1 ม.4-6/1", level: ม.4-6, text: "อธิบายธรรมชาติของภาษา พลังของภาษา และลักษณะของภาษา" }
          - { id: "ท 4.1 ม.4-6/2", level: ม.4-6, text: "ใช้คำและกลุ่มคำสร้างประโยคตรงตามวัตถุประสงค์" }
          - { id: "ท 4.1 ม.4-6/3", level: ม.4-6, text: "ใช้ภาษาเหมาะสมแก่โอกาส กาลเทศะ และบุคคล รวมทั้งคำราชาศัพท์อย่างเหมาะสม" }
          - { id: "ท 4.1 ม.4-6/4", level: ม.4-6, text: "แต่งบทร้อยกรอง" }
          - { id: "ท 4.1 ม.4-6/5", level: ม.4-6, text: "วิเคราะห์อิทธิพลของภาษาต่างประเทศและภาษาถิ่น" }
