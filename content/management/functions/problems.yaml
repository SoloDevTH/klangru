problems:
  - id: mgt.fn.p001
    topics: [management.principles.functions]
    difficulty: 1
    type: mcq
    stem: "เจ้าของร้านกาแฟตั้งเป้าว่าเดือนหน้าจะขายให้ได้วันละ $120$ แก้ว และวางแผนจัดโปรโมชันช่วงสอบ งานนี้เป็นหน้าที่การจัดการด้านใด"
    choices:
      - { id: a, text: "การวางแผน", correct: true }
      - { id: b, text: "การจัดองค์การ", feedback: "การจัดองค์การคือการแบ่งงานและมอบหมายคน ในข้อนี้ยังไม่ได้มอบหมายงานให้ใคร แค่ตั้งเป้าและเลือกวิธี" }
      - { id: c, text: "การชี้นำ", feedback: "การชี้นำคือการสั่งงาน สื่อสาร และจูงใจพนักงาน ข้อนี้เป็นการตั้งเป้าล่วงหน้า" }
      - { id: d, text: "การควบคุม", feedback: "การควบคุมคือการนำผลจริงมาเทียบเป้า ข้อนี้ยังไม่มีผลจริง เพิ่งตั้งเป้า" }
    hints:
      - "งานนี้เกิดขึ้นก่อนหรือหลังการลงมือขาย"
      - "การตั้งเป้าหมายและเลือกวิธีไปถึงเป้าหมายเป็นหน้าที่ข้อแรกของวงจร"
    solution: "ตั้งเป้าหมายและเลือกวิธีไปให้ถึงเป้าหมายคือ **การวางแผน**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.fn.p002
    topics: [management.principles.functions]
    difficulty: 1
    type: match
    stem: "จับคู่หน้าที่การจัดการกับตัวอย่างในร้านขายของออนไลน์"
    pairs:
      - { left: "การวางแผน", right: "ตั้งเป้ายอดขายช่วงเทศกาล 11.11 และเลือกสินค้าที่จะลดราคา" }
      - { left: "การจัดองค์การ", right: "แบ่งให้คนหนึ่งตอบแชต อีกคนแพ็กสินค้า" }
      - { left: "การชี้นำ", right: "สอนน้องใหม่ตอบลูกค้าอย่างสุภาพและให้กำลังใจ" }
      - { left: "การควบคุม", right: "ดูจำนวนพัสดุตีกลับเทียบกับเป้าที่ตั้งไว้ แล้วหาสาเหตุ" }
    hints:
      - "หาคำสำคัญ: ตั้งเป้า แบ่งงาน สอนและจูงใจ เทียบผลกับเป้า"
      - "การควบคุมต้องมีการวัดผลจริงแล้วเทียบกับเป้าหรือมาตรฐาน"
    solution: "วางแผน → ตั้งเป้าและเลือกสินค้า · จัดองค์การ → แบ่งงานตอบแชตกับแพ็กของ · ชี้นำ → สอนและให้กำลังใจ · ควบคุม → เทียบพัสดุตีกลับกับเป้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.fn.p003
    topics: [management.principles.functions]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็น **ผู้มีส่วนได้ส่วนเสียภายนอก** ของร้านอาหาร"
    choices:
      - { id: a, text: "ลูกค้าที่มากินอาหาร", correct: true }
      - { id: b, text: "พ่อครัวของร้าน", feedback: "พ่อครัวเป็นพนักงานของร้าน จึงเป็นผู้มีส่วนได้ส่วนเสียภายใน" }
      - { id: c, text: "เจ้าของร้าน", feedback: "เจ้าของอยู่ในองค์การ จึงเป็นผู้มีส่วนได้ส่วนเสียภายใน" }
      - { id: d, text: "ผู้จัดการร้าน", feedback: "ผู้จัดการทำงานในองค์การ จึงเป็นกลุ่มภายใน" }
    hints:
      - "ภายในคือคนที่อยู่ในองค์การ ภายนอกคือคนที่ไม่ได้ทำงานหรือเป็นเจ้าของ แต่ได้รับผลจากธุรกิจ"
      - "ใครในตัวเลือกไม่ได้ทำงานให้ร้านเลย"
    solution: "ลูกค้าไม่ได้อยู่ในองค์การแต่ได้รับผลจากสินค้าและบริการ จึงเป็นผู้มีส่วนได้ส่วนเสียภายนอก ส่วนพ่อครัว เจ้าของ และผู้จัดการเป็นกลุ่มภายใน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.fn.p004
    topics: [management.principles.functions]
    difficulty: 2
    type: order
    stem: "เรียงหน้าที่การจัดการตามลำดับในวงจรการจัดการ เริ่มจากข้อแรก"
    items:
      - "การวางแผน"
      - "การจัดองค์การ"
      - "การชี้นำ"
      - "การควบคุม"
    hints:
      - "ต้องรู้ก่อนว่าจะไปที่ไหน แล้วจึงจัดคนและทรัพยากร"
      - "การตรวจผลเทียบเป้าทำได้หลังลงมือทำงานแล้ว"
    solution: "วางแผน → จัดองค์การ → ชี้นำ → ควบคุม แล้วผลการควบคุมย้อนกลับไปใช้วางแผนรอบใหม่ (POLC)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.fn.p005
    topics: [management.principles.functions]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นตัวอย่างของ **การควบคุม**"
    choices:
      - { id: a, text: "ทุกสิ้นสัปดาห์ผู้จัดการดูยอดขายจริงเทียบกับเป้า แล้วปรับโปรโมชันเมื่อยอดขายต่ำกว่าเป้า", correct: true }
      - { id: b, text: "ผู้จัดการตั้งเป้ายอดขายของไตรมาสหน้า", feedback: "การตั้งเป้าเป็นการวางแผน การควบคุมต้องมีผลจริงมาเทียบ" }
      - { id: c, text: "ผู้จัดการแบ่งพนักงานเป็นกะเช้าและกะบ่าย", feedback: "การแบ่งงานและจัดกะคือการจัดองค์การ" }
      - { id: d, text: "ผู้จัดการพูดให้กำลังใจพนักงานก่อนเปิดร้าน", feedback: "การจูงใจและสื่อสารกับพนักงานคือการชี้นำ" }
    hints:
      - "การควบคุมมีสามส่วน คือ วัดผล เทียบกับเป้าหรือมาตรฐาน และแก้ไข"
      - "ตัวเลือกไหนมีการนำผลจริงมาเทียบ"
    solution: "การดูยอดขายจริงเทียบเป้าแล้วแก้ไขครบทั้งการวัดผล การเปรียบเทียบ และการแก้ไข จึงเป็นการควบคุม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.fn.p006
    topics: [management.principles.functions]
    difficulty: 2
    type: mcq
    stem: "ธุรกิจรูปแบบใดที่ **ผู้เป็นหุ้นส่วนทุกคน** ต้องรับผิดร่วมกันในหนี้ทั้งหมดโดยไม่จำกัดจำนวน"
    choices:
      - { id: a, text: "ห้างหุ้นส่วนสามัญ", correct: true }
      - { id: b, text: "ห้างหุ้นส่วนจำกัด", feedback: "ห้างหุ้นส่วนจำกัดมีหุ้นส่วนจำพวกจำกัดความรับผิดด้วย ซึ่งรับผิดไม่เกินเงินที่ลงหุ้น จึงไม่ใช่ทุกคนที่รับผิดไม่จำกัด" }
      - { id: c, text: "บริษัทจำกัด", feedback: "ผู้ถือหุ้นบริษัทจำกัดรับผิดไม่เกินค่าหุ้นที่ยังจ่ายไม่ครบ" }
      - { id: d, text: "บริษัทมหาชนจำกัด", feedback: "ผู้ถือหุ้นบริษัทมหาชนจำกัดรับผิดจำกัดไม่เกินค่าหุ้นที่ต้องชำระ" }
    hints:
      - "คำว่า จำกัด ในชื่อรูปแบบธุรกิจบอกอะไร"
      - "รูปแบบที่ไม่มีคำว่า จำกัด เลย และมีเจ้าของหลายคน"
    solution: "ในห้างหุ้นส่วนสามัญ หุ้นส่วนมีจำพวกเดียวคือไม่จำกัดความรับผิด ทุกคนจึงรับผิดร่วมกันในหนี้ทั้งหมดโดยไม่จำกัดจำนวน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.fn.p007
    topics: [management.principles.functions]
    difficulty: 2
    type: numeric
    stem: "ตามกฎหมายที่ใช้ตั้งแต่ 7 กุมภาพันธ์ 2566 ต้องมีบุคคลอย่างน้อยกี่คนจึงจะตั้ง **บริษัทจำกัด** ได้ (ตอบเป็นจำนวนคน)"
    answer: { value: 2, unit: คน }
    hints:
      - "กฎหมายฉบับแก้ไขลดจำนวนผู้ก่อตั้งลงจากเดิม"
      - "จำนวนเท่ากับจำนวนขั้นต่ำของห้างหุ้นส่วน"
    misconceptions:
      - { match: 3, feedback: "นั่นคือจำนวนตามกฎหมายเดิมก่อนแก้ไข ตั้งแต่ 7 ก.พ. 2566 ลดเหลือ 2 คน" }
      - { match: 15, feedback: "นั่นคือจำนวนผู้ถือหุ้นขั้นต่ำของบริษัทมหาชนจำกัด ไม่ใช่บริษัทจำกัด" }
      - { match: 1, feedback: "คนเดียวทำได้ในรูปกิจการเจ้าของคนเดียว แต่บริษัทจำกัดต้องมีบุคคลตั้งแต่ 2 คน" }
    solution: "บริษัทจำกัดตั้งได้โดยบุคคลตั้งแต่ $2$ คนขึ้นไป (กรมพัฒนาธุรกิจการค้า) ลดจากเดิม $3$ คนตามการแก้ไขประมวลกฎหมายแพ่งและพาณิชย์ที่มีผล 7 ก.พ. 2566"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.fn.p008
    topics: [management.principles.functions]
    difficulty: 2
    type: match
    stem: "จับคู่รูปแบบธุรกิจกับลักษณะเด่น"
    pairs:
      - { left: "กิจการเจ้าของคนเดียว", right: "เจ้าของคนเดียวรับทั้งกำไรและความเสี่ยงขาดทุน" }
      - { left: "ห้างหุ้นส่วนสามัญ", right: "หุ้นส่วนทุกคนรับผิดในหนี้ทั้งหมดไม่จำกัดจำนวน" }
      - { left: "ห้างหุ้นส่วนจำกัด", right: "มีหุ้นส่วนสองจำพวก ผู้จัดการต้องเป็นจำพวกไม่จำกัดความรับผิด" }
      - { left: "บริษัทจำกัด", right: "แบ่งทุนเป็นหุ้นละไม่ต่ำกว่า 5 บาท ผู้ถือหุ้นรับผิดเท่าค่าหุ้นที่ยังค้าง" }
      - { left: "บริษัทมหาชนจำกัด", right: "ตั้งขึ้นเพื่อเสนอขายหุ้นต่อประชาชน ผู้ถือหุ้นตั้งแต่ 15 คน" }
    hints:
      - "เริ่มจากรูปแบบที่มีเจ้าของคนเดียว แล้วไล่ไปที่มีเจ้าของมากขึ้น"
      - "ห้างหุ้นส่วนจำกัดต่างจากห้างหุ้นส่วนสามัญตรงที่มีหุ้นส่วนสองจำพวก"
    solution: "เจ้าของคนเดียว → รับกำไรและความเสี่ยงคนเดียว · สามัญ → ทุกคนรับผิดไม่จำกัด · ห้างหุ้นส่วนจำกัด → สองจำพวก ผู้จัดการไม่จำกัดความรับผิด · บริษัทจำกัด → หุ้นละไม่ต่ำกว่า 5 บาท รับผิดเท่าค่าหุ้นที่ค้าง · มหาชน → ขายหุ้นต่อประชาชน ตั้งแต่ 15 คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.fn.p009
    topics: [management.principles.functions]
    difficulty: 3
    type: numeric
    stem: "ปลาถือหุ้นบริษัทจำกัดแห่งหนึ่ง $2{,}000$ หุ้น มูลค่าหุ้นละ $10$ บาท จ่ายค่าหุ้นแล้วหุ้นละ $6$ บาท ถ้าบริษัทมีหนี้มาก ปลาต้องรับผิดชำระเพิ่มอีกไม่เกินกี่บาท (ตอบเป็นบาท)"
    answer: { value: 8000, unit: บาท }
    hints:
      - "ผู้ถือหุ้นรับผิดไม่เกินจำนวนเงินที่ยังส่งใช้ไม่ครบมูลค่าหุ้น"
      - "หาค่าหุ้นที่ยังค้างต่อหุ้น แล้วคูณจำนวนหุ้น"
    misconceptions:
      - { match: 20000, feedback: "นั่นคือมูลค่าหุ้นทั้งหมด แต่ปลาจ่ายไปแล้วหุ้นละ $6$ บาท รับผิดเพิ่มเฉพาะส่วนที่ค้าง" }
      - { match: 12000, feedback: "นั่นคือเงินที่จ่ายไปแล้ว ส่วนที่ต้องรับผิดเพิ่มคือส่วนที่ยังไม่ได้จ่าย" }
    solution: "ค้างหุ้นละ $10 - 6 = 4$ บาท รับผิดเพิ่มไม่เกิน $2{,}000 \\times 4 = 8{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.fn.p010
    topics: [management.principles.functions]
    difficulty: 3
    type: numeric
    stem: "ห้างหุ้นส่วนจำกัดแห่งหนึ่งมีหนี้ $300{,}000$ บาท นิดเป็นหุ้นส่วนจำพวกจำกัดความรับผิดซึ่งลงหุ้นไว้ $50{,}000$ บาท นิดต้องรับผิดในหนี้ของห้างได้มากที่สุดกี่บาท (ตอบเป็นบาท)"
    answer: { value: 50000, unit: บาท }
    hints:
      - "หุ้นส่วนจำพวกจำกัดความรับผิดรับผิดไม่เกินจำนวนใด"
      - "ไม่ต้องใช้ตัวเลขหนี้ทั้งหมด ดูเฉพาะเงินที่นิดลงหุ้น"
    misconceptions:
      - { match: 300000, feedback: "หนี้ทั้งหมดเป็นภาระของหุ้นส่วนจำพวกไม่จำกัดความรับผิด หุ้นส่วนจำกัดความรับผิดรับผิดไม่เกินเงินที่ตนลงหุ้น" }
      - { match: 150000, feedback: "ไม่ได้แบ่งหนี้เท่ากันตามจำนวนหุ้นส่วน หุ้นส่วนจำกัดความรับผิดรับผิดไม่เกินเงินที่ลงหุ้น" }
    solution: "หุ้นส่วนจำพวกจำกัดความรับผิดรับผิดไม่เกินจำนวนเงินที่ตนลงหุ้น นิดจึงรับผิดได้มากที่สุด $50{,}000$ บาท ส่วนที่เหลือเป็นภาระของหุ้นส่วนจำพวกไม่จำกัดความรับผิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.fn.p011
    topics: [management.principles.functions]
    difficulty: 3
    type: mcq
    stem: "ร้านซักรีดขยายสาขา เจ้าของกำหนดว่าแต่ละสาขามีหัวหน้าสาขาหนึ่งคน พนักงานรายงานต่อหัวหน้าสาขา และหัวหน้าสาขารายงานต่อเจ้าของ งานนี้เป็นหน้าที่การจัดการด้านใด"
    choices:
      - { id: a, text: "การจัดองค์การ", correct: true }
      - { id: b, text: "การวางแผน", feedback: "การวางแผนตั้งเป้าหมายและเลือกวิธี ข้อนี้เป็นการกำหนดโครงสร้างว่าใครรายงานต่อใคร" }
      - { id: c, text: "การชี้นำ", feedback: "การชี้นำคือการสั่งงานและจูงใจในงานประจำวัน ไม่ใช่การออกแบบสายบังคับบัญชา" }
      - { id: d, text: "การควบคุม", feedback: "การควบคุมคือการวัดผลเทียบเป้า ข้อนี้ยังไม่มีการวัดผล" }
    hints:
      - "การกำหนดตำแหน่งงานและสายการบังคับบัญชาเป็นผลงานที่เห็นได้ในแผนผังองค์การ"
      - "หน้าที่ใดเกี่ยวกับการแบ่งงานและจัดคนเข้าตำแหน่ง"
    solution: "การกำหนดตำแหน่งและสายบังคับบัญชาคือ **การจัดองค์การ** ผลลัพธ์ของงานนี้เขียนเป็นแผนผังองค์การได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.fn.p012
    topics: [management.principles.functions]
    difficulty: 3
    type: mcq
    stem: "ยอดขายเมนูใหม่ต่ำกว่าเป้า ผู้จัดการร้านจึงเรียกพนักงานมาคุยเป็นกันเอง อธิบายจุดเด่นของเมนู และให้รางวัลคนที่แนะนำเมนูให้ลูกค้าได้มากที่สุด การพูดคุยและให้รางวัลนี้เป็นหน้าที่การจัดการด้านใด"
    choices:
      - { id: a, text: "การชี้นำ", correct: true }
      - { id: b, text: "การควบคุม", feedback: "การรู้ว่ายอดขายต่ำกว่าเป้าเป็นผลของการควบคุม แต่สิ่งที่โจทย์ถามคือการพูดคุยและให้รางวัลเพื่อจูงใจ ซึ่งเป็นการชี้นำ" }
      - { id: c, text: "การจัดองค์การ", feedback: "ไม่ได้เปลี่ยนการแบ่งงานหรือสายบังคับบัญชา แต่เป็นการสื่อสารและจูงใจพนักงาน" }
      - { id: d, text: "การวางแผน", feedback: "ไม่ได้ตั้งเป้าหมายใหม่ แต่เป็นการจูงใจคนให้ทำงานไปสู่เป้าเดิม" }
    hints:
      - "อ่านโจทย์ให้ดีว่าถามถึงการกระทำส่วนไหน"
      - "การสื่อสาร สอน และจูงใจคนอยู่ในหน้าที่เดียวกัน"
    solution: "การสื่อสาร อธิบาย และให้รางวัลเพื่อจูงใจพนักงานคือ **การชี้นำ** (การพบว่ายอดขายต่ำกว่าเป้ามาจากการควบคุม ซึ่งเป็นตัวจุดให้ผู้จัดการลงมือ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.fn.p013
    topics: [management.principles.functions]
    difficulty: 2
    type: numeric
    stem: "จากแผนผังองค์การของร้านกาแฟ มีกี่ตำแหน่งที่รายงานต่อ **ผู้จัดการร้าน** โดยตรง (ตอบเป็นจำนวนตำแหน่ง)"
    figure: { src: org-chart.svg, alt: "แผนผังองค์การของร้านกาแฟ บนสุดคือเจ้าของร้าน ใต้เจ้าของร้านคือผู้จัดการร้าน ใต้ผู้จัดการร้านมีเส้นลากลงไปยังหัวหน้าบาริสต้า แคชเชียร์ และผู้ดูแลร้านออนไลน์ ใต้หัวหน้าบาริสต้ามีเส้นลากลงไปยังบาริสต้าอีก 2 กล่อง" }
    answer: { value: 3, unit: ตำแหน่ง }
    hints:
      - "รายงานโดยตรงคือกล่องที่เส้นจากผู้จัดการร้านลากลงไปถึงทันที"
      - "บาริสต้ารายงานต่อหัวหน้าบาริสต้า ไม่ได้รายงานต่อผู้จัดการร้านโดยตรง"
    misconceptions:
      - { match: 5, feedback: "นับรวมบาริสต้าที่อยู่ใต้หัวหน้าบาริสต้าด้วย บาริสต้ารายงานต่อหัวหน้าบาริสต้า ไม่ใช่ผู้จัดการร้านโดยตรง" }
      - { match: 1, feedback: "นั่นคือจำนวนคนที่ผู้จัดการร้านรายงานต่อ (เจ้าของร้าน) โจทย์ถามคนที่รายงานต่อผู้จัดการร้าน" }
    solution: "เส้นจากผู้จัดการร้านลากลงไปยัง หัวหน้าบาริสต้า แคชเชียร์ และผู้ดูแลร้านออนไลน์ รวม $3$ ตำแหน่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.fn.p014
    topics: [management.principles.functions]
    difficulty: 3
    type: mcq
    stem: "ร้านกาแฟตัดสินใจขึ้นราคาแก้วละ $5$ บาทเพื่อเพิ่มกำไร การตัดสินใจนี้ทำให้ความต้องการของผู้มีส่วนได้ส่วนเสียคู่ใดขัดกันชัดเจนที่สุด"
    choices:
      - { id: a, text: "เจ้าของร้านกับลูกค้า", correct: true }
      - { id: b, text: "ลูกค้ากับชุมชนรอบร้าน", feedback: "ชุมชนสนใจเรื่องขยะ เสียง หรือการจราจร ราคากาแฟไม่ได้กระทบชุมชนโดยตรง" }
      - { id: c, text: "เจ้าของร้านกับรัฐ", feedback: "รัฐสนใจการเสียภาษีและการทำตามกฎหมาย การขึ้นราคาไม่ได้ขัดกับรัฐโดยตรง" }
      - { id: d, text: "เจ้าหนี้กับพนักงาน", feedback: "สองกลุ่มนี้ไม่ได้รับผลตรงข้ามกันจากการขึ้นราคา" }
    hints:
      - "ใครได้ประโยชน์จากราคาที่สูงขึ้น ใครต้องจ่ายมากขึ้น"
      - "เจ้าของต้องการกำไร ลูกค้าต้องการราคาเหมาะสม"
    solution: "ราคาที่สูงขึ้นเพิ่มกำไรให้เจ้าของ แต่ลูกค้าต้องจ่ายมากขึ้น ความต้องการของสองกลุ่มนี้จึงขัดกัน ร้านต้องชั่งน้ำหนักว่าลูกค้าจะยังซื้ออยู่หรือไม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.fn.p015
    topics: [management.principles.functions]
    difficulty: 4
    type: numeric
    stem: "ห้างหุ้นส่วนขายผลไม้ออนไลน์มีหุ้นส่วนสองคน ตกลงแบ่งกำไรตามสัดส่วน $3 : 2$ (เอ : บี) ปีนี้มีกำไร $75{,}000$ บาท เอได้ส่วนแบ่งกำไรกี่บาท (ตอบเป็นบาท)"
    answer: { value: 45000, unit: บาท }
    hints:
      - "ห้างหุ้นส่วนแบ่งกำไรตามสัดส่วนที่ตกลงกัน ไม่จำเป็นต้องเท่ากัน"
      - "สัดส่วนรวม $3 + 2 = 5$ ส่วน เอได้ $3$ ใน $5$ ส่วน"
    misconceptions:
      - { match: 37500, feedback: "นั่นคือการแบ่งเท่ากัน แต่ตกลงไว้ $3 : 2$" }
      - { match: 30000, feedback: "นั่นคือส่วนของบี ($2$ ใน $5$ ส่วน) เอได้ $3$ ส่วน" }
    solution: "หนึ่งส่วน $= 75{,}000 \\div 5 = 15{,}000$ บาท เอได้ $3 \\times 15{,}000 = 45{,}000$ บาท (บีได้ $30{,}000$ บาท)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.fn.p016
    topics: [management.principles.functions]
    difficulty: 4
    type: mcq
    stem: "เพื่อนสามคนจะเปิดร้านกาแฟสาขาที่ต้องลงทุนสูง ทุกคนอยากให้ความรับผิดในหนี้จำกัดอยู่ที่ค่าหุ้นของตน และอาจชวนนักลงทุนอีกสองสามคนมาถือหุ้นในอนาคต (ยังไม่คิดขายหุ้นให้ประชาชนทั่วไป) รูปแบบใดเหมาะที่สุด"
    choices:
      - { id: a, text: "บริษัทจำกัด", correct: true }
      - { id: b, text: "ห้างหุ้นส่วนสามัญ", feedback: "หุ้นส่วนทุกคนในห้างหุ้นส่วนสามัญรับผิดไม่จำกัด ไม่ตรงกับที่ทุกคนต้องการ" }
      - { id: c, text: "ห้างหุ้นส่วนจำกัด", feedback: "ต้องมีหุ้นส่วนไม่จำกัดความรับผิดอย่างน้อยหนึ่งคนเป็นผู้จัดการ จึงไม่ใช่ทุกคนที่ได้รับผิดจำกัด" }
      - { id: d, text: "บริษัทมหาชนจำกัด", feedback: "บริษัทมหาชนจำกัดตั้งขึ้นเพื่อเสนอขายหุ้นต่อประชาชนและต้องมีผู้ถือหุ้นตั้งแต่ 15 คน เกินความต้องการของร้านนี้" }
    hints:
      - "ตัดรูปแบบที่มีใครสักคนต้องรับผิดไม่จำกัดออกก่อน"
      - "ในรูปแบบที่เหลือ รูปแบบใดไม่ต้องเสนอขายหุ้นต่อประชาชน"
    solution: "บริษัทจำกัดให้ผู้ถือหุ้นทุกคนรับผิดไม่เกินค่าหุ้นที่ยังค้าง รับผู้ถือหุ้นเพิ่มได้ด้วยการขายหุ้นให้คนที่ตกลงกัน และตั้งได้ด้วยบุคคลตั้งแต่ 2 คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.fn.p017
    topics: [management.principles.functions]
    difficulty: 4
    type: order
    stem: "ร้านกาแฟอยากให้ทุกแก้วเสร็จภายใน 3 นาที เรียงขั้นตอนการควบคุมให้ถูกต้อง"
    items:
      - "กำหนดมาตรฐาน: ทำกาแฟหนึ่งแก้วไม่เกิน 3 นาที"
      - "จับเวลาการทำกาแฟจริงในช่วงเวลาต่าง ๆ"
      - "เปรียบเทียบเวลาจริงกับมาตรฐาน 3 นาที"
      - "แก้ไขจุดที่ช้า เช่น จัดวางวัตถุดิบใหม่หรือเพิ่มคนช่วงเร่งด่วน"
    hints:
      - "ต้องมีเกณฑ์ก่อนจึงจะรู้ว่าผลดีหรือไม่"
      - "การแก้ไขทำหลังจากรู้แล้วว่าผลจริงต่างจากมาตรฐานตรงไหน"
    solution: "กำหนดมาตรฐาน → วัดผลจริง → เปรียบเทียบกับมาตรฐาน → แก้ไข"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.fn.p018
    topics: [management.principles.functions]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "ข้อใด **ถูกต้อง** เกี่ยวกับบริษัทจำกัด (เลือกได้มากกว่าหนึ่งข้อ)"
    choices:
      - { id: a, text: "เมื่อจดทะเบียนแล้วเป็นนิติบุคคลแยกจากผู้ถือหุ้น", correct: true }
      - { id: b, text: "แบ่งทุนเป็นหุ้นมูลค่าเท่ากัน หุ้นละไม่ต่ำกว่า 5 บาท", correct: true }
      - { id: c, text: "ผู้ถือหุ้นรับผิดไม่เกินจำนวนเงินที่ยังส่งใช้ไม่ครบมูลค่าหุ้นที่ตนถือ", correct: true }
      - { id: d, text: "ต้องมีผู้ถือหุ้นตั้งแต่ 15 คนขึ้นไป", feedback: "15 คนเป็นเงื่อนไขของบริษัทมหาชนจำกัด บริษัทจำกัดตั้งได้ด้วยบุคคลตั้งแต่ 2 คน" }
      - { id: e, text: "ผู้ถือหุ้นทุกคนต้องรับผิดในหนี้ของบริษัทโดยไม่จำกัดจำนวน", feedback: "นั่นคือลักษณะของห้างหุ้นส่วนสามัญ ผู้ถือหุ้นบริษัทจำกัดรับผิดจำกัด" }
    hints:
      - "นึกถึงความหมายของคำว่า จำกัด และคำว่า นิติบุคคล"
      - "ระวังสับสนกับเงื่อนไขของบริษัทมหาชนจำกัดและห้างหุ้นส่วนสามัญ"
    solution: "ข้อ ก ข ค ถูกต้องตามคู่มือของกรมพัฒนาธุรกิจการค้า ข้อ ง เป็นเงื่อนไขของบริษัทมหาชนจำกัด ข้อ จ เป็นลักษณะของห้างหุ้นส่วนสามัญ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.fn.p019
    topics: [management.principles.functions]
    difficulty: 5
    type: numeric
    stem: "แทนถือหุ้นบริษัทจำกัดแห่งหนึ่งสองล็อต ล็อตแรก $1{,}500$ หุ้น มูลค่าหุ้นละ $20$ บาท จ่ายแล้วหุ้นละ $15$ บาท ล็อตที่สอง $500$ หุ้น มูลค่าหุ้นละ $20$ บาท จ่ายครบแล้ว ถ้าบริษัทล้มละลาย แทนต้องรับผิดชำระเพิ่มอีกไม่เกินกี่บาท (ตอบเป็นบาท)"
    answer: { value: 7500, unit: บาท }
    hints:
      - "ผู้ถือหุ้นรับผิดเฉพาะค่าหุ้นที่ยังจ่ายไม่ครบ ล็อตที่จ่ายครบแล้วไม่มีความรับผิดเพิ่ม"
      - "คิดค่าหุ้นที่ค้างของแต่ละล็อตแล้วรวมกัน"
    misconceptions:
      - { match: 10000, feedback: "นับหุ้นทั้ง $2{,}000$ หุ้นว่าค้างหุ้นละ $5$ บาท แต่ล็อตที่สองจ่ายครบแล้ว" }
      - { match: 30000, feedback: "นั่นคือมูลค่าเต็มของล็อตแรก แทนจ่ายไปแล้วหุ้นละ $15$ บาท ค้างแค่หุ้นละ $5$ บาท" }
    solution: "ล็อตแรกค้าง $1{,}500 \\times (20 - 15) = 7{,}500$ บาท ล็อตที่สองค้าง $0$ บาท รับผิดเพิ่มไม่เกิน $7{,}500$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.fn.p020
    topics: [management.principles.functions]
    difficulty: 5
    type: mcq
    stem: "มิ้นท์จะเปิดร้านขายต้นไม้ออนไลน์และบริหารร้านเอง ลุงของมิ้นท์ยินดีลงเงิน $200{,}000$ บาท แต่ไม่ต้องการบริหาร และไม่ยอมรับผิดในหนี้เกินเงินที่ลงไว้ ทั้งคู่ไม่อยากตั้งบริษัท รูปแบบใดและบทบาทใดตรงกับความต้องการ"
    choices:
      - { id: a, text: "ห้างหุ้นส่วนจำกัด ลุงเป็นหุ้นส่วนจำพวกจำกัดความรับผิด มิ้นท์เป็นหุ้นส่วนผู้จัดการจำพวกไม่จำกัดความรับผิด", correct: true }
      - { id: b, text: "ห้างหุ้นส่วนจำกัด มิ้นท์เป็นหุ้นส่วนจำพวกจำกัดความรับผิดและเป็นผู้จัดการ ลุงเป็นจำพวกไม่จำกัดความรับผิด", feedback: "หุ้นส่วนผู้จัดการต้องเป็นจำพวกไม่จำกัดความรับผิด และลุงไม่ต้องการรับผิดไม่จำกัด" }
      - { id: c, text: "ห้างหุ้นส่วนสามัญ ลุงไม่ต้องบริหาร", feedback: "ในห้างหุ้นส่วนสามัญหุ้นส่วนทุกคนรับผิดไม่จำกัด ลุงจึงต้องรับผิดเกินเงินที่ลงไว้" }
      - { id: d, text: "กิจการเจ้าของคนเดียวของมิ้นท์ โดยลุงเป็นหุ้นส่วนจำกัดความรับผิด", feedback: "กิจการเจ้าของคนเดียวมีเจ้าของคนเดียว ไม่มีหุ้นส่วน" }
    hints:
      - "ต้องการให้คนหนึ่งรับผิดจำกัดและไม่บริหาร อีกคนบริหาร โดยไม่ตั้งบริษัท"
      - "ในห้างหุ้นส่วนจำกัด หุ้นส่วนผู้จัดการต้องเป็นจำพวกใด"
    solution: "ห้างหุ้นส่วนจำกัดมีหุ้นส่วนสองจำพวก ลุงเป็นจำพวกจำกัดความรับผิด (รับผิดไม่เกิน $200{,}000$ บาทและไม่มีสิทธิจัดการ) มิ้นท์เป็นหุ้นส่วนผู้จัดการซึ่งต้องเป็นจำพวกไม่จำกัดความรับผิด และห้างต้องจดทะเบียน"
