id: biology.molecules.water-biomolecules
subject: biology
title: { th: น้ำ ธาตุ และสารชีวโมเลกุล, en: "Water, elements and biomolecules" }
summary: สมบัติของน้ำที่มาจากพันธะไฮโดรเจน ธาตุสำคัญในร่างกาย และโครงสร้างกับหน้าที่ของคาร์โบไฮเดรต โปรตีน ลิพิด และกรดนิวคลิอิก
difficulty: 4.5
minutes: 40
prerequisites: [chemistry.bonding.covalent]
encompasses:
  - { id: chemistry.bonding.covalent, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: พันธะไฮโดรเจนระหว่างโมเลกุลน้ำ
    src: water-hbonds.svg
    alt: "โมเลกุลน้ำ 5 โมเลกุล โมเลกุลกลางมีมุม H–O–H 104.5 องศา ออกซิเจนมีประจุลบบางส่วน (δ−) ไฮโดรเจนสองอะตอมมีประจุบวกบางส่วน (δ+) ไฮโดรเจนแต่ละอะตอมของโมเลกุลกลางชี้ไปหาออกซิเจนของโมเลกุลด้านล่าง และไฮโดรเจนของโมเลกุลด้านบนซ้ายและขวาชี้มาหาออกซิเจนของโมเลกุลกลาง เส้นประสีน้ำเงินคือพันธะไฮโดรเจนระหว่างโมเลกุล เส้นทึบคือพันธะโคเวเลนต์ O–H ภายในโมเลกุล"
    caption: "ปลาย δ+ ของโมเลกุลหนึ่งดึงดูดปลาย δ− ของอีกโมเลกุลหนึ่ง โมเลกุลน้ำหนึ่งโมเลกุลสร้างพันธะไฮโดรเจนได้ถึง 4 พันธะ (วาดโดยทีมคลังรู้)"
  - type: molecule
    title: โมเลกุลน้ำแบบสามมิติ
    cid: 962
    name: water
    caption: "หมุนดูมุมงอของโมเลกุลน้ำ ซึ่งทำให้ประจุบวกและลบไม่หักล้างกัน"
  - { type: check, problem: biology.molecules.water-biomolecules.p003, prompt: "ใช้เรื่องพันธะไฮโดรเจนอธิบาย" }
  - type: figure
    title: การเกิดพันธะเพปไทด์
    src: peptide-bond.svg
    alt: "แถวบนคือกรดอะมิโนสองโมเลกุล แต่ละโมเลกุลมีคาร์บอนกลางต่อกับ H ด้านบน หมู่ R ด้านล่าง หมู่อะมิโน H–N–H ทางซ้าย และหมู่คาร์บอกซิล C=O กับ OH ทางขวา มีกรอบเส้นประล้อม OH ของโมเลกุลแรกและ H ของหมู่อะมิโนในโมเลกุลที่สอง พร้อมข้อความว่า OH กับ H ออกไปเป็นน้ำ ลูกศรชี้ลงไปที่แถวล่างซึ่งเป็นไดเพปไทด์ คาร์บอนของ C=O ในโมเลกุลแรกต่อกับไนโตรเจนของโมเลกุลที่สองด้วยเส้นสีเขียว เขียนว่าพันธะเพปไทด์ และมี H₂O เกิดขึ้น 1 โมเลกุล"
    caption: "ปฏิกิริยาควบแน่น: ทุกครั้งที่ต่อกรดอะมิโนเพิ่ม 1 หน่วย จะได้พันธะเพปไทด์ 1 พันธะและน้ำ 1 โมเลกุล (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: มวลโมเลกุลของน้ำตาลทราย
    problem: "ซูโครส (น้ำตาลทราย) เกิดจากกลูโคสกับฟรักโทสต่อกัน ทั้งสองมีสูตร $\\mathrm{C_6H_{12}O_6}$ มวลโมเลกุล 180.16 จงหามวลโมเลกุลของซูโครส ($\\mathrm{H_2O} = 18.02$)"
    steps:
      - text: "การต่อมอโนแซ็กคาไรด์ 2 โมเลกุลเป็นปฏิกิริยาควบแน่น ให้น้ำออกมา 1 โมเลกุล"
        why: "หมู่ OH จากน้ำตาลหนึ่งรวมกับ H จากอีกน้ำตาลหนึ่งออกไปเป็นน้ำ เพื่อสร้างพันธะไกลโคซิดิก"
      - text: "มวลรวมของสารตั้งต้น $180.16 + 180.16 = 360.32$"
      - text: "หักน้ำที่ออกไป $360.32 - 18.02 = 342.30$"
      - text: "ตรวจด้วยสูตร: ซูโครสคือ $\\mathrm{C_{12}H_{22}O_{11}}$ ซึ่งเท่ากับ $2 \\times \\mathrm{C_6H_{12}O_6} - \\mathrm{H_2O}$ พอดี"
    answer: "มวลโมเลกุลของซูโครส $\\approx 342.30$"
  - type: figure
    title: นิวคลีโอไทด์ และ DNA กับ RNA
    src: nucleotide.svg
    alt: "ด้านซ้ายคือแผนภาพนิวคลีโอไทด์หนึ่งหน่วย วงกลม P คือหมู่ฟอสเฟต ต่อกับรูปห้าเหลี่ยมคือน้ำตาลเพนโทส 5 คาร์บอน ซึ่งต่อกับกล่องเบสไนโตรเจน ด้านขวาเป็นตาราง DNA เทียบ RNA: น้ำตาล ดีออกซีไรโบส กับ ไรโบส; เบส A T C G กับ A U C G; จำนวนสาย 2 สายเกลียวคู่ กับ สายเดี่ยว; หน้าที่หลัก เก็บข้อมูลพันธุกรรม กับ นำข้อมูลไปสร้างโปรตีน ใต้ตารางบอกว่า A อะดีนีน T ไทมีน U ยูราซิล C ไซโทซีน G กัวนีน"
    caption: "นิวคลีโอไทด์ต่อกันเป็นสายด้วยพันธะระหว่างหมู่ฟอสเฟตกับน้ำตาลของหน่วยถัดไป (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ร้อยละของเบสใน DNA สายคู่
    problem: "DNA สายคู่จากเซลล์ชนิดหนึ่งมีเบส A ร้อยละ 30 จงหาร้อยละของเบส T, G และ C"
    steps:
      - text: "ใน DNA สายคู่ A จับคู่กับ T เสมอ จึงมี T เท่ากับ A คือร้อยละ 30"
      - text: "A กับ T รวมกันเป็น $30 + 30 = 60$ ที่เหลือเป็น G กับ C รวม $100 - 60 = 40$"
      - text: "G จับคู่กับ C จึงมีเท่ากัน ได้ G $= C = \\frac{40}{2} = 20$"
        why: "ถ้ารู้เบสเพียงชนิดเดียวใน DNA สายคู่ ก็หาเบสที่เหลือได้ทั้งหมด แต่ใช้ไม่ได้กับ RNA สายเดี่ยว"
    answer: "T ร้อยละ 30, G ร้อยละ 20, C ร้อยละ 20"
  - { type: check, problem: biology.molecules.water-biomolecules.p008, prompt: "ลองใช้หลักการจับคู่เบส" }
glossary:
  - { term: พันธะไฮโดรเจน, definition: "แรงดึงดูดระหว่างไฮโดรเจนที่มีประจุบวกบางส่วนกับอะตอมที่มีประจุลบบางส่วนของอีกโมเลกุลหนึ่ง เช่น ระหว่างโมเลกุลน้ำ" }
  - { term: ปฏิกิริยาควบแน่น, definition: "ปฏิกิริยาที่ต่อโมเลกุลเล็กเข้าด้วยกันและให้น้ำออกมา ใช้สร้างพอลิแซ็กคาไรด์ โปรตีน ไตรกลีเซอไรด์ และกรดนิวคลิอิก" }
  - { term: ไฮโดรลิซิส, definition: "ปฏิกิริยาที่เติมน้ำเพื่อสลายพันธะระหว่างหน่วยย่อย เป็นทิศตรงข้ามของปฏิกิริยาควบแน่น เกิดขึ้นในการย่อยอาหาร" }
  - { term: พันธะเพปไทด์, definition: "พันธะระหว่างคาร์บอนของหมู่คาร์บอกซิลกับไนโตรเจนของหมู่อะมิโนของกรดอะมิโนที่อยู่ติดกัน" }
  - { term: การเสียสภาพของโปรตีน, definition: "การที่ความร้อน กรด เบส หรือสารบางชนิดทำลายรูปร่างสามมิติของโปรตีน ทำให้โปรตีนทำหน้าที่ไม่ได้ แต่ลำดับกรดอะมิโนยังอยู่" }
  - { term: นิวคลีโอไทด์, definition: "หน่วยย่อยของกรดนิวคลิอิก ประกอบด้วยหมู่ฟอสเฟต น้ำตาลเพนโทส และเบสไนโตรเจน" }
flashcards:
  - { front: "สมบัติของน้ำที่มาจากพันธะไฮโดรเจน", back: "ตัวทำละลายที่ดี ความจุความร้อนจำเพาะสูง ความร้อนแฝงของการกลายเป็นไอสูง การยึดเหนี่ยว และน้ำแข็งลอยน้ำ" }
  - { front: "หน่วยย่อยของคาร์โบไฮเดรต โปรตีน ไตรกลีเซอไรด์ และกรดนิวคลิอิก", back: "มอโนแซ็กคาไรด์, กรดอะมิโน, กลีเซอรอล + กรดไขมัน 3 โมเลกุล, นิวคลีโอไทด์" }
  - { front: "ซูโครส แล็กโทส มอลโทส เกิดจากน้ำตาลอะไร", back: "ซูโครส = กลูโคส + ฟรักโทส, แล็กโทส = กลูโคส + กาแลกโทส, มอลโทส = กลูโคส + กลูโคส" }
  - { front: "กรดอะมิโน n หน่วยมีพันธะเพปไทด์กี่พันธะ", back: "n − 1 พันธะ และให้น้ำ n − 1 โมเลกุล" }
  - { front: "DNA กับ RNA ต่างกันอย่างไร", back: "DNA: ดีออกซีไรโบส เบส T สายคู่ / RNA: ไรโบส เบส U แทน T มักเป็นสายเดี่ยว" }
