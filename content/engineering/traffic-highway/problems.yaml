problems:
  - id: engineering.transport.traffic-highway.p001
    topics:
      - engineering.transport.traffic-highway
    difficulty: 1
    type: numeric
    stem: (ข้อมูลสมมติ) บนถนนวงแหวนรอบเมืองขอนแก่นมีรถ 40 คันต่อกิโลเมตร วิ่งด้วยความเร็วเฉลี่ย 80 กม./ชม. ปริมาณจราจรเท่ากับกี่คันต่อชั่วโมง (ตอบจำนวนเต็ม)
    answer:
      value: 3200
      tolerance: 1
      unit: คัน/ชม.
    hints:
      - ปริมาณจราจร q = ความหนาแน่น k × ความเร็ว v
      - หน่วยคัน/กม. คูณ กม./ชม. ได้ คัน/ชม. โดยตรง
    misconceptions:
      - match: 120
        feedback: บวกความหนาแน่นกับความเร็วแทนการคูณ ทำให้หน่วยไม่สอดคล้องกัน
    solution: q = k × v = 40 × 80 = 3,200 คันต่อชั่วโมง ปริมาณจราจรจึงเป็นผลคูณของความหนาแน่นและความเร็ว
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.transport.traffic-highway.p002
    topics:
      - engineering.transport.traffic-highway
    difficulty: 1
    type: mcq
    stem: ความสัมพันธ์ q = k × v ในงานวิศวกรรมจราจรหมายความว่าอย่างไร
    choices:
      - id: a
        text: ปริมาณจราจรต่อชั่วโมงเท่ากับความหนาแน่นของรถคูณความเร็วเฉลี่ย
        correct: true
      - id: b
        text: ปริมาณจราจรเท่ากับจำนวนรถทั้งหมดในเมืองหารด้วยพื้นที่
        feedback: นั่นคือความหนาแน่นพื้นที่ ไม่ใช่ความสัมพันธ์ q = kv
      - id: c
        text: ความเร็วเท่ากับปริมาณจราจรคูณความหนาแน่น
        feedback: สมการนี้จัดรูปผิด ความเร็วคือ q ÷ k
      - id: d
        text: ความหนาแน่นเท่ากับความเร็วหารด้วยความยาวของรถ
        feedback: การหาความหนาแน่นไม่ได้เป็นนิยามนี้
    hints:
      - ปริมาณที่ผ่านจุดหนึ่งต่อชั่วโมงขึ้นกับจำนวนรถต่อระยะทางและความเร็วที่รถวิ่ง
      - ถ้าความเร็วเป็นศูนย์ ปริมาณจราจรเป็นศูนย์เสมอ
    solution: q = k × v บอกว่าปริมาณจราจรต่อชั่วโมงเท่ากับความหนาแน่นของรถต่อกิโลเมตรคูณความเร็วเฉลี่ย ความสัมพันธ์นี้ใช้วิเคราะห์ได้ว่าการเพิ่มปริมาณจะกระทบความเร็วอย่างไร
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.transport.traffic-highway.p003
    topics:
      - engineering.transport.traffic-highway
    difficulty: 1
    type: match
    stem: จับคู่คำศัพท์การจราจรกับความหมาย
    pairs:
      - left: ความจุของทาง
        right: ปริมาณสูงสุดที่ทางรับได้จริงต่อชั่วโมง
      - left: ระยะมองเห็นเพื่อหยุดรถ (SSD)
        right: ระยะรวมของการตอบสนองและการเบรกจนหยุดก่อนถึงสิ่งกีดขวาง
      - left: การยกโค้ง (superelevation)
        right: การเอียงผิวทางเข้าหาศูนย์กลางโค้งเพื่อช่วยให้รถทรงตัว
      - left: สัญญาณไฟสองเฟส
        right: การแบ่งเวลาเขียวให้สองทิศทางของทางแยกเดียวกันตามปริมาณจราจร
    hints:
      - ความจุคือค่าสูงสุดที่ทางรับได้จริงต่อชั่วโมง
      - ระยะมองเห็นเพื่อหยุดคิดรวมทั้งระยะตอบสนองและระยะเบรก
    solution: ความจุคือปริมาณสูงสุดที่ทางรับได้ต่อชั่วโมง ระยะมองเห็นเพื่อหยุดรวมระยะตอบสนองกับระยะเบรก การยกโค้งคือการเอียงผิวทางเข้าหาศูนย์กลางโค้ง และสัญญาณสองเฟสคือการแบ่งเวลาเขียวให้สองทิศทางที่ผ่านทางแยกเดียวกัน
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.transport.traffic-highway.p004
    topics:
      - engineering.transport.traffic-highway
    difficulty: 2
    type: numeric
    stem: (ข้อมูลสมมติ) ถนนในเขตชุมชนสายหนึ่งกำหนดความเร็วออกแบบ 50 กม./ชม. ใช้เวลาตอบสนอง 2.5 วินาที และความหน่วงในการเบรก 3.4 เมตร/วินาที² ระยะมองเห็นเพื่อหยุดรถ (SSD) เท่ากับกี่เมตร (ตอบทศนิยมหนึ่งตำแหน่ง ใช้ SSD = v·t + v²/(2a) โดย v เป็นเมตร/วินาที)
    answer:
      value: 63.1
      tolerance: 0.1
      unit: m
    hints:
      - แปลงความเร็วจาก กม./ชม. เป็นเมตร/วินาที โดยหาร 3.6
      - คำนวณระยะตอบสนอง v·t และระยะเบรก v²/(2a) แล้วรวมกัน
    misconceptions:
      - match: 34.7
        feedback: ลืมระยะเบรก SSD ต้องรวมทั้งระยะตอบสนองและระยะเบรก
      - match: 28.4
        feedback: ลืมระยะตอบสนองที่รถยังวิ่งด้วยความเร็วเดิมก่อนเริ่มเบรก
      - match: 492.6
        feedback: ใช้ความเร็วเป็น กม./ชม. โดยไม่แปลงเป็นเมตร/วินาทีก่อน
    solution: v = 50 ÷ 3.6 ≈ 13.89 m/s ระยะตอบสนอง = 13.89 × 2.5 ≈ 34.7 m ระยะเบรก = 13.89² ÷ (2 × 3.4) ≈ 28.4 m SSD ≈ 34.7 + 28.4 = 63.1 m
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.transport.traffic-highway.p005
    topics:
      - engineering.transport.traffic-highway
    difficulty: 2
    type: numeric
    stem: (ข้อมูลสมมติ) โค้งราบของทางหลวงสายหนึ่งในภาคเหนือออกแบบด้วยความเร็ว 60 กม./ชม. ยกโค้ง e = 0.06 และแรงเสียดทานด้านข้าง f = 0.15 รัศมีโค้งต่ำสุดที่ยอมได้จากสูตร R = V² ÷ [127(e + f)] เท่ากับกี่เมตร (ตอบทศนิยมหนึ่งตำแหน่ง)
    answer:
      value: 135.0
      tolerance: 0.2
      unit: m
    hints:
      - V ในสูตรเป็น กม./ชม. ไม่ต้องแปลงหน่วย
      - คำนวณตัวหารจาก 127 คูณ (e + f) ก่อน
    misconceptions:
      - match: 472.4
        feedback: ลืมแรงเสียดทานด้านข้าง f ใช้เฉพาะการยกโค้ง จึงได้รัศมีใหญ่เกินจำเป็นมาก
    solution: R = 60² ÷ [127 × (0.06 + 0.15)] = 3,600 ÷ 26.67 ≈ 135.0 m โค้งที่รัศมีเล็กกว่านี้ต้องลดความเร็วหรือเพิ่มการยกโค้ง
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.transport.traffic-highway.p006
    topics:
      - engineering.transport.traffic-highway
    difficulty: 2
    type: mcq
    stem: ทำไมทางโค้งบนทางหลวงจึงต้องมีการยกโค้ง (superelevation)
    choices:
      - id: a
        text: เพื่อให้น้ำหนักรถช่วยสร้างแรงเข้าหาศูนย์กลางโค้ง ลดการพึ่งพาแรงเสียดทานด้านข้าง
        correct: true
      - id: b
        text: เพื่อให้น้ำระบายออกไปได้เร็วขึ้นเท่านั้น
        feedback: การระบายน้ำเป็นผลข้างเคียง แต่ไม่ใช่เหตุผลหลักของการยกโค้งเพื่อการทรงตัว
      - id: c
        text: เพื่อให้รถวิ่งเร็วขึ้นโดยไม่ต้องเหยียบคันเร่ง
        feedback: การยกโค้งไม่ได้เพิ่มความเร็วแต่ช่วยให้วิ่งผ่านโค้งได้อย่างมั่นคง
      - id: d
        text: เพื่อให้ป้ายจราจรมองเห็นง่ายขึ้น
        feedback: ป้ายจราจรไม่ใช่เหตุผลของการยกโค้ง
    hints:
      - ลองนึกถึงแรงที่ดึงรถออกจากศูนย์กลางโค้งเมื่อวิ่งเร็ว
      - น้ำหนักรถที่เอียงช่วยสร้างแรงที่ชี้เข้าหาศูนย์กลางโค้ง
    solution: การยกโค้งทำให้ส่วนหนึ่งของน้ำหนักรถช่วยสร้างแรงเข้าหาศูนย์กลางโค้ง ลดการพึ่งพาแรงเสียดทานด้านข้างซึ่งอาจต่ำเมื่อพื้นผิวเปียก จึงช่วยให้รถวิ่งผ่านโค้งได้ปลอดภัยที่ความเร็วที่ออกแบบ
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.transport.traffic-highway.p007
    topics:
      - engineering.transport.traffic-highway
    difficulty: 2
    type: order
    stem: เรียงลำดับขั้นตอนการคำนวณเวลาสัญญาณไฟสองเฟสด้วยวิธีของ Webster
    items:
      - รวบรวมปริมาณจราจรของแต่ละเฟสในชั่วโมงที่คับคั่ง
      - คำนวณอัตราส่วนปริมาณต่อความจุ y ของแต่ละเฟส รวมเป็น Y และรวมเวลาสูญเสีย L ของหนึ่งรอบ
      - คำนวณรอบเวลาที่เหมาะสมด้วยสูตร (1.5L + 5) ÷ (1 − Y)
      - แบ่งเวลาเขียวของแต่ละเฟสตามสัดส่วน y ของเฟสนั้น
    hints:
      - ต้องรู้ปริมาณจราจรก่อนจะคำนวณอัตราส่วนได้
      - รอบเวลาคำนวณจากค่า Y และ L แล้วจึงแบ่งเวลาเขียว
    solution: เริ่มจากรวบรวมปริมาณจราจรแต่ละเฟส คำนวณ y และ Y พร้อมรวมเวลาสูญเสีย L จากนั้นคำนวณรอบเวลา C แล้วแบ่งเวลาเขียว C − L ตามสัดส่วน y ของแต่ละเฟส
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.transport.traffic-highway.p008
    topics:
      - engineering.transport.traffic-highway
    difficulty: 3
    type: numeric
    stem: (ข้อมูลสมมติ) ทางแยกสองเฟสในเมืองอุดรธานีมี y₁ = 0.40 และ y₂ = 0.35 เวลาสูญเสียรวม L = 8 วินาทีต่อรอบ รอบเวลาที่เหมาะสมตามสูตรของ Webster เท่ากับกี่วินาที (ตอบทศนิยมหนึ่งตำแหน่ง ใช้ C = (1.5L + 5) ÷ (1 − Y))
    answer:
      value: 68.0
      tolerance: 0.1
      unit: s
    hints:
      - คำนวณ Y = y₁ + y₂ ก่อน
      - ตัวเศษคือ 1.5 คูณ L บวก 5 วินาที
    misconceptions:
      - match: 48.0
        feedback: ลืมบวก 5 วินาทีในตัวเศษของสูตรของ Webster
    solution: Y = 0.40 + 0.35 = 0.75 C = (1.5 × 8 + 5) ÷ (1 − 0.75) = 17 ÷ 0.25 = 68.0 วินาที
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.transport.traffic-highway.p009
    topics:
      - engineering.transport.traffic-highway
    difficulty: 3
    type: numeric
    stem: (ข้อมูลสมมติ) ทางแยกสองเฟสมีเวลาสูญเสียรวม L = 8 วินาทีต่อรอบ อัตราส่วนปริมาณต่อความจุ y₁ = 0.40 และ y₂ = 0.35 โดยรอบเวลาที่เหมาะสมคือ 68 วินาที เวลาเขียวของเฟสที่หนึ่งเป็นกี่วินาที (ตอบทศนิยมหนึ่งตำแหน่ง ใช้ g₁ = (C − L) × y₁ ÷ Y โดย Y = y₁ + y₂)
    answer:
      value: 32.0
      tolerance: 0.1
      unit: s
    hints:
      - เวลาที่แบ่งได้จริงคือ C − L
      - แบ่งเวลาที่เหลือตามสัดส่วน y₁ ÷ Y
    misconceptions:
      - match: 36.3
        feedback: แบ่งรอบเวลาทั้งหมดรวมเวลาสูญเสียแทนที่จะแบ่งเฉพาะเวลาที่ใช้ได้จริง C − L
    solution: g₁ = (68 − 8) × 0.40 ÷ 0.75 = 60 × 0.5333 = 32.0 วินาที เฟสที่สองได้ 28.0 วินาที รวมกับ L = 8 ได้ 68 วินาทีพอดี
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.transport.traffic-highway.p010
    topics:
      - engineering.transport.traffic-highway
    difficulty: 3
    type: mcq
    stem: ทางโค้งราบในช่วงฝนตกที่แรงเสียดทานด้านข้างลดลง ควรทำอย่างไรเพื่อความปลอดภัย
    choices:
      - id: a
        text: เพิ่มความเร็วเพื่อให้ล้อเกาะถนนได้ดีขึ้น
        feedback: การเพิ่มความเร็วทำให้แรงที่ต้องการในโค้งเพิ่มขึ้นและอันตรายมากขึ้น
      - id: b
        text: ลดความเร็วจำกัดในช่วงฝนตก ติดป้ายเตือน และดูแลการระบายน้ำผิวทาง
        correct: true
      - id: c
        text: ไม่ต้องทำอะไรเพราะการยกโค้งเพียงพออยู่แล้วเสมอ
        feedback: การยกโค้งออกแบบไว้สำหรับสภาพที่คาดการณ์ไว้ ไม่ได้รับประกันทุกสภาพ
      - id: d
        text: ปิดทางโค้งทั้งหมดตลอดปี
        feedback: การปิดทางไม่ได้เป็นมาตรการที่สมเหตุสมผลสำหรับการจราจรทั่วไป
    hints:
      - แรงเสียดทานที่ลดลงทำให้รถต้องการระยะมากขึ้นในการควบคุม
      - การลดความเร็วที่ปลอดภัยคือวิธีที่ควบคุมได้ง่ายที่สุดในสถานการณ์นี้
    solution: เมื่อแรงเสียดทานลดลง ความเร็วที่ปลอดภัยในโค้งจะลดลงตามสมการ R = V² ÷ [127(e + f)] การลดความเร็วจำกัด การเตือนด้วยป้าย และการระบายน้ำผิวทางที่ดี ช่วยลดความเสี่ยงได้
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.transport.traffic-highway.p011
    topics:
      - engineering.transport.traffic-highway
    difficulty: 4
    type: numeric
    stem: (ข้อมูลสมมติ) บนทางหลวงสายหนึ่งกำหนดความเร็วออกแบบ 90 กม./ชม. ใช้เวลาตอบสนอง 2.5 วินาที และความหน่วงการเบรก 3.4 เมตร/วินาที² ระยะมองเห็นเพื่อหยุดรถ (SSD) เท่ากับกี่เมตร (ตอบทศนิยมหนึ่งตำแหน่ง)
    answer:
      value: 154.4
      tolerance: 0.2
      unit: m
    hints:
      - แปลง 90 กม./ชม. เป็น 25 เมตร/วินาที
      - ระยะตอบสนอง = 25 × 2.5 และระยะเบรก = 25² ÷ (2 × 3.4)
    misconceptions:
      - match: 62.5
        feedback: ลืมระยะเบรกและใช้เฉพาะระยะตอบสนอง
    solution: v = 25 m/s ระยะตอบสนอง = 62.5 m ระยะเบรก = 625 ÷ 6.8 ≈ 91.9 m SSD ≈ 154.4 m ความเร็วเพิ่ม 1.5 เท่าจาก 60 กม./ชม. แต่ระยะเบรกเพิ่มถึง 2.25 เท่า เพราะแปรผันกับกำลังสองของความเร็ว
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.transport.traffic-highway.p012
    topics:
      - engineering.transport.traffic-highway
    difficulty: 4
    type: numeric
