  <text x="229.0" y="93.3" text-anchor="middle" fill="#1f2937" font-size="13">ถาม สังเกต อ่าน</text>
  <line x1="298.0" y1="80.0" x2="305.8" y2="80.0" stroke="#1f2937" stroke-width="2"/>
