      - { id: b, text: "ภูเก็ตมีภูเขาบังดวงอาทิตย์บางส่วน", feedback: "ภูเขาหรือทะเลไม่ได้บังดวงอาทิตย์ตอนกลางวันที่ดวงอาทิตย์อยู่สูง ความต่างมาจากส่วนของเงาดวงจันทร์" }
      - { id: c, text: "ภูเก็ตอยู่ในเงามืดของโลก", feedback: "เงาของโลกทำให้เกิดจันทรุปราคา ไม่ใช่สุริยุปราคา" }
      - { id: d, text: "ดวงจันทร์ที่ภูเก็ตเห็นเป็นคนละดวงกัน", feedback: "โลกมีดวงจันทร์ดวงเดียว แต่ละที่มองเห็นจากมุมต่างกันเล็กน้อย" }
    hints:
      - "เงาของดวงจันทร์มีสองส่วน"
      - "เงามืดบนโลกแคบเพียงไม่กี่ร้อยกิโลเมตร"
    solution: "แนวเงามืดของดวงจันทร์พาดผ่านสีคิ้ว ดวงจันทร์จึงบังดวงอาทิตย์มิด ส่วนภูเก็ตอยู่ไกลจากแนวนั้นแต่อยู่ในเงามัว จึงเห็นดวงอาทิตย์แหว่งบางส่วน"
