    ai_assisted: true

  - id: health.fitness.fitness-components.p012
    topics: [health.fitness.fitness-components]
    difficulty: 4
    type: numeric
    stem: "ภาคเรียนที่ 1 ต้นดันพื้นได้ 16 ครั้งใน 30 วินาที หลังฝึกสม่ำเสมอ ภาคเรียนที่ 2 ทำได้ 20 ครั้ง ผลดีขึ้นคิดเป็นร้อยละเท่าใดของผลเดิม (ตอบเป็นตัวเลขในหน่วยร้อยละ)"
    answer: { value: 25, unit: "%" }
    misconceptions:
      - { match: 20, feedback: "หารด้วยผลใหม่ (20) แต่ร้อยละความก้าวหน้าต้องเทียบกับผลเดิม (16)" }
      - { match: 4, feedback: "4 คือจำนวนครั้งที่เพิ่มขึ้น ยังไม่ได้เปลี่ยนเป็นร้อยละ" }
    hints:
      - "หาจำนวนที่เพิ่มขึ้นก่อน"
      - "ร้อยละที่เพิ่มขึ้น = ส่วนที่เพิ่ม ÷ ผลเดิม × 100"
    solution: "เพิ่มขึ้น $20 - 16 = 4$ ครั้ง คิดเป็น $\\frac{4}{16} \\times 100 = 25\\%$"
