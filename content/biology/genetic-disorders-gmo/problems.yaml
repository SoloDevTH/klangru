problems:
  - id: biology.genetics.genetic-disorders-gmo.p001
    topics: [biology.genetics.genetic-disorders-gmo]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นโรคทางพันธุกรรม"
    choices:
      - { id: a, text: "ธาลัสซีเมีย", correct: true }
      - { id: b, text: "ไข้เลือดออก", feedback: "ไข้เลือดออกเกิดจากไวรัสเดงกีที่ยุงลายเป็นพาหะ เป็นโรคติดต่อ ไม่ได้ถ่ายทอดทางยีน" }
      - { id: c, text: "วัณโรค", feedback: "วัณโรคเกิดจากแบคทีเรียและติดต่อทางการหายใจ ไม่ใช่โรคทางพันธุกรรม" }
      - { id: d, text: "ไข้หวัดใหญ่", feedback: "ไข้หวัดใหญ่เกิดจากไวรัส เป็นโรคติดต่อ" }
    hints:
      - "โรคทางพันธุกรรมเกิดจากยีนหรือโครโมโซมผิดปกติ ไม่ได้เกิดจากเชื้อโรค"
      - "ตัวเลือกใดถ่ายทอดจากพ่อแม่สู่ลูกผ่านยีน"
    solution: "ธาลัสซีเมียเกิดจากยีนที่ควบคุมการสร้างฮีโมโกลบินผิดปกติ ถ่ายทอดจากพ่อแม่สู่ลูก ส่วนตัวเลือกอื่นเป็นโรคติดต่อที่เกิดจากเชื้อโรค"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.genetic-disorders-gmo.p002
    topics: [biology.genetics.genetic-disorders-gmo]
    difficulty: 1
    type: match
    stem: "จับคู่ภาวะกับสาเหตุ"
    pairs:
      - { left: "ธาลัสซีเมีย", right: "ยีนควบคุมการสร้างฮีโมโกลบินผิดปกติ" }
      - { left: "ดาวน์ซินโดรม", right: "โครโมโซมคู่ที่ 21 มี 3 แท่ง" }
      - { left: "ตาบอดสี", right: "แอลลีลด้อยบนโครโมโซม X" }
      - { left: "กลุ่มอาการเทอร์เนอร์", right: "เพศหญิงที่มีโครโมโซม X เพียงแท่งเดียว" }
    hints:
      - "สองภาวะเป็นความผิดปกติของยีน อีกสองภาวะเป็นความผิดปกติของโครโมโซม"
      - "ภาวะที่พบในชายมากกว่าหญิงมักเกี่ยวกับโครโมโซม X"
    solution: "ธาลัสซีเมียและตาบอดสีเป็นความผิดปกติของยีน (ตาบอดสีอยู่บน X) ดาวน์ซินโดรมมีโครโมโซมคู่ที่ 21 เกินมา 1 แท่ง และกลุ่มอาการเทอร์เนอร์คือเพศหญิงที่มี X แท่งเดียว (45,X)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.genetic-disorders-gmo.p003
    topics: [biology.genetics.genetic-disorders-gmo]
    difficulty: 1
    type: text
    stem: "คนที่มีแอลลีลผิดปกติของโรคที่เป็นลักษณะด้อยเพียง 1 แอลลีล มีสุขภาพปกติ แต่ส่งแอลลีลนั้นให้ลูกได้ เรียกว่าอะไร (ตอบคำเดียว)"
    accepted: ["พาหะ", "พาหะของโรค", "carrier"]
    misconceptions:
      - { match: "ผู้ป่วย", feedback: "แอลลีลด้อยแอลลีลเดียวไม่ทำให้แสดงอาการ คนนี้จึงไม่ใช่ผู้ป่วย" }
    hints:
      - "คนนี้มีจีโนไทป์แบบเฮเทอโรไซกัส"
      - "เป็นคำเดียวกับที่ใช้เรียกยุงที่นำเชื้อโรค แต่ในพันธุศาสตร์หมายถึงผู้ที่มีแอลลีลแฝงอยู่"
    solution: "เรียกว่า พาหะ เช่น พาหะธาลัสซีเมียมีแอลลีลผิดปกติ 1 แอลลีลคู่กับแอลลีลปกติ จึงไม่แสดงอาการ แต่ลูกอาจได้แอลลีลผิดปกตินั้นไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.genetic-disorders-gmo.p004
    topics: [biology.genetics.genetic-disorders-gmo]
    difficulty: 2
    type: numeric
    stem: "เซลล์ร่างกายของคนทั่วไปมีโครโมโซม 46 แท่ง เซลล์ร่างกายของคนที่มีดาวน์ซินโดรมจากโครโมโซมคู่ที่ 21 เกินมา มีโครโมโซมกี่แท่ง"
    answer: { value: 47, unit: แท่ง }
    misconceptions:
      - { match: 48, feedback: "โครโมโซมคู่ที่ 21 เกินมา 1 แท่ง (มี 3 แท่ง) ไม่ได้เกินมาทั้งคู่" }
      - { match: 24, feedback: "24 คือจำนวนในเซลล์สืบพันธุ์ที่มีโครโมโซมเกิน 1 แท่ง แต่โจทย์ถามเซลล์ร่างกาย" }
    hints:
      - "คู่ที่ 21 ปกติมี 2 แท่ง ในดาวน์ซินโดรมมีกี่แท่ง"
      - "บวกจำนวนที่เกินเข้ากับ 46"
    solution: "คู่ที่ 21 มี 3 แท่งแทน 2 แท่ง เกินมา 1 แท่ง จึงมี $46 + 1 = 47$ แท่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.genetic-disorders-gmo.p005
    topics: [biology.genetics.genetic-disorders-gmo]
    difficulty: 2
    type: numeric
    stem: "สามีภรรยาคู่หนึ่งที่ตรวจเลือดตอนฝากครรภ์ที่โรงพยาบาลชุมชน พบว่าเป็นพาหะธาลัสซีเมียชนิดเดียวกันทั้งคู่ ลูกคนนี้มีโอกาสเป็นโรคธาลัสซีเมียร้อยละเท่าใด"
    answer: { value: 25, unit: "%" }
    misconceptions:
      - { match: 50, feedback: "ร้อยละ 50 คือโอกาสเป็นพาหะ ไม่ใช่โอกาสเป็นโรค" }
      - { match: 75, feedback: "ร้อยละ 75 คือโอกาสไม่เป็นโรค (ปกติหรือพาหะ)" }
    hints:
      - "ให้ T แทนแอลลีลปกติ t แทนแอลลีลผิดปกติ พ่อแม่เป็น Tt ทั้งคู่"
      - "เขียนตารางพันเนตต์ 2 × 2 แล้วนับช่องที่เป็น tt"
    solution: "Tt × Tt ได้ TT : Tt : tt = 1 : 2 : 1 เป็นโรค (tt) 1 ใน 4 ช่อง หรือร้อยละ 25"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.genetic-disorders-gmo.p006
    topics: [biology.genetics.genetic-disorders-gmo]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นประโยชน์ที่แท้จริงของการปรึกษาแพทย์และตรวจเลือดก่อนแต่งงาน"
    choices:
      - { id: a, text: "คู่สมรสรู้ความเสี่ยงที่ลูกจะเป็นโรคทางพันธุกรรม และวางแผนครอบครัวได้", correct: true }
      - { id: b, text: "ทำให้คนที่เป็นพาหะหายจากการเป็นพาหะ", feedback: "การตรวจไม่ได้เปลี่ยนยีน พาหะยังเป็นพาหะเหมือนเดิม" }
      - { id: c, text: "แพทย์จะห้ามคู่ที่เป็นพาหะทั้งคู่แต่งงานกัน", feedback: "แพทย์ให้ข้อมูลและคำแนะนำ การตัดสินใจเป็นสิทธิ์ของคู่สมรส" }
      - { id: d, text: "ป้องกันการติดโรคทางพันธุกรรมจากคู่สมรส", feedback: "โรคทางพันธุกรรมไม่ติดต่อจากคนสู่คน แต่ถ่ายทอดจากพ่อแม่สู่ลูก" }
    hints:
      - "การตรวจบอกจีโนไทป์ ไม่ได้เปลี่ยนจีโนไทป์"
      - "ข้อมูลนี้ช่วยใครตัดสินใจเรื่องอะไร"
    solution: "การตรวจทำให้รู้ว่าแต่ละคนเป็นพาหะหรือไม่ คู่สมรสจึงรู้โอกาสที่ลูกจะเป็นโรค และวางแผนการมีลูกหรือรับการตรวจระหว่างตั้งครรภ์ได้ทันเวลา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.genetic-disorders-gmo.p007
    topics: [biology.genetics.genetic-disorders-gmo]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการสร้างแบคทีเรียที่ผลิตอินซูลินของคน"
    items:
      - "ตัดยีนอินซูลินออกจาก DNA ของคนด้วยเอนไซม์ตัดจำเพาะ"
      - "ตัดพลาสมิดของแบคทีเรียด้วยเอนไซม์ชนิดเดียวกัน"
      - "เชื่อมยีนอินซูลินเข้ากับพลาสมิดด้วยเอนไซม์ไลเกส"
      - "ใส่พลาสมิดรีคอมบิแนนท์เข้าไปในแบคทีเรีย"
      - "เลี้ยงแบคทีเรียให้เพิ่มจำนวนแล้วแยกอินซูลินให้บริสุทธิ์"
    hints:
      - "ต้องมียีนและตัวพาที่ถูกตัดก่อน จึงเชื่อมกันได้"
      - "แบคทีเรียสร้างอินซูลินได้หลังจากได้รับพลาสมิดที่มียีนแล้ว"
    solution: "ตัดยีน → ตัดพลาสมิดด้วยเอนไซม์ชนิดเดียวกันให้ปลายเข้ากันได้ → เชื่อมด้วยไลเกส → ใส่เข้าแบคทีเรีย → เลี้ยงให้เพิ่มจำนวนและแยกอินซูลิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.genetic-disorders-gmo.p008
    topics: [biology.genetics.genetic-disorders-gmo]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นสิ่งมีชีวิตดัดแปรพันธุกรรม (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "แบคทีเรียที่ใส่ยีนอินซูลินของคน", correct: true }
      - { id: b, text: "ข้าวโพดที่ใส่ยีนจากแบคทีเรีย Bacillus thuringiensis", correct: true }
      - { id: c, text: "มะม่วงที่ได้จากการเสียบยอดกิ่งพันธุ์ดีบนต้นตอ", feedback: "การเสียบยอดไม่ได้เปลี่ยนยีนของพืช กิ่งพันธุ์ยังมียีนเดิม" }
      - { id: d, text: "วัวนมที่ได้จากการคัดเลือกพ่อแม่พันธุ์ที่ให้นมมากหลายรุ่น", feedback: "การผสมพันธุ์คัดเลือกใช้ความแปรผันที่มีอยู่แล้ว ไม่ได้ใช้พันธุวิศวกรรม" }
      - { id: e, text: "กล้วยไม้ที่ขยายพันธุ์ด้วยการเพาะเลี้ยงเนื้อเยื่อ", feedback: "การเพาะเลี้ยงเนื้อเยื่อได้ต้นใหม่ที่มียีนเหมือนต้นเดิม" }
    hints:
      - "GMO ต้องมีการเปลี่ยนสารพันธุกรรมโดยตรงด้วยพันธุวิศวกรรม"
      - "ถามตัวเองว่าวิธีนี้ใส่ยีนจากสิ่งมีชีวิตอื่นหรือไม่"
    solution: "ข้อ a และ b มีการใส่ยีนจากสิ่งมีชีวิตชนิดอื่นด้วยพันธุวิศวกรรม จึงเป็น GMO ส่วนการเสียบยอด การผสมพันธุ์คัดเลือก และการเพาะเลี้ยงเนื้อเยื่อไม่ได้ใส่ยีนใหม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.genetic-disorders-gmo.p009
    topics: [biology.genetics.genetic-disorders-gmo]
    difficulty: 3
    type: numeric
    stem: "จากกราฟ การปลูกฝ้าย Bt ลดจำนวนครั้งที่ต้องฉีดพ่นสารฆ่าหนอนต่อฤดูลงร้อยละเท่าใดเมื่อเทียบกับฝ้ายพันธุ์ทั่วไป (ตอบทศนิยม 1 ตำแหน่ง)"
    figure: { src: bt-cotton-sprays.svg, alt: "กราฟแท่งชื่อการฉีดพ่นสารฆ่าหนอนเจาะสมอฝ้าย (ข้อมูลสมมติ) แกนตั้งเป็นจำนวนครั้งต่อฤดูตั้งแต่ 0 ถึง 14 ฝ้ายพันธุ์ทั่วไปสูง 12 ครั้ง ฝ้าย Bt สูง 4 ครั้ง ใต้กราฟระบุว่าเป็นค่าเฉลี่ยจากแปลงทดลอง 20 แปลงต่อพันธุ์" }
    answer: { value: 66.7, tolerance: 0.7, unit: "%" }
    misconceptions:
      - { match: 33.3, feedback: "33.3 คือฝ้าย Bt ยังต้องพ่นอยู่กี่เปอร์เซ็นต์ของเดิม ไม่ใช่ส่วนที่ลดลง" }
      - { match: 8, feedback: "8 คือจำนวนครั้งที่ลดลง โจทย์ถามเป็นร้อยละ" }
      - { match: 200, feedback: "ร้อยละที่ลดลงต้องหารด้วยค่าเดิม (12) ไม่ใช่ค่าใหม่ (4)" }
    hints:
      - "อ่านค่าจากกราฟ ค่าเดิมคือฝ้ายพันธุ์ทั่วไป"
      - "ร้อยละที่ลดลง = (ค่าเดิม − ค่าใหม่) ÷ ค่าเดิม × 100"
    solution: "ฝ้ายทั่วไป 12 ครั้ง ฝ้าย Bt 4 ครั้ง ลดลง $\\tfrac{12 - 4}{12} \\times 100 \\approx 66.7$ เปอร์เซ็นต์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.genetic-disorders-gmo.p010
    topics: [biology.genetics.genetic-disorders-gmo]
    difficulty: 3
    type: mcq
    stem: "ข้อใดเป็นข้อกังวลต่อสิ่งแวดล้อมของพืชดัดแปรพันธุกรรมที่นักวิทยาศาสตร์ใช้ติดตามจริง"
    choices:
      - { id: a, text: "ละอองเรณูอาจนำยีนที่ใส่ไปผสมกับพืชพันธุ์พื้นเมืองหรือพืชป่าที่เป็นญาติกัน", correct: true }
      - { id: b, text: "คนที่กินพืชนั้นจะได้รับยีนเข้าไปเปลี่ยน DNA ในเซลล์ของตน", feedback: "DNA ในอาหารถูกย่อยในทางเดินอาหารเหมือน DNA จากอาหารทั่วไป ไม่ได้เข้าไปแทรกใน DNA ของเรา" }
      - { id: c, text: "พืช GMO ทุกชนิดสร้างสารพิษต่อคน", feedback: "ต้องประเมินเป็นรายกรณี จะสรุปว่าทุกชนิดเป็นพิษไม่ได้" }
      - { id: d, text: "พืช GMO ทำให้คนในพื้นที่ปลูกติดโรคทางพันธุกรรม", feedback: "โรคทางพันธุกรรมไม่ได้ติดต่อจากพืชหรือสิ่งแวดล้อม" }
    hints:
      - "คิดถึงการถ่ายเรณูระหว่างพืชที่ปลูกใกล้กัน"
      - "ข้อที่ถูกต้องเป็นผลต่อสิ่งแวดล้อม ไม่ใช่ความเชื่อเรื่องการกิน"
    solution: "ยีนที่ใส่อาจแพร่ไปยังพืชพันธุ์อื่นหรือพืชป่าผ่านละอองเรณู ซึ่ง WHO ระบุว่าเป็นประเด็นที่ต้องประเมิน ข้ออื่นเป็นความเข้าใจผิดหรือสรุปเกินหลักฐาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.genetic-disorders-gmo.p011
    topics: [biology.genetics.genetic-disorders-gmo]
    difficulty: 3
    type: mcq
    stem: "บริษัทหนึ่งจะนำเข้าซีอิ๊วที่ทำจากถั่วเหลืองดัดแปรพันธุกรรมมาขายในประเทศไทย ข้อใดสอดคล้องกับประกาศกระทรวงสาธารณสุข ฉบับที่ 431 และ 432 (พ.ศ. 2565)"
    choices:
      - { id: a, text: "ต้องผ่านการประเมินความปลอดภัย และแสดงคำว่าดัดแปรพันธุกรรมบนฉลากตามเกณฑ์ที่กำหนด", correct: true }
