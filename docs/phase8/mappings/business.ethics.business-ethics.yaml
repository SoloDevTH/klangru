rows:
  - { framework: th-tqf-accounting, indicators: ["5.1.1"], coverage: full, note: "หลักการพื้นฐาน 6 ข้อและอุปสรรค 5 ประเภทตามคู่มือประมวลจรรยาบรรณของผู้ประกอบวิชาชีพบัญชี (ฉบับแปลของสภาวิชาชีพบัญชีฯ 2564) ความขัดแย้งทางผลประโยชน์ และจริยธรรมกับกฎหมาย" }
  - { framework: th-tqf-accounting, indicators: ["5.1.2"], coverage: partial, note: "ขั้นตอนตัดสินใจเชิงจริยธรรมและกรณีศึกษา (เลื่อนบันทึกค่าใช้จ่าย รับรู้รายได้ก่อนงวด ของขวัญจากผู้ขาย ถูกข่มขู่) ฝึกได้ในรูปตัวเลือก การแก้ปัญหาในการปฏิบัติงานจริงต้องฝึกนอกแอป" }
  - { framework: th-tqf-accounting, indicators: ["5.1.3"], coverage: partial, note: "อธิบายความซื่อสัตย์ เที่ยงธรรม รอบคอบ และความรับผิดชอบต่อวิชาชีพและสังคม (CSR ความยั่งยืน) แต่การแสดงออกเป็นพฤติกรรมของผู้เรียนวัดในแอปไม่ได้" }
