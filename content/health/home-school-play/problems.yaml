  - id: health.safety.home-school-play.p016
    topics: [health.safety.home-school-play]
    difficulty: 4
    type: mcq
    stem: "ที่บ้านมีปลั๊กพ่วงอันเดียว เสียบหม้อหุงข้าว กาต้มน้ำ และเตารีดพร้อมกัน สายไฟเริ่มร้อน เพราะเหตุใดจึงอันตราย"
    choices:
      - { id: a, text: "เครื่องใช้ไฟฟ้าที่ให้ความร้อนกินไฟมาก เสียบพร้อมกันทำให้สายไฟร้อนเกินจนอาจเกิดไฟไหม้", correct: true }
      - { id: b, text: "ไม่อันตราย เพราะปลั๊กพ่วงมีช่องเสียบหลายช่อง", feedback: "จำนวนช่องไม่ได้บอกว่าสายรับไฟได้มาก เสียบเครื่องที่กินไฟมากพร้อมกันทำให้สายร้อนเกินได้" }
      - { id: c, text: "อันตรายเพราะเครื่องใช้ไฟฟ้าจะเสียเร็วเท่านั้น", feedback: "อันตรายที่สำคัญกว่าคือสายไฟร้อนจนเกิดไฟไหม้" }
      - { id: d, text: "อันตรายเพราะหม้อหุงข้าวจะหุงข้าวไม่สุก", feedback: "ปัญหาหลักคือความร้อนที่สายไฟ ไม่ใช่ผลของการหุงข้าว" }
    hints:
      - "สายไฟที่ร้อนผิดปกติเป็นสัญญาณเตือน"
      - "เครื่องที่ทำให้เกิดความร้อนใช้ไฟฟ้ามาก"
    solution: "เครื่องใช้ไฟฟ้าที่ให้ความร้อนใช้กระแสไฟฟ้ามาก เสียบรวมกันที่ปลั๊กพ่วงเดียวทำให้สายร้อนเกินจนฉนวนละลายและเกิดไฟไหม้ได้ ควรถอดออกและบอกผู้ใหญ่ ใช้ทีละเครื่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.home-school-play.p017
    topics: [health.safety.home-school-play]
    difficulty: 5
    type: mcq
    stem: "ตอนพักกลางวัน บอลตกจากราวโหนลงมานอนร้องไห้ มือกุมแขนข้างหนึ่งที่ผิดรูป เพื่อน ๆ มามุงดูกันเต็ม ข้อใดเป็นการตัดสินใจที่ดีที่สุด"
    choices:
      - { id: a, text: "ให้บอลอยู่นิ่ง ๆ ไม่ดึงแขน ให้เพื่อนหนึ่งคนอยู่ด้วย อีกคนวิ่งไปบอกครูทันที และขอให้เพื่อนที่มุงถอยออกไป", correct: true }
      - { id: b, text: "ช่วยกันดึงแขนบอลให้ตรงก่อนไปบอกครู", feedback: "แขนที่ผิดรูปอาจกระดูกหัก การดึงทำให้บาดเจ็บมากขึ้น ต้องให้ผู้ใหญ่และบุคลากรการแพทย์ดูแล" }
      - { id: c, text: "พยุงให้บอลลุกขึ้นแล้วเดินไปห้องพยาบาลเอง", feedback: "การให้ผู้บาดเจ็บเดินเองอาจทำให้แขนกระทบกระเทือนเพิ่ม ควรให้อยู่นิ่งและตามครูมา" }
      - { id: d, text: "ถ่ายรูปส่งให้เพื่อนในกลุ่มแชตดูก่อน", feedback: "การถ่ายรูปไม่ได้ช่วยผู้บาดเจ็บ และไม่เคารพความเป็นส่วนตัวของเพื่อน" }
    hints:
      - "แขนที่ผิดรูปอาจเป็นกระดูกหัก ไม่ควรขยับ"
      - "แบ่งหน้าที่: มีคนอยู่กับผู้บาดเจ็บ และมีคนไปตามผู้ใหญ่"
    solution: "ให้ผู้บาดเจ็บอยู่นิ่ง ไม่ดึงหรือขยับส่วนที่ผิดรูป มีคนอยู่เป็นเพื่อน อีกคนไปตามครูทันที และให้คนที่มุงถอยออกเพื่อให้ผู้ใหญ่เข้าถึงได้ง่าย ครูจะตัดสินใจโทร 1669 ถ้าจำเป็น"
    license: CC-BY-SA-4.0
    ai_assisted: true

