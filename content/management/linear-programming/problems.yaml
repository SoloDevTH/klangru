    ai_assisted: true

  - id: management.operations.linear-programming.p015
    topics: [management.operations.linear-programming]
    difficulty: 5
    type: numeric
    stem: "ปัญหาการขนส่งน้ำตาลเดิม A มี 70 ตัน B มี 50 ตัน ร้าน 1, 2, 3 ต้องการ 40, 50, 30 ตัน ต้นทุน (บาทต่อตัน) จาก A: 700, 600, 1,200 จาก B: 1,000, 400, 500 ต้นทุนรวมต่ำสุดที่เป็นไปได้เป็นกี่บาท"
    answer: { value: 69000, unit: บาท }
    hints:
      - "มีสองแหล่ง ให้หาผลต่างต้นทุน A − B ของแต่ละร้าน"
      - "ให้ A ส่งไปยังร้านที่ผลต่างต่ำสุดก่อนจนเต็มความต้องการหรือจน A หมด แล้วให้ B ส่งส่วนที่เหลือ"
    misconceptions:
      - { match: 84000, feedback: "นั่นคือแผนจากวิธีต้นทุนต่ำสุด ซึ่งยังปรับให้ถูกลงได้" }
      - { match: 63000, feedback: "ดูเหมือนให้แต่ละร้านรับจากแหล่งที่ถูกกว่าทุกร้าน แต่ B มีแค่ 50 ตัน ส่งให้ร้าน 2 และ 3 ครบ (80 ตัน) ไม่ได้" }
    solution: "ผลต่าง A − B: ร้าน 1 = −300 ร้าน 2 = +200 ร้าน 3 = +700 A ส่งร้าน 1 ก่อน 40 ตัน แล้วร้าน 2 อีก 30 ตัน B ส่งร้าน 2 20 ตัน และร้าน 3 30 ตัน ต้นทุน $40(700) + 30(600) + 20(400) + 30(500) = 28{,}000 + 18{,}000 + 8{,}000 + 15{,}000 = 69{,}000$ บาท ถูกกว่าแผนต้นทุนต่ำสุด 15,000 บาท"
