problems:
- id: technology.living.problem-solving-learning.p001
  topics:
  - technology.living.problem-solving-learning
  difficulty: 1
  type: order
  stem: "เรียงลำดับขั้นตอนการแก้ปัญหาในการทำงานให้ถูกต้อง"
  items:
  - "ระบุปัญหาให้ชัดว่าเกิดอะไร ที่ไหน เมื่อไร"
  - "หาสาเหตุด้วยการถามทำไมซ้ำ ๆ"
  - "คิดทางเลือกหลายแบบโดยยังไม่ตัดสิน"
  - "กำหนดเกณฑ์และให้คะแนนทางเลือกเพื่อเลือก"
  - "ลงมือทดลองทีละอย่างและบันทึกผล"
  - "เทียบผลกับปัญหาตั้งต้นแล้วประเมินผล"
  hints:
  - "ก่อนหาสาเหตุต้องรู้ก่อนว่าปัญหาคืออะไร"
  - "ก่อนเลือกทางเลือกต้องมีทางเลือกให้เลือกก่อน"
  - "ขั้นสุดท้ายคือการเทียบผลกับปัญหาที่ตั้งไว้ตอนแรก"
  solution: "ระบุปัญหาให้ชัด แล้วหาสาเหตุด้วยการถามทำไมซ้ำ ๆ จากนั้นคิดทางเลือกหลายแบบ ตั้งเกณฑ์และเลือก ลงมือทดลองทีละอย่าง และประเมินผลเทียบกับปัญหาตั้งต้น"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.problem-solving-learning.p002
  topics:
  - technology.living.problem-solving-learning
  difficulty: 1
  type: mcq
  stem: "ข้อใดเป็นการระบุปัญหาที่ชัดเจนที่สุด"
  choices:
  - id: a
    text: "งานครัวไม่ค่อยดี"
    feedback: "ยังบอกไม่ได้ว่าเกิดอะไรขึ้น ที่ไหน และเมื่อไร จึงหาสาเหตุไม่ได้"
  - id: b
    text: "ผักกวางตุ้งที่ซื้อวันจันทร์เหี่ยวภายในวันพุธเมื่อเก็บในตู้เย็นช่องธรรมดา"
    correct: true
  - id: c
    text: "ทำอะไรก็ไม่สำเร็จ"
    feedback: "เป็นความรู้สึกโดยรวมที่ยังไม่บอกเหตุการณ์ที่ตรวจสอบได้"
  - id: d
    text: "ต้องทำให้ดีกว่านี้"
    feedback: "ยังไม่บอกว่าต้องปรับเรื่องอะไรและอย่างไร"
  hints:
  - "ปัญหาที่ชัดควรบอกได้ว่าเกิดอะไร ที่ไหน และเมื่อไร"
  - "ลองหาตัวเลือกที่มีรายละเอียดที่ตรวจสอบได้จริง"
  solution: "การระบุปัญหาที่ดีบอกสิ่งที่เกิดขึ้นจริง สถานที่ เวลา และบริบท เช่น ผักที่ซื้อมาเหี่ยวเร็วเมื่อเก็บในช่องธรรมดา ทำให้หาสาเหตุและทดลองแก้ได้"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.problem-solving-learning.p003
  topics:
  - technology.living.problem-solving-learning
  difficulty: 2
  type: match
  stem: "จับคู่ขั้นของการแก้ปัญหากับสิ่งที่ทำในขั้นนั้น"
  pairs:
  - left: "ระบุปัญหา"
    right: "เขียนสิ่งที่เกิดขึ้นจริง เวลา และที่ที่เกิด"
  - left: "หาสาเหตุ"
    right: "ถามทำไมซ้ำ ๆ จนถึงต้นเหตุ"
  - left: "สร้างทางเลือก"
    right: "คิดวิธีแก้หลายแบบโดยยังไม่ตัดสิน"
  - left: "ตั้งเกณฑ์และเลือก"
    right: "ให้คะแนนทางเลือกตามเกณฑ์ที่กำหนดไว้ก่อน"
  - left: "ประเมินผล"
    right: "เทียบผลหลังทดลองกับปัญหาตั้งต้น"
  hints:
  - "แต่ละขั้นตอบคำถามต่างกัน ลองถามว่าขั้นนั้นตอบเรื่องอะไร"
  - "การเลือกต้องมีเกณฑ์ที่ตั้งไว้ก่อนการให้คะแนน"
  - "การประเมินเกิดหลังลงมือทดลองแล้ว"
  solution: "ระบุปัญหาคือการบอกสิ่งที่เกิดขึ้น หาสาเหตุคือการถามทำไมซ้ำ สร้างทางเลือกคือการคิดหลายแบบ ตั้งเกณฑ์และเลือกคือการให้คะแนน และประเมินผลคือการเทียบผลกับปัญหาตั้งต้น"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.problem-solving-learning.p004
  topics:
  - technology.living.problem-solving-learning
  difficulty: 2
  type: mcq
  stem: "ผ้าขาวเป็นคราบเหลืองหลังซัก ข้อใดคือการหาสาเหตุที่ควรทำก่อนเปลี่ยนวิธี"
  choices:
  - id: a
    text: "เปลี่ยนผงซักฟอกยี่ห้อใหม่ทันทีโดยไม่ดูว่าคราบคืออะไร"
    feedback: "การเปลี่ยนทันทีโดยไม่รู้สาเหตุ อาจไม่ได้แก้ปัญหาและทำให้ไม่รู้ว่าอะไรได้ผล"
  - id: b
    text: "ดูว่าคราบเกิดจากอะไร เช่น เหงื่อ น้ำมัน หรือสนิม แล้วทดลองวิธีแก้ทีละอย่างกับผ้าผืนเล็ก"
    correct: true
  - id: c
    text: "ทิ้งผ้าผืนนั้นเพราะซักไม่ออกแน่นอน"
    feedback: "การตัดสินใจโดยยังไม่ได้ลองหาสาเหตุ ทำให้เสียผ้าโดยไม่จำเป็น"
  - id: d
    text: "ซักซ้ำด้วยน้ำร้อนจัดเพื่อให้คราบหลุดเร็วที่สุด"
    feedback: "น้ำร้อนอาจทำให้คราบบางชนิดติดแน่นขึ้น และยังไม่รู้ว่าคราบเป็นอะไร"
  hints:
  - "สาเหตุต่างกันต้องใช้วิธีแก้ต่างกัน"
  - "การทดลองกับผ้าผืนเล็กช่วยลดความเสียหายได้"
  solution: "การหาสาเหตุก่อนทำให้เลือกวิธีแก้ที่ตรงจุด และการทดลองทีละอย่างกับผ้าผืนเล็กช่วยให้รู้ว่าวิธีใดได้ผลโดยไม่เสี่ยงกับผ้าทั้งหมด"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.problem-solving-learning.p005
  topics:
  - technology.living.problem-solving-learning
  difficulty: 2
  type: numeric
  stem: "ตารางให้คะแนนเลือกวิธีเก็บผักให้สดนาน เกณฑ์และน้ำหนักคือ ประหยัดเงิน (น้ำหนัก 3) ใช้เวลาน้อย (น้ำหนัก 2) ทำได้ง่ายที่บ้าน (น้ำหนัก 1) วิธี A ได้คะแนน 4, 5, 2 และวิธี B ได้คะแนน 5, 3, 5 ตามลำดับ คะแนนรวมถ่วงน้ำหนักของวิธี B เท่ากับเท่าใด"
  answer:
    value: 26
    tolerance: 0
  misconceptions:
  - match: 24
    feedback: "ตอบ 24 คือคะแนนรวมถ่วงน้ำหนักของวิธี A ไม่ใช่วิธี B"
  - match: 13
    feedback: "ตอบ 13 คือการรวมคะแนนดิบโดยไม่คูณน้ำหนัก"
  hints:
  - "คูณคะแนนของแต่ละเกณฑ์ด้วยน้ำหนักของเกณฑ์นั้นก่อน"
  - "นำผลคูณทั้งสามเกณฑ์มาบวกกันเป็นคะแนนรวม"
  solution: "วิธี B: 5 × 3 + 3 × 2 + 5 × 1 = 15 + 6 + 5 = 26 คะแนน (ตรวจด้วย python3: 5*3+3*2+5*1 = 26) ส่วนวิธี A ได้ 24 คะแนน"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.problem-solving-learning.p006
  topics:
  - technology.living.problem-solving-learning
  difficulty: 2
  type: text
  stem: "เทคนิคที่ถามว่าทำไมซ้ำ ๆ เพื่อหาต้นเหตุของปัญหา มีชื่อเรียกว่าอะไร (ตอบเป็นชื่อเทคนิค)"
  accepted:
  - "5 ทำไม"
  - "ห้าทำไม"
  - "5 Whys"
  misconceptions:
  - match: "SWOT"
    feedback: "SWOT ใช้วิเคราะห์จุดแข็ง จุดอ่อน โอกาส และอุปสรรคเชิงกลยุทธ์ ไม่ได้ใช้หาต้นเหตุของปัญหาเดี่ยว"
  hints:
  - "เทคนิคนี้ใช้คำถามสั้น ๆ ซ้ำ ๆ จากปัญหาที่เกิดขึ้น"
  - "ไม่จำเป็นต้องถามให้ครบจำนวนเสมอไป แต่ต้องถึงต้นเหตุที่แก้ได้"
  solution: "เทคนิคนี้เรียกว่า 5 ทำไม (5 Whys) คือถามทำไมต่อจากคำตอบทีละชั้น จนพบสาเหตุที่แก้ไขได้จริง"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.problem-solving-learning.p007
  topics:
  - technology.living.problem-solving-learning
  difficulty: 3
  type: mcq
  stem: "การตัดสินใจอย่างมีเหตุผลต่างจากการลองผิดลองถูกอย่างไร"
  choices:
  - id: a
    text: "ตัดสินใจทันทีโดยไม่ต้องรู้ข้อมูลก่อน"
    feedback: "การตัดสินใจโดยไม่มีข้อมูลเป็นการเดาซึ่งเสี่ยงสูง"
  - id: b
    text: "ใช้เกณฑ์และหลักฐานประกอบการเลือก แล้วตรวจผลหลังทำ"
    correct: true
  - id: c
    text: "เลือกทางที่คนอื่นเคยทำมาแล้วเสมอ"
    feedback: "วิธีของคนอื่นอาจไม่เหมาะกับสถานการณ์ของเรา ต้องตรวจด้วยเกณฑ์และผลจริง"
  - id: d
    text: "ลองหลายอย่างพร้อมกันโดยไม่บันทึกอะไรไว้"
    feedback: "การไม่บันทึกทำให้ไม่รู้ว่าอะไรได้ผล และเรียนรู้จากผลไม่ได้"
  hints:
  - "คิดถึงสิ่งที่ทำให้การเลือกนั้นตรวจสอบได้"
  - "การตัดสินใจที่ดีมีทั้งเหตุผลก่อนทำและการตรวจหลังทำ"
  solution: "การตัดสินใจอย่างมีเหตุผลใช้เกณฑ์และหลักฐานประกอบการเลือก และตรวจผลหลังทำเพื่อยืนยันหรือปรับ ต่างจากการลองผิดลองถูกที่ไม่มีเกณฑ์และไม่บันทึกผล"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.problem-solving-learning.p008
  topics:
  - technology.living.problem-solving-learning
  difficulty: 3
  type: mcq
  stem: "เค้กกล้วยหอมที่อบแล้วไม่ฟู ข้อใดเป็นการทดลองที่ดีที่สุดเพื่อหาสาเหตุ"
  choices:
  - id: a
    text: "เปลี่ยนผงฟู ไข่ และอุณหภูมิเตาพร้อมกันในการทำครั้งเดียว"
    feedback: "เปลี่ยนหลายอย่างพร้อมกันทำให้ไม่รู้ว่าอะไรทำให้ขนมฟูขึ้นหรือแย่ลง"
  - id: b
    text: "เปลี่ยนเฉพาะผงฟูและให้ส่วนผสมอื่นคงเดิม ทำซ้ำหลายครั้งแล้วบันทึกความสูงของขนม"
    correct: true
  - id: c
    text: "ไม่ต้องบันทึกผลเพราะจำได้เอง"
    feedback: "ความจำอาจคลาดเคลื่อน การบันทึกช่วยให้เปรียบเทียบได้ตรงกว่า"
  - id: d
    text: "ทำใหม่ทุกครั้งโดยไม่เปรียบเทียบกับครั้งก่อน"
    feedback: "ถ้าไม่เปรียบเทียบกับครั้งก่อน จะไม่รู้ว่าการเปลี่ยนแปลงใดช่วยได้"
  hints:
  - "การทดลองที่ดีคือเปลี่ยนเพียงตัวแปรเดียวในแต่ละครั้ง"
  - "การทำซ้ำและบันทึกผลช่วยให้เห็นแนวโน้มที่เชื่อถือได้"
  solution: "การเปลี่ยนเฉพาะผงฟูและคงส่วนผสมอื่นไว้ ทำให้เห็นผลของผงฟูโดยตรง การทำซ้ำหลายครั้งและบันทึกความสูงช่วยให้เปรียบเทียบได้อย่างน่าเชื่อถือ"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.problem-solving-learning.p009
  topics:
  - technology.living.problem-solving-learning
  difficulty: 3
  type: numeric
  stem: "จากกราฟการทดลองซ้ำสามครั้งกับผงฟู 1.5 ช้อนชา ค่าเฉลี่ยความสูงของขนมเป็นเซนติเมตรเท่าใด (ตอบเป็นเซนติเมตร และทศนิยมไม่เกิน 1 ตำแหน่ง)"
  figure:
    src: trials.svg
    alt: "แผนภูมิแท่งสามแท่งแสดงความสูงขนมจากการทดลองซ้ำ ครั้งที่ 1 สูง 4.4 เซนติเมตร ครั้งที่ 2 สูง 4.6 เซนติเมตร และครั้งที่ 3 สูง 4.5 เซนติเมตร แกนตั้งเป็นความสูงเซนติเมตรตั้งแต่ 0 ถึง 6"
  answer:
    value: 4.5
    tolerance: 0.01
    unit: "เซนติเมตร"
  misconceptions:
  - match: 13.5
    feedback: "ตอบ 13.5 คือผลรวมของทั้งสามครั้งที่ไม่ได้หารด้วย 3"
  - match: 4.4
    feedback: "ตอบ 4.4 คือค่าของการทดลองครั้งที่ 1 เพียงครั้งเดียว ไม่ใช่ค่าเฉลี่ยของทั้งสามครั้ง"
  hints:
  - "อ่านความสูงของแต่ละครั้งจากแท่งกราฟให้ครบทั้งสามครั้ง"
  - "ค่าเฉลี่ยคือผลรวมหารด้วยจำนวนครั้ง"
  solution: "ค่าเฉลี่ย = (4.4 + 4.6 + 4.5) ÷ 3 = 13.5 ÷ 3 = 4.5 เซนติเมตร (ตรวจด้วย python3: (4.4+4.6+4.5)/3 = 4.5)"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.problem-solving-learning.p010
  topics:
  - technology.living.problem-solving-learning
  difficulty: 3
  type: mcq
  stem: "ต้องการวิธีเก็บผักกวางตุ้งในตู้เย็นให้สดนาน แหล่งความรู้ใดน่าเชื่อถือที่สุด"
  choices:
  - id: a
    text: "คลิปวิดีโอที่ไม่ระบุผู้ทำและไม่มีการทดสอบ"
    feedback: "ไม่รู้ว่าใครทำและทดสอบอย่างไร จึงตรวจสอบความถูกต้องไม่ได้"
  - id: b
    text: "คู่มือของตู้เย็นหรือเว็บไซต์หน่วยงานด้านอาหารและเกษตรที่ระบุที่มา"
    correct: true
  - id: c
    text: "ความเชื่อที่ได้ยินจากเพื่อนบ้านโดยไม่มีที่มา"
    feedback: "การเล่าต่อกันโดยไม่มีที่มาอาจคลาดเคลื่อน ควรตรวจกับแหล่งที่เชื่อถือได้"
  - id: d
    text: "โพสต์ในโซเชียลที่มีคนกดถูกใจจำนวนมาก"
    feedback: "จำนวนคนกดถูกใจไม่ได้บอกว่าข้อมูลถูกต้อง"
  hints:
  - "แหล่งที่น่าเชื่อถือมักระบุที่มาและผู้รับผิดชอบข้อมูล"
  - "ลองหาตัวเลือกที่มีที่มาให้ตรวจสอบได้"
