problems:
  - id: english.grammar.nouns-articles.p001
    topics: [english.grammar.nouns-articles]
    difficulty: 1
    type: mcq
    stem: "เลือกคำที่ถูก: *I have ___ apple.*"
    choices:
      - { id: a, text: "an", correct: true, feedback: "ถูก apple ขึ้นต้นด้วยเสียงสระ ใช้ an" }
      - { id: b, text: "a", feedback: "a ใช้หน้าคำที่ขึ้นต้นด้วยเสียงพยัญชนะ apple ขึ้นต้นด้วยเสียงสระ" }
      - { id: c, text: "two", feedback: "ถ้ามีสองลูกต้องเติม s เป็น apples" }
      - { id: d, text: "some", feedback: "some ใช้กับพหูพจน์หรือคำนามนับไม่ได้ apple เป็นเอกพจน์" }
    hints:
      - "apple เป็นคำนามนับได้เอกพจน์"
      - "เสียงแรกของ apple เป็นเสียงสระหรือพยัญชนะ"
    solution: "*I have **an** apple.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.nouns-articles.p002
    topics: [english.grammar.nouns-articles]
    difficulty: 1
    type: text
    stem: "เขียนรูปพหูพจน์: *one cat → three ___*"
    accepted: ["cats"]
    misconceptions:
      - { match: "cat", feedback: "ภาษาไทยไม่เปลี่ยนรูป แต่ภาษาอังกฤษต้องเติม s เมื่อมีมากกว่าหนึ่ง" }
      - { match: "cates", feedback: "cat ไม่ได้ลงท้าย s, sh, ch, x จึงเติมแค่ -s" }
    hints:
      - "มากกว่าหนึ่งต้องเปลี่ยนรูป"
      - "คำทั่วไปเติม -s"
    solution: "*three **cats***"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.nouns-articles.p003
    topics: [english.grammar.nouns-articles]
    difficulty: 1
    type: match
    stem: "จับคู่เอกพจน์กับพหูพจน์ที่ไม่ตามกฎ"
    pairs:
      - { left: "man", right: "men" }
      - { left: "child", right: "children" }
      - { left: "foot", right: "feet" }
      - { left: "tooth", right: "teeth" }
      - { left: "mouse", right: "mice" }
    hints:
      - "ห้าคำนี้ไม่ได้เติม s"
      - "foot กับ tooth เปลี่ยนสระ oo เป็น ee เหมือนกัน"
    solution: "man → men · child → children · foot → feet · tooth → teeth · mouse → mice"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.nouns-articles.p004
    topics: [english.grammar.nouns-articles]
    difficulty: 2
    type: text
    stem: "เขียนรูปพหูพจน์ของ *box*"
    accepted: ["boxes"]
    misconceptions:
      - { match: "boxs", feedback: "คำที่ลงท้าย x ต้องเติม -es" }
      - { match: "boxies", feedback: "-ies ใช้กับคำที่ลงท้าย พยัญชนะ + y ส่วน box ลงท้าย x เติม -es" }
      - { match: "box", feedback: "พหูพจน์ต้องเปลี่ยนรูป ลงท้าย x เติม -es" }
    hints:
      - "box ลงท้ายด้วยตัวอะไร"
      - "ลงท้าย s, ss, sh, ch, x เติม -es"
    solution: "*box → **boxes*** (ออกเสียงเพิ่มหนึ่งพยางค์ บอก-ซิซ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.nouns-articles.p005
    topics: [english.grammar.nouns-articles]
    difficulty: 2
    type: text
    stem: "เขียนรูปพหูพจน์ของ *baby*"
    accepted: ["babies"]
    misconceptions:
      - { match: "babys", feedback: "b + y เป็นพยัญชนะ + y ต้องเปลี่ยน y เป็น -ies" }
      - { match: "babyes", feedback: "ไม่เติม -es ต่อท้าย y เปลี่ยน y เป็น i แล้วเติม -es" }
    hints:
      - "ตัวอักษรหน้า y คือ b ซึ่งเป็นพยัญชนะ"
      - "พยัญชนะ + y เปลี่ยน y เป็น i แล้วเติม -es"
    solution: "*baby → **babies*** (ต่างจาก boy → boys ที่หน้า y เป็นสระ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.nouns-articles.p006
    topics: [english.grammar.nouns-articles]
    difficulty: 2
    type: mcq
    stem: "เลือกคำที่ถูก: *The movie is ___ hour long.*"
    choices:
      - { id: a, text: "an", correct: true, feedback: "ถูก h ใน hour ไม่ออกเสียง คำนี้ขึ้นต้นด้วยเสียงสระ จึงใช้ an" }
      - { id: b, text: "a", feedback: "ดูที่เสียงไม่ใช่ตัวอักษร hour อ่านว่า อาว-เออะ ขึ้นต้นด้วยเสียงสระ" }
      - { id: c, text: "the", feedback: "ไม่ได้ชี้ชั่วโมงที่เจาะจง แค่บอกว่ายาวหนึ่งชั่วโมง" }
      - { id: d, text: "some", feedback: "some ใช้กับพหูพจน์หรือคำนามนับไม่ได้ hour เป็นเอกพจน์นับได้" }
    hints:
      - "hour ออกเสียงตัว h หรือไม่"
      - "เลือก a/an ตามเสียงแรกของคำ"
    solution: "*The movie is **an** hour long.* (h ไม่ออกเสียง)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.nouns-articles.p007
    topics: [english.grammar.nouns-articles]
    difficulty: 2
    type: text
    stem: "ดูภาพแผงผลไม้ แล้วเติมคำ: *There are five ___ on the table.*"
    figure: { src: market-stall.svg, alt: "แผงผลไม้ในตลาดสด หลังคาเขียนว่า ตลาดสด Fresh Market บนโต๊ะจากซ้ายไปขวามีสับปะรด 1 ลูก มะเขือเทศสีแดง 5 ลูกวางซ้อนกัน และมะม่วงสีเหลือง 3 ลูก" }
    accepted: ["tomatoes"]
    misconceptions:
      - { match: "tomatos", feedback: "tomato เป็นคำที่ลงท้าย o และเติม -es: tomatoes" }
      - { match: "tomato", feedback: "มีห้าลูกต้องใช้รูปพหูพจน์" }
      - { match: "mangoes", feedback: "มะม่วงมีสามลูก ของที่มีห้าลูกคือมะเขือเทศ" }
    hints:
      - "นับว่าผลไม้ชนิดไหนมีห้าลูก"
      - "tomato ลงท้าย o เติม -es"
    solution: "มะเขือเทศมีห้าลูก: *There are five **tomatoes** on the table.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.nouns-articles.p008
    topics: [english.grammar.nouns-articles]
    difficulty: 2
    type: mcq
    stem: "คำนามข้อใด **นับไม่ได้** (ใช้ a ไม่ได้ และไม่เติม s)"
    choices:
      - { id: a, text: "rice", correct: true, feedback: "ถูก ข้าวเป็นเม็ดเล็กมาก ไม่นับทีละเม็ด จึงนับไม่ได้ (a bowl of rice)" }
      - { id: b, text: "egg", feedback: "ไข่นับเป็นฟองได้ an egg, two eggs" }
      - { id: c, text: "mango", feedback: "มะม่วงนับเป็นลูกได้ a mango, three mangoes" }
      - { id: d, text: "banana", feedback: "กล้วยนับเป็นลูกได้ a banana, two bananas" }
    hints:
      - "คำไหนนับทีละชิ้นไม่ได้"
      - "ของที่เป็นเม็ดเล็ก ผง หรือของเหลว มักนับไม่ได้"
    solution: "**rice** นับไม่ได้ ถ้าจะบอกจำนวนใช้ *a bowl of rice* หรือ *a plate of rice*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.nouns-articles.p009
    topics: [english.grammar.nouns-articles]
    difficulty: 3
    type: text
    stem: "เติม a หรือ an: *Somchai studies at ___ university in Chiang Mai.*"
    accepted: ["a"]
    misconceptions:
      - { match: "an", feedback: "university ขึ้นต้นด้วยตัว u แต่ออกเสียง ยู (เสียงพยัญชนะ y) จึงใช้ a" }
      - { match: "the", feedback: "โจทย์ให้เลือก a หรือ an และประโยคยังไม่ได้บอกว่าเป็นมหาวิทยาลัยใดโดยเฉพาะ" }
    hints:
      - "อ่านออกเสียง university เสียงแรกคืออะไร"
      - "เลือกตามเสียง ไม่ใช่ตามตัวอักษร"
    solution: "university ออกเสียง ยู-นิ-เวอร์-ซิ-ตี้ ขึ้นต้นด้วยเสียงพยัญชนะ: *at **a** university*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.nouns-articles.p010
    topics: [english.grammar.nouns-articles]
    difficulty: 3
    type: mcq
    stem: "เลือกคำที่ถูก: *There isn't ___ milk in the fridge.*"
    choices:
      - { id: a, text: "any", correct: true, feedback: "ถูก ประโยคปฏิเสธใช้ any" }
      - { id: b, text: "some", feedback: "some ใช้ในประโยคบอกเล่า ประโยคปฏิเสธใช้ any" }
      - { id: c, text: "a", feedback: "milk นับไม่ได้ ใช้ a ไม่ได้" }
      - { id: d, text: "many", feedback: "many ใช้กับคำนามนับได้พหูพจน์ milk นับไม่ได้" }
    hints:
      - "ประโยคนี้เป็นบอกเล่าหรือปฏิเสธ"
      - "milk นับได้หรือไม่"
    solution: "*There isn't **any** milk in the fridge.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.nouns-articles.p011
    topics: [english.grammar.nouns-articles]
    difficulty: 3
    type: text
    stem: "เติมคำนำหน้านาม: *I have a dog and a cat. ___ dog is black.*"
    accepted: ["The"]
    misconceptions:
      - { match: "A", feedback: "พูดถึงสุนัขตัวนี้ไปแล้ว ผู้ฟังรู้ว่าเป็นตัวไหน จึงใช้ The" }
      - { match: "An", feedback: "dog ขึ้นต้นด้วยเสียงพยัญชนะ และพูดถึงไปแล้วจึงใช้ The" }
    hints:
      - "สุนัขตัวนี้ถูกพูดถึงแล้วในประโยคแรก"
      - "สิ่งที่ผู้ฟังรู้แล้วว่าหมายถึงตัวไหน ใช้คำนำหน้าอะไร"
    solution: "ครั้งแรกใช้ a ครั้งต่อไปใช้ the: ***The** dog is black.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.nouns-articles.p012
    topics: [english.grammar.nouns-articles]
    difficulty: 3
    type: order
    stem: "เรียงคำเป็นประโยค \"มีมะม่วงอยู่บนโต๊ะจำนวนหนึ่ง\""
    items: ["There", "are", "some", "mangoes", "on the table."]
    hints:
      - "ขึ้นต้นด้วย There are"
      - "some อยู่หน้าคำนามพหูพจน์"
    solution: "*There are some mangoes on the table.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.nouns-articles.p013
    topics: [english.grammar.nouns-articles]
    difficulty: 3
    type: mcq
    stem: "พหูพจน์คำไหนออกเสียงท้ายคำเป็น /ɪz/ (เพิ่มหนึ่งพยางค์)"
    choices:
      - { id: a, text: "buses", correct: true, feedback: "ถูก bus ลงท้ายเสียง s เติม -es แล้วเพิ่มพยางค์: bus-es" }
      - { id: b, text: "cats", feedback: "cat ลงท้ายเสียง t เติม s ออกเสียง /s/ ไม่เพิ่มพยางค์" }
      - { id: c, text: "dogs", feedback: "dog ลงท้ายเสียง g เติม s ออกเสียง /z/ ไม่เพิ่มพยางค์" }
      - { id: d, text: "books", feedback: "book ลงท้ายเสียง k เติม s ออกเสียง /s/ ไม่เพิ่มพยางค์" }
    hints:
      - "เสียง /ɪz/ เกิดหลังเสียง s, z, sh, ch, x"
      - "คำไหนลงท้ายด้วยเสียง s อยู่แล้ว"
    solution: "**buses** อ่านว่า บัส-ซิซ มีสองพยางค์ ส่วน cats /s/, dogs /z/, books /s/ ยังเป็นพยางค์เดียว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.nouns-articles.p014
    topics: [english.grammar.nouns-articles]
    difficulty: 4
    type: text
    stem: "เขียนรูปพหูพจน์ของ *knife*"
    accepted: ["knives"]
    misconceptions:
      - { match: "knifes", feedback: "คำที่ลงท้าย fe ส่วนใหญ่เปลี่ยนเป็น -ves" }
      - { match: "knifs", feedback: "ลงท้าย fe เปลี่ยน fe เป็น -ves" }
      - { match: "knive", feedback: "ต้องเติม s ท้าย: knives" }
    hints:
      - "knife ลงท้ายด้วย fe"
      - "f, fe → -ves"
    solution: "*knife → **knives*** (เหมือน wife → wives, leaf → leaves)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.nouns-articles.p015
    topics: [english.grammar.nouns-articles]
    difficulty: 4
    type: mcq
    stem: "ข้อใดแปลว่า \"ฉันมีหนังสือสามเล่ม\" ได้ถูกต้อง"
    choices:
      - { id: a, text: "I have three books.", correct: true, feedback: "ถูก ไม่มีลักษณนาม และเติม s ที่ books" }
      - { id: b, text: "I have three book.", feedback: "ภาษาไทยไม่เปลี่ยนรูปคำนาม แต่ภาษาอังกฤษต้องเติม s เมื่อมากกว่าหนึ่ง" }
      - { id: c, text: "I have book three.", feedback: "ภาษาอังกฤษวางจำนวนไว้หน้าคำนาม ไม่ได้วางหลังเหมือน หนังสือสามเล่ม" }
      - { id: d, text: "I have a three books.", feedback: "a แปลว่าหนึ่ง ใช้กับเอกพจน์เท่านั้น ใช้คู่กับ three ไม่ได้" }
    hints:
      - "จำนวนอยู่หน้าหรือหลังคำนาม"
      - "สามเล่มต้องใช้รูปพหูพจน์ และไม่มีคำแปลของ เล่ม"
    solution: "**I have three books.**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.nouns-articles.p016
    topics: [english.grammar.nouns-articles]
    difficulty: 4
    type: text
    stem: "แก้ประโยคให้ถูก: *There are two child in the park.* (เขียนเต็มประโยค)"
    accepted: ["There are two children in the park.", "There are two children in the park"]
    misconceptions:
      - { match: "There are two childs in the park.", feedback: "child เป็นพหูพจน์ไม่ตามกฎ ใช้ children" }
      - { match: "There are two childs in the park", feedback: "child เป็นพหูพจน์ไม่ตามกฎ ใช้ children" }
      - { match: "There are two childrens in the park.", feedback: "children เป็นพหูพจน์อยู่แล้ว ไม่ต้องเติม s อีก" }
      - { match: "There is two children in the park.", feedback: "สองคนต้องใช้ there are" }
    hints:
      - "สองคนต้องใช้รูปพหูพจน์"
      - "child เป็นคำที่ไม่ตามกฎ"
    solution: "*There are two **children** in the park.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.nouns-articles.p017
    topics: [english.grammar.nouns-articles]
    difficulty: 4
    type: mcq
    stem: "ที่ร้านสะดวกซื้อ ข้อใดแปลว่า \"ขอน้ำหนึ่งขวดครับ\" ได้ถูกต้อง"
    choices:
      - { id: a, text: "A bottle of water, please.", correct: true, feedback: "ถูก water นับไม่ได้ จึงนับขวด (a bottle of)" }
      - { id: b, text: "A bottle of waters, please.", feedback: "water นับไม่ได้ จึงไม่เติม s แม้จะนับขวดแล้ว" }
      - { id: c, text: "One waters, please.", feedback: "water ไม่เติม s และไม่ใช้ one ตรง ๆ" }
      - { id: d, text: "A bottle water, please.", feedback: "ขาด of ต้องเป็น a bottle of water" }
    hints:
      - "water นับได้หรือไม่"
      - "นับของที่นับไม่ได้ด้วย a + ภาชนะ + of"
    solution: "**A bottle of water, please.**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.nouns-articles.p018
    topics: [english.grammar.nouns-articles]
    difficulty: 4
    type: text
    stem: "เติม a, an หรือ the: *Bangkok is ___ capital of Thailand.*"
    accepted: ["the"]
    misconceptions:
      - { match: "a", feedback: "ประเทศไทยมีเมืองหลวงเมืองเดียว สิ่งที่มีหนึ่งเดียวใช้ the" }
      - { match: "an", feedback: "capital ขึ้นต้นด้วยเสียงพยัญชนะ และมีเมืองหลวงเดียวจึงใช้ the" }
    hints:
      - "ประเทศไทยมีเมืองหลวงกี่เมือง"
      - "สิ่งที่มีหนึ่งเดียวใช้คำนำหน้าอะไร"
    solution: "*Bangkok is **the** capital of Thailand.* (ไม่ใส่ the หน้า Bangkok และ Thailand)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.nouns-articles.p019
    topics: [english.grammar.nouns-articles]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "เลือกประโยคที่ **ถูกต้อง** ทั้งหมด"
    choices:
