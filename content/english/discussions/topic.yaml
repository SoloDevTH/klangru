id: english.speaking.discussions
subject: english
title: { th: "การอภิปรายและโต้ตอบ: แสดงเหตุผล ขัดจังหวะอย่างสุภาพ และพูดอ้อมเมื่อนึกคำไม่ออก (ระดับ B2)", en: "Discussions and interaction: giving reasons, interrupting politely and circumlocution (B2)" }
summary: ใช้ภาษาในการอภิปรายกลุ่ม แสดงความเห็นพร้อมเหตุผล เห็นด้วยหรือแย้งอย่างสุภาพ ขัดจังหวะและกลับเข้าประเด็น และพูดอ้อมเมื่อนึกคำไม่ออก
difficulty: 5.5
minutes: 45
prerequisites: [english.speaking.feelings-opinions, english.grammar.conditionals]
encompasses:
  - { id: english.speaking.feelings-opinions, weight: 0.3 }
  - { id: english.grammar.conditionals, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: agreement-scale.svg
    alt: "แผนภาพเส้นระดับการเห็นด้วยมีห้าจุดเรียงจากซ้ายไปขวา จุดแรกสีแดงคือไม่เห็นด้วยเลย ใช้ I completely disagree. จุดที่สองคือไม่ค่อยเห็นด้วย ใช้ I'm not sure I agree. จุดกลางคือยังไม่แน่ใจ ใช้ That's an interesting point. จุดที่สี่คือเห็นด้วยบางส่วน ใช้ I see your point, but ... และจุดสุดท้ายคือเห็นด้วยเต็มที่ ใช้ I completely agree with you. มีลูกศรชี้จากซ้ายไปขวา"
    caption: "ระดับการเห็นด้วยและวลีที่ใช้ในการอภิปราย"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.speaking.discussions.p001, prompt: "ประโยคแสดงความเห็นที่มีเหตุผลเป็นอย่างไร" }
  - type: worked-example
    title: พูดอ้อมเมื่อนึกคำว่า ladle ไม่ออก
    problem: "ขณะอภิปรายเรื่องโรงทานของโรงเรียน คุณอยากพูดถึงกระบวยตักแกง แต่นึกคำว่า ladle ไม่ออก ให้พูดอ้อมเพื่อให้เพื่อนเข้าใจ"
    steps:
      - text: "บอกประเภทของสิ่งนั้น: *It's a kind of big spoon.*"
        why: "บอกหมวดก่อน ผู้ฟังจะรู้ว่าอยู่ในกลุ่มสิ่งของแบบไหน"
      - text: "บอกหน้าที่: *You use it to serve soup from a pot.*"
        why: "การบอกหน้าที่ทำให้ผู้ฟังนึกภาพการใช้งาน ซึ่งมักสำคัญกว่าการบอกชื่อ"
      - text: "บอกลักษณะเด่นโดยเปรียบเทียบ: *It's like a cup, but it has a very long handle.*"
        why: "It's like ..., but ... เปรียบเทียบกับสิ่งที่รู้จัก แล้วบอกความต่างที่ชี้เฉพาะ"
      - text: "ถามหาคำศัพท์ที่ต้องการ: *What do you call it?*"
        why: "เมื่ออธิบายแล้วยังไม่ชัด ให้ถามหาคำศัพท์เพื่อเรียนรู้ไปพร้อมกัน"
    answer: "It's a kind of big spoon. You use it to serve soup from a pot. It's like a cup, but it has a very long handle. What do you call it?"
  - { type: check, problem: english.speaking.discussions.p005, prompt: "คำเชื่อมที่ใช้แย้งอย่างสุภาพหลังรับความเห็น" }
  - type: worked-example
    title: เห็นด้วยบางส่วนและเสนอทางเลือก
    problem: "อีกฝ่ายพูดว่า Phones should be banned in class. คุณเห็นด้วยบางส่วน แต่อยากเสนอทางเลือกและเชิญเพื่อนให้พูดต่อ"
    steps:
      - text: "รับความเห็นก่อน: *I see your point.*"
        why: "การรับความเห็นทำให้อีกฝ่ายรู้ว่าเราฟังอยู่จริง"
      - text: "บอกข้อที่ต่างด้วย but: *but I'm not sure a total ban is practical.*"
        why: "but บอกว่าส่วนหลังต่างจากอีกฝ่าย โดยไม่ต้องใช้คำค้านที่แรง"
      - text: "เสนอทางเลือก: *Perhaps we could allow phones only for learning.*"
        why: "Perhaps เป็นคำที่ทำให้ข้อเสนอฟังอ่อน ไม่บังคับ"
      - text: "เชิญให้คนอื่นพูด: *What do you think, Nok?*"
        why: "ทำให้การอภิปรายเป็นของทุกคน ไม่ใช่การพูดของคนเดียว"
    answer: "I see your point, but I'm not sure a total ban is practical. Perhaps we could allow phones only for learning. What do you think, Nok?"
glossary:
  - { term: circumlocution, definition: "การพูดอ้อม อธิบายหน้าที่หรือลักษณะของสิ่งนั้นเมื่อนึกคำศัพท์ที่ต้องการไม่ออก" }
  - { term: interrupt, definition: "ขัดจังหวะ การพูดแทรกระหว่างที่คนอื่นกำลังพูด ควรใช้วลีที่สุภาพ เช่น Sorry to interrupt" }
  - { term: fair point, definition: "ความเห็นที่มีเหตุผลและน่ารับฟัง ใช้รับความเห็นของคนอื่นอย่างเป็นธรรม" }
  - { term: second conditional, definition: "เงื่อนไขชนิดที่สอง if + กาลอดีต ตามด้วย would + กริยา ใช้กับเรื่องสมมุติที่ยังไม่เกิด" }
  - { term: main point, definition: "ประเด็นหลักของการอภิปราย ใช้เมื่อต้องการพากลับเข้าเรื่องเดิม" }
  - { term: summarise, definition: "สรุป ย่อความเห็นของกลุ่มให้เหลือใจความสำคัญ" }
flashcards:
  - { front: "แสดงความเห็นพร้อมเหตุผล", back: "In my opinion, ... because ..." }
  - { front: "เห็นด้วยบางส่วน", back: "I see your point, but ... หรือ I agree, although ..." }
  - { front: "ขัดจังหวะอย่างสุภาพ", back: "Sorry to interrupt, but ..." }
  - { front: "กลับเข้าประเด็น", back: "Anyway, going back to the main point, ..." }
  - { front: "พูดอ้อมเมื่อนึกคำไม่ออก", back: "It's a kind of ... / The thing you use to ... / It's like a ..., but ..." }
