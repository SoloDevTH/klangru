  - จุดอ่อนของคู่แข่งคือยิงไกลไม่แม่นและเคลื่อนที่ช้า
  solution: โซนที่รวมคนใต้แป้นปิดจุดแข็งของคู่แข่ง และเสี่ยงน้อยเพราะคู่แข่งยิงไกลไม่แม่น ส่วนการบุกเร็วใช้ความเร็วของทีมเราโจมตีจุดอ่อนเรื่องความช้าของคู่แข่ง
