    ai_assisted: true

  - id: chemistry.reactions.everyday-reactions.p017
    topics: [chemistry.reactions.everyday-reactions]
    difficulty: 5
    type: numeric
    stem: "เหล็กรวมกับออกซิเจนเป็นเหล็กออกไซด์ในอัตราส่วนมวลเหล็ก 7 ส่วนต่อออกซิเจน 3 ส่วนเสมอ ถ้าเผาเหล็กฝอย 5.6 g จนเปลี่ยนเป็นเหล็กออกไซด์ทั้งหมด จะได้ผลิตภัณฑ์กี่กรัม"
    answer: { value: 8, unit: g, tolerance: 0.05 }
    misconceptions:
      - { match: 2.4, feedback: "2.4 g คือมวลออกซิเจนที่เข้าไปรวม ต้องบวกมวลเหล็กเดิมด้วย" }
      - { match: 3.2, feedback: "คิดว่าการเผาทำให้มวลลดลง แต่เหล็กรับออกซิเจนจากอากาศ มวลจึงเพิ่มขึ้น" }
    hints:
      - "เหล็ก 7 g รวมกับออกซิเจน 3 g ถ้ามีเหล็ก 5.6 g ต้องใช้ออกซิเจนเท่าใด"
      - "มวลผลิตภัณฑ์ = มวลเหล็ก + มวลออกซิเจน"
    solution: "ออกซิเจน = 5.6 × 3/7 = 2.4 g มวลเหล็กออกไซด์ = 5.6 + 2.4 = **8.0 g** มวลเพิ่มขึ้นเพราะเหล็กรวมกับออกซิเจนจากอากาศ"
