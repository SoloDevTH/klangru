problems:
- id: health.growth.thai-growth-references.p001
  topics:
  - health.growth.thai-growth-references
  difficulty: 1
  type: mcq
  stem: เกณฑ์อ้างอิงการเจริญเติบโตของเด็กอายุ 6–19 ปีที่ใช้ในโรงเรียนไทยปัจจุบัน จัดทำโดยหน่วยงานใด
  choices:
  - id: a
    text: สำนักโภชนาการ กรมอนามัย
    correct: true
  - id: b
    text: กรมควบคุมมลพิษ
    feedback: กรมควบคุมมลพิษดูแลเรื่องคุณภาพอากาศ ไม่ใช่การเจริญเติบโต
  - id: c
    text: สำนักงานคณะกรรมการอาหารและยา
    feedback: อย. ดูแลผลิตภัณฑ์สุขภาพ ไม่ได้จัดทำเกณฑ์การเจริญเติบโต
  hints:
  - หน่วยงานนี้อยู่ในกระทรวงสาธารณสุข
  - ชื่อเกี่ยวกับโภชนาการ
  solution: สำนักโภชนาการ กรมอนามัย เผยแพร่คู่มือเกณฑ์อ้างอิงการเจริญเติบโตของเด็กอายุ 6–19 ปี เมื่อกุมภาพันธ์ 2564
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.growth.thai-growth-references.p002
  topics:
  - health.growth.thai-growth-references
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็นปัจจัยที่ทำให้เด็กวัยเดียวกันสูงไม่เท่ากัน (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: พันธุกรรมจากพ่อแม่
    correct: true
  - id: b
    text: อาหารและการนอน
    correct: true
  - id: c
    text: ช่วงโตเร็วในวัยรุ่นเริ่มไม่พร้อมกัน
    correct: true
  - id: d
    text: สีของเสื้อผ้าที่ใส่
    feedback: สีเสื้อไม่มีผลต่อการเติบโต
  hints:
  - คิดถึงสิ่งที่ส่งผลต่อร่างกายจริง
  - การเติบโตขึ้นกับหลายปัจจัย
  solution: พันธุกรรม อาหาร การนอน การออกกำลังกาย และจังหวะการเข้าสู่วัยรุ่น ทำให้เด็กวัยเดียวกันสูงต่างกันได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.growth.thai-growth-references.p003
  topics:
  - health.growth.thai-growth-references
  difficulty: 2
  type: order
  stem: เรียงระดับของส่วนสูงตามเกณฑ์อายุ จากสูงที่สุดไปต่ำที่สุด
  items:
  - สูง
  - ค่อนข้างสูง
  - สูงตามเกณฑ์
  - ค่อนข้างเตี้ย
  - เตี้ย
  hints:
  - มี 5 ระดับ ระดับกลางคือสูงตามเกณฑ์
  - ระดับที่มีคำว่า ค่อนข้าง อยู่ติดกับระดับกลาง
  solution: สูง (> +2 SD) → ค่อนข้างสูง → สูงตามเกณฑ์ (±1.5 SD) → ค่อนข้างเตี้ย → เตี้ย (< −2 SD)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.growth.thai-growth-references.p004
  topics:
  - health.growth.thai-growth-references
  difficulty: 2
  type: mcq
  stem: จากกราฟส่วนสูงตามเกณฑ์อายุ จุดของน้ำฝนอยู่ระหว่างเส้น +1.5 SD กับ +2 SD แปลผลว่าอย่างไร
  figure:
    src: hfa-chart.svg
    alt: กราฟจำลองส่วนสูงตามเกณฑ์อายุ แกนนอนอายุ 6 ถึง 19 ปี แกนตั้งส่วนสูง 90 ถึง 180 ซม. มีเส้น -2 SD -1.5 SD MEDIAN +1.5 SD +2 SD แถบสีห้าระดับพร้อมคำอธิบาย จุดของน้ำฝน อายุ 10 ปีครึ่ง สูงประมาณ 151 ซม. อยู่ระหว่างเส้น +1.5 SD กับ +2 SD
  choices:
  - id: a
    text: ค่อนข้างสูง
    correct: true
  - id: b
    text: สูง
    feedback: ระดับสูงต้องอยู่เหนือเส้น +2 SD
  - id: c
    text: ท้วม
    feedback: ท้วมเป็นระดับของน้ำหนักตามเกณฑ์ส่วนสูง ไม่ใช่ส่วนสูงตามเกณฑ์อายุ
  hints:
  - ดูว่ากราฟนี้เป็นดัชนีใด
  - ช่วง +1.5 SD ถึง +2 SD ของส่วนสูงตามเกณฑ์อายุ
  solution: ช่วง +1.5 SD ถึง +2 SD ของกราฟส่วนสูงตามเกณฑ์อายุคือระดับค่อนข้างสูง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.growth.thai-growth-references.p005
  topics:
  - health.growth.thai-growth-references
  difficulty: 2
  type: numeric
  stem: กราฟน้ำหนักตามเกณฑ์ส่วนสูงของกรมอนามัยแบ่งการแปลผลเป็นกี่ระดับ (ตอบเป็นจำนวนระดับ)
  answer:
    value: 6
    unit: ระดับ
  misconceptions:
  - match: 5
    feedback: 5 ระดับคือส่วนสูงตามเกณฑ์อายุ น้ำหนักตามเกณฑ์ส่วนสูงมีเส้น +3 SD เพิ่ม
  - match: 3
    feedback: ไม่ใช่จำนวนดัชนี (3 ดัชนี) โจทย์ถามจำนวนระดับของดัชนีนี้
  hints:
  - มีระดับ อ้วน เริ่มอ้วน ท้วม ...
  - นับจาก อ้วน ไปจนถึง ผอม
  solution: อ้วน เริ่มอ้วน ท้วม สมส่วน ค่อนข้างผอม ผอม รวม 6 ระดับ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.growth.thai-growth-references.p006
  topics:
  - health.growth.thai-growth-references
  difficulty: 2
  type: match
  stem: จับคู่จุดบนกราฟน้ำหนักตามเกณฑ์ส่วนสูงกับการแปลผล
  figure:
    src: wfh-quiz.svg
    alt: กราฟจำลองน้ำหนักตามเกณฑ์ส่วนสูง แกนนอนส่วนสูง 115 ถึง 175 ซม. แกนตั้งน้ำหนัก 10 ถึง 90 กก. มีเส้น -2 SD -1.5 SD MEDIAN +1.5 SD +2 SD และ +3 SD ไม่มีชื่อระดับ จุด A ส่วนสูง 140 ซม. อยู่ระหว่างเส้น +1.5 SD กับ +2 SD จุด B ส่วนสูง 150 ซม. อยู่ระหว่างเส้น MEDIAN กับ +1.5 SD จุด C ส่วนสูง 130 ซม. อยู่ระหว่างเส้น -2 SD กับ -1.5 SD จุด D ส่วนสูง 145 ซม. อยู่เหนือเส้น +3 SD
  pairs:
  - left: จุด A
    right: ท้วม
  - left: จุด B
    right: สมส่วน
  - left: จุด C
    right: ค่อนข้างผอม
  - left: จุด D
    right: อ้วน
  hints:
  - ดูว่าแต่ละจุดอยู่ระหว่างเส้นใด
  - สมส่วนคือช่วง −1.5 SD ถึง +1.5 SD
  solution: A อยู่ระหว่าง +1.5 กับ +2 SD (ท้วม) B อยู่ระหว่างมัธยฐานกับ +1.5 SD (สมส่วน) C อยู่ระหว่าง −2 กับ −1.5 SD (ค่อนข้างผอม) D อยู่เหนือ +3 SD (อ้วน)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.growth.thai-growth-references.p007
  topics:
  - health.growth.thai-growth-references
  difficulty: 3
  type: numeric
  stem: มีนาเกิดวันที่ 15 มีนาคม 2558 ครูวัดส่วนสูงวันที่ 20 ตุลาคม 2569 มีนามีอายุกี่เดือนเต็ม (ตอบเป็นเดือน)
  answer:
    value: 139
    unit: เดือน
  misconceptions:
  - match: 132
    feedback: 132 เดือนคือ 11 ปีพอดี ยังไม่ได้บวก 7 เดือนตั้งแต่มีนาคมถึงตุลาคม
  - match: 11.7
    feedback: ต้องแปลงเป็นเดือนทั้งหมด ไม่ใช่เขียนปีกับเดือนติดกัน
  hints:
  - "หาอายุเป็นปีและเดือนก่อน: 2569 − 2558 ปี และมีนาคมถึงตุลาคมกี่เดือน"
  - แปลงปีเป็นเดือนแล้วบวก
  solution: อายุ 11 ปี 7 เดือน (วันที่ 20 เลยวันที่ 15 แล้ว) = 11 × 12 + 7 = 139 เดือน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.growth.thai-growth-references.p008
  topics:
  - health.growth.thai-growth-references
  difficulty: 3
  type: mcq
  stem: คำว่า "สูงดีสมส่วน" ตามที่กรมอนามัยใช้ หมายถึงข้อใด
  choices:
  - id: a
    text: ส่วนสูงอยู่ในระดับสูงตามเกณฑ์ขึ้นไป และน้ำหนักอยู่ในระดับสมส่วน ในเด็กคนเดียวกัน
    correct: true
  - id: b
    text: สูงกว่าเพื่อนทุกคนในห้อง
    feedback: การเทียบกับเพื่อนในห้องไม่ใช่เกณฑ์อ้างอิง
  - id: c
    text: น้ำหนักตามเกณฑ์อายุอยู่ในระดับตามเกณฑ์
    feedback: สูงดีสมส่วนใช้ส่วนสูงตามเกณฑ์อายุกับน้ำหนักตามเกณฑ์ส่วนสูง
  hints:
  - "คำนี้มีสองส่วน: สูงดี และ สมส่วน"
  - แต่ละส่วนมาจากกราฟคนละแผ่น
  solution: สูงดีสมส่วน = ส่วนสูงตามเกณฑ์อายุอยู่ระดับสูงตามเกณฑ์ ค่อนข้างสูง หรือสูง และน้ำหนักตามเกณฑ์ส่วนสูงอยู่ระดับสมส่วน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.growth.thai-growth-references.p009
  topics:
  - health.growth.thai-growth-references
  difficulty: 3
  type: mcq
  stem: บนกราฟน้ำหนักตามเกณฑ์ส่วนสูง แกนนอนคืออะไร
  choices:
  - id: a
    text: ส่วนสูง (เซนติเมตร)
    correct: true
  - id: b
    text: อายุ (ปี)
    feedback: กราฟที่แกนนอนเป็นอายุคือส่วนสูงตามเกณฑ์อายุและน้ำหนักตามเกณฑ์อายุ
  - id: c
    text: ดัชนีมวลกาย
    feedback: กราฟนี้ไม่ได้ใช้ BMI
  hints:
  - ชื่อดัชนีบอกว่าเทียบน้ำหนักกับอะไร
  - น้ำหนัก "ตามเกณฑ์ส่วนสูง"
  solution: กราฟน้ำหนักตามเกณฑ์ส่วนสูงใช้ส่วนสูงเป็นแกนนอนและน้ำหนักเป็นแกนตั้ง จึงบอกได้ว่าน้ำหนักเหมาะกับส่วนสูงหรือไม่
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.growth.thai-growth-references.p010
  topics:
  - health.growth.thai-growth-references
  difficulty: 3
  type: numeric
  stem: โอ๊ตหนัก 38 กิโลกรัม สูง 145 เซนติเมตร ดัชนีมวลกายของโอ๊ตเท่ากับเท่าไร (ตอบเป็น kg/m² ทศนิยม 1 ตำแหน่ง)
  answer:
    value: 18.1
    tolerance: 0.1
    unit: kg/m²
  misconceptions:
  - match: 26.2
    feedback: "ต้องยกกำลังสองส่วนสูงก่อน: 38 ÷ 1.45² ไม่ใช่ 38 ÷ 1.45"
  - match: 13.1
    feedback: ส่วนสูงเป็นเมตรคือ 1.45 แล้วยกกำลังสอง ได้ 2.1025
  hints:
  - "เปลี่ยนส่วนสูงเป็นเมตร: 1.45 m"
  - BMI = น้ำหนัก ÷ ส่วนสูง²
  solution: 1.45² = 2.1025 BMI = 38 ÷ 2.1025 ≈ 18.1 kg/m² ค่านี้ต้องนำไปเทียบกับกราฟ BMI ตามอายุและเพศ ไม่ใช่เกณฑ์ผู้ใหญ่
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.growth.thai-growth-references.p011
  topics:
  - health.growth.thai-growth-references
  difficulty: 4
  type: mcq
  stem: ภูมิอายุ 12 ปี น้ำหนักตามเกณฑ์อายุอยู่ระดับ "น้ำหนักมาก" แต่ส่วนสูงตามเกณฑ์อายุอยู่ระดับ "สูง" และน้ำหนักตามเกณฑ์ส่วนสูงอยู่ระดับ "สมส่วน" ข้อสรุปใดถูกต้อง
  choices:
  - id: a
    text: ภูมิสูงดีสมส่วน น้ำหนักที่มากเป็นเพราะตัวสูง ไม่ได้อ้วน
    correct: true
  - id: b
    text: ภูมิอ้วน เพราะน้ำหนักตามเกณฑ์อายุอยู่ระดับมาก
    feedback: น้ำหนักตามเกณฑ์อายุบอกไม่ได้ว่าอ้วน เด็กตัวสูงย่อมหนักกว่าเพื่อนวัยเดียวกัน
  - id: c
    text: ภูมิควรอดอาหารเย็น
    feedback: ภูมิสมส่วน และเด็กไม่ควรอดอาหารเพราะร่างกายกำลังโต
  hints:
  - น้ำหนักตามเกณฑ์อายุมีข้อจำกัด
  - ดูดัชนีที่บอกรูปร่าง
  solution: คู่มือกรมอนามัยระบุว่าน้ำหนักตามเกณฑ์อายุระดับมากยังบอกไม่ได้ว่าอ้วน ต้องดูน้ำหนักตามเกณฑ์ส่วนสูง ภูมิสูงและสมส่วน จึงเป็นเด็กสูงดีสมส่วน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.growth.thai-growth-references.p012
  topics:
  - health.growth.thai-growth-references
  difficulty: 4
  type: mcq
  stem: จากกราฟเส้นทางส่วนสูงของเก่ง ข้อใดแปลผลได้เหมาะสมที่สุด
  figure:
    src: growth-track.svg
    alt: กราฟจำลองส่วนสูงตามเกณฑ์อายุ มีแถบสีห้าระดับ สูง ค่อนข้างสูง สูงตามเกณฑ์ ค่อนข้างเตี้ย เตี้ย เส้นทางส่วนสูงของเก่งจากอายุ 7 ถึง 12 ปี อายุ 7 และ 8 ปีอยู่ใกล้เส้นมัธยฐาน อายุ 9 และ 10 ปีค่อย ๆ ต่ำลงแต่ยังอยู่ในช่วงสูงตามเกณฑ์ อายุ 11 และ 12 ปีตกลงไปอยู่ระหว่างเส้น -1.5 SD กับ -2 SD
  choices:
  - id: a
    text: ส่วนสูงของเก่งตกข้ามช่วงลงไปจนอยู่ในระดับค่อนข้างเตี้ยตอนอายุ 11–12 ปี ควรให้บุคลากรสุขภาพช่วยดูสาเหตุ
    correct: true
  - id: b
    text: เก่งเติบโตปกติเพราะสูงขึ้นทุกปี
    feedback: สูงขึ้นทุกปีแต่ช้ากว่าเกณฑ์ จุดจึงตกข้ามช่วงลงไป ต้องดูตำแหน่งเทียบเส้น ไม่ใช่แค่ดูว่าเพิ่มขึ้น
  - id: c
    text: เก่งเตี้ยตั้งแต่อายุ 7 ปี
    feedback: ตอนอายุ 7–8 ปีจุดอยู่ใกล้เส้นมัธยฐาน ยังสูงตามเกณฑ์
  hints:
  - ดูแนวโน้มของเส้น ไม่ใช่จุดเดียว
  - เส้นที่ขนานกับมัธยฐานต่างจากเส้นที่ตกข้ามช่วง
  solution: ตอนอายุ 7–8 ปีเก่งอยู่ใกล้มัธยฐาน แล้วค่อย ๆ ตกจนอยู่ระหว่าง −1.5 กับ −2 SD (ค่อนข้างเตี้ย) แนวโน้มนี้ควรได้รับการประเมินจากบุคลากรสุขภาพ เช่น เรื่องอาหาร การนอน หรือการเจ็บป่วย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.growth.thai-growth-references.p013
  topics:
  - health.growth.thai-growth-references
  difficulty: 4
  type: mcq
