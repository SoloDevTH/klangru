    stem: "โยนเหรียญที่เที่ยงตรง 100 ครั้ง ให้ $X$ เป็นจำนวนหัว จงหาส่วนเบี่ยงเบนมาตรฐานของ $X$"
    answer: { value: 5 }
    hints:
      - "$X$ มีการแจกแจงทวินาม $n = 100$, $p = 0.5$"
      - "$\\sigma^2 = np(1 - p)$ แล้วถอดรากที่สอง"
    misconceptions:
      - { match: 25, feedback: "25 คือความแปรปรวน ต้องถอดรากที่สอง" }
      - { match: 50, feedback: "50 คือค่าคาดหมาย $np$" }
    solution: "$\\sigma^2 = 100(0.5)(0.5) = 25$ จึง $\\sigma = 5$ หัว"
