  - id: math.discrete.networks.p018
    topics: [math.discrete.networks]
    difficulty: 5
    type: numeric
    stem: "ชมรมหนึ่งมีสมาชิก 10 คน ในกลุ่มแชตของชมรม แต่ละคนมีเพื่อนในกลุ่มพอดี 3 คน มีความเป็นเพื่อนกี่คู่"
    answer: { value: 15, unit: คู่ }
    hints:
      - "แทนคนด้วยจุดยอด ความเป็นเพื่อนด้วยเส้นเชื่อม ทุกจุดมีดีกรี 3"
      - "จำนวนเส้นเชื่อม = ผลรวมดีกรี ÷ 2"
    misconceptions:
      - { match: 30, feedback: "นี่คือผลรวมดีกรี แต่ละคู่ถูกนับสองครั้ง ต้องหารด้วย 2" }
      - { match: 45, feedback: "นี่คือจำนวนคู่ถ้าทุกคนเป็นเพื่อนกับทุกคน แต่แต่ละคนมีเพื่อนแค่ 3 คน" }
    solution: "ผลรวมดีกรี $= 10 \\times 3 = 30$ จำนวนคู่ $= 30 \\div 2 = 15$ คู่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.discrete.networks.p019
    topics: [math.discrete.networks]
    difficulty: 4
    type: expression
    stem: "กราฟที่มีจุดยอด $n$ จุด และทุกคู่ของจุดยอดมีเส้นเชื่อมกันหนึ่งเส้นพอดี มีเส้นเชื่อมกี่เส้น เขียนในรูปของ $n$"
    answer: { latex: "\\frac{n(n-1)}{2}", variables: [n] }
    hints:
      - "จุดยอดแต่ละจุดมีดีกรีเท่าใด"
      - "ทุกจุดมีดีกรี $n - 1$ แล้วใช้ผลรวมดีกรี $= 2 \\times$ จำนวนเส้นเชื่อม"
    misconceptions:
      - { match: "n(n-1)", feedback: "นี่คือผลรวมดีกรี เส้นเชื่อมแต่ละเส้นถูกนับสองครั้ง ต้องหารด้วย 2" }
      - { match: "n^2", feedback: "จุดยอดไม่เชื่อมกับตัวเอง แต่ละจุดเชื่อมกับอีก $n - 1$ จุด และต้องหารด้วย 2" }
    solution: "ทุกจุดมีดีกรี $n - 1$ ผลรวมดีกรี $= n(n - 1)$ จำนวนเส้นเชื่อม $= \\dfrac{n(n - 1)}{2}$ (เช่น $n = 6$ ได้ 15)"
    license: CC-BY-SA-4.0
    ai_assisted: true
