  ai_assisted: true
- id: science.nature.nature-of-science.p015
  topics:
  - science.nature.nature-of-science
  difficulty: 5
  type: mcq
  stem: มีโพสต์ว่า "นักวิทยาศาสตร์เปลี่ยนคำอธิบายเรื่องแผลในกระเพาะ เรื่องทวีป และเรื่องพลูโต แปลว่าวิทยาศาสตร์เชื่อถือไม่ได้" ข้อโต้แย้งใดดีที่สุด
  choices:
  - id: a
    text: การเปลี่ยนเกิดจากหลักฐานใหม่ที่ผ่านการตรวจสอบและทำซ้ำ แสดงว่าวิทยาศาสตร์แก้ไขตัวเองได้ ความรู้ที่มีหลักฐานมากจึงเชื่อถือได้สูงแม้จะปรับได้
    correct: true
  - id: b
    text: จริง ควรเชื่อความรู้ที่ไม่เคยเปลี่ยนเลยแทน
    feedback: ความรู้ที่ไม่ยอมเปลี่ยนแม้มีหลักฐานขัดแย้งยิ่งเชื่อถือได้น้อยกว่า
  - id: c
    text: นักวิทยาศาสตร์ไม่เคยเปลี่ยนความคิด โพสต์นี้ผิดทั้งหมด
    feedback: นักวิทยาศาสตร์เปลี่ยนคำอธิบายจริง แต่เปลี่ยนเพราะหลักฐาน
  - id: d
    text: ทุกความเห็นมีน้ำหนักเท่ากัน จึงเชื่ออะไรก็ได้
    feedback: วิทยาศาสตร์ชั่งน้ำหนักความเห็นด้วยหลักฐาน ไม่ใช่ให้น้ำหนักเท่ากันทุกความเห็น
  hints:
  - ถามว่าความรู้เปลี่ยนเพราะอะไร
  - ระบบที่แก้ข้อผิดพลาดได้ดีกว่าระบบที่แก้ไม่ได้หรือไม่
  solution: การปรับความรู้ตามหลักฐานใหม่เป็นจุดแข็ง ความรู้ปัจจุบันคือคำอธิบายที่ดีที่สุดเท่าที่หลักฐานมี และเชื่อถือได้มากเมื่อผ่านการทดสอบและทำซ้ำหลายครั้ง
  figure:
    src: changes.svg
    alt: 'ตารางสามแถว แผลในกระเพาะ: เชื่อว่าเกิดจากความเครียดและอาหาร → พ.ศ. 2525 พบเชื้อ H. pylori → 2548 รางวัลโนเบล รักษาด้วยยาฆ่าเชื้อ ทวีป: เชื่อว่าทวีปอยู่กับที่ → 2455 เวเกเนอร์เสนอทวีปเลื่อน → 2503–2512 หลักฐานพื้นสมุทร นำไปสู่ธรณีแปรสัณฐาน ดาวพลูโต: 2473 ค้นพบ นับเป็นดาวเคราะห์ → พบวัตถุขนาดใกล้เคียงหลายดวง → 2549 นิยามใหม่ เป็นดาวเคราะห์แคระ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.nature.nature-of-science.p016
  topics:
  - science.nature.nature-of-science
  difficulty: 5
  type: mcq
  stem: กลุ่มของโอ๊ตทดลองแล้วได้ผลขัดกับสิ่งที่เขียนในหนังสือเรียน ควรทำอย่างไรตามธรรมชาติของวิทยาศาสตร์
  choices:
  - id: a
    text: ตรวจวิธีการและเครื่องมือ ทำซ้ำ บันทึกผลตามจริง แล้วนำเสนอให้ครูและเพื่อนตรวจสอบ ถ้าผลยังขัดอยู่ก็หาคำอธิบายหรือคำถามใหม่
    correct: true
  - id: b
    text: แก้ตัวเลขให้ตรงกับหนังสือ
    feedback: การแก้ข้อมูลให้ตรงกับคำตอบที่อยากได้ผิดจริยธรรมและปิดโอกาสค้นพบสิ่งใหม่
  - id: c
    text: สรุปทันทีว่าหนังสือผิด
    feedback: ผลครั้งเดียวอาจมาจากความคลาดเคลื่อน ต้องตรวจและทำซ้ำก่อน
  - id: d
    text: ทิ้งผลการทดลองแล้วไม่พูดถึง
    feedback: ผลที่ไม่เป็นตามคาดมีค่า ควรรายงานพร้อมเหตุผล
  hints:
  - ผลที่ขัดกับความรู้เดิมอาจมาจากความคลาดเคลื่อนหรือการค้นพบใหม่
  - วิทยาศาสตร์ใช้การทำซ้ำและการให้ผู้อื่นตรวจสอบ
  solution: 'ทำแบบเดียวกับนักวิทยาศาสตร์: ตรวจวิธีการ ทำซ้ำ รายงานตามจริง และให้ผู้อื่นตรวจสอบ (ดูการวิเคราะห์ความคลาดเคลื่อนใน [การจัดกระทำและวิเคราะห์ข้อมูลจากการทดลอง](/topic/science.inquiry.data-analysis/))'
