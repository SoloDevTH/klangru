    figure: { src: scatter-practice.svg, alt: "แผนภาพการกระจาย แกนนอนคือเวลาฝึกซ้อม 0 ถึง 7 ชั่วโมงต่อสัปดาห์ แกนตั้งคือคะแนน 40 ถึง 100 มีจุด 14 จุด จุดเรียงตัวขึ้นจากซ้ายล่างไปขวาบน คนที่ซ้อม 1 ชั่วโมงได้ประมาณ 42 คะแนน คนที่ซ้อม 6 ชั่วโมงได้ประมาณ 83 คะแนน" }
    choices:
      - { id: a, text: "นักเรียนที่ซ้อมนานกว่ามักได้คะแนนสูงกว่า", correct: true }
      - { id: b, text: "ข้อมูลนี้พิสูจน์ได้ว่าการซ้อมเป็นสาเหตุให้คะแนนสูงขึ้น", feedback: "การสำรวจเห็นแค่ความสัมพันธ์ อาจมีสิ่งอื่นเกี่ยวข้อง เช่น คนที่ชอบดนตรีอยู่แล้วทั้งซ้อมมากและเก่งกว่า ต้องทำการทดลองจึงจะบอกสาเหตุได้ชัด" }
      - { id: c, text: "นักเรียนที่ซ้อม 3 ชั่วโมงทุกคนได้คะแนนเท่ากัน", feedback: "มีสองคนที่ซ้อม 3 ชั่วโมงแต่ได้ประมาณ 62 และ 54 คะแนน" }
      - { id: d, text: "กลุ่มตัวอย่างมีแค่ 14 คน จึงควรระวังก่อนสรุปไปถึงนักเรียนทุกคน", correct: true }
    hints:
      - "จุดเรียงตัวไปทางใด"
      - "ความสัมพันธ์ต่างจากการเป็นสาเหตุอย่างไร"
    solution: "จุดเรียงขึ้นจากซ้ายล่างไปขวาบน แสดงว่าซ้อมนานมักได้คะแนนสูง (ความสัมพันธ์ทางบวก) แต่การสำรวจยังบอกสาเหตุไม่ได้ และกลุ่มตัวอย่างเล็ก ต้องระวังเวลาสรุปกว้าง"
