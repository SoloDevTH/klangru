problems:
  - id: earthscience.atmosphere.greenhouse-climate-intro.p001
    topics: [earthscience.atmosphere.greenhouse-climate-intro]
    difficulty: 1
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นแก๊สเรือนกระจก (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "คาร์บอนไดออกไซด์", correct: true }
      - { id: b, text: "มีเทน", correct: true }
      - { id: c, text: "ไอน้ำ", correct: true }
      - { id: d, text: "ไนโตรเจน", feedback: "ไนโตรเจนมีมากที่สุดในอากาศ แต่ไม่ดูดกลืนรังสีอินฟราเรด จึงไม่ใช่แก๊สเรือนกระจก" }
      - { id: e, text: "ออกซิเจน", feedback: "ออกซิเจนจำเป็นต่อการหายใจ แต่ไม่ใช่แก๊สเรือนกระจก" }
    hints:
      - "แก๊สเรือนกระจกดูดกลืนรังสีอินฟราเรดได้"
      - "แก๊สสองชนิดที่มีมากที่สุดในอากาศไม่ใช่แก๊สเรือนกระจก"
    solution: "คาร์บอนไดออกไซด์ มีเทน และไอน้ำเป็นแก๊สเรือนกระจก ส่วนไนโตรเจนและออกซิเจนไม่ใช่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.greenhouse-climate-intro.p002
    topics: [earthscience.atmosphere.greenhouse-climate-intro]
    difficulty: 1
    type: mcq
    stem: "ถ้าบรรยากาศของโลกไม่มีแก๊สเรือนกระจกเลย ผิวโลกจะเป็นอย่างไร"
    choices:
      - { id: a, text: "หนาวจัด อุณหภูมิเฉลี่ยราว −18 °C", correct: true }
      - { id: b, text: "ร้อนกว่าปัจจุบันมาก", feedback: "แก๊สเรือนกระจกช่วยเก็บความร้อน ถ้าไม่มีเลย ความร้อนจะออกไปอวกาศได้ง่าย โลกจึงหนาวขึ้น" }
      - { id: c, text: "อุณหภูมิเท่าเดิม", feedback: "แก๊สเรือนกระจกทำให้ผิวโลกอุ่นขึ้นราว 33 °C ถ้าไม่มีอุณหภูมิจึงไม่เท่าเดิม" }
      - { id: d, text: "ไม่มีแสงอาทิตย์ส่องถึงพื้น", feedback: "แสงอาทิตย์ยังส่องถึงพื้นได้ แก๊สเรือนกระจกมีผลกับรังสีอินฟราเรดที่ออกจากผิวโลก" }
    hints:
      - "แก๊สเรือนกระจกทำหน้าที่คล้ายผ้าห่ม"
      - "ปัจจุบันผิวโลกเฉลี่ยราว 15 °C"
    solution: "ปรากฏการณ์เรือนกระจกตามธรรมชาติทำให้ผิวโลกอุ่นเฉลี่ยราว 15 °C ถ้าไม่มีแก๊สเรือนกระจกเลย ผิวโลกจะเฉลี่ยราว −18 °C น้ำส่วนใหญ่จะเป็นน้ำแข็ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.greenhouse-climate-intro.p003
    topics: [earthscience.atmosphere.greenhouse-climate-intro]
    difficulty: 1
    type: match
    stem: "จับคู่กิจกรรมของมนุษย์กับแก๊สเรือนกระจกที่ปล่อยออกมามาก"
    pairs:
      - { left: "เผาน้ำมันในเครื่องยนต์รถ", right: "คาร์บอนไดออกไซด์" }
      - { left: "นาข้าวที่มีน้ำขังและการเลี้ยงวัว", right: "มีเทน" }
      - { left: "ใส่ปุ๋ยเคมีมากเกินไป", right: "ไนตรัสออกไซด์" }
    hints:
      - "การเผาเชื้อเพลิงที่มีคาร์บอนให้แก๊สใด"
      - "จุลินทรีย์ในที่ขาดออกซิเจนสร้างแก๊สมีเทน"
    solution: "เผาน้ำมันได้คาร์บอนไดออกไซด์ นาข้าวน้ำขังและวัวปล่อยมีเทน ปุ๋ยเคมีที่มากเกินทำให้เกิดไนตรัสออกไซด์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.greenhouse-climate-intro.p004
    topics: [earthscience.atmosphere.greenhouse-climate-intro]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนของปรากฏการณ์เรือนกระจก"
    items:
      - "แสงอาทิตย์ส่องผ่านบรรยากาศลงมาถึงผิวโลก"
      - "ผิวโลกดูดกลืนแสงแล้วอุ่นขึ้น"
      - "ผิวโลกแผ่รังสีอินฟราเรดขึ้นไป"
      - "แก๊สเรือนกระจกดูดกลืนรังสีอินฟราเรด แล้วแผ่ส่วนหนึ่งกลับลงมา"
    hints:
      - "เริ่มจากพลังงานที่มาจากดวงอาทิตย์"
      - "ผิวโลกต้องอุ่นก่อนจึงจะแผ่รังสีอินฟราเรด"
    solution: "แสงอาทิตย์ส่องลงมา → ผิวโลกอุ่นขึ้น → ผิวโลกแผ่อินฟราเรด → แก๊สเรือนกระจกดูดกลืนและแผ่กลับ ผิวโลกจึงอุ่นกว่ากรณีไม่มีแก๊สเหล่านี้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.greenhouse-climate-intro.p005
    topics: [earthscience.atmosphere.greenhouse-climate-intro]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดช่วยลดการปล่อยแก๊สเรือนกระจก (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ปิดไฟและพัดลมเมื่อออกจากห้อง", correct: true }
      - { id: b, text: "ปั่นจักรยานไปโรงเรียนแทนให้ผู้ปกครองขับรถไปส่ง เมื่อบ้านอยู่ใกล้", correct: true }
      - { id: c, text: "แยกเศษอาหารไปทำปุ๋ยหมัก", correct: true }
      - { id: d, text: "เผาใบไม้และขยะหลังบ้าน", feedback: "การเผาปล่อยคาร์บอนไดออกไซด์และฝุ่นควัน ควรนำใบไม้ไปทำปุ๋ยหมัก" }
      - { id: e, text: "ตั้งเครื่องปรับอากาศที่ 18 °C", feedback: "ยิ่งตั้งอุณหภูมิต่ำ ยิ่งใช้ไฟฟ้ามาก ควรตั้งราว 25–26 °C" }
    hints:
      - "ไฟฟ้าส่วนใหญ่ผลิตจากการเผาเชื้อเพลิง"
      - "เศษอาหารในบ่อขยะเน่าแล้วเกิดมีเทน"
    solution: "ประหยัดไฟฟ้า ใช้พลังงานจากการปั่นจักรยาน และทำปุ๋ยหมักแทนทิ้งเศษอาหาร ช่วยลดแก๊สเรือนกระจก ส่วนการเผาขยะและตั้งเครื่องปรับอากาศเย็นจัดเพิ่มแก๊สเรือนกระจก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.greenhouse-climate-intro.p006
    topics: [earthscience.atmosphere.greenhouse-climate-intro]
    difficulty: 2
    type: text
    stem: "เมื่อเผาถ่านหิน น้ำมัน หรือแก๊สธรรมชาติ คาร์บอนในเชื้อเพลิงรวมกับออกซิเจนเป็นแก๊สเรือนกระจกชนิดใด"
    accepted: ["คาร์บอนไดออกไซด์", "แก๊สคาร์บอนไดออกไซด์", "co2", "carbon dioxide"]
    misconceptions:
      - { match: "มีเทน", feedback: "มีเทนเกิดจากการเน่าโดยไม่มีออกซิเจน การเผาไหม้ที่มีออกซิเจนให้แก๊สอีกชนิดหนึ่ง" }
      - { match: "คาร์บอนมอนอกไซด์", feedback: "คาร์บอนมอนอกไซด์เกิดเมื่อเผาไหม้ไม่สมบูรณ์ และเป็นแก๊สพิษ ไม่ใช่แก๊สเรือนกระจกหลักจากการเผาเชื้อเพลิง" }
    hints:
      - "คาร์บอน 1 อะตอม รวมกับออกซิเจน 2 อะตอม"
      - "เป็นแก๊สที่พืชใช้สังเคราะห์ด้วยแสง"
    solution: "คาร์บอนไดออกไซด์ ($\\mathrm{CO_2}$) การเผาเชื้อเพลิงซากดึกดำบรรพ์เป็นแหล่งคาร์บอนไดออกไซด์จากมนุษย์ที่ใหญ่ที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.greenhouse-climate-intro.p007
    topics: [earthscience.atmosphere.greenhouse-climate-intro]
    difficulty: 2
    type: mcq
    stem: "เพื่อนพูดว่า \"เมื่อวานที่เชียงใหม่หนาวมาก แสดงว่าโลกไม่ได้ร้อนขึ้น\" ข้อใดตอบได้ถูกต้อง"
    choices:
      - { id: a, text: "อากาศวันเดียวคือลมฟ้าอากาศ การเปลี่ยนแปลงภูมิอากาศต้องดูค่าเฉลี่ยหลายสิบปีทั่วโลก", correct: true }
      - { id: b, text: "เพื่อนพูดถูก ถ้าโลกร้อนขึ้นจะไม่มีวันหนาวอีกเลย", feedback: "แม้ค่าเฉลี่ยสูงขึ้น วันที่หนาวก็ยังเกิดได้ แต่เกิดน้อยลง" }
      - { id: c, text: "เชียงใหม่ไม่ได้อยู่บนโลกที่ร้อนขึ้น", feedback: "การเปลี่ยนแปลงภูมิอากาศเกิดทั้งโลก แต่แต่ละที่เปลี่ยนไม่เท่ากัน" }
      - { id: d, text: "อากาศหนาวเกิดจากแก๊สเรือนกระจกลดลง", feedback: "ความหนาวในวันหนึ่งเกิดจากลมฟ้าอากาศ เช่น มวลอากาศเย็นจากจีน" }
    hints:
      - "ลมฟ้าอากาศกับภูมิอากาศต่างกันอย่างไร"
      - "ภูมิอากาศดูช่วงเวลานานเท่าไร"
    solution: "ความหนาวในวันหนึ่งเป็นลมฟ้าอากาศ ส่วนภูมิอากาศคือค่าเฉลี่ยระยะยาว ข้อมูลหลายสิบปีทั่วโลกแสดงว่าอุณหภูมิเฉลี่ยสูงขึ้นราว 1.1 °C"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.greenhouse-climate-intro.p008
    topics: [earthscience.atmosphere.greenhouse-climate-intro]
    difficulty: 3
    type: numeric
    stem: "จากกราฟคาร์บอนไดออกไซด์ที่หอสังเกตการณ์เมานาโลอา ค่าเฉลี่ยปี ค.ศ. 1960 ราว 317 ppm และปี ค.ศ. 2024 ราว 425 ppm เพิ่มขึ้นกี่ ppm"
    figure: { src: co2-mauna-loa.svg, alt: "กราฟเส้นคาร์บอนไดออกไซด์เฉลี่ยรายปีที่หอสังเกตการณ์เมานาโลอา ข้อมูล NOAA แกนนอนปี ค.ศ. 1959 ถึง 2025 แกนตั้ง 260 ถึง 440 ppm เส้นสีแดงเพิ่มขึ้นตลอดจากราว 316 ppm ใน ค.ศ. 1959 ผ่านราว 339 ใน ค.ศ. 1980 ราว 370 ใน ค.ศ. 2000 ราว 414 ใน ค.ศ. 2020 ถึงราว 427 ใน ค.ศ. 2025 และชันขึ้นเรื่อย ๆ เส้นประสีเขียวที่ 280 ppm คือระดับก่อนยุคอุตสาหกรรม" }
    answer: { value: 108, tolerance: 1, unit: ppm }
    misconceptions:
      - { match: 742, feedback: "บวกกันแทนการลบ การเพิ่มขึ้นหาจากค่าหลังลบค่าก่อน" }
      - { match: 145, feedback: "145 คือการเพิ่มจากระดับก่อนยุคอุตสาหกรรม 280 ppm โจทย์ถามตั้งแต่ ค.ศ. 1960" }
    hints:
      - "การเพิ่มขึ้น = ค่าปีหลัง − ค่าปีแรก"
      - "425 − 317"
    solution: "$425 - 317 = 108$ ppm ในเวลา 64 ปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.greenhouse-climate-intro.p009
    topics: [earthscience.atmosphere.greenhouse-climate-intro]
    difficulty: 3
    type: mcq
    stem: "จากกราฟคาร์บอนไดออกไซด์ที่เมานาโลอา ข้อสรุปใดถูกต้อง"
    figure: { src: co2-mauna-loa.svg, alt: "กราฟเส้นคาร์บอนไดออกไซด์เฉลี่ยรายปีที่หอสังเกตการณ์เมานาโลอา ข้อมูล NOAA แกนนอนปี ค.ศ. 1959 ถึง 2025 แกนตั้ง 260 ถึง 440 ppm เส้นสีแดงเพิ่มขึ้นตลอดจากราว 316 ppm ใน ค.ศ. 1959 ผ่านราว 339 ใน ค.ศ. 1980 ราว 370 ใน ค.ศ. 2000 ราว 414 ใน ค.ศ. 2020 ถึงราว 427 ใน ค.ศ. 2025 และชันขึ้นเรื่อย ๆ เส้นประสีเขียวที่ 280 ppm คือระดับก่อนยุคอุตสาหกรรม" }
    choices:
      - { id: a, text: "คาร์บอนไดออกไซด์เพิ่มขึ้นทุกปี และช่วงหลังเพิ่มเร็วกว่าช่วงแรก", correct: true }
      - { id: b, text: "คาร์บอนไดออกไซด์เพิ่มขึ้นแล้วลดลงสลับกันจนเท่าเดิม", feedback: "ค่าเฉลี่ยรายปีสูงขึ้นทุกปีในกราฟ ไม่ได้กลับไปเท่าเดิม" }
      - { id: c, text: "คาร์บอนไดออกไซด์ลดลงตั้งแต่ ค.ศ. 2000", feedback: "เส้นกราฟหลัง ค.ศ. 2000 ยังสูงขึ้นและชันกว่าเดิม" }
      - { id: d, text: "ปัจจุบันคาร์บอนไดออกไซด์ต่ำกว่าก่อนยุคอุตสาหกรรม", feedback: "ปัจจุบันราว 425 ppm สูงกว่า 280 ppm มาก" }
    hints:
      - "ดูทิศของเส้น ขึ้นหรือลง"
      - "เทียบความชันช่วง ค.ศ. 1960–1980 กับ 2000–2020"
    solution: "เส้นขึ้นตลอด ค.ศ. 1960–1980 เพิ่มราว 22 ppm ใน 20 ปี แต่ ค.ศ. 2000–2020 เพิ่มราว 45 ppm ใน 20 ปี จึงเพิ่มเร็วขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.greenhouse-climate-intro.p010
    topics: [earthscience.atmosphere.greenhouse-climate-intro]
    difficulty: 3
    type: mcq
    stem: "นักดำน้ำพบปะการังในทะเลอันดามันซีดเป็นสีขาวในปีที่น้ำทะเลร้อนผิดปกติ เหตุการณ์นี้เรียกว่าอะไรและเกิดอย่างไร"
    choices:
      - { id: a, text: "ปะการังฟอกขาว สาหร่ายที่อาศัยในเนื้อปะการังออกไปเมื่อน้ำร้อนเกินไป", correct: true }
      - { id: b, text: "ปะการังถูกแสงแดดเผาจนไหม้", feedback: "ปะการังซีดเพราะเสียสาหร่ายที่ให้สี ไม่ได้ไหม้เพราะแดด" }
      - { id: c, text: "ปะการังกลายเป็นหินปูนตามธรรมชาติ", feedback: "ปะการังที่ฟอกขาวยังมีชีวิตอยู่ช่วงหนึ่ง และอาจฟื้นตัวได้ถ้าน้ำเย็นลงทัน" }
      - { id: d, text: "น้ำทะเลมีเกลือน้อยลง", feedback: "สาเหตุหลักของการฟอกขาวครั้งใหญ่คือน้ำทะเลร้อนผิดปกติ" }
    hints:
      - "ปะการังมีสีจากสาหร่ายเล็ก ๆ ที่อาศัยร่วมกัน"
      - "น้ำทะเลที่ร้อนเกินไปทำให้ความสัมพันธ์นี้เสีย"
    solution: "เมื่อน้ำทะเลร้อนผิดปกตินาน สาหร่ายที่ให้อาหารและสีแก่ปะการังออกไป ปะการังจึงซีดขาว เรียกว่าปะการังฟอกขาว ถ้าน้ำร้อนนานเกินไป ปะการังจะตาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.greenhouse-climate-intro.p011
    topics: [earthscience.atmosphere.greenhouse-climate-intro]
    difficulty: 3
    type: mcq
    stem: "ข้อใดเป็นการ \"ปรับตัว\" ให้อยู่ได้อย่างปลอดภัยภายใต้การเปลี่ยนแปลงภูมิอากาศ ไม่ใช่การลดแก๊สเรือนกระจก"
    choices:
