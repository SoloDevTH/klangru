  - id: computer.programming.teamwork.p013
    topics: [computer.programming.teamwork]
    difficulty: 4
    type: mcq
    stem: "ทีมอยากรู้ว่านักเรียนทั้งโรงเรียนอยากได้เกมคำศัพท์แบบใด จึงทำแบบสำรวจออนไลน์ ข้อใดออกแบบได้ดีที่สุด"
    choices:
      - { id: a, text: "ถามว่า \"ปกติฝึกคำศัพท์ด้วยวิธีใด\" และ \"อยากให้เกมช่วยเรื่องใดมากที่สุด\" แล้วส่งให้ทุกระดับชั้นตอบ", correct: true }
      - { id: b, text: "ถามว่า \"เกมของเราดีมากใช่ไหม\" แล้วส่งให้เพื่อนในห้อง", feedback: "คำถามชี้นำ และผู้ตอบเป็นกลุ่มแคบที่คล้ายผู้พัฒนา" }
      - { id: c, text: "ถามเฉพาะสมาชิกในทีม เพราะรู้เรื่องเกมดีที่สุด", feedback: "ไม่ใช่การระดมความเห็นจากผู้ใช้จำนวนมาก" }
      - { id: d, text: "ถามคำถามปลายเปิด 40 ข้อเพื่อให้ได้ข้อมูลมากที่สุด", feedback: "แบบสำรวจยาวเกินไปทำให้คนตอบน้อยหรือตอบลวก ๆ" }
    hints:
      - "คำถามต้องเป็นกลางและไม่ชี้นำ"
      - "ผู้ตอบควรเป็นตัวแทนของผู้ใช้ทั้งหมด"
    solution: "แบบสำรวจที่ดีใช้คำถามเป็นกลาง สั้นพอให้คนตอบครบ และส่งให้ผู้ใช้หลายกลุ่ม ข้อ a ถามพฤติกรรมและความต้องการจริงจากทุกระดับชั้น"
