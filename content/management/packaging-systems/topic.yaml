id: management.operations.packaging-systems
subject: management
title: { th: ระบบบรรจุภัณฑ์และหน่วยขนส่งในงานโลจิสติกส์, en: Packaging systems and unit loads in logistics }
summary: ออกแบบบรรจุภัณฑ์ให้ปกป้องสินค้า คำนวณจำนวนกล่องบนพาเลท อ่านสัญลักษณ์และบาร์โค้ด GS1 และเลือกบรรจุภัณฑ์จากต้นทุนรวมที่รวมความเสียหาย
difficulty: 6.5
minutes: 45
prerequisites: [management.operations.supply-chain]
encompasses:
  - { id: management.operations.supply-chain, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: packaging-levels.svg
    alt: "ผังสี่ขั้นจากซ้ายไปขวา ขั้นแรกเป็นซองฟอยล์หนึ่งซองที่ใส่สินค้าหนึ่งชิ้น ขั้นที่สองเป็นกล่องกระดาษที่บรรจุซองหกซอง ขั้นที่สามเป็นลังลูกฟูกที่บรรจุกล่องสี่กล่อง ขั้นที่สี่เป็นพาเลทที่วางลังสองลังเรียงข้างกัน"
    caption: "จากชั้นในที่สัมผัสสินค้าไปถึงหน่วยขนส่งที่ยกด้วยเครื่องจักรได้ทีเดียว"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: pallet-pattern.svg
    alt: "ผังมองจากด้านบนของพาเลทแบบยุโรปกว้าง 800 มิลลิเมตร ยาว 1,200 มิลลิเมตร มีกล่องวางเรียงเป็นตารางสี่คอลัมน์และสี่แถว กล่องทุกกล่องมีขนาด 200 คูณ 300 มิลลิเมตร และวางในทิศทางเดียวกันทั้งหมด"
    caption: "วางกล่องทุกกล่องในทิศทางเดียวกันบนพาเลท ภาพวาดตามสัดส่วนจริง"
  - type: worked-example
    title: เลือกทิศการวางกล่องและหาอัตราการใช้พื้นที่
    problem: "กล่องขนาด 450 × 300 มม. จะวางบนพาเลท 1,200 × 1,000 มม. โดยให้ทุกกล่องอยู่ในทิศทางเดียวกันและไม่เกินขอบพาเลท วางได้กี่กล่องต่อชั้น และกล่องคลุมพื้นที่ฐานกี่เปอร์เซ็นต์"
    steps:
      - text: "ทิศที่ 1 วางด้านกว้าง 450 ตามด้านกว้างพาเลท ได้ $\\lfloor 1200/450 \\rfloor \\times \\lfloor 1000/300 \\rfloor = 2 \\times 3 = 6$ กล่อง"
        why: "ปัดลงเสมอ เพราะกล่องที่ไม่ครบแถวหรือคอลัมน์ไม่ได้ช่วยจำนวน"
      - text: "ทิศที่ 2 หมุนกล่องให้ด้านกว้าง 300 ตามด้านกว้างพาเลท ได้ $\\lfloor 1200/300 \\rfloor \\times \\lfloor 1000/450 \\rfloor = 4 \\times 2 = 8$ กล่อง"
        why: "การหมุนไม่ได้เปลี่ยนขนาดกล่อง แต่เปลี่ยนว่ามีเศษเหลือเท่าไรในแต่ละทิศ"
      - text: "เลือกทิศที่ 2 เพราะได้มากกว่า จึงได้ 8 กล่องต่อชั้น"
      - text: "พื้นที่ที่กล่องคลุม $8 \\times 450 \\times 300 = 1{,}080{,}000$ มม.² เทียบกับพื้นที่พาเลท $1{,}200{,}000$ มม.² ได้ $\\dfrac{1{,}080{,}000}{1{,}200{,}000} = 90\\%$"
        why: "อัตราการใช้พื้นที่ฐานบอกว่าที่ว่างบนพาเลทเหลือเท่าไร ที่ว่างนี้เป็นค่าใช้จ่ายที่ไม่ได้ใช้"
    answer: "วางได้ 8 กล่องต่อชั้นโดยหมุนกล่อง และพื้นที่ฐานถูกใช้ไป 90%"
  - { type: check, problem: management.operations.packaging-systems.p005, prompt: "ลองนับเองโดยไม่หมุนกล่องก่อนดูเฉลย" }
  - type: worked-example
    title: คำนวณเลขตรวจสอบของบาร์โค้ด EAN-13 ด้วยมือ
    problem: "หาเลขตรวจสอบหลักที่ 13 ของรหัสสินค้า 12 หลักนี้ 8 8 5 4 0 0 1 2 3 4 5 6"
    steps:
      - text: "ให้หลักที่ตำแหน่งคี่ (1, 3, 5, ...) มีน้ำหนัก 1 และหลักที่ตำแหน่งคู่มีน้ำหนัก 3 ได้ 8, 24, 5, 12, 0, 0, 1, 6, 3, 12, 5, 18"
        why: "น้ำหนักสลับ 1 กับ 3 ทำให้ตรวจจับการพิมพ์สลับตำแหน่งได้ดีกว่าการบวกธรรมดา"
      - text: "รวมผลคูณทั้งหมด ได้ $8 + 24 + 5 + 12 + 0 + 0 + 1 + 6 + 3 + 12 + 5 + 18 = 94$"
      - text: "หาเศษเมื่อหาร 94 ด้วย 10 ได้ 4 เลขตรวจคือ $(10 - 4) \\bmod 10 = 6$"
        why: "ถ้าผลรวมลงตัวพอดี เลขตรวจต้องเป็น 0 ไม่ใช่ 10 จึงต้องมี mod 10 รอบสุดท้าย"
    answer: "เลขตรวจสอบคือ 6 รหัสเต็มคือ 8854001234566"
  - { type: check, problem: management.operations.packaging-systems.p012, prompt: "ลองแยกรหัสบาร์โค้ดตามระดับบรรจุ" }
glossary:
  - { term: หน่วยขนส่ง (unit load), definition: "การรวมหลายชิ้นหรือหลายลังให้เป็นหน่วยเดียว เช่น บนพาเลท เพื่อยกและขนถ่ายพร้อมกัน" }
  - { term: พาเลท, definition: "แท่นแบนสำหรับรองรับหน่วยขนส่งให้ยกด้วยรถโฟล์กลิฟต์หรือรถยกได้" }
  - { term: อัตราการใช้พื้นที่ฐาน, definition: "สัดส่วนของพื้นที่พาเลทที่กล่องคลุมจริง เทียบกับพื้นที่ทั้งหมดของพาเลท" }
  - { term: ความแข็งกด (BCT), definition: "แรงกดสูงสุดที่กล่องรับได้ก่อนยุบ ใช้ประเมินว่าซ้อนได้กี่ชั้น" }
  - { term: GTIN, definition: "หมายเลขการค้าสากลของสินค้า ใช้ระบุหน่วยการค้า เช่น EAN-13 ระดับหน่วยขายปลีก หรือ GTIN-14 ระดับกล่องและลัง" }
  - { term: EPR, definition: "หลักการขยายความรับผิดชอบของผู้ผลิตไปถึงช่วงหลังการใช้งานของบรรจุภัณฑ์" }
flashcards:
  - { front: "บรรจุภัณฑ์ระดับชั้นในกับชั้นนอกต่างกันอย่างไร", back: "ชั้นในสัมผัสสินค้าโดยตรง ชั้นนอกใช้รวมหน่วยเพื่อการขนส่ง" }
  - { front: "จำนวนกล่องต่อชั้นบนพาเลท", back: "$\\lfloor L/a \\rfloor \\times \\lfloor W/b \\rfloor$ ทั้งสองทิศแล้วเลือกที่มากกว่า โดยปัดลงทุกครั้ง" }
  - { front: "จำนวนชั้นที่ซ้อนได้ต่อความสูง", back: "$\\lfloor (H_{\\max} - h_{\\text{พาเลท}}) / h \\rfloor$ หักความสูงพาเลทออกก่อน" }
  - { front: "EAN-13 หลักที่ 13 คืออะไร", back: "เลขตรวจสอบ คำนวณจากหลัก 12 หลักแรก โดยน้ำหนักสลับ 1 กับ 3 แล้วทำ $(10 - \\text{ผลรวม mod } 10) \\bmod 10$" }
  - { front: "ทำไมต้องเทียบต้นทุนรวมของบรรจุภัณฑ์", back: "ต้นทุนรวมต่อชิ้น = ค่าบรรจุ + อัตราเสียหาย × มูลค่าสินค้า บรรจุภัณฑ์ราคาต่อชิ้นต่ำอาจแพงกว่าเมื่อรวมความเสียหาย" }
