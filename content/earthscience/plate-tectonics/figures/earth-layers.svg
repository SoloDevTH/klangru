<line x1="60" y1="420" x2="740" y2="420" stroke="#1f2937"/>
<text x="179.3" y="292.6" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">เนื้อโลก</text>
<text x="179.3" y="309.6" text-anchor="middle" font-size="12" fill="#222">ซิลิเกตของ Mg และ Fe</text>
<text x="329.6" y="319.4" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">แก่นโลกชั้นนอก</text>
<text x="329.6" y="336.4" text-anchor="middle" font-size="12" fill="#222">Fe–Ni ของเหลว</text>
<text x="399.1" y="395.6" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">แก่นโลกชั้นใน</text>
<text x="399.1" y="412.6" text-anchor="middle" font-size="12" fill="#222">Fe–Ni ของแข็ง</text>
<text x="90.0" y="40.0" text-anchor="start" font-size="14" font-weight="bold" fill="#78350f">เปลือกโลก (เส้นสีน้ำตาล)</text>
<text x="90.0" y="58.0" text-anchor="start" font-size="12" fill="#222">ทวีป 30–50 km ทะเล 5–10 km หนาเกินจริงในภาพ</text>
<text x="780.0" y="40.0" text-anchor="end" font-size="14" font-weight="bold" fill="#1e3a8a">แบ่งตามสมบัติเชิงกล</text>
<line x1="500" y1="66" x2="535" y2="66" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="780.0" y="70.0" text-anchor="end" font-size="12" fill="#1e3a8a">ฐานของธรณีภาค (แข็ง) ~100 km</text>
<line x1="500" y1="90" x2="535" y2="90" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="2 3"/>
<text x="780.0" y="94.0" text-anchor="end" font-size="12" fill="#1e3a8a">ฐานของฐานธรณีภาค (อ่อน) ~350 km</text>
<line x1="730.0" y1="420" x2="730.0" y2="428" stroke="#111"/>
