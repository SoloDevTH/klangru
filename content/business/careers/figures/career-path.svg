  <text x="380.0" y="150.0" text-anchor="middle" fill="#6b7280" font-size="13">ระหว่างทางสร้างคุณลักษณะที่ดี: ขยัน ซื่อสัตย์ รับผิดชอบ ตรงต่อเวลา ใฝ่เรียนรู้</text>
