problems:
  - id: computer.programming.teamwork.p001
    topics: [computer.programming.teamwork]
    difficulty: 1
    type: match
    stem: "จับคู่บทบาทในทีมพัฒนาเกมกับหน้าที่หลัก"
    pairs:
      - { left: "ผู้แทนผู้ใช้", right: "รวบรวมความต้องการและตัดสินว่าอะไรสำคัญก่อน" }
      - { left: "ผู้ออกแบบ", right: "ออกแบบหน้าจอและประสบการณ์ผู้ใช้" }
      - { left: "นักพัฒนา", right: "เขียนโปรแกรมตามที่ออกแบบ" }
      - { left: "ผู้ทดสอบ", right: "เขียนกรณีทดสอบและหาบั๊ก" }
      - { left: "ผู้ประสานงาน", right: "ดูแลแผน นัดประชุม และช่วยแก้สิ่งที่ขวางทีม" }
    hints:
      - "บทบาทใดใกล้ชิดผู้ใช้ที่สุด"
      - "ทบทวนรายการบทบาทในบทเรียน"
    solution: "ผู้แทนผู้ใช้จัดลำดับความต้องการ ผู้ออกแบบออกแบบหน้าจอ นักพัฒนาเขียนโปรแกรม ผู้ทดสอบหาบั๊ก และผู้ประสานงานดูแลแผนและสิ่งที่ขวางทีม คนหนึ่งรับได้หลายบทบาทและควรสลับกันในแต่ละโครงงาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.teamwork.p002
    topics: [computer.programming.teamwork]
    difficulty: 1
    type: mcq
    stem: "ในการเขียนโปรแกรมเป็นคู่ **ผู้นำทาง (navigator)** ทำหน้าที่ใด"
    choices:
      - { id: a, text: "ดูภาพรวม ทักเมื่อเห็นข้อผิดพลาด และคิดกรณีทดสอบ ขณะที่อีกคนพิมพ์", correct: true }
      - { id: b, text: "พิมพ์โค้ดทั้งหมดคนเดียว", feedback: "คนที่พิมพ์คือคนขับ (driver)" }
      - { id: c, text: "นั่งรอจนอีกคนเขียนเสร็จแล้วค่อยตรวจ", feedback: "ผู้นำทางทำงานไปพร้อมกัน ไม่ได้รอจนจบ" }
      - { id: d, text: "เขียนส่วนอื่นของโปรแกรมในอีกเครื่องหนึ่ง", feedback: "การเขียนเป็นคู่ใช้สองคนต่อหนึ่งเครื่อง ทำงานชิ้นเดียวกัน" }
    hints:
      - "สองคนใช้เครื่องเดียว คนหนึ่งพิมพ์"
      - "อีกคนทำอะไรที่คนพิมพ์มองไม่เห็นได้ง่าย"
    solution: "คนขับพิมพ์โค้ด ผู้นำทางดูภาพรวม จับข้อผิดพลาด และคิดกรณีทดสอบ แล้วสลับกันเป็นระยะ ทั้งสองคนจึงเข้าใจโค้ดทั้งหมด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.teamwork.p003
    topics: [computer.programming.teamwork]
    difficulty: 2
    type: text
    stem: "ใน Git การบันทึกภาพของไฟล์ในโครงงาน ณ เวลาหนึ่งพร้อมข้อความบอกว่าเปลี่ยนอะไร เรียกว่าอะไร (ภาษาอังกฤษหรือไทย)"
    accepted: ["commit", "คอมมิต", "คอมมิท", "git commit"]
    misconceptions:
      - { match: "push", feedback: "push คือส่งคอมมิตที่มีอยู่แล้วขึ้นคลังกลาง ไม่ใช่การบันทึก" }
      - { match: "branch", feedback: "branch คือกิ่งของการพัฒนา ไม่ใช่การบันทึกแต่ละครั้ง" }
    hints:
      - "คำสั่งนี้ใช้คู่กับตัวเลือก -m \"ข้อความ\""
      - "ดูโค้ดตัวอย่างในหัวข้อระบบควบคุมเวอร์ชัน"
    solution: "คอมมิต (commit) เช่น git commit -m \"เพิ่มตัวนับคะแนน\" บันทึกการเปลี่ยนแปลงไว้ในประวัติ ย้อนดูหรือกลับไปรุ่นนั้นได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.teamwork.p004
    topics: [computer.programming.teamwork]
    difficulty: 2
    type: order
    stem: "ต้นต้องการเพิ่มด่านใหม่ในเกมของทีมผ่านคลังบน GitHub เรียงขั้นตอนให้ถูกต้อง"
    items:
      - "แตกกิ่งใหม่ git switch -c new-level"
      - "แก้ไฟล์และทดสอบในเครื่อง"
      - "git add แล้ว git commit -m \"เพิ่มด่านที่ 3\""
      - "git push ส่งกิ่งขึ้นคลังกลาง"
      - "เปิดคำขอรวม (pull request)"
      - "เพื่อนตรวจโค้ดแล้วรวมเข้ากิ่งหลัก"
    hints:
      - "ทำงานบนกิ่งของตัวเองก่อนแก้ไฟล์"
      - "ต้องส่งกิ่งขึ้นคลังกลางก่อน เพื่อนจึงเห็นและตรวจได้"
    solution: "แตกกิ่ง → แก้และทดสอบ → add และ commit → push → เปิด pull request → ตรวจโค้ดแล้วรวม กิ่งหลักจึงมีเฉพาะงานที่ผ่านการตรวจ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.teamwork.p005
    topics: [computer.programming.teamwork]
    difficulty: 2
    type: mcq
    stem: "ทีมแชร์เอกสารออกแบบเกมทางลิงก์ ซึ่งมีชื่อและเบอร์โทรของผู้ทดสอบ ควรตั้งสิทธิ์อย่างไร"
    choices:
      - { id: a, text: "ให้สิทธิ์แก้ไขเฉพาะสมาชิกทีมที่ระบุชื่อ และเก็บข้อมูลติดต่อของผู้ทดสอบแยกไว้ในที่ที่จำกัดสิทธิ์", correct: true }
      - { id: b, text: "ทุกคนที่มีลิงก์แก้ไขได้ จะได้สะดวก", feedback: "ลิงก์ถูกส่งต่อได้ คนนอกทีมอาจแก้หรือเห็นข้อมูลส่วนบุคคล" }
      - { id: c, text: "โพสต์ลิงก์ในกลุ่มสาธารณะของโรงเรียนเพื่อให้ช่วยกันแก้", feedback: "เปิดข้อมูลส่วนบุคคลของผู้ทดสอบให้คนจำนวนมากเห็น" }
      - { id: d, text: "ส่งไฟล์ทางแชทให้ทุกคนแก้ในเครื่องตัวเอง", feedback: "ได้ไฟล์หลายรุ่นทับกัน และยังกระจายข้อมูลส่วนบุคคล" }
    hints:
      - "ใครจำเป็นต้องแก้เอกสารนี้จริง ๆ"
      - "ข้อมูลส่วนบุคคลของผู้อื่นต้องได้รับการปกป้อง"
    solution: "แชร์อย่างรับผิดชอบคือให้สิทธิ์เท่าที่จำเป็นกับคนที่ระบุ และแยกข้อมูลส่วนบุคคลไว้ในที่จำกัดสิทธิ์ ลิงก์ที่ใครก็แก้ได้อาจถูกส่งต่อจนข้อมูลรั่วหรือเอกสารถูกแก้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.teamwork.p006
    topics: [computer.programming.teamwork]
    difficulty: 3
    type: numeric
    stem: "ทีมทำเกมส่งงานวันวิทยาศาสตร์มีงาน 4 งาน A ออกแบบด่าน 2 วัน, B เขียนโค้ด 4 วัน (เริ่มได้หลัง A เสร็จ), C วาดภาพ 3 วัน (เริ่มได้หลัง A เสร็จ), D ทดสอบ 2 วัน (เริ่มได้หลัง B และ C เสร็จทั้งคู่) ถ้ามีคนพอให้งานที่ไม่ต้องรอกันทำพร้อมกันได้ โครงงานเสร็จเร็วที่สุดในกี่วัน"
    answer: { value: 8, unit: "วัน" }
    hints:
      - "B และ C ทำพร้อมกันได้ เพราะรอเฉพาะ A"
      - "D ต้องรองานที่เสร็จช้ากว่าระหว่าง B กับ C"
    misconceptions:
      - { match: 11, feedback: "บวกเวลาทุกงานเหมือนทำทีละงาน แต่ B กับ C ทำพร้อมกันได้" }
      - { match: 7, feedback: "ใช้เวลาของ C (3 วัน) แต่ D ต้องรอ B ซึ่งนานกว่า (4 วัน)" }
    solution: "A เสร็จวันที่ 2 จากนั้น B (4 วัน) และ C (3 วัน) ทำพร้อมกัน เสร็จพร้อมกันวันที่ 2 + 4 = 6 แล้ว D ทำ 2 วัน เสร็จวันที่ 8 เส้นทาง A → B → D ยาวที่สุด ถ้า B ล่าช้า ทั้งโครงงานล่าช้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.teamwork.p007
    topics: [computer.programming.teamwork]
    difficulty: 3
    type: numeric
    stem: "นักเรียนไทยทำโครงงานร่วมกับโรงเรียนในโตเกียว ประเทศไทยใช้เวลา UTC+7 ญี่ปุ่นใช้ UTC+9 ถ้านัดประชุมออนไลน์เวลา 16:00 น. ตามเวลาไทย ที่โตเกียวเป็นเวลากี่นาฬิกา (ตอบเป็นชั่วโมง 0–23)"
    answer: { value: 18, unit: "นาฬิกา" }
    hints:
      - "ญี่ปุ่นเร็วกว่าไทยกี่ชั่วโมง"
      - "บวกผลต่างของเขตเวลาเข้ากับเวลาไทย"
    misconceptions:
      - { match: 14, feedback: "ลบผลต่างแทนการบวก ญี่ปุ่นอยู่ทางตะวันออก เวลาจึงเร็วกว่าไทย" }
      - { match: 2, feedback: "2 คือผลต่างของเขตเวลา ต้องนำไปบวกกับ 16:00" }
    solution: "ญี่ปุ่นเร็วกว่าไทย 9 − 7 = 2 ชั่วโมง 16:00 ในไทยจึงเป็น 18:00 ที่โตเกียว ยังอยู่ในเวลาที่นักเรียนทั้งสองฝั่งเข้าร่วมได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.teamwork.p008
    topics: [computer.programming.teamwork]
    difficulty: 3
    type: mcq
    stem: "ฟ้ากับต้นเถียงกันว่าเกมควรมีโหมดจับเวลาหรือไม่ เถียงมาสองวันแล้วงานไม่เดิน วิธีใดเหมาะที่สุด"
    choices:
      - { id: a, text: "กลับไปดูความต้องการของผู้ใช้ ทำต้นแบบเล็ก ๆ ให้ผู้ใช้ลองทั้งสองแบบ แล้วตัดสินตามผล", correct: true }
      - { id: b, text: "ให้คนที่เสียงดังกว่าเป็นคนตัดสิน", feedback: "ไม่ได้อิงผู้ใช้หรือหลักฐาน และทำให้ทีมไม่ไว้ใจกัน" }
      - { id: c, text: "ต่างคนต่างทำแบบของตัวเองแล้วไม่บอกกัน", feedback: "งานจะขัดกันและรวมไม่ได้" }
      - { id: d, text: "พูดในแชทกลุ่มว่าอีกคนไม่เข้าใจเรื่องเกม", feedback: "เป็นการโจมตีตัวคน ทำให้ความขัดแย้งแย่ลง" }
    hints:
      - "ความขัดแย้งควรตัดสินด้วยอะไรแทนความเห็นส่วนตัว"
      - "ทบทวนหัวข้อสื่อสารและแก้ความขัดแย้ง"
    solution: "ใช้ความต้องการของผู้ใช้และข้อมูลจากการทดสอบเป็นตัวตัดสิน พูดถึงประเด็นไม่ใช่ตัวคน ถ้ายังตกลงไม่ได้จึงขอให้ครูช่วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.teamwork.p009
    topics: [computer.programming.teamwork]
    difficulty: 3
    type: mcq
    stem: |
      หลังสั่ง `git merge add-score` ไฟล์ game.py มีข้อความแบบนี้ หมายความว่าอะไร

      ```text
      print("เกม")
      <<<<<<< HEAD
      print("ยินดีต้อนรับ")
      =======
      score = 0
      >>>>>>> add-score
      ```
    choices:
      - { id: a, text: "สองกิ่งแก้บรรทัดเดียวกันต่างกัน Git ตัดสินเองไม่ได้ ทีมต้องเลือกหรือรวมสองแบบเอง ลบเครื่องหมายออก แล้วคอมมิต", correct: true }
      - { id: b, text: "Git ลบงานของกิ่ง add-score ทิ้งแล้ว", feedback: "งานของทั้งสองกิ่งยังอยู่ แสดงไว้ทั้งคู่ระหว่างเครื่องหมาย" }
      - { id: c, text: "ไฟล์เสียหาย ต้องเขียนโปรแกรมใหม่ทั้งหมด", feedback: "ไม่ต้องเขียนใหม่ แก้เฉพาะส่วนที่ขัดแย้ง" }
      - { id: d, text: "รวมสำเร็จแล้ว รันโปรแกรมได้เลย", feedback: "เครื่องหมาย <<<<<<< ยังอยู่ในไฟล์ Python รันแล้วจะเกิด SyntaxError" }
    hints:
      - "ส่วนบน = รุ่นของกิ่งที่อยู่ (HEAD) ส่วนล่าง = รุ่นของกิ่งที่นำมารวม"
      - "ทบทวนเรื่องความขัดแย้งในการรวม"
    solution: "นี่คือความขัดแย้งในการรวม (merge conflict) ส่วนระหว่าง <<<<<<< HEAD กับ ======= เป็นของกิ่งหลัก ส่วนถัดไปถึง >>>>>>> เป็นของ add-score ในกรณีนี้น่าจะต้องเก็บทั้งสองบรรทัด ลบเครื่องหมาย ทดสอบ แล้วคอมมิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.teamwork.p010
    topics: [computer.programming.teamwork]
    difficulty: 4
    type: numeric
    stem: "ทีมให้คะแนนความเสี่ยงของโครงงานเป็น โอกาสเกิด × ผลกระทบ (คะแนน 1–5) ได้แก่ ไฟล์งานหาย (โอกาส 2, ผล 5), สมาชิกป่วย (3, 3), เว็บที่ใช้ฝากงานล่ม (1, 4), งานเสร็จไม่ทันกำหนด (4, 4) ความเสี่ยงที่ควรวางแผนรับมือก่อนมีคะแนนเท่าใด"
    answer: { value: 16 }
    hints:
      - "คูณโอกาสกับผลกระทบของแต่ละความเสี่ยง"
      - "เลือกคะแนนที่สูงที่สุด"
    misconceptions:
      - { match: 10, feedback: "10 คือไฟล์งานหาย ผลกระทบสูงแต่โอกาสต่ำ ยังมีความเสี่ยงที่คะแนนรวมสูงกว่า" }
      - { match: 8, feedback: "บวกโอกาสกับผลกระทบ (4 + 4) แต่วิธีในบทเรียนคือคูณกัน" }
    solution: "ไฟล์หาย 2 × 5 = 10, ป่วย 3 × 3 = 9, เว็บล่ม 1 × 4 = 4, ไม่ทันกำหนด 4 × 4 = 16 จึงรับมือเรื่องไม่ทันกำหนดก่อน เช่น ตัดงานให้เล็กลง ตรวจความคืบหน้าทุกวัน และระบุผู้รับผิดชอบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.teamwork.p011
    topics: [computer.programming.teamwork]
    difficulty: 4
    type: mcq
    stem: |
      เพื่อนส่งโค้ดนี้มาให้ตรวจก่อนรวม ข้อกำหนดบอกว่าต้องรองรับนักเรียนที่ยังไม่มีคะแนน (ลิสต์ว่าง) ความเห็นใดสำคัญที่สุด

      ```python
      def avg(s):
          return sum(s) / len(s)
      ```
    choices:
      - { id: a, text: "ถ้า s ว่าง len(s) เป็น 0 จะเกิด ZeroDivisionError ควรตรวจลิสต์ว่างก่อนหาร และเพิ่มกรณีทดสอบนี้", correct: true }
      - { id: b, text: "ควรเปลี่ยนชื่อ s เป็น scores ให้สื่อความหมาย", feedback: "เป็นความเห็นที่ดี แต่สำคัญน้อยกว่าบั๊กที่ทำให้โปรแกรมหยุดทำงาน" }
      - { id: c, text: "ควรเพิ่ม docstring", feedback: "ช่วยเรื่องเอกสาร แต่ความถูกต้องต้องมาก่อน" }
      - { id: d, text: "โค้ดแย่ เขียนใหม่ทั้งหมด", feedback: "ความเห็นไม่เจาะจงและไม่สุภาพ ไม่ช่วยให้แก้ได้" }
    hints:
      - "ตรวจตามลำดับ ความถูกต้อง → ความปลอดภัย → อ่านง่าย → กรณีทดสอบ"
      - "ลองแทน s = [] ในโค้ด"
    solution: "ความถูกต้องสำคัญที่สุด avg([]) หารด้วยศูนย์จึงผิดข้อกำหนด ความเห็นที่ดีบอกปัญหา ผลกระทบ และวิธีแก้ เรื่องชื่อตัวแปรและ docstring ควรแนะนำด้วยแต่เป็นลำดับถัดมา"
