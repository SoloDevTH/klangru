strands:
  - id: "HPE-P"
    title: "Personal, social and community health"
    standards:
      - id: "HPE-P-IC"
        text: "Identities and change"
        indicators:
          - { id: "AC9HPFP01", level: "F", text: "investigate who they are and the people in their world" }
          - { id: "AC9HP2P01", level: "1-2", text: "describe their personal qualities and those of others, and explain how they contribute to developing identities" }
          - { id: "AC9HP4P01", level: "3-4", text: "investigate how success, challenge, setbacks and failure strengthen resilience and identities in a range of contexts" }
          - { id: "AC9HP4P02", level: "3-4", text: "plan, rehearse and reflect on strategies to cope with the different changes and transitions they experience, such as the changes associated with puberty" }
          - { id: "AC9HP4P03", level: "3-4", text: "describe how choices and actions can be influenced by stereotypes" }
          - { id: "AC9HP6P01", level: "5-6", text: "explain how identities can be influenced by people and places, and how we can create positive self-identities" }
          - { id: "AC9HP6P02", level: "5-6", text: "investigate resources and strategies to manage changes and transitions, including changes associated with puberty" }
          - { id: "AC9HP6P03", level: "5-6", text: "investigate how the portrayal of societal roles and responsibilities can be influenced by gender stereotypes" }
          - { id: "AC9HP8P01", level: "7-8", text: "analyse and reflect on the influence of values and beliefs on the development of identities" }
          - { id: "AC9HP8P02", level: "7-8", text: "analyse the impact of changes and transitions, and devise strategies to support themselves and others through these changes" }
          - { id: "AC9HP8P03", level: "7-8", text: "examine how roles, decision-making, and levels of power, coercion and control within relationships can be influenced by gender stereotypes" }
          - { id: "AC9HP10P01", level: "9-10", text: "analyse factors that shape identities and evaluate how individuals influence the identities of others" }
          - { id: "AC9HP10P02", level: "9-10", text: "refine, evaluate and adapt strategies for managing changes and transitions" }
          - { id: "AC9HP10P03", level: "9-10", text: "investigate how gender equality and challenging assumptions about gender can prevent violence and abuse in relationships" }
      - id: "HPE-P-IO"
        text: "Interacting with others"
        indicators:
          - { id: "AC9HPFP02", level: "F", text: "practise personal and social skills to interact respectfully with others" }
          - { id: "AC9HPFP03", level: "F", text: "express and describe emotions they experience" }
          - { id: "AC9HPFP04", level: "F", text: "explore how to seek, give or deny permission respectfully when sharing possessions or personal space" }
          - { id: "AC9HP2P02", level: "1-2", text: "identify and explore skills and strategies to develop respectful relationships" }
          - { id: "AC9HP2P03", level: "1-2", text: "identify how different situations influence emotional responses" }
          - { id: "AC9HP2P04", level: "1-2", text: "practise strategies they can use when they need to seek, give or deny permission respectfully" }
          - { id: "AC9HP4P04", level: "3-4", text: "select, use and refine personal and social skills to establish, manage and strengthen relationships" }
          - { id: "AC9HP4P05", level: "3-4", text: "describe how valuing diversity influences wellbeing and identify actions that promote inclusion in their communities" }
          - { id: "AC9HP4P06", level: "3-4", text: "explain how and why emotional responses can vary and practise strategies to manage their emotions" }
          - { id: "AC9HP4P07", level: "3-4", text: "rehearse and refine strategies for seeking, giving and denying permission respectfully and describe situations when permission is required" }
          - { id: "AC9HP6P04", level: "5-6", text: "describe and demonstrate how respect and empathy can be expressed to positively influence relationships" }
          - { id: "AC9HP6P05", level: "5-6", text: "describe and implement strategies to value diversity in their communities" }
          - { id: "AC9HP6P06", level: "5-6", text: "apply strategies to manage emotions and analyse how emotional responses influence interactions" }
          - { id: "AC9HP6P07", level: "5-6", text: "describe strategies for seeking, giving or denying consent and rehearse how to communicate their intentions effectively and respectfully" }
          - { id: "AC9HP8P04", level: "7-8", text: "examine the roles of respect, empathy, power and coercion in developing respectful relationships" }
          - { id: "AC9HP8P05", level: "7-8", text: "investigate strategies that influence how communities value diversity and propose actions they can take to promote inclusion in their communities" }
          - { id: "AC9HP8P06", level: "7-8", text: "analyse factors that influence emotional responses and devise strategies to self-manage emotions" }
          - { id: "AC9HP8P07", level: "7-8", text: "explain and apply skills and strategies to communicate assertively and respectfully when seeking, giving or denying consent" }
          - { id: "AC9HP10P04", level: "9-10", text: "evaluate the influence of respect, empathy, power and coercion on establishing and maintaining respectful relationships" }
          - { id: "AC9HP10P05", level: "9-10", text: "propose strategies and actions individuals and groups can implement to challenge biases, stereotypes, prejudices and discrimination, and promote inclusion in their communities" }
          - { id: "AC9HP10P06", level: "9-10", text: "evaluate emotional responses in different situations to refine strategies for managing emotions" }
          - { id: "AC9HP10P07", level: "9-10", text: "examine how strategies, such as communicating choices, seeking, giving and denying consent, and expressing opinions and needs can support the development of respectful relationships, including sexual relationships" }
      - id: "HPE-P-MHS"
        text: "Making healthy and safe choices"
        indicators:
          - { id: "AC9HPFP05", level: "F", text: "demonstrate protective behaviours, name body parts and rehearse help-seeking strategies that help keep them safe" }
          - { id: "AC9HPFP06", level: "F", text: "identify health symbols, messages and strategies in their community that support their health and safety" }
          - { id: "AC9HP2P05", level: "1-2", text: "identify and demonstrate protective behaviours and help-seeking strategies they can use to help them and others stay safe" }
          - { id: "AC9HP2P06", level: "1-2", text: "investigate a range of health messages and practices in their community and discuss their purposes" }
          - { id: "AC9HP4P08", level: "3-4", text: "describe and apply protective behaviours and help-seeking strategies in a range of online and offline situations" }
          - { id: "AC9HP4P09", level: "3-4", text: "interpret the nature and intention of health information and messages, and reflect on how they influence personal decisions and behaviours" }
          - { id: "AC9HP4P10", level: "3-4", text: "investigate and apply behaviours that contribute to their own and others’ health, safety, relationships and wellbeing" }
          - { id: "AC9HP6P08", level: "5-6", text: "analyse and rehearse protective behaviours and help-seeking strategies that can be used in a range of online and offline situations" }
          - { id: "AC9HP6P09", level: "5-6", text: "investigate different sources and types of health information and how these apply to their own and others’ health choices" }
          - { id: "AC9HP6P10", level: "5-6", text: "analyse how behaviours influence the health, safety, relationships and wellbeing of individuals and communities" }
          - { id: "AC9HP8P08", level: "7-8", text: "refine protective behaviours and evaluate community resources to seek help for themselves and others" }
          - { id: "AC9HP8P09", level: "7-8", text: "investigate how media and influential people impact attitudes, beliefs, decisions and behaviours in relation to health, safety, relationships and wellbeing" }
          - { id: "AC9HP8P10", level: "7-8", text: "plan and implement strategies, using health resources, to enhance their own and others’ health, safety, relationships and wellbeing" }
          - { id: "AC9HP10P08", level: "9-10", text: "plan, rehearse and evaluate strategies for managing situations where their own or others’ health, safety or wellbeing may be at risk" }
          - { id: "AC9HP10P09", level: "9-10", text: "critique health information, services and media messaging about relationships, lifestyle choices, health decisions and behaviours to evaluate their influence on individual attitudes and actions" }
          - { id: "AC9HP10P10", level: "9-10", text: "plan, justify and critique strategies to enhance their own and others’ health, safety, relationships and wellbeing" }
  - id: "HPE-M"
    title: "Movement and physical activity"
    standards:
      - id: "HPE-M-MOB"
        text: "Moving our bodies"
        indicators:
          - { id: "AC9HPFM01", level: "F", text: "practise fundamental movement skills in minor game and play situations" }
          - { id: "AC9HPFM02", level: "F", text: "experiment with different ways of moving their body safely and manipulating objects and space" }
          - { id: "AC9HP2M01", level: "1-2", text: "practise fundamental movement skills and apply them in a variety of movement situations" }
          - { id: "AC9HP2M02", level: "1-2", text: "investigate different ways of moving their body, and manipulating objects and space, and draw conclusions about their effectiveness" }
          - { id: "AC9HP4M01", level: "3-4", text: "refine and apply fundamental movement skills in new movement situations" }
          - { id: "AC9HP4M02", level: "3-4", text: "apply and adapt movement strategies to achieve movement outcomes" }
          - { id: "AC9HP4M03", level: "3-4", text: "demonstrate how movement concepts related to effort, space, time, objects and people can be applied when performing movement sequences" }
          - { id: "AC9HP6M01", level: "5-6", text: "adapt and modify movement skills across a variety of situations" }
          - { id: "AC9HP6M02", level: "5-6", text: "transfer familiar movement strategies to different movement situations" }
          - { id: "AC9HP6M03", level: "5-6", text: "investigate how different movement concepts related to effort, space, time, objects and people can be applied to improve movement outcomes" }
          - { id: "AC9HP8M01", level: "7-8", text: "analyse, refine and transfer movement skills in a variety of movement situations" }
          - { id: "AC9HP8M02", level: "7-8", text: "design and demonstrate how movement strategies can be manipulated to improve movement outcomes" }
          - { id: "AC9HP8M03", level: "7-8", text: "demonstrate and explain how movement concepts related to effort, space, time, objects and people can be manipulated to improve movement outcomes" }
          - { id: "AC9HP10M01", level: "9-10", text: "analyse, adapt and refine their own and others’ movement skills in a range of challenging movement situations to enhance performance" }
          - { id: "AC9HP10M02", level: "9-10", text: "create and refine movement strategies to achieve successful outcomes across a range of challenging movement situations" }
          - { id: "AC9HP10M03", level: "9-10", text: "apply movement concepts in new or challenging movement situations and analyse the impact each concept has on movement outcomes" }
      - id: "HPE-M-MAC"
        text: "Making active choices"
        indicators:
          - { id: "AC9HPFM03", level: "F", text: "participate in a range of activities in natural and outdoor settings and explore the benefits of being physically active" }
          - { id: "AC9HP2M03", level: "1-2", text: "participate in a range of physical activities in natural and outdoor settings, and investigate factors and settings that make physical activity enjoyable" }
          - { id: "AC9HP4M04", level: "3-4", text: "participate in physical activities to explore how their body feels and describe how regular physical activity helps the body stay healthy and well" }
          - { id: "AC9HP4M05", level: "3-4", text: "participate in physical activities in natural and outdoor settings to examine factors that can influence their own and others’ participation" }
          - { id: "AC9HP4M06", level: "3-4", text: "explore recommendations about physical activity and sedentary behaviours, and discuss strategies to achieve the recommendations" }
          - { id: "AC9HP6M04", level: "5-6", text: "participate in physical activities to investigate the body’s reaction to different levels of intensity" }
          - { id: "AC9HP6M05", level: "5-6", text: "participate in physical activities that enhance health and wellbeing in natural and outdoor settings, and analyse the steps and resources needed to promote participation" }
          - { id: "AC9HP6M06", level: "5-6", text: "propose and explain strategies to increase physical activity and reduce sedentary behaviour levels in their lives" }
          - { id: "AC9HP8M04", level: "7-8", text: "participate in physical activities designed to improve fitness and wellbeing to investigate the impact of regular participation on health, fitness and wellbeing" }
          - { id: "AC9HP8M05", level: "7-8", text: "participate in physical activities that utilise community spaces and outdoor settings, and evaluate strategies to support increased use of these spaces" }
          - { id: "AC9HP8M06", level: "7-8", text: "design and justify strategies to increase physical activity levels to achieve health and wellbeing outcomes" }
          - { id: "AC9HP10M04", level: "9-10", text: "participate in physical activities designed to enhance health, wellbeing and fitness, and design, apply and evaluate strategies for incorporating these activities into their lives" }
          - { id: "AC9HP10M05", level: "9-10", text: "participate in physical activities that promote health and social outcomes to design and evaluate participation strategies for themselves and others" }
          - { id: "AC9HP10M06", level: "9-10", text: "design, implement and evaluate personalised plans for improving or maintaining their own or others’ physical activity levels to achieve fitness, health and wellbeing outcomes" }
      - id: "HPE-M-LTM"
        text: "Learning through movement"
        indicators:
          - { id: "AC9HPFM04", level: "F", text: "follow rules to promote fair play in a range of physical activities" }
          - { id: "AC9HP2M04", level: "1-2", text: "co-construct and apply rules to promote fair play in a range of physical activities" }
          - { id: "AC9HP2M05", level: "1-2", text: "apply strategies to work collaboratively when participating in physical activities" }
          - { id: "AC9HP4M07", level: "3-4", text: "apply creative thinking when designing movement sequences and solving movement problems" }
          - { id: "AC9HP4M08", level: "3-4", text: "apply rules and scoring systems to promote fair play when participating or designing physical activities" }
          - { id: "AC9HP4M09", level: "3-4", text: "perform a range of roles in respectful ways to achieve successful outcomes in group or team movement activities" }
          - { id: "AC9HP6M07", level: "5-6", text: "predict and test the effectiveness of applying different skills and strategies in a range of movement situations" }
          - { id: "AC9HP6M08", level: "5-6", text: "devise and test alternative rules and game modifications to support fair play and inclusive participation" }
          - { id: "AC9HP6M09", level: "5-6", text: "participate positively in groups and teams by contributing to group activities, encouraging others and negotiating roles and responsibilities" }
          - { id: "AC9HP8M07", level: "7-8", text: "propose and evaluate movement strategies and skills that would be most effective in different movement situations" }
          - { id: "AC9HP8M08", level: "7-8", text: "investigate modifications to equipment, rules and scoring systems that support fair play and inclusive participation" }
          - { id: "AC9HP8M09", level: "7-8", text: "practise and apply leadership, collaboration and group decision-making processes when participating in a range of physical activities" }
          - { id: "AC9HP10M07", level: "9-10", text: "transfer and adapt skills and strategies from previous experiences to create successful outcomes in unfamiliar movement situations" }
          - { id: "AC9HP10M08", level: "9-10", text: "demonstrate fair play and reflect on how ethical behaviour can influence physical activity outcomes for individuals and groups" }
          - { id: "AC9HP10M09", level: "9-10", text: "devise, implement and refine strategies for decision-making when working in groups or teams that demonstrate leadership and collaboration skills" }
