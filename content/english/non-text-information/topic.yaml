id: english.reading.non-text-information
subject: english
title: { th: "อ่านและสร้างภาพ แผนผัง แผนภูมิ และตาราง", en: "Reading and making signs, charts, graphs and tables" }
summary: อ่านป้าย สัญลักษณ์ แผนภูมิแท่ง แผนภูมิวงกลม กราฟเส้น และตาราง แล้วเลือกหรือเขียนประโยคให้ตรง และสร้างตารางหรือแผนภูมิจากข้อความ
difficulty: 3
minutes: 35
prerequisites: [english.vocabulary.self-family-numbers, english.grammar.adjectives-comparison]
encompasses:
  - { id: english.vocabulary.self-family-numbers, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: fruit-chart.svg
    alt: "แผนภูมิแท่งชื่อ Our Favourite Fruit (Class P.5/2) แกนตั้ง Number of students 0 ถึง 14 แกนนอนเป็นผลไม้ mango 12 คน banana 8 คน rambutan 6 คน durian 5 คน watermelon 3 คน"
    caption: "แผนภูมิแท่ง: ผลไม้ที่นักเรียนชอบ"
  - { type: check, problem: english.reading.non-text-information.p005, prompt: "more ... than หาผลต่างอย่างไร" }
  - type: figure
    src: rainfall-graph.svg
    alt: "กราฟเส้นชื่อ Rainfall at Our School Weather Station แกนตั้ง Rainfall (mm) 0 ถึง 300 ค่ารายเดือน May 150, Jun 120, Jul 140, Aug 180, Sep 260, Oct 200 เป็นข้อมูลตัวอย่าง"
    caption: "กราฟเส้น: ปริมาณฝนรายเดือน (ข้อมูลสมมุติ)"
  - type: worked-example
    title: อ่านตารางเวลารถ
    problem: "ดูตารางเวลารถจากกรุงเทพฯ (หมอชิต) ไปเชียงใหม่ในโจทย์ท้ายบท รถคันที่ 2 ออก 10:30 ถึง 21:00 ใช้เวลาเดินทางกี่ชั่วโมง เขียนเป็นประโยคภาษาอังกฤษ"
    steps:
      - text: "หาแถวของ Bus 2: Departs 10:30, Arrives 21:00"
      - text: "นับจาก 10:30 ถึง 20:30 ได้ 10 ชั่วโมง ต่ออีกถึง 21:00 ได้ 30 นาที รวม 10 ชั่วโมงครึ่ง"
        why: "30 นาทีคือครึ่งชั่วโมง จึงเท่ากับ 10.5 ชั่วโมง ไม่ใช่ 10.3"
      - text: "เขียนประโยค: *The journey takes ten and a half hours.*"
    answer: "10.5 ชั่วโมง (*ten and a half hours*)"
  - { type: check, problem: english.reading.non-text-information.p012, prompt: "เส้นขึ้นใช้กริยาอะไร" }
glossary:
  - { term: bar chart, definition: "แผนภูมิแท่ง เปรียบเทียบจำนวนของหลายกลุ่ม (อเมริกันเรียก bar graph ได้)" }
  - { term: pie chart, definition: "แผนภูมิวงกลม แสดงส่วนของทั้งหมด" }
  - { term: line graph, definition: "กราฟเส้น แสดงการเปลี่ยนแปลงตามเวลา" }
  - { term: "row / column", definition: "แถว (แนวนอน) / คอลัมน์ (แนวตั้ง) ของตาราง" }
  - { term: "key / legend", definition: "คำอธิบายสีหรือสัญลักษณ์ในแผนภูมิ" }
flashcards:
  - { front: "วงกลมแดงขีดทับบนป้ายหมายถึง", back: "ห้ามทำสิ่งนั้น (No ...)" }
  - { front: "เพิ่ม / ลด (แนวโน้มในกราฟ)", back: "increase, go up, rise / decrease, go down, fall" }
  - { front: "a quarter / half", back: "หนึ่งในสี่ / ครึ่งหนึ่ง" }
  - { front: "row vs column", back: "แถวแนวนอน vs คอลัมน์แนวตั้ง" }
  - { front: "Lift (UK) = ? (US)", back: "Elevator" }
references:
  - { title: "Bar chart", url: "https://en.wikipedia.org/wiki/Bar_chart", source: wikipedia-en, lang: en, license: CC-BY-SA-4.0 }
  - { title: "Pie chart", url: "https://en.wikipedia.org/wiki/Pie_chart", source: wikipedia-en, lang: en, license: CC-BY-SA-4.0 }
  - { title: "Pictogram", url: "https://en.wikipedia.org/wiki/Pictogram", source: wikipedia-en, lang: en, license: CC-BY-SA-4.0 }
  - { title: "Timetable", url: "https://en.wikipedia.org/wiki/Timetable", source: wikipedia-en, lang: en, license: CC-BY-SA-4.0 }
