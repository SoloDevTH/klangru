<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="sans-serif">
<title>ประโยคสามัญ ประโยครวม และประโยคซ้อน</title>
<rect x="0" y="0" width="860" height="470" fill="#fff"/>
<text x="20.0" y="40.0" font-size="20" text-anchor="start" fill="#222" font-weight="bold">ประโยคสามัญ (ความเดียว): ภาคประธาน + ภาคแสดง</text>
<rect x="40.0" y="56.0" width="220.0" height="46.0" rx="8" fill="#e8f0fb" stroke="#1f5fbf" stroke-width="2.5"/>
<text x="150.0" y="87.0" font-size="22" text-anchor="middle" fill="#111" font-weight="bold">เด็ก ๆ</text>
<rect x="270.0" y="56.0" width="300.0" height="46.0" rx="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="2.5"/>
<text x="420.0" y="87.0" font-size="22" text-anchor="middle" fill="#111" font-weight="bold">เล่นฟุตบอลที่สนาม</text>
<text x="150.0" y="124.0" font-size="16" text-anchor="middle" fill="#1f5fbf" font-weight="normal">ภาคประธาน</text>
<text x="420.0" y="124.0" font-size="16" text-anchor="middle" fill="#1e8449" font-weight="normal">ภาคแสดง</text>
<text x="20.0" y="178.0" font-size="20" text-anchor="start" fill="#222" font-weight="bold">ประโยครวม: ประโยคสามัญ 2 ประโยค + คำสันธาน</text>
<rect x="40.0" y="194.0" width="230.0" height="46.0" rx="8" fill="#f3f3f3" stroke="#555" stroke-width="2.5"/>
<text x="155.0" y="225.0" font-size="22" text-anchor="middle" fill="#111" font-weight="bold">ฝนตกหนัก</text>
<rect x="285.0" y="194.0" width="90.0" height="46.0" rx="8" fill="#fdf2e3" stroke="#b9770e" stroke-width="2.5"/>
<text x="330.0" y="225.0" font-size="22" text-anchor="middle" fill="#111" font-weight="bold">แต่</text>
<rect x="390.0" y="194.0" width="300.0" height="46.0" rx="8" fill="#f3f3f3" stroke="#555" stroke-width="2.5"/>
<text x="540.0" y="225.0" font-size="22" text-anchor="middle" fill="#111" font-weight="bold">เด็ก ๆ ยังเล่นฟุตบอล</text>
<text x="155.0" y="262.0" font-size="16" text-anchor="middle" fill="#555" font-weight="normal">ประโยคที่ 1</text>
<text x="330.0" y="262.0" font-size="16" text-anchor="middle" fill="#b9770e" font-weight="normal">สันธาน</text>
<text x="540.0" y="262.0" font-size="16" text-anchor="middle" fill="#555" font-weight="normal">ประโยคที่ 2</text>
<text x="20.0" y="316.0" font-size="20" text-anchor="start" fill="#222" font-weight="bold">ประโยคซ้อน: ประโยคหลัก + ประโยคย่อยที่ซ้อนอยู่ข้างใน</text>
<rect x="30.0" y="330.0" width="800.0" height="90.0" rx="10" fill="#eef2f7" stroke="#1f5fbf" stroke-width="2.5"/>
<rect x="50.0" y="352.0" width="110.0" height="46.0" rx="8" fill="#fff" stroke="#1f5fbf" stroke-width="2.5"/>
<text x="105.0" y="383.0" font-size="22" text-anchor="middle" fill="#111" font-weight="bold">เด็ก ๆ</text>
<rect x="175.0" y="352.0" width="260.0" height="46.0" rx="8" fill="#fdf2e3" stroke="#b9770e" stroke-width="2.5"/>
<text x="305.0" y="383.0" font-size="22" text-anchor="middle" fill="#111" font-weight="bold">ที่ชอบออกกำลังกาย</text>
<rect x="450.0" y="352.0" width="360.0" height="46.0" rx="8" fill="#fff" stroke="#1f5fbf" stroke-width="2.5"/>
<text x="630.0" y="383.0" font-size="22" text-anchor="middle" fill="#111" font-weight="bold">มักนอนหลับสบาย</text>
<text x="305.0" y="440.0" font-size="16" text-anchor="middle" fill="#b9770e" font-weight="normal">ประโยคย่อย (ขยาย เด็ก ๆ)</text>
<text x="630.0" y="440.0" font-size="16" text-anchor="middle" fill="#1f5fbf" font-weight="normal">ประโยคหลัก: เด็ก ๆ มักนอนหลับสบาย</text>
</svg>
