<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" font-family="sans-serif" font-size="14">
<title>ครอสซิงโอเวอร์ระหว่างยีน B และ C ของโฮโมโลกัสโครโมโซมคู่หนึ่ง ทำให้เกิดแกมีตสองชนิดที่เป็นรีคอมบิแนนท์</title>
<rect x="0" y="0" width="820" height="380" fill="#ffffff"/>
<text x="205" y="32" text-anchor="middle" font-weight="bold" fill="#263238">โพรเฟส I: โครโมโซมคู่เหมือนจับคู่กัน</text>
<line x1="150" y1="60" x2="150" y2="320" stroke="#1565c0" stroke-width="8" stroke-linecap="round"/>
<line x1="260" y1="60" x2="260" y2="320" stroke="#c62828" stroke-width="8" stroke-linecap="round"/>
<circle cx="150" cy="110" r="5" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
<circle cx="260" cy="110" r="5" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
<text x="128" y="115" text-anchor="end" fill="#1565c0" font-weight="bold">A</text>
<text x="282" y="115" fill="#c62828" font-weight="bold">a</text>
<circle cx="150" cy="190" r="5" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
<circle cx="260" cy="190" r="5" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
<text x="128" y="195" text-anchor="end" fill="#1565c0" font-weight="bold">B</text>
<text x="282" y="195" fill="#c62828" font-weight="bold">b</text>
<circle cx="150" cy="270" r="5" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
<circle cx="260" cy="270" r="5" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
<text x="128" y="275" text-anchor="end" fill="#1565c0" font-weight="bold">C</text>
<text x="282" y="275" fill="#c62828" font-weight="bold">c</text>
<line x1="150" y1="208" x2="260" y2="252" stroke="#37474f" stroke-width="2.5" stroke-dasharray="6 4"/>
<line x1="260" y1="208" x2="150" y2="252" stroke="#37474f" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="205" y="235.0" text-anchor="middle" fill="#37474f" font-size="12" font-weight="bold" stroke="#ffffff" stroke-width="4" paint-order="stroke">จุดครอสซิงโอเวอร์</text>
<line x1="430" y1="80" x2="430" y2="240.0" stroke="#1565c0" stroke-width="10" stroke-linecap="round"/>
<line x1="430" y1="240.0" x2="430" y2="300" stroke="#1565c0" stroke-width="10" stroke-linecap="round"/>
<text x="430" y="325" text-anchor="middle" font-weight="bold" fill="#263238">ABC</text>
<text x="430" y="345" text-anchor="middle" fill="#2e7d32" font-size="12">พ่อแม่</text>
<line x1="540" y1="80" x2="540" y2="240.0" stroke="#1565c0" stroke-width="10" stroke-linecap="round"/>
<line x1="540" y1="240.0" x2="540" y2="300" stroke="#c62828" stroke-width="10" stroke-linecap="round"/>
<text x="540" y="325" text-anchor="middle" font-weight="bold" fill="#263238">ABc</text>
<text x="540" y="345" text-anchor="middle" fill="#ef6c00" font-size="12">รีคอมบิแนนท์</text>
<line x1="650" y1="80" x2="650" y2="240.0" stroke="#c62828" stroke-width="10" stroke-linecap="round"/>
<line x1="650" y1="240.0" x2="650" y2="300" stroke="#1565c0" stroke-width="10" stroke-linecap="round"/>
<text x="650" y="325" text-anchor="middle" font-weight="bold" fill="#263238">abC</text>
<text x="650" y="345" text-anchor="middle" fill="#ef6c00" font-size="12">รีคอมบิแนนท์</text>
<line x1="760" y1="80" x2="760" y2="240.0" stroke="#c62828" stroke-width="10" stroke-linecap="round"/>
<line x1="760" y1="240.0" x2="760" y2="300" stroke="#c62828" stroke-width="10" stroke-linecap="round"/>
<text x="760" y="325" text-anchor="middle" font-weight="bold" fill="#263238">abc</text>
<text x="760" y="345" text-anchor="middle" fill="#2e7d32" font-size="12">พ่อแม่</text>
<text x="595" y="48" text-anchor="middle" font-weight="bold" fill="#263238">แกมีตที่เกิดหลังไมโอซิส (สีบอกที่มาของยีน)</text>
<text x="20" y="366" fill="#555" font-size="12">สีน้ำเงินมาจากโครโมโซมแม่ สีแดงมาจากโครโมโซมพ่อ ภาพเป็นแผนภาพวาดโดยทีมคลังรู้</text>
</svg>