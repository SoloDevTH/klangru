id: biology.animals.reproduction-development
subject: biology
title: { th: การสืบพันธุ์และการเจริญเติบโตของสัตว์, en: "Animal reproduction and development" }
summary: การสืบพันธุ์แบบไม่อาศัยเพศและอาศัยเพศของสัตว์ ระบบสืบพันธุ์ของมนุษย์ การสร้างสเปิร์มและเซลล์ไข่ การปฏิสนธิ และการเจริญเติบโตระยะเอ็มบริโอและหลังเอ็มบริโอของกบ ไก่ และมนุษย์
difficulty: 5.5
minutes: 50
prerequisites: [biology.cells.cell-division, biology.humans.reproductive-system]
encompasses:
  - { id: biology.cells.cell-division, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: การสร้างสเปิร์มและเซลล์ไข่
    src: gametogenesis.svg
    alt: "แผนภาพสองฝั่ง ฝั่งซ้ายการสร้างสเปิร์มในอัณฑะ สเปอร์มาโทโกเนียม 2n แบ่งไมโทซิสและเติบโตเป็นสเปอร์มาโทไซต์ระยะแรก 2n ไมโอซิส I ได้สเปอร์มาโทไซต์ระยะที่สอง 2 เซลล์ n ไมโอซิส II ได้สเปอร์มาทิด 4 เซลล์ n แล้วเปลี่ยนรูปเป็นสเปิร์ม 4 ตัว n = 23 ฝั่งขวาการสร้างเซลล์ไข่ในรังไข่ โอโอโกเนียม 2n แบ่งไมโทซิสตั้งแต่ก่อนเกิด เป็นโอโอไซต์ระยะแรก 2n ซึ่งหยุดที่โพรเฟส I จนเข้าวัยเจริญพันธุ์ ไมโอซิส I ได้โอโอไซต์ระยะที่สองขนาดใหญ่ n กับโพลาร์บอดีที่ 1 ขนาดเล็ก โอโอไซต์ระยะที่สองถูกปล่อยออกมาเมื่อตกไข่และหยุดที่เมทาเฟส II ไมโอซิส II เกิดเมื่อสเปิร์มเข้าไป ได้เซลล์ไข่ 1 เซลล์ n = 23 กับโพลาร์บอดีที่ 2 โพลาร์บอดีทั้งหมดสลายไป"
    caption: "สเปิร์ม 4 ตัวต่อหนึ่งเซลล์ตั้งต้น แต่เซลล์ไข่เพียง 1 เซลล์ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: นับเซลล์สืบพันธุ์จากเซลล์ตั้งต้น
    problem: "สเปอร์มาโทไซต์ระยะแรก 25 เซลล์ และโอโอไซต์ระยะแรก 25 เซลล์ แบ่งไมโอซิสจนเสร็จ จะได้สเปิร์มและเซลล์ไข่อย่างละกี่เซลล์"
    steps:
      - text: "สเปอร์มาโทไซต์ระยะแรก 1 เซลล์ได้สเปิร์ม 4 ตัว จึงได้ $25 \\times 4 = 100$ ตัว"
      - text: "โอโอไซต์ระยะแรก 1 เซลล์ได้เซลล์ไข่ 1 เซลล์ จึงได้ 25 เซลล์"
        why: "ไซโทพลาซึมแบ่งไม่เท่ากัน เซลล์ที่เหลือเป็นโพลาร์บอดีที่สลายไป"
    answer: "สเปิร์ม 100 ตัว เซลล์ไข่ 25 เซลล์"
  - { type: check, problem: biology.animals.reproduction-development.p005, prompt: "จำนวนโครโมโซมลดลงในไมโอซิสครั้งใด" }
  - type: figure
    title: การเจริญเติบโตของกบ
    src: frog-development.svg
    alt: "ระยะการเจริญเติบโตของกบ แถวบนจากซ้ายไปขวา ไซโกตซึ่งมีไข่แดงสีเข้มด้านล่าง 2 เซลล์ 4 เซลล์ 8 เซลล์ มอรูลา และบลาสทูลาซึ่งเป็นภาพตัดมีช่องกลวง กำกับว่าคลีเวจทำให้จำนวนเซลล์เพิ่มแต่ขนาดรวมเกือบเท่าเดิม จากนั้นแกสทรูลาที่มีรอยบุ๋มและเกิดเนื้อเยื่อ 3 ชั้น แถวล่างจากขวาไปซ้าย นิวรูลาที่เริ่มสร้างหลอดประสาท ลูกอ๊อดที่หายใจด้วยเหงือก ลูกกบที่ขางอกและหางหด และกบที่หายใจด้วยปอด ระยะหลังเอ็มบริโอเป็นเมทามอร์โฟซิสที่ควบคุมโดยไทรอกซิน"
    caption: "แผนภาพอย่างง่าย ไม่ได้วาดตามสัดส่วนจริง (วาดโดยทีมคลังรู้)"
  - type: figure
    title: เยื่อหุ้มเอ็มบริโอของไก่
    src: chick-membranes.svg
    alt: "ภาพตัดไข่ไก่ระหว่างฟัก เอ็มบริโออยู่ในแอมเนียนซึ่งมีของเหลวกันกระแทก แอลแลนทอยส์เป็นถุงด้านบนขวาที่ต่อจากเอ็มบริโอ ใช้เก็บกรดยูริกและแลกเปลี่ยนแก๊ส ถุงไข่แดงล้อมไข่แดงด้านล่างใช้เก็บอาหาร คอเรียนเป็นเยื่อชั้นนอกสุดใต้เปลือก แลกเปลี่ยนแก๊สผ่านเปลือก"
    caption: "แผนภาพอย่างง่าย ไม่ได้วาดตามสัดส่วนจริง (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ติดตามจำนวนโครโมโซมจากเซลล์ตั้งต้นถึงไซโกต
    problem: "ไก่มีโครโมโซม 2n = 78 จงหาจำนวนโครโมโซมในสเปอร์มาโทไซต์ระยะแรก สเปิร์ม เซลล์ไข่ และไซโกตของไก่"
    steps:
      - text: "สเปอร์มาโทไซต์ระยะแรกยังไม่ผ่านไมโอซิส จึงมี 2n = 78 แท่ง"
      - text: "สเปิร์มและเซลล์ไข่ผ่านไมโอซิสแล้ว มี n = $78 \\div 2 = 39$ แท่ง"
      - text: "ไซโกตเกิดจากสเปิร์มรวมกับเซลล์ไข่ $39 + 39 = 78$ แท่ง"
        why: "การปฏิสนธิคืนจำนวนโครโมโซมกลับเป็น 2n ทุกรุ่น"
    answer: "78, 39, 39, 78 แท่ง ตามลำดับ"
  - { type: check, problem: biology.animals.reproduction-development.p012, prompt: "ปัญหาใหญ่ของเอ็มบริโอบนบกคืออะไร" }
glossary:
  - { term: พาร์ทีโนเจเนซิส, definition: "การที่ไข่เจริญเป็นตัวโดยไม่ได้รับการผสม เช่น ผึ้งตัวผู้" }
  - { term: โพลาร์บอดี, definition: "เซลล์ขนาดเล็กที่ได้จากไมโอซิสของการสร้างเซลล์ไข่ มีโครโมโซมแต่มีไซโทพลาซึมน้อยและสลายไป" }
  - { term: อะโครโซม, definition: "ถุงที่ส่วนหัวของสเปิร์ม มีเอนไซม์ย่อยชั้นที่หุ้มเซลล์ไข่" }
  - { term: คลีเวจ, definition: "การแบ่งเซลล์แบบไมโทซิสอย่างรวดเร็วของไซโกตโดยเซลล์ไม่โตขึ้น" }
  - { term: แกสทรูลา, definition: "ระยะที่เซลล์เคลื่อนที่จนเกิดเนื้อเยื่อชั้นต้นกำเนิด 3 ชั้น" }
  - { term: เนื้อเยื่อชั้นต้นกำเนิด, definition: "เอกโทเดิร์ม มีโซเดิร์ม และเอนโดเดิร์ม ซึ่งเจริญเป็นอวัยวะต่าง ๆ" }
  - { term: แอมเนียน, definition: "เยื่อหุ้มเอ็มบริโอที่มีของเหลวล้อมเอ็มบริโอ กันกระแทกและกันแห้ง" }
  - { term: เมทามอร์โฟซิส, definition: "การเปลี่ยนรูปร่างในระยะหลังเอ็มบริโอ เช่น ลูกอ๊อดเป็นกบ" }
flashcards:
  - { front: "สเปอร์มาโทไซต์ระยะแรก 1 เซลล์ กับโอโอไซต์ระยะแรก 1 เซลล์ ให้อะไร", back: "สเปิร์ม 4 ตัว กับเซลล์ไข่ 1 เซลล์และโพลาร์บอดี" }
  - { front: "เซลล์ที่ตกจากรังไข่คืออะไร หยุดที่ระยะใด", back: "โอโอไซต์ระยะที่สอง หยุดที่เมทาเฟส II จนสเปิร์มเข้าไป" }
  - { front: "ลำดับระยะเอ็มบริโอ", back: "ไซโกต คลีเวจ มอรูลา บลาสทูลา แกสทรูลา การสร้างอวัยวะ" }
  - { front: "เนื้อเยื่อ 3 ชั้นเจริญเป็นอะไร", back: "เอกโทเดิร์ม ผิวหนังและระบบประสาท มีโซเดิร์ม กล้ามเนื้อ กระดูก หัวใจ เอนโดเดิร์ม เยื่อบุทางเดินอาหาร ปอด" }
  - { front: "เยื่อหุ้มเอ็มบริโอของไก่ 4 ชนิด", back: "แอมเนียน ถุงไข่แดง แอลแลนทอยส์ คอเรียน" }
