problems:
- id: thai.composition.summary-writing.p001
  topics:
  - thai.composition.summary-writing
  difficulty: 1
  type: mcq
  stem: ข้อใดบอกความหมายของ **ย่อความ** ได้ถูกต้องที่สุด
  choices:
  - id: a
    text: คัดลอกประโยคแรกของทุกย่อหน้ามาต่อกัน
    feedback: ประโยคแรกอาจไม่ใช่ใจความ และต้องเรียบเรียงใหม่
  - id: b
    text: เขียนความคิดเห็นของเราต่อเรื่องที่อ่าน
    feedback: เป็นการวิจารณ์ ไม่ใช่ย่อความ
  - id: c
    text: เขียนเรื่องให้สั้นลง โดยใจความสำคัญยังครบและความหมายไม่เปลี่ยน
    correct: true
    feedback: ถูก
  - id: d
    text: เขียนเรื่องให้ยาวขึ้นและสนุกกว่าเดิม
    feedback: เป็นการขยายความ ตรงข้ามกับย่อความ
  hints:
  - ย่อ แปลว่าทำให้สั้น
  - สั้นลงแล้ว อะไรต้องคงไว้
  solution: ย่อความคือเขียนให้ **สั้นลง** แต่ **ใจความครบ** และความหมายเหมือนเดิม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.summary-writing.p002
  topics:
  - thai.composition.summary-writing
  difficulty: 1
  type: mcq
  stem: สิ่งใด **ไม่ควร** อยู่ในย่อความ
  choices:
  - id: a
    text: ใจความสำคัญของเรื่อง
    feedback: ต้องมี เป็นหัวใจของย่อความ
  - id: b
    text: ความคิดเห็นของผู้ย่อ เช่น "เรื่องนี้ดีมาก"
    correct: true
    feedback: ถูก ย่อความเล่าสิ่งที่เรื่องเดิมบอกเท่านั้น
  - id: c
    text: คำนำที่บอกว่าย่อมาจากเรื่องใด
    feedback: ต้องมี
  - id: d
    text: ผลหรือตอนจบของเรื่อง
    feedback: เป็นใจความ ต้องมี
  hints:
  - ย่อความต่างจากการวิจารณ์อย่างไร
  - ใครเป็นเจ้าของความคิดในย่อความ
  solution: ไม่ใส่ **ความคิดเห็นของผู้ย่อ** ย่อความเล่าเฉพาะสิ่งที่เรื่องเดิมบอก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.summary-writing.p003
  topics:
  - thai.composition.summary-writing
  difficulty: 2
  type: order
  stem: เรียงขั้นตอนการย่อความให้ถูกลำดับ
  items:
  - อ่านเรื่องทั้งหมดให้จบ
  - หาใจความสำคัญทีละย่อหน้า
  - ตัดรายละเอียดที่ไม่จำเป็น
  - เรียบเรียงใหม่ด้วยสำนวนของตน
  - เขียนคำนำแล้วตรวจทาน
  hints:
  - ต้องรู้ทั้งเรื่องก่อน
  - ตรวจทานเป็นขั้นสุดท้าย
  solution: อ่านให้จบ → หาใจความ → ตัดส่วนเกิน → เรียบเรียงใหม่ → คำนำและตรวจทาน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.summary-writing.p004
  topics:
  - thai.composition.summary-writing
  difficulty: 2
  type: match
  stem: จับคู่ประเภทของเรื่องกับคำนำย่อความ
  pairs:
  - left: จดหมาย
    right: ย่อจดหมายของ... ถึง... ลงวันที่... ความว่า
  - left: ประกาศ
    right: ย่อประกาศของ... เรื่อง... ลงวันที่... ความว่า
  - left: สุนทรพจน์
    right: ย่อสุนทรพจน์ของ... แสดงแก่... ที่... เมื่อ... ความว่า
  - left: ข่าว
    right: ย่อข่าวเรื่อง... จาก... ฉบับวันที่... ความว่า
  hints:
  - จดหมายมีผู้ส่งและผู้รับ
  - สุนทรพจน์มีผู้ฟังและสถานที่
  solution: จดหมาย บอก ของ...ถึง... · ประกาศ บอกเรื่องและวันที่ · สุนทรพจน์ บอกผู้ฟัง ที่ เมื่อ · ข่าว บอกแหล่งและฉบับวันที่
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.summary-writing.p005
  topics:
  - thai.composition.summary-writing
  difficulty: 2
  type: mcq
  stem: 'เรื่องเดิม: แม่พูดว่า "ลูกต้องกลับถึงบ้านก่อนหกโมงเย็นนะ" ข้อใดเขียนในย่อความได้ถูกต้อง'
  choices:
  - id: a
    text: แม่พูดว่า "ลูกต้องกลับถึงบ้านก่อนหกโมงเย็นนะ"
    feedback: ย่อความไม่ใช้เครื่องหมายอัญประกาศ
  - id: b
    text: แม่บอกว่า ลูกต้องกลับถึงบ้านก่อนหกโมงเย็นนะ
    feedback: ยังคงคำพูดเดิมและคำลงท้าย นะ
  - id: c
    text: แม่สั่งให้ลูกกลับถึงบ้านก่อนหกโมงเย็น
    correct: true
    feedback: ถูก เปลี่ยนคำพูดเป็นคำบอกเล่า
  - id: d
    text: แม่ใจดีมากที่เตือนลูก
    feedback: เพิ่มความเห็นของผู้ย่อ และไม่บอกว่าเตือนเรื่องอะไร
  hints:
  - ย่อความไม่ใช้อัญประกาศ
  - เปลี่ยนเป็นประโยคเล่าว่าแม่ทำอะไร
  solution: 'เปลี่ยนคำพูดเป็นคำบอกเล่า: **แม่สั่งให้ลูกกลับถึงบ้านก่อนหกโมงเย็น**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.summary-writing.p006
  topics:
  - thai.composition.summary-writing
  difficulty: 2
  type: text
  stem: ย่อความห้ามใช้อักษรย่อ ประโยค "นักเรียน ร.ร. บ้านสวนไปทัศนศึกษา" ต้องเขียน **ร.ร.** ว่าอย่างไร (พิมพ์คำเต็ม)
  accepted:
  - โรงเรียน
  misconceptions:
  - match: รร
    feedback: ยังเป็นอักษรย่อ ต้องเขียนเต็ม
  hints:
  - ร.ร. ย่อมาจากคำที่นักเรียนเห็นทุกวัน
  - สถานที่ที่นักเรียนไปเรียน
  solution: ร.ร. เขียนเต็มว่า **โรงเรียน**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.summary-writing.p007
  topics:
  - thai.composition.summary-writing
  difficulty: 3
  type: mcq
  stem: อ่านบทความในภาพ ใจความสำคัญของ **ย่อหน้า (1)** คืออะไร
  figure:
    src: crab-article.svg
    alt: บทความสมมติ ธนาคารปูม้าของบ้านอ่าวใส โดยชนิดา ทะเลงาม จากจดหมายข่าวรักษ์ทะเล ฉบับเดือนมิถุนายน 2569 มี 3 ย่อหน้า (1) เมื่อสิบปีก่อน ชาวประมงบ้านอ่าวใสจับปูม้าได้น้อยลงทุกปี บางวันออกเรือตั้งแต่ตีสี่ กลับมาตอนเที่ยงได้ปูไม่ถึงครึ่งกิโลกรัม ทั้งที่เมื่อก่อนเคยได้วันละหลายกิโลกรัม สาเหตุสำคัญคือแม่ปูที่มีไข่นอกกระดองถูกจับไปขายก่อนจะได้วางไข่ (2) ชาวบ้านจึงร่วมกันตั้งธนาคารปูม้า ใครจับแม่ปูไข่นอกกระดองได้ ให้นำมาฝากไว้ในกระชังของธนาคารจนแม่ปูปล่อยไข่ แล้วจึงนำแม่ปูไปขายได้ตามเดิม ลูกปูที่ฟักออกมาจะถูกปล่อยคืนสู่ทะเล (3) ห้าปีต่อมา ชาวประมงจับปูได้มากขึ้นจนมีรายได้พอส่งลูกเรียนหนังสือ ลุงสมพรซึ่งเป็นประธานกลุ่มเล่าว่า "ปีนี้เรือของผมได้ปูวันละสามถึงสี่กิโลกรัม" ธนาคารปูม้าจึงแสดงให้เห็นว่า การจับสัตว์น้ำอย่างรู้คุณค่าทำให้ทะเลมีอาหารเหลือไว้ให้คนรุ่นหลัง
  choices:
  - id: a
    text: ชาวประมงจับปูม้าได้น้อยลง เพราะแม่ปูไข่ถูกจับก่อนวางไข่
    correct: true
    feedback: ถูก บอกทั้งปัญหาและสาเหตุ
  - id: b
    text: ชาวประมงออกเรือตั้งแต่ตีสี่
    feedback: เป็นรายละเอียดที่ช่วยให้เห็นภาพ
  - id: c
    text: ชาวประมงได้ปูไม่ถึงครึ่งกิโลกรัม
    feedback: เป็นตัวอย่างของปัญหา ไม่ใช่ใจความทั้งหมด
  - id: d
    text: ชาวบ้านตั้งธนาคารปูม้า
    feedback: อยู่ในย่อหน้า (2)
  hints:
  - ย่อหน้านี้บอกปัญหาอะไรและเพราะอะไร
  - ตัวเลขและเวลาเป็นรายละเอียด
  solution: ใจความคือ **ปูน้อยลงเพราะแม่ปูไข่ถูกจับก่อนวางไข่** ตีสี่และครึ่งกิโลกรัมเป็นรายละเอียด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.summary-writing.p008
  topics:
  - thai.composition.summary-writing
  difficulty: 3
  type: mcq
  stem: อ่านบทความในภาพ ส่วนใด **ตัดออกได้** เมื่อเขียนย่อความ
  figure:
    src: crab-article.svg
    alt: บทความสมมติ ธนาคารปูม้าของบ้านอ่าวใส โดยชนิดา ทะเลงาม จากจดหมายข่าวรักษ์ทะเล ฉบับเดือนมิถุนายน 2569 มี 3 ย่อหน้า (1) เมื่อสิบปีก่อน ชาวประมงบ้านอ่าวใสจับปูม้าได้น้อยลงทุกปี บางวันออกเรือตั้งแต่ตีสี่ กลับมาตอนเที่ยงได้ปูไม่ถึงครึ่งกิโลกรัม ทั้งที่เมื่อก่อนเคยได้วันละหลายกิโลกรัม สาเหตุสำคัญคือแม่ปูที่มีไข่นอกกระดองถูกจับไปขายก่อนจะได้วางไข่ (2) ชาวบ้านจึงร่วมกันตั้งธนาคารปูม้า ใครจับแม่ปูไข่นอกกระดองได้ ให้นำมาฝากไว้ในกระชังของธนาคารจนแม่ปูปล่อยไข่ แล้วจึงนำแม่ปูไปขายได้ตามเดิม ลูกปูที่ฟักออกมาจะถูกปล่อยคืนสู่ทะเล (3) ห้าปีต่อมา ชาวประมงจับปูได้มากขึ้นจนมีรายได้พอส่งลูกเรียนหนังสือ ลุงสมพรซึ่งเป็นประธานกลุ่มเล่าว่า "ปีนี้เรือของผมได้ปูวันละสามถึงสี่กิโลกรัม" ธนาคารปูม้าจึงแสดงให้เห็นว่า การจับสัตว์น้ำอย่างรู้คุณค่าทำให้ทะเลมีอาหารเหลือไว้ให้คนรุ่นหลัง
  choices:
  - id: a
    text: ชาวบ้านนำแม่ปูไข่มาฝากจนปล่อยไข่
    feedback: เป็นวิธีแก้ปัญหา ซึ่งเป็นใจความ
  - id: b
    text: ลูกปูถูกปล่อยคืนสู่ทะเล
    feedback: เป็นส่วนสำคัญของวิธีแก้ปัญหา
  - id: c
    text: การจับสัตว์น้ำอย่างรู้คุณค่าทำให้ทะเลมีอาหารให้คนรุ่นหลัง
    feedback: เป็นข้อสรุปของบทความ
  - id: d
    text: คำพูดของลุงสมพรว่าเรือได้ปูวันละสามถึงสี่กิโลกรัม
    correct: true
    feedback: ถูก เป็นตัวอย่างสนับสนุน ใจความคือชาวประมงจับปูได้มากขึ้น
  hints:
  - ส่วนใดเป็นตัวอย่างหรือคำพูดของตัวบุคคล
  - ถ้าตัดออก ใจความยังครบไหม
  solution: คำพูดของลุงสมพรเป็น **ตัวอย่าง** ตัดได้ ใจความ (จับปูได้มากขึ้น) ยังอยู่
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.summary-writing.p009
  topics:
  - thai.composition.summary-writing
  difficulty: 3
  type: numeric
  stem: บทความยาว 900 คำ ครูให้ย่อเหลือประมาณ **1 ใน 3** ของเรื่องเดิม ย่อความควรยาวประมาณกี่คำ
  answer:
    value: 300
    unit: คำ
  misconceptions:
  - match: 2700
    feedback: คูณ 3 ทำให้ยาวขึ้น ต้องหารด้วย 3
  - match: 450
    feedback: หารด้วย 2 คือครึ่งหนึ่ง ไม่ใช่ 1 ใน 3
  hints:
  - 1 ใน 3 คือแบ่งเป็น 3 ส่วนเท่ากัน เอา 1 ส่วน
  - 900 ÷ 3
  solution: $900 \div 3 = 300$ คำ (เป็นค่าประมาณ ใจความครบสำคัญกว่าจำนวนคำ)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.summary-writing.p010
  topics:
  - thai.composition.summary-writing
  difficulty: 3
  type: mcq
  stem: นิดาเขียนเล่าว่า "ฉันปลูกผักบุ้งในกระถางหลังบ้าน ทุกเช้าฉันรดน้ำ" ข้อใดเขียนในย่อความได้ถูกต้อง
  choices:
  - id: a
    text: ฉันปลูกผักบุ้งในกระถางหลังบ้านและรดน้ำทุกเช้า
    feedback: ยังใช้สรรพนามบุรุษที่ 1
  - id: b
    text: นิดาปลูกผักบุ้งในกระถางหลังบ้านและรดน้ำทุกเช้า
    correct: true
    feedback: ถูก เปลี่ยนสรรพนาม ฉัน เป็นชื่อผู้เขียน
  - id: c
    text: เราปลูกผักบุ้งในกระถาง
    feedback: ใช้ เรา ผู้อ่านไม่รู้ว่าใคร
  - id: d
    text: นิดาปลูกผักบุ้งเก่งที่สุดในหมู่บ้าน
    feedback: เพิ่มความเห็นและข้อมูลที่เรื่องเดิมไม่มี
  hints:
  - ย่อความเล่าแบบบุคคลที่สาม
  - ฉัน ในเรื่องนี้คือใคร
  solution: 'เปลี่ยน **ฉัน** เป็น **นิดา**: นิดาปลูกผักบุ้งในกระถางหลังบ้านและรดน้ำทุกเช้า'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.summary-writing.p011
  topics:
  - thai.composition.summary-writing
  difficulty: 4
  type: mcq
  stem: อ่านบทความในภาพ ข้อใดเป็น **คำนำย่อความ** ที่ถูกต้องครบถ้วนที่สุด
  figure:
    src: crab-article.svg
    alt: บทความสมมติ ธนาคารปูม้าของบ้านอ่าวใส โดยชนิดา ทะเลงาม จากจดหมายข่าวรักษ์ทะเล ฉบับเดือนมิถุนายน 2569 มี 3 ย่อหน้า (1) เมื่อสิบปีก่อน ชาวประมงบ้านอ่าวใสจับปูม้าได้น้อยลงทุกปี บางวันออกเรือตั้งแต่ตีสี่ กลับมาตอนเที่ยงได้ปูไม่ถึงครึ่งกิโลกรัม ทั้งที่เมื่อก่อนเคยได้วันละหลายกิโลกรัม สาเหตุสำคัญคือแม่ปูที่มีไข่นอกกระดองถูกจับไปขายก่อนจะได้วางไข่ (2) ชาวบ้านจึงร่วมกันตั้งธนาคารปูม้า ใครจับแม่ปูไข่นอกกระดองได้ ให้นำมาฝากไว้ในกระชังของธนาคารจนแม่ปูปล่อยไข่ แล้วจึงนำแม่ปูไปขายได้ตามเดิม ลูกปูที่ฟักออกมาจะถูกปล่อยคืนสู่ทะเล (3) ห้าปีต่อมา ชาวประมงจับปูได้มากขึ้นจนมีรายได้พอส่งลูกเรียนหนังสือ ลุงสมพรซึ่งเป็นประธานกลุ่มเล่าว่า "ปีนี้เรือของผมได้ปูวันละสามถึงสี่กิโลกรัม" ธนาคารปูม้าจึงแสดงให้เห็นว่า การจับสัตว์น้ำอย่างรู้คุณค่าทำให้ทะเลมีอาหารเหลือไว้ให้คนรุ่นหลัง
  choices:
  - id: a
    text: ย่อบทความเรื่อง ธนาคารปูม้าของบ้านอ่าวใส ของชนิดา ทะเลงาม จากจดหมายข่าวรักษ์ทะเล ฉบับเดือนมิถุนายน 2569 ความว่า
    correct: true
    feedback: ถูก ครบ ชื่อเรื่อง ผู้เขียน แหล่ง ฉบับ และจบด้วย ความว่า
  - id: b
    text: ย่อบทความเรื่อง ธนาคารปูม้าของบ้านอ่าวใส ของชนิดา ทะเลงาม
    feedback: ไม่บอกแหล่งที่มาและไม่มีคำว่า ความว่า
  - id: c
    text: ย่อจดหมายของชนิดา ทะเลงาม ถึงชาวประมง ความว่า
    feedback: เรื่องนี้เป็นบทความ ไม่ใช่จดหมาย
  - id: d
    text: บทความนี้ดีมาก ย่อมาจากจดหมายข่าวรักษ์ทะเล ความว่า
    feedback: ใส่ความเห็นและไม่บอกชื่อเรื่อง
  hints:
  - คำนำบทความบอก ชื่อเรื่อง ของใคร จากไหน
  - ลงท้ายด้วยคำใด
  solution: 'คำนำบทความ: **ย่อบทความเรื่อง... ของ... จาก... ความว่า**'
