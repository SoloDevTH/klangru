  weight: 0.2
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  src: markup-margin.svg
  alt: แถบแนวนอนสองแถบของบราวนี่ราคา 100 บาท แถบบนแบ่งเป็นต้นทุน 80 บาท และกำไร 20 บาท มีวงเล็บบอกว่า markup คือ 20 หาร 80 เท่ากับ 25% เทียบกับฐานต้นทุน แถบล่างเป็นราคาขายทั้ง 100 บาท วงเล็บบอกว่า margin คือ 20 หาร 100 เท่ากับ 20% เทียบกับฐานราคาขาย
  caption: 'กำไร 20 บาทเท่ากัน แต่ฐานต่างกัน: markup 25% (ต่อต้นทุน) margin 20% (ต่อราคาขาย)'
- type: worked-example
  title: ตั้งราคาจาก margin และค่าธรรมเนียมแพลตฟอร์ม
  problem: กระเป๋าต้นทุน $140$ บาท ร้านอยากได้ margin $30\%$ ของราคา (ก่อนค่าธรรมเนียม) แต่ถ้าขายผ่านแพลตฟอร์มที่หักค่าธรรมเนียม $8\%$ ของราคา และยังอยากได้กำไร $60$ บาทต่อใบ ต้องตั้งราคาเท่าไร
  steps:
  - text: 'ไม่มีค่าธรรมเนียม: ต้นทุนเป็น $70\%$ ของราคา ราคา $= 140 \div 0.7 = 200$ บาท กำไร $60$ บาท'
    why: margin 30% แปลว่าต้นทุนเป็นส่วนที่เหลือ 70% ของราคาขาย
  - text: 'มีค่าธรรมเนียม $8\%$: ร้านได้เงินจริง $0.92P$'
  - text: ต้องการ $0.92P = 140 + 60 = 200 \Rightarrow P = 200 \div 0.92 \approx 217.39$ บาท
    why: ค่าธรรมเนียมคิดจากราคาขาย จึงต้องหาร ไม่ใช่บวก 8% ของ 200
  - text: 'ปัดเป็นราคาจิตวิทยา $219$ บาท ตรวจ: $219 \times 0.92 = 201.48$ บาท เหลือกำไร $61.48$ บาท ✓'
  answer: ขายหน้าร้าน $200$ บาท ขายผ่านแพลตฟอร์มอย่างน้อยประมาณ $217.39$ บาท (เช่น $219$ บาท)
- type: check
  problem: business.marketing.pricing.p005
  prompt: margin ใช้อะไรเป็นฐาน
- type: figure
  src: discount-profit.svg
  alt: กราฟเส้นกำไรต่อเดือนของรถเข็นกาแฟ (สมมติ) แกนนอนจำนวนแก้ว 0 ถึง 800 แกนตั้งกำไร −10,000 ถึง 16,000 บาท เส้นราคาปกติ 50 บาท เริ่มที่ −9,000 และชันกว่า ตัดแกนนอน (คุ้มทุน) ที่ 300 แก้ว เส้นราคาลด 20% (40 บาท) เริ่มที่ −9,000 เช่นกันแต่ชันน้อยกว่า ตัดแกนนอนที่ 450 แก้ว เส้นแนวนอนประที่กำไร 6,000 บาท ตัดเส้นราคาปกติที่ 500 แก้ว และเส้นราคาลดที่ 750 แก้ว
  caption: ลดราคา 20% ทำให้จุดคุ้มทุนเพิ่มจาก 300 เป็น 450 แก้ว และต้องขาย 750 แก้วจึงได้กำไรเท่าเดิม
- type: interactive
  title: ราคาขายกับจุดคุ้มทุน
  caption: กำไร $= (p - 20)x - 9{,}000$ เมื่อ $x$ คือจำนวนแก้วต่อเดือน ลองลดราคา $p$ แล้วดูว่าเส้นแบนลงและจุดตัดแกนนอน (จุดคุ้มทุน) เลื่อนไปทางขวา
  widget:
    kind: function-plot
    functions:
    - (p - 20) x - 9000
    sliders:
    - name: p
      min: 30
      max: 70
      step: 5
      value: 50
      label: ราคาต่อแก้ว (บาท)
    x:
    - 0
    - 800
    y:
    - -10000
    - 20000
- type: worked-example
  title: ลดราคาแล้วต้องขายเพิ่มเท่าไร
  problem: กาแฟแก้วละ $50$ บาท ต้นทุนผันแปร $20$ บาท ต้นทุนคงที่ $9{,}000$ บาทต่อเดือน ขายได้ $500$ แก้ว ถ้าลดราคา $20\%$ ต้องขายกี่แก้วจึงได้กำไรเท่าเดิม
  steps:
  - text: กำไรเดิม $= (50 - 20) \times 500 - 9{,}000 = 6{,}000$ บาท
  - text: ราคาใหม่ $= 50 \times 0.8 = 40$ บาท กำไรส่วนเกินใหม่ $= 40 - 20 = 20$ บาทต่อแก้ว
    why: ส่วนลดหักออกจากกำไรทั้งหมด ต้นทุนผันแปรไม่ได้ลดตาม
  - text: ต้องขาย $x = \dfrac{9{,}000 + 6{,}000}{20} = 750$ แก้ว
  - text: เพิ่มขึ้น $\dfrac{750 - 500}{500} = 50\%$ ทั้งที่ลดราคาแค่ $20\%$
  answer: $750$ แก้ว (เพิ่มขึ้น $50\%$)
- type: check
  problem: business.marketing.pricing.p009
  prompt: เปลี่ยนโปรเป็นส่วนลดต่อชิ้น
glossary:
- term: ต้นทุนบวกกำไร
  definition: วิธีตั้งราคาโดยนำต้นทุนต่อหน่วยบวกกำไรที่ต้องการ
- term: อัตราบวกเพิ่ม (markup)
  definition: กำไรต่อหน่วยหารด้วยต้นทุนต่อหน่วย $\times 100$
- term: อัตรากำไรต่อราคาขาย (margin)
  definition: กำไรต่อหน่วยหารด้วยราคาขาย $\times 100$
- term: ราคาตามคู่แข่ง
  definition: ตั้งราคาโดยอ้างอิงราคาของคู่แข่งที่ขายสินค้าคล้ายกัน
- term: ราคาตามคุณค่า
  definition: ตั้งราคาตามความยินดีจ่ายของลูกค้าที่มาจากคุณค่าที่รับรู้
- term: ราคาเชิงจิตวิทยา
  definition: ราคาที่ออกแบบให้ดูถูกหรือคุ้ม เช่น 199 บาท ราคาชุด
- term: ส่วนลดซ้อน
  definition: ส่วนลดหลายชั้นที่คิดต่อจากราคาที่ลดแล้ว คูณตัวคูณต่อกัน
