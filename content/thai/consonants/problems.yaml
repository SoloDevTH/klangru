    ai_assisted: true

  - id: thai.cons.p021
    topics: [thai.writing.consonants]
    difficulty: 5
    type: mcq
    stem: "คำใดมีทั้ง **คำควบกล้ำแท้** และ **ตัวสะกดไม่ตรงมาตรา**"
    choices:
      - { id: a, text: "กราฟ", correct: true, feedback: "ถูก กร ออกเสียงควบกันทั้งสองตัว และ ฟ เป็นตัวสะกดที่ไม่ตรงมาตรา (ออกเสียง /บ/ แม่กบ)" }
      - { id: b, text: "ปลาบ", feedback: "ปล เป็นควบกล้ำแท้ แต่ บ เป็นตัวสะกดตรงมาตราแม่กบ" }
      - { id: c, text: "ทรัพย์", feedback: "พ เป็นตัวสะกดไม่ตรงมาตรา แต่ ทร ออกเสียงเป็น ซ จึงเป็นควบกล้ำไม่แท้" }
      - { id: d, text: "ขลาด", feedback: "ขล เป็นควบกล้ำแท้ แต่ ด เป็นตัวสะกดตรงมาตราแม่กด" }
      - { id: e, text: "ศุกร์", feedback: "ศุกร์ อ่านว่า สุก ศ เป็นพยัญชนะต้นตัวเดียว ไม่มีคำควบกล้ำ ก เป็นตัวสะกดตรงมาตรา และ ร์ เป็นตัวการันต์" }
    hints:
      - "ตรวจทีละเงื่อนไข: พยัญชนะต้นออกเสียงสองตัวควบกันหรือไม่ แล้วจึงดูตัวสะกด"
      - "ตัวสะกดตรงมาตรามีเพียง ก ด บ ง น ม ย ว"
    solution: "กราฟ: กร ควบกล้ำแท้ ✓ และ ฟ สะกด (ออกเสียง /บ/) ไม่ตรงมาตรา ✓ คำอื่นขาดเงื่อนไขใดเงื่อนไขหนึ่ง: ปลาบ และ ขลาด ตัวสะกดตรงมาตรา ทรัพย์ เป็นควบกล้ำไม่แท้ ศุกร์ ไม่มีคำควบกล้ำ"
