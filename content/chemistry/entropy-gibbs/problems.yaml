  - id: chemistry.thermochem.entropy-gibbs.p017
    topics: [chemistry.thermochem.entropy-gibbs]
    difficulty: 5
    type: numeric
    stem: 'ปฏิกิริยาหนึ่งที่ $298.15\ \mathrm{K}$ มี $\Delta H = -44.0\ \mathrm{kJ/mol}$ และ $\Delta S = -0.100\ \mathrm{kJ/(mol\,K)}$ หาค่าคงที่สมดุล $K$ ที่อุณหภูมินี้ (ตอบจำนวนเต็ม ใช้ $R = 8.314\ \mathrm{J/(mol\,K)}$)'
    answer: { value: 306, tolerance: 2 }
    hints:
      - 'คำนวณ $\Delta G^\circ = \Delta H - T\Delta S$ ก่อน โดยใช้ค่า $\Delta H$ และ $\Delta S$ ที่กำหนด'
      - 'จาก $\Delta G^\circ = -RT\ln K$ แล้วหาค่า $K = e^{-\Delta G^\circ/RT}$'
    misconceptions:
      - { match: 0.00327, feedback: 'ได้ค่าส่วนกลับของ $K$ เพราะสลับเครื่องหมายของ $\Delta G^\circ$ ในเลขชี้กำลัง' }
    solution: '$\Delta G^\circ = -44.0 - (298.15)(-0.100) = -14.2\ \mathrm{kJ/mol}$ จึง $\ln K = \dfrac{14\,185}{(8.314)(298.15)} = 5.724$ และ $K = e^{5.724} = 306$'
