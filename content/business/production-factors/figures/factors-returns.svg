<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="sans-serif" font-size="14">
  <title>ปัจจัยการผลิตสี่อย่าง ผลตอบแทนของแต่ละปัจจัย และการผลิตเป็นสินค้าและบริการ</title>
  <rect x="0" y="0" width="760" height="340" fill="#ffffff"/>
  <text x="140.0" y="22.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">ปัจจัยการผลิต</text>
  <text x="330.0" y="22.0" text-anchor="middle" fill="#15803d" font-size="14" font-weight="bold">ผลตอบแทน</text>
  <rect x="20.0" y="34.0" width="240.0" height="62.0" rx="8" fill="#fef3c7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="140.0" y="60.8" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">ที่ดิน</text>
  <text x="140.0" y="78.3" text-anchor="middle" fill="#1f2937" font-size="13">ทรัพยากรธรรมชาติ</text>
  <text x="330.0" y="70.0" text-anchor="middle" fill="#15803d" font-size="14" font-weight="bold">ค่าเช่า</text>
  <line x1="375.0" y1="65.0" x2="466.6" y2="175.8" stroke="#1f2937" stroke-width="2"/>
  <polygon points="470.0,180.0 462.0,175.8 467.4,171.4" fill="#1f2937"/>
  <rect x="20.0" y="108.0" width="240.0" height="62.0" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="140.0" y="134.8" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">แรงงาน</text>
  <text x="140.0" y="152.3" text-anchor="middle" fill="#1f2937" font-size="13">แรงกายและความคิดของคน</text>
  <text x="330.0" y="144.0" text-anchor="middle" fill="#15803d" font-size="14" font-weight="bold">ค่าจ้าง</text>
  <line x1="375.0" y1="139.0" x2="465.0" y2="177.9" stroke="#1f2937" stroke-width="2"/>
  <polygon points="470.0,180.0 461.0,179.9 463.8,173.5" fill="#1f2937"/>
  <rect x="20.0" y="182.0" width="240.0" height="62.0" rx="8" fill="#ede9fe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="140.0" y="208.8" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">ทุน</text>
  <text x="140.0" y="226.3" text-anchor="middle" fill="#1f2937" font-size="13">เครื่องมือ เครื่องจักร อาคาร</text>
  <text x="330.0" y="218.0" text-anchor="middle" fill="#15803d" font-size="14" font-weight="bold">ดอกเบี้ย</text>
  <line x1="375.0" y1="213.0" x2="464.9" y2="181.8" stroke="#1f2937" stroke-width="2"/>
  <polygon points="470.0,180.0 463.3,186.0 461.0,179.4" fill="#1f2937"/>
  <rect x="20.0" y="256.0" width="240.0" height="62.0" rx="8" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="140.0" y="282.8" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">ผู้ประกอบการ</text>
  <text x="140.0" y="300.3" text-anchor="middle" fill="#1f2937" font-size="13">รวบรวมปัจจัยและรับความเสี่ยง</text>
  <text x="330.0" y="292.0" text-anchor="middle" fill="#15803d" font-size="14" font-weight="bold">กำไร</text>
  <line x1="375.0" y1="287.0" x2="466.4" y2="184.0" stroke="#1f2937" stroke-width="2"/>
  <polygon points="470.0,180.0 467.1,188.5 461.9,183.9" fill="#1f2937"/>
  <rect x="470.0" y="135.0" width="120.0" height="90.0" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/>
  <text x="530.0" y="185.2" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="bold">การผลิต</text>
  <line x1="590.0" y1="180.0" x2="614.6" y2="180.0" stroke="#1f2937" stroke-width="2"/>
  <polygon points="620.0,180.0 611.7,183.5 611.7,176.5" fill="#1f2937"/>
  <rect x="620.0" y="140.0" width="130.0" height="80.0" rx="8" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="685.0" y="175.5" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">สินค้าและ</text>
  <text x="685.0" y="194.4" text-anchor="middle" fill="#1f2937" font-size="14">บริการ</text>
  <text x="380.0" y="333.0" text-anchor="middle" fill="#6b7280" font-size="13">เจ้าของปัจจัยแต่ละอย่างได้รับผลตอบแทนต่างกัน</text>
</svg>
