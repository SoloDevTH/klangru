# หัวข้อในคลังที่สอนเนื้อหาสาระสำคัญของ มคอ.1 สาขาโลจิสติกส์ 2552 บางส่วน
framework: th-tqf-logistics
mappings:
  - topic: management.operations.lean
    indicators: ["8.2.7"]
    coverage: partial
    note: "ลีน เวลาแท็กต์ สมดุลสายการผลิต และผลิตภาพเป็นส่วนหนึ่งของการจัดการการผลิตและปฏิบัติการ ยังไม่มีการพยากรณ์ การวางแผนกำลังการผลิต และการจัดตารางการผลิต"
  - topic: management.operations.capacity-scheduling
    indicators: [8.2.7]
    coverage: partial
    note: กำลังการผลิต แผนการผลิตรวม การจัดลำดับงาน แผนภูมิแกนต์ และกฎของจอห์นสัน ส่วนสินค้าคงคลังอยู่ใน inventory และการวางแผนความต้องการวัสดุ (MRP) ยังไม่มีหัวข้อ
  - topic: management.operations.inventory
    indicators: [8.1.2]
    coverage: full
    note: ต้นทุนสินค้าคงคลัง ABC EOQ ROP คงคลังสำรอง ระบบทบทวนเป็นรอบ และหลักจัดคลังสินค้า (FEFO ตำแหน่งจัดเก็บ ชั้นวาง p017 p018)
  - topic: management.operations.inventory
    indicators: [8.2.6, "5.5"]
    coverage: partial
    note: หลักหน่วยบรรทุก การลดการยกซ้ำ และการเลือกอุปกรณ์ขนถ่าย (p005 p017) ยังไม่ได้สอนการออกแบบระบบขนถ่ายและการคำนวณความสามารถของอุปกรณ์
  - topic: management.operations.linear-programming
    indicators: [8.2.8, "5.3"]
    coverage: partial
    note: กำหนดการเชิงเส้นสองตัวแปร ราคาเงา และปัญหาการขนส่งเบื้องต้น การวิจัยดำเนินการยังรวมวิธีซิมเพล็กซ์ ทฤษฎีแถวคอย และแบบจำลองข่ายงานซึ่งยังไม่มีหัวข้อ
  - topic: management.operations.supply-chain
    indicators: [5.2(1), 8.1.1, 8.1.3, 8.2.3]
    coverage: full
    note: หลักการโลจิสติกส์และโซ่อุปทานประยุกต์ในการวางแผนและแก้ปัญหา (p007 p010 p012 p013 p016)
  - topic: management.operations.supply-chain
    indicators: [5.2(2), 8.2.1, 8.2.5]
    coverage: partial
    note: หลักเศรษฐศาสตร์ (ต้นทุนรวม จุดคุ้มทุน ต้นทุนถือครอง) และหลักกฎหมายการค้า (Incoterms) (p008 p010 p016 p018) ไม่ลงรายละเอียดกฎหมายศุลกากรไทย
  - topic: business.law.transport-insurance
    indicators: [8.2.2]
    coverage: partial
    note: สอนสัญญารับขน (ประมวลกฎหมายแพ่งและพาณิชย์ มาตรา 608–639) ความรับผิดของผู้ขนส่ง ใบตราส่ง พ.ร.บ.การรับขนของทางทะเล พ.ศ. 2534 พ.ร.บ.การขนส่งต่อเนื่องหลายรูปแบบ พ.ศ. 2548 การประกันภัยขนส่งตาม ICC และพิธีการศุลกากรเบื้องต้น ยังไม่ครอบคลุมกฎหมายศุลกากรฉบับเต็มและกฎหมายอื่นด้านโลจิสติกส์ (เช่น คลังสินค้า การขนส่งทางบกและทางอากาศโดยเฉพาะ)
  - topic: management.operations.packaging-systems
    indicators: [8.2.4]
    coverage: full
    note: สอนหน้าที่และระดับของบรรจุภัณฑ์ การรวมหน่วยด้วยพาเลทตามมาตรฐาน ISO 6780 การคำนวณจำนวนกล่องต่อชั้นและจำนวนชั้น อัตราการใช้พื้นที่ ความแข็งกดกับการซ้อน สัญลักษณ์ ISO 780 และบาร์โค้ด GS1 (EAN-13 GTIN-14 ITF-14) ต้นทุนรวมเทียบความเสียหาย บรรจุภัณฑ์หมุนเวียน และหลัก EPR (p001 ถึง p019) ไม่ได้สอนการออกแบบกล่องลูกฟูกเชิงโครงสร้างหรือการทดสอบแรงกดในห้องปฏิบัติการ
  - topic: management.research.research-methods
    indicators: [5.2(3)]
    coverage: full
    note: สอนการติดตามความรู้ใหม่จากงานวิจัยด้วยการค้นและอ่านบทคัดย่อ และการทบทวนวรรณกรรมที่ใช้ได้ทั้งสาขาโลจิสติกส์และศาสตร์ที่เกี่ยวข้อง (บทเรียนทบทวนวรรณกรรม)
