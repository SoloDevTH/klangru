id: earthscience.atmosphere.monsoons-thai-seasons
subject: earthscience
title: { th: ลมบก ลมทะเล มรสุม และฤดูของประเทศไทย, en: "Land and sea breezes, monsoons and Thailand's seasons" }
summary: การเกิดลมบก ลมทะเล และมรสุมจากความร้อนที่ต่างกันของพื้นดินกับพื้นน้ำ ผลต่อสิ่งมีชีวิตและสิ่งแวดล้อม และมรสุมกับฤดูร้อน ฤดูฝน ฤดูหนาวของประเทศไทย
difficulty: 2.2
minutes: 35
prerequisites: [earthscience.atmosphere.air-wind]
encompasses:
  - { id: earthscience.atmosphere.air-wind, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ลมทะเลและลมบก
    src: land-sea-breeze.svg
    alt: "สองภาพเคียงกัน ภาพซ้ายกลางวัน ทะเลอุ่นขึ้นช้าและเย็นกว่า แผ่นดินร้อนขึ้นเร็วและร้อนกว่า ลูกศรสีแดงชี้ขึ้นเหนือแผ่นดิน อากาศร้อนลอยขึ้น ลูกศรด้านบนชี้ไปทางทะเล ลูกศรสีฟ้าชี้ลงเหนือทะเล และลูกศรใหญ่ใกล้พื้นชี้จากทะเลเข้าฝั่ง เขียนว่า ลมทะเล พัดจากทะเลเข้าฝั่ง ภาพขวากลางคืน แผ่นดินเย็นลงเร็วกว่า ทะเลอุ่นกว่า อากาศเหนือทะเลลอยขึ้น ลูกศรใหญ่ใกล้พื้นชี้จากฝั่งออกทะเล เขียนว่า ลมบก พัดจากฝั่งออกทะเล"
    caption: "ลมใกล้พื้นพัดจากที่เย็นกว่าไปหาที่ร้อนกว่าเสมอ (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: worked-example
    title: ลมที่ชายหาดตอนบ่ายและตอนดึก
    problem: "ที่ชายหาดหัวหิน ตอนบ่ายสองโมงและตอนตีสอง ลมใกล้พื้นน่าจะพัดไปทางใด"
    steps:
      - text: "ตอนบ่าย แดดส่องมาหลายชั่วโมง พื้นดินร้อนขึ้นเร็วกว่าน้ำทะเล จึงร้อนกว่า"
      - text: "อากาศเหนือพื้นดินลอยขึ้น อากาศเหนือทะเลเคลื่อนเข้าแทน จึงเป็นลมทะเล พัดจากทะเลเข้าฝั่ง"
      - text: "ตอนตีสอง ไม่มีแดดหลายชั่วโมง พื้นดินเย็นลงเร็วกว่า น้ำทะเลจึงอุ่นกว่า"
        why: "น้ำเก็บความร้อนไว้ได้นานกว่าดิน"
      - text: "อากาศเหนือทะเลลอยขึ้น อากาศเหนือพื้นดินเคลื่อนเข้าแทน จึงเป็นลมบก พัดจากฝั่งออกทะเล"
    answer: "บ่ายสองโมงเป็นลมทะเล พัดเข้าฝั่ง ตีสองเป็นลมบก พัดออกทะเล"
  - { type: check, problem: earthscience.atmosphere.monsoons-thai-seasons.p007, prompt: "ลมใดพาเรือออกทะเล" }
  - type: figure
    title: มรสุมสองฤดูของประเทศไทย
    src: monsoons.svg
    alt: "สองแผนภาพอย่างง่ายของประเทศไทย ภาพซ้าย มรสุมตะวันตกเฉียงใต้ กลางเดือนพฤษภาคมถึงกลางเดือนตุลาคม ลูกศรจากมหาสมุทรอินเดียทางตะวันตกเฉียงใต้พัดเข้าประเทศไทย นำอากาศชื้น ฝนตกชุก เป็นฤดูฝน ภาพขวา มรสุมตะวันออกเฉียงเหนือ กลางเดือนตุลาคมถึงกลางเดือนกุมภาพันธ์ ลูกศรจากจีนทางตะวันออกเฉียงเหนือ อากาศเย็นและแห้ง ภาคเหนือและอีสานหนาว ลูกศรผ่านอ่าวไทยไปภาคใต้ฝั่งตะวันออก ฝนตกชุก"
    caption: "แผนภาพอย่างง่าย ไม่ใช่แผนที่จริง ช่วงเวลาตามกรมอุตุนิยมวิทยา (วาดโดยทีมคลังรู้)"
  - type: figure
    title: ฤดูของประเทศไทย
    src: seasons.svg
    alt: "แถบเดือนมกราคมถึงธันวาคม ฤดูหนาวตั้งแต่กลางเดือนตุลาคมถึงกลางเดือนกุมภาพันธ์ ฤดูร้อนกลางเดือนกุมภาพันธ์ถึงกลางเดือนพฤษภาคม เป็นช่วงเปลี่ยนมรสุม ฤดูฝนกลางเดือนพฤษภาคมถึงกลางเดือนตุลาคม ตรงกับมรสุมตะวันตกเฉียงใต้ ส่วนฤดูหนาวตรงกับมรสุมตะวันออกเฉียงเหนือ หมายเหตุว่าภาคใต้ฝั่งตะวันออกยังมีฝนชุกถึงราวเดือนธันวาคม"
    caption: "เกณฑ์ของกรมอุตุนิยมวิทยา วันเริ่มฤดูจริงอาจเร็วหรือช้ากว่านี้ราว 1–2 สัปดาห์ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: อ่านกราฟฝนเพื่อหาว่ามรสุมใดนำฝนมา
    problem: "สถานีหนึ่งมีฝนเดือนกันยายน 320 มม. และเดือนพฤศจิกายน 50 มม. อีกสถานีมีฝนเดือนกันยายน 140 มม. และเดือนพฤศจิกายน 600 มม. แต่ละสถานีได้ฝนส่วนใหญ่จากมรสุมใด"
    steps:
      - text: "กันยายนอยู่ในช่วงมรสุมตะวันตกเฉียงใต้ (กลาง พ.ค.–กลาง ต.ค.)"
      - text: "พฤศจิกายนอยู่ในช่วงมรสุมตะวันออกเฉียงเหนือ (กลาง ต.ค.–กลาง ก.พ.)"
      - text: "สถานีแรกฝนมากในเดือนกันยายน จึงได้ฝนจากมรสุมตะวันตกเฉียงใต้ เป็นแบบของภาคส่วนใหญ่ของประเทศ"
      - text: "สถานีที่สองฝนมากในเดือนพฤศจิกายน จึงได้ฝนจากมรสุมตะวันออกเฉียงเหนือที่ผ่านอ่าวไทย น่าจะอยู่ภาคใต้ฝั่งตะวันออก"
    answer: "สถานีแรก มรสุมตะวันตกเฉียงใต้ สถานีที่สอง มรสุมตะวันออกเฉียงเหนือ"
  - { type: check, problem: earthscience.atmosphere.monsoons-thai-seasons.p008, prompt: "ดูเดือนที่ฝนมากที่สุด" }
glossary:
  - { term: ลมทะเล, definition: "ลมที่พัดจากทะเลเข้าหาฝั่งในเวลากลางวัน เพราะพื้นดินร้อนกว่าพื้นน้ำ" }
  - { term: ลมบก, definition: "ลมที่พัดจากฝั่งออกสู่ทะเลในเวลากลางคืน เพราะพื้นดินเย็นกว่าพื้นน้ำ" }
  - { term: มรสุม, definition: "ลมประจำฤดูที่เปลี่ยนทิศตามฤดูกาล เกิดจากทวีปกับมหาสมุทรร้อนไม่เท่ากัน" }
  - { term: มรสุมตะวันตกเฉียงใต้, definition: "ลมที่พัดจากมหาสมุทรอินเดียเข้าประเทศไทย กลางเดือนพฤษภาคมถึงกลางเดือนตุลาคม นำฝนมา" }
  - { term: มรสุมตะวันออกเฉียงเหนือ, definition: "ลมที่พัดจากจีนและมองโกเลียเข้าประเทศไทย กลางเดือนตุลาคมถึงกลางเดือนกุมภาพันธ์ นำอากาศเย็นและแห้งมา" }
  - { term: ฝนทิ้งช่วง, definition: "ช่วงที่ฝนลดลงกลางฤดูฝน มักเกิดราวปลายเดือนมิถุนายนถึงกรกฎาคม" }
flashcards:
  - { front: "ลมทะเลกับลมบกเกิดเวลาใด", back: "ลมทะเลตอนกลางวัน (พัดเข้าฝั่ง) ลมบกตอนกลางคืน (พัดออกทะเล)" }
  - { front: "ฤดูของไทยตามกรมอุตุนิยมวิทยา", back: "ร้อน กลาง ก.พ.–กลาง พ.ค. ฝน กลาง พ.ค.–กลาง ต.ค. หนาว กลาง ต.ค.–กลาง ก.พ." }
  - { front: "มรสุมตะวันตกเฉียงใต้นำอะไรมา", back: "อากาศชื้นจากมหาสมุทรอินเดีย ทำให้เกิดฤดูฝน" }
  - { front: "ทำไมภาคใต้ฝั่งตะวันออกฝนชุกปลายปี", back: "มรสุมตะวันออกเฉียงเหนือพัดผ่านอ่าวไทย พาความชื้นมา" }
