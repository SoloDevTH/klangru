  - id: physics.rotation.rotational-dynamics.p017
    topics: [physics.rotation.rotational-dynamics]
    difficulty: 3
    type: expression
    stem: "ทรงกระบอกตัน ($I = \\tfrac12 MR^2$) กลิ้งโดยไม่ไถลจากหยุดนิ่งลงพื้นเอียงสูง $h$ จงเขียนอัตราเร็วที่ปลายพื้นเอียง $v$ ในรูปของ $g$ และ $h$"
