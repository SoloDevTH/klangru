  - topic: physics.electricity.charge
    indicators: ["ว 2.2 ป.6/1", "ว 2.2 ม.2/11", "ว 2.2 ม.2/13"]
    coverage: partial
    note: "แรงไฟฟ้าจากการขัดถูครบ สนามไฟฟ้าและแรงไฟฟ้ากับระยะห่างตามกฎของคูลอมบ์มี แต่ไม่ได้เปรียบเทียบกับสนามแม่เหล็กและสนามโน้มถ่วง"
