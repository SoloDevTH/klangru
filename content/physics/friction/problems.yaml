problems:
  - id: phy.fric.p001
    topics: [physics.dynamics.friction]
    difficulty: 1
    type: numeric
    stem: "กล่องไถลบนพื้นที่มีสัมประสิทธิ์ความเสียดทานจลน์ $\\mu_k = 0.3$ แรงปฏิกิริยาตั้งฉากจากพื้นเป็น $200\\ \\mathrm{N}$ แรงเสียดทานจลน์มีขนาดเท่าใด (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 60, unit: N }
    hints:
      - "กล่องไถลอยู่ ใช้แรงเสียดทานจลน์"
      - "ใช้ $f_k = \\mu_k N$"
    misconceptions:
      - { match: 666.67, feedback: "ดูเหมือนนำ $N$ หารด้วย $\\mu_k$ แรงเสียดทานคือ $\\mu_k$ **คูณ** $N$ และต้องน้อยกว่า $N$ เมื่อ $\\mu_k < 1$" }
    solution: "$f_k = \\mu_k N = 0.3 \\times 200\\ \\mathrm{N} = 60\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.fric.p002
    topics: [physics.dynamics.friction]
    difficulty: 2
    type: numeric
    stem: "กล่องมวล $20\\ \\mathrm{kg}$ ไถลบนพื้นราบที่มี $\\mu_k = 0.25$ แรงเสียดทานจลน์มีขนาดเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 49, unit: N }
    hints:
      - "หาแรงปฏิกิริยาตั้งฉากก่อน บนพื้นราบที่ไม่มีแรงอื่นในแนวดิ่ง $N = mg$"
      - "แล้วใช้ $f_k = \\mu_k N$"
    misconceptions:
      - { match: 5, feedback: "ดูเหมือนนำ $\\mu_k$ คูณมวลโดยตรง ต้องใช้แรงปฏิกิริยาตั้งฉาก $N = mg$ ซึ่งเป็นแรง (นิวตัน)" }
      - { match: 196, feedback: "นั่นคือแรงปฏิกิริยาตั้งฉาก $N = mg$ ยังไม่ได้คูณด้วย $\\mu_k$" }
    solution: "$N = mg = (20)(9.8) = 196\\ \\mathrm{N}$ แล้ว $f_k = \\mu_k N = 0.25 \\times 196 = 49\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.fric.p003
    topics: [physics.dynamics.friction]
    difficulty: 2
    type: mcq
    stem: "ตู้หนังสือบนพื้นมีแรงเสียดทานสถิตสูงสุด $50\\ \\mathrm{N}$ นักเรียนผลักตู้ในแนวราบด้วยแรง $30\\ \\mathrm{N}$ แต่ตู้ไม่ขยับ ขณะนั้นแรงเสียดทานที่พื้นกระทำต่อตู้มีขนาดเท่าใด"
    choices:
      - { id: a, text: "$30\\ \\mathrm{N}$", correct: true }
      - { id: b, text: "$50\\ \\mathrm{N}$", feedback: "$50\\ \\mathrm{N}$ เป็นแค่ค่าสูงสุดที่แรงเสียดทานสถิตทำได้ ถ้าแรงเสียดทานเป็น $50\\ \\mathrm{N}$ ขณะผลักแค่ $30\\ \\mathrm{N}$ แรงลัพธ์จะไม่เป็นศูนย์ และตู้จะเคลื่อนที่ถอยเข้าหาคนผลัก" }
      - { id: c, text: "$0\\ \\mathrm{N}$", feedback: "ถ้าไม่มีแรงเสียดทาน แรงผลัก $30\\ \\mathrm{N}$ จะเป็นแรงลัพธ์และทำให้ตู้เคลื่อนที่ ตู้ที่นิ่งอยู่แปลว่ามีแรงเสียดทานต้านพอดี" }
      - { id: d, text: "$80\\ \\mathrm{N}$", feedback: "แรงเสียดทานไม่ได้เพิ่มขึ้นตามผลรวมของสองค่านี้ ตู้นิ่ง แรงเสียดทานจึงต้องหักล้างกับแรงผลักพอดี" }
    hints:
      - "ตู้นิ่ง แรงลัพธ์ในแนวราบเป็นเท่าใด"
      - "แรงเสียดทานสถิตมีขนาดเท่าที่จำเป็นเท่านั้น ไม่จำเป็นต้องเป็นค่าสูงสุด"
    solution: "ตู้นิ่ง แรงลัพธ์เป็นศูนย์ แรงเสียดทานสถิตจึงเท่ากับแรงผลัก คือ $30\\ \\mathrm{N}$ ในทิศตรงข้าม ($30\\ \\mathrm{N} < 50\\ \\mathrm{N}$ ตู้จึงยังไม่ไถล)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.fric.p004
    topics: [physics.dynamics.friction]
    difficulty: 3
    type: numeric
    stem: "พ่อค้าในตลาดต้องการลากกระสอบข้าวสารมวล $50\\ \\mathrm{kg}$ บนพื้นปูนราบ ซึ่งมี $\\mu_s = 0.6$ และ $\\mu_k = 0.5$ ต้องออกแรงในแนวราบอย่างน้อยเท่าใดกระสอบจึงจะเริ่มขยับ ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 294, unit: N }
    hints:
      - "กระสอบเริ่มขยับเมื่อแรงลากเกินแรงเสียดทานสถิตสูงสุด"
      - "ตอนเริ่มขยับ กระสอบยังไม่ไถล จึงใช้ $\\mu_s$ ไม่ใช่ $\\mu_k$"
      - "หา $\\mu_s N$ โดย $N = mg$"
    misconceptions:
      - { match: 245, feedback: "นั่นคือแรงเสียดทานจลน์ ($\\mu_k N$) ซึ่งใช้หลังกระสอบไถลแล้ว การทำให้เริ่มขยับต้องเอาชนะแรงเสียดทานสถิตสูงสุด $\\mu_s N$" }
      - { match: 30, feedback: "ดูเหมือนนำ $\\mu_s$ คูณมวลโดยตรง ต้องคูณกับแรงปฏิกิริยาตั้งฉาก $N = mg$" }
    solution: "$N = mg = (50)(9.8) = 490\\ \\mathrm{N}$ แรงเสียดทานสถิตสูงสุด $\\mu_s N = 0.6 \\times 490 = 294\\ \\mathrm{N}$ ต้องออกแรงมากกว่า $294\\ \\mathrm{N}$ เล็กน้อย กระสอบจึงเริ่มขยับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.fric.p005
    topics: [physics.dynamics.friction]
    difficulty: 3
    type: numeric
    stem: "ลากกล่องมวล $15\\ \\mathrm{kg}$ บนพื้นราบด้วยแรง $80\\ \\mathrm{N}$ ในแนวราบ กล่องไถลไปโดยมี $\\mu_k = 0.4$ กล่องมีความเร่งเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย m/s² ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 1.413, tolerance: 0.015, unit: m/s² }
    hints:
      - "หาแรงเสียดทานจลน์ $f_k = \\mu_k mg$ ก่อน"
      - "แรงลัพธ์คือแรงลากลบแรงเสียดทาน"
      - "$a = \\dfrac{F - f_k}{m}$"
    misconceptions:
      - { match: 5.333, feedback: "ดูเหมือนไม่ได้หักแรงเสียดทาน กฎข้อที่ 2 ใช้แรงลัพธ์ $F - f_k$" }
      - { match: 9.253, feedback: "แรงเสียดทานมีทิศตรงข้ามกับการไถล ต้องลบออกจากแรงลาก ไม่ใช่บวกเพิ่ม" }
    solution: "$f_k = 0.4 \\times (15)(9.8) = 58.8\\ \\mathrm{N}$ แรงลัพธ์ $= 80 - 58.8 = 21.2\\ \\mathrm{N}$ ดังนั้น $a = \\dfrac{21.2\\ \\mathrm{N}}{15\\ \\mathrm{kg}} \\approx 1.41\\ \\mathrm{m/s^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.fric.p006
    topics: [physics.dynamics.friction]
    difficulty: 3
    type: numeric
    stem: "นักเรียนเวรลากโต๊ะในห้องเรียนมวล $25\\ \\mathrm{kg}$ ไปบนพื้นด้วยความเร็วคงตัว โดยใช้แรงในแนวราบ $98\\ \\mathrm{N}$ สัมประสิทธิ์ความเสียดทานจลน์ระหว่างขาโต๊ะกับพื้นเป็นเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลข ไม่มีหน่วย)"
    answer: { value: 0.4, tolerance: 0.004 }
    hints:
      - "ความเร็วคงตัวแปลว่าแรงลัพธ์เป็นศูนย์ แรงลากจึงเท่ากับแรงเสียดทานจลน์"
      - "จาก $f_k = \\mu_k N$ จัดรูปได้ $\\mu_k = \\dfrac{f_k}{N}$"
      - "แรงปฏิกิริยาตั้งฉาก $N = mg$"
    misconceptions:
      - { match: 3.92, feedback: "ดูเหมือนนำแรงหารด้วยมวล (ได้หน่วย $\\mathrm{m/s^2}$) ต้องหารด้วยแรงปฏิกิริยาตั้งฉาก $N = mg$ จึงได้ตัวเลขไม่มีหน่วย" }
      - { match: 2.5, feedback: "กลับเศษกับส่วน $\\mu_k = \\dfrac{f_k}{N}$ ไม่ใช่ $\\dfrac{N}{f_k}$ ค่า $\\mu$ ของผิวทั่วไปมักน้อยกว่า 1" }
    solution: "ความเร็วคงตัว: $f_k = F = 98\\ \\mathrm{N}$ และ $N = (25)(9.8) = 245\\ \\mathrm{N}$ ดังนั้น $\\mu_k = \\dfrac{98}{245} = 0.4$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.fric.p007
    topics: [physics.dynamics.friction]
    difficulty: 4
    type: numeric
    stem: "ผลักตะกร้าผลไม้ให้ไถลบนพื้นราบด้วยความเร็วต้น $3\\ \\mathrm{m/s}$ แล้วปล่อยมือ ตะกร้าไถลไปจนหยุดเอง ถ้า $\\mu_k = 0.3$ ตะกร้าไถลไปได้ไกลเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย m ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 1.531, tolerance: 0.015, unit: m }
    hints:
      - "หลังปล่อยมือ แรงในแนวราบเหลือแรงเสียดทานจลน์อย่างเดียว ความเร่งหน่วงมีขนาด $\\mu_k g$"
      - "รู้ $u$, $v = 0$ และ $a$ ไม่รู้เวลา ใช้ $v^2 = u^2 + 2as$"
      - "ทิศที่ไถลเป็นบวก ความเร่งจึงเป็นลบ: $0 = 3^2 + 2(-\\mu_k g)s$"
    misconceptions:
      - { match: 3.061, feedback: "ดูเหมือนลืมเลข 2 ใน $2as$ ระยะไถลคือ $s = \\dfrac{u^2}{2\\mu_k g}$" }
      - { match: 15, feedback: "ดูเหมือนใช้ $\\mu_k$ เป็นความเร่งโดยตรง ความเร่งหน่วงคือ $\\mu_k g$ ต้องคูณ $g$ ด้วย" }
    solution: "$a = -\\mu_k g = -0.3 \\times 9.8 = -2.94\\ \\mathrm{m/s^2}$ แล้ว $0 = 3^2 + 2(-2.94)s$ → $s = \\dfrac{9}{5.88} \\approx 1.53\\ \\mathrm{m}$ (ไม่ขึ้นกับมวลของตะกร้า)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.fric.p008
    topics: [physics.dynamics.friction]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "ตามแบบจำลอง $f_k = \\mu_k N$ ขนาดของแรงเสียดทานจลน์ขึ้นกับสิ่งใด (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ชนิดของผิวสัมผัสทั้งสอง", correct: true }
      - { id: b, text: "แรงที่ผิวทั้งสองกดกัน (แรงปฏิกิริยาตั้งฉาก)", correct: true }
      - { id: c, text: "พื้นที่ผิวสัมผัส", feedback: "ในแบบจำลองนี้ วางกล่องตะแคงหรือตั้ง แรงเสียดทานเท่าเดิม เพราะ $f_k = \\mu_k N$ ไม่มีพื้นที่อยู่ในสูตร" }
      - { id: d, text: "อัตราเร็วของการไถล", feedback: "แรงเสียดทานจลน์ในแบบจำลองนี้เกือบคงตัว ไม่ว่าไถลเร็วหรือช้า (แรงต้านที่ขึ้นกับอัตราเร็วคือแรงต้านของอากาศหรือน้ำ)" }
    hints:
      - "ดูว่าในสูตร $f_k = \\mu_k N$ มีตัวแปรอะไรบ้าง"
      - "$\\mu_k$ ขึ้นกับอะไร และ $N$ หมายถึงอะไร"
    solution: "$\\mu_k$ ขึ้นกับชนิดของผิวทั้งสอง และ $N$ คือแรงที่ผิวกดกัน สองอย่างนี้จึงกำหนดแรงเสียดทานจลน์ ส่วนพื้นที่ผิวและอัตราเร็วไม่ได้อยู่ในสูตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.fric.p009
    topics: [physics.dynamics.friction]
    difficulty: 5
    type: numeric
    stem: "ช่วงฝนตก รถยนต์วิ่งด้วยความเร็ว $20\\ \\mathrm{m/s}$ บนถนนเปียก แล้วเบรกจนล้อล็อกและไถลไปจนหยุด ถ้า $\\mu_k$ ระหว่างยางกับถนนเปียกเป็น $0.5$ รถไถลไปไกลเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย m ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 40.82, tolerance: 0.4, unit: m }
    hints:
      - "บนถนนราบ แรงที่หยุดรถคือแรงเสียดทานจลน์ ความเร่งหน่วงมีขนาด $\\mu_k g$"
      - "ใช้ $v^2 = u^2 + 2as$ โดย $v = 0$ และ $a$ เป็นลบ"
      - "$s = \\dfrac{u^2}{2\\mu_k g}$"
    misconceptions:
      - { match: 81.63, feedback: "ดูเหมือนลืมเลข 2 ใน $2as$ ระยะไถลคือ $\\dfrac{u^2}{2\\mu_k g}$" }
      - { match: 400, feedback: "ดูเหมือนใช้ $\\mu_k$ เป็นความเร่งโดยตรง ความเร่งหน่วงคือ $\\mu_k g$" }
    solution: "$a = -\\mu_k g = -0.5 \\times 9.8 = -4.9\\ \\mathrm{m/s^2}$ แล้ว $s = \\dfrac{u^2}{2|a|} = \\dfrac{400}{9.8} \\approx 40.8\\ \\mathrm{m}$ (บนถนนแห้งที่ $\\mu_k = 0.8$ จะไถลเพียงราว $25.5\\ \\mathrm{m}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.fric.p010
    topics: [physics.dynamics.friction]
    difficulty: 5
    type: numeric
    stem: "ลากลังสินค้ามวล $30\\ \\mathrm{kg}$ ที่วางนิ่งบนพื้นราบด้วยแรงในแนวราบ $150\\ \\mathrm{N}$ ระหว่างลังกับพื้นมี $\\mu_s = 0.45$ และ $\\mu_k = 0.35$ ลังมีความเร่งเท่าใด (ถ้าไม่ขยับให้ตอบ 0) ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย m/s² ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 1.57, tolerance: 0.016, unit: m/s² }
    hints:
      - "ขั้นแรก ตรวจว่าลังขยับหรือไม่ โดยเทียบแรงลากกับ $\\mu_s N$"
      - "ถ้าขยับแล้ว แรงเสียดทานเปลี่ยนเป็นแรงเสียดทานจลน์ $\\mu_k N$"
      - "$a = \\dfrac{F - \\mu_k mg}{m}$"
    misconceptions:
      - { match: 0.59, feedback: "ดูเหมือนใช้ $\\mu_s$ หลังลังไถลแล้ว $\\mu_s$ ใช้แค่ตรวจว่าเริ่มขยับหรือไม่ พอไถลต้องใช้ $\\mu_k$" }
      - { match: 5, feedback: "ดูเหมือนไม่ได้หักแรงเสียดทาน แรงลัพธ์คือแรงลากลบแรงเสียดทานจลน์" }
      - { match: 0, feedback: "ลองเทียบให้ดี $\\mu_s N = 0.45 \\times 294 = 132.3\\ \\mathrm{N}$ ซึ่งน้อยกว่าแรงลาก $150\\ \\mathrm{N}$ ลังจึงขยับ" }
    solution: "$N = (30)(9.8) = 294\\ \\mathrm{N}$ แรงเสียดทานสถิตสูงสุด $0.45 \\times 294 = 132.3\\ \\mathrm{N} < 150\\ \\mathrm{N}$ ลังจึงไถล แรงเสียดทานจลน์ $0.35 \\times 294 = 102.9\\ \\mathrm{N}$ ดังนั้น $a = \\dfrac{150 - 102.9}{30} = \\dfrac{47.1}{30} = 1.57\\ \\mathrm{m/s^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.fric.p011
    topics: [physics.dynamics.friction]
    difficulty: 4
    type: match
    stem: "กล่องมวล $10\\ \\mathrm{kg}$ บนพื้นราบ มี $\\mu_s = 0.5$ และ $\\mu_k = 0.4$ ($g = 9.8\\ \\mathrm{m/s^2}$) จับคู่สถานการณ์กับขนาดของแรงเสียดทาน"
    pairs:
      - { left: "ไม่มีใครผลักกล่อง", right: "$0\\ \\mathrm{N}$" }
      - { left: "ผลักด้วยแรง $20\\ \\mathrm{N}$ กล่องไม่ขยับ", right: "$20\\ \\mathrm{N}$" }
      - { left: "ผลักจนกล่องกำลังจะเริ่มขยับพอดี", right: "$49\\ \\mathrm{N}$" }
      - { left: "ผลักด้วยแรง $60\\ \\mathrm{N}$ กล่องไถลไป", right: "$39.2\\ \\mathrm{N}$" }
    hints:
      - "หา $N = mg$ ก่อน แล้วคำนวณ $\\mu_s N$ และ $\\mu_k N$"
      - "ขณะกล่องนิ่ง แรงเสียดทานเท่ากับแรงผลัก (แต่ไม่เกิน $\\mu_s N$) ขณะไถลใช้ $\\mu_k N$"
    solution: "$N = 98\\ \\mathrm{N}$ ไม่ผลัก → $0$ · ผลัก $20\\ \\mathrm{N}$ แต่นิ่ง → $20\\ \\mathrm{N}$ · กำลังจะขยับ → $\\mu_s N = 49\\ \\mathrm{N}$ · ไถลแล้ว → $\\mu_k N = 39.2\\ \\mathrm{N}$ (ไม่ขึ้นกับว่าผลักแรงเท่าใด)"
