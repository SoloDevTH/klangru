id: english.grammar.pronouns-possessives
subject: english
title: { th: "สรรพนามและคำแสดงความเป็นเจ้าของ", en: "Pronouns and possessives" }
summary: ใช้สรรพนามประธานและกรรม I me my mine ทุกบุรุษ เติม 's บอกเจ้าของ ชี้ของด้วย this that these those และถามว่าเป็นของใครด้วย whose
difficulty: 1.5
minutes: 30
prerequisites: [english.grammar.be-have-there]
encompasses:
  - { id: english.grammar.be-have-there, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: demonstratives.svg
    alt: "ตารางสี่ช่อง แต่ละช่องมีเด็กชี้ไปที่มะม่วง ช่องบนซ้าย this มะม่วงหนึ่งลูกอยู่ใกล้มือ ช่องบนขวา these มะม่วงสามลูกอยู่ใกล้มือ ช่องล่างซ้าย that มะม่วงหนึ่งลูกอยู่ไกล มีเส้นประเขียนว่า far ช่องล่างขวา those มะม่วงสามลูกอยู่ไกล คอลัมน์ซ้ายเป็นหนึ่งชิ้น (singular) คอลัมน์ขวาเป็นหลายชิ้น (plural)"
    caption: "ใกล้: this (1) these (หลาย) · ไกล: that (1) those (หลาย)"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.grammar.pronouns-possessives.p005, prompt: "ช่องว่างอยู่หลัง with ต้องใช้รูปประธานหรือรูปกรรม" }
  - type: worked-example
    title: เลือก my หรือ mine
    problem: "เติมคำว่า ของฉัน ให้ถูก: *Is this ___ ruler?* — *Yes, it's ___.*"
    steps:
      - text: "ช่องแรกตามด้วยคำนาม ruler จึงใช้รูปที่อยู่หน้าคำนาม: ***my** ruler*"
      - text: "ช่องที่สองไม่มีคำนามตาม จึงใช้รูปยืนเดี่ยว: ***mine***"
        why: "mine = my ruler จึงไม่ต้องพูด ruler ซ้ำ"
      - text: "ตรวจ: *Yes, it's my ruler.* ก็ถูก แต่ *Yes, it's mine.* สั้นกว่า"
    answer: "*Is this **my** ruler?* — *Yes, it's **mine**.*"
  - { type: check, problem: english.grammar.pronouns-possessives.p010, prompt: "ลองอ่าน it's เป็น it is แล้วดูว่าความหมายถูกไหม" }
  - type: worked-example
    title: แนะนำครอบครัวด้วย this และ these
    problem: "ภูมิชี้ภาพครอบครัวในมือ แล้วแนะนำว่า นี่คือพ่อของฉัน พ่อชื่อสมศักดิ์ และนี่คือน้องชายสองคนของฉัน พวกเขาเป็นฝาแฝด"
    steps:
      - text: "พ่อมีคนเดียวและอยู่ในภาพที่ถือ (ใกล้): *This is my father.*"
      - text: "แทน father ด้วย he และบอกชื่อด้วย his: *His name is Somsak.*"
        why: "ชื่อเป็นของพ่อ (ผู้ชาย) ใช้ his ไม่ใช่ he"
      - text: "น้องชายมีสองคน ใช้ these + are + พหูพจน์: *These are my younger brothers.*"
      - text: "แทนน้องชายสองคนด้วย they: *They are twins.*"
    answer: "*This is my father. His name is Somsak. These are my younger brothers. They are twins.*"
glossary:
  - { term: สรรพนามประธาน (subject pronoun), definition: "I, you, he, she, it, we, they ใช้หน้ากริยา เป็นผู้ทำ" }
  - { term: สรรพนามกรรม (object pronoun), definition: "me, you, him, her, it, us, them ใช้หลังกริยาหรือหลังบุพบท" }
  - { term: possessive adjective, definition: "my, your, his, her, its, our, their ใช้หน้าคำนาม บอกว่าเป็นของใคร" }
  - { term: possessive pronoun, definition: "mine, yours, his, hers, ours, theirs ใช้ยืนเดี่ยวแทนคำนาม" }
  - { term: demonstrative, definition: "this, that, these, those ใช้ชี้สิ่งของตามระยะใกล้ไกลและจำนวน" }
flashcards:
  - { front: "I / me / my / mine ของ she คืออะไร", back: "she / her / her / hers" }
  - { front: "This is my pen. = This pen is ___.", back: "mine" }
  - { front: "its กับ it's ต่างกันอย่างไร", back: "its = ของมัน · it's = it is" }
  - { front: "ใกล้+หลายชิ้น / ไกล+หลายชิ้น", back: "these / those" }
  - { front: "ถามว่า \"ร่มคันนี้ของใคร\"", back: "Whose umbrella is this?" }
