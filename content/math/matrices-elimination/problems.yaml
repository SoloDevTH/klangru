  - id: math.linalg.matrices-elimination.p017
    topics: [math.linalg.matrices-elimination]
    difficulty: 4
    type: numeric
    stem: "เมทริกซ์ $R = \\begin{pmatrix} 0 & -1 \\\\ 1 & 0 \\end{pmatrix}$ หมุนจุดรอบจุดกำเนิด $90^\\circ$ ทวนเข็มนาฬิกา หุ่นยนต์ในโรงงานอยู่ที่จุด $(4, 1)$ หลังหมุนด้วย $R$ หุ่นยนต์อยู่ที่พิกัด $y$ เท่าใด"
    answer: { value: 4 }
    hints:
      - "คำนวณ $R\\begin{pmatrix} 4 \\\\ 1 \\end{pmatrix}$"
      - "พิกัด $y$ คือแถวที่ 2: $1(4) + 0(1)$"
    misconceptions:
      - { match: -1, feedback: "นี่คือพิกัด $x$ ใหม่ (แถวที่ 1)" }
      - { match: 1, feedback: "นี่คือพิกัด $y$ เดิม ต้องคูณด้วยเมทริกซ์ก่อน" }
    solution: "$R\\begin{pmatrix} 4 \\\\ 1 \\end{pmatrix} = \\begin{pmatrix} 0(4) - 1(1) \\\\ 1(4) + 0(1) \\end{pmatrix} = \\begin{pmatrix} -1 \\\\ 4 \\end{pmatrix}$ พิกัด $y = 4$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.linalg.matrices-elimination.p018
    topics: [math.linalg.matrices-elimination]
    difficulty: 5
    type: numeric
    stem: "ระบบ $x + 2y + z = 1$, $2x + ky + z = 0$, $x + y + 2z = 3$ ไม่มีคำตอบเดียว (มีคำตอบเดียวไม่ได้) เมื่อ $k$ เท่าใด"
    answer: { value: 5 }
    hints:
      - "ระบบมีคำตอบเดียวก็ต่อเมื่อดีเทอร์มิแนนต์ของเมทริกซ์สัมประสิทธิ์ไม่เป็นศูนย์"
      - "$\\det\\begin{pmatrix} 1 & 2 & 1 \\\\ 2 & k & 1 \\\\ 1 & 1 & 2 \\end{pmatrix}$ กระจายตามแถวแรก"
    misconceptions:
      - { match: -5, feedback: "ดีเทอร์มิแนนต์คือ $k - 5$ จึงเป็นศูนย์เมื่อ $k = 5$" }
    solution: "$\\det = 1(2k - 1) - 2(4 - 1) + 1(2 - k) = 2k - 1 - 6 + 2 - k = k - 5$ เป็นศูนย์เมื่อ $k = 5$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.linalg.matrices-elimination.p019
    topics: [math.linalg.matrices-elimination]
    difficulty: 5
    type: numeric
    stem: "$A$ และ $B$ เป็นเมทริกซ์ $3 \\times 3$ ที่ $\\det A = 4$ และ $\\det B = -3$ จงหา $\\det(A^{-1}B^T)$"
    answer: { value: -0.75, tolerance: 0.001 }
    hints:
      - "$\\det(XY) = \\det X \\cdot \\det Y$"
      - "$\\det A^{-1} = \\dfrac{1}{\\det A}$ และ $\\det B^T = \\det B$"
    misconceptions:
      - { match: -12, feedback: "$\\det A^{-1}$ คือ $\\tfrac14$ ไม่ใช่ 4" }
      - { match: 0.75, feedback: "$\\det B^T = \\det B = -3$ เครื่องหมายไม่เปลี่ยนเมื่อสลับเปลี่ยน" }
    solution: "$\\det(A^{-1}B^T) = \\dfrac{1}{\\det A} \\cdot \\det B = \\dfrac{-3}{4} = -0.75$"
    license: CC-BY-SA-4.0
    ai_assisted: true

