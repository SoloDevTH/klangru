problems:
- id: science.nature.nature-of-science.p001
  topics:
  - science.nature.nature-of-science
  difficulty: 1
  type: numeric
  stem: วันวิทยาศาสตร์แห่งชาติของไทยตรงกับวันที่เท่าใดของเดือนสิงหาคม
  answer:
    value: 18
  misconceptions: []
  hints:
  - เป็นวันที่รัชกาลที่ 4 ทอดพระเนตรสุริยุปราคาที่หว้ากอ
  - ตรงกับปี พ.ศ. 2411
  solution: วันที่ **18 สิงหาคม** พ.ศ. 2411 รัชกาลที่ 4 ทอดพระเนตรสุริยุปราคาเต็มดวงที่หว้ากอตามที่ทรงคำนวณไว้ล่วงหน้า
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.nature.nature-of-science.p002
  topics:
  - science.nature.nature-of-science
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็น **การสังเกต** ไม่ใช่การลงความเห็น
  choices:
  - id: a
    text: ใบของต้นมะลิที่หน้าห้องมีสีเหลือง
    correct: true
  - id: b
    text: ต้นมะลิขาดน้ำ
    feedback: เป็นการอธิบายสาเหตุจากสิ่งที่เห็น จึงเป็นการลงความเห็น
  - id: c
    text: ต้นมะลิกำลังจะตาย
    feedback: เป็นการคาดเดาจากสิ่งที่เห็น ไม่ใช่สิ่งที่รับรู้ได้โดยตรง
  - id: d
    text: ภารโรงลืมรดน้ำ
    feedback: เป็นการลงความเห็นเรื่องสาเหตุ
  hints:
  - การสังเกตคือสิ่งที่รับรู้ได้ด้วยประสาทสัมผัสโดยตรง
  - การลงความเห็นคือการอธิบายหรือบอกสาเหตุ
  solution: สีเหลืองของใบมองเห็นได้โดยตรงจึงเป็นการสังเกต ส่วนข้ออื่นเป็นคำอธิบายที่ต้องหาหลักฐานเพิ่ม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.nature.nature-of-science.p003
  topics:
  - science.nature.nature-of-science
  difficulty: 2
  type: match
  stem: จับคู่เทคโนโลยีกับความรู้ทางวิทยาศาสตร์ที่เทคโนโลยีนั้นช่วยให้ค้นพบ
  pairs:
  - left: กล้องจุลทรรศน์
    right: สิ่งมีชีวิตประกอบด้วยเซลล์
  - left: กล้องโทรทรรศน์
    right: ดาวพฤหัสบดีมีดวงจันทร์บริวาร
  - left: สเปกโทรสโคป
    right: ธาตุฮีเลียมในดวงอาทิตย์
  - left: เครื่องวัดแผ่นดินไหว
    right: โลกมีชั้นภายในหลายชั้น
  hints:
  - เครื่องมือแต่ละชิ้นช่วยให้เห็นสิ่งที่ตาเปล่าเห็นไม่ได้
  - สเปกโทรสโคปแยกแสงเป็นสเปกตรัม
  solution: เทคโนโลยีขยายประสาทสัมผัสของมนุษย์ ทำให้ได้ข้อมูลใหม่ ความรู้วิทยาศาสตร์จึงก้าวหน้าตามเครื่องมือ (คลื่นแผ่นดินไหวกับโครงสร้างโลกดูใน [ธรณีแปรสัณฐาน](/topic/earthscience.geology.plate-tectonics/))
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.nature.nature-of-science.p004
  topics:
  - science.nature.nature-of-science
  difficulty: 2
  type: order
  stem: เรียงเส้นทางของผลงานวิจัยจนเป็นความรู้ที่ได้รับการยอมรับ
  items:
  - ทำวิจัยและวิเคราะห์ข้อมูล
  - เขียนบทความส่งวารสาร
  - ผู้ทรงคุณวุฒิตรวจวิธีการและเหตุผล
  - ตีพิมพ์เผยแพร่
  - นักวิทยาศาสตร์คนอื่นทำซ้ำและยืนยันผล
  hints:
  - ผู้ทรงคุณวุฒิตรวจก่อนตีพิมพ์
  - การทำซ้ำเกิดหลังจากคนอื่นได้อ่านผลงาน
  solution: วิจัย → เขียนบทความ → การทบทวนโดยผู้ทรงคุณวุฒิ → ตีพิมพ์ → คนอื่นทำซ้ำ ถ้าทำซ้ำได้ผลเหมือนกัน ความรู้นั้นจึงได้รับการยอมรับมากขึ้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.nature.nature-of-science.p005
  topics:
  - science.nature.nature-of-science
  difficulty: 2
  type: mcq
  stem: คำว่า **ทฤษฎี** ในวิทยาศาสตร์ หมายถึงข้อใด
  choices:
  - id: a
    text: คำอธิบายว่าทำไมปรากฏการณ์จึงเกิด ซึ่งผ่านการทดสอบด้วยหลักฐานจำนวนมาก
    correct: true
  - id: b
    text: การเดาที่ยังไม่มีหลักฐาน
    feedback: นั่นคือความหมายในภาษาพูด ไม่ใช่ความหมายทางวิทยาศาสตร์
  - id: c
    text: กฎที่ยังพิสูจน์ไม่เสร็จ เมื่อพิสูจน์เสร็จจะกลายเป็นกฎ
    feedback: ทฤษฎีกับกฎทำหน้าที่ต่างกัน ทฤษฎีไม่ได้กลายเป็นกฎ
  - id: d
    text: ความรู้ที่ถูกต้องตลอดไปและเปลี่ยนไม่ได้
    feedback: ทฤษฎีปรับได้เมื่อมีหลักฐานใหม่
  hints:
  - กฎบอกว่าอะไรเกิดขึ้น ทฤษฎีบอกว่าทำไม
  - ทฤษฎีวิวัฒนาการและทฤษฎีเซลล์มีหลักฐานมากมาย
  solution: ทฤษฎีทางวิทยาศาสตร์คือคำอธิบายที่ผ่านการทดสอบมาก ส่วนกฎบรรยายแบบรูปที่เกิดขึ้นเสมอ ทั้งสองปรับได้เมื่อมีหลักฐานใหม่
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.nature.nature-of-science.p006
  topics:
  - science.nature.nature-of-science
  difficulty: 2
  type: text
  stem: กระบวนการที่นักวิทยาศาสตร์ในสาขาเดียวกันตรวจผลงานก่อนตีพิมพ์ในวารสาร เรียกว่า "การทบทวนโดย..." (ตอบคำที่ขาด)
  accepted:
  - ผู้ทรงคุณวุฒิ
  - peer review
  - การทบทวนโดยผู้ทรงคุณวุฒิ
  misconceptions:
  - match: บรรณาธิการ
    feedback: บรรณาธิการส่งต่อบทความ แต่ผู้ตรวจเนื้อหาคือผู้ทรงคุณวุฒิในสาขาเดียวกัน
  - match: ประชาชน
    feedback: ประชาชนอ่านผลงานหลังตีพิมพ์ ไม่ใช่ผู้ตรวจก่อนตีพิมพ์
  hints:
  - ภาษาอังกฤษเรียกว่า peer review
  - ผู้ตรวจคือผู้มีความรู้ในสาขาเดียวกัน
  solution: '**การทบทวนโดยผู้ทรงคุณวุฒิ (peer review)** ช่วยกรองข้อผิดพลาดของวิธีการ ข้อมูล และเหตุผลก่อนเผยแพร่'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.nature.nature-of-science.p007
  topics:
  - science.nature.nature-of-science
  difficulty: 2
  type: numeric
  stem: จากภาพ ดาวพลูโตถูกนับเป็นดาวเคราะห์ตั้งแต่ปีที่ค้นพบจนถึงปีที่สหพันธ์ดาราศาสตร์สากลกำหนดนิยามใหม่ เป็นเวลากี่ปี
  answer:
    value: 76
    unit: ปี
  misconceptions: []
  hints:
  - ดูปีที่ค้นพบและปีที่นิยามใหม่ในภาพ
  - นำปีหลังลบปีแรก
  solution: $2549 - 2473 = 76$ ปี ความรู้ที่ใช้มานานก็ปรับได้เมื่อมีข้อมูลใหม่
  figure:
    src: changes.svg
    alt: 'ตารางสามแถว แผลในกระเพาะ: เชื่อว่าเกิดจากความเครียดและอาหาร → พ.ศ. 2525 พบเชื้อ H. pylori → 2548 รางวัลโนเบล รักษาด้วยยาฆ่าเชื้อ ทวีป: เชื่อว่าทวีปอยู่กับที่ → 2455 เวเกเนอร์เสนอทวีปเลื่อน → 2503–2512 หลักฐานพื้นสมุทร นำไปสู่ธรณีแปรสัณฐาน ดาวพลูโต: 2473 ค้นพบ นับเป็นดาวเคราะห์ → พบวัตถุขนาดใกล้เคียงหลายดวง → 2549 นิยามใหม่ เป็นดาวเคราะห์แคระ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.nature.nature-of-science.p008
  topics:
  - science.nature.nature-of-science
  difficulty: 3
  type: mcq
  stem: เรื่องเชื้อ *เฮลิโคแบคเตอร์ ไพโลไร* กับแผลในกระเพาะอาหาร แสดงลักษณะของวิทยาศาสตร์ข้อใดชัดเจนที่สุด
  choices:
  - id: a
    text: ความรู้เดิมเปลี่ยนได้เมื่อมีหลักฐานใหม่ที่ผ่านการทดสอบและยืนยันซ้ำ
    correct: true
  - id: b
    text: ความเชื่อของคนส่วนใหญ่ถูกเสมอ
    feedback: ความเชื่อเดิมว่าเกิดจากความเครียดถูกแก้ไขด้วยหลักฐาน
  - id: c
    text: วิทยาศาสตร์เชื่อถือไม่ได้เพราะเคยผิด
    feedback: การแก้ไขความรู้ด้วยหลักฐานคือจุดแข็งของวิทยาศาสตร์
  - id: d
    text: ความรู้ใหม่ได้รับการยอมรับทันทีที่มีคนเสนอ
    feedback: ตอนแรกมีคนเชื่อน้อย ต้องมีหลักฐานเพิ่มและการยืนยันซ้ำ
  hints:
  - ก่อนปี 2525 คนเชื่อว่าแผลเกิดจากอะไร
  - ความเชื่อนั้นเปลี่ยนไปเพราะอะไร
  solution: หลักฐานใหม่ (พบเชื้อ ทดลอง และงานอื่นยืนยันซ้ำ) ทำให้คำอธิบายเดิมเปลี่ยน และนำไปสู่การรักษาด้วยยาฆ่าเชื้อ แสดงว่าวิทยาศาสตร์แก้ไขตัวเองได้
  figure:
    src: changes.svg
    alt: 'ตารางสามแถว แผลในกระเพาะ: เชื่อว่าเกิดจากความเครียดและอาหาร → พ.ศ. 2525 พบเชื้อ H. pylori → 2548 รางวัลโนเบล รักษาด้วยยาฆ่าเชื้อ ทวีป: เชื่อว่าทวีปอยู่กับที่ → 2455 เวเกเนอร์เสนอทวีปเลื่อน → 2503–2512 หลักฐานพื้นสมุทร นำไปสู่ธรณีแปรสัณฐาน ดาวพลูโต: 2473 ค้นพบ นับเป็นดาวเคราะห์ → พบวัตถุขนาดใกล้เคียงหลายดวง → 2549 นิยามใหม่ เป็นดาวเคราะห์แคระ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.nature.nature-of-science.p009
  topics:
  - science.nature.nature-of-science
  difficulty: 3
  type: mcq
  stem: ลูกโลกจำลองในห้องเรียนเป็นแบบจำลองของโลก ข้อใดเป็น **ข้อจำกัด** ของแบบจำลองนี้
  choices:
  - id: a
    text: ไม่แสดงชั้นภายในของโลกและภูเขาก็สูงไม่ตรงตามสัดส่วนจริง
    correct: true
  - id: b
    text: แสดงตำแหน่งของประเทศต่าง ๆ
    feedback: นั่นคือประโยชน์ของลูกโลก ไม่ใช่ข้อจำกัด
  - id: c
    text: มีรูปทรงกลม
    feedback: โลกมีรูปเกือบทรงกลม ลูกโลกจึงแสดงข้อนี้ได้ดี
  - id: d
    text: หมุนรอบแกนได้
    feedback: ช่วยอธิบายกลางวันกลางคืน เป็นประโยชน์ของแบบจำลอง
  hints:
  - แบบจำลองเป็นตัวแทนของจริงแต่ไม่เหมือนทุกอย่าง
  - อะไรที่ลูกโลกบอกเราไม่ได้
  solution: แบบจำลองทุกแบบมีทั้งประโยชน์และข้อจำกัด ลูกโลกแสดงตำแหน่งและการหมุนได้ แต่ไม่แสดงโครงสร้างภายใน จึงต้องใช้แบบจำลองอื่นร่วมด้วย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.nature.nature-of-science.p010
  topics:
  - science.nature.nature-of-science
  difficulty: 3
  type: mcq
  stem: ชาวประมงในหมู่บ้านริมทะเลรู้มานานว่าช่วงขึ้น 15 ค่ำและแรม 15 ค่ำน้ำขึ้นสูงและลงต่ำมาก ข้อใดเป็นมุมมองที่เหมาะสมที่สุดต่อความรู้นี้
  choices:
  - id: a
    text: เป็นความรู้จากการสังเกตที่วิทยาศาสตร์อธิบายได้ด้วยแรงโน้มถ่วงของดวงจันทร์และดวงอาทิตย์ จึงควรเคารพและใช้ร่วมกัน
    correct: true
  - id: b
    text: เป็นความเชื่อที่ไม่มีหลักฐาน ควรเลิกใช้
    feedback: ความรู้นี้มาจากการสังเกตซ้ำเป็นเวลานาน และตรวจสอบได้ด้วยข้อมูลระดับน้ำ
  - id: c
    text: ภูมิปัญญาท้องถิ่นถูกเสมอ ไม่ต้องตรวจสอบ
    feedback: ความรู้ทุกแบบควรตรวจสอบด้วยหลักฐาน ภูมิปัญญาบางอย่างก็ต้องปรับเมื่อมีข้อมูลใหม่
  - id: d
    text: ใช้ได้เฉพาะหมู่บ้านนี้ ที่อื่นไม่เกิด
    feedback: ปรากฏการณ์น้ำเกิดทุกชายฝั่ง แม้ระดับน้ำแต่ละที่จะต่างกัน
  hints:
  - ภูมิปัญญาท้องถิ่นได้มาจากอะไร
  - วิทยาศาสตร์อธิบายน้ำขึ้นน้ำลงอย่างไร
  solution: ภูมิปัญญาเกิดจากการสังเกตธรรมชาติเป็นเวลานาน วิทยาศาสตร์อธิบายว่าเมื่อดวงอาทิตย์ ดวงจันทร์ และโลกเรียงกัน แรงไทดัลรวมกันจึงเกิดน้ำเกิด ทั้งสองแบบเสริมกันเมื่อเคารพกันและตัดสินด้วยหลักฐาน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.nature.nature-of-science.p011
  topics:
  - science.nature.nature-of-science
  difficulty: 4
  type: mcq
  stem: ใน พ.ศ. 2532 มีนักวิจัยประกาศว่าทำ "ฟิวชันเย็น" ได้ในขวดทดลอง แต่ข้อกล่าวอ้างนี้ไม่ได้รับการยอมรับ เพราะเหตุใด
  choices:
  - id: a
    text: ห้องปฏิบัติการอื่นทั่วโลกทำซ้ำแล้วไม่ได้ผลเหมือนกัน
    correct: true
  - id: b
    text: เพราะนักวิจัยไม่มีชื่อเสียง
    feedback: การยอมรับขึ้นกับหลักฐาน ไม่ใช่ชื่อเสียงของผู้เสนอ
  - id: c
    text: เพราะเรื่องนี้ขัดกับความเชื่อทางศาสนา
    feedback: ประเด็นอยู่ที่ไม่มีใครทำซ้ำได้
  - id: d
    text: เพราะยังไม่มีใครเขียนข่าว
    feedback: ข่าวลงมากมาย แต่ข่าวไม่ใช่หลักฐานทางวิทยาศาสตร์
  hints:
  - หลังตีพิมพ์ คนอื่นต้องทำอะไรกับผลงาน
  - ผลที่ดีต้องเกิดซ้ำได้
  solution: ผลทางวิทยาศาสตร์ต้องทำซ้ำได้ เมื่อนักวิทยาศาสตร์ทั่วโลกทำซ้ำไม่ได้ ข้อกล่าวอ้างจึงไม่ได้รับการยอมรับ แม้จะได้ลงข่าวมาก
