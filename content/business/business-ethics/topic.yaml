id: business.ethics.business-ethics
subject: business
title: { th: จริยธรรมทางธุรกิจและความรับผิดชอบต่อสังคม, en: Business ethics and corporate social responsibility }
summary: จริยธรรมกับกฎหมาย หลักการพื้นฐานของจรรยาบรรณวิชาชีพบัญชี ความขัดแย้งทางผลประโยชน์ การตัดสินใจเชิงจริยธรรม ความรับผิดชอบต่อสังคมและความยั่งยืน
difficulty: 4
minutes: 35
prerequisites: [management.principles.functions, business.accounting.equation]
encompasses:
  - { id: management.principles.functions, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - { type: check, problem: business.ethics.business-ethics.p003, prompt: "ถูกกฎหมายเสมอไปหรือไม่ว่าถูกจริยธรรม" }
  - type: figure
    src: decision-steps.svg
    alt: "ผังห้าขั้นเรียงจากซ้ายไปขวา 1 รวบรวมข้อเท็จจริง 2 ระบุประเด็นและผู้มีส่วนได้เสีย 3 หาทางเลือกให้ครบ 4 ประเมินด้วยกฎหมาย จรรยาบรรณ และผลกระทบ 5 ตัดสินใจ ลงมือ และบันทึก ด้านล่างมีคำถามทดสอบว่าถ้าเรื่องนี้ลงข่าวพรุ่งนี้ เราจะอธิบายได้อย่างสบายใจหรือไม่"
    caption: "ขั้นตอนการตัดสินใจเชิงจริยธรรม"
  - type: worked-example
    title: นักบัญชีถูกขอให้เลื่อนบันทึกค่าใช้จ่าย
    problem: "มายด์เป็นนักบัญชีของบริษัทผลิตน้ำพริกแห่งหนึ่ง (บริษัทสมมติ) ปลายปีผู้จัดการบอกให้เลื่อนบันทึกค่าซ่อมเครื่องจักร $60{,}000$ บาทที่เกิดขึ้นแล้วในปีนี้ไปบันทึกปีหน้า เพื่อให้กำไรปีนี้ถึงเป้าและพนักงานได้โบนัส มายด์ควรทำอย่างไร"
    steps:
      - text: "ข้อเท็จจริง: ค่าซ่อมเกิดขึ้นแล้วในปีนี้ ต้องเป็นค่าใช้จ่ายของปีนี้ การเลื่อนไปทำให้กำไรปีนี้สูงเกินจริง $60{,}000$ บาท"
        why: "ค่าใช้จ่ายต้องบันทึกในงวดที่เกิดขึ้น ไม่ใช่งวดที่สะดวก"
      - text: "ผู้มีส่วนได้ส่วนเสีย: เจ้าของและผู้ถือหุ้น ธนาคารที่ปล่อยกู้ กรมสรรพากร พนักงาน และตัวมายด์เอง"
      - text: "หลักการที่เกี่ยวข้อง: ความซื่อสัตย์สุจริตและความโปร่งใส (ห้ามบิดเบือนตัวเลข) ส่วนคำสั่งของผู้จัดการเป็นอุปสรรคจากการถูกข่มขู่ และโบนัสเป็นอุปสรรคจากผลประโยชน์ส่วนตน"
      - text: "ทางเลือก: (ก) ทำตามคำสั่ง (ข) บันทึกตามจริงเงียบ ๆ (ค) อธิบายผู้จัดการด้วยหลักการบัญชีและเสนอทางออก เช่น ชี้แจงสาเหตุที่กำไรไม่ถึงเป้าในรายงาน ถ้ายังถูกกดดันให้แจ้งผู้มีหน้าที่กำกับดูแลตามช่องทางของบริษัท"
      - text: "ประเมิน: (ก) ผิดจรรยาบรรณ (ข) ถูกแต่ไม่แก้ปัญหาความสัมพันธ์ (ค) ถูกต้องและเปิดเผย จึงเลือก (ค) และบันทึกการหารือไว้"
        why: "การบันทึกเหตุผลและการหารือช่วยปกป้องตัวผู้ประกอบวิชาชีพเองหากมีปัญหาภายหลัง"
    answer: "บันทึกค่าซ่อม $60{,}000$ บาทในปีนี้ตามจริง อธิบายผู้จัดการ และถ้ายังถูกกดดันให้แจ้งตามช่องทางกำกับดูแลของบริษัท"
  - type: figure
    src: csr-pyramid.svg
    alt: "พีระมิดสี่ชั้น ฐานล่างสุดคือความรับผิดชอบทางเศรษฐกิจ มีกำไร อยู่รอด จ้างงาน ผลิตของที่คนต้องการ ชั้นที่สองคือความรับผิดชอบทางกฎหมาย ทำตามกฎหมาย เช่น แรงงาน ภาษี สิ่งแวดล้อม ชั้นที่สามคือความรับผิดชอบเชิงจริยธรรม ทำสิ่งที่ถูกและเป็นธรรมแม้ไม่มีกฎหมายบังคับ ยอดบนสุดคือความรับผิดชอบเชิงการให้ เช่น บริจาค อาสา ช่วยชุมชน"
    caption: "พีระมิดความรับผิดชอบต่อสังคม (แนวคิดของ Carroll)"
  - { type: check, problem: business.ethics.business-ethics.p011, prompt: "CSR แบบใดอยู่ในกระบวนการทำธุรกิจ" }
glossary:
  - { term: จริยธรรมทางธุรกิจ, definition: "หลักความประพฤติที่ถูกต้องดีงามในการทำธุรกิจ ต่อลูกค้า พนักงาน คู่ค้า ชุมชน และสิ่งแวดล้อม" }
  - { term: จรรยาบรรณวิชาชีพ, definition: "หลักจริยธรรมที่องค์กรวิชาชีพกำหนดให้สมาชิกปฏิบัติ" }
  - { term: ความขัดแย้งทางผลประโยชน์, definition: "สถานการณ์ที่ประโยชน์ส่วนตัวอาจขัดกับหน้าที่ต่อองค์กรหรือผู้อื่น ต้องเปิดเผยและไม่ร่วมตัดสินใจ" }
  - { term: ความเที่ยงธรรม, definition: "การใช้ดุลยพินิจโดยไม่ถูกอคติ ผลประโยชน์ หรืออิทธิพลของผู้อื่นครอบงำ" }
  - { term: ความรับผิดชอบต่อสังคม (CSR), definition: "การดำเนินธุรกิจโดยคำนึงถึงผลกระทบต่อสังคมและสิ่งแวดล้อม ทั้งในกระบวนการและนอกกระบวนการ" }
  - { term: ความยั่งยืน, definition: "การดำเนินงานที่ดูแลคน สิ่งแวดล้อม และกำไรไปพร้อมกัน โดยไม่ทำให้คนรุ่นหลังเสียโอกาส" }
flashcards:
  - { front: "หลักการพื้นฐาน 6 ข้อของจรรยาบรรณวิชาชีพบัญชี", back: "ซื่อสัตย์สุจริต · เที่ยงธรรมและเป็นอิสระ · ความรู้ความสามารถและความเอาใจใส่ · รักษาความลับ · พฤติกรรมทางวิชาชีพ · ความโปร่งใส" }
  - { front: "อุปสรรค 5 แบบต่อการปฏิบัติตามจรรยาบรรณ", back: "ผลประโยชน์ส่วนตน · สอบทานผลงานตนเอง · เป็นผู้ให้การสนับสนุน · ความคุ้นเคย · ถูกข่มขู่" }
  - { front: "พบความขัดแย้งทางผลประโยชน์ต้องทำอย่างไร", back: "เปิดเผย ไม่ร่วมตัดสินใจในเรื่องนั้น และทำตามนโยบายขององค์กร" }
  - { front: "CSR ในกระบวนการ ต่างจาก นอกกระบวนการ อย่างไร", back: "ในกระบวนการคือทำธุรกิจหลักอย่างรับผิดชอบ (บำบัดน้ำเสีย ค่าจ้างเป็นธรรม) นอกกระบวนการคือกิจกรรมเพิ่มเติม (บริจาค ปลูกป่า)" }
