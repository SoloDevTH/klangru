      - "เป้าหมายคือลดจำนวนและไม่ให้แพร่ต่อ"
    solution: "ปลาหมอคางดำแพร่พันธุ์เร็วและกินลูกปลาพื้นถิ่น การจับขึ้นมาใช้ประโยชน์และไม่ปล่อยกลับช่วยลดจำนวนและหยุดการแพร่กระจาย"
