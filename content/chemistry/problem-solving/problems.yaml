problems:
  - id: chemistry.practice.problem-solving.p001
    topics: [chemistry.practice.problem-solving]
    difficulty: 1
    type: order
    stem: "เรียงขั้นตอนการแก้ปัญหาด้วยความรู้เคมีตามกระบวนการออกแบบเชิงวิศวกรรม"
    items:
      - "ระบุปัญหา เกณฑ์ และข้อจำกัด"
      - "รวบรวมข้อมูลและความรู้ที่เกี่ยวข้อง"
      - "เสนอทางเลือกและเลือกวิธีที่ดีที่สุด"
      - "วางแผนและคำนวณปริมาณสาร"
      - "ทดสอบ ประเมินผล และปรับปรุง"
      - "นำเสนอผลงาน"
    hints:
      - "ต้องรู้ว่าปัญหาคืออะไรก่อนหาข้อมูล"
      - "ทดสอบได้ก็ต่อเมื่อมีแผนแล้ว และนำเสนอเมื่อได้ผลแล้ว"
    solution: "ระบุปัญหา → รวบรวมข้อมูล → เสนอและเลือกวิธี → วางแผนและคำนวณ → ทดสอบและปรับปรุง → นำเสนอ (ถ้าไม่ผ่านเกณฑ์ วนกลับไปปรับวิธีแล้วทดสอบใหม่)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.practice.problem-solving.p002
    topics: [chemistry.practice.problem-solving]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นการกำหนดปัญหาที่ชัดเจนและวัดผลได้ดีที่สุด"
    choices:
      - { id: a, text: "ลดปริมาณเหล็กในน้ำบาดาลของโรงเรียนจาก 3.0 mg/L ให้ต่ำกว่า 0.3 mg/L ภายในงบ 5,000 บาท", correct: true, feedback: "ถูก บอกสิ่งที่ต้องเปลี่ยน วิธีวัด เป้าหมาย และข้อจำกัด" }
      - { id: b, text: "ทำให้น้ำบาดาลของโรงเรียนสะอาดขึ้น", feedback: "คำว่าสะอาดขึ้นวัดไม่ได้ ไม่รู้ว่าเมื่อใดจึงแก้ปัญหาสำเร็จ" }
      - { id: c, text: "ซื้อเครื่องกรองน้ำที่ดีที่สุด", feedback: "นี่คือการเลือกวิธีแก้ก่อนกำหนดปัญหา และไม่บอกเป้าหมาย" }
    hints:
      - "ปัญหาที่ดีมีตัวเลขเป้าหมาย"
      - "ควรระบุข้อจำกัด เช่น งบประมาณด้วย"
    solution: "ข้อที่บอก **สิ่งที่วัด (เหล็ก mg/L) ค่าเริ่มต้น เป้าหมาย และข้อจำกัด** คือปัญหาที่ชัดเจนและวัดผลได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.practice.problem-solving.p003
    topics: [chemistry.practice.problem-solving]
    difficulty: 2
    type: mcq
    stem: "ต้องเจือจางกรดซัลฟิวริกเข้มข้นเพื่อเตรียมสารละลายทดสอบ วิธีใดปลอดภัยที่สุด"
    choices:
      - { id: a, text: "สวมแว่นตานิรภัยและถุงมือ เทกรดลงในน้ำช้า ๆ พร้อมคน ในตู้ดูดควันหรือที่อากาศถ่ายเท", correct: true, feedback: "ถูก น้ำปริมาณมากรับความร้อนที่เกิดขึ้นได้ กรดจึงไม่กระเด็น" }
      - { id: b, text: "เทน้ำลงในกรดเข้มข้นอย่างรวดเร็ว", feedback: "น้ำที่หยดลงบนกรดเข้มข้นร้อนจัดจนเดือดและกระเด็น อันตรายมาก" }
      - { id: c, text: "เทกรดและน้ำพร้อมกันลงในขวดแล้วปิดฝาเขย่า", feedback: "ความร้อนและความดันในขวดปิดอาจทำให้ขวดแตกหรือกรดพุ่ง" }
    hints:
      - "การละลายกรดซัลฟิวริกในน้ำคายความร้อนมาก"
      - "อะไรควรอยู่ในภาชนะก่อน และมีปริมาณมาก"
    solution: "**เทกรดลงในน้ำช้า ๆ พร้อมคน** สวมอุปกรณ์ป้องกัน น้ำปริมาณมากดูดซับความร้อนได้ ส่วนการเทน้ำลงในกรดทำให้เดือดและกระเด็น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.practice.problem-solving.p004
    topics: [chemistry.practice.problem-solving]
    difficulty: 3
    type: numeric
    stem: "น้ำเสีย 5.0 m³ มีกรดไฮโดรคลอริก 0.020 mol/L ต้องใช้ปูนขาว $\\mathrm{Ca(OH)_2}$ (บริสุทธิ์ 100% มวลโมเลกุล 74.1) อย่างน้อยกี่กิโลกรัมจึงสะเทินพอดี ตามสมการ $\\mathrm{2HCl + Ca(OH)_2 \\to CaCl_2 + 2H_2O}$"
    answer: { value: 3.7, unit: kg, tolerance: 0.04 }
    misconceptions:
      - { match: 7.41, feedback: "ใช้อัตราส่วน 1 : 1 แต่ปูนขาว 1 mol สะเทิน HCl ได้ 2 mol" }
      - { match: 0.0037, feedback: "ลืมแปลง m³ เป็นลิตร 1 m³ = 1,000 L" }
    hints:
      - "5.0 m³ = 5,000 L หาโมลของ HCl"
      - "โมลปูนขาว = โมล HCl ÷ 2 แล้วคูณมวลโมเลกุล"
    solution: "HCl $= 5000 \\times 0.020 = 100$ mol ปูนขาว $= 100 \\div 2 = 50$ mol มวล $= 50 \\times 74.1 = 3705$ g ≈ **3.7 kg**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.practice.problem-solving.p005
    topics: [chemistry.practice.problem-solving]
    difficulty: 3
    type: numeric
    stem: "ทีมให้น้ำหนักเกณฑ์ ราคา 0.4 ความปลอดภัย 0.4 ผลต่อสิ่งแวดล้อม 0.2 ทางเลือก B ได้คะแนน (เต็ม 5) ราคา 5 ความปลอดภัย 2 สิ่งแวดล้อม 3 คะแนนรวมแบบถ่วงน้ำหนักของทางเลือก B เป็นเท่าใด"
    answer: { value: 3.4, tolerance: 0.01 }
    misconceptions:
      - { match: 3.33, feedback: "หาค่าเฉลี่ยธรรมดา แต่โจทย์ให้ถ่วงน้ำหนัก ต้องคูณคะแนนกับน้ำหนักก่อนรวม" }
      - { match: 10, feedback: "รวมคะแนนโดยไม่คูณน้ำหนัก" }
    hints:
      - "คูณคะแนนแต่ละเกณฑ์ด้วยน้ำหนักของเกณฑ์นั้น"
      - "นำผลคูณทั้งสามมารวมกัน"
    solution: "$0.4(5) + 0.4(2) + 0.2(3) = 2.0 + 0.8 + 0.6 =$ **3.4** ถ้าทางเลือก A ได้ 3, 5, 4 จะได้ 4.0 ซึ่งสูงกว่า แม้ B จะถูกกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.practice.problem-solving.p006
    topics: [chemistry.practice.problem-solving]
    difficulty: 4
    type: mcq
    stem: "ผลทดสอบเติมปูนขาวในน้ำเสีย 1 ลิตรเป็นดังกราฟ (ข้อมูลสมมติ) พนักงานเสนอว่า \"เติม 0.80 g ต่อลิตรไปเลย จะได้แน่ใจว่ากรดหมด\" ข้อใดประเมินข้อเสนอนี้ได้ถูกต้อง"
    figure:
      src: p-lime-ph.svg
      alt: "กราฟ pH (แกนตั้ง 0–14) กับมวลปูนขาวที่เติม (แกนนอน 0–1.0 g) มีแถบสีเขียวที่ pH 5.5 ถึง 9.0 เขียนว่าเกณฑ์ปล่อยน้ำทิ้ง จุดข้อมูล: 0 g pH 1.7, 0.2 g pH 1.8, 0.4 g pH 2.0, 0.6 g pH 2.4, 0.7 g pH 3.0, 0.8 g pH 11.2, 0.9 g pH 11.6, 1.0 g pH 11.8 เส้นกราฟเกือบตั้งฉากระหว่าง 0.7 ถึง 0.8 g ผ่านแถบเกณฑ์ในช่วงแคบมากใกล้ 0.74 g"
    choices:
      - { id: a, text: "ไม่เหมาะ ที่ 0.80 g pH ราว 11 เกินเกณฑ์ 9.0 เพราะ pH เปลี่ยนเร็วมากใกล้จุดสะเทิน ควรเติมทีละน้อยพร้อมวัด pH", correct: true, feedback: "ถูก การเติมเกินทำให้น้ำเป็นเบสเกินเกณฑ์ จึงต้องควบคุมการเติม" }
      - { id: b, text: "เหมาะสม เพราะยิ่งเติมมาก น้ำยิ่งปลอดภัย", feedback: "น้ำที่เป็นเบสแรงก็ผิดมาตรฐานและเป็นอันตรายต่อสัตว์น้ำเช่นกัน" }
      - { id: c, text: "ควรเติมเพียง 0.40 g เพราะเป็นครึ่งหนึ่งของ 0.80 g", feedback: "ที่ 0.40 g pH ยังราว 2 กรดยังไม่ถูกสะเทิน" }
    hints:
      - "อ่านค่า pH ที่ 0.80 g จากกราฟ"
      - "เทียบกับแถบเกณฑ์ 5.5–9.0"
    solution: "ที่ 0.80 g กราฟให้ **pH ราว 11** ซึ่งเกินเกณฑ์ pH พุ่งขึ้นเร็วมากระหว่าง 0.7 ถึง 0.8 g จึงต้องเติมทีละน้อยพร้อมวัด pH หรือใช้ระบบควบคุมอัตโนมัติ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.practice.problem-solving.p007
    topics: [chemistry.practice.problem-solving]
    difficulty: 4
    type: numeric
    stem: "ต้องสะเทินกรดซัลฟิวริก 100 mol ด้วยหินปูนบดที่มี $\\mathrm{CaCO_3}$ 85% โดยมวล (มวลโมเลกุล $\\mathrm{CaCO_3}$ 100.1) ตามสมการ $\\mathrm{H_2SO_4 + CaCO_3 \\to CaSO_4 + H_2O + CO_2}$ ต้องใช้หินปูนบดกี่กิโลกรัม"
    answer: { value: 11.78, unit: kg, tolerance: 0.1 }
    misconceptions:
      - { match: 10.01, feedback: "นี่คือมวลของ CaCO₃ บริสุทธิ์ หินปูนมี CaCO₃ เพียง 85% ต้องใช้มากกว่านี้" }
      - { match: 8.51, feedback: "คูณด้วย 0.85 แทนการหาร สารที่ไม่บริสุทธิ์ต้องใช้มวลมากขึ้น" }
    hints:
      - "อัตราส่วนโมล H₂SO₄ : CaCO₃ = 1 : 1"
      - "มวลหินปูน = มวล CaCO₃ บริสุทธิ์ ÷ 0.85"
    solution: "CaCO₃ $= 100$ mol $\\times 100.1 = 10.01$ kg หินปูน $= 10.01 \\div 0.85 =$ **11.78 kg**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.practice.problem-solving.p008
    topics: [chemistry.practice.problem-solving]
    difficulty: 3
    type: mcq
    stem: "ในโครงการบำบัดน้ำเสีย ข้อใดเป็น **ข้อจำกัด** (เงื่อนไขที่ต้องผ่าน) ไม่ใช่เกณฑ์ที่ยิ่งมากยิ่งดี"
    choices:
      - { id: a, text: "น้ำที่ปล่อยต้องมี pH 5.5–9.0 ตามกฎหมาย", correct: true, feedback: "ถูก ถ้าไม่ผ่าน วิธีนั้นใช้ไม่ได้เลยไม่ว่าจะดีด้านอื่นแค่ไหน" }
      - { id: b, text: "ค่าใช้จ่ายยิ่งต่ำยิ่งดี", feedback: "นี่คือเกณฑ์สำหรับเปรียบเทียบทางเลือก ไม่ใช่เงื่อนไขผ่านหรือไม่ผ่าน" }
      - { id: c, text: "กากตะกอนยิ่งน้อยยิ่งดี", feedback: "นี่คือเกณฑ์ ใช้ให้คะแนนเปรียบเทียบทางเลือก" }
    hints:
      - "ข้อจำกัดคือเงื่อนไขที่ไม่ผ่านไม่ได้"
      - "เกณฑ์ใช้ให้คะแนนเปรียบเทียบ"
    solution: "**มาตรฐาน pH ตามกฎหมาย** เป็นข้อจำกัด ทุกทางเลือกต้องผ่าน ส่วนค่าใช้จ่ายและปริมาณกากเป็นเกณฑ์ที่ใช้เปรียบเทียบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.practice.problem-solving.p009
    topics: [chemistry.practice.problem-solving]
    difficulty: 4
    type: numeric
    stem: "น้ำมันแก๊สโซฮอล์ E20 มีเอทานอล 20% โดยปริมาตร ถ้าผลิต E20 1,000 L ต้องใช้เอทานอลกี่กิโลกรัม (ความหนาแน่นเอทานอล 0.789 kg/L)"
    answer: { value: 157.8, unit: kg, tolerance: 1 }
    misconceptions:
      - { match: 200, feedback: "200 คือปริมาตรเป็นลิตร ต้องคูณด้วยความหนาแน่นเพื่อแปลงเป็นกิโลกรัม" }
      - { match: 253.5, feedback: "หารด้วยความหนาแน่นแทนการคูณ มวล = ปริมาตร × ความหนาแน่น" }
    hints:
      - "ปริมาตรเอทานอล = 20% ของ 1,000 L"
      - "มวล = ปริมาตร × ความหนาแน่น"
    solution: "ปริมาตร $= 0.20 \\times 1000 = 200$ L มวล $= 200 \\times 0.789 =$ **157.8 kg**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.practice.problem-solving.p010
    topics: [chemistry.practice.problem-solving]
    difficulty: 5
    type: numeric
    stem: "โรงงานหมักน้ำตาลจากมันสำปะหลังเป็นเอทานอลตามสมการ $\\mathrm{C_6H_{12}O_6 \\to 2C_2H_5OH + 2CO_2}$ ต้องการเอทานอล 157.8 kg (สำหรับ E20 1,000 L) ต้องใช้กลูโคสอย่างน้อยกี่กิโลกรัม (มวลโมเลกุล กลูโคส 180.2 เอทานอล 46.07 ถือว่าเปลี่ยนเป็นผลิตภัณฑ์ได้ 100%)"
    answer: { value: 308.6, unit: kg, tolerance: 2 }
    misconceptions:
      - { match: 617.1, feedback: "ใช้อัตราส่วน 1 : 1 แต่กลูโคส 1 mol ให้เอทานอล 2 mol" }
      - { match: 157.8, feedback: "มวลไม่ได้คงที่ระหว่างสารต่างชนิด ต้องคำนวณผ่านโมล และอะตอมบางส่วนออกไปเป็น CO₂" }
    hints:
      - "หาโมลเอทานอลจากมวล"
      - "โมลกลูโคส = โมลเอทานอล ÷ 2 แล้วคูณมวลโมเลกุลกลูโคส"
    solution: "เอทานอล $= 157.8 \\times 1000 \\div 46.07 = 3425$ mol กลูโคส $= 3425 \\div 2 = 1713$ mol มวล $= 1713 \\times 180.2 \\approx$ **308.6 kg** (ได้ CO₂ ราว 151 kg ด้วย)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.practice.problem-solving.p011
    topics: [chemistry.practice.problem-solving]
    difficulty: 3
    type: mcq
    stem: "น้ำบาดาลในหมู่บ้านใสตอนสูบขึ้นมา แต่ตั้งทิ้งไว้แล้วกลายเป็นสีส้มและมีตะกอน วิธีใดใช้หลักเคมีแก้ปัญหาได้ตรงสาเหตุ"
    choices:
      - { id: a, text: "เติมอากาศ (เช่น ให้น้ำไหลผ่านถาดเป็นชั้น) ให้เหล็กที่ละลายอยู่ถูกออกซิไดซ์เป็นตะกอน แล้วกรองด้วยทราย", correct: true, feedback: "ถูก ออกซิเจนเปลี่ยนเหล็ก(II) ที่ละลายน้ำเป็นเหล็ก(III)ไฮดรอกไซด์ที่ไม่ละลาย จึงกรองออกได้" }
      - { id: b, text: "ต้มน้ำให้เดือดแล้วดื่มทันที", feedback: "การต้มฆ่าเชื้อโรค แต่ไม่ได้แยกเหล็กออก" }
      - { id: c, text: "เติมน้ำตาลเพื่อกลบรสโลหะ", feedback: "ไม่ได้ลดปริมาณเหล็ก เป็นการแก้ที่อาการไม่ใช่สาเหตุ" }
    hints:
      - "สีส้มเกิดเมื่อน้ำสัมผัสอากาศ แปลว่าอะไรในอากาศทำปฏิกิริยา"
      - "ถ้าเหล็กกลายเป็นตะกอน จะแยกออกได้อย่างไร"
    solution: "สีส้มคือตะกอนเหล็ก(III) ที่เกิดเมื่อเหล็ก(II) ถูกออกซิเจนออกซิไดซ์ จึงแก้โดย **เติมอากาศให้เกิดตะกอนให้หมด แล้วกรอง**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.practice.problem-solving.p012
    topics: [chemistry.practice.problem-solving]
    difficulty: 2
    type: numeric
    stem: "น้ำบาดาลมีเหล็ก 3.0 mg/L ทีมตั้งเป้าให้เหลือ 0.3 mg/L ระบบบำบัดต้องกำจัดเหล็กออกอย่างน้อยกี่เปอร์เซ็นต์"
    answer: { value: 90, unit: "%" }
    misconceptions:
      - { match: 10, feedback: "10% คือส่วนที่เหลือ ต้องการส่วนที่กำจัดออก" }
