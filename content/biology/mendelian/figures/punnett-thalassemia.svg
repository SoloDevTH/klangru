<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" font-family="sans-serif" font-size="14">
<title>ตารางพันเนตต์ของพ่อแม่ที่เป็นพาหะธาลัสซีเมีย</title>
<rect x="0" y="0" width="920" height="500" fill="#ffffff"/>
<text x="460.0" y="30.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">พ่อเป็นพาหะ (Aa) × แม่เป็นพาหะ (Aa)</text>
<text x="460.0" y="54.0" text-anchor="middle" font-size="14" fill="#555">ทั้งพ่อและแม่สุขภาพปกติ</text>
<text x="300.0" y="122.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">เซลล์สืบพันธุ์จากพ่อ</text>
<text x="100" y="310.0" text-anchor="middle" font-size="14" font-weight="bold" transform="rotate(-90 100 310.0)">เซลล์สืบพันธุ์จากแม่</text>
<circle cx="235.0" cy="156" r="18" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
<text x="235.0" y="162.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">A</text>
<circle cx="365.0" cy="156" r="18" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
<text x="365.0" y="162.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">a</text>
<circle cx="140" cy="245.0" r="18" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
<text x="140.0" y="251.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">A</text>
<circle cx="140" cy="375.0" r="18" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
<text x="140.0" y="381.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">a</text>
<rect x="170" y="180" width="130" height="130" fill="#e3f2fd" stroke="#333" stroke-width="2"/>
<text x="235.0" y="229.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">AA</text>
<text x="235.0" y="251.0" text-anchor="middle" font-size="13" fill="#222">ไม่มียีน</text>
<text x="235.0" y="273.0" text-anchor="middle" font-size="13" fill="#222">ธาลัสซีเมีย</text>
<rect x="300" y="180" width="130" height="130" fill="#fff8e1" stroke="#333" stroke-width="2"/>
<text x="365.0" y="229.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Aa</text>
<text x="365.0" y="251.0" text-anchor="middle" font-size="13" fill="#222">เป็นพาหะ</text>
<text x="365.0" y="273.0" text-anchor="middle" font-size="13" fill="#222">สุขภาพปกติ</text>
<rect x="170" y="310" width="130" height="130" fill="#fff8e1" stroke="#333" stroke-width="2"/>
<text x="235.0" y="359.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Aa</text>
<text x="235.0" y="381.0" text-anchor="middle" font-size="13" fill="#222">เป็นพาหะ</text>
<text x="235.0" y="403.0" text-anchor="middle" font-size="13" fill="#222">สุขภาพปกติ</text>
<rect x="300" y="310" width="130" height="130" fill="#fce4ec" stroke="#333" stroke-width="2"/>
<text x="365.0" y="359.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">aa</text>
<text x="365.0" y="381.0" text-anchor="middle" font-size="13" fill="#222">เป็นโรค</text>
<text x="365.0" y="403.0" text-anchor="middle" font-size="13" fill="#222">ธาลัสซีเมีย</text>
<rect x="520" y="110" width="380" height="330" rx="12" fill="#fafafa" stroke="#bdbdbd"/>
<text x="710.0" y="142.0" text-anchor="middle" font-size="14" fill="#222">A = ยีนปกติ (เด่น)</text>
<text x="710.0" y="170.0" text-anchor="middle" font-size="14" fill="#222">a = ยีนธาลัสซีเมีย (ด้อย)</text>
<text x="710.0" y="198.0" text-anchor="middle" font-size="8" fill="#222"></text>
<text x="710.0" y="226.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">โอกาสของลูกแต่ละคน</text>
<text x="710.0" y="254.0" text-anchor="middle" font-size="14" fill="#222">ไม่มียีนธาลัสซีเมีย 1/4</text>
<text x="710.0" y="282.0" text-anchor="middle" font-size="14" fill="#222">เป็นพาหะ สุขภาพปกติ 1/2</text>
<text x="710.0" y="310.0" text-anchor="middle" font-size="14" fill="#222">เป็นโรค 1/4</text>
<text x="710.0" y="338.0" text-anchor="middle" font-size="8" fill="#222"></text>
<text x="710.0" y="366.0" text-anchor="middle" font-size="13" fill="#222">โอกาสนี้เท่าเดิมทุกครั้งที่ตั้งครรภ์</text>
<text x="710.0" y="394.0" text-anchor="middle" font-size="13" fill="#222">ไม่ขึ้นกับว่าลูกคนก่อนเป็นอย่างไร</text>
</svg>