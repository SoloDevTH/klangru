  - { framework: th-tqf-logistics, indicators: ["8.2.4"], coverage: full, note: "สอนหน้าที่และระดับของบรรจุภัณฑ์ การรวมหน่วยด้วยพาเลทตามมาตรฐาน ISO 6780 การคำนวณจำนวนกล่องต่อชั้นและจำนวนชั้น อัตราการใช้พื้นที่ ความแข็งกดกับการซ้อน สัญลักษณ์ ISO 780 และบาร์โค้ด GS1 (EAN-13 GTIN-14 ITF-14) ต้นทุนรวมเทียบความเสียหาย บรรจุภัณฑ์หมุนเวียน และหลัก EPR (p001 ถึง p019) ไม่ได้สอนการออกแบบกล่องลูกฟูกเชิงโครงสร้างหรือการทดสอบแรงกดในห้องปฏิบัติการ" }
