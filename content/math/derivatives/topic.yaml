id: math.calculus.derivative
subject: math
title: { th: อนุพันธ์ของพหุนาม, en: Derivatives of polynomials }
summary: ใช้กฎยกกำลังหาอนุพันธ์ของพหุนาม แล้วนำไปหาความชันเส้นสัมผัส จุดสูงสุดหรือต่ำสุด และความเร็วของวัตถุ
difficulty: 7
minutes: 40
prerequisites: [math.calculus.rate-of-change, math.algebra.polynomials]
encompasses:
  - { id: math.calculus.rate-of-change, weight: 0.5 }
  - { id: math.algebra.polynomials, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: secant-to-tangent.svg
    alt: "กราฟ y = x² กับจุด (1, 1) มีเส้นตัดสามเส้นที่ผ่าน (1, 1) และจุดบนกราฟที่ x = 3, 2 และ 1.4 มีความชัน 4, 3 และ 2.4 ตามลำดับ และเส้นสัมผัสที่ x = 1 มีความชัน 2 เส้นตัดเอียงเข้าใกล้เส้นสัมผัสเมื่อจุดที่สองเลื่อนเข้าใกล้ x = 1"
    caption: "เมื่อจุดที่สองเข้าใกล้ $x = 1$ ความชันของเส้นตัด (4, 3, 2.4, …) เข้าใกล้ความชันของเส้นสัมผัส $f'(1) = 2$"
  - { type: check, problem: math.der.p015, prompt: "ลองใช้กฎยกกำลังเอง" }
  - type: figure
    src: f-and-derivative.svg
    alt: "กราฟสองรูปวางตรงกัน รูปบนคือ f(x) = x³ − 3x มีจุดสูงสุดที่ x = −1 (ค่า 2) และจุดต่ำสุดที่ x = 1 (ค่า −2) รูปล่างคือ f′(x) = 3x² − 3 เป็นพาราโบลาหงายตัดแกน x ที่ x = −1 และ x = 1 เส้นประแนวตั้งเชื่อมจุดสูงสุดต่ำสุดของ f กับจุดตัดแกนของ f′"
    caption: "ตรงที่ $f$ ขึ้น กราฟ $f'$ อยู่เหนือแกน ตรงที่ $f$ ลง กราฟ $f'$ อยู่ใต้แกน และยอดเขาก้นหุบของ $f$ ตรงกับจุดที่ $f' = 0$"
  - type: worked-example
    title: หาช่วงที่ฟังก์ชันเพิ่มและลด
    problem: "หาช่วงที่ $f(x) = x^3 - 3x^2 + 4$ เป็นฟังก์ชันเพิ่มและฟังก์ชันลด พร้อมจุดสูงสุดต่ำสุดสัมพัทธ์"
    steps:
      - text: "$f'(x) = 3x^2 - 6x = 3x(x - 2)$"
        why: "แยกตัวประกอบช่วยให้เห็นว่า $f'$ เป็นศูนย์ที่ไหนและเปลี่ยนเครื่องหมายอย่างไร"
      - text: "$f'(x) = 0$ ที่ $x = 0$ และ $x = 2$ แบ่งเส้นจำนวนเป็นสามช่วง"
      - text: "ทดสอบแต่ละช่วง: $f'(-1) = 9 > 0$, $f'(1) = -3 < 0$, $f'(3) = 9 > 0$"
      - text: "จึงเพิ่มเมื่อ $x < 0$ ลดเมื่อ $0 < x < 2$ และเพิ่มเมื่อ $x > 2$"
      - text: "ที่ $x = 0$ เปลี่ยนจากเพิ่มเป็นลด: สูงสุดสัมพัทธ์ $f(0) = 4$ ที่ $x = 2$ เปลี่ยนจากลดเป็นเพิ่ม: ต่ำสุดสัมพัทธ์ $f(2) = 8 - 12 + 4 = 0$"
    answer: "เพิ่มบน $x < 0$ และ $x > 2$ ลดบน $0 < x < 2$ สูงสุดสัมพัทธ์ 4 ที่ $x = 0$ ต่ำสุดสัมพัทธ์ 0 ที่ $x = 2$"
  - type: worked-example
    title: "ปัญหาค่าเหมาะที่สุด: ผลคูณมากที่สุด"
    problem: "จำนวนบวกสองจำนวนรวมกันได้ 20 ถ้าต้องการให้ผลคูณของจำนวนแรกกับกำลังสองของจำนวนที่สองมากที่สุด สองจำนวนนั้นคืออะไร"
    steps:
      - text: "ให้จำนวนที่สองเป็น $x$ จำนวนแรกจึงเป็น $20 - x$ โดย $0 < x < 20$"
        why: "เขียนทุกอย่างด้วยตัวแปรเดียว จึงหาอนุพันธ์ได้"
      - text: "ปริมาณที่ต้องการ $P(x) = (20 - x)x^2 = 20x^2 - x^3$"
      - text: "$P'(x) = 40x - 3x^2 = x(40 - 3x)$ เป็นศูนย์ที่ $x = 0$ หรือ $x = \\tfrac{40}{3}$"
      - text: "$x = 0$ อยู่นอกช่วง ส่วนที่ $x = \\tfrac{40}{3}$ ได้ $P''(x) = 40 - 6x = -40 < 0$ จึงเป็นค่าสูงสุด"
        why: "อนุพันธ์อันดับสองเป็นลบแปลว่ากราฟเว้าลง จุดวิกฤตนั้นจึงเป็นยอดเขา"
      - text: "จำนวนแรก $= 20 - \\tfrac{40}{3} = \\tfrac{20}{3}$ และผลคูณสูงสุด $= \\tfrac{20}{3} \\times \\left(\\tfrac{40}{3}\\right)^2 = \\tfrac{32000}{27} \\approx 1185.2$"
    answer: "จำนวนแรก $\\tfrac{20}{3}$ จำนวนที่สอง $\\tfrac{40}{3}$"
  - { type: check, problem: math.der.p017, prompt: "ใช้เครื่องหมายของ $f'$ ตัดสิน" }
  - type: interactive
    title: เส้นสัมผัสกราฟ y = x³ − 3x
    caption: เลื่อน a เพื่อย้ายจุดสัมผัส สังเกตว่าเส้นสัมผัสนอนราบ (ความชันเป็น 0) ที่ a = −1 ซึ่งเป็นจุดสูงสุด และที่ a = 1 ซึ่งเป็นจุดต่ำสุด
    widget:
      kind: function-plot
      functions: ["x^3-3x", "(3a^2-3)(x-a)+a^3-3a"]
      sliders:
        - { name: a, min: -2.5, max: 2.5, step: 0.1, value: 0.5, label: ตำแหน่งจุดสัมผัส a }
      x: [-3, 3]
      y: [-5, 5]
  - type: simulation
    title: วาดกราฟแล้วดูกราฟอนุพันธ์ (PhET Calculus Grapher)
    url: https://phet.colorado.edu/en/simulations/calculus-grapher
    provider: phet
    note: ลองวาดกราฟที่มียอดเขาและก้นหุบ แล้วสังเกตว่ากราฟอนุพันธ์ตัดแกน x ตรงตำแหน่งยอดเขาและก้นหุบพอดี
glossary:
  - { term: อนุพันธ์, definition: "ฟังก์ชันที่บอกความชันของเส้นสัมผัสกราฟ $f$ ที่แต่ละจุด เขียนว่า $f'(x)$ หรือ $\\frac{dy}{dx}$" }
  - { term: กฎยกกำลัง, definition: "อนุพันธ์ของ $x^n$ คือ $n x^{n-1}$" }
  - { term: เส้นสัมผัส, definition: "เส้นตรงที่แตะกราฟที่จุด $(a, f(a))$ และมีความชัน $f'(a)$" }
  - { term: จุดวิกฤต, definition: "จุดที่ $f'(x) = 0$ เส้นสัมผัสนอนราบ อาจเป็นจุดสูงสุดหรือต่ำสุดสัมพัทธ์" }
flashcards:
  - { front: "อนุพันธ์ของ $x^n$", back: "$n x^{n-1}$ (นำเลขชี้กำลังลงมาคูณ แล้วลดลง 1)" }
  - { front: "อนุพันธ์ของค่าคงตัว เช่น 7", back: "0 เพราะกราฟ $y = 7$ เป็นเส้นนอน" }
  - { front: "สมการเส้นสัมผัสที่ $x = a$", back: "$y - f(a) = f'(a)(x - a)$" }
  - { front: "จะรู้ได้อย่างไรว่าจุดที่ $f'(x) = 0$ เป็นจุดสูงสุด", back: "$f'$ เปลี่ยนจากบวกเป็นลบเมื่อผ่านจุดนั้น (กราฟขึ้นแล้วลง)" }
  - { front: "ความเร็วกับตำแหน่งสัมพันธ์กันอย่างไร", back: "ความเร็ว $v(t) = s'(t)$ คืออนุพันธ์ของตำแหน่งเทียบกับเวลา" }
