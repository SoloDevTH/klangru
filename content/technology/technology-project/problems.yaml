problems:
- id: technology.design.technology-project.p001
  topics:
  - technology.design.technology-project
  difficulty: 1
  type: order
  stem: เรียงขั้นตอนของโครงงานเทคโนโลยี
  items:
  - เลือกหัวข้อจากปัญหาจริง
  - ศึกษาข้อมูลและความรู้ที่เกี่ยวข้อง
  - เขียนเค้าโครงโครงงาน
  - ลงมือทำและบันทึกการปฏิบัติงาน
  - ทดสอบและปรับปรุง
  - เขียนรายงาน
  - นำเสนอและประเมินผล
  hints:
  - ต้องรู้ปัญหาก่อนจึงหาข้อมูลได้
  - เค้าโครงเขียนก่อนลงมือ รายงานเขียนหลังทดสอบ
  solution: เลือกหัวข้อ → ศึกษาข้อมูล → เขียนเค้าโครง → ลงมือและบันทึก → ทดสอบและปรับปรุง → เขียนรายงาน → นำเสนอและประเมินผล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.technology-project.p002
  topics:
  - technology.design.technology-project
  difficulty: 1
  type: match
  stem: จับคู่หัวข้อในเค้าโครงโครงงานกับสิ่งที่ต้องเขียน
  pairs:
  - left: ที่มาและความสำคัญ
    right: ปัญหาที่พบและเหตุผลที่ต้องทำโครงงาน
  - left: วัตถุประสงค์
    right: สิ่งที่ต้องการให้เกิด เขียนให้วัดได้
  - left: ขอบเขต
    right: ทำกับอะไร ที่ไหน ช่วงเวลาใด
  - left: ผลที่คาดว่าจะได้รับ
    right: ประโยชน์ที่คาดว่าจะเกิดเมื่อทำเสร็จ
  hints:
  - ที่มา = ทำไมต้องทำ
  - ขอบเขต = กรอบที่ทำ
  solution: ที่มา → ปัญหาและเหตุผล · วัตถุประสงค์ → สิ่งที่ต้องการให้เกิด วัดได้ · ขอบเขต → ทำกับอะไร ที่ไหน เมื่อไร · ผลที่คาดว่าจะได้รับ → ประโยชน์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.technology-project.p003
  topics:
  - technology.design.technology-project
  difficulty: 1
  type: text
  stem: แผนภูมิที่แสดงงานย่อยแต่ละงานเป็นแท่งตามช่วงเวลาที่ทำ ใช้วางแผนและติดตามโครงงาน เรียกว่าอะไร
  accepted:
  - แผนภูมิแกนต์
  - แกนต์
  - Gantt chart
  - gantt chart
  - Gantt
  - แกนท์ชาร์ต
  - แผนภูมิแกนท์
  misconceptions:
  - match: ผังงาน
    feedback: ผังงานแสดงลำดับการทำงานของโปรแกรม ไม่ได้แสดงช่วงเวลา
  - match: แผนภูมิแท่ง
    feedback: แผนภูมิแท่งเปรียบเทียบปริมาณ ส่วนแผนภูมิที่เรียงแท่งตามช่วงเวลาของงานมีชื่อเฉพาะ
  hints:
  - ตั้งชื่อตามผู้คิดค้นชาวอเมริกัน
  - ขึ้นต้นด้วย แผนภูมิแ...
  solution: เรียกว่า **แผนภูมิแกนต์** (Gantt chart)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.technology-project.p004
  topics:
  - technology.design.technology-project
  difficulty: 2
  type: mcq
  stem: นักเรียน ม.5 มีเวลา 12 สัปดาห์และงบ 1,500 บาท หัวข้อโครงงานใด **เหมาะสม** ที่สุด
  choices:
  - id: a
    text: รถยนต์ไฟฟ้าขับเคลื่อนเองสำหรับชุมชน
    feedback: เกินเวลา งบ และทักษะมาก
  - id: b
    text: แก้ปัญหาโลกร้อน
    feedback: กว้างเกินไป วัดผลไม่ได้
  - id: c
    text: เครื่องผลิตไฟฟ้าจากเครื่องปั่นไฟน้ำมันที่ต่อเข้าบ้าน
    feedback: อันตรายและเกินขอบเขตของนักเรียน
  - id: d
    text: ระบบเตือนเมื่อดินในแปลงผักของโรงเรียนแห้ง
    correct: true
    feedback: ถูก ปัญหาจริง ทำได้ในเวลาและงบ วัดผลได้
  hints:
  - 'ถาม: ทำได้จริงไหมในเวลาและงบ'
  - วัดผลได้ไหม ปลอดภัยไหม
  solution: '**ระบบเตือนดินแห้ง** เป็นปัญหาจริง ทำได้ภายใต้เวลา งบ และทักษะ วัดผลได้ และปลอดภัย'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.technology-project.p005
  topics:
  - technology.design.technology-project
  difficulty: 2
  type: mcq
  stem: วัตถุประสงค์ของโครงงานรดน้ำอัตโนมัติข้อใด **วัดได้** ชัดเจนที่สุด
  choices:
  - id: a
    text: เพื่อให้ผักงาม
    feedback: คำว่า งาม วัดไม่ได้
  - id: b
    text: เพื่อใช้เทคโนโลยีให้เป็นประโยชน์
    feedback: กว้างมาก ไม่รู้ว่าสำเร็จเมื่อไร
  - id: c
    text: รักษาความชื้นในดินให้อยู่ในช่วงที่ตั้งไว้ตลอดวันหยุด 3 วัน และใช้น้ำน้อยกว่ารดด้วยมือ
    correct: true
    feedback: ถูก บอกสิ่งที่วัดได้ เงื่อนไข และสิ่งที่ใช้เทียบ
  - id: d
    text: เพื่อทำโครงงานส่งครู
    feedback: เป็นเหตุผลส่วนตัว ไม่ใช่วัตถุประสงค์ของงาน
  hints:
  - วัตถุประสงค์ที่ดีบอกได้ว่าสำเร็จหรือไม่
  - มีตัวเลขหรือสิ่งที่ใช้เทียบหรือไม่
  solution: ข้อแรกมี **สิ่งที่วัด (ความชื้นในดิน) ระยะเวลา และสิ่งเทียบ (น้ำที่ใช้)**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.technology-project.p006
  topics:
  - technology.design.technology-project
  difficulty: 2
  type: match
  stem: จับคู่ศาสตร์กับการใช้ในโครงงานรดน้ำแปลงผักอัตโนมัติ
  pairs:
  - left: วิทยาศาสตร์
    right: พืชต้องการน้ำเท่าไร ดินแต่ละชนิดอุ้มน้ำต่างกัน
  - left: คณิตศาสตร์
    right: คำนวณปริมาณน้ำที่ประหยัดและงบประมาณ
  - left: วิทยาการคำนวณ
    right: เขียนโปรแกรมอ่านเซนเซอร์และสั่งปั๊ม
  - left: การออกแบบและเทคโนโลยี
    right: เลือกวัสดุ ต่อวงจร สร้างและทดสอบชิ้นงาน
  hints:
  - โปรแกรมเป็นเรื่องของวิทยาการคำนวณ
  - ความรู้เรื่องพืชและดินเป็นวิทยาศาสตร์
  solution: วิทยาศาสตร์ → พืชและดิน · คณิตศาสตร์ → คำนวณ · วิทยาการคำนวณ → โปรแกรม · การออกแบบและเทคโนโลยี → วัสดุ วงจร สร้างและทดสอบ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.technology-project.p007
  topics:
  - technology.design.technology-project
  difficulty: 3
  type: numeric
  stem: ดูแผนภูมิแกนต์ในภาพ งาน Q (ออกแบบป้ายและกิจกรรมรณรงค์) มี **เวลาเผื่อ** กี่สัปดาห์ คือช้าได้มากสุดเท่าไรโดยงาน S ยังเริ่มได้ตามแผน
  figure:
    src: canteen-gantt.svg
    alt: แผนภูมิแกนต์โครงงานลดพลาสติกในโรงอาหาร (แผนสมมติ) แกนนอนสัปดาห์ที่ 1 ถึง 8 งาน P สำรวจขยะพลาสติกในโรงอาหาร สัปดาห์ที่ 1 งาน Q ออกแบบป้ายและกิจกรรมรณรงค์ สัปดาห์ที่ 2 ถึง 3 ต้องรอ P งาน R สร้างถังแยกขยะ สัปดาห์ที่ 2 ถึง 4 ต้องรอ P งาน S รณรงค์และใช้ถังแยกขยะ สัปดาห์ที่ 5 ถึง 6 ต้องรอทั้ง Q และ R งาน T ชั่งขยะและสรุปผล สัปดาห์ที่ 7 ต้องรอ S
  answer:
    value: 1
    unit: สัปดาห์
  misconceptions:
  - match: 0
    feedback: งาน Q จบสัปดาห์ที่ 3 แต่ S ต้องรอ R ซึ่งจบสัปดาห์ที่ 4 Q จึงช้าได้
  - match: 2
    feedback: นับจากระยะเวลาของ Q เอง ต้องเทียบเวลาที่ Q จบกับเวลาที่ S เริ่ม
  hints:
  - S เริ่มได้เมื่อทั้ง Q และ R เสร็จ
  - Q จบสัปดาห์ที่ 3 ส่วน R จบสัปดาห์ที่เท่าไร
  solution: R จบสัปดาห์ที่ 4 S จึงเริ่มสัปดาห์ที่ 5 ส่วน Q จบสัปดาห์ที่ 3 Q จึงมีเวลาเผื่อ $4-3=1$ สัปดาห์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.technology-project.p008
  topics:
  - technology.design.technology-project
  difficulty: 3
  type: numeric
  stem: โครงงานหนึ่ง (สมมติ) มีงาน A 2 สัปดาห์ · B 3 สัปดาห์ (รอ A) · C 1 สัปดาห์ (รอ A) · D 2 สัปดาห์ (รอทั้ง B และ C) · E 1 สัปดาห์ (รอ D) ถ้าทำงานที่ไม่ต้องรอกันพร้อมกันได้ โครงงานใช้เวลาน้อยที่สุดกี่สัปดาห์
  answer:
    value: 8
    unit: สัปดาห์
  misconceptions:
  - match: 9
    feedback: บวกเวลาทุกงาน แต่ B กับ C ทำพร้อมกันได้
  - match: 6
    feedback: ใช้งาน C ซึ่งสั้นกว่า แต่ D ต้องรอ B ที่ยาวกว่าด้วย
  hints:
  - B กับ C ทำพร้อมกันหลัง A
  - D เริ่มได้เมื่องานที่ยาวกว่าระหว่าง B กับ C เสร็จ
  solution: A 2 → (B 3 พร้อม C 1 ใช้ 3) → D 2 → E 1 รวม $2+3+2+1=8$ สัปดาห์ เส้นทางวิกฤตคือ A–B–D–E
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.technology-project.p009
  topics:
  - technology.design.technology-project
  difficulty: 3
  type: numeric
  stem: โครงงานลดพลาสติกในโรงอาหาร (ราคาสมมติ) ซื้อถังแยกขยะ 4 ใบ ใบละ 250 บาท ป้าย 3 แผ่น แผ่นละ 120 บาท และตาชั่ง 450 บาท แล้วกันเงินสำรองร้อยละ 10 ของค่าอุปกรณ์ ต้องของบรวมเท่าไร (บาท)
  answer:
    value: 1991
    unit: บาท
  misconceptions:
  - match: 1810
    feedback: ยังไม่ได้บวกเงินสำรองร้อยละ 10
  - match: 902
    feedback: ลืมคูณจำนวนถังและป้าย บวกราคาต่อชิ้นแล้วเพิ่มร้อยละ 10
  hints:
  - ค่าอุปกรณ์ = 4 × 250 + 3 × 120 + 450
  - บวกเงินสำรอง = ค่าอุปกรณ์ × 0.10
  solution: ค่าอุปกรณ์ $1000 + 360 + 450 = 1810$ บาท เงินสำรอง $181$ บาท รวม $1991$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.technology-project.p010
  topics:
  - technology.design.technology-project
  difficulty: 3
  type: mcq
  stem: อ่านสมุดบันทึกในภาพ ข้อใดเหมาะที่สุดสำหรับช่อง **สิ่งที่จะทำต่อ**
  figure:
    src: logbook.svg
    alt: สมุดบันทึกการปฏิบัติงาน (สมมติ) วันที่ 14 มกราคม ผู้บันทึก ต้นกล้า งานที่ทำ ทดสอบเซนเซอร์ความชื้นในดินกับดิน 3 กระถาง ผล กระถางแห้งอ่านได้ 820 กระถางชื้นอ่านได้ 410 กระถางแฉะอ่านได้ 300 ปัญหา ค่าที่อ่านได้กระโดดไปมาเมื่อขยับสายไฟ สิ่งที่จะทำต่อ เว้นว่างไว้
  choices:
  - id: a
    text: ซื้อเซนเซอร์ใหม่ที่แพงที่สุด
    feedback: ยังไม่รู้ว่าเซนเซอร์เสีย ปัญหาอาจอยู่ที่สายไฟ
  - id: b
    text: ตรวจและบัดกรีจุดต่อสายเซนเซอร์ให้แน่น แล้ววัดดินทั้ง 3 กระถางซ้ำ กระถางละ 5 ครั้ง
    correct: true
    feedback: ถูก แก้ตรงปัญหาที่บันทึกไว้และวางแผนทดสอบซ้ำที่ชัด
  - id: c
    text: ทำงานต่อ
    feedback: ไม่บอกว่าจะทำอะไร
  - id: d
    text: ลบค่าที่อ่านได้ทิ้งเพราะไม่น่าเชื่อถือ
    feedback: ข้อมูลที่บันทึกไว้มีประโยชน์ ไม่ควรลบ
  hints:
  - ปัญหาที่บันทึกไว้คืออะไร
  - สิ่งที่จะทำต่อควรเจาะจงและทดสอบได้
  solution: ปัญหาเกิดเมื่อ **ขยับสายไฟ** จึงควร **ตรวจจุดต่อ** แล้ว **วัดซ้ำ** อย่างเป็นระบบ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.technology-project.p011
  topics:
  - technology.design.technology-project
  difficulty: 4
  type: numeric
  stem: ใช้เกณฑ์ประเมินในบทเรียน (น้ำหนัก ปัญหาและวัตถุประสงค์ 15 การออกแบบและการใช้ความรู้หลายศาสตร์ 20 ชิ้นงานทำงานได้ 25 การทดสอบและปรับปรุง 15 สมุดบันทึกและเอกสาร 10 การนำเสนอ 15 ระดับเต็ม 4) โครงงานหนึ่งได้ระดับ 3, 3, 4, 2, 3, 4 ตามลำดับ ได้คะแนนรวมเท่าไรจาก 100
  answer:
    value: 81.25
    unit: คะแนน
    tolerance: 0.01
  misconceptions:
  - match: 19
    feedback: บวกระดับโดยไม่คิดน้ำหนัก
  - match: 79.17
    feedback: คิดร้อยละจากผลรวมระดับ 19 ÷ 24 โดยไม่คิดน้ำหนัก
  hints:
  - คะแนนแต่ละด้าน = น้ำหนัก × ระดับ ÷ 4
  - 15(0.75) + 20(0.75) + 25(1) + 15(0.5) + 10(0.75) + 15(1)
  solution: $11.25 + 15 + 25 + 7.5 + 7.5 + 15 = 81.25$ คะแนน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.technology-project.p012
  topics:
  - technology.design.technology-project
  difficulty: 4
  type: mcq
  stem: ดูแผนภูมิแกนต์ในภาพ ถ้างานใดงานหนึ่งล่าช้า 1 สัปดาห์ งานใด **ไม่ทำให้** โครงงานเสร็จช้าลง
  figure:
    src: canteen-gantt.svg
    alt: แผนภูมิแกนต์โครงงานลดพลาสติกในโรงอาหาร (แผนสมมติ) แกนนอนสัปดาห์ที่ 1 ถึง 8 งาน P สำรวจขยะพลาสติกในโรงอาหาร สัปดาห์ที่ 1 งาน Q ออกแบบป้ายและกิจกรรมรณรงค์ สัปดาห์ที่ 2 ถึง 3 ต้องรอ P งาน R สร้างถังแยกขยะ สัปดาห์ที่ 2 ถึง 4 ต้องรอ P งาน S รณรงค์และใช้ถังแยกขยะ สัปดาห์ที่ 5 ถึง 6 ต้องรอทั้ง Q และ R งาน T ชั่งขยะและสรุปผล สัปดาห์ที่ 7 ต้องรอ S
  choices:
  - id: a
    text: R สร้างถังแยกขยะ
