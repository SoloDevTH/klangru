problems:
  - id: math.area.p001
    topics: [math.geometry.area-perimeter]
    difficulty: 1
    type: numeric
    stem: "สี่เหลี่ยมผืนผ้ายาว $8\\ \\mathrm{cm}$ กว้าง $5\\ \\mathrm{cm}$ มีพื้นที่กี่ตารางเซนติเมตร (ตอบเป็นตัวเลขในหน่วย $\\mathrm{cm^2}$)"
    answer: { value: 40, unit: cm² }
    hints:
      - "พื้นที่คือจำนวนช่องสี่เหลี่ยม $1\\ \\mathrm{cm} \\times 1\\ \\mathrm{cm}$ ที่วางเต็มรูปได้"
      - "พื้นที่สี่เหลี่ยมผืนผ้า = ยาว × กว้าง"
    misconceptions:
      - { match: 26, feedback: "นั่นคือเส้นรอบรูป $2(8 + 5)$ ซึ่งเป็นความยาวรอบขอบ โจทย์ถามพื้นที่ ต้องคูณความยาวกับความกว้าง" }
      - { match: 13, feedback: "ดูเหมือนนำความยาวบวกความกว้าง พื้นที่ต้องคูณกัน" }
    solution: "พื้นที่ $= 8\\ \\mathrm{cm} \\times 5\\ \\mathrm{cm} = 40\\ \\mathrm{cm^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.area.p002
    topics: [math.geometry.area-perimeter]
    difficulty: 1
    type: mcq
    stem: "ช่างกำลังคำนวณว่าต้องซื้อกระเบื้องปูพื้นห้องเท่าใด ค่าที่ช่างคำนวณควรมีหน่วยใด"
    choices:
      - { id: a, text: "ตารางเมตร ($\\mathrm{m^2}$)", correct: true }
      - { id: b, text: "เมตร ($\\mathrm{m}$)", feedback: "เมตรเป็นหน่วยความยาว ใช้กับเส้นรอบรูป เช่น ความยาวบัวเชิงผนัง แต่กระเบื้องต้องปูคลุมทั้งผิวพื้นจึงเป็นพื้นที่" }
      - { id: c, text: "ลูกบาศก์เมตร ($\\mathrm{m^3}$)", feedback: "ลูกบาศก์เมตรเป็นหน่วยปริมาตร ใช้กับสิ่งที่มีความลึกด้วย เช่น น้ำในสระ พื้นห้องเป็นผิวแบนสองมิติ" }
      - { id: d, text: "กิโลกรัม ($\\mathrm{kg}$)", feedback: "กิโลกรัมเป็นหน่วยมวล บอกว่ากระเบื้องหนักเท่าไร ไม่ได้บอกว่าคลุมพื้นได้กว้างเท่าไร" }
    hints:
      - "กระเบื้องต้องคลุมผิวพื้นทั้งหมด นี่คือการวัดความยาวรอบหรือขนาดผิว"
      - "พื้นที่นับเป็นจำนวนช่องสี่เหลี่ยมจัตุรัสด้านละ 1 หน่วย"
    solution: "การปูกระเบื้องคือการคลุมผิวพื้น จึงต้องหาพื้นที่ ซึ่งมีหน่วยเป็นตารางเมตร ($\\mathrm{m^2}$) คือจำนวนช่องขนาด $1\\ \\mathrm{m} \\times 1\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.area.p003
    topics: [math.geometry.area-perimeter]
    difficulty: 2
    type: numeric
    stem: "แปลงผักของคุณยายเป็นรูปสี่เหลี่ยมผืนผ้า ยาว $12\\ \\mathrm{m}$ กว้าง $7.5\\ \\mathrm{m}$ ถ้าล้อมรั้วรอบแปลงหนึ่งรอบพอดี ต้องใช้รั้วยาวกี่เมตร (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 39, unit: m }
    hints:
      - "รั้วล้อมรอบขอบแปลง จึงเป็นเส้นรอบรูป ไม่ใช่พื้นที่"
      - "สี่เหลี่ยมผืนผ้ามีด้านยาวสองด้านและด้านกว้างสองด้าน"
      - "ใช้ $2(\\text{ยาว} + \\text{กว้าง})$"
    misconceptions:
      - { match: 90, feedback: "นั่นคือพื้นที่ $12 \\times 7.5$ ในหน่วย $\\mathrm{m^2}$ รั้ววางรอบขอบ จึงต้องหาเส้นรอบรูป" }
      - { match: 19.5, feedback: "นั่นคือด้านยาวบวกด้านกว้างเพียงอย่างละด้าน แปลงมีสี่ด้าน ต้องคูณ 2" }
    solution: "เส้นรอบรูป $= 2(12 + 7.5) = 2(19.5) = 39\\ \\mathrm{m}$ จึงต้องใช้รั้ว $39$ เมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.area.p004
    topics: [math.geometry.area-perimeter]
    difficulty: 2
    type: numeric
    stem: "สามเหลี่ยมรูปหนึ่งมีฐานยาว $10\\ \\mathrm{cm}$ ด้านเอียงยาว $7\\ \\mathrm{cm}$ และความสูงที่วัดตั้งฉากกับฐานยาว $6\\ \\mathrm{cm}$ สามเหลี่ยมนี้มีพื้นที่กี่ตารางเซนติเมตร (ตอบในหน่วย $\\mathrm{cm^2}$)"
    answer: { value: 30, unit: cm² }
    hints:
      - "สูตรพื้นที่สามเหลี่ยมใช้ฐานกับความสูงที่ตั้งฉากกับฐาน"
      - "ด้านเอียงไม่ใช่ความสูง ไม่ต้องใช้ในข้อนี้"
      - "คำนวณ $\\tfrac{1}{2} \\times \\text{ฐาน} \\times \\text{สูง}$"
    misconceptions:
      - { match: 60, feedback: "ดูเหมือนลืม $\\tfrac{1}{2}$ ฐาน × สูง คือพื้นที่สี่เหลี่ยมด้านขนาน สามเหลี่ยมเป็นครึ่งหนึ่งของรูปนั้น" }
      - { match: 35, feedback: "ดูเหมือนใช้ด้านเอียง $7\\ \\mathrm{cm}$ เป็นความสูง ความสูงต้องวัดตั้งฉากกับฐาน คือ $6\\ \\mathrm{cm}$" }
    solution: "พื้นที่ $= \\tfrac{1}{2} \\times 10\\ \\mathrm{cm} \\times 6\\ \\mathrm{cm} = 30\\ \\mathrm{cm^2}$ (ด้านเอียง $7\\ \\mathrm{cm}$ ใช้หาเส้นรอบรูป ไม่ใช้หาพื้นที่)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.area.p005
    topics: [math.geometry.area-perimeter]
    difficulty: 2
    type: match
    stem: "จับคู่รูปกับสูตรพื้นที่ ($b$ = ฐาน, $h$ = ความสูง, $r$ = รัศมี)"
    pairs:
      - { left: "สี่เหลี่ยมด้านขนาน", right: "$bh$" }
      - { left: "สามเหลี่ยม", right: "$\\tfrac{1}{2}bh$" }
      - { left: "สี่เหลี่ยมคางหมู ด้านคู่ขนาน $a$ และ $b$", right: "$\\tfrac{1}{2}(a + b)h$" }
      - { left: "วงกลม", right: "$\\pi r^2$" }
      - { left: "สี่เหลี่ยมจัตุรัส ด้าน $s$", right: "$s^2$" }
    hints:
      - "สามเหลี่ยมเป็นครึ่งหนึ่งของสี่เหลี่ยมด้านขนานที่มีฐานและความสูงเท่ากัน"
      - "สี่เหลี่ยมคางหมูใช้ค่าเฉลี่ยของด้านคู่ขนานคูณความสูง"
    solution: "สี่เหลี่ยมด้านขนาน $bh$ · สามเหลี่ยม $\\tfrac{1}{2}bh$ · สี่เหลี่ยมคางหมู $\\tfrac{1}{2}(a + b)h$ · วงกลม $\\pi r^2$ · สี่เหลี่ยมจัตุรัส $s^2$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.area.p006
    topics: [math.geometry.area-perimeter]
    difficulty: 3
    type: numeric
    stem: "ที่ดินแปลงหนึ่งเป็นรูปสี่เหลี่ยมคางหมู ด้านคู่ขนานยาว $18\\ \\mathrm{m}$ และ $30\\ \\mathrm{m}$ ระยะห่างระหว่างด้านคู่ขนานคือ $12\\ \\mathrm{m}$ ที่ดินมีพื้นที่กี่ตารางเมตร (ตอบในหน่วย $\\mathrm{m^2}$)"
    answer: { value: 288, unit: m² }
    hints:
      - "ระยะห่างระหว่างด้านคู่ขนานคือความสูงของสี่เหลี่ยมคางหมู"
      - "บวกด้านคู่ขนานทั้งสองก่อน"
      - "ใช้ $\\tfrac{1}{2}(a + b)h$"
    misconceptions:
      - { match: 576, feedback: "ดูเหมือนลืม $\\tfrac{1}{2}$ ผลบวกด้านคู่ขนานคูณความสูงได้พื้นที่เป็นสองเท่าของรูปจริง" }
      - { match: 360, feedback: "ดูเหมือนใช้แค่ด้านยาว $30\\ \\mathrm{m}$ คูณความสูง ซึ่งคิดเหมือนเป็นสี่เหลี่ยมผืนผ้า ต้องใช้ค่าเฉลี่ยของด้านคู่ขนานทั้งสอง" }
    solution: "พื้นที่ $= \\tfrac{1}{2}(18 + 30) \\times 12 = \\tfrac{1}{2}(48)(12) = 288\\ \\mathrm{m^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.area.p007
    topics: [math.geometry.area-perimeter]
    difficulty: 3
    type: numeric
    stem: "โต๊ะกลมมีเส้นผ่านศูนย์กลาง $1.4\\ \\mathrm{m}$ หน้าโต๊ะมีพื้นที่กี่ตารางเมตร (ใช้ $\\pi \\approx 3.14$ ตอบในหน่วย $\\mathrm{m^2}$ ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 1.5386, tolerance: 0.015, unit: m² }
    hints:
      - "สูตรพื้นที่วงกลมใช้รัศมี ไม่ใช่เส้นผ่านศูนย์กลาง"
      - "รัศมีเท่ากับครึ่งหนึ่งของเส้นผ่านศูนย์กลาง"
      - "ยกกำลังสองรัศมีก่อน แล้วคูณด้วย $3.14$"
    misconceptions:
      - { match: 6.1544, feedback: "ดูเหมือนใช้เส้นผ่านศูนย์กลาง $1.4\\ \\mathrm{m}$ แทนรัศมี ต้องหารสองก่อน ได้ $r = 0.7\\ \\mathrm{m}$" }
      - { match: 4.396, feedback: "นั่นคือเส้นรอบวง $2\\pi r$ ซึ่งเป็นความยาวรอบโต๊ะ (หน่วย m) โจทย์ถามพื้นที่ ใช้ $\\pi r^2$" }
    solution: "$r = 1.4 \\div 2 = 0.7\\ \\mathrm{m}$ พื้นที่ $= \\pi r^2 \\approx 3.14 \\times 0.7^2 = 3.14 \\times 0.49 = 1.5386 \\approx 1.54\\ \\mathrm{m^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.area.p008
    topics: [math.geometry.area-perimeter]
    difficulty: 3
    type: mcq
    stem: "วงกลมรัศมี $5\\ \\mathrm{cm}$ มีเส้นรอบวงยาวเท่าใด"
    choices:
      - { id: a, text: "$10\\pi\\ \\mathrm{cm}$", correct: true }
      - { id: b, text: "$25\\pi\\ \\mathrm{cm}$", feedback: "$25\\pi$ มาจาก $\\pi r^2$ ซึ่งเป็นพื้นที่ (หน่วย $\\mathrm{cm^2}$) เส้นรอบวงใช้ $2\\pi r$" }
      - { id: c, text: "$5\\pi\\ \\mathrm{cm}$", feedback: "ดูเหมือนลืมคูณ 2 เส้นรอบวงคือ $2\\pi r$ หรือ $\\pi d$ โดย $d = 10\\ \\mathrm{cm}$" }
      - { id: d, text: "$100\\pi\\ \\mathrm{cm}$", feedback: "ดูเหมือนยกกำลังสองเส้นผ่านศูนย์กลาง ($\\pi d^2$) เส้นรอบวงเป็นความยาว จึงไม่มีการยกกำลังสอง" }
    hints:
      - "เส้นรอบวงคือความยาวรอบวงกลม หน่วยเป็นเซนติเมตร ไม่ใช่ตารางเซนติเมตร"
      - "ใช้สูตร $2\\pi r$"
    solution: "เส้นรอบวง $= 2\\pi r = 2\\pi(5) = 10\\pi \\approx 31.4\\ \\mathrm{cm}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.area.p009
    topics: [math.geometry.area-perimeter]
    difficulty: 3
    type: numeric
    stem: "ห้องรูปตัว L ได้จากสี่เหลี่ยมผืนผ้าขนาด $10\\ \\mathrm{m} \\times 8\\ \\mathrm{m}$ ที่ตัดมุมหนึ่งออกเป็นสี่เหลี่ยมผืนผ้าขนาด $4\\ \\mathrm{m} \\times 3\\ \\mathrm{m}$ ห้องนี้มีพื้นที่กี่ตารางเมตร (ตอบในหน่วย $\\mathrm{m^2}$)"
    figure: { src: l-shaped-room.svg, alt: "รูปตัว L ได้จากสี่เหลี่ยมผืนผ้ากว้าง 10 m สูง 8 m ที่ตัดมุมขวาบนออกเป็นสี่เหลี่ยมกว้าง 4 m สูง 3 m ส่วนที่ตัดออกแสดงด้วยเส้นประ" }
    answer: { value: 68, unit: m² }
    hints:
      - "มองห้องเป็นสี่เหลี่ยมใหญ่ที่มีชิ้นหนึ่งหายไป"
      - "หาพื้นที่สี่เหลี่ยมใหญ่และพื้นที่ชิ้นที่ตัดออก"
      - "พื้นที่ห้อง = พื้นที่สี่เหลี่ยมใหญ่ − พื้นที่ชิ้นที่ตัดออก"
    misconceptions:
      - { match: 92, feedback: "ดูเหมือนบวกพื้นที่ชิ้นที่ตัดออกเข้าไป ส่วนที่ถูกตัดหายไปจากห้อง จึงต้องลบออก" }
      - { match: 80, feedback: "นั่นคือพื้นที่สี่เหลี่ยมก่อนตัดมุม ยังต้องลบพื้นที่ $4 \\times 3$ ออก" }
    solution: "สี่เหลี่ยมใหญ่ $10 \\times 8 = 80\\ \\mathrm{m^2}$ ชิ้นที่ตัด $4 \\times 3 = 12\\ \\mathrm{m^2}$ พื้นที่ห้อง $= 80 - 12 = 68\\ \\mathrm{m^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.area.p010
    topics: [math.geometry.area-perimeter]
    difficulty: 4
    type: numeric
    stem: "ห้องรูปตัว L ในข้อก่อน (สี่เหลี่ยม $10\\ \\mathrm{m} \\times 8\\ \\mathrm{m}$ ตัดมุมออก $4\\ \\mathrm{m} \\times 3\\ \\mathrm{m}$) ต้องติดบัวเชิงผนังรอบห้อง ไม่หักประตู ต้องใช้บัวยาวกี่เมตร (ตอบในหน่วย m)"
    figure: { src: l-shaped-room.svg, alt: "รูปตัว L ได้จากสี่เหลี่ยมผืนผ้ากว้าง 10 m สูง 8 m ที่ตัดมุมขวาบนออกเป็นสี่เหลี่ยมกว้าง 4 m สูง 3 m ส่วนที่ตัดออกแสดงด้วยเส้นประ" }
    answer: { value: 36, unit: m }
    hints:
      - "วาดรูปแล้วเขียนความยาวของผนังทั้ง 6 ด้าน"
      - "ผนังสองด้านที่เกิดจากการตัดมุม ยาว $4\\ \\mathrm{m}$ และ $3\\ \\mathrm{m}$ เข้ามาแทนส่วนของขอบเดิมที่หายไป"
      - "บวกความยาวผนังทั้ง 6 ด้าน แล้วเทียบกับเส้นรอบรูปของสี่เหลี่ยมก่อนตัด"
    misconceptions:
      - { match: 29, feedback: "ดูเหมือนลบ $4 + 3$ ออกจากเส้นรอบรูปเดิม แต่การตัดมุมทำให้เกิดผนังใหม่ยาว $4$ และ $3\\ \\mathrm{m}$ มาแทนขอบที่หายไปพอดี เส้นรอบรูปจึงไม่ลดลง" }
      - { match: 22, feedback: "ดูเหมือนลบเส้นรอบรูปของชิ้นที่ตัด $2(4 + 3) = 14$ ออก ลองบวกความยาวผนังทั้ง 6 ด้านจริง ๆ ดู" }
    solution: "ผนังทั้ง 6 ด้านยาว $10$, $8 - 3 = 5$, $4$, $3$, $10 - 4 = 6$ และ $8\\ \\mathrm{m}$ รวม $10 + 5 + 4 + 3 + 6 + 8 = 36\\ \\mathrm{m}$ เท่ากับ $2(10 + 8) = 36\\ \\mathrm{m}$ ของสี่เหลี่ยมก่อนตัด เพราะผนังใหม่สองด้านแทนขอบเดิมที่หายไปพอดี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.area.p011
    topics: [math.geometry.area-perimeter]
    difficulty: 4
    type: numeric
    stem: "ผนังห้องด้านหนึ่งกว้าง $4\\ \\mathrm{m}$ สูง $2.5\\ \\mathrm{m}$ มีหน้าต่างขนาด $1.2\\ \\mathrm{m} \\times 1\\ \\mathrm{m}$ และประตูขนาด $0.8\\ \\mathrm{m} \\times 2\\ \\mathrm{m}$ ต้องทาสีผนังด้านนี้ (ไม่ทาหน้าต่างและประตู) กี่ตารางเมตร (ตอบในหน่วย $\\mathrm{m^2}$)"
    answer: { value: 7.2, tolerance: 0.07, unit: m² }
    hints:
      - "หาพื้นที่ผนังทั้งหมดก่อน"
      - "หาพื้นที่หน้าต่างและพื้นที่ประตูแยกกัน"
      - "ลบพื้นที่หน้าต่างและประตูออกจากพื้นที่ผนัง"
    misconceptions:
      - { match: 10, feedback: "นั่นคือพื้นที่ผนังทั้งหมด ยังไม่ได้หักหน้าต่างและประตูที่ไม่ต้องทาสี" }
      - { match: 12.8, feedback: "ดูเหมือนบวกพื้นที่หน้าต่างและประตูเข้าไป ส่วนนั้นไม่ต้องทาสี จึงต้องลบออก" }
    solution: "ผนัง $4 \\times 2.5 = 10\\ \\mathrm{m^2}$ หน้าต่าง $1.2 \\times 1 = 1.2\\ \\mathrm{m^2}$ ประตู $0.8 \\times 2 = 1.6\\ \\mathrm{m^2}$ พื้นที่ทาสี $= 10 - 1.2 - 1.6 = 7.2\\ \\mathrm{m^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.area.p012
    topics: [math.geometry.area-perimeter]
    difficulty: 4
    type: numeric
