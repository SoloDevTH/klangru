    answer: { value: 7, unit: "%" }
    hints:
      - "หาร 84 ด้วย 1,200"
      - "คูณ 100 เพื่อเป็นร้อยละ"
    misconceptions:
      - { match: 14.29, feedback: "หารกลับด้าน (1,200 ÷ 84) ต้องเอาคำสั่งซื้อเป็นตัวตั้ง" }
