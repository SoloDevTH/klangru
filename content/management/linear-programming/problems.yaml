  - id: management.operations.linear-programming.p014
    topics: [management.operations.linear-programming]
    difficulty: 5
    type: numeric
    stem: "ฟาร์มไก่ (สมมติ) ผสมอาหาร 1 ชุดจากข้าวโพด $x$ กิโลกรัม (12 บาทต่อกิโลกรัม โปรตีน 10%) และกากถั่วเหลือง $y$ กิโลกรัม (18 บาทต่อกิโลกรัม โปรตีน 45%) อาหารหนึ่งชุดต้องหนักอย่างน้อย 100 กิโลกรัม และมีโปรตีนอย่างน้อย 18 กิโลกรัม ต้นทุนต่ำสุดต่อชุดเป็นกี่บาท (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 1337.14, unit: บาท, tolerance: 0.5 }
    hints:
      - "ข้อจำกัด: x + y ≥ 100 และ 0.10x + 0.45y ≥ 18 ต้นทุน C = 12x + 18y ให้น้อยที่สุด"
      - "จุดมุมคือ (0, 100), (180, 0) และจุดตัดของสองเส้น แก้หาจุดตัดแล้วเทียบต้นทุน"
    misconceptions:
      - { match: 1200, feedback: "ใช้ข้าวโพด 100 กิโลกรัมอย่างเดียว ได้โปรตีนแค่ 10 กิโลกรัม ไม่ถึง 18 กิโลกรัม จุดนี้อยู่นอกบริเวณที่เป็นไปได้" }
      - { match: 1800, feedback: "นั่นคือต้นทุนที่ (0, 100) ใช้กากถั่วเหลืองอย่างเดียว ยังมีจุดมุมที่ถูกกว่า" }
    solution: "จาก $x = 100 - y$ แทนใน $0.10(100 - y) + 0.45y = 18$ ได้ $0.35y = 8$ จึง $y = 160/7 \\approx 22.86$, $x = 540/7 \\approx 77.14$ ต้นทุน $12(77.14) + 18(22.86) = 9{,}360/7 \\approx 1{,}337.14$ บาท ถูกกว่าจุดมุม (0, 100) = 1,800 และ (180, 0) = 2,160 บาท"
