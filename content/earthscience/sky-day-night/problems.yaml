    answer: { value: 24, unit: ชั่วโมง }
    misconceptions:
      - { match: 12, feedback: "12 ชั่วโมงคือกลางวันของโลกที่หมุนรอบละ 24 ชั่วโมงในปัจจุบัน โจทย์ให้โลกหมุนช้าลงเป็นรอบละ 48 ชั่วโมง" }
      - { match: 48, feedback: "48 ชั่วโมงคือเวลาของกลางวันรวมกับกลางคืน หนึ่งรอบมีทั้งกลางวันและกลางคืน" }
    hints:
      - "หมุนครบหนึ่งรอบ มีทั้งกลางวันและกลางคืน"
      - "แบ่งเวลาหนึ่งรอบออกเป็นสองส่วนเท่ากัน"
    solution: "หนึ่งรอบมีกลางวันหนึ่งช่วงและกลางคืนหนึ่งช่วง ถ้ายาวเท่ากัน กลางวันยาว $48 \\div 2 = 24$ ชั่วโมง ตัวอย่างนี้แสดงว่ากลางวันกลางคืนเกิดจากการหมุนของโลก ถ้าการหมุนเปลี่ยน ความยาวของวันก็เปลี่ยน"
