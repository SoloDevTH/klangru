  - 'หลังแบ่งงาน: ไทยได้ข้าว $600$ B ต้องผลิตข้าวเพิ่มอีก $100$ กระสอบ ใช้แรงงาน $12.5$ วัน'
  solution: 'ก่อนค้า: ข้าวรวม $300 + 400 = 700$ กระสอบ ชิ้นส่วนรวม $100 + 400 = 500$ ชิ้น หลังแบ่งงาน: ไทยผลิตข้าว $600$ กระสอบ B ผลิตข้าว $100$ กระสอบ ($12.5$ วัน) และชิ้นส่วน $87.5 \times 8 = 700$ ชิ้น ข้าวรวมยังเป็น $700$ ชิ้นส่วนรวม $700$ ชิ้น เพิ่มขึ้น $200$ ชิ้น นี่คือผลได้จากการค้า'
