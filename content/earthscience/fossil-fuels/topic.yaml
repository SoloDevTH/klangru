id: earthscience.geology.fossil-fuels
subject: earthscience
title: { th: ปิโตรเลียมและถ่านหิน, en: "Petroleum and coal" }
summary: ระบบปิโตรเลียมตั้งแต่หินต้นกำเนิดถึงโครงสร้างกักเก็บ การเกิดและลำดับชั้นของถ่านหิน การสำรวจด้วยธรณีวิทยาและคลื่นไหวสะเทือน การกลั่นลำดับส่วน การแตกตัว และแหล่งในประเทศไทย
difficulty: 4.5
minutes: 40
prerequisites: [earthscience.geology.geologic-history-maps]
encompasses:
  - { id: earthscience.geology.geologic-history-maps, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: โครงสร้างกักเก็บแบบประทุนคว่ำ
    src: anticline-trap.svg
    alt: "ภาพตัดขวางชั้นหินที่โค้งขึ้นเป็นรูปประทุนคว่ำ จากล่างขึ้นบน หินดินดานสีดำซึ่งเป็นหินต้นกำเนิด มีสารอินทรีย์มาก หินดินดานสีเทา หินทรายสีเหลืองซึ่งเป็นหินกักเก็บ มีรูพรุนและน้ำมันไหลผ่านได้ หินดินดานสีเทาเข้มซึ่งเป็นหินปิดกั้น น้ำมันและแก๊สซึมผ่านไม่ได้ และหินตะกอนทั่วไปด้านบน ลูกศรแดงแสดงปิโตรเลียมเคลื่อนที่ขึ้นจากหินต้นกำเนิดสู่ยอดโค้ง ที่ยอดโค้งในหินทรายใต้หินปิดกั้น มีแก๊สอยู่บนสุด น้ำมันอยู่ถัดลงมา ใต้เส้นประแนวนอนรูพรุนมีน้ำ หลุมเจาะลงมาตรงยอดโค้ง"
    caption: "ปิโตรเลียมเบากว่าน้ำ จึงเคลื่อนขึ้นไปสะสมที่ยอดโค้งใต้หินปิดกั้น (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: worked-example
    title: หาความลึกของชั้นหินจากคลื่นไหวสะเทือน
    problem: "เรือสำรวจในอ่าวไทยส่งคลื่นเสียงลงไป คลื่นสะท้อนจากผิวบนของชั้นหินกักเก็บกลับมาถึงเครื่องรับใช้เวลา 1.6 วินาที ถ้าคลื่นเดินทางในชั้นตะกอนด้วยอัตราเร็วเฉลี่ย 2,400 เมตรต่อวินาที (ไม่คิดความลึกของน้ำทะเลแยก) ชั้นหินนี้ลึกกี่เมตร"
    steps:
      - text: "ระยะที่คลื่นเดินทางทั้งหมด $= vt = 2{,}400 \\times 1.6 = 3{,}840$ เมตร"
      - text: "ระยะนี้คือลงไปแล้วกลับขึ้นมา ความลึกจึงเป็นครึ่งหนึ่ง"
        why: "เวลาที่เครื่องวัดได้เป็นเวลาไป–กลับ"
      - text: "$d = \\dfrac{3{,}840}{2} = 1{,}920$ เมตร"
    answer: "ราว 1,920 เมตร"
  - { type: check, problem: earthscience.geology.fossil-fuels.p007, prompt: "เวลาที่วัดได้เป็นเวลาไป–กลับ" }
  - type: figure
    title: การกลั่นลำดับส่วนน้ำมันดิบ
    src: distillation.svg
    alt: "หอกลั่นทรงสูง ด้านล่างร้อน ด้านบนเย็น น้ำมันดิบที่ให้ความร้อนราว 350–400 องศาเซลเซียสเข้าทางด้านล่าง ส่วนที่ออกจากบนลงล่าง แก๊สปิโตรเลียม จุดเดือดต่ำกว่า 30 °C C1–C4 ใช้เป็นแก๊สหุงต้มและวัตถุดิบปิโตรเคมี แนฟทาและน้ำมันเบนซิน 30–180 °C C5–C10 น้ำมันก๊าด 180–250 °C C10–C14 ใช้เป็นน้ำมันเครื่องบิน น้ำมันดีเซล 250–350 °C C14–C20 น้ำมันเตาและน้ำมันหล่อลื่น สูงกว่า 350 °C C20–C40 และยางมะตอยเป็นกากที่เหลือ มากกว่า C40 ใช้ราดถนน"
    caption: "โมเลกุลเล็ก จุดเดือดต่ำ ขึ้นไปควบแน่นด้านบน โมเลกุลใหญ่ควบแน่นด้านล่าง ช่วงอุณหภูมิเป็นค่าโดยประมาณ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ดุลสมการการแตกตัว
    problem: "โรงกลั่นแตกตัวโดเดเคน $\\mathrm{C_{12}H_{26}}$ ได้ออกเทน $\\mathrm{C_8H_{18}}$ กับเอทีน $\\mathrm{C_2H_4}$ ต้องได้เอทีนกี่โมเลกุลต่อโดเดเคน 1 โมเลกุล"
    steps:
      - text: "คาร์บอนที่เหลือหลังได้ออกเทน $= 12 - 8 = 4$ อะตอม"
      - text: "เอทีน 1 โมเลกุลมีคาร์บอน 2 อะตอม จึงต้องได้ $4 \\div 2 = 2$ โมเลกุล"
      - text: "ตรวจไฮโดรเจน: $18 + 2 \\times 4 = 26$ ตรงกับ $\\mathrm{C_{12}H_{26}}$"
        why: "สมการเคมีต้องมีอะตอมแต่ละชนิดเท่ากันทั้งสองข้าง"
    answer: "$\\mathrm{C_{12}H_{26}} \\rightarrow \\mathrm{C_8H_{18}} + \\mathrm{2C_2H_4}$ ได้เอทีน 2 โมเลกุล"
  - { type: check, problem: earthscience.geology.fossil-fuels.p012, prompt: "นับอะตอมไฮโดรเจนทั้งสองข้าง" }
glossary:
  - { term: ปิโตรเลียม, definition: "สารประกอบไฮโดรคาร์บอนที่เกิดตามธรรมชาติใต้ผิวโลก ได้แก่ น้ำมันดิบและแก๊สธรรมชาติ" }
  - { term: หินต้นกำเนิด, definition: "หินตะกอนเม็ดละเอียดที่มีสารอินทรีย์มาก เช่น หินดินดานสีดำ เมื่อได้รับความร้อนพอจะให้ปิโตรเลียม" }
  - { term: หินกักเก็บ, definition: "หินที่มีรูพรุนมากและรูพรุนต่อถึงกัน เช่น หินทราย ปิโตรเลียมสะสมอยู่ในรูพรุน" }
  - { term: หินปิดกั้น, definition: "หินเนื้อแน่นที่ของไหลซึมผ่านไม่ได้ เช่น หินดินดาน วางตัวอยู่เหนือหินกักเก็บ" }
  - { term: โครงสร้างกักเก็บ, definition: "รูปแบบการวางตัวของชั้นหินที่กักปิโตรเลียมไว้ เช่น ประทุนคว่ำ รอยเลื่อน โดมเกลือ" }
  - { term: ช่วงหน้าต่างน้ำมัน, definition: "ช่วงอุณหภูมิราว 60–120 °C ที่สารอินทรีย์ในหินต้นกำเนิดแตกตัวเป็นน้ำมัน" }
  - { term: การกลั่นลำดับส่วน, definition: "การแยกน้ำมันดิบเป็นส่วนต่าง ๆ ตามช่วงจุดเดือดในหอกลั่นที่ด้านล่างร้อนด้านบนเย็น" }
  - { term: การแตกตัว, definition: "การทำให้โมเลกุลไฮโดรคาร์บอนสายยาวแตกเป็นโมเลกุลสั้นด้วยความร้อนและตัวเร่งปฏิกิริยา ได้เชื้อเพลิงและแอลคีนสำหรับทำพลาสติก" }
flashcards:
  - { front: "ระบบปิโตรเลียมต้องมีอะไรบ้าง", back: "หินต้นกำเนิด ความร้อนพอ การเคลื่อนที่ หินกักเก็บ และโครงสร้างกักเก็บที่มีหินปิดกั้น" }
  - { front: "เรียงถ่านหินตามคาร์บอนจากน้อยไปมาก", back: "พีต ลิกไนต์ บิทูมินัส แอนทราไซต์" }
  - { front: "หาความลึกจากการสำรวจคลื่นไหวสะเทือนแบบสะท้อน", back: "d = vt/2 เพราะ t เป็นเวลาไป–กลับ" }
  - { front: "ยิ่งไฮโดรคาร์บอนมีคาร์บอนมาก สมบัติเปลี่ยนอย่างไร", back: "จุดเดือดสูงขึ้น หนืดขึ้น ติดไฟยากขึ้น สีเข้มขึ้น" }
  - { front: "การแตกตัวมีไว้ทำไม", back: "เปลี่ยนส่วนที่โมเลกุลยาวและขายยากเป็นน้ำมันเบนซินและแอลคีนสำหรับทำพลาสติก" }
