    indicators: [AC9TDI2P06, AC9TDI4P08, AC9TDI6P09, AC9TDI10K01]
    coverage: partial
    note: อธิบายรหัสผ่านที่จำง่ายแต่เดายาก วลีรหัสผ่าน และความเสี่ยงของการใช้รหัสซ้ำครบ แต่การเข้าบัญชีโรงเรียนและบัญชีส่วนตัวจริงทำนอกแอป
  - topic: computer.security.cybersecurity-basics
    indicators: [AC9TDI8P13, AC9TDI10P13]
    coverage: full
