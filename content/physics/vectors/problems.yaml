      - { match: 6.4, feedback: "ดูเหมือนนับองค์ประกอบ $x$ ของ $\\vec{B}$ เป็นบวก $\\vec{B}$ ชี้ไปทางซ้าย องค์ประกอบ $x$ จึงเป็น $-1$" }
