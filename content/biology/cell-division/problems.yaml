  - id: biology.cells.cell-division.p016
    topics: [biology.cells.cell-division]
    difficulty: 5
    type: numeric
    stem: "สิ่งมีชีวิตชนิดหนึ่งมี $2n = 8$ ถ้าไม่คิดครอสซิงโอเวอร์ การจัดเรียงฮอมอโลกัสโครโมโซมอย่างอิสระในเมทาเฟส I ทำให้ได้เซลล์สืบพันธุ์ที่มีชุดโครโมโซมต่างกันได้กี่แบบ"
    answer: { value: 16, unit: แบบ }
    hints:
      - "สิ่งมีชีวิตนี้มีฮอมอโลกัสโครโมโซมกี่คู่"
      - "แต่ละคู่ส่งแท่งจากแม่หรือจากพ่อไปได้ 2 ทาง จึงได้ $2^{\\text{จำนวนคู่}}$ แบบ"
    misconceptions:
      - { match: 256, feedback: "คำนวณ $2^8$ ใช้จำนวนโครโมโซมทั้งหมด ต้องใช้จำนวนคู่ ($n = 4$)" }
      - { match: 8, feedback: "นำ 2 คูณ 4 แต่แต่ละคู่จัดเรียงอย่างอิสระต่อกัน จึงต้องคูณ 2 ซ้ำ 4 ครั้ง" }
    solution: "$2n = 8$ มี 4 คู่ แต่ละคู่ไปได้ 2 แบบ อย่างอิสระ ได้ $2^4 = 16$ แบบ (สำหรับคนที่มี 23 คู่ได้ $2^{23} \\approx 8.4$ ล้านแบบ)"
