  # ลำดับ 3
  - { id: management.operations.packaging-systems, title: "ระบบบรรจุภัณฑ์และหน่วยขนส่งในงานโลจิสติกส์", difficulty: 6.5, prereq: [management.operations.supply-chain], indicators: ["th-tqf-logistics:8.2.4"], scope: "หน้าที่ของบรรจุภัณฑ์ในโลจิสติกส์ (ปกป้อง รวมหน่วย สื่อสาร สะดวกต่อการขนถ่าย) ระดับบรรจุภัณฑ์ชั้นใน ชั้นกลาง และชั้นนอก การรวมหน่วยขนส่ง (unit load) ด้วยพาเลทและตู้คอนเทนเนอร์ ขนาดพาเลทมาตรฐาน ISO 6780 (เช่น 1200 × 1000 และ 1100 × 1100 มม.) คำนวณจำนวนกล่องต่อชั้นต่อพาเลทและอัตราการใช้พื้นที่ ความแข็งแรงของกล่องลูกฟูกกับการซ้อน ฉลากและสัญลักษณ์การขนถ่ายตาม ISO 780 รหัสแท่งและมาตรฐาน GS1 ต้นทุนบรรจุภัณฑ์เทียบกับความเสียหายระหว่างขนส่ง บรรจุภัณฑ์หมุนเวียน ความยั่งยืน และหลักการขยายความรับผิดชอบของผู้ผลิต (EPR)" }
  # ลำดับ 2
  - { id: management.research.research-methods, title: "ระเบียบวิธีวิจัยทางบริหารธุรกิจและรัฐประศาสนศาสตร์", difficulty: 6, prereq: [math.stats.sampling-surveys, business.stats.descriptive], indicators: ["th-tqf-public-administration:5.2(3)", "th-tqf-public-administration:5.5(1)", "th-tqf-public-administration:5.5(2)", "th-tqf-logistics:5.2(3)"], scope: "กระบวนการวิจัย ปัญหา คำถาม วัตถุประสงค์ การทบทวนวรรณกรรม การค้นงานวิจัยปัจจุบัน (ThaiJO ฐานข้อมูลวิทยานิพนธ์ Google Scholar) และอ่านบทคัดย่อเพื่อติดตามความรู้ใหม่ในสาขา รูปแบบการวิจัย (สำรวจ กรณีศึกษา กึ่งทดลอง ผสานวิธี) กรอบแนวคิดและตัวแปร การสุ่มตัวอย่างและขนาดตัวอย่าง แบบสอบถามและมาตรวัดลิเคิร์ต ความเที่ยงและความตรงของเครื่องมือ สถิติพื้นฐานที่เหมาะกับคำถาม (ร้อยละ ค่าเฉลี่ย ส่วนเบี่ยงเบนมาตรฐาน การเลือกไคสแควร์ การทดสอบที และสหสัมพันธ์ตามชนิดตัวแปร) การอ่านค่า p ที่รายงานโดยไม่ตีความเกิน การใช้สเปรดชีตหรือโปรแกรมสถิติ และการนำเสนอผลด้วยตารางและกราฟ จริยธรรมการวิจัยในมนุษย์ (ความยินยอม ความลับ) ใช้ตัวอย่างงานวิจัยบริการสาธารณะและโลจิสติกส์ ไม่สอนวิธีคำนวณการทดสอบสมมติฐาน (อยู่ใน math.stats.inference)" }
