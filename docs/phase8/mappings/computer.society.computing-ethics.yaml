topic: computer.society.computing-ethics
rows:
  - { framework: acm-cs2023, indicators: ["SEP-Ethical-Analysis"], coverage: full, note: "สอนกรอบวิเคราะห์เชิงจริยธรรมสี่แบบ (ผลลัพธ์นิยม หน้าที่นิยม คุณธรรม สัญญาประชาคม) และขั้นตอนวิเคราะห์ผู้มีส่วนได้เสีย โจทย์ p001 p002 p006" }
  - { framework: acm-cs2023, indicators: ["SEP-Professional-Ethics"], coverage: partial, note: "สอนหลักความรับผิดชอบของผู้ปฏิบัติงานและการรายงานปัญหาจากจรรยาบรรณทั่วไป (p005 p019) แต่ยังไม่ได้วิเคราะห์กรณีจรรยาบรรณฉบับเต็มทีละข้อ ข้อความเฉพาะต้องตรวจก่อนเผยแพร่" }
  - { framework: acm-cs2023, indicators: ["SEP-Context"], coverage: partial, note: "สอนผลของแอปต่อคนในชุมชนที่ไม่ได้ใช้ระบบ และผลของความไม่เท่าเทียมในการเข้าถึง (p010 p015) แต่ยังไม่ครอบคลุมบริบททางสังคมทั้งหมด" }
  - { framework: acm-cs2023, indicators: ["AL-SEP"], coverage: partial, note: "สอนอคติในระบบที่เรียนรู้จากข้อมูลและการทดสอบแยกกลุ่ม (p011 p012 p017) เป็นบริบทอัลกอริทึม แต่ไม่ได้สอนการออกแบบอัลกอริทึมเชิงลึก" }
  - { framework: acm-cs2023, indicators: ["HCI-Accountability"], coverage: partial, note: "สอนความรับผิดชอบของผู้ออกแบบต่อการเลือกค่านิยมและการเลือกค่าเริ่มต้น (p009 p018) แต่ยังไม่มีแบบฝึกออกแบบอินเทอร์เฟซจริง" }
  - { framework: csta-k12-cs-2026, indicators: ["MS-ALG-IM-11"], coverage: partial, note: "สอนการปรับอัลกอริทึมเพื่อลดผลเสียทางสังคมในระดับแนวคิด (ทางเลือกเส้นทาง ทางเลือกการแจ้งเตือน) แต่ผู้เรียนไม่ได้แก้โค้ดจริง" }
  - { framework: csta-k12-cs-2026, indicators: ["HS-ALG-IM-11"], coverage: partial, note: "สอนการระบุค่านิยมที่ฝังในระบบ (ประสิทธิภาพกับความปลอดภัย) และตัวอย่างการเลือกค่าเริ่มต้น แต่ยังไม่ได้เขียนคำอธิบายค่านิยมของระบบให้ผู้เรียนเอง" }
  - { framework: csta-k12-cs-2026, indicators: ["MS-SOC-HU-43"], coverage: full, note: "วิเคราะห์ว่าการตัดสินใจของมนุษย์ในการใช้เทคโนโลยีมีผลทางจริยธรรมและสังคม (ทางเลือกของผู้ขับขี่ ผู้ออกแบบ และผู้ปกครองในตัวอย่าง)" }
  - { framework: csta-k12-cs-2026, indicators: ["HS-SOC-HU-43"], coverage: partial, note: "สอนการประเมินความเสี่ยงและประโยชน์ระยะยาวของการตัดสินใจทางเทคโนโลยี แต่การกำกับดูแลเชิงนโยบายสอนเพียงหลักการ" }
  - { framework: csta-k12-cs-2026, indicators: ["MS-SOC-ET-41"], coverage: partial, note: "สอนว่าการออกแบบทำให้ชุมชนต่างกันได้รับประสบการณ์ต่างกัน (ผู้ใช้อุปกรณ์รุ่นเก่า ชุมชนที่เข้าถึงอินเทอร์เน็ตได้น้อย) โดยยังไม่มีกิจกรรมสำรวจชุมชนจริง" }
  - { framework: csta-k12-cs-2026, indicators: ["MS-SOC-ET-42"], coverage: partial, note: "สอนผลของเทคโนโลยีใหม่ต่อชุมชนท้องถิ่นผ่านกรณีซอยชุมชน แต่การอภิปรายเป็นกลุ่มเป็นกิจกรรมที่แอปไม่ได้จัด" }
  - { framework: csta-k12-cs-2026, indicators: ["HS-SOC-ET-41"], coverage: partial, note: "สอนการประเมินผลกระทบทางสังคมและสิ่งแวดล้อมที่นำไปสู่ความไม่เท่าเทียม (p015) แต่ยังไม่ครอบคลุมผลกระทบสิ่งแวดล้อมอย่างลึก" }
  - { framework: csta-k12-cs-2026, indicators: ["HS-SOC-ET-42"], coverage: partial, note: "บทเรียนส่วนออกแบบทางแก้ด้วยเทคโนโลยีใหม่ (กล้องวัดความเร็วในซอย) ชั่งผลดีผลเสียและลดผลเสียตั้งแต่การออกแบบ แต่ผู้เรียนยังไม่ได้เสนอทางแก้ของตนเอง" }
  - { framework: csta-k12-cs-2026, indicators: ["HS-SOC-HI-39"], coverage: partial, note: "สอนการเสนอแก้นโยบายให้ส่งเสริมนวัตกรรมอย่างมีจริยธรรม (p016) โดยไม่ได้ร่างกฎหมายจริงและต้องตรวจกับแหล่งทางการก่อนเผยแพร่" }
