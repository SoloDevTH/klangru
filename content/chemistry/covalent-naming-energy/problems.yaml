problems:
  - id: chemistry.bonding.covalent-naming-energy.p001
    topics: [chemistry.bonding.covalent-naming-energy]
    difficulty: 1
    type: mcq
    stem: "อุปกรณ์ตัดตอนไฟฟ้าแรงสูงในสถานีไฟฟ้าบรรจุแก๊ส $\\mathrm{SF_6}$ เป็นฉนวน แก๊สนี้ชื่อว่าอะไร"
    choices:
      - { id: a, text: "ซัลเฟอร์เฮกซะฟลูออไรด์", correct: true, feedback: "ถูก S 1 อะตอมไม่ต้องใส่ มอนอ และ F 6 อะตอมใช้ เฮกซะ" }
      - { id: b, text: "มอนอซัลเฟอร์เฮกซะฟลูออไรด์", feedback: "ธาตุตัวแรกที่มีอะตอมเดียวไม่ต้องใส่ มอนอ" }
      - { id: c, text: "ซัลเฟอร์เพนตะฟลูออไรด์", feedback: "เพนตะ คือ 5 แต่ $\\mathrm{SF_6}$ มี F 6 อะตอม" }
      - { id: d, text: "ซัลเฟอร์ฟลูออรีน", feedback: "ธาตุตัวหลังต้องเปลี่ยนท้ายเป็น -ไอด์ และต้องมีคำนำหน้าบอกจำนวน" }
    hints:
      - "เลข 6 ใช้คำนำหน้าว่าอะไร"
      - "ธาตุตัวหลังเปลี่ยนท้ายเป็น -ไอด์ ฟลูออรีน → ฟลูออไรด์"
    solution: "S 1 อะตอม (ไม่ใส่ มอนอ) + F 6 อะตอม (เฮกซะ) + ฟลูออไรด์ = **ซัลเฟอร์เฮกซะฟลูออไรด์**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.covalent-naming-energy.p002
    topics: [chemistry.bonding.covalent-naming-energy]
    difficulty: 1
    type: mcq
    stem: "พลังงานพันธะ หมายถึงข้อใด"
    choices:
      - { id: a, text: "พลังงานที่ต้องใช้สลายพันธะชนิดนั้น 1 โมล ในสถานะแก๊ส ให้เป็นอะตอมอิสระ", correct: true, feedback: "ถูก เป็นพลังงานที่ต้องใส่เข้าไปเสมอ" }
      - { id: b, text: "พลังงานที่ปล่อยออกมาเมื่อสลายพันธะ", feedback: "การสลายพันธะต้องใช้พลังงาน ไม่ได้ปล่อยพลังงาน" }
      - { id: c, text: "พลังงานที่อยู่ในอิเล็กตรอนหนึ่งตัว", feedback: "พลังงานพันธะเป็นของพันธะทั้งพันธะ คิดต่อโมลของพันธะ" }
    hints:
      - "นึกถึงการดึงแม่เหล็กสองก้อนที่ติดกันให้แยกออก ต้องออกแรงหรือได้แรง"
      - "ค่าในตารางมีหน่วย kJ/mol"
    solution: "พลังงานพันธะคือพลังงานที่ **ต้องใช้** สลายพันธะชนิดหนึ่ง 1 โมลในสถานะแก๊สให้เป็นอะตอม ค่าจึงเป็นบวกเสมอ ส่วนการสร้างพันธะเดียวกันจะคายพลังงานเท่ากัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.covalent-naming-energy.p003
    topics: [chemistry.bonding.covalent-naming-energy]
    difficulty: 2
    type: match
    stem: "จับคู่สูตรกับชื่อ"
    pairs:
      - { left: "$\\mathrm{PCl_5}$", right: "ฟอสฟอรัสเพนตะคลอไรด์" }
      - { left: "$\\mathrm{CS_2}$", right: "คาร์บอนไดซัลไฟด์" }
      - { left: "$\\mathrm{N_2O}$", right: "ไดไนโตรเจนมอนอกไซด์" }
      - { left: "$\\mathrm{SiCl_4}$", right: "ซิลิคอนเตตระคลอไรด์" }
      - { left: "$\\mathrm{NO_2}$", right: "ไนโตรเจนไดออกไซด์" }
    hints:
      - "อ่านตัวเลขห้อยของธาตุตัวหลังเป็นคำนำหน้า 2 ได 4 เตตระ 5 เพนตะ"
      - "ถ้าธาตุตัวแรกมี 2 อะตอม ต้องใส่ ได หน้าชื่อธาตุตัวแรกด้วย"
    solution: "$\\mathrm{PCl_5}$ ฟอสฟอรัสเพนตะคลอไรด์ · $\\mathrm{CS_2}$ คาร์บอนไดซัลไฟด์ · $\\mathrm{N_2O}$ ไดไนโตรเจนมอนอกไซด์ (แก๊สหัวเราะ) · $\\mathrm{SiCl_4}$ ซิลิคอนเตตระคลอไรด์ · $\\mathrm{NO_2}$ ไนโตรเจนไดออกไซด์ (มลพิษจากท่อไอเสีย)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.covalent-naming-energy.p004
    topics: [chemistry.bonding.covalent-naming-energy]
    difficulty: 2
    type: text
    stem: "เขียนสูตรโมเลกุลของ ไดไนโตรเจนเพนตะออกไซด์ (พิมพ์ตัวเลขห้อยเป็นตัวเลขธรรมดา เช่น CO2)"
    accepted: ["N2O5", "N₂O₅"]
    misconceptions:
      - { match: "NO5", feedback: "ได หน้าไนโตรเจนบอกว่ามีไนโตรเจน 2 อะตอม" }
      - { match: "N2O4", feedback: "เพนตะ คือ 5 ไม่ใช่ 4 (เตตระ)" }
      - { match: "N5O2", feedback: "คำนำหน้าบอกจำนวนของธาตุที่ตามมาทันที ได อยู่หน้าไนโตรเจน เพนตะ อยู่หน้าออกไซด์" }
    hints:
      - "ได = 2 และอยู่หน้าไนโตรเจน"
      - "เพนตะ = 5 และอยู่หน้าออกไซด์"
    solution: "ได-ไนโตรเจน → N 2 อะตอม · เพนตะ-ออกไซด์ → O 5 อะตอม ได้ $\\mathrm{N_2O_5}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.covalent-naming-energy.p005
    topics: [chemistry.bonding.covalent-naming-energy]
    difficulty: 2
    type: mcq
    stem: "สารประกอบที่มีออกซิเจน 1 อะตอมและฟลูออรีน 2 อะตอม ควรเขียนสูตรและเรียกชื่ออย่างไร (อิเล็กโทรเนกาติวิตี O 3.44, F 3.98)"
    choices:
      - { id: a, text: "$\\mathrm{OF_2}$ ออกซิเจนไดฟลูออไรด์", correct: true, feedback: "ถูก F มีอิเล็กโทรเนกาติวิตีสูงกว่าจึงเขียนไว้ท้าย" }
      - { id: b, text: "$\\mathrm{F_2O}$ ไดฟลูออรีนออกไซด์", feedback: "ธาตุที่มีอิเล็กโทรเนกาติวิตีสูงกว่าต้องอยู่ท้าย F สูงกว่า O จึงต้องอยู่ท้าย" }
      - { id: c, text: "$\\mathrm{OF_2}$ ออกซิเจนฟลูออรีน", feedback: "สูตรถูก แต่ชื่อธาตุตัวหลังต้องลงท้าย -ไอด์ และมีคำนำหน้าบอกจำนวน" }
    hints:
      - "ธาตุที่อิเล็กโทรเนกาติวิตีต่ำกว่าเขียนก่อน"
      - "ออกซิเจนส่วนใหญ่อยู่ท้ายสูตร แต่ฟลูออรีนเป็นธาตุเดียวที่ดึงอิเล็กตรอนแรงกว่าออกซิเจน"
    solution: "O มีอิเล็กโทรเนกาติวิตีต่ำกว่า F จึงเขียนก่อน: $\\mathrm{OF_2}$ เรียกว่า **ออกซิเจนไดฟลูออไรด์** เป็นกรณีที่ออกซิเจนไม่ได้ถูกเรียกเป็นออกไซด์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.covalent-naming-energy.p006
    topics: [chemistry.bonding.covalent-naming-energy]
    difficulty: 3
    type: text
    stem: "สารประกอบของคลอรีน 2 อะตอมกับออกซิเจน 1 อะตอม เขียนสูตรโมเลกุลที่ถูกต้องตามลำดับธาตุ (Cl 3.16, O 3.44)"
    accepted: ["Cl2O", "Cl₂O"]
    misconceptions:
      - { match: "OCl2", feedback: "ธาตุที่อิเล็กโทรเนกาติวิตีต่ำกว่าต้องเขียนก่อน Cl (3.16) ต่ำกว่า O (3.44)" }
      - { match: "ClO2", feedback: "นั่นคือคลอรีนไดออกไซด์ ซึ่งมี Cl 1 อะตอม O 2 อะตอม" }
    hints:
      - "เทียบอิเล็กโทรเนกาติวิตีของ Cl กับ O"
      - "ธาตุที่ค่าต่ำกว่าเขียนก่อน แล้วใส่ตัวเลขห้อยตามจำนวนอะตอม"
    solution: "Cl มีอิเล็กโทรเนกาติวิตีต่ำกว่า O จึงเขียนก่อน ได้ $\\mathrm{Cl_2O}$ ชื่อ **ไดคลอรีนมอนอกไซด์**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.covalent-naming-energy.p007
    topics: [chemistry.bonding.covalent-naming-energy]
    difficulty: 3
    type: text
    stem: "สารดูดความชื้น $\\mathrm{P_4O_{10}}$ มีชื่อว่าอะไร"
    accepted: ["เตตระฟอสฟอรัสเดคะออกไซด์", "เตตระฟอสฟอรัสเดคาออกไซด์", "tetraphosphorus decoxide", "tetraphosphorus decaoxide"]
    misconceptions:
      - { match: "ฟอสฟอรัสเดคะออกไซด์", feedback: "ฟอสฟอรัสมี 4 อะตอม ต้องใส่ เตตระ หน้าชื่อธาตุตัวแรกด้วย" }
      - { match: "ไดฟอสฟอรัสเพนตะออกไซด์", feedback: "นั่นคือชื่อของสูตรอย่างง่าย $\\mathrm{P_2O_5}$ ซึ่งใช้กันในทางการค้า แต่โจทย์ให้สูตรโมเลกุล $\\mathrm{P_4O_{10}}$" }
    hints:
      - "4 = เตตระ และ 10 = เดคะ"
      - "ธาตุตัวแรกมีมากกว่า 1 อะตอม จึงต้องใส่คำนำหน้าด้วย"
    solution: "P 4 อะตอม → เตตระฟอสฟอรัส · O 10 อะตอม → เดคะออกไซด์ ได้ **เตตระฟอสฟอรัสเดคะออกไซด์**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.covalent-naming-energy.p008
    topics: [chemistry.bonding.covalent-naming-energy]
    difficulty: 3
    type: numeric
    stem: "พันธะ Cl–Cl ยาว 198 pm และรัศมีโคเวเลนต์ของคาร์บอนเท่ากับ 77 pm จงประมาณความยาวพันธะ C–Cl ใน $\\mathrm{CCl_4}$ (pm)"
    answer: { value: 176, tolerance: 1, unit: pm }
    misconceptions:
      - { match: 275, feedback: "ใช้ความยาวพันธะ Cl–Cl ทั้งเส้น ต้องใช้รัศมีโคเวเลนต์ของ Cl คือครึ่งหนึ่ง" }
      - { match: 137.5, feedback: "หาค่าเฉลี่ยของ 198 กับ 77 แต่ต้องรวมรัศมีโคเวเลนต์ของสองอะตอม" }
    hints:
      - "รัศมีโคเวเลนต์ = ครึ่งหนึ่งของความยาวพันธะระหว่างอะตอมชนิดเดียวกัน"
      - "ความยาวพันธะ C–Cl ≈ รัศมีของ C + รัศมีของ Cl"
    solution: "รัศมีโคเวเลนต์ของ Cl $= 198/2 = 99$ pm ความยาวพันธะ C–Cl $\\approx 77 + 99 = 176$ pm (ค่าที่วัดจริง 177 pm)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.covalent-naming-energy.p009
    topics: [chemistry.bonding.covalent-naming-energy]
    difficulty: 3
    type: order
    stem: "เรียงพันธะต่อไปนี้จากความยาวพันธะ **สั้นที่สุด** ไป **ยาวที่สุด**"
    items: ["H–F", "H–Cl", "H–Br", "H–I"]
    hints:
      - "ความยาวพันธะขึ้นกับขนาดอะตอม"
      - "ในหมู่ 17 อะตอมใหญ่ขึ้นเมื่อลงล่าง"
    solution: "F < Cl < Br < I ตามขนาดอะตอม ความยาวพันธะจึงเรียง H–F (92) < H–Cl (127) < H–Br (141) < H–I (161 pm) และพลังงานพันธะเรียงกลับกัน H–F แข็งแรงที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.covalent-naming-energy.p010
    topics: [chemistry.bonding.covalent-naming-energy]
    difficulty: 3
    type: mcq
    stem: "ข้อใดอธิบายได้ถูกต้องว่าทำไมการเผาไหม้แก๊สมีเทนจึงปล่อยพลังงานออกมา"
    choices:
      - { id: a, text: "พลังงานที่คายออกจากการสร้างพันธะใน $\\mathrm{CO_2}$ และ $\\mathrm{H_2O}$ มากกว่าพลังงานที่ใช้สลายพันธะใน $\\mathrm{CH_4}$ และ $\\mathrm{O_2}$", correct: true, feedback: "ถูก พลังงานสุทธิคือผลต่างของสองขั้นนี้" }
      - { id: b, text: "การสลายพันธะใน $\\mathrm{CH_4}$ ปล่อยพลังงานออกมา", feedback: "การสลายพันธะต้องใช้พลังงานเสมอ นี่คือความเข้าใจผิดที่พบบ่อยที่สุด" }
      - { id: c, text: "มีเทนเก็บพลังงานไว้ในโมเลกุลแล้วปล่อยออกมาเองโดยไม่ต้องมีออกซิเจน", feedback: "ต้องมีออกซิเจนและต้องเกิดพันธะใหม่ พลังงานไม่ได้อยู่ในโมเลกุลเดียวโดด ๆ" }
    hints:
      - "ปฏิกิริยามีสองขั้น: สลายพันธะเดิม และสร้างพันธะใหม่"
      - "ขั้นไหนดูดพลังงาน ขั้นไหนคายพลังงาน"
    solution: "สลายพันธะ C–H และ O=O **ดูด** 2,642 kJ สร้างพันธะ C=O และ O–H **คาย** 3,450 kJ คายมากกว่าดูด จึงมีพลังงานสุทธิออกมา $\\Delta H \\approx -808$ kJ ต่อมีเทน 1 โมล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.covalent-naming-energy.p011
    topics: [chemistry.bonding.covalent-naming-energy]
    difficulty: 4
    type: numeric
    stem: "คำนวณ $\\Delta H$ ของ $\\mathrm{H_2(g) + Cl_2(g) \\rightarrow 2HCl(g)}$ (kJ) จากพลังงานพันธะ H–H 436, Cl–Cl 242 และ H–Cl 431 kJ/mol"
    answer: { value: -184, unit: kJ }
    misconceptions:
      - { match: 184, feedback: "ลบกลับด้าน ต้องใช้ พลังงานพันธะที่สลาย − พลังงานพันธะที่สร้าง" }
      - { match: 247, feedback: "เกิด HCl 2 โมเลกุล ต้องนับพันธะ H–Cl 2 พันธะ" }
    hints:
      - "นับพันธะที่สลาย: H–H 1 พันธะ และ Cl–Cl 1 พันธะ"
      - "นับพันธะที่สร้าง: H–Cl 2 พันธะ แล้วใช้ $\\Delta H = \\sum E_{\\text{สลาย}} - \\sum E_{\\text{สร้าง}}$"
    solution: "สลาย $436 + 242 = 678$ kJ · สร้าง $2 \\times 431 = 862$ kJ · $\\Delta H = 678 - 862 = -184$ kJ คายความร้อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.covalent-naming-energy.p012
    topics: [chemistry.bonding.covalent-naming-energy]
    difficulty: 4
    type: numeric
    stem: "แอมโมเนียที่ใช้ผลิตปุ๋ยยูเรียสำหรับนาข้าวสังเคราะห์จาก $\\mathrm{N_2(g) + 3H_2(g) \\rightarrow 2NH_3(g)}$ คำนวณ $\\Delta H$ (kJ) จากพลังงานพันธะ N≡N 945, H–H 436, N–H 391 kJ/mol"
    answer: { value: -93, unit: kJ }
    misconceptions:
      - { match: 93, feedback: "ลบกลับด้าน ใช้ สลาย − สร้าง" }
      - { match: 1080, feedback: "$\\mathrm{NH_3}$ 1 โมเลกุลมี N–H 3 พันธะ เกิด 2 โมเลกุลจึงมี 6 พันธะ ไม่ใช่ 3" }
    hints:
      - "พันธะที่สลาย: N≡N 1 พันธะ และ H–H 3 พันธะ"
      - "พันธะที่สร้าง: $\\mathrm{NH_3}$ 2 โมเลกุล × N–H 3 พันธะ = 6 พันธะ"
    solution: "สลาย $945 + 3(436) = 2{,}253$ kJ · สร้าง $6(391) = 2{,}346$ kJ · $\\Delta H = 2{,}253 - 2{,}346 = -93$ kJ คายความร้อนเล็กน้อย (ค่าที่วัดจริงราว −92 kJ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.covalent-naming-energy.p013
    topics: [chemistry.bonding.covalent-naming-energy]
    difficulty: 4
    type: numeric
    stem: "การเติมไฮโดรเจนในน้ำมันพืชเพื่อทำเนยเทียมเปลี่ยนพันธะ C=C เป็น C–C ดูปฏิกิริยาอย่างง่ายของเอทีนในภาพ คำนวณ $\\Delta H$ (kJ) จากพลังงานพันธะ C=C 614, C–C 348, C–H 413, H–H 436 kJ/mol"
