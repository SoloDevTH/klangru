problems:
  - id: chemistry.matter.states-changes.p001
    topics: [chemistry.matter.states-changes]
    difficulty: 1
    type: mcq
    stem: "สถานะใดมีรูปร่างและปริมาตรคงที่"
    choices:
      - { id: a, text: "ของแข็ง", correct: true, feedback: "ถูก ก้อนหินวางที่ไหนก็มีรูปร่างและขนาดเท่าเดิม" }
      - { id: b, text: "ของเหลว", feedback: "ของเหลวมีปริมาตรคงที่ แต่รูปร่างเปลี่ยนตามภาชนะ" }
      - { id: c, text: "แก๊ส", feedback: "แก๊สเปลี่ยนทั้งรูปร่างและปริมาตรจนเต็มภาชนะ" }
    hints:
      - "นึกถึงก้อนหิน น้ำ และอากาศ เมื่อย้ายไปใส่ภาชนะอื่น"
      - "สถานะใดไม่เปลี่ยนรูปร่างตามภาชนะ"
    solution: "**ของแข็ง** มีรูปร่างและปริมาตรคงที่ ของเหลวมีปริมาตรคงที่แต่รูปร่างเปลี่ยนตามภาชนะ แก๊สเปลี่ยนทั้งสองอย่าง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.states-changes.p002
    topics: [chemistry.matter.states-changes]
    difficulty: 1
    type: match
    stem: "จับคู่สิ่งของกับสถานะ"
    pairs:
      - { left: "ก้อนน้ำแข็ง", right: "ของแข็ง" }
      - { left: "น้ำปลา", right: "ของเหลว" }
      - { left: "อากาศในลูกโป่ง", right: "แก๊ส" }
    hints:
      - "ของแข็งจับเป็นก้อนได้ ของเหลวเทได้"
      - "แก๊สมองไม่ค่อยเห็น แต่ทำให้ลูกโป่งพอง"
    solution: "ก้อนน้ำแข็ง → ของแข็ง · น้ำปลา → ของเหลว · อากาศในลูกโป่ง → แก๊ส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.states-changes.p003
    topics: [chemistry.matter.states-changes]
    difficulty: 2
    type: mcq
    stem: "หยดน้ำที่เกาะอยู่รอบนอกแก้วชาเย็นมาจากไหน"
    choices:
      - { id: a, text: "ไอน้ำในอากาศควบแน่นเมื่อเจอแก้วที่เย็น", correct: true, feedback: "ถูก แก๊สเปลี่ยนเป็นของเหลวเมื่อเย็นลง" }
      - { id: b, text: "ชาในแก้วซึมผ่านแก้วออกมา", feedback: "แก้วไม่ให้น้ำซึมผ่าน และหยดน้ำนั้นไม่มีสีและรสของชา" }
      - { id: c, text: "น้ำแข็งในแก้วระเหิดออกมา", feedback: "น้ำแข็งอยู่ในแก้ว ผ่านแก้วออกมาไม่ได้" }
    hints:
      - "ลองชิมหยดน้ำนั้นในใจ มีรสชาหรือไม่"
      - "อากาศรอบตัวมีไอน้ำ เมื่อไอน้ำเย็นลงจะเกิดอะไร"
    solution: "อากาศมีไอน้ำ เมื่อไอน้ำแตะผิวแก้วที่เย็น จะ **ควบแน่น** เป็นหยดน้ำ หยดน้ำจึงไม่มีรสชา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.states-changes.p004
    topics: [chemistry.matter.states-changes]
    difficulty: 2
    type: text
    stem: "ลูกเหม็นในตู้เสื้อผ้าค่อย ๆ เล็กลงโดยไม่มีของเหลวเกิดขึ้น การเปลี่ยนสถานะนี้เรียกว่าอะไร (ตอบคำเดียว)"
    accepted: ["การระเหิด", "ระเหิด", "sublimation"]
    misconceptions:
      - { match: "การระเหย", feedback: "การระเหย (กลายเป็นไอ) เริ่มจากของเหลว แต่ลูกเหม็นเป็นของแข็งที่กลายเป็นแก๊สโดยตรง" }
      - { match: "การหลอมเหลว", feedback: "ถ้าหลอมเหลวต้องมีของเหลวเกิดขึ้น" }
    hints:
      - "ลูกเหม็นเริ่มเป็นของแข็ง และสุดท้ายเป็นแก๊สที่เราได้กลิ่น"
      - "ของแข็งที่กลายเป็นแก๊สโดยไม่เป็นของเหลวก่อน"
    solution: "ของแข็งเปลี่ยนเป็นแก๊สโดยตรงเรียกว่า **การระเหิด** เราจึงได้กลิ่นลูกเหม็นในตู้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.states-changes.p005
    topics: [chemistry.matter.states-changes]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นหลักฐานว่าอากาศ **ต้องการที่อยู่**"
    choices:
      - { id: a, text: "คว่ำแก้วกดลงในอ่างน้ำตรง ๆ น้ำเข้าไปในแก้วไม่เต็ม", correct: true, feedback: "ถูก อากาศในแก้วกันไม่ให้น้ำเข้าไปเต็ม" }
      - { id: b, text: "เรามองไม่เห็นอากาศ", feedback: "การมองไม่เห็นไม่ได้บอกว่าต้องการที่อยู่หรือไม่" }
      - { id: c, text: "ลมพัดใบไม้ไหว", feedback: "แสดงว่าอากาศเคลื่อนที่และออกแรงได้ แต่ข้อ a แสดงการต้องการที่อยู่ชัดกว่า" }
    hints:
      - "ต้องการที่อยู่ = ถ้ามีอากาศอยู่ตรงนั้น สิ่งอื่นจะเข้าไปแทนที่ไม่ได้"
      - "ทำไมน้ำเข้าไปในแก้วที่คว่ำไม่เต็ม"
    solution: "แก้วที่คว่ำมีอากาศอยู่เต็ม เมื่อกดลงน้ำ อากาศยังอยู่ในแก้ว น้ำจึงเข้าไปไม่เต็ม แสดงว่าอากาศ **ต้องการที่อยู่** เหมือนสสารอื่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.states-changes.p006
    topics: [chemistry.matter.states-changes]
    difficulty: 3
    type: numeric
    stem: "ภาพแสดงกระบอกตวงก่อนและหลังใส่ก้อนหิน ก้อนหินมีปริมาตรกี่มิลลิลิตร"
    figure:
      src: p-displacement.svg
      alt: "กระบอกตวงสองอัน สเกล 0 ถึง 100 mL ขีดเล็กทุก 5 mL ขีดยาวทุก 10 mL อันซ้ายก่อนใส่ก้อนหิน น้ำอยู่ที่ขีด 50 อันขวาหลังใส่ก้อนหินที่จมอยู่ก้นกระบอก น้ำสูงขึ้นมาอยู่ที่ขีด 65"
    answer: { value: 15, unit: mL }
    misconceptions:
      - { match: 65, feedback: "65 mL คือน้ำรวมกับหิน ต้องลบปริมาตรน้ำเดิม 50 mL ออก" }
      - { match: 115, feedback: "ต้องลบ ไม่ใช่บวก" }
    hints:
      - "อ่านระดับน้ำก่อนใส่และหลังใส่ก้อนหิน"
      - "ปริมาตรหิน = ค่าหลัง − ค่าก่อน"
    solution: "ก่อนใส่ 50 mL หลังใส่ 65 mL ก้อนหินดันน้ำขึ้นมาเท่ากับปริมาตรของมันเอง จึงมีปริมาตร $65 - 50 = 15$ mL"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.states-changes.p007
    topics: [chemistry.matter.states-changes]
    difficulty: 3
    type: numeric
    stem: "ชั่งแก้วเปล่าได้ 150 g เทน้ำลงไปแล้วชั่งทั้งแก้วได้ 350 g น้ำมีมวลกี่กรัม"
    answer: { value: 200, unit: g }
    misconceptions:
      - { match: 350, feedback: "350 g รวมมวลแก้วด้วย ต้องลบมวลแก้วเปล่าออก" }
      - { match: 500, feedback: "ต้องลบ ไม่ใช่บวก" }
    hints:
      - "เครื่องชั่งชั่งทั้งแก้วและน้ำพร้อมกัน"
      - "มวลน้ำ = มวลรวม − มวลแก้วเปล่า"
    solution: "มวลน้ำ $= 350 - 150 = 200$ g"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.states-changes.p008
    topics: [chemistry.matter.states-changes]
    difficulty: 3
    type: numeric
    stem: "ใส่น้ำตาลทราย 20 g ลงในน้ำ 200 g แล้วคนจนละลายหมด สารละลายน้ำเชื่อมนี้มีมวลกี่กรัม"
    answer: { value: 220, unit: g }
    misconceptions:
      - { match: 200, feedback: "น้ำตาลที่ละลายไม่ได้หายไป ยังอยู่ในน้ำ มวลจึงต้องรวมกัน" }
    hints:
      - "น้ำตาลละลายแล้วมองไม่เห็น แต่ยังอยู่ในน้ำหรือไม่"
      - "มวลสารละลาย = มวลน้ำ + มวลน้ำตาล"
    solution: "การละลายไม่ทำให้มวลหายไป สารละลายมีมวล $200 + 20 = 220$ g"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.states-changes.p009
    topics: [chemistry.matter.states-changes]
    difficulty: 3
    type: order
    stem: "ต้มน้ำแข็งในหม้อจนเดือด เรียงสิ่งที่เกิดขึ้นตามลำดับ"
    items:
      - "น้ำแข็งเป็นของแข็ง"
      - "น้ำแข็งหลอมเหลวเป็นน้ำ"
      - "น้ำร้อนขึ้นจนเดือด"
      - "น้ำกลายเป็นไอน้ำลอยขึ้นไป"
    hints:
      - "เมื่อได้รับความร้อน ของแข็งเปลี่ยนเป็นอะไรก่อน"
      - "ของแข็ง → ของเหลว → แก๊ส"
    solution: "ของแข็ง → หลอมเหลวเป็นของเหลว → ร้อนขึ้นจนเดือด → กลายเป็นไอ (แก๊ส)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.states-changes.p010
    topics: [chemistry.matter.states-changes]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดเป็น **การเปลี่ยนแปลงทางเคมี** (เกิดสารใหม่) เลือกได้มากกว่า 1 ข้อ"
    choices:
      - { id: a, text: "ตะปูเหล็กทิ้งไว้กลางฝนจนเป็นสนิม", correct: true, feedback: "ถูก สนิมเป็นสารใหม่ สีและความแข็งต่างจากเหล็ก" }
      - { id: b, text: "ทอดไข่ดาว", correct: true, feedback: "ถูก ไข่ขาวที่ใสกลายเป็นสีขาวและแข็ง ทำกลับไม่ได้" }
      - { id: c, text: "น้ำแข็งละลาย", feedback: "เป็นการเปลี่ยนสถานะ ยังเป็นน้ำเหมือนเดิม" }
      - { id: d, text: "ละลายเกลือในน้ำ", feedback: "เป็นการละลาย ระเหยน้ำออกก็ได้เกลือคืน" }
    hints:
      - "หลักฐานของสารใหม่: สีเปลี่ยน มีฟองแก๊ส มีความร้อนหรือแสง เนื้อสารเปลี่ยน"
      - "การเปลี่ยนสถานะและการละลายยังเป็นสารเดิม"
    solution: "**สนิม** และ **ไข่ทอด** เป็นสารใหม่ จึงเป็นการเปลี่ยนแปลงทางเคมี ส่วนน้ำแข็งละลายและเกลือละลายน้ำยังเป็นสารเดิม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.states-changes.p011
    topics: [chemistry.matter.states-changes]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นการเปลี่ยนแปลงที่ **ผันกลับได้** (เลือกได้มากกว่า 1 ข้อ)"
    choices:
      - { id: a, text: "ละลายน้ำตาลในน้ำ", correct: true, feedback: "ถูก ระเหยน้ำออกก็ได้น้ำตาลคืน" }
      - { id: b, text: "เทียนไขหลอมแล้วแข็งตัวใหม่", correct: true, feedback: "ถูก เป็นการเปลี่ยนสถานะ ยังเป็นเทียนไขเดิม" }
      - { id: c, text: "เผากระดาษจนเป็นเถ้า", feedback: "เกิดสารใหม่ (เถ้า แก๊ส) ทำให้กลับเป็นกระดาษไม่ได้" }
      - { id: d, text: "หุงข้าวสารจนเป็นข้าวสวย", feedback: "เนื้อข้าวเปลี่ยนไปแล้ว ทำให้กลับเป็นข้าวสารไม่ได้" }
    hints:
      - "ผันกลับได้ = ทำให้กลับมาเป็นสารเดิมได้"
      - "ถ้าเกิดสารใหม่ มักผันกลับไม่ได้"
    solution: "การละลาย (a) และการเปลี่ยนสถานะ (b) **ผันกลับได้** การเผาไหม้และการหุงต้ม **ผันกลับไม่ได้** เพราะเกิดสารใหม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.states-changes.p012
    topics: [chemistry.matter.states-changes]
    difficulty: 4
    type: mcq
    stem: "หยดน้ำส้มสายชูลงบนผงฟู เกิดฟองฟู่ ข้อใดสรุปได้ถูกต้อง"
    choices:
      - { id: a, text: "เกิดแก๊สใหม่ เป็นการเปลี่ยนแปลงทางเคมี", correct: true, feedback: "ถูก ฟองแก๊สที่เกิดขึ้นเป็นหลักฐานของสารใหม่" }
      - { id: b, text: "ผงฟูละลายในน้ำส้มสายชูเท่านั้น", feedback: "การละลายไม่ทำให้เกิดฟองแก๊ส" }
      - { id: c, text: "น้ำส้มสายชูเดือด", feedback: "ไม่ได้ให้ความร้อน และส่วนผสมไม่ได้ร้อนจนเดือด" }
    hints:
      - "ฟองที่เกิดขึ้นเป็นสิ่งที่ไม่มีอยู่ก่อนผสม"
      - "หลักฐานของการเปลี่ยนแปลงทางเคมีมีอะไรบ้าง"
    solution: "ฟองคือแก๊สคาร์บอนไดออกไซด์ที่เกิดใหม่ จึงเป็น **การเปลี่ยนแปลงทางเคมี** ผงฟูในขนมจึงทำให้ขนมขึ้นฟู"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.states-changes.p013
    topics: [chemistry.matter.states-changes]
    difficulty: 4
    type: mcq
    stem: "นำน้ำแข็ง 100 g ใส่ถุงปิดสนิท ทิ้งไว้จนละลายหมด แล้วชั่งน้ำในถุง (ไม่นับมวลถุง) จะได้กี่กรัม"
    choices:
      - { id: a, text: "100 g", correct: true, feedback: "ถูก การเปลี่ยนสถานะไม่ทำให้มวลเปลี่ยน" }
      - { id: b, text: "น้อยกว่า 100 g เพราะน้ำแข็งหายไปบางส่วน", feedback: "ถุงปิดสนิท ไม่มีอะไรออกไปได้ มวลจึงเท่าเดิม" }
      - { id: c, text: "มากกว่า 100 g เพราะของเหลวหนักกว่าของแข็ง", feedback: "สารเดียวกันมีมวลเท่าเดิมไม่ว่าสถานะใด" }
    hints:
      - "มีสารเข้าหรือออกจากถุงหรือไม่"
      - "การหลอมเหลวเปลี่ยนแค่สถานะ ไม่ได้เพิ่มหรือลดสาร"
    solution: "ถุงปิดสนิท สารไม่เข้าออก การหลอมเหลวเปลี่ยนแค่สถานะ มวลจึงยังเป็น **100 g**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.states-changes.p014
    topics: [chemistry.matter.states-changes]
    difficulty: 4
    type: numeric
    stem: "กล่องนมกว้าง 6 cm ยาว 4 cm สูง 10 cm กล่องนี้จุได้กี่มิลลิลิตร (1 cm³ = 1 mL)"
    answer: { value: 240, unit: mL }
    misconceptions:
      - { match: 20, feedback: "นำมาบวกกัน ปริมาตรกล่องต้องคูณ กว้าง × ยาว × สูง" }
      - { match: 24, feedback: "คิดเฉพาะพื้นที่ฐาน (6 × 4) ยังไม่ได้คูณความสูง" }
    hints:
      - "ปริมาตรกล่อง = กว้าง × ยาว × สูง"
      - "ได้หน่วย cm³ ซึ่งเท่ากับ mL"
    solution: "$6 \\times 4 \\times 10 = 240$ cm³ $= 240$ mL"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.states-changes.p015
    topics: [chemistry.matter.states-changes]
    difficulty: 5
    type: numeric
    stem: "ใส่เม็ดฟู่ 4 g ลงในแก้วน้ำ 200 g ที่วางบนเครื่องชั่ง เกิดฟองแก๊สลอยออกไปในอากาศ เมื่อหมดฟอง ชั่งได้ 202.5 g (ไม่นับมวลแก้ว) แก๊สที่หนีออกไปมีมวลกี่กรัม"
    answer: { value: 1.5, tolerance: 0.01, unit: g }
    misconceptions:
