<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" width="780" height="480" font-family="sans-serif" font-size="14">
  <title>พีระมิดสามชั้นของโครงสร้างรายงาน ชั้นบนสุดคือข้อสรุปและข้อเสนอแนะ ชั้นกลางคือเหตุผลหลักสามข้อ ชั้นล่างคือข้อมูลและแหล่งที่มา</title>
  <rect x="0" y="0" width="780" height="480" fill="#ffffff"/>
  <polygon points="305.0,60 455.0,60 530.0,182 230.0,182" fill="#fef3c7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="380" y="119.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">ข้อสรุปและข้อเสนอแนะ</text>
  <text x="380" y="139.0" text-anchor="middle" font-size="13" fill="#1f2937">บอกคำตอบก่อนว่าควรทำอะไร</text>
  <polygon points="230.0,190 530.0,190 615.0,312 145.0,312" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="380" y="249.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">เหตุผลหลัก 3 ข้อ</text>
  <text x="380" y="269.0" text-anchor="middle" font-size="13" fill="#1f2937">แต่ละข้อมีประเด็นและหลักฐานรองรับ</text>
  <polygon points="145.0,320 615.0,320 700.0,432 60.0,432" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="380" y="374.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">ข้อมูลและแหล่งที่มา</text>
  <text x="380" y="394.0" text-anchor="middle" font-size="13" fill="#1f2937">ตาราง กราฟ และแหล่งอ้างอิงที่ตรวจได้</text>
  <text x="590" y="108" font-size="13" fill="#1f2937">ผู้อ่านดูชั้นบนสุดก่อน</text>
  <line x1="588" y1="100" x2="512" y2="118" stroke="#1f2937" stroke-width="1.5"/>
</svg>
