id: chemistry.matter.atoms
subject: chemistry
title: { th: โครงสร้างอะตอม, en: Atomic structure }
summary: อะตอมประกอบด้วยโปรตอน นิวตรอน และอิเล็กตรอน เลขอะตอมบอกชนิดธาตุ เลขมวลบอกจำนวนอนุภาคในนิวเคลียส และไอโซโทปคือธาตุเดียวกันที่นิวตรอนต่างกัน
difficulty: 3
minutes: 30
prerequisites: [math.number.integers]
encompasses:
  - { id: math.number.integers, weight: 0.1 }
curriculum_tags: []
lessons:
  - type: figure
    src: atom-models.svg
    alt: "แบบจำลองอะตอม 5 แบบเรียงตามเวลา: ดอลตัน ค.ศ. 1803 ทรงกลมตันแบ่งแยกไม่ได้ ทอมสัน ค.ศ. 1904 ทรงกลมประจุบวกมีอิเล็กตรอนฝังอยู่ รัทเทอร์ฟอร์ด ค.ศ. 1911 นิวเคลียสเล็กประจุบวกอยู่กลาง รอบ ๆ เป็นที่ว่างมีอิเล็กตรอน โบร์ ค.ศ. 1913 อิเล็กตรอนอยู่บนวงเป็นชั้นตามระดับพลังงาน และแบบกลุ่มหมอก ค.ศ. 1926 จุดอิเล็กตรอนหนาแน่นใกล้นิวเคลียสและบางลงเมื่อห่างออกไป"
    caption: "แบบจำลองอะตอมเปลี่ยนไปทุกครั้งที่มีหลักฐานใหม่จากการทดลอง"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: chem.atom.p016, prompt: "ลองตีความผลการทดลองแผ่นทองคำด้วยตัวเอง" }
  - type: worked-example
    title: นับอนุภาคในไอออนซัลไฟด์
    problem: "จงหาจำนวนโปรตอน นิวตรอน และอิเล็กตรอนของไอออน ${}^{32}_{16}\\mathrm{S}^{2-}$"
    steps:
      - text: "เลขมุมล่างคือเลขอะตอม: โปรตอน $= 16$"
        why: "จำนวนโปรตอนไม่เปลี่ยนเมื่ออะตอมกลายเป็นไอออน ถ้าโปรตอนเปลี่ยนจะกลายเป็นธาตุอื่น"
      - text: "เลขมุมบนคือเลขมวล: นิวตรอน $= 32 - 16 = 16$"
      - text: "ประจุ $2-$ แปลว่ารับอิเล็กตรอนเพิ่ม 2 ตัว: อิเล็กตรอน $= 16 - (-2) = 18$"
        why: "ประจุลบแปลว่ามีอิเล็กตรอน (ประจุลบ) มากกว่าโปรตอน (ประจุบวก)"
      - text: "ตรวจ: ประจุ $= 16 - 18 = -2$ ตรงกับที่เขียนไว้มุมบนขวา"
    answer: "โปรตอน 16 นิวตรอน 16 อิเล็กตรอน 18"
  - { type: check, problem: chem.atom.p015, prompt: "ใช้วิธีเดียวกันอ่านแบบจำลองของโบร์" }
  - type: worked-example
    title: หาร้อยละของไอโซโทปจากมวลอะตอมเฉลี่ย
    problem: "แกลเลียม (ใช้ทำหลอดไฟ LED) มีสองไอโซโทป คือ Ga-69 มวล $68.926\\ \\mathrm{u}$ และ Ga-71 มวล $70.925\\ \\mathrm{u}$ ถ้ามวลอะตอมเฉลี่ยคือ $69.723\\ \\mathrm{u}$ แกลเลียมเป็น Ga-69 อยู่ร้อยละเท่าใด"
    steps:
      - text: "ให้สัดส่วนของ Ga-69 เป็น $x$ สัดส่วนของ Ga-71 จึงเป็น $1 - x$"
        why: "มีเพียงสองไอโซโทป สัดส่วนทั้งหมดต้องรวมกันได้ 1 (ร้อยละ 100)"
      - text: "ตั้งสมการมวลเฉลี่ย: $68.926x + 70.925(1 - x) = 69.723$"
      - text: "กระจายและรวมพจน์: $70.925 - 1.999x = 69.723$"
      - text: "แก้สมการ: $x = \\frac{70.925 - 69.723}{1.999} = \\frac{1.202}{1.999} \\approx 0.601$"
      - text: "ตรวจด้วยเหตุผล: $69.723$ อยู่ใกล้ $68.926$ มากกว่า $70.925$ จึงควรมี Ga-69 มากกว่าครึ่ง ซึ่งสอดคล้องกับ $0.601$"
        why: "การตรวจทิศทางของคำตอบช่วยจับความผิดที่พบบ่อยที่สุด คือหาสัดส่วนสลับกัน"
    answer: "Ga-69 ประมาณร้อยละ 60.1 และ Ga-71 ประมาณร้อยละ 39.9"
  - type: simulation
    title: สร้างอะตอมเอง (PhET Build an Atom)
    url: https://phet.colorado.edu/en/simulations/build-an-atom
    provider: phet
    note: ลองเพิ่มโปรตอนทีละตัวแล้วดูว่าชื่อธาตุเปลี่ยน จากนั้นเพิ่มนิวตรอนแล้วสังเกตว่าชื่อธาตุไม่เปลี่ยน แต่เลขมวลเปลี่ยน
  - type: simulation
    title: ไอโซโทปและมวลอะตอม (PhET Isotopes and Atomic Mass)
    url: https://phet.colorado.edu/en/simulations/isotopes-and-atomic-mass
    provider: phet
    note: ผสมไอโซโทปของธาตุเดียวกันหลายแบบ แล้วดูว่ามวลอะตอมเฉลี่ยเปลี่ยนตามสัดส่วนอย่างไร
glossary:
  - { term: เลขอะตอม (Z), definition: จำนวนโปรตอนในนิวเคลียส เป็นตัวบอกว่าอะตอมนั้นเป็นธาตุอะไร }
  - { term: เลขมวล (A), definition: จำนวนโปรตอนรวมกับจำนวนนิวตรอนในนิวเคลียส }
  - { term: ไอโซโทป, definition: อะตอมของธาตุเดียวกัน (เลขอะตอมเท่ากัน) ที่มีจำนวนนิวตรอนต่างกัน จึงมีเลขมวลต่างกัน }
  - { term: ไอออน, definition: อะตอมหรือกลุ่มอะตอมที่มีจำนวนอิเล็กตรอนไม่เท่ากับจำนวนโปรตอน จึงมีประจุ }
flashcards:
  - { front: "อนุภาคใดบ้างอยู่ในนิวเคลียส", back: "โปรตอน (ประจุ +1) และนิวตรอน (ไม่มีประจุ) ส่วนอิเล็กตรอน (ประจุ −1) อยู่รอบนิวเคลียส" }
  - { front: "หาจำนวนนิวตรอนจากสัญลักษณ์ ${}^{A}_{Z}\\mathrm{X}$ อย่างไร", back: "จำนวนนิวตรอน $= A - Z$ (เลขมวลลบเลขอะตอม)" }
  - { front: "ไอโซโทปของธาตุเดียวกันต่างกันที่อะไร", back: "ต่างกันที่จำนวนนิวตรอน (และเลขมวล) แต่จำนวนโปรตอนเท่ากัน" }
  - { front: "อะตอมที่เป็นกลางทางไฟฟ้ามีอิเล็กตรอนกี่ตัว", back: "เท่ากับจำนวนโปรตอน คือเท่ากับเลขอะตอม" }
  - { front: "การทดลองแผ่นทองคำของรัทเทอร์ฟอร์ดบอกอะไร", back: "อนุภาคแอลฟาส่วนใหญ่ทะลุตรง → อะตอมส่วนใหญ่ว่าง ส่วนน้อยมากสะท้อนกลับ → มีนิวเคลียสเล็ก หนัก ประจุบวก" }
