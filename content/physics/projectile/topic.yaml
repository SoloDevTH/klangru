id: physics.kinematics.projectile
subject: physics
title: { th: การเคลื่อนที่แบบโพรเจกไทล์, en: Projectile motion }
summary: วิเคราะห์วัตถุที่ถูกยิงหรือขว้างในแนวราบและแนวเฉียง โดยแยกการเคลื่อนที่แนวราบ (ความเร็วคงตัว) กับแนวดิ่ง (ตกอิสระ) หาเวลาลอย ระยะทางแนวราบ และความสูงสูงสุด
difficulty: 6
minutes: 40
prerequisites: [physics.kinematics.free-fall, physics.units.vectors]
encompasses:
  - { id: physics.kinematics.free-fall, weight: 0.5 }
  - { id: physics.units.vectors, weight: 0.4 }
  - { id: physics.kinematics.constant-acceleration, weight: 0.2 }
  - { id: math.geometry.trig-ratios, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: velocity-components.svg
    alt: "แนวการเคลื่อนที่รูปพาราโบลาของวัตถุที่ยิงจากพื้นด้วยอัตราเร็ว 20 m/s มุม 60 องศา ขึ้นสูงประมาณ 15.3 m และตกห่างประมาณ 35.3 m จุดบนเส้นโค้งห่างกันทุก 0.44 s ลูกศรสีเขียวแทนความเร็วแนวราบ ยาวเท่ากันทุกจุด ลูกศรสีส้มแทนความเร็วแนวดิ่ง ชี้ขึ้นและสั้นลงเรื่อย ๆ ในขาขึ้น เป็นศูนย์ที่จุดสูงสุด แล้วชี้ลงและยาวขึ้นในขาลง"
    caption: "$v_x$ คงที่ตลอดทาง ส่วน $v_y$ ลดลง $9.8\\ \\mathrm{m/s}$ ทุกวินาที จุดที่ห่างกันในเวลาเท่ากันจึงห่างกันในแนวราบเท่ากัน"
  - type: worked-example
    title: ขว้างลูกบอลในแนวราบจากชั้นสาม
    problem: "เด็กขว้างลูกบอลออกไปในแนวราบด้วยความเร็ว $6\\ \\mathrm{m/s}$ จากหน้าต่างชั้นสามซึ่งสูงจากพื้น $7.2\\ \\mathrm{m}$ ลูกบอลตกห่างจากตัวตึกเท่าใด และกระทบพื้นด้วยความเร็วเท่าใด ทิศใด ($g = 9.8\\ \\mathrm{m/s^2}$ ไม่คิดแรงต้านอากาศ)"
    steps:
      - text: "แยกแกน: แนวราบ $u_x = 6\\ \\mathrm{m/s}$ คงที่ แนวดิ่ง $u_y = 0$ และตกลงมา $7.2\\ \\mathrm{m}$"
        why: "ขว้างในแนวราบ ความเร็วต้นจึงไม่มีองค์ประกอบแนวดิ่ง"
      - text: "หาเวลาจากแนวดิ่ง: $7.2 = \\tfrac{1}{2}(9.8)t^2$ ได้ $t = \\sqrt{\\dfrac{2(7.2)}{9.8}} \\approx 1.21\\ \\mathrm{s}$"
        why: "แนวดิ่งมีข้อมูลครบ (ความสูง ความเร่ง ความเร็วต้น) ส่วนแนวราบยังไม่รู้ระยะ"
      - text: "ใช้เวลาเดียวกันกับแนวราบ: $x = u_x t = 6 \\times 1.21 \\approx 7.27\\ \\mathrm{m}$"
      - text: "ความเร็วแนวดิ่งตอนถึงพื้น: $v_y = gt = 9.8 \\times 1.21 \\approx 11.9\\ \\mathrm{m/s}$ ทิศลง ส่วน $v_x$ ยังเป็น $6\\ \\mathrm{m/s}$"
      - text: "รวมแบบเวกเตอร์: $v = \\sqrt{6^2 + 11.9^2} \\approx 13.3\\ \\mathrm{m/s}$ และ $\\tan\\alpha = \\dfrac{11.9}{6}$ ได้ $\\alpha \\approx 63^\\circ$ ใต้แนวราบ"
        why: "สององค์ประกอบตั้งฉากกัน จึงรวมด้วยทฤษฎีบทพีทาโกรัส ไม่ใช่บวกกันตรง ๆ"
    answer: "ตกห่างตึกประมาณ $7.27\\ \\mathrm{m}$ กระทบพื้นด้วยอัตราเร็วประมาณ $13.3\\ \\mathrm{m/s}$ ทำมุมประมาณ $63^\\circ$ ใต้แนวราบ"
  - { type: check, problem: phy.proj.p016, prompt: "ลองใช้วิธีเดียวกันกับลูกปิงปอง" }
  - type: figure
    src: strobe-drop-throw.svg
    alt: "ภาพแสงวาบทุก 0.1 วินาทีของลูกบอลสองลูกที่เริ่มจากขอบโต๊ะพร้อมกัน ลูกซ้ายปล่อยให้ตกตรง ๆ ลูกขวาดีดออกในแนวราบด้วยความเร็ว 1.5 m/s ทั้งสองลูกอยู่ระดับเดียวกันทุกขณะ ตำแหน่งของลูกขวา (ระยะแนวราบ, ระยะที่ตกลง) คือ t = 0.1 s: 0.15 m, 0.049 m · t = 0.2 s: 0.30 m, 0.196 m · t = 0.3 s: 0.45 m, 0.441 m · t = 0.4 s: 0.60 m, 0.784 m"
    caption: "ระยะแนวราบเพิ่มทีละ $0.15\\ \\mathrm{m}$ เท่ากันทุกช่วง แต่ระยะที่ตกลงเพิ่มขึ้นเรื่อย ๆ ตาม $\\tfrac{1}{2}gt^2$ เหมือนลูกที่ปล่อยตก"
  - type: figure
    src: launch-angles.svg
    alt: "กราฟแนวการเคลื่อนที่สามเส้น ยิงจากพื้นด้วยอัตราเร็ว 20 m/s เท่ากัน แกนนอนคือระยะทางแนวราบ 0 ถึง 40 m แกนตั้งคือความสูง 0 ถึง 15 m มุม 30 องศาขึ้นสูงประมาณ 5.1 m มุม 45 องศาสูงประมาณ 10.2 m และไปไกลที่สุดประมาณ 40.8 m มุม 60 องศาสูงประมาณ 15.3 m มุม 30 และ 60 องศาตกที่ระยะเดียวกันประมาณ 35.3 m"
    caption: "มุมที่รวมกันได้ $90^\\circ$ ตกที่ระยะเท่ากัน มุมที่ชันกว่าขึ้นสูงกว่าและลอยนานกว่า"
  - type: worked-example
    title: ลูกโทษบาสเกตบอลลงห่วงหรือไม่
    problem: "นักบาสชู้ตลูกโทษ ลูกออกจากมือที่ความสูง $2.0\\ \\mathrm{m}$ ด้วยความเร็ว $7.3\\ \\mathrm{m/s}$ ทำมุม $52^\\circ$ กับแนวราบ ห่วงอยู่สูง $3.05\\ \\mathrm{m}$ และห่างจากจุดปล่อยลูกในแนวราบ $4.2\\ \\mathrm{m}$ เมื่อลูกเคลื่อนที่ไปถึงแนวของห่วง ลูกอยู่สูงเท่าใด และกำลังขึ้นหรือลง ($g = 9.8\\ \\mathrm{m/s^2}$)"
    steps:
      - text: "แยกองค์ประกอบ: $u_x = 7.3\\cos 52^\\circ \\approx 4.49\\ \\mathrm{m/s}$ และ $u_y = 7.3\\sin 52^\\circ \\approx 5.75\\ \\mathrm{m/s}$"
      - text: "เวลาที่ไปถึงแนวห่วงหาจากแนวราบ: $t = \\dfrac{4.2}{4.49} \\approx 0.935\\ \\mathrm{s}$"
        why: "รู้ระยะแนวราบและความเร็วแนวราบคงที่ จึงหาเวลาจากแนวราบได้ทันที ไม่ต้องแก้สมการกำลังสอง"
      - text: "ความสูงที่เพิ่มขึ้น: $\\Delta y = u_y t - \\tfrac{1}{2}gt^2 = (5.75)(0.935) - 4.9(0.935)^2 \\approx 5.38 - 4.28 = 1.10\\ \\mathrm{m}$"
      - text: "ความสูงจากพื้น: $y = 2.0 + 1.10 = 3.10\\ \\mathrm{m}$ สูงกว่าห่วง $3.05\\ \\mathrm{m}$ อยู่ราว $5\\ \\mathrm{cm}$"
        why: "สูตร $R = \\dfrac{u^2 \\sin 2\\theta}{g}$ ใช้ไม่ได้ เพราะจุดปล่อยกับห่วงอยู่คนละระดับ"
      - text: "ความเร็วแนวดิ่งขณะนั้น: $v_y = 5.75 - 9.8(0.935) \\approx -3.41\\ \\mathrm{m/s}$ เป็นลบ ลูกจึงกำลังตกลง"
    answer: "ลูกอยู่สูงประมาณ $3.10\\ \\mathrm{m}$ และกำลังตกลงขณะผ่านแนวของห่วง จึงมีโอกาสลงห่วงพอดี"
  - { type: check, problem: phy.proj.p018 }
  - type: interactive
    title: แนวการเคลื่อนที่ของโพรเจกไทล์
    caption: "แกนนอนคือระยะทางแนวราบ (m) แกนตั้งคือความสูง (m) เมื่อยิงจากพื้นด้วยอัตราเร็ว v ทำมุม a องศากับแนวราบ และ g = 9.8 m/s² ลองตั้ง v = 20 แล้วเปลี่ยนมุม สังเกตว่ามุม 45° ไปได้ไกลที่สุด และมุม 30° กับ 60° ตกที่จุดเดียวกัน แต่มุม 60° ขึ้นสูงกว่าและลอยนานกว่า"
    widget:
      kind: function-plot
      functions: ["x\\tan\\left(\\frac{\\pi a}{180}\\right) - \\frac{9.8 x^2}{2 v^2 \\cos^2\\left(\\frac{\\pi a}{180}\\right)}"]
      sliders:
        - { name: a, min: 5, max: 85, step: 5, value: 45, label: มุมยิง (องศา) }
        - { name: v, min: 5, max: 20, step: 1, value: 20, label: อัตราเร็วต้น (m/s) }
      x: [0, 45]
      y: [0, 22]
  - type: simulation
    title: การเคลื่อนที่แบบโพรเจกไทล์ (PhET Projectile Motion)
    url: https://phet.colorado.edu/en/simulations/projectile-motion
    provider: phet
    note: เปิดหน้าจอ Intro ตั้งความสูงของปืนใหญ่เป็นศูนย์ ยิงด้วยอัตราเร็วเท่าเดิมที่มุม 30°, 45° และ 60° ใช้เครื่องมือวัดเลื่อนไปจับจุดสูงสุดและจุดตก อ่านเวลา ระยะทาง และความสูง แล้วเทียบกับการคำนวณ (ในซิมใช้ g = 9.81 m/s² ผลจึงต่างจาก g = 9.8 m/s² เล็กน้อย)
glossary:
  - { term: โพรเจกไทล์, definition: "วัตถุที่ถูกยิงหรือขว้างออกไปแล้วเคลื่อนที่ภายใต้แรงโน้มถ่วงเพียงอย่างเดียว (ไม่คิดแรงต้านอากาศ) แนวการเคลื่อนที่เป็นพาราโบลา" }
  - { term: เวลาลอย, definition: "เวลาตั้งแต่วัตถุถูกยิงจนตกถึงพื้น หาได้จากการเคลื่อนที่แนวดิ่งเท่านั้น" }
  - { term: ระยะทางแนวราบ (พิสัย), definition: "ระยะตามแนวราบจากจุดยิงถึงจุดตก เท่ากับ $u_x \\times$ เวลาลอย" }
  - { term: ความสูงสูงสุด, definition: "ความสูงที่จุดซึ่งความเร็วแนวดิ่งเป็นศูนย์ ถ้ายิงจากพื้น $H = \\dfrac{u_y^2}{2g}$" }
flashcards:
  - { front: "โพรเจกไทล์มีความเร่งแนวราบและแนวดิ่งเท่าใด", back: "แนวราบ $a_x = 0$ (ความเร็วคงตัว) แนวดิ่ง $a_y = g = 9.8\\ \\mathrm{m/s^2}$ ทิศลง" }
  - { front: "ที่จุดสูงสุดของโพรเจกไทล์ ความเร็วเป็นเท่าใด", back: "ความเร็วแนวดิ่งเป็นศูนย์ แต่ยังมีความเร็วแนวราบ $u_x = u\\cos\\theta$ ความเร็วรวมจึงไม่เป็นศูนย์" }
  - { front: "ยิงจากพื้นด้วยความเร็ว $u$ ทำมุม $\\theta$ เวลาลอยเท่าใด", back: "$T = \\dfrac{2u\\sin\\theta}{g}$" }
  - { front: "ขนาดและทิศของความเร็ว ณ เวลา $t$", back: "$v = \\sqrt{v_x^2 + v_y^2}$ โดย $v_x = u_x$ และ $v_y = u_y - gt$ มุมกับแนวราบ $\\tan\\alpha = \\dfrac{v_y}{v_x}$" }
  - { front: "ยิงด้วยอัตราเร็วเท่ากัน มุมใดไปได้ไกลที่สุดบนพื้นราบ", back: "$45^\\circ$ และมุมที่รวมกันได้ $90^\\circ$ เช่น $30^\\circ$ กับ $60^\\circ$ ให้ระยะทางแนวราบเท่ากัน" }
