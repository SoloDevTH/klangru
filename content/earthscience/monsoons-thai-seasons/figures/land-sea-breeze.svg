<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="sans-serif" font-size="14">
<title>ลมทะเลและลมบก</title>
<rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
<rect x="10" y="10" width="360" height="300" fill="#e0f2fe" stroke="#334155"/>
<rect x="10" y="230" width="180.0" height="80" fill="#3b82f6"/>
<rect x="190.0" y="225" width="180.0" height="85" fill="#a16207"/>
