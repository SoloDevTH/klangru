problems:
  - id: engineering.environmental.sanitation-public-health.p001
    topics:
      - engineering.environmental.sanitation-public-health
    difficulty: 1
    type: mcq
    stem: ในระบบน้ำดีแรงโน้มถ่วง แรงดันที่ก๊อกขึ้นกับปัจจัยใดมากที่สุด
    choices:
      - id: a
        text: ความสูงของระดับน้ำในถังเหนือก๊อก
        correct: true
      - id: b
        text: ขนาดของก๊อกน้ำ
        feedback: ขนาดก๊อกมีผลต่ออัตราการไหล แต่ไม่ได้กำหนดความดันสถิตที่ก๊อก
      - id: c
        text: อุณหภูมิของน้ำ
        feedback: อุณหภูมิมีผลเล็กน้อยต่อความหนาแน่น แต่ไม่ใช่ปัจจัยหลักของความดันในระบบแรงโน้มถ่วง
      - id: d
        text: สีของท่อประปา
        feedback: สีของท่อไม่มีผลต่อความดันทางฟิสิกส์
    hints:
      - ลองนึกถึงถังน้ำที่วางอยู่บนดาดฟ้าเทียบกับก๊อกที่อยู่ชั้นล่าง
      - น้ำที่อยู่สูงกว่ามีพลังงานศักย์มากกว่า
    solution: ในระบบแรงโน้มถ่วง แรงดันที่ก๊อกขึ้นกับความสูงของผิวน้ำในถังเหนือก๊อก ตามความสัมพันธ์ p = ρgh ขนาดก๊อกหรือสีท่อไม่ได้มีผลต่อความดันสถิต
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.sanitation-public-health.p002
    topics:
      - engineering.environmental.sanitation-public-health
    difficulty: 1
    type: numeric
    stem: ผิวน้ำในถังอยู่สูงกว่าก๊อก 8 เมตร โดยไม่คิดแรงเสียดทานในท่อ ความดันที่ก๊อกเท่ากับกี่กิโลปาสกาล (kPa) ใช้ ρ = 1000 กก./ม.³ และ g = 9.81 ม./วินาที² (ตอบทศนิยมหนึ่งตำแหน่ง ตัวเลขอย่างเดียว)
    answer:
      value: 78.5
      tolerance: 0.1
      unit: kPa
    hints:
      - ความดันของของเหลวที่สถิตอยู่ p = ρ g h โดย h คือความสูงของผิวน้ำเหนือจุดนั้น
      - ได้ค่าเป็นปาสกาลก่อน แล้วหารด้วย 1000 เป็น kPa
    misconceptions:
      - match: 8
        feedback: ใช้ความสูงเป็นค่าความดันโดยตรง ต้องคูณด้วย ρg ก่อนจึงจะได้หน่วยปาสกาล
      - match: 78480
        feedback: ได้ค่าเป็นปาสกาลแล้วแต่ยังไม่ได้หารด้วย 1000 เพื่อแปลงเป็นกิโลปาสกาล
    solution: p = 1000 × 9.81 × 8 = 78,480 Pa ≈ 78.5 kPa ความดันนี้ขึ้นกับความสูงของผิวน้ำเหนือก๊อกเท่านั้น ไม่ขึ้นกับขนาดของถัง
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.sanitation-public-health.p003
    topics:
      - engineering.environmental.sanitation-public-health
    difficulty: 1
    type: match
    stem: จับคู่องค์ประกอบของห่วงโซ่การติดต่อของโรคกับความหมาย
    pairs:
      - left: แหล่งรังโรค (reservoir)
        right: ที่ที่เชื้ออาศัยและเพิ่มจำนวนได้ เช่น คนที่เป็นโรค สัตว์ ดิน หรือน้ำ
      - left: ทางออก (portal of exit)
        right: ทางที่เชื้อหลุดออกจากแหล่งรังโรค เช่น อุจจาระ ลมหายใจ หรือเลือด
      - left: ทางเข้า (portal of entry)
        right: ช่องทางที่เชื้อเข้าสู่ร่างกาย เช่น ทางปากจากน้ำหรืออาหารปนเปื้อน
      - left: ผู้รับเชื้อ (susceptible host)
        right: คนที่ภูมิคุ้มกันไม่เพียงพอจนรับเชื้อและป่วยได้
    hints:
      - แหล่งรังโรคคือที่ที่เชื้ออาศัยและเพิ่มจำนวนได้ เช่น ในร่างกาย ดิน น้ำ
      - ทางออกคือเส้นทางที่เชื้อหลุดออกจากแหล่งรังโรค
    solution: แหล่งรังโรคคือที่ที่เชื้ออาศัยและเพิ่มจำนวน ทางออกคือทางที่เชื้อหลุดออกจากแหล่งรังโรค ทางเข้าคือช่องทางที่เชื้อเข้าสู่ร่างกาย และผู้รับเชื้อคือคนที่รับเชื้อได้เมื่อภูมิคุ้มกันไม่เพียงพอ
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.sanitation-public-health.p004
    topics:
      - engineering.environmental.sanitation-public-health
    difficulty: 2
    type: mcq
    stem: ที่ดักไขมันควรติดตั้งที่ตำแหน่งใดและเพราะเหตุใด
    choices:
      - id: a
        text: ก่อนน้ำจากครัวจะรวมกับท่อหลักหรือบ่อเกรอะ เพื่อแยกไขมันก่อนอุดตัน
        correct: true
      - id: b
        text: หลังบ่อซึม เพื่อกรองน้ำก่อนระบายออกสู่ดิน
        feedback: ถ้าไขมันเข้าถึงบ่อซึมแล้วจะอุดรูพรุนของดินและทำให้ระบบเสียทั้งระบบ
      - id: c
        text: บนหลังคาอาคาร เพื่อให้ไขมันระเหย
        feedback: ไขมันไม่ระเหยง่ายและจะเกาะท่อของหลังคาแทน
      - id: d
        text: ในห้องน้ำชั้นบนสุดเพื่อรับน้ำล้างมือ
        feedback: น้ำล้างมือมีไขมันน้อยกว่าน้ำจากครัวมาก ตำแหน่งนี้จึงไม่ตรงกับปัญหา
    hints:
      - น้ำมันจากการล้างจานจะแข็งตัวเมื่อเย็นลงและเกาะผนังท่อ
      - ตำแหน่งที่ดีคือก่อนน้ำเสียจากครัวจะรวมกับน้ำจากห้องน้ำ
    solution: ที่ดักไขมันควรอยู่ก่อนน้ำจากครัวจะรวมกับระบบท่อหลักหรือบ่อเกรอะ เพื่อแยกไขมันและน้ำมันที่จะแข็งตัวและอุดตันท่อ ถ้าปล่อยให้ไขมันเข้าท่อจะทำให้ท่ออุดตันและเกิดกลิ่นในระยะยาว
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.sanitation-public-health.p005
    topics:
      - engineering.environmental.sanitation-public-health
    difficulty: 2
    type: numeric
    stem: (ข้อมูลสมมติ) ในหมู่บ้านแห่งหนึ่งในภาคอีสาน ผู้ที่ดื่มน้ำบ่อตื้นมี 40 คน ในจำนวนนี้ป่วยด้วยท้องร่วง 30 คน ส่วนผู้ที่ไม่ได้ดื่มน้ำบ่อมี 60 คน ป่วย 6 คน อัตราป่วยในกลุ่มที่ดื่มน้ำบ่อ (attack rate) เป็นกี่เปอร์เซ็นต์ (ตอบตัวเลขอย่างเดียว)
    answer:
      value: 75.0
      tolerance: 0.1
      unit: '%'
    hints:
      - attack rate = จำนวนผู้ป่วยใหม่ในกลุ่มที่สัมผัส ÷ จำนวนคนในกลุ่มที่สัมผัส
      - คูณด้วย 100 เพื่อเป็นเปอร์เซ็นต์
    misconceptions:
      - match: 10.0
        feedback: นี่คืออัตราป่วยของกลุ่มที่ไม่ได้ดื่มน้ำ ไม่ใช่กลุ่มที่ดื่ม
      - match: 83.33333333333334
        feedback: หารด้วยจำนวนผู้ป่วยทั้งหมด ไม่ใช่จำนวนคนในกลุ่มที่สัมผัส
    solution: อัตราป่วยในกลุ่มที่ดื่มน้ำบ่อ = 30 ÷ 40 × 100 = 75% เทียบกับกลุ่มที่ไม่ได้ดื่ม 6 ÷ 60 × 100 = 10% ความแตกต่างนี้บ่งชี้ว่าแหล่งน้ำบ่อเป็นสาเหตุที่น่าสงสัย
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.sanitation-public-health.p006
    topics:
      - engineering.environmental.sanitation-public-health
    difficulty: 2
    type: numeric
    stem: (ข้อมูลสมมติ) ในการระบาดท้องร่วง ผู้ที่ดื่มน้ำบ่อ 40 คน ป่วย 30 คน ส่วนผู้ที่ไม่ได้ดื่ม 60 คน ป่วย 6 คน ความเสี่ยงสัมพัทธ์ (relative risk) ของการป่วยในกลุ่มที่ดื่มน้ำบ่อเทียบกับกลุ่มที่ไม่ดื่มเป็นเท่าไร (ตอบทศนิยมหนึ่งตำแหน่ง)
    answer:
      value: 7.5
      tolerance: 0.05
    hints:
      - ความเสี่ยงสัมพัทธ์ = อัตราป่วยกลุ่มสัมผัส ÷ อัตราป่วยกลุ่มไม่สัมผัส
      - ใช้ค่าเป็นเปอร์เซ็นต์ได้โดยไม่ต้องแปลงเป็นทศนิยม เพราะหน่วยหักกันได้
    misconceptions:
      - match: 65.0
        feedback: ลบอัตราป่วยทั้งสองกลุ่มแทนการหาร ได้ผลต่างแทนอัตราส่วน
    solution: RR = 75 ÷ 10 = 7.5 หมายความว่ากลุ่มที่ดื่มน้ำบ่อมีความเสี่ยงป่วยสูงกว่ากลุ่มที่ไม่ได้ดื่มประมาณ 7.5 เท่า
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.sanitation-public-health.p007
    topics:
      - engineering.environmental.sanitation-public-health
    difficulty: 2
    type: order
    stem: เรียงลำดับการไหลของน้ำเสียจากสุขภัณฑ์ในระบบบ่อเกรอะ–บ่อซึม
    items:
      - น้ำเสียจากสุขภัณฑ์ไหลเข้าท่อรวบรวมของอาคาร
      - บ่อเกรอะแยกตะกอนและสิ่งลอยตัวออกจากน้ำ
      - น้ำใสค่อนข้างนิ่งไหลออกไปยังบ่อซึมหรือระบบซึม
      - ตะกอนที่สะสมในบ่อเกรอะถูกสูบออกตามรอบเวลาที่กำหนด
    hints:
      - น้ำเสียต้องผ่านการแยกตะกอนก่อนจะซึมลงดิน
      - ตะกอนสะสมเป็นผลของขั้นตอนที่สอง ไม่ใช่ขั้นแรกของการไหล
    solution: น้ำเสียไหลจากสุขภัณฑ์เข้าท่อ แล้วเข้าบ่อเกรอะซึ่งแยกตะกอนและสิ่งลอยตัว น้ำใสไหลต่อไปยังบ่อซึมหรือระบบซึม ส่วนตะกอนที่สะสมต้องสูบออกเป็นรอบเพื่อไม่ให้ไหลออกไปอุดบ่อซึม
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.sanitation-public-health.p008
    topics:
      - engineering.environmental.sanitation-public-health
    difficulty: 3
    type: numeric
    stem: (ข้อมูลสมมติ) ปั๊มสูบน้ำอาคารให้อัตราการไหล 0.5 ลิตรต่อวินาที ยกน้ำสูง 15 เมตร ประสิทธิภาพของปั๊ม 60% กำลังไฟฟ้าที่ปั๊มใช้เป็นกี่วัตต์ (ใช้ ρ = 1000 และ g = 9.81 ตอบทศนิยมหนึ่งตำแหน่ง)
    answer:
      value: 122.6
      tolerance: 0.2
      unit: W
    hints:
      - กำลังงานที่ใช้จริงของน้ำ = ρ g Q H (วัตต์) โดยต้องแปลงลิตรต่อวินาทีเป็นลูกบาศก์เมตรต่อวินาทีก่อน
      - กำลังไฟฟ้าที่ปั๊มใช้ = กำลังงานที่ใช้จริง ÷ ประสิทธิภาพ
    misconceptions:
      - match: 73.6
        feedback: ลืมหารด้วยประสิทธิภาพ ปั๊มจริงต้องใช้พลังงานมากกว่ากำลังที่ใช้จริงกับน้ำ
    solution: Q = 0.5 ลิตร/วินาที = 0.0005 ม³/วินาที กำลังที่ใช้กับน้ำ = 1000 × 9.81 × 0.0005 × 15 ≈ 73.6 W กำลังไฟฟ้า = 73.6 ÷ 0.6 ≈ 122.6 W
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.sanitation-public-health.p009
    topics:
      - engineering.environmental.sanitation-public-health
    difficulty: 3
    type: numeric
    stem: (ข้อมูลสมมติ) หลังคาอาคารพื้นที่ 80 ตารางเมตร สัมประสิทธิ์น้ำท่า C = 0.9 และความเข้มฝน i = 120 มม./ชม. ใช้วิธีเหตุผล (rational method) Q = C × i × A ÷ 360 โดย A เป็นเฮกตาร์ ปริมาณน้ำฝนที่ต้องระบายคือกี่ลิตรต่อวินาที (ตอบทศนิยมหนึ่งตำแหน่ง)
    answer:
      value: 2.4
      tolerance: 0.05
      unit: L/s
    hints:
      - แปลงพื้นที่ 80 ตารางเมตรเป็นเฮกตาร์ก่อน (1 เฮกตาร์ = 10,000 ตารางเมตร)
      - Q ที่ได้จากสูตรมีหน่วยลูกบาศก์เมตรต่อวินาที ต้องคูณ 1000 เพื่อเป็นลิตรต่อวินาที
    misconceptions:
      - match: 0.0024
        feedback: ค่านี้เป็นหน่วยลูกบาศก์เมตรต่อวินาที ไม่ใช่ลิตรต่อวินาที
      - match: 0.864
        feedback: ลืมหารด้วย 360 ทำให้ค่าสูงเกินจริงมาก
    solution: A = 80 ÷ 10,000 = 0.008 ha Q = 0.9 × 120 × 0.008 ÷ 360 = 0.0024 m³/s = 2.4 L/s ท่อรางน้ำฝนต้องรองรับปริมาณนี้ได้ จึงควรตรวจขนาดท่อกับมาตรฐานท้องถิ่น
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.sanitation-public-health.p010
    topics:
      - engineering.environmental.sanitation-public-health
    difficulty: 3
    type: mcq
    stem: ข้อใดเป็นการควบคุมพาหะนำโรคไข้เลือดออกที่มีประสิทธิภาพที่สุดในระยะยาวในชุมชน
    choices:
      - id: a
        text: พ่นยาฆ่าแมลงทุกวันโดยไม่กำจัดแหล่งน้ำขัง
        feedback: การพ่นอย่างเดียวไม่ได้ลดแหล่งเพาะพันธุ์ ยุงกลับมาได้ไม่นาน
      - id: b
        text: กำจัดแหล่งน้ำขังที่ยุงวางไข่ เช่น ปิดภาชนะเก็บน้ำและเก็บยางรถ
        correct: true
      - id: c
        text: ย้ายชุมชนไปอยู่ที่อื่นทั้งหมด
        feedback: การย้ายชุมชนไม่ได้เป็นมาตรการที่ทำได้จริงและไม่ได้แก้ปัญหาพื้นฐาน
      - id: d
        text: แจกยาลดไข้ให้ประชาชนทุกคน
        feedback: ยาลดไข้ช่วยบรรเทาอาการ แต่ไม่ได้ควบคุมพาหะของโรค
    hints:
      - ยุงลายวางไข่ในน้ำขังเล็ก ๆ ในภาชนะ ยาง และเศษวัสดุ
      - การลดแหล่งเพาะพันธุ์ลดจำนวนยุงได้ต่อเนื่องกว่าการพึ่งสารเคมีอย่างเดียว
    solution: การกำจัดแหล่งน้ำขังที่เป็นที่วางไข่ เช่น ปิดภาชนะเก็บน้ำ เก็บยางรถ และเก็บเศษวัสดุ ทำได้ต่อเนื่องและลดจำนวนยุงในระยะยาว การพ่นสารเคมีเป็นมาตรการเสริมที่ต้องใช้อย่างถูกต้องและมีกำหนด
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.sanitation-public-health.p011
    topics:
      - engineering.environmental.sanitation-public-health
    difficulty: 4
    type: numeric
    stem: (ข้อมูลสมมติ) ผิวน้ำในถังบนดาดฟ้าอยู่สูงกว่าก๊อก 15 เมตร เมื่อคิดแรงเสียดทานในท่อเทียบเท่าความสูงน้ำ 3.2 เมตร ความดันที่ก๊อกประมาณกี่ kPa (ใช้ ρ = 1000, g = 9.81 ตอบทศนิยมหนึ่งตำแหน่ง)
    answer:
      value: 115.8
      tolerance: 0.1
      unit: kPa
    hints:
      - ความสูงสุทธิที่ใช้คำนวณความดัน = ความสูงของถัง − การสูญเสียแรงดันในท่อ (เทียบเท่าความสูงน้ำ)
      - คำนวณ ρ g h โดย h เป็นเมตร แล้วหารด้วย 1000 เพื่อให้เป็น kPa
    misconceptions:
      - match: 147.2
        feedback: ไม่ได้หักการสูญเสียแรงดันในท่อ ค่าที่ได้จึงสูงเกินจริง
      - match: 31.4
        feedback: คำนวณเฉพาะส่วนที่สูญเสียในท่อ (3.2 เมตร) แทนความสูงสุทธิที่เหลือ
    solution: h สุทธิ = 15 − 3.2 = 11.8 ม. p = 1000 × 9.81 × 11.8 = 115,758 Pa ≈ 115.8 kPa แรงดันที่ก๊อกขณะน้ำไหลจึงต่ำกว่าความดันสถิตเพราะแรงเสียดทาน
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.sanitation-public-health.p012
    topics:
      - engineering.environmental.sanitation-public-health
    difficulty: 4
    type: numeric
    stem: (ข้อมูลสมมติ) ถังเก็บน้ำปริมาตร 5 ลูกบาศก์เมตร ต้องการคลอรีนอิสระ 2 มิลลิกรัมต่อลิตร โดยใช้ผงแคลเซียมไฮโปคลอไรต์ที่มีคลอรีนที่ใช้ได้ 65% ต้องใช้ผงนี้กี่กรัม (ตอบทศนิยมหนึ่งตำแหน่ง)
    answer:
      value: 15.4
      tolerance: 0.1
      unit: g
    hints:
      - คลอรีนที่ต้องการ = ความเข้มข้น × ปริมาตร (มิลลิกรัม) โดย 1 ลูกบาศก์เมตร = 1000 ลิตร
      - ผงที่มีคลอรีนใช้ได้ 65% จึงต้องหารด้วย 0.65 เพื่อให้ได้น้ำหนักผงทั้งหมด
    misconceptions:
      - match: 10.0
        feedback: ลืมว่าผงมีคลอรีนที่ใช้ได้เพียง 65% จึงต้องใช้มากกว่าปริมาณคลอรีนที่คำนวณ
    solution: คลอรีนที่ต้องการ = 2 mg/L × 5,000 L = 10,000 mg = 10 g ผงที่ต้องใช้ = 10 ÷ 0.65 ≈ 15.4 g ตัวเลขนี้เป็นค่าสมมติเพื่อการคำนวณ ต้องตรวจขนาดการใช้จริงกับคู่มือผู้ผลิตและมาตรฐานน้ำที่ใช้บังคับ
    license: CC-BY-SA-4.0
