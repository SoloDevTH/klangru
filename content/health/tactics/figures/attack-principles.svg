<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="sans-serif">
<title>หลักการรุก: ความกว้าง ความลึก และส่งแล้ววิ่ง</title>
<rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="380.0" y="26.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">หลักการรุกในฟุตซอล (ครึ่งสนามฝั่งรุก)</text>
<rect x="40.0" y="60.0" width="360.0" height="360.0" rx="0" fill="#eaf5ea" stroke="#555" stroke-width="2"/>
<rect x="193.0" y="49.2" width="54.0" height="10.8" rx="0" fill="#fff" stroke="#555" stroke-width="2"/>
<path d="M112.0,60.0 A108.0,108.0 0 0 0 328.0,60.0" fill="none" stroke="#888" stroke-width="1.5"/>
<circle cx="220.0" cy="366.0" r="11" fill="#2e86c1" stroke="#1b4f72" stroke-width="1.5"/>
<text x="220.0" y="371.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff">A</text>
<circle cx="232.0" cy="355.0" r="5" fill="#fff" stroke="#111" stroke-width="1.5"/>
<circle cx="76.0" cy="258.0" r="11" fill="#2e86c1" stroke="#1b4f72" stroke-width="1.5"/>
<text x="76.0" y="263.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff">B</text>
<circle cx="364.0" cy="258.0" r="11" fill="#2e86c1" stroke="#1b4f72" stroke-width="1.5"/>
<text x="364.0" y="263.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff">C</text>
<circle cx="220.0" cy="168.0" r="11" fill="#2e86c1" stroke="#1b4f72" stroke-width="1.5"/>
<text x="220.0" y="173.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff">D</text>
<line x1="212.0" y1="304.0" x2="228.0" y2="320.0" stroke="#c0392b" stroke-width="4"/>
<line x1="212.0" y1="320.0" x2="228.0" y2="304.0" stroke="#c0392b" stroke-width="4"/>
<line x1="140.0" y1="214.0" x2="156.0" y2="230.0" stroke="#c0392b" stroke-width="4"/>
<line x1="140.0" y1="230.0" x2="156.0" y2="214.0" stroke="#c0392b" stroke-width="4"/>
<line x1="284.0" y1="214.0" x2="300.0" y2="230.0" stroke="#c0392b" stroke-width="4"/>
<line x1="284.0" y1="230.0" x2="300.0" y2="214.0" stroke="#c0392b" stroke-width="4"/>
<line x1="220.0" y1="366.0" x2="92.2" y2="270.6" stroke="#111" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="6 5"/>
<line x1="220.0" y1="366.0" x2="166.0" y2="204.0" stroke="#2e86c1" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="420.0" y="105.0" font-size="14" text-anchor="start" font-weight="bold" fill="#7d3c98">ความกว้าง</text>
<text x="420.0" y="125.0" font-size="12" text-anchor="start" fill="#111">B กับ C ยืนชิดเส้นข้างทั้งสองฝั่ง</text>
<text x="420.0" y="143.0" font-size="12" text-anchor="start" fill="#111">ดึงผู้ป้องกันให้แยกกัน</text>
<text x="420.0" y="161.0" font-size="12" text-anchor="start" fill="#111">เกิดช่องว่างตรงกลาง</text>
<text x="420.0" y="200.0" font-size="14" text-anchor="start" font-weight="bold" fill="#7d3c98">ความลึก</text>
<text x="420.0" y="220.0" font-size="12" text-anchor="start" fill="#111">D อยู่ลึกใกล้ประตู A อยู่ข้างหลัง</text>
<text x="420.0" y="238.0" font-size="12" text-anchor="start" fill="#111">มีตัวเลือกส่งทั้งหน้าและหลัง</text>
<text x="420.0" y="275.0" font-size="14" text-anchor="start" font-weight="bold" fill="#7d3c98">ส่งแล้ววิ่ง</text>
<text x="420.0" y="295.0" font-size="12" text-anchor="start" fill="#111">A ส่งให้ B แล้ววิ่งเข้าช่องว่าง</text>
<text x="420.0" y="313.0" font-size="12" text-anchor="start" fill="#111">รอรับลูกคืน (give-and-go)</text>
<text x="420.0" y="350.0" font-size="14" text-anchor="start" font-weight="bold" fill="#7d3c98">ตัวช่วย</text>
<text x="420.0" y="370.0" font-size="12" text-anchor="start" fill="#111">ผู้เล่นใกล้ลูกอยู่ในมุมที่รับลูกได้</text>
<text x="420.0" y="388.0" font-size="12" text-anchor="start" fill="#111">ไม่ยืนบังกันหลังผู้ป้องกัน</text>
<circle cx="48.0" cy="445.0" r="8" fill="#2e86c1" stroke="#1b4f72" stroke-width="1.5"/>
<text x="62.0" y="449.0" font-size="12" text-anchor="start" fill="#111">ฝ่ายรุก</text>
<line x1="122.0" y1="439.0" x2="134.0" y2="451.0" stroke="#c0392b" stroke-width="3"/>
<line x1="122.0" y1="451.0" x2="134.0" y2="439.0" stroke="#c0392b" stroke-width="3"/>
<text x="142.0" y="449.0" font-size="12" text-anchor="start" fill="#111">ฝ่ายป้องกัน</text>
<line x1="230.0" y1="445.0" x2="265.0" y2="445.0" stroke="#111" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="6 5"/>
<text x="272.0" y="449.0" font-size="12" text-anchor="start" fill="#111">ส่งลูก</text>
<line x1="325.0" y1="445.0" x2="360.0" y2="445.0" stroke="#2e86c1" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="367.0" y="449.0" font-size="12" text-anchor="start" fill="#111">วิ่ง</text>
</svg>
