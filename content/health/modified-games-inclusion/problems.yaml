problems:
- id: health.sport.modified-games-inclusion.p001
  topics:
  - health.sport.modified-games-inclusion
  difficulty: 1
  type: mcq
  stem: เหตุผลสำคัญที่ควรปรับกติกาเกมคืออะไร
  choices:
  - id: a
    text: ทักษะของผู้เล่นต่างกัน ทำให้บางคนไม่ได้ลงเล่นเลย
    correct: true
  - id: b
    text: เพื่อให้เกมยากขึ้นสำหรับทุกคน
    feedback: เกมที่ยากเกินไปสำหรับบางคนไม่ทำให้ทุกคนได้เล่น
  - id: c
    text: เพื่อให้เกมจบเร็วขึ้นเสมอ
    feedback: ความเร็วไม่ใช่เป้าหมายหลักของการปรับกติกาเพื่อความเป็นธรรม
  - id: d
    text: เพื่อให้คนเก่งชนะทุกครั้ง
    feedback: การปรับที่ดีควรลดความได้เปรียบเกินไป ไม่ใช่เพิ่มให้คนเก่ง
  hints:
  - ลองนึกว่าผู้เล่นแต่ละคนเก่งไม่เท่ากัน
  - เป้าหมายของการปรับคือให้ทุกคนได้เล่นอย่างมีส่วนร่วม
  solution: ทักษะของผู้เล่นต่างกัน และอาจมีความพิการหรือพื้นที่จำกัด ทำให้บางคนไม่ได้เล่นเลยถ้ากติกาไม่เปิดให้ทุกคนมีส่วนร่วม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sport.modified-games-inclusion.p002
  topics:
  - health.sport.modified-games-inclusion
  difficulty: 1
  type: match
  stem: จับคู่แต่ละด้านของกรอบ STEP กับการปรับที่ทำได้
  pairs:
  - left: พื้นที่ (Space)
    right: ลดขนาดสนามให้เหมาะกับจำนวนผู้เล่น
  - left: งาน (Task)
    right: เปลี่ยนเป้าหมายให้เล่นได้หลายแบบ
  - left: อุปกรณ์ (Equipment)
    right: ใช้ลูกบอลนิ่มหรือเบาลง
  - left: ผู้เล่น (People)
    right: แบ่งทีมให้ทักษะสมดุลกัน
  hints:
  - STEP ย่อมาจากพื้นที่ งาน อุปกรณ์ และผู้เล่น
  - ลองนึกว่าสนามกว้างเกินไปเป็นการปรับด้านไหน
  solution: พื้นที่ = ลดขนาดสนาม, งาน = เปลี่ยนเป้าหมายให้เล่นได้หลายแบบ, อุปกรณ์ = ใช้ลูกบอลนิ่มหรือเบา, ผู้เล่น = แบ่งทีมให้ทักษะสมดุล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sport.modified-games-inclusion.p003
  topics:
  - health.sport.modified-games-inclusion
  difficulty: 1
  type: mcq
  stem: ทำไมควรให้ทุกคนในกลุ่มช่วยกันตั้งกติกา
  choices:
  - id: a
    text: เพื่อให้ทุกคนเข้าใจและรู้สึกเป็นเจ้าของกติกา
    correct: true
  - id: b
    text: เพื่อให้ผู้ใหญ่ไม่ต้องดูแลเกม
    feedback: การตั้งกติการ่วมกันไม่ได้ทำให้เลิกดูแลความปลอดภัย
  - id: c
    text: เพื่อให้คนเก่งที่สุดตั้งกติกาคนเดียว
    feedback: การให้คนเดียวตั้งกติกาอาจไม่คำนึงถึงทุกคน
  - id: d
    text: เพื่อให้กติกาเปลี่ยนทุกนาที
    feedback: กติกาที่เปลี่ยนบ่อยเกินไปทำให้ทุกคนสับสน
  hints:
  - ลองนึกว่าคนที่เข้าใจกติกาและมีส่วนร่วมจะทำตามได้มากกว่า
  - กติกาที่ตั้งร่วมกันมักเป็นธรรมกับทุกคนมากกว่า
  solution: เมื่อทุกคนช่วยตั้งกติกา ทุกคนเข้าใจและรู้สึกเป็นเจ้าของกติกา จึงยอมรับและปฏิบัติตามได้ดีขึ้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sport.modified-games-inclusion.p004
  topics:
  - health.sport.modified-games-inclusion
  difficulty: 2
  type: numeric
  stem: ทีม A ยิงเข้า 3 ลูก ลูกละ 1 คะแนน และมีการส่งบอลให้เพื่อนที่ยังไม่เคยสัมผัสบอลในเกมนั้น ได้โบนัส 5 ครั้ง ครั้งละ 1 คะแนน ทีม A ได้รวมกี่คะแนน (ตอบเป็นคะแนน)
  answer:
    value: 8
    tolerance: 0
    unit: คะแนน
  misconceptions:
  - match: 3
    feedback: นั่นคือคะแนนจากการยิงเพียงอย่างเดียว ยังไม่ได้นับโบนัส
  - match: 15
    feedback: โบนัสต้องบวกเข้าไป ไม่ได้คูณกับจำนวนการยิง
  hints:
  - คะแนนจากการยิงและคะแนนโบนัสนับแยกกันก่อน แล้วค่อยรวม
  - โบนัสไม่ได้คูณกับจำนวนการยิง
  solution: คะแนนจากการยิง 3 + คะแนนโบนัส 5 = 8 คะแนน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sport.modified-games-inclusion.p005
  topics:
  - health.sport.modified-games-inclusion
  difficulty: 2
  type: mcq
  stem: กติกาข้อใดช่วยให้ทุกคนได้เล่นมากขึ้น (เลือกได้หลายข้อ)
  multiple: true
  choices:
  - id: a
    text: ทุกคนต้องแตะบอลก่อนยิงประตู
    correct: true
  - id: b
    text: สลับผู้เล่นตามช่วงเวลาที่กำหนด
    correct: true
  - id: c
    text: ให้โบนัสเมื่อส่งบอลให้เพื่อนที่ยังไม่ได้สัมผัสบอล
    correct: true
  - id: d
    text: ให้เฉพาะคนที่เก่งที่สุดยิงประตูได้
    feedback: กติกานี้ทำให้คนอื่นไม่มีโอกาสได้ทำคะแนน
  - id: e
    text: ให้ผู้ตัดสินนับคะแนนเฉพาะการเล่นของคนที่มีทักษะสูง
    feedback: การนับคะแนนแบบนี้ไม่เป็นธรรมกับผู้เล่นอื่น
  hints:
  - ลองนึกว่ากติกาแบบไหนทำให้ทุกคนได้สัมผัสบอลหรือได้ลงเล่น
  - กติกาที่ให้เฉพาะคนเก่งทำคะแนนได้จะไม่ช่วยให้ทุกคนได้เล่น
  solution: ให้ทุกคนแตะบอลก่อนยิง สลับผู้เล่นตามช่วงเวลา และให้โบนัสเมื่อส่งบอลให้เพื่อนที่ยังไม่ได้สัมผัสบอล ช่วยให้ทุกคนมีส่วนร่วม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sport.modified-games-inclusion.p006
  topics:
  - health.sport.modified-games-inclusion
  difficulty: 2
  type: text
  stem: กรอบการปรับเกมที่แบ่งการปรับเป็นสี่ด้าน คือพื้นที่ งาน อุปกรณ์ และผู้เล่น มีชื่อย่อเป็นภาษาอังกฤษว่าอะไร (ตอบเป็นตัวอักษร)
  accepted:
  - STEP
  hints:
  - ตัวอักษรแรกของแต่ละด้านเรียงกันเป็นคำ
  - ลองนึกถึงคำว่า Space Task Equipment People
  solution: กรอบนี้เรียกว่า STEP ได้จาก Space (พื้นที่) Task (งาน) Equipment (อุปกรณ์) และ People (ผู้เล่น)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sport.modified-games-inclusion.p007
  topics:
  - health.sport.modified-games-inclusion
  difficulty: 2
  type: mcq
  stem: บอคเซีย (Boccia) เป็นกีฬาที่ออกแบบให้ใครเล่นร่วมกันได้
  choices:
  - id: a
    text: เฉพาะคนที่วิ่งเร็วที่สุดในโรงเรียน
    feedback: บอคเซียไม่ได้เน้นความเร็วในการวิ่ง
  - id: b
    text: ผู้เล่นที่มีความพิการทางร่างกายซึ่งกระทบการเคลื่อนไหว โดยนั่งเล่น และผู้ใช้รถเข็นก็เล่นได้
    correct: true
  - id: c
    text: เฉพาะผู้ชายที่มีรูปร่างสูงใหญ่
    feedback: กีฬานี้ไม่ได้จำกัดเพศหรือรูปร่าง
  - id: d
    text: เฉพาะผู้ที่เล่นบาสเกตบอลเก่งอยู่แล้ว
    feedback: บอคเซียเป็นกีฬาที่ออกแบบให้ทุกคนเริ่มเล่นได้
  hints:
  - บอคเซียเป็นกีฬาที่ผู้เล่นทุกคนเล่นได้แม้มีข้อจำกัดด้านการเคลื่อนไหว
  - ลองนึกว่าผู้เล่นที่ใช้รถเข็นเล่นได้หรือไม่
  solution: บอคเซียออกแบบสำหรับนักกีฬาที่มีความพิการทางร่างกายรุนแรงซึ่งกระทบการเคลื่อนไหว (เดิมสำหรับผู้มีภาวะสมองพิการ) นักกีฬานั่งเล่น ส่วนใหญ่บนรถเข็น ในโรงเรียนทุกคนจึงนั่งเล่นร่วมกันได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sport.modified-games-inclusion.p008
  topics:
  - health.sport.modified-games-inclusion
  difficulty: 3
  type: numeric
  stem: ทีมแรกยิงโดนเป้า 3 ใน 5 ลูก ทีมหลังยิงโดนเป้า 2 ใน 4 ลูก ความแม่นยำของสองทีมต่างกันกี่จุดร้อยละ (ตอบเป็นจุดร้อยละ)
  answer:
    value: 10.0
    tolerance: 0
    unit: จุดร้อยละ
  misconceptions:
  - match: 1
    feedback: นั่นคือผลต่างของจำนวนลูกที่โดนเป้า ไม่ใช่ความแม่นยำเป็นร้อยละ
  - match: 50.0
    feedback: นั่นคือความแม่นยำของทีมหลังเพียงทีมเดียว ต้องเทียบกับทีมแรกด้วย
  hints:
  - หาความแม่นยำของแต่ละทีมเป็นร้อยละก่อน (จำนวนที่โดน ÷ จำนวนที่ยิง × 100)
  - ผลต่างของร้อยละเรียกว่า จุดร้อยละ
  solution: ทีมแรก 3 ÷ 5 = 60% ทีมหลัง 2 ÷ 4 = 50% ต่างกัน 60 − 50 = 10 จุดร้อยละ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sport.modified-games-inclusion.p009
  topics:
  - health.sport.modified-games-inclusion
  difficulty: 3
  type: mcq
  stem: ระบบนับคะแนนแบบใดมีแนวโน้มทำให้ผู้เล่นที่เก่งได้เปรียบมากเกินไป
  choices:
  - id: a
    text: ให้คะแนนพิเศษเฉพาะการยิงระยะไกลที่ทำได้ยาก
    correct: true
  - id: b
    text: ให้คะแนนทุกครั้งที่ทุกคนได้แตะบอล
    feedback: ช่วยให้ทุกคนมีส่วนร่วม จึงลดความได้เปรียบเกินไป
  - id: c
    text: ให้คะแนนโบนัสเมื่อส่งบอลให้เพื่อนที่ยังไม่ได้แตะบอล
    feedback: ช่วยให้ผู้เล่นทุกคนมีบทบาท จึงไม่ทำให้คนเก่งได้เปรียบมากเกินไป
  - id: d
    text: ให้คะแนนเท่ากันทุกการกระทำ
    feedback: การให้คะแนนเท่ากันทุกการกระทำช่วยลดความได้เปรียบ
  hints:
  - ลองนึกว่าคะแนนพิเศษควรให้กับการกระทำที่ทุกคนทำได้หรือไม่
  - ระบบที่ยิ่งให้คะแนนสูงกับสิ่งที่ทำได้ยากเฉพาะคนเก่งจะเพิ่มความต่างระหว่างผู้เล่น
  solution: การให้คะแนนพิเศษเฉพาะการยิงระยะไกลที่ทำได้ยาก ทำให้คนเก่งทำคะแนนได้มากกว่าคนอื่นมาก ส่วนการให้คะแนนเมื่อทุกคนได้แตะบอลหรือส่งบอลให้เพื่อน ช่วยให้ทุกคนมีโอกาส
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sport.modified-games-inclusion.p010
  topics:
  - health.sport.modified-games-inclusion
  difficulty: 3
  type: order
  stem: เรียงขั้นตอนการปรับเกมให้ทุกคนได้เล่น (จากขั้นแรกไปขั้นสุดท้าย)
  items:
  - ระบุปัญหาที่เกิดขึ้นจริงในเกม
  - ทดลองกติกาใหม่หนึ่งข้อ
  - ประเมินด้วยเกณฑ์ความยุติธรรม ความปลอดภัย และการมีส่วนร่วม
  - ปรับแก้และทดลองซ้ำ
  - ตั้งเป็นกติการ่วมของกลุ่ม
  hints:
  - เริ่มจากการระบุปัญหาที่เกิดขึ้นจริงก่อน
  - ขั้นสุดท้ายคือการตั้งเป็นกติการ่วมของกลุ่ม
  solution: ระบุปัญหา ทดลองกติกาใหม่ ประเมินด้วยเกณฑ์ ปรับแก้และทดลองซ้ำ แล้วจึงตั้งเป็นกติการ่วมของกลุ่ม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sport.modified-games-inclusion.p011
  topics:
  - health.sport.modified-games-inclusion
  difficulty: 3
  type: mcq
  stem: ข้อใดไม่ใช่เกณฑ์ในการประเมินเกมที่ปรับแล้ว
  choices:
  - id: a
    text: ความยุติธรรมของการนับคะแนน
    feedback: เป็นเกณฑ์ที่สำคัญในการประเมินเกมที่ปรับแล้ว
  - id: b
    text: ความปลอดภัยของผู้เล่น
    feedback: เป็นเกณฑ์ที่สำคัญในการประเมินเกมที่ปรับแล้ว
  - id: c
    text: ทุกคนมีส่วนร่วมในเกมจริงหรือไม่
    feedback: เป็นเกณฑ์ที่สำคัญในการประเมินเกมที่ปรับแล้ว
  - id: d
    text: ความสูงของผู้ตัดสิน
    correct: true
  hints:
  - เกณฑ์ที่ดีควรเกี่ยวกับผู้เล่นและการเล่นเกมจริง
  - ลองดูว่าข้อไหนไม่เกี่ยวกับการเล่นหรือความเป็นธรรมของเกม
  solution: เกณฑ์ประเมินควรเป็นเรื่องความยุติธรรม ความปลอดภัย การมีส่วนร่วม และความท้าทาย ความสูงของผู้ตัดสินไม่เกี่ยวกับคุณภาพของเกมที่ปรับ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sport.modified-games-inclusion.p012
  topics:
  - health.sport.modified-games-inclusion
  difficulty: 4
  type: numeric
  stem: ผู้เล่น 26 คนต้องแบ่งเป็นทีมละ 6 คนให้มากที่สุดเท่าที่ทำได้ จะเหลือผู้เล่นกี่คนที่ไม่ได้อยู่ในทีมเต็ม (ตอบเป็นคน)
  answer:
    value: 2
    tolerance: 0
    unit: คน
  misconceptions:
  - match: 4
    feedback: นั่นคือจำนวนทีมเต็ม ไม่ใช่จำนวนผู้เล่นที่เหลือ
  - match: 6
    feedback: นั่นคือจำนวนคนต่อทีม ไม่ใช่จำนวนที่เหลือ
  hints:
  - หารจำนวนผู้เล่นด้วยจำนวนคนต่อทีม
  - จำนวนที่เหลือคือเศษจากการหาร
  solution: 26 ÷ 6 = 4 ทีมเต็ม เหลือ 26 − 4 × 6 = 2 คน ในเกมที่เน้นให้ทุกคนได้เล่น ไม่ควรให้ 2 คนนี้นั่งดู เช่น ให้สองทีมมี 7 คนแล้วใช้กติกาสลับตัว
  license: CC-BY-SA-4.0
  ai_assisted: true
