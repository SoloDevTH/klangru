<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="sans-serif" font-size="14">
<title>เมทริกซ์ Leopold ของการขุดหน้าดิน ขนส่งแร่ และปลูกป่า</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15211e"/></marker></defs>
<rect x="0" y="0" width="720" height="380" fill="#ffffff"/>
<text x="360.0" y="30.0" text-anchor="middle" font-size="16" fill="#15211e" font-weight="bold">เมทริกซ์ผลกระทบแบบ Leopold: ขนาด (m) | ความสำคัญ (i)</text>
<text x="290.0" y="76.0" text-anchor="middle" font-size="12" fill="#15211e" font-weight="bold">F1 คุณภาพอากาศ</text>
<text x="450.0" y="76.0" text-anchor="middle" font-size="12" fill="#15211e" font-weight="bold">F2 คุณภาพน้ำผิวดิน</text>
<text x="610.0" y="76.0" text-anchor="middle" font-size="12" fill="#15211e" font-weight="bold">F3 การจ้างงานท้องถิ่น</text>
<text x="198.0" y="130.0" text-anchor="end" font-size="13" fill="#15211e" font-weight="bold">A1 ขุดหน้าดิน</text>
<rect x="210.0" y="90.0" width="160.0" height="70.0" rx="0" fill="#ffffff" stroke="#15211e" stroke-width="1.5"/>
<text x="290.0" y="120.0" text-anchor="middle" font-size="14" fill="#15211e">m = -6</text>
<text x="290.0" y="142.0" text-anchor="middle" font-size="14" fill="#15211e">i = 8</text>
<rect x="370.0" y="90.0" width="160.0" height="70.0" rx="0" fill="#ffffff" stroke="#15211e" stroke-width="1.5"/>
<text x="450.0" y="120.0" text-anchor="middle" font-size="14" fill="#15211e">m = -7</text>
<text x="450.0" y="142.0" text-anchor="middle" font-size="14" fill="#15211e">i = 9</text>
<rect x="530.0" y="90.0" width="160.0" height="70.0" rx="0" fill="#ffffff" stroke="#15211e" stroke-width="1.5"/>
<text x="610.0" y="120.0" text-anchor="middle" font-size="14" fill="#15211e">m = +3</text>
<text x="610.0" y="142.0" text-anchor="middle" font-size="14" fill="#15211e">i = 6</text>
<text x="198.0" y="200.0" text-anchor="end" font-size="13" fill="#15211e" font-weight="bold">A2 ขนส่งแร่</text>
<rect x="210.0" y="160.0" width="160.0" height="70.0" rx="0" fill="#ffffff" stroke="#15211e" stroke-width="1.5"/>
<text x="290.0" y="190.0" text-anchor="middle" font-size="14" fill="#15211e">m = -4</text>
<text x="290.0" y="212.0" text-anchor="middle" font-size="14" fill="#15211e">i = 5</text>
<rect x="370.0" y="160.0" width="160.0" height="70.0" rx="0" fill="#ffffff" stroke="#15211e" stroke-width="1.5"/>
<text x="450.0" y="190.0" text-anchor="middle" font-size="14" fill="#15211e">m = -2</text>
<text x="450.0" y="212.0" text-anchor="middle" font-size="14" fill="#15211e">i = 4</text>
<rect x="530.0" y="160.0" width="160.0" height="70.0" rx="0" fill="#ffffff" stroke="#15211e" stroke-width="1.5"/>
<text x="610.0" y="190.0" text-anchor="middle" font-size="14" fill="#15211e">m = +2</text>
<text x="610.0" y="212.0" text-anchor="middle" font-size="14" fill="#15211e">i = 3</text>
<text x="198.0" y="270.0" text-anchor="end" font-size="13" fill="#15211e" font-weight="bold">A3 ปลูกป่าฟื้นฟู</text>
<rect x="210.0" y="230.0" width="160.0" height="70.0" rx="0" fill="#ffffff" stroke="#15211e" stroke-width="1.5"/>
<text x="290.0" y="260.0" text-anchor="middle" font-size="14" fill="#15211e">m = +2</text>
<text x="290.0" y="282.0" text-anchor="middle" font-size="14" fill="#15211e">i = 6</text>
<rect x="370.0" y="230.0" width="160.0" height="70.0" rx="0" fill="#ffffff" stroke="#15211e" stroke-width="1.5"/>
<text x="450.0" y="260.0" text-anchor="middle" font-size="14" fill="#15211e">m = +4</text>
<text x="450.0" y="282.0" text-anchor="middle" font-size="14" fill="#15211e">i = 7</text>
<rect x="530.0" y="230.0" width="160.0" height="70.0" rx="0" fill="#ffffff" stroke="#15211e" stroke-width="1.5"/>
<text x="610.0" y="260.0" text-anchor="middle" font-size="14" fill="#15211e">m = +5</text>
<text x="610.0" y="282.0" text-anchor="middle" font-size="14" fill="#15211e">i = 8</text>
<text x="360.0" y="336.0" text-anchor="middle" font-size="12" fill="#555555">คะแนนของแต่ละช่องคือ m × i ค่า m บอกทิศทางและขนาด (+ เป็นผลดี − เป็นผลเสีย)</text>
<text x="360.0" y="358.0" text-anchor="middle" font-size="12" fill="#555555">ข้อมูลเป็นค่าสมมติเพื่อการฝึกคำนวณเท่านั้น</text>
</svg>
