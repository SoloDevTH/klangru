  - id: math.frac.p020
    topics: [math.number.fractions]
    difficulty: 5
    type: numeric
    stem: "แท็งก์น้ำบนหลังคาบ้านมีท่อเติมน้ำสองท่อ ถ้าเปิดท่อ A ท่อเดียว น้ำเต็มแท็งก์ใน 3 ชั่วโมง ถ้าเปิดท่อ B ท่อเดียว เต็มใน 6 ชั่วโมง ถ้าเปิดทั้งสองท่อพร้อมกันตั้งแต่แท็งก์ว่าง น้ำจะเต็มในกี่ชั่วโมง (ตอบในหน่วยชั่วโมง)"
    answer: { value: 2, unit: ชั่วโมง }
    hints:
      - "ใน 1 ชั่วโมง ท่อ A เติมได้ $\\tfrac{1}{3}$ ของแท็งก์ ท่อ B เติมได้เท่าใด"
      - "เปิดพร้อมกัน 1 ชั่วโมงได้ $\\tfrac{1}{3} + \\tfrac{1}{6}$ ของแท็งก์"
      - "ถ้าชั่วโมงละ $\\tfrac{1}{n}$ ของแท็งก์ จะเต็มใน $n$ ชั่วโมง"
    misconceptions:
      - { match: 4.5, feedback: "นั่นคือค่าเฉลี่ยของ 3 กับ 6 แต่สองท่อช่วยกันต้องเร็วกว่าท่อที่เร็วที่สุด (3 ชั่วโมง)" }
      - { match: 9, feedback: "บวกเวลา $3 + 6$ ไม่ได้ การเปิดสองท่อต้องเต็มเร็วขึ้น ให้บวกอัตราการเติมต่อชั่วโมงแทน" }
    solution: "ต่อชั่วโมง: $\\tfrac{1}{3} + \\tfrac{1}{6} = \\tfrac{2}{6} + \\tfrac{1}{6} = \\tfrac{3}{6} = \\tfrac{1}{2}$ ของแท็งก์ จึงเต็มใน 2 ชั่วโมง ตรวจ: ใน 2 ชั่วโมง A เติม $\\tfrac{2}{3}$ B เติม $\\tfrac{1}{3}$ รวมเต็มแท็งก์พอดี ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.frac.p021
    topics: [math.number.fractions]
    difficulty: 2
    type: text
    stem: "เหลือพิซซ่า $\\tfrac{1}{3}$ ถาด พี่น้อง 2 คนแบ่งกันเท่า ๆ กัน แต่ละคนได้พิซซ่ากี่ถาด (พิมพ์ในรูป a/b)"
    accepted: ["1/6"]
    hints:
      - "แบ่ง 2 คนเท่า ๆ กัน คือหาร $\\tfrac{1}{3}$ ด้วย 2"
      - "ตัดชิ้น $\\tfrac{1}{3}$ ถาดออกเป็น 2 ชิ้นเท่ากัน ทั้งถาดจะมีชิ้นขนาดนี้กี่ชิ้น"
    misconceptions:
      - { match: "2/3", feedback: "$\\tfrac{2}{3}$ คือคูณ 2 แต่การแบ่งให้ 2 คนทำให้แต่ละคนได้น้อยลง ต้องหาร" }
      - { match: "1/5", feedback: "ดูเหมือนบวก 2 เข้ากับตัวส่วน $\\tfrac{1}{3} \\div 2 = \\tfrac{1}{3} \\times \\tfrac{1}{2}$ ตัวส่วนต้องคูณ 2" }
    solution: "$\\tfrac{1}{3} \\div 2 = \\tfrac{1}{3} \\times \\tfrac{1}{2} = \\tfrac{1}{6}$ ถาด ตรวจ: สองคนได้ $\\tfrac{1}{6} \\times 2 = \\tfrac{2}{6} = \\tfrac{1}{3}$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true
