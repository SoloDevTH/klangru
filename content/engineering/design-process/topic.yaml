id: engineering.design.design-process
subject: engineering
title: { th: การออกแบบเชิงวิศวกรรมขั้นสูง, en: Engineering design process (advanced) }
summary: แปลงความต้องการเป็นข้อกำหนดที่วัดได้ แยกเกณฑ์กับข้อจำกัด แตกปัญหาย่อย สร้างทางเลือก เมทริกซ์ตัดสินใจถ่วงน้ำหนัก การแลกได้แลกเสีย FMEA แบบจำลอง และการทดสอบต้นแบบ
difficulty: 5
minutes: 40
prerequisites: [technology.design.design-process, physics.units.measurement, math.stats.data-display]
encompasses:
  - { id: technology.design.design-process, weight: 0.4 }
  - { id: math.stats.data-display, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: การออกแบบเป็นกระบวนการวนซ้ำ
    src: design-cycle.svg
    alt: "แผนภาพวงกลมหกกล่องเชื่อมด้วยลูกศรตามเข็มนาฬิกา 1 นิยามปัญหาและความต้องการ 2 เกณฑ์ ข้อจำกัด และข้อกำหนด 3 สร้างทางเลือกหลายแบบ 4 วิเคราะห์และเลือกแบบ 5 สร้างและทดสอบต้นแบบ 6 ประเมินผลและปรับปรุง แล้วลูกศรสีส้มวนกลับไปขั้นที่ 1 ตรงกลางเขียนว่าวนซ้ำจนผ่านเกณฑ์ แล้วจึงสื่อสารและส่งมอบแบบ และย้อนกลับไปขั้นใดก็ได้เมื่อพบปัญหา"
  - { type: check, problem: engineering.design.design-process.p001, prompt: "ข้อจำกัดคือเงื่อนไขที่ต้องผ่านแน่นอน" }
  - type: worked-example
    title: เมทริกซ์ตัดสินใจสำหรับตู้อบกล้วยตาก
    problem: "กลุ่มแม่บ้านทำกล้วยตากในจังหวัดพิษณุโลก (ข้อมูลสมมติ) เลือกตู้อบแห้งพลังแสงอาทิตย์สามแบบ เกณฑ์และน้ำหนักคือ อัตราการอบแห้ง 0.4 ต้นทุน 0.3 การดูแลรักษา 0.2 สุขอนามัย 0.1 คะแนน 1–5 (5 ดีที่สุด) แบบ A: 4, 3, 4, 3 แบบ B: 5, 2, 3, 5 แบบ C: 3, 5, 5, 3 ควรเลือกแบบใด"
    steps:
      - text: "ตรวจว่าน้ำหนักรวมเป็น 1: $0.4 + 0.3 + 0.2 + 0.1 = 1$"
      - text: "A: $0.4(4) + 0.3(3) + 0.2(4) + 0.1(3) = 1.6 + 0.9 + 0.8 + 0.3 = 3.6$"
      - text: "B: $0.4(5) + 0.3(2) + 0.2(3) + 0.1(5) = 2.0 + 0.6 + 0.6 + 0.5 = 3.7$"
      - text: "C: $0.4(3) + 0.3(5) + 0.2(5) + 0.1(3) = 1.2 + 1.5 + 1.0 + 0.3 = 4.0$"
        why: "C อบช้ากว่า B แต่ถูกและดูแลง่ายกว่ามาก เมื่อถ่วงน้ำหนักแล้วจึงชนะ"
      - text: "ทำการวิเคราะห์ความไว: ถ้ากลุ่มให้ความสำคัญกับอัตราการอบมากขึ้นเป็น 0.6 และลดต้นทุนเหลือ 0.1 B ได้ $3.0 + 0.2 + 0.6 + 0.5 = 4.3$ ส่วน C ได้ $1.8 + 0.5 + 1.0 + 0.3 = 3.6$ ผลจะกลับกัน"
        why: "น้ำหนักสะท้อนความต้องการของผู้ใช้ ต้องคุยกับผู้ใช้ก่อนสรุป"
    answer: "ด้วยน้ำหนักเดิม เลือกแบบ C (คะแนน 4.0) แต่ผลไวต่อน้ำหนักของอัตราการอบ"
  - type: figure
    title: แบบจำลองถังเก็บน้ำฝนในตารางคำนวณ
    src: tank-model.svg
    alt: "กราฟแท่งและเส้นสามเดือน แท่งสีฟ้าคือน้ำฝนที่รองได้ 6.4, 3.2 และ 12.8 ลูกบาศก์เมตร เส้นประสีส้มคือความต้องการใช้น้ำคงที่ 6 ลูกบาศก์เมตรต่อเดือน เส้นทึบสีเขียวคือระดับน้ำในถังปลายเดือน 0.4, 0 และ 6.8 ลูกบาศก์เมตร เส้นประแนวนอนสีเทาบอกความจุถัง 8 ลูกบาศก์เมตร เดือนที่สองมีป้ายขาดน้ำ 2.4 ลูกบาศก์เมตร"
  - type: worked-example
    title: จำลองระดับน้ำในถังเก็บน้ำฝน
    problem: "โรงเรียนแห่งหนึ่งในจังหวัดบุรีรัมย์ (ข้อมูลสมมติ) มีหลังคา $80\\ \\mathrm{m^2}$ สัมประสิทธิ์น้ำท่า 0.8 ถังจุ $8\\ \\mathrm{m^3}$ เริ่มจากถังว่าง ใช้น้ำเดือนละ $6\\ \\mathrm{m^3}$ ฝนสามเดือนเป็น $100$, $50$, $200\\ \\mathrm{mm}$ จะขาดน้ำรวมเท่าใด"
    steps:
      - text: "น้ำที่รองได้ = พื้นที่ × ความลึกฝน (เมตร) × 0.8 ได้ $6.4$, $3.2$, $12.8\\ \\mathrm{m^3}$"
        why: "ฝน $100\\ \\mathrm{mm} = 0.1\\ \\mathrm{m}$ ตก $80\\ \\mathrm{m^2}$ ได้ $8\\ \\mathrm{m^3}$ แต่ส่วนหนึ่งระเหยหรือกระเด็น จึงคูณ 0.8"
      - text: "เดือน 1: $0 + 6.4 - 6 = 0.4\\ \\mathrm{m^3}$"
      - text: "เดือน 2: $0.4 + 3.2 - 6 = -2.4$ ระดับน้ำติดลบไม่ได้ จึงเหลือ 0 และขาดน้ำ $2.4\\ \\mathrm{m^3}$"
      - text: "เดือน 3: $0 + 12.8 - 6 = 6.8\\ \\mathrm{m^3}$ ไม่เกินความจุ $8\\ \\mathrm{m^3}$ จึงไม่ล้น"
        why: "ถ้าผลเกินความจุ ส่วนเกินล้นทิ้ง ระดับน้ำเท่ากับความจุ"
    answer: "ขาดน้ำรวม $2.4\\ \\mathrm{m^3}$ ในเดือนที่ 2 การเพิ่มขนาดถังไม่ช่วย เพราะเดือนแรกเหลือน้ำเพียง $0.4\\ \\mathrm{m^3}$ ต้องเพิ่มพื้นที่รองน้ำหรือลดการใช้"
  - { type: check, problem: engineering.design.design-process.p006, prompt: "คูณคะแนนกับน้ำหนักทีละเกณฑ์ แล้วบวก" }
  - type: figure
    title: ตัวอย่างผังมอร์โฟโลยี
    src: morph-chart.svg
    alt: "ตารางสามแถวของระบบกรองน้ำในหมู่บ้าน แถวแรกฟังก์ชันสูบน้ำ มีสามวิธี คือ ปั๊มไฟฟ้า ปั๊มพลังแสงอาทิตย์ และปั๊มมือ แถวที่สองฟังก์ชันกรอง มีสองวิธี คือ กรองทรายช้า และไส้กรองเซรามิก แถวที่สามฟังก์ชันฆ่าเชื้อ มีสองวิธี คือ คลอรีน และหลอด UV เส้นสีส้มเชื่อมปั๊มพลังแสงอาทิตย์ กรองทรายช้า และหลอด UV เป็นตัวอย่างทางเลือกหนึ่งแบบ"
glossary:
  - { term: ข้อกำหนดทางวิศวกรรม, definition: "ความต้องการที่เขียนเป็นตัวเลขพร้อมหน่วยและวิธีวัด ใช้ตรวจว่าแบบผ่านหรือไม่ (engineering specification)" }
  - { term: เกณฑ์, definition: "คุณลักษณะที่ใช้ให้คะแนนเปรียบเทียบทางเลือก ยิ่งมากหรือยิ่งน้อยยิ่งดี (criteria)" }
  - { term: ข้อจำกัด, definition: "เงื่อนไขที่ทางเลือกต้องผ่านแน่นอน เช่น งบประมาณ กฎหมาย มาตรฐานความปลอดภัย (constraint)" }
  - { term: เมทริกซ์ตัดสินใจถ่วงน้ำหนัก, definition: "ตารางที่คูณคะแนนแต่ละเกณฑ์ด้วยน้ำหนักแล้วรวม เพื่อเลือกทางเลือก (weighted decision matrix)" }
  - { term: การแลกได้แลกเสีย, definition: "การยอมเสียคุณลักษณะหนึ่งเพื่อได้อีกคุณลักษณะหนึ่ง (trade-off)" }
  - { term: FMEA, definition: "การวิเคราะห์รูปแบบความล้มเหลวและผลกระทบ จัดลำดับด้วย RPN = S × O × D" }
flashcards:
  - { front: "เกณฑ์กับข้อจำกัดต่างกันอย่างไร", back: "เกณฑ์ใช้ให้คะแนนเปรียบเทียบ ข้อจำกัดต้องผ่านแน่นอน ไม่ผ่านตัดทิ้ง" }
  - { front: "คะแนนรวมของเมทริกซ์ถ่วงน้ำหนัก", back: "$\\sum w_i s_i$ โดยน้ำหนักรวมกันเป็น 1" }
  - { front: "ปรับสเกลเกณฑ์ที่ยิ่งน้อยยิ่งดี (เช่น ราคา)", back: "$10 \\times x_{\\min}/x$" }
  - { front: "RPN ใน FMEA", back: "ความรุนแรง × โอกาสเกิด × ความยากในการตรวจพบ" }
  - { front: "ทางเลือก A ครอบงำ B เมื่อใด", back: "A ไม่แย่กว่า B ทุกเกณฑ์ และดีกว่าอย่างน้อยหนึ่งเกณฑ์" }
