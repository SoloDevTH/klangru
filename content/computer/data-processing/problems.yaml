      - { match: 1, feedback: "เป็นขนาดของค่าเฉลี่ยแบบคิดเครื่องหมาย ต้องหาค่าสัมบูรณ์ของแต่ละวันก่อนแล้วจึงหาค่าเฉลี่ย" }
