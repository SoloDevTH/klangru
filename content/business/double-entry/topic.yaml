id: business.accounting.double-entry
subject: business
title: { th: "การบันทึกบัญชีคู่: เดบิต เครดิต สมุดรายวันและบัญชีแยกประเภท", en: "Double-entry bookkeeping: debits, credits, the journal and the ledger" }
summary: ผังบัญชี หลักเดบิตเครดิต การบันทึกรายการค้าในสมุดรายวันทั่วไป การผ่านรายการไปบัญชีแยกประเภท งบทดลอง และข้อผิดพลาดที่งบทดลองหาไม่พบ
difficulty: 4.5
minutes: 40
prerequisites: [business.accounting.equation]
encompasses:
  - { id: business.accounting.equation, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: debit-credit-rules.svg
    alt: "บัญชีรูปตัวทีหกบัญชี ด้านซ้ายคือเดบิต ด้านขวาคือเครดิต แถวบนคือสินทรัพย์ ค่าใช้จ่าย และถอนใช้ส่วนตัว ด้านเดบิตเขียนว่าเพิ่ม ด้านเครดิตเขียนว่าลด แถวล่างคือหนี้สิน ทุน และรายได้ ด้านเดบิตเขียนว่าลด ด้านเครดิตเขียนว่าเพิ่ม ใต้ภาพเขียนว่ายอดคงเหลือปกติอยู่ด้านที่เพิ่ม"
    caption: "หลักเดบิตและเครดิตของบัญชีหกประเภท"
  - { type: check, problem: business.accounting.double-entry.p004, prompt: "ลองบันทึกรายการก่อนดูตัวอย่าง" }
  - type: worked-example
    title: บันทึกและผ่านรายการของร้านซ่อมคอมพิวเตอร์
    problem: "ร้านซ่อมคอมพิวเตอร์ของต้น (สมมติ) วันที่ 1 มีนาคม ต้นนำเงินสดมาลงทุน $80{,}000$ บาท วันที่ 3 ซื้ออุปกรณ์ซ่อมด้วยเงินสด $25{,}000$ บาท บันทึกในสมุดรายวันทั่วไปและผ่านรายการไปบัญชีเงินสด"
    steps:
      - text: "วิเคราะห์วันที่ 1: เงินสด (สินทรัพย์) เพิ่ม → เดบิต ทุน (ส่วนของเจ้าของ) เพิ่ม → เครดิต"
      - text: "วิเคราะห์วันที่ 3: อุปกรณ์ (สินทรัพย์) เพิ่ม → เดบิต เงินสด (สินทรัพย์) ลด → เครดิต"
        why: "สินทรัพย์สองชนิดเปลี่ยนรูปกัน ยอดรวมสินทรัพย์จึงเท่าเดิม แต่ยังต้องบันทึกทั้งสองบัญชี"
      - text: "เขียนในสมุดรายวัน: บัญชีเดบิตชิดซ้าย บัญชีเครดิตย่อหน้า ตามด้วยคำอธิบายรายการ (ดูภาพหน้าสมุดรายวัน)"
      - text: "ผ่านรายการ: บัญชีเงินสดด้านเดบิตใส่ \"มี.ค. 1 ทุน ร.ว.1 $80{,}000$\" ด้านเครดิตใส่ \"มี.ค. 3 อุปกรณ์ ร.ว.1 $25{,}000$\""
        why: "ช่องรายการในบัญชีแยกประเภทเขียนชื่อบัญชีคู่ตรงข้าม เพื่อให้ย้อนดูได้ว่าเงินมาจากไหนหรือไปไหน"
      - text: "ยอดคงเหลือเงินสด $= 80{,}000 - 25{,}000 = 55{,}000$ บาท ด้านเดบิต และใส่เลขที่บัญชี 101 กลับในสมุดรายวันเพื่อแสดงว่าผ่านรายการแล้ว"
    answer: "Dr. เงินสด $80{,}000$ / Cr. ทุน $80{,}000$ และ Dr. อุปกรณ์ $25{,}000$ / Cr. เงินสด $25{,}000$ ยอดเงินสดคงเหลือ $55{,}000$ บาท (เดบิต)"
  - type: figure
    src: journal-page.svg
    alt: "ตารางสมุดรายวันทั่วไปหน้า 1 ห้าคอลัมน์ วันที่ รายการ เลขที่บัญชี เดบิต เครดิต รายการแรกวันที่ 1 มีนาคม เงินสด 101 เดบิต 80,000 บรรทัดถัดไปย่อหน้า ทุน – นายต้น 301 เครดิต 80,000 แล้วคำอธิบาย นำเงินสดมาลงทุน รายการที่สองวันที่ 3 อุปกรณ์ 104 เดบิต 25,000 บรรทัดย่อหน้า เงินสด 101 เครดิต 25,000 แล้วคำอธิบาย ซื้ออุปกรณ์ซ่อมด้วยเงินสด"
    caption: "รูปแบบการบันทึกในสมุดรายวันทั่วไป"
  - { type: check, problem: business.accounting.double-entry.p006, prompt: "หายอดคงเหลือจากบัญชีแยกประเภท" }
glossary:
  - { term: ระบบบัญชีคู่, definition: "การบันทึกรายการค้าทุกรายการอย่างน้อยสองบัญชี ให้ยอดเดบิตเท่ากับยอดเครดิตเสมอ" }
  - { term: เดบิต, definition: "ด้านซ้ายของบัญชี ใช้บันทึกการเพิ่มของสินทรัพย์ ค่าใช้จ่าย และถอนใช้ส่วนตัว และการลดของหนี้สิน ทุน และรายได้" }
  - { term: เครดิต, definition: "ด้านขวาของบัญชี ใช้บันทึกการเพิ่มของหนี้สิน ทุน และรายได้ และการลดของสินทรัพย์ ค่าใช้จ่าย และถอนใช้ส่วนตัว" }
  - { term: ผังบัญชี, definition: "รายชื่อบัญชีทั้งหมดของกิจการพร้อมเลขที่บัญชี จัดเป็นหมวดสินทรัพย์ หนี้สิน ส่วนของเจ้าของ รายได้ และค่าใช้จ่าย" }
  - { term: สมุดรายวันทั่วไป, definition: "สมุดบันทึกรายการขั้นต้น บันทึกรายการค้าตามลำดับวันที่ในรูปเดบิตและเครดิต" }
  - { term: บัญชีแยกประเภท, definition: "สมุดบันทึกรายการขั้นปลาย แยกหน้าละบัญชี รวบรวมรายการของบัญชีเดียวกันเพื่อหายอดคงเหลือ" }
  - { term: งบทดลอง, definition: "รายการยอดคงเหลือของทุกบัญชี ณ วันหนึ่ง ใช้ตรวจว่ายอดเดบิตรวมเท่ากับยอดเครดิตรวม" }
flashcards:
  - { front: "บัญชีใดเพิ่มทางเดบิต", back: "สินทรัพย์ ค่าใช้จ่าย ถอนใช้ส่วนตัว" }
  - { front: "บัญชีใดเพิ่มทางเครดิต", back: "หนี้สิน ทุน รายได้" }
  - { front: "ให้บริการเป็นเงินเชื่อ บันทึกอย่างไร", back: "Dr. ลูกหนี้การค้า / Cr. รายได้ค่าบริการ" }
  - { front: "ขั้นตอนบันทึกบัญชี", back: "วิเคราะห์รายการ → สมุดรายวัน → บัญชีแยกประเภท → ยอดคงเหลือ → งบทดลอง" }
  - { front: "งบทดลองเท่ากันแต่ยังผิดได้ เช่น", back: "ลืมทั้งรายการ ผิดบัญชีแต่ถูกด้าน จำนวนผิดเท่ากันสองด้าน สลับเดบิตเครดิตทั้งรายการ ข้อผิดพลาดหักล้างกัน" }
