problems:
  - id: biology.ecology.ecosystems.p001
    topics: [biology.ecology.ecosystems]
    difficulty: 1
    type: text
    stem: "กระบวนการที่ไรโซเบียมในปมรากถั่วเปลี่ยนแก๊ส N₂ เป็นแอมโมเนียมเรียกว่าอะไร"
    accepted: ["การตรึงไนโตรเจน", "ตรึงไนโตรเจน", "nitrogen fixation"]
    misconceptions:
      - { match: "ไนตริฟิเคชัน", feedback: "ไนตริฟิเคชันเปลี่ยนแอมโมเนียมเป็นไนไตรต์และไนเตรต ไม่ได้ใช้ N₂" }
      - { match: "ดีไนตริฟิเคชัน", feedback: "ดีไนตริฟิเคชันเปลี่ยนไนเตรตกลับเป็น N₂ ทิศตรงข้าม" }
    hints:
      - "N₂ ในอากาศเฉื่อย ต้องถูก 'จับ' ไว้ในสารประกอบ"
      - "ชื่อกระบวนการบอกว่า N₂ ถูกตรึงไว้"
    solution: "การตรึงไนโตรเจน คือการเปลี่ยน N₂ เป็นสารประกอบไนโตรเจน เช่น แอมโมเนียม ที่พืชนำไปใช้ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.ecosystems.p002
    topics: [biology.ecology.ecosystems]
    difficulty: 1
    type: mcq
    stem: "พีระมิดนิเวศแบบใดมีฐานกว้างที่สุดเสมอ ไม่มีทางกลับหัว"
    choices:
      - { id: a, text: "พีระมิดพลังงาน", correct: true }
      - { id: b, text: "พีระมิดจำนวน", feedback: "ต้นไม้ใหญ่หนึ่งต้นเลี้ยงแมลงได้หลายพันตัว พีระมิดจำนวนจึงกลับหัวได้" }
      - { id: c, text: "พีระมิดมวลชีวภาพ", feedback: "ในทะเลบางแห่งมวลของแพลงก์ตอนพืชน้อยกว่าแพลงก์ตอนสัตว์ ณ เวลาที่เก็บตัวอย่าง" }
      - { id: d, text: "กลับหัวได้ทุกแบบ", feedback: "พลังงานลดลงทุกครั้งที่ส่งต่อ พีระมิดพลังงานจึงกลับหัวไม่ได้" }
    hints:
      - "แบบใดวัดสิ่งที่ลดลงทุกครั้งที่ส่งต่อระหว่างลำดับขั้น"
      - "พลังงานสูญเสียเป็นความร้อนในทุกลำดับขั้น"
    solution: "พีระมิดพลังงานวัดพลังงานที่ไหลผ่านแต่ละลำดับขั้นต่อเวลา พลังงานลดลงทุกครั้งที่ส่งต่อ ฐานจึงกว้างที่สุดเสมอ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.ecosystems.p003
    topics: [biology.ecology.ecosystems]
    difficulty: 1
    type: match
    stem: "จับคู่ขั้นในวัฏจักรไนโตรเจนกับสิ่งที่เกิดขึ้น"
    pairs:
      - { left: "การตรึงไนโตรเจน", right: "N₂ เปลี่ยนเป็นแอมโมเนียม" }
      - { left: "ไนตริฟิเคชัน", right: "แอมโมเนียมเปลี่ยนเป็นไนไตรต์และไนเตรต" }
      - { left: "การดูดซึม", right: "พืชนำไนเตรตไปสร้างโปรตีน" }
      - { left: "การย่อยสลาย", right: "ซากและของเสียเปลี่ยนเป็นแอมโมเนียม" }
      - { left: "ดีไนตริฟิเคชัน", right: "ไนเตรตเปลี่ยนกลับเป็น N₂" }
    hints:
      - "ดูภาพวัฏจักรไนโตรเจน"
      - "คำว่า 'ดี' นำหน้าแปลว่าย้อนกลับ"
    solution: "ตรึงไนโตรเจน: N₂ → NH₄⁺ ไนตริฟิเคชัน: NH₄⁺ → NO₂⁻ → NO₃⁻ ดูดซึม: พืชใช้ไนเตรต ย่อยสลาย: ซาก → NH₄⁺ ดีไนตริฟิเคชัน: NO₃⁻ → N₂"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.ecosystems.p004
    topics: [biology.ecology.ecosystems]
    difficulty: 2
    type: numeric
    stem: "ป่าแห่งหนึ่งมีผลผลิตปฐมภูมิรวม 20,000 kJ/m²/ปี พืชใช้พลังงานในการหายใจ 12,000 kJ/m²/ปี ผลผลิตปฐมภูมิสุทธิเท่ากับกี่ kJ/m²/ปี"
    answer: { value: 8000, unit: "kJ/m²/ปี" }
    misconceptions:
      - { match: 32000, feedback: "ต้องหักพลังงานที่ใช้หายใจออก ไม่ใช่บวกเพิ่ม" }
      - { match: 20000, feedback: "20,000 คือ GPP ยังไม่ได้หักพลังงานที่พืชใช้หายใจ" }
    hints:
      - "NPP = GPP − R"
      - "R คือพลังงานที่ผู้ผลิตใช้หายใจ"
    solution: "$\\mathrm{NPP} = 20{,}000 - 12{,}000 = 8{,}000$ kJ/m²/ปี เป็นพลังงานที่สะสมในมวลพืชและผู้บริโภคนำไปใช้ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.ecosystems.p005
    topics: [biology.ecology.ecosystems]
    difficulty: 2
    type: order
    stem: "เรียงระดับการจัดระบบทางนิเวศวิทยาจากเล็กไปใหญ่"
    items:
      - "ปลานิลหนึ่งตัว"
      - "ปลานิลทั้งหมดในบึง"
      - "ปลา พืชน้ำ และแพลงก์ตอนทุกชนิดในบึง"
      - "สิ่งมีชีวิตทั้งหมดในบึงรวมกับน้ำ แสง และดินก้นบึง"
      - "ทุกระบบนิเวศบนโลก"
    hints:
      - "ประชากรคือสิ่งมีชีวิตชนิดเดียวกัน กลุ่มสิ่งมีชีวิตคือหลายชนิด"
      - "ระบบนิเวศรวมปัจจัยทางกายภาพด้วย"
    solution: "สิ่งมีชีวิตหนึ่งตัว → ประชากร → กลุ่มสิ่งมีชีวิต → ระบบนิเวศ → ไบโอสเฟียร์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.ecosystems.p006
    topics: [biology.ecology.ecosystems]
    difficulty: 2
    type: mcq
    stem: "วัฏจักรฟอสฟอรัสต่างจากวัฏจักรคาร์บอนและไนโตรเจนอย่างไร"
    choices:
      - { id: a, text: "ฟอสฟอรัสแทบไม่มีสถานะแก๊สในวัฏจักร แหล่งสำคัญคือการผุพังของหิน", correct: true }
      - { id: b, text: "ฟอสฟอรัสมีมากที่สุดในบรรยากาศ", feedback: "ฟอสฟอรัสแทบไม่มีในบรรยากาศ ส่วนใหญ่อยู่ในหินและดิน" }
      - { id: c, text: "สิ่งมีชีวิตไม่ต้องใช้ฟอสฟอรัส", feedback: "ฟอสฟอรัสเป็นส่วนประกอบของ DNA ATP และเยื่อหุ้มเซลล์" }
      - { id: d, text: "ฟอสฟอรัสหมุนเวียนเร็วกว่าคาร์บอนมาก", feedback: "ฟอสฟอรัสที่ตกตะกอนเป็นหินต้องใช้เวลานานมากจึงกลับมา วัฏจักรจึงช้ามาก" }
    hints:
      - "CO₂ และ N₂ เป็นแก๊สในอากาศ ฟอสฟอรัสมีแก๊สแบบนี้หรือไม่"
      - "ฟอสเฟตมาจากไหน"
    solution: "วัฏจักรฟอสฟอรัสไม่มีสถานะแก๊สที่สำคัญ ฟอสเฟตมาจากการผุพังของหิน ผ่านสิ่งมีชีวิต แล้วตกตะกอนกลับเป็นหิน จึงหมุนเวียนช้ามาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.ecosystems.p007
    topics: [biology.ecology.ecosystems]
    difficulty: 2
    type: mcq
    stem: "นาข้าวที่มีน้ำขังตลอดฤดูปลูกปล่อยแก๊สมีเทนออกมามาก เพราะเหตุใด"
    choices:
      - { id: a, text: "ดินใต้น้ำขาดออกซิเจน จุลินทรีย์ย่อยสลายสารอินทรีย์แบบไม่ใช้ออกซิเจนจึงได้มีเทน", correct: true }
      - { id: b, text: "ต้นข้าวสังเคราะห์ด้วยแสงแล้วได้มีเทน", feedback: "การสังเคราะห์ด้วยแสงให้น้ำตาลและออกซิเจน ไม่ใช่มีเทน" }
      - { id: c, text: "น้ำในนาละลาย CO₂ แล้วกลายเป็นมีเทนเอง", feedback: "การเปลี่ยนเป็นมีเทนต้องอาศัยจุลินทรีย์ในสภาพขาดออกซิเจน" }
      - { id: d, text: "จุลินทรีย์ที่ใช้ออกซิเจนย่อยสลายฟางเร็วขึ้น", feedback: "ดินน้ำขังมีออกซิเจนน้อย การย่อยสลายแบบใช้ออกซิเจนให้ CO₂ ไม่ใช่มีเทน" }
    hints:
      - "น้ำขังทำให้ดินมีออกซิเจนมากหรือน้อย"
      - "การย่อยสลายแบบไม่ใช้ออกซิเจนให้ผลิตภัณฑ์ต่างจากแบบใช้ออกซิเจน"
    solution: "น้ำขังกั้นออกซิเจนไม่ให้ลงสู่ดิน จุลินทรีย์กลุ่มที่อยู่ได้โดยไม่ใช้ออกซิเจน รวมทั้งอาร์เคียที่สร้างมีเทน ย่อยสลายสารอินทรีย์แล้วได้มีเทน การปล่อยน้ำให้นาแห้งสลับเปียกเป็นช่วง ๆ จึงลดมีเทนได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.ecosystems.p008
    topics: [biology.ecology.ecosystems]
    difficulty: 3
    type: numeric
    stem: "ในบึงแห่งหนึ่ง ผู้บริโภคลำดับที่ 1 ได้รับพลังงาน 1,500 kJ/m²/ปี และผู้บริโภคลำดับที่ 2 ได้รับ 120 kJ/m²/ปี ประสิทธิภาพการถ่ายทอดพลังงานจากลำดับที่ 1 ไปลำดับที่ 2 เป็นร้อยละเท่าใด"
    answer: { value: 8, unit: "%" }
    misconceptions:
      - { match: 12.5, feedback: "หารกลับด้าน ต้องเอาลำดับบน (120) หารด้วยลำดับล่าง (1,500)" }
      - { match: 92, feedback: "92% คือส่วนที่สูญเสียไป โจทย์ถามส่วนที่ถ่ายทอดได้" }
    hints:
      - "ประสิทธิภาพ = พลังงานลำดับบน ÷ พลังงานลำดับล่าง × 100"
      - "ลำดับล่างในข้อนี้คือผู้บริโภคลำดับที่ 1"
    solution: "$\\frac{120}{1{,}500} \\times 100 = 8\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.ecosystems.p009
    topics: [biology.ecology.ecosystems]
    difficulty: 3
    type: numeric
    stem: "จากภาพงบคาร์บอนปี ค.ศ. 2022 ถ้าคิดจากคาร์บอนที่เข้าและออกจากบรรยากาศทั้ง 4 ลูกศร คาร์บอนในบรรยากาศควรเพิ่มขึ้นกี่ GtC ต่อปี (ตอบทศนิยม 1 ตำแหน่ง)"
    figure: { src: carbon-budget.svg, alt: "กล่องบรรยากาศอยู่ตรงกลาง ลูกศรเข้าบรรยากาศจากเชื้อเพลิงฟอสซิลและซีเมนต์ 9.9 GtC ต่อปี และจากการเปลี่ยนการใช้ที่ดิน 1.2 GtC ต่อปี ลูกศรออกจากบรรยากาศไปยังมหาสมุทร 2.8 GtC ต่อปี และพืชบนบก 3.8 GtC ต่อปี กล่องบรรยากาศระบุค่าที่วัดได้ว่าเพิ่มขึ้น 4.6 GtC ต่อปี" }
    answer: { value: 4.5, unit: GtC, tolerance: 0.05 }
    misconceptions:
      - { match: 17.7, feedback: "บวกทุกค่า ต้องลบส่วนที่มหาสมุทรและพืชดูดซับออก" }
      - { match: 3.3, feedback: "ลืมนับคาร์บอนจากการเปลี่ยนการใช้ที่ดิน 1.2 GtC" }
    hints:
      - "เพิ่มขึ้น = เข้าบรรยากาศ − ออกจากบรรยากาศ"
      - "เข้า 9.9 + 1.2 ออก 2.8 + 3.8"
    solution: "$(9.9 + 1.2) - (2.8 + 3.8) = 11.1 - 6.6 = 4.5$ GtC ต่อปี ต่างจากค่าที่วัดได้ 4.6 GtC เพียง 0.1 GtC ซึ่งเป็นความไม่แน่นอนของการประมาณ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.ecosystems.p010
    topics: [biology.ecology.ecosystems]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "สวนส้มแห่งหนึ่งพบสารฆ่าแมลงที่สลายตัวยากสะสมในปลาและนกในแหล่งน้ำใกล้เคียง ข้อใดเป็นแนวทางลดไบโอแมกนิฟิเคชันที่เหมาะสม (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ใช้ศัตรูธรรมชาติ เช่น แตนเบียนและตัวห้ำ ร่วมกับการใช้สารเคมีเท่าที่จำเป็น", correct: true }
      - { id: b, text: "เปลี่ยนไปใช้สารที่สลายตัวได้เร็วและไม่สะสมในไขมัน", correct: true }
      - { id: c, text: "ทำแนวพืชกันชนริมน้ำเพื่อลดการชะสารลงแหล่งน้ำ", correct: true }
      - { id: d, text: "ฉีดพ่นสารเดิมให้บ่อยขึ้นแต่ใช้ความเข้มข้นต่ำลง", feedback: "สารที่สลายตัวยากยังสะสมได้ทุกครั้งที่พ่น ปริมาณรวมอาจไม่ลด" }
      - { id: e, text: "ฆ่านกที่กินปลาเพื่อไม่ให้สารพิษสะสม", feedback: "การฆ่าผู้ล่าไม่ได้แก้ต้นเหตุ และทำลายสมดุลของระบบนิเวศ" }
    hints:
      - "ไบโอแมกนิฟิเคชันเกิดกับสารที่สลายตัวยากและสะสมในไขมัน"
      - "แก้ที่ต้นเหตุ คือลดสารที่เข้าสู่โซ่อาหาร"
    solution: "ลดการใช้สารด้วยศัตรูธรรมชาติ เปลี่ยนเป็นสารที่สลายเร็ว และกั้นไม่ให้สารไหลลงน้ำ ล้วนลดสารที่เข้าสู่โซ่อาหาร ส่วนการพ่นบ่อยขึ้นยังสะสมสารเดิม และการฆ่าผู้ล่าไม่แก้ต้นเหตุ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.ecosystems.p011
    topics: [biology.ecology.ecosystems]
    difficulty: 3
    type: mcq
    stem: "ในทะเลเปิดแห่งหนึ่ง ณ วันที่เก็บตัวอย่าง มวลแห้งของแพลงก์ตอนพืชน้อยกว่าแพลงก์ตอนสัตว์ที่กินมัน แต่ระบบนิเวศยังอยู่ได้ เพราะเหตุใด"
    choices:
      - { id: a, text: "แพลงก์ตอนพืชแบ่งตัวเร็วมากและถูกกินเร็ว ตลอดทั้งปีจึงผลิตพลังงานได้มากกว่าแพลงก์ตอนสัตว์ แม้มวล ณ เวลาหนึ่งจะน้อย", correct: true }
      - { id: b, text: "แพลงก์ตอนสัตว์สังเคราะห์ด้วยแสงได้เอง", feedback: "แพลงก์ตอนสัตว์เป็นผู้บริโภค สังเคราะห์ด้วยแสงไม่ได้" }
      - { id: c, text: "พลังงานในทะเลถ่ายทอดได้ร้อยละ 100", feedback: "พลังงานสูญเสียทุกครั้งที่ส่งต่อในทุกระบบนิเวศ" }
      - { id: d, text: "การวัดผิดพลาด เพราะพีระมิดมวลชีวภาพต้องมีฐานกว้างเสมอ", feedback: "พีระมิดมวลชีวภาพกลับหัวได้จริง ฐานกว้างเสมอเฉพาะพีระมิดพลังงาน" }
    hints:
      - "มวลชีวภาพวัด ณ เวลาหนึ่ง ส่วนพลังงานวัดต่อเวลา"
      - "แพลงก์ตอนพืชมีอายุสั้นและแบ่งตัวเร็ว"
    solution: "มวลชีวภาพเป็นค่า ณ เวลาหนึ่ง แพลงก์ตอนพืชแบ่งตัวเร็วจนผลิตมวลใหม่ทดแทนส่วนที่ถูกกินได้ตลอด พลังงานที่ไหลผ่านแพลงก์ตอนพืชต่อปีจึงมากกว่าแพลงก์ตอนสัตว์ พีระมิดพลังงานยังมีฐานกว้าง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.ecosystems.p012
    topics: [biology.ecology.ecosystems]
    difficulty: 4
    type: numeric
    stem: "ปี ค.ศ. 2022 มนุษย์ปล่อยคาร์บอนรวม 11.1 GtC และคาร์บอนในบรรยากาศเพิ่มขึ้น 4.6 GtC คาร์บอนที่มนุษย์ปล่อยค้างอยู่ในบรรยากาศร้อยละเท่าใด (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 41.4, unit: "%", tolerance: 0.4 }
    misconceptions:
      - { match: 58.6, feedback: "58.6% คือส่วนที่มหาสมุทรและพืชดูดซับไว้ ไม่ใช่ส่วนที่ค้างในบรรยากาศ" }
      - { match: 46.5, feedback: "หารด้วยการปล่อยจากเชื้อเพลิงฟอสซิลอย่างเดียว (9.9) ต้องใช้การปล่อยรวม 11.1 GtC" }
    hints:
      - "ร้อยละ = ส่วนที่ค้างในบรรยากาศ ÷ ที่ปล่อยทั้งหมด × 100"
      - "$\\frac{4.6}{11.1} \\times 100$"
    solution: "$\\frac{4.6}{11.1} \\times 100 \\approx 41.4\\%$ ที่เหลือราวร้อยละ 59 ถูกมหาสมุทรและพืชบนบกดูดซับไว้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.ecosystems.p013
    topics: [biology.ecology.ecosystems]
    difficulty: 4
    type: mcq
    stem: "ชาวนาสองรายจัดการฟางข้าวต่างกัน รายแรกเผาฟางทิ้ง รายที่สองไถกลบฟางแล้วปล่อยให้ย่อยสลาย ข้อใดเปรียบเทียบผลต่อวัฏจักรสารได้ถูกต้องที่สุด"
    choices:
      - { id: a, text: "การเผาปล่อยคาร์บอนเป็น CO₂ ทันทีและไนโตรเจนส่วนมากหายไปกับควัน การไถกลบให้จุลินทรีย์คืนไนโตรเจนและธาตุอื่นสู่ดิน และเก็บคาร์บอนส่วนหนึ่งไว้ในดิน", correct: true }
      - { id: b, text: "ทั้งสองวิธีให้ผลเหมือนกันทุกประการ เพราะคาร์บอนกลับสู่บรรยากาศเหมือนกัน", feedback: "ความเร็วและปลายทางต่างกัน การเผายังทำให้ธาตุอาหารสูญหายและเกิดฝุ่น" }
      - { id: c, text: "การเผาเพิ่มไนโตรเจนในดินมากกว่า เพราะเถ้ามีไนโตรเจนสูง", feedback: "ไนโตรเจนในฟางส่วนใหญ่ออกไปกับควันขณะเผา เถ้าเหลือแร่ธาตุบางชนิด" }
      - { id: d, text: "การไถกลบไม่มีจุลินทรีย์มาเกี่ยวข้อง", feedback: "การย่อยสลายฟางในดินอาศัยแบคทีเรียและฟังไจเป็นหลัก" }
    hints:
      - "คิดทั้งวัฏจักรคาร์บอนและไนโตรเจน"
      - "การย่อยสลายโดยจุลินทรีย์ต่างจากการเผาอย่างไร"
    solution: "การเผาเปลี่ยนคาร์บอนเป็น CO₂ ทันที ไนโตรเจนและกำมะถันส่วนมากหายไปเป็นแก๊ส และเกิดฝุ่นละออง การไถกลบให้ผู้ย่อยสลายค่อย ๆ คืนธาตุอาหารสู่ดิน คาร์บอนส่วนหนึ่งกลายเป็นอินทรียวัตถุในดิน (แต่ถ้าน้ำขังก็อาจเกิดมีเทน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.ecosystems.p014
    topics: [biology.ecology.ecosystems]
    difficulty: 4
    type: numeric
    stem: "ผลผลิตปฐมภูมิสุทธิของทุ่งหญ้าเท่ากับ 50,000 kJ/m²/ปี ถ้าประสิทธิภาพการถ่ายทอดพลังงานเท่ากับร้อยละ 10 ทุกลำดับขั้น ผู้บริโภคลำดับที่ 3 ได้รับพลังงานกี่ kJ/m²/ปี"
    answer: { value: 50, unit: "kJ/m²/ปี" }
    misconceptions:
      - { match: 500, feedback: "500 คือพลังงานของผู้บริโภคลำดับที่ 2 ต้องคูณ 0.1 อีกหนึ่งครั้ง" }
      - { match: 5, feedback: "คูณ 0.1 สี่ครั้ง แต่จากผู้ผลิตถึงผู้บริโภคลำดับที่ 3 มีการส่งต่อเพียง 3 ครั้ง" }
    hints:
      - "นับจำนวนครั้งที่พลังงานส่งต่อจากผู้ผลิตถึงผู้บริโภคลำดับที่ 3"
      - "คูณด้วย 0.1 ทุกครั้งที่ส่งต่อ"
    solution: "ผู้ผลิต → ลำดับ 1 → ลำดับ 2 → ลำดับ 3 ส่งต่อ 3 ครั้ง $50{,}000 \\times 0.1^3 = 50$ kJ/m²/ปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.ecosystems.p015
    topics: [biology.ecology.ecosystems]
    difficulty: 4
    type: mcq
    stem: "นักเรียนทำปุ๋ยหมักจากเศษผักสองกอง กอง ก กลับกองทุก 3 วัน กอง ข ไม่กลับเลยและอัดแน่น หลังสองสัปดาห์ กอง ข มีกลิ่นเหม็นเน่าและย่อยช้ากว่า ข้อใดอธิบายได้ถูกต้องที่สุด"
    choices:
      - { id: a, text: "การกลับกองเติมออกซิเจน จุลินทรีย์ย่อยสลายแบบใช้ออกซิเจนได้เร็วและปล่อย CO₂ ส่วนกองที่อัดแน่นขาดออกซิเจน การย่อยแบบไม่ใช้ออกซิเจนช้ากว่าและได้แก๊สกลิ่นเหม็น เช่น ไฮโดรเจนซัลไฟด์", correct: true }
      - { id: b, text: "กอง ข ไม่มีจุลินทรีย์เลย", feedback: "กอง ข ยังย่อยและมีกลิ่น แสดงว่ามีจุลินทรีย์ แต่เป็นกลุ่มที่อยู่ได้โดยไม่ใช้ออกซิเจน" }
      - { id: c, text: "การกลับกองทำให้แสงเข้าไปช่วยจุลินทรีย์สังเคราะห์ด้วยแสง", feedback: "ผู้ย่อยสลายไม่ได้ใช้แสง การกลับกองช่วยเรื่องออกซิเจน" }
      - { id: d, text: "กอง ก ย่อยเร็วเพราะพลังงานจากผักหมุนเวียนกลับมาใช้ใหม่", feedback: "พลังงานไม่หมุนเวียน สิ่งที่หมุนเวียนคือธาตุ ความเร็วต่างกันเพราะออกซิเจน" }
    hints:
      - "การกลับกองเปลี่ยนปัจจัยอะไรในกองปุ๋ย"
      - "การย่อยสลายแบบใช้และไม่ใช้ออกซิเจนให้ผลิตภัณฑ์ต่างกัน"
    solution: "หลักฐานจากสองกองสนับสนุนว่า ออกซิเจนเร่งการย่อยสลายและให้ CO₂ กับน้ำ ส่วนสภาพขาดออกซิเจนทำให้ย่อยช้าและเกิดแก๊สกลิ่นเหม็น เช่น ไฮโดรเจนซัลไฟด์และมีเทน ธาตุหมุนเวียนกลับสู่ดินทั้งสองแบบ แต่ด้วยความเร็วและผลิตภัณฑ์ต่างกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.ecosystems.p016
    topics: [biology.ecology.ecosystems]
    difficulty: 5
    type: numeric
    stem: "ปี ค.ศ. 2022 คาร์บอนในบรรยากาศเพิ่มขึ้น 4.6 GtC ทำให้ CO₂ เพิ่มขึ้น 2.18 ppm ถ้าคาร์บอน 11.1 GtC ที่มนุษย์ปล่อยในปีนั้นค้างอยู่ในบรรยากาศทั้งหมด โดยไม่มีมหาสมุทรและพืชดูดซับ CO₂ จะเพิ่มขึ้นกี่ ppm (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 5.26, unit: ppm, tolerance: 0.05 }
    misconceptions:
      - { match: 2.18, feedback: "2.18 ppm เป็นค่าจริงที่มีการดูดซับแล้ว โจทย์ถามกรณีไม่มีการดูดซับ" }
      - { match: 23.42, feedback: "หารกลับด้าน 2.18 ÷ 4.6 คือ ppm ต่อ GtC ต้องนำไปคูณกับ 11.1 ไม่ใช่หาร" }
    hints:
      - "หาก่อนว่า 1 ppm เท่ากับคาร์บอนกี่ GtC: $4.6 \\div 2.18$"
      - "แล้วนำ 11.1 GtC หารด้วยค่านั้น"
    solution: "1 ppm ≈ $\\frac{4.6}{2.18} = 2.11$ GtC ถ้าคาร์บอน 11.1 GtC ค้างในบรรยากาศทั้งหมด CO₂ จะเพิ่ม $\\frac{11.1}{2.11} \\approx 5.26$ ppm แทนที่จะเป็น 2.18 ppm แสดงว่ามหาสมุทรและพืชช่วยชะลอการเพิ่มของ CO₂ ได้มาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.ecosystems.p017
    topics: [biology.ecology.ecosystems]
    difficulty: 5
    type: mcq
    stem: "นักเรียนปลูกถั่วเขียวในดินที่ฆ่าเชื้อแล้ว 3 กระถาง (ข้อมูลสมมติ) กระถาง 1 ไม่เติมอะไร ได้มวลแห้ง 2.1 g ไม่มีปมราก กระถาง 2 เติมไรโซเบียม ได้ 6.8 g ปมราก 35 ปม กระถาง 3 เติมปุ๋ยไนเตรต ได้ 7.0 g ปมราก 0 ปม ข้อสรุปใดได้รับการสนับสนุนจากข้อมูลมากที่สุด"
    choices:
      - { id: a, text: "ไนโตรเจนเป็นปัจจัยจำกัดการเติบโตในดินนี้ และไรโซเบียมในปมรากให้ไนโตรเจนแก่ถั่วได้เกือบเท่าปุ๋ยไนเตรต", correct: true }
      - { id: b, text: "ไรโซเบียมทำให้ถั่วสังเคราะห์ด้วยแสงได้มากขึ้นโดยตรง", feedback: "ข้อมูลไม่ได้วัดการสังเคราะห์ด้วยแสง และกระถาง 3 ที่ได้ไนเตรตแต่ไม่มีไรโซเบียมก็โตพอกัน" }
      - { id: c, text: "ปุ๋ยไนเตรตทำให้เกิดปมรากมากขึ้น", feedback: "กระถาง 3 ไม่มีปมราก เพราะดินฆ่าเชื้อแล้วและไม่ได้เติมไรโซเบียม" }
      - { id: d, text: "ถั่วเขียวตรึงไนโตรเจนได้เองโดยไม่ต้องมีแบคทีเรีย", feedback: "กระถาง 1 ไม่มีไรโซเบียมจึงไม่มีปมและโตน้อย แสดงว่าถั่วต้องอาศัยแบคทีเรีย" }
    hints:
      - "เทียบกระถาง 1 กับ 2 และ 1 กับ 3 แยกกัน"
      - "ไรโซเบียมกับปุ๋ยไนเตรตให้สิ่งเดียวกันแก่พืชคืออะไร"
    solution: "กระถาง 1 โตน้อยเมื่อขาดไนโตรเจน กระถาง 3 ที่ได้ไนเตรตโต 7.0 g แสดงว่าไนโตรเจนจำกัดการเติบโต กระถาง 2 ที่มีไรโซเบียมและปมรากโต 6.8 g ใกล้เคียงกัน จึงสนับสนุนว่าไรโซเบียมตรึงไนโตรเจนให้ถั่ว"
    license: CC-BY-SA-4.0
    ai_assisted: true
