  - id: health.consumer.product-safety.p017
    topics: [health.consumer.product-safety]
    difficulty: 5
    type: mcq
    stem: "แม่ให้มายด์เลือกซื้อน้ำผลไม้ให้น้อง มีสองแบบ แบบ ก มีกรอบ อย. และเลขที่ตรวจในเว็บไซต์ อย. แล้วตรงกับชื่อสินค้า ฉลากภาษาไทยครบ เหลือ 2 เดือนก่อนถึงวันควรบริโภคก่อน ราคา 15 บาท แบบ ข ถูกกว่า 5 บาท ฉลากเป็นภาษาต่างประเทศทั้งหมด ไม่มีกรอบ อย. ข้อใดเป็นการวิเคราะห์ที่ดีที่สุด"
    choices:
      - { id: a, text: "เลือกแบบ ก เพราะตรวจสอบได้ว่าขึ้นทะเบียนถูกต้อง อ่านส่วนประกอบและคำเตือนได้ และยังไม่ใกล้วันที่กำหนด แม้ราคาแพงกว่า", correct: true }
      - { id: b, text: "เลือกแบบ ข เพราะถูกกว่า และของนำเข้าดีกว่าเสมอ", feedback: "ของนำเข้าที่ขายในไทยต้องมีฉลากภาษาไทยและเลขสารบบอาหารเช่นกัน ของที่ไม่มีอาจลักลอบนำเข้า" }
      - { id: c, text: "เลือกแบบใดก็ได้ เพราะเป็นน้ำผลไม้เหมือนกัน", feedback: "ความปลอดภัยต่างกันมาก แบบ ข ตรวจสอบผู้ผลิตและส่วนประกอบไม่ได้" }
      - { id: d, text: "เลือกแบบ ข เพราะไม่มีกรอบ อย. แปลว่าไม่มีวัตถุกันเสีย", feedback: "กรอบ อย. ไม่เกี่ยวกับวัตถุกันเสีย การไม่มีกรอบแปลว่าตรวจสอบไม่ได้" }
    hints:
      - "เทียบทีละเรื่อง: เครื่องหมาย ฉลากภาษาไทย วันที่ ราคา"
      - "ราคาที่ถูกกว่าคุ้มกับความเสี่ยงหรือไม่"
    solution: "แบบ ก ผ่านการตรวจสอบเลข มีฉลากภาษาไทยให้อ่านส่วนประกอบ ข้อมูลผู้แพ้อาหาร และวันที่ได้ แบบ ข ไม่มีเครื่องหมายและฉลากภาษาไทย ตรวจสอบความปลอดภัยไม่ได้ การจ่ายเพิ่ม 5 บาทเพื่อความปลอดภัยของน้องจึงคุ้มกว่า"
