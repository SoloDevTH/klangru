  - id: health.movement.recreation.p014
    topics: [health.movement.recreation]
    difficulty: 4
    type: mcq
    stem: "ข้อใดแสดงการนำหลักนันทนาการไปปรับใช้ในชีวิตประจำวันอย่างเป็นระบบได้ดีที่สุด"
    choices:
      - { id: a, text: "เขียนตารางประจำวัน: ทำการบ้านหลังเลิกเรียน แล้วเล่นแบดมินตัน 1 ชั่วโมง วาดรูปก่อนนอน และจำกัดเวลาดูจอไม่เกินที่ตกลงกับผู้ปกครอง", correct: true }
      - { id: b, text: "เล่นเกมทุกครั้งที่ว่างโดยไม่จำกัดเวลา", feedback: "ไม่มีการวางแผน และเวลาหน้าจอที่มากเกินไปกระทบการนอนและสุขภาพ" }
      - { id: c, text: "เลิกทำกิจกรรมที่ชอบทั้งหมดเพื่ออ่านหนังสือเรียนอย่างเดียว", feedback: "นันทนาการช่วยลดความเครียดและทำให้เรียนได้ดีขึ้น ไม่ควรตัดออกทั้งหมด" }
      - { id: d, text: "ทำกิจกรรมตามที่เพื่อนชวนทุกครั้ง แม้จะไม่ชอบ", feedback: "นันทนาการต้องสมัครใจ และควรเลือกตามความสนใจของตนเอง" }
    hints:
      - "อย่างเป็นระบบ หมายถึงมีแผน มีลำดับ และมีขอบเขตเวลา"
      - "ต้องสมดุลทั้งหน้าที่และการพักผ่อน"
    solution: "การจัดตารางที่ทำหน้าที่ก่อน มีกิจกรรมทั้งแบบใช้แรงและนั่งพัก และกำหนดเวลาหน้าจอ เป็นการใช้หลักนันทนาการในชีวิตประจำวันอย่างเป็นระบบ"
