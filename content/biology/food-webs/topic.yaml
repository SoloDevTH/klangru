id: biology.ecology.food-webs
subject: biology
title: { th: ระบบนิเวศและการถ่ายทอดพลังงาน, en: "Ecosystems and energy transfer" }
summary: องค์ประกอบของระบบนิเวศ ความสัมพันธ์ระหว่างสิ่งมีชีวิต ผู้ผลิต ผู้บริโภค ผู้ย่อยสลาย สายใยอาหาร พลังงานที่ลดลงในแต่ละลำดับขั้น และการสะสมสารพิษในโซ่อาหาร
difficulty: 3.5
minutes: 45
prerequisites: [biology.ecology.adaptation-food-chains, biology.plants.photosynthesis-intro]
encompasses:
  - { id: biology.ecology.adaptation-food-chains, weight: 0.4 }
  - { id: biology.plants.photosynthesis-intro, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: สายใยอาหารในนาข้าว
    src: rice-field-web.svg
    alt: "สายใยอาหารในนาข้าว ลูกศรชี้จากผู้ถูกกินไปยังผู้กิน ข้าวถูกกินโดยเพลี้ยกระโดด ตั๊กแตน และหนูนา เพลี้ยกระโดดถูกกินโดยแมงมุม ตั๊กแตนถูกกินโดยแมงมุมและกบ แมงมุมถูกกินโดยกบ กบถูกกินโดยงูและนกกระยาง หนูนาถูกกินโดยงูและเหยี่ยว งูถูกกินโดยเหยี่ยว"
    caption: "สัตว์ตัวเดียวอาจอยู่หลายลำดับขั้น เช่น กบ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: นับโซ่อาหารที่ผ่านสิ่งมีชีวิตหนึ่ง
    problem: "จากสายใยอาหารในนาข้าว มีโซ่อาหารที่ผ่านแมงมุมกี่สาย"
    steps:
      - text: "เส้นทางจากข้าวมาถึงแมงมุมมี 2 ทาง คือ ผ่านเพลี้ยกระโดด และผ่านตั๊กแตน"
      - text: "แมงมุมถูกกบกินทางเดียว จากกบไปถึงปลายโซ่มี 2 ทาง คือ กบ → นกกระยาง และ กบ → งู → เหยี่ยว"
      - text: "จำนวนโซ่ = ทางเข้า × ทางออก = $2 \\times 2 = 4$ สาย"
        why: "ทางเข้าแต่ละทางต่อกับทางออกได้ทุกทาง จึงใช้การคูณ"
    answer: "4 สาย"
  - { type: check, problem: biology.ecology.food-webs.p007, prompt: "ไล่ทุกเส้นทางจากข้าวไปจนสุดโซ่ แล้วจดไว้ไม่ให้ซ้ำ" }
  - type: figure
    title: พีระมิดพลังงาน
    src: energy-pyramid.svg
    alt: "พีระมิดพลังงาน 4 ชั้น ฐานล่างสุดเป็นผู้ผลิต (ข้าว) 10,000 kJ ชั้นถัดไปเป็นผู้บริโภคลำดับที่ 1 (ตั๊กแตน) 1,000 kJ ผู้บริโภคลำดับที่ 2 (กบ) 100 kJ และยอดเป็นผู้บริโภคลำดับที่ 3 (งู) 10 kJ แต่ละลำดับสูญเสียประมาณร้อยละ 90 เป็นความร้อนและใช้ในการหายใจ"
    caption: "ตัวเลขเป็นค่าตัวอย่างตามกฎร้อยละ 10 (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: คำนวณพลังงานที่ส่งต่อ
    problem: "ในโซ่อาหาร ข้าว → หนูนา → งู → เหยี่ยว ถ้าข้าวตรึงพลังงานได้ 80,000 kJ และส่งต่อได้ร้อยละ 10 ในแต่ละลำดับขั้น เหยี่ยวได้รับพลังงานเท่าใด"
    steps:
      - text: "เหยี่ยวเป็นผู้บริโภคลำดับที่ 3 อยู่ลำดับขั้นที่ 4 พลังงานจึงถูกส่งต่อ 3 ครั้ง"
        why: "จำนวนครั้งที่ส่งต่อเท่ากับจำนวนลูกศรระหว่างผู้ผลิตกับเหยี่ยว"
      - text: "หนูนา $80{,}000 \\times 0.1 = 8{,}000$ kJ งู $800$ kJ เหยี่ยว $80$ kJ"
    answer: "ประมาณ 80 kJ หรือเพียงร้อยละ 0.1 ของพลังงานที่ข้าวตรึงไว้"
  - { type: check, problem: biology.ecology.food-webs.p009, prompt: "งูเป็นผู้ล่าของสัตว์ใดบ้าง" }
  - type: figure
    title: ดีดีทีเข้มข้นขึ้นในโซ่อาหาร
    src: ddt-biomagnification.svg
    alt: "กราฟแท่งแกนตั้งเป็นสเกลลอการิทึม แสดงความเข้มข้นของดีดีทีเป็นส่วนในล้านส่วน (ppm) เรียงตามลำดับขั้นในโซ่อาหาร น้ำ 0.00005 แพลงก์ตอนสัตว์ 0.04 ปลาเล็ก 0.5 ปลาใหญ่ 2 นกกินปลา 25 เป็นข้อมูลตัวอย่าง"
    caption: "ข้อมูลตัวอย่างของไบโอแมกนิฟิเคชัน แกนตั้งแต่ละช่องเพิ่มขึ้น 10 เท่า (วาดโดยทีมคลังรู้)"
glossary:
  - { term: ระบบนิเวศ, definition: "สิ่งมีชีวิตทั้งหมดในบริเวณหนึ่งรวมกับสิ่งแวดล้อมและความสัมพันธ์ระหว่างกัน" }
  - { term: ประชากร, definition: "สิ่งมีชีวิตชนิดเดียวกันที่อยู่ในบริเวณเดียวกันในเวลาเดียวกัน" }
  - { term: กลุ่มสิ่งมีชีวิต, definition: "ประชากรหลายชนิดที่อยู่ร่วมกันในบริเวณหนึ่ง" }
  - { term: ภาวะพึ่งพากัน, definition: "ความสัมพันธ์ที่ทั้งสองฝ่ายได้ประโยชน์และแยกกันอยู่ไม่ได้ เช่น ไลเคน" }
  - { term: ภาวะอิงอาศัย, definition: "ความสัมพันธ์ที่ฝ่ายหนึ่งได้ประโยชน์ อีกฝ่ายไม่ได้และไม่เสีย" }
  - { term: ภาวะปรสิต, definition: "ความสัมพันธ์ที่ฝ่ายหนึ่งได้ประโยชน์จากการอาศัยอยู่กับอีกฝ่ายซึ่งเสียประโยชน์" }
  - { term: สายใยอาหาร, definition: "โซ่อาหารหลายสายที่เชื่อมโยงกัน" }
  - { term: ไบโอแมกนิฟิเคชัน, definition: "การที่สารพิษที่สลายตัวยากมีความเข้มข้นเพิ่มขึ้นตามลำดับขั้นในโซ่อาหาร" }
flashcards:
  - { front: "ลูกศรในโซ่อาหารชี้ไปทางใด", back: "จากผู้ถูกกินไปยังผู้กิน ตามทิศทางที่พลังงานไหล" }
  - { front: "พลังงานส่งต่อไปยังลำดับขั้นถัดไปประมาณเท่าใด", back: "ประมาณร้อยละ 10 ที่เหลือใช้ในการหายใจและสูญเสียเป็นความร้อน" }
  - { front: "สสารกับพลังงานในระบบนิเวศต่างกันอย่างไร", back: "สสารหมุนเวียนผ่านผู้ย่อยสลาย พลังงานไหลทางเดียว" }
  - { front: "สารพิษใดสะสมในโซ่อาหาร และพบมากที่สุดที่ใด", back: "สารที่สลายตัวยาก เช่น ดีดีที ปรอท พบมากที่สุดในผู้บริโภคลำดับสูงสุด" }
  - { front: "+/+ แยกกันไม่ได้ กับ +/+ แยกกันได้", back: "ภาวะพึ่งพากัน กับ ภาวะได้ประโยชน์ร่วมกัน" }
