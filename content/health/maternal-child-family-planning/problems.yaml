problems:
- id: health.family.maternal-child-family-planning.p001
  topics:
  - health.family.maternal-child-family-planning
  difficulty: 1
  type: numeric
  stem: ตามนโยบายฝากครรภ์คุณภาพของไทย ควรฝากครรภ์ครั้งแรกก่อนอายุครรภ์กี่สัปดาห์
  answer:
    value: 12
    unit: สัปดาห์
  misconceptions:
  - match: 20
    feedback: 20 สัปดาห์คือการฝากครรภ์ครั้งที่ 2 การรอจนรู้สึกลูกดิ้นทำให้พลาดการคัดกรองช่วงต้น
  - match: 40
    feedback: 40 สัปดาห์คือครบกำหนดคลอด
  hints:
  - เป็นช่วงไตรมาสแรกของการตั้งครรภ์
  - อายุครรภ์นับเป็นสัปดาห์ ไม่ใช่เดือน
  solution: ควรฝากครรภ์ครั้งแรก **ก่อนอายุครรภ์ 12 สัปดาห์** เพื่อตรวจเลือด คัดกรองความเสี่ยง และเริ่มรับยาเม็ดเสริมไอโอดีน ธาตุเหล็ก และกรดโฟลิกโดยเร็ว
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.maternal-child-family-planning.p002
  topics:
  - health.family.maternal-child-family-planning
  difficulty: 1
  type: mcq
  stem: องค์การอนามัยโลกแนะนำให้ทารกได้ **นมแม่อย่างเดียว** นานเท่าใด
  choices:
  - id: a
    text: 6 เดือน
    correct: true
  - id: b
    text: 3 เดือน
    feedback: สั้นเกินไป นมแม่อย่างเดียวพอถึง 6 เดือน
  - id: c
    text: 1 ปี
    feedback: เริ่มอาหารตามวัยเมื่อ 6 เดือน ส่วนนมแม่ให้ต่อถึง 2 ปีหรือนานกว่า
  - id: d
    text: 2 ปี
    feedback: 2 ปีคือระยะที่ควรให้นมแม่ต่อควบคู่กับอาหารตามวัย ไม่ใช่นมแม่อย่างเดียว
  hints:
  - นมแม่อย่างเดียวคือไม่ให้แม้แต่น้ำ
  - หลังจากนั้นเริ่มอาหารตามวัย
  solution: นมแม่อย่างเดียว 6 เดือน แล้วเริ่มอาหารตามวัยเมื่ออายุ 6 เดือน และให้นมแม่ต่อไปถึง 2 ปีหรือนานกว่า
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.maternal-child-family-planning.p003
  topics:
  - health.family.maternal-child-family-planning
  difficulty: 1
  type: text
  stem: สมุดบันทึกสุขภาพแม่และเด็กที่ได้เมื่อไปฝากครรภ์ คนทั่วไปเรียกว่า "สมุดสี..." สีอะไร
  accepted:
  - ชมพู
  - สีชมพู
  - สมุดสีชมพู
  misconceptions: []
  hints:
  - เป็นสีเดียวกับสีของสมุดที่พ่อแม่ใช้จดวัคซีนของลูก
  - สีอ่อนโทนแดง
  solution: สมุดบันทึกสุขภาพแม่และเด็กเรียกกันว่า **สมุดสีชมพู** ใช้บันทึกการฝากครรภ์ การคลอด วัคซีน และพัฒนาการของลูก ควรเก็บไว้ให้ดีและนำไปทุกครั้งที่พบเจ้าหน้าที่
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.maternal-child-family-planning.p004
  topics:
  - health.family.maternal-child-family-planning
  difficulty: 2
  type: numeric
  stem: กรมอนามัยเรียกช่วงตั้งครรภ์จนลูกอายุ 2 ปีว่า 1,000 วันแรกของชีวิต ถ้าการตั้งครรภ์ใช้เวลาราว 270 วัน หลังคลอดเหลือกี่วันใน 1,000 วันนั้น
  answer:
    value: 730
    unit: วัน
  misconceptions:
  - match: 1270
    feedback: บวกแทนการลบ ช่วงในครรภ์เป็นส่วนหนึ่งของ 1,000 วัน
  - match: 1000
    feedback: ลืมหักช่วงในครรภ์ 270 วัน
  hints:
  - นำ 1,000 ลบด้วยช่วงที่อยู่ในครรภ์
  - 'ตรวจคำตอบ: ผลลัพธ์ควรใกล้ 2 ปี'
  solution: $1{,}000 - 270 = 730$ วัน หรือราว 2 ปี ($730 \div 365 = 2$) จึงครอบคลุมถึงลูกอายุ 2 ปี
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.maternal-child-family-planning.p005
  topics:
  - health.family.maternal-child-family-planning
  difficulty: 2
  type: match
  stem: จับคู่ฮอร์โมนกับหน้าที่
  pairs:
  - left: FSH
    right: กระตุ้นให้ไข่ในรังไข่เจริญ
  - left: LH
    right: ทำให้ไข่ตก
  - left: เอสโตรเจน
    right: ทำให้ผนังมดลูกหนาขึ้น
  - left: โพรเจสเตอโรน
    right: รักษาผนังมดลูกให้พร้อมรับการฝังตัว
  - left: hCG
    right: ฮอร์โมนที่ชุดตรวจการตั้งครรภ์ตรวจหา
  hints:
  - FSH และ LH มาจากต่อมใต้สมอง
  - hCG สร้างเมื่อมีการตั้งครรภ์แล้ว
  solution: ต่อมใต้สมองหลั่ง FSH (ไข่เจริญ) และ LH (ไข่ตก) รังไข่สร้างเอสโตรเจน (ผนังมดลูกหนา) และโพรเจสเตอโรน (รักษาผนังมดลูก) ส่วน hCG สร้างเมื่อตั้งครรภ์ จึงใช้ตรวจการตั้งครรภ์ได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.maternal-child-family-planning.p006
  topics:
  - health.family.maternal-child-family-planning
  difficulty: 2
  type: mcq
  stem: วิธีคุมกำเนิดใด **ใช้ฮอร์โมน** (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: ยาเม็ดคุมกำเนิด
    correct: true
    feedback: ถูก
  - id: b
    text: ยาฉีดคุมกำเนิด
    correct: true
    feedback: ถูก
  - id: c
    text: ยาฝังคุมกำเนิด
    correct: true
    feedback: ถูก
  - id: d
    text: ถุงยางอนามัย
    feedback: ถุงยางกั้นอสุจิ ไม่มีฮอร์โมน
  - id: e
    text: ห่วงอนามัยชนิดทองแดง
    feedback: ห่วงทองแดงไม่มีฮอร์โมน
  hints:
  - วิธีที่ใช้ฮอร์โมนทำให้ไข่ไม่ตก
  - วิธีที่กั้นอสุจิหรือใช้ทองแดงไม่ใช่ฮอร์โมน
  solution: ยาเม็ด ยาฉีด และยาฝังมีฮอร์โมนคล้ายเอสโตรเจนหรือโพรเจสเตอโรน ส่วนถุงยางอนามัย ห่วงทองแดง และการทำหมันไม่ใช้ฮอร์โมน (ถุงยางยังเป็นวิธีเดียวที่ป้องกันโรคติดต่อทางเพศสัมพันธ์ได้ด้วย)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.maternal-child-family-planning.p007
  topics:
  - health.family.maternal-child-family-planning
  difficulty: 2
  type: order
  stem: เรียงวัคซีนพื้นฐานของเด็กไทยตามช่วงอายุที่ควรได้รับครบ จากเร็วที่สุดไปช้าที่สุด
  items:
  - BCG ป้องกันวัณโรค
  - MMR ครั้งที่ 1
  - DTP ครั้งที่ 4
  - MMR ครั้งที่ 2
  - HPV สำหรับนักเรียนหญิง
  hints:
  - BCG ให้ตั้งแต่แรกเกิด
  - ดูตารางวัคซีนตามช่วงอายุในบทเรียน ครั้งที่ 1 มาก่อนครั้งที่ 2 เสมอ
  solution: BCG ให้ตั้งแต่แรกเกิด → MMR1 ก่อนอายุ 1 ปี → DTP4 ภายใน 2 ปี → MMR2 ภายใน 3 ปี → HPV ในนักเรียนหญิง ป.5
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.maternal-child-family-planning.p008
  topics:
  - health.family.maternal-child-family-planning
  difficulty: 3
  type: numeric
  stem: แม่มีประจำเดือนครั้งสุดท้ายวันแรกวันที่ 1 มกราคม ไปฝากครรภ์วันที่ 15 มีนาคม ปีเดียวกัน (ไม่ใช่ปีอธิกสุรทิน) ขณะนั้นอายุครรภ์ครบกี่สัปดาห์เต็ม
  answer:
    value: 10
    unit: สัปดาห์
  misconceptions:
  - match: 8
    feedback: นับจากวันปฏิสนธิ (ราว 2 สัปดาห์หลังประจำเดือน) แต่อายุครรภ์ทางการแพทย์นับจากวันแรกของประจำเดือนครั้งสุดท้าย
  - match: 11
    feedback: ปัดขึ้น 10.4 เป็น 11 แต่โจทย์ถามจำนวนสัปดาห์เต็ม
  hints:
  - นับจำนวนวันจาก 1 มกราคม ถึง 15 มีนาคม
  - มกราคม 31 วัน กุมภาพันธ์ 28 วัน แล้วหารด้วย 7 ปัดลง
  solution: จำนวนวัน $= 31 + 28 + 14 = 73$ วัน $73 \div 7 = 10$ สัปดาห์ 3 วัน จึงครบ **10 สัปดาห์** ยังทันฝากครรภ์ก่อน 12 สัปดาห์
  figure:
    src: anc.svg
    alt: เส้นเวลาอายุครรภ์ 0 ถึง 40 สัปดาห์ แบ่งเป็นไตรมาสที่ 1 (0–13) ไตรมาสที่ 2 (13–27) ไตรมาสที่ 3 (27–40) มีจุดฝากครรภ์ 8 ครั้งตามแนวขององค์การอนามัยโลก ครั้งที่ 1 ไม่เกิน 12 สัปดาห์ ครั้งต่อไปที่ 20, 26, 30, 34, 36, 38 และ 40 สัปดาห์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.maternal-child-family-planning.p009
  topics:
  - health.family.maternal-child-family-planning
  difficulty: 3
  type: mcq
  stem: หญิงตั้งครรภ์ 32 สัปดาห์มีอาการใดที่ต้องไปโรงพยาบาลทันที (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: ปวดศีรษะรุนแรง ตาพร่ามัว และหน้าบวม
    correct: true
    feedback: ถูก อาจเป็นสัญญาณครรภ์เป็นพิษ
  - id: b
    text: ลูกดิ้นน้อยลงกว่าปกติมาก
    correct: true
    feedback: ถูก ต้องให้แพทย์ตรวจสุขภาพทารก
  - id: c
    text: มีเลือดออกทางช่องคลอด
    correct: true
    feedback: ถูก เป็นสัญญาณอันตราย
  - id: d
    text: ปวดหลังเล็กน้อยหลังยืนนาน
    feedback: พบได้บ่อยเมื่อท้องโต แก้ด้วยการพักและท่าทางที่ดี แต่ถ้าปวดมากผิดปกติควรปรึกษา
  - id: e
    text: อยากกินผลไม้เปรี้ยว
    feedback: เป็นเรื่องปกติ ไม่ใช่สัญญาณอันตราย
  hints:
  - สัญญาณอันตรายเกี่ยวกับเลือด ความดัน และการเคลื่อนไหวของทารก
  - อาการไม่สบายเล็กน้อยที่หายเมื่อพักเป็นเรื่องที่พบบ่อย
  solution: เลือดออก ปวดศีรษะรุนแรงกับตาพร่ามัวและบวม และลูกดิ้นน้อยลง เป็นสัญญาณอันตราย ต้องไปโรงพยาบาลทันทีหรือโทร 1669
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.maternal-child-family-planning.p010
  topics:
  - health.family.maternal-child-family-planning
  difficulty: 3
  type: mcq
  stem: ข้อใดถูกต้องเรื่องเครื่องดื่มแอลกอฮอล์กับการตั้งครรภ์
  choices:
  - id: a
    text: ไม่มีปริมาณที่ปลอดภัย ควรงดตลอดการตั้งครรภ์
    correct: true
  - id: b
    text: ดื่มเบียร์วันละแก้วไม่เป็นไรหลัง 3 เดือนแรก
    feedback: แอลกอฮอล์ผ่านรกได้ตลอดการตั้งครรภ์และทำร้ายสมองทารกได้ทุกช่วง
  - id: c
    text: ไวน์แดงดีต่อหัวใจ จึงดีต่อทารกด้วย
    feedback: ไม่มีหลักฐานว่าแอลกอฮอล์ชนิดใดปลอดภัยต่อทารก
  - id: d
    text: อันตรายเฉพาะเหล้าขาว ไม่รวมเบียร์
    feedback: อันตรายมาจากแอลกอฮอล์ในเครื่องดื่มทุกชนิด
  hints:
  - แอลกอฮอล์ผ่านรกได้หรือไม่
  - สมองทารกพัฒนาตลอดการตั้งครรภ์
  solution: แอลกอฮอล์ผ่านรกไปถึงทารกและทำให้เกิดกลุ่มอาการผิดปกติจากแอลกอฮอล์ ซึ่งทำให้สมองเสียหายถาวร ไม่มีปริมาณหรือช่วงเวลาที่ปลอดภัย จึงควรงดตั้งแต่วางแผนจะตั้งครรภ์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.maternal-child-family-planning.p011
  topics:
  - health.family.maternal-child-family-planning
  difficulty: 3
  type: mcq
  stem: ทำไมคู่สามีภรรยาในไทยจึงได้รับการแนะนำให้ **ตรวจพาหะธาลัสซีเมีย** ก่อนหรือระหว่างตั้งครรภ์
  choices:
  - id: a
    text: ถ้าทั้งสองคนเป็นพาหะชนิดเดียวกัน ลูกมีโอกาสเป็นโรคธาลัสซีเมียชนิดรุนแรง จะได้วางแผนและตรวจทารกในครรภ์ได้
    correct: true
  - id: b
    text: เพื่อป้องกันไม่ให้แม่ติดเชื้อธาลัสซีเมียจากสามี
    feedback: ธาลัสซีเมียเป็นโรคทางพันธุกรรม ไม่ใช่โรคติดเชื้อ
  - id: c
    text: เพราะพาหะธาลัสซีเมียทุกคนต้องห้ามมีบุตร
    feedback: พาหะมีบุตรได้ การตรวจช่วยให้รู้ความเสี่ยงและตัดสินใจอย่างมีข้อมูล
  - id: d
    text: เพื่อให้แพทย์จ่ายยารักษาธาลัสซีเมียให้แม่ทุกคน
    feedback: พาหะส่วนใหญ่ไม่มีอาการและไม่ต้องรักษา
  hints:
  - ธาลัสซีเมียถ่ายทอดทางพันธุกรรม
  - ลูกได้ยีนจากทั้งพ่อและแม่
  solution: ธาลัสซีเมียพบบ่อยในคนไทยและถ่ายทอดทางพันธุกรรม ถ้าพ่อและแม่เป็นพาหะชนิดเดียวกัน ลูกมีโอกาสได้ยีนผิดปกติจากทั้งสองคนจนเป็นโรครุนแรง การตรวจช่วยให้วางแผนครอบครัวและการดูแลได้ (ดูการถ่ายทอดยีนใน [โรคทางพันธุกรรมและสิ่งมีชีวิตดัดแปรพันธุกรรม](/topic/biology.genetics.genetic-disorders-gmo/))
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.maternal-child-family-planning.p012
  topics:
  - health.family.maternal-child-family-planning
  difficulty: 4
  type: mcq
  stem: ยาเม็ดคุมกำเนิดชนิดฮอร์โมนรวมป้องกันการตั้งครรภ์ได้อย่างไรเป็นหลัก
  choices:
  - id: a
    text: ฮอร์โมนในยากดการหลั่ง FSH และ LH ไข่จึงไม่เจริญและไม่ตก
    correct: true
  - id: b
    text: ฆ่าอสุจิในช่องคลอด
    feedback: นั่นคือการทำงานของสารฆ่าอสุจิ ไม่ใช่ยาเม็ดคุมกำเนิด
  - id: c
    text: ทำให้การตั้งครรภ์ที่เกิดขึ้นแล้วสิ้นสุดลง
    feedback: ยาคุมกำเนิดไม่ใช่ยาทำแท้ง ทำงานก่อนการปฏิสนธิ
  - id: d
    text: เพิ่มฮอร์โมน hCG ให้ร่างกายคิดว่าตั้งครรภ์แล้ว
    feedback: ยาคุมไม่มี hCG ใช้ฮอร์โมนคล้ายเอสโตรเจนและโพรเจสเตอโรน
  hints:
