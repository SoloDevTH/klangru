# ผลการเรียนรู้ คณิตศาสตร์เพิ่มเติม ม.4-ม.6 (ฉบับปรับปรุง พ.ศ. 2560)
#
# ที่มาและสถานะ
# - คัดจาก "คู่มือการใช้หลักสูตร ... ระดับมัธยมศึกษาตอนปลาย" ของ สสวท. หัวข้อ "ผลการเรียนรู้และสาระการเรียนรู้เพิ่มเติม"
#   (หน้า 18-27) คู่มือระบุว่าเป็นผลการเรียนรู้ที่ สสวท. "เสนอแนะ" สำหรับผู้เรียนแผนการเรียนวิทยาศาสตร์
#   สถานศึกษากำหนดผลการเรียนรู้ของรายวิชาเพิ่มเติมเองได้ จึงไม่ใช่ตัวชี้วัดแกนกลางที่บังคับใช้
# - ดึงข้อความด้วย pdftotext -bbox และเทียบกับ pypdf ทุกบรรทัด บรรทัดเดียวที่ข้อมูลข้อความใน PDF สลับลำดับสระ
#   คือ ม.6 แคลคูลัสข้อ 1 แก้ตามภาพหน้ากระดาษเป็น "ตรวจสอบความต่อเนื่องของฟังก์ชันที่กำหนดให้"
# - การเว้นวรรคตรงตำแหน่งตัดบรรทัดตัดสินจากบริบทเช่นเดียวกับ th-core-2560-math
#
# การจัดเข้าโครง สาระ → มาตรฐาน → ตัวชี้วัด
# - ต้นฉบับไม่มีรหัส มีแต่ 4 สาระ (จำนวนและพีชคณิต การวัดและเรขาคณิต สถิติและความน่าจะเป็น แคลคูลัส)
#   แต่ละสาระมี "เป้าหมาย" เป็นข้อ ๆ (หน้า 19) และในแต่ละชั้นมีตารางผลการเรียนรู้ใต้เป้าหมายแต่ละข้อ
#   ผลการเรียนรู้นับเลขใหม่ทุกตาราง (ชั้น × เป้าหมาย)
# - strand = สาระ (ลำดับตามหน้า 19: 1 จำนวนและพีชคณิต 2 การวัดและเรขาคณิต 3 สถิติและความน่าจะเป็น 4 แคลคูลัส)
#   standard = เป้าหมายของสาระ ใช้เลขข้อตามหน้า 19
#   indicator = ผลการเรียนรู้ ใช้ชั้นและเลขข้อตามตารางของชั้นนั้น
# - รหัสเป็นของโครงการ ไม่ใช่รหัสทางการ: "ค เพิ่มเติม <สาระ>.<เป้าหมาย> ม.<ชั้น>/<ข้อ>"
#   เช่น ตารางชั้น ม.5 เป้าหมายที่ 3 ของสาระจำนวนและพีชคณิต ข้อ 4 = "ค เพิ่มเติม 1.3 ม.5/4"
#   ขึ้นต้นด้วย "ค เพิ่มเติม" เพื่อไม่ให้สับสนกับรหัสตัวชี้วัดแกนกลาง
# - ในหน้าของชั้น ม.6 เป้าหมาย "เข้าใจและวิเคราะห์แบบรูป ความสัมพันธ์ ฟังก์ชัน ลำดับและอนุกรม และนำไปใช้"
#   พิมพ์เป็นข้อ "1." แต่ในหน้า 19 เป็นข้อ 2 ไฟล์นี้ใช้เลขตามหน้า 19 (ค เพิ่มเติม 1.2)
# - ข้อความมาตรฐานใช้ข้อความเป้าหมายในหน้าของชั้น ม.4/ม.5 ซึ่งพิมพ์ชัดกว่าหน้า 19 (เป้าหมาย 1.3 ในหน้า ม.5
#   ไม่มีวรรคหน้า "หรือช่วยแก้ปัญหา" ใช้ตามหน้า ม.4)
#
# จำนวนผลการเรียนรู้: ม.4 11 ข้อ, ม.5 13 ข้อ, ม.6 8 ข้อ รวม 32 ข้อ
id: th-core-2560-math-additional
title: คณิตศาสตร์เพิ่มเติม ม.4-ม.6 ผลการเรียนรู้ที่ สสวท. เสนอแนะ ตามหลักสูตรกลุ่มสาระการเรียนรู้คณิตศาสตร์ (ฉบับปรับปรุง พ.ศ. 2560)
short: คณิตศาสตร์เพิ่มเติม 2560
kind: national-curriculum
subjects: [math]
language: th
sources:
  - { title: "คู่มือการใช้หลักสูตร กลุ่มสาระการเรียนรู้คณิตศาสตร์ (ฉบับปรับปรุง พ.ศ.2560) ตามหลักสูตรแกนกลางการศึกษาขั้นพื้นฐาน พุทธศักราช 2551 ระดับมัธยมศึกษาตอนปลาย", url: "https://www.scimath.org/component/flexicontent/download/1529/8379/88", publisher: "สถาบันส่งเสริมการสอนวิทยาศาสตร์และเทคโนโลยี (สสวท.)", retrieved: "2026-10-24", pages: "หน้า 18-27 (สาระคณิตศาสตร์เพิ่มเติม ผลการเรียนรู้และสาระการเรียนรู้เพิ่มเติม); PDF หน้า 10-14" }
copyright: "ผลการเรียนรู้คณิตศาสตร์เพิ่มเติมเป็นข้อเสนอแนะของ สสวท. ประกอบหลักสูตรที่กระทรวงศึกษาธิการประกาศใช้ (คำสั่ง สพฐ. ที่ 1239/2560 และ 30/2561) โครงการตีความว่าเป็นส่วนหนึ่งของเอกสารหลักสูตรของรัฐ ซึ่งไม่เป็นงานอันมีลิขสิทธิ์ตาม พ.ร.บ.ลิขสิทธิ์ พ.ศ. 2537 มาตรา 7 (เป็นการตีความของโครงการ ไม่ใช่ความเห็นทางกฎหมาย และคู่มือของ สสวท. เองอาจมีลิขสิทธิ์) ไฟล์นี้คัดเฉพาะข้อความผลการเรียนรู้สั้น ๆ ไม่ได้คัดคำอธิบายหรือสาระการเรียนรู้ของคู่มือ"
completeness: full-text
strands:
  - id: ค เพิ่มเติม 1
    title: จำนวนและพีชคณิต
    standards:
      - id: ค เพิ่มเติม 1.1
        text: "เข้าใจความหลากหลายของการแสดงจำนวน ระบบจำนวน การดำเนินการของจำนวน ผลที่เกิดขึ้นจากการดำเนินการ สมบัติของการดำเนินการ และนำไปใช้"
        indicators:
          - { id: "ค เพิ่มเติม 1.1 ม.4/1", level: ม.4, text: "เข้าใจและใช้ความรู้เกี่ยวกับเซต ในการสื่อสารและสื่อความหมายทางคณิตศาสตร์" }
          - { id: "ค เพิ่มเติม 1.1 ม.4/2", level: ม.4, text: "เข้าใจและใช้ความรู้เกี่ยวกับตรรกศาสตร์เบื้องต้นในการสื่อสาร สื่อความหมาย และอ้างเหตุผล" }
          - { id: "ค เพิ่มเติม 1.1 ม.4/3", level: ม.4, text: "เข้าใจจำนวนจริง และใช้สมบัติของจำนวนจริงในการแก้ปัญหา" }
          - { id: "ค เพิ่มเติม 1.1 ม.5/1", level: ม.5, text: "เข้าใจจำนวนเชิงซ้อนและใช้สมบัติของจำนวนเชิงซ้อนในการแก้ปัญหา" }
          - { id: "ค เพิ่มเติม 1.1 ม.5/2", level: ม.5, text: "หารากที่ n ของจำนวนเชิงซ้อน เมื่อ n เป็นจำนวนนับที่มากกว่า 1" }
      - id: ค เพิ่มเติม 1.2
        text: "เข้าใจและวิเคราะห์แบบรูป ความสัมพันธ์ ฟังก์ชัน ลำดับและอนุกรม และนำไปใช้"
        indicators:
          - { id: "ค เพิ่มเติม 1.2 ม.4/1", level: ม.4, text: "หาผลลัพธ์ของการบวก การลบ การคูณ การหารฟังก์ชัน หาฟังก์ชันประกอบและฟังก์ชันผกผัน" }
          - { id: "ค เพิ่มเติม 1.2 ม.4/2", level: ม.4, text: "ใช้สมบัติของฟังก์ชันในการแก้ปัญหา" }
          - { id: "ค เพิ่มเติม 1.2 ม.4/3", level: ม.4, text: "เข้าใจลักษณะกราฟของฟังก์ชันเอกซ์โพเนนเชียลและฟังก์ชันลอการิทึม และนำไปใช้ในการแก้ปัญหา" }
          - { id: "ค เพิ่มเติม 1.2 ม.5/1", level: ม.5, text: "เข้าใจฟังก์ชันตรีโกณมิติและลักษณะกราฟของฟังก์ชันตรีโกณมิติ และนำไปใช้ในการแก้ปัญหา" }
          - { id: "ค เพิ่มเติม 1.2 ม.6/1", level: ม.6, text: "ระบุได้ว่าลำดับที่กำหนดให้เป็นลำดับลู่เข้าหรือลู่ออก" }
          - { id: "ค เพิ่มเติม 1.2 ม.6/2", level: ม.6, text: "หาผลบวก n พจน์แรกของอนุกรมเลขคณิตและอนุกรมเรขาคณิต" }
          - { id: "ค เพิ่มเติม 1.2 ม.6/3", level: ม.6, text: "หาผลบวกอนุกรมอนันต์" }
          - { id: "ค เพิ่มเติม 1.2 ม.6/4", level: ม.6, text: "เข้าใจและนำความรู้เกี่ยวกับลำดับและอนุกรมไปใช้" }
      - id: ค เพิ่มเติม 1.3
        text: "ใช้นิพจน์ สมการ อสมการ และเมทริกซ์ อธิบายความสัมพันธ์ หรือช่วยแก้ปัญหาที่กำหนดให้"
        indicators:
          - { id: "ค เพิ่มเติม 1.3 ม.4/1", level: ม.4, text: "แก้สมการและอสมการพหุนามตัวแปรเดียวดีกรีไม่เกินสี่ และนำไปใช้ในการแก้ปัญหา" }
          - { id: "ค เพิ่มเติม 1.3 ม.4/2", level: ม.4, text: "แก้สมการและอสมการเศษส่วนของพหุนามตัวแปรเดียว และนำไปใช้ในการแก้ปัญหา" }
          - { id: "ค เพิ่มเติม 1.3 ม.4/3", level: ม.4, text: "แก้สมการและอสมการค่าสัมบูรณ์ของพหุนามตัวแปรเดียว และนำไปใช้ในการแก้ปัญหา" }
          - { id: "ค เพิ่มเติม 1.3 ม.4/4", level: ม.4, text: "แก้สมการเอกซ์โพเนนเชียลและสมการลอการิทึม และนำไปใช้ในการแก้ปัญหา" }
          - { id: "ค เพิ่มเติม 1.3 ม.5/1", level: ม.5, text: "แก้สมการตรีโกณมิติ และนำไปใช้ในการแก้ปัญหา" }
          - { id: "ค เพิ่มเติม 1.3 ม.5/2", level: ม.5, text: "ใช้กฎของโคไซน์และกฎของไซน์ในการแก้ปัญหา" }
          - { id: "ค เพิ่มเติม 1.3 ม.5/3", level: ม.5, text: "เข้าใจความหมาย หาผลลัพธ์ของการบวกเมทริกซ์ การคูณเมทริกซ์กับจำนวนจริง การคูณระหว่างเมทริกซ์ และหาเมทริกซ์สลับเปลี่ยน หาดีเทอร์มิแนนต์ของเมทริกซ์ n × n เมื่อ n เป็นจำนวนนับที่ไม่เกินสาม" }
          - { id: "ค เพิ่มเติม 1.3 ม.5/4", level: ม.5, text: "หาเมทริกซ์ผกผันของเมทริกซ์ 2 × 2" }
          - { id: "ค เพิ่มเติม 1.3 ม.5/5", level: ม.5, text: "แก้ระบบสมการเชิงเส้นโดยใช้เมทริกซ์ผกผันและการดำเนินการตามแถว" }
          - { id: "ค เพิ่มเติม 1.3 ม.5/6", level: ม.5, text: "แก้สมการพหุนามตัวแปรเดียวดีกรีไม่เกินสี่ที่มีสัมประสิทธิ์เป็นจำนวนเต็ม และนำไปใช้ในการแก้ปัญหา" }
  - id: ค เพิ่มเติม 2
    title: การวัดและเรขาคณิต
    standards:
      - id: ค เพิ่มเติม 2.1
        text: "เข้าใจเรขาคณิตวิเคราะห์ และนำไปใช้"
        indicators:
          - { id: "ค เพิ่มเติม 2.1 ม.4/1", level: ม.4, text: "เข้าใจและใช้ความรู้เกี่ยวกับเรขาคณิตวิเคราะห์ในการแก้ปัญหา" }
      - id: ค เพิ่มเติม 2.2
        text: "เข้าใจเวกเตอร์ การดำเนินการของเวกเตอร์ และนำไปใช้"
        indicators:
          - { id: "ค เพิ่มเติม 2.2 ม.5/1", level: ม.5, text: "หาผลลัพธ์ของการบวก การลบเวกเตอร์ การคูณเวกเตอร์ด้วยสเกลาร์ หาผลคูณเชิงสเกลาร์ และผลคูณเชิงเวกเตอร์" }
          - { id: "ค เพิ่มเติม 2.2 ม.5/2", level: ม.5, text: "นำความรู้เกี่ยวกับเวกเตอร์ในสามมิติไปใช้ในการแก้ปัญหา" }
  - id: ค เพิ่มเติม 3
    title: สถิติและความน่าจะเป็น
    standards:
      - id: ค เพิ่มเติม 3.1
        text: "เข้าใจหลักการนับเบื้องต้น ความน่าจะเป็น และนำไปใช้"
        indicators:
          - { id: "ค เพิ่มเติม 3.1 ม.5/1", level: ม.5, text: "เข้าใจและใช้หลักการบวกและการคูณ การเรียงสับเปลี่ยน และการจัดหมู่ ในการแก้ปัญหา" }
          - { id: "ค เพิ่มเติม 3.1 ม.5/2", level: ม.5, text: "หาความน่าจะเป็นและนำความรู้เกี่ยวกับความน่าจะเป็นไปใช้" }
          - { id: "ค เพิ่มเติม 3.1 ม.6/1", level: ม.6, text: "หาความน่าจะเป็นของเหตุการณ์ที่เกิดจากตัวแปรสุ่มที่มีการแจกแจงเอกรูป การแจกแจงทวินาม และการแจกแจงปกติ และนำไปใช้ในการแก้ปัญหา" }
  - id: ค เพิ่มเติม 4
    title: แคลคูลัส
    standards:
      - id: ค เพิ่มเติม 4.1
        text: "เข้าใจลิมิตและความต่อเนื่องของฟังก์ชัน อนุพันธ์ของฟังก์ชัน และปริพันธ์ของฟังก์ชัน และนำไปใช้"
        indicators:
          - { id: "ค เพิ่มเติม 4.1 ม.6/1", level: ม.6, text: "ตรวจสอบความต่อเนื่องของฟังก์ชันที่กำหนดให้" }
          - { id: "ค เพิ่มเติม 4.1 ม.6/2", level: ม.6, text: "หาอนุพันธ์ของฟังก์ชันพีชคณิตที่กำหนดให้ และนำไปใช้แก้ปัญหา" }
          - { id: "ค เพิ่มเติม 4.1 ม.6/3", level: ม.6, text: "หาปริพันธ์ไม่จำกัดเขตและจำกัดเขตของฟังก์ชันพีชคณิตที่กำหนดให้ และนำไปใช้แก้ปัญหา" }
