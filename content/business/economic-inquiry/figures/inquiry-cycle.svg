  <text x="480" y="229" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">วงจรการสืบค้น</text>
  <text x="480" y="249" text-anchor="middle" font-size="13" fill="#1f2937">ทำซ้ำเมื่อได้ข้อมูลใหม่</text>
