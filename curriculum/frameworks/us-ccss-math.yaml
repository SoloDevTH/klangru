# Common Core State Standards for Mathematics (CCSSM), K-8 and high school conceptual categories
#
# Source and checks
# - Authoritative text: the official PDF "Common Core State Standards for Mathematics" from corestandards.org.
# - Structure (domain -> cluster -> standard, cluster letters) was read from the per-domain HTML pages of
#   thecorestandards.org, which describes itself as an unofficial mirror. Every cluster heading, standard and
#   sub-standard was then compared with the text of the official PDF. Where the mirror differs in wording, the PDF
#   wording is used (K.NBT.1 "(e.g., 18 = 10 + 8)", 8.EE.3 "3 × 10^8" / "7 × 10^9", N-VM.12 "as transformations",
#   F-IF.8 exponents).
# - Standards for Mathematical Practice (MP.1-MP.8) are not included; content standards only.
#
# Layout
# - strand   = domain within a grade, id as printed in the PDF ("K.CC", "3.NF", "N-RN", "G-SRT")
# - standard = cluster, id = domain + cluster letter used in the CCSS identifiers ("K.CC.A", "N-RN.B")
# - indicator = standard, id as printed in the PDF ("K.CC.4", "8.EE.1", "A-REI.4"); sub-standards a, b, c ... are
#   folded into the parent text as "a. ... b. ...".
# - level: "K", "1" ... "8", "HS".
#
# Text conventions (plain text, not typeset math)
# - exponents written with ^ (x^2, 5^(1/3)), complex fraction in 7.RP.1 written (1/2)/(1/4), degree sign °;
#   the PDF typesets these as superscripts.
# - minus signs use "-" (the PDF uses an en dash), footnote markers are dropped.
# - ★ marks modeling standards (also on whole domains/clusters), (+) marks standards beyond the college/career
#   core, both as in the original.
#
# Counts: 65 domains, 147 clusters, 385 standards (K-8: 229, HS: 156)
id: us-ccss-math
title: Common Core State Standards for Mathematics
short: Common Core (US)
kind: international-standard
subjects: [math]
language: en
sources:
  - { title: "Common Core State Standards for Mathematics (PDF)", url: "https://corestandards.org/wp-content/uploads/2023/09/Math_Standards1.pdf", publisher: "National Governors Association Center for Best Practices and Council of Chief State School Officers", retrieved: "2026-10-24", pages: "9-84 (content standards K-8 and high school)" }
  - { title: "Common Core State Standards Initiative: Mathematics Standards (unofficial HTML mirror, used for structure)", url: "https://www.thecorestandards.org/Math/", publisher: "thecorestandards.org (not affiliated with NGA Center/CCSSO)", retrieved: "2026-10-24" }
  - { title: "Common Core State Standards Public License", url: "https://www.thecorestandards.org/public-license/", publisher: "NGA Center / CCSSO (license text as reproduced on thecorestandards.org)", retrieved: "2026-10-24" }
