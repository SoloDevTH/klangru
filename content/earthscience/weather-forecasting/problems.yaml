      - { id: b, text: "ภูเขาในลาวดูดพลังงานของพายุไปหมด ฝนที่ตกจึงมาจากเมฆอื่น", feedback: "ภูเขาทำให้พายุอ่อนลงได้บ้าง แต่ฝนที่ตกยังมาจากพายุลูกเดิม" }
      - { id: c, text: "พายุดีเปรสชันมีฝนมากกว่าไต้ฝุ่นเสมอ", feedback: "ไต้ฝุ่นมักมีฝนมากกว่า ชื่อพายุบอกอัตราเร็วลม ไม่ได้บอกปริมาณฝน" }
      - { id: d, text: "อากาศบนบกร้อนกว่าทะเล พายุจึงแรงขึ้น", feedback: "ถ้าพายุแรงขึ้นต้องยังเป็นไต้ฝุ่น แต่พายุลดกำลังลง เพราะขาดแหล่งไอน้ำ" }
    hints:
