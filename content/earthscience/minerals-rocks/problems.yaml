problems:
  - id: earthscience.geology.minerals-rocks.p001
    topics: [earthscience.geology.minerals-rocks]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นแร่"
    choices:
      - { id: a, text: "ควอตซ์ ($\\mathrm{SiO_2}$) ที่เป็นผลึกในหินแกรนิต", correct: true }
      - { id: b, text: "หินแกรนิต", feedback: "หินแกรนิตเป็นหิน เพราะประกอบด้วยแร่หลายชนิด เช่น ควอตซ์ เฟลด์สปาร์ และไมกา" }
      - { id: c, text: "แก้วน้ำที่ผลิตในโรงงาน", feedback: "แก้วไม่ได้เกิดตามธรรมชาติ และอะตอมไม่ได้จัดเรียงเป็นผลึกที่เป็นระเบียบ" }
      - { id: d, text: "ถ่านหิน", feedback: "ถ่านหินเกิดจากซากพืช เป็นสารอินทรีย์และไม่มีองค์ประกอบหรือโครงสร้างผลึกแน่นอน จึงจัดเป็นหินตะกอน ไม่ใช่แร่" }
    hints:
      - "แร่ต้องเกิดตามธรรมชาติ เป็นอนินทรีย์ มีองค์ประกอบแน่นอน และมีโครงสร้างผลึก"
      - "หินประกอบด้วยแร่ จึงไม่ใช่แร่ชนิดเดียว"
    solution: "ควอตซ์เกิดตามธรรมชาติ เป็นอนินทรีย์ มีสูตร $\\mathrm{SiO_2}$ และมีโครงสร้างผลึก จึงเป็นแร่ หินแกรนิตเป็นหิน แก้วไม่เกิดตามธรรมชาติ ถ่านหินเป็นสารอินทรีย์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.minerals-rocks.p002
    topics: [earthscience.geology.minerals-rocks]
    difficulty: 1
    type: match
    stem: "จับคู่แร่กับกลุ่มแร่"
    pairs:
      - { left: "แคลไซต์ $\\mathrm{CaCO_3}$", right: "คาร์บอเนต" }
      - { left: "กาลีนา $\\mathrm{PbS}$", right: "ซัลไฟด์" }
      - { left: "ยิปซัม $\\mathrm{CaSO_4 \\cdot 2H_2O}$", right: "ซัลเฟต" }
      - { left: "เฮไลต์ $\\mathrm{NaCl}$", right: "เฮไลด์" }
      - { left: "ฮีมาไทต์ $\\mathrm{Fe_2O_3}$", right: "ออกไซด์" }
    hints:
      - "ดูไอออนลบหรือกลุ่มไอออนในสูตร"
      - "$\\mathrm{CO_3^{2-}}$ คาร์บอเนต $\\mathrm{SO_4^{2-}}$ ซัลเฟต $\\mathrm{S^{2-}}$ ซัลไฟด์ $\\mathrm{Cl^-}$ เฮไลด์ $\\mathrm{O^{2-}}$ ออกไซด์"
    solution: "แคลไซต์มี $\\mathrm{CO_3}$ จึงเป็นคาร์บอเนต กาลีนามี S จึงเป็นซัลไฟด์ ยิปซัมมี $\\mathrm{SO_4}$ จึงเป็นซัลเฟต เฮไลต์มี Cl จึงเป็นเฮไลด์ ฮีมาไทต์มี O จึงเป็นออกไซด์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.minerals-rocks.p003
    topics: [earthscience.geology.minerals-rocks]
    difficulty: 1
    type: text
    stem: "หินที่เกิดจากหินเดิมได้รับความร้อนและความดันสูงจนแร่และเนื้อหินเปลี่ยนไปโดยไม่หลอมละลาย เรียกว่าหินประเภทใด"
    accepted: ["หินแปร", "แปร", "metamorphic", "metamorphic rock"]
    misconceptions:
      - { match: "หินอัคนี", feedback: "หินอัคนีเกิดจากแมกมาหรือลาวาที่หลอมแล้วเย็นตัว แต่หินในโจทย์ไม่หลอม" }
      - { match: "หินตะกอน", feedback: "หินตะกอนเกิดจากตะกอนทับถม อัดตัว และเชื่อมประสาน" }
    hints:
      - "หินเปลี่ยนรูปไปในสถานะของแข็ง"
      - "ชื่อประเภทนี้มีคำว่า เปลี่ยน อีกแบบหนึ่ง"
    solution: "หินแปรเกิดจากหินเดิมที่ได้รับความร้อนและความดันสูงจนเปลี่ยนไปโดยยังเป็นของแข็ง เช่น หินปูนเปลี่ยนเป็นหินอ่อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.minerals-rocks.p004
    topics: [earthscience.geology.minerals-rocks]
    difficulty: 2
    type: mcq
    stem: "แร่ก้อนหนึ่งขูดด้วยเล็บไม่เป็นรอย แต่ขูดด้วยเหรียญทองแดงเป็นรอย และหยดกรดไฮโดรคลอริกเจือจางแล้วเกิดฟอง แร่นี้น่าจะเป็นแร่ใด"
    choices:
      - { id: a, text: "แคลไซต์", correct: true }
      - { id: b, text: "ควอตซ์", feedback: "ควอตซ์แข็ง 7 เหรียญทองแดงขูดไม่เข้า และไม่เกิดฟองกับกรด" }
      - { id: c, text: "ยิปซัม", feedback: "ยิปซัมแข็ง 2 เล็บมือ (2.5) ขูดเป็นรอยได้ และไม่เกิดฟองกับกรด" }
      - { id: d, text: "ฟลูออไรต์", feedback: "ฟลูออไรต์แข็ง 4 เหรียญทองแดง (3.5) ขูดไม่เข้า และไม่เกิดฟองกับกรด" }
    hints:
      - "ความแข็งอยู่ระหว่างเล็บ (2.5) กับเหรียญทองแดง (3.5)"
      - "แร่ใดเกิดฟอง $\\mathrm{CO_2}$ กับกรด"
    solution: "ความแข็งมากกว่า 2.5 แต่น้อยกว่า 3.5 ตรงกับแคลไซต์ (3) และแคลไซต์เป็นคาร์บอเนต ทำปฏิกิริยากับกรดเกิดฟอง $\\mathrm{CO_2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.minerals-rocks.p005
    topics: [earthscience.geology.minerals-rocks]
    difficulty: 2
    type: mcq
    stem: "นักเรียนพบแร่ก้อนสีเทาดำวาวแบบโลหะ เมื่อขูดบนแผ่นกระเบื้องไม่เคลือบได้ผงสีน้ำตาลแดง แร่นี้น่าจะเป็นแร่ใด"
    choices:
      - { id: a, text: "ฮีมาไทต์", correct: true }
      - { id: b, text: "แมกนีไทต์", feedback: "แมกนีไทต์ก้อนสีดำเหมือนกัน แต่สีผงเป็นสีดำ และดูดแม่เหล็ก" }
      - { id: c, text: "กาลีนา", feedback: "กาลีนาวาวแบบโลหะสีเทา แต่สีผงเป็นสีเทาดำ และหนักมาก" }
      - { id: d, text: "ควอตซ์", feedback: "ควอตซ์วาวแบบแก้ว ไม่ใช่วาวแบบโลหะ และแข็งกว่ากระเบื้องจึงไม่ทิ้งผงสี" }
    hints:
      - "สีผงคงที่กว่าสีของก้อนแร่"
      - "แร่เหล็กชนิดใดมีผงสีน้ำตาลแดง"
    solution: "ฮีมาไทต์ ($\\mathrm{Fe_2O_3}$) ก้อนอาจเป็นสีเทาดำวาวแบบโลหะ แต่สีผงเป็นสีน้ำตาลแดงเสมอ ซึ่งแยกจากแมกนีไทต์และกาลีนาได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.minerals-rocks.p006
    topics: [earthscience.geology.minerals-rocks]
    difficulty: 2
    type: numeric
    stem: "จากกราฟธาตุในเปลือกโลก ออกซิเจนและซิลิคอนรวมกันคิดเป็นร้อยละเท่าใดโดยมวล"
    figure: { src: crust-elements.svg, alt: "กราฟแท่งร้อยละโดยมวลของธาตุในเปลือกโลก O 46.6, Si 27.7, Al 8.1, Fe 5.0, Ca 3.6, Na 2.8, K 2.6, Mg 2.1 ธาตุอื่นรวมราว 1.5" }
    answer: { value: 74.3, tolerance: 0.2, unit: ร้อยละ }
    misconceptions:
      - { match: 18.9, feedback: "18.9 คือผลต่าง 46.6 − 27.7 โจทย์ถามผลรวม" }
      - { match: 46.6, feedback: "46.6 คือออกซิเจนอย่างเดียว ต้องรวมซิลิคอนด้วย" }
    hints:
      - "อ่านค่าของ O และ Si จากกราฟ"
      - "นำสองค่ามาบวกกัน"
    solution: "$46.6 + 27.7 = 74.3$ ร้อยละ เปลือกโลกจึงมีแร่ซิลิเกตเป็นส่วนใหญ่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.minerals-rocks.p007
    topics: [earthscience.geology.minerals-rocks]
    difficulty: 2
    type: match
    stem: "จับคู่หินแปรกับหินเดิมที่มันเปลี่ยนมา"
    pairs:
      - { left: "หินอ่อน", right: "หินปูน" }
      - { left: "หินชนวน", right: "หินดินดาน" }
      - { left: "หินควอร์ตไซต์", right: "หินทราย" }
    hints:
      - "หินแปรมีแร่หลักเหมือนหินเดิม"
      - "หินอ่อนเกิดฟองกับกรดเหมือนหินเดิมของมัน"
    solution: "หินปูนแปรเป็นหินอ่อน (ยังมีแคลไซต์) หินดินดานแปรเป็นหินชนวน (แร่เรียงตัวแยกเป็นแผ่น) หินทรายแปรเป็นหินควอร์ตไซต์ (เม็ดควอตซ์เชื่อมกันแน่น)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.minerals-rocks.p008
    topics: [earthscience.geology.minerals-rocks]
    difficulty: 3
    type: numeric
    stem: "แร่ก้อนหนึ่งมีมวล 26.5 g นำไปใส่กระบอกตวงที่มีน้ำ 40.0 mL ระดับน้ำขึ้นเป็น 50.0 mL แร่นี้มีความหนาแน่นกี่ $\\mathrm{g/cm^3}$"
    answer: { value: 2.65, tolerance: 0.03, unit: g/cm³ }
    misconceptions:
      - { match: 0.377, feedback: "นำปริมาตรหารด้วยมวล ความหนาแน่นคือมวลหารด้วยปริมาตร" }
      - { match: 0.53, feedback: "ใช้ปริมาตรเป็น 50.0 mL ซึ่งเป็นระดับน้ำทั้งหมด ปริมาตรของแร่คือส่วนที่เพิ่มขึ้น 10.0 mL" }
    hints:
      - "ปริมาตรของแร่คือระดับน้ำที่เพิ่มขึ้น"
      - "$\\rho = m/V$ และ $1\\ \\mathrm{mL} = 1\\ \\mathrm{cm^3}$"
    solution: "$V = 50.0 - 40.0 = 10.0\\ \\mathrm{cm^3}$, $\\rho = 26.5/10.0 = 2.65\\ \\mathrm{g/cm^3}$ ตรงกับควอตซ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.minerals-rocks.p009
    topics: [earthscience.geology.minerals-rocks]
    difficulty: 3
    type: numeric
    stem: "ควอตซ์มีสูตร $\\mathrm{SiO_2}$ ซิลิคอนคิดเป็นร้อยละเท่าใดโดยมวล (Si = 28.09, O = 16.00 ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 46.7, tolerance: 0.2, unit: ร้อยละ }
    misconceptions:
      - { match: 63.7, feedback: "ใช้ O เพียงอะตอมเดียว ($28.09/44.09$) สูตรมี O สองอะตอม" }
      - { match: 33.3, feedback: "นับจำนวนอะตอม (1 ใน 3) แต่โจทย์ถามร้อยละโดยมวล ต้องใช้มวลอะตอม" }
    hints:
      - "มวลสูตร $= 28.09 + 2(16.00)$"
      - "ร้อยละ = มวลของ Si ÷ มวลสูตร × 100"
    solution: "มวลสูตร $= 28.09 + 32.00 = 60.09$ ร้อยละของ Si $= 28.09/60.09 \\times 100 \\approx 46.7$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.minerals-rocks.p010
    topics: [earthscience.geology.minerals-rocks]
    difficulty: 3
    type: mcq
    stem: "หินอัคนีก้อนหนึ่งมีผลึกควอตซ์และเฟลด์สปาร์ขนาดหลายมิลลิเมตรมองเห็นได้ชัด สีโดยรวมอ่อน หินนี้น่าจะเป็นหินใด และเกิดอย่างไร"
    choices:
      - { id: a, text: "หินแกรนิต เกิดจากแมกมาที่เย็นตัวช้าใต้ผิวโลก", correct: true }
      - { id: b, text: "หินบะซอลต์ เกิดจากลาวาที่เย็นตัวเร็วบนผิวโลก", feedback: "หินบะซอลต์สีเข้มและผลึกเล็กจนมองไม่เห็น เพราะเย็นตัวเร็ว" }
      - { id: c, text: "หินแกรนิต เกิดจากลาวาที่เย็นตัวเร็ว", feedback: "ผลึกใหญ่แปลว่าเย็นตัวช้า อะตอมมีเวลาจัดเรียงนาน" }
      - { id: d, text: "หินออบซิเดียน เกิดจากลาวาที่เย็นตัวเร็วมาก", feedback: "ออบซิเดียนเป็นแก้ว แทบไม่มีผลึกเลย" }
    hints:
      - "ขนาดผลึกบอกอัตราการเย็นตัว"
      - "หินสีอ่อนเนื้อหยาบที่มีควอตซ์มากคือหินอะไร"
    solution: "ผลึกใหญ่มองเห็นได้แปลว่าแมกมาเย็นตัวช้าใต้ผิวโลก หินสีอ่อนที่มีควอตซ์และเฟลด์สปาร์มากคือหินแกรนิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.minerals-rocks.p011
    topics: [earthscience.geology.minerals-rocks]
    difficulty: 3
    type: order
    stem: "เรียงขั้นการเกิดหินทรายจากหินแกรนิตบนภูเขา"
    items:
      - "หินแกรนิตผุพังจากน้ำฝนและการเปลี่ยนอุณหภูมิ เหลือเม็ดควอตซ์"
      - "น้ำในลำธารกร่อนและพัดพาเม็ดทรายไป"
      - "เม็ดทรายตกทับถมเป็นชั้นในแอ่งหรือชายฝั่ง"
      - "ชั้นตะกอนถูกทับจนอัดตัว"
      - "สารละลายในน้ำตกผลึกเชื่อมเม็ดทรายเข้าด้วยกัน กลายเป็นหินทราย"
    hints:
      - "เริ่มจากการผุพัง แล้วพัดพา แล้วทับถม"
      - "อัดตัวเกิดก่อนเชื่อมประสาน"
    solution: "ผุพัง → กร่อนและพัดพา → ทับถม → อัดตัว → เชื่อมประสาน เป็นเส้นทางจากหินอัคนีไปเป็นหินตะกอนในวัฏจักรหิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.minerals-rocks.p012
    topics: [earthscience.geology.minerals-rocks]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดแยกหินอ่อนออกจากหินควอร์ตไซต์สีขาวได้ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "หยดกรดไฮโดรคลอริกเจือจาง หินอ่อนเกิดฟอง", correct: true }
      - { id: b, text: "ขูดด้วยมีด หินอ่อนเป็นรอย ส่วนควอร์ตไซต์ไม่เป็นรอย", correct: true }
      - { id: c, text: "ดูสี", feedback: "ทั้งสองชนิดเป็นสีขาวได้ สีจึงแยกไม่ได้" }
      - { id: d, text: "ดูว่ามีริ้วขนานหรือไม่", feedback: "ทั้งสองชนิดเป็นหินแปรที่ไม่มีริ้วขนาน จึงแยกด้วยวิธีนี้ไม่ได้" }
    hints:
      - "หินอ่อนมีแร่แคลไซต์ หินควอร์ตไซต์มีแร่ควอตซ์"
      - "เทียบความแข็งและปฏิกิริยากับกรดของสองแร่นี้"
    solution: "แคลไซต์แข็ง 3 และเกิดฟองกับกรด ควอตซ์แข็ง 7 และไม่ทำปฏิกิริยากับกรด จึงใช้กรดและการขูดด้วยมีด (5.5) แยกได้ ส่วนสีและริ้วขนานแยกไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.minerals-rocks.p013
    topics: [earthscience.geology.minerals-rocks]
    difficulty: 4
    type: numeric
    stem: "เผาหินปูนบริสุทธิ์ ($\\mathrm{CaCO_3}$) 1,000 kg ตามสมการ $\\mathrm{CaCO_3 \\rightarrow CaO + CO_2}$ จะได้ปูนขาว (CaO) กี่กิโลกรัม (Ca = 40.08, C = 12.01, O = 16.00)"
    answer: { value: 560, tolerance: 3, unit: kg }
    misconceptions:
      - { match: 440, feedback: "440 kg คือมวลของ $\\mathrm{CO_2}$ ที่ออกไป โจทย์ถามมวลของ CaO" }
