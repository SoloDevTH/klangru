<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" font-family="sans-serif">
<title>ด้านหลังซองบะหมี่กึ่งสำเร็จรูปสมมุติ</title>
<defs></defs>
<rect x="0" y="0" width="860" height="380" fill="#fff"/>
<rect x="10.0" y="10.0" width="840.0" height="360.0" rx="12" fill="#fff8e1" stroke="#e65100" stroke-width="2.5"/>
<text x="30.0" y="50.0" font-size="24" text-anchor="start" fill="#bf360c" font-weight="bold">บะหมี่กึ่งสำเร็จรูป ตราต้นกล้า</text>
<text x="830.0" y="50.0" font-size="14" text-anchor="end" fill="#777" font-weight="normal">(สินค้าสมมุติ)</text>
<text x="30.0" y="92.0" font-size="20" text-anchor="start" fill="#111" font-weight="bold">วิธีปรุง (1 ซอง)</text>
<text x="46.0" y="128.0" font-size="19" text-anchor="start" fill="#111" font-weight="normal">1. ต้มน้ำ 400 มิลลิลิตร ให้เดือด</text>
<text x="46.0" y="162.0" font-size="19" text-anchor="start" fill="#111" font-weight="normal">2. ใส่เส้นบะหมี่ ต้มต่ออีก 3 นาที</text>
<text x="46.0" y="196.0" font-size="19" text-anchor="start" fill="#111" font-weight="normal">3. ปิดไฟ แล้วใส่ผงปรุงรสและน้ำมันปรุงรส</text>
<text x="46.0" y="230.0" font-size="19" text-anchor="start" fill="#111" font-weight="normal">4. คนให้เข้ากัน พร้อมรับประทาน</text>
<rect x="30.0" y="272.0" width="800.0" height="82.0" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
<text x="46.0" y="302.0" font-size="19" text-anchor="start" fill="#c62828" font-weight="bold">ข้อควรระวัง</text>
<text x="46.0" y="334.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">ระวังน้ำร้อนลวก เด็กควรให้ผู้ใหญ่ช่วยยกหม้อ · ควรเติมผักและไข่เพื่อให้ได้สารอาหารครบ</text>
</svg>
