problems:
  - id: eng.past.p001
    topics: [english.grammar.past-simple]
    difficulty: 1
    type: text
    stem: "เติมกริยาในรูปที่ถูกต้อง: *Yesterday I ___ (play) badminton with my friends.*"
    accepted: ["played"]
    misconceptions:
      - { match: "play", feedback: "yesterday บอกว่าเป็นอดีต ต้องเปลี่ยนกริยาเป็นรูปอดีตด้วย ไม่ใช่ใช้แค่คำบอกเวลาแบบภาษาไทย" }
      - { match: "plays", feedback: "plays เป็นรูป present simple ประโยคนี้เป็นอดีต ต้องใช้กริยาช่องที่ 2" }
    hints:
      - "คำว่า yesterday บอกว่าเหตุการณ์เกิดเมื่อไร"
      - "play เป็นกริยาปกติ รูปอดีตเติม -ed"
    solution: "yesterday เป็นอดีต และ play เป็นกริยาปกติ (สระ + y เติม ed) จึงได้ *Yesterday I **played** badminton with my friends.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.past.p002
    topics: [english.grammar.past-simple]
    difficulty: 1
    type: mcq
    stem: "กริยาช่องที่ 2 (รูปอดีต) ของ **go** คือข้อใด"
    choices:
      - { id: a, text: "went", correct: true, feedback: "ถูก go เป็นกริยาไม่ปกติ" }
      - { id: b, text: "goed", feedback: "go เป็นกริยาไม่ปกติ ไม่เติม -ed" }
      - { id: c, text: "gone", feedback: "gone เป็นกริยาช่องที่ 3 ใช้กับ have/has ไม่ใช่รูปอดีตธรรมดา" }
      - { id: d, text: "goes", feedback: "goes เป็นรูป present simple ของ he, she, it" }
    hints:
      - "go เป็นกริยาปกติหรือไม่ปกติ"
      - "นึกถึงประโยค \"Yesterday I ___ to school.\""
    solution: "go เป็นกริยาไม่ปกติ: go – **went** – gone"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.past.p003
    topics: [english.grammar.past-simple]
    difficulty: 2
    type: match
    stem: "จับคู่กริยาไม่ปกติกับรูปอดีต (ช่องที่ 2)"
    pairs:
      - { left: "buy", right: "bought" }
      - { left: "eat", right: "ate" }
      - { left: "see", right: "saw" }
      - { left: "take", right: "took" }
      - { left: "write", right: "wrote" }
    hints:
      - "กริยาเหล่านี้ไม่เติม -ed ทุกตัว"
      - "ลองพูดในประโยค Yesterday I ___ แล้วฟังว่ารูปใดคุ้นหู"
    solution: "buy → bought · eat → ate · see → saw · take → took · write → wrote"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.past.p004
    topics: [english.grammar.past-simple]
    difficulty: 2
    type: text
    stem: "เติมกริยาในรูปที่ถูกต้อง: *She ___ (study) for the exam last night.*"
    accepted: ["studied"]
    misconceptions:
      - { match: "studyed", feedback: "study ลงท้ายด้วยพยัญชนะ + y ต้องเปลี่ยน y เป็น i ก่อนเติม ed" }
      - { match: "studies", feedback: "studies เป็นรูป present simple แต่ last night เป็นอดีต" }
    hints:
      - "last night บอกว่าเป็นอดีต"
      - "study ลงท้ายด้วย d + y (พยัญชนะ + y) ดูกฎการเติม -ed"
    solution: "study ลงท้ายด้วยพยัญชนะ + y จึงเปลี่ยน y เป็น i แล้วเติม ed: *She **studied** for the exam last night.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.past.p005
    topics: [english.grammar.past-simple]
    difficulty: 2
    type: mcq
    stem: "เลือกคำที่ถูกต้อง: *We ___ to Hua Hin last weekend.*"
    choices:
      - { id: a, text: "went", correct: true, feedback: "ถูก last weekend เป็นอดีตที่จบแล้ว ใช้ช่องที่ 2 ของ go" }
      - { id: b, text: "go", feedback: "last weekend เป็นอดีต ต้องเปลี่ยนกริยาเป็นรูปอดีต" }
      - { id: c, text: "goes", feedback: "goes เป็นรูปปัจจุบันของ he, she, it และประธานคือ we" }
      - { id: d, text: "have gone", feedback: "present perfect ใช้กับเวลาที่ระบุชัดว่าจบแล้วอย่าง last weekend ไม่ได้ ต้องใช้ past simple" }
    hints:
      - "หาคำบอกเวลาในประโยค"
      - "last weekend เป็นเวลาในอดีตที่ระบุชัด ใช้กริยาช่องที่ 2"
    solution: "last weekend เป็นอดีตที่ระบุเวลาชัดเจน จึงใช้ past simple: *We **went** to Hua Hin last weekend.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.past.p006
    topics: [english.grammar.past-simple]
    difficulty: 3
    type: text
    stem: "เติมกริยาในรูปที่ถูกต้อง: *The school bus ___ (stop) in front of the temple ten minutes ago.*"
    accepted: ["stopped"]
    misconceptions:
      - { match: "stoped", feedback: "stop ลงท้ายด้วย พยัญชนะ-สระ-พยัญชนะ (o-p) และเป็นพยางค์เดียว ต้องเพิ่ม p อีกตัวก่อนเติม ed" }
      - { match: "stops", feedback: "ten minutes ago เป็นอดีต ต้องใช้รูปอดีต" }
    hints:
      - "ten minutes ago บอกว่าเป็นอดีต"
      - "ดูสามตัวท้ายของ stop: พยัญชนะ-สระ-พยัญชนะ ต้องทำอย่างไรก่อนเติม ed"
    solution: "stop เป็นคำพยางค์เดียวที่ลงท้ายด้วย พยัญชนะ-สระ-พยัญชนะ จึงเพิ่ม p แล้วเติม ed: **stopped**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.past.p007
    topics: [english.grammar.past-simple]
    difficulty: 3
    type: mcq
    stem: "เลือกคำที่ถูกต้อง: *I ___ my homework yesterday.* (ฉันไม่ได้ทำการบ้านเมื่อวาน)"
    choices:
      - { id: a, text: "didn't do", correct: true, feedback: "ถูก didn't + กริยาช่องที่ 1" }
      - { id: b, text: "didn't did", feedback: "did บอกอดีตไปแล้ว กริยาหลักต้องกลับเป็นรูปเดิม do" }
      - { id: c, text: "don't did", feedback: "ปฏิเสธในอดีตใช้ didn't ไม่ใช่ don't และกริยาหลักใช้รูปเดิม" }
      - { id: d, text: "not did", feedback: "ภาษาอังกฤษวาง not หน้ากริยาเฉย ๆ ไม่ได้ ต้องใช้ didn't" }
    hints:
      - "ประโยคปฏิเสธในอดีตใช้ didn't"
      - "หลัง didn't ใช้กริยาช่องที่ 1"
    solution: "*I **didn't do** my homework yesterday.* didn't แสดงอดีตแล้ว กริยาหลัก do จึงใช้รูปเดิม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.past.p008
    topics: [english.grammar.past-simple]
    difficulty: 3
    type: order
    stem: "เรียงคำให้เป็นคำถามที่ถูกต้อง (เธอกินส้มตำเป็นมื้อกลางวันหรือเปล่า)"
    items: ["Did", "you", "eat", "som tam", "for lunch?"]
    hints:
      - "คำถาม past simple ขึ้นต้นด้วย Did"
      - "โครงสร้างคือ Did + ประธาน + กริยาช่องที่ 1 + ส่วนที่เหลือ"
    solution: "*Did you eat som tam for lunch?* (Did + ประธาน you + กริยารูปเดิม eat + กรรม som tam + for lunch)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.past.p009
    topics: [english.grammar.past-simple]
    difficulty: 4
    type: text
    stem: "ตอบสั้นแบบปฏิเสธ: *Did Nok buy a new phone?* — *No, she ___.*"
    accepted: ["didn't", "didn’t", "did not", "didn't.", "didn’t.", "did not."]
    misconceptions:
      - { match: "doesn't", feedback: "คำถามใช้ Did (อดีต) คำตอบสั้นต้องใช้ did เหมือนกัน" }
      - { match: "doesn’t", feedback: "คำถามใช้ Did (อดีต) คำตอบสั้นต้องใช้ did เหมือนกัน" }
      - { match: "didn't buy", feedback: "ความหมายถูก แต่คำตอบสั้นจบที่กริยาช่วย ไม่ต้องมีกริยาหลัก" }
      - { match: "didn’t buy", feedback: "ความหมายถูก แต่คำตอบสั้นจบที่กริยาช่วย ไม่ต้องมีกริยาหลัก" }
    hints:
      - "คำตอบสั้นใช้กริยาช่วยตัวเดียวกับคำถาม"
      - "คำถามขึ้นต้นด้วย Did ตอบปฏิเสธใช้รูปปฏิเสธของ did"
    solution: "*No, she **didn't**.* (หรือ did not) ใช้กริยาช่วยตัวเดียวกับคำถาม คือ did"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.past.p010
    topics: [english.grammar.past-simple]
    difficulty: 4
    type: text
    stem: "เติมกริยาในรูปที่ถูกต้อง: *Last year my uncle ___ (teach) English at a school in Khon Kaen.*"
    accepted: ["taught"]
    misconceptions:
      - { match: "teached", feedback: "teach เป็นกริยาไม่ปกติ รูปอดีตไม่เติม -ed" }
      - { match: "teaches", feedback: "last year เป็นอดีต ต้องใช้รูปอดีต" }
    hints:
      - "last year เป็นอดีต และ teach เป็นกริยาไม่ปกติ"
      - "รูปอดีตของ teach สะกดคล้ายกับรูปอดีตของ catch (caught)"
    solution: "teach เป็นกริยาไม่ปกติ: teach – **taught** – taught จึงได้ *Last year my uncle taught English at a school in Khon Kaen.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.past.p011
    topics: [english.grammar.past-simple]
    difficulty: 4
    type: mcq
    stem: "ประโยค *Where did you went last night?* มีส่วนใดผิด"
    choices:
      - { id: a, text: "went ควรเป็น go", correct: true, feedback: "ถูก หลัง did ต้องใช้กริยาช่องที่ 1" }
      - { id: b, text: "did ควรเป็น do", feedback: "last night เป็นอดีต ใช้ did ถูกแล้ว ส่วนที่ผิดคือกริยาหลัก" }
      - { id: c, text: "Where ควรอยู่ท้ายประโยค", feedback: "คำถามด้วยคำแสดงคำถาม (Where, What, When) ให้วางคำนั้นไว้หน้าสุด ตำแหน่งนี้ถูกแล้ว" }
      - { id: d, text: "ไม่มีส่วนใดผิด", feedback: "มีกริยาบอกอดีตซ้ำสองที่ ลองดูคำที่ตามหลัง did" }
    hints:
      - "ประโยคนี้บอกอดีตไว้กี่ครั้ง"
      - "did บอกอดีตแล้ว กริยาหลักควรเป็นรูปใด"
    solution: "did แสดงอดีตแล้ว กริยาหลักต้องเป็นรูปเดิม: *Where did you **go** last night?*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.past.p012
    topics: [english.grammar.past-simple]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "เลือกประโยคที่ถูกต้องทั้งหมด"
    choices:
      - { id: a, text: "He didn't come to school yesterday.", correct: true }
      - { id: b, text: "They watched a movie two days ago.", correct: true }
      - { id: c, text: "She buyed a gift for her mom.", feedback: "buy เป็นกริยาไม่ปกติ รูปอดีตคือ bought" }
      - { id: d, text: "Did you saw the news?", feedback: "หลัง Did ใช้กริยาช่องที่ 1: Did you see the news?" }
      - { id: e, text: "I was go to the market this morning.", feedback: "ไม่ต้องมี was: I went to the market this morning." }
      - { id: f, text: "We planned the trip to Chiang Rai in May.", correct: true }
    hints:
      - "ตรวจว่าหลัง did / didn't ใช้กริยารูปเดิมหรือไม่"
      - "ตรวจกริยาไม่ปกติและการสะกด -ed (plan เพิ่ม n อีกตัว)"
    solution: "ถูก: He didn't come… (didn't + V1) · They watched… (-ed) · We planned… (เพิ่ม n แล้วเติม ed) ผิด: buyed → bought · Did you saw → Did you see · I was go → I went"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.past.p013
    topics: [english.grammar.past-simple]
    difficulty: 5
    type: text
    stem: "มะลิจ่ายค่าตั๋วรถทัวร์ไป 450 บาท ถามว่าเธอจ่ายไปเท่าไร เติมคำในช่องว่าง: *How much ___ for the bus ticket?* (ตอบเป็นคำ 3 คำ)"
    accepted: ["did she pay", "did mali pay", "did malee pay"]
    misconceptions:
      - { match: "did she paid", feedback: "หลัง did ใช้กริยาช่องที่ 1 คือ pay" }
      - { match: "she paid", feedback: "ประโยคคำถามต้องมี did หน้าประธาน" }
      - { match: "does she pay", feedback: "เหตุการณ์จบไปแล้ว ต้องใช้ did ไม่ใช่ does" }
    hints:
      - "คำถามที่ขึ้นต้นด้วย How much ตามด้วยโครงสร้างคำถามปกติ"
      - "เรียงเป็น did + ประธาน + กริยาช่องที่ 1"
    solution: "How much + did + she + pay: *How much **did she pay** for the bus ticket?* ใช้ pay ไม่ใช่ paid เพราะ did บอกอดีตแล้ว"
    license: CC-BY-SA-4.0
    ai_assisted: true
