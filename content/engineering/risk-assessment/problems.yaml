  - id: engineering.safety.risk-assessment.p012
    topics:
      - engineering.safety.risk-assessment
    difficulty: 4
    type: numeric
    stem: (ข้อมูลสมมติ) ความเสี่ยงเดิมของงานหนึ่งมีโอกาส 5 และความรุนแรง 3 เมื่อติดตั้งมาตรการลดโอกาสเหลือ 2 โดยความรุนแรงเท่าเดิม ค่าความเสี่ยงลดลงกี่เปอร์เซ็นต์ (ตอบตัวเลขอย่างเดียว)
    answer:
      value: 60.0
      tolerance: 0.5
      unit: '%'
    hints:
      - คำนวณความเสี่ยงก่อนและหลังโดยคูณ L × S
      - เปอร์เซ็นต์ที่ลดลง = (ก่อน − หลัง) ÷ ก่อน × 100
    misconceptions:
      - match: 9
        feedback: นี่คือผลต่างของคะแนน (9 แต้ม) ไม่ใช่เปอร์เซ็นต์ที่ลดลง
      - match: 40
        feedback: นี่คือค่าหลังลดคิดเป็นร้อยละของค่าเดิม (6 ÷ 15) ไม่ใช่ส่วนที่ลดลง
    solution: ก่อน = 5 × 3 = 15 หลัง = 2 × 3 = 6 ลดลง (15 − 6) ÷ 15 × 100 = 60% เมื่อความรุนแรงเท่าเดิม ค่าความเสี่ยงลดลงในสัดส่วนเดียวกับโอกาส (จาก 5 เหลือ 2)
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.safety.risk-assessment.p013
    topics:
      - engineering.safety.risk-assessment
    difficulty: 4
    type: numeric
    stem: (ข้อมูลสมมติ) ช่างพ่นสีในโรงงานชิ้นส่วนยานยนต์สัมผัสสารละลายระเหย 200 ppm เป็นเวลา 3 ชั่วโมง และ 50 ppm เป็นเวลา 5 ชั่วโมง ในหนึ่งกะ 8 ชั่วโมง ค่าเฉลี่ยถ่วงน้ำหนักตามเวลา (TWA) เป็นกี่ ppm (ตอบทศนิยมสองตำแหน่ง)
    answer:
      value: 106.25
      tolerance: 0.05
      unit: ppm
    hints:
      - TWA = (C₁ × t₁ + C₂ × t₂) ÷ 8 ชั่วโมง โดย C คือความเข้มข้น
      - คูณความเข้มข้นกับเวลาแต่ละช่วงก่อนแล้วรวมกัน
    misconceptions:
      - match: 125.0
        feedback: หาค่าเฉลี่ยของความเข้มข้นธรรมดาแทนการถ่วงน้ำหนักด้วยเวลา
      - match: 850
        feedback: รวมผลคูณความเข้มข้นกับเวลาแล้วไม่หารด้วย 8 ชั่วโมง
    solution: TWA = (200 × 3 + 50 × 5) ÷ 8 = (600 + 250) ÷ 8 = 850 ÷ 8 = 106.25 ppm ค่าที่ได้ต้องเทียบกับค่ามาตรฐานการสัมผัสสารที่กฎหมายไทยกำหนดหรือแนวทางที่ยอมรับ ซึ่งต้องตรวจกับแหล่งปัจจุบัน
    license: CC-BY-SA-4.0
    ai_assisted: true
