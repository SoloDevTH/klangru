problems:
  - id: management.research.research-methods.p001
    topics: [management.research.research-methods]
    difficulty: 1
    type: mcq
    stem: "ศูนย์บริการประชาชนของเทศบาลแห่งหนึ่ง (สมมติ) อยากรู้ว่าทำไมผู้มาติดต่อจึงรอนาน ข้อใดเป็นวัตถุประสงค์การวิจัยที่เขียนได้ชัดและวัดได้"
    choices:
      - { id: a, text: "เพื่อให้การบริการดีขึ้น", feedback: "ยังไม่ชัดว่าจะวัดอะไรและดีขึ้นแค่ไหน ควรระบุตัวแปรและกลุ่มที่ศึกษา" }
      - { id: b, text: "เพื่อศึกษาปัจจัยที่สัมพันธ์กับระยะเวลารอคอยของผู้มาติดต่อ ณ ศูนย์บริการแห่งนี้", correct: true }
      - { id: c, text: "เพื่อถามว่าเจ้าหน้าที่ทำงานดีหรือไม่", feedback: "คำถามนี้ตัดสินคนมากกว่าศึกษาปรากฏการณ์ และตอบด้วยข้อมูลที่ไม่ชัดเจน" }
      - { id: d, text: "เพื่อพิสูจน์ว่าเทศบาลบริหารงานได้ดีที่สุด", feedback: "เป็นข้อสรุปที่ตั้งไว้ก่อนเก็บข้อมูล ไม่ใช่วัตถุประสงค์ที่ผลวิจัยจะตอบได้จริง" }
    hints:
      - "วัตถุประสงค์ควรบอกว่าจะศึกษาอะไร กับใคร และวัดด้วยอะไร"
      - "มองหาตัวเลือกที่ระบุตัวแปรและกลุ่มเป้าหมายไว้ชัดเจน"
    solution: "วัตถุประสงค์ที่ดีระบุตัวแปร (ระยะเวลารอคอย) กลุ่มเป้าหมาย (ผู้มาติดต่อที่ศูนย์บริการแห่งนี้) และขอบเขต ทำให้วัดและตรวจสอบได้ ตัวเลือกอื่นกว้างเกินไป หรือตั้งข้อสรุปไว้ก่อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.research.research-methods.p002
    topics: [management.research.research-methods]
    difficulty: 1
    type: numeric
    stem: "ศูนย์บริการมีผู้มาติดต่อ 240 คนในวันหนึ่ง มี 36 คนที่รอเกิน 1 ชั่วโมง คิดเป็นร้อยละเท่าใดของผู้มาติดต่อทั้งหมด (ตอบเป็นตัวเลขในหน่วย %)"
    answer: { value: 15, tolerance: 0.01, unit: "%" }
    hints:
      - "ร้อยละ = จำนวนกลุ่มที่สนใจ ÷ จำนวนทั้งหมด × 100"
      - "ทั้งหมดคือ 240 คน กลุ่มที่สนใจคือผู้ที่รอเกิน 1 ชั่วโมง"
    misconceptions:
      - { match: 36, feedback: "นั่นคือจำนวนคน ต้องเทียบกับทั้งหมดแล้วคูณ 100 ก่อนได้เป็นร้อยละ" }
      - { match: 6.67, feedback: "กลับเศษกับส่วน ต้องเอาจำนวนที่รอ (36) ตั้งหารด้วยทั้งหมด (240) ไม่ใช่กลับกัน" }
    solution: "$\\dfrac{36}{240} \\times 100 = 15\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.research.research-methods.p003
    topics: [management.research.research-methods]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นข้อมูลเชิงคุณภาพ"
    choices:
      - { id: a, text: "จำนวนผู้มาติดต่อในแต่ละวัน", feedback: "เป็นตัวเลขที่นับได้ จึงเป็นข้อมูลเชิงปริมาณ" }
      - { id: b, text: "ข้อความที่ผู้มาติดต่อเล่าถึงความรู้สึกหลังรอคิวนาน", correct: true }
      - { id: c, text: "อายุของผู้มาติดต่อเป็นปี", feedback: "เป็นตัวเลขที่วัดได้ จึงเป็นข้อมูลเชิงปริมาณ" }
      - { id: d, text: "ระยะเวลารอคอยเป็นนาที", feedback: "เป็นตัวเลขที่วัดได้ จึงเป็นข้อมูลเชิงปริมาณ" }
    hints:
      - "ถามว่าข้อมูลนั้นเป็นตัวเลขที่วัดหรือนับได้หรือไม่"
      - "ข้อมูลเชิงคุณภาพมักเป็นคำพูด ความคิดเห็น หรือการสังเกตที่บรรยายไว้"
    solution: "ข้อมูลเชิงคุณภาพอธิบายลักษณะหรือความรู้สึกด้วยคำบรรยาย เช่น คำพูดจากการสัมภาษณ์ ส่วนข้อมูลที่เป็นตัวเลขซึ่งนับหรือวัดได้เป็นเชิงปริมาณ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.research.research-methods.p004
    topics: [management.research.research-methods]
    difficulty: 2
    type: match
    stem: "จับคู่รูปแบบการวิจัยกับลักษณะการใช้งาน"
    pairs:
      - { left: "การวิจัยเชิงสำรวจ", right: "เก็บความเห็นจากกลุ่มตัวอย่างจำนวนมากในช่วงเวลาหนึ่งด้วยแบบสอบถาม" }
      - { left: "การศึกษาเฉพาะกรณี", right: "ศึกษาหน่วยเดียวอย่างลึก เช่น ศูนย์บริการหนึ่งแห่ง โดยใช้หลายแหล่งข้อมูล" }
      - { left: "การวิจัยกึ่งทดลอง", right: "มีการจัดกระทำกับกลุ่มหนึ่ง แต่ไม่สามารถสุ่มกลุ่มได้เต็มที่" }
      - { left: "การวิจัยผสานวิธี", right: "รวมข้อมูลตัวเลขจากแบบสอบถามกับข้อมูลคำพูดจากการสัมภาษณ์เชิงลึก" }
    hints:
      - "ถามว่างานนั้นศึกษาจำนวนมากในภาพกว้าง หรือศึกษาหน่วยเดียวอย่างลึก"
      - "ดูว่าใช้ทั้งข้อมูลเชิงปริมาณและเชิงคุณภาพหรือไม่ และมีการจัดกระทำกับกลุ่มหรือไม่"
    solution: "สำรวจเก็บข้อมูลกว้างจากกลุ่มใหญ่ กรณีศึกษาเจาะลึกหน่วยเดียว กึ่งทดลองมีการจัดกระทำแต่ไม่สุ่มกลุ่มได้เต็มที่ ผสานวิธีรวมข้อมูลทั้งสองชนิดในงานเดียว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.research.research-methods.p005
    topics: [management.research.research-methods]
    difficulty: 2
    type: numeric
    stem: "เทศบาลมีเจ้าหน้าที่ 800 คน ต้องการสอบถามความพึงพอใจโดยยอมให้ค่าคลาดเคลื่อนได้ 5% ใช้สูตร Yamane $n = \\dfrac{N}{1 + Nd^2}$ เมื่อ $d$ คือระดับความคลาดเคลื่อน จะได้กลุ่มตัวอย่างอย่างน้อยกี่คน (ปัดขึ้นเป็นจำนวนเต็ม)"
    answer: { value: 267, tolerance: 0, unit: "คน" }
    hints:
      - "แทนค่า $N = 800$ และ $d = 0.05$ ลงในสูตร และคำนวณตัวส่วน $1 + Nd^2$ ก่อน"
      - "ค่าที่ได้ปัดขึ้นเมื่อโจทย์ต้องการ 'อย่างน้อย' ไม่ใช่ปัดตามปกติ"
    misconceptions:
      - { match: 266, feedback: "ปัดลงทำให้ได้กลุ่มตัวอย่างน้อยกว่าที่สูตรกำหนด ต้องปัดขึ้น" }
      - { match: 400, feedback: "ลืมบวก 1 ในตัวส่วน ตัวส่วนจึงเป็น 800 × 0.0025 = 2 แทนที่จะเป็น 1 + 2" }
    solution: "$1 + 800(0.05)^2 = 1 + 800 \\times 0.0025 = 1 + 2 = 3$ จึง $n = \\dfrac{800}{3} \\approx 266.67$ ปัดขึ้นได้ 267 คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.research.research-methods.p006
    topics: [management.research.research-methods]
    difficulty: 2
    type: mcq
    stem: "จากประชากร 800 คนในข้อก่อน ถ้ายอมให้ค่าคลาดเคลื่อนเพิ่มจาก 5% เป็น 10% ขนาดกลุ่มตัวอย่างตามสูตร Yamane จะเปลี่ยนไปอย่างไร"
    choices:
      - { id: a, text: "เพิ่มขึ้นเป็นประมาณ 2 เท่า", feedback: "เมื่อยอมให้คลาดเคลื่อนมากขึ้น ต้องการข้อมูลน้อยลง ไม่ใช่มากขึ้น" }
      - { id: b, text: "ลดลงเหลือประมาณ 89 คน", correct: true }
      - { id: c, text: "ไม่เปลี่ยนเพราะประชากรเท่าเดิม", feedback: "ตัวส่วน $1 + Nd^2$ เปลี่ยนตามค่า $d$ จึงกระทบผลลัพธ์" }
      - { id: d, text: "ลดลงเหลือ 800 ÷ 10 = 80 คน", feedback: "สูตรนี้ไม่ได้หารด้วย 10 ตรง ๆ ต้องแทนค่าในตัวส่วนก่อน ผลที่ถูกคือประมาณ 89 คน" }
    hints:
      - "ลองแทน $d = 0.10$ ลงในสูตรเดิมแล้วเทียบกับผลเดิม"
      - "ดูว่า $d$ อยู่ที่ตัวส่วนเป็นกำลังสอง ค่าที่มากขึ้นทำให้ตัวส่วนใหญ่ขึ้นมากหรือน้อย"
    solution: "$n = \\dfrac{800}{1 + 800(0.10)^2} = \\dfrac{800}{9} \\approx 88.9$ ปัดขึ้นได้ 89 คน ลดลงจาก 267 คน เพราะยอมให้คลาดเคลื่อนมากขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.research.research-methods.p007
    topics: [management.research.research-methods]
    difficulty: 3
    type: numeric
    stem: "ตารางของ Krejcie และ Morgan (1970) ที่ความเชื่อมั่น 95% และความคลาดเคลื่อน 5% ให้กลุ่มตัวอย่างกี่คนสำหรับประชากร 1,000 คน (ตอบเป็นจำนวนคน)"
    answer: { value: 278, tolerance: 0, unit: "คน" }
    hints:
      - "ตารางนี้ให้ค่าตามขนาดประชากร ไม่ได้ใช้เปอร์เซ็นต์คงที่ของประชากรทุกขนาด"
      - "อ่านแถวประชากร 1,000 แล้วดูคอลัมน์ของกลุ่มตัวอย่าง ค่าที่ได้จะต่างจากสูตร Yamane เล็กน้อย"
    misconceptions:
      - { match: 286, feedback: "นั่นคือผลจากสูตร Yamane ซึ่งให้ค่าต่างจากตาราง Krejcie และ Morgan เล็กน้อย" }
      - { match: 200, feedback: "ใช้สัดส่วนคงที่ 20% ของประชากร ซึ่งไม่ใช่วิธีของตารางนี้" }
    solution: "ตาราง Krejcie และ Morgan (1970) แถว $N = 1{,}000$ ให้ 278 คน ตรวจซ้ำด้วยสูตร $s = \\dfrac{\\chi^2 N P(1-P)}{d^2(N-1) + \\chi^2 P(1-P)}$ โดย $\\chi^2 = 3.841$, $P = 0.5$, $d = 0.05$ ได้ 277.7 ซึ่งตารางปัดเป็นจำนวนเต็ม 278"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.research.research-methods.p008
    topics: [management.research.research-methods]
    difficulty: 2
    type: numeric
    stem: "ผู้ตอบ 4 คนให้คะแนนข้อคำถามหนึ่งบนมาตรลิเคิร์ต 5 ระดับ ได้ 5, 4, 2 และ 3 ค่าเฉลี่ยของข้อนี้เท่าใด (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 3.5, tolerance: 0.01 }
    hints:
      - "ค่าเฉลี่ย = ผลรวมคะแนน ÷ จำนวนผู้ตอบ"
      - "จำนวนผู้ตอบคือ 4 คน ไม่ใช่จำนวนระดับในมาตรวัด"
    misconceptions:
      - { match: 14, feedback: "นั่นคือผลรวมคะแนนยังไม่ได้หารด้วยจำนวนผู้ตอบ" }
      - { match: 2.8, feedback: "หารด้วย 5 ซึ่งเป็นจำนวนระดับ แทนที่จะหารด้วย 4 ซึ่งเป็นจำนวนผู้ตอบ" }
    solution: "$\\dfrac{5 + 4 + 2 + 3}{4} = \\dfrac{14}{4} = 3.50$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.research.research-methods.p009
    topics: [management.research.research-methods]
    difficulty: 3
    type: numeric
    stem: "แบบสอบถามมี 4 ข้อ ความแปรปรวนของแต่ละข้อคือ 0.6, 0.8, 0.7 และ 0.9 และความแปรปรวนของคะแนนรวมทั้งฉบับคือ 7.5 จงหาค่าสัมประสิทธิ์แอลฟาของครอนบาค (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 0.8, tolerance: 0.01 }
    hints:
      - "หาผลรวมความแปรปรวนรายข้อก่อน คือ 0.6 + 0.8 + 0.7 + 0.9"
      - "ใช้สูตร $\\alpha = \\dfrac{k}{k-1}\\left(1 - \\dfrac{\\sum \\sigma_i^2}{\\sigma_X^2}\\right)$ โดย $k$ คือจำนวนข้อ"
    misconceptions:
      - { match: 0.6, feedback: "ลืมคูณด้วย $k/(k-1)$ ซึ่งเท่ากับ $4/3$ การคิดแค่ $1 - 3.0/7.5$ จะได้ 0.6" }
      - { match: -2, feedback: "สลับตำแหน่งของผลรวมรายข้อกับความแปรปรวนรวม ได้ $\\dfrac{4}{3}\\left(1 - \\dfrac{7.5}{3.0}\\right) = -2$ ซึ่งติดลบและใช้ไม่ได้ ตัวตั้งต้องเป็นผลรวมความแปรปรวนรายข้อ" }
    solution: "ผลรวมความแปรปรวนรายข้อเท่ากับ 3.0 จึง $\\alpha = \\dfrac{4}{3}\\left(1 - \\dfrac{3.0}{7.5}\\right) = \\dfrac{4}{3}(0.6) = 0.80$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.research.research-methods.p010
    topics: [management.research.research-methods]
    difficulty: 3
    type: numeric
    stem: "ผู้เชี่ยวชาญ 3 คนประเมินข้อคำถามหนึ่งข้อของแบบสอบถามความพึงพอใจผู้ซื้อสินค้า OTOP โดยให้ +1 ถ้าเห็นว่าตรงวัตถุประสงค์ 0 ถ้าไม่แน่ใจ และ −1 ถ้าไม่ตรง ได้คะแนน +1, +1 และ 0 ค่าดัชนีความสอดคล้อง IOC ของข้อนี้เท่าใด (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 0.67, tolerance: 0.01 }
    hints:
      - "IOC คือผลรวมคะแนนของผู้เชี่ยวชาญทุกคน หารด้วยจำนวนผู้เชี่ยวชาญ"
      - "ตัวหารต้องนับทุกคนที่ให้คะแนน รวมถึงคนที่ให้ 0"
    misconceptions:
      - { match: 2, feedback: "นั่นคือผลรวมคะแนน ยังไม่ได้หารด้วยจำนวนผู้เชี่ยวชาญ" }
      - { match: 1, feedback: "หารด้วย 2 คนที่ให้คะแนนไม่เป็นศูนย์ แทนที่จะหารด้วย 3 คนทั้งหมด" }
    solution: "$\\text{IOC} = \\dfrac{1 + 1 + 0}{3} = 0.67$ ค่าที่เข้าใกล้ 1 แปลว่าผู้เชี่ยวชาญส่วนใหญ่เห็นว่าข้อนี้ตรงกับวัตถุประสงค์ เกณฑ์ตัดสินข้อคำถามควรดูจากงานวิจัยที่อ้างอิง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.research.research-methods.p011
    topics: [management.research.research-methods]
    difficulty: 3
    type: text
    stem: "ตัวแปร 'ระดับการศึกษาสูงสุด' แบ่งเป็น ประถมศึกษา มัธยมต้น มัธยมปลาย และปริญญาตรี โดยมีลำดับจากต่ำไปสูง ตัวแปรนี้จัดเป็นมาตรวัดแบบใด (ตอบเป็นคำ)"
    accepted: ["อันดับ", "มาตราอันดับ", "ordinal", "เรียงลำดับ", "มาตราเรียงลำดับ"]
    misconceptions:
      - { match: "อัตราส่วน", feedback: "มาตราอัตราส่วนมีศูนย์แท้และบอกเป็นเท่าได้ เช่น รายได้ ไม่ใช่ระดับการศึกษา" }
      - { match: "นามบัญญัติ", feedback: "นามบัญญัติไม่มีลำดับ แต่ระดับการศึกษามีลำดับจากต่ำไปสูง" }
    hints:
