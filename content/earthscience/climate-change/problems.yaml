    solution: "ถ้าค้างทั้งหมดจะเพิ่ม $40 / 7.8 \\approx 5.13$ ppm ต่อปี เพิ่มจริง 2.4 ppm สัดส่วนที่ค้าง $2.4 / 5.13 \\approx 0.47$ อีกราวครึ่งหนึ่งถูกมหาสมุทรและพืชบนบกดูดไป มหาสมุทรที่ดูด CO₂ จึงเป็นกรดมากขึ้น"
