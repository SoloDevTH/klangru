  ai_assisted: true
- id: science.inquiry.data-analysis.p017
  topics:
  - science.inquiry.data-analysis
  difficulty: 5
  type: mcq
  stem: ข้อมูลอัตราการทำงานของเอนไซม์ที่อุณหภูมิ 10, 20, 30, 40 °C เพิ่มขึ้นเรื่อย ๆ เพื่อนสรุปว่า "ที่ 80 °C เอนไซม์จะทำงานเร็วที่สุด" ข้อสรุปนี้มีปัญหาอะไร
  choices:
  - id: a
    text: เป็นการทำนายเลยช่วงข้อมูล แบบรูปอาจเปลี่ยน ความจริงเอนไซม์ส่วนใหญ่เสียสภาพเมื่อร้อนเกินไป ต้องวัดเพิ่มที่อุณหภูมิสูงกว่า 40 °C
    correct: true
  - id: b
    text: ไม่มีปัญหา เพราะแนวโน้มเพิ่มขึ้นชัดเจน
    feedback: แนวโน้มในช่วง 10–40 °C ไม่รับประกันว่าจะเป็นแบบเดิมที่ 80 °C
  - id: c
    text: ปัญหาคือวัดถี่เกินไป
    feedback: การวัดทุก 10 °C เหมาะสม ปัญหาอยู่ที่ไม่มีข้อมูลช่วงอุณหภูมิสูง
  - id: d
    text: ปัญหาคือควรใช้แผนภูมิแท่ง
    feedback: ชนิดของกราฟไม่ใช่ประเด็น ประเด็นคือการสรุปเกินช่วงที่วัด
  hints:
  - 80 °C อยู่ในช่วงที่วัดหรือไม่
  - นึกถึงสิ่งที่เกิดกับโปรตีนเมื่อร้อนจัด
  solution: การทำนายนอกช่วงข้อมูลเสี่ยงผิด เอนไซม์มีอุณหภูมิที่เหมาะสม ถ้าร้อนเกินจะเสียสภาพและทำงานช้าลง (ดู [ปฏิกิริยาเคมีในเซลล์และเอนไซม์](/topic/biology.cells.enzymes/)) จึงต้องเก็บข้อมูลเพิ่มก่อนสรุป
