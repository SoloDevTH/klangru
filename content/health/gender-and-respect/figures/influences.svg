<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350" font-family="sans-serif">
<title>ปัจจัยที่มีอิทธิพลต่อเจตคติเรื่องเพศ</title>
<rect x="0" y="0" width="640" height="350" fill="#ffffff"/>
