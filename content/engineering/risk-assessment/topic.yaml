id: engineering.safety.risk-assessment
subject: engineering
title: { th: ความปลอดภัยและการประเมินความเสี่ยงในงานวิศวกรรม, en: Safety and risk assessment in engineering }
summary: แยกอันตรายออกจากความเสี่ยง ชี้บ่งอันตรายด้วย JSA What-If และ HAZOP ประเมินด้วยตาราง 5 คูณ 5 เลือกมาตรการตามลำดับชั้น และคำนวณต้นไม้ความผิดพลาดกับชั้นป้องกัน
difficulty: 6
minutes: 40
prerequisites: [engineering.design.design-process, math.prob.probability]
encompasses:
  - { id: engineering.design.design-process, weight: 0.2 }
  - { id: math.prob.probability, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - { type: check, problem: engineering.safety.risk-assessment.p001, prompt: "ลองคิดก่อนอ่านต่อ: อันตรายกับความเสี่ยงต่างกันอย่างไร" }
  - type: figure
    title: ตารางประเมินความเสี่ยง 5 คูณ 5
    src: risk-matrix.svg
    alt: "ตารางสี่เหลี่ยมห้าคูณห้า แกนนอนคือความรุนแรงจาก 1 ถึง 5 แกนตั้งคือโอกาสจาก 1 ถึง 5 ช่องแต่ละช่องแสดงผลคูณและมีสีตามแถบ ช่องสีเขียวคือความเสี่ยงต่ำ สีเหลืองคือปานกลาง สีส้มคือสูง และสีแดงคือสูงมาก ช่องที่โอกาส 4 และความรุนแรง 4 มีวงกลมล้อมไว้ค่า 16"
    caption: "ช่องที่มีโอกาสและความรุนแรงสูงพร้อมกันต้องได้รับการจัดการก่อนเสมอ"
  - type: worked-example
    title: ลดโอกาสครึ่งหนึ่งลดความเสี่ยงลงครึ่งหนึ่งหรือไม่
    problem: "งานหนึ่งมีโอกาส 4 และความรุนแรง 4 ติดตั้งมาตรการลดโอกาสเหลือ 2 โดยความรุนแรงเท่าเดิม ค่าความเสี่ยงลดลงกี่เปอร์เซ็นต์"
    steps:
      - text: "ความเสี่ยงก่อน $R_1 = 4 \\times 4 = 16$ อยู่ในแถบสูง"
        why: "ความเสี่ยงใช้ผลคูณของโอกาสกับความรุนแรง ไม่ใช่ผลบวก"
      - text: "ความเสี่ยงหลัง $R_2 = 2 \\times 4 = 8$ อยู่ในแถบปานกลาง"
      - text: "ส่วนที่ลดลง $= \\frac{16 - 8}{16} \\times 100 = 50\\%$"
        why: "เปอร์เซ็นต์ที่ลดลงต้องหารด้วยค่าก่อนลด ไม่ใช่ค่าผลต่าง 8 แต้ม"
    answer: "ค่าความเสี่ยงลดลง 50% เมื่อความรุนแรงเท่าเดิม แสดงว่าการลดโอกาสที่แหล่งกำเนิดให้ผลชัดเจน"
  - type: worked-example
    title: ประตู OR และ AND ในต้นไม้ความผิดพลาด
    problem: "การไหลหยุดเกิดจากไฟฟ้าขัดข้อง (p = 0.02) หรือวาล์วติดค้าง (p = 0.05) โดยเหตุการณ์อิสระต่อกัน ความน่าจะเป็นที่การไหลจะหยุดเป็นเท่าไร และถ้าต้องเกิดพร้อมกันจะเป็นเท่าไร"
    steps:
      - text: "ประตู OR: $P = 1 - (1 - 0.02)(1 - 0.05) = 1 - 0.98 \\times 0.95 = 0.069$ คิดเป็น 6.9%"
        why: "การบวกตรง ๆ ได้ 0.07 ซึ่งประมาณเกินไปเล็กน้อย เพราะเหตุการณ์ทั้งสองอาจเกิดพร้อมกันได้"
      - text: "ประตู AND (ทั้งสองต้องเกิดพร้อมกัน): $P = 0.02 \\times 0.05 = 0.001$ คิดเป็น 0.1%"
        why: "ประตู AND ให้ค่าเล็กกว่ามาก จึงใช้เมื่อสร้างระบบสำรองที่ความล้มเหลวของแต่ละส่วนไม่เกิดพร้อมกัน"
    answer: "ประตู OR ให้ 6.9% ส่วนประตู AND ให้ 0.1% การเลือกประตูมีผลมากต่อการประเมิน"
  - type: figure
    title: ต้นไม้ความผิดพลาดแบบประตู OR
    src: fault-tree.svg
    alt: "แผนภาพต้นไม้ มีเหตุการณ์ยอดชื่อการไหลของน้ำหยุดอยู่ด้านบน ใต้ลงมาเป็นประตู OR แล้วแยกเป็นสองเหตุการณ์ย่อย คือไฟฟ้าขัดข้องที่ p เท่ากับ 0.02 และวาล์วติดค้างที่ p เท่ากับ 0.05 มีกรอบประกอบอธิบายประตู AND"
    caption: "ค่าความน่าจะเป็นในภาพเป็นตัวอย่างเพื่อการสอน ไม่ใช่ข้อมูลจริงของอุปกรณ์"
  - { type: check, problem: engineering.safety.risk-assessment.p008, prompt: "ลองคำนวณประตู OR ด้วยค่าที่ต่างจากในบทเรียน" }
glossary:
  - { term: อันตราย, definition: "แหล่งหรือสภาวะที่มีศักยภาพก่อให้เกิดอันตรายต่อคนหรือทรัพย์สิน (hazard)" }
  - { term: ความเสี่ยง, definition: "การรวมกันของโอกาสที่เหตุการณ์จะเกิดกับความรุนแรงของผลที่ตามมา (risk)" }
  - { term: การวิเคราะห์ความปลอดภัยของงาน, definition: "การแบ่งงานเป็นขั้นตอนแล้วระบุอันตรายและมาตรการควบคุมของแต่ละขั้น (JSA)" }
  - { term: HAZOP, definition: "วิธีวิเคราะห์อันตรายเชิงระบบโดยใช้คำนำกับตัวแปรกระบวนการเพื่อค้นหาการเบี่ยงเบนจากการออกแบบ" }
  - { term: ลำดับชั้นการควบคุม, definition: "ลำดับมาตรการจากการกำจัด การทดแทน วิศวกรรม บริหาร จนถึง PPE โดยมาตรการต้นทางมีผลมากกว่า" }
  - { term: ต้นไม้ความผิดพลาด, definition: "แผนภาพที่แตกเหตุการณ์ยอดเป็นเหตุการณ์ย่อยด้วยประตู AND และ OR เพื่อคำนวณความน่าจะเป็น (fault tree)" }
  - { term: ชั้นการป้องกันอิสระ, definition: "กลไกที่ลดผลของเหตุร้ายแรงโดยไม่พึ่งชั้นอื่นและทดสอบได้แยกกัน (independent protection layer)" }
flashcards:
  - { front: "อันตรายกับความเสี่ยงต่างกันอย่างไร", back: "อันตรายคือแหล่งที่อาจก่อผลเสีย ความเสี่ยงคือโอกาสรวมกับความรุนแรง" }
  - { front: "ลำดับชั้นการควบคุมเริ่มจากอะไร", back: "การกำจัด แล้วการทดแทน วิศวกรรม บริหาร และ PPE ตามลำดับ" }
  - { front: "ประตู OR สำหรับเหตุการณ์อิสระคำนวณอย่างไร", back: "P = 1 − (1 − p₁)(1 − p₂)" }
  - { front: "คำนำ NO ใน HAZOP หมายความว่าอย่างไร", back: "ไม่มีตัวแปรกระบวนการนั้นเลยเมื่อควรมี" }
  - { front: "อัตราการหยุดงาน LTIFR คำนวณอย่างไร", back: "จำนวนอุบัติเหตุที่หยุดงาน × 1,000,000 ÷ ชั่วโมงทำงานรวม" }
