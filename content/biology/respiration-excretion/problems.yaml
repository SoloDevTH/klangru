  - id: biology.humans.respiration-excretion.p016
    topics: [biology.humans.respiration-excretion]
    difficulty: 5
    type: mcq
    stem: "ถ้าเจาะรูเล็ก ๆ ที่ผนังขวดแก้วของแบบจำลองการหายใจ แล้วดึงแผ่นยางลง ลูกโป่งจะเป็นอย่างไร"
    choices:
      - { id: a, text: "แทบไม่พอง เพราะอากาศภายนอกเข้าทางรู ความดันในขวดจึงไม่ลดลง", correct: true }
      - { id: b, text: "พองมากขึ้น เพราะมีอากาศเข้าได้สองทาง", feedback: "อากาศที่เข้าทางรูไปอยู่รอบลูกโป่ง ไม่ได้เข้าไปในลูกโป่ง จึงไม่ช่วยให้พอง" }
      - { id: c, text: "พองเท่าเดิม เพราะรูเล็กมาก", feedback: "แม้รูเล็ก อากาศก็เข้ามาเติมจนความดันในขวดเท่ากับภายนอก ความต่างของความดันที่ทำให้ลูกโป่งพองจึงหายไป" }
      - { id: d, text: "ลูกโป่งแตก", feedback: "ไม่มีความดันที่สูงขึ้นในลูกโป่ง จึงไม่มีเหตุให้แตก" }
    hints:
      - "ลูกโป่งพองเพราะความดันรอบลูกโป่งต่ำกว่าภายนอก"
      - "ถ้ามีรู อากาศจะเข้ามาเติมในขวดหรือไม่"
    solution: "เมื่อดึงแผ่นยางลง อากาศเข้าทางรูมาเติมในขวด ความดันรอบลูกโป่งจึงไม่ลดลง ลูกโป่งแทบไม่พอง เช่นเดียวกับเมื่อผนังอกมีแผลทะลุจนอากาศเข้าช่องอก ปอดข้างนั้นจะขยายไม่ได้ ต้องรีบนำส่งโรงพยาบาลและโทร 1669"
