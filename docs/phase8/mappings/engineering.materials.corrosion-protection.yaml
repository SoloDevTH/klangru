topic: engineering.materials.corrosion-protection
rows:
  - { framework: th-coe-engineering-basics, indicators: ["MET-2.6"], coverage: partial, note: "สอนการเคลือบผิว (สี การชุบสังกะสี การชุบไฟฟ้า) และการป้องกันทางไฟฟ้าเคมีเชิงแนวคิด รวมการปรับปรุงผิวเพื่อความแข็ง (คาร์บูไรซิงและไนไตรดิง) แบบอธิบายหลักการ ยังไม่สอนสายการผลิตการเคลือบ การควบคุมคุณภาพผิว และการแก้ปัญหาในกระบวนการจริง" }
  - { framework: th-coe-engineering-basics, indicators: ["MET-2.3"], coverage: partial, note: "สอนเคมีไฟฟ้าของการกัดกร่อนของโลหะในน้ำเกลือและความชื้น ยังไม่สอนเคมีกายภาพของระบบก๊าซ โลหะหลอมเหลว และอนุภาคของแข็ง" }
  - { framework: th-coe-engineering-basics, indicators: ["MIN-2.3"], coverage: partial, note: "สอนเฉพาะส่วนเคมีไฟฟ้าของการกัดกร่อนและการป้องกัน ไม่รวมการสำรวจแร่ การทำเหมือง การแต่งแร่ และการนำวัสดุกลับมาใช้ใหม่" }
