<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" font-family="sans-serif">
<title>ผังเลือกการทดสอบการลู่เข้า เริ่มจากตรวจพจน์ที่ n แล้วตรวจกำลัง n หรือแฟกทอเรียล ตรวจเครื่องหมายสลับ และเปรียบเทียบ</title>
<rect width="560" height="340" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker></defs>
<rect x="40" y="16" width="300" height="52" rx="8" fill="#f6e7d8" stroke="#15211e" stroke-width="1.8"/><text x="190.0" y="47.0" font-size="13" text-anchor="middle" fill="#15211e">ตรวจพจน์ที่ n: lim a_n ≠ 0 ?</text>
<line x1="340" y1="42.0" x2="380" y2="42.0" stroke="#444" stroke-width="1.6" marker-end="url(#ah)"/><text x="360.0" y="35.0" font-size="12" text-anchor="middle" fill="#1f5fa8">ใช่</text>
<rect x="380" y="16" width="160" height="52" rx="8" fill="#f2d7d5" stroke="#15211e" stroke-width="1.8"/><text x="460.0" y="47.0" font-size="13" text-anchor="middle" fill="#15211e">ลู่ออก (จบ)</text>
<line x1="190.0" y1="68" x2="190.0" y2="104" stroke="#444" stroke-width="1.6" marker-end="url(#ah)"/><text x="198.0" y="90.0" font-size="12" fill="#1f5fa8">ไม่ใช่</text>
<rect x="40" y="104" width="300" height="52" rx="8" fill="#e6e9f5" stroke="#15211e" stroke-width="1.8"/><text x="190.0" y="135.0" font-size="13" text-anchor="middle" fill="#15211e">มีกำลัง n, แฟกทอเรียล หรือ c^n ?</text>
<line x1="340" y1="130.0" x2="380" y2="130.0" stroke="#444" stroke-width="1.6" marker-end="url(#ah)"/><text x="360.0" y="123.0" font-size="12" text-anchor="middle" fill="#1f5fa8">ใช่</text>
<rect x="380" y="104" width="160" height="52" rx="8" fill="#e2f0ed" stroke="#15211e" stroke-width="1.8"/><text x="460.0" y="135.0" font-size="13" text-anchor="middle" fill="#15211e">อัตราส่วนหรือราก</text>
<line x1="190.0" y1="156" x2="190.0" y2="192" stroke="#444" stroke-width="1.6" marker-end="url(#ah)"/><text x="198.0" y="178.0" font-size="12" fill="#1f5fa8">ไม่ใช่</text>
<rect x="40" y="192" width="300" height="52" rx="8" fill="#e6e9f5" stroke="#15211e" stroke-width="1.8"/><text x="190.0" y="223.0" font-size="13" text-anchor="middle" fill="#15211e">มีเครื่องหมายสลับ (−1)^n ?</text>
<line x1="340" y1="218.0" x2="380" y2="218.0" stroke="#444" stroke-width="1.6" marker-end="url(#ah)"/><text x="360.0" y="211.0" font-size="12" text-anchor="middle" fill="#1f5fa8">ใช่</text>
<rect x="380" y="192" width="160" height="52" rx="8" fill="#e2f0ed" stroke="#15211e" stroke-width="1.8"/><text x="460.0" y="223.0" font-size="12" text-anchor="middle" fill="#15211e">ไลบ์นิซ + ตรวจค่าสัมบูรณ์</text>
<line x1="190.0" y1="244" x2="190.0" y2="280" stroke="#444" stroke-width="1.6" marker-end="url(#ah)"/><text x="198.0" y="266.0" font-size="12" fill="#1f5fa8">ไม่ใช่</text>
<rect x="40" y="280" width="300" height="52" rx="8" fill="#e2f0ed" stroke="#15211e" stroke-width="1.8"/><text x="190.0" y="302.5" font-size="13" text-anchor="middle" fill="#15211e">เปรียบเทียบโดยตรง</text><text x="190.0" y="319.5" font-size="13" text-anchor="middle" fill="#15211e">หรือเปรียบเทียบลิมิต</text>
</svg>
