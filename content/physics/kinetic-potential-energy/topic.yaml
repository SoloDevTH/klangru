id: physics.energy.kinetic-potential
subject: physics
title: { th: พลังงานจลน์และพลังงานศักย์, en: Kinetic and potential energy }
summary: พลังงานจลน์ของวัตถุที่เคลื่อนที่ พลังงานศักย์โน้มถ่วงจากความสูง พลังงานศักย์ยืดหยุ่นในสปริง และทฤษฎีบทงาน–พลังงาน
difficulty: 4.5
minutes: 35
prerequisites: [physics.energy.work]
encompasses:
  - { id: physics.energy.work, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: spring-force-extension.svg
    alt: "กราฟแรงดึงสปริง F (แกนตั้ง) กับระยะยืด x (แกนนอน) เป็นเส้นตรงผ่านจุดกำเนิด เขียนว่า F = kx มีสามเหลี่ยมเล็กแสดงว่าความชันของเส้นคือ k ที่ระยะยืด x แรงมีค่า kx และพื้นที่สามเหลี่ยมใต้เส้นตั้งแต่ 0 ถึง x ระบายสีไว้ เขียนว่าพื้นที่ = ½(x)(kx) = ½kx² = งานที่ใช้ยืด"
    caption: "แรงดึงสปริงเพิ่มจาก $0$ ถึง $kx$ งานจึงเป็นพื้นที่สามเหลี่ยม $\\tfrac12 kx^2$ ไม่ใช่ $kx \\cdot x$"
  - type: worked-example
    title: แรงและพลังงานในสปริงที่ถูกยืด
    problem: "สปริงค่านิจ $300\\ \\mathrm{N/m}$ ถูกดึงให้ยืดออก $12\\ \\mathrm{cm}$ ต้องใช้แรงดึงเท่าใด และสปริงสะสมพลังงานศักย์ยืดหยุ่นเท่าใด"
    steps:
      - text: "แปลงหน่วย $x = 12\\ \\mathrm{cm} = 0.12\\ \\mathrm{m}$"
        why: "ค่านิจสปริงมีหน่วย $\\mathrm{N/m}$ ระยะจึงต้องเป็นเมตร"
      - text: "กฎของฮุก: $F = kx = (300)(0.12) = 36\\ \\mathrm{N}$"
      - text: "พลังงาน: $E_s = \\tfrac12 kx^2 = \\tfrac12 (300)(0.12)^2 = 2.16\\ \\mathrm{J}$"
        why: "แรงไม่ได้เป็น $36\\ \\mathrm{N}$ ตลอดการยืด แต่เพิ่มจาก $0$ ถึง $36\\ \\mathrm{N}$ แรงเฉลี่ยจึงเป็นครึ่งหนึ่ง ถ้าคิด $36 \\times 0.12 = 4.32\\ \\mathrm{J}$ จะได้มากไปสองเท่า"
    answer: "แรงดึง $36\\ \\mathrm{N}$ และพลังงานศักย์ยืดหยุ่น $2.16\\ \\mathrm{J}$"
  - { type: check, problem: phy.ke.p003, prompt: "เร็วขึ้นสองเท่า พลังงานจลน์เป็นกี่เท่า" }
  - type: worked-example
    title: เครนยกของ งานของแรงหลายแรงกับพลังงาน
    problem: "เครนยกกล่องมวล $200\\ \\mathrm{kg}$ จากพื้นที่หยุดนิ่ง ขึ้นในแนวดิ่ง $5\\ \\mathrm{m}$ ด้วยแรงตึงลวดคงตัว $2200\\ \\mathrm{N}$ เมื่อถึงความสูง $5\\ \\mathrm{m}$ กล่องมีอัตราเร็วเท่าใด ($g = 9.8\\ \\mathrm{m/s^2}$)"
    steps:
      - text: "งานของแรงตึงลวด (ทิศเดียวกับการเคลื่อนที่): $W_T = (2200)(5) = 11000\\ \\mathrm{J}$"
      - text: "งานของน้ำหนัก (สวนทางการเคลื่อนที่): $W_g = -mgh = -(200)(9.8)(5) = -9800\\ \\mathrm{J}$"
        why: "งานที่ใช้สู้แรงโน้มถ่วง $9800\\ \\mathrm{J}$ กลายเป็นพลังงานศักย์โน้มถ่วงที่เพิ่มขึ้นของระบบโลกกับกล่อง"
      - text: "งานรวม $= 11000 - 9800 = 1200\\ \\mathrm{J}$ ซึ่งเท่ากับ $\\Delta E_k$"
        why: "ทฤษฎีบทงาน–พลังงานใช้งานของแรงลัพธ์ หรือผลรวมงานของทุกแรง ไม่ใช่งานของแรงใดแรงหนึ่ง"
      - text: "$\\tfrac12 (200) v^2 = 1200$ → $v^2 = 12$ → $v \\approx 3.46\\ \\mathrm{m/s}$"
    answer: "ประมาณ $3.46\\ \\mathrm{m/s}$ (งาน $11000\\ \\mathrm{J}$ ของเครนแบ่งเป็นพลังงานศักย์ $9800\\ \\mathrm{J}$ และพลังงานจลน์ $1200\\ \\mathrm{J}$)"
  - { type: check, problem: phy.ke.p012, prompt: "ระดับอ้างอิงเปลี่ยน พลังงานศักย์เปลี่ยนหรือไม่" }
  - type: interactive
    title: พลังงานจลน์เพิ่มตามกำลังสองของอัตราเร็ว
    caption: 'แกนนอนคืออัตราเร็ว v (m/s) แกนตั้งคือพลังงานจลน์ (J) กราฟเป็นพาราโบลา ไม่ใช่เส้นตรง ลองอ่านค่าที่ v = 4 และ v = 8 จะเห็นว่าพลังงานต่างกัน 4 เท่า ส่วนการเพิ่มมวล m ทำให้พลังงานเพิ่มแบบเท่าตัวเท่านั้น'
    widget:
      kind: function-plot
      functions: ['\frac{1}{2} m x^2']
      sliders:
        - { name: m, min: 1, max: 10, step: 1, value: 2, label: มวล m (kg) }
      x: [0, 10]
      y: [0, 500]
  - type: simulation
    title: กฎของฮุกและพลังงานในสปริง (PhET Hooke's Law)
    url: https://phet.colorado.edu/en/simulations/hookes-law
    provider: phet
    note: เลือกหน้าจอพลังงาน (Energy) แล้วลองยืดสปริงเป็น 2 เท่าของระยะเดิม สังเกตว่าพลังงานศักย์ยืดหยุ่นเพิ่มเป็น 4 เท่า และพื้นที่ใต้กราฟแรง–ระยะยืดคือพลังงานที่สะสมไว้
glossary:
  - { term: พลังงานจลน์, definition: 'พลังงานของวัตถุที่กำลังเคลื่อนที่ $E_k = \tfrac{1}{2}mv^2$ หน่วยจูล' }
  - { term: พลังงานศักย์โน้มถ่วง, definition: 'พลังงานของวัตถุที่อยู่สูงจากระดับอ้างอิง $E_p = mgh$ ใกล้ผิวโลกใช้ $g = 9.8\ \mathrm{m/s^2}$' }
  - { term: พลังงานศักย์ยืดหยุ่น, definition: 'พลังงานที่สะสมในสปริงที่ถูกยืดหรือกด $E_s = \tfrac{1}{2}kx^2$ เมื่อ $k$ คือค่านิจสปริง ($\mathrm{N/m}$)' }
  - { term: ทฤษฎีบทงาน–พลังงาน, definition: 'งานของแรงลัพธ์เท่ากับพลังงานจลน์ที่เปลี่ยนไป $W_{\text{รวม}} = \tfrac{1}{2}mv^2 - \tfrac{1}{2}mu^2$' }
flashcards:
  - { front: 'สูตรพลังงานจลน์ พลังงานศักย์โน้มถ่วง และพลังงานศักย์ยืดหยุ่น', back: '$E_k = \tfrac{1}{2}mv^2$, $E_p = mgh$, $E_s = \tfrac{1}{2}kx^2$ ทั้งหมดมีหน่วยจูล' }
  - { front: 'อัตราเร็วเพิ่มเป็น 3 เท่า พลังงานจลน์เพิ่มเป็นกี่เท่า', back: '9 เท่า เพราะ $E_k \propto v^2$' }
  - { front: 'ทฤษฎีบทงาน–พลังงาน', back: 'งานรวม (งานของแรงลัพธ์) $= \Delta E_k = \tfrac{1}{2}mv^2 - \tfrac{1}{2}mu^2$' }
  - { front: 'ยกกล่อง $2\ \mathrm{kg}$ ขึ้นสูง $3\ \mathrm{m}$ พลังงานศักย์โน้มถ่วงเพิ่มเท่าใด ($g = 9.8\ \mathrm{m/s^2}$)', back: '$mgh = (2)(9.8)(3) = 58.8\ \mathrm{J}$' }
