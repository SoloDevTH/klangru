problems:
  - id: earthscience.astronomy.moon-solar-system.p001
    topics: [earthscience.astronomy.moon-solar-system]
    difficulty: 1
    type: mcq
    stem: "ดวงจันทร์ขึ้นทางทิศใด"
    choices:
      - { id: a, text: "ทิศตะวันออก", correct: true }
      - { id: b, text: "ทิศตะวันตก", feedback: "ทิศตะวันตกเป็นทิศที่ดวงจันทร์ตก" }
      - { id: c, text: "ทิศเหนือ", feedback: "ดวงจันทร์ขึ้นและตกเหมือนดวงอาทิตย์ ไม่ได้ขึ้นทางทิศเหนือ" }
      - { id: d, text: "ทิศใต้", feedback: "ดวงจันทร์ขึ้นและตกเหมือนดวงอาทิตย์ ไม่ได้ขึ้นทางทิศใต้" }
    hints:
      - "ดวงจันทร์ขึ้นและตกเหมือนดวงอาทิตย์"
      - "ดวงอาทิตย์ขึ้นทางทิศใด"
    solution: "โลกหมุนจากทิศตะวันตกไปทิศตะวันออก เราจึงเห็นดวงจันทร์ขึ้นทางทิศตะวันออกและตกทางทิศตะวันตก เหมือนดวงอาทิตย์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.moon-solar-system.p002
    topics: [earthscience.astronomy.moon-solar-system]
    difficulty: 1
    type: match
    stem: "จับคู่วันทางจันทรคติกับรูปร่างของดวงจันทร์ที่เห็น"
    pairs:
      - { left: "เดือนดับ", right: "มองไม่เห็นดวงจันทร์" }
      - { left: "ขึ้น 8 ค่ำ", right: "สว่างครึ่งดวงด้านขวา" }
      - { left: "ขึ้น 15 ค่ำ", right: "สว่างเต็มดวง" }
      - { left: "แรม 8 ค่ำ", right: "สว่างครึ่งดวงด้านซ้าย" }
    hints:
      - "ข้างขึ้น ส่วนสว่างใหญ่ขึ้นทุกวันจนเต็มดวงในวันขึ้น 15 ค่ำ"
      - "ข้างขึ้นสว่างด้านขวา ข้างแรมสว่างด้านซ้าย"
    solution: "เดือนดับมองไม่เห็นดวงจันทร์ ขึ้น 8 ค่ำสว่างครึ่งดวงด้านขวา ขึ้น 15 ค่ำ (วันเพ็ญ) สว่างเต็มดวง และแรม 8 ค่ำสว่างครึ่งดวงด้านซ้าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.moon-solar-system.p003
    topics: [earthscience.astronomy.moon-solar-system]
    difficulty: 1
    type: mcq
    stem: "ทำไมเราจึงมองเห็นดวงจันทร์สว่างในเวลากลางคืน"
    choices:
      - { id: a, text: "ดวงจันทร์สะท้อนแสงอาทิตย์มาเข้าตาเรา", correct: true }
      - { id: b, text: "ดวงจันทร์มีแสงในตัวเองเหมือนดวงอาทิตย์", feedback: "ดวงจันทร์ไม่มีแสงในตัวเอง ด้านที่ไม่ได้รับแสงอาทิตย์จึงมืด" }
      - { id: c, text: "ดวงจันทร์สะท้อนแสงไฟจากเมืองบนโลก", feedback: "แสงไฟจากเมืองน้อยมาก ดวงจันทร์สว่างได้ก็เพราะแสงอาทิตย์" }
      - { id: d, text: "ดวงจันทร์ร้อนจนเรืองแสง", feedback: "ดวงจันทร์ไม่ได้ร้อนจนเปล่งแสง เราเห็นเพราะแสงอาทิตย์ส่องกระทบ" }
    hints:
      - "ดวงจันทร์เป็นดาวฤกษ์หรือไม่"
      - "ด้านที่หันเข้าหาดวงอาทิตย์ของดวงจันทร์เป็นอย่างไร"
    solution: "ดวงจันทร์ไม่มีแสงในตัวเอง แสงอาทิตย์ส่องกระทบดวงจันทร์แล้วสะท้อนมาเข้าตาเรา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.moon-solar-system.p004
    topics: [earthscience.astronomy.moon-solar-system]
    difficulty: 2
    type: order
    stem: "เรียงดาวเคราะห์จากดวงที่อยู่ใกล้ดวงอาทิตย์ที่สุดไปไกลที่สุด"
    items:
      - "ดาวพุธ"
      - "ดาวศุกร์"
      - "โลก"
      - "ดาวอังคาร"
      - "ดาวพฤหัสบดี"
    hints:
      - "โลกเป็นดาวเคราะห์ดวงที่สามจากดวงอาทิตย์"
      - "แถบดาวเคราะห์น้อยอยู่ระหว่างดาวอังคารกับดาวพฤหัสบดี"
    solution: "พุธ → ศุกร์ → โลก → อังคาร → พฤหัสบดี (ต่อจากนั้นคือ เสาร์ ยูเรนัส เนปจูน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.moon-solar-system.p005
    topics: [earthscience.astronomy.moon-solar-system]
    difficulty: 2
    type: order
    stem: "ภาพแสดงรูปร่างของดวงจันทร์ที่เห็นตอนกลางคืนสี่แบบ คือ ก ข ค ง เรียงรูปร่างที่เห็นตั้งแต่หลังวันเดือนดับจนถึงวันเพ็ญ"
    figure: { src: p-moon-shapes.svg, alt: "ดวงจันทร์สี่ภาพบนพื้นสีดำ ภาพ ก สว่างเต็มดวง ภาพ ข สว่างเป็นเสี้ยวบาง ๆ ทางด้านขวา ภาพ ค สว่างเกือบเต็มดวง มีส่วนมืดเล็กน้อยทางด้านซ้าย ภาพ ง สว่างครึ่งดวงด้านขวา" }
    items:
      - "ภาพ ข"
      - "ภาพ ง"
      - "ภาพ ค"
      - "ภาพ ก"
    hints:
      - "หลังเดือนดับเป็นข้างขึ้น ส่วนสว่างใหญ่ขึ้นทุกวัน"
      - "เริ่มจากเสี้ยวเล็กที่สุด ไปจนถึงเต็มดวง"
    solution: "ข้างขึ้นส่วนสว่างใหญ่ขึ้นทุกวัน: ข (เสี้ยว ราวขึ้น 4 ค่ำ) → ง (ครึ่งดวง ขึ้น 8 ค่ำ) → ค (เกือบเต็มดวง ราวขึ้น 11 ค่ำ) → ก (เต็มดวง ขึ้น 15 ค่ำ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.moon-solar-system.p006
    topics: [earthscience.astronomy.moon-solar-system]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นลักษณะของดาวฤกษ์ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "มีแสงในตัวเอง", correct: true }
      - { id: b, text: "ดวงอาทิตย์เป็นดาวฤกษ์", correct: true }
      - { id: c, text: "เมื่อมองด้วยตามักเห็นกะพริบระยิบระยับ", correct: true }
      - { id: d, text: "โคจรรอบดวงอาทิตย์", feedback: "สิ่งที่โคจรรอบดวงอาทิตย์คือดาวเคราะห์ ดาวเคราะห์น้อย และดาวหาง ดาวฤกษ์อื่นอยู่ไกลออกไปมาก" }
      - { id: e, text: "สว่างเพราะสะท้อนแสงอาทิตย์", feedback: "นี่คือลักษณะของดาวเคราะห์และดวงจันทร์ ดาวฤกษ์มีแสงในตัวเอง" }
    hints:
      - "ดวงอาทิตย์มีแสงในตัวเองหรือไม่"
      - "ดาวเคราะห์สว่างเพราะอะไร"
    solution: "ดาวฤกษ์มีแสงในตัวเอง เช่น ดวงอาทิตย์ และมักเห็นกะพริบ ส่วนการโคจรรอบดวงอาทิตย์และการสะท้อนแสงอาทิตย์เป็นลักษณะของดาวเคราะห์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.moon-solar-system.p007
    topics: [earthscience.astronomy.moon-solar-system]
    difficulty: 2
    type: mcq
    stem: "ดาวเคราะห์ดวงใดใช้เวลาโคจรรอบดวงอาทิตย์ครบหนึ่งรอบนานที่สุด"
    choices:
      - { id: a, text: "ดาวเนปจูน", correct: true }
      - { id: b, text: "ดาวพฤหัสบดี", feedback: "ดาวพฤหัสบดีใหญ่ที่สุด แต่เวลาโคจรขึ้นกับระยะห่าง ดาวพฤหัสบดีโคจรรอบละราว 12 ปี" }
      - { id: c, text: "ดาวพุธ", feedback: "ดาวพุธอยู่ใกล้ดวงอาทิตย์ที่สุด จึงโคจรเร็วที่สุด รอบละ 88 วัน" }
      - { id: d, text: "โลก", feedback: "โลกโคจรรอบละ 1 ปี ดาวเคราะห์ที่อยู่ไกลกว่าโลกใช้เวลานานกว่า" }
    hints:
      - "ยิ่งไกลดวงอาทิตย์ ยิ่งใช้เวลาโคจรนาน"
      - "ดาวเคราะห์ดวงใดอยู่ไกลดวงอาทิตย์ที่สุด"
    solution: "ดาวเนปจูนอยู่ไกลดวงอาทิตย์ที่สุดในดาวเคราะห์ 8 ดวง จึงโคจรนานที่สุด รอบละประมาณ 165 ปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.moon-solar-system.p008
    topics: [earthscience.astronomy.moon-solar-system]
    difficulty: 3
    type: numeric
    stem: "วันนี้ดวงจันทร์ขึ้นเวลา 18.00 น. ถ้าดวงจันทร์ขึ้นช้าลงวันละประมาณ 50 นาที อีก 3 วันดวงจันทร์จะขึ้นช้ากว่าวันนี้รวมกี่นาที"
    answer: { value: 150, unit: นาที }
    misconceptions:
      - { match: 50, feedback: "50 นาทีคือช้าลงในหนึ่งวัน แต่โจทย์ถามสามวัน" }
      - { match: 200, feedback: "นับเกินไปหนึ่งวัน อีก 3 วันคือช้าลง 3 ครั้ง" }
    hints:
      - "หนึ่งวันช้าลง 50 นาที"
      - "สามวันช้าลงกี่เท่าของหนึ่งวัน"
    solution: "$3 \\times 50 = 150$ นาที หรือ 2 ชั่วโมง 30 นาที อีก 3 วันดวงจันทร์จึงขึ้นประมาณ 20.30 น."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.moon-solar-system.p009
    topics: [earthscience.astronomy.moon-solar-system]
    difficulty: 3
    type: mcq
    stem: "วันลอยกระทงตรงกับวันขึ้น 15 ค่ำ เดือน 12 ถ้ามะปรางอยากเห็นดวงจันทร์ขึ้นจากขอบฟ้า ควรมองไปทางใดและเวลาประมาณเท่าใด"
    choices:
      - { id: a, text: "ทิศตะวันออก ตอนพลบค่ำ ประมาณ 18.00 น.", correct: true }
      - { id: b, text: "ทิศตะวันตก ตอนพลบค่ำ", feedback: "ตอนพลบค่ำดวงอาทิตย์ตกทางทิศตะวันตก ส่วนดวงจันทร์เต็มดวงอยู่ด้านตรงข้ามกับดวงอาทิตย์ จึงขึ้นทางทิศตะวันออก" }
      - { id: c, text: "ทิศตะวันออก ตอนเที่ยงคืน", feedback: "ดวงจันทร์ที่ขึ้นตอนเที่ยงคืนคือดวงจันทร์ราวแรม 8 ค่ำ ดวงจันทร์เต็มดวงขึ้นตอนพลบค่ำ" }
      - { id: d, text: "ทิศตะวันออก ตอนเช้ามืด", feedback: "ตอนเช้ามืดดวงจันทร์เต็มดวงกำลังจะตกทางทิศตะวันตก" }
    hints:
      - "วันเพ็ญ ดวงจันทร์อยู่ด้านตรงข้ามกับดวงอาทิตย์เมื่อมองจากโลก"
      - "ขณะดวงอาทิตย์ตกทางทิศตะวันตก ด้านตรงข้ามคือทิศใด"
    solution: "วันเพ็ญดวงจันทร์อยู่ตรงข้ามกับดวงอาทิตย์ เมื่อดวงอาทิตย์ตกทางทิศตะวันตกตอนพลบค่ำ ดวงจันทร์จึงขึ้นทางทิศตะวันออกในเวลาใกล้กัน และอยู่บนท้องฟ้าทั้งคืน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.moon-solar-system.p010
    topics: [earthscience.astronomy.moon-solar-system]
    difficulty: 3
    type: numeric
    stem: "กลุ่มดาวฤกษ์ขึ้นเร็วขึ้นวันละประมาณ 4 นาที ในเวลา 30 วัน กลุ่มดาวเดิมจะขึ้นเร็วขึ้นประมาณกี่ชั่วโมง"
    answer: { value: 2, tolerance: 0.05, unit: ชั่วโมง }
    misconceptions:
      - { match: 120, feedback: "120 เป็นคำตอบในหน่วยนาที ต้องแปลงเป็นชั่วโมง" }
      - { match: 4, feedback: "4 นาทีคือหนึ่งวัน ต้องคูณด้วยจำนวนวัน" }
    hints:
      - "หาเวลารวมเป็นนาทีก่อน"
      - "1 ชั่วโมง = 60 นาที"
    solution: "$30 \\times 4 = 120$ นาที $= 120 \\div 60 = 2$ ชั่วโมง กลุ่มดาวที่เคยอยู่ตำแหน่งหนึ่งตอน 22.00 น. อีกเดือนหนึ่งจะอยู่ตำแหน่งเดิมตอนประมาณ 20.00 น."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.moon-solar-system.p011
    topics: [earthscience.astronomy.moon-solar-system]
    difficulty: 3
    type: mcq
    stem: "ตอนหัวค่ำ ต้นเห็น \"ดาวประจำเมือง\" สว่างมากทางทิศตะวันตก แสงนิ่งไม่ค่อยกะพริบ ดาวดวงนี้คืออะไร"
    choices:
      - { id: a, text: "ดาวศุกร์ ซึ่งเป็นดาวเคราะห์", correct: true }
      - { id: b, text: "ดาวฤกษ์ที่สว่างที่สุด", feedback: "ดาวประจำเมืองสว่างกว่าดาวฤกษ์ทุกดวงบนท้องฟ้ากลางคืน และแสงนิ่ง เพราะเป็นดาวเคราะห์ที่อยู่ใกล้" }
      - { id: c, text: "ดาวหาง", feedback: "ดาวหางมักเห็นเป็นฝ้ามีหาง และไม่ได้เห็นเป็นประจำ" }
      - { id: d, text: "ดวงจันทร์ของโลกดวงที่สอง", feedback: "โลกมีดวงจันทร์ดวงเดียว" }
    hints:
      - "ดาวที่แสงนิ่งไม่ค่อยกะพริบมักเป็นดาวเคราะห์"
      - "คนไทยเรียกดาวเคราะห์ดวงหนึ่งที่เห็นหลังดวงอาทิตย์ตกว่าดาวประจำเมือง"
    solution: "ดาวประจำเมืองคือดาวศุกร์ เป็นดาวเคราะห์ที่ไม่มีแสงในตัวเอง แต่สะท้อนแสงอาทิตย์และอยู่ใกล้โลก จึงสว่างมากและแสงค่อนข้างนิ่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.moon-solar-system.p012
    topics: [earthscience.astronomy.moon-solar-system]
    difficulty: 3
    type: text
    stem: "ดาวเคราะห์ที่มีขนาดใหญ่ที่สุดในระบบสุริยะคือดาวอะไร"
    accepted: ["ดาวพฤหัสบดี", "พฤหัสบดี", "ดาวพฤหัส", "พฤหัส", "jupiter"]
    misconceptions:
      - { match: "ดวงอาทิตย์", feedback: "ดวงอาทิตย์ใหญ่ที่สุดในระบบสุริยะ แต่เป็นดาวฤกษ์ ไม่ใช่ดาวเคราะห์" }
      - { match: "ดาวเสาร์", feedback: "ดาวเสาร์ใหญ่เป็นอันดับสอง ดูวงแหวนแล้วอาจคิดว่าใหญ่ที่สุด" }
    hints:
      - "เป็นดาวเคราะห์ชั้นนอกดวงแรกถัดจากแถบดาวเคราะห์น้อย"
      - "โคจรรอบดวงอาทิตย์รอบละประมาณ 12 ปี"
    solution: "ดาวพฤหัสบดีเป็นดาวเคราะห์ที่ใหญ่ที่สุด อยู่ถัดจากแถบดาวเคราะห์น้อย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.moon-solar-system.p013
    topics: [earthscience.astronomy.moon-solar-system]
    difficulty: 4
