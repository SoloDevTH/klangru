# หัวข้อในคลังที่สอนเนื้อหาของคำถามเกณฑ์ Baldrige 2026 บางส่วน
framework: baldrige-award-2026
mappings:
  - topic: management.quality.qc-tools
    indicators: ["4.P1"]
    coverage: partial
    note: "ติดตามและวิเคราะห์ผลการดำเนินการระดับกระบวนการด้วยเครื่องมือคุณภาพและแผนภูมิควบคุม ยังไม่มีการทบทวนผลระดับองค์กร"
  - topic: management.operations.lean
    indicators: ["6.P3"]
    coverage: partial
    note: "จัดการและปรับปรุงประสิทธิภาพของกระบวนการทำงานด้วยลีนและไคเซ็น"
  - topic: management.operations.maintenance-reliability
    indicators: [6.P5]
    coverage: partial
    note: ความต่อเนื่องเมื่อเกิดเหตุฉุกเฉิน ระบบสำรอง และการซ้อม (p015 p016) การบริหารความเสี่ยงทั่วไปอยู่ใน iso-management-systems
  - topic: management.org.leadership-motivation
    indicators: [1.P1, 1.P3]
    coverage: partial
    note: ผู้นำกำหนดและสื่อสารวิสัยทัศน์และค่านิยม (p017) ระบบการนำเต็มรูปแบบอยู่ใน excellence-self-assessment
  - topic: management.quality.quality-planning
    indicators: [3.P1, 3.P4, 6.P1, 6.P2]
    coverage: full
    note: วิธีรับฟังเชิงรับและเชิงรุก รวมการสังเกตการใช้งานจริง
  - topic: management.quality.quality-planning
    indicators: [3.P2, 3.P3]
    coverage: partial
    note: กล่าวถึงความสัมพันธ์และความภักดีหลังการแก้ไขข้อร้องเรียน ยังไม่ได้สอนการได้มาและรักษาลูกค้า
  - topic: management.hr.human-resource-management
    indicators: [5.P2]
    coverage: partial
    note: การเรียนรู้และพัฒนา ประเมินผลการอบรม เส้นทางความก้าวหน้า (p015) ยังไม่ได้สอนการพัฒนาผู้นำ
  - topic: management.hr.human-resource-management
    indicators: [5.P3]
    coverage: full
    note: เตรียมขีดความสามารถและอัตรากำลังต่อการเปลี่ยนแปลงรวมปัญญาประดิษฐ์ (p016) และวางแผนอัตรากำลัง
  - topic: management.org.organizational-behavior
    indicators: [5.P1]
    coverage: partial
    note: วัฒนธรรมองค์การ การวัดความผูกพัน (p011) และวัฒนธรรมที่กล้ารายงานปัญหา ยังไม่ได้สอนระบบจัดการผลการปฏิบัติงานซึ่งอยู่ใน human-resource-management
