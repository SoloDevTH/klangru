id: math.geometry.proof
subject: math
title: { th: การพิสูจน์ทางเรขาคณิต, en: Geometric proof }
summary: ให้เหตุผลแบบนิรนัยกับรูปเรขาคณิต พิสูจน์สมบัติของมุม เส้นขนาน สามเหลี่ยม และสี่เหลี่ยมด้านขนาน ใช้การแปลงอธิบายความเท่ากันทุกประการและความคล้าย พิสูจน์ด้วยพิกัด และให้เหตุผลของสูตรพื้นที่และปริมาตร
difficulty: 5.5
minutes: 40
prerequisites: [math.geometry.triangles, math.geometry.constructions, math.geometry.quadrilaterals, math.logic.propositions]
encompasses:
  - { id: math.geometry.triangles, weight: 0.4 }
  - { id: math.geometry.quadrilaterals, weight: 0.3 }
  - { id: math.geometry.constructions, weight: 0.1 }
  - { id: math.logic.propositions, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: angle-sum.svg
    alt: "สามเหลี่ยม ABC มี A อยู่ด้านบน B ล่างซ้าย C ล่างขวา เส้นตรง DE ลากผ่าน A ขนานกับ BC มีลูกศรบอกว่าขนาน มุมที่ A แบ่งเป็นสามมุม มุม 1 ระหว่าง AD กับ AB มุม 2 คือมุม BAC และมุม 3 ระหว่าง AC กับ AE มุม B และมุม C ทำเครื่องหมายไว้ที่ฐาน"
    caption: "∠1 = ∠B และ ∠3 = ∠C เพราะเป็นมุมแย้ง ส่วน ∠1 + ∠2 + ∠3 = 180° เพราะรวมกันเป็นมุมตรง"
  - type: worked-example
    title: พิสูจน์ว่าด้านตรงข้ามของสี่เหลี่ยมด้านขนานยาวเท่ากัน
    problem: "กำหนดให้ ABCD เป็นสี่เหลี่ยมด้านขนาน (AB ∥ DC และ AD ∥ BC) จงพิสูจน์ว่า AB = CD และ AD = CB"
    figure:
      src: parallelogram.svg
      alt: "สี่เหลี่ยมด้านขนาน ABCD มีเส้นทแยงมุม AC เป็นเส้นประ มุม 1 คือมุม CAB และมุม 2 คือมุม ACD ระบายสีแดงเหมือนกัน มุม 3 คือมุม DAC และมุม 4 คือมุม ACB ระบายสีน้ำเงินเหมือนกัน"
    steps:
      - text: "ลากเส้นทแยงมุม AC แบ่งรูปเป็น △ABC และ △CDA"
        why: "เราพิสูจน์ความเท่ากันของด้านผ่านสามเหลี่ยมที่เท่ากันทุกประการ"
      - text: "∠1 = ∠2 (∠CAB = ∠ACD) เพราะ AB ∥ DC และเป็นมุมแย้ง"
      - text: "∠4 = ∠3 (∠ACB = ∠CAD) เพราะ AD ∥ BC และเป็นมุมแย้ง"
      - text: "AC = CA เป็นด้านร่วม"
      - text: "△ABC ≅ △CDA ตามเงื่อนไข ม.ด.ม."
        why: "มุมสองมุมกับด้านที่อยู่ระหว่างมุมทั้งสอง (ด้าน AC อยู่ระหว่าง ∠1 กับ ∠4 และระหว่าง ∠2 กับ ∠3)"
      - text: "ด้านที่สมนัยกันของรูปที่เท่ากันทุกประการยาวเท่ากัน จึงได้ AB = CD และ BC = DA"
    answer: "AB = CD และ AD = CB"
  - { type: check, problem: math.geometry.proof.p002, prompt: "มุมตรงข้ามมีสมบัติอย่างไร" }
  - type: figure
    src: perp-bisector.svg
    alt: "ส่วนของเส้นตรง AB มีจุดกึ่งกลาง M ขีดบอกว่า AM เท่ากับ MB เส้นตรง l ตั้งฉากกับ AB ที่ M มีเครื่องหมายมุมฉาก จุด P อยู่บนเส้น l ลากเส้น PA และ PB"
    caption: "จุด P ใด ๆ บนเส้นแบ่งครึ่งตั้งฉาก l อยู่ห่างจาก A และ B เท่ากัน"
  - type: worked-example
    title: พิสูจน์ด้วยพิกัดว่าเป็นรูปสี่เหลี่ยมขนมเปียกปูน
    problem: "จุด A(1, 1), B(5, 2), C(6, 6), D(2, 5) จงพิสูจน์ว่า ABCD เป็นรูปสี่เหลี่ยมขนมเปียกปูน และตรวจว่าเส้นทแยงมุมตั้งฉากกันหรือไม่"
    steps:
      - text: "เวกเตอร์ของด้าน: AB = (4, 1), DC = (4, 1), AD = (1, 4), BC = (1, 4) ด้านตรงข้ามขนานและยาวเท่ากัน ABCD จึงเป็นสี่เหลี่ยมด้านขนาน"
        why: "การเลื่อนเท่ากันแปลว่าทิศเดียวกันและยาวเท่ากัน"
      - text: "AB = $\\sqrt{4^2 + 1^2} = \\sqrt{17}$ และ AD = $\\sqrt{1^2 + 4^2} = \\sqrt{17}$ ด้านประชิดยาวเท่ากัน จึงยาวเท่ากันทั้งสี่ด้าน"
      - text: "สี่เหลี่ยมด้านขนานที่ด้านยาวเท่ากันทั้งสี่ด้านคือสี่เหลี่ยมขนมเปียกปูน"
      - text: "เส้นทแยงมุม AC = (5, 5) ความชัน 1 และ BD = (−3, 3) ความชัน −1 ผลคูณความชันเป็น −1 จึงตั้งฉากกัน"
        why: "เป็นสมบัติของสี่เหลี่ยมขนมเปียกปูนทุกรูป การคำนวณนี้จึงช่วยตรวจผล"
      - text: "AC = $5\\sqrt2$ แต่ BD = $3\\sqrt2$ ไม่เท่ากัน จึงไม่ใช่สี่เหลี่ยมจัตุรัส"
    answer: "ABCD เป็นสี่เหลี่ยมขนมเปียกปูน (ไม่ใช่สี่เหลี่ยมจัตุรัส) เส้นทแยงมุมตั้งฉากกัน"
  - type: figure
    src: circle-sectors.svg
    alt: "ซ้าย: วงกลมรัศมี r ตัดเป็น 12 เซกเตอร์เท่ากัน สลับสีน้ำเงินกับส้ม ขวา: นำเซกเตอร์มาเรียงสลับหัวท้ายเป็นแถว ได้รูปคล้ายสี่เหลี่ยมด้านขนาน สูงประมาณ r ฐานยาวประมาณครึ่งหนึ่งของเส้นรอบวง คือ πr"
    caption: "ยิ่งตัดเซกเตอร์ให้เล็กลง รูปยิ่งใกล้สี่เหลี่ยมด้านขนานที่มีพื้นที่ πr × r"
  - { type: check, problem: math.geometry.proof.p005, prompt: "ขั้นใดต้องมาก่อนจึงจะใช้เงื่อนไข ด.ม.ด. ได้" }
glossary:
  - { term: การให้เหตุผลแบบนิรนัย, definition: "การสรุปจากนิยาม สิ่งที่กำหนดให้ และทฤษฎีบทที่พิสูจน์แล้ว ทีละขั้น ข้อสรุปจึงจริงทุกกรณี" }
  - { term: การให้เหตุผลแบบอุปนัย, definition: "การสรุปจากตัวอย่างหรือการสังเกตหลายครั้ง ใช้ตั้งข้อคาดการณ์ได้ แต่ไม่ใช่การพิสูจน์" }
  - { term: บทกลับ, definition: "ข้อความที่สลับส่วน 'ถ้า' กับ 'แล้ว' ของข้อความเดิม อาจจริงหรือไม่จริงก็ได้" }
  - { term: การแปลงที่ไม่เปลี่ยนระยะ, definition: "การเลื่อนขนาน การหมุน และการสะท้อน ใช้นิยามความเท่ากันทุกประการ" }
  - { term: หลักของคาวาเลียรี, definition: "ทรงตันที่สูงเท่ากันและมีพื้นที่หน้าตัดเท่ากันทุกระดับความสูง มีปริมาตรเท่ากัน" }
flashcards:
  - { front: "ทำไมมุมตรงข้ามจึงเท่ากัน", back: "แต่ละมุมรวมกับมุมที่อยู่ระหว่างกลางได้ 180° (มุมตรง) จึงเท่ากัน" }
  - { front: "พิสูจน์ผลบวกมุมภายในสามเหลี่ยม 180° ต้องลากเส้นอะไรเพิ่ม", back: "เส้นผ่านจุดยอดหนึ่งที่ขนานกับด้านตรงข้าม แล้วใช้มุมแย้ง" }
  - { front: "สี่เหลี่ยมด้านขนานเป็นสี่เหลี่ยมผืนผ้าเมื่อใด", back: "เมื่อเส้นทแยงมุมยาวเท่ากัน" }
  - { front: "ทำไมวงกลมทุกวงจึงคล้ายกัน", back: "เลื่อนจุดศูนย์กลางให้ทับกัน แล้วขยายด้วยอัตราส่วนของรัศมี" }
  - { front: "ปริมาตรพีระมิดเป็นกี่เท่าของปริซึมที่ฐานและสูงเท่ากัน", back: "1/3 (ลูกบาศก์ตัดเป็นพีระมิดที่เท่ากันได้ 3 อัน)" }
