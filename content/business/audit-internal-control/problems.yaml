problems:
- id: business.accounting.audit-internal-control.p001
  topics:
  - business.accounting.audit-internal-control
  difficulty: 1
  type: match
  stem: จับคู่องค์ประกอบของการควบคุมภายในกับตัวอย่าง
  pairs:
  - left: สภาพแวดล้อมการควบคุม
    right: เจ้าของร้านทำตัวอย่างซื่อสัตย์และมีจรรยาบรรณให้พนักงานถือปฏิบัติ
  - left: การประเมินความเสี่ยง
    right: ระบุว่าเงินสดหน้าร้านและสินค้าราคาแพงมีโอกาสสูญหายมากที่สุด
  - left: กิจกรรมการควบคุม
    right: ให้คนที่ไม่ได้รับเงินเป็นผู้นับเงินและเทียบกับรายงานเครื่องขายทุกเย็น
  - left: สารสนเทศและการสื่อสาร
    right: แจ้งนโยบายการให้ส่วนลดในกลุ่มแชตพนักงานและมีรายงานส่วนลดรายวัน
  - left: กิจกรรมการติดตามผล
    right: ผู้จัดการสุ่มตรวจนับสต็อกทุกเดือนและแก้จุดอ่อนที่พบ
  hints:
  - สภาพแวดล้อมคือวัฒนธรรมและแบบอย่างจากผู้บริหาร
  - กิจกรรมการควบคุมคือการกระทำที่ป้องกันหรือค้นพบข้อผิดพลาดในงานประจำ
  solution: แบบอย่างของเจ้าของ → สภาพแวดล้อม · ระบุจุดเสี่ยง → ประเมินความเสี่ยง · นับเงินโดยคนอื่น → กิจกรรมการควบคุม · แจ้งนโยบายและรายงาน → สารสนเทศและการสื่อสาร · สุ่มตรวจและแก้ไข → ติดตามผล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.audit-internal-control.p002
  topics:
  - business.accounting.audit-internal-control
  difficulty: 1
  type: mcq
  stem: ข้อใด **ขัดกับหลักการแบ่งแยกหน้าที่** มากที่สุด
  choices:
  - id: a
    text: พนักงานคนเดียวรับเงินจากลูกค้า บันทึกบัญชีลูกหนี้ และกระทบยอดบัญชีธนาคารเอง
    correct: true
  - id: b
    text: พนักงานขายรับเงิน ส่วนพนักงานบัญชีบันทึกรายการ
    feedback: เป็นการแบ่งหน้าที่ดูแลเงินกับหน้าที่บันทึกออกจากกัน
  - id: c
    text: ผู้จัดการอนุมัติใบสั่งซื้อ ฝ่ายคลังรับของ
    feedback: คนอนุมัติกับคนดูแลทรัพย์สินแยกกัน
  - id: d
    text: เจ้าของร้านตรวจรายการเดินบัญชีธนาคารทุกเดือน
    feedback: เป็นการติดตามผลที่ดี
  hints:
  - 'หน้าที่สี่อย่างที่ควรแยก: อนุมัติ ดูแลทรัพย์สิน บันทึก กระทบยอด'
  - ถ้าคนเดียวทั้งรับเงินและบันทึก จะซ่อนการยักยอกได้ไหม
  solution: คนที่ทั้งรับเงิน บันทึกบัญชี และกระทบยอดเอง สามารถยักยอกเงินแล้วแก้บัญชีปิดบังได้โดยไม่มีใครเห็น ควรแยกหน้าที่ดูแลเงิน บันทึก และกระทบยอดให้คนต่างกัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.audit-internal-control.p003
  topics:
  - business.accounting.audit-internal-control
  difficulty: 2
  type: mcq
  stem: พนักงานบัญชีมีหนี้บัตรเครดิตมาก (1) รู้ว่าไม่มีใครตรวจใบสำคัญจ่าย (2) และคิดว่า "บริษัทเอาเปรียบเรา เอาคืนนิดหน่อยไม่เป็นไร" (3) ข้อใดจับคู่กับสามเหลี่ยมการทุจริตถูกต้อง
  choices:
  - id: a
    text: (1) แรงกดดัน (2) โอกาส (3) การหาเหตุผลเข้าข้างตนเอง
    correct: true
  - id: b
    text: (1) โอกาส (2) แรงกดดัน (3) การหาเหตุผลเข้าข้างตนเอง
    feedback: หนี้สินเป็นแรงกดดัน ส่วนการไม่มีใครตรวจคือโอกาส
  - id: c
    text: (1) การหาเหตุผล (2) โอกาส (3) แรงกดดัน
    feedback: ความคิดว่าบริษัทเอาเปรียบคือการหาเหตุผลเข้าข้างตนเอง
  - id: d
    text: (1) แรงกดดัน (2) การหาเหตุผล (3) โอกาส
    feedback: การไม่มีใครตรวจคือโอกาส
  hints:
  - สามเหลี่ยมการทุจริตมี แรงกดดัน โอกาส และการหาเหตุผล
  - องค์กรควบคุมด้านใดได้มากที่สุด
  solution: หนี้สิน → **แรงกดดัน** · ไม่มีใครตรวจ → **โอกาส** · "เอาคืนนิดหน่อย" → **การหาเหตุผลเข้าข้างตนเอง** การควบคุมภายในลดโอกาสได้โดยตรง เช่น ให้มีผู้ตรวจและอนุมัติใบสำคัญจ่าย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.audit-internal-control.p004
  topics:
  - business.accounting.audit-internal-control
  difficulty: 2
  type: match
  stem: จับคู่สถานการณ์กับประเภทความเห็นของผู้สอบบัญชี
  pairs:
  - left: ไม่พบข้อผิดพลาดที่มีสาระสำคัญ หลักฐานเพียงพอ
    right: ไม่มีเงื่อนไข
  - left: สินค้าคงเหลือแสดงสูงไปอย่างมีสาระสำคัญ แต่กระทบเฉพาะรายการนี้
    right: มีเงื่อนไข
  - left: งบการเงินผิดหลายรายการจนภาพรวมทำให้ผู้ใช้เข้าใจผิด
    right: งบการเงินไม่ถูกต้อง
  - left: เอกสารบัญชีเกือบทั้งหมดสูญหาย หาหลักฐานไม่ได้เลย
    right: ไม่แสดงความเห็น
  hints:
  - 'แยกสองเรื่อง: งบผิด หรือหาหลักฐานไม่ได้'
  - และผลกระทบแพร่หลายหรือไม่
  solution: ไม่มีปัญหา → ไม่มีเงื่อนไข · ผิดมีสาระสำคัญแต่ไม่แพร่หลาย → มีเงื่อนไข · ผิดและแพร่หลาย → งบการเงินไม่ถูกต้อง · หาหลักฐานไม่ได้และแพร่หลาย → ไม่แสดงความเห็น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.audit-internal-control.p005
  topics:
  - business.accounting.audit-internal-control
  difficulty: 2
  type: numeric
  stem: สต็อกปูนซีเมนต์ตามบัญชีของร้าน (สมมติ) มี $1{,}250$ ถุง ตรวจนับจริงได้ $1{,}190$ ถุง สินค้าขาดหายคิดเป็นร้อยละเท่าไรของยอดตามบัญชี (ตอบเป็น %)
  answer:
    value: 4.8
    tolerance: 0.048
    unit: '%'
  misconceptions:
  - match: 5.042017
    feedback: หารด้วยยอดนับจริง ต้องหารด้วยยอดตามบัญชี
  hints:
  - ขาดหาย $=$ ตามบัญชี $-$ นับจริง
  - หารด้วยยอดตามบัญชี แล้วคูณ $100$
  solution: ขาด $= 1{,}250 - 1{,}190 = 60$ ถุง คิดเป็น $\dfrac{60}{1{,}250} \times 100 = 4.80\%$ ต้องหาสาเหตุ เช่น บันทึกขายไม่ครบ ของเสีย หรือการลักขโมย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.audit-internal-control.p006
  topics:
  - business.accounting.audit-internal-control
  difficulty: 3
  type: numeric
  stem: บริษัท (สมมติ) มีกำไรก่อนภาษี $4{,}800{,}000$ บาท ผู้สอบบัญชีใช้ดุลยพินิจกำหนดความมีสาระสำคัญโดยรวมที่ $5\%$ ของกำไรก่อนภาษี และความมีสาระสำคัญในการปฏิบัติงานที่ $75\%$ ของความมีสาระสำคัญโดยรวม ความมีสาระสำคัญในการปฏิบัติงานเป็นกี่บาท (ตอบเป็นบาท)
  answer:
    value: 180000
    unit: บาท
  misconceptions:
  - match: 240000
    feedback: นั่นคือความมีสาระสำคัญโดยรวม ยังไม่ได้คูณ 75%
  - match: 1800000
    feedback: ใช้ 50% แทน 5%
  hints:
  - 'หาความมีสาระสำคัญโดยรวมก่อน: $4{,}800{,}000 \times 0.05$'
  - คูณผลด้วย $0.75$
  solution: โดยรวม $= 4{,}800{,}000 \times 0.05 = 240{,}000$ บาท · ในการปฏิบัติงาน $= 240{,}000 \times 0.75 = 180{,}000$ บาท ตั้งต่ำกว่าเพื่อเผื่อข้อผิดพลาดที่ตรวจไม่พบ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.audit-internal-control.p007
  topics:
  - business.accounting.audit-internal-control
  difficulty: 3
  type: numeric
  stem: ผู้สอบบัญชีสุ่มใบสำคัญจ่าย $60$ ฉบับเพื่อทดสอบว่ามีลายมือชื่อผู้อนุมัติครบหรือไม่ พบ $4$ ฉบับไม่มีผู้อนุมัติ อัตราการเบี่ยงเบนในตัวอย่างเป็นร้อยละเท่าไร (ตอบเป็น %)
  answer:
    value: 6.666667
    tolerance: 0.0667
    unit: '%'
  misconceptions:
  - match: 7.142857
    feedback: หารด้วยจำนวนที่ถูกต้อง ต้องหารด้วยขนาดตัวอย่างทั้งหมด
  hints:
  - อัตราเบี่ยงเบน $= \dfrac{\text{จำนวนที่ผิด}}{\text{ขนาดตัวอย่าง}}$
  - คูณ $100$
  solution: $\dfrac{4}{60} \times 100 = 6.67\%$ ถ้าอัตราที่ยอมรับได้คือ $5\%$ ผลที่พบสูงกว่า ผู้สอบบัญชีจึงเชื่อถือการควบคุมนี้ไม่ได้ และต้องเพิ่มการตรวจสอบเนื้อหาสาระ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.audit-internal-control.p008
  topics:
  - business.accounting.audit-internal-control
  difficulty: 3
  type: order
  stem: เรียงขั้นตอนการสอบบัญชีงบการเงินตามลำดับ
  items:
  - พิจารณารับงานและยืนยันความเป็นอิสระ
  - วางแผนงานและกำหนดความมีสาระสำคัญ
  - ประเมินความเสี่ยงที่งบการเงินจะแสดงข้อมูลขัดต่อข้อเท็จจริง
  - ทดสอบการควบคุมและตรวจสอบเนื้อหาสาระ
  - ประเมินข้อผิดพลาดที่พบและสรุปผล
  - ออกรายงานของผู้สอบบัญชี
  hints:
  - ต้องเข้าใจกิจการและความเสี่ยงก่อนเลือกวิธีตรวจ
  - รายงานเป็นขั้นสุดท้าย
  solution: รับงาน → วางแผน → ประเมินความเสี่ยง → ตอบสนองด้วยการทดสอบ → สรุปผล → รายงาน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.audit-internal-control.p009
  topics:
  - business.accounting.audit-internal-control
  difficulty: 3
  type: mcq
  stem: ข้อใดสอดคล้องกับ **หลักการกำกับดูแลกิจการที่ดี** (เลือกได้มากกว่าหนึ่งข้อ)
  multiple: true
  choices:
  - id: a
    text: เปิดเผยงบการเงินและข้อมูลสำคัญอย่างถูกต้อง ทันเวลา และโปร่งใส
    correct: true
  - id: b
    text: ปฏิบัติต่อผู้ถือหุ้นทุกรายอย่างเท่าเทียม รวมถึงผู้ถือหุ้นรายย่อย
    correct: true
  - id: c
    text: มีคณะกรรมการตรวจสอบที่เป็นอิสระดูแลรายงานทางการเงินและการควบคุมภายใน
    correct: true
  - id: d
    text: คำนึงถึงผู้มีส่วนได้ส่วนเสีย เช่น พนักงาน ลูกค้า เจ้าหนี้ และชุมชน
    correct: true
  - id: e
    text: ให้ผู้บริหารสูงสุดเป็นทั้งผู้อนุมัติ ผู้บันทึก และผู้ตรวจสอบงบการเงินเอง เพื่อความรวดเร็ว
    feedback: ขัดหลักการถ่วงดุลและการแบ่งแยกหน้าที่
  hints:
  - 'หลักสำคัญ: ความรับผิดชอบ ความโปร่งใส ความเป็นธรรม และการคำนึงถึงผู้มีส่วนได้ส่วนเสีย'
  - ใครควรตรวจสอบผู้บริหาร
  solution: การเปิดเผยข้อมูล ความเท่าเทียมของผู้ถือหุ้น คณะกรรมการตรวจสอบที่อิสระ และการคำนึงถึงผู้มีส่วนได้ส่วนเสีย ล้วนเป็นหลักการกำกับดูแลที่ดี ส่วนข้อ จ รวมอำนาจไว้ที่คนเดียวโดยไม่มีการถ่วงดุล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.accounting.audit-internal-control.p010
  topics:
  - business.accounting.audit-internal-control
  difficulty: 3
  type: mcq
  stem: จากตารางความเสี่ยงในภาพ ถ้าให้คะแนนความเสี่ยง $=$ โอกาสเกิด $\times$ ผลกระทบ ร้านควรจัดการความเสี่ยงใด **เป็นอันดับแรก**
  figure:
    src: p-risk-matrix.svg
    alt: ตารางความเสี่ยง 5 คูณ 5 ของร้านวัสดุก่อสร้าง (สมมติ) แกนนอนคือโอกาสเกิด 1 ถึง 5 แกนตั้งคือผลกระทบ 1 ถึง 5 สีของช่องไล่จากเขียว (คะแนนต่ำ) ไปแดง (คะแนนสูง) ความเสี่ยง A อยู่ที่โอกาสเกิด 2 ผลกระทบ 5 ความเสี่ยง B อยู่ที่โอกาสเกิด 4 ผลกระทบ 4 ความเสี่ยง C อยู่ที่โอกาสเกิด 5 ผลกระทบ 2 ความเสี่ยง D อยู่ที่โอกาสเกิด 3 ผลกระทบ 3 ความเสี่ยง E อยู่ที่โอกาสเกิด 1 ผลกระทบ 4
  choices:
  - id: a
    text: A ไฟไหม้โกดัง
    feedback: คะแนน $= 2 \times 5 = 10$ ต่ำกว่า B
  - id: b
    text: B พนักงานขายให้ส่วนลดเกินอำนาจและรับเงินสดเอง
    correct: true
  - id: c
    text: C ลูกค้าจ่ายช้าเล็กน้อย
    feedback: คะแนน $= 5 \times 2 = 10$ ต่ำกว่า B
  - id: d
    text: D ราคาเหล็กขึ้นลงเร็ว
    feedback: คะแนน $= 3 \times 3 = 9$ ต่ำกว่า B
  - id: e
    text: E ระบบบัญชีล่ม 1 วัน
    feedback: คะแนน $= 1 \times 4 = 4$ ต่ำกว่า B
  hints:
  - อ่านโอกาสเกิดและผลกระทบของแต่ละจุด แล้วคูณกัน
  - ความเสี่ยงที่ผลกระทบสูงแต่โอกาสต่ำ อาจคะแนนน้อยกว่าที่คิด
  solution: 'คะแนน: A $= 2 \times 5 = 10$ · B $= 4 \times 4 = 16$ · C $= 5 \times 2 = 10$ · D $= 3 \times 3 = 9$ · E $= 1 \times 4 = 4$ ความเสี่ยง B สูงสุด ควรจัดการก่อน เช่น จำกัดอำนาจให้ส่วนลด ให้รับเงินผ่านเครื่องขายและคิวอาร์ และตรวจรายงานส่วนลดทุกวัน ส่วน A แม้คะแนนรองลงมาแต่รุนแรงมาก ควรโอนความเสี่ยงด้วยประกันอัคคีภัย'
