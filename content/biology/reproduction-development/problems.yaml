problems:
  - id: biology.animals.reproduction-development.p001
    topics: [biology.animals.reproduction-development]
    difficulty: 1
    type: match
    stem: "จับคู่สัตว์กับวิธีการสืบพันธุ์"
    pairs:
      - { left: "ไฮดรา", right: "การแตกหน่อ" }
      - { left: "พลานาเรีย", right: "การขาดเป็นท่อนแล้วงอกใหม่" }
      - { left: "ผึ้งตัวผู้", right: "เจริญจากไข่ที่ไม่ได้รับการผสม (พาร์ทีโนเจเนซิส)" }
      - { left: "ปลานิล", right: "การปฏิสนธิภายนอกในน้ำ" }
    hints:
      - "สามแบบแรกเป็นการสืบพันธุ์แบบไม่อาศัยเพศ"
      - "ปลาส่วนใหญ่ปล่อยไข่และอสุจิลงในน้ำ"
    solution: "ไฮดราแตกหน่อ พลานาเรียขาดเป็นท่อนแล้วงอกใหม่ ผึ้งตัวผู้เจริญจากไข่ที่ไม่ได้รับการผสม และปลานิลปฏิสนธิภายนอกในน้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.reproduction-development.p002
    topics: [biology.animals.reproduction-development]
    difficulty: 1
    type: mcq
    stem: "ในมนุษย์ การปฏิสนธิเกิดขึ้นที่อวัยวะใดตามปกติ"
    choices:
      - { id: a, text: "ท่อนำไข่", correct: true }
      - { id: b, text: "มดลูก", feedback: "มดลูกเป็นที่ฝังตัวและเจริญของเอ็มบริโอ การปฏิสนธิเกิดก่อนหน้านั้น" }
      - { id: c, text: "รังไข่", feedback: "รังไข่ปล่อยโอโอไซต์ออกมา แต่ไม่ใช่ที่เกิดการปฏิสนธิ" }
      - { id: d, text: "ช่องคลอด", feedback: "สเปิร์มต้องเดินทางต่อผ่านมดลูกไปพบเซลล์ไข่" }
    hints:
      - "เซลล์ไข่ที่ตกจากรังไข่ถูกพัดเข้าสู่ท่อใด"
      - "เอ็มบริโอใช้เวลาหลายวันเดินทางไปฝังตัวที่มดลูก"
    solution: "การปฏิสนธิเกิดที่ท่อนำไข่ จากนั้นเอ็มบริโอเคลื่อนไปฝังตัวที่ผนังมดลูกราววันที่ 6–7"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.reproduction-development.p003
    topics: [biology.animals.reproduction-development]
    difficulty: 1
    type: text
    stem: "ระยะที่ไซโกตแบ่งเซลล์แบบไมโทซิสหลายครั้งติดต่อกันอย่างรวดเร็ว โดยเซลล์ไม่โตขึ้น เรียกว่าอะไร"
    accepted: ["คลีเวจ", "การแบ่งเซลล์แบบคลีเวจ", "cleavage"]
    hints:
      - "เป็นระยะแรกของการเจริญเติบโตระยะเอ็มบริโอ"
      - "ผลของระยะนี้คือก้อนเซลล์มอรูลา"
    misconceptions:
      - { match: "แกสทรูลา", feedback: "แกสทรูลาเป็นระยะที่เซลล์เคลื่อนที่จนเกิดเนื้อเยื่อ 3 ชั้น ซึ่งเกิดหลังคลีเวจ" }
      - { match: "ไมโอซิส", feedback: "ไซโกตแบ่งแบบไมโทซิส ไม่ใช่ไมโอซิส จำนวนโครโมโซมจึงคงเดิม" }
    solution: "คลีเวจ ไซโกตแบ่งแบบไมโทซิสต่อเนื่องโดยไม่มีการเติบโตระหว่างรอบ เซลล์จึงเล็กลงเรื่อย ๆ จนได้มอรูลา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.reproduction-development.p004
    topics: [biology.animals.reproduction-development]
    difficulty: 2
    type: numeric
    stem: "โอโอไซต์ระยะแรก 10 เซลล์แบ่งไมโอซิสจนเสร็จสมบูรณ์ จะได้เซลล์ไข่มากที่สุดกี่เซลล์"
    answer: { value: 10, unit: เซลล์ }
    hints:
      - "ไมโอซิสของเซลล์ไข่แบ่งไซโทพลาซึมไม่เท่ากัน"
      - "โอโอไซต์ระยะแรก 1 เซลล์ให้เซลล์ไข่ได้กี่เซลล์ ที่เหลือเป็นอะไร"
    misconceptions:
      - { match: 40, feedback: "คิดเหมือนการสร้างสเปิร์มที่ได้ 4 เซลล์ แต่การสร้างเซลล์ไข่ได้เซลล์ไข่เพียง 1 เซลล์ ที่เหลือเป็นโพลาร์บอดี" }
      - { match: 20, feedback: "ไมโอซิส I ได้โอโอไซต์ระยะที่สอง 1 เซลล์กับโพลาร์บอดี ไม่ใช่โอโอไซต์ 2 เซลล์" }
    solution: "โอโอไซต์ระยะแรก 1 เซลล์ให้เซลล์ไข่ 1 เซลล์กับโพลาร์บอดีที่สลายไป 10 เซลล์จึงให้เซลล์ไข่ได้มากที่สุด 10 เซลล์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.reproduction-development.p005
    topics: [biology.animals.reproduction-development]
    difficulty: 2
    type: numeric
    stem: "โอโอไซต์ระยะที่สองที่ตกจากรังไข่ของหญิงคนหนึ่งมีโครโมโซมกี่แท่ง (เซลล์ร่างกายมี 46 แท่ง)"
    answer: { value: 23, unit: แท่ง }
    hints:
      - "โอโอไซต์ระยะที่สองเกิดหลังไมโอซิส I"
      - "ไมโอซิส I แยกฮอมอโลกัสโครโมโซมออกจากกัน"
    misconceptions:
      - { match: 46, feedback: "จำนวนโครโมโซมลดลงครึ่งหนึ่งแล้วในไมโอซิส I แม้ไมโอซิส II ยังไม่เสร็จ" }
      - { match: 92, feedback: "นับโครมาทิดของเซลล์ 2n ให้นับโครโมโซมจากจำนวนเซนโทรเมียร์" }
    solution: "ไมโอซิส I ลดจำนวนโครโมโซมเป็นครึ่งหนึ่ง โอโอไซต์ระยะที่สองจึงมี 23 แท่ง (แต่ละแท่งยังมี 2 โครมาทิดจนกว่าไมโอซิส II จะเสร็จ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.reproduction-development.p006
    topics: [biology.animals.reproduction-development]
    difficulty: 2
    type: mcq
    stem: "สมองและไขสันหลังของเอ็มบริโอเจริญมาจากเนื้อเยื่อชั้นต้นกำเนิดชั้นใด"
    choices:
      - { id: a, text: "เอกโทเดิร์ม", correct: true }
      - { id: b, text: "มีโซเดิร์ม", feedback: "มีโซเดิร์มเจริญเป็นกล้ามเนื้อ กระดูก หัวใจ เลือด และไต" }
      - { id: c, text: "เอนโดเดิร์ม", feedback: "เอนโดเดิร์มเจริญเป็นเยื่อบุทางเดินอาหาร ปอด และตับ" }
    hints:
      - "หลอดประสาทเกิดจากเนื้อเยื่อด้านหลังที่ม้วนตัวเข้าไป"
      - "เนื้อเยื่อชั้นเดียวกันนี้เจริญเป็นผิวหนังชั้นนอกด้วย"
    solution: "เอกโทเดิร์มด้านหลังม้วนตัวเป็นหลอดประสาท แล้วเจริญเป็นสมองและไขสันหลัง เอกโทเดิร์มยังเจริญเป็นผิวหนังชั้นนอก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.reproduction-development.p007
    topics: [biology.animals.reproduction-development]
    difficulty: 2
    type: mcq
    stem: "จากภาพไข่ไก่ระหว่างฟัก โครงสร้างใดเก็บกรดยูริกที่เอ็มบริโอขับออกมา"
    figure: { src: chick-membranes-letters.svg, alt: "ภาพตัดไข่ไก่ระหว่างฟัก มีเปลือกด้านนอกสุด ก คือถุงที่ล้อมตัวเอ็มบริโอไว้โดยตรง ข คือถุงที่ต่อจากเอ็มบริโอด้วยก้าน อยู่ด้านบนขวา ค คือถุงขนาดใหญ่ที่ล้อมไข่แดงด้านล่าง ง คือเยื่อชั้นนอกสุดที่อยู่ติดใต้เปลือกและล้อมรอบโครงสร้างทั้งหมด" }
    choices:
      - { id: a, text: "ข", correct: true }
      - { id: b, text: "ก", feedback: "ก คือแอมเนียน มีของเหลวล้อมเอ็มบริโอเพื่อกันกระแทกและกันแห้ง" }
      - { id: c, text: "ค", feedback: "ค คือถุงไข่แดง นำอาหารจากไข่แดงมาให้เอ็มบริโอ" }
      - { id: d, text: "ง", feedback: "ง คือคอเรียน ร่วมแลกเปลี่ยนแก๊สผ่านเปลือก" }
    hints:
      - "ของเสียต้องเก็บไว้ในถุงที่แยกจากเอ็มบริโอและอาหาร"
      - "ถุงนี้ยังทำงานร่วมกับคอเรียนในการแลกเปลี่ยนแก๊ส"
    solution: "ข คือแอลแลนทอยส์ เก็บกรดยูริกซึ่งไม่ละลายน้ำและไม่เป็นพิษต่อเอ็มบริโอ และร่วมกับคอเรียนแลกเปลี่ยนแก๊สผ่านเปลือก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.reproduction-development.p008
    topics: [biology.animals.reproduction-development]
    difficulty: 3
    type: order
    stem: "เรียงลำดับการเจริญเติบโตของกบนาตั้งแต่ไซโกตจนเป็นกบ"
    items:
      - "ไซโกต"
      - "คลีเวจจนได้มอรูลา"
      - "บลาสทูลา"
      - "แกสทรูลา"
      - "นิวรูลา"
      - "ลูกอ๊อด"
      - "เมทามอร์โฟซิสเป็นกบ"
    hints:
      - "เนื้อเยื่อ 3 ชั้นเกิดก่อนการสร้างหลอดประสาท"
      - "ลูกอ๊อดเปลี่ยนรูปร่างเป็นกบในระยะหลังเอ็มบริโอ"
    solution: "ไซโกต → คลีเวจได้มอรูลา → บลาสทูลา → แกสทรูลา → นิวรูลา → ลูกอ๊อด → เมทามอร์โฟซิสเป็นกบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.reproduction-development.p009
    topics: [biology.animals.reproduction-development]
    difficulty: 3
    type: mcq
    stem: "ส่วนกลางของสเปิร์มมีไมโทคอนเดรียจำนวนมาก โครงสร้างนี้สัมพันธ์กับหน้าที่ใด"
    choices:
      - { id: a, text: "สร้าง ATP ให้หางโบกพัดว่ายไปหาเซลล์ไข่", correct: true }
      - { id: b, text: "เก็บอาหารให้เอ็มบริโอหลังปฏิสนธิ", feedback: "อาหารสำหรับเอ็มบริโอมาจากไซโทพลาซึมของเซลล์ไข่ สเปิร์มมีไซโทพลาซึมน้อยมาก" }
      - { id: c, text: "ปล่อยเอนไซม์ย่อยชั้นที่หุ้มเซลล์ไข่", feedback: "เอนไซม์ย่อยชั้นหุ้มเซลล์ไข่มาจากอะโครโซมที่ส่วนหัว" }
    hints:
      - "ไมโทคอนเดรียเป็นแหล่งสร้างพลังงานของเซลล์"
      - "สเปิร์มต้องเคลื่อนที่ไกลมากเมื่อเทียบกับขนาดตัว"
    solution: "ไมโทคอนเดรียหายใจระดับเซลล์สร้าง ATP ให้หางเคลื่อนที่ ส่วนอะโครโซมที่หัวมีเอนไซม์สำหรับเจาะเซลล์ไข่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.reproduction-development.p010
    topics: [biology.animals.reproduction-development]
    difficulty: 3
    type: mcq
    stem: "การสร้างเซลล์ไข่ได้เซลล์ไข่ขนาดใหญ่ 1 เซลล์กับโพลาร์บอดีขนาดเล็กที่สลายไป ข้อดีของการแบ่งแบบนี้คือข้อใด"
    choices:
      - { id: a, text: "เซลล์ไข่ได้ไซโทพลาซึม อาหาร และออร์แกเนลล์เกือบทั้งหมดไว้เลี้ยงเอ็มบริโอระยะแรก", correct: true }
      - { id: b, text: "เซลล์ไข่จะมีโครโมโซมมากกว่าโพลาร์บอดี", feedback: "เซลล์ไข่และโพลาร์บอดีมีโครโมโซมชุดเดียวเท่ากัน ต่างกันที่ปริมาณไซโทพลาซึม" }
      - { id: c, text: "ทำให้ได้เซลล์ไข่จำนวนมากในแต่ละรอบเดือน", feedback: "ตรงข้าม การแบ่งแบบนี้ได้เซลล์ไข่เพียง 1 เซลล์ต่อโอโอไซต์ระยะแรก" }
    hints:
      - "เทียบขนาดของเซลล์ไข่กับโพลาร์บอดี"
      - "ระยะคลีเวจเอ็มบริโอยังไม่ได้รับอาหารจากภายนอก"
    solution: "การแบ่งไซโทพลาซึมไม่เท่ากันทำให้เซลล์ไข่เก็บอาหารและออร์แกเนลล์ไว้มากที่สุด เพียงพอให้เอ็มบริโอเจริญในระยะแรก ส่วนโพลาร์บอดีรับเพียงโครโมโซมชุดที่เกินไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.reproduction-development.p011
    topics: [biology.animals.reproduction-development]
    difficulty: 3
    type: numeric
    stem: "ผึ้งพันธุ์ตัวเมีย (นางพญาและผึ้งงาน) มีโครโมโซม 2n = 32 ผึ้งตัวผู้เจริญจากไข่ที่ไม่ได้รับการผสม เซลล์ร่างกายของผึ้งตัวผู้มีโครโมโซมกี่แท่ง"
    answer: { value: 16, unit: แท่ง }
    hints:
      - "ไข่สร้างด้วยไมโอซิสจากนางพญา"
      - "ไข่ที่ไม่ได้รับการผสมไม่มีโครโมโซมจากพ่อ"
    misconceptions:
      - { match: 32, feedback: "ผึ้งตัวผู้ไม่มีโครโมโซมชุดจากพ่อ จึงมีเพียงชุดเดียว" }
      - { match: 8, feedback: "ไข่ผ่านไมโอซิสเพียงครั้งเดียว จำนวนโครโมโซมจึงลดลงครึ่งเดียว" }
    solution: "ไข่มีโครโมโซม $n = 32 \\div 2 = 16$ แท่ง ผึ้งตัวผู้เจริญจากไข่โดยไม่ได้รับการผสม เซลล์ร่างกายจึงมี 16 แท่ง (เป็นแฮพลอยด์)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.reproduction-development.p012
    topics: [biology.animals.reproduction-development]
    difficulty: 3
    type: mcq
    stem: "กบต้องวางไข่ในน้ำ แต่ไก่วางไข่บนบกได้ ลักษณะใดของไข่ไก่ช่วยให้เอ็มบริโอเจริญบนบกได้มากที่สุด"
    choices:
      - { id: a, text: "มีแอมเนียนที่มีของเหลวล้อมเอ็มบริโอ และมีเปลือกที่กันน้ำระเหยแต่ให้แก๊สผ่านได้", correct: true }
      - { id: b, text: "มีไข่แดงน้อยกว่าไข่กบ", feedback: "ไข่ไก่มีไข่แดงมากกว่าไข่กบมาก เพื่อเลี้ยงเอ็มบริโอจนฟักเป็นลูกเจี๊ยบ" }
      - { id: c, text: "เอ็มบริโอไก่หายใจด้วยเหงือกเหมือนลูกอ๊อด", feedback: "เอ็มบริโอไก่แลกเปลี่ยนแก๊สผ่านคอเรียนและแอลแลนทอยส์ ไม่ได้ใช้เหงือก" }
    hints:
      - "ปัญหาใหญ่ของการเจริญบนบกคือการสูญเสียน้ำ"
      - "เอ็มบริโอไก่อยู่ในของเหลวแม้ไข่อยู่บนบก"
