  - { framework: university-foundations, indicators: ["CALC1 2.5"], coverage: full, note: "นิยามเอปไซลอน–เดลตาของลิมิต การหา δ จาก ε สำหรับฟังก์ชันเชิงเส้นและกำลังสอง การพิสูจน์ว่าลิมิตไม่มีค่า ลิมิตข้างเดียวและลิมิตอนันต์เชิงนิยาม" }
  - { framework: university-foundations, indicators: ["CALC1 2.4"], coverage: full, note: "นิยามความต่อเนื่องทั้งแบบลิมิตและแบบ ε–δ ความไม่ต่อเนื่องสามแบบ (ถอดได้ กระโดด อนันต์) ความต่อเนื่องบนช่วงปิดด้วยลิมิตข้างเดียว ความต่อเนื่องของผลบวก ผลคูณ ผลหาร และฟังก์ชันประกอบ และทฤษฎีบทค่าระหว่างกลางในรูปทั่วไปพร้อมการยืนยันว่ามีราก (หัวข้อ math.calculus.limits สอนชนิดของความไม่ต่อเนื่องอย่างละเอียดอยู่แล้ว)" }
  - { framework: university-foundations, indicators: ["CALC3 4.2"], coverage: partial, note: "มีนิยามลิมิตสองตัวแปรด้วยย่านวงกลม การทดสอบสองเส้นทาง การพิสูจน์ว่าลิมิตมีค่าด้วยอสมการ ความต่อเนื่องของพหุนาม ฟังก์ชันตรรกยะ และฟังก์ชันประกอบ และการขยายไปสามตัวแปร ยังไม่มีจุดภายในกับจุดขอบของโดเมนและลิมิตที่จุดขอบ" }
