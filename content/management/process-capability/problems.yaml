problems:
  - id: management.quality.process-capability.p001
    topics: [management.quality.process-capability]
    difficulty: 1
    type: mcq
    stem: "ชั่งตุ้มน้ำหนักมาตรฐาน 500.0 กรัมด้วยเครื่องชั่งเครื่องหนึ่ง 5 ครั้ง ได้ 503.1, 503.0, 503.2, 503.1, 503.0 กรัม เครื่องชั่งนี้เป็นอย่างไร"
    choices:
      - { id: a, text: "เที่ยงแต่ไม่แม่น", correct: true }
      - { id: b, text: "แม่นแต่ไม่เที่ยง", feedback: "ค่าที่ชั่งซ้ำใกล้กันมาก (เที่ยง) แต่ค่าเฉลี่ยห่างจาก 500.0 ราว 3 กรัม (ไม่แม่น)" }
      - { id: c, text: "แม่นและเที่ยง", feedback: "ค่าเฉลี่ยห่างจากค่าจริงราว 3 กรัม จึงยังไม่แม่น" }
      - { id: d, text: "ไม่แม่นและไม่เที่ยง", feedback: "ค่าที่ชั่งซ้ำต่างกันไม่เกิน 0.2 กรัม จึงเที่ยง" }
    hints:
      - "ความเที่ยงดูจากความใกล้กันของค่าที่วัดซ้ำ"
      - "ความแม่นดูจากค่าเฉลี่ยเทียบกับค่าจริง 500.0 กรัม"
    solution: "ค่าที่วัดซ้ำต่างกันเพียง 0.2 กรัม จึงเที่ยง แต่ค่าเฉลี่ยประมาณ 503.1 กรัม เอนเอียงจากค่าจริงราว 3.1 กรัม จึงไม่แม่น แก้ได้ด้วยการสอบเทียบและปรับตั้งศูนย์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.process-capability.p002
    topics: [management.quality.process-capability]
    difficulty: 1
    type: match
    stem: "จับคู่คำกับความหมายในการวิเคราะห์ระบบการวัด"
    pairs:
      - { left: "ความเอนเอียง", right: "ค่าเฉลี่ยของการวัดซ้ำต่างจากค่าอ้างอิง" }
      - { left: "ความทำซ้ำได้", right: "คนเดิม เครื่องเดิม วัดชิ้นเดิมหลายครั้งแล้วได้ค่าใกล้กัน" }
      - { left: "ความทำซ้ำได้ระหว่างผู้วัด", right: "ผู้วัดต่างคนกันวัดชิ้นเดิมแล้วได้ค่าเฉลี่ยใกล้กัน" }
      - { left: "ความเสถียร", right: "ผลการวัดชิ้นเดิมไม่ลอยไปตามเวลา" }
      - { left: "ความเป็นเชิงเส้น", right: "ความเอนเอียงเท่ากันตลอดช่วงการวัด" }
    hints:
      - "ความทำซ้ำได้คือเครื่องเดิมคนเดิม ส่วน reproducibility เปลี่ยนคน"
      - "ความเสถียรเกี่ยวกับเวลา ความเป็นเชิงเส้นเกี่ยวกับช่วงค่า"
    solution: "ความเอนเอียงเทียบกับค่าอ้างอิง ความทำซ้ำได้คือคนและเครื่องเดิม ระหว่างผู้วัดคือเปลี่ยนคน ความเสถียรเกี่ยวกับเวลา และความเป็นเชิงเส้นเกี่ยวกับความเอนเอียงในช่วงค่าต่าง ๆ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.process-capability.p003
    topics: [management.quality.process-capability]
    difficulty: 2
    type: numeric
    stem: "ข้อกำหนดความหนาของแผ่นไม้อัดคือ 9.00 ± 0.06 มิลลิเมตร กระบวนการอยู่ในการควบคุม มี $\\hat{\\sigma} = 0.015$ มิลลิเมตร $C_p$ เป็นเท่าใด (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 1.33, tolerance: 0.01 }
    hints:
      - "$C_p = \\dfrac{USL - LSL}{6\\hat{\\sigma}}$"
      - "ความกว้างของข้อกำหนด = 0.12 มิลลิเมตร"
    misconceptions:
      - { match: 2.67, feedback: "หารด้วย $3\\hat{\\sigma}$ แต่ $C_p$ ใช้ $6\\hat{\\sigma}$ ซึ่งเป็นความกว้างของกระบวนการทั้งสองฝั่ง" }
      - { match: 0.67, feedback: "ใช้แค่ครึ่งหนึ่งของความกว้างข้อกำหนด (0.06) ต้องใช้ USL − LSL = 0.12" }
    solution: "$C_p = \\dfrac{9.06 - 8.94}{6(0.015)} = \\dfrac{0.12}{0.09} \\approx 1.33$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.process-capability.p004
    topics: [management.quality.process-capability]
    difficulty: 2
    type: numeric
    stem: "เพลาเหล็กมีข้อกำหนด 9.94 ถึง 10.06 มิลลิเมตร ค่าเฉลี่ย 10.02 มิลลิเมตร $\\hat{\\sigma} = 0.015$ มิลลิเมตร $C_{pk}$ เป็นเท่าใด (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 0.89, tolerance: 0.01 }
    hints:
      - "หาระยะจากค่าเฉลี่ยถึง USL และถึง LSL"
      - "ใช้ระยะที่สั้นกว่า หารด้วย $3\\hat{\\sigma}$"
    misconceptions:
      - { match: 1.33, feedback: "นั่นคือ $C_p$ ซึ่งไม่สนตำแหน่งค่าเฉลี่ย ค่าเฉลี่ยค่อนไปทาง USL จึงต้องใช้ระยะที่สั้นกว่า" }
      - { match: 1.78, feedback: "ใช้ระยะถึง LSL ซึ่งไกลกว่า $C_{pk}$ ใช้ขอบที่ใกล้กว่า" }
    solution: "$USL - \\mu = 0.04$ $\\mu - LSL = 0.08$ ระยะที่สั้นกว่าคือ 0.04 $C_{pk} = 0.04/(3 \\times 0.015) \\approx 0.89$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.process-capability.p005
    topics: [management.quality.process-capability]
    difficulty: 2
    type: mcq
    stem: "กระบวนการหนึ่งมี $C_p = 1.8$ แต่ $C_{pk} = 0.7$ ควรปรับปรุงอย่างไรก่อน"
    choices:
      - { id: a, text: "ปรับค่าเฉลี่ยของกระบวนการให้เข้าใกล้กลางข้อกำหนด", correct: true }
      - { id: b, text: "ลงทุนเครื่องจักรใหม่เพื่อลดความผันแปร", feedback: "$C_p = 1.8$ แปลว่าความผันแปรแคบพอแล้ว ปัญหาอยู่ที่ตำแหน่งค่าเฉลี่ย" }
      - { id: c, text: "ขยายข้อกำหนดให้กว้างขึ้น", feedback: "ข้อกำหนดมาจากความต้องการของลูกค้า ไม่ควรเปลี่ยนเพื่อให้ตัวเลขดูดี" }
      - { id: d, text: "ไม่ต้องทำอะไร เพราะ Cp สูงกว่า 1.33", feedback: "ลูกค้าได้รับผลตาม $C_{pk}$ ค่า 0.7 แปลว่ามีของเสียมาก" }
    hints:
      - "Cp ไม่สนตำแหน่งค่าเฉลี่ย แต่ Cpk สน"
      - "ช่องว่างระหว่าง Cp กับ Cpk เกิดจากอะไร"
    solution: "ช่องว่างใหญ่ระหว่าง $C_p$ กับ $C_{pk}$ แปลว่าค่าเฉลี่ยอยู่ห่างจากกลางข้อกำหนด การปรับตั้งค่าเฉลี่ยมักทำได้ถูกและเร็วกว่าการลดความผันแปร และทำให้ $C_{pk}$ เข้าใกล้ 1.8"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.process-capability.p006
    topics: [management.quality.process-capability]
    difficulty: 3
    type: numeric
    stem: "กระบวนการแจกแจงปกติ ค่าเฉลี่ยอยู่ห่างจาก USL เป็นระยะ 2.5 เท่าของส่วนเบี่ยงเบนมาตรฐาน และอยู่ห่าง LSL มากจนไม่มีของเสียฝั่งนั้น สัดส่วนที่เกิน USL เป็นกี่ส่วนในล้าน (ppm) (ตอบเป็นจำนวนเต็ม)"
    answer: { value: 6210, unit: ppm, tolerance: 5 }
    hints:
      - "หาพื้นที่ทางขวาของ z = 2.5 ใต้การแจกแจงปกติมาตรฐาน"
      - "คูณสัดส่วนด้วย 1,000,000"
    misconceptions:
      - { match: 12419, feedback: "คิดสองฝั่ง แต่โจทย์บอกว่ามีของเสียเฉพาะฝั่ง USL" }
      - { match: 1350, feedback: "นั่นคือพื้นที่ทางขวาของ z = 3 ไม่ใช่ z = 2.5" }
    solution: "$P(Z > 2.5) \\approx 1 - 0.99379 = 0.00621$ คิดเป็นประมาณ 6,210 ppm"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.process-capability.p007
    topics: [management.quality.process-capability]
    difficulty: 3
    type: numeric
    stem: "จากฮิสโทแกรมปริมาตรน้ำมะพร้าวบรรจุขวดในภาพ กระบวนการอยู่ในการควบคุม และได้ $\\hat{\\sigma} = 2.5$ มิลลิลิตรจากแผนภูมิควบคุม $C_{pk}$ เป็นเท่าใด (ตอบทศนิยม 2 ตำแหน่ง)"
    figure:
      src: p-capability.svg
      alt: "ฮิสโทแกรมปริมาตรน้ำมะพร้าว 100 ขวด LSL = 495 มิลลิลิตร USL = 515 มิลลิลิตร ค่าเฉลี่ย 508 มิลลิลิตร ข้อมูลอยู่ระหว่าง 501 ถึง 513 มิลลิลิตร"
    answer: { value: 0.93, tolerance: 0.01 }
    hints:
      - "อ่านค่า LSL USL และค่าเฉลี่ยจากภาพ"
      - "ระยะถึง USL = 515 − 508 และถึง LSL = 508 − 495 ใช้ระยะที่สั้นกว่า"
    misconceptions:
      - { match: 1.33, feedback: "นั่นคือ $C_p$ ค่าเฉลี่ยไม่ได้อยู่กลางข้อกำหนด (505) จึงต้องใช้ $C_{pk}$" }
      - { match: 1.73, feedback: "ใช้ระยะถึง LSL ซึ่งไกลกว่า ต้องใช้ขอบที่ใกล้กว่า" }
    solution: "$USL - \\mu = 7$ $\\mu - LSL = 13$ $C_{pk} = 7/(3 \\times 2.5) \\approx 0.93$ แม้ข้อมูล 100 ขวดจะไม่มีขวดใดเกินข้อกำหนด แต่ $C_{pk}$ ต่ำกว่า 1 บอกว่าในระยะยาวจะมีขวดที่เกิน USL"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.process-capability.p008
    topics: [management.quality.process-capability]
    difficulty: 3
    type: numeric
    stem: "ข้อกำหนดความยาวชิ้นงาน 20 ถึง 30 มิลลิเมตร ค่าเฉลี่ย 26 มิลลิเมตร ส่วนเบี่ยงเบนมาตรฐานภายในกลุ่มย่อย 1.0 มิลลิเมตร ส่วนเบี่ยงเบนมาตรฐานรวมของข้อมูลทั้งหมด 1.2 มิลลิเมตร $P_{pk}$ เป็นเท่าใด (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 1.11, tolerance: 0.01 }
    hints:
      - "$P_{pk}$ ใช้ส่วนเบี่ยงเบนมาตรฐานรวม"
      - "ระยะถึงขอบที่ใกล้กว่า = 30 − 26 แล้วหารด้วย 3 × 1.2"
    misconceptions:
      - { match: 1.33, feedback: "นั่นคือ $C_{pk}$ ซึ่งใช้ส่วนเบี่ยงเบนมาตรฐานภายในกลุ่มย่อย 1.0 ส่วน $P_{pk}$ ใช้ค่ารวม 1.2" }
      - { match: 1.39, feedback: "นั่นคือ $P_p$ ซึ่งไม่สนตำแหน่งค่าเฉลี่ย" }
    solution: "$P_{pk} = \\min(30 - 26,\\ 26 - 20)/(3 \\times 1.2) = 4/3.6 \\approx 1.11$ ส่วน $C_{pk} = 4/3 \\approx 1.33$ ช่องว่างนี้บอกว่ามีความผันแปรระหว่างกลุ่มย่อยที่ควรหาสาเหตุ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.process-capability.p009
    topics: [management.quality.process-capability]
    difficulty: 3
    type: numeric
    stem: "แผนภูมิ x̄–R ของน้ำหนักขนมเปี๊ยะ (กลุ่มย่อยละ 5 ชิ้น) อยู่ในการควบคุม มี $\\bar{R} = 0.93$ กรัม ($d_2 = 2.326$) ข้อกำหนดคือ 12.0 ถึง 14.4 กรัม $C_p$ เป็นเท่าใด (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 1.00, tolerance: 0.01 }
    hints:
      - "ประมาณ $\\hat{\\sigma} = \\bar{R}/d_2$ ก่อน"
      - "$C_p = (USL - LSL)/(6\\hat{\\sigma})$"
    misconceptions:
      - { match: 0.43, feedback: "ใช้ $\\bar{R}$ เป็นส่วนเบี่ยงเบนมาตรฐานโดยตรง ต้องหารด้วย $d_2$ ก่อน" }
      - { match: 2.00, feedback: "หารด้วย $3\\hat{\\sigma}$ แต่ $C_p$ ใช้ $6\\hat{\\sigma}$" }
    solution: "$\\hat{\\sigma} = 0.93/2.326 \\approx 0.400$ กรัม $C_p = 2.4/(6 \\times 0.400) \\approx 1.00$ กระบวนการกว้างพอดีกับข้อกำหนด ไม่มีที่เผื่อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.process-capability.p010
    topics: [management.quality.process-capability]
    difficulty: 4
    type: numeric
    stem: "การศึกษา gage R&R ของไมโครมิเตอร์ได้ส่วนเบี่ยงเบนมาตรฐานจากความทำซ้ำได้ 0.12 มิลลิเมตร ระหว่างผู้วัด 0.09 มิลลิเมตร และระหว่างชิ้นงาน 0.50 มิลลิเมตร %GRR (เทียบกับความผันแปรรวม) เป็นเท่าใด (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 28.7, unit: "%", tolerance: 0.1 }
    hints:
      - "$\\sigma_{GRR} = \\sqrt{0.12^2 + 0.09^2}$"
      - "$\\sigma_{\\text{รวม}} = \\sqrt{\\sigma_{GRR}^2 + 0.50^2}$ แล้ว %GRR = σGRR ÷ σรวม × 100"
    misconceptions:
      - { match: 38.7, feedback: "บวกส่วนเบี่ยงเบนมาตรฐานตรง ๆ (0.12 + 0.09) ต้องบวกความแปรปรวนแล้วถอดราก" }
      - { match: 30, feedback: "หารด้วยส่วนเบี่ยงเบนมาตรฐานของชิ้นงาน ต้องหารด้วยความผันแปรรวม" }
    solution: "$\\sigma_{GRR} = \\sqrt{0.0144 + 0.0081} = 0.15$ $\\sigma_{\\text{รวม}} = \\sqrt{0.0225 + 0.25} \\approx 0.522$ %GRR $= 0.15/0.522 \\times 100 \\approx 28.7\\%$ อยู่ในช่วง 10–30% อาจยอมรับได้ขึ้นกับความสำคัญของงาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.process-capability.p011
    topics: [management.quality.process-capability]
    difficulty: 4
    type: numeric
    stem: "จากข้อก่อน ($\\sigma_{GRR} = 0.15$ มิลลิเมตร $\\sigma_{\\text{ชิ้นงาน}} = 0.50$ มิลลิเมตร) จำนวนกลุ่มที่แยกได้ (ndc) เป็นเท่าใด"
    answer: { value: 4, unit: กลุ่ม }
    hints:
      - "$ndc = 1.41 \\times \\sigma_{\\text{ชิ้นงาน}}/\\sigma_{GRR}$"
      - "ปัดลงเป็นจำนวนเต็ม"
    misconceptions:
      - { match: 5, feedback: "ปัดขึ้นจาก 4.7 ค่า ndc ต้องปัดลง เพราะแยกกลุ่มได้ไม่ถึง 5 กลุ่มเต็ม" }
      - { match: 3, feedback: "ดูเหมือนไม่ได้คูณ 1.41 ($0.50/0.15 \\approx 3.3$)" }
    solution: "$ndc = 1.41 \\times 0.50/0.15 = 4.7$ ปัดลงเป็น 4 น้อยกว่า 5 ระบบการวัดนี้ยังแยกความต่างของชิ้นงานได้ไม่ละเอียดพอสำหรับการควบคุมกระบวนการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.process-capability.p012
    topics: [management.quality.process-capability]
    difficulty: 4
    type: order
    stem: "เรียงลำดับการสอบกลับได้ของการวัด จากเครื่องวัดหน้างานขึ้นไปจนถึงหน่วยวัดสากล"
    items:
      - "เวอร์เนียร์คาลิปเปอร์ที่ใช้ในสายการผลิต"
      - "เกจบล็อกอ้างอิงของห้องสอบเทียบในโรงงาน"
      - "มาตรฐานของห้องปฏิบัติการสอบเทียบที่ได้รับการรับรอง"
      - "มาตรฐานแห่งชาติของสถาบันมาตรวิทยาแห่งชาติ"
      - "นิยามของหน่วย SI (เมตร)"
    hints:
      - "แต่ละขั้นสอบเทียบด้วยมาตรฐานที่แม่นกว่าที่อยู่ขั้นถัดไป"
      - "ปลายทางสุดท้ายคือนิยามของหน่วยวัด"
    solution: "เครื่องวัดหน้างาน → มาตรฐานอ้างอิงของโรงงาน → ห้องปฏิบัติการสอบเทียบที่ได้รับการรับรอง → มาตรฐานแห่งชาติ → หน่วย SI ทุกขั้นต้องมีใบรับรองการสอบเทียบและค่าความไม่แน่นอน จึงจะสอบกลับได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.process-capability.p013
    topics: [management.quality.process-capability]
    difficulty: 4
    type: numeric
    stem: "ข้อกำหนดของคุณลักษณะหนึ่งคือ 56 ถึง 64 หน่วย ค่าเฉลี่ยของกระบวนการ 60.8 หน่วย และไม่สามารถปรับค่าเฉลี่ยได้ในระยะสั้น ส่วนเบี่ยงเบนมาตรฐานต้องไม่เกินเท่าใดจึงจะได้ $C_{pk} \\ge 1.33$ (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 0.80, unit: หน่วย, tolerance: 0.01 }
    hints:
      - "ขอบที่ใกล้ค่าเฉลี่ยกว่าคือ USL ห่าง 64 − 60.8"
      - "จาก $C_{pk} = 3.2/(3\\sigma) \\ge 1.33$ แก้หา σ"
    misconceptions:
      - { match: 1.00, feedback: "ใช้สูตร $C_p$ (ความกว้างทั้งหมด 8 ÷ 6 ÷ 1.33) แต่ค่าเฉลี่ยไม่อยู่กลาง ต้องใช้ระยะถึงขอบที่ใกล้กว่า" }
      - { match: 1.20, feedback: "ใช้ระยะถึง LSL (4.8) ซึ่งไกลกว่า ต้องใช้ขอบที่ใกล้กว่า" }
    solution: "$\\sigma \\le \\dfrac{64 - 60.8}{3 \\times 1.33} = \\dfrac{3.2}{3.99} \\approx 0.80$ หน่วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.process-capability.p014
    topics: [management.quality.process-capability]
    difficulty: 5
    type: numeric
    stem: "กระบวนการแจกแจงปกติ ค่าเฉลี่ย 104.5 ส่วนเบี่ยงเบนมาตรฐานรวม 1.6 ข้อกำหนด 100 ถึง 110 สัดส่วนของเสียรวมทั้งสองฝั่งเป็นกี่ ppm (ตอบเป็นจำนวนเต็ม)"
    answer: { value: 2751, unit: ppm, tolerance: 5 }
    hints:
      - "หา $z_U = (110 - 104.5)/1.6$ และ $z_L = (104.5 - 100)/1.6$"
      - "หาพื้นที่หางของแต่ละฝั่งแล้วรวมกัน คูณ 1,000,000"
    misconceptions:
      - { match: 2458, feedback: "คิดเฉพาะฝั่ง LSL ซึ่งใกล้กว่า ยังต้องบวกของเสียฝั่ง USL" }
      - { match: 294, feedback: "คิดเฉพาะฝั่ง USL ฝั่ง LSL ใกล้ค่าเฉลี่ยกว่าและมีของเสียมากกว่า" }
    solution: "$z_U = 5.5/1.6 \\approx 3.44$ ได้ประมาณ 294 ppm $z_L = 4.5/1.6 \\approx 2.81$ ได้ประมาณ 2,458 ppm รวมประมาณ 2,751 ppm"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.process-capability.p015
    topics: [management.quality.process-capability]
    difficulty: 5
    type: mcq
    stem: "ทีมคำนวณ $C_{pk} = 1.45$ จากข้อมูล 30 วัน แต่แผนภูมิ x̄ ของช่วงเดียวกันมี 4 จุดหลุดเส้นควบคุมบนและมีรูปแบบเป็นขั้น ผู้จัดการถามว่ารายงานลูกค้าว่ากระบวนการมีความสามารถได้หรือไม่ คำตอบใดถูกต้องที่สุด"
    choices:
      - { id: a, text: "ยังไม่ควรรายงาน เพราะกระบวนการไม่อยู่ในการควบคุม ดัชนีความสามารถจึงทำนายอนาคตไม่ได้ ต้องหาและกำจัดสาเหตุพิเศษก่อน", correct: true }
      - { id: b, text: "รายงานได้ เพราะ Cpk มากกว่า 1.33", feedback: "ดัชนีความสามารถมีความหมายเฉพาะเมื่อกระบวนการเสถียร ตัวเลขจากกระบวนการที่ไม่เสถียรอาจเปลี่ยนไปมากในเดือนหน้า" }
      - { id: c, text: "ตัด 4 จุดที่หลุดออกแล้วคำนวณใหม่โดยไม่ต้องหาสาเหตุ", feedback: "การตัดข้อมูลโดยไม่รู้สาเหตุทำให้ตัวเลขดูดีเกินจริง และสาเหตุพิเศษยังอยู่" }
      - { id: d, text: "ใช้ Ppk แทน Cpk แล้วรายงานได้ทันที", feedback: "Ppk ก็ต้องการกระบวนการที่เสถียรเช่นกันถ้าจะใช้ทำนายอนาคต" }
    hints:
      - "ความสามารถของกระบวนการมีเงื่อนไขก่อนคำนวณ"
      - "จุดหลุดและรูปแบบขั้นบอกอะไรเกี่ยวกับความเสถียร"
    solution: "ต้องทำให้กระบวนการอยู่ในการควบคุมก่อน จึงจะใช้ดัชนีความสามารถทำนายผลในอนาคตได้ ขั้นตอนคือหาสาเหตุของจุดหลุดและการเลื่อนเป็นขั้น แก้ไข เก็บข้อมูลใหม่ แล้วจึงคำนวณ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.process-capability.p016
    topics: [management.quality.process-capability]
    difficulty: 5
    type: numeric
    stem: "ไมโครมิเตอร์ในข้อ 10 มี $\\sigma_{GRR} = 0.15$ มิลลิเมตร ใช้ตรวจชิ้นงานที่มีข้อกำหนด 25.00 ± 2.25 มิลลิเมตร ความผันแปรของการวัดคิดเป็นร้อยละเท่าใดของพิกัดความเผื่อ (ใช้ $6\\sigma_{GRR}$)"
    answer: { value: 20, unit: "%" }
    hints:
      - "ความกว้างของพิกัดความเผื่อ = USL − LSL = 4.5 มิลลิเมตร"
      - "%พิกัดความเผื่อ = 6σGRR ÷ (USL − LSL) × 100"
    misconceptions:
      - { match: 40, feedback: "ใช้ครึ่งหนึ่งของพิกัดความเผื่อ (2.25) ต้องใช้ความกว้างทั้งหมด 4.5" }
      - { match: 3.33, feedback: "ลืมคูณ 6 ความผันแปรของการวัดครอบคลุมราว 6σ" }
    solution: "$6(0.15)/4.5 \\times 100 = 0.9/4.5 \\times 100 = 20\\%$ ถ้าใช้เครื่องนี้เพื่อตัดสินผ่านหรือไม่ผ่าน อยู่ในช่วงที่อาจยอมรับได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.process-capability.p017
    topics: [management.quality.process-capability]
    difficulty: 5
    type: mcq
    stem: "ห้องสอบเทียบพบว่าเครื่องชั่งที่ใช้ชั่งยาเม็ดในโรงงานยา (สมมติ) อ่านค่าสูงเกินเกณฑ์ที่ยอมรับ 0.8% เมื่อสอบเทียบตามรอบ ครั้งก่อนสอบเทียบเมื่อ 6 เดือนที่แล้วยังผ่าน ควรทำอะไรเป็นลำดับแรกหลังหยุดใช้เครื่อง"
    choices:
      - { id: a, text: "ประเมินผลกระทบต่อทุกล็อตที่ชั่งด้วยเครื่องนี้ตั้งแต่การสอบเทียบครั้งก่อน และตัดสินว่าต้องตรวจซ้ำหรือเรียกคืนหรือไม่", correct: true }
      - { id: b, text: "ปรับตั้งเครื่องแล้วใช้งานต่อ ไม่ต้องสนใจล็อตที่ผ่านมา", feedback: "ไม่รู้ว่าเครื่องเริ่มเคลื่อนเมื่อไร ล็อตที่ชั่งในช่วงนั้นอาจผิดข้อกำหนด ต้องประเมินย้อนหลัง" }
      - { id: c, text: "ทิ้งเครื่องชั่งแล้วซื้อใหม่", feedback: "การซื้อใหม่ไม่ได้ตอบคำถามว่าผลิตภัณฑ์ที่ผลิตไปแล้วปลอดภัยหรือไม่" }
      - { id: d, text: "เปลี่ยนเกณฑ์การยอมรับให้กว้างขึ้นเป็น 1% เพื่อให้เครื่องผ่าน", feedback: "เกณฑ์มาจากความต้องการของผลิตภัณฑ์ การขยายเกณฑ์หลังเห็นผลเป็นการปกปิดปัญหา" }
    hints:
      - "เครื่องอาจเริ่มเคลื่อนตั้งแต่วันใดก็ได้ในช่วง 6 เดือน"
      - "ผลิตภัณฑ์ที่วัดด้วยเครื่องนี้ยังเชื่อถือได้หรือไม่"
    solution: "เมื่อเครื่องวัดเคลื่อนเกินเกณฑ์ ต้องประเมินผลิตภัณฑ์ที่วัดด้วยเครื่องนั้นย้อนไปถึงการสอบเทียบครั้งก่อน แล้วจึงซ่อม ปรับตั้ง และพิจารณาลดรอบการสอบเทียบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.process-capability.p018
    topics: [management.quality.process-capability]
    difficulty: 1
    type: mcq
    stem: "การทดสอบใดเป็นการทดสอบแบบทำลาย จึงต้องใช้การสุ่มตัวอย่างแทนการตรวจทุกชิ้น"
    choices:
      - { id: a, text: "ดึงเส้นลวดจนขาดเพื่อหาแรงดึงสูงสุด", correct: true }
      - { id: b, text: "เอกซเรย์รอยเชื่อมท่อ", feedback: "เอกซเรย์ไม่ทำลายชิ้นงาน ใช้ตรวจได้ทุกชิ้น" }
      - { id: c, text: "วัดความหนาด้วยคลื่นอัลตราซาวนด์", feedback: "อัลตราซาวนด์เป็นการทดสอบแบบไม่ทำลาย" }
      - { id: d, text: "ชั่งน้ำหนักถุงข้าวสาร", feedback: "การชั่งไม่ทำให้สินค้าเสียหาย" }
    hints:
      - "หลังทดสอบแล้ว ชิ้นงานยังขายได้หรือไม่"
      - "การทดสอบที่ทำให้ชิ้นงานเสียหายใช้ได้กับตัวอย่างเท่านั้น"
    solution: "การดึงจนขาดทำลายชิ้นงาน จึงตรวจได้เฉพาะตัวอย่าง ส่วนเอกซเรย์ อัลตราซาวนด์ และการชั่งไม่ทำลาย ใช้ตรวจทุกชิ้นได้"
