  - id: biology.genetics.chromosomes-dna.p018
    topics: [biology.genetics.chromosomes-dna]
    difficulty: 5
    type: numeric
    stem: "mRNA ปกติคือ 5′-AUG AAA UGG CUA GCA UAA-3′ ถ้าเกิดการแทนที่เบสตัวที่ 9 (นับจาก A ของ AUG) จาก G เป็น A พอลิเพปไทด์ที่ได้จะมีกรดอะมิโนกี่หน่วย"
    figure: { src: genetic-code.svg, alt: "ตารางรหัสพันธุกรรมมาตรฐานของโคดอนบน mRNA 64 โคดอน แถวคือเบสตัวที่ 1 คอลัมน์คือเบสตัวที่ 2 ภายในแต่ละช่องเรียงตามเบสตัวที่ 3 U C A G ตัวอย่าง UUU และ UUC เป็น Phe GGU GGC GGA GGG เป็น Gly AAA AAG เป็น Lys UGG เป็น Trp GAA GAG เป็น Glu GUU GUC GUA GUG เป็น Val AUG เป็น Met และเป็นรหัสเริ่ม UAA UAG UGA เป็นรหัสหยุด (ตารางครบทุกโคดอนตามรหัสพันธุกรรมมาตรฐาน)" }
    answer: { value: 2, unit: หน่วย }
    hints:
      - "เบสตัวที่ 9 อยู่ในโคดอนที่เท่าใด โคดอนนั้นเปลี่ยนเป็นอะไร"
      - "ดูในตารางว่าโคดอนใหม่แทนกรดอะมิโนใด หรือเป็นรหัสหยุด"
    misconceptions:
      - { match: 5, feedback: "นี่คือความยาวของพอลิเพปไทด์ปกติ (Met-Lys-Trp-Leu-Ala) แต่โคดอนที่ 3 เปลี่ยนไปแล้ว" }
      - { match: 3, feedback: "รหัสหยุดไม่แทนกรดอะมิโน จึงไม่นับโคดอนที่ 3" }
    solution: "เบสตัวที่ 7–9 คือโคดอนที่ 3 UGG (Trp) เมื่อ G ตัวที่ 9 เป็น A ได้ UGA ซึ่งเป็นรหัสหยุด พอลิเพปไทด์จึงเหลือ Met-Lys เพียง 2 หน่วย การแทนที่เบสเดียวจึงอาจทำให้โปรตีนสั้นจนทำงานไม่ได้"
