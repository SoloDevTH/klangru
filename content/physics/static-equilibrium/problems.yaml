    misconceptions:
      - { match: 0.9, feedback: "นี่คือระยะจากปลายหลัง บ่าต้องอยู่ใกล้กระบุงที่หนักกว่า ซึ่งอยู่ปลายหน้า" }
      - { match: 0.75, feedback: "วางบ่ากึ่งกลางใช้ได้เมื่อของสองข้างหนักเท่ากัน ข้อนี้ข้างหน้าหนักกว่า" }
    hints:
