    text: ป้องกันแบบโซน 2-3 รวมคนใต้แป้นเพื่อปิดตัวสูง และเมื่อแย่งลูกได้ให้บุกเร็วก่อนผู้เล่นตัวสูงของคู่แข่งกลับมาป้องกัน
    correct: true
  - id: b
    text: ประกบตัวต่อตัวทั่วสนามและให้คนตัวเล็กสู้ตัวสูงใต้แป้นตรง ๆ
    feedback: ผู้เล่นตัวเล็กเสียเปรียบเมื่อสู้ใต้แป้นตัวต่อตัว
