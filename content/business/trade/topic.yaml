id: business.international.trade
subject: business
title:
  th: การค้าระหว่างประเทศ ความร่วมมือทางเศรษฐกิจ และโลกาภิวัตน์
  en: International trade, economic cooperation and globalisation
summary: การกระจายทรัพยากรในโลก ความได้เปรียบโดยเปรียบเทียบ การกีดกันทางการค้า (อากร โควตา) การรวมกลุ่มทางเศรษฐกิจ อาเซียน AEC ความตกลงการค้าเสรี และผลต่อสังคมไทย
difficulty: 5.5
minutes: 45
prerequisites:
- business.econ.demand-supply
- business.econ.government-taxes
encompasses:
- id: business.econ.demand-supply
  weight: 0.4
- id: business.econ.government-taxes
  weight: 0.2
- id: business.econ.scarcity-choice
  weight: 0.1
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  src: ppf-trade.svg
  alt: กราฟเส้นเป็นไปได้ในการผลิตสองเส้น (สมมติ แรงงาน 100 วัน) แกนนอนคือข้าว (กระสอบ) แกนตั้งคือชิ้นส่วนอิเล็กทรอนิกส์ (ชิ้น) เส้นของไทยเป็นเส้นตรงจาก 200 ชิ้นบนแกนตั้งถึง 600 กระสอบบนแกนนอน เส้นของประเทศ B เป็นเส้นตรงจาก 800 ชิ้นถึง 800 กระสอบ จุดก่อนค้าขายของไทย (300 กระสอบ 100 ชิ้น) และของ B (400 กระสอบ 400 ชิ้น) ความชันของเส้นไทยน้อยกว่า แสดงว่าค่าเสียโอกาสของข้าวในไทยต่ำกว่า
  caption: 'เส้นของไทยลาดน้อยกว่า: ข้าว 1 กระสอบเสียชิ้นส่วนเพียง 1/3 ชิ้น ไทยจึงได้เปรียบโดยเปรียบเทียบในข้าว'
- type: worked-example
  title: ใครได้เปรียบโดยเปรียบเทียบ และผลได้จากการค้า
  problem: แรงงาน 1 วัน ไทยผลิตข้าว $6$ หรือชิ้นส่วน $2$ ประเทศ B ผลิตข้าว $8$ หรือชิ้นส่วน $8$ แต่ละประเทศมีแรงงาน $100$ วัน และก่อนค้าขายแบ่งแรงงานครึ่งต่อครึ่ง
  steps:
  - text: 'ค่าเสียโอกาสของข้าว 1 กระสอบ: ไทย $2 \div 6 \approx 0.33$ ชิ้น · B $8 \div 8 = 1$ ชิ้น'
    why: เทียบสิ่งที่ต้องสละ ไม่ใช่ปริมาณที่ผลิตได้
  - text: 'ไทยได้เปรียบโดยเปรียบเทียบในข้าว B ได้เปรียบในชิ้นส่วน (ค่าเสียโอกาสชิ้นส่วน: ไทย 3 กระสอบ B 1 กระสอบ)'
  - text: 'ก่อนค้า: ไทย $300$ กระสอบ $100$ ชิ้น · B $400$ กระสอบ $400$ ชิ้น รวม $700$ กระสอบ $500$ ชิ้น'
  - text: 'แบ่งงาน: ไทยผลิตข้าว $600$ กระสอบ B ผลิตข้าว $100$ กระสอบ (ใช้ $12.5$ วัน) และชิ้นส่วน $87.5 \times 8 = 700$ ชิ้น'
    why: ให้ข้าวรวมเท่าเดิมเพื่อเทียบง่าย
  - text: รวม $700$ กระสอบ $700$ ชิ้น ได้ชิ้นส่วนเพิ่ม $200$ ชิ้นโดยข้าวไม่ลด แบ่งกันผ่านการค้าให้ทั้งสองประเทศดีขึ้น
  answer: ไทยถนัดข้าว B ถนัดชิ้นส่วน ผลผลิตรวมเพิ่มชิ้นส่วน 200 ชิ้น
- type: check
  problem: business.international.trade.p004
  prompt: เทียบค่าเสียโอกาส ไม่ใช่ปริมาณ
- type: figure
  src: tariff.svg
  alt: กราฟตลาดเครื่องปั่นในประเทศ (สมมติ) แกนนอนปริมาณ 0 ถึง 160 พันเครื่อง แกนตั้งราคา 0 ถึง 100 ร้อยบาท เส้นอุปสงค์ลาดลงและเส้นอุปทานในประเทศลาดขึ้น ตัดกันที่ราคา 60 เส้นแนวนอนราคาโลก 40 และราคาโลกรวมอากร 50 ที่ราคา 40 ผลิตในประเทศ 40 ซื้อ 120 นำเข้า 80 ที่ราคา 50 ผลิต 60 ซื้อ 100 นำเข้า 40 พื้นที่สี่เหลี่ยมระหว่างปริมาณ 60 ถึง 100 และราคา 40 ถึง 50 แรเงาเป็นรายได้อากรของรัฐ สามเหลี่ยมเล็กสองรูปด้านข้างเป็นความสูญเปล่า
  caption: อากรขาเข้าทำให้ราคาในประเทศสูงขึ้น นำเข้าลดลง รัฐได้อากร แต่เกิดความสูญเปล่า (สมมติ)
- type: worked-example
  title: ผลของอากรขาเข้าต่อตลาดในประเทศ
  problem: $Q_d = 200 - 2P$, $Q_s = -40 + 2P$ ราคาโลก $40$ ถ้าเก็บอากร $10$ ต่อเครื่อง หาการนำเข้าก่อนและหลัง รายได้อากร และผลต่อผู้บริโภค ผู้ผลิต
  steps:
  - text: 'ไม่มีการค้า: $200 - 2P = -40 + 2P \Rightarrow P = 60$ สูงกว่าราคาโลก ไทยจึงนำเข้า'
  - text: 'ที่ $P = 40$: $Q_d = 120$ $Q_s = 40$ นำเข้า $80$'
  - text: 'ที่ $P = 50$: $Q_d = 100$ $Q_s = 60$ นำเข้า $40$ รายได้อากร $= 10 \times 40 = 400$'
    why: อากรเก็บเฉพาะสินค้าที่ยังนำเข้าหลังราคาขึ้น
  - text: ผู้บริโภคเสีย $\tfrac{120 + 100}{2} \times 10 = 1{,}100$ ผู้ผลิตในประเทศได้ $\tfrac{40 + 60}{2} \times 10 = 500$
  - text: ความสูญเปล่า $= 1{,}100 - 500 - 400 = 200$ (หน่วย ร้อยบาท × พันเครื่อง)
    why: บางส่วนผลิตในประเทศด้วยต้นทุนสูงกว่าราคาโลก และบางคนเลิกซื้อทั้งที่ยินดีจ่ายมากกว่าราคาโลก
  answer: นำเข้าลดจาก $80$ เป็น $40$ · อากร $400$ · ผู้บริโภคเสีย $1{,}100$ · ผู้ผลิตได้ $500$ · สูญเปล่า $200$
- type: check
  problem: business.international.trade.p009
  prompt: นำเข้า = ซื้อ − ผลิตเอง
glossary:
- term: ความได้เปรียบโดยสมบูรณ์
  definition: การผลิตสินค้าได้มากกว่าอีกประเทศด้วยทรัพยากรเท่ากัน
- term: ความได้เปรียบโดยเปรียบเทียบ
  definition: การผลิตสินค้าด้วยค่าเสียโอกาสต่ำกว่าอีกประเทศ
- term: ค่าเสียโอกาส
  definition: มูลค่าของทางเลือกที่ดีที่สุดที่ต้องสละไป
- term: ภาษีศุลกากร (อากรขาเข้า)
  definition: ภาษีที่เก็บจากสินค้านำเข้า คิดตามราคาหรือต่อหน่วย
- term: โควตา
  definition: การจำกัดปริมาณสินค้านำเข้าหรือส่งออก
- term: มาตรการที่มิใช่ภาษี
  definition: การกีดกันทางการค้าด้วยมาตรฐาน ใบอนุญาต หรือขั้นตอน ไม่ใช่ภาษี
- term: เขตการค้าเสรี
  definition: กลุ่มประเทศที่ลดหรือยกเลิกภาษีระหว่างกัน แต่ละประเทศตั้งภาษีกับนอกกลุ่มเอง
- term: ประชาคมเศรษฐกิจอาเซียน (AEC)
  definition: การรวมกลุ่มทางเศรษฐกิจของอาเซียนที่มุ่งเป็นตลาดและฐานการผลิตเดียว
- term: โลกาภิวัตน์
  definition: การที่เศรษฐกิจ สังคม และวัฒนธรรมของโลกเชื่อมโยงใกล้ชิดกันมากขึ้น
flashcards:
- front: ความได้เปรียบโดยเปรียบเทียบ
  back: ผลิตสิ่งที่ค่าเสียโอกาสต่ำกว่า แล้วแลกกัน
- front: ค่าเสียโอกาสของ X
  back: สิ่งที่สละ ÷ จำนวน X ที่ได้
- front: ผลของอากรขาเข้า
  back: ราคาในประเทศขึ้น นำเข้าลด ผลิตในประเทศเพิ่ม รัฐได้อากร ผู้บริโภคเสีย
- front: อากร vs โควตา
  back: ผลต่อราคาเหมือนกันได้ แต่โควตาไม่ให้รายได้แก่รัฐ
- front: ระดับการรวมกลุ่ม
  back: FTA → สหภาพศุลกากร → ตลาดร่วม → สหภาพเศรษฐกิจ
