problems:
  - id: biology.animals.movement.p001
    topics: [biology.animals.movement]
    difficulty: 1
    type: mcq
    stem: "โครงกระดูกของผู้ใหญ่มีกระดูกประมาณกี่ชิ้น"
    choices:
      - { id: a, text: "206 ชิ้น", correct: true }
      - { id: b, text: "80 ชิ้น", feedback: "80 ชิ้นเป็นจำนวนของโครงกระดูกแกนเท่านั้น" }
      - { id: c, text: "126 ชิ้น", feedback: "126 ชิ้นเป็นจำนวนของโครงกระดูกรยางค์เท่านั้น" }
      - { id: d, text: "300 ชิ้น", feedback: "ทารกมีกระดูกราว 300 ชิ้น แต่หลายชิ้นเชื่อมรวมกันเมื่อโตขึ้น" }
    hints:
      - "โครงกระดูกแกนมี 80 ชิ้น"
      - "รวมกับโครงกระดูกรยางค์ 126 ชิ้น"
    solution: "ผู้ใหญ่มีกระดูก $80 + 126 = 206$ ชิ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.movement.p002
    topics: [biology.animals.movement]
    difficulty: 1
    type: match
    stem: "จับคู่ชนิดของข้อต่อกับตัวอย่าง"
    pairs:
      - { left: "ข้อต่อแบบบานพับ", right: "ข้อศอก" }
      - { left: "ข้อต่อแบบลูกกลมในเบ้า", right: "ข้อสะโพก" }
      - { left: "ข้อต่อแบบเดือย", right: "กระดูกคอข้อที่ 1 กับข้อที่ 2" }
      - { left: "ข้อต่อแบบเลื่อน", right: "กระดูกข้อมือ" }
      - { left: "ข้อต่อที่เคลื่อนไหวไม่ได้", right: "รอยต่อของกะโหลกศีรษะ" }
    hints:
      - "ข้อที่หมุนได้รอบทิศคือแบบลูกกลมในเบ้า"
      - "ข้อที่ทำให้ศีรษะหมุนส่ายไปมาคือแบบเดือย"
    solution: "ข้อศอกเป็นบานพับ ข้อสะโพกเป็นลูกกลมในเบ้า กระดูกคอข้อที่ 1 กับ 2 เป็นเดือย กระดูกข้อมือเป็นแบบเลื่อน และรอยต่อกะโหลกเคลื่อนไหวไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.movement.p003
    topics: [biology.animals.movement]
    difficulty: 1
    type: text
    stem: "โปรตีนที่เป็นเส้นใยหนาในซาร์โคเมียร์ และมีส่วนหัวที่ดึงแอกทิน ชื่ออะไร"
    accepted: ["ไมโอซิน", "myosin"]
    misconceptions:
      - { match: "แอกทิน", feedback: "แอกทินเป็นเส้นใยบางที่ถูกดึง" }
      - { match: "เคราติน", feedback: "เคราตินเป็นโปรตีนของผมและเล็บ" }
    hints:
      - "ในซาร์โคเมียร์มีเส้นใยโปรตีนสองชนิด"
      - "ชนิดนี้อยู่ตรงกลางซาร์โคเมียร์"
    solution: "ไมโอซินเป็นเส้นใยหนาอยู่กลางซาร์โคเมียร์ หัวไมโอซินใช้พลังงานจาก ATP ดึงแอกทินเข้าหากลาง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.movement.p004
    topics: [biology.animals.movement]
    difficulty: 2
    type: mcq
    stem: "ชาวประมงเห็นหมึกกล้วยพุ่งหนีอย่างรวดเร็วเมื่อถูกไล่ หมึกเคลื่อนที่ได้เร็วด้วยวิธีใด"
    choices:
      - { id: a, text: "หดกล้ามเนื้อลำตัวพ่นน้ำออกทางไซฟอน ตัวพุ่งไปทางตรงข้าม", correct: true }
      - { id: b, text: "ใช้ทิวบ์ฟีตจำนวนมากดันพื้น", feedback: "ทิวบ์ฟีตเป็นของดาวทะเล ซึ่งเคลื่อนที่ช้ามาก" }
      - { id: c, text: "โบกลำตัวและหางเป็นคลื่นซ้ายขวาเหมือนปลา", feedback: "หมึกไม่มีกล้ามเนื้อแบบปลา ใช้การพ่นน้ำเป็นหลัก" }
      - { id: d, text: "ใช้กล้ามเนื้อวงและกล้ามเนื้อตามยาวสลับกันเหมือนไส้เดือน", feedback: "เป็นวิธีของไส้เดือนดินซึ่งเคลื่อนที่ในดิน" }
    hints:
      - "หมึกมีช่องในลำตัวที่เก็บน้ำได้"
      - "นึกถึงลูกโป่งที่ปล่อยลมออก"
    solution: "หมึกดูดน้ำเข้าช่องลำตัว แล้วหดกล้ามเนื้อแมนเทิลพ่นน้ำออกทางไซฟอนอย่างแรง แรงปฏิกิริยาทำให้ตัวพุ่งไปทางตรงข้าม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.movement.p005
    topics: [biology.animals.movement]
    difficulty: 2
    type: order
    stem: "เรียงลำดับเหตุการณ์ในการหดตัวของกล้ามเนื้อโครงร่าง"
    items:
      - "กระแสประสาทจากเซลล์ประสาทสั่งการมาถึงกล้ามเนื้อ"
      - "เซลล์กล้ามเนื้อปล่อย Ca²⁺ ออกมา"
      - "หัวไมโอซินจับกับแอกทิน"
      - "หัวไมโอซินใช้ ATP ดึงแอกทินเข้าหากลางซาร์โคเมียร์"
      - "ซาร์โคเมียร์สั้นลง กล้ามเนื้อหดตัว"
    hints:
      - "เริ่มจากคำสั่งของระบบประสาท"
      - "Ca²⁺ ต้องมาก่อน ไมโอซินจึงจับแอกทินได้"
    solution: "กระแสประสาทมาถึง → ปล่อย Ca²⁺ → ไมโอซินจับแอกทิน → ไมโอซินใช้ ATP ดึงแอกทิน → ซาร์โคเมียร์สั้นลง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.movement.p006
    topics: [biology.animals.movement]
    difficulty: 2
    type: mcq
    stem: "เมื่อกล้ามเนื้อวงของปล้องไส้เดือนดินหดตัว ปล้องนั้นจะเป็นอย่างไร"
    choices:
      - { id: a, text: "ยาวขึ้นและเรียวลง", correct: true }
      - { id: b, text: "สั้นลงและอ้วนขึ้น", feedback: "เป็นผลเมื่อกล้ามเนื้อตามยาวหดตัว" }
      - { id: c, text: "ยาวขึ้นและอ้วนขึ้น", feedback: "ของเหลวในช่องตัวมีปริมาตรคงที่ ถ้ายาวขึ้นต้องเรียวลง" }
      - { id: d, text: "ไม่เปลี่ยนรูปร่าง เพราะไส้เดือนไม่มีโครงร่าง", feedback: "ไส้เดือนดินใช้ของเหลวในช่องตัวเป็นโครงร่างค้ำจุนด้วยน้ำ" }
    hints:
      - "กล้ามเนื้อวงพันรอบลำตัว หดแล้วบีบรอบตัว"
      - "ของเหลวบีบอัดไม่ได้ ถูกบีบรอบตัวแล้วต้องไปทางใด"
    solution: "กล้ามเนื้อวงหดบีบรอบปล้อง ของเหลวที่บีบอัดไม่ได้จึงดันให้ปล้องยืดยาวออกและเรียวลง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.movement.p007
    topics: [biology.animals.movement]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นหน้าที่ของโครงกระดูกมนุษย์ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ป้องกันอวัยวะภายใน เช่น ซี่โครงป้องกันหัวใจและปอด", correct: true }
      - { id: b, text: "ไขกระดูกแดงสร้างเซลล์เม็ดเลือด", correct: true }
      - { id: c, text: "เป็นที่ยึดของกล้ามเนื้อเพื่อการเคลื่อนไหว", correct: true }
      - { id: d, text: "ผลิตฮอร์โมนอินซูลิน", feedback: "อินซูลินสร้างจากตับอ่อน" }
      - { id: e, text: "หดตัวเพื่อดึงอวัยวะให้เคลื่อนที่", feedback: "กระดูกหดตัวไม่ได้ กล้ามเนื้อเป็นส่วนที่หดตัว" }
    hints:
      - "คิดถึงการค้ำจุน การป้องกัน การเคลื่อนไหว และการสร้างเลือด"
      - "อะไรเป็นส่วนที่หดตัวได้ กระดูกหรือกล้ามเนื้อ"
    solution: "กระดูกป้องกันอวัยวะ สร้างเซลล์เม็ดเลือดในไขกระดูกแดง และเป็นที่ยึดของกล้ามเนื้อ ส่วนการหดตัวเป็นหน้าที่ของกล้ามเนื้อ และอินซูลินมาจากตับอ่อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.movement.p008
    topics: [biology.animals.movement]
    difficulty: 3
    type: numeric
    stem: "ปลายแขนอยู่ในแนวระดับและถือดัมเบลหนัก 30 N ไว้ที่ระยะ 30 cm จากข้อศอก ไบเซปส์ยึดห่างข้อศอก 5 cm ไม่คิดน้ำหนักปลายแขน ไบเซปส์ต้องออกแรงกี่นิวตัน"
    answer: { value: 180, unit: N }
    misconceptions:
      - { match: 5, feedback: "สลับระยะ ระยะของน้ำหนักคือ 30 cm ระยะของไบเซปส์คือ 5 cm" }
      - { match: 30, feedback: "แรงกล้ามเนื้อไม่เท่ากับน้ำหนัก เพราะระยะจากจุดหมุนต่างกัน" }
    hints:
      - "ข้อศอกเป็นจุดหมุน โมเมนต์ทั้งสองข้างต้องเท่ากัน"
      - "$F \\times 5 = 30 \\times 30$"
    solution: "$F \\times 5 = 30 \\times 30$ ได้ $F = \\frac{900}{5} = 180$ N มากกว่าน้ำหนักดัมเบล 6 เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.movement.p009
    topics: [biology.animals.movement]
    difficulty: 3
    type: mcq
    stem: "เมื่อกล้ามเนื้อโครงร่างหดตัว ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "ซาร์โคเมียร์สั้นลงและแถบ H แคบลง แต่ความยาวของแอกทินและไมโอซินเท่าเดิม", correct: true }
      - { id: b, text: "แอกทินและไมโอซินหดสั้นลง ซาร์โคเมียร์จึงสั้นลง", feedback: "เส้นใยแต่ละเส้นยาวเท่าเดิม ซาร์โคเมียร์สั้นลงเพราะเส้นใยเลื่อนเข้าซ้อนกัน" }
      - { id: c, text: "ไมโอซินยาวขึ้นจนชนเส้น Z", feedback: "ไมโอซินไม่ยืดยาวขึ้น" }
      - { id: d, text: "แถบ H กว้างขึ้นเพราะแอกทินเลื่อนออกจากกลาง", feedback: "ขณะหดตัว แอกทินเลื่อนเข้าหากลาง แถบ H จึงแคบลง" }
    hints:
      - "ดูภาพซาร์โคเมียร์ขณะคลายตัวและหดตัว"
      - "แถบ H คือช่วงกลางที่มีแต่ไมโอซิน ไม่มีแอกทิน"
    solution: "ตามทฤษฎีการเลื่อนของเส้นใย แอกทินเลื่อนเข้าหากลางซาร์โคเมียร์ เส้น Z เข้าใกล้กัน แถบ H แคบลง ส่วนเส้นใยแต่ละชนิดยาวเท่าเดิม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.movement.p010
    topics: [biology.animals.movement]
    difficulty: 3
    type: mcq
    stem: "ทิวบ์ฟีตของดาวทะเลยืดออกไปแตะพื้นได้อย่างไร"
    choices:
      - { id: a, text: "กระเปาะเหนือทิวบ์ฟีตหดตัว ดันน้ำในระบบท่อน้ำเข้าไปในทิวบ์ฟีตจนยืดออก", correct: true }
      - { id: b, text: "กล้ามเนื้อในทิวบ์ฟีตหดตัวดันให้ยืดออก", feedback: "กล้ามเนื้อดึงได้อย่างเดียว กล้ามเนื้อในทิวบ์ฟีตทำให้ทิวบ์ฟีตหดสั้น ส่วนการยืดเกิดจากแรงดันน้ำ" }
      - { id: c, text: "กระดูกในทิวบ์ฟีตเลื่อนออกมา", feedback: "ทิวบ์ฟีตไม่มีกระดูก ใช้แรงดันน้ำ" }
      - { id: d, text: "ดาวทะเลสูบลมเข้าทิวบ์ฟีต", feedback: "ดาวทะเลใช้น้ำทะเลในระบบท่อน้ำ ไม่ใช่ลม" }
    hints:
      - "ดาวทะเลมีระบบท่อน้ำที่ต่อกับทิวบ์ฟีต"
      - "อะไรดันทิวบ์ฟีตให้ยืด และอะไรดึงให้หด"
    solution: "เมื่อกระเปาะหดตัว น้ำถูกดันเข้าทิวบ์ฟีตจนยืดออกไปยึดพื้น จากนั้นกล้ามเนื้อในทิวบ์ฟีตหดตัวดึงให้สั้นลง ลากตัวไปข้างหน้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.movement.p011
    topics: [biology.animals.movement]
    difficulty: 3
    type: mcq
    stem: "นักกีฬาเซปักตะกร้อลงพื้นผิดท่าจนข้อเท้าพลิก แพทย์บอกว่าเนื้อเยื่อที่ยึดกระดูกขากับกระดูกเท้าฉีกขาด เนื้อเยื่อนั้นคืออะไร"
    choices:
      - { id: a, text: "เอ็นยึดข้อ", correct: true }
      - { id: b, text: "เอ็นกล้ามเนื้อ", feedback: "เอ็นกล้ามเนื้อยึดกล้ามเนื้อกับกระดูก ไม่ได้ยึดกระดูกกับกระดูก" }
      - { id: c, text: "กระดูกอ่อนผิวข้อ", feedback: "กระดูกอ่อนหุ้มปลายกระดูกเพื่อลดการเสียดสี ไม่ได้ยึดกระดูกสองชิ้นเข้าด้วยกัน" }
      - { id: d, text: "ไขกระดูกแดง", feedback: "ไขกระดูกแดงอยู่ในกระดูกและสร้างเซลล์เม็ดเลือด" }
    hints:
      - "ข้อเท้าเป็นข้อต่อระหว่างกระดูกกับกระดูก"
      - "เอ็นมีสองชนิด ชนิดหนึ่งยึดกระดูกกับกระดูก"
    solution: "เนื้อเยื่อที่ยึดกระดูกกับกระดูกตรงข้อต่อคือเอ็นยึดข้อ ข้อเท้าพลิกจึงมักเป็นการบาดเจ็บของเอ็นยึดข้อ ควรหยุดเล่น ประคบเย็น และพบแพทย์ถ้าบวมมากหรือลงน้ำหนักไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.movement.p012
    topics: [biology.animals.movement]
    difficulty: 3
    type: mcq
    stem: "ขณะเหยียดแขนตรงเพื่อผลักประตู กล้ามเนื้อต้นแขนทำงานอย่างไร"
    choices:
      - { id: a, text: "ไตรเซปส์หดตัวดึงปลายแขนให้เหยียด ไบเซปส์คลายตัว", correct: true }
      - { id: b, text: "ไบเซปส์หดตัวดันปลายแขนออกไป", feedback: "กล้ามเนื้อดันไม่ได้ และไบเซปส์หดตัวทำให้แขนงอ ไม่ใช่เหยียด" }
      - { id: c, text: "ไบเซปส์และไตรเซปส์คลายตัวพร้อมกัน", feedback: "ถ้าทั้งสองคลาย ไม่มีแรงเหยียดแขน" }
      - { id: d, text: "ไบเซปส์หดตัว ไตรเซปส์คลายตัว", feedback: "เป็นการทำงานขณะงอแขน" }
    hints:
      - "กล้ามเนื้อออกแรงได้เฉพาะเมื่อหดตัวและดึง"
      - "ไตรเซปส์อยู่ด้านหลังต้นแขน ยึดกับปลายแขนหลังข้อศอก"
    solution: "การเหยียดแขนเกิดจากไตรเซปส์ด้านหลังต้นแขนหดตัวดึงปลายแขน ขณะที่ไบเซปส์คลายตัว ทั้งสองเป็นกล้ามเนื้อคู่ตรงข้าม"
