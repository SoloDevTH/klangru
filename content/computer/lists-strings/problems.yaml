  - id: computer.programming.lists-strings.p012
    topics: [computer.programming.lists-strings]
    difficulty: 4
    type: numeric
    stem: |
      เลขประจำตัวประชาชนไทยมี 13 หลัก หลักสุดท้ายเป็นเลขตรวจสอบที่คำนวณจาก 12 หลักแรก ฟังก์ชันนี้คำนวณเลขตรวจสอบของเลขสมมติ `"123456789012"` ได้เท่าใด

      ```python
      def check_digit(first12):
          total = 0
          for i in range(12):
              total = total + int(first12[i]) * (13 - i)
          return (11 - total % 11) % 10

      print(check_digit("123456789012"))
      ```
    answer: { value: 1 }
    hints:
      - "หลักที่ดัชนี 0 คูณ 13 หลักที่ดัชนี 1 คูณ 12 ลดลงไปจนหลักที่ดัชนี 11 คูณ 2 แล้วรวมกัน"
      - "หาเศษจากการหารผลรวมด้วย 11 ลบออกจาก 11 แล้วหาเศษจากการหารด้วย 10"
    misconceptions:
      - { match: 11, feedback: "ลืม % 10 ท้ายสูตร เลขตรวจสอบต้องเป็นเลขหลักเดียว" }
      - { match: 6, feedback: "ใช้ตัวคูณกลับทาง (2 ถึง 13) ตัวคูณของหลักแรกคือ 13 - 0 = 13" }
    solution: "ผลรวม = 1×13 + 2×12 + 3×11 + 4×10 + 5×9 + 6×8 + 7×7 + 8×6 + 9×5 + 0×4 + 1×3 + 2×2 = 352 ซึ่งหาร 11 ลงตัว (352 % 11 = 0) จึงได้ (11 − 0) % 10 = 1 เลขเต็มคือ 1234567890121 สังเกตว่า int(first12[i]) แปลงอักขระตัวเลขเป็นจำนวนก่อนคูณ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.lists-strings.p013
