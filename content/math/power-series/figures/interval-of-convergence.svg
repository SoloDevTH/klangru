<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 150" width="520" height="150" font-family="sans-serif">
<title>เส้นจำนวนแสดงช่วงการลู่เข้า [-2, 2) ที่จุดศูนย์กลาง 0 มีจุดปลายซ้ายรวมอยู่และจุดปลายขวาไม่รวม</title>
<rect width="520" height="150" fill="#ffffff"/>
<line x1="40" y1="80" x2="480" y2="80" stroke="#444" stroke-width="1.5"/>
<line x1="40.0" y1="75" x2="40.0" y2="85" stroke="#444" stroke-width="1.5"/>
<text x="40.0" y="104" font-size="13" text-anchor="middle" fill="#333">-4</text>
<line x1="95.0" y1="75" x2="95.0" y2="85" stroke="#444" stroke-width="1.5"/>
<text x="95.0" y="104" font-size="13" text-anchor="middle" fill="#333">-3</text>
<line x1="150.0" y1="75" x2="150.0" y2="85" stroke="#444" stroke-width="1.5"/>
<text x="150.0" y="104" font-size="13" text-anchor="middle" fill="#333">-2</text>
<line x1="205.0" y1="75" x2="205.0" y2="85" stroke="#444" stroke-width="1.5"/>
<text x="205.0" y="104" font-size="13" text-anchor="middle" fill="#333">-1</text>
<line x1="260.0" y1="75" x2="260.0" y2="85" stroke="#444" stroke-width="1.5"/>
<text x="260.0" y="104" font-size="13" text-anchor="middle" fill="#333">0</text>
<line x1="315.0" y1="75" x2="315.0" y2="85" stroke="#444" stroke-width="1.5"/>
<text x="315.0" y="104" font-size="13" text-anchor="middle" fill="#333">1</text>
<line x1="370.0" y1="75" x2="370.0" y2="85" stroke="#444" stroke-width="1.5"/>
<text x="370.0" y="104" font-size="13" text-anchor="middle" fill="#333">2</text>
<line x1="425.0" y1="75" x2="425.0" y2="85" stroke="#444" stroke-width="1.5"/>
<text x="425.0" y="104" font-size="13" text-anchor="middle" fill="#333">3</text>
<line x1="480.0" y1="75" x2="480.0" y2="85" stroke="#444" stroke-width="1.5"/>
<text x="480.0" y="104" font-size="13" text-anchor="middle" fill="#333">4</text>
<line x1="150.0" y1="80" x2="370.0" y2="80" stroke="#1f5fa8" stroke-width="6" stroke-linecap="butt"/>
<circle cx="150.0" cy="80" r="6" fill="#1f5fa8"/>
<circle cx="370.0" cy="80" r="6" fill="#ffffff" stroke="#1f5fa8" stroke-width="2"/>
<line x1="260.0" y1="62" x2="260.0" y2="46" stroke="#d35400" stroke-width="1.5"/>
<text x="260.0" y="40" font-size="13" text-anchor="middle" fill="#d35400">จุดศูนย์กลาง a = 0</text>
<text x="150.0" y="66" font-size="13" text-anchor="middle" fill="#15211e">รวมจุดปลายซ้าย</text>
<text x="370.0" y="66" font-size="13" text-anchor="middle" fill="#15211e">ไม่รวมจุดปลายขวา</text>
</svg>
