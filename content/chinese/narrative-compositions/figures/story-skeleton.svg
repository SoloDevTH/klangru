<text x="502.0" y="182" font-size="18" fill="#8a5a00" text-anchor="middle" font-weight="bold">ตัวละคร</text>
<text x="502.0" y="240" font-size="20" fill="#222" text-anchor="middle" font-weight="normal">我和家人</text>
<line x1="590" y1="205.0" x2="612" y2="205.0" stroke="#555" stroke-width="3" stroke-linecap="round"/>
<rect x="616" y="90" width="168" height="230" rx="12" fill="#fff" stroke="#b3261e" stroke-width="3"/>
<rect x="616" y="90" width="168" height="50" rx="12" fill="#b3261e" stroke="#b3261e" stroke-width="3"/>
<text x="700.0" y="124" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold">事件</text>
<text x="700.0" y="182" font-size="18" fill="#b3261e" text-anchor="middle" font-weight="bold">เหตุการณ์</text>
