<text x="40.0" y="368.0" text-anchor="start" font-size="13" fill="#333">ความสัมพันธ์: 9 = แรง · 3 = ปานกลาง · 1 = อ่อน · ช่องว่าง = ไม่สัมพันธ์</text>
<text x="40.0" y="392.0" text-anchor="start" font-size="13" fill="#333">ความสำคัญ 1–5 จากการสำรวจลูกค้า (5 = สำคัญที่สุด)</text>
