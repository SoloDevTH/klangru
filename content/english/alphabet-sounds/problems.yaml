problems:
  - id: english.phonics.alphabet-sounds.p001
    topics: [english.phonics.alphabet-sounds]
    difficulty: 1
    type: mcq
    stem: "ตัว **B** พิมพ์ใหญ่ เขียนเป็นตัวพิมพ์เล็กอย่างไร"
    choices:
      - { id: a, text: "b", correct: true, feedback: "ถูก หัวกลมของ b อยู่ทางขวา" }
      - { id: b, text: "d", feedback: "d เป็นตัวพิมพ์เล็กของ D หัวกลมของ d อยู่ทางซ้าย กลับด้านกับ b" }
      - { id: c, text: "p", feedback: "p ก้านยาวลงล่าง เป็นตัวพิมพ์เล็กของ P" }
      - { id: d, text: "q", feedback: "q ก้านยาวลงล่างและหัวกลมอยู่ทางซ้าย เป็นตัวพิมพ์เล็กของ Q" }
    hints:
      - "ตัวพิมพ์เล็กที่มีหัวกลมกับก้าน มีสี่ตัวที่หน้าตาคล้ายกัน: b d p q"
      - "ตัวพิมพ์เล็กของ B มีก้านขึ้นข้างบน และหัวกลมอยู่ทางขวา"
    solution: "B พิมพ์เล็กคือ **b** ก้านชี้ขึ้นและหัวกลมอยู่ทางขวา ระวังสับสนกับ d (หัวกลมทางซ้าย) และ p q (ก้านชี้ลง)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.alphabet-sounds.p002
    topics: [english.phonics.alphabet-sounds]
    difficulty: 1
    type: text
    stem: "ตัวอักษรที่อยู่ **ถัดจาก** M คือตัวอะไร (พิมพ์ตัวอักษรตัวเดียว)"
    accepted: ["n", "N"]
    misconceptions:
      - { match: "l", feedback: "L อยู่ก่อน M ส่วนตัวที่อยู่ถัดไปคือตัวหลัง M" }
      - { match: "o", feedback: "O อยู่ห่างจาก M สองตัว ลองท่อง L M N O อีกครั้ง" }
    hints:
      - "ท่องตัวอักษรจาก K: K L M ..."
      - "ตัวถัดไปคือตัวที่ท่องต่อจาก M ทันที"
    solution: "ลำดับคือ K L M **N** O P ตัวที่อยู่ถัดจาก M คือ **N**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.alphabet-sounds.p003
    topics: [english.phonics.alphabet-sounds]
    difficulty: 1
    type: match
    stem: "จับคู่ตัวพิมพ์ใหญ่กับตัวพิมพ์เล็ก"
    pairs:
      - { left: "D", right: "d" }
      - { left: "G", right: "g" }
      - { left: "Q", right: "q" }
      - { left: "R", right: "r" }
      - { left: "E", right: "e" }
    hints:
      - "บางตัวพิมพ์เล็กหน้าตาต่างจากพิมพ์ใหญ่มาก เช่น G กับ g"
      - "d หัวกลมอยู่ทางซ้าย q ก้านชี้ลงล่าง"
    solution: "D → d · G → g · Q → q · R → r · E → e"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.alphabet-sounds.p004
    topics: [english.phonics.alphabet-sounds]
    difficulty: 1
    type: mcq
    stem: "คำว่า *sun* (ดวงอาทิตย์) ขึ้นต้นด้วยตัวอักษรใด"
    choices:
      - { id: a, text: "s", correct: true, feedback: "ถูก sun ขึ้นต้นด้วยเสียง ส เขียนด้วย s" }
      - { id: b, text: "c", feedback: "c ออกเสียง ส ได้ในบางคำ เช่น city แต่คำว่า sun สะกดด้วย s" }
      - { id: c, text: "z", feedback: "z เป็นเสียง ซ ที่สั่นในลำคอ เช่น zoo ส่วน sun เป็นเสียง ส ไม่สั่น" }
      - { id: d, text: "u", feedback: "u เป็นสระตัวที่สองของคำ (เสียง อะ) ไม่ใช่ตัวแรก" }
    hints:
      - "ออกเสียง ซัน ช้า ๆ แล้วฟังเสียงแรก"
      - "เสียงแรกคือ ส ตัวอักษรที่ให้เสียง ส บ่อยที่สุดคือตัวไหน"
    solution: "*sun* = s-u-n เสียงแรกคือ ส เขียนด้วย **s**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.alphabet-sounds.p005
    topics: [english.phonics.alphabet-sounds]
    difficulty: 2
    type: mcq
    stem: "คำใดขึ้นต้นด้วยเสียงเดียวกับคำว่า *ball* (ลูกบอล)"
    choices:
      - { id: a, text: "bed", correct: true, feedback: "ถูก ball และ bed ขึ้นต้นด้วยเสียง บ (b)" }
      - { id: b, text: "doll", feedback: "doll ขึ้นต้นด้วย d เสียง ด ตัว b กับ d หน้าตาคล้ายกันแต่เสียงต่างกัน" }
      - { id: c, text: "pen", feedback: "pen ขึ้นต้นด้วย p เสียง พ ซึ่งมีลมพ่นออกมา ส่วน b เสียง บ" }
      - { id: d, text: "van", feedback: "van ขึ้นต้นด้วย v ฟันบนแตะริมฝีปากล่าง ส่วน b ใช้ริมฝีปากสองข้างปิดแล้วเปิด" }
    hints:
      - "เสียงแรกของ ball คือเสียงอะไร"
      - "หาคำที่ตัวแรกเป็นตัวอักษรเดียวกับ ball"
    solution: "ball ขึ้นต้นด้วย b เสียง บ คำที่ขึ้นต้นด้วยเสียงเดียวกันคือ **bed**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.alphabet-sounds.p006
    topics: [english.phonics.alphabet-sounds]
    difficulty: 2
    type: text
    stem: "เติมสระที่หายไปให้เป็นคำว่า **แมว** (อ่านว่า แคท): *c _ t* (พิมพ์ตัวอักษรตัวเดียว)"
    accepted: ["a"]
    misconceptions:
      - { match: "e", feedback: "e ออกเสียง เอะ เช่น pet แต่เสียง แอ ในคำว่า แคท เขียนด้วย a" }
      - { match: "u", feedback: "u ออกเสียง อะ ถ้าใส่ u จะได้ cut (ตัด)" }
    hints:
      - "เสียงสระในคำว่า แคท คือเสียง แอ"
      - "ดูตารางสระเสียงสั้น: เสียง แอ ใช้ตัวอักษรใด"
    solution: "แคท มีสระเสียงสั้น แอ ซึ่งเขียนด้วย **a** จึงได้ *cat*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.alphabet-sounds.p007
    topics: [english.phonics.alphabet-sounds]
    difficulty: 2
    type: numeric
    stem: "คำว่า *ship* (เรือ) มีกี่ **เสียง** (ตอบเป็นจำนวนเสียง)"
    answer: { value: 3, unit: "เสียง" }
    misconceptions:
      - { match: 4, feedback: "4 คือจำนวนตัวอักษร แต่ s กับ h รวมกันเป็นเสียง sh เสียงเดียว" }
      - { match: 2, feedback: "ลองแยกเสียงทีละเสียง: เสียง ช (sh) เสียง อิ (i) และเสียง พ (p) ท้ายคำ" }
    hints:
      - "ตัวอักษรบางคู่รวมกันเป็นเสียงเดียว"
      - "sh เป็นหนึ่งเสียง แล้วนับเสียงที่เหลือ"
    solution: "*ship* = sh - i - p มี **3 เสียง** แม้จะมี 4 ตัวอักษร เพราะ sh เป็นเสียงเดียว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.alphabet-sounds.p008
    topics: [english.phonics.alphabet-sounds]
    difficulty: 2
    type: order
    stem: "เรียงเสียงให้เป็นคำว่า **ปลา** (fish)"
    items: ["f", "i", "sh"]
    hints:
      - "fish ขึ้นต้นด้วยเสียง ฟ"
      - "เสียงสุดท้ายคือ ช (sh) ที่ห่อปาก"
    solution: "*fish* = **f - i - sh** เสียง ฟ ตามด้วยสระสั้น อิ และลงท้ายด้วย sh"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.alphabet-sounds.p009
    topics: [english.phonics.alphabet-sounds]
    difficulty: 3
    type: mcq
    stem: "ตัว **i** ในคำว่า *bike* (จักรยาน) ออกเสียงอย่างไร"
    choices:
      - { id: a, text: "เสียงยาว ไอ เหมือนชื่อตัว I", correct: true, feedback: "ถูก e ท้ายคำทำให้ i ออกเสียงยาวตามชื่อตัวเอง bike อ่านว่า ไบค์" }
      - { id: b, text: "เสียงสั้น อิ", feedback: "i เสียงสั้น อิ ใช้ในคำที่ไม่มี e ท้าย เช่น big แต่ bike มี e ท้ายคำ" }
      - { id: c, text: "เสียง อิ และต้องออกเสียง e ท้ายคำด้วย", feedback: "e ท้ายคำไม่ออกเสียง bike ไม่ได้อ่านว่า บิ-เคะ" }
      - { id: d, text: "ไม่ออกเสียง", feedback: "ทุกคำต้องมีเสียงสระ i ในคำนี้เป็นเสียงสระของคำ" }
    hints:
      - "ดูตัวอักษรตัวสุดท้ายของ bike"
      - "นึกถึงกฎ magic e"
    solution: "*bike* มี e ท้ายคำ ตามกฎ magic e ตัว i จึงออกเสียงยาว **ไอ** และ e ไม่ออกเสียง อ่านว่า ไบค์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.alphabet-sounds.p010
    topics: [english.phonics.alphabet-sounds]
    difficulty: 3
    type: text
    stem: "ช่วงหน้าร้อน เด็ก ๆ ชอบเล่นว่าวที่ทุ่งนา เติมตัวอักษรหนึ่งตัวท้ายคำ *kit* ให้เป็นคำว่า **ว่าว** (พิมพ์ทั้งคำ)"
    accepted: ["kite"]
    misconceptions:
      - { match: "kit", feedback: "kit แปลว่าชุดอุปกรณ์ ต้องเติมตัวอักษรอีกหนึ่งตัวท้ายคำ" }
      - { match: "kitt", feedback: "เติม t ซ้ำไม่ทำให้เสียงสระเปลี่ยน ลองนึกถึง magic e" }
      - { match: "kity", feedback: "ตัวที่ทำให้ i ออกเสียงยาว ไอ คือ e ท้ายคำ ไม่ใช่ y" }
    hints:
      - "ว่าว อ่านว่า ไคท์ สระเสียงยาว ไอ"
      - "ตัวอักษรใดเมื่อเติมท้ายคำแล้วทำให้สระข้างหน้าออกเสียงยาว"
    solution: "เติม e ท้ายคำ: kit + e = **kite** ตัว e ไม่ออกเสียง แต่ทำให้ i ออกเสียงยาว ไอ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.alphabet-sounds.p011
    topics: [english.phonics.alphabet-sounds]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "คำใดมี **สระเสียงสั้น** (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "cat", correct: true }
      - { id: b, text: "pig", correct: true }
      - { id: c, text: "bed", correct: true }
      - { id: d, text: "cake", feedback: "cake มี e ท้ายคำ a จึงออกเสียงยาว เอ (เคก)" }
      - { id: e, text: "home", feedback: "home มี e ท้ายคำ o จึงออกเสียงยาว โอ (โฮม)" }
    hints:
      - "คำที่มี e ท้ายคำมักทำให้สระออกเสียงยาว"
      - "คำรูป พยัญชนะ-สระ-พยัญชนะ ที่ไม่มี e ท้าย มักเป็นสระเสียงสั้น"
    solution: "สระเสียงสั้น: cat (แอ) · pig (อิ) · bed (เอะ) ส่วน cake (เอ) และ home (โอ) เป็นสระเสียงยาวเพราะมี e ท้ายคำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.alphabet-sounds.p012
    topics: [english.phonics.alphabet-sounds]
    difficulty: 3
    type: mcq
    stem: "**เสียงสุดท้าย** ของคำว่า *five* (ห้า) คือเสียงใด"
    choices:
      - { id: a, text: "เสียง v: ฟันบนแตะริมฝีปากล่างแล้วเปล่งเสียงสั่น", correct: true, feedback: "ถูก e ไม่ออกเสียง เสียงสุดท้ายจึงเป็น v" }
      - { id: b, text: "เสียง เอะ ของตัว e", feedback: "e ท้ายคำไม่ออกเสียง ทำหน้าที่ทำให้ i ออกเสียงยาวเท่านั้น" }
      - { id: c, text: "ไม่มีเสียงท้าย อ่านว่า ไฟ", feedback: "คนไทยมักไม่ออกเสียงท้ายเพราะภาษาไทยไม่มีตัวสะกดเสียง v แต่ภาษาอังกฤษต้องออกเสียง v ให้ได้ยิน" }
      - { id: d, text: "เสียง ว", feedback: "ภาษาอังกฤษไม่มีเสียง ว ท้ายคำแบบนี้ v ต้องใช้ฟันบนแตะริมฝีปากล่าง" }
    hints:
      - "ตัวอักษรตัวสุดท้ายของ five คือ e ซึ่งออกเสียงหรือไม่"
      - "ดูตัวอักษรก่อน e"
    solution: "*five* = f - ไอ - v ตัว e ไม่ออกเสียง เสียงสุดท้ายจึงเป็น **v** ต้องออกเสียงให้ได้ยิน ไม่อ่านแค่ \"ไฟ\""
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.alphabet-sounds.p013
    topics: [english.phonics.alphabet-sounds]
    difficulty: 4
    type: text
    stem: "สะกดคำว่า **เตียง** ซึ่งมี 3 เสียง: บ + เอะ + ด (พิมพ์คำภาษาอังกฤษ)"
    accepted: ["bed"]
    misconceptions:
      - { match: "bad", feedback: "a ออกเสียง แอ bad จึงแปลว่า เลว เสียง เอะ ใช้ e" }
      - { match: "bet", feedback: "เสียงท้ายเป็น ด ใช้ d ภาษาไทยออกเสียงตัวสะกด ด กับ ต เหมือนกัน แต่ภาษาอังกฤษต่างกัน" }
      - { match: "ped", feedback: "เสียงแรก บ ใช้ b ส่วน p เป็นเสียง พ" }
    hints:
      - "หาตัวอักษรของแต่ละเสียงทีละเสียง"
      - "เสียง บ ใช้ b เสียง เอะ ใช้สระตัวไหน เสียง ด ใช้ d"
    solution: "บ = b · เอะ = e · ด = d รวมเป็น **bed**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.alphabet-sounds.p014
    topics: [english.phonics.alphabet-sounds]
    difficulty: 4
    type: mcq
    stem: "ข้อใด **ถูกต้อง** เมื่อเทียบการเขียนภาษาอังกฤษกับภาษาไทย"
    choices:
      - { id: a, text: "ภาษาอังกฤษเขียนสระในบรรทัดเดียวกับพยัญชนะ และไม่มีรูปวรรณยุกต์", correct: true, feedback: "ถูก ภาษาอังกฤษไม่มีสระบน ล่าง และไม่มีไม้เอก ไม้โท" }
      - { id: b, text: "ภาษาอังกฤษมีพยัญชนะ 44 ตัวเหมือนภาษาไทย", feedback: "ภาษาไทยมีพยัญชนะ 44 ตัว ส่วนภาษาอังกฤษมีตัวอักษรทั้งหมด 26 ตัว เป็นพยัญชนะ 21 ตัว" }
      - { id: c, text: "ภาษาอังกฤษเขียนคำติดกันไม่เว้นวรรค เหมือนภาษาไทย", feedback: "ภาษาอังกฤษเว้นวรรคระหว่างทุกคำ ภาษาไทยต่างหากที่เขียนติดกัน" }
      - { id: d, text: "ภาษาไทยมีตัวพิมพ์ใหญ่และตัวพิมพ์เล็กเหมือนภาษาอังกฤษ", feedback: "ภาษาไทยไม่มีตัวพิมพ์ใหญ่ เล็ก ภาษาอังกฤษใช้ตัวพิมพ์ใหญ่ขึ้นต้นประโยคและชื่อเฉพาะ" }
    hints:
      - "นึกถึงตำแหน่งของสระ และเครื่องหมาย ่ ้ ในภาษาไทย"
      - "ภาษาอังกฤษมีตัวอักษรกี่ตัว และเว้นวรรคระหว่างคำหรือไม่"
    solution: "ภาษาอังกฤษมี 26 ตัวอักษร สระอยู่ในบรรทัดเดียวกับพยัญชนะ ไม่มีวรรณยุกต์ มีตัวพิมพ์ใหญ่ เล็ก และเว้นวรรคทุกคำ ข้อที่ถูกคือ **ข้อแรก**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.alphabet-sounds.p015
    topics: [english.phonics.alphabet-sounds]
    difficulty: 4
    type: mcq
    stem: "คนไทยหลายคนออกเสียงคำว่า *bus* (รถเมล์) ว่า \"บัด\" เพราะอะไร"
    choices:
