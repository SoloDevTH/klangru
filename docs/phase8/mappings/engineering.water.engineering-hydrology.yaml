  - { framework: th-coe-engineering-basics, indicators: ["CIV-3.4"], coverage: partial, note: "สอนอุทกวิทยาของวิศวกรรมแหล่งน้ำครอบคลุม วัฏจักรน้ำและสมดุลน้ำ ฝนเฉลี่ยของพื้นที่ น้ำท่าและไฮโดรกราฟ วิธีเหตุผล คาบการเกิดซ้ำ และการวิเคราะห์ความถี่น้ำหลากเบื้องต้น ยังไม่สอนการออกแบบโครงสร้างชลศาสตร์ การไหลในท่อและคลองแบบเต็มระบบ การหน่วงน้ำในลำน้ำ (flood routing) แบบจำลองอุทกวิทยาเชิงตัวเลข และการขนส่งน้ำในโครงข่ายจริง" }
