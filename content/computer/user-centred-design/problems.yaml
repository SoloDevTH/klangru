      - { id: c, text: "เปิดใช้ทั้งโรงเรียนเลย เพราะเกือบผ่านแล้ว", feedback: "ยังไม่ผ่านเกณฑ์ที่ตั้งไว้ นักเรียนเกือบ 1 ใน 3 จะยังใช้ไม่ทัน" }
