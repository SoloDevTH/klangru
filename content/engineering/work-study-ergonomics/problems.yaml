  - id: engineering.industrial.work-study-ergonomics.p012
    topics:
      - engineering.industrial.work-study-ergonomics
    difficulty: 4
    type: numeric
    stem: (ข้อมูลสมมติ) พนักงานคลังสินค้ายกกล่องจากชั้นล่างขึ้นไปวางบนชั้นที่สูงกว่า มือจับห่างจากลำตัว (H) 30 ซม. ตำแหน่งเริ่มยก (V) 40 ซม. จากพื้น ระยะแนวดิ่งที่ยก (D) 60 ซม. ไม่มีการบิดตัว (A = 0) ถ้าใช้สมการ NIOSH แบบย่อ (FM = 1, CM = 1) น้ำหนักแนะนำสูงสุด (RWL) เป็นกี่กิโลกรัม (ตอบทศนิยมหนึ่งตำแหน่ง ตัวเลขอย่างเดียว)
    answer:
      value: 15.4
      tolerance: 0.1
      unit: kg
    hints:
      - RWL = 23 × HM × VM × DM × AM × FM × CM โดยแต่ละตัวคูณตามระยะ
      - HM = 25 ÷ H, VM = 1 − 0.003 × |V − 75|, DM = 0.82 + 4.5 ÷ D (หน่วยซม.)
    misconceptions:
      - match: 17.2
        feedback: ลืมตัวคูณ VM ซึ่งลดค่า RWL เมื่อจุดเริ่มยกไม่ใกล้ระดับ 75 ซม.
      - match: 19.2
        feedback: ใช้เฉพาะ 23 กก. และ HM แล้วลืมตัวคูณแนวดิ่งและระยะยก
    solution: HM = 25 ÷ 30 ≈ 0.833 VM = 1 − 0.003 × |40 − 75| = 0.895 DM = 0.82 + 4.5 ÷ 60 = 0.895 RWL = 23 × 0.833 × 0.895 × 0.895 ≈ 15.35 ≈ 15.4 กก. ถ้ายกหนักกว่านี้ ดัชนีการยกจะเกิน 1 และความเสี่ยงต่อหลังส่วนล่างเพิ่มขึ้น
