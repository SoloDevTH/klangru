problems:
  - id: computer.systems.physical-computing.p001
    topics: [computer.systems.physical-computing]
    difficulty: 1
    type: mcq
    stem: "ระบบรดน้ำผักอัตโนมัติของโรงเรียนมีอุปกรณ์หลายชิ้น ชิ้นใดเป็น **เซนเซอร์**"
    choices:
      - { id: a, text: "แท่งวัดความชื้นในดิน", correct: true }
      - { id: b, text: "ปั๊มน้ำ", feedback: "ปั๊มน้ำลงมือทำงานตามคำสั่ง จึงเป็นตัวขับเคลื่อน" }
      - { id: c, text: "หลอด LED แสดงสถานะ", feedback: "LED แสดงผลออกมา เป็นอุปกรณ์ส่งออก ไม่ได้รับรู้สิ่งแวดล้อม" }
      - { id: d, text: "ไมโครคอนโทรลเลอร์", feedback: "ไมโครคอนโทรลเลอร์ประมวลผลและตัดสินใจ ไม่ได้วัดค่าเอง" }
    hints:
      - "เซนเซอร์ทำหน้าที่รับรู้หรือวัดสิ่งรอบตัว"
      - "อุปกรณ์ใดเปลี่ยนสภาพของดินเป็นสัญญาณไฟฟ้า"
    solution: "แท่งวัดความชื้นแปลงความชื้นในดินเป็นสัญญาณไฟฟ้า จึงเป็นเซนเซอร์ (รับเข้า) ปั๊มและ LED เป็นอุปกรณ์ส่งออก ไมโครคอนโทรลเลอร์เป็นตัวประมวลผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.physical-computing.p002
    topics: [computer.systems.physical-computing]
    difficulty: 1
    type: match
    stem: "จับคู่อุปกรณ์ในระบบประตูเปิดอัตโนมัติกับหน้าที่"
    pairs:
      - { left: "เซนเซอร์ตรวจจับการเคลื่อนไหว (PIR)", right: "รับเข้า: รับรู้ว่ามีคนเดินมา" }
      - { left: "ไมโครคอนโทรลเลอร์", right: "ประมวลผล: ตัดสินใจตามโปรแกรม" }
      - { left: "มอเตอร์เลื่อนประตู", right: "ส่งออก: ลงมือทำ (ตัวขับเคลื่อน)" }
      - { left: "โมดูล Wi-Fi", right: "สื่อสาร: ส่งจำนวนคนเข้าออกไปยังเซิร์ฟเวอร์" }
    hints:
      - "คิดตามลำดับ รับรู้ → ตัดสินใจ → ลงมือ → ส่งข้อมูล"
      - "มอเตอร์ทำให้เกิดการเคลื่อนที่ จึงอยู่ฝั่งส่งออก"
    solution: "PIR รับรู้การเคลื่อนไหว ไมโครคอนโทรลเลอร์ตัดสินใจ มอเตอร์เป็นตัวขับเคลื่อนที่เปิดประตู และ Wi-Fi ส่งข้อมูลออกไปยังเครื่องอื่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.physical-computing.p003
    topics: [computer.systems.physical-computing]
    difficulty: 2
    type: mcq
    stem: "ข้อใด **ไม่ใช่** ระบบสมองกลฝังตัว"
    choices:
      - { id: a, text: "แล็ปท็อปที่ใช้พิมพ์รายงาน เล่นเกม และตัดต่อวิดีโอ", correct: true }
      - { id: b, text: "หม้อหุงข้าวดิจิทัล", feedback: "หม้อหุงข้าวมีคอมพิวเตอร์ฝังอยู่เพื่อคุมการหุงอย่างเดียว จึงเป็นระบบสมองกลฝังตัว" }
      - { id: c, text: "ไฟจราจรที่นับเวลาถอยหลัง", feedback: "ตัวควบคุมไฟจราจรทำงานเฉพาะอย่างซ้ำ ๆ เป็นระบบสมองกลฝังตัว" }
      - { id: d, text: "นาฬิกานับก้าวที่ข้อมือ", feedback: "นาฬิกานับก้าวมีไมโครคอนโทรลเลอร์และเซนเซอร์วัดการเคลื่อนไหว เป็นระบบสมองกลฝังตัว" }
    hints:
      - "ระบบสมองกลฝังตัวทำงานเฉพาะอย่างหนึ่งภายในสิ่งของ"
      - "อุปกรณ์ใดใช้ทำงานได้หลากหลายตามโปรแกรมที่ผู้ใช้ติดตั้ง"
    solution: "แล็ปท็อปเป็นคอมพิวเตอร์อเนกประสงค์ ติดตั้งโปรแกรมทำงานได้หลายอย่าง ส่วนอีกสามข้อมีคอมพิวเตอร์ฝังในสิ่งของเพื่อทำงานเฉพาะอย่าง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.physical-computing.p004
    topics: [computer.systems.physical-computing]
    difficulty: 2
    type: numeric
    stem: "บอร์ดมีตัวแปลงแอนะล็อกเป็นดิจิทัล (ADC) ขนาด 10 บิต ค่าที่อ่านได้เริ่มที่ 0 ค่ามากที่สุดที่อ่านได้คือเท่าใด"
    answer: { value: 1023 }
    hints:
      - "10 บิตแทนจำนวนได้ทั้งหมด $2^{10}$ แบบ"
      - "ถ้าเริ่มนับที่ 0 ค่ามากที่สุดคือจำนวนแบบลบ 1"
    misconceptions:
      - { match: 1024, feedback: "1024 คือจำนวนระดับทั้งหมด แต่เริ่มนับที่ 0 ค่าสูงสุดจึงน้อยกว่านั้น 1" }
      - { match: 10, feedback: "10 คือจำนวนบิต ไม่ใช่ค่าที่อ่านได้" }
      - { match: 4095, feedback: "4095 คือค่าสูงสุดของ ADC 12 บิต" }
    solution: "10 บิตแทนได้ $2^{10} = 1024$ แบบ คือ 0 ถึง 1023 ค่าสูงสุดจึงเป็น 1023"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.physical-computing.p005
    topics: [computer.systems.physical-computing]
    difficulty: 2
    type: text
    stem: "อุปกรณ์ที่เปลี่ยนคำสั่งไฟฟ้าจากไมโครคอนโทรลเลอร์ให้เป็นการกระทำทางกายภาพ เช่น มอเตอร์ เซอร์โว และรีเลย์ เรียกรวมว่าอะไร (ภาษาไทยหรืออังกฤษ)"
    accepted: ["ตัวขับเคลื่อน", "actuator", "แอกชูเอเตอร์", "แอคชูเอเตอร์", "ตัวขับเร้า"]
    misconceptions:
      - { match: "เซนเซอร์", feedback: "เซนเซอร์ทำงานกลับทาง คือแปลงสิ่งที่วัดได้เป็นสัญญาณไฟฟ้า" }
      - { match: "sensor", feedback: "sensor รับรู้สิ่งแวดล้อม ส่วนอุปกรณ์ในโจทย์ลงมือทำ" }
    hints:
      - "อุปกรณ์กลุ่มนี้อยู่ฝั่งส่งออกของระบบ"
      - "ภาษาอังกฤษขึ้นต้นด้วย act (กระทำ)"
    solution: "ตัวขับเคลื่อน (actuator) เปลี่ยนสัญญาณคำสั่งเป็นการเคลื่อนที่ แสง เสียง หรือการเปิดปิดวงจร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.physical-computing.p006
    topics: [computer.systems.physical-computing]
    difficulty: 2
    type: mcq
    stem: "นักเรียนต้องการให้บอร์ด micro:bit สั่งปั๊มน้ำไฟบ้าน 220 V วิธีใดถูกต้องและปลอดภัย"
    choices:
      - { id: a, text: "ให้บอร์ดสั่งงานผ่านโมดูลรีเลย์ และให้ครูหรือผู้ใหญ่ที่มีความรู้เป็นผู้ต่อส่วนที่เป็นไฟบ้าน", correct: true }
      - { id: b, text: "ต่อสายปั๊มเข้ากับขาของบอร์ดโดยตรง", feedback: "ขาบอร์ดจ่ายไฟได้น้อยมากและรับไฟบ้านไม่ได้ บอร์ดจะเสียและเป็นอันตราย" }
      - { id: c, text: "ใช้ปั๊มไฟบ้านแต่จ่ายไฟจากแบตเตอรี่ของบอร์ดแทน", feedback: "แบตเตอรี่เล็กให้แรงดันและกระแสไม่พอสำหรับปั๊ม 220 V" }
      - { id: d, text: "ต่อเองได้ถ้าใส่ถุงมือยาง", feedback: "ถุงมือไม่ได้ทำให้การต่อวงจรถูกต้อง งานไฟบ้านต้องให้ผู้มีความรู้ทำ" }
    hints:
      - "ขาบอร์ดเป็นสัญญาณควบคุม ไม่ใช่แหล่งจ่ายไฟให้อุปกรณ์กำลังสูง"
      - "อุปกรณ์ใดใช้สัญญาณเล็กเปิดปิดวงจรใหญ่"
    solution: "รีเลย์ใช้สัญญาณไฟเล็กจากบอร์ดเปิดปิดวงจรไฟบ้านที่แยกออกไป บอร์ดจึงปลอดภัย และงานไฟบ้าน 220 V ต้องให้ผู้ใหญ่ที่มีความรู้ทำเพราะอันตรายถึงชีวิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.physical-computing.p007
    topics: [computer.systems.physical-computing]
    difficulty: 3
    type: numeric
    stem: "ปรับเทียบเซนเซอร์ความชื้นดินแล้วพบว่า ดินแห้งสนิทอ่านได้ 800 และดินแช่น้ำอ่านได้ 300 (ยิ่งชื้นค่ายิ่งน้อย) ถ้าอ่านได้ 400 ดินมีความชื้นกี่เปอร์เซ็นต์ ใช้สูตรในบทเรียน"
    answer: { value: 80, unit: "%" }
    hints:
      - "ความชื้น = (ค่าแห้ง − ค่าที่อ่าน) ÷ (ค่าแห้ง − ค่าเปียก) × 100"
      - "ค่าที่อ่าน 400 อยู่ใกล้ค่าเปียกหรือค่าแห้งมากกว่า คำตอบควรมากหรือน้อย"
    misconceptions:
      - { match: 20, feedback: "ใช้ (ค่าที่อ่าน − ค่าเปียก) ซึ่งกลับทาง เซนเซอร์นี้ยิ่งชื้นค่ายิ่งน้อย" }
      - { match: 39.1, feedback: "หารด้วย 1023 ตรง ๆ ไม่ได้ใช้ค่าที่ปรับเทียบ" }
    solution: "(800 − 400) ÷ (800 − 300) × 100 = 400 ÷ 500 × 100 = 80% ค่า 400 ใกล้ค่าเปียก 300 จึงชื้นมาก สมเหตุสมผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.physical-computing.p008
    topics: [computer.systems.physical-computing]
    difficulty: 3
    type: numeric
    stem: "สถานีวัดอากาศของโรงเรียนอ่านค่าอุณหภูมิทุก 10 นาทีตลอดวัน หนึ่งวันได้ค่าทั้งหมดกี่ค่า"
    answer: { value: 144, unit: "ค่า" }
    hints:
      - "หนึ่งวันมีกี่นาที"
      - "หารจำนวนนาทีทั้งวันด้วยช่วงเวลาระหว่างการอ่าน"
    misconceptions:
      - { match: 8640, feedback: "ใช้จำนวนวินาทีในหนึ่งวัน 86,400 หารด้วย 10 แต่ช่วงเวลาเป็น 10 นาที ไม่ใช่ 10 วินาที" }
      - { match: 240, feedback: "คูณ 24 ชั่วโมงด้วย 10 แต่ต้องหาว่า 10 นาทีอยู่ในหนึ่งวันกี่ครั้ง" }
    solution: "หนึ่งวันมี 24 × 60 = 1,440 นาที อ่านทุก 10 นาทีได้ 1,440 ÷ 10 = 144 ค่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.physical-computing.p009
    topics: [computer.systems.physical-computing]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนในวงวนหลักของโปรแกรมระบบรดน้ำอัตโนมัติ (หนึ่งรอบ)"
    items:
      - "อ่านค่าดิบจากเซนเซอร์ความชื้น"
      - "แปลงค่าดิบเป็นเปอร์เซ็นต์ด้วยค่าที่ปรับเทียบ"
      - "เทียบกับเกณฑ์เพื่อตัดสินใจเปิดหรือปิดปั๊ม"
      - "สั่งรีเลย์ของปั๊มตามที่ตัดสินใจ"
      - "ส่งค่าความชื้นและสถานะปั๊มไปยังเซิร์ฟเวอร์"
      - "รอตามช่วงเวลาที่กำหนด แล้ววนกลับไปอ่านใหม่"
    hints:
      - "ต้องมีข้อมูลก่อนจึงตัดสินใจได้ และต้องตัดสินใจก่อนจึงสั่งงานได้"
      - "การส่งข้อมูลควรส่งผลล่าสุด รวมทั้งสถานะปั๊มที่เพิ่งสั่ง"
    solution: "อ่าน → แปลงค่า → ตัดสินใจ → สั่งตัวขับเคลื่อน → ส่งข้อมูล → รอแล้ววนใหม่ เป็นรูปแบบรับเข้า–ประมวลผล–ส่งออกที่ทำซ้ำตลอดเวลา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.physical-computing.p010
    topics: [computer.systems.physical-computing]
    difficulty: 3
    type: numeric
    stem: |
      โปรแกรมจำลองนี้นับว่าปั๊มถูกสั่งเปิดกี่ครั้ง แสดงตัวเลขใด

      ```python
      readings = [45, 30, 28, 25, 40, 29]
      count = 0
      for m in readings:
          if m < 30:
              count = count + 1
      print(count)
      ```
    answer: { value: 3 }
    hints:
      - "ไล่ทีละค่า แล้วถามว่าน้อยกว่า 30 หรือไม่"
      - "30 น้อยกว่า 30 หรือไม่"
    misconceptions:
      - { match: 4, feedback: "นับ 30 ด้วย แต่เงื่อนไขคือ m < 30 ซึ่ง 30 ไม่ผ่าน" }
    solution: "ค่าที่น้อยกว่า 30 คือ 28, 25 และ 29 รวม 3 ค่า ส่วน 30 ไม่ผ่านเพราะเงื่อนไขเป็น < ไม่ใช่ <="
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.physical-computing.p011
    topics: [computer.systems.physical-computing]
    difficulty: 3
    type: mcq
    stem: "ข้อใดอธิบาย **นามธรรม** ในหม้อหุงข้าวดิจิทัลได้ถูกต้องที่สุด"
    choices:
      - { id: a, text: "ผู้ใช้กดปุ่มหุงโดยไม่ต้องรู้ว่าเซนเซอร์และโปรแกรมข้างในคุมความร้อนอย่างไร และโปรแกรมเรียกอ่านอุณหภูมิโดยไม่ต้องรู้รายละเอียดวงจร", correct: true }
      - { id: b, text: "หม้อหุงข้าวไม่มีคอมพิวเตอร์ข้างใน จึงไม่มีรายละเอียดที่ซ่อนอยู่", feedback: "หม้อหุงข้าวดิจิทัลมีไมโครคอนโทรลเลอร์และเซนเซอร์อยู่ข้างใน เพียงแต่ผู้ใช้มองไม่เห็น" }
      - { id: c, text: "นามธรรมคือการเขียนโปรแกรมให้สั้นที่สุด", feedback: "นามธรรมคือการซ่อนรายละเอียดที่ไม่จำเป็นต่อผู้ใช้แต่ละชั้น ไม่ใช่ความสั้นของโปรแกรม" }
      - { id: d, text: "ผู้ใช้ต้องตั้งค่าแรงดันไฟของเซนเซอร์เองก่อนหุงทุกครั้ง", feedback: "นี่คือตรงข้ามกับนามธรรม ซึ่งซ่อนรายละเอียดเหล่านี้ไว้" }
    hints:
      - "นามธรรมซ่อนรายละเอียดและเปิดให้เห็นเฉพาะสิ่งที่จำเป็น"
      - "มองเป็นชั้น: ผู้ใช้ โปรแกรม ไลบรารี วงจร"
    solution: "นามธรรมซ่อนรายละเอียดการทำงานไว้เป็นชั้น ผู้ใช้เห็นแค่ปุ่ม โปรแกรมหลักเห็นแค่ฟังก์ชันอ่านอุณหภูมิ ไลบรารีจัดการ ADC และวงจรเปลี่ยนความร้อนเป็นแรงดัน แต่ละชั้นใช้ชั้นล่างได้โดยไม่ต้องรู้วิธีทำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.physical-computing.p012
    topics: [computer.systems.physical-computing]
    difficulty: 4
    type: numeric
    stem: "เซนเซอร์ในแปลงผักส่งข้อความขนาด 50 ไบต์ทุก 5 นาทีตลอด 30 วัน รวมเป็นข้อมูลกี่กิโลไบต์ (1 KB = 1,000 ไบต์)"
    answer: { value: 432, unit: "KB" }
    hints:
      - "หาจำนวนข้อความต่อวันก่อน: 1 วันมี 1,440 นาที"
      - "จำนวนข้อความทั้งหมด × 50 ไบต์ แล้วหารด้วย 1,000"
    misconceptions:
      - { match: 14.4, feedback: "นี่คือข้อมูลของวันเดียว ต้องคูณ 30 วัน" }
      - { match: 36, feedback: "คิดเป็นข้อความชั่วโมงละครั้ง แต่ทุก 5 นาทีคือชั่วโมงละ 12 ข้อความ" }
    solution: "ข้อความต่อวัน 1,440 ÷ 5 = 288 ข้อความ 30 วัน = 8,640 ข้อความ × 50 ไบต์ = 432,000 ไบต์ = 432 KB"
