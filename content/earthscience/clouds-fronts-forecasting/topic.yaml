id: earthscience.atmosphere.clouds-fronts-forecasting
subject: earthscience
title: { th: เมฆ แนวปะทะอากาศ และการพยากรณ์อากาศ, en: "Clouds, fronts and weather forecasting" }
summary: กระบวนการแอเดียแบติกและเสถียรภาพอากาศกับการเกิดเมฆชนิดต่าง ๆ มวลอากาศและแนวปะทะอากาศ สัญลักษณ์บนแผนที่อากาศ และการคาดการณ์ลมฟ้าอากาศจากแผนที่และสารสนเทศ
difficulty: 5.5
minutes: 45
prerequisites: [earthscience.atmosphere.global-circulation, physics.thermal.phase-change]
encompasses:
  - { id: earthscience.atmosphere.global-circulation, weight: 0.15 }
  - { id: physics.thermal.phase-change, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: อากาศยกตัวข้ามภูเขา
    src: orographic.svg
    alt: "ภาพตัดภูเขาสูง 2.5 km ลมพัดจากซ้ายไปขวา ด้านซ้ายคือด้านรับลม อากาศที่ระดับทะเล 30 °C จุดน้ำค้าง 22 °C ยกตัวตามไหล่เขา ถึงระดับฐานเมฆ 1 km อุณหภูมิ 20.2 °C อากาศอิ่มตัว เกิดเมฆปกคลุมไหล่เขาและฝนตก ถึงยอด 2.5 km อุณหภูมิ 11.2 °C จากนั้นอากาศจมตัวลงด้านขวาซึ่งเป็นด้านปลายลมหรือเงาฝน ถึงระดับทะเลอุณหภูมิ 35.7 °C ร้อนและแห้ง หัวภาพบอกว่าใต้ฐานเมฆอุณหภูมิลดลง 9.8 °C/km เหนือฐานเมฆราว 6 °C/km และอากาศจมตัวแบบแห้งร้อนขึ้น 9.8 °C/km"
    caption: "เหนือฐานเมฆ อากาศเย็นลงช้ากว่าเพราะไอน้ำควบแน่นปล่อยความร้อนแฝง ด้านปลายลมจึงร้อนกว่าเดิม (วาดโดยทีมคลังรู้ ค่าคำนวณจากอัตราแอเดียแบติกโดยประมาณ)"
  - type: worked-example
    title: ติดตามอุณหภูมิของอากาศที่ข้ามภูเขา
    problem: "อากาศที่ระดับทะเล 30 °C จุดน้ำค้าง 22 °C ถูกลมพัดข้ามภูเขาสูง 2,500 m ฝนตกหมดที่ด้านรับลม อากาศลงถึงระดับทะเลอีกด้านมีอุณหภูมิเท่าใด (แอเดียแบติกแห้ง 9.8 °C/km ชื้น 6 °C/km)"
    steps:
      - text: "ฐานเมฆ $\\approx 125 \\times (30 - 22) = 1{,}000$ m"
        why: "อากาศยกตัวแบบแห้งจนอุณหภูมิลดลงถึงจุดน้ำค้างของมัน ซึ่งเกิดที่ความสูงราว 125 m ต่อผลต่าง 1 °C"
      - text: "ระดับทะเลถึง 1 km (ยังไม่อิ่มตัว): $30 - 9.8 \\times 1 = 20.2$ °C"
      - text: "1 km ถึงยอด 2.5 km (อิ่มตัว มีเมฆ): $20.2 - 6 \\times 1.5 = 11.2$ °C"
        why: "ไอน้ำควบแน่นปล่อยความร้อนแฝง อากาศจึงเย็นลงช้ากว่า"
      - text: "ขาลง 2.5 km ไม่มีเมฆ อากาศถูกอัด ร้อนขึ้นแบบแห้ง: $11.2 + 9.8 \\times 2.5 = 35.7$ °C"
    answer: "35.7 °C ร้อนกว่าด้านรับลม 5.7 °C และแห้งกว่ามาก เพราะไอน้ำตกเป็นฝนไปแล้ว"
  - { type: check, problem: earthscience.atmosphere.clouds-fronts-forecasting.p004, prompt: "ใช้สูตร 125 m ต่อผลต่าง 1 °C" }
  - type: figure
    title: ภาพตัดแนวปะทะอากาศ
    src: fronts.svg
    alt: "สองภาพตัด ภาพบน แนวปะทะอากาศเย็น อากาศเย็นหนาแน่นกว่าเป็นลิ่มทางซ้าย เคลื่อนไปทางขวา ขอบหน้าชัน อากาศอุ่นชื้นทางขวาถูกดันขึ้นอย่างรวดเร็ว เกิดเมฆคิวมูโลนิมบัสยอดแผ่เป็นรูปทั่งเหนือแนวปะทะ ฝนฟ้าคะนอง ลมกระโชก แถบฝนแคบ สัญลักษณ์บนแผนที่เป็นเส้นสีน้ำเงินมีสามเหลี่ยม ภาพล่าง แนวปะทะอากาศอุ่น อากาศอุ่นชื้นทางซ้ายเคลื่อนไปทางขวา ค่อย ๆ ไต่ขึ้นตามความลาดน้อยของอากาศเย็นทางขวา เมฆเรียงจากแนวปะทะไปข้างหน้า คือ นิมโบสเตรตัสต่ำใกล้แนวปะทะที่ผิวพื้นพร้อมฝนตกเป็นบริเวณกว้างต่อเนื่องหลายชั่วโมง แอลโตสเตรตัส ซีร์โรสเตรตัส และซีร์รัสซึ่งอยู่สูงและไกลที่สุด สัญลักษณ์บนแผนที่เป็นเส้นสีแดงมีครึ่งวงกลม"
    caption: "อากาศอุ่นถูกยกขึ้นที่แนวปะทะทุกแบบ ความลาดของแนวต่างกันจึงได้เมฆและฝนต่างกัน (วาดโดยทีมคลังรู้ ขยายแนวตั้ง ไม่ได้ตามมาตราส่วน)"
  - type: figure
    title: แบบจำลองสถานีและสัญลักษณ์บนแผนที่อากาศ
    src: station.svg
    alt: "ซ้าย แบบจำลองสถานีตรวจอากาศ วงกลมระบายดำครึ่งวงแปลว่าเมฆปกคลุม 4/8 ของท้องฟ้า ซ้ายบนเลข 31 คืออุณหภูมิอากาศ 31 °C ซ้ายล่างเลข 24 คืออุณหภูมิจุดน้ำค้าง 24 °C ขวาบนเลข 087 คือความกดอากาศ 1008.7 hPa เขียนเฉพาะ 3 ตัวท้ายไม่มีจุด ก้านขีดลมชี้ไปทางตะวันออกเฉียงเหนือ มีขีดเต็มหนึ่งขีดและขีดครึ่งหนึ่งขีด แปลว่าลมพัดมาจากทิศตะวันออกเฉียงเหนือ 15 นอต ด้านล่างเป็นวงกลมแสดงเมฆปกคลุม 0/8 2/8 4/8 6/8 และ 8/8 ขวา สัญลักษณ์บนแผนที่ แนวปะทะอากาศเย็นเส้นสีน้ำเงินมีสามเหลี่ยม แนวปะทะอากาศอุ่นเส้นสีแดงมีครึ่งวงกลม แนวปะทะอากาศคงที่มีครึ่งวงกลมสีแดงและสามเหลี่ยมสีน้ำเงินสลับข้าง แนวปะทะอากาศรวมเส้นสีม่วงมีทั้งสามเหลี่ยมและครึ่งวงกลมด้านเดียวกัน H สีน้ำเงินคือความกดอากาศสูง L สีแดงคือความกดอากาศต่ำ เส้นโค้งมีเลข 1008 คือเส้นความกดอากาศเท่า และขีดลม ขีดครึ่ง 5 นอต ขีดเต็ม 10 นอต ธงสามเหลี่ยม 50 นอต"
    caption: "ก้านขีดลมชี้ไปทางที่ลมพัดมา (วาดโดยทีมคลังรู้ ตามรูปแบบสากลของแผนที่อากาศผิวพื้น)"
  - type: worked-example
    title: อ่านแบบจำลองสถานีแล้วคาดการณ์
    problem: "สถานีหนึ่งรายงาน อุณหภูมิ 26 จุดน้ำค้าง 25 ความกดอากาศ 994 เมฆ 8/8 ลมจากทิศใต้ 25 นอต (ขีดเต็มสองขีดกับขีดครึ่งหนึ่งขีด) อธิบายสภาพอากาศและแนวโน้ม"
    steps:
      - text: "ความกดอากาศ 994 ขึ้นต้นด้วย 9 จึงเติม 9 ข้างหน้า ได้ 999.4 hPa ต่ำกว่าปกติ"
        why: "ความกดอากาศที่ผิวพื้นปกติราว 1,010 hPa ค่าที่ขึ้นต้นด้วย 5–9 จึงเป็น 9xx hPa"
      - text: "อุณหภูมิกับจุดน้ำค้างต่างกันเพียง 1 °C อากาศเกือบอิ่มตัว และเมฆปกคลุมเต็มท้องฟ้า"
      - text: "ลม 25 นอต $= 25 \\times 1.852 \\approx 46$ km/h ค่อนข้างแรง พัดมาจากทิศใต้"
      - text: "ความกดอากาศต่ำ อากาศชื้นมาก และลมแรง แสดงว่าอยู่ใกล้หย่อมความกดอากาศต่ำ มีโอกาสฝนตกหนัก ควรติดตามประกาศเตือน"
    answer: "999.4 hPa อากาศชื้นเกือบอิ่มตัว เมฆเต็มฟ้า ลมใต้ราว 46 km/h อยู่ใกล้ระบบความกดอากาศต่ำ มีแนวโน้มฝนตกหนัก"
  - { type: check, problem: earthscience.atmosphere.clouds-fronts-forecasting.p003 }
glossary:
  - { term: กระบวนการแอเดียแบติก, definition: "การเปลี่ยนอุณหภูมิของอากาศจากการขยายตัวหรือถูกอัด โดยไม่แลกเปลี่ยนความร้อนกับรอบข้าง" }
  - { term: อัตราแอเดียแบติกแห้ง, definition: "อัตราที่อากาศไม่อิ่มตัวเย็นลงเมื่อยกตัว ราว 9.8 °C ต่อ 1 km" }
  - { term: อัตราแอเดียแบติกชื้น, definition: "อัตราที่อากาศอิ่มตัวเย็นลงเมื่อยกตัว ราว 4–7 °C ต่อ 1 km เพราะการควบแน่นปล่อยความร้อนแฝง" }
  - { term: จุดน้ำค้าง, definition: "อุณหภูมิที่อากาศต้องเย็นลงถึงจึงอิ่มตัวด้วยไอน้ำ และเริ่มควบแน่น" }
  - { term: เสถียรภาพอากาศ, definition: "แนวโน้มของก้อนอากาศที่ถูกดันขึ้นว่าจะจมกลับ (มีเสถียรภาพ) หรือลอยต่อ (ไม่มีเสถียรภาพ)" }
  - { term: มวลอากาศ, definition: "อากาศก้อนใหญ่ที่มีอุณหภูมิและความชื้นใกล้เคียงกันตลอด ตามแหล่งกำเนิด" }
  - { term: แนวปะทะอากาศ, definition: "รอยต่อระหว่างมวลอากาศที่มีอุณหภูมิและความชื้นต่างกัน" }
  - { term: เงาฝน, definition: "พื้นที่ด้านปลายลมของภูเขา ซึ่งอากาศจมตัว ร้อนและแห้ง ฝนน้อย" }
  - { term: แบบจำลองสถานี, definition: "ชุดสัญลักษณ์บนแผนที่อากาศที่บอกอุณหภูมิ จุดน้ำค้าง ความกดอากาศ เมฆ และลมของแต่ละสถานี" }
flashcards:
  - { front: "อัตราแอเดียแบติกแห้งกับชื้น", back: "แห้งราว 9.8 °C/km ชื้นราว 6 °C/km (ช้ากว่าเพราะความร้อนแฝง)" }
  - { front: "ประมาณความสูงฐานเมฆ", back: "125 m × (อุณหภูมิ − จุดน้ำค้าง)" }
  - { front: "แนวปะทะอากาศเย็น กับ แนวปะทะอากาศอุ่น", back: "เย็น: แนวชัน คิวมูโลนิมบัส ฝนฟ้าคะนองแถบแคบ อุ่น: แนวลาด เมฆแผ่น ฝนพรำบริเวณกว้าง" }
  - { front: "รหัสความกดอากาศ 087 และ 965", back: "1008.7 hPa และ 996.5 hPa" }
  - { front: "ก้านขีดลมชี้ไปทางไหน", back: "ชี้ไปทางที่ลมพัดมา ขีดครึ่ง 5 นอต ขีดเต็ม 10 นอต ธง 50 นอต" }
