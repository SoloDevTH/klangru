problems:
  - id: math.lineq.p001
    topics: [math.algebra.linear-eq]
    difficulty: 1
    type: numeric
    stem: "แก้สมการ $x + 7 = 12$ แล้ว $x$ มีค่าเท่าใด"
    answer: { value: 5 }
    hints:
      - "อะไรติดอยู่กับ $x$ บ้าง ต้องเอาออกด้วยการทำตรงข้าม"
      - "ลบ 7 ทั้งสองข้างของสมการ"
    misconceptions:
      - { match: 19, feedback: "ดูเหมือนบวก 7 เข้าไป แต่ต้องลบ 7 ออกเพื่อให้ $x$ อยู่ตัวเดียว" }
    solution: "ลบ 7 ทั้งสองข้าง: $x + 7 - 7 = 12 - 7$ จึงได้ $x = 5$ ตรวจ: $5 + 7 = 12$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.lineq.p002
    topics: [math.algebra.linear-eq]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นคำตอบของสมการ $4x = 28$"
    choices:
      - { id: a, text: "$x = 7$", correct: true }
      - { id: b, text: "$x = 24$", feedback: "นั่นคือ 28 − 4 แต่ $4x$ หมายถึง 4 คูณ $x$ จึงต้องหาร" }
      - { id: c, text: "$x = 32$", feedback: "นั่นคือ 28 + 4 ลองแทน $x = 32$ ดู $4 \\times 32$ ไม่เท่ากับ 28" }
      - { id: d, text: "$x = 112$", feedback: "นั่นคือ 28 × 4 ต้องทำตรงข้ามกับการคูณ คือการหาร" }
    hints:
      - "$4x$ แปลว่า 4 คูณ $x$"
      - "หาร 4 ทั้งสองข้าง"
    solution: "หาร 4 ทั้งสองข้าง ได้ $x = 28 \\div 4 = 7$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.lineq.p003
    topics: [math.algebra.linear-eq]
    difficulty: 2
    type: numeric
    stem: "แก้สมการ $3x + 2 = 17$"
    answer: { value: 5 }
    hints:
      - "แกะสิ่งที่ทำทีหลังออกก่อน: การบวก 2"
      - "ลบ 2 ทั้งสองข้าง ได้ $3x = 15$"
      - "หาร 3 ทั้งสองข้าง"
    misconceptions:
      - { match: 3.667, feedback: "ดูเหมือนหาร 3 เฉพาะข้างขวาก่อนลบ 2 ให้ลบ 2 ทั้งสองข้างก่อน แล้วค่อยหาร 3" }
      - { match: 15, feedback: "นั่นคือค่าของ $3x$ ยังต้องหาร 3 อีกครั้ง" }
    solution: "$3x + 2 = 17$ → ลบ 2: $3x = 15$ → หาร 3: $x = 5$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.lineq.p004
    topics: [math.algebra.linear-eq]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการแก้สมการ $5x - 4 = 2x + 11$ ให้ถูกต้อง"
    items:
      - "ลบ $2x$ ทั้งสองข้าง: $3x - 4 = 11$"
      - "บวก 4 ทั้งสองข้าง: $3x = 15$"
      - "หาร 3 ทั้งสองข้าง: $x = 5$"
      - "แทนค่ากลับ: $5(5) - 4 = 2(5) + 11 = 21$ ✓"
    hints:
      - "รวม $x$ ไว้ข้างเดียวก่อน"
      - "ตรวจคำตอบเป็นขั้นสุดท้ายเสมอ"
    solution: "รวม $x$ ไว้ข้างซ้าย → เอาค่าคงที่ไปข้างขวา → หารด้วยสัมประสิทธิ์ → ตรวจคำตอบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.lineq.p005
    topics: [math.algebra.linear-eq]
    difficulty: 3
    type: numeric
    stem: "แก้สมการ $2(x - 3) = 10$"
    answer: { value: 8 }
    hints:
      - "หาร 2 ทั้งสองข้างก่อนก็ได้ หรือกระจายวงเล็บก่อนก็ได้"
      - "ถ้ากระจาย: $2(x - 3) = 2x - 6$"
    misconceptions:
      - { match: 6.5, feedback: "ดูเหมือนกระจายเป็น $2x - 3$ ต้องคูณ 2 เข้าไปทั้ง $x$ และ 3 ได้ $2x - 6$" }
      - { match: 2, feedback: "ดูเหมือนลบ 3 แทนที่จะบวก 3 จาก $x - 3 = 5$ ต้องบวก 3 ทั้งสองข้าง" }
    solution: "หาร 2 ทั้งสองข้าง: $x - 3 = 5$ แล้วบวก 3: $x = 8$ ตรวจ: $2(8 - 3) = 10$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.lineq.p006
    topics: [math.algebra.linear-eq]
    difficulty: 4
    type: numeric
    stem: "ร้านขายสมุดเล่มละ 15 บาท และคิดค่าส่ง 40 บาทต่อครั้ง ถ้าจ่ายทั้งหมด 220 บาท ซื้อสมุดกี่เล่ม"
    answer: { value: 12, unit: เล่ม }
    hints:
      - "ให้ $x$ แทนจำนวนสมุด เขียนราคารวมเป็นนิพจน์"
      - "สมการคือ $15x + 40 = 220$"
      - "ลบ 40 ทั้งสองข้าง แล้วหาร 15"
    misconceptions:
      - { match: 17.333, feedback: "ดูเหมือนบวกค่าส่งเข้าไป ค่าส่งรวมอยู่ใน 220 บาทแล้ว จึงต้องลบออก" }
      - { match: 14.667, feedback: "ดูเหมือนลืมหักค่าส่ง 40 บาท" }
    solution: "ให้ซื้อ $x$ เล่ม: $15x + 40 = 220$ → $15x = 180$ → $x = 12$ เล่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.lineq.p007
    topics: [math.algebra.linear-eq]
    difficulty: 5
    type: numeric
    stem: "แก้สมการ $\\dfrac{x + 1}{3} = \\dfrac{x - 2}{2}$"
    answer: { value: 8 }
    hints:
      - "กำจัดเศษส่วนด้วยการคูณทั้งสองข้างด้วย ค.ร.น. ของ 3 และ 2"
      - "คูณ 6 ทั้งสองข้าง ได้ $2(x + 1) = 3(x - 2)$"
      - "กระจาย: $2x + 2 = 3x - 6$"
    misconceptions:
      - { match: -4, feedback: "ลองตรวจเครื่องหมายตอนย้ายข้าง จาก $2x + 2 = 3x - 6$ ให้ลบ $2x$ และบวก 6 ทั้งสองข้าง" }
    solution: "คูณ 6 ทั้งสองข้าง: $2(x + 1) = 3(x - 2)$ → $2x + 2 = 3x - 6$ → $8 = x$ ตรวจ: $\\tfrac{9}{3} = 3$ และ $\\tfrac{6}{2} = 3$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.lineq.p008
    topics: [math.algebra.linear-eq]
    difficulty: 2
    type: numeric
    stem: "ฝนซื้อชานมไข่มุก 3 แก้ว ราคาเท่ากัน จ่ายด้วยธนบัตร 100 บาท ได้เงินทอน 25 บาท ชานมราคาแก้วละกี่บาท"
    answer: { value: 25, unit: บาท }
    hints:
      - "ให้ $x$ แทนราคาชานมหนึ่งแก้ว เงินที่จ่าย ลบ ราคาชานมทั้งหมด = เงินทอน"
      - "สมการคือ $100 - 3x = 25$"
      - "บวก $3x$ ทั้งสองข้าง แล้วลบ 25 ทั้งสองข้าง จากนั้นหาร 3"
    misconceptions:
      - { match: 41.667, feedback: "ดูเหมือนบวกเงินทอนเข้าไป ($\\tfrac{100 + 25}{3}$) เงินทอนคือส่วนที่ได้คืน ราคาชานมทั้งหมดจึงเป็น $100 - 25$" }
      - { match: 8.333, feedback: "นั่นคือเงินทอนหาร 3 ราคาชานมทั้ง 3 แก้วคือเงินที่จ่ายจริง $100 - 25$ บาท" }
    solution: "$100 - 3x = 25$ → บวก $3x$: $100 = 25 + 3x$ → ลบ 25: $75 = 3x$ → หาร 3: $x = 25$ บาท ตรวจ: 3 แก้ว 75 บาท ทอน $100 - 75 = 25$ บาท ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.lineq.p009
    topics: [math.algebra.linear-eq]
    difficulty: 3
    type: mcq
    stem: "ตอนนี้อายุของพ่อเป็น 3 เท่าของอายุลูก และพ่ออายุมากกว่าลูก 26 ปี ถ้าให้ $x$ แทนอายุลูก (ปี) สมการใดถูกต้อง"
    choices:
      - { id: a, text: "$3x = x + 26$", correct: true, feedback: "ถูก อายุพ่อเขียนได้สองแบบ คือ $3x$ และ $x + 26$ จึงจับมาเท่ากัน แก้ได้ $x = 13$ ปี" }
      - { id: b, text: "$3x + 26 = x$", feedback: "บวก 26 ผิดฝั่ง สมการนี้บอกว่าอายุลูกมากกว่าอายุพ่อ 26 ปี คนที่อายุมากกว่าคือพ่อ จึงต้องบวก 26 ทางฝั่งอายุลูก: $x + 26$" }
      - { id: c, text: "$3x = 26$", feedback: "26 ปีคือผลต่างของอายุ ไม่ใช่อายุพ่อ อายุพ่อคือ $x + 26$" }
      - { id: d, text: "$x + 3x = 26$", feedback: "26 ปีคืออายุที่ **ต่างกัน** ไม่ใช่อายุรวมกัน ถ้าโจทย์บอกว่าอายุรวมกัน 26 ปีจึงจะใช้สมการนี้" }
    hints:
      - "เขียนอายุพ่อจากข้อมูลแต่ละประโยคแยกกัน"
      - "ประโยคแรกให้อายุพ่อ $= 3x$ ประโยคที่สองให้อายุพ่อ $= x + 26$"
      - "ทั้งสองนิพจน์คืออายุพ่อคนเดียวกัน จึงเท่ากัน"
    solution: "อายุพ่อ $= 3x$ และอายุพ่อ $= x + 26$ จึงได้ $3x = x + 26$ → $2x = 26$ → $x = 13$ ลูกอายุ 13 ปี พ่ออายุ 39 ปี ตรวจ: $39 = 3 \\times 13$ และ $39 - 13 = 26$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.lineq.p010
    topics: [math.algebra.linear-eq]
    difficulty: 4
    type: numeric
    stem: "ฟิตเนสแห่งหนึ่งในเชียงใหม่มีสองแบบ แบบ ก ค่าสมัครสมาชิก 200 บาท แล้วจ่ายชั่วโมงละ 30 บาท แบบ ข ไม่มีค่าสมัคร แต่จ่ายชั่วโมงละ 70 บาท ใช้บริการกี่ชั่วโมง สองแบบจึงจ่ายเท่ากัน"
    answer: { value: 5, unit: ชั่วโมง }
    hints:
      - "ให้ $h$ แทนจำนวนชั่วโมง เขียนค่าใช้จ่ายของแต่ละแบบเป็นนิพจน์"
      - "สมการคือ $200 + 30h = 70h$"
      - "ลบ $30h$ ทั้งสองข้างเพื่อรวม $h$ ไว้ข้างเดียว แล้วหาร"
    misconceptions:
      - { match: 2, feedback: "ดูเหมือนบวก $30h$ กับ $70h$ เข้าด้วยกัน การย้าย $30h$ ไปอีกข้างต้อง **ลบ** $30h$ ทั้งสองข้าง ได้ $200 = 40h$" }
      - { match: 6.667, feedback: "ดูเหมือนนำ 200 หารด้วย 30 ซึ่งไม่ได้ใช้ราคาแบบ ข เลย ต้องตั้งสมการให้ค่าใช้จ่ายสองแบบเท่ากัน" }
    solution: "$200 + 30h = 70h$ → ลบ $30h$: $200 = 40h$ → หาร 40: $h = 5$ ชั่วโมง ตรวจ: แบบ ก $200 + 30(5) = 350$ บาท แบบ ข $70(5) = 350$ บาท ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.lineq.p011
    topics: [math.algebra.linear-eq]
    difficulty: 1
    type: numeric
    stem: "แก้สมการ $\\dfrac{x}{4} = 6$"
    answer: { value: 24 }
    hints:
      - "$x$ ถูกหารด้วย 4 สิ่งตรงข้ามของการหารคืออะไร"
      - "คูณทั้งสองข้างด้วย 4"
    misconceptions:
      - { match: 1.5, feedback: "ดูเหมือนหาร 6 ด้วย 4 แต่ $x$ ถูกหารด้วย 4 อยู่แล้ว ต้องคูณ 4 ทั้งสองข้างเพื่อแกะออก" }
    solution: "คูณ 4 ทั้งสองข้าง: $x = 6 \\times 4 = 24$ ตรวจ: $24 \\div 4 = 6$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.lineq.p012
    topics: [math.algebra.linear-eq]
    difficulty: 2
    type: numeric
    stem: "แก้สมการ $0.5x + 1.2 = 3.7$"
    answer: { value: 5 }
    hints:
      - "แกะสิ่งที่ทำทีหลังออกก่อน: ลบ 1.2 ทั้งสองข้าง"
      - "เหลือ $0.5x = 2.5$ แล้วหารด้วย 0.5 ทั้งสองข้าง"
    misconceptions:
      - { match: 9.8, feedback: "ดูเหมือนบวก 1.2 แทนที่จะลบ ข้างซ้ายมี $+1.2$ ต้องลบ 1.2 ทั้งสองข้าง" }
      - { match: 1.25, feedback: "ดูเหมือนคูณ 2.5 ด้วย 0.5 แต่ $x$ ถูกคูณด้วย 0.5 ต้องหารด้วย 0.5 (เท่ากับคูณ 2)" }
    solution: "$0.5x = 3.7 - 1.2 = 2.5$ แล้ว $x = 2.5 \\div 0.5 = 5$ ตรวจ: $0.5(5) + 1.2 = 3.7$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.lineq.p013
    topics: [math.algebra.linear-eq]
    difficulty: 2
    type: mcq
    stem: "ตาชั่งในภาพสมดุล ถ้ากล่องแต่ละกล่องหนัก $x$ กิโลกรัม สมการใดแทนสิ่งที่เห็นในภาพ"
    figure: { src: balance-problem.svg, alt: "ตาชั่งสองแขนอยู่ในสมดุล จานซ้ายมีกล่อง x สองกล่องกับตุ้มน้ำหนัก 5 กิโลกรัม จานขวามีตุ้มน้ำหนัก 13 กิโลกรัมหนึ่งลูก" }
    choices:
      - { id: a, text: "$2x + 5 = 13$", correct: true }
      - { id: b, text: "$x + 5 = 13$", feedback: "จานซ้ายมีกล่องสองกล่อง น้ำหนักกล่องรวมจึงเป็น $2x$ ไม่ใช่ $x$" }
      - { id: c, text: "$2x = 13 + 5$", feedback: "ตุ้ม 5 กิโลกรัมอยู่จานเดียวกับกล่อง ถ้าย้ายไปอีกข้างต้องลบ ได้ $2x = 13 - 5$" }
      - { id: d, text: "$2 + x + 5 = 13$", feedback: "เลข 2 คือจำนวนกล่อง ไม่ใช่น้ำหนัก 2 กิโลกรัม กล่องสองกล่องหนัก $2 \\times x$" }
    hints:
      - "เขียนน้ำหนักรวมของจานซ้ายและจานขวา แล้วให้เท่ากัน"
      - "กล่องสองกล่องที่หนักกล่องละ $x$ รวมเป็นเท่าใด"
    solution: "จานซ้ายหนัก $x + x + 5 = 2x + 5$ จานขวาหนัก 13 ตาชั่งสมดุลจึงได้ $2x + 5 = 13$ (แก้ได้ $2x = 8$, $x = 4$ กิโลกรัม)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.lineq.p014
    topics: [math.algebra.linear-eq]
    difficulty: 3
    type: mcq
    stem: "สมการใดไม่มีคำตอบ"
    choices:
      - { id: a, text: "$2(x + 3) = 2x + 5$", correct: true }
      - { id: b, text: "$2(x + 3) = 2x + 6$", feedback: "กระจายได้ $2x + 6 = 2x + 6$ เป็นจริงทุกค่าของ $x$ จึงมีคำตอบมากมาย ไม่ใช่ไม่มีคำตอบ" }
      - { id: c, text: "$2(x + 3) = x + 6$", feedback: "แก้ได้ $2x + 6 = x + 6$ → $x = 0$ ศูนย์ก็เป็นคำตอบหนึ่งค่า" }
      - { id: d, text: "$3x + 1 = 2x + 1$", feedback: "แก้ได้ $x = 0$ ตรวจ: $1 = 1$ ✓ สมการนี้มีคำตอบ" }
    hints:
      - "กระจายวงเล็บ แล้วย้ายพจน์ที่มี $x$ ไปข้างเดียวกัน"
      - "ถ้า $x$ หายไปทั้งหมดและเหลือประโยคที่เป็นเท็จ สมการนั้นไม่มีคำตอบ"
    solution: "$2(x + 3) = 2x + 5$ → $2x + 6 = 2x + 5$ → $6 = 5$ เป็นเท็จ จึงไม่มีคำตอบ ข้อ b เป็นจริงทุกค่า ข้อ c และ d มีคำตอบ $x = 0$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.lineq.p015
    topics: [math.algebra.linear-eq]
    difficulty: 3
    type: numeric
    stem: "แก้สมการ $x - (2x - 5) = 3(x - 1)$"
    answer: { value: 2 }
    hints:
      - "เครื่องหมายลบหน้าวงเล็บเปลี่ยนเครื่องหมายของทุกพจน์ในวงเล็บ"
      - "ข้างซ้ายเป็น $x - 2x + 5$ ข้างขวาเป็น $3x - 3$"
      - "รวมพจน์ ย้ายพจน์ที่มี $x$ ไปข้างเดียวกัน แล้วแก้หา $x$"
    misconceptions:
      - { match: -0.5, feedback: "ดูเหมือนเขียน $-(2x - 5)$ เป็น $-2x - 5$ ต้องเปลี่ยนเครื่องหมายของ $-5$ ด้วย ได้ $+5$" }
    solution: "$x - 2x + 5 = 3x - 3$ → $-x + 5 = 3x - 3$ → $8 = 4x$ → $x = 2$ ตรวจ: ซ้าย $2 - (4 - 5) = 3$ ขวา $3(1) = 3$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.lineq.p016
    topics: [math.algebra.linear-eq]
    difficulty: 4
    type: numeric
