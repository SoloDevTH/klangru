      - { match: 4.2, feedback: "ดูเหมือนลืมองค์ประกอบ $m_1 g\\sin 30^\\circ$ ที่ดึงกล่องบนพื้นเอียงลงตามพื้น ซึ่งต้านน้ำหนักของกล่องที่แขวน" }
    solution: "แรงที่ดึงกล่องแขวนลง $m_2 g = 3(9.8) = 29.4\\ \\mathrm{N}$ แรงที่ดึงกล่องบนพื้นเอียงลงตามพื้น $m_1 g\\sin 30^\\circ = 4(9.8)(0.5) = 19.6\\ \\mathrm{N}$ กล่องแขวนชนะ ระบบเคลื่อนที่ให้กล่องแขวนลง $a = \\dfrac{29.4 - 19.6}{4 + 3} = \\dfrac{9.8}{7} = 1.4\\ \\mathrm{m/s^2}$ (แรงตึงเชือก $T = m_2(g - a) = 3(8.4) = 25.2\\ \\mathrm{N}$)"
