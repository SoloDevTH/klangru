<svg xmlns="http://www.w3.org/2000/svg" width="600" height="310" viewBox="0 0 600 310" font-family="sans-serif"><title>วงจรบริดจ์วีตสโตนแบบมีตัวต้านทานสี่ตัวต่อเป็นรูปข้าวหลามตัด</title><rect x="0" y="0" width="600" height="310" fill="#ffffff"/><line x1="300" y1="40" x2="150" y2="140" stroke="#1f3a5f" stroke-width="2.5"/><line x1="150" y1="140" x2="300" y2="240" stroke="#1f3a5f" stroke-width="2.5"/><line x1="300" y1="40" x2="450" y2="140" stroke="#1f3a5f" stroke-width="2.5"/><line x1="450" y1="140" x2="300" y2="240" stroke="#1f3a5f" stroke-width="2.5"/><line x1="150" y1="140" x2="450" y2="140" stroke="#b5452b" stroke-width="2" stroke-dasharray="6,5"/><rect x="201" y="76" width="48" height="26" rx="5" fill="#eef4fb" stroke="#1f3a5f"/><text x="225" y="94" text-anchor="middle" font-size="15">R1</text><rect x="201" y="176" width="48" height="26" rx="5" fill="#eef4fb" stroke="#1f3a5f"/><text x="225" y="194" text-anchor="middle" font-size="15">R2</text><rect x="351" y="76" width="48" height="26" rx="5" fill="#eef4fb" stroke="#1f3a5f"/><text x="375" y="94" text-anchor="middle" font-size="15">R3</text><rect x="351" y="176" width="48" height="26" rx="5" fill="#eef4fb" stroke="#1f3a5f"/><text x="375" y="194" text-anchor="middle" font-size="15">Rx</text><text x="314" y="46" font-size="15">+Vs</text><text x="314" y="242" font-size="15">0 V</text><text x="300.0" y="130" text-anchor="middle" font-size="15" fill="#b5452b">Vout (วัดตรงนี้)</text><circle cx="150" cy="140" r="4" fill="#1f3a5f"/><circle cx="450" cy="140" r="4" fill="#1f3a5f"/><text x="30" y="280" font-size="14" fill="#333">R1 และ R2 แบ่งแรงดันที่จุดซ้าย ส่วน R3 และ Rx แบ่งแรงดันที่จุดขวา</text><text x="30" y="300" font-size="14" fill="#333">Rx คือเซนเซอร์ที่เปลี่ยนค่าตามปริมาณที่วัด</text></svg>
