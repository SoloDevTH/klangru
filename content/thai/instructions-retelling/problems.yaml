  - ตอนต้นราชสีห์คิดอย่างไรกับหนู ตอนจบเกิดอะไรขึ้น
  solution: 'ข้อคิด: **อย่าดูถูกผู้ที่ตัวเล็กกว่า** และการทำดีจะได้รับผลดีตอบแทน'
