  back: สมัครใจเปิดกว้าง · ควบคุมแบบประชาธิปไตย · สมาชิกมีส่วนร่วมทางเศรษฐกิจ · ปกครองตนเองและอิสระ · การศึกษาอบรม · ร่วมมือระหว่างสหกรณ์ · เอื้ออาทรต่อชุมชน
- front: สหกรณ์ในไทย 7 ประเภท
  back: การเกษตร · ประมง · นิคม · ร้านค้า · บริการ · ออมทรัพย์ · เครดิตยูเนี่ยน
- front: ปันผล กับ เฉลี่ยคืน
  back: ปันผลคิดตามค่าหุ้น · เฉลี่ยคืนคิดตามปริมาณธุรกิจที่สมาชิกทำกับสหกรณ์
- front: สหกรณ์แห่งแรกของไทย
  back: สหกรณ์วัดจันทร์ไม่จำกัดสินใช้ จ.พิษณุโลก จดทะเบียน 26 ก.พ. 2459 (วันสหกรณ์แห่งชาติ)
