<text x="488.0" y="130" text-anchor="middle" fill="#6b7280" font-size="12">1990</text>
<line x1="61.7" y1="112" x2="61.7" y2="76" stroke="#1e40af" stroke-width="1.5"/>
<circle cx="61.7" cy="112" r="5" fill="#1e40af"/>
<text x="61.7" y="70" text-anchor="middle" fill="#1f2937" font-weight="bold">1843</text>
<line x1="331.4" y1="112" x2="331.4" y2="76" stroke="#1e40af" stroke-width="1.5"/>
<circle cx="331.4" cy="112" r="5" fill="#1e40af"/>
<text x="331.4" y="70" text-anchor="middle" fill="#1f2937" font-weight="bold">1936</text>
<line x1="354.6" y1="112" x2="354.6" y2="56" stroke="#1e40af" stroke-width="1.5"/>
<circle cx="354.6" cy="112" r="5" fill="#1e40af"/>
<text x="354.6" y="50" text-anchor="middle" fill="#1f2937" font-weight="bold">1944</text>
<line x1="377.8" y1="112" x2="377.8" y2="76" stroke="#1e40af" stroke-width="1.5"/>
<circle cx="377.8" cy="112" r="5" fill="#1e40af"/>
<text x="377.8" y="70" text-anchor="middle" fill="#1f2937" font-weight="bold">1952</text>
<line x1="438.7" y1="112" x2="438.7" y2="56" stroke="#1e40af" stroke-width="1.5"/>
<circle cx="438.7" cy="112" r="5" fill="#1e40af"/>
<text x="438.7" y="50" text-anchor="middle" fill="#1f2937" font-weight="bold">1973</text>
<line x1="467.7" y1="112" x2="467.7" y2="76" stroke="#1e40af" stroke-width="1.5"/>
<circle cx="467.7" cy="112" r="5" fill="#1e40af"/>
<text x="467.7" y="70" text-anchor="middle" fill="#1f2937" font-weight="bold">1983</text>
<text x="260" y="22" text-anchor="middle" font-weight="bold" fill="#1f2937">เหตุการณ์สำคัญบนเส้นเวลา (ค.ศ.)</text>
<text x="30" y="170" fill="#1f2937">1843 เอดา เลิฟเลซ เขียนบันทึกเกี่ยวกับเครื่องวิเคราะห์</text>
<text x="30" y="190" fill="#1f2937">1936 อลัน ทัวริง เสนอแนวคิดเครื่องจักรทัวริง</text>
<text x="30" y="210" fill="#1f2937">1944 เกรซ ฮอปเปอร์เริ่มทำงานกับ Harvard Mark I</text>
<text x="30" y="230" fill="#1f2937">1952 ฮอปเปอร์พัฒนาตัวแปลภาษา A-0</text>
<text x="30" y="250" fill="#1f2937">1973 โทรศัพท์มือถือเครื่องแรกถูกทดลองโทร</text>
<text x="30" y="270" fill="#1f2937">1983 โทรศัพท์มือถือเริ่มขายเชิงพาณิชย์</text>
</svg>