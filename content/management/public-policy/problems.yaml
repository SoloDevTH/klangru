      - { id: b, text: "8 คะแนนน้อยเกินไปจึงไม่ควรนับ", feedback: "ขนาดของผลไม่ได้ทำให้การสรุปเรื่องสาเหตุผิดหรือถูก ปัญหาอยู่ที่การเลือกกลุ่มเปรียบเทียบ" }
      - { id: c, text: "ควรวัดจำนวนมื้ออาหารที่แจกแทนคะแนนสอบ", feedback: "จำนวนมื้อเป็นผลผลิต ไม่ได้บอกผลลัพธ์ต่อการเรียน" }
      - { id: d, text: "ไม่มีปัญหา เพราะมีกลุ่มเปรียบเทียบแล้ว", feedback: "กลุ่มเปรียบเทียบต่างจากกลุ่มที่ทำตั้งแต่ก่อนเริ่ม เพราะโรงเรียนเลือกสมัครเอง" }
    hints:
