problems:
- id: science.inquiry.investigation-design.p001
  topics:
  - science.inquiry.investigation-design
  difficulty: 1
  type: mcq
  stem: คำถามใด **ทดสอบได้** ด้วยการทดลอง
  choices:
  - id: a
    text: ผ้าฝ้ายหรือผ้าโพลีเอสเตอร์แห้งเร็วกว่ากันเมื่อตากแดด
    correct: true
  - id: b
    text: สีไหนสวยที่สุด
    feedback: ความสวยเป็นความชอบของแต่ละคน วัดไม่ได้
  - id: c
    text: ทำไมคนเราต้องไปโรงเรียน
    feedback: เป็นคำถามเรื่องความคิดเห็น ไม่ได้ตอบด้วยการวัดหรือการทดลอง
  - id: d
    text: ผีมีจริงไหม
    feedback: สิ่งที่สังเกตหรือวัดไม่ได้ ทดสอบด้วยการทดลองไม่ได้
  hints:
  - คำถามที่ทดสอบได้ตอบด้วยการวัดหรือการสังเกต
  - ลองนึกว่าจะวัดอะไรเพื่อหาคำตอบ
  solution: ผ้าแห้งเร็วหรือช้าวัดได้ด้วยการจับเวลา จึงทดสอบได้ ส่วนข้ออื่นเป็นความชอบ ความคิดเห็น หรือสิ่งที่วัดไม่ได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.inquiry.investigation-design.p002
  topics:
  - science.inquiry.investigation-design
  difficulty: 1
  type: match
  stem: จับคู่ชื่อตัวแปรกับความหมาย
  pairs:
  - left: ตัวแปรต้น
    right: สิ่งที่เราตั้งใจเปลี่ยน
  - left: ตัวแปรตาม
    right: สิ่งที่เราวัดผล
  - left: ตัวแปรควบคุม
    right: สิ่งที่ต้องเหมือนกันทุกชุด
  hints:
  - ตัวแปรต้นมาก่อน เป็น "ต้นเหตุ"
  - ตัวแปรตามเปลี่ยน "ตาม" ตัวแปรต้น
  solution: ตัวแปรต้นคือสิ่งที่เราเปลี่ยน ตัวแปรตามคือผลที่วัด และตัวแปรควบคุมคือสิ่งที่ต้องเหมือนกันเพื่อให้การทดลองยุติธรรม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.inquiry.investigation-design.p003
  topics:
  - science.inquiry.investigation-design
  difficulty: 1
  type: text
  stem: ในการทดลอง สิ่งที่เราตั้งใจเปลี่ยนเรียกว่า "ตัวแปร..." (ตอบคำเดียว)
  accepted:
  - ต้น
  - ตัวแปรต้น
  misconceptions:
  - match: ตาม
    feedback: ตัวแปรตามคือสิ่งที่เราวัดผล ไม่ใช่สิ่งที่เราเปลี่ยน
  - match: ควบคุม
    feedback: ตัวแปรควบคุมคือสิ่งที่ต้องเหมือนกัน
  hints:
  - เป็นต้นเหตุของการเปลี่ยนแปลง
  - ตรงข้ามกับตัวแปรตาม
  solution: สิ่งที่เราตั้งใจเปลี่ยนคือ **ตัวแปรต้น** เช่น ปริมาณน้ำที่รดต้นถั่ว
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.inquiry.investigation-design.p004
  topics:
  - science.inquiry.investigation-design
  difficulty: 2
  type: mcq
  stem: จากภาพ การทดลองปลูกถั่วเขียว 3 กระถาง ข้อใดคือ **ตัวแปรตาม**
  choices:
  - id: a
    text: ความสูงของต้นถั่วหลัง 7 วัน
    correct: true
  - id: b
    text: ปริมาณน้ำที่รดต่อวัน
    feedback: ปริมาณน้ำคือสิ่งที่เราเปลี่ยน จึงเป็นตัวแปรต้น
  - id: c
    text: ชนิดของดิน
    feedback: ดินต้องเหมือนกันทุกกระถาง จึงเป็นตัวแปรควบคุม
  - id: d
    text: ขนาดของกระถาง
    feedback: ขนาดกระถางเท่ากัน จึงเป็นตัวแปรควบคุม
  hints:
  - ตัวแปรตามคือสิ่งที่เราวัด
  - เราวัดอะไรเมื่อครบ 7 วัน
  solution: ตัวแปรตามคือสิ่งที่วัดผล ได้แก่ความสูงของต้นถั่ว ซึ่งเปลี่ยนตามปริมาณน้ำ (ตัวแปรต้น)
  figure:
    src: fair-test.svg
    alt: ภาพกระถางถั่วเขียว 3 ใบ กระถาง A ได้น้ำ 0 มิลลิลิตรต่อวัน กระถาง B 20 มิลลิลิตร กระถาง C 40 มิลลิลิตร ต้นถั่วสูงไม่เท่ากัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.inquiry.investigation-design.p005
  topics:
  - science.inquiry.investigation-design
  difficulty: 2
  type: mcq
  stem: ปรางทดลองว่า "เกลือหรือน้ำตาลทำให้น้ำแข็งละลายเร็วกว่ากัน" โดยโรยผงบนก้อนน้ำแข็ง ข้อใดเป็น **ตัวแปรควบคุม**
  choices:
  - id: a
    text: ขนาดของก้อนน้ำแข็ง
    correct: true
  - id: b
    text: ชนิดของผงที่โรย
    feedback: ชนิดของผงคือสิ่งที่ปรางเปลี่ยน จึงเป็นตัวแปรต้น
  - id: c
    text: เวลาที่น้ำแข็งละลายหมด
    feedback: เวลาคือสิ่งที่วัด จึงเป็นตัวแปรตาม
  - id: d
    text: ความอยากรู้ของปราง
    feedback: ไม่ใช่ตัวแปรในการทดลอง
  hints:
  - ตัวแปรควบคุมต้องเหมือนกันทุกชุด
  - ถ้าก้อนน้ำแข็งใหญ่ไม่เท่ากัน ผลจะยุติธรรมไหม
  solution: ก้อนน้ำแข็งต้องมีขนาดเท่ากันทุกชุด จึงเป็นตัวแปรควบคุม ตัวแปรต้นคือชนิดของผง ตัวแปรตามคือเวลาที่ละลาย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.inquiry.investigation-design.p006
  topics:
  - science.inquiry.investigation-design
  difficulty: 2
  type: order
  stem: เรียงขั้นตอนการหาคำตอบทางวิทยาศาสตร์
  items:
  - ตั้งคำถามที่ทดสอบได้
  - คาดคะเนหรือตั้งสมมติฐาน
  - วางแผนกำหนดตัวแปรและวิธีวัด
  - ลงมือทดลองและบันทึกผล
  - สรุปผลเทียบกับสมมติฐาน
  hints:
  - เริ่มจากสิ่งที่อยากรู้
  - ต้องวางแผนก่อนลงมือ
  solution: ตั้งคำถาม → คาดคะเนหรือตั้งสมมติฐาน → วางแผน → ทดลองและบันทึก → สรุปผล แล้วอาจได้คำถามใหม่ต่อไป
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.inquiry.investigation-design.p007
  topics:
  - science.inquiry.investigation-design
  difficulty: 2
  type: mcq
  stem: การทดลองต้องต้มน้ำให้เดือด ข้อใดปลอดภัยที่สุด
  choices:
  - id: a
    text: ให้ผู้ใหญ่ช่วย ใช้ที่จับกันร้อน และตั้งภาชนะบนพื้นที่มั่นคง
    correct: true
  - id: b
    text: รีบถือแก้วน้ำร้อนวิ่งไปให้ครูดู
    feedback: การวิ่งถือของร้อนเสี่ยงหกใส่ตัวเองและเพื่อน
  - id: c
    text: ใช้มือเปล่าจับหม้อเพราะจับแป๊บเดียว
    feedback: หม้อร้อนทำให้ผิวหนังไหม้ได้แม้จับเพียงครู่เดียว
  - id: d
    text: ตั้งหม้อไว้ริมโต๊ะเพื่อจะได้มองเห็นง่าย
    feedback: ของที่วางริมโต๊ะอาจถูกชนตกลงมา
  hints:
  - คิดว่าอะไรอาจเป็นอันตราย
  - เลือกวิธีที่ป้องกันอันตรายได้
  solution: น้ำร้อนลวกผิวได้ จึงต้องมีผู้ใหญ่ช่วย ใช้ที่จับกันร้อน และวางบนพื้นที่มั่นคง ไม่ถือของร้อนแล้ววิ่ง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.inquiry.investigation-design.p008
  topics:
  - science.inquiry.investigation-design
  difficulty: 3
  type: mcq
  stem: บอยปล่อยรถของเล่นคันเดียวกันลงทางลาดสองอัน อันแรกสูง 20 เซนติเมตร ปูพรม อันที่สองสูง 40 เซนติเมตร เป็นไม้เรียบ แล้วสรุปว่า "พรมทำให้รถวิ่งได้ใกล้กว่า" ข้อสรุปนี้มีปัญหาอะไร
  choices:
  - id: a
    text: เปลี่ยนสองอย่างพร้อมกัน (ความสูงและพื้นผิว) จึงไม่รู้ว่าผลมาจากอะไร
    correct: true
  - id: b
    text: ไม่มีปัญหา เพราะใช้รถคันเดียวกัน
    feedback: ใช้รถคันเดียวกันดีแล้ว แต่ทางลาดยังต่างกันสองอย่าง
  - id: c
    text: ควรใช้รถคนละคันจะดีกว่า
    feedback: ถ้าใช้รถคนละคันยิ่งเพิ่มสิ่งที่ต่างกัน
  - id: d
    text: ควรวัดเวลาแทนระยะทาง
    feedback: วัดระยะทางก็ได้ ปัญหาอยู่ที่ตัวแปรต้นมีสองตัว
  hints:
  - นับว่ามีกี่อย่างที่ต่างกันระหว่างสองชุด
  - การทดลองที่ยุติธรรมเปลี่ยนเพียงอย่างเดียว
  solution: ทางลาดต่างกันทั้งความสูงและพื้นผิว ถ้าอยากรู้ผลของพื้นผิว ต้องให้ความสูงเท่ากัน (ดูการทดลองแรงเสียดทานใน [แรงเสียดทาน](/topic/physics.dynamics.friction/))
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.inquiry.investigation-design.p009
  topics:
  - science.inquiry.investigation-design
  difficulty: 3
  type: mcq
  stem: ข้อใดเป็น **สมมติฐาน** ที่เขียนได้ดีที่สุด สำหรับคำถาม "อุณหภูมิของน้ำมีผลต่อเวลาที่น้ำตาลละลายหรือไม่"
  choices:
  - id: a
    text: ถ้าน้ำมีอุณหภูมิสูงขึ้น ดังนั้นน้ำตาลจะละลายหมดเร็วขึ้น เพราะอนุภาคน้ำเคลื่อนที่เร็วขึ้น
    correct: true
  - id: b
    text: น้ำตาลอร่อยเมื่ออยู่ในน้ำร้อน
    feedback: ความอร่อยไม่ได้เกี่ยวกับคำถาม และวัดไม่ได้
  - id: c
    text: น้ำตาลจะละลาย
    feedback: ไม่บอกความสัมพันธ์ระหว่างอุณหภูมิกับเวลา
  - id: d
    text: ฉันจะทดลองด้วยน้ำสามแก้ว
    feedback: นี่คือวิธีทดลอง ไม่ใช่สมมติฐาน
  hints:
  - สมมติฐานบอกความสัมพันธ์ของตัวแปรต้นกับตัวแปรตาม
  - รูปแบบ "ถ้า ... ดังนั้น ... เพราะ ..."
  solution: สมมติฐานที่ดีบอกว่าตัวแปรต้น (อุณหภูมิ) สัมพันธ์กับตัวแปรตาม (เวลาละลาย) อย่างไร และให้เหตุผลจากความรู้เดิม (ดูการละลายใน [สภาพละลายได้และความเข้มข้นร้อยละ](/topic/chemistry.solutions.solubility-percent/))
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.inquiry.investigation-design.p010
  topics:
  - science.inquiry.investigation-design
  difficulty: 3
  type: mcq
  stem: แพรวทดลองว่า "ผงซักฟอกยี่ห้อใดขจัดคราบน้ำปลาได้ดีที่สุด" สิ่งใดต้องควบคุมให้เหมือนกัน (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: ปริมาณน้ำและผงซักฟอกที่ใช้
    correct: true
    feedback: ถูก
  - id: b
    text: ชนิดผ้าและขนาดคราบ
    correct: true
    feedback: ถูก
  - id: c
    text: เวลาที่ขยี้และแช่
    correct: true
    feedback: ถูก
  - id: d
    text: ยี่ห้อของผงซักฟอก
    feedback: ยี่ห้อคือสิ่งที่แพรวเปลี่ยน จึงเป็นตัวแปรต้น
  - id: e
    text: ความสะอาดของผ้าหลังซัก
    feedback: ความสะอาดคือสิ่งที่วัด จึงเป็นตัวแปรตาม
  hints:
  - ทุกอย่างที่อาจมีผลต่อความสะอาด ยกเว้นสิ่งที่เราเปลี่ยน
  - ตัวแปรต้นคือยี่ห้อ
  solution: ต้องควบคุมปริมาณน้ำและผงซักฟอก ชนิดผ้า ขนาดคราบ และเวลา เหลือให้ต่างกันเพียงยี่ห้อ จึงสรุปได้ว่าความต่างมาจากยี่ห้อ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.inquiry.investigation-design.p011
  topics:
  - science.inquiry.investigation-design
  difficulty: 3
  type: match
  stem: จับคู่คำถามกับวิธีหาคำตอบที่เหมาะสม
  pairs:
  - left: ลูกอ๊อดเปลี่ยนไปอย่างไรใน 1 เดือน
    right: สังเกตต่อเนื่องเป็นระยะ
  - left: ใบไม้ในโรงเรียนแบ่งได้กี่แบบ
    right: จำแนกกลุ่ม
  - left: คนที่ตัวสูงมีช่วงแขนยาวด้วยหรือไม่
    right: หาแบบรูปจากข้อมูลของหลายคน
  - left: ผ้าชนิดไหนแห้งเร็วที่สุด
    right: ทดลองเปรียบเทียบอย่างยุติธรรม
  - left: ไดโนเสาร์กินอะไร
    right: ค้นจากแหล่งข้อมูลที่เชื่อถือได้
  hints:
  - บางคำถามไม่ต้องเปลี่ยนตัวแปรเอง
  - ไดโนเสาร์สูญพันธุ์แล้ว ทดลองไม่ได้
  solution: คำถามแต่ละแบบเหมาะกับวิธีต่างกัน การทดลองที่ยุติธรรมเป็นเพียงวิธีหนึ่งในหลายวิธีของวิทยาศาสตร์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.inquiry.investigation-design.p012
  topics:
  - science.inquiry.investigation-design
  difficulty: 3
  type: numeric
  stem: ต้นทดลองว่าปริมาณเกลือ 4 ระดับมีผลต่อการงอกของถั่วเขียวหรือไม่ แต่ละระดับทำซ้ำ 3 ครั้ง ครั้งละ 1 จาน ต้องเตรียมจานทั้งหมดกี่ใบ
  answer:
    value: 12
    unit: ใบ
  misconceptions:
  - match: 7
    feedback: บวก 4 + 3 แต่ทุกระดับต้องทำซ้ำ 3 ครั้ง จึงต้องคูณ
  - match: 4
    feedback: ลืมทำซ้ำ
  hints:
  - แต่ละระดับใช้กี่จาน
  - จำนวนระดับคูณจำนวนครั้งที่ทำซ้ำ
  solution: $4 \times 3 = 12$ จาน การทำซ้ำช่วยให้รู้ว่าผลไม่ได้เกิดจากความบังเอิญ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.inquiry.investigation-design.p013
  topics:
  - science.inquiry.investigation-design
  difficulty: 4
  type: numeric
  stem: จากภาพ นักเรียนวางกรอบ 1 × 1 เมตร แบบสุ่ม 5 กรอบในสนามขนาด 20 × 10 เมตร ประมาณว่าทั้งสนามมีต้นแห้วหมูกี่ต้น
  answer:
    value: 1000
    unit: ต้น
  misconceptions:
  - match: 25
    feedback: นี่คือจำนวนที่นับได้ใน 5 กรอบเท่านั้น ต้องขยายเป็นทั้งสนาม
  - match: 5000
    feedback: คูณผลรวม 25 กับพื้นที่ ต้องใช้ค่าเฉลี่ยต่อกรอบ
  - match: 150
    feedback: ใช้ความยาวรอบรูปหรือบวก 20 + 10 แทนพื้นที่
  hints:
  - หาค่าเฉลี่ยจำนวนต้นต่อกรอบก่อน
  - สนามมีพื้นที่กี่ตารางเมตร แล้วคูณด้วยค่าเฉลี่ย
  solution: ค่าเฉลี่ย $= \frac{4+6+3+5+7}{5} = 5$ ต้นต่อตารางเมตร พื้นที่ $= 20 \times 10 = 200$ ตารางเมตร จำนวนโดยประมาณ $= 5 \times 200 = 1{,}000$ ต้น
  figure:
    src: quadrat.svg
    alt: แผนผังสนามโรงเรียนสี่เหลี่ยมผืนผ้ากว้าง 20 เมตร ยาว 10 เมตร แบ่งเป็นช่อง 1 × 1 เมตร มีกรอบสุ่มตัวอย่าง 5 กรอบกระจายทั่วสนาม นับต้นแห้วหมูได้ กรอบ 1 = 4 ต้น กรอบ 2 = 6 ต้น กรอบ 3 = 3 ต้น กรอบ 4 = 5 ต้น กรอบ 5 = 7 ต้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.inquiry.investigation-design.p014
  topics:
