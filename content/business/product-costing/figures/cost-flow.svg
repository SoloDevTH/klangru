<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" font-family="sans-serif" font-size="14">
  <title>การไหลของต้นทุนผลิตภัณฑ์จากวัตถุดิบถึงต้นทุนขาย</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="780" height="300" fill="#ffffff"/>
  <rect x="20.0" y="40.0" width="170.0" height="52.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="105.0" y="71.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">วัตถุดิบทางตรง</text>
  <line x1="190.0" y1="66.0" x2="268.0" y2="148.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="20.0" y="112.0" width="170.0" height="52.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="105.0" y="143.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">ค่าแรงทางตรง</text>
  <line x1="190.0" y1="138.0" x2="268.0" y2="148.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="20.0" y="184.0" width="170.0" height="52.0" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="105.0" y="215.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">ค่าใช้จ่ายการผลิต</text>
  <line x1="190.0" y1="210.0" x2="268.0" y2="148.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="105.0" y="262.0" text-anchor="middle" fill="#6b7280" font-size="12">(ปันส่วนด้วยอัตรา</text>
  <text x="105.0" y="280.0" text-anchor="middle" fill="#6b7280" font-size="12">กำหนดล่วงหน้า)</text>
  <rect x="270.0" y="118.0" width="150.0" height="60.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="345.0" y="154.0" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="bold">งานระหว่างทำ</text>
  <rect x="440.0" y="118.0" width="150.0" height="60.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="515.0" y="154.0" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="bold">สินค้าสำเร็จรูป</text>
  <rect x="610.0" y="118.0" width="150.0" height="60.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="685.0" y="154.0" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="bold">ต้นทุนขาย</text>
  <line x1="420.0" y1="148.0" x2="438.0" y2="148.0" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="590.0" y1="148.0" x2="608.0" y2="148.0" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="430.0" y="108.0" text-anchor="middle" fill="#1f2937" font-size="12">ผลิตเสร็จ</text>
  <text x="600.0" y="108.0" text-anchor="middle" fill="#1f2937" font-size="12">ขายได้</text>
  <text x="515.0" y="215.0" text-anchor="middle" fill="#6b7280" font-size="12.5">งานระหว่างทำและสินค้าสำเร็จรูปที่ยังไม่ขาย</text>
  <text x="515.0" y="233.0" text-anchor="middle" fill="#6b7280" font-size="12.5">= สินค้าคงเหลือในงบแสดงฐานะการเงิน</text>
  <text x="685.0" y="215.0" text-anchor="middle" fill="#1f2937" font-size="14"></text>
  <text x="515.0" y="270.0" text-anchor="middle" fill="#1f2937" font-size="13">ค่าใช้จ่ายในการขายและบริหาร → ค่าใช้จ่ายของงวด (ไม่เข้าต้นทุนสินค้า)</text>
</svg>
