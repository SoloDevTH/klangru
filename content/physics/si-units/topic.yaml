id: physics.units.si
subject: physics
title: { th: หน่วย SI และการแปลงหน่วย, en: SI units and unit conversion }
summary: รู้จักหน่วยฐาน 7 หน่วยของระบบ SI หน่วยอนุพันธ์ คำนำหน้าหน่วย สัญกรณ์วิทยาศาสตร์ และการแปลงหน่วยอย่างเป็นระบบ เช่น km/h เป็น m/s
difficulty: 2
minutes: 30
prerequisites: [math.number.integers]
encompasses: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
glossary:
  - { term: หน่วยฐาน, definition: "หน่วยหลัก 7 หน่วยของระบบ SI ที่กำหนดขึ้นเอง ไม่ได้สร้างจากหน่วยอื่น เช่น เมตร (m) กิโลกรัม (kg) วินาที (s)" }
  - { term: หน่วยอนุพันธ์, definition: "หน่วยที่สร้างจากหน่วยฐานด้วยการคูณหรือหาร เช่น เมตรต่อวินาที (m/s) และนิวตัน (N = kg·m/s²)" }
  - { term: คำนำหน้าหน่วย, definition: "ตัวอักษรหน้าหน่วยที่บอกว่าคูณด้วยสิบยกกำลังเท่าใด เช่น k = 10³ และ m = 10⁻³" }
  - { term: สัญกรณ์วิทยาศาสตร์, definition: "การเขียนจำนวนในรูป A × 10ⁿ โดย 1 ≤ A < 10 และ n เป็นจำนวนเต็ม" }
flashcards:
  - { front: "หน่วยฐาน SI ของมวลคืออะไร", back: "กิโลกรัม (kg) ไม่ใช่กรัม" }
  - { front: "แปลง km/h เป็น m/s ทำอย่างไร", back: "หารด้วย 3.6 เพราะ $1\\ \\mathrm{km/h} = \\dfrac{1000\\ \\mathrm{m}}{3600\\ \\mathrm{s}}$ เช่น $72\\ \\mathrm{km/h} = 20\\ \\mathrm{m/s}$" }
  - { front: "คำนำหน้า μ (ไมโคร) มีค่าเท่าใด", back: "$10^{-6}$ เช่น $1\\ \\mathrm{\\mu m} = 10^{-6}\\ \\mathrm{m}$" }
  - { front: "เขียน $0.0032$ ในรูปสัญกรณ์วิทยาศาสตร์", back: "$3.2 \\times 10^{-3}$" }
  - { front: "$1\\ \\mathrm{m^2}$ เท่ากับกี่ $\\mathrm{cm^2}$", back: "$100 \\times 100 = 10\\,000\\ \\mathrm{cm^2}$ เพราะต้องแปลงทั้งสองด้าน" }
