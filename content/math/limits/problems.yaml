  - id: math.calculus.limits.p018
    topics: [math.calculus.limits]
    difficulty: 4
    type: numeric
    stem: "$f(x) = \\dfrac{x^2 - 2x - 8}{x - 4}$ เมื่อ $x \\ne 4$ และ $f(4) = k$ จงหา $k$ ที่ทำให้ $f$ ต่อเนื่องที่ $x = 4$"
    answer: { value: 6 }
    hints:
      - "ต้องการ $f(4) = \\displaystyle\\lim_{x \\to 4} f(x)$"
      - "$x^2 - 2x - 8 = (x - 4)(x + 2)$"
    misconceptions:
      - { match: 0, feedback: "แทน $x = 4$ ในสูตรได้ $\\tfrac00$ ซึ่งไม่ใช่ 0 ต้องหาลิมิตก่อน" }
      - { match: 2, feedback: "หลังตัดได้ $x + 2$ ต้องแทน $x = 4$ ได้ 6" }
    solution: "$\\displaystyle\\lim_{x \\to 4}\\frac{(x - 4)(x + 2)}{x - 4} = \\lim_{x \\to 4}(x + 2) = 6$ จึงต้องให้ $k = 6$ (อุดรูโหว่)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.calculus.limits.p019
    topics: [math.calculus.limits]
    difficulty: 5
    type: mcq
    stem: "ข้อใดถูกต้องเกี่ยวกับ $\\displaystyle\\lim_{x \\to 0}\\frac{|x|}{x}$"
    choices:
      - { id: a, text: "หาค่าไม่ได้ เพราะลิมิตทางซ้ายเป็น $-1$ และทางขวาเป็น $1$", correct: true }
      - { id: b, text: "เท่ากับ $1$", feedback: "ถูกเฉพาะทางขวา ($x > 0$) ทางซ้าย $|x| = -x$ จึงได้ $-1$" }
      - { id: c, text: "เท่ากับ $0$", feedback: "$\\tfrac{|x|}{x}$ เป็น 1 หรือ $-1$ เสมอ ไม่เข้าใกล้ 0" }
      - { id: d, text: "เท่ากับ $-1$", feedback: "ถูกเฉพาะทางซ้าย ทางขวาได้ 1" }
    hints:
      - "เมื่อ $x > 0$ ได้ $|x| = x$ และเมื่อ $x < 0$ ได้ $|x| = -x$"
      - "หาลิมิตทั้งสองข้าง"
    solution: "$x > 0$: $\\tfrac{x}{x} = 1$; $x < 0$: $\\tfrac{-x}{x} = -1$ ลิมิตซ้ายและขวาไม่เท่ากัน ลิมิตจึงหาค่าไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.calculus.limits.p020
    topics: [math.calculus.limits]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการตรวจว่าฟังก์ชันที่นิยามเป็นช่วง ๆ ต่อเนื่องที่รอยต่อ $x = a$ หรือไม่"
    items:
      - "หาค่า $f(a)$ จากสูตรที่ครอบคลุม $x = a$"
      - "หาลิมิตทางซ้ายจากสูตรของ $x < a$"
      - "หาลิมิตทางขวาจากสูตรของ $x > a$"
      - "ตรวจว่าลิมิตซ้ายเท่ากับลิมิตขวา (ลิมิตมีค่า)"
      - "ตรวจว่าลิมิตเท่ากับ $f(a)$ แล้วสรุป"
    hints:
      - "ใช้เงื่อนไขสามข้อของความต่อเนื่อง"
      - "ลิมิตที่ $a$ ต้องหาจากทั้งสองข้างก่อน"
    solution: "หา $f(a)$ → ลิมิตซ้าย → ลิมิตขวา → ซ้ายเท่ากับขวาหรือไม่ → เท่ากับ $f(a)$ หรือไม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.calculus.limits.p021
    topics: [math.calculus.limits]
    difficulty: 5
    type: numeric
    stem: "จงหา $\\displaystyle\\lim_{x \\to \\infty}\\left(\\sqrt{x^2 + 6x} - x\\right)$"
    answer: { value: 3 }
    hints:
      - "รูปแบบ $\\infty - \\infty$ ยังสรุปไม่ได้ คูณและหารด้วยสังยุค $\\sqrt{x^2 + 6x} + x$"
      - "ได้ $\\dfrac{6x}{\\sqrt{x^2 + 6x} + x}$ แล้วหารเศษและส่วนด้วย $x$"
    misconceptions:
      - { match: 0, feedback: "$\\sqrt{x^2 + 6x}$ โตเร็วเกือบเท่า $x$ แต่ผลต่างไม่เข้าใกล้ 0 ต้องจัดรูปด้วยสังยุค" }
      - { match: 6, feedback: "หลังหารด้วย $x$ ตัวส่วนคือ $\\sqrt{1 + \\tfrac6x} + 1 \\to 2$ ต้องหาร 6 ด้วย 2" }
    solution: "$\\dfrac{(x^2 + 6x) - x^2}{\\sqrt{x^2 + 6x} + x} = \\dfrac{6}{\\sqrt{1 + \\frac6x} + 1} \\to \\dfrac{6}{2} = 3$"
    license: CC-BY-SA-4.0
    ai_assisted: true
