problems:
  - id: computer.data.digital-data-basics.p001
    topics: [computer.data.digital-data-basics]
    difficulty: 1
    type: mcq
    stem: "น้องฟ้าต้องพิมพ์รายงานเรื่องวันลอยกระทงส่งครู ควรใช้ซอฟต์แวร์แบบใด"
    choices:
      - { id: a, text: "โปรแกรมประมวลผลคำ", correct: true }
      - { id: b, text: "โปรแกรมตารางคำนวณ", feedback: "ตารางคำนวณเหมาะกับตัวเลขและการคำนวณ ไม่เหมาะกับการพิมพ์เรื่องยาว ๆ" }
      - { id: c, text: "โปรแกรมแต่งภาพ", feedback: "โปรแกรมแต่งภาพใช้ตกแต่งรูป ไม่ได้ทำมาเพื่อพิมพ์ข้อความยาว" }
      - { id: d, text: "เครื่องคิดเลข", feedback: "เครื่องคิดเลขคำนวณตัวเลขได้อย่างเดียว พิมพ์รายงานไม่ได้" }
    hints:
      - "งานนี้ส่วนใหญ่เป็นตัวหนังสือหรือตัวเลข"
      - "เลือกซอฟต์แวร์ที่ทำมาเพื่อพิมพ์และจัดหน้าข้อความ"
    solution: "รายงานเป็นข้อความยาว ใช้โปรแกรมประมวลผลคำซึ่งพิมพ์ แก้ไข และจัดหน้าได้สะดวก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.digital-data-basics.p002
    topics: [computer.data.digital-data-basics]
    difficulty: 1
    type: match
    stem: "จับคู่ข้อมูลกับรูปแบบของข้อมูล"
    pairs:
      - { left: "นักเรียนในห้อง 32 คน", right: "ตัวเลข" }
      - { left: "ชื่อจังหวัด เชียงใหม่", right: "ข้อความ" }
      - { left: "รูปถ่ายดอกบัวในสระ", right: "ภาพ" }
      - { left: "เครื่องหมาย ✓ ในใบเช็กชื่อ", right: "สัญลักษณ์" }
      - { left: "คลิปเสียงอ่านบทอาขยาน", right: "เสียง" }
    hints:
      - "ดูว่าข้อมูลแต่ละอย่างเราเห็นหรือได้ยินเป็นอะไร"
      - "เครื่องหมายสั้น ๆ ที่ตกลงกันว่าแทนความหมายหนึ่ง เรียกว่าสัญลักษณ์"
    solution: "32 คน เป็นตัวเลข, เชียงใหม่ เป็นข้อความ, รูปดอกบัว เป็นภาพ, ✓ เป็นสัญลักษณ์แทนคำว่า มาเรียน, คลิปอ่านบทอาขยาน เป็นเสียง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.digital-data-basics.p003
    topics: [computer.data.digital-data-basics]
    difficulty: 1
    type: match
    stem: "จับคู่งานกับซอฟต์แวร์ที่เหมาะที่สุด"
    pairs:
      - { left: "รวมคะแนนเก็บของเพื่อนทั้งห้อง", right: "โปรแกรมตารางคำนวณ" }
      - { left: "ทำสไลด์เล่าเรื่องทัศนศึกษาหน้าห้อง", right: "โปรแกรมนำเสนอ" }
      - { left: "ตัดขอบรูปถ่ายและปรับให้สว่าง", right: "โปรแกรมแต่งภาพ" }
      - { left: "เก็บคำตอบว่าเพื่อนอยากไปเที่ยวที่ไหน", right: "แบบสอบถามออนไลน์" }
    hints:
      - "งานใดเกี่ยวกับตัวเลขที่ต้องคำนวณ งานใดต้องพูดหน้าห้อง"
      - "การถามคนจำนวนมากแล้วเก็บคำตอบอัตโนมัติ ใช้บริการบนอินเทอร์เน็ตได้"
    solution: "คะแนนรวมใช้ตารางคำนวณ สไลด์หน้าห้องใช้โปรแกรมนำเสนอ แก้รูปใช้โปรแกรมแต่งภาพ และเก็บคำตอบจากหลายคนใช้แบบสอบถามออนไลน์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.digital-data-basics.p004
    topics: [computer.data.digital-data-basics]
    difficulty: 2
    type: mcq
    stem: "ชื่อไฟล์รายงานวิทยาศาสตร์ข้อใดดีที่สุด"
    choices:
      - { id: a, text: "`รายงาน-ต้นถั่วงอก-2569-06-15.docx`", correct: true }
      - { id: b, text: "`งานใหม่ (2).docx`", feedback: "ชื่อนี้ไม่บอกว่าเป็นงานเรื่องอะไร ถ้ามีไฟล์หลายไฟล์จะหาไม่เจอ" }
      - { id: c, text: "`aaaa.docx`", feedback: "ชื่อที่พิมพ์มั่ว ๆ ไม่มีความหมาย ทั้งเราและเพื่อนจะจำไม่ได้ว่าข้างในคืออะไร" }
      - { id: d, text: "`รายงาน-ต้นถั่วงอก-2569-06-15.jpg`", feedback: "นามสกุล .jpg ใช้กับไฟล์ภาพ รายงานที่พิมพ์ในโปรแกรมประมวลผลคำควรเป็น .docx" }
    hints:
      - "ชื่อไฟล์ที่ดีบอกได้ว่าข้างในคืออะไร"
      - "ดูนามสกุลด้วยว่าตรงกับชนิดของไฟล์หรือไม่"
    solution: "ข้อ ก บอกทั้งชนิดงาน เรื่อง และวันที่ และนามสกุล .docx ตรงกับไฟล์เอกสาร การเขียนวันที่แบบ ปี-เดือน-วัน ทำให้ไฟล์เรียงตามวันได้เอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.digital-data-basics.p005
    topics: [computer.data.digital-data-basics]
    difficulty: 2
    type: match
    stem: "จับคู่นามสกุลไฟล์กับชนิดของไฟล์"
    pairs:
      - { left: ".jpg", right: "ภาพถ่าย" }
      - { left: ".mp3", right: "เสียงหรือเพลง" }
      - { left: ".mp4", right: "วิดีโอ" }
      - { left: ".pptx", right: "งานนำเสนอ (สไลด์)" }
      - { left: ".xlsx", right: "ตารางคำนวณ" }
    hints:
      - "mp3 กับ mp4 ต่างกันที่มีภาพเคลื่อนไหวหรือไม่"
      - "ไฟล์ที่ขึ้นต้นด้วย x มักเป็นตาราง ส่วน ppt มาจากคำว่า PowerPoint ที่ใช้ทำสไลด์"
    solution: ".jpg ภาพถ่าย, .mp3 เสียง, .mp4 วิดีโอ, .pptx งานนำเสนอ, .xlsx ตารางคำนวณ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.digital-data-basics.p006
    topics: [computer.data.digital-data-basics]
    difficulty: 2
    type: mcq
    stem: "บอส **คัดลอก** ไฟล์ `เพลงชาติ.mp3` จากคอมพิวเตอร์ไปไว้ในแฟลชไดรฟ์ หลังจากนั้นข้อใดถูก"
    choices:
      - { id: a, text: "มีไฟล์ทั้งในคอมพิวเตอร์และในแฟลชไดรฟ์", correct: true }
      - { id: b, text: "ไฟล์อยู่ในแฟลชไดรฟ์เท่านั้น ในคอมพิวเตอร์หายไป", feedback: "แบบนี้คือการย้าย ไม่ใช่การคัดลอก การคัดลอกทำให้ได้ไฟล์เพิ่มอีกชุด" }
      - { id: c, text: "ไฟล์อยู่ในคอมพิวเตอร์เท่านั้น", feedback: "ถ้าคัดลอกสำเร็จ แฟลชไดรฟ์ต้องมีไฟล์ชุดใหม่ด้วย" }
      - { id: d, text: "ไฟล์ถูกเปลี่ยนชื่อเป็นชื่อใหม่", feedback: "การคัดลอกไม่ได้เปลี่ยนชื่อไฟล์ การเปลี่ยนชื่อเป็นอีกคำสั่งหนึ่ง" }
    hints:
      - "นึกถึงการถ่ายเอกสาร ต้นฉบับยังอยู่หรือไม่"
      - "คัดลอกกับย้ายต่างกันที่ไฟล์เดิมยังอยู่ที่เดิมหรือไม่"
    solution: "การคัดลอกสร้างไฟล์ชุดใหม่ในแฟลชไดรฟ์ ไฟล์เดิมในคอมพิวเตอร์ยังอยู่ จึงมีสองที่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.digital-data-basics.p007
    topics: [computer.data.digital-data-basics]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนเก็บภาพถ่ายทัศนศึกษาที่อยุธยาจากกล้องลงคอมพิวเตอร์อย่างเป็นระเบียบและปลอดภัย"
    items:
      - "สร้างโฟลเดอร์ใหม่ในโฟลเดอร์รูปภาพ"
      - "ตั้งชื่อโฟลเดอร์ว่า ทัศนศึกษา-อยุธยา-2569"
      - "คัดลอกภาพจากกล้องลงในโฟลเดอร์นั้น"
      - "เปิดดูในโฟลเดอร์ว่าภาพมาครบทุกภาพ"
      - "ลบภาพในกล้องเพื่อให้มีที่ว่างถ่ายรูปต่อ"
    hints:
      - "ต้องมีที่เก็บก่อน จึงจะใส่ของลงไปได้"
      - "จะลบภาพต้นฉบับได้ก็ต่อเมื่อแน่ใจแล้วว่าสำเนาครบ"
    solution: "สร้างโฟลเดอร์ → ตั้งชื่อ → คัดลอกภาพ → ตรวจว่าครบ → จึงลบในกล้อง ถ้าลบก่อนตรวจ ภาพที่คัดลอกไม่สำเร็จจะหายไปเลย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.digital-data-basics.p008
    topics: [computer.data.digital-data-basics]
    difficulty: 2
    type: numeric
    stem: "แผนภูมิรูปภาพผลไม้ที่ชอบของนักเรียนทั้งโรงเรียน กำหนดให้ รูปผลไม้ 1 รูป แทนนักเรียน 5 คน แถวมะม่วงมี 6 รูป มีนักเรียนชอบมะม่วงกี่คน"
    answer: { value: 30, unit: คน }
    hints:
      - "อ่านคำอธิบายของแผนภูมิก่อน ว่า 1 รูปแทนกี่คน"
      - "นำจำนวนรูปคูณกับจำนวนคนที่ 1 รูปแทน"
    misconceptions:
      - { match: 6, feedback: "6 คือจำนวนรูป แต่ 1 รูปแทน 5 คน จึงต้องคูณ 5" }
      - { match: 11, feedback: "ดูเหมือนนำ 6 + 5 แต่แต่ละรูปแทน 5 คน ต้องคูณ ไม่ใช่บวก" }
    solution: "6 รูป × 5 คนต่อรูป = 30 คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.digital-data-basics.p009
    topics: [computer.data.digital-data-basics]
    difficulty: 3
    type: mcq
    stem: "ห้อง ป.4 วัดอุณหภูมิหน้าห้องทุกชั่วโมงตั้งแต่ 8 นาฬิกาถึง 15 นาฬิกา และต้องการให้เห็นว่าอุณหภูมิขึ้นลงอย่างไรตลอดวัน ควรนำเสนอแบบใด"
    choices:
      - { id: a, text: "กราฟเส้น", correct: true }
      - { id: b, text: "แผนภูมิวงกลม", feedback: "แผนภูมิวงกลมแสดงสัดส่วนของส่วนต่าง ๆ ในทั้งหมด แต่อุณหภูมิแต่ละชั่วโมงไม่ได้เป็นส่วนของผลรวมใด" }
      - { id: c, text: "แผนภูมิรูปภาพ", feedback: "แผนภูมิรูปภาพใช้นับจำนวนของแต่ละกลุ่ม เช่น จำนวนคน ไม่เหมาะกับค่าที่วัดต่อเนื่องตามเวลา" }
      - { id: d, text: "ตารางรอยขีด", feedback: "ตารางรอยขีดใช้นับความถี่ ไม่ได้แสดงการเปลี่ยนแปลงตามเวลา" }
    hints:
      - "ข้อมูลนี้เปลี่ยนไปตามอะไร"
      - "แผนภูมิแบบไหนลากจุดต่อกันตามเวลาจนเห็นขึ้นหรือลง"
    solution: "ข้อมูลที่วัดซ้ำตามเวลาควรใช้กราฟเส้น เส้นที่ขึ้นหรือลงทำให้เห็นการเปลี่ยนแปลงตลอดวันได้ทันที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.digital-data-basics.p010
    topics: [computer.data.digital-data-basics]
    difficulty: 3
    type: numeric
    stem: "แผนภูมิแท่งแสดงความสูงของต้นถั่วที่ปลูกในโครงงาน ถ้าต้นถั่วโตแบบเดิมต่อไป เมื่อถึงสัปดาห์ที่ 7 จะสูงกี่เซนติเมตร"
    figure:
      src: plant-growth.svg
      alt: "แผนภูมิแท่งความสูงของต้นถั่ว แกนตั้งคือความสูงเป็นเซนติเมตร 0 ถึง 20 สัปดาห์ที่ 1 สูง 4 สัปดาห์ที่ 2 สูง 7 สัปดาห์ที่ 3 สูง 10 สัปดาห์ที่ 4 สูง 13 สัปดาห์ที่ 5 สูง 16 เซนติเมตร"
    answer: { value: 22, unit: เซนติเมตร }
    hints:
      - "อ่านความสูงของแต่ละแท่ง แล้วดูว่าเพิ่มขึ้นสัปดาห์ละเท่าใด"
      - "ต่อแบบรูปจากสัปดาห์ที่ 5 ไปสัปดาห์ที่ 6 แล้วไปสัปดาห์ที่ 7"
    misconceptions:
      - { match: 19, feedback: "19 เซนติเมตรคือสัปดาห์ที่ 6 ยังต้องต่อแบบรูปไปอีกหนึ่งสัปดาห์" }
      - { match: 18, feedback: "ดูเหมือนบวกครั้งละ 1 จากสัปดาห์ที่ 5 แต่ต้นถั่วสูงขึ้นสัปดาห์ละ 3 เซนติเมตร" }
    solution: "ความสูง 4, 7, 10, 13, 16 เพิ่มขึ้นสัปดาห์ละ 3 เซนติเมตร สัปดาห์ที่ 6 สูง 19 และสัปดาห์ที่ 7 สูง 19 + 3 = 22 เซนติเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.digital-data-basics.p011
    topics: [computer.data.digital-data-basics]
    difficulty: 3
    type: numeric
    stem: "ชมรมรักษ์โลกบันทึกน้ำหนักขวดพลาสติกที่เก็บได้ในตารางคำนวณ วันจันทร์ถึงศุกร์ได้ 12, 15, 9, 18 และ 11 กิโลกรัม ทั้งสัปดาห์เก็บได้กี่กิโลกรัม"
    answer: { value: 65, unit: กิโลกรัม }
    hints:
      - "ประมวลผลข้อมูลด้วยการรวมทุกวันเข้าด้วยกัน"
      - "ในตารางคำนวณใช้สูตรรวม เช่น SUM แต่คิดเองได้ด้วยการบวกทีละวัน"
    misconceptions:
      - { match: 13, feedback: "13 คือค่าเฉลี่ยต่อวัน (65 ÷ 5) แต่โจทย์ถามผลรวมทั้งสัปดาห์" }
      - { match: 18, feedback: "18 คือวันที่เก็บได้มากที่สุด โจทย์ถามผลรวมของทุกวัน" }
    solution: "12 + 15 + 9 + 18 + 11 = 65 กิโลกรัม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.digital-data-basics.p012
    topics: [computer.data.digital-data-basics]
    difficulty: 3
    type: mcq
    stem: "ในตารางคะแนนสอบย่อยเต็ม 20 คะแนน พบว่าเพื่อนคนหนึ่งได้ 150 คะแนน ควรทำอย่างไรก่อนนำข้อมูลไปสร้างแผนภูมิ"
    choices:
      - { id: a, text: "ตรวจกับกระดาษคำตอบหรือสมุดคะแนนต้นฉบับว่าได้จริงเท่าใด", correct: true }
      - { id: b, text: "ลบแถวนั้นทิ้งไปเลย", feedback: "ถ้าลบทิ้ง ข้อมูลของเพื่อนคนนี้จะหายไป ผลสรุปจะไม่ครบ ควรตรวจหาค่าที่ถูกก่อน" }
      - { id: c, text: "เปลี่ยนเป็น 20 เพราะเป็นคะแนนเต็ม", feedback: "เป็นการเดา คะแนนจริงอาจเป็น 15 ที่พิมพ์เลข 0 เกิน ต้องตรวจจากต้นฉบับ" }
      - { id: d, text: "ใช้ต่อไปตามเดิม เพราะคอมพิวเตอร์คำนวณถูกเสมอ", feedback: "คอมพิวเตอร์คำนวณตามข้อมูลที่ใส่ ถ้าข้อมูลผิด ผลก็ผิด" }
    hints:
      - "คะแนน 150 จากเต็ม 20 เป็นไปได้หรือไม่"
      - "ข้อมูลที่ผิดปกติควรแก้ด้วยการตรวจหรือการเดา"
    solution: "150 มากกว่าคะแนนเต็ม จึงผิดแน่นอน อาจพิมพ์ 15 แล้วเกิน 0 ต้องตรวจจากต้นฉบับแล้วแก้ให้ถูก ไม่ลบหรือเดาเอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.digital-data-basics.p013
    topics: [computer.data.digital-data-basics]
    difficulty: 3
    type: mcq
    stem: "มินจำได้ว่าเคยบันทึกไฟล์ที่มีคำว่า \"ลอยกระทง\" ในชื่อ แต่จำไม่ได้ว่าเก็บไว้ในโฟลเดอร์ใด วิธีใดหาได้เร็วที่สุด"
    choices:
      - { id: a, text: "พิมพ์คำว่า ลอยกระทง ในช่องค้นหาของเครื่อง", correct: true }
      - { id: b, text: "เปิดดูทุกโฟลเดอร์ทีละโฟลเดอร์", feedback: "หาเจอได้แต่ช้ามาก ถ้ามีโฟลเดอร์หลายร้อยโฟลเดอร์" }
      - { id: c, text: "พิมพ์รายงานใหม่ทั้งหมด", feedback: "ไฟล์เดิมยังอยู่ การทำใหม่เสียเวลาโดยไม่จำเป็น" }
      - { id: d, text: "ค้นหาคำว่า ลอยกระทง ในเว็บไซต์ค้นหาบนอินเทอร์เน็ต", feedback: "เว็บไซต์ค้นหาหาข้อมูลบนอินเทอร์เน็ต ไม่ได้หาไฟล์ที่เก็บในเครื่องของเรา" }
    hints:
      - "เครื่องคอมพิวเตอร์และแท็บเล็ตมีเครื่องมือหาไฟล์จากชื่อ"
      - "พิมพ์แค่บางส่วนของชื่อก็หาได้"
    solution: "ช่องค้นหาของเครื่องค้นหาไฟล์จากชื่อหรือบางส่วนของชื่อในทุกโฟลเดอร์ จึงเร็วที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.digital-data-basics.p014
    topics: [computer.data.digital-data-basics]
    difficulty: 4
    type: numeric
    stem: "สำรวจอาหารกลางวันที่ชอบของนักเรียน 36 คน แล้วนำเสนอเป็นแผนภูมิวงกลม ส่วนของข้าวผัดเป็นมุม 90 องศา (หนึ่งในสี่ของวงกลม) มีนักเรียนชอบข้าวผัดกี่คน"
    answer: { value: 9, unit: คน }
    hints:
      - "วงกลมทั้งวงคือ 360 องศา แทนนักเรียนทั้ง 36 คน"
      - "90 องศาเป็นส่วนเท่าใดของ 360 องศา แล้วนำส่วนนั้นไปคิดกับ 36 คน"
    misconceptions:
      - { match: 90, feedback: "90 คือขนาดมุม ไม่ใช่จำนวนคน ต้องแปลงมุมเป็นส่วนของนักเรียนทั้งหมด" }
      - { match: 4, feedback: "4 คือ 360 ÷ 90 ซึ่งบอกว่ามุมนี้เป็นหนึ่งในสี่ของวงกลม ยังต้องหาหนึ่งในสี่ของ 36 คน" }
    solution: "90 ÷ 360 = 1/4 ของวงกลม จึงเป็น 1/4 ของนักเรียน: 36 ÷ 4 = 9 คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.digital-data-basics.p015
    topics: [computer.data.digital-data-basics]
    difficulty: 4
    type: mcq
    stem: "คุณยายของภูมิสายตาไม่ค่อยดี อยากอ่านข่าวในแท็บเล็ต ภูมิควรช่วยตั้งค่าแบบใดให้เหมาะกับคุณยายที่สุด"
    choices:
      - { id: a, text: "ขยายขนาดตัวอักษร และเปิดให้เครื่องอ่านออกเสียงได้", correct: true }
      - { id: b, text: "ลดความสว่างหน้าจอให้มืดที่สุดเพื่อถนอมสายตา", feedback: "จอที่มืดเกินไปทำให้คนสายตาไม่ดีอ่านยากขึ้น" }
      - { id: c, text: "ตั้งค่าเหมือนเครื่องของภูมิทุกอย่าง", feedback: "ผู้ใช้แต่ละคนมีความต้องการต่างกัน การตั้งค่าที่เหมาะกับภูมิอาจไม่เหมาะกับคุณยาย" }
      - { id: d, text: "เปลี่ยนตัวอักษรเป็นแบบตัวเขียนลายมือให้สวยงาม", feedback: "ตัวอักษรแบบลายมืออ่านยากกว่าตัวพิมพ์ธรรมดา ไม่ช่วยคนสายตาไม่ดี" }
    hints:
      - "คิดถึงปัญหาของผู้ใช้คนนี้โดยเฉพาะ"
      - "ความสามารถใดช่วยให้ตัวหนังสือเห็นชัดขึ้น หรือไม่ต้องอ่านเองเลย"
    solution: "ตัวอักษรใหญ่ช่วยให้อ่านง่าย และการอ่านออกเสียงช่วยเมื่ออ่านไม่ไหว เป็นการเลือกเครื่องมือตามความต้องการของผู้ใช้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.digital-data-basics.p016
    topics: [computer.data.digital-data-basics]
    difficulty: 4
    type: order
    stem: "สภานักเรียนอยากรู้ว่าควรจัดกิจกรรมชมรมใดเพิ่ม เรียงขั้นตอนการใช้ข้อมูลแก้ปัญหานี้"
    items:
      - "ตั้งคำถามว่า นักเรียนอยากเข้าชมรมใดมากที่สุด"
      - "ส่งแบบสอบถามออนไลน์ให้นักเรียนทุกห้องตอบ"
      - "ตรวจคำตอบซ้ำหรือคำตอบที่ผิดปกติ แล้วนับจำนวนของแต่ละชมรม"
      - "สร้างแผนภูมิแท่งเปรียบเทียบแต่ละชมรม"
      - "สรุปผลและเสนอชมรมที่ได้รับความนิยมต่อครู"
    hints:
      - "ต้องรู้ก่อนว่าจะถามอะไร จึงจะเก็บข้อมูลได้"
      - "ลำดับคือ คำถาม → รวบรวม → ประมวลผล → นำเสนอ → สรุป"
    solution: "ตั้งคำถาม → รวบรวมข้อมูล → ตรวจและนับ → นำเสนอเป็นแผนภูมิ → สรุปผลเพื่อตัดสินใจ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.digital-data-basics.p017
    topics: [computer.data.digital-data-basics]
    difficulty: 5
    type: numeric
    stem: "ห้องสมุดออนไลน์ของโรงเรียนมีผู้ยืมหนังสือในเดือนที่ 1 ถึง 4 เป็น 25, 50, 100 และ 200 ครั้ง ถ้าแบบรูปเป็นเช่นนี้ต่อไป เดือนที่ 6 จะมีผู้ยืมกี่ครั้ง"
    answer: { value: 800, unit: ครั้ง }
    hints:
      - "ลองดูว่าเดือนถัดไปได้จากเดือนก่อนด้วยการบวกหรือการคูณ"
      - "ผลต่างไม่คงที่ (25, 50, 100) แต่ค่าถัดไปเป็นกี่เท่าของค่าก่อน"
    misconceptions:
      - { match: 400, feedback: "400 คือเดือนที่ 5 หรือได้จากการบวกเพิ่มทีละ 100 แต่ข้อมูลนี้เพิ่มเป็น 2 เท่าทุกเดือน ต้องคูณ 2 อีกครั้ง" }
      - { match: 250, feedback: "ดูเหมือนบวกเพิ่มทีละ 25 แต่ผลต่างไม่คงที่ แต่ละเดือนเป็น 2 เท่าของเดือนก่อน" }
    solution: "25 → 50 → 100 → 200 เพิ่มเป็น 2 เท่าทุกเดือน เดือนที่ 5 = 400 เดือนที่ 6 = 800 ครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.digital-data-basics.p018
    topics: [computer.data.digital-data-basics]
    difficulty: 5
    type: mcq
    stem: "ครูให้หาคะแนนรวมของนักเรียน 200 คนในตารางคำนวณ แต่ละคนมีคะแนน 5 ช่อง วิธีใดเร็วและผิดพลาดน้อยที่สุด"
    choices:
      - { id: a, text: "เขียนสูตรรวม (SUM) ในแถวแรก แล้วลากหรือคัดลอกสูตรลงไปทุกแถว", correct: true }
      - { id: b, text: "ใช้เครื่องคิดเลขบวกทีละคนแล้วพิมพ์ผลลงในตาราง", feedback: "ทำได้แต่ต้องกดหลายพันครั้ง เสี่ยงพิมพ์ผิดและเสียเวลามาก" }
      - { id: c, text: "พิมพ์สูตรใหม่เองทุกแถวทีละแถว", feedback: "ได้ผลถูก แต่ช้ากว่าการคัดลอกสูตรซึ่งปรับตำแหน่งแถวให้เอง" }
      - { id: d, text: "คิดเลขในใจแล้วพิมพ์เฉพาะผลรวม", feedback: "คิดในใจ 200 แถวเสี่ยงผิดมาก และตรวจย้อนหลังไม่ได้" }
    hints:
      - "ตารางคำนวณมีความสามารถอะไรที่ทำงานซ้ำ ๆ แทนเราได้"
      - "สูตรที่คัดลอกลงไปแต่ละแถวจะอ้างช่องของแถวนั้นเอง"
    solution: "สูตร SUM แถวแรกคัดลอกลงไปได้ทันที แต่ละแถวจะรวมคะแนนของแถวตัวเอง และถ้าคะแนนเปลี่ยน ผลรวมก็คำนวณใหม่ให้เอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.digital-data-basics.p019
    topics: [computer.data.digital-data-basics]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "นักเรียน ม.3 ทำคลิปแนะนำโรงเรียนลงเว็บไซต์ของโรงเรียน ให้ผู้ชมทุกกลุ่มเข้าถึงได้ ข้อใดควรทำ (เลือกได้หลายข้อ)"
    choices:
      - { id: a, text: "ใส่คำบรรยายใต้วิดีโอ (ซับไตเติล)", correct: true, feedback: "ช่วยผู้ที่หูไม่ได้ยินและผู้ที่ดูในที่เปิดเสียงไม่ได้" }
      - { id: b, text: "เขียนคำอธิบายภาพ (ข้อความแทนภาพ) ให้ภาพนิ่งบนหน้าเว็บ", correct: true, feedback: "โปรแกรมอ่านหน้าจออ่านข้อความนี้ให้ผู้พิการทางสายตาฟัง" }
      - { id: c, text: "ใช้ตัวอักษรสีเหลืองอ่อนบนพื้นสีขาว", feedback: "สีที่ต่างกันน้อยทำให้อ่านยาก โดยเฉพาะผู้สูงอายุและผู้ที่สายตาไม่ดี" }
      - { id: d, text: "ใส่ปุ่มเลือกภาษาไทยและภาษาอังกฤษ", correct: true, feedback: "ช่วยผู้ปกครองและแขกต่างชาติที่อ่านภาษาไทยไม่ได้" }
    hints:
      - "คิดถึงผู้ชมที่หูไม่ได้ยิน ตาไม่เห็น และอ่านภาษาไทยไม่ได้"
      - "ข้อใดทำให้คนบางกลุ่มอ่านหรือดูได้ยากขึ้น"
    solution: "คำบรรยายใต้วิดีโอ ข้อความแทนภาพ และการเลือกภาษาช่วยให้ผู้ชมหลากหลายเข้าถึงได้ ส่วนตัวอักษรสีอ่อนบนพื้นขาวทำให้อ่านยาก"
