problems:
- id: business.econ.macro-indicators.p001
  topics:
  - business.econ.macro-indicators
  difficulty: 1
  type: mcq
  stem: ข้อใด **นับรวม** ใน GDP ของไทยปีนี้
  choices:
  - id: a
    text: รถกระบะที่ผลิตในโรงงานที่ระยองปีนี้ และขายให้ครอบครัวหนึ่ง
    correct: true
  - id: b
    text: รถมือสองที่ผลิตเมื่อ 5 ปีก่อน แล้วขายต่อปีนี้
    feedback: สินค้ามือสองนับไปแล้วในปีที่ผลิต ถ้านับอีกจะนับซ้ำ (ค่านายหน้าขายรถปีนี้นับได้)
  - id: c
    text: แป้งสาลีที่ร้านเบเกอรี่ซื้อมาทำขนมปังขาย
    feedback: แป้งเป็นสินค้าขั้นกลาง มูลค่าอยู่ในราคาขนมปังซึ่งเป็นสินค้าขั้นสุดท้ายแล้ว
  - id: d
    text: เบี้ยยังชีพผู้สูงอายุที่รัฐจ่าย
    feedback: เป็นเงินโอน ไม่ได้ซื้อสินค้าหรือบริการที่ผลิตขึ้นใหม่
  - id: e
    text: เงินที่นักลงทุนซื้อหุ้นของบริษัทในตลาดหลักทรัพย์
    feedback: การซื้อหุ้นเดิมเป็นการเปลี่ยนมือสินทรัพย์ทางการเงิน ไม่ใช่การผลิต
  hints:
  - GDP นับมูลค่าสินค้าและบริการ **ขั้นสุดท้าย** ที่ **ผลิตขึ้นใหม่** ในประเทศในช่วงเวลานั้น
  - ตัดสินค้าขั้นกลาง ของมือสอง เงินโอน และการซื้อขายหลักทรัพย์ออก
  solution: นับเฉพาะรถกระบะใหม่ที่ผลิตในประเทศปีนี้และขายเป็นสินค้าขั้นสุดท้าย ส่วนของมือสอง สินค้าขั้นกลาง เงินโอน และการซื้อหุ้นไม่ใช่การผลิตใหม่ จึงไม่นับ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.macro-indicators.p002
  topics:
  - business.econ.macro-indicators
  difficulty: 1
  type: match
  stem: จับคู่โครงสร้างตลาดกับตัวอย่าง (สมมติ) ที่เข้ากันที่สุด
  pairs:
  - left: แข่งขันสมบูรณ์
    right: ชาวนาหลายแสนรายขายข้าวเปลือกเกรดเดียวกันที่ราคาตลาด
  - left: แข่งขันแบบผูกขาด
    right: ร้านก๋วยเตี๋ยวหลายสิบร้านในย่านเดียว แต่ละร้านมีสูตรของตัวเอง
  - left: ผู้ขายน้อยราย
    right: ผู้ให้บริการเครือข่ายมือถือไม่กี่รายที่ต้องจับตาราคาของกันและกัน
  - left: ผูกขาด
    right: ผู้จ่ายน้ำประปารายเดียวในเมือง ไม่มีบริการแทนที่ใกล้เคียง
  hints:
  - ดูจำนวนผู้ขายก่อน
  - แล้วดูว่าสินค้าต่างกันไหม และเข้าตลาดยากแค่ไหน
  solution: ข้าวเกรดเดียวกันจากผู้ขายจำนวนมาก = แข่งขันสมบูรณ์ ร้านอาหารหลายร้านที่ต่างกันเล็กน้อย = แข่งขันแบบผูกขาด ผู้ให้บริการไม่กี่รายที่พึ่งพากัน = ผู้ขายน้อยราย ผู้ขายรายเดียวไม่มีสินค้าแทน = ผูกขาด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.macro-indicators.p003
  topics:
  - business.econ.macro-indicators
  difficulty: 2
  type: numeric
  stem: จากตารางของประเทศ ข (สมมติ) จงหา GDP ด้านรายจ่าย (ตอบเป็นพันล้านบาท)
  answer:
    value: 8800
    unit: พันล้านบาท
  misconceptions:
  - match: 16000
    feedback: บวกการนำเข้า ต้องหักเพราะเป็นสินค้าที่ผลิตนอกประเทศ
  - match: 8500
    feedback: ลืมการส่งออกสุทธิ
  figure:
    src: p-components.svg
    alt: 'ตารางข้อมูลของประเทศ ข (สมมติ) หน่วยพันล้านบาท: การใช้จ่ายเพื่อการบริโภคของครัวเรือน 5,200 การลงทุนของภาคเอกชน 1,800 การใช้จ่ายของรัฐบาล 1,500 การส่งออกสินค้าและบริการ 3,900 การนำเข้าสินค้าและบริการ 3,600'
  hints:
  - $\text{GDP} = C + I + G + (X - M)$
  - การนำเข้าเป็นรายจ่ายซื้อของที่ผลิตในต่างประเทศ จึงต้องหักออก
  solution: $\text{GDP} = 5{,}200 + 1{,}800 + 1{,}500 + (3{,}900 - 3{,}600) = 8{,}800$ พันล้านบาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.macro-indicators.p004
  topics:
  - business.econ.macro-indicators
  difficulty: 2
  type: numeric
  stem: GDP ที่แท้จริงของประเทศสมมติเพิ่มจาก $10{,}000$ พันล้านบาทเป็น $10{,}250$ พันล้านบาท อัตราการเติบโตทางเศรษฐกิจเป็นกี่เปอร์เซ็นต์
  answer:
    value: 2.5
    tolerance: 0.01
    unit: '%'
  misconceptions:
  - match: 250
    feedback: นั่นคือส่วนที่เพิ่ม (พันล้านบาท) ยังไม่ได้หารด้วยค่าเดิม
  - match: 2.439024
    feedback: หารด้วยค่าปีนี้ ต้องหารด้วยค่าปีก่อน
  hints:
  - อัตราการเติบโต $= \dfrac{\text{ปีนี้} - \text{ปีก่อน}}{\text{ปีก่อน}} \times 100$
  - หารด้วยค่าปีก่อน ไม่ใช่ปีนี้
  solution: $\dfrac{10{,}250 - 10{,}000}{10{,}000} \times 100 = 2.5\%$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.macro-indicators.p005
  topics:
  - business.econ.macro-indicators
  difficulty: 2
  type: mcq
  stem: ข้อใดถูกนับเป็น **การลงทุน (I)** ใน GDP เลือกทุกข้อที่ถูก
  multiple: true
  choices:
  - id: a
    text: โรงงานซื้อเครื่องจักรใหม่ที่ผลิตปีนี้
    correct: true
  - id: b
    text: ครอบครัวสร้างบ้านหลังใหม่
    correct: true
  - id: c
    text: สินค้าคงคลังของร้านค้าเพิ่มขึ้นตอนสิ้นปี
    correct: true
  - id: d
    text: พนักงานซื้อหุ้นของบริษัทในตลาดหลักทรัพย์
    feedback: ในภาษาชาวบ้านเรียกว่า "ลงทุน" แต่ในบัญชี GDP เป็นการโอนสินทรัพย์ทางการเงิน ไม่ใช่การสร้างทุนใหม่
  - id: e
    text: ร้านค้าซื้อที่ดินเปล่าแปลงเดิมต่อจากเจ้าของคนก่อน
    feedback: ที่ดินไม่ได้ถูกผลิตขึ้นใหม่ เป็นการเปลี่ยนมือ
  hints:
  - การลงทุนใน GDP คือการซื้อ **สินค้าทุนที่ผลิตใหม่** ที่อยู่อาศัยใหม่ และส่วนเปลี่ยนของสินค้าคงคลัง
  - การซื้อหลักทรัพย์ไม่สร้างสินค้าใหม่
  solution: การลงทุนใน GDP = เครื่องจักรและอาคารใหม่ ที่อยู่อาศัยใหม่ และสินค้าคงคลังที่เพิ่มขึ้น ส่วนการซื้อหุ้นหรือที่ดินเดิมเป็นการเปลี่ยนมือสินทรัพย์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.macro-indicators.p006
  topics:
  - business.econ.macro-indicators
  difficulty: 3
  type: numeric
  stem: 'ประเทศสมมติผลิตสองอย่าง ปี 2567 (ปีฐาน): ข้าว $1{,}000$ ตัน ราคา $15$ พันบาทต่อตัน และบริการตัดผม $200$ พันครั้ง ราคา $100$ บาทต่อครั้ง (คิดเป็น $100$ พันบาทต่อพันครั้ง) ปี 2568: ข้าว $1{,}050$ ตัน ราคา $16$ พันบาท ตัดผม $210$ พันครั้ง ราคา $110$ บาท จงหา **GDP ที่แท้จริงปี 2568** ณ ราคาปี 2567 (ตอบเป็นพันบาท)'
  answer:
    value: 36750
    unit: พันบาท
  misconceptions:
  - match: 39900
    feedback: ใช้ราคาปี 2568 นั่นคือ GDP ณ ราคาประจำปี
  - match: 35000
    feedback: ใช้ปริมาณปีฐาน นั่นคือ GDP ปี 2567
  hints:
  - GDP ที่แท้จริง = ปริมาณปีนี้ × ราคาปีฐาน
  - ข้าว $1{,}050 \times 15$ และตัดผม $210 \times 100$
  solution: GDP ที่แท้จริง 2568 $= 1{,}050(15) + 210(100) = 15{,}750 + 21{,}000 = 36{,}750$ พันบาท (GDP ณ ราคาประจำปี $= 16{,}800 + 23{,}100 = 39{,}900$ พันบาท)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.macro-indicators.p007
  topics:
  - business.econ.macro-indicators
  difficulty: 3
  type: numeric
  stem: ต่อจากข้อที่แล้ว GDP ปี 2568 ณ ราคาประจำปี $39{,}900$ พันบาท และ GDP ที่แท้จริง $36{,}750$ พันบาท ตัวปรับค่า GDP (GDP deflator) ปี 2568 เป็นเท่าใด (ปีฐาน = 100 ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 108.571429
    tolerance: 0.05
  misconceptions:
  - match: 92.105263
    feedback: กลับเศษกับส่วน
  - match: 1.0857
    feedback: ลืมคูณ 100
  hints:
  - ตัวปรับค่า GDP $= \dfrac{\text{GDP ราคาประจำปี}}{\text{GDP ที่แท้จริง}} \times 100$
  - ค่ามากกว่า 100 แปลว่าราคาเฉลี่ยสูงกว่าปีฐาน
  solution: $\dfrac{39{,}900}{36{,}750} \times 100 \approx 108.57$ ราคาโดยรวมของสินค้าที่ผลิตสูงกว่าปีฐานประมาณ $8.57\%$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.macro-indicators.p008
  topics:
  - business.econ.macro-indicators
  difficulty: 3
  type: numeric
  stem: ประเทศสมมติมี GDP $17{,}600$ พันล้านบาท ประชากร $66$ ล้านคน GDP ต่อหัวเป็นกี่บาทต่อคน (ตอบเป็นบาท จำนวนเต็ม)
  answer:
    value: 266666.666667
    tolerance: 5
    unit: บาท
  misconceptions:
  - match: 266.666667
    feedback: ลืมแปลงหน่วยพันล้านกับล้าน
  - match: 22222.222222
    feedback: หารด้วย 12 เดือน แต่โจทย์ถามต่อปี
  hints:
  - 'แปลงหน่วยก่อน: $1$ พันล้าน $= 10^9$ และ $1$ ล้าน $= 10^6$'
  - GDP ต่อหัว $= \text{GDP} \div \text{ประชากร}$
  solution: $\dfrac{17{,}600 \times 10^9}{66 \times 10^6} \approx 266{,}667$ บาทต่อคนต่อปี
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.macro-indicators.p009
  topics:
  - business.econ.macro-indicators
  difficulty: 3
  type: numeric
  stem: เงินกู้ธุรกิจคิดดอกเบี้ย $6\%$ ต่อปี คาดว่าเงินเฟ้อ $2.5\%$ ต่อปี จงหาอัตราดอกเบี้ยที่แท้จริงด้วยสูตร $1 + r = \dfrac{1 + i}{1 + \pi}$ (ตอบเป็น % ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 3.414634
    tolerance: 0.02
    unit: '%'
  misconceptions:
  - match: 8.5
    feedback: บวกเงินเฟ้อ ต้องหักออก
  - match: 3.5
    feedback: นั่นคือค่าประมาณ $i - \pi$ โจทย์ให้ใช้สูตรแบบแม่น
  hints:
  - แทน $i = 0.06$ และ $\pi = 0.025$
  - $r = \dfrac{1.06}{1.025} - 1$
  solution: $r = \dfrac{1.06}{1.025} - 1 \approx 0.0341$ หรือ $3.41\%$ (ค่าประมาณ $6 - 2.5 = 3.5\%$ ใกล้เคียง) อัตราที่แท้จริงคือต้นทุนการกู้ที่ธุรกิจแบกจริงหลังหักผลของราคาที่สูงขึ้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.macro-indicators.p010
  topics:
  - business.econ.macro-indicators
  difficulty: 3
  type: numeric
  stem: ถ้า GDP ที่แท้จริงของประเทศสมมติเท่ากับ $10{,}000$ พันล้านบาท และเติบโตคงที่ $3\%$ ต่อปี อีก $10$ ปีจะเป็นกี่พันล้านบาท (ปัดเป็นจำนวนเต็ม)
  answer:
    value: 13439.163793
    tolerance: 2
    unit: พันล้านบาท
  misconceptions:
  - match: 13000
    feedback: คิดแบบเชิงเดียว $10{,}000 \times (1 + 0.3)$ ลืมว่าการเติบโตทบต้น
  hints:
  - การเติบโตทบต้นทุกปี $= 10{,}000 \times 1.03^{10}$
  - ไม่ใช่บวก $3\%$ ของค่าเดิมทุกปี
  solution: $10{,}000 \times 1.03^{10} \approx 13{,}439$ พันล้านบาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.macro-indicators.p011
  topics:
  - business.econ.macro-indicators
  difficulty: 3
  type: mcq
  stem: บริษัทผลิตวัสดุก่อสร้างในไทยกำลังตัดสินใจสร้างโรงงานเพิ่ม ตัวชี้วัดชุดใดเป็นสัญญาณที่ **สนับสนุน** การขยายกำลังผลิตมากที่สุด
  choices:
  - id: a
    text: GDP ที่แท้จริงโตต่อเนื่อง การลงทุนภาคเอกชนเพิ่ม อัตราดอกเบี้ยเงินกู้ทรงตัวในระดับต่ำ และเงินเฟ้อใกล้เป้าหมาย
    correct: true
  - id: b
    text: GDP ณ ราคาประจำปีโต 8% แต่ส่วนใหญ่มาจากราคาที่สูงขึ้น ปริมาณผลผลิตแทบไม่เพิ่ม
    feedback: ต้องดู GDP ที่แท้จริง การเติบโตที่มาจากราคาไม่ได้แปลว่าความต้องการสินค้าเพิ่ม
  - id: c
    text: อัตราดอกเบี้ยสูงขึ้นเร็ว และการว่างงานเพิ่ม
    feedback: ต้นทุนการกู้สูงขึ้นและกำลังซื้อลดลง เป็นสัญญาณให้ระวัง
  - id: d
    text: เงินเฟ้อสูงมากและไม่แน่นอน
    feedback: เงินเฟ้อสูงทำให้วางแผนต้นทุนและราคายาก และมักตามมาด้วยดอกเบี้ยที่สูงขึ้น
  hints:
  - การขยายโรงงานต้องการความต้องการซื้อที่เพิ่มขึ้นจริงและต้นทุนการกู้ที่รับได้
  - แยก GDP ราคาประจำปีกับ GDP ที่แท้จริง
  solution: ความต้องการซื้อที่เพิ่มขึ้นจริง (GDP ที่แท้จริงและการลงทุนโต) ต้นทุนการกู้ต่ำ และราคาที่มีเสถียรภาพ ช่วยให้การลงทุนระยะยาวมีโอกาสคุ้มค่า ตัวชี้วัดเป็นข้อมูลประกอบการตัดสินใจ ไม่ได้รับประกันผล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.macro-indicators.p012
  topics:
  - business.econ.macro-indicators
  difficulty: 4
  type: numeric
  stem: ตลาดน้ำดื่มบรรจุขวดในจังหวัดหนึ่ง (สมมติ) มีผู้ขาย 5 ราย ส่วนแบ่งตลาด $35\%$, $25\%$, $20\%$, $10\%$, $10\%$ จงหาดัชนีเฮอร์ฟินดาห์ล–เฮิร์ชแมน (HHI) โดยใช้ส่วนแบ่งเป็นร้อยละ
  answer:
    value: 2450
  misconceptions:
  - match: 0.245
