    ai_assisted: true

  - id: chemistry.solutions.solubility-percent.p014
    topics: [chemistry.solutions.solubility-percent]
    difficulty: 5
    type: numeric
    stem: "ที่ 20 °C เกลือแกงละลายในน้ำ 100 g ได้ 35.9 g สารละลายเกลือแกงอิ่มตัวที่ 20 °C มีความเข้มข้นร้อยละเท่าใดโดยมวล (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 26.4, tolerance: 0.2, unit: "% w/w" }
    misconceptions:
      - { match: 35.9, feedback: "35.9 g เป็นมวลต่อน้ำ 100 g ไม่ใช่ต่อสารละลาย 100 g ต้องหารด้วย $100 + 35.9$" }
    hints:
      - "สารละลายอิ่มตัวนี้มีเกลือ 35.9 g กับน้ำ 100 g"
      - "มวลสารละลาย = 135.9 g"
    solution: "$\\dfrac{35.9}{100 + 35.9} \\times 100 = \\dfrac{35.9}{135.9} \\times 100 = 26.4\\%$ w/w สภาพละลายได้กับร้อยละโดยมวลจึงเป็นคนละตัวเลขกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.solutions.solubility-percent.p015
    topics: [chemistry.solutions.solubility-percent]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นการใช้สารละลายในบ้านอย่างถูกต้องและปลอดภัย (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "เจือจางปุ๋ยน้ำตามอัตราส่วนบนฉลากก่อนรดต้นไม้", correct: true, feedback: "ถูก ปุ๋ยเข้มเกินไปทำให้รากพืชเสียหาย" }
      - { id: b, text: "ใช้แอลกอฮอล์ประมาณ 70% เช็ดมือแทนแอลกอฮอล์ 95%", correct: true, feedback: "ถูก แอลกอฮอล์ราว 70% ฆ่าเชื้อได้ดีกว่า เพราะมีน้ำช่วยและระเหยช้ากว่า" }
      - { id: c, text: "ผสมน้ำยาฟอกขาวกับน้ำยาล้างห้องน้ำชนิดกรด เพื่อให้สะอาดเร็วขึ้น", feedback: "อันตราย จะเกิดแก๊สคลอรีนที่เป็นพิษต่อปอด ห้ามผสมกันเด็ดขาด" }
      - { id: d, text: "เทยาฆ่าแมลงให้เข้มกว่าฉลากระบุ เพื่อให้แมลงตายเร็วขึ้น", feedback: "ความเข้มข้นเกินฉลากเพิ่มอันตรายต่อผู้ใช้และสิ่งแวดล้อม และตกค้างในพืชผัก" }
    hints:
      - "ความเข้มข้นที่ปลอดภัยและได้ผลบอกไว้บนฉลาก"
      - "เข้มข้นมากขึ้นไม่ได้ดีกว่าเสมอ และสารบางชนิดผสมกันแล้วเกิดแก๊สพิษ"
    solution: "ข้อ a และ b ถูก ส่วนการผสมน้ำยาฟอกขาวกับน้ำยาชนิดกรดทำให้เกิดแก๊สคลอรีน และการใช้ยาฆ่าแมลงเข้มเกินฉลากเป็นอันตราย ถ้าสูดแก๊สหรือได้รับสารพิษ ให้ออกไปที่อากาศบริสุทธิ์และโทร 1669"
