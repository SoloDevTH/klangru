# สารานุกรมและแหล่งอ้างอิงเปิดสำหรับคลังรู้
#
# ตรวจสัญญาอนุญาตจากหน้าของแหล่งเองทุกแหล่งเมื่อ 2026-10-24 (ดู evidence_url)
# reuse ตัดสินตาม ADR 0001 (docs/decisions/0001-non-commercial-and-licensing.md) และใบอนุญาตเริ่มต้นของหัวข้อ CC-BY-SA-4.0
#   adapt     = ดัดแปลงข้อความมาใส่บทเรียนที่เป็น CC-BY-SA-4.0 ได้ (ต้องใส่ adapted_from)
#   link-only = ใช้เป็นลิงก์ "อ่านเพิ่มเติม" หรือฝัง (embed) เท่านั้น ห้ามคัดลอกหรือดัดแปลงข้อความ
# แหล่ง NC และ NC-SA ตั้งเป็น link-only เพราะงานดัดแปลงต้องเป็น CC-BY-NC(-SA) ซึ่งเข้ากับ CC-BY-SA ไม่ได้
# ยกเว้นหัวข้อหรือโจทย์นั้นเลือกใช้ใบอนุญาต CC-BY-NC-SA-4.0 ทั้งชิ้นและไม่มีข้อความจาก Wikipedia ปน (ดู derivative_license)
# id ของแต่ละแหล่งใช้เป็นค่า `source` ใน references ของ topic.yaml

retrieved: "2026-10-24"

sources:
  # ---------- ภาษาไทย ----------
  - id: wikipedia-th
    name: วิกิพีเดียภาษาไทย
    url: https://th.wikipedia.org/
    languages: [th]
    subjects: [math, physics, chemistry, thai, english, chinese]
    license: CC-BY-SA-4.0
    reuse: adapt
    derivative_license: [CC-BY-SA-4.0]
    api: >-
      MediaWiki Action API https://th.wikipedia.org/w/api.php (query, search, langlinks, pageprops=disambiguation)
      และ REST https://th.wikipedia.org/api/rest_v1/page/summary/<ชื่อบทความ>
    notes: >-
      ท้ายทุกหน้าระบุ "สัญญาอนุญาตครีเอทีฟคอมมอนส์ แบบแสดงที่มา-อนุญาตแบบเดียวกัน" (by-sa/4.0) ข้อกำหนดการใช้งานของวิกิมีเดียให้ข้อความเป็น CC BY-SA 4.0 และ GFDL
      ภาพในบทความมีใบอนุญาตแยกตามไฟล์บน Commons ต้องตรวจทีละภาพ
      คุณภาพบทความไม่สม่ำเสมอ หลายบทความเป็นโครง (stub) สั้นไม่กี่ร้อยตัวอักษร
      API ถูกจำกัดอัตรา (HTTP 429) เมื่อเรียกจากเครือข่ายที่ใช้ IP ร่วมกัน ให้ใส่ User-Agent ที่บอกช่องทางติดต่อ เว้นช่วงระหว่างคำขอ และเก็บแคช
    evidence_url: https://foundation.wikimedia.org/wiki/Policy:Terms_of_Use

