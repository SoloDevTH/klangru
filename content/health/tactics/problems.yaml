  stem: ทีมบาสเกตบอลของเรามีผู้เล่นตัวสูงน้อย แต่ทุกคนวิ่งเร็วและอึด ส่วนคู่แข่งมีผู้เล่นตัวสูงที่เล่นใต้แป้นเก่ง แต่เคลื่อนที่ช้าและยิงไกลไม่แม่น แผนใดเหมาะสมที่สุด
