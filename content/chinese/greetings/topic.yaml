id: chinese.vocab.greetings
subject: chinese
title: { th: "คำทักทาย ขอบคุณ ขอโทษ และลาก่อน", en: "Greetings, thanks, apologies and goodbyes" }
summary: คำทักทายภาษาจีน 你好 您好 คำขอบคุณ ขอโทษ ลาก่อน คำตอบที่ถูกสถานการณ์ และมารยาทการทักทายแบบจีน
difficulty: 1
minutes: 25
prerequisites: [chinese.pinyin.tones]
encompasses:
  - { id: chinese.pinyin.tones, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: reply-pairs.svg
    alt: "คู่คำพูดและคำตอบ 4 คู่ มีลูกศรจากคำพูดไปคำตอบ: 你好！ nǐ hǎo สวัสดี ตอบ 你好！ · 谢谢！ xièxie ขอบคุณ ตอบ 不客气！ bú kèqi ไม่ต้องเกรงใจ · 对不起！ duìbuqǐ ขอโทษ ตอบ 没关系！ méi guānxi ไม่เป็นไร · 再见！ zàijiàn ลาก่อน ตอบ 再见！ หมายเหตุว่าภาษาไทยใช้ ไม่เป็นไร ทั้งสองกรณี"
    caption: "ขอบคุณกับขอโทษมีคำตอบต่างกัน"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: chinese.vocab.greetings.p003, prompt: "ลองตอบคำขอบคุณของเพื่อน" }
  - type: worked-example
    title: เลือกคำทักทายให้เหมาะกับคนและเวลา
    problem: "ตอนเช้า มัคคุเทศก์ไทยไปรับคณะทัวร์ชาวจีนที่มีผู้สูงอายุหลายท่านที่ล็อบบี้โรงแรม ควรทักทายว่าอะไร"
    steps:
      - text: "ผู้ฟังเป็นกลุ่มหลายคน ใช้ 大家 dàjiā (ทุกคน) ได้ 大家好 แปลว่า สวัสดีทุกคน"
      - text: "เป็นตอนเช้า จึงใช้ 早上好 zǎoshang hǎo ได้ด้วย"
      - text: "มีผู้สูงอายุ ควรพูดสุภาพ พยักหน้า และยิ้ม ไม่ต้องไหว้"
        why: "คนจีนทักทายด้วยการยิ้ม พยักหน้า และจับมือ การไหว้เป็นธรรมเนียมไทย"
      - text: "รวมเป็น 大家好！早上好！ แล้วแนะนำตัวต่อ"
    answer: "大家好！早上好！ (dàjiā hǎo! zǎoshang hǎo!)"
  - type: worked-example
    title: ตอบให้ถูกสถานการณ์
    problem: "ในร้านอาหาร พนักงานไทยเผลอทำน้ำหกใส่โต๊ะลูกค้าชาวจีน แล้วรีบเช็ดให้ ทั้งสองฝ่ายควรพูดอะไรบ้าง"
    steps:
      - text: "พนักงานทำผิด จึงขอโทษก่อน: 对不起！ duìbuqǐ"
      - text: "ลูกค้าตอบคำขอโทษด้วย 没关系！ méi guānxi (ไม่เป็นไร)"
        why: "คำตอบคำขอโทษคือ 没关系 ไม่ใช่ 不客气"
      - text: "พนักงานเช็ดโต๊ะให้ ลูกค้าขอบคุณ: 谢谢！"
      - text: "พนักงานตอบคำขอบคุณ: 不客气！ bú kèqi"
    answer: "对不起 → 没关系 แล้ว 谢谢 → 不客气"
  - { type: check, problem: chinese.vocab.greetings.p010, prompt: "คำตอบของคำขอโทษคืออะไร" }
glossary:
  - { term: "你好 nǐ hǎo", definition: "สวัสดี ใช้ทั่วไปกับเพื่อนหรือคนวัยใกล้กัน พูดจริงว่า ní hǎo" }
  - { term: "您 nín", definition: "คุณ แบบสุภาพ ใช้กับผู้สูงอายุ ครู ลูกค้า หรือคนที่ไม่สนิท" }
  - { term: "不客气 bú kèqi", definition: "ไม่ต้องเกรงใจ ใช้ตอบคำขอบคุณ 谢谢" }
  - { term: "没关系 méi guānxi", definition: "ไม่เป็นไร ใช้ตอบคำขอโทษ 对不起" }
  - { term: "拱手 gǒngshǒu", definition: "ท่าคารวะแบบจีน กำมือข้างหนึ่งแล้วใช้อีกมือโอบไว้ระดับอก นิยมในเทศกาลและงานพิธี" }
flashcards:
  - { front: "谢谢 ตอบว่าอะไร", back: "不客气 bú kèqi หรือ 不用谢 bú yòng xiè" }
  - { front: "对不起 ตอบว่าอะไร", back: "没关系 méi guānxi (ไม่เป็นไร)" }
  - { front: "你好 กับ 您好 ต่างกันอย่างไร", back: "您好 สุภาพกว่า ใช้กับผู้สูงอายุ ครู ลูกค้า" }
  - { front: "早上好 · 晚上好 · 晚安", back: "สวัสดีตอนเช้า · สวัสดีตอนเย็น · ราตรีสวัสดิ์" }
  - { front: "再见 แปลตรงตัวว่าอะไร", back: "再 อีก + 见 พบ = พบกันใหม่ (ลาก่อน)" }
