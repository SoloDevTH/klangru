    stem: "ซุ้มประตูโรงเรียนแห่งหนึ่งเป็นรูปพาราโบลา ฐานกว้าง 20 เมตร สูงที่สุด 8 เมตรที่กึ่งกลาง ที่ระยะ 5 เมตรจากกึ่งกลาง (ตามแนวนอน) ซุ้มสูงกี่เมตร"
    answer: { value: 6, unit: เมตร }
    hints:
      - "วางจุดยอดที่ $(0, 8)$ ฐานอยู่ที่ $(\\pm 10, 0)$ จึง $y = 8 - kx^2$"
