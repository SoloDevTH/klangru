<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="520" height="330" font-family="sans-serif" font-size="15">
  <title>แผนภาพแรงของลังที่ถูกดึงบนพื้น น้ำหนัก 200 N แรงตั้งฉาก 200 N แรงดึง 120 N ทางขวา แรงเสียดทาน 90 N ทางซ้าย ความยาวลูกศรตามสัดส่วนขนาดแรง</title>
  <rect x="0" y="0" width="520" height="330" fill="#ffffff"/>
  <line x1="60.0" y1="210.0" x2="460.0" y2="210.0" stroke="#6b7672" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5"/>
  <rect x="210.0" y="130.0" width="100.0" height="80.0" rx="0" fill="#f3e3c3" stroke="#15211e" stroke-width="2"/>
  <line x1="260.0" y1="170.0" x2="260.0" y2="258.0" stroke="#b4521f" stroke-width="3.2" stroke-linecap="butt"/>
  <polygon points="260.0,270.0 254.6,258.0 265.4,258.0" fill="#b4521f"/>
  <text x="268.0" y="266.0" fill="#b4521f" font-size="14" text-anchor="start" font-weight="bold">W = 200 N</text>
  <line x1="260.0" y1="170.0" x2="260.0" y2="82.0" stroke="#1f5fa8" stroke-width="3.2" stroke-linecap="butt"/>
  <polygon points="260.0,70.0 265.4,82.0 254.6,82.0" fill="#1f5fa8"/>
  <text x="268.0" y="82.0" fill="#1f5fa8" font-size="14" text-anchor="start" font-weight="bold">N = 200 N</text>
  <line x1="310.0" y1="170.0" x2="358.0" y2="170.0" stroke="#0a6b60" stroke-width="3.2" stroke-linecap="butt"/>
  <polygon points="370.0,170.0 358.0,175.4 358.0,164.6" fill="#0a6b60"/>
  <text x="376.0" y="175.0" fill="#0a6b60" font-size="14" text-anchor="start" font-weight="bold">T = 120 N</text>
  <line x1="210.0" y1="210.0" x2="177.0" y2="210.0" stroke="#b3261e" stroke-width="3.2" stroke-linecap="butt"/>
  <polygon points="165.0,210.0 177.0,204.6 177.0,215.4" fill="#b3261e"/>
  <text x="187.5" y="234.0" fill="#b3261e" font-size="14" text-anchor="middle" font-weight="bold">f = 90 N</text>
  <circle cx="260.0" cy="170.0" r="4" fill="#15211e"/>
</svg>
