problems:
- id: chinese.grammar.complements-basic.p001
  topics:
  - chinese.grammar.complements-basic
  difficulty: 1
  type: mcq
  stem: 我听懂了。 (Wǒ tīngdǒng le.) แปลว่าอะไร
  choices:
  - id: a
    text: ฉันกำลังฟังอยู่
    feedback: กำลังทำใช้ 在
  - id: b
    text: ฉันอยากฟัง
    feedback: อยากใช้ 想
  - id: c
    text: ฉันฟังเข้าใจแล้ว
    correct: true
    feedback: ถูก 听 = ฟัง 懂 = เข้าใจ (ผลของการฟัง)
  - id: d
    text: ฉันฟังไม่เข้าใจ
    feedback: ไม่มีคำปฏิเสธ 没 หรือ 不
  hints:
  - 懂 dǒng = เข้าใจ
  - กริยา + ผล + 了 = ทำแล้วได้ผลนั้น
  solution: '**ฉันฟังเข้าใจแล้ว**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.complements-basic.p002
  topics:
  - chinese.grammar.complements-basic
  difficulty: 2
  type: match
  stem: จับคู่กริยากับส่วนเติมเต็มผลลัพธ์กับความหมาย
  pairs:
  - left: 看见
    right: มองเห็น
  - left: 写错
    right: เขียนผิด
  - left: 做完
    right: ทำเสร็จ
  - left: 找到
    right: หาเจอ
  hints:
  - 见 = เห็น 错 = ผิด
  - 完 = เสร็จ 到 = ถึง (บรรลุผล)
  solution: 看见 มองเห็น · 写错 เขียนผิด · 做完 ทำเสร็จ · 找到 หาเจอ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.complements-basic.p003
  topics:
  - chinese.grammar.complements-basic
  difficulty: 2
  type: mcq
  stem: รูปปฏิเสธของ 我看懂了。 (ฉันอ่านเข้าใจแล้ว) ข้อใดถูกต้อง
  choices:
  - id: a
    text: 我没看懂。
    correct: true
    feedback: ถูก ปฏิเสธผลด้วย 没 และตัด 了
  - id: b
    text: 我不看懂。
    feedback: ผลของเหตุการณ์ปฏิเสธด้วย 没 ไม่ใช่ 不
  - id: c
    text: 我没看懂了。
    feedback: ประโยคปฏิเสธด้วย 没 ไม่มี 了
  - id: d
    text: 我看没懂。
    feedback: 没 วางหน้ากริยา
  hints:
  - ทบทวน 了 กับ 没 ในบทปฏิเสธ
  - 没 + กริยา + ผล
  solution: '**我没看懂。** Wǒ méi kàndǒng.'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.complements-basic.p004
  topics:
  - chinese.grammar.complements-basic
  difficulty: 2
  type: hanzi
  stem: เขียนอักษร 完 (wán เสร็จ) ตามลำดับขีด
  character: 完
  pinyin: wán
  meaning: เสร็จ หมด
  hints:
  - 完 = 宀 (หลังคา) + 元 รวม 7 ขีด
  - เขียน 宀 ก่อน แล้วเขียน 元 ปิดด้วยขีดตวัดขวา
  solution: '宀: 点 → 点 → 横钩 แล้ว 元: 横 → 横 → 撇 → 竖弯钩 รวม 7 ขีด'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.complements-basic.p005
  topics:
  - chinese.grammar.complements-basic
  difficulty: 2
  type: mcq
  stem: กินส้มตำที่ร้านแถวอนุสาวรีย์ชัยฯ เสร็จ เพื่อนชาวจีนพูดว่า 我吃饱了！ (bǎo) หมายความว่าอะไร
  choices:
  - id: a
    text: ฉันกินไม่ไหว
    feedback: กินไม่ไหวใช้รูป 吃不了 หรือ 吃不下
  - id: b
    text: ฉันอยากกินอีก
    feedback: ไม่มีคำว่าอยาก
  - id: c
    text: ฉันอิ่มแล้ว
    correct: true
    feedback: ถูก 吃饱 = กินจนอิ่ม
  - id: d
    text: ฉันกินเสร็จแต่ยังหิว
    feedback: 饱 = อิ่ม ไม่ใช่ยังหิว
  hints:
  - 饱 มี 饣 (อาหาร)
  - 'กริยา + ผล: 吃 + 饱'
  solution: '**ฉันอิ่มแล้ว**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.complements-basic.p006
  topics:
  - chinese.grammar.complements-basic
  difficulty: 3
  type: mcq
  stem: ดูภาพ A ผู้พูดอยู่นอกบ้าน เห็นเพื่อนเดินออกจากบ้านมาหาตัวเอง 他从房子里走＿＿了。 (从 = จาก)
  figure: &id001
    src: direction-quiz.svg
    alt: 'สองภาพ ภาพ A: ผู้พูดยืนอยู่นอกบ้าน มีอีกคนหนึ่งยืนตรงประตูบ้านและลูกศรชี้จากประตูมาทางผู้พูด ภาพ B: ผู้พูดยืนอยู่ชั้นล่างที่เชิงบันได มีอีกคนหนึ่งอยู่กลางบันไดและลูกศรชี้ขึ้นบันไดไปทางชั้นบน ห่างจากผู้พูด'
    caption: ดูว่าผู้พูดอยู่ตรงไหน
  choices:
  - id: a
    text: 出去
    feedback: 去 = ออกห่างจากผู้พูด แต่เพื่อนเดินมาหาผู้พูด
  - id: b
    text: 进来
    feedback: 进 = เข้า แต่เพื่อนออกจากบ้าน
  - id: c
    text: 进去
    feedback: ทั้งทิศและผู้พูดไม่ตรง
  - id: d
    text: 出来
    correct: true
    feedback: ถูก ออกจากบ้าน (出) และเข้าหาผู้พูด (来)
  hints:
  - 'ทิศย่อย: ออกจากบ้าน = 出'
  - ดูว่าเคลื่อนเข้าหาผู้พูด (来) หรือออกห่าง (去)
  solution: '**走出来** zǒu chūlai เดินออกมา (ผู้พูดอยู่ข้างนอก)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.complements-basic.p007
  topics:
  - chinese.grammar.complements-basic
  difficulty: 3
  type: mcq
  stem: ดูภาพ B ผู้พูดอยู่ชั้นล่าง เห็นน้องชายวิ่งขึ้นบันไดไป 弟弟跑＿＿了。
  figure: *id001
  choices:
  - id: a
    text: 上去
    correct: true
    feedback: ถูก ขึ้น (上) และออกห่างจากผู้พูด (去)
  - id: b
    text: 上来
    feedback: 来 ใช้เมื่อเข้าหาผู้พูด แต่ผู้พูดอยู่ชั้นล่าง
  - id: c
    text: 下去
    feedback: 下 = ลง แต่น้องวิ่งขึ้น
  - id: d
    text: 下来
    feedback: ทิศไม่ตรงทั้งสองส่วน
  hints:
  - วิ่งขึ้น = 上
  - ผู้พูดอยู่ข้างล่าง น้องจึงเคลื่อนออกห่าง
  solution: '**跑上去** pǎo shàngqu วิ่งขึ้นไป'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.complements-basic.p008
  topics:
  - chinese.grammar.complements-basic
  difficulty: 3
  type: order
  stem: เรียงคำเป็นประโยค "น้องชายว่ายน้ำเร็วมาก"
  items:
  - 弟弟
  - 游泳
  - 游得
  - 很快
  hints:
  - 'มีกรรม (泳) จึงซ้ำกริยา: 游泳 + 游得'
  - 得 ตามด้วยคำบอกระดับ
  solution: '**弟弟游泳游得很快。** Dìdi yóuyǒng yóu de hěn kuài.'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.complements-basic.p009
  topics:
  - chinese.grammar.complements-basic
  difficulty: 3
  type: mcq
  stem: '"เขาเขียนอักษรจีนสวย" (汉字 Hànzì = อักษรจีน, 漂亮 = สวย) ประโยคใดถูกต้อง'
  choices:
  - id: a
    text: 他写得汉字很漂亮。
    feedback: กรรมวางหลัง 得 ไม่ได้
  - id: b
    text: 他很漂亮写汉字。
    feedback: ประโยคนี้กลายเป็น "เขาสวย" และลำดับผิด
  - id: c
    text: 他汉字写得很漂亮。
    correct: true
    feedback: ถูก ยกกรรม 汉字 ไว้หน้ากริยา แล้ว กริยา + 得 + คำบอกระดับ
  - id: d
    text: 他写汉字得很漂亮。
    feedback: 得 ต้องติดหลังกริยา ไม่ใช่หลังกรรม
  hints:
  - กริยาหนึ่งตัวรับทั้งกรรมและ 得 ไม่ได้
  - ซ้ำกริยา (写汉字写得…) หรือยกกรรมขึ้นหน้า (汉字写得…)
  solution: '**他汉字写得很漂亮。** หรือ 他写汉字写得很漂亮。'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.complements-basic.p010
  topics:
  - chinese.grammar.complements-basic
  difficulty: 3
  type: text
  stem: ครูชี้ที่สมุดแล้วพูดว่า 这个字你写＿了，要改一下。 (เขียนผิด) เติมคำในช่องว่าง (พิมพ์อักษรจีน 1 ตัว)
  accepted:
  - 错
  - 错。
  - 错.
  - 错？
  - 错?
  - 錯
  - 錯。
  - 錯.
  - 錯？
  - 錯?
  misconceptions:
  - match: 完
    feedback: 写完 = เขียนเสร็จ แต่ครูบอกให้แก้ จึงเป็นเขียนผิด
  - match: 完。
    feedback: 写完 = เขียนเสร็จ แต่ครูบอกให้แก้ จึงเป็นเขียนผิด
  - match: 完？
    feedback: 写完 = เขียนเสร็จ แต่ครูบอกให้แก้ จึงเป็นเขียนผิด
  - match: 好
    feedback: 写好 = เขียนเสร็จเรียบร้อย ไม่ต้องแก้
  - match: 好。
    feedback: 写好 = เขียนเสร็จเรียบร้อย ไม่ต้องแก้
  - match: 好？
    feedback: 写好 = เขียนเสร็จเรียบร้อย ไม่ต้องแก้
  hints:
  - 改 gǎi = แก้
  - ผิด = 错 cuò
  solution: 这个字你写**错**了，要改一下。 (อักษรตัวนี้เขียนผิด ต้องแก้หน่อย)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.complements-basic.p011
  topics:
  - chinese.grammar.complements-basic
  difficulty: 3
  type: match
  stem: จับคู่ส่วนเติมเต็มความเป็นไปได้กับความหมาย
  pairs:
  - left: 看得懂
    right: อ่านออก
  - left: 看不懂
    right: อ่านไม่ออก
  - left: 买不到
    right: หาซื้อไม่ได้
  - left: 进不去
    right: เข้าไปไม่ได้
  hints:
  - 得 = ทำได้ 不 = ทำไม่ได้
  - 到 = บรรลุผล 进去 = เข้าไป
  solution: 看得懂 อ่านออก · 看不懂 อ่านไม่ออก · 买不到 หาซื้อไม่ได้ · 进不去 เข้าไปไม่ได้
