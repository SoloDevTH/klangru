problems:
- id: health.mental.resilience-identity.p001
  topics:
  - health.mental.resilience-identity
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็นจุดแข็งของตัวเองที่เราทำได้จริง
  choices:
  - id: a
    text: ฉันเป็นคนใจดีกับน้องเสมอ
    correct: true
  - id: b
    text: ฉันเก่งกว่าเพื่อนทุกคน
    feedback: การเปรียบเทียบกับคนอื่นไม่ใช่จุดแข็งที่ฝึกต่อได้โดยตรง
  - id: c
    text: ฉันไม่มีอะไรดีเลย
    feedback: ทุกคนมีสิ่งที่ทำได้ดีอยู่บ้าง แม้จะยังไม่เห็นชัดก็ตาม
  - id: d
    text: ฉันต้องเป็นให้เหมือนคนอื่นทุกอย่าง
    feedback: ตัวตนของเราไม่จำเป็นต้องเหมือนใคร
  hints:
  - จุดแข็งคือสิ่งที่เราทำได้ดีหรือภูมิใจ
  - ลองดูว่าข้อไหนพูดถึงตัวเองในทางที่ทำได้จริง ไม่ใช่การเปรียบเทียบกับคนอื่น
  solution: จุดแข็งที่ดีคือสิ่งที่เราทำได้จริงและฝึกต่อได้ เช่น การใจดีกับน้อง การเปรียบเทียบว่าเก่งกว่าใครไม่ได้ช่วยให้เรียนรู้ต่อ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.resilience-identity.p002
  topics:
  - health.mental.resilience-identity
  difficulty: 1
  type: match
  stem: จับคู่แต่ละอย่างกับส่วนที่ประกอบเป็นตัวตน
  pairs:
  - left: เชื่อว่าความซื่อสัตย์เป็นเรื่องสำคัญที่ต้องยึดไว้
    right: ค่านิยม
  - left: ชอบวาดรูปและเล่นดนตรี
    right: ความชอบ
  - left: ใจเย็นและฟังคนอื่นเก่ง
    right: คุณลักษณะส่วนตัว
  - left: เพื่อนที่คอยชวนให้พยายามต่อ
    right: คนรอบตัวที่มีอิทธิพลต่อตัวตน
  hints:
  - ค่านิยมคือสิ่งที่เรายึดถือว่าสำคัญ
  - คนรอบตัวที่คอยชวนให้พยายามต่อก็มีผลต่อตัวตนของเรา
  solution: เชื่อว่าความซื่อสัตย์สำคัญ = ค่านิยม, ชอบวาดรูปและเล่นดนตรี = ความชอบ, ใจเย็นและฟังคนอื่นเก่ง = คุณลักษณะส่วนตัว, เพื่อนที่คอยชวนให้พยายามต่อ = คนรอบตัวที่มีอิทธิพลต่อตัวตน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.resilience-identity.p003
  topics:
  - health.mental.resilience-identity
  difficulty: 1
  type: mcq
  stem: เพื่อนชมว่าวาดรูปสวยมาก คำชมนี้อาจมีผลต่อตัวตนของเราอย่างไร
  choices:
  - id: a
    text: ช่วยให้เรามองเห็นจุดแข็งด้านศิลปะของตัวเองมากขึ้น
    correct: true
  - id: b
    text: ทำให้เราไม่มีวันวาดรูปอีกเลย
    feedback: คำชมแบบนี้มักทำให้อยากพัฒนาต่อ ไม่ใช่หยุดทำ
  - id: c
    text: ไม่มีผลต่อตัวตนเลย
    feedback: คำพูดของคนรอบตัวมีอิทธิพลต่อตัวตนได้
  - id: d
    text: ทำให้เราหยุดฟังคนอื่น
    feedback: คำชมไม่ได้ทำให้เราเลิกฟังคนอื่น
  hints:
  - คำพูดของคนรอบตัวมีอิทธิพลต่อสิ่งที่เรารู้สึกว่าเราเป็น
  - ลองนึกว่าคำชมช่วยให้เรามองเห็นอะไรในตัวเอง
  solution: คำชมที่จริงใจช่วยให้เรามองเห็นจุดแข็งของตัวเอง และอาจสร้างตัวตนด้านศิลปะขึ้นมา
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.resilience-identity.p004
  topics:
  - health.mental.resilience-identity
  difficulty: 2
  type: mcq
  stem: ข้อใดเป็นปัจจัยปกป้องที่ช่วยให้คนกลับมายืนได้หลังเจอเรื่องยาก (เลือกได้หลายข้อ)
  multiple: true
  choices:
  - id: a
    text: มีผู้ใหญ่หรือเพื่อนที่ไว้ใจให้คำปรึกษา
    correct: true
  - id: b
    text: นอนหลับเพียงพอและดูแลตัวเอง
    correct: true
  - id: c
    text: มีความสามารถบางอย่างที่ภูมิใจ
    correct: true
  - id: d
    text: อยู่คนเดียวและไม่บอกใคร
    feedback: การเก็บทุกเรื่องไว้คนเดียวทำให้รับมือยากขึ้น
  - id: e
    text: หลีกเลี่ยงทุกเรื่องที่ยาก
    feedback: การหลีกเลี่ยงทำให้ไม่ได้ฝึกรับมือและปัญหาอาจค้างอยู่
  hints:
  - ปัจจัยปกป้องคือสิ่งที่ช่วยให้เราไม่ล้มลงไปไกลเมื่อเจอเรื่องยาก
  - การหลบคนอื่นหรือหลบทุกเรื่องไม่ช่วยให้เรากลับมายืนได้
  solution: ผู้ใหญ่หรือเพื่อนที่ไว้ใจ การนอนและการดูแลตัวเอง และความสามารถที่ภูมิใจ เป็นปัจจัยปกป้อง ส่วนการอยู่คนเดียวโดยไม่บอกใครและการหลีกเลี่ยงทุกเรื่องยากไม่ช่วย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.resilience-identity.p005
  topics:
  - health.mental.resilience-identity
  difficulty: 2
  type: numeric
  stem: เป้าหมายคืออ่านหนังสือให้ได้ 150 หน้าภายใน 3 สัปดาห์ (1 สัปดาห์มี 7 วัน) ต้องอ่านเฉลี่ยวันละกี่หน้า (ตอบทศนิยม 1 ตำแหน่ง)
  answer:
    value: 7.143
    tolerance: 0.05
    unit: หน้า
  misconceptions:
  - match: 50
    feedback: นั่นคือการหารด้วยจำนวนสัปดาห์ ต้องหารด้วยจำนวนวันทั้งหมดที่อ่าน
  - match: 21.4
    feedback: การหารด้วย 7 คือแบ่งให้แค่ 7 วัน แต่ระยะเวลาคือ 3 สัปดาห์ ต้องคิดเป็น 3 × 7 = 21 วันก่อน
  hints:
  - หาก่อนว่า 3 สัปดาห์มีกี่วัน
  - แบ่งจำนวนหน้าทั้งหมดด้วยจำนวนวันทั้งหมด
  solution: 3 สัปดาห์ = 3 × 7 = 21 วัน อ่านเฉลี่ยวันละ 150 ÷ 21 ≈ 7.1 หน้า (ในทางปฏิบัติอาจตั้งเป้าวันละ 7–8 หน้า)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.resilience-identity.p006
  topics:
  - health.mental.resilience-identity
  difficulty: 2
  type: text
  stem: ความสามารถในการกลับมาลุกขึ้นได้หลังเจอความล้มเหลวหรือเรื่องยาก เรียกว่าอะไร (ตอบเป็นคำ)
  accepted:
  - ความยืดหยุ่นทางใจ
  - ความยืดหยุ่น
  - resilience
  hints:
  - ลองนึกถึงคำที่มีคำว่า "ยืดหยุ่น"
  - คำนี้ใช้กับจิตใจ ไม่ได้หมายถึงร่างกาย
  solution: เรียกว่าความยืดหยุ่นทางใจ (resilience) ซึ่งเป็นทักษะที่ฝึกได้ ไม่ใช่สิ่งที่มีหรือไม่มีตั้งแต่เกิด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.resilience-identity.p007
  topics:
  - health.mental.resilience-identity
  difficulty: 2
  type: mcq
  stem: น้องสอบตกวิชาคณิตศาสตร์ แล้วพูดกับตัวเองว่า "ฉันโง่ ทำอะไรก็ไม่ได้" ข้อใดเป็นการพูดกับตัวเองที่ช่วยสร้างภาพลักษณ์เชิงบวกมากกว่า
  choices:
  - id: a
    text: ฉันยังไม่เข้าใจบทนี้ ฉันจะลองหาคนช่วยอธิบายดู
    correct: true
  - id: b
    text: ฉันสอบตกทุกวิชา ไม่มีใครเชื่อใจฉันแล้ว
    feedback: เป็นการเหมารวมจากเรื่องเดียว ทำให้ท้อแท้มากขึ้น
  - id: c
    text: ไม่เป็นไร ฉันไม่สนใจเรื่องนี้อีกแล้ว
    feedback: การเลิกสนใจอาจทำให้ไม่ได้แก้ปัญหาที่ยังค้างอยู่
  - id: d
    text: ฉันรู้ว่าฉันไม่มีวันเก่งเรื่องนี้
    feedback: ประโยคนี้ปิดทางไปต่อ และไม่เป็นความจริงจากผลครั้งเดียว
  hints:
  - ประโยคที่ดีไม่ได้ปิดกั้นตัวเอง และบอกได้ว่าควรทำอะไรต่อ
  - การเหมารวมทุกเรื่องว่าไม่ดีทำให้ท้อแท้มากขึ้น
  solution: ประโยคที่ยอมรับว่ายังไม่เข้าใจ และบอกว่าจะหาคนช่วย ทำให้เรามองเห็นทางไปต่อ ส่วนประโยคที่เหมารวมทำให้ท้อแท้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.resilience-identity.p008
  topics:
  - health.mental.resilience-identity
  difficulty: 3
  type: order
  stem: เรียงขั้นตอนรับมือเมื่อย้ายไปโรงเรียนใหม่ (จากขั้นแรกไปขั้นสุดท้าย)
  items:
  - ลองนึกว่าตัวเองรู้สึกอะไรบ้างและอะไรทำให้กังวล
  - หาข้อมูลโรงเรียนใหม่ เช่น ตารางเรียน กิจกรรม และวิธีเดินทาง
  - วางแผนว่าวันแรกจะทำอะไร เช่น แนะนำตัวกับเพื่อน 1 คน
  - แบ่งเป้าหมายเป็นขั้นย่อย เช่น สัปดาห์ละ 1 เพื่อนใหม่
  - ประเมินว่าวิธีไหนได้ผลและปรับแผนต่อ
  hints:
  - เริ่มจากการรู้ว่าตัวเองรู้สึกอะไรก่อน
  - ขั้นสุดท้ายคือการดูว่าวิธีไหนได้ผลแล้วปรับแผน
  solution: รู้ว่าตัวเองรู้สึกอะไร หาข้อมูลโรงเรียนใหม่ วางแผนวันแรก แบ่งเป้าหมายย่อย แล้วประเมินและปรับแผนเมื่อเห็นผล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.resilience-identity.p009
  topics:
  - health.mental.resilience-identity
  difficulty: 3
  type: numeric
  stem: กลยุทธ์ A ได้ผล 6 ใน 8 ครั้ง ส่วนกลยุทธ์ B ได้ผล 14 ใน 20 ครั้ง กลยุทธ์ B ได้ผลกี่เปอร์เซ็นต์ (ตอบเป็นเปอร์เซ็นต์)
  answer:
    value: 70
    tolerance: 0.01
    unit: '%'
  misconceptions:
  - match: 14
    feedback: นั่นคือจำนวนครั้งที่ได้ผล ยังไม่ได้เทียบกับจำนวนครั้งทั้งหมดเป็นร้อยละ
  - match: 20
    feedback: นั่นคือจำนวนครั้งทั้งหมด ต้องใช้หารแล้วคูณ 100
  hints:
  - ให้หาร จำนวนครั้งที่ได้ผลด้วยจำนวนครั้งทั้งหมดก่อน แล้วคูณ 100
  - อย่าเทียบจำนวนครั้งที่ได้ผลโดยไม่ดูจำนวนครั้งทั้งหมด
  solution: กลยุทธ์ B ได้ผล 14 ÷ 20 × 100 = 70% ต่ำกว่ากลยุทธ์ A ที่ได้ผล 6 ÷ 8 × 100 = 75% แม้ B จะได้ผลหลายครั้งกว่า (14 > 6)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.resilience-identity.p010
  topics:
  - health.mental.resilience-identity
  difficulty: 3
  type: mcq
  stem: เพื่อนสนิทต้องย้ายบ้านไปไกล เราจะช่วยให้เพื่อนรู้สึกได้รับการสนับสนุนได้อย่างไร
  choices:
  - id: a
    text: ฟังความรู้สึกของเพื่อนโดยไม่ตัดสิน และชวนคุยกันต่อเป็นระยะ
    correct: true
  - id: b
    text: บอกเพื่อนว่าไม่ต้องเสียใจ เดี๋ยวก็ลืมเอง
    feedback: การบอกให้ไม่รู้สึกทำให้เพื่อนไม่กล้าเล่าความรู้สึก
  - id: c
    text: ไม่พูดถึงเรื่องนี้เลยเพราะกลัวทำให้เพื่อนเศร้า
    feedback: เพื่อนอาจรู้สึกว่าไม่มีใครเข้าใจ
  - id: d
    text: ขอให้เพื่อนเลิกคุยเรื่องนี้
    feedback: การปิดการพูดคุยไม่ได้ช่วยให้เพื่อนผ่านช่วงนี้ไปได้
  hints:
  - การรับฟังสำคัญกว่าการพยายามแก้ทุกอย่างให้เรียบร้อย
  - การทิ้งช่วงเรื่องนี้ไปเลยอาจทำให้เพื่อนรู้สึกว่าไม่มีใครเข้าใจ
  solution: การรับฟังโดยไม่ตัดสิน และติดต่อกันเป็นระยะ ช่วยให้เพื่อนรู้สึกว่ายังมีคนอยู่เคียงข้าง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.resilience-identity.p011
  topics:
  - health.mental.resilience-identity
  difficulty: 3
  type: mcq
  stem: ข้อใดเป็นตัวอย่างของความล้มเหลวที่นำไปสู่การเรียนรู้ได้
  choices:
  - id: a
    text: ทดสอบแล้วได้คะแนนน้อย จึงดูว่าข้อไหนผิดบ่อยและฝึกเพิ่มเฉพาะส่วนนั้น
    correct: true
  - id: b
    text: ทดสอบแล้วไม่ดูผลและไม่เปิดสมุดอีกเลย
    feedback: การไม่ดูผลทำให้ไม่รู้ว่าต้องปรับตรงไหน
  - id: c
    text: สรุปว่าตัวเองไม่มีความสามารถในวิชานี้
    feedback: ผลครั้งเดียวไม่ได้บอกความสามารถทั้งหมดของเรา
  - id: d
    text: หลีกเลี่ยงการทดสอบครั้งต่อไป
    feedback: การหลีกเลี่ยงทำให้ไม่ได้ฝึกรับมือ
  hints:
  - ลองดูว่าผลที่ได้บอกอะไรเราบ้าง
  - การหยุดดูผลหรือสรุปว่าตัวเองไม่มีความสามารถไม่ช่วยให้เรียนรู้
  solution: การดูว่าข้อไหนผิดบ่อยแล้วฝึกเพิ่มเฉพาะส่วนนั้นคือการใช้ความล้มเหลวเป็นข้อมูลเพื่อปรับปรุง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.resilience-identity.p012
  topics:
  - health.mental.resilience-identity
  difficulty: 4
  type: mcq
  stem: ข้อใดอธิบายความหมายของตัวตน (identity) ได้ถูกต้องที่สุด
  choices:
  - id: a
    text: การประกอบจากหลายด้าน เช่น ค่านิยม ความชอบ และความสัมพันธ์ ซึ่งเปลี่ยนแปลงได้ตามประสบการณ์
    correct: true
  - id: b
    text: ตัวตนถูกกำหนดตั้งแต่เกิดและเปลี่ยนไม่ได้
