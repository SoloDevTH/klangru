    coverage: partial
    note: สอนส่วน วรรณยุกต์ (รูป 4 รูป ตำแหน่งที่วาง รูปกับเสียง) และ เลขไทย (๐–๙ จำนวนหลายหลัก) ครบ ส่วนพยัญชนะและสระอยู่ที่ thai.writing.consonants และ thai.writing.vowels ผู้เรียนพิมพ์เลขไทยได้ แต่การเขียนด้วยมือตรวจในแอปไม่ได้
  - topic: thai.writing.vowels
    indicators: [ท 4.1 ป.1/1, ท 4.1 ป.2/1]
    coverage: partial
    note: หัวข้อนี้สอนส่วน สระ ของตัวชี้วัดครบ (รูปสระ 21 รูป สระ 32 ตัว สั้น/ยาว ตำแหน่ง เปลี่ยนรูป/ลดรูป อ่านและเขียนพยางค์) ส่วนพยัญชนะอยู่ที่ thai.writing.consonants วรรณยุกต์และเลขไทยอยู่ที่ thai.writing.tone-marks-numerals และการเขียนด้วยมือจริงตรวจในแอปไม่ได้
