problems:
  - id: math.algebra.radicals.p001
    topics: [math.algebra.radicals]
    difficulty: 1
    type: mcq
    stem: "$\\sqrt{20}$ ในรูปอย่างง่ายคือข้อใด"
    choices:
      - { id: a, text: "$2\\sqrt5$", correct: true }
      - { id: b, text: "$4\\sqrt5$", feedback: "ดึง 4 ออกมาจากรากแต่ลืมถอดราก $\\sqrt4 = 2$" }
      - { id: c, text: "$5\\sqrt2$", feedback: "$5\\sqrt2 = \\sqrt{50}$ ไม่ใช่ $\\sqrt{20}$ ต้องแยก $20 = 4 \\times 5$" }
      - { id: d, text: "$10\\sqrt2$", feedback: "แยก $20 = 10 \\times 2$ แต่ 10 ไม่ใช่กำลังสองสมบูรณ์ จึงดึงออกจากรากไม่ได้" }
    hints:
      - "หากำลังสองสมบูรณ์ที่ใหญ่ที่สุดที่หาร 20 ลงตัว"
      - "$20 = 4 \\times 5$ แล้วใช้ $\\sqrt{ab} = \\sqrt a\\sqrt b$"
    solution: "$\\sqrt{20} = \\sqrt{4 \\times 5} = \\sqrt4 \\times \\sqrt5 = 2\\sqrt5$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.radicals.p002
    topics: [math.algebra.radicals]
    difficulty: 2
    type: expression
    simplified: true
    stem: "จงเขียน $\\sqrt{75}$ ในรูปอย่างง่าย"
    answer: { latex: "5\\sqrt{3}", variables: [] }
    hints:
      - "75 หารด้วยกำลังสองสมบูรณ์ใดลงตัว"
      - "$75 = 25 \\times 3$"
    misconceptions:
      - { match: "25\\sqrt{3}", feedback: "ดึง 25 ออกจากรากแต่ลืมถอดราก $\\sqrt{25} = 5$" }
      - { match: "3\\sqrt{5}", feedback: "สลับตัวเลข $3\\sqrt5 = \\sqrt{45}$ ไม่ใช่ $\\sqrt{75}$" }
    solution: "$\\sqrt{75} = \\sqrt{25 \\times 3} = 5\\sqrt3$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.radicals.p003
    topics: [math.algebra.radicals]
    difficulty: 2
    type: expression
    simplified: true
    stem: "จงหาค่า $4\\sqrt3 + 7\\sqrt3$ ในรูปอย่างง่าย"
    answer: { latex: "11\\sqrt{3}", variables: [] }
    hints:
      - "$\\sqrt3$ เป็นพจน์คล้ายเหมือน $x$"
      - "$4x + 7x = 11x$"
    misconceptions:
      - { match: "11\\sqrt{6}", feedback: "บวกจำนวนใต้รากด้วย แต่ $\\sqrt3$ เป็นตัวร่วม ไม่ต้องบวก (เหมือน $4x + 7x = 11x$)" }
      - { match: "28\\sqrt{3}", feedback: "คูณสัมประสิทธิ์ $4 \\times 7$ แต่โจทย์ให้บวก" }
    solution: "$4\\sqrt3 + 7\\sqrt3 = (4 + 7)\\sqrt3 = 11\\sqrt3$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.radicals.p004
    topics: [math.algebra.radicals]
    difficulty: 2
    type: expression
    simplified: true
    stem: "จงหาค่า $\\sqrt{12} + \\sqrt{75}$ ในรูปอย่างง่าย"
    answer: { latex: "7\\sqrt{3}", variables: [] }
    hints:
      - "ทำแต่ละรากให้อยู่ในรูปอย่างง่ายก่อน"
      - "$\\sqrt{12} = 2\\sqrt3$ และ $\\sqrt{75} = 5\\sqrt3$"
    misconceptions:
      - { match: "\\sqrt{87}", feedback: "บวกใต้รากเลย แต่ $\\sqrt a + \\sqrt b \\ne \\sqrt{a + b}$" }
      - { match: "29\\sqrt{3}", feedback: "ดึง 4 และ 25 ออกจากรากโดยลืมถอดราก $\\sqrt4 = 2$, $\\sqrt{25} = 5$" }
    solution: "$\\sqrt{12} + \\sqrt{75} = 2\\sqrt3 + 5\\sqrt3 = 7\\sqrt3$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.radicals.p005
    topics: [math.algebra.radicals]
    difficulty: 2
    type: numeric
    stem: "จงหาค่าของ $|-7| + |3 - 5|$"
    answer: { value: 9 }
    hints:
      - "ค่าสัมบูรณ์คือระยะจาก 0 จึงไม่เป็นลบ"
      - "หาค่าในเครื่องหมายค่าสัมบูรณ์ก่อน $3 - 5 = -2$"
    misconceptions:
      - { match: 5, feedback: "ใช้ $|3 - 5| = -2$ แต่ค่าสัมบูรณ์ไม่เป็นลบ $|-2| = 2$" }
      - { match: -9, feedback: "ค่าสัมบูรณ์ไม่เป็นลบ $|-7| = 7$" }
    solution: "$|-7| + |3 - 5| = 7 + |-2| = 7 + 2 = 9$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.radicals.p006
    topics: [math.algebra.radicals]
    difficulty: 2
    type: numeric
    stem: "อุณหภูมิบนยอดดอยอินทนนท์ตอนเช้ามืดวันหนึ่งเป็น $-2$ องศาเซลเซียส ตอนบ่ายเป็น $15$ องศาเซลเซียส อุณหภูมิต่างกันกี่องศาเซลเซียส"
    answer: { value: 17, unit: °C }
    hints:
      - "ผลต่างคือระยะระหว่างสองจำนวนบนเส้นจำนวน $|a - b|$"
      - "$|15 - (-2)|$"
    misconceptions:
      - { match: 13, feedback: "ลบ $15 - 2$ แต่อุณหภูมิตอนเช้าติดลบ ต้องเป็น $15 - (-2)$" }
      - { match: -17, feedback: "คิด $-2 - 15$ แต่ผลต่างเป็นระยะทางจึงไม่เป็นลบ ใช้ค่าสัมบูรณ์" }
    solution: "$|15 - (-2)| = |17| = 17$ องศาเซลเซียส (จาก $-2$ ขึ้นไป 0 ได้ 2 องศา แล้วขึ้นต่อถึง 15 อีก 15 องศา)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.radicals.p007
    topics: [math.algebra.radicals]
    difficulty: 3
    type: expression
    simplified: true
    stem: "จงหาค่า $\\sqrt{10} \\times \\sqrt{15}$ ในรูปอย่างง่าย"
    answer: { latex: "5\\sqrt{6}", variables: [] }
    hints:
      - "$\\sqrt a \\times \\sqrt b = \\sqrt{ab}$"
      - "$\\sqrt{150}$ แล้วแยก $150 = 25 \\times 6$"
    misconceptions:
      - { match: "25\\sqrt{6}", feedback: "ดึง 25 ออกจากรากแต่ลืมถอดราก $\\sqrt{25} = 5$" }
      - { match: "5", feedback: "บวกจำนวนใต้รากได้ $\\sqrt{25}$ แต่โจทย์ให้คูณ" }
    solution: "$\\sqrt{10} \\times \\sqrt{15} = \\sqrt{150} = \\sqrt{25 \\times 6} = 5\\sqrt6$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.radicals.p008
    topics: [math.algebra.radicals]
    difficulty: 3
    type: expression
    simplified: true
    stem: "จงทำ $\\dfrac{10}{\\sqrt5}$ ให้ตัวส่วนไม่ติดกรณฑ์และอยู่ในรูปอย่างง่าย"
    answer: { latex: "2\\sqrt{5}", variables: [] }
    hints:
      - "คูณทั้งเศษและส่วนด้วย $\\sqrt5$"
      - "$\\sqrt5 \\times \\sqrt5 = 5$ แล้วตัดทอนเศษส่วน"
    misconceptions:
      - { match: "10\\sqrt{5}", feedback: "คูณเศษด้วย $\\sqrt5$ แล้วลืมว่าส่วนกลายเป็น 5 ต้องหารด้วย 5" }
      - { match: "2", feedback: "หาร 10 ด้วย 5 แต่ลืม $\\sqrt5$ ที่เศษ" }
    solution: "$\\dfrac{10}{\\sqrt5} \\times \\dfrac{\\sqrt5}{\\sqrt5} = \\dfrac{10\\sqrt5}{5} = 2\\sqrt5$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.radicals.p009
    topics: [math.algebra.radicals]
    difficulty: 3
    type: numeric
    stem: "จงหาค่าของ $(2 + \\sqrt3)(2 - \\sqrt3)$"
    answer: { value: 1 }
    hints:
      - "ใช้ $(a + b)(a - b) = a^2 - b^2$"
      - "$(\\sqrt3)^2 = 3$"
    misconceptions:
      - { match: 7, feedback: "บวก $4 + 3$ แต่ผลต่างกำลังสองต้องลบ $a^2 - b^2$" }
      - { match: -5, feedback: "ใช้ $(\\sqrt3)^2 = 9$ แต่ $(\\sqrt3)^2 = 3$" }
    solution: "$(2 + \\sqrt3)(2 - \\sqrt3) = 2^2 - (\\sqrt3)^2 = 4 - 3 = 1$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.radicals.p010
    topics: [math.algebra.radicals]
    difficulty: 3
    type: mcq
    stem: "จำนวนใดเป็นจำนวนอตรรกยะ"
    choices:
      - { id: a, text: "$2 + \\sqrt3$", correct: true }
      - { id: b, text: "$\\sqrt3 \\times \\sqrt{12}$", feedback: "$\\sqrt3 \\times \\sqrt{12} = \\sqrt{36} = 6$ เป็นจำนวนตรรกยะ ผลคูณของอตรรกยะสองจำนวนอาจเป็นตรรกยะได้" }
      - { id: c, text: "$(\\sqrt5)^2$", feedback: "$(\\sqrt5)^2 = 5$ เป็นจำนวนตรรกยะ" }
      - { id: d, text: "$\\dfrac{\\sqrt{12}}{\\sqrt3}$", feedback: "$\\sqrt{\\tfrac{12}{3}} = \\sqrt4 = 2$ เป็นจำนวนตรรกยะ" }
    hints:
      - "หาค่าของแต่ละข้อให้อยู่ในรูปอย่างง่ายก่อน"
      - "ตรรกยะบวกอตรรกยะได้อตรรกยะเสมอ"
    solution: "2 เป็นตรรกยะ $\\sqrt3$ เป็นอตรรกยะ ผลบวกจึงเป็นอตรรกยะ ข้ออื่นได้ 6, 5, 2 ซึ่งเป็นตรรกยะ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.radicals.p011
    topics: [math.algebra.radicals]
    difficulty: 3
    type: match
    stem: "จับคู่ตัวอย่างกับสมบัติของจำนวนจริง"
    pairs:
      - { left: "$\\sqrt2 + \\sqrt5 = \\sqrt5 + \\sqrt2$", right: "การสลับที่ของการบวก" }
      - { left: "$\\sqrt3(2 + \\sqrt3) = 2\\sqrt3 + 3$", right: "การแจกแจง" }
      - { left: "$\\sqrt7 + (-\\sqrt7) = 0$", right: "ตัวผกผันการบวก" }
      - { left: "$\\sqrt2 \\times \\tfrac{1}{\\sqrt2} = 1$", right: "ตัวผกผันการคูณ" }
      - { left: "$(\\sqrt2 \\times 3) \\times 5 = \\sqrt2 \\times (3 \\times 5)$", right: "การเปลี่ยนกลุ่มของการคูณ" }
    hints:
      - "ตัวผกผันทำให้ได้เอกลักษณ์ (0 สำหรับการบวก 1 สำหรับการคูณ)"
      - "การแจกแจงคือคูณเข้าไปในวงเล็บ"
    solution: "สลับที่คือเปลี่ยนลำดับ แจกแจงคือคูณเข้าวงเล็บ ตัวผกผันการบวกได้ 0 ตัวผกผันการคูณได้ 1 เปลี่ยนกลุ่มคือย้ายวงเล็บ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.radicals.p012
    topics: [math.algebra.radicals]
    difficulty: 4
    type: expression
    simplified: true
    stem: "จงทำ $\\dfrac{6}{\\sqrt7 - 2}$ ให้ตัวส่วนไม่ติดกรณฑ์และอยู่ในรูปอย่างง่าย"
    answer: { latex: "2\\sqrt{7}+4", variables: [] }
    hints:
      - "คูณทั้งเศษและส่วนด้วยสังยุค $\\sqrt7 + 2$"
      - "ส่วนกลายเป็น $(\\sqrt7)^2 - 2^2 = 3$"
    misconceptions:
      - { match: "2\\sqrt{7}-4", feedback: "เครื่องหมายผิด คูณด้วยสังยุค $\\sqrt7 + 2$ เศษจึงเป็น $6(\\sqrt7 + 2)$" }
      - { match: "6\\sqrt{7}+12", feedback: "ลืมหารด้วยส่วน $7 - 4 = 3$" }
    solution: "$\\dfrac{6}{\\sqrt7 - 2} \\times \\dfrac{\\sqrt7 + 2}{\\sqrt7 + 2} = \\dfrac{6(\\sqrt7 + 2)}{7 - 4} = 2(\\sqrt7 + 2) = 2\\sqrt7 + 4$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.radicals.p013
    topics: [math.algebra.radicals]
    difficulty: 4
    type: order
    stem: "เรียงจำนวนจากน้อยไปมาก"
    items:
      - "$\\sqrt[6]{7}$"
      - "$\\sqrt2$"
      - "$\\sqrt[3]{3}$"
      - "$\\sqrt[4]{5}$"
    hints:
      - "ทำให้เป็นรากอันดับเดียวกัน ค.ร.น. ของ 6, 2, 3, 4 คือ 12"
      - "ยกกำลัง 12 ทุกจำนวน: $7^2$, $2^6$, $3^4$, $5^3$"
    solution: "ยกกำลัง 12: $(\\sqrt[6]7)^{12} = 49$, $(\\sqrt2)^{12} = 64$, $(\\sqrt[3]3)^{12} = 81$, $(\\sqrt[4]5)^{12} = 125$ จึงเรียงได้ $\\sqrt[6]7 < \\sqrt2 < \\sqrt[3]3 < \\sqrt[4]5$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.radicals.p014
    topics: [math.algebra.radicals]
    difficulty: 4
    type: expression
    simplified: true
    stem: "ให้ $x > 0$ จงเขียน $\\sqrt{12x^3}$ ในรูปอย่างง่าย"
    answer: { latex: "2x\\sqrt{3x}", variables: [x] }
    hints:
      - "แยกตัวที่เป็นกำลังสอง: $12x^3 = 4x^2 \\times 3x$"
      - "$\\sqrt{4x^2} = 2x$ เมื่อ $x > 0$"
    misconceptions:
      - { match: "2x^2\\sqrt{3x}", feedback: "$\\sqrt{x^2} = x$ ไม่ใช่ $x^2$" }
      - { match: "4x\\sqrt{3x}", feedback: "ลืมถอดราก $\\sqrt4 = 2$" }
    solution: "$\\sqrt{12x^3} = \\sqrt{4x^2 \\cdot 3x} = 2x\\sqrt{3x}$ (ใช้ได้เพราะ $x > 0$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.radicals.p015
    topics: [math.algebra.radicals]
    difficulty: 4
    type: numeric
    stem: "ถนนสายหนึ่งเป็นเส้นตรง ให้ตลาดอยู่ที่ตำแหน่ง 0 บ้านของต้นอยู่ที่ตำแหน่ง $-4$ กิโลเมตร (ทางตะวันตกของตลาด) และโรงเรียนอยู่ที่ตำแหน่ง $7$ กิโลเมตร บ้านกับโรงเรียนห่างกันกี่กิโลเมตร"
    answer: { value: 11, unit: กม. }
    hints:
      - "ระยะระหว่าง $a$ กับ $b$ คือ $|a - b|$"
      - "$|7 - (-4)|$"
    misconceptions:
      - { match: 3, feedback: "คิด $7 - 4$ แต่จุดหนึ่งอยู่ที่ $-4$ ต้องเป็น $7 - (-4)$" }
      - { match: -11, feedback: "ระยะทางไม่เป็นลบ ใช้ค่าสัมบูรณ์ $|-4 - 7| = 11$" }
    solution: "$|7 - (-4)| = |11| = 11$ กิโลเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.radicals.p016
    topics: [math.algebra.radicals]
    difficulty: 4
    type: mcq
    stem: "ข้อใดเป็นจริงสำหรับจำนวนจริง $a$ และ $b$ ทุกจำนวน"
    choices:
      - { id: a, text: "$|ab| = |a||b|$", correct: true }
      - { id: b, text: "$|a + b| = |a| + |b|$", feedback: "ไม่จริงเมื่อเครื่องหมายต่างกัน เช่น $|3 + (-5)| = 2$ แต่ $|3| + |-5| = 8$" }
      - { id: c, text: "$\\sqrt{a^2} = a$", feedback: "ไม่จริงเมื่อ $a < 0$ เช่น $\\sqrt{(-5)^2} = 5 \\ne -5$ ที่ถูกคือ $\\sqrt{a^2} = |a|$" }
      - { id: d, text: "$|a - b| = |a| - |b|$", feedback: "ไม่จริง เช่น $a = 1, b = 4$: $|1 - 4| = 3$ แต่ $|1| - |4| = -3$" }
    hints:
      - "ลองแทนตัวอย่างที่ $a$ หรือ $b$ เป็นลบ"
      - "หาตัวอย่างค้านของแต่ละข้อ"
    solution: "$|ab| = |a||b|$ จริงเสมอ เพราะขนาดของผลคูณเท่ากับผลคูณของขนาด ข้ออื่นมีตัวอย่างค้าน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.radicals.p017
    topics: [math.algebra.radicals]
    difficulty: 4
    type: expression
    simplified: true
    stem: "ที่ดินรูปสี่เหลี่ยมจัตุรัสมีพื้นที่ 98 ตารางวา ด้านยาวกี่วา (ตอบในรูปกรณฑ์อย่างง่าย)"
    answer: { latex: "7\\sqrt{2}", variables: [] }
    hints:
      - "ด้านยาว $= \\sqrt{\\text{พื้นที่}}$"
      - "$98 = 49 \\times 2$"
    misconceptions:
      - { match: "49\\sqrt{2}", feedback: "ลืมถอดราก $\\sqrt{49} = 7$" }
      - { match: "24.5", feedback: "หารพื้นที่ด้วย 4 (คิดว่าเป็นความยาวรอบรูป) แต่ด้านของสี่เหลี่ยมจัตุรัสคือรากที่สองของพื้นที่" }
    solution: "ด้านยาว $\\sqrt{98} = \\sqrt{49 \\times 2} = 7\\sqrt2 \\approx 9.90$ วา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.radicals.p018
    topics: [math.algebra.radicals]
    difficulty: 5
    type: expression
    simplified: true
    stem: "จงกระจาย $(\\sqrt5 + \\sqrt3)^2$ ให้อยู่ในรูปอย่างง่าย"
    answer: { latex: "8+2\\sqrt{15}", variables: [] }
    hints:
      - "$(a + b)^2 = a^2 + 2ab + b^2$"
      - "$2\\sqrt5\\sqrt3 = 2\\sqrt{15}$"
    misconceptions:
      - { match: "8", feedback: "ลืมพจน์กลาง $2ab$ $(a + b)^2 \\ne a^2 + b^2$" }
      - { match: "8+\\sqrt{15}", feedback: "พจน์กลางต้องเป็น $2ab = 2\\sqrt{15}$ ไม่ใช่ $\\sqrt{15}$" }
    solution: "$(\\sqrt5 + \\sqrt3)^2 = 5 + 2\\sqrt5\\sqrt3 + 3 = 8 + 2\\sqrt{15}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.radicals.p019
    topics: [math.algebra.radicals]
    difficulty: 5
    type: expression
    simplified: true
    stem: "จงทำ $\\dfrac{\\sqrt3 + 1}{\\sqrt3 - 1}$ ให้ตัวส่วนไม่ติดกรณฑ์และอยู่ในรูปอย่างง่าย"
    answer: { latex: "2+\\sqrt{3}", variables: [] }
    hints:
      - "คูณทั้งเศษและส่วนด้วย $\\sqrt3 + 1$"
      - "เศษเป็น $(\\sqrt3 + 1)^2 = 4 + 2\\sqrt3$ ส่วนเป็น $3 - 1$"
    misconceptions:
      - { match: "1+\\frac{\\sqrt{3}}{2}", feedback: "ส่วนคือ $(\\sqrt3)^2 - 1^2 = 2$ ไม่ใช่ $3 + 1 = 4$" }
      - { match: "4+2\\sqrt{3}", feedback: "ลืมหารด้วยส่วน $3 - 1 = 2$" }
    solution: "$\\dfrac{(\\sqrt3 + 1)^2}{(\\sqrt3)^2 - 1} = \\dfrac{4 + 2\\sqrt3}{2} = 2 + \\sqrt3$"
