topics:
  # ---------- ฟิสิกส์: กลศาสตร์ ----------
  # ลำดับ 3
  - id: physics.units.estimation-problem-solving
    title: ขนาดของสิ่งต่าง ๆ การประมาณแบบแฟร์มี และกลยุทธ์แก้โจทย์ฟิสิกส์
    difficulty: 3.5
    prereq: [physics.units.si, physics.units.measurement, physics.units.experiments-graphs]
    indicators:
      - university-foundations:UPHYS1 1.1
      - university-foundations:UPHYS1 1.5
      - university-foundations:UPHYS1 1.7
    scope: >-
      ช่วงขนาดของความยาว มวล และเวลาในธรรมชาติตั้งแต่นิวเคลียสถึงเอกภาพ อันดับขนาด (order of magnitude) และการปัดเป็นกำลังของสิบ
      แบบจำลองและทฤษฎีกับขอบเขตที่ใช้ได้ การประมาณแบบแฟร์มี แตกคำถามใหญ่เป็นปริมาณย่อยที่ประมาณได้ เช่น จำนวนเม็ดข้าวที่คนไทยกินต่อปี
      หรือปริมาตรน้ำในสระ แล้วตรวจว่าคำตอบสมเหตุสมผล กลยุทธ์แก้โจทย์สามขั้น (วางกลยุทธ์ วาดรูปและระบุตัวแปร แก้สมการแบบสัญลักษณ์ก่อนแทนค่า)
      และการตรวจคำตอบด้วยหน่วย อันดับขนาด และกรณีสุดขั้ว
  # ลำดับ 3
  - id: physics.kinematics.relative-velocity
    title: ความเร็วสัมพัทธ์ในหนึ่งและสองมิติ
    difficulty: 5.5
    prereq: [physics.units.vectors, physics.kinematics.velocity]
    indicators:
      - university-foundations:UPHYS1 4.5
    scope: >-
      กรอบอ้างอิงและการบอกตำแหน่งกับความเร็วเทียบกรอบต่าง ๆ สูตรรวมความเร็ว v_PA = v_PB + v_BA แบบเวกเตอร์ ทบทวนกรณีหนึ่งมิติ
      แล้วขยายเป็นสองมิติ เรือข้ามแม่น้ำ (เล็งหัวเรือเพื่อไปตรงฝั่งหรือเพื่อใช้เวลาน้อยที่สุด) เครื่องบินบินในลมขวาง ฝนตกเฉียงเมื่อมองจากรถ
      และความเร่งเท่ากันในทุกกรอบที่เคลื่อนที่ด้วยความเร็วคงตัวเทียบกัน
  # ลำดับ 3
  - id: physics.dynamics.drag-force
    title: แรงต้านของของไหลและความเร็วปลาย
    difficulty: 6
    prereq: [physics.kinematics.free-fall, physics.dynamics.newton-second, math.functions.exponential]
    indicators:
      - university-foundations:UPHYS1 6.4
    scope: >-
      แรงต้านเมื่อวัตถุเคลื่อนที่ในอากาศหรือน้ำ สมการแรงต้านแบบกำลังสอง F_D = ½CρAv² สัมประสิทธิ์แรงต้าน และพื้นที่หน้าตัด
      ความเร็วปลาย v_t = √(2mg/CρA) ของนักดิ่งพสุธาก่อนและหลังกางร่ม แรงต้านแบบเชิงเส้นของวัตถุเล็กในของเหลวหนืด (กฎของสโตกส์)
      ความเร็วตามเวลา v(t) = v_t(1 − e^(−t/τ)) ของแรงต้านเชิงเส้นและความหมายของ τ และการออกแบบรถยนต์ให้ลดแรงต้านเพื่อประหยัดพลังงาน
  # ลำดับ 2
  - id: physics.energy.potential-energy-diagrams
    title: แรงอนุรักษ์ แรงไม่อนุรักษ์ และกราฟพลังงานศักย์
    difficulty: 7
    prereq: [physics.energy.conservation, physics.energy.variable-force-work, math.calculus.derivative]
    indicators:
      - university-foundations:UPHYS1 8.2
      - university-foundations:UPHYS1 8.4
    scope: >-
      แรงอนุรักษ์คือแรงที่งานไม่ขึ้นกับเส้นทางและงานรอบวงปิดเป็นศูนย์ (แรงโน้มถ่วง แรงสปริง) แรงเสียดทานเป็นแรงไม่อนุรักษ์
      นิยามพลังงานศักย์จากงานของแรงอนุรักษ์ ΔU = −W และหาแรงจากพลังงานศักย์ F = −dU/dx กราฟ U(x) อ่านจุดวกกลับจากพลังงานรวม
      บริเวณที่วัตถุเคลื่อนที่ได้ จุดสมดุลเสถียร ไม่เสถียร และสะเทิน จากความโค้งของกราฟ การแกว่งเล็ก ๆ รอบจุดต่ำสุด
      และงานของแรงไม่อนุรักษ์เท่ากับการเปลี่ยนพลังงานกล
  # ลำดับ 2
  - id: physics.momentum.collisions-2d-rockets
    title: การชนในสองมิติและการขับเคลื่อนของจรวด
    difficulty: 7.5
    prereq: [physics.momentum.collisions, physics.units.vectors, math.calculus.definite-integral]
    indicators:
      - university-foundations:UPHYS1 9.5
      - university-foundations:UPHYS1 9.7
    scope: >-
      อนุรักษ์โมเมนตัมแยกองค์ประกอบ x และ y ในการชนสองมิติ ลูกสนุกเกอร์ชนเฉียง การชนแบบติดกันที่สี่แยก และการชนยืดหยุ่นของมวลเท่ากัน
      ที่ลูกทั้งสองแยกตั้งฉากกัน ระบบที่มวลเปลี่ยน การหาสมการจรวดของซีออลคอฟสกี Δv = u ln(m₀/m) ด้วยการอินทิเกรต แรงขับ = u|dm/dt|
      จรวดที่ต้องต้านแรงโน้มถ่วงขณะขึ้นจากพื้น และเหตุผลที่จรวดใช้หลายท่อน
  # ลำดับ 2
  - id: physics.rotation.rotational-kinematics-inertia
    title: จลนศาสตร์การหมุน โมเมนต์ความเฉื่อยจากปริพันธ์ งานของการหมุน และลูกตุ้มฟิสิคัล
    difficulty: 8
    prereq: [physics.rotation.rotational-dynamics, math.calculus.integral-applications, physics.waves.shm]
    indicators:
      - university-foundations:UPHYS1 10.2
      - university-foundations:UPHYS1 10.5
      - university-foundations:UPHYS1 10.8
      - university-foundations:UPHYS1 15.4
    scope: >-
      สมการการหมุนด้วยความเร่งเชิงมุมคงตัว (ω = ω₀ + αt, θ = ω₀t + ½αt², ω² = ω₀² + 2αθ) เทียบกับการเคลื่อนที่แนวตรง
      หาโมเมนต์ความเฉื่อย I = ∫r² dm ของแท่ง แผ่นกลม และวงแหวน ทฤษฎีบทแกนขนานและแกนตั้งฉาก งานของทอร์ก W = ∫τ dθ
      ทฤษฎีบทงาน–พลังงานของการหมุน และกำลัง P = τω เช่น มอเตอร์และเพลา ลูกตุ้มฟิสิคัล T = 2π√(I/mgd) และลูกตุ้มบิด T = 2π√(I/κ)
  # ลำดับ 2
  - id: physics.dynamics.gravitational-energy-orbits
    title: พลังงานศักย์โน้มถ่วง วงโคจร กฎของเคปเลอร์ แรงไทดัล และแนวคิดของไอน์สไตน์
    difficulty: 7.5
    prereq: [physics.dynamics.satellite-motion, physics.energy.conservation, math.calculus.definite-integral]
    indicators:
      - university-foundations:UPHYS1 13.3
      - university-foundations:UPHYS1 13.4
      - university-foundations:UPHYS1 13.5
      - university-foundations:UPHYS1 13.6
      - university-foundations:UPHYS1 13.7
    scope: >-
      พลังงานศักย์โน้มถ่วง U = −GMm/r จากการอินทิเกรต และเหตุที่ mgh เป็นค่าประมาณใกล้ผิวโลก อัตราเร็วหลุดพ้น พลังงานรวมของวงโคจรวงกลม
      E = −GMm/2r กับการย้ายวงโคจร กฎสามข้อของเคปเลอร์ วงรี จุดใกล้และไกลที่สุด กฎพื้นที่เท่ากันกับการอนุรักษ์โมเมนตัมเชิงมุม
      แรงไทดัลจากผลต่างของแรงโน้มถ่วงข้ามขนาดโลก น้ำเกิดน้ำตาย และการล็อกด้วยแรงไทดัล หลักความสมมูลและความโค้งของกาลอวกาศเชิงแนวคิด
      การเบนของแสง หลุมดำ รัศมีชวาร์ซชิลด์ และคลื่นความโน้มถ่วง
  # ---------- ฟิสิกส์: คลื่นและเสียง ----------
  # ลำดับ 2
  - id: physics.waves.wave-functions-energy
    title: ฟังก์ชันคลื่น อัตราเร็วคลื่นจากสมบัติตัวกลาง และพลังงานของคลื่น
    difficulty: 7.5
    prereq: [physics.waves.wave-basics, physics.waves.resonance-standing-waves, physics.waves.sound, math.calculus.differentiation-rules]
    indicators:
      - university-foundations:UPHYS1 16.2
      - university-foundations:UPHYS1 16.4
      - university-foundations:UPHYS1 17.2
    scope: >-
      ฟังก์ชันคลื่นรูปไซน์ y(x, t) = A sin(kx − ωt + φ) เลขคลื่น k ความถี่เชิงมุม ω และทิศการเคลื่อนที่จากเครื่องหมาย
      อัตราเร็วของอนุภาคในตัวกลาง ∂y/∂t เทียบกับอัตราเร็วคลื่น และสมการคลื่นเชิงเส้น อัตราเร็วคลื่นเสียง v = √(B/ρ) ในของไหล
      v = √(Y/ρ) ในแท่งของแข็ง และ v = √(γRT/M) ในแก๊สกับที่มาของสูตรประมาณ 331 + 0.6T พลังงานและกำลังเฉลี่ยของคลื่นในเส้นเชือก
      P = ½μωA²v และความเข้มของคลื่นทรงกลมที่ลดตาม 1/r²
  # ลำดับ 3
  - id: physics.waves.pipes-musical-sound
    title: โหมดปกติของท่อลมและเสียงของเครื่องดนตรี
    difficulty: 6
    prereq: [physics.waves.resonance-standing-waves, physics.waves.sound-properties]
    indicators:
      - university-foundations:UPHYS1 17.4
      - university-foundations:UPHYS1 17.5
    scope: >-
      คลื่นนิ่งของเสียงในท่อปลายเปิดสองด้านและปลายเปิดหนึ่งด้าน บัพและปฏิบัพของการกระจัดกับความดัน ความถี่ของโหมดปกติ
      f = nv/2L และ f = nv/4L (n คี่) การแก้ปลายท่อ เสียงมูลฐานกับเสียงฮาร์มอนิก คุณภาพเสียงจากสัดส่วนของฮาร์มอนิก
      เครื่องสาย (ซอ จะเข้) เครื่องเป่า (ขลุ่ย แคน) และเครื่องตี (ระนาด) และการเปลี่ยนระดับเสียงด้วยความยาว แรงตึง และอุณหภูมิ
  # ---------- ฟิสิกส์: อุณหพลศาสตร์ ----------
  # ลำดับ 2
  - id: physics.thermal.heat-transfer-rates
    title: การขยายตัวเชิงปริมาณ และอัตราการถ่ายโอนความร้อนโดยการนำ การพา และการแผ่รังสี
    difficulty: 5.5
    prereq: [physics.thermal.temperature-heat, physics.thermal.expansion-heat-transfer]
    indicators:
      - university-foundations:UPHYS2 1.3
      - university-foundations:UPHYS2 1.6
    scope: >-
      การขยายตัวเชิงเส้น ΔL = αLΔT เชิงพื้นที่และเชิงปริมาตร β ≈ 3α การขยายตัวที่ผิดปกติของน้ำ ความเค้นจากความร้อนเมื่อยึดปลายไว้
      อัตราการนำความร้อน P = kAΔT/d สภาพนำความร้อนของวัสดุ ค่า R ของฉนวนหลายชั้น การพาความร้อนเชิงคุณภาพและอัตราที่ขึ้นกับความเร็วลม
      การแผ่รังสีตามกฎของสเตฟาน–โบลซ์มันน์ P = σeAT⁴ สุทธิระหว่างวัตถุกับสิ่งแวดล้อม และการออกแบบผนัง หลังคา และกระติกเก็บความร้อน
  # ลำดับ 3
  - id: physics.thermal.statistical-thermodynamics
    title: การแบ่งพลังงานเท่ากัน การแจกแจงอัตราเร็วของโมเลกุล และเอนโทรปีระดับจุลภาค
    difficulty: 8.5
    prereq: [physics.thermal.kinetic-theory, physics.thermal.first-law, physics.thermal.second-law]
    indicators:
      - university-foundations:UPHYS2 2.3
      - university-foundations:UPHYS2 2.4
      - university-foundations:UPHYS2 4.7
    scope: >-
      องศาอิสระของการเลื่อนที่ การหมุน และการสั่น ทฤษฎีบทการแบ่งพลังงานเท่ากัน ½kT ต่อองศาอิสระ ที่มาของ C_V = 3/2 R และ 5/2 R
      การ "แช่แข็ง" องศาอิสระที่อุณหภูมิต่ำ และความจุความร้อนของของแข็ง (กฎของดูลองและปติต์) การแจกแจงอัตราเร็วของแมกซ์เวลล์–โบลซ์มันน์
      อัตราเร็วที่เป็นไปได้มากที่สุด อัตราเร็วเฉลี่ย และอัตราเร็วอาร์เอ็มเอส ผลของอุณหภูมิและมวล สถานะจุลภาคกับสถานะมหภาค
      S = k ln W นับสถานะจากการโยนเหรียญและการกระจายโมเลกุลในกล่อง และเหตุที่เอนโทรปีเพิ่มเป็นเรื่องของความน่าจะเป็น
  # ---------- ฟิสิกส์: ไฟฟ้าและแม่เหล็ก ----------
  # ลำดับ 2
  - id: physics.electricity.dipoles-potential-gradient
    title: ไดโพลไฟฟ้า ศักย์ของการกระจายประจุ และสนามจากเกรเดียนต์ของศักย์
    difficulty: 8.5
    prereq: [physics.electricity.potential-capacitance, physics.electricity.electric-field, math.calculus.partial-derivatives]
    indicators:
      - university-foundations:UPHYS2 5.7
      - university-foundations:UPHYS2 7.3
      - university-foundations:UPHYS2 7.4
      - university-foundations:UPHYS2 7.5
    scope: >-
      ไดโพลไฟฟ้าและโมเมนต์ไดโพล p = qd สนามไกลของไดโพล ทอร์ก τ = p × E และพลังงาน U = −p·E โมเลกุลน้ำในเตาไมโครเวฟ
      ศักย์จากจุดประจุหลายตัวด้วยการบวกสเกลาร์ ศักย์ของการกระจายประจุต่อเนื่อง V = k∫dq/r (เส้นประจุ วงแหวน แผ่นกลม)
      หาสนามจากศักย์ E = −∇V ด้วยอนุพันธ์ย่อย ผิวสมศักย์ตั้งฉากกับเส้นสนาม ตัวนำเป็นผิวสมศักย์ ประจุหนาแน่นที่ปลายแหลม
      และการใช้งาน เช่น สายล่อฟ้าและเครื่องกำเนิดแวนเดอกราฟ
  # ลำดับ 1
  - id: physics.magnetism.biot-savart-ampere
    title: แหล่งกำเนิดสนามแม่เหล็ก กฎของบีโอ–ซาวาร์ต์ และกฎของแอมแปร์
    difficulty: 8.5
    prereq: [physics.magnetism.magnetic-flux-forces, math.calculus.vectors-3d, math.calculus.integral-applications, physics.electricity.electric-field]
    indicators:
      - university-foundations:UPHYS2 12.1
      - university-foundations:UPHYS2 12.4
      - university-foundations:UPHYS2 12.5
      - university-foundations:UPHYS2 12.6
    scope: >-
      กฎของบีโอ–ซาวาร์ต์ dB = (μ₀/4π) I dl × r̂ / r² หาสนามของลวดตรงยาวจำกัดและอนันต์ (ที่มาของ μ₀I/2πr) และสนามบนแกนของขดลวดวงกลม
      สนามที่ศูนย์กลางและไกลออกไปในรูปไดโพลแม่เหล็ก กฎของแอมแปร์ ∮B·dl = μ₀I เลือกเส้นทางแอมแปร์ที่สมมาตร หาสนามภายในและภายนอกลวดหนา
      โซเลนอยด์ยาว และทอรอยด์ เปรียบเทียบกับกฎของเกาส์ในไฟฟ้าสถิต
  # ลำดับ 3
  - id: physics.magnetism.magnetic-materials-hall
    title: ปรากฏการณ์ฮอลล์ สมบัติแม่เหล็กของสาร และตัวนำยวดยิ่ง
    difficulty: 7
    prereq: [physics.magnetism.magnetic-flux-forces, physics.electricity.resistivity-drift]
    indicators:
      - university-foundations:UPHYS2 11.6
      - university-foundations:UPHYS2 12.7
      - university-foundations:UPHYS2 9.6
    scope: >-
      ปรากฏการณ์ฮอลล์ สมดุลแรงไฟฟ้ากับแรงแม่เหล็กบนพาหะ แรงดันฮอลล์ V_H = IB/nqt การหาเครื่องหมายและความหนาแน่นพาหะ และเซนเซอร์ฮอลล์
      ในโทรศัพท์และรถยนต์ โมเมนต์แม่เหล็กของอะตอม สารพาราแมกเนติก ไดอะแมกเนติก และเฟร์โรแมกเนติก สภาพให้ซึมได้สัมพัทธ์ โดเมนแม่เหล็ก
      วงฮิสเทอรีซิส แม่เหล็กถาวรกับแกนหม้อแปลง อุณหภูมิกูรี ตัวนำยวดยิ่ง ความต้านทานเป็นศูนย์ใต้อุณหภูมิวิกฤต ปรากฏการณ์ไมส์เนอร์
      และการใช้ใน MRI กับรถไฟแม่เหล็ก
  # ลำดับ 2
  - id: physics.waves.maxwell-em-waves
    title: สมการของแมกซ์เวลล์ คลื่นแม่เหล็กไฟฟ้าระนาบ พลังงาน และความดันรังสี
    difficulty: 9
    prereq: [physics.magnetism.biot-savart-ampere, physics.magnetism.induction, physics.waves.electromagnetic-waves]
    indicators:
      - university-foundations:UPHYS2 16.1
      - university-foundations:UPHYS2 16.2
      - university-foundations:UPHYS2 16.3
      - university-foundations:UPHYS2 16.4
    scope: >-
      กระแสการกระจัดที่ทำให้กฎของแอมแปร์ใช้ได้กับตัวเก็บประจุที่กำลังอัดประจุ สมการของแมกซ์เวลล์สี่สมการในรูปปริพันธ์และความหมายของแต่ละสมการ
      คลื่นระนาบ E และ B ตั้งฉากกันและตั้งฉากกับทิศการเคลื่อนที่ ได้ c = 1/√(μ₀ε₀) และ E = cB จากกฎของฟาราเดย์กับแอมแปร์–แมกซ์เวลล์
      ความหนาแน่นพลังงาน u = ε₀E² เวกเตอร์พอยน์ติง ความเข้ม I = ½cε₀E₀² ความเข้มของแสงแดดและสัญญาณมือถือ โมเมนตัมของคลื่น p = U/c
      ความดันรังสี I/c เมื่อดูดกลืนและ 2I/c เมื่อสะท้อน และใบเรือสุริยะ
