id: biology.ecology.adaptation-food-chains
subject: biology
title: { th: การปรับตัวและโซ่อาหาร, en: "Adaptation and food chains" }
summary: โครงสร้างและพฤติกรรมที่ช่วยให้สิ่งมีชีวิตอยู่รอดในแหล่งที่อยู่ ความสัมพันธ์กับสิ่งมีชีวิตและสิ่งไม่มีชีวิต การเขียนโซ่อาหาร ผู้ผลิต ผู้บริโภค ผู้ย่อยสลาย และการดูแลสิ่งแวดล้อม
difficulty: 2
minutes: 35
prerequisites: [biology.ecology.habitats, biology.diversity.classifying-organisms]
encompasses:
  - { id: biology.ecology.habitats, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: โครงสร้างที่เหมาะกับแหล่งที่อยู่
    src: adaptations.svg
    alt: "ภาพ 4 ช่อง ช่องที่ 1 ผักตบชวาในสระน้ำ ก้านใบพองเป็นกระเปาะ ข้างในมีช่องอากาศ ลอยอยู่บนผิวน้ำ มีรากห้อยในน้ำ ข้อความ ก้านใบพอง ข้างในมีช่องอากาศ ช่วยให้ลอยน้ำได้ ช่องที่ 2 ต้นโกงกางในป่าชายเลน มีรากโค้งหลายรากแตกจากลำต้นลงไปปักในดินเลนใต้น้ำ ข้อความ รากค้ำจุนแตกจากลำต้น ยึดดินเลนให้ต้นไม่ล้ม ช่องที่ 3 กระบองเพชรในที่แห้งแล้ง ลำต้นเขียวอวบมีหนามรอบ ข้อความ ใบเป็นหนาม ลำต้นอวบเก็บน้ำ จึงเสียน้ำน้อย ช่องที่ 4 เท้าเป็ดมี 3 นิ้ว มีแผ่นพังผืดขึงระหว่างนิ้ว ข้อความ มีพังผืดระหว่างนิ้ว ใช้พุ้ยน้ำ ว่ายได้ดี"
    caption: "ลักษณะเหล่านี้ถ่ายทอดจากพ่อแม่และเกิดขึ้นผ่านหลายรุ่น (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: worked-example
    title: อธิบายว่าโครงสร้างช่วยให้อยู่รอดอย่างไร
    problem: "ปลาตีนอาศัยอยู่ในป่าชายเลน ตอนน้ำลงมันใช้ครีบอกที่แข็งแรงคืบไปบนเลน ลักษณะนี้ช่วยให้ปลาตีนอยู่รอดได้อย่างไร"
    steps:
      - text: "ดูแหล่งที่อยู่ก่อน ป่าชายเลนมีน้ำขึ้นและน้ำลงทุกวัน ตอนน้ำลงเหลือแต่ดินเลน"
      - text: "ดูโครงสร้าง ครีบอกที่แข็งแรงใช้ค้ำตัวและคืบไปข้างหน้าได้"
        why: "ปลาทั่วไปมีครีบบางที่ใช้ว่ายในน้ำเท่านั้น"
      - text: "เชื่อมกัน ตอนน้ำลงปลาตีนจึงเคลื่อนที่หาอาหารและหนีศัตรูบนเลนได้"
    answer: "ครีบอกที่แข็งแรงทำให้ปลาตีนเคลื่อนที่บนดินเลนได้ตอนน้ำลง จึงหาอาหารและหนีศัตรูได้ในป่าชายเลน"
  - { type: check, problem: biology.ecology.adaptation-food-chains.p011, prompt: "ใช้ขั้นเดียวกัน ดูแหล่งที่อยู่ ดูโครงสร้าง แล้วเชื่อมกัน" }
  - type: figure
    title: โซ่อาหารในนาข้าว
    src: rice-field-chain.svg
    alt: "กล่อง 5 กล่องเรียงจากซ้ายไปขวา มีลูกศรชี้ไปทางขวา ข้าว ผู้ผลิต สร้างอาหารเองได้ → ตั๊กแตน ผู้บริโภคพืช เหยื่อของกบ → กบ ผู้บริโภคสัตว์ ผู้ล่าตั๊กแตน → งู ผู้บริโภคสัตว์ ผู้ล่ากบ → เหยี่ยว ผู้บริโภคสัตว์ ผู้ล่าลำดับสุดท้าย ด้านล่างมีแถบยาว ผู้ย่อยสลาย (เห็ด รา แบคทีเรีย) ย่อยซากและมูลของทุกตัวในโซ่อาหาร ได้แร่ธาตุคืนสู่ดิน ให้ข้าวนำไปใช้อีก"
    caption: "ลูกศรชี้จากสิ่งที่ถูกกินไปหาผู้กิน ตามทางที่อาหารและพลังงานส่งต่อไป (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: เขียนโซ่อาหารจากเรื่องเล่า
    problem: "ในสวนผัก หนอนกินใบผักคะน้า นกกินหนอน และแมวจับนกกิน เขียนโซ่อาหาร แล้วบอกว่าใครเป็นผู้ผลิต และใครเป็นทั้งผู้ล่าและเหยื่อ"
    steps:
      - text: "หาผู้ผลิตก่อน ผักคะน้าเป็นพืช สร้างอาหารเองได้ จึงอยู่ต้นโซ่"
      - text: "เรียงผู้กินต่อไปทีละตัว ผักคะน้า → หนอน → นก → แมว"
        why: "ลูกศรชี้ไปหาผู้กินเสมอ"
      - text: "นกกินหนอนจึงเป็นผู้ล่า และถูกแมวกินจึงเป็นเหยื่อด้วย"
    answer: "ผักคะน้า → หนอน → นก → แมว ผักคะน้าเป็นผู้ผลิต นกเป็นทั้งผู้ล่าและเหยื่อ"
  - { type: check, problem: biology.ecology.adaptation-food-chains.p004, prompt: "เริ่มจากผู้ผลิตแล้วต่อด้วยผู้กินทีละตัว" }
glossary:
  - { term: การปรับตัว, definition: "การที่สิ่งมีชีวิตมีโครงสร้างหรือพฤติกรรมที่ช่วยให้อยู่รอดในแหล่งที่อยู่ เกิดขึ้นผ่านหลายรุ่น" }
  - { term: โซ่อาหาร, definition: "การกินกันเป็นทอด ๆ ของสิ่งมีชีวิต เขียนเป็นลูกศรจากสิ่งที่ถูกกินไปหาผู้กิน" }
  - { term: ผู้ผลิต, definition: "สิ่งมีชีวิตที่สร้างอาหารเองได้ด้วยแสง เช่น พืชและสาหร่าย" }
  - { term: ผู้บริโภค, definition: "สิ่งมีชีวิตที่สร้างอาหารเองไม่ได้ ต้องกินสิ่งมีชีวิตอื่น" }
  - { term: ผู้ย่อยสลาย, definition: "สิ่งมีชีวิตที่ย่อยซากและมูลให้เป็นแร่ธาตุคืนสู่ดิน เช่น เห็ด รา แบคทีเรีย" }
  - { term: ผู้ล่า, definition: "สัตว์ที่ล่าสัตว์อื่นเป็นอาหาร สัตว์ที่ถูกล่าเรียกว่าเหยื่อ" }
flashcards:
  - { front: "ลูกศรในโซ่อาหารชี้ไปทางไหน", back: "จากสิ่งที่ถูกกิน ไปหาผู้กิน" }
  - { front: "โซ่อาหารเริ่มต้นที่อะไร", back: "ผู้ผลิต เช่น พืช สาหร่าย" }
  - { front: "โกงกางปรับตัวอย่างไร", back: "มีรากค้ำจุนยึดดินเลนในป่าชายเลน" }
  - { front: "ถ้าผู้ล่าหายไป เหยื่อจะเป็นอย่างไร", back: "เหยื่อมักเพิ่มจำนวน และกินอาหารของมันมากขึ้น" }
