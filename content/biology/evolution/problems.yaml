      - { id: b, text: "แบคทีเรียแต่ละเซลล์เรียนรู้ที่จะดื้อยาเมื่อพบยาบ่อย ๆ", feedback: "แบคทีเรียไม่ได้เรียนรู้ ความต้านทานมาจากยีนที่มีอยู่หรือได้รับมา" }
      - { id: c, text: "ยาปฏิชีวนะทำให้แบคทีเรียตั้งใจเกิดมิวเทชันที่ดื้อยา", feedback: "มิวเทชันเกิดแบบสุ่ม ยาเป็นตัวคัดเลือก ไม่ใช่ตัวสร้างมิวเทชันที่ต้องการ" }
      - { id: d, text: "คนที่กินยาบ่อยจะดื้อยาเอง", feedback: "แบคทีเรียเป็นฝ่ายดื้อยา ไม่ใช่ร่างกายคน" }
    hints:
