  <line x1="668.0" y1="174.0" x2="672.0" y2="246.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah6b7280)"/>
  <line x1="503.0" y1="220.0" x2="672.0" y2="246.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah6b7280)"/>
  <text x="10.0" y="310.0" font-size="13" text-anchor="start" fill="#6b7280" xml:space="preserve">เขียนโค้ดกับทำเสียงและภาพทำพร้อมกันได้ ทดสอบต้องรอทั้งสองงาน โครงงานจึงใช้ 1 + 2 + 5 + 2 = 10 วัน ไม่ใช่ 12 วัน</text>
</svg>
