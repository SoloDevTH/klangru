    solution: "ช่วง $0$–$3\\ \\mathrm{s}$: $v$ จาก $1$ เป็น $7$ การกระจัด $\\tfrac12(1 + 7)(3) = 12\\ \\mathrm{m}$ ช่วง $3$–$7\\ \\mathrm{s}$: $v$ จาก $7$ เป็น $3$ การกระจัด $\\tfrac12(7 + 3)(4) = 20\\ \\mathrm{m}$ รวม $32\\ \\mathrm{m}$"
