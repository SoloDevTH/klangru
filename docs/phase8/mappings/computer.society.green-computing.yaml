topic: computer.society.green-computing
rows:
  - { framework: acm-cs2023, indicators: ["SEP-Sustainability"], coverage: partial, note: "ความยั่งยืนของอุปกรณ์ผ่านวงจรชีวิต การซ่อม และการออกแบบประหยัดพลังงาน แต่เป็นการแนะนำระดับเบื้องต้น ยังไม่ครอบคลุมตัวชี้วัดการประเมินเชิงระบบ" }
  - { framework: acm-cs2023, indicators: ["AR-SEP"], coverage: partial, note: "ประเด็นฮาร์ดแวร์ เช่น ขยะอิเล็กทรอนิกส์ การรีไซเคิล และการล้าสมัยตามแผน (บทเรียนส่วนขยะและการซ่อม โจทย์ p002 p004 p015) แต่ยังไม่ลงลึกเรื่องวัสดุและกระบวนการผลิต" }
  - { framework: acm-cs2023, indicators: ["SF-SEP"], coverage: partial, note: "ผู้ได้รับผลกระทบจากโครงสร้างพื้นฐานและการเลือกเทคโนโลยี (โจทย์ p012) แต่จริยธรรมวิชาชีพยังเป็นเพียงแนวคิดเบื้องต้น" }
  - { framework: csta-k12-cs-2026, indicators: ["E4-SYS-IM-15"], coverage: full, note: "ศึกษาผลของอุปกรณ์ที่ใช้กันแพร่หลายต่อทรัพยากรและสิ่งแวดล้อม เช่น การขุดแร่ ขยะ และพลังงานของศูนย์ข้อมูล (บทเรียนทั้งหมด โจทย์ p001-p003 p005 p011 p014 p016)" }
  - { framework: csta-k12-cs-2026, indicators: ["HS-SYS-IM-37"], coverage: full, note: "ระบุว่าโครงสร้างพื้นฐานคอมพิวเตอร์กระทบใครและเพราะอะไร (บทเรียนส่วนใครได้รับผลกระทบ โจทย์ p012)" }
  - { framework: csta-k12-cs-2026, indicators: ["MS-SYS-HW-30"], coverage: partial, note: "เปรียบเทียบระบบตามความต้องการผู้ใช้และข้อกำหนด (โจทย์ p013) แต่ยังไม่ได้วิเคราะห์ผลทางจริยธรรมของแต่ละระบบอย่างเป็นระบบ" }
