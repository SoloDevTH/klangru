  - id: physics.rotation.static-equilibrium.p018
    topics: [physics.rotation.static-equilibrium]
    difficulty: 3
    type: mcq
    stem: "ช่วงหีบอ้อย รถบรรทุกอ้อยที่บรรทุกสูงเกินกำหนดพลิกคว่ำบ่อยเมื่อเลี้ยวโค้ง ข้อใดอธิบายได้ถูกต้อง"
    choices:
      - { id: a, text: "อ้อยที่กองสูงทำให้ศูนย์ถ่วงของรถสูงขึ้น เมื่อรถเอียงเล็กน้อย แนวดิ่งผ่านศูนย์ถ่วงจึงตกนอกฐานล้อได้ง่าย", correct: true }
      - { id: b, text: "อ้อยทำให้รถหนักขึ้น รถที่หนักล้มง่ายกว่าเสมอ", feedback: "น้ำหนักที่เพิ่มอย่างเดียวไม่ได้ทำให้ล้ม ถ้าวางของหนักไว้ต่ำ รถยิ่งมีเสถียรภาพ สิ่งที่สำคัญคือความสูงของศูนย์ถ่วง" }
      - { id: c, text: "อ้อยที่กองสูงทำให้ฐานล้อของรถแคบลง", feedback: "ระยะห่างระหว่างล้อเท่าเดิม สิ่งที่เปลี่ยนคือตำแหน่งของศูนย์ถ่วง" }
    hints:
      - "เปรียบเทียบตู้ทรงเตี้ยกับตู้ทรงสูงที่ฐานกว้างเท่ากัน แบบใดล้มง่ายกว่า"
      - "วัตถุจะล้มเมื่อแนวดิ่งผ่านศูนย์ถ่วงตกนอกฐาน"
    solution: "การกองอ้อยสูงยกศูนย์ถ่วงของทั้งคันให้สูงขึ้น ขณะเลี้ยวโค้งรถเอียงออก มุมเอียงที่ทำให้แนวดิ่งผ่านศูนย์ถ่วงออกนอกล้อด้านนอกจึงเล็กลง รถพลิกคว่ำง่าย จึงต้องบรรทุกไม่เกินความสูงที่กำหนดและลดความเร็วก่อนเข้าโค้ง"
