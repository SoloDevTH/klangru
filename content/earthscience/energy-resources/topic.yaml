id: earthscience.resources.energy-resources
subject: earthscience
title: { th: เชื้อเพลิงซากดึกดำบรรพ์และพลังงานทดแทน, en: "Fossil fuels and renewable energy" }
summary: เปรียบเทียบถ่านหิน น้ำมัน และแก๊สธรรมชาติ ผลกระทบและแนวทางใช้อย่างคุ้มค่า ข้อดีข้อจำกัดของพลังงานหมุนเวียน การคำนวณพลังงานไฟฟ้าที่ใช้ และการเลือกพลังงานที่เหมาะกับท้องถิ่น
difficulty: 3
minutes: 35
prerequisites: [earthscience.geology.rock-cycle-fossils, physics.energy.energy-electricity-intro]
encompasses:
  - { id: physics.energy.energy-electricity-intro, weight: 0.3 }
  - { id: earthscience.geology.rock-cycle-fossils, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: แหล่งพลังงานส่วนใหญ่มาจากดวงอาทิตย์
    src: energy-sources.svg
    alt: "ดวงอาทิตย์อยู่ด้านบน มีลูกศรชี้ลงไปยังกล่องสีเขียวสี่กล่องที่เป็นพลังงานหมุนเวียน ได้แก่ แสงอาทิตย์ (แผงโซลาร์เซลล์) ลม (อากาศร้อนไม่เท่ากัน) น้ำ (วัฏจักรน้ำ เขื่อนพลังน้ำ) และชีวมวล (พืชสังเคราะห์ด้วยแสง แกลบ ชานอ้อย) จากชีวมวลมีลูกศรลงไปที่กล่องสีแดง เชื้อเพลิงซากดึกดำบรรพ์ ถ่านหิน น้ำมัน แก๊ส เพราะซากพืชซากสัตว์ทับถมหลายล้านปี ด้านขวาแยกด้วยเส้นประ เขียนว่าไม่ได้มาจากดวงอาทิตย์ มีความร้อนใต้พิภพ (กล่องเขียว) และนิวเคลียร์ ธาตุยูเรเนียม (กล่องแดง) คำอธิบายสี สีเขียวคือพลังงานหมุนเวียน สีแดงคือใช้แล้วหมดไป"
    caption: "เชื้อเพลิงซากดึกดำบรรพ์คือพลังงานจากดวงอาทิตย์ที่สิ่งมีชีวิตเก็บไว้เมื่อหลายล้านปีก่อน (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: เปลี่ยนหลอดไฟประหยัดได้เท่าไร
    problem: "ห้องเรียนมีหลอดฟลูออเรสเซนต์ 36 W จำนวน 10 หลอด เปิดวันละ 7 ชั่วโมง เดือนละ 22 วัน ถ้าเปลี่ยนเป็นหลอด LED 18 W ที่สว่างใกล้กัน จะประหยัดพลังงานได้เดือนละกี่ kWh และกี่บาท ถ้าค่าไฟหน่วยละ 4.50 บาท (ค่าไฟสมมติ)"
    steps:
      - text: "กำลังไฟฟ้าที่ลดลงต่อหลอด $= 36 - 18 = 18$ W รวม 10 หลอด $= 180$ W"
      - text: "เวลาที่เปิดต่อเดือน $= 7 \\times 22 = 154$ ชั่วโมง"
      - text: "พลังงานที่ประหยัด $= \\dfrac{180 \\times 154}{1{,}000} = 27.72$ kWh"
        why: "หารด้วย 1,000 เพื่อแปลงวัตต์ชั่วโมงเป็นกิโลวัตต์ชั่วโมง ซึ่งเป็นหน่วยในบิลค่าไฟ"
      - text: "เงินที่ประหยัด $= 27.72 \\times 4.50 \\approx 124.74$ บาทต่อเดือน"
    answer: "ประหยัดได้ประมาณ 27.7 kWh หรือราว 125 บาทต่อเดือน และลดการเผาเชื้อเพลิงที่โรงไฟฟ้าไปด้วย"
  - { type: check, problem: earthscience.resources.energy-resources.p004, prompt: "อย่าลืมหารด้วย 1,000" }
  - type: worked-example
    title: เลือกพลังงานให้เหมาะกับท้องถิ่น
    problem: "ตำบลหนึ่งในจังหวัดนครสวรรค์มีโรงสีข้าวขนาดใหญ่ที่มีแกลบเหลือวันละหลายตัน แดดดีเกือบทั้งปี ลมอ่อน และไม่มีแม่น้ำที่มีความต่างระดับ ควรเลือกพลังงานหมุนเวียนแบบใด"
    steps:
      - text: "ดูทรัพยากรที่มี: แกลบ (ชีวมวล) มีมาก แดดดี ลมอ่อน ไม่มีที่สร้างเขื่อน"
      - text: "ตัดลมและน้ำออก เพราะไม่มีทรัพยากรพอ"
      - text: "ชีวมวลจากแกลบผลิตไฟฟ้าได้ทั้งกลางวันและกลางคืน และช่วยกำจัดของเหลือ แต่ต้องมีระบบกรองควันและฝุ่น"
        why: "การเผาชีวมวลยังปล่อยฝุ่น จึงต้องคิดถึงผลกระทบต่อชุมชนด้วย"
      - text: "เสริมด้วยแผงโซลาร์เซลล์บนหลังคาโรงสีสำหรับใช้ไฟตอนกลางวัน"
    answer: "ใช้โรงไฟฟ้าชีวมวลจากแกลบเป็นหลักพร้อมระบบกรองฝุ่น และเสริมด้วยแผงโซลาร์เซลล์บนหลังคา"
  - { type: check, problem: earthscience.resources.energy-resources.p010, prompt: "ท้องถิ่นนั้นมีทรัพยากรอะไรมาก" }
glossary:
  - { term: เชื้อเพลิงซากดึกดำบรรพ์, definition: "เชื้อเพลิงที่เกิดจากซากสิ่งมีชีวิตทับถมใต้ดินหลายล้านปี ได้แก่ ถ่านหิน น้ำมันดิบ และแก๊สธรรมชาติ ใช้แล้วหมดไป" }
  - { term: พลังงานหมุนเวียน, definition: "พลังงานที่เกิดขึ้นใหม่ได้ตลอด เช่น แสงอาทิตย์ ลม น้ำ ชีวมวล ความร้อนใต้พิภพ เรียกอีกชื่อว่าพลังงานทดแทน" }
  - { term: ชีวมวล, definition: "สารอินทรีย์จากพืชและสัตว์ เช่น แกลบ ชานอ้อย เศษไม้ มูลสัตว์ ที่นำมาผลิตพลังงาน" }
  - { term: ความร้อนใต้พิภพ, definition: "พลังงานความร้อนจากภายในโลก นำน้ำร้อนหรือไอน้ำใต้ดินมาผลิตไฟฟ้าหรือใช้ความร้อนโดยตรง" }
  - { term: กิโลวัตต์ชั่วโมง, definition: "หน่วยพลังงานไฟฟ้า เท่ากับใช้กำลังไฟฟ้า 1,000 วัตต์นาน 1 ชั่วโมง คือ 1 หน่วยในบิลค่าไฟ" }
  - { term: ระยะเวลาคืนทุน, definition: "เวลาที่เงินที่ประหยัดได้รวมกันเท่ากับเงินลงทุน คำนวณจากเงินลงทุนหารด้วยเงินที่ประหยัดได้ต่อปี" }
flashcards:
  - { front: "เชื้อเพลิงซากดึกดำบรรพ์มีอะไรบ้าง", back: "ถ่านหิน (ของแข็ง) น้ำมันดิบ (ของเหลว) และแก๊สธรรมชาติ (แก๊ส)" }
  - { front: "ไทยผลิตไฟฟ้าจากเชื้อเพลิงใดมากที่สุด", back: "แก๊สธรรมชาติ ราวสองในสามของไฟฟ้าทั้งหมด" }
  - { front: "คำนวณพลังงานไฟฟ้าเป็น kWh อย่างไร", back: "กำลังไฟฟ้า (W) × เวลา (h) ÷ 1,000" }
  - { front: "ข้อจำกัดของพลังงานแสงอาทิตย์", back: "ผลิตไม่ได้ตอนกลางคืน ลดลงเมื่อเมฆมาก และต้องใช้พื้นที่ติดตั้ง" }
  - { front: "ระยะเวลาคืนทุนหาอย่างไร", back: "เงินลงทุน ÷ เงินที่ประหยัดได้ต่อปี" }
