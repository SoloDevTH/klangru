  - id: math.geometry.shapes.p017
    topics: [math.geometry.shapes]
    difficulty: 4
    type: mcq
    stem: "รูปสามมิติรูปหนึ่งมีฐานเป็นรูปห้าเหลี่ยม 1 ฐาน หน้าข้างทุกหน้าเป็นรูปสามเหลี่ยมและมาพบกันที่จุดเดียว รูปนี้คือรูปใด"
    choices:
      - { id: a, text: "พีระมิดฐานห้าเหลี่ยม", correct: true }
      - { id: b, text: "ปริซึมห้าเหลี่ยม", feedback: "ปริซึมมีฐานสองฐานและหน้าข้างเป็นสี่เหลี่ยม" }
      - { id: c, text: "กรวย", feedback: "กรวยมีฐานเป็นวงกลมและผิวโค้ง ไม่มีหน้าข้างที่เป็นสามเหลี่ยม" }
      - { id: d, text: "รูปห้าเหลี่ยม", feedback: "รูปห้าเหลี่ยมเป็นรูปสองมิติ ข้อนี้เป็นรูปสามมิติที่มีรูปห้าเหลี่ยมเป็นฐาน" }
    hints:
      - "รูปสามมิติที่หน้าข้างมาพบกันที่ยอดจุดเดียวคือรูปชนิดใด"
      - "เรียกชื่อตามรูปของฐาน"
    solution: "ฐานเดียวเป็นรูปหลายเหลี่ยม หน้าข้างเป็นสามเหลี่ยมพบกันที่ยอด คือพีระมิด ฐานเป็นห้าเหลี่ยมจึงเรียกว่าพีระมิดฐานห้าเหลี่ยม"
