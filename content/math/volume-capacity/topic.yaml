id: math.measure.volume-capacity
subject: math
title: { th: ปริมาตรและความจุ, en: Volume and capacity }
summary: เปรียบเทียบความจุ ตวงด้วยหน่วยไม่มาตรฐาน ลิตร มิลลิลิตร ช้อนชา ช้อนโต๊ะ ถ้วยตวง อ่านขีดเหยือกตวง คาดคะเน และหาปริมาตรของรูปที่ประกอบด้วยทรงสี่เหลี่ยมมุมฉาก
difficulty: 2
minutes: 35
prerequisites: [math.number.whole-mul-div]
encompasses:
  - { id: math.number.whole-mul-div, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: jug-scale.svg
    alt: "เหยือกตวงขนาด 1 ลิตร มีตัวเลข 200, 400, 600, 800 และ 1,000 มิลลิลิตร ระหว่างตัวเลขสองตัวมีขีดสั้นอีก 1 ขีด แบ่งเป็น 2 ช่อง ระดับน้ำอยู่ที่ขีดสั้นเหนือ 600 ข้างภาพเขียนว่า ระหว่าง 200 กับ 400 มี 2 ช่อง 1 ช่อง = 100 มิลลิลิตร ระดับน้ำอยู่ที่ขีดเหนือ 600 ไป 1 ช่อง น้ำ 700 มิลลิลิตร"
    caption: "หาค่าของ 1 ช่องก่อน แล้วนับช่องต่อจากตัวเลขที่ระดับน้ำเพิ่งเลยมา"
  - type: worked-example
    title: บวกปริมาตรที่มีการทด
    problem: "แม่เทน้ำส้มขวดแรก 1 ลิตร 650 มิลลิลิตร และขวดที่สอง 800 มิลลิลิตร ลงในเหยือก รวมได้เท่าไร"
    steps:
      - text: "บวกมิลลิลิตร: $650 + 800 = 1{,}450$ มิลลิลิตร"
      - text: "1,450 มิลลิลิตร เกิน 1,000 ทดเป็น 1 ลิตร เหลือ 450 มิลลิลิตร"
        why: "1,000 มิลลิลิตร = 1 ลิตร"
      - text: "บวกลิตร: $1 + 1 = 2$ ลิตร"
      - text: "ตรวจด้วยมิลลิลิตร: $1{,}650 + 800 = 2{,}450$ มิลลิลิตร ✓"
    answer: "2 ลิตร 450 มิลลิลิตร"
  - { type: check, problem: math.measure.volume-capacity.p005, prompt: "1 ช่องบนเหยือกนี้มีค่าเท่าไร" }
  - type: figure
    src: cubes-cuboid.svg
    alt: "ทรงสี่เหลี่ยมมุมฉากต่อจากลูกบาศก์หน่วย ยาว 4 ลูก กว้าง 3 ลูก สูง 2 ชั้น ข้างภาพเขียนว่า ชั้นล่าง 3 แถว แถวละ 4 ลูก เท่ากับ 12 ลูก มี 2 ชั้น 12 × 2 = 24 ลูก ปริมาตร 24 ลูกบาศก์หน่วย"
    caption: "นับทีละชั้น ไม่ต้องนับทีละลูก และไม่ลืมลูกที่ซ่อนอยู่ข้างใน"
  - type: worked-example
    title: ปริมาตรของรูปที่ประกอบด้วยทรงสี่เหลี่ยมมุมฉากสองก้อน
    problem: "แท่นวางของทำจากไม้สองก้อน ก้อนล่างกว้าง 5 ซม. ยาว 10 ซม. สูง 2 ซม. ก้อนบนวางทับกว้าง 5 ซม. ยาว 4 ซม. สูง 6 ซม. ไม้ทั้งหมดมีปริมาตรเท่าไร"
    steps:
      - text: "ก้อนล่าง: ชั้นละ $5 \\times 10 = 50$ ลูกบาศก์เซนติเมตร สูง 2 ชั้น ได้ $50 \\times 2 = 100$ ลูกบาศก์เซนติเมตร"
      - text: "ก้อนบน: ชั้นละ $5 \\times 4 = 20$ ลูกบาศก์เซนติเมตร สูง 6 ชั้น ได้ $20 \\times 6 = 120$ ลูกบาศก์เซนติเมตร"
        why: "ก้อนบนสูง 6 ซม. ของตัวเอง ไม่ใช่ความสูงรวม 8 ซม."
      - text: "รวม $100 + 120 = 220$ ลูกบาศก์เซนติเมตร"
        why: "สองก้อนไม่ซ้อนกัน ปริมาตรจึงบวกกันได้"
    answer: "220 ลูกบาศก์เซนติเมตร"
  - { type: check, problem: math.measure.volume-capacity.p012, prompt: "นับชั้นละกี่ลูก แล้วมีกี่ชั้น" }
glossary:
  - { term: ปริมาตร, definition: "ขนาดของที่ที่สิ่งของหรือของเหลวใช้" }
  - { term: ความจุ, definition: "ปริมาตรที่ภาชนะใส่ได้มากที่สุด" }
  - { term: ลิตร, definition: "หน่วยปริมาตรและความจุ 1 ลิตร = 1,000 มิลลิลิตร" }
  - { term: มิลลิลิตร, definition: "หน่วยปริมาตรเล็ก 1,000 มิลลิลิตร = 1 ลิตร" }
  - { term: ลูกบาศก์หน่วย, definition: "ลูกบาศก์ยาวด้านละ 1 หน่วย ใช้วัดปริมาตรของของแข็ง" }
  - { term: เหยือกตวง, definition: "ภาชนะที่มีขีดบอกปริมาตร ใช้ตวงของเหลว" }
flashcards:
  - { front: "1 ลิตร เท่ากับกี่มิลลิลิตร", back: "1,000 มิลลิลิตร" }
  - { front: "1 ช้อนโต๊ะ เท่ากับกี่ช้อนชา", back: "3 ช้อนชา (ประมาณ 15 มิลลิลิตร)" }
  - { front: "ปริมาตรกับความจุต่างกันอย่างไร", back: "ปริมาตรคือขนาดที่ของใช้ ความจุคือปริมาตรมากที่สุดที่ภาชนะใส่ได้" }
  - { front: "1 ลูกบาศก์เซนติเมตร เท่ากับกี่มิลลิลิตร", back: "1 มิลลิลิตร" }
  - { front: "นับลูกบาศก์ในทรงสี่เหลี่ยมมุมฉากเร็ว ๆ ทำอย่างไร", back: "นับลูกในหนึ่งชั้น แล้วคูณด้วยจำนวนชั้น" }
