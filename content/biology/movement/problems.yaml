    ai_assisted: true

  - id: biology.animals.movement.p016
    topics: [biology.animals.movement]
    difficulty: 5
    type: mcq
    stem: "หลังสัตว์ตายไม่กี่ชั่วโมง กล้ามเนื้อจะแข็งเกร็งงอไม่ได้ (rigor mortis) เพราะเซลล์ไม่สร้าง ATP อีก ข้อใดอธิบายได้สอดคล้องกับทฤษฎีการเลื่อนของเส้นใย"
    choices:
      - { id: a, text: "หัวไมโอซินที่จับแอกทินอยู่ต้องใช้ ATP เพื่อปล่อยออก เมื่อไม่มี ATP หัวไมโอซินจึงค้างจับแอกทิน กล้ามเนื้อจึงแข็ง", correct: true }
      - { id: b, text: "ไม่มี ATP แอกทินและไมโอซินจึงหดสั้นถาวร", feedback: "เส้นใยไม่หดสั้น ปัญหาคือหัวไมโอซินปล่อยแอกทินไม่ได้" }
      - { id: c, text: "ไม่มี ATP หัวไมโอซินจึงจับแอกทินไม่ได้เลย กล้ามเนื้อจึงแข็ง", feedback: "ถ้าจับไม่ได้ เส้นใยจะเลื่อนผ่านกันได้อิสระ กล้ามเนื้อจะอ่อนปวกเปียก ไม่ใช่แข็ง" }
      - { id: d, text: "กระดูกหดตัวจนข้อต่อล็อก", feedback: "กระดูกหดตัวไม่ได้ ความแข็งเกิดที่กล้ามเนื้อ" }
    hints:
      - "ATP ใช้ทั้งในการดึงและการทำให้หัวไมโอซินหลุดจากแอกทิน"
      - "ถ้าหัวไมโอซินหลุดไม่ได้ เส้นใยจะเลื่อนได้หรือไม่"
    solution: "ในวงจรการหดตัว ATP ทำให้หัวไมโอซินหลุดจากแอกทินก่อนดึงรอบใหม่ เมื่อไม่มี ATP หัวไมโอซินค้างจับแอกทิน เส้นใยเลื่อนผ่านกันไม่ได้ กล้ามเนื้อจึงแข็งเกร็ง หลักฐานนี้สนับสนุนว่า ATP จำเป็นต่อทั้งการดึงและการปล่อย"
    license: CC-BY-SA-4.0
    ai_assisted: true

