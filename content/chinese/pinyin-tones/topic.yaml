id: chinese.pinyin.tones
subject: chinese
title: { th: พินอินและวรรณยุกต์ภาษาจีน, en: Pinyin and Mandarin tones }
summary: พินอินคือการเขียนเสียงภาษาจีนกลางด้วยอักษรโรมัน แต่ละพยางค์มีพยัญชนะต้น สระ และวรรณยุกต์ ซึ่งมี 4 เสียงกับเสียงเบา
difficulty: 1
minutes: 25
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - type: figure
    src: mandarin-tones.svg
    alt: "เส้นระดับเสียงวรรณยุกต์ภาษาจีนกลางบนสเกล 1 ต่ำสุดถึง 5 สูงสุด: เสียง 1 妈 mā แม่ ระดับ 5 คงที่ (55), เสียง 2 麻 má ป่าน ขึ้นจาก 3 ไป 5 (35), เสียง 3 马 mǎ ม้า เริ่ม 2 ลงถึง 1 แล้วขึ้นถึง 4 (214), เสียง 4 骂 mà ด่า ตกจาก 5 ถึง 1 (51), เสียงเบา 吗 ma เป็นจุดสั้น ๆ ระดับกลางค่อนต่ำ"
    caption: "รูปเครื่องหมายวรรณยุกต์ ˉ ˊ ˇ ˋ เลียนแบบทิศทางของเส้นระดับเสียง"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: pinyin-tone-mark.svg
    alt: "ผังการวางเครื่องหมายวรรณยุกต์ ถามทีละข้อ: พยางค์มี a ไหม ถ้าใช่วางบน a เช่น hǎo kuài xiān ถ้าไม่ ถามต่อว่ามี o หรือ e ไหม ถ้าใช่วางบน o หรือ e เช่น dōu xiè guó ถ้าไม่ และเป็น iu หรือ ui ให้วางบนตัวหลัง เช่น liù guì jiǔ สระเดี่ยววางบนสระตัวนั้น เช่น nǐ shū nǚ"
    caption: "ลำดับการวางเครื่องหมาย: a ก่อน แล้ว o หรือ e แล้วตัวหลังของ iu และ ui"
  - type: worked-example
    title: เปลี่ยนเลขเสียงเป็นเครื่องหมาย
    problem: "เขียน liu4, gui4 และ xue2 ด้วยเครื่องหมายวรรณยุกต์"
    steps:
      - text: "liu4: ไม่มี a, o, e และเป็น iu จึงวางบนตัวหลัง u ได้ liù (六 หก)"
      - text: "gui4: เป็น ui จึงวางบนตัวหลัง i และ i ที่มีเครื่องหมายไม่ต้องมีจุด ได้ guì (贵 แพง)"
        why: "เครื่องหมายแทนที่จุดของ i"
      - text: "xue2: ไม่มี a แต่มี e จึงวางบน e ได้ xué (学 เรียน)"
        why: "u หลัง x คือ ü ที่ไม่ต้องเขียนจุด แต่เครื่องหมายยังวางตามลำดับ a → o/e"
    answer: "liù · guì · xué"
  - { type: check, problem: zh.tone.p016, prompt: "ดูรูปเส้นเสียงแล้วลองตอบ" }
  - type: worked-example
    title: อ่านประโยคที่มีทั้ง 不 และ 一
    problem: "我不要一个 (ฉันไม่เอาสักอัน) สะกดว่า wǒ bù yào yī gè เวลาพูดจริงออกเสียงอย่างไร"
    steps:
      - text: "ไล่ดูทีละพยางค์ว่ามีคำที่เปลี่ยนเสียงได้หรือไม่: 不 และ 一 เปลี่ยนตามพยางค์ถัดไป"
      - text: "不 ตามด้วย 要 yào ซึ่งเป็นเสียง 4 จึงเปลี่ยนเป็น bú"
      - text: "一 ตามด้วย 个 gè ซึ่งเสียงเดิมเป็นเสียง 4 จึงเปลี่ยนเป็น yí"
        why: "ตัดสินจากเสียงเดิมของ 个 แม้ในการพูดเร็ว 个 มักกลายเป็นเสียงเบา"
      - text: "我 wǒ ตามด้วย bú ซึ่งไม่ใช่เสียง 3 จึงไม่เปลี่ยน (ในประโยคออกแค่ช่วงต่ำ)"
    answer: "wǒ bú yào yí gè"
  - { type: check, problem: zh.tone.p017, prompt: "ลองใช้กฎของ 一 ด้วยตัวเอง" }
glossary:
  - { term: พินอิน (拼音 pīnyīn), definition: ระบบเขียนเสียงภาษาจีนกลางด้วยอักษรโรมัน พร้อมเครื่องหมายวรรณยุกต์ }
  - { term: วรรณยุกต์ (声调 shēngdiào), definition: ระดับและทิศทางของเสียงสูงต่ำในพยางค์ ภาษาจีนกลางมี 4 เสียงหลักกับเสียงเบา เสียงต่างกันความหมายก็ต่างกัน }
  - { term: เสียงเบา (轻声 qīngshēng), definition: พยางค์ที่ออกเสียงสั้นและเบา ไม่ใส่เครื่องหมายวรรณยุกต์ เช่น ma ใน māma }
  - { term: การเปลี่ยนเสียงวรรณยุกต์, definition: เสียงที่อ่านจริงต่างจากที่เขียน เช่น เสียง 3 สองพยางค์ติดกัน พยางค์แรกอ่านเป็นเสียง 2 }
flashcards:
  - { front: "เครื่องหมายวรรณยุกต์พินอิน 4 เสียง", back: "ā (1 ระดับสูง) · á (2 ขึ้น) · ǎ (3 ลงแล้วขึ้น) · à (4 ตกลง) · ไม่มีเครื่องหมาย = เสียงเบา" }
  - { front: "วางเครื่องหมายวรรณยุกต์บนสระตัวใด", back: "มี a ใส่บน a · ไม่มี a แต่มี o หรือ e ใส่บนตัวนั้น · iu และ ui ใส่บนตัวหลัง เช่น liú, guì" }
  - { front: "nǐ + hǎo อ่านจริงว่าอย่างไร", back: "ní hǎo เพราะเสียง 3 ที่ตามด้วยเสียง 3 เปลี่ยนเป็นเสียง 2 (แต่ยังเขียนว่า nǐ hǎo)" }
  - { front: "b, d, g ในพินอินใกล้เสียงไทยตัวใด", back: "ใกล้ ป, ต, ก (ไม่มีลม) ส่วน p, t, k ใกล้ พ, ท, ค (มีลม) ไม่ใช่ บ, ด" }
