topic: computer.society.privacy
rows:
  - { framework: au-ac9-digital-technologies, indicators: ["AC9TDIFP01", "AC9TDI2P07", "AC9TDI4P09"], coverage: full, note: "ข้อมูลส่วนบุคคลที่เป็นของเรา ข้อมูลที่แอปและเว็บเก็บไว้ในบัญชีออนไลน์ และความเสี่ยงเมื่อรั่ว" }
  - { framework: au-ac9-digital-technologies, indicators: ["AC9TDI6P10", "AC9TDI8P14"], coverage: full, note: "ร่องรอยดิจิทัลสามทางและความคงทน การตรวจฟอร์มและแอปว่าข้อมูลแต่ละช่องจำเป็นต่อวัตถุประสงค์หรือไม่ และการลดข้อมูลในระบบที่นักเรียนออกแบบเอง" }
  - { framework: au-ac9-digital-technologies, indicators: ["AC9TDI10P14"], coverage: partial, note: "วิจารณ์และจัดการร่องรอยดิจิทัลของระบบด้วยหลักของ PDPA ไทย (เก็บเท่าที่จำเป็น ใช้ตามวัตถุประสงค์ ระยะเวลาเก็บ สิทธิของเจ้าของข้อมูล) ซึ่งคล้าย Australian Privacy Principles แต่ไม่ได้สอนหลัก APP 13 ข้อโดยตรง" }
  - { framework: csta-k12-cs, indicators: ["2-IC-23", "3A-IC-29", "3A-IC-30"], coverage: full, note: "ชั่งการเปิดเผยกับการเก็บเป็นความลับ การเก็บอัตโนมัติด้วยคุกกี้ ตำแหน่ง ประวัติการใช้งาน และการอนุมาน และผลด้านความปลอดภัย กฎหมาย จริยธรรม และเศรษฐกิจ" }
  - { framework: acm-cs2023, indicators: ["SEP-Privacy"], coverage: partial, note: "ผลของการเก็บข้อมูลจำนวนมาก การระบุตัวซ้ำจากข้อมูลที่ลบชื่อแล้ว k-anonymity แฝงชื่อ และกล้องจดจำใบหน้ากับสิทธิพลเมือง ยังไม่มี differential privacy และกรอบกฎหมายหลายประเทศในเชิงลึก" }
