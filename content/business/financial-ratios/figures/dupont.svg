<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="sans-serif" font-size="13">
  <title>การแยกอัตราผลตอบแทนผู้ถือหุ้นแบบดูปองท์</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
  <rect x="280.0" y="20.0" width="200.0" height="60.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="380.0" y="46.0" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="bold">ROE</text>
  <text x="380.0" y="68.0" text-anchor="middle" fill="#1f2937" font-size="11.5">กำไรสุทธิ ÷ ส่วนของผู้ถือหุ้นเฉลี่ย</text>
  <rect x="30.0" y="160.0" width="200.0" height="96.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="130.0" y="186.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">อัตรากำไรสุทธิ</text>
  <text x="130.0" y="210.0" text-anchor="middle" fill="#1f2937" font-size="12">กำไรสุทธิ ÷ ขาย</text>
  <text x="130.0" y="234.0" text-anchor="middle" fill="#6b7280" font-size="11.5">ทำกำไรจากยอดขายได้ดีแค่ไหน</text>
  <line x1="380.0" y1="82.0" x2="130.0" y2="158.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="280.0" y="160.0" width="200.0" height="96.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="380.0" y="186.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">การหมุนของสินทรัพย์</text>
  <text x="380.0" y="210.0" text-anchor="middle" fill="#1f2937" font-size="12">ขาย ÷ สินทรัพย์เฉลี่ย</text>
  <text x="380.0" y="234.0" text-anchor="middle" fill="#6b7280" font-size="11.5">ใช้สินทรัพย์สร้างยอดขายคุ้มแค่ไหน</text>
  <line x1="380.0" y1="82.0" x2="380.0" y2="158.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="530.0" y="160.0" width="200.0" height="96.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="630.0" y="186.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">ตัวคูณทุน</text>
  <text x="630.0" y="210.0" text-anchor="middle" fill="#1f2937" font-size="12">สินทรัพย์เฉลี่ย ÷ ทุนเฉลี่ย</text>
  <text x="630.0" y="234.0" text-anchor="middle" fill="#6b7280" font-size="11.5">ใช้เงินกู้มากแค่ไหน</text>
  <line x1="380.0" y1="82.0" x2="630.0" y2="158.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="255.0" y="214.0" text-anchor="middle" fill="#1f2937" font-size="22" font-weight="bold">×</text>
  <text x="505.0" y="214.0" text-anchor="middle" fill="#1f2937" font-size="22" font-weight="bold">×</text>
  <text x="380.0" y="284.0" text-anchor="middle" fill="#6b7280" font-size="12.5">ทั้งสามตัวคูณกันได้ ROE เพราะ ขาย และ สินทรัพย์เฉลี่ย ตัดกันหมด</text>
</svg>
