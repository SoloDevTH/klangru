      - { match: 128, feedback: "ดูเหมือนคูณ 32 ด้วย 4 การเปลี่ยนกรัมเป็นจำนวนช้อนต้องหาร" }
    solution: "$32 \\div 4 = 8$ ช้อนชา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.nut.p014
    topics: [health.nutrition.basics]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "จากฉลากสมมติในภาพ ข้อใดถูกต้อง (เลือกได้มากกว่าหนึ่งข้อ)"
    figure: { src: nutrition-label.svg, alt: "ฉลากข้อมูลโภชนาการสมมติ หนึ่งหน่วยบริโภคครึ่งซอง 30 กรัม 2 หน่วยบริโภคต่อซอง พลังงาน 150 กิโลแคลอรี ไขมันทั้งหมด 7 กรัม 11% ไขมันอิ่มตัว 3 กรัม โปรตีน 3 กรัม คาร์โบไฮเดรตทั้งหมด 19 กรัม 6% ใยอาหาร 1 กรัม 4% น้ำตาล 6 กรัม โซเดียม 160 มิลลิกรัม 8%" }
    choices:
      - { id: a, text: "ทั้งซองหนัก 60 กรัม", correct: true }
      - { id: b, text: "กินหมดซองได้โซเดียม 320 มิลลิกรัม", correct: true }
      - { id: c, text: "ขนมนี้ให้คาร์โบไฮเดรตมากกว่าไขมัน (คิดเป็นกรัม)", correct: true }
      - { id: d, text: "กินหมดซองได้ใยอาหาร 4% ของปริมาณที่แนะนำต่อวัน", feedback: "4% เป็นของหนึ่งหน่วยบริโภค ทั้งซองได้ 8%" }
      - { id: e, text: "พลังงาน 150 กิโลแคลอรีเป็นของทั้งซอง", feedback: "ตัวเลขทุกตัวในฉลากเป็นของหนึ่งหน่วยบริโภคคือครึ่งซอง" }
    hints:
      - "ตรวจทีละข้อ ข้อใดพูดถึงทั้งซอง ข้อใดพูดถึงหนึ่งหน่วยบริโภค"
      - "ทั้งซอง = ค่าต่อหนึ่งหน่วยบริโภค × 2"
    solution: "ทั้งซอง $30 \\times 2 = 60$ กรัม โซเดียมทั้งซอง $160 \\times 2 = 320$ มิลลิกรัม และคาร์โบไฮเดรต 19 กรัมมากกว่าไขมัน 7 กรัม จึงถูกสามข้อ ส่วนใยอาหารทั้งซองคือ 8% และ 150 กิโลแคลอรีเป็นของครึ่งซอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.nut.p015
    topics: [health.nutrition.basics]
    difficulty: 1
    type: text
    stem: "ฉลากโภชนาการของไทยบอกพลังงานในหน่วยใด (พิมพ์ชื่อหน่วยเป็นภาษาไทยหรือตัวย่อภาษาอังกฤษ)"
    accepted: ["กิโลแคลอรี", "กิโลแคลอรี่", "kcal", "กิโลแคล"]
    hints:
      - "ดูบรรทัด 'พลังงานทั้งหมด' บนฉลาก"
      - "หน่วยนี้เท่ากับ 1,000 แคลอรี"
    misconceptions:
      - { match: "กรัม", feedback: "กรัมเป็นหน่วยของมวล ใช้กับไขมัน โปรตีน คาร์โบไฮเดรต ไม่ใช่พลังงาน" }
      - { match: "แคลอรี", feedback: "เกือบถูก แต่ฉลากใช้กิโลแคลอรี ซึ่งเท่ากับ 1,000 แคลอรี" }
    solution: "ฉลากโภชนาการแสดงพลังงานเป็น กิโลแคลอรี (kcal)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.nut.p016
    topics: [health.nutrition.basics]
    difficulty: 4
    type: numeric
    stem: "อาหารจานหนึ่งให้พลังงานทั้งหมด 600 กิโลแคลอรี และมีไขมัน 25 กรัม พลังงานจากไขมันคิดเป็นร้อยละเท่าใดของพลังงานทั้งหมด (ตอบเป็นตัวเลขในหน่วย % ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 37.5, tolerance: 0.4, unit: "%" }
    hints:
      - "กรัมกับกิโลแคลอรีเทียบกันตรง ๆ ไม่ได้ ต้องแปลงไขมันเป็นพลังงานก่อน"
      - "พลังงานจากไขมัน = 25 × 9 แล้วหารด้วย 600"
    misconceptions:
      - { match: 4.2, feedback: "นั่นคือ $\\frac{25}{600} \\times 100$ ซึ่งเอากรัมไปหารกิโลแคลอรี ต้องแปลงไขมันเป็นพลังงาน ($\\times 9$) ก่อน" }
      - { match: 16.7, feedback: "ดูเหมือนใช้ 4 กิโลแคลอรีต่อกรัมกับไขมัน ไขมันให้ 9 กิโลแคลอรีต่อกรัม" }
    solution: "พลังงานจากไขมัน $= 25 \\times 9 = 225\\ \\mathrm{kcal}$ คิดเป็น $\\frac{225}{600} \\times 100 = 37.5\\%$ ของพลังงานทั้งหมด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.nut.p017
    topics: [health.nutrition.basics]
    difficulty: 4
    type: numeric
    stem: "ฉลากเครื่องดื่มธัญพืชบอกว่า หนึ่งหน่วยบริโภคให้พลังงาน 250 กิโลแคลอรี มีคาร์โบไฮเดรต 30 กรัม และโปรตีน 10 กรัม แต่ตัวเลขไขมันเปื้อนอ่านไม่ออก ไขมันมีประมาณกี่กรัม (ตอบเป็นตัวเลขในหน่วยกรัม)"
    answer: { value: 10, tolerance: 0.1, unit: g }
    hints:
      - "พลังงานทั้งหมด = พลังงานจากคาร์โบไฮเดรต + โปรตีน + ไขมัน"
      - "หาพลังงานที่เหลือหลังหักคาร์โบไฮเดรตและโปรตีน แล้วหารด้วยพลังงานต่อกรัมของไขมัน"
    misconceptions:
      - { match: 22.5, feedback: "พลังงานที่เหลือ 90 กิโลแคลอรีถูกแล้ว แต่ต้องหารด้วย 9 (ไขมัน) ไม่ใช่ 4" }
      - { match: 90, feedback: "90 คือพลังงานจากไขมันในหน่วยกิโลแคลอรี ยังต้องหารด้วย 9 เพื่อเปลี่ยนเป็นกรัม" }
    solution: "พลังงานจากคาร์โบไฮเดรตและโปรตีน $= 4(30) + 4(10) = 160\\ \\mathrm{kcal}$ เหลือพลังงานจากไขมัน $250 - 160 = 90\\ \\mathrm{kcal}$ ไขมัน $= 90 \\div 9 = 10$ กรัม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.nut.p018
    topics: [health.nutrition.basics]
    difficulty: 2
    type: numeric
    stem: "นักศึกษาอายุ 19 ปี ใช้ธงโภชนาการระดับ 2,000 กิโลแคลอรี ซึ่งแนะนำข้าว แป้ง 10 ทัพพีต่อวัน เช้านี้กินข้าวต้ม 2 ทัพพี กลางวันกินข้าวมันไก่ 4 ทัพพี มื้อเย็นควรกินข้าว แป้ง อีกประมาณกี่ทัพพีจึงครบตามคำแนะนำ (ตอบเป็นตัวเลขในหน่วยทัพพี)"
    answer: { value: 4, unit: ทัพพี }
    hints:
      - "รวมที่กินไปแล้วก่อน"
      - "นำ 10 ลบด้วยผลรวมของมื้อเช้าและกลางวัน"
    misconceptions:
      - { match: 6, feedback: "ดูเหมือนหักเฉพาะมื้อกลางวัน อย่าลืมมื้อเช้า 2 ทัพพี" }
      - { match: 8, feedback: "ดูเหมือนหักเฉพาะมื้อเช้า อย่าลืมมื้อกลางวัน 4 ทัพพี" }
    solution: "กินไปแล้ว $2 + 4 = 6$ ทัพพี เหลือ $10 - 6 = 4$ ทัพพี ตัวเลขนี้เป็นค่าประมาณ ความต้องการจริงขึ้นกับกิจกรรมของแต่ละวัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.nut.p019
    topics: [health.nutrition.basics]
    difficulty: 4
    type: mcq
    stem: "วัยรุ่นอายุ 16 ปี ใช้ธงโภชนาการระดับ 2,000 กิโลแคลอรี รายการใดตรงกับปริมาณต่อวันที่แนะนำ"
    choices:
      - { id: a, text: "ข้าว แป้ง 10 ทัพพี ผัก 5 ทัพพี ผลไม้ 4 ส่วน เนื้อสัตว์ 9 ช้อนกินข้าว นม 1 แก้ว", correct: true }
      - { id: b, text: "ข้าว แป้ง 8 ทัพพี ผัก 4 ทัพพี ผลไม้ 3 ส่วน เนื้อสัตว์ 6 ช้อนกินข้าว นม 2 แก้ว", feedback: "นี่คือระดับ 1,600 กิโลแคลอรี สำหรับเด็กอายุ 6–13 ปี หญิงวัยทำงาน และผู้สูงอายุ" }
      - { id: c, text: "ข้าว แป้ง 12 ทัพพี ผัก 6 ทัพพี ผลไม้ 5 ส่วน เนื้อสัตว์ 12 ช้อนกินข้าว นม 1 แก้ว", feedback: "นี่คือระดับ 2,400 กิโลแคลอรี สำหรับผู้ที่ใช้แรงมาก เช่น เกษตรกร นักกีฬา" }
      - { id: d, text: "ข้าว แป้ง 5 ทัพพี ผัก 10 ทัพพี ผลไม้ 9 ส่วน เนื้อสัตว์ 4 ช้อนกินข้าว นม 1 แก้ว", feedback: "ปริมาณข้าวกับผักสลับกัน ตามธงโภชนาการ ข้าว แป้ง ต้องมากที่สุด" }
    hints:
      - "วัยรุ่นอายุ 14–25 ปีอยู่ระดับพลังงานใด"
      - "ระดับ 2,000 กิโลแคลอรีอยู่ตรงกลางระหว่าง 1,600 กับ 2,400 ปริมาณจึงอยู่ระหว่างสองระดับนั้น"
    solution: "วัยรุ่นอายุ 14–25 ปีใช้ระดับ 2,000 กิโลแคลอรี: ข้าว แป้ง 10 ทัพพี ผัก 5 ทัพพี ผลไม้ 4 ส่วน เนื้อสัตว์ 9 ช้อนกินข้าว นม 1 แก้ว และใช้น้ำมัน น้ำตาล เกลือ แต่น้อย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.nut.p020
    topics: [health.nutrition.basics]
    difficulty: 4
    type: numeric
    stem: "บะหมี่กึ่งสำเร็จรูปรวมเครื่องปรุงซองหนึ่งมีโซเดียม 1,500 มิลลิกรัม เกลือแกงมีโซเดียมประมาณ 2 ใน 5 ของมวล (เกลือ 5 กรัมมีโซเดียม 2 กรัม) โซเดียมนี้มาจากเกลือประมาณกี่กรัม (ตอบเป็นตัวเลขในหน่วยกรัม ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 3.75, tolerance: 0.04, unit: g }
    hints:
      - "เปลี่ยนมิลลิกรัมเป็นกรัมก่อน: 1,500 มิลลิกรัม = 1.5 กรัม"
      - "เกลือมีมวลมากกว่าโซเดียม 5/2 = 2.5 เท่า"
    misconceptions:
      - { match: 0.6, feedback: "ดูเหมือนหาร 1.5 ด้วย 2.5 เกลือหนักกว่าโซเดียมที่อยู่ในนั้น จึงต้องคูณ" }
      - { match: 3750, feedback: "ลืมเปลี่ยนมิลลิกรัมเป็นกรัม 1,500 มิลลิกรัม = 1.5 กรัม" }
    solution: "โซเดียม $1{,}500\\ \\mathrm{mg} = 1.5\\ \\mathrm{g}$ เกลือ $= 1.5 \\times \\frac{5}{2} = 3.75$ กรัม เกือบถึง 5 กรัมที่ WHO แนะนำเป็นปริมาณสูงสุดต่อวันสำหรับผู้ใหญ่ จากบะหมี่เพียงซองเดียว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.nut.p021
    topics: [health.nutrition.basics]
    difficulty: 5
    type: numeric
    stem: "ซีเรียลหนึ่งหน่วยบริโภค (1 ถ้วย) มีคาร์โบไฮเดรต 24 กรัม โปรตีน 6 กรัม และไขมัน 8 กรัม เช้านี้ใส่ซีเรียลกิน 1.5 ถ้วย ได้พลังงานจากซีเรียลกี่กิโลแคลอรี (ไม่นับนมที่เติม ตอบเป็นตัวเลขในหน่วย kcal)"
    answer: { value: 288, tolerance: 1, unit: kcal }
    hints:
      - "หาพลังงานของหนึ่งหน่วยบริโภคก่อนด้วย $4C + 4P + 9F$"
      - "คูณผลด้วยจำนวนหน่วยบริโภคที่กินจริง (1.5)"
    misconceptions:
      - { match: 192, feedback: "นั่นคือพลังงานของ 1 ถ้วย แต่กินไป 1.5 ถ้วย" }
      - { match: 228, feedback: "ดูเหมือนใช้ 4 กิโลแคลอรีต่อกรัมกับไขมัน ($38 \\times 4 \\times 1.5$) ไขมันต้องคูณ 9" }
    solution: "1 ถ้วย: $4(24) + 4(6) + 9(8) = 96 + 24 + 72 = 192\\ \\mathrm{kcal}$ กิน 1.5 ถ้วย: $192 \\times 1.5 = 288\\ \\mathrm{kcal}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.nut.p022
    topics: [health.nutrition.basics]
    difficulty: 5
    type: numeric
    stem: "นักเรียนคนหนึ่งใช้พลังงานประมาณ 1,800 กิโลแคลอรีต่อวัน ดื่มน้ำหวานขวดหนึ่งที่มีน้ำตาลที่เติม 35 กรัม น้ำตาลนี้ให้พลังงานคิดเป็นร้อยละเท่าใดของพลังงานทั้งวัน (ตอบเป็นตัวเลขในหน่วย % ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 7.8, tolerance: 0.1, unit: "%" }
    hints:
      - "น้ำตาลเป็นคาร์โบไฮเดรต ให้พลังงาน 4 กิโลแคลอรีต่อกรัม"
      - "หาพลังงานจากน้ำตาลก่อน แล้วหารด้วย 1,800 คูณ 100"
    misconceptions:
      - { match: 1.9, feedback: "นั่นคือ $\\frac{35}{1800} \\times 100$ ซึ่งเอากรัมไปหารกิโลแคลอรี ต้องแปลงน้ำตาลเป็นพลังงานก่อน ($\\times 4$)" }
      - { match: 17.5, feedback: "ดูเหมือนใช้ 9 กิโลแคลอรีต่อกรัม น้ำตาลเป็นคาร์โบไฮเดรต ให้ 4 กิโลแคลอรีต่อกรัม" }
    solution: "พลังงานจากน้ำตาล $= 35 \\times 4 = 140\\ \\mathrm{kcal}$ คิดเป็น $\\frac{140}{1800} \\times 100 \\approx 7.8\\%$ ใกล้ขีด 10% ที่ WHO แนะนำ จากเครื่องดื่มขวดเดียว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.nut.p023
    topics: [health.nutrition.basics]
    difficulty: 5
    type: expression
    stem: "อาหารชนิดหนึ่งมีคาร์โบไฮเดรต $c$ กรัม โปรตีน $p$ กรัม และไขมัน $f$ กรัม เขียนพลังงานทั้งหมด $E$ (กิโลแคลอรี) ในรูปของ $c$, $p$ และ $f$"
    prefix: "E ="
    answer: { latex: "4c+4p+9f", variables: [c, p, f] }
    hints:
      - "สารอาหารแต่ละชนิดให้พลังงานต่อกรัมเท่าใด"
      - "คูณมวลแต่ละชนิดด้วยพลังงานต่อกรัมของมัน แล้วบวกกัน"
    misconceptions:
      - { match: "4c+4p+4f", feedback: "ไขมันให้ 9 กิโลแคลอรีต่อกรัม ไม่ใช่ 4" }
      - { match: "4c+9p+4f", feedback: "สลับค่าของโปรตีนกับไขมัน โปรตีนให้ 4 ไขมันให้ 9 กิโลแคลอรีต่อกรัม" }
    solution: "$E = 4c + 4p + 9f$ เพราะคาร์โบไฮเดรตและโปรตีนให้ $4\\ \\mathrm{kcal/g}$ ไขมันให้ $9\\ \\mathrm{kcal/g}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.nut.p024
    topics: [health.nutrition.basics]
    difficulty: 4
    type: mcq
    stem: "เพื่อนบอกว่า \"ไขมันทำให้อ้วน ต้องงดไขมันให้หมด\" ข้อใดถูกต้องที่สุด"
    choices:
      - { id: a, text: "ร่างกายยังต้องการไขมัน ควรกินพอเหมาะ และเลือกไขมันจากพืชหรือปลามากกว่าไขมันอิ่มตัวและไขมันทรานส์", correct: true }
      - { id: b, text: "ถูกต้อง ร่างกายไม่ต้องการไขมันเลย", feedback: "ไขมันจำเป็นต่อการดูดซึมวิตามิน A D E K และเป็นส่วนประกอบของเซลล์ กรดไขมันจำเป็นบางชนิดร่างกายสร้างเองไม่ได้" }
      - { id: c, text: "ไขมันกินได้ไม่จำกัด เพราะคาร์โบไฮเดรตต่างหากที่ทำให้อ้วน", feedback: "พลังงานที่ได้เกินความต้องการ ไม่ว่าจากสารอาหารใด ทำให้น้ำหนักเพิ่มได้ และไขมันให้พลังงานต่อกรัมสูงที่สุด" }
      - { id: d, text: "ไขมันทุกชนิดมีผลต่อสุขภาพเหมือนกัน", feedback: "WHO แนะนำให้จำกัดไขมันอิ่มตัวไม่เกิน 10% และไขมันทรานส์ไม่เกิน 1% ของพลังงาน และใช้ไขมันไม่อิ่มตัวแทน ไขมันแต่ละชนิดจึงต่างกัน" }
    hints:
      - "นึกถึงหมู่ที่ 5 ในอาหารหลัก 5 หมู่ ทำไมต้องมีหมู่นี้"
      - "ไขมันมีหลายชนิด บางชนิดควรจำกัด บางชนิดเป็นทางเลือกที่ดีกว่า"
    solution: "ไขมันเป็นสารอาหารที่จำเป็น ช่วยดูดซึมวิตามินที่ละลายในไขมันและสร้างเซลล์ ปัญหาอยู่ที่ปริมาณและชนิด WHO แนะนำให้ไขมันรวมไม่เกินราว 30% ของพลังงานในผู้ใหญ่ จำกัดไขมันอิ่มตัวและไขมันทรานส์ และใช้ไขมันไม่อิ่มตัวจากพืชหรือปลาแทน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.nut.p025
    topics: [health.nutrition.basics]
    difficulty: 2
    type: match
    stem: "อาหารกลางวันที่โรงเรียนมีของต่อไปนี้ จับคู่แต่ละอย่างกับอาหารหลักหมู่ที่เป็นหลัก"
    pairs:
      - { left: "ไข่ต้ม", right: "หมู่ 1" }
      - { left: "ข้าวกล้อง", right: "หมู่ 2" }
      - { left: "ผักบุ้งผัด (ตัวผัก)", right: "หมู่ 3" }
      - { left: "มะละกอสุก", right: "หมู่ 4" }
      - { left: "น้ำมันรำข้าวที่ใช้ผัด", right: "หมู่ 5" }
    hints:
      - "ถามตัวเองว่าอาหารแต่ละอย่างให้สารอาหารใดมากที่สุด"
      - "ไข่ให้โปรตีน ข้าวให้แป้ง ผักกับผลไม้แยกกันคนละหมู่ น้ำมันให้ไขมัน"
    solution: "ไข่ต้ม → หมู่ 1 (โปรตีน), ข้าวกล้อง → หมู่ 2 (คาร์โบไฮเดรต), ผักบุ้ง → หมู่ 3 (ผัก), มะละกอ → หมู่ 4 (ผลไม้), น้ำมันรำข้าว → หมู่ 5 (ไขมัน) อาหารมื้อนี้จึงครบ 5 หมู่"
