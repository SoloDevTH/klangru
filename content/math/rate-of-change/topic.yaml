id: math.calculus.rate-of-change
subject: math
title: { th: อัตราการเปลี่ยนแปลง, en: Rates of change }
summary: หาอัตราการเปลี่ยนแปลงเฉลี่ยจากความชันของเส้นตัด แล้วหดช่วงให้เล็กลงจนได้อัตราการเปลี่ยนแปลงขณะหนึ่งด้วยแนวคิดลิมิต
difficulty: 6.5
minutes: 35
prerequisites: [math.functions.linear-graphs, math.functions.functions-intro]
encompasses:
  - { id: math.functions.linear-graphs, weight: 0.4 }
  - { id: math.functions.functions-intro, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: อัตราเฉลี่ยจากตาราง พร้อมหน่วยและความหมาย
    problem: "ตาราง (ตัวเลขสมมติ) แสดงจำนวนผู้โดยสารรถไฟฟ้าสายหนึ่งต่อวัน ปี 2562: 800 พันคน ปี 2563: 450 พันคน ปี 2564: 380 พันคน ปี 2565: 620 พันคน หาอัตราการเปลี่ยนแปลงเฉลี่ยจากปี 2563 ถึง 2565 และจากปี 2562 ถึง 2564"
    steps:
      - text: "ช่วง 2563–2565: $\\Delta y = 620 - 450 = 170$ พันคน และ $\\Delta x = 2565 - 2563 = 2$ ปี"
      - text: "อัตราเฉลี่ย $= \\dfrac{170}{2} = 85$ พันคนต่อปี"
        why: "หน่วยของอัตราคือหน่วยของ $y$ (พันคน) ต่อหน่วยของ $x$ (ปี)"
      - text: "ช่วง 2562–2564: $\\dfrac{380 - 800}{2564 - 2562} = \\dfrac{-420}{2} = -210$ พันคนต่อปี"
        why: "ลบค่าปลายช่วงด้วยค่าต้นช่วงทั้งข้างบนและข้างล่าง เครื่องหมายจึงถูกต้อง"
      - text: "แปลความหมาย: ช่วงแรกผู้โดยสารเพิ่มขึ้นเฉลี่ยปีละ 85 พันคน ช่วงหลังลดลงเฉลี่ยปีละ 210 พันคน"
        why: "อัตราเป็นลบบอกว่าค่าลดลงโดยรวม แม้ระหว่างทางจะขึ้นลงอย่างไรก็ตาม"
    answer: "$85$ พันคนต่อปี (เพิ่มขึ้น) และ $-210$ พันคนต่อปี (ลดลง)"
  - { type: check, problem: math.roc.p004, prompt: "ลองหาอัตราเฉลี่ยพร้อมหน่วย" }
  - type: figure
    src: secant-tangent.svg
    alt: "กราฟ y = x² มีเส้นตัดประสีส้มผ่านจุด (1, 1) และ (2, 4) ความชัน 3 และเส้นสัมผัสสีเขียวแตะกราฟที่จุด (1, 1) ความชัน 2 เส้นตัดชันกว่าเส้นสัมผัส"
    caption: "เมื่อจุดที่สองเลื่อนเข้าหา $(1, 1)$ เส้นตัดหมุนเข้าหาเส้นสัมผัส ความชันจาก 3 ลดลงเข้าใกล้ 2"
  - type: worked-example
    title: ความเร็วขณะหนึ่งของลูกบอลด้วยลิมิต
    problem: "ลูกบอลมีความสูง $s(t) = 20t - 5t^2$ เมตร เมื่อเวลา $t$ วินาที หาความเร็วขณะหนึ่งที่ $t = 1$"
    steps:
      - text: "ใช้ช่วง $[1, 1 + k]$: $s(1 + k) = 20(1 + k) - 5(1 + k)^2 = 15 + 10k - 5k^2$"
        why: "กระจาย $(1 + k)^2 = 1 + 2k + k^2$ แล้วคูณ $-5$ และใช้ตัวแปร $k$ แทน $h$ เพื่อไม่ให้สับสนกับความสูง"
      - text: "$s(1) = 20 - 5 = 15$ จึงได้ $s(1 + k) - s(1) = 10k - 5k^2$"
      - text: "หารด้วย $k$: $\\dfrac{10k - 5k^2}{k} = 10 - 5k$ (เมื่อ $k \\ne 0$)"
        why: "ต้องตัด $k$ ออกก่อน ถ้าแทน $k = 0$ ทันทีจะได้ $\\tfrac{0}{0}$"
      - text: "ให้ $k \\to 0$: $10 - 5k \\to 10$"
      - text: "ตรวจด้วยตัวเลข: ช่วง $[1, 1.01]$ ได้ความเร็วเฉลี่ย $10 - 0.05 = 9.95\\ \\mathrm{m/s}$ ใกล้ $10$ จริง"
    answer: "ความเร็วขณะหนึ่งที่ $t = 1$ คือ $10\\ \\mathrm{m/s}$ (ขาขึ้น) ต่างจากความเร็วเฉลี่ยในช่วง $[1, 2]$ ซึ่งเท่ากับ $5\\ \\mathrm{m/s}$"
  - { type: check, problem: math.roc.p005, prompt: "เส้นตัดเข้าใกล้อะไร" }
  - type: interactive
    title: เส้นตัดหมุนเข้าหาเส้นสัมผัส
    caption: เส้นตรงผ่านจุด (1, 1) และ (1 + h, (1 + h)²) บนกราฟ y = x² ลองลด h เข้าหา 0 จากทั้งสองฝั่ง แล้วสังเกตว่าเส้นตัดเข้าใกล้เส้นสัมผัสที่มีความชัน 2
    widget:
      kind: function-plot
      functions: ["x^2", "(2+h)(x-1)+1"]
      sliders:
        - { name: h, min: -2, max: 3, step: 0.1, value: 2, label: ความกว้างของช่วง h }
      x: [-2, 4]
      y: [-2, 12]
glossary:
  - { term: อัตราการเปลี่ยนแปลงเฉลี่ย, definition: "การเปลี่ยนแปลงของ $y$ หารด้วยการเปลี่ยนแปลงของ $x$ บนช่วง $[a, b]$ คือ $\\frac{f(b) - f(a)}{b - a}$" }
  - { term: เส้นตัด, definition: เส้นตรงที่ลากผ่านสองจุดบนกราฟ ความชันของมันคืออัตราการเปลี่ยนแปลงเฉลี่ยบนช่วงนั้น }
  - { term: ลิมิต, definition: ค่าที่ปริมาณหนึ่งเข้าใกล้มากขึ้นเรื่อย ๆ เมื่อตัวแปรเข้าใกล้ค่าที่กำหนด แม้จะแทนค่านั้นตรง ๆ ไม่ได้ }
  - { term: อัตราการเปลี่ยนแปลงขณะหนึ่ง, definition: "ลิมิตของอัตราเฉลี่ยบนช่วง $[a, a + h]$ เมื่อ $h \\to 0$ เท่ากับความชันของเส้นสัมผัสที่ $x = a$" }
flashcards:
  - { front: "สูตรอัตราการเปลี่ยนแปลงเฉลี่ยบนช่วง $[a, b]$", back: "$\\frac{f(b) - f(a)}{b - a}$ เท่ากับความชันของเส้นตัด" }
  - { front: "หน่วยของอัตราการเปลี่ยนแปลงคืออะไร", back: "หน่วยของ $y$ ต่อหน่วยของ $x$ เช่น m ต่อ s ได้ $\\mathrm{m/s}$" }
  - { front: "อัตราการเปลี่ยนแปลงขณะหนึ่งที่ $x = a$", back: "$\\lim_{h \\to 0} \\frac{f(a + h) - f(a)}{h}$ คือความชันของเส้นสัมผัส" }
  - { front: "อัตราเฉลี่ยของ $f(x) = mx + c$ บนช่วงใดก็ตาม", back: "เท่ากับ $m$ เสมอ เพราะกราฟเป็นเส้นตรง" }
