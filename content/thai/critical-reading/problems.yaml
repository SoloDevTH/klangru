- id: thai.reading.critical-reading.p015
  topics:
  - thai.reading.critical-reading
  difficulty: 5
  type: mcq
  stem: อ่านบทความในภาพ ข้อใดเป็น **การแสดงความคิดเห็นโต้แย้งและเสนอความคิดใหม่** อย่างมีเหตุผลที่สุด
  figure:
    src: school-time-editorial.svg
    alt: บทความแสดงความคิดเห็นสมมติ ถึงเวลาเลื่อนเวลาเข้าเรียน 6 ประโยค (1) โรงเรียนทุกแห่งควรเลื่อนเวลาเข้าเรียนจากแปดโมงเป็นเก้าโมงเช้า (2) งานวิจัยหลายชิ้นพบว่าวัยรุ่นมักง่วงช้าและตื่นสายกว่าเด็กเล็กและผู้ใหญ่ (3) ห้องของฉันมีเพื่อนห้าคนหลับในคาบแรก แสดงว่านักเรียนทั้งประเทศนอนไม่พอ (4) คนที่ค้านเรื่องนี้คือคนที่ไม่เคยเข้าใจหัวอกเด็กเลย (5) ถ้าไม่เลื่อนเวลา เราก็ต้องยอมให้นักเรียนสอบตกกันทั้งประเทศ (6) เวลาเข้าเรียนใหม่จะทำให้ทุกคนมีความสุขและอนาคตสดใส
  choices:
  - id: a
    text: ประโยค (2) มีน้ำหนักเพราะอ้างงานวิจัย แต่ควรบอกที่มา ส่วน (3)–(5) เป็นเหตุผลวิบัติ จึงเสนอให้ทดลองเลื่อนเวลาในโรงเรียนนำร่องหนึ่งภาคเรียน แล้วเทียบการมาสายและคะแนนก่อนและหลัง
    correct: true
    feedback: ถูก ยอมรับส่วนที่ดี ชี้จุดอ่อนพร้อมเหตุผล และเสนอวิธีใหม่ที่ตรวจได้
  - id: b
    text: ผู้เขียนบทความนี้ขี้เกียจตื่นเช้าเอง
    feedback: โจมตีตัวบุคคล
  - id: c
    text: ไม่เห็นด้วยทั้งหมด เพราะโรงเรียนเข้าแปดโมงมานานแล้ว
    feedback: อ้างความเคยชิน ไม่มีเหตุผลอื่น
  - id: d
    text: เห็นด้วยทั้งหมด เพราะบทความเขียนดี
    feedback: ไม่ได้วิเคราะห์เหตุผล
  hints:
  - ความเห็นที่ดียอมรับส่วนที่หนักแน่น
  - ความคิดใหม่ควรตรวจสอบได้
  solution: ข้อแรก **ประเมินทั้งจุดแข็งจุดอ่อน** และ **เสนอการทดลองนำร่อง** ที่วัดผลได้
