<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" font-family="sans-serif" font-size="13">
<title>ตัวแบบตรรกะของโครงการคัดแยกขยะต้นทาง จากปัจจัยนำเข้าถึงผลกระทบ</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="900" height="250" fill="#ffffff"/>
<text x="450.0" y="28.0" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">ตัวแบบตรรกะ: โครงการคัดแยกขยะต้นทางของเทศบาล (สมมติ)</text>
<rect x="20.0" y="60.0" width="158.0" height="120.0" rx="8" fill="#f7f7f7" stroke="#1f5fa8" stroke-width="2"/>
<text x="99.0" y="90.0" text-anchor="middle" font-size="15" fill="#1f5fa8" font-weight="bold">ปัจจัยนำเข้า</text>
<text x="99.0" y="125.0" text-anchor="middle" font-size="13" fill="#222">งบ 3 ล้านบาท</text>
<text x="99.0" y="147.0" text-anchor="middle" font-size="13" fill="#222">ถังแยกขยะ เจ้าหน้าที่</text>
<line x1="180.0" y1="120.0" x2="198.0" y2="120.0" stroke="#222" stroke-width="2" marker-end="url(#ah)"/>
<rect x="200.0" y="60.0" width="158.0" height="120.0" rx="8" fill="#f7f7f7" stroke="#2e7d32" stroke-width="2"/>
<text x="279.0" y="90.0" text-anchor="middle" font-size="15" fill="#2e7d32" font-weight="bold">กิจกรรม</text>
<text x="279.0" y="125.0" text-anchor="middle" font-size="13" fill="#222">อบรมชุมชน</text>
<text x="279.0" y="147.0" text-anchor="middle" font-size="13" fill="#222">เก็บขยะแยกประเภท</text>
<line x1="360.0" y1="120.0" x2="378.0" y2="120.0" stroke="#222" stroke-width="2" marker-end="url(#ah)"/>
<rect x="380.0" y="60.0" width="158.0" height="120.0" rx="8" fill="#f7f7f7" stroke="#b26a00" stroke-width="2"/>
<text x="459.0" y="90.0" text-anchor="middle" font-size="15" fill="#b26a00" font-weight="bold">ผลผลิต</text>
<text x="459.0" y="125.0" text-anchor="middle" font-size="13" fill="#222">2,000 ครัวเรือน</text>
<text x="459.0" y="147.0" text-anchor="middle" font-size="13" fill="#222">ได้รับถังและอบรม</text>
<line x1="540.0" y1="120.0" x2="558.0" y2="120.0" stroke="#222" stroke-width="2" marker-end="url(#ah)"/>
<rect x="560.0" y="60.0" width="158.0" height="120.0" rx="8" fill="#f7f7f7" stroke="#7b1fa2" stroke-width="2"/>
<text x="639.0" y="90.0" text-anchor="middle" font-size="15" fill="#7b1fa2" font-weight="bold">ผลลัพธ์</text>
<text x="639.0" y="125.0" text-anchor="middle" font-size="13" fill="#222">ขยะเข้าหลุมฝังกลบ</text>
<text x="639.0" y="147.0" text-anchor="middle" font-size="13" fill="#222">ลดลง 30%</text>
<line x1="720.0" y1="120.0" x2="738.0" y2="120.0" stroke="#222" stroke-width="2" marker-end="url(#ah)"/>
<rect x="740.0" y="60.0" width="158.0" height="120.0" rx="8" fill="#f7f7f7" stroke="#c62828" stroke-width="2"/>
<text x="819.0" y="90.0" text-anchor="middle" font-size="15" fill="#c62828" font-weight="bold">ผลกระทบ</text>
<text x="819.0" y="125.0" text-anchor="middle" font-size="13" fill="#222">น้ำชะขยะลดลง</text>
<text x="819.0" y="147.0" text-anchor="middle" font-size="13" fill="#222">สุขภาพชุมชนดีขึ้น</text>
<line x1="20.0" y1="205.0" x2="538.0" y2="205.0" stroke="#1f5fa8" stroke-width="2"/>
<text x="279.0" y="228.0" text-anchor="middle" font-size="13" fill="#1f5fa8">หน่วยงานควบคุมได้มาก</text>
<line x1="560.0" y1="205.0" x2="898.0" y2="205.0" stroke="#c62828" stroke-width="2"/>
<text x="729.0" y="228.0" text-anchor="middle" font-size="13" fill="#c62828">มีปัจจัยภายนอกร่วมกำหนด</text>
</svg>
