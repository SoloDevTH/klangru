      - "คิดถึงผลต่อตัวเองและผลต่อคนอื่น"
    solution: "สุขบัญญัติได้ผลเมื่อทำสม่ำเสมอ ช่วยป้องกันโรค ทำให้กายใจแข็งแรง และช่วยให้ครอบครัวและสังคมมีสุขภาพดี"
