#   และต้องแสดงประกาศลิขสิทธิ์ของเจ้าของ
# - ยังไม่ได้ยืนยันว่าเงื่อนไขนี้ครอบคลุมการเผยแพร่ซ้ำภายใต้ CC BY-SA ซึ่งเปิดให้ทุกคนดัดแปลงและใช้เชิงพาณิชย์ได้
