problems:
  - id: math.tri.p001
    topics: [math.geometry.triangles]
    difficulty: 1
    type: numeric
    stem: "สามเหลี่ยมรูปหนึ่งมีมุมสองมุมขนาด $50^\\circ$ และ $60^\\circ$ มุมที่สามมีขนาดกี่องศา"
    answer: { value: 70, unit: องศา }
    hints:
      - "มุมภายในทั้งสามของสามเหลี่ยมรวมกันได้เท่าใด"
      - "ลบผลรวมของสองมุมที่รู้ออกจาก $180^\\circ$"
    misconceptions:
      - { match: 250, feedback: "ดูเหมือนใช้ $360^\\circ$ แต่ผลบวกมุมภายในของสามเหลี่ยมคือ $180^\\circ$ ($360^\\circ$ เป็นของรูปสี่เหลี่ยม)" }
      - { match: 110, feedback: "นั่นคือผลรวม $50^\\circ + 60^\\circ$ ยังต้องนำไปลบออกจาก $180^\\circ$" }
    solution: "$180^\\circ - (50^\\circ + 60^\\circ) = 180^\\circ - 110^\\circ = 70^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.tri.p002
    topics: [math.geometry.triangles]
    difficulty: 1
    type: mcq
    stem: "สามเหลี่ยมที่มีด้านยาว 5 cm, 5 cm และ 8 cm เป็นสามเหลี่ยมชนิดใด (แบ่งตามด้าน)"
    choices:
      - { id: a, text: "สามเหลี่ยมหน้าจั่ว", correct: true }
      - { id: b, text: "สามเหลี่ยมด้านเท่า", feedback: "สามเหลี่ยมด้านเท่าต้องยาวเท่ากันทั้งสามด้าน แต่ด้านที่สามยาว 8 cm" }
      - { id: c, text: "สามเหลี่ยมด้านไม่เท่า", feedback: "มีสองด้านที่ยาว 5 cm เท่ากัน จึงไม่ใช่ด้านไม่เท่า" }
      - { id: d, text: "สามเหลี่ยมมุมฉาก", feedback: "มุมฉากเป็นการแบ่งตามมุม และด้าน 5, 5, 8 ไม่เป็นไปตามทฤษฎีบทพีทาโกรัส ($5^2 + 5^2 = 50 \\ne 64$)" }
    hints:
      - "นับว่ามีด้านที่ยาวเท่ากันกี่ด้าน"
      - "สามเหลี่ยมที่มีด้านยาวเท่ากันสองด้านมีชื่อเรียกเฉพาะ"
    solution: "มีด้านยาวเท่ากันสองด้าน (5 cm) จึงเป็นสามเหลี่ยมหน้าจั่ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.tri.p003
    topics: [math.geometry.triangles]
    difficulty: 2
    type: match
    stem: "จับคู่ชนิดของสามเหลี่ยมกับสมบัติของมัน"
    pairs:
      - { left: "สามเหลี่ยมด้านเท่า", right: "มุมทุกมุมมีขนาด $60^\\circ$" }
      - { left: "สามเหลี่ยมหน้าจั่ว", right: "มีด้านยาวเท่ากันสองด้าน และมุมที่ฐานเท่ากัน" }
      - { left: "สามเหลี่ยมมุมฉาก", right: "มีมุมหนึ่งขนาด $90^\\circ$" }
      - { left: "สามเหลี่ยมมุมป้าน", right: "มีมุมหนึ่งมากกว่า $90^\\circ$" }
      - { left: "สามเหลี่ยมด้านไม่เท่า", right: "ไม่มีด้านใดยาวเท่ากันเลย" }
    hints:
      - "ชื่อบางชนิดบอกเรื่องด้าน บางชนิดบอกเรื่องมุม"
      - "สามเหลี่ยมด้านเท่าแบ่ง $180^\\circ$ ให้สามมุมเท่ากัน"
      - "ดูคำว่า \"ฉาก\" และ \"ป้าน\" ซึ่งเป็นชื่อชนิดของมุม"
    solution: "ด้านเท่า → มุมละ $180^\\circ \\div 3 = 60^\\circ$ | หน้าจั่ว → ด้านเท่ากันสองด้าน มุมที่ฐานเท่ากัน | มุมฉาก → มีมุม $90^\\circ$ | มุมป้าน → มีมุมมากกว่า $90^\\circ$ | ด้านไม่เท่า → ไม่มีด้านเท่ากัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.tri.p004
    topics: [math.geometry.triangles]
    difficulty: 2
    type: numeric
    stem: "สามเหลี่ยมหน้าจั่วรูปหนึ่งมีมุมยอดขนาด $40^\\circ$ มุมที่ฐานแต่ละมุมมีขนาดกี่องศา"
    answer: { value: 70, unit: องศา }
    hints:
      - "มุมที่ฐานของสามเหลี่ยมหน้าจั่วมีสองมุมและมีขนาดเท่ากัน"
      - "ลบมุมยอดออกจาก $180^\\circ$ แล้วแบ่งให้มุมที่ฐานสองมุมเท่า ๆ กัน"
    misconceptions:
      - { match: 140, feedback: "$140^\\circ$ คือผลรวมของมุมที่ฐานทั้งสองมุม ยังต้องหารสอง" }
      - { match: 40, feedback: "มุมที่ฐานไม่ได้เท่ากับมุมยอด มุมที่เท่ากันคือมุมที่ฐานสองมุม" }
    solution: "มุมที่ฐานรวมกัน $= 180^\\circ - 40^\\circ = 140^\\circ$ แต่ละมุม $= 140^\\circ \\div 2 = 70^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.tri.p005
    topics: [math.geometry.triangles]
    difficulty: 3
    type: numeric
    stem: "ต่อด้าน $BC$ ของสามเหลี่ยม $ABC$ ออกไปทางจุด $D$ ได้มุมภายนอก $\\angle ACD = 125^\\circ$ ถ้า $\\angle A = 50^\\circ$ จงหา $\\angle B$"
    answer: { value: 75, unit: องศา }
    hints:
      - "มุมภายนอกเท่ากับผลบวกของมุมภายในสองมุมที่ไม่ใช่มุมประชิด"
      - "มุมภายในที่ไม่ใช่มุมประชิดของ $\\angle ACD$ คือ $\\angle A$ และ $\\angle B$"
    misconceptions:
      - { match: 55, feedback: "$55^\\circ$ คือ $\\angle ACB$ ซึ่งเป็นมุมภายในที่อยู่ติดกับมุมภายนอก โจทย์ถาม $\\angle B$" }
      - { match: 5, feedback: "ดูเหมือนลบทั้ง $125^\\circ$ และ $50^\\circ$ ออกจาก $180^\\circ$ แต่ $125^\\circ$ เป็นมุมภายนอก ไม่ใช่มุมภายใน" }
    solution: "$\\angle ACD = \\angle A + \\angle B$ → $125^\\circ = 50^\\circ + \\angle B$ → $\\angle B = 75^\\circ$ ตรวจ: $\\angle ACB = 55^\\circ$ และ $50^\\circ + 75^\\circ + 55^\\circ = 180^\\circ$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.tri.p006
    topics: [math.geometry.triangles]
    difficulty: 3
    type: numeric
    stem: "มุมภายในของสามเหลี่ยมรูปหนึ่งมีอัตราส่วน $1 : 2 : 3$ มุมที่ใหญ่ที่สุดมีขนาดกี่องศา"
    answer: { value: 90, unit: องศา }
    hints:
      - "ให้มุมทั้งสามเป็น $x$, $2x$ และ $3x$"
      - "ตั้งสมการจากผลบวกมุมภายใน แล้วแก้หา $x$"
      - "มุมที่ใหญ่ที่สุดคือ $3x$"
    misconceptions:
      - { match: 30, feedback: "$30^\\circ$ คือค่าของ $x$ ซึ่งเป็นมุมที่เล็กที่สุด มุมที่ใหญ่ที่สุดคือ $3x$" }
      - { match: 180, feedback: "ดูเหมือนใช้ $360^\\circ$ เป็นผลบวกมุมภายใน (ได้ $x = 60^\\circ$) แต่ผลบวกมุมภายในของสามเหลี่ยมคือ $180^\\circ$" }
    solution: "$x + 2x + 3x = 180^\\circ$ → $6x = 180^\\circ$ → $x = 30^\\circ$ มุมที่ใหญ่ที่สุด $= 3(30^\\circ) = 90^\\circ$ สามเหลี่ยมนี้จึงเป็นสามเหลี่ยมมุมฉาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.tri.p007
    topics: [math.geometry.triangles]
    difficulty: 3
    type: numeric
    stem: "ป้ายเตือนจราจรรูปสามเหลี่ยมด้านเท่าแผ่นหนึ่ง ถ้าต่อด้านหนึ่งของป้ายออกไปที่มุมหนึ่ง มุมภายนอกที่เกิดขึ้นมีขนาดกี่องศา"
    answer: { value: 120, unit: องศา }
    hints:
      - "มุมภายในแต่ละมุมของสามเหลี่ยมด้านเท่ามีขนาดเท่าใด"
      - "มุมภายนอกกับมุมภายในที่อยู่ติดกันรวมกันเป็นมุมตรง"
    misconceptions:
      - { match: 60, feedback: "$60^\\circ$ คือมุมภายใน มุมภายนอกคือ $180^\\circ$ ลบด้วยมุมภายใน" }
    solution: "มุมภายใน $= 60^\\circ$ มุมภายนอก $= 180^\\circ - 60^\\circ = 120^\\circ$ (หรือ $60^\\circ + 60^\\circ$ จากสมบัติของมุมภายนอก)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.tri.p008
    topics: [math.geometry.triangles]
    difficulty: 3
    type: mcq
    stem: "ช่างไม้ทำโครงหลังคารูปสามเหลี่ยมสองชิ้น แล้ววัดได้ว่าด้านทั้งสามของชิ้นแรกยาวเท่ากับด้านที่สมนัยกันของชิ้นที่สองทุกด้าน ช่างไม้สรุปได้ว่าโครงทั้งสองเท่ากันทุกประการด้วยเงื่อนไขใด"
    choices:
      - { id: a, text: "ด.ด.ด. (ด้าน-ด้าน-ด้าน)", correct: true }
      - { id: b, text: "ด.ม.ด. (ด้าน-มุม-ด้าน)", feedback: "ด.ม.ด. ต้องรู้ว่ามุมที่อยู่ระหว่างสองด้านเท่ากัน แต่ช่างไม้วัดแค่ความยาวด้าน" }
      - { id: c, text: "ม.ม.ม. (มุม-มุม-มุม)", feedback: "ช่างไม้ไม่ได้วัดมุม และ ม.ม.ม. ใช้ยืนยันความเท่ากันทุกประการไม่ได้ เพราะรูปอาจมีขนาดต่างกัน" }
      - { id: d, text: "สรุปไม่ได้ ต้องวัดมุมด้วย", feedback: "ถ้าด้านเท่ากันครบสามคู่ สามเหลี่ยมมีรูปร่างได้แบบเดียว มุมจึงเท่ากันตามไปเอง" }
    hints:
      - "ช่างไม้วัดอะไรบ้าง และวัดได้เท่ากันกี่คู่"
      - "ทบทวนเงื่อนไขความเท่ากันทุกประการที่ใช้เฉพาะความยาวด้าน"
    solution: "ด้านเท่ากันทั้งสามคู่ จึงเท่ากันทุกประการแบบ ด.ด.ด. นี่คือเหตุผลที่โครงสามเหลี่ยมแข็งแรง เมื่อกำหนดด้านทั้งสามแล้ว รูปร่างเปลี่ยนไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.tri.p009
    topics: [math.geometry.triangles]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "ข้อมูลชุดใดเพียงพอที่จะสรุปว่า $\\triangle ABC \\cong \\triangle DEF$ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "$AB = DE$, $\\angle B = \\angle E$, $BC = EF$", correct: true }
      - { id: b, text: "$\\angle A = \\angle D$, $AB = DE$, $\\angle B = \\angle E$", correct: true }
      - { id: c, text: "$\\angle C = \\angle F = 90^\\circ$, $AB = DE$, $BC = EF$", correct: true }
      - { id: d, text: "$\\angle A = \\angle D$, $\\angle B = \\angle E$, $\\angle C = \\angle F$", feedback: "มุมเท่ากันครบสามคู่ (ม.ม.ม.) บอกแค่ว่ารูปร่างเหมือนกัน แต่ขนาดอาจต่างกัน เช่น สามเหลี่ยมด้านเท่าด้านยาว 1 cm กับ 5 cm" }
      - { id: e, text: "$AB = DE$, $BC = EF$, $\\angle A = \\angle D$", feedback: "มุม $A$ ไม่ได้อยู่ระหว่างด้าน $AB$ กับ $BC$ (มุมที่อยู่ระหว่างคือมุม $B$) แบบ ด.ด.ม. นี้อาจวาดได้สองรูปที่ต่างกัน" }
    hints:
      - "ระบุแต่ละข้อว่าเป็นเงื่อนไขแบบใด เช่น ด.ม.ด. หรือ ม.ด.ม."
      - "สำหรับ ด.ม.ด. มุมต้องอยู่ระหว่างสองด้านนั้นพอดี สำหรับ ฉ.ด.ด. ด้านหนึ่งต้องเป็นด้านตรงข้ามมุมฉาก"
    solution: "ข้อ a เป็น ด.ม.ด. (มุม $B$ อยู่ระหว่าง $AB$ กับ $BC$) | ข้อ b เป็น ม.ด.ม. (ด้าน $AB$ อยู่ระหว่างมุม $A$ กับ $B$) | ข้อ c เป็น ฉ.ด.ด. ($AB$ อยู่ตรงข้ามมุมฉาก $C$) | ข้อ d เป็น ม.ม.ม. และข้อ e เป็น ด.ด.ม. ซึ่งใช้ไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.tri.p010
    topics: [math.geometry.triangles]
    difficulty: 4
    type: numeric
    stem: "หน้าจั่วของบ้านทรงไทยหลังหนึ่งเป็นรูปสามเหลี่ยมหน้าจั่ว หลังคาแต่ละด้านทำมุมกับแนวระดับ (ฐานของหน้าจั่ว) $55^\\circ$ มุมที่ยอดจั่วมีขนาดกี่องศา"
    answer: { value: 70, unit: องศา }
    hints:
      - "มุมที่หลังคาทำกับแนวระดับคือมุมที่ฐานของสามเหลี่ยมหน้าจั่ว มีสองมุมเท่ากัน"
      - "ลบมุมที่ฐานทั้งสองมุมออกจาก $180^\\circ$"
    misconceptions:
      - { match: 125, feedback: "ดูเหมือนลบมุมที่ฐานออกเพียงมุมเดียว หน้าจั่วมีมุมที่ฐานสองมุม มุมละ $55^\\circ$" }
      - { match: 35, feedback: "นั่นคือ $90^\\circ - 55^\\circ$ ซึ่งเป็นมุมระหว่างหลังคาด้านเดียวกับแนวดิ่งตรงกลาง คือแค่ครึ่งหนึ่งของมุมยอดจั่ว มุมยอดจั่วทั้งมุมคือ $180^\\circ - 2(55^\\circ)$" }
    solution: "มุมยอดจั่ว $= 180^\\circ - 55^\\circ - 55^\\circ = 70^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.tri.p011
    topics: [math.geometry.triangles]
    difficulty: 4
    type: order
    stem: "เรียงขั้นตอนการพิสูจน์ว่ามุมภายนอก $\\angle ACD$ ของสามเหลี่ยม $ABC$ (เมื่อต่อ $BC$ ไปถึง $D$) เท่ากับ $\\angle A + \\angle B$"
    items:
      - "ผลบวกมุมภายในของสามเหลี่ยม: $\\angle A + \\angle B + \\angle ACB = 180^\\circ$"
      - "$B$, $C$, $D$ อยู่บนเส้นตรงเดียวกัน: $\\angle ACB + \\angle ACD = 180^\\circ$"
      - "ทั้งสองสมการเท่ากับ $180^\\circ$: $\\angle A + \\angle B + \\angle ACB = \\angle ACB + \\angle ACD$"
      - "ลบ $\\angle ACB$ ทั้งสองข้าง: $\\angle ACD = \\angle A + \\angle B$"
    hints:
      - "เริ่มจากข้อเท็จจริงสองข้อที่รู้อยู่แล้ว: ผลบวกมุมภายใน และมุมบนเส้นตรง"
      - "เมื่อสองนิพจน์เท่ากับ $180^\\circ$ ทั้งคู่ ก็นำมาเท่ากันได้ แล้วตัดส่วนที่ซ้ำกันออก"
    solution: "ใช้ผลบวกมุมภายใน → ใช้มุมบนเส้นตรง → ตั้งสองนิพจน์ให้เท่ากัน → ลบ $\\angle ACB$ ออก ได้ $\\angle ACD = \\angle A + \\angle B$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.tri.p012
    topics: [math.geometry.triangles]
    difficulty: 5
    type: numeric
    stem: "สามเหลี่ยมรูปหนึ่งมีมุมภายในขนาด $(2x + 10)^\\circ$, $(3x - 20)^\\circ$ และ $(x + 40)^\\circ$ มุมที่ใหญ่ที่สุดมีขนาดกี่องศา"
    answer: { value: 65, unit: องศา }
    hints:
      - "รวมมุมทั้งสามแล้วตั้งให้เท่ากับ $180^\\circ$"
      - "รวมพจน์ที่มี $x$ และพจน์ที่เป็นตัวเลข แล้วแก้หา $x$"
      - "แทน $x$ กลับในแต่ละมุมแล้วเลือกมุมที่ใหญ่ที่สุด"
    misconceptions:
      - { match: 25, feedback: "$25$ คือค่าของ $x$ ยังต้องแทนกลับเพื่อหาขนาดของแต่ละมุม" }
      - { match: 145, feedback: "ดูเหมือนตั้งผลรวมเท่ากับ $360^\\circ$ ผลบวกมุมภายในของสามเหลี่ยมคือ $180^\\circ$" }
    solution: "$(2x + 10) + (3x - 20) + (x + 40) = 6x + 30 = 180$ → $x = 25$ มุมทั้งสามคือ $60^\\circ$, $55^\\circ$, $65^\\circ$ (รวม $180^\\circ$ ✓) มุมที่ใหญ่ที่สุดคือ $65^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.tri.p013
    topics: [math.geometry.triangles]
    difficulty: 5
    type: mcq
