- type: mcq
  difficulty: 3
  stem: 'อ่านข้อความต่อไปนี้แล้วตอบ


    与其每天晚上熬夜 (áoyè)，不如早一点睡觉。熬夜 (áoyè)的人白天常常没有精神，学习效率 (xiàolǜ)也不高。当然，有人习惯 (xíguàn)晚上工作，这不是坏事。但是，对泰国的大多数学生来说，规律的作息 (zuòxī)更重要。由此可见，早睡比熬夜 (áoyè)更好。


    ผู้เขียนยอมรับอะไรเกี่ยวกับคนที่ทำงานตอนกลางคืน'
  choices:
  - id: a
    text: ทุกคนควรนอนตอนกลางคืนเท่านั้น
    feedback: ผู้เขียนไม่ได้พูดว่าทุกคนต้องทำแบบนั้น
  - id: b
    text: การทำงานตอนกลางคืนไม่ใช่เรื่องผิดเสมอไป
    correct: true
    feedback: ถูก 这不是坏事 (zhè bú shì huàishì) แปลว่าไม่ใช่เรื่องเสียหาย
  - id: c
    text: คนทุกคนควรทำงานตอนกลางคืนเพื่อประสิทธิภาพ
    feedback: ผู้เขียนไม่ได้เสนอให้ทุกคนทำงานตอนกลางคืน
  - id: d
    text: ไม่สนใจความเห็นของคนอื่นเลย
    feedback: ข้อความไม่ได้พูดถึงการไม่สนใจความเห็นของคนอื่น
  hints:
  - หาประโยคที่มี 有人习惯晚上工作
  - คำว่า 当然 บอกว่ากำลังยอมรับบางอย่าง
  - ดูว่าประโยค 这不是坏事 บอกทัศนะอย่างไร
  solution: '**b.** 当然 (dāngrán) ยอมรับว่ามีคนชอบทำงานตอนกลางคืน และ 这不是坏事 (zhè bú shì huàishì) บอกว่าไม่ใช่เรื่องเสียหาย'
