    solution: "เมื่อไม่คิดแรงต้านอากาศ แรงที่กระทำมีแรงโน้มถ่วงแรงเดียว ความเร่งจึงเท่ากับ $g = 9.8\\ \\mathrm{m/s^2}$ ทิศลงตลอดเวลา ทั้งขาขึ้น จุดสูงสุด และขาลง"
