  - topic: computer.projects.app-development
    indicators: [E2-PRO-RD-06]
    coverage: full
    note: อธิบายขั้นตอนของโครงงานแอปตั้งแต่ตั้งปัญหา แยกปัญหา ออกแบบ สร้าง ทดสอบ จนประเมิน (แอปค่าไฟ แอปบันทึกขยะชายหาด)
  - topic: computer.projects.app-development
    indicators: [S1-XCS-XC-02]
    coverage: partial
    note: ใช้แนวคิดเชิงคำนวณกับปัญหาค่าไฟที่ต้องใช้ความรู้ฟิสิกส์และคณิตศาสตร์ และบูรณาการโครงงานกับวิชาอื่น แต่ผู้เรียนไม่ได้สร้างแอปเองในแอป

  # ---------- ข้อมูล ----------
  - topic: computer.data.digital-data-basics
