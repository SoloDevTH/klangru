# หัวข้อในคลังที่สอนเนื้อหาของหัวข้อเกณฑ์รางวัลคุณภาพแห่งชาติบางส่วน (คลังยังไม่มีหัวข้อที่สอนเกณฑ์ TQA โดยตรง)
framework: tqa-2567-2568
mappings:
  - topic: management.quality.qc-tools
    indicators: ["4.1"]
    coverage: partial
    note: "เครื่องมือวิเคราะห์ข้อมูลและแผนภูมิควบคุมใช้วัดและวิเคราะห์ผลการดำเนินการระดับกระบวนการ ยังไม่มีการเลือกตัวชี้วัดระดับองค์กรและข้อมูลเชิงเปรียบเทียบ"
  - topic: management.operations.lean
    indicators: ["6.1", "6.2"]
    coverage: partial
    note: "6.1: วิเคราะห์และปรับปรุงกระบวนการทำงานด้วยแผนผังสายธารคุณค่าและไคเซ็น 6.2: ลดความสูญเปล่าและเพิ่มผลิตภาพ ยังไม่มีการจัดการเครือข่ายอุปทาน ความปลอดภัย และความต่อเนื่องทางธุรกิจ"
  - topic: management.quality.quality-planning
    indicators: ["3.1", "3.2"]
    coverage: partial
    note: รับฟังลูกค้าปัจจุบัน จำแนกกลุ่ม และกำหนดผลิตภัณฑ์ให้ตรงความต้องการ ยังไม่ได้เน้นลูกค้าที่มีศักยภาพ
  - topic: management.hr.human-resource-management
    indicators: ["5.1"]
    coverage: partial
    note: ประเมินขีดความสามารถและอัตรากำลัง (FTE) และการเปลี่ยนแปลงกำลังคน (p016) ยังไม่ได้สอนสุขภาพและความปลอดภัย
  - topic: management.operations.capacity-scheduling
    indicators: ["6.2"]
    coverage: partial
    note: ประสิทธิภาพของกระบวนการ (อัตราการใช้ ประสิทธิภาพ คอขวด) และการควบคุมต้นทุนจากแผนการผลิต ยังไม่ได้สอนความมั่นคงปลอดภัยไซเบอร์และความต่อเนื่องทางธุรกิจ
  - topic: management.org.organizational-behavior
    indicators: ["5.2"]
    coverage: partial
    note: วัฒนธรรมองค์กรและความผูกพัน ส่วนการพัฒนาผู้นำและความก้าวหน้าในอาชีพอยู่ใน human-resource-management
  - topic: management.operations.supply-chain
    indicators: ["6.1"]
    coverage: partial
    note: สอนส่วนการจัดการเครือข่ายอุปทาน (p005 p009 p014) การออกแบบผลิตภัณฑ์และกระบวนการและการจัดการนวัตกรรมอยู่ในหัวข้ออื่น
  - topic: management.project.risk-management
    indicators: ["1.2"]
    coverage: partial
    note: การกำกับดูแลความเสี่ยงโดยคณะกรรมการ ตรวจสอบภายในที่เป็นอิสระ ความเสี่ยงต่อสังคมและกฎหมาย (p018 p014) การตอบแทนสังคมไม่ได้สอนในหัวข้อนี้
  - topic: management.quality.excellence-self-assessment
    indicators: ["1.1", "7.4", "7.5"]
    coverage: partial
    note: การสื่อสารสองทางและบทบาทผู้นำในการประเมินตนเอง (p017) ยังไม่ลงลึกการสร้างวัฒนธรรมและวิสัยทัศน์ซึ่งอยู่ใน strategic-management และ leadership-motivation
  - topic: management.quality.excellence-self-assessment
    indicators: ["4.2", "7.1", "7.2", "7.3"]
    coverage: full
    note: คุณภาพและความปลอดภัยของข้อมูล การจัดการความรู้ การเรียนรู้ระดับองค์กร (p014 p018)
  - topic: management.strategy.strategic-management
    indicators: ["2.1", "2.2"]
    coverage: full
    note: การจัดทำกลยุทธ์ ความท้าทายและความได้เปรียบ วัตถุประสงค์และกรอบเวลา (p001 p009 p016)
