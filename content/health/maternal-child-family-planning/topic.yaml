id: health.family.maternal-child-family-planning
subject: health
title:
  th: อนามัยแม่และเด็ก การวางแผนครอบครัว และปัจจัยต่อการตั้งครรภ์
  en: Maternal and child health, family planning and factors affecting pregnancy
summary: การดูแลก่อนตั้งครรภ์ ฝากครรภ์ก่อน 12 สัปดาห์และ 8 ครั้ง หลังคลอด นมแม่ วัคซีนเด็ก ฮอร์โมนกับการคุมกำเนิด และปัจจัยที่มีผลต่อการตั้งครรภ์ ตามแนวทางกระทรวงสาธารณสุข
difficulty: 5
minutes: 40
prerequisites:
- health.sexuality.sexual-health
encompasses:
- id: health.sexuality.sexual-health
  weight: 0.2
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  title: ฝากครรภ์ 8 ครั้ง
  src: anc.svg
  alt: เส้นเวลาอายุครรภ์ 0 ถึง 40 สัปดาห์ แบ่งเป็นไตรมาสที่ 1 (0–13) ไตรมาสที่ 2 (13–27) ไตรมาสที่ 3 (27–40) มีจุดฝากครรภ์ 8 ครั้งตามแนวขององค์การอนามัยโลก ครั้งที่ 1 ไม่เกิน 12 สัปดาห์ ครั้งต่อไปที่ 20, 26, 30, 34, 36, 38 และ 40 สัปดาห์
  caption: ครั้งแรกก่อน 12 สัปดาห์สำคัญที่สุด เพราะตรวจเลือดและเริ่มยาเม็ดเสริมได้เร็ว
- type: figure
  title: วัคซีนพื้นฐานของเด็กไทย
  src: vaccines.svg
  alt: 'ตารางวัคซีนพื้นฐานที่เด็กควรได้รับครบตามช่วงอายุ สรุปจากกรมควบคุมโรค 2565 ครบเมื่ออายุ 1 ปี: BCG, HB1, DTP-HB-Hib 3 ครั้ง, OPV 3 ครั้ง, IPV, โรต้า, MMR ครั้งที่ 1 ครบเมื่ออายุ 2 ปี: DTP ครั้งที่ 4, OPV ครั้งที่ 4, ไข้สมองอักเสบเจอี LAJE ครั้งที่ 1 ครบเมื่ออายุ 3 ปี: MMR ครั้งที่ 2, LAJE ครั้งที่ 2 ครบเมื่ออายุ 5 ปี: DTP ครั้งที่ 5, OPV ครั้งที่ 5 ชั้นประถม: ป.1 ตรวจประวัติและฉีดเก็บตก ป.5 นักเรียนหญิงรับ HPV ป.6 รับ dT'
  caption: กำหนดอายุของแต่ละเข็มให้ดูในสมุดสีชมพูหรือถามเจ้าหน้าที่ รพ.สต.
- type: worked-example
  title: คำนวณอายุครรภ์และวันครบกำหนดคลอด
  problem: วันแรกของประจำเดือนครั้งสุดท้ายคือ 1 มกราคม 2569 ถ้าไปฝากครรภ์วันที่ 15 มีนาคม 2569 อายุครรภ์เท่าใด ทันก่อน 12 สัปดาห์หรือไม่ และครบกำหนดคลอดประมาณวันใด
  steps:
  - text: 'นับวัน: มกราคม 31 วัน กุมภาพันธ์ 28 วัน ถึง 15 มีนาคมอีก 14 วัน รวม $31 + 28 + 14 = 73$ วัน'
    why: อายุครรภ์ทางการแพทย์นับจากวันแรกของประจำเดือนครั้งสุดท้าย ไม่ใช่จากวันปฏิสนธิ
  - text: $73 \div 7 = 10$ สัปดาห์ เศษ 3 วัน จึงอายุครรภ์ 10 สัปดาห์ 3 วัน
  - text: 10 สัปดาห์น้อยกว่า 12 สัปดาห์ จึง **ทันเกณฑ์** ฝากครรภ์ครั้งแรก
  - text: ครบกำหนดคลอด $= 1$ มกราคม $+ 280$ วัน ได้ 8 ตุลาคม 2569
    why: การตั้งครรภ์ราว 40 สัปดาห์ หรือ 280 วัน เป็นค่าประมาณ ทารกคลอดก่อนหรือหลังได้เล็กน้อย
  answer: อายุครรภ์ 10 สัปดาห์ 3 วัน ทันเกณฑ์ ครบกำหนดคลอดประมาณ 8 ตุลาคม 2569
- type: check
  problem: health.family.maternal-child-family-planning.p001
  prompt: ลองตอบก่อนอ่านต่อ
- type: figure
  title: ฮอร์โมนกับการคุมกำเนิด
  src: hormones.svg
  alt: แผนภาพ ต่อมใต้สมองหลั่ง FSH และ LH ไปที่รังไข่ ทำให้ไข่เจริญและไข่ตก รังไข่หลั่งเอสโตรเจนและโพรเจสเตอโรนไปที่มดลูก ทำให้ผนังมดลูกหนาขึ้น และส่งผลย้อนกลับไปที่ต่อมใต้สมอง กล่องด้านล่างอธิบายว่ายาเม็ด ยาฉีด ยาฝังคุมกำเนิดมีฮอร์โมนคล้ายเอสโตรเจนหรือโพรเจสเตอโรน กดการหลั่ง FSH และ LH ไข่จึงไม่ตก และมูกปากมดลูกข้น ส่วนถุงยางอนามัย ห่วงทองแดง และการทำหมันไม่ใช้ฮอร์โมน
- type: worked-example
  title: วิเคราะห์ปัจจัยที่มีผลต่อการตั้งครรภ์
  problem: คุณป้าอายุ 38 ปี ตั้งครรภ์ครั้งที่สอง ทำงานโรงงานที่ต้องยืนนาน สามีสูบบุหรี่ และยังไม่เคยตรวจเบาหวาน วิเคราะห์ปัจจัยและเสนอการดูแล
  steps:
  - text: 'อายุ 35 ปีขึ้นไป: เสี่ยงความผิดปกติของโครโมโซมของทารก เบาหวานและความดันสูงขณะตั้งครรภ์ → ฝากครรภ์ครบและตรวจคัดกรองตามที่แพทย์แนะนำ'
    why: ปัจจัยที่แก้ไม่ได้ เช่น อายุ ยิ่งต้องเฝ้าระวังให้ดี
  - text: 'ควันบุหรี่มือสอง: เสี่ยงทารกน้ำหนักน้อยและคลอดก่อนกำหนด → ขอให้สามีไม่สูบในบ้านและรถ และชวนปรึกษาสายเลิกบุหรี่ 1600'
  - text: 'งานที่ยืนนาน: ขอปรับงานหรือพักเป็นระยะ ดื่มน้ำพอ'
  - text: 'โภชนาการ: กินอาหารครบหมู่และยาเม็ดเสริมไอโอดีน ธาตุเหล็ก และกรดโฟลิกที่เจ้าหน้าที่จ่ายทุกวัน'
  answer: ปัจจัยคืออายุ ควันบุหรี่มือสอง ลักษณะงาน และโรคที่ยังไม่ได้คัดกรอง ดูแลด้วยการฝากครรภ์ครบ ลดควันบุหรี่ ปรับงาน และโภชนาการที่ดี
- type: check
  problem: health.family.maternal-child-family-planning.p010
glossary:
- term: อนามัยแม่และเด็ก
  definition: การดูแลสุขภาพแม่และลูกตั้งแต่ก่อนตั้งครรภ์ ระหว่างตั้งครรภ์ การคลอด และหลังคลอด
- term: ฝากครรภ์
  definition: การไปพบบุคลากรสุขภาพเป็นระยะระหว่างตั้งครรภ์เพื่อตรวจ คัดกรอง ให้วัคซีน ยาเสริม และคำแนะนำ
- term: การวางแผนครอบครัว
  definition: การตัดสินใจร่วมกันว่าจะมีลูกเมื่อไร กี่คน และเว้นระยะห่างเท่าไร รวมถึงการเลือกวิธีคุมกำเนิด
- term: น้ำหนักแรกเกิดน้อย
  definition: ทารกที่หนักน้อยกว่า 2,500 กรัมเมื่อแรกเกิด เสี่ยงเจ็บป่วยและพัฒนาการช้า
- term: hCG
  definition: ฮอร์โมนที่สร้างเมื่อตั้งครรภ์ ชุดตรวจการตั้งครรภ์ตรวจหาฮอร์โมนนี้ในปัสสาวะ
flashcards:
- front: ฝากครรภ์คุณภาพ (นโยบาย 2565)
  back: ครั้งแรกก่อนอายุครรภ์ 12 สัปดาห์ และฝากต่อเนื่อง 8 ครั้ง
- front: นมแม่ตามคำแนะนำ WHO
  back: เริ่มภายใน 1 ชั่วโมงหลังคลอด นมแม่อย่างเดียว 6 เดือน ให้ต่อถึง 2 ปีหรือนานกว่า
- front: วัคซีนพื้นฐานของไทย
  back: 11 ชนิด ป้องกัน 13 โรค ไม่เสียค่าใช้จ่าย พลาดนัดให้ฉีดต่อทันที
- front: ยาคุมกำเนิดชนิดฮอร์โมนทำงานอย่างไร
  back: กดการหลั่ง FSH และ LH ไข่จึงไม่ตก และทำให้มูกปากมดลูกข้น
- front: แอลกอฮอล์ระหว่างตั้งครรภ์
  back: ไม่มีปริมาณที่ปลอดภัย ควรงดตั้งแต่วางแผนจะตั้งครรภ์
