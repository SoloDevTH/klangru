problems:
  - id: math.number.bounds-errors.p001
    topics: [math.number.bounds-errors]
    difficulty: 1
    type: numeric
    stem: "ปัด $3{,}467$ เป็นจำนวนเต็มร้อยที่ใกล้ที่สุด"
    answer: { value: 3500 }
    hints:
      - "ดูหลักถัดจากหลักร้อย คือหลักสิบ"
      - "หลักสิบเป็น 6 ซึ่งมากกว่าหรือเท่ากับ 5 จึงปัดขึ้น"
    misconceptions:
      - { match: 3400, feedback: "หลักสิบเป็น 6 ต้องปัดขึ้น ไม่ใช่ปัดทิ้ง" }
      - { match: 3000, feedback: "นั่นคือปัดเป็นหลักพัน (และปัดผิดทาง) ข้อนี้ปัดเป็นหลักร้อย" }
    solution: "3,467 อยู่ระหว่าง 3,400 กับ 3,500 หลักสิบเป็น 6 (≥ 5) จึงปัดขึ้นเป็น 3,500"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.bounds-errors.p002
    topics: [math.number.bounds-errors]
    difficulty: 1
    type: numeric
    stem: "ปัด $2.6849$ เป็นทศนิยม 2 ตำแหน่ง"
    answer: { value: 2.68, tolerance: 0.001 }
    hints:
      - "ดูเฉพาะทศนิยมตำแหน่งที่ 3"
      - "ทศนิยมตำแหน่งที่ 3 เป็น 4 ซึ่งน้อยกว่า 5"
    misconceptions:
      - { match: 2.69, feedback: "ปัดเป็นทอด ๆ ($2.6849 \\to 2.685 \\to 2.69$) ต้องปัดจากตัวเลขเดิมครั้งเดียว ดูแค่หลักที่ 3 ซึ่งเป็น 4" }
      - { match: 2.7, feedback: "นั่นคือทศนิยม 1 ตำแหน่ง ข้อนี้ต้องการ 2 ตำแหน่ง" }
    solution: "ทศนิยมตำแหน่งที่ 3 เป็น 4 (< 5) จึงปัดทิ้ง ได้ 2.68"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.bounds-errors.p003
    topics: [math.number.bounds-errors]
    difficulty: 2
    type: numeric
    stem: "ปัด $47{,}380$ ให้เหลือเลขนัยสำคัญ 2 ตัว"
    answer: { value: 47000 }
    hints:
      - "เลขนัยสำคัญสองตัวแรกคือ 4 และ 7 อยู่ในหลักหมื่นและหลักพัน"
      - "ปัดเป็นหลักพัน แล้วเติม 0 ให้คงค่าประจำหลักไว้"
    misconceptions:
      - { match: 47, feedback: "ต้องเติม 0 ให้ค่าประจำหลักเหมือนเดิม 47,380 ไม่ได้มีค่าประมาณ 47" }
      - { match: 48000, feedback: "ดูหลักร้อยซึ่งเป็น 3 (< 5) จึงปัดทิ้ง ไม่ใช่ปัดขึ้น" }
    solution: "สองตัวแรกคือ 4, 7 (หลักหมื่นและหลักพัน) ตัวถัดไปคือ 3 ปัดทิ้ง ได้ 47,000"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.bounds-errors.p004
    topics: [math.number.bounds-errors]
    difficulty: 2
    type: mcq
    stem: "แตงโมหนัก $3.4$ กิโลกรัม เมื่อปัดเป็นทศนิยม 1 ตำแหน่ง ข้อใดบอกช่วงของน้ำหนักจริง $m$ ได้ถูกต้อง"
    choices:
      - { id: a, text: "$3.35 \\le m < 3.45$", correct: true }
      - { id: b, text: "$3.3 \\le m < 3.5$", feedback: "ค่าจริงต่างจาก 3.4 ได้ไม่เกินครึ่งหน่วย คือ 0.05 ไม่ใช่ 0.1" }
      - { id: c, text: "$3.35 < m \\le 3.45$", feedback: "3.35 ปัดแล้วได้ 3.4 จึงต้องรวม ส่วน 3.45 ปัดแล้วได้ 3.5 จึงต้องไม่รวม" }
      - { id: d, text: "$3.35 \\le m \\le 3.44$", feedback: "ค่าอย่าง 3.447 ก็ปัดได้ 3.4 ขอบเขตบนคือ 3.45 โดยไม่รวม 3.45" }
    hints:
      - "หน่วยของการปัดคือ 0.1 ครึ่งหน่วยคือ 0.05"
      - "ลองปัด 3.35 และ 3.45 ดูว่าได้ 3.4 หรือไม่"
    solution: "ขอบเขตล่าง $3.4 - 0.05 = 3.35$ (รวม) ขอบเขตบน $3.4 + 0.05 = 3.45$ (ไม่รวม เพราะ 3.45 ปัดได้ 3.5) จึงได้ $3.35 \\le m < 3.45$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.bounds-errors.p005
    topics: [math.number.bounds-errors]
    difficulty: 2
    type: numeric
    stem: "ป้ายหน้าที่ทำการ อบต. เขียนว่าตำบลนี้มีประชากร 4,800 คน (ปัดเป็นจำนวนเต็มร้อย) ประชากรจริงมีได้น้อยที่สุดกี่คน (ตอบเป็นจำนวนคน)"
    answer: { value: 4750, unit: คน }
    hints:
      - "ปัดเป็นหลักร้อย ครึ่งหน่วยคือ 50"
      - "จำนวนที่น้อยที่สุดที่ปัดแล้วได้ 4,800 คือเท่าใด"
    misconceptions:
      - { match: 4700, feedback: "4,700 ปัดแล้วได้ 4,700 ไม่ใช่ 4,800 ค่าจริงต่างได้ไม่เกินครึ่งหน่วย (50)" }
      - { match: 4799, feedback: "4,760 ก็ปัดได้ 4,800 เช่นกัน ลองหาค่าที่น้อยกว่านี้อีก" }
    solution: "ขอบเขตล่าง $= 4{,}800 - 50 = 4{,}750$ คน (4,750 ปัดเป็นหลักร้อยได้ 4,800) ส่วนจำนวนคนมากที่สุดคือ 4,849 คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.bounds-errors.p006
    topics: [math.number.bounds-errors]
    difficulty: 2
    type: numeric
    stem: "แถบสีบนเส้นจำนวนแสดงค่าทั้งหมดที่ปัดเป็นจำนวนเต็มแล้วได้จำนวนเดียวกัน จำนวนนั้นคืออะไร"
    figure: { src: bounds-problem.svg, alt: "เส้นจำนวนจาก 6 ถึง 8 มีแถบระบายสีจาก 6.5 ถึง 7.5 จุดที่ 6.5 เป็นวงกลมทึบ (รวม) จุดที่ 7.5 เป็นวงกลมโปร่ง (ไม่รวม)" }
    answer: { value: 7 }
    hints:
      - "ค่าที่ปัดแล้วอยู่ตรงกลางของช่วงพอดี"
      - "หาจุดกึ่งกลางระหว่าง 6.5 กับ 7.5"
    misconceptions:
      - { match: 6.5, feedback: "6.5 คือขอบเขตล่าง ค่าที่ปัดแล้วอยู่ตรงกลางของแถบ" }
      - { match: 7.5, feedback: "7.5 คือขอบเขตบน (ไม่รวม) ค่าที่ปัดแล้วอยู่ตรงกลางของแถบ" }
    solution: "ช่วง $6.5 \\le x < 7.5$ มีกึ่งกลางที่ 7 ทุกค่าในช่วงนี้ปัดเป็นจำนวนเต็มได้ 7"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.bounds-errors.p007
    topics: [math.number.bounds-errors]
    difficulty: 2
    type: numeric
    stem: "ตุ้มน้ำหนักมาตรฐานหนัก 50 กรัมพอดี นักเรียนชั่งได้ 48.5 กรัม ความคลาดเคลื่อนสัมบูรณ์เท่ากับกี่กรัม (ตอบในหน่วยกรัม)"
    answer: { value: 1.5, tolerance: 0.01, unit: กรัม }
    hints:
      - "ความคลาดเคลื่อนสัมบูรณ์ = |ค่าที่วัดได้ − ค่าจริง|"
      - "คำนวณ $|48.5 - 50|$"
    misconceptions:
      - { match: -1.5, feedback: "ความคลาดเคลื่อนสัมบูรณ์ใช้ค่าสัมบูรณ์ จึงไม่ติดลบ" }
      - { match: 3, feedback: "นั่นคือร้อยละความคลาดเคลื่อน ($\\tfrac{1.5}{50} \\times 100$) ข้อนี้ถามความคลาดเคลื่อนสัมบูรณ์เป็นกรัม" }
    solution: "$|48.5 - 50| = 1.5$ กรัม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.bounds-errors.p008
    topics: [math.number.bounds-errors]
    difficulty: 3
    type: numeric
    stem: "สำนักงานชั่งตวงวัดนำตุ้มมาตรฐาน 1.00 กิโลกรัม ไปตรวจตาชั่งของแม่ค้าในตลาด ตาชั่งอ่านได้ 1.05 กิโลกรัม ร้อยละความคลาดเคลื่อนของตาชั่งเท่ากับเท่าใด (ตอบเป็นร้อยละ)"
    answer: { value: 5, tolerance: 0.05, unit: "%" }
    hints:
      - "ความคลาดเคลื่อนสัมบูรณ์ $= 1.05 - 1.00$"
      - "หารด้วยค่าจริง (ค่ามาตรฐาน) แล้วคูณ 100"
    misconceptions:
      - { match: 4.76, feedback: "หารด้วยค่าที่วัดได้ (1.05) ต้องหารด้วยค่าจริง (1.00)" }
      - { match: 0.05, feedback: "นั่นคือความคลาดเคลื่อนสัมบูรณ์เป็นกิโลกรัม หรือความคลาดเคลื่อนสัมพัทธ์ที่ยังไม่ได้คูณ 100" }
    solution: "ความคลาดเคลื่อนสัมบูรณ์ $= 0.05$ kg ร้อยละความคลาดเคลื่อน $= \\tfrac{0.05}{1.00} \\times 100\\% = 5\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.bounds-errors.p009
    topics: [math.number.bounds-errors]
    difficulty: 3
    type: numeric
    stem: "สี่เหลี่ยมจัตุรัสยาวด้านละ 12 cm (ปัดเป็นจำนวนเต็มเซนติเมตร) ขอบเขตบนของความยาวรอบรูปเท่ากับกี่เซนติเมตร (ตอบในหน่วย cm)"
    answer: { value: 50, unit: cm }
    hints:
      - "หาขอบเขตบนของความยาวด้านก่อน"
      - "ความยาวรอบรูป = 4 × ด้าน ใช้ขอบเขตบนของด้าน"
    misconceptions:
      - { match: 48, feedback: "นั่นคือความยาวรอบรูปจากค่าที่ปัดแล้ว ข้อนี้ถามขอบเขตบน" }
      - { match: 48.5, feedback: "บวกครึ่งหน่วยกับผลลัพธ์ แต่ทุกด้านคลาดเคลื่อนได้ด้านละ 0.5 cm ต้องใช้ $4 \\times 12.5$" }
    solution: "ขอบเขตบนของด้าน $= 12.5$ cm ขอบเขตบนของความยาวรอบรูป $= 4 \\times 12.5 = 50$ cm"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.bounds-errors.p010
    topics: [math.number.bounds-errors]
    difficulty: 3
    type: numeric
    stem: "นาฬิกาจับเวลาแสดง 12.3 วินาที โดยใช้การ ตัดทิ้ง (ไม่ปัด) หลักที่เกินทศนิยม 1 ตำแหน่ง เวลาจริงมีค่าน้อยที่สุดเท่าใด (ตอบในหน่วยวินาที)"
    answer: { value: 12.3, tolerance: 0.001, unit: วินาที }
    hints:
      - "การตัดทิ้งไม่เคยปัดขึ้น ค่าที่แสดงจึงไม่มากกว่าค่าจริง"
      - "เวลาจริงอยู่ในช่วง $12.3 \\le t < 12.4$"
    misconceptions:
      - { match: 12.25, feedback: "นั่นคือขอบเขตล่างของการปัด แต่นาฬิกานี้ตัดทิ้ง เวลาจริงจึงไม่น้อยกว่าค่าที่แสดง" }
    solution: "การตัดทิ้งตัดหลักที่เกินออก ค่าจริงจึงอยู่ในช่วง $12.3 \\le t < 12.4$ ค่าน้อยที่สุดคือ 12.3 วินาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.bounds-errors.p011
    topics: [math.number.bounds-errors]
    difficulty: 3
    type: mcq
    stem: "วัดความสูงเพื่อนสามคนด้วยสายวัดที่อ่านได้ละเอียดถึงเซนติเมตร ได้ 152, 149, 151 cm ควรรายงานความสูงเฉลี่ยอย่างไร"
    choices:
      - { id: a, text: "ประมาณ 151 cm", correct: true }
      - { id: b, text: "150.666667 cm", feedback: "ข้อมูลวัดละเอียดแค่เซนติเมตร การรายงานถึงล้านในหนึ่งทำให้ดูแม่นยำเกินความจริง" }
      - { id: c, text: "150.67 cm", feedback: "ยังละเอียดเกินกว่าข้อมูล ข้อมูลแต่ละค่าคลาดเคลื่อนได้ถึง 0.5 cm" }
      - { id: d, text: "ประมาณ 200 cm", feedback: "ปัดหยาบเกินไปจนเสียข้อมูล ค่าเฉลี่ยจริงอยู่ราว 151" }
    hints:
      - "ค่าเฉลี่ยคือ $(152 + 149 + 151) \\div 3$"
      - "คำตอบไม่ควรละเอียดกว่าข้อมูลที่วัดมา"
    solution: "ค่าเฉลี่ย $= 452 \\div 3 = 150.666\\ldots$ cm แต่ข้อมูลวัดเป็นเซนติเมตร จึงรายงานว่าประมาณ 151 cm"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.bounds-errors.p012
    topics: [math.number.bounds-errors]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการหาค่ามากที่สุดของความเร็วเฉลี่ย เมื่อระยะทางและเวลาถูกปัดมาแล้ว"
    items:
      - "หาหน่วยของการปัดของระยะทางและของเวลา"
      - "หาขอบเขตบนและขอบเขตล่างของแต่ละค่า"
      - "เลือกขอบเขตบนของระยะทาง และขอบเขตล่างของเวลา"
      - "หารระยะทางด้วยเวลา แล้วปัดคำตอบสุดท้ายตามความเหมาะสม"
    hints:
      - "ต้องรู้ว่าปัดมาละเอียดแค่ไหนก่อน จึงจะหาขอบเขตได้"
      - "ผลหารมากที่สุดเมื่อตัวตั้งมากที่สุดและตัวหารน้อยที่สุด"
    solution: "หน่วยการปัด → ขอบเขตของแต่ละค่า → เลือกระยะทางมากสุดและเวลาน้อยสุด → หารแล้วค่อยปัดคำตอบสุดท้าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.bounds-errors.p013
    topics: [math.number.bounds-errors]
    difficulty: 4
    type: numeric
    stem: "$a = 8.3$ และ $b = 2.7$ ต่างปัดเป็นทศนิยม 1 ตำแหน่ง ค่ามากที่สุดของ $a - b$ เท่ากับเท่าใด"
    answer: { value: 5.7, tolerance: 0.001 }
    hints:
      - "ขอบเขตของ $a$: $8.25 \\le a < 8.35$ ของ $b$: $2.65 \\le b < 2.75$"
      - "ผลต่างมากที่สุดเมื่อตัวตั้งมากที่สุดและตัวลบน้อยที่สุด"
    misconceptions:
      - { match: 5.6, feedback: "ใช้ขอบเขตบนลบขอบเขตบน ($8.35 - 2.75$) ต้องลบด้วยขอบเขตล่างของ $b$ จึงได้ผลต่างมากที่สุด" }
      - { match: 5.65, feedback: "บวกครึ่งหน่วยเข้ากับ $8.3 - 2.7 = 5.6$ ครั้งเดียว แต่ทั้ง $a$ และ $b$ คลาดเคลื่อนได้คนละ 0.05" }
    solution: "ค่ามากที่สุด $=$ ขอบเขตบนของ $a$ − ขอบเขตล่างของ $b$ $= 8.35 - 2.65 = 5.7$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.bounds-errors.p014
    topics: [math.number.bounds-errors]
    difficulty: 4
    type: numeric
    stem: "ห้องนอนกว้าง 4 m ยาว 6 m (ปัดเป็นจำนวนเต็มเมตร) ขอบเขตบนของพื้นที่ห้องเท่ากับกี่ตารางเมตร (ตอบในหน่วย m²)"
    answer: { value: 29.25, tolerance: 0.01, unit: "m²" }
    hints:
      - "ขอบเขตบนของความกว้างและความยาวคือ 4.5 m และ 6.5 m"
      - "พื้นที่มากที่สุด = ขอบเขตบน × ขอบเขตบน"
    misconceptions:
      - { match: 24, feedback: "นั่นคือพื้นที่จากค่าที่ปัดแล้ว ข้อนี้ถามขอบเขตบน" }
      - { match: 24.5, feedback: "บวก 0.5 เข้ากับพื้นที่โดยตรง ต้องใช้ขอบเขตบนของแต่ละด้านก่อนแล้วจึงคูณ" }
    solution: "ขอบเขตบนของพื้นที่ $= 4.5 \\times 6.5 = 29.25\\ \\mathrm{m^2}$ (ขอบเขตล่าง $= 3.5 \\times 5.5 = 19.25\\ \\mathrm{m^2}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.bounds-errors.p015
    topics: [math.number.bounds-errors]
    difficulty: 4
    type: numeric
    stem: "ไม้บรรทัดวัดความยาวดินสอได้ 20 cm (ปัดเป็นจำนวนเต็มเซนติเมตร) ร้อยละความคลาดเคลื่อนมากที่สุดที่เป็นไปได้เท่ากับเท่าใด (ตอบเป็นร้อยละ)"
    answer: { value: 2.5, tolerance: 0.03, unit: "%" }
    hints:
      - "ความคลาดเคลื่อนสัมบูรณ์มากที่สุดจากการปัดคือครึ่งหน่วย"
      - "หารด้วย 20 แล้วคูณ 100"
    misconceptions:
      - { match: 5, feedback: "ใช้ความคลาดเคลื่อน 1 cm (เต็มหน่วย) การปัดคลาดเคลื่อนได้มากสุดแค่ครึ่งหน่วย 0.5 cm" }
      - { match: 0.5, feedback: "นั่นคือความคลาดเคลื่อนสัมบูรณ์ เป็นเซนติเมตร ยังต้องคิดเป็นร้อยละของ 20 cm" }
    solution: "ความคลาดเคลื่อนสัมบูรณ์มากที่สุด 0.5 cm ร้อยละ $= \\tfrac{0.5}{20} \\times 100\\% = 2.5\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.bounds-errors.p016
    topics: [math.number.bounds-errors]
    difficulty: 4
    type: numeric
    stem: "ลานวิ่งรูปวงกลมรัศมี 50 m ถ้าคำนวณความยาวเส้นรอบวงด้วย $\\pi \\approx 3.14$ แทนค่า $\\pi$ จริง คำตอบจะคลาดเคลื่อนไปกี่เมตร (ตอบทศนิยม 2 ตำแหน่ง ในหน่วยเมตร)"
    answer: { value: 0.16, tolerance: 0.005, unit: m }
    hints:
      - "เส้นรอบวง $= 2\\pi r$ คำนวณทั้งแบบ $\\pi$ จริงและแบบ 3.14"
      - "ผลต่าง $= 2 \\times 50 \\times (\\pi - 3.14)$"
    misconceptions:
      - { match: 0.0016, feedback: "นั่นคือ $\\pi - 3.14$ ยังต้องคูณด้วย $2r = 100$" }
      - { match: 0.05, feedback: "นั่นคือร้อยละความคลาดเคลื่อน ข้อนี้ถามเป็นเมตร" }
    solution: "$2\\pi \\times 50 \\approx 314.159$ m และ $2 \\times 3.14 \\times 50 = 314$ m คลาดเคลื่อน $\\approx 0.16$ m (ประมาณ 0.05%)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.bounds-errors.p017
    topics: [math.number.bounds-errors]
    difficulty: 5
    type: numeric
    stem: "นักเรียนประมาณ $\\sqrt2 \\approx 1.4$ แล้วคำนวณ $(\\sqrt2)^{10}$ เป็น $1.4^{10}$ ค่าจริงของ $(\\sqrt2)^{10}$ คือ 32 ร้อยละความคลาดเคลื่อนของคำตอบเท่ากับเท่าใด (ตอบทศนิยม 1 ตำแหน่ง เป็นร้อยละ)"
    answer: { value: 9.6, tolerance: 0.1, unit: "%" }
    hints:
      - "คำนวณ $1.4^{10}$ ด้วยเครื่องคิดเลข"
      - "ร้อยละความคลาดเคลื่อน $= \\dfrac{|32 - 1.4^{10}|}{32} \\times 100$"
    misconceptions:
      - { match: 1, feedback: "นั่นคือความคลาดเคลื่อนของ 1.4 เพียงตัวเดียว เมื่อนำไปยกกำลังสิบ ความคลาดเคลื่อนสะสมจนโตขึ้นมาก" }
      - { match: 10.6, feedback: "หารด้วยค่าประมาณ ($1.4^{10} \\approx 28.93$) ต้องหารด้วยค่าจริง 32" }
    solution: "$1.4^{10} \\approx 28.925$ คลาดเคลื่อน $32 - 28.925 = 3.075$ ร้อยละ $= \\tfrac{3.075}{32} \\times 100 \\approx 9.6\\%$ ทั้งที่ $1.4$ ต่างจาก $\\sqrt2$ แค่ราว 1%"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.bounds-errors.p018
    topics: [math.number.bounds-errors]
    difficulty: 5
    type: numeric
    stem: "นักกีฬาวิ่งได้ 100 m (ปัดเป็นจำนวนเต็มเมตร) ใช้เวลา 12.4 วินาที (ปัดเป็นทศนิยม 1 ตำแหน่ง) ขอบเขตบนของความเร็วเฉลี่ยเท่ากับกี่เมตรต่อวินาที (ตอบทศนิยม 2 ตำแหน่ง ในหน่วย m/s)"
    answer: { value: 8.14, tolerance: 0.01, unit: "m/s" }
    hints:
      - "ระยะทาง $99.5 \\le d < 100.5$ เวลา $12.35 \\le t < 12.45$"
      - "ความเร็วมากที่สุด = ระยะทางมากที่สุด ÷ เวลาน้อยที่สุด"
    misconceptions:
      - { match: 8.07, feedback: "นั่นคือ $100.5 \\div 12.45$ (ขอบเขตบน ÷ ขอบเขตบน) การหารต้องใช้ขอบเขตล่างของตัวหาร" }
      - { match: 7.99, feedback: "นั่นคือขอบเขตล่าง ($99.5 \\div 12.45$) ข้อนี้ถามขอบเขตบน: ระยะทางมากที่สุด ÷ เวลาน้อยที่สุด" }
    solution: "ขอบเขตบนของความเร็ว $= \\dfrac{100.5}{12.35} \\approx 8.14$ m/s"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.bounds-errors.p019
    topics: [math.number.bounds-errors]
    difficulty: 5
    type: mcq
    stem: "ลิฟต์ในคอนโดรับน้ำหนักได้ไม่เกิน 630 kg มีคน 8 คน แต่ละคนชั่งน้ำหนักได้ 75 kg (ปัดเป็นจำนวนเต็มที่หารด้วย 5 ลงตัวที่ใกล้ที่สุด) ข้อสรุปใดถูกต้อง"
    choices:
      - { id: a, text: "ปลอดภัยแน่นอน เพราะน้ำหนักรวมน้อยกว่า $8 \\times 77.5 = 620$ kg เสมอ", correct: true }
      - { id: b, text: "ไม่แน่ใจ เพราะน้ำหนักจริงอาจมากกว่า 75 kg", feedback: "ลองหาขอบเขตบนจริง ๆ แต่ละคนน้อยกว่า 77.5 kg รวมจึงน้อยกว่า 620 kg ซึ่งยังต่ำกว่า 630 kg" }
      - { id: c, text: "ปลอดภัย เพราะ $8 \\times 75 = 600$ kg", feedback: "คำตอบถูกแต่เหตุผลไม่พอ น้ำหนักจริงอาจมากกว่า 600 kg ต้องตรวจด้วยขอบเขตบน" }
      - { id: d, text: "ไม่ปลอดภัย เพราะน้ำหนักรวมอาจถึง $8 \\times 80 = 640$ kg", feedback: "คนที่หนัก 80 kg จะถูกปัดเป็น 80 ไม่ใช่ 75 ขอบเขตบนของแต่ละคนคือ 77.5 kg" }
    hints:
      - "ปัดเป็นพหุคูณของ 5 ครึ่งหน่วยคือ 2.5 kg"
      - "ตรวจกรณีที่แย่ที่สุด: ทุกคนหนักเท่าขอบเขตบน"
    solution: "แต่ละคน $72.5 \\le w < 77.5$ kg น้ำหนักรวมน้อยกว่า $8 \\times 77.5 = 620$ kg ซึ่งน้อยกว่า 630 kg จึงปลอดภัยแม้ในกรณีที่แย่ที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true
