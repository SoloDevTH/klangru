<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="sans-serif" font-size="14">
<title>มุมของแสงอาทิตย์กับละติจูด</title>
<rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
<circle cx="470" cy="200" r="160" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="2"/>
<line x1="310" y1="200" x2="630" y2="200" stroke="#1e3a8a" stroke-dasharray="6 4"/>
<text x="638.0" y="205.0" text-anchor="start" font-size="13" fill="#222">เส้นศูนย์สูตร</text>
<line x1="470" y1="200" x2="367.2" y2="77.4" stroke="#94a3b8"/>
<line x1="60.0" y1="180.0" x2="311.3" y2="180.0" stroke="#f59e0b" stroke-width="2"/>
<polygon points="311.3,180.0 303.0,183.5 303.0,176.5" fill="#f59e0b"/>
<line x1="60.0" y1="220.0" x2="311.3" y2="220.0" stroke="#f59e0b" stroke-width="2"/>
<polygon points="311.3,220.0 303.0,223.5 303.0,216.5" fill="#f59e0b"/>
<path d="M311.3,180.0 A160,160 0 0 0 311.3,220.0" fill="none" stroke="#dc2626" stroke-width="6"/>
<line x1="60.0" y1="57.4" x2="397.4" y2="57.4" stroke="#f59e0b" stroke-width="2"/>
<polygon points="397.4,57.4 389.1,60.9 389.1,53.9" fill="#f59e0b"/>
<line x1="60.0" y1="97.4" x2="347.2" y2="97.4" stroke="#f59e0b" stroke-width="2"/>
<polygon points="347.2,97.4 338.9,100.9 338.9,93.9" fill="#f59e0b"/>
<path d="M397.4,57.4 A160,160 0 0 0 347.2,97.4" fill="none" stroke="#dc2626" stroke-width="6"/>
<text x="60.0" y="170.0" text-anchor="start" font-size="13" fill="#92400e">แสงกว้างเท่ากัน</text>
<text x="330.0" y="240.0" text-anchor="start" font-size="13" fill="#222">แสงตกตั้งฉาก</text>
<text x="330.0" y="258.0" text-anchor="start" font-size="13" fill="#222">พื้นที่รับแสงเล็ก ร้อนมาก</text>
<text x="475.0" y="105.0" text-anchor="start" font-size="13" fill="#222">แสงตกเฉียง พลังงานกระจาย</text>
<text x="475.0" y="123.0" text-anchor="start" font-size="13" fill="#222">บนพื้นที่ใหญ่ขึ้น (ละติจูด 50°)</text>
<text x="380.0" y="386.0" text-anchor="middle" font-size="12" fill="#475569">ที่ละติจูดสูง แสงยังผ่านบรรยากาศเป็นระยะทางยาวกว่าด้วย (ภาพในวันวิษุวัต ไม่ได้ตามมาตราส่วน)</text>
</svg>