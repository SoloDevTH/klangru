  difficulty: 5
  type: mcq
  stem: มีโพสต์ในกลุ่มนักเรียนว่า "กัญชาถูกกฎหมายแล้ว ใครอยากได้คุกกี้กัญชาสั่งออนไลน์ได้เลย สมุนไพรไม่อันตราย" ข้อใดวิเคราะห์โพสต์นี้ได้ครบที่สุด (ข้อมูล ณ ตุลาคม 2569)
  choices:
  - id: a
    text: "ผิดทั้งข้อเท็จจริงทางกฎหมายและสุขภาพ: ช่อดอกเป็นสมุนไพรควบคุม ช่อดอกและสินค้าที่แปรรูปจากช่อดอกห้ามขายออนไลน์ การซื้อต้องมีใบสั่งจ่าย กัญชามีผลต่อความจำและสมาธิของวัยรุ่น และขนมทำให้กินเกินได้ง่าย ควรไม่ส่งต่อและแจ้งครู"
    correct: true
  - id: b
    text: ถูกต้อง เพราะกัญชาถูกปลดจากยาเสพติดแล้ว
    feedback: พืชกัญชาออกจากบัญชีประเภท 5 แต่ช่อดอกเป็นสมุนไพรควบคุม และการขายออนไลน์ผิดประกาศ
  - id: c
    text: ผิดเฉพาะเรื่องราคา
