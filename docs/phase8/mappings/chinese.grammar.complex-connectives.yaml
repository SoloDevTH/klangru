  - { framework: hsk-3-0, indicators: ["HSK3.0-L4"], coverage: partial, note: "สอนคู่คำเชื่อมตามขอบเขตในแผนพร้อมความต่างของคู่ที่ความหมายใกล้กัน แต่ตามสำเนารายการไวยากรณ์ GF 0025—2021 มีเพียง 无论/不管…都 既然…就 และ 连…都/也 ที่เป็นระดับ 4 (一…就 只要…就 เป็นระดับ 2; 不仅…还 只有…才 越…越 除了…以外 เป็นระดับ 3; 即使…也 เป็นระดับ 5) และยังไม่ได้สอนคู่ระดับ 4 อื่น เช่น 不是…而是 既…又 哪怕…也 假如…就 ไวยากรณ์ระดับ 4 มี 76 จุด บทนี้ครอบคลุมเฉพาะกลุ่มคำเชื่อมบางส่วน และไม่ได้ฝึกการพูดหรือเขียนอิสระ ต้องตรวจกับฉบับทางการก่อนเผยแพร่" }
