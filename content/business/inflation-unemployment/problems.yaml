- id: business.econ.inflation-unemployment.p014
  topics:
  - business.econ.inflation-unemployment
  difficulty: 4
  type: numeric
  stem: จังหวัดสมมติแห่งหนึ่งมีผู้อายุ 15 ปีขึ้นไป $1{,}200{,}000$ คน เป็นผู้มีงานทำ $760{,}000$ คน ผู้ว่างงาน (ไม่มีงานและกำลังหางาน) $40{,}000$ คน ที่เหลือเป็นผู้อยู่นอกกำลังแรงงาน เช่น นักเรียน ผู้ทำงานบ้าน ผู้เกษียณ ถ้าผู้ว่างงานแต่ละคนผลิตได้เฉลี่ยปีละ $300{,}000$ บาทหากมีงานทำ (สมมติ) ผลผลิตที่จังหวัดเสียไปในหนึ่งปีจากการว่างงานเป็นกี่ล้านบาท (ตอบเป็นล้านบาท)
  answer:
    value: 12000.0
    unit: ล้านบาท
  misconceptions:
  - match: 12
    feedback: แปลงหน่วยผิด 12,000 ล้านบาท ไม่ใช่ 12 ล้านบาท
  - match: 240000
    feedback: ใช้ผู้มีงานทำ ต้องใช้ผู้ว่างงาน
  hints:
  - ผลผลิตที่เสียไป $=$ จำนวนผู้ว่างงาน $\times$ ผลผลิตต่อคน
  - แปลงหน่วยเป็นล้านบาท
  solution: $40{,}000 \times 300{,}000 = 12{,}000{,}000{,}000$ บาท $= 12{,}000$ ล้านบาท นอกจากผลผลิตที่เสียไป ผู้ว่างงานยังเสียรายได้ ทักษะ และอาจเกิดปัญหาสังคม
