    stem: "ผู้ดูดาวในค่ายดาราศาสตร์ที่ดอยอินทนนท์พบว่า ถ้าจ้องตรงไปที่ดาวที่สลัวมาก ดาวจะหายไป แต่ถ้ามองเยื้องไปข้าง ๆ เล็กน้อยกลับเห็นดาว ข้อใดอธิบายได้ถูกต้อง"
