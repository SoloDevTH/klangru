problems:
  - id: math.coord.p001
    topics: [math.functions.coordinate-plane]
    difficulty: 1
    type: mcq
    stem: "จุด $(-3, 2)$ อยู่ในจตุภาคใด"
    choices:
      - { id: a, text: "จตุภาคที่ 2", correct: true }
      - { id: b, text: "จตุภาคที่ 1", feedback: "จตุภาคที่ 1 ต้องมีพิกัดเป็นบวกทั้งคู่ แต่พิกัด $x$ ของจุดนี้คือ $-3$" }
      - { id: c, text: "จตุภาคที่ 4", feedback: "ดูเหมือนอ่านพิกัดสลับเป็น $(2, -3)$ ตัวแรกในวงเล็บคือพิกัด $x$ เสมอ" }
      - { id: d, text: "จตุภาคที่ 3", feedback: "จตุภาคที่ 3 มีพิกัดเป็นลบทั้งคู่ แต่พิกัด $y$ ของจุดนี้คือ $2$ ซึ่งเป็นบวก" }
    hints:
      - "ดูเครื่องหมายของพิกัด $x$ (ตัวแรก) และพิกัด $y$ (ตัวหลัง)"
      - "$x$ ลบแปลว่าอยู่ซ้ายของแกน $y$ และ $y$ บวกแปลว่าอยู่เหนือแกน $x$"
    solution: "$x = -3 < 0$ อยู่ทางซ้าย และ $y = 2 > 0$ อยู่ข้างบน จึงอยู่ในจตุภาคที่ 2 (มุมซ้ายบน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.coord.p002
    topics: [math.functions.coordinate-plane]
    difficulty: 1
    type: match
    stem: "จับคู่จุดกับตำแหน่งบนระนาบ"
    pairs:
      - { left: "$(4, 5)$", right: "จตุภาคที่ 1" }
      - { left: "$(-2, -7)$", right: "จตุภาคที่ 3" }
      - { left: "$(6, -1)$", right: "จตุภาคที่ 4" }
      - { left: "$(0, 3)$", right: "อยู่บนแกน $y$" }
    hints:
      - "จตุภาคนับทวนเข็มนาฬิกาเริ่มจากมุมขวาบน"
      - "จุดที่มีพิกัดตัวใดตัวหนึ่งเป็น 0 อยู่บนแกน ไม่อยู่ในจตุภาคใด"
    solution: "$(4, 5)$ บวกทั้งคู่ → จตุภาคที่ 1 · $(-2, -7)$ ลบทั้งคู่ → จตุภาคที่ 3 · $(6, -1)$ $x$ บวก $y$ ลบ → จตุภาคที่ 4 · $(0, 3)$ มี $x = 0$ → อยู่บนแกน $y$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.coord.p003
    topics: [math.functions.coordinate-plane]
    difficulty: 2
    type: numeric
    stem: "จุด $A(-4, 3)$ และ $B(5, 3)$ อยู่ห่างกันกี่หน่วย"
    answer: { value: 9, unit: หน่วย }
    hints:
      - "พิกัด $y$ เท่ากัน สองจุดนี้จึงอยู่บนเส้นแนวนอนเดียวกัน"
      - "ระยะทางคือ $|x_2 - x_1|$ ระวังการลบจำนวนลบ"
    misconceptions:
      - { match: 1, feedback: "นั่นคือ $5 + (-4)$ หรือ $5 - 4$ ระยะทางต้องใช้ $5 - (-4) = 5 + 4$ ลองนับช่องบนเส้นจำนวนดู" }
    solution: "$|5 - (-4)| = |9| = 9$ หน่วย นับได้ 4 ช่องจาก $-4$ ถึง 0 และ 5 ช่องจาก 0 ถึง 5"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.coord.p004
    topics: [math.functions.coordinate-plane]
    difficulty: 2
    type: numeric
    stem: "จุด $C(2, -6)$ และ $D(2, 4)$ อยู่ห่างกันกี่หน่วย"
    answer: { value: 10, unit: หน่วย }
    hints:
      - "พิกัด $x$ เท่ากัน สองจุดนี้จึงอยู่บนเส้นแนวตั้งเดียวกัน"
      - "หา $|y_2 - y_1|$"
    misconceptions:
      - { match: 2, feedback: "นั่นคือ $4 + (-6)$ ระยะทางต้องใช้ผลต่าง $4 - (-6) = 10$" }
    solution: "$|4 - (-6)| = 10$ หน่วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.coord.p005
    topics: [math.functions.coordinate-plane]
    difficulty: 2
    type: text
    stem: "เลื่อนจุด $P(3, -2)$ ไปทางขวา 4 หน่วย แล้วลง 5 หน่วย จะได้จุดใด (พิมพ์ เช่น (1,-2))"
    accepted: ["(7,-7)", "7,-7"]
    hints:
      - "ไปทางขวาคือบวกที่พิกัด $x$"
      - "ลงคือลบที่พิกัด $y$"
    misconceptions:
      - { match: "(7,3)", feedback: "เลื่อน **ลง** ต้องลบพิกัด $y$ ได้ $-2 - 5 = -7$ ไม่ใช่บวก" }
      - { match: "(-1,3)", feedback: "ทิศกลับกันทั้งสองแกน ขวาให้บวกพิกัด $x$ และลงให้ลบพิกัด $y$" }
    solution: "$x$: $3 + 4 = 7$ และ $y$: $-2 - 5 = -7$ จึงได้ $P'(7, -7)$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.coord.p006
    topics: [math.functions.coordinate-plane]
    difficulty: 3
    type: text
    stem: "สะท้อนจุด $Q(4, -3)$ ในแกน $x$ จะได้จุดใด (พิมพ์ เช่น (1,-2))"
    accepted: ["(4,3)", "4,3"]
    hints:
      - "แกน $x$ เป็นเส้นแนวนอน การสะท้อนจึงพลิกขึ้นลง"
      - "พิกัดที่บอกตำแหน่งขึ้นลงคือพิกัด $y$ ซึ่งจะเปลี่ยนเครื่องหมาย"
    misconceptions:
      - { match: "(-4,-3)", feedback: "นั่นคือการสะท้อนในแกน $y$ การสะท้อนในแกน $x$ ทำให้พิกัด $y$ เปลี่ยนเครื่องหมาย" }
      - { match: "(-4,3)", feedback: "เปลี่ยนเครื่องหมายทั้งสองพิกัด นั่นคือการหมุนรอบจุดกำเนิด การสะท้อนในแกน $x$ เปลี่ยนแค่พิกัด $y$" }
    solution: "สะท้อนในแกน $x$: $(x, y) \\to (x, -y)$ จึงได้ $(4, 3)$ ทั้งสองจุดห่างจากแกน $x$ เท่ากัน 3 หน่วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.coord.p007
    topics: [math.functions.coordinate-plane]
    difficulty: 3
    type: text
    stem: "สะท้อนจุด $R(-5, 2)$ ในแกน $y$ จะได้จุดใด (พิมพ์ เช่น (1,-2))"
    accepted: ["(5,2)", "5,2"]
    hints:
      - "แกน $y$ เป็นเส้นแนวตั้ง การสะท้อนจึงพลิกซ้ายขวา"
      - "พิกัดที่บอกตำแหน่งซ้ายขวาคือพิกัด $x$ ซึ่งจะเปลี่ยนเครื่องหมาย"
    misconceptions:
      - { match: "(-5,-2)", feedback: "นั่นคือการสะท้อนในแกน $x$ การสะท้อนในแกน $y$ ทำให้พิกัด $x$ เปลี่ยนเครื่องหมาย" }
    solution: "สะท้อนในแกน $y$: $(x, y) \\to (-x, y)$ จึงได้ $(5, 2)$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.coord.p008
    topics: [math.functions.coordinate-plane]
    difficulty: 3
    type: numeric
    stem: "แผนที่หมู่บ้านแห่งหนึ่งในจังหวัดน่านวาดบนตารางกริด 1 ช่องแทนระยะจริง 100 เมตร วัดอยู่ที่ $(-3, 2)$ โรงเรียนอยู่ที่ $(5, 2)$ ถ้าเดินเป็นเส้นตรงจากวัดไปโรงเรียน ระยะทางจริงกี่เมตร (ตอบเป็นตัวเลขในหน่วยเมตร)"
    answer: { value: 800, unit: m }
    hints:
      - "พิกัด $y$ เท่ากัน จึงเป็นระยะแนวนอน หาจำนวนช่องก่อน"
      - "จำนวนช่องคือ $|5 - (-3)|$ แล้วคูณด้วยมาตราส่วน 100 เมตรต่อช่อง"
    misconceptions:
      - { match: 200, feedback: "ดูเหมือนคิดจำนวนช่องเป็น $5 - 3 = 2$ ที่ถูกคือ $5 - (-3) = 8$ ช่อง" }
      - { match: 8, feedback: "8 คือจำนวนช่องบนแผนที่ ยังต้องคูณด้วย 100 เมตรต่อช่อง" }
    solution: "จำนวนช่อง $= |5 - (-3)| = 8$ ช่อง ระยะทางจริง $= 8 \\times 100 = 800$ เมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.coord.p009
    topics: [math.functions.coordinate-plane]
    difficulty: 3
    type: text
    stem: "ผังตลาดน้ำแห่งหนึ่งเขียนบนตารางพิกัด ร้านส้มตำอยู่ที่ $(-2, 4)$ แม่ค้าพายเรือไปทางขวา (แกน $x$ บวก) 5 ช่อง แล้วลง (แกน $y$ ลบ) 7 ช่อง จึงถึงร้านขายผลไม้ ร้านขายผลไม้อยู่ที่พิกัดใด (พิมพ์ เช่น (1,-2))"
    accepted: ["(3,-3)", "3,-3"]
    hints:
      - "ไปทางขวาคือบวกที่พิกัด $x$"
      - "ลงคือลบที่พิกัด $y$ คิดทีละพิกัด"
    misconceptions:
      - { match: "(3,11)", feedback: "เลื่อนลงต้องลบพิกัด $y$: $4 - 7 = -3$ ไม่ใช่ $4 + 7$" }
      - { match: "(-7,-3)", feedback: "ไปทางขวาต้องบวกพิกัด $x$: $-2 + 5 = 3$" }
    solution: "$x$: $-2 + 5 = 3$ และ $y$: $4 - 7 = -3$ ร้านขายผลไม้อยู่ที่ $(3, -3)$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.coord.p010
    topics: [math.functions.coordinate-plane]
    difficulty: 4
    type: numeric
    stem: "แปลงนาสี่เหลี่ยมผืนผ้าในแผนผังมีจุดยอด $A(-2, -1)$, $B(4, -1)$, $C(4, 3)$ และ $D(-2, 3)$ ถ้า 1 หน่วยในแผนผังแทนระยะจริง 10 เมตร แปลงนามีพื้นที่จริงกี่ตารางเมตร (ตอบเป็นตัวเลขในหน่วยตารางเมตร)"
    answer: { value: 2400, unit: "m^2" }
    hints:
      - "หาความยาว $AB$ (แนวนอน) และ $BC$ (แนวตั้ง) ในหน่วยของแผนผัง"
      - "เปลี่ยนแต่ละด้านเป็นเมตรก่อน แล้วจึงคูณกันหาพื้นที่"
    misconceptions:
      - { match: 240, feedback: "ดูเหมือนคูณมาตราส่วน 10 แค่ครั้งเดียว ต้องเปลี่ยนทั้งความกว้างและความยาวเป็นเมตร พื้นที่จึงคูณ $10 \\times 10 = 100$" }
      - { match: 24, feedback: "24 คือพื้นที่ในหน่วยของแผนผัง ยังต้องเปลี่ยนเป็นตารางเมตร" }
    solution: "$AB = |4 - (-2)| = 6$ หน่วย $= 60$ เมตร $BC = |3 - (-1)| = 4$ หน่วย $= 40$ เมตร พื้นที่ $= 60 \\times 40 = 2400$ ตารางเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.coord.p011
    topics: [math.functions.coordinate-plane]
    difficulty: 4
    type: text
    stem: "สะท้อนจุด $(2, 5)$ ในแกน $x$ แล้วเลื่อนไปทางซ้าย 6 หน่วย จะได้จุดใด (พิมพ์ เช่น (1,-2))"
    accepted: ["(-4,-5)", "-4,-5"]
    hints:
      - "ทำทีละขั้น เริ่มจากการสะท้อนในแกน $x$"
      - "สะท้อนในแกน $x$ เปลี่ยนเครื่องหมายพิกัด $y$ แล้วเลื่อนซ้ายให้ลบพิกัด $x$"
    misconceptions:
      - { match: "(-4,5)", feedback: "เลื่อนถูกแล้ว แต่ลืมสะท้อนในแกน $x$ ซึ่งทำให้พิกัด $y$ เปลี่ยนเป็น $-5$" }
      - { match: "(8,-5)", feedback: "สะท้อนถูกแล้ว แต่เลื่อน **ซ้าย** ต้องลบพิกัด $x$: $2 - 6 = -4$" }
    solution: "สะท้อนในแกน $x$: $(2, 5) \\to (2, -5)$ แล้วเลื่อนซ้าย 6: $(2 - 6, -5) = (-4, -5)$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.coord.p012
    topics: [math.functions.coordinate-plane]
    difficulty: 4
    type: mcq
    stem: "การเลื่อนขนานแบบหนึ่งย้ายจุด $A(1, 2)$ ไปที่ $A'(-3, 5)$ ถ้าใช้การเลื่อนแบบเดียวกันกับจุด $B(4, -1)$ จะได้จุดใด"
    choices:
      - { id: a, text: "$(0, 2)$", correct: true }
      - { id: b, text: "$(8, -4)$", feedback: "นั่นคือการเลื่อนในทิศตรงข้าม จาก $A$ ไป $A'$ พิกัด $x$ ลดลง 4 และพิกัด $y$ เพิ่มขึ้น 3" }
      - { id: c, text: "$(7, -5)$", feedback: "ดูเหมือนสลับการเลื่อน ใช้ $+3$ กับ $x$ และ $-4$ กับ $y$ แต่ $x$ ต้องลด 4 และ $y$ ต้องเพิ่ม 3" }
      - { id: d, text: "$(0, -1)$", feedback: "เลื่อนพิกัด $x$ ถูกแล้ว แต่ลืมเลื่อนพิกัด $y$ ขึ้น 3 ด้วย" }
    hints:
      - "หาว่าการเลื่อนเปลี่ยนพิกัด $x$ และพิกัด $y$ ไปเท่าไร: $A' - A$"
      - "พิกัด $x$ เปลี่ยน $-3 - 1$ และพิกัด $y$ เปลี่ยน $5 - 2$ แล้วนำไปบวกกับพิกัดของ $B$"
    solution: "การเลื่อนคือ $x$ เปลี่ยน $-3 - 1 = -4$ และ $y$ เปลี่ยน $5 - 2 = +3$ จึงได้ $B' = (4 - 4, -1 + 3) = (0, 2)$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.coord.p013
    topics: [math.functions.coordinate-plane]
    difficulty: 5
    type: numeric
    stem: "สามเหลี่ยมมีจุดยอด $(-3, -2)$, $(5, -2)$ และ $(5, 4)$ มีพื้นที่กี่ตารางหน่วย"
    answer: { value: 24, unit: ตารางหน่วย }
    hints:
      - "จุดสองจุดแรกมีพิกัด $y$ เท่ากัน เป็นฐานแนวนอน จุดสองจุดหลังมีพิกัด $x$ เท่ากัน เป็นความสูงแนวตั้ง"
      - "ฐานคือ $|5 - (-3)|$ และความสูงคือ $|4 - (-2)|$"
      - "พื้นที่สามเหลี่ยม = $\\tfrac12$ × ฐาน × สูง"
    misconceptions:
      - { match: 48, feedback: "นั่นคือฐาน × สูง ซึ่งเป็นพื้นที่สี่เหลี่ยมผืนผ้า สามเหลี่ยมต้องคูณ $\\tfrac12$ ด้วย" }
      - { match: 6, feedback: "ดูเหมือนคิดฐานเป็น $5 - 3 = 2$ ที่ถูกคือ $5 - (-3) = 8$" }
    solution: "ฐาน $= |5 - (-3)| = 8$ ความสูง $= |4 - (-2)| = 6$ พื้นที่ $= \\tfrac12 \\times 8 \\times 6 = 24$ ตารางหน่วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.coord.p014
    topics: [math.functions.coordinate-plane]
    difficulty: 5
    type: numeric
    stem: "จุด $P(a, 3)$ เมื่อ $a > 0$ สะท้อนในแกน $y$ ได้จุด $P'$ ถ้า $P$ กับ $P'$ อยู่ห่างกัน 10 หน่วย แล้ว $a$ มีค่าเท่าใด"
    answer: { value: 5 }
    hints:
      - "สะท้อนในแกน $y$ ได้ $P'(-a, 3)$"
      - "$P$ และ $P'$ อยู่บนเส้นแนวนอนเดียวกัน ระยะห่างคือ $|a - (-a)|$"
      - "ตั้งสมการระยะห่างเท่ากับ 10 แล้วแก้หา $a$"
    misconceptions:
      - { match: 10, feedback: "10 คือระยะระหว่าง $P$ กับ $P'$ ซึ่งเท่ากับ $2a$ เพราะแต่ละจุดห่างจากแกน $y$ เป็นระยะ $a$" }
    solution: "$P'(-a, 3)$ ระยะห่าง $= a - (-a) = 2a = 10$ จึงได้ $a = 5$ ตรวจ: $(5, 3)$ กับ $(-5, 3)$ ห่างกัน 10 หน่วย ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.coord.p015
    topics: [math.functions.coordinate-plane]
    difficulty: 1
    type: text
    stem: "จากภาพ จุด $C$ มีพิกัดใด (พิมพ์ เช่น (1,-2))"
    figure: { src: points-abcd.svg, alt: "ระนาบพิกัดช่วง −5 ถึง 5 ทั้งสองแกน มีจุด A อยู่ขวา 2 ขึ้น 3 จุด B อยู่ซ้าย 4 ขึ้น 1 จุด C อยู่ซ้าย 2 ลง 3 และจุด D อยู่ขวา 3 ลง 2 จากจุดกำเนิด" }
    accepted: ["(-2,-3)", "-2,-3"]
    hints:
      - "เริ่มที่จุดกำเนิด เดินในแนวนอนไปให้ตรงกับจุด $C$ ก่อน ระยะนั้นคือพิกัด $x$"
      - "ซ้ายเป็นลบ ลงเป็นลบ แล้วเขียนเป็น $(x, y)$"
    misconceptions:
      - { match: "(-3,-2)", feedback: "สลับลำดับพิกัด ตัวแรกต้องเป็นพิกัด $x$ (แนวนอน) ซึ่งคือ $-2$" }
      - { match: "(2,3)", feedback: "จุด $C$ อยู่ทางซ้ายและอยู่ใต้แกน $x$ พิกัดทั้งสองจึงเป็นลบ" }
    solution: "จากจุดกำเนิด เดินไปทางซ้าย 2 ช่อง แล้วลง 3 ช่องจึงถึง $C$ จึงได้ $C(-2, -3)$ ซึ่งอยู่ในจตุภาคที่ 3"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.coord.p016
    topics: [math.functions.coordinate-plane]
    difficulty: 2
    type: numeric
    stem: "จุด $M(-2.5, 1.5)$ และ $N(3, 1.5)$ อยู่ห่างกันกี่หน่วย"
    answer: { value: 5.5, tolerance: 0.01, unit: หน่วย }
    hints:
      - "พิกัด $y$ เท่ากัน สองจุดจึงอยู่บนเส้นแนวนอนเดียวกัน"
      - "หาผลต่างของพิกัด $x$ แล้วใส่ค่าสัมบูรณ์"
    misconceptions:
      - { match: 0.5, feedback: "ลบโดยไม่คิดเครื่องหมาย $3 - 2.5$ จุดทั้งสองอยู่คนละฝั่งของแกน $y$ ระยะคือ $3 - (-2.5) = 5.5$" }
    solution: "$|3 - (-2.5)| = |3 + 2.5| = 5.5$ หน่วย หรือคิดว่าจาก $-2.5$ ไปถึง 0 ได้ 2.5 หน่วย และจาก 0 ไปถึง 3 อีก 3 หน่วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.coord.p017
    topics: [math.functions.coordinate-plane]
    difficulty: 3
    type: text
    stem: "หมุนจุด $P(3, 1)$ รอบจุดกำเนิด $90^\\circ$ ทวนเข็มนาฬิกา จะได้จุดใด (พิมพ์ เช่น (1,-2))"
    accepted: ["(-1,3)", "-1,3"]
    hints:
      - "จุดในจตุภาคที่ 1 เมื่อหมุนทวนเข็มนาฬิกาหนึ่งในสี่รอบจะไปอยู่จตุภาคที่ 2"
      - "การหมุน $90^\\circ$ ทวนเข็มนาฬิการอบจุดกำเนิดเปลี่ยน $(x, y)$ เป็น $(-y, x)$"
    misconceptions:
      - { match: "(1,-3)", feedback: "นั่นคือการหมุนตามเข็มนาฬิกา ทวนเข็มนาฬิกาจากจตุภาคที่ 1 ต้องไปจตุภาคที่ 2" }
      - { match: "(-3,1)", feedback: "นั่นคือการสะท้อนในแกน $y$ ไม่ใช่การหมุน การหมุน $90^\\circ$ ทำให้พิกัดสลับตำแหน่งกันด้วย" }
    solution: "ใช้กฎ $(x, y) \\to (-y, x)$ ได้ $(3, 1) \\to (-1, 3)$ ตรวจ: ระยะจากจุดกำเนิดเท่าเดิม และเส้นจากจุดกำเนิดไปยัง $(3, 1)$ ตั้งฉากกับเส้นไปยัง $(-1, 3)$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.coord.p018
    topics: [math.functions.coordinate-plane]
    difficulty: 3
    type: text
    stem: "หาจุดกึ่งกลางของส่วนของเส้นตรงที่เชื่อม $(-4, 7)$ กับ $(6, -1)$ (พิมพ์ เช่น (1,-2))"
    accepted: ["(1,3)", "1,3"]
    hints:
      - "จุดกึ่งกลางมีพิกัดแต่ละตัวเป็นค่าเฉลี่ยของพิกัดของปลายทั้งสอง"
      - "หา $\\tfrac{-4 + 6}{2}$ และ $\\tfrac{7 + (-1)}{2}$"
    misconceptions:
      - { match: "(5,-4)", feedback: "นั่นคือครึ่งหนึ่งของผลต่าง จุดกึ่งกลางใช้ครึ่งหนึ่งของ **ผลบวก** (ค่าเฉลี่ย)" }
      - { match: "(2,6)", feedback: "ยังไม่ได้หารด้วย 2 จุดกึ่งกลางคือค่าเฉลี่ยของพิกัด" }
    solution: "จุดกึ่งกลาง $= \\left(\\tfrac{-4 + 6}{2}, \\tfrac{7 + (-1)}{2}\\right) = (1, 3)$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.coord.p019
    topics: [math.functions.coordinate-plane]
    difficulty: 3
    type: numeric
    stem: "แผนผังโรงเรียนวาดแปลงผักรูปตัว L มีจุดยอด $(-4, -2)$, $(3, -2)$, $(3, 1)$, $(0, 1)$, $(0, 4)$ และ $(-4, 4)$ ตามภาพ ถ้า 1 หน่วยในแผนผังแทนระยะจริง 5 เมตร ต้องใช้รั้วล้อมแปลงผักยาวกี่เมตร"
    figure: { src: garden-plot.svg, alt: "รูปหกเหลี่ยมรูปตัว L บนระนาบพิกัด จุดยอดอยู่ที่ (−4, −2), (3, −2), (3, 1), (0, 1), (0, 4) และ (−4, 4) ทุกด้านขนานกับแกน" }
    answer: { value: 130, unit: m }
    hints:
      - "ทุกด้านเป็นแนวนอนหรือแนวตั้ง ความยาวแต่ละด้านคือผลต่างของพิกัดที่เปลี่ยน"
      - "รวมความยาวทั้ง 6 ด้านในหน่วยของแผนผังก่อน แล้วคูณด้วย 5"
    misconceptions:
      - { match: 26, feedback: "นั่นคือความยาวรอบรูปในหน่วยของแผนผัง ยังต้องคูณด้วย 5 เพื่อเปลี่ยนเป็นเมตร" }
      - { match: 165, feedback: "นั่นคือพื้นที่ในหน่วยตาราง ($33$) คูณ 5 แต่รั้วคือความยาวรอบรูป" }
    solution: "ด้านทั้งหกยาว 7, 3, 3, 3, 4, 6 หน่วย รวม 26 หน่วย คิดเป็นระยะจริง $26 \\times 5 = 130$ เมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.coord.p020
    topics: [math.functions.coordinate-plane]
    difficulty: 4
    type: numeric
    stem: "สามเหลี่ยมมีจุดยอด $(1, 2)$, $(4, 2)$ และ $(1, 6)$ ขยายรูปจากจุดกำเนิดด้วยตัวประกอบสเกล 3 (คูณทุกพิกัดด้วย 3) สามเหลี่ยมรูปใหม่มีพื้นที่กี่ตารางหน่วย"
    answer: { value: 54, unit: ตารางหน่วย }
    hints:
      - "หาจุดยอดใหม่โดยคูณทุกพิกัดด้วย 3 หรือหาพื้นที่เดิมก่อน"
      - "เมื่อความยาวทุกด้านเพิ่ม 3 เท่า พื้นที่เพิ่ม $3 \\times 3 = 9$ เท่า"
    misconceptions:
      - { match: 18, feedback: "คูณพื้นที่ด้วย 3 แต่ทั้งฐานและสูงยาวขึ้น 3 เท่า พื้นที่จึงเพิ่ม $3^2 = 9$ เท่า" }
      - { match: 6, feedback: "นั่นคือพื้นที่ของสามเหลี่ยมเดิม การขยายทำให้ขนาดเปลี่ยน (ต่างจากการเลื่อน การหมุน การสะท้อน)" }
    solution: "จุดยอดใหม่คือ $(3, 6)$, $(12, 6)$, $(3, 18)$ ฐานยาว $12 - 3 = 9$ สูง $18 - 6 = 12$ พื้นที่ $= \\tfrac{1}{2} \\times 9 \\times 12 = 54$ ตารางหน่วย ซึ่งเป็น 9 เท่าของพื้นที่เดิม $\\tfrac{1}{2} \\times 3 \\times 4 = 6$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.coord.p021
    topics: [math.functions.coordinate-plane]
    difficulty: 4
    type: mcq
    stem: "การแปลงใดย้ายจุด $(2, 5)$ ไปที่ $(-2, -5)$"
    choices:
      - { id: a, text: "หมุน $180^\\circ$ รอบจุดกำเนิด", correct: true }
      - { id: b, text: "สะท้อนในแกน $x$", feedback: "สะท้อนในแกน $x$ เปลี่ยนเครื่องหมายเฉพาะพิกัด $y$ ได้ $(2, -5)$" }
      - { id: c, text: "สะท้อนในแกน $y$", feedback: "สะท้อนในแกน $y$ เปลี่ยนเครื่องหมายเฉพาะพิกัด $x$ ได้ $(-2, 5)$" }
      - { id: d, text: "หมุน $90^\\circ$ ทวนเข็มนาฬิการอบจุดกำเนิด", feedback: "หมุน $90^\\circ$ ทวนเข็มนาฬิกาได้ $(-5, 2)$ พิกัดจะสลับตำแหน่งกันด้วย" }
    hints:
      - "พิกัดทั้งสองเปลี่ยนเครื่องหมาย แต่ไม่สลับตำแหน่งกัน"
      - "ลองสะท้อนในแกน $x$ แล้วสะท้อนต่อในแกน $y$ ดูว่าเทียบเท่ากับการหมุนเท่าใด"
    solution: "การหมุน $180^\\circ$ รอบจุดกำเนิดเปลี่ยน $(x, y)$ เป็น $(-x, -y)$ จึงได้ $(-2, -5)$ ซึ่งเท่ากับการสะท้อนในแกนทั้งสองต่อกัน จุดทั้งสองอยู่คนละฝั่งของจุดกำเนิดบนเส้นตรงเดียวกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.coord.p022
    topics: [math.functions.coordinate-plane]
    difficulty: 3
    type: numeric
    stem: "แผนผังสวนสาธารณะ 1 หน่วยแทนระยะจริง 20 เมตร ศาลาอยู่ที่ $(-6, 4)$ และห้องน้ำอยู่ที่ $(-6, -3.5)$ ถ้าเดินเป็นเส้นตรงจากศาลาไปห้องน้ำ ระยะทางจริงกี่เมตร"
    answer: { value: 150, unit: m }
    hints:
      - "พิกัด $x$ เท่ากัน สองจุดอยู่บนเส้นแนวตั้งเดียวกัน"
      - "หา $|4 - (-3.5)|$ ในหน่วยของแผนผัง แล้วคูณด้วย 20"
    misconceptions:
      - { match: 10, feedback: "คิด $4 - 3.5 = 0.5$ หน่วย แต่สองจุดอยู่คนละฝั่งของแกน $x$ ระยะคือ $4 - (-3.5) = 7.5$ หน่วย" }
      - { match: 7.5, feedback: "นั่นคือระยะในแผนผัง ยังต้องคูณด้วย 20 เมตรต่อหน่วย" }
    solution: "ระยะในแผนผัง $= |4 - (-3.5)| = 7.5$ หน่วย ระยะจริง $= 7.5 \\times 20 = 150$ เมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.coord.p023
    topics: [math.functions.coordinate-plane]
    difficulty: 4
    type: text
    stem: "รูปสี่เหลี่ยมด้านขนาน $ABCD$ (เรียงจุดยอดตามลำดับรอบรูป) มี $A(-1, 2)$, $B(4, 2)$ และ $C(6, -1)$ จุด $D$ มีพิกัดใด (พิมพ์ เช่น (1,-2))"
    accepted: ["(1,-1)", "1,-1"]
    hints:
      - "ในสี่เหลี่ยมด้านขนาน การเลื่อนจาก $B$ ไป $C$ เท่ากับการเลื่อนจาก $A$ ไป $D$"
      - "จาก $B$ ไป $C$ คือขวา 2 ลง 3 ใช้การเลื่อนเดียวกันกับจุด $A$"
    misconceptions:
      - { match: "(11,-1)", feedback: "ใช้การเลื่อนจาก $A$ ไป $B$ กับจุด $C$ ได้จุดที่ทำให้เรียงเป็น $ABDC$ ไม่ใช่ $ABCD$ ด้าน $AD$ ต้องขนานและยาวเท่ากับ $BC$" }
      - { match: "(-3,5)", feedback: "ใช้การเลื่อนกลับทิศ จาก $B$ ไป $C$ คือไปทางขวา 2 และลง 3 จึงต้องเลื่อน $A$ ไปทางขวา 2 และลง 3 เช่นกัน" }
    solution: "$\\overrightarrow{BC}$: ขวา $6 - 4 = 2$ ลง $2 - (-1) = 3$ ด้าน $AD$ ขนานและยาวเท่ากับ $BC$ จึงได้ $D = (-1 + 2, 2 - 3) = (1, -1)$ ตรวจ: จาก $D$ ไป $C$ คือขวา 5 เท่ากับจาก $A$ ไป $B$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true
