      - { match: 42.86, feedback: "หารด้วยคนที่ชอบโกโก้ 70 คน ได้สัดส่วนของ ม.2 ในกลุ่มคนที่ชอบโกโก้ ซึ่งเป็นคนละคำถาม" }
