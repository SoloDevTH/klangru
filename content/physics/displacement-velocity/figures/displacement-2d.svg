<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="420" height="340" font-family="sans-serif" font-size="15">
  <title>เดินไปทางตะวันออก 300 m แล้วไปทางเหนือ 400 m การกระจัดเป็นเส้นตรงยาว 500 m จากจุดเริ่มถึงจุดสุดท้าย</title>
  <rect x="0" y="0" width="420" height="340" fill="#ffffff"/>
  <line x1="60.0" y1="290.0" x2="229.0" y2="290.0" stroke="#0a6b60" stroke-width="3" stroke-linecap="butt"/>
  <polygon points="240.0,290.0 229.0,294.9 229.0,285.1" fill="#0a6b60"/>
  <line x1="240.0" y1="290.0" x2="240.0" y2="61.0" stroke="#0a6b60" stroke-width="3" stroke-linecap="butt"/>
  <polygon points="240.0,50.0 244.9,61.0 235.1,61.0" fill="#0a6b60"/>
  <line x1="60.0" y1="290.0" x2="232.2" y2="60.4" stroke="#b4521f" stroke-width="3.4" stroke-linecap="butt"/>
  <polygon points="240.0,50.0 236.9,63.9 227.5,56.9" fill="#b4521f"/>
  <text x="150.0" y="312.0" fill="#0a6b60" font-size="14" text-anchor="middle">300 m (ตะวันออก)</text>
  <text x="250.0" y="170.0" fill="#0a6b60" font-size="14" text-anchor="start">400 m (เหนือ)</text>
  <text x="136.0" y="164.0" fill="#b4521f" font-size="14" text-anchor="end" font-weight="bold">การกระจัด</text>
  <circle cx="60.0" cy="290.0" r="5" fill="#15211e"/>
