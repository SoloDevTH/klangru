  - id: phy.proj.p021
    topics: [physics.kinematics.projectile]
    difficulty: 4
    type: expression
    stem: "ยิงวัตถุในแนวราบด้วยความเร็ว $u$ ในบริเวณที่มีความเร่งโน้มถ่วง $g$ ไม่คิดแรงต้านอากาศ เมื่อวัตถุเคลื่อนที่ไปได้ระยะแนวราบ $x$ วัตถุตกลงต่ำกว่าระดับที่ยิงเป็นระยะ $y$ เท่าใด เขียนในรูปของ $g$, $x$ และ $u$"
    prefix: "y ="
    answer: { latex: "\\frac{g x^2}{2u^2}", variables: [g, x, u] }
    hints:
      - "หาเวลาที่ใช้เคลื่อนที่ไปได้ระยะแนวราบ $x$ ก่อน: $t = \\dfrac{x}{u}$"
      - "แทน $t$ ลงใน $y = \\tfrac{1}{2}gt^2$"
    misconceptions:
      - { match: "\\frac{g x^2}{u^2}", feedback: "ลืม $\\tfrac{1}{2}$ ในสมการ $y = \\tfrac{1}{2}gt^2$" }
      - { match: "\\frac{g x}{2u}", feedback: "ต้องยกกำลังสองทั้ง $x$ และ $u$ เพราะ $t^2 = \\dfrac{x^2}{u^2}$" }
    solution: "$t = \\dfrac{x}{u}$ จึงได้ $y = \\tfrac{1}{2}g\\left(\\dfrac{x}{u}\\right)^2 = \\dfrac{g x^2}{2u^2}$ ระยะที่ตกเป็นสัดส่วนกับ $x^2$ แนวการเคลื่อนที่จึงเป็นพาราโบลา"
