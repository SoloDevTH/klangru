<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="sans-serif" font-size="14">
<title>การประเมินผลการฝึกอบรมสี่ระดับของเคิร์กแพทริก</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="ahk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
<text x="380.0" y="30.0" text-anchor="middle" font-size="16" fill="#222" font-weight="bold" >การประเมินผลการฝึกอบรมสี่ระดับ (เคิร์กแพทริก)</text>
<rect x="40.0" y="320.0" width="330.0" height="62.0" rx="8" fill="#fdf2e9" stroke="#d35400" stroke-width="2" />
<text x="54.0" y="346.0" text-anchor="start" font-size="16" fill="#d35400" font-weight="bold" >1. ปฏิกิริยา</text>
<text x="190.0" y="346.0" text-anchor="start" font-size="13.5" fill="#222" >ผู้เข้าอบรมพอใจไหม</text>
<text x="54.0" y="370.0" text-anchor="start" font-size="12.5" fill="#444" >แบบประเมินท้ายการอบรม · วันอบรม</text>
<rect x="140.0" y="238.0" width="330.0" height="62.0" rx="8" fill="#fef9e7" stroke="#9a7d0a" stroke-width="2" />
<text x="154.0" y="264.0" text-anchor="start" font-size="16" fill="#9a7d0a" font-weight="bold" >2. การเรียนรู้</text>
<text x="290.0" y="264.0" text-anchor="start" font-size="13.5" fill="#222" >ได้ความรู้และทักษะไหม</text>
<text x="154.0" y="288.0" text-anchor="start" font-size="12.5" fill="#444" >ทดสอบก่อนและหลัง สาธิต · วันอบรม</text>
<rect x="240.0" y="156.0" width="330.0" height="62.0" rx="8" fill="#eef4fb" stroke="#1f5fa8" stroke-width="2" />
<text x="254.0" y="182.0" text-anchor="start" font-size="16" fill="#1f5fa8" font-weight="bold" >3. พฤติกรรม</text>
<text x="390.0" y="182.0" text-anchor="start" font-size="13.5" fill="#222" >นำไปใช้ในงานจริงไหม</text>
<text x="254.0" y="206.0" text-anchor="start" font-size="12.5" fill="#444" >สังเกตหน้างาน หัวหน้าประเมิน · 1–3 เดือน</text>
<rect x="340.0" y="74.0" width="330.0" height="62.0" rx="8" fill="#edf7ee" stroke="#2e7d32" stroke-width="2" />
<text x="354.0" y="100.0" text-anchor="start" font-size="16" fill="#2e7d32" font-weight="bold" >4. ผลลัพธ์</text>
<text x="490.0" y="100.0" text-anchor="start" font-size="13.5" fill="#222" >องค์การได้ผลอะไร</text>
<text x="354.0" y="124.0" text-anchor="start" font-size="12.5" fill="#444" >ของเสีย ข้อร้องเรียน ยอดขาย · 3–12 เดือน</text>
<line x1="720.0" y1="375.0" x2="720.0" y2="70.0" stroke="#222" stroke-width="2" marker-end="url(#ahk)" />
<text x="705.0" y="220.0" text-anchor="middle" font-size="13" fill="#222" transform="rotate(-90 705 220)">วัดยากขึ้น แต่มีคุณค่าต่อองค์การมากขึ้น</text>
</svg>
