- id: health.fitness.training-principles.p017
  topics:
  - health.fitness.training-principles
  difficulty: 5
  type: numeric
  stem: โค้ชให้ข้าว อายุ 16 ปี ชีพจรขณะพัก 64 ครั้ง/นาที ฝึกช่วงหนักที่ 75% ตามวิธีของคาร์โวเนน ($\text{HR}_{\max} \approx 220 - \text{อายุ}$) ชีพจรเป้าหมายคือกี่ครั้งต่อนาที
  answer:
    value: 169.0
    tolerance: 1
    unit: ครั้ง/นาที
  misconceptions:
  - match: 105
    feedback: ลืมบวกชีพจรขณะพักกลับเข้าไป
  - match: 153
    feedback: นี่คือ 75% ของค่าสูงสุดโดยตรง ไม่ใช่วิธีของคาร์โวเนน
  hints:
  - หาค่าสูงสุดและส่วนต่างกับชีพจรขณะพักก่อน
  - ส่วนต่าง × 0.75 แล้วบวกชีพจรขณะพัก
  solution: ค่าสูงสุด $220 - 16 = 204$ ส่วนต่าง $204 - 64 = 140$ ได้ $140 \times 0.75 + 64 = 169$ ครั้ง/นาที ข้าวควรดูความรู้สึกเหนื่อยร่วมด้วย ถ้าเหนื่อยเกิน 8 จาก 10 ให้ลดความเร็ว
  license: CC-BY-SA-4.0
  ai_assisted: true
