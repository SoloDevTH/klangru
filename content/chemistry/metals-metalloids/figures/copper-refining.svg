<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330">
<title>ภาพแสดงการทำทองแดงให้บริสุทธิ์ด้วยอิเล็กโทรไลซิส ทองแดงไม่บริสุทธิ์ที่ขั้วบวกละลายเป็นไอออน และทองแดงบริสุทธิ์เกาะที่ขั้วลบ</title>
<rect x="0" y="0" width="720" height="330" fill="#ffffff"/>
<defs><marker id="ea" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#e76f51"/></marker></defs>
<rect x="150" y="110" width="420" height="175" rx="8" fill="#eaf4fb" stroke="#1d3557" stroke-width="2.5"/>
<text x="360.0" y="134" font-size="14" font-weight="bold" fill="#1d3557" text-anchor="middle" font-family="Loma, sans-serif">สารละลาย CuSO₄</text>
<text x="360.0" y="277" font-size="12" font-weight="normal" fill="#222" text-anchor="middle" font-family="Loma, sans-serif"></text>
<path d="M156,271 Q360.0,287 564,271 L564,281 L156,281 Z" fill="#8d6e63" opacity="0.8"/>
<text x="360.0" y="307" font-size="13" font-weight="normal" fill="#5d4037" text-anchor="middle" font-family="Loma, sans-serif">ตะกอนสิ่งเจือปน เช่น เงิน (Ag) และทองคำ (Au) ตกลงก้นภาชนะ</text>
<rect x="210" y="90" width="26" height="150" fill="#b87333" stroke="#5a3418" stroke-width="1.5"/>
<rect x="484" y="90" width="26" height="150" fill="#e8a87c" stroke="#5a3418" stroke-width="1.5"/>
<text x="202" y="98" font-size="13" font-weight="bold" fill="#c1440e" text-anchor="end" font-family="Loma, sans-serif">แอโนด (+)</text>
<text x="518" y="98" font-size="13" font-weight="bold" fill="#1d3557" text-anchor="start" font-family="Loma, sans-serif">แคโทด (−)</text>
<polyline points="223.0,90 223.0,50 497.0,50 497.0,90" fill="none" stroke="#333" stroke-width="2"/>
<rect x="330" y="38" width="60" height="24" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="360" y="55" font-size="12" font-weight="bold" fill="#333" text-anchor="middle" font-family="Loma, sans-serif">ไฟฟ้า DC</text>
<line x1="263.0" y1="50" x2="457.0" y2="50" stroke="#e76f51" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#ea)" opacity="0.0"/>
<text x="283.0" y="40" font-size="12" font-weight="bold" fill="#e76f51" text-anchor="middle" font-family="Loma, sans-serif">e⁻ ไหลไปขั้วลบ</text>
<text x="235.0" y="300" font-size="12" font-weight="normal" fill="#222" text-anchor="middle" font-family="Loma, sans-serif"></text>
<text x="360" y="172" font-size="14" font-weight="bold" fill="#c1440e" text-anchor="middle" font-family="Loma, sans-serif">ขั้วบวก: Cu (ไม่บริสุทธิ์) → Cu²⁺ + 2e⁻</text>
<text x="360" y="200" font-size="14" font-weight="bold" fill="#1d3557" text-anchor="middle" font-family="Loma, sans-serif">ขั้วลบ: Cu²⁺ + 2e⁻ → Cu (บริสุทธิ์)</text>
<circle cx="270" cy="220" r="13" fill="#2a9d8f" stroke="#1d3557" stroke-width="1"/>
<text x="270" y="224" font-size="9" font-weight="bold" fill="#fff" text-anchor="middle" font-family="sans-serif">Cu²⁺</text>
<circle cx="300" cy="242" r="13" fill="#2a9d8f" stroke="#1d3557" stroke-width="1"/>
<text x="300" y="246" font-size="9" font-weight="bold" fill="#fff" text-anchor="middle" font-family="sans-serif">Cu²⁺</text>
<circle cx="330" cy="220" r="13" fill="#2a9d8f" stroke="#1d3557" stroke-width="1"/>
<text x="330" y="224" font-size="9" font-weight="bold" fill="#fff" text-anchor="middle" font-family="sans-serif">Cu²⁺</text>
<circle cx="360" cy="242" r="13" fill="#2a9d8f" stroke="#1d3557" stroke-width="1"/>
<text x="360" y="246" font-size="9" font-weight="bold" fill="#fff" text-anchor="middle" font-family="sans-serif">Cu²⁺</text>
<circle cx="390" cy="220" r="13" fill="#2a9d8f" stroke="#1d3557" stroke-width="1"/>
<text x="390" y="224" font-size="9" font-weight="bold" fill="#fff" text-anchor="middle" font-family="sans-serif">Cu²⁺</text>
<circle cx="420" cy="242" r="13" fill="#2a9d8f" stroke="#1d3557" stroke-width="1"/>
<text x="420" y="246" font-size="9" font-weight="bold" fill="#fff" text-anchor="middle" font-family="sans-serif">Cu²⁺</text>
</svg>
