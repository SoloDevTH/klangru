id: english.writing.notices-announcements
subject: english
title: { th: "การเขียนประกาศและประชาสัมพันธ์ข่าวสาร", en: "Writing notices and announcements" }
summary: เขียนประกาศ โปสเตอร์ อีเมลเชิญ และข่าวประชาสัมพันธ์สั้นของโรงเรียนและชุมชน ให้มีข้อมูลครบ ใช้คำบุพบทวันเวลาถูก และเลือกภาษาให้เหมาะกับผู้อ่าน
difficulty: 4.5
minutes: 40
prerequisites: [english.writing.describing-self, english.grammar.future-forms, english.grammar.passive-voice]
encompasses:
  - { id: english.writing.describing-self, weight: 0.3 }
  - { id: english.grammar.future-forms, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: notice-parts.svg
    alt: "ประกาศตัวอย่างพร้อมป้ายสีแดงบอกส่วนประกอบ หัวเรื่อง NOTICE (ป้าย: หัวเรื่อง NOTICE หรือชื่องาน) วันที่ 2 November 2026 (ป้าย: วันที่ออกประกาศ) เนื้อความ: English Camp for M.1–M.3 Students. We are pleased to announce that the English Camp will be held on Saturday, 21 November, from 8:30 a.m. to 3:30 p.m. in the school hall. All M.1–M.3 students are invited to join. (ป้าย: เนื้อความ What · When · Where · Who) Please register with Kru Malee by 13 November. Lunch is provided. Please bring a pencil case. For more information, contact the English Department. (ป้าย: วิธีสมัคร สิ่งที่ต้องเตรียม การติดต่อ) ท้ายประกาศ Kru Malee Srisuk, Head of the English Department (ป้าย: ผู้ออกประกาศ ชื่อและตำแหน่ง)"
    caption: "ส่วนประกอบของประกาศ"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.writing.notices-announcements.p001, prompt: "วันในสัปดาห์ใช้คำบุพบทใด" }
  - type: figure
    src: mangrove-poster.svg
    alt: "โปสเตอร์สมมุติ MANGROVE PLANTING DAY คำโปรย Plant a Tree, Grow a Future! When: Saturday, 5 December 2026, 7:30 – 11:00 a.m. Where: Khlong Khon Community Centre, Samut Songkhram. Bring: a hat, a water bottle and old clothes. Boat trip: adults 60 baht, children 30 baht. Free seedlings for all volunteers! Sign up: at the community centre by 28 November. ปุ่มด้านล่างเขียนว่า JOIN US!"
    caption: "โปสเตอร์กิจกรรมชุมชน (ข้อมูลสมมุติ) ใช้ในโจทย์"
  - type: worked-example
    title: เขียนโปสเตอร์จากข้อมูลภาษาไทย
    problem: "ชุมชนตลาดน้ำจะจัดงาน \"ตลาดอาหารพื้นบ้าน\" วันอาทิตย์ที่ 22 พฤศจิกายน 2026 เวลา 16.00–21.00 น. ที่ลานวัดริมคลอง เข้าฟรี ทำโปสเตอร์ภาษาอังกฤษสำหรับนักท่องเที่ยว"
    steps:
      - text: "หัวเรื่องและคำโปรย: *LOCAL FOOD MARKET* · *Taste the Real Thailand!*"
      - text: "When: วันใช้ on เวลาใช้ from ... to ...: *on Sunday, 22 November 2026, from 4 p.m. to 9 p.m.*"
        why: "16.00 น. คือ 4 p.m. และ 21.00 น. คือ 9 p.m."
      - text: "Where และ Cost: *at the temple yard by the canal* · *Free entry*"
      - text: "ปิดด้วย call to action: *Come hungry and join us!*"
    answer: "*LOCAL FOOD MARKET — Taste the Real Thailand! / When: Sunday, 22 November 2026, 4 p.m. – 9 p.m. / Where: the temple yard by the canal / Free entry / Come hungry and join us!*"
  - { type: check, problem: english.writing.notices-announcements.p007, prompt: "โปสเตอร์ที่ดีต้องมีข้อมูลอะไรครบ" }
glossary:
  - { term: notice, definition: "ประกาศ ข้อความแจ้งข้อมูลอย่างเป็นทางการ มีหัวเรื่อง วันที่ เนื้อความ และผู้ออกประกาศ" }
  - { term: poster, definition: "โปสเตอร์ ใบปิด ใช้หัวเรื่องใหญ่ ข้อมูลเป็นข้อ ๆ และคำเชิญชวน" }
  - { term: call to action, definition: "คำเชิญชวนให้ลงมือทำ เช่น Join us!, Sign up today!" }
  - { term: will be held, definition: "จะจัดขึ้น ใช้บอกกำหนดการในอนาคตอย่างเป็นทางการ" }
  - { term: register, definition: "ลงทะเบียน สมัคร" }
  - { term: subject line, definition: "หัวเรื่องของอีเมล บอกใจความสั้น ๆ" }
flashcards:
  - { front: "on / at / in กับวันเวลา", back: "on Saturday, on 21 November · at 9 a.m. · in November" }
  - { front: "ข้อมูลที่ประกาศต้องมี", back: "What, When, Where, Who, How (สมัคร ค่าใช้จ่าย) และช่องทางติดต่อ" }
  - { front: "จะจัดขึ้นที่หอประชุม", back: "It will be held in the school hall." }
  - { front: "ประโยคแรกของอีเมลเชิญ", back: "I'm writing to invite you to ..." }
  - { front: "ข่าวประชาสัมพันธ์หลังจบงานใช้ tense อะไร", back: "past simple เช่น More than 200 people joined ..." }
