id: thai.writing.tone-rules
subject: thai
title: { th: คำเป็นคำตายและการผันวรรณยุกต์, en: Live and dead syllables and Thai tone rules }
summary: แยกคำเป็นกับคำตาย แล้วใช้หมู่ของพยัญชนะต้นและรูปวรรณยุกต์หาเสียงวรรณยุกต์ตามตารางไตรยางศ์ รวมถึงคำที่มีอักษรนำ
difficulty: 3
minutes: 35
prerequisites: [thai.writing.consonants]
encompasses:
  - { id: thai.writing.consonants, weight: 0.5 }
curriculum_tags: []
lessons:
  - type: figure
    src: thai-tone-contours.svg
    alt: "เส้นระดับเสียงวรรณยุกต์ไทย 5 เสียง บนสเกล 1 ต่ำสุดถึง 5 สูงสุด: สามัญ กา ระดับกลาง 3 คงที่, เอก ก่า เริ่มราว 2 แล้วค่อย ๆ ลงถึงราว 1, โท ก้า เริ่มสูงราว 4 แล้วตกลงถึงราว 1, ตรี ก๊า เริ่มราว 3.5 แล้วขึ้นถึง 5, จัตวา ก๋า เริ่มราว 2 ลงต่ำเล็กน้อยแล้วเชิดขึ้นราว 3.5"
    caption: "เสียงวรรณยุกต์ 5 เสียงของอักษรกลาง กา ก่า ก้า ก๊า ก๋า"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: tone-chart.svg
    alt: "ตารางผันวรรณยุกต์ แถวคือหมู่อักษรกับคำเป็นคำตาย คอลัมน์คือไม่มีรูป ไม้เอก ไม้โท ไม้ตรี ไม้จัตวา: อักษรกลางคำเป็น สามัญ เอก โท ตรี จัตวา; อักษรกลางคำตาย เอก – โท ตรี จัตวา; อักษรสูงคำเป็น จัตวา เอก โท – –; อักษรสูงคำตาย เอก – โท – –; อักษรต่ำคำเป็น สามัญ โท ตรี – –; อักษรต่ำคำตายสระสั้น ตรี โท – – –; อักษรต่ำคำตายสระยาว โท – ตรี – – แต่ละเสียงระบายสีต่างกัน"
    caption: "ตารางผันวรรณยุกต์ระบายสีตามเสียง สังเกตว่าเสียงโทอยู่ได้ทั้งไม้เอกและไม้โท"
  - type: worked-example
    title: หาเสียงวรรณยุกต์ของคำว่า ไก่
    problem: "คำว่า ไก่ ออกเสียงวรรณยุกต์อะไร"
    steps:
      - text: "พยัญชนะต้นคือ ก เป็นอักษรกลาง"
        why: "สระ ไ- เขียนไว้หน้า แต่พยัญชนะต้นคือ ก"
      - text: "สระ ไอ เป็นคำเป็นเสมอ"
        why: "ไอ ใอ อำ เอา มีเสียง ย ม ว อยู่ท้าย จึงลากเสียงได้"
      - text: "รูปวรรณยุกต์คือไม้เอก"
      - text: "เปิดตาราง: อักษรกลาง คำเป็น ไม้เอก = เสียงเอก"
    answer: "เสียงเอก"
  - { type: check, problem: thai.tone.p017, prompt: "ลองคำที่มีไม้ไต่คู้ดูบ้าง" }
  - type: worked-example
    title: อ่านคำว่า ฉลาด ให้ถูกเสียง
    problem: "คำว่า ฉลาด อ่านอย่างไร และพยางค์ที่สองออกเสียงวรรณยุกต์อะไร"
    steps:
      - text: "ฉ กับ ล อยู่ติดกันโดยไม่มีสระคั่น ฉ เป็นอักษรสูง ล เป็นอักษรต่ำเดี่ยว จึงเป็นอักษรนำ"
      - text: "ฉ ออกเสียงเป็นพยางค์ของตัวเอง ประสมสระอะ ได้ ฉะ"
        why: "ต่างจาก ห นำ ที่ ห ไม่ออกเสียง ตัวนำอื่นยังมีเสียงของตัวเอง"
      - text: "พยางค์หลังคือ ลาด ผันตามตัวนำ ฉ จึงใช้แถวอักษรสูง"
      - text: "ด สะกด แม่กด เป็นคำตาย ไม่มีรูปวรรณยุกต์"
      - text: "อักษรสูง คำตาย ไม่มีรูป = เสียงเอก จึงอ่านว่า ฉะ-หลาด"
        why: "ถ้าใช้แถวอักษรต่ำ (ล คำตายสระยาว) จะได้เสียงโท ซึ่งผิด"
    answer: "อ่านว่า ฉะ-หลาด พยางค์ที่สองเสียงเอก"
  - { type: check, problem: thai.tone.p018, prompt: "ใช้หลักอักษรนำกับคำนี้" }
glossary:
  - { term: คำเป็น, definition: "พยางค์ที่ลากเสียงยาวได้ คือสระเสียงยาวไม่มีตัวสะกด หรือมีตัวสะกดแม่กง กน กม เกย เกอว รวมทั้งสระ อำ ไอ ใอ เอา" }
  - { term: คำตาย, definition: "พยางค์ที่เสียงหยุดสั้น คือสระเสียงสั้นไม่มีตัวสะกด หรือมีตัวสะกดแม่กก กด กบ" }
  - { term: อักษรนำ, definition: "พยัญชนะสองตัวที่ออกเสียงเป็นพยางค์เดียว ตัวหน้าบังคับเสียงวรรณยุกต์ เช่น ห นำ ม ในคำว่า หมา" }
flashcards:
  - { front: "ตัวสะกดแม่ใดทำให้เป็นคำตาย", back: "แม่กก กด กบ (ก ด บ) และสระเสียงสั้นที่ไม่มีตัวสะกด" }
  - { front: "อักษรต่ำ + ไม้โท ออกเสียงอะไร", back: "เสียงตรี เช่น ม้า น้อง ค้า" }
  - { front: "อักษรสูง คำเป็น ไม่มีรูปวรรณยุกต์ ออกเสียงอะไร", back: "เสียงจัตวา เช่น ขา สอง หมู (ห นำ)" }
  - { front: "อักษรต่ำ คำตาย ไม่มีรูปวรรณยุกต์ ออกเสียงอะไร", back: "สระสั้นเป็นเสียงตรี (รัก นะ) สระยาวเป็นเสียงโท (มาก เลข)" }
  - { front: "อ นำ ย มีคำใดบ้าง", back: "อย่า อยู่ อย่าง อยาก ผันตามอักษรกลาง ออกเสียงเอกทั้งหมด" }
