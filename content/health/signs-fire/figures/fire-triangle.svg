<text x="205.0" y="188.0" font-size="12" text-anchor="end" fill="#111">(ไม้ขีด เตา ไฟฟ้าลัดวงจร)</text>
<text x="415.0" y="165.0" font-size="18" text-anchor="start" font-weight="bold" fill="#111">ออกซิเจน</text>
