    type: mcq
    stem: "นักเรียนต้องการทดสอบว่าปุ๋ยชนิดใหม่ทำให้ผักกาดโตเร็วขึ้นหรือไม่ จึงปลูกกระถางที่ใส่ปุ๋ยไว้ริมหน้าต่างที่มีแดดทั้งวัน และกระถางที่ไม่ใส่ปุ๋ยไว้มุมห้องที่ร่ม ผลคือกระถางที่ใส่ปุ๋ยโตกว่ามาก ข้อใดประเมินการทดลองนี้ได้ถูกต้องที่สุด"
    choices:
