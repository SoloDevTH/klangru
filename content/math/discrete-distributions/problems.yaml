  - id: math.stats.discrete-distributions.p013
    topics: [math.stats.discrete-distributions]
    difficulty: 4
    type: numeric
    stem: "กล่องมีลูกบอล 20 ลูก ชำรุด 4 ลูก สุ่มหยิบ 5 ลูกโดยไม่ใส่คืน ให้ $X$ เป็นจำนวนลูกชำรุดที่หยิบได้ จงหาความแปรปรวนของ $X$ (ตอบทศนิยม 4 ตำแหน่ง)"
    answer: { value: 0.6316, tolerance: 0.0001 }
    hints:
      - "สูตรความแปรปรวนของไฮเปอร์จีโอเมตริกมีตัวคูณประชากรจำกัด $\\frac{N-n}{N-1}$ ด้วย"
      - "ค่า $\\frac{K}{N}\\cdot\\frac{N-K}{N}$ คำนวณจากสัดส่วนของลูกชำรุดและลูกดี"
      - "ใช้ $\\mathrm{Var}(X)=n\\cdot\\frac{K}{N}\\cdot\\frac{N-K}{N}\\cdot\\frac{N-n}{N-1}$"
    misconceptions:
