# ผลการเรียนรู้รายวิชาเพิ่มเติม สาระเคมี (ฉบับปรับปรุง พ.ศ. 2560) ระดับ ม.4–6
#
# การจัดโครงสร้าง (ต้นฉบับไม่มีระดับ สาระ→มาตรฐาน→ตัวชี้วัด แบบหลักสูตรแกนกลาง จึงจับคู่ดังนี้)
#   strand    = สาระเคมี ทั้งสาระ (หนึ่งไฟล์ต่อหนึ่งรายวิชาเพิ่มเติม)
#   standard  = ข้อ ๑, ๒, ... ของสาระ (ข้อความ "เข้าใจ..." ที่ขึ้นต้นตารางผลการเรียนรู้แต่ละตาราง) ทำหน้าที่จัดกลุ่มเนื้อหา
#   indicator = ผลการเรียนรู้แต่ละข้อ level = ชั้นที่ต้นฉบับระบุในคอลัมน์ "ชั้น" (ม.4, ม.5, ม.6)
#
# รหัส: ต้นฉบับไม่มีรหัสทางการ ต้นฉบับนับเลขผลการเรียนรู้ใหม่ตั้งแต่ ๑ ในแต่ละชั้นของแต่ละข้อ
#   รหัสในไฟล์นี้ ("เคมี <ข้อ> ม.<ชั้น>/<ลำดับ>" เช่น "เคมี 1 ม.4/1") เป็นรหัสที่คลังรู้ตั้งเอง ตามเลขข้อ ชั้น และลำดับในต้นฉบับ
#   ข้อความผลการเรียนรู้และข้อความมาตรฐานคัดจากต้นฉบับทุกตัวอักษร (เลขไทยในข้อความคงไว้ตามต้นฉบับ)
#
# วิธีคัด: ข้อความอยู่ในชั้นข้อความของ PDF (ไม่ใช่ภาพสแกน) แยกคอลัมน์ผลการเรียนรู้ด้วย pdftotext ตามพิกัด
#   และกำหนดช่องว่างตามอักขระช่องว่างที่มีจริงใน PDF (อ่านด้วย pypdf) จึงมีช่องว่างบางจุดที่ผู้จัดหน้าใส่ไว้ท้ายบรรทัด
#   ทำให้บางคำดูเหมือนถูกเว้นวรรคกลางวลี และบางจุดที่ขึ้นบรรทัดใหม่โดยไม่มีอักขระช่องว่างจะติดกัน คงไว้ตามต้นฉบับ
#   ข้อความมาตรฐานจัดชิดขอบสองข้าง PDF ไม่มีอักขระช่องว่าง จึงกำหนดช่องว่างจากระยะห่างระหว่างคำ
#   โดยเทียบหัวตารางกับหน้า "สาระวิทยาศาสตร์เพิ่มเติม" (หน้า 129-131) จุดที่ตัดบรรทัดตรงกันทั้งสองแห่งตัดสินจากวลี

id: th-core-2560-chemistry-additional
title: "ผลการเรียนรู้รายวิชาเพิ่มเติม สาระเคมี กลุ่มสาระการเรียนรู้วิทยาศาสตร์ (ฉบับปรับปรุง พ.ศ. 2560) ตามหลักสูตรแกนกลางการศึกษาขั้นพื้นฐาน พุทธศักราช 2551"
short: "เคมีเพิ่มเติม 2560"
kind: national-curriculum
subjects: [chemistry]
language: th
sources:
  - { title: "ตัวชี้วัดและสาระการเรียนรู้แกนกลาง กลุ่มสาระการเรียนรู้วิทยาศาสตร์ (ฉบับปรับปรุง พ.ศ. ๒๕๖๐) ตามหลักสูตรแกนกลางการศึกษาขั้นพื้นฐาน พุทธศักราช ๒๕๕๑ ส่วนผลการเรียนรู้และสาระการเรียนรู้เพิ่มเติม", url: "https://www.ipst.ac.th/wp-content/uploads/2022/05/SciCurriculum_2560.pdf", publisher: "สพฐ. กระทรวงศึกษาธิการ และ สสวท.", retrieved: "2026-10-24", pages: "130, 169-189 (เลขหน้าที่พิมพ์ในเล่ม)" }
copyright: "ต้นฉบับเป็นหนังสือที่ สพฐ. กระทรวงศึกษาธิการ จัดพิมพ์และเผยแพร่ (พ.ศ. 2560) ให้สถานศึกษาใช้เป็นกรอบพัฒนาหลักสูตร คำนำระบุว่ากระทรวงศึกษาธิการโดย สสวท. เป็นผู้จัดทำมาตรฐานการเรียนรู้และตัวชี้วัด คลังรู้ตีความว่าเป็นเอกสารของหน่วยงานรัฐที่ไม่เป็นงานอันมีลิขสิทธิ์ตาม พ.ร.บ.ลิขสิทธิ์ พ.ศ. 2537 มาตรา 7 (เป็นการตีความของเรา ไม่ใช่คำวินิจฉัยทางกฎหมาย)"
completeness: full-text
strands:
  - id: "เคมี"
    title: "สาระเคมี"
    standards:
      - id: "เคมี 1"
        text: "เข้าใจโครงสร้างอะตอม การจัดเรียงธาตุในตารางธาตุ สมบัติของธาตุ พันธะเคมีและสมบัติของสาร แก๊สและสมบัติของแก๊ส ประเภทและสมบัติของสารประกอบอินทรีย์และพอลิเมอร์ รวมทั้งการนำความรู้ไปใช้ประโยชน์"
        indicators:
          - { id: "เคมี 1 ม.4/1", level: "ม.4", text: "สืบค้นข้อมูลสมมติฐาน การทดลอง หรือ ผลการทดลองที่เป็นประจักษ์พยานในการเสนอแบบจำลองอะตอมของนักวิทยาศาสตร์ และอธิบายวิวัฒนาการของแบบจำลองอะตอม" }
          - { id: "เคมี 1 ม.4/2", level: "ม.4", text: "เขียนสัญลักษณ์นิวเคลียร์ของธาตุ และระบุจำนวนโปรตอน นิวตรอน และอิเล็กตรอนของอะตอมจากสัญลักษณ์นิวเคลียร์ รวมทั้งบอกความหมายของไอโซโทป" }
          - { id: "เคมี 1 ม.4/3", level: "ม.4", text: "อธิบาย และเขียนการจัดเรียงอิเล็กตรอน ในระดับพลังงานหลักและระดับพลังงานย่อยเมื่อทราบเลขอะตอมของธาตุ" }
          - { id: "เคมี 1 ม.4/4", level: "ม.4", text: "ระบุหมู่ คาบ ความเป็นโลหะ อโลหะ และ กึ่งโลหะ ของธาตุเรพรีเซนเททีฟและธาตุ แทรนซิชันในตารางธาตุ" }
          - { id: "เคมี 1 ม.4/5", level: "ม.4", text: "วิเคราะห์ และบอกแนวโน้มสมบัติของธาตุ เรพรีเซนเททีฟตามหมู่และตามคาบ" }
          - { id: "เคมี 1 ม.4/6", level: "ม.4", text: "บอกสมบัติของธาตุโลหะแทรนซิชัน และ เปรียบเทียบสมบัติกับธาตุโลหะในกลุ่มธาตุ เรพรีเซนเททีฟ" }
          - { id: "เคมี 1 ม.4/7", level: "ม.4", text: "อธิบายสมบัติ และคำนวณครึ่งชีวิตของไอโซโทปกัมมันตรังสี" }
          - { id: "เคมี 1 ม.4/8", level: "ม.4", text: "สืบค้นข้อมูล และยกตัวอย่างการนำธาตุ มาใช้ประโยชน์ รวมทั้งผลกระทบต่อสิ่งมีชีวิต และสิ่งแวดล้อม" }
          - { id: "เคมี 1 ม.4/9", level: "ม.4", text: "อธิบายการเกิดไอออนและการเกิดพันธะ ไอออนิก โดยใช้แผนภาพหรือสัญลักษณ์ แบบจุดของลิวอิส" }
          - { id: "เคมี 1 ม.4/10", level: "ม.4", text: "เขียนสูตร และเรียกชื่อสารประกอบไอออนิก" }
          - { id: "เคมี 1 ม.4/11", level: "ม.4", text: "คำนวณพลังงานที่เกี่ยวข้องกับปฏิกิริยา การเกิดสารประกอบไอออนิกจากวัฏจักร บอร์น-ฮาเบอร์" }
          - { id: "เคมี 1 ม.4/12", level: "ม.4", text: "อธิบายสมบัติของสารประกอบไอออนิก" }
          - { id: "เคมี 1 ม.4/13", level: "ม.4", text: "เขียนสมการไอออนิกและสมการไอออนิกสุทธิของปฏิกิริยาของสารประกอบไอออนิก" }
          - { id: "เคมี 1 ม.4/14", level: "ม.4", text: "อธิบายการเกิดพันธะโคเวเลนต์แบบพันธะเดี่ยวพันธะคู่ และพันธะสาม ด้วยโครงสร้างลิวอิส" }
          - { id: "เคมี 1 ม.4/15", level: "ม.4", text: "เขียนสูตร และเรียกชื่อสารโคเวเลนต์" }
          - { id: "เคมี 1 ม.4/16", level: "ม.4", text: "วิเคราะห์ และเปรียบเทียบความยาวพันธะ และพลังงานพันธะในสารโคเวเลนต์ รวมทั้งคำนวณพลังงานที่เกี่ยวข้องกับปฏิกิริยาของสารโคเวเลนต์จากพลังงานพันธะ" }
          - { id: "เคมี 1 ม.4/17", level: "ม.4", text: "คาดคะเนรูปร่างโมเลกุลโคเวเลนต์ โดยใช้ทฤษฎีการผลักระหว่างคู่อิเล็กตรอนในวงเวเลนซ์ และระบุสภาพขั้วของโมเลกุลโคเวเลนต์" }
          - { id: "เคมี 1 ม.4/18", level: "ม.4", text: "ระบุชนิดของแรงยึดเหนี่ยวระหว่างโมเลกุล โคเวเลนต์ และเปรียบเทียบจุดหลอมเหลว จุดเดือด และการละลายน้ำของสารโคเวเลนต์" }
          - { id: "เคมี 1 ม.4/19", level: "ม.4", text: "สืบค้นข้อมูล และอธิบายสมบัติของ สารโคเวเลนต์โครงร่างตาข่ายชนิดต่าง ๆ" }
          - { id: "เคมี 1 ม.4/20", level: "ม.4", text: "อธิบายการเกิดพันธะโลหะและสมบัติของโลหะ" }
          - { id: "เคมี 1 ม.4/21", level: "ม.4", text: "เปรียบเทียบสมบัติบางประการของสารประกอบไอออนิก สารโคเวเลนต์ และโลหะ สืบค้นข้อมูลและนำเสนอตัวอย่างการใช้ประโยชน์ของ สารประกอบไอออนิก สารโคเวเลนต์ และโลหะ ได้อย่างเหมาะสม" }
          - { id: "เคมี 1 ม.5/1", level: "ม.5", text: "อธิบายความสัมพันธ์และคำนวณปริมาตร ความดัน หรืออุณหภูมิของแก๊สที่ภาวะต่าง ๆ ตามกฎของบอยล์ กฎของชาร์ล กฎของ เกย์-ลูสแซก" }
          - { id: "เคมี 1 ม.5/2", level: "ม.5", text: "คำนวณปริมาตร ความดัน หรืออุณหภูมิ ของแก๊สที่ภาวะต่าง ๆ ตามกฎรวมแก๊ส" }
          - { id: "เคมี 1 ม.5/3", level: "ม.5", text: "คำนวณปริมาตร ความดัน อุณหภูมิ จำนวนโมล หรือมวลของแก๊ส จากความสัมพันธ์ตามกฎของอาโวกาโดร และกฎแก๊สอุดมคติ" }
          - { id: "เคมี 1 ม.5/4", level: "ม.5", text: "คำนวณความดันย่อยหรือจำนวนโมลของแก๊ส ในแก๊สผสม โดยใช้กฎความดันย่อยของดอลตัน" }
          - { id: "เคมี 1 ม.5/5", level: "ม.5", text: "อธิบายการแพร่ของแก๊สโดยใช้ทฤษฎีจลน์ ของแก๊ส คำนวณและเปรียบเทียบอัตรา การแพร่ของแก๊ส โดยใช้กฎการแพร่ผ่านของ เกรแฮม" }
          - { id: "เคมี 1 ม.5/6", level: "ม.5", text: "สืบค้นข้อมูล นำเสนอตัวอย่าง และอธิบายการประยุกต์ใช้ความรู้เกี่ยวกับสมบัติและกฎต่าง ๆ ของแก๊สในการอธิบายปรากฏการณ์ หรือ แก้ปัญหาในชีวิตประจำวันและในอุตสาหกรรม" }
          - { id: "เคมี 1 ม.6/1", level: "ม.6", text: "สืบค้นข้อมูลและนำเสนอตัวอย่างสารประกอบอินทรีย์ที่มีพันธะเดี่ยว พันธะคู่ หรือพันธะสาม ที่พบในชีวิตประจำวัน" }
          - { id: "เคมี 1 ม.6/2", level: "ม.6", text: "เขียนสูตรโครงสร้างลิวอิส สูตรโครงสร้างแบบย่อและสูตรโครงสร้างแบบเส้นของสารประกอบอินทรีย์" }
          - { id: "เคมี 1 ม.6/3", level: "ม.6", text: "วิเคราะห์โครงสร้าง และระบุประเภท ของสารประกอบอินทรีย์จากหมู่ฟังก์ชัน" }
          - { id: "เคมี 1 ม.6/4", level: "ม.6", text: "เขียนสูตรโครงสร้างและเรียกชื่อสารประกอบอินทรีย์ประเภทต่าง ๆ ที่มีหมู่ฟังก์ชันไม่เกิน ๑ หมู่ ตามระบบ IUPAC" }
          - { id: "เคมี 1 ม.6/5", level: "ม.6", text: "เขียนไอโซเมอร์โครงสร้างของสารประกอบอินทรีย์ประเภทต่าง ๆ" }
          - { id: "เคมี 1 ม.6/6", level: "ม.6", text: "วิเคราะห์ และเปรียบเทียบจุดเดือดและ การละลายในน้ำของสารประกอบอินทรีย์ที่มี หมู่ฟังก์ชัน ขนาดโมเลกุล หรือโครงสร้างต่างกัน" }
          - { id: "เคมี 1 ม.6/7", level: "ม.6", text: "ระบุประเภทของสารประกอบไฮโดรคาร์บอนและเขียนผลิตภัณฑ์จากปฏิกิริยาการเผาไหม้ ปฏิกิริยากับโบรมีน หรือปฏิกิริยากับโพแทสเซียมเปอร์แมงกาเนต" }
          - { id: "เคมี 1 ม.6/8", level: "ม.6", text: "เขียนสมการเคมีและอธิบายการเกิดปฏิกิริยาเอสเทอริฟิเคชัน ปฏิกิริยาการสังเคราะห์เอไมด์ปฏิกิริยาไฮโดรลิซิส และปฏิกิริยาสะปอนนิฟิเคชัน" }
          - { id: "เคมี 1 ม.6/9", level: "ม.6", text: "ทดสอบปฏิกิริยาเอสเทอริฟิเคชัน ปฏิกิริยาไฮโดรลิซิส และปฏิกิริยาสะปอนนิฟิเคชัน" }
          - { id: "เคมี 1 ม.6/10", level: "ม.6", text: "สืบค้นข้อมูล และนำเสนอตัวอย่างการนำสารประกอบอินทรีย์ไปใช้ประโยชน์ในชีวิตประจำวันและอุตสาหกรรม" }
          - { id: "เคมี 1 ม.6/11", level: "ม.6", text: "ระบุประเภทของปฏิกิริยาการเกิดพอลิเมอร์จากโครงสร้างของมอนอเมอร์หรือพอลิเมอร์" }
          - { id: "เคมี 1 ม.6/12", level: "ม.6", text: "วิเคราะห์ และอธิบายความสัมพันธ์ระหว่างโครงสร้างและสมบัติของพอลิเมอร์ รวมทั้ง การนำไปใช้ประโยชน์" }
          - { id: "เคมี 1 ม.6/13", level: "ม.6", text: "ทดสอบ และระบุประเภทของพลาสติก และผลิตภัณฑ์ยาง รวมทั้งการนำไปใช้ประโยชน์" }
          - { id: "เคมี 1 ม.6/14", level: "ม.6", text: "อธิบายผลของการปรับเปลี่ยนโครงสร้าง และการสังเคราะห์พอลิเมอร์ที่มีต่อสมบัติของ พอลิเมอร์" }
          - { id: "เคมี 1 ม.6/15", level: "ม.6", text: "สืบค้นข้อมูล และนำเสนอตัวอย่างผลกระทบจากการใช้และการกำจัดผลิตภัณฑ์พอลิเมอร์และแนวทางแก้ไข" }
      - id: "เคมี 2"
        text: "เข้าใจการเขียนและการดุลสมการเคมี ปริมาณสัมพันธ์ในปฏิกิริยาเคมี อัตราการเกิดปฏิกิริยาเคมี สมดุลในปฏิกิริยาเคมี สมบัติและปฏิกิริยาของกรด-เบส ปฏิกิริยารีดอกซ์และเซลล์เคมีไฟฟ้า รวมทั้งการนำความรู้ไปใช้ประโยชน์"
        indicators:
          - { id: "เคมี 2 ม.4/1", level: "ม.4", text: "แปลความหมายสัญลักษณ์ในสมการเคมี เขียนและดุลสมการเคมีของปฏิกิริยาเคมี บางชนิด" }
          - { id: "เคมี 2 ม.4/2", level: "ม.4", text: "คำนวณปริมาณของสารในปฏิกิริยาเคมี ที่เกี่ยวข้องกับมวลสาร" }
          - { id: "เคมี 2 ม.4/3", level: "ม.4", text: "คำนวณปริมาณของสารในปฏิกิริยาเคมี ที่เกี่ยวข้องกับความเข้มข้นของสารละลาย" }
          - { id: "เคมี 2 ม.4/4", level: "ม.4", text: "คำนวณปริมาณของสารในปฏิกิริยาเคมี ที่เกี่ยวข้องกับปริมาตรแก๊ส" }
          - { id: "เคมี 2 ม.4/5", level: "ม.4", text: "คำนวณปริมาณของสารในปฏิกิริยาเคมี หลายขั้นตอน" }
          - { id: "เคมี 2 ม.4/6", level: "ม.4", text: "ระบุสารกำหนดปริมาณ และคำนวณปริมาณ สารต่าง ๆ ในปฏิกิริยาเคมี" }
          - { id: "เคมี 2 ม.4/7", level: "ม.4", text: "คำนวณผลได้ร้อยละของผลิตภัณฑ์ในปฏิกิริยาเคมี" }
          - { id: "เคมี 2 ม.5/1", level: "ม.5", text: "ทดลอง และเขียนกราฟการเพิ่มขึ้นหรือลดลงของสารที่ทำการวัดในปฏิกิริยา" }
          - { id: "เคมี 2 ม.5/2", level: "ม.5", text: "คำนวณอัตราการเกิดปฏิกิริยาเคมี และเขียนกราฟการลดลงหรือเพิ่มขึ้นของสารที่ไม่ได้วัด ในปฏิกิริยา" }
          - { id: "เคมี 2 ม.5/3", level: "ม.5", text: "เขียนแผนภาพ และอธิบายทิศทางการชนกัน ของอนุภาคและพลังงานที่ส่งผลต่ออัตรา การเกิดปฏิกิริยาเคมี" }
          - { id: "เคมี 2 ม.5/4", level: "ม.5", text: "ทดลอง และอธิบายผลของความเข้มข้น พื้นที่ผิวของสารตั้งต้น อุณหภูมิ และตัวเร่งปฏิกิริยาที่มีต่ออัตราการเกิดปฏิกิริยาเคมี" }
          - { id: "เคมี 2 ม.5/5", level: "ม.5", text: "เปรียบเทียบอัตราการเกิดปฏิกิริยาเมื่อมีการเปลี่ยนแปลงความเข้มข้น พื้นที่ผิวของสารตั้งต้นอุณหภูมิ และตัวเร่งปฏิกิริยา" }
          - { id: "เคมี 2 ม.5/6", level: "ม.5", text: "ยกตัวอย่าง และอธิบายปัจจัยที่มีผลต่ออัตรา การเกิดปฏิกิริยาเคมีในชีวิตประจำวัน หรืออุตสาหกรรม" }
          - { id: "เคมี 2 ม.5/7", level: "ม.5", text: "ทดสอบ และอธิบายความหมายของ ปฏิกิริยาผันกลับได้และภาวะสมดุล" }
          - { id: "เคมี 2 ม.5/8", level: "ม.5", text: "อธิบายการเปลี่ยนแปลงความเข้มข้นของสาร อัตราการเกิดปฏิกิริยาไปข้างหน้า และอัตรา การเกิดปฏิกิริยาย้อนกลับ เมื่อเริ่มปฏิกิริยา จนกระทั่งระบบอยู่ในภาวะสมดุล" }
          - { id: "เคมี 2 ม.5/9", level: "ม.5", text: "คำนวณค่าคงที่สมดุลของปฏิกิริยา" }
          - { id: "เคมี 2 ม.5/10", level: "ม.5", text: "คำนวณความเข้มข้นของสารที่ภาวะสมดุล" }
          - { id: "เคมี 2 ม.5/11", level: "ม.5", text: "คำนวณค่าคงที่สมดุลหรือความเข้มข้นของปฏิกิริยาหลายขั้นตอน" }
          - { id: "เคมี 2 ม.5/12", level: "ม.5", text: "ระบุปัจจัยที่มีผลต่อภาวะสมดุลและ ค่าคงที่สมดุลของระบบ รวมทั้งคาดคะเน การเปลี่ยนแปลงที่เกิดขึ้นเมื่อภาวะสมดุล ของระบบถูกรบกวน โดยใช้หลักของ เลอชาเตอลิเอ" }
          - { id: "เคมี 2 ม.5/13", level: "ม.5", text: "ยกตัวอย่าง และอธิบายสมดุลเคมีของกระบวนการที่เกิดขึ้นในสิ่งมีชีวิต ปรากฏการณ์ในธรรมชาติและกระบวนการในอุตสาหกรรม" }
          - { id: "เคมี 2 ม.5/14", level: "ม.5", text: "ระบุ และอธิบายว่าสารเป็นกรดหรือเบส โดยใช้ทฤษฎีกรด-เบสของอาร์เรเนียส เบรินสเตด-ลาวรี และลิวอิส" }
          - { id: "เคมี 2 ม.5/15", level: "ม.5", text: "ระบุคู่กรด-เบสของสารตามทฤษฎีกรด-เบสของเบรินสเตด-ลาวรี" }
          - { id: "เคมี 2 ม.5/16", level: "ม.5", text: "คำนวณ และเปรียบเทียบความสามารถ ในการแตกตัวหรือความแรงของกรดและเบส" }
          - { id: "เคมี 2 ม.5/17", level: "ม.5", text: "คำนวณค่า pH ความเข้มข้นของไฮโดรเนียมไอออนหรือไฮดรอกไซด์ไอออนของ สารละลายกรดและเบส" }
          - { id: "เคมี 2 ม.5/18", level: "ม.5", text: "เขียนสมการเคมีแสดงปฏิกิริยาสะเทิน และระบุความเป็นกรด-เบสของสารละลาย หลังการสะเทิน" }
          - { id: "เคมี 2 ม.5/19", level: "ม.5", text: "เขียนปฏิกิริยาไฮโดรลิซิสของเกลือ และระบุความเป็นกรด-เบสของสารละลายเกลือ" }
          - { id: "เคมี 2 ม.5/20", level: "ม.5", text: "ทดลอง และอธิบายหลักการการไทเทรต และเลือกใช้อินดิเคเตอร์ที่เหมาะสมสำหรับ การไทเทรตกรด-เบส" }
          - { id: "เคมี 2 ม.5/21", level: "ม.5", text: "คำนวณปริมาณสารหรือความเข้มข้นของสารละลายกรดหรือเบสจากการไทเทรต" }
          - { id: "เคมี 2 ม.5/22", level: "ม.5", text: "อธิบายสมบัติ องค์ประกอบ และประโยชน์ของสารละลายบัฟเฟอร์" }
          - { id: "เคมี 2 ม.5/23", level: "ม.5", text: "สืบค้นข้อมูล และนำเสนอตัวอย่างการใช้ประโยชน์และการแก้ปัญหาโดยใช้ความรู้เกี่ยวกับ กรด-เบส" }
          - { id: "เคมี 2 ม.5/24", level: "ม.5", text: "คำนวณเลขออกซิเดชัน และระบุปฏิกิริยา ที่เป็นปฏิกิริยารีดอกซ์" }
          - { id: "เคมี 2 ม.5/25", level: "ม.5", text: "วิเคราะห์การเปลี่ยนแปลงเลขออกซิเดชัน และระบุตัวรีดิวซ์และตัวออกซิไดส์ รวมทั้งเขียนครึ่งปฏิกิริยาออกซิเดชันและครึ่งปฏิกิริยารีดักชันของปฏิกิริยารีดอกซ์" }
          - { id: "เคมี 2 ม.5/26", level: "ม.5", text: "ทดลอง และเปรียบเทียบความสามารถในการเป็นตัวรีดิวซ์หรือตัวออกซิไดส์ และเขียนแสดงปฏิกิริยารีดอกซ์" }
          - { id: "เคมี 2 ม.5/27", level: "ม.5", text: "ดุลสมการรีดอกซ์ด้วยการใช้เลขออกซิเดชัน และวิธีครึ่งปฏิกิริยา" }
          - { id: "เคมี 2 ม.5/28", level: "ม.5", text: "ระบุองค์ประกอบของเซลล์เคมีไฟฟ้า และเขียนสมการเคมีของปฏิกิริยาที่แอโนดและแคโทด ปฏิกิริยารวม และแผนภาพเซลล์" }
          - { id: "เคมี 2 ม.5/29", level: "ม.5", text: "คำนวณค่าศักย์ไฟฟ้ามาตรฐานของเซลล์ และระบุประเภทของเซลล์เคมีไฟฟ้า ขั้วไฟฟ้า และปฏิกิริยาเคมีที่เกิดขึ้น" }
          - { id: "เคมี 2 ม.5/30", level: "ม.5", text: "อธิบายหลักการทำงาน และเขียนสมการแสดงปฏิกิริยาของเซลล์ปฐมภูมิและเซลล์ทุติยภูมิ" }
          - { id: "เคมี 2 ม.5/31", level: "ม.5", text: "ทดลองชุบโลหะและแยกสารเคมีด้วยกระแสไฟฟ้า และอธิบายหลักการทางเคมีไฟฟ้าที่ใช้ในการชุบโลหะ การแยกสารเคมีด้วยกระแสไฟฟ้า การทำโลหะให้บริสุทธิ์ และการป้องกันการกัดกร่อนของโลหะ" }
          - { id: "เคมี 2 ม.5/32", level: "ม.5", text: "สืบค้นข้อมูล และนำเสนอตัวอย่างความก้าวหน้าทางเทคโนโลยีที่เกี่ยวข้องกับเซลล์เคมีไฟฟ้า ในชีวิตประจำวัน" }
      - id: "เคมี 3"
        text: "เข้าใจหลักการทำปฏิบัติการเคมี การวัดปริมาณสาร หน่วยวัดและการเปลี่ยนหน่วย การคำนวณปริมาณของสาร ความเข้มข้นของสารละลาย รวมทั้งการบูรณาการความรู้และทักษะในการอธิบายปรากฏการณ์ในชีวิตประจำวันและการแก้ปัญหาทางเคมี"
        indicators:
          - { id: "เคมี 3 ม.4/1", level: "ม.4", text: "บอก และอธิบายข้อปฏิบัติเบื้องต้น และปฏิบัติตนที่แสดงถึงความตระหนักในการทำปฏิบัติการเคมีเพื่อให้มีความปลอดภัยทั้งต่อตนเอง ผู้อื่นและสิ่งแวดล้อม และเสนอแนวทางแก้ไขเมื่อเกิดอุบัติเหตุ" }
          - { id: "เคมี 3 ม.4/2", level: "ม.4", text: "เลือก และใช้อุปกรณ์หรือเครื่องมือในการทำปฏิบัติการ และวัดปริมาณต่าง ๆ ได้อย่างเหมาะสม" }
          - { id: "เคมี 3 ม.4/3", level: "ม.4", text: "นำเสนอแผนการทดลอง ทดลองและเขียนรายงานการทดลอง" }
          - { id: "เคมี 3 ม.4/4", level: "ม.4", text: "ระบุหน่วยวัดปริมาณต่าง ๆ ของสาร และเปลี่ยนหน่วยวัดให้เป็นหน่วยในระบบเอสไอด้วยการใช้แฟกเตอร์เปลี่ยนหน่วย" }
          - { id: "เคมี 3 ม.4/5", level: "ม.4", text: "บอกความหมายของมวลอะตอมของธาตุ และคำนวณมวลอะตอมเฉลี่ยของธาตุ มวลโมเลกุล และมวลสูตร" }
          - { id: "เคมี 3 ม.4/6", level: "ม.4", text: "อธิบาย และคำนวณปริมาณใดปริมาณหนึ่ง จากความสัมพันธ์ของโมล จำนวนอนุภาค มวล และปริมาตรของแก๊สที่ STP" }
          - { id: "เคมี 3 ม.4/7", level: "ม.4", text: "คำนวณอัตราส่วนโดยมวลของธาตุองค์ประกอบของสารประกอบตามกฎสัดส่วนคงที่" }
          - { id: "เคมี 3 ม.4/8", level: "ม.4", text: "คำนวณสูตรอย่างง่ายและสูตรโมเลกุลของสาร" }
          - { id: "เคมี 3 ม.4/9", level: "ม.4", text: "คำนวณความเข้มข้นของสารละลายในหน่วยต่าง ๆ" }
          - { id: "เคมี 3 ม.4/10", level: "ม.4", text: "อธิบายวิธีการ และเตรียมสารละลายให้มี ความเข้มข้นในหน่วยโมลาริตี และปริมาตรสารละลายตามที่กำหนด" }
          - { id: "เคมี 3 ม.4/11", level: "ม.4", text: "เปรียบเทียบจุดเดือดและจุดเยือกแข็งของสารละลายกับสารบริสุทธิ์ รวมทั้งคำนวณ จุดเดือดและจุดเยือกแข็งของสารละลาย" }
          - { id: "เคมี 3 ม.6/1", level: "ม.6", text: "กำหนดปัญหา และนำเสนอแนวทางการแก้ปัญหาโดยใช้ความรู้ทางเคมีจากสถานการณ์ที่เกิดขึ้นในชีวิตประจำวัน การประกอบอาชีพ หรืออุตสาหกรรม" }
          - { id: "เคมี 3 ม.6/2", level: "ม.6", text: "แสดงหลักฐานถึงการบูรณาการความรู้ทางเคมีร่วมกับสาขาวิชาอื่น รวมทั้งทักษะกระบวนการทางวิทยาศาสตร์หรือกระบวนการออกแบบ เชิงวิศวกรรม โดยเน้นการคิดวิเคราะห์ การแก้ปัญหาและความคิดสร้างสรรค์ เพื่อ แก้ปัญหาในสถานการณ์หรือประเด็นที่สนใจ" }
          - { id: "เคมี 3 ม.6/3", level: "ม.6", text: "นำเสนอผลงานหรือชิ้นงานที่ได้จากการแก้ปัญหาในสถานการณ์หรือประเด็นที่สนใจโดยใช้เทคโนโลยีสารสนเทศ" }
          - { id: "เคมี 3 ม.6/4", level: "ม.6", text: "แสดงหลักฐานการเข้าร่วมการสัมมนา การเข้าร่วมประชุมวิชาการ หรือการแสดงผลงาน สิ่งประดิษฐ์ในงานนิทรรศการ" }
