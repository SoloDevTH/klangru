<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="sans-serif" font-size="14">
<title>ประเภทของพฤติกรรมสัตว์</title>
<rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
<rect x="310.0" y="14.0" width="180.0" height="44.0" rx="8" fill="#f2f2f2" stroke="#555" stroke-width="1.5"/>
<text x="400.0" y="41.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">พฤติกรรมของสัตว์</text>
<rect x="90.0" y="90.0" width="220.0" height="50.0" rx="8" fill="#fff4dc" stroke="#b07d1a" stroke-width="1.5"/>
<text x="200.0" y="111.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">มาแต่กำเนิด</text>
<text x="200.0" y="129.0" text-anchor="middle" font-size="13" fill="#222">ทำได้ทันที ไม่ต้องฝึก</text>
<rect x="490.0" y="90.0" width="220.0" height="50.0" rx="8" fill="#e8f0fb" stroke="#2c4a7a" stroke-width="1.5"/>
<text x="600.0" y="111.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">เกิดจากการเรียนรู้</text>
<text x="600.0" y="129.0" text-anchor="middle" font-size="13" fill="#222">เปลี่ยนตามประสบการณ์</text>
<line x1="360.0" y1="58.0" x2="230.0" y2="88.0" stroke="#444" stroke-width="2"/>
<polygon points="230.0,88.0 237.3,82.7 238.9,89.6" fill="#444"/>
<line x1="440.0" y1="58.0" x2="570.0" y2="88.0" stroke="#444" stroke-width="2"/>
<polygon points="570.0,88.0 561.1,89.6 562.7,82.7" fill="#444"/>
<rect x="40.0" y="160.0" width="320.0" height="46.0" rx="8" fill="#fffaf0" stroke="#b07d1a" stroke-width="1.5"/>
<text x="200.0" y="179.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">ไคนีซิส</text>
<text x="200.0" y="197.0" text-anchor="middle" font-size="13" fill="#222">ตัวกะปิเคลื่อนที่เร็วในที่แห้ง</text>
<rect x="40.0" y="214.0" width="320.0" height="46.0" rx="8" fill="#fffaf0" stroke="#b07d1a" stroke-width="1.5"/>
<text x="200.0" y="233.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">แทกซิส</text>
<text x="200.0" y="251.0" text-anchor="middle" font-size="13" fill="#222">ยูกลีนาว่ายเข้าหาแสง</text>
<rect x="40.0" y="268.0" width="320.0" height="46.0" rx="8" fill="#fffaf0" stroke="#b07d1a" stroke-width="1.5"/>
<text x="200.0" y="287.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">รีเฟล็กซ์</text>
<text x="200.0" y="305.0" text-anchor="middle" font-size="13" fill="#222">กะพริบตาเมื่อมีฝุ่นเข้า</text>
<rect x="40.0" y="322.0" width="320.0" height="46.0" rx="8" fill="#fffaf0" stroke="#b07d1a" stroke-width="1.5"/>
<text x="200.0" y="341.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">รีเฟล็กซ์ต่อเนื่อง</text>
<text x="200.0" y="359.0" text-anchor="middle" font-size="13" fill="#222">แมงมุมชักใย ลูกเต่าคลานลงทะเล</text>
<rect x="440.0" y="160.0" width="320.0" height="40.0" rx="8" fill="#f5f8fd" stroke="#2c4a7a" stroke-width="1.5"/>
<text x="600.0" y="185.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">แฮบิทูเอชัน: นกไม่กลัวหุ่นไล่กา</text>
<rect x="440.0" y="206.0" width="320.0" height="40.0" rx="8" fill="#f5f8fd" stroke="#2c4a7a" stroke-width="1.5"/>
<text x="600.0" y="231.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">การฝังใจ: ลูกเป็ดเดินตามสิ่งแรกที่เห็น</text>
<rect x="440.0" y="252.0" width="320.0" height="40.0" rx="8" fill="#f5f8fd" stroke="#2c4a7a" stroke-width="1.5"/>
<text x="600.0" y="277.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">การมีเงื่อนไข: สุนัขน้ำลายไหลเมื่อได้ยินกระดิ่ง</text>
<rect x="440.0" y="298.0" width="320.0" height="40.0" rx="8" fill="#f5f8fd" stroke="#2c4a7a" stroke-width="1.5"/>
<text x="600.0" y="323.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">การลองผิดลองถูก: ลิงเรียนเก็บมะพร้าว</text>
<rect x="440.0" y="344.0" width="320.0" height="40.0" rx="8" fill="#f5f8fd" stroke="#2c4a7a" stroke-width="1.5"/>
<text x="600.0" y="369.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">การใช้เหตุผล: ชิมแปนซีต่อกล่องหยิบกล้วย</text>
</svg>