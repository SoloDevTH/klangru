  - { framework: cefr, indicators: ["CEFR-A1-written-production"], coverage: full, note: "เขียนวลีและประโยคง่ายเรื่องของใกล้ตัว อาหาร และครอบครัว ใช้ a/an/the รูปพหูพจน์ และ some/any ให้ถูก (รายการซื้อของ บรรยายแผงผลไม้)" }
  - { framework: th-core-2551-foreign-languages, indicators: ["ต 2.2 ป.3/1"], coverage: partial, note: "เทียบภาษาไทยที่ไม่มีคำนำหน้านามและใช้ลักษณนาม กับภาษาอังกฤษที่มี a/an/the และเติม s รวมทั้งเสียง s ท้ายคำ (/s/ /z/ /ɪz/) ที่ภาษาไทยไม่มี และการเลือก a/an ตามเสียง แต่ไม่ครอบคลุมความต่างของเสียงตัวอักษรและประโยคทั้งหมด (อยู่ใน english.phonics.reading-aloud) และแอปไม่มีเสียงให้ฟังเปรียบเทียบ" }
