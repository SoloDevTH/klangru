    ai_assisted: true

  - id: engineering.circuits.dc-analysis.p013
    topics: [engineering.circuits.dc-analysis]
    difficulty: 4
    type: numeric
    stem: "จากวงจรในภาพ ($24\\ \\mathrm{V}$, $6\\ \\Omega$, $12\\ \\Omega$, $4\\ \\Omega$) ถ้าลัดวงจรขั้ว a กับ b กระแสลัดวงจร (กระแสนอร์ตัน $I_N$) เป็นกี่แอมแปร์"
    figure: { src: p-thevenin.svg, alt: "แหล่งจ่าย 24 V ขั้วบวกด้านบนอยู่กิ่งซ้าย ต่อผ่านตัวต้านทาน 6 Ω ไปยังโนดกลาง จากโนดกลางมีตัวต้านทาน 12 Ω ลงเส้นล่าง และมีตัวต้านทาน 4 Ω ต่อไปยังขั้ว a เส้นล่างต่อไปยังขั้ว b" }
    answer: { value: 2, tolerance: 0.01, unit: A }
    misconceptions:
      - { match: 4, feedback: "คิดว่ากระแสทั้งหมดจากแหล่งจ่ายผ่าน 6 Ω แล้วไปที่ขั้วลัดวงจร แต่กระแสบางส่วนไหลผ่าน 12 Ω" }
      - { match: 6, feedback: "ใช้ $24/4$ ลืมว่าแรงดันที่โนดกลางไม่ใช่ 24 V" }
    hints:
      - "$I_N = V_{Th}/R_{Th}$ หรือคำนวณตรงจากวงจรเมื่อ a ต่อกับ b"
      - "ลัดวงจรแล้ว 12 Ω ขนานกับ 4 Ω ได้ 3 Ω"
    solution: "ลัดวงจร a b: $12 \\parallel 4 = 3\\ \\Omega$ กระแสจากแหล่ง $24/(6 + 3) = 2.667\\ \\mathrm{A}$ แรงดันโนดกลาง $2.667 \\times 3 = 8\\ \\mathrm{V}$ กระแสผ่าน 4 Ω $= 8/4 = 2\\ \\mathrm{A}$ ตรงกับ $V_{Th}/R_{Th} = 16/8$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.circuits.dc-analysis.p014
    topics: [engineering.circuits.dc-analysis]
    difficulty: 4
    type: numeric
    stem: "เครื่องชั่งน้ำหนักรถบรรทุกที่ด่านชั่งน้ำหนักใช้วงจรบริดจ์ของสเตรนเกจ (ค่าสมมติ) แหล่งจ่าย $10\\ \\mathrm{V}$ ต่อคร่อมสองกิ่งขนานกัน กิ่งซ้ายมี $100\\ \\Omega$ (บน) อนุกรม $200\\ \\Omega$ (ล่าง) กิ่งขวามี $150\\ \\Omega$ อนุกรม $150\\ \\Omega$ แรงดันระหว่างจุดกึ่งกลางของสองกิ่ง (ซ้ายลบขวา) เมื่อไม่ต่อโหลดเป็นกี่โวลต์ (ทศนิยม 3 ตำแหน่ง)"
    answer: { value: 1.667, tolerance: 0.005, unit: V }
    misconceptions:
      - { match: -1.667, feedback: "เครื่องหมายสลับ จุดกึ่งกลางซ้ายได้ $6.667\\ \\mathrm{V}$ สูงกว่าจุดขวา $5\\ \\mathrm{V}$" }
      - { match: 3.333, feedback: "ใช้แรงดันคร่อมตัวต้านทานบน (100 Ω) ของกิ่งซ้าย วัดจากขั้วลบ แรงดันที่จุดกึ่งกลางซ้ายคือแรงดันคร่อม 200 Ω" }
    hints:
      - "เทียบแรงดันทั้งสองจุดกับขั้วลบของแหล่งจ่าย"
      - "จุดซ้าย: $10 \\times \\tfrac{200}{300}$ จุดขวา: $10 \\times \\tfrac{150}{300}$"
    solution: "$V_L = 6.667\\ \\mathrm{V}$, $V_R = 5.000\\ \\mathrm{V}$ ผลต่าง $1.667\\ \\mathrm{V}$ ถ้าบริดจ์สมดุล (อัตราส่วนสองกิ่งเท่ากัน) ผลต่างเป็นศูนย์ สเตรนเกจเปลี่ยนความต้านทานเล็กน้อยเมื่อรับน้ำหนัก ทำให้บริดจ์เสียสมดุลและวัดแรงดันได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.circuits.dc-analysis.p015
    topics: [engineering.circuits.dc-analysis]
    difficulty: 4
    type: numeric
    stem: "ไฟ LED ประดับงานวัดแห่งหนึ่ง (ค่าสมมติ) จำลองเป็นโหลดตัวต้านทาน $R_L = 3.6\\ \\Omega$ ต่อระหว่างโนด a กับกราวด์ของวงจรในภาพ กระแสผ่านโหลดเป็นกี่แอมแปร์"
    figure: { src: p-load.svg, alt: "วงจรสามกิ่งต่อกับเส้นล่างที่เป็นกราวด์ กิ่งซ้ายเป็นแหล่งจ่าย 12 V ขั้วบวกด้านบน ต่อผ่าน R₁ = 4 Ω ไปโนด a กิ่งกลางเป็นโหลด R_L = 3.6 Ω จากโนด a ลงกราวด์ จากโนด a ผ่าน R₃ = 6 Ω ไปยังกิ่งขวาซึ่งเป็นแหล่งจ่าย 6 V ขั้วบวกด้านบน" }
    answer: { value: 1.6, tolerance: 0.01, unit: A }
    misconceptions:
      - { match: 1.58, feedback: "คิดเฉพาะแหล่ง 12 V อนุกรมกับ 4 Ω และโหลด แต่แหล่ง 6 V ผ่าน 6 Ω ก็จ่ายกระแสเข้าโนด a ด้วย" }
      - { match: 4, feedback: "ใช้ $V_{Th}/R_{Th}$ ซึ่งเป็นกระแสลัดวงจร ต้องรวมความต้านทานโหลดด้วย" }
    hints:
      - "หาวงจรสมมูลเทวินินที่มองจากโนด a: $V_{Th} = 9.6\\ \\mathrm{V}$, $R_{Th} = 4 \\parallel 6$"
      - "$I_L = V_{Th}/(R_{Th} + R_L)$"
    solution: "$R_{Th} = 2.4\\ \\Omega$ $I_L = \\dfrac{9.6}{2.4 + 3.6} = 1.6\\ \\mathrm{A}$ (ตรวจด้วยวิธีโนด: $V_a = 1.6 \\times 3.6 = 5.76\\ \\mathrm{V}$ และ $\\tfrac{5.76 - 12}{4} + \\tfrac{5.76}{3.6} + \\tfrac{5.76 - 6}{6} = 0$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.circuits.dc-analysis.p016
    topics: [engineering.circuits.dc-analysis]
    difficulty: 3
    type: mcq
    stem: "นักศึกษาสมมติทิศกระแสในกิ่งหนึ่งไปทางขวา แก้สมการแล้วได้ $I = -0.5\\ \\mathrm{A}$ ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "กระแสจริงขนาด 0.5 A ไหลไปทางซ้าย คำตอบอื่นที่ได้ยังถูกต้อง", correct: true }
      - { id: b, text: "คำนวณผิด กระแสเป็นลบไม่ได้", feedback: "เครื่องหมายลบบอกเพียงว่าทิศจริงตรงข้ามกับที่สมมติ ไม่ได้แปลว่าผิด" }
      - { id: c, text: "ต้องแก้สมการใหม่ทั้งหมดโดยสมมติทิศกลับ", feedback: "ไม่จำเป็น สมการเชิงเส้นให้ค่าที่ถูกต้องอยู่แล้ว เพียงตีความเครื่องหมาย" }
      - { id: d, text: "กิ่งนี้ไม่มีกระแสไหล", feedback: "ขนาดกระแสคือ 0.5 A ไม่ใช่ศูนย์" }
    hints:
      - "ทิศกระแสที่สมมติเป็นเพียงทิศอ้างอิง"
      - "ค่าลบหมายถึงอะไรเมื่อเทียบกับทิศอ้างอิง"
    solution: "ทิศที่สมมติเป็นทิศอ้างอิง ผลลบหมายถึงกระแส 0.5 A ไหลในทิศตรงข้าม คือไปทางซ้าย การคำนวณอื่นที่ใช้ค่าพร้อมเครื่องหมายยังถูกต้องทั้งหมด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.circuits.dc-analysis.p017
    topics: [engineering.circuits.dc-analysis]
    difficulty: 4
    type: mcq
    stem: "ข้อใดเป็นสถานการณ์ที่ **ไม่ควร** ใช้นามธรรมแบบก้อน (lumped abstraction) วิเคราะห์ด้วยกฎของเคียร์ชฮอฟฟ์ตรง ๆ"
    choices:
      - { id: a, text: "สายอากาศและสายนำสัญญาณที่ยาวพอ ๆ กับความยาวคลื่นของสัญญาณความถี่สูง", correct: true }
      - { id: b, text: "วงจรไฟฉายที่ใช้ถ่านและหลอด LED", feedback: "วงจรกระแสตรงขนาดเล็กเป็นไปตามสมมติฐานแบบก้อนดี" }
      - { id: c, text: "ระบบไฟในบ้าน 50 Hz", feedback: "ความยาวคลื่นของ 50 Hz ยาวหลายพันกิโลเมตร เทียบกับสายไฟในบ้านแล้วแบบก้อนใช้ได้ดี" }
      - { id: d, text: "วงจรแบ่งแรงดันของเซนเซอร์อุณหภูมิ", feedback: "เป็นวงจรตัวต้านทานกระแสตรงขนาดเล็ก ใช้แบบก้อนได้" }
    hints:
      - "นามธรรมแบบก้อนถือว่าสัญญาณเปลี่ยนพร้อมกันทั่วทั้งเส้นลวด"
      - "ความยาวคลื่น $\\lambda = c/f$ สั้นลงเมื่อความถี่สูงขึ้น"
    solution: "เมื่อความยาวของวงจรเทียบได้กับความยาวคลื่น สัญญาณที่ปลายสองข้างของลวดไม่เท่ากันในขณะเดียวกัน ต้องใช้ทฤษฎีสายส่งหรือสนามแม่เหล็กไฟฟ้า ส่วนวงจรอื่นมีขนาดเล็กกว่าความยาวคลื่นมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.circuits.dc-analysis.p018
    topics: [engineering.circuits.dc-analysis]
    difficulty: 5
    type: numeric
    stem: "ระบบไฟสำรองในบ้านที่ติดโซลาร์เซลล์ (จำลองอย่างง่าย ค่าสมมติ) เป็นวงจรตามภาพ: แหล่ง $20\\ \\mathrm{V}$ แทนแผงโซลาร์พร้อมตัวควบคุม แหล่ง $10\\ \\mathrm{V}$ แทนแบตเตอรี่ แบตเตอรี่ **รับ** กำลังกี่วัตต์ (ตอบเป็นบวกถ้ารับ ลบถ้าจ่าย ทศนิยม 2 ตำแหน่ง)"
    figure: { src: p-mesh.svg, alt: "วงจรสามกิ่งแนวตั้งต่อกับเส้นล่างร่วมกัน กิ่งซ้ายเป็นแหล่งจ่าย 20 V ขั้วบวกด้านบน กิ่งกลางเป็นตัวต้านทาน 6 Ω กิ่งขวาเป็นแหล่งจ่าย 10 V ขั้วบวกด้านบน เส้นบนมีตัวต้านทาน 4 Ω ระหว่างกิ่งซ้ายกับกิ่งกลาง และ 3 Ω ระหว่างกิ่งกลางกับกิ่งขวา" }
    answer: { value: 3.7, tolerance: 0.02, unit: W }
    misconceptions:
      - { match: -3.7, feedback: "กระแส $0.37\\ \\mathrm{A}$ ไหลเข้าขั้วบวกของแบตเตอรี่ ตามข้อตกลงเครื่องหมายแบบพาสซีฟ แบตเตอรี่จึงรับกำลัง (กำลังอัดประจุ)" }
      - { match: 33.3, feedback: "ใช้ $V^2/R$ กับแบตเตอรี่ แต่แบตเตอรี่ไม่ใช่ตัวต้านทาน กำลังคือ $VI$ ของกระแสที่ไหลผ่านจริง" }
    hints:
      - "หาแรงดันที่โนดบนกลาง แล้วหากระแสผ่าน 3 Ω ไปยังแบตเตอรี่"
      - "ถ้ากระแสไหลเข้าขั้วบวก แบตเตอรี่รับกำลัง $P = VI$"
    solution: "แรงดันโนดกลาง $V = 100/9 = 11.11\\ \\mathrm{V}$ กระแสผ่าน 3 Ω $= (11.11 - 10)/3 = 0.370\\ \\mathrm{A}$ ไหลเข้าขั้วบวกของแบตเตอรี่ แบตเตอรี่รับ $10 \\times 0.370 = 3.70\\ \\mathrm{W}$ ตรวจสมดุลกำลัง: แหล่ง 20 V จ่าย $20 \\times 2.222 = 44.44\\ \\mathrm{W}$ ตัวต้านทานรับ $19.75 + 20.58 + 0.41 = 40.74\\ \\mathrm{W}$ บวกแบตเตอรี่ $3.70$ ได้ $44.44\\ \\mathrm{W}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.circuits.dc-analysis.p019
    topics: [engineering.circuits.dc-analysis]
    difficulty: 5
    type: numeric
    stem: "วงจรเชิงเส้นวงจรหนึ่งวัดแรงดันขั้วเปิดได้ $15\\ \\mathrm{V}$ เมื่อต่อโหลด $10\\ \\Omega$ แรงดันที่ขั้วลดลงเหลือ $12\\ \\mathrm{V}$ ความต้านทานเทวินินของวงจรเป็นกี่โอห์ม"
    answer: { value: 2.5, tolerance: 0.01, unit: Ω }
    misconceptions:
      - { match: 12.5, feedback: "นี่คือความต้านทานรวม $R_{Th} + R_L = 15/1.2$ ต้องหักความต้านทานโหลดออก" }
      - { match: 0.25, feedback: "หารแรงดันที่หายไปด้วยความต้านทานโหลด ($3/12$) แต่ต้องหารด้วยกระแส" }
    hints:
      - "กระแสในโหลด $= 12/10$"
      - "แรงดันที่ตกใน $R_{Th}$ $= 15 - 12$"
    solution: "$I = 12/10 = 1.2\\ \\mathrm{A}$ แรงดันตกใน $R_{Th}$ $= 15 - 12 = 3\\ \\mathrm{V}$ จึง $R_{Th} = 3/1.2 = 2.5\\ \\Omega$ วิธีนี้ใช้วัดความต้านทานภายในของแหล่งจ่ายจริงได้"
    license: CC-BY-SA-4.0
    ai_assisted: true
