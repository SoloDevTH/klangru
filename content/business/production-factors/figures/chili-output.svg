<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 170" width="620" height="170" font-family="sans-serif" font-size="14">
  <title>ตารางจำนวนคนงานและผลผลิตต่อวันก่อนและหลังซื้อเครื่องปิดฝา</title>
  <rect x="0" y="0" width="620" height="170" fill="#ffffff"/>
  <text x="310.0" y="24.0" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="bold">กลุ่มแม่บ้านทำน้ำพริกตาแดง</text>
  <rect x="20.0" y="40.0" width="580.0" height="40.0" rx="0" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
  <text x="130.0" y="64.5" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold"></text>
  <text x="330.0" y="64.5" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">ก่อนซื้อเครื่องปิดฝา</text>
  <line x1="240.0" y1="40.0" x2="240.0" y2="80.0" stroke="#1f2937" stroke-width="1"/>
  <text x="510.0" y="64.5" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">หลังซื้อเครื่องปิดฝา</text>
  <line x1="420.0" y1="40.0" x2="420.0" y2="80.0" stroke="#1f2937" stroke-width="1"/>
  <rect x="20.0" y="80.0" width="580.0" height="40.0" rx="0" fill="#fff" stroke="#1f2937" stroke-width="1"/>
  <text x="28.0" y="104.5" text-anchor="start" fill="#1f2937" font-size="13">จำนวนคนงาน</text>
  <text x="330.0" y="104.5" text-anchor="middle" fill="#1f2937" font-size="13">3 คน</text>
  <line x1="240.0" y1="80.0" x2="240.0" y2="120.0" stroke="#1f2937" stroke-width="1"/>
  <text x="510.0" y="104.5" text-anchor="middle" fill="#1f2937" font-size="13">4 คน</text>
  <line x1="420.0" y1="80.0" x2="420.0" y2="120.0" stroke="#1f2937" stroke-width="1"/>
  <rect x="20.0" y="120.0" width="580.0" height="40.0" rx="0" fill="#fff" stroke="#1f2937" stroke-width="1"/>
  <text x="28.0" y="144.6" text-anchor="start" fill="#1f2937" font-size="13">น้ำพริกที่ผลิตได้ต่อวัน</text>
  <text x="330.0" y="144.6" text-anchor="middle" fill="#1f2937" font-size="13">120 กระปุก</text>
  <line x1="240.0" y1="120.0" x2="240.0" y2="160.0" stroke="#1f2937" stroke-width="1"/>
  <text x="510.0" y="144.6" text-anchor="middle" fill="#1f2937" font-size="13">200 กระปุก</text>
  <line x1="420.0" y1="120.0" x2="420.0" y2="160.0" stroke="#1f2937" stroke-width="1"/>
</svg>
