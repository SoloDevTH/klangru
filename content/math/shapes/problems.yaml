    ai_assisted: true

  - id: math.geometry.shapes.p018
    topics: [math.geometry.shapes]
    difficulty: 5
    type: numeric
    stem: "พีระมิดรูปหนึ่งมีสัน 10 สัน พีระมิดนี้มีกี่หน้า (นับฐานด้วย)"
    answer: { value: 6, unit: หน้า }
    hints:
      - "ถ้าฐานมี $n$ ด้าน พีระมิดมีสันรอบฐาน $n$ เส้น และสันที่วิ่งขึ้นไปหายอดอีก $n$ เส้น"
      - "จาก $2n = 10$ หา $n$ แล้วนับหน้า: หน้าข้าง $n$ หน้า กับฐาน 1 หน้า"
    misconceptions:
      - { match: 5, feedback: "5 คือจำนวนด้านของฐาน (หรือจำนวนหน้าข้าง) ยังไม่ได้นับฐานอีก 1 หน้า" }
      - { match: 7, feedback: "ใช้สูตรของปริซึม ($n + 2$) พีระมิดมีฐานเดียว หน้าจึงเป็น $n + 1$" }
    solution: "พีระมิดฐาน $n$ เหลี่ยมมีสัน $2n$ เส้น $2n = 10$ จึงได้ $n = 5$ (ฐานห้าเหลี่ยม) หน้าข้าง 5 หน้า รวมฐานเป็น $5 + 1 = 6$ หน้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.shapes.p019
    topics: [math.geometry.shapes]
    difficulty: 5
    type: text
    stem: "รูปสามมิติรูปหนึ่งไม่มีผิวโค้ง มี 5 หน้า 9 สัน และ 6 จุดยอด รูปนี้ชื่อว่าอะไร"
    accepted: ["ปริซึมสามเหลี่ยม", "ปริซึมฐานสามเหลี่ยม"]
    hints:
      - "รูปที่มี 5 หน้ามีสองแบบที่พบบ่อย: ปริซึมสามเหลี่ยม และพีระมิดฐานสี่เหลี่ยม"
      - "ตรวจจำนวนสันและจุดยอดของแต่ละแบบด้วย"
    misconceptions:
      - { match: "พีระมิดฐานสี่เหลี่ยม", feedback: "พีระมิดฐานสี่เหลี่ยมมี 5 หน้าก็จริง แต่มีสัน 8 และจุดยอด 5 ไม่ใช่ 9 และ 6" }
      - { match: "พีระมิดฐานสี่เหลี่ยมจัตุรัส", feedback: "พีระมิดฐานสี่เหลี่ยมจัตุรัสมี 5 หน้าก็จริง แต่มีสัน 8 และจุดยอด 5 ไม่ใช่ 9 และ 6" }
    solution: "ปริซึมสามเหลี่ยมมี หน้า $3 + 2 = 5$ สัน $3 \\times 3 = 9$ จุดยอด $2 \\times 3 = 6$ ตรงทั้งสามค่า ส่วนพีระมิดฐานสี่เหลี่ยมมี 5 หน้า 8 สัน 5 จุดยอด"
    license: CC-BY-SA-4.0
    ai_assisted: true
