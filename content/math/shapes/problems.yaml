    solution: "เส้นทแยงมุมทั้งสองตัดกันตรงกลาง แบ่งสี่เหลี่ยมจัตุรัสเป็นสามเหลี่ยม 4 รูปที่เท่ากัน กลับกัน สามเหลี่ยม 4 รูปนี้ต่อกันกลับเป็นสี่เหลี่ยมจัตุรัสได้"
