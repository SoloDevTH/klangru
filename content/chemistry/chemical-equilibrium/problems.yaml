      - { id: b, text: "เพิ่มอุณหภูมิ", feedback: "การเปลี่ยนอุณหภูมิไม่ทำให้ความเข้มข้นตัวใดกระโดดทันที และโจทย์บอกว่าอุณหภูมิคงที่" }
      - { id: c, text: "ลดปริมาตรภาชนะลงครึ่งหนึ่ง", feedback: "ถ้าลดปริมาตร ความเข้มข้นทุกตัวจะกระโดดขึ้นพร้อมกันเป็นสองเท่า ไม่ใช่เฉพาะ H₂" }
      - { id: d, text: "เติมตัวเร่งปฏิกิริยา", feedback: "ตัวเร่งไม่เปลี่ยนความเข้มข้นที่สมดุล เส้นทั้งหมดจะคงที่เหมือนเดิม" }
