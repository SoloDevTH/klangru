<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="sans-serif" font-size="15">
  <title>เปรียบเทียบเครื่องเสมือนกับคอนเทนเนอร์</title>
  <rect x="0" y="0" width="640" height="380" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#15211e">เครื่องเสมือนมีระบบปฏิบัติการแขกของตนเอง คอนเทนเนอร์ใช้เคอร์เนลร่วมกัน</text>
  <text x="160" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#15211e">เครื่องเสมือน (VM)</text>
  <rect x="40" y="250" width="240" height="40" rx="5" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="160.0" y="275.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#15211e">ฮาร์ดแวร์</text>
  <rect x="40" y="200" width="240" height="40" rx="5" fill="#f6e7df" stroke="#15211e" stroke-width="2"/>
  <text x="160.0" y="225.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#15211e">ไฮเปอร์ไวเซอร์</text>
  <rect x="40" y="135" width="112" height="55" rx="5" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="96.0" y="167.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#15211e">ระบบ ปฏิบัติการ 1</text>
  <rect x="168" y="135" width="112" height="55" rx="5" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="224.0" y="167.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#15211e">ระบบ ปฏิบัติการ 2</text>
  <rect x="40" y="95" width="112" height="30" rx="5" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="96.0" y="115.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#15211e">แอป A</text>
  <rect x="168" y="95" width="112" height="30" rx="5" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="224.0" y="115.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#15211e">แอป B</text>
  <text x="160" y="320" text-anchor="middle" font-size="13" font-weight="normal" fill="#4a5a55">แต่ละเครื่องมีเคอร์เนลของตน แยกได้เข้มแต่บูตช้า</text>
  <text x="480" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#15211e">คอนเทนเนอร์</text>
  <rect x="360" y="250" width="240" height="40" rx="5" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="480.0" y="275.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#15211e">ฮาร์ดแวร์</text>
  <rect x="360" y="200" width="240" height="40" rx="5" fill="#f6e7df" stroke="#15211e" stroke-width="2"/>
  <text x="480.0" y="225.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#15211e">ระบบปฏิบัติการโฮสต์และเคอร์เนลร่วม</text>
  <rect x="360" y="150" width="240" height="40" rx="5" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="480.0" y="175.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#15211e">เอนจินคอนเทนเนอร์</text>
  <rect x="360" y="95" width="112" height="45" rx="5" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="416.0" y="122.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#15211e">คอนเทนเนอร์ A</text>
  <rect x="488" y="95" width="112" height="45" rx="5" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="544.0" y="122.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#15211e">คอนเทนเนอร์ B</text>
  <text x="480" y="320" text-anchor="middle" font-size="13" font-weight="normal" fill="#4a5a55">ใช้เคอร์เนลร่วมกัน เริ่มเร็วและเบา แต่แยกอ่อนกว่า</text>
  <line x1="320" y1="50" x2="320" y2="345" stroke="#c9d6d2" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="320" y="366" text-anchor="middle" font-size="13" font-weight="normal" fill="#4a5a55">แอปทั้งสองฝั่งอยู่บนฮาร์ดแวร์เดียวกัน แต่การแยกต่างกันตามชั้นที่ใช้ร่วมกัน</text>
</svg>
