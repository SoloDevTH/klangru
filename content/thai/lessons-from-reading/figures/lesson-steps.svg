<text x="20.0" y="32.0" font-size="20" text-anchor="start" fill="#1f5fbf" font-weight="bold">จากเรื่อง → ข้อคิด → ชีวิตจริง</text>
<text x="20.0" y="56.0" font-size="15" text-anchor="start" fill="#555" font-weight="normal">ตัวอย่าง: นิทานอีสป ราชสีห์กับหนู</text>
