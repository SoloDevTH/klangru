- id: business.finance.sources-of-funds.p015
  topics:
  - business.finance.sources-of-funds
  difficulty: 5
  type: numeric
  stem: บริษัทสมมติมีหุ้น $5$ ล้านหุ้น ราคาหุ้นละ $20$ บาท และหุ้นกู้มูลค่าตลาด $50$ ล้านบาท อัตราผลตอบแทนที่ต้องการของหุ้นกู้ $5\%$ ภาษี $20\%$ ต้นทุนส่วนของผู้ถือหุ้นหาด้วย CAPM ($r_f = 3\%$, $\beta = 1.25$, ส่วนชดเชยความเสี่ยงตลาด $6\%$) จงหา WACC (ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 8.333333
    tolerance: 0.02
    unit: '%'
  misconceptions:
  - match: 8.666667
    feedback: ลืมหักภาษีของต้นทุนหนี้
  - match: 7.25
    feedback: ให้น้ำหนักเท่ากัน ต้องถ่วงด้วยมูลค่าตลาด
  hints:
  - มูลค่าส่วนของผู้ถือหุ้น $= 5 \times 20 = 100$ ล้านบาท น้ำหนัก $100/150$
  - $k_e = 3 + 1.25 \times 6 = 10.5\%$ และ $k_d(1 - t) = 4\%$
  solution: $E = 100$, $D = 50$, $V = 150$ ล้านบาท WACC $= \tfrac{2}{3}(10.5\%) + \tfrac{1}{3}(4\%) = 7\% + 1.33\% \approx 8.33\%$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.sources-of-funds.p016
  topics:
  - business.finance.sources-of-funds
  difficulty: 5
  type: mcq
  stem: บริษัทเทคโนโลยีขนาดกลาง (สมมติ) ยอดขายโตเร็ว ต้องการระดมทุนจากประชาชนเป็นครั้งแรกในไทยเพื่อขยายกิจการ แต่ขนาดยังเล็กกว่าเกณฑ์ของตลาดหลัก ทางเลือกใดเหมาะสมที่สุด
  choices:
  - id: a
    text: เสนอขายหุ้นต่อประชาชนครั้งแรกและเข้าจดทะเบียนในตลาดหลักทรัพย์ เอ็ม เอ ไอ (mai) ภายใต้การกำกับของ ก.ล.ต.
    correct: true
  - id: b
    text: ออกพันธบัตรรัฐบาล
    feedback: พันธบัตรรัฐบาลออกโดยรัฐ ไม่ใช่เครื่องมือของบริษัทเอกชน
  - id: c
    text: ขายหุ้นให้ใครก็ได้ทางสื่อสังคมโดยไม่ต้องขออนุญาต
    feedback: การเสนอขายหลักทรัพย์ต่อประชาชนต้องได้รับอนุญาตและเปิดเผยข้อมูลตามกฎหมาย เพื่อคุ้มครองผู้ลงทุน
  - id: d
    text: กู้ OD เพิ่มจนครบวงเงินที่ต้องการลงทุนระยะยาว
    feedback: ขัดกับหลักการจับคู่ระยะเวลา และเพิ่มความเสี่ยงสภาพคล่อง
  hints:
  - ไทยมีตลาดหลักทรัพย์สำหรับบริษัทขนาดใหญ่ (SET) และขนาดกลางที่มีศักยภาพเติบโต
  - การเสนอขายหุ้นต่อประชาชนต้องผ่านหน่วยงานกำกับ
  solution: mai เป็นตลาดสำหรับบริษัทขนาดกลางและขนาดย่อมที่มีศักยภาพเติบโต การเสนอขายหุ้นต่อประชาชนต้องยื่นขออนุญาตและเปิดเผยข้อมูลตามเกณฑ์ของ ก.ล.ต. ช่วยให้บริษัทได้ทุนระยะยาวโดยไม่มีภาระจ่ายคืน แต่ต้องรับต้นทุนการเปิดเผยข้อมูลและการถูกลดสัดส่วนการถือหุ้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.sources-of-funds.p017
  topics:
  - business.finance.sources-of-funds
  difficulty: 5
  type: mcq
  stem: จากกราฟต้นทุนเงินทุนตามสัดส่วนหนี้ในบทเรียน ทำไม WACC จึงลดลงก่อนแล้วสูงขึ้นเมื่อหนี้มากเกินไป
  choices:
  - id: a
    text: ช่วงแรกหนี้ซึ่งถูกกว่าและประหยัดภาษีแทนที่ส่วนของเจ้าของ แต่เมื่อหนี้มาก ความเสี่ยงล้มละลายทำให้ทั้งต้นทุนหนี้และต้นทุนส่วนของเจ้าของสูงขึ้นเร็ว
    correct: true
  - id: b
    text: เพราะธนาคารคิดดอกเบี้ยเท่าเดิมเสมอ ไม่ว่าบริษัทมีหนี้เท่าไร
    feedback: ถ้าดอกเบี้ยคงที่และไม่มีความเสี่ยงเพิ่ม WACC จะลดลงเรื่อย ๆ ไม่ใช่เป็นรูปตัวยู
  - id: c
    text: เพราะหนี้มีต้นทุนสูงกว่าส่วนของเจ้าของ
    feedback: หนี้มีต้นทุนต่ำกว่าส่วนของเจ้าของ เพราะเจ้าหนี้เสี่ยงน้อยกว่าและดอกเบี้ยหักภาษีได้
  - id: d
    text: เพราะภาษีเพิ่มขึ้นเมื่อมีหนี้
    feedback: ดอกเบี้ยทำให้ภาษีลดลง ไม่ใช่เพิ่มขึ้น
  hints:
  - ดูเส้นต้นทุนหนี้หลังภาษีและต้นทุนส่วนของเจ้าของในกราฟ
  - ผู้ถือหุ้นต้องการผลตอบแทนเพิ่มเมื่อบริษัทกู้มาก
  solution: หนี้ถูกกว่าและมีผลประหยัดภาษี ช่วงแรกจึงลด WACC แต่หนี้ที่มากขึ้นเพิ่มความเสี่ยงทางการเงิน เจ้าหนี้คิดดอกเบี้ยสูงขึ้นและผู้ถือหุ้นต้องการผลตอบแทนเพิ่ม WACC จึงมีจุดต่ำสุดที่โครงสร้างเงินทุนเหมาะสม (ในกราฟแบบจำลองราว 37% หนี้)
