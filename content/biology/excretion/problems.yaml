problems:
  - id: biology.animals.excretion.p001
    topics: [biology.animals.excretion]
    difficulty: 1
    type: mcq
    stem: "นกกำจัดของเสียไนโตรเจนออกจากร่างกายในรูปใดเป็นส่วนใหญ่"
    choices:
      - { id: a, text: "กรดยูริก", correct: true }
      - { id: b, text: "แอมโมเนีย", feedback: "แอมโมเนียเป็นพิษมากและต้องใช้น้ำมากในการขับออก พบในสัตว์น้ำ เช่น ปลากระดูกแข็ง" }
      - { id: c, text: "ยูเรีย", feedback: "ยูเรียเป็นของเสียหลักของสัตว์เลี้ยงลูกด้วยน้ำนม" }
    hints:
      - "มูลนกมีส่วนสีขาวข้น"
      - "นกต้องประหยัดน้ำและตัวอ่อนเจริญในไข่ที่มีเปลือก"
    solution: "นกขับของเสียไนโตรเจนเป็นกรดยูริก ซึ่งพิษต่ำและละลายน้ำน้อย จึงขับออกโดยใช้น้ำน้อยมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.excretion.p002
    topics: [biology.animals.excretion]
    difficulty: 1
    type: match
    stem: "จับคู่สัตว์กับโครงสร้างที่ใช้กำจัดของเสีย"
    pairs:
      - { left: "ไฮดรา", right: "แพร่ผ่านผิวเซลล์ออกสู่น้ำโดยตรง" }
      - { left: "พลานาเรีย", right: "เฟลมเซลล์" }
      - { left: "ไส้เดือนดิน", right: "เนฟริเดียม" }
      - { left: "แมลง", right: "ท่อมัลพิเกียน" }
      - { left: "คน", right: "ไต" }
    hints:
      - "สัตว์ที่เซลล์ทุกเซลล์สัมผัสน้ำไม่ต้องมีอวัยวะขับถ่ายเฉพาะ"
      - "เนฟริเดียมมีปล้องละ 1 คู่"
    solution: "ไฮดราใช้การแพร่ พลานาเรียใช้เฟลมเซลล์ ไส้เดือนดินใช้เนฟริเดียม แมลงใช้ท่อมัลพิเกียน และคนใช้ไต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.excretion.p003
    topics: [biology.animals.excretion]
    difficulty: 1
    type: order
    stem: "เรียงทางเดินของปัสสาวะจากที่สร้างจนออกนอกร่างกาย"
    items:
      - "หน่วยไต"
      - "กรวยไต"
      - "ท่อไต"
      - "กระเพาะปัสสาวะ"
      - "ท่อปัสสาวะ"
    hints:
      - "ปัสสาวะสร้างในหน่วยไต แล้วรวมกันในโพรงของไตก่อนออกจากไต"
      - "กระเพาะปัสสาวะเป็นที่เก็บ"
    solution: "หน่วยไต → กรวยไต → ท่อไต → กระเพาะปัสสาวะ → ท่อปัสสาวะ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.excretion.p004
    topics: [biology.animals.excretion]
    difficulty: 2
    type: text
    stem: "กลุ่มหลอดเลือดฝอยในหน่วยไตที่ล้อมด้วยโบว์แมนส์แคปซูล และเป็นที่เกิดการกรอง เรียกว่าอะไร"
    accepted: ["โกลเมอรูลัส", "glomerulus"]
    hints:
      - "การกรองต้องใช้ความดันเลือดดันของเหลวออกจากหลอดเลือดฝอย"
      - "ชื่อนี้หมายถึงกลุ่มก้อนกลม"
    misconceptions:
      - { match: "โบว์แมนส์แคปซูล", feedback: "โบว์แมนส์แคปซูลเป็นถ้วยที่รับของเหลวที่กรองได้ ส่วนกลุ่มหลอดเลือดฝอยข้างในมีชื่อเฉพาะ" }
      - { match: "ห่วงเฮนเล", feedback: "ห่วงเฮนเลเป็นส่วนของท่อหน่วยไตที่อยู่ในเมดัลลา ไม่ใช่หลอดเลือดฝอย" }
    solution: "โกลเมอรูลัสคือกลุ่มหลอดเลือดฝอยที่ความดันเลือดสูง ดันน้ำและสารโมเลกุลเล็กเข้าสู่โบว์แมนส์แคปซูล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.excretion.p005
    topics: [biology.animals.excretion]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ในคนที่ไตปกติ สารใดไม่ผ่านการกรองที่โกลเมอรูลัส (เลือกได้มากกว่า 1 ข้อ)"
    choices:
      - { id: a, text: "เซลล์เม็ดเลือดแดง", correct: true }
      - { id: b, text: "โปรตีนในพลาสมา เช่น แอลบูมิน", correct: true }
      - { id: c, text: "กลูโคส", feedback: "กลูโคสโมเลกุลเล็กผ่านการกรองได้ แล้วจึงถูกดูดกลับเกือบทั้งหมดที่ท่อหน่วยไตส่วนต้น" }
      - { id: d, text: "ยูเรีย", feedback: "ยูเรียโมเลกุลเล็กผ่านการกรองได้และเป็นของเสียหลักในปัสสาวะ" }
    hints:
      - "การกรองแยกตามขนาด ไม่ได้แยกตามว่ามีประโยชน์หรือไม่"
      - "สิ่งที่ใหญ่เกินจะผ่านผนังหลอดเลือดฝอยไม่ได้"
    solution: "เซลล์เม็ดเลือดและโปรตีนในพลาสมาใหญ่เกินกว่าจะผ่านการกรอง ส่วนกลูโคสและยูเรียโมเลกุลเล็กผ่านได้ทั้งคู่ ไตจึงต้องดูดกลูโคสกลับภายหลัง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.excretion.p006
    topics: [biology.animals.excretion]
    difficulty: 2
    type: numeric
    stem: "ไตของผู้ใหญ่กรองของเหลวได้ประมาณ 125 มิลลิลิตรต่อนาที ในหนึ่งวันกรองได้ประมาณกี่ลิตร"
    answer: { value: 180, unit: L }
    hints:
      - "หนึ่งวันมีกี่นาที"
      - "คูณ 125 mL ด้วยจำนวนนาทีในหนึ่งวัน แล้วเปลี่ยนมิลลิลิตรเป็นลิตร"
    misconceptions:
      - { match: 7.5, feedback: "นี่คือปริมาณใน 1 ชั่วโมง ต้องคูณด้วย 24 อีกครั้ง" }
      - { match: 180000, feedback: "นี่คือหน่วยมิลลิลิตร ต้องหารด้วย 1,000 เพื่อเป็นลิตร" }
    solution: "1 วัน = $24 \\times 60 = 1{,}440$ นาที ปริมาณ $125 \\times 1{,}440 = 180{,}000$ mL $= 180$ L"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.excretion.p007
    topics: [biology.animals.excretion]
    difficulty: 2
    type: mcq
    stem: "จากภาพหน่วยไต ส่วนใดดูดกลับกลูโคสและกรดอะมิโนเกือบทั้งหมด"
    figure: { src: nephron-letters.svg, alt: "หน่วยไตที่ระบุส่วนต่าง ๆ ด้วยตัวอักษร พื้นหลังด้านบนเป็นคอร์เทกซ์ ด้านล่างเป็นเมดัลลา ก คือกลุ่มหลอดเลือดฝอยที่มีหลอดเลือดเข้าและออก ข คือถ้วยที่ล้อมกลุ่มหลอดเลือดฝอย ค คือท่อขดที่ต่อจากถ้วยในคอร์เทกซ์ ง คือท่อรูปตัวยูที่ลงไปในเมดัลลา จ คือท่อขดช่วงที่สองในคอร์เทกซ์หลังท่อรูปตัวยู ฉ คือท่อตรงขนาดใหญ่ที่รับของเหลวจากท่อขดช่วงที่สองแล้วลงไปทางเมดัลลา" }
    choices:
      - { id: a, text: "ค", correct: true }
      - { id: b, text: "ก", feedback: "ก คือโกลเมอรูลัส เป็นที่เกิดการกรอง ไม่ใช่การดูดกลับ" }
      - { id: c, text: "ง", feedback: "ง คือห่วงเฮนเล ทำให้ของเหลวในเมดัลลาเข้มข้น ไม่ได้ดูดกลับกลูโคส" }
      - { id: d, text: "ฉ", feedback: "ฉ คือท่อรวม ดูดน้ำกลับเป็นหลัก กลูโคสถูกดูดกลับหมดก่อนถึงส่วนนี้" }
    hints:
      - "สารมีประโยชน์ถูกดูดกลับทันทีหลังการกรอง"
      - "หาท่อขดที่ต่อจากโบว์แมนส์แคปซูลโดยตรง"
    solution: "ค คือท่อหน่วยไตส่วนต้น ซึ่งต่อจากโบว์แมนส์แคปซูล ดูดกลับกลูโคสและกรดอะมิโนเกือบทั้งหมดแบบใช้พลังงาน รวมทั้งโซเดียมไอออนและน้ำจำนวนมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.excretion.p008
    topics: [biology.animals.excretion]
    difficulty: 3
    type: numeric
    stem: "ไตกรองของเหลวได้วันละ 180 ลิตร และขับปัสสาวะออกวันละ 1.5 ลิตร น้ำที่กรองได้ถูกดูดกลับร้อยละเท่าใด ตอบทศนิยม 1 ตำแหน่ง (สมมติว่าปริมาตรปัสสาวะเป็นน้ำทั้งหมด)"
    answer: { value: 99.2, unit: "%", tolerance: 0.1 }
    hints:
      - "ปริมาณที่ถูกดูดกลับ = ปริมาณที่กรองได้ − ปริมาณปัสสาวะ"
      - "หารด้วยปริมาณที่กรองได้ แล้วคูณ 100"
    misconceptions:
      - { match: 0.8, feedback: "นี่คือร้อยละที่ออกเป็นปัสสาวะ ไม่ใช่ร้อยละที่ถูกดูดกลับ" }
      - { match: 178.5, feedback: "นี่คือปริมาตรเป็นลิตรที่ถูกดูดกลับ ต้องเปลี่ยนเป็นร้อยละ" }
    solution: "ดูดกลับ $180 - 1.5 = 178.5$ L คิดเป็น $\\frac{178.5}{180} \\times 100 \\approx 99.2\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.excretion.p009
    topics: [biology.animals.excretion]
    difficulty: 3
    type: numeric
    stem: "พลาสมามียูเรีย 0.03 กรัมต่อ 100 มิลลิลิตร ปัสสาวะมียูเรีย 2.0 กรัมต่อ 100 มิลลิลิตร ยูเรียในปัสสาวะเข้มข้นกว่าในพลาสมากี่เท่า ตอบทศนิยม 1 ตำแหน่ง"
    answer: { value: 66.7, unit: เท่า, tolerance: 0.1 }
    hints:
      - "จำนวนเท่า = ความเข้มข้นในปัสสาวะ ÷ ความเข้มข้นในพลาสมา"
      - "ทั้งสองค่าใช้หน่วยเดียวกันแล้ว หารได้เลย"
    misconceptions:
      - { match: 0.015, feedback: "หารกลับด้าน ต้องเอาความเข้มข้นในปัสสาวะเป็นตัวตั้ง" }
      - { match: 1.97, feedback: "นี่คือผลต่าง ข้อนี้ถามจำนวนเท่า" }
    solution: "$2.0 \\div 0.03 \\approx 66.7$ เท่า เพราะน้ำส่วนใหญ่ถูกดูดกลับ แต่ยูเรียถูกดูดกลับเพียงบางส่วน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.excretion.p010
    topics: [biology.animals.excretion]
    difficulty: 3
    type: mcq
    stem: "ผลตรวจปัสสาวะของผู้ป่วยรายหนึ่งพบกลูโคส ขณะที่คนปกติไม่พบ สาเหตุที่เป็นไปได้มากที่สุดคือข้อใด"
    choices:
      - { id: a, text: "กลูโคสในเลือดสูงมาก จนท่อหน่วยไตส่วนต้นดูดกลับได้ไม่หมด เช่น ในโรคเบาหวาน", correct: true }
      - { id: b, text: "โกลเมอรูลัสปกติจะไม่กรองกลูโคส แต่ในผู้ป่วยรายนี้กรองได้", feedback: "กลูโคสผ่านการกรองในคนปกติอยู่แล้ว แต่ถูกดูดกลับหมด" }
      - { id: c, text: "ผู้ป่วยดื่มน้ำมากเกินไป", feedback: "การดื่มน้ำมากทำให้ปัสสาวะเจือจาง ไม่ได้ทำให้มีกลูโคสในปัสสาวะ" }
    hints:
      - "คนปกติกรองกลูโคสได้หรือไม่ แล้วกลูโคสหายไปไหน"
      - "การดูดกลับมีขีดจำกัด"
    solution: "คนปกติกรองกลูโคสได้แต่ดูดกลับหมดที่ท่อหน่วยไตส่วนต้น เมื่อกลูโคสในเลือดสูงเกินขีดความสามารถในการดูดกลับ เช่น ในเบาหวานที่ควบคุมไม่ได้ กลูโคสจึงเหลือในปัสสาวะ ควรพบแพทย์เพื่อตรวจยืนยัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.excretion.p011
    topics: [biology.animals.excretion]
    difficulty: 3
    type: order
    stem: "เรียงเส้นทางของของเหลวในหน่วยไตจากการกรองจนออกจากหน่วยไต"
    items:
      - "โกลเมอรูลัส"
      - "โบว์แมนส์แคปซูล"
      - "ท่อหน่วยไตส่วนต้น"
      - "ห่วงเฮนเล"
      - "ท่อหน่วยไตส่วนท้าย"
      - "ท่อรวม"
    hints:
      - "เริ่มจากกลุ่มหลอดเลือดฝอยที่เกิดการกรอง"
      - "ห่วงเฮนเลอยู่ระหว่างท่อขดสองช่วง"
    solution: "โกลเมอรูลัส → โบว์แมนส์แคปซูล → ท่อหน่วยไตส่วนต้น → ห่วงเฮนเล → ท่อหน่วยไตส่วนท้าย → ท่อรวม แล้วจึงไปกรวยไต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.excretion.p012
    topics: [biology.animals.excretion]
    difficulty: 3
    type: mcq
    stem: "ปลานิลขับของเสียไนโตรเจนเป็นแอมโมเนียผ่านเหงือกได้ แต่กระต่ายทำเช่นนั้นไม่ได้ เหตุผลข้อใดถูกต้องที่สุด"
    choices:
      - { id: a, text: "ปลาอยู่ในน้ำ แอมโมเนียจึงแพร่ออกและถูกน้ำปริมาณมากเจือจางได้ทันที แต่สัตว์บกต้องประหยัดน้ำ จึงเปลี่ยนเป็นยูเรียก่อน", correct: true }
      - { id: b, text: "แอมโมเนียไม่เป็นพิษต่อปลา", feedback: "แอมโมเนียเป็นพิษต่อปลาเช่นกัน แต่ปลากำจัดออกได้เร็วเพราะน้ำรอบตัวเจือจางให้" }
      - { id: c, text: "กระต่ายไม่สร้างแอมโมเนียจากการสลายโปรตีน", feedback: "สัตว์ทุกชนิดได้แอมโมเนียจากการสลายโปรตีน กระต่ายเปลี่ยนแอมโมเนียเป็นยูเรียที่ตับ" }
    hints:
      - "แอมโมเนียต้องใช้น้ำมากในการขับออก"
      - "สัตว์บกมีน้ำจำกัด"
    solution: "แอมโมเนียเป็นพิษมาก ต้องเจือจางด้วยน้ำปริมาณมาก ปลามีน้ำรอบตัวจึงปล่อยแอมโมเนียออกทางเหงือกได้ สัตว์บกต้องประหยัดน้ำ ตับจึงเปลี่ยนแอมโมเนียเป็นยูเรียที่พิษน้อยกว่าก่อนขับทางไต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.excretion.p013
    topics: [biology.animals.excretion]
    difficulty: 4
    type: numeric
    stem: "ไตกรองของเหลวได้วันละ 180 ลิตร พลาสมามียูเรีย 0.3 กรัมต่อลิตร ปัสสาวะวันละ 1.5 ลิตร มียูเรีย 20 กรัมต่อลิตร ยูเรียที่กรองได้ถูกดูดกลับร้อยละเท่าใด ตอบทศนิยม 1 ตำแหน่ง"
    answer: { value: 44.4, unit: "%", tolerance: 0.2 }
    hints:
