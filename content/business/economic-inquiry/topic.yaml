id: business.econ.economic-inquiry
subject: business
title:
  th: การสืบค้นประเด็นเศรษฐกิจและธุรกิจ ตั้งคำถาม หาข้อมูล ตีความ และเสนอทางเลือก
  en: Investigating economic and business issues
summary: วงจรการสืบค้นประเด็นเศรษฐกิจ ตั้งคำถามที่ตรวจสอบได้ หาและประเมินข้อมูลจากแหล่งปฐมภูมิและทุติยภูมิ ตีความแนวโน้มและความสัมพันธ์ และเสนอทางเลือกด้วยการวิเคราะห์ต้นทุนผลประโยชน์
difficulty: 4.5
minutes: 45
prerequisites:
- business.stats.descriptive
- business.econ.demand-supply
encompasses:
- id: business.stats.descriptive
  weight: 0.4
- id: business.econ.demand-supply
  weight: 0.3
- id: math.stats.data-display
  weight: 0.2
- id: math.number.ratio-percent
  weight: 0.2
curriculum_tags: []
lessons:
- type: figure
  src: inquiry-cycle.svg
  alt: แผนภาพวงกลมมีเจ็ดขั้นเรียงตามเข็มนาฬิกา เริ่มจาก 1 ตั้งคำถาม 2 เลือกแหล่งและเก็บข้อมูล 3 ประเมินความน่าเชื่อถือ 4 จัดข้อมูลเป็นตาราง 5 ตีความแนวโน้มและเหตุผล 6 เสนอทางเลือกและคาดการณ์ผล และ 7 เขียนสรุปและปรับคำถาม ลูกศรจากขั้นสุดท้ายวนกลับไปขั้นแรก มีข้อความกลางวงว่าทำซ้ำเมื่อได้ข้อมูลใหม่
  caption: วงจรการสืบค้นเป็นการทำซ้ำ ไม่ใช่ขั้นตอนเดียวจบ
- type: explanation
  file: lesson.md
- type: figure
  src: price-trend.svg
  alt: กราฟเส้นราคาผักคะน้าหกเดือนจากข้อมูลสมมติ เดือนมกราคม 30 บาท กุมภาพันธ์ 32 บาท มีนาคม 36 บาท เมษายน 40 บาท พฤษภาคม 38 บาท และมิถุนายน 35 บาท เส้นขึ้นถึงจุดสูงสุดในเดือนเมษายนแล้วลดลง
  caption: ข้อมูลสมมติเพื่อฝึกอ่านตารางและกราฟ ไม่ใช่ราคาจริง
- type: worked-example
  title: ราคาเปลี่ยนแปลงจากเดือนพฤษภาคมถึงมิถุนายนกี่เปอร์เซ็นต์
  problem: จากกราฟราคาผักคะน้าข้างต้น (ข้อมูลสมมติ) ราคาในเดือนพฤษภาคมเป็น 38 บาท และเดือนมิถุนายนเป็น 35 บาท ราคาเปลี่ยนแปลงกี่เปอร์เซ็นต์
  steps:
  - text: "สูตรการเปลี่ยนแปลงเป็นร้อยละ $= \\frac{\\text{ราคาใหม่} - \\text{ราคาเดิม}}{\\text{ราคาเดิม}} \\times 100$"
    why: ต้องเทียบกับค่าตั้งต้นเสมอ ซึ่งในที่นี้คือราคาเดือนพฤษภาคม
  - text: "แทนค่า $\\frac{35 - 38}{38} \\times 100 = \\frac{-3}{38} \\times 100 \\approx -7.89$"
  - text: "ราคาลดลงประมาณ $7.89\\%$ ภายในหนึ่งเดือน"
    why: เครื่องหมายลบบอกทิศทางว่าลดลง
  answer: ราคาลดลงประมาณ $7.89\%$ จากเดือนพฤษภาคมถึงเดือนมิถุนายน
- type: check
  problem: business.econ.economic-inquiry.p007
  prompt: ลองคิดก่อนอ่านต่อ ฐานที่ใช้เทียบควรเป็นค่าใด
- type: figure
  src: correlation-confounder.svg
  alt: แผนภาพมีกล่องบนสุดชื่ออุณหภูมิสูงในฤดูร้อน ลูกศรสองเส้นชี้ลงไปยังกล่องซ้ายคือยอดขายไอศกรีมเพิ่ม และกล่องขวาคือจำนวนคนไปเล่นน้ำเพิ่ม ระหว่างกล่องล่างสองกล่องมีเส้นประสีแดงไม่มีหัวลูกศรระบุว่าสัมพันธ์กันพร้อมกัน และข้อความด้านล่างว่าไม่ได้หมายความว่าไอศกรีมทำให้คนไปเล่นน้ำ
  caption: ตัวแปรร่วมทำให้สองสิ่งเปลี่ยนพร้อมกันโดยไม่ต้องเป็นเหตุของกันและกัน
- type: check
  problem: business.econ.economic-inquiry.p011
  prompt: ความสัมพันธ์ที่เห็นในข้อมูลควรนำไปสู่ขั้นตอนใดต่อ
- type: worked-example
  title: ร้านค้าชุมชนควรลงทุนระบบจองออนไลน์หรือไม่
  problem: ระบบจองออนไลน์มีต้นทุนครั้งเดียว 40,000 บาท คาดว่าได้ผลประโยชน์ปีละ 18,000 บาท เป็นเวลา 2 ปี (ข้อมูลสมมติ) โครงการคุ้มค่าหรือไม่ ถ้าใช้เกณฑ์ผลประโยชน์สุทธิ
  steps:
  - text: "รวมผลประโยชน์ทั้งสองปี $2 \\times 18{,}000 = 36{,}000$ บาท"
  - text: "หักต้นทุนครั้งเดียว $36{,}000 - 40{,}000 = -4{,}000$ บาท"
    why: ต้องหักต้นทุนทั้งหมดออกจากผลประโยชน์รวม
  - text: "ผลประโยชน์สุทธิเป็นลบ ภายในสองปีโครงการยังไม่คืนทุน"
    why: ถ้าเกณฑ์สำคัญอื่น เช่น ความสะดวกลูกค้า มีน้ำหนักมาก ควรใช้ตารางให้คะแนนถ่วงน้ำหนักเพิ่มเติม
  answer: ภายในสองปีโครงการยังไม่คุ้มค่า ควรเก็บข้อมูลเพิ่มหรือพิจารณาเกณฑ์อื่นก่อนตัดสินใจ
glossary:
- term: ข้อมูลปฐมภูมิ
  definition: ข้อมูลที่ผู้ศึกษาเก็บเองจากต้นทาง เช่น การสำรวจ การสัมภาษณ์ หรือแบบสอบถาม
- term: ข้อมูลทุติยภูมิ
  definition: ข้อมูลที่คนอื่นเก็บและเผยแพร่ไว้แล้ว เช่น รายงานและสถิติของหน่วยงาน
- term: สหสัมพันธ์
  definition: การที่ตัวแปรสองตัวเปลี่ยนไปพร้อมกันในทิศทางเดียวกันหรือตรงข้ามกัน ซึ่งไม่ได้แปลว่าเป็นเหตุและผลต่อกัน
- term: ตัวแปรร่วม
  definition: ตัวแปรที่อยู่เบื้องหลังและทำให้ตัวแปรสองตัวเปลี่ยนไปพร้อมกัน
- term: ผลประโยชน์สุทธิ
  definition: ผลประโยชน์รวมลบด้วยต้นทุนรวมของโครงการ ตลอดช่วงเวลาที่พิจารณา
flashcards:
- front: ความสัมพันธ์กับเหตุและผลต่างกันอย่างไร
  back: ความสัมพันธ์คือสองตัวแปรเปลี่ยนไปพร้อมกัน ส่วนเหตุและผลต้องมีหลักฐานว่าสิ่งหนึ่งทำให้อีกสิ่งเกิด
- front: ร้อยละการเปลี่ยนแปลง
  back: $\frac{\text{ค่าใหม่} - \text{ค่าเดิม}}{\text{ค่าเดิม}} \times 100$
- front: แหล่งปฐมภูมิกับทุติยภูมิ
  back: ปฐมภูมิผู้ศึกษาเก็บเอง ทุติยภูมิคนอื่นเก็บและเผยแพร่แล้ว
- front: ขั้นตอนการประเมินข้อมูล
  back: ใครทำ เมื่อไร เก็บอย่างไร และมีแหล่งอ้างอิงที่ตรวจสอบได้หรือไม่
