<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" font-family="sans-serif" font-size="15">
  <title>โพสต์บนโซเชียลมีเดียสมมติ อ้างว่าดื่มน้ำมะนาวร้อนฆ่าเชื้อไวรัสได้ 100% และเร่งให้แชร์</title>
  <rect x="0" y="0" width="480" height="400" fill="#ffffff"/>
  <rect x="20.0" y="15.0" width="440.0" height="370.0" rx="12" fill="#fff" stroke="#c3cbc8" stroke-width="1.5" />
  <circle cx="55.0" cy="52.0" r="18.0" fill="#eef1f0" stroke="#6b7672" stroke-width="1.2"/>
  <text x="84.0" y="48.0" text-anchor="start" fill="#15211e" font-weight="bold" font-size="15" >ข่าวสุขภาพทันใจ</text>
  <text x="84.0" y="68.0" text-anchor="start" fill="#6b7672" font-weight="normal" font-size="12" >เพจ · สร้างเมื่อ 2 สัปดาห์ก่อน</text>
  <text x="40.0" y="110.0" text-anchor="start" fill="#c0392b" font-weight="bold" font-size="16" >ด่วน!!! แชร์ด่วนก่อนถูกลบ!!!</text>
  <text x="40.0" y="140.0" text-anchor="start" fill="#15211e" font-weight="bold" font-size="16" >ดื่มน้ำมะนาวร้อนวันละแก้ว</text>
  <text x="40.0" y="170.0" text-anchor="start" fill="#15211e" font-weight="bold" font-size="16" >ฆ่าเชื้อไวรัสได้ 100% หมอยืนยันแล้ว</text>
  <text x="40.0" y="200.0" text-anchor="start" fill="#15211e" font-weight="normal" font-size="16" >รักใครให้แชร์ต่อ ไม่แชร์โชคร้าย 7 ปี</text>
  <rect x="40.0" y="230.0" width="400.0" height="90.0" rx="6" fill="#eef1f0" stroke="#c3cbc8" stroke-width="1" />
  <text x="240.0" y="270.0" text-anchor="middle" fill="#6b7672" font-weight="normal" font-size="14" >[ภาพแก้วน้ำมะนาว]</text>
  <text x="240.0" y="294.0" text-anchor="middle" fill="#6b7672" font-weight="normal" font-size="12" >ไม่มีชื่อแพทย์ ไม่มีลิงก์แหล่งที่มา</text>
  <text x="40.0" y="355.0" text-anchor="start" fill="#6b7672" font-weight="normal" font-size="14" >ถูกใจ 18K   ·   แชร์ 25K</text>
</svg>
