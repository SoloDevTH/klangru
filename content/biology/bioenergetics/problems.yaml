problems:
  - id: biology.cells.bioenergetics.p001
    topics: [biology.cells.bioenergetics]
    difficulty: 1
    type: mcq
    stem: "ปฏิกิริยาที่มีค่า ΔG น้อยกว่าศูนย์ เรียกว่าปฏิกิริยาแบบใด"
    choices:
      - { id: a, text: "เอ็กเซอร์โกนิก (ปล่อยพลังงานอิสระ)", correct: true }
      - { id: b, text: "เอนเดอร์โกนิก (ต้องรับพลังงาน)", feedback: "เอนเดอร์โกนิกมี ΔG มากกว่าศูนย์ จึงต้องรับพลังงานจากภายนอก" }
      - { id: c, text: "สมดุล (ΔG เท่ากับศูนย์)", feedback: "ระบบในสมดุลมี ΔG เท่ากับศูนย์ ไม่ใช่น้อยกว่าศูนย์" }
      - { id: d, text: "พลังงานก่อกัมมันต์", feedback: "พลังงานก่อกัมมันต์เป็นพลังงานที่ต้องใช้เพื่อเริ่มปฏิกิริยา ไม่ใช่การจำแนก ΔG" }
    hints:
      - "ดูเครื่องหมายของ ΔG ว่าเป็นลบหรือบวก"
      - "ปฏิกิริยาที่ ΔG ลบเกิดได้เอง เพราะปล่อยพลังงานอิสระออกมา"
    solution: "ปฏิกิริยาที่ ΔG น้อยกว่าศูนย์เรียกว่าเอ็กเซอร์โกนิก ปล่อยพลังงานอิสระออกมาและเกิดได้เอง ส่วนเอนเดอร์โกนิกมี ΔG มากกว่าศูนย์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.bioenergetics.p002
    topics: [biology.cells.bioenergetics]
    difficulty: 1
    type: text
    stem: "สารที่เซลล์ใช้เป็นสกุลเงินพลังงานระหว่างปฏิกิริยา มีชื่อย่อว่าอะไร"
    accepted: ["ATP", "เอทีพี", "adenosine triphosphate", "อะดีโนซีนไตรฟอสเฟต"]
    hints:
      - "สารนี้มีฟอสเฟตหลายหมู่ และพันธะปลายสุดแตกแล้วปล่อยพลังงาน"
      - "ชื่อย่อประกอบด้วยตัวอักษรสามตัว"
    solution: "ATP หรืออะดีโนซีนไตรฟอสเฟต ทำหน้าที่เป็นตัวพาพลังงานที่หมุนเวียนในเซลล์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.bioenergetics.p003
    topics: [biology.cells.bioenergetics]
    difficulty: 2
    type: numeric
    stem: "ผงกลูโคสสำหรับนักกีฬาหนึ่งซองมีกลูโคส 18 กรัม (มวลโมลาร์ของกลูโคส 180 g/mol) ถ้าการเผาไหม้กลูโคส 1 โมลปล่อยความร้อน 2,805 kJ (ค่าเอนทัลปีการเผาไหม้มาตรฐาน) ผงนี้ให้ความร้อนเทียบเท่ากี่ kJ (ตอบเป็นกิโลจูล)"
    answer: { value: 280, tolerance: 1.5, unit: "kJ" }
    misconceptions:
      - { match: 2805, feedback: "ลืมแปลงกรัมเป็นโมล 2,805 คือพลังงานของกลูโคส 1 โมล ไม่ใช่ 18 กรัม" }
      - { match: 0.1, feedback: "ตอบจำนวนโมลแทนพลังงาน 18 ÷ 180 = 0.1 โมล ต้องคูณด้วย 2,805 ต่อ" }
    hints:
      - "หาจำนวนโมลของกลูโคสก่อนจากมวลกับมวลโมลาร์"
      - "พลังงานที่ได้เท่ากับจำนวนโมลคูณด้วยพลังงานต่อโมล"
    solution: "จำนวนโมล = 18 ÷ 180 = 0.1 โมล พลังงาน = 0.1 × 2,805 = 280.5 ≈ 280 kJ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.bioenergetics.p004
    topics: [biology.cells.bioenergetics]
    difficulty: 2
    type: numeric
    stem: "ที่สภาวะมาตรฐาน ATP หนึ่งโมลถูกไฮโดรไลซ์มี ΔG°′ เท่ากับ −30.5 kJ/mol ถ้านักวิ่งคนหนึ่งในกรุงเทพฯ ใช้ ATP ไฮโดรไลซ์ 5 โมลในช่วงวิ่ง พลังงานอิสระที่ปล่อยออกมารวมเท่าไร (ตอบเป็น kJ ค่าสัมบูรณ์)"
    answer: { value: 152.5, tolerance: 0.5, unit: "kJ" }
    misconceptions:
      - { match: 30.5, feedback: "ลืมคูณจำนวนโมล ATP 5 โมลไม่ได้ปล่อยแค่ 1 โมล" }
      - { match: 6.1, feedback: "หารแทนการคูณ 30.5 ÷ 5 = 6.1 ต้องคูณด้วยจำนวนโมล" }
    hints:
      - "พลังงานต่อโมลคูณกับจำนวนโมลที่ถูกไฮโดรไลซ์"
      - "ไม่ต้องสนใจเครื่องหมายลบ โจทย์ถามค่าสัมบูรณ์"
    solution: "พลังงานรวม = 5 × 30.5 = 152.5 kJ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.bioenergetics.p005
    topics: [biology.cells.bioenergetics]
    difficulty: 2
    type: mcq
    stem: "นักศึกษาวิทยาศาสตร์ในกรุงเทพฯ กำลังอธิบายว่าเหตุใดสิ่งมีชีวิตรักษาความเป็นระเบียบภายในได้ ทั้งที่กฎข้อที่สองบอกว่าเอนโทรปีรวมเพิ่มขึ้น ข้อใดอธิบายได้ถูกต้อง"
    choices:
      - { id: a, text: "สิ่งมีชีวิตรักษาความเป็นระเบียบภายในได้ โดยปล่อยความร้อนและของเสียที่เพิ่มเอนโทรปีให้สิ่งแวดล้อม", correct: true }
      - { id: b, text: "สิ่งมีชีวิตทำให้เอนโทรปีของจักรวาลลดลง", feedback: "กฎข้อที่สองบอกว่าเอนโทรปีรวมของจักรวาลเพิ่มขึ้นเสมอ" }
      - { id: c, text: "สิ่งมีชีวิตสร้างพลังงานขึ้นมาใหม่จากอาหาร", feedback: "การสร้างพลังงานขึ้นใหม่ขัดกับกฎข้อที่หนึ่ง พลังงานจากอาหารถูกเปลี่ยนรูป" }
      - { id: d, text: "สิ่งมีชีวิตไม่มีการเปลี่ยนแปลงพลังงานเลย", feedback: "สิ่งมีชีวิตมีการรับและปล่อยพลังงานตลอดเวลา" }
    hints:
      - "นึกถึงความร้อนที่ร่างกายปล่อยออกมา"
      - "เอนโทรปีของระบบเปิดอาจลดลงได้ ถ้าสิ่งแวดล้อมเพิ่มขึ้นมากกว่า"
    solution: "สิ่งมีชีวิตเป็นระบบเปิดที่รักษาความเป็นระเบียบภายในด้วยการดึงพลังงานจากอาหาร แล้วปล่อยความร้อนและของเสียออกไป ทำให้เอนโทรปีรวมของจักรวาลเพิ่มขึ้นตามกฎ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.bioenergetics.p006
    topics: [biology.cells.bioenergetics]
    difficulty: 2
    type: mcq
    stem: "เอนไซม์มีผลต่อปฏิกิริยาเคมีในเซลล์อย่างไร"
    choices:
      - { id: a, text: "ลดพลังงานก่อกัมมันต์ โดยไม่เปลี่ยนค่า ΔG ของปฏิกิริยา", correct: true }
      - { id: b, text: "ทำให้ ΔG ของปฏิกิริยาติดลบมากขึ้น", feedback: "เอนไซม์ไม่เปลี่ยนค่า ΔG เอนไซม์ทำให้ปฏิกิริยาเกิดเร็วขึ้นเท่านั้น" }
      - { id: c, text: "เปลี่ยนปฏิกิริยาเอนเดอร์โกนิกเป็นเอ็กเซอร์โกนิก", feedback: "ทิศทางและค่า ΔG ไม่ถูกเปลี่ยนโดยเอนไซม์" }
      - { id: d, text: "เพิ่มพลังงานของสารตั้งต้นให้สูงขึ้น", feedback: "การเพิ่มพลังงานของสารตั้งต้นจะทำให้ปฏิกิริยายากขึ้น ไม่ใช่เร็วขึ้น" }
    hints:
      - "เอนไซม์ช่วยให้โมเลกุลไปถึงสถานะที่พร้อมทำปฏิกิริยาได้ง่ายขึ้น"
      - "ลองคิดว่าเอนไซม์เปลี่ยนจุดเริ่มหรือจุดสิ้นสุดของปฏิกิริยาหรือไม่"
    solution: "เอนไซม์เป็นตัวเร่งชีวภาพที่ลดพลังงานก่อกัมมันต์ ทำให้ปฏิกิริยาเกิดเร็วขึ้น แต่ ΔG ของปฏิกิริยาไม่เปลี่ยน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.bioenergetics.p007
    topics: [biology.cells.bioenergetics]
    difficulty: 2
    type: numeric
    stem: "ปฏิกิริยาหนึ่งมีพลังงานก่อกัมมันต์ 80 kJ/mol เมื่อมีเอนไซม์พลังงานก่อกัมมันต์ลดเหลือ 50 kJ/mol พลังงานก่อกัมมันต์ลดลงกี่ kJ/mol (ตอบเป็น kJ/mol)"
    answer: { value: 30, tolerance: 0, unit: "kJ/mol" }
    misconceptions:
      - { match: 50, feedback: "ตอบค่าหลังมีเอนไซม์แทนค่าที่ลดลง ต้องหาผลต่าง 80 − 50" }
      - { match: 130, feedback: "บวกแทนการลบ 80 + 50 = 130 ผลต่างต้องเป็นการลบ" }
    hints:
      - "ผลที่ลดลงคือค่าก่อนหักลบค่าหลัง"
      - "ลบค่าที่เหลือออกจากค่าเดิม"
    solution: "ผลต่าง = 80 − 50 = 30 kJ/mol เอนไซม์ลดพลังงานก่อกัมมันต์ลง 30 kJ/mol"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.bioenergetics.p008
    topics: [biology.cells.bioenergetics]
    difficulty: 2
    type: match
    stem: "จับคู่สัญลักษณ์ในสมการ ΔG = ΔH − TΔS กับความหมาย"
    pairs:
      - { left: "ΔG", right: "พลังงานอิสระที่ใช้ทำงานได้" }
      - { left: "ΔH", right: "การเปลี่ยนแปลงเอนทัลปีหรือความร้อนของปฏิกิริยา" }
      - { left: "T", right: "อุณหภูมิสัมบูรณ์ (เคลวิน)" }
      - { left: "ΔS", right: "การเปลี่ยนแปลงเอนโทรปีหรือความไม่เป็นระเบียบ" }
    hints:
      - "ΔG เป็นตัวบอกว่าปฏิกิริยาเกิดเองได้หรือไม่"
      - "T ต้องเป็นอุณหภูมิในหน่วยเคลวิน จึงไม่มีค่าติดลบ"
    solution: "ΔG คือพลังงานอิสระ ΔH คือการเปลี่ยนแปลงเอนทัลปี T คืออุณหภูมิสัมบูรณ์ และ ΔS คือการเปลี่ยนแปลงเอนโทรปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.bioenergetics.p009
    topics: [biology.cells.bioenergetics]
    difficulty: 2
    type: match
    stem: "จับคู่ตัวพาอิเล็กตรอนหรือตัวรับกับรูปที่เกิดขึ้นหลังรับอิเล็กตรอน"
    pairs:
      - { left: "NAD⁺", right: "NADH" }
      - { left: "FAD", right: "FADH₂" }
      - { left: "O₂ (ตัวรับอิเล็กตรอนตัวสุดท้ายในการหายใจ)", right: "H₂O" }
    hints:
      - "รูปที่รับอิเล็กตรอนและโปรตอนมักมี H เพิ่มขึ้น"
      - "ออกซิเจนรับอิเล็กตรอนแล้วรวมกับโปรตอนเป็นน้ำ"
    solution: "NAD⁺ รับอิเล็กตรอนและโปรตอนเป็น NADH และ FAD รับเป็น FADH₂ ส่วน O₂ รับอิเล็กตรอนและโปรตอนได้น้ำ (H₂O) เป็นผลิตภัณฑ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.bioenergetics.p010
    topics: [biology.cells.bioenergetics]
    difficulty: 2
    type: text
    stem: "การที่สารรับอิเล็กตรอนในปฏิกิริยารีดอกซ์ เรียกว่าอะไร"
    accepted: ["รีดักชัน", "รีดักชั่น", "การรีดักชัน", "การรีดักชั่น", "reduction"]
    misconceptions:
      - { match: "ออกซิเดชัน", feedback: "ออกซิเดชันคือการเสียอิเล็กตรอน ส่วนการรับอิเล็กตรอนคือรีดักชัน" }
    hints:
      - "คำนี้เป็นคู่ตรงข้ามของออกซิเดชัน"
      - "NAD⁺ เปลี่ยนเป็น NADH โดยการรับอิเล็กตรอน"
    solution: "การรับอิเล็กตรอนเรียกว่ารีดักชัน (reduction) และการเสียอิเล็กตรอนเรียกว่าออกซิเดชัน (oxidation) ทั้งสองเกิดพร้อมกันเสมอ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.bioenergetics.p011
    topics: [biology.cells.bioenergetics]
    difficulty: 3
    type: numeric
    stem: "ปฏิกิริยาหนึ่งที่ 300 K มี ΔH = +50 kJ/mol และ ΔS = +0.10 kJ/(mol·K) คำนวณ ΔG ของปฏิกิริยา (ตอบเป็น kJ/mol)"
    answer: { value: 20, tolerance: 0.1, unit: "kJ/mol" }
    misconceptions:
      - { match: 80, feedback: "บวก TΔS แทนการลบ จึงได้ 50 + 30 = 80 ต้องคิด ΔH − TΔS" }
      - { match: -20, feedback: "สลับเครื่องหมายทั้งสมการ ได้ −(50 − 30) = −20 ซึ่งไม่ใช่สมการของกิบส์" }
    hints:
      - "คำนวณ TΔS ก่อน โดยคูณอุณหภูมิกับเอนโทรปี"
      - "นำ TΔS ไปลบออกจาก ΔH"
    solution: "TΔS = 300 × 0.10 = 30 kJ/mol ΔG = 50 − 30 = 20 kJ/mol ค่าบวกแปลว่าปฏิกิริยาเป็นเอนเดอร์โกนิก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.bioenergetics.p012
    topics: [biology.cells.bioenergetics]
    difficulty: 3
    type: mcq
    stem: "เหตุใดเซลล์จึงใช้ ATP เป็นตัวพาพลังงานระหว่างปฏิกิริยา แทนการใช้พลังงานจากกลูโคสโดยตรง"
    choices:
      - { id: a, text: "ATP ปล่อยพลังงานในขนาดที่จับคู่กับปฏิกิริยาที่ต้องการพลังงานได้ง่าย และแบ่งใช้ทีละขั้นได้", correct: true }
      - { id: b, text: "ATP มีพลังงานต่อโมลมากกว่ากลูโคส", feedback: "กลูโคสให้พลังงานต่อโมลมากกว่ามาก แต่ปล่อยทีเดียวมากเกินกว่าที่ใช้ทีละขั้นได้" }
      - { id: c, text: "ATP ทำให้ ΔG ของทุกปฏิกิริยาเป็นบวก", feedback: "ATP ไม่ทำให้ ΔG ของปฏิกิริยาเป็นบวก แต่การไฮโดรไลซิสของมันมี ΔG ลบ" }
      - { id: d, text: "ATP ไม่ต้องใช้เอนไซม์ในการทำงาน", feedback: "ปฏิกิริยาที่เกี่ยวกับ ATP ในเซลล์ส่วนใหญ่ใช้เอนไซม์ช่วย" }
    hints:
      - "ลองคิดว่าพลังงานที่ปล่อยออกมาทีละส่วนเหมาะกับปฏิกิริยาที่ต้องการพลังงานเท่าไร"
      - "พิจารณาว่าพลังงานในกลูโคสถูกปล่อยออกมาในลักษณะใด"
    solution: "ATP ให้พลังงานในขนาดที่ใช้ได้กับปฏิกิริยาแต่ละขั้น จึงจับคู่กับปฏิกิริยาเอนเดอร์โกนิกได้ง่าย ขณะที่กลูโคสปล่อยพลังงานมากเกินกว่าที่ใช้ทีละขั้นได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.bioenergetics.p013
    topics: [biology.cells.bioenergetics]
    difficulty: 2
    type: order
    stem: "ในห้องปฏิบัติการของโรงเรียนไทย นักเรียนวาดกราฟพลังงานของปฏิกิริยาเอ็กเซอร์โกนิก แล้วเรียงระดับพลังงานอิสระจากสูงที่สุดไปต่ำที่สุด"
    items:
