    solution: "นักเรียนหญิงมี $12 + 14 = 26$ คน ชอบกีฬา 12 คน คิดเป็น $\\tfrac{12}{26} \\times 100 \\approx 46.2\\%$ เทียบกับนักเรียนชาย $\\tfrac{18}{24} = 75\\%$ จึงเห็นว่าในกลุ่มนี้ นักเรียนชายมีสัดส่วนที่ชอบกีฬามากกว่า"
