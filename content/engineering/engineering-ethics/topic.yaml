id: engineering.professional.engineering-ethics
subject: engineering
title: { th: จรรยาบรรณและความรับผิดชอบของวิศวกร, en: Engineering ethics and professional responsibility }
summary: หน้าที่ต่อความปลอดภัยของสาธารณะ ใบอนุญาตและการลงนามรับรองแบบ ผลประโยชน์ทับซ้อน การแจ้งเบาะแส และกรอบตัดสินใจเมื่อข้อกำหนดขัดกับความปลอดภัย
difficulty: 5
minutes: 35
prerequisites: [engineering.design.design-process]
encompasses:
  - { id: engineering.design.design-process, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - { type: check, problem: engineering.professional.engineering-ethics.p001, prompt: "ลองคิดก่อนอ่านต่อ: อะไรควรมาก่อนเมื่อผลประโยชน์ขัดกัน" }
  - type: figure
    title: ความขัดแย้งทางผลประโยชน์
    src: conflict-venn.svg
    alt: "แผนภาพวงกลมสามวง วงซ้ายสีฟ้าคือหน้าที่ต่อสาธารณะ วงขวาสีส้มคือผลประโยชน์ส่วนตัว วงล่างสีเขียวคือหน้าที่ต่อนายจ้างหรือลูกค้า ส่วนที่วงทับกันคือความขัดแย้งที่ต้องเปิดเผยและจัดการ"
    caption: "ความขัดแย้งเกิดเมื่อวงทับกัน หน้าที่ต่อความปลอดภัยของสาธารณะอยู่เหนือทุกวงกลม"
  - type: worked-example
    title: ลดค่าความปลอดภัยแล้วความสามารถหายไปเท่าไร
    problem: "โครงค้ำรับน้ำหนักใช้งาน $40\\ \\mathrm{kN}$ ออกแบบด้วยค่าความปลอดภัย 2.5 ลูกค้าขอลดเหลือ 1.3 ความสามารถรับแรงสูงสุดลดลงกี่เปอร์เซ็นต์"
    steps:
      - text: "ค่าความปลอดภัย $\\mathrm{FS} = \\dfrac{\\text{ความสามารถรับแรงสูงสุด}}{\\text{แรงใช้งาน}}$ ดังนั้นความสามารถ $= \\mathrm{FS} \\times 40$"
        why: "สูตรนี้ย้อนกลับจากนิยามของ factor of safety ทำให้เห็นว่าความสามารถขึ้นกับค่า FS โดยตรง"
      - text: "ก่อนลด: $2.5 \\times 40 = 100\\ \\mathrm{kN}$ หลังลด: $1.3 \\times 40 = 52\\ \\mathrm{kN}$"
      - text: "ส่วนที่หายไป $= 100 - 52 = 48\\ \\mathrm{kN}$ คิดเป็น $\\frac{48}{100} \\times 100 = 48\\%$ ของความสามารถเดิม"
        why: "ต้องหารด้วยค่าก่อนลด (100) ไม่ใช่ลบค่า FS กันได้ 1.2 เพราะผลลบนั้นไม่ได้บอกร้อยละของความสามารถที่หายไป"
    answer: "ความสามารถรับแรงลดลง 48% ทั้งที่ตัวเลข FS ลดลงเพียง 1.2 หน่วย ความปลอดภัยที่หายไปจึงมากกว่าที่ตาเห็น"
  - type: worked-example
    title: ตัวเลขทางการเงินเพียงอย่างเดียวอาจดูคุ้ม แต่ไม่ได้บอกทั้งหมด
    problem: "(ข้อมูลสมมติ) ระบบระบายควันเพิ่มประหยัดได้ 3.5 ล้านบาท โอกาสเกิดเหตุร้ายแรง 1 ใน 2,000 ปี ความเสียหายทรัพย์สิน 300 ล้านบาท ตัดสินว่าควรประหยัดหรือไม่"
    steps:
      - text: "ความเสียหายคาดหมายต่อปี $= 300 \\times \\frac{1}{2000} = 0.15$ ล้านบาทต่อปี"
      - text: "ตลอดอายุ 50 ปี โดยประมาณเชิงเส้น $0.15 \\times 50 = 7.5$ ล้านบาท"
        why: "การคูณด้วยจำนวนปีเป็นการประมาณที่ใช้ได้เมื่อความน่าจะเป็นรายปีมีค่าน้อย"
      - text: "เทียบกับที่ประหยัดได้ 3.5 ล้านบาท จะเห็นว่า $7.5 > 3.5$ แม้คิดเป็นเงินอย่างเดียว การประหยัดก็ไม่คุ้ม"
        why: "ตัวเลขนี้ยังไม่รวมชีวิตและสุขภาพของผู้ใช้อาคาร ซึ่งจะทำให้น้ำหนักของความเสี่ยงสูงขึ้นอีก"
    answer: "ไม่คุ้มทั้งทางการเงิน และการตัดสินใจที่ไม่รวมชีวิตจะทำให้มองข้ามอันตรายจริง"
  - type: figure
    title: กรอบตัดสินใจเมื่อข้อกำหนดขัดกับความปลอดภัย
    src: decision-flow.svg
    alt: "ผังงานเริ่มจากพบว่าข้อกำหนดกระทบความปลอดภัย แล้วตรวจด้วยการคำนวณ ถ้าไม่มีความเสี่ยงให้ดำเนินงานต่อ ถ้ามีให้บันทึกเป็นลายลักษณ์อักษร แจ้งผู้มีอำนาจ แล้วถามว่าแก้ไขให้ปลอดภัยได้โดยไม่ลดมาตรฐานหรือไม่ ได้ก็ทำต่อและลงนาม ไม่ได้ก็ไม่ลงนามและแจ้งหน่วยงานกำกับ"
    caption: "ผังนี้ใช้ทบทวนความคิด ไม่ได้แทนกฎหมายและข้อบังคับของหน่วยงานที่เกี่ยวข้อง"
  - { type: check, problem: engineering.professional.engineering-ethics.p008, prompt: "ตัดสินใจว่าอะไรควรทำก่อนและเพราะเหตุใด" }
glossary:
  - { term: ผลประโยชน์ทับซ้อน, definition: "สถานการณ์ที่ผลประโยชน์ส่วนตัวอาจทำให้การตัดสินใจทางวิชาชีพเอนเอียง (conflict of interest)" }
  - { term: การแจ้งเบาะแส, definition: "การรายงานการกระทำที่เสี่ยงต่ออันตรายหรือผิดกฎหมายต่อผู้มีอำนาจตามช่องทางที่กำหนด (whistleblowing)" }
  - { term: การลงนามรับรองแบบ, definition: "การยืนยันด้วยวิชาชีพว่างานอยู่ในขอบเขตที่รับรองและถูกต้องตามหลักวิชา ผู้ลงนามรับผิดชอบต่อผลนั้น" }
  - { term: วิศวกรรมควบคุม, definition: "การประกอบวิชาชีพวิศวกรรมที่กฎหมายกำหนดให้ต้องมีใบอนุญาต ในไทยกำกับโดยสภาวิศวกรตามพระราชบัญญัติวิศวกร" }
  - { term: ค่าความปลอดภัย, definition: "อัตราส่วนระหว่างความสามารถรับแรงสูงสุดกับแรงใช้งาน ยิ่งสูงยิ่งมีส่วนเผื่อ (factor of safety)" }
  - { term: ความเสียหายคาดหมาย, definition: "ค่าเสียหายคูณความน่าจะเป็นที่จะเกิดเหตุ ใช้เปรียบเทียบความเสี่ยงได้แต่ไม่ได้รวมทุกมิติ (expected loss)" }
flashcards:
