problems:
  - id: biology.life.living-things.p001
    topics: [biology.life.living-things]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นสิ่งมีชีวิต"
    choices:
      - { id: a, text: "ต้นกล้วย", correct: true }
      - { id: b, text: "ตุ๊กตาหมี", feedback: "ตุ๊กตาไม่กินอาหาร ไม่โตขึ้น และมีลูกไม่ได้ จึงเป็นสิ่งไม่มีชีวิต แม้จะมีหน้าตาเหมือนสัตว์" }
      - { id: c, text: "ก้อนหิน", feedback: "ก้อนหินไม่กินอาหาร ไม่หายใจ และไม่โตขึ้นเอง จึงไม่มีชีวิต" }
      - { id: d, text: "รถจักรยานยนต์", feedback: "รถวิ่งได้เพราะมีคนขับและใช้น้ำมัน การเคลื่อนที่อย่างเดียวไม่ได้ทำให้มีชีวิต" }
    hints:
      - "สิ่งใดกินอาหาร โตขึ้น และมีลูกได้"
      - "ต้นไม้ไม่เดินไปไหน แต่โตขึ้นทุกวัน"
    solution: "ต้นกล้วยต้องการน้ำและแสง หายใจ โตขึ้น และแตกหน่อเป็นต้นใหม่ได้ จึงเป็นสิ่งมีชีวิต ส่วนตุ๊กตา ก้อนหิน และรถจักรยานยนต์เป็นสิ่งไม่มีชีวิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.life.living-things.p002
    topics: [biology.life.living-things]
    difficulty: 1
    type: mcq
    multiple: true
    stem: "เลือกสิ่งไม่มีชีวิตทั้งหมด"
    choices:
      - { id: a, text: "แก้วน้ำ", correct: true }
      - { id: b, text: "ก้อนหิน", correct: true }
      - { id: c, text: "ไส้เดือน", feedback: "ไส้เดือนกินอาหาร หายใจ โตขึ้น และมีลูกได้ จึงเป็นสิ่งมีชีวิต" }
      - { id: d, text: "เห็ด", feedback: "เห็ดงอกขึ้นมา โตขึ้น และมีดอกใหม่ได้ เห็ดจึงเป็นสิ่งมีชีวิต แม้จะไม่ใช่ทั้งพืชและสัตว์" }
    hints:
      - "ถามทีละสิ่งว่ากินอาหาร โตขึ้น และมีลูกได้ไหม"
      - "มีสองสิ่งที่ไม่เคยโตขึ้นเองเลย"
    solution: "แก้วน้ำและก้อนหินไม่กินอาหาร ไม่หายใจ ไม่โต และมีลูกไม่ได้ จึงเป็นสิ่งไม่มีชีวิต ส่วนไส้เดือนและเห็ดเป็นสิ่งมีชีวิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.life.living-things.p003
    topics: [biology.life.living-things]
    difficulty: 1
    type: text
    stem: "คน สัตว์ และพืช ต้องเอาอากาศเข้าสู่ร่างกายตลอดเวลา การทำแบบนี้เรียกว่าอะไร (ตอบเป็นคำเดียว)"
    accepted: ["หายใจ", "การหายใจ"]
    hints:
      - "เราทำสิ่งนี้ด้วยจมูกตลอดเวลา แม้ตอนนอนหลับ"
      - "ปลาทำสิ่งนี้ด้วยเหงือก"
    misconceptions:
      - { match: "กินอาหาร", feedback: "กินอาหารคือการเอาอาหารเข้าร่างกาย โจทย์ถามถึงการเอาอากาศเข้าร่างกาย" }
    solution: "การเอาอากาศเข้าสู่ร่างกายคือ การหายใจ ซึ่งเป็นลักษณะหนึ่งของสิ่งมีชีวิต พืชก็หายใจเช่นกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.life.living-things.p004
    topics: [biology.life.living-things]
    difficulty: 2
    type: match
    stem: "จับคู่เหตุการณ์กับลักษณะของสิ่งมีชีวิตที่เหตุการณ์นั้นแสดงให้เห็น"
    pairs:
      - { left: "ลูกสุนัขตัวโตขึ้นทุกเดือน", right: "เจริญเติบโต" }
      - { left: "แม่ไก่ออกไข่แล้วฟักเป็นลูกเจี๊ยบ", right: "สืบพันธุ์" }
      - { left: "ใบไมยราบหุบเมื่อถูกแตะ", right: "ตอบสนองต่อสิ่งเร้า" }
      - { left: "วัวเล็มหญ้าทุกวัน", right: "ต้องการอาหาร" }
      - { left: "แมวถ่ายมูลในกระบะทราย", right: "ขับถ่ายของเสีย" }
    hints:
      - "ดูว่าในแต่ละเหตุการณ์ สิ่งมีชีวิตกำลังทำอะไร"
      - "การมีลูกคือการสืบพันธุ์ การหุบใบเมื่อถูกแตะคือการตอบสนอง"
    solution: "ลูกสุนัขโตขึ้น → เจริญเติบโต, แม่ไก่ออกไข่ → สืบพันธุ์, ใบไมยราบหุบ → ตอบสนองต่อสิ่งเร้า, วัวเล็มหญ้า → ต้องการอาหาร, แมวถ่ายมูล → ขับถ่ายของเสีย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.life.living-things.p005
    topics: [biology.life.living-things]
    difficulty: 2
    type: mcq
    stem: "หุ่นยนต์ของเล่นเดินได้และส่งเสียงได้ เหตุผลใดบอกได้ดีที่สุดว่าหุ่นยนต์เป็นสิ่งไม่มีชีวิต"
    choices:
      - { id: a, text: "หุ่นยนต์ไม่กินอาหาร ไม่โตขึ้น และมีลูกไม่ได้", correct: true }
      - { id: b, text: "หุ่นยนต์เคลื่อนที่ได้", feedback: "การเคลื่อนที่ไม่ได้บอกว่าไม่มีชีวิต แมวก็เคลื่อนที่ได้ ต้องดูลักษณะอื่นด้วย" }
      - { id: c, text: "หุ่นยนต์ไม่มีสีเขียว", feedback: "สีไม่ใช่ลักษณะของสิ่งมีชีวิต แมวและคนก็ไม่มีสีเขียว" }
      - { id: d, text: "หุ่นยนต์ส่งเสียงได้", feedback: "สัตว์หลายชนิดก็ส่งเสียงได้ การส่งเสียงไม่ได้บอกว่ามีหรือไม่มีชีวิต" }
    hints:
      - "นึกถึงลักษณะ 6 ข้อของสิ่งมีชีวิต"
      - "หุ่นยนต์ขาดลักษณะข้อใดบ้าง"
    solution: "หุ่นยนต์เดินได้เพราะใช้ถ่านไฟฉาย แต่ไม่กินอาหาร ไม่หายใจ ไม่โตขึ้นเอง และมีลูกไม่ได้ จึงเป็นสิ่งไม่มีชีวิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.life.living-things.p006
    topics: [biology.life.living-things]
    difficulty: 2
    type: mcq
    stem: "ต้นมะม่วงหน้าบ้านไม่เดินไปไหนและไม่ส่งเสียง ทำไมต้นมะม่วงจึงเป็นสิ่งมีชีวิต"
    choices:
      - { id: a, text: "ต้นมะม่วงต้องการน้ำ โตขึ้น และมีเมล็ดที่งอกเป็นต้นใหม่ได้", correct: true }
      - { id: b, text: "ต้นมะม่วงมีขนาดใหญ่", feedback: "ขนาดไม่ได้บอกว่ามีชีวิต ตึกก็ใหญ่แต่ไม่มีชีวิต" }
      - { id: c, text: "ต้นมะม่วงอยู่ในดิน", feedback: "ก้อนหินก็อยู่ในดินแต่ไม่มีชีวิต ต้องดูว่าโตขึ้นและมีลูกได้ไหม" }
      - { id: d, text: "ต้นมะม่วงไม่ใช่สิ่งมีชีวิต เพราะเดินไม่ได้", feedback: "พืชไม่เดิน แต่มีชีวิต พืชหายใจ โตขึ้น และมีลูกได้" }
    hints:
      - "การเดินไม่ใช่ลักษณะเดียวของสิ่งมีชีวิต"
      - "ต้นมะม่วงโตขึ้นและมีลูกได้ไหม"
    solution: "ต้นมะม่วงต้องการน้ำและแสง หายใจ โตขึ้นทุกปี ออกดอกและติดผลที่มีเมล็ดซึ่งงอกเป็นต้นใหม่ได้ จึงเป็นสิ่งมีชีวิต แม้จะเดินไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.life.living-things.p007
    topics: [biology.life.living-things]
    difficulty: 2
    type: numeric
    stem: "ในสวนหลังบ้าน น้องต้นเห็น ต้นมะละกอ ก้อนหิน ผีเสื้อ กระถางดินเผา ต้นหญ้า จอบ ไส้เดือน น้ำในโอ่ง และสายยาง ในรายการนี้มีสิ่งมีชีวิตกี่สิ่ง (ตอบเป็นจำนวน)"
    answer: { value: 4, unit: สิ่ง }
    hints:
      - "ดูทีละสิ่งว่ากินอาหาร โตขึ้น และมีลูกได้ไหม"
      - "อย่าลืมว่าพืชก็เป็นสิ่งมีชีวิต"
    misconceptions:
      - { match: 2, feedback: "นับเฉพาะสัตว์ (ผีเสื้อ ไส้เดือน) ต้นมะละกอและต้นหญ้าก็เป็นสิ่งมีชีวิต" }
      - { match: 5, feedback: "5 คือจำนวนสิ่งไม่มีชีวิต (ก้อนหิน กระถาง จอบ น้ำ สายยาง) โจทย์ถามจำนวนสิ่งมีชีวิต" }
    solution: "สิ่งมีชีวิตคือ ต้นมะละกอ ผีเสื้อ ต้นหญ้า และไส้เดือน รวม 4 สิ่ง ส่วนก้อนหิน กระถางดินเผา จอบ น้ำในโอ่ง และสายยาง เป็นสิ่งไม่มีชีวิต 5 สิ่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.life.living-things.p008
    topics: [biology.life.living-things]
    difficulty: 2
    type: mcq
    stem: "ลูกโป่งใหญ่ขึ้นเมื่อเราเป่าลมเข้าไป ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "ลูกโป่งไม่ได้เจริญเติบโต เพราะใหญ่ขึ้นจากลมที่เราเป่าเข้าไปจากข้างนอก", correct: true }
      - { id: b, text: "ลูกโป่งเจริญเติบโต จึงเป็นสิ่งมีชีวิต", feedback: "การเจริญเติบโตของสิ่งมีชีวิตเกิดจากภายในร่างกายโดยใช้อาหาร ลูกโป่งใหญ่ขึ้นเพราะมีคนเป่าลมใส่" }
      - { id: c, text: "ลูกโป่งหายใจเพราะมีลมอยู่ข้างใน", feedback: "การมีอากาศอยู่ข้างในไม่ใช่การหายใจ ลูกโป่งไม่ได้ใช้อากาศนั้นเลย" }
    hints:
      - "การเจริญเติบโตของสิ่งมีชีวิตใช้อะไร"
      - "ถ้าไม่มีใครเป่า ลูกโป่งจะใหญ่ขึ้นเองไหม"
    solution: "ลูกโป่งใหญ่ขึ้นเพราะลมจากข้างนอก ไม่ได้โตเองจากอาหาร ไม่หายใจ และมีลูกไม่ได้ ลูกโป่งจึงเป็นสิ่งไม่มีชีวิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.life.living-things.p009
    topics: [biology.life.living-things]
    difficulty: 3
    type: mcq
    stem: "ใบไม้แห้งที่ร่วงจากต้นลงมาอยู่บนสนาม จัดอยู่ในกลุ่มใด"
    choices:
      - { id: a, text: "เคยมีชีวิต แต่ตายแล้ว", correct: true }
      - { id: b, text: "ไม่เคยมีชีวิตเลย", feedback: "ใบไม้นี้เคยเป็นส่วนหนึ่งของต้นไม้ที่มีชีวิต จึงไม่ใช่สิ่งที่ไม่เคยมีชีวิตแบบก้อนหิน" }
      - { id: c, text: "ยังมีชีวิตอยู่", feedback: "ใบไม้แห้งหลุดจากต้นแล้ว ไม่โตขึ้นอีก และไม่สร้างอาหารแล้ว" }
    hints:
      - "ก่อนร่วงลงมา ใบไม้นี้เป็นส่วนของอะไร"
      - "ตอนนี้ใบไม้ยังโตขึ้นได้อีกไหม"
    solution: "ใบไม้เคยเป็นส่วนของต้นไม้ที่มีชีวิต แต่เมื่อแห้งและร่วงลงมาก็ไม่โตและไม่สร้างอาหารแล้ว จึงเป็นสิ่งที่เคยมีชีวิตแต่ตายแล้ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.life.living-things.p010
    topics: [biology.life.living-things]
    difficulty: 3
    type: match
    stem: "จับคู่สิ่งของกับกลุ่มที่ถูกต้อง"
    pairs:
      - { left: "ต้นมะลิในกระถางที่กำลังออกดอก", right: "ยังมีชีวิต" }
      - { left: "โต๊ะไม้สัก", right: "เคยมีชีวิต แต่ตายแล้ว" }
      - { left: "ช้อนเหล็ก", right: "ไม่เคยมีชีวิตเลย" }
    hints:
      - "โต๊ะไม้ทำมาจากอะไร"
      - "เหล็กมาจากแร่ในดิน ไม่ได้มาจากพืชหรือสัตว์"
    solution: "ต้นมะลิยังโตและออกดอกจึงยังมีชีวิต โต๊ะไม้สักทำจากเนื้อไม้ของต้นสักที่เคยมีชีวิต ช้อนเหล็กทำจากแร่ที่ไม่เคยมีชีวิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.life.living-things.p011
    topics: [biology.life.living-things]
    difficulty: 3
    type: order
    stem: "เรียงช่วงชีวิตของไก่ตั้งแต่เริ่มต้น"
    items:
      - "ไข่ที่แม่ไก่กก"
      - "ลูกเจี๊ยบฟักออกจากไข่"
      - "ไก่รุ่นที่ขนเริ่มยาว"
      - "ไก่โตเต็มวัยที่ออกไข่ได้"
    hints:
      - "ไก่เริ่มต้นชีวิตจากอะไร"
      - "ไก่ต้องโตเต็มที่ก่อนจึงมีลูกได้"
    solution: "ไข่ → ลูกเจี๊ยบ → ไก่รุ่น → ไก่โตเต็มวัยที่ออกไข่ได้ แล้วไข่ใบใหม่ก็เริ่มวัฏจักรชีวิตอีกครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.life.living-things.p012
    topics: [biology.life.living-things]
    difficulty: 3
    type: mcq
    stem: "ข้อใดบอกความเหมือนและความต่างของวัฏจักรชีวิตของต้นมะม่วงกับไก่ได้ถูกต้อง"
    choices:
      - { id: a, text: "ทั้งสองโตขึ้นและมีลูกได้ แต่มะม่วงเริ่มจากเมล็ด ส่วนไก่เริ่มจากไข่", correct: true }
      - { id: b, text: "ไก่โตขึ้นและมีลูกได้ แต่ต้นมะม่วงไม่มีลูก", feedback: "ต้นมะม่วงมีลูกได้ เมล็ดในผลมะม่วงงอกเป็นต้นใหม่" }
      - { id: c, text: "ทั้งสองเริ่มจากไข่เหมือนกัน", feedback: "พืชดอกเริ่มจากเมล็ด ไม่ได้เริ่มจากไข่แบบไก่" }
      - { id: d, text: "ต้นมะม่วงไม่ต้องออกดอกก็มีเมล็ดได้", feedback: "พืชดอกต้องออกดอกก่อน ดอกจึงกลายเป็นผลที่มีเมล็ด" }
    hints:
      - "สิ่งมีชีวิตทุกชนิดโตขึ้นและมีลูก"
      - "ชีวิตใหม่ของต้นมะม่วงกับไก่เริ่มจากอะไร"
    solution: "ทั้งต้นมะม่วงและไก่โตขึ้นและมีลูกได้ ต้นมะม่วงเริ่มจากเมล็ด โตขึ้น ออกดอก แล้วติดผลที่มีเมล็ด ส่วนไก่เริ่มจากไข่ ฟักเป็นลูกเจี๊ยบ แล้วโตเป็นไก่ที่ออกไข่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.life.living-things.p013
    topics: [biology.life.living-things]
    difficulty: 4
    type: mcq
    stem: "ครูให้ปลูกเมล็ดถั่วเขียวในถ้วย A และวางลูกปัดขนาดเท่าเมล็ดถั่วในถ้วย B รดน้ำทั้งสองถ้วยเท่ากันทุกวันเป็นเวลา 5 วัน ผลข้อใดเป็นหลักฐานว่าเมล็ดถั่วเขียวมีชีวิต"
    choices:
      - { id: a, text: "เมล็ดถั่วงอกรากและใบออกมา ส่วนลูกปัดเหมือนเดิม", correct: true }
      - { id: b, text: "ทั้งเมล็ดถั่วและลูกปัดเปียกน้ำ", feedback: "ทั้งสองเปียกเหมือนกัน การเปียกน้ำจึงแยกไม่ได้ว่าอะไรมีชีวิต" }
      - { id: c, text: "เมล็ดถั่วมีสีเขียว", feedback: "สีมีอยู่แล้วตั้งแต่ก่อนปลูก ไม่ได้บอกว่ามีชีวิต ต้องดูการเปลี่ยนแปลงที่เกิดขึ้น" }
      - { id: d, text: "ลูกปัดจมอยู่ก้นถ้วย", feedback: "การจมหรือลอยขึ้นกับน้ำหนัก ไม่ได้บอกว่ามีชีวิตหรือไม่" }
    hints:
      - "ลักษณะของสิ่งมีชีวิตข้อใดที่เห็นได้ใน 5 วัน"
      - "ดูว่าสิ่งใดเปลี่ยนไปเพราะโตขึ้นเอง"
    solution: "เมล็ดถั่วงอกรากและใบ แสดงว่าเจริญเติบโตได้เอง ส่วนลูกปัดที่ได้น้ำเท่ากันไม่เปลี่ยนแปลง ผลนี้เป็นหลักฐานว่าเมล็ดถั่วมีชีวิต การเทียบกับลูกปัดทำให้มั่นใจว่าการเปลี่ยนแปลงไม่ได้เกิดจากน้ำอย่างเดียว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.life.living-things.p014
    topics: [biology.life.living-things]
    difficulty: 4
    type: mcq
    stem: "พ่อเก็บเมล็ดข้าวเปลือกไว้ในกระสอบในยุ้งฉางเพื่อใช้หว่านปีหน้า เมล็ดข้าวเปลือกในกระสอบมีชีวิตหรือไม่"
    choices:
      - { id: a, text: "มีชีวิต แต่พักตัวอยู่ เมื่อได้น้ำและอากาศพอเหมาะจะงอกเป็นต้นข้าวได้", correct: true }
      - { id: b, text: "ไม่มีชีวิต เพราะไม่โตขึ้นเลยตอนอยู่ในกระสอบ", feedback: "เมล็ดพักตัวไว้รอสภาพที่เหมาะ ถ้าไม่มีชีวิต เมล็ดจะงอกเป็นต้นใหม่ไม่ได้" }
      - { id: c, text: "ไม่เคยมีชีวิตเลย เหมือนเม็ดทราย", feedback: "เมล็ดข้าวมาจากต้นข้าวที่มีชีวิต และงอกเป็นต้นใหม่ได้ จึงต่างจากเม็ดทราย" }
    hints:
      - "พ่อเก็บเมล็ดไว้ทำอะไรในปีหน้า"
      - "ถ้าเมล็ดตายแล้ว หว่านลงนาจะเกิดอะไรขึ้น"
    solution: "เมล็ดข้าวเปลือกยังมีชีวิต แต่หยุดโตชั่วคราว (พักตัว) เมื่อหว่านลงดินที่มีน้ำและอากาศพอเหมาะ เมล็ดจะงอกเป็นต้นข้าว ชาวนาจึงเก็บเมล็ดไว้ทำพันธุ์ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.life.living-things.p015
    topics: [biology.life.living-things]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "ในตู้ปลามีปลาทองจริง 1 ตัว และปลาทองของเล่นที่ว่ายน้ำได้ด้วยถ่าน 1 ตัว ข้อสังเกตใดใช้แยกได้ว่าตัวไหนเป็นสิ่งมีชีวิต (เลือกทุกข้อที่ใช้ได้)"
    choices:
      - { id: a, text: "ปลาจริงกินอาหารและตัวโตขึ้นเมื่อเวลาผ่านไป", correct: true }
      - { id: b, text: "ปลาจริงหายใจด้วยเหงือก เหงือกขยับตลอดเวลา", correct: true }
      - { id: c, text: "ปลาจริงวางไข่ที่ฟักเป็นลูกปลาได้", correct: true }
      - { id: d, text: "ปลาจริงว่ายน้ำได้", feedback: "ปลาของเล่นก็ว่ายได้ การว่ายน้ำจึงใช้แยกสองตัวนี้ไม่ได้" }
      - { id: e, text: "ปลาจริงมีสีส้ม", feedback: "ปลาของเล่นก็ทาสีส้มได้ สีไม่ใช่ลักษณะของสิ่งมีชีวิต" }
    hints:
      - "ข้อสังเกตที่ใช้ได้ต้องเป็นสิ่งที่ปลาของเล่นทำไม่ได้"
      - "ใช้ลักษณะของสิ่งมีชีวิต เช่น กิน หายใจ โต มีลูก"
    solution: "การกินอาหารและโตขึ้น การหายใจ และการวางไข่ที่ฟักเป็นลูก เป็นลักษณะของสิ่งมีชีวิตที่ปลาของเล่นทำไม่ได้ ส่วนการว่ายน้ำและสีส้ม ปลาของเล่นก็มีได้ จึงใช้แยกไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.life.living-things.p016
    topics: [biology.life.living-things]
    difficulty: 5
    type: mcq
    stem: "น้องเปรมบอกว่า \"ไฟเป็นสิ่งมีชีวิต เพราะไฟต้องใช้อากาศ ลุกลามใหญ่ขึ้นได้ และขยับไปมา\" ข้อใดอธิบายได้ถูกต้อง"
    choices:
      - { id: a, text: "ไฟไม่มีชีวิต ไฟใหญ่ขึ้นเพราะไหม้เชื้อเพลิงที่อยู่รอบ ๆ ไม่ได้โตจากภายในร่างกาย ไม่มีพ่อแม่และลูก และดับเมื่อเชื้อเพลิงหมด", correct: true }
      - { id: b, text: "ไฟมีชีวิต เพราะมีลักษณะคล้ายสิ่งมีชีวิตหลายข้อ", feedback: "ความคล้ายบางข้อไม่พอ ไฟไม่มีร่างกายที่โตขึ้นเอง ไม่ขับถ่าย และไม่มีลูกที่เหมือนพ่อแม่" }
      - { id: c, text: "ไฟไม่มีชีวิต เพราะไฟร้อน", feedback: "ความร้อนไม่ใช่เหตุผล สัตว์หลายชนิดตัวอุ่น ต้องดูลักษณะของสิ่งมีชีวิตทุกข้อ" }
      - { id: d, text: "ไฟเคยมีชีวิตแต่ตายแล้ว", feedback: "ไฟไม่เคยมีชีวิตมาก่อน ไฟเกิดจากการเผาไหม้ของเชื้อเพลิง" }
    hints:
      - "ลองถามทีละข้อ: ไฟโตขึ้นจากภายในหรือจากเชื้อเพลิงรอบตัว"
      - "ไฟมีลูกที่เหมือนตัวเองได้ไหม ไฟขับถ่ายของเสียไหม"
    solution: "ไฟดูเหมือนใช้อากาศและใหญ่ขึ้นได้ แต่ไฟใหญ่ขึ้นเพราะเผาเชื้อเพลิงรอบ ๆ ไม่ได้สร้างร่างกายเองจากอาหาร ไม่มีพ่อแม่และลูก ไม่ขับถ่าย และดับเมื่อเชื้อเพลิงหมด ไฟจึงเป็นสิ่งไม่มีชีวิต การดูลักษณะเพียงบางข้อจึงทำให้เข้าใจผิดได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

