  - id: math.logic.sets.p017
    topics: [math.logic.sets]
    difficulty: 5
    type: mcq
    stem: "เซต $\\{\\dots, -4, -2, 0, 2, 4, \\dots\\}$ เขียนแบบบอกเงื่อนไขได้ตรงกับข้อใด ($I$ คือเซตของจำนวนเต็ม)"
    choices:
      - { id: a, text: "$\\{2n \\mid n \\in I\\}$", correct: true }
      - { id: b, text: "$\\{2n \\mid n \\in I^+\\}$", feedback: "$I^+$ คือจำนวนเต็มบวก จะได้แค่ 2, 4, 6, ... ไม่มี 0 และจำนวนลบ" }
      - { id: c, text: "$\\{2n + 1 \\mid n \\in I\\}$", feedback: "$2n + 1$ ให้จำนวนคี่ เช่น 1, 3, −1" }
      - { id: d, text: "$\\{n^2 \\mid n \\in I\\}$", feedback: "$n^2$ ให้ 0, 1, 4, 9, ... ไม่มีจำนวนลบ และมีจำนวนคี่ด้วย" }
    hints:
      - "สมาชิกคือจำนวนคู่ทั้งบวก ลบ และศูนย์"
      - "จำนวนคู่ทุกตัวเขียนเป็น 2 คูณจำนวนเต็มได้"
    solution: "จำนวนคู่ทุกตัว (รวมศูนย์และจำนวนลบ) เขียนเป็น $2n$ เมื่อ $n$ เป็นจำนวนเต็ม จึงได้ $\\{2n \\mid n \\in I\\}$ ซึ่งเป็นเซตอนันต์"
