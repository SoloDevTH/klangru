    stem: "ต่อไดโอดหนึ่งตัวอนุกรมกับตัวต้านทาน แล้วต่อกับแหล่งจ่ายไฟฟ้ากระแสสลับซึ่งกลับทิศไปมา ความต่างศักย์คร่อมตัวต้านทานจะเป็นอย่างไร"
    choices:
      - { id: a, text: "มีเฉพาะครึ่งรอบที่ไดโอดได้ไบอัสตรง อีกครึ่งรอบเป็นศูนย์ กระแสจึงไหลทางเดียว", correct: true }
      - { id: b, text: "เหมือนแหล่งจ่ายทุกประการ เพราะไดโอดไม่มีผลกับไฟสลับ", feedback: "ไดโอดยอมให้กระแสผ่านเฉพาะทิศเดียว ครึ่งรอบที่กลับทิศจึงถูกตัดออก" }
      - { id: c, text: "เป็นศูนย์ตลอดเวลา เพราะไฟสลับกลับทิศ", feedback: "ในครึ่งรอบที่ทิศตรงกับไดโอด กระแสไหลได้ตามปกติ" }
    hints:
      - "ไฟฟ้ากระแสสลับมีครึ่งรอบบวกและครึ่งรอบลบ"
      - "ในแต่ละครึ่งรอบ ไดโอดได้ไบอัสตรงหรือไบอัสกลับ"
    solution: "ครึ่งรอบที่ไดโอดได้ไบอัสตรง กระแสไหลผ่านตัวต้านทาน ครึ่งรอบที่ไบอัสกลับ กระแสแทบเป็นศูนย์ ผลคือกระแสไหลทางเดียวเป็นช่วง ๆ เรียกว่าการเรียงกระแสครึ่งคลื่น ซึ่งเป็นขั้นแรกของอะแดปเตอร์แปลงไฟบ้านเป็นไฟกระแสตรง"
