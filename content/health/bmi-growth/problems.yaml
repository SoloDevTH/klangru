    solution: "BMI = น้ำหนัก ÷ 2.89: 51.7 → 17.9, 59.0 → 20.4, 68.8 → 23.8, 78.0 → 27.0, 90.2 → 31.2 จึงอยู่ช่วงต่ำกว่าเกณฑ์ ปกติ น้ำหนักเกิน อ้วนระดับ 2 และอ้วนระดับ 3 ตามลำดับ"
