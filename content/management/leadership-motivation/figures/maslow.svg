<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="sans-serif" font-size="14">
<title>ลำดับขั้นความต้องการของมาสโลว์</title>
<rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
<text x="380.0" y="26.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">ลำดับขั้นความต้องการของมาสโลว์ และตัวอย่างในที่ทำงาน</text>
<polygon points="30.0,390.0 430.0,390.0 390.0,324.0 70.0,324.0" fill="#f4e1c1" stroke="#555" stroke-width="1.5" stroke-linejoin="round"/>
<text x="230.0" y="362.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">1</text>
<text x="460.0" y="357.0" text-anchor="start" font-size="14" font-weight="bold" fill="#222">ความต้องการทางกาย</text>
<text x="460.0" y="377.0" text-anchor="start" font-size="12" fill="#444">ค่าจ้างพอใช้จ่าย เวลาพัก น้ำดื่ม</text>
<line x1="416.0" y1="357.0" x2="452.0" y2="357.0" stroke="#aaa" stroke-width="1" stroke-dasharray="3,3"/>
<polygon points="70.0,324.0 390.0,324.0 350.0,258.0 110.0,258.0" fill="#f9ecd0" stroke="#555" stroke-width="1.5" stroke-linejoin="round"/>
<text x="230.0" y="296.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">2</text>
<text x="460.0" y="291.0" text-anchor="start" font-size="14" font-weight="bold" fill="#222">ความมั่นคงปลอดภัย</text>
<text x="460.0" y="311.0" text-anchor="start" font-size="12" fill="#444">สัญญาจ้างชัดเจน ที่ทำงานปลอดภัย สวัสดิการ</text>
<line x1="376.0" y1="291.0" x2="452.0" y2="291.0" stroke="#aaa" stroke-width="1" stroke-dasharray="3,3"/>
<polygon points="110.0,258.0 350.0,258.0 310.0,192.0 150.0,192.0" fill="#e3efd9" stroke="#555" stroke-width="1.5" stroke-linejoin="round"/>
<text x="230.0" y="230.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">3</text>
<text x="460.0" y="225.0" text-anchor="start" font-size="14" font-weight="bold" fill="#222">ความรักและการยอมรับในกลุ่ม</text>
<text x="460.0" y="245.0" text-anchor="start" font-size="12" fill="#444">เพื่อนร่วมงานที่ดี ทีมที่อบอุ่น</text>
<line x1="336.0" y1="225.0" x2="452.0" y2="225.0" stroke="#aaa" stroke-width="1" stroke-dasharray="3,3"/>
<polygon points="150.0,192.0 310.0,192.0 270.0,126.0 190.0,126.0" fill="#dbe8f5" stroke="#555" stroke-width="1.5" stroke-linejoin="round"/>
<text x="230.0" y="164.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">4</text>
<text x="460.0" y="159.0" text-anchor="start" font-size="14" font-weight="bold" fill="#222">การได้รับการยกย่อง</text>
<text x="460.0" y="179.0" text-anchor="start" font-size="12" fill="#444">คำชมเชย ตำแหน่ง รางวัล</text>
<line x1="296.0" y1="159.0" x2="452.0" y2="159.0" stroke="#aaa" stroke-width="1" stroke-dasharray="3,3"/>
<polygon points="190.0,126.0 270.0,126.0 230.0,60.0 230.0,60.0" fill="#e7def3" stroke="#555" stroke-width="1.5" stroke-linejoin="round"/>
<text x="230.0" y="98.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">5</text>
<text x="460.0" y="93.0" text-anchor="start" font-size="14" font-weight="bold" fill="#222">ความสำเร็จสมหวังในชีวิต</text>
<text x="460.0" y="113.0" text-anchor="start" font-size="12" fill="#444">งานท้าทาย ได้ใช้ศักยภาพเต็มที่</text>
<line x1="256.0" y1="93.0" x2="452.0" y2="93.0" stroke="#aaa" stroke-width="1" stroke-dasharray="3,3"/>
</svg>