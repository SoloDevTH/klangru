  - id: biology.cells.cellular-respiration.p015
    topics: [biology.cells.cellular-respiration]
    difficulty: 4
    type: mcq
    stem: "จากภาพเยื่อชั้นในของไมโทคอนเดรีย ATP ซินเทสสร้าง ATP ได้เพราะอะไร"
    figure: { src: mitochondrion-etc.svg, alt: "ซ้ายคือไมโทคอนเดรียรูปรี มีเยื่อชั้นนอก เยื่อชั้นในพับเป็นคริสตี ช่องระหว่างเยื่อ และเมทริกซ์ด้านใน ขวาคือภาพขยายเยื่อชั้นใน มีโปรตีน I III IV ฝังในเยื่อ อิเล็กตรอนจาก NADH ส่งต่อจาก I ไป III ไป IV แล้วไปที่ ½O₂ + 2H⁺ เป็น H₂O โปรตีนทั้งสามปั๊ม H⁺ ขึ้นไปยังช่องระหว่างเยื่อซึ่งมี H⁺ มาก ด้านล่างคือเมทริกซ์ที่มี H⁺ น้อย ทางขวามี ATP ซินเทสที่ H⁺ ไหลกลับลงผ่าน แล้วเกิด ADP + Pi → ATP" }
    choices:
      - { id: a, text: "H⁺ ไหลจากช่องระหว่างเยื่อที่มีความเข้มข้นสูงกลับเข้าเมทริกซ์ผ่าน ATP ซินเทส พลังงานจากการไหลใช้สร้าง ATP", correct: true }
      - { id: b, text: "ออกซิเจนรวมกับ ADP โดยตรงเป็น ATP", feedback: "ออกซิเจนรับอิเล็กตรอนเป็นน้ำ ไม่ได้รวมกับ ADP" }
      - { id: c, text: "H⁺ ถูกปั๊มจากเมทริกซ์ผ่าน ATP ซินเทสออกไปช่องระหว่างเยื่อ", feedback: "โปรตีน I III IV เป็นตัวปั๊ม H⁺ ออก ส่วน ATP ซินเทสให้ H⁺ ไหลกลับเข้าเมทริกซ์" }
      - { id: d, text: "กลูโคสผ่าน ATP ซินเทสเข้าไมโทคอนเดรีย", feedback: "กลูโคสถูกสลายเป็นไพรูเวตในไซโทซอลก่อน และไม่ได้ผ่าน ATP ซินเทส" }
    hints:
      - "ดูว่าด้านใดมี H⁺ มาก ด้านใดน้อย"
      - "H⁺ ไหลผ่าน ATP ซินเทสไปทางใด"
    solution: "พลังงานจากการส่งอิเล็กตรอนใช้ปั๊ม H⁺ ไปสะสมในช่องระหว่างเยื่อ H⁺ จึงแพร่กลับเข้าเมทริกซ์ผ่าน ATP ซินเทสซึ่งเป็นช่องทางเดียว และใช้พลังงานนี้รวม ADP กับ Pi เป็น ATP (เคมิออสโมซิส)"
