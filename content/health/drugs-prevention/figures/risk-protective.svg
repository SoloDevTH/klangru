<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="sans-serif">
<title>ปัจจัยเสี่ยงและปัจจัยปกป้อง</title>
<rect x="0" y="0" width="760" height="380" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="380.0" y="28.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">ปัจจัยเสี่ยง กับ ปัจจัยปกป้อง</text>
<polygon points="380.0,270.0 350.0,330.0 410.0,330.0" fill="#ccc" stroke="#333" stroke-width="1.5"/>
<line x1="122.5" y1="233.8" x2="637.5" y2="306.2" stroke="#555" stroke-width="6"/>
<line x1="210.0" y1="246.1" x2="210.0" y2="212.1" stroke="#555" stroke-width="2"/>
<rect x="85.0" y="88.1" width="250.0" height="124.0" rx="10" fill="#fadbd8" stroke="#666" stroke-width="1.5"/>
<text x="210.0" y="110.1" font-size="14" text-anchor="middle" font-weight="bold" fill="#922b21">ปัจจัยเสี่ยง</text>
<text x="210.0" y="130.1" font-size="12" text-anchor="middle" fill="#111">อยากรู้อยากลอง</text>
<text x="210.0" y="148.1" font-size="12" text-anchor="middle" fill="#111">เพื่อนชวนหรือกดดัน</text>
<text x="210.0" y="166.1" font-size="12" text-anchor="middle" fill="#111">เครียด มีปัญหาครอบครัว</text>
<text x="210.0" y="184.1" font-size="12" text-anchor="middle" fill="#111">เข้าใจผิดว่าไม่อันตราย</text>
<text x="210.0" y="202.1" font-size="12" text-anchor="middle" fill="#111">หาซื้อง่าย สื่อทำให้ดูเท่</text>
<line x1="550.0" y1="293.9" x2="550.0" y2="259.9" stroke="#555" stroke-width="2"/>
<rect x="425.0" y="135.9" width="250.0" height="124.0" rx="10" fill="#d5f5e3" stroke="#666" stroke-width="1.5"/>
<text x="550.0" y="157.9" font-size="14" text-anchor="middle" font-weight="bold" fill="#1e8449">ปัจจัยปกป้อง</text>
<text x="550.0" y="177.9" font-size="12" text-anchor="middle" fill="#111">ครอบครัวอบอุ่น คุยกันได้</text>
<text x="550.0" y="195.9" font-size="12" text-anchor="middle" fill="#111">เพื่อนที่ดี</text>
<text x="550.0" y="213.9" font-size="12" text-anchor="middle" fill="#111">กิจกรรม กีฬา งานอดิเรก</text>
<text x="550.0" y="231.9" font-size="12" text-anchor="middle" fill="#111">รู้ข้อเท็จจริง</text>
<text x="550.0" y="249.9" font-size="12" text-anchor="middle" fill="#111">ทักษะปฏิเสธ จัดการความเครียด</text>
<text x="380.0" y="368.0" font-size="13" text-anchor="middle" fill="#333">ยิ่งมีปัจจัยปกป้องมาก ความเสี่ยงยิ่งลดลง</text>
</svg>
