problems:
  - id: biology.animals.gas-exchange.p001
    topics: [biology.animals.gas-exchange]
    difficulty: 1
    type: match
    stem: "จับคู่สัตว์กับโครงสร้างที่ใช้แลกเปลี่ยนแก๊ส"
    pairs:
      - { left: "ฟองน้ำ", right: "ผิวเซลล์ทุกเซลล์ที่สัมผัสน้ำ" }
      - { left: "ไส้เดือนดิน", right: "ผิวหนังที่ชื้นและมีหลอดเลือดฝอยมาก" }
      - { left: "แมลง", right: "ระบบท่อลม" }
      - { left: "ปลา", right: "เหงือก" }
      - { left: "นก", right: "ปอดที่ทำงานร่วมกับถุงลม" }
    hints:
      - "สัตว์ที่ตัวเล็กหรือแบนบางใช้ผิวได้เลย"
      - "แมลงมีรูเล็ก ๆ เรียงข้างลำตัว"
    solution: "ฟองน้ำใช้ผิวเซลล์ ไส้เดือนดินใช้ผิวหนังที่ชื้น แมลงใช้ระบบท่อลม ปลาใช้เหงือก และนกใช้ปอดร่วมกับถุงลม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.gas-exchange.p002
    topics: [biology.animals.gas-exchange]
    difficulty: 1
    type: text
    stem: "รูเล็ก ๆ ที่เรียงอยู่ข้างลำตัวของแมลง เป็นทางให้อากาศเข้าสู่ท่อลม เรียกว่าอะไร"
    accepted: ["ช่องหายใจ", "spiracle", "spiracles", "สไปราเคิล"]
    hints:
      - "เป็นทางเข้าของอากาศในระบบท่อลม"
      - "ชื่อภาษาไทยมีคำว่า หายใจ"
    misconceptions:
      - { match: "ท่อลม", feedback: "ท่อลมอยู่ถัดเข้าไปข้างใน ส่วนรูที่เปิดออกสู่ภายนอกมีชื่อเฉพาะ" }
      - { match: "รูจมูก", feedback: "แมลงไม่ได้หายใจทางจมูก อากาศเข้าทางรูข้างลำตัว" }
    solution: "ช่องหายใจ (spiracle) อากาศเข้าทางช่องหายใจ ผ่านท่อลมและท่อลมฝอยไปถึงเซลล์โดยตรง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.gas-exchange.p003
    topics: [biology.animals.gas-exchange]
    difficulty: 1
    type: mcq
    stem: "แก๊สออกซิเจนส่วนใหญ่ในเลือดของคนถูกลำเลียงในรูปใด"
    choices:
      - { id: a, text: "จับกับฮีโมโกลบินในเซลล์เม็ดเลือดแดง", correct: true }
      - { id: b, text: "ละลายในพลาสมา", feedback: "ออกซิเจนละลายน้ำได้น้อย ส่วนที่ละลายในพลาสมามีเพียงราวร้อยละ 2" }
      - { id: c, text: "อยู่ในรูปไบคาร์บอเนตไอออน", feedback: "ไบคาร์บอเนตไอออนเป็นรูปที่ใช้ลำเลียงคาร์บอนไดออกไซด์" }
      - { id: d, text: "จับกับเซลล์เม็ดเลือดขาว", feedback: "เซลล์เม็ดเลือดขาวทำหน้าที่ต่อต้านเชื้อโรค ไม่ได้ลำเลียงแก๊ส" }
    hints:
      - "เซลล์เม็ดเลือดแดงมีโปรตีนสีแดงที่มีธาตุเหล็ก"
      - "โปรตีนนี้หนึ่งโมเลกุลจับออกซิเจนได้ 4 โมเลกุล"
    solution: "ออกซิเจนราวร้อยละ 98 จับกับฮีโมโกลบินในเซลล์เม็ดเลือดแดง ส่วนที่เหลือละลายในพลาสมา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.gas-exchange.p004
    topics: [biology.animals.gas-exchange]
    difficulty: 2
    type: mcq
    stem: "ถ้านำไส้เดือนดินไปวางบนกระดาษแห้งกลางแดด ไม่นานไส้เดือนจะตาย เหตุผลที่เกี่ยวกับการแลกเปลี่ยนแก๊สคือข้อใด"
    choices:
      - { id: a, text: "ผิวหนังแห้ง แก๊สออกซิเจนละลายที่ผิวไม่ได้ จึงแพร่เข้าเลือดไม่ได้", correct: true }
      - { id: b, text: "แดดทำให้ปอดของไส้เดือนแห้ง", feedback: "ไส้เดือนดินไม่มีปอด ใช้ผิวหนังแลกเปลี่ยนแก๊ส" }
      - { id: c, text: "ไส้เดือนหายใจทางเหงือกที่ต้องอยู่ในน้ำ", feedback: "ไส้เดือนดินไม่มีเหงือก" }
      - { id: d, text: "กระดาษดูดออกซิเจนไปจากไส้เดือน", feedback: "กระดาษไม่ได้ดูดออกซิเจน ปัญหาคือผิวที่แห้ง" }
    hints:
      - "ไส้เดือนดินแลกเปลี่ยนแก๊สที่ส่วนใดของร่างกาย"
      - "แก๊สต้องอยู่ในสภาพใดก่อนแพร่ผ่านเยื่อของเซลล์"
    solution: "ไส้เดือนดินแลกเปลี่ยนแก๊สทางผิวหนัง แก๊สต้องละลายในความชื้นที่ผิวก่อนจึงแพร่ผ่านได้ เมื่อผิวแห้ง ออกซิเจนเข้าสู่เลือดไม่ได้ ไส้เดือนจึงตาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.gas-exchange.p005
    topics: [biology.animals.gas-exchange]
    difficulty: 2
    type: numeric
    stem: "ผู้ใหญ่คนหนึ่งมีปริมาตรอากาศหายใจปกติ 500 มิลลิลิตร ปริมาตรสำรองหายใจเข้า 3,000 มิลลิลิตร และปริมาตรสำรองหายใจออก 1,100 มิลลิลิตร ความจุปอดเป็นกี่มิลลิลิตร"
    answer: { value: 4600, unit: mL }
    hints:
      - "ความจุปอดคืออากาศที่หายใจออกได้มากที่สุดหลังหายใจเข้าเต็มที่"
      - "รวมปริมาตรปกติ สำรองหายใจเข้า และสำรองหายใจออก"
    misconceptions:
      - { match: 3500, feedback: "ลืมบวกปริมาตรสำรองหายใจออก" }
      - { match: 4100, feedback: "ลืมบวกปริมาตรอากาศหายใจปกติ" }
    solution: "ความจุปอด $= 500 + 3{,}000 + 1{,}100 = 4{,}600$ มิลลิลิตร ไม่รวมอากาศค้างในปอดที่ไล่ออกไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.gas-exchange.p006
    topics: [biology.animals.gas-exchange]
    difficulty: 2
    type: mcq
    stem: "ในแผ่นเหงือกของปลา เลือดไหลสวนทางกับน้ำ ข้อใดคือประโยชน์ของการไหลแบบนี้"
    choices:
      - { id: a, text: "น้ำมีออกซิเจนมากกว่าเลือดตลอดแผ่นเหงือก ออกซิเจนจึงแพร่เข้าเลือดได้ตลอดทาง", correct: true }
      - { id: b, text: "น้ำไหลช้าลง ปลาจึงไม่ต้องว่าย", feedback: "การไหลสวนทางไม่ได้มีไว้ลดความเร็วของน้ำ แต่รักษาความต่างของความเข้มข้น" }
      - { id: c, text: "เลือดได้ออกซิเจนครบร้อยละ 100 ของน้ำเสมอ", feedback: "เลือดได้มาก (ราวร้อยละ 80–90) แต่ไม่ถึงร้อยละ 100" }
      - { id: d, text: "ทำให้ปลาใช้พลังงานปั๊มออกซิเจนเข้าเลือด", feedback: "ออกซิเจนเข้าเลือดด้วยการแพร่ ไม่ต้องใช้พลังงานปั๊ม" }
    hints:
      - "ถ้าไหลทางเดียวกัน ความเข้มข้นของน้ำกับเลือดจะเป็นอย่างไรเมื่อถึงกลางทาง"
      - "การแพร่ต้องมีความต่างของความเข้มข้น"
    solution: "เมื่อไหลสวนทางกัน เลือดที่มีออกซิเจนเพิ่มขึ้นเรื่อย ๆ พบน้ำที่ยังมีออกซิเจนมากกว่าเสมอ ความต่างของความเข้มข้นจึงคงอยู่ตลอดแผ่นเหงือก ปลาจึงดึงออกซิเจนจากน้ำได้มาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.gas-exchange.p007
    topics: [biology.animals.gas-exchange]
    difficulty: 3
    type: numeric
    stem: "จากกราฟสไปโรมิเตอร์ของนักเรียนคนหนึ่ง ความจุปอดของนักเรียนคนนี้เป็นกี่ลิตร"
    figure: { src: p-spirogram.svg, alt: "กราฟปริมาตรอากาศในปอด (ลิตร) กับเวลา ช่วงแรกเส้นขึ้นลงเป็นคลื่นเล็กระหว่าง 2.3 กับ 2.8 ลิตร คือการหายใจปกติ จากนั้นเส้นขึ้นไปสูงสุดที่ 5.8 ลิตรเมื่อหายใจเข้าเต็มที่ แล้วลงไปต่ำสุดที่ 1.2 ลิตรเมื่อหายใจออกเต็มที่ แล้วกลับมาหายใจปกติระหว่าง 2.3 กับ 2.8 ลิตร มีเส้นประบอกระดับ 5.8 2.8 2.3 และ 1.2 ลิตร" }
    answer: { value: 4.6, tolerance: 0.05, unit: L }
    hints:
      - "ความจุปอดคือปริมาตรที่หายใจออกได้มากที่สุดหลังหายใจเข้าเต็มที่"
      - "นำระดับสูงสุดลบระดับต่ำสุดของเส้นกราฟ"
    misconceptions:
      - { match: 5.8, feedback: "5.8 ลิตรคือปริมาตรอากาศในปอดตอนหายใจเข้าเต็มที่ ซึ่งรวมอากาศค้างในปอดด้วย" }
      - { match: 3, feedback: "นี่คือปริมาตรสำรองหายใจเข้า (5.8 − 2.8) ยังไม่รวมส่วนอื่น" }
    solution: "ความจุปอด $= 5.8 - 1.2 = 4.6$ ลิตร เท่ากับปกติ 0.5 + สำรองหายใจเข้า 3.0 + สำรองหายใจออก 1.1 ลิตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.gas-exchange.p008
    topics: [biology.animals.gas-exchange]
    difficulty: 3
    type: order
    stem: "เรียงเส้นทางของอากาศหนึ่งก้อนที่ผ่านระบบหายใจของนก ซึ่งต้องใช้การหายใจเข้าออก 2 รอบ"
    items:
      - "หายใจเข้าครั้งที่ 1: อากาศผ่านหลอดลมไปเก็บในถุงลมด้านหลัง"
      - "หายใจออกครั้งที่ 1: อากาศจากถุงลมด้านหลังผ่านเข้าปอด แลกเปลี่ยนแก๊ส"
      - "หายใจเข้าครั้งที่ 2: อากาศจากปอดเข้าไปในถุงลมด้านหน้า"
      - "หายใจออกครั้งที่ 2: อากาศจากถุงลมด้านหน้าออกทางหลอดลม"
    hints:
      - "อากาศใหม่ไปที่ถุงลมด้านหลังก่อน ไม่ได้เข้าปอดทันที"
      - "ถุงลมด้านหน้ารับอากาศที่ผ่านปอดมาแล้ว"
    solution: "ถุงลมด้านหลัง → ปอด → ถุงลมด้านหน้า → ออกทางหลอดลม อากาศจึงไหลผ่านปอดทางเดียวและปอดได้อากาศใหม่ทั้งตอนหายใจเข้าและออก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.gas-exchange.p009
    topics: [biology.animals.gas-exchange]
    difficulty: 3
    type: mcq
    stem: "เลือดที่ออกจากปอดมีความดันย่อยของออกซิเจน 100 และของคาร์บอนไดออกไซด์ 40 มิลลิเมตรปรอท เมื่อไหลไปถึงกล้ามเนื้อที่มีความดันย่อยของออกซิเจน 40 และของคาร์บอนไดออกไซด์ 46 มิลลิเมตรปรอท แก๊สจะแพร่อย่างไร"
    choices:
      - { id: a, text: "ออกซิเจนแพร่จากเลือดเข้ากล้ามเนื้อ คาร์บอนไดออกไซด์แพร่จากกล้ามเนื้อเข้าเลือด", correct: true }
      - { id: b, text: "ออกซิเจนแพร่จากกล้ามเนื้อเข้าเลือด", feedback: "ออกซิเจนแพร่จากความดันย่อยสูง (100 ในเลือด) ไปต่ำ (40 ในกล้ามเนื้อ)" }
      - { id: c, text: "แก๊สทั้งสองแพร่จากเลือดเข้ากล้ามเนื้อ", feedback: "คาร์บอนไดออกไซด์ในกล้ามเนื้อ (46) สูงกว่าในเลือด (40) จึงแพร่เข้าเลือด" }
      - { id: d, text: "ไม่มีการแพร่ เพราะต้องใช้ฮีโมโกลบินดึงแก๊ส", feedback: "การเคลื่อนของแก๊สระหว่างเลือดกับเซลล์เกิดด้วยการแพร่ตามความต่างของความดันย่อย" }
    hints:
      - "แก๊สแพร่จากความดันย่อยสูงไปต่ำ"
      - "เทียบทีละแก๊ส"
    solution: "ออกซิเจน: เลือด 100 > กล้ามเนื้อ 40 จึงแพร่เข้ากล้ามเนื้อ คาร์บอนไดออกไซด์: กล้ามเนื้อ 46 > เลือด 40 จึงแพร่เข้าเลือด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.gas-exchange.p010
    topics: [biology.animals.gas-exchange]
    difficulty: 3
    type: numeric
    stem: "นักเรียนหายใจ 14 ครั้งต่อนาที ครั้งละ 500 มิลลิลิตร ปริมาตรอากาศที่หายใจเข้าต่อนาทีเป็นกี่ลิตร"
    answer: { value: 7, unit: L/min }
    hints:
      - "ปริมาตรต่อนาที = ปริมาตรต่อครั้ง × จำนวนครั้งต่อนาที"
      - "เปลี่ยนมิลลิลิตรเป็นลิตรโดยหารด้วย 1,000"
    misconceptions:
      - { match: 7000, feedback: "นี่คือคำตอบเป็นมิลลิลิตร โจทย์ถามเป็นลิตร" }
      - { match: 4.9, feedback: "นี่คืออากาศที่ถึงถุงลม (หักช่องว่างตาย) แต่โจทย์ถามอากาศที่หายใจเข้าทั้งหมด" }
    solution: "$500 \\times 14 = 7{,}000$ มิลลิลิตรต่อนาที $= 7$ ลิตรต่อนาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.gas-exchange.p011
    topics: [biology.animals.gas-exchange]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "นักเรียนซื้อปอดหมูจากตลาดมาสังเกต ข้อใดเป็นสิ่งที่น่าจะพบ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "หลอดลมคอมีกระดูกอ่อนรูปตัว C เรียงเป็นปล้อง", correct: true }
      - { id: b, text: "เนื้อปอดนุ่มคล้ายฟองน้ำและลอยน้ำได้", correct: true }
      - { id: c, text: "เมื่อเป่าลมเข้าทางหลอดลมคอ ปอดพองขึ้น", correct: true }
      - { id: d, text: "ปอดเป็นกล้ามเนื้อแข็ง หดตัวได้เอง", feedback: "ปอดไม่มีกล้ามเนื้อที่ทำให้ขยายเอง การหายใจอาศัยกะบังลมและกล้ามเนื้อยึดกระดูกซี่โครง" }
      - { id: e, text: "ปอดมีถุงลมใหญ่ไม่กี่ถุงที่เห็นได้ด้วยตาเปล่า", feedback: "ถุงลมเล็กมากและมีจำนวนมหาศาล ต้องใช้กล้องจุลทรรศน์จึงเห็น" }
    hints:
      - "ปอดมีอากาศอยู่ในถุงลมจำนวนมาก"
      - "กระดูกอ่อนมีหน้าที่ค้ำหลอดลมไม่ให้แฟบ"
    solution: "หลอดลมคอมีกระดูกอ่อนรูปตัว C ค้ำไว้ เนื้อปอดเป็นถุงลมเล็ก ๆ จำนวนมาก จึงนุ่มและลอยน้ำได้ และพองเมื่อเป่าลมเข้า ปอดไม่ใช่กล้ามเนื้อ"
