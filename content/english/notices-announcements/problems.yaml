problems:
- id: english.writing.notices-announcements.p001
  topics:
  - english.writing.notices-announcements
  difficulty: 1
  type: text
  stem: 'เติมคำบุพบท: *The book fair will be held ___ Saturday.*'
  accepted:
  - 'on'
  misconceptions:
  - match: in
    feedback: วันในสัปดาห์ใช้ on (in ใช้กับเดือนหรือปี)
  - match: at
    feedback: at ใช้กับเวลา เช่น at 9 a.m. วันใช้ on
  hints:
  - วันในสัปดาห์และวันที่ใช้คำบุพบทใด
  - on Saturday, on 21 November
  solution: '*The book fair will be held **on** Saturday.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.notices-announcements.p002
  topics:
  - english.writing.notices-announcements
  difficulty: 1
  type: mcq
  stem: จุดประสงค์หลักของ **ประกาศ (notice)** คืออะไร
  choices:
  - id: a
    text: แจ้งข้อมูลที่ผู้อ่านต้องรู้หรือต้องทำ
    correct: true
    feedback: ถูก ประกาศบอกข้อมูลให้คนอ่านรู้และลงมือทำได้
  - id: b
    text: เล่าเรื่องส่วนตัวของผู้เขียน
    feedback: เป็นจุดประสงค์ของบันทึกหรือเรื่องเล่า ไม่ใช่ประกาศ
  - id: c
    text: แต่งกลอนให้ไพเราะ
    feedback: ประกาศเน้นข้อมูลที่ชัดเจน ไม่ใช่ความไพเราะ
  - id: d
    text: โต้แย้งความเห็นของคนอื่น
    feedback: ประกาศไม่ได้มีไว้โต้แย้ง
  hints:
  - คิดถึงประกาศหน้าเสาธงหรือบนบอร์ดโรงเรียน
  - คนอ่านประกาศแล้วต้องรู้อะไร
  solution: ประกาศมีไว้ **แจ้งข้อมูลที่ผู้อ่านต้องรู้หรือต้องทำ** จึงต้องสั้น ชัด และครบ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.notices-announcements.p003
  topics:
  - english.writing.notices-announcements
  difficulty: 1
  type: mcq
  stem: ดูโปสเตอร์ งานปลูกป่าจัดที่ไหน
  figure: &id001
    src: mangrove-poster.svg
    alt: 'โปสเตอร์สมมุติ MANGROVE PLANTING DAY คำโปรย Plant a Tree, Grow a Future! When: Saturday, 5 December 2026, 7:30 – 11:00 a.m. Where: Khlong Khon Community Centre, Samut Songkhram. Bring: a hat, a water bottle and old clothes. Boat trip: adults 60 baht, children 30 baht. Free seedlings for all volunteers! Sign up: at the community centre by 28 November. ปุ่มด้านล่างเขียนว่า JOIN US!'
  choices:
  - id: a
    text: Khlong Khon Community Centre
    correct: true
    feedback: ถูก ดูบรรทัด Where
  - id: b
    text: the school library
    feedback: เป็นสถานที่ในโปสเตอร์อื่น ไม่ใช่โปสเตอร์นี้
  - id: c
    text: Bangkok
    feedback: โปสเตอร์บอกว่า Samut Songkhram
  - id: d
    text: on a boat
    feedback: เรือเป็นกิจกรรมเสริม (Boat trip) จุดนัดอยู่ที่ศูนย์ชุมชน
  hints:
  - หาบรรทัด Where
  - อ่านชื่อสถานที่ให้ครบ
  solution: งานจัดที่ ***Khlong Khon Community Centre, Samut Songkhram***
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.notices-announcements.p004
  topics:
  - english.writing.notices-announcements
  difficulty: 2
  type: text
  stem: 'เติมคำบุพบท: *The meeting will start ___ 3 p.m.*'
  accepted:
  - at
  misconceptions:
  - match: 'on'
    feedback: on ใช้กับวัน เวลาที่เป็นนาฬิกาใช้ at
  - match: in
    feedback: in ใช้กับเดือน ปี หรือช่วงของวัน (in the morning) เวลาแบบนาฬิกาใช้ at
  hints:
  - เวลาที่บอกเป็นตัวเลขบนนาฬิกา
  - at 9 a.m., at noon
  solution: '*The meeting will start **at** 3 p.m.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.notices-announcements.p005
  topics:
  - english.writing.notices-announcements
  difficulty: 2
  type: match
  stem: จับคู่ส่วนของประกาศกับตัวอย่าง
  pairs:
  - left: หัวเรื่อง
    right: NOTICE
  - left: วันที่ออกประกาศ
    right: 2 November 2026
  - left: เนื้อความ
    right: The English Camp will be held on Saturday, 21 November.
  - left: ผู้ออกประกาศ
    right: Kru Malee Srisuk, Head of the English Department
  hints:
  - ประกาศเรียงจากหัวเรื่อง → วันที่ → เนื้อความ → ผู้ออกประกาศ
  - ชื่อและตำแหน่งอยู่ท้ายประกาศ
  solution: หัวเรื่อง → NOTICE · วันที่ → 2 November 2026 · เนื้อความ → will be held ... · ผู้ออกประกาศ → ชื่อและตำแหน่ง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.notices-announcements.p006
  topics:
  - english.writing.notices-announcements
  difficulty: 2
  type: numeric
  stem: ดูโปสเตอร์ ครอบครัวที่มีผู้ใหญ่ 2 คนและเด็ก 3 คนจะนั่งเรือทั้งหมด ต้องจ่ายค่าเรือรวมกี่บาท
  figure: *id001
  answer:
    value: 210
    tolerance: 0
    unit: บาท
  misconceptions:
  - match: 300
    feedback: คิดทุกคนเป็นราคาผู้ใหญ่ เด็กจ่ายคนละ 30 บาท
  - match: 150
    feedback: คิดทุกคนเป็นราคาเด็ก ผู้ใหญ่จ่ายคนละ 60 บาท
  - match: 90
    feedback: 60 + 30 คือราคาผู้ใหญ่หนึ่งคนกับเด็กหนึ่งคน ต้องคูณจำนวนคน
  hints:
  - หาบรรทัด Boat trip
  - (ผู้ใหญ่ × 60) + (เด็ก × 30)
  solution: 2 × 60 + 3 × 30 = 120 + 90 = **210 บาท**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.notices-announcements.p007
  topics:
  - english.writing.notices-announcements
  difficulty: 3
  type: mcq
  stem: ดูโปสเตอร์ BOOK SWAP ข้อมูลสำคัญข้อใด **ขาดไป**
  figure:
    src: book-swap-poster.svg
    alt: 'โปสเตอร์ BOOK SWAP! คำโปรย Bring a book, take a book. Where: the school library. When: Friday, 13 November. Who: everyone is welcome. Cost: free. ท้ายโปสเตอร์เขียนว่า Don''t miss it!'
  choices:
  - id: a
    text: เวลาเริ่มและเลิก
    correct: true
    feedback: ถูก บอกวัน (Friday, 13 November) แต่ไม่บอกเวลา คนอ่านจึงไม่รู้ว่าต้องไปกี่โมง
  - id: b
    text: สถานที่
    feedback: 'มี Where: the school library แล้ว'
  - id: c
    text: ใครเข้าร่วมได้
    feedback: 'มี Who: everyone is welcome แล้ว'
  - id: d
    text: ค่าใช้จ่าย
    feedback: 'มี Cost: free แล้ว'
  hints:
  - ตรวจ What, When, Where, Who, Cost ทีละข้อ
  - When ต้องมีทั้งวันและเวลา
  solution: โปสเตอร์ขาด **เวลา** เช่น *from 12:00 to 1:00 p.m.*
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.notices-announcements.p008
  topics:
  - english.writing.notices-announcements
  difficulty: 3
  type: order
  stem: เรียงส่วนของอีเมลเชิญให้ถูกลำดับ
  items:
  - 'Subject: Invitation to our Loy Krathong Night'
  - Dear Ms Brown,
  - I'm writing to invite you to our school's Loy Krathong Night.
  - It will be held on Tuesday, 24 November, at 6 p.m. by the school pond.
  - I look forward to seeing you there.
  - Best wishes,
  hints:
  - Subject → คำขึ้นต้น → จุดประสงค์ → รายละเอียด → ประโยคปิด → คำลงท้าย
  - I'm writing to ... บอกจุดประสงค์ อยู่ต้นเนื้อความ
  solution: Subject → Dear Ms Brown, → I'm writing to invite you ... → It will be held ... → I look forward to ... → Best wishes,
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.notices-announcements.p009
  topics:
  - english.writing.notices-announcements
  difficulty: 3
  type: text
  stem: 'เติม is หรือ are: *All students ___ invited to the Sports Day.*'
  accepted:
  - are
  misconceptions:
  - match: is
    feedback: all students เป็นพหูพจน์ ใช้ are
  - match: be
    feedback: ต้องผัน be ให้ตรงกับประธาน
  hints:
  - ประธาน all students เอกพจน์หรือพหูพจน์
  - พหูพจน์ + are + V3
  solution: '*All students **are** invited to the Sports Day.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.notices-announcements.p010
  topics:
  - english.writing.notices-announcements
  difficulty: 3
  type: mcq
  stem: ข้อใดเป็น **call to action** ที่เหมาะกับท้ายโปสเตอร์ชวนคนมาปลูกป่า
  choices:
  - id: a
    text: Sign up today and help our coast!
    correct: true
    feedback: ถูก ชวนให้ลงมือทำทันทีและบอกเหตุผลสั้น ๆ
  - id: b
    text: Mangroves grow in salty water.
    feedback: เป็นข้อเท็จจริง ไม่ได้ชวนให้ทำอะไร
  - id: c
    text: The event was held last year.
    feedback: พูดถึงอดีต ไม่ได้ชวนให้มาร่วมงานครั้งนี้
  - id: d
    text: We planted trees.
    feedback: เป็นการเล่าเรื่องที่ผ่านมา ไม่ได้ชวนให้ลงมือ
  hints:
  - call to action = ประโยคชวนให้ลงมือทำ
  - มักขึ้นต้นด้วยกริยา เช่น Join, Sign up, Come
  solution: '***Sign up today and help our coast!***'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.notices-announcements.p011
  topics:
  - english.writing.notices-announcements
  difficulty: 3
  type: mcq
  stem: ประกาศถึง **ผู้ปกครอง** ควรใช้ประโยคใด
  choices:
  - id: a
    text: Parents are invited to attend the Open House on Friday, 4 December.
    correct: true
    feedback: ถูก ใช้ภาษาทางการและมีข้อมูลวันที่
  - id: b
    text: Hey guys! Come to our Open House!
    feedback: Hey guys ไม่ทางการเกินไปสำหรับผู้ปกครอง
  - id: c
    text: Parents come Open House Friday.
    feedback: ขาดคำและไวยากรณ์ไม่ครบ
  - id: d
    text: You must come or else!
    feedback: ฟังดูขู่และไม่สุภาพ
  hints:
  - ผู้อ่านเป็นผู้ใหญ่ ควรใช้ภาษาทางการและสุภาพ
  - are invited to ... เป็นสำนวนเชิญแบบทางการ
  solution: '***Parents are invited to attend the Open House on Friday, 4 December.***'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.notices-announcements.p012
  topics:
  - english.writing.notices-announcements
  difficulty: 4
  type: text
  stem: 'เติมคำสองคำ: *The English Camp ___ held in the school hall next Saturday.*'
  accepted:
  - will be
  - is being
  misconceptions:
  - match: will
    feedback: 'หลัง will ต้องมี be ก่อน held: will be held'
  - match: is hold
    feedback: 'ใช้ V3: held และในบริบทอนาคตควรใช้ will be'
  - match: will held
    feedback: 'ขาด be: will be held'
  - match: was been
    feedback: next Saturday เป็นอนาคต และ was been ผิดรูป
  hints:
  - งานจะจัดขึ้นในอนาคต
  - will + be + V3 = จะถูกจัด
  solution: '*The English Camp **will be** held in the school hall next Saturday.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.notices-announcements.p013
  topics:
  - english.writing.notices-announcements
  difficulty: 4
  type: mcq
  stem: ข้อใดเขียนวันเวลาถูกต้อง
  choices:
  - id: a
    text: on Saturday, 14 November, from 8 a.m. to 12 noon
    correct: true
    feedback: ถูก on + วัน · from ... to ... บอกช่วงเวลา
  - id: b
    text: in Saturday, 14 November, from 8 a.m. to 12 noon
    feedback: วันใช้ on ไม่ใช่ in
  - id: c
    text: on Saturday, 14 November, at 8 a.m. until to 12 noon
    feedback: until to ซ้อนกัน ใช้ from ... to ... หรือ from ... until ...
  - id: d
    text: at Saturday, 14 November, from 8 a.m. to 12 noon
    feedback: วันใช้ on ไม่ใช่ at
  hints:
  - on + วัน/วันที่
  - from + เวลาเริ่ม + to + เวลาเลิก
  solution: '***on Saturday, 14 November, from 8 a.m. to 12 noon***'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.notices-announcements.p014
  topics:
  - english.writing.notices-announcements
  difficulty: 4
  type: text
  stem: 'เติมคำบุพบท: *Please contact Kru Somsri ___ more information.*'
  accepted:
  - for
  misconceptions:
  - match: to
    feedback: contact ไม่ต้องมี to และ ... more information ใช้ for (เพื่อ)
  - match: of
    feedback: เพื่อขอข้อมูลเพิ่มเติม ใช้ for more information
  hints:
  - ติดต่อ เพื่อ ขอข้อมูลเพิ่มเติม
  - สำนวน ___ more information
  solution: '*Please contact Kru Somsri **for** more information.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.notices-announcements.p015
  topics:
  - english.writing.notices-announcements
  difficulty: 4
  type: mcq
  stem: ข้อใด **เหมาะ** ใส่ในประกาศของโรงเรียน (เลือกทุกข้อที่เหมาะ)
  multiple: true
  choices:
  - id: a
    text: Please register with the school office by 20 November.
    correct: true
    feedback: เหมาะ บอกวิธีสมัครและกำหนดเวลา
  - id: b
    text: For more information, contact the English Department.
    correct: true
    feedback: เหมาะ บอกช่องทางติดต่อของโรงเรียน
  - id: c
    text: Call Ploy on her mobile phone at night.
    feedback: ไม่เหมาะ เป็นข้อมูลส่วนตัวของนักเรียน และไม่ใช่ช่องทางทางการ
  - id: d
    text: I think this camp is the best camp in the world!!!
    feedback: ไม่เหมาะ เป็นความเห็นส่วนตัวที่เกินจริง ประกาศควรให้ข้อมูล
  hints:
  - ประกาศควรมีข้อมูลที่ทำตามได้และช่องทางติดต่อทางการ
  - ระวังข้อมูลส่วนตัวและความเห็นเกินจริง
  solution: ประโยคที่เหมาะคือวิธีสมัคร (register ... by 20 November) และช่องทางติดต่อของโรงเรียน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.notices-announcements.p016
  topics:
  - english.writing.notices-announcements
  difficulty: 5
  type: order
  stem: เรียงข้อความให้เป็นประกาศที่สมบูรณ์
  items:
  - NOTICE
  - 10 November 2026
  - We are pleased to announce that the school charity fun run will be held on Saturday, 28 November.
  - The run starts at 7 a.m. at the school gate and finishes at Nong Prajak Park.
  - All money raised will go to the local hospital.
  - Students who want to join must register with their class teacher by 20 November.
  - Mr Anan Wongsa, Head of Student Affairs
  hints:
  - หัวเรื่องและวันที่อยู่บน ผู้ออกประกาศอยู่ล่างสุด
  - 'เนื้อความ: ประกาศงาน → เวลาและสถานที่ → จุดประสงค์ → วิธีสมัคร'
  solution: NOTICE → วันที่ → ประกาศงาน (will be held on ...) → รายละเอียดเวลาและเส้นทาง → เงินไปที่ไหน → วิธีสมัคร → ผู้ออกประกาศ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.notices-announcements.p017
  topics:
  - english.writing.notices-announcements
  difficulty: 5
  type: mcq
  stem: หลังงานลอยกระทงของชุมชน ข้อใดเป็น **ข่าวประชาสัมพันธ์สั้น** ที่ดีที่สุดสำหรับเว็บไซต์ของชุมชน
  choices:
  - id: a
    text: More than 200 people joined the Loy Krathong Night at Ban Rim Khlong on 24 November. Visitors made krathongs from banana leaves, watched a Thai dance show and tried local desserts. The community thanks all the volunteers who helped.
    correct: true
    feedback: ถูก ใช้ past simple ข้อมูลสำคัญ (ใคร อะไร ที่ไหน เมื่อไร) อยู่ประโยคแรก และมีรายละเอียดกับคำขอบคุณ
  - id: b
    text: More than 200 people will join the Loy Krathong Night at Ban Rim Khlong on 24 November.
    feedback: งานจบแล้ว ใช้ will ไม่ได้ ต้องเป็น joined
  - id: c
    text: Loy Krathong Night was fun. I ate a lot. My krathong was the most beautiful.
    feedback: เป็นบันทึกส่วนตัว ไม่ใช่ข่าวประชาสัมพันธ์ของชุมชน และขาดข้อมูลวันที่และสถานที่
  - id: d
    text: More than 200 people joins the Loy Krathong Night at Ban Rim Khlong. Visitors make krathongs from banana leaves.
    feedback: 'เหตุการณ์ที่จบแล้วต้องใช้ past simple: joined, made'
  hints:
  - ข่าวหลังจบงานใช้ past simple
  - ประโยคแรกต้องตอบใคร อะไร ที่ไหน เมื่อไร
  solution: 'ข้อแรกดีที่สุด: ใช้ past simple ประโยคแรกตอบ 4W ครบ ตามด้วยรายละเอียดกิจกรรมและคำขอบคุณ'
