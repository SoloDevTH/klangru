<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="sans-serif" font-size="14">
<title>มุมห่างและตำแหน่งของดาวเคราะห์</title>
<rect x="0" y="0" width="900" height="540" fill="#ffffff"/>
<circle cx="450.0" cy="285.0" r="16.0" fill="#facc15" stroke="#b45309" stroke-width="1.5"/>
<text x="450.0" y="290.0" text-anchor="middle" font-size="10" fill="#222">ดวงอาทิตย์</text>
<circle cx="450.0" cy="285.0" r="85.3" fill="none" stroke="#a16207" stroke-width="1.3"/>
<circle cx="450.0" cy="285.0" r="118.0" fill="none" stroke="#2563eb" stroke-width="1.3"/>
<circle cx="450.0" cy="285.0" r="179.8" fill="none" stroke="#dc2626" stroke-width="1.3"/>
<circle cx="450.0" cy="403.0" r="8.0" fill="#2563eb" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="462.0" y="421.0" text-anchor="start" font-size="12" fill="#1e3a8a" font-weight="bold">โลก</text>
<line x1="450.0" y1="403.0" x2="391.1" y2="346.7" stroke="#a16207" stroke-width="1.5"/>
<circle cx="391.1" cy="346.7" r="6.0" fill="#a16207" stroke="#713f12" stroke-width="1.5"/>
<text x="379.1" y="332.7" text-anchor="end" font-size="11" fill="#713f12" font-weight="bold">ดาวศุกร์ มุมห่างมากที่สุดทางตะวันออก</text>
<text x="379.1" y="348.7" text-anchor="end" font-size="11" fill="#713f12">ดาวประจำเมือง เห็นหัวค่ำ</text>
<line x1="450.0" y1="403.0" x2="508.9" y2="346.7" stroke="#a16207" stroke-width="1.5"/>
<circle cx="508.9" cy="346.7" r="6.0" fill="#a16207" stroke="#713f12" stroke-width="1.5"/>
<text x="520.9" y="332.7" text-anchor="start" font-size="11" fill="#713f12" font-weight="bold">ดาวศุกร์ มุมห่างมากที่สุดทางตะวันตก</text>
<text x="520.9" y="348.7" text-anchor="start" font-size="11" fill="#713f12">ดาวประกายพรึก เห็นรุ่งเช้า</text>
<line x1="450.0" y1="403.0" x2="450.0" y2="285.0" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3"/>
<polyline points="450.0,363.0 448.4,363.0 446.8,363.1 445.2,363.3 443.6,363.5 442.0,363.8 440.4,364.2 438.8,364.6 437.3,365.1 435.8,365.6 434.3,366.2 432.8,366.9 431.4,367.6 429.9,368.4 428.6,369.2 427.2,370.1 425.9,371.1 424.6,372.1 423.4,373.1 422.2,374.2 421.1,375.4" fill="none" stroke="#a16207" stroke-width="1.5"/>
<text x="416.0" y="359.0" text-anchor="middle" font-size="12" fill="#713f12" font-weight="bold">46°</text>
<circle cx="450.0" cy="370.3" r="5.0" fill="#a16207" stroke="#713f12" stroke-width="1.5"/>
<text x="460.0" y="386.3" text-anchor="start" font-size="10" fill="#713f12">ร่วมทิศแนววงใน</text>
<circle cx="450.0" cy="199.7" r="5.0" fill="#a16207" stroke="#713f12" stroke-width="1.5"/>
<text x="460.0" y="193.7" text-anchor="start" font-size="10" fill="#713f12">ร่วมทิศแนววงนอก</text>
<circle cx="450.0" cy="464.8" r="7.0" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5"/>
<text x="450.0" y="486.8" text-anchor="middle" font-size="11" fill="#7f1d1d" font-weight="bold">ดาวอังคารตำแหน่งตรงข้าม (มุมห่าง 180°)</text>
<circle cx="450.0" cy="105.2" r="7.0" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5"/>
<text x="450.0" y="93.2" text-anchor="middle" font-size="11" fill="#7f1d1d" font-weight="bold">ดาวอังคารร่วมทิศ (มุมห่าง 0°)</text>
<line x1="450.0" y1="403.0" x2="585.7" y2="403.0" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/>
