  - id: earthscience.atmosphere.global-circulation.p014
    topics: [earthscience.atmosphere.global-circulation]
    difficulty: 4
    type: mcq
    stem: "ในเซลล์เฟอร์เรล อากาศที่ผิวโลกระหว่างละติจูด 30° กับ 60° เหนือ ไหลไปทางขั้วโลก ทำไมลมประจำที่ผิวโลกบริเวณนี้จึงเป็นลมตะวันตก"
    choices:
      - { id: a, text: "แรงคอริออลิสเบนอากาศที่ไหลไปทางเหนือไปทางขวา คือไปทางทิศตะวันออก ลมจึงพัดมาจากทิศตะวันตก", correct: true }
      - { id: b, text: "ดวงอาทิตย์ขึ้นทางทิศตะวันออก จึงดันอากาศไปทางตะวันตก", feedback: "ทิศขึ้นของดวงอาทิตย์ไม่ได้ผลักอากาศ ทิศลมเกิดจากแรงเกรเดียนต์และแรงคอริออลิส" }
      - { id: c, text: "อากาศไหลไปทางทิศตะวันตก จึงเรียกว่าลมตะวันตก", feedback: "ชื่อลมบอกทิศที่ลมพัดมา ลมตะวันตกพัดจากตะวันตกไปตะวันออก" }
      - { id: d, text: "แรงคอริออลิสเบนลมไปทางซ้ายในซีกโลกเหนือ", feedback: "ในซีกโลกเหนือเบนไปทางขวา" }
    hints:
