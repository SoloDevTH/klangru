<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="sans-serif">
<title>มารยาทในการอ่าน การเขียน การฟัง การดู และการพูด</title>
<rect x="0" y="0" width="800" height="330" fill="#fff"/>
<rect x="12.0" y="15.0" width="148.0" height="300.0" rx="12" fill="#fff" stroke="#1f5fbf" stroke-width="3"/>
<rect x="12.0" y="15.0" width="148.0" height="48.0" rx="12" fill="#1f5fbf" stroke="#1f5fbf" stroke-width="3"/>
<rect x="12.0" y="45.0" width="148.0" height="18.0" rx="0" fill="#1f5fbf" stroke="none" stroke-width="0"/>
<text x="86.0" y="48.0" font-size="21" text-anchor="middle" fill="#fff" font-weight="bold">การอ่าน</text>
<text x="86.0" y="100.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">ไม่ส่งเสียงดัง</text>
<text x="86.0" y="158.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">ไม่แอบอ่าน</text>
<text x="86.0" y="178.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">ของผู้อื่น</text>
<text x="86.0" y="216.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">ถนอมหนังสือ</text>
<text x="86.0" y="274.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">ไม่พับมุม</text>
<text x="86.0" y="294.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">ไม่ขีดเขียน</text>
<rect x="170.0" y="15.0" width="148.0" height="300.0" rx="12" fill="#fff" stroke="#1e8449" stroke-width="3"/>
<rect x="170.0" y="15.0" width="148.0" height="48.0" rx="12" fill="#1e8449" stroke="#1e8449" stroke-width="3"/>
<rect x="170.0" y="45.0" width="148.0" height="18.0" rx="0" fill="#1e8449" stroke="none" stroke-width="0"/>
<text x="244.0" y="48.0" font-size="21" text-anchor="middle" fill="#fff" font-weight="bold">การเขียน</text>
<text x="244.0" y="100.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">เขียนให้อ่านง่าย</text>
<text x="244.0" y="158.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">ใช้คำสุภาพ</text>
<text x="244.0" y="216.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">ไม่ลอกงานผู้อื่น</text>
<text x="244.0" y="274.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">บอกแหล่งที่มา</text>
<rect x="328.0" y="15.0" width="148.0" height="300.0" rx="12" fill="#fff" stroke="#b9770e" stroke-width="3"/>
<rect x="328.0" y="15.0" width="148.0" height="48.0" rx="12" fill="#b9770e" stroke="#b9770e" stroke-width="3"/>
<rect x="328.0" y="45.0" width="148.0" height="18.0" rx="0" fill="#b9770e" stroke="none" stroke-width="0"/>
<text x="402.0" y="48.0" font-size="21" text-anchor="middle" fill="#fff" font-weight="bold">การฟัง</text>
<text x="402.0" y="100.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">มองผู้พูด</text>
<text x="402.0" y="158.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">ไม่พูดแทรก</text>
<text x="402.0" y="216.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">ไม่คุยกัน</text>
<text x="402.0" y="274.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">ถามเมื่อพูดจบ</text>
<rect x="486.0" y="15.0" width="148.0" height="300.0" rx="12" fill="#fff" stroke="#7d3c98" stroke-width="3"/>
<rect x="486.0" y="15.0" width="148.0" height="48.0" rx="12" fill="#7d3c98" stroke="#7d3c98" stroke-width="3"/>
<rect x="486.0" y="45.0" width="148.0" height="18.0" rx="0" fill="#7d3c98" stroke="none" stroke-width="0"/>
<text x="560.0" y="48.0" font-size="21" text-anchor="middle" fill="#fff" font-weight="bold">การดู</text>
<text x="560.0" y="100.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">นั่งเรียบร้อย</text>
<text x="560.0" y="158.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">ไม่บังผู้อื่น</text>
<text x="560.0" y="216.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">ปิดเสียงโทรศัพท์</text>
<text x="560.0" y="274.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">ไม่ถ่ายภาพ</text>
<text x="560.0" y="294.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">ในที่ที่ห้ามถ่าย</text>
<rect x="644.0" y="15.0" width="148.0" height="300.0" rx="12" fill="#fff" stroke="#c0392b" stroke-width="3"/>
<rect x="644.0" y="15.0" width="148.0" height="48.0" rx="12" fill="#c0392b" stroke="#c0392b" stroke-width="3"/>
<rect x="644.0" y="45.0" width="148.0" height="18.0" rx="0" fill="#c0392b" stroke="none" stroke-width="0"/>
<text x="718.0" y="48.0" font-size="21" text-anchor="middle" fill="#fff" font-weight="bold">การพูด</text>
<text x="718.0" y="100.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">ใช้คำสุภาพ</text>
<text x="718.0" y="120.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">ครับ ค่ะ</text>
<text x="718.0" y="158.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">เสียงดังพอดี</text>
<text x="718.0" y="216.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">ไม่พูดล้อเลียน</text>
<text x="718.0" y="274.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">ไม่พูดขณะ</text>
<text x="718.0" y="294.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">มีอาหารในปาก</text>
</svg>
