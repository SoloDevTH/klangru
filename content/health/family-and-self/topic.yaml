id: health.family.family-and-self
subject: health
title: { th: ครอบครัว บทบาทหน้าที่ และการเห็นคุณค่าในตนเอง, en: "Family, roles and self-esteem" }
summary: สมาชิกในครอบครัวและคำเรียกญาติ ครอบครัวหลายรูปแบบ บทบาทหน้าที่ของแต่ละคน ความแตกต่างของครอบครัว ครอบครัวที่อบอุ่นแบบไทย และการภูมิใจในตนเอง
difficulty: 1
minutes: 25
prerequisites: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ครอบครัวหลายรูปแบบ
    src: family-forms.svg
    alt: "ภาพสี่ช่อง ช่องที่ 1 ครอบครัวเดี่ยว มีพ่อ แม่ และลูกสองคน ช่องที่ 2 ครอบครัวขยาย มีย่า ปู่ พ่อ แม่ อา และลูก ช่องที่ 3 ครอบครัวพ่อหรือแม่เลี้ยงเดี่ยว มีแม่และลูกสองคน ช่องที่ 4 ครอบครัวที่ญาติเลี้ยงดู มีตา ยาย และหลาน ใต้ภาพเขียนว่า ทุกแบบเป็นครอบครัวได้ สิ่งสำคัญคือความรัก ความห่วงใย และการช่วยเหลือกัน"
    caption: "รูปแบบครอบครัวต่างกัน แต่ทุกแบบให้ความรักและดูแลกันได้"
  - type: worked-example
    title: ไล่คำเรียกญาติจากแผนผัง
    problem: "จากแผนผังครอบครัวของต้นข้าว ประเสริฐเป็นอะไรกับต้นข้าว"
    figure:
      src: family-tree.svg
      alt: "แผนผังครอบครัวสามรุ่น รุ่นบนซ้าย: สมศักดิ์ (ชาย) แต่งงานกับบุญมี (หญิง) มีลูกสองคนคือ วิชัย (ชาย พี่ของพ่อ) และธนา (ชาย เป็นพ่อ) รุ่นบนขวา: ประเสริฐ (ชาย) แต่งงานกับจันทร์ (หญิง) มีลูกสองคนคือ มาลี (หญิง เป็นแม่) และสุดา (หญิง น้องของแม่) ธนาแต่งงานกับมาลี มีลูกสองคนคือ ต้นข้าว (หญิง ตัวเรา) และภูผา (ชาย น้องของต้นข้าว)"
    steps:
      - text: "หาต้นข้าวในแผนผัง แล้วไล่เส้นขึ้นไปหาพ่อแม่: พ่อคือธนา แม่คือมาลี"
      - text: "ไล่เส้นจากมาลีขึ้นไป พบว่าพ่อแม่ของมาลีคือประเสริฐกับจันทร์"
      - text: "ประเสริฐเป็นผู้ชาย และเป็นพ่อของแม่"
        why: "คำเรียกญาติไทยแยกญาติทางพ่อกับทางแม่ จึงต้องรู้ว่าเป็นพ่อของใคร"
      - text: "พ่อของแม่เรียกว่า ตา"
    answer: "ประเสริฐเป็นตาของต้นข้าว"
  - { type: check, problem: health.family.family-and-self.p004, prompt: "ลองใช้วิธีเดียวกันกับวิชัย" }
  - type: worked-example
    title: บอกจุดเด่นและจุดด้อยของตัวเอง
    problem: "พลอยเล่าว่า \"หนูวิ่งเร็วที่สุดในห้อง ชอบช่วยแม่รดน้ำต้นไม้ แต่ยังเขียนลายมือไม่สวย และชอบลืมของ\" ช่วยพลอยแยกจุดเด่น จุดด้อย และสิ่งที่ควรภูมิใจ"
    steps:
      - text: "จุดเด่น (สิ่งที่ทำได้ดี): วิ่งเร็ว ช่วยแม่รดน้ำต้นไม้"
      - text: "จุดด้อย (สิ่งที่ยังต้องฝึก): ลายมือ และการลืมของ"
        why: "จุดด้อยไม่ใช่ข้อเสียถาวร ฝึกให้ดีขึ้นได้"
      - text: "หาวิธีพัฒนาจุดด้อย เช่น คัดลายมือวันละหน้า จัดกระเป๋าตามตารางเรียนก่อนนอน"
      - text: "สิ่งที่ภูมิใจได้: ทั้งความสามารถในการวิ่ง และการช่วยงานบ้าน ซึ่งเป็นการทำหน้าที่ในครอบครัว"
    answer: "จุดเด่น: วิ่งเร็ว ช่วยงานบ้าน จุดด้อย: ลายมือ ลืมของ ภูมิใจได้ในความสามารถและการช่วยเหลือครอบครัว"
  - { type: check, problem: health.family.family-and-self.p009 }
glossary:
  - { term: ครอบครัว, definition: "กลุ่มคนที่อยู่ด้วยกัน ดูแลกัน และผูกพันกัน เช่น พ่อ แม่ ลูก หรือญาติที่เลี้ยงดูกัน" }
  - { term: ครอบครัวเดี่ยว, definition: "ครอบครัวที่มีพ่อ แม่ และลูก" }
  - { term: ครอบครัวขยาย, definition: "ครอบครัวที่มีปู่ย่าตายายหรือญาติคนอื่นอยู่ด้วยกันกับพ่อแม่และลูก" }
  - { term: บทบาทหน้าที่, definition: "สิ่งที่สมาชิกแต่ละคนควรทำเพื่อตนเองและครอบครัว" }
  - { term: จุดเด่น จุดด้อย, definition: "จุดเด่นคือสิ่งที่ทำได้ดี จุดด้อยคือสิ่งที่ยังต้องฝึกให้ดีขึ้น" }
  - { term: การเห็นคุณค่าในตนเอง, definition: "การรู้จักและยอมรับตัวเอง ภูมิใจในความสามารถและความพยายามของตน โดยไม่ดูถูกตัวเองหรือคนอื่น" }
flashcards:
  - { front: "ปู่ ย่า ตา ยาย ต่างกันอย่างไร", back: "ปู่ ย่า คือพ่อและแม่ของพ่อ ตา ยาย คือพ่อและแม่ของแม่" }
  - { front: "อา กับ น้า ต่างกันอย่างไร", back: "อาคือน้องของพ่อ น้าคือน้องของแม่ (พี่ของพ่อหรือแม่คือ ลุง หรือ ป้า)" }
  - { front: "ครอบครัวมีกี่รูปแบบ", back: "มีหลายแบบ เช่น ครอบครัวเดี่ยว ครอบครัวขยาย ครอบครัวพ่อหรือแม่เลี้ยงเดี่ยว ครอบครัวที่ญาติเลี้ยงดู ทุกแบบเป็นครอบครัวจริง" }
  - { front: "ครอบครัวที่อบอุ่นแบบไทยมีลักษณะอย่างไร", back: "รักและช่วยเหลือกัน พูดคุยกัน เคารพผู้ใหญ่ นับถือญาติ ทำกิจกรรมร่วมกัน และให้อภัยกัน" }
  - { front: "ถ้าไม่ปลอดภัยที่บ้านควรทำอย่างไร", back: "บอกผู้ใหญ่ที่ไว้ใจ เช่น ครู หรือโทร 1300 ศูนย์ช่วยเหลือสังคม ถ้าบาดเจ็บโทร 1669" }
