    stem: "นักเรียนปล่อยรถทดลองบนรางลม (แทบไม่มีแรงเสียดทาน) ที่เอียงมุมต่าง ๆ แล้ววัดความเร่ง ได้ผลดังกราฟ: มุม $10^\\circ$ ได้ $1.69$, มุม $20^\\circ$ ได้ $3.36$, มุม $30^\\circ$ ได้ $4.88$ และมุม $40^\\circ$ ได้ $6.31\\ \\mathrm{m/s^2}$ ถ้าเขียนกราฟความเร่ง $a$ กับ $\\sin\\theta$ เส้นตรงที่ผ่านจุดเหล่านี้มีความชันประมาณเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s² ทศนิยม 1 ตำแหน่ง)"
    figure: { src: incline-data.svg, alt: "กราฟกระจาย แกนนอนคือ sin θ ตั้งแต่ 0 ถึง 0.7 แกนตั้งคือความเร่ง a ตั้งแต่ 0 ถึง 7 m/s² มีจุดข้อมูลสี่จุดสำหรับมุม 10°, 20°, 30° และ 40° ที่ sin θ ประมาณ 0.17, 0.34, 0.50 และ 0.64 ความเร่ง 1.69, 3.36, 4.88 และ 6.31 m/s² ตามลำดับ จุดเรียงเกือบเป็นเส้นตรงที่ชี้กลับไปหาจุดกำเนิด" }
    answer: { value: 9.8, tolerance: 0.2, unit: m/s² }
    hints:
      - "แปลงมุมแต่ละค่าเป็น $\\sin\\theta$ ก่อน แล้วจึงหาความชัน"
      - "ความชัน $= \\dfrac{\\Delta a}{\\Delta(\\sin\\theta)}$ เลือกจุดแรกและจุดสุดท้ายซึ่งห่างกันที่สุด"
      - "ทฤษฎีทำนายว่า $a = g\\sin\\theta$ ความชันจึงควรใกล้ค่าอะไร"
    misconceptions:
      - { match: 0.154, feedback: "นั่นคือความชันของ $a$ กับมุมเป็นองศา ($\\tfrac{6.31 - 1.69}{40 - 10}$) โจทย์ให้เขียนกับ $\\sin\\theta$ ต้องแปลงมุมเป็นค่า sin ก่อน" }
      - { match: 0.102, feedback: "ดูเหมือนกลับเศษกับส่วน ความชันคือ $\\Delta a$ หารด้วย $\\Delta(\\sin\\theta)$ (แกนตั้งหารแกนนอน)" }
    solution: "$\\sin 10^\\circ \\approx 0.174$ และ $\\sin 40^\\circ \\approx 0.643$ ความชัน $\\approx \\dfrac{6.31 - 1.69}{0.643 - 0.174} = \\dfrac{4.62}{0.469} \\approx 9.8\\ \\mathrm{m/s^2}$ (เส้นที่ลากให้ผ่านทุกจุดได้ประมาณ $9.8$ เช่นกัน) เส้นผ่านจุดกำเนิดและความชันเท่ากับ $g$ เป็นหลักฐานว่า $a = g\\sin\\theta$ ตามกฎข้อที่ 2"
