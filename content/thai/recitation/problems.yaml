problems:
- id: thai.literature.recitation.p001
  topics:
  - thai.literature.recitation
  difficulty: 1
  type: mcq
  stem: คำว่า **อาขยาน** หมายถึงอะไร
  choices:
  - id: a
    text: บทท่องจำ
    correct: true
    feedback: ถูก บทอาขยานคือบทร้อยกรองที่ท่องจำ
  - id: b
    text: นิทานพื้นบ้าน
    feedback: นิทานเป็นร้อยแก้วที่เล่าต่อกันมา
  - id: c
    text: เพลงชาติ
    feedback: เพลงชาติเป็นบทเพลง ไม่ใช่ความหมายของอาขยาน
  - id: d
    text: การแต่งกลอน
    feedback: อาขยานคือบทที่ท่อง ไม่ใช่การแต่ง
  hints:
  - เวลาครูให้ท่องอาขยาน เราทำอะไร
  - คิดถึงคำว่า ท่อง
  solution: อาขยาน แปลว่า **บทท่องจำ**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.recitation.p002
  topics:
  - thai.literature.recitation
  difficulty: 1
  type: text
  stem: 'เติมคำที่หายไป: "ถึงบางพูดพูดดีเป็นศรี___" (สุนทรภู่ นิราศภูเขาทอง)'
  accepted:
  - ศักดิ์
  misconceptions:
  - match: ศักด์
    feedback: ศักดิ์ มีสระอิอยู่ใต้การันต์ เขียนว่า ศักดิ์
  - match: สัก
    feedback: ในบทกลอนเขียนว่า ศักดิ์ ซึ่งแปลว่า เกียรติ
  hints:
  - ศรี___ เป็นคำที่แปลว่ามงคลและเกียรติ
  - คำนี้สัมผัสกับ รัก ในวรรคถัดไป
  solution: '**ศรีศักดิ์** สัมผัสกับ รัก ในวรรค "มีคนรักรสถ้อยอร่อยจิต"'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.recitation.p003
  topics:
  - thai.literature.recitation
  difficulty: 1
  type: mcq
  stem: '**นิราศภูเขาทอง** เป็นผลงานของกวีท่านใด'
  choices:
  - id: a
    text: สุนทรภู่
    correct: true
    feedback: ถูก
  - id: b
    text: ศรีปราชญ์
    feedback: ศรีปราชญ์เป็นกวีสมัยอยุธยา ไม่ได้แต่งเรื่องนี้
  - id: c
    text: เจ้าฟ้าธรรมธิเบศร
    feedback: ทรงพระนิพนธ์กาพย์เห่เรือ ไม่ใช่นิราศภูเขาทอง
  - id: d
    text: ไม่ทราบผู้แต่ง
    feedback: เรื่องนี้รู้ชื่อผู้แต่ง
  hints:
  - กวีท่านนี้แต่งพระอภัยมณีและกาพย์พระไชยสุริยาด้วย
  - ดูที่มาในบทเรียน
  solution: นิราศภูเขาทอง แต่งโดย **สุนทรภู่**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.recitation.p004
  topics:
  - thai.literature.recitation
  difficulty: 2
  type: order
  stem: เรียงวรรคให้ถูกตามบทที่ท่อง (สุนทรภู่ นิราศภูเขาทอง)
  items:
  - ถึงบางพูดพูดดีเป็นศรีศักดิ์
  - มีคนรักรสถ้อยอร่อยจิต
  - แม้นพูดชั่วตัวตายทำลายมิตร
  - จะชอบผิดในมนุษย์เพราะพูดจา
  hints:
  - วรรคแรกบอกชื่อสถานที่ที่ผ่าน
  - 'ใช้สัมผัส: ศักดิ์–รัก · จิต–มิตร · มิตร–ผิด'
  solution: ถึงบางพูด... → มีคนรัก... → แม้นพูดชั่ว... → จะชอบผิด...
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.recitation.p005
  topics:
  - thai.literature.recitation
  difficulty: 2
  type: text
  stem: 'เติมคำท้ายวรรคที่หายไป: "แม้นพูดชั่วตัวตายทำลาย___"'
  accepted:
  - มิตร
  misconceptions:
  - match: มิตร์
    feedback: มิตร ไม่มีการันต์
  - match: มิด
    feedback: ในบทกลอนเขียน มิตร ที่แปลว่าเพื่อน
  - match: เพื่อน
    feedback: ความหมายเดียวกันแต่ไม่สัมผัสกับ จิต และไม่ตรงกับต้นฉบับ
  hints:
  - คำนี้ต้องสัมผัสกับ จิต ท้ายวรรคก่อน
  - คำนี้แปลว่า เพื่อน
  solution: '**มิตร** สัมผัสกับ จิต และ ผิด'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.recitation.p006
  topics:
  - thai.literature.recitation
  difficulty: 2
  type: mcq
  stem: วิธีใดช่วยให้ **จำบทอาขยานได้นาน** ที่สุด
  choices:
  - id: a
    text: อ่านให้เข้าใจความหมาย แล้วท่องทีละวรรคซ้ำหลายวัน
    correct: true
    feedback: ถูก เข้าใจแล้วจำง่าย และท่องซ้ำหลายวันทำให้จำได้นาน
  - id: b
    text: ท่องรวดเดียวสามชั่วโมงก่อนสอบ
    feedback: จำได้ช่วงสั้น ๆ แล้วลืมเร็ว
  - id: c
    text: ท่องเร็ว ๆ โดยไม่ต้องรู้ความหมาย
    feedback: ท่องแบบนกแก้ว จำผิดง่ายและลืมเร็ว
  - id: d
    text: ฟังเพื่อนท่องอย่างเดียว ไม่ท่องเอง
    feedback: ต้องลองท่องเองจึงรู้ว่าจำได้หรือไม่
  hints:
  - ความเข้าใจช่วยความจำ
  - ท่องครั้งเดียวนาน ๆ กับท่องซ้ำหลายวัน แบบใดดีกว่า
  solution: '**อ่านให้เข้าใจ แล้วท่องทีละวรรคซ้ำหลายวัน**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.recitation.p007
  topics:
  - thai.literature.recitation
  difficulty: 2
  type: match
  stem: จับคู่คำในบท "ถึงบางพูด" กับความหมาย
  pairs:
  - left: แม้น
    right: ถ้า
  - left: มิตร
    right: เพื่อน
  - left: ศรี
    right: มิ่งมงคล ความงาม
  - left: รสถ้อย
    right: ความไพเราะของคำพูด
  hints:
  - แม้น ใช้เหมือน แม้ หรือ ถ้า
  - รส ในที่นี้ไม่ใช่รสอาหาร
  solution: แม้น = ถ้า · มิตร = เพื่อน · ศรี = มิ่งมงคล · รสถ้อย = ความไพเราะของคำพูด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.recitation.p008
  topics:
  - thai.literature.recitation
  difficulty: 3
  type: mcq
  stem: บทกลอน "ถึงบางพูดพูดดีเป็นศรีศักดิ์ · มีคนรักรสถ้อยอร่อยจิต / แม้นพูดชั่วตัวตายทำลายมิตร · จะชอบผิดในมนุษย์เพราะพูดจา" (สุนทรภู่ นิราศภูเขาทอง) ให้ข้อคิดเรื่องใด
  choices:
  - id: a
    text: คำพูดทำให้คนรักหรือเกลียดได้ จึงควรพูดดี
    correct: true
    feedback: ถูก
  - id: b
    text: ควรไปเที่ยวบางพูด
    feedback: บางพูดเป็นเพียงสถานที่ที่ผ่าน กวีใช้ชื่อมาเล่นคำ
  - id: c
    text: ควรพูดน้อยที่สุด
    feedback: บทกลอนไม่ได้บอกให้พูดน้อย แต่ให้พูดดี
  - id: d
    text: ควรเลือกคบเพื่อนที่รวย
    feedback: ไม่มีข้อความเรื่องฐานะ
  hints:
  - วรรคแรกกับวรรคที่สามพูดถึงการพูดสองแบบ
  - ผลของการพูดดีและพูดชั่วต่างกันอย่างไร
  solution: ข้อคิดคือ **คำพูดทำให้คนรักหรือเกลียดได้ จึงควรพูดดี**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.recitation.p009
  topics:
  - thai.literature.recitation
  difficulty: 3
  type: order
  stem: เรียงขั้นตอนท่องจำบทร้อยกรอง
  items:
  - อ่านให้เข้าใจความหมายและคำยาก
  - แบ่งท่องทีละวรรค
  - ใช้คำสัมผัสช่วยต่อวรรค
  - ปิดหนังสือแล้วท่องเอง
  - ท่องซ้ำหลายวันและท่องให้คนอื่นฟัง
  hints:
  - ต้องเข้าใจก่อนจึงท่อง
  - การทบทวนอยู่ท้ายสุด
  solution: เข้าใจความหมาย → ท่องทีละวรรค → ใช้สัมผัสช่วย → ปิดหนังสือท่อง → ท่องซ้ำหลายวัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.recitation.p010
  topics:
  - thai.literature.recitation
  difficulty: 3
  type: mcq
  stem: '"สะธุสะจะขอไหว้ · พระศรีไตรสะระณา" (สุนทรภู่ กาพย์พระไชยสุริยา) **พระศรีไตรสะระณา** หมายถึงอะไร'
  choices:
  - id: a
    text: พระรัตนตรัย คือ พระพุทธ พระธรรม พระสงฆ์
    correct: true
    feedback: ถูก ไตร = สาม สรณะ = ที่พึ่ง
  - id: b
    text: พระมหากษัตริย์สามพระองค์
    feedback: ไม่ได้กล่าวถึงพระมหากษัตริย์
  - id: c
    text: พ่อ แม่ และครู
    feedback: พ่อแม่และครูอยู่ในวรรคถัดไป
  - id: d
    text: เทวดาสามองค์
    feedback: เทวดาอยู่ในวรรคท้าย
  hints:
  - ไตร แปลว่า สาม
  - ชาวพุทธยึดสิ่งใดสามอย่างเป็นที่พึ่ง
  solution: '**พระรัตนตรัย** ที่พึ่งสามประการ คือ พระพุทธ พระธรรม พระสงฆ์'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.recitation.p011
  topics:
  - thai.literature.recitation
  difficulty: 3
  type: text
  stem: 'เติมคำที่หายไป: "สะธุสะจะขอไหว้ · พระศรีไตรสะระณา / พ่อแม่แล___ · เทวะตาในราศี" (กาพย์พระไชยสุริยา)'
  accepted:
  - ครูบา
  misconceptions:
  - match: ครู
    feedback: ต้นฉบับใช้ ครูบา ให้ครบจำนวนคำและสัมผัสกับ ณา
  - match: ครูอาจารย์
    feedback: ต้นฉบับใช้ ครูบา
  hints:
  - คำนี้สัมผัสกับ ณา ท้ายวรรคก่อน
  - หมายถึง ครูบาอาจารย์
  solution: '**ครูบา** (ครูบาอาจารย์) สัมผัสกับ ณา'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.recitation.p012
  topics:
  - thai.literature.recitation
  difficulty: 3
  type: mcq
  stem: ข้อใดบอก **คุณค่าด้านภาษา** ของบท "ถึงบางพูดพูดดีเป็นศรีศักดิ์..." ได้ถูกต้อง
  choices:
  - id: a
    text: เล่นคำ พูด จากชื่อตำบลบางพูด และมีสัมผัสในหลายแห่ง
    correct: true
    feedback: ถูก เป็นความงามทางภาษา
  - id: b
    text: สอนให้พูดจาดี
    feedback: เป็นคุณค่าด้านเนื้อหา ไม่ใช่ด้านภาษา
  - id: c
    text: บอกเส้นทางการเดินทางของสุนทรภู่
    feedback: เป็นข้อมูล ไม่ใช่คุณค่าด้านภาษา
  - id: d
    text: ใช้คำยากมากจนอ่านไม่เข้าใจ
    feedback: บทนี้ใช้คำง่ายและไม่ใช่คุณค่า
  hints:
  - ด้านภาษา ถามว่ามีความไพเราะหรือการใช้คำตรงไหน
  - ด้านเนื้อหา ถามว่าสอนอะไร
  solution: 'ด้านภาษา: **เล่นคำ บางพูด–พูดดี** และมีสัมผัสใน เช่น ชั่ว–ตัว ตาย–ทำลาย'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.recitation.p013
  topics:
  - thai.literature.recitation
  difficulty: 4
  type: mcq
  stem: นักเรียนจะพูดหน้าเสาธงเรื่อง "พูดดีมีแต่คนรัก" ข้อใด **นำบทอาขยานไปอ้างอิง** ได้ดีที่สุด
  choices:
  - id: a
    text: ดังที่สุนทรภู่กล่าวไว้ในนิราศภูเขาทองว่า "ถึงบางพูดพูดดีเป็นศรีศักดิ์ มีคนรักรสถ้อยอร่อยจิต" เราจึงควรพูดจาสุภาพต่อกัน
    correct: true
    feedback: ถูก ยกถูกคำ บอกที่มา และเชื่อมกับเรื่องที่พูด
  - id: b
    text: มีกลอนบอกว่า "พูดดีเป็นศรีศักดิ์ คนรักทั้งเมือง"
    feedback: ยกคำไม่ตรงต้นฉบับและไม่บอกที่มา
  - id: c
    text: ดังที่สุนทรภู่กล่าวว่า "สะธุสะจะขอไหว้ พระศรีไตรสะระณา"
    feedback: บอกที่มาถูก แต่บทที่ยกไม่เกี่ยวกับเรื่องการพูด
  - id: d
    text: ดังกลอนที่ผมแต่งเองว่า "ถึงบางพูดพูดดีเป็นศรีศักดิ์"
    feedback: อ้างงานของผู้อื่นเป็นของตน
  hints:
  - 'การอ้างอิงที่ดีมี 3 อย่าง: ตรงเรื่อง ถูกคำ บอกที่มา'
  - ข้อใดครบทั้งสามอย่าง
  solution: ข้อแรก **ตรงเรื่อง ยกถูกทุกคำ บอกชื่อผู้แต่งและชื่อเรื่อง** และอธิบายว่านำมาใช้อย่างไร
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.recitation.p014
  topics:
  - thai.literature.recitation
  difficulty: 4
  type: mcq
  stem: เพื่อนท่องว่า "ถึงบางพูดพูดดีเป็นศรีศักดิ์ · มีคนรักรสถ้อยอร่อย**ใจ**" ข้อใดอธิบายความผิดได้ถูกต้อง
  choices:
  - id: a
    text: ต้นฉบับคือ อร่อยจิต และ จิต ต้องสัมผัสกับ มิตร ในวรรคถัดไป
    correct: true
    feedback: ถูก ใจ ไม่สัมผัสกับ มิตร
  - id: b
    text: ไม่ผิด เพราะ ใจ กับ จิต ความหมายเหมือนกัน
    feedback: ความหมายใกล้กัน แต่ท่องอาขยานต้องตรงต้นฉบับ และสัมผัสจะเสีย
  - id: c
    text: ต้นฉบับคือ อร่อยดี
    feedback: ต้นฉบับใช้ จิต
  - id: d
    text: ผิดที่คำว่า ศรีศักดิ์
    feedback: วรรคแรกท่องถูกแล้ว
  hints:
  - เทียบกับต้นฉบับในบทเรียน
  - ท้ายวรรคนี้ต้องสัมผัสกับคำใดในวรรคถัดไป
  solution: ต้นฉบับคือ **อร่อยจิต** จิต สัมผัสกับ มิตร ถ้าเปลี่ยนเป็น ใจ สัมผัสจะหายไป
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.recitation.p015
  topics:
  - thai.literature.recitation
  difficulty: 4
  type: mcq
