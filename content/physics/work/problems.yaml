    answer: { value: 150, unit: J }
    hints:
      - "พื้นที่ใต้เส้นแนวนอนเป็นรูปสี่เหลี่ยมผืนผ้า"
      - "พื้นที่ = ความสูง (แรง) × ความกว้าง (ระยะ)"
    misconceptions:
      - { match: 75, feedback: "ดูเหมือนคิดพื้นที่เป็นสามเหลี่ยม แต่แรงคงที่ตลอด กราฟจึงเป็นสี่เหลี่ยมผืนผ้า" }
      - { match: 31, feedback: "ดูเหมือนนำแรงบวกกับระยะ พื้นที่ต้องเป็นผลคูณ" }
    solution: "พื้นที่ $= 25\\ \\mathrm{N} \\times 6\\ \\mathrm{m} = 150\\ \\mathrm{J}$ ตรงกับ $W = Fs$"
