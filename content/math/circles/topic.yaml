id: math.geometry.circles
subject: math
title: { th: วงกลม ส่วนโค้ง และเซกเตอร์, en: "Circles: arcs, sectors and angles" }
summary: รู้จักส่วนต่าง ๆ ของวงกลม หาความยาวส่วนโค้งและพื้นที่เซกเตอร์ ใช้ความสัมพันธ์ของมุมที่จุดศูนย์กลางกับมุมในส่วนโค้ง และรู้จักหน่วยเรเดียน
difficulty: 4.5
minutes: 40
prerequisites: [math.geometry.area-perimeter, math.geometry.angles]
encompasses:
  - { id: math.geometry.area-perimeter, weight: 0.4 }
  - { id: math.geometry.angles, weight: 0.3 }
  - { id: math.number.fractions, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: circle-parts.svg
    alt: "วงกลมจุดศูนย์กลาง O มีเซกเตอร์ระบายสีระหว่างรัศมีสองเส้นด้านขวาบน ส่วนโค้งเน้นสีน้ำเงินด้านซ้ายบน เส้นผ่านศูนย์กลางลากผ่าน O จากซ้ายบนไปขวาล่าง คอร์ดด้านซ้ายล่างกับส่วนของวงกลมที่อยู่ระหว่างคอร์ดกับส่วนโค้ง และเส้นสัมผัสด้านขวาที่ตั้งฉากกับรัศมีที่จุดสัมผัส"
    caption: "เซกเตอร์ล้อมด้วยรัศมีสองเส้นกับส่วนโค้ง ส่วนของวงกลมล้อมด้วยคอร์ดกับส่วนโค้ง เส้นสัมผัสตั้งฉากกับรัศมีที่จุดสัมผัส"
  - { type: check, problem: math.circ.p014, prompt: "ดูภาพแล้วลองตอบ" }
  - type: figure
    src: central-inscribed-angle.svg
    alt: "วงกลมจุดศูนย์กลาง O มีจุด A และ B ด้านล่าง ส่วนโค้ง AB ด้านล่างเน้นสีน้ำเงิน รัศมี OA และ OB ทำมุมที่จุดศูนย์กลางขนาด 2x ส่วนจุด C ด้านบนของวงกลมลากคอร์ด CA และ CB ทำมุมในส่วนโค้งขนาด x"
    caption: "มุม $ACB$ ในส่วนโค้งเป็นครึ่งหนึ่งของมุม $AOB$ ที่จุดศูนย์กลาง เมื่อรองรับส่วนโค้ง $AB$ เดียวกัน"
  - type: worked-example
    title: เส้นรอบรูปของเซกเตอร์
    problem: "เซกเตอร์ของวงกลมรัศมี $9\\ \\mathrm{cm}$ มีมุมที่จุดศูนย์กลาง $80^\\circ$ จงหาความยาวรอบเซกเตอร์ (ตอบค่าแม่นยำและค่าประมาณ)"
    steps:
      - text: "เซกเตอร์เป็น $\\tfrac{80}{360} = \\tfrac{2}{9}$ ของวงกลม"
      - text: "ความยาวส่วนโค้ง $= \\tfrac{2}{9} \\times 2\\pi \\times 9 = 4\\pi\\ \\mathrm{cm}$"
      - text: "ขอบของเซกเตอร์มีรัศมีสองเส้นด้วย: $9 + 9 = 18\\ \\mathrm{cm}$"
        why: "เซกเตอร์รูปชิ้นขนมมีขอบตรงสองด้านกับขอบโค้งหนึ่งด้าน ถ้าคิดแค่ส่วนโค้งจะได้ความยาวขาดไปมาก"
      - text: "ความยาวรอบ $= 18 + 4\\pi \\approx 18 + 12.57 = 30.57\\ \\mathrm{cm}$"
    answer: "$18 + 4\\pi \\approx 30.57\\ \\mathrm{cm}$"
  - type: worked-example
    title: ทำไมมุมในส่วนโค้งเป็นครึ่งหนึ่งของมุมที่จุดศูนย์กลาง
    problem: "จุด $A$, $B$, $C$ อยู่บนวงกลมจุดศูนย์กลาง $O$ และ $O$ อยู่ภายในมุม $ACB$ แสดงว่า $\\angle AOB = 2\\angle ACB$"
    steps:
      - text: "ลากเส้นผ่านศูนย์กลางจาก $C$ ผ่าน $O$ ไปพบวงกลมที่ $D$ แบ่งมุม $ACB$ เป็น $\\angle ACO = a$ และ $\\angle BCO = b$"
      - text: "$OA = OC$ (รัศมี) สามเหลี่ยม $OAC$ เป็นสามเหลี่ยมหน้าจั่ว จึงได้ $\\angle OAC = \\angle OCA = a$"
        why: "มุมที่ฐานของสามเหลี่ยมหน้าจั่วเท่ากัน"
      - text: "$\\angle AOD$ เป็นมุมภายนอกของสามเหลี่ยม $OAC$ จึงได้ $\\angle AOD = a + a = 2a$"
        why: "มุมภายนอกเท่ากับผลบวกของมุมภายในสองมุมที่ไม่ได้อยู่ติดกับมัน"
      - text: "ทำเหมือนกันกับสามเหลี่ยม $OBC$: $\\angle BOD = 2b$"
      - text: "รวมกัน: $\\angle AOB = 2a + 2b = 2(a + b) = 2\\angle ACB$"
    answer: "$\\angle AOB = 2\\angle ACB$ (กรณีอื่นพิสูจน์ได้ทำนองเดียวกัน)"
  - { type: check, problem: math.circ.p015, prompt: "ใช้มุมในส่วนโค้งคิดดู มุมตรงข้ามสัมพันธ์กันอย่างไร" }
  - type: interactive
    title: มุมเป็นเรเดียน ความยาวส่วนโค้ง และพื้นที่เซกเตอร์
    caption: "แกน x คือมุมที่จุดศูนย์กลางในหน่วยเรเดียน (หนึ่งรอบ ≈ 6.28) เส้นตรงคือความยาวส่วนโค้ง r·θ เส้นโค้งคือพื้นที่เซกเตอร์ ½·r²·θ ลองเลื่อนรัศมี r แล้วสังเกตว่าเมื่อ r เพิ่มสองเท่า ส่วนโค้งยาวขึ้นสองเท่า แต่พื้นที่เพิ่มสี่เท่า"
    widget:
      kind: function-plot
      functions: ["r x", "\\frac{1}{2} r^2 x"]
      sliders:
        - { name: r, min: 1, max: 4, step: 0.5, value: 2, label: รัศมี }
      x: [0, 6.3]
      y: [0, 20]
glossary:
  - { term: คอร์ด, definition: "ส่วนของเส้นตรงที่เชื่อมจุดสองจุดบนวงกลม คอร์ดที่ผ่านจุดศูนย์กลางคือเส้นผ่านศูนย์กลาง" }
  - { term: ส่วนโค้ง, definition: "ส่วนหนึ่งของเส้นรอบวงระหว่างจุดสองจุดบนวงกลม" }
  - { term: เซกเตอร์, definition: "บริเวณที่ล้อมด้วยรัศมีสองเส้นกับส่วนโค้งระหว่างรัศมีทั้งสอง มีรูปเหมือนชิ้นพิซซ่า" }
  - { term: มุมในส่วนโค้ง, definition: "มุมที่มีจุดยอดอยู่บนวงกลม และแขนทั้งสองเป็นคอร์ด" }
  - { term: เรเดียน, definition: "หน่วยวัดมุม มุม 1 เรเดียนรองรับส่วนโค้งที่ยาวเท่ารัศมี หนึ่งรอบเท่ากับ $2\\pi$ เรเดียน" }
flashcards:
  - { front: "ความยาวส่วนโค้งและพื้นที่เซกเตอร์ (มุม $\\theta$ องศา)", back: "ส่วนโค้ง $= \\tfrac{\\theta}{360} \\times 2\\pi r$ พื้นที่เซกเตอร์ $= \\tfrac{\\theta}{360} \\times \\pi r^2$" }
  - { front: "มุมในส่วนโค้งเทียบกับมุมที่จุดศูนย์กลาง (รองรับส่วนโค้งเดียวกัน)", back: "มุมในส่วนโค้งเป็นครึ่งหนึ่งของมุมที่จุดศูนย์กลาง" }
  - { front: "มุมในครึ่งวงกลม", back: "เป็นมุมฉาก $90^\\circ$ เสมอ" }
  - { front: "$180^\\circ$ เท่ากับกี่เรเดียน", back: "$\\pi$ เรเดียน ดังนั้น $1^\\circ = \\tfrac{\\pi}{180}$ เรเดียน" }
  - { front: "สูตรส่วนโค้งและเซกเตอร์เมื่อมุม $\\theta$ เป็นเรเดียน", back: "ส่วนโค้ง $s = r\\theta$ พื้นที่เซกเตอร์ $A = \\tfrac{1}{2}r^2\\theta$" }
