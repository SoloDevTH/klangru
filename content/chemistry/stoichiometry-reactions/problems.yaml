problems:
  - id: chemistry.stoichiometry.reactions.p001
    topics: [chemistry.stoichiometry.reactions]
    difficulty: 1
    type: mcq
    stem: "ในสมการ $\\mathrm{NaCl(aq) + AgNO_3(aq) \\to AgCl(s) + NaNO_3(aq)}$ สัญลักษณ์ (aq) หมายถึงอะไร"
    choices:
      - { id: a, text: "สารละลายอยู่ในน้ำ", correct: true, feedback: "ถูก aq ย่อมาจาก aqueous แปลว่าละลายในน้ำ" }
      - { id: b, text: "ของเหลวบริสุทธิ์", feedback: "ของเหลวบริสุทธิ์ใช้ (l) เช่น $\\mathrm{H_2O(l)}$" }
      - { id: c, text: "ตะกอนของแข็ง", feedback: "ของแข็งหรือตะกอนใช้ (s) เช่น AgCl(s) ในสมการนี้" }
      - { id: d, text: "แก๊ส", feedback: "แก๊สใช้ (g)" }
    hints:
      - "สัญลักษณ์สถานะมี 4 แบบ (s) (l) (g) (aq)"
      - "aq มาจากคำว่า aqua ซึ่งแปลว่าน้ำ"
    solution: "(aq) หมายถึง **ละลายอยู่ในน้ำ** (s) ของแข็ง (l) ของเหลว (g) แก๊ส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.stoichiometry.reactions.p002
    topics: [chemistry.stoichiometry.reactions]
    difficulty: 2
    type: numeric
    stem: "อะลูมิเนียมทำปฏิกิริยากับออกซิเจนเกิดเป็นชั้นออกไซด์บาง ๆ ที่ผิว $\\mathrm{Al + O_2 \\to Al_2O_3}$ เมื่อดุลสมการด้วยสัมประสิทธิ์ที่เป็น **จำนวนเต็มน้อยที่สุด** สัมประสิทธิ์ของ $\\mathrm{O_2}$ เป็นเท่าใด"
    answer: { value: 3 }
    misconceptions:
      - { match: 1.5, feedback: "สมการ $\\mathrm{2Al + 1.5O_2 \\to Al_2O_3}$ ดุลแล้วก็จริง แต่ต้องคูณ 2 ให้เป็นจำนวนเต็ม" }
      - { match: 2, feedback: "ลองนับ O: ถ้า $\\mathrm{O_2}$ 2 โมเลกุลมี O 4 อะตอม ซึ่งหาร 3 ไม่ลงตัว" }
    hints:
      - "ฝั่งขวามี O 3 อะตอม ฝั่งซ้าย O มาเป็นคู่"
      - "ใช้ $\\mathrm{Al_2O_3}$ 2 หน่วย จะได้ O กี่อะตอม"
    solution: "ใช้ $\\mathrm{Al_2O_3}$ 2 หน่วย มี O 6 อะตอม ต้องใช้ $\\mathrm{O_2}$ 3 โมเลกุล และ Al 4 อะตอม: $\\mathrm{4Al + 3O_2 \\to 2Al_2O_3}$ สัมประสิทธิ์ของ $\\mathrm{O_2}$ คือ **3**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.stoichiometry.reactions.p003
    topics: [chemistry.stoichiometry.reactions]
    difficulty: 2
    type: mcq
    stem: "สมการใดดุลแล้ว"
    choices:
      - { id: a, text: "$\\mathrm{CH_4 + 2O_2 \\to CO_2 + 2H_2O}$", correct: true, feedback: "ถูก C 1 = 1 · H 4 = 4 · O 4 = 2 + 2" }
      - { id: b, text: "$\\mathrm{CH_4 + O_2 \\to CO_2 + 2H_2O}$", feedback: "O ซ้ายมี 2 ขวามี 4 ยังไม่เท่ากัน" }
      - { id: c, text: "$\\mathrm{CH_4 + O_2 \\to CO_2 + H_2O_2}$", feedback: "จำนวนอะตอมเท่ากันก็จริง แต่แก้ตัวเลขห้อยของน้ำจนกลายเป็นไฮโดรเจนเปอร์ออกไซด์ ซึ่งเป็นสารอื่น" }
      - { id: d, text: "$\\mathrm{CH_4 + 2O_2 \\to CO_2 + H_2O}$", feedback: "H ซ้ายมี 4 ขวามี 2 และ O ก็ไม่เท่ากัน" }
    hints:
      - "นับ C, H, O ทีละธาตุทั้งสองข้าง"
      - "สมการที่ดุลแล้วต้องไม่เปลี่ยนสูตรของสาร"
    solution: "ข้อ ก มี C 1 อะตอม H 4 อะตอม O 4 อะตอมทั้งสองข้าง และใช้สูตรที่ถูกต้องของทุกสาร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.stoichiometry.reactions.p004
    topics: [chemistry.stoichiometry.reactions]
    difficulty: 3
    type: numeric
    stem: "เอทานอลในน้ำมันแก๊สโซฮอล์เผาไหม้ตามสมการ $\\mathrm{C_2H_5OH + O_2 \\to CO_2 + H_2O}$ เมื่อดุลด้วยจำนวนเต็มน้อยที่สุด สัมประสิทธิ์ของ $\\mathrm{O_2}$ เป็นเท่าใด"
    answer: { value: 3 }
    misconceptions:
      - { match: 3.5, feedback: "ลืมนับ O 1 อะตอมที่อยู่ในเอทานอลแล้ว ต้องใช้จาก $\\mathrm{O_2}$ เพียง 6 อะตอม" }
      - { match: 7, feedback: "7 คือจำนวนอะตอม O ทั้งหมดทางขวา ยังต้องหักที่มาจากเอทานอลและหารด้วย 2" }
    hints:
      - "ดุล C และ H ก่อน: C 2 อะตอม และ H 6 อะตอม"
      - "นับ O ทางขวา แล้วหักออก 1 อะตอมที่มาจากเอทานอล"
    solution: "C: 2 หน้า $\\mathrm{CO_2}$ · H: 3 หน้า $\\mathrm{H_2O}$ · O ขวา $= 4 + 3 = 7$ อะตอม เอทานอลมี O อยู่ 1 จึงต้องการจาก $\\mathrm{O_2}$ อีก 6 อะตอม คือ **3** โมเลกุล: $\\mathrm{C_2H_5OH + 3O_2 \\to 2CO_2 + 3H_2O}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.stoichiometry.reactions.p005
    topics: [chemistry.stoichiometry.reactions]
    difficulty: 4
    type: numeric
    stem: "ดุลสมการการเผาไหม้อีเทน $\\mathrm{C_2H_6 + O_2 \\to CO_2 + H_2O}$ ด้วยจำนวนเต็มน้อยที่สุด แล้วหา **ผลรวมของสัมประสิทธิ์ทั้งหมด**"
    answer: { value: 19 }
    misconceptions:
      - { match: 9.5, feedback: "$\\mathrm{C_2H_6 + 3.5O_2 \\to 2CO_2 + 3H_2O}$ ยังมีเศษส่วน ต้องคูณ 2 ทั้งสมการก่อนรวม" }
      - { match: 11, feedback: "ตรวจ O อีกครั้ง: ขวามี O $= 4(2) + 6(1) = 14$ อะตอม ต้องใช้ $\\mathrm{O_2}$ 7 โมเลกุล" }
    hints:
      - "ดุล C และ H ก่อน แล้วค่อยดุล O"
      - "ถ้า $\\mathrm{O_2}$ เป็นเศษส่วน ให้คูณทุกสัมประสิทธิ์ด้วย 2"
    solution: "$\\mathrm{C_2H_6 + \\tfrac72 O_2 \\to 2CO_2 + 3H_2O}$ คูณ 2 ได้ $\\mathrm{2C_2H_6 + 7O_2 \\to 4CO_2 + 6H_2O}$ ผลรวม $2 + 7 + 4 + 6 =$ **19**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.stoichiometry.reactions.p006
    topics: [chemistry.stoichiometry.reactions]
    difficulty: 3
    type: numeric
    stem: "โรงงานที่สระบุรีเผาหินปูน $\\mathrm{CaCO_3(s) \\xrightarrow{\\Delta} CaO(s) + CO_2(g)}$ เพื่อทำปูนดิบ ถ้าเผาหินปูนบริสุทธิ์ 50.0 g จนสลายตัวหมด จะได้ CaO กี่กรัม (Ca = 40.08, C = 12.01, O = 16.00)"
    answer: { value: 28.01, tolerance: 0.1, unit: g }
    misconceptions:
      - { match: 21.99, feedback: "นี่คือมวลของ $\\mathrm{CO_2}$ ที่หนีออกไป โจทย์ถามมวลของ CaO" }
      - { match: 50, feedback: "มวลสารตั้งต้นไม่ได้กลายเป็น CaO ทั้งหมด ส่วนหนึ่งออกไปเป็นแก๊ส $\\mathrm{CO_2}$" }
    hints:
      - "หามวลต่อโมลของ $\\mathrm{CaCO_3}$ และ CaO"
      - "อัตราส่วนโมล $\\mathrm{CaCO_3}$ : CaO $= 1 : 1$"
    solution: "$M_{\\mathrm{CaCO_3}} = 100.09$ g/mol จึงมี $50.0 / 100.09 = 0.4996$ mol ได้ CaO 0.4996 mol $\\times 56.08 =$ **28.0 g**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.stoichiometry.reactions.p007
    topics: [chemistry.stoichiometry.reactions]
    difficulty: 4
    type: numeric
    stem: "ต้องใช้กรดไฮโดรคลอริกเข้มข้น $2.0\\ \\mathrm{mol/dm^3}$ กี่ลูกบาศก์เซนติเมตร จึงทำปฏิกิริยาพอดีกับลวดแมกนีเซียม 0.486 g ตามสมการ $\\mathrm{Mg(s) + 2HCl(aq) \\to MgCl_2(aq) + H_2(g)}$ (Mg = 24.31)"
    answer: { value: 20.0, tolerance: 0.2, unit: "cm³" }
    misconceptions:
      - { match: 10.0, feedback: "Mg 1 mol ใช้ HCl 2 mol อย่าลืมคูณ 2" }
      - { match: 0.02, feedback: "นี่คือปริมาตรในหน่วย $\\mathrm{dm^3}$ ต้องคูณ 1,000 เป็น $\\mathrm{cm^3}$" }
    hints:
      - "หาโมลของ Mg ก่อน"
      - "โมลของ HCl $=$ 2 เท่าของโมล Mg แล้วใช้ $V = n/C$"
    solution: "Mg $= 0.486 / 24.31 = 0.0200$ mol · HCl $= 2 \\times 0.0200 = 0.0400$ mol · $V = 0.0400 / 2.0 = 0.0200\\ \\mathrm{dm^3} =$ **20.0 cm³**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.stoichiometry.reactions.p008
    topics: [chemistry.stoichiometry.reactions]
    difficulty: 3
    type: numeric
    stem: "ไฮโดรเจนเปอร์ออกไซด์ (ใช้ล้างแผล) สลายตัวตามสมการ $\\mathrm{2H_2O_2(aq) \\to 2H_2O(l) + O_2(g)}$ ถ้า $\\mathrm{H_2O_2}$ 6.80 g สลายตัวหมด จะได้แก๊สออกซิเจนกี่ลูกบาศก์เดซิเมตรที่ STP (H = 1.008, O = 16.00)"
    answer: { value: 2.24, tolerance: 0.03, unit: "dm³" }
    misconceptions:
      - { match: 4.48, feedback: "$\\mathrm{H_2O_2}$ 2 mol ให้ $\\mathrm{O_2}$ เพียง 1 mol ต้องหาร 2" }
      - { match: 0.1, feedback: "0.1 คือจำนวนโมลของ $\\mathrm{O_2}$ ต้องคูณ 22.4 เพื่อเป็นปริมาตร" }
    hints:
      - "$M_{\\mathrm{H_2O_2}} = 34.02$ g/mol"
      - "อัตราส่วนโมล $\\mathrm{H_2O_2 : O_2} = 2 : 1$ แล้วคูณ 22.4"
    solution: "$\\mathrm{H_2O_2}$ $= 6.80 / 34.02 = 0.200$ mol · $\\mathrm{O_2}$ $= 0.200 / 2 = 0.100$ mol · $V = 0.100 \\times 22.4 =$ **2.24 dm³**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.stoichiometry.reactions.p009
    topics: [chemistry.stoichiometry.reactions]
    difficulty: 4
    type: numeric
    stem: "กรดซัลฟิวริก $0.100\\ \\mathrm{mol/dm^3}$ ปริมาตร $25.0\\ \\mathrm{cm^3}$ ทำปฏิกิริยาพอดีกับสารละลายโซเดียมไฮดรอกไซด์ $0.200\\ \\mathrm{mol/dm^3}$ ตามสมการ $\\mathrm{H_2SO_4(aq) + 2NaOH(aq) \\to Na_2SO_4(aq) + 2H_2O(l)}$ ต้องใช้ NaOH กี่ $\\mathrm{cm^3}$"
    answer: { value: 25.0, tolerance: 0.2, unit: "cm³" }
    misconceptions:
      - { match: 12.5, feedback: "กรด 1 mol ใช้ NaOH 2 mol ต้องคูณ 2 ไม่ใช่หาร 2" }
      - { match: 6.25, feedback: "ใช้อัตราส่วนกลับด้าน โมลของ NaOH ต้องมากกว่าโมลของกรด" }
    hints:
      - "หาโมลของ $\\mathrm{H_2SO_4}$ จาก $n = CV$ (V เป็น $\\mathrm{dm^3}$)"
      - "โมลของ NaOH $= 2 \\times$ โมลของกรด แล้วใช้ $V = n/C$"
    solution: "$\\mathrm{H_2SO_4}$ $= 0.100 \\times 0.0250 = 0.00250$ mol · NaOH $= 0.00500$ mol · $V = 0.00500 / 0.200 = 0.0250\\ \\mathrm{dm^3} =$ **25.0 cm³**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.stoichiometry.reactions.p010
    topics: [chemistry.stoichiometry.reactions]
    difficulty: 4
    type: numeric
    stem: "การผลิตกรดซัลฟิวริกมี 3 ขั้น: $\\mathrm{S + O_2 \\to SO_2}$, $\\mathrm{2SO_2 + O_2 \\to 2SO_3}$, $\\mathrm{SO_3 + H_2O \\to H_2SO_4}$ กำมะถัน 64.12 g จะผลิต $\\mathrm{H_2SO_4}$ ได้มากที่สุดกี่กรัม (S = 32.06, H = 1.008, O = 16.00)"
    answer: { value: 196.2, tolerance: 1, unit: g }
    misconceptions:
      - { match: 98.08, feedback: "นี่คือมวลของ $\\mathrm{H_2SO_4}$ 1 mol แต่กำมะถัน 64.12 g มี 2 mol" }
      - { match: 392.3, feedback: "สัมประสิทธิ์ 2 ในขั้นที่สองใช้กับทั้ง $\\mathrm{SO_2}$ และ $\\mathrm{SO_3}$ อัตราส่วนจึงยังเป็น 1 : 1 ไม่ได้คูณ 2" }
    hints:
      - "ตาม S จากต้นจนจบ: S 1 อะตอมไปอยู่ใน $\\mathrm{H_2SO_4}$ กี่โมเลกุล"
      - "อัตราส่วนโมลรวม S : $\\mathrm{H_2SO_4} = 1 : 1$"
    solution: "S $= 64.12 / 32.06 = 2.000$ mol ทุกขั้นมีอัตราส่วน S : $\\mathrm{H_2SO_4} = 1 : 1$ จึงได้ $\\mathrm{H_2SO_4}$ 2.000 mol $\\times 98.08 =$ **196.2 g**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.stoichiometry.reactions.p011
    topics: [chemistry.stoichiometry.reactions]
    difficulty: 4
    type: numeric
    stem: "ใส่สังกะสี 6.54 g ลงในกรดไฮโดรคลอริก $2.0\\ \\mathrm{mol/dm^3}$ ปริมาตร $50.0\\ \\mathrm{cm^3}$ ปฏิกิริยา $\\mathrm{Zn(s) + 2HCl(aq) \\to ZnCl_2(aq) + H_2(g)}$ จะได้แก๊สไฮโดรเจนมากที่สุดกี่ $\\mathrm{dm^3}$ ที่ STP (Zn = 65.38)"
    answer: { value: 1.12, tolerance: 0.02, unit: "dm³" }
    misconceptions:
      - { match: 2.24, feedback: "คำนวณจาก Zn ซึ่งเป็นสารที่มีมากเกินพอ กรดหมดก่อน ต้องใช้ HCl คำนวณ" }
      - { match: 2.0, feedback: "ตรวจหน่วย: ต้องเปลี่ยน $50.0\\ \\mathrm{cm^3}$ เป็น $0.0500\\ \\mathrm{dm^3}$ ก่อนคูณความเข้มข้น" }
    hints:
      - "หาโมลของ Zn และ HCl แล้วหารด้วยสัมประสิทธิ์"
      - "ใช้สารกำหนดปริมาณคำนวณ $\\mathrm{H_2}$"
    solution: "Zn $= 6.54 / 65.38 = 0.100$ mol (÷1 = 0.100) · HCl $= 2.0 \\times 0.0500 = 0.100$ mol (÷2 = 0.050) HCl เป็นสารกำหนดปริมาณ ได้ $\\mathrm{H_2}$ $= 0.100 / 2 = 0.050$ mol $\\times 22.4 =$ **1.12 dm³**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.stoichiometry.reactions.p012
    topics: [chemistry.stoichiometry.reactions]
    difficulty: 3
    type: numeric
    stem: "ภาพแสดงภาชนะที่มีโมเลกุล $\\mathrm{N_2}$ และ $\\mathrm{H_2}$ ก่อนเกิดปฏิกิริยา $\\mathrm{N_2 + 3H_2 \\to 2NH_3}$ ถ้าปฏิกิริยาเกิดจนสารใดสารหนึ่งหมด จะได้โมเลกุล $\\mathrm{NH_3}$ กี่โมเลกุล"
    figure:
      src: p-n2-h2-box.svg
      alt: "ภาชนะสี่เหลี่ยม ภายในมีโมเลกุล N₂ (วงกลมสีน้ำเงินใหญ่สองวงติดกัน) 3 โมเลกุล และโมเลกุล H₂ (วงกลมสีขาวเล็กสองวงติดกัน) 6 โมเลกุล"
    answer: { value: 4, unit: โมเลกุล }
    misconceptions:
      - { match: 6, feedback: "คำนวณจาก $\\mathrm{N_2}$ ทั้ง 3 โมเลกุล แต่ต้องใช้ $\\mathrm{H_2}$ ถึง 9 โมเลกุล ซึ่งมีไม่พอ" }
      - { match: 12, feedback: "ใช้ $\\mathrm{H_2}$ คำนวณแต่คูณอัตราส่วนกลับด้าน $\\mathrm{H_2}$ 3 โมเลกุลให้ $\\mathrm{NH_3}$ 2 โมเลกุล" }
    hints:
      - "นับโมเลกุลในภาพ แล้วหารด้วยสัมประสิทธิ์ของแต่ละสาร"
      - "สารที่ได้ค่าน้อยกว่าหมดก่อน ใช้สารนั้นคำนวณ"
    solution: "$\\mathrm{N_2}$ 3 ÷ 1 = 3 · $\\mathrm{H_2}$ 6 ÷ 3 = 2 จึงเป็นสารกำหนดปริมาณ $\\mathrm{H_2}$ 6 โมเลกุลให้ $\\mathrm{NH_3}$ $6 \\times \\tfrac23 =$ **4 โมเลกุล** และเหลือ $\\mathrm{N_2}$ 1 โมเลกุล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.stoichiometry.reactions.p013
    topics: [chemistry.stoichiometry.reactions]
    difficulty: 4
    type: numeric
    stem: "เตาเผาปูนเผาหินปูน ($\\mathrm{CaCO_3}$) 1.00 kg ได้ปูนดิบ (CaO) จริง 0.500 kg ตามสมการ $\\mathrm{CaCO_3 \\to CaO + CO_2}$ ผลได้ร้อยละเป็นเท่าใด (Ca = 40.08, C = 12.01, O = 16.00)"
    answer: { value: 89.2, tolerance: 0.3, unit: "%" }
    misconceptions:
      - { match: 50, feedback: "เทียบ CaO กับมวลหินปูนไม่ได้ ต้องเทียบกับผลได้ตามทฤษฎีของ CaO" }
      - { match: 112.1, feedback: "หารกลับด้าน ผลได้ร้อยละ = ผลได้จริง ÷ ผลได้ตามทฤษฎี" }
    hints:
      - "หาผลได้ตามทฤษฎีของ CaO จากหินปูน 1.00 kg"
      - "ผลได้ร้อยละ $= \\dfrac{\\text{จริง}}{\\text{ทฤษฎี}} \\times 100$"
    solution: "$\\mathrm{CaCO_3}$ $= 1000 / 100.09 = 9.991$ mol ได้ CaO ตามทฤษฎี $9.991 \\times 56.08 = 560.3$ g ผลได้ร้อยละ $= \\dfrac{500}{560.3} \\times 100 =$ **89.2**"
