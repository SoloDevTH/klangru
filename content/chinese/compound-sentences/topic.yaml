id: chinese.grammar.compound-sentences
subject: chinese
title: { th: "ประโยคความรวมด้วย 因为…所以 如果…就 虽然…但是", en: "Compound sentences with 因为…所以, 如果…就 and 虽然…但是" }
summary: คู่คำเชื่อมบอกเหตุผล เงื่อนไข ความขัดแย้ง ลำดับ และการเพิ่มเติม (先…然后 不但…而且) ตำแหน่งของ 就 และการแสดงความคิดเห็นพร้อมเหตุผล
difficulty: 4
minutes: 35
prerequisites: [chinese.grammar.modal-verbs]
encompasses:
  - { id: chinese.grammar.modal-verbs, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: connector-pairs.svg
    alt: "ตารางคู่คำเชื่อม 5 คู่ ส่วนแรก → ส่วนหลัง หน้าที่ และภาษาไทย: 因为 yīnwèi → 所以 suǒyǐ เหตุ→ผล เพราะ…จึง · 如果 rúguǒ → 就 jiù เงื่อนไข ถ้า…ก็ · 虽然 suīrán → 但是 dànshì ขัดแย้ง ถึงแม้…แต่ · 先 xiān → 再 zài / 然后 ránhòu ลำดับ ก่อน…แล้ว · 不但 búdàn → 而且 érqiě เพิ่มเติม ไม่เพียง…แต่ยัง กล่องล่าง: 就 และ 再 เป็นคำวิเศษณ์ วางหลังประธาน หน้ากริยา 如果下雨，我们就不去。 ข้อผิด 如果下雨，就我们不去。 และ 虽然…所以… (จับคู่ผิด)"
    caption: "ภาษาจีนใช้คำเชื่อมเป็นคู่ ต้องจับคู่ให้ถูก"
  - { type: check, problem: chinese.grammar.compound-sentences.p003, prompt: "คู่ของ 但是 คืออะไร" }
  - type: worked-example
    title: แสดงความคิดเห็นพร้อมเหตุผล
    problem: "ครูถามว่า 你喜欢住在曼谷吗？ (ชอบอยู่กรุงเทพฯ ไหม) ตอบว่า ชอบ เพราะสะดวกและมีของกินเยอะ ถึงแม้รถจะติด"
    steps:
      - text: "บอกความคิดเห็นก่อน: 我喜欢住在曼谷。"
      - text: "ให้เหตุผลสองข้อด้วย 因为…而且…: 因为很方便，而且有很多好吃的东西。"
        why: "而且 เพิ่มเหตุผลข้อที่สองโดยไม่ต้องขึ้นประโยคใหม่"
      - text: "ยอมรับข้อเสียด้วย 虽然…但是…: 虽然常常堵车，但是我还是很喜欢。 (常常 chángcháng = บ่อย ๆ 还是 = ยังคง)"
    answer: "我喜欢住在曼谷，因为很方便，而且有很多好吃的东西。虽然常常堵车，但是我还是很喜欢。"
  - type: worked-example
    title: วางแผนด้วย 如果…就 และ 先…再
    problem: "วางแผนวันเสาร์: ถ้าฝนไม่ตกจะไปสวนลุมพินี วิ่งก่อนแล้วค่อยกินข้าวเช้า"
    steps:
      - text: "เงื่อนไขใช้ 如果…就 และวาง 就 หลังประธาน: 如果不下雨，我们就去公园。 (公园 gōngyuán = สวนสาธารณะ)"
        why: "就 เป็นคำวิเศษณ์ จึงอยู่หน้ากริยา 去 ไม่อยู่หน้าประธาน 我们"
      - text: "ลำดับในอนาคตใช้ 先…再…: 我们先跑步，再吃早饭。"
    answer: "如果不下雨，我们就去公园。我们先跑步，再吃早饭。"
  - { type: check, problem: chinese.grammar.compound-sentences.p006, prompt: "就 อยู่ตรงไหน" }
glossary:
  - { term: "因为…所以… yīnwèi…suǒyǐ…", definition: "เพราะ… จึง… ละคำใดคำหนึ่งได้ ถ้าผลมาก่อนใช้ 因为 นำเหตุ" }
  - { term: "如果…就… rúguǒ…jiù…", definition: "ถ้า… ก็… 就 อยู่หลังประธาน หน้ากริยา" }
  - { term: "虽然…但是/可是… suīrán…dànshì/kěshì…", definition: "ถึงแม้… แต่…" }
  - { term: "先…再/然后… xiān…zài/ránhòu…", definition: "ก่อน… แล้ว… ปิดด้วย 最后 (สุดท้าย) ได้" }
  - { term: "不但…而且… búdàn…érqiě…", definition: "ไม่เพียง… แต่ยัง… ประธานเดียวกันวางหน้า 不但" }
  - { term: "觉得 juéde", definition: "คิดว่า รู้สึกว่า ใช้นำความคิดเห็น" }
flashcards:
  - { front: "เพราะฝนตก พวกเราจึงไม่ได้ไป", back: "因为下雨，所以我们没去。" }
  - { front: "ถ้าพรุ่งนี้ฝนไม่ตก พวกเราก็ไปทะเล", back: "如果明天不下雨，我们就去海边。" }
  - { front: "ถึงแม้อาหารไทยจะเผ็ด แต่ฉันชอบ", back: "虽然泰国菜很辣，但是我很喜欢。" }
  - { front: "ไม่เพียงถูก แต่ยังอร่อย", back: "不但便宜，而且好吃。" }
  - { front: "กินข้าวก่อน แล้วไปดูหนัง", back: "先吃饭，然后去看电影。" }
