<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="sans-serif">
<title>หม้อหุงข้าวไฟฟ้าในฐานะระบบทางเทคโนโลยี</title>
<rect x="0" y="0" width="720" height="330" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="360.0" y="28.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">ระบบทางเทคโนโลยี: หม้อหุงข้าวไฟฟ้า</text>
<rect x="20.0" y="70.0" width="190.0" height="120.0" rx="8" fill="#ede9fe" stroke="#333" stroke-width="1.5"/>
<text x="115.0" y="98.0" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#111">ตัวป้อน (input)</text>
<text x="115.0" y="128.0" font-size="13" text-anchor="middle" fill="#111">ข้าวสาร น้ำ</text>
<text x="115.0" y="148.0" font-size="13" text-anchor="middle" fill="#111">พลังงานไฟฟ้า</text>
<text x="115.0" y="168.0" font-size="13" text-anchor="middle" fill="#111">กดปุ่มหุง</text>
<rect x="265.0" y="70.0" width="190.0" height="120.0" rx="8" fill="#e0e7ff" stroke="#333" stroke-width="1.5"/>
<text x="360.0" y="98.0" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#111">กระบวนการ (process)</text>
<text x="360.0" y="128.0" font-size="13" text-anchor="middle" fill="#111">แผ่นความร้อน</text>
<text x="360.0" y="148.0" font-size="13" text-anchor="middle" fill="#111">ต้มน้ำจนข้าวสุก</text>
<rect x="510.0" y="70.0" width="190.0" height="120.0" rx="8" fill="#ede9fe" stroke="#333" stroke-width="1.5"/>
<text x="605.0" y="98.0" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#111">ผลผลิต (output)</text>
<text x="605.0" y="128.0" font-size="13" text-anchor="middle" fill="#111">ข้าวสุก</text>
<text x="605.0" y="148.0" font-size="13" text-anchor="middle" fill="#111">(และความร้อนที่</text>
<text x="605.0" y="168.0" font-size="13" text-anchor="middle" fill="#111">สูญเสียไป)</text>
<line x1="210.0" y1="130.0" x2="263.0" y2="130.0" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<line x1="455.0" y1="130.0" x2="508.0" y2="130.0" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 605 190 L 605 260 L 360 260" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 360 260 L 360 192" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<rect x="395.0" y="232.0" width="190.0" height="56.0" rx="8" fill="#fff7e6" stroke="#b45309" stroke-width="1.5"/>
<text x="490.0" y="256.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#92400e">ข้อมูลย้อนกลับ (feedback)</text>
<text x="490.0" y="276.0" font-size="12" text-anchor="middle" fill="#92400e">น้ำแห้ง ก้นหม้อร้อนเกิน 100 °C</text>
<text x="250.0" y="284.0" font-size="12.5" text-anchor="middle" fill="#333">ตัวตัดความร้อนเปลี่ยนเป็นโหมดอุ่น</text>
<text x="360.0" y="318.0" font-size="12.5" text-anchor="middle" fill="#444">ทรัพยากรที่ระบบใช้: คน ข้อมูล วัสดุ เครื่องมือ พลังงาน ทุน เวลา</text>
</svg>
