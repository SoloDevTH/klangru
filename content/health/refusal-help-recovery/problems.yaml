  solution: นอนไม่หลับ พูดคนเดียว หวาดระแวง และพฤติกรรมผิดปกติเป็นสัญญาณเตือนอาการทางจิตเวชรุนแรง เมื่อมีอาวุธต้องออกห่างและให้ผู้ใหญ่โทร 1669 หรือ 191 ทันที เมื่อปลอดภัยแล้วจึงพาเข้ารับการรักษา
