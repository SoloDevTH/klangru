id: science.inquiry.investigation-design
subject: science
title:
  th: การตั้งคำถาม สมมติฐาน และการออกแบบการทดลอง
  en: Questions, hypotheses and investigation design
summary: ตั้งคำถามที่ทดสอบได้ คาดคะเนและตั้งสมมติฐาน แยกตัวแปรต้น ตัวแปรตาม ตัวแปรควบคุม ออกแบบการทดลองที่ยุติธรรม สุ่มตัวอย่างภาคสนาม และวางแผนอย่างปลอดภัย
difficulty: 1.5
minutes: 25
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  title: การทดลองที่ยุติธรรม
  src: fair-test.svg
  alt: ภาพกระถางถั่วเขียว 3 ใบ กระถาง A ได้น้ำ 0 มิลลิลิตรต่อวัน กระถาง B 20 มิลลิลิตร กระถาง C 40 มิลลิลิตร กล่องด้านบนบอกว่า ตัวแปรต้น (เปลี่ยน) คือปริมาณน้ำ ตัวแปรตาม (วัด) คือความสูงของต้นหลัง 7 วัน ตัวแปรควบคุม (เหมือนกัน) คือเมล็ดชนิดเดียวกัน ดินเดียวกัน กระถางขนาดเท่ากัน วางที่เดียวกัน
  caption: ถ้ากระถางวางคนละที่ เราจะไม่รู้ว่าต้นสูงต่างกันเพราะน้ำหรือเพราะแสง
- type: worked-example
  title: วางแผนการทดลองว่ากระดาษชนิดใดซับน้ำได้ดีที่สุด
  problem: ดาวอยากรู้ว่ากระดาษทิชชู กระดาษหนังสือพิมพ์ หรือกระดาษถ่ายเอกสาร ซับน้ำได้มากที่สุด ช่วยวางแผน
  steps:
  - text: 'คำถาม: กระดาษชนิดใดซับน้ำได้มากที่สุด'
  - text: 'คาดคะเน: กระดาษทิชชูซับน้ำได้มากที่สุด เพราะบางและนุ่ม มีช่องว่างมาก'
  - text: 'ตัวแปรต้น: ชนิดกระดาษ ตัวแปรตาม: ปริมาณน้ำที่กระดาษซับได้ (มิลลิลิตร)'
    why: ตัวแปรต้นคือสิ่งที่เราเลือกเอง ตัวแปรตามคือผลที่วัด
  - text: 'ตัวแปรควบคุม: ขนาดกระดาษ (10 × 10 เซนติเมตร) ปริมาณน้ำเริ่มต้น เวลาจุ่ม 10 วินาที'
  - text: 'วิธีวัด: จุ่มกระดาษในน้ำ 50 มิลลิลิตร ยกขึ้น แล้วตวงน้ำที่เหลือ น้ำที่หายไปคือน้ำที่ถูกซับ ทำซ้ำชนิดละ 3 ครั้ง'
    why: การทำซ้ำช่วยให้ผลน่าเชื่อถือ
  answer: เปลี่ยนชนิดกระดาษอย่างเดียว วัดปริมาณน้ำที่ซับได้ ควบคุมขนาด น้ำ และเวลา ทำซ้ำ 3 ครั้ง
- type: check
  problem: science.inquiry.investigation-design.p004
  prompt: ลองตอบก่อนอ่านต่อ
- type: figure
  title: สุ่มตัวอย่างด้วยกรอบสี่เหลี่ยม
  src: quadrat.svg
  alt: แผนผังสนามโรงเรียนสี่เหลี่ยมผืนผ้ากว้าง 20 เมตร ยาว 10 เมตร แบ่งเป็นช่อง 1 × 1 เมตร มีกรอบสุ่มตัวอย่าง 5 กรอบกระจายทั่วสนาม นับต้นแห้วหมูได้ กรอบ 1 = 4 ต้น กรอบ 2 = 6 ต้น กรอบ 3 = 3 ต้น กรอบ 4 = 5 ต้น กรอบ 5 = 7 ต้น
  caption: กรอบที่วางกระจายทั่วสนามแบบสุ่มเป็นตัวแทนของทั้งสนามได้ดีกว่ากรอบที่เลือกวางเอง
- type: worked-example
  title: หาข้อบกพร่องและปรับแผน
  problem: เจมส์ทดสอบว่ารองเท้าคู่ไหนลื่นน้อยที่สุด โดยลากรองเท้าผ้าใบบนพื้นกระเบื้อง และลากรองเท้าแตะบนพื้นปูน ครั้งละหนึ่งรอบ แผนนี้ควรปรับอย่างไร
  steps:
  - text: 'สิ่งที่เปลี่ยน: ชนิดรองเท้า และชนิดพื้น มีสองอย่าง จึงไม่ยุติธรรม'
  - text: 'ปรับ: ทดสอบรองเท้าทุกคู่บนพื้นชนิดเดียวกัน'
    why: ให้ตัวแปรต้นเหลือเพียงชนิดรองเท้า
  - text: 'ควบคุมเพิ่ม: ใส่น้ำหนักในรองเท้าเท่ากัน ลากด้วยเครื่องชั่งสปริงในแนวราบ'
  - text: ทำซ้ำคู่ละ 3 ครั้ง แล้วหาค่าเฉลี่ยแรงที่ใช้ลาก
  answer: ใช้พื้นเดียวกัน น้ำหนักเท่ากัน ลากแบบเดียวกัน และทำซ้ำ
- type: check
  problem: science.inquiry.investigation-design.p008
glossary:
- term: คำถามที่ทดสอบได้
  definition: คำถามที่หาคำตอบได้ด้วยการสังเกต การวัด หรือการทดลอง
- term: สมมติฐาน
  definition: คำตอบล่วงหน้าที่บอกความสัมพันธ์ระหว่างตัวแปรต้นกับตัวแปรตาม พร้อมเหตุผลจากความรู้เดิม
- term: ตัวแปรต้น ตัวแปรตาม ตัวแปรควบคุม
  definition: สิ่งที่เปลี่ยน สิ่งที่วัด และสิ่งที่ต้องเหมือนกันในการทดลอง
- term: การทดลองที่ยุติธรรม
  definition: การทดลองที่เปลี่ยนตัวแปรต้นเพียงอย่างเดียว ส่วนอื่นควบคุมให้เหมือนกัน
- term: การสุ่มตัวอย่าง
  definition: การเลือกส่วนหนึ่งของพื้นที่หรือกลุ่มแบบไม่ลำเอียงเพื่อใช้แทนทั้งหมด
flashcards:
- front: เปลี่ยน 1 อย่าง วัด 1 อย่าง ...
  back: ที่เหลือให้เหมือนกัน (ตัวแปรต้น ตัวแปรตาม ตัวแปรควบคุม)
- front: รูปแบบการเขียนสมมติฐาน
  back: ถ้า ... ดังนั้น ... เพราะ ...
- front: ทำไมต้องทำซ้ำ
  back: เพื่อให้ผลไม่ใช่ความบังเอิญและหาค่าเฉลี่ยที่น่าเชื่อถือ
- front: ประมาณจำนวนจากกรอบสุ่ม
  back: ค่าเฉลี่ยต่อกรอบ × จำนวนตารางเมตรของพื้นที่
