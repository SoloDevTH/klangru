<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560" font-family="sans-serif" font-size="14">
<title>ภาพรวมการหายใจระดับเซลล์ของกลูโคส 1 โมเลกุล</title>
<rect x="0" y="0" width="1080" height="560" fill="#ffffff"/>
<rect x="20" y="20" width="1040" height="520" rx="16" fill="#fffde7" stroke="#bdbdbd"/>
<text x="40.0" y="46.0" text-anchor="start" font-size="14" font-weight="bold" fill="#827717">ไซโทซอล</text>
<rect x="420" y="70" width="620" height="270" rx="120" fill="#ffe0b2" stroke="#e65100" stroke-width="3"/>
<text x="730.0" y="98.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#bf360c">ไมโทคอนเดรีย (ใช้ออกซิเจน)</text>
<rect x="45.0" y="87.0" width="190" height="46" rx="10" fill="#fff" stroke="#455a64" stroke-width="1.8"/>
<text x="140.0" y="115.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">กลูโคส (6C)</text>
<rect x="45.0" y="185.0" width="190" height="60" rx="10" fill="#c8e6c9" stroke="#455a64" stroke-width="1.8"/>
<text x="140.0" y="211.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">ไกลโคลิซิส</text>
<text x="140.0" y="231.0" text-anchor="middle" font-size="12" fill="#37474f">สุทธิ 2 ATP และ 2 NADH</text>
<rect x="45.0" y="297.0" width="190" height="46" rx="10" fill="#fff" stroke="#455a64" stroke-width="1.8"/>
<text x="140.0" y="325.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">ไพรูเวต 2 โมเลกุล (3C)</text>
<line x1="140.0" y1="133.0" x2="140.0" y2="183.0" stroke="#555" stroke-width="2"/>
<polygon points="140.0,183.0 136.5,174.7 143.5,174.7" fill="#555"/>
<line x1="140.0" y1="246.0" x2="140.0" y2="295.0" stroke="#555" stroke-width="2"/>
<polygon points="140.0,295.0 136.5,286.7 143.5,286.7" fill="#555"/>
<rect x="440.0" y="168.0" width="160" height="64" rx="10" fill="#ffecb3" stroke="#455a64" stroke-width="1.8"/>
<text x="520.0" y="196.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">สร้างแอซิทิล CoA</text>
<text x="520.0" y="216.0" text-anchor="middle" font-size="12" fill="#37474f">2 CO₂ 2 NADH</text>
<rect x="645.0" y="168.0" width="170" height="64" rx="10" fill="#ffcc80" stroke="#455a64" stroke-width="1.8"/>
<text x="730.0" y="196.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">วัฏจักรเครบส์</text>
<text x="730.0" y="216.0" text-anchor="middle" font-size="12" fill="#37474f">2 ATP 6 NADH 2 FADH₂</text>
<text x="730.0" y="250.0" text-anchor="middle" font-size="12" fill="#37474f">4 CO₂</text>
<rect x="845.0" y="168.0" width="180" height="64" rx="10" fill="#ffab91" stroke="#455a64" stroke-width="1.8"/>
<text x="935.0" y="196.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">ถ่ายทอดอิเล็กตรอน</text>
<text x="935.0" y="216.0" text-anchor="middle" font-size="12" fill="#37474f">≈ 26–28 ATP</text>
<line x1="236.0" y1="315.0" x2="440.0" y2="215.0" stroke="#555" stroke-width="2"/>
<polygon points="440.0,215.0 434.1,221.8 431.0,215.5" fill="#555"/>
<text x="330.0" y="248.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">มี O₂ พอ</text>
<line x1="601.0" y1="200.0" x2="643.0" y2="200.0" stroke="#555" stroke-width="2"/>
<polygon points="643.0,200.0 634.7,203.5 634.7,196.5" fill="#555"/>
<line x1="816.0" y1="200.0" x2="843.0" y2="200.0" stroke="#555" stroke-width="2"/>
<polygon points="843.0,200.0 834.7,203.5 834.7,196.5" fill="#555"/>
<text x="935.0" y="282.0" text-anchor="middle" font-size="12" fill="#37474f">O₂ รับอิเล็กตรอน → H₂O</text>
<rect x="225.0" y="408.0" width="210" height="64" rx="10" fill="#e1f5fe" stroke="#455a64" stroke-width="1.8"/>
<text x="330.0" y="436.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">การหมักแอลกอฮอล์</text>
<text x="330.0" y="456.0" text-anchor="middle" font-size="12" fill="#37474f">ยีสต์: เอทานอล + CO₂</text>
<rect x="515.0" y="408.0" width="210" height="64" rx="10" fill="#f3e5f5" stroke="#455a64" stroke-width="1.8"/>
<text x="620.0" y="436.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">การหมักกรดแลกติก</text>
<text x="620.0" y="456.0" text-anchor="middle" font-size="12" fill="#37474f">กล้ามเนื้อ แบคทีเรีย: กรดแลกติก</text>
<line x1="160.0" y1="345.0" x2="300.0" y2="405.0" stroke="#555" stroke-width="2"/>
<polygon points="300.0,405.0 291.0,405.0 293.8,398.5" fill="#555"/>
<line x1="200.0" y1="343.0" x2="560.0" y2="405.0" stroke="#555" stroke-width="2"/>
<polygon points="560.0,405.0 551.2,407.0 552.4,400.1" fill="#555"/>
<text x="150.0" y="400.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">O₂ ไม่พอ</text>
<text x="880.0" y="430.0" text-anchor="start" font-size="13" fill="#222">ได้ ATP จากไกลโคลิซิสเท่านั้น</text>
<text x="880.0" y="452.0" text-anchor="start" font-size="13" fill="#222">(2 ATP ต่อกลูโคส)</text>
<text x="880.0" y="474.0" text-anchor="start" font-size="13" fill="#222">NAD⁺ ถูกสร้างกลับให้</text>
<text x="880.0" y="496.0" text-anchor="start" font-size="13" fill="#222">ไกลโคลิซิสทำต่อได้</text>
<text x="730.0" y="320.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#bf360c">รวมเมื่อมี O₂ พอ ≈ 30–32 ATP ต่อกลูโคส</text>
</svg>