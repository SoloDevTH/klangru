id: computer.programming.recursion
subject: computer
title: { th: การเรียกซ้ำ, en: "Recursion" }
summary: ฟังก์ชันที่เรียกตัวเอง กรณีฐานกับกรณีเรียกซ้ำ ไล่ลำดับการทำงานด้วยกองการเรียกและต้นไม้การเรียก การเรียกซ้ำกับลิสต์ สตริง และโฟลเดอร์ และการเทียบกับการวนซ้ำ
difficulty: 5.5
minutes: 45
prerequisites: [computer.programming.functions]
encompasses:
  - { id: computer.programming.functions, weight: 0.4 }
  - { id: computer.programming.basics, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: call-stack.svg
    alt: "ด้านซ้ายคือกองการเรียกขณะลึกที่สุด มีกรอบซ้อนกัน 4 กรอบ บนสุดคือ sum_to(0) n = 0 กรณีฐาน return 0 ถัดลงมาคือ sum_to(1) n = 1 รอ 1 + sum_to(0) แล้ว sum_to(2) n = 2 รอ 2 + sum_to(1) และล่างสุดคือ sum_to(3) n = 3 รอ 3 + sum_to(2) ใต้กองเขียนว่าเรียกครั้งแรกอยู่ล่างสุด กรอบใหม่วางซ้อนข้างบน ด้านขวาคือขาขึ้น กรอบบนสุดคืนค่าแล้วถูกยกออก ลูกศรชี้ลงตามลำดับ sum_to(0) คืน 0, sum_to(1) คืน 1 + 0 = 1, sum_to(2) คืน 2 + 1 = 3, sum_to(3) คืน 3 + 3 = 6 ผลสุดท้าย 6"
    caption: "ขาลงเรียกซ้อนกรอบจนถึงกรณีฐาน ขาขึ้นคืนค่าและยกกรอบออกทีละกรอบ"
  - type: worked-example
    title: ไล่การทำงานของ total([4, 7, 1])
    problem: |
      ไล่ลำดับการทำงานของฟังก์ชันนี้เมื่อเรียก `total([4, 7, 1])` บอกทุกการเรียกและค่าที่คืน

      ```python
      def total(a):
          if len(a) == 0:
              return 0
          return a[0] + total(a[1:])
      ```
    steps:
      - text: "การเรียกที่ 1: total([4, 7, 1]) ลิสต์ไม่ว่าง จึงรอผลของ 4 + total([7, 1])"
      - text: "การเรียกที่ 2: total([7, 1]) รอผลของ 7 + total([1])"
      - text: "การเรียกที่ 3: total([1]) รอผลของ 1 + total([])"
        why: "a[1:] ของลิสต์ที่มีตัวเดียวคือลิสต์ว่าง ปัญหาเล็กลงทุกครั้งจนถึงกรณีฐาน"
      - text: "การเรียกที่ 4: total([]) เป็นกรณีฐาน คืน 0 ทันที กองการเรียกลึกที่สุดตอนนี้ คือ 4 กรอบ"
      - text: "ขาขึ้น: total([1]) คืน 1 + 0 = 1 → total([7, 1]) คืน 7 + 1 = 8 → total([4, 7, 1]) คืน 4 + 8 = 12"
        why: "การบวกเกิดในขาขึ้นเท่านั้น เพราะแต่ละกรอบต้องรอค่าจากกรอบที่อยู่เหนือมันก่อน"
    answer: "เรียกทั้งหมด 4 ครั้ง กองลึกที่สุด 4 กรอบ คืนค่า 0, 1, 8 และ 12 ตามลำดับ ผลคือ 12"
  - { type: check, problem: computer.programming.recursion.p005, prompt: "นับจำนวนการเรียกให้รวมกรณีฐานด้วย" }
  - type: figure
    src: fib-tree.svg
    alt: "ต้นไม้การเรียกของ fib(4) รากคือ fib(4) แตกเป็น fib(3) ทางซ้ายและ fib(2) ทางขวา fib(3) แตกเป็น fib(2) และ fib(1) ส่วน fib(2) ทางขวาแตกเป็น fib(1) และ fib(0) และ fib(2) ทางซ้ายแตกเป็น fib(1) และ fib(0) โหนด fib(2) ทั้งสองเป็นสีส้ม โหนด fib(1) และ fib(0) เป็นสีเขียว มีป้ายคืน 1 หรือคืน 0 ใต้ภาพเขียนว่า fib(2) ถูกคำนวณซ้ำสองครั้ง กรณีฐาน n น้อยกว่า 2 รวม 9 การเรียก ลึกที่สุด 4 ชั้น"
    caption: "fib เรียกตัวเองสองกิ่ง จึงคำนวณค่าเดิมซ้ำ"
  - type: worked-example
    title: ตรวจคำที่อ่านกลับหลังได้ แบบเรียกซ้ำและแบบวนซ้ำ
    problem: "เขียนฟังก์ชันตรวจว่าสตริงอ่านจากหลังมาหน้าได้เหมือนเดิมหรือไม่ (เช่น \"นอน\" และ \"level\") ทั้งแบบเรียกซ้ำและแบบวนซ้ำ แล้วเทียบกัน"
    steps:
      - text: "หาปัญหาที่เล็กลง: สตริงอ่านกลับได้ ก็ต่อเมื่อตัวแรกเท่ากับตัวสุดท้าย และส่วนตรงกลาง `s[1:-1]` ก็อ่านกลับได้"
        why: "ส่วนตรงกลางเป็นสตริงแบบเดียวกันแต่สั้นลงสองตัว จึงเป็นปัญหาเดิมที่เล็กลง"
      - text: "กรณีฐาน: สตริงที่ยาว 0 หรือ 1 ตัวอ่านกลับได้เสมอ `if len(s) <= 1: return True`"
        why: "ต้องรวมความยาว 0 ด้วย เพราะสตริงความยาวคู่จะหดเหลือ 0 ตัว ไม่ผ่าน 1"
      - text: "แบบเรียกซ้ำ: `return s[0] == s[-1] and is_palindrome(s[1:-1])` ไล่ \"นอน\": น = น จึงตรวจ \"อ\" ซึ่งยาว 1 ได้ True"
      - text: "แบบวนซ้ำ: ตั้ง `i = 0` และ `j = len(s) - 1` วน `while i < j:` ถ้า `s[i] != s[j]` คืน False ไม่เช่นนั้นเลื่อน i ขึ้น j ลง ครบแล้วคืน True"
      - text: "เทียบ: ผลเหมือนกันทุกกรณี (\"กลม\" ได้ False ทั้งสองแบบ) แบบเรียกซ้ำอ่านตรงกับนิยาม แต่สร้างสตริงใหม่และกรอบใหม่ทุกชั้น แบบวนซ้ำใช้ตัวแปรสองตัวและไม่ติดขีดจำกัดความลึก"
    answer: "ทั้งสองแบบได้ True สำหรับ \"นอน\" และ \"level\" และ False สำหรับ \"กลม\" แบบเรียกซ้ำสั้นและตรงกับนิยาม แบบวนซ้ำประหยัดหน่วยความจำกว่าเมื่อสตริงยาวมาก"
  - { type: check, problem: computer.programming.recursion.p006, prompt: "คำสั่งก่อนและหลังการเรียกซ้ำทำงานตอนไหน" }
glossary:
  - { term: การเรียกซ้ำ (recursion), definition: "การที่ฟังก์ชันเรียกตัวเองกับปัญหาแบบเดียวกันที่เล็กลง" }
  - { term: กรณีฐาน (base case), definition: "กรณีที่ฟังก์ชันตอบได้ทันทีโดยไม่เรียกตัวเอง ทำให้การเรียกซ้ำหยุด" }
  - { term: กรณีเรียกซ้ำ (recursive case), definition: "กรณีที่ฟังก์ชันเรียกตัวเองกับปัญหาที่เล็กลงแล้วนำผลมาประกอบเป็นคำตอบ" }
  - { term: กรอบ (frame), definition: "พื้นที่เก็บพารามิเตอร์และตัวแปรของการเรียกฟังก์ชันแต่ละครั้ง" }
  - { term: กองการเรียก (call stack), definition: "กรอบของการเรียกที่ยังไม่จบ ซ้อนกันเป็นกอง กรอบบนสุดคือการเรียกที่กำลังทำงาน" }
  - { term: ต้นไม้การเรียก (call tree), definition: "แผนภาพที่แสดงว่าการเรียกแต่ละครั้งเรียกฟังก์ชันอะไรต่อ ใช้กับฟังก์ชันที่เรียกตัวเองหลายครั้ง" }
  - { term: RecursionError, definition: "ข้อผิดพลาดของ Python เมื่อการเรียกซ้อนลึกเกินขีดจำกัด ค่าเริ่มต้น 1,000 ชั้น" }
flashcards:
  - { front: "ฟังก์ชันเรียกซ้ำต้องมีอะไรสองอย่าง", back: "กรณีฐาน และการเรียกตัวเองกับปัญหาที่เล็กลงจนถึงฐาน" }
  - { front: "คำสั่งหลังการเรียกซ้ำทำงานเมื่อใด", back: "ในขาขึ้น หลังชั้นล่างทำเสร็จ จึงทำย้อนลำดับ" }
  - { front: "fib(5) เรียกกี่ครั้ง และกองลึกที่สุดกี่กรอบ", back: "เรียก 15 ครั้ง แต่ลึกที่สุด 5 กรอบ" }
  - { front: "ลืม return หน้าการเรียกซ้ำเกิดอะไร", back: "ชั้นนั้นคืน None ผลจากชั้นล่างหาย และอาจเกิด TypeError ที่ชั้นบน" }
  - { front: "เมื่อใดควรใช้การวนซ้ำแทนการเรียกซ้ำใน Python", back: "เมื่อต้องซ้อนลึกมาก (เกินราว 1,000 ชั้น) หรือเป็นการทำซ้ำตามลำดับธรรมดา" }
