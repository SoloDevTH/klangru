problems:
  - id: biology.cells.cell-basics.p001
    topics: [biology.cells.cell-basics]
    difficulty: 1
    type: mcq
    stem: "หน่วยที่เล็กที่สุดที่มีชีวิตและประกอบกันเป็นสิ่งมีชีวิตทุกชนิดคืออะไร"
    choices:
      - { id: a, text: "เซลล์", correct: true }
      - { id: b, text: "อวัยวะ", feedback: "อวัยวะประกอบด้วยเนื้อเยื่อหลายชนิด ซึ่งแต่ละชนิดประกอบด้วยเซลล์อีกที จึงใหญ่กว่าเซลล์มาก" }
      - { id: c, text: "เนื้อเยื่อ", feedback: "เนื้อเยื่อคือกลุ่มของเซลล์ เซลล์จึงเป็นหน่วยที่เล็กกว่า" }
      - { id: d, text: "นิวเคลียส", feedback: "นิวเคลียสเป็นส่วนหนึ่งของเซลล์ แยกออกมาอยู่เองไม่ได้ จึงไม่ใช่หน่วยที่มีชีวิต" }
    hints:
      - "สิ่งมีชีวิตบางชนิด เช่น อะมีบา มีแค่หน่วยนี้หน่วยเดียว"
      - "ต้องส่องกล้องจุลทรรศน์จึงจะเห็น"
    solution: "เซลล์เป็นหน่วยที่เล็กที่สุดที่มีชีวิต สิ่งมีชีวิตทุกชนิดประกอบด้วยเซลล์ตั้งแต่หนึ่งเซลล์ขึ้นไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-basics.p002
    topics: [biology.cells.cell-basics]
    difficulty: 1
    type: match
    stem: "จับคู่โครงสร้างของเซลล์กับหน้าที่"
    pairs:
      - { left: "ผนังเซลล์", right: "ให้ความแข็งแรงและคงรูปร่างของเซลล์พืช" }
      - { left: "เยื่อหุ้มเซลล์", right: "ควบคุมสารที่ผ่านเข้าออกเซลล์" }
      - { left: "นิวเคลียส", right: "มีสารพันธุกรรมและควบคุมการทำงานของเซลล์" }
      - { left: "แวคิวโอล", right: "เก็บน้ำและสารต่าง ๆ" }
      - { left: "ไมโทคอนเดรีย", right: "สลายอาหารให้ได้พลังงาน" }
      - { left: "คลอโรพลาสต์", right: "สังเคราะห์ด้วยแสง" }
    hints:
      - "โครงสร้างสีเขียวเกี่ยวกับแสง"
      - "ผนังเซลล์แข็ง ส่วนเยื่อหุ้มเซลล์บางและเลือกให้สารผ่าน"
    solution: "ผนังเซลล์ → ความแข็งแรง, เยื่อหุ้มเซลล์ → ควบคุมสารเข้าออก, นิวเคลียส → ควบคุมเซลล์, แวคิวโอล → เก็บน้ำและสาร, ไมโทคอนเดรีย → ให้พลังงาน, คลอโรพลาสต์ → สังเคราะห์ด้วยแสง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-basics.p003
    topics: [biology.cells.cell-basics]
    difficulty: 1
    type: text
    stem: "โครงสร้างสีเขียวในเซลล์ใบพืชที่มีคลอโรฟิลล์และใช้สังเคราะห์ด้วยแสงชื่อว่าอะไร"
    accepted: ["คลอโรพลาสต์", "chloroplast", "คลอโรพลาส"]
    hints:
      - "พบในเซลล์พืชแต่ไม่พบในเซลล์สัตว์"
      - "ชื่อขึ้นต้นด้วย คลอโร เหมือนคลอโรฟิลล์"
    misconceptions:
      - { match: "คลอโรฟิลล์", feedback: "คลอโรฟิลล์เป็นสารสีเขียวที่อยู่ข้างในโครงสร้างนี้ โจทย์ถามชื่อโครงสร้าง" }
      - { match: "ไมโทคอนเดรีย", feedback: "ไมโทคอนเดรียสลายอาหารให้ได้พลังงาน ไม่ได้มีสีเขียวและไม่ได้สังเคราะห์ด้วยแสง" }
    solution: "คลอโรพลาสต์ เป็นออร์แกเนลล์ที่มีคลอโรฟิลล์ ใช้พลังงานแสงสร้างอาหาร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-basics.p004
    topics: [biology.cells.cell-basics]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "นักเรียนส่องเซลล์ใบผักบุ้งเทียบกับเซลล์เยื่อบุข้างแก้ม โครงสร้างใดพบในทั้งสองเซลล์ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "เยื่อหุ้มเซลล์", correct: true }
      - { id: b, text: "นิวเคลียส", correct: true }
      - { id: c, text: "ไมโทคอนเดรีย", correct: true }
      - { id: d, text: "ผนังเซลล์", feedback: "ผนังเซลล์มีในเซลล์พืชเท่านั้น เซลล์สัตว์ไม่มี" }
      - { id: e, text: "คลอโรพลาสต์", feedback: "คลอโรพลาสต์มีในเซลล์ใบผักบุ้ง แต่เซลล์สัตว์ไม่มี" }
    hints:
      - "หาโครงสร้างที่ทุกเซลล์ต้องมีไม่ว่าพืชหรือสัตว์"
      - "ทั้งพืชและสัตว์ต้องสลายอาหารเพื่อใช้พลังงาน"
    solution: "ทั้งสองเซลล์มีเยื่อหุ้มเซลล์ ไซโทพลาซึม นิวเคลียส และไมโทคอนเดรีย ส่วนผนังเซลล์ คลอโรพลาสต์ และแวคิวโอลขนาดใหญ่พบในเซลล์พืช"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-basics.p005
    topics: [biology.cells.cell-basics]
    difficulty: 2
    type: order
    stem: "เรียงระดับการจัดระบบของสิ่งมีชีวิต จากเล็กที่สุดไปใหญ่ที่สุด"
    items:
      - "เซลล์"
      - "เนื้อเยื่อ"
      - "อวัยวะ"
      - "ระบบอวัยวะ"
      - "สิ่งมีชีวิต"
    hints:
      - "เซลล์ชนิดเดียวกันหลายเซลล์รวมกันเป็นอะไร"
      - "อวัยวะหลายอวัยวะทำงานร่วมกันเป็นอะไร"
    solution: "เซลล์ → เนื้อเยื่อ → อวัยวะ → ระบบอวัยวะ → สิ่งมีชีวิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-basics.p006
    topics: [biology.cells.cell-basics]
    difficulty: 2
    type: numeric
    stem: "กล้องจุลทรรศน์ในห้องเรียนมีเลนส์ใกล้ตากำลังขยาย 15 เท่า นักเรียนใช้เลนส์ใกล้วัตถุกำลังขยาย 10 เท่า ภาพมีกำลังขยายรวมกี่เท่า"
    answer: { value: 150, unit: เท่า }
    hints:
      - "กำลังขยายรวมขึ้นกับเลนส์ทั้งสองชุด"
      - "นำกำลังขยายของเลนส์ทั้งสองมาคูณกัน"
    misconceptions:
      - { match: 25, feedback: "นำกำลังขยายมาบวกกัน เลนส์สองชุดขยายต่อกัน จึงต้องคูณ" }
      - { match: 1.5, feedback: "นำมาหารกัน กำลังขยายรวมคือผลคูณ" }
    solution: "กำลังขยายรวม $= 15 \\times 10 = 150$ เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-basics.p007
    topics: [biology.cells.cell-basics]
    difficulty: 2
    type: match
    stem: "ภาพเซลล์พืชมีตัวอักษรชี้ส่วนต่าง ๆ จับคู่ตัวอักษรกับชื่อโครงสร้าง"
    figure: { src: plant-cell-letters.svg, alt: "เซลล์พืชรูปสี่เหลี่ยมมุมมน ก ชี้ที่ชั้นหนาสีเขียวเข้มด้านนอกสุดของเซลล์ ข ชี้ที่เม็ดรีสีเขียวเข้มมีเส้นด้านใน ซึ่งมีหลายเม็ดกระจายรอบเซลล์ ค ชี้ที่ถุงสีฟ้าขนาดใหญ่ตรงกลางเซลล์ ง ชี้ที่ก้อนกลมสีม่วงมีจุดเข้มด้านในที่มุมซ้ายบน" }
    pairs:
      - { left: "ก", right: "ผนังเซลล์" }
      - { left: "ข", right: "คลอโรพลาสต์" }
      - { left: "ค", right: "แวคิวโอล" }
      - { left: "ง", right: "นิวเคลียส" }
    hints:
      - "ส่วนที่อยู่นอกสุดของเซลล์พืชและหนาที่สุด"
      - "ในเซลล์พืชที่โตเต็มที่ แวคิวโอลกินพื้นที่ส่วนใหญ่ของเซลล์"
    solution: "ก = ผนังเซลล์ ข = คลอโรพลาสต์ ค = แวคิวโอลขนาดใหญ่ ง = นิวเคลียส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-basics.p008
    topics: [biology.cells.cell-basics]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "สิ่งมีชีวิตใดเป็นสิ่งมีชีวิตเซลล์เดียว (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "พารามีเซียมในน้ำบ่อ", correct: true }
      - { id: b, text: "ยีสต์ที่ใช้ทำขนมปัง", correct: true }
      - { id: c, text: "แบคทีเรียในนมเปรี้ยว", correct: true }
      - { id: d, text: "เห็ดฟาง", feedback: "เห็ดฟางมีเซลล์จำนวนมากเรียงเป็นเส้นใย จึงเป็นสิ่งมีชีวิตหลายเซลล์ แม้จะเป็นราเหมือนยีสต์" }
      - { id: e, text: "สาหร่ายหางกระรอก", feedback: "สาหร่ายหางกระรอกเป็นพืชที่มีใบ ลำต้น และเซลล์จำนวนมาก" }
    hints:
      - "สิ่งมีชีวิตเซลล์เดียวมักเล็กจนต้องใช้กล้องจุลทรรศน์"
      - "สิ่งมีชีวิตที่มีส่วนต่าง ๆ ให้เห็นด้วยตาเปล่ามักมีหลายเซลล์"
    solution: "พารามีเซียม ยีสต์ และแบคทีเรียมีเซลล์เดียว เห็ดฟางและสาหร่ายหางกระรอกมีหลายเซลล์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-basics.p009
    topics: [biology.cells.cell-basics]
    difficulty: 3
    type: match
    stem: "จับคู่เซลล์กับลักษณะที่ช่วยในการทำหน้าที่"
    pairs:
      - { left: "เซลล์เม็ดเลือดแดง", right: "แผ่นกลมเว้า ไม่มีนิวเคลียส บรรจุสารขนออกซิเจนได้มาก" }
      - { left: "เซลล์ประสาท", right: "มีแขนงยาวส่งกระแสประสาทไปได้ไกล" }
      - { left: "เซลล์ขนราก", right: "มีส่วนยื่นยาวเพิ่มพื้นที่ดูดน้ำ" }
      - { left: "เซลล์คุม", right: "อยู่เป็นคู่ เปลี่ยนรูปร่างเพื่อเปิดปิดปากใบ" }
      - { left: "เซลล์อสุจิ", right: "มีหางยาวช่วยในการเคลื่อนที่" }
    hints:
      - "ดูภาพเซลล์ที่มีรูปร่างเหมาะกับหน้าที่"
      - "เซลล์ใดต้องสัมผัสดินมาก และเซลล์ใดต้องเคลื่อนที่"
    solution: "เม็ดเลือดแดง → ขนออกซิเจน, ประสาท → แขนงยาว, ขนราก → ส่วนยื่นดูดน้ำ, เซลล์คุม → เปิดปิดปากใบ, อสุจิ → หางยาว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-basics.p010
    topics: [biology.cells.cell-basics]
    difficulty: 3
    type: mcq
    stem: "นักเรียนส่องเซลล์เยื่อหอมหัวใหญ่ด้านในแล้วไม่พบคลอโรพลาสต์เลย ข้อใดอธิบายได้ถูกต้อง"
    choices:
      - { id: a, text: "หัวหอมเป็นส่วนสะสมอาหารที่ไม่ได้รับแสง เซลล์ส่วนนี้จึงไม่มีคลอโรพลาสต์", correct: true }
      - { id: b, text: "หอมหัวใหญ่ไม่ใช่พืช", feedback: "หอมหัวใหญ่เป็นพืช เซลล์มีผนังเซลล์และแวคิวโอลขนาดใหญ่ แค่ส่วนที่ส่องไม่มีคลอโรพลาสต์" }
      - { id: c, text: "คลอโรพลาสต์เล็กเกินกว่ากล้องจุลทรรศน์ใช้แสงจะเห็น", feedback: "คลอโรพลาสต์ในเซลล์ใบ เช่น สาหร่ายหางกระรอก เห็นได้ชัดด้วยกล้องจุลทรรศน์ใช้แสง" }
      - { id: d, text: "สีย้อมไอโอดีนทำลายคลอโรพลาสต์", feedback: "แม้ไม่ย้อมสีก็ไม่พบคลอโรพลาสต์ในเยื่อหอมด้านใน เพราะเซลล์ส่วนนี้ไม่มีตั้งแต่แรก" }
    hints:
      - "คลอโรพลาสต์ทำหน้าที่อะไร และต้องใช้อะไร"
      - "กลีบหัวหอมอยู่ใต้ดินหรือถูกห่อหุ้มไว้"
    solution: "คลอโรพลาสต์พบในเซลล์ของส่วนที่ได้รับแสงและสังเคราะห์ด้วยแสง หัวหอมเป็นส่วนสะสมอาหารที่ถูกห่อหุ้ม เซลล์จึงไม่มีคลอโรพลาสต์ แต่ยังมีผนังเซลล์และแวคิวโอลขนาดใหญ่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-basics.p011
    topics: [biology.cells.cell-basics]
    difficulty: 3
    type: numeric
    stem: "นักเรียนวาดภาพเซลล์ที่เห็นจากกล้องกำลังขยาย 400 เท่า ภาพที่วาดยาว 30 มิลลิเมตร เซลล์จริงยาวกี่ไมโครเมตร ($1\\ \\mathrm{mm} = 1000\\ \\mu\\mathrm{m}$)"
    answer: { value: 75, unit: µm }
    hints:
      - "ขนาดจริง = ขนาดของภาพ ÷ กำลังขยาย"
      - "หารแล้วได้หน่วยมิลลิเมตร ให้คูณ 1,000 เพื่อเปลี่ยนเป็นไมโครเมตร"
    misconceptions:
      - { match: 0.075, feedback: "นี่คือคำตอบในหน่วยมิลลิเมตร ต้องคูณ 1,000 เป็นไมโครเมตร" }
      - { match: 12000, feedback: "นำ 30 คูณ 400 แต่ภาพที่วาดถูกขยายแล้ว ขนาดจริงต้องเล็กกว่า จึงต้องหาร" }
    solution: "ขนาดจริง $= \\frac{30}{400} = 0.075\\ \\mathrm{mm} = 0.075 \\times 1000 = 75\\ \\mu\\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cell-basics.p012
    topics: [biology.cells.cell-basics]
    difficulty: 3
    type: mcq
    stem: "หัวใจประกอบด้วยเนื้อเยื่อกล้ามเนื้อ เนื้อเยื่อประสาท และเนื้อเยื่อเกี่ยวพัน หัวใจจัดอยู่ในระดับใด"
    choices:
      - { id: a, text: "อวัยวะ", correct: true }
      - { id: b, text: "เนื้อเยื่อ", feedback: "เนื้อเยื่อประกอบด้วยเซลล์ชนิดเดียวกัน หัวใจมีเนื้อเยื่อหลายชนิดรวมกัน จึงเป็นระดับที่สูงกว่า" }
      - { id: c, text: "ระบบอวัยวะ", feedback: "ระบบหมุนเวียนเลือดประกอบด้วยหลายอวัยวะ คือ หัวใจ หลอดเลือด และเลือด หัวใจเป็นเพียงอวัยวะหนึ่งในระบบ" }
      - { id: d, text: "เซลล์", feedback: "หัวใจมีเซลล์จำนวนมหาศาลหลายชนิด จึงไม่ใช่ระดับเซลล์" }
    hints:
      - "เนื้อเยื่อหลายชนิดมารวมกันทำหน้าที่หนึ่ง เรียกว่าอะไร"
      - "ระบบอวัยวะต้องมีหลายอวัยวะ"
