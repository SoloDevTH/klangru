id: biology.animals.tissues-body-plan
subject: biology
title: { th: รูปร่างกับขนาดของสัตว์และเนื้อเยื่อหลัก, en: "Body form, size and animal tissues" }
summary: อัตราส่วนพื้นที่ผิวต่อปริมาตรกับขนาดของสัตว์ การรักษาอุณหภูมิ และเนื้อเยื่อหลักสี่ชนิด ได้แก่ เยื่อบุผิว เนื้อเยื่อเกี่ยวพัน กล้ามเนื้อ และเนื้อเยื่อประสาท
difficulty: 5.5
minutes: 45
prerequisites: [biology.cells.cell-structure, biology.animals.homeostasis]
encompasses:
  - { id: biology.cells.cell-structure, weight: 0.2 }
  - { id: biology.animals.homeostasis, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ลูกบาศก์สามขนาดกับอัตราส่วนพื้นที่ผิวต่อปริมาตร
    src: surface-volume.svg
    alt: "ลูกบาศก์สามลูกเรียงจากซ้ายไปขวาตามขนาดที่ใหญ่ขึ้น ด้าน 1 cm มีพื้นที่ผิว 6 cm² ปริมาตร 1 cm³ อัตราส่วน 6 ต่อ cm ด้าน 2 cm มีพื้นที่ผิว 24 cm² ปริมาตร 8 cm³ อัตราส่วน 3 ต่อ cm และด้าน 4 cm มีพื้นที่ผิว 96 cm² ปริมาตร 64 cm³ อัตราส่วน 1.5 ต่อ cm เมื่อด้านยาวขึ้น ปริมาตรเพิ่มเร็วกว่าพื้นที่ผิว"
    caption: "อัตราส่วนลดลงเมื่อขนาดใหญ่ขึ้น (แผนภาพวาดโดยทีมคลังรู้)"
  - type: worked-example
    title: เปรียบเทียบอัตราส่วนของลูกบาศก์สองขนาด
    problem: "ลูกบาศก์ด้าน 5 cm กับด้าน 10 cm ลูกใดมีอัตราส่วนพื้นที่ผิวต่อปริมาตรมากกว่า และมากกว่ากี่เท่า"
    steps:
      - text: "ใช้สูตร อัตราส่วน = $\\frac{6}{L}$ คำนวณลูกที่ด้าน 5 cm: $\\frac{6}{5} = 1.2$ ต่อ cm"
        why: "สูตรนี้มาจากพื้นที่ผิว $6L^2$ หารด้วยปริมาตร $L^3$"
      - text: "คำนวณลูกที่ด้าน 10 cm: $\\frac{6}{10} = 0.6$ ต่อ cm"
      - text: "เปรียบเทียบ ลูกด้าน 5 cm มีอัตราส่วนมากกว่า และ $1.2 \\div 0.6 = 2$"
        why: "อัตราส่วนที่ใหญ่กว่าอยู่ในตัวตั้ง การเอาค่าที่มากกว่าหารด้วยค่าที่น้อยกว่าจะได้จำนวนเท่า"
    answer: "ลูกด้าน 5 cm มีอัตราส่วนพื้นที่ผิวต่อปริมาตรมากกว่าลูกด้าน 10 cm อยู่ 2 เท่า"
  - type: figure
    title: เนื้อเยื่อหลักสี่ชนิดของสัตว์
    src: tissues.svg
    alt: "ภาพแบ่งเป็นสี่กรอบ กรอบ ก เยื่อบุผิววาดเซลล์เรียงเป็นแถวสามแบบ แถวบนเป็นเซลล์แบนรูปวงรี แถวกลางเป็นเซลล์ลูกบาศก์สีเขียว แถวล่างเป็นเซลล์ทรงกระบอกสูงเรียงชิดกัน กรอบ ข เนื้อเยื่อเกี่ยวพันวาดเซลล์รูปดาวกระจายอยู่ในเส้นใยคลื่นสีน้ำตาล กรอบ ค กล้ามเนื้อสามชนิด ได้แก่ โครงร่างเป็นเส้นยาวมีลาย เรียบเป็นเซลล์รูปเรียวไม่มีลาย และหัวใจเป็นเซลล์แตกกิ่งมีลายและรอยต่อสีเข้ม กรอบ ง เนื้อเยื่อประสาทวาดนิวรอนที่มีตัวเซลล์กลม เดนไดรต์แตกกิ่งรอบตัวเซลล์ และแอกซอนยาวที่มีปลอกไมอีลินสีเหลือง"
    caption: "เนื้อเยื่อหลักสี่ชนิดที่พบในสัตว์ทั่วไป (แผนภาพวาดโดยทีมคลังรู้)"
  - { type: check, problem: biology.animals.tissues-body-plan.p005, prompt: "ลองคิดก่อนอ่านต่อ: ทำไมลูกนกกระจอกตัวเล็กต้องกินอาหารบ่อย" }
glossary:
  - { term: อัตราส่วนพื้นที่ผิวต่อปริมาตร, definition: "พื้นที่ผิวของวัตถุหารด้วยปริมาตร สัตว์ที่ตัวเล็กมีค่านี้สูง จึงเสียความร้อนได้เร็ว" }
  - { term: สัตว์เลือดอุ่น, definition: "สัตว์ที่ผลิตความร้อนจากเมแทบอลิซึมของร่างกายเป็นหลัก เช่น นกและสัตว์เลี้ยงลูกด้วยนม" }
  - { term: สัตว์เลือดเย็น, definition: "สัตว์ที่พึ่งความร้อนจากสิ่งแวดล้อมเป็นหลัก เช่น กิ้งก่าและงู ไม่ได้หมายความว่าอุณหภูมิเย็นเสมอ" }
  - { term: เนื้อเยื่อ, definition: "กลุ่มเซลล์ที่มีรูปร่างและหน้าที่คล้ายกันทำงานร่วมกัน เช่น เนื้อเยื่อบุผิว เนื้อเยื่อเกี่ยวพัน" }
  - { term: เมทริกซ์นอกเซลล์, definition: "สารระหว่างเซลล์ในเนื้อเยื่อเกี่ยวพัน ประกอบด้วยเส้นใยและสารเหนียวที่ให้ความแข็งหรือยืดหยุ่น" }
  - { term: เซลล์เกลีย, definition: "เซลล์ในเนื้อเยื่อประสาทที่ค้ำจุน หุ้ม และดูแลนิวรอน" }
flashcards:
  - { front: "อัตราส่วนพื้นที่ผิวต่อปริมาตรของลูกบาศก์ด้าน L คือเท่าไร", back: "6 ÷ L (พื้นที่ผิว 6L² หารด้วยปริมาตร L³)" }
  - { front: "สัตว์เลือดอุ่นกับสัตว์เลือดเย็นต่างกันที่อะไร", back: "เลือดอุ่นผลิตความร้อนจากเมแทบอลิซึมเป็นหลัก เลือดเย็นพึ่งความร้อนจากภายนอก" }
  - { front: "เนื้อเยื่อหลักสี่ชนิดของสัตว์คืออะไร", back: "เยื่อบุผิว เนื้อเยื่อเกี่ยวพัน เนื้อเยื่อกล้ามเนื้อ และเนื้อเยื่อประสาท" }
  - { front: "กล้ามเนื้อหัวใจมีลักษณะอย่างไร", back: "มีลาย เซลล์แตกกิ่ง มีรอยต่อพิเศษ ทำงานโดยไม่ต้องสั่งการ" }
