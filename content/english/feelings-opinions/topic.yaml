id: english.speaking.feelings-opinions
subject: english
title: { th: "การพูดและเขียนแสดงความรู้สึก ความคิดเห็น และเหตุผล", en: "Expressing feelings, opinions and reasons" }
summary: บอกความชอบและความรู้สึก (-ed/-ing) แสดงความคิดเห็นด้วย I think, In my opinion เห็นด้วยและแย้งอย่างสุภาพ และให้เหตุผลกับตัวอย่างแบบ O-R-E-O
difficulty: 4
minutes: 40
prerequisites: [english.grammar.connectors]
encompasses:
  - { id: english.grammar.connectors, weight: 0.4 }
curriculum_tags: []
lessons:
  - type: figure
    src: ed-ing.svg
    alt: "ภาพสองฝั่ง ฝั่งซ้ายเป็นจอทีวีขึ้นข้อความ THE END? และ 3 hours 40 min ใต้ภาพเขียนว่า The film is boring. (หนังน่าเบื่อ) ลูกศรคำว่า ทำให้ ชี้ไปทางขวา ฝั่งขวาเป็นคนหลับตาหาว มีตัว z z ลอยอยู่ ใต้ภาพเขียนว่า He is bored. (เขารู้สึกเบื่อ) หัวภาพเขียนว่า -ing = สิ่งที่ทำให้รู้สึก · -ed = คนที่รู้สึก"
    caption: "boring (สิ่งที่ทำให้เบื่อ) กับ bored (คนที่เบื่อ)"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.speaking.feelings-opinions.p001, prompt: "ฉันเบื่อ ใช้ bored หรือ boring" }
  - type: figure
    src: oreo.svg
    alt: "ภาพขนมแซนด์วิชสี่ชั้นชื่อ O-R-E-O: ความเห็น → เหตุผล → ตัวอย่าง → สรุปความเห็น ชั้นที่ 1 สีน้ำตาลเข้ม O Opinion: I think students should learn to swim at school. ชั้นที่ 2 สีครีม R Reason: because Thailand has many rivers, canals and beaches. ชั้นที่ 3 สีครีม E Example: For example, every student at my cousin's school can swim. ชั้นที่ 4 สีน้ำตาลเข้ม O Opinion again: That's why I believe swimming lessons are important."
    caption: "โครงสร้าง O-R-E-O ของการแสดงความคิดเห็น"
  - type: worked-example
    title: แสดงความคิดเห็นเรื่องในโรงเรียนให้ครบ O-R-E-O
    problem: "ครูถามว่า *Should our school stop selling sweet drinks?* ตอบเป็นภาษาอังกฤษสี่ประโยคตามโครงสร้าง O-R-E-O"
    steps:
      - text: "Opinion บอกจุดยืนให้ชัด: *I think our school should stop selling sweet drinks.*"
      - text: "Reason ให้เหตุผลด้วย because: *because too much sugar is bad for our teeth and can make us gain weight.*"
      - text: "Example ยกตัวอย่างที่เห็นจริง: *For example, many students in my class buy two bottles of sweet tea every day.*"
        why: "ตัวอย่างใกล้ตัวทำให้เหตุผลน่าเชื่อขึ้น"
      - text: "Opinion again สรุปซ้ำด้วยคำต่างจากเดิม: *That's why I believe water and milk are better choices.*"
    answer: "*I think our school should stop selling sweet drinks because too much sugar is bad for our teeth and can make us gain weight. For example, many students in my class buy two bottles of sweet tea every day. That's why I believe water and milk are better choices.*"
  - { type: check, problem: english.speaking.feelings-opinions.p007, prompt: "ตอบประโยคปฏิเสธว่า ฉันก็เหมือนกัน อย่างไร" }
glossary:
  - { term: opinion, definition: "ความคิดเห็น สิ่งที่เราคิดหรือตัดสิน ตรวจสอบว่าจริงหรือเท็จไม่ได้" }
  - { term: reason, definition: "เหตุผลที่สนับสนุนความคิดเห็น มักนำด้วย because, since" }
  - { term: example, definition: "ตัวอย่างที่ทำให้เหตุผลชัดขึ้น นำด้วย For example, For instance, such as" }
  - { term: -ed adjective, definition: "คุณศัพท์บอกความรู้สึกของคน เช่น bored, excited, worried" }
  - { term: -ing adjective, definition: "คุณศัพท์บอกสิ่งที่ทำให้รู้สึก เช่น boring, exciting, worrying" }
  - { term: agree / disagree, definition: "เห็นด้วย / ไม่เห็นด้วย (เป็นกริยา ไม่ใช้ am agree)" }
flashcards:
  - { front: "ฉันเบื่อ / หนังน่าเบื่อ", back: "I'm bored. / The film is boring." }
  - { front: "O-R-E-O", back: "Opinion → Reason → Example → Opinion again" }
  - { front: "I love it. (ฉันก็ชอบ) · I don't like it. (ฉันก็ไม่ชอบ)", back: "So do I. / Me too. · Neither do I. / Me neither." }
  - { front: "แย้งอย่างสุภาพ", back: "I see your point, but I think ... · I don't really agree because ..." }
  - { front: "enjoy / don't mind / can't stand + ...", back: "V-ing เช่น I enjoy reading." }
