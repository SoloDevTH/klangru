<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="sans-serif">
<title>เครื่องบินต้องการบินไปทางเหนือ มีลมพัดจากตะวันตกไปตะวันออก หัวเครื่องต้องเบี่ยงทวนลม</title>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f2937"/></marker><marker id="ab" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1d4ed8"/></marker><marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#15803d"/></marker><marker id="ao" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c2410c"/></marker></defs>
<rect width="640" height="330" fill="#ffffff"/>
<line x1="300.0" y1="300.0" x2="300.0" y2="40.0" stroke="#15803d" stroke-width="3" marker-end="url(#ag)"/>
<text x="310.0" y="60.0" text-anchor="start" font-size="13" fill="#15803d" font-weight="normal">เส้นทางที่ต้องการ (เหนือ)</text>
<line x1="300.0" y1="300.0" x2="237.9" y2="68.2" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ab)"/>
<text x="227.9" y="78.2" text-anchor="end" font-size="13" fill="#1d4ed8" font-weight="normal">หัวเครื่องบิน (ความเร็วอากาศ)</text>
<path d="M 300 240 A 60 60 0 0 0 284.5 242.0" fill="none" stroke="#111" stroke-width="1.5"/>
<text x="252.2" y="232.5" text-anchor="middle" font-size="15" fill="#111" font-weight="normal">θ</text>
<line x1="70.0" y1="120.0" x2="190.0" y2="120.0" stroke="#7c3aed" stroke-width="3" marker-end="url(#ao)"/>
<text x="130.0" y="100.0" text-anchor="middle" font-size="13" fill="#6d28d9" font-weight="normal">ลม 30 m/s</text>
<text x="130.0" y="140.0" text-anchor="middle" font-size="12" fill="#6d28d9" font-weight="normal">พัดจากตะวันตกไปตะวันออก</text>
<text x="320.0" y="316.0" text-anchor="middle" font-size="12" fill="#555" font-weight="normal">ภาพไม่ได้วาดตามมาตราส่วนและมุมไม่ถูกต้องตามขนาด เพื่อให้มองเห็นทิศทาง</text>
</svg>