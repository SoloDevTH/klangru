  - id: computer.security.risk-policy.p015
    topics: [computer.security.risk-policy]
    difficulty: 4
    type: code
    stem: "เขียนฟังก์ชัน rank_risks(risks) โดย risks เป็นลิสต์ของดิกชันนารีที่มีคีย์ name, likelihood และ impact ให้คืนลิสต์ของชื่อความเสี่ยงเรียงจากคะแนนสูงไปต่ำ คะแนนคือ likelihood คูณ impact ถ้าคะแนนเท่ากันให้เรียงชื่อจาก ก ถึง ฮ (ตามลำดับพจนานุกรม)"
    starter: |
      def rank_risks(risks):
          # เรียงตามคะแนนมากไปน้อย แล้วตามชื่อ
          return [r["name"] for r in risks]
    tests: |
      items = [
          {"name": "ระบบล่ม", "likelihood": 4, "impact": 3},
          {"name": "ข้อมูลรั่ว", "likelihood": 2, "impact": 5},
          {"name": "ไฟดับ", "likelihood": 3, "impact": 4},
          {"name": "ไวรัส", "likelihood": 2, "impact": 6},
      ]
      assert rank_risks(items) == ['ระบบล่ม', 'ไฟดับ', 'ไวรัส', 'ข้อมูลรั่ว'], f"ลำดับที่ถูกคือ ['ระบบล่ม', 'ไฟดับ', 'ไวรัส', 'ข้อมูลรั่ว'] แต่ได้ {rank_risks(items)}"
    reference: |
      def rank_risks(risks):
          ordered = sorted(risks, key=lambda r: (-(r["likelihood"] * r["impact"]), r["name"]))
          return [r["name"] for r in ordered]
    hints:
      - "คำนวณคะแนนของแต่ละรายการด้วย likelihood คูณ impact"
      - "ใช้ sorted กับ key ที่ประกอบด้วยคะแนนติดลบเพื่อให้เรียงจากมากไปน้อย แล้วตามด้วยชื่อ"
    solution: "sorted โดย key เป็น (-คะแนน, ชื่อ) แล้วดึงเฉพาะชื่อออกมา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.risk-policy.p016
    topics: [computer.security.risk-policy]
    difficulty: 4
    type: code
    stem: "เขียนฟังก์ชัน can_access(role, resource, permissions) โดย permissions เป็นดิกชันนารีจากชื่อบทบาทเป็นเซตของทรัพยากรที่อนุญาต ให้คืน True เฉพาะเมื่อบทบาทนั้นมีสิทธิ์กับทรัพยากรนั้น ถ้าไม่รู้จักบทบาทให้คืน False (ปฏิเสธไว้ก่อน)"
    starter: |
      def can_access(role, resource, permissions):
          # ตอนนี้อนุญาตทุกอย่าง ซึ่งไม่ปลอดภัย
          return True
    tests: |
      perm = {"teacher": {"grades:m4-1"}, "admin": {"grades:m4-1", "grades:m4-2"}}
      assert can_access("teacher", "grades:m4-1", perm) == True, "ครูควรเข้าถึงคะแนนห้อง ม.4/1 ได้"
      assert can_access("teacher", "grades:m4-2", perm) == False, "ครูไม่มีสิทธิ์กับห้อง ม.4/2"
      assert can_access("guest", "grades:m4-1", perm) == False, "บทบาทที่ไม่รู้จักต้องถูกปฏิเสธ"
      assert can_access("admin", "grades:m4-2", perm) == True, "ผู้ดูแลมีสิทธิ์กับห้อง ม.4/2"
    reference: |
      def can_access(role, resource, permissions):
          return resource in permissions.get(role, set())
    hints:
      - "ใช้ permissions.get(role, set()) เพื่อรองรับบทบาทที่ไม่รู้จัก"
      - "ตรวจว่า resource เป็นสมาชิกของเซตที่ได้มาหรือไม่"
    solution: "คืนค่า resource in permissions.get(role, set()) ซึ่งปฏิเสธเมื่อไม่รู้จักบทบาทตามหลักปฏิเสธไว้ก่อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.risk-policy.p017
    topics: [computer.security.risk-policy]
    difficulty: 4
    type: mcq
    stem: "แนวทาง NIST SP 800-63B-4 (ฉบับปี 2025) เกี่ยวกับรหัสผ่านที่ใช้เป็นปัจจัยเดียวในการเข้าสู่ระบบ ข้อใดสอดคล้องที่สุด"
    choices:
      - { id: a, text: "ต้องมีอักขระพิเศษอย่างน้อยสามตัวทุกครั้ง", feedback: "NIST ห้ามบังคับกฎการผสมชนิดอักขระ ความยาวสำคัญกว่า" }
      - { id: b, text: "ต้องเปลี่ยนทุกเดือนโดยไม่มีข้อยกเว้น", feedback: "แนวทางนี้ห้ามบังคับเปลี่ยนรหัสตามรอบเวลา ให้เปลี่ยนเมื่อมีหลักฐานว่ารหัสรั่ว" }
      - { id: c, text: "ยาวอย่างน้อย 4 ตัวอักษรก็พอสำหรับทุกระบบ", feedback: "สั้นเกินไปมาก รหัสผ่านที่ใช้เป็นปัจจัยเดียวต้องยาวอย่างน้อย 15 ตัวอักษร และแม้ใช้ร่วมกับปัจจัยอื่นก็ต้องไม่ต่ำกว่า 8 ตัว" }
      - { id: d, text: "ต้องยาวอย่างน้อย 15 ตัวอักษร และห้ามบังคับกฎการผสมชนิดอักขระ", correct: true }
    hints:
      - "แนวทางฉบับใหม่ให้น้ำหนักกับความยาวมากกว่ากฎที่ซับซ้อน"
      - "ข้อที่บังคับเปลี่ยนตามเวลาหรือบังคับชนิดอักขระขัดกับแนวทางนี้"
    solution: "NIST SP 800-63B-4 กำหนดให้รหัสผ่านที่ใช้เป็นปัจจัยเดียวยาวอย่างน้อย 15 ตัวอักษร (ถ้าใช้ร่วมกับปัจจัยอื่นยอมให้สั้นลงได้ แต่ไม่ต่ำกว่า 8 ตัว) ห้ามบังคับกฎการผสมชนิดอักขระ และห้ามบังคับเปลี่ยนตามรอบเวลา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.risk-policy.p018
    topics: [computer.security.risk-policy]
    difficulty: 5
    type: numeric
    stem: "ระบบจองห้องคอมพิวเตอร์ของโรงเรียนอาจเสียหายครั้งละ 50,000 บาทเมื่อเกิดเหตุ คาดว่าเหตุนี้เกิดขึ้นเฉลี่ยปีละ 0.5 ครั้ง ค่าความเสียหายรายปีที่คาดไว้เท่ากับกี่บาท (ตอบเป็นจำนวนเต็ม หน่วยบาท)"
    answer: { value: 25000, unit: บาท }
    hints:
      - "ค่าความเสียหายรายปีที่คาดไว้ = ความเสียหายต่อครั้ง × จำนวนครั้งต่อปี"
      - "เอา 0.5 ไปคูณ ไม่ใช่หาร"
    misconceptions:
      - { match: 50000, feedback: "50,000 คือความเสียหายต่อครั้ง ยังไม่ได้คิดความถี่เฉลี่ยต่อปี" }
      - { match: 100000, feedback: "นี่คือการหารด้วย 0.5 แทนการคูณ ความถี่ที่น้อยกว่า 1 ครั้งต่อปีทำให้ความเสียหายรายปีลดลง" }
    solution: "ค่าที่คาดไว้รายปี $= 50{,}000 \\times 0.5 = 25{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

