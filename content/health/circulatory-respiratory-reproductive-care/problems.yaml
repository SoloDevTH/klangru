problems:
- id: health.body.circulatory-respiratory-reproductive-care.p001
  topics:
  - health.body.circulatory-respiratory-reproductive-care
  difficulty: 1
  type: mcq
  stem: อวัยวะใดสูบฉีดเลือดไปทั่วร่างกาย
  choices:
  - id: a
    text: หัวใจ
    correct: true
  - id: b
    text: ปอด
    feedback: ปอดแลกเปลี่ยนแก๊ส แต่ไม่ได้สูบฉีดเลือด
  - id: c
    text: ไต
    feedback: ไตกรองของเสียออกจากเลือด
  hints:
  - อวัยวะนี้เต้นเป็นจังหวะ คลำได้เป็นชีพจร
  - อยู่ในทรวงอกค่อนไปทางซ้าย
  solution: หัวใจเป็นกล้ามเนื้อที่บีบตัวสูบฉีดเลือดไปทั่วร่างกายตลอดชีวิต
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.circulatory-respiratory-reproductive-care.p002
  topics:
  - health.body.circulatory-respiratory-reproductive-care
  difficulty: 1
  type: match
  stem: จับคู่อวัยวะกับระบบที่อวัยวะนั้นเป็นส่วนหนึ่ง
  pairs:
  - left: ปอด
    right: ระบบหายใจ
  - left: หลอดเลือด
    right: ระบบไหลเวียนโลหิต
  - left: รังไข่และอัณฑะ
    right: ระบบสืบพันธุ์
  hints:
  - ระบบหายใจเกี่ยวกับอากาศ
  - ระบบสืบพันธุ์สร้างเซลล์สืบพันธุ์และฮอร์โมนเพศ
  solution: ปอดอยู่ในระบบหายใจ หลอดเลือดอยู่ในระบบไหลเวียนโลหิต รังไข่และอัณฑะอยู่ในระบบสืบพันธุ์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.circulatory-respiratory-reproductive-care.p003
  topics:
  - health.body.circulatory-respiratory-reproductive-care
  difficulty: 2
  type: order
  stem: เรียงทางที่อากาศเดินทางเมื่อหายใจเข้า
  items:
  - จมูก
  - คอหอย
  - กล่องเสียง
  - หลอดลม
  - ปอด
  hints:
  - อากาศเข้าทางจมูกก่อน
  - ปอดเป็นปลายทางที่มีถุงลม
  solution: จมูก → คอหอย → กล่องเสียง → หลอดลม → ปอด (ถุงลม)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.circulatory-respiratory-reproductive-care.p004
  topics:
  - health.body.circulatory-respiratory-reproductive-care
  difficulty: 2
  type: mcq
  stem: ฮอร์โมนเพศซึ่งสร้างจากอวัยวะสืบพันธุ์ มีผลต่อการเจริญเติบโตอย่างไร
  choices:
  - id: a
    text: ทำให้ร่างกายเปลี่ยนแปลงเข้าสู่วัยรุ่นและช่วยให้กระดูกและกล้ามเนื้อเติบโต
    correct: true
  - id: b
    text: ทำให้หัวใจหยุดเต้นช้าลง
    feedback: ฮอร์โมนเพศไม่ได้มีหน้าที่ควบคุมการเต้นของหัวใจ
  - id: c
    text: ไม่มีผลใดจนกว่าจะเป็นผู้ใหญ่
    feedback: ฮอร์โมนเพศเริ่มทำงานมากขึ้นตั้งแต่วัยรุ่น
  hints:
  - ฮอร์โมนเดินทางไปกับเลือดทั่วร่างกาย
  - ช่วงที่ร่างกายเปลี่ยนแปลงมากคือวัยรุ่น
  solution: ฮอร์โมนเพศทำให้ร่างกายเปลี่ยนแปลงในวัยรุ่น เช่น สูงขึ้นเร็ว เสียงแตก มีประจำเดือน จึงสำคัญต่อการเจริญเติบโตและพัฒนาการ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.circulatory-respiratory-reproductive-care.p005
  topics:
  - health.body.circulatory-respiratory-reproductive-care
  difficulty: 2
  type: numeric
  stem: มายด์นับชีพจรที่ข้อมือได้ 21 ครั้งใน 15 วินาที ชีพจรของมายด์เท่ากับกี่ครั้งต่อนาที (ตอบเป็นครั้งต่อนาที)
  answer:
    value: 84
    unit: ครั้งต่อนาที
  misconceptions:
  - match: 21
    feedback: 21 ครั้งนับใน 15 วินาที ต้องคูณ 4 ให้เป็นหนึ่งนาที
  - match: 36
    feedback: นำ 21 บวก 15 ไม่ได้ 1 นาทีมี 60 วินาที ซึ่งเท่ากับ 4 เท่าของ 15 วินาที
  hints:
  - 1 นาทีมีกี่ช่วง 15 วินาที
  - 60 ÷ 15 = 4
  solution: 1 นาทีมี 4 ช่วง 15 วินาที ชีพจร = 21 × 4 = 84 ครั้งต่อนาที
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.circulatory-respiratory-reproductive-care.p006
  topics:
  - health.body.circulatory-respiratory-reproductive-care
  difficulty: 2
  type: mcq
  stem: ข้อใดช่วยดูแลระบบหายใจได้ดีที่สุด
  choices:
  - id: a
    text: อยู่ห่างจากควันบุหรี่และดูค่าฝุ่นก่อนออกกำลังกายกลางแจ้ง
    correct: true
  - id: b
    text: ลองสูบบุหรี่ไฟฟ้าเพราะเป็นแค่ไอน้ำ
    feedback: องค์การอนามัยโลกระบุว่าบุหรี่ไฟฟ้าเป็นอันตรายและไม่ปลอดภัย
  - id: c
    text: ปิดปากด้วยมือเปล่าแล้วจับโต๊ะต่อทันทีเวลาไอ
    feedback: ควรไอใส่ข้อพับแขนหรือกระดาษทิชชู แล้วล้างมือ
  hints:
  - สิ่งที่หายใจเข้าไปมีผลต่อปอดโดยตรง
  - ควันและฝุ่นทำร้ายทางเดินหายใจ
  solution: ควันบุหรี่และฝุ่น PM2.5 ทำให้ทางเดินหายใจระคายเคืองและอักเสบ การหลีกเลี่ยงจึงช่วยดูแลปอด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.circulatory-respiratory-reproductive-care.p007
  topics:
  - health.body.circulatory-respiratory-reproductive-care
  difficulty: 3
  type: numeric
  stem: จากกราฟ ชีพจรของภูผาทันทีหลังกระโดดเชือกสูงกว่าขณะพักกี่ครั้งต่อนาที (ตอบเป็นครั้งต่อนาที)
  figure: &id001
    src: pulse-log.svg
    alt: กราฟเส้น ชีพจรของภูผาก่อนและหลังกระโดดเชือก 2 นาที ข้อมูลสมมติ หน่วยครั้งต่อนาที ขณะพัก 84 ทันทีหลังกระโดด 148 หลังหยุด 1 นาที 124 2 นาที 104 3 นาที 92 4 นาที 86
  answer:
    value: 64
    unit: ครั้งต่อนาที
  misconceptions:
  - match: 148
    feedback: 148 คือชีพจรหลังกระโดด โจทย์ถามว่าสูงกว่าขณะพักเท่าไร
  - match: 232
    feedback: "ต้องลบ ไม่ใช่บวก: 148 − 84"
  hints:
  - อ่านค่าขณะพักและค่าทันทีหลังกระโดด
  - นำสองค่ามาลบกัน
  solution: 148 − 84 = 64 ครั้งต่อนาที หัวใจเต้นเร็วขึ้นเพื่อส่งออกซิเจนไปให้กล้ามเนื้อที่ทำงานหนัก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.circulatory-respiratory-reproductive-care.p008
  topics:
  - health.body.circulatory-respiratory-reproductive-care
  difficulty: 3
  type: numeric
  stem: จากกราฟ หลังหยุดกระโดด 3 นาที ชีพจรของภูผายังสูงกว่าขณะพักกี่ครั้งต่อนาที (ตอบเป็นครั้งต่อนาที)
  figure: *id001
  answer:
    value: 8
    unit: ครั้งต่อนาที
  misconceptions:
  - match: 56
    feedback: 56 คือชีพจรที่ลดลงจาก 148 ถึง 92 โจทย์ถามว่ายังสูงกว่าขณะพักเท่าไร
  - match: 92
    feedback: 92 คือชีพจรที่ 3 นาที โจทย์ถามว่ายังสูงกว่าขณะพัก (84) เท่าไร
  hints:
  - หาจุด 3 นาทีบนกราฟ
  - นำค่าที่ 3 นาทีลบด้วยค่าขณะพัก
  solution: ที่ 3 นาทีชีพจร 92 ขณะพัก 84 ยังสูงกว่า 92 − 84 = 8 ครั้งต่อนาที แสดงว่าหัวใจกำลังกลับสู่ภาวะปกติ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.circulatory-respiratory-reproductive-care.p009
  topics:
  - health.body.circulatory-respiratory-reproductive-care
  difficulty: 3
  type: mcq
  stem: ข้อใดเป็นการดูแลอวัยวะสืบพันธุ์ที่ถูกต้อง (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: ทำความสะอาดอวัยวะเพศภายนอกด้วยน้ำสะอาดทุกวันแล้วซับให้แห้ง
    correct: true
  - id: b
    text: เปลี่ยนชุดชั้นในทุกวัน
    correct: true
  - id: c
    text: เด็กผู้หญิงเช็ดจากหน้าไปหลังหลังขับถ่าย
    correct: true
  - id: d
    text: ฉีดล้างเข้าไปในช่องคลอดด้วยน้ำยาหอมทุกวัน
    feedback: การฉีดล้างข้างในและน้ำหอมทำให้ระคายเคืองและเสียสมดุลตามธรรมชาติ
  - id: e
    text: ใส่กางเกงชั้นในตัวเดิมหลายวันถ้ายังไม่มีกลิ่น
    feedback: ควรเปลี่ยนทุกวันเพื่อไม่ให้อับชื้นและเกิดการติดเชื้อ
  hints:
  - ความสะอาดและความแห้งช่วยป้องกันการติดเชื้อ
  - อวัยวะเพศภายในทำความสะอาดตัวเองตามธรรมชาติ
  solution: ควรทำความสะอาดเฉพาะภายนอกด้วยน้ำสะอาด ซับให้แห้ง เปลี่ยนชุดชั้นในทุกวัน และเช็ดจากหน้าไปหลัง ไม่ฉีดล้างภายในหรือใช้น้ำหอม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.circulatory-respiratory-reproductive-care.p010
  topics:
  - health.body.circulatory-respiratory-reproductive-care
  difficulty: 3
  type: text
  stem: กิจกรรมทางกายที่องค์การอนามัยโลกแนะนำให้เด็กและวัยรุ่นอายุ 5–17 ปีทำเฉลี่ยอย่างน้อยวันละกี่นาที (ตอบเป็นตัวเลข)
  accepted:
  - '60'
  - 60 นาที
  - หกสิบ
  misconceptions:
  - match: '30'
    feedback: 30 นาทีน้อยกว่าคำแนะนำสำหรับเด็กและวัยรุ่น
  hints:
  - เท่ากับ 1 ชั่วโมง
  - เป็นกิจกรรมระดับปานกลางถึงหนัก
  solution: องค์การอนามัยโลกแนะนำเฉลี่ยวันละอย่างน้อย 60 นาที ระดับปานกลางถึงหนัก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.circulatory-respiratory-reproductive-care.p011
  topics:
  - health.body.circulatory-respiratory-reproductive-care
  difficulty: 4
  type: numeric
  stem: ข้าวหอมเล่นกีฬาหรือขยับร่างกายวันละ 35 นาที ทุกวัน ใน 1 สัปดาห์ยังขาดจากคำแนะนำ 60 นาทีต่อวันอยู่กี่นาที (ตอบเป็นนาที)
  answer:
    value: 175
    unit: นาที
  misconceptions:
  - match: 25
    feedback: 25 คือที่ขาดใน 1 วัน ต้องคิดทั้ง 7 วัน
  - match: 245
    feedback: 245 คือเวลาที่ข้าวหอมทำได้ใน 1 สัปดาห์ ไม่ใช่ที่ขาด
  hints:
  - คำแนะนำทั้งสัปดาห์คือ 60 × 7
  - นำเวลาที่ทำจริงทั้งสัปดาห์มาลบ
  solution: คำแนะนำ 60 × 7 = 420 นาที ทำจริง 35 × 7 = 245 นาที ขาด 420 − 245 = 175 นาที (หรือ 25 × 7)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.circulatory-respiratory-reproductive-care.p012
  topics:
  - health.body.circulatory-respiratory-reproductive-care
  difficulty: 4
  type: numeric
  stem: องค์การอนามัยโลกรายงานว่ายาสูบทำให้คนเสียชีวิตราว 7 ล้านคนต่อปี และราว 1.6 ล้านคนในนั้นไม่ได้สูบเองแต่ได้รับควันบุหรี่มือสอง คนที่ไม่ได้สูบคิดเป็นประมาณร้อยละเท่าไร (ตอบเป็นร้อยละ ทศนิยม 1 ตำแหน่ง)
  answer:
    value: 22.9
    tolerance: 0.2
    unit: "%"
  misconceptions:
  - match: 4.4
    feedback: 7 ÷ 1.6 กลับด้าน ต้องเป็น 1.6 ÷ 7 × 100
  - match: 1.6
    feedback: 1.6 คือจำนวนล้านคน ยังไม่ได้เปลี่ยนเป็นร้อยละ
  hints:
  - ร้อยละ = ส่วน ÷ ทั้งหมด × 100
  - ส่วนคือ 1.6 ทั้งหมดคือ 7
  solution: 1.6 ÷ 7 × 100 ≈ 22.9 เกือบ 1 ใน 4 ของผู้เสียชีวิตไม่ได้สูบบุหรี่เอง ควันบุหรี่จึงทำร้ายคนรอบข้างด้วย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.circulatory-respiratory-reproductive-care.p013
  topics:
  - health.body.circulatory-respiratory-reproductive-care
  difficulty: 4
  type: mcq
  stem: ระหว่างวิ่งรอบสนาม พิมเจ็บแน่นหน้าอกและหายใจไม่ทัน ควรทำอย่างไร
  choices:
  - id: a
    text: หยุดวิ่งทันที นั่งพัก และบอกครูหรือผู้ใหญ่ ถ้าอาการไม่ดีขึ้นหรือหมดสติให้โทร 1669
    correct: true
  - id: b
    text: ฝืนวิ่งต่อให้ครบเพื่อฝึกความอดทน
    feedback: เจ็บหน้าอกขณะออกกำลังกายเป็นสัญญาณเตือนที่ต้องหยุดทันที
  - id: c
    text: ดื่มน้ำอัดลมแล้ววิ่งต่อ
    feedback: น้ำอัดลมไม่ได้แก้อาการเจ็บหน้าอก ต้องหยุดและให้ผู้ใหญ่ประเมิน
  hints:
  - อาการนี้เกี่ยวกับหัวใจหรือปอด
  - อาการผิดปกติระหว่างออกกำลังกายต้องหยุดก่อน
  solution: เจ็บหน้าอกหรือหายใจไม่ทันขณะออกกำลังกายต้องหยุดทันทีและบอกผู้ใหญ่ ไปพบแพทย์เพื่อตรวจ และโทร 1669 ถ้าอาการรุนแรง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.circulatory-respiratory-reproductive-care.p014
  topics:
  - health.body.circulatory-respiratory-reproductive-care
  difficulty: 4
  type: mcq
  stem: เพราะเหตุใดคนที่ออกกำลังกายสม่ำเสมอ ชีพจรมักกลับสู่ค่าขณะพักได้เร็วกว่าหลังออกกำลังกาย
  choices:
  - id: a
    text: หัวใจและปอดที่ได้ฝึกทำงานได้มีประสิทธิภาพขึ้น บีบตัวแต่ละครั้งส่งเลือดได้มากขึ้น
    correct: true
  - id: b
    text: เพราะหัวใจของคนออกกำลังกายมีขนาดเล็กลง
    feedback: การฝึกไม่ได้ทำให้หัวใจเล็กลง แต่ทำให้กล้ามเนื้อหัวใจทำงานดีขึ้น
  - id: c
    text: เพราะคนออกกำลังกายหายใจน้อยลง
    feedback: ปอดที่ฝึกแล้วแลกเปลี่ยนแก๊สได้ดี ไม่ใช่หายใจน้อยลง
  hints:
  - หัวใจเป็นกล้ามเนื้อ
  - กล้ามเนื้อที่ได้ฝึกจะแข็งแรงขึ้น
  solution: การออกกำลังกายสม่ำเสมอทำให้กล้ามเนื้อหัวใจแข็งแรง แต่ละครั้งบีบตัวส่งเลือดได้มากขึ้น ร่างกายจึงฟื้นตัวเร็ว
