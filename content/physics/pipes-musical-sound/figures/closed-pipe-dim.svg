<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" font-family="sans-serif">
<title>ท่อยาวหนึ่งด้านปิดและอีกด้านเปิด มีความยาว L กำกับ</title>
<rect width="640" height="220" fill="#ffffff"/>
<rect x="110" y="80" width="420" height="50" fill="#e0f2fe" stroke="#334155" stroke-width="2"/>
<rect x="100" y="74" width="10" height="62" fill="#334155"/>
<text x="94.0" y="152.0" text-anchor="middle" font-size="12" fill="#444" font-weight="normal">ปลายปิด</text>
<text x="532.0" y="152.0" text-anchor="middle" font-size="12" fill="#444" font-weight="normal">ปลายเปิด</text>
<line x1="110" y1="62" x2="530" y2="62" stroke="#111"/>
<line x1="110" y1="56" x2="110" y2="68" stroke="#111"/><line x1="530" y1="56" x2="530" y2="68" stroke="#111"/>
<text x="320.0" y="52.0" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">L</text>
<text x="320.0" y="206.0" text-anchor="middle" font-size="12" fill="#666" font-weight="normal">ภาพไม่ได้วาดตามมาตราส่วน</text>
</svg>