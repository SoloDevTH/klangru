topic: health.sexuality.gender-and-respect
rows:
  - { framework: th-core-2551-health-pe, indicators: ["พ 2.1 ป.1/3", "พ 2.1 ม.2/1"], coverage: full }
  - { framework: th-core-2551-health-pe, indicators: ["พ 2.1 ป.2/3", "พ 2.1 ป.4/2"], coverage: partial, note: "ตีความ พฤติกรรมที่เหมาะสมกับเพศ ว่าเป็นมารยาทและการให้เกียรติตามวัฒนธรรมไทยที่ใช้กับทุกเพศ (ไหว้ เคารพความเป็นส่วนตัว ขอความยินยอม) ไม่สอนบทบาทตามภาพเหมารวม ตาม UNESCO ITGSE 2018 และ พ.ร.บ.ความเท่าเทียมระหว่างเพศ 2558 และ ป.4/2 ให้แสดงพฤติกรรมจริงซึ่งแอปตรวจไม่ได้" }
  - { framework: th-core-2551-health-pe, indicators: ["พ 2.1 ป.2/4"], coverage: partial, note: "สอนความภาคภูมิใจในร่างกายและตัวตนของตนโดยไม่ดูถูกเพศอื่น ครอบคลุมเด็กทุกเพศสภาพ ไม่จำกัดเฉพาะความเป็นเพศหญิงหรือเพศชายตามถ้อยคำเดิมของตัวชี้วัด" }
  - { framework: th-core-2551-health-pe, indicators: ["พ 2.1 ม.2/4"], coverage: partial, note: "สอนความหมายและความสำคัญของความเสมอภาคทางเพศ นิยามการเลือกปฏิบัติตาม พ.ร.บ. 2558 และตัวอย่างในห้องเรียน ส่วนการวางตัวต้องปฏิบัติจริง" }
  - { framework: th-core-2551-health-pe, indicators: ["พ 2.1 ม.4-6/1", "พ 2.1 ม.4-6/2"], coverage: partial, note: "สอนอิทธิพลของครอบครัว เพื่อน สื่อ ศาสนาและวัฒนธรรม และกฎหมายต่อเจตคติ และตัวอย่างค่านิยมที่เปลี่ยนตามเวลา (กฎหมายสมรสเท่าเทียม 2568) ในระดับประถมปลาย ยังไม่ได้วิเคราะห์อิทธิพลต่อพฤติกรรมทางเพศหรือเปรียบเทียบวัฒนธรรมอื่นเชิงลึกระดับ ม.ปลาย" }
