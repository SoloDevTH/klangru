problems:
  - id: hlt.aid.p001
    topics: [health.safety.first-aid]
    difficulty: 1
    type: mcq
    stem: "พบคนเจ็บป่วยฉุกเฉินในประเทศไทย ควรโทรเบอร์ใดเพื่อเรียกรถพยาบาลและทีมกู้ชีพ"
    choices:
      - { id: a, text: "1669", correct: true }
      - { id: b, text: "191", feedback: "191 เป็นเบอร์แจ้งเหตุร้ายกับตำรวจ เหตุเจ็บป่วยฉุกเฉินโทร 1669" }
      - { id: c, text: "199", feedback: "199 เป็นเบอร์แจ้งเหตุไฟไหม้ เหตุเจ็บป่วยฉุกเฉินโทร 1669" }
    hints:
      - "เป็นสายด่วนของสถาบันการแพทย์ฉุกเฉินแห่งชาติ"
      - "เป็นเลขสี่หลัก"
    solution: "1669 คือสายด่วนการแพทย์ฉุกเฉิน โทรฟรีทั่วประเทศ ส่วน 191 แจ้งเหตุร้ายและ 199 แจ้งเหตุไฟไหม้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.aid.p002
    topics: [health.safety.first-aid]
    difficulty: 1
    type: mcq
    stem: "เห็นคนนอนอยู่ข้างถนนหลังรถจักรยานยนต์ล้ม สิ่งแรกที่ควรทำคืออะไร"
    choices:
      - { id: a, text: "ดูว่าที่เกิดเหตุปลอดภัยสำหรับตัวเองหรือไม่ เช่น มีรถวิ่งผ่านหรือน้ำมันรั่ว", correct: true }
      - { id: b, text: "วิ่งเข้าไปอุ้มผู้บาดเจ็บออกมาทันที", feedback: "ถ้ายังไม่ดูความปลอดภัย ผู้ช่วยอาจถูกรถชนเพิ่มอีกคน และการเคลื่อนย้ายผู้บาดเจ็บโดยไม่จำเป็นอาจทำให้บาดเจ็บมากขึ้น" }
      - { id: c, text: "ถ่ายวิดีโอเก็บไว้เป็นหลักฐาน", feedback: "การถ่ายวิดีโอไม่ได้ช่วยผู้บาดเจ็บ ควรดูความปลอดภัยแล้วโทร 1669" }
      - { id: d, text: "ให้น้ำผู้บาดเจ็บดื่ม", feedback: "ไม่ควรให้กินหรือดื่มอะไร ผู้บาดเจ็บอาจสำลักหรือต้องผ่าตัด" }
    hints:
      - "ถ้าผู้ช่วยบาดเจ็บเพิ่ม จะเกิดอะไรขึ้น"
      - "ก่อนเข้าไปช่วยทุกครั้ง ต้องมองหาอันตรายรอบตัว"
    solution: "ขั้นแรกคือดูความปลอดภัยของที่เกิดเหตุ ถ้าปลอดภัยจึงเข้าไปดูอาการและโทร 1669 ถ้าไม่ปลอดภัยให้อยู่ห่างและโทรแจ้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.aid.p003
    topics: [health.safety.first-aid]
    difficulty: 1
    type: mcq
    stem: "น้องถูกน้ำร้อนจากกาต้มน้ำลวกที่แขน การปฐมพยาบาลข้อใดถูกต้อง"
    choices:
      - { id: a, text: "ราดน้ำสะอาดที่ไหลผ่านแผลทันที นานหลายนาที", correct: true }
      - { id: b, text: "ประคบด้วยน้ำแข็ง", feedback: "น้ำแข็งเย็นเกินไปและทำให้เนื้อเยื่อเสียหายเพิ่ม ใช้น้ำสะอาดที่ไหลผ่าน อุณหภูมิห้องหรือเย็นพอสบาย" }
      - { id: c, text: "ทายาสีฟัน", feedback: "ยาสีฟันไม่ได้ช่วยระบายความร้อนและทำให้แผลสกปรก เสี่ยงติดเชื้อ" }
      - { id: d, text: "ทาเนยหรือน้ำมัน", feedback: "ไขมันกักความร้อนไว้และไม่ช่วยให้แผลหาย สภากาชาดแนะนำไม่ให้ใช้" }
    hints:
      - "เป้าหมายแรกคือหยุดความร้อนที่ยังทำลายผิวอยู่"
      - "สิ่งที่ใช้ต้องเย็นพอ สะอาด และไม่ทำร้ายผิวเพิ่ม"
    solution: "ราดน้ำสะอาดที่ไหลผ่านแผลให้เร็วที่สุด สภากาชาดอเมริกันแนะนำ 5–20 นาที และหลายแนวทางแนะนำราว 20 นาทีถ้าทำได้ ห้ามใช้น้ำแข็ง ยาสีฟัน เนย หรือน้ำมัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.aid.p004
    topics: [health.safety.first-aid]
    difficulty: 2
    type: order
    stem: "ผู้ใหญ่คนหนึ่งล้มลงต่อหน้าเราในห้างสรรพสินค้า เรียงขั้นตอนการช่วยเหลือสำหรับผู้ที่ยังไม่ได้ฝึกช่วยหายใจ"
    items:
      - "ดูว่าที่เกิดเหตุปลอดภัย"
      - "ตบไหล่และเรียกดัง ๆ เพื่อดูว่ารู้สึกตัวหรือไม่"
      - "โทร 1669 เปิดลำโพง และให้คนไปหาเครื่อง AED"
      - "ดูการหายใจ ไม่เกิน 10 วินาที"
      - "ถ้าไม่หายใจหรือหายใจเฮือก กดหน้าอกแรงและเร็วต่อเนื่อง"
      - "เมื่อ AED มาถึง เปิดเครื่องและทำตามเสียงสั่ง"
    hints:
      - "ความปลอดภัยของผู้ช่วยมาก่อนเสมอ"
      - "ต้องรู้ว่าไม่รู้สึกตัวและเรียกความช่วยเหลือก่อน จึงตัดสินใจกดหน้าอกจากการหายใจ"
    solution: "ปลอดภัย → ปลุกเรียก → โทร 1669 และหา AED → ดูการหายใจ → กดหน้าอกถ้าไม่หายใจปกติ → ใช้ AED เมื่อมาถึง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.aid.p005
    topics: [health.safety.first-aid]
    difficulty: 2
    type: numeric
    stem: "ถ้ากดหน้าอกด้วยอัตรา 110 ครั้งต่อนาทีอย่างต่อเนื่อง ใน 2 นาทีจะกดได้กี่ครั้ง (ตอบเป็นตัวเลขในหน่วยครั้ง)"
    answer: { value: 220, unit: ครั้ง }
    hints:
      - "อัตราบอกจำนวนครั้งในหนึ่งนาที"
      - "คูณอัตราด้วยจำนวนนาที"
    misconceptions:
      - { match: 110, feedback: "110 ครั้งคือของนาทีเดียว ต้องคูณ 2" }
      - { match: 55, feedback: "ดูเหมือนหารด้วย 2 จำนวนครั้งใน 2 นาทีต้องมากกว่าใน 1 นาที" }
    solution: "$110 \\times 2 = 220$ ครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.aid.p006
    topics: [health.safety.first-aid]
    difficulty: 2
    type: mcq
    stem: "ตามแนวทางปัจจุบัน การกดหน้าอกผู้ใหญ่ควรกดลึกเท่าใด"
    choices:
      - { id: a, text: "5–6 เซนติเมตร", correct: true }
      - { id: b, text: "1–2 เซนติเมตร", feedback: "ตื้นเกินไป เลือดจะไม่ถูกบีบไปเลี้ยงสมองและหัวใจพอ ผู้ช่วยมือใหม่มักกดเบาเกินไปเพราะกลัวผู้ป่วยเจ็บ" }
      - { id: c, text: "10 เซนติเมตรขึ้นไป", feedback: "ลึกเกินไปและเสี่ยงบาดเจ็บ แนวทางแนะนำอย่างน้อย 5 แต่ไม่เกิน 6 เซนติเมตร" }
    hints:
      - "ภาษาอังกฤษเขียนว่าอย่างน้อย 2 นิ้ว"
      - "1 นิ้วประมาณ 2.5 เซนติเมตร"
    solution: "ผู้ใหญ่กดลึกอย่างน้อย 5 เซนติเมตร (2 นิ้ว) แต่ไม่เกิน 6 เซนติเมตร อัตรา 100–120 ครั้งต่อนาที และปล่อยให้อกคืนตัวสุดทุกครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.aid.p007
    topics: [health.safety.first-aid]
    difficulty: 2
    type: mcq
    stem: "เพื่อนโดนเศษแก้วบาดฝ่ามือ เลือดไหลมาก ควรทำอย่างไรก่อน"
    choices:
      - { id: a, text: "ใช้ผ้าสะอาดกดตรงแผลให้แน่นและต่อเนื่อง โดยป้องกันมือตัวเองด้วยถุงมือหรือถุงพลาสติก", correct: true }
      - { id: b, text: "ล้างแผลด้วยแอลกอฮอล์ก่อนแล้วค่อยห้ามเลือด", feedback: "เมื่อเลือดออกมาก ต้องหยุดเลือดก่อน ทำความสะอาดแผลทีหลัง" }
      - { id: c, text: "เปิดผ้าดูแผลทุกครั้งที่กด ว่าเลือดหยุดหรือยัง", feedback: "การเปิดดูบ่อยทำให้ลิ่มเลือดหลุด ต้องกดต่อเนื่อง ถ้าผ้าชุ่มให้วางผืนใหม่ทับ" }
      - { id: d, text: "ให้เพื่อนเดินไปโรงพยาบาลเองโดยไม่ต้องกดแผล", feedback: "เลือดจะออกต่อระหว่างทาง ต้องกดแผลก่อน และโทร 1669 ถ้าเลือดออกมากไม่หยุด" }
    hints:
      - "เลือดหยุดได้เมื่อหลอดเลือดถูกกดและเกิดลิ่มเลือด"
      - "นึกถึงความปลอดภัยของมือผู้ช่วยด้วย"
    solution: "ป้องกันมือตัวเอง ใช้ผ้าสะอาดกดตรงแผลแน่นและต่อเนื่อง ถ้าผ้าชุ่มให้วางผืนใหม่ทับโดยไม่ดึงผืนเดิมออก ถ้าเลือดไม่หยุดหรือออกมาก โทร 1669"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.aid.p008
    topics: [health.safety.first-aid]
    difficulty: 2
    type: match
    stem: "จับคู่สถานการณ์กับการช่วยเหลือแรกที่เหมาะสม (ที่เกิดเหตุปลอดภัยแล้ว)"
    pairs:
      - { left: "ถูกน้ำร้อนลวกที่แขน", right: "ราดน้ำสะอาดที่ไหลผ่านแผล" }
      - { left: "เลือดไหลจากแผลที่ขา", right: "ใช้ผ้าสะอาดกดตรงแผลแน่น ๆ" }
      - { left: "ไม่รู้สึกตัว แต่หายใจปกติ", right: "จัดท่าพักฟื้น (นอนตะแคง) และเฝ้าดู" }
      - { left: "ไม่รู้สึกตัว และหายใจเฮือก", right: "โทร 1669 และเริ่มกดหน้าอก" }
      - { left: "สำลักแต่ยังไอได้แรง", right: "กระตุ้นให้ไอต่อและเฝ้าดู" }
    hints:
      - "แยกคนที่หายใจปกติกับคนที่หายใจเฮือกให้ได้"
      - "การไอแรงคือร่างกายกำลังพยายามดันสิ่งแปลกปลอมออกเอง"
    solution: "น้ำร้อนลวก → ราดน้ำไหลผ่าน, เลือดออก → กดแผล, หมดสติแต่หายใจปกติ → ท่าพักฟื้น, หายใจเฮือก → โทร 1669 และกดหน้าอก, สำลักแต่ไอได้ → ให้ไอต่อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.aid.p009
    topics: [health.safety.first-aid]
    difficulty: 2
    type: mcq
    stem: "ผู้ใหญ่คนหนึ่งสำลักอาหาร เอามือกุมคอ พูดไม่ได้ และไอไม่ออก ตามแนวทางของ AHA ปี 2025 และสภากาชาดอเมริกัน ควรช่วยอย่างไร"
    choices:
      - { id: a, text: "ตบหลัง 5 ครั้ง สลับกับรัดกระตุกหน้าท้อง 5 ครั้ง จนสิ่งแปลกปลอมหลุดหรือผู้ป่วยหมดสติ", correct: true }
      - { id: b, text: "ให้ดื่มน้ำตามเพื่อกลืนลงไป", feedback: "ผู้ที่ทางเดินหายใจอุดกั้นรุนแรงกลืนไม่ได้และอาจสำลักน้ำเพิ่ม" }
      - { id: c, text: "ใช้นิ้วล้วงคอโดยไม่เห็นสิ่งแปลกปลอม", feedback: "การล้วงโดยมองไม่เห็นอาจดันสิ่งแปลกปลอมลึกลงไปอีก" }
      - { id: d, text: "รอดูอาการ 5 นาที เผื่อจะดีขึ้นเอง", feedback: "สมองขาดออกซิเจนได้ภายในไม่กี่นาที ต้องช่วยทันทีและให้คนโทร 1669" }
    hints:
      - "พูดไม่ได้และไอไม่ออกแปลว่าอุดกั้นรุนแรง ต้องช่วยดันอากาศออกจากปอด"
      - "แนวทางปี 2025 ใช้วิธีสองแบบสลับกัน"
    solution: "สำลักรุนแรงในผู้ใหญ่ให้ตบหลังด้วยส้นมือระหว่างสะบัก 5 ครั้ง สลับกับรัดกระตุกหน้าท้อง 5 ครั้ง ทำต่อจนสิ่งแปลกปลอมหลุดหรือผู้ป่วยหมดสติ ถ้าหมดสติให้โทร 1669 และเริ่มกดหน้าอก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.aid.p010
    topics: [health.safety.first-aid]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการช่วยผู้ใหญ่ที่สำลักรุนแรง (พูดไม่ได้ ไอไม่ออก) จนกระทั่งหมดสติ"
    items:
      - "ถามว่าสำลักใช่ไหม และให้คนอื่นโทร 1669"
      - "ให้ผู้ป่วยโน้มตัวไปข้างหน้า ตบหลัง 5 ครั้ง"
      - "รัดกระตุกหน้าท้อง 5 ครั้ง"
      - "ทำสลับกันต่อไปจนสิ่งแปลกปลอมหลุดหรือผู้ป่วยหมดสติ"
      - "ผู้ป่วยหมดสติ: ประคองลงพื้นและเริ่มกดหน้าอก"
    hints:
      - "ต้องยืนยันก่อนว่าสำลักรุนแรงจริง"
      - "แนวทางปี 2025 เริ่มจากตบหลัง แล้วจึงรัดกระตุกหน้าท้อง"
    solution: "ยืนยันว่าสำลักรุนแรงและให้คนโทร 1669 → ตบหลัง 5 ครั้ง → รัดกระตุกหน้าท้อง 5 ครั้ง → สลับไปเรื่อย ๆ → ถ้าหมดสติให้วางลงพื้นและเริ่มกดหน้าอก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.aid.p011
    topics: [health.safety.first-aid]
    difficulty: 3
    type: numeric
    stem: "ถ้ากดหน้าอกด้วยอัตรา 120 ครั้งต่อนาทีพอดี การกดแต่ละครั้งห่างกันกี่วินาที (ตอบเป็นตัวเลขในหน่วยวินาที)"
    answer: { value: 0.5, tolerance: 0.01, unit: s }
    hints:
      - "1 นาที = 60 วินาที"
      - "นำ 60 วินาทีหารด้วยจำนวนครั้ง"
    misconceptions:
      - { match: 2, feedback: "นั่นคือ $120 \\div 60$ ซึ่งเป็นจำนวนครั้งต่อวินาที ไม่ใช่วินาทีต่อครั้ง" }
    solution: "$60\\ \\mathrm{s} \\div 120 = 0.5$ วินาทีต่อครั้ง หรือ 2 ครั้งต่อวินาที เป็นจังหวะที่เร็วกว่าที่คนส่วนใหญ่คิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.aid.p012
    topics: [health.safety.first-aid]
    difficulty: 3
    type: numeric
    stem: "นักเรียน 2 คนช่วยกดหน้าอกผู้หมดสติในสนามกีฬาโรงเรียน โดยสลับคนกดทุก 2 นาที รถพยาบาลมาถึงหลังเริ่มกด 12 นาทีพอดี แต่ละคนได้กดกี่รอบ (ตอบเป็นตัวเลขในหน่วยรอบ)"
    answer: { value: 3, unit: รอบ }
    hints:
      - "12 นาทีแบ่งเป็นรอบละ 2 นาทีได้กี่รอบ"
