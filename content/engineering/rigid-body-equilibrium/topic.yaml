id: engineering.mechanics.rigid-body-equilibrium
subject: engineering
title: { th: สมดุลของวัตถุแข็งเกร็ง, en: Equilibrium of rigid bodies }
summary: โมเมนต์ของแรงในรูปเวกเตอร์ คู่ควบ ระบบแรงสมมูลและแรงกระจาย ฐานรองรับและแรงปฏิกิริยา และสมการสมดุลของวัตถุแข็งเกร็งในสองและสามมิติ
difficulty: 6.5
minutes: 45
prerequisites: [engineering.mechanics.statics-particles, physics.rotation.torque]
encompasses:
  - { id: engineering.mechanics.statics-particles, weight: 0.4 }
  - { id: physics.rotation.torque, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ฐานรองรับและแรงปฏิกิริยา
    src: supports.svg
    alt: "ตารางสี่ช่อง แถวบนเป็นสัญลักษณ์ของฐานรองรับ แถวล่างเป็นแรงปฏิกิริยาที่วาดในแผนภาพวัตถุอิสระ ลูกกลิ้ง: แรงเดียวตั้งฉากกับพื้น (B_y) หมุด: แรงสองแรง A_x และ A_y ฐานยึดแน่นที่ผนัง: แรง A_x A_y และโมเมนต์ M_A เชือกหรือลวด: แรงตึง T ตามแนวเชือก หมายเหตุว่าทิศของแรงที่ไม่รู้สมมติได้ ถ้าคำนวณได้ค่าลบแปลว่าทิศจริงตรงข้าม"
  - { type: check, problem: engineering.mechanics.rigid-body-equilibrium.p003, prompt: "ใช้องค์ประกอบของแรงที่ตั้งฉากกับด้าม" }
  - type: figure
    title: คานช่วงเดียวและแผนภาพวัตถุอิสระ
    src: beam-example.svg
    alt: "บน: คาน AB ยาว 8 เมตร หมุดที่ A ลูกกลิ้งที่ B แรง 10 kN กดลงที่ 2 เมตรจาก A และแรงกระจาย 3 kN/m จาก 4 เมตรถึงปลาย B ล่าง: แผนภาพวัตถุอิสระ แรงกระจายเปลี่ยนเป็นแรง 12 kN ที่ 6 เมตรจาก A และแรงปฏิกิริยา A_x A_y ที่ A และ B_y ที่ B"
  - type: worked-example
    title: แรงปฏิกิริยาของคานช่วงเดียว
    problem: "คาน AB ยาว $8\\ \\mathrm{m}$ มีหมุดที่ A ลูกกลิ้งที่ B รับแรง $10\\ \\mathrm{kN}$ ที่ $2\\ \\mathrm{m}$ จาก A และแรงกระจาย $3\\ \\mathrm{kN/m}$ จาก $4\\ \\mathrm{m}$ ถึง B จงหาแรงปฏิกิริยา"
    steps:
      - text: "แรงกระจายรวม $3 \\times 4 = 12\\ \\mathrm{kN}$ กระทำที่กึ่งกลางช่วง คือ $6\\ \\mathrm{m}$ จาก A"
        why: "แรงลัพธ์ของแรงกระจายเท่ากับพื้นที่ใต้กราฟ และอยู่ที่เซนทรอยด์ของพื้นที่นั้น"
      - text: "$\\sum M_A = 0$ (ทวนเข็มบวก): $8B_y - 10(2) - 12(6) = 0$"
        why: "หมุด A มีสองแรงที่ไม่รู้ หาโมเมนต์รอบ A ทำให้ทั้งคู่หายไป"
      - text: "$B_y = \\dfrac{20 + 72}{8} = 11.5\\ \\mathrm{kN}$"
      - text: "$\\sum F_y = 0$: $A_y = 10 + 12 - 11.5 = 10.5\\ \\mathrm{kN}$ และไม่มีแรงแนวราบ จึง $A_x = 0$"
      - text: "ตรวจ $\\sum M_B = 0$: $8A_y = 10(6) + 12(2) = 84$ ได้ $A_y = 10.5\\ \\mathrm{kN}$"
        why: "สมการโมเมนต์รอบจุดอื่นเป็นวิธีที่สองที่ตรวจคำตอบได้ทันที"
    answer: "$A_x = 0$, $A_y = 10.5\\ \\mathrm{kN}$, $B_y = 11.5\\ \\mathrm{kN}$"
  - { type: check, problem: engineering.mechanics.rigid-body-equilibrium.p007, prompt: "ฝั่งที่อยู่ใกล้น้ำหนักรับแรงมากกว่า" }
  - type: interactive
    title: แรงปฏิกิริยาเมื่อน้ำหนักเลื่อนไปตามคาน
    caption: "คานยาว L มีหมุดที่ A (x = 0) และลูกกลิ้งที่ B (x = L) รับแรง P ที่ตำแหน่ง x เส้นแรกคือแรงที่ A เส้นที่สองคือแรงที่ B ลองเลื่อน P และ L สังเกตว่าผลรวมของสองเส้นเท่ากับ P เสมอ และเส้นทั้งสองตัดกันที่กึ่งกลางคาน"
    widget:
      kind: function-plot
      functions: ["P\\cdot(1-\\frac{x}{L})", "P\\cdot\\frac{x}{L}"]
      sliders:
        - { name: P, min: 1, max: 20, step: 1, value: 12, label: "แรง P (kN)" }
        - { name: L, min: 2, max: 10, step: 1, value: 6, label: "ความยาวคาน L (m)" }
      x: [0, 10]
      y: [0, 20]
  - type: worked-example
    title: แรงและโมเมนต์ที่ฐานเสาป้ายในสามมิติ
    problem: "เสาป้ายยึดแน่นที่จุดกำเนิด ที่ปลายแขน $\\vec r = (2, 0, 5)\\ \\mathrm{m}$ มีน้ำหนักป้าย $1.2\\ \\mathrm{kN}$ ลง และแรงลม $0.8\\ \\mathrm{kN}$ ในแนว $+y$ จงหาแรงและโมเมนต์ที่ฐาน"
    steps:
      - text: "แรงที่กระทำรวม $\\vec F = (0,\\ 0.8,\\ -1.2)\\ \\mathrm{kN}$ ฐานต้องให้แรง $-\\vec F = (0,\\ -0.8,\\ 1.2)\\ \\mathrm{kN}$"
      - text: "$\\vec r \\times \\vec F = \\begin{vmatrix} \\hat i & \\hat j & \\hat k \\\\ 2 & 0 & 5 \\\\ 0 & 0.8 & -1.2 \\end{vmatrix} = (0 - 4)\\hat i - (-2.4 - 0)\\hat j + (1.6 - 0)\\hat k$"
      - text: "$\\vec r \\times \\vec F = (-4,\\ 2.4,\\ 1.6)\\ \\mathrm{kN\\cdot m}$ ฐานจึงต้องให้โมเมนต์ $\\vec M_O = (4,\\ -2.4,\\ -1.6)\\ \\mathrm{kN\\cdot m}$"
        why: "สมดุลต้องมี $\\vec M_O + \\vec r \\times \\vec F = \\vec 0$"
      - text: "ตรวจทีละแกน: ลม $0.8$ ที่สูง $5$ ให้ $4$ รอบแกน $x$ น้ำหนัก $1.2$ ที่แขน $2$ ให้ $2.4$ รอบแกน $y$ ลม $0.8$ ที่แขน $2$ ให้ $1.6$ รอบแกน $z$"
        why: "โมเมนต์รอบแกน $z$ คือแรงบิดที่ทำให้เสาหมุน ซึ่งไม่ปรากฏถ้าคิดแค่ในระนาบเดียว"
    answer: "แรงที่ฐาน $(0, -0.8, 1.2)\\ \\mathrm{kN}$ โมเมนต์ที่ฐาน $(4, -2.4, -1.6)\\ \\mathrm{kN\\cdot m}$"
glossary:
  - { term: วัตถุแข็งเกร็ง, definition: "วัตถุที่ถือว่าไม่เสียรูปเมื่อมีแรงกระทำ ระยะระหว่างจุดใด ๆ ในวัตถุคงที่ (rigid body)" }
  - { term: คู่ควบ, definition: "แรงสองแรงขนาดเท่ากัน ทิศตรงข้าม แนวขนาน ให้โมเมนต์ Fd เท่ากันรอบทุกจุดแต่แรงลัพธ์เป็นศูนย์ (couple)" }
  - { term: ระบบแรงสมมูล, definition: "ระบบแรงที่มีแรงลัพธ์และโมเมนต์ลัพธ์รอบจุดเดียวกันเท่ากัน จึงมีผลภายนอกต่อวัตถุแข็งเกร็งเหมือนกัน (equivalent system)" }
  - { term: แรงปฏิกิริยา, definition: "แรงหรือโมเมนต์ที่ฐานรองรับกระทำต่อวัตถุเพื่อห้ามการเคลื่อนที่ (support reaction)" }
  - { term: อินดีเทอร์มิเนตเชิงสถิต, definition: "โครงสร้างที่มีค่าที่ไม่รู้จากฐานรองรับมากกว่าจำนวนสมการสมดุล ต้องใช้การเสียรูปช่วยหา (statically indeterminate)" }
  - { term: ชิ้นส่วนสองแรง, definition: "ชิ้นส่วนที่มีแรงกระทำเพียงสองจุด แรงทั้งสองต้องเท่ากัน ตรงข้าม และอยู่ในแนวที่เชื่อมสองจุด (two-force member)" }
flashcards:
  - { front: "สมการสมดุลของวัตถุแข็งเกร็งในระนาบ", back: "$\\sum F_x = 0$, $\\sum F_y = 0$, $\\sum M_O = 0$ หาค่าที่ไม่รู้ได้สามค่า (ในสามมิติหกค่า)" }
  - { front: "โมเมนต์ของแรงในระนาบจากองค์ประกอบ", back: "$M_O = xF_y - yF_x$ บวกคือทวนเข็มนาฬิกา" }
  - { front: "แรงลัพธ์ของแรงกระจายสามเหลี่ยม", back: "$\\tfrac12 wL$ ที่ $L/3$ จากด้านที่ค่าสูงสุด" }
  - { front: "จำนวนแรงปฏิกิริยา: ลูกกลิ้ง หมุด ฐานยึดแน่น", back: "1, 2 และ 3 ค่า (ฐานยึดแน่นมีโมเมนต์ด้วย)" }
  - { front: "เลือกจุดหาโมเมนต์อย่างไร", back: "จุดที่แรงที่ไม่รู้หลายแรงผ่าน แรงเหล่านั้นจะหายจากสมการ" }
