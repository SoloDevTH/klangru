<rect x="0" y="0" width="640" height="250" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="320.0" y="28.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">สังเกตสีปัสสาวะ: ดื่มน้ำพอหรือยัง</text>
<path d="M80,60 L180,60 L170,170 Q130,182 90,170 Z" fill="#ffffff" stroke="#555" stroke-width="2"/>
