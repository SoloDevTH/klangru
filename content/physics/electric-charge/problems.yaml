      - { match: 0, feedback: "ผ้าเสียอิเล็กตรอนไปให้ไม้บรรทัด จึงไม่เป็นกลางแล้ว" }
    solution: "กฎการอนุรักษ์ประจุ: ประจุรวมยังเป็นศูนย์ ผ้าจึงมีประจุ $+5\\ \\mathrm{nC}$ เพราะเสียอิเล็กตรอนไปให้ไม้บรรทัด"
