  - id: health.fitness.fitness-components.p018
    topics: [health.fitness.fitness-components]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "ปีใหม่เป็นนักเรียน ป.6 ที่บ้านอยู่ห่างโรงเรียน 1 กิโลเมตร ปกติแม่ขับรถไปส่ง เล่นเกมวันละ 3 ชั่วโมง และไม่ค่อยออกกำลังกาย ข้อใดเป็นการปรับพฤติกรรมให้ตรงคำแนะนำกิจกรรมทางกายของ WHO (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "เดินหรือปั่นจักรยานไปโรงเรียนกับผู้ปกครองในวันที่สะดวกและปลอดภัย", correct: true }
      - { id: b, text: "ลดเวลาเล่นเกม แล้วใช้เวลานั้นเล่นกีฬาหรือการละเล่นกับเพื่อน", correct: true }
      - { id: c, text: "เล่นกีฬาที่ต้องออกแรงมาก เช่น ฟุตบอล อย่างน้อย 3 วันต่อสัปดาห์", correct: true }
      - { id: d, text: "ออกกำลังกายวันอาทิตย์วันเดียว 7 ชั่วโมงแทนทั้งสัปดาห์", feedback: "การหักโหมวันเดียวเสี่ยงบาดเจ็บ คำแนะนำคือกระจายเฉลี่ยวันละ 60 นาทีตลอดสัปดาห์" }
      - { id: e, text: "เปลี่ยนจากเล่นเกมบนโทรศัพท์เป็นดูวิดีโอแทน", feedback: "ยังเป็นการนั่งนิ่งหน้าจอเหมือนเดิม WHO แนะนำให้ลดเวลานั่งนิ่ง ๆ ดูจอ" }
    hints:
      - "WHO แนะนำเฉลี่ยวันละ 60 นาที มีกิจกรรมหนัก 3 วันต่อสัปดาห์ และลดเวลาหน้าจอ"
      - "ข้อที่ถูกมีสามข้อ"
    solution: "การเดินทางแบบใช้แรง ลดเวลาหน้าจอแล้วเปลี่ยนเป็นการเล่น และมีกิจกรรมหนักอย่างน้อย 3 วันต่อสัปดาห์ ตรงกับคำแนะนำของ WHO ส่วนการหักโหมวันเดียวและการเปลี่ยนจอชนิดหนึ่งเป็นอีกชนิดไม่ตรงคำแนะนำ"
