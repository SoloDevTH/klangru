<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 570" width="860" height="570" font-family="sans-serif" font-size="13">
  <title>ผังงานแก้ปัญหาเปิดคอมพิวเตอร์แล้วจอไม่มีภาพ</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="860" height="570" fill="#ffffff"/>
  <rect x="105.0" y="10.0" width="330.0" height="36.0" rx="18.0" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/>
  <text x="270.0" y="33.0" font-size="13" text-anchor="middle" fill="#1f2937">อาการ: กดเปิดเครื่องแล้วจอไม่มีภาพ</text>
  <polygon points="270.0,65.0 420.0,105.0 270.0,145.0 120.0,105.0" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="270.0" y="101.0" font-size="13" text-anchor="middle" fill="#1f2937">ไฟที่ตัวเครื่องติด</text>
  <text x="270.0" y="119.0" font-size="13" text-anchor="middle" fill="#1f2937">และพัดลมหมุนหรือไม่</text>
  <rect x="490.0" y="77.0" width="300.0" height="56.0" rx="2" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="640.0" y="101.0" font-size="13" text-anchor="middle" fill="#1f2937">ตรวจปลั๊ก สายไฟ สวิตช์ปลั๊กพ่วง</text>
  <text x="640.0" y="119.0" font-size="13" text-anchor="middle" fill="#1f2937">ลองเสียบเต้ารับอื่น</text>
  <polygon points="270.0,175.0 420.0,215.0 270.0,255.0 120.0,215.0" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="270.0" y="220.0" font-size="13" text-anchor="middle" fill="#1f2937">ไฟที่จอภาพติดหรือไม่</text>
  <rect x="490.0" y="187.0" width="300.0" height="56.0" rx="2" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="640.0" y="211.0" font-size="13" text-anchor="middle" fill="#1f2937">ตรวจสายไฟของจอ</text>
  <text x="640.0" y="229.0" font-size="13" text-anchor="middle" fill="#1f2937">และกดปุ่มเปิดจอ</text>
  <rect x="105.0" y="287.0" width="330.0" height="56.0" rx="2" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="270.0" y="311.0" font-size="13" text-anchor="middle" fill="#1f2937">ตรวจสายสัญญาณภาพทั้งสองปลาย</text>
  <text x="270.0" y="329.0" font-size="13" text-anchor="middle" fill="#1f2937">และเลือกช่องสัญญาณ (input) ของจอให้ถูก</text>
  <polygon points="270.0,375.0 420.0,415.0 270.0,455.0 120.0,415.0" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="270.0" y="411.0" font-size="13" text-anchor="middle" fill="#1f2937">ลองจอที่รู้ว่าใช้ได้</text>
  <text x="270.0" y="429.0" font-size="13" text-anchor="middle" fill="#1f2937">แล้วมีภาพหรือไม่</text>
  <rect x="490.0" y="387.0" width="300.0" height="56.0" rx="2" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="640.0" y="411.0" font-size="13" text-anchor="middle" fill="#1f2937">จอเดิมเสีย</text>
  <text x="640.0" y="429.0" font-size="13" text-anchor="middle" fill="#1f2937">แจ้งครูหรือช่างเปลี่ยนจอ</text>
  <rect x="105.0" y="492.0" width="330.0" height="56.0" rx="2" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="270.0" y="516.0" font-size="13" text-anchor="middle" fill="#1f2937">ปัญหาอยู่ที่ตัวเครื่อง (เช่น การ์ดจอ RAM)</text>
  <text x="270.0" y="534.0" font-size="13" text-anchor="middle" fill="#1f2937">จดสิ่งที่ลองแล้ว แจ้งครูหรือช่าง</text>
  <line x1="270.0" y1="46.0" x2="270.0" y2="64.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="420.0" y1="105.0" x2="488.0" y2="105.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="430.0" y="97.0" font-size="13" text-anchor="start" fill="#b91c1c">ไม่</text>
  <line x1="270.0" y1="145.0" x2="270.0" y2="174.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="278.0" y="165.0" font-size="13" text-anchor="start" fill="#15803d">ใช่</text>
  <line x1="420.0" y1="215.0" x2="488.0" y2="215.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="430.0" y="207.0" font-size="13" text-anchor="start" fill="#b91c1c">ไม่</text>
  <line x1="270.0" y1="255.0" x2="270.0" y2="286.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="278.0" y="275.0" font-size="13" text-anchor="start" fill="#15803d">ใช่</text>
  <line x1="270.0" y1="343.0" x2="270.0" y2="374.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="420.0" y1="415.0" x2="488.0" y2="415.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="430.0" y="407.0" font-size="13" text-anchor="start" fill="#15803d">ใช่</text>
  <line x1="270.0" y1="455.0" x2="270.0" y2="491.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="278.0" y="477.0" font-size="13" text-anchor="start" fill="#b91c1c">ไม่</text>
  <text x="560.0" y="520.0" font-size="12" text-anchor="start" fill="#6b7280">ถ้าแก้ได้ที่ขั้นใด ให้หยุดแล้วทดสอบว่าใช้ได้จริง</text>
  <text x="560.0" y="540.0" font-size="12" text-anchor="start" fill="#b91c1c">ห้ามเปิดฝาเครื่องหรือแหล่งจ่ายไฟเอง</text>
</svg>
