id: physics.kinematics.velocity
subject: physics
title: { th: การกระจัดและความเร็ว, en: Displacement and velocity }
summary: แยกปริมาณสเกลาร์กับเวกเตอร์ การกระจัดบอกการเปลี่ยนตำแหน่งพร้อมทิศทาง และความเร็วเฉลี่ยคือการกระจัดหารด้วยเวลา ซึ่งต่างจากอัตราเร็ว
difficulty: 3
minutes: 30
prerequisites: [physics.kinematics.speed, math.number.integers, math.geometry.pythagoras]
encompasses:
  - { id: physics.kinematics.speed, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: อ่านความเร็วจากกราฟตำแหน่ง–เวลา
    problem: "กราฟตำแหน่ง–เวลาของคนเดินเป็นดังรูป (ทิศออกจากบ้านเป็นบวก) หาความเร็วในแต่ละช่วง ความเร็วเฉลี่ย และอัตราเร็วเฉลี่ยตลอด $250\\ \\mathrm{s}$"
    figure:
      src: xt-graph.svg
      alt: "กราฟตำแหน่ง x (เมตร) กับเวลา t (วินาที) เส้นตรงขึ้นจาก (0, 0) ถึง (100 s, 150 m) เป็นเส้นราบที่ 150 m จนถึง 150 s แล้วเส้นตรงลงถึง (250 s, 50 m)"
    steps:
      - text: "ช่วง $0$–$100\\ \\mathrm{s}$: ความชัน $= \\dfrac{150 - 0}{100} = 1.5\\ \\mathrm{m/s}$"
        why: "ความชันของกราฟตำแหน่ง–เวลาคือความเร็ว"
      - text: "ช่วง $100$–$150\\ \\mathrm{s}$: เส้นราบ ความเร็ว $0$ (หยุดพัก) · ช่วง $150$–$250\\ \\mathrm{s}$: $\\dfrac{50 - 150}{100} = -1\\ \\mathrm{m/s}$ (เดินกลับ)"
      - text: "ความเร็วเฉลี่ย $= \\dfrac{x_2 - x_1}{\\Delta t} = \\dfrac{50 - 0}{250} = 0.2\\ \\mathrm{m/s}$"
        why: "ใช้เฉพาะตำแหน่งต้นและปลาย ช่วงที่เดินไปแล้วเดินกลับหักล้างกัน"
      - text: "ระยะทางรวม $150 + 100 = 250\\ \\mathrm{m}$ อัตราเร็วเฉลี่ย $= \\dfrac{250}{250} = 1\\ \\mathrm{m/s}$"
    answer: "ความเร็ว $1.5$, $0$, $-1\\ \\mathrm{m/s}$ ตามลำดับ ความเร็วเฉลี่ย $0.2\\ \\mathrm{m/s}$ แต่อัตราเร็วเฉลี่ย $1\\ \\mathrm{m/s}$"
  - { type: check, problem: phy.vel.p013, prompt: "อ่านกราฟของรถของเล่น" }
  - type: worked-example
    title: การกระจัดเมื่อเดินเลี้ยวมุมฉาก
    problem: "แพรเดินจากประตูโรงเรียนไปทางตะวันออก $300\\ \\mathrm{m}$ แล้วเลี้ยวไปทางเหนือ $400\\ \\mathrm{m}$ ใช้เวลารวม $350\\ \\mathrm{s}$ หาระยะทาง การกระจัด อัตราเร็วเฉลี่ย และขนาดของความเร็วเฉลี่ย"
    figure:
      src: displacement-2d.svg
      alt: "ลูกศรสีเขียวยาว 300 m ไปทางตะวันออก ต่อด้วยลูกศรสีเขียวยาว 400 m ไปทางเหนือ ลูกศรสีส้มเป็นการกระจัดลากตรงจากจุดเริ่มถึงจุดสุดท้าย วาดตามมาตราส่วน มีเข็มทิศบอกทิศเหนือและตะวันออก"
    steps:
      - text: "ระยะทาง $= 300 + 400 = 700\\ \\mathrm{m}$"
      - text: "สองช่วงตั้งฉากกัน ขนาดการกระจัด $= \\sqrt{300^2 + 400^2} = \\sqrt{250\\,000} = 500\\ \\mathrm{m}$ ไปทางตะวันออกเฉียงเหนือ"
        why: "การกระจัดคือด้านตรงข้ามมุมฉากของสามเหลี่ยมที่มีสองช่วงเป็นขา จึงสั้นกว่าระยะทางเสมอ"
      - text: "อัตราเร็วเฉลี่ย $= \\dfrac{700}{350} = 2\\ \\mathrm{m/s}$"
      - text: "ขนาดของความเร็วเฉลี่ย $= \\dfrac{500}{350} \\approx 1.43\\ \\mathrm{m/s}$ ทิศเดียวกับการกระจัด"
    answer: "ระยะทาง $700\\ \\mathrm{m}$ การกระจัด $500\\ \\mathrm{m}$ ไปทางตะวันออกเฉียงเหนือ อัตราเร็วเฉลี่ย $2\\ \\mathrm{m/s}$ ความเร็วเฉลี่ยประมาณ $1.43\\ \\mathrm{m/s}$"
  - { type: check, problem: phy.vel.p016, prompt: "ความเร็วเมื่อมองจากรถอีกคัน" }
glossary:
  - { term: ปริมาณสเกลาร์, definition: "ปริมาณที่มีแต่ขนาด ไม่มีทิศทาง เช่น ระยะทาง อัตราเร็ว เวลา มวล" }
  - { term: ปริมาณเวกเตอร์, definition: "ปริมาณที่มีทั้งขนาดและทิศทาง เช่น การกระจัด ความเร็ว ความเร่ง แรง" }
  - { term: การกระจัด, definition: "การเปลี่ยนตำแหน่งจากจุดเริ่มต้นไปจุดสุดท้าย วัดเป็นเส้นตรงพร้อมทิศทาง $\\Delta x = x_2 - x_1$" }
  - { term: ความเร็วเฉลี่ย, definition: "การกระจัดหารด้วยเวลาที่ใช้ $\\bar{v} = \\Delta x / \\Delta t$ มีทิศเดียวกับการกระจัด" }
  - { term: ความเร็วสัมพัทธ์, definition: "ความเร็วของวัตถุหนึ่งเมื่อมองจากอีกวัตถุหนึ่ง ในหนึ่งมิติ $v_{AB} = v_A - v_B$" }
flashcards:
  - { front: "ระยะทางกับการกระจัดต่างกันอย่างไร", back: "ระยะทางคือความยาวเส้นทางที่เคลื่อนที่จริง (สเกลาร์) การกระจัดคือเส้นตรงจากจุดเริ่มถึงจุดสุดท้ายพร้อมทิศทาง (เวกเตอร์)" }
  - { front: "วิ่งรอบสนามครบ 1 รอบกลับจุดเดิม การกระจัดเป็นเท่าใด", back: "ศูนย์ เพราะตำแหน่งสุดท้ายเท่ากับตำแหน่งเริ่มต้น" }
  - { front: "สูตรการกระจัดในหนึ่งมิติ", back: "$\\Delta x = x_2 - x_1$ (ตำแหน่งสุดท้ายลบตำแหน่งเริ่มต้น)" }
  - { front: "ความเร็วเป็นลบหมายความว่าอะไร", back: "วัตถุเคลื่อนที่ในทิศที่เราตั้งให้เป็นลบ เครื่องหมายบอกทิศ ไม่ได้แปลว่าช้า" }
  - { front: "ความชันของกราฟตำแหน่ง–เวลาคืออะไร", back: "ความเร็ว เส้นราบคือหยุดนิ่ง เส้นลาดลงคือความเร็วเป็นลบ" }
