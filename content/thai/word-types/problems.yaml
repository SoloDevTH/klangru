    answer: { value: 4, unit: คำ }
    hints:
      - "แยกคำก่อน: คุณแม่ / ซื้อ / มะม่วง / สาม / ลูก / ที่ / ตลาดนัด"
      - "ลักษณนามเป็นคำนาม ส่วนตัวเลขที่บอกจำนวนเป็นคำวิเศษณ์"
      - "ที่ ซึ่งนำหน้าคำนามบอกสถานที่เป็นคำบุพบท"
    misconceptions:
      - { match: 3, feedback: "ดูเหมือนลืมนับลักษณนาม ลูก ซึ่งเป็นคำนาม" }
      - { match: 5, feedback: "ดูเหมือนนับ สาม เป็นคำนาม คำบอกจำนวนที่ตามหลังคำนามเป็นคำวิเศษณ์" }
    solution: "คำนามคือ คุณแม่ มะม่วง ลูก (ลักษณนาม) และ ตลาดนัด รวม **4 คำ** ส่วน ซื้อ เป็นกริยา สาม เป็นวิเศษณ์บอกจำนวน และ ที่ เป็นบุพบท"
