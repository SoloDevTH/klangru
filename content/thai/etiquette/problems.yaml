problems:
- id: thai.communication.etiquette.p001
  topics:
  - thai.communication.etiquette
  difficulty: 1
  type: mcq
  stem: ในห้องสมุด ข้อใดเป็นมารยาทในการอ่านที่ดี
  choices:
  - id: a
    text: อ่านในใจ ไม่ส่งเสียงรบกวนผู้อื่น
    correct: true
    feedback: ถูก ห้องสมุดเป็นที่ที่ต้องการความเงียบ
  - id: b
    text: อ่านออกเสียงดัง ๆ ให้เพื่อนโต๊ะข้าง ๆ ได้ยิน
    feedback: เสียงดังรบกวนคนอื่นที่กำลังอ่าน
  - id: c
    text: พับมุมหนังสือไว้หน้าที่อ่านค้าง
    feedback: ทำให้หนังสือเสียหาย ควรใช้ที่คั่นหนังสือ
  - id: d
    text: ขีดเส้นใต้ในหนังสือของห้องสมุด
    feedback: หนังสือห้องสมุดเป็นของส่วนรวม ห้ามขีดเขียน
  hints:
  - ห้องสมุดมีคนอื่นใช้ด้วย
  - อะไรไม่รบกวนคนอื่นและไม่ทำให้หนังสือเสียหาย
  solution: '**อ่านในใจ ไม่ส่งเสียงรบกวน** ส่วนการพับมุมและขีดเขียนทำให้หนังสือของส่วนรวมเสียหาย'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.communication.etiquette.p002
  topics:
  - thai.communication.etiquette
  difficulty: 1
  type: mcq
  stem: ขณะครูกำลังอธิบายบทเรียน นักเรียนควรทำอย่างไร
  choices:
  - id: a
    text: มองครู ตั้งใจฟัง ไม่คุยกับเพื่อน
    correct: true
    feedback: ถูก เป็นมารยาทในการฟัง
  - id: b
    text: คุยกับเพื่อนเบา ๆ ไม่เป็นไร
    feedback: แม้คุยเบา ๆ ก็รบกวนครูและเพื่อนที่ตั้งใจฟัง
  - id: c
    text: พูดแทรกทันทีเมื่อสงสัย
    feedback: ควรรอให้ครูพูดจบแล้วยกมือถาม
  - id: d
    text: เล่นโทรศัพท์ใต้โต๊ะ
    feedback: ไม่ให้เกียรติผู้พูด และทำให้ฟังไม่ครบ
  hints:
  - มารยาทในการฟังเริ่มที่ตาและปาก
  - ทำอย่างไรผู้พูดจึงรู้ว่าเราตั้งใจฟัง
  solution: '**มองผู้พูด ตั้งใจฟัง ไม่คุย** สงสัยให้ถามเมื่อพูดจบ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.communication.etiquette.p003
  topics:
  - thai.communication.etiquette
  difficulty: 1
  type: match
  stem: จับคู่การกระทำกับมารยาทที่เกี่ยวข้อง
  pairs:
  - left: ไม่แอบอ่านสมุดบันทึกของพี่
    right: มารยาทในการอ่าน
  - left: บอกแหล่งที่มาในรายงาน
    right: มารยาทในการเขียน
  - left: ไม่พูดแทรกเมื่อเพื่อนนำเสนอ
    right: มารยาทในการฟัง
  - left: ปิดเสียงโทรศัพท์ในโรงภาพยนตร์
    right: มารยาทในการดู
  - left: ไม่พูดขณะมีอาหารในปาก
    right: มารยาทในการพูด
  hints:
  - แต่ละข้อเกี่ยวกับทักษะใด อ่าน เขียน ฟัง ดู หรือพูด
  - ดูภาพสรุปมารยาท 5 เรื่องในบทเรียน
  solution: แอบอ่าน → อ่าน · แหล่งที่มา → เขียน · ไม่พูดแทรก → ฟัง · โรงภาพยนตร์ → ดู · อาหารในปาก → พูด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.communication.etiquette.p004
  topics:
  - thai.communication.etiquette
  difficulty: 2
  type: mcq
  stem: นิดยืมหนังสือนิทานจากห้องสมุดโรงเรียน ข้อใดเป็นการ **ถนอมหนังสือ**
  choices:
  - id: a
    text: ใช้ที่คั่นหนังสือ และคืนตรงวันที่กำหนด
    correct: true
    feedback: ถูก หนังสือไม่เสียหายและคนอื่นได้ยืมต่อ
  - id: b
    text: วางหนังสือคว่ำกางไว้เพื่อจำหน้า
    feedback: ทำให้สันหนังสือหักและหลุด
  - id: c
    text: ระบายสีภาพในหนังสือให้สวยขึ้น
    feedback: เป็นการขีดเขียนหนังสือของส่วนรวม
  - id: d
    text: อ่านไปกินขนมไป
    feedback: เศษอาหารทำให้หนังสือเปื้อน
  hints:
  - หนังสือห้องสมุดต้องส่งต่อให้คนอื่น
  - อะไรไม่ทำให้หนังสือเสียหาย
  solution: '**ใช้ที่คั่นหนังสือ และคืนตรงเวลา**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.communication.etiquette.p005
  topics:
  - thai.communication.etiquette
  difficulty: 2
  type: mcq
  stem: ดูความคิดเห็นในกลุ่มแชต ความคิดเห็นของใคร **ไม่มีมารยาท** เพราะล้อเลียนเพื่อน
  figure: &id001
    src: comment-thread.svg
    alt: 'ภาพจำลองกลุ่มแชตห้อง ป.5/2 ครูแพรโพสต์ผลงานวาดภาพ ทะเลบ้านเรา ของนักเรียนทุกคนและชวนแสดงความคิดเห็น มีความคิดเห็น 4 ข้อ ก ภูมิ: ชอบสีฟ้าของน้ำทะเลมากครับ ถ้าเพิ่มเรือสักลำน่าจะสวยขึ้น ข เจน: 555 รูปของบีเหมือนเด็กอนุบาลวาด ค โอ๊ต: ใครมีเบอร์บ้านกับที่อยู่ของครูแพร ส่งมาในนี้หน่อย ง มายด์: ขอบคุณที่แบ่งปันค่ะ ภาพของทุกคนทำให้อยากไปเที่ยวทะเลเลย'
  choices:
  - id: a
    text: ข
    correct: true
    feedback: ถูก เจนพิมพ์ล้อว่ารูปของบีเหมือนเด็กอนุบาลวาด ทำให้เพื่อนเสียใจ
  - id: b
    text: ก
    feedback: ภูมิชมก่อน แล้วเสนอแนะอย่างสุภาพ เป็นความเห็นที่ดี
  - id: c
    text: ง
    feedback: มายด์ขอบคุณและชม เป็นความเห็นที่ดี
  - id: d
    text: ค
    feedback: ความเห็นของโอ๊ตไม่เหมาะสมเหมือนกัน แต่เป็นเรื่องขอข้อมูลส่วนตัว ไม่ใช่การล้อเลียน
  hints:
  - อ่านทุกความคิดเห็น
  - หาข้อความที่ทำให้เพื่อนอับอาย
  solution: ความคิดเห็น **ข** ล้อเลียนผลงานของเพื่อน ควรติที่งานอย่างสุภาพหรือไม่ต้องพิมพ์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.communication.etiquette.p006
  topics:
  - thai.communication.etiquette
  difficulty: 2
  type: mcq
  stem: ดูความคิดเห็นในกลุ่มแชต ความคิดเห็น **ค** ไม่เหมาะสมเพราะอะไร
  figure: *id001
  choices:
  - id: a
    text: ขอให้ส่งข้อมูลส่วนตัวของผู้อื่นในกลุ่ม
    correct: true
    feedback: ถูก เบอร์บ้านและที่อยู่เป็นข้อมูลส่วนตัว ไม่ควรเผยแพร่โดยเจ้าของไม่อนุญาต
  - id: b
    text: ใช้คำหยาบ
    feedback: ข้อความไม่มีคำหยาบ ปัญหาคือการขอข้อมูลส่วนตัว
  - id: c
    text: พิมพ์สะกดผิด
    feedback: ข้อความสะกดถูก ปัญหาอยู่ที่เนื้อหา
  - id: d
    text: ไม่ได้ชมผลงานของเพื่อน
    feedback: ไม่จำเป็นต้องชมทุกครั้ง ปัญหาคือขอข้อมูลส่วนตัวของครู
  hints:
  - ข้อความขออะไร
  - ข้อมูลแบบไหนไม่ควรแชร์ในกลุ่ม
  solution: ความคิดเห็น ค **ขอข้อมูลส่วนตัวของครู** มาเผยแพร่ในกลุ่ม ซึ่งเจ้าของไม่ได้อนุญาต
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.communication.etiquette.p007
  topics:
  - thai.communication.etiquette
  difficulty: 2
  type: order
  stem: เรียงสิ่งที่ควรทำเมื่อฟังเพื่อนนำเสนอแล้วอยากแสดงความคิดเห็น
  items:
  - ฟังจนเพื่อนนำเสนอจบ
  - ปรบมือให้เกียรติผู้นำเสนอ
  - ยกมือรอให้ครูอนุญาต
  - บอกส่วนที่ดีของงานก่อน
  - เสนอแนะอย่างสุภาพ ติที่งาน
  hints:
  - เริ่มจากฟังให้จบ
  - ชมก่อนแล้วจึงเสนอแนะ
  solution: ฟังจนจบ → ปรบมือ → ยกมือ → ชมส่วนที่ดี → เสนอแนะอย่างสุภาพ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.communication.etiquette.p008
  topics:
  - thai.communication.etiquette
  difficulty: 3
  type: mcq
  stem: ต้นทำรายงานเรื่องช้างไทย แล้วคัดลอกข้อความจากเว็บไซต์หนึ่งมาทั้งย่อหน้าโดยไม่บอกที่มา ข้อใดถูก
  choices:
  - id: a
    text: เป็นการลักลอกผลงาน ต้องเขียนด้วยคำของตัวเองและบอกแหล่งที่มา
    correct: true
    feedback: ถูก ข้อความในเว็บมีเจ้าของ
  - id: b
    text: ไม่ผิด เพราะข้อมูลในอินเทอร์เน็ตใครก็ใช้ได้
    feedback: ข้อมูลในอินเทอร์เน็ตก็มีเจ้าของ ต้องให้เครดิต
  - id: c
    text: ไม่ผิด ถ้าเปลี่ยนแบบอักษรให้ต่างจากเดิม
    feedback: การเปลี่ยนแบบอักษรไม่ได้ทำให้ข้อความเป็นของเรา
  - id: d
    text: ไม่ผิด เพราะครูไม่รู้
    feedback: มารยาทไม่ได้ขึ้นกับว่ามีคนรู้หรือไม่
  hints:
  - ข้อความนี้ใครเป็นคนเขียน
  - นำความรู้ของคนอื่นมาใช้ต้องทำอะไร
  solution: เป็น **การลักลอกผลงาน** ต้องสรุปด้วยคำของตัวเองและบอกแหล่งที่มา เช่น ชื่อเว็บไซต์และปี
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.communication.etiquette.p009
  topics:
  - thai.communication.etiquette
  difficulty: 3
  type: mcq
  stem: ข้อใดเป็นการ **บอกแหล่งที่มา** ที่ครบถ้วนที่สุด
  choices:
  - id: a
    text: สมชาย ใจดี. (2567). นกในสวนหลังบ้าน. หน้า 12.
    correct: true
    feedback: ถูก มีชื่อผู้เขียน ปี ชื่อหนังสือ และหน้า
  - id: b
    text: จากหนังสือเล่มหนึ่งในห้องสมุด
    feedback: ไม่บอกชื่อหนังสือหรือผู้เขียน คนอื่นตามไปหาไม่ได้
  - id: c
    text: จากอินเทอร์เน็ต
    feedback: ไม่บอกว่าเว็บไซต์ใด ใครเขียน
  - id: d
    text: สมชาย
    feedback: มีแค่ชื่อผู้เขียน ไม่รู้ว่าเป็นหนังสือหรืองานใด
  hints:
  - แหล่งที่มาที่ดีทำให้คนอื่นตามไปอ่านได้
  - ต้องมี ใครเขียน ปีไหน ชื่ออะไร
  solution: '**สมชาย ใจดี. (2567). นกในสวนหลังบ้าน. หน้า 12.** ครบทั้งผู้เขียน ปี ชื่อเรื่อง และหน้า'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.communication.etiquette.p010
  topics:
  - thai.communication.etiquette
  difficulty: 3
  type: mcq
  stem: ก่อนภาพยนตร์ในโรงภาพยนตร์จะเริ่ม ข้อใดเป็นมารยาทในการดูที่เหมาะสม
  choices:
  - id: a
    text: ปิดเสียงโทรศัพท์ และไม่เปิดจอสว่างระหว่างภาพยนตร์
    correct: true
    feedback: ถูก เสียงและแสงจากโทรศัพท์รบกวนคนอื่น
  - id: b
    text: ถ่ายวิดีโอภาพยนตร์เพื่อส่งให้เพื่อนดู
    feedback: ห้ามถ่ายภาพยนตร์ในโรง และเป็นการละเมิดลิขสิทธิ์
  - id: c
    text: พากย์ตามเสียงดังเพราะเคยดูแล้ว
    feedback: รบกวนคนอื่นที่ยังไม่เคยดู
  - id: d
    text: วางเท้าบนพนักเก้าอี้แถวหน้า
    feedback: ไม่สุภาพต่อคนที่นั่งข้างหน้า
  hints:
  - คิดถึงคนที่นั่งรอบตัวเรา
  - อะไรไม่รบกวนทั้งเสียงและแสง
  solution: '**ปิดเสียงโทรศัพท์ ไม่เปิดจอ** ส่วนการถ่ายวิดีโอภาพยนตร์ทั้งผิดมารยาทและผิดกฎหมายลิขสิทธิ์'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.communication.etiquette.p011
  topics:
  - thai.communication.etiquette
  difficulty: 4
  type: mcq
  stem: เพื่อนนำเสนอผิดว่า "ประเทศไทยมี 70 จังหวัด" ข้อใดเป็นการพูดที่มีมารยาทที่สุด
  choices:
  - id: a
    text: รอเพื่อนนำเสนอจบ แล้วบอกว่า "ข้อมูลล่าสุดคือ 76 จังหวัดกับกรุงเทพมหานคร ลองตรวจอีกทีนะ"
    correct: true
    feedback: ถูก รอให้จบ ติที่ข้อมูล บอกข้อมูลที่ถูกอย่างสุภาพ
  - id: b
    text: ตะโกนแทรกทันทีว่า "ผิดแล้ว"
    feedback: พูดแทรกและทำให้เพื่อนอับอาย
  - id: c
    text: หัวเราะเสียงดังแล้วกระซิบบอกคนข้าง ๆ
    feedback: หัวเราะเยาะและนินทา ไม่ช่วยให้เพื่อนรู้ข้อมูลที่ถูก
  - id: d
    text: พูดว่า "เธอนี่ไม่รู้อะไรเลย"
    feedback: ติที่ตัวคน ไม่ใช่ที่ข้อมูล
  hints:
  - มีมารยาท = รอให้จบ + สุภาพ + ติที่งาน
  - ช่วยให้เพื่อนรู้ข้อมูลที่ถูกโดยไม่อับอาย
  solution: รอให้จบ แล้ว **บอกข้อมูลที่ถูกอย่างสุภาพ** (ไทยมี 76 จังหวัดกับกรุงเทพมหานคร) ติที่ข้อมูล ไม่ติที่ตัวคน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.communication.etiquette.p012
  topics:
  - thai.communication.etiquette
  difficulty: 4
  type: mcq
  stem: ข้อใดเป็นมารยาทในการเขียนออนไลน์ **ทั้งหมด**
  choices:
  - id: a
    text: คิดก่อนโพสต์ · ไม่แชร์รูปเพื่อนโดยไม่ขออนุญาต · ไม่ส่งต่อข่าวที่ไม่รู้ว่าจริงหรือไม่
    correct: true
    feedback: ถูก ทั้งสามข้อเป็นมารยาทออนไลน์
  - id: b
    text: คิดก่อนโพสต์ · ใช้ตัวพิมพ์ใหญ่ทั้งหมดเพื่อให้เด่น · ส่งต่อข่าวด่วนทันที
    feedback: ข่าวด่วนต้องตรวจก่อนส่งต่อ
  - id: c
    text: ตอบทุกความเห็นทันที · แชร์รูปเพื่อนตอนหลับเพราะตลก · ใช้คำสุภาพ
    feedback: แชร์รูปเพื่อนโดยไม่ขออนุญาตทำให้เพื่อนอับอาย
  - id: d
    text: ใช้คำสุภาพ · ลงเบอร์โทรเพื่อนให้คนอื่นติดต่อได้ · คิดก่อนโพสต์
    feedback: เบอร์โทรเป็นข้อมูลส่วนตัว
  hints:
  - ทุกข้อในตัวเลือกต้องถูก
  - ตรวจเรื่องข้อมูลส่วนตัว รูปของผู้อื่น และข่าวที่ไม่แน่ใจ
  solution: ตัวเลือกแรกถูกทั้งสามข้อ ตัวเลือกอื่นมีอย่างน้อยหนึ่งข้อที่ละเมิดผู้อื่นหรือส่งต่อข่าวที่ไม่ได้ตรวจ
