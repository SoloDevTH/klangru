problems:
- id: health.sexuality.puberty.p001
  topics:
  - health.sexuality.puberty
  difficulty: 1
  type: mcq
  stem: ตาม NHS การเข้าสู่วัยเริ่มเจริญพันธุ์เริ่มได้ตามปกติในช่วงอายุใด
  choices:
  - id: a
    text: 8 ถึง 14 ปี
    correct: true
  - id: b
    text: 12 ปีเท่านั้น
    feedback: 12 ปีคืออายุที่หลายคนมีประจำเดือนครั้งแรก แต่การเริ่มเข้าสู่วัยเริ่มเจริญพันธุ์มีช่วงกว้างกว่านั้นมาก
  - id: c
    text: 15 ถึง 18 ปี
    feedback: ถ้ายังไม่เริ่มเมื่ออายุ 15 ปี ควรปรึกษาแพทย์ ช่วงปกติเริ่มเร็วกว่านั้น
  hints:
  - แต่ละคนเริ่มไม่พร้อมกัน ช่วงจึงกว้างหลายปี
  - เริ่มก่อน 8 ปีหรือยังไม่เริ่มเมื่อ 15 ปีควรปรึกษาแพทย์
  solution: การเข้าสู่วัยเริ่มเจริญพันธุ์เริ่มได้ตามปกติตั้งแต่อายุ 8 ถึง 14 ปี แต่ละคนต่างกันและปกติทั้งหมด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sexuality.puberty.p002
  topics:
  - health.sexuality.puberty
  difficulty: 1
  type: mcq
  stem: เด็กผู้ชายตื่นมาพบว่ากางเกงเปียกเหนียวจากการหลั่งน้ำอสุจิขณะหลับ ข้อใดถูกต้อง
  choices:
  - id: a
    text: เป็นเรื่องปกติของการเติบโต ให้เปลี่ยนกางเกงและนำไปซัก
    correct: true
  - id: b
    text: เป็นโรคที่ต้องรีบรักษา
    feedback: การหลั่งน้ำอสุจิขณะหลับไม่ใช่โรค เป็นส่วนหนึ่งของวัยเริ่มเจริญพันธุ์
  - id: c
    text: เป็นการปัสสาวะรดที่นอน
    feedback: ของเหลวนี้คือน้ำอสุจิ ไม่ใช่ปัสสาวะ
  hints:
  - เกิดได้เองโดยไม่ได้ตั้งใจ
  - เกิดกับเด็กผู้ชายจำนวนมากเมื่อเข้าสู่วัยรุ่น
  solution: การหลั่งน้ำอสุจิขณะหลับ (ฝันเปียก) เป็นเรื่องปกติของการเติบโต ไม่ใช่โรคและไม่ใช่ปัสสาวะ ดูแลด้วยการเปลี่ยนและซักผ้าให้สะอาด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sexuality.puberty.p003
  topics:
  - health.sexuality.puberty
  difficulty: 2
  type: numeric
  stem: จากปฏิทินของมุก รอบประจำเดือนจากวันแรกในเดือนมกราคมถึงวันก่อนประจำเดือนครั้งถัดไปยาวกี่วัน (ตอบเป็นวัน)
  figure: &id001
    src: period-calendar.svg
    alt: ปฏิทินบันทึกประจำเดือนของมุก (ข้อมูลสมมติ) สองเดือน เดือนมกราคมมี 31 วัน วงกลมสีแดงที่วันที่ 5 6 7 8 และ 9 มกราคม เดือนกุมภาพันธ์มี 28 วัน วงกลมสีแดงที่วันที่ 2 3 4 5 6 และ 7 กุมภาพันธ์ วงกลมสีแดงคือวันที่มีประจำเดือน
  answer:
    value: 28
    unit: วัน
  misconceptions:
  - match: 26
    feedback: 31 − 5 = 26 ยังไม่ครบ ต้องนับวันที่ 5 มกราคมเองและวันที่ 1 กุมภาพันธ์ด้วย
  - match: 33
    feedback: บวกวันที่ 31 กับ 2 ตรง ๆ โดยไม่ได้ลบวันที่ 5 ซึ่งเป็นวันเริ่มต้น
  hints:
  - วันแรกของรอบคือวันแรกที่มีประจำเดือน (5 มกราคม)
  - นับวันที่เหลือในมกราคมแล้วบวกวันในกุมภาพันธ์ก่อนครั้งถัดไป
  solution: นับวันที่ 5–31 มกราคมได้ $31 - 5 + 1 = 27$ วัน บวกวันที่ 1 กุมภาพันธ์อีก 1 วัน (วันที่ 2 เป็นวันแรกของรอบใหม่) รวม 28 วัน หรือคิดลัดด้วย $(31 - 5) + 2 = 28$ วัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sexuality.puberty.p004
  topics:
  - health.sexuality.puberty
  difficulty: 2
  type: numeric
  stem: จากปฏิทินของมุก ประจำเดือนในเดือนกุมภาพันธ์มากี่วัน (ตอบเป็นวัน)
  figure: *id001
  answer:
    value: 6
    unit: วัน
  misconceptions:
  - match: 5
    feedback: 7 − 2 = 5 ลืมนับวันแรก ต้องนับทั้งวันที่ 2 และวันที่ 7
  - match: 7
    feedback: 7 คือวันที่สุดท้าย ไม่ใช่จำนวนวัน
  hints:
  - นับวงกลมสีแดงในเดือนกุมภาพันธ์
  - นับรวมทั้งวันแรกและวันสุดท้าย
  solution: วงกลมสีแดงอยู่ที่วันที่ 2 ถึง 7 กุมภาพันธ์ นับได้ $7 - 2 + 1 = 6$ วัน อยู่ในช่วงปกติ 2–7 วัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sexuality.puberty.p005
  topics:
  - health.sexuality.puberty
  difficulty: 2
  type: mcq
  stem: ข้อใดเป็นการเปลี่ยนแปลงที่เกิดได้กับทุกเพศเมื่อเข้าสู่วัยเริ่มเจริญพันธุ์ (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: สูงขึ้นเร็ว
    correct: true
    feedback: ถูก
  - id: b
    text: มีขนรักแร้และมีกลิ่นตัว
    correct: true
    feedback: ถูก
  - id: c
    text: เป็นสิวง่ายขึ้น
    correct: true
    feedback: ถูก
  - id: d
    text: มีประจำเดือน
    feedback: ประจำเดือนเกิดกับผู้ที่มีมดลูกและรังไข่ ไม่ใช่ทุกเพศ
  - id: e
    text: เสียงแตกห้าวขึ้นมาก
    feedback: เสียงแตกห้าวเห็นชัดในเด็กผู้ชาย
  hints:
  - บางข้อเกิดกับเพศใดเพศหนึ่งเท่านั้น
  - นึกถึงเรื่องเหงื่อ ขน และผิว
  solution: ทุกเพศสูงขึ้นเร็ว มีขนรักแร้ กลิ่นตัว และสิว ส่วนประจำเดือนเกิดในเด็กผู้หญิง และเสียงห้าวขึ้นมากเห็นชัดในเด็กผู้ชาย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sexuality.puberty.p006
  topics:
  - health.sexuality.puberty
  difficulty: 2
  type: match
  stem: จับคู่การเปลี่ยนแปลงกับวิธีดูแลตัวเองที่เหมาะสม
  pairs:
  - left: มีกลิ่นตัว
    right: อาบน้ำหลังเล่นกีฬาและเปลี่ยนเสื้อผ้าที่เปียกเหงื่อ
  - left: เป็นสิว
    right: ล้างหน้าวันละ 2 ครั้งและไม่บีบสิว
  - left: มีประจำเดือน
    right: เปลี่ยนผ้าอนามัยสม่ำเสมอและห่อทิ้งในถังขยะ
  - left: หลั่งน้ำอสุจิขณะหลับ
    right: เปลี่ยนกางเกงและนำไปซักให้สะอาด
  hints:
  - แต่ละข้อดูแลด้วยความสะอาดคนละแบบ
  - สิวไม่ควรบีบเพราะอาจเป็นแผลเป็น
  solution: กลิ่นตัวดูแลด้วยการอาบน้ำ สิวดูแลด้วยการล้างหน้าและไม่บีบ ประจำเดือนดูแลด้วยการเปลี่ยนผ้าอนามัย และการหลั่งน้ำอสุจิขณะหลับดูแลด้วยการเปลี่ยนและซักผ้า
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sexuality.puberty.p007
  topics:
  - health.sexuality.puberty
  difficulty: 2
  type: mcq
  stem: แก้วมีประจำเดือนครั้งแรกระหว่างเรียนที่โรงเรียน และไม่ได้พกผ้าอนามัยมา แก้วควรทำอย่างไร
  choices:
  - id: a
    text: บอกครูที่ไว้ใจหรือไปขอผ้าอนามัยที่ห้องพยาบาลของโรงเรียน
    correct: true
  - id: b
    text: ซ่อนไว้และนั่งอยู่เฉย ๆ จนเลิกเรียน
    feedback: ไม่ต้องอาย ครูและห้องพยาบาลช่วยได้ การรีบจัดการทำให้สบายตัวกว่า
  - id: c
    text: ขอกลับบ้านโดยไม่บอกเหตุผลกับใคร
    feedback: การบอกครูหรือพยาบาลช่วยแก้ปัญหาได้ทันที และไม่จำเป็นต้องขาดเรียน
  hints:
  - ประจำเดือนเป็นเรื่องธรรมชาติ ไม่ใช่เรื่องน่าอาย
  - ในโรงเรียนมีใครช่วยได้บ้าง
  solution: ขอความช่วยเหลือจากครูหรือห้องพยาบาลของโรงเรียน ครั้งต่อไปพกผ้าอนามัยและกางเกงชั้นในสำรองไว้ในกระเป๋า
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sexuality.puberty.p008
  topics:
  - health.sexuality.puberty
  difficulty: 3
  type: mcq
  stem: ข้อใดเป็นความเชื่อผิดเกี่ยวกับช่วงที่มีประจำเดือน
  choices:
  - id: a
    text: ห้ามสระผมและห้ามออกกำลังกาย
    correct: true
    feedback: ถูก ข้อนี้เป็นความเชื่อผิด อาบน้ำ สระผม และออกกำลังกายได้ตามปกติ
  - id: b
    text: การประคบอุ่นที่ท้องช่วยลดปวดได้
    feedback: ข้อนี้เป็นวิธีที่ช่วยได้จริง ไม่ใช่ความเชื่อผิด
  - id: c
    text: ควรเปลี่ยนผ้าอนามัยอย่างสม่ำเสมอ
    feedback: ข้อนี้ถูกต้อง เป็นการดูแลความสะอาดที่เหมาะสม
  hints:
  - หาข้อที่ไม่มีหลักฐานทางการแพทย์รองรับ
  - การเคลื่อนไหวเบา ๆ ช่วยลดปวดประจำเดือน
  solution: ช่วงมีประจำเดือนอาบน้ำ สระผม และออกกำลังกายได้ตามปกติ การเคลื่อนไหวเบา ๆ และการประคบอุ่นยังช่วยลดปวด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sexuality.puberty.p009
  topics:
  - health.sexuality.puberty
  difficulty: 3
  type: numeric
  stem: ประจำเดือนของฝ้ายเริ่มวันที่ 10 มีนาคม (เดือนมีนาคมมี 31 วัน) ถ้ารอบของฝ้ายยาว 30 วันพอดี ประจำเดือนครั้งถัดไปน่าจะเริ่มวันที่เท่าไรของเดือนเมษายน (ตอบเป็นเลขวันที่)
  answer:
    value: 9
    unit: วันที่
  misconceptions:
  - match: 10
    feedback: คิดเหมือนเดือนมีนาคมมี 30 วัน แต่มีนาคมมี 31 วัน
  - match: 40
    feedback: 10 + 30 = 40 ยังไม่ได้ลบจำนวนวันในเดือนมีนาคม
  hints:
  - วันเริ่มรอบใหม่ = วันเริ่มรอบเดิม + ความยาวรอบ
  - ถ้าเกินจำนวนวันในเดือน ให้ลบ 31 แล้วไปต่อในเดือนเมษายน
  solution: $10 + 30 = 40$ ซึ่งเกินเดือนมีนาคม $40 - 31 = 9$ จึงเป็นวันที่ 9 เมษายน เป็นการคาดคะเน เพราะรอบในวัยรุ่นอาจไม่สม่ำเสมอ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sexuality.puberty.p010
  topics:
  - health.sexuality.puberty
  difficulty: 3
  type: order
  stem: เรียงขั้นการเปลี่ยนผ้าอนามัยให้ถูกสุขอนามัย
  items:
  - ล้างมือให้สะอาด
  - ถอดแผ่นเก่า ม้วนแล้วห่อด้วยกระดาษหรือห่อของแผ่นใหม่
  - ทิ้งลงถังขยะ ไม่ทิ้งลงชักโครก
  - ติดแผ่นใหม่
  - ล้างมืออีกครั้ง
  hints:
  - เริ่มและจบด้วยขั้นเดียวกัน
  - ต้องจัดการแผ่นเก่าก่อนติดแผ่นใหม่
  solution: ล้างมือ → ถอดแผ่นเก่าแล้วห่อ → ทิ้งลงถังขยะ → ติดแผ่นใหม่ → ล้างมือ การทิ้งลงชักโครกทำให้ท่ออุดตัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sexuality.puberty.p011
  topics:
  - health.sexuality.puberty
  difficulty: 3
  type: mcq
  stem: ในห้องเรียน เพื่อนกลุ่มหนึ่งล้อโอ๊ตที่เสียงแตกจนโอ๊ตไม่กล้าตอบคำถามครู ถ้าเราอยู่ในเหตุการณ์ ข้อใดเหมาะสมที่สุด
  choices:
  - id: a
    text: ไม่หัวเราะตาม บอกเพื่อนว่าเสียงแตกเป็นเรื่องปกติที่ทุกคนต้องเจอ และชวนโอ๊ตคุย ถ้ายังล้อต่อให้บอกครู
    correct: true
  - id: b
    text: หัวเราะตามเพราะทุกคนก็หัวเราะ
    feedback: การหัวเราะตามทำให้การล้อเลียนดำเนินต่อและทำร้ายความรู้สึกของโอ๊ต
  - id: c
    text: บอกโอ๊ตว่าให้ทำเสียงให้เหมือนเดิม
    feedback: เสียงแตกเกิดจากกล่องเสียงที่โตขึ้น ควบคุมให้เหมือนเดิมไม่ได้ และไม่จำเป็นต้องเปลี่ยน
  hints:
  - เสียงแตกเป็นการเปลี่ยนแปลงตามธรรมชาติ
  - ผู้เห็นเหตุการณ์ช่วยหยุดการล้อเลียนได้
  solution: เสียงแตกเป็นการเปลี่ยนแปลงปกติ ผู้เห็นเหตุการณ์ช่วยได้ด้วยการไม่หัวเราะตาม พูดอย่างสุภาพ ให้กำลังใจเพื่อน และแจ้งครูถ้าการล้อยังไม่หยุด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sexuality.puberty.p012
  topics:
  - health.sexuality.puberty
  difficulty: 3
  type: text
  stem: การหลั่งน้ำอสุจิขณะหลับโดยไม่ได้ตั้งใจ คนทั่วไปเรียกว่าอะไร (ตอบเป็นคำ 2 พยางค์)
  accepted:
  - ฝันเปียก
  - ฝันเปียก ๆ
  misconceptions:
  - match: ปัสสาวะรดที่นอน
    feedback: ปัสสาวะรดที่นอนเป็นคนละเรื่อง ของเหลวในกรณีนี้คือน้ำอสุจิ
  hints:
  - เกิดขณะนอนหลับ
  - ขึ้นต้นด้วยคำว่า "ฝัน"
  solution: การหลั่งน้ำอสุจิขณะหลับเรียกว่า "ฝันเปียก" เป็นเรื่องปกติของวัยเริ่มเจริญพันธุ์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sexuality.puberty.p013
  topics:
  - health.sexuality.puberty
  difficulty: 4
  type: mcq
  stem: สถานการณ์ใดควรพาไปพบแพทย์ (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
