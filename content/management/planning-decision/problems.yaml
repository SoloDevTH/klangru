      - { left: "สั่งน้ำแข็งสำหรับร้านโดยรู้จากสถิติว่าวันอากาศร้อนมีโอกาส 70%", right: "ภายใต้ความเสี่ยง" }
      - { left: "ลงทุนในเทคโนโลยีใหม่ที่ไม่เคยมีใครขายมาก่อน และไม่มีข้อมูลประมาณโอกาส", right: "ภายใต้ความไม่แน่นอน" }
    hints:
      - "รู้ผลแน่นอน รู้ความน่าจะเป็น หรือไม่รู้แม้แต่ความน่าจะเป็น"
      - "ความเสี่ยงคือรู้ความน่าจะเป็นแต่ไม่รู้ผลแน่นอน"
    solution: "ดอกเบี้ยพันธบัตรรู้แน่นอน การสั่งน้ำแข็งมีความน่าจะเป็นจากสถิติจึงเป็นความเสี่ยง ส่วนเทคโนโลยีใหม่ที่ไม่มีข้อมูลเป็นความไม่แน่นอน"
