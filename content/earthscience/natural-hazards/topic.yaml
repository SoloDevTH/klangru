id: earthscience.hazards.natural-hazards
subject: earthscience
title: { th: ภัยธรรมชาติและธรณีพิบัติภัย, en: "Natural hazards and geohazards" }
summary: ลักษณะ การเกิด และผลกระทบของน้ำท่วม ดินถล่ม การกัดเซาะชายฝั่ง หลุมยุบ แผ่นดินทรุด ภัยแล้ง พายุ แผ่นดินไหว และสึนามิ การเฝ้าระวัง การปฏิบัติตน และการออกแบบวิธีลดผลกระทบ
difficulty: 3
minutes: 40
prerequisites: [earthscience.geology.earth-structure-surface, earthscience.hydrosphere.water-resources]
encompasses:
  - { id: earthscience.hydrosphere.water-resources, weight: 0.2 }
  - { id: earthscience.geology.earth-structure-surface, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ภัยธรรมชาติที่พบบ่อยในแต่ละภาค
    src: hazard-map.svg
    alt: "แผนที่ร่างประเทศไทยแบ่งพื้นที่เป็น 6 กลุ่มด้วยสีและหมายเลข 1 ภาคเหนือและแนวภูเขาด้านตะวันตก น้ำป่าไหลหลาก ดินถล่ม และแผ่นดินไหวจากรอยเลื่อนมีพลัง 2 ที่ราบภาคกลางลุ่มแม่น้ำเจ้าพระยา น้ำล้นตลิ่งและน้ำท่วมขังนาน 3 ภาคตะวันออกเฉียงเหนือ ภัยแล้ง ฝนทิ้งช่วง และน้ำท่วมลุ่มแม่น้ำชีและมูล 4 ชายฝั่งอ่าวไทยตอนบนใต้กรุงเทพฯ การกัดเซาะชายฝั่งและแผ่นดินทรุด 5 ชายฝั่งทะเลอันดามัน สึนามิซึ่งเกิดนาน ๆ ครั้งแต่รุนแรง และคลื่นลมแรงช่วงมรสุมตะวันตกเฉียงใต้ 6 ภาคใต้ฝั่งอ่าวไทย น้ำท่วมใหญ่และดินถล่มช่วงปลายปี พายุ และการกัดเซาะชายฝั่ง หมายเหตุว่าหลุมยุบพบในพื้นที่หินปูนหลายภาค ภัยแล้ง ฟ้าผ่า และพายุฤดูร้อนเกิดได้ทั่วประเทศ"
    caption: "แผนที่ร่างเพื่อการเรียน ขอบเขตโดยประมาณ ไม่ใช่แผนที่เสี่ยงภัยจริง ดูข้อมูลพื้นที่เสี่ยงของท้องถิ่นจากหน่วยงานรัฐ (วาดโดยทีมคลังรู้)"
  - type: figure
    title: ดินถล่มเกิดอย่างไร
    src: landslide.svg
    alt: "ภาพตัดลาดเขาสองภาพ ภาพซ้าย ก่อนเกิด ฝนตกหนักหลายวัน ชั้นดินบนชั้นหินแข็ง มีลูกศรน้ำซึมลงดิน ส่วนล่างของชั้นดินเป็นสีฟ้าแทนดินอิ่มน้ำ หนักขึ้นและยึดเกาะกันน้อยลง ต้นไม้เหลือเพียงสองต้นบนยอด ป้ายว่าป่าถูกตัด รากยึดดินน้อย มีบ้านอยู่ที่เชิงเขา ภาพขวา เกิดดินถล่ม ชั้นดินกลางลาดหายไปเหลือรอยดินที่ไถลออกไป ลูกศรชี้ลงมาที่กองดินโคลน หิน และต้นไม้ที่ทับถมอยู่ที่เชิงเขาตรงที่เคยมีบ้าน"
    caption: "ฝนที่ซึมลงทำให้ดินบนลาดชันหนักขึ้นและยึดเกาะกันน้อยลงจนไถลลงมา (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - { type: check, problem: earthscience.hazards.natural-hazards.p005, prompt: "นึกถึงสิ่งที่เปลี่ยนไปในลำห้วยและบนภูเขา" }
  - type: figure
    title: หลุมยุบเกิดอย่างไร
    src: sinkhole.svg
    alt: "ภาพตัดพื้นดินสามขั้น ชั้นดินอยู่บนชั้นหินปูน มีเส้นประระดับน้ำใต้ดิน ขั้นที่ 1 น้ำฝนซึ่งเป็นกรดอ่อนซึมลงไปละลายหินปูนเกิดโพรงเล็ก ขั้นที่ 2 โพรงขยายใหญ่ ผิวดินด้านบนทรุดลงเล็กน้อย มีเครื่องสูบน้ำใต้ดินและลูกศรบอกว่าสูบน้ำใต้ดินมาก น้ำหายไปจากโพรง ขั้นที่ 3 เพดานโพรงถล่มลงกลายเป็นหลุมยุบลึก มีดินกองอยู่ก้นหลุม ป้ายว่าเกิดได้ทันที หลังฝนตกหนักหรือน้ำใต้ดินลดลง"
    caption: "หลุมยุบเกิดในพื้นที่หินปูน เมื่อโพรงใต้ดินใหญ่จนเพดานรับน้ำหนักไม่ไหว (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: worked-example
    title: ฝนตกบนพื้นที่หนึ่งได้น้ำเท่าใด
    problem: "ฝนตก 80 mm บนลุ่มน้ำเล็ก ๆ พื้นที่ 2 ตารางกิโลเมตร ถ้าน้ำฝน 40% ไหลบ่าลงลำห้วย (ที่เหลือซึมลงดินและระเหย) จะมีน้ำไหลลงลำห้วยกี่ลูกบาศก์เมตร"
    steps:
      - text: "แปลงหน่วย ฝน 80 mm = 0.08 m พื้นที่ 2 km² = 2,000,000 m²"
        why: "1 km² คือ 1,000 m × 1,000 m = 1,000,000 m² ต้องใช้หน่วยเมตรทั้งคู่จึงคูณกันได้เป็นลูกบาศก์เมตร"
      - text: "ปริมาตรน้ำฝนทั้งหมด $= 0.08 \\times 2{,}000{,}000 = 160{,}000\\ \\mathrm{m^3}$"
      - text: "น้ำไหลบ่า 40% $= 0.40 \\times 160{,}000 = 64{,}000\\ \\mathrm{m^3}$"
      - text: "ถ้าป่าบนลุ่มน้ำถูกตัดจนน้ำไหลบ่าเพิ่มเป็น 70% จะได้ $0.70 \\times 160{,}000 = 112{,}000\\ \\mathrm{m^3}$ ลำห้วยจึงล้นง่ายขึ้น"
    answer: "64,000 ลูกบาศก์เมตร"
  - type: worked-example
    title: เทียบทางแก้การกัดเซาะชายฝั่ง
    problem: "หมู่บ้านชายทะเลในจังหวัดสมุทรปราการถูกคลื่นกัดเซาะ ชายฝั่งถอยร่นทุกปี มีสองทางเลือก คือ สร้างกำแพงคอนกรีตกันคลื่น หรือปักแนวไม้ไผ่ชะลอคลื่นแล้วปลูกป่าชายเลนด้านหลัง ช่วยกันเลือกโดยใช้เกณฑ์"
    steps:
      - text: "ตั้งเกณฑ์ ลดการกัดเซาะได้มากเพียงใด ได้ผลเร็วหรือช้า ราคา ผลต่อสิ่งแวดล้อม ชาวบ้านดูแลเองได้หรือไม่"
      - text: "กำแพงคอนกรีต กันคลื่นได้ทันที แต่ราคาแพง ไม่มีตะกอนสะสม และคลื่นที่สะท้อนอาจกัดเซาะหาดข้าง ๆ มากขึ้น"
      - text: "แนวไม้ไผ่และป่าชายเลน ราคาถูก ชาวบ้านทำเองได้ คลื่นช้าลงจนตะกอนตกสะสม ป่าชายเลนเป็นที่อยู่ของสัตว์น้ำ แต่ใช้เวลาหลายปี"
        why: "คลื่นที่ช้าลงพาตะกอนต่อไปไม่ได้ ตะกอนจึงตกทับถม ทำให้ดินงอกออกไปทางทะเล"
      - text: "สรุป ถ้าไม่มีบ้านที่จะพังในเร็ววัน แนวไม้ไผ่กับป่าชายเลนคุ้มกว่าในระยะยาว อาจใช้วิธีแข็งเฉพาะจุดที่อันตรายเร่งด่วน"
    answer: "แนวไม้ไผ่ร่วมกับป่าชายเลนเหมาะกว่าในระยะยาว เพราะถูก ช่วยให้ตะกอนสะสม และไม่ย้ายปัญหาไปที่อื่น"
  - { type: check, problem: earthscience.hazards.natural-hazards.p013 }
glossary:
  - { term: ภัยธรรมชาติ, definition: "เหตุการณ์ทางธรรมชาติที่ทำอันตรายต่อชีวิตและทรัพย์สิน เช่น น้ำท่วม ภัยแล้ง พายุ" }
  - { term: ธรณีพิบัติภัย, definition: "ภัยที่เกิดจากการเปลี่ยนแปลงของเปลือกโลกและผิวโลก เช่น ดินถล่ม หลุมยุบ แผ่นดินไหว สึนามิ" }
  - { term: น้ำป่าไหลหลาก, definition: "น้ำที่ไหลลงจากภูเขาอย่างแรงและรวดเร็วหลังฝนตกหนัก มักพาโคลนและท่อนไม้มาด้วย" }
  - { term: ดินถล่ม, definition: "การที่ดิน หิน และต้นไม้บนลาดเขาไถลลงมาอย่างรวดเร็ว มักเกิดเมื่อดินอิ่มน้ำ" }
  - { term: การกัดเซาะชายฝั่ง, definition: "การที่คลื่นและกระแสน้ำพาทรายและดินออกไปจนแนวชายฝั่งถอยร่นเข้ามาในแผ่นดิน" }
  - { term: หลุมยุบ, definition: "หลุมที่เกิดเมื่อเพดานของโพรงใต้ดินในหินปูนถล่มลง" }
  - { term: แผ่นดินทรุด, definition: "การที่ผิวดินค่อย ๆ ลดระดับลง เช่น จากการสูบน้ำบาดาลมากเกินไป" }
  - { term: น้ำไหลบ่า, definition: "น้ำฝนส่วนที่ไม่ซึมลงดินและไหลไปตามผิวดินลงสู่ทางน้ำ" }
  - { term: แก้มลิง, definition: "พื้นที่รับน้ำหลากไว้ชั่วคราวเพื่อลดน้ำท่วม แล้วค่อยระบายหรือเก็บไว้ใช้" }
flashcards:
  - { front: "สัญญาณเตือนน้ำป่าและดินถล่ม", back: "ฝนตกหนักต่อเนื่อง น้ำในลำห้วยขุ่นเป็นสีดินหรือเพิ่มเร็ว เสียงดังผิดปกติจากภูเขา ต้นไม้หรือเสาเอียง ให้อพยพขึ้นที่สูงทันที" }
  - { front: "ทำไมดินถล่มเมื่อฝนตกหนัก", back: "น้ำซึมลงจนดินอิ่มน้ำ ดินหนักขึ้นและยึดเกาะกันน้อยลง จึงไถลลงตามลาดชัน" }
  - { front: "หลุมยุบเกิดอย่างไร", back: "น้ำใต้ดินละลายหินปูนเป็นโพรง โพรงขยายจนเพดานรับน้ำหนักไม่ไหวจึงถล่ม" }
  - { front: "ห้ามทำอะไรเมื่อน้ำท่วม", back: "ห้ามเดินหรือขับรถผ่านน้ำไหลแรง ห้ามแตะสวิตช์ไฟขณะตัวเปียก ตัดไฟก่อนน้ำเข้าบ้าน" }
  - { front: "สายด่วนเมื่อเกิดภัย", back: "1784 กรมป้องกันและบรรเทาสาธารณภัย 1182 กรมอุตุนิยมวิทยา 1669 เจ็บป่วยฉุกเฉิน" }
