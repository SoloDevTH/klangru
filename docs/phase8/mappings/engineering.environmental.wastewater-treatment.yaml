topic: engineering.environmental.wastewater-treatment
rows:
  - { framework: th-coe-engineering-basics, indicators: ["ENV-3.3"], coverage: partial, note: "ครอบคลุมลักษณะน้ำเสีย การบำบัดขั้นต้น ระบบแอกทิเวเต็ดสลัดจ์ บ่อผึ่ง ระบบไร้อากาศ และสลัดจ์ในระดับแนวคิดและการคำนวณเบื้องต้น ยังไม่ครอบคลุมการออกแบบถังตกตะกอนขั้นที่สองและการควบคุมระบบจริง" }
  - { framework: th-coe-engineering-basics, indicators: ["ENV-3.7"], coverage: partial, note: "ครอบคลุมจลนพลศาสตร์โมนอด F/M อายุสลัดจ์ และความต้องการออกซิเจนของระบบตะกอนแขวนลอย ยังไม่ครอบคลุมระบบยึดติดฟิล์ม" }
  - { framework: th-coe-engineering-basics, indicators: ["CHE-3.12"], coverage: partial, note: "ครอบคลุมหลักการบำบัดของเสียและการเลือกระบบที่ผลน้ำทิ้งต่ำกว่าเกณฑ์ในเชิงแนวคิด ไม่ครอบคลุมการกำจัดสลัดจ์ขั้นสุดท้ายและการปล่อยก๊าซเรือนกระจกสุทธิเป็นศูนย์" }
  - { framework: th-coe-engineering-basics, indicators: ["ENV-3.2"], coverage: partial, note: "ENV-3.2 คือหน่วยปฏิบัติการ (unit operations and processes) ไม่ใช่งานห้องทดลอง บทนี้แนะนำตะแกรง ถังดักกรวด ถังตกตะกอน และการเติมอากาศในเชิงหน้าที่ และคำนวณเวลากักเก็บ ไม่ออกแบบหน่วยทางกายภาพในรายละเอียด หน่วยหลักของ ENV-3.2 สอนในหัวข้อ water-treatment" }
