<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="sans-serif">
<title>คำตั้ง ขัน 4 คำในพจนานุกรมจำลอง</title>
<rect x="0" y="0" width="760" height="300" fill="#fff"/>
<rect x="20.0" y="20.0" width="720.0" height="260.0" rx="0" fill="#fffdf6" stroke="#8a7a50" stroke-width="2"/>
<text x="50" y="80" font-size="23" text-anchor="start"><tspan fill="#111" font-weight="bold">ขัน ๑ </tspan><tspan fill="#c0392b" font-weight="bold">น. </tspan><tspan fill="#222" font-weight="normal">ภาชนะสำหรับตักหรือใส่น้ำ เช่น ใช้ขันตักน้ำ</tspan></text>
<text x="50" y="136" font-size="23" text-anchor="start"><tspan fill="#111" font-weight="bold">ขัน ๒ </tspan><tspan fill="#c0392b" font-weight="bold">ก. </tspan><tspan fill="#222" font-weight="normal">ร้องอย่างไก่ตัวผู้ เช่น ไก่ขันตอนเช้ามืด</tspan></text>
<text x="50" y="192" font-size="23" text-anchor="start"><tspan fill="#111" font-weight="bold">ขัน ๓ </tspan><tspan fill="#c0392b" font-weight="bold">ก. </tspan><tspan fill="#222" font-weight="normal">หมุนให้แน่น เช่น ขันน็อต ขันฝาขวด</tspan></text>
<text x="50" y="248" font-size="23" text-anchor="start"><tspan fill="#111" font-weight="bold">ขัน ๔ </tspan><tspan fill="#c0392b" font-weight="bold">ว. </tspan><tspan fill="#222" font-weight="normal">น่าหัวเราะ เช่น เรื่องนี้ขันดี</tspan></text>
<text x="380.0" y="298.0" font-size="13" text-anchor="middle" fill="#777" font-weight="normal">ความหมายเขียนใหม่โดยคลังรู้</text>
</svg>
