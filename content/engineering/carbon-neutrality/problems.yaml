      - match: 300000
        feedback: คิดราคาจากการปล่อยฐานทั้งหมดโดยไม่หักส่วนที่ลดที่แหล่งกำเนิดแล้ว
      - match: 120
        feedback: ได้ปริมาณที่เหลือแต่ยังไม่ได้คูณด้วยราคาคาร์บอนเครดิต
    solution: ส่วนที่เหลือ = 1,200 × 10% = 120 tCO₂e ค่าชดเชย = 120 × 250 = 30,000 บาทต่อปี ราคาคาร์บอนเครดิตจริงผันผวนตามตลาดและคุณภาพ จึงต้องใช้ตัวเลขปัจจุบันในการประเมินจริง
