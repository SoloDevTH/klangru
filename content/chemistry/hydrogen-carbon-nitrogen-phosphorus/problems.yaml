problems:
  - id: chemistry.descriptive.hydrogen-carbon-nitrogen-phosphorus.p001
    topics: [chemistry.descriptive.hydrogen-carbon-nitrogen-phosphorus]
    difficulty: 1
    type: mcq
    stem: 'อัญรูปของคาร์บอนชนิดใดนำไฟฟ้าได้ดี'
    choices:
      - { id: a, text: 'เพชร', feedback: 'เพชรมีโครงสร้างตาข่ายสามมิติที่อิเล็กตรอนอยู่กับที่ จึงเป็นฉนวนไฟฟ้า' }
      - { id: b, text: 'แกรไฟต์', correct: true, feedback: 'ถูก แกรไฟต์มีอิเล็กตรอนที่เคลื่อนที่ได้ตามชั้นของแผ่นคาร์บอนหกเหลี่ยม' }
      - { id: c, text: 'ฟูลเลอรีน C₆₀', feedback: 'ฟูลเลอรีนเป็นโมเลกุลทรงกลม นำไฟฟ้าได้น้อยกว่าแกรไฟต์มาก' }
      - { id: d, text: 'ถ่านที่ไม่มีรูพรุน', feedback: 'คำตอบนี้ไม่ใช่อัญรูปที่แยกชัด และถ่านทั่วไปประกอบด้วยแกรไฟต์เล็ก ๆ จำนวนมาก' }
    hints:
      - 'นึกถึงอัญรูปที่ใช้ทำไส้ดินสอ ซึ่งเขียนได้เพราะมีชั้นที่ลื่น'
      - 'ดูว่าอัญรูปใดมีอิเล็กตรอนที่เคลื่อนที่ได้ระหว่างชั้น'
    solution: 'แกรไฟต์มีอิเล็กตรอนที่ไม่อยู่กับที่ในแต่ละชั้นของคาร์บอนหกเหลี่ยม จึงนำไฟฟ้าได้ดีตามระนาบ'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.hydrogen-carbon-nitrogen-phosphorus.p002
    topics: [chemistry.descriptive.hydrogen-carbon-nitrogen-phosphorus]
    difficulty: 1
    type: mcq
    stem: 'เศษสังกะสี (Zn) ใส่ในกรดเกลือเจือจาง เกิดแก๊สชนิดใดขึ้น'
    choices:
      - { id: a, text: 'ออกซิเจน', feedback: 'ออกซิเจนไม่ได้เกิดจากการสลายของโลหะกับกรดเจือจาง' }
      - { id: b, text: 'ไฮโดรเจน', correct: true, feedback: 'ถูก Zn + 2HCl → ZnCl₂ + H₂ แก๊สนี้ติดไฟได้ จึงห้ามจุดไฟใกล้ภาชนะ' }
      - { id: c, text: 'คาร์บอนไดออกไซด์', feedback: 'ไม่มีคาร์บอนในสารตั้งต้นเหล่านี้' }
      - { id: d, text: 'ไนโตรเจน', feedback: 'ไม่มีไนโตรเจนในสารตั้งต้นเหล่านี้' }
    hints:
      - 'ดูว่าธาตุใดในกรดเกลือ (HCl) ถูกปล่อยออกมาเมื่อโลหะเข้ามาแทนที่'
      - 'แก๊สนี้เบาที่สุดและติดไฟได้'
    solution: 'สังกะสีแทนที่ H⁺ ในกรดเกลือ ได้แก๊สไฮโดรเจน แก๊สนี้ติดไฟได้ จึงต้องไม่จุดไฟหรือทำให้เกิดประกายใกล้ภาชนะ'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.hydrogen-carbon-nitrogen-phosphorus.p003
    topics: [chemistry.descriptive.hydrogen-carbon-nitrogen-phosphorus]
    difficulty: 2
    type: numeric
    stem: 'เผาหินปูน $\mathrm{CaCO_3}$ 50.0 g ให้สลายตัวเป็น $\mathrm{CaO}$ และ $\mathrm{CO_2}$ ได้ $\mathrm{CO_2}$ กี่กรัม กำหนด $M(\mathrm{CaCO_3}) = 100.09$ และ $M(\mathrm{CO_2}) = 44.01$ g/mol (ตอบเป็นกรัม)'
    answer: { value: 21.99, tolerance: 0.05, unit: g }
    hints:
      - 'หาจำนวนโมลของ $\mathrm{CaCO_3}$ จากมวลและมวลโมลาร์'
      - 'สมการ $\mathrm{CaCO_3 \rightarrow CaO + CO_2}$ ให้ $\mathrm{CO_2}$ 1 โมลต่อ $\mathrm{CaCO_3}$ 1 โมล'
    misconceptions:
      - { match: 54.9, feedback: 'ใช้มวลอะตอมของ Ca (40.08) เป็นมวลโมลาร์ของ CaCO₃ ทั้งที่ต้องรวม C และ O ทั้งสามด้วย (100.09 g/mol)' }
    solution: '$n(\mathrm{CaCO_3}) = 50.0 \div 100.09 = 0.4995$ mol ได้ $n(\mathrm{CO_2}) = 0.4995$ mol มวล $= 0.4995 \times 44.01 = 21.99$ g'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.hydrogen-carbon-nitrogen-phosphorus.p004
    topics: [chemistry.descriptive.hydrogen-carbon-nitrogen-phosphorus]
    difficulty: 2
    type: numeric
    stem: 'กระบวนการฮาเบอร์ใช้ไนโตรเจน 250 g ทำปฏิกิริยากับไฮโดรเจนเกินพอตามสมการ $\mathrm{N_2 + 3H_2 \rightarrow 2NH_3}$ ถ้าได้ผลผลิตสูงสุด จะได้แอมโมเนียกี่กรัม กำหนด $M(\mathrm{N_2}) = 28.01$ และ $M(\mathrm{NH_3}) = 17.03$ g/mol (ตอบเป็นกรัม)'
    answer: { value: 304.0, tolerance: 0.5, unit: g }
    hints:
      - 'หาจำนวนโมลของ $\mathrm{N_2}$ จากมวลและมวลโมลาร์ก่อน'
      - 'ตามสมการ $\mathrm{N_2}$ 1 โมลให้ $\mathrm{NH_3}$ 2 โมล'
    misconceptions:
      - { match: 152.0, feedback: 'ใช้อัตราส่วน $\mathrm{N_2}$ : $\mathrm{NH_3}$ เป็น 1 : 1 ทั้งที่สมการให้ 1 : 2' }
    solution: '$n(\mathrm{N_2}) = 250 \div 28.01 = 8.925$ mol ได้ $n(\mathrm{NH_3}) = 2 \times 8.925 = 17.85$ mol มวล $= 17.85 \times 17.03 = 304.0$ g'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.hydrogen-carbon-nitrogen-phosphorus.p005
    topics: [chemistry.descriptive.hydrogen-carbon-nitrogen-phosphorus]
    difficulty: 2
    type: match
    stem: 'จับคู่สารหรืออัญรูปกับการใช้งานหรือสมบัติที่เหมาะสม'
    pairs:
      - { left: 'ยูเรีย $\mathrm{(NH_2)_2CO}$', right: 'ปุ๋ยไนโตรเจนที่มีไนโตรเจนประมาณ 46%' }
      - { left: 'แกรไฟต์', right: 'ไส้ดินสอและวัสดุนำไฟฟ้า' }
      - { left: 'ฟอสฟอรัสขาว', right: 'ต้องเก็บในน้ำเพราะติดไฟได้เองในอากาศ' }
      - { left: 'ไฮโดรเจน', right: 'เชื้อเพลิงสะอาดเมื่อเผาไหม้ได้น้ำ' }
    hints:
      - 'ดูว่าสารใดมีไนโตรเจนสูงและใช้เป็นปุ๋ย'
      - 'ฟอสฟอรัสขาวไวต่อออกซิเจนมาก'
    solution: 'ยูเรียเป็นปุ๋ยไนโตรเจนสูง แกรไฟต์ใช้ไส้ดินสอ ฟอสฟอรัสขาวต้องเก็บในน้ำ และไฮโดรเจนเผาไหม้ให้น้ำเป็นผลิตภัณฑ์'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.hydrogen-carbon-nitrogen-phosphorus.p006
    topics: [chemistry.descriptive.hydrogen-carbon-nitrogen-phosphorus]
    difficulty: 2
    type: mcq
    stem: 'ฟอสฟอรัสขาวต่างจากฟอสฟอรัสแดงอย่างไร'
    choices:
      - { id: a, text: 'ฟอสฟอรัสขาวว่องไวและติดไฟได้เองในอากาศ จึงต้องเก็บในน้ำ ส่วนฟอสฟอรัสแดงเสถียรกว่ามาก', correct: true, feedback: 'ถูก ฟอสฟอรัสแดงใช้ทำแถบด้านข้างของกล่องไม้ขีดได้เพราะไม่ติดไฟเองง่าย' }
      - { id: b, text: 'ฟอสฟอรัสขาวเป็นโลหะ ส่วนฟอสฟอรัสแดงเป็นอโลหะ', feedback: 'ทั้งสองเป็นอัญรูปของอโลหะฟอสฟอรัส ไม่ใช่โลหะคนละชนิด' }
      - { id: c, text: 'ฟอสฟอรัสแดงมีพิษมากกว่าฟอสฟอรัสขาว', feedback: 'ฟอสฟอรัสขาวมีพิษสูงกว่าฟอสฟอรัสแดงมาก' }
      - { id: d, text: 'ทั้งสองละลายในน้ำได้ดี', feedback: 'ฟอสฟอรัสทั้งสองรูปไม่ละลายน้ำ' }
    hints:
      - 'ดูว่าอัญรูปใดว่องไวต่อออกซิเจนมากกว่า'
      - 'ถ้าเก็บฟอสฟอรัสขาวในอากาศโดยตรงจะเกิดอะไร'
    solution: 'ฟอสฟอรัสขาวประกอบด้วยโมเลกุล P₄ ที่มีความเครียดสูงจึงว่องไวมาก ฟอสฟอรัสแดงเป็นโครงข่ายใหญ่กว่าจึงเสถียรกว่าและปลอดภัยกว่า'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.hydrogen-carbon-nitrogen-phosphorus.p007
    topics: [chemistry.descriptive.hydrogen-carbon-nitrogen-phosphorus]
    difficulty: 2
    type: text
    stem: 'เขียนสูตรเคมีของเบกกิ้งโซดา (โซดาทำขนม) ซึ่งเป็นส่วนประกอบหลักของผงฟูที่ใช้ทำขนมให้ฟู (พิมพ์ตัวเลขห้อยเป็นตัวเลขปกติ เช่น CO2)'
    accepted: ['NaHCO3', 'NaHCO₃']
    misconceptions:
      - { match: 'Na2CO3', feedback: 'Na₂CO₃ คือโซดาแอช ไม่ใช่เบกกิ้งโซดา เบกกิ้งโซดาคือไฮโดรเจนคาร์บอเนต (NaHCO₃)' }
    hints:
      - 'สารนี้เป็นเกลือไฮโดรเจนคาร์บอเนตของโซเดียม'
      - 'มีไฮโดรเจน 1 อะตอมและคาร์บอน 1 อะตอม'
    solution: 'เบกกิ้งโซดาคือโซเดียมไฮโดรเจนคาร์บอเนต $\mathrm{NaHCO_3}$ เมื่อถูกความร้อนจะสลายให้แก๊ส $\mathrm{CO_2}$ ทำให้ขนมขึ้นฟู'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.hydrogen-carbon-nitrogen-phosphorus.p008
    topics: [chemistry.descriptive.hydrogen-carbon-nitrogen-phosphorus]
    difficulty: 3
    type: numeric
    stem: 'ให้ความร้อนแก่ $\mathrm{NaHCO_3}$ 25.0 g จนสลายหมดตามสมการ $\mathrm{2NaHCO_3 \rightarrow Na_2CO_3 + H_2O + CO_2}$ ที่ 25 °C และ 1 atm จะได้ $\mathrm{CO_2}$ กี่ลิตร กำหนด $M(\mathrm{NaHCO_3}) = 84.01$ g/mol และ $R = 0.08206$ L·atm/(mol·K) (ตอบเป็นลิตร)'
    answer: { value: 3.64, tolerance: 0.01, unit: L }
    hints:
      - 'หาจำนวนโมลของ $\mathrm{NaHCO_3}$ ก่อนจากมวลและมวลโมลาร์'
      - 'อัตราส่วน $\mathrm{NaHCO_3}$ : $\mathrm{CO_2}$ ในสมการเป็น 2 : 1 และใช้ $V = nRT/P$ โดยเปลี่ยน 25 °C เป็น 298.15 K'
    misconceptions:
      - { match: 7.28, feedback: 'ลืมอัตราส่วน 2 : 1 ระหว่าง NaHCO₃ กับ CO₂ จึงได้จำนวนโมล CO₂ มากเป็นสองเท่า' }
    solution: '$n(\mathrm{NaHCO_3}) = 25.0 \div 84.01 = 0.2976$ mol $n(\mathrm{CO_2}) = 0.2976 \div 2 = 0.1488$ mol $V = 0.1488 \times 0.08206 \times 298.15 / 1.00 = 3.64$ L'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.hydrogen-carbon-nitrogen-phosphorus.p009
    topics: [chemistry.descriptive.hydrogen-carbon-nitrogen-phosphorus]
    difficulty: 3
    type: numeric
    stem: 'ผลิตไฮโดรเจนจากการรีฟอร์มมิงมีเทนด้วยไอน้ำตามสมการ $\mathrm{CH_4(g) + H_2O(g) \rightarrow CO(g) + 3H_2(g)}$ จาก $\Delta H^\circ_f$: $\mathrm{CH_4}$ = −74.8, $\mathrm{H_2O(g)}$ = −241.8, $\mathrm{CO}$ = −110.5 kJ/mol จงหา $\Delta H^\circ_{rxn}$ (ตอบเป็น kJ/mol)'
    answer: { value: 206.1, tolerance: 0.2, unit: kJ/mol }
    hints:
      - 'ใช้สูตร ผลิตภัณฑ์ลบด้วยสารตั้งต้น ทุกสารมีสัมประสิทธิ์ 1'
      - 'ค่า $\Delta H^\circ_f$ ของ $\mathrm{H_2}$ เป็นศูนย์ จึงไม่ต้องนำมาคำนวณ'
    misconceptions:
      - { match: -206.1, feedback: 'เครื่องหมายผิด ปฏิกิริยานี้ต้องดูดความร้อน จึง ΔH เป็นบวก' }
    solution: '$\Delta H^\circ_{rxn} = [-110.5 + 3(0)] - [-74.8 + (-241.8)] = -110.5 + 316.6 = +206.1$ kJ/mol ปฏิกิริยาดูดความร้อน จึงต้องให้ความร้อนแก่เตาอย่างต่อเนื่อง'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.hydrogen-carbon-nitrogen-phosphorus.p010
    topics: [chemistry.descriptive.hydrogen-carbon-nitrogen-phosphorus]
    difficulty: 3
    type: mcq
    stem: 'ในกระบวนการฮาเบอร์ สภาวะใดเหมาะที่สุดในการเพิ่มผลผลิตแอมโมเนียเมื่อพิจารณาหลักเลอชาเตอลีเย (ปฏิกิริยาคายความร้อน และจำนวนโมลแก๊สลดลง)'
    choices:
      - { id: a, text: 'ความดันสูงและอุณหภูมิไม่สูงเกินไป โดยใช้ตัวเร่งเหล็กช่วยให้ถึงสมดุลเร็วขึ้น', correct: true, feedback: 'ถูก ความดันสูงเลื่อนสมดุลไปทางจำนวนโมลแก๊สที่น้อยกว่า ส่วนอุณหภูมิสูงเกินไปทำให้ผลผลิตลดลง' }
      - { id: b, text: 'ความดันต่ำและอุณหภูมิสูงที่สุด', feedback: 'ความดันต่ำและอุณหภูมิสูงลดผลผลิต NH₃ ตามหลักเลอชาเตอลีเย' }
      - { id: c, text: 'ความดันต่ำและอุณหภูมิต่ำที่สุด', feedback: 'อุณหภูมิต่ำมากทำให้ปฏิกิริยาช้ามากจนไม่คุ้มค่า' }
      - { id: d, text: 'ไม่ต้องควบคุมความดันหรืออุณหภูมิ เพราะปฏิกิริยาเกิดเองได้เร็ว', feedback: 'ปฏิกิริยาช้ามากโดยไม่มีตัวเร่งและสภาวะที่เหมาะสม' }
    hints:
      - 'ดูว่าปฏิกิริยาเปลี่ยนจำนวนโมลแก๊สจากกี่โมลเป็นกี่โมล'
      - 'ปฏิกิริยาคายความร้อน ความร้อนสูงเกินไปจึงเลื่อนสมดุลไปทางสารตั้งต้น'
    solution: 'ปฏิกิริยา $\mathrm{N_2 + 3H_2 \rightarrow 2NH_3}$ จำนวนโมลแก๊สลดลงจาก 4 เป็น 2 ความดันสูงจึงเพิ่มผลผลิต อุณหภูมิที่สูงมากลดผลผลิต ใช้ตัวเร่งเหล็กเพื่อให้ถึงสมดุลเร็ว'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.hydrogen-carbon-nitrogen-phosphorus.p011
    topics: [chemistry.descriptive.hydrogen-carbon-nitrogen-phosphorus]
    difficulty: 3
    type: numeric
    stem: 'ปุ๋ยยูเรีย $\mathrm{(NH_2)_2CO}$ มีร้อยละโดยมวลของไนโตรเจนเท่าใด กำหนด $M(\mathrm{N}) = 14.01$, $M(\mathrm{C}) = 12.01$, $M(\mathrm{O}) = 16.00$, $M(\mathrm{H}) = 1.008$ g/mol (ตอบเป็น % ทศนิยม 1 ตำแหน่ง)'
    answer: { value: 46.7, tolerance: 0.1, unit: '%' }
    hints:
      - 'คำนวณมวลโมลาร์ของ $\mathrm{(NH_2)_2CO}$ ก่อน'
      - 'ในหนึ่งสูตรมีไนโตรเจนกี่อะตอม'
    misconceptions:
      - { match: 23.3, feedback: 'นับไนโตรเจนเพียงหนึ่งอะตอม ทั้งที่ยูเรียมี N 2 อะตอมในหนึ่งสูตร' }
    solution: '$M = 12.01 + 16.00 + 2(14.01) + 4(1.008) = 60.06$ g/mol มวล N $= 2 \times 14.01 = 28.02$ g ร้อยละ $= 28.02 / 60.06 \times 100 = 46.7\%$'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.hydrogen-carbon-nitrogen-phosphorus.p012
    topics: [chemistry.descriptive.hydrogen-carbon-nitrogen-phosphorus]
    difficulty: 3
    type: numeric
    stem: 'ปุ๋ยแอมโมเนียมไนเทรต $\mathrm{NH_4NO_3}$ มีร้อยละโดยมวลของไนโตรเจนทั้งหมดเท่าใด กำหนด $M(\mathrm{N}) = 14.01$, $M(\mathrm{H}) = 1.008$, $M(\mathrm{O}) = 16.00$ g/mol (ตอบเป็น % ทศนิยม 1 ตำแหน่ง)'
    answer: { value: 35.0, tolerance: 0.1, unit: '%' }
    hints:
      - 'ในสูตรมีไนโตรเจนสองตำแหน่ง คือ NH₄⁺ และ NO₃⁻'
      - 'ไนโตรเจนรวมทั้งหมดคือผลรวมของสองตำแหน่งนี้'
