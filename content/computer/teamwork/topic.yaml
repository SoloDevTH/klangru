id: computer.programming.teamwork
subject: computer
title: { th: การพัฒนาซอฟต์แวร์เป็นทีมและเครื่องมือทำงานร่วมกัน, en: "Team software development and collaboration tools" }
summary: บทบาทในทีม การแบ่งงาน แผนภูมิแกนต์ บอร์ดงานและความเสี่ยง การสื่อสารและแก้ความขัดแย้ง การเขียนโปรแกรมเป็นคู่ Git การตรวจโค้ด เอกสาร และการระดมความเห็นจากคนจำนวนมาก
difficulty: 4.5
minutes: 45
prerequisites: [computer.programming.development-process]
encompasses:
  - { id: computer.programming.development-process, weight: 0.3 }
  - { id: computer.programming.design-debug, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: gantt.svg
    alt: "แผนภูมิแกนต์ 10 วัน แถวเก็บความต้องการ (ฟ้า) วันที่ 1 หนึ่งวัน แถวออกแบบด่าน (ต้น) วันที่ 2 ถึง 3 สองวัน แถวเขียนโค้ด (ต้นและมด) วันที่ 4 ถึง 8 ห้าวัน แถวทำเสียงและภาพ (ปลื้ม) วันที่ 4 ถึง 5 สองวัน ทำพร้อมกับเขียนโค้ด แถวทดสอบกับผู้ใช้ (ฟ้า) วันที่ 9 ถึง 10 สองวัน ลูกศรแสดงว่าออกแบบรอเก็บความต้องการ เขียนโค้ดและทำเสียงรอออกแบบ และทดสอบรอทั้งเขียนโค้ดและทำเสียง ใต้ภาพเขียนว่าโครงงานใช้ 1 + 2 + 5 + 2 = 10 วัน ไม่ใช่ 12 วัน"
    caption: "แผนภูมิแกนต์แสดงลำดับงาน ผู้รับผิดชอบ และงานที่ทำพร้อมกันได้"
  - type: figure
    src: kanban.svg
    alt: "บอร์ดงานสามช่อง ช่องต้องทำมีการ์ด หน้าจอสรุปคะแนน และ เสียงตอนตอบถูก ช่องกำลังทำมีการ์ด ตัวนับคะแนน (ต้น) และ ด่านที่ 3 (มด) ช่องเสร็จมีการ์ด หน้าแรก (ฟ้า) และ ปุ่มเริ่มเกม (ปลื้ม) มีลูกศรจากช่องต้องทำไปกำลังทำ และจากกำลังทำไปเสร็จ"
    caption: "บอร์ดงานทำให้ทุกคนเห็นว่าใครทำอะไรอยู่"
  - type: worked-example
    title: วางแผนโครงงานเกมของทีมสี่คน
    problem: "ทีมสี่คน (ฟ้า ต้น มด ปลื้ม) มีเวลา 2 สัปดาห์ทำเกมทายคำศัพท์ ให้แบ่งงาน วางกำหนดเวลา และเตรียมรับมือความเสี่ยง"
    steps:
      - text: "แตกงานเป็นชิ้นที่เสร็จได้ใน 1–2 วัน เช่น เก็บความต้องการ ออกแบบด่าน เขียนตัวนับคะแนน เขียนด่าน ทำเสียง ทดสอบ แล้วเขียนเป็นการ์ดในช่องต้องทำ"
        why: "งานชิ้นเล็กประมาณเวลาได้แม่นกว่า และเห็นความคืบหน้าทุกวัน"
      - text: "ระบุว่างานใดต้องรองานใด แล้ววางในแผนภูมิแกนต์ งานที่ไม่ต้องรอกัน เช่น เขียนโค้ดกับทำเสียง ให้คนละคนทำพร้อมกัน"
      - text: "หาเส้นทางที่ยาวที่สุดของงานที่ต้องรอกัน: 1 + 2 + 5 + 2 = 10 วัน เหลือเวลาสำรองจาก 2 สัปดาห์ (ทำงาน 10 วันทำการ) เป็น 0 วัน จึงต้องลดขอบเขตหรือเริ่มทดสอบบางส่วนเร็วขึ้น"
        why: "ถ้างานบนเส้นทางที่ยาวที่สุดล่าช้า ทั้งโครงงานล่าช้า แผนที่ไม่มีเวลาสำรองเสี่ยงมาก"
      - text: "ให้คะแนนความเสี่ยง: งานเสร็จไม่ทัน (โอกาส 4 × ผล 4 = 16) สูงสุด รับมือโดยตัดเสียงประกอบเป็นงานที่ทำถ้ามีเวลา ไฟล์หาย (2 × 5 = 10) รับมือด้วย Git และคลังกลาง"
      - text: "ตกลงกติกา: คุยสั้น ๆ ทุกเช้า 5 นาที ย้ายการ์ดเมื่อสถานะเปลี่ยน ทุกงานต้องผ่านการตรวจโค้ดจากอีกหนึ่งคน และสลับบทบาทผู้ทดสอบทุกสัปดาห์"
    answer: "ได้รายการงานบนบอร์ด แผนภูมิแกนต์ 10 วันที่ให้งานคู่ขนานทำพร้อมกัน แผนรับมือความเสี่ยงที่คะแนนสูงสุด และกติกาการทำงานของทีม"
  - { type: check, problem: computer.programming.teamwork.p006, prompt: "หาเวลาที่สั้นที่สุดเมื่องานบางชิ้นทำพร้อมกันได้" }
  - type: figure
    src: git-branches.svg
    alt: "เส้นสีน้ำเงินคือกิ่งหลัก main มีคอมมิต เริ่มเกม เพิ่มหน้าแรก แก้ข้อความบนจอ และ รวม add-score เส้นสีส้มคือกิ่ง add-score ของต้น แตกออกจากคอมมิต เพิ่มหน้าแรก มีคอมมิต เพิ่มตัวนับคะแนน และ แสดงคะแนนบนจอ แล้วโค้งกลับไปรวมที่คอมมิต รวม add-score บนกิ่งหลัก กล่องด้านล่างเขียนว่าคำขอรวม เพื่อนตรวจโค้ดก่อนรวม"
    caption: "ทำงานบนกิ่งของตัวเอง แล้วรวมเข้ากิ่งหลักหลังผ่านการตรวจ"
  - type: worked-example
    title: ตรวจโค้ดในคำขอรวม
    problem: |
      มดเปิดคำขอรวมฟังก์ชันนี้ ข้อกำหนดคือ ตอบถูกได้ 10 คะแนน ตอบผิดเสีย 5 คะแนน แต่คะแนนต้องไม่ติดลบ ให้ตรวจโค้ดแล้วเขียนความเห็น

      ```python
      def update(p, ok):
          if ok:
              p = p + 10
          else:
              p = p - 5
          return p
      ```
    steps:
      - text: "ตรวจความถูกต้องก่อน: ลองกรณีขอบ update(3, False) ได้ 3 − 5 = −2 ติดลบ ผิดข้อกำหนด"
        why: "บั๊กที่ทำให้ผลผิดสำคัญที่สุด ต้องหาให้เจอก่อนเรื่องรูปแบบ"
      - text: "ตรวจความอ่านง่าย: ชื่อ p และ ok ไม่สื่อความหมาย ไม่มี docstring"
      - text: "ตรวจกรณีทดสอบ: ยังไม่มีกรณีทดสอบเลย ควรมีอย่างน้อย ตอบถูก ตอบผิด และตอบผิดตอนคะแนนน้อยกว่า 5"
      - text: "เขียนความเห็นที่เจาะจงและสุภาพ: \"ถ้าคะแนน 3 แล้วตอบผิดจะได้ −2 ใช้ max(0, points - 5) ไหม และช่วยเปลี่ยนชื่อเป็น points, correct พร้อมเพิ่มกรณีทดสอบ update(3, False) == 0\""
        why: "ความเห็นที่บอกปัญหา ตัวอย่าง และทางแก้ ช่วยให้แก้ได้ทันทีและไม่ทำให้อีกฝ่ายรู้สึกถูกโจมตี"
      - text: "มดแก้แล้วคอมมิตใหม่ในกิ่งเดิม คำขอรวมอัปเดตตาม ตรวจซ้ำแล้วจึงรวมเข้ากิ่งหลัก"
    answer: "พบบั๊กคะแนนติดลบ (update(3, False) ได้ −2) ขอให้ใช้ max(0, points − 5) เปลี่ยนชื่อตัวแปร เพิ่ม docstring และกรณีทดสอบ แล้วจึงรวม"
  - { type: check, problem: computer.programming.teamwork.p011, prompt: "ความเห็นใดในการตรวจโค้ดสำคัญที่สุด" }
glossary:
  - { term: แผนภูมิแกนต์ (Gantt chart), definition: "แผนภูมิแท่งแนวนอนแสดงงาน ระยะเวลา ลำดับ และงานที่ทำพร้อมกันได้" }
  - { term: บอร์ดงาน (task board), definition: "บอร์ดที่แบ่งงานเป็นช่อง เช่น ต้องทำ กำลังทำ เสร็จ ให้ทีมเห็นสถานะของทุกงาน" }
  - { term: การเขียนโปรแกรมเป็นคู่ (pair programming), definition: "สองคนทำงานบนเครื่องเดียว คนขับพิมพ์ ผู้นำทางดูภาพรวมและจับข้อผิดพลาด แล้วสลับกัน" }
  - { term: ระบบควบคุมเวอร์ชัน (version control), definition: "ระบบที่เก็บประวัติการเปลี่ยนแปลงของไฟล์ เช่น Git ย้อนดูและรวมงานของหลายคนได้" }
  - { term: คอมมิต (commit), definition: "การบันทึกภาพของไฟล์ ณ เวลาหนึ่งพร้อมข้อความบอกว่าเปลี่ยนอะไร" }
  - { term: กิ่ง (branch), definition: "สายการพัฒนาแยกจากกิ่งหลัก ทำงานได้โดยไม่กระทบงานของคนอื่น" }
  - { term: คำขอรวม (pull request), definition: "คำขอให้รวมกิ่งเข้ากิ่งหลัก เปิดให้ทีมตรวจโค้ดและแสดงความเห็นก่อน" }
  - { term: การตรวจโค้ด (code review), definition: "การให้เพื่อนอ่านโค้ดเพื่อหาบั๊ก ปัญหาความปลอดภัย และจุดที่อ่านยาก ก่อนรวม" }
  - { term: การระดมจากมวลชน (crowdsourcing), definition: "การให้คนจำนวนมากช่วยกันสร้างข้อมูลหรือให้ความเห็น เช่น วิกิพีเดีย แบบสำรวจ" }
flashcards:
  - { front: "ทำไมโครงงานเสร็จเร็วกว่าการบวกเวลาทุกงาน", back: "งานที่ไม่ต้องรอกันทำพร้อมกันได้ เวลาจึงขึ้นกับเส้นทางที่ยาวที่สุดของงานที่ต้องรอกัน" }
  - { front: "คนขับกับผู้นำทางต่างกันอย่างไร", back: "คนขับพิมพ์โค้ด ผู้นำทางดูภาพรวม จับข้อผิดพลาด และคิดกรณีทดสอบ" }
  - { front: "merge conflict เกิดเมื่อใด", back: "เมื่อสองกิ่งแก้บรรทัดเดียวกันต่างกัน Git ตัดสินเองไม่ได้ ทีมต้องเลือกหรือรวมเอง" }
  - { front: "ตรวจโค้ดตามลำดับความสำคัญอย่างไร", back: "ถูกต้อง → ปลอดภัย → อ่านง่าย → มีกรณีทดสอบ" }
  - { front: "คะแนนความเสี่ยงคิดอย่างไร", back: "โอกาสเกิด × ผลกระทบ แล้วรับมือเรื่องคะแนนสูงก่อน" }
