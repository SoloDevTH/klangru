problems:
  - id: management.principles.planning-decision.p001
    topics: [management.principles.planning-decision]
    difficulty: 1
    type: match
    stem: "จับคู่ประเภทของแผนกับตัวอย่างจากสำนักงานเทศบาลแห่งหนึ่ง (สมมติ)"
    pairs:
      - { left: "นโยบาย", right: "ให้ความสำคัญกับการบริการผู้สูงอายุและผู้พิการเป็นลำดับแรก" }
      - { left: "ขั้นตอนการปฏิบัติ", right: "รับคำร้อง ตรวจเอกสาร ออกใบรับ แล้วส่งต่อกองช่างภายใน 1 วัน" }
      - { left: "กฎ", right: "ห้ามรับเงินค่าธรรมเนียมโดยไม่ออกใบเสร็จทุกกรณี" }
      - { left: "งบประมาณ", right: "จัดสรรเงิน 2 ล้านบาทสำหรับซ่อมถนนในปีงบประมาณหน้า" }
    hints:
      - "นโยบายเป็นแนวทางกว้าง ขั้นตอนเป็นลำดับงาน กฎไม่มีข้อยกเว้น"
      - "แผนที่เขียนเป็นตัวเงินคืออะไร"
    solution: "นโยบายให้แนวทางกว้างและใช้ดุลยพินิจได้ ขั้นตอนการปฏิบัติบอกลำดับงาน กฎบอกสิ่งที่ห้ามโดยไม่มีข้อยกเว้น และงบประมาณคือแผนที่เขียนเป็นตัวเงิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.planning-decision.p002
    topics: [management.principles.planning-decision]
    difficulty: 1
    type: mcq
    stem: "เป้าหมายใดของคลินิกทันตกรรมเป็นเป้าหมายแบบ SMART มากที่สุด"
    choices:
      - { id: a, text: "ลดสัดส่วนผู้ป่วยที่ผิดนัดจาก 15% เหลือไม่เกิน 8% ภายในสิ้นเดือนมีนาคม", correct: true }
      - { id: b, text: "ทำให้ผู้ป่วยพอใจมากขึ้น", feedback: "ไม่เจาะจง วัดไม่ได้ และไม่มีกำหนดเวลา" }
      - { id: c, text: "ลดผู้ป่วยผิดนัดให้เหลือศูนย์ทันที", feedback: "วัดได้แต่ไม่น่าทำได้จริงและไม่ได้ระบุเวลาที่ชัด" }
      - { id: d, text: "ส่งข้อความเตือนนัดให้ผู้ป่วยมากขึ้นในปีนี้", feedback: "เป็นวิธีการ ไม่ใช่ผลลัพธ์ที่วัดได้ และไม่บอกว่ามากขึ้นเท่าใด" }
    hints:
      - "SMART: เจาะจง วัดได้ ทำได้จริง สอดคล้อง มีกำหนดเวลา"
      - "หาข้อที่มีทั้งตัวเลขเป้าหมายและวันสิ้นสุด และเป็นไปได้"
    solution: "ข้อ ก ระบุตัวชี้วัด (สัดส่วนผิดนัด) ค่าเริ่มต้นและค่าเป้าหมาย ซึ่งเป็นไปได้ และมีกำหนดเวลา จึงครบเงื่อนไข SMART"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.planning-decision.p003
    topics: [management.principles.planning-decision]
    difficulty: 1
    type: mcq
    stem: "ตารางเวรพยาบาลประจำสัปดาห์ที่หัวหน้าหอผู้ป่วยจัดทำ เป็นแผนระดับใด"
    choices:
      - { id: a, text: "แผนปฏิบัติการ", correct: true }
      - { id: b, text: "แผนกลยุทธ์", feedback: "แผนกลยุทธ์ทำโดยผู้บริหารระดับสูง ครอบคลุมทั้งองค์กรและระยะยาวหลายปี" }
      - { id: c, text: "แผนยุทธวิธี", feedback: "แผนยุทธวิธีเป็นแผนของฝ่ายในระยะ 1–2 ปี ตารางเวรรายสัปดาห์ละเอียดและสั้นกว่านั้น" }
      - { id: d, text: "นโยบาย", feedback: "นโยบายเป็นแนวทางกว้าง ไม่ได้ระบุว่าใครทำงานวันไหน" }
    hints:
      - "ใครเป็นผู้ทำแผน และแผนครอบคลุมเวลานานเท่าใด"
      - "แผนที่ระบุใครทำอะไรเมื่อไรในระยะสั้นเป็นแผนระดับใด"
    solution: "หัวหน้างานทำ ระยะสั้น ระบุใครทำอะไรเมื่อไร จึงเป็นแผนปฏิบัติการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.planning-decision.p004
    topics: [management.principles.planning-decision]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการตัดสินใจอย่างเป็นระบบให้ถูกต้อง"
    items:
      - "ระบุปัญหาหรือโอกาส"
      - "กำหนดเกณฑ์และน้ำหนักของเกณฑ์"
      - "หาทางเลือก"
      - "ประเมินทางเลือกตามเกณฑ์"
      - "เลือกทางเลือกที่ดีที่สุด"
      - "นำไปปฏิบัติและติดตามผล"
    hints:
      - "ต้องรู้ว่าปัญหาคืออะไรก่อนจึงรู้ว่าจะใช้เกณฑ์ใด"
      - "กำหนดเกณฑ์ก่อนหาทางเลือก เพื่อไม่ให้เลือกเกณฑ์เข้าข้างทางเลือกที่ชอบ"
    solution: "ระบุปัญหา → กำหนดเกณฑ์ → หาทางเลือก → ประเมิน → เลือก → ปฏิบัติและติดตามผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.planning-decision.p005
    topics: [management.principles.planning-decision]
    difficulty: 2
    type: mcq
    stem: "วิสาหกิจชุมชนผลิตข้าวกล้องงอก (สมมติ) พิจารณาสามทางเลือก กำไร (พันบาท) เมื่อความต้องการสูง ปานกลาง ต่ำ เป็นดังนี้ A ขยายใหญ่: 500, 200, −200 · B ขยายเล็ก: 300, 180, 20 · C คงเดิม: 120, 100, 80 ถ้าใช้เกณฑ์ maximax ควรเลือกทางใด"
    choices:
      - { id: a, text: "A ขยายใหญ่", correct: true }
      - { id: b, text: "B ขยายเล็ก", feedback: "B เป็นคำตอบของเกณฑ์ค่าเสียโอกาสหรือ EMV ไม่ใช่ maximax" }
      - { id: c, text: "C คงเดิม", feedback: "C คือคำตอบของ maximin (แง่ร้าย) maximax มองผลดีที่สุด" }
      - { id: d, text: "เลือกไม่ได้เพราะไม่รู้ความน่าจะเป็น", feedback: "maximax ไม่ต้องใช้ความน่าจะเป็น ใช้ได้ในสภาวะไม่แน่นอน" }
    hints:
      - "หาผลดีที่สุดของแต่ละทางเลือก"
      - "เลือกทางเลือกที่ผลดีที่สุดนั้นมีค่ามากที่สุด"
    solution: "ผลดีที่สุดของ A, B, C คือ 500, 300, 120 ค่ามากสุดคือ 500 จึงเลือก A"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.planning-decision.p006
    topics: [management.principles.planning-decision]
    difficulty: 2
    type: mcq
    stem: "จากตารางของวิสาหกิจชุมชนในข้อก่อน (A: 500, 200, −200 · B: 300, 180, 20 · C: 120, 100, 80 พันบาท) ถ้าคณะกรรมการมองโลกแง่ร้ายและใช้เกณฑ์ maximin ควรเลือกทางใด"
    choices:
      - { id: a, text: "C คงเดิม", correct: true }
      - { id: b, text: "A ขยายใหญ่", feedback: "ผลแย่ที่สุดของ A คือขาดทุน 200 ซึ่งแย่ที่สุดในสามทาง" }
      - { id: c, text: "B ขยายเล็ก", feedback: "ผลแย่ที่สุดของ B คือ 20 ยังน้อยกว่าผลแย่ที่สุดของ C (80)" }
      - { id: d, text: "A เพราะ −200 เป็นค่าน้อยสุด", feedback: "maximin หาค่าน้อยสุดของแต่ละแถวก่อน แล้วเลือก 'ค่ามากสุด' ในบรรดาค่าน้อยสุดเหล่านั้น" }
    hints:
      - "หาผลแย่ที่สุดของแต่ละทางเลือก"
      - "เลือกทางเลือกที่ผลแย่ที่สุดยังดีที่สุด"
    solution: "ผลแย่ที่สุดของ A, B, C คือ −200, 20, 80 ค่ามากสุดคือ 80 จึงเลือก C"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.planning-decision.p007
    topics: [management.principles.planning-decision]
    difficulty: 3
    type: numeric
    stem: "จากตารางของวิสาหกิจชุมชน ทางเลือก A ขยายใหญ่ได้กำไร 500, 200, −200 พันบาท เมื่อความต้องการสูง ปานกลาง ต่ำ ซึ่งมีความน่าจะเป็น 0.2, 0.5, 0.3 ตามลำดับ มูลค่าคาดหมาย (EMV) ของ A เป็นเท่าใด (ตอบเป็นพันบาท)"
    answer: { value: 140, unit: พันบาท }
    hints:
      - "EMV = ผลรวมของ (ความน่าจะเป็น × กำไร)"
      - "$0.2(500) + 0.5(200) + 0.3(-200)$"
    misconceptions:
      - { match: 166.67, feedback: "นั่นคือค่าเฉลี่ยธรรมดาของสามค่า ต้องถ่วงด้วยความน่าจะเป็น" }
      - { match: 260, feedback: "ดูเหมือนคิด −200 เป็น +200 กำไรติดลบต้องลบออก" }
    solution: "$\\text{EMV}_A = 0.2(500) + 0.5(200) + 0.3(-200) = 100 + 100 - 60 = 140$ พันบาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.planning-decision.p008
    topics: [management.principles.planning-decision]
    difficulty: 3
    type: numeric
    stem: "ตารางกำไร (พันบาท) ของวิสาหกิจชุมชน: A: 500, 200, −200 · B: 300, 180, 20 · C: 120, 100, 80 ความน่าจะเป็นของความต้องการสูง ปานกลาง ต่ำ คือ 0.2, 0.5, 0.3 EMV สูงสุดในสามทางเลือกเป็นเท่าใด (ตอบเป็นพันบาท)"
    answer: { value: 156, unit: พันบาท }
    hints:
      - "คำนวณ EMV ของทั้งสามทางเลือก"
      - "EMV ของ A คือ 140 ลองคำนวณ B และ C"
    misconceptions:
      - { match: 140, feedback: "140 คือ EMV ของ A ยังมีทางเลือกที่สูงกว่า" }
      - { match: 500, feedback: "500 คือผลดีที่สุดของ A (maximax) ไม่ใช่มูลค่าคาดหมาย" }
    solution: "$\\text{EMV}_A = 140$, $\\text{EMV}_B = 0.2(300) + 0.5(180) + 0.3(20) = 60 + 90 + 6 = 156$, $\\text{EMV}_C = 24 + 50 + 24 = 98$ สูงสุดคือ B ที่ 156 พันบาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.planning-decision.p009
    topics: [management.principles.planning-decision]
    difficulty: 3
    type: numeric
    stem: "จากตารางกำไร (พันบาท) A: 500, 200, −200 · B: 300, 180, 20 · C: 120, 100, 80 (คอลัมน์คือความต้องการสูง ปานกลาง ต่ำ) ค่าเสียโอกาสสูงสุดของทางเลือก B เป็นเท่าใด (ตอบเป็นพันบาท)"
    answer: { value: 200, unit: พันบาท }
    hints:
      - "ค่าเสียโอกาส = ผลดีที่สุดในคอลัมน์ − ผลของทางเลือกในคอลัมน์นั้น"
      - "ผลดีที่สุดของแต่ละคอลัมน์คือ 500, 200, 80"
    misconceptions:
      - { match: 280, feedback: "280 เป็นค่าเสียโอกาสสูงสุดของ A ไม่ใช่ B" }
      - { match: 0, feedback: "ค่าเสียโอกาสคิดเทียบกับค่าดีที่สุดใน 'คอลัมน์' ไม่ใช่ในแถวของตัวเอง" }
    solution: "ค่าเสียโอกาสของ B: $500 - 300 = 200$, $200 - 180 = 20$, $80 - 20 = 60$ ค่าสูงสุดคือ 200 พันบาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.planning-decision.p010
    topics: [management.principles.planning-decision]
    difficulty: 4
    type: mcq
    stem: "จากตารางเดิม (A: 500, 200, −200 · B: 300, 180, 20 · C: 120, 100, 80) ถ้าใช้เกณฑ์ minimax regret ควรเลือกทางใด"
    choices:
      - { id: a, text: "B", correct: true }
      - { id: b, text: "A", feedback: "ค่าเสียโอกาสสูงสุดของ A คือ 280 (เมื่อความต้องการต่ำ) มากกว่าของ B" }
      - { id: c, text: "C", feedback: "ค่าเสียโอกาสสูงสุดของ C คือ 380 (เมื่อความต้องการสูง) มากที่สุด" }
      - { id: d, text: "C เพราะไม่ขาดทุนเลย", feedback: "นั่นคือแนวคิดของ maximin minimax regret ดูความเสียดายเมื่อเทียบกับทางเลือกที่ดีที่สุดของแต่ละสภาวะ" }
    hints:
      - "สร้างตารางค่าเสียโอกาสโดยเทียบกับค่าดีที่สุดในแต่ละคอลัมน์ (500, 200, 80)"
      - "หาค่าเสียโอกาสสูงสุดของแต่ละแถว แล้วเลือกแถวที่ค่านั้นน้อยที่สุด"
    solution: "ค่าเสียโอกาส A: 0, 0, 280 · B: 200, 20, 60 · C: 380, 100, 0 ค่าสูงสุดคือ 280, 200, 380 น้อยที่สุดคือ B"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.planning-decision.p011
    topics: [management.principles.planning-decision]
    difficulty: 5
    type: numeric
    stem: "จากตารางเดิม (A: 500, 200, −200 · B: 300, 180, 20 · C: 120, 100, 80 พันบาท ความน่าจะเป็น 0.2, 0.5, 0.3) บริษัทวิจัยตลาดเสนอขายข้อมูลพยากรณ์ความต้องการ วิสาหกิจไม่ควรจ่ายค่าข้อมูลเกินเท่าใด (หา EVPI ตอบเป็นพันบาท)"
    answer: { value: 68, unit: พันบาท }
    hints:
      - "ถ้ารู้อนาคตแน่นอน จะเลือกค่าดีที่สุดของแต่ละคอลัมน์ (500, 200, 80) ถ่วงด้วยความน่าจะเป็น"
      - "EVPI = ค่าคาดหมายเมื่อรู้อนาคต − EMV ที่ดีที่สุด (156)"
    misconceptions:
      - { match: 224, feedback: "224 คือค่าคาดหมายเมื่อรู้อนาคตแน่นอน ยังต้องลบ EMV ที่ดีที่สุดที่ได้อยู่แล้ว" }
      - { match: 84, feedback: "ต้องลบด้วย EMV ที่ดีที่สุด (B = 156) ไม่ใช่ EMV ของ A (140)" }
    solution: "ค่าคาดหมายเมื่อรู้อนาคต $= 0.2(500) + 0.5(200) + 0.3(80) = 100 + 100 + 24 = 224$ EMV ที่ดีที่สุดคือ 156 ดังนั้น $\\text{EVPI} = 224 - 156 = 68$ พันบาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.planning-decision.p012
    topics: [management.principles.planning-decision]
    difficulty: 3
    type: numeric
    stem: "ร้านอาหารแห่งหนึ่งจะเปิดบูธในงานกาชาดประจำจังหวัด ตามต้นไม้การตัดสินใจในภาพ ทางเลือกที่ดีที่สุดมีมูลค่าคาดหมายเท่าใด (ตอบเป็นบาท)"
    figure:
      src: p-booth-tree.svg
      alt: "ต้นไม้การตัดสินใจ สี่เหลี่ยมทางซ้ายแตกเป็นสามกิ่ง บูธใหญ่ไปยังวงกลมที่แตกเป็นฝนตก (0.4) กำไร −20,000 บาท และฝนไม่ตก (0.6) กำไร 50,000 บาท บูธเล็กไปยังวงกลมที่แตกเป็นฝนตก (0.4) กำไร 5,000 บาท และฝนไม่ตก (0.6) กำไร 25,000 บาท และไม่เปิดบูธ กำไร 0 บาท"
    answer: { value: 22000, unit: บาท }
    hints:
      - "คำนวณ EMV ที่วงกลมแต่ละวง แล้วเลือกค่าสูงสุดที่สี่เหลี่ยม"
      - "บูธใหญ่: $0.4(-20{,}000) + 0.6(50{,}000)$"
    misconceptions:
      - { match: 17000, feedback: "17,000 คือ EMV ของบูธเล็ก บูธใหญ่ให้ EMV สูงกว่า" }
      - { match: 15000, feedback: "นั่นคือค่าเฉลี่ยธรรมดาของบูธใหญ่ ต้องถ่วงด้วยความน่าจะเป็น 0.4 และ 0.6" }
    solution: "บูธใหญ่: $0.4(-20{,}000) + 0.6(50{,}000) = -8{,}000 + 30{,}000 = 22{,}000$ บาท บูธเล็ก: $2{,}000 + 15{,}000 = 17{,}000$ บาท ไม่เปิด: 0 เลือกบูธใหญ่ EMV 22,000 บาท"
