<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="sans-serif" font-size="14">
<title>แรงและความเร็วของดาวเทียมในวงโคจรวงกลม และขนาดวงโคจรต่ำเทียบกับวงโคจรค้างฟ้าตามมาตราส่วน</title>
<rect x="0" y="0" width="780" height="400" fill="#ffffff"/>
<text x="190.0" y="26.0" text-anchor="middle" fill="#15211e" font-size="14" font-weight="bold">ก. แรงโน้มถ่วงเป็นแรงสู่ศูนย์กลาง</text>
<circle cx="190.0" cy="215.0" r="70.0" fill="#d9ecf7" stroke="#15211e" stroke-width="2"/>
<text x="190.0" y="220.0" text-anchor="middle" fill="#15211e" font-size="14">โลก</text>
<circle cx="190.0" cy="215.0" r="150.0" fill="none" stroke="#777" stroke-width="1.5" stroke-dasharray="6,5"/>
<rect x="277.4" y="93.1" width="18.0" height="14.0" rx="0" fill="#bbbbbb" stroke="#15211e" stroke-width="1.5"/>
<line x1="266.4" y1="100.1" x2="306.4" y2="100.1" stroke="#1f5fa8" stroke-width="3"/>
<line x1="286.4" y1="100.1" x2="247.4" y2="146.6" stroke="#c0392b" stroke-width="3"/>
<polygon points="241.4,153.7 252.3,148.5 244.7,142.1" fill="#c0392b" stroke="#c0392b" stroke-width="1" stroke-linejoin="round"/>
<text x="255.4" y="159.7" text-anchor="start" fill="#c0392b" font-size="14" font-weight="bold">F</text>
<line x1="286.4" y1="100.1" x2="232.3" y2="54.7" stroke="#1e7a3c" stroke-width="3"/>
<polygon points="225.1,48.7 230.4,59.5 236.7,51.9" fill="#1e7a3c" stroke="#1e7a3c" stroke-width="1" stroke-linejoin="round"/>
<text x="219.1" y="44.7" text-anchor="end" fill="#1e7a3c" font-size="14" font-weight="bold">v</text>
<line x1="190.0" y1="215.0" x2="286.4" y2="100.1" stroke="#777" stroke-width="1"/>
<text x="248.0" y="125.2" text-anchor="end" fill="#15211e" font-size="13">r = R + h</text>
<text x="190.0" y="388.0" text-anchor="middle" fill="#15211e" font-size="14">GMm/r² = mv²/r  →  v = √(GM/r)</text>
<text x="585.0" y="26.0" text-anchor="middle" fill="#15211e" font-size="14" font-weight="bold">ข. วงโคจรตามมาตราส่วน</text>
<circle cx="585.0" cy="215.0" r="22.7" fill="#d9ecf7" stroke="#15211e" stroke-width="2"/>
<circle cx="585.0" cy="215.0" r="24.1" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<circle cx="585.0" cy="215.0" r="150.0" fill="none" stroke="#1f5fa8" stroke-width="2"/>
<text x="585.0" y="220.0" text-anchor="middle" fill="#15211e" font-size="11">โลก</text>
<text x="637.7" y="155.0" text-anchor="start" fill="#c0392b" font-size="13">สถานีอวกาศ</text>
<text x="637.7" y="173.0" text-anchor="start" fill="#c0392b" font-size="12">สูงราว 400 km</text>
<text x="637.7" y="189.0" text-anchor="start" fill="#c0392b" font-size="12">คาบราว 92 นาที</text>
<line x1="635.7" y1="179.0" x2="604.3" y2="200.5" stroke="#c0392b" stroke-width="1"/>
<text x="585.0" y="55.0" text-anchor="middle" fill="#1f5fa8" font-size="13">วงโคจรค้างฟ้า สูงราว 35,800 km คาบ 1 วัน</text>
<text x="585.0" y="388.0" text-anchor="middle" fill="#15211e" font-size="13">รัศมีวงโคจรค้างฟ้าราว 6.6 เท่าของรัศมีโลก</text>
</svg>
