problems:
  - id: chemistry.matter.atomic-structure.p001
    topics: [chemistry.matter.atomic-structure]
    difficulty: 1
    type: numeric
    stem: "ระดับพลังงานหลัก $n = 3$ จุอิเล็กตรอนได้สูงสุดกี่ตัว"
    answer: { value: 18, unit: ตัว }
    misconceptions:
      - { match: 8, feedback: "8 มาจากการจัดเรียงแบบง่าย 2, 8, 8 ซึ่งใช้ได้ถึงแคลเซียมเท่านั้น ระดับที่ 3 มีระดับย่อย d ด้วย" }
      - { match: 9, feedback: "9 คือจำนวนออร์บิทัล ($n^2$) แต่ละออร์บิทัลจุได้ 2 ตัว" }
    hints:
      - "จำนวนอิเล็กตรอนสูงสุดในระดับหลัก $n$ คือ $2n^2$"
      - "หรือรวมระดับย่อย 3s (2) + 3p (6) + 3d (10)"
    solution: "$2n^2 = 2 \\times 3^2 = 18$ ตัว ตรงกับ 3s (2) + 3p (6) + 3d (10) $= 18$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.atomic-structure.p002
    topics: [chemistry.matter.atomic-structure]
    difficulty: 2
    type: numeric
    stem: "ระดับพลังงานย่อย d จุอิเล็กตรอนได้สูงสุดกี่ตัว"
    answer: { value: 10, unit: ตัว }
    misconceptions:
      - { match: 5, feedback: "5 คือจำนวนออร์บิทัลของระดับย่อย d แต่ละออร์บิทัลจุได้ 2 ตัว" }
      - { match: 14, feedback: "14 คือของระดับย่อย f (7 ออร์บิทัล)" }
    hints:
      - "ระดับย่อย s p d f มี 1, 3, 5, 7 ออร์บิทัล"
      - "หนึ่งออร์บิทัลจุอิเล็กตรอนได้ 2 ตัว"
    solution: "ระดับย่อย d มี 5 ออร์บิทัล ออร์บิทัลละ 2 ตัว จุได้ $5 \\times 2 = 10$ ตัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.atomic-structure.p003
    topics: [chemistry.matter.atomic-structure]
    difficulty: 2
    type: order
    stem: "เรียงระดับพลังงานย่อยตามลำดับการเติมอิเล็กตรอน (หลักเอาฟ์บาว) จากเติมก่อนไปเติมทีหลัง"
    items: ["3s", "3p", "4s", "3d", "4p"]
    hints:
      - "ใช้แผนภาพลูกศรทแยง"
      - "ระวัง 4s มีพลังงานต่ำกว่า 3d จึงเติมก่อน"
    solution: "3s → 3p → **4s → 3d** → 4p ระดับย่อย 4s เติมก่อน 3d เป็นเหตุผลที่โพแทสเซียมและแคลเซียมมีอิเล็กตรอนชั้นที่ 4 ก่อนชั้นที่ 3 จะเต็ม 18"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.atomic-structure.p004
    topics: [chemistry.matter.atomic-structure]
    difficulty: 2
    type: text
    stem: "เขียนการจัดเรียงอิเล็กตรอนในระดับพลังงานย่อยแบบเต็มรูปของออกซิเจน ($Z = 8$) พิมพ์เลขยกกำลังเป็นตัวเลขธรรมดา เช่น 1s2 2s1"
    accepted: ["1s2 2s2 2p4", "1s^2 2s^2 2p^4", "1s² 2s² 2p⁴"]
    misconceptions:
      - { match: "1s2 2s2 2p6", feedback: "นั่นคือนีออน ($Z = 10$) รวมเลขยกกำลังแล้วต้องได้ 8" }
      - { match: "1s2 2s6", feedback: "ระดับย่อย s จุได้แค่ 2 ตัว อิเล็กตรอนที่เหลือต้องไปอยู่ 2p" }
    hints:
      - "เติม 1s ก่อน แล้ว 2s แล้ว 2p"
      - "s จุได้ 2 ตัว p จุได้ 6 ตัว รวมเลขยกกำลังให้ได้ 8"
    solution: "1s รับ 2 ตัว 2s รับ 2 ตัว เหลือ 4 ตัวไปที่ 2p ได้ $\\mathrm{1s^2\\,2s^2\\,2p^4}$ ตรวจ $2 + 2 + 4 = 8$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.atomic-structure.p005
    topics: [chemistry.matter.atomic-structure]
    difficulty: 3
    type: text
    stem: "ไฟถนนสีเหลืองส้มหลายสายในไทยใช้หลอดโซเดียม เขียนการจัดเรียงอิเล็กตรอนของโซเดียม ($Z = 11$) แบบย่อด้วยสัญลักษณ์แก๊สมีตระกูล (เช่น [He]2s1)"
    accepted: ["[Ne]3s1", "[Ne]3s^1", "[Ne]3s¹", "[Ne] 3s1"]
    misconceptions:
      - { match: "[Ne]3s2", feedback: "Ne มีอิเล็กตรอน 10 ตัว โซเดียมมี 11 ตัว จึงเหลือเพียง 1 ตัว" }
      - { match: "[Ar]3s1", feedback: "Ar มี 18 ตัว มากกว่าโซเดียมเสียอีก ต้องใช้แก๊สมีตระกูลก่อนหน้าโซเดียมคือ Ne" }
    hints:
      - "หาแก๊สมีตระกูลที่อยู่ก่อนโซเดียม และมีอิเล็กตรอนกี่ตัว"
      - "อิเล็กตรอนที่เกินจากแก๊สมีตระกูลไปอยู่ระดับย่อยถัดไปคือ 3s"
    solution: "แก๊สมีตระกูลก่อน Na คือ Ne ($Z = 10$) เหลืออีก $11 - 10 = 1$ ตัวอยู่ที่ 3s จึงเป็น $\\mathrm{[Ne]\\,3s^1}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.atomic-structure.p006
    topics: [chemistry.matter.atomic-structure]
    difficulty: 3
    type: mcq
    stem: "ภาพแสดงแผนภาพออร์บิทัลของอะตอมธาตุ X ที่เป็นกลาง X คือธาตุใด"
    figure:
      src: p-orbital-x.svg
      alt: "แผนภาพออร์บิทัล กล่อง 1s มีลูกศรขึ้นและลง 1 คู่ กล่อง 2s มีลูกศรขึ้นและลง 1 คู่ กล่อง 2p สามกล่องมีลูกศรชี้ขึ้นกล่องละ 1 ตัว"
    choices:
      - { id: a, text: "ไนโตรเจน ($Z = 7$)", correct: true, feedback: "ถูก นับลูกศรได้ 2 + 2 + 3 = 7" }
      - { id: b, text: "คาร์บอน ($Z = 6$)", feedback: "คาร์บอนมี 2p เพียง 2 ตัว" }
      - { id: c, text: "ออกซิเจน ($Z = 8$)", feedback: "ออกซิเจนมี 2p 4 ตัว ต้องมีหนึ่งออร์บิทัลที่จับคู่" }
      - { id: d, text: "ฟอสฟอรัส ($Z = 15$)", feedback: "ฟอสฟอรัสมี 3p³ ซึ่งคล้ายกัน แต่ต้องมี 2p เต็ม 6 ตัวและมี 3s 3p ด้วย" }
    hints:
      - "ลูกศรหนึ่งตัวคืออิเล็กตรอนหนึ่งตัว"
      - "อะตอมที่เป็นกลางมีอิเล็กตรอนเท่ากับเลขอะตอม"
    solution: "นับอิเล็กตรอน: 1s 2 ตัว 2s 2 ตัว 2p 3 ตัว รวม 7 ตัว จึงเป็น **ไนโตรเจน** สังเกตว่า 2p ทั้งสามตัวอยู่คนละออร์บิทัลตามกฎของฮุนด์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.atomic-structure.p007
    topics: [chemistry.matter.atomic-structure]
    difficulty: 3
    type: mcq
    stem: "แผนภาพออร์บิทัล 2p ของคาร์บอน ($\\mathrm{2p^2}$) แบบใดถูกต้องตามกฎของฮุนด์"
    choices:
      - { id: a, text: "[↑] [↑] [ ]", correct: true, feedback: "ถูก อิเล็กตรอนกระจายคนละออร์บิทัลและสปินทิศเดียวกัน" }
      - { id: b, text: "[↑↓] [ ] [ ]", feedback: "จับคู่ก่อนกระจาย ขัดกฎของฮุนด์ อิเล็กตรอนสองตัวผลักกันมากกว่าเมื่ออยู่ออร์บิทัลเดียวกัน" }
      - { id: c, text: "[↑↑] [ ] [ ]", feedback: "สองตัวในออร์บิทัลเดียวต้องมีสปินตรงข้าม (หลักของเพาลี) และยังขัดกฎของฮุนด์ด้วย" }
    hints:
      - "กฎของฮุนด์: เข้าทุกออร์บิทัลทีละตัวก่อน แล้วจึงจับคู่"
      - "ออร์บิทัลเดียวกันจะมีอิเล็กตรอนสองตัวได้ก็ต่อเมื่อสปินตรงข้าม"
    solution: "ตามกฎของฮุนด์ อิเล็กตรอน 2 ตัวใน 2p ต้องอยู่ **คนละออร์บิทัล** ก่อน: [↑] [↑] [ ] คาร์บอนจึงมีอิเล็กตรอนเดี่ยว 2 ตัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.atomic-structure.p008
    topics: [chemistry.matter.atomic-structure]
    difficulty: 4
    type: numeric
    stem: "เหล็ก ($Z = 26$) ในเหล็กเส้นก่อสร้างมีการจัดเรียงอิเล็กตรอน $\\mathrm{[Ar]\\,3d^6\\,4s^2}$ อะตอมเหล็กมีอิเล็กตรอนเดี่ยว (ไม่มีคู่) กี่ตัว"
    answer: { value: 4, unit: ตัว }
    misconceptions:
      - { match: 6, feedback: "3d มี 5 ออร์บิทัล อิเล็กตรอนตัวที่ 6 ต้องเข้าไปจับคู่กับตัวแรก" }
      - { match: 0, feedback: "จับคู่ทุกตัวก่อนขัดกฎของฮุนด์ ต้องกระจายครบ 5 ออร์บิทัลก่อน" }
    hints:
      - "4s² จับคู่ครบแล้ว ดูเฉพาะ 3d⁶"
      - "วาด 5 กล่อง ใส่ลูกศรขึ้นกล่องละตัวให้ครบ 5 ก่อน แล้วตัวที่ 6 จึงจับคู่"
    solution: "3d มี 5 ออร์บิทัล ใส่อิเล็กตรอน 5 ตัวแรกกล่องละตัว ตัวที่ 6 จับคู่กับกล่องแรก: [↑↓] [↑] [↑] [↑] [↑] เหลืออิเล็กตรอนเดี่ยว **4 ตัว** อิเล็กตรอนเดี่ยวเหล่านี้เกี่ยวข้องกับการที่เหล็กถูกแม่เหล็กดูดได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.atomic-structure.p009
    topics: [chemistry.matter.atomic-structure]
    difficulty: 4
    type: text
    stem: "เขียนจำนวนอิเล็กตรอนในแต่ละระดับพลังงานหลักของสแกนเดียม ($Z = 21$) คั่นด้วยจุลภาค เช่น 2,8,1"
    accepted: ["2,8,9,2", "2, 8, 9, 2", "2-8-9-2", "2 8 9 2"]
    misconceptions:
      - { match: "2,8,8,3", feedback: "ระดับที่ 4 มีแค่ 4s ซึ่งจุได้ 2 ตัว อิเล็กตรอนตัวที่ 21 ต้องเข้า 3d ซึ่งเป็นของระดับที่ 3" }
      - { match: "2,8,11", feedback: "ต้องเติม 4s ก่อน 3d อะตอมนี้จึงมีอิเล็กตรอนในระดับที่ 4 ด้วย" }
    hints:
      - "เขียนแบบระดับย่อยก่อน: $\\mathrm{1s^2\\,2s^2\\,2p^6\\,3s^2\\,3p^6\\,4s^2\\,3d^?}$"
      - "รวมอิเล็กตรอนตามเลข $n$: ระดับ 3 = 3s + 3p + 3d"
    solution: "$\\mathrm{Sc:\\ 1s^2\\,2s^2\\,2p^6\\,3s^2\\,3p^6\\,3d^1\\,4s^2}$ รวมตามระดับหลัก: $n=1$: 2 · $n=2$: 8 · $n=3$: $2 + 6 + 1 = 9$ · $n=4$: 2 ได้ **2, 8, 9, 2**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.atomic-structure.p010
    topics: [chemistry.matter.atomic-structure]
    difficulty: 5
    type: text
    stem: "ทองแดง ($Z = 29$) ในสายไฟบ้านมีการจัดเรียงอิเล็กตรอนที่ไม่เป็นไปตามลำดับเอาฟ์บาวตรง ๆ เขียนแบบย่อด้วย [Ar] (เขียน 3d ก่อน 4s เช่น [Ar]3d5 4s1)"
    accepted: ["[Ar]3d10 4s1", "[Ar]3d104s1", "[Ar]3d^10 4s^1", "[Ar]3d¹⁰4s¹", "[Ar]4s1 3d10", "[Ar]4s13d10"]
    misconceptions:
      - { match: "[Ar]3d9 4s2", feedback: "นี่คือผลจากเติมตามลำดับตรง ๆ แต่ทองแดงย้าย 1 ตัวจาก 4s ไป 3d เพื่อให้ 3d เต็ม 10 ซึ่งเสถียรกว่า" }
      - { match: "[Ar]3d94s2", feedback: "นี่คือผลจากเติมตามลำดับตรง ๆ แต่ทองแดงย้าย 1 ตัวจาก 4s ไป 3d เพื่อให้ 3d เต็ม 10 ซึ่งเสถียรกว่า" }
    hints:
      - "Ar มี 18 ตัว เหลือ 11 ตัวสำหรับ 4s และ 3d"
      - "ระดับย่อย d ที่เต็ม ($\\mathrm{d^{10}}$) เสถียรเป็นพิเศษ"
    solution: "ตามลำดับตรง ๆ จะได้ $\\mathrm{[Ar]\\,3d^9\\,4s^2}$ แต่ 3d ที่เต็มเสถียรกว่า อิเล็กตรอน 1 ตัวจึงย้ายจาก 4s ไป 3d ได้ $\\mathrm{[Ar]\\,3d^{10}\\,4s^1}$ (โครเมียมก็เป็นข้อยกเว้นแบบเดียวกัน: $\\mathrm{[Ar]\\,3d^5\\,4s^1}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.atomic-structure.p011
    topics: [chemistry.matter.atomic-structure]
    difficulty: 4
    type: text
    stem: "สนิมเหล็กมีไอออน $\\mathrm{Fe^{3+}}$ เขียนการจัดเรียงอิเล็กตรอนของ $\\mathrm{Fe^{3+}}$ แบบย่อด้วย [Ar] (Fe เป็นกลางคือ [Ar]3d6 4s2)"
    accepted: ["[Ar]3d5", "[Ar]3d^5", "[Ar]3d⁵", "[Ar] 3d5"]
    misconceptions:
      - { match: "[Ar]3d3 4s2", feedback: "เอาอิเล็กตรอนออกจาก 3d ก่อน ไอออนบวกของโลหะแทรนซิชันเสีย 4s ก่อนเสมอ" }
      - { match: "[Ar]3d34s2", feedback: "เอาอิเล็กตรอนออกจาก 3d ก่อน ไอออนบวกของโลหะแทรนซิชันเสีย 4s ก่อนเสมอ" }
      - { match: "[Ar]3d6", feedback: "นั่นคือ $\\mathrm{Fe^{2+}}$ ซึ่งเสียไป 2 ตัว $\\mathrm{Fe^{3+}}$ เสีย 3 ตัว" }
    hints:
      - "ประจุ 3+ แปลว่าเสียอิเล็กตรอน 3 ตัว"
      - "เอาออกจาก 4s ทั้ง 2 ตัวก่อน แล้วจึงเอาจาก 3d อีก 1 ตัว"
    solution: "Fe: $\\mathrm{[Ar]\\,3d^6\\,4s^2}$ เสีย 4s ทั้ง 2 ตัวก่อน ได้ $\\mathrm{[Ar]\\,3d^6}$ ($\\mathrm{Fe^{2+}}$) เสียอีก 1 ตัวจาก 3d ได้ $\\mathrm{Fe^{3+}}$: $\\mathrm{[Ar]\\,3d^5}$ ซึ่ง 3d มีครึ่งหนึ่งพอดี จึงค่อนข้างเสถียร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.atomic-structure.p012
    topics: [chemistry.matter.atomic-structure]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใด **เป็นจริงทั้ง** แบบจำลองอะตอมของโบร์และแบบกลุ่มหมอก (เลือกได้มากกว่า 1 ข้อ)"
    choices:
      - { id: a, text: "นิวเคลียสอยู่ตรงกลางอะตอม", correct: true, feedback: "ถูก ทั้งสองแบบรับผลการทดลองของรัทเทอร์ฟอร์ด" }
      - { id: b, text: "อิเล็กตรอนมีพลังงานได้เฉพาะบางค่าเป็นระดับ", correct: true, feedback: "ถูก แนวคิดระดับพลังงานยังอยู่ในแบบกลุ่มหมอก" }
      - { id: c, text: "อิเล็กตรอนวิ่งเป็นวงกลมที่ระยะแน่นอน", feedback: "จริงเฉพาะแบบของโบร์ แบบกลุ่มหมอกบอกได้เพียงโอกาสที่จะพบ" }
      - { id: d, text: "ระดับพลังงานหลักแบ่งเป็นระดับย่อย s p d f", feedback: "จริงเฉพาะแบบกลุ่มหมอก แบบของโบร์ไม่มีระดับย่อย" }
    hints:
      - "แบบกลุ่มหมอกพัฒนาต่อจากแบบของโบร์ บางแนวคิดจึงยังอยู่"
      - "สิ่งที่แบบกลุ่มหมอกเปลี่ยนคือภาพของตำแหน่งอิเล็กตรอน"
    solution: "เหมือนกัน: นิวเคลียสอยู่กลาง (a) และอิเล็กตรอนอยู่เป็นระดับพลังงาน (b) ต่างกัน: โบร์ให้อิเล็กตรอนวิ่งเป็นวงที่ระยะแน่นอน (c) ส่วนแบบกลุ่มหมอกบอกเพียงโอกาสที่จะพบ และมีระดับย่อยกับออร์บิทัล (d)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.atomic-structure.p013
    topics: [chemistry.matter.atomic-structure]
    difficulty: 4
    type: numeric
