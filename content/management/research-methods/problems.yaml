      - { id: b, text: "ขออนุญาตหน่วยงานก่อน ใช้เฉพาะข้อมูลที่จำเป็น และแยกหรือปิดบังข้อมูลระบุตัวตนก่อนวิเคราะห์ตามที่ได้รับอนุญาต", correct: true }
      - { id: c, text: "ถามเพื่อนร่วมงานในศูนย์ว่ามีใครรอนานบ้าง", feedback: "เป็นการเปิดเผยข้อมูลส่วนบุคคลโดยไม่จำเป็นและละเมิดความลับ" }
      - { id: d, text: "เผยแพร่ชื่อของผู้ที่รอนานที่สุดในรายงานเพื่อให้เห็นปัญหาชัดเจน", feedback: "การเปิดเผยตัวตนในรายงานทำให้ผู้ให้ข้อมูลเสี่ยง ไม่ควรทำ" }
    hints:
