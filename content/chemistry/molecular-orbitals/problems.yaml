    type: mcq
    stem: "ไนโตรเจนประมาณ 78% ของอากาศเป็นแก๊ส N₂ โมเลกุลนี้มีอันดับพันธะเท่าไร"
    choices:
      - { id: a, text: "1", feedback: "อันดับพันธะ 1 เป็นของ F₂ ไม่ใช่ N₂" }
