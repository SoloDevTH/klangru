problems:
  - id: phy.ff.p001
    topics: [physics.kinematics.free-fall]
    difficulty: 1
    type: numeric
    stem: "ปล่อยก้อนหินจากหยุดนิ่งลงบ่อน้ำ ก้อนหินตกอิสระนาน $1.5\\ \\mathrm{s}$ ก่อนถึงผิวน้ำ ขณะถึงผิวน้ำก้อนหินมีอัตราเร็วเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ และไม่คิดแรงต้านอากาศ (ตอบเป็นตัวเลขในหน่วย m/s)"
    answer: { value: 14.7, tolerance: 0.1, unit: m/s }
    hints:
      - "ปล่อยจากหยุดนิ่งแปลว่า $u = 0$ และความเร็วทิศลงเพิ่มขึ้น $9.8\\ \\mathrm{m/s}$ ทุกวินาที"
      - "ใช้ $v = u + at$ กับขนาดของความเร่ง $g$ แล้วแทนเวลา"
    misconceptions:
      - { match: 11.025, feedback: "นั่นคือ $\\tfrac{1}{2}gt^2$ ซึ่งเป็นระยะที่ตก (หน่วย m) ไม่ใช่อัตราเร็ว อัตราเร็วหาจาก $v = gt$" }
      - { match: 15, feedback: "ดูเหมือนใช้ $g = 10\\ \\mathrm{m/s^2}$ วิธีคิดถูกแล้ว แต่ข้อนี้กำหนด $g = 9.8\\ \\mathrm{m/s^2}$" }
    solution: "$|v| = gt = (9.8\\ \\mathrm{m/s^2})(1.5\\ \\mathrm{s}) = 14.7\\ \\mathrm{m/s}$ ทิศลง (ถ้าตั้งทิศขึ้นเป็นบวก จะได้ $v = -14.7\\ \\mathrm{m/s}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.ff.p002
    topics: [physics.kinematics.free-fall]
    difficulty: 1
    type: mcq
    stem: "โยนลูกบอลขึ้นตรง ๆ ไม่คิดแรงต้านอากาศ ขณะลูกบอลอยู่ที่จุดสูงสุด ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "ความเร็วเป็นศูนย์ ความเร่งเป็น $9.8\\ \\mathrm{m/s^2}$ ทิศลง", correct: true }
      - { id: b, text: "ความเร็วเป็นศูนย์ ความเร่งเป็นศูนย์", feedback: "ถ้าความเร่งเป็นศูนย์ ความเร็วจะไม่เปลี่ยน ลูกบอลจะค้างอยู่กลางอากาศตลอดไป แรงโน้มถ่วงยังกระทำอยู่ ความเร่งจึงยังเป็น $g$ ทิศลง" }
      - { id: c, text: "ความเร็วเป็นศูนย์ ความเร่งเป็น $9.8\\ \\mathrm{m/s^2}$ ทิศขึ้น", feedback: "แรงโน้มถ่วงดึงลงเสมอ ความเร่งของการตกอิสระจึงมีทิศลงตลอดเวลา ทั้งขาขึ้นและขาลง" }
      - { id: d, text: "ความเร็วเป็น $9.8\\ \\mathrm{m/s}$ ทิศลง ความเร่งเป็นศูนย์", feedback: "สลับบทบาทของความเร็วกับความเร่ง ที่จุดสูงสุดลูกบอลหยุดชั่วขณะ ความเร็วจึงเป็นศูนย์ ส่วนความเร่งเป็น $g$" }
    hints:
      - "ที่จุดสูงสุด ลูกบอลกำลังจะเปลี่ยนจากขึ้นเป็นลง ความเร็วตอนนั้นเป็นเท่าใด"
      - "แรงโน้มถ่วงหายไปที่จุดสูงสุดหรือไม่ ถ้าไม่ ความเร่งก็ยังเท่าเดิม"
    solution: "ที่จุดสูงสุดความเร็วเป็นศูนย์ชั่วขณะ แต่แรงโน้มถ่วงยังกระทำอยู่ ความเร่งจึงเป็น $g = 9.8\\ \\mathrm{m/s^2}$ ทิศลงเหมือนทุกช่วงของการเคลื่อนที่ ความเร็วจึงเปลี่ยนเป็นทิศลงต่อไปได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.ff.p003
    topics: [physics.kinematics.free-fall]
    difficulty: 2
    type: numeric
    stem: "ลูกมะพร้าวหล่นจากยอดต้นซึ่งสูงจากพื้น $12.0\\ \\mathrm{m}$ (เริ่มจากหยุดนิ่ง) ใช้เวลากี่วินาทีจึงถึงพื้น ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ และไม่คิดแรงต้านอากาศ (ตอบเป็นตัวเลขในหน่วย s ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 1.565, tolerance: 0.015, unit: s }
    hints:
      - "รู้ $u = 0$, ระยะที่ตก $h = 12.0\\ \\mathrm{m}$ และ $g$ ต้องการหาเวลา"
      - "จาก $h = \\tfrac{1}{2}gt^2$ จัดรูปได้ $t = \\sqrt{\\dfrac{2h}{g}}$ อย่าลืมถอดรากที่สอง"
    misconceptions:
      - { match: 2.449, feedback: "ลืมถอดรากที่สอง นั่นคือค่า $t^2 = \\dfrac{2h}{g}$ ต้องถอดรากอีกครั้งจึงได้ $t$" }
      - { match: 1.107, feedback: "ดูเหมือนลืมเลข 2 จาก $h = \\tfrac{1}{2}gt^2$ จะได้ $t^2 = \\dfrac{2h}{g}$ ไม่ใช่ $\\dfrac{h}{g}$" }
    solution: "$t = \\sqrt{\\dfrac{2h}{g}} = \\sqrt{\\dfrac{2(12.0\\ \\mathrm{m})}{9.8\\ \\mathrm{m/s^2}}} = \\sqrt{2.449\\ \\mathrm{s^2}} \\approx 1.56\\ \\mathrm{s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.ff.p004
    topics: [physics.kinematics.free-fall]
    difficulty: 2
    type: mcq
    stem: "ปล่อยลูกเหล็กมวล $5\\ \\mathrm{kg}$ และลูกเหล็กมวล $1\\ \\mathrm{kg}$ ที่มีขนาดเท่ากันจากความสูงเท่ากันพร้อมกัน ถ้าไม่คิดแรงต้านอากาศ ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "ทั้งสองลูกถึงพื้นพร้อมกัน", correct: true }
      - { id: b, text: "ลูก $5\\ \\mathrm{kg}$ ถึงพื้นก่อน เพราะหนักกว่า", feedback: "นี่คือความเชื่อสมัยอริสโตเติล ลูกที่หนักกว่าถูกโลกดึงแรงกว่าก็จริง แต่ก็ต้องใช้แรงมากกว่าเพื่อเร่งมันด้วยในสัดส่วนเท่ากัน ความเร่งจึงเท่ากันคือ $g$" }
      - { id: c, text: "ลูก $5\\ \\mathrm{kg}$ ถึงพื้นก่อน โดยใช้เวลาเป็น $\\tfrac{1}{5}$ เท่าของลูก $1\\ \\mathrm{kg}$", feedback: "เวลาตกหาจาก $t = \\sqrt{\\tfrac{2h}{g}}$ ซึ่งไม่มีมวลอยู่ในสูตรเลย มวลต่างกันจึงไม่ทำให้เวลาต่างกัน" }
      - { id: d, text: "ลูก $1\\ \\mathrm{kg}$ ถึงพื้นก่อน เพราะเบากว่า", feedback: "ของเบาไม่ได้ตกเร็วกว่า เมื่อไม่มีแรงต้านอากาศ วัตถุทุกชนิดมีความเร่งเท่ากันคือ $g$" }
    hints:
      - "ความเร่งของการตกอิสระขึ้นกับมวลของวัตถุหรือไม่"
      - "ดูสูตรเวลาตก $t = \\sqrt{\\tfrac{2h}{g}}$ ว่ามีมวลอยู่ในสูตรหรือไม่"
    solution: "เมื่อไม่มีแรงต้านอากาศ วัตถุทุกชนิดตกด้วยความเร่ง $g = 9.8\\ \\mathrm{m/s^2}$ เท่ากัน เวลาตก $t = \\sqrt{\\tfrac{2h}{g}}$ ไม่ขึ้นกับมวล ทั้งสองลูกจึงถึงพื้นพร้อมกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.ff.p005
    topics: [physics.kinematics.free-fall]
    difficulty: 3
    type: numeric
    stem: "นักกีฬาตะกร้อเตะลูกขึ้นตรง ๆ ด้วยความเร็ว $7.0\\ \\mathrm{m/s}$ ลูกตะกร้อลอยอยู่ในอากาศนานกี่วินาทีก่อนกลับมาถึงระดับเดิม ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ และไม่คิดแรงต้านอากาศ (ตอบเป็นตัวเลขในหน่วย s ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 1.4286, tolerance: 0.015, unit: s }
    hints:
      - "หาเวลาขาขึ้นก่อน ที่จุดสูงสุดความเร็วเป็นศูนย์ จึงใช้ $0 = u - gt$"
      - "ใช้ความสมมาตร: เวลาขาลงจากจุดสูงสุดกลับถึงระดับเดิมเท่ากับเวลาขาขึ้น"
    misconceptions:
      - { match: 0.7143, feedback: "นั่นคือเวลาขาขึ้นถึงจุดสูงสุดเท่านั้น ลูกตะกร้อยังต้องตกกลับลงมาอีกช่วงหนึ่งซึ่งใช้เวลาเท่ากัน" }
      - { match: 68.6, feedback: "ดูเหมือนนำความเร็วคูณกับ $g$ เวลาต้องเป็นความเร็วหารด้วยความเร่ง หน่วย $\\dfrac{\\mathrm{m/s}}{\\mathrm{m/s^2}} = \\mathrm{s}$" }
    solution: "เวลาขาขึ้น $t_{\\text{ขึ้น}} = \\dfrac{u}{g} = \\dfrac{7.0}{9.8}\\ \\mathrm{s} \\approx 0.714\\ \\mathrm{s}$ เวลาลอยทั้งหมด $= 2 \\times 0.714 \\approx 1.43\\ \\mathrm{s}$ (ตรวจ: $y = 7.0(1.4286) - 4.9(1.4286)^2 \\approx 0$ ✓)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.ff.p006
    topics: [physics.kinematics.free-fall]
    difficulty: 3
    type: numeric
    stem: "ในงานสัปดาห์วิทยาศาสตร์ นักเรียนยิงจรวดขวดน้ำขึ้นตรง ๆ จรวดหลุดจากฐานยิงด้วยความเร็ว $19.6\\ \\mathrm{m/s}$ แล้วเคลื่อนที่แบบตกอิสระ จรวดขึ้นไปได้สูงสุดกี่เมตรเหนือฐานยิง ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ และไม่คิดแรงต้านอากาศ (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 19.6, tolerance: 0.2, unit: m }
    hints:
      - "ที่จุดสูงสุดความเร็วเป็นศูนย์ โจทย์ไม่ให้และไม่ถามเวลา"
      - "ใช้ $v^2 = u^2 - 2gy$ โดยให้ $v = 0$ แล้วจัดรูปหา $y$"
    misconceptions:
      - { match: 39.2, feedback: "ดูเหมือนลืมเลข 2 ในตัวส่วน ความสูงสูงสุดคือ $H = \\dfrac{u^2}{2g}$" }
      - { match: 2, feedback: "นั่นคือเวลาขาขึ้น $\\dfrac{u}{g}$ (หน่วย s) ไม่ใช่ความสูง ลองใช้เวลานี้หาความสูงต่อ หรือใช้ $H = \\dfrac{u^2}{2g}$" }
    solution: "$H = \\dfrac{u^2}{2g} = \\dfrac{(19.6\\ \\mathrm{m/s})^2}{2(9.8\\ \\mathrm{m/s^2})} = \\dfrac{384.16}{19.6}\\ \\mathrm{m} = 19.6\\ \\mathrm{m}$ (ตรวจ: ใช้เวลาขึ้น $2\\ \\mathrm{s}$ และ $y = 19.6(2) - 4.9(2)^2 = 19.6\\ \\mathrm{m}$ ✓)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.ff.p007
    topics: [physics.kinematics.free-fall]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการแก้โจทย์ \"โยนลูกบอลขึ้นด้วยความเร็ว $u$ จงหาความสูงสูงสุด\" ให้ถูกต้อง"
    items:
      - "ตั้งทิศขึ้นเป็นบวก จึงได้ $a = -9.8\\ \\mathrm{m/s^2}$"
      - "เขียนสิ่งที่รู้: ความเร็วต้น $u$ และที่จุดสูงสุด $v = 0$"
      - "เลือกสมการที่ไม่มีเวลา คือ $v^2 = u^2 + 2ay$"
      - "แทนค่าแล้วจัดรูปหา $y$"
      - "ตรวจว่า $y$ เป็นบวกและมีหน่วยเป็นเมตร"
    hints:
      - "เริ่มจากการเลือกทิศบวก เพราะเครื่องหมายของทุกปริมาณขึ้นกับขั้นนี้"
      - "ลำดับทั่วไปคือ ตั้งทิศ → เขียนสิ่งที่รู้ → เลือกสมการ → คำนวณ → ตรวจคำตอบ"
    solution: "ตั้งทิศบวกก่อนจึงรู้เครื่องหมายของ $a$ → เขียนสิ่งที่รู้รวมทั้ง $v = 0$ ที่จุดสูงสุด → เลือกสมการที่ไม่มีตัวแปรที่ไม่รู้และไม่ถาม ($t$) → แทนค่าแล้วจัดรูป ได้ $y = \\dfrac{u^2}{2g}$ → ตรวจเครื่องหมายและหน่วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.ff.p008
    topics: [physics.kinematics.free-fall]
    difficulty: 3
    type: numeric
    stem: "โยนลูกบอลขึ้นตรง ๆ ด้วยความเร็ว $12\\ \\mathrm{m/s}$ แล้วรับคืนที่ระดับเดิม ไม่คิดแรงต้านอากาศ ($g = 9.8\\ \\mathrm{m/s^2}$) ให้ทิศขึ้นเป็นบวก ขณะลูกบอลกลับถึงมือมีความเร็วเท่าใด (ตอบเป็นตัวเลขพร้อมเครื่องหมาย ในหน่วย m/s)"
    answer: { value: -12, unit: m/s }
    hints:
      - "เมื่อไม่มีแรงต้านอากาศ การเคลื่อนที่ขาขึ้นและขาลงสมมาตรกัน อัตราเร็วที่ระดับเดียวกันจึงเท่ากัน"
      - "ตอนกลับถึงมือ ลูกบอลเคลื่อนที่ทิศใด เมื่อทิศขึ้นเป็นบวก ความเร็วต้องมีเครื่องหมายใด"
    misconceptions:
      - { match: 12, feedback: "ขนาดถูกแล้ว แต่ตอนกลับถึงมือ ลูกบอลเคลื่อนที่ลง เมื่อทิศขึ้นเป็นบวก ความเร็วจึงต้องเป็นลบ" }
      - { match: 0, feedback: "ความเร็วเป็นศูนย์เฉพาะที่จุดสูงสุด หลังจากนั้นลูกบอลเร็วขึ้นเรื่อย ๆ ระหว่างตกกลับลงมา" }
    solution: "จาก $v^2 = u^2 + 2ay$ เมื่อกลับถึงระดับเดิม $y = 0$ ได้ $v^2 = u^2$ คือ $v = \\pm 12\\ \\mathrm{m/s}$ ลูกบอลกำลังตกลง จึงได้ $v = -12\\ \\mathrm{m/s}$ (ตรวจด้วยเวลา: ลอยนาน $\\tfrac{2(12)}{9.8} \\approx 2.45\\ \\mathrm{s}$ และ $v = 12 - 9.8(2.45) \\approx -12\\ \\mathrm{m/s}$ ✓)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.ff.p009
    topics: [physics.kinematics.free-fall]
    difficulty: 5
    type: numeric
    stem: "ยืนบนดาดฟ้าตึกซึ่งสูงจากพื้น $14.7\\ \\mathrm{m}$ แล้วโยนลูกบอลขึ้นตรง ๆ ด้วยความเร็ว $9.8\\ \\mathrm{m/s}$ ลูกบอลขึ้นไปแล้วตกลงผ่านข้างตึกถึงพื้น นับจากตอนโยน ลูกบอลใช้เวลากี่วินาทีจึงถึงพื้น ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ และไม่คิดแรงต้านอากาศ (ตอบเป็นตัวเลขในหน่วย s)"
    answer: { value: 3, tolerance: 0.03, unit: s }
    hints:
      - "ตั้งทิศขึ้นเป็นบวกและให้จุดโยนเป็นศูนย์ พื้นอยู่ต่ำกว่าจุดโยน การกระจัดจึงเป็น $y = -14.7\\ \\mathrm{m}$"
      - "ใช้ $y = ut - \\tfrac{1}{2}gt^2$ จะได้สมการกำลังสองในตัวแปร $t$"
      - "จัดให้อยู่ในรูป $4.9t^2 - 9.8t - 14.7 = 0$ หารตลอดด้วย 4.9 แล้วแยกตัวประกอบ เลือกคำตอบที่ $t$ เป็นบวก"
    misconceptions:
      - { match: 1.732, feedback: "ดูเหมือนคิดเหมือนปล่อยให้ตกจากหยุดนิ่ง ($t = \\sqrt{2h/g}$) แต่ลูกบอลถูกโยนขึ้นก่อน จึงใช้เวลานานกว่านั้น ต้องใส่ความเร็วต้น $+9.8\\ \\mathrm{m/s}$ ในสมการด้วย" }
      - { match: 1, feedback: "สมการกำลังสองมีรากเป็น $3$ และ $-1$ เวลา $-1\\ \\mathrm{s}$ เกิดก่อนโยนจึงใช้ไม่ได้ จะตัดเครื่องหมายลบทิ้งไม่ได้ ต้องเลือกรากที่เป็นบวก" }
    solution: "$-14.7 = 9.8t - 4.9t^2$ → $4.9t^2 - 9.8t - 14.7 = 0$ → หารด้วย 4.9: $t^2 - 2t - 3 = 0$ → $(t - 3)(t + 1) = 0$ ได้ $t = 3\\ \\mathrm{s}$ (ตัด $t = -1$ ทิ้ง) ตรวจ: $9.8(3) - 4.9(3)^2 = 29.4 - 44.1 = -14.7\\ \\mathrm{m}$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.ff.p010
    topics: [physics.kinematics.free-fall]
    difficulty: 3
    type: numeric
    stem: "โทรศัพท์หล่นจากกระเป๋าเสื้อซึ่งสูงจากพื้น $1.2\\ \\mathrm{m}$ (เริ่มจากหยุดนิ่ง) โทรศัพท์กระทบพื้นด้วยอัตราเร็วเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ และไม่คิดแรงต้านอากาศ (ตอบเป็นตัวเลขในหน่วย m/s ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 4.85, tolerance: 0.05, unit: m/s }
    hints:
      - "โจทย์ให้ความสูงแต่ไม่ให้เวลา จึงเลือกสมการที่ไม่มี $t$"
      - "ใช้ $v^2 = u^2 + 2gh$ เมื่อ $u = 0$ แล้วถอดรากที่สอง"
    misconceptions:
      - { match: 23.52, feedback: "นั่นคือ $v^2$ ยังไม่ได้ถอดรากที่สอง หน่วยของค่านี้คือ $\\mathrm{m^2/s^2}$" }
      - { match: 3.43, feedback: "ดูเหมือนลืมเลข 2 ใน $v^2 = 2gh$" }
    solution: "$v = \\sqrt{2gh} = \\sqrt{2(9.8\\ \\mathrm{m/s^2})(1.2\\ \\mathrm{m})} = \\sqrt{23.52}\\ \\mathrm{m/s} \\approx 4.85\\ \\mathrm{m/s}$ (ราว $17\\ \\mathrm{km/h}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.ff.p011
    topics: [physics.kinematics.free-fall]
    difficulty: 5
    type: numeric
    stem: "โยนลูกบอลขึ้นตรง ๆ ด้วยความเร็ว $19.6\\ \\mathrm{m/s}$ ลูกบอลอยู่สูงกว่า $14.7\\ \\mathrm{m}$ เหนือจุดโยนเป็นเวลานานกี่วินาที ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ และไม่คิดแรงต้านอากาศ (ตอบเป็นตัวเลขในหน่วย s)"
    answer: { value: 2, tolerance: 0.02, unit: s }
    hints:
      - "ลูกบอลผ่านความสูง $14.7\\ \\mathrm{m}$ สองครั้ง คือขาขึ้นและขาลง"
      - "ตั้งสมการ $14.7 = 19.6t - 4.9t^2$ แล้วแก้หาเวลาทั้งสองค่า"
      - "ช่วงเวลาที่อยู่สูงกว่าระดับนั้นคือผลต่างระหว่างเวลาสองค่า"
    misconceptions:
      - { match: 1, feedback: "นั่นคือเวลาที่ลูกบอลขึ้นไปถึง $14.7\\ \\mathrm{m}$ ครั้งแรก ลูกบอลยังขึ้นต่อไปจนถึงจุดสูงสุดแล้วลงมาผ่านระดับนี้อีกครั้ง ต้องหาผลต่างของเวลาทั้งสองครั้ง" }
      - { match: 3, feedback: "นั่นคือเวลาที่ลูกบอลตกกลับผ่าน $14.7\\ \\mathrm{m}$ (นับจากตอนโยน) ต้องลบเวลาครั้งแรกที่ผ่านระดับนี้ออกด้วย" }
    solution: "$14.7 = 19.6t - 4.9t^2$ → $4.9t^2 - 19.6t + 14.7 = 0$ → หารด้วย 4.9: $t^2 - 4t + 3 = 0$ → $(t - 1)(t - 3) = 0$ ผ่านระดับนี้ที่ $t = 1\\ \\mathrm{s}$ (ขาขึ้น) และ $t = 3\\ \\mathrm{s}$ (ขาลง) จึงอยู่สูงกว่า $14.7\\ \\mathrm{m}$ นาน $3 - 1 = 2\\ \\mathrm{s}$ สังเกตความสมมาตร: จุดสูงสุดอยู่ที่ $t = 2\\ \\mathrm{s}$ พอดีกึ่งกลาง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.ff.p012
    topics: [physics.kinematics.free-fall]
    difficulty: 4
    type: expression
    stem: "โยนวัตถุขึ้นตรง ๆ ด้วยความเร็ว $u$ ในบริเวณที่มีความเร่งโน้มถ่วง $g$ ไม่คิดแรงต้านอากาศ เขียนเวลาที่วัตถุลอยอยู่ในอากาศตั้งแต่โยนจนกลับถึงระดับเดิมในรูปของ $u$ และ $g$"
    prefix: "t ="
    answer: { latex: "\\frac{2u}{g}", variables: [u, g] }
    hints:
      - "หาเวลาขาขึ้นก่อน โดยให้ความเร็วที่จุดสูงสุดเป็นศูนย์ใน $v = u - gt$"
      - "ใช้ความสมมาตร: เวลาขาลงเท่ากับเวลาขาขึ้น หรือแก้ $0 = ut - \\tfrac{1}{2}gt^2$ แล้วเลือกรากที่ไม่ใช่ศูนย์"
    misconceptions:
      - { match: "\\frac{u}{g}", feedback: "นั่นคือเวลาขาขึ้นถึงจุดสูงสุดเท่านั้น ยังต้องรวมเวลาตกกลับลงมาซึ่งเท่ากัน" }
      - { match: "\\frac{u^2}{2g}", feedback: "นั่นคือความสูงสูงสุด (หน่วยเมตร) ไม่ใช่เวลา ลองตรวจหน่วย: $\\dfrac{u}{g}$ มีหน่วยเป็นวินาที" }
    solution: "เวลาขาขึ้น: $0 = u - gt$ ได้ $t = \\dfrac{u}{g}$ เวลาขาลงเท่ากัน รวม $t = \\dfrac{2u}{g}$ (หรือจาก $0 = ut - \\tfrac{1}{2}gt^2 = t\\left(u - \\tfrac{1}{2}gt\\right)$ ได้ $t = 0$ หรือ $t = \\dfrac{2u}{g}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.ff.p013
    topics: [physics.kinematics.free-fall]
    difficulty: 5
    type: mcq
    stem: "นักเรียนยืนบนสะพานลอยแล้วโยนลูกบอล 2 ลูกด้วยอัตราเร็วเท่ากัน ลูกแรกโยนขึ้นตรง ๆ ลูกที่สองขว้างลงตรง ๆ ไม่คิดแรงต้านอากาศ ข้อใดถูกต้องเมื่อลูกบอลถึงพื้นถนน"
    choices:
      - { id: a, text: "ทั้งสองลูกกระทบพื้นด้วยอัตราเร็วเท่ากัน แต่ลูกที่โยนขึ้นใช้เวลานานกว่า", correct: true }
      - { id: b, text: "ลูกที่ขว้างลงกระทบพื้นด้วยอัตราเร็วมากกว่า และถึงพื้นก่อน", feedback: "ถึงพื้นก่อนถูกแล้ว แต่ลูกที่โยนขึ้นตกกลับผ่านระดับมือด้วยอัตราเร็วเท่าตอนโยนพอดี (ความสมมาตร) จากนั้นมันก็เคลื่อนที่เหมือนลูกที่ขว้างลงทุกประการ อัตราเร็วตอนกระทบพื้นจึงเท่ากัน" }
      - { id: c, text: "ลูกที่โยนขึ้นกระทบพื้นด้วยอัตราเร็วมากกว่า เพราะตกจากที่สูงกว่า", feedback: "ลูกที่โยนขึ้นขึ้นไปสูงกว่าก็จริง แต่ตอนกลับผ่านระดับมือ มันมีอัตราเร็วเท่าตอนโยนพอดี ไม่ได้มากกว่า ใช้ $v^2 = u^2 + 2gh$ จะเห็นว่าทิศของ $u$ ไม่มีผล" }
      - { id: d, text: "ทั้งสองลูกใช้เวลาเท่ากันและกระทบพื้นด้วยอัตราเร็วเท่ากัน", feedback: "อัตราเร็วเท่ากันถูกแล้ว แต่ลูกที่โยนขึ้นต้องเสียเวลาขึ้นไปแล้วตกกลับมาถึงระดับมือก่อน จึงถึงพื้นช้ากว่า" }
    hints:
      - "ลูกที่โยนขึ้นตกกลับผ่านระดับมือด้วยอัตราเร็วเท่าใดและทิศใด"
      - "ใช้ $v^2 = u^2 + 2gh$ กับทั้งสองลูก ค่า $u^2$ ไม่สนใจทิศของความเร็วต้น ส่วนเวลาให้คิดว่าลูกแรกมีช่วงขึ้นและลงเพิ่มมา"
    solution: "ลูกที่โยนขึ้นกลับผ่านระดับมือด้วยอัตราเร็ว $u$ ทิศลง ซึ่งเหมือนลูกที่ขว้างลงพอดี จากนั้นทั้งสองเคลื่อนที่เหมือนกัน จึงกระทบพื้นด้วย $v = \\sqrt{u^2 + 2gh}$ เท่ากัน แต่ลูกแรกเสียเวลาขึ้นและลงเพิ่มอีก $\\dfrac{2u}{g}$ จึงถึงพื้นช้ากว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.ff.p014
    topics: [physics.kinematics.free-fall]
    difficulty: 1
    type: numeric
    stem: "ปล่อยวัตถุจากหยุดนิ่งให้ตกอิสระ หลังผ่านไป $3\\ \\mathrm{s}$ วัตถุมีอัตราเร็วเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ และไม่คิดแรงต้านอากาศ (ตอบเป็นตัวเลขในหน่วย m/s)"
    answer: { value: 29.4, tolerance: 0.1, unit: m/s }
    hints:
      - "ความเร็วเพิ่มขึ้น $9.8\\ \\mathrm{m/s}$ ทุกวินาที"
      - "$v = gt$ เมื่อเริ่มจากหยุดนิ่ง"
    misconceptions:
