    ai_assisted: true

  - id: math.prob.conditional.p021
    topics: [math.prob.conditional]
    difficulty: 5
    type: expression
    stem: "เหตุการณ์ $A$ และ $B$ เป็นอิสระต่อกัน โดย $P(A) = a$ และ $P(B) = b$ จงเขียน $P(A \\cup B)$ ในรูปของ $a$ และ $b$"
    prefix: "P(A ∪ B) ="
    answer: { latex: "a+b-ab", variables: [a, b] }
    hints:
      - "ใช้กฎการบวก $P(A \\cup B) = P(A) + P(B) - P(A \\cap B)$"
      - "เหตุการณ์อิสระมี $P(A \\cap B) = P(A)P(B)$"
    misconceptions:
      - { match: "a+b", feedback: "ลืมลบ $P(A \\cap B)$ ซึ่งไม่เป็นศูนย์ เพราะอิสระไม่ได้แปลว่าไม่เกิดร่วมกัน" }
      - { match: "ab", feedback: "นี่คือ $P(A \\cap B)$ (และ) ไม่ใช่ $P(A \\cup B)$ (หรือ)" }
    solution: "$P(A \\cup B) = a + b - P(A \\cap B) = a + b - ab$"
    license: CC-BY-SA-4.0
    ai_assisted: true
