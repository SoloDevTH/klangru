id: computer.projects.digital-innovation
subject: computer
title: { th: วิทยาการคอมพิวเตอร์และสื่อดิจิทัลเพื่อเพิ่มมูลค่า, en: "Computing and digital media for adding value" }
summary: รวบรวมและวิเคราะห์ข้อมูล แล้วใช้วิทยาการคอมพิวเตอร์ สื่อดิจิทัล และเทคโนโลยีสารสนเทศหลายอย่างร่วมกันเพิ่มมูลค่าให้สินค้าหรือบริการ สร้างสื่อที่น่าเชื่อถือ ใช้ง่าย และวัดผลกับผู้ใช้จริง
difficulty: 5.5
minutes: 50
prerequisites: [computer.projects.app-development]
encompasses:
  - { id: computer.projects.app-development, weight: 0.3 }
  - { id: computer.data.data-processing, weight: 0.3 }
  - { id: computer.programming.development-process, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: workflow.svg
    alt: "ลำดับการทำงานของโครงงานกล้วยตาก กล่องที่ 1 ลูกค้าสแกน QR บนถุงกล้วยตากด้วยโทรศัพท์ของลูกค้า ลูกศรไปกล่องที่ 2 หน้าเว็บเล่าเรื่องและแบบฟอร์มสั่งซื้อ (สื่อดิจิทัลและเทคโนโลยีสารสนเทศ) ลูกศรไปกล่องที่ 3 ตารางคำนวณสรุปยอด กำไร และกราฟ (สูตรหรือโปรแกรมสรุปยอด) ลูกศรไปกล่องที่ 4 กลุ่มแม่บ้านดูยอด แพ็ก และส่งของบนแท็บเล็ตของกลุ่ม เส้นประสีม่วงจากตารางคำนวณย้อนกลับไปกล่องแรก เขียนว่า วิเคราะห์ข้อมูลแล้วปรับรสชาติ ราคา ภาพ และข้อความ แล้ววัดผลซ้ำกับลูกค้าจริง"
    caption: "เครื่องมือแต่ละอย่างทำหน้าที่ของตัวเอง แล้วส่งข้อมูลต่อให้กัน"
  - type: worked-example
    title: ใช้ข้อมูลเลือกสินค้าที่จะเพิ่มมูลค่าก่อน
    problem: "กลุ่มแม่บ้านขายกล้วยตาก 3 แบบต่อเดือน แบบเดิมถุงละ 60 บาท ต้นทุน 35 บาท ขายได้ 120 ถุง แบบเคลือบช็อกโกแลตถุงละ 95 บาท ต้นทุน 55 บาท ขายได้ 45 ถุง แบบน้ำผึ้งถุงละ 80 บาท ต้นทุน 50 บาท ขายได้ 70 ถุง ควรเริ่มทำสื่อและช่องทางสั่งซื้อให้สินค้าใดก่อน"
    steps:
      - text: "หากำไรต่อถุง: แบบเดิม 60 − 35 = 25 บาท ช็อกโกแลต 95 − 55 = 40 บาท น้ำผึ้ง 80 − 50 = 30 บาท"
      - text: "หากำไรรวมต่อเดือน: แบบเดิม 25 × 120 = 3,000 บาท ช็อกโกแลต 40 × 45 = 1,800 บาท น้ำผึ้ง 30 × 70 = 2,100 บาท"
        why: "สินค้าที่กำไรต่อชิ้นสูงสุดไม่จำเป็นต้องทำกำไรรวมสูงสุด ต้องคูณกับจำนวนที่ขายได้"
      - text: "ดูข้อมูลแบบสอบถาม: ลูกค้าอยากรู้แหล่งผลิตและอยากสั่งซ้ำออนไลน์ ซึ่งตรงกับลูกค้าประจำของแบบเดิม"
      - text: "ตัดสินใจ: เริ่มที่แบบเดิมซึ่งทำกำไรรวมสูงสุดและมีลูกค้ามากที่สุด เพิ่มมูลค่าด้วยเรื่องเล่าและช่องทางสั่งซ้ำ แล้วค่อยลองกับแบบช็อกโกแลตซึ่งกำไรต่อถุงสูง"
        why: "การเริ่มกับสินค้าที่มีลูกค้ามากทำให้วัดผลได้เร็วและเห็นผลชัด"
    answer: "เริ่มที่กล้วยตากแบบเดิม (กำไรรวม 3,000 บาทต่อเดือน มากที่สุด และตรงกับความต้องการของลูกค้าประจำ)"
  - { type: check, problem: computer.projects.digital-innovation.p003, prompt: "ลองคำนวณกำไรรวมของสินค้าอีกแบบหนึ่ง" }
  - type: worked-example
    title: ออกแบบชุดเครื่องมือให้ผู้ใช้ที่รู้จักตัวจริง
    problem: "ร้านซ่อมจักรยานในหมู่บ้านจดคิวลูกค้าในสมุด ลูกค้ามักโทรถามว่ารถซ่อมเสร็จหรือยัง เจ้าของร้านอายุ 55 ปี ใช้โทรศัพท์คล่องแต่ไม่มีคอมพิวเตอร์ ให้ออกแบบแนวทางที่ใช้หลายเครื่องมือร่วมกัน และวิธีวัดผล"
    steps:
      - text: "ระบุผู้ใช้และปัญหา: เจ้าของร้านเสียเวลารับโทรศัพท์ ลูกค้าไม่รู้สถานะรถ"
      - text: "เลือกเครื่องมือ: แบบฟอร์มออนไลน์รับรถ (กรอกบนโทรศัพท์) ตารางคำนวณเก็บคิวและสถานะ และหน้าเว็บสถานะที่ลูกค้าเปิดจากคิวอาร์โค้ดบนใบรับรถ"
        why: "ทุกเครื่องมือใช้บนโทรศัพท์ได้ เพราะเจ้าของร้านไม่มีคอมพิวเตอร์"
      - text: "ใช้วิทยาการคอมพิวเตอร์: สูตรในตารางคำนวณนับคิวที่รออยู่ และประมาณเวลาเสร็จจากเวลาซ่อมเฉลี่ยของงานแต่ละประเภท"
      - text: "ออกแบบให้ใช้ง่าย: ปุ่มเปลี่ยนสถานะมีแค่ รับรถ กำลังซ่อม เสร็จแล้ว ตัวอักษรใหญ่ ไม่ต้องพิมพ์ยาว"
      - text: "วัดผล: นับจำนวนโทรศัพท์ถามสถานะต่อวันก่อนและหลังใช้ 2 สัปดาห์ และถามความเห็นเจ้าของร้านกับลูกค้า"
        why: "ตัวชี้วัดต้องตรงกับปัญหาที่ตั้งไว้ คือเวลาที่เสียไปกับการรับโทรศัพท์"
    answer: "ใช้แบบฟอร์ม ตารางคำนวณ และหน้าสถานะผ่านคิวอาร์โค้ดซึ่งทำงานบนโทรศัพท์ทั้งหมด แล้ววัดจำนวนโทรศัพท์ถามสถานะก่อนและหลัง"
  - { type: check, problem: computer.projects.digital-innovation.p006, prompt: "ลองคำนวณว่ายอดขายเฉลี่ยเปลี่ยนไปร้อยละเท่าไร" }
glossary:
  - { term: การเพิ่มมูลค่า (value adding), definition: "การทำให้สินค้าหรือบริการมีคุณค่าต่อผู้ใช้มากขึ้น เช่น ขายได้ราคาดีขึ้น เข้าถึงลูกค้าใหม่ ลดเวลาหรือความผิดพลาด" }
  - { term: สื่อดิจิทัล (digital media), definition: "ภาพ เสียง วิดีโอ กราฟิก และข้อความในรูปดิจิทัลที่สร้างเพื่อสื่อสารกับผู้ชมกลุ่มหนึ่ง" }
  - { term: เทคโนโลยีสารสนเทศ (information technology), definition: "เทคโนโลยีที่ใช้เก็บ ส่ง และจัดการข้อมูล เช่น แบบฟอร์มออนไลน์ ตารางคำนวณ เครือข่าย" }
  - { term: ผู้ใช้ที่รู้จักตัวจริง (known users), definition: "ผู้ใช้กลุ่มที่ระบุได้และพูดคุย ทดสอบ หรือสังเกตได้จริง ไม่ใช่ผู้ใช้ที่จินตนาการเอา" }
  - { term: ดัดแปลงไปใช้ในรูปแบบใหม่ (re-purpose), definition: "การนำสื่อที่มีอยู่ไปปรับเป็นรูปแบบอื่นสำหรับผู้ชมหรือช่องทางใหม่ เช่น ตัดคลิปยาวเป็นคลิปสั้น" }
  - { term: ร้อยละที่เปลี่ยนไป, definition: "(ค่าหลัง − ค่าก่อน) ÷ ค่าก่อน × 100 ใช้วัดว่าโครงงานเปลี่ยนตัวชี้วัดไปเท่าใด" }
flashcards:
  - { front: "เพิ่มมูลค่าให้สินค้าด้วยเทคโนโลยีได้สามทางอะไรบ้าง", back: "วิทยาการคอมพิวเตอร์ (อัลกอริทึม โปรแกรม) สื่อดิจิทัล (ภาพ คลิป เรื่องเล่า) และเทคโนโลยีสารสนเทศ (ระบบเก็บและส่งข้อมูล)" }
  - { front: "สินค้าที่กำไรต่อชิ้นสูงสุดทำกำไรรวมสูงสุดเสมอหรือไม่", back: "ไม่เสมอ กำไรรวม = กำไรต่อชิ้น × จำนวนที่ขายได้" }
  - { front: "สื่อดิจิทัลที่ดีต้องตรวจสามด้านอะไร", back: "ความน่าเชื่อถือ การออกแบบ และการใช้งานได้ สำหรับผู้ชมกลุ่มที่ตั้งไว้" }
  - { front: "ภาพที่ใช้สัญญาอนุญาต CC BY-NC ใช้ในโปสเตอร์ขายสินค้าได้หรือไม่", back: "ไม่ได้ NC ห้ามใช้เพื่อการค้า" }
  - { front: "ยอดขายเพิ่มหลังทำโครงงาน สรุปได้ทันทีหรือไม่ว่าเพราะโครงงาน", back: "ยัง ต้องดูปัจจัยอื่น เช่น เทศกาล และเทียบกับช่วงเดียวกันของปีก่อน" }
