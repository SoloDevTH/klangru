  solution: การเพิ่มกิจกรรมสร้างสรรค์ ฝึกทักษะปฏิเสธ และบอกแหล่งช่วยเหลือเป็นการเพิ่มปัจจัยปกป้องโดยไม่ตีตรา ส่วนการตรวจค้นเป็นหน้าที่ของครูและเจ้าหน้าที่
