id: thai.composition.summary-writing
subject: thai
title: { th: การเขียนย่อความ, en: "Summary writing" }
summary: หลักและขั้นตอนการย่อความ กติกาเรื่องสรรพนาม คำพูด อักษรย่อ และความเห็น คำนำย่อความตามประเภทของเรื่อง และย่อความจากเรื่องสั้น บทความ ข่าว คลิป และอินโฟกราฟิก
difficulty: 4
minutes: 30
prerequisites: [thai.reading.comprehension]
encompasses:
  - { id: thai.reading.comprehension, weight: 0.4 }
curriculum_tags: []
lessons:
  - type: figure
    src: summary-steps.svg
    alt: "ขั้นตอนการย่อความ 6 ขั้นเรียงเป็นลูกศร 1 อ่านให้จบ รู้ว่าเรื่องพูดถึงอะไร 2 หาใจความ ทีละย่อหน้าด้วย 5W1H 3 ตัดส่วนเกิน ตัวอย่าง คำซ้ำ คำพูด 4 เรียบเรียงใหม่ ใช้สำนวนของตน 5 เขียนคำนำ ตามประเภท จบด้วย ความว่า 6 ตรวจทาน ครบ ไม่เพิ่ม ไม่เปลี่ยนความ"
    caption: "ย่อความ 6 ขั้น จากอ่านให้จบถึงตรวจทาน"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: ย่อบทความสั้นสามย่อหน้า
    problem: "ย่อบทความสมมติ ธนาคารปูม้าของบ้านอ่าวใส (ดูบทความในโจทย์ข้อ 7) ให้เหลือย่อหน้าเดียว"
    steps:
      - text: "หาใจความทีละย่อหน้า (1) ปูน้อยลงเพราะแม่ปูไข่ถูกจับก่อนวางไข่ (2) ตั้งธนาคารปูม้า ฝากแม่ปูจนปล่อยไข่ ปล่อยลูกปูคืนทะเล (3) จับปูได้มากขึ้น รายได้ดีขึ้น และข้อสรุปเรื่องการจับสัตว์น้ำอย่างรู้คุณค่า"
        why: "ใจความของแต่ละย่อหน้าต่อกันเป็นปัญหา วิธีแก้ และผล"
      - text: "ตัดรายละเอียด: ออกเรือตีสี่ ได้ปูไม่ถึงครึ่งกิโลกรัม คำพูดของลุงสมพร"
      - text: "เรียบเรียงใหม่โดยเชื่อมด้วย เพราะ จึง ต่อมา และไม่ใส่ความเห็นของเรา"
      - text: "เขียนคำนำ: ย่อบทความเรื่อง ธนาคารปูม้าของบ้านอ่าวใส ของชนิดา ทะเลงาม จากจดหมายข่าวรักษ์ทะเล ฉบับเดือนมิถุนายน 2569 ความว่า"
      - text: "ตรวจทาน: ไม่มีอัญประกาศ อักษรย่อ หรือสรรพนาม ฉัน"
    answer: "คำนำตามขั้นที่ 4 แล้วย่อหน้าว่า ชาวประมงบ้านอ่าวใสจับปูม้าได้น้อยลงเพราะแม่ปูไข่ถูกจับก่อนวางไข่ จึงตั้งธนาคารปูม้าให้ฝากแม่ปูไว้จนปล่อยไข่และปล่อยลูกปูคืนสู่ทะเล ห้าปีต่อมาจับปูได้มากขึ้นและมีรายได้ดีขึ้น แสดงว่าการจับสัตว์น้ำอย่างรู้คุณค่าช่วยรักษาอาหารในทะเลไว้ให้คนรุ่นหลัง"
  - { type: check, problem: thai.composition.summary-writing.p005, prompt: "ย่อความไม่ใช้อัญประกาศ เปลี่ยนเป็นคำบอกเล่า" }
  - type: worked-example
    title: ย่อความจากอินโฟกราฟิก
    problem: "ย่อความจากอินโฟกราฟิกสมมติ นักเรียน 400 คน มาด้วยรถรับส่ง 140 ผู้ปกครองมาส่ง 120 เดิน 80 ปั่นจักรยาน 60 คน (ดูภาพในโจทย์ข้อ 14)"
    steps:
      - text: "คำนำ: ย่ออินโฟกราฟิกเรื่อง นักเรียนโรงเรียนบ้านสวนมาโรงเรียนอย่างไร ของสภานักเรียน กรกฎาคม 2569 ความว่า"
      - text: "หาอันดับ: รถรับส่งมากที่สุด รองลงมาคือผู้ปกครองมาส่ง"
      - text: "คำนวณร้อยละที่จะใช้: 140 ÷ 400 × 100 = 35 และ 120 ÷ 400 × 100 = 30"
        why: "ร้อยละช่วยให้ผู้อ่านเห็นสัดส่วนโดยไม่ต้องดูภาพ"
      - text: "ตรวจไม่ให้สรุปเกินข้อมูล: 35 ยังไม่ถึงครึ่ง จึงเขียนว่า มากที่สุด ไม่ใช่ ส่วนใหญ่"
    answer: "สภานักเรียนสำรวจนักเรียนทั้ง 400 คน พบว่ามาด้วยรถรับส่งของโรงเรียนมากที่สุด ร้อยละ 35 รองลงมาคือผู้ปกครองมาส่ง ร้อยละ 30 ที่เหลือเดินหรือปั่นจักรยานมาเอง"
  - { type: check, problem: thai.composition.summary-writing.p009, prompt: "1 ใน 3 ใช้การหาร" }
glossary:
  - { term: ย่อความ, definition: "การเขียนเรื่องให้สั้นลงโดยใจความสำคัญครบและความหมายไม่เปลี่ยน" }
  - { term: ใจความสำคัญ, definition: "ข้อความหลักของย่อหน้าหรือเรื่อง ถ้าตัดออกเรื่องจะไม่สมบูรณ์" }
  - { term: คำนำย่อความ, definition: "ข้อความก่อนเนื้อความย่อ บอกประเภท ชื่อเรื่อง ผู้แต่ง และที่มา ลงท้ายด้วย ความว่า" }
  - { term: อัญประกาศ, definition: "เครื่องหมาย \" \" ใช้ครอบคำพูด ย่อความไม่ใช้ ให้เปลี่ยนเป็นคำบอกเล่า" }
  - { term: ร้อยแก้ว, definition: "ข้อความธรรมดาที่ไม่มีบังคับสัมผัส ย่อความเขียนเป็นร้อยแก้ว" }
flashcards:
  - { front: "คำนำย่อความลงท้ายด้วยคำใด", back: "ความว่า แล้วขึ้นบรรทัดใหม่เขียนเนื้อความ" }
  - { front: "ฉัน ในเรื่องเดิม ย่อความเขียนอย่างไร", back: "เปลี่ยนเป็นชื่อหรือสรรพนามบุรุษที่สาม" }
  - { front: "คำนำย่อจดหมาย", back: "ย่อจดหมายของ... ถึง... ลงวันที่... ความว่า" }
  - { front: "สิ่งที่ห้ามใส่ในย่อความ", back: "ความเห็นของผู้ย่อ อัญประกาศ อักษรย่อ คำกลอนทั้งวรรค" }
  - { front: "ย่อจากแผนภูมิ", back: "บอกจำนวนที่สำรวจ อันดับสำคัญ และภาพรวม ไม่สรุปเกินข้อมูล" }
