id: physics.magnetism.magnetic-field
subject: physics
title: { th: สนามแม่เหล็กและแรงแม่เหล็ก, en: Magnetic fields and magnetic force }
summary: อ่านเส้นสนามแม่เหล็ก คำนวณแรงบนลวดที่มีกระแสและแรงบนประจุที่เคลื่อนที่ในสนาม หาทิศแรงด้วยกฎมือขวา และอธิบายการทำงานของมอเตอร์ไฟฟ้า
difficulty: 6
minutes: 40
prerequisites: [physics.electricity.current-voltage, physics.units.vectors]
encompasses:
  - { id: physics.electricity.current-voltage, weight: 0.3 }
  - { id: physics.units.vectors, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: bar-magnet-field.svg
    alt: "แท่งแม่เหล็กวางแนวนอน ขั้ว S อยู่ซ้าย ขั้ว N อยู่ขวา เส้นสนามแม่เหล็กออกจากขั้ว N โค้งไปรอบแท่งแม่เหล็กแล้วเข้าสู่ขั้ว S ทั้งด้านบนและด้านล่าง ลูกศรบนเส้นชี้จาก N ไป S เส้นที่อยู่ใกล้แท่งแม่เหล็กโค้งแคบและอยู่ชิดกัน เส้นไกลออกไปห่างกัน และเส้นสนามไม่ตัดกันเลย"
    caption: "เส้นสนามคำนวณจากแบบจำลองขั้วแม่เหล็ก: ออกจาก N เข้าสู่ S เส้นชิดกันใกล้ขั้วซึ่งสนามแรง"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: wire-and-solenoid.svg
    alt: "ภาพสองส่วน ส่วนแรกเป็นลวดตรงที่มีกระแสพุ่งออกจากกระดาษ (จุดในวงกลม) ล้อมด้วยเส้นสนามวงกลมร่วมศูนย์สี่วง ลูกศรวนทวนเข็มนาฬิกา และวงนอกห่างกันมากขึ้น ส่วนที่สองเป็นภาพตัดของโซเลนอยด์ แถวบนของขดลวดกระแสพุ่งออกจากกระดาษ แถวล่างพุ่งเข้า ภายในขดเส้นสนามเป็นเส้นตรงขนานชี้จากซ้ายไปขวา ออกทางปลายขวาซึ่งเป็นขั้ว N แล้วโค้งกลับรอบนอกเข้าสู่ปลายซ้ายซึ่งเป็นขั้ว S"
    caption: "กฎกำมือขวา: นิ้วโป้งตามกระแสในลวดตรง นิ้วทั้งสี่วนตามสนาม ส่วนโซเลนอยด์ให้นิ้วทั้งสี่วนตามกระแส นิ้วโป้งชี้ขั้วเหนือ"
  - type: worked-example
    title: ฟลักซ์ผ่านขดลวดสี่เหลี่ยม
    problem: "ขดลวดสี่เหลี่ยมขนาด $30\\ \\mathrm{cm} \\times 20\\ \\mathrm{cm}$ อยู่ในสนามแม่เหล็กสม่ำเสมอ $0.5\\ \\mathrm{T}$ จงหาฟลักซ์ผ่านขดลวดเมื่อ (ก) สนามตั้งฉากกับระนาบขดลวด (ข) หมุนขดลวดจนเส้นตั้งฉากกับระนาบทำมุม $60^\\circ$ กับสนาม (ค) สนามขนานกับระนาบขดลวด"
    steps:
      - text: "พื้นที่ $A = 0.30 \\times 0.20 = 0.06\\ \\mathrm{m^2}$"
        why: "ต้องแปลงเซนติเมตรเป็นเมตรก่อนคูณ เพราะ $1\\ \\mathrm{Wb} = 1\\ \\mathrm{T\\cdot m^2}$"
      - text: "(ก) สนามตั้งฉากกับระนาบ แปลว่าขนานกับเส้นตั้งฉาก $\\theta = 0^\\circ$: $\\Phi = (0.5)(0.06) = 0.03\\ \\mathrm{Wb}$"
      - text: "(ข) $\\Phi = (0.5)(0.06)\\cos 60^\\circ = 0.015\\ \\mathrm{Wb}$"
      - text: "(ค) สนามขนานกับระนาบ แปลว่าทำมุม $90^\\circ$ กับเส้นตั้งฉาก: $\\Phi = 0$"
        why: "ไม่มีเส้นสนามเส้นใดทะลุผ่านขดลวดเลย"
    answer: "(ก) $0.03\\ \\mathrm{Wb}$ (ข) $0.015\\ \\mathrm{Wb}$ (ค) $0$"
  - { type: check, problem: phy.mag.p001, prompt: "ทบทวนเส้นสนามก่อนไปต่อ" }
  - type: worked-example
    title: อิเล็กตรอนวิ่งเป็นวงกลมในสนามแม่เหล็ก
    problem: "อิเล็กตรอน (มวล $9.11 \\times 10^{-31}\\ \\mathrm{kg}$ ประจุ $1.6 \\times 10^{-19}\\ \\mathrm{C}$) พุ่งด้วยอัตราเร็ว $3 \\times 10^{6}\\ \\mathrm{m/s}$ ในทิศตั้งฉากกับสนามแม่เหล็ก $2\\ \\mathrm{mT}$ อิเล็กตรอนเคลื่อนที่เป็นวงกลมรัศมีเท่าใด"
    steps:
      - text: "แรงแม่เหล็กตั้งฉากกับความเร็วตลอด อัตราเร็วจึงคงที่ และแรงนี้เป็นแรงสู่ศูนย์กลาง: $qvB = \\dfrac{mv^2}{r}$"
        why: "แรงที่ตั้งฉากกับการเคลื่อนที่ไม่ทำงาน พลังงานจลน์จึงไม่เปลี่ยน เปลี่ยนได้แค่ทิศ"
      - text: "จัดรูป $r = \\dfrac{mv}{qB}$ และแปลง $B = 2\\ \\mathrm{mT} = 2 \\times 10^{-3}\\ \\mathrm{T}$"
      - text: "$r = \\dfrac{(9.11 \\times 10^{-31})(3 \\times 10^{6})}{(1.6 \\times 10^{-19})(2 \\times 10^{-3})} \\approx 8.5 \\times 10^{-3}\\ \\mathrm{m}$"
      - text: "อิเล็กตรอนเป็นประจุลบ ทิศการวนจึงตรงข้ามกับโปรตอนที่เข้ามาในทิศเดียวกัน"
    answer: "รัศมีประมาณ $8.5\\ \\mathrm{mm}$"
  - { type: check, problem: phy.mag.p006, prompt: "ลองใช้กฎมือขวาหาทิศแรง" }
  - type: interactive
    title: แรงบนลวดเมื่อเปลี่ยนมุมกับสนาม
    caption: แกนนอนคือมุม θ ระหว่างลวดกับสนาม (องศา) แกนตั้งคือแรง F = ILB sin θ (N) แรงเป็นศูนย์เมื่อลวดขนานกับสนาม (0° และ 180°) และมากที่สุดเมื่อตั้งฉาก (90°) ลองเพิ่มกระแส I หรือสนาม B เป็นสองเท่า ยอดกราฟจะสูงเป็นสองเท่า
    widget:
      kind: function-plot
      functions: ["I L B \\sin(\\frac{\\pi x}{180})"]
      sliders:
        - { name: I, min: 0, max: 5, step: 0.5, value: 2, label: กระแส I (A) }
        - { name: L, min: 0.1, max: 1, step: 0.1, value: 0.5, label: ความยาวลวด L (m) }
        - { name: B, min: 0, max: 1, step: 0.1, value: 0.5, label: สนามแม่เหล็ก B (T) }
      x: [0, 180]
      y: [0, 5]
  - type: simulation
    title: แม่เหล็กและแม่เหล็กไฟฟ้า (PhET Magnets and Electromagnets)
    url: https://phet.colorado.edu/en/simulations/magnets-and-electromagnets
    provider: phet
    note: ลากเข็มทิศไปรอบแท่งแม่เหล็กเพื่อดูทิศของสนาม แล้วเปลี่ยนเป็นแม่เหล็กไฟฟ้า ลองกลับทิศกระแสและเพิ่มจำนวนรอบขดลวด สังเกตทิศและความเข้มของสนามที่เปลี่ยนไป
glossary:
  - { term: สนามแม่เหล็ก, definition: "บริเวณที่แม่เหล็ก ลวดที่มีกระแส หรือประจุที่เคลื่อนที่ ถูกแรงแม่เหล็กกระทำ ใช้สัญลักษณ์ $B$ หน่วยเทสลา ($\\mathrm{T}$)" }
  - { term: เส้นสนามแม่เหล็ก, definition: "เส้นที่บอกทิศของสนาม นอกแท่งแม่เหล็กมีทิศจากขั้วเหนือไปขั้วใต้ เส้นไม่ตัดกัน และชิดกันมากเมื่อสนามแรง" }
  - { term: เทสลา, definition: "หน่วยของสนามแม่เหล็ก $1\\ \\mathrm{T} = 1\\ \\mathrm{N/(A\\cdot m)}$" }
  - { term: คอมมิวเตเตอร์, definition: "วงแหวนผ่าซีกในมอเตอร์กระแสตรง กลับทิศกระแสในขดลวดทุกครึ่งรอบ เพื่อให้ขดลวดหมุนไปทางเดิมต่อเนื่อง" }
flashcards:
  - { front: "แรงบนลวดที่มีกระแสในสนามแม่เหล็ก", back: "$F = ILB\\sin\\theta$ โดย $\\theta$ คือมุมระหว่างลวดกับสนาม ขนานกันได้แรงศูนย์" }
  - { front: "แรงบนประจุที่เคลื่อนที่ในสนามแม่เหล็ก", back: "$F = qvB\\sin\\theta$ ประจุลบได้แรงทิศตรงข้ามกับประจุบวก" }
  - { front: "กฎมือขวาหาทิศแรงบนลวด", back: "แบมือขวา นิ้วโป้งตามกระแส นิ้วทั้งสี่ตามสนาม แรงมีทิศออกจากฝ่ามือ" }
  - { front: "กฎกำมือขวาสำหรับลวดตรง", back: "นิ้วโป้งชี้ทิศกระแส นิ้วทั้งสี่ที่กำรอบลวดคือทิศของเส้นสนามแม่เหล็กที่วนรอบลวด" }
