id: management.quality.process-capability
subject: management
title: { th: ความสามารถของกระบวนการและการวิเคราะห์ระบบการวัด, en: Process capability and measurement system analysis }
summary: ดัชนี Cp Cpk Pp Ppk สัดส่วนของเสียเป็นส่วนในล้าน ระดับซิกมา ความแม่นและความเที่ยงของการวัด การสอบเทียบ และการศึกษา gage R&R เบื้องต้น
difficulty: 7.5
minutes: 50
prerequisites: [management.quality.spc]
encompasses:
  - { id: management.quality.spc, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: capability.svg
    alt: "ฮิสโทแกรมน้ำหนักข้าวสารถุง 5 kg จำนวน 125 ถุง (ข้อมูลจำลอง) แกนนอน 4,970 ถึง 5,050 กรัม แท่งอยู่ระหว่าง 4,995 ถึง 5,045 กรัม สูงสุดที่ช่วง 5,015–5,020 จำนวน 30 ถุง มี 2 ถุงในช่วง 5,040–5,045 ซึ่งเกิน USL เส้นแดงแนวตั้ง LSL = 4,980 และ USL = 5,040 เส้นประสีเขียวที่เป้าหมาย 5,010 เส้นประสีม่วงที่ค่าเฉลี่ย 5,016 เส้นโค้งปกติค่าเฉลี่ย 5,016 s = 9 หางขวาของเส้นโค้งเลยเส้น USL ออกไป ส่วนหางซ้ายยังห่างจาก LSL มาก ใต้ภาพระบุ s รวม = 9 g และ σ ภายในกลุ่มย่อย = 8 g"
    caption: "ค่าเฉลี่ยค่อนไปทาง USL ทำให้หางขวาของการแจกแจงเลยข้อกำหนด แม้ความกว้างของกระบวนการจะแคบกว่าข้อกำหนด"
  - type: worked-example
    title: ปรับค่าเฉลี่ยให้อยู่กลางข้อกำหนด
    problem: "ข้าวสารถุง (LSL 4,980 USL 5,040 กรัม) มีค่าเฉลี่ย 5,016 กรัม $\\hat{\\sigma} = 8$ กรัม $s = 9$ กรัม ถ้าปรับเครื่องบรรจุให้ค่าเฉลี่ยเป็น 5,010 กรัมโดยความผันแปรเท่าเดิม $C_{pk}$ $P_{pk}$ และของเสีย (ppm) จะเป็นเท่าใด"
    steps:
      - text: "ระยะถึงขอบทั้งสองข้างเท่ากัน: $5{,}040 - 5{,}010 = 30$ และ $5{,}010 - 4{,}980 = 30$ กรัม"
      - text: "$C_{pk} = 30/(3 \\times 8) = 1.25$ เท่ากับ $C_p$ พอดี"
        why: "เมื่อค่าเฉลี่ยอยู่กลางข้อกำหนด $C_{pk} = C_p$ ซึ่งเป็นค่าสูงสุดที่ $C_{pk}$ เป็นได้"
      - text: "$P_{pk} = 30/(3 \\times 9) \\approx 1.11$"
      - text: "ของเสียแต่ละฝั่ง $z = 30/9 \\approx 3.33$ ได้ประมาณ 429 ppm รวมสองฝั่งราว 858 ppm"
      - text: "เดิมรวมราว 3,860 ppm การปรับค่าเฉลี่ยอย่างเดียวลดของเสียได้ราว 78% แต่ $C_{pk}$ ยังไม่ถึง 1.33 ต้องลดความผันแปรต่อ"
    answer: "C_pk = 1.25, P_pk ≈ 1.11, ของเสียราว 858 ppm การจัดค่าเฉลี่ยให้อยู่กลางเป็นการปรับปรุงที่ถูกและเร็วที่สุด"
  - { type: check, problem: management.quality.process-capability.p004 }
  - type: figure
    src: targets.svg
    alt: "เป้ายิงสี่วง จุดสีแดงตรงกลางคือค่าจริง วงที่ 1 แม่นและเที่ยง: จุดแปดจุดเกาะกลุ่มแน่นที่กลางเป้า วงที่ 2 เที่ยงแต่ไม่แม่น: จุดเกาะกลุ่มแน่นแต่อยู่ห่างกลางเป้าไปทางขวาบน วงที่ 3 แม่นแต่ไม่เที่ยง: จุดกระจายกว้างรอบกลางเป้า วงที่ 4 ไม่แม่นและไม่เที่ยง: จุดกระจายและอยู่ห่างกลางเป้าไปทางขวาล่าง"
    caption: "ความแม่นคือค่าเฉลี่ยตรงค่าจริง ความเที่ยงคือค่าที่วัดซ้ำอยู่ใกล้กัน"
  - type: worked-example
    title: ศึกษา gage R&R ของเครื่องวัดความหนาแผ่นยาง
    problem: "โรงงานยางพาราแผ่น (สมมติ) ศึกษาเครื่องวัดความหนา ได้ส่วนเบี่ยงเบนมาตรฐานจากความทำซ้ำได้ 0.6 ไมโครเมตร ระหว่างผู้วัด 0.8 ไมโครเมตร และระหว่างชิ้นงาน 3.0 ไมโครเมตร พิกัดความเผื่อกว้าง 30 ไมโครเมตร ระบบการวัดนี้ใช้ได้หรือไม่"
    steps:
      - text: "$\\sigma_{GRR} = \\sqrt{0.6^2 + 0.8^2} = \\sqrt{1.00} = 1.0$ ไมโครเมตร"
        why: "บวกความแปรปรวน (กำลังสอง) แล้วถอดราก ถ้าบวก 0.6 + 0.8 ตรง ๆ จะได้ 1.4 ซึ่งเกินจริง"
      - text: "$\\sigma_{\\text{รวม}} = \\sqrt{1.0^2 + 3.0^2} = \\sqrt{10} \\approx 3.16$ ไมโครเมตร"
      - text: "$\\%GRR = 1.0/3.16 \\times 100 \\approx 31.6\\%$ เกิน 30%"
      - text: "$ndc = 1.41 \\times 3.0/1.0 = 4.23$ ปัดลงเป็น 4 น้อยกว่า 5"
      - text: "เทียบพิกัดความเผื่อ $6(1.0)/30 \\times 100 = 20\\%$"
        why: "ถ้าใช้เครื่องนี้แค่ตัดสินผ่านหรือไม่ผ่าน อาจพอรับได้ แต่ถ้าใช้ทำ SPC และหาความสามารถของกระบวนการ ยังหยาบเกินไป"
    answer: "%GRR ≈ 31.6% และ ndc = 4 ระบบการวัดยังไม่พอสำหรับควบคุมกระบวนการ ส่วนที่มาจากผู้วัด (0.8) มากกว่าตัวเครื่อง (0.6) จึงควรเริ่มจากวิธีวัดที่เป็นมาตรฐานและอบรมผู้วัด"
  - { type: check, problem: management.quality.process-capability.p010 }
  - type: figure
    src: p-capability.svg
    alt: "ฮิสโทแกรมปริมาตรน้ำมะพร้าวบรรจุขวด 100 ขวด (ข้อมูลจำลอง) แกนนอน 492 ถึง 518 มิลลิลิตร แท่งอยู่ระหว่าง 501 ถึง 513 มิลลิลิตร เส้นแดงแนวตั้ง LSL = 495 และ USL = 515 เส้นประสีม่วงที่ค่าเฉลี่ย 508 มีเส้นโค้งการแจกแจงปกติทับ"
    caption: "ข้อมูลสำหรับโจทย์ข้อ 7"
glossary:
  - { term: ข้อกำหนด, definition: "ขีดจำกัดล่างและบนที่ลูกค้าหรือแบบกำหนดให้ผลิตภัณฑ์ต้องอยู่ภายใน ต่างจากเส้นควบคุมที่คำนวณจากกระบวนการ" }
  - { term: Cp, definition: "อัตราส่วนความกว้างของข้อกำหนดต่อ 6 เท่าของส่วนเบี่ยงเบนมาตรฐานภายในกลุ่มย่อย ไม่สนตำแหน่งค่าเฉลี่ย" }
  - { term: Cpk, definition: "ระยะจากค่าเฉลี่ยถึงขอบข้อกำหนดที่ใกล้กว่า หารด้วย 3 เท่าของส่วนเบี่ยงเบนมาตรฐานภายในกลุ่มย่อย" }
  - { term: Ppk, definition: "ดัชนีแบบ Cpk ที่ใช้ส่วนเบี่ยงเบนมาตรฐานรวมของข้อมูลทั้งหมด บอกสมรรถนะจริงในช่วงเวลานั้น" }
  - { term: ppm, definition: "ส่วนในล้าน ใช้บอกสัดส่วนของเสียที่น้อยมาก เช่น 0.0038 เท่ากับ 3,800 ppm" }
  - { term: ความเอนเอียง, definition: "ผลต่างระหว่างค่าเฉลี่ยของการวัดซ้ำกับค่าจริงหรือค่าอ้างอิง" }
  - { term: ความทำซ้ำได้, definition: "ความผันแปรเมื่อผู้วัดคนเดิมใช้เครื่องเดิมวัดชิ้นเดิมหลายครั้ง" }
  - { term: การสอบกลับได้, definition: "การที่ผลการวัดเชื่อมโยงกับมาตรฐานแห่งชาติหรือหน่วย SI ได้ผ่านลำดับการสอบเทียบที่มีเอกสารยืนยัน" }
  - { term: gage R&R, definition: "การศึกษาที่แยกความผันแปรของระบบการวัดออกเป็นความทำซ้ำได้และความทำซ้ำได้ระหว่างผู้วัด แล้วเทียบกับความผันแปรทั้งหมดหรือพิกัดความเผื่อ" }
flashcards:
  - { front: "Cp และ Cpk", back: "Cp = (USL − LSL)/6σ · Cpk = min(USL − μ, μ − LSL)/3σ" }
  - { front: "Cp สูงแต่ Cpk ต่ำ แปลว่าอะไร", back: "ความผันแปรพอ แต่ค่าเฉลี่ยไม่อยู่กลาง แก้ด้วยการปรับค่าเฉลี่ย" }
  - { front: "Cpk กับ Ppk", back: "Cpk ใช้ σ ภายในกลุ่มย่อย (ศักยภาพ) · Ppk ใช้ s รวม (สมรรถนะจริง)" }
  - { front: "%GRR และเกณฑ์", back: "σGRR/σรวม × 100 · ต่ำกว่า 10% ใช้ได้ · 10–30% อาจยอมรับ · เกิน 30% ต้องปรับปรุง · ndc ควร ≥ 5" }
  - { front: "รวมความผันแปรของการวัด", back: "บวกความแปรปรวน แล้วถอดราก: σGRR = √(σทำซ้ำ² + σระหว่างผู้วัด²)" }
