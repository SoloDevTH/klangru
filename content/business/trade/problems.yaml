  - 'ตลาดร่วม: เพิ่มการเคลื่อนย้ายแรงงานและทุนได้เสรี'
  - 'สหภาพเศรษฐกิจ: ใช้นโยบายเศรษฐกิจร่วมกัน อาจมีเงินสกุลเดียว'
