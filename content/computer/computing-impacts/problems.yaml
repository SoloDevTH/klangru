problems:
  - id: computer.society.computing-impacts.p001
    topics: [computer.society.computing-impacts]
    difficulty: 1
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นการใช้เทคโนโลยีสารสนเทศ **นอกโรงเรียน** ในชีวิตประจำวัน (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "สแกน QR จ่ายค่าส้มตำที่ตลาดนัด", correct: true }
      - { id: b, text: "แตะบัตรโดยสารขึ้นรถไฟฟ้า", correct: true }
      - { id: c, text: "แอปนำทางบอกเส้นทางเลี่ยงรถติด", correct: true }
      - { id: d, text: "ตักน้ำจากบ่อมารดน้ำต้นไม้", feedback: "เป็นงานที่ไม่ได้ใช้อุปกรณ์ที่เก็บหรือประมวลผลข้อมูล" }
    hints:
      - "เทคโนโลยีสารสนเทศคือการใช้คอมพิวเตอร์ อุปกรณ์ และเครือข่ายกับข้อมูล"
      - "ดูว่าแต่ละข้อมีเครื่องที่อ่าน ส่ง หรือคำนวณข้อมูลอยู่เบื้องหลังหรือไม่"
    solution: "การสแกน QR (ส่งข้อมูลการจ่ายเงินไปธนาคาร) การแตะบัตรโดยสาร (เครื่องอ่านข้อมูลในบัตร) และแอปนำทาง (คำนวณเส้นทางจากข้อมูลจราจร) ล้วนใช้เทคโนโลยีสารสนเทศ ส่วนการตักน้ำรดต้นไม้ไม่ได้ใช้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-impacts.p002
    topics: [computer.society.computing-impacts]
    difficulty: 1
    type: match
    stem: "จับคู่วิธีทำงานแบบเดิมกับวิธีที่ใช้เทคโนโลยีในปัจจุบัน"
    pairs:
      - { left: "เขียนจดหมายส่งทางไปรษณีย์", right: "ส่งข้อความหรือวิดีโอคอล" }
      - { left: "กางแผนที่กระดาษหาทาง", right: "แอปนำทางบนโทรศัพท์" }
      - { left: "ต่อแถวจ่ายบิลที่สำนักงาน", right: "จ่ายผ่านแอปธนาคาร" }
      - { left: "เช่าแผ่นหนังจากร้าน", right: "ดูผ่านบริการสตรีมมิง" }
    hints:
      - "แต่ละคู่คืองานเดียวกันที่ทำต่างวิธี"
      - "ถามว่าวิธีใหม่ทำงานเดียวกับวิธีเก่าข้อใด"
    solution: "จดหมาย ↔ ข้อความ/วิดีโอคอล (ติดต่อคนไกล), แผนที่กระดาษ ↔ แอปนำทาง (หาทาง), จ่ายบิลที่สำนักงาน ↔ แอปธนาคาร (จ่ายเงิน), เช่าแผ่นหนัง ↔ สตรีมมิง (ดูภาพยนตร์)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-impacts.p003
    topics: [computer.society.computing-impacts]
    difficulty: 2
    type: order
    stem: "เรียงเหตุการณ์ในประวัติศาสตร์คอมพิวเตอร์จากเก่าที่สุดไปใหม่ที่สุด"
    items:
      - "แบบเบจออกแบบเครื่องวิเคราะห์ที่ทำงานตามบัตรเจาะรู"
      - "ENIAC คำนวณด้วยหลอดสุญญากาศหลายหมื่นหลอด"
      - "ประดิษฐ์ทรานซิสเตอร์"
      - "ไมโครโพรเซสเซอร์รวมหน่วยประมวลผลไว้ในชิปเดียว"
      - "เวิลด์ไวด์เว็บเปิดให้คนทั่วไปใช้"
      - "สมาร์ตโฟนจอสัมผัสแพร่หลาย"
    hints:
      - "เครื่องยิ่งใหญ่และใช้ชิ้นส่วนแบบเก่า ยิ่งเกิดก่อน"
      - "ทรานซิสเตอร์ต้องมาก่อนชิป และต้องมีคอมพิวเตอร์ที่เล็กและถูกพอก่อนคนทั่วไปจะใช้เว็บหรือสมาร์ตโฟน"
    solution: "เครื่องวิเคราะห์ (ค.ศ. 1837) → ENIAC (1945) → ทรานซิสเตอร์ (1947) → ไมโครโพรเซสเซอร์ (1971) → เวิลด์ไวด์เว็บ (1991) → สมาร์ตโฟนจอสัมผัส (หลัง 2007)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-impacts.p004
    topics: [computer.society.computing-impacts]
    difficulty: 2
    type: numeric
    stem: "ป้าสมศรีเคยไปจ่ายค่าน้ำประปาที่สำนักงาน ใช้เวลาเดินทางไปและกลับรวม 40 นาที และต่อแถว 25 นาที ตอนนี้จ่ายผ่านแอปธนาคารใช้เวลา 3 นาที ป้าสมศรีประหยัดเวลาได้กี่นาทีต่อครั้ง"
    answer: { value: 62, unit: นาที }
    hints:
      - "หาเวลาทั้งหมดของวิธีเดิมก่อน"
      - "นำเวลาวิธีเดิมลบเวลาวิธีใหม่"
    misconceptions:
      - { match: 65, feedback: "65 นาทีคือเวลาของวิธีเดิมทั้งหมด ยังต้องลบเวลาที่ใช้กับแอปอีก 3 นาที" }
      - { match: 37, feedback: "นำ 40 − 3 แล้วลืมเวลาต่อแถว 25 นาที หรือคิดผิดลำดับ วิธีเดิมใช้ 40 + 25 นาที" }
    solution: "วิธีเดิม 40 + 25 = 65 นาที วิธีใหม่ 3 นาที ประหยัดได้ 65 − 3 = 62 นาทีต่อครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-impacts.p005
    topics: [computer.society.computing-impacts]
    difficulty: 2
    type: mcq
    stem: "ข้อความใดบรรยาย **ข้อแลกเปลี่ยน (tradeoff)** ของแอปนำทางได้ถูกต้อง"
    choices:
      - { id: a, text: "ไปถึงที่หมายง่ายขึ้น แต่เราจำทางเองน้อยลงและแอปรู้ตำแหน่งของเรา", correct: true }
      - { id: b, text: "แอปนำทางมีแต่ข้อดี ไม่มีผลเสียเลย", feedback: "เกือบทุกเทคโนโลยีมีทั้งผลดีและผลเสีย ข้อแลกเปลี่ยนต้องพูดถึงทั้งสองด้าน" }
      - { id: c, text: "แอปนำทางทำให้รถติด จึงไม่ควรใช้", feedback: "บอกแต่ผลเสียด้านเดียวและสรุปเกินข้อมูล ไม่ได้ชั่งสิ่งที่ได้กับสิ่งที่เสีย" }
      - { id: d, text: "แอปนำทางใช้ได้ทั้งบนโทรศัพท์และในรถ", feedback: "เป็นข้อเท็จจริงเรื่องอุปกรณ์ ไม่ได้บอกว่าได้อะไรและเสียอะไร" }
    hints:
      - "ข้อแลกเปลี่ยนคือได้อย่างหนึ่ง เสียอย่างหนึ่ง"
      - "หาข้อที่มีทั้งสิ่งที่ได้และสิ่งที่ต้องเสียในประโยคเดียว"
    solution: "ข้อแลกเปลี่ยนต้องมีทั้งผลดีและสิ่งที่ต้องยอมเสีย ข้อ ก บอกว่าได้ความสะดวก แต่เสียทักษะจำทางและความเป็นส่วนตัวด้านตำแหน่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-impacts.p006
    topics: [computer.society.computing-impacts]
    difficulty: 2
    type: numeric
    stem: "ENIAC เริ่มใช้งานจริงใน ค.ศ. 1945 ส่วนประเทศไทยเริ่มมีคอมพิวเตอร์ใช้ใน พ.ศ. 2506 ประเทศไทยมีคอมพิวเตอร์ใช้หลังจาก ENIAC เริ่มใช้งานกี่ปี"
    answer: { value: 18, unit: ปี }
    hints:
      - "ปีทั้งสองใช้ศักราชต่างกัน ต้องแปลงให้เป็นศักราชเดียวกันก่อน"
      - "ค.ศ. = พ.ศ. − 543"
    misconceptions:
      - { match: 561, feedback: "นำ 2506 − 1945 โดยไม่ได้แปลง พ.ศ. เป็น ค.ศ. ก่อน" }
      - { match: 1124, feedback: "บวก 543 แทนการลบ ค.ศ. = พ.ศ. − 543" }
    solution: "พ.ศ. 2506 = ค.ศ. 2506 − 543 = 1963 ระยะห่าง 1963 − 1945 = 18 ปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-impacts.p007
    topics: [computer.society.computing-impacts]
    difficulty: 3
    type: mcq
    stem: "ข้อใดเป็นตัวอย่างที่ **วัฒนธรรมไทยส่งผลต่อการออกแบบเทคโนโลยี** (ไม่ใช่เทคโนโลยีเปลี่ยนวัฒนธรรม)"
    choices:
      - { id: a, text: "โทรศัพท์มีตัวเลือกให้แสดงปีเป็น พ.ศ. และมีแป้นพิมพ์ภาษาไทย", correct: true }
      - { id: b, text: "คนไทยส่งสติกเกอร์ทักทายกันในแอปแชตแทนการโทร", feedback: "เป็นเทคโนโลยีที่เปลี่ยนพฤติกรรมของคน ทิศทางกลับกับที่ถาม" }
      - { id: c, text: "แม่ค้าขายของผ่านการไลฟ์สดแทนการตั้งแผง", feedback: "เป็นวิธีขายของที่เปลี่ยนไปเพราะเทคโนโลยี" }
      - { id: d, text: "ครอบครัวดูละครย้อนหลังคนละเวลาแทนการดูพร้อมกัน", feedback: "เป็นวัฒนธรรมที่เปลี่ยนเพราะเทคโนโลยีสตรีมมิง" }
    hints:
      - "ถามว่าอะไรเป็นต้นเหตุ และอะไรถูกเปลี่ยน"
      - "หาข้อที่ผู้ผลิตต้องปรับเทคโนโลยีให้เข้ากับวิถีหรือภาษาของคนไทย"
    solution: "การมีปฏิทิน พ.ศ. และแป้นพิมพ์ไทยเกิดเพราะคนไทยใช้ภาษาและศักราชของตนเอง วัฒนธรรมจึงเป็นต้นเหตุให้ออกแบบเทคโนโลยีแบบนี้ ส่วนข้ออื่นเป็นเทคโนโลยีที่เปลี่ยนวิถีชีวิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-impacts.p008
    topics: [computer.society.computing-impacts]
    difficulty: 3
    type: match
    stem: "จับคู่ผลกระทบของกล้องวงจรปิดพร้อมระบบจดจำใบหน้าในห้างสรรพสินค้า กับด้านของผลกระทบ"
    pairs:
      - { left: "คนรู้สึกว่าถูกจับตาดูตลอดเวลา", right: "ส่วนบุคคล" }
      - { left: "ห้างเก็บภาพใบหน้าโดยลูกค้าไม่รู้ตัว ถูกต้องหรือไม่", right: "จริยธรรม" }
      - { left: "ห้างลดค่าจ้างพนักงานรักษาความปลอดภัยได้", right: "เศรษฐกิจ" }
      - { left: "จับคนร้ายได้เร็วขึ้น ชุมชนรอบห้างปลอดภัยขึ้น", right: "สังคม" }
    hints:
      - "ด้านเศรษฐกิจเกี่ยวกับเงินและงาน ด้านจริยธรรมถามว่าควรหรือไม่ควรทำ"
      - "ด้านส่วนบุคคลคือความรู้สึกและชีวิตของคนคนหนึ่ง ด้านสังคมคือผลต่อคนจำนวนมากหรือชุมชน"
    solution: "ความรู้สึกถูกจับตา = ส่วนบุคคล, การเก็บใบหน้าโดยไม่ขออนุญาต = จริยธรรม, ลดค่าจ้าง = เศรษฐกิจ, ชุมชนปลอดภัยขึ้น = สังคม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-impacts.p009
    topics: [computer.society.computing-impacts]
    difficulty: 3
    type: numeric
    stem: "ครูประจำชั้นสำรวจนักเรียน 40 คนในห้อง พบว่า 28 คนมีอินเทอร์เน็ตที่บ้าน ถ้าครูจะสั่งการบ้านที่ต้องทำออนไลน์เท่านั้น นักเรียนที่ **ไม่มี** อินเทอร์เน็ตที่บ้านคิดเป็นร้อยละเท่าใดของห้อง"
    answer: { value: 30, unit: "%" }
    hints:
      - "หาจำนวนนักเรียนที่ไม่มีอินเทอร์เน็ตก่อน"
      - "ร้อยละ = จำนวนที่สนใจ ÷ จำนวนทั้งหมด × 100"
    misconceptions:
      - { match: 70, feedback: "70% คือนักเรียนที่ **มี** อินเทอร์เน็ต โจทย์ถามคนที่ไม่มี" }
      - { match: 12, feedback: "12 คือจำนวนคน ยังต้องเปลี่ยนเป็นร้อยละโดยหารด้วย 40 แล้วคูณ 100" }
    solution: "ไม่มีอินเทอร์เน็ต 40 − 28 = 12 คน คิดเป็น 12 ÷ 40 × 100 = 30% ครูจึงควรมีทางเลือก เช่น ให้ใช้ห้องคอมพิวเตอร์ของโรงเรียนหรือส่งงานแบบกระดาษ เพื่อไม่ให้ช่องว่างทางดิจิทัลทำให้นักเรียนเสียเปรียบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-impacts.p010
    topics: [computer.society.computing-impacts]
    difficulty: 3
    type: mcq
    stem: "พี่ต้นลาออกจากงานประจำมาเป็นไรเดอร์ส่งอาหารผ่านแอป ข้อใดเป็น **ข้อเสีย** ของอาชีพแบบนี้เมื่อเทียบกับงานประจำ"
    choices:
      - { id: a, text: "รายได้ไม่แน่นอนและมักไม่มีสวัสดิการอย่างประกันสังคมแบบลูกจ้างประจำ ต้องจัดการเองทั้งหมด", correct: true }
      - { id: b, text: "เลือกเวลาทำงานเองได้", feedback: "เป็นข้อดีของงานผ่านแอป ไม่ใช่ข้อเสีย" }
      - { id: c, text: "เริ่มงานได้เร็ว ใช้เพียงรถและโทรศัพท์", feedback: "การเริ่มง่ายเป็นข้อดี แม้ต้องลงทุนอุปกรณ์เอง" }
      - { id: d, text: "ไม่ต้องใช้เทคโนโลยีใดเลย", feedback: "ไม่จริง ไรเดอร์ต้องใช้แอปรับงาน นำทาง และรับเงิน" }
    hints:
      - "เทียบกับงานประจำที่มีเงินเดือนแน่นอน"
      - "คิดถึงสิ่งที่ลูกจ้างประจำได้ แต่ผู้รับงานผ่านแอปต้องจัดการเอง"
    solution: "งานผ่านแอปให้ความยืดหยุ่นและเริ่มได้ง่าย แต่แลกกับรายได้ที่ขึ้นลงตามจำนวนงานและการที่ต้องจัดการประกันและเงินออมเอง นี่คือข้อแลกเปลี่ยนด้านอาชีพ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-impacts.p011
    topics: [computer.society.computing-impacts]
    difficulty: 3
    type: text
    stem: "ENIAC ใช้หลอดสุญญากาศหลายหมื่นหลอด ต่อมามีสิ่งประดิษฐ์ใน ค.ศ. 1947 ที่ทำหน้าที่เป็นสวิตช์แทนหลอดสุญญากาศ ทำให้คอมพิวเตอร์เล็กลงและใช้ไฟน้อยลงมาก สิ่งประดิษฐ์นั้นคืออะไร"
    accepted: ["ทรานซิสเตอร์", "transistor", "ทรานซิสเตอร"]
    misconceptions:
      - { match: "ไมโครโพรเซสเซอร์", feedback: "ไมโครโพรเซสเซอร์ (ค.ศ. 1971) คือชิปที่มีทรานซิสเตอร์หลายพันตัว เกิดหลังสิ่งที่ถามนี้" }
      - { match: "ชิป", feedback: "ชิปหรือวงจรรวมเกิดทีหลัง และสร้างจากสิ่งที่ถามนี้หลายตัวรวมกัน" }
    hints:
      - "ดูเส้นเวลาในบทเรียนที่ ค.ศ. 1947"
      - "เป็นชิ้นส่วนที่ชิปทุกวันนี้มีอยู่หลายพันล้านตัว"
    solution: "ทรานซิสเตอร์ (transistor) ประดิษฐ์ใน ค.ศ. 1947 เป็นสวิตช์อิเล็กทรอนิกส์ขนาดเล็กที่แทนหลอดสุญญากาศ ต่อมาถูกรวมไว้จำนวนมากในชิปเดียว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-impacts.p012
    topics: [computer.society.computing-impacts]
    difficulty: 4
    type: mcq
    stem: "โรงเรียนแห่งหนึ่งจะใช้ระบบสแกนใบหน้าเช็กชื่อนักเรียนเข้าเรียน ข้อเสนอใด **เพิ่มผลดีและลดผลเสีย** ต่อนักเรียนได้ดีที่สุด"
    choices:
      - { id: a, text: "แจ้งวัตถุประสงค์และขอความยินยอมจากผู้ปกครอง เก็บข้อมูลใบหน้าเท่าที่จำเป็นและลบเมื่อนักเรียนจบ มีวิธีเช็กชื่อแบบอื่นให้คนที่ไม่ยินยอม และตรวจว่าระบบจดจำทุกคนได้แม่นพอกัน", correct: true }
      - { id: b, text: "ติดกล้องเพิ่มทุกห้องและเก็บภาพไว้ตลอดไปเผื่อใช้ภายหลัง", feedback: "เก็บข้อมูลเกินจำเป็นและนานเกินไป เพิ่มความเสี่ยงข้อมูลรั่วและละเมิดความเป็นส่วนตัว" }
      - { id: c, text: "ยกเลิกระบบทันทีเพราะเทคโนโลยีทุกชนิดอันตราย", feedback: "สรุปเกินไป ระบบมีประโยชน์ เช่น ประหยัดเวลาเช็กชื่อ โจทย์ให้เพิ่มผลดีและลดผลเสีย" }
      - { id: d, text: "ใช้ระบบโดยไม่ต้องบอกใคร เพราะเป็นเรื่องภายในโรงเรียน", feedback: "การเก็บข้อมูลชีวภาพของเด็กโดยไม่แจ้งไม่เป็นธรรมและอาจขัดกฎหมายคุ้มครองข้อมูลส่วนบุคคล" }
    hints:
      - "ประเมินทั้งความเป็นส่วนตัว ความยินยอม ความแม่นยำ และทางเลือกสำหรับคนที่ไม่ต้องการใช้"
      - "ข้อที่ดีที่สุดยังได้ประโยชน์จากระบบ แต่ใส่มาตรการลดความเสี่ยงหลายด้าน"
    solution: "ข้อ ก ยังได้ประโยชน์ (เช็กชื่อเร็ว) แต่ลดผลเสียหลายด้าน คือ ขอความยินยอม เก็บเท่าที่จำเป็นและลบเมื่อหมดความจำเป็น มีทางเลือก และตรวจความแม่นยำว่าไม่ลำเอียงกับคนบางกลุ่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-impacts.p013
    topics: [computer.society.computing-impacts]
    difficulty: 4
    type: numeric
    stem: "ชิป Intel 4004 (ค.ศ. 1971) มีทรานซิสเตอร์ราว 2,300 ตัว ถ้าใช้แบบจำลองกฎของมัวร์ว่า **จำนวนทรานซิสเตอร์เพิ่มเป็นสองเท่าทุก 2 ปี** แบบจำลองนี้คาดว่าชิปใน ค.ศ. 1991 จะมีทรานซิสเตอร์กี่ตัว"
    answer: { value: 2355200, tolerance: 23552, unit: ตัว }
    hints:
      - "จาก ค.ศ. 1971 ถึง 1991 คือกี่ปี และเพิ่มเป็นสองเท่ากี่ครั้ง"
      - "การเพิ่มเป็นสองเท่า n ครั้ง คือคูณด้วย $2^n$"
    misconceptions:
      - { match: 25300, feedback: "คิดว่าเพิ่มขึ้นครั้งละ 2,300 ตัว (แบบเส้นตรง) แต่การเพิ่มเป็นสองเท่าคือคูณ 2 ทุกครั้ง" }
      - { match: 2411724800, feedback: "คิดว่าเพิ่มเป็นสองเท่าทุกปี (20 ครั้ง) แต่แบบจำลองนี้เพิ่มทุก 2 ปี จึงมีแค่ 10 ครั้ง" }
    solution: "1991 − 1971 = 20 ปี เพิ่มเป็นสองเท่า 20 ÷ 2 = 10 ครั้ง ได้ 2,300 × $2^{10}$ = 2,300 × 1,024 = 2,355,200 ตัว (เป็นการคาดการณ์จากแบบจำลอง ชิปจริงแต่ละรุ่นอาจมากหรือน้อยกว่านี้)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-impacts.p014
    topics: [computer.society.computing-impacts]
    difficulty: 4
    type: mcq
    stem: "มีผู้เสนอกฎหมายว่า **แอปทุกแอปต้องขอความยินยอมก่อนเก็บตำแหน่งของผู้ใช้** ในการอภิปรายเรื่องนี้ ข้อใดเป็นข้อโต้แย้งที่ชี้ว่ากฎหมายนี้อาจมี **ผลเสียต่อผู้พัฒนาซอฟต์แวร์**"
    choices:
      - { id: a, text: "ทีมพัฒนาเล็ก ๆ ต้องใช้เวลาและเงินเพิ่มเพื่อออกแบบหน้าขอความยินยอมและเก็บหลักฐาน ทำให้ออกแอปใหม่ได้ช้าลง", correct: true }
      - { id: b, text: "ผู้ใช้รู้ว่าแอปใดเก็บตำแหน่งของตน", feedback: "เป็นผลดีต่อผู้ใช้ ไม่ใช่ผลเสียต่อผู้พัฒนา" }
      - { id: c, text: "คนร้ายติดตามตำแหน่งของผู้อื่นผ่านแอปได้ยากขึ้น", feedback: "เป็นผลดีต่อสังคม ข้อโต้แย้งที่ถามต้องชี้ผลเสียต่อผู้พัฒนา" }
      - { id: d, text: "กฎหมายนี้ไม่มีผลกับใครเลย", feedback: "กฎหมายมีผลทั้งต่อผู้ใช้และผู้พัฒนาซอฟต์แวร์ การอภิปรายต้องดูผลจริงของทั้งสองฝ่าย" }
    hints:
      - "อ่านคำถามให้ดีว่าถามผลต่อใคร และเป็นผลดีหรือผลเสีย"
      - "การทำตามกฎหมายต้องใช้ทรัพยากรอะไรของผู้พัฒนาบ้าง"
    solution: "การอภิปรายกฎหมายที่ดีต้องดูทั้งสองฝั่ง กฎหมายนี้คุ้มครองผู้ใช้ แต่เพิ่มต้นทุนและเวลาให้ผู้พัฒนา โดยเฉพาะทีมเล็ก ข้อ ก จึงเป็นข้อโต้แย้งด้านผลเสียต่อผู้พัฒนา ส่วนข้อ ข และ ค เป็นผลดี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-impacts.p015
    topics: [computer.society.computing-impacts]
    difficulty: 4
    type: order
    stem: "เรียงขั้นตอนการประเมินผลกระทบของเทคโนโลยีใหม่อย่างเป็นระบบ"
    items:
      - "บอกให้ชัดว่าเทคโนโลยีนั้นทำงานอะไร แทนวิธีเดิมแบบใด"
      - "ระบุกลุ่มคนที่เกี่ยวข้องทั้งหมด รวมคนที่อาจเข้าไม่ถึง"
      - "เขียนผลดีและผลเสียทั้งห้าด้านต่อแต่ละกลุ่ม"
      - "ชั่งน้ำหนักว่าใครได้และใครเสียมากน้อยเพียงใด"
      - "เสนอวิธีเพิ่มผลดีและลดผลเสีย"
      - "สรุปความเห็นพร้อมเหตุผล"
    hints:
      - "ต้องรู้ก่อนว่าเทคโนโลยีทำอะไรและกระทบใคร จึงจะเขียนผลกระทบได้"
      - "ข้อสรุปควรมาหลังจากชั่งน้ำหนักและหาวิธีแก้แล้ว"
    solution: "อธิบายเทคโนโลยี → ระบุกลุ่มคน → เขียนผลดีผลเสียห้าด้าน → ชั่งน้ำหนัก → เสนอวิธีลดผลเสีย → สรุปพร้อมเหตุผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-impacts.p016
    topics: [computer.society.computing-impacts]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "หน่วยงานแห่งหนึ่งเปิดรับสมัครทุนการศึกษา **ทางเว็บไซต์เท่านั้น** ต้องอัปโหลดเอกสารเป็นไฟล์ และหน้าเว็บมีแต่ภาษาอังกฤษ ข้อใดเป็นการประเมินด้าน **ความเท่าเทียมในการเข้าถึง** ที่ถูกต้อง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "นักเรียนในพื้นที่ที่สัญญาณอินเทอร์เน็ตไม่ดีหรือไม่มีคอมพิวเตอร์เสียเปรียบ แม้จะมีคุณสมบัติครบ", correct: true }
      - { id: b, text: "ควรเพิ่มช่องทางสมัครทางไปรษณีย์หรือที่โรงเรียน และทำหน้าเว็บเป็นภาษาไทยที่ใช้กับโปรแกรมอ่านหน้าจอได้", correct: true }
      - { id: c, text: "ทุกคนมีโทรศัพท์แล้ว จึงไม่มีใครเสียเปรียบ", feedback: "ไม่จริงเสมอไป บางคนไม่มีอุปกรณ์ บางคนมีแต่ใช้อินเทอร์เน็ตได้จำกัด หรือสแกนเอกสารเป็นไฟล์ไม่ได้" }
      - { id: d, text: "การรับสมัครออนไลน์ทำให้หน่วยงานไม่ต้องดูแลเรื่องความเท่าเทียมอีก", feedback: "การย้ายไปออนไลน์ทำให้ปัญหาเปลี่ยนรูป หน่วยงานยังต้องดูแลให้ผู้มีสิทธิ์ทุกคนเข้าถึงได้" }
    hints:
      - "ความเท่าเทียมถามว่าทุกคนที่มีสิทธิ์ได้โอกาสเท่ากันหรือไม่"
      - "ดูทั้งตัวปัญหาและวิธีแก้ที่ช่วยคนที่ถูกกีดกัน"
    solution: "การรับสมัครออนไลน์อย่างเดียวกีดกันผู้ที่ขาดอุปกรณ์ อินเทอร์เน็ต ทักษะภาษา หรือมีความพิการ (ข้อ ก) และควรแก้ด้วยการเพิ่มช่องทางและทำเว็บที่ทุกคนใช้ได้ (ข้อ ข) ส่วนข้อ ค และ ง มองข้ามช่องว่างทางดิจิทัล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.computing-impacts.p017
    topics: [computer.society.computing-impacts]
    difficulty: 5
    type: numeric
    stem: "บริการชำระเงินออนไลน์แห่งหนึ่งมีผู้ใช้ 2 ล้านคนใน พ.ศ. 2560 ถ้าจำนวนผู้ใช้ **เพิ่มเป็นสองเท่าทุก 3 ปี** จะมีผู้ใช้ถึง 16 ล้านคนในปี พ.ศ. ใด"
    answer: { value: 2569 }
    hints:
      - "จาก 2 ล้านเป็น 16 ล้านต้องเพิ่มเป็นสองเท่ากี่ครั้ง"
      - "แต่ละครั้งใช้เวลา 3 ปี นำจำนวนปีไปบวกกับ พ.ศ. 2560"
    misconceptions:
      - { match: 2581, feedback: "คิดว่าเพิ่มครั้งละ 2 ล้านคนทุก 3 ปี (แบบเส้นตรง) แต่โจทย์บอกว่าเพิ่มเป็นสองเท่า" }
      - { match: 2584, feedback: "คิดว่าต้องเพิ่มเป็นสองเท่า 8 ครั้ง (16 ÷ 2) ที่จริง 2 → 4 → 8 → 16 คือ 3 ครั้ง" }
    solution: "2 → 4 → 8 → 16 ล้าน คือเพิ่มเป็นสองเท่า 3 ครั้ง ใช้เวลา 3 × 3 = 9 ปี จึงถึง 16 ล้านคนใน พ.ศ. 2560 + 9 = 2569 (แบบจำลองนี้ใช้คาดการณ์คร่าว ๆ เท่านั้น การเติบโตจริงมักช้าลงเมื่อคนส่วนใหญ่ใช้แล้ว)"
    license: CC-BY-SA-4.0
    ai_assisted: true
