topic: engineering.geotech.soil-properties
rows:
  - { framework: th-coe-engineering-basics, indicators: ["CIV-3.5"], coverage: partial, note: "สอนสมบัติทางกายภาพของดิน (อัตราส่วนช่องว่าง ความพรุน ปริมาณน้ำ หน่วยน้ำหนัก) การกระจายขนาดเม็ด (Cu, Cc) การจำแนกดินด้วยขีดจำกัดอัตเตอร์เบิร์กและ USCS ร้อยละการบดอัด ตัวอย่างดินเหนียวอ่อนกรุงเทพฯ เชิงคุณภาพ (ตัวเลขเป็นค่าสมมติ) การซึมผ่านตามกฎของดาร์ซี ความเค้นประสิทธิผล และการสำรวจด้วย SPT แต่ยังไม่สอนการทรุดตัวของดิน กำลังรับน้ำหนักของฐานราก การวิบัติของลาดดิน และการป้องกัน" }
  - { framework: th-coe-engineering-basics, indicators: ["MIN-2.4"], coverage: partial, note: "สอนพื้นฐานธรณีวิศวกรรมของดินที่ใช้กับงานฐานรากและการจำแนกดิน แต่ยังไม่สอนการสำรวจแร่ การประเมินปริมาณแร่ หรือการเสริมความแข็งแรงของผนังบ่อเหมืองและอุโมงค์" }
