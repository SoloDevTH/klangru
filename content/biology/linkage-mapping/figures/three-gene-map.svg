<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="sans-serif" font-size="14">
<title>ตำแหน่งยีน A B C บนโครโมโซมเดียวกัน ระยะ A ถึง B 6.2 cM ระยะ B ถึง C 5.2 cM และระยะ A ถึง C 11 cM ที่วัดได้โดยตรง</title>
<rect x="0" y="0" width="760" height="340" fill="#ffffff"/>
<line x1="60" y1="230" x2="700" y2="230" stroke="#90a4ae" stroke-width="10" stroke-linecap="round"/>
<circle cx="130" cy="230" r="18" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
<text x="130" y="236" text-anchor="middle" font-weight="bold" fill="#0d47a1" font-size="16">A</text>
<circle cx="385.6" cy="230" r="18" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
<text x="385.6" y="236" text-anchor="middle" font-weight="bold" fill="#0d47a1" font-size="16">B</text>
<circle cx="600" cy="230" r="18" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
<text x="600" y="236" text-anchor="middle" font-weight="bold" fill="#0d47a1" font-size="16">C</text>
<path d="M130,160 L130,150 L385.6,150 L385.6,160" fill="none" stroke="#2e7d32" stroke-width="2"/>
<text x="257.8" y="142" text-anchor="middle" fill="#2e7d32" font-weight="bold">A–B = 6.2 cM</text>
<path d="M385.6,190 L385.6,180 L600,180 L600,190" fill="none" stroke="#ef6c00" stroke-width="2"/>
<text x="492.8" y="172" text-anchor="middle" fill="#ef6c00" font-weight="bold">B–C = 5.2 cM</text>
<path d="M130,90 L130,80 L600,80 L600,90" fill="none" stroke="#6a1b9a" stroke-width="2"/>
<text x="365.0" y="72" text-anchor="middle" fill="#6a1b9a" font-weight="bold">A–C = 11 cM (วัดตรง)</text>
<text x="380" y="300" text-anchor="middle" fill="#37474f">ผลรวม 6.2 + 5.2 = 11.4 ไม่เท่ากับ 11 เพราะมีครอสซิงโอเวอร์สองชั้น</text>
</svg>