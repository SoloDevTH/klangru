<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="sans-serif" font-size="13">
  <title>รูปถูกแบ่งเป็นแพ็กเก็ต 4 ชิ้น เดินทางผ่านเราเตอร์คนละเส้นทาง แล้วประกอบกลับที่ปลายทาง</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="880" height="380" fill="#ffffff"/>
  <rect x="15.0" y="140.0" width="120.0" height="70.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="75.0" y="170.8" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">ผู้ส่ง</text>
  <text x="75.0" y="188.3" font-size="13" text-anchor="middle" fill="#1f2937">กรุงเทพฯ</text>
  <rect x="745.0" y="140.0" width="120.0" height="70.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="805.0" y="170.8" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">ผู้รับ</text>
  <text x="805.0" y="188.3" font-size="13" text-anchor="middle" fill="#1f2937">เชียงใหม่</text>
  <line x1="250.0" y1="175.0" x2="420.0" y2="80.0" stroke="#6b7280" stroke-width="3"/>
  <line x1="250.0" y1="175.0" x2="420.0" y2="270.0" stroke="#6b7280" stroke-width="3"/>
  <line x1="420.0" y1="80.0" x2="600.0" y2="175.0" stroke="#6b7280" stroke-width="3"/>
  <line x1="420.0" y1="270.0" x2="600.0" y2="175.0" stroke="#6b7280" stroke-width="3"/>
  <line x1="420.0" y1="80.0" x2="420.0" y2="270.0" stroke="#6b7280" stroke-width="3"/>
  <line x1="135.0" y1="175.0" x2="222.0" y2="175.0" stroke="#6b7280" stroke-width="3"/>
  <line x1="628.0" y1="175.0" x2="745.0" y2="175.0" stroke="#6b7280" stroke-width="3"/>
  <circle cx="250.0" cy="175.0" r="26.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="250.0" y="180.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">R1</text>
  <circle cx="420.0" cy="80.0" r="26.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="420.0" y="85.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">R2</text>
  <circle cx="420.0" cy="270.0" r="26.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="420.0" y="275.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">R3</text>
  <circle cx="600.0" cy="175.0" r="26.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="600.0" y="180.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">R4</text>
  <text x="420.0" y="30.0" font-size="12" text-anchor="middle" fill="#6b7280">เราเตอร์ส่งต่อแต่ละแพ็กเก็ตไปตามเส้นทางที่ว่างในขณะนั้น</text>
  <rect x="330.0" y="95.0" width="46.0" height="24.0" rx="3" fill="#fef9c3" stroke="#1f2937" stroke-width="1.5"/>
  <text x="353.0" y="112.0" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">#1</text>
  <rect x="505.0" y="95.0" width="46.0" height="24.0" rx="3" fill="#fef9c3" stroke="#1f2937" stroke-width="1.5"/>
  <text x="528.0" y="112.0" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">#2</text>
  <rect x="330.0" y="232.0" width="46.0" height="24.0" rx="3" fill="#ffedd5" stroke="#1f2937" stroke-width="1.5"/>
  <text x="353.0" y="249.0" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">#3</text>
  <rect x="505.0" y="232.0" width="46.0" height="24.0" rx="3" fill="#ffedd5" stroke="#1f2937" stroke-width="1.5"/>
  <text x="528.0" y="249.0" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">#4</text>
  <text x="420.0" y="325.0" font-size="13" text-anchor="middle" fill="#1f2937">แต่ละแพ็กเก็ตมีส่วนหัว: ที่อยู่ผู้ส่ง ที่อยู่ผู้รับ ลำดับที่ (#1 ถึง #4)</text>
  <text x="805.0" y="240.0" font-size="12" text-anchor="middle" fill="#6b7280">เรียง #1 #2 #3 #4</text>
  <text x="805.0" y="258.0" font-size="12" text-anchor="middle" fill="#6b7280">ประกอบเป็นรูปเดิม</text>
  <text x="75.0" y="240.0" font-size="12" text-anchor="middle" fill="#6b7280">แบ่งรูปเป็น</text>
  <text x="75.0" y="258.0" font-size="12" text-anchor="middle" fill="#6b7280">แพ็กเก็ต #1 ถึง #4</text>
