<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" width="780" height="410" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei','Noto Sans Thai',sans-serif">
<title>ทิศทาง 来 และ 去 เทียบกับตำแหน่งผู้พูด ทั้งเข้าออกห้องและขึ้นลงบันได</title>
<defs><marker id="a1f4e9c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e9c"/></marker><marker id="a2a6a2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a6a2a"/></marker></defs>
<rect x="0" y="0" width="780" height="410" fill="#fff"/>
<text x="390.0" y="30.0" font-size="19" text-anchor="middle" fill="#1a1a1a" font-weight="bold">来 = เข้าหาผู้พูด   去 = ออกห่างจากผู้พูด</text>
<rect x="40.0" y="60.0" width="280.0" height="240.0" rx="4" fill="#fff8e8" stroke="#7a5a00" stroke-width="2.5"/>
<rect x="314.0" y="150.0" width="12.0" height="100.0" rx="0" fill="#fff" stroke="none" stroke-width="0"/>
<text x="180.0" y="86.0" font-size="15" text-anchor="middle" fill="#7a5a00" font-weight="normal">ในห้อง (房间里)</text>
<circle cx="130.0" cy="164.0" r="10.0" fill="#fff" stroke="#b3261e" stroke-width="1.5"/>
<line x1="130.0" y1="174.0" x2="130.0" y2="200.0" stroke="#b3261e" stroke-width="2.5" stroke-linecap="round"/>
<line x1="130.0" y1="200.0" x2="122.0" y2="218.0" stroke="#b3261e" stroke-width="2.5" stroke-linecap="round"/>
<line x1="130.0" y1="200.0" x2="138.0" y2="218.0" stroke="#b3261e" stroke-width="2.5" stroke-linecap="round"/>
<line x1="118.0" y1="186.0" x2="142.0" y2="186.0" stroke="#b3261e" stroke-width="2.5" stroke-linecap="round"/>
<text x="130.0" y="238.0" font-size="14" text-anchor="middle" fill="#b3261e" font-weight="bold">ผู้พูดอยู่ในห้อง</text>
<line x1="470.0" y1="175.0" x2="240.0" y2="175.0" stroke="#2a6a2a" stroke-width="3" stroke-linecap="round" marker-end="url(#a2a6a2a)"/>
<text x="400.0" y="162.0" font-size="22" text-anchor="middle" fill="#2a6a2a" font-weight="bold">进来</text>
<line x1="240.0" y1="225.0" x2="470.0" y2="225.0" stroke="#1f4e9c" stroke-width="3" stroke-linecap="round" marker-end="url(#a1f4e9c)"/>
<text x="400.0" y="256.0" font-size="22" text-anchor="middle" fill="#1f4e9c" font-weight="bold">出去</text>
<text x="180.0" y="330.0" font-size="15" text-anchor="middle" fill="#666" font-weight="normal">ถ้าผู้พูดอยู่นอกห้อง สลับเป็น 进去 / 出来</text>
<line x1="500.0" y1="340.0" x2="770.0" y2="340.0" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
<line x1="690.0" y1="180.0" x2="770.0" y2="180.0" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
<path d="M540 340 L540.0 308.0 L570.0 308.0 L570.0 276.0 L600.0 276.0 L600.0 244.0 L630.0 244.0 L630.0 212.0 L660.0 212.0 L660.0 180.0 L690.0 180.0" stroke="#888" stroke-width="2" fill="none" stroke-linecap="round"/>
<circle cx="735.0" cy="124.0" r="10.0" fill="#fff" stroke="#b3261e" stroke-width="1.5"/>
<line x1="735.0" y1="134.0" x2="735.0" y2="160.0" stroke="#b3261e" stroke-width="2.5" stroke-linecap="round"/>
<line x1="735.0" y1="160.0" x2="727.0" y2="178.0" stroke="#b3261e" stroke-width="2.5" stroke-linecap="round"/>
<line x1="735.0" y1="160.0" x2="743.0" y2="178.0" stroke="#b3261e" stroke-width="2.5" stroke-linecap="round"/>
<line x1="723.0" y1="146.0" x2="747.0" y2="146.0" stroke="#b3261e" stroke-width="2.5" stroke-linecap="round"/>
<text x="712.0" y="90.0" font-size="14" text-anchor="middle" fill="#b3261e" font-weight="bold">ผู้พูดอยู่ชั้นบน</text>
<text x="745.0" y="200.0" font-size="15" text-anchor="middle" fill="#666" font-weight="normal">楼上</text>
<text x="520.0" y="362.0" font-size="15" text-anchor="middle" fill="#666" font-weight="normal">楼下</text>
<line x1="530.2" y1="301.7" x2="640.2" y2="181.7" stroke="#2a6a2a" stroke-width="3" stroke-linecap="round" marker-end="url(#a2a6a2a)"/>
<text x="525.2" y="216.7" font-size="20" text-anchor="end" fill="#2a6a2a" font-weight="bold">上来</text>
<line x1="702.3" y1="230.9" x2="607.3" y2="355.9" stroke="#1f4e9c" stroke-width="3" stroke-linecap="round" marker-end="url(#a1f4e9c)"/>
<text x="724.8" y="323.3" font-size="20" text-anchor="start" fill="#1f4e9c" font-weight="bold">下去</text>
<text x="390.0" y="395.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="normal">ทิศย่อย 上 下 进 出 回 过 起 + 来/去 วางหลังกริยาได้ เช่น 走进来 跑出去 站起来</text>
