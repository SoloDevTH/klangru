    hints:
      - 'แทนค่า $P$, $V$, $n$, $R$ และ $T$ ลงในนิยามของ $Z$'
      - 'ค่า $Z$ น้อยกว่า 1 แสดงว่าแรงดึงดูดระหว่างโมเลกุลมีผลมากกว่าปริมาตรที่โมเลกุลกินที่'
