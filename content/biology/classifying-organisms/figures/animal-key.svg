<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="sans-serif" font-size="14">
<title>กุญแจจำแนกสัตว์มีกระดูกสันหลัง</title>
<rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
<rect x="195.0" y="20" width="270" height="40" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
<text x="330.0" y="45.0" text-anchor="middle" font-size="14" fill="#222">1. มีขนเป็นเส้นหรือไม่</text>
<rect x="30.0" y="102" width="180" height="36" rx="18" fill="#fff8e1" stroke="#f9a825" stroke-width="1.6"/>
<text x="120.0" y="125.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">เลี้ยงลูกด้วยน้ำนม</text>
<line x1="330" y1="60" x2="120" y2="102" stroke="#555" stroke-width="1.6"/>
<text x="211.0" y="81.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">ใช่</text>
<rect x="375.0" y="100" width="250" height="40" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
<text x="500.0" y="125.0" text-anchor="middle" font-size="14" fill="#222">2. มีขนนกหรือไม่</text>
<line x1="330" y1="60" x2="500" y2="100" stroke="#555" stroke-width="1.6"/>
<text x="429.0" y="80.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">ไม่ใช่</text>
<rect x="270.0" y="182" width="120" height="36" rx="18" fill="#fff8e1" stroke="#f9a825" stroke-width="1.6"/>
<text x="330.0" y="205.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">นก</text>
<line x1="500" y1="140" x2="330" y2="182" stroke="#555" stroke-width="1.6"/>
<text x="401.0" y="161.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">ใช่</text>
<rect x="475.0" y="180" width="290" height="40" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
<text x="620.0" y="205.0" text-anchor="middle" font-size="14" fill="#222">3. มีครีบและเหงือกตลอดชีวิตหรือไม่</text>
<line x1="500" y1="140" x2="620" y2="180" stroke="#555" stroke-width="1.6"/>
<text x="574.0" y="160.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">ไม่ใช่</text>
<rect x="380.0" y="262" width="120" height="36" rx="18" fill="#fff8e1" stroke="#f9a825" stroke-width="1.6"/>
<text x="440.0" y="285.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">ปลา</text>
<line x1="620" y1="220" x2="440" y2="262" stroke="#555" stroke-width="1.6"/>
<text x="516.0" y="241.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">ใช่</text>
<rect x="595.0" y="270" width="250" height="40" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
<text x="720.0" y="295.0" text-anchor="middle" font-size="14" fill="#222">4. ผิวหนังแห้งมีเกล็ดหรือไม่</text>
<line x1="620" y1="220" x2="720" y2="270" stroke="#555" stroke-width="1.6"/>
<text x="684.0" y="245.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">ไม่ใช่</text>
<rect x="515.0" y="362" width="170" height="36" rx="18" fill="#fff8e1" stroke="#f9a825" stroke-width="1.6"/>
<text x="600.0" y="385.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">สัตว์เลื้อยคลาน</text>
<line x1="720" y1="310" x2="600" y2="362" stroke="#555" stroke-width="1.6"/>
<text x="646.0" y="336.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">ใช่</text>
<rect x="715.0" y="362" width="170" height="36" rx="18" fill="#fff8e1" stroke="#f9a825" stroke-width="1.6"/>
<text x="800.0" y="385.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">สะเทินน้ำสะเทินบก</text>
<line x1="720" y1="310" x2="800" y2="362" stroke="#555" stroke-width="1.6"/>
<text x="774.0" y="336.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">ไม่ใช่</text>
</svg>