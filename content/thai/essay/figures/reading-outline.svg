<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="'Sarabun','Noto Sans Thai','Noto Sans Thai UI','Leelawadee UI','Tahoma','Loma',sans-serif">
<title>แผนภาพโครงเรื่องที่ยังขาดหนึ่งหัวข้อ</title>
<defs></defs>
<rect x="0" y="0" width="860" height="330" fill="#fff"/>
<text x="20.0" y="34.0" font-size="20" text-anchor="start" fill="#1f5fbf" font-weight="bold">แผนภาพโครงเรื่อง: การอ่านหนังสือทุกวัน (ฉบับร่าง)</text>
<rect x="40.0" y="64.0" width="780.0" height="34.0" rx="6" fill="#e3f2fd" stroke="#607d8b" stroke-width="1.6"/>
<text x="54.0" y="88.0" font-size="17" text-anchor="start" fill="#111" font-weight="bold">1 คำนำ: ชวนสังเกตว่าวันหนึ่งเราใช้เวลากับหน้าจอนานเท่าไร</text>
<rect x="40.0" y="106.0" width="780.0" height="34.0" rx="6" fill="#e3f2fd" stroke="#607d8b" stroke-width="1.6"/>
<text x="54.0" y="130.0" font-size="17" text-anchor="start" fill="#111" font-weight="bold">2 เนื้อเรื่อง</text>
<rect x="90.0" y="148.0" width="730.0" height="34.0" rx="6" fill="#f1f8e9" stroke="#607d8b" stroke-width="1.6"/>
<text x="104.0" y="172.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">2.1 การอ่านเพิ่มความรู้และคำศัพท์</text>
<rect x="90.0" y="190.0" width="730.0" height="34.0" rx="6" fill="#fff" stroke="#607d8b" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="104.0" y="214.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">2.2 ?</text>
<rect x="90.0" y="232.0" width="730.0" height="34.0" rx="6" fill="#f1f8e9" stroke="#607d8b" stroke-width="1.6"/>
<text x="104.0" y="256.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">2.3 วิธีสร้างนิสัย: อ่านวันละ 15 นาทีก่อนนอน</text>
<rect x="40.0" y="274.0" width="780.0" height="34.0" rx="6" fill="#e3f2fd" stroke="#607d8b" stroke-width="1.6"/>
<text x="54.0" y="298.0" font-size="17" text-anchor="start" fill="#111" font-weight="bold">3 สรุป: ทบทวนประโยชน์ และชวนเริ่มอ่านคืนนี้</text>
</svg>
