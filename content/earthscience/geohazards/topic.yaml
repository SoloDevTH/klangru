id: earthscience.geology.geohazards
subject: earthscience
title: { th: ภูเขาไฟ แผ่นดินไหว และสึนามิ, en: "Volcanoes, earthquakes and tsunamis" }
summary: สาเหตุและกระบวนการเกิดภูเขาไฟ แผ่นดินไหว และสึนามิ ขนาดและความรุนแรง พื้นที่เสี่ยงในไทยและโลก ระบบเฝ้าระวังและเตือนภัย และการปฏิบัติตนให้ปลอดภัย
difficulty: 4.5
minutes: 40
prerequisites: [earthscience.geology.plate-tectonics]
encompasses:
  - { id: earthscience.geology.plate-tectonics, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ภูเขาไฟรูปโล่และภูเขาไฟสลับชั้น
    src: volcano-types.svg
    alt: "ภาพตัดขวางภูเขาไฟสองแบบ ด้านซ้ายภูเขาไฟรูปโล่ กว้างและลาดค่อย ๆ มีลาวาสีส้มไหลลงลาดเขา คำอธิบายว่า ลาวาบะซอลต์ ซิลิกาน้อย หนืดน้อย ไหลง่าย แก๊สออกง่าย ปะทุไม่รุนแรง เช่น เมานาโลอา ฮาวาย ด้านขวาภูเขาไฟสลับชั้น สูงชัน มีชั้นลาวาสลับเถ้า มีเมฆเถ้าพุ่งออกจากปล่อง คำอธิบายว่า แมกมาซิลิกามาก หนืดมาก แก๊สติดอยู่ ปะทุรุนแรง เช่น ฟูจิ ปินาตูโบ ทั้งสองลูกมีปล่องเชื่อมกับแหล่งแมกมาใต้ดิน"
    caption: "ความหนืดและแก๊สในแมกมากำหนดความรุนแรงของการปะทุและรูปร่างของภูเขาไฟ (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: worked-example
    title: หาระยะทางถึงจุดเกิดแผ่นดินไหวจากสามสถานี
    problem: "สถานี ก บันทึกช่วงห่างระหว่างคลื่น P กับ S ได้ 10 วินาที สถานี ข 20 วินาที สถานี ค 15 วินาที ใช้ระยะทาง (km) ≈ 8 × ช่วงห่าง (วินาที) หาระยะจากแต่ละสถานี และบอกวิธีหาจุดเหนือศูนย์เกิด"
    steps:
      - text: "สถานี ก: $8 \\times 10 = 80$ km"
      - text: "สถานี ข: $8 \\times 20 = 160$ km สถานี ค: $8 \\times 15 = 120$ km"
        why: "คลื่น P เร็วกว่าคลื่น S ยิ่งไกล ช่วงห่างระหว่างการมาถึงยิ่งยาว"
      - text: "บนแผนที่ วาดวงกลมรอบแต่ละสถานีด้วยรัศมีตามระยะที่หาได้ (ใช้มาตราส่วนของแผนที่)"
      - text: "วงกลมสองวงตัดกันได้สองจุด วงที่สามบอกว่าจุดใดถูก จุดที่ทั้งสามวงตัดกันคือจุดเหนือศูนย์เกิด"
    answer: "80 km, 160 km และ 120 km จุดเหนือศูนย์เกิดอยู่ที่จุดตัดของวงกลมทั้งสาม"
  - { type: check, problem: earthscience.geology.geohazards.p007, prompt: "ใช้ช่วงห่างระหว่าง P กับ S" }
  - type: worked-example
    title: เทียบพลังงานของแผ่นดินไหวสองครั้ง
    problem: "แผ่นดินไหวขนาด 6.1 กับขนาด 7.7 ครั้งใหญ่ปล่อยพลังงานมากกว่ากี่เท่า"
    steps:
      - text: "ผลต่างของขนาด $7.7 - 6.1 = 1.6$"
      - text: "ขนาดเพิ่ม 1 พลังงานเพิ่ม $10^{1.5}$ เท่า ขนาดเพิ่ม 1.6 พลังงานเพิ่ม $10^{1.5 \\times 1.6} = 10^{2.4}$ เท่า"
        why: "มาตราขนาดเป็นมาตราลอการิทึม ผลต่างจึงกลายเป็นเลขชี้กำลัง"
      - text: "$10^{2.4} \\approx 251$"
    answer: "ประมาณ 251 เท่า"
  - type: figure
    title: คลื่นสึนามิจากทะเลลึกถึงชายฝั่ง
    src: tsunami.svg
    alt: "ภาพตัดขวางทะเล ด้านซ้ายเป็นทะเลลึกราว 4,000 m มีแผ่นดินไหวยกพื้นทะเล คลื่นบนผิวน้ำเตี้ยและยาว คำอธิบายว่าคลื่นสูงไม่ถึง 1 m แต่ยาวหลายร้อยกิโลเมตร เร็วราว 700 km/h ลูกศรชี้ไปทางขวาเข้าหาฝั่ง พื้นทะเลตื้นขึ้น คลื่นด้านขวาสูงชันมาก คำอธิบายว่าใกล้ฝั่ง น้ำตื้น คลื่นช้าลงและสูงขึ้นมาก"
    caption: "อัตราเร็วของสึนามิประมาณ v = √(gd) จึงช้าลงในน้ำตื้น (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - { type: check, problem: earthscience.geology.geohazards.p003, prompt: "สัญญาณเตือนตามธรรมชาติ" }
  - type: interactive
    title: อัตราเร็วของสึนามิกับความลึกของน้ำ
    caption: "เส้นคือ $v = 3.6\\sqrt{9.8x}$ กิโลเมตรต่อชั่วโมง เมื่อ $x$ คือความลึกเป็นเมตร อ่านค่าที่ความลึก 4,000 m กับ 50 m แล้วเทียบกัน คลื่นที่ช้าลงใกล้ฝั่งจะถูกคลื่นด้านหลังไล่ทันจนสูงขึ้น"
    widget:
      kind: function-plot
      functions: ["3.6\\sqrt{9.8x}"]
      x: [0, 5000]
      y: [0, 900]
glossary:
  - { term: แมกมา, definition: "หินหลอมเหลวใต้ผิวโลก เมื่อไหลออกมาบนผิวโลกเรียกว่าลาวา" }
  - { term: ภูเขาไฟรูปโล่, definition: "ภูเขาไฟกว้าง ลาดค่อย ๆ เกิดจากลาวาบะซอลต์ที่หนืดน้อย ปะทุไม่รุนแรง" }
  - { term: ภูเขาไฟสลับชั้น, definition: "ภูเขาไฟลาดชัน มีชั้นลาวาสลับเถ้า แมกมาหนืดมาก ปะทุรุนแรง" }
  - { term: ขนาดของแผ่นดินไหว, definition: "ค่าที่บอกพลังงานที่ปล่อยออกมา มีค่าเดียวต่อครั้ง ขนาดเพิ่ม 1 พลังงานเพิ่มราว 32 เท่า" }
  - { term: ความรุนแรงของแผ่นดินไหว, definition: "ผลที่คนรู้สึกและความเสียหายในแต่ละที่ วัดด้วยมาตราเมร์คัลลี I ถึง XII" }
  - { term: สึนามิ, definition: "คลื่นน้ำขนาดใหญ่ที่เกิดจากพื้นทะเลเคลื่อนที่ฉับพลัน เช่น แผ่นดินไหวใต้ทะเล" }
  - { term: ลาฮาร์, definition: "โคลนที่เกิดจากเถ้าภูเขาไฟผสมน้ำ ไหลแรงตามหุบเขา" }
flashcards:
  - { front: "อะไรทำให้ภูเขาไฟปะทุรุนแรง", back: "แมกมาที่มีซิลิกามาก หนืดมาก และมีแก๊สมาก แก๊สออกยากจึงสะสมความดัน" }
  - { front: "ขนาดกับความรุนแรงต่างกันอย่างไร", back: "ขนาดบอกพลังงาน มีค่าเดียวต่อครั้ง ความรุนแรงบอกผลในแต่ละที่ ขึ้นกับระยะทาง ดิน และอาคาร" }
  - { front: "ปฏิบัติตนขณะแผ่นดินไหว", back: "หมอบ ป้อง เกาะ ใต้โต๊ะที่แข็งแรง ห่างหน้าต่าง หยุดสั่นแล้วลงบันไดไปที่โล่ง" }
  - { front: "สัญญาณสึนามิและสิ่งที่ต้องทำ", back: "แผ่นดินไหวแรง น้ำทะเลลดเร็วผิดปกติ ไซเรน ให้หนีขึ้นที่สูงทันที สายด่วน ปภ. 1784" }
