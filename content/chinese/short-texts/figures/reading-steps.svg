<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei','Noto Sans Thai',sans-serif">
<title>ข้อความวีแชตสั้นที่ขีดเส้นคำตอบของ ใคร เมื่อไร ที่ไหน ทำอะไร</title>
<defs></defs>
<rect x="0" y="0" width="760" height="450" fill="#fff"/>
<text x="380.0" y="30.0" font-size="19" text-anchor="middle" fill="#1a1a1a" font-weight="bold">อ่านจับใจความ: หา 谁 · 什么时候 · 在哪儿 · 做什么</text>
<rect x="40.0" y="50.0" width="420.0" height="360.0" rx="16" fill="#eef3ee" stroke="#9ab59a" stroke-width="1.5"/>
<text x="250.0" y="78.0" font-size="16" text-anchor="middle" fill="#666" font-weight="normal">微信  ·  王老师</text>
<rect x="60.0" y="96.0" width="380.0" height="234.0" rx="12" fill="#fff" stroke="#bbb" stroke-width="1"/>
<text x="76.0" y="130.0" font-size="19" text-anchor="start" fill="#1a1a1a" font-weight="normal">同学们：</text>
<text x="76.0" y="164.0" font-size="19" text-anchor="start" fill="#1a1a1a" font-weight="normal">明天上午九点，</text>
<line x1="76.0" y1="170.0" x2="209.0" y2="170.0" stroke="#7a5a00" stroke-width="3" stroke-linecap="round"/>
<line x1="217.0" y1="158.0" x2="486.0" y2="158.0" stroke="#7a5a00" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4,3"/>
<rect x="490.0" y="142.0" width="140.0" height="30.0" rx="8" fill="#fff" stroke="#7a5a00" stroke-width="1.8"/>
<text x="560.0" y="163.0" font-size="15" text-anchor="middle" fill="#7a5a00" font-weight="bold">什么时候</text>
<text x="76.0" y="198.0" font-size="19" text-anchor="start" fill="#1a1a1a" font-weight="normal">我们在学校门口集合，</text>
<line x1="76.0" y1="204.0" x2="266.0" y2="204.0" stroke="#2a6a2a" stroke-width="3" stroke-linecap="round"/>
<line x1="274.0" y1="192.0" x2="486.0" y2="192.0" stroke="#2a6a2a" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4,3"/>
<rect x="490.0" y="176.0" width="140.0" height="30.0" rx="8" fill="#fff" stroke="#2a6a2a" stroke-width="1.8"/>
<text x="560.0" y="197.0" font-size="15" text-anchor="middle" fill="#2a6a2a" font-weight="bold">在哪儿</text>
<text x="76.0" y="232.0" font-size="19" text-anchor="start" fill="#1a1a1a" font-weight="normal">一起坐车去动物园。</text>
<line x1="76.0" y1="238.0" x2="247.0" y2="238.0" stroke="#b3261e" stroke-width="3" stroke-linecap="round"/>
<line x1="255.0" y1="226.0" x2="486.0" y2="226.0" stroke="#b3261e" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4,3"/>
<rect x="490.0" y="210.0" width="140.0" height="30.0" rx="8" fill="#fff" stroke="#b3261e" stroke-width="1.8"/>
<text x="560.0" y="231.0" font-size="15" text-anchor="middle" fill="#b3261e" font-weight="bold">做什么</text>
<text x="76.0" y="266.0" font-size="19" text-anchor="start" fill="#1a1a1a" font-weight="normal">请带水和帽子。</text>
<line x1="76.0" y1="272.0" x2="209.0" y2="272.0" stroke="#5b3a8c" stroke-width="3" stroke-linecap="round"/>
<line x1="217.0" y1="260.0" x2="486.0" y2="260.0" stroke="#5b3a8c" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4,3"/>
<rect x="490.0" y="244.0" width="140.0" height="30.0" rx="8" fill="#fff" stroke="#5b3a8c" stroke-width="1.8"/>
<text x="560.0" y="265.0" font-size="15" text-anchor="middle" fill="#5b3a8c" font-weight="bold">ต้องเตรียม</text>
<text x="76.0" y="300.0" font-size="19" text-anchor="start" fill="#1a1a1a" font-weight="normal">— 王老师</text>
<line x1="76.0" y1="306.0" x2="171.0" y2="306.0" stroke="#1f4e9c" stroke-width="3" stroke-linecap="round"/>
<line x1="179.0" y1="294.0" x2="486.0" y2="294.0" stroke="#1f4e9c" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4,3"/>
<rect x="490.0" y="278.0" width="140.0" height="30.0" rx="8" fill="#fff" stroke="#1f4e9c" stroke-width="1.8"/>
<text x="560.0" y="299.0" font-size="15" text-anchor="middle" fill="#1f4e9c" font-weight="bold">谁</text>
<text x="250.0" y="356.0" font-size="15" text-anchor="middle" fill="#666" font-weight="normal">动物园 dòngwùyuán = สวนสัตว์</text>
<text x="250.0" y="380.0" font-size="15" text-anchor="middle" fill="#666" font-weight="normal">帽子 màozi = หมวก</text>
<rect x="480.0" y="312.0" width="265.0" height="128.0" rx="10" fill="#fbf0c0" stroke="#7a5a00" stroke-width="1.5"/>
<text x="612.0" y="336.0" font-size="15" text-anchor="middle" fill="#7a5a00" font-weight="bold">ใจความสำคัญ:</text>
<text x="612.0" y="360.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="normal">พรุ่งนี้ 9 โมงเช้า</text>
<text x="612.0" y="384.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="normal">รวมที่หน้าประตูโรงเรียน</text>
<text x="612.0" y="408.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="normal">นั่งรถไปสวนสัตว์ด้วยกัน</text>
<text x="612.0" y="432.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="normal">(เตรียมน้ำและหมวก)</text>
</svg>
