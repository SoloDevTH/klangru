    solution: "$k = \\dfrac{\\mathbf{x}^{T}\\mathbf{F}}{\\mathbf{x}^{T}\\mathbf{x}} = \\dfrac{59.7}{30} = 1.99$ นิวตันต่อเซนติเมตร เป็นการฉาย $\\mathbf{F}$ ลงบนเส้นในทิศ $\\mathbf{x}$"
