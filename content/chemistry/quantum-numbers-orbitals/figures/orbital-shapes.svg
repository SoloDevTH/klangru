<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
<title>ภาพตัดรูปร่างของออร์บิทัล s ทรงกลม p สองกลีบที่มีเครื่องหมายตรงข้ามกัน และ d สี่กลีบ พร้อมระนาบโหนด</title>
<rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
<defs><radialGradient id="gp" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#e76f51" stop-opacity="0.9"/><stop offset="100%" stop-color="#e76f51" stop-opacity="0.35"/></radialGradient><radialGradient id="gm" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#2a9d8f" stop-opacity="0.9"/><stop offset="100%" stop-color="#2a9d8f" stop-opacity="0.35"/></radialGradient></defs>
<circle cx="130" cy="115" r="70" fill="url(#gp)" stroke="#e76f51" stroke-width="1.2"/>
<circle cx="130" cy="115" r="4" fill="#222"/>
<text x="130" y="232" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d3557" font-family="sans-serif">s (l = 0)</text>
<text x="130" y="252" font-size="13" font-weight="normal" text-anchor="middle" fill="#333" font-family="sans-serif">ทรงกลม 1 ออร์บิทัล</text>
<ellipse cx="380" cy="71" rx="40" ry="42" fill="url(#gp)" stroke="#e76f51" stroke-width="1.2"/>
<ellipse cx="380" cy="159" rx="40" ry="42" fill="url(#gm)" stroke="#2a9d8f" stroke-width="1.2"/>
<line x1="270" y1="115" x2="490" y2="115" stroke="#444" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="380" cy="115" r="4" fill="#222"/>
<text x="360" y="57" font-size="22" font-weight="bold" text-anchor="middle" fill="#fff" font-family="sans-serif">+</text>
<text x="360" y="177" font-size="22" font-weight="bold" text-anchor="middle" fill="#fff" font-family="sans-serif">−</text>
<text x="380" y="232" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d3557" font-family="sans-serif">p (l = 1)</text>
<text x="380" y="252" font-size="13" font-weight="normal" text-anchor="middle" fill="#333" font-family="sans-serif">3 ออร์บิทัล ตั้งฉากกัน</text>
<ellipse cx="588" cy="73" rx="33" ry="33" fill="#e76f51" fill-opacity="0.55" stroke="#e76f51" stroke-width="1.2"/>
<ellipse cx="672" cy="73" rx="33" ry="33" fill="#2a9d8f" fill-opacity="0.55" stroke="#2a9d8f" stroke-width="1.2"/>
<ellipse cx="588" cy="157" rx="33" ry="33" fill="#2a9d8f" fill-opacity="0.55" stroke="#2a9d8f" stroke-width="1.2"/>
<ellipse cx="672" cy="157" rx="33" ry="33" fill="#e76f51" fill-opacity="0.55" stroke="#e76f51" stroke-width="1.2"/>
<line x1="530" y1="115" x2="730" y2="115" stroke="#444" stroke-width="1.3" stroke-dasharray="6 4"/>
<line x1="630" y1="20" x2="630" y2="210" stroke="#444" stroke-width="1.3" stroke-dasharray="6 4"/>
<circle cx="630" cy="115" r="4" fill="#222"/>
<text x="630" y="232" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d3557" font-family="sans-serif">d (l = 2)</text>
<text x="630" y="252" font-size="13" font-weight="normal" text-anchor="middle" fill="#333" font-family="sans-serif">5 ออร์บิทัล มีระนาบโหนดสองระนาบ</text>
<text x="380.0" y="292" font-size="12" text-anchor="middle" fill="#666" font-family="Loma, sans-serif">ภาพตัดในระนาบ สีแสดงเครื่องหมายของฟังก์ชันคลื่น (ส้มและเขียวต่างกัน) เส้นประคือระนาบโหนด</text>
</svg>
