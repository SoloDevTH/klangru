      - { id: a, text: "ไม่ใช่ความผิดของเด็กที่ถูกกระทำ ไม่ว่าเด็กจะไปที่ไหนหรือแต่งตัวอย่างไร ความผิดเป็นของคนที่ทำ", correct: true }
