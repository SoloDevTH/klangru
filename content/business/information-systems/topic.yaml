id: business.accounting.information-systems
subject: business
title: { th: "ระบบสารสนเทศทางการบัญชีและสเปรดชีต", en: "Accounting information systems and spreadsheets" }
summary: "ส่วนประกอบและการไหลของข้อมูลบัญชี วงจรธุรกิจในโปรแกรมบัญชี การทำสมุดรายวันด้วยสเปรดชีต การควบคุมทั่วไปและการควบคุมระบบงาน และการใช้ข้อมูลช่วยตัดสินใจ"
difficulty: 5
minutes: 40
prerequisites: [business.accounting.double-entry, business.accounting.financial-statements]
encompasses:
  - { id: business.accounting.double-entry, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: ais-flow.svg
    alt: "แผนภาพการไหลของข้อมูลสามกล่อง นำเข้า (ใบสั่งซื้อ ใบกำกับภาษี สลิปโอนเงิน) ลูกศรไปประมวลผล (บันทึกรายการ ผ่านบัญชีแยกประเภท ปรับปรุงและปิดบัญชี) ลูกศรไปแสดงผล (งบทดลอง งบการเงิน รายงานลูกหนี้ตามอายุ ยอดขายตามสินค้า) ใต้กล่องประมวลผลมีที่เก็บข้อมูลหลักและแฟ้มรายการ ใต้แต่ละกล่องมีจุดควบคุม ควบคุมการนำเข้า (ตรวจรูปแบบ ขอบเขต ยอดรวมควบคุม) ควบคุมการประมวลผล (เทียบยอด จับคู่เอกสาร) ควบคุมผลลัพธ์ (กระทบยอด จำกัดผู้รับ) กรอบเส้นประรอบทั้งหมดคือการควบคุมทั่วไป ได้แก่ สิทธิผู้ใช้ แบ่งแยกหน้าที่ สำรองข้อมูล ควบคุมการแก้โปรแกรม"
    caption: "ข้อมูลไหลจากนำเข้าสู่ผลลัพธ์ โดยมีการควบคุมระบบงานในแต่ละขั้น และการควบคุมทั่วไปครอบทั้งระบบ"
  - { type: check, problem: business.accounting.information-systems.p002, prompt: "แยกการควบคุมทั่วไปออกจากการควบคุมระบบงาน" }
  - type: worked-example
    title: "สร้างงบทดลองอย่างง่ายจากแผ่นงานสมุดรายวัน"
    problem: "แผ่นงานสมุดรายวันของร้าน (สมมติ) มีรายการ: ลงทุนเงินสด $50{,}000$ (Dr. 101 / Cr. 301) จ่ายค่าเช่า $8{,}000$ (Dr. 501 / Cr. 101) ขายเงินสด $12{,}500$ (Dr. 101 / Cr. 401) ขายเชื่อ $9{,}000$ (Dr. 102 / Cr. 401) วางสูตรอย่างไรให้ได้ยอดคงเหลือแต่ละบัญชีและตรวจความสมดุล"
    steps:
      - { text: "แผ่นงานงบทดลอง คอลัมน์ A ใส่รหัสบัญชี คอลัมน์ B ใช้ `=VLOOKUP(A2,ผังบัญชี!$A$2:$B$9,2,FALSE)` ดึงชื่อบัญชี", why: "ใส่ $ ให้ช่วงผังบัญชีคงที่เมื่อคัดลอกสูตรลงไปแถวอื่น" }
      - { text: "คอลัมน์ C (ยอดคงเหลือ) ใช้ `=SUMIF(สมุดรายวัน!$C$2:$C$9,A2,สมุดรายวัน!$D$2:$D$9)-SUMIF(สมุดรายวัน!$C$2:$C$9,A2,สมุดรายวัน!$E$2:$E$9)`" }
      - { text: "ผล: 101 เงินสด $54{,}500$ · 102 ลูกหนี้ $9{,}000$ · 501 ค่าเช่า $8{,}000$ · 301 ทุน $-50{,}000$ · 401 รายได้ $-21{,}500$", why: "ค่าติดลบคือยอดคงเหลือด้านเครดิต" }
      - { text: "ตรวจ: `=SUM(C2:C6)` ต้องได้ $0$ ($54{,}500 + 9{,}000 + 8{,}000 - 50{,}000 - 21{,}500 = 0$) แสดงว่าเดบิตเท่ากับเครดิต" }
    answer: "ยอดเดบิตรวม $71{,}500$ เท่ากับยอดเครดิตรวม $71{,}500$ บาท"
  - type: worked-example
    title: "ออกแบบการควบคุมให้งานจ่ายเงิน"
    problem: "ร้านค้าส่ง (สมมติ) ใช้โปรแกรมบัญชีบนคลาวด์ จ่ายเงินผู้ขายเดือนละหลายสิบราย เสนอการควบคุมทั่วไปและการควบคุมระบบงานสำหรับงานจ่ายเงิน"
    steps:
      - { text: "ระบุความเสี่ยง: จ่ายซ้ำ จ่ายผิดจำนวน จ่ายให้ผู้ขายปลอม ข้อมูลสูญหาย" }
      - { text: "การควบคุมทั่วไป: รหัสผู้ใช้รายบุคคล แยกสิทธิ (คนบันทึก ≠ คนอนุมัติ ≠ คนโอนเงิน) สำรองข้อมูล", why: "แบ่งแยกหน้าที่ป้องกันไม่ให้คนเดียวทำรายการปลอมได้ครบวงจร" }
      - { text: "ควบคุมการนำเข้า: เลือกผู้ขายจากแฟ้มข้อมูลหลักเท่านั้น ตรวจเลขที่ใบแจ้งหนี้ซ้ำ ยอดต้องมากกว่าศูนย์" }
      - { text: "ควบคุมการประมวลผล: จ่ายได้เมื่อใบสั่งซื้อ ใบรับของ และใบแจ้งหนี้ตรงกัน (จับคู่สามทาง)" }
      - { text: "ควบคุมผลลัพธ์: กระทบยอดเงินฝากกับรายการเดินบัญชีทุกเดือน ผู้จัดการตรวจรายงานการจ่ายเงิน" }
    answer: "ใช้ทั้งการควบคุมทั่วไปและการควบคุมระบบงานในทุกขั้นของงานจ่ายเงิน"
  - { type: check, problem: business.accounting.information-systems.p006, prompt: "ลองคำนวณผลของ SUMIF จากแผ่นงาน" }
glossary:
  - { term: "ระบบสารสนเทศทางการบัญชี (AIS)", definition: "ระบบที่รวบรวม บันทึก ประมวลผล และรายงานข้อมูลทางการเงิน ประกอบด้วยคน วิธีปฏิบัติ ข้อมูล ซอฟต์แวร์ โครงสร้างไอที และการควบคุมภายใน" }
  - { term: "แฟ้มข้อมูลหลัก", definition: "ข้อมูลที่เปลี่ยนไม่บ่อยและใช้อ้างอิง เช่น ผังบัญชี รายชื่อลูกค้า รายการสินค้า" }
  - { term: "การควบคุมทั่วไป", definition: "การควบคุมสภาพแวดล้อมของระบบทั้งหมด เช่น สิทธิผู้ใช้ การแบ่งแยกหน้าที่ การสำรองข้อมูล การควบคุมการแก้ไขโปรแกรม" }
  - { term: "การควบคุมระบบงาน", definition: "การควบคุมที่ฝังในงานแต่ละงาน แบ่งเป็นการควบคุมการนำเข้า การประมวลผล และผลลัพธ์" }
  - { term: "ยอดรวมควบคุม", definition: "ผลรวมจำนวนเงินของเอกสารทั้งชุดที่คำนวณไว้ก่อน ใช้เทียบกับยอดที่บันทึกเพื่อหาการตกหล่นหรือพิมพ์ผิด" }
  - { term: "หลักตรวจสอบ (check digit)", definition: "ตัวเลขท้ายรหัสที่คำนวณจากหลักอื่น ใช้จับการพิมพ์รหัสผิดหรือสลับหลัก" }
  - { term: "การแบ่งแยกหน้าที่", definition: "การให้คนละคนทำหน้าที่อนุมัติ บันทึกบัญชี และดูแลทรัพย์สิน เพื่อป้องกันการทุจริต" }
flashcards:
  - { front: "ยอดคงเหลือบัญชีด้วยสเปรดชีต", back: "=SUMIF(รหัส,101,เดบิต) − SUMIF(รหัส,101,เครดิต)" }
  - { front: "ดึงชื่อบัญชีจากรหัส", back: "=VLOOKUP(รหัส, ช่วงผังบัญชี $A$2:$B$9, 2, FALSE)" }
  - { front: "การควบคุมทั่วไป vs การควบคุมระบบงาน", back: "ทั่วไป: ทั้งระบบ (สิทธิผู้ใช้ แบ่งแยกหน้าที่ สำรองข้อมูล) · ระบบงาน: ในแต่ละงาน (นำเข้า ประมวลผล ผลลัพธ์)" }
  - { front: "การควบคุมการนำเข้าที่พบบ่อย", back: "ตรวจรูปแบบ · ตรวจขอบเขต · ตรวจความครบถ้วน · หลักตรวจสอบ · ยอดรวมควบคุม · เอกสารเรียงเลขที่" }
