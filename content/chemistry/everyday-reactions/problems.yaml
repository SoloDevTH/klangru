problems:
  - id: chemistry.reactions.everyday-reactions.p001
    topics: [chemistry.reactions.everyday-reactions]
    difficulty: 1
    type: mcq
    stem: "เหล็กจะเกิดสนิมได้ต้องสัมผัสกับสิ่งใด"
    choices:
      - { id: a, text: "ทั้งออกซิเจนและน้ำ", correct: true, feedback: "ถูก ขาดอย่างใดอย่างหนึ่งสนิมจะไม่เกิด" }
      - { id: b, text: "น้ำอย่างเดียว", feedback: "ตะปูในน้ำต้มเดือดที่มีน้ำมันปิดผิวไม่เกิดสนิม เพราะแทบไม่มีออกซิเจน" }
      - { id: c, text: "อากาศอย่างเดียว", feedback: "ตะปูในอากาศแห้งไม่เกิดสนิม ต้องมีน้ำด้วย" }
      - { id: d, text: "แสงแดด", feedback: "แสงแดดไม่จำเป็น ตะปูในที่มืดที่มีน้ำและอากาศก็เกิดสนิม" }
    hints:
      - "นึกถึงการทดลองตะปู 3 หลอด"
      - "หลอดที่ขาดน้ำและหลอดที่ขาดออกซิเจนเกิดสนิมหรือไม่"
    solution: "สนิมเกิดเมื่อเหล็กสัมผัส **ทั้งออกซิเจนและน้ำ**: เหล็ก + ออกซิเจน + น้ำ → สนิมเหล็ก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.everyday-reactions.p002
    topics: [chemistry.reactions.everyday-reactions]
    difficulty: 2
    type: match
    stem: "จับคู่ปฏิกิริยากับผลิตภัณฑ์ที่ได้"
    pairs:
      - { left: "กรด + โลหะ (เช่น แมกนีเซียม)", right: "เกลือ + แก๊สไฮโดรเจน" }
      - { left: "กรด + เบส", right: "เกลือ + น้ำ" }
      - { left: "กรด + แคลเซียมคาร์บอเนต", right: "เกลือ + น้ำ + แก๊สคาร์บอนไดออกไซด์" }
      - { left: "การเผาไหม้สมบูรณ์ของแก๊สหุงต้ม", right: "แก๊สคาร์บอนไดออกไซด์ + น้ำ" }
      - { left: "การสังเคราะห์ด้วยแสง", right: "น้ำตาลกลูโคส + ออกซิเจน" }
    hints:
      - "ปฏิกิริยาใดให้แก๊สไฮโดรเจน และปฏิกิริยาใดให้คาร์บอนไดออกไซด์"
      - "คาร์บอเนตมีคาร์บอนและออกซิเจน จึงให้แก๊สคาร์บอนไดออกไซด์"
    solution: "กรด + โลหะ → เกลือ + H₂ · กรด + เบส → เกลือ + น้ำ · กรด + คาร์บอเนต → เกลือ + น้ำ + CO₂ · การเผาไหม้สมบูรณ์ → CO₂ + น้ำ · การสังเคราะห์ด้วยแสง → กลูโคส + O₂"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.everyday-reactions.p003
    topics: [chemistry.reactions.everyday-reactions]
    difficulty: 2
    type: mcq
    stem: "คุณยายผสมปูนขาวกับขมิ้นทำปูนแดง ขมิ้นสีเหลืองกลายเป็นสีแดงส้ม เพราะเหตุใด"
    choices:
      - { id: a, text: "ปูนขาวเป็นเบส สารสีในขมิ้นเปลี่ยนเป็นสีแดงในเบส", correct: true, feedback: "ถูก สารสีในขมิ้นเปลี่ยนสีตามความเป็นกรด-เบส" }
      - { id: b, text: "ปูนขาวเป็นกรด จึงกัดขมิ้นให้เป็นสีแดง", feedback: "ปูนขาว (แคลเซียมไฮดรอกไซด์) เป็นเบส ไม่ใช่กรด" }
      - { id: c, text: "ขมิ้นเกิดสนิมเพราะสัมผัสอากาศ", feedback: "สนิมเกิดกับเหล็ก ขมิ้นไม่มีเหล็ก" }
      - { id: d, text: "สีแดงมาจากการเผาไหม้ของขมิ้น", feedback: "ไม่มีการเผา การเปลี่ยนสีเกิดทันทีเมื่อผสม" }
    hints:
      - "ปูนขาวเป็นกรดหรือเบส"
      - "สารบางชนิดเปลี่ยนสีได้ในกรดและเบส"
    solution: "ปูนขาวคือแคลเซียมไฮดรอกไซด์ซึ่ง **เป็นเบส** สารสีในขมิ้นเปลี่ยนจากเหลืองเป็นแดงส้มในเบส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.everyday-reactions.p004
    topics: [chemistry.reactions.everyday-reactions]
    difficulty: 2
    type: text
    stem: "ใส่ลวดแมกนีเซียมในกรดไฮโดรคลอริกเจือจาง เกิดฟองแก๊ส เมื่อจ่อก้านไม้ติดไฟที่ปากหลอดมีเสียงดังป๊อก แก๊สนี้คือแก๊สอะไร"
    accepted: ["ไฮโดรเจน", "แก๊สไฮโดรเจน", "ก๊าซไฮโดรเจน", "H2", "H₂", "hydrogen"]
    misconceptions:
      - { match: "ออกซิเจน", feedback: "ออกซิเจนทำให้ก้านไม้ที่เป็นถ่านแดงลุกเป็นไฟ ไม่ใช่เสียงป๊อก" }
      - { match: "คาร์บอนไดออกไซด์", feedback: "คาร์บอนไดออกไซด์เกิดจากกรดกับคาร์บอเนต และทำให้ไฟดับ" }
    hints:
      - "กรด + โลหะ → เกลือ + แก๊สอะไร"
      - "แก๊สที่ติดไฟพร้อมเสียงป๊อก"
    solution: "กรด + โลหะ → เกลือ + **แก๊สไฮโดรเจน** แก๊สไฮโดรเจนลุกไหม้พร้อมเสียงป๊อก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.everyday-reactions.p005
    topics: [chemistry.reactions.everyday-reactions]
    difficulty: 3
    type: mcq
    stem: "นักเรียนวางตะปูเหล็กชนิดเดียวกันใน 4 หลอดดังภาพ ทิ้งไว้ 1 สัปดาห์ หลอดใดน่าจะเกิดสนิมมากที่สุด"
    figure:
      src: p-rust-setups.svg
      alt: "หลอดทดลอง 4 หลอด หลอด 1 ตะปูแช่น้ำกลั่นครึ่งหลอด เปิดฝา หลอด 2 ตะปูแช่น้ำเกลือครึ่งหลอด เปิดฝา หลอด 3 น้ำมันพืชท่วมตะปูทั้งตัว หลอด 4 ปิดจุก ตะปูแขวนในอากาศแห้ง มีสารดูดความชื้นที่ก้นหลอด"
    choices:
      - { id: a, text: "หลอด 2", correct: true, feedback: "ถูก มีทั้งน้ำและออกซิเจน และเกลือทำให้สนิมเกิดเร็วขึ้น" }
      - { id: b, text: "หลอด 1", feedback: "หลอด 1 เกิดสนิมได้ แต่ช้ากว่าหลอดที่มีเกลือ" }
      - { id: c, text: "หลอด 3", feedback: "น้ำมันกันน้ำและอากาศไม่ให้สัมผัสเหล็ก จึงแทบไม่เกิดสนิม" }
      - { id: d, text: "หลอด 4", feedback: "อากาศแห้งไม่มีน้ำ สนิมจึงไม่เกิด" }
    hints:
      - "ตัดหลอดที่ขาดน้ำหรือขาดออกซิเจนออกก่อน"
      - "ระหว่างน้ำกลั่นกับน้ำเกลือ อะไรทำให้สนิมเกิดเร็วกว่า"
    solution: "หลอด 3 และ 4 ขาดน้ำหรืออากาศ หลอด 1 และ 2 เกิดสนิมได้ แต่ **หลอด 2** มีเกลือซึ่งเร่งการเกิดสนิม เหมือนรั้วเหล็กริมทะเลที่ผุเร็ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.everyday-reactions.p006
    topics: [chemistry.reactions.everyday-reactions]
    difficulty: 3
    type: mcq
    stem: "ยาลดกรดชนิดน้ำมีแมกนีเซียมไฮดรอกไซด์ ช่วยลดอาการแสบท้องจากกรดในกระเพาะ ปฏิกิริยาที่เกิดคือข้อใด"
    choices:
      - { id: a, text: "กรด + เบส → เกลือ + น้ำ", correct: true, feedback: "ถูก แมกนีเซียมไฮดรอกไซด์เป็นเบส สะเทินกรดไฮโดรคลอริกในกระเพาะ" }
      - { id: b, text: "กรด + โลหะ → เกลือ + แก๊สไฮโดรเจน", feedback: "แมกนีเซียมไฮดรอกไซด์ไม่ใช่โลหะแมกนีเซียม และไม่มีแก๊สไฮโดรเจนเกิดขึ้น" }
      - { id: c, text: "กรด + คาร์บอเนต → เกลือ + น้ำ + คาร์บอนไดออกไซด์", feedback: "สารในยานี้ไม่มีคาร์บอเนต (ยาลดกรดบางยี่ห้อใช้คาร์บอเนตซึ่งทำให้เรอ)" }
      - { id: d, text: "การสลายตัวด้วยความร้อน", feedback: "ปฏิกิริยาเกิดในกระเพาะที่อุณหภูมิร่างกาย และมีสารสองชนิดทำปฏิกิริยากัน" }
    hints:
      - "สารที่ลงท้ายด้วย ไฮดรอกไซด์ มักเป็นเบส"
      - "กรดในกระเพาะพบกับเบส"
    solution: "แมกนีเซียมไฮดรอกไซด์เป็นเบส ทำปฏิกิริยาสะเทินกับกรด: **กรดไฮโดรคลอริก + แมกนีเซียมไฮดรอกไซด์ → แมกนีเซียมคลอไรด์ + น้ำ**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.everyday-reactions.p007
    topics: [chemistry.reactions.everyday-reactions]
    difficulty: 3
    type: numeric
    stem: "เผาหินปูน 25.0 g ในถ้วยเปิดจนสลายตัวหมด ได้ปูนดิบ 14.0 g แก๊สคาร์บอนไดออกไซด์ที่ลอยออกไปมีมวลกี่กรัม"
    answer: { value: 11, unit: g, tolerance: 0.1 }
    misconceptions:
      - { match: 39, feedback: "นำมวลมาบวกกัน แต่แก๊สเป็นส่วนหนึ่งของหินปูนเดิม ต้องลบ" }
      - { match: 14, feedback: "14.0 g คือมวลของปูนดิบ ไม่ใช่มวลของแก๊ส" }
    hints:
      - "แคลเซียมคาร์บอเนต → แคลเซียมออกไซด์ + คาร์บอนไดออกไซด์"
      - "มวลหินปูน = มวลปูนดิบ + มวลแก๊ส"
    solution: "ตามกฎทรงมวล มวลแก๊ส = 25.0 − 14.0 = **11.0 g**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.everyday-reactions.p008
    topics: [chemistry.reactions.everyday-reactions]
    difficulty: 3
    type: mcq
    stem: "เตาแก๊สหุงต้มที่บ้านมีเปลวไฟสีเหลือง และก้นหม้อมีเขม่าดำ ข้อใดอธิบายและแก้ปัญหาได้ถูกต้อง"
    choices:
      - { id: a, text: "เผาไหม้ไม่สมบูรณ์เพราะออกซิเจนไม่พอ ควรทำความสะอาดหัวเตาและปรับช่องอากาศ เปิดหน้าต่างให้อากาศถ่ายเท", correct: true, feedback: "ถูก การเผาไหม้ไม่สมบูรณ์ยังให้แก๊สคาร์บอนมอนอกไซด์ที่เป็นพิษด้วย" }
      - { id: b, text: "เผาไหม้สมบูรณ์ เปลวยิ่งเหลืองยิ่งร้อน", feedback: "เปลวสีน้ำเงินคือการเผาไหม้สมบูรณ์ เปลวเหลืองมีเขม่าแสดงว่าออกซิเจนไม่พอ" }
      - { id: c, text: "แก๊สมีออกซิเจนมากเกินไป ควรปิดหน้าต่าง", feedback: "ออกซิเจนมากจะเผาไหม้สมบูรณ์ เขม่าเกิดเมื่อออกซิเจนไม่พอ" }
    hints:
      - "เขม่าคือคาร์บอนที่ยังเผาไหม้ไม่หมด"
      - "เผาไหม้สมบูรณ์ต้องมีออกซิเจนพอ"
    solution: "เปลวสีเหลืองและเขม่าแสดงว่า **เผาไหม้ไม่สมบูรณ์** เพราะออกซิเจนไม่พอ ซึ่งยังเกิดแก๊สคาร์บอนมอนอกไซด์ที่เป็นพิษ แก้โดยทำความสะอาดหัวเตา ปรับช่องอากาศ และให้ห้องมีอากาศถ่ายเท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.everyday-reactions.p009
    topics: [chemistry.reactions.everyday-reactions]
    difficulty: 3
    type: order
    stem: "เรียงลำดับเหตุการณ์ที่ทำให้เกิดฝนกรดจากโรงไฟฟ้าถ่านหิน"
    items:
      - "เผาถ่านหินที่มีกำมะถันปนอยู่"
      - "เกิดแก๊สซัลเฟอร์ไดออกไซด์ออกไปกับควัน"
      - "แก๊สรวมกับออกซิเจนและไอน้ำในอากาศเกิดเป็นกรดซัลฟิวริก"
      - "กรดตกลงมากับฝนเป็นฝนกรด"
      - "ฝนกรดกัดกร่อนอาคารหินปูนและทำให้ดินเป็นกรด"
    hints:
      - "เริ่มจากการเผาเชื้อเพลิง"
      - "แก๊สต้องรวมกับน้ำก่อนจึงเป็นกรด"
    solution: "เผาถ่านหินที่มีกำมะถัน → เกิด SO₂ → SO₂ รวมกับออกซิเจนและไอน้ำเป็นกรดซัลฟิวริก → ตกลงมาเป็นฝนกรด → กัดกร่อนอาคารและทำให้ดินเป็นกรด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.everyday-reactions.p010
    topics: [chemistry.reactions.everyday-reactions]
    difficulty: 3
    type: mcq
    stem: "แช่ตะปูเหล็กในสารละลายคอปเปอร์ซัลเฟตสีฟ้า 1 วัน จะสังเกตเห็นอะไร"
    choices:
      - { id: a, text: "มีของแข็งสีน้ำตาลแดงเกาะตะปู สีฟ้าของสารละลายจางลง", correct: true, feedback: "ถูก เหล็กแทนที่ทองแดงในสารละลาย ทองแดงจึงเกาะที่ตะปู" }
      - { id: b, text: "ไม่มีอะไรเปลี่ยน เพราะเหล็กไม่ทำปฏิกิริยากับเกลือ", feedback: "เหล็กว่องไวกว่าทองแดง จึงแทนที่ทองแดงได้" }
      - { id: c, text: "มีฟองแก๊สไฮโดรเจนจำนวนมาก", feedback: "คอปเปอร์ซัลเฟตไม่ใช่กรด ผลที่เห็นคือทองแดงเกาะตะปู" }
    hints:
      - "เหล็กหรือทองแดงว่องไวกว่ากัน"
      - "ปฏิกิริยาการแทนที่: โลหะที่ว่องไวกว่าไล่โลหะอีกตัวออกจากสารละลาย"
    solution: "เหล็ก + คอปเปอร์ซัลเฟต → เหล็ก(II)ซัลเฟต + ทองแดง เป็น **ปฏิกิริยาการแทนที่** ทองแดงสีน้ำตาลแดงเกาะตะปู และสีฟ้าจางลง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.everyday-reactions.p011
    topics: [chemistry.reactions.everyday-reactions]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "โรงเรียนริมทะเลที่ระยองมีรั้วเหล็กเป็นสนิมเร็ว วิธีใดช่วยป้องกันสนิมได้ (เลือกได้หลายข้อ)"
    choices:
      - { id: a, text: "ทาสีกันสนิมทับให้ทั่ว", correct: true, feedback: "ถูก สีกันน้ำและอากาศไม่ให้สัมผัสเหล็ก" }
      - { id: b, text: "เปลี่ยนเป็นรั้วเหล็กชุบสังกะสี", correct: true, feedback: "ถูก สังกะสีเคลือบผิวเหล็กไว้ และสังกะสีถูกกัดกร่อนแทนเหล็ก" }
      - { id: c, text: "ทาน้ำมันหรือจาระบีที่บานพับ", correct: true, feedback: "ถูก น้ำมันเป็นชั้นกันน้ำและอากาศ" }
      - { id: d, text: "ฉีดน้ำทะเลล้างรั้วทุกวัน", feedback: "น้ำทะเลมีเกลือ ทำให้สนิมเกิดเร็วขึ้น" }
      - { id: e, text: "คลุมรั้วด้วยผ้าชุบน้ำ", feedback: "ผ้าเปียกทำให้เหล็กชื้นตลอดเวลา สนิมยิ่งเกิดง่าย" }
    hints:
      - "สนิมต้องมีทั้งน้ำและออกซิเจน"
      - "วิธีที่ใช้ได้คือวิธีที่กันน้ำหรืออากาศไม่ให้ถึงผิวเหล็ก"
    solution: "วิธีที่ใช้ได้คือ **ทาสี ชุบสังกะสี และทาน้ำมัน** ซึ่งกันน้ำและอากาศ ส่วนน้ำทะเลและผ้าเปียกเพิ่มความชื้นและเกลือ ทำให้สนิมเกิดเร็วขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.everyday-reactions.p012
    topics: [chemistry.reactions.everyday-reactions]
    difficulty: 4
    type: numeric
    stem: "ชั่งบีกเกอร์ที่ใส่น้ำส้มสายชูได้ 100.0 g แล้วใส่เปลือกไข่ 5.0 g ลงไป (บีกเกอร์เปิด) เมื่อหยุดมีฟอง ชั่งได้ 103.2 g แก๊สคาร์บอนไดออกไซด์ที่หนีออกไปมีมวลกี่กรัม"
    answer: { value: 1.8, unit: g, tolerance: 0.05 }
    misconceptions:
      - { match: 3.2, feedback: "ลืมรวมมวลเปลือกไข่ มวลเริ่มต้นทั้งหมดคือ 105.0 g ไม่ใช่ 100.0 g" }
      - { match: 5, feedback: "เปลือกไข่ไม่ได้กลายเป็นแก๊สทั้งหมด บางส่วนเป็นเกลือและน้ำที่ยังอยู่ในบีกเกอร์" }
    hints:
      - "มวลรวมก่อนทำปฏิกิริยาคือน้ำส้มสายชูรวมบีกเกอร์บวกเปลือกไข่"
      - "มวลที่ลดลงคือมวลของแก๊สที่ออกจากบีกเกอร์"
    solution: "มวลก่อน = 100.0 + 5.0 = 105.0 g มวลหลัง = 103.2 g มวลคาร์บอนไดออกไซด์ = 105.0 − 103.2 = **1.8 g**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.everyday-reactions.p013
    topics: [chemistry.reactions.everyday-reactions]
    difficulty: 4
    type: mcq
    stem: "ชาวนาในภาคใต้ปลูกข้าวในดินเปรี้ยว (ดินเป็นกรดจัด) ข้าวโตช้า นักเรียนต้องการออกแบบวิธีแก้ปัญหาด้วยความรู้เคมี ข้อใดเหมาะสมที่สุด"
    choices:
      - { id: a, text: "วัดค่าความเป็นกรดของดินก่อน ใส่ปูนมาร์ลหรือปูนขาวในปริมาณต่างกันในแปลงทดลองเล็ก ๆ แล้ววัดค่าความเป็นกรดและการเติบโตของข้าวเปรียบเทียบกับแปลงที่ไม่ใส่", correct: true, feedback: "ถูก ใช้ปฏิกิริยาสะเทินแก้สาเหตุ และมีการทดสอบเทียบกับชุดควบคุมด้วยตัวเลข" }
      - { id: b, text: "ใส่น้ำส้มสายชูลงในดินให้มากที่สุด", feedback: "น้ำส้มสายชูเป็นกรด จะทำให้ดินเปรี้ยวยิ่งขึ้น" }
      - { id: c, text: "ใส่ปูนขาวทั้งแปลงทันทีในปริมาณมาก ๆ โดยไม่ต้องวัดผล", feedback: "แนวคิดเรื่องเบสถูก แต่ไม่ได้ทดสอบหาปริมาณที่เหมาะสม ใส่มากเกินไปดินอาจกลายเป็นเบสเกินไป" }
      - { id: d, text: "เผาฟางในนาให้หมดเพื่อไล่กรด", feedback: "การเผาไม่ได้สะเทินกรดในดิน และยังเกิดควันและฝุ่นละออง" }
    hints:
      - "ดินเป็นกรด ควรใช้สารที่เป็นกรดหรือเบส"
      - "การออกแบบที่ดีต้องมีการทดสอบและวัดผลเทียบกับชุดควบคุม"
    solution: "ดินเปรี้ยวเป็นกรด แก้ด้วย **ปฏิกิริยาสะเทิน** โดยใส่ปูนมาร์ลหรือปูนขาว และควรทดลองในแปลงเล็กหลายปริมาณ วัดค่าความเป็นกรดและการเติบโตเทียบกับแปลงที่ไม่ใส่ เพื่อหาปริมาณที่คุ้มค่าที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.everyday-reactions.p014
    topics: [chemistry.reactions.everyday-reactions]
    difficulty: 4
    type: mcq
    stem: "ทำไมจึงห้ามใช้หม้ออะลูมิเนียมละลายโซดาไฟ (โซเดียมไฮดรอกไซด์) สำหรับล้างท่อ"
    choices:
      - { id: a, text: "เบสทำปฏิกิริยากับอะลูมิเนียม หม้อถูกกัดกร่อน เกิดความร้อนและแก๊สไฮโดรเจนที่ติดไฟได้", correct: true, feedback: "ถูก นี่คือปฏิกิริยาของเบสกับโลหะ" }
      - { id: b, text: "โซดาไฟเป็นกรด จะกัดหม้อ", feedback: "โซดาไฟเป็นเบสแก่ แต่เบสก็ทำปฏิกิริยากับอะลูมิเนียมได้" }
      - { id: c, text: "อะลูมิเนียมทำให้โซดาไฟกลายเป็นน้ำส้มสายชู", feedback: "ไม่เกิดกรดแอซีติก ผลิตภัณฑ์คือโซเดียมอะลูมิเนตและแก๊สไฮโดรเจน" }
      - { id: d, text: "ไม่มีอันตราย ที่ห้ามเพราะหม้อจะเปลี่ยนสีเท่านั้น", feedback: "ปฏิกิริยานี้คายความร้อนมากและให้แก๊สที่ติดไฟได้ จึงอันตราย" }
    hints:
      - "เบสแก่ทำปฏิกิริยากับโลหะบางชนิดได้"
      - "ผลิตภัณฑ์มีแก๊สชนิดเดียวกับกรด + โลหะ"
    solution: "โซเดียมไฮดรอกไซด์ + อะลูมิเนียม + น้ำ → โซเดียมอะลูมิเนต + **แก๊สไฮโดรเจน** ปฏิกิริยาคายความร้อนมาก หม้อสึกกร่อน และแก๊สติดไฟได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.everyday-reactions.p015
    topics: [chemistry.reactions.everyday-reactions]
    difficulty: 5
    type: mcq
    stem: "นักเรียนต้องการทดสอบว่า เกลือทำให้เหล็กเป็นสนิมเร็วขึ้นจริงหรือไม่ การออกแบบการทดลองข้อใดยุติธรรมที่สุด"
    choices:
      - { id: a, text: "ใช้ตะปูชนิดและขนาดเดียวกัน 2 ชุด แช่น้ำปริมาตรเท่ากันในภาชนะแบบเดียวกัน ชุดหนึ่งเติมเกลือ วางไว้ที่เดียวกัน แล้วนับวันจนเห็นสนิม ทำซ้ำหลายตัวอย่าง", correct: true, feedback: "ถูก เปลี่ยนตัวแปรเดียวคือเกลือ ควบคุมตัวแปรอื่น และทำซ้ำเพื่อความน่าเชื่อถือ" }
      - { id: b, text: "ตะปูใหม่แช่น้ำเกลือ ตะปูเก่าแช่น้ำประปา", feedback: "อายุตะปูต่างกันเป็นตัวแปรที่สอง สรุปไม่ได้ว่าผลต่างมาจากเกลือ" }
      - { id: c, text: "ตะปูในน้ำเกลือวางกลางแดด ตะปูในน้ำเปล่าวางในห้อง", feedback: "อุณหภูมิต่างกันด้วย จึงไม่รู้ว่าผลมาจากเกลือหรือความร้อน" }
      - { id: d, text: "แช่ตะปูในน้ำเกลืออย่างเดียว แล้วดูว่าเกิดสนิมหรือไม่", feedback: "ไม่มีชุดเปรียบเทียบ จึงบอกไม่ได้ว่าเร็วขึ้นกว่าเดิมหรือไม่" }
    hints:
      - "การทดลองที่ยุติธรรมเปลี่ยนตัวแปรต้นเพียงตัวเดียว"
      - "ต้องมีชุดเปรียบเทียบ และตัวแปรอื่นเหมือนกันทั้งหมด"
    solution: "การทดลองที่ยุติธรรมต้องมี **ชุดควบคุม** และเปลี่ยนเฉพาะ **การเติมเกลือ** ตัวแปรอื่นทั้งชนิดตะปู ปริมาณน้ำ ภาชนะ และที่วางต้องเหมือนกัน ควรทำซ้ำหลายตัวอย่างและวัดผลเป็นตัวเลข เช่น จำนวนวันจนเห็นสนิม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.everyday-reactions.p016
    topics: [chemistry.reactions.everyday-reactions]
    difficulty: 2
    type: mcq
    stem: "สารตั้งต้นของการสังเคราะห์ด้วยแสงคือข้อใด"
    choices:
      - { id: a, text: "แก๊สคาร์บอนไดออกไซด์และน้ำ", correct: true, feedback: "ถูก พืชใช้แสงเปลี่ยนสารสองชนิดนี้เป็นกลูโคสและออกซิเจน" }
      - { id: b, text: "น้ำตาลกลูโคสและออกซิเจน", feedback: "นี่คือผลิตภัณฑ์ของการสังเคราะห์ด้วยแสง (และเป็นสารตั้งต้นของการหายใจ)" }
      - { id: c, text: "คลอโรฟิลล์และแสง", feedback: "คลอโรฟิลล์และแสงจำเป็นต่อปฏิกิริยา แต่ไม่ได้ถูกเปลี่ยนเป็นผลิตภัณฑ์ จึงเขียนไว้เหนือลูกศร" }
    hints:
      - "พืชดูดอะไรจากอากาศ และดูดอะไรจากราก"
      - "สารตั้งต้นอยู่ทางซ้ายของลูกศร"
    solution: "คาร์บอนไดออกไซด์ + น้ำ → กลูโคส + ออกซิเจน (มีแสงและคลอโรฟิลล์) สารตั้งต้นคือ **คาร์บอนไดออกไซด์และน้ำ**"
