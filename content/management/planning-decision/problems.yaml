    ai_assisted: true

  - id: management.principles.planning-decision.p013
    topics: [management.principles.planning-decision]
    difficulty: 5
    type: numeric
    stem: "จากต้นไม้การตัดสินใจเรื่องบูธในภาพ ถ้าความน่าจะเป็นที่ฝนตกเป็น $p$ แทน 0.4 ค่า $p$ ที่ทำให้บูธใหญ่และบูธเล็กมี EMV เท่ากันพอดีคือเท่าใด (ตอบเป็นทศนิยม)"
    figure:
      src: p-booth-tree.svg
      alt: "ต้นไม้การตัดสินใจ บูธใหญ่: ฝนตก กำไร −20,000 บาท ฝนไม่ตก กำไร 50,000 บาท บูธเล็ก: ฝนตก กำไร 5,000 บาท ฝนไม่ตก กำไร 25,000 บาท ไม่เปิดบูธ กำไร 0 บาท ความน่าจะเป็นในภาพคือฝนตก 0.4 ฝนไม่ตก 0.6"
    answer: { value: 0.5, tolerance: 0.005 }
    hints:
      - "เขียน EMV ของแต่ละบูธเป็นฟังก์ชันของ $p$ โดยฝนไม่ตกมีความน่าจะเป็น $1 - p$"
      - "บูธใหญ่ $= 50{,}000 - 70{,}000p$ บูธเล็ก $= 25{,}000 - 20{,}000p$ แล้วตั้งให้เท่ากัน"
    misconceptions:
      - { match: 0.4, feedback: "0.4 คือค่าในภาพ ซึ่งบูธใหญ่ยังดีกว่า ต้องแก้สมการหาจุดที่ EMV เท่ากัน" }
      - { match: 0.6, feedback: "ตรวจการตั้งสมการ ความน่าจะเป็นของฝนไม่ตกคือ $1 - p$" }
    solution: "บูธใหญ่ $= -20{,}000p + 50{,}000(1 - p) = 50{,}000 - 70{,}000p$ บูธเล็ก $= 5{,}000p + 25{,}000(1 - p) = 25{,}000 - 20{,}000p$ ตั้งเท่ากัน $25{,}000 = 50{,}000p$ ได้ $p = 0.5$ ถ้าโอกาสฝนตกเกิน 0.5 บูธเล็กดีกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.principles.planning-decision.p014
    topics: [management.principles.planning-decision]
    difficulty: 2
    type: match
