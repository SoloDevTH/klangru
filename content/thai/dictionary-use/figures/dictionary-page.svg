<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" font-family="sans-serif">
<title>หน้าพจนานุกรมจำลอง</title>
<rect x="0" y="0" width="920" height="500" fill="#fff"/>
<rect x="20.0" y="20.0" width="580.0" height="460.0" rx="0" fill="#fffdf6" stroke="#8a7a50" stroke-width="2"/>
<text x="40.0" y="52.0" font-size="18" text-anchor="start" fill="#777" font-weight="bold">ขนม</text>
<text x="580.0" y="52.0" font-size="18" text-anchor="end" fill="#777" font-weight="bold">ขยัน</text>
<line x1="40.0" y1="64.0" x2="580.0" y2="64.0" stroke="#bbb" stroke-width="1" stroke-linecap="round"/>
<text x="45" y="104" font-size="21" text-anchor="start"><tspan fill="#111" font-weight="bold">ขนม </tspan><tspan fill="#7d3c98" font-weight="normal">[ขะ-หนม] </tspan><tspan fill="#c0392b" font-weight="bold">น. </tspan><tspan fill="#222" font-weight="normal">ของกินที่ทำจากแป้ง</tspan></text>
<text x="75.0" y="140.0" font-size="21" text-anchor="start" fill="#222" font-weight="normal">น้ำตาล หรือกะทิ มักมีรสหวาน</text>
<text x="45" y="190" font-size="21" text-anchor="start"><tspan fill="#111" font-weight="bold">ขนาด </tspan><tspan fill="#7d3c98" font-weight="normal">[ขะ-หนาด] </tspan><tspan fill="#c0392b" font-weight="bold">น. </tspan><tspan fill="#222" font-weight="normal">ความใหญ่หรือเล็ก</tspan></text>
<text x="75.0" y="226.0" font-size="21" text-anchor="start" fill="#222" font-weight="normal">ของสิ่งต่าง ๆ เช่น รองเท้าขนาดนี้พอดี</text>
<text x="45" y="276" font-size="21" text-anchor="start"><tspan fill="#111" font-weight="bold">ขนุน </tspan><tspan fill="#7d3c98" font-weight="normal">[ขะ-หนุน] </tspan><tspan fill="#c0392b" font-weight="bold">น. </tspan><tspan fill="#222" font-weight="normal">ไม้ยืนต้นชนิดหนึ่ง</tspan></text>
<text x="75.0" y="312.0" font-size="21" text-anchor="start" fill="#222" font-weight="normal">ผลใหญ่ เนื้อสีเหลือง รสหวาน</text>
<text x="45" y="362" font-size="21" text-anchor="start"><tspan fill="#111" font-weight="bold">ขม </tspan><tspan fill="#c0392b" font-weight="bold">ว. </tspan><tspan fill="#222" font-weight="normal">มีรสอย่างบอระเพ็ด เช่น ยานี้ขม</tspan></text>
<text x="45" y="412" font-size="21" text-anchor="start"><tspan fill="#111" font-weight="bold">ขยัน </tspan><tspan fill="#7d3c98" font-weight="normal">[ขะ-หยัน] </tspan><tspan fill="#c0392b" font-weight="bold">ว. </tspan><tspan fill="#222" font-weight="normal">ตั้งใจทำงานสม่ำเสมอ</tspan></text>
<text x="75.0" y="448.0" font-size="21" text-anchor="start" fill="#222" font-weight="normal">ไม่เกียจคร้าน เช่น พี่ขยันอ่านหนังสือ</text>
<text x="630.0" y="60.0" font-size="18" text-anchor="start" fill="#111" font-weight="bold">ส่วนต่าง ๆ ของคำอธิบายศัพท์</text>
<text x="630.0" y="110.0" font-size="21" text-anchor="start" fill="#777" font-weight="bold">คำนำทาง</text>
<text x="630.0" y="138.0" font-size="16" text-anchor="start" fill="#333" font-weight="normal">คำแรกและคำสุดท้ายของหน้า</text>
<text x="630.0" y="182.0" font-size="21" text-anchor="start" fill="#111" font-weight="bold">คำตั้ง</text>
<text x="630.0" y="210.0" font-size="16" text-anchor="start" fill="#333" font-weight="normal">คำที่ค้นหา ตัวหนา</text>
<text x="630.0" y="254.0" font-size="21" text-anchor="start" fill="#7d3c98" font-weight="bold">[คำอ่าน]</text>
<text x="630.0" y="282.0" font-size="16" text-anchor="start" fill="#333" font-weight="normal">บอกวิธีอ่านออกเสียง</text>
<text x="630.0" y="326.0" font-size="21" text-anchor="start" fill="#c0392b" font-weight="bold">น. ก. ว.</text>
<text x="630.0" y="354.0" font-size="16" text-anchor="start" fill="#333" font-weight="normal">ชนิดของคำ (นาม กริยา วิเศษณ์)</text>
<text x="630.0" y="398.0" font-size="21" text-anchor="start" fill="#222" font-weight="bold">ความหมาย</text>
<text x="630.0" y="426.0" font-size="16" text-anchor="start" fill="#333" font-weight="normal">คำอธิบายและตัวอย่าง</text>
<text x="310.0" y="496.0" font-size="14" text-anchor="middle" fill="#777" font-weight="normal">หน้าพจนานุกรมจำลอง ความหมายเขียนใหม่โดยคลังรู้</text>
</svg>
