problems:
  - id: earthscience.ocean.ocean-circulation.p001
    topics: [earthscience.ocean.ocean-circulation]
    difficulty: 1
    type: match
    stem: "จับคู่ชั้นน้ำในมหาสมุทรเขตร้อนกับลักษณะของชั้นนั้น"
    pairs:
      - { left: "ชั้นน้ำผสม", right: "อุณหภูมิเกือบเท่ากันตลอดชั้น เพราะลมและคลื่นคลุกเคล้า" }
      - { left: "เทอร์โมไคลน์", right: "อุณหภูมิลดลงอย่างรวดเร็วตามความลึก" }
      - { left: "ชั้นน้ำลึก", right: "เย็นจัดราว 2–4 °C และมืด" }
    hints:
      - "ชั้นบนสุดได้รับลมและแสงอาทิตย์"
      - "ชั้นที่อยู่ตรงกลางคือชั้นที่อุณหภูมิเปลี่ยนมากที่สุด"
    solution: "ชั้นน้ำผสมถูกลมและคลื่นคลุกเคล้าจึงอุณหภูมิเกือบเท่ากัน เทอร์โมไคลน์อุณหภูมิลดลงเร็ว และชั้นน้ำลึกเย็นจัด เกือบคงที่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.ocean.ocean-circulation.p002
    topics: [earthscience.ocean.ocean-circulation]
    difficulty: 1
    type: mcq
    stem: "สิ่งใดเป็นตัวขับเคลื่อนหลักของกระแสน้ำผิวหน้าในมหาสมุทร"
    choices:
      - { id: a, text: "ลมประจำที่พัดบนผิวน้ำ", correct: true }
      - { id: b, text: "แรงดึงดูดของดวงจันทร์", feedback: "ดวงจันทร์ทำให้เกิดน้ำขึ้นน้ำลง ไม่ใช่กระแสน้ำผิวหน้าขนาดใหญ่ที่ไหลวนทั้งแอ่งมหาสมุทร" }
      - { id: c, text: "ความร้อนจากใต้พื้นสมุทร", feedback: "ความร้อนใต้พื้นสมุทรมีผลน้อยมาก กระแสน้ำผิวหน้าเกิดจากลมเป็นหลัก" }
      - { id: d, text: "น้ำจากแม่น้ำที่ไหลลงทะเล", feedback: "น้ำจากแม่น้ำมีผลเฉพาะใกล้ปากแม่น้ำ ไม่ได้ขับเคลื่อนกระแสน้ำทั้งมหาสมุทร" }
    hints:
      - "กระแสน้ำผิวหน้าไปในทิศเดียวกับลมประจำในแต่ละเขตละติจูด"
      - "ลมลากน้ำชั้นบนให้เคลื่อนที่"
    solution: "ลมประจำ เช่น ลมค้าและลมตะวันตก ลากน้ำผิวหน้าให้เคลื่อนที่ แล้วแรงคอริออลิสและทวีปทำให้เป็นวงวน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.ocean.ocean-circulation.p003
    topics: [earthscience.ocean.ocean-circulation]
    difficulty: 2
    type: mcq
    stem: "วงวนกระแสน้ำในมหาสมุทรแปซิฟิกเหนือหมุนในทิศใด และเพราะเหตุใด"
    choices:
      - { id: a, text: "ตามเข็มนาฬิกา เพราะลมค้าดันน้ำไปทางตะวันตก ลมตะวันตกดันน้ำกลับทางตะวันออก และแรงคอริออลิสเบนไปทางขวา", correct: true }
      - { id: b, text: "ทวนเข็มนาฬิกา เพราะโลกหมุนจากตะวันตกไปตะวันออก", feedback: "วงวนทวนเข็มนาฬิกาพบในซีกโลกใต้ ซีกโลกเหนือแรงคอริออลิสเบนไปทางขวา วงวนจึงหมุนตามเข็มนาฬิกา" }
      - { id: c, text: "ไม่หมุน น้ำไหลไปทางตะวันตกตลอด", feedback: "เมื่อน้ำไปชนทวีปเอเชียจะเลี้ยวขึ้นเหนือเป็นกระแสน้ำคุโรชิโอ แล้วลมตะวันตกพาน้ำกลับ จึงเป็นวงวน" }
      - { id: d, text: "หมุนตามเข็มนาฬิกา เพราะแม่น้ำในเอเชียไหลลงทะเล", feedback: "น้ำจากแม่น้ำมีปริมาณน้อยเกินกว่าจะขับเคลื่อนวงวนขนาดเท่าแอ่งมหาสมุทร" }
    hints:
      - "ลมค้าพัดไปทางตะวันตกที่เขตร้อน ลมตะวันตกพัดไปทางตะวันออกที่ละติจูดกลาง"
      - "ซีกโลกเหนือ แรงคอริออลิสเบนไปทางขวา"
    solution: "ลมค้าดันน้ำไปทางตะวันตกตามเส้นศูนย์สูตร ชนเอเชียแล้วไหลขึ้นเหนือ ลมตะวันตกดันกลับทางตะวันออก ชนอเมริกาเหนือแล้วไหลลงใต้ รวมเป็นวงวนตามเข็มนาฬิกา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.ocean.ocean-circulation.p004
    topics: [earthscience.ocean.ocean-circulation]
    difficulty: 2
    type: mcq
    stem: "ทะเลทรายอาตากามาในชิลีอยู่ติดชายฝั่งทะเล แต่ฝนตกน้อยมาก สาเหตุสำคัญข้อหนึ่งคือข้อใด"
    choices:
      - { id: a, text: "กระแสน้ำเย็นฮัมโบลต์ทำให้อากาศเหนือทะเลเย็น จมตัว และเสถียร เมฆฝนเกิดยาก", correct: true }
      - { id: b, text: "กระแสน้ำอุ่นทำให้อากาศร้อนจนน้ำระเหยหมด", feedback: "ชายฝั่งชิลีมีกระแสน้ำเย็น ไม่ใช่กระแสน้ำอุ่น และอากาศเหนือน้ำอุ่นมักยกตัวและเกิดฝน" }
      - { id: c, text: "น้ำทะเลบริเวณนั้นไม่มีเกลือ", feedback: "น้ำทะเลทุกแห่งมีเกลือ ความเค็มไม่ใช่สาเหตุที่ฝนน้อย" }
      - { id: d, text: "อยู่ใกล้ขั้วโลกใต้มาก", feedback: "อาตากามาอยู่ราวละติจูด 20°–30° ใต้ ไม่ได้อยู่ใกล้ขั้วโลก" }
    hints:
      - "ชายฝั่งตะวันตกของทวีปมักมีกระแสน้ำเย็น"
      - "อากาศที่ถูกทำให้เย็นจากด้านล่างจะยกตัวหรือจมตัว"
    solution: "กระแสน้ำเย็นฮัมโบลต์และน้ำผุดทำให้อากาศชั้นล่างเย็น หนาแน่น และเสถียร อากาศไม่ยกตัว จึงเกิดหมอกแต่แทบไม่มีฝน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.ocean.ocean-circulation.p005
    topics: [earthscience.ocean.ocean-circulation]
    difficulty: 2
    type: text
    stem: "ปรากฏการณ์ที่น้ำเย็นซึ่งมีธาตุอาหารสูงจากชั้นล่างลอยขึ้นมาแทนน้ำผิวหน้าที่ถูกลมพัดออกจากฝั่ง เรียกว่าอะไร"
    accepted: ["น้ำผุด", "ปรากฏการณ์น้ำผุด", "upwelling"]
    misconceptions:
      - { match: "น้ำจม", feedback: "น้ำจมคือน้ำผิวหน้าที่จมลง โจทย์นี้น้ำจากชั้นล่างลอยขึ้นมา" }
      - { match: "เอลนีโญ", feedback: "เอลนีโญคือภาวะที่น้ำแปซิฟิกตะวันออกอุ่นผิดปกติ ซึ่งทำให้น้ำเย็นลอยขึ้นมาได้น้อยลง" }
    hints:
      - "น้ำเคลื่อนขึ้นจากชั้นล่าง"
      - "คำตรงข้ามคือน้ำจม"
    solution: "น้ำผุด (upwelling) คือน้ำเย็นจากชั้นล่างที่ลอยขึ้นมาแทนน้ำผิวหน้า นำธาตุอาหารขึ้นมา จึงเป็นแหล่งประมงสำคัญ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.ocean.ocean-circulation.p006
    topics: [earthscience.ocean.ocean-circulation]
    difficulty: 3
    type: numeric
    stem: "น้ำทะเลมีความหนาแน่น $1025\\ \\mathrm{kg/m^3}$ และมีเกลือ 35 g ในน้ำทะเล 1 kg น้ำทะเล 1 ลูกบาศก์เมตรมีเกลือกี่กิโลกรัม"
    answer: { value: 35.9, tolerance: 0.2, unit: "kg" }
    misconceptions:
      - { match: 35, feedback: "น้ำทะเล 1 ลูกบาศก์เมตรมีมวล 1,025 kg ไม่ใช่ 1,000 kg" }
      - { match: 35875, feedback: "คำตอบนี้เป็นกรัม ต้องหารด้วย 1,000 เพื่อเป็นกิโลกรัม" }
    hints:
      - "มวลของน้ำทะเล 1 m³ = ความหนาแน่น × ปริมาตร"
      - "เกลือ = มวลน้ำทะเล × 35/1000"
    solution: "มวลน้ำทะเล $= 1025\\ \\mathrm{kg}$ เกลือ $= 1025 \\times 0.035 \\approx 35.9\\ \\mathrm{kg}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.ocean.ocean-circulation.p007
    topics: [earthscience.ocean.ocean-circulation]
    difficulty: 3
    type: mcq
    stem: "กราฟแสดงอุณหภูมิของน้ำทะเลตามความลึกที่สถานี A และ B สถานีใดน่าจะอยู่ใกล้ขั้วโลก และเพราะเหตุใด"
    figure: { src: p-profiles.svg, alt: "กราฟแกนนอนอุณหภูมิของน้ำ 0–30 °C แกนตั้งความลึก 0–3,000 m โดยความลึกเพิ่มลงด้านล่าง สถานี A ผิวน้ำราว 26 °C คงที่ถึงราว 60 m แล้วลดลงเร็วจนเหลือราว 5 °C ที่ 1,000 m และราว 3 °C ที่ 3,000 m สถานี B ผิวน้ำราว 0.5 °C เพิ่มขึ้นเล็กน้อยเป็นราว 1.7 °C ที่ 3,000 m เกือบเป็นเส้นตรงแนวดิ่ง" }
    choices:
      - { id: a, text: "สถานี B เพราะน้ำผิวหน้าเย็นพอ ๆ กับน้ำลึก ไม่มีเทอร์โมไคลน์", correct: true }
      - { id: b, text: "สถานี A เพราะอุณหภูมิเปลี่ยนมากตามความลึก", feedback: "อุณหภูมิที่ลดลงเร็วตามความลึก (เทอร์โมไคลน์ชัด) เป็นลักษณะของเขตร้อนที่ผิวน้ำได้แสงอาทิตย์มาก" }
      - { id: c, text: "สถานี A เพราะน้ำลึกที่ 3,000 m เย็นกว่าผิวน้ำ", feedback: "น้ำลึกเย็นทั้งสองสถานี สิ่งที่ต่างกันคืออุณหภูมิผิวน้ำ" }
      - { id: d, text: "บอกไม่ได้ เพราะน้ำลึกทั้งสองสถานีเย็นเท่ากัน", feedback: "ดูที่ผิวน้ำ สถานีหนึ่งอุ่นราว 26 °C อีกสถานีราว 0.5 °C ต่างกันชัดเจน" }
    hints:
      - "ที่ใดได้รับแสงอาทิตย์น้อย ผิวน้ำจะเย็น"
      - "ถ้าผิวน้ำเย็นพอ ๆ กับน้ำลึก จะมีเทอร์โมไคลน์หรือไม่"
    solution: "สถานี B ผิวน้ำเย็นราว 0.5 °C ใกล้เคียงน้ำลึก จึงไม่มีเทอร์โมไคลน์ เป็นลักษณะของเขตขั้วโลก สถานี A ผิวน้ำอุ่นและมีเทอร์โมไคลน์ชัด เป็นเขตร้อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.ocean.ocean-circulation.p008
    topics: [earthscience.ocean.ocean-circulation]
    difficulty: 3
    type: order
    stem: "เรียงลำดับการเกิดน้ำลึกในการหมุนเวียนแบบเทอร์โมฮาลีน เริ่มจากทะเลใกล้ขั้วโลก"
    items:
      - "น้ำผิวหน้าใกล้ขั้วโลกเย็นจัด และบางส่วนแข็งตัวเป็นน้ำแข็งทะเล"
      - "เกลือส่วนใหญ่ถูกทิ้งไว้ในน้ำที่ยังไม่แข็งตัว น้ำจึงเค็มขึ้น"
      - "น้ำที่ทั้งเย็นและเค็มมีความหนาแน่นมาก จึงจมลงสู่ก้นมหาสมุทร"
      - "น้ำลึกไหลช้า ๆ ไปตามพื้นมหาสมุทรสู่แอ่งมหาสมุทรอื่น"
      - "น้ำลึกค่อย ๆ ลอยขึ้นสู่ผิวหน้าในที่อื่น แล้วไหลกลับมาเป็นกระแสน้ำผิวหน้า"
    hints:
      - "เริ่มจากสิ่งที่ทำให้น้ำหนาแน่นขึ้น"
      - "น้ำต้องจมก่อนจึงไหลไปตามพื้นมหาสมุทร"
    solution: "น้ำเย็นจัดและแข็งตัวบางส่วน → เกลือเหลือในน้ำ น้ำเค็มขึ้น → หนาแน่นมากจึงจม → ไหลไปตามพื้นมหาสมุทร → ลอยขึ้นในที่อื่นแล้วกลับมาเป็นกระแสน้ำผิวหน้า ครบรอบใช้เวลาหลายร้อยถึงราวพันปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.ocean.ocean-circulation.p009
    topics: [earthscience.ocean.ocean-circulation]
    difficulty: 3
    type: mcq
    stem: "ชายฝั่งแคลิฟอร์เนียอยู่ทางตะวันออกของมหาสมุทรแปซิฟิก (ซีกโลกเหนือ) ช่วงฤดูร้อนลมพัดขนานชายฝั่งไปทางทิศใต้ การขนส่งเอกแมนจะทำให้เกิดอะไรที่ชายฝั่ง"
    choices:
      - { id: a, text: "น้ำผิวหน้าถูกพาไปทางตะวันตกออกจากฝั่ง น้ำเย็นจากชั้นล่างผุดขึ้นมาแทน", correct: true }
      - { id: b, text: "น้ำผิวหน้าถูกพาเข้าหาฝั่ง เกิดน้ำจม", feedback: "ซีกโลกเหนือการขนส่งเอกแมนเบนไปทางขวาของทิศลม ลมไปทางใต้ ทางขวาคือทิศตะวันตก ซึ่งออกจากฝั่ง" }
      - { id: c, text: "น้ำผิวหน้าไหลไปทางใต้ตามทิศลมพอดี ไม่มีน้ำผุด", feedback: "การขนส่งสุทธิของน้ำชั้นบนตั้งฉากกับทิศลม ไม่ได้ไปตามทิศลม" }
      - { id: d, text: "น้ำผิวหน้าถูกพาไปทางตะวันออกขึ้นบก", feedback: "ทางตะวันออกคือทางซ้ายของลมที่พัดไปทางใต้ ซึ่งเป็นทิศของการขนส่งในซีกโลกใต้" }
    hints:
      - "ซีกโลกเหนือ การขนส่งเอกแมนตั้งฉากไปทางขวาของทิศลม"
      - "หันหน้าไปทางใต้ มือขวาอยู่ทางทิศใด"
    solution: "ลมพัดไปทางใต้ การขนส่งเอกแมนในซีกโลกเหนือไปทางขวาของลม คือทิศตะวันตก ออกจากฝั่ง น้ำเย็นธาตุอาหารสูงจึงผุดขึ้นมาแทน ชายฝั่งแคลิฟอร์เนียจึงมีน้ำเย็นและแหล่งประมงอุดมสมบูรณ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.ocean.ocean-circulation.p010
    topics: [earthscience.ocean.ocean-circulation]
    difficulty: 3
    type: numeric
    stem: "คราบน้ำมันลอยไปกับกระแสน้ำผิวหน้าในอ่าวไทยด้วยอัตราเร็วเฉลี่ย $0.25\\ \\mathrm{m/s}$ (ค่าสมมติ) จะใช้เวลากี่วันจึงลอยได้ระยะทาง 300 km"
    answer: { value: 13.9, tolerance: 0.15, unit: "วัน" }
    misconceptions:
      - { match: 333.3, feedback: "นี่คือเวลาเป็นชั่วโมง ต้องหารด้วย 24 อีกครั้งเพื่อเป็นวัน" }
      - { match: 0.0139, feedback: "ต้องแปลง 300 km เป็น $3 \\times 10^5$ m ก่อน" }
    hints:
      - "เวลา = ระยะทาง ÷ อัตราเร็ว"
