  stem: ป้ายที่ทางเข้าพิพิธภัณฑ์ในกรุงเทพฯ ต้องการสื่อว่า ‘ต้องซื้อตั๋วก่อนจึงเข้าได้’ ประโยคใดตรงกับป้าย
  choices:
  - id: a
    text: 只要买票 (zhǐyào mǎipiào)，就能进去 (jiù néng jìnqù)。
    feedback: ประโยคนี้บอกว่าขอแค่ซื้อก็พอ แต่ป้ายบอกว่าต้องซื้อ
  - id: b
    text: 只有买票 (zhǐyǒu mǎipiào)，才能进去 (cái néng jìnqù)。
    correct: true
    feedback: ถูก 只有 (zhǐyǒu)…才 (cái) บอกเงื่อนไขที่จำเป็น ไม่ซื้อก็เข้าไม่ได้
  - id: c
    text: 即使买票 (jíshǐ mǎipiào)，也能进去 (yě néng jìnqù)。
    feedback: 即使 (jíshǐ)…也 (yě) บอกว่าแม้มีเงื่อนไขนั้นก็ยังเกิด ไม่ใช่เงื่อนไขที่จำเป็น
  - id: d
    text: 无论买不买票 (wúlùn mǎi bu mǎi piào)，都能进去 (dōu néng jìnqù)。
    feedback: 无论 (wúlùn)…都 (dōu) บอกว่าไม่มีเงื่อนไขใดมีผล ตรงข้ามกับป้าย
  hints:
  - ป้ายนี้บอกเงื่อนไขที่ต้องมีก่อน
  - เงื่อนไขที่ขาดไม่ได้ใช้คู่คำไหน
  - คู่นั้นต้องมี 才 ในประโยคหลัง
  solution: '**b. 只有买票 (zhǐyǒu mǎipiào)，才能进去 (cái néng jìnqù)。** ต้องซื้อตั๋วก่อน จึงจะเข้าได้'
