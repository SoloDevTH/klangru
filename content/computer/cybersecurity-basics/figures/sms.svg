  <text x="102.0" y="130.0" font-size="13" text-anchor="start" fill="#1f2937" xml:space="preserve">[แจ้งเตือน] พัสดุของท่านตกค้าง</text>
  <text x="102.0" y="153.0" font-size="13" text-anchor="start" fill="#1f2937" xml:space="preserve">เนื่องจากที่อยู่ไม่ครบ</text>
