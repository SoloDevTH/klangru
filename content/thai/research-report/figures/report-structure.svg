<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="'Sarabun','Noto Sans Thai','Noto Sans Thai UI','Leelawadee UI','Tahoma','Loma',sans-serif">
<title>ส่วนประกอบของรายงานการศึกษาค้นคว้าและรายงานโครงงาน</title>
<defs></defs>
<rect x="0" y="0" width="900" height="600" fill="#fff"/>
<text x="450.0" y="30.0" font-size="20" text-anchor="middle" fill="#111" font-weight="bold">ส่วนประกอบของรายงาน</text>
<rect x="30.0" y="50.0" width="400.0" height="44.0" rx="10" fill="#37474f" stroke="#37474f" stroke-width="1"/>
<text x="230.0" y="78.0" font-size="18" text-anchor="middle" fill="#fff" font-weight="bold">รายงานการศึกษาค้นคว้า</text>
<rect x="30.0" y="106.0" width="400.0" height="124.0" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="46.0" y="133.0" font-size="16" text-anchor="start" fill="#1565c0" font-weight="bold">ส่วนนำ</text>
<text x="70.0" y="162.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">• ปก</text>
<text x="70.0" y="190.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">• คำนำ</text>
<text x="70.0" y="218.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">• สารบัญ</text>
<rect x="30.0" y="244.0" width="400.0" height="124.0" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="46.0" y="271.0" font-size="16" text-anchor="start" fill="#2e7d32" font-weight="bold">ส่วนเนื้อเรื่อง</text>
<text x="70.0" y="300.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">• บทนำ</text>
<text x="70.0" y="328.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">• เนื้อหาตามโครงเรื่อง</text>
<text x="70.0" y="356.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">• บทสรุป</text>
<rect x="30.0" y="382.0" width="400.0" height="96.0" rx="10" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
<text x="46.0" y="409.0" font-size="16" text-anchor="start" fill="#ad1457" font-weight="bold">ส่วนท้าย</text>
<text x="70.0" y="438.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">• บรรณานุกรม</text>
<text x="70.0" y="466.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">• ภาคผนวก</text>
<rect x="470.0" y="50.0" width="400.0" height="44.0" rx="10" fill="#37474f" stroke="#37474f" stroke-width="1"/>
<text x="670.0" y="78.0" font-size="18" text-anchor="middle" fill="#fff" font-weight="bold">รายงานโครงงาน</text>
<rect x="470.0" y="106.0" width="400.0" height="124.0" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="486.0" y="133.0" font-size="16" text-anchor="start" fill="#1565c0" font-weight="bold">ส่วนนำ</text>
<text x="510.0" y="162.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">• ปก</text>
<text x="510.0" y="190.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">• บทคัดย่อ</text>
<text x="510.0" y="218.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">• สารบัญ</text>
<rect x="470.0" y="244.0" width="400.0" height="180.0" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="486.0" y="271.0" font-size="16" text-anchor="start" fill="#2e7d32" font-weight="bold">ส่วนเนื้อเรื่อง (5 บท)</text>
<text x="510.0" y="300.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">• บทที่ 1 บทนำ</text>
<text x="510.0" y="328.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">• บทที่ 2 เอกสารที่เกี่ยวข้อง</text>
<text x="510.0" y="356.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">• บทที่ 3 วิธีดำเนินการ</text>
<text x="510.0" y="384.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">• บทที่ 4 ผลการศึกษา</text>
<text x="510.0" y="412.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">• บทที่ 5 สรุป อภิปรายผล ข้อเสนอแนะ</text>
<rect x="470.0" y="438.0" width="400.0" height="96.0" rx="10" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
<text x="486.0" y="465.0" font-size="16" text-anchor="start" fill="#ad1457" font-weight="bold">ส่วนท้าย</text>
<text x="510.0" y="494.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">• บรรณานุกรม</text>
<text x="510.0" y="522.0" font-size="15" text-anchor="start" fill="#111" font-weight="normal">• ภาคผนวก</text>
<text x="450.0" y="585.0" font-size="14" text-anchor="middle" fill="#555" font-weight="normal">ชื่อบทและรายการในส่วนนำอาจต่างกันเล็กน้อยตามแบบของแต่ละโรงเรียน</text>
