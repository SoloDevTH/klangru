      - { id: c, text: "ช่างเดินไปหาไขควงที่อีกห้องหนึ่ง", feedback: "การเดินหาเครื่องมือเป็นความสูญเปล่าแบบการเคลื่อนไหว ลูกค้าไม่ได้อยากจ่ายเงินให้" }
