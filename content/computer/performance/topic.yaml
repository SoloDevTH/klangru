id: computer.networks.performance
subject: computer
title: { th: ประสิทธิภาพของเครือข่าย, en: "Network performance" }
summary: แบนด์วิดท์ ทรูพุต และความหน่วงสี่ส่วน ภาระและความแออัด คิวที่ยาวขึ้นเมื่อใกล้เต็มความจุ คอขวดบนเส้นทาง โทโพโลยี และสาเหตุที่เครือข่ายช้าหรือล่มพร้อมวิธีแก้
difficulty: 5
minutes: 45
prerequisites: [computer.networks.internet-basics]
encompasses:
  - { id: computer.networks.internet-basics, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: delay.svg
    alt: "แถวบน ต้นทาง ส่งแพ็กเก็ตผ่านสาย 700 km ไปเราเตอร์ซึ่งอ่านส่วนหัวและเลือกทาง ใต้เราเตอร์มีกล่องเล็กสี่กล่องแทนคิวในเราเตอร์ แล้วส่งต่อไปปลายทาง แถวล่างสี่กล่อง 1 เวลาส่งออก เท่ากับขนาดหารแบนด์วิดท์ เช่น 1,500 ไบต์ที่ 10 Mbps เท่ากับ 1.2 ms 2 เวลาเดินทาง เท่ากับระยะทางหารอัตราเร็วสัญญาณ เช่น 700 km ในใยแก้วประมาณ 3.5 ms 3 เวลาประมวลผล เราเตอร์อ่านส่วนหัว มักน้อยมาก 4 เวลาเข้าคิว รอเมื่อข้อมูลเข้ามาก ไม่คงที่ ขึ้นกับภาระ"
    caption: "ความหน่วงสี่ส่วน"
  - type: figure
    src: bottleneck.svg
    alt: "เส้นทางสี่จุด แล็ปท็อป เราเตอร์บ้าน ผู้ให้บริการ เซิร์ฟเวอร์ เชื่อมด้วยลิงก์ Wi-Fi 300 Mbps เส้นหนาปานกลาง สาย 100 Mbps เส้นบางสีแดง และ 1 Gbps เส้นหนาที่สุด กล่องสีแดงชี้ที่ลิงก์ 100 Mbps เขียนว่า คอขวด ทรูพุตสูงสุด 100 Mbps ข้อความใต้ภาพ ความหนาของเส้นแทนแบนด์วิดท์ ลิงก์ที่บางที่สุดกำหนดความเร็วของทั้งเส้นทาง"
    caption: "ลิงก์ที่ช้าที่สุดบนเส้นทางกำหนดทรูพุตสูงสุด"
  - type: worked-example
    title: ส่งคลิปงานกลุ่มใช้เวลานานเท่าใด
    problem: "ใบตองอัปโหลดคลิปงานกลุ่มขนาด 900 MB จากบ้าน แล็ปท็อปต่อ Wi-Fi 300 Mbps อินเทอร์เน็ตบ้านอัปโหลดได้ 50 Mbps และเซิร์ฟเวอร์ของโรงเรียนรับได้ 1 Gbps ถ้าไม่มีใครใช้เน็ตพร้อมกัน จะใช้เวลาอย่างน้อยกี่นาที"
    steps:
      - text: "หาคอขวด: 300 Mbps, 50 Mbps, 1 Gbps ช้าที่สุดคือ 50 Mbps"
        why: "ข้อมูลทุกบิตต้องผ่านทุกลิงก์ ลิงก์ที่ช้าที่สุดจึงกำหนดอัตราของทั้งเส้นทาง"
      - text: "แปลงขนาดไฟล์เป็นบิต: 900 MB × 8 = 7,200 เมกะบิต"
        why: "แบนด์วิดท์วัดเป็นบิตต่อวินาที ขนาดไฟล์วัดเป็นไบต์ ต้องแปลงให้หน่วยตรงกันก่อนหาร"
      - text: "เวลา = 7,200 ÷ 50 = 144 วินาที"
      - text: "แปลงเป็นนาที: 144 ÷ 60 = 2.4 นาที เป็นเวลาอย่างน้อย เพราะทรูพุตจริงต่ำกว่าแบนด์วิดท์ และถ้ามีคนในบ้านใช้พร้อมกันจะนานขึ้น"
    answer: "อย่างน้อย 144 วินาที หรือ 2.4 นาที ถูกจำกัดด้วยอัปโหลด 50 Mbps"
  - { type: check, problem: computer.networks.performance.p003, prompt: "ลองคำนวณเวลาดาวน์โหลดอีกครั้ง" }
  - type: figure
    src: queue-graph.svg
    alt: "กราฟแกนนอนคือสัดส่วนการใช้งานลิงก์ 0 ถึง 100 เปอร์เซ็นต์ แกนตั้งคือเวลาเฉลี่ยในเราเตอร์เป็นเท่าของเวลาส่งหนึ่งแพ็กเก็ต 0 ถึง 20 เส้นกราฟ 1 หารด้วย (1 ลบ ρ) เริ่มที่ 1 ค่อย ๆ เพิ่ม จุดที่ 50 เปอร์เซ็นต์ได้ 2 เท่า จุดที่ 90 เปอร์เซ็นต์ได้ 10 เท่า แล้วพุ่งขึ้นเกือบตั้งฉากเมื่อเข้าใกล้ 100 เปอร์เซ็นต์"
    caption: "ใกล้เต็มความจุ เวลาเข้าคิวพุ่งสูงขึ้นมาก (แบบจำลองคิวอย่างง่าย)"
  - type: worked-example
    title: ทำไมทั้งบ้านดูวิดีโอแล้วกระตุก
    problem: "บ้านหนึ่งมีอินเทอร์เน็ต 100 Mbps ตอนสองทุ่มมี 4 คนดูวิดีโอความละเอียดสูงคนละ 25 Mbps และน้ำฝนเข้าวิดีโอคอลอีก 4 Mbps จงวิเคราะห์ปัญหาและเสนอวิธีแก้"
    steps:
      - text: "ความต้องการรวม: 4 × 25 + 4 = 104 Mbps เกินความจุ 100 Mbps"
      - text: "ผล: แพ็กเก็ตต่อคิวที่เราเตอร์ เวลาเข้าคิวเพิ่ม คิวเต็มจนแพ็กเก็ตหาย วิดีโอคอลซึ่งต้องการความหน่วงต่ำกระตุกก่อน"
        why: "วิดีโอที่ดูอยู่มีบัฟเฟอร์เก็บล่วงหน้าไว้ได้ แต่วิดีโอคอลต้องส่งภาพสดทันที จึงทนความหน่วงไม่ได้"
      - text: "แม้ลดเหลือ 96 Mbps การใช้งานก็ราว 96% ซึ่งตามกราฟคิวยังยาวมาก ควรให้รวมไม่เกินราว 70–80%"
      - text: "วิธีแก้: ลดความละเอียดวิดีโอที่ดูเพื่อความบันเทิง ตั้งเราเตอร์ให้ความสำคัญกับวิดีโอคอล หรือเพิ่มแพ็กเกจถ้าเป็นแบบนี้ทุกวัน"
    answer: "ความต้องการ 104 Mbps เกินความจุ 100 Mbps เกิดความแออัด แก้โดยลดภาระ จัดลำดับความสำคัญ หรือเพิ่มแบนด์วิดท์"
  - { type: check, problem: computer.networks.performance.p008, prompt: "หาจำนวนสตรีมที่ใช้ได้โดยไม่แออัด" }
glossary:
  - { term: แบนด์วิดท์ (bandwidth), definition: "อัตราสูงสุดที่ลิงก์ส่งข้อมูลได้ วัดเป็นบิตต่อวินาที เช่น Mbps" }
  - { term: ทรูพุต (throughput), definition: "อัตราการส่งข้อมูลที่ได้จริง มักต่ำกว่าแบนด์วิดท์" }
  - { term: ความหน่วง (latency), definition: "เวลาที่ข้อมูลใช้เดินทางจากต้นทางถึงปลายทาง ประกอบด้วยเวลาส่งออก เดินทาง ประมวลผล และเข้าคิว" }
  - { term: RTT, definition: "เวลาไปกลับ จากส่งข้อมูลจนได้คำตอบกลับ วัดได้ด้วยคำสั่ง ping" }
  - { term: ความแออัด (congestion), definition: "สภาพที่ข้อมูลเข้ามามากกว่าที่ลิงก์ส่งออกได้ ทำให้คิวยาวและแพ็กเก็ตหาย" }
  - { term: คอขวด (bottleneck), definition: "ลิงก์หรืออุปกรณ์ที่ช้าที่สุดบนเส้นทาง ซึ่งจำกัดทรูพุตของทั้งเส้นทาง" }
  - { term: จิตเตอร์ (jitter), definition: "ความไม่คงที่ของความหน่วง ทำให้เสียงและภาพสดขาดเป็นช่วง" }
  - { term: จุดล้มเหลวเดียว (single point of failure), definition: "อุปกรณ์หรือลิงก์ที่ถ้าเสียแล้วทั้งระบบหรือส่วนใหญ่ใช้ไม่ได้" }
flashcards:
  - { front: "เวลาส่งไฟล์", back: "ขนาด (บิต) ÷ อัตราการส่ง (บิตต่อวินาที) อย่าลืมคูณไบต์ด้วย 8" }
  - { front: "100 Mbps ดาวน์โหลดได้กี่ MB ต่อวินาที", back: "100 ÷ 8 = 12.5 MB ต่อวินาที" }
  - { front: "ความหน่วงสี่ส่วน", back: "เวลาส่งออก เวลาเดินทางของสัญญาณ เวลาประมวลผล เวลาเข้าคิว" }
  - { front: "แบนด์วิดท์กับความหน่วงต่างกันอย่างไร", back: "แบนด์วิดท์คือความกว้างของท่อ (ส่งได้มากแค่ไหน) ความหน่วงคือความยาวของท่อ (ใช้เวลานานแค่ไหน)" }
  - { front: "ทรูพุตของเส้นทางถูกจำกัดด้วยอะไร", back: "ลิงก์ที่ช้าที่สุด (คอขวด) บนเส้นทาง" }
