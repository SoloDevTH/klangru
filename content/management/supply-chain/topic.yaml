id: management.operations.supply-chain
subject: management
title: { th: การจัดการโซ่อุปทานและโลจิสติกส์, en: Supply chain and logistics management }
summary: โครงสร้างโซ่อุปทาน ปรากฏการณ์แส้ม้า การจัดซื้อและคัดเลือกผู้ส่งมอบแบบถ่วงน้ำหนัก ต้นทุนโลจิสติกส์ รูปแบบการขนส่ง ศูนย์กระจายสินค้า และระบบสารสนเทศโลจิสติกส์
difficulty: 6.5
minutes: 40
prerequisites: [management.operations.inventory]
encompasses:
  - { id: management.operations.inventory, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: sc-flow.svg
    alt: "แผนภาพเจ็ดกล่องเรียงจากซ้ายไปขวา สวนทุเรียน จันทบุรี → ล้ง (โรงคัดบรรจุ) คัด ชั่ง บรรจุ ตรวจ → ขนส่ง ถนน ราง หรือเรือ → ด่านหรือท่าเรือ พิธีการศุลกากร → ผู้นำเข้าในจีน → ตลาดค้าส่งและร้านค้าปลีก → ผู้บริโภค ลูกศรสีเขียวสินค้าไหลไปข้างหน้าสู่ปลายน้ำ ใต้กล่องมีลูกศรเส้นประย้อนกลับสองเส้น ข้อมูลไหลย้อนกลับ: คำสั่งซื้อ ยอดขาย สต็อก ผลตรวจคุณภาพ และเงินไหลย้อนกลับ: ค่าสินค้า ค่าขนส่ง ค่าธรรมเนียม ด้านบนมีลูกศรจากต้นน้ำไปปลายน้ำ"
    caption: "สินค้า ข้อมูล และเงินในโซ่อุปทานทุเรียนส่งออก (โครงสร้างทั่วไป)"
  - type: worked-example
    title: ต้นทุนถึงมือผู้นำเข้าต่อกิโลกรัม
    problem: "ผู้ส่งออกทุเรียนแช่แข็ง (สมมติ) ขายราคา FOB 95 บาทต่อกิโลกรัม ผู้นำเข้าจ่ายค่าระวาง 6.50 บาทต่อกิโลกรัม ค่าประกันภัย 1% ของ (ราคาสินค้า + ค่าระวาง) สมมติอากรขาเข้า 0% และค่าดำเนินการที่ปลายทาง 2.00 บาทต่อกิโลกรัม ต้นทุนถึงมือผู้นำเข้าเป็นกี่บาทต่อกิโลกรัม"
    steps:
      - text: "ราคาสินค้า + ค่าระวาง $95 + 6.50 = 101.50$ บาท"
        why: "ราคา FOB ยังไม่รวมค่าขนส่งหลัก ผู้ซื้อต้องจ่ายเอง"
      - text: "ค่าประกันภัย $0.01 \\times 101.50 = 1.015$ บาท"
      - text: "อากรขาเข้า $0$ บาท (ตามที่สมมติ ของจริงต้องตรวจพิกัดและความตกลงการค้าที่ใช้)"
      - text: "ต้นทุนถึงมือ $101.50 + 1.015 + 0 + 2.00 = 104.515$ บาท"
    answer: "ประมาณ 104.52 บาทต่อกิโลกรัม สูงกว่าราคา FOB ราว 10%"
  - { type: check, problem: management.operations.supply-chain.p006 }
  - type: figure
    src: bullwhip.svg
    alt: "กราฟเส้นสี่เส้น 12 สัปดาห์ แกนตั้งหน่วยต่อสัปดาห์ 0 ถึง 200 ผู้บริโภคซื้อจริง 100 ในสัปดาห์ 1–3 แล้วเพิ่มเป็น 110 คงที่ตั้งแต่สัปดาห์ 4 ผู้ค้าปลีกสั่ง 100 แล้วพุ่งเป็น 120 ในสัปดาห์ 4 กลับมา 110 ผู้ค้าส่งสั่ง 140 ในสัปดาห์ 4 แล้วตกเป็น 100 ในสัปดาห์ 5 ก่อนเข้าสู่ 110 โรงงานผลิต 180 ในสัปดาห์ 4 ตกเป็น 60 ในสัปดาห์ 5 แล้ว 120 ในสัปดาห์ 6 ก่อนเข้าสู่ 110 ยิ่งห่างผู้บริโภคยิ่งแกว่งมาก"
    caption: "ความต้องการเพิ่ม 10% ครั้งเดียว แต่คำสั่งซื้อแกว่งแรงขึ้นทุกชั้น (แบบจำลองสมมติ)"
  - type: worked-example
    title: วัดปรากฏการณ์แส้ม้า
    problem: "ร้านค้าปลีก (สมมติ) ขายน้ำดื่มสี่สัปดาห์ได้ 50, 54, 46, 50 แพ็ก แต่สั่งจากผู้ค้าส่ง 40, 64, 36, 60 แพ็ก อัตราขยายของความแปรปรวนเป็นเท่าไร"
    steps:
      - text: "ค่าเฉลี่ยยอดขาย $= 50$ ความแปรปรวน $\\frac{0^2 + 4^2 + (-4)^2 + 0^2}{4} = 8$"
      - text: "ค่าเฉลี่ยคำสั่งซื้อ $= 50$ ความแปรปรวน $\\frac{(-10)^2 + 14^2 + (-14)^2 + 10^2}{4} = 148$"
        why: "ค่าเฉลี่ยเท่ากัน แปลว่าร้านไม่ได้สั่งเกินโดยรวม แต่สั่งแกว่งมากกว่ายอดขายจริง"
      - text: "อัตราขยาย $148 \\div 8 = 18.5$"
    answer: "18.5 เท่า คำสั่งซื้อแกว่งมากกว่าความต้องการจริงมาก"
  - { type: check, problem: management.operations.supply-chain.p009 }
  - type: figure
    src: p-supplier.svg
    alt: "ตาราง ผู้ส่งมอบกล่องบรรจุทุเรียน (สมมติ) A ราคา 52 บาทต่อกล่อง ผ่านการตรวจรับ 98.5% ส่งตรงเวลา 92% · B ราคา 48 ผ่าน 96.0% ตรงเวลา 97% · C ราคา 55 ผ่าน 99.5% ตรงเวลา 88% น้ำหนักเกณฑ์ ราคา 0.40 คุณภาพ 0.35 ส่งตรงเวลา 0.25"
    caption: "ข้อมูลผู้ส่งมอบสามราย (ข้อมูลสมมติ ใช้ในโจทย์ข้อ 5)"
glossary:
  - { term: โซ่อุปทาน, definition: "เครือข่ายผู้เกี่ยวข้องตั้งแต่วัตถุดิบถึงผู้บริโภค ที่มีการไหลของสินค้า ข้อมูล และเงิน" }
  - { term: ปรากฏการณ์แส้ม้า, definition: "ความแปรปรวนของคำสั่งซื้อที่ขยายขึ้นเรื่อย ๆ เมื่อย้อนขึ้นไปทางต้นน้ำ" }
  - { term: ต้นทุนรวมตลอดการเป็นเจ้าของ (TCO), definition: "ราคาซื้อรวมกับค่าใช้จ่ายทั้งหมดที่ตามมา เช่น ของเสีย การตรวจ การส่งช้า" }
  - { term: อัตราคำสั่งซื้อสมบูรณ์, definition: "สัดส่วนคำสั่งซื้อที่ถูกต้องครบทุกด้าน คิดจากผลคูณของอัตราถูกต้องแต่ละด้าน" }
  - { term: การขนส่งต่อเนื่องหลายรูปแบบ, definition: "การขนส่งที่ใช้มากกว่าหนึ่งรูปแบบโดยมีผู้รับผิดชอบรายเดียวและเอกสารฉบับเดียว" }
  - { term: ต้นทุนถึงมือ, definition: "ราคาสินค้ารวมค่าขนส่ง ค่าประกัน อากร และค่าดำเนินการจนสินค้าถึงผู้ซื้อ" }
  - { term: ครอสด็อก, definition: "การขนถ่ายสินค้าจากรถขาเข้าไปรถขาออกโดยแทบไม่เก็บในคลัง" }
flashcards:
  - { front: "การไหลสามอย่างในโซ่อุปทาน", back: "สินค้าไปข้างหน้า · ข้อมูลและเงินย้อนกลับ" }
  - { front: "อัตราขยายแส้ม้า", back: "ความแปรปรวนของคำสั่งซื้อ ÷ ความแปรปรวนของความต้องการ" }
  - { front: "คะแนนราคาเมื่อยิ่งถูกยิ่งดี", back: "ราคาต่ำสุด ÷ ราคาของรายนี้ × 100" }
  - { front: "ค่าถือครองสินค้าระหว่างทาง", back: "มูลค่า × อัตราต่อปี × จำนวนวัน ÷ 365" }
  - { front: "FOB กับ CIF", back: "FOB ผู้ซื้อจ่ายค่าขนส่งหลัก · CIF ผู้ขายจ่ายค่าระวางและประกันถึงท่าปลายทาง" }
