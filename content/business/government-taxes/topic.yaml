id: business.econ.government-taxes
subject: business
title:
  th: ระบบเศรษฐกิจ บทบาทของรัฐ และภาษี
  en: Economic systems, the role of government and taxation
summary: ระบบเศรษฐกิจแบบทุนนิยม สังคมนิยม และผสม สินค้าสาธารณะ บทบาทของรัฐ ภาษีหลักของไทย ภาษีก้าวหน้าและถดถอย หน้าที่ผู้เสียภาษี และผลของนโยบายรัฐ
difficulty: 4
minutes: 35
prerequisites:
- business.econ.circular-flow
