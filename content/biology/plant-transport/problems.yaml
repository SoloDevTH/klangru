  - id: biology.plants.plant-transport.p018
    topics: [biology.plants.plant-transport]
    difficulty: 5
    type: mcq
    stem: "ร้านดอกไม้ที่ปากคลองตลาดตัดโคนก้านกุหลาบใต้น้ำก่อนปักแจกัน ดอกจึงสดนานกว่าการตัดในอากาศ ข้อใดอธิบายด้วยกลไกการลำเลียงน้ำได้ถูกต้อง"
    choices:
      - { id: a, text: "การตัดในอากาศทำให้ฟองอากาศเข้าไซเลม ลำน้ำที่ยึดกันด้วยแรงโคฮีชันขาดตอน แรงดึงจากการคายน้ำจึงดึงน้ำขึ้นไม่ได้", correct: true }
      - { id: b, text: "น้ำใต้ผิวน้ำมีออกซิเจนมาก ช่วยให้ดอกหายใจ", feedback: "ปัญหาหลักคือฟองอากาศในไซเลม ไม่ใช่ออกซิเจนสำหรับดอก" }
      - { id: c, text: "การตัดใต้น้ำเพิ่มแรงดันรากให้ก้าน", feedback: "ก้านที่ตัดแล้วไม่มีรากจึงไม่มีแรงดันราก" }
      - { id: d, text: "การตัดใต้น้ำทำให้โฟลเอ็มส่งน้ำตาลไปที่ดอกมากขึ้น", feedback: "น้ำขึ้นทางไซเลม การตัดใต้น้ำช่วยให้ลำน้ำในไซเลมไม่ขาด" }
    hints:
      - "ก้านดอกที่ตัดแล้วไม่มีราก น้ำขึ้นด้วยแรงใด"
      - "แรงนั้นต้องการให้ลำน้ำต่อเนื่อง สิ่งใดทำให้ขาด"
    solution: "น้ำในก้านขึ้นด้วยแรงดึงจากการคายน้ำ ซึ่งต้องอาศัยลำน้ำต่อเนื่องที่ยึดกันด้วยแรงโคฮีชัน การตัดในอากาศทำให้ฟองอากาศเข้าไซเลมและอุดท่อ การตัดใต้น้ำป้องกันฟองอากาศ ดอกจึงได้น้ำต่อเนื่อง"
