        text: เพราะกฎหมายห้ามคิดค่าเสียหายเป็นตัวเงินในทุกกรณี
        feedback: กฎหมายหลายฉบับกำหนดให้มีการประเมินค่าเสียหายเป็นเงิน จึงไม่ใช่เหตุผลนี้
