topic: health.sport.rules-fair-play
rows:
  - { framework: th-core-2551-health-pe, indicators: ["พ 3.2 ป.1/2", "พ 3.2 ป.2/2", "พ 3.2 ป.3/2", "พ 3.2 ป.4/2", "พ 3.2 ป.5/3", "พ 3.2 ม.1/3", "พ 3.2 ม.2/3"], coverage: partial, note: "สอนความต่างของกฎ กติกา และข้อตกลง ข้อตกลงในเกมเบ็ดเตล็ดและการละเล่นพื้นเมือง และกติกาพื้นฐานของฟุตบอล ฟุตซอล วอลเลย์บอล บาสเกตบอล เซปักตะกร้อ แบดมินตัน มีโจทย์อ่านกระดานคะแนนและนับคะแนน แต่การปฏิบัติตามกติกาขณะเล่นจริงต้องฝึกในสนาม" }
  - { framework: th-core-2551-health-pe, indicators: ["พ 3.2 ป.5/4"], coverage: partial, note: "สอนสิทธิของตนและผู้อื่นในการเล่น การไม่ละเมิดสิทธิ และการยอมรับความแตกต่าง มีโจทย์สถานการณ์ (p010, p018) แต่การปฏิบัติตนจริงแอปตรวจไม่ได้ และยังไม่มีกีฬาไทยประเภทอื่น เช่น กระบี่กระบอง" }
  - { framework: th-core-2551-health-pe, indicators: ["พ 3.2 ป.6/6", "พ 3.2 ม.3/1", "พ 3.2 ม.4-6/3"], coverage: partial, note: "สอนมารยาทของผู้เล่นและผู้ดู และน้ำใจนักกีฬา (มีวินัย เคารพกฎกติกา รู้แพ้ รู้ชนะ รู้อภัย) พร้อมโจทย์สถานการณ์ แต่การแสดงออกจริงขณะเล่นและดูกีฬาต้องประเมินโดยครู" }
  - { framework: th-core-2551-health-pe, indicators: ["พ 3.2 ม.3/3", "พ 3.2 ม.4-6/2"], coverage: partial, note: "สอนการนำแนวคิดเรื่องกติกา สิทธิ และน้ำใจนักกีฬาไปใช้ในชีวิตประจำวัน (p017) แต่ยังไม่ได้สอนกลวิธีการรุกและการป้องกันระหว่างการแข่งขัน ซึ่งอยู่ในหัวข้อ health.movement.skill-learning-teamwork และการปฏิบัติจริงต้องทำในสนาม" }
  - { framework: th-core-2551-health-pe, indicators: ["พ 3.2 ม.4-6/4"], coverage: partial, note: "บทเรียนกล่าวถึงคุณค่าและความงามของกีฬาและความสุขจากการเล่น แต่การร่วมกิจกรรมอย่างมีความสุขและความชื่นชมเป็นประสบการณ์ที่ต้องเกิดจากการเล่นจริง" }
