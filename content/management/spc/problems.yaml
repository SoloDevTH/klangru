    ai_assisted: true

  - id: management.quality.spc.p014
    topics: [management.quality.spc]
    difficulty: 5
    type: numeric
    stem: "แผนภูมิ x̄–R ของเครื่องบรรจุกาแฟซองใช้กลุ่มย่อยละ 5 ซอง ได้ $\\bar{R} = 6.0$ g ($d_2 = 2.326$) ส่วนเบี่ยงเบนมาตรฐานของน้ำหนักซองเดี่ยวโดยประมาณเป็นเท่าใด (ตอบในหน่วย g ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 2.58, unit: g, tolerance: 0.01 }
    hints:
      - "$\\hat{\\sigma} = \\bar{R}/d_2$"
      - "$6.0 / 2.326$"
    misconceptions:
      - { match: 1.15, feedback: "นั่นคือ $\\hat{\\sigma}/\\sqrt{5}$ ซึ่งเป็นส่วนเบี่ยงเบนมาตรฐานของค่าเฉลี่ยกลุ่ม โจทย์ถามของซองเดี่ยว" }
      - { match: 1.5, feedback: "ดูเหมือนใช้ $\\bar{R}/4$ ซึ่งเป็นการประมาณแบบหยาบ ต้องใช้ $d_2$ ของ $n = 5$" }
    solution: "$\\hat{\\sigma} = 6.0/2.326 \\approx 2.58$ g ค่านี้ใช้ต่อในการวิเคราะห์ความสามารถของกระบวนการ"
