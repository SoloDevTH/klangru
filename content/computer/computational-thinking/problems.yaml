problems:
  - id: computer.algorithms.computational-thinking.p001
    topics: [computer.algorithms.computational-thinking]
    difficulty: 1
    type: match
    stem: "จับคู่องค์ประกอบของแนวคิดเชิงคำนวณกับตัวอย่าง"
    pairs:
      - { left: "แยกส่วนย่อย", right: "แบ่งงานทำรายงานเป็น หาข้อมูล เขียน ทำสไลด์" }
      - { left: "หารูปแบบ", right: "สังเกตว่าทุกบทในหนังสือมีคำถามท้ายบทแบบเดียวกัน" }
      - { left: "นามธรรม", right: "วาดแผนที่ไปบ้านเพื่อนแค่ถนนและจุดเลี้ยว" }
      - { left: "อัลกอริทึม", right: "เขียนขั้นตอนหุงข้าวเรียงข้อ 1 ถึง 5" }
    hints:
      - "แยกส่วนคือแบ่งงานใหญ่ นามธรรมคือเลือกเก็บเฉพาะที่จำเป็น"
      - "หารูปแบบคือเห็นสิ่งที่ซ้ำ อัลกอริทึมคือขั้นตอนที่ทำตามได้"
    solution: "แบ่งงานรายงาน = แยกส่วนย่อย, เห็นคำถามท้ายบทแบบเดียวกัน = หารูปแบบ, แผนที่มีแค่ถนนและจุดเลี้ยว = นามธรรม, ขั้นตอนหุงข้าว = อัลกอริทึม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.computational-thinking.p002
    topics: [computer.algorithms.computational-thinking]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นตัวอย่างของ **แนวคิดเชิงนามธรรม**"
    choices:
      - { id: a, text: "แผนผังรถไฟฟ้าที่แสดงแค่ลำดับสถานีและจุดเปลี่ยนสาย", correct: true }
      - { id: b, text: "ภาพถ่ายดาวเทียมที่เห็นทุกหลังคาบ้าน", feedback: "ภาพถ่ายเก็บรายละเอียดทุกอย่าง ไม่ได้เลือกเก็บเฉพาะที่จำเป็น" }
      - { id: c, text: "การแบ่งงานบ้านให้พี่น้องคนละอย่าง", feedback: "เป็นการแยกส่วนย่อย ไม่ใช่การตัดรายละเอียด" }
      - { id: d, text: "การลองกดปุ่มทุกปุ่มจนกว่าจะเจอปุ่มที่ใช่", feedback: "เป็นการลองผิดลองถูก ไม่เกี่ยวกับการเลือกรายละเอียด" }
    hints:
      - "นามธรรมคือเก็บเฉพาะสิ่งที่จำเป็นต่อการแก้ปัญหา"
      - "ข้อใดตั้งใจตัดรายละเอียดที่ไม่จำเป็นออก"
    solution: "แผนผังรถไฟฟ้าตัดถนน อาคาร และระยะทางจริงทิ้ง เก็บแค่ลำดับสถานีและจุดเปลี่ยนสาย ซึ่งพอสำหรับวางแผนการเดินทาง จึงเป็นนามธรรม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.computational-thinking.p003
    topics: [computer.algorithms.computational-thinking]
    difficulty: 2
    type: order
    stem: "เรียงบรรทัดรหัสลำลองให้เป็นอัลกอริทึมหาคะแนนเฉลี่ยของนักเรียนในห้อง"
    items:
      - "รวม ← 0"
      - "สำหรับ นักเรียนแต่ละคน: รวม ← รวม + คะแนนของคนนั้น"
      - "เฉลี่ย ← รวม ÷ จำนวนนักเรียน"
      - "แสดง เฉลี่ย"
    hints:
      - "ตัวแปรที่ใช้สะสมผลรวมต้องตั้งค่าเริ่มต้นก่อนเข้าวงวน"
      - "หารได้ก็ต่อเมื่อบวกครบทุกคนแล้ว"
    solution: "ตั้ง รวม เป็น 0 → วนบวกคะแนนทุกคน → หารด้วยจำนวนนักเรียน → แสดงผล ถ้าหารในวงวนหรือตั้ง รวม เป็น 0 ทีหลัง ผลจะผิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.computational-thinking.p004
    topics: [computer.algorithms.computational-thinking]
    difficulty: 2
    type: mcq
    stem: "สภานักเรียนต้องคำนวณจำนวนรถสำหรับนักเรียนทุกห้อง โดยทุกห้องใช้วิธีเดียวกัน ส่วนนี้ของอัลกอริทึมควรเขียนอย่างไร"
    choices:
      - { id: a, text: "ใช้วงวนทำขั้นตอนเดียวกันกับทุกห้อง", correct: true }
      - { id: b, text: "เขียนขั้นตอนแยกของแต่ละห้องซ้ำกันจนครบทุกห้อง", feedback: "ทำได้แต่ยาวและแก้ยาก ถ้าวิธีเปลี่ยนต้องแก้ทุกที่ ควรใช้รูปแบบที่ซ้ำให้เป็นประโยชน์" }
      - { id: c, text: "เดาจำนวนรถจากปีที่แล้ว", feedback: "จำนวนนักเรียนเปลี่ยนทุกปี การเดาไม่ใช่อัลกอริทึมที่เชื่อถือได้" }
      - { id: d, text: "คำนวณแค่ห้องแรกแล้วคูณด้วยจำนวนห้อง", feedback: "แต่ละห้องมีนักเรียนไม่เท่ากัน ต้องคิดจากจำนวนจริงของทุกห้อง" }
    hints:
      - "เมื่อพบรูปแบบที่ซ้ำ โครงสร้างใดช่วยให้ไม่ต้องเขียนซ้ำ"
      - "ขั้นตอนเหมือนกัน แต่ข้อมูลของแต่ละห้องต่างกัน"
    solution: "การหารูปแบบพบว่าทุกห้องทำเหมือนกัน จึงใช้วงวนทำซ้ำกับข้อมูลของแต่ละห้อง โปรแกรมสั้นและแก้ที่เดียวได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.computational-thinking.p005
    topics: [computer.algorithms.computational-thinking]
    difficulty: 2
    type: numeric
    stem: "ทีมแยกงานจัดค่ายวิทยาศาสตร์เป็นงานย่อย 3 งาน แล้วแยกแต่ละงานย่อยต่อเป็นงานย่อยลงไปอีกงานละ 4 งาน ระดับล่างสุดมีงานย่อยทั้งหมดกี่งาน"
    answer: { value: 12, unit: งาน }
    hints:
      - "วาดแผนภาพต้นไม้: รากมี 3 กิ่ง แต่ละกิ่งมี 4 ใบ"
      - "นับเฉพาะงานระดับล่างสุด"
    misconceptions:
      - { match: 7, feedback: "บวก 3 + 4 แต่แต่ละงานย่อยทั้ง 3 งานแตกเป็น 4 งาน ต้องคูณ" }
      - { match: 16, feedback: "นับรวมงานทุกระดับ (1 + 3 + 12) โจทย์ถามเฉพาะระดับล่างสุด" }
    solution: "งานย่อยระดับแรก 3 งาน แต่ละงานแตกเป็น 4 งาน ระดับล่างสุดมี 3 × 4 = 12 งาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.computational-thinking.p006
    topics: [computer.algorithms.computational-thinking]
    difficulty: 3
    type: numeric
    stem: "ใช้ผังงานในภาพ คุณพ่อจอดรถที่ห้างนี้ 6 ชั่วโมง 30 นาที ต้องจ่ายค่าจอดกี่บาท"
    figure:
      src: parking-flowchart.svg
      alt: "ผังงานค่าจอดรถ เริ่ม รับเวลาจอด m เป็นนาที กำหนด h เท่ากับปัดเศษขึ้นของ m หาร 60 ตรวจเงื่อนไข h น้อยกว่าหรือเท่ากับ 2 หรือไม่ ถ้าใช่ ค่าจอดเท่ากับ 0 ถ้าไม่ ตรวจต่อว่า h น้อยกว่าหรือเท่ากับ 5 หรือไม่ ถ้าใช่ ค่าจอดเท่ากับ h ลบ 2 คูณ 20 ถ้าไม่ ค่าจอดเท่ากับ 3 คูณ 20 บวก h ลบ 5 คูณ 50 ทุกทางไปที่แสดงค่าจอดเป็นบาท แล้วจบ หมายเหตุ ปัดเศษขึ้น เช่น 121 นาทีหาร 60 ได้ 2.02 ปัดขึ้นเป็น 3 ชั่วโมง"
    answer: { value: 160, unit: บาท }
    hints:
      - "เปลี่ยนเวลาเป็นนาที แล้วหาร 60 และปัดเศษขึ้นให้ได้ h"
      - "h มากกว่า 5 จึงใช้ทางสุดท้ายของผังงาน"
    misconceptions:
      - { match: 110, feedback: "ไม่ได้ปัดเศษขึ้น 390 ÷ 60 = 6.5 ต้องปัดเป็น 7 ชั่วโมง ไม่ใช่ 6" }
      - { match: 250, feedback: "คิดทุกชั่วโมงหลังสองชั่วโมงแรกที่ 50 บาท แต่ชั่วโมงที่ 3 ถึง 5 คิดชั่วโมงละ 20 บาท" }
    solution: "m = 6 × 60 + 30 = 390 นาที h = ปัดขึ้น(6.5) = 7 ซึ่งมากกว่า 5 ค่าจอด = 3 × 20 + (7 − 5) × 50 = 60 + 100 = 160 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.computational-thinking.p007
    topics: [computer.algorithms.computational-thinking]
    difficulty: 3
    type: numeric
    stem: |
      ไล่รหัสลำลองนี้ เมื่อทำเสร็จ ค่า รวม เป็นเท่าใด

      ```
      รวม ← 0
      สำหรับ i ← 1 ถึง 5:
          ถ้า i หาร 2 ลงตัว:
              รวม ← รวม + i × i
          ไม่เช่นนั้น:
              รวม ← รวม + i
      แสดง รวม
      ```
    answer: { value: 29 }
    hints:
      - "ทำตารางสองคอลัมน์ i และ รวม แล้วไล่ทีละรอบ"
      - "เลขคู่ (2, 4) บวกกำลังสอง เลขคี่ (1, 3, 5) บวกตัวเลขเดิม"
    misconceptions:
      - { match: 55, feedback: "บวกกำลังสองทุกรอบ แต่เลขคี่ต้องบวกแค่ตัวเลขเดิม" }
      - { match: 15, feedback: "บวกตัวเลขเดิมทุกรอบ แต่เลขคู่ต้องบวก i × i" }
    solution: "i = 1 คี่: รวม = 1, i = 2 คู่: 1 + 4 = 5, i = 3 คี่: 5 + 3 = 8, i = 4 คู่: 8 + 16 = 24, i = 5 คี่: 24 + 5 = 29"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.computational-thinking.p008
    topics: [computer.algorithms.computational-thinking]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "นักเรียนทำแอปแนะนำการนั่งรถเมล์ในเมือง ให้บอกว่าควรขึ้นสายใดและลงป้ายใด ข้อมูลใด **จำเป็น** ต้องเก็บในแบบจำลอง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "รายชื่อป้ายรถเมล์ของแต่ละสายเรียงตามลำดับ", correct: true }
      - { id: b, text: "ป้ายที่หลายสายผ่านร่วมกัน (จุดเปลี่ยนสาย)", correct: true }
      - { id: c, text: "สีของตัวรถเมล์แต่ละคัน", feedback: "สีรถไม่มีผลต่อการเลือกสายและป้าย ตัดทิ้งได้" }
      - { id: d, text: "ชื่อคนขับรถแต่ละคน", feedback: "ไม่เกี่ยวกับการวางเส้นทาง เป็นรายละเอียดที่ไม่จำเป็น" }
    hints:
      - "ถามว่าถ้าตัดข้อมูลนี้ทิ้ง แอปยังตอบได้ไหมว่าขึ้นสายใด ลงป้ายใด"
      - "สิ่งที่จำเป็นคือโครงสร้างการเชื่อมต่อของป้าย"
    solution: "แอปต้องรู้ลำดับป้ายของแต่ละสายและจุดที่เปลี่ยนสายได้ จึงจะหาเส้นทางได้ ส่วนสีรถและชื่อคนขับไม่มีผลต่อคำตอบ จึงตัดทิ้งตามหลักนามธรรม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.computational-thinking.p009
    topics: [computer.algorithms.computational-thinking]
    difficulty: 3
    type: mcq
    stem: "เพื่อน 3 คนหารค่าพิซซ่า 450 บาท แต่ละคนจ่าย 150 บาท ถ้าจะเขียนอัลกอริทึมที่ใช้ได้กับ **ทุกจำนวนคนและทุกราคา** ข้อใดเหมาะที่สุด"
    choices:
      - { id: a, text: "รับ ราคา และ จำนวนคน แล้วคำนวณ ต่อคน ← ราคา ÷ จำนวนคน", correct: true }
      - { id: b, text: "ต่อคน ← 150", feedback: "ใช้ได้กับกรณีเดียว ถ้าราคาหรือจำนวนคนเปลี่ยนจะผิด" }
      - { id: c, text: "ต่อคน ← 450 ÷ 3", feedback: "ยังผูกกับตัวเลขของกรณีนี้ ไม่ได้ใช้ตัวแปรแทนข้อมูลที่เปลี่ยนได้" }
      - { id: d, text: "ต่อคน ← ราคา − จำนวนคน", feedback: "การหารเท่า ๆ กันต้องใช้การหาร ไม่ใช่การลบ" }
    hints:
      - "อัลกอริทึมทั่วไปใช้ตัวแปรแทนค่าที่เปลี่ยนได้"
      - "ลองแทน 4 คน 600 บาท ว่าข้อใดยังได้คำตอบถูก"
    solution: "การทำให้ทั่วไป (generalize) คือแทนตัวเลขเฉพาะด้วยตัวแปร ต่อคน ← ราคา ÷ จำนวนคน ใช้ได้กับทุกกรณี เช่น 600 ÷ 4 = 150"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.computational-thinking.p010
    topics: [computer.algorithms.computational-thinking]
    difficulty: 3
    type: match
    stem: "จับคู่ปัญหาในวิชาต่าง ๆ กับอัลกอริทึมที่ใช้แก้ได้"
    pairs:
      - { left: "หาคำว่า \"มะม่วง\" ในพจนานุกรมเล่มหนา", right: "ค้นหาแบบแบ่งครึ่ง" }
      - { left: "นับว่าพบนกแต่ละชนิดกี่ตัวในการสำรวจ", right: "นับความถี่" }
      - { left: "หาจังหวัดที่ฝนตกมากที่สุดในปีนี้", right: "หาค่ามากที่สุด" }
      - { left: "จัดเหตุการณ์สมัยอยุธยาตามปีที่เกิด", right: "เรียงลำดับ" }
    hints:
      - "พจนานุกรมเรียงตามตัวอักษรแล้ว จึงเปิดกลางเล่มแล้วตัดครึ่งได้"
      - "ปัญหาต่างวิชากัน แต่ถ้าโครงสร้างเหมือนกัน ก็ใช้อัลกอริทึมเดียวกันได้"
    solution: "หาคำในพจนานุกรม = ค้นหาแบบแบ่งครึ่ง, นับชนิดนก = นับความถี่, จังหวัดฝนมากที่สุด = หาค่ามากที่สุด, เรียงเหตุการณ์ตามปี = เรียงลำดับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.computational-thinking.p011
    topics: [computer.algorithms.computational-thinking]
    difficulty: 4
    type: numeric
    stem: "พจนานุกรมมี 1,000 หน้า เรียงคำตามตัวอักษร ถ้าเปิดหน้ากลางของช่วงที่เหลือทุกครั้งแล้วตัดครึ่งที่ไม่ใช่ทิ้ง (ค้นหาแบบแบ่งครึ่ง) ในกรณีแย่ที่สุดต้องเปิดอย่างมากกี่ครั้งจึงพบหน้าที่ต้องการ"
    answer: { value: 10, unit: ครั้ง }
    hints:
      - "แต่ละครั้งเหลือหน้าราวครึ่งหนึ่ง ลองหารครึ่งไปเรื่อย ๆ จนเหลือ 1 หน้า"
      - "หา n ที่น้อยที่สุดที่ $2^n$ มากกว่า 1,000"
    misconceptions:
      - { match: 500, feedback: "500 คือการเปิดทีละหน้าครึ่งเล่ม การแบ่งครึ่งตัดทิ้งครั้งละครึ่ง จึงใช้ครั้งน้อยกว่ามาก" }
      - { match: 1000, feedback: "1,000 คือกรณีแย่ที่สุดของการเปิดทีละหน้า ไม่ใช่การแบ่งครึ่ง" }
    solution: "1,000 → 500 → 250 → 125 → 63 → 32 → 16 → 8 → 4 → 2 → 1 ใช้ 10 ครั้ง เพราะ $2^9$ = 512 ยังน้อยกว่า 1,000 แต่ $2^{10}$ = 1,024 มากกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.computational-thinking.p012
    topics: [computer.algorithms.computational-thinking]
    difficulty: 4
    type: order
    stem: "ห้องสมุดโรงเรียนอยากมีระบบยืมคืนหนังสือ เรียงขั้นตอนการใช้แนวคิดเชิงคำนวณออกแบบระบบนี้"
    items:
      - "ทำความเข้าใจปัญหา: ตอนนี้ยืมคืนอย่างไร และติดขัดตรงไหน"
      - "แยกส่วน: ลงทะเบียนสมาชิก ยืม คืน แจ้งเตือนเกินกำหนด"
      - "หารูปแบบ: การยืมและการคืนใช้ข้อมูลชุดเดียวกัน คือรหัสหนังสือ รหัสสมาชิก วันที่"
      - "นามธรรม: เลือกเก็บเฉพาะข้อมูลที่จำเป็นของหนังสือและสมาชิก"
      - "ออกแบบอัลกอริทึมของแต่ละส่วนด้วยรหัสลำลองหรือผังงาน"
      - "ไล่อัลกอริทึมด้วยตัวอย่าง เช่น คืนช้า 3 วัน แล้วปรับแก้"
    hints:
      - "ต้องเข้าใจปัญหาก่อนจึงจะแบ่งได้"
      - "การทดสอบทำได้เมื่อมีอัลกอริทึมแล้ว"
    solution: "เข้าใจปัญหา → แยกส่วน → หารูปแบบที่ใช้ร่วมกัน → เลือกข้อมูลที่จำเป็น → ออกแบบอัลกอริทึม → ทดสอบและปรับ ในงานจริงอาจวนกลับไปแก้ขั้นก่อนหน้าได้"
