  - id: math.calculus.limits.p017
    topics: [math.calculus.limits]
    difficulty: 5
    type: numeric
    stem: "จงหา $\\displaystyle\\lim_{x \\to 4}\\frac{x - 4}{\\sqrt{x} - 2}$"
    answer: { value: 4 }
    hints:
      - "แทนค่าได้ $\\tfrac00$"
      - "เขียน $x - 4 = (\\sqrt x - 2)(\\sqrt x + 2)$ หรือคูณด้วยสังยุค $\\sqrt x + 2$"
    misconceptions:
      - { match: 0.25, feedback: "นี่คือลิมิตของส่วนกลับ $\\tfrac{\\sqrt x - 2}{x - 4}$ หลังตัดได้ $\\sqrt x + 2$ ไม่ใช่ $\\tfrac{1}{\\sqrt x + 2}$" }
      - { match: 0, feedback: "$\\tfrac00$ ยังสรุปไม่ได้ ต้องจัดรูปก่อน" }
    solution: "$\\dfrac{(\\sqrt x - 2)(\\sqrt x + 2)}{\\sqrt x - 2} = \\sqrt x + 2 \\to 2 + 2 = 4$"
