<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" height="250" font-family="sans-serif">
<title>ห้าขั้นแก้ความขัดแย้งอย่างสันติ</title>
<rect x="0" y="0" width="700" height="250" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="350.0" y="28.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">ห้าขั้นแก้ความขัดแย้งอย่างสันติ</text>
<rect x="20.0" y="55.0" width="118.0" height="150.0" rx="10" fill="#dcecf9" stroke="#333" stroke-width="1.5"/>
<text x="79.0" y="85.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">1 หยุด</text>
<text x="79.0" y="106.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">ให้ใจสงบ</text>
<text x="79.0" y="140.0" font-size="12" text-anchor="middle" fill="#222">หายใจช้า ๆ</text>
<text x="79.0" y="158.0" font-size="12" text-anchor="middle" fill="#222">แยกกันพักก่อน</text>
<line x1="140.0" y1="130.0" x2="154.0" y2="130.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="156.0" y="55.0" width="118.0" height="150.0" rx="10" fill="#eaf6e3" stroke="#333" stroke-width="1.5"/>
<text x="215.0" y="85.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">2 ฟัง</text>
<text x="215.0" y="106.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">ให้เข้าใจ</text>
<text x="215.0" y="140.0" font-size="12" text-anchor="middle" fill="#222">ไม่พูดแทรก</text>
<text x="215.0" y="158.0" font-size="12" text-anchor="middle" fill="#222">ถามกลับให้ชัด</text>
<line x1="276.0" y1="130.0" x2="290.0" y2="130.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="292.0" y="55.0" width="118.0" height="150.0" rx="10" fill="#fff4d6" stroke="#333" stroke-width="1.5"/>
<text x="351.0" y="85.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">3 พูด</text>
<text x="351.0" y="106.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">แบบใช้ "ฉัน"</text>
<text x="351.0" y="140.0" font-size="12" text-anchor="middle" fill="#222">บอกความรู้สึก</text>
<text x="351.0" y="158.0" font-size="12" text-anchor="middle" fill="#222">และสิ่งที่ต้องการ</text>
<line x1="412.0" y1="130.0" x2="426.0" y2="130.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="428.0" y="55.0" width="118.0" height="150.0" rx="10" fill="#f3e6f7" stroke="#333" stroke-width="1.5"/>
<text x="487.0" y="85.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">4 หาทางเลือก</text>
<text x="487.0" y="106.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">ร่วมกัน</text>
<text x="487.0" y="140.0" font-size="12" text-anchor="middle" fill="#222">คิดหลายทาง</text>
<text x="487.0" y="158.0" font-size="12" text-anchor="middle" fill="#222">ทุกฝ่ายรับได้</text>
<line x1="548.0" y1="130.0" x2="562.0" y2="130.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="564.0" y="55.0" width="118.0" height="150.0" rx="10" fill="#f9dede" stroke="#333" stroke-width="1.5"/>
<text x="623.0" y="85.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">5 ตกลง</text>
<text x="623.0" y="106.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">ลองทำ ทบทวน</text>
<text x="623.0" y="140.0" font-size="12" text-anchor="middle" fill="#222">ทำตามที่ตกลง</text>
<text x="623.0" y="158.0" font-size="12" text-anchor="middle" fill="#222">ไม่ได้ผลก็คุยใหม่</text>
<text x="350.0" y="232.0" font-size="12" text-anchor="middle" fill="#a00">ถ้ามีการข่มขู่หรือทำร้ายร่างกาย ให้ออกจากสถานการณ์และขอความช่วยเหลือจากผู้ใหญ่ทันที</text>
</svg>
