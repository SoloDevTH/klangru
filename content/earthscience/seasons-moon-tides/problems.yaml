  - id: earthscience.astronomy.seasons-moon-tides.p013
    topics: [earthscience.astronomy.seasons-moon-tides]
    difficulty: 4
    type: mcq
    stem: "ทำไมด้านของโลกที่อยู่ตรงข้ามกับดวงจันทร์จึงมีน้ำนูนขึ้นด้วย"
    choices:
      - { id: a, text: "ดวงจันทร์ดึงด้านไกลน้อยกว่าดึงตัวโลก โลกจึงถูกดึงออกห่างจากน้ำด้านไกล น้ำด้านนั้นเหมือนถูกทิ้งไว้จนนูนออก", correct: true }
      - { id: b, text: "ดวงอาทิตย์ดึงน้ำด้านนั้นทุกครั้ง", feedback: "ส่วนนูนด้านไกลเกิดแม้ดวงอาทิตย์จะอยู่ทิศอื่น สาเหตุคือผลต่างของแรงดึงจากดวงจันทร์" }
      - { id: c, text: "แรงหนีศูนย์กลางจากการหมุนรอบตัวเองของโลกทำให้น้ำด้านเดียวนูน", feedback: "การหมุนรอบตัวเองทำให้ทุกด้านป่องเท่ากันรอบเส้นศูนย์สูตร ไม่ได้ทำให้น้ำนูนเฉพาะด้านตรงข้ามดวงจันทร์" }
      - { id: d, text: "น้ำด้านนั้นร้อนกว่าจึงขยายตัว", feedback: "น้ำขึ้นน้ำลงไม่ได้เกิดจากอุณหภูมิ" }
    hints:
      - "แรงโน้มถ่วงลดลงเมื่อระยะทางเพิ่ม"
      - "เปรียบเทียบแรงที่ดวงจันทร์ดึงน้ำด้านใกล้ ตัวโลก และน้ำด้านไกล"
    solution: "แรงโน้มถ่วงลดลงตามระยะ ดวงจันทร์ดึงน้ำด้านใกล้มากที่สุด ดึงตัวโลกน้อยลง และดึงน้ำด้านไกลน้อยที่สุด ผลต่างนี้ยืดโลกและน้ำออกตามแนวที่ชี้ไปดวงจันทร์ จึงนูนสองด้าน เมื่อโลกหมุนผ่านจึงมีน้ำขึ้นวันละสองครั้ง"
