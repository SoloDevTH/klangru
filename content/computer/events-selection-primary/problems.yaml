problems:
  - id: computer.programming.events-selection-primary.p001
    topics: [computer.programming.events-selection-primary]
    difficulty: 1
    type: mcq
    stem: "ในเกมเก็บผลไม้ ค่าใดเป็นค่าคงที่ คือไม่เปลี่ยนระหว่างเล่น"
    choices:
      - { id: a, text: "คะแนนที่ผู้เล่นทำได้", feedback: "คะแนนเปลี่ยนไปเมื่อจับผลไม้ได้ จึงควรเก็บเป็นตัวแปร" }
      - { id: b, text: "ความกว้างของตะกร้าที่ตั้งไว้", correct: true }
      - { id: c, text: "จำนวนผลไม้ที่ตกลงมาในแต่ละนาที", feedback: "ค่านี้เปลี่ยนไปตามการเล่น จึงเป็นค่าที่เปลี่ยนได้" }
      - { id: d, text: "เวลาที่เหลือของเกม", feedback: "เวลาลดลงเรื่อย ๆ จึงเป็นค่าที่เปลี่ยนได้" }
    hints:
      - "ลองถามว่าค่านั้นจะเปลี่ยนระหว่างที่เกมทำงานหรือไม่"
      - "ค่าที่ผู้ออกแบบตั้งไว้ก่อนเกมเริ่มมักไม่เปลี่ยนในระหว่างเล่น"
    solution: "ความกว้างของตะกร้าเป็นค่าที่ตั้งไว้ก่อนเกมเริ่ม ส่วนคะแนน จำนวนผลไม้ และเวลาที่เหลือเปลี่ยนไประหว่างเล่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.events-selection-primary.p002
    topics: [computer.programming.events-selection-primary]
    difficulty: 1
    type: match
    stem: "จับคู่เหตุการณ์กับสิ่งที่เกิดขึ้นเมื่อเหตุการณ์นั้นเกิด"
    pairs:
      - { left: "เมื่อกดธงเขียว", right: "โปรแกรมเริ่มทำงาน" }
      - { left: "เมื่อกดปุ่มลูกศรซ้าย", right: "ตัวละครขยับไปทางซ้าย" }
      - { left: "เมื่อตัวละครชนผลไม้", right: "บล็อกที่อยู่ข้างใต้ทำงานทันทีที่ชนกัน" }
    hints:
      - "เหตุการณ์คือสิ่งที่เกิดขึ้นแล้วให้โปรแกรมเริ่มทำอะไรบางอย่าง"
      - "ดูว่าแต่ละเหตุการณ์ทำให้เกิดการเคลื่อนไหวหรือการเริ่มต้นแบบใด"
    solution: "เมื่อกดธงเขียวโปรแกรมเริ่มทำงาน เมื่อกดลูกศรซ้ายตัวละครขยับซ้าย และเมื่อชนผลไม้บล็อกข้างใต้จะทำงานทันที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.events-selection-primary.p003
    topics: [computer.programming.events-selection-primary]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นตัวอย่างของการเลือกทาง (เงื่อนไข)"
    choices:
      - { id: a, text: "ถ้าไฟจราจรเป็นสีแดง ให้หยุด", correct: true }
      - { id: b, text: "ทำซ้ำ 4 ครั้ง แล้วหยุด", feedback: "เป็นวงวน ไม่ได้เลือกระหว่างสองทาง" }
      - { id: c, text: "เดินไปข้างหน้า 10 ก้าว", feedback: "เป็นลำดับคำสั่งธรรมดา ไม่มีการตัดสินใจ" }
      - { id: d, text: "เมื่อกดปุ่มเว้นวรรค ให้กระโดด", feedback: "เป็นเหตุการณ์ ไม่ใช่การเลือกทาง" }
    hints:
      - "มองหาคำว่าถ้า ที่บอกให้ตรวจสิ่งหนึ่งก่อนทำ"
      - "การเลือกทางต้องมีเงื่อนไขที่เป็นจริงหรือไม่จริง"
    solution: "ข้อ 'ถ้าไฟจราจรเป็นสีแดง ให้หยุด' มีเงื่อนไขให้ตรวจก่อนตัดสินใจทำ ส่วนข้ออื่นเป็นวงวน ลำดับคำสั่ง หรือเหตุการณ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.events-selection-primary.p004
    topics: [computer.programming.events-selection-primary]
    difficulty: 1
    type: order
    stem: "เรียงลำดับบล็อกของการเริ่มเกมเก็บผลไม้ให้ถูกต้อง"
    items:
      - "เมื่อกดธงเขียว"
      - "ตั้งคะแนนเป็น 0"
      - "ทำซ้ำตลอดไป"
      - "ในวงวน: ถ้าชนตะกร้า แล้วเพิ่มคะแนนอีก 1"
    hints:
      - "บล็อกแรกต้องเป็นเหตุการณ์ที่เริ่มเกม"
      - "ควรตั้งค่าเริ่มต้นให้ตัวแปรก่อนจะเริ่มวงวน"
    solution: "เริ่มจากเมื่อกดธงเขียว แล้วตั้งคะแนนเป็น 0 จากนั้นทำซ้ำตลอดไป และในวงวนจึงตรวจการชนแล้วเพิ่มคะแนน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.events-selection-primary.p005
    topics: [computer.programming.events-selection-primary]
    difficulty: 2
    type: numeric
    stem: "ตัวแปร คะแนน เริ่มที่ 0 ทุกครั้งที่ตะกร้าชนมะม่วงจะเพิ่ม 1 คะแนน และชนสับปะรดจะเพิ่ม 2 คะแนน ถ้าตะกร้าชนมะม่วง 3 ครั้ง และชนสับปะรด 2 ครั้ง คะแนนสุดท้ายเป็นเท่าใด"
    answer: { value: 7, tolerance: 0, unit: "คะแนน" }
    hints:
      - "แยกนับการชนมะม่วงกับการชนสับปะรดออกจากกันก่อน"
      - "คูณจำนวนครั้งของผลไม้แต่ละชนิดด้วยคะแนนของชนิดนั้น แล้วรวมกัน"
    solution: "มะม่วง 3 × 1 = 3 คะแนน สับปะรด 2 × 2 = 4 คะแนน รวม 7 คะแนน"
    misconceptions:
      - { match: 5, feedback: "5 คือการนับทุกครั้งเป็น 1 คะแนนเท่ากันหมด ทั้งที่สับปะรดให้ 2 คะแนน" }
      - { match: 8, feedback: "8 เกิดจากการสลับคะแนนของผลไม้สองชนิด คือ 2 × 1 + 3 × 2" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.events-selection-primary.p006
    topics: [computer.programming.events-selection-primary]
    difficulty: 2
    type: numeric
    stem: "ในวงวน 'ทำซ้ำ 10 ครั้ง' มีบล็อก 'เดิน 5 ก้าว' อยู่ข้างใน ตัวละครจะเดินรวมกันทั้งหมดกี่ก้าว"
    answer: { value: 50, tolerance: 0, unit: "ก้าว" }
    hints:
      - "วงวนทำบล็อกที่อยู่ข้างในซ้ำตามจำนวนรอบ"
      - "จำนวนก้าวทั้งหมดคือจำนวนรอบคูณกับจำนวนก้าวในแต่ละรอบ"
    solution: "ทำซ้ำ 10 ครั้ง ครั้งละ 5 ก้าว รวมเป็น 10 × 5 = 50 ก้าว"
    misconceptions:
      - { match: 15, feedback: "15 เกิดจากการบวกจำนวนรอบกับจำนวนก้าว แทนที่จะคูณกัน" }
      - { match: 45, feedback: "45 เกิดจากการทำซ้ำแค่ 9 ครั้ง ลืมรอบสุดท้ายไป" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.events-selection-primary.p007
    topics: [computer.programming.events-selection-primary]
    difficulty: 2
    type: mcq
    stem: "ต้องการให้ตัวละครเดินไปทางขวาทุกครั้งที่กดปุ่มลูกศรขวา ควรเริ่มด้วยบล็อกใด"
    choices:
      - { id: a, text: "เมื่อกดธงเขียว", feedback: "เป็นการเริ่มโปรแกรม แต่ไม่ได้ผูกกับการกดปุ่มลูกศรขวา" }
      - { id: b, text: "เมื่อกดปุ่มลูกศรขวา", correct: true }
      - { id: c, text: "ถ้าชนขอบ", feedback: "เป็นเงื่อนไข ซึ่งต้องมีเหตุการณ์เริ่มต้นก่อนจึงจะตรวจได้" }
      - { id: d, text: "ทำซ้ำ 3 ครั้ง", feedback: "เป็นวงวน ไม่ได้บอกว่าควรเริ่มเมื่อใด" }
    hints:
      - "ดูว่าการเดินเกิดขึ้นเมื่อสิ่งใดเกิดขึ้น"
      - "บล็อกที่ตรงกับการกดปุ่มเป็นบล็อกประเภทเหตุการณ์"
    solution: "การเดินเกิดขึ้นเมื่อกดปุ่มลูกศรขวา จึงควรเริ่มด้วยบล็อกเหตุการณ์ เมื่อกดปุ่มลูกศรขวา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.events-selection-primary.p008
    topics: [computer.programming.events-selection-primary]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นค่าที่เปลี่ยนได้ระหว่างการเล่นเกม (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "คะแนนที่ผู้เล่นได้", correct: true }
      - { id: b, text: "จำนวนชีวิตที่เหลือ", correct: true }
      - { id: c, text: "ชื่อของเกม", feedback: "ชื่อเกมไม่เปลี่ยนระหว่างเล่น จึงเป็นค่าคงที่" }
      - { id: d, text: "จำนวนผลไม้ที่จับได้ในเกม", correct: true }
    hints:
      - "ลองนึกว่าค่าใดขึ้นหรือลงระหว่างที่กำลังเล่นอยู่"
      - "ค่าที่ตั้งไว้ก่อนเล่นและไม่ถูกเปลี่ยนจะเป็นค่าคงที่"
    solution: "คะแนน ชีวิต และจำนวนผลไม้ที่จับได้เปลี่ยนไประหว่างเล่น ส่วนชื่อเกมคงที่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.events-selection-primary.p009
    topics: [computer.programming.events-selection-primary]
    difficulty: 2
    type: order
    stem: "เรียงลำดับการทำงานของวงวนหนึ่งรอบในเกมเก็บผลไม้"
    items:
      - "ให้ผลไม้เลื่อนลงทีละนิด"
      - "ตรวจว่าผลไม้ชนตะกร้าหรือไม่"
      - "ถ้าชนแล้ว เพิ่มคะแนน"
      - "กลับไปเริ่มรอบใหม่"
    hints:
      - "ต้องขยับผลไม้ก่อนจึงจะตรวจได้ว่าชนหรือไม่"
      - "การเพิ่มคะแนนทำหลังจากตรวจแล้วว่าชนจริงเท่านั้น"
    solution: "ขยับผลไม้ → ตรวจการชน → เพิ่มคะแนนถ้าชนจริง → กลับไปเริ่มรอบใหม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.events-selection-primary.p010
    topics: [computer.programming.events-selection-primary]
    difficulty: 3
    type: numeric
    stem: "เกมเก็บผลไม้เริ่มคะแนนที่ 0 มะม่วงให้ 1 คะแนน สับปะรดให้ 2 คะแนน ระเบิดไม่ให้คะแนนแต่ลดชีวิต ถ้าตะกร้าชนมะม่วง 2 ครั้ง สับปะรด 1 ครั้ง และระเบิด 1 ครั้ง คะแนนสุดท้ายเป็นเท่าใด"
    answer: { value: 4, tolerance: 0, unit: "คะแนน" }
    hints:
      - "ระเบิดไม่เปลี่ยนคะแนน จึงไม่ต้องนำมารวม"
      - "รวมคะแนนของมะม่วงและของสับปะรดเข้าด้วยกัน"
    solution: "มะม่วง 2 × 1 = 2 คะแนน สับปะรด 1 × 2 = 2 คะแนน รวม 4 คะแนน"
    misconceptions:
      - { match: 2, feedback: "2 เกิดจากลืมคะแนนของสับปะรดไป" }
      - { match: 5, feedback: "5 เกิดจากการให้คะแนนระเบิดเป็น 1 คะแนน ทั้งที่ระเบิดไม่ให้คะแนน" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.events-selection-primary.p011
    topics: [computer.programming.events-selection-primary]
    difficulty: 3
    type: mcq
    stem: "ต้องการให้เกมจบเมื่อคะแนนถึง 10 ควรเขียนโปรแกรมอย่างไร"
    choices:
      - { id: a, text: "ถ้า คะแนน ≥ 10 แล้ว หยุดทุกอย่าง", correct: true }
      - { id: b, text: "เมื่อกดธงเขียว ตั้งคะแนนเป็น 10", feedback: "เกมจะเริ่มที่ 10 คะแนนทันที ไม่ได้จบเมื่อคะแนนถึง 10" }
      - { id: c, text: "ทำซ้ำ 10 ครั้ง แล้วหยุด", feedback: "เกมจะจบตามจำนวนรอบ ไม่ได้จบตามคะแนนที่ผู้เล่นทำได้" }
      - { id: d, text: "ตั้งคะแนนเป็น 10 แล้วให้ผลไม้ตกทันที", feedback: "ไม่ได้ทำให้เกมจบ และยังทำให้เกมเริ่มผิดด้วย" }
    hints:
      - "ต้องมีการตรวจคะแนนทุกรอบ ไม่ใช่แค่ครั้งเดียว"
      - "ใช้เงื่อนไขที่เปรียบเทียบคะแนนกับ 10"
    solution: "ใช้เงื่อนไขตรวจคะแนนทุกรอบ ถ้าคะแนนถึง 10 หรือมากกว่า จึงหยุดทุกอย่าง ใช้ ≥ แทน = เพราะคะแนนอาจข้าม 10 ไปได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.events-selection-primary.p012
    topics: [computer.programming.events-selection-primary]
    difficulty: 3
    type: match
    stem: "จับคู่บล็อกแต่ละอย่างกับหน้าที่ของมัน"
    pairs:
      - { left: "เมื่อกดธงเขียว", right: "เหตุการณ์ที่เริ่มโปรแกรม" }
      - { left: "ทำซ้ำ 10 ครั้ง", right: "วงวนที่ทำซ้ำตามจำนวนรอบ" }
      - { left: "ถ้า ... แล้ว", right: "เงื่อนไขที่เลือกว่าจะทำหรือไม่" }
      - { left: "ตั้งคะแนนเป็น 0", right: "กำหนดค่าเริ่มต้นให้ตัวแปร" }
    hints:
      - "ดูว่าบล็อกนั้นเริ่มทำงานเมื่อใด หรือเปลี่ยนค่าอะไร"
      - "บล็อกที่มีคำว่าถ้าเป็นการตัดสินใจ บล็อกที่มีคำว่าทำซ้ำเป็นการวนรอบ"
    solution: "เมื่อกดธงเขียวเป็นเหตุการณ์เริ่มโปรแกรม ทำซ้ำ 10 ครั้งเป็นวงวน ถ้า ... แล้วเป็นเงื่อนไข และตั้งคะแนนเป็น 0 คือการกำหนดค่าเริ่มต้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.events-selection-primary.p013
    topics: [computer.programming.events-selection-primary]
    difficulty: 3
    type: mcq
    stem: "สคริปต์วาง 'ตั้งคะแนนเป็น 0' ไว้ข้างในวงวน 'ทำซ้ำตลอดไป' จะเกิดอะไรขึ้น"
    choices:
      - { id: a, text: "คะแนนจะกลับเป็น 0 ทุกรอบ จึงไม่สะสม", correct: true }
      - { id: b, text: "ตัวละครเดินเร็วขึ้นกว่าเดิม", feedback: "การตั้งค่าคะแนนไม่ได้เปลี่ยนความเร็วของตัวละคร" }
      - { id: c, text: "เกมจบทันทีตั้งแต่เริ่ม", feedback: "วงวนยังคงทำงานต่อ ไม่ได้จบทันที" }
      - { id: d, text: "ไม่มีผลใด ๆ เพราะโปรแกรมไม่สนใจค่าตัวแปร", feedback: "โปรแกรมใช้ค่าตัวแปรทุกครั้งที่ตรวจหรือเพิ่มคะแนน จึงมีผลแน่นอน" }
    hints:
      - "ลองนึกว่าบล็อกนี้จะทำงานกี่ครั้ง"
      - "ถ้าคะแนนถูกตั้งเป็น 0 ทุกรอบ ค่าก่อนหน้าจะยังเหลืออยู่หรือไม่"
    solution: "บล็อกในวงวนทำงานทุกรอบ ทำให้คะแนนถูกรีเซ็ตเป็น 0 ก่อนจะเพิ่มขึ้น จึงไม่สะสมคะแนนจากรอบก่อนหน้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.events-selection-primary.p014
    topics: [computer.programming.events-selection-primary]
    difficulty: 3
    type: numeric
    stem: "ผลไม้ตกลงมาทีละ 3 ก้าวในแต่ละรอบของวงวน ถ้าผลไม้เริ่มห่างจากพื้น 36 ก้าว ต้องทำซ้ำกี่รอบจึงจะถึงพื้น"
    answer: { value: 12, tolerance: 0, unit: "รอบ" }
    hints:
