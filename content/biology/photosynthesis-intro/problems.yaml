      - { id: d, text: "ปลูกใต้หลังคาอาคารเพื่อกันฝน", feedback: "ต้นไม้ต้องการแสงเพื่อสังเคราะห์ด้วยแสง ใต้หลังคาแสงน้อยและไม่มีที่ให้ต้นไม้โต" }
