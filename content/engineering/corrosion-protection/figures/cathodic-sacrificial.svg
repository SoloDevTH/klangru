<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" font-family="sans-serif"><title>การป้องกันแบบแคโทดิกด้วยแอโนดเสียสละสังกะสีต่อกับท่อเหล็กที่ฝังดิน</title><rect x="0" y="0" width="700" height="340" fill="#ffffff"/><rect x="90" y="150" width="520" height="40" rx="18" fill="#8a9bad" stroke="#1f3a5f" stroke-width="2"/><rect x="90" y="150" width="520" height="8" fill="#1f3a5f" opacity="0.5"/><text x="350" y="175" text-anchor="middle" font-size="15" fill="#fff">ท่อเหล็กที่ฝังดิน (ผิวบางส่วนมีรอยรั่วของสารเคลือบ)</text><rect x="150" y="235" width="110" height="52" fill="#b8c4d0" stroke="#1f3a5f" stroke-width="2"/><text x="205" y="268" text-anchor="middle" font-size="14">แอโนดสังกะสี</text><line x1="205" y1="235" x2="205" y2="190" stroke="#1f3a5f" stroke-width="3"/><text x="215" y="215" font-size="13" fill="#b5452b">e⁻ จากสังกะสี</text><line x1="260" y1="150" x2="260" y2="110" stroke="none"/><text x="350" y="120" text-anchor="middle" font-size="15">ดิน (อิเล็กโทรไลต์) ปิดวงจรไอออนรอบท่อและแอโนด</text><text x="350" y="318" text-anchor="middle" font-size="14" fill="#333">สังกะสีถูกกัดก่อน ท่อเหล็กได้รับอิเล็กตรอนจึงเกิดการกัดกร่อนน้อยลง</text></svg>
