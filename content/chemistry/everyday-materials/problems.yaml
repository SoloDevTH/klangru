  - id: chemistry.materials.everyday-materials.p016
    topics: [chemistry.materials.everyday-materials]
    difficulty: 5
    type: mcq
    stem: "เพื่อนบอกว่า \"ซื้อน้ำขวดพลาสติกวันละขวดก็ได้ เพราะเดี๋ยวก็เอาไปรีไซเคิล\" เหตุผลใดอธิบายได้ดีที่สุดว่าการพกกระบอกน้ำไปเติมน้ำ (ใช้ซ้ำ) ดีกว่า"
    choices:
      - { id: a, text: "การรีไซเคิลยังต้องใช้พลังงานขนส่งและหลอม และขวดบางส่วนไม่ได้ถูกเก็บไปรีไซเคิล การใช้ซ้ำจึงไม่ต้องผลิตขวดใหม่เลย", correct: true, feedback: "ถูก ลดการใช้และใช้ซ้ำช่วยประหยัดทรัพยากรได้มากกว่า" }
      - { id: b, text: "พลาสติกรีไซเคิลไม่ได้เลย", feedback: "ขวดพลาสติกใสรีไซเคิลได้ แต่การรีไซเคิลก็ยังใช้พลังงานและทรัพยากร" }
      - { id: c, text: "กระบอกน้ำไม่มีวันเสีย", feedback: "กระบอกน้ำก็เสื่อมได้ แต่ใช้ซ้ำได้หลายร้อยครั้ง จึงลดขยะได้มาก" }
    hints:
      - "รีไซเคิลต้องเก็บ ขนส่ง บด และหลอม ขั้นเหล่านี้ใช้อะไรบ้าง"
      - "ขวดที่ทิ้งทุกขวดถูกนำไปรีไซเคิลจริงหรือไม่"
    solution: "รีไซเคิลดีกว่าทิ้งเฉย ๆ แต่ **ยังต้องใช้พลังงาน น้ำ และการขนส่ง** และขวดจำนวนมากหลุดไปเป็นขยะในทะเลหรือหลุมฝังกลบ การใช้กระบอกน้ำซ้ำทำให้ไม่ต้องผลิตขวดใหม่เลย จึงช่วยประหยัดทรัพยากรที่มีจำกัดได้มากกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true
