      - { match: 150000, feedback: "ลืมเปลี่ยนกรัมเป็นกิโลกรัม 3,000 กรัมคือ 3 กิโลกรัม" }
    hints:
      - "หาน้ำหนักรวมของกระป๋อง 200 ใบเป็นกรัมก่อน"
