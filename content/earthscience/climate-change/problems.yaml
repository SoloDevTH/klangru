      - { match: 675, feedback: "675 มาจาก 1.5 × 0.45 × 1,000 ต้องหาร 1.5 ด้วย 0.45 ไม่ใช่คูณ" }
    hints:
      - "CO₂ สะสมที่ทำให้ร้อน 1.5 °C = 1.5 ÷ 0.45 × 1,000"
      - "ลบส่วนที่ปล่อยไปแล้วออก"
    solution: "CO₂ สะสมที่ทำให้ร้อน 1.5 °C $= 1.5 / 0.45 \\times 1{,}000 \\approx 3{,}333$ Gt เหลือ $3{,}333 - 2{,}390 \\approx 943$ Gt ค่าที่ IPCC ประเมินคือราว 500 Gt น้อยกว่านี้ เพราะต้องเผื่อการร้อนขึ้นจากมีเทน แก๊สอื่น และความไม่แน่นอน"
