problems:
  - id: math.measure.area-units.p001
    topics: [math.measure.area-units]
    difficulty: 1
    type: mcq
    stem: "นักเรียนสามคนใช้แผ่นสี่เหลี่ยมวัดพื้นที่ของรูปสี่เหลี่ยมผืนผ้าเดียวกัน แบบใดวัดพื้นที่ได้ถูกต้อง"
    figure: { src: tiling-check.svg, alt: "รูปสี่เหลี่ยมผืนผ้าเดียวกันสามรูป แบบ A วางแผ่นสี่เหลี่ยม 6 แผ่นห่างกัน มีช่องว่างระหว่างแผ่นและรอบขอบ แบบ B วางแผ่นสี่เหลี่ยมใหญ่ 6 แผ่นที่ทับกันเป็นแถบสีเข้มสองแถบ แบบ C ปูแผ่นสี่เหลี่ยม 12 แผ่นชิดกันเต็มรูปพอดี" }
    choices:
      - { id: a, text: "แบบ A", feedback: "แบบ A มีช่องว่างระหว่างแผ่น ส่วนที่ไม่ถูกปิดไม่ได้ถูกนับ จึงได้พื้นที่น้อยเกินจริง" }
      - { id: b, text: "แบบ B", feedback: "แบบ B มีแผ่นที่ทับกัน ส่วนที่ทับถูกนับสองครั้ง" }
      - { id: c, text: "แบบ C", correct: true }
    hints:
      - "การปูที่ถูกต้องต้องไม่มีช่องว่าง"
      - "และแผ่นต้องไม่ทับกัน"
    solution: "แบบ C ปูแผ่นชิดกันเต็มรูปพอดี ไม่มีช่องว่างและไม่ทับกัน จึงวัดพื้นที่ได้ถูกต้อง (12 แผ่น)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.area-units.p002
    topics: [math.measure.area-units]
    difficulty: 1
    type: numeric
    stem: "รูป A ในภาพมีพื้นที่กี่ตารางหน่วย"
    figure: { src: shapes-ab.svg, alt: "กระดาษตาราง รูป A เป็นสี่เหลี่ยมผืนผ้าสีฟ้า กว้าง 4 ช่อง สูง 3 ช่อง รูป B เป็นรูปตัวแอลสีส้ม ส่วนบนกว้าง 2 ช่อง สูง 4 ช่อง และมีส่วนต่อด้านล่างขวากว้าง 2 ช่อง สูง 2 ช่อง" }
    answer: { value: 12, unit: ตารางหน่วย }
    hints:
      - "นับช่องในรูป A ทีละแถว"
      - "รูป A มีกี่แถว แถวละกี่ช่อง"
    misconceptions:
      - { match: 14, feedback: "14 คือจำนวนขอบรอบรูป (ความยาวรอบรูป) พื้นที่ต้องนับช่องข้างใน" }
      - { match: 7, feedback: "บวกจำนวนช่องด้านกว้างกับด้านสูง (4 + 3) ต้องนับทุกช่องในรูป" }
    solution: "รูป A มี 3 แถว แถวละ 4 ช่อง พื้นที่ $= 4 + 4 + 4 = 3 \\times 4 = 12$ ตารางหน่วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.area-units.p003
    topics: [math.measure.area-units]
    difficulty: 2
    type: mcq
    stem: "จากภาพ รูปใดมีพื้นที่มากกว่า"
    figure: { src: shapes-ab.svg, alt: "กระดาษตาราง รูป A เป็นสี่เหลี่ยมผืนผ้าสีฟ้า กว้าง 4 ช่อง สูง 3 ช่อง รูป B เป็นรูปตัวแอลสีส้ม ส่วนบนกว้าง 2 ช่อง สูง 4 ช่อง และมีส่วนต่อด้านล่างขวากว้าง 2 ช่อง สูง 2 ช่อง" }
    choices:
      - { id: a, text: "รูป A", feedback: "รูป A มี 12 ช่อง ลองนับช่องของรูป B ด้วย" }
      - { id: b, text: "รูป B", feedback: "รูป B สูงกว่าจึงดูใหญ่กว่า แต่เมื่อนับจริงได้ 12 ช่อง" }
      - { id: c, text: "พื้นที่เท่ากัน", correct: true }
    hints:
      - "อย่าตัดสินจากรูปร่าง ให้นับช่อง"
      - "แบ่งรูป B เป็นสองสี่เหลี่ยม: ส่วนบน 2 × 4 และส่วนต่อ 2 × 2"
    solution: "รูป A: $3 \\times 4 = 12$ ช่อง รูป B: $8 + 4 = 12$ ช่อง จึงมีพื้นที่เท่ากัน คือ 12 ตารางหน่วย แม้รูปร่างต่างกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.area-units.p004
    topics: [math.measure.area-units]
    difficulty: 2
    type: numeric
    stem: "สี่เหลี่ยมผืนผ้ารูปหนึ่งแบ่งเป็นตารางหน่วยได้ 4 แถว แถวละ 6 ช่อง มีพื้นที่กี่ตารางหน่วย"
    answer: { value: 24, unit: ตารางหน่วย }
    hints:
      - "ทุกแถวมี 6 ช่องเท่ากัน"
      - "บวก 6 สี่ครั้ง หรือคูณ 4 กับ 6"
    misconceptions:
      - { match: 10, feedback: "บวก 4 กับ 6 แต่ต้องมี 6 ช่องในทุกแถว ทั้งหมด 4 แถว" }
      - { match: 20, feedback: "20 คือความยาวรอบรูป ($6 + 4 + 6 + 4$) ไม่ใช่พื้นที่" }
    solution: "$6 + 6 + 6 + 6 = 4 \\times 6 = 24$ ตารางหน่วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.area-units.p005
    topics: [math.measure.area-units]
    difficulty: 2
    type: match
    stem: "จับคู่สิ่งที่ต้องการวัดกับหน่วยที่เหมาะที่สุด"
    pairs:
      - { left: "พื้นที่ของแสตมป์ 1 ดวง", right: "ตารางเซนติเมตร" }
      - { left: "พื้นที่ของสนามฟุตบอล", right: "ตารางเมตร" }
      - { left: "ความยาวของดินสอ", right: "เซนติเมตร" }
      - { left: "ระยะทางรอบสนามฟุตบอล", right: "เมตร" }
    hints:
      - "พื้นที่ใช้หน่วยที่มีคำว่า ตาราง ความยาวและระยะรอบรูปใช้หน่วยความยาว"
      - "ของเล็กใช้เซนติเมตร ของใหญ่ใช้เมตร"
    solution: "แสตมป์เล็กวัดพื้นที่เป็นตารางเซนติเมตร สนามใหญ่วัดพื้นที่เป็นตารางเมตร ดินสอวัดความยาวเป็นเซนติเมตร ระยะรอบสนามเป็นความยาวรอบรูป วัดเป็นเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.area-units.p006
    topics: [math.measure.area-units]
    difficulty: 2
    type: numeric
    stem: "น้องมะปรางวาดภาพลงกระดาษสี่เหลี่ยมผืนผ้ากว้าง 3 เซนติเมตร ยาว 5 เซนติเมตร แล้วติดริบบิ้นรอบขอบกระดาษพอดีหนึ่งรอบ ใช้ริบบิ้นยาวกี่เซนติเมตร"
    answer: { value: 16, unit: cm }
    hints:
      - "ริบบิ้นรอบขอบคือความยาวรอบรูป"
      - "สี่เหลี่ยมผืนผ้ามี 4 ด้าน: 3, 5, 3 และ 5 เซนติเมตร"
    misconceptions:
      - { match: 15, feedback: "15 คือพื้นที่ ($3 \\times 5$ ตารางเซนติเมตร) ริบบิ้นรอบขอบต้องใช้ความยาวรอบรูป" }
      - { match: 8, feedback: "บวกแค่สองด้าน สี่เหลี่ยมผืนผ้ามี 4 ด้าน" }
    solution: "ความยาวรอบรูป $= 3 + 5 + 3 + 5 = 16$ เซนติเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.area-units.p007
    topics: [math.measure.area-units]
    difficulty: 1
    type: mcq
    stem: "ถ้าต้องการบอกว่าปกสมุดกว้างขวางแค่ไหน (พื้นที่) ควรใช้หน่วยใด"
    choices:
      - { id: a, text: "ตารางเซนติเมตร", correct: true }
      - { id: b, text: "เซนติเมตร", feedback: "เซนติเมตรใช้วัดความยาว เช่น ความยาวขอบสมุด พื้นที่ใช้ตารางเซนติเมตร" }
      - { id: c, text: "กิโลกรัม", feedback: "กิโลกรัมใช้วัดน้ำหนัก ไม่ใช่พื้นที่" }
      - { id: d, text: "ตารางกิโลเมตร", feedback: "ตารางกิโลเมตรใหญ่มาก ใช้กับพื้นที่ของจังหวัดหรือประเทศ" }
    hints:
      - "หน่วยของพื้นที่มีคำว่า ตาราง"
      - "ปกสมุดเล็ก ใช้หน่วยเล็ก"
    solution: "พื้นที่ของปกสมุดวัดเป็นตารางเซนติเมตร (จัตุรัสด้านละ 1 เซนติเมตร)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.area-units.p008
    topics: [math.measure.area-units]
    difficulty: 3
    type: numeric
    stem: "รูปตัวทีในภาพมีพื้นที่กี่ตารางเซนติเมตร (1 ช่องเป็น 1 ตารางเซนติเมตร)"
    figure: { src: t-shape-problem.svg, alt: "รูปตัวทีบนกระดาษตาราง ส่วนบนเป็นแถบแนวนอนกว้าง 6 ช่อง สูง 2 ช่อง ส่วนล่างเป็นแถบแนวตั้งกว้าง 2 ช่อง สูง 3 ช่อง อยู่กึ่งกลางใต้แถบบน ใต้ภาพเขียนว่า 1 ช่อง = 1 ตารางเซนติเมตร" }
    answer: { value: 18, unit: ตร.ซม. }
    hints:
      - "แบ่งตัวทีเป็นสองสี่เหลี่ยม: แถบบนและแถบล่าง"
      - "แถบบน 2 แถว แถวละ 6 ช่อง แถบล่าง 3 แถว แถวละ 2 ช่อง"
    misconceptions:
      - { match: 22, feedback: "22 คือความยาวรอบรูป (นับขอบ) พื้นที่ต้องนับช่องข้างใน" }
      - { match: 12, feedback: "นับแค่แถบบน อย่าลืมแถบล่างอีก 6 ช่อง" }
    solution: "แถบบน $2 \\times 6 = 12$ ช่อง แถบล่าง $3 \\times 2 = 6$ ช่อง พื้นที่ $= 12 + 6 = 18$ ตารางเซนติเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.area-units.p009
    topics: [math.measure.area-units]
    difficulty: 3
    type: numeric
    stem: "รูปตัวทีในภาพมีความยาวรอบรูปกี่เซนติเมตร (ด้านของช่องยาว 1 เซนติเมตร)"
    figure: { src: t-shape-problem.svg, alt: "รูปตัวทีบนกระดาษตาราง ส่วนบนเป็นแถบแนวนอนกว้าง 6 ช่อง สูง 2 ช่อง ส่วนล่างเป็นแถบแนวตั้งกว้าง 2 ช่อง สูง 3 ช่อง อยู่กึ่งกลางใต้แถบบน ใต้ภาพเขียนว่า 1 ช่อง = 1 ตารางเซนติเมตร" }
    answer: { value: 22, unit: cm }
    hints:
      - "เดินรอบขอบจากมุมซ้ายบน จดความยาวทีละด้าน"
      - "ด้านทั้งหมดมี 8 ด้าน ได้แก่ 6, 2, 2, 3, 2, 3, 2, 2"
    misconceptions:
      - { match: 18, feedback: "18 คือจำนวนช่อง (พื้นที่) ความยาวรอบรูปต้องนับขอบรอบรูป" }
      - { match: 20, feedback: "ลืมขอบสั้นยาว 2 หน่วยใต้แถบบนไปหนึ่งด้าน ตัวทีมีขอบใต้แถบบนทั้งด้านซ้ายและด้านขวา" }
    solution: "เดินรอบขอบตามเข็มนาฬิกาจากมุมซ้ายบน: บน 6 ขวา 2 ใต้แถบบนด้านขวา 2 ด้านขวาของแถบล่าง 3 ล่าง 2 ด้านซ้ายของแถบล่าง 3 ใต้แถบบนด้านซ้าย 2 ซ้าย 2 รวม $6 + 2 + 2 + 3 + 2 + 3 + 2 + 2 = 22$ เซนติเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.area-units.p010
    topics: [math.measure.area-units]
    difficulty: 3
    type: numeric
    stem: "พื้นห้องน้ำต้องปูกระเบื้อง 4 แถว แถวละ 3 แผ่น ช่างปูไปแล้ว 5 แผ่น ต้องปูอีกกี่แผ่นจึงจะเต็มพื้น"
    answer: { value: 7, unit: แผ่น }
    hints:
      - "หาจำนวนกระเบื้องทั้งหมดก่อน"
      - "ทั้งหมด $4 \\times 3$ แผ่น แล้วลบจำนวนที่ปูแล้ว"
    misconceptions:
      - { match: 12, feedback: "12 คือจำนวนทั้งหมด ต้องลบ 5 แผ่นที่ปูไปแล้ว" }
      - { match: 2, feedback: "ใช้ $4 + 3 - 5$ แต่กระเบื้องทั้งหมดคือ 4 แถว แถวละ 3 แผ่น ต้องคูณ" }
    solution: "กระเบื้องทั้งหมด $4 \\times 3 = 12$ แผ่น ปูแล้ว 5 แผ่น ต้องปูอีก $12 - 5 = 7$ แผ่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.area-units.p011
    topics: [math.measure.area-units]
    difficulty: 2
    type: numeric
    stem: "รูปสามเหลี่ยมมีด้านยาว 3 เซนติเมตร 4 เซนติเมตร และ 5 เซนติเมตร มีความยาวรอบรูปกี่เซนติเมตร"
    answer: { value: 12, unit: cm }
    hints:
      - "ความยาวรอบรูปคือผลรวมความยาวของทุกด้าน"
      - "สามเหลี่ยมมี 3 ด้าน"
    misconceptions:
      - { match: 60, feedback: "คูณความยาวด้านเข้าด้วยกัน ความยาวรอบรูปต้องบวก" }
      - { match: 7, feedback: "บวกแค่สองด้าน สามเหลี่ยมมีสามด้าน" }
    solution: "ความยาวรอบรูป $= 3 + 4 + 5 = 12$ เซนติเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.area-units.p012
    topics: [math.measure.area-units]
    difficulty: 3
    type: order
    stem: "เรียงสี่เหลี่ยมผืนผ้าบนกระดาษตารางจากพื้นที่น้อยที่สุดไปมากที่สุด"
    items:
      - "3 แถว แถวละ 3 ช่อง"
      - "1 แถว แถวละ 10 ช่อง"
      - "2 แถว แถวละ 6 ช่อง"
      - "4 แถว แถวละ 4 ช่อง"
    hints:
      - "หาพื้นที่ของแต่ละรูปด้วยการคูณจำนวนแถวกับจำนวนช่องต่อแถว"
      - "พื้นที่คือ 9, 10, 12 และ 16 ตารางหน่วย จับคู่ให้ถูกรูป"
    solution: "$3 \\times 3 = 9$, $1 \\times 10 = 10$, $2 \\times 6 = 12$, $4 \\times 4 = 16$ เรียงจากน้อยไปมาก: 3 แถวแถวละ 3, 1 แถวแถวละ 10, 2 แถวแถวละ 6, 4 แถวแถวละ 4 (รูปยาวผอม 1 × 10 มีพื้นที่น้อยกว่า 2 × 6 แม้จะดูยาวกว่า)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.area-units.p013
    topics: [math.measure.area-units]
    difficulty: 4
    type: numeric
    stem: "รูปบ้านในภาพมีพื้นที่กี่ตารางหน่วย"
    figure: { src: house-problem.svg, alt: "รูปบ้านบนกระดาษตาราง ตัวบ้านเป็นสี่เหลี่ยมผืนผ้ากว้าง 4 ช่อง สูง 3 ช่อง หลังคาเป็นสามเหลี่ยมฐานกว้าง 4 ช่อง สูง 2 ช่อง ยอดอยู่กึ่งกลาง ขอบหลังคาตัดช่องตามแนวทแยง หลังคามีช่องเต็ม 2 ช่องและครึ่งช่อง 4 ชิ้น" }
    answer: { value: 16, unit: ตารางหน่วย }
    hints:
      - "นับตัวบ้านก่อน แล้วนับหลังคาแยก"
      - "บนหลังคา ครึ่งช่อง 2 ชิ้นรวมเป็น 1 ช่อง"
    misconceptions:
      - { match: 18, feedback: "นับครึ่งช่องเป็นช่องเต็ม ครึ่งช่อง 4 ชิ้นเท่ากับ 2 ช่องเท่านั้น" }
      - { match: 14, feedback: "ลืมครึ่งช่องบนหลังคา ครึ่งช่อง 4 ชิ้นรวมกันได้อีก 2 ช่อง" }
    solution: "ตัวบ้าน $3 \\times 4 = 12$ ช่อง หลังคามีช่องเต็ม 2 ช่อง และครึ่งช่อง 4 ชิ้น $= 2$ ช่อง พื้นที่รวม $12 + 2 + 2 = 16$ ตารางหน่วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.area-units.p014
    topics: [math.measure.area-units]
    difficulty: 4
    type: numeric
