<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 370" width="980" height="370" font-family="'Sarabun','Noto Sans Thai','Noto Sans Thai UI','Leelawadee UI','Tahoma','Loma',sans-serif">
<title>ลักษณะสังเกตคำยืมจากภาษาต่าง ๆ ในภาษาไทย</title>
<defs></defs>
<rect x="0" y="0" width="980" height="370" fill="#fff"/>
<text x="20.0" y="34.0" font-size="20" text-anchor="start" fill="#1f5fbf" font-weight="bold">คำยืมในภาษาไทย: ลักษณะที่ช่วยเดา (ตรวจที่มาจริงในพจนานุกรม)</text>
<rect x="14.0" y="56.0" width="186.0" height="52.0" rx="10" fill="#6a1b9a" stroke="#6a1b9a" stroke-width="1.5"/>
