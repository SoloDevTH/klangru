- id: thai.reading.comprehension.p016
  topics:
  - thai.reading.comprehension
  difficulty: 5
  type: mcq
  stem: นักเรียนสองคนอ่านบทความ 720 คำ แดงใช้ 4 นาทีและตอบถูก 3 ใน 5 ข้อ ดำใช้ 6 นาทีและตอบถูก 5 ใน 5 ข้อ ข้อใดสรุป **ถูกต้อง**
  choices:
  - id: a
    text: แดงอ่านเร็วกว่า (180 กับ 120 คำต่อนาที) แต่ดำเข้าใจเรื่องมากกว่า การอ่านที่ดีต้องดูทั้งความเร็วและความเข้าใจ
    correct: true
    feedback: ถูก คำนวณถูกและตีความครบ
  - id: b
    text: แดงอ่านเก่งกว่า เพราะอ่านเร็วกว่า
    feedback: ดูแค่ความเร็ว ไม่ดูความเข้าใจ
  - id: c
    text: ดำอ่านเร็วกว่า เพราะตอบถูกมากกว่า
    feedback: คะแนนไม่ได้บอกความเร็ว ดำใช้เวลามากกว่า
  - id: d
    text: ทั้งสองอ่านเร็วเท่ากัน
    feedback: 720 ÷ 4 = 180 ไม่เท่ากับ 720 ÷ 6 = 120
  hints:
  - คำนวณคำต่อนาทีของแต่ละคน
  - ดูทั้งความเร็วและจำนวนข้อที่ตอบถูก
  solution: แดง $720 \div 4 = 180$ ดำ $720 \div 6 = 120$ คำต่อนาที แดงเร็วกว่าแต่ดำเข้าใจมากกว่า
