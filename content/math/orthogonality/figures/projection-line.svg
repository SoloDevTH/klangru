<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" font-family="sans-serif">
<title>ภาพฉายของเวกเตอร์ b บนเส้นตรงที่มีทิศทาง a พร้อมส่วนเหลือที่ตั้งฉาก</title>
<rect width="480" height="320" fill="#ffffff"/>
<defs><marker id="m" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#333"/></marker></defs>
<line x1="40" y1="250" x2="450" y2="250" stroke="#bbb"/>
<line x1="110" y1="20" x2="110" y2="300" stroke="#bbb"/>
<line x1="56.0" y1="322.0" x2="260.0" y2="50.0" stroke="#8a9bb0" stroke-width="2"/>
<line x1="110" y1="250" x2="310" y2="200" stroke="#1f5fa8" stroke-width="3" marker-end="url(#m)"/>
<line x1="110" y1="250" x2="206.0" y2="122.0" stroke="#d35400" stroke-width="3" marker-end="url(#m)"/>
<line x1="206.0" y1="122.0" x2="310" y2="200" stroke="#666" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#m)"/>
<rect x="206.0" y="122.0" width="8" height="8" fill="none" stroke="#333" transform="translate(-4,-4)"/>
<text x="318" y="204" font-size="16" fill="#1f5fa8">b</text>
<text x="188.0" y="114.0" font-size="16" fill="#d35400">p</text>
<text x="268.0" y="161.0" font-size="16" fill="#555">e</text>
<text x="266.0" y="54.0" font-size="16" fill="#8a9bb0">เส้นทิศทาง a</text>
<text x="300" y="296" font-size="13" fill="#444">e = b − p ตั้งฉากกับเส้นเสมอ</text>
</svg>
