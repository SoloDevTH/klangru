  type: mcq
  stem: พี่ชายของเพื่อนถูกจับเพราะครอบครองยาบ้าจำนวนมากซึ่งมีพฤติการณ์ว่ามีไว้เพื่อจำหน่าย ข้อใดวิเคราะห์ผลกระทบได้ถูกต้อง (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: ความผิดฐานมีไว้เพื่อจำหน่ายมีโทษหนักกว่าการเสพมาก
    correct: true
    feedback: ถูก
  - id: b
    text: ทรัพย์สินที่ได้จากการค้าอาจถูกยึดหรืออายัด
    correct: true
