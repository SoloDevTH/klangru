<text x="320.0" y="205.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">เหลือง</text>
<text x="320.0" y="228.0" font-size="13" text-anchor="middle" fill="#111">ดื่มน้ำเพิ่มอีกหน่อย</text>
<path d="M460,60 L560,60 L550,170 Q510,182 470,170 Z" fill="#ffffff" stroke="#555" stroke-width="2"/>
