<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" font-family="'Sarabun','Noto Sans Thai','Noto Sans Thai UI','Leelawadee UI','Tahoma','Loma',sans-serif">
<title>บัตรบันทึกการศึกษาค้นคว้าที่ยังไม่ครบ</title>
<defs></defs>
<rect x="0" y="0" width="820" height="300" fill="#fff"/>
<rect x="10.0" y="10.0" width="800.0" height="280.0" rx="10" fill="#fffde7" stroke="#8d6e63" stroke-width="2"/>
<line x1="10.0" y1="64.0" x2="810.0" y2="64.0" stroke="#c62828" stroke-width="1.5" stroke-linecap="round"/>
<text x="30.0" y="46.0" font-size="18" text-anchor="start" fill="#5d4037" font-weight="bold">บัตรบันทึก (สมมติ)   หัวข้อ: รากของต้นโกงกาง</text>
<text x="30.0" y="110.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">"รากค้ำยันช่วยดักตะกอนและลดความแรงของคลื่นที่ซัดเข้าฝั่ง"</text>
<text x="30.0" y="154.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal"></text>
<text x="30.0" y="198.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">ที่มา: หนังสือ ป่าชายเลนกับชายฝั่งไทย สำนักพิมพ์สมมติ</text>
<line x1="30.0" y1="240.0" x2="790.0" y2="240.0" stroke="#e0d6c0" stroke-width="1" stroke-linecap="round"/>
<line x1="30.0" y1="240.0" x2="790.0" y2="240.0" stroke="#e0d6c0" stroke-width="1" stroke-linecap="round"/>
<line x1="30.0" y1="240.0" x2="790.0" y2="240.0" stroke="#e0d6c0" stroke-width="1" stroke-linecap="round"/>
<line x1="30.0" y1="240.0" x2="790.0" y2="240.0" stroke="#e0d6c0" stroke-width="1" stroke-linecap="round"/>
</svg>
