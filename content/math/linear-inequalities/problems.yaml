problems:
  - id: math.ineq.p001
    topics: [math.algebra.linear-inequalities]
    difficulty: 1
    type: mcq
    stem: "ข้อใดแสดงคำตอบของ $x \\ge 3$ บนเส้นจำนวนได้ถูกต้อง"
    choices:
      - { id: a, text: "วงกลมทึบที่ 3 และลูกศรชี้ไปทางขวา", correct: true }
      - { id: b, text: "วงกลมโปร่งที่ 3 และลูกศรชี้ไปทางขวา", feedback: "ทิศถูกแล้ว แต่ $\\ge$ รวม 3 ด้วย จึงต้องใช้วงกลมทึบ วงกลมโปร่งใช้กับ $>$" }
      - { id: c, text: "วงกลมทึบที่ 3 และลูกศรชี้ไปทางซ้าย", feedback: "ทางซ้ายคือจำนวนที่น้อยกว่า 3 แต่ $x \\ge 3$ หมายถึงจำนวนที่มากกว่าหรือเท่ากับ 3" }
    hints:
      - "$\\ge$ อ่านว่ามากกว่าหรือเท่ากับ ตัว 3 เองเป็นคำตอบหรือไม่"
      - "บนเส้นจำนวน จำนวนที่มากกว่าอยู่ทางขวา"
    solution: "$x \\ge 3$ รวม 3 ด้วย จึงใช้วงกลมทึบที่ 3 และคำตอบคือจำนวนที่มากกว่า 3 ซึ่งอยู่ทางขวา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ineq.p002
    topics: [math.algebra.linear-inequalities]
    difficulty: 1
    type: mcq
    multiple: true
    stem: "จำนวนใดเป็นคำตอบของ $x + 4 < 10$ (เลือกได้มากกว่า 1 ข้อ)"
    choices:
      - { id: a, text: "$5$", correct: true }
      - { id: b, text: "$6$", feedback: "$6 + 4 = 10$ ซึ่งไม่น้อยกว่า 10 เครื่องหมาย $<$ ไม่รวมค่าที่ทำให้สองข้างเท่ากัน" }
      - { id: c, text: "$-3$", correct: true }
      - { id: d, text: "$0$", correct: true }
      - { id: e, text: "$14$", feedback: "ดูเหมือนบวก 4 ทั้งสองข้างได้ $x < 14$ ต้องลบ 4 ได้ $x < 6$ ลองแทนค่า $14 + 4 = 18$ ไม่น้อยกว่า 10" }
    hints:
      - "แทนค่าแต่ละตัวลงใน $x + 4$ แล้วดูว่าน้อยกว่า 10 หรือไม่"
      - "หรือแก้อสมการก่อนด้วยการลบ 4 ทั้งสองข้าง"
    solution: "ลบ 4 ทั้งสองข้างได้ $x < 6$ จำนวนที่น้อยกว่า 6 คือ $5$, $0$ และ $-3$ ส่วน 6 ทำให้ได้ $10 < 10$ ซึ่งไม่จริง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ineq.p003
    topics: [math.algebra.linear-inequalities]
    difficulty: 2
    type: numeric
    stem: "ค่า $x$ ที่มากที่สุดที่ทำให้ $3x - 5 \\le 7$ เป็นจริงคือเท่าใด"
    answer: { value: 4 }
    hints:
      - "แก้อสมการแบบเดียวกับสมการ: แกะ $-5$ ออกก่อน"
      - "บวก 5 ทั้งสองข้าง แล้วหารด้วย 3"
    misconceptions:
      - { match: 0.667, feedback: "ดูเหมือนลบ 5 ทั้งสองข้าง การแกะ $-5$ ต้องบวก 5 ได้ $3x \\le 12$" }
      - { match: 36, feedback: "ดูเหมือนคูณด้วย 3 ต้องหารด้วย 3 จึงจะเหลือ $x$ ตัวเดียว" }
    solution: "$3x - 5 \\le 7$ → บวก 5: $3x \\le 12$ → หาร 3: $x \\le 4$ ค่าที่มากที่สุดคือ 4 ตรวจ: $3(4) - 5 = 7 \\le 7$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ineq.p004
    topics: [math.algebra.linear-inequalities]
    difficulty: 2
    type: text
    stem: "แก้อสมการ $x - 3 > -5$ (พิมพ์ในรูปเช่น x>4 หรือ x<4)"
    accepted: ["x>-2", "-2<x", "x>−2", "−2<x"]
    hints:
      - "ต้องแกะ $-3$ ออกจาก $x$"
      - "บวก 3 ทั้งสองข้าง การบวกหรือลบไม่ทำให้ต้องกลับเครื่องหมาย"
    misconceptions:
      - { match: "x<-2", feedback: "ไม่ต้องกลับเครื่องหมาย เพราะเราแค่บวก 3 ทั้งสองข้าง ต้องกลับเฉพาะเมื่อคูณหรือหารด้วยจำนวนลบ" }
      - { match: "x>-8", feedback: "ดูเหมือนลบ 3 ทั้งสองข้าง การแกะ $-3$ ต้องบวก 3: $-5 + 3 = -2$" }
    solution: "บวก 3 ทั้งสองข้าง: $x > -5 + 3$ ได้ $x > -2$ ตรวจด้วย $x = 0$: $0 - 3 = -3 > -5$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ineq.p005
    topics: [math.algebra.linear-inequalities]
    difficulty: 2
    type: mcq
    stem: "วิชาหนึ่งต้องได้คะแนนรวมอย่างน้อย 50 คะแนนจึงจะผ่าน นิดได้คะแนนเก็บแล้ว 32 คะแนน ให้ $x$ แทนคะแนนสอบปลายภาค อสมการใดแสดงเงื่อนไขที่นิดสอบผ่าน"
    choices:
      - { id: a, text: "$32 + x \\ge 50$", correct: true }
      - { id: b, text: "$32 + x > 50$", feedback: "\"อย่างน้อย 50\" รวม 50 พอดีด้วย ถ้าได้รวม 50 คะแนนก็ผ่าน จึงต้องใช้ $\\ge$" }
      - { id: c, text: "$32 + x \\le 50$", feedback: "ทิศกลับกัน $\\le$ แปลว่า \"ไม่เกิน\" แต่โจทย์บอกว่าต้องได้ \"อย่างน้อย\"" }
      - { id: d, text: "$x \\ge 50$", feedback: "ลืมคะแนนเก็บ 32 คะแนน เงื่อนไขพูดถึงคะแนนรวม ไม่ใช่คะแนนสอบอย่างเดียว" }
    hints:
      - "คะแนนรวมเขียนเป็นนิพจน์อย่างไร"
      - "\"อย่างน้อย\" ใช้เครื่องหมายใด รวมค่าขอบหรือไม่"
    solution: "คะแนนรวม $= 32 + x$ และ \"อย่างน้อย 50\" คือ $\\ge 50$ จึงได้ $32 + x \\ge 50$ หรือ $x \\ge 18$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ineq.p006
    topics: [math.algebra.linear-inequalities]
    difficulty: 3
    type: mcq
    stem: "คำตอบของอสมการ $-2x + 3 > 11$ คือข้อใด"
    choices:
      - { id: a, text: "$x < -4$", correct: true }
      - { id: b, text: "$x > -4$", feedback: "ลืมกลับเครื่องหมายเมื่อหารด้วย $-2$ ลองแทน $x = 0$: $3 > 11$ ไม่จริง" }
      - { id: c, text: "$x < -7$", feedback: "ดูเหมือนบวก 3 ทั้งสองข้าง การแกะ $+3$ ต้องลบ 3 ได้ $-2x > 8$" }
      - { id: d, text: "$x < 4$", feedback: "กลับเครื่องหมายถูกแล้ว แต่ $8 \\div (-2) = -4$ ไม่ใช่ $4$" }
    hints:
      - "แกะ $+3$ ออกก่อน แล้วจึงจัดการ $-2$"
      - "เมื่อหารทั้งสองข้างด้วยจำนวนลบ ต้องทำอะไรกับเครื่องหมาย"
    solution: "ลบ 3: $-2x > 8$ → หารด้วย $-2$ และกลับเครื่องหมาย: $x < -4$ ตรวจด้วย $x = -5$: $10 + 3 = 13 > 11$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ineq.p007
    topics: [math.algebra.linear-inequalities]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการแก้อสมการ $3x + 4 > 5x - 6$ ให้ถูกต้อง"
    items:
      - "ลบ $5x$ ทั้งสองข้าง: $-2x + 4 > -6$"
      - "ลบ 4 ทั้งสองข้าง: $-2x > -10$"
      - "หารด้วย $-2$ และกลับเครื่องหมาย: $x < 5$"
      - "ตรวจด้วย $x = 0$: $4 > -6$ ✓"
    hints:
      - "รวมพจน์ที่มี $x$ ไว้ข้างเดียวก่อน"
      - "ขั้นที่ต้องกลับเครื่องหมายคือขั้นที่หารด้วยจำนวนลบ"
    solution: "รวม $x$ ไว้ข้างซ้าย → ย้ายค่าคงตัว → หารด้วยสัมประสิทธิ์ (กลับเครื่องหมายเพราะเป็นลบ) → ตรวจด้วยค่าทดสอบในคำตอบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ineq.p008
    topics: [math.algebra.linear-inequalities]
    difficulty: 3
    type: numeric
    stem: "ลิฟต์ขนของรับน้ำหนักได้ไม่เกิน 700 กิโลกรัม พนักงานหนัก 80 กิโลกรัมเข็นกล่องสินค้าที่หนักกล่องละ 40 กิโลกรัมเข้าไปพร้อมกัน ขนกล่องได้มากที่สุดครั้งละกี่กล่อง"
    answer: { value: 15, unit: กล่อง }
    hints:
      - "ให้ $x$ แทนจำนวนกล่อง น้ำหนักรวมคือพนักงานบวกกล่องทั้งหมด"
      - "เขียนอสมการ $80 + 40x \\le 700$"
      - "แก้อสมการ แล้วพิจารณาว่าจำนวนกล่องต้องเป็นจำนวนเต็มที่ไม่ทำให้เกินพิกัด"
    misconceptions:
      - { match: 16, feedback: "ดูเหมือนปัดขึ้นจาก 15.5 แต่ 16 กล่องหนัก $80 + 640 = 720$ กิโลกรัม เกินพิกัด ต้องปัดลง" }
      - { match: 17, feedback: "ดูเหมือนลืมน้ำหนักพนักงาน 80 กิโลกรัม พนักงานอยู่ในลิฟต์ด้วยจึงต้องนับรวม" }
    solution: "$80 + 40x \\le 700$ → $40x \\le 620$ → $x \\le 15.5$ จำนวนกล่องเป็นจำนวนเต็ม จึงขนได้มากที่สุด 15 กล่อง ตรวจ: $80 + 40(15) = 680 \\le 700$ ✓ และ $80 + 40(16) = 720$ เกิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ineq.p009
    topics: [math.algebra.linear-inequalities]
    difficulty: 4
    type: numeric
    stem: "ค่ายมือถือมีสองแพ็กเกจ แพ็กเกจ A จ่ายเหมาเดือนละ 299 บาท โทรได้ไม่จำกัด แพ็กเกจ B จ่ายเดือนละ 99 บาท บวกนาทีละ 2 บาท ถ้าโทรเป็นจำนวนนาทีเต็ม ต้องโทรอย่างน้อยกี่นาทีต่อเดือน แพ็กเกจ A จึงถูกกว่าแพ็กเกจ B"
    answer: { value: 101, unit: นาที }
    hints:
      - "ให้ $x$ แทนจำนวนนาที ค่าใช้จ่ายของแพ็กเกจ B คือ $99 + 2x$"
      - "A ถูกกว่า B แปลว่า $299 < 99 + 2x$"
      - "แก้อสมการ แล้วหาจำนวนเต็มที่น้อยที่สุดที่ทำให้อสมการเป็นจริง (ระวังค่าที่ทำให้ราคาเท่ากัน)"
    misconceptions:
      - { match: 100, feedback: "ที่ 100 นาที แพ็กเกจ B ราคา $99 + 200 = 299$ บาท เท่ากับ A พอดี ยังไม่ถูกกว่า ต้องมากกว่า 100 นาที" }
      - { match: 150, feedback: "ดูเหมือนลืมค่าบริการรายเดือน 99 บาทของแพ็กเกจ B ราคา B คือ $99 + 2x$ ไม่ใช่ $2x$" }
    solution: "$299 < 99 + 2x$ → $200 < 2x$ → $x > 100$ จำนวนเต็มที่น้อยที่สุดคือ 101 นาที ตรวจ: B ที่ 101 นาที $= 99 + 202 = 301 > 299$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ineq.p010
    topics: [math.algebra.linear-inequalities]
    difficulty: 4
    type: numeric
    stem: "จำนวนเต็มที่น้อยที่สุดที่ทำให้ $2(x - 4) < 5x + 7$ เป็นจริงคือจำนวนใด"
    answer: { value: -4 }
    hints:
      - "กระจายวงเล็บก่อน: คูณ 2 เข้าทั้ง $x$ และ $-4$"
      - "รวม $x$ ไว้ข้างเดียว ถ้าต้องหารด้วยจำนวนลบให้กลับเครื่องหมาย"
      - "ได้ $x$ มากกว่าค่าหนึ่ง แล้วหาจำนวนเต็มที่น้อยที่สุดที่มากกว่าค่านั้น (ค่าขอบเองไม่นับ)"
    misconceptions:
      - { match: -5, feedback: "ได้ $x > -5$ ถูกแล้ว แต่ $-5$ เองไม่เป็นคำตอบ เพราะเครื่องหมายเป็น $>$ ไม่ใช่ $\\ge$ ลองแทน: $2(-9) = -18$ ไม่น้อยกว่า $-18$" }
      - { match: -3, feedback: "ดูเหมือนกระจาย $2(x - 4)$ เป็น $2x - 4$ ต้องคูณ 2 เข้าทุกพจน์ ได้ $2x - 8$" }
    solution: "$2x - 8 < 5x + 7$ → ลบ $5x$: $-3x - 8 < 7$ → บวก 8: $-3x < 15$ → หารด้วย $-3$ กลับเครื่องหมาย: $x > -5$ จำนวนเต็มที่น้อยที่สุดคือ $-4$ ตรวจ: $2(-8) = -16 < 5(-4) + 7 = -13$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ineq.p011
    topics: [math.algebra.linear-inequalities]
    difficulty: 4
    type: numeric
    stem: "ร้านกาแฟเล็ก ๆ มีค่าใช้จ่ายคงที่ (ค่าเช่าและค่าแรง) วันละ 1,200 บาท ขายกาแฟแก้วละ 55 บาท ต้นทุนวัตถุดิบแก้วละ 25 บาท ต้องขายอย่างน้อยกี่แก้วต่อวันจึงจะมีกำไร (กำไรมากกว่า 0 บาท)"
    answer: { value: 41, unit: แก้ว }
    hints:
      - "แต่ละแก้วได้เงินเหลือไว้จ่ายค่าใช้จ่ายคงที่เท่าใด"
      - "กำไร $= (55 - 25)x - 1200$ และต้องมากกว่า 0"
      - "แก้อสมการแล้วหาจำนวนเต็มที่น้อยที่สุด ระวังค่าที่ทำให้กำไรเป็นศูนย์พอดี"
    misconceptions:
      - { match: 40, feedback: "ขาย 40 แก้วได้ $30 \\times 40 = 1200$ บาท เท่ากับค่าใช้จ่ายพอดี กำไรเป็น 0 ซึ่งยังไม่ใช่กำไร ต้องขายมากกว่า 40 แก้ว" }
      - { match: 22, feedback: "ดูเหมือนลืมหักต้นทุนวัตถุดิบ 25 บาทต่อแก้ว ร้านได้เงินเหลือจริงแก้วละ $55 - 25 = 30$ บาท" }
    solution: "$30x - 1200 > 0$ → $30x > 1200$ → $x > 40$ จำนวนแก้วที่น้อยที่สุดคือ 41 แก้ว ตรวจ: $30(41) - 1200 = 30$ บาท $> 0$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ineq.p012
    topics: [math.algebra.linear-inequalities]
    difficulty: 5
    type: numeric
    stem: "มีจำนวนเต็มกี่จำนวนที่ทำให้ $-3 < 2x + 1 \\le 9$ เป็นจริง"
    answer: { value: 6 }
    hints:
      - "อสมการสองชั้นแก้ได้โดยทำสิ่งเดียวกันกับทั้งสามส่วน"
      - "ลบ 1 ทั้งสามส่วน แล้วหารด้วย 2 ทั้งสามส่วน"
      - "ได้ช่วงของ $x$ แล้วนับจำนวนเต็มในช่วง ดูให้ดีว่าขอบแต่ละข้างรวมหรือไม่รวม"
    misconceptions:
      - { match: 7, feedback: "ดูเหมือนนับ $-2$ ด้วย แต่ขอบซ้ายเป็น $<$ ถ้า $x = -2$ จะได้ $2x + 1 = -3$ ซึ่งไม่มากกว่า $-3$" }
      - { match: 5, feedback: "ดูเหมือนไม่ได้นับ 4 แต่ขอบขวาเป็น $\\le$ ถ้า $x = 4$ จะได้ $2x + 1 = 9 \\le 9$ เป็นจริง" }
    solution: "ลบ 1: $-4 < 2x \\le 8$ → หาร 2: $-2 < x \\le 4$ จำนวนเต็มคือ $-1, 0, 1, 2, 3, 4$ รวม 6 จำนวน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ineq.p013
    topics: [math.algebra.linear-inequalities]
    difficulty: 1
    type: mcq
    stem: "เส้นจำนวนในภาพแสดงคำตอบของอสมการใด"
    figure: { src: ray-open.svg, alt: "เส้นจำนวนจาก −5 ถึง 5 มีวงกลมโปร่งที่ −2 และแถบหนาจาก −2 ชี้ไปทางขวาจนสุดลูกศร" }
    choices:
      - { id: a, text: "$x > -2$", correct: true }
      - { id: b, text: "$x \\ge -2$", feedback: "วงกลมที่ $-2$ เป็นวงกลมโปร่ง แปลว่าไม่รวม $-2$ จึงใช้ $>$ ไม่ใช่ $\\ge$" }
      - { id: c, text: "$x < -2$", feedback: "แถบชี้ไปทางขวา คือจำนวนที่มากกว่า $-2$ ไม่ใช่น้อยกว่า" }
      - { id: d, text: "$-2 > x$", feedback: "$-2 > x$ คือ $x < -2$ ซึ่งชี้ไปทางซ้าย" }
    hints:
