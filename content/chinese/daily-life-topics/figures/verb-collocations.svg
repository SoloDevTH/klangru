<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei','Noto Sans Thai',sans-serif">
<title>กริยาที่ใช้คู่กับยานพาหนะ กีฬา และอาหาร</title>
<defs></defs>
<rect x="0" y="0" width="760" height="470" fill="#fff"/>
<text x="380.0" y="32.0" font-size="19" text-anchor="middle" fill="#1a1a1a" font-weight="bold">กริยาคู่คำนาม: ภาษาไทยใช้ "นั่ง ขี่ เล่น" แต่ภาษาจีนเลือกกริยาตามสิ่งของ</text>
<rect x="20.0" y="52.0" width="230.0" height="404.0" rx="10" fill="#fff" stroke="#1f4e9c" stroke-width="2"/>
<rect x="20.0" y="52.0" width="230.0" height="36.0" rx="10" fill="#dbe8f8" stroke="#1f4e9c" stroke-width="2"/>
<text x="135.0" y="77.0" font-size="18" text-anchor="middle" fill="#1f4e9c" font-weight="bold">ยานพาหนะ</text>
<rect x="30.0" y="100.0" width="210.0" height="122.0" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
<text x="42.0" y="127.0" font-size="24" text-anchor="start" fill="#1f4e9c" font-weight="bold">坐</text>
<text x="80.0" y="120.0" font-size="14" text-anchor="start" fill="#1f4e9c" font-weight="normal">zuò</text>
<text x="80.0" y="138.0" font-size="13" text-anchor="start" fill="#666" font-weight="normal">นั่ง (เป็นผู้โดยสาร)</text>
<text x="80.0" y="162.0" font-size="15" text-anchor="start" fill="#1a1a1a" font-weight="normal">+ 公共汽车 รถเมล์</text>
<text x="80.0" y="186.0" font-size="15" text-anchor="start" fill="#1a1a1a" font-weight="normal">+ 地铁 รถไฟใต้ดิน</text>
<text x="80.0" y="210.0" font-size="15" text-anchor="start" fill="#1a1a1a" font-weight="normal">+ 飞机 เครื่องบิน</text>
<rect x="30.0" y="234.0" width="210.0" height="98.0" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
<text x="42.0" y="261.0" font-size="24" text-anchor="start" fill="#1f4e9c" font-weight="bold">骑</text>
<text x="80.0" y="254.0" font-size="14" text-anchor="start" fill="#1f4e9c" font-weight="normal">qí</text>
<text x="80.0" y="272.0" font-size="13" text-anchor="start" fill="#666" font-weight="normal">ขี่ (คร่อม)</text>
<text x="80.0" y="296.0" font-size="15" text-anchor="start" fill="#1a1a1a" font-weight="normal">+ 自行车 จักรยาน</text>
<text x="80.0" y="320.0" font-size="15" text-anchor="start" fill="#1a1a1a" font-weight="normal">+ 摩托车 มอเตอร์ไซค์</text>
<rect x="30.0" y="344.0" width="210.0" height="74.0" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
<text x="42.0" y="371.0" font-size="24" text-anchor="start" fill="#1f4e9c" font-weight="bold">开</text>
<text x="80.0" y="364.0" font-size="14" text-anchor="start" fill="#1f4e9c" font-weight="normal">kāi</text>
<text x="80.0" y="382.0" font-size="13" text-anchor="start" fill="#666" font-weight="normal">ขับ</text>
<text x="80.0" y="406.0" font-size="15" text-anchor="start" fill="#1a1a1a" font-weight="normal">+ 车 รถ</text>
<rect x="265.0" y="52.0" width="230.0" height="404.0" rx="10" fill="#fff" stroke="#2a6a2a" stroke-width="2"/>
<rect x="265.0" y="52.0" width="230.0" height="36.0" rx="10" fill="#dcefd6" stroke="#2a6a2a" stroke-width="2"/>
<text x="380.0" y="77.0" font-size="18" text-anchor="middle" fill="#2a6a2a" font-weight="bold">กีฬา</text>
<rect x="275.0" y="100.0" width="210.0" height="74.0" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
<text x="287.0" y="127.0" font-size="24" text-anchor="start" fill="#2a6a2a" font-weight="bold">踢</text>
<text x="325.0" y="120.0" font-size="14" text-anchor="start" fill="#2a6a2a" font-weight="normal">tī</text>
<text x="325.0" y="138.0" font-size="13" text-anchor="start" fill="#666" font-weight="normal">เตะ (ใช้เท้า)</text>
<text x="325.0" y="162.0" font-size="15" text-anchor="start" fill="#1a1a1a" font-weight="normal">+ 足球 ฟุตบอล</text>
<rect x="275.0" y="186.0" width="210.0" height="98.0" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
<text x="287.0" y="213.0" font-size="24" text-anchor="start" fill="#2a6a2a" font-weight="bold">打</text>
<text x="325.0" y="206.0" font-size="14" text-anchor="start" fill="#2a6a2a" font-weight="normal">dǎ</text>
<text x="325.0" y="224.0" font-size="13" text-anchor="start" fill="#666" font-weight="normal">ตี (ใช้มือ)</text>
<text x="325.0" y="248.0" font-size="15" text-anchor="start" fill="#1a1a1a" font-weight="normal">+ 篮球 บาสเกตบอล</text>
<text x="325.0" y="272.0" font-size="15" text-anchor="start" fill="#1a1a1a" font-weight="normal">+ 羽毛球 แบดมินตัน</text>
<rect x="275.0" y="296.0" width="210.0" height="86.0" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
<text x="287.0" y="323.0" font-size="24" text-anchor="start" fill="#2a6a2a" font-weight="bold">—</text>
<text x="325.0" y="316.0" font-size="14" text-anchor="start" fill="#2a6a2a" font-weight="normal"></text>
<text x="325.0" y="323.0" font-size="13" text-anchor="start" fill="#666" font-weight="normal">ไม่ต้องเติมกริยา</text>
<text x="325.0" y="346.0" font-size="15" text-anchor="start" fill="#1a1a1a" font-weight="normal">+ 游泳 ว่ายน้ำ</text>
<text x="325.0" y="370.0" font-size="15" text-anchor="start" fill="#1a1a1a" font-weight="normal">+ 跑步 วิ่ง</text>
<rect x="510.0" y="52.0" width="230.0" height="404.0" rx="10" fill="#fff" stroke="#b3261e" stroke-width="2"/>
<rect x="510.0" y="52.0" width="230.0" height="36.0" rx="10" fill="#fbe0dc" stroke="#b3261e" stroke-width="2"/>
<text x="625.0" y="77.0" font-size="18" text-anchor="middle" fill="#b3261e" font-weight="bold">อาหาร</text>
<rect x="520.0" y="100.0" width="210.0" height="98.0" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
<text x="532.0" y="127.0" font-size="24" text-anchor="start" fill="#b3261e" font-weight="bold">吃</text>
<text x="570.0" y="120.0" font-size="14" text-anchor="start" fill="#b3261e" font-weight="normal">chī</text>
<text x="570.0" y="138.0" font-size="13" text-anchor="start" fill="#666" font-weight="normal">กิน</text>
<text x="570.0" y="162.0" font-size="15" text-anchor="start" fill="#1a1a1a" font-weight="normal">+ 米饭 ข้าวสวย</text>
<text x="570.0" y="186.0" font-size="15" text-anchor="start" fill="#1a1a1a" font-weight="normal">+ 面条 บะหมี่</text>
<rect x="520.0" y="210.0" width="210.0" height="98.0" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
<text x="532.0" y="237.0" font-size="24" text-anchor="start" fill="#b3261e" font-weight="bold">喝</text>
<text x="570.0" y="230.0" font-size="14" text-anchor="start" fill="#b3261e" font-weight="normal">hē</text>
<text x="570.0" y="248.0" font-size="13" text-anchor="start" fill="#666" font-weight="normal">ดื่ม</text>
<text x="570.0" y="272.0" font-size="15" text-anchor="start" fill="#1a1a1a" font-weight="normal">+ 茶 ชา</text>
<text x="570.0" y="296.0" font-size="15" text-anchor="start" fill="#1a1a1a" font-weight="normal">+ 咖啡 กาแฟ</text>
<rect x="520.0" y="320.0" width="210.0" height="74.0" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
<text x="532.0" y="347.0" font-size="24" text-anchor="start" fill="#b3261e" font-weight="bold">点</text>
<text x="570.0" y="340.0" font-size="14" text-anchor="start" fill="#b3261e" font-weight="normal">diǎn</text>
<text x="570.0" y="358.0" font-size="13" text-anchor="start" fill="#666" font-weight="normal">สั่ง</text>
<text x="570.0" y="382.0" font-size="15" text-anchor="start" fill="#1a1a1a" font-weight="normal">+ 菜 อาหาร</text>
</svg>
