id: computer.security.secure-coding
subject: computer
title: { th: เขียนโค้ดอย่างปลอดภัย, en: "Secure coding" }
summary: รู้จักช่องโหว่ที่พบบ่อย ตรวจข้อมูลเข้าด้วยรายการที่อนุญาต แยกคำสั่งออกจากข้อมูล และออกแบบระบบตามหลักสิทธิ์น้อยที่สุดกับการล้มเหลวอย่างปลอดภัย
difficulty: 6
minutes: 45
prerequisites: [computer.data.databases, computer.programming.files-exceptions, computer.web.html-css]
encompasses:
  - { id: computer.programming.files-exceptions, weight: 0.3 }
  - { id: computer.web.html-css, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: data-boundaries.svg
    alt: "ผู้ใช้กรอกข้อความและข้ามขอบระบบที่เป็นเส้นประสีแดงไปยังกล่องตรวจข้อมูลเข้า จากนั้นข้อมูลไปยังตรรกะธุรกิจ ซึ่งส่งต่อไปยังฐานข้อมูลในรูปพารามิเตอร์ และไปยังหน้าเว็บที่หลีกอักขระก่อนแสดง"
    caption: "ตรวจข้อมูลที่ขอบระบบ แยกคำสั่งออกจากข้อมูลตอนเข้าฐานข้อมูล และหลีกอักขระตอนแสดงผล"
  - type: worked-example
    title: ตรวจรหัสสมาชิกด้วยรายการที่อนุญาต
    problem: "ระบบสมาชิกร้านกาแฟใช้รหัสสมาชิกที่ขึ้นต้นด้วยตัว M พิมพ์ใหญ่ แล้วตามด้วยตัวเลขพอดี 6 หลัก เช่น M204517 จะตรวจรหัสที่ผู้ใช้กรอกอย่างไร"
    steps:
      - text: "กำหนดสิ่งที่อนุญาตก่อน คือตัวแรกต้องเป็น M และอีก 6 ตัวต้องเป็นตัวเลข 0 ถึง 9 รวมยาว 7 ตัวพอดี"
        why: "การเขียนเกณฑ์เป็นรายการที่อนุญาตทำให้รูปแบบที่ไม่เคยคิดถึงถูกปฏิเสธโดยอัตโนมัติ"
      - text: "เขียนเป็นรูปแบบเดียว `M[0-9]{6}` แล้วตรวจทั้งสตริงด้วย `re.fullmatch`"
        why: "`fullmatch` ต้องให้ทั้งสตริงตรงกับรูปแบบ ถ้าใช้ `search` ข้อความที่มีรหัสถูกต้องซ่อนอยู่บางส่วนจะผ่านได้"
      - text: "ถ้าไม่ตรงให้ปฏิเสธพร้อมข้อความที่เข้าใจได้ และไม่แก้ไขรหัสที่รับมาเอง เช่น ไม่เติมตัว M ให้"
    answer: "ผ่านเฉพาะรหัสที่ตรงรูปแบบทั้งหมด เช่น M204517 ผ่าน แต่ m204517, M20451 และ M204517x ไม่ผ่าน"
  - { type: check, problem: computer.security.secure-coding.p004, prompt: "ดูว่าการแปลงรูปแบบกับการป้องกันต่างกันอย่างไร" }
  - type: worked-example
    title: แยกคำสั่ง SQL ออกจากข้อมูลผู้ใช้
    problem: "ต้องการค้นราคาเมนูจากชื่อเมนูที่ลูกค้าพิมพ์ในช่องค้นหา ทำให้ปลอดภัยด้วยการเขียนคำสั่งอย่างไร"
    steps:
      - text: "เขียนโครงสร้างคำสั่งเป็นสตริงคงที่ที่มีเครื่องหมายคำถามแทนค่า เช่น `WHERE name = ?`"
        why: "โครงสร้างคำสั่งไม่เปลี่ยนตามข้อมูลที่ผู้ใช้กรอก"
      - text: "ส่งค่าที่ผู้ใช้กรอกแยกเป็นทูเพิลพารามิเตอร์ เช่น `(menu_name,)`"
        why: "ระบบฐานข้อมูลจะรับค่านี้เป็นข้อมูลเท่านั้น ไม่ตีความเป็นคำสั่ง"
      - text: "ตรวจชนิดและความยาวของ `menu_name` ก่อนส่ง เช่นต้องเป็นสตริงที่ยาว 1 ถึง 50 ตัวอักษร"
        why: "การแยกคำสั่งเป็นชั้นแรก การตรวจข้อมูลเข้าเป็นชั้นที่สอง ทั้งสองชั้นช่วยกันทำให้ปลอดภัยขึ้น"
    answer: "ใช้ `\"SELECT price FROM menu WHERE name = ?\"` กับพารามิเตอร์ `(menu_name,)` หลังตรวจชนิดและความยาว"
  - { type: check, problem: computer.security.secure-coding.p014, prompt: "นึกถึงคำถามสามข้อของแบบจำลองภัยคุกคาม" }
glossary:
  - { term: การแทรกคำสั่ง (injection), definition: "ช่องโหว่ที่ข้อมูลจากผู้ใช้ถูกตีความเป็นส่วนหนึ่งของคำสั่ง เช่น SQL หรือคำสั่งระบบ" }
  - { term: รายการที่อนุญาต (allowlist), definition: "วิธีตรวจข้อมูลเข้าที่กำหนดว่าอะไรยอมรับได้ ข้อมูลอื่นทั้งหมดถูกปฏิเสธ" }
  - { term: การหลีกอักขระ (escaping), definition: "การเปลี่ยนอักขระพิเศษให้เป็นรูปแบบที่แสดงเป็นข้อความธรรมดาในบริบทนั้น" }
  - { term: แบบจำลองภัยคุกคาม (threat model), definition: "การวิเคราะห์ว่ามีทรัพย์สินอะไร ใครอาจโจมตี และจุดเข้าถึงอยู่ที่ใด เพื่อเลือกการป้องกัน" }
flashcards:
  - { front: "allowlist กับ denylist ต่างกันอย่างไร", back: "allowlist กำหนดสิ่งที่ยอมรับได้และปฏิเสธที่เหลือ ส่วน denylist พยายามระบุสิ่งที่ห้ามซึ่งอาจตกหล่น" }
  - { front: "ทำไมต้องใช้พารามิเตอร์ในคำสั่ง SQL", back: "เพื่อแยกโครงสร้างคำสั่งออกจากข้อมูล ทำให้ข้อมูลไม่ถูกตีความเป็นคำสั่ง" }
  - { front: "หลักสิทธิ์น้อยที่สุดคืออะไร", back: "ให้สิทธิ์แก่แต่ละบัญชีเท่าที่หน้าที่ต้องใช้ ไม่มากกว่านั้น" }
  - { front: "ทำไมไม่ควรเก็บรหัสผ่านเป็นข้อความธรรมดา", back: "เพราะถ้าฐานข้อมูลรั่วไหล รหัสผ่านทุกคนถูกเปิดเผยทันที ควรเก็บค่าแฮชที่มี salt" }
