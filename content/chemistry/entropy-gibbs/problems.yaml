    stem: 'ในโรงงานปูนซีเมนต์แห่งหนึ่งของประเทศไทย หินปูนแคลเซียมคาร์บอเนตถูกเผาตามปฏิกิริยา $\mathrm{CaCO_3(s) \rightarrow CaO(s) + CO_2(g)}$ จากค่า $\Delta_f G^\circ$ ที่ $298\ \mathrm{K}$ ของ $\mathrm{CaCO_3}$ (แคลไซต์) เท่ากับ $-1129.1$, $\mathrm{CaO}$ เท่ากับ $-603.3$ และ $\mathrm{CO_2}$ เท่ากับ $-394.4$ หน่วย kJ/mol หาค่า $\Delta G^\circ$ ของปฏิกิริยานี้ในหน่วย kJ/mol'
    answer: { value: 131.4, tolerance: 0.1, unit: kJ/mol }
    hints:
      - 'ใช้ $\Delta G^\circ = \sum \Delta_f G^\circ(\text{ผลิตภัณฑ์}) - \sum \Delta_f G^\circ(\text{สารตั้งต้น})$'
      - 'ตรวจว่าสารตั้งต้นมีเพียงหนึ่งตัวและมีสัมประสิทธิ์เป็นหนึ่ง'
    misconceptions:
      - { match: -131.4, feedback: 'สลับผลรวมของผลิตภัณฑ์กับสารตั้งต้น ทำให้เครื่องหมายกลับกัน' }
    solution: '$\Delta G^\circ = [(-603.3) + (-394.4)] - [(-1129.1)] = +131.4\ \mathrm{kJ/mol}$ ค่าเป็นบวกหมายความว่าที่ $298\ \mathrm{K}$ ปฏิกิริยานี้ไม่เกิดเองและต้องให้ความร้อนสูง'
