  - id: math.stats.random-variables.p019
    topics: [math.stats.random-variables]
    difficulty: 5
    type: numeric
    stem: "ซุ้มเกมในงานวัดแห่งหนึ่ง (สมมติ) ให้เล่นครั้งละ 20 บาท ผู้เล่นทอยลูกเต๋าสองลูก ถ้าผลรวมเป็น 12 ได้เงิน 300 บาท ถ้าผลรวมเป็น 7 ได้เงิน 40 บาท นอกนั้นไม่ได้อะไร กำไรคาดหมายของผู้เล่นต่อครั้งเท่ากับกี่บาท (ติดลบได้)"
    answer: { value: -5, unit: บาท }
    hints:
      - "$P(\\text{ผลรวม } 12) = \\tfrac1{36}$ และ $P(\\text{ผลรวม } 7) = \\tfrac6{36}$"
      - "กำไรคาดหมาย = เงินรางวัลคาดหมาย − 20"
    misconceptions:
      - { match: 15, feedback: "15 บาทคือเงินรางวัลคาดหมาย ยังไม่ได้หักค่าเล่น" }
      - { match: -10.56, feedback: "ผลรวม 7 เกิดได้ 6 แบบ ไม่ใช่ 1 แบบ $P = \\tfrac{6}{36}$" }
    solution: "เงินรางวัลคาดหมาย $= 300 \\cdot \\tfrac1{36} + 40 \\cdot \\tfrac6{36} = \\tfrac{540}{36} = 15$ บาท กำไรคาดหมาย $15 - 20 = -5$ บาทต่อครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.random-variables.p020
    topics: [math.stats.random-variables]
