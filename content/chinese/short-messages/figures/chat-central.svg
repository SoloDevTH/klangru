<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 450" width="420" height="450" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei','Noto Sans Thai',sans-serif">
<title>แชตนัดเพื่อนชาวจีนที่ห้าง Central (สมมติ)</title>
<defs></defs>
<rect x="0" y="0" width="420" height="450" fill="#fff"/>
<rect x="10.0" y="10.0" width="400.0" height="430.0" rx="24" fill="#ededed" stroke="#999" stroke-width="1.5"/>
<rect x="10.0" y="10.0" width="400.0" height="46.0" rx="24" fill="#f7f7f7" stroke="#999" stroke-width="1.5"/>
<rect x="10.0" y="40.0" width="400.0" height="16.0" rx="0" fill="#f7f7f7" stroke="none" stroke-width="0"/>
<text x="210.0" y="40.0" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="bold">王明</text>
<circle cx="42.0" cy="94.0" r="16.0" fill="#cfd8dc" stroke="#90a4ae" stroke-width="1.5"/>
<text x="42.0" y="100.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="normal">王</text>
<rect x="70.0" y="76.0" width="154.0" height="42.0" rx="10" fill="#fff" stroke="#aaa" stroke-width="1"/>
<text x="84.0" y="106.0" font-size="18" text-anchor="start" fill="#1a1a1a" font-weight="normal">明天你有空吗？</text>
<rect x="144.5" y="132.0" width="245.5" height="68.0" rx="10" fill="#c7f0b1" stroke="#aaa" stroke-width="1"/>
<text x="158.5" y="162.0" font-size="18" text-anchor="start" fill="#1a1a1a" font-weight="normal">有空！我们去Central商场</text>
<text x="158.5" y="188.0" font-size="18" text-anchor="start" fill="#1a1a1a" font-weight="normal">逛街，好吗？</text>
<circle cx="42.0" cy="232.0" r="16.0" fill="#cfd8dc" stroke="#90a4ae" stroke-width="1.5"/>
