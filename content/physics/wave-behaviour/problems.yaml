problems:
  - id: phy.wbeh.p001
    topics: [physics.waves.wave-behaviour]
    difficulty: 1
    type: mcq
    stem: "คลื่นเสียงจากอากาศเคลื่อนเข้าสู่น้ำ ปริมาณใดของคลื่น **คงเดิม**"
    choices:
      - { id: a, text: "ความถี่", correct: true }
      - { id: b, text: "อัตราเร็ว", feedback: "อัตราเร็วขึ้นกับตัวกลาง เสียงในน้ำเร็วกว่าในอากาศหลายเท่า จึงเปลี่ยนแน่นอน" }
      - { id: c, text: "ความยาวคลื่น", feedback: "จาก $\\lambda = \\dfrac{v}{f}$ เมื่ออัตราเร็วเปลี่ยนแต่ความถี่คงเดิม ความยาวคลื่นก็ต้องเปลี่ยนตาม" }
      - { id: d, text: "ทิศทางการเคลื่อนที่ ไม่ว่าจะตกกระทบแบบใด", feedback: "ถ้าคลื่นตกกระทบแนวเฉียง ทิศจะเบน นั่นคือการหักเห ทิศคงเดิมเฉพาะเมื่อตกกระทบตั้งฉากกับรอยต่อ" }
    hints:
      - "ปริมาณใดถูกกำหนดโดยแหล่งกำเนิด ไม่ใช่โดยตัวกลาง"
      - "นึกถึง $v = f\\lambda$ ถ้าตัวหนึ่งคงที่ อีกสองตัวต้องเปลี่ยนไปด้วยกัน"
    solution: "ความถี่ถูกกำหนดโดยแหล่งกำเนิด จึงเท่าเดิมทุกตัวกลาง ส่วนอัตราเร็วเปลี่ยนตามตัวกลาง และความยาวคลื่น $\\lambda = \\dfrac{v}{f}$ เปลี่ยนตามอัตราเร็ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wbeh.p002
    topics: [physics.waves.wave-behaviour]
    difficulty: 1
    type: numeric
    stem: "ส่งคลื่นน้ำหน้าตรงในถาดคลื่นไปกระทบผนังเรียบ ทิศการเคลื่อนที่ของคลื่นทำมุม $35^\\circ$ กับเส้นปกติของผนัง มุมสะท้อนเป็นกี่องศา (ตอบเป็นตัวเลขในหน่วยองศา)"
    answer: { value: 35, unit: องศา }
    hints:
      - "มุมตกกระทบและมุมสะท้อนวัดจากเส้นปกติทั้งคู่"
      - "ใช้กฎการสะท้อน มุมตกกระทบเท่ากับมุมสะท้อน"
    misconceptions:
      - { match: 55, feedback: "นั่นคือมุมที่วัดจากผิวผนัง ($90^\\circ - 35^\\circ$) แต่มุมสะท้อนวัดจากเส้นปกติ เหมือนกับมุมตกกระทบ" }
    solution: "กฎการสะท้อน $\\theta_r = \\theta_i = 35^\\circ$ โดยวัดจากเส้นปกติทั้งสองมุม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wbeh.p003
    topics: [physics.waves.wave-behaviour]
    difficulty: 2
    type: match
    stem: "จับคู่เหตุการณ์กับพฤติกรรมของคลื่นที่อธิบายเหตุการณ์นั้น"
    pairs:
      - { left: "ตะโกนในถ้ำแล้วได้ยินเสียงตัวเองย้อนกลับมา", right: "การสะท้อน" }
      - { left: "คลื่นทะเลเลี้ยวจนเกือบขนานกับชายหาดเมื่อเข้าใกล้ฝั่ง", right: "การหักเห" }
      - { left: "หูฟังตัดเสียงรบกวนส่งเสียงที่กลับเฟสมาหักล้างเสียงเครื่องยนต์", right: "การแทรกสอด" }
      - { left: "ได้ยินเสียงคนคุยกันหลังกำแพงทั้งที่มองไม่เห็นตัว", right: "การเลี้ยวเบน" }
    hints:
      - "ถามตัวเองว่าคลื่นเด้งกลับ เปลี่ยนตัวกลาง ซ้อนกับอีกคลื่น หรืออ้อมสิ่งกีดขวาง"
      - "คลื่นทะเลช้าลงเมื่อน้ำตื้นขึ้น การเปลี่ยนอัตราเร็วทำให้ทิศเบน"
    solution: "เสียงก้องในถ้ำคือการสะท้อน · คลื่นทะเลเลี้ยวเข้าฝั่งเพราะช้าลงในน้ำตื้นคือการหักเห · หูฟังตัดเสียงใช้คลื่นสองขบวนหักล้างกันคือการแทรกสอด · เสียงอ้อมกำแพงคือการเลี้ยวเบน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wbeh.p004
    topics: [physics.waves.wave-behaviour]
    difficulty: 2
    type: numeric
    stem: "คลื่นทะเลนอกหาดชะอำมีความถี่ $0.25\\ \\mathrm{Hz}$ และอัตราเร็ว $8\\ \\mathrm{m/s}$ เมื่อเข้าใกล้ฝั่งซึ่งน้ำตื้น อัตราเร็วลดเหลือ $3\\ \\mathrm{m/s}$ ความยาวคลื่นใกล้ฝั่งเป็นกี่เมตร (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 12, unit: m }
    hints:
      - "เมื่อคลื่นเปลี่ยนเขตน้ำ ความถี่เปลี่ยนหรือไม่"
      - "ใช้ $\\lambda = \\dfrac{v}{f}$ กับอัตราเร็วใกล้ฝั่ง"
    misconceptions:
      - { match: 32, feedback: "นั่นคือความยาวคลื่นนอกฝั่ง ($\\tfrac{8}{0.25}$) โจทย์ถามใกล้ฝั่ง ต้องใช้อัตราเร็ว $3\\ \\mathrm{m/s}$" }
      - { match: 0.75, feedback: "ดูเหมือนนำอัตราเร็วคูณความถี่ จาก $v = f\\lambda$ ต้องได้ $\\lambda = \\dfrac{v}{f}$" }
    solution: "ความถี่คงเดิม $f = 0.25\\ \\mathrm{Hz}$ ใกล้ฝั่ง $\\lambda = \\dfrac{v}{f} = \\dfrac{3\\ \\mathrm{m/s}}{0.25\\ \\mathrm{Hz}} = 12\\ \\mathrm{m}$ (นอกฝั่งยาว $32\\ \\mathrm{m}$ คลื่นช้าลงจึงสั้นลง)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wbeh.p005
    topics: [physics.waves.wave-behaviour]
    difficulty: 3
    type: numeric
    stem: "คลื่นน้ำเคลื่อนจากเขตน้ำลึก (อัตราเร็ว $0.40\\ \\mathrm{m/s}$) เข้าสู่เขตน้ำตื้น (อัตราเร็ว $0.20\\ \\mathrm{m/s}$) โดยมีมุมตกกระทบ $50^\\circ$ มุมหักเหเป็นกี่องศา (ตอบเป็นตัวเลขในหน่วยองศา ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 22.5, tolerance: 0.25, unit: องศา }
    hints:
      - "ใช้ $\\dfrac{\\sin\\theta_1}{\\sin\\theta_2} = \\dfrac{v_1}{v_2}$"
      - "หา $\\sin\\theta_2$ ก่อน แล้วจึงใช้ $\\sin^{-1}$ แปลงกลับเป็นมุม"
      - "$\\sin\\theta_2 = \\sin 50^\\circ \\times \\dfrac{v_2}{v_1}$"
    misconceptions:
      - { match: 25, feedback: "ดูเหมือนนำมุมคูณ $\\tfrac{0.20}{0.40}$ ตรง ๆ แต่สิ่งที่แปรผันตามอัตราเร็วคือ $\\sin\\theta$ ไม่ใช่ตัวมุม" }
      - { match: 0.383, feedback: "นั่นคือค่า $\\sin\\theta_2$ ยังต้องใช้ $\\sin^{-1}$ แปลงกลับเป็นมุมอีกขั้น" }
    solution: "$\\sin\\theta_2 = \\sin 50^\\circ \\times \\dfrac{0.20}{0.40} = 0.766 \\times 0.5 = 0.383$ จึงได้ $\\theta_2 = \\sin^{-1}(0.383) \\approx 22.5^\\circ$ น้อยกว่า $50^\\circ$ คลื่นช้าลงจึงเบนเข้าหาเส้นปกติ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wbeh.p006
    topics: [physics.waves.wave-behaviour]
    difficulty: 3
    type: mcq
    stem: "แหล่งกำเนิดคลื่นสองแหล่งสั่นด้วยความถี่เท่ากันและเฟสตรงกัน จุด P อยู่ห่างจากแหล่งทั้งสองต่างกัน $1.5\\lambda$ ที่จุด P เกิดอะไรขึ้น"
    choices:
      - { id: a, text: "คลื่นหักล้างกัน จุด P เป็นบัพ", correct: true }
      - { id: b, text: "คลื่นเสริมกัน จุด P เป็นปฏิบัพ", feedback: "เสริมกันเมื่อผลต่างระยะทางเป็นจำนวนเต็มเท่าของ $\\lambda$ เช่น $\\lambda$, $2\\lambda$ แต่ $1.5\\lambda$ ไม่ใช่จำนวนเต็ม" }
      - { id: c, text: "คลื่นเสริมกันเพียงครึ่งเดียว แอมพลิจูดเป็น 1.5 เท่า", feedback: "ผลต่างระยะทางครึ่งความยาวคลื่นทำให้สันคลื่นของแหล่งหนึ่งมาพบท้องคลื่นของอีกแหล่ง จึงหักล้างกัน ไม่ใช่เสริมกันบางส่วน" }
      - { id: d, text: "บอกไม่ได้ ต้องรู้ระยะจริงจากแหล่งแต่ละแหล่ง", feedback: "สำหรับแหล่งที่เฟสตรงกัน ผลที่จุด P ขึ้นกับผลต่างระยะทางเท่านั้น ไม่ต้องรู้ระยะแต่ละค่า" }
    hints:
      - "ผลต่างระยะทางเป็นจำนวนเต็มเท่า หรือครึ่งของจำนวนคี่เท่าของ $\\lambda$"
      - "เทียบกับ $(n - \\tfrac{1}{2})\\lambda$ ดูว่ามี $n$ ที่เป็นจำนวนเต็มบวกหรือไม่"
    solution: "$1.5\\lambda = (2 - \\tfrac{1}{2})\\lambda$ ตรงกับเงื่อนไขหักล้างกันเมื่อ $n = 2$ จุด P จึงอยู่บนแนวบัพที่ 2"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wbeh.p007
    topics: [physics.waves.wave-behaviour]
    difficulty: 3
    type: numeric
    stem: "เวทีคอนเสิร์ตในงานวัดมีลำโพงสองตัวส่งเสียงความถี่ $680\\ \\mathrm{Hz}$ เฟสตรงกัน อัตราเร็วเสียง $340\\ \\mathrm{m/s}$ ผลต่างระยะทางจากลำโพงทั้งสองถึงผู้ฟังต้องเป็น **อย่างน้อย** กี่เซนติเมตร ผู้ฟังจึงจะได้ยินเสียงความถี่นี้เบาลงเพราะการหักล้างกัน (ตอบเป็นตัวเลขในหน่วย cm)"
    answer: { value: 25, unit: cm }
    hints:
      - "หาความยาวคลื่นจาก $\\lambda = \\dfrac{v}{f}$"
      - "หักล้างกันครั้งแรกเมื่อผลต่างระยะทางเป็น $(1 - \\tfrac{1}{2})\\lambda$"
      - "หาครึ่งหนึ่งของความยาวคลื่น แล้วแปลงเป็นเซนติเมตร"
    misconceptions:
      - { match: 50, feedback: "นั่นคือหนึ่งความยาวคลื่นเต็ม ซึ่งทำให้คลื่นเสริมกัน (ดังขึ้น) หักล้างกันครั้งแรกต้องใช้ครึ่งความยาวคลื่น" }
    solution: "$\\lambda = \\dfrac{340\\ \\mathrm{m/s}}{680\\ \\mathrm{Hz}} = 0.5\\ \\mathrm{m}$ หักล้างกันครั้งแรกเมื่อผลต่างระยะทาง $= \\tfrac{1}{2}\\lambda = 0.25\\ \\mathrm{m} = 25\\ \\mathrm{cm}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wbeh.p008
    topics: [physics.waves.wave-behaviour]
    difficulty: 4
    type: numeric
    stem: "ในถาดคลื่น แหล่งกำเนิดสองแหล่งเฟสตรงกันสั่นด้วยความถี่ $10\\ \\mathrm{Hz}$ จุด P อยู่บนแนวปฏิบัพที่ 2 (นับแนวกลางเป็นแนวที่ 0) และอยู่ห่างจากแหล่งทั้งสองต่างกัน $6\\ \\mathrm{cm}$ คลื่นน้ำมีอัตราเร็วกี่เซนติเมตรต่อวินาที (ตอบเป็นตัวเลขในหน่วย cm/s)"
    answer: { value: 30, unit: cm/s }
    hints:
      - "บนแนวปฏิบัพที่ $n$ ผลต่างระยะทางเท่ากับ $n\\lambda$"
      - "หา $\\lambda$ จาก $2\\lambda = 6\\ \\mathrm{cm}$"
      - "แล้วใช้ $v = f\\lambda$"
    misconceptions:
      - { match: 60, feedback: "ดูเหมือนใช้ผลต่างระยะทาง $6\\ \\mathrm{cm}$ เป็นความยาวคลื่นเลย แต่แนวปฏิบัพที่ 2 มีผลต่างระยะทาง $2\\lambda$" }
      - { match: 40, feedback: "ดูเหมือนใช้สูตรของแนวบัพ $(n - \\tfrac{1}{2})\\lambda$ แต่จุด P อยู่บนแนวปฏิบัพ ใช้ $n\\lambda$" }
    solution: "แนวปฏิบัพที่ 2: $2\\lambda = 6\\ \\mathrm{cm}$ → $\\lambda = 3\\ \\mathrm{cm}$ ดังนั้น $v = f\\lambda = (10\\ \\mathrm{Hz})(3\\ \\mathrm{cm}) = 30\\ \\mathrm{cm/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wbeh.p009
    topics: [physics.waves.wave-behaviour]
    difficulty: 4
    type: mcq
    stem: "นักเรียนยืนอยู่หลังกำแพงโรงอาหาร ข้างประตูที่เปิดอยู่ ได้ยินเสียงเพื่อนคุยกันอีกฝั่งของกำแพงชัดเจน แต่มองไม่เห็นเพื่อน ข้อใดอธิบายได้ดีที่สุด"
    choices:
      - { id: a, text: "ความยาวคลื่นเสียง (ราว 1 m) ใกล้เคียงกับความกว้างประตู จึงเลี้ยวเบนได้มาก ส่วนความยาวคลื่นแสงเล็กกว่าประตูมากจึงแทบไม่เลี้ยวเบน", correct: true }
      - { id: b, text: "เสียงสะท้อนจากผนังได้ แต่แสงสะท้อนไม่ได้", feedback: "แสงสะท้อนได้ เราจึงเห็นภาพในกระจกเงา ความต่างที่สำคัญคือขนาดความยาวคลื่นเมื่อเทียบกับประตู" }
      - { id: c, text: "เสียงเคลื่อนที่เร็วกว่าแสง จึงอ้อมกำแพงได้ทัน", feedback: "แสงเร็วกว่าเสียงเกือบล้านเท่า อัตราเร็วไม่ได้ทำให้คลื่นอ้อมสิ่งกีดขวางได้มากหรือน้อย" }
      - { id: d, text: "เสียงเป็นคลื่น แต่แสงไม่ใช่คลื่น", feedback: "แสงก็เป็นคลื่น และเลี้ยวเบนได้เช่นกันเมื่อผ่านช่องที่แคบมากระดับไมโครเมตร" }
    hints:
      - "การเลี้ยวเบนเห็นชัดเมื่อเทียบขนาดช่องกับอะไร"
      - "เปรียบเทียบความยาวคลื่นของเสียงพูดกับแสงกับความกว้างประตูประมาณ 1 m"
    solution: "การเลี้ยวเบนชัดเมื่อช่องกว้างใกล้เคียงหรือน้อยกว่าความยาวคลื่น เสียงพูดมี $\\lambda \\sim 1\\ \\mathrm{m}$ ใกล้เคียงประตู จึงแผ่อ้อมไปหลังกำแพง แสงมี $\\lambda \\sim 5 \\times 10^{-7}\\ \\mathrm{m}$ เล็กกว่าประตูนับล้านเท่า จึงเดินเกือบเป็นเส้นตรงและเกิดเงา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wbeh.p010
    topics: [physics.waves.wave-behaviour]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการหาหน้าคลื่นใหม่ด้วยหลักของฮอยเกนส์ให้ถูกต้อง"
    items:
      - "วาดหน้าคลื่นในขณะปัจจุบัน"
      - "เลือกจุดหลาย ๆ จุดบนหน้าคลื่นนั้นให้เป็นแหล่งกำเนิดคลื่นย่อย"
      - "วาดวงกลมรัศมี $v\\Delta t$ รอบแต่ละจุด แทนคลื่นย่อยหลังเวลา $\\Delta t$"
      - "ลากเส้นสัมผัสร่วมของวงกลมทุกวง ได้หน้าคลื่นใหม่"
    hints:
      - "ต้องมีหน้าคลื่นเดิมก่อน จึงจะเลือกจุดบนมันได้"
      - "หน้าคลื่นใหม่เป็นผลลัพธ์สุดท้ายที่ได้จากคลื่นย่อยทั้งหมด"
    solution: "เริ่มจากหน้าคลื่นปัจจุบัน → ให้จุดบนหน้าคลื่นเป็นแหล่งกำเนิดคลื่นย่อย → วาดคลื่นย่อยรัศมี $v\\Delta t$ → เส้นสัมผัสร่วมของคลื่นย่อยคือหน้าคลื่นใหม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wbeh.p011
    topics: [physics.waves.wave-behaviour]
    difficulty: 5
    type: numeric
    stem: "ในห้องประชุมโรงเรียน ลำโพงสองตัวต่อกับเครื่องเสียงเดียวกันจึงส่งเสียงเฟสตรงกัน ผู้ฟังนั่งห่างลำโพงตัวแรก $5.00\\ \\mathrm{m}$ และตัวที่สอง $5.85\\ \\mathrm{m}$ อัตราเร็วเสียง $340\\ \\mathrm{m/s}$ เสียงความถี่ **ต่ำสุด** เท่าใดที่ผู้ฟังได้ยินเบาที่สุดเพราะการหักล้างกัน (ตอบเป็นตัวเลขในหน่วย Hz)"
    answer: { value: 200, unit: Hz }
    hints:
      - "หาผลต่างระยะทางก่อน"
      - "ความถี่ต่ำสุดคู่กับความยาวคลื่นยาวที่สุด ซึ่งคือกรณีแนวบัพที่ 1 ผลต่างระยะทาง $= \\tfrac{1}{2}\\lambda$"
      - "หา $\\lambda$ แล้วใช้ $f = \\dfrac{v}{\\lambda}$"
    misconceptions:
      - { match: 400, feedback: "ดูเหมือนให้ผลต่างระยะทางเท่ากับ $\\lambda$ ซึ่งเป็นเงื่อนไขเสริมกัน (ดังที่สุด) หักล้างกันต้องให้ผลต่างระยะทาง $= \\tfrac{1}{2}\\lambda$" }
    solution: "ผลต่างระยะทาง $= 5.85 - 5.00 = 0.85\\ \\mathrm{m}$ หักล้างกันครั้งแรก: $\\tfrac{1}{2}\\lambda = 0.85\\ \\mathrm{m}$ → $\\lambda = 1.70\\ \\mathrm{m}$ ดังนั้น $f = \\dfrac{340\\ \\mathrm{m/s}}{1.70\\ \\mathrm{m}} = 200\\ \\mathrm{Hz}$ (ความถี่ถัดไปที่หักล้างกันคือ $1.5\\lambda = 0.85$ ได้ $600\\ \\mathrm{Hz}$ ซึ่งสูงกว่า)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wbeh.p012
    topics: [physics.waves.wave-behaviour]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "คลื่นน้ำเคลื่อนแนวเฉียงจากเขตน้ำลึกเข้าสู่เขตน้ำตื้น ข้อใดถูกต้อง (เลือกได้มากกว่า 1 ข้อ)"
    choices:
      - { id: a, text: "อัตราเร็วของคลื่นลดลง", correct: true }
      - { id: b, text: "ความยาวคลื่นสั้นลง", correct: true }
      - { id: c, text: "ทิศของคลื่นเบนเข้าหาเส้นปกติ", correct: true }
      - { id: d, text: "ความถี่ของคลื่นลดลง", feedback: "ความถี่ถูกกำหนดโดยแหล่งกำเนิด จึงเท่าเดิม ที่ลดลงคืออัตราเร็วและความยาวคลื่น" }
      - { id: e, text: "ทิศของคลื่นเบนออกจากเส้นปกติ", feedback: "คลื่นที่ช้าลงมี $\\sin\\theta_2 < \\sin\\theta_1$ มุมหักเหจึงเล็กกว่ามุมตกกระทบ แปลว่าเบนเข้าหาเส้นปกติ" }
      - { id: f, text: "ความยาวคลื่นยาวขึ้นเพราะคลื่นต้องอัดตัวในน้ำตื้น", feedback: "จาก $\\lambda = \\dfrac{v}{f}$ เมื่อ $v$ ลดลงและ $f$ คงที่ ความยาวคลื่นต้องสั้นลง" }
    hints:
      - "คลื่นน้ำในน้ำตื้นเร็วขึ้นหรือช้าลง"
      - "ใช้ $\\lambda = \\dfrac{v}{f}$ และ $\\dfrac{\\sin\\theta_1}{\\sin\\theta_2} = \\dfrac{v_1}{v_2}$ พิจารณาทีละข้อ"
    solution: "ในน้ำตื้นคลื่นช้าลง ($v_2 < v_1$) ความถี่คงเดิม ความยาวคลื่น $\\lambda = \\tfrac{v}{f}$ จึงสั้นลง และ $\\sin\\theta_2 = \\sin\\theta_1 \\cdot \\tfrac{v_2}{v_1} < \\sin\\theta_1$ คลื่นจึงเบนเข้าหาเส้นปกติ ข้อถูกคือ a, b, c"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wbeh.p013
    topics: [physics.waves.wave-behaviour]
    difficulty: 4
    type: expression
    stem: "ลำโพงสองตัวส่งเสียงเฟสตรงกัน ผู้ฟังอยู่ห่างลำโพงทั้งสองต่างกัน $d$ และอัตราเร็วเสียงเป็น $v$ จงเขียนความถี่ **ต่ำสุด** $f$ ที่ทำให้ผู้ฟังได้ยินเสียงเบาที่สุดเพราะการหักล้างกัน ในรูปของ $v$ และ $d$"
    prefix: "f ="
    answer: { latex: "\\frac{v}{2d}", variables: [v, d] }
    misconceptions:
      - { match: "\\frac{v}{d}", feedback: "ผลต่างระยะทาง $d = \\lambda$ ให้การเสริมกัน การหักล้างกันครั้งแรกต้องให้ $d = \\tfrac{1}{2}\\lambda$" }
      - { match: "\\frac{2d}{v}", feedback: "นั่นคือคาบ ไม่ใช่ความถี่ จาก $\\lambda = 2d$ ความถี่คือ $f = \\dfrac{v}{\\lambda}$" }
    hints:
      - "ความถี่ต่ำสุดคู่กับความยาวคลื่นยาวที่สุดที่ยังหักล้างกัน คือแนวบัพที่ 1"
      - "ตั้ง $d = \\tfrac{1}{2}\\lambda$ หา $\\lambda$ แล้วแทนใน $f = \\dfrac{v}{\\lambda}$"
    solution: "แนวบัพที่ 1: $d = \\tfrac{1}{2}\\lambda$ → $\\lambda = 2d$ ดังนั้น $f = \\dfrac{v}{\\lambda} = \\dfrac{v}{2d}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wbeh.p014
    topics: [physics.waves.wave-behaviour]
    difficulty: 3
    type: mcq
    stem: "สะบัดเชือกให้เกิดคลื่นดลเป็นสันคลื่นขึ้นด้านบน ปลายเชือกอีกด้านผูกแน่นกับเสา คลื่นดลที่สะท้อนกลับมามีลักษณะอย่างไร"
    choices:
      - { id: a, text: "กลับหัวเป็นท้องคลื่นด้านล่าง เคลื่อนกลับมาหาผู้สะบัด", correct: true }
      - { id: b, text: "เป็นสันคลื่นด้านบนเหมือนเดิม เคลื่อนกลับมาหาผู้สะบัด", feedback: "แบบนี้เกิดกับปลายอิสระ เช่น ปลายเชือกผูกกับห่วงที่เลื่อนบนเสาได้ แต่ปลายที่ผูกแน่นเป็นปลายตรึง คลื่นสะท้อนจะกลับหัว" }
      - { id: c, text: "ไม่สะท้อน เพราะพลังงานถูกเสาดูดกลืนไปหมด", feedback: "ปลายตรึงสะท้อนคลื่นได้ดี จะสังเกตเห็นคลื่นดลวิ่งกลับมาชัดเจน" }
      - { id: d, text: "สะท้อนกลับมาด้วยแอมพลิจูดมากขึ้น", feedback: "การสะท้อนไม่เพิ่มพลังงานให้คลื่น แอมพลิจูดจึงเท่าเดิมหรือลดลงเล็กน้อย ไม่มากขึ้น" }
    hints:
      - "ปลายที่ผูกแน่นกับเสาเป็นปลายตรึงหรือปลายอิสระ"
      - "ที่ปลายตรึง เชือกขยับไม่ได้ เสาจึงออกแรงดึงเชือกในทิศตรงข้าม"
    solution: "ปลายผูกแน่นเป็นปลายตรึง เมื่อคลื่นดลมาถึง เชือกดึงเสาขึ้น เสาจึงดึงเชือกลงตามกฎข้อที่สามของนิวตัน คลื่นสะท้อนจึงกลับหัวเป็นท้องคลื่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wbeh.p015
    topics: [physics.waves.wave-behaviour]
    difficulty: 1
    type: mcq
    stem: "ห้องซ้อมดนตรีของโรงเรียนบุผนังด้วยแผ่นฟองน้ำและติดผ้าม่านหนา จุดประสงค์หลักคือข้อใด"
    choices:
      - { id: a, text: "ให้ผนังดูดกลืนเสียง เสียงจึงสะท้อนกลับมาน้อยลงและรั่วออกนอกห้องน้อยลง", correct: true }
      - { id: b, text: "ให้ผนังสะท้อนเสียงได้ดีขึ้น เสียงในห้องจะได้ก้องกังวาน", feedback: "ผิวที่สะท้อนเสียงได้ดีคือผิวแข็งเรียบ เช่น คอนกรีต กระจก ส่วนวัสดุนุ่มมีรูพรุนดูดกลืนเสียง" }
      - { id: c, text: "ทำให้เสียงเดินทางในห้องเร็วขึ้น", feedback: "อัตราเร็วเสียงขึ้นกับอากาศในห้อง ไม่ได้ขึ้นกับวัสดุบุผนัง" }
    hints:
      - "เมื่อเสียงไปถึงผนัง พลังงานเสียงไปได้สามทาง คือสะท้อน ส่งผ่าน หรือถูกดูดกลืน"
      - "วัสดุนุ่มที่มีรูพรุนทำอะไรกับพลังงานเสียง"
    solution: "ฟองน้ำและผ้าม่านหนาดูดกลืนพลังงานเสียงเปลี่ยนเป็นความร้อนเล็กน้อย เสียงสะท้อนในห้องจึงลดลง (ไม่ก้อง) และเสียงที่ส่งผ่านผนังออกไปรบกวนข้างนอกก็ลดลงด้วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wbeh.p016
    topics: [physics.waves.wave-behaviour]
    difficulty: 2
    type: numeric
    stem: "ภาพแสดงคลื่นดลสองลูกในเส้นเชือกเคลื่อนที่เข้าหากัน ทั้งสองกว้างเท่ากัน ขณะที่คลื่นดลทั้งสองซ้อนทับกันพอดี จุดกึ่งกลางของบริเวณที่ซ้อนกันมีการกระจัดเท่าใด (ตอบเป็นตัวเลขในหน่วย cm ถ้าอยู่ใต้แนวเชือกปกติให้ใส่เครื่องหมายลบ)"
    figure:
      src: two-pulses.svg
      alt: "เชือกแนวนอนมีคลื่นดลสองลูก ลูกซ้ายนูนขึ้นสูง 2 cm เคลื่อนที่ไปทางขวา ลูกขวาคว่ำลงลึก 1 cm เคลื่อนที่ไปทางซ้าย ทั้งสองลูกกว้าง 4 cm เท่ากัน"
    answer: { value: 1, tolerance: 0.01, unit: cm }
    hints:
      - "ใช้หลักการซ้อนทับ: การกระจัดรวมคือผลบวกของการกระจัดจากแต่ละคลื่น"
      - "การกระจัดขึ้นเป็นบวก ลงเป็นลบ"
    misconceptions:
      - { match: 3, feedback: "ดูเหมือนบวกขนาดโดยไม่คิดเครื่องหมาย คลื่นดลลูกขวาคว่ำลง การกระจัดจึงเป็น $-1\\ \\mathrm{cm}$" }
      - { match: 0, feedback: "คลื่นหักล้างกันหมดเมื่อขนาดเท่ากันเท่านั้น ลูกหนึ่งสูง 2 อีกลูกลึก 1 จึงเหลือ 1" }
    solution: "การกระจัดรวม $= (+2) + (-1) = +1\\ \\mathrm{cm}$ เหนือแนวเชือก หลังผ่านกันไป คลื่นดลแต่ละลูกกลับมามีรูปร่างเดิม"
