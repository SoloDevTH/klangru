    type: numeric
    stem: 'จากความดัน 39.98 bar ของ $\mathrm{CO_2}$ 1.00 mol ใน 0.500 L ที่ 300 K (คำนวณด้วยแวนเดอร์วาลส์) จงหาค่า $Z = \frac{PV}{nRT}$ (ตอบทศนิยม 3 ตำแหน่ง)'
