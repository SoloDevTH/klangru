  - { front: "pH + pOH ที่ 25 °C", back: "14.00 (Kw = 1.0 × 10⁻¹⁴)" }
  - { front: "Ka × Kb ของคู่กรด-เบส", back: "Kw" }
  - { front: "CH₃COONa / NH₄Cl / NaCl ในน้ำ", back: "เบส / กรด / กลาง" }
  - { front: "pH ของกรดอ่อน (ประมาณ)", back: "[H₃O⁺] ≈ √(Ka·C) แล้ว pH = −log[H₃O⁺]" }
