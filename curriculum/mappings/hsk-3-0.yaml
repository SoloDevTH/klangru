# หัวข้อภาษาจีนในคลังเทียบกับระดับของ GF 0025—2021 ทั้งหมดเป็นส่วนย่อยของระดับ 1 จึงเป็น partial
framework: hsk-3-0
mappings:
  - topic: chinese.pinyin.tones
    indicators: ["HSK3.0-L1"]
    coverage: partial
    note: "วรรณยุกต์และการเขียนพินอินเป็นพื้นฐานของการออกเสียงพยางค์ระดับ 1 (269 พยางค์) ยังไม่ครอบคลุมคำศัพท์และไวยากรณ์ของระดับ"
  - topic: chinese.hanzi.basic-strokes
    indicators: ["HSK3.0-L1"]
    coverage: partial
    note: "ด้าน 写 ของระดับ 1 กำหนดให้รู้กฎขีดและลำดับขีดเบื้องต้น หัวข้อสอนขีดพื้นฐานและกฎลำดับขีด ยังไม่ได้ฝึกเขียนอักษร 100 ตัวของระดับ"
  - topic: chinese.hanzi.numbers
    indicators: ["HSK3.0-L1"]
    coverage: partial
    note: "ตัวเลข 一 ถึง 十 百 และ 两 อยู่ในจุดไวยากรณ์ระดับ 1 (数词 一-07) และอักษร 八 九 百 อยู่ในรายการอักษรระดับ 1 หัวข้อยังไม่สอน 半 และลักษณนาม"
  - topic: chinese.culture.festivals
    indicators: [HSK3.0-L3]
    coverage: partial
    note: ครอบคลุมหัวข้อ เทศกาลและประเพณี ของระดับ 3 ด้านคำศัพท์และวัฒนธรรม (春节 端午节 中秋节 元宵节 คำอวยพร) แต่ไม่ได้ฝึกอ่าน ฟัง หรือเขียนข้อความยาวระดับ 3
  - topic: chinese.grammar.measure-words
    indicators: [HSK3.0-L1, HSK3.0-L2]
    coverage: partial
    note: ลักษณนาม 个 本 杯 家 口 块 页 โครงสร้าง ตัวเลข + ลักษณนาม + คำนาม และ 两 ครบตามขอบเขต แต่เป็นเพียงส่วนหนึ่งของระดับ 1
  - topic: chinese.grammar.pronouns-shi
    indicators: [HSK3.0-L1]
    coverage: partial
    note: สรรพนามบุคคล คำชี้ 这 那 ประโยค 是/不是 และ 的 แสดงความเป็นเจ้าของ เป็นจุดไวยากรณ์ส่วนหนึ่งของระดับ 1
  - topic: chinese.hanzi.radicals
    indicators: [HSK3.0-L1, HSK3.0-L2]
    coverage: partial
    note: โครงสร้างอักษร หมวดอักษร และการเขียน 林 ตามลำดับขีด ช่วยด้านการเขียนและจำอักษรระดับ 1 แต่ไม่ได้ฝึกครบรายการอักษรของระดับ
  - topic: chinese.pinyin.initials-finals
    indicators: [HSK3.0-L1]
    coverage: partial
    note: พยัญชนะต้น 21 ตัว สระทุกประเภท และกฎการเขียน y w ü รูปย่อ iu ui un เป็นพื้นฐานของพยางค์ 269 พยางค์ระดับ 1 แต่ไม่ได้ฝึกฟังและออกเสียงจริง
  - topic: chinese.pinyin.tone-sandhi
    indicators: [HSK3.0-L1, HSK3.0-L2]
    coverage: partial
    note: กฎเสียง 3 ติดกัน เสียง 3 ครึ่ง 一 不 และเสียงเบาในคำระดับ 1 ช่วยอ่านพินอินของคำระดับนี้ได้ถูก แต่ไม่ได้ฝึกฟังและพูด
  - topic: chinese.vocab.greetings
    indicators: [HSK3.0-L1]
    coverage: partial
    note: คำทักทาย ขอบคุณ ขอโทษ ลาก่อน และคำตอบ เป็นส่วนหนึ่งของการสนทนาสั้น ๆ ในเรื่องที่คุ้นที่สุดของระดับ 1 ยังไม่ครอบคลุมคำศัพท์ 500 คำและไวยากรณ์ของระดับ
  - topic: chinese.vocab.time-dates
    indicators: [HSK3.0-L1]
    coverage: partial
    note: 年 月 号/日 星期 点 分 半 差 ช่วงของวัน และลำดับวันที่แบบจีน เป็นส่วนหนึ่งของคำศัพท์และไวยากรณ์ระดับ 1 (หัวข้อกิจวัตร การเดินทาง)
