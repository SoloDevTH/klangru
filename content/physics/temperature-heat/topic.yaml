id: physics.thermal.temperature-heat
subject: physics
title: { th: อุณหภูมิและความร้อน, en: Temperature and heat }
summary: แยกอุณหภูมิกับความร้อน แปลงองศาเซลเซียสเป็นเคลวิน คำนวณความร้อนจากความจุความร้อนจำเพาะ และหาอุณหภูมิสุดท้ายเมื่อผสมน้ำร้อนกับน้ำเย็น
difficulty: 4
minutes: 35
prerequisites: [physics.units.si, math.algebra.rearrange-formula]
encompasses:
  - { id: physics.units.si, weight: 0.2 }
  - { id: math.algebra.rearrange-formula, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: equilibrium-graph.svg
    alt: "กราฟอุณหภูมิ (องศาเซลเซียส) กับเวลา (นาที) 0 ถึง 12 นาที เส้นสีแดงคือน้ำร้อน 2 kg เริ่มที่ 80 °C ลดลงเร็วในช่วงแรกแล้วช้าลง เส้นสีน้ำเงินคือน้ำเย็น 3 kg เริ่มที่ 20 °C เพิ่มขึ้นเร็วในช่วงแรกแล้วช้าลง ทั้งสองเส้นเข้าใกล้เส้นประที่ 44 °C"
    caption: "ของร้อนเย็นลงและของเย็นอุ่นขึ้นจนอุณหภูมิเท่ากันที่ $44\\ ^\\circ\\mathrm{C}$ น้ำร้อนลดลง $36\\ \\mathrm{K}$ แต่น้ำเย็นเพิ่มขึ้นเพียง $24\\ \\mathrm{K}$ เพราะมีมวลมากกว่า"
  - type: worked-example
    title: กาต้มน้ำไฟฟ้าใช้เวลาเท่าใด
    problem: "กาต้มน้ำไฟฟ้ากำลัง $1{,}500\\ \\mathrm{W}$ ต้มน้ำ $1\\ \\mathrm{kg}$ จาก $30\\ ^\\circ\\mathrm{C}$ จนเดือดที่ $100\\ ^\\circ\\mathrm{C}$ ถ้าความร้อนทั้งหมดเข้าสู่น้ำ ต้องใช้เวลาเท่าใด ($c_{\\text{น้ำ}} = 4{,}200\\ \\mathrm{J/(kg\\cdot K)}$)"
    steps:
      - text: "อุณหภูมิเปลี่ยน: $\\Delta T = 100 - 30 = 70\\ \\mathrm{K}$"
      - text: "ความร้อนที่น้ำต้องได้รับ: $Q = mc\\,\\Delta T = (1)(4{,}200)(70) = 294{,}000\\ \\mathrm{J}$"
      - text: "กาให้พลังงาน $1{,}500\\ \\mathrm{J}$ ทุกวินาที จึงตั้ง $Pt = Q$"
        why: "กำลัง $1\\ \\mathrm{W} = 1\\ \\mathrm{J/s}$ พลังงานไฟฟ้าทั้งหมดกลายเป็นความร้อนในน้ำตามที่โจทย์สมมติ"
      - text: "$t = \\dfrac{294{,}000\\ \\mathrm{J}}{1{,}500\\ \\mathrm{W}} = 196\\ \\mathrm{s}$ หรือราว 3 นาที 16 วินาที"
    answer: "ประมาณ $196\\ \\mathrm{s}$ (ในความจริงนานกว่านี้เล็กน้อย เพราะความร้อนบางส่วนรั่วออก)"
  - { type: check, problem: phy.heat.p017, prompt: "ลองกับกาต้มน้ำอีกใบ" }
  - type: worked-example
    title: หาความจุความร้อนจำเพาะของโลหะด้วยการผสม
    problem: "นำก้อนโลหะมวล $0.2\\ \\mathrm{kg}$ ที่แช่ในน้ำเดือด ($100\\ ^\\circ\\mathrm{C}$) ใส่ลงในน้ำ $0.4\\ \\mathrm{kg}$ ที่ $25\\ ^\\circ\\mathrm{C}$ ในภาชนะฉนวน อุณหภูมิสุดท้ายเป็น $30\\ ^\\circ\\mathrm{C}$ โลหะนี้มีความจุความร้อนจำเพาะเท่าใด"
    steps:
      - text: "โลหะร้อนกว่า จึงให้ความร้อน: $Q_{\\text{ให้}} = (0.2)\\,c\\,(100 - 30) = 14c$"
        why: "ผลต่างของโลหะคืออุณหภูมิเริ่มลบอุณหภูมิสุดท้าย ไม่ใช่ $100 - 25$"
      - text: "น้ำรับความร้อน: $Q_{\\text{รับ}} = (0.4)(4{,}200)(30 - 25) = 8{,}400\\ \\mathrm{J}$"
      - text: "ไม่มีความร้อนรั่ว: $14c = 8{,}400$"
      - text: "$c = \\dfrac{8{,}400}{14} = 600\\ \\mathrm{J/(kg\\cdot K)}$"
        why: "ตรวจความสมเหตุสมผล: โลหะส่วนใหญ่มี $c$ น้อยกว่าน้ำมาก โลหะจึงเย็นลง $70\\ \\mathrm{K}$ ขณะที่น้ำอุ่นขึ้นเพียง $5\\ \\mathrm{K}$"
    answer: "$c \\approx 600\\ \\mathrm{J/(kg\\cdot K)}$"
  - type: figure
    src: heat-transfer.svg
    alt: "หม้อน้ำตั้งบนเตาไฟ ด้ามหม้อโลหะมีลูกศรสีแดงชี้ออกจากหม้อตามแนวด้าม แสดงการนำความร้อนไปถึงมือ ในน้ำมีลูกศรวนสองวง น้ำร้อนลอยขึ้นตรงกลางและน้ำเย็นจมลงข้างผนัง แสดงการพาความร้อน ด้านซ้ายมีลูกศรหยักสีม่วงแผ่ออกจากหม้อและเปลวไฟ แสดงการแผ่รังสีความร้อนที่รู้สึกได้โดยไม่ต้องสัมผัส"
    caption: "การนำต้องสัมผัสกัน การพาเกิดในของไหลที่ไหลวน ส่วนการแผ่รังสีไม่ต้องอาศัยตัวกลาง"
  - { type: check, problem: phy.heat.p014 }
  - type: interactive
    title: ให้ความร้อนเท่ากัน สารไหนร้อนเร็วกว่า
    caption: แกนนอนคือความร้อนที่ให้ (kJ) แกนตั้งคืออุณหภูมิ (°C) เริ่มที่ 20 °C ทั้งคู่ เส้นแรกคือน้ำ (c = 4.2 kJ/(kg·K)) เส้นที่สองคือสารที่เลือก c เองได้ ลองตั้ง c = 2 (ประมาณน้ำมันพืช) จะเห็นว่าความชันมากกว่าน้ำราวสองเท่า และลองเพิ่มมวล m เส้นทั้งสองจะลาดลง เพราะต้องใช้ความร้อนมากขึ้นเพื่อให้อุณหภูมิขึ้นเท่าเดิม
    widget:
      kind: function-plot
      functions: ["20 + \\frac{x}{4.2 m}", "20 + \\frac{x}{c m}"]
      sliders:
        - { name: m, min: 0.5, max: 5, step: 0.5, value: 1, label: มวลของสารแต่ละชนิด m (kg) }
        - { name: c, min: 0.4, max: 4.2, step: 0.1, value: 2, label: ความจุความร้อนจำเพาะของสารที่สอง c (kJ/(kg·K)) }
      x: [0, 400]
      y: [0, 120]
  - type: simulation
    title: รูปแบบพลังงานและการเปลี่ยนรูป (PhET Energy Forms and Changes)
    url: https://phet.colorado.edu/en/simulations/energy-forms-and-changes
    provider: phet
    note: วางก้อนเหล็กและก้อนอิฐบนเตาแล้วให้ความร้อนพร้อมกัน สังเกตว่าเหล็กร้อนเร็วกว่า จากนั้นนำของร้อนไปวางในน้ำ ดูพลังงานไหลจากของร้อนไปของเย็นจนอุณหภูมิเท่ากัน
glossary:
  - { term: อุณหภูมิ, definition: "ระดับความร้อนเย็นของวัตถุ สัมพันธ์กับพลังงานจลน์เฉลี่ยของอนุภาค หน่วย SI คือเคลวิน ($\\mathrm{K}$)" }
  - { term: ความร้อน, definition: "พลังงานที่ถ่ายโอนจากวัตถุอุณหภูมิสูงไปยังวัตถุอุณหภูมิต่ำ มีหน่วยจูล ($\\mathrm{J}$)" }
  - { term: ความจุความร้อนจำเพาะ, definition: "ความร้อนที่ทำให้สาร $1\\ \\mathrm{kg}$ มีอุณหภูมิเปลี่ยน $1\\ \\mathrm{K}$ หน่วย $\\mathrm{J/(kg\\cdot K)}$ น้ำมีค่าประมาณ $4{,}200$" }
  - { term: สมดุลความร้อน, definition: "สภาวะที่วัตถุที่สัมผัสกันมีอุณหภูมิเท่ากัน จึงไม่มีความร้อนถ่ายโอนระหว่างกันอีก" }
flashcards:
  - { front: "แปลง $\\theta\\ ^\\circ\\mathrm{C}$ เป็นเคลวิน", back: "$T = \\theta + 273$ เช่น $27\\ ^\\circ\\mathrm{C} = 300\\ \\mathrm{K}$" }
  - { front: "สูตรความร้อนที่ทำให้อุณหภูมิเปลี่ยน", back: "$Q = mc\\,\\Delta T$ โดย $Q$ (J), $m$ (kg), $c$ (J/(kg·K)), $\\Delta T$ (K)" }
  - { front: "อุณหภูมิเปลี่ยน $30\\ ^\\circ\\mathrm{C}$ เท่ากับกี่เคลวิน", back: "$30\\ \\mathrm{K}$ ผลต่างอุณหภูมิในสองสเกลเท่ากัน ไม่ต้องบวก 273" }
  - { front: "หลักการคำนวณการผสมของร้อนกับของเย็น", back: "ความร้อนที่ของร้อนให้ = ความร้อนที่ของเย็นรับ: $m_1 c_1 (T_1 - T) = m_2 c_2 (T - T_2)$" }
