    ai_assisted: true

  - id: math.algebra.polynomial-equations.p018
    topics: [math.algebra.polynomial-equations]
    difficulty: 5
    type: numeric
    stem: "แท็งก์น้ำทรงลูกบาศก์ยาวด้านละ $x$ เมตร ถ้าเพิ่มความยาวทุกด้านอีก 1 เมตร จะจุน้ำได้เพิ่มขึ้น 19 ลูกบาศก์เมตร แท็งก์เดิมยาวด้านละกี่เมตร"
    answer: { value: 2, unit: เมตร }
    hints:
      - "$(x + 1)^3 - x^3 = 19$"
      - "กระจาย $(x + 1)^3 = x^3 + 3x^2 + 3x + 1$ แล้วจะเหลือสมการกำลังสอง"
    misconceptions:
      - { match: 3, feedback: "3 คือความยาวด้านของแท็งก์ใหม่ $x + 1$ โจทย์ถามแท็งก์เดิม" }
      - { match: -3, feedback: "$x = -3$ เป็นคำตอบของสมการ แต่ความยาวด้านต้องเป็นจำนวนบวก" }
    solution: "$(x + 1)^3 - x^3 = 3x^2 + 3x + 1 = 19$ ได้ $x^2 + x - 6 = 0$, $(x + 3)(x - 2) = 0$ ความยาวต้องเป็นบวก $x = 2$ (ตรวจ: $27 - 8 = 19$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

