    type: mcq
    stem: "ครูใช้ไฟฉายแทนดวงอาทิตย์ และหมุนลูกโลกช้า ๆ ไปทางทิศตะวันออก สติกเกอร์รูปคนที่ประเทศไทยกำลังเคลื่อนจากด้านที่สว่างเข้าไปในด้านที่มืด ที่ประเทศไทยตอนนั้นน่าจะเป็นเวลาใด"
    choices:
      - { id: a, text: "ตอนเย็น ดวงอาทิตย์กำลังตก", correct: true }
      - { id: b, text: "ตอนเช้า ดวงอาทิตย์กำลังขึ้น", feedback: "ตอนเช้าประเทศไทยหมุนจากด้านมืดเข้าหาด้านสว่าง ซึ่งกลับกันกับในโจทย์" }
      - { id: c, text: "ตอนเที่ยง", feedback: "ตอนเที่ยงประเทศไทยอยู่กลางด้านที่สว่าง หันตรงเข้าหาไฟฉาย" }
      - { id: d, text: "เที่ยงคืน", feedback: "เที่ยงคืนประเทศไทยอยู่กลางด้านที่มืด ไม่ใช่ที่ขอบระหว่างสว่างกับมืด" }
    hints:
      - "ด้านที่สว่างคือกลางวัน ด้านที่มืดคือกลางคืน"
      - "ช่วงเปลี่ยนจากกลางวันเป็นกลางคืนเรียกว่าตอนอะไร"
    solution: "เมื่อประเทศไทยหมุนออกจากด้านที่ได้รับแสงเข้าสู่ด้านมืด กลางวันกำลังเปลี่ยนเป็นกลางคืน คือตอนเย็นที่ดวงอาทิตย์ตก"
