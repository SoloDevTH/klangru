<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" font-family="sans-serif" font-size="13">
<title>ผังกระบวนการผลิตถุงมือยางสี่ขั้น พร้อมผลได้ครั้งแรกของแต่ละขั้น</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="900" height="200" fill="#ffffff"/>
<text x="450.0" y="26.0" text-anchor="middle" font-size="16" fill="#222" font-weight="bold">กระบวนการผลิตถุงมือยาง (สมมติ) และผลได้ครั้งแรกของแต่ละขั้น</text>
<rect x="20.0" y="60.0" width="190.0" height="90.0" rx="8" fill="#f7f7f7" stroke="#1f5fa8" stroke-width="2"/>
<text x="115.0" y="95.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">1 จุ่มแม่พิมพ์ในน้ำยาง</text>
<text x="115.0" y="125.0" text-anchor="middle" font-size="14" fill="#2e7d32">ผลได้ครั้งแรก 98%</text>
<line x1="212.0" y1="105.0" x2="241.3" y2="105.0" stroke="#222" stroke-width="2" marker-end="url(#ah)"/>
<rect x="243.3" y="60.0" width="190.0" height="90.0" rx="8" fill="#f7f7f7" stroke="#1f5fa8" stroke-width="2"/>
<text x="338.3" y="95.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">2 อบให้ยางคงรูป</text>
<text x="338.3" y="125.0" text-anchor="middle" font-size="14" fill="#2e7d32">ผลได้ครั้งแรก 95%</text>
<line x1="435.3" y1="105.0" x2="464.7" y2="105.0" stroke="#222" stroke-width="2" marker-end="url(#ah)"/>
<rect x="466.7" y="60.0" width="190.0" height="90.0" rx="8" fill="#f7f7f7" stroke="#1f5fa8" stroke-width="2"/>
<text x="561.7" y="95.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">3 ถอดและตรวจด้วยลม</text>
<text x="561.7" y="125.0" text-anchor="middle" font-size="14" fill="#2e7d32">ผลได้ครั้งแรก 99%</text>
<line x1="658.7" y1="105.0" x2="688.0" y2="105.0" stroke="#222" stroke-width="2" marker-end="url(#ah)"/>
<rect x="690.0" y="60.0" width="190.0" height="90.0" rx="8" fill="#f7f7f7" stroke="#1f5fa8" stroke-width="2"/>
<text x="785.0" y="95.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">4 นับและบรรจุกล่อง</text>
<text x="785.0" y="125.0" text-anchor="middle" font-size="14" fill="#2e7d32">ผลได้ครั้งแรก 97%</text>
<text x="450.0" y="182.0" text-anchor="middle" font-size="12" fill="#555">ผลได้ครั้งแรก = สัดส่วนชิ้นที่ผ่านขั้นนั้นโดยไม่ต้องแก้ไขหรือทำซ้ำ</text>
</svg>
