id: health.disease.ncd-leading-causes
subject: health
title:
  th: โรคไม่ติดต่อและสาเหตุสำคัญของการเจ็บป่วยและการตายของคนไทย
  en: Non-communicable diseases and the leading causes of illness and death in Thailand
summary: โรคไม่ติดต่อ 4 กลุ่มหลัก สถิติการตายและความชุกจากกรมควบคุมโรค (ข้อมูลปี 2566–2568) ปัจจัยเสี่ยงที่แก้ไขได้ และแนวทางป้องกันทั้งระดับบุคคลและสังคม
difficulty: 4.5
minutes: 35
prerequisites:
- health.disease.communicable
- health.nutrition.basics
encompasses:
- id: health.nutrition.basics
  weight: 0.2
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  title: อัตราตายด้วยโรคไม่ติดต่อหลัก 5 โรค
  src: death-rates.svg
  alt: กราฟแท่งอัตราตายต่อประชากรแสนคน ปี 2564, 2565, 2566 ที่มา มรณบัตร รวบรวมโดยกองโรคไม่ติดต่อ หลอดเลือดสมอง 55.53, 58.02, 58.30 หัวใจขาดเลือด 33.54, 35.07, 33.53 เบาหวาน 24.55, 25.87, 22.03 ความดันโลหิตสูง 14.48, 15.43, 13.47 ทางเดินหายใจเรื้อรัง 8.00, 9.33, 13.26
  caption: อัตราต่อแสนคนใช้เปรียบเทียบระหว่างปีได้ แม้จำนวนประชากรเปลี่ยน
- type: figure
  title: ความชุกที่เพิ่มขึ้นในรอบ 20 ปี
  src: prevalence.svg
  alt: แผนภาพจุดคู่ร้อยละของประชากรอายุ 15 ปีขึ้นไป สำรวจปี 2546–2547 เทียบ 2567–2568 โรคอ้วน 28.6 เป็น 45 อ้วนลงพุง 26 เป็น 44.7 ความดันโลหิตสูง 22 เป็น 29.5 เบาหวาน 6.6 เป็น 10.6
- type: worked-example
  title: อ่านและแปลผลอัตราตาย
  problem: จากกราฟ อัตราตายจากโรคเบาหวานปี 2564 คือ 24.55 และปี 2566 คือ 22.03 ต่อประชากรแสนคน อัตรานี้เปลี่ยนไปกี่เปอร์เซ็นต์ และแปลผลอย่างไร
  steps:
  - text: ผลต่าง $22.03 - 24.55 = -2.52$ ต่อแสนคน
  - text: คิดเป็นร้อยละของค่าเดิม $\frac{-2.52}{24.55} \times 100 \approx -10.3\%$
    why: การเทียบกับค่าเดิมทำให้เห็นขนาดของการเปลี่ยนแปลง
  - text: 'แปลผล: อัตราตายจากเบาหวานลดลงราว 10% แต่ความชุกของเบาหวานเพิ่มขึ้น แปลว่ามีผู้ป่วยมากขึ้น แม้การเสียชีวิตโดยตรงจะลดลง'
  - text: 'ข้อเสนอ: ยังต้องป้องกันการเกิดผู้ป่วยรายใหม่ด้วยอาหาร การออกกำลังกาย และการคัดกรอง'
  answer: ลดลงประมาณ 10.3% แต่จำนวนผู้ป่วยยังเพิ่ม จึงต้องเน้นป้องกัน
- type: check
  problem: health.disease.ncd-leading-causes.p004
  prompt: ลองตอบก่อนอ่านต่อ
- type: worked-example
  title: เสนอแนวทางป้องกันสองระดับ
  problem: ชุมชนแห่งหนึ่งมีผู้ป่วยความดันโลหิตสูงมาก ร้านอาหารส่วนใหญ่ปรุงรสเค็มจัด ไม่มีที่ออกกำลังกาย และผู้ชายวัยทำงานสูบบุหรี่มาก วิเคราะห์สาเหตุและเสนอแนวทางป้องกัน
  steps:
  - text: 'สาเหตุ: กินเค็ม (อาหาร) ขาดกิจกรรมทางกาย และบุหรี่ เป็นปัจจัยที่แก้ไขได้ทั้งหมด'
  - text: 'ระดับบุคคล: วัดความดันที่ รพ.สต. ลดการเติมน้ำปลา เดินวันละ 30 นาที และขอคำปรึกษาเลิกบุหรี่ที่ 1600'
  - text: 'ระดับสังคม: ร้านอาหารมีเมนูลดเค็ม เทศบาลทำลานออกกำลังกาย และกำหนดเขตปลอดบุหรี่ในที่สาธารณะ'
    why: การเปลี่ยนสิ่งแวดล้อมช่วยคนทั้งชุมชนพร้อมกัน
  - text: 'ติดตามผล: เทียบสัดส่วนผู้ที่ความดันควบคุมได้ก่อนและหลังหนึ่งปี'
  answer: ต้องแก้ทั้งพฤติกรรมของแต่ละคนและสิ่งแวดล้อมของชุมชน
- type: check
  problem: health.disease.ncd-leading-causes.p008
glossary:
- term: โรคไม่ติดต่อ (NCDs)
  definition: โรคเรื้อรังที่ไม่แพร่จากคนสู่คน เกิดจากพฤติกรรม สรีรวิทยา สิ่งแวดล้อม และพันธุกรรมร่วมกัน เช่น โรคหัวใจ มะเร็ง เบาหวาน
- term: อัตราตายต่อประชากรแสนคน
  definition: จำนวนผู้เสียชีวิตเทียบกับประชากร 100,000 คน ใช้เปรียบเทียบระหว่างปีหรือพื้นที่ที่มีประชากรต่างกัน
- term: ความชุก
  definition: สัดส่วนของประชากรที่เป็นโรคหรือมีภาวะหนึ่งในช่วงเวลาที่สำรวจ
- term: ปัจจัยด้านเมตาบอลิก
  definition: ภาวะในร่างกายที่เพิ่มความเสี่ยงโรคไม่ติดต่อ ได้แก่ น้ำหนักเกิน ความดันโลหิตสูง น้ำตาลและไขมันในเลือดสูง
flashcards:
- front: คนไทยเสียชีวิตจากโรคไม่ติดต่อ (กรมควบคุมโรค 2569)
  back: ปีละกว่า 400,000 ราย วันละมากกว่า 1,000 คน ร้อยละ 74 ของการเสียชีวิตทั้งหมด
- front: อัตราตายสูงสุดในโรคไม่ติดต่อหลัก 5 โรค ปี 2566
  back: หลอดเลือดสมอง 58.30 ต่อประชากรแสนคน (รองลงมาคือหัวใจขาดเลือด 33.53)
- front: ตัวเร่งโรคไม่ติดต่อ 5 ด้าน
  back: บุหรี่ กิจกรรมทางกายไม่เพียงพอ ดื่มแอลกอฮอล์หนัก อาหารไม่ดีต่อสุขภาพ มลพิษทางอากาศ
- front: หน้าเบี้ยว แขนอ่อนแรงข้างเดียว พูดไม่ชัดทันที
  back: สัญญาณโรคหลอดเลือดสมอง โทร 1669 ทันทีและจำเวลาที่เริ่มมีอาการ
