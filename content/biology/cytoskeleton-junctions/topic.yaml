id: biology.cells.cytoskeleton-junctions
subject: biology
title: { th: โครงร่างเซลล์และรอยต่อระหว่างเซลล์, en: "The cytoskeleton and cell junctions" }
summary: กำลังขยายกับกำลังแยกของกล้อง กล้องอิเล็กตรอนส่องผ่านและส่องกราด โครงร่างเซลล์สามชนิด ซิเลียแบบ 9 + 2 และรอยต่อแน่น เดสโมโซม กับแกปจังก์ชันของเซลล์สัตว์
difficulty: 5
minutes: 40
prerequisites: [biology.cells.cell-structure, biology.cells.membrane-transport]
encompasses:
  - { id: biology.cells.cell-structure, weight: 0.2 }
  - { id: biology.cells.membrane-transport, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: โครงร่างเซลล์สามชนิดในเซลล์สัตว์
    src: cytoskeleton.svg
    alt: "แผนภาพเซลล์รูปวงรีที่มีนิวเคลียสอยู่กลาง มีเซนโทรโซมที่มีเซนทริโอลสองอันอยู่ใกล้นิวเคลียสด้านบนขวา เส้นสีม่วงหนาแผ่จากเซนโทรโซมไปขอบเซลล์คือไมโครทิวบูล เส้นสีเขียวเป็นวงรอบนิวเคลียสคืออินเตอร์มีเดียตฟิลาเมนต์ และเส้นสีแดงสั้น ๆ เรียงใกล้เยื่อหุ้มเซลล์คือไมโครฟิลาเมนต์ ด้านขวามีตารางขนาดเส้นใย: ไมโครฟิลาเมนต์ประมาณ 7 nm อินเตอร์มีเดียตฟิลาเมนต์ประมาณ 10 nm และไมโครทิวบูลประมาณ 25 nm"
    caption: "เส้นใยสามชนิดต่างขนาดและต่างหน้าที่ ภาพเป็นแผนภาพที่วาดโดยทีมคลังรู้ ไม่ได้วาดตามสัดส่วนจริง"
  - type: figure
    title: รอยต่อระหว่างเซลล์สัตว์สามแบบ
    src: junctions.svg
    alt: "สามภาพแสดงเซลล์สองเซลล์ที่แตะกันในแต่ละภาพ ภาพซ้ายมีแถบสีเข้มตลอดแนวรอยต่อที่แสดงรอยต่อแน่น ภาพกลางมีจุดยึดรูปวงรีตรงรอยต่อพร้อมเส้นใยสีเขียวแผ่เข้าสู่ทั้งสองเซลล์คือเดสโมโซม ภาพขวามีช่องรูปท่อสามช่องข้ามรอยต่อพร้อมลูกศรแสดงไอออนผ่านไปมาคือแกปจังก์ชัน"
    caption: "รอยต่อแน่นปิดช่องว่าง เดสโมโซมยึดให้ทนแรงดึง และแกปจังก์ชันให้สารขนาดเล็กผ่าน (แผนภาพโดยทีมคลังรู้)"
  - type: worked-example
    title: หากำลังขยายจากภาพเซลล์ที่วัดได้
    problem: "นักเรียนวัดเซลล์ในภาพถ่ายกว้าง 4.5 cm เซลล์ตัวอย่างนี้สมมติให้จริงกว้าง 9 μm จงหากำลังขยายของภาพ"
    steps:
      - text: "ทำให้หน่วยตรงกันก่อน $4.5\\ \\mathrm{cm} = 45\\ \\mathrm{mm} = 45{,}000\\ \\mu\\mathrm{m}$"
        why: "ขนาดในภาพกับขนาดจริงต้องใช้หน่วยเดียวกัน มิฉะนั้นอัตราส่วนไม่มีความหมาย"
      - text: "ใช้สูตร $\\text{กำลังขยาย} = \\frac{\\text{ขนาดในภาพ}}{\\text{ขนาดจริง}} = \\frac{45{,}000}{9} = 5{,}000$"
      - text: "ตรวจความสมเหตุสมผล ภาพใหญ่กว่าของจริงห้าพันเท่า ซึ่งสูงกว่ากำลังขยายที่กล้องแสงทั่วไปใช้ดูได้จริง (ราวหนึ่งพันถึงหนึ่งพันห้าร้อยเท่า) ภาพจึงจะเบลอแม้ขยายมาก"
        why: "กำลังขยายที่สูงเกินกำลังแยกของกล้องไม่ได้ทำให้เห็นรายละเอียดเพิ่ม"
    answer: "กำลังขยายประมาณ 5,000 เท่า"
  - { type: check, problem: biology.cells.cytoskeleton-junctions.p009, prompt: "ลองคิดก่อนอ่านต่อ: ถ้าต้องการดูผิวสามมิติของขนเล็ก ๆ บนเมล็ดพืช ควรเลือกกล้องแบบใด" }
glossary:
  - { term: โครงร่างเซลล์, definition: "เครือข่ายเส้นใยโปรตีนในไซโทพลาซึมของเซลล์ยูแคริโอต ประกอบด้วยไมโครฟิลาเมนต์ อินเตอร์มีเดียตฟิลาเมนต์ และไมโครทิวบูล" }
  - { term: กำลังขยาย, definition: "อัตราส่วนระหว่างขนาดของภาพกับขนาดจริงของวัตถุ" }
  - { term: กำลังแยก, definition: "ระยะที่น้อยที่สุดระหว่างจุดสองจุดที่กล้องยังแยกเป็นสองจุดได้ ค่ายิ่งน้อยยิ่งละเอียด" }
  - { term: เซนโทรโซม, definition: "บริเวณใกล้นิวเคลียสในเซลล์สัตว์ที่มีเซนทริโอลสองอันและเป็นจุดกำเนิดไมโครทิวบูล" }
  - { term: รอยต่อแน่น, definition: "รอยต่อระหว่างเซลล์ที่เยื่อหุ้มเซลล์ของเซลล์ข้างเคียงหลอมชิดกันเป็นแถบ ปิดช่องว่างไม่ให้สารรั่ว" }
  - { term: แกปจังก์ชัน, definition: "รอยต่อรูปท่อที่ให้ไอออนและโมเลกุลเล็กผ่านจากเซลล์หนึ่งไปอีกเซลล์ได้โดยตรง" }
flashcards:
  - { front: "ไมโครฟิลาเมนต์ อินเตอร์มีเดียตฟิลาเมนต์ ไมโครทิวบูล มีขนาดกว้างประมาณเท่าไร", back: "ไมโครฟิลาเมนต์ 7 nm / อินเตอร์มีเดียตฟิลาเมนต์ 10 nm / ไมโครทิวบูล 25 nm" }
  - { front: "ซิเลียและแฟลเจลลัมมีโครงสร้างแบบใด", back: "9 + 2 คือไมโครทิวบูลคู่ 9 คู่เรียงรอบคู่กลาง 2 เส้น" }
  - { front: "รอยต่อชนิดใดให้ไอออนผ่านระหว่างเซลล์ และชนิดใดกั้นสารรั่ว", back: "แกปจังก์ชันให้ไอออนผ่าน รอยต่อแน่นกั้นสารรั่วระหว่างเซลล์" }
  - { front: "ทำไมกล้องอิเล็กตรอนแยกรายละเอียดได้ดีกว่ากล้องแสง", back: "ลำอิเล็กตรอนมีความยาวคลื่นสั้นกว่าแสงขาวมาก ทำให้กำลังแยกดีกว่าหลายร้อยเท่า" }
