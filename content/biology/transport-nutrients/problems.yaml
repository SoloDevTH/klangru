    solution: "ฟอสฟอรัสช่วยการสร้างดอกและผล สูตร 8-24-24 มีฟอสฟอรัสและโพแทสเซียมสูง ไนโตรเจนต่ำ จึงเหมาะกับไม้ผลก่อนออกดอก"
