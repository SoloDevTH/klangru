        feedback: การไม่แจ้งทำให้ลูกค้าไม่มีโอกาสแก้ไข และไม่เป็นธรรมต่อกระบวนการ
      - id: c
        text: ยืนยันรายงานเป็นลายลักษณ์อักษร ถอนการรับรองเฉพาะส่วนที่ไม่ปลอดภัย และแจ้งหน่วยงานกำกับเมื่อความเสี่ยงต่อสาธารณะยังอยู่
        correct: true
      - id: d
        text: แก้ข้อบกพร่องเองโดยไม่แจ้งใคร เพื่อประหยัดเวลา
        feedback: การแก้เองโดยไม่บันทึกทำให้ไม่มีหลักฐานและอาจทำให้ปัญหาซ้ำได้
    hints:
      - ข้อบกพร่องที่กระทบผู้ใช้อาคารสาธารณะคือความเสี่ยงต่อสาธารณะ
      - ทางเลือกที่ดีต้องให้ลูกค้ามีโอกาสแก้ไขก่อน และต้องบันทึกไว้เสมอ
    solution: วิศวกรควรยืนยันการรายงานเป็นลายลักษณ์อักษรอีกครั้ง ถอนการรับรองเฉพาะส่วนที่ไม่ปลอดภัย และแจ้งหน่วยงานกำกับตามกฎหมายเมื่อความเสี่ยงต่อสาธารณะยังอยู่ การนิ่งเฉยหรือแก้เองโดยไม่แจ้งก็เป็นการละเลยหน้าที่
