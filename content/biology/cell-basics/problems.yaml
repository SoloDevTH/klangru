      - { id: b, text: "พบเซลล์ในเยื่อหอมหัวใหญ่เพียงชนิดเดียว", feedback: "ตัวอย่างเดียวไม่พอสรุปถึงสิ่งมีชีวิตทุกชนิด ต้องพบในหลายชนิด" }
      - { id: c, text: "พบเซลล์ในทุกตัวอย่าง รวมทั้งถุงพลาสติก", feedback: "ถ้าพบในสิ่งไม่มีชีวิตด้วย เซลล์จะไม่ใช่ลักษณะเฉพาะของสิ่งมีชีวิต ผลนี้ไม่สนับสนุนข้อสรุป" }
      - { id: d, text: "เซลล์ในทุกตัวอย่างมีรูปร่างเหมือนกัน", feedback: "เซลล์ของพืช สัตว์ และสิ่งมีชีวิตเซลล์เดียวมีรูปร่างต่างกัน และรูปร่างที่เหมือนกันไม่ใช่สิ่งที่ข้อสรุปต้องการ" }
    hints:
