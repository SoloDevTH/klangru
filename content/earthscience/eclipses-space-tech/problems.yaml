problems:
  - id: earthscience.astronomy.eclipses-space-tech.p001
    topics: [earthscience.astronomy.eclipses-space-tech]
    difficulty: 1
    type: mcq
    stem: "สุริยุปราคาเกิดขึ้นเมื่อใด"
    choices:
      - { id: a, text: "ดวงจันทร์อยู่ระหว่างดวงอาทิตย์กับโลก ในแนวเดียวกัน", correct: true }
      - { id: b, text: "โลกอยู่ระหว่างดวงอาทิตย์กับดวงจันทร์ ในแนวเดียวกัน", feedback: "แบบนี้เงาโลกตกบนดวงจันทร์ เป็นจันทรุปราคา" }
      - { id: c, text: "ดวงอาทิตย์อยู่ระหว่างโลกกับดวงจันทร์", feedback: "ดวงจันทร์โคจรรอบโลก จึงไม่มีทางอยู่คนละฝั่งของดวงอาทิตย์" }
      - { id: d, text: "เมฆหนาบังดวงอาทิตย์ทั้งวัน", feedback: "เมฆบังแสงได้แต่ไม่ใช่อุปราคา อุปราคาเกิดจากเงาของดวงจันทร์หรือโลก" }
    hints:
      - "สุริยะ แปลว่า ดวงอาทิตย์ สุริยุปราคาคือดวงอาทิตย์ถูกบัง"
      - "อะไรบังดวงอาทิตย์ได้เมื่อมองจากโลก"
    solution: "ดวงจันทร์เข้ามาอยู่ระหว่างดวงอาทิตย์กับโลกในแนวเดียวกัน เงาของดวงจันทร์ตกบนโลก คนที่อยู่ในเงาจึงเห็นดวงอาทิตย์ถูกบัง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.eclipses-space-tech.p002
    topics: [earthscience.astronomy.eclipses-space-tech]
    difficulty: 1
    type: match
    stem: "จับคู่ปรากฏการณ์กับข้อความที่ถูกต้อง"
    pairs:
      - { left: "สุริยุปราคา", right: "เกิดในวันเดือนดับ" }
      - { left: "จันทรุปราคา", right: "เกิดในวันเพ็ญ" }
      - { left: "จันทรุปราคาเต็มดวง", right: "ดวงจันทร์เป็นสีแดงอิฐ" }
      - { left: "สุริยุปราคาวงแหวน", right: "เห็นขอบดวงอาทิตย์สว่างเป็นวง" }
    hints:
      - "สุริยุปราคา ดวงจันทร์อยู่ฝั่งเดียวกับดวงอาทิตย์ จันทรุปราคา ดวงจันทร์อยู่ฝั่งตรงข้าม"
      - "ดวงจันทร์ฝั่งเดียวกับดวงอาทิตย์คือวันเดือนดับ ฝั่งตรงข้ามคือวันเพ็ญ"
    solution: "สุริยุปราคาเกิดวันเดือนดับ จันทรุปราคาเกิดวันเพ็ญ จันทรุปราคาเต็มดวงเห็นดวงจันทร์สีแดงอิฐ และสุริยุปราคาวงแหวนเห็นขอบดวงอาทิตย์เป็นวงแหวน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.eclipses-space-tech.p003
    topics: [earthscience.astronomy.eclipses-space-tech]
    difficulty: 1
    type: mcq
    stem: "นักเรียนอยากดูสุริยุปราคาบางส่วน วิธีใดปลอดภัย"
    choices:
      - { id: a, text: "ดูภาพดวงอาทิตย์ที่ฉายผ่านรูเล็ก ๆ บนกระดาษแข็งลงบนกระดาษขาว", correct: true }
      - { id: b, text: "ใส่แว่นกันแดดสีเข้มสองอันซ้อนกัน", feedback: "แว่นกันแดดกรองแสงไม่พอ แม้ซ้อนกันก็ยังทำลายจอตาได้" }
      - { id: c, text: "มองตรงไปที่ดวงอาทิตย์เร็ว ๆ แล้วหลับตา", feedback: "แสงที่แรงมากทำลายจอตาได้ภายในเวลาสั้น ๆ และไม่รู้สึกเจ็บ" }
      - { id: d, text: "ส่องด้วยกล้องสองตาโดยไม่มีแผ่นกรองแสง", feedback: "กล้องรวมแสงให้แรงขึ้นอีกหลายเท่า อันตรายที่สุด" }
    hints:
      - "ห้ามให้แสงจากดวงอาทิตย์เข้าตาโดยตรง"
      - "วิธีที่ปลอดภัยคือดูภาพของดวงอาทิตย์ ไม่ใช่ดวงอาทิตย์จริง"
    solution: "การฉายภาพผ่านรูเล็ก ๆ ทำให้เห็นรูปดวงอาทิตย์ที่แหว่งบนกระดาษ โดยไม่มีแสงเข้าตาโดยตรง ส่วนแว่นกันแดดและกล้องที่ไม่มีแผ่นกรองทำให้จอตาเสียหายถาวรได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.eclipses-space-tech.p004
    topics: [earthscience.astronomy.eclipses-space-tech]
    difficulty: 2
    type: mcq
    stem: "ภาพแสดงตำแหน่งของดวงอาทิตย์ โลก และดวงจันทร์ที่เรียงเป็นแนวเดียวกัน ตำแหน่งนี้ทำให้เกิดปรากฏการณ์ใดได้"
    figure: { src: p-arrangement.svg, alt: "ดวงอาทิตย์อยู่ซ้ายสุด มีลูกศรแสงชี้ไปทางขวา โลกอยู่ตรงกลาง ดวงจันทร์ดวงเล็กอยู่ทางขวาของโลก ทั้งสามเรียงเป็นเส้นตรงเดียวกัน" }
    choices:
      - { id: a, text: "จันทรุปราคา", correct: true }
      - { id: b, text: "สุริยุปราคา", feedback: "สุริยุปราคาต้องให้ดวงจันทร์อยู่ตรงกลาง แต่ในภาพโลกอยู่ตรงกลาง" }
      - { id: c, text: "ข้างแรม 8 ค่ำ", feedback: "แรม 8 ค่ำ ดวงจันทร์ทำมุมฉากกับแนวดวงอาทิตย์ ไม่ได้อยู่หลังโลก" }
      - { id: d, text: "วันเดือนดับ", feedback: "วันเดือนดับ ดวงจันทร์อยู่ระหว่างโลกกับดวงอาทิตย์ แต่ในภาพดวงจันทร์อยู่หลังโลก" }
    hints:
      - "ดูว่าอะไรอยู่ตรงกลาง"
      - "วัตถุตรงกลางทอดเงาไปหาวัตถุที่อยู่ด้านหลัง"
    solution: "โลกอยู่ตรงกลาง เงาของโลกทอดไปตกบนดวงจันทร์ จึงเกิดจันทรุปราคา ตำแหน่งนี้ตรงกับวันเพ็ญ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.eclipses-space-tech.p005
    topics: [earthscience.astronomy.eclipses-space-tech]
    difficulty: 2
    type: mcq
    stem: "ขณะเกิดจันทรุปราคาเต็มดวง ทำไมเรายังเห็นดวงจันทร์เป็นสีแดงอิฐ ไม่หายไปทั้งดวง"
    choices:
      - { id: a, text: "แสงอาทิตย์ที่ผ่านบรรยากาศของโลกหักเหเข้าไปในเงา และแสงสีแดงผ่านมาได้มากที่สุด", correct: true }
      - { id: b, text: "ดวงจันทร์มีแสงสีแดงในตัวเอง", feedback: "ดวงจันทร์ไม่มีแสงในตัวเอง เห็นได้เพราะสะท้อนแสงอาทิตย์" }
      - { id: c, text: "ดวงจันทร์ร้อนขึ้นจนเป็นสีแดงเมื่ออยู่ในเงา", feedback: "ในเงาดวงจันทร์ได้รับแสงน้อยลง จึงเย็นลง ไม่ได้ร้อนขึ้น" }
      - { id: d, text: "ดาวอังคารที่เป็นสีแดงมาบังดวงจันทร์", feedback: "ดาวอังคารอยู่ไกลกว่าดวงจันทร์มาก บังดวงจันทร์ไม่ได้" }
    hints:
      - "โลกมีบรรยากาศห่อหุ้ม"
      - "นึกถึงสีของท้องฟ้าตอนพระอาทิตย์ตก"
    solution: "บรรยากาศของโลกหักเหแสงอาทิตย์บางส่วนเข้าไปในเงามืด แสงสีน้ำเงินกระเจิงออกไประหว่างทาง เหลือแสงสีแดงมากที่สุด เหมือนท้องฟ้าตอนพระอาทิตย์ตก ดวงจันทร์จึงเป็นสีแดงอิฐ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.eclipses-space-tech.p006
    topics: [earthscience.astronomy.eclipses-space-tech]
    difficulty: 2
    type: mcq
    stem: "ทุกเดือนมีวันเพ็ญ แต่ทำไมจันทรุปราคาไม่ได้เกิดทุกเดือน"
    choices:
      - { id: a, text: "วงโคจรของดวงจันทร์เอียงจากระนาบวงโคจรของโลกประมาณ 5 องศา ดวงจันทร์จึงมักผ่านเหนือหรือใต้เงาโลก", correct: true }
      - { id: b, text: "บางเดือนโลกไม่มีเงา", feedback: "โลกมีเงาทอดไปด้านตรงข้ามดวงอาทิตย์ตลอดเวลา" }
      - { id: c, text: "บางเดือนดวงจันทร์ไม่ได้โคจรรอบโลก", feedback: "ดวงจันทร์โคจรรอบโลกทุกเดือนเสมอ" }
      - { id: d, text: "เมฆบังทำให้มองไม่เห็นทุกเดือน", feedback: "เมฆทำให้บางที่มองไม่เห็น แต่จันทรุปราคาไม่ได้เกิดทุกเดือนจริง ๆ แม้ท้องฟ้าโปร่ง" }
    hints:
      - "อุปราคาเกิดเมื่อสามดวงเรียงเป็นเส้นตรงพอดี"
      - "วงโคจรของดวงจันทร์กับวงโคจรของโลกอยู่ระนาบเดียวกันพอดีหรือไม่"
    solution: "วงโคจรของดวงจันทร์เอียงประมาณ 5 องศา ในวันเพ็ญส่วนใหญ่ดวงจันทร์จึงอยู่สูงหรือต่ำกว่าเงาของโลก จันทรุปราคาเกิดเฉพาะเมื่อวันเพ็ญตรงกับช่วงที่ทั้งสามดวงเรียงเป็นแนวเดียวกันพอดี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.eclipses-space-tech.p007
    topics: [earthscience.astronomy.eclipses-space-tech]
    difficulty: 2
    type: order
    stem: "เรียงเหตุการณ์ในพัฒนาการของเทคโนโลยีอวกาศ จากเก่าไปใหม่"
    items:
      - "กาลิเลโอใช้กล้องโทรทรรศน์ส่องดวงจันทร์"
      - "สปุตนิก 1 ดาวเทียมดวงแรกของโลก ขึ้นสู่วงโคจร"
      - "ยูริ กาการิน มนุษย์คนแรกที่โคจรรอบโลก"
      - "ยานอะพอลโล 11 พามนุษย์เหยียบดวงจันทร์"
      - "ดาวเทียมไทยโชตของไทยขึ้นสู่อวกาศ"
    hints:
      - "ต้องมีจรวดส่งดาวเทียมได้ก่อน จึงจะส่งคนขึ้นไปได้"
      - "กาลิเลโอมีชีวิตอยู่ราว 400 ปีก่อน ส่วนไทยโชตขึ้นสู่อวกาศ พ.ศ. 2551"
    solution: "กาลิเลโอ (ค.ศ. 1609) → สปุตนิก 1 (พ.ศ. 2500) → ยูริ กาการิน (พ.ศ. 2504) → อะพอลโล 11 (พ.ศ. 2512) → ไทยโชต (พ.ศ. 2551)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.eclipses-space-tech.p008
    topics: [earthscience.astronomy.eclipses-space-tech]
    difficulty: 2
    type: match
    stem: "จับคู่ดาวเทียมกับการใช้ประโยชน์ในชีวิตประจำวันของคนไทย"
    pairs:
      - { left: "ดาวเทียมอุตุนิยมวิทยา", right: "ดูภาพเมฆและติดตามพายุที่กำลังเข้าประเทศไทย" }
      - { left: "ดาวเทียมนำทาง (GPS)", right: "ให้แอปแผนที่ในโทรศัพท์บอกตำแหน่งและเส้นทาง" }
      - { left: "ดาวเทียมสื่อสาร", right: "ส่งสัญญาณโทรทัศน์ไปยังบ้านบนดอยที่ห่างไกล" }
      - { left: "ดาวเทียมสำรวจทรัพยากร เช่น ไทยโชต", right: "ถ่ายภาพพื้นที่น้ำท่วมและจุดความร้อนจากไฟป่า" }
    hints:
      - "ดูจากชื่อของดาวเทียมแต่ละประเภท"
      - "ดาวเทียมสำรวจทรัพยากรถ่ายภาพพื้นผิวโลกอย่างละเอียด"
    solution: "ดาวเทียมอุตุนิยมวิทยาถ่ายภาพเมฆ ดาวเทียมนำทางบอกตำแหน่ง ดาวเทียมสื่อสารส่งสัญญาณโทรทัศน์และอินเทอร์เน็ต ส่วนดาวเทียมสำรวจทรัพยากรถ่ายภาพพื้นที่น้ำท่วม ป่าไม้ และไฟป่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.eclipses-space-tech.p009
    topics: [earthscience.astronomy.eclipses-space-tech]
    difficulty: 2
    type: text
    stem: "ดาวเทียมสำรวจทรัพยากรดวงแรกของประเทศไทย ขึ้นสู่อวกาศเมื่อ พ.ศ. 2551 มีชื่อภาษาไทยว่าอะไร"
    accepted: ["ไทยโชต", "ดาวเทียมไทยโชต", "THEOS", "theos", "ธีออส"]
    misconceptions:
      - { match: "ไทยคม", feedback: "ไทยคมเป็นดาวเทียมสื่อสาร ใช้ส่งสัญญาณโทรทัศน์และโทรศัพท์ ไม่ใช่ดาวเทียมสำรวจทรัพยากร" }
    hints:
      - "ชื่อภาษาอังกฤษคือ THEOS"
      - "ชื่อภาษาไทยขึ้นต้นด้วยคำว่า ไทย"
    solution: "ดาวเทียมไทยโชต (THEOS) ขึ้นสู่อวกาศเมื่อ พ.ศ. 2551 ดูแลโดย GISTDA ต่อมามี THEOS-2 ขึ้นสู่อวกาศเมื่อ พ.ศ. 2566"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.eclipses-space-tech.p010
    topics: [earthscience.astronomy.eclipses-space-tech]
    difficulty: 3
    type: numeric
    stem: "ดวงอาทิตย์อยู่ไกลจากโลกมากกว่าดวงจันทร์ประมาณ 390 เท่า ถ้าดวงจันทร์อยู่ห่างโลก 384,400 กิโลเมตร ดวงอาทิตย์อยู่ห่างโลกประมาณกี่ล้านกิโลเมตร"
    answer: { value: 150, tolerance: 1.5, unit: ล้านกิโลเมตร }
    misconceptions:
      - { match: 0.986, feedback: "นำ 384,400 หารด้วย 390 แต่ดวงอาทิตย์อยู่ไกลกว่า ต้องคูณ" }
      - { match: 149916000, feedback: "คำตอบนี้มีหน่วยเป็นกิโลเมตร โจทย์ถามเป็นล้านกิโลเมตร ให้หารด้วย 1,000,000" }
    hints:
      - "ไกลกว่า 390 เท่า หมายถึงคูณด้วย 390"
      - "แปลงผลลัพธ์เป็นล้านกิโลเมตรโดยหารด้วย 1,000,000"
    solution: "$384{,}400 \\times 390 = 149{,}916{,}000$ กิโลเมตร ประมาณ 150 ล้านกิโลเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.eclipses-space-tech.p011
    topics: [earthscience.astronomy.eclipses-space-tech]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดเปรียบเทียบสุริยุปราคากับจันทรุปราคาได้ถูกต้อง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "จันทรุปราคาเห็นได้จากทุกที่บนโลกที่เป็นกลางคืนในขณะนั้น", correct: true }
      - { id: b, text: "สุริยุปราคาเต็มดวงเห็นได้เฉพาะแนวแคบ ๆ ที่เงามืดของดวงจันทร์พาดผ่าน", correct: true }
      - { id: c, text: "จันทรุปราคาดูด้วยตาเปล่าได้ แต่สุริยุปราคาต้องใช้แผ่นกรองแสง", correct: true }
      - { id: d, text: "ทั้งสองอย่างเกิดในวันเพ็ญ", feedback: "สุริยุปราคาเกิดในวันเดือนดับ ซึ่งดวงจันทร์อยู่ฝั่งเดียวกับดวงอาทิตย์" }
      - { id: e, text: "สุริยุปราคาเกิดจากเงาของโลก", feedback: "สุริยุปราคาเกิดจากเงาของดวงจันทร์ตกบนโลก เงาของโลกทำให้เกิดจันทรุปราคา" }
    hints:
      - "เงาของโลกใหญ่กว่าเงาของดวงจันทร์มาก"
      - "ใครเห็นดวงจันทร์ได้บ้างในเวลาหนึ่ง"
    solution: "จันทรุปราคา ดวงจันทร์อยู่ในเงาโลก ใครเห็นดวงจันทร์ก็เห็นอุปราคา ส่วนเงามืดของดวงจันทร์บนโลกแคบมาก สุริยุปราคาเต็มดวงจึงเห็นเป็นแนวแคบ และต้องใช้แผ่นกรองแสงเสมอ สุริยุปราคาเกิดวันเดือนดับจากเงาของดวงจันทร์"
