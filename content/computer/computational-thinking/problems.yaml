      - { id: b, text: "แบบจำลองถูกแล้ว ข้อมูลจริงผิด", feedback: "เมื่อแบบจำลองไม่ตรงกับข้อมูลจริง ต้องสงสัยแบบจำลองก่อน โดยเฉพาะเมื่อผิดซ้ำในช่วงเวลาเดียวกัน" }
      - { id: c, text: "ควรเพิ่มสีของรถและยี่ห้อยางเข้าไปในแบบจำลอง", feedback: "รายละเอียดเหล่านี้แทบไม่มีผลต่อเวลา การเพิ่มสิ่งไม่จำเป็นทำให้แบบจำลองซับซ้อนโดยไม่แม่นขึ้น" }
      - { id: d, text: "แบบจำลองใช้ไม่ได้ทุกกรณี ควรเลิกใช้", feedback: "แบบจำลองอาจใช้ได้ดีในช่วงรถไม่ติด การปรับให้ดีขึ้นดีกว่าทิ้งทั้งหมด" }
    hints:
      - "นามธรรมที่ดีตัดแต่สิ่งที่ไม่มีผลต่อคำตอบ"
      - "อะไรทำให้เวลา 7 โมงเช้าต่างจากช่วงอื่น"
    solution: "แบบจำลองตัดสภาพจราจรทิ้ง ซึ่งมีผลมากในช่วงเช้า จึงเป็นนามธรรมที่ง่ายเกินไป วิธีแก้คือเพิ่มเฉพาะรายละเอียดที่มีผล (ความเร็วตามช่วงเวลา) แล้วทดสอบกับข้อมูลจริงซ้ำ"
