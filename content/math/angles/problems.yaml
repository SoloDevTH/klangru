problems:
  - id: math.ang.p001
    topics: [math.geometry.angles]
    difficulty: 1
    type: mcq
    stem: "มุมขนาด $135^\\circ$ เป็นมุมชนิดใด"
    choices:
      - { id: a, text: "มุมป้าน", correct: true }
      - { id: b, text: "มุมแหลม", feedback: "มุมแหลมมีขนาดน้อยกว่า $90^\\circ$ แต่ $135^\\circ$ มากกว่า $90^\\circ$" }
      - { id: c, text: "มุมกลับ", feedback: "มุมกลับต้องมากกว่า $180^\\circ$ แต่ $135^\\circ$ ยังน้อยกว่ามุมตรง" }
      - { id: d, text: "มุมตรง", feedback: "มุมตรงมีขนาด $180^\\circ$ พอดี" }
    hints:
      - "เทียบ $135^\\circ$ กับมุมฉาก $90^\\circ$ และมุมตรง $180^\\circ$"
      - "มุมที่อยู่ระหว่าง $90^\\circ$ กับ $180^\\circ$ มีชื่อเรียกเฉพาะ"
    solution: "$90^\\circ < 135^\\circ < 180^\\circ$ จึงเป็นมุมป้าน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ang.p002
    topics: [math.geometry.angles]
    difficulty: 1
    type: numeric
    stem: "มุมประกอบฉากของมุม $35^\\circ$ มีขนาดกี่องศา"
    answer: { value: 55, unit: องศา }
    hints:
      - "มุมประกอบฉากคือมุมสองมุมที่รวมกันได้ $90^\\circ$"
      - "ลบ $35^\\circ$ ออกจาก $90^\\circ$"
    misconceptions:
      - { match: 145, feedback: "นั่นคือมุมประกอบสองมุมฉาก (รวมกันได้ $180^\\circ$) มุมประกอบฉากรวมกันได้ $90^\\circ$" }
    solution: "$90^\\circ - 35^\\circ = 55^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ang.p003
    topics: [math.geometry.angles]
    difficulty: 1
    type: numeric
    stem: "มุมประกอบสองมุมฉากของมุม $72^\\circ$ มีขนาดกี่องศา"
    answer: { value: 108, unit: องศา }
    hints:
      - "มุมประกอบสองมุมฉากคือมุมสองมุมที่รวมกันได้ $180^\\circ$"
      - "ลบ $72^\\circ$ ออกจาก $180^\\circ$"
    misconceptions:
      - { match: 18, feedback: "นั่นคือมุมประกอบฉาก (รวมกันได้ $90^\\circ$) มุมประกอบสองมุมฉากรวมกันได้ $180^\\circ$" }
      - { match: 288, feedback: "นั่นคือ $360^\\circ - 72^\\circ$ ซึ่งเป็นมุมที่ครบรอบ มุมประกอบสองมุมฉากรวมกันได้ $180^\\circ$" }
    solution: "$180^\\circ - 72^\\circ = 108^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ang.p004
    topics: [math.geometry.angles]
    difficulty: 2
    type: match
    stem: "จับคู่ชนิดของมุมกับขนาดของมุม"
    pairs:
      - { left: "มุมแหลม", right: "มากกว่า $0^\\circ$ แต่น้อยกว่า $90^\\circ$" }
      - { left: "มุมฉาก", right: "เท่ากับ $90^\\circ$" }
      - { left: "มุมป้าน", right: "มากกว่า $90^\\circ$ แต่น้อยกว่า $180^\\circ$" }
      - { left: "มุมตรง", right: "เท่ากับ $180^\\circ$" }
      - { left: "มุมกลับ", right: "มากกว่า $180^\\circ$ แต่น้อยกว่า $360^\\circ$" }
    hints:
      - "เริ่มจากมุมที่มีขนาดพอดี คือมุมฉากและมุมตรง"
      - "มุมแหลมเล็กกว่ามุมฉาก มุมป้านอยู่ระหว่างมุมฉากกับมุมตรง"
      - "มุมที่ใหญ่กว่าครึ่งรอบแต่ยังไม่ครบรอบมีชื่อเรียกเฉพาะ"
    solution: "แหลม < $90^\\circ$ | ฉาก $= 90^\\circ$ | $90^\\circ$ < ป้าน < $180^\\circ$ | ตรง $= 180^\\circ$ | $180^\\circ$ < กลับ < $360^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ang.p005
    topics: [math.geometry.angles]
    difficulty: 2
    type: numeric
    stem: "เส้นตรงสองเส้นตัดกัน มุมหนึ่งที่เกิดขึ้นมีขนาด $65^\\circ$ มุมที่อยู่ติดกับมุมนี้บนเส้นตรงเดียวกันมีขนาดกี่องศา"
    answer: { value: 115, unit: องศา }
    hints:
      - "มุมที่อยู่ติดกันบนเส้นตรงเส้นเดียวรวมกันได้ $180^\\circ$"
      - "ลบ $65^\\circ$ ออกจาก $180^\\circ$"
    misconceptions:
      - { match: 65, feedback: "$65^\\circ$ คือมุมตรงข้าม (อยู่ตรงข้ามกัน) โจทย์ถามมุมที่อยู่ติดกัน ซึ่งรวมกับ $65^\\circ$ ได้ $180^\\circ$" }
      - { match: 25, feedback: "นั่นคือ $90^\\circ - 65^\\circ$ แต่มุมที่อยู่ติดกันบนเส้นตรงรวมกันได้ $180^\\circ$ ไม่ใช่ $90^\\circ$" }
    solution: "มุมที่อยู่ติดกันบนเส้นตรงรวมกันได้ $180^\\circ$: $180^\\circ - 65^\\circ = 115^\\circ$ (มุม 4 มุมคือ $65^\\circ, 115^\\circ, 65^\\circ, 115^\\circ$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ang.p006
    topics: [math.geometry.angles]
    difficulty: 3
    type: numeric
    stem: "เส้นตรงสองเส้นตัดกัน เกิดมุมตรงข้ามคู่หนึ่งขนาด $(5x - 12)^\\circ$ และ $(3x + 20)^\\circ$ จงหาค่า $x$"
    answer: { value: 16 }
    hints:
      - "มุมตรงข้ามมีขนาดเท่ากัน"
      - "ตั้งสมการ $5x - 12 = 3x + 20$ แล้วแก้หา $x$"
    misconceptions:
      - { match: 21.5, feedback: "ดูเหมือนให้มุมทั้งสองรวมกันได้ $180^\\circ$ แต่มุมตรงข้ามมีขนาดเท่ากัน ไม่ได้รวมกันเป็นมุมตรง" }
    solution: "$5x - 12 = 3x + 20$ → $2x = 32$ → $x = 16$ ตรวจ: $5(16) - 12 = 68$ และ $3(16) + 20 = 68$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ang.p007
    topics: [math.geometry.angles]
    difficulty: 3
    type: mcq
    stem: "เส้นตรง $\\ell$ และ $m$ ขนานกัน และมีเส้นตัดผ่านทั้งสองเส้น ถ้ามุมภายในมุมหนึ่งมีขนาด $58^\\circ$ มุมภายในอีกมุมที่อยู่ข้างเดียวกันของเส้นตัดมีขนาดเท่าใด"
    choices:
      - { id: a, text: "$122^\\circ$", correct: true }
      - { id: b, text: "$58^\\circ$", feedback: "มุมที่เท่ากับ $58^\\circ$ คือมุมแย้ง (อยู่คนละข้างของเส้นตัด) มุมภายในที่อยู่ข้างเดียวกันรวมกันได้ $180^\\circ$" }
      - { id: c, text: "$32^\\circ$", feedback: "นั่นคือ $90^\\circ - 58^\\circ$ แต่มุมภายในที่อยู่ข้างเดียวกันของเส้นตัดรวมกันได้ $180^\\circ$" }
      - { id: d, text: "$302^\\circ$", feedback: "นั่นคือ $360^\\circ - 58^\\circ$ มุมระหว่างเส้นขนานกับเส้นตัดไม่มีทางเกิน $180^\\circ$" }
    hints:
      - "นึกถึงสมบัติของมุมภายในที่อยู่ข้างเดียวกันของเส้นตัดเมื่อเส้นทั้งสองขนานกัน"
      - "มุมภายในที่อยู่ข้างเดียวกันของเส้นตัดรวมกันได้มุมตรง"
    solution: "เมื่อ $\\ell \\parallel m$ มุมภายในที่อยู่ข้างเดียวกันของเส้นตัดรวมกันได้ $180^\\circ$: $180^\\circ - 58^\\circ = 122^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ang.p008
    topics: [math.geometry.angles]
    difficulty: 3
    type: numeric
    stem: "ถนนสองสายตัดกันที่สี่แยก มุมหนึ่งที่สี่แยกมีขนาดเป็น 3 เท่าของมุมที่อยู่ติดกัน มุมที่ใหญ่กว่ามีขนาดกี่องศา"
    answer: { value: 135, unit: องศา }
    hints:
      - "มุมสองมุมที่อยู่ติดกันบนเส้นตรงรวมกันได้ $180^\\circ$"
      - "ให้มุมเล็กเป็น $x$ มุมใหญ่เป็น $3x$ แล้วตั้งสมการ"
      - "แก้หา $x$ แล้วอย่าลืมว่าโจทย์ถามมุมที่ใหญ่กว่า"
    misconceptions:
      - { match: 45, feedback: "$45^\\circ$ คือมุมที่เล็กกว่า โจทย์ถามมุมที่ใหญ่กว่า ซึ่งเป็น 3 เท่าของมุมนี้" }
      - { match: 67.5, feedback: "ดูเหมือนให้สองมุมรวมกันได้ $90^\\circ$ แต่มุมที่อยู่ติดกันบนเส้นตรงรวมกันได้ $180^\\circ$" }
    solution: "$x + 3x = 180^\\circ$ → $4x = 180^\\circ$ → $x = 45^\\circ$ มุมที่ใหญ่กว่าคือ $3(45^\\circ) = 135^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ang.p009
    topics: [math.geometry.angles]
    difficulty: 3
    type: order
    stem: "เรียงมุมต่อไปนี้จากขนาดเล็กไปใหญ่"
    items:
      - "มุมประกอบฉากของ $20^\\circ$"
      - "มุมประกอบสองมุมฉากของ $100^\\circ$"
      - "มุมภายในแต่ละมุมของรูปห้าเหลี่ยมด้านเท่ามุมเท่า"
      - "มุมตรง"
      - "มุมกลับขนาด $200^\\circ$"
    hints:
      - "คำนวณขนาดของแต่ละมุมเป็นตัวเลขก่อน"
      - "ห้าเหลี่ยมมีผลบวกมุมภายใน $(5 - 2) \\times 180^\\circ$ แบ่งเป็น 5 มุมเท่ากัน"
    solution: "มุมประกอบฉากของ $20^\\circ$ คือ $70^\\circ$ | มุมประกอบสองมุมฉากของ $100^\\circ$ คือ $80^\\circ$ | มุมภายในห้าเหลี่ยมด้านเท่า $540^\\circ \\div 5 = 108^\\circ$ | มุมตรง $180^\\circ$ | มุมกลับ $200^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ang.p010
    topics: [math.geometry.angles]
    difficulty: 4
    type: numeric
    stem: "นาฬิกาบนผนังห้องเรียนบอกเวลา 14:30 น. (บ่ายสองโมงครึ่ง) มุมที่เล็กกว่าระหว่างเข็มชั่วโมงกับเข็มนาทีมีขนาดกี่องศา"
    answer: { value: 105, unit: องศา }
    hints:
      - "หน้าปัดหมุนครบรอบ $360^\\circ$ มี 12 ช่องชั่วโมง ช่องละ $30^\\circ$"
      - "เวลาครึ่งชั่วโมง เข็มชั่วโมงไม่ได้ชี้ที่เลข 2 พอดี แต่เดินไปครึ่งทางระหว่างเลข 2 กับ 3"
      - "หาตำแหน่งของเข็มทั้งสอง (วัดจากเลข 12) แล้วนำมาลบกัน"
    misconceptions:
      - { match: 120, feedback: "ดูเหมือนให้เข็มชั่วโมงชี้ที่เลข 2 พอดี แต่ที่ 14:30 เข็มชั่วโมงเดินไปครึ่งทางระหว่างเลข 2 กับ 3 แล้ว" }
    solution: "เข็มนาทีชี้เลข 6 อยู่ที่ $180^\\circ$ เข็มชั่วโมงอยู่ที่ $2 \\times 30^\\circ + 15^\\circ = 75^\\circ$ มุมระหว่างเข็ม $= 180^\\circ - 75^\\circ = 105^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ang.p011
    topics: [math.geometry.angles]
    difficulty: 4
    type: numeric
    stem: "ป้ายจราจร \"หยุด\" เป็นรูปแปดเหลี่ยมด้านเท่ามุมเท่า มุมภายในแต่ละมุมของป้ายมีขนาดกี่องศา"
    answer: { value: 135, unit: องศา }
    hints:
      - "ผลบวกมุมภายในของรูป $n$ เหลี่ยมคือ $(n - 2) \\times 180^\\circ$"
      - "หาผลบวกมุมภายในของรูปแปดเหลี่ยม แล้วแบ่งให้ 8 มุมเท่ากัน"
    misconceptions:
      - { match: 45, feedback: "นั่นคือ $360^\\circ \\div 8$ ซึ่งเป็นมุมภายนอก มุมภายในกับมุมภายนอกที่จุดยอดเดียวกันรวมกันได้ $180^\\circ$" }
      - { match: 180, feedback: "ดูเหมือนใช้ $8 \\times 180^\\circ$ เป็นผลบวกมุมภายใน สูตรที่ถูกคือ $(8 - 2) \\times 180^\\circ$" }
    solution: "ผลบวกมุมภายใน $= (8 - 2) \\times 180^\\circ = 1080^\\circ$ แต่ละมุม $= 1080^\\circ \\div 8 = 135^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ang.p012
    topics: [math.geometry.angles]
    difficulty: 5
    type: numeric
    stem: "รูปหลายเหลี่ยมด้านเท่ามุมเท่ารูปหนึ่งมีมุมภายในแต่ละมุมขนาด $140^\\circ$ รูปนี้มีกี่ด้าน"
    answer: { value: 9, unit: ด้าน }
    hints:
      - "มุมภายนอกที่แต่ละจุดยอดคือ $180^\\circ$ ลบด้วยมุมภายใน"
      - "มุมภายนอกของรูปหลายเหลี่ยมใด ๆ รวมกันได้ $360^\\circ$"
      - "หาร $360^\\circ$ ด้วยมุมภายนอกหนึ่งมุมเพื่อหาจำนวนด้าน (หรือแก้สมการ $\\tfrac{(n - 2) \\times 180}{n} = 140$)"
    misconceptions:
      - { match: 2.571, feedback: "ดูเหมือนนำ $360^\\circ$ หารด้วยมุมภายใน $140^\\circ$ แต่มุมภายนอกต่างหากที่รวมกันได้ $360^\\circ$ ต้องหารด้วย $180^\\circ - 140^\\circ$" }
    solution: "มุมภายนอก $= 180^\\circ - 140^\\circ = 40^\\circ$ จำนวนด้าน $= 360^\\circ \\div 40^\\circ = 9$ ตรวจ: $\\tfrac{(9 - 2) \\times 180^\\circ}{9} = 140^\\circ$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ang.p013
    topics: [math.geometry.angles]
    difficulty: 5
    type: numeric
    stem: "เส้นตรง $AB$ ขนานกับเส้นตรง $CD$ โดย $AB$ อยู่ด้านบน และ $A$ กับ $C$ อยู่ทางซ้ายของ $B$ กับ $D$ ตามลำดับ จุด $E$ อยู่ระหว่างเส้นขนานทั้งสองและอยู่ทางซ้ายของ $B$ และ $D$ ลากส่วนของเส้นตรง $BE$ และ $DE$ ถ้า $\\angle ABE = 40^\\circ$ และ $\\angle CDE = 35^\\circ$ จงหาขนาดของ $\\angle BED$"
    answer: { value: 75, unit: องศา }
    hints:
      - "ลากเส้นผ่านจุด $E$ ให้ขนานกับ $AB$ (จึงขนานกับ $CD$ ด้วย)"
      - "เส้นใหม่แบ่ง $\\angle BED$ เป็นสองส่วน แต่ละส่วนเป็นมุมแย้งกับมุมที่โจทย์ให้"
      - "บวกสองส่วนเข้าด้วยกัน"
    misconceptions:
      - { match: 105, feedback: "ดูเหมือนใช้ $180^\\circ - (40^\\circ + 35^\\circ)$ แต่เมื่อลากเส้นขนานผ่าน $E$ แต่ละส่วนของ $\\angle BED$ เป็นมุมแย้งที่ **เท่ากับ** มุมที่โจทย์ให้ จึงต้องบวกกัน" }
    solution: "ลากเส้น $EF$ ผ่าน $E$ ขนานกับ $AB$ และ $CD$ โดยให้ $F$ อยู่ทางขวาของ $E$ (ด้านเดียวกับ $B$ และ $D$) จะได้ $\\angle BEF = \\angle ABE = 40^\\circ$ และ $\\angle FED = \\angle CDE = 35^\\circ$ (มุมแย้ง) ดังนั้น $\\angle BED = 40^\\circ + 35^\\circ = 75^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true
