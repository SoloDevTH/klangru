<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="sans-serif" font-size="15">
  <title>แผนภูมิแท่งจำนวนการเชื่อมต่อแบบคู่ของเครือข่าย 4 8 12 และ 16 คน</title>
  <rect x="0" y="0" width="640" height="360" fill="#ffffff"/>
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#15211e">จำนวนการเชื่อมต่อแบบคู่เมื่อจำนวนผู้ใช้เพิ่มขึ้น</text>
  <line x1="90" y1="300" x2="600" y2="300" stroke="#15211e" stroke-width="2"/>
  <rect x="130" y="288.5" width="80" height="11.5" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="170" y="278.5" text-anchor="middle" font-size="16" font-weight="bold" fill="#15211e">6</text>
  <text x="170" y="324" text-anchor="middle" font-size="14" font-weight="normal" fill="#15211e">4 คน</text>
  <rect x="250" y="246.3" width="80" height="53.7" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="290" y="236.33333333333331" text-anchor="middle" font-size="16" font-weight="bold" fill="#15211e">28</text>
  <text x="290" y="324" text-anchor="middle" font-size="14" font-weight="normal" fill="#15211e">8 คน</text>
  <rect x="370" y="173.5" width="80" height="126.5" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="410" y="163.5" text-anchor="middle" font-size="16" font-weight="bold" fill="#15211e">66</text>
  <text x="410" y="324" text-anchor="middle" font-size="14" font-weight="normal" fill="#15211e">12 คน</text>
  <rect x="490" y="70.0" width="80" height="230.0" fill="#b5562b" stroke="#15211e" stroke-width="2"/>
  <text x="530" y="60.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#b5562b">120</text>
  <text x="530" y="324" text-anchor="middle" font-size="14" font-weight="normal" fill="#15211e">16 คน</text>
  <text x="320" y="350" text-anchor="middle" font-size="13" font-weight="normal" fill="#4a5a55">จำนวนการเชื่อมต่อ = n(n − 1) ÷ 2 (ตัวเลขเหนือแท่งคือจำนวนคู่)</text>
</svg>
