      - { match: 300, feedback: "หารด้วย 2 ซึ่งเป็นจำนวน K⁺ ต่อ ATP แต่โจทย์ให้จำนวน Na⁺ ต้องหารด้วย 3" }
      - { match: 120, feedback: "หารด้วย 5 (รวม Na⁺ กับ K⁺) แต่ 600 เป็นจำนวน Na⁺ อย่างเดียว" }
    solution: "ATP 1 โมเลกุลปั๊ม Na⁺ ออก 3 ไอออน จึงใช้ ATP $\\frac{600}{3} = 200$ โมเลกุล และพร้อมกันนั้นปั๊ม K⁺ เข้า $200 \\times 2 = 400$ ไอออน"
