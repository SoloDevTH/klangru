problems:
  - id: math.sys.p001
    topics: [math.algebra.systems]
    difficulty: 1
    type: mcq
    stem: "คู่อันดับ $(x, y)$ ใดเป็นคำตอบของระบบสมการ $x + y = 5$ และ $x - y = 1$"
    choices:
      - { id: a, text: "$(3, 2)$", correct: true }
      - { id: b, text: "$(2, 3)$", feedback: "เป็นจริงกับ $x + y = 5$ แต่ $2 - 3 = -1$ ไม่ใช่ 1 ระวังลำดับในคู่อันดับ ตัวแรกคือ $x$" }
      - { id: c, text: "$(4, 1)$", feedback: "เป็นจริงกับสมการแรกเท่านั้น $4 - 1 = 3$ ไม่ใช่ 1 คำตอบต้องเป็นจริงทั้งสองสมการ" }
      - { id: d, text: "$(1, 0)$", feedback: "เป็นจริงกับสมการที่สองเท่านั้น $1 + 0 = 1$ ไม่ใช่ 5 คำตอบต้องเป็นจริงทั้งสองสมการ" }
    hints:
      - "คำตอบของระบบต้องทำให้ทั้งสองสมการเป็นจริงพร้อมกัน"
      - "แทนแต่ละคู่ลงในทั้งสองสมการแล้วตรวจ"
    solution: "$(3, 2)$: $3 + 2 = 5$ ✓ และ $3 - 2 = 1$ ✓ ข้ออื่นเป็นจริงได้แค่สมการเดียว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.sys.p002
    topics: [math.algebra.systems]
    difficulty: 1
    type: numeric
    stem: "แก้ระบบสมการ $y = 2x$ และ $x + y = 12$ แล้ว $x$ มีค่าเท่าใด"
    answer: { value: 4 }
    hints:
      - "สมการแรกบอกค่าของ $y$ ในรูปของ $x$ อยู่แล้ว"
      - "แทน $y$ ด้วย $2x$ ในสมการที่สอง จะเหลือตัวแปรเดียว"
    misconceptions:
      - { match: 6, feedback: "ดูเหมือนหาร 12 ด้วย 2 แต่เมื่อแทน $y = 2x$ จะได้ $x + 2x = 3x$ ต้องหารด้วย 3" }
      - { match: 8, feedback: "นั่นคือค่าของ $y$ โจทย์ถามค่า $x$" }
    solution: "แทน $y = 2x$: $x + 2x = 12$ → $3x = 12$ → $x = 4$ (และ $y = 8$) ตรวจ: $4 + 8 = 12$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.sys.p003
    topics: [math.algebra.systems]
    difficulty: 2
    type: numeric
    stem: "แก้ระบบสมการ $x + y = 15$ และ $x - y = 3$ แล้ว $y$ มีค่าเท่าใด"
    answer: { value: 6 }
    hints:
      - "สัมประสิทธิ์ของ $y$ เป็น $+1$ กับ $-1$ ถ้าบวกสองสมการ $y$ จะหายไป"
      - "หา $x$ ก่อน แล้วแทนกลับเพื่อหา $y$"
      - "หรือลบสมการที่สองออกจากสมการแรกเพื่อกำจัด $x$ แล้วหาร 2"
    misconceptions:
      - { match: 9, feedback: "นั่นคือค่าของ $x$ โจทย์ถามค่า $y$ ให้แทน $x = 9$ กลับในสมการใดสมการหนึ่ง" }
      - { match: 12, feedback: "ลบสองสมการได้ $2y = 12$ ถูกแล้ว แต่ยังต้องหาร 2" }
    solution: "บวกสองสมการ: $2x = 18$ → $x = 9$ แทนใน $x + y = 15$: $y = 6$ ตรวจ: $9 - 6 = 3$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.sys.p004
    topics: [math.algebra.systems]
    difficulty: 2
    type: numeric
    stem: "แก้ระบบสมการ $2x + 3y = 11$ และ $4x - 3y = 13$ แล้ว $x$ มีค่าเท่าใด"
    answer: { value: 4 }
    hints:
      - "สังเกตสัมประสิทธิ์ของ $y$ ในสองสมการ"
      - "$+3y$ กับ $-3y$ หักล้างกันเมื่อบวกสองสมการ"
    misconceptions:
      - { match: 24, feedback: "บวกสมการได้ $6x = 24$ ถูกแล้ว แต่ยังต้องหารด้วย 6" }
      - { match: 1, feedback: "นั่นคือค่าของ $y$ โจทย์ถามค่า $x$" }
    solution: "บวกสองสมการ: $6x = 24$ → $x = 4$ แทนในสมการแรก: $8 + 3y = 11$ → $y = 1$ ตรวจ: $4(4) - 3(1) = 13$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.sys.p005
    topics: [math.algebra.systems]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการแก้ระบบสมการ $y = x + 1$ และ $2x + y = 7$ ด้วยวิธีแทนค่าให้ถูกต้อง"
    items:
      - "แทน $y = x + 1$ ลงในสมการที่สอง: $2x + (x + 1) = 7$"
      - "รวมพจน์และแก้สมการ: $3x + 1 = 7$ ได้ $x = 2$"
      - "แทน $x = 2$ ใน $y = x + 1$ ได้ $y = 3$"
      - "ตรวจกับสมการที่สอง: $2(2) + 3 = 7$ ✓"
    hints:
      - "วิธีแทนค่าเริ่มจากทำให้เหลือตัวแปรเดียว"
      - "หาตัวแปรแรกได้แล้วจึงหาตัวแปรที่สอง และตรวจเป็นขั้นสุดท้าย"
    solution: "แทนค่าให้เหลือตัวแปรเดียว → แก้หา $x$ → แทนกลับหา $y$ → ตรวจคำตอบ $(2, 3)$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.sys.p006
    topics: [math.algebra.systems]
    difficulty: 2
    type: expression
    stem: "ก่อนใช้วิธีแทนค่า ต้องจัดสมการ $3x + y = 10$ ให้ $y$ อยู่ข้างเดียว เขียน $y$ ในรูปของ $x$"
    prefix: "y ="
    answer: { latex: "10-3x", variables: [x] }
    hints:
      - "ต้องการให้ $y$ อยู่ข้างเดียว จึงต้องเอา $3x$ ออกจากข้างซ้าย"
      - "ลบ $3x$ ทั้งสองข้างของสมการ"
    misconceptions:
      - { match: "3x-10", feedback: "เครื่องหมายสลับกัน ลบ $3x$ ทั้งสองข้างได้ $y = 10 - 3x$ ลองแทน $x = 0$: สมการเดิมให้ $y = 10$" }
      - { match: "10+3x", feedback: "ย้าย $3x$ ไปอีกข้างต้องลบ ไม่ใช่บวก" }
    solution: "$3x + y = 10$ → ลบ $3x$ ทั้งสองข้าง: $y = 10 - 3x$ ตรวจด้วย $x = 2$: $y = 4$ และ $3(2) + 4 = 10$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.sys.p007
    topics: [math.algebra.systems]
    difficulty: 3
    type: numeric
    stem: "ร้านหน้าโรงเรียน ซื้อหมูปิ้ง 3 ไม้กับข้าวเหนียว 2 ห่อ ราคา 40 บาท ถ้าซื้อหมูปิ้ง 5 ไม้กับข้าวเหนียว 1 ห่อ ราคา 55 บาท หมูปิ้งราคาไม้ละกี่บาท"
    answer: { value: 10, unit: บาท }
    hints:
      - "ให้ $x$ แทนราคาหมูปิ้งต่อไม้ และ $y$ แทนราคาข้าวเหนียวต่อห่อ"
      - "ได้ $3x + 2y = 40$ และ $5x + y = 55$"
      - "จัดสมการที่สองเป็น $y = 55 - 5x$ แล้วแทนในสมการแรก (หรือคูณสมการที่สองด้วย 2 แล้วลบ)"
    misconceptions:
      - { match: 5, feedback: "นั่นคือราคาข้าวเหนียวต่อห่อ โจทย์ถามราคาหมูปิ้ง" }
    solution: "$y = 55 - 5x$ แทนใน $3x + 2y = 40$: $3x + 110 - 10x = 40$ → $-7x = -70$ → $x = 10$ บาท และ $y = 5$ บาท ตรวจ: $3(10) + 2(5) = 40$ ✓ และ $5(10) + 5 = 55$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.sys.p008
    topics: [math.algebra.systems]
    difficulty: 3
    type: mcq
    stem: "ระบบสมการใดไม่มีคำตอบ"
    choices:
      - { id: a, text: "$y = 2x + 1$ และ $y = 2x - 3$", correct: true }
      - { id: b, text: "$y = 2x + 1$ และ $y = -2x + 1$", feedback: "ความชันต่างกัน ($2$ กับ $-2$) เส้นจึงตัดกัน ที่จุด $(0, 1)$ มีคำตอบเดียว" }
      - { id: c, text: "$y = 2x + 1$ และ $2y = 4x + 2$", feedback: "หารสมการที่สองด้วย 2 ได้ $y = 2x + 1$ ซึ่งเป็นเส้นเดียวกัน จึงมีคำตอบมากมายไม่จำกัด ไม่ใช่ไม่มีคำตอบ" }
      - { id: d, text: "$x + y = 3$ และ $x - y = 1$", feedback: "บวกสองสมการได้ $2x = 4$ มีคำตอบเดียวคือ $(2, 1)$" }
    hints:
      - "ระบบไม่มีคำตอบเมื่อเส้นตรงสองเส้นขนานกัน"
      - "เส้นขนานมีความชันเท่ากันแต่จุดตัดแกน $y$ ต่างกัน ลองเขียนทุกสมการในรูป $y = mx + c$"
    solution: "$y = 2x + 1$ และ $y = 2x - 3$ มีความชันเท่ากัน (2) แต่ตัดแกน $y$ ต่างกัน (1 กับ $-3$) จึงขนานกัน ไม่มีจุดตัด ถ้าลบสองสมการจะได้ $0 = 4$ ซึ่งเป็นไปไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.sys.p009
    topics: [math.algebra.systems]
    difficulty: 4
    type: numeric
    stem: "ปัจจุบันพ่ออายุมากกว่าลูก 28 ปี อีก 4 ปีข้างหน้า อายุพ่อจะเป็น 3 เท่าของอายุลูก ปัจจุบันลูกอายุกี่ปี"
    answer: { value: 10, unit: ปี }
    hints:
      - "ให้ $f$ แทนอายุพ่อ และ $s$ แทนอายุลูกในปัจจุบัน ได้ $f = s + 28$"
      - "อีก 4 ปี ทั้งพ่อและลูกอายุเพิ่ม 4 ปี: $f + 4 = 3(s + 4)$"
      - "แทน $f = s + 28$ ลงในสมการที่สอง แล้วแก้หา $s$"
    misconceptions:
      - { match: 16, feedback: "ดูเหมือนเพิ่มอายุให้พ่อ 4 ปีแต่ไม่ได้เพิ่มให้ลูก อีก 4 ปีลูกก็อายุ $s + 4$ เช่นกัน" }
      - { match: 14, feedback: "นั่นคืออายุลูกในอีก 4 ปีข้างหน้า โจทย์ถามอายุปัจจุบัน" }
    solution: "$f = s + 28$ แทนใน $f + 4 = 3(s + 4)$: $s + 32 = 3s + 12$ → $20 = 2s$ → $s = 10$ ปี (พ่อ 38 ปี) ตรวจ: อีก 4 ปีพ่อ 42 ลูก 14 และ $42 = 3 \\times 14$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.sys.p010
    topics: [math.algebra.systems]
    difficulty: 4
    type: numeric
    stem: "แก้ระบบสมการ $3x + 4y = 8$ และ $2x - 3y = 11$ แล้ว $y$ มีค่าเท่าใด"
    answer: { value: -1 }
    hints:
      - "ไม่มีตัวแปรใดที่สัมประสิทธิ์เท่ากันหรือตรงข้ามกัน ต้องคูณสมการก่อน"
      - "เพื่อกำจัด $y$: คูณสมการแรกด้วย 3 และสมการที่สองด้วย 4 แล้วบวกกัน"
      - "หา $x$ ได้แล้ว แทนกลับในสมการแรกเพื่อหา $y$"
    misconceptions:
      - { match: 1, feedback: "ตรวจเครื่องหมายตอนแทนค่า: $3(4) + 4y = 8$ → $4y = -4$ ได้ $y$ เป็นลบ" }
      - { match: 4, feedback: "นั่นคือค่าของ $x$ โจทย์ถามค่า $y$" }
    solution: "$9x + 12y = 24$ และ $8x - 12y = 44$ บวกกัน: $17x = 68$ → $x = 4$ แทนใน $3x + 4y = 8$: $12 + 4y = 8$ → $y = -1$ ตรวจ: $2(4) - 3(-1) = 11$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.sys.p011
    topics: [math.algebra.systems]
    difficulty: 4
    type: numeric
    stem: "สวนสัตว์แห่งหนึ่งขายบัตรผู้ใหญ่ใบละ 150 บาท บัตรเด็กใบละ 70 บาท วันหนึ่งขายบัตรได้ 400 ใบ ได้เงินรวม 46,400 บาท ขายบัตรเด็กได้กี่ใบ"
    answer: { value: 170, unit: ใบ }
    hints:
      - "ให้ $a$ แทนจำนวนบัตรผู้ใหญ่ และ $c$ แทนจำนวนบัตรเด็ก"
      - "ได้ $a + c = 400$ และ $150a + 70c = 46{,}400$"
      - "แทน $a = 400 - c$ ลงในสมการที่สอง แล้วแก้หา $c$"
    misconceptions:
      - { match: 230, feedback: "นั่นคือจำนวนบัตรผู้ใหญ่ โจทย์ถามจำนวนบัตรเด็ก" }
      - { match: 200, feedback: "ดูเหมือนเดาว่าแบ่งครึ่งเท่ากัน ลองตรวจ: $150(200) + 70(200) = 44{,}000$ ไม่ใช่ $46{,}400$" }
    solution: "$150(400 - c) + 70c = 46{,}400$ → $60{,}000 - 80c = 46{,}400$ → $80c = 13{,}600$ → $c = 170$ ใบ (ผู้ใหญ่ 230 ใบ) ตรวจ: $150(230) + 70(170) = 34{,}500 + 11{,}900 = 46{,}400$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.sys.p012
    topics: [math.algebra.systems]
    difficulty: 5
    type: numeric
    stem: "แก้ระบบสมการ $\\dfrac{x}{2} + \\dfrac{y}{3} = 4$ และ $x - y = 3$ แล้ว $x$ มีค่าเท่าใด"
    answer: { value: 6 }
    hints:
      - "กำจัดเศษส่วนในสมการแรกก่อน ด้วยการคูณทั้งสองข้างด้วย ค.ร.น. ของ 2 และ 3"
      - "คูณ 6 ทุกพจน์ รวมทั้งข้างขวา ได้ $3x + 2y = 24$"
      - "จากสมการที่สอง $x = y + 3$ แทนลงในสมการใหม่"
    misconceptions:
      - { match: 2, feedback: "ดูเหมือนคูณ 6 เฉพาะข้างซ้าย ได้ $3x + 2y = 4$ ต้องคูณข้างขวาด้วย: $4 \\times 6 = 24$" }
      - { match: 3, feedback: "นั่นคือค่าของ $y$ โจทย์ถามค่า $x$" }
    solution: "คูณ 6: $3x + 2y = 24$ แทน $x = y + 3$: $3y + 9 + 2y = 24$ → $5y = 15$ → $y = 3$ และ $x = 6$ ตรวจ: $\\tfrac{6}{2} + \\tfrac{3}{3} = 4$ ✓ และ $6 - 3 = 3$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.sys.p013
    topics: [math.algebra.systems]
    difficulty: 5
    type: numeric
    stem: "ร้านชาต้องการผสมใบชาไทยราคากิโลกรัมละ 400 บาท กับใบชาเขียวราคากิโลกรัมละ 250 บาท ให้ได้ชาผสม 30 กิโลกรัม ที่มีราคาเฉลี่ยกิโลกรัมละ 300 บาท ต้องใช้ใบชาไทยกี่กิโลกรัม"
    answer: { value: 10, unit: kg }
    hints:
      - "ให้ $t$ แทนกิโลกรัมของชาไทย และ $g$ แทนกิโลกรัมของชาเขียว น้ำหนักรวม $t + g = 30$"
      - "มูลค่ารวมต้องเท่ากัน: $400t + 250g = 300 \\times 30$"
      - "แทน $g = 30 - t$ ลงในสมการมูลค่า แล้วแก้หา $t$"
    misconceptions:
      - { match: 20, feedback: "นั่นคือปริมาณชาเขียว ราคาเฉลี่ย 300 บาทใกล้ราคาชาเขียว (250) มากกว่า จึงต้องใช้ชาเขียวมากกว่าชาไทย" }
      - { match: 15, feedback: "ถ้าผสมอย่างละครึ่ง ราคาเฉลี่ยจะเป็น $\\tfrac{400 + 250}{2} = 325$ บาท ไม่ใช่ 300 บาท ต้องตั้งระบบสมการ" }
    solution: "$400t + 250(30 - t) = 9000$ → $150t + 7500 = 9000$ → $t = 10$ กิโลกรัม (ชาเขียว 20 กิโลกรัม) ตรวจ: $400(10) + 250(20) = 9000 = 300 \\times 30$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true
