problems:
  - id: phy.heat.p001
    topics: [physics.thermal.temperature-heat]
    difficulty: 1
    type: numeric
    stem: "อากาศในห้องเรียนมีอุณหภูมิ $27\\ ^\\circ\\mathrm{C}$ เท่ากับกี่เคลวิน ใช้ $T = \\theta + 273$ (ตอบเป็นตัวเลขในหน่วย K)"
    answer: { value: 300, tolerance: 0.2, unit: K }
    hints:
      - "สเกลเคลวินเริ่มจากศูนย์สัมบูรณ์ ค่าเคลวินจึงมากกว่าค่าองศาเซลเซียสเสมอ"
      - "บวก 273 เข้ากับอุณหภูมิในหน่วยองศาเซลเซียส"
    misconceptions:
      - { match: -246, feedback: "ดูเหมือนนำ 27 ลบ 273 การแปลงจากองศาเซลเซียสเป็นเคลวินต้อง **บวก** 273 อุณหภูมิเคลวินไม่มีค่าติดลบ" }
    solution: "$T = \\theta + 273 = 27 + 273 = 300\\ \\mathrm{K}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.heat.p002
    topics: [physics.thermal.temperature-heat]
    difficulty: 1
    type: mcq
    stem: "ข้อใดอธิบาย **ความร้อน** ได้ถูกต้อง"
    choices:
      - { id: a, text: "พลังงานที่ถ่ายโอนจากวัตถุที่อุณหภูมิสูงกว่าไปยังวัตถุที่อุณหภูมิต่ำกว่า", correct: true }
      - { id: b, text: "ชื่อเรียกอีกชื่อหนึ่งของอุณหภูมิ วัดด้วยเทอร์โมมิเตอร์", feedback: "อุณหภูมิบอกว่าร้อนแค่ไหน ส่วนความร้อนคือพลังงานที่ถ่ายโอน (หน่วยจูล) น้ำหนึ่งช้อนกับน้ำหนึ่งหม้อที่อุณหภูมิเท่ากันให้ความร้อนได้ไม่เท่ากัน" }
      - { id: c, text: "เมื่อจับน้ำแข็ง ความเย็นไหลจากน้ำแข็งเข้าสู่มือ", feedback: "ไม่มีสิ่งที่เรียกว่าความเย็นไหลได้ สิ่งที่เกิดจริงคือความร้อนไหลออกจากมือ (ร้อนกว่า) ไปยังน้ำแข็ง (เย็นกว่า) มือจึงรู้สึกเย็น" }
      - { id: d, text: "สิ่งที่วัตถุเก็บไว้ วัตถุที่อุณหภูมิสูงกว่าจึงมีความร้อนมากกว่าเสมอ", feedback: "ความร้อนเป็นพลังงานที่ **ถ่ายโอน** ไม่ใช่สิ่งที่วัตถุมีอยู่ และพลังงานที่ให้ได้ขึ้นกับมวลและชนิดสารด้วย ไม่ใช่อุณหภูมิอย่างเดียว" }
    hints:
      - "ความร้อนมีหน่วยจูล เช่นเดียวกับพลังงาน"
      - "ความร้อนเกิดขึ้นเมื่อวัตถุสองชิ้นมีอุณหภูมิต่างกัน และไหลจากที่ร้อนกว่าไปที่เย็นกว่าเสมอ"
    solution: "ความร้อนคือพลังงานที่ถ่ายโอนเนื่องจากความต่างของอุณหภูมิ ไหลจากวัตถุที่ร้อนกว่าไปยังวัตถุที่เย็นกว่าจนอุณหภูมิเท่ากัน (สมดุลความร้อน) ส่วนอุณหภูมิเป็นเพียงระดับความร้อนเย็น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.heat.p003
    topics: [physics.thermal.temperature-heat]
    difficulty: 2
    type: numeric
    stem: "น้ำในขวดร้อนขึ้นจาก $20\\ ^\\circ\\mathrm{C}$ เป็น $80\\ ^\\circ\\mathrm{C}$ อุณหภูมิเปลี่ยนไปกี่เคลวิน (ตอบเป็นตัวเลขในหน่วย K)"
    answer: { value: 60, unit: K }
    hints:
      - "หาผลต่างของอุณหภูมิก่อน: ปลาย − ต้น"
      - "ช่องของสเกลเซลเซียสกับเคลวินกว้างเท่ากัน ผลต่างจึงเป็นตัวเลขเดียวกันในทั้งสองหน่วย"
    misconceptions:
      - { match: 333, feedback: "ผลต่างอุณหภูมิไม่ต้องบวก 273 เพราะถ้าแปลงทั้งสองค่าก่อน ($353 - 293$) ก็ได้ผลเท่าเดิม การบวก 273 ใช้กับอุณหภูมิค่าเดียวเท่านั้น" }
    solution: "$\\Delta T = 80 - 20 = 60\\ ^\\circ\\mathrm{C} = 60\\ \\mathrm{K}$ ตรวจ: $(80 + 273) - (20 + 273) = 353 - 293 = 60\\ \\mathrm{K}$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.heat.p004
    topics: [physics.thermal.temperature-heat]
    difficulty: 2
    type: numeric
    stem: "ต้องใช้ความร้อนเท่าใดจึงทำให้น้ำ $2\\ \\mathrm{kg}$ ร้อนขึ้นจาก $25\\ ^\\circ\\mathrm{C}$ เป็น $75\\ ^\\circ\\mathrm{C}$ ใช้ $c$ ของน้ำ $= 4{,}200\\ \\mathrm{J/(kg\\cdot K)}$ (ตอบเป็นตัวเลขในหน่วย kJ)"
    answer: { value: 420, unit: kJ }
    hints:
      - "ใช้ $Q = mc\\,\\Delta T$"
      - "หา $\\Delta T$ จากผลต่างของอุณหภูมิ ไม่ใช่อุณหภูมิปลาย"
      - "คำนวณได้หน่วยจูลแล้วหารด้วย 1,000 เพื่อเปลี่ยนเป็นกิโลจูล"
    misconceptions:
      - { match: 630, feedback: "ดูเหมือนใช้อุณหภูมิปลาย $75\\ ^\\circ\\mathrm{C}$ แทน $\\Delta T$ ต้องใช้อุณหภูมิที่ **เปลี่ยนไป** คือ $75 - 25$" }
      - { match: 210, feedback: "ดูเหมือนลืมคูณมวล $2\\ \\mathrm{kg}$ ค่า $c$ เป็นความร้อนต่อ $1\\ \\mathrm{kg}$ จึงต้องคูณมวลด้วย" }
    solution: "$Q = mc\\,\\Delta T = (2\\ \\mathrm{kg})(4{,}200\\ \\mathrm{J/(kg\\cdot K)})(75 - 25)\\ \\mathrm{K} = 420{,}000\\ \\mathrm{J} = 420\\ \\mathrm{kJ}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.heat.p005
    topics: [physics.thermal.temperature-heat]
    difficulty: 3
    type: numeric
    stem: "แม่ค้าก๋วยเตี๋ยวต้มน้ำซุป (ถือว่าเป็นน้ำ) $1.5\\ \\mathrm{kg}$ จาก $30\\ ^\\circ\\mathrm{C}$ จนถึง $100\\ ^\\circ\\mathrm{C}$ น้ำซุปได้รับความร้อนเท่าใด ใช้ $c$ ของน้ำ $= 4{,}200\\ \\mathrm{J/(kg\\cdot K)}$ (ตอบเป็นตัวเลขในหน่วย kJ)"
    answer: { value: 441, unit: kJ }
    hints:
      - "$\\Delta T$ คือ $100 - 30$"
      - "แทนค่าใน $Q = mc\\,\\Delta T$ ได้หน่วยจูล"
      - "หารด้วย 1,000 เพื่อตอบเป็นกิโลจูล"
    misconceptions:
      - { match: 630, feedback: "ดูเหมือนใช้ $\\Delta T = 100$ ซึ่งเป็นอุณหภูมิปลาย น้ำเริ่มที่ $30\\ ^\\circ\\mathrm{C}$ จึงร้อนขึ้นเพียง $70\\ \\mathrm{K}$" }
      - { match: 441000, feedback: "ตัวเลขถูกแล้วแต่เป็นหน่วยจูล โจทย์ถามเป็นกิโลจูล ให้หารด้วย 1,000" }
    solution: "$Q = mc\\,\\Delta T = (1.5\\ \\mathrm{kg})(4{,}200\\ \\mathrm{J/(kg\\cdot K)})(70\\ \\mathrm{K}) = 441{,}000\\ \\mathrm{J} = 441\\ \\mathrm{kJ}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.heat.p006
    topics: [physics.thermal.temperature-heat]
    difficulty: 3
    type: expression
    stem: "จัดสูตร $Q = mc\\,\\Delta T$ ให้ $\\Delta T$ อยู่ข้างเดียว (ตอบในรูปของ $Q$, $m$ และ $c$)"
    prefix: "\\Delta T ="
    answer: { latex: "\\frac{Q}{mc}", variables: [Q, m, c] }
    misconceptions:
      - { match: "Qmc", feedback: "$\\Delta T$ ถูกคูณด้วย $m$ และ $c$ อยู่ การย้ายข้างต้องหารด้วย $mc$ ไม่ใช่คูณ" }
      - { match: "\\frac{mc}{Q}", feedback: "กลับเศษกับส่วน $\\Delta T$ ต้องเพิ่มขึ้นเมื่อให้ความร้อน $Q$ มากขึ้น $Q$ จึงต้องอยู่ที่เศษ" }
    hints:
      - "ฝั่งขวา $\\Delta T$ ถูกคูณด้วยอะไรบ้าง"
      - "หารทั้งสองข้างของสมการด้วยผลคูณ $mc$"
    solution: "$Q = mc\\,\\Delta T$ หารทั้งสองข้างด้วย $mc$ ได้ $\\Delta T = \\dfrac{Q}{mc}$ ตรวจหน่วย: $\\dfrac{\\mathrm{J}}{\\mathrm{kg} \\cdot \\mathrm{J/(kg\\cdot K)}} = \\mathrm{K}$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.heat.p007
    topics: [physics.thermal.temperature-heat]
    difficulty: 3
    type: numeric
    stem: "ก้อนโลหะมวล $0.5\\ \\mathrm{kg}$ ได้รับความร้อน $9{,}000\\ \\mathrm{J}$ แล้วอุณหภูมิสูงขึ้น $20\\ \\mathrm{K}$ โลหะนี้มีความจุความร้อนจำเพาะเท่าใด (ตอบเป็นตัวเลขในหน่วย J/(kg·K))"
    answer: { value: 900, unit: J/(kg·K) }
    hints:
      - "จัดสูตร $Q = mc\\,\\Delta T$ ให้ $c$ อยู่ข้างเดียว"
      - "$c = \\dfrac{Q}{m\\,\\Delta T}$ หารด้วยทั้งมวลและอุณหภูมิที่เปลี่ยน"
    misconceptions:
      - { match: 450, feedback: "ดูเหมือนหารด้วย $\\Delta T$ อย่างเดียว ลืมหารด้วยมวล $0.5\\ \\mathrm{kg}$ ด้วย" }
      - { match: 225, feedback: "ดูเหมือนคูณมวลแทนการหาร จาก $c = \\dfrac{Q}{m\\,\\Delta T}$ มวลต้องอยู่ที่ตัวส่วน" }
    solution: "$c = \\dfrac{Q}{m\\,\\Delta T} = \\dfrac{9{,}000\\ \\mathrm{J}}{(0.5\\ \\mathrm{kg})(20\\ \\mathrm{K})} = 900\\ \\mathrm{J/(kg\\cdot K)}$ (ใกล้เคียงอะลูมิเนียม)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.heat.p008
    topics: [physics.thermal.temperature-heat]
    difficulty: 4
    type: numeric
    stem: "ผสมน้ำ $2\\ \\mathrm{kg}$ ที่ $80\\ ^\\circ\\mathrm{C}$ กับน้ำ $3\\ \\mathrm{kg}$ ที่ $20\\ ^\\circ\\mathrm{C}$ ในภาชนะที่ไม่ดูดและไม่เสียความร้อน อุณหภูมิสุดท้ายเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย °C)"
    answer: { value: 44, unit: °C }
    hints:
      - "ความร้อนที่น้ำร้อนให้ออกไป = ความร้อนที่น้ำเย็นได้รับ"
      - "เป็นน้ำทั้งคู่ ค่า $c$ จึงตัดกันได้: $2(80 - T) = 3(T - 20)$"
      - "กระจายวงเล็บแล้วรวมพจน์ที่มี $T$ ไว้ข้างเดียว"
    misconceptions:
      - { match: 50, feedback: "ค่าเฉลี่ยตรงกลางใช้ได้เฉพาะเมื่อมวลเท่ากัน ข้อนี้น้ำเย็นมีมวลมากกว่า คำตอบจึงต้องเอียงไปทางน้ำเย็น" }
      - { match: 56, feedback: "ดูเหมือนสลับมวล ให้น้ำร้อนมีมวล $3\\ \\mathrm{kg}$ ตรวจว่ามวลแต่ละค่าคูณกับผลต่างอุณหภูมิของน้ำส่วนนั้นเอง" }
    solution: "$m_1 c (T_1 - T) = m_2 c (T - T_2)$ → $2(80 - T) = 3(T - 20)$ → $160 - 2T = 3T - 60$ → $5T = 220$ → $T = 44\\ ^\\circ\\mathrm{C}$ ตรวจ: ร้อนให้ $2 \\times 36 = 72$ เย็นรับ $3 \\times 24 = 72$ (หน่วย $\\mathrm{kg \\cdot K}$ คูณ $c$) ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.heat.p009
    topics: [physics.thermal.temperature-heat]
    difficulty: 4
    type: numeric
    stem: "ช่วงหน้าหนาวที่เชียงใหม่ พ่อจะผสมน้ำอาบให้ลูก ในกะละมังมีน้ำประปา $20\\ \\mathrm{kg}$ อุณหภูมิ $30\\ ^\\circ\\mathrm{C}$ ต้องเติมน้ำร้อน $60\\ ^\\circ\\mathrm{C}$ กี่กิโลกรัม น้ำจึงจะอุ่นที่ $40\\ ^\\circ\\mathrm{C}$ (ไม่คิดความร้อนที่เสียให้กะละมังและอากาศ ตอบเป็นตัวเลขในหน่วย kg)"
    answer: { value: 10, unit: kg }
    hints:
      - "น้ำร้อนเย็นลงจาก $60$ เป็น $40\\ ^\\circ\\mathrm{C}$ ส่วนน้ำประปาร้อนขึ้นจาก $30$ เป็น $40\\ ^\\circ\\mathrm{C}$"
      - "ตั้งสมการ $m_{\\text{ร้อน}}\\,c\\,(60 - 40) = (20)\\,c\\,(40 - 30)$ ค่า $c$ ตัดกันได้"
      - "แก้สมการหา $m_{\\text{ร้อน}}$"
    misconceptions:
      - { match: 40, feedback: "ดูเหมือนจับคู่มวลกับผลต่างอุณหภูมิสลับกัน น้ำร้อนเปลี่ยน $20\\ \\mathrm{K}$ ส่วนน้ำประปาเปลี่ยน $10\\ \\mathrm{K}$ น้ำร้อนจึงใช้น้อยกว่าน้ำประปา" }
      - { match: 20, feedback: "ถ้าใส่น้ำร้อนเท่ากับน้ำเย็นจะได้ค่าเฉลี่ย $45\\ ^\\circ\\mathrm{C}$ ร้อนเกินไป ต้องตั้งสมการความร้อนให้ = ความร้อนรับ" }
    solution: "$m(60 - 40) = 20(40 - 30)$ → $20m = 200$ → $m = 10\\ \\mathrm{kg}$ ตรวจ: $\\dfrac{10(60) + 20(30)}{30} = 40\\ ^\\circ\\mathrm{C}$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.heat.p010
    topics: [physics.thermal.temperature-heat]
    difficulty: 4
    type: mcq
    stem: "ใส่น้ำ $1\\ \\mathrm{kg}$ ในหม้อใบหนึ่ง และน้ำมันพืช $1\\ \\mathrm{kg}$ ในกระทะอีกใบสำหรับทอดไข่เจียว เริ่มที่อุณหภูมิห้องเท่ากัน แล้วให้ความร้อนเท่ากันคือ $42\\ \\mathrm{kJ}$ ถ้า $c$ ของน้ำ $= 4{,}200$ และของน้ำมันพืช $= 2{,}000\\ \\mathrm{J/(kg\\cdot K)}$ ข้อใดถูก (ไม่คิดความร้อนที่ภาชนะดูดไป)"
    choices:
      - { id: a, text: "น้ำมันร้อนขึ้น $21\\ \\mathrm{K}$ มากกว่าน้ำซึ่งร้อนขึ้น $10\\ \\mathrm{K}$", correct: true }
      - { id: b, text: "ทั้งสองร้อนขึ้นเท่ากัน เพราะได้รับความร้อนเท่ากัน", feedback: "ความร้อนเท่ากันไม่ได้แปลว่าอุณหภูมิเปลี่ยนเท่ากัน $\\Delta T = \\dfrac{Q}{mc}$ ขึ้นกับ $c$ ของสารด้วย" }
      - { id: c, text: "น้ำร้อนขึ้นมากกว่า เพราะน้ำมีความจุความร้อนจำเพาะสูงกว่า", feedback: "$c$ สูงแปลว่าต้องใช้ความร้อนมากจึงจะร้อนขึ้น $1\\ \\mathrm{K}$ ให้ความร้อนเท่ากัน สารที่มี $c$ สูงจึงร้อนขึ้น **น้อยกว่า**" }
      - { id: d, text: "น้ำมันร้อนขึ้น $0.021\\ \\mathrm{K}$ ส่วนน้ำร้อนขึ้น $0.01\\ \\mathrm{K}$", feedback: "ดูเหมือนแทน $Q = 42$ โดยไม่ได้เปลี่ยนกิโลจูลเป็นจูล ค่า $c$ มีหน่วย $\\mathrm{J/(kg\\cdot K)}$ จึงต้องใช้ $Q = 42{,}000\\ \\mathrm{J}$" }
    hints:
      - "ใช้ $\\Delta T = \\dfrac{Q}{mc}$ กับสารแต่ละชนิด"
      - "อย่าลืมเปลี่ยน $42\\ \\mathrm{kJ}$ เป็น $42{,}000\\ \\mathrm{J}$ ก่อนแทนค่า"
    solution: "น้ำ: $\\Delta T = \\dfrac{42{,}000}{(1)(4{,}200)} = 10\\ \\mathrm{K}$ น้ำมัน: $\\Delta T = \\dfrac{42{,}000}{(1)(2{,}000)} = 21\\ \\mathrm{K}$ น้ำมันมี $c$ ต่ำกว่าจึงร้อนเร็วกว่าราวสองเท่า กระทะน้ำมันจึงร้อนพร้อมทอดเร็วกว่าหม้อน้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.heat.p011
    topics: [physics.thermal.temperature-heat]
    difficulty: 5
    type: numeric
    stem: "ช่างตีมีดบ้านอรัญญิก จังหวัดพระนครศรีอยุธยา จุ่มใบมีดเหล็กมวล $0.2\\ \\mathrm{kg}$ อุณหภูมิ $200\\ ^\\circ\\mathrm{C}$ ลงในถังน้ำ $0.3\\ \\mathrm{kg}$ อุณหภูมิ $20\\ ^\\circ\\mathrm{C}$ ใช้ $c$ ของเหล็ก $= 450$ และ $c$ ของน้ำ $= 4{,}200\\ \\mathrm{J/(kg\\cdot K)}$ ถ้าไม่มีความร้อนรั่วไหลและไม่มีน้ำกลายเป็นไอ อุณหภูมิสุดท้ายของมีดและน้ำเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย °C)"
    answer: { value: 32, tolerance: 0.3, unit: °C }
    hints:
