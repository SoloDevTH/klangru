  - id: "engineering.electronics.nonlinear-small-signal.p017"
    topics: ["engineering.electronics.nonlinear-small-signal"]
    difficulty: 5
    type: "code"
    stem: "เขียนฟังก์ชัน `diode_voltage(Vs, R)` ที่หาแรงดันตกคร่อมไดโอดของวงจร $V_s$ ต่อ $R$ อนุกรมกับไดโอด จากสมการ $(V_s - V)/R = I_s(e^{V/V_T}-1)$ โดยใช้ $I_s = 10^{-12}$ และ $V_T = 0.02585$ ด้วยวิธีแบ่งครึ่งช่วง $[0, V_s]$ ให้คืนค่า $V$ ทศนิยมตามที่คำนวณได้ ใช้ไลบรารี `math` ได้"
    hints: ["ถ้าค่า $f(V) = (V_s - V)/R - I_s(e^{V/V_T}-1)$ ยังเป็นบวก ให้ขยับ $V$ ขึ้น", "ทำซ้ำจนช่วงแคบมากแล้วคืนจุดกึ่งกลาง"]
    solution: "ฟังก์ชันใช้วิธีแบ่งครึ่งบนฟังก์ชัน $f(V)$ ที่เป็นบวกเมื่อ $V$ ต่ำและเป็นลบเมื่อ $V$ สูง จนได้ค่า $V_D \\approx 0.574$ V เมื่อ $V_s = 5$, $R = 1$ k"
    license: "CC-BY-SA-4.0"
    ai_assisted: true
    language: "python"
    starter: "import math\n\ndef diode_voltage(Vs, R):\n    pass\n"
    tests: "assert abs(diode_voltage(5, 1000) - 0.57415) < 0.002, f\"diode_voltage(5, 1000) ควรได้ประมาณ 0.574 V แต่ได้ {diode_voltage(5, 1000)}\"\nassert abs(diode_voltage(9, 1000) - 0.59074) < 0.002, f\"diode_voltage(9, 1000) ควรได้ประมาณ 0.591 V แต่ได้ {diode_voltage(9, 1000)}\"\nassert diode_voltage(9, 1000) > diode_voltage(5, 1000), \"แหล่งจ่ายที่สูงขึ้นต้องทำให้แรงดันไดโอดสูงขึ้น\"\n"
    reference: "import math\n\ndef diode_voltage(Vs, R):\n    Is, VT = 1e-12, 0.02585\n    lo, hi = 0.0, Vs\n    for _ in range(200):\n        mid = (lo + hi) / 2\n        f = (Vs - mid) / R - Is * (math.exp(mid / VT) - 1)\n        if f > 0:\n            lo = mid\n        else:\n            hi = mid\n    return (lo + hi) / 2\n"
