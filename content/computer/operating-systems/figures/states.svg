  <text x="90.0" y="96.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ใหม่</text>
  <rect x="260.0" y="62.0" width="140.0" height="56.0" rx="28" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="330.0" y="96.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">พร้อม</text>
