  - { front: "ถุงเอ็มบริโอมีกี่เซลล์ กี่นิวเคลียส", back: "7 เซลล์ 8 นิวเคลียส" }
  - { front: "เอนโดสเปิร์มมีโครโมโซมกี่ชุด", back: "3 ชุด (3n)" }
