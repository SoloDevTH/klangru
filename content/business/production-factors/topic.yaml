id: business.econ.production-factors
subject: business
title: { th: ปัจจัยการผลิตและผู้ผลิตที่มีความรับผิดชอบ, en: Factors of production and responsible producers }
summary: ปัจจัยการผลิตสี่อย่างและผลตอบแทน ปัจจัยที่มีอิทธิพลต่อการผลิต ผลผลิตต่อแรงงาน บทบาทของผู้ผลิตที่มีความรับผิดชอบ และการใช้ทรัพยากรอย่างยั่งยืน
difficulty: 2.5
minutes: 30
prerequisites: [business.econ.scarcity-choice]
encompasses:
  - { id: business.econ.scarcity-choice, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: factors-returns.svg
    alt: "แผนภาพปัจจัยการผลิตสี่กล่องทางซ้าย ที่ดิน (ทรัพยากรธรรมชาติ) ผลตอบแทนค่าเช่า แรงงาน (แรงกายและความคิดของคน) ผลตอบแทนค่าจ้าง ทุน (เครื่องมือ เครื่องจักร อาคาร) ผลตอบแทนดอกเบี้ย ผู้ประกอบการ (รวบรวมปัจจัยและรับความเสี่ยง) ผลตอบแทนกำไร ทุกกล่องมีลูกศรชี้ไปที่กล่องการผลิต แล้วลูกศรไปที่สินค้าและบริการ"
    caption: "ปัจจัยการผลิตสี่อย่างและผลตอบแทน"
  - { type: check, problem: business.econ.production-factors.p003, prompt: "จับคู่ปัจจัยกับผลตอบแทน" }
  - type: worked-example
    title: แบ่งรายได้ของร้านขนมเปี๊ยะให้เจ้าของปัจจัยการผลิต
    problem: "เดือนหนึ่งร้านขนมเปี๊ยะของป้าศรี (สมมติ) ขายได้ $45{,}000$ บาท จ่ายค่าเช่าร้าน $4{,}000$ บาท ค่าจ้างลูกจ้างสองคน $16{,}000$ บาท ดอกเบี้ยเงินกู้ที่ใช้ซื้อเตาอบ $1{,}500$ บาท และค่าแป้ง ถั่ว ไข่ $13{,}500$ บาท ป้าศรีในฐานะผู้ประกอบการได้กำไรเท่าใด"
    steps:
      - text: "จับคู่: ค่าเช่า → ที่ดิน ค่าจ้าง → แรงงาน ดอกเบี้ย → ทุน (เงินที่ใช้ซื้อเตาอบ) ส่วนวัตถุดิบเป็นต้นทุนที่ต้องจ่ายเช่นกัน"
      - text: "รวมรายจ่าย $= 4{,}000 + 16{,}000 + 1{,}500 + 13{,}500 = 35{,}000$ บาท"
      - text: "กำไร $= 45{,}000 - 35{,}000 = 10{,}000$ บาท"
        why: "กำไรคือส่วนที่เหลือหลังจ่ายให้เจ้าของปัจจัยอื่นครบ ผู้ประกอบการจึงได้เป็นคนสุดท้าย"
      - text: "ถ้าเดือนหน้าขายได้แค่ $30{,}000$ บาท แต่รายจ่ายเท่าเดิม ป้าศรีจะขาดทุน $5{,}000$ บาท แม้ลูกจ้างยังได้ค่าจ้างเท่าเดิม"
        why: "นี่คือความเสี่ยงที่ผู้ประกอบการรับไว้"
    answer: "กำไร $10{,}000$ บาท"
  - type: figure
    src: sustainable-use.svg
    alt: "กล่องหกกล่อง วิธีใช้ทรัพยากรอย่างยั่งยืน ใช้อย่างประหยัด (ใช้เท่าที่จำเป็น) ลด (ลดของใช้ครั้งเดียวทิ้ง) ใช้ซ้ำ (ใช้ของเดิมหลายครั้ง) นำกลับมาใช้ใหม่ (แปรรูปเศษวัสดุ) ปลูกทดแทน (ปลูกป่า ปล่อยพันธุ์ปลา) พลังงานหมุนเวียน (แสงอาทิตย์ ลม) ด้านล่างเขียนประโยชน์ มีทรัพยากรใช้ถึงรุ่นลูกหลาน ลดต้นทุน ลดมลพิษ"
    caption: "วิธีและประโยชน์ของการใช้ทรัพยากรอย่างยั่งยืน"
  - { type: check, problem: business.econ.production-factors.p005, prompt: "ผู้ผลิตที่มีความรับผิดชอบทำอะไรบ้าง" }
glossary:
  - { term: ปัจจัยการผลิต, definition: "สิ่งที่นำมาใช้ผลิตสินค้าและบริการ ได้แก่ ที่ดิน แรงงาน ทุน และผู้ประกอบการ" }
  - { term: ที่ดิน, definition: "ในทางเศรษฐศาสตร์หมายถึงทรัพยากรธรรมชาติทุกชนิด ผลตอบแทนคือค่าเช่า" }
  - { term: แรงงาน, definition: "แรงกายและความคิดของคนที่ใช้ในการผลิต ผลตอบแทนคือค่าจ้าง" }
  - { term: ทุน, definition: "สินค้าทุน เช่น เครื่องมือ เครื่องจักร อาคาร ผลตอบแทนคือดอกเบี้ย" }
  - { term: ผู้ประกอบการ, definition: "ผู้รวบรวมปัจจัยการผลิต ตัดสินใจ และรับความเสี่ยง ผลตอบแทนคือกำไร" }
  - { term: ผลผลิตต่อแรงงาน, definition: "ผลผลิตทั้งหมดหารด้วยจำนวนคนงาน ใช้วัดประสิทธิภาพของการผลิต" }
  - { term: การใช้ทรัพยากรอย่างยั่งยืน, definition: "การใช้ทรัพยากรในวันนี้โดยไม่ทำให้คนรุ่นหลังขาดแคลน" }
flashcards:
  - { front: "ปัจจัยการผลิตสี่อย่าง", back: "ที่ดิน แรงงาน ทุน ผู้ประกอบการ" }
  - { front: "ผลตอบแทนของปัจจัยการผลิต", back: "ที่ดิน → ค่าเช่า · แรงงาน → ค่าจ้าง · ทุน → ดอกเบี้ย · ผู้ประกอบการ → กำไร" }
  - { front: "ปัจจัยที่มีอิทธิพลต่อการผลิต", back: "ราคาสินค้า ราคาปัจจัยการผลิต เทคโนโลยี ความต้องการของผู้บริโภค ดินฟ้าอากาศ นโยบายรัฐ" }
  - { front: "ผู้ผลิตที่มีความรับผิดชอบ", back: "สินค้าคุณภาพและปลอดภัย ฉลากถูกต้อง ราคาเป็นธรรม ดูแลแรงงาน ไม่ทำลายสิ่งแวดล้อม" }
