    note: สอนสุขบัญญัติแห่งชาติ 10 ประการ พฤติกรรมตัวอย่างของแต่ละข้อ ความสำคัญของการทำจนเป็นนิสัย และการใช้ตารางบันทึกพฤติกรรม แต่ตัวชี้วัดให้ปฏิบัติตนและแสดงพฤติกรรมจริง ซึ่งต้องติดตามที่บ้านและโรงเรียน แอปตรวจไม่ได้
