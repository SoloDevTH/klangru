  - id: math.cnt.p022
    topics: [math.prob.counting]
    difficulty: 4
    type: numeric
    stem: "นำธงสีแดง 3 ผืน สีขาว 2 ผืน และสีน้ำเงิน 1 ผืน (ธงสีเดียวกันเหมือนกันทุกประการ) มาแขวนเรียงเป็นแถวเดียว จะได้ลวดลายต่างกันกี่แบบ"
    answer: { value: 60, unit: แบบ }
    hints:
      - "ถ้าธงทั้ง 6 ผืนต่างกันหมด จะเรียงได้ $6!$ แบบ"
      - "ธงสีแดง 3 ผืนสลับที่กันเองได้ $3!$ แบบโดยลวดลายเท่าเดิม ธงสีขาวสลับกันได้ $2!$ แบบ จึงต้องหารออก"
    misconceptions:
      - { match: 720, feedback: "นั่นคือ $6!$ ซึ่งนับธงสีเดียวกันเหมือนเป็นคนละผืน การสลับธงแดงสองผืนไม่ได้ลวดลายใหม่ ต้องหารด้วย $3!\\,2!$" }
      - { match: 120, feedback: "หารด้วย $3!$ แล้ว แต่ยังไม่ได้หารด้วย $2!$ สำหรับธงสีขาวที่เหมือนกัน" }
    solution: "จำนวนแบบ $= \\dfrac{6!}{3!\\,2!\\,1!} = \\dfrac{720}{6 \\times 2} = 60$ แบบ หรือคิดว่าเลือกตำแหน่งให้ธงแดง $C(6, 3) = 20$ แบบ แล้วเลือกตำแหน่งให้ธงขาวจาก 3 ที่ที่เหลือ $C(3, 2) = 3$ แบบ ได้ $20 \\times 3 = 60$ ✓"
