# มาตรฐานคุณวุฒิระดับปริญญาตรี สาขาโลจิสติกส์ พ.ศ. ๒๕๕๒ (มคอ.๑) เอกสารแนบท้ายประกาศกระทรวงศึกษาธิการ
#
# ที่มาและสถานะ (ตรวจเมื่อ 2026-10-24)
# - อยู่ในรายการ มคอ.๑ ระดับปริญญาตรี 26 สาขาที่สำนักงานปลัดกระทรวงศึกษาธิการรวบรวมไว้ ("สาขาวิชาโลจิสติกส์ พ.ศ. 2552")
# - ไฟล์ที่ใช้เป็นสำเนาที่มหาวิทยาลัยพายัพเผยแพร่ซ้ำ หน้าแรกเป็นประกาศกระทรวงศึกษาธิการลงนามโดยรัฐมนตรีว่าการกระทรวงศึกษาธิการ
#   ข้อ ๒ ระบุว่าใช้บังคับตั้งแต่วันถัดจากวันประกาศในราชกิจจานุเบกษา แต่เรายังหาหน้าราชกิจจานุเบกษาของฉบับนี้ไม่พบ
#   (เว็บไซต์ราชกิจจานุเบกษาและ สป.อว. ตอบช้าหรือปฏิเสธการเชื่อมต่อจากเครือข่ายของเรา)
# - ยังไม่พบฉบับแก้ไขหรือยกเลิก แต่กฎกระทรวงมาตรฐานคุณวุฒิระดับอุดมศึกษา พ.ศ. 2565 เปลี่ยนกรอบระดับชาติแล้ว
#   จึงยังไม่ได้ยืนยันว่ามาตรฐานสาขานี้ยังใช้บังคับเต็มรูปหรือไม่
# - ไม่มีมาตรฐานคุณวุฒิสาขา "การจัดการ" หรือ "บริหารธุรกิจ" ในรายการ (ดู th-tqf-accounting) สาขาโลจิสติกส์เป็นมาตรฐานของรัฐ
#   ที่ใกล้กับการจัดการการดำเนินงานและโซ่อุปทานที่สุด จึงเก็บไว้ใช้วางแผนหัวข้อ management.operations.*
#
# โครงและรหัส
# - ใช้เลขข้อของต้นฉบับ (เขียนเป็นเลขอารบิก) ไม่ตั้งรหัสใหม่
#   strand 5 = ข้อ ๕ มาตรฐานผลการเรียนรู้ (standard = ด้าน ๕.๑-๕.๕) ด้านที่ต้นฉบับเขียนเป็นย่อหน้าเดียวใช้รหัสด้านเป็นรหัสตัวชี้วัด
#   ด้าน ๕.๒ มีข้อย่อย (๑)-(๓) จึงใช้รหัส "5.2(1)" ถึง "5.2(3)"
#   strand 8 = ข้อ ๘ เนื้อหาสาระสำคัญของสาขา (standard = ๘.๑ วิชาเอกบังคับ, ๘.๒ วิชาเอกเลือก, indicator = ๘.x.x)
# - ไม่ได้เก็บข้อ ๑-๔, ๖-๗, ๙ เป็นต้นไป (ชื่อปริญญา ลักษณะสาขา คุณลักษณะบัณฑิต โครงสร้างหลักสูตร กลยุทธ์การสอน ฯลฯ)
# - ชั้นข้อความของ PDF (ฟอนต์ Angsana New แบบ WinAnsi) ทำสระอำหาย ("ทางาน" แทน "ทำงาน") และแยกวรรณยุกต์ออกจากพยัญชนะ
#   จึงถอดด้วย pdftotext -layout แล้วแก้ทีละคำ และตรวจทานทุกรายการกับภาพหน้า PDF (หน้า 5-8 ของไฟล์ = หน้า ๑-๔ ของ มคอ.๑)
#   ช่องว่างหลายช่องจากการจัดชิดขอบยุบเป็นช่องเดียว รอยต่อบรรทัดภายในย่อหน้าถือว่าไม่เว้นวรรค
