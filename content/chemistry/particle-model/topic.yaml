id: chemistry.matter.particle-model
subject: chemistry
title: { th: แบบจำลองอนุภาคของสสาร, en: The particle model of matter }
summary: สสารประกอบด้วยอนุภาคเล็กมาก การจัดเรียง แรงยึดเหนี่ยว และการเคลื่อนที่ของอนุภาคอธิบายสมบัติของสามสถานะ การเปลี่ยนสถานะ ความดันแก๊ส การแพร่ และการเคลื่อนที่แบบบราวน์
difficulty: 2.5
minutes: 35
prerequisites: [chemistry.matter.states-changes]
encompasses:
  - { id: chemistry.matter.states-changes, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: heating-curve-particles.svg
    alt: "กราฟอุณหภูมิ (°C) กับเวลาที่ให้ความร้อนแก่น้ำแข็งในอัตราคงที่ เส้นเริ่มที่ −20 °C ชันขึ้นถึง 0 °C แล้วเป็นเส้นราบช่วงหลอมเหลว (อุณหภูมิคงที่) จากนั้นชันขึ้นถึง 100 °C แล้วเป็นเส้นราบช่วงเดือดซึ่งยาวกว่าช่วงหลอมเหลวมาก สุดท้ายชันขึ้นถึง 120 °C มีภาพอนุภาคประกอบ ของแข็ง: อนุภาคเรียงชิดเป็นตาราง ของเหลว: อนุภาคชิดกันแต่ไม่เป็นระเบียบ แก๊ส: อนุภาคไม่กี่ตัวอยู่ห่างกันและมีลูกศรแสดงการเคลื่อนที่ทุกทิศ"
    caption: "ขณะหลอมเหลวและเดือด พลังงานใช้เอาชนะแรงยึดเหนี่ยวระหว่างอนุภาค อุณหภูมิจึงคงที่ (แกนเวลาไม่ตามมาตราส่วน)"
  - { type: check, problem: chemistry.matter.particle-model.p003, prompt: "นึกถึงที่ว่างระหว่างอนุภาคในแต่ละสถานะ" }
  - type: worked-example
    title: อธิบายลูกเหม็นหายไปด้วยแบบจำลองอนุภาค
    problem: "ลูกเหม็นในตู้เสื้อผ้าเล็กลงทุกวันโดยไม่มีของเหลวเกิดขึ้น และเปิดตู้ก็ได้กลิ่นทันที อธิบายด้วยแบบจำลองอนุภาค"
    steps:
      - text: "อนุภาคที่ผิวลูกเหม็นได้รับพลังงานจากสิ่งแวดล้อม บางอนุภาคมีพลังงานมากพอจะหลุดจากแรงยึดเหนี่ยวของเพื่อนบ้าน"
      - text: "อนุภาคเหล่านั้นหลุดออกไปเป็นแก๊สโดยตรง (ระเหิด) ลูกเหม็นจึงเล็กลง"
        why: "แรงยึดเหนี่ยวระหว่างอนุภาคของลูกเหม็นน้อย จึงหลุดได้ที่อุณหภูมิห้อง"
      - text: "อนุภาคแก๊สเคลื่อนที่แบบสุ่มและแพร่จากบริเวณที่เข้มข้น (ใกล้ลูกเหม็น) ไปทั่วตู้"
      - text: "เมื่อเปิดตู้ อนุภาคแพร่ออกมาถึงจมูก เราจึงได้กลิ่น"
    answer: "อนุภาคระเหิดจากผิวลูกเหม็นเป็นแก๊ส แล้วแพร่ไปทั่วตู้จนถึงจมูก"
  - type: worked-example
    title: น้ำแข็งในขวดมีปริมาตรเท่าใด
    problem: "แช่น้ำ 450 g ในขวดพลาสติกจนแข็งตัวหมด น้ำแข็งมีปริมาตรเท่าใด (ความหนาแน่นน้ำแข็ง $0.917\\ \\mathrm{g/cm^3}$)"
    steps:
      - text: "มวลไม่เปลี่ยนเมื่อเปลี่ยนสถานะ น้ำแข็งจึงมีมวล 450 g"
        why: "จำนวนอนุภาคเท่าเดิม แค่จัดเรียงใหม่"
      - text: "$V = \\dfrac{m}{\\rho} = \\dfrac{450}{0.917} = 490.7\\ \\mathrm{cm^3}$"
      - text: "เทียบกับน้ำเหลว $450\\ \\mathrm{cm^3}$ ขยายขึ้นราว $41\\ \\mathrm{cm^3}$ เพราะโมเลกุลในน้ำแข็งเรียงเป็นโครงที่มีช่องว่าง"
    answer: "ประมาณ $491\\ \\mathrm{cm^3}$"
  - { type: check, problem: chemistry.matter.particle-model.p006, prompt: "อุณหภูมิมีผลต่อความเร็วของอนุภาคอย่างไร" }
  - type: simulation
    title: การแพร่ของแก๊สสองชนิด (PhET Diffusion)
    url: https://phet.colorado.edu/en/simulations/diffusion
    provider: phet
    note: ปล่อยแก๊สสองชนิดไว้คนละฝั่งแล้วเอาผนังกั้นออก ลองเปลี่ยนอุณหภูมิและมวลของอนุภาค สังเกตว่าการแพร่เร็วขึ้นหรือช้าลง
  - type: simulation
    title: อนุภาคเมื่อให้และดึงความร้อน (PhET States of Matter)
    url: https://phet.colorado.edu/en/simulations/states-of-matter
    provider: phet
    note: เพิ่มหรือลดความร้อนแล้วดูการจัดเรียงและการเคลื่อนที่ของอนุภาคในแต่ละสถานะ
glossary:
  - { term: แบบจำลองอนุภาค, definition: แนวคิดว่าสสารประกอบด้วยอนุภาคเล็กมากที่มีแรงยึดเหนี่ยวกันและเคลื่อนที่อยู่ตลอดเวลา }
  - { term: แรงยึดเหนี่ยวระหว่างอนุภาค, definition: แรงดึงดูดที่ทำให้อนุภาคอยู่รวมกัน มากที่สุดในของแข็งและน้อยมากในแก๊ส }
  - { term: การแพร่, definition: การที่อนุภาคเคลื่อนที่แบบสุ่มจนกระจายจากบริเวณที่มีความเข้มข้นมากไปยังบริเวณที่มีความเข้มข้นน้อย }
  - { term: การเคลื่อนที่แบบบราวน์, definition: การเคลื่อนที่แบบสุ่มของอนุภาคเล็ก ๆ เช่น ควัน เพราะถูกโมเลกุลของแก๊สหรือของเหลวชนจากทุกทิศอย่างไม่เท่ากัน }
  - { term: ความดันแก๊ส, definition: ผลของอนุภาคแก๊สที่ชนผนังภาชนะตลอดเวลา }
  - { term: การระเหย, definition: การที่อนุภาคที่ผิวของเหลวหลุดออกไปเป็นแก๊สที่อุณหภูมิต่ำกว่าจุดเดือด ทำให้ของเหลวที่เหลือเย็นลง }
flashcards:
  - { front: "อนุภาคในของแข็ง ของเหลว แก๊ส เคลื่อนที่อย่างไร", back: "ของแข็ง: สั่นอยู่กับที่ · ของเหลว: ไถลผ่านกัน · แก๊ส: เคลื่อนที่เร็วอย่างอิสระทุกทิศ" }
  - { front: "ทำไมอุณหภูมิคงที่ขณะหลอมเหลวและเดือด", back: "พลังงานที่ได้รับใช้เอาชนะแรงยึดเหนี่ยวระหว่างอนุภาค ไม่ได้ทำให้อนุภาคเคลื่อนที่เร็วขึ้น" }
  - { front: "ทำไมน้ำแข็งลอยน้ำ", back: "โมเลกุลในน้ำแข็งเรียงเป็นโครงที่มีช่องว่าง ความหนาแน่น 0.917 g/cm³ น้อยกว่าน้ำ" }
  - { front: "การแพร่เร็วขึ้นเมื่อใด", back: "เมื่ออุณหภูมิสูงขึ้น และในแก๊สเร็วกว่าในของเหลว" }
  - { front: "หลักฐานว่าอนุภาคแก๊สเคลื่อนที่ตลอดเวลา", back: "การเคลื่อนที่แบบบราวน์ อนุภาคควันกระตุกไปมาเพราะโมเลกุลอากาศชน" }
