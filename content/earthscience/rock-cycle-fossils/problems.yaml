problems:
  - id: earthscience.geology.rock-cycle-fossils.p001
    topics: [earthscience.geology.rock-cycle-fossils]
    difficulty: 1
    type: mcq
    stem: "หินที่เกิดจากแมกมาหรือลาวาเย็นตัวและแข็งตัว เรียกว่าหินประเภทใด"
    choices:
      - { id: a, text: "หินอัคนี", correct: true }
      - { id: b, text: "หินตะกอน", feedback: "หินตะกอนเกิดจากตะกอนทับถมและอัดแน่น ไม่ได้เกิดจากหินหลอมเหลว" }
      - { id: c, text: "หินแปร", feedback: "หินแปรเกิดจากความร้อนและความดันโดยไม่หลอมละลาย" }
      - { id: d, text: "แร่", feedback: "แร่เป็นส่วนประกอบของหิน ไม่ใช่ประเภทของหิน" }
    hints:
      - "แมกมาคือหินหลอมเหลว"
      - "คำว่า อัคนี แปลว่า ไฟ"
    solution: "หินอัคนีเกิดจากแมกมาใต้ผิวโลกหรือลาวาบนผิวโลกเย็นตัวและแข็งตัว เช่น หินแกรนิต หินบะซอลต์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.rock-cycle-fossils.p002
    topics: [earthscience.geology.rock-cycle-fossils]
    difficulty: 1
    type: match
    stem: "จับคู่หินเดิมกับหินแปรที่เกิดเมื่อได้รับความร้อนและความดันสูง"
    pairs:
      - { left: "หินปูน", right: "หินอ่อน" }
      - { left: "หินดินดาน", right: "หินชนวน" }
      - { left: "หินทราย", right: "หินควอร์ตไซต์" }
      - { left: "หินแกรนิต", right: "หินไนส์" }
    hints:
      - "หินอ่อนมีแร่แคลไซต์เหมือนหินปูน"
      - "หินชนวนแตกเป็นแผ่นบางเหมือนหินดินดานที่เป็นชั้นบาง"
    solution: "หินปูนแปรเป็นหินอ่อน หินดินดานแปรเป็นหินชนวน หินทรายแปรเป็นหินควอร์ตไซต์ และหินแกรนิตแปรเป็นหินไนส์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.rock-cycle-fossils.p003
    topics: [earthscience.geology.rock-cycle-fossils]
    difficulty: 1
    type: match
    stem: "จับคู่หินหรือแร่กับการใช้ประโยชน์ในชีวิตประจำวัน"
    pairs:
      - { left: "แร่แกรไฟต์", right: "ไส้ดินสอ" }
      - { left: "แร่ทัลก์", right: "แป้งฝุ่น" }
      - { left: "แร่ควอตซ์ในทราย", right: "แก้ว" }
      - { left: "หินปูน", right: "ปูนซีเมนต์" }
    hints:
      - "แร่แกรไฟต์สีดำ ขีดบนกระดาษแล้วเป็นรอย"
      - "แร่ทัลก์นิ่มมาก บดเป็นผงลื่น"
    solution: "แกรไฟต์ทำไส้ดินสอ ทัลก์ทำแป้งฝุ่น ควอตซ์ในทรายใช้หลอมทำแก้ว และหินปูนใช้ผลิตปูนซีเมนต์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.rock-cycle-fossils.p004
    topics: [earthscience.geology.rock-cycle-fossils]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการเกิดซากดึกดำบรรพ์ของปลาในทะเลสาบ"
    items:
      - "ปลาตาย ซากจมลงก้นทะเลสาบ"
      - "ตะกอนฝังกลบซาก ส่วนที่นิ่มเน่าเปื่อยไป"
      - "ตะกอนกลายเป็นหิน แร่ค่อย ๆ แทนที่กระดูก"
      - "ชั้นหินถูกยกตัวและผุพัง ซากโผล่ให้เห็น"
    hints:
      - "ซากต้องถูกฝังก่อนจึงจะกลายเป็นหินได้"
      - "เราเห็นซากดึกดำบรรพ์เป็นขั้นสุดท้าย"
    solution: "ปลาตายจมลง → ตะกอนฝังกลบ ส่วนนิ่มเน่า → ตะกอนเป็นหิน แร่แทนที่กระดูก → ชั้นหินยกตัวและกร่อน ซากโผล่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.rock-cycle-fossils.p005
    topics: [earthscience.geology.rock-cycle-fossils]
    difficulty: 2
    type: mcq
    stem: "นักสำรวจพบซากหอยทะเลและปะการังในหินปูนบนยอดเขาแห่งหนึ่ง ข้อใดสรุปได้ดีที่สุด"
    choices:
      - { id: a, text: "บริเวณนี้เคยเป็นทะเลมาก่อน", correct: true }
      - { id: b, text: "หอยทะเลปีนขึ้นไปอยู่บนเขา", feedback: "หอยทะเลและปะการังอาศัยอยู่ในทะเลเท่านั้น ไม่ได้ขึ้นมาอยู่บนบก" }
      - { id: c, text: "นกคาบหอยมาทิ้งบนเขา", feedback: "ซากที่อยู่ในเนื้อหินปูนจำนวนมากพร้อมปะการัง แสดงว่าหินทั้งก้อนเกิดในทะเล" }
      - { id: d, text: "บริเวณนี้เคยเป็นทะเลทราย", feedback: "ทะเลทรายไม่มีหอยทะเลและปะการัง" }
    hints:
      - "หอยทะเลและปะการังอาศัยอยู่ที่ไหน"
      - "หินปูนเกิดจากอะไร"
    solution: "หอยทะเลและปะการังอยู่ในทะเล ซากที่อยู่ในเนื้อหินปูนแสดงว่าหินนี้เกิดในทะเล ต่อมาถูกยกตัวขึ้นเป็นภูเขา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.rock-cycle-fossils.p006
    topics: [earthscience.geology.rock-cycle-fossils]
    difficulty: 2
    type: mcq
    stem: "ภาพแสดงชั้นหินในหน้าผาแห่งหนึ่ง ชั้นหินไม่ถูกพลิกกลับ ชั้นใดเกิดก่อนและมีอายุมากที่สุด"
    figure: { src: p-rock-layers.svg, alt: "ชั้นหินสี่ชั้น จากบนลงล่าง ชั้น ง ดินและกรวดแม่น้ำ ชั้น ค หินทราย พบไม้กลายเป็นหิน ชั้น ข หินทรายแดง พบกระดูกและรอยเท้าไดโนเสาร์ ชั้น ก หินปูน พบซากหอยทะเลและปะการัง เป็นภาพสมมติ ชั้นหินไม่ถูกพลิกกลับ" }
    choices:
      - { id: a, text: "ชั้น ก", correct: true }
      - { id: b, text: "ชั้น ง", feedback: "ชั้นบนสุดทับถมทีหลังสุด จึงอายุน้อยที่สุด" }
      - { id: c, text: "ชั้น ข", feedback: "ชั้น ข ทับอยู่บนชั้น ก จึงเกิดทีหลังชั้น ก" }
      - { id: d, text: "ทุกชั้นอายุเท่ากัน", feedback: "ตะกอนทับถมทีละชั้น ชั้นที่ทับถมก่อนจึงอายุมากกว่า" }
    hints:
      - "ตะกอนทับถมจากล่างขึ้นบน"
      - "ชั้นที่ถูกทับอยู่ข้างใต้ต้องมีอยู่ก่อน"
    solution: "ตะกอนทับถมทีละชั้นจากล่างขึ้นบน ถ้าไม่ถูกพลิกกลับ ชั้นล่างสุดคือชั้น ก เกิดก่อนและอายุมากที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.rock-cycle-fossils.p007
    topics: [earthscience.geology.rock-cycle-fossils]
    difficulty: 2
    type: text
    stem: "หินอัคนีชนิดหนึ่งมีรูพรุนทั่วก้อน เบาจนลอยน้ำได้ เพราะลาวาที่มีแก๊สมากเย็นตัวเร็ว หินชนิดนี้ชื่อว่าอะไร"
    accepted: ["หินพัมมิส", "พัมมิส", "pumice", "หินภูเขาไฟ", "หินพัมมิซ"]
    misconceptions:
      - { match: "หินบะซอลต์", feedback: "หินบะซอลต์ก็เกิดจากลาวา แต่เนื้อแน่นและจมน้ำ" }
    hints:
      - "หินนี้ใช้ขัดส้นเท้าได้"
      - "ชื่อขึ้นต้นด้วย พัม"
    solution: "หินพัมมิส เกิดจากลาวาที่มีแก๊สมากเย็นตัวอย่างรวดเร็ว แก๊สติดอยู่เป็นรูพรุน หินจึงเบาจนลอยน้ำได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.rock-cycle-fossils.p008
    topics: [earthscience.geology.rock-cycle-fossils]
    difficulty: 3
    type: mcq
    stem: "กระดูกไดโนเสาร์ที่ภูเวียง จังหวัดขอนแก่น พบในหินทราย หินทรายแป้ง และหินโคลนของหมวดหินเสาขัว ทำไมซากดึกดำบรรพ์จึงมักพบในหินประเภทนี้"
    choices:
      - { id: a, text: "เป็นหินตะกอน เกิดจากตะกอนที่ฝังกลบซากโดยไม่ทำลายด้วยความร้อน", correct: true }
      - { id: b, text: "เป็นหินอัคนี ลาวาไหลมาห่อหุ้มกระดูก", feedback: "ลาวาร้อนมากจนเผาทำลายซาก ซากดึกดำบรรพ์จึงพบในหินอัคนีน้อยมาก" }
      - { id: c, text: "เป็นหินแปร ความดันช่วยรักษากระดูก", feedback: "ความร้อนและความดันที่ทำให้เกิดหินแปรมักทำให้ซากเสียรูปหรือหายไป" }
      - { id: d, text: "ไดโนเสาร์ชอบอยู่บนหินทราย", feedback: "ตอนไดโนเสาร์ยังมีชีวิต บริเวณนั้นยังเป็นตะกอนอยู่ ยังไม่เป็นหิน" }
    hints:
      - "หินทรายเกิดอย่างไร"
      - "การเกิดซากดึกดำบรรพ์ต้องมีการฝังกลบ"
    solution: "หินทรายเป็นหินตะกอน ตะกอนที่แม่น้ำพัดมาฝังกลบซากไดโนเสาร์ แล้วค่อย ๆ อัดแน่นเป็นหินโดยไม่ใช้ความร้อนสูง ซากจึงเก็บรักษาไว้ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.rock-cycle-fossils.p009
    topics: [earthscience.geology.rock-cycle-fossils]
    difficulty: 3
    type: mcq
    stem: "จากภาพชั้นหินเดิม (ก หินปูนมีซากหอยทะเลและปะการัง ข หินทรายแดงมีกระดูกและรอยเท้าไดโนเสาร์ ค หินทรายมีไม้กลายเป็นหิน ง ดินและกรวดแม่น้ำ) สภาพแวดล้อมของบริเวณนี้เปลี่ยนไปอย่างไร"
    figure: { src: p-rock-layers.svg, alt: "ชั้นหินสี่ชั้น จากบนลงล่าง ชั้น ง ดินและกรวดแม่น้ำ ชั้น ค หินทราย พบไม้กลายเป็นหิน ชั้น ข หินทรายแดง พบกระดูกและรอยเท้าไดโนเสาร์ ชั้น ก หินปูน พบซากหอยทะเลและปะการัง เป็นภาพสมมติ ชั้นหินไม่ถูกพลิกกลับ" }
    choices:
      - { id: a, text: "ทะเล → แผ่นดินที่ไดโนเสาร์อาศัย → ป่าและแม่น้ำ", correct: true }
      - { id: b, text: "ป่าและแม่น้ำ → แผ่นดินที่ไดโนเสาร์อาศัย → ทะเล", feedback: "เป็นการอ่านจากบนลงล่าง แต่ชั้นบนเกิดทีหลัง ต้องอ่านจากชั้นล่างขึ้นไป" }
      - { id: c, text: "เป็นทะเลตลอดเวลา", feedback: "รอยเท้าไดโนเสาร์และไม้ แสดงว่าบางช่วงเป็นแผ่นดิน" }
      - { id: d, text: "เป็นแผ่นดินตลอดเวลา", feedback: "ซากหอยทะเลและปะการังในชั้นล่างแสดงว่าเคยเป็นทะเล" }
    hints:
      - "อ่านจากชั้นล่างซึ่งเกิดก่อน ขึ้นไปชั้นบน"
      - "แต่ละชั้นมีซากที่บอกว่าเป็นทะเลหรือแผ่นดิน"
    solution: "ชั้น ก มีซากทะเล บริเวณนี้เคยเป็นทะเล ต่อมาชั้น ข มีรอยเท้าไดโนเสาร์ เป็นแผ่นดินแล้ว ชั้น ค มีไม้กลายเป็นหิน เป็นป่า และชั้น ง มีกรวดแม่น้ำ มีแม่น้ำไหลผ่าน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.rock-cycle-fossils.p010
    topics: [earthscience.geology.rock-cycle-fossils]
    difficulty: 3
    type: mcq
    stem: "หินแกรนิตมีผลึกแร่ขนาดใหญ่มองเห็นด้วยตาเปล่า แต่หินบะซอลต์มีผลึกเล็กมาก ทั้งที่เป็นหินอัคนีเหมือนกัน เพราะเหตุใด"
    choices:
      - { id: a, text: "แกรนิตเย็นตัวช้าลึกใต้ดิน ผลึกจึงมีเวลาโต ส่วนบะซอลต์เกิดจากลาวาที่เย็นตัวเร็วบนผิวโลก", correct: true }
      - { id: b, text: "แกรนิตเย็นตัวเร็วกว่า ผลึกจึงใหญ่กว่า", feedback: "กลับกัน ยิ่งเย็นตัวเร็ว ผลึกยิ่งมีเวลาโตน้อย" }
      - { id: c, text: "บะซอลต์ถูกบดจนผลึกแตก", feedback: "ผลึกเล็กตั้งแต่เกิด เพราะเย็นตัวเร็ว ไม่ได้ถูกบด" }
      - { id: d, text: "แกรนิตเป็นหินตะกอนจึงมีเม็ดใหญ่", feedback: "แกรนิตเป็นหินอัคนี ส่วนที่เห็นคือผลึกแร่ ไม่ใช่เม็ดตะกอน" }
    hints:
      - "ผลึกต้องใช้เวลาในการโต"
      - "แมกมาใต้ดินกับลาวาบนผิวโลก ที่ไหนเย็นตัวเร็วกว่า"
    solution: "แมกมาลึกใต้ดินถูกหินรอบ ๆ ห่อไว้ จึงเย็นตัวช้ามาก ผลึกมีเวลาโตจนใหญ่ ส่วนลาวาบนผิวโลกเย็นตัวเร็วในไม่กี่วันถึงหลายปี ผลึกจึงเล็ก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.rock-cycle-fossils.p011
    topics: [earthscience.geology.rock-cycle-fossils]
    difficulty: 3
    type: mcq
    stem: "ที่อำเภอบ้านตาก จังหวัดตาก พบท่อนไม้กลายเป็นหินขนาดใหญ่ฝังอยู่ใต้ชั้นกรวดที่กลมมน ซึ่งเป็นกรวดแม่น้ำ หลักฐานนี้บอกอะไรเกี่ยวกับสภาพแวดล้อมในอดีต"
    choices:
      - { id: a, text: "เคยมีป่าไม้ใหญ่ และมีแม่น้ำพัดพาท่อนไม้กับกรวดมาทับถม", correct: true }
      - { id: b, text: "เคยเป็นทะเลลึก", feedback: "ไม้และกรวดแม่น้ำบอกว่าเป็นแผ่นดินที่มีแม่น้ำ ไม่ใช่ทะเลลึก" }
      - { id: c, text: "เคยมีภูเขาไฟระเบิด", feedback: "ไม่มีหลักฐานลาวาหรือเถ้าภูเขาไฟในข้อมูลนี้" }
      - { id: d, text: "เคยเป็นทะเลทรายที่ไม่มีน้ำ", feedback: "ต้นไม้ใหญ่และกรวดแม่น้ำแสดงว่ามีน้ำมาก" }
    hints:
      - "ไม้กลายเป็นหินมาจากต้นไม้ที่เคยมีชีวิต"
      - "กรวดกลมมนเกิดจากการกลิ้งไปกับน้ำเป็นระยะทางไกล"
    solution: "ไม้กลายเป็นหินแสดงว่าเคยมีต้นไม้ใหญ่ และกรวดกลมมนที่ทับอยู่เป็นกรวดแม่น้ำ จึงคาดว่าแม่น้ำพัดพาท่อนไม้และกรวดมาทับถม แล้วแร่ซิลิกาค่อย ๆ แทนที่เนื้อไม้"
