    difficulty: 5
    type: mcq
    multiple: true
    stem: "ประโยค \"นักเรียนที่ตั้งใจเรียนสอบได้คะแนนดี\" ข้อใดถูกต้อง (เลือกให้ครบ)"
    choices:
