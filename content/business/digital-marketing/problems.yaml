problems:
- id: business.marketing.digital-marketing.p001
  topics:
  - business.marketing.digital-marketing
  difficulty: 1
  type: match
  stem: จับคู่ช่องทางการตลาดออนไลน์กับลักษณะ
  pairs:
  - left: โซเชียลมีเดีย
    right: โพสต์ภาพและคลิป สร้างการมีส่วนร่วม ลูกค้าแชร์ต่อได้
  - left: มาร์เก็ตเพลส
    right: ร้านค้าจำนวนมากรวมในแพลตฟอร์มเดียว ลูกค้าค้นหาและเทียบราคาได้
  - left: เครื่องมือค้นหา
    right: ลูกค้าพิมพ์คำค้นเมื่อมีความต้องการอยู่แล้ว
  - left: อีเมลหรือบัญชีแชตของร้าน
    right: ส่งข่าวถึงลูกค้าเดิมที่ยินยอมรับข่าวสาร
  hints:
  - คิดว่าลูกค้าเจอร้านเราด้วยวิธีใดในแต่ละช่องทาง
  - ช่องทางที่ร้านเป็นเจ้าของรายชื่อลูกค้าเองใช้กับลูกค้าเดิม
  solution: โซเชียลมีเดีย → เนื้อหาและการแชร์ · มาร์เก็ตเพลส → ร้านค้ารวมให้เทียบราคา · เครื่องมือค้นหา → ลูกค้าค้นเมื่อมีความต้องการ · อีเมล/แชตของร้าน → สื่อสารกับลูกค้าเดิมที่ยินยอม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.digital-marketing.p002
  topics:
  - business.marketing.digital-marketing
  difficulty: 1
  type: mcq
  stem: '**อัตราการคลิก** (CTR) ของโฆษณาหมายถึงอะไร'
  choices:
  - id: a
    text: ร้อยละของจำนวนครั้งที่โฆษณาแสดง ที่มีคนคลิก
    correct: true
  - id: b
    text: จำนวนเงินที่จ่ายต่อหนึ่งคลิก
    feedback: นั่นคือต้นทุนต่อคลิก (CPC)
  - id: c
    text: ร้อยละของผู้คลิกที่ซื้อสินค้า
    feedback: นั่นคืออัตราการเปลี่ยนเป็นผู้ซื้อ (conversion rate)
  - id: d
    text: จำนวนผู้ติดตามเพจ
    feedback: ผู้ติดตามไม่ได้วัดการคลิกโฆษณา
  hints:
  - CTR ย่อมาจาก click-through rate
  - ตัวหารคือจำนวนครั้งที่โฆษณาถูกแสดง
  solution: CTR $=$ จำนวนคลิก $\div$ จำนวนครั้งที่แสดง $\times 100$ บอกว่าโฆษณาน่าสนใจพอให้คนคลิกหรือไม่
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.digital-marketing.p003
  topics:
  - business.marketing.digital-marketing
  difficulty: 2
  type: numeric
  stem: ใช้ข้อมูลแคมเปญของร้านเสื้อผ้าออนไลน์ (สมมติ) ในภาพ **อัตราการคลิก** (CTR) เป็นกี่เปอร์เซ็นต์ (ตอบเป็น %)
  answer:
    value: 1.5
    tolerance: 0.015
    unit: '%'
  misconceptions:
  - match: 0.015
    feedback: ลืมคูณ 100
  - match: 0.075
    feedback: หารคำสั่งซื้อด้วยจำนวนครั้งที่แสดง นั่นไม่ใช่ CTR
  figure: &id001
    src: p-campaign.svg
    alt: ตารางสรุปแคมเปญโฆษณาออนไลน์ 1 เดือนของร้านขายเสื้อผ้าออนไลน์ (สมมติ) ค่าโฆษณา 9,000 บาท จำนวนครั้งที่แสดงโฆษณา 200,000 ครั้ง จำนวนคลิก 3,000 ครั้ง เพิ่มลงตะกร้า 600 ครั้ง คำสั่งซื้อ 150 รายการ (ลูกค้าใหม่ทั้งหมด) มูลค่าเฉลี่ยต่อคำสั่งซื้อ 350 บาท
  hints:
  - CTR $=$ คลิก $\div$ จำนวนครั้งที่แสดง $\times 100$
  - $3{,}000 \div 200{,}000$
  solution: CTR $= \dfrac{3{,}000}{200{,}000} \times 100 = 1.5\%$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.digital-marketing.p004
  topics:
  - business.marketing.digital-marketing
  difficulty: 2
  type: numeric
  stem: ใช้ข้อมูลแคมเปญของร้านเสื้อผ้าออนไลน์ (สมมติ) ในภาพ **อัตราการเปลี่ยนเป็นผู้ซื้อ** คิดจากผู้ที่คลิก เป็นกี่เปอร์เซ็นต์ (ตอบเป็น %)
  answer:
    value: 5
    unit: '%'
  misconceptions:
  - match: 0.075
    feedback: หารด้วยจำนวนครั้งที่แสดง โจทย์ให้คิดจากผู้ที่คลิก
  - match: 25
    feedback: หารด้วยจำนวนที่เพิ่มลงตะกร้า
  figure: *id001
  hints:
  - ตัวหารคือจำนวนคลิก (คนที่เข้ามาที่ร้าน)
  - $150 \div 3{,}000 \times 100$
  solution: อัตราการเปลี่ยนเป็นผู้ซื้อ $= \dfrac{150}{3{,}000} \times 100 = 5\%$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.digital-marketing.p005
  topics:
  - business.marketing.digital-marketing
  difficulty: 2
  type: numeric
  stem: ใช้ข้อมูลแคมเปญของร้านเสื้อผ้าออนไลน์ (สมมติ) ในภาพ **ต้นทุนต่อคลิก** (CPC) เป็นกี่บาท (ตอบเป็นบาท)
  answer:
    value: 3
    unit: บาท
  misconceptions:
  - match: 60
    feedback: หารด้วยจำนวนคำสั่งซื้อ นั่นคือต้นทุนต่อการได้ลูกค้า
  - match: 0.045
    feedback: หารด้วยจำนวนครั้งที่แสดง
  figure: *id001
  hints:
  - CPC $=$ ค่าโฆษณา $\div$ จำนวนคลิก
  - $9{,}000 \div 3{,}000$
  solution: CPC $= 9{,}000 \div 3{,}000 = 3$ บาทต่อคลิก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.digital-marketing.p006
  topics:
  - business.marketing.digital-marketing
  difficulty: 3
  type: numeric
  stem: ใช้ข้อมูลแคมเปญของร้านเสื้อผ้าออนไลน์ (สมมติ) ในภาพ ถ้าคำสั่งซื้อทั้งหมดมาจากลูกค้าใหม่ **ต้นทุนต่อการได้ลูกค้าหนึ่งราย** (CAC) เป็นกี่บาท (ตอบเป็นบาท)
  answer:
    value: 60
    unit: บาท
  misconceptions:
  - match: 3
    feedback: นั่นคือต้นทุนต่อคลิก
  - match: 15
    feedback: หารด้วยจำนวนที่เพิ่มลงตะกร้า
  figure: *id001
  hints:
  - CAC $=$ ค่าการตลาด $\div$ จำนวนลูกค้าใหม่
  - $9{,}000 \div 150$
  solution: CAC $= 9{,}000 \div 150 = 60$ บาทต่อลูกค้าใหม่หนึ่งราย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.digital-marketing.p007
  topics:
  - business.marketing.digital-marketing
  difficulty: 3
  type: numeric
  stem: ใช้ข้อมูลแคมเปญของร้านเสื้อผ้าออนไลน์ (สมมติ) ในภาพ **ผลตอบแทนจากค่าโฆษณา** (ROAS $=$ ยอดขายที่เกิดจากโฆษณา $\div$ ค่าโฆษณา) เป็นกี่เท่า (ตอบเป็นเท่า ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 5.833333
    tolerance: 0.05
    unit: เท่า
  misconceptions:
  - match: 0.171429
    feedback: หารกลับด้าน
  - match: 2.333333
    feedback: ใช้กำไรขั้นต้น ROAS ใช้ยอดขาย
  figure: *id001
  hints:
  - ยอดขาย $=$ จำนวนคำสั่งซื้อ $\times$ มูลค่าเฉลี่ยต่อคำสั่งซื้อ
  - $52{,}500 \div 9{,}000$
  solution: ยอดขาย $= 150 \times 350 = 52{,}500$ บาท ROAS $= 52{,}500 \div 9{,}000 \approx 5.83$ เท่า ยอดขายยังไม่ใช่กำไร ต้องหักต้นทุนสินค้าด้วย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.digital-marketing.p008
  topics:
  - business.marketing.digital-marketing
  difficulty: 3
  type: order
  stem: เรียงขั้นของกรวยการขายออนไลน์จากกว้างไปแคบ
  items:
  - เห็นโฆษณาหรือโพสต์ (การรับรู้)
  - คลิกเข้ามาดูสินค้า (ความสนใจ)
  - เพิ่มสินค้าลงตะกร้า (ความต้องการ)
  - ชำระเงินสั่งซื้อ (การซื้อ)
  - กลับมาซื้อซ้ำและบอกต่อ (ความภักดี)
  hints:
  - คนจำนวนมากที่สุดอยู่ขั้นบนสุด
  - ทุกขั้นมีคนหลุดออกไปบางส่วน
  solution: การรับรู้ → สนใจ (คลิก) → ต้องการ (ใส่ตะกร้า) → ซื้อ → ภักดี (ซื้อซ้ำ บอกต่อ) แต่ละขั้นวัดได้ด้วยตัวชี้วัดต่างกัน เช่น จำนวนครั้งที่แสดง CTR อัตราการเปลี่ยนเป็นผู้ซื้อ อัตราการซื้อซ้ำ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.digital-marketing.p009
  topics:
  - business.marketing.digital-marketing
  difficulty: 3
  type: mcq
  stem: ลูกค้ารีวิวร้านในกลุ่มโซเชียลมีเดียด้วยตัวเองโดยร้านไม่ได้จ่ายเงิน จัดเป็นสื่อประเภทใด
  choices:
  - id: a
    text: สื่อที่ได้มา (earned media)
    correct: true
  - id: b
    text: สื่อที่จ่ายเงิน (paid media)
    feedback: ร้านไม่ได้จ่ายเงินให้ลูกค้าเขียน
  - id: c
    text: สื่อที่เป็นเจ้าของ (owned media)
    feedback: สื่อที่เป็นเจ้าของคือเว็บไซต์ เพจ หรือบัญชีของร้านเอง
  - id: d
    text: ไม่ใช่การตลาดเลย
    feedback: คำบอกต่อเป็นการตลาดที่มีพลังมาก
  hints:
  - ใครเป็นผู้สร้างเนื้อหาและใครจ่ายเงิน
  - สื่อแบ่งเป็นจ่ายเงิน เป็นเจ้าของ และได้มา
  solution: รีวิวและการแชร์ที่ลูกค้าทำเองเป็น **สื่อที่ได้มา** น่าเชื่อถือแต่ควบคุมไม่ได้ สื่อที่จ่ายเงินคือโฆษณา สื่อที่เป็นเจ้าของคือช่องทางของร้านเอง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.digital-marketing.p010
  topics:
  - business.marketing.digital-marketing
  difficulty: 4
  type: numeric
  stem: ร้านเสื้อผ้าออนไลน์ (สมมติ) มีมูลค่าเฉลี่ยต่อคำสั่งซื้อ $350$ บาท กำไรขั้นต้น $40\%$ ลูกค้าซื้อเฉลี่ยปีละ $4$ ครั้ง และเป็นลูกค้าเฉลี่ย $2$ ปี **มูลค่าลูกค้าตลอดอายุ** (คิดจากกำไรขั้นต้น ไม่คิดมูลค่าเงินตามเวลา) เป็นกี่บาท (ตอบเป็นบาท)
  answer:
    value: 1120
    unit: บาท
  misconceptions:
  - match: 2800
    feedback: ใช้ยอดขายแทนกำไรขั้นต้น ลูกค้าคืนเงินให้ร้านได้เพียงส่วนที่เป็นกำไร
  - match: 560
    feedback: ลืมคูณจำนวนปี
  hints:
  - กำไรขั้นต้นต่อคำสั่งซื้อ $= 350 \times 40\%$
  - CLV $=$ กำไรต่อคำสั่งซื้อ $\times$ ครั้งต่อปี $\times$ จำนวนปี
  solution: กำไรต่อคำสั่งซื้อ $= 350 \times 0.4 = 140$ บาท CLV $= 140 \times 4 \times 2 = 1{,}120$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.digital-marketing.p011
  topics:
  - business.marketing.digital-marketing
  difficulty: 4
  type: numeric
  stem: จากแคมเปญ อัตราการเปลี่ยนเป็นผู้ซื้อ $5\%$ ของผู้คลิก แต่ละคำสั่งซื้อให้กำไรขั้นต้น $140$ บาท (คิดเฉพาะการซื้อครั้งแรก) ร้านจ่าย **ต้นทุนต่อคลิกได้สูงสุดกี่บาท** จึงไม่ขาดทุน (ตอบเป็นบาท)
  answer:
    value: 7
    unit: บาท
  misconceptions:
  - match: 17.5
    feedback: ใช้ยอดขายต่อคำสั่งซื้อ (350 บาท) ต้องใช้กำไรขั้นต้น
  - match: 140
    feedback: ไม่ใช่ทุกคลิกที่ซื้อ
  hints:
  - ทุก $100$ คลิกได้ผู้ซื้อกี่คน และได้กำไรขั้นต้นรวมเท่าไร
  - CPC สูงสุด $=$ อัตราการเปลี่ยนเป็นผู้ซื้อ $\times$ กำไรต่อคำสั่งซื้อ
  solution: $100$ คลิก ได้ผู้ซื้อ $5$ คน กำไรขั้นต้น $5 \times 140 = 700$ บาท จ่ายค่าคลิกได้ไม่เกิน $700 \div 100 = 7$ บาทต่อคลิก (หรือ $0.05 \times 140$)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.digital-marketing.p012
  topics:
  - business.marketing.digital-marketing
  difficulty: 4
  type: numeric
  stem: ร้านทดลองแบบ A/B สองหน้าสินค้า แบ่งผู้เข้าชมแบบสุ่ม หน้า A มีผู้เข้าชม $4{,}000$ คน ซื้อ $120$ คน หน้า B มีผู้เข้าชม $4{,}000$ คน ซื้อ $160$ คน อัตราการเปลี่ยนเป็นผู้ซื้อของ B สูงกว่า A **กี่เปอร์เซ็นต์ (เทียบกับ A)** (ตอบเป็น %)
  answer:
    value: 33.333333
    tolerance: 0.3
    unit: '%'
  misconceptions:
  - match: 1
    feedback: นั่นคือผลต่างเป็นจุดเปอร์เซ็นต์ โจทย์ถามเพิ่มขึ้นกี่เปอร์เซ็นต์เทียบกับ A
  - match: 25
    feedback: หารด้วยอัตราของ B ต้องเทียบกับ A
  hints:
  - 'หาอัตราของแต่ละหน้าก่อน: $3\%$ และ $4\%$'
  - เพิ่มขึ้นกี่เปอร์เซ็นต์ $= \dfrac{4 - 3}{3} \times 100$
  solution: A $= 120 \div 4{,}000 = 3\%$ B $= 160 \div 4{,}000 = 4\%$ เพิ่มขึ้น $1$ จุดเปอร์เซ็นต์ หรือ $\dfrac{1}{3} \times 100 \approx 33.3\%$ เมื่อเทียบกับ A
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.digital-marketing.p013
  topics:
  - business.marketing.digital-marketing
  difficulty: 4
  type: mcq
  stem: ร้านต้องการทดลองแบบ A/B ว่าภาพสินค้าแบบใหม่ทำให้คนซื้อมากขึ้นหรือไม่ ข้อใดเป็น **วิธีที่ถูกต้อง** เลือกทุกข้อที่ถูก
  multiple: true
  choices:
  - id: a
    text: เปลี่ยนเฉพาะภาพ ส่วนอื่น เช่น ราคาและข้อความ เหมือนเดิม
    correct: true
  - id: b
    text: สุ่มแบ่งผู้เข้าชมไปแต่ละแบบในช่วงเวลาเดียวกัน
    correct: true
  - id: c
    text: เก็บข้อมูลให้มากพอก่อนสรุป ไม่ตัดสินจากคนไม่กี่คน
    correct: true
  - id: d
    text: ใช้ภาพเก่าเดือนนี้ ภาพใหม่เดือนหน้า แล้วเทียบยอดขาย
    feedback: สองเดือนต่างกันหลายอย่าง เช่น เทศกาล วันเงินเดือนออก จึงสรุปไม่ได้ว่าเป็นเพราะภาพ
  - id: e
    text: เปลี่ยนภาพพร้อมลดราคาในแบบใหม่
    feedback: เปลี่ยนสองอย่างพร้อมกัน จะไม่รู้ว่าผลมาจากอะไร
  hints:
  - การทดลองที่ดีต้องเทียบอย่างยุติธรรม
  - ถ้าต่างกันหลายอย่าง จะรู้ได้อย่างไรว่าผลมาจากภาพ
  solution: การทดลองแบบ A/B ที่ดีเปลี่ยนทีละอย่าง สุ่มผู้เข้าชมในช่วงเวลาเดียวกัน และเก็บข้อมูลมากพอ (ผลต่างเล็กน้อยจากคนไม่กี่คนอาจเกิดจากความบังเอิญ)
