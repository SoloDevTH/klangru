<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="sans-serif">
<title>ท่องจำบทร้อยกรองทีละวรรคด้วยสัมผัส</title>
<defs></defs>
<rect x="0" y="0" width="860" height="470" fill="#fff"/>
<text x="20.0" y="34.0" font-size="21" text-anchor="start" fill="#1f5fbf" font-weight="bold">ท่องทีละวรรค ใช้คำสัมผัสช่วยจำ</text>
<text x="40" y="90" font-size="24"><tspan fill="#111" font-weight="normal">ถึงบางพูดพูดดีเป็นศรี</tspan><tspan fill="#c0392b" font-weight="bold">ศักดิ์</tspan></text>
<text x="460" y="90" font-size="24"><tspan fill="#111" font-weight="normal">มีคน</tspan><tspan fill="#c0392b" font-weight="bold">รัก</tspan><tspan fill="#111" font-weight="normal">รสถ้อยอร่อย</tspan><tspan fill="#1e8449" font-weight="bold">จิต</tspan></text>
<text x="40" y="160" font-size="24"><tspan fill="#111" font-weight="normal">แม้นพูดชั่วตัวตายทำลาย</tspan><tspan fill="#1e8449" font-weight="bold">มิตร</tspan></text>
<text x="460" y="160" font-size="24"><tspan fill="#111" font-weight="normal">จะชอบ</tspan><tspan fill="#1e8449" font-weight="bold">ผิด</tspan><tspan fill="#111" font-weight="normal">ในมนุษย์เพราะพูดจา</tspan></text>
<text x="40.0" y="198.0" font-size="15" text-anchor="start" fill="#666" font-weight="normal">สุนทรภู่ นิราศภูเขาทอง</text>
<text x="840.0" y="198.0" font-size="15" text-anchor="end" fill="#666" font-weight="normal">สีเดียวกัน = คำที่สัมผัสกัน (ศักดิ์–รัก · จิต–มิตร–ผิด)</text>
<line x1="20.0" y1="215.0" x2="840.0" y2="215.0" stroke="#ddd" stroke-width="1.5" stroke-linecap="round"/>
<rect x="20.0" y="240.0" width="260.0" height="85.0" rx="12" fill="#eaf2fb" stroke="#1f5fbf" stroke-width="1.8"/>
<circle cx="52.0" cy="282.0" r="20.0" fill="#1f5fbf" stroke="#1f5fbf" stroke-width="1.5"/>
<text x="52.0" y="289.0" font-size="20" text-anchor="middle" fill="#fff" font-weight="bold">1</text>
<text x="82.0" y="289.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">อ่านให้เข้าใจความหมาย</text>
<rect x="300.0" y="240.0" width="260.0" height="85.0" rx="12" fill="#eaf2fb" stroke="#1f5fbf" stroke-width="1.8"/>
<circle cx="332.0" cy="282.0" r="20.0" fill="#1f5fbf" stroke="#1f5fbf" stroke-width="1.5"/>
<text x="332.0" y="289.0" font-size="20" text-anchor="middle" fill="#fff" font-weight="bold">2</text>
<text x="362.0" y="289.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">แบ่งท่องทีละวรรค</text>
<rect x="580.0" y="240.0" width="260.0" height="85.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<circle cx="612.0" cy="282.0" r="20.0" fill="#1f5fbf" stroke="#1f5fbf" stroke-width="1.5"/>
<text x="612.0" y="289.0" font-size="20" text-anchor="middle" fill="#fff" font-weight="bold">3</text>
<text x="642.0" y="289.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">ใช้คำสัมผัสช่วยจำ</text>
<rect x="20.0" y="345.0" width="260.0" height="85.0" rx="12" fill="#eaf2fb" stroke="#1f5fbf" stroke-width="1.8"/>
<circle cx="52.0" cy="387.0" r="20.0" fill="#1f5fbf" stroke="#1f5fbf" stroke-width="1.5"/>
<text x="52.0" y="394.0" font-size="20" text-anchor="middle" fill="#fff" font-weight="bold">4</text>
<text x="82.0" y="394.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">ปิดหนังสือแล้วท่อง</text>
<rect x="300.0" y="345.0" width="260.0" height="85.0" rx="12" fill="#eaf2fb" stroke="#1f5fbf" stroke-width="1.8"/>
<circle cx="332.0" cy="387.0" r="20.0" fill="#1f5fbf" stroke="#1f5fbf" stroke-width="1.5"/>
<text x="332.0" y="394.0" font-size="20" text-anchor="middle" fill="#fff" font-weight="bold">5</text>
<text x="362.0" y="394.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">ท่องซ้ำหลายวัน</text>
<rect x="580.0" y="345.0" width="260.0" height="85.0" rx="12" fill="#eaf2fb" stroke="#1f5fbf" stroke-width="1.8"/>
<circle cx="612.0" cy="387.0" r="20.0" fill="#1f5fbf" stroke="#1f5fbf" stroke-width="1.5"/>
<text x="612.0" y="394.0" font-size="20" text-anchor="middle" fill="#fff" font-weight="bold">6</text>
<text x="642.0" y="394.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">ท่องให้คนอื่นฟัง</text>
</svg>
