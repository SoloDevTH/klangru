    stem: "ทางโค้งรัศมี $80\\ \\mathrm{m}$ ยกขอบให้ผิวถนนเอียงทำมุม $\\theta$ กับแนวราบ โดย $\\tan\\theta = 0.25$ ดังรูป รถต้องวิ่งด้วยอัตราเร็วเท่าใดจึงเลี้ยวได้โดยไม่ต้องอาศัยแรงเสียดทานเลย ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย m/s)"
