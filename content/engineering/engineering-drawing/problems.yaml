problems:
  - id: engineering.drawing.engineering-drawing.p001
    topics: [engineering.drawing.engineering-drawing]
    difficulty: 1
    type: mcq
    stem: "ในภาพด้านหน้าของชิ้นงาน มีเส้นประแนวตั้งสองเส้น เส้นประนี้หมายถึงอะไร"
    choices:
      - { id: a, text: "ขอบที่อยู่ภายในหรือด้านหลัง ซึ่งมองไม่เห็นจากทิศที่มอง", correct: true }
      - { id: b, text: "เส้นศูนย์กลางของรู", feedback: "เส้นศูนย์กลางใช้เส้นลูกโซ่บาง (ขีดยาวสลับขีดสั้น) ไม่ใช่เส้นประ" }
      - { id: c, text: "ขอบที่มองเห็นแต่เขียนยังไม่เสร็จ", feedback: "ขอบที่มองเห็นเขียนด้วยเส้นเต็มหนาเสมอ เส้นประมีความหมายเฉพาะ" }
      - { id: d, text: "แนวที่ตัดชิ้นงานเพื่อทำภาพตัด", feedback: "แนวตัดใช้เส้นลูกโซ่ปลายหนาพร้อมลูกศร" }
    hints:
      - "เส้นแต่ละแบบในแบบวิศวกรรมมีความหมายเฉพาะ"
      - "ถ้าขอบถูกเนื้อวัสดุบังไว้ จะแสดงอย่างไร"
    solution: "เส้นประ (hidden line) แสดงขอบที่ถูกบัง เช่น ผนังของรูที่อยู่ภายในเนื้อชิ้นงาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.drawing.engineering-drawing.p002
    topics: [engineering.drawing.engineering-drawing]
    difficulty: 1
    type: match
    stem: "จับคู่ชนิดของเส้นกับการใช้งาน"
    pairs:
      - { left: "เส้นเต็มหนา", right: "ขอบที่มองเห็น" }
      - { left: "เส้นประ", right: "ขอบที่ถูกบัง" }
      - { left: "เส้นลูกโซ่บาง", right: "เส้นศูนย์กลางของรูและแกนสมมาตร" }
      - { left: "เส้นเต็มบางเอียง 45° เรียงกัน", right: "ลายตัดบนเนื้อวัสดุในภาพตัด" }
    hints:
      - "เส้นที่หนาที่สุดใช้กับสิ่งที่สำคัญที่สุด คือรูปร่างที่เห็น"
      - "เส้นลูกโซ่บางคือขีดยาวสลับขีดสั้น"
    solution: "เส้นเต็มหนาเป็นขอบที่เห็น เส้นประเป็นขอบที่ถูกบัง เส้นลูกโซ่บางเป็นเส้นศูนย์กลาง และเส้นบางเอียง 45° เป็นลายตัดในภาพตัด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.drawing.engineering-drawing.p003
    topics: [engineering.drawing.engineering-drawing]
    difficulty: 2
    type: numeric
    stem: "แบบแปลนบ้านมาตราส่วน 1:100 วัดความยาวห้องนอนในแบบได้ $42\\ \\mathrm{mm}$ ห้องนอนจริงยาวกี่เมตร"
    answer: { value: 4.2, tolerance: 0.02, unit: m }
    misconceptions:
      - { match: 0.42, feedback: "แปลงหน่วยผิด $42 \\times 100 = 4200\\ \\mathrm{mm}$ ซึ่งเท่ากับ $4.2\\ \\mathrm{m}$" }
      - { match: 42, feedback: "คูณ 100 แล้วได้มิลลิเมตร ต้องหาร 1000 อีกครั้งเพื่อเป็นเมตร" }
    hints:
      - "1:100 หมายถึง $1\\ \\mathrm{mm}$ ในแบบแทน $100\\ \\mathrm{mm}$ จริง"
      - "คูณ 100 แล้วแปลงมิลลิเมตรเป็นเมตร"
    solution: "$42 \\times 100 = 4200\\ \\mathrm{mm} = 4.2\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.drawing.engineering-drawing.p004
    topics: [engineering.drawing.engineering-drawing]
    difficulty: 2
    type: numeric
    stem: "แบบชิ้นส่วนนาฬิกาเขียนขยายด้วยมาตราส่วน 2:1 วัดความยาวเฟืองในแบบได้ $36\\ \\mathrm{mm}$ เฟืองจริงยาวกี่มิลลิเมตร"
    answer: { value: 18, tolerance: 0.1, unit: mm }
    misconceptions:
      - { match: 72, feedback: "มาตราส่วน 2:1 คือภาพขยาย ภาพใหญ่กว่าของจริง ต้องหาร 2 ไม่ใช่คูณ 2" }
    hints:
      - "ตัวเลขแรกของมาตราส่วนคือขนาดในแบบ ตัวเลขหลังคือขนาดจริง"
      - "ขนาดในแบบ : ขนาดจริง = 2 : 1"
    solution: "ขนาดจริง $= 36 \\times \\tfrac12 = 18\\ \\mathrm{mm}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.drawing.engineering-drawing.p005
    topics: [engineering.drawing.engineering-drawing]
    difficulty: 2
    type: mcq
    stem: "ในระบบภาพฉายมุมที่หนึ่ง ภาพด้านบนวางไว้ที่ใดเมื่อเทียบกับภาพด้านหน้า"
    choices:
      - { id: a, text: "ใต้ภาพด้านหน้า", correct: true }
      - { id: b, text: "เหนือภาพด้านหน้า", feedback: "นี่คือการวางของระบบมุมที่สาม" }
      - { id: c, text: "ทางซ้ายของภาพด้านหน้า", feedback: "ทางซ้ายของภาพด้านหน้าในมุมที่หนึ่งคือภาพด้านขวา" }
      - { id: d, text: "วางที่ใดก็ได้ ขอให้มีชื่อกำกับ", feedback: "ตำแหน่งของภาพมีความหมาย ผู้อ่านใช้ตำแหน่งบอกว่าเป็นภาพด้านใด" }
    hints:
      - "มุมที่หนึ่ง: ภาพที่ได้จากการมองด้านใด จะวางอยู่ฝั่งตรงข้าม"
      - "มองจากด้านบน ภาพจึงไปอยู่ด้านล่าง"
    solution: "ในภาพฉายมุมที่หนึ่ง วัตถุอยู่ระหว่างผู้มองกับระนาบฉาย ภาพที่มองจากด้านบนจึงตกลงบนระนาบด้านล่างและวางใต้ภาพด้านหน้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.drawing.engineering-drawing.p006
    topics: [engineering.drawing.engineering-drawing]
    difficulty: 2
    type: mcq
    stem: "ภาพฉายใดแสดงความลึกและความสูงของชิ้นงาน"
    choices:
      - { id: a, text: "ภาพด้านข้าง", correct: true }
      - { id: b, text: "ภาพด้านหน้า", feedback: "ภาพด้านหน้าแสดงความยาวกับความสูง ความลึกพุ่งเข้าหาผู้มองจึงไม่ปรากฏ" }
      - { id: c, text: "ภาพด้านบน", feedback: "ภาพด้านบนแสดงความยาวกับความลึก ไม่เห็นความสูง" }
      - { id: d, text: "ทุกภาพแสดงครบทั้งสามมิติ", feedback: "ภาพฉายออร์โทกราฟิกแต่ละภาพแสดงได้เพียงสองมิติ จึงต้องใช้หลายภาพ" }
    hints:
      - "แต่ละภาพแสดงสองมิติ มิติที่พุ่งเข้าหาผู้มองจะหายไป"
      - "มองจากด้านข้าง มิติใดพุ่งเข้าหาเรา"
    solution: "มองจากด้านข้าง ความยาวพุ่งเข้าหาผู้มอง จึงเหลือความลึก (แนวนอน) และความสูง (แนวตั้ง)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.drawing.engineering-drawing.p007
    topics: [engineering.drawing.engineering-drawing]
    difficulty: 3
    type: numeric
    stem: "แบบกำหนดขนาด $25^{+0.2}_{-0.1}\\ \\mathrm{mm}$ ค่าพิกัดความเผื่อ (ขนาดใหญ่สุด − ขนาดเล็กสุด) เป็นกี่มิลลิเมตร"
    answer: { value: 0.3, tolerance: 0.001, unit: mm }
    misconceptions:
      - { match: 0.1, feedback: "นำ $0.2 - 0.1$ มาลบกัน แต่ค่าล่างเป็น $-0.1$ จึงต้องเป็น $0.2 - (-0.1)$" }
      - { match: 0.2, feedback: "นี่คือค่าเผื่อด้านบนอย่างเดียว ต้องรวมค่าเผื่อด้านล่างด้วย" }
    hints:
      - "หาขนาดใหญ่สุดและเล็กสุดก่อน"
      - "ใหญ่สุด $25 + 0.2$ เล็กสุด $25 - 0.1$"
    solution: "ใหญ่สุด $25.2$ เล็กสุด $24.9$ พิกัดความเผื่อ $25.2 - 24.9 = 0.3\\ \\mathrm{mm}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.drawing.engineering-drawing.p008
    topics: [engineering.drawing.engineering-drawing]
    difficulty: 3
    type: numeric
    stem: "โรงงานผลิตชิ้นส่วนในนิคมอุตสาหกรรมแห่งหนึ่ง (ค่าสมมติ) เจาะรูขนาด $20.000$ ถึง $20.021\\ \\mathrm{mm}$ และกลึงเพลาขนาด $19.980$ ถึง $19.993\\ \\mathrm{mm}$ ระยะช่องว่างมากสุดระหว่างเพลากับรูเป็นกี่มิลลิเมตร"
    answer: { value: 0.041, tolerance: 0.0005, unit: mm }
    misconceptions:
      - { match: 0.028, feedback: "ใช้รูใหญ่สุดลบเพลาใหญ่สุด ช่องว่างมากสุดต้องใช้เพลาเล็กสุด" }
      - { match: 0.007, feedback: "นี่คือระยะช่องว่างน้อยสุด (รูเล็กสุด − เพลาใหญ่สุด)" }
    hints:
      - "ช่องว่างกว้างที่สุดเมื่อรูใหญ่ที่สุดและเพลาเล็กที่สุด"
      - "รูใหญ่สุด − เพลาเล็กสุด"
    solution: "$20.021 - 19.980 = 0.041\\ \\mathrm{mm}$ (ช่องว่างน้อยสุด $20.000 - 19.993 = 0.007\\ \\mathrm{mm}$ ทั้งคู่เป็นบวก จึงเป็นการสวมคลอน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.drawing.engineering-drawing.p009
    topics: [engineering.drawing.engineering-drawing]
    difficulty: 3
    type: numeric
    stem: "จากภาพฉายสามด้านของชิ้นงานเหล็ก (หน่วยมิลลิเมตร) จงหาปริมาตรของชิ้นงานเป็นลูกบาศก์เซนติเมตร"
    figure: { src: p-stepped-block.svg, alt: "ภาพฉายมุมที่หนึ่งสามภาพ ภาพด้านหน้าเป็นรูปตัวแอล ยาวทั้งหมด 80 สูงทั้งหมด 45 ส่วนฐานสูง 20 ส่วนที่ยกสูงอยู่ทางซ้ายยาว 40 ภาพด้านบนวางใต้ภาพด้านหน้าเป็นสี่เหลี่ยม 80 คูณ 50 มีเส้นแบ่งเป็นสี่เหลี่ยมเล็กที่มุมซ้ายล่าง ยาว 40 และลึก 30 วัดจากขอบล่าง (ด้านหน้า) ภาพด้านขวาวางทางซ้ายเป็นสี่เหลี่ยมฐานกว้าง 50 สูง 20 และมีสี่เหลี่ยมเล็กกว้าง 30 อยู่บนฐานด้านซ้าย" }
    answer: { value: 110, tolerance: 0.5, unit: cm³ }
    misconceptions:
      - { match: 130, feedback: "คิดว่าส่วนที่ยกสูงลึกเต็ม 50 mm ภาพด้านบนบอกว่าส่วนนี้ลึกเพียง 30 mm" }
      - { match: 180, feedback: "นี่คือปริมาตรของกล่องที่ครอบทั้งชิ้น ต้องแยกเป็นฐานกับส่วนที่ยกสูง" }
    hints:
      - "แยกชิ้นงานเป็นกล่องสองก้อน: ฐาน และส่วนที่ยกสูง"
      - "ฐาน $80 \\times 50 \\times 20$ ส่วนยกสูงยาว 40 สูง $45 - 20$ และลึกเท่าที่เห็นในภาพด้านบน"
    solution: "ฐาน $80 \\times 50 \\times 20 = 80\\,000\\ \\mathrm{mm^3}$ ส่วนยกสูง $40 \\times 30 \\times 25 = 30\\,000\\ \\mathrm{mm^3}$ รวม $110\\,000\\ \\mathrm{mm^3} = 110\\ \\mathrm{cm^3}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.drawing.engineering-drawing.p010
    topics: [engineering.drawing.engineering-drawing]
    difficulty: 3
    type: mcq
    stem: "จากภาพฉายสามด้าน ชิ้นงานนี้มีลักษณะใด"
    figure: { src: p-hole-block.svg, alt: "ภาพฉายมุมที่หนึ่งของแท่งสี่เหลี่ยม ภาพด้านหน้าเป็นสี่เหลี่ยมผืนผ้า มีเส้นประแนวตั้งสองเส้นลากจากขอบบนถึงขอบล่าง และเส้นลูกโซ่บางตรงกลาง ภาพด้านบนเป็นสี่เหลี่ยมผืนผ้ามีวงกลมเส้นเต็มหนาตรงกลางพร้อมเส้นลูกโซ่ตัดกันที่ศูนย์กลาง ภาพด้านขวาเป็นสี่เหลี่ยมผืนผ้ามีเส้นประแนวตั้งสองเส้นจากขอบบนถึงขอบล่างเช่นกัน" }
    choices:
      - { id: a, text: "แท่งสี่เหลี่ยมที่มีรูกลมเจาะทะลุในแนวดิ่ง", correct: true }
      - { id: b, text: "แท่งสี่เหลี่ยมที่มีรูกลมลึกเพียงครึ่งหนึ่ง", feedback: "เส้นประลากตลอดจากขอบบนถึงขอบล่าง รูจึงทะลุ ถ้าลึกครึ่งเดียวเส้นประจะหยุดกลางทางและมีเส้นประแนวนอนที่ก้นรู" }
      - { id: c, text: "แท่งสี่เหลี่ยมที่มีแท่งกลมยื่นขึ้นด้านบน", feedback: "ถ้ามีแท่งยื่นขึ้น ภาพด้านหน้าจะมีเส้นเต็มหนาเป็นสี่เหลี่ยมเล็กเหนือขอบบน ไม่ใช่เส้นประภายใน" }
      - { id: d, text: "แท่งสี่เหลี่ยมที่มีร่องผ่ากลางตลอดความยาว", feedback: "ร่องจะเห็นในภาพด้านบนเป็นเส้นตรงสองเส้นตลอดความยาว ไม่ใช่วงกลม" }
    hints:
      - "วงกลมในภาพด้านบนบอกรูปร่างหน้าตัด เส้นประบอกว่าสิ่งนั้นอยู่ภายในเนื้อวัสดุ"
      - "ดูว่าเส้นประเริ่มและสิ้นสุดที่ใด"
    solution: "ภาพด้านบนเป็นวงกลม แปลว่ามีรูปทรงกลมในแนวดิ่ง ภาพด้านหน้าและด้านข้างเป็นเส้นประจากผิวบนถึงผิวล่าง แปลว่าเป็นโพรงภายในตลอดความสูง จึงเป็นรูเจาะทะลุ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.drawing.engineering-drawing.p011
    topics: [engineering.drawing.engineering-drawing]
    difficulty: 3
    type: numeric
    stem: "แบบห้องชุดคอนโดมิเนียมแห่งหนึ่งในกรุงเทพฯ (ค่าสมมติ) มาตราส่วน 1:50 วัดห้องนอนในแบบได้ $80\\ \\mathrm{mm} \\times 60\\ \\mathrm{mm}$ ห้องจริงมีพื้นที่กี่ตารางเมตร"
    answer: { value: 12, tolerance: 0.05, unit: m² }
    misconceptions:
      - { match: 0.24, feedback: "คูณพื้นที่ในแบบด้วย 50 ครั้งเดียว พื้นที่ต้องคูณ $50^2$ หรือแปลงด้านแต่ละด้านก่อนแล้วจึงคูณ" }
    hints:
      - "แปลงความยาวแต่ละด้านเป็นขนาดจริงก่อน"
      - "$80 \\times 50 = 4000\\ \\mathrm{mm} = 4\\ \\mathrm{m}$"
    solution: "ด้านจริง $80 \\times 50 = 4000\\ \\mathrm{mm} = 4\\ \\mathrm{m}$ และ $60 \\times 50 = 3000\\ \\mathrm{mm} = 3\\ \\mathrm{m}$ พื้นที่ $4 \\times 3 = 12\\ \\mathrm{m^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.drawing.engineering-drawing.p012
    topics: [engineering.drawing.engineering-drawing]
    difficulty: 4
    type: numeric
    stem: "แบบรูปตัดตามยาวของถนนสายหนึ่งในจังหวัดน่าน (ค่าสมมติ) ใช้มาตราส่วนแนวราบ 1:1000 และแนวดิ่ง 1:100 ในแบบ ช่วงถนนยาวในแนวราบ $120\\ \\mathrm{mm}$ และสูงขึ้นในแนวดิ่ง $15\\ \\mathrm{mm}$ ความลาดชันจริงของถนนช่วงนี้เป็นกี่เปอร์เซ็นต์"
    answer: { value: 1.25, tolerance: 0.01, unit: "%" }
    misconceptions:
      - { match: 12.5, feedback: "หาร $15/120$ ตรง ๆ จากแบบ แต่สองแนวใช้มาตราส่วนต่างกัน ต้องแปลงเป็นระยะจริงก่อน" }
    hints:
      - "แปลงแต่ละแนวด้วยมาตราส่วนของแนวนั้น"
      - "ความลาดชัน = ระยะดิ่งจริง ÷ ระยะราบจริง × 100"
    solution: "ระยะราบจริง $120 \\times 1000 = 120\\,000\\ \\mathrm{mm} = 120\\ \\mathrm{m}$ ระยะดิ่งจริง $15 \\times 100 = 1500\\ \\mathrm{mm} = 1.5\\ \\mathrm{m}$ ความลาดชัน $\\tfrac{1.5}{120} \\times 100 = 1.25\\%$ แบบขยายแนวดิ่งมากกว่าแนวราบ 10 เท่าเพื่อให้เห็นความลาดชันได้ชัด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.drawing.engineering-drawing.p013
