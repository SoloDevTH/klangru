  - id: physics.thermal.expansion-heat-transfer.p015
    topics: [physics.thermal.expansion-heat-transfer]
    difficulty: 4
    type: numeric
    stem: "สายไฟอะลูมิเนียมระหว่างเสาสองต้นยาว $200$ เมตร อะลูมิเนียมยาว 1 เมตรยืด $0.023$ มิลลิเมตรทุก $1\\ ^\\circ\\mathrm{C}$ ถ้าอุณหภูมิตอนเช้า $25\\ ^\\circ\\mathrm{C}$ และตอนบ่าย $45\\ ^\\circ\\mathrm{C}$ (ค่าสมมติ) สายยาวขึ้นกี่เซนติเมตร"
    answer: { value: 9.2, tolerance: 0.1, unit: cm }
    misconceptions:
      - { match: 92, feedback: "ได้หน่วยมิลลิเมตร โจทย์ถามเป็นเซนติเมตร (หาร 10)" }
      - { match: 20.7, feedback: "ใช้อุณหภูมิตอนบ่าย $45$ แทนอุณหภูมิที่เพิ่ม $20\\ ^\\circ\\mathrm{C}$" }
    hints:
      - "อุณหภูมิเพิ่ม $45 - 25 = 20\\ ^\\circ\\mathrm{C}$"
      - "$0.023 \\times 200 \\times 20$ ได้มิลลิเมตร แล้วแปลงเป็นเซนติเมตร"
    solution: "$0.023 \\times 200 \\times 20 = 92\\ \\mathrm{mm} = 9.2\\ \\mathrm{cm}$ ช่างจึงขึงสายให้หย่อนพอ"
