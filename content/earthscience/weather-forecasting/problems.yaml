  - id: earthscience.atmosphere.weather-forecasting.p013
    topics: [earthscience.atmosphere.weather-forecasting]
    difficulty: 4
    type: numeric
    stem: "วันหนึ่งกรุงเทพฯ (เกือบระดับน้ำทะเล) อุณหภูมิ 33 °C ถ้าอุณหภูมิลดลง 6.5 °C ทุกความสูง 1 กิโลเมตร ยอดดอยอินทนนท์สูง 2,565 เมตร จะมีอุณหภูมิประมาณกี่องศาเซลเซียส (สมมติว่าอากาศเหนือทั้งสองที่เหมือนกัน)"
    answer: { value: 16.3, tolerance: 0.2, unit: °C }
    misconceptions:
      - { match: 49.7, feedback: "บวกแทนที่จะลบ อากาศยิ่งสูงยิ่งเย็นลง" }
      - { match: 26.5, feedback: "ลบ 6.5 เพียงครั้งเดียว ต้องคูณกับความสูง 2.565 กิโลเมตรก่อน" }
    hints:
      - "แปลงความสูงเป็นกิโลเมตร: 2,565 เมตร = 2.565 กิโลเมตร"
      - "อุณหภูมิที่ลด $= 6.5 \\times 2.565$"
    solution: "อุณหภูมิลดลง $6.5 \\times 2.565 \\approx 16.7$ °C อุณหภูมิบนยอดดอย $\\approx 33 - 16.7 = 16.3$ °C ความสูงจึงเป็นปัจจัยสำคัญที่ทำให้อุณหภูมิต่างกัน"
