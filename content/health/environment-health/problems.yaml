- id: health.environment.environment-health.p016
  topics:
  - health.environment.environment-health
  difficulty: 5
  type: numeric
  stem: ห้องเรียนหนึ่งมีนักเรียน 30 คน แต่ละคนซื้อน้ำขวดพลาสติกวันละ 1 ขวด เรียน 5 วันต่อสัปดาห์ ถ้าห้องตกลงกันพกขวดน้ำส่วนตัวจนจำนวนขวดลดลงร้อยละ 80 ใน 4 สัปดาห์จะลดขวดพลาสติกได้กี่ขวด (ตอบเป็นขวด)
  answer:
    value: 480
    unit: ขวด
  misconceptions:
  - match: 600
    feedback: 600 คือจำนวนขวดทั้งหมดใน 4 สัปดาห์ ต้องคิดร้อยละ 80 ของจำนวนนี้
  - match: 120
    feedback: 120 คือจำนวนขวดที่ยังเหลือ (ร้อยละ 20) ไม่ใช่จำนวนที่ลดได้
  hints:
  - "หาจำนวนขวดทั้งหมดใน 4 สัปดาห์: 30 × 5 × 4"
  - ลดลงร้อยละ 80 คือคูณด้วย 80/100
  solution: ขวดทั้งหมด 30 × 5 × 4 = 600 ขวด ลดลงร้อยละ 80 คือ 600 × 0.8 = 480 ขวด
