<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 418" width="420" height="418" font-family="sans-serif" font-size="16">
  <title>ตารางเลขยกกำลังของ 2 จาก 2 ยกกำลัง 4 ลงไปถึง 2 ยกกำลังลบ 3</title>
  <text x="100" y="32" text-anchor="middle" fill="#15211e" font-size="14" font-weight="bold">เลขยกกำลัง</text>
  <text x="230" y="32" text-anchor="middle" fill="#15211e" font-size="14" font-weight="bold">ค่า</text>
