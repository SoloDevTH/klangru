problems:
  - id: phy.chg.p001
    topics: [physics.electricity.charge]
    difficulty: 1
    type: mcq
    stem: "ในงานวันเด็ก น้องถูลูกโป่งสองลูกกับผมของตัวเองแบบเดียวกัน ลูกโป่งทั้งสองได้รับประจุลบ เมื่อแขวนลูกโป่งทั้งสองด้วยด้ายให้อยู่ใกล้กัน จะเกิดอะไรขึ้น"
    choices:
      - { id: a, text: "ลูกโป่งผลักกันออก", correct: true }
      - { id: b, text: "ลูกโป่งดูดกันเข้ามาติดกัน", feedback: "แรงดูดเกิดระหว่างประจุต่างชนิดกัน ลูกโป่งทั้งสองมีประจุลบเหมือนกัน" }
      - { id: c, text: "ไม่มีแรงต่อกันเลย เพราะลูกโป่งเป็นฉนวน", feedback: "ฉนวนก็มีประจุสะสมได้ (ไฟฟ้าสถิต) แค่ประจุเคลื่อนที่ไปทั่ววัตถุไม่ได้ ประจุบนลูกโป่งจึงยังออกแรงต่อกัน" }
      - { id: d, text: "ลูกโป่งดูดกันเพราะถูกับผมคนเดียวกัน", feedback: "สิ่งที่ตัดสินคือชนิดของประจุ ไม่ใช่ว่าถูกับอะไร ลูกโป่งที่ถูแบบเดียวกันได้ประจุชนิดเดียวกัน" }
    hints:
      - "ลูกโป่งทั้งสองมีประจุชนิดเดียวกันหรือต่างชนิดกัน"
      - "จำกฎ: ประจุชนิดเดียวกันออกแรงต่อกันแบบหนึ่ง ต่างชนิดกันออกแรงอีกแบบหนึ่ง"
    solution: "ลูกโป่งทั้งสองมีประจุลบเหมือนกัน ประจุชนิดเดียวกันผลักกัน ลูกโป่งจึงแยกออกจากกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.chg.p002
    topics: [physics.electricity.charge]
    difficulty: 2
    type: numeric
    stem: "ในงานวันเด็กของโรงเรียน หลังถูกับผม ลูกโป่งลูกหนึ่งมีประจุ $-3.2\\ \\mathrm{nC}$ ลูกโป่งได้รับอิเล็กตรอนเพิ่มกี่ตัว ใช้ $e = 1.6 \\times 10^{-19}\\ \\mathrm{C}$ (ตอบเป็นจำนวนเท่าของ $10^{10}$ ตัว เช่น ถ้าได้ $7 \\times 10^{10}$ ตัว ให้ตอบ 7)"
    answer: { value: 2, unit: "× 10¹⁰ ตัว" }
    hints:
      - "ประจุของวัตถุเป็นจำนวนเต็มเท่าของประจุอิเล็กตรอน $q = ne$"
      - "แปลง $\\mathrm{nC}$ เป็นคูลอมบ์ก่อน: $1\\ \\mathrm{nC} = 10^{-9}\\ \\mathrm{C}$"
      - "จัดรูปเป็น $n = \\dfrac{q}{e}$ แล้วหารส่วนตัวเลขกับส่วนเลขยกกำลังแยกกัน"
    misconceptions:
      - { match: 2000000000, feedback: "ดูเหมือนลืมแปลง $\\mathrm{nC}$ เป็น $\\mathrm{C}$ ต้องใช้ $q = 3.2 \\times 10^{-9}\\ \\mathrm{C}$ ไม่ใช่ $3.2\\ \\mathrm{C}$" }
    solution: "$n = \\dfrac{q}{e} = \\dfrac{3.2 \\times 10^{-9}\\ \\mathrm{C}}{1.6 \\times 10^{-19}\\ \\mathrm{C}} = 2 \\times 10^{-9 - (-19)} = 2 \\times 10^{10}$ ตัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.chg.p003
    topics: [physics.electricity.charge]
    difficulty: 2
    type: mcq
    stem: "นำแท่งพลาสติกที่มีประจุลบเข้าใกล้ทรงกลมโลหะที่เป็นกลางและวางอยู่บนขาตั้งฉนวน โดยไม่ให้แตะกัน ด้านของทรงกลมที่อยู่ใกล้แท่งพลาสติกจะมีประจุชนิดใด"
    choices:
      - { id: a, text: "ประจุบวก", correct: true }
      - { id: b, text: "ประจุลบ เพราะประจุลบจากแท่งพลาสติกกระโดดมาที่ทรงกลม", feedback: "แท่งกับทรงกลมไม่ได้แตะกัน ประจุไม่ได้ย้ายข้ามมา สิ่งที่เกิดคือการเหนี่ยวนำ อิเล็กตรอนในโลหะถูกผลักไปอยู่ด้านไกล" }
      - { id: c, text: "เป็นกลาง เพราะทรงกลมไม่ได้แตะแท่งพลาสติก", feedback: "ประจุรวมของทรงกลมยังเป็นศูนย์ก็จริง แต่ประจุภายในแยกตัว ด้านใกล้และด้านไกลมีประจุต่างชนิดกัน" }
      - { id: d, text: "ประจุบวก เพราะโปรตอนในโลหะเคลื่อนเข้าหาแท่งพลาสติก", feedback: "ผลลัพธ์ถูก แต่เหตุผลผิด โปรตอนถูกยึดอยู่ในนิวเคลียส สิ่งที่เคลื่อนที่คืออิเล็กตรอนซึ่งถูกผลักไปด้านไกล ด้านใกล้จึงเหลือประจุบวก" }
    hints:
      - "ในโลหะ อนุภาคชนิดใดเคลื่อนที่ได้อิสระ"
      - "ประจุลบของแท่งพลาสติกจะผลักหรือดูดอิเล็กตรอนในโลหะ"
    solution: "อิเล็กตรอนอิสระในโลหะถูกประจุลบของแท่งผลักไปอยู่ด้านไกล ด้านใกล้จึงขาดอิเล็กตรอนและมีประจุบวก (การเหนี่ยวนำไฟฟ้า) ประจุรวมของทรงกลมยังเป็นศูนย์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.chg.p004
    topics: [physics.electricity.charge]
    difficulty: 3
    type: numeric
    stem: "ประจุ $+2\\ \\mathrm{\\mu C}$ และ $+3\\ \\mathrm{\\mu C}$ อยู่ห่างกัน $0.3\\ \\mathrm{m}$ แรงระหว่างประจุมีขนาดกี่นิวตัน ใช้ $k = 9.0 \\times 10^9\\ \\mathrm{N\\,m^2/C^2}$ (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 0.6, tolerance: 0.006, unit: N }
    hints:
      - "ใช้กฎของคูลอมบ์ $F = \\dfrac{k q_1 q_2}{r^2}$"
      - "แปลง $\\mathrm{\\mu C}$ เป็น $\\mathrm{C}$ โดยคูณ $10^{-6}$"
      - "อย่าลืมยกกำลังสองระยะห่างก่อนหาร"
    misconceptions:
      - { match: 0.18, feedback: "ดูเหมือนลืมยกกำลังสองระยะห่าง ต้องหารด้วย $r^2 = 0.09\\ \\mathrm{m^2}$ ไม่ใช่ $0.3\\ \\mathrm{m}$" }
      - { match: 600000000000, feedback: "ดูเหมือนลืมแปลง $\\mathrm{\\mu C}$ เป็น $\\mathrm{C}$ ต้องใช้ $2 \\times 10^{-6}\\ \\mathrm{C}$ และ $3 \\times 10^{-6}\\ \\mathrm{C}$" }
    solution: "$F = \\dfrac{(9.0 \\times 10^9)(2 \\times 10^{-6})(3 \\times 10^{-6})}{(0.3)^2} = \\dfrac{0.054}{0.09}\\ \\mathrm{N} = 0.6\\ \\mathrm{N}$ ประจุชนิดเดียวกันจึงเป็นแรงผลัก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.chg.p005
    topics: [physics.electricity.charge]
    difficulty: 3
    type: numeric
    stem: "ประจุสองตัวออกแรงต่อกัน $8\\ \\mathrm{N}$ ถ้าเลื่อนประจุให้ห่างกันเป็น 2 เท่าของเดิม โดยประจุยังมีขนาดเท่าเดิม แรงจะเป็นกี่นิวตัน (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 2, unit: N }
    hints:
      - "ในกฎของคูลอมบ์ แรงแปรผกผันกับอะไร"
      - "แรงแปรผกผันกับ $r^2$ ถ้า $r$ เพิ่ม 2 เท่า $r^2$ เพิ่มกี่เท่า"
    misconceptions:
      - { match: 4, feedback: "ดูเหมือนคิดว่าแรงแปรผกผันกับ $r$ แต่แรงแปรผกผันกับ $r^2$ ระยะเพิ่ม 2 เท่า แรงจึงลดเหลือ $\\tfrac{1}{2^2} = \\tfrac{1}{4}$" }
      - { match: 32, feedback: "แรงไฟฟ้าลดลงเมื่อประจุอยู่ห่างกันมากขึ้น ไม่ใช่เพิ่มขึ้น ต้องหารด้วย $2^2$ ไม่ใช่คูณ" }
    solution: "$F \\propto \\dfrac{1}{r^2}$ ระยะเพิ่ม 2 เท่า แรงจึงเหลือ $\\dfrac{1}{2^2} = \\dfrac{1}{4}$ เท่า: $F = \\dfrac{8\\ \\mathrm{N}}{4} = 2\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.chg.p006
    topics: [physics.electricity.charge]
    difficulty: 2
    type: match
    stem: "จับคู่ปริมาณกับหน่วย SI ให้ถูกต้อง"
    pairs:
      - { left: "ประจุไฟฟ้า $q$", right: "$\\mathrm{C}$" }
      - { left: "แรงไฟฟ้า $F$", right: "$\\mathrm{N}$" }
      - { left: "สนามไฟฟ้า $E$", right: "$\\mathrm{N/C}$" }
      - { left: "ค่าคงที่ $k$ ในกฎของคูลอมบ์", right: "$\\mathrm{N\\,m^2/C^2}$" }
    hints:
      - "สนามไฟฟ้าคือแรงต่อประจุหนึ่งหน่วย $E = \\dfrac{F}{q}$"
      - "หาหน่วยของ $k$ จากการจัดรูป $k = \\dfrac{F r^2}{q_1 q_2}$"
    solution: "ประจุ: คูลอมบ์ $\\mathrm{C}$ · แรง: นิวตัน $\\mathrm{N}$ · สนามไฟฟ้า $E = F/q$: $\\mathrm{N/C}$ · $k = \\dfrac{Fr^2}{q_1q_2}$: $\\mathrm{N\\,m^2/C^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.chg.p007
    topics: [physics.electricity.charge]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการทำให้ทรงกลมโลหะที่เป็นกลางมีประจุบวกโดยการเหนี่ยวนำ ด้วยแท่งพลาสติกที่มีประจุลบ (แท่งไม่แตะทรงกลมเลย)"
    items:
      - "นำแท่งพลาสติกประจุลบเข้าใกล้ทรงกลม อิเล็กตรอนในทรงกลมถูกผลักไปด้านไกล"
      - "ต่อทรงกลมลงดินขณะแท่งยังอยู่ใกล้ อิเล็กตรอนส่วนหนึ่งไหลลงดิน"
      - "ตัดสายดินออกขณะแท่งยังอยู่ที่เดิม"
      - "นำแท่งพลาสติกออก ประจุบวกที่เหลือกระจายทั่วทรงกลม"
    hints:
      - "ต้องให้อิเล็กตรอนถูกผลักออกไปก่อน จึงจะมีทางให้อิเล็กตรอนหนีออกจากทรงกลม"
      - "ถ้านำแท่งออกก่อนตัดสายดิน อิเล็กตรอนจากดินจะไหลกลับมา ทรงกลมจะกลับเป็นกลาง"
    solution: "นำแท่งเข้าใกล้ (ประจุแยกตัว) → ต่อสายดิน (อิเล็กตรอนถูกผลักลงดิน) → ตัดสายดิน (อิเล็กตรอนกลับมาไม่ได้) → นำแท่งออก ทรงกลมเหลือประจุบวก ซึ่งเป็นประจุชนิดตรงข้ามกับแท่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.chg.p008
    topics: [physics.electricity.charge]
    difficulty: 4
    type: numeric
    stem: "ช่วงฝุ่น PM2.5 ในกรุงเทพฯ หลายบ้านใช้เครื่องฟอกอากาศแบบไฟฟ้าสถิต ฝุ่นอนุภาคหนึ่งได้รับอิเล็กตรอนเพิ่ม 500 ตัว แล้วเคลื่อนเข้าสู่บริเวณที่มีสนามไฟฟ้า $2.0 \\times 10^5\\ \\mathrm{N/C}$ แรงไฟฟ้าบนฝุ่นมีขนาดเท่าใด ใช้ $e = 1.6 \\times 10^{-19}\\ \\mathrm{C}$ (ตอบเป็นจำนวนเท่าของ $10^{-11}\\ \\mathrm{N}$ เช่น ถ้าได้ $5 \\times 10^{-11}\\ \\mathrm{N}$ ให้ตอบ 5)"
    answer: { value: 1.6, tolerance: 0.02, unit: "× 10⁻¹¹ N" }
    hints:
      - "หาประจุของฝุ่นก่อนจาก $q = ne$"
      - "แรงบนประจุในสนามไฟฟ้าคือ $F = qE$"
      - "คูณส่วนตัวเลขกันและบวกเลขชี้กำลังของ 10 แล้วเขียนผลให้อยู่ในรูปเท่าของ $10^{-11}$"
    misconceptions:
      - { match: 0.0032, feedback: "ดูเหมือนใช้ประจุของอิเล็กตรอนตัวเดียว ฝุ่นได้อิเล็กตรอนเพิ่ม 500 ตัว ต้องใช้ $q = 500e$" }
    solution: "$q = ne = 500 \\times 1.6 \\times 10^{-19}\\ \\mathrm{C} = 8.0 \\times 10^{-17}\\ \\mathrm{C}$ → $F = qE = (8.0 \\times 10^{-17}\\ \\mathrm{C})(2.0 \\times 10^5\\ \\mathrm{N/C}) = 1.6 \\times 10^{-11}\\ \\mathrm{N}$ ฝุ่นมีประจุลบ แรงจึงมีทิศตรงข้ามกับสนาม ทำให้ฝุ่นถูกดูดไปติดแผ่นเก็บฝุ่นที่มีประจุบวก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.chg.p009
    topics: [physics.electricity.charge]
    difficulty: 4
    type: expression
    stem: "จากกฎของคูลอมบ์ $F = \\dfrac{kqQ}{r^2}$ จงเขียนสูตรหาระยะห่าง $r$ (ใช้ตัวแปร $k$, $q$, $Q$, $F$)"
    prefix: "r ="
    answer: { latex: "\\sqrt{\\frac{kqQ}{F}}", variables: [k, q, Q, F] }
    hints:
      - "คูณ $r^2$ ทั้งสองข้างก่อน เพื่อเอา $r$ ออกจากตัวส่วน"
      - "จะได้ $Fr^2 = kqQ$ แล้วหารด้วย $F$ ทั้งสองข้าง"
      - "เมื่อได้ $r^2$ แล้ว ถอดรากที่สองทั้งสองข้าง"
    misconceptions:
      - { match: "\\frac{kqQ}{F}", feedback: "นั่นคือ $r^2$ ยังต้องถอดรากที่สองอีกขั้นหนึ่งจึงจะได้ $r$" }
      - { match: "\\sqrt{\\frac{F}{kqQ}}", feedback: "กลับเศษกับส่วน จาก $Fr^2 = kqQ$ ต้องหารด้วย $F$ จึงได้ $r^2 = \\dfrac{kqQ}{F}$" }
    solution: "$F = \\dfrac{kqQ}{r^2}$ → $Fr^2 = kqQ$ → $r^2 = \\dfrac{kqQ}{F}$ → $r = \\sqrt{\\dfrac{kqQ}{F}}$ (ระยะห่างเป็นบวกจึงใช้รากบวก)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.chg.p010
    topics: [physics.electricity.charge]
    difficulty: 4
    type: numeric
    stem: "ประจุจุด $Q = +4\\ \\mathrm{nC}$ สนามไฟฟ้าที่ระยะ $0.2\\ \\mathrm{m}$ จากประจุมีขนาดเท่าใด ใช้ $k = 9.0 \\times 10^9\\ \\mathrm{N\\,m^2/C^2}$ (ตอบเป็นตัวเลขในหน่วย N/C)"
    answer: { value: 900, tolerance: 9, unit: N/C }
    hints:
      - "สนามไฟฟ้าจากประจุจุดคือ $E = \\dfrac{kQ}{r^2}$"
      - "แปลง $\\mathrm{nC}$ เป็น $\\mathrm{C}$: $4\\ \\mathrm{nC} = 4 \\times 10^{-9}\\ \\mathrm{C}$"
      - "คำนวณ $kQ$ ก่อน แล้วหารด้วย $r^2$"
    misconceptions:
      - { match: 180, feedback: "ดูเหมือนลืมยกกำลังสองระยะห่าง ต้องหารด้วย $r^2 = 0.04\\ \\mathrm{m^2}$ ไม่ใช่ $0.2\\ \\mathrm{m}$" }
    solution: "$E = \\dfrac{kQ}{r^2} = \\dfrac{(9.0 \\times 10^9)(4 \\times 10^{-9})}{(0.2)^2}\\ \\mathrm{N/C} = \\dfrac{36}{0.04}\\ \\mathrm{N/C} = 900\\ \\mathrm{N/C}$ ทิศพุ่งออกจากประจุ เพราะ $Q$ เป็นบวก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.chg.p011
    topics: [physics.electricity.charge]
    difficulty: 5
    type: numeric
    stem: "ประจุ A $= +2\\ \\mathrm{\\mu C}$ อยู่ที่ $x = 0$ และประจุ B $= -2\\ \\mathrm{\\mu C}$ อยู่ที่ $x = 0.2\\ \\mathrm{m}$ วางประจุ C $= +1\\ \\mathrm{\\mu C}$ ไว้ตรงกลางที่ $x = 0.1\\ \\mathrm{m}$ แรงลัพธ์บนประจุ C มีขนาดกี่นิวตัน ใช้ $k = 9.0 \\times 10^9\\ \\mathrm{N\\,m^2/C^2}$ (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 3.6, tolerance: 0.036, unit: N }
    hints:
      - "หาแรงจาก A บน C และแรงจาก B บน C แยกกัน ระยะของแต่ละคู่คือ $0.1\\ \\mathrm{m}$"
      - "A ผลัก C ไปทางใด และ B ดูด C ไปทางใด"
      - "ถ้าแรงทั้งสองชี้ไปทางเดียวกันให้นำขนาดมาบวกกัน ถ้าตรงข้ามกันให้ลบกัน"
    misconceptions:
      - { match: 0, feedback: "แรงทั้งสองไม่ได้หักล้างกัน A (บวก) ผลัก C ไปทาง $+x$ และ B (ลบ) ดูด C ไปทาง $+x$ เช่นกัน แรงจึงเสริมกัน" }
      - { match: 0.9, feedback: "ดูเหมือนใช้ระยะ $0.2\\ \\mathrm{m}$ ซึ่งเป็นระยะระหว่าง A กับ B แต่ C อยู่ห่างจากแต่ละประจุเพียง $0.1\\ \\mathrm{m}$" }
    solution: "แรงจาก A: $F_A = \\dfrac{(9.0 \\times 10^9)(2 \\times 10^{-6})(1 \\times 10^{-6})}{(0.1)^2} = 1.8\\ \\mathrm{N}$ ผลัก C ไปทาง $+x$ · แรงจาก B มีขนาดเท่ากัน $1.8\\ \\mathrm{N}$ ดูด C ไปทาง $+x$ (เข้าหา B) · แรงลัพธ์ $= 1.8 + 1.8 = 3.6\\ \\mathrm{N}$ ทิศ $+x$"
