id: science.inquiry.communicating
subject: science
title:
  th: การเขียนรายงานและสื่อสารผลทางวิทยาศาสตร์
  en: Writing reports and communicating science
summary: เขียนรายงานการทดลองตามโครงสร้างมาตรฐาน ใช้คำศัพท์ หน่วย และสัญลักษณ์ถูกต้อง เขียนข้อโต้แย้งด้วยหลักฐาน ปรับการสื่อสารให้เหมาะกับผู้อ่าน และอ้างอิงแหล่งข้อมูลอย่างมีจริยธรรม
difficulty: 3
minutes: 30
prerequisites:
- science.inquiry.data-analysis
encompasses:
- id: science.inquiry.data-analysis
  weight: 0.2
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  title: โครงสร้างรายงานการทดลอง
  src: report-structure.svg
  alt: "ผังแปดกล่องเรียงจากบนลงล่างพร้อมคำอธิบาย ชื่อเรื่อง บอกตัวแปรต้นและตัวแปรตาม บทคัดย่อ สรุปทั้งเรื่องสั้น ๆ ว่าทำอะไร อย่างไร พบอะไร บทนำ ที่มา คำถาม สมมติฐาน ความรู้เดิมพร้อมอ้างอิง (วงเล็บว่า ทำไม) วิธีการ วัสดุ ตัวแปร ขั้นตอนละเอียดพอให้คนอื่นทำซ้ำได้ (ทำอย่างไร) ผลการทดลอง ตาราง กราฟ มีชื่อและหน่วย บอกข้อมูลตามจริง (พบอะไร) อภิปรายผล อธิบายผล เทียบสมมติฐาน ความคลาดเคลื่อน ความน่าเชื่อถือ และสรุปผล ตอบคำถามที่ตั้งไว้ ข้อเสนอแนะ (สองกล่องนี้คือ หมายความว่าอะไร) และเอกสารอ้างอิง แหล่งข้อมูลทุกแหล่งที่ใช้"
  caption: "รายงานตอบคำถามสี่ข้อ ทำไม ทำอย่างไร พบอะไร และหมายความว่าอะไร (วาดโดยทีมคลังรู้)"
- type: worked-example
  title: เปลี่ยนบันทึกการทดลองให้เป็นส่วนผลและอภิปรายผล
  problem: "บันทึกของนักเรียน: \"ใส่ปุ๋ย 0, 20, 40 กรัม กระถางละ 5 ต้น วัดวันที่ 14 ได้เฉลี่ย 8, 21, 33 เซน ต้นที่ใส่ 40 สูงสุด น่าจะเพราะไนโตรเจน\" เขียนใหม่เป็นส่วนผลและส่วนอภิปรายผล"
  steps:
  - text: "ส่วนผล: ทำตาราง หัวคอลัมน์ \"ปริมาณปุ๋ยหมัก (g)\" และ \"ความสูงเฉลี่ยหลัง 14 วัน (cm)\" ใส่ค่า 0 → 8, 20 → 21, 40 → 33 และระบุว่าแต่ละค่าเฉลี่ยจาก 5 กระถาง"
    why: "หัวคอลัมน์บอกปริมาณและหน่วยครั้งเดียว ตัวเลขในตารางจึงไม่ต้องมีหน่วยซ้ำ"
  - text: "ส่วนผล (ข้อความ): \"ความสูงเฉลี่ยเพิ่มขึ้นตามปริมาณปุ๋ยหมัก จาก 8 cm เมื่อไม่ใส่ปุ๋ย เป็น 33 cm เมื่อใส่ 40 g\""
    why: "บอกแนวโน้มและตัวเลขสำคัญ แต่ยังไม่อธิบายสาเหตุ"
  - text: "ส่วนอภิปรายผล: \"ผลสนับสนุนสมมติฐาน อาจเป็นเพราะปุ๋ยหมักให้ไนโตรเจนที่พืชใช้สร้างโปรตีนและคลอโรฟิลล์\""
  - text: "เพิ่มความน่าเชื่อถือและข้อจำกัด: \"ความสูงในแต่ละกลุ่มกระจายไม่เกิน ±2 cm แต่ทดลองฤดูเดียวกับดินชนิดเดียว\""
  answer: "ผลบอกข้อมูลพร้อมหน่วยและแนวโน้ม อภิปรายผลอธิบายเหตุผล เทียบสมมติฐาน และบอกข้อจำกัด"
- type: check
  problem: science.inquiry.communicating.p002
- type: worked-example
  title: เขียนเรื่องเดียวกันให้ผู้อ่านสองกลุ่ม
  problem: "ผลการวัดฝุ่น PM2.5 หน้าโรงเรียนช่วงเช้าเฉลี่ย 62 μg/m³ ช่วงบ่าย 31 μg/m³ (ข้อมูลสมมติ) เขียนสรุปสำหรับครูวิทยาศาสตร์และสำหรับผู้ปกครอง"
  steps:
  - text: "สำหรับครู: ระบุวิธีวัด (เครื่องวัด จำนวนวัน ช่วงเวลา) ค่าเฉลี่ยพร้อมหน่วย μg/m³ และความกระจายของข้อมูล"
  - text: "สำหรับผู้ปกครอง: \"ช่วงเช้าฝุ่นหน้าโรงเรียนมากกว่าช่วงบ่ายราวสองเท่า\" แล้วบอกสิ่งที่ทำได้ เช่น ดูค่าฝุ่นก่อนออกจากบ้าน"
    why: "ผู้ปกครองต้องการสิ่งที่นำไปใช้ได้ ตัวเลขเปรียบเทียบง่าย ๆ เข้าใจเร็วกว่าหน่วยที่ไม่คุ้น"
  - text: "ทั้งสองแบบต้องตรงกับข้อมูล ไม่ขยายความว่าอันตราย \"มาก\" เกินกว่าที่วัดได้ และบอกแหล่งข้อมูล"
  answer: "เนื้อหาเดียวกัน แต่เลือกรายละเอียดและภาษาให้เหมาะกับผู้อ่าน โดยไม่บิดข้อมูล"
- type: check
  problem: science.inquiry.communicating.p007
glossary:
- term: รายงานการทดลอง
  definition: เอกสารที่บอกว่าทำการทดลองทำไม อย่างไร พบอะไร และหมายความว่าอะไร ในโครงสร้างที่ผู้อ่านคุ้นเคย
- term: บทคัดย่อ
  definition: ส่วนสรุปทั้งรายงานสั้น ๆ บอกวัตถุประสงค์ วิธีการ ผลสำคัญ และข้อสรุป
- term: ข้อกล่าวอ้าง–หลักฐาน–เหตุผล
  definition: โครงสร้างของข้อโต้แย้งทางวิทยาศาสตร์ คำตอบ ข้อมูลที่สนับสนุน และความรู้ที่เชื่อมทั้งสอง
- term: การอ้างอิง
  definition: การบอกแหล่งที่มาของข้อมูล ภาพ หรือแนวคิดที่นำมาใช้ ให้ผู้อ่านตรวจสอบได้
- term: การลอกเลียนผลงาน
  definition: การนำงานของผู้อื่นมาใช้เหมือนเป็นของตนเองโดยไม่อ้างอิง
flashcards:
- front: ส่วนผลการทดลอง กับ ส่วนอภิปรายผล
  back: ผลบอกว่าพบอะไร (ข้อมูล ตาราง กราฟ) อภิปรายผลบอกว่าทำไมและหมายความว่าอะไร
- front: เขียนหน่วยอย่างไรให้ถูก
  back: ตัวเลข เว้นวรรค สัญลักษณ์หน่วยสากล เช่น 25 °C, 3.5 kg ตัวเล็กตัวใหญ่มีความหมาย
- front: ข้อโต้แย้งที่ดีมีอะไรบ้าง
  back: ข้อกล่าวอ้าง หลักฐาน เหตุผล และบอกระดับความเชื่อมั่นหรือข้อจำกัด
- front: รายการอ้างอิงเว็บไซต์ควรมีอะไร
  back: ผู้เขียน ปี ชื่อเรื่อง ชื่อเว็บไซต์ ลิงก์ และวันที่เข้าถึง
