<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" font-family="sans-serif" font-size="14">
  <title>การไหลของข้อมูลในระบบสารสนเทศทางการบัญชีและจุดควบคุม</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="780" height="330" fill="#ffffff"/>
  <rect x="30.0" y="40.0" width="200.0" height="150.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="130.0" y="68.0" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="bold">นำเข้า</text>
  <text x="130.0" y="100.0" text-anchor="middle" fill="#1f2937" font-size="13.5">ใบสั่งซื้อ</text>
  <text x="130.0" y="126.0" text-anchor="middle" fill="#1f2937" font-size="13.5">ใบกำกับภาษี</text>
  <text x="130.0" y="152.0" text-anchor="middle" fill="#1f2937" font-size="13.5">สลิปโอนเงิน</text>
  <line x1="234.0" y1="115.0" x2="286.0" y2="115.0" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="290.0" y="40.0" width="200.0" height="150.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="390.0" y="68.0" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="bold">ประมวลผล</text>
  <text x="390.0" y="100.0" text-anchor="middle" fill="#1f2937" font-size="13.5">บันทึกรายการ</text>
  <text x="390.0" y="126.0" text-anchor="middle" fill="#1f2937" font-size="13.5">ผ่านบัญชีแยกประเภท</text>
  <text x="390.0" y="152.0" text-anchor="middle" fill="#1f2937" font-size="13.5">ปรับปรุงและปิดบัญชี</text>
  <line x1="494.0" y1="115.0" x2="546.0" y2="115.0" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="550.0" y="40.0" width="200.0" height="150.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="650.0" y="68.0" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="bold">แสดงผล</text>
  <text x="650.0" y="100.0" text-anchor="middle" fill="#1f2937" font-size="13.5">งบทดลอง งบการเงิน</text>
  <text x="650.0" y="126.0" text-anchor="middle" fill="#1f2937" font-size="13.5">รายงานลูกหนี้ตามอายุ</text>
  <text x="650.0" y="152.0" text-anchor="middle" fill="#1f2937" font-size="13.5">ยอดขายตามสินค้า</text>
  <rect x="290.0" y="205.0" width="200.0" height="44.0" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
  <text x="390.0" y="232.0" text-anchor="middle" fill="#1f2937" font-size="13.5">ข้อมูลหลัก + แฟ้มรายการ</text>
  <line x1="390.0" y1="190.0" x2="390.0" y2="203.0" stroke="#1f2937" stroke-width="2"/>
  <text x="130.0" y="272.0" text-anchor="middle" fill="#7c3aed" font-size="13" font-weight="bold">ควบคุมการนำเข้า</text>
  <text x="130.0" y="292.0" text-anchor="middle" fill="#7c3aed" font-size="12">ตรวจรูปแบบ ขอบเขต ยอดรวมควบคุม</text>
  <text x="390.0" y="272.0" text-anchor="middle" fill="#7c3aed" font-size="13" font-weight="bold">ควบคุมการประมวลผล</text>
  <text x="390.0" y="292.0" text-anchor="middle" fill="#7c3aed" font-size="12">เทียบยอด จับคู่เอกสาร</text>
  <text x="650.0" y="272.0" text-anchor="middle" fill="#7c3aed" font-size="13" font-weight="bold">ควบคุมผลลัพธ์</text>
  <text x="650.0" y="292.0" text-anchor="middle" fill="#7c3aed" font-size="12">กระทบยอด จำกัดผู้รับ</text>
  <rect x="10.0" y="8.0" width="760.0" height="316.0" rx="10" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="390.0" y="318.0" text-anchor="middle" fill="#6b7280" font-size="12.5">การควบคุมทั่วไปครอบทั้งระบบ: สิทธิผู้ใช้ แบ่งแยกหน้าที่ สำรองข้อมูล ควบคุมการแก้โปรแกรม</text>
</svg>
