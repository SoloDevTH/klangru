id: biology.cells.cell-division
subject: biology
title: { th: การแบ่งเซลล์, en: "Cell division: mitosis and meiosis" }
summary: วัฏจักรเซลล์ ระยะของไมโทซิสและไมโอซิส ไซโทไคนีซิสในเซลล์พืชและสัตว์ การเปรียบเทียบสองแบบ ดัชนีไมโทซิสจากปลายราก เซลล์ต้นกำเนิด และเนื้อเยื่อเจริญ
difficulty: 5
minutes: 45
prerequisites: [biology.cells.cell-structure]
encompasses:
  - { id: biology.cells.cell-structure, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: วัฏจักรเซลล์
    src: cell-cycle.svg
    alt: "แผนภูมิวงกลมของวัฏจักรเซลล์ 24 ชั่วโมง แบ่งเป็น G1 11 ชั่วโมง (สีเขียว ส่วนใหญ่ที่สุด) S 8 ชั่วโมง (สีฟ้า) G2 4 ชั่วโมง (สีเหลือง) และ M 1 ชั่วโมง (ชิ้นสีแดงเล็ก ๆ ด้านบน คือไมโทซิสและไซโทไคนีซิส) มีลูกศรโค้งรอบ G1 S G2 เขียนว่าอินเตอร์เฟส ข้างแผนภูมิอธิบายว่า G1 เซลล์เติบโต สร้างโปรตีนและออร์แกเนลล์ S จำลอง DNA โครโมโซมเป็นสองโครมาทิด G2 เตรียมพร้อมแบ่งเซลล์ M แบ่งนิวเคลียสและไซโทพลาซึม"
    caption: "เซลล์ใช้เวลาส่วนใหญ่ในอินเตอร์เฟส ระยะแบ่งเซลล์สั้นมาก (ตัวเลขเป็นตัวอย่างของเซลล์คนที่เลี้ยงในห้องปฏิบัติการ วาดโดยทีมคลังรู้)"
  - type: figure
    title: ขั้นตอนของไมโทซิส
    src: mitosis-stages.svg
    alt: "เซลล์ที่มีโครโมโซม 2n = 4 (คู่ยาวและคู่สั้น แต่ละคู่มีแท่งสีแดงจากแม่และสีน้ำเงินจากพ่อ) ผ่าน 5 ขั้นจากซ้ายไปขวา: อินเตอร์เฟส นิวเคลียสกลมมีเส้นใยโครมาทินพันกัน; โพรเฟส โครโมโซม 4 แท่งแต่ละแท่งมีสองโครมาทิดติดกันที่เซนโทรเมียร์ เยื่อหุ้มนิวเคลียสเป็นเส้นประ; เมทาเฟส โครโมโซม 4 แท่งเรียงแนวตั้งกลางเซลล์ มีเส้นใยสปินเดิลจากสองขั้วมายึด; แอนาเฟส โครมาทิด 8 เส้นแยกเป็นสองกลุ่มกลุ่มละ 4 ถูกดึงไปขั้วซ้ายและขวา; เทโลเฟสและไซโทไคนีซิส เซลล์คอดเป็นสองเซลล์ แต่ละเซลล์มีนิวเคลียสที่มีโครโมโซม 4 แท่ง แดง 2 น้ำเงิน 2"
    caption: "ไมโทซิสแยกซิสเตอร์โครมาทิด เซลล์ลูกจึงได้โครโมโซมครบชุดเหมือนเซลล์แม่ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ติดตามจำนวนโครโมโซมและโครมาทิด
    problem: "เซลล์ร่างกายของแมวมี $2n = 38$ บอกจำนวนโครโมโซมและโครมาทิดต่อเซลล์ในระยะ G1 เมทาเฟสของไมโทซิส และเซลล์ลูกหลังไมโทซิส"
    steps:
      - text: "ระยะ G1 ยังไม่จำลอง DNA: 38 โครโมโซม แต่ละแท่งเป็นโครมาทิดเดียว จึงมี 38 โครมาทิด"
      - text: "ระยะ S จำลอง DNA แต่ละโครโมโซมมี 2 ซิสเตอร์โครมาทิด จำนวนโครโมโซมยังเป็น 38"
        why: "นับโครโมโซมจากเซนโทรเมียร์ การจำลอง DNA ไม่ได้เพิ่มจำนวนเซนโทรเมียร์"
      - text: "เมทาเฟส: 38 โครโมโซม $38 \\times 2 = 76$ โครมาทิด"
      - text: "แอนาเฟสแยกซิสเตอร์โครมาทิดไปคนละขั้ว เซลล์ลูกแต่ละเซลล์ได้ 38 โครโมโซม แต่ละแท่งมีโครมาทิดเดียว"
    answer: "G1: 38 โครโมโซม 38 โครมาทิด / เมทาเฟส: 38 โครโมโซม 76 โครมาทิด / เซลล์ลูก: 38 โครโมโซม 38 โครมาทิด"
  - { type: check, problem: biology.cells.cell-division.p002, prompt: "ลองตอบก่อนดูไมโอซิส" }
  - type: figure
    title: ขั้นตอนของไมโอซิส
    src: meiosis-stages.svg
    alt: "เซลล์ 2n = 4 ผ่านไมโอซิส แถวบนคือไมโอซิส I: โพรเฟส I โครโมโซมคู่เหมือนแดงกับน้ำเงินเข้าคู่ชิดกัน คู่ยาวแลกปลายโครมาทิดกันจนมีโครมาทิดที่เป็นสีแดงปนน้ำเงิน (ครอสซิงโอเวอร์); เมทาเฟส I คู่เหมือนเรียงเป็นคู่ข้ามแนวกลางเซลล์ แต่ละแท่งยึดกับเส้นใยจากขั้วเดียว; แอนาเฟส I คู่เหมือนแยกไปคนละขั้ว แต่ละแท่งยังมีสองโครมาทิด; เทโลเฟส I ได้ 2 เซลล์ แต่ละเซลล์มีโครโมโซม 2 แท่ง (n = 2) ที่ยังมีสองโครมาทิด แถวล่างคือไมโอซิส II: เมทาเฟส II โครโมโซมเรียงแถวเดียวกลางทั้งสองเซลล์; แอนาเฟส II ซิสเตอร์โครมาทิดแยกไปขั้วเซลล์; เทโลเฟส II ได้ 4 เซลล์ แต่ละเซลล์มีโครโมโซม 2 แท่งแบบโครมาทิดเดียว และสีของโครโมโซมในแต่ละเซลล์ต่างกัน"
    caption: "ไมโอซิส I แยกคู่เหมือน (ลดจำนวนโครโมโซมครึ่งหนึ่ง) ไมโอซิส II แยกซิสเตอร์โครมาทิด เซลล์ทั้ง 4 มีพันธุกรรมต่างกัน (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: หาเวลาของแต่ละระยะจากจำนวนเซลล์
    problem: "นักเรียนนับเซลล์ปลายรากหอม 200 เซลล์ พบอินเตอร์เฟส 180 โพรเฟส 11 เมทาเฟส 3 แอนาเฟส 2 เทโลเฟส 4 ถ้าวัฏจักรเซลล์ยาว 20 ชั่วโมง หาดัชนีไมโทซิสและเวลาของระยะเมทาเฟส"
    steps:
      - text: "เซลล์ในไมโทซิส $= 11 + 3 + 2 + 4 = 20$ เซลล์"
      - text: "ดัชนีไมโทซิส $= \\frac{20}{200} \\times 100 = 10\\%$"
      - text: "เวลาเมทาเฟส $= \\frac{3}{200} \\times 20 = 0.3$ ชั่วโมง หรือ 18 นาที"
        why: "เซลล์ถูกตรึงแบบสุ่ม ระยะที่ยาวจึงพบเซลล์มาก สัดส่วนเซลล์จึงประมาณสัดส่วนเวลา"
    answer: "ดัชนีไมโทซิส 10% และเมทาเฟสใช้ราว 0.3 ชั่วโมง (18 นาที)"
  - { type: check, problem: biology.cells.cell-division.p009, prompt: "คิดว่าควรใช้ระยะใดนับโครโมโซม" }
glossary:
  - { term: ซิสเตอร์โครมาทิด, definition: "โครมาทิดสองเส้นที่เหมือนกันทุกประการจากการจำลอง DNA ติดกันที่เซนโทรเมียร์" }
  - { term: ฮอมอโลกัสโครโมโซม, definition: "โครโมโซมคู่เหมือน ขนาดและตำแหน่งยีนเหมือนกัน แท่งหนึ่งมาจากแม่ อีกแท่งมาจากพ่อ" }
  - { term: ไซโทไคนีซิส, definition: "การแบ่งไซโทพลาซึมหลังแบ่งนิวเคลียส เซลล์สัตว์คอดเข้า เซลล์พืชสร้างเซลล์เพลต" }
  - { term: ครอสซิงโอเวอร์, definition: "การแลกเปลี่ยนชิ้นส่วนโครมาทิดระหว่างฮอมอโลกัสโครโมโซมในโพรเฟส I ของไมโอซิส" }
  - { term: ดัชนีไมโทซิส, definition: "ร้อยละของเซลล์ที่อยู่ในระยะไมโทซิสเทียบกับเซลล์ทั้งหมดที่นับ" }
  - { term: เซลล์ต้นกำเนิด, definition: "เซลล์ที่แบ่งตัวได้และเปลี่ยนสภาพไปเป็นเซลล์ชนิดอื่นได้ เช่น เซลล์ต้นกำเนิดในไขกระดูก" }
flashcards:
  - { front: "ระยะของวัฏจักรเซลล์", back: "อินเตอร์เฟส (G1 → S → G2) แล้วระยะ M (ไมโทซิสหรือไมโอซิส + ไซโทไคนีซิส)" }
  - { front: "ระยะของไมโทซิสและเหตุการณ์หลัก", back: "โพรเฟส (โครโมโซมหดตัว) → เมทาเฟส (เรียงกลาง) → แอนาเฟส (โครมาทิดแยก) → เทโลเฟส (นิวเคลียสใหม่)" }
  - { front: "ไมโทซิสต่างจากไมโอซิสอย่างไร", back: "ไมโทซิส: แบ่ง 1 ครั้ง ได้ 2 เซลล์ 2n เหมือนเดิม / ไมโอซิส: แบ่ง 2 ครั้ง ได้ 4 เซลล์ n ต่างกัน" }
  - { front: "ไมโอซิส I กับ II แยกอะไร", back: "ไมโอซิส I แยกฮอมอโลกัสโครโมโซม ไมโอซิส II แยกซิสเตอร์โครมาทิด" }
  - { front: "ดูไมโทซิสและไมโอซิสจากส่วนใดของพืช", back: "ไมโทซิส: ปลายราก (เนื้อเยื่อเจริญ) ไมโอซิส: อับเรณูของดอกตูม" }
