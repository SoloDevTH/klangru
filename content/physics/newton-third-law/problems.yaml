problems:
  - id: phy.n3.p001
    topics: [physics.dynamics.newton-third]
    difficulty: 1
    type: mcq
    stem: "ขณะที่เราเดินไปข้างหน้า แรงใดเป็นแรงที่ดันตัวเราไปข้างหน้า"
    choices:
      - { id: a, text: "แรงที่พื้นดันเท้าไปข้างหน้า", correct: true }
      - { id: b, text: "แรงที่เท้าดันพื้นไปข้างหลัง", feedback: "แรงนี้กระทำต่อพื้น ไม่ได้กระทำต่อตัวเรา สิ่งที่ดันตัวเราคือแรงคู่ของมัน คือแรงที่พื้นดันเท้ากลับ" }
      - { id: c, text: "แรงจากกล้ามเนื้อขาที่ดันตัวเราเอง", feedback: "กล้ามเนื้อเป็นส่วนหนึ่งของตัวเรา ดันตัวเองให้เคลื่อนที่ไม่ได้ ต้องมีแรงจากภายนอก คือพื้นดันกลับ" }
      - { id: d, text: "แรงโน้มถ่วงของโลก", feedback: "แรงโน้มถ่วงดึงเราลงในแนวดิ่ง ไม่ได้ดันไปข้างหน้า" }
    hints:
      - "แรงที่ทำให้ตัวเราเคลื่อนที่ต้องเป็นแรงที่สิ่งอื่นกระทำต่อตัวเรา"
      - "เท้าดันพื้นไปข้างหลัง ตามกฎข้อที่ 3 พื้นทำอะไรกลับมา"
    solution: "เท้าดันพื้นไปข้างหลัง (แรงนี้กระทำต่อพื้น) ตามกฎข้อที่ 3 พื้นดันเท้าไปข้างหน้าด้วยแรงขนาดเท่ากัน แรงที่พื้นดันเท้านี้กระทำต่อตัวเรา จึงเป็นแรงที่ดันเราไปข้างหน้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.n3.p002
    topics: [physics.dynamics.newton-third]
    difficulty: 1
    type: numeric
    stem: "ช่างไม้ใช้ค้อนตอกตะปู ขณะกระทบกัน ค้อนออกแรงต่อตะปู $400\\ \\mathrm{N}$ ตะปูออกแรงต่อค้อนมีขนาดเท่าใด (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 400, unit: N }
    hints:
      - "แรงที่ค้อนทำต่อตะปู กับแรงที่ตะปูทำต่อค้อน เป็นแรงคู่ตามกฎข้อใด"
      - "แรงคู่กิริยา–ปฏิกิริยามีขนาดสัมพันธ์กันอย่างไร"
    misconceptions:
      - { match: 0, feedback: "ตะปูออกแรงกลับต่อค้อนด้วย สังเกตได้จากค้อนที่หยุดหรือเด้งกลับเมื่อกระทบตะปู" }
    solution: "ตามกฎข้อที่ 3 แรงที่ตะปูกระทำต่อค้อนมีขนาดเท่ากับแรงที่ค้อนกระทำต่อตะปู คือ $400\\ \\mathrm{N}$ แต่มีทิศตรงข้าม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.n3.p003
    topics: [physics.dynamics.newton-third]
    difficulty: 2
    type: mcq
    stem: "รถบรรทุกสิบล้อชนกับรถจักรยานยนต์บนถนนสายหนึ่ง ขณะชนกัน ข้อใดเปรียบเทียบขนาดของแรงที่รถทั้งสองกระทำต่อกันได้ถูกต้อง"
    choices:
      - { id: a, text: "แรงที่ทั้งสองกระทำต่อกันมีขนาดเท่ากัน", correct: true }
      - { id: b, text: "รถบรรทุกออกแรงมากกว่า เพราะมีมวลมากกว่า", feedback: "มวลมากไม่ได้ทำให้แรงคู่นี้ต่างกัน ตามกฎข้อที่ 3 แรงคู่กิริยา–ปฏิกิริยามีขนาดเท่ากันเสมอ มวลมีผลต่อการเปลี่ยนความเร็ว ไม่ใช่ต่อขนาดของแรงคู่" }
      - { id: c, text: "รถจักรยานยนต์ได้รับแรงมากกว่า เพราะเสียหายมากกว่า", feedback: "ความเสียหายที่มากกว่ามาจากมวลที่น้อยและโครงสร้างที่บอบบาง ทำให้แรงเท่ากันส่งผลมากกว่า แต่ขนาดของแรงทั้งสองเท่ากัน" }
      - { id: d, text: "รถคันที่วิ่งเร็วกว่าออกแรงมากกว่า", feedback: "ความเร็วทำให้แรงขณะชนโดยรวมมากขึ้นได้ แต่ทั้งสองคันยังได้รับแรงขนาดเท่ากันเสมอ" }
    hints:
      - "แรงที่รถบรรทุกทำต่อรถจักรยานยนต์ และแรงที่รถจักรยานยนต์ทำต่อรถบรรทุก เป็นแรงคู่แบบใด"
      - "กฎข้อที่ 3 มีเงื่อนไขเรื่องมวลหรือความเร็วหรือไม่"
    solution: "แรงทั้งสองเป็นคู่กิริยา–ปฏิกิริยา ตามกฎข้อที่ 3 จึงมีขนาดเท่ากันและทิศตรงข้ามเสมอ ส่วนรถจักรยานยนต์เสียหายและเปลี่ยนความเร็วมากกว่า เพราะมีมวลน้อยกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.n3.p004
    topics: [physics.dynamics.newton-third]
    difficulty: 2
    type: match
    stem: "จับคู่แรงกิริยาทางซ้ายกับแรงปฏิกิริยาของมันทางขวา"
    pairs:
      - { left: "เท้าเตะลูกตะกร้อไปข้างหน้า", right: "ลูกตะกร้อดันเท้าไปข้างหลัง" }
      - { left: "โลกดึงมะม่วงลง", right: "มะม่วงดึงโลกขึ้น" }
      - { left: "ไม้พายดันน้ำไปข้างหลัง", right: "น้ำดันไม้พายไปข้างหน้า" }
      - { left: "จรวดดันแก๊สร้อนลงด้านล่าง", right: "แก๊สร้อนดันจรวดขึ้นด้านบน" }
      - { left: "หนังสือกดโต๊ะลง", right: "โต๊ะดันหนังสือขึ้น" }
    hints:
      - "เขียนแรงเป็นประโยค \"A ทำต่อ B\" แล้วสลับเป็น \"B ทำต่อ A\""
      - "แรงปฏิกิริยามีทิศตรงข้ามกับแรงกิริยาเสมอ"
    solution: "สลับผู้กระทำกับผู้ถูกกระทำและกลับทิศ: เท้าเตะลูกตะกร้อ ↔ ลูกตะกร้อดันเท้า · โลกดึงมะม่วง ↔ มะม่วงดึงโลก · ไม้พายดันน้ำ ↔ น้ำดันไม้พาย · จรวดดันแก๊ส ↔ แก๊สดันจรวด · หนังสือกดโต๊ะ ↔ โต๊ะดันหนังสือ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.n3.p005
    topics: [physics.dynamics.newton-third]
    difficulty: 3
    type: mcq
    stem: "หนังสือวางนิ่งอยู่บนโต๊ะ แรงที่โลกดึงหนังสือลง (น้ำหนักของหนังสือ) มีแรงปฏิกิริยาตามกฎข้อที่ 3 คือแรงใด"
    choices:
      - { id: a, text: "แรงที่หนังสือดึงโลกขึ้น", correct: true }
      - { id: b, text: "แรงที่โต๊ะดันหนังสือขึ้น", feedback: "แรงนี้มีขนาดเท่ากับน้ำหนักและทิศตรงข้ามก็จริง แต่กระทำต่อหนังสือก้อนเดียวกัน และเป็นแรงคนละชนิด จึงไม่ใช่คู่ตามกฎข้อที่ 3 สองแรงนี้เท่ากันเพราะหนังสือนิ่ง" }
      - { id: c, text: "แรงที่หนังสือกดโต๊ะลง", feedback: "แรงนี้เป็นคู่ของแรงที่โต๊ะดันหนังสือขึ้น ไม่ใช่คู่ของน้ำหนัก สังเกตว่าน้ำหนักเกี่ยวกับโลกกับหนังสือ คู่ของมันต้องเกี่ยวกับโลกกับหนังสือเช่นกัน" }
      - { id: d, text: "แรงที่โต๊ะดึงโลกลง", feedback: "แรงนี้ไม่เกี่ยวกับหนังสือเลย คู่ของแรงต้องเกิดระหว่างวัตถุคู่เดิม คือโลกกับหนังสือ" }
    hints:
      - "เขียนน้ำหนักเป็นประโยค: \"โลกดึงหนังสือลง\""
      - "สลับผู้กระทำกับผู้ถูกกระทำ แล้วกลับทิศ"
    solution: "น้ำหนักคือ \"โลกดึงหนังสือลง\" สลับผู้กระทำกับผู้ถูกกระทำได้ \"หนังสือดึงโลกขึ้น\" เป็นแรงโน้มถ่วงเหมือนกัน ขนาดเท่ากัน ทิศตรงข้าม และกระทำต่อโลก ส่วนแรงที่โต๊ะดันหนังสือเป็นแรงอีกคู่หนึ่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.n3.p006
    topics: [physics.dynamics.newton-third]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดถูกต้องเกี่ยวกับแรงกิริยาและแรงปฏิกิริยาตามกฎข้อที่ 3 ของนิวตัน (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "มีขนาดเท่ากันเสมอ", correct: true }
      - { id: b, text: "มีทิศตรงข้ามกัน", correct: true }
      - { id: c, text: "กระทำต่อวัตถุคนละก้อน", correct: true }
      - { id: d, text: "เป็นแรงชนิดเดียวกัน", correct: true }
      - { id: e, text: "หักล้างกัน ทำให้แรงลัพธ์เป็นศูนย์", feedback: "แรงจะหักล้างกันได้ต้องกระทำต่อวัตถุก้อนเดียวกัน แต่แรงคู่นี้กระทำต่อวัตถุคนละก้อน จึงไม่หักล้างกัน" }
      - { id: f, text: "แรงปฏิกิริยาเกิดขึ้นหลังแรงกิริยาเล็กน้อย", feedback: "แรงทั้งสองเกิดขึ้นพร้อมกันและหายไปพร้อมกัน จะเรียกแรงใดว่ากิริยาก็ได้" }
    hints:
      - "นึกถึงลักษณะสำคัญ 5 ข้อของแรงคู่กิริยา–ปฏิกิริยา"
      - "แรงที่กระทำต่อวัตถุคนละก้อนนำมารวมเป็นแรงลัพธ์ของวัตถุก้อนเดียวได้หรือไม่"
    solution: "แรงคู่กิริยา–ปฏิกิริยามีขนาดเท่ากัน ทิศตรงข้าม เป็นแรงชนิดเดียวกัน เกิดพร้อมกัน และกระทำต่อวัตถุคนละก้อน จึงไม่หักล้างกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.n3.p007
    topics: [physics.dynamics.newton-third]
    difficulty: 3
    type: numeric
    stem: "ที่ลานสเกตน้ำแข็งในห้างสรรพสินค้า นักสเกต ก (มวล $60\\ \\mathrm{kg}$) และ ข (มวล $40\\ \\mathrm{kg}$) ยืนหันหน้าเข้าหากันแล้วผลักกัน ขณะผลัก ก ออกแรงต่อ ข $120\\ \\mathrm{N}$ ข ออกแรงต่อ ก มีขนาดเท่าใด (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 120, unit: N }
    hints:
      - "แรงที่ ก ทำต่อ ข และแรงที่ ข ทำต่อ ก เป็นแรงคู่ตามกฎข้อที่ 3"
      - "มวลของแต่ละคนมีผลต่อขนาดของแรงคู่นี้หรือไม่"
    misconceptions:
      - { match: 80, feedback: "ดูเหมือนปรับแรงตามสัดส่วนมวล ($120 \\times \\tfrac{40}{60}$) แต่แรงคู่ตามกฎข้อที่ 3 มีขนาดเท่ากันเสมอ ไม่ขึ้นกับมวล" }
      - { match: 180, feedback: "ดูเหมือนปรับแรงตามสัดส่วนมวล ($120 \\times \\tfrac{60}{40}$) แต่แรงคู่ตามกฎข้อที่ 3 มีขนาดเท่ากันเสมอ มวลมีผลเพียงว่าใครไถลออกไปเร็วกว่า" }
    solution: "ตามกฎข้อที่ 3 แรงที่ ข กระทำต่อ ก มีขนาดเท่ากับแรงที่ ก กระทำต่อ ข คือ $120\\ \\mathrm{N}$ ทิศตรงข้าม ข ซึ่งมีมวลน้อยกว่าจะไถลออกไปเร็วกว่า แม้ได้รับแรงเท่ากัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.n3.p008
    topics: [physics.dynamics.newton-third]
    difficulty: 4
    type: mcq
    stem: "ในการชักเย่อ เชือกดึงทีมทั้งสองด้วยแรงขนาดเท่ากัน (เชือกเบามาก) แต่ทีมหนึ่งก็ยังชนะได้ ข้อใดอธิบายได้ถูกต้อง"
    choices:
      - { id: a, text: "ทีมที่ชนะยันเท้าดันพื้นได้แรงกว่า พื้นจึงดันเท้าของทีมนั้นกลับไปทางฝั่งตัวเองได้มากกว่า", correct: true }
      - { id: b, text: "ทีมที่ชนะดึงเชือกด้วยแรงที่มากกว่าแรงที่เชือกดึงทีมนั้นกลับ", feedback: "แรงที่ทีมดึงเชือกและแรงที่เชือกดึงทีมเป็นคู่ตามกฎข้อที่ 3 จึงเท่ากันเสมอ ไม่มีทางที่แรงหนึ่งจะมากกว่าอีกแรง" }
      - { id: c, text: "แรงกิริยาของทีมที่ชนะมากกว่าแรงปฏิกิริยา", feedback: "แรงกิริยาและแรงปฏิกิริยามีขนาดเท่ากันเสมอ ต้องดูแรงอื่นที่กระทำต่อแต่ละทีม" }
      - { id: d, text: "แรงคู่ในเชือกหักล้างกัน ผลแพ้ชนะจึงขึ้นกับโชคเท่านั้น", feedback: "การเคลื่อนที่ของแต่ละทีมขึ้นกับแรงลัพธ์ที่กระทำต่อทีมนั้น ซึ่งรวมแรงจากพื้นด้วย จึงไม่ได้ขึ้นกับโชค" }
    hints:
      - "วาดแผนภาพแรงของทีมหนึ่งทีม: มีแรงจากเชือกและแรงจากพื้น"
      - "ถ้าแรงจากเชือกเท่ากันทั้งสองทีม ความต่างต้องมาจากแรงใด"
    solution: "แรงจากเชือกต่อทั้งสองทีมเท่ากัน ความต่างอยู่ที่แรงเสียดทานจากพื้น ทีมที่ยันเท้าดันพื้นได้แรงกว่า พื้นก็ดันทีมนั้นกลับมากกว่า (กฎข้อที่ 3) แรงลัพธ์ต่อทีมนั้นจึงชี้ไปทางของตน ส่วนอีกทีมได้แรงจากพื้นน้อยกว่าแรงจากเชือก จึงถูกลากไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.n3.p009
    topics: [physics.dynamics.newton-third]
    difficulty: 4
    type: numeric
    stem: "พ่อค้าลูกชิ้นยืนบนพื้นแล้วดึงเชือกที่ผูกกับรถเข็นด้วยแรง $40\\ \\mathrm{N}$ ในแนวราบ ถนนให้แรงเสียดทานต่อรถเข็น $15\\ \\mathrm{N}$ ทำให้แรงลัพธ์ต่อรถเข็นเป็น $25\\ \\mathrm{N}$ แรงที่เชือกดึงมือพ่อค้ามีขนาดเท่าใด (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 40, unit: N }
    hints:
      - "แรงที่เชือกดึงมือพ่อค้า เป็นคู่กิริยา–ปฏิกิริยากับแรงใด"
      - "แรงเสียดทานและแรงลัพธ์ต่อรถเข็นเกี่ยวกับรถเข็น ไม่ได้เกี่ยวกับแรงคู่ระหว่างมือกับเชือก"
    misconceptions:
      - { match: 25, feedback: "นั่นคือแรงลัพธ์ที่กระทำต่อรถเข็น ไม่ใช่แรงที่เชือกดึงมือ แรงที่เชือกดึงมือเป็นคู่ของแรงที่มือดึงเชือก" }
