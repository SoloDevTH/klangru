<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="'Sarabun','Noto Sans Thai','Noto Sans Thai UI','Leelawadee UI','Tahoma','Loma',sans-serif">
<title>บันไดห้าขั้นของการพูดโน้มน้าว</title>
<defs><marker id="a777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker></defs>
<rect x="0" y="0" width="900" height="400" fill="#fff"/>
<text x="20.0" y="34.0" font-size="20" text-anchor="start" fill="#1f5fbf" font-weight="bold">พูดโน้มน้าว 5 ขั้น (ตัวอย่าง: ชวนเพื่อนพกกระบอกน้ำ)</text>
<rect x="20.0" y="330.0" width="200.0" height="48.0" rx="8" fill="#6a1b9a" stroke="#6a1b9a" stroke-width="1.5"/>
<text x="120.0" y="361.0" font-size="18" text-anchor="middle" fill="#fff" font-weight="bold">1 เร้าความสนใจ</text>
<text x="234.0" y="361.0" font-size="16" text-anchor="start" fill="#222" font-weight="normal">"สัปดาห์ที่แล้ว ถังขยะหน้าโรงอาหารเต็มไปด้วยขวดพลาสติก"</text>
<line x1="60.0" y1="328.0" x2="80.0" y2="316.0" stroke="#777" stroke-width="2" stroke-linecap="round" marker-end="url(#a777)"/>
<rect x="56.0" y="264.0" width="200.0" height="48.0" rx="8" fill="#c62828" stroke="#c62828" stroke-width="1.5"/>
<text x="156.0" y="295.0" font-size="18" text-anchor="middle" fill="#fff" font-weight="bold">2 ชี้ปัญหา</text>
<text x="270.0" y="295.0" font-size="16" text-anchor="start" fill="#222" font-weight="normal">ขวดล้นถังทุกวัน พร้อมตัวเลขจากการสำรวจของสภานักเรียน</text>
<line x1="96.0" y1="262.0" x2="116.0" y2="250.0" stroke="#777" stroke-width="2" stroke-linecap="round" marker-end="url(#a777)"/>
<rect x="92.0" y="198.0" width="200.0" height="48.0" rx="8" fill="#2e7d32" stroke="#2e7d32" stroke-width="1.5"/>
<text x="192.0" y="229.0" font-size="18" text-anchor="middle" fill="#fff" font-weight="bold">3 เสนอทางแก้</text>
<text x="306.0" y="229.0" font-size="16" text-anchor="start" fill="#222" font-weight="normal">พกกระบอกน้ำมาเอง และใช้จุดเติมน้ำของโรงเรียน</text>
<line x1="132.0" y1="196.0" x2="152.0" y2="184.0" stroke="#777" stroke-width="2" stroke-linecap="round" marker-end="url(#a777)"/>
<rect x="128.0" y="132.0" width="200.0" height="48.0" rx="8" fill="#1565c0" stroke="#1565c0" stroke-width="1.5"/>
<text x="228.0" y="163.0" font-size="18" text-anchor="middle" fill="#fff" font-weight="bold">4 ให้เห็นภาพ</text>
<text x="342.0" y="163.0" font-size="16" text-anchor="start" fill="#222" font-weight="normal">ถ้าทำ ถังขยะโล่งและประหยัดเงิน ถ้าไม่ทำ ขยะเพิ่มทุกเดือน</text>
<line x1="168.0" y1="130.0" x2="188.0" y2="118.0" stroke="#777" stroke-width="2" stroke-linecap="round" marker-end="url(#a777)"/>
<rect x="164.0" y="66.0" width="200.0" height="48.0" rx="8" fill="#ef6c00" stroke="#ef6c00" stroke-width="1.5"/>
<text x="264.0" y="97.0" font-size="18" text-anchor="middle" fill="#fff" font-weight="bold">5 เรียกร้องให้ทำ</text>
<text x="378.0" y="97.0" font-size="16" text-anchor="start" fill="#222" font-weight="normal">"พรุ่งนี้พกกระบอกน้ำมาคนละใบนะครับ"</text>
</svg>
