topic: engineering.environmental.water-treatment
rows:
  - { framework: th-coe-engineering-basics, indicators: ["ENV-3.4"], coverage: partial, note: "ครอบคลุมความต้องการน้ำ การผสมสารส้ม การกวน การตกตะกอน การกรอง การฆ่าเชื้อ และความดันในเส้นท่อในระดับการคำนวณเบื้องต้น ยังไม่ครอบคลุมการออกแบบโครงข่ายจ่ายน้ำทั้งระบบและการควบคุมอัตโนมัติ" }
  - { framework: th-coe-engineering-basics, indicators: ["ENV-3.2"], coverage: partial, note: "ENV-3.2 คือหน่วยปฏิบัติการ (unit operations and processes) ไม่ใช่งานห้องทดลอง บทนี้สอนการโคแอกกูเลชัน (ค่า G) การกวนช้า การตกตะกอน (อัตราน้ำล้นผิว) การกรอง (อัตรากรอง) และการฆ่าเชื้อ (CT) ในระดับคำนวณเบื้องต้น ไม่สอนการดูดซับ การแลกเปลี่ยนไอออน เยื่อกรอง และการออกแบบหน่วยในรายละเอียด" }
