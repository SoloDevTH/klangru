<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" font-family="sans-serif" font-size="14">
  <title>ฟ้าและต้นใช้รหัสผ่านเดียวกัน แต่ได้ซอลต์สุ่มต่างกัน เมื่อผ่านฟังก์ชันแฮชที่ช้า ได้ค่าแฮชต่างกัน ฐานข้อมูลเก็บซอลต์และค่าแฮช ไม่เก็บรหัสผ่าน</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="900" height="260" fill="#ffffff"/>
  <text x="20.0" y="70.0" font-size="16" text-anchor="start" fill="#1f2937" font-weight="bold" xml:space="preserve">ฟ้า</text>
  <rect x="80.0" y="40.0" width="150.0" height="56.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
