problems:
  - id: math.rp.p001
    topics: [math.number.ratio-percent]
    difficulty: 1
    type: numeric
    stem: "25% ของ 80 เท่ากับเท่าใด"
    answer: { value: 20 }
    hints:
      - "25% หมายถึง $\\tfrac{25}{100}$"
      - "คูณ $\\tfrac{25}{100}$ หรือ 0.25 กับ 80"
    misconceptions:
      - { match: 3.2, feedback: "ดูเหมือนนำ 80 หารด้วย 25 การหาร้อยละของจำนวนใดต้องคูณ: $\\tfrac{25}{100} \\times 80$" }
      - { match: 55, feedback: "ดูเหมือนนำ 80 ลบ 25 ร้อยละ 25 ไม่ได้แปลว่า 25 หน่วย แต่แปลว่า 25 ส่วนจาก 100 ส่วน" }
    solution: "$25\\% \\times 80 = \\tfrac{25}{100} \\times 80 = 0.25 \\times 80 = 20$ (หรือคิดว่า 25% คือหนึ่งในสี่ $80 \\div 4 = 20$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rp.p002
    topics: [math.number.ratio-percent]
    difficulty: 1
    type: mcq
    stem: "อัตราส่วนใดเท่ากับ $2 : 3$"
    choices:
      - { id: a, text: "$8 : 12$", correct: true }
      - { id: b, text: "$3 : 2$", feedback: "นี่คือการสลับลำดับ ลำดับในอัตราส่วนสำคัญ $3 : 2$ หมายถึงตัวแรกมากกว่าตัวหลัง ซึ่งตรงข้ามกับ $2 : 3$" }
      - { id: c, text: "$4 : 5$", feedback: "ดูเหมือนบวก 2 ทั้งสองตัว อัตราส่วนที่เท่ากันต้องคูณหรือหารด้วยจำนวนเดียวกัน ไม่ใช่บวก" }
      - { id: d, text: "$5 : 6$", feedback: "ดูเหมือนบวก 3 ทั้งสองตัว อัตราส่วนที่เท่ากันต้องคูณหรือหารด้วยจำนวนเดียวกัน ไม่ใช่บวก" }
    hints:
      - "อัตราส่วนที่เท่ากันได้จากการคูณทั้งสองตัวด้วยจำนวนเดียวกัน"
      - "ลองหารแต่ละตัวเลือกด้วยจำนวนที่หารทั้งสองตัวลงตัว แล้วดูว่าได้ $2 : 3$ หรือไม่"
    solution: "$2 : 3 = (2 \\times 4) : (3 \\times 4) = 8 : 12$ ตรวจ: $\\tfrac{8}{12} = \\tfrac{2}{3}$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rp.p003
    topics: [math.number.ratio-percent]
    difficulty: 2
    type: numeric
    stem: "ร้านน้ำหวานผสมน้ำแดงกับน้ำเปล่าในอัตราส่วน $1 : 4$ ถ้าใช้น้ำแดง 150 มิลลิลิตร ต้องใช้น้ำเปล่ากี่มิลลิลิตร"
    answer: { value: 600, unit: mL }
    hints:
      - "น้ำแดง 1 ส่วนต้องใช้น้ำเปล่า 4 ส่วน"
      - "ตั้งสัดส่วน $\\tfrac{1}{4} = \\tfrac{150}{x}$ หรือหาว่า 1 ส่วนเท่ากับกี่มิลลิลิตร"
    misconceptions:
      - { match: 37.5, feedback: "ดูเหมือนนำ 150 หารด้วย 4 แต่น้ำเปล่าต้องมากกว่าน้ำแดง 4 เท่า จึงต้องคูณ" }
      - { match: 750, feedback: "นั่นคือปริมาณน้ำหวานทั้งหมด (น้ำแดงรวมน้ำเปล่า 5 ส่วน) โจทย์ถามเฉพาะน้ำเปล่า" }
    solution: "1 ส่วน = 150 mL น้ำเปล่า 4 ส่วน $= 4 \\times 150 = 600$ mL ตรวจ: $150 : 600 = 1 : 4$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rp.p004
    topics: [math.number.ratio-percent]
    difficulty: 2
    type: numeric
    stem: "เสื้อตัวหนึ่งติดราคา 850 บาท ห้างลดราคา 20% ต้องจ่ายกี่บาท"
    answer: { value: 680, unit: บาท }
    hints:
      - "ส่วนลดคือ 20% ของ 850 บาท"
      - "ราคาที่จ่าย = ราคาเดิม − ส่วนลด หรือคิดว่าจ่าย 80% ของราคาเดิม"
    misconceptions:
      - { match: 170, feedback: "170 บาทคือส่วนลด ยังต้องนำไปลบออกจากราคาเดิม" }
      - { match: 830, feedback: "ดูเหมือนลด 20 บาท แต่โจทย์ลด 20% ของราคา ซึ่งคือ $0.2 \\times 850$" }
    solution: "ส่วนลด $= 0.2 \\times 850 = 170$ บาท จ่าย $850 - 170 = 680$ บาท (หรือ $0.8 \\times 850 = 680$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rp.p005
    topics: [math.number.ratio-percent]
    difficulty: 3
    type: numeric
    stem: "พ่อค้าซื้อทุเรียนมาลูกละ 250 บาท ขายลูกละ 300 บาท ได้กำไรร้อยละเท่าใด (ตอบเป็นตัวเลขในหน่วย %)"
    answer: { value: 20, unit: "%" }
    hints:
      - "กำไร = ราคาขาย − ทุน"
      - "กำไรร้อยละต้องเทียบกับทุน: $\\tfrac{\\text{กำไร}}{\\text{ทุน}} \\times 100$"
    misconceptions:
      - { match: 16.67, feedback: "ดูเหมือนหารกำไรด้วยราคาขาย 300 บาท กำไรร้อยละต้องเทียบกับทุน 250 บาทเสมอ" }
      - { match: 50, feedback: "50 บาทคือกำไรเป็นเงิน โจทย์ถามกำไรเป็นร้อยละของทุน" }
    solution: "กำไร $= 300 - 250 = 50$ บาท กำไรร้อยละ $= \\tfrac{50}{250} \\times 100 = 20$ ได้กำไร 20%"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rp.p006
    topics: [math.number.ratio-percent]
    difficulty: 3
    type: numeric
    stem: "ฝากเงิน 12,000 บาทกับธนาคาร ได้ดอกเบี้ยอย่างง่าย 1.5% ต่อปี เมื่อครบ 4 ปีจะได้ดอกเบี้ยกี่บาท"
    answer: { value: 720, unit: บาท }
    hints:
      - "ใช้ $I = P \\times r \\times t$"
      - "เปลี่ยน 1.5% เป็นทศนิยมก่อน: $r = 0.015$"
    misconceptions:
      - { match: 180, feedback: "นั่นคือดอกเบี้ยปีเดียว ฝาก 4 ปี ต้องคูณด้วย 4" }
      - { match: 72000, feedback: "ดูเหมือนใช้ $r = 1.5$ ต้องเปลี่ยนร้อยละเป็นทศนิยมก่อน $1.5\\% = 0.015$" }
    solution: "$I = 12{,}000 \\times 0.015 \\times 4 = 180 \\times 4 = 720$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rp.p007
    topics: [math.number.ratio-percent]
    difficulty: 3
    type: match
    stem: "จับคู่ร้อยละกับจำนวนที่เท่ากัน"
    pairs:
      - { left: "$50\\%$", right: "$\\tfrac{1}{2}$" }
      - { left: "$5\\%$", right: "$0.05$" }
      - { left: "$125\\%$", right: "$1.25$" }
      - { left: "$12.5\\%$", right: "$\\tfrac{1}{8}$" }
    hints:
      - "ร้อยละ $x$ เท่ากับ $\\tfrac{x}{100}$"
      - "หารด้วย 100 คือเลื่อนจุดทศนิยมไปทางซ้ายสองตำแหน่ง แล้วค่อยเทียบกับเศษส่วน"
    solution: "$50\\% = 0.5 = \\tfrac{1}{2}$ · $5\\% = 0.05$ (ไม่ใช่ 0.5) · $125\\% = 1.25$ · $12.5\\% = 0.125 = \\tfrac{1}{8}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rp.p008
    topics: [math.number.ratio-percent]
    difficulty: 4
    type: mcq
    stem: "ร้านค้าลดราคาสินค้า 30% แล้วลดเพิ่มอีก 20% จากราคาที่ลดแล้ว เท่ากับลดจากราคาเดิมทั้งหมดกี่เปอร์เซ็นต์"
    choices:
      - { id: a, text: "44%", correct: true }
      - { id: b, text: "50%", feedback: "ดูเหมือนบวก 30% กับ 20% แต่ครั้งที่สองลด 20% จากราคาที่ลดแล้ว ซึ่งน้อยกว่าราคาเดิม จึงลดได้น้อยกว่า 20% ของราคาเดิม" }
      - { id: c, text: "6%", feedback: "ดูเหมือนคูณ $0.3 \\times 0.2$ ต้องคูณส่วนที่ **เหลือ** คือ $0.7 \\times 0.8$" }
      - { id: d, text: "ขึ้นอยู่กับราคาสินค้า", feedback: "ไม่ขึ้นกับราคา ไม่ว่าสินค้าราคาเท่าใด ราคาสุดท้ายจะเป็น $0.7 \\times 0.8 = 0.56$ ของราคาเดิมเสมอ ลองสมมติราคา 100 บาทดู" }
    hints:
      - "สมมติราคาเดิม 100 บาท"
      - "ลด 30% เหลือ 70% ของราคา แล้วลด 20% เหลือ 80% ของราคาใหม่ ให้คูณสองส่วนที่เหลือนี้"
    solution: "ราคาเหลือ $0.7 \\times 0.8 = 0.56$ ของราคาเดิม หรือ 56% จึงลดไปทั้งหมด $100\\% - 56\\% = 44\\%$ ตรวจด้วยราคา 100 บาท: ลดเหลือ 70 บาท แล้วลดอีก 14 บาท เหลือ 56 บาท ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rp.p009
    topics: [math.number.ratio-percent]
    difficulty: 4
    type: numeric
    stem: "พี่ขายโทรศัพท์มือถือเครื่องเก่าไปในราคา 7,800 บาท ขาดทุน 20% พี่ซื้อโทรศัพท์เครื่องนี้มาราคากี่บาท"
    answer: { value: 9750, unit: บาท }
    hints:
      - "ขาดทุน 20% คิดจากทุน ราคาขายจึงเท่ากับ 80% ของทุน"
      - "ตั้งสมการ $0.8 \\times \\text{ทุน} = 7{,}800$ แล้วหาร 0.8 ทั้งสองข้าง"
    misconceptions:
      - { match: 9360, feedback: "ดูเหมือนบวก 20% ของราคาขาย ($7{,}800 \\times 1.2$) แต่การขาดทุน 20% คิดจากทุน ไม่ใช่จากราคาขาย" }
      - { match: 6240, feedback: "นั่นคือการลด 20% จากราคาขาย ทุนต้องมากกว่าราคาขาย เพราะขายแล้วขาดทุน" }
    solution: "ราคาขาย $= 80\\%$ ของทุน → $0.8 \\times \\text{ทุน} = 7{,}800$ → ทุน $= 7{,}800 \\div 0.8 = 9{,}750$ บาท ตรวจ: ขาดทุน $9{,}750 - 7{,}800 = 1{,}950$ และ $\\tfrac{1{,}950}{9{,}750} = 20\\%$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rp.p010
    topics: [math.number.ratio-percent]
    difficulty: 4
    type: numeric
    stem: "แผนที่จังหวัดเชียงใหม่ใช้มาตราส่วน $1 : 50{,}000$ ระยะบนแผนที่ระหว่างสองอำเภอวัดได้ 7.5 เซนติเมตร ระยะจริงเป็นกี่กิโลเมตร"
    answer: { value: 3.75, unit: km, tolerance: 0.03 }
    hints:
      - "มาตราส่วน $1 : 50{,}000$ แปลว่า 1 cm บนแผนที่เท่ากับ 50,000 cm จริง"
      - "คูณ 7.5 ด้วย 50,000 จะได้ระยะจริงในหน่วยเซนติเมตร"
      - "1 km = 1,000 m = 100,000 cm"
    misconceptions:
      - { match: 375, feedback: "ดูเหมือนแปลงหน่วยผิด 1 km เท่ากับ 100,000 cm ไม่ใช่ 1,000 cm" }
      - { match: 3750, feedback: "นั่นคือระยะในหน่วยเมตร โจทย์ถามเป็นกิโลเมตร ต้องหาร 1,000 อีกครั้ง" }
    solution: "ระยะจริง $= 7.5 \\times 50{,}000 = 375{,}000$ cm $= 3{,}750$ m $= 3.75$ km"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rp.p011
    topics: [math.number.ratio-percent]
    difficulty: 5
    type: numeric
    stem: "ร้านขึ้นราคาข้าวสารถุงหนึ่ง 20% ต่อมาลดราคาลง 20% จากราคาใหม่ ราคาสุดท้ายน้อยกว่าราคาเริ่มต้นกี่เปอร์เซ็นต์ (ถ้าเท่าเดิมให้ตอบ 0)"
    answer: { value: 4, unit: "%" }
    hints:
      - "สมมติราคาเริ่มต้น 100 บาท"
      - "ขึ้น 20% คือคูณ 1.2 แล้วลด 20% คือคูณ 0.8"
      - "เทียบราคาสุดท้ายกับราคาเริ่มต้น"
    misconceptions:
      - { match: 0, feedback: "ขึ้น 20% แล้วลด 20% ไม่ได้กลับมาเท่าเดิม เพราะการลดคิดจากราคาใหม่ที่สูงขึ้นแล้ว จึงลดได้มากกว่าที่ขึ้นไป" }
    solution: "สมมติราคา 100 บาท ขึ้น 20% เป็น $100 \\times 1.2 = 120$ บาท ลด 20% เหลือ $120 \\times 0.8 = 96$ บาท ราคาสุดท้ายน้อยกว่าเดิม $100 - 96 = 4$ บาท คือ 4% (เพราะ $1.2 \\times 0.8 = 0.96$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rp.p012
    topics: [math.number.ratio-percent]
    difficulty: 4
    type: numeric
    stem: "เพื่อนสามคนร่วมกันเปิดร้านก๋วยเตี๋ยว ลงทุนในอัตราส่วน $2 : 3 : 4$ สิ้นปีได้กำไร 36,000 บาท แบ่งตามอัตราส่วนเงินลงทุน คนที่ลงทุนมากที่สุดได้กี่บาท"
    answer: { value: 16000, unit: บาท }
    hints:
      - "รวมส่วนทั้งหมด: $2 + 3 + 4$"
      - "หาว่า 1 ส่วนเท่ากับกี่บาท แล้วคูณด้วยจำนวนส่วนของคนที่ลงทุนมากที่สุด"
    misconceptions:
      - { match: 12000, feedback: "นั่นคือการแบ่งเท่ากันสามคน โจทย์ให้แบ่งตามอัตราส่วน $2 : 3 : 4$" }
      - { match: 4000, feedback: "4,000 บาทคือ 1 ส่วน คนที่ลงทุนมากที่สุดได้ 4 ส่วน" }
    solution: "รวม $2 + 3 + 4 = 9$ ส่วน 1 ส่วน $= 36{,}000 \\div 9 = 4{,}000$ บาท คนที่ลงทุนมากที่สุดได้ 4 ส่วน $= 16{,}000$ บาท ตรวจ: $8{,}000 + 12{,}000 + 16{,}000 = 36{,}000$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rp.p013
    topics: [math.number.ratio-percent]
    difficulty: 5
    type: numeric
    stem: "ร้านเครื่องใช้ไฟฟ้าติดราคาพัดลมไว้สูงกว่าทุน 40% แล้วลดราคาให้ลูกค้า 10% จากราคาที่ติดไว้ ร้านได้กำไรกี่เปอร์เซ็นต์ของทุน"
    answer: { value: 26, unit: "%" }
    hints:
      - "สมมติทุน 100 บาท แล้วหาราคาที่ติดไว้"
      - "ลด 10% จากราคาที่ติดไว้ คือคูณราคาที่ติดไว้ด้วย 0.9"
      - "เทียบราคาขายจริงกับทุน 100 บาท"
    misconceptions:
      - { match: 30, feedback: "ดูเหมือนนำ 40% ลบ 10% ตรง ๆ แต่ส่วนลด 10% คิดจากราคาที่ติดไว้ ซึ่งสูงกว่าทุน จึงลดไปมากกว่า 10% ของทุน" }
    solution: "สมมติทุน 100 บาท ติดราคา $100 \\times 1.4 = 140$ บาท ลด 10% เหลือ $140 \\times 0.9 = 126$ บาท กำไร $126 - 100 = 26$ บาท คือ 26% ของทุน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rp.p014
    topics: [math.number.ratio-percent]
    difficulty: 2
    type: numeric
    stem: "น้องเดินรอบสวนลุมพินีได้ $\\tfrac12$ กิโลเมตรในเวลา $\\tfrac14$ ชั่วโมง น้องเดินด้วยอัตราเร็วกี่กิโลเมตรต่อชั่วโมง (ตอบในหน่วย km/h)"
    answer: { value: 2, unit: km/h }
    hints:
      - "อัตราเร็ว = ระยะทาง ÷ เวลา"
      - "หารด้วย $\\tfrac14$ เท่ากับคูณด้วย $4$"
    misconceptions:
      - { match: 0.125, feedback: "ดูเหมือนคูณ $\\tfrac12 \\times \\tfrac14$ อัตราต่อหน่วยต้องหาร: ระยะทาง ÷ เวลา" }
      - { match: 0.5, feedback: "ดูเหมือนหารกลับด้านเป็น $\\tfrac14 \\div \\tfrac12$ ซึ่งได้ชั่วโมงต่อกิโลเมตร ต้องเป็นกิโลเมตรต่อชั่วโมง" }
    solution: "$\\dfrac{1/2}{1/4} = \\dfrac12 \\times 4 = 2$ กิโลเมตรต่อชั่วโมง (ใน 1 ชั่วโมงมี $\\tfrac14$ ชั่วโมง 4 ช่วง เดินได้ $4 \\times \\tfrac12 = 2$ km)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rp.p015
    topics: [math.number.ratio-percent]
    difficulty: 3
    type: expression
    stem: "ร้านอาหารคิดค่าบริการ 10% ของราคาอาหาร แล้วคิดภาษีมูลค่าเพิ่ม 7% จากยอดที่รวมค่าบริการแล้ว ถ้าราคาอาหาร $x$ บาท เขียนยอดที่ต้องจ่ายในรูปของ $x$"
    prefix: "ยอดที่ต้องจ่าย ="
    answer: { latex: "1.177x", variables: [x] }
    hints:
      - "บวกค่าบริการ 10% คือคูณด้วย $1.1$"
      - "บวก VAT 7% จากยอดใหม่ คือคูณยอดนั้นด้วย $1.07$"
    misconceptions:
      - { match: "1.17x", feedback: "ดูเหมือนบวกร้อยละตรง ๆ $10\\% + 7\\%$ แต่ VAT คิดจากยอดที่รวมค่าบริการแล้ว ต้องคูณ $1.1 \\times 1.07$" }
      - { match: "0.177x", feedback: "นั่นคือส่วนที่จ่ายเพิ่ม ยังต้องรวมราคาอาหาร $x$ ด้วย" }
    solution: "หลังค่าบริการ: $1.1x$ หลัง VAT: $1.07 \\times 1.1x = 1.177x$ บาท เช่น อาหาร 1,000 บาท จ่าย 1,177 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rp.p016
    topics: [math.number.ratio-percent]
    difficulty: 2
    type: mcq
    stem: "ตารางใดแสดงความสัมพันธ์ที่ $y$ เป็นสัดส่วนกับ $x$ (คู่ $(x, y)$)"
    choices:
      - { id: a, text: "$(1, 3)$, $(2, 6)$, $(5, 15)$", correct: true }
      - { id: b, text: "$(1, 4)$, $(2, 6)$, $(3, 8)$", feedback: "$y$ เพิ่มทีละ 2 เท่ากันก็จริง แต่ $\\tfrac{4}{1} \\ne \\tfrac{6}{2}$ ความสัมพันธ์นี้คือ $y = 2x + 2$ ไม่ผ่านจุดกำเนิด" }
      - { id: c, text: "$(2, 5)$, $(4, 10)$, $(6, 16)$", feedback: "สองคู่แรกได้ $\\tfrac{y}{x} = 2.5$ แต่คู่สุดท้ายได้ $\\tfrac{16}{6} \\approx 2.67$ ต้องเท่ากันทุกคู่" }
      - { id: d, text: "$(1, 1)$, $(2, 4)$, $(3, 9)$", feedback: "$\\tfrac{y}{x}$ เป็น 1, 2, 3 ไม่คงที่ นี่คือ $y = x^2$" }
    hints:
      - "หาร $y$ ด้วย $x$ ในทุกคู่"
      - "เป็นสัดส่วนเมื่อได้ค่าเดียวกันทุกคู่"
    solution: "$\\tfrac{3}{1} = \\tfrac{6}{2} = \\tfrac{15}{5} = 3$ จึงเป็น $y = 3x$ ชุดอื่นมี $\\tfrac{y}{x}$ ไม่คงที่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rp.p017
    topics: [math.number.ratio-percent]
    difficulty: 3
    type: numeric
    stem: "กราฟแสดงราคามะม่วงน้ำดอกไม้ที่ตลาดกับน้ำหนัก ราคาเป็นสัดส่วนกับน้ำหนัก ค่าคงตัวของการแปรผัน (ราคาต่อ 1 กิโลกรัม) เป็นกี่บาท (ตอบในหน่วยบาทต่อกิโลกรัม)"
    figure: { src: mango-price.svg, alt: "กราฟเส้นตรงของราคา (บาท) กับน้ำหนัก (กิโลกรัม) เริ่มที่จุดกำเนิด มีจุดเน้นที่ (0, 0) (2, 70) และ (4, 140) แกนราคาแบ่งช่องละ 35 บาท" }
    answer: { value: 35, unit: บาท/kg }
    hints:
      - "อ่านจุดบนกราฟที่อ่านค่าได้ชัด เช่น 2 กิโลกรัม"
      - "ค่าคงตัว $k = \\tfrac{y}{x}$ หรือค่า $y$ ที่ $x = 1$"
    misconceptions:
      - { match: 70, feedback: "นั่นคือราคาของ 2 กิโลกรัม ต้องหารด้วย 2 เพื่อได้ราคาต่อ 1 กิโลกรัม" }
      - { match: 0.03, feedback: "ดูเหมือนหาร $\\tfrac{x}{y}$ ซึ่งได้กิโลกรัมต่อบาท ค่าคงตัวในที่นี้คือบาทต่อกิโลกรัม $\\tfrac{y}{x}$" }
    solution: "จากจุด $(2, 70)$: $k = \\tfrac{70}{2} = 35$ บาทต่อกิโลกรัม ตรวจด้วย $(4, 140)$: $\\tfrac{140}{4} = 35$ ✓ สมการคือ $y = 35x$ และจุด $(1, 35)$ บอกว่า 1 กิโลกรัมราคา 35 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rp.p018
    topics: [math.number.ratio-percent]
    difficulty: 3
    type: numeric
    stem: "ในงานวัด มีเกมทายจำนวนเม็ดถั่วในโหล น้องทายว่า 450 เม็ด แต่ที่จริงมี 500 เม็ด การทายครั้งนี้คลาดเคลื่อนร้อยละเท่าใด (ตอบเป็นตัวเลขในหน่วย %)"
    answer: { value: 10, unit: "%" }
    hints:
      - "ร้อยละความคลาดเคลื่อน $= \\dfrac{|\\text{ค่าที่ทาย} - \\text{ค่าจริง}|}{\\text{ค่าจริง}} \\times 100$"
      - "ตัวหารคือค่าจริง 500 ไม่ใช่ค่าที่ทาย"
    misconceptions:
      - { match: 11.11, feedback: "ดูเหมือนหารด้วยค่าที่ทาย (450) ความคลาดเคลื่อนต้องเทียบกับค่าจริง (500)" }
      - { match: 50, feedback: "นั่นคือจำนวนเม็ดที่ต่างกัน ยังต้องเทียบกับค่าจริงแล้วคูณ 100" }
    solution: "$\\dfrac{|450 - 500|}{500} \\times 100 = \\dfrac{50}{500} \\times 100 = 10\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rp.p019
    topics: [math.number.ratio-percent]
    difficulty: 4
    type: numeric
    stem: "แบบแปลนบ้านใช้มาตราส่วน $1 : 100$ ห้องนอนบนแบบกว้าง $3.5\\ \\mathrm{cm}$ ยาว $4\\ \\mathrm{cm}$ ห้องนอนจริงมีพื้นที่กี่ตารางเมตร (ตอบในหน่วย m²)"
    figure: { src: floor-plan.svg, alt: "แบบแปลนมาตราส่วน 1 : 100 ห้องนอนเป็นสี่เหลี่ยมผืนผ้ายาว 4 cm กว้าง 3.5 cm บนแบบ มีห้องน้ำเล็กติดอยู่ทางขวาบน" }
    answer: { value: 14, unit: m² }
    hints:
      - "แปลงความยาวแต่ละด้านเป็นของจริงก่อน: 1 cm บนแบบ = 100 cm = 1 m"
      - "ห้องจริงกว้าง 3.5 m ยาว 4 m แล้วคูณกัน"
    misconceptions:
      - { match: 0.14, feedback: "ดูเหมือนคูณพื้นที่บนแบบ $14\\ \\mathrm{cm^2}$ ด้วย 100 ตามมาตราส่วนความยาว พื้นที่ต้องคูณด้วย $100^2$ ปลอดภัยกว่าคือแปลงแต่ละด้านก่อนคูณ" }
      - { match: 1400, feedback: "$1{,}400$ คือ $14 \\times 100$ ในหน่วย $\\mathrm{cm^2}$ ซึ่งยังขยายแค่ทางเดียว ห้องจริงกว้าง 3.5 m ยาว 4 m" }
    solution: "ด้านจริง: $3.5 \\times 100 = 350\\ \\mathrm{cm} = 3.5\\ \\mathrm{m}$ และ $4 \\times 100 = 400\\ \\mathrm{cm} = 4\\ \\mathrm{m}$ พื้นที่ $= 3.5 \\times 4 = 14\\ \\mathrm{m^2}$ (พื้นที่บนแบบ $14\\ \\mathrm{cm^2}$ คูณ $100^2 = 10{,}000$ ได้ $140{,}000\\ \\mathrm{cm^2} = 14\\ \\mathrm{m^2}$ เช่นกัน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rp.p020
    topics: [math.number.ratio-percent]
    difficulty: 4
    type: numeric
    stem: "ใบเสร็จร้านค้าระบุราคารวมภาษีมูลค่าเพิ่ม 7% เป็น 535 บาท ราคาสินค้าก่อนภาษีเป็นกี่บาท (ตอบในหน่วยบาท)"
    answer: { value: 500, tolerance: 0.01, unit: บาท }
    hints:
      - "ราคารวมภาษี $= 1.07 \\times$ ราคาก่อนภาษี"
      - "ย้อนกลับด้วยการหารด้วย $1.07$"
    misconceptions:
      - { match: 497.55, feedback: "ดูเหมือนคิด $535 \\times 0.93$ แต่ 7% คิดจากราคาก่อนภาษี ไม่ใช่จาก 535 บาท ต้องหารด้วย $1.07$" }
      - { match: 37.45, feedback: "นั่นคือ 7% ของ 535 ซึ่งไม่ใช่ทั้งภาษีจริงและไม่ใช่ราคาก่อนภาษี" }
    solution: "ให้ราคาก่อนภาษี $P$: $1.07P = 535$ ได้ $P = 535 \\div 1.07 = 500$ บาท (ภาษี $35$ บาท) ตรวจ: $500 \\times 1.07 = 535$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rp.p021
    topics: [math.number.ratio-percent]
    difficulty: 2
    type: numeric
    stem: "รถวิ่งบนทางด่วนด้วยอัตราเร็ว $90$ กิโลเมตรต่อชั่วโมง เท่ากับกี่เมตรต่อวินาที (ตอบในหน่วย m/s)"
    answer: { value: 25, unit: m/s }
    hints:
      - "1 กิโลเมตร = 1,000 เมตร และ 1 ชั่วโมง = 3,600 วินาที"
      - "คำนวณ $\\dfrac{90 \\times 1{,}000\\ \\mathrm{m}}{3{,}600\\ \\mathrm{s}}$"
    misconceptions:
      - { match: 324, feedback: "ดูเหมือนคูณด้วย 3.6 การแปลง km/h เป็น m/s ต้องหารด้วย 3.6 (ตัวเลขควรเล็กลง เพราะ 1 วินาทีสั้นกว่า 1 ชั่วโมงมาก)" }
      - { match: 1.5, feedback: "ดูเหมือนหารด้วย 60 ครั้งเดียว ซึ่งได้กิโลเมตรต่อนาที ต้องเปลี่ยนทั้งกิโลเมตรเป็นเมตรและชั่วโมงเป็นวินาที" }
    solution: "$90\\ \\mathrm{km/h} = \\dfrac{90 \\times 1{,}000}{3{,}600} = \\dfrac{90{,}000}{3{,}600} = 25\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.rp.p022
    topics: [math.number.ratio-percent]
    difficulty: 3
    type: numeric
    stem: "หลังรถไฟฟ้าสายใหม่เปิด ราคาที่ดินแปลงหนึ่งเพิ่มจากตารางวาละ 80,000 บาท เป็นตารางวาละ 200,000 บาท ราคาเพิ่มขึ้นกี่เปอร์เซ็นต์ (ตอบเป็นตัวเลขในหน่วย %)"
    answer: { value: 150, unit: "%" }
    hints:
      - "ร้อยละการเปลี่ยนแปลง $= \\dfrac{\\text{ค่าใหม่} - \\text{ค่าเดิม}}{\\text{ค่าเดิม}} \\times 100$"
      - "ราคาเพิ่มขึ้น $120{,}000$ บาท เทียบกับราคาเดิม $80{,}000$ บาท ร้อยละมากกว่า 100 ได้"
    misconceptions:
      - { match: 250, feedback: "นั่นคือราคาใหม่คิดเป็นร้อยละของราคาเดิม ($200{,}000$ เป็น $250\\%$ ของ $80{,}000$) ส่วนที่เพิ่มขึ้นคือ $250\\% - 100\\%$" }
      - { match: 60, feedback: "ดูเหมือนหารด้วยราคาใหม่ ร้อยละการเปลี่ยนแปลงต้องเทียบกับค่าเดิม" }
    solution: "$\\dfrac{200{,}000 - 80{,}000}{80{,}000} \\times 100 = \\dfrac{120{,}000}{80{,}000} \\times 100 = 150\\%$ หรือมองแบบตัวคูณ: ราคาใหม่ $= 2.5 \\times$ ราคาเดิม เพิ่มขึ้น $2.5 - 1 = 1.5 = 150\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true
