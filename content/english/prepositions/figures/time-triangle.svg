<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="sans-serif">
<title>in on at กับเวลา จากช่วงกว้างไปจุดเจาะจง</title>
<rect x="0" y="0" width="640" height="330" fill="#fff"/>
<polygon points="135.0,20.0 465.0,20.0 502.0,110.0 98.0,110.0" fill="#fde3d8" stroke="#111" stroke-width="0" stroke-linejoin="round"/>
<polygon points="98.0,110.0 502.0,110.0 538.9,200.0 61.1,200.0" fill="#e3effa" stroke="#111" stroke-width="0" stroke-linejoin="round"/>
<polygon points="61.1,200.0 538.9,200.0 580.0,300.0 20.0,300.0" fill="#e6f4e6" stroke="#111" stroke-width="0" stroke-linejoin="round"/>
<polygon points="135.0,20.0 465.0,20.0 580.0,300.0 20.0,300.0" fill="none" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="98.0" y1="110.0" x2="502.0" y2="110.0" stroke="#111" stroke-width="2" stroke-linecap="round"/>
<line x1="61.1" y1="200.0" x2="538.9" y2="200.0" stroke="#111" stroke-width="2" stroke-linecap="round"/>
<text x="300.0" y="72.0" font-size="24" text-anchor="middle" fill="#b23" font-weight="bold">at</text>
<text x="300.0" y="98.0" font-size="13" text-anchor="middle" fill="#111" font-weight="normal">เวลา: at 8 o'clock · at noon · at night</text>
<text x="300.0" y="146.0" font-size="24" text-anchor="middle" fill="#1f4e9c" font-weight="bold">on</text>
<text x="300.0" y="172.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">วัน วันที่: on Monday · on 13 April</text>
<text x="300.0" y="192.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">on my birthday</text>
<text x="300.0" y="236.0" font-size="24" text-anchor="middle" fill="#2e7d32" font-weight="bold">in</text>
<text x="300.0" y="262.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">เดือน ปี ฤดู ช่วงของวัน: in April · in 2025</text>
<text x="300.0" y="284.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">in the rainy season · in the morning</text>
<text x="632.0" y="40.0" font-size="14" text-anchor="end" fill="#555" font-weight="normal">เจาะจง</text>
<text x="632.0" y="320.0" font-size="14" text-anchor="end" fill="#555" font-weight="normal">ช่วงกว้าง</text>
<line x1="605.0" y1="275.0" x2="605.0" y2="55.0" stroke="#777" stroke-width="1.5" stroke-linecap="round"/>
<polygon points="605.0,55.0 609.3,64.0 600.7,64.0" fill="#777" stroke="#777" stroke-width="1" stroke-linejoin="round"/>
</svg>
