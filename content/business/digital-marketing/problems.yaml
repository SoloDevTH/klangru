  - กำไรขั้นต้นหลังหักโฆษณา $=$ ยอดขาย $\times 40\% -$ ค่าโฆษณา
  solution: ยอดขาย $52{,}500$ บาท กำไรขั้นต้น $52{,}500 \times 0.4 = 21{,}000$ บาท หักค่าโฆษณา $9{,}000$ บาท เหลือ $12{,}000$ บาท (ยังไม่หักต้นทุนอื่น เช่น ค่าจัดส่ง)
