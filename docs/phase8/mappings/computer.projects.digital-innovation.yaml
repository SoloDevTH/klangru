topic: computer.projects.digital-innovation
rows:
  - { framework: th-core-2560-science, indicators: ["ว 4.2 ม.5/1"], coverage: partial, note: "รวบรวมและวิเคราะห์ข้อมูล (ยอดขาย กำไรรวม ร้อยละที่เปลี่ยน อัตราการเปลี่ยนเป็นผู้ซื้อ คะแนนถ่วงน้ำหนัก) และใช้วิทยาการคอมพิวเตอร์ สื่อดิจิทัล และเทคโนโลยีสารสนเทศเพิ่มมูลค่าให้สินค้าและบริการของชุมชน (กล้วยตาก ผ้าทอ มะม่วง ร้านซ่อมจักรยาน) แต่การสร้างสรรค์ชิ้นงานกับผลิตภัณฑ์หรือบริการจริงทำนอกแอปคลังรู้" }
  - { framework: uk-nc-computing, indicators: ["UKNC-CO-KS3-07"], coverage: partial, note: "เลือก ใช้ และเชื่อมหลายแอป (แบบฟอร์ม ตารางคำนวณ หน้าเว็บ คิวอาร์โค้ด) บนหลายอุปกรณ์ เก็บและวิเคราะห์ข้อมูล และออกแบบตามความต้องการของผู้ใช้ที่รู้จักตัวจริง ผ่านกรณีศึกษาและโจทย์ แต่ผู้เรียนไม่ได้ทำโครงงานสร้างสรรค์จริงในแอป" }
  - { framework: uk-nc-computing, indicators: ["UKNC-CO-KS3-08"], coverage: partial, note: "หลักการสร้าง ใช้ซ้ำ ปรับปรุง และดัดแปลงสื่อ (re-use, revise, re-purpose) สำหรับผู้ชมที่กำหนด โดยดูความน่าเชื่อถือ การออกแบบ การใช้งานได้ และสัญญาอนุญาต แต่การสร้างชิ้นงานดิจิทัลจริงทำนอกแอป" }
