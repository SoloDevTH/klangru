    feedback: ประโยค 熬夜的人白天常常没有精神 (áoyè de rén báitiān chángcháng méiyǒu jīngshen)，学习效率也不高 (xuéxí xiàolǜ yě bù gāo) ยกผลเสียสองข้อ ไม่ใช่ข้อเดียว
  hints:
