  - id: physics.electricity.electronics-intro.p013
    topics: [physics.electricity.electronics-intro]
    difficulty: 4
    type: order
    stem: "เรียงขั้นตอนการต่อวงจรแอลอีดีบนแผงทดลองให้ปลอดภัยและต่อถูกในครั้งแรก"
    items:
      - "เขียนแผนภาพวงจรและคำนวณค่าตัวต้านทาน"
      - "ตรวจขาแอโนดและแคโทดของแอลอีดี"
      - "เสียบตัวต้านทานและแอลอีดีบนแผงทดลองตามแผนภาพ โดยยังไม่ต่อแหล่งจ่าย"
      - "ตรวจทุกจุดต่อเทียบกับแผนภาพอีกครั้ง"
      - "ต่อแหล่งจ่ายแล้วสังเกตแอลอีดี"
    hints:
      - "ต้องรู้ก่อนว่าจะต่ออะไร และใช้ค่าเท่าใด"
      - "แหล่งจ่ายต่อเป็นขั้นตอนสุดท้าย"
    solution: "วางแผนด้วยแผนภาพและคำนวณ → ตรวจขาแอลอีดี → เสียบชิ้นส่วนโดยไม่มีไฟ → ตรวจซ้ำ → ต่อแหล่งจ่าย"
