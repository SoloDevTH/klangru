  - id: computer.ai.search-planning.p014
    topics: [computer.ai.search-planning]
    difficulty: 4
    type: code
    stem: "เขียนฟังก์ชัน `bfs_steps(grid, start, goal)` รับกริดเป็นลิสต์ของสตริง ช่อง `.` เดินได้ ช่อง `#` เป็นกำแพง จุด `start` และ `goal` เป็นทูเพิล (แถว, คอลัมน์) และเดินได้ 4 ทิศทาง คืนจำนวนก้าวที่สั้นที่สุด หรือ -1 ถ้าไปไม่ถึง ใช้ `collections.deque` ได้"
    starter: |
      def bfs_steps(grid, start, goal):
          pass
    tests: |
      G = ["....", ".##.", "...#", "#..."]
      r = bfs_steps(G, (0, 0), (3, 3))
      assert r == 6, f"จาก (0, 0) ถึง (3, 3) ควรได้ 6 ก้าว แต่ได้ {r}"
      r2 = bfs_steps(G, (0, 0), (0, 3))
      assert r2 == 3, f"จาก (0, 0) ถึง (0, 3) ควรได้ 3 ก้าว แต่ได้ {r2}"
      r3 = bfs_steps([".#.", "##.", "..."], (0, 0), (0, 2))
      assert r3 == -1, f"ช่องเริ่มถูกล้อมไว้ ควรได้ -1 แต่ได้ {r3}"
    reference: |
      from collections import deque
      def bfs_steps(grid, start, goal):
          rows, cols = len(grid), len(grid[0])
          dist = {start: 0}
          q = deque([start])
          while q:
              r, c = q.popleft()
              if (r, c) == goal:
                  return dist[(r, c)]
              for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                  nr, nc = r + dr, c + dc
                  if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] == "." and (nr, nc) not in dist:
                      dist[(nr, nc)] = dist[(r, c)] + 1
                      q.append((nr, nc))
          return -1
    hints:
      - "เก็บระยะของแต่ละช่องในดิกชันนารี เริ่มจาก start เป็น 0"
      - "ใช้คิวเข้าก่อนออกก่อน ขยายช่องข้างเคียงที่เป็น . และยังไม่เคยเห็น"
      - "ถ้าคิวว่างแล้วยังไม่พบเป้าหมาย ให้คืน -1"
    solution: "ใช้ BFS เก็บระยะของแต่ละช่องในดิกชันนารี ขยายเฉพาะช่องที่เดินได้และยังไม่เคยเห็น เมื่อถึงเป้าหมายคืนระยะนั้น ถ้าคิวว่างก่อนคืน -1"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.search-planning.p015
