  - id: phy.torq.p022
    topics: [physics.rotation.torque]
    difficulty: 3
    type: mcq
    stem: "หมุนพวงมาลัยด้วยแรงคู่ควบ (สองมือออกแรงเท่ากัน ทิศตรงข้าม แนวแรงขนานกัน) ข้อใดถูกต้องเกี่ยวกับแรงลัพธ์และโมเมนต์ลัพธ์ที่กระทำต่อพวงมาลัยจากสองมือ"
    choices:
      - { id: a, text: "แรงลัพธ์เป็นศูนย์ แต่โมเมนต์ลัพธ์ไม่เป็นศูนย์ พวงมาลัยจึงหมุนแต่ไม่เลื่อน", correct: true }
      - { id: b, text: "แรงลัพธ์และโมเมนต์ลัพธ์เป็นศูนย์ทั้งคู่ พวงมาลัยจึงอยู่นิ่ง", feedback: "แรงหักล้างกันจริง แต่โมเมนต์ของสองแรงหมุนไปทางเดียวกัน จึงรวมกัน ไม่หักล้าง" }
      - { id: c, text: "แรงลัพธ์ไม่เป็นศูนย์ พวงมาลัยจึงเลื่อนไปทางแรงที่มากกว่า", feedback: "สองแรงมีขนาดเท่ากันและทิศตรงข้าม แรงลัพธ์จึงเป็นศูนย์" }
      - { id: d, text: "แรงลัพธ์และโมเมนต์ลัพธ์ไม่เป็นศูนย์ทั้งคู่", feedback: "แรงสองแรงขนาดเท่ากันทิศตรงข้าม รวมกันเป็นศูนย์ ส่วนที่ไม่เป็นศูนย์มีเพียงโมเมนต์" }
    hints:
      - "รวมแรงสองแรงที่ขนาดเท่ากันทิศตรงข้ามได้เท่าใด"
      - "มือที่ดันขึ้นด้านหนึ่งกับมือที่ดึงลงอีกด้าน ทำให้หมุนทางเดียวกันหรือตรงข้ามกัน"
    solution: "แรงสองแรงขนาดเท่ากันทิศตรงข้ามจึงรวมเป็นศูนย์ ไม่มีการเลื่อนที่ แต่ทั้งสองทำให้หมุนทางเดียวกัน โมเมนต์รวมกันเป็น $Fd$ พวงมาลัยจึงหมุนรอบแกน"
