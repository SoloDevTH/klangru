<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" font-family="sans-serif">
<title>แผนผังขอความช่วยเหลือ เสนอความช่วยเหลือ และการตอบรับหรือปฏิเสธ</title>
<rect x="0" y="0" width="820" height="360" fill="#fff"/>
<rect x="20.0" y="20.0" width="370.0" height="120.0" rx="12" fill="#e3eefb" stroke="#2f5fa8" stroke-width="2.5"/>
<text x="205.0" y="46.0" font-size="16" text-anchor="middle" fill="#2f5fa8" font-weight="bold">ขอความช่วยเหลือ (Ask for help)</text>
<text x="205.0" y="70.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal" font-style="italic">I need help with ... </text>
<text x="205.0" y="92.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal" font-style="italic">Can you help me, please?</text>
<text x="205.0" y="114.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal" font-style="italic">Could you ... , please?</text>
<rect x="430.0" y="20.0" width="370.0" height="120.0" rx="12" fill="#e2f5e7" stroke="#2f8a4a" stroke-width="2.5"/>
<text x="615.0" y="46.0" font-size="16" text-anchor="middle" fill="#2f8a4a" font-weight="bold">เสนอความช่วยเหลือ (Offer help)</text>
<text x="615.0" y="70.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal" font-style="italic">Can I help you?</text>
<text x="615.0" y="92.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal" font-style="italic">Would you like some help?</text>
<text x="615.0" y="114.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal" font-style="italic">Shall I ... ? / Let me ...</text>
<rect x="20.0" y="220.0" width="175.0" height="120.0" rx="12" fill="#ffffff" stroke="#2f5fa8" stroke-width="2.5"/>
<text x="107.5" y="246.0" font-size="16" text-anchor="middle" fill="#2f5fa8" font-weight="bold">ตอบรับ ✓</text>
<text x="107.5" y="270.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal" font-style="italic">Sure.</text>
<text x="107.5" y="292.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal" font-style="italic">Of course.</text>
<text x="107.5" y="314.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal" font-style="italic">No problem.</text>
<rect x="215.0" y="220.0" width="175.0" height="120.0" rx="12" fill="#ffffff" stroke="#b5452f" stroke-width="2.5"/>
<text x="302.5" y="246.0" font-size="16" text-anchor="middle" fill="#b5452f" font-weight="bold">ปฏิเสธ ✗</text>
<text x="302.5" y="270.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal" font-style="italic">Sorry, I can't.</text>
<text x="302.5" y="292.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal" font-style="italic">I'm busy now.</text>
<text x="302.5" y="314.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal" font-style="italic">Maybe later?</text>
<rect x="430.0" y="220.0" width="175.0" height="120.0" rx="12" fill="#ffffff" stroke="#2f8a4a" stroke-width="2.5"/>
<text x="517.5" y="246.0" font-size="16" text-anchor="middle" fill="#2f8a4a" font-weight="bold">ตอบรับ ✓</text>
<text x="517.5" y="270.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal" font-style="italic">Yes, please.</text>
<text x="517.5" y="292.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal" font-style="italic">That would be</text>
<text x="517.5" y="314.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal" font-style="italic">great, thanks!</text>
<rect x="625.0" y="220.0" width="175.0" height="120.0" rx="12" fill="#ffffff" stroke="#b5452f" stroke-width="2.5"/>
<text x="712.5" y="246.0" font-size="16" text-anchor="middle" fill="#b5452f" font-weight="bold">ปฏิเสธ ✗</text>
<text x="712.5" y="270.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal" font-style="italic">No, thank you.</text>
<text x="712.5" y="292.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal" font-style="italic">I'm OK, thanks.</text>
<text x="712.5" y="314.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal" font-style="italic">Thanks anyway.</text>
<line x1="160.0" y1="140.0" x2="107.0" y2="218.0" stroke="#555" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="107.0,218.0 108.5,208.1 115.7,213.0" fill="#555" stroke="#555" stroke-width="1" stroke-linejoin="round"/>
<line x1="250.0" y1="140.0" x2="302.0" y2="218.0" stroke="#555" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="302.0,218.0 293.4,212.9 300.6,208.1" fill="#555" stroke="#555" stroke-width="1" stroke-linejoin="round"/>
<line x1="570.0" y1="140.0" x2="517.0" y2="218.0" stroke="#555" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="517.0,218.0 518.5,208.1 525.7,213.0" fill="#555" stroke="#555" stroke-width="1" stroke-linejoin="round"/>
<line x1="660.0" y1="140.0" x2="712.0" y2="218.0" stroke="#555" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="712.0,218.0 703.4,212.9 710.6,208.1" fill="#555" stroke="#555" stroke-width="1" stroke-linejoin="round"/>
</svg>
