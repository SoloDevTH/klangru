<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei','Noto Sans Thai',sans-serif">
<title>คำบอกทิศรอบกล่อง: บน ล่าง ซ้าย ขวา ใน นอก และภาพด้านข้างแสดงหน้า หลัง</title>
<defs><marker id="a7a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a5a00"/></marker></defs>
<rect x="0" y="0" width="720" height="450" fill="#fff"/>
<text x="360.0" y="30.0" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="bold">คำบอกทิศ (方位词) วางหลังคำนาม: 箱子上边 = บนกล่อง</text>
