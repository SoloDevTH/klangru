problems:
  - id: computer.society.inclusive-design.p001
    topics: [computer.society.inclusive-design]
    difficulty: 1
    type: mcq
    stem: "โรงเรียนสร้างทางลาดหน้าอาคารให้นักเรียนที่ใช้วีลแชร์ ทางลาดนี้ยังช่วยใครได้อีก"
    choices:
      - { id: a, text: "ภารโรงที่เข็นรถเข็นขนของ", correct: true }
      - { id: b, text: "ไม่ช่วยใครเลยนอกจากผู้ใช้วีลแชร์", feedback: "ทางลาดช่วยทุกคนที่ล้อหรือยกเท้าขึ้นบันไดลำบาก เช่น รถเข็นของ กระเป๋าลาก รถเข็นเด็ก" }
      - { id: c, text: "นักเรียนที่อยากวิ่งแข่งขึ้นบันได", feedback: "ทางลาดไม่ได้ช่วยเรื่องนี้ และการวิ่งบนทางลาดอาจอันตราย" }
      - { id: d, text: "คนที่ต้องการจอดรถยนต์หน้าอาคาร", feedback: "ทางลาดสร้างให้คนเดินและล้อเล็กใช้ ไม่ใช่ที่จอดรถ" }
    hints:
      - "นอกจากวีลแชร์ มีอะไรอีกบ้างที่มีล้อ"
      - "สิ่งที่ออกแบบให้คนกลุ่มหนึ่งมักช่วยคนอื่นด้วย"
    solution: "ทางลาดช่วยทุกคนที่ใช้ล้อ เช่น รถเข็นขนของ กระเป๋าลาก รถเข็นเด็ก และคนที่เดินขึ้นบันไดลำบาก นี่คือตัวอย่างว่าการออกแบบให้คนกลุ่มหนึ่งใช้ได้มักช่วยคนอีกมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.inclusive-design.p002
    topics: [computer.society.inclusive-design]
    difficulty: 1
    type: match
    stem: "จับคู่สถานการณ์กับชนิดของข้อจำกัดในการมองเห็น"
    pairs:
      - { left: "ผู้พิการทางการเห็นตั้งแต่เกิด", right: "ถาวร" }
      - { left: "ตาพร่าหลังหมอหยอดยาขยายม่านตา", right: "ชั่วคราว" }
      - { left: "ดูจอโทรศัพท์กลางแดดจ้า", right: "ตามสถานการณ์" }
    hints:
      - "ข้อจำกัดชั่วคราวหายไปเองเมื่อเวลาผ่านไป"
      - "ข้อจำกัดตามสถานการณ์เกิดจากสภาพแวดล้อม ไม่ใช่จากร่างกาย"
    solution: "ตาบอดตั้งแต่เกิดเป็นข้อจำกัดถาวร ตาพร่าจากยาหายไปในไม่กี่ชั่วโมง จึงเป็นชั่วคราว แดดจ้าเป็นสภาพแวดล้อม จึงเป็นตามสถานการณ์ ตัวอักษรใหญ่และสีตัดกันชัดช่วยได้ทั้งสามแบบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.inclusive-design.p003
    topics: [computer.society.inclusive-design]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "นักเรียนระดมความคิดปรับเว็บไซต์ข่าวของโรงเรียนให้ปู่ย่าตายายอ่านได้ง่ายขึ้น ความคิดใดช่วยได้จริง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "มีปุ่มขยายขนาดตัวอักษร", correct: true }
      - { id: b, text: "ใช้ตัวอักษรสีเข้มบนพื้นสีอ่อนที่ต่างกันชัด", correct: true }
      - { id: c, text: "ทำปุ่มและลิงก์ให้ใหญ่ ห่างกัน กดง่าย", correct: true }
      - { id: d, text: "ใส่ข้อความวิ่งและภาพเคลื่อนไหวเยอะ ๆ ให้ดูทันสมัย", feedback: "ข้อความที่ขยับทำให้อ่านยากและเสียสมาธิ โดยเฉพาะผู้สูงอายุ" }
      - { id: e, text: "ใช้ตัวอักษรสีเทาอ่อนตัวเล็กให้ดูเรียบหรู", feedback: "สีเทาอ่อนบนพื้นขาวมีความต่างของสีน้อย อ่านยาก" }
    hints:
      - "ผู้สูงอายุจำนวนมากสายตาลดลงและมือไม่มั่นคงเหมือนเดิม"
      - "เลือกข้อที่ช่วยให้อ่านง่ายและกดง่าย"
    solution: "การขยายตัวอักษร สีที่ต่างกันชัด และปุ่มใหญ่ห่างกัน ช่วยคนที่สายตาและมือไม่ดีเท่าเดิม ส่วนข้อความวิ่งและตัวอักษรเทาอ่อนทำให้อ่านยากขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.inclusive-design.p004
    topics: [computer.society.inclusive-design]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "จากหน้าจอตู้กดบัตรคิวในภาพ ข้อเสนอใดแก้อุปสรรคที่ **เห็นได้จากหน้าจอ** (เลือกทุกข้อที่ถูก)"
    figure:
      src: kiosk.svg
      alt: "หน้าจอตู้กดบัตรคิวสมมติ ข้อความกรุณาเลือกแผนกเป็นตัวเล็กสีเทาอ่อน ปุ่มหกแผนก อายุรกรรม ศัลยกรรม กุมารเวช ทันตกรรม ตา หู คอ จมูก เป็นตัวหนังสือเล็กสีเทาอ่อนบนพื้นเทา ใต้ปุ่มมีคำว่าสถานะ ตามด้วยวงกลมสีแดงหนึ่งวงและสีเขียวหนึ่งวงโดยไม่มีข้อความกำกับ มีข้อความว่า หน้าจอจะกลับสู่หน้าแรกใน 10 วินาที และแถบล่างเขียนว่า สัมผัสหน้าจอเท่านั้น ภาษาไทยเท่านั้น"
    choices:
      - { id: a, text: "ใช้ตัวอักษรใหญ่ขึ้นและสีเข้มบนพื้นอ่อนที่ต่างกันชัด", correct: true }
      - { id: b, text: "เพิ่มข้อความหรือไอคอนกำกับสถานะ ไม่ใช้สีแดงกับเขียวอย่างเดียว", correct: true }
      - { id: c, text: "ให้เวลามากขึ้นหรือมีปุ่มขอเวลาเพิ่ม", correct: true }
      - { id: d, text: "มีปุ่มเลือกภาษาและปุ่มอ่านออกเสียง", correct: true }
      - { id: e, text: "ทำปุ่มให้เล็กลงเพื่อใส่แผนกได้มากขึ้น", feedback: "ปุ่มเล็กทำให้กดยากขึ้น โดยเฉพาะผู้สูงอายุและคนที่มือสั่น" }
    hints:
      - "ไล่ดูทีละส่วนของจอ ตัวหนังสือ สถานะ เวลา และวิธีใช้งาน"
      - "คิดถึงผู้สูงอายุ คนตาบอดสี ผู้พิการทางการเห็น และคนที่อ่านภาษาไทยไม่ได้"
    solution: "ตัวหนังสือเล็กสีอ่อน → ขยายและเพิ่มความต่างของสี สถานะบอกด้วยสีอย่างเดียว → เพิ่มข้อความหรือไอคอน เวลา 10 วินาทีน้อยไป → ให้เวลาเพิ่ม สัมผัสและภาษาไทยเท่านั้น → เพิ่มเสียงอ่านและเลือกภาษา การทำปุ่มเล็กลงยิ่งทำให้ใช้ยาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.inclusive-design.p005
    topics: [computer.society.inclusive-design]
    difficulty: 2
    type: mcq
    stem: "กลุ่มของพลอยสร้างเกมทายคำศัพท์ให้เพื่อนทั้งชั้นเล่น ก่อนส่งงาน ควรชวนใครมาทดลองเล่นและให้ความเห็นเพื่อให้ได้มุมมองหลากหลายที่สุด"
    choices:
      - { id: a, text: "เพื่อนหลายแบบ ทั้งคนที่เล่นเกมเก่งและไม่เคยเล่น เพื่อนที่ตาบอดสี และเพื่อนที่ใช้ภาษาไทยเป็นภาษาที่สอง", correct: true }
      - { id: b, text: "สมาชิกในกลุ่มของพลอยเท่านั้น เพราะรู้วิธีเล่นดีที่สุด", feedback: "คนสร้างรู้วิธีเล่นอยู่แล้ว จึงมองไม่เห็นจุดที่คนอื่นสับสน" }
      - { id: c, text: "เพื่อนสนิทที่ชอบเกมแบบเดียวกับพลอย", feedback: "คนที่คล้ายกับเรามากจะเจอปัญหาแบบเดียวกับเรา ไม่ได้มุมมองใหม่" }
      - { id: d, text: "ไม่ต้องชวนใคร ส่งครูตรวจเลย", feedback: "ความเห็นจากผู้ใช้จริงช่วยหาอุปสรรคก่อนเกมถึงมือทุกคน" }
    hints:
      - "ผู้เล่นจริงคือเพื่อนทั้งชั้น ซึ่งแตกต่างกันมาก"
      - "คนที่ต่างจากผู้สร้างเห็นปัญหาที่ผู้สร้างมองข้าม"
    solution: "การหามุมมองที่หลากหลายต้องชวนคนที่ต่างจากผู้สร้าง ทั้งประสบการณ์ ความสามารถในการมองเห็น และภาษา จึงจะพบอุปสรรคที่กลุ่มผู้สร้างมองไม่เห็น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.inclusive-design.p006
    topics: [computer.society.inclusive-design]
    difficulty: 2
    type: mcq
    stem: "ในแอปห้องสมุด มีปุ่มรูปถังขยะสำหรับลบหนังสือออกจากรายการที่อยากยืม ข้อความแทนภาพ (alt text) ของปุ่มนี้ควรเป็นข้อใด"
    choices:
      - { id: a, text: "ลบออกจากรายการที่อยากยืม", correct: true }
      - { id: b, text: "รูปภาพ", feedback: "ไม่บอกว่าปุ่มทำอะไร ผู้ใช้โปรแกรมอ่านหน้าจอจะไม่รู้ว่ากดแล้วเกิดอะไร" }
      - { id: c, text: "ถังขยะสีเทา ขนาด 24 พิกเซล", feedback: "บรรยายหน้าตาของไอคอน แต่สิ่งที่ผู้ใช้ต้องรู้คือหน้าที่ของปุ่ม" }
      - { id: d, text: "ไม่ต้องใส่ เพราะคนส่วนใหญ่มองเห็นรูปอยู่แล้ว", feedback: "ผู้พิการทางการเห็นใช้โปรแกรมอ่านหน้าจอ ถ้าไม่มีข้อความแทนภาพ ปุ่มนี้จะใช้ไม่ได้" }
    hints:
      - "ผู้ใช้โปรแกรมอ่านหน้าจอได้ยินข้อความนี้แทนการเห็นภาพ"
      - "ภาพที่เป็นปุ่มควรบอกว่ากดแล้วจะเกิดอะไร"
    solution: "ข้อความแทนภาพของปุ่มควรบอกหน้าที่ของปุ่ม คือ ลบออกจากรายการที่อยากยืม ไม่ใช่บรรยายรูปร่างของไอคอน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.inclusive-design.p007
    topics: [computer.society.inclusive-design]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการออกแบบแอปให้ทุกคนใช้ได้"
    items:
      - "สังเกตผู้ใช้ที่หลากหลายใช้งานจริงและจดจุดที่ติดขัด"
      - "ระดมความคิดแก้ปัญหาร่วมกับผู้ใช้กลุ่มต่าง ๆ"
      - "ปรับปรุงและทำต้นแบบ"
      - "ทดสอบกับผู้ใช้หลากหลาย แล้วแยกผลตามกลุ่ม"
      - "แก้จุดที่กลุ่มใดยังใช้ไม่สำเร็จ แล้วทดสอบซ้ำ"
    hints:
      - "ต้องรู้ปัญหาจากผู้ใช้จริงก่อนจะคิดวิธีแก้"
      - "การทดสอบไม่ใช่ขั้นสุดท้าย ผลทดสอบนำไปสู่การแก้และทดสอบอีกรอบ"
    solution: "สังเกตผู้ใช้จริง → ระดมความคิดร่วมกับผู้ใช้ → ปรับปรุงและทำต้นแบบ → ทดสอบแยกผลตามกลุ่ม → แก้และทดสอบซ้ำ เป็นวงรอบจนทุกกลุ่มใช้ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.inclusive-design.p008
    topics: [computer.society.inclusive-design]
    difficulty: 3
    type: mcq
    stem: "ฟอร์มสมัครกิจกรรมบอกว่าช่องใดกรอกผิดโดย **เปลี่ยนกรอบช่องเป็นสีแดงเท่านั้น** วิธีแก้ใดดีที่สุด"
    choices:
      - { id: a, text: "เพิ่มไอคอนเตือนและข้อความใต้ช่อง เช่น \"กรุณากรอกเบอร์โทร 10 หลัก\"", correct: true }
      - { id: b, text: "เปลี่ยนสีกรอบเป็นสีแดงที่สดขึ้น", feedback: "ยังใช้สีอย่างเดียว คนตาบอดสีบางคนแยกแดงไม่ออก และโปรแกรมอ่านหน้าจออ่านสีไม่ได้" }
      - { id: c, text: "ให้กรอบกะพริบสีแดงกับสีเขียวสลับกัน", feedback: "ยังอาศัยสีและการกะพริบรบกวนผู้ใช้ ทั้งไม่บอกว่าผิดอย่างไร" }
      - { id: d, text: "แสดงข้อความ \"Error 422\" ที่ด้านบนของหน้า", feedback: "ผู้ใช้ไม่รู้ว่ารหัสนี้หมายถึงอะไร และไม่รู้ว่าช่องใดผิด" }
    hints:
      - "หลักรับรู้ได้: ข้อมูลไม่ควรรับได้ทางเดียว"
      - "หลักเข้าใจได้: ข้อความแจ้งข้อผิดพลาดควรบอกวิธีแก้"
    solution: "ข้อ ก ไม่ใช้สีอย่างเดียว (มีไอคอนและข้อความที่โปรแกรมอ่านหน้าจออ่านได้) และบอกวิธีแก้ชัดเจน จึงตรงทั้งหลักรับรู้ได้และหลักเข้าใจได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.inclusive-design.p009
    topics: [computer.society.inclusive-design]
    difficulty: 3
    type: match
    stem: "จับคู่การปรับปรุงกับหลักการเข้าถึงได้ของ WCAG"
    pairs:
      - { left: "ใส่คำบรรยายใต้คลิปวิดีโอ", right: "รับรู้ได้" }
      - { left: "ใช้ทุกเมนูได้ด้วยแป้นพิมพ์ ไม่ต้องใช้เมาส์", right: "ใช้งานได้" }
      - { left: "เมนูอยู่ตำแหน่งเดิมทุกหน้า และใช้ภาษาง่าย", right: "เข้าใจได้" }
      - { left: "เขียนหน้าเว็บให้โปรแกรมอ่านหน้าจออ่านได้ถูกต้อง", right: "ทนทาน" }
    hints:
      - "รับรู้ได้คือเห็นหรือได้ยินข้อมูลได้ ใช้งานได้คือสั่งงานได้"
      - "ทนทานคือทำงานร่วมกับเทคโนโลยีช่วยเหลือได้"
    solution: "คำบรรยาย = รับรู้ได้ (ได้ข้อมูลเสียงทางตา) ใช้แป้นพิมพ์ได้ = ใช้งานได้ เมนูคงที่และภาษาง่าย = เข้าใจได้ ใช้กับโปรแกรมอ่านหน้าจอได้ = ทนทาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.inclusive-design.p010
    topics: [computer.society.inclusive-design]
    difficulty: 3
    type: numeric
    stem: "ตัวอักษรสีเทาอ่อนมีความสว่างสัมพัทธ์ $L = 0.40$ อยู่บนพื้นสีขาว ($L = 1$) จงหาอัตราส่วนความต่างของความสว่าง (ตอบทศนิยม 2 ตำแหน่ง เช่น 3.25 หมายถึง 3.25 : 1)"
    answer: { value: 2.33, tolerance: 0.02 }
    hints:
