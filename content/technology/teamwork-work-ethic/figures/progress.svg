<text x="80" y="187.0" text-anchor="end" font-size="13" fill="#374151">60%</text>
<line x1="90" y1="136.0" x2="570" y2="136.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="80" y="141.0" text-anchor="end" font-size="13" fill="#374151">80%</text>
<line x1="90" y1="90.0" x2="570" y2="90.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="80" y="95.0" text-anchor="end" font-size="13" fill="#374151">100%</text>
<rect x="135" y="90.0" width="70" height="230.0" fill="#bbf7d0" stroke="#334155" stroke-width="1.5"/>
<text x="170.0" y="82.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">100%</text>
<text x="170.0" y="344" text-anchor="middle" font-size="14" fill="#111827">สมาชิก A</text>
<rect x="245" y="136.0" width="70" height="184.0" fill="#bbf7d0" stroke="#334155" stroke-width="1.5"/>
<text x="280.0" y="128.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">80%</text>
<text x="280.0" y="344" text-anchor="middle" font-size="14" fill="#111827">สมาชิก B</text>
<rect x="355" y="182.0" width="70" height="138.0" fill="#bbf7d0" stroke="#334155" stroke-width="1.5"/>
