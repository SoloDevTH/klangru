- id: english.reading.research-skills.p016
  topics:
  - english.reading.research-skills
  difficulty: 5
  type: mcq
  stem: 'อ่านข้อมูลที่สืบค้นมาเพื่อทำรายงานวิชาวิทยาศาสตร์


    *Mangrove forests grow along the coasts of Thailand. Scientists have found that mangroves store more carbon in their soil than many land forests do. When mangroves are cut down for shrimp farms, this carbon goes back into the air. For this reason, replanting mangroves can help to slow down climate change.*


    ข้อใดสรุปได้ถูกต้องที่สุด'
  choices:
  - id: a
    text: Replanting mangroves is useful because mangroves keep carbon out of the air.
    correct: true
