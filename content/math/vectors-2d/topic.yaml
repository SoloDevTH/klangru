id: math.geometry.vectors
subject: math
title: { th: เวกเตอร์ในสองมิติ, en: Vectors in two dimensions }
summary: เขียนเวกเตอร์ด้วยองค์ประกอบ หาขนาดและทิศทาง บวก ลบ และคูณเวกเตอร์ด้วยสเกลาร์ และแยกเวกเตอร์เป็นองค์ประกอบด้วย sin cos
difficulty: 5.5
minutes: 40
prerequisites: [math.functions.coordinate-plane, math.geometry.trig-ratios]
encompasses:
  - { id: math.geometry.trig-ratios, weight: 0.4 }
  - { id: math.functions.coordinate-plane, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: add-subtract.svg
    alt: "ภาพซ้าย: เวกเตอร์ a ชี้ไปทางขวาเฉียงขึ้นเล็กน้อย เวกเตอร์ b ชี้ขึ้นเฉียงขวา ออกจากจุดเดียวกัน เติมเป็นสี่เหลี่ยมด้านขนานด้วยเส้นประ ลูกศรสีส้ม a + b เป็นเส้นทแยงจากจุดเริ่ม ภาพขวา: a และ b ออกจากจุดเดียวกัน ลูกศรสีส้ม a − b ชี้จากหัวของ b ไปหัวของ a"
    caption: "$\\vec{a} + \\vec{b}$ คือเส้นทแยงของสี่เหลี่ยมด้านขนาน ส่วน $\\vec{a} - \\vec{b}$ ชี้จากหัว $\\vec{b}$ ไปหัว $\\vec{a}$"
  - type: worked-example
    title: เวกเตอร์ระหว่างสองจุด ขนาด และเวกเตอร์หนึ่งหน่วย
    problem: "จุด $A(1, 2)$ และ $B(7, 10)$ หา $\\overrightarrow{AB}$ ขนาดของมัน และเวกเตอร์หนึ่งหน่วยในทิศของ $\\overrightarrow{AB}$"
    steps:
      - text: "$\\overrightarrow{AB} = (7 - 1,\\ 10 - 2) = (6, 8)$"
        why: "ลบพิกัดจุดเริ่มต้นออกจากพิกัดจุดปลาย"
      - text: "$|\\overrightarrow{AB}| = \\sqrt{6^2 + 8^2} = \\sqrt{100} = 10$"
      - text: "เวกเตอร์หนึ่งหน่วย $= \\dfrac{(6, 8)}{10} = (0.6, 0.8)$"
        why: "หารด้วยขนาดทำให้ความยาวเหลือ 1 แต่ทิศเท่าเดิม"
      - text: "ตรวจ: $\\sqrt{0.6^2 + 0.8^2} = \\sqrt{0.36 + 0.64} = 1$ ✓"
    answer: "$\\overrightarrow{AB} = (6, 8)$ ขนาด 10 เวกเตอร์หนึ่งหน่วย $(0.6, 0.8)$"
  - { type: check, problem: math.vec.p002, prompt: "บวกทีละองค์ประกอบ" }
  - type: worked-example
    title: รวมเวกเตอร์ที่ให้มาเป็นขนาดและมุม
    problem: "เวกเตอร์ $\\vec{u}$ ยาว 8 หน่วยชี้ตามแกน x ทางบวก ($0^\\circ$) และ $\\vec{v}$ ยาว 5 หน่วยทำมุม $60^\\circ$ กับแกน x ทางบวก หาขนาดและทิศของ $\\vec{u} + \\vec{v}$"
    steps:
      - text: "แยกองค์ประกอบ: $\\vec{u} = (8, 0)$ และ $\\vec{v} = (5\\cos 60^\\circ, 5\\sin 60^\\circ) = (2.5,\\ 4.33)$"
        why: "บวกขนาดตรง ๆ ไม่ได้เพราะทิศต่างกัน ต้องแยกเป็นองค์ประกอบก่อน"
      - text: "บวก: $\\vec{u} + \\vec{v} = (10.5,\\ 4.33)$"
      - text: "ขนาด: $\\sqrt{10.5^2 + 4.33^2} \\approx \\sqrt{129} \\approx 11.36$ หน่วย"
        why: "น้อยกว่า $8 + 5 = 13$ เพราะสองเวกเตอร์ไม่ได้ชี้ทางเดียวกัน"
      - text: "ทิศ: $\\theta = \\tan^{-1}\\dfrac{4.33}{10.5} \\approx 22.4^\\circ$ จากแกน x ทางบวก (อยู่จตุภาคที่ 1 เพราะองค์ประกอบทั้งสองเป็นบวก)"
    answer: "ขนาดประมาณ $11.36$ หน่วย ทำมุมประมาณ $22.4^\\circ$ กับแกน x ทางบวก"
  - { type: check, problem: math.vec.p007, prompt: "เวกเตอร์ขนานคือพหุคูณสเกลาร์ของกัน" }
  - type: interactive
    title: ลากลูกศรแล้วดูผลบวกของเวกเตอร์
    caption: ลากหัวลูกศร a และ b ไปตำแหน่งต่าง ๆ สังเกตว่าองค์ประกอบ x ของผลบวกเท่ากับองค์ประกอบ x ของ a บวกของ b เสมอ และความยาวของผลบวกไม่เท่ากับความยาวของ a บวกของ b ยกเว้นเมื่อสองลูกศรชี้ทางเดียวกัน
    widget: { kind: vector-add, a: [3, 1], b: [1, 2], draggable: true }
  - type: simulation
    title: บวกเวกเตอร์แบบหางต่อหัว (PhET Vector Addition)
    url: https://phet.colorado.edu/en/simulations/vector-addition
    provider: phet
    note: ลากเวกเตอร์สองตัวลงบนกริด เปิดแสดงองค์ประกอบและผลรวม แล้วลองจัดให้สองเวกเตอร์ตั้งฉากกันเพื่อดูว่าขนาดของผลรวมเป็นไปตามทฤษฎีบทพีทาโกรัส
glossary:
  - { term: เวกเตอร์, definition: "ปริมาณที่มีทั้งขนาดและทิศทาง เช่น การกระจัด ความเร็ว แรง" }
  - { term: สเกลาร์, definition: "ปริมาณที่มีแต่ขนาด เช่น มวล เวลา อุณหภูมิ" }
  - { term: องค์ประกอบ, definition: "ส่วนของเวกเตอร์ในแนวแกน x และแกน y เช่น $(3, 4)$ มีองค์ประกอบ x เป็น 3 และ y เป็น 4" }
  - { term: เวกเตอร์ลัพธ์, definition: "เวกเตอร์ที่ได้จากการบวกเวกเตอร์หลายตัว เท่ากับลูกศรจากหางตัวแรกถึงหัวตัวสุดท้ายเมื่อวางหางต่อหัว" }
  - { term: เวกเตอร์หนึ่งหน่วย, definition: "เวกเตอร์ที่มีขนาด 1 หาได้จาก $\\vec{a} \\div |\\vec{a}|$" }
flashcards:
  - { front: "ขนาดของเวกเตอร์ $(x, y)$", back: "$\\sqrt{x^2 + y^2}$ (ทฤษฎีบทพีทาโกรัส)" }
  - { front: "บวกเวกเตอร์ $(a_1, a_2) + (b_1, b_2)$ อย่างไร", back: "บวกทีละองค์ประกอบ ได้ $(a_1 + b_1, a_2 + b_2)$" }
  - { front: "เวกเตอร์ขนาด $r$ ทำมุม $\\theta$ กับแกน x ทางบวก มีองค์ประกอบเท่าใด", back: "$x = r\\cos\\theta$, $y = r\\sin\\theta$" }
  - { front: "$-2\\vec{a}$ ต่างจาก $\\vec{a}$ อย่างไร", back: "ยาวเป็น 2 เท่าและชี้ไปทางตรงข้าม เพราะคูณด้วยสเกลาร์ที่เป็นลบ" }
