  <rect x="426.0" y="190.0" width="170.0" height="96.0" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="511.0" y="224.2" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">ช่องทางจัดจำหน่าย</text>
