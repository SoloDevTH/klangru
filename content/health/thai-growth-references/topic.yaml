id: health.growth.thai-growth-references
subject: health
title: { th: "เกณฑ์อ้างอิงการเจริญเติบโตของเด็กไทยและการแปลผล", en: "Thai child growth references and how to interpret them" }
summary: เกณฑ์อ้างอิงการเจริญเติบโตของเด็กอายุ 6–19 ปีของกรมอนามัย (2564) ส่วนสูงตามเกณฑ์อายุ น้ำหนักตามเกณฑ์ส่วนสูง น้ำหนักตามเกณฑ์อายุ กราฟ BMI ตามอายุของ WHO และการพัฒนาตนเองให้เติบโตสมวัย
difficulty: 3.5
minutes: 35
prerequisites: [health.body.bmi-growth]
encompasses:
  - { id: health.body.bmi-growth, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: อ่านกราฟส่วนสูงตามเกณฑ์อายุ
    src: hfa-chart.svg
    alt: "กราฟจำลองส่วนสูงตามเกณฑ์อายุ แกนนอนอายุ 6 ถึง 19 ปี แกนตั้งส่วนสูง 90 ถึง 180 ซม. เส้นทึบตรงกลางคือ MEDIAN เส้นประ +1.5 SD และ +2 SD อยู่ด้านบน -1.5 SD และ -2 SD อยู่ด้านล่าง แบ่งเป็นแถบสีห้าระดับ สูง (เหนือ +2 SD) ค่อนข้างสูง สูงตามเกณฑ์ ค่อนข้างเตี้ย เตี้ย (ต่ำกว่า -2 SD) จุดของน้ำฝน อายุ 10 ปีครึ่ง สูงประมาณ 151 ซม. อยู่ระหว่างเส้น +1.5 SD กับ +2 SD"
    caption: "ภาพจำลองเพื่อฝึกอ่านกราฟ ค่าจริงอยู่ในกราฟของสำนักโภชนาการ กรมอนามัย ซึ่งแยกตามเพศ"
  - type: worked-example
    title: แปลผลจุดของน้ำฝน
    problem: "น้ำฝนอายุ 10 ปีครึ่ง จุดส่วนสูงบนกราฟส่วนสูงตามเกณฑ์อายุ (ภาพจำลอง) อยู่ระหว่างเส้น +1.5 SD กับ +2 SD และน้ำหนักตามเกณฑ์ส่วนสูงอยู่ระหว่าง −1.5 SD กับ +1.5 SD น้ำฝนสูงดีสมส่วนหรือไม่"
    steps:
      - text: "ส่วนสูงตามเกณฑ์อายุ: ช่วง +1.5 SD ถึง +2 SD คือ ค่อนข้างสูง"
      - text: "น้ำหนักตามเกณฑ์ส่วนสูง: ช่วง −1.5 SD ถึง +1.5 SD คือ สมส่วน"
      - text: "สูงดีสมส่วนต้องมีส่วนสูงระดับสูงตามเกณฑ์ขึ้นไป และสมส่วน ในคนเดียวกัน"
        why: "ค่อนข้างสูงอยู่เหนือระดับสูงตามเกณฑ์ จึงนับว่าผ่านส่วนแรก"
      - text: "ทั้งสองเงื่อนไขผ่าน"
    answer: "น้ำฝนสูงดีสมส่วน"
  - { type: check, problem: health.growth.thai-growth-references.p004, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: worked-example
    title: ดูเส้นทาง ไม่ใช่จุดเดียว
    problem: "กราฟแสดงส่วนสูงของเก่งตั้งแต่อายุ 7 ถึง 12 ปี (ภาพจำลอง) เก่งสูงขึ้นทุกปี แปลว่าเติบโตดีหรือไม่"
    figure:
      src: growth-track.svg
      alt: "กราฟจำลองส่วนสูงตามเกณฑ์อายุ มีแถบสีห้าระดับ สูง ค่อนข้างสูง สูงตามเกณฑ์ ค่อนข้างเตี้ย เตี้ย เส้นทางส่วนสูงของเก่งจากอายุ 7 ถึง 12 ปี อายุ 7 และ 8 ปีอยู่ใกล้เส้นมัธยฐาน อายุ 9 และ 10 ปีค่อย ๆ ต่ำลงแต่ยังอยู่ในช่วงสูงตามเกณฑ์ อายุ 11 และ 12 ปีตกลงไปอยู่ระหว่างเส้น -1.5 SD กับ -2 SD"
    steps:
      - text: "อายุ 7–8 ปี จุดอยู่ใกล้เส้นมัธยฐาน: สูงตามเกณฑ์"
      - text: "อายุ 9–10 ปี จุดต่ำลงเทียบกับเส้น แต่ยังอยู่ในช่วงสูงตามเกณฑ์"
      - text: "อายุ 11–12 ปี จุดอยู่ระหว่าง −1.5 SD กับ −2 SD: ค่อนข้างเตี้ย"
        why: "เด็กโตได้ทุกปี แต่ถ้าโตช้ากว่าเด็กวัยเดียวกัน จุดจะตกข้ามช่วงลงไป"
      - text: "แนวโน้มที่ตกข้ามช่วงควรให้บุคลากรสุขภาพช่วยดูเรื่องอาหาร การนอน และการเจ็บป่วย"
    answer: "ยังไม่ใช่ เส้นทางตกข้ามช่วงจนค่อนข้างเตี้ย ควรปรึกษาบุคลากรสุขภาพ"
  - { type: check, problem: health.growth.thai-growth-references.p009 }
glossary:
  - { term: เกณฑ์อ้างอิงการเจริญเติบโต, definition: "ค่าน้ำหนักและส่วนสูงของเด็กไทยแยกตามเพศและอายุ ใช้เทียบว่าเด็กเติบโตตามวัยหรือไม่" }
  - { term: มัธยฐาน, definition: "เส้นค่ากลางบนกราฟ ครึ่งหนึ่งของเด็กอยู่สูงกว่า อีกครึ่งอยู่ต่ำกว่า" }
  - { term: SD, definition: "ส่วนเบี่ยงเบนมาตรฐาน ใช้บอกว่าค่าห่างจากมัธยฐานมากเท่าใด" }
  - { term: สูงดีสมส่วน, definition: "ส่วนสูงอยู่ระดับสูงตามเกณฑ์ขึ้นไป และน้ำหนักตามเกณฑ์ส่วนสูงอยู่ระดับสมส่วน ในคนเดียวกัน" }
flashcards:
  - { front: "ส่วนสูงตามเกณฑ์อายุ 5 ระดับ", back: "สูง ค่อนข้างสูง สูงตามเกณฑ์ ค่อนข้างเตี้ย เตี้ย" }
  - { front: "น้ำหนักตามเกณฑ์ส่วนสูง 6 ระดับ", back: "อ้วน เริ่มอ้วน ท้วม สมส่วน ค่อนข้างผอม ผอม" }
  - { front: "ช่วงสมส่วนและสูงตามเกณฑ์", back: "−1.5 SD ถึง +1.5 SD" }
  - { front: "WHO: เด็ก 5–19 ปีอ้วนเมื่อใด", back: "BMI ตามอายุ > มัธยฐาน + 2 SD (น้ำหนักเกินเมื่อ > + 1 SD)" }
