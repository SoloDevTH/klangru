problems:
- id: management.quality.internal-audit.p001
  topics:
  - management.quality.internal-audit
  difficulty: 1
  type: mcq
  stem: จุดประสงค์หลักของการตรวจติดตามคุณภาพภายในคือข้อใด
  choices:
  - id: a
    text: หาหลักฐานว่าระบบเป็นไปตามข้อกำหนดและได้ผลจริง เพื่อให้องค์กรปรับปรุงก่อนเกิดปัญหา
    correct: true
  - id: b
    text: หาตัวพนักงานที่ทำผิดเพื่อลงโทษ
    feedback: การตรวจมุ่งที่ระบบและกระบวนการ ไม่กล่าวโทษบุคคล ถ้าคนกลัวจะซ่อนปัญหา
  - id: c
    text: เตรียมเอกสารให้ครบก่อนผู้ตรวจรับรองมาเท่านั้น
    feedback: การตรวจที่ดีดูการปฏิบัติจริงและผลลัพธ์ ไม่ใช่แค่เอกสาร
  - id: d
    text: ตรวจสินค้าทุกชิ้นก่อนส่งลูกค้า
    feedback: นั่นคือการตรวจสอบสินค้า (inspection) ซึ่งเป็นงานประจำของกระบวนการ ไม่ใช่การตรวจติดตามระบบ
  hints:
  - การตรวจติดตามดูทั้งความสอดคล้องและประสิทธิผล
  - ผลการตรวจนำไปใช้ทำอะไร
  solution: การตรวจติดตามภายในเป็นเครื่องมือของฝ่ายบริหาร ใช้ตรวจว่าระบบทำตามที่กำหนดทั้งของมาตรฐานและขององค์กรเอง และทำงานได้ผลจริง ผลการตรวจเข้าสู่การแก้ไขที่สาเหตุและการทบทวนโดยฝ่ายบริหาร
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: management.quality.internal-audit.p002
  topics:
  - management.quality.internal-audit
  difficulty: 1
  type: match
  stem: จับคู่ประเภทการตรวจกับตัวอย่าง
  pairs:
  - left: การตรวจระบบ
    right: ตรวจว่าระบบบริหารคุณภาพทั้งระบบครอบคลุมข้อกำหนดของมาตรฐาน
  - left: การตรวจกระบวนการ
    right: ตรวจว่าเตาฆ่าเชื้อใช้อุณหภูมิและเวลาตามที่กำหนดและมีบันทึกครบ
  - left: การตรวจผลิตภัณฑ์
    right: สุ่มกระป๋องที่บรรจุเสร็จมาตรวจเทียบกับข้อกำหนดของสินค้า
  - left: การตรวจโดยฝ่ายที่สอง
    right: ห้างค้าปลีกส่งทีมมาตรวจโรงงานผู้ผลิตสินค้าตราห้าง
  hints:
  - 'แยกตามขอบเขต: ทั้งระบบ หนึ่งกระบวนการ หรือตัวสินค้า'
  - ฝ่ายที่สองคือลูกค้าตรวจผู้ขาย
  solution: การตรวจระบบดูภาพรวมเทียบมาตรฐาน การตรวจกระบวนการดูว่าวิธีทำงานและพารามิเตอร์เป็นไปตามที่กำหนด การตรวจผลิตภัณฑ์ดูตัวสินค้าเทียบข้อกำหนด และการตรวจโดยฝ่ายที่สองคือลูกค้าตรวจผู้ส่งมอบ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: management.quality.internal-audit.p003
  topics:
  - management.quality.internal-audit
  difficulty: 2
  type: mcq
  stem: บริษัทชิ้นส่วนรถยนต์ในระยอง (สมมติ) จะตรวจติดตามคลังสินค้า คุณสมใจเพิ่งย้ายจากตำแหน่งผู้จัดการคลังสินค้าไปฝ่ายวางแผนเมื่อสามเดือนก่อน และผ่านการอบรมผู้ตรวจแล้ว ควรให้คุณสมใจเป็นผู้ตรวจคลังสินค้าหรือไม่
  choices:
  - id: a
    text: ไม่ควร เพราะงานที่ตรวจส่วนหนึ่งเป็นงานที่ตัวเองเคยรับผิดชอบ อาจไม่เป็นกลาง
    correct: true
  - id: b
    text: ควร เพราะรู้งานคลังดีที่สุด
    feedback: ความรู้ในกระบวนการมีประโยชน์ แต่การตรวจผลงานของตัวเองทำให้เห็นปัญหายากและขาดความน่าเชื่อถือ ใช้เป็นผู้ให้ข้อมูลแทนได้
  - id: c
    text: ควร เพราะผ่านการอบรมแล้ว ไม่ต้องคำนึงเรื่องอื่น
    feedback: ผู้ตรวจต้องทั้งมีความสามารถและเป็นกลาง
  - id: d
    text: ไม่ควร เพราะผู้ตรวจต้องเป็นคนนอกบริษัทเสมอ
    feedback: การตรวจภายในใช้พนักงานภายในได้ ขอเพียงไม่ตรวจงานของตัวเอง
  hints:
  - ความเป็นอิสระหมายถึงไม่ตรวจงานที่ตัวเองรับผิดชอบ
  - บันทึกในคลังสามเดือนก่อนเป็นผลงานของใคร
  solution: ความเป็นกลางของผู้ตรวจต้องไม่มีส่วนได้เสียกับสิ่งที่ตรวจ บันทึกและวิธีทำงานในคลังช่วงที่ตรวจส่วนหนึ่งเป็นผลงานของคุณสมใจเอง จึงควรให้ผู้ตรวจคนอื่นตรวจ ส่วนคุณสมใจตรวจหน่วยงานอื่นได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: management.quality.internal-audit.p004
  topics:
  - management.quality.internal-audit
  difficulty: 2
  type: numeric
  stem: ผู้ตรวจสุ่มบันทึกการรับวัตถุดิบ $10$ ฉบับ ถ้าบันทึกทั้งหมดมีที่กรอกผิดอยู่ $5\%$ โอกาสที่ผู้ตรวจจะพบบันทึกผิดอย่างน้อยหนึ่งฉบับเป็นกี่เปอร์เซ็นต์ (สมมติจำนวนบันทึกมากและสุ่มอิสระ)
  answer:
    value: 40.126306
    tolerance: 0.4
    unit: '%'
  misconceptions:
  - match: 50.0
    feedback: คูณ $10 \times 5\%$ ตรง ๆ ใช้ได้เฉพาะความน่าจะเป็นเล็กมากและเป็นค่าประมาณที่เกินจริง
  - match: 59.873694
    feedback: นั่นคือโอกาสที่ไม่พบเลย
  hints:
  - 'หาโอกาสที่ไม่พบเลยก่อน: ทุกฉบับถูก $= 0.95^{10}$'
  - โอกาสพบอย่างน้อยหนึ่ง $= 1 - 0.95^{10}$
  solution: $1 - 0.95^{10} = 1 - 0.5987 = 0.4013$ หรือราว $40.1\%$ แปลว่าแม้ปัญหามีอยู่จริง การสุ่ม 10 ฉบับมีโอกาสมากกว่าครึ่งที่จะไม่พบ การ "ไม่พบ" จึงไม่ได้พิสูจน์ว่าไม่มีปัญหา
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: management.quality.internal-audit.p005
  topics:
  - management.quality.internal-audit
  difficulty: 2
  type: mcq
  stem: ข้อใดเป็น **หลักฐานการตรวจ** ที่ดีที่สุดว่าเครื่องวัดอุณหภูมิได้รับการสอบเทียบตามกำหนด
  choices:
  - id: a
    text: ใบรับรองผลการสอบเทียบที่ระบุหมายเลขเครื่อง วันที่ และผลการสอบเทียบ ตรงกับป้ายบนเครื่อง
    correct: true
  - id: b
    text: หัวหน้าแผนกยืนยันว่าสอบเทียบทุกปี
    feedback: คำบอกเล่าเป็นจุดเริ่มต้นที่ดี แต่ต้องยืนยันด้วยบันทึกหรือการสังเกต
  - id: c
    text: ขั้นตอนการปฏิบัติงานที่เขียนว่าต้องสอบเทียบทุก 12 เดือน
    feedback: เอกสารขั้นตอนบอกว่าควรทำอะไร ไม่ได้พิสูจน์ว่าทำแล้ว
  - id: d
    text: เครื่องยังดูใหม่และแสดงผลได้ปกติ
    feedback: ความดูใหม่ไม่ได้บอกความแม่นยำ
  hints:
  - หลักฐานต้องตรวจสอบซ้ำได้
  - เอกสารขั้นตอนต่างจากบันทึกอย่างไร
  solution: หลักฐานการตรวจที่ดีเป็นข้อเท็จจริงที่ตรวจสอบได้ เช่น บันทึกที่เชื่อมโยงกับเครื่องจริง ผู้ตรวจควรยืนยันจากหลายแหล่ง สัมภาษณ์ สังเกต และดูบันทึก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: management.quality.internal-audit.p006
  topics:
  - management.quality.internal-audit
  difficulty: 3
  type: numeric
  stem: โรงงานแปรรูปอาหารทะเลในสงขลา (สมมติ ดูตาราง) ใช้เกณฑ์ในตารางกำหนดความถี่การตรวจของแต่ละกระบวนการ โปรแกรมการตรวจปีนี้มีการตรวจรวมกี่ครั้ง
  answer:
    value: 14.0
    unit: ครั้ง
  misconceptions:
  - match: 6.0
    feedback: ตรวจทุกกระบวนการปีละครั้งเท่ากัน ไม่ได้ใช้ความเสี่ยง
  - match: 16.0
    feedback: จัดคะแนน 12 ไว้ในช่วงทุกไตรมาส แต่ 12 อยู่ในช่วง 8–12 (ปีละ 2 ครั้ง)
  figure:
    src: p-risk-table.svg
    alt: 'ตารางคะแนนของกระบวนการในโรงงานแปรรูปอาหารทะเล (สมมติ) หกแถว ความสำคัญและความเสี่ยงคะแนน 1 ถึง 5: รับคำสั่งซื้อและทบทวนข้อกำหนดลูกค้า 4 และ 3 · จัดซื้อและประเมินผู้ขาย 4 และ 4 · แปรรูปและฆ่าเชื้อ (กระบวนการพิเศษ) 5 และ 4 · สอบเทียบเครื่องมือวัด 3 และ 3 · ฝึกอบรมพนักงาน 3 และ 2 · คลังสินค้าและขนส่ง 2 และ 3 ใต้ตารางเขียนเกณฑ์ คะแนน = ความสำคัญ × ความเสี่ยง 1–6 ตรวจปีละ 1 ครั้ง 8–12 ปีละ 2 ครั้ง 15–25 ปีละ 4 ครั้ง'
  hints:
  - คูณความสำคัญกับความเสี่ยงของแต่ละกระบวนการ แล้วเทียบเกณฑ์
  - คะแนน 12, 16, 20, 9, 6, 6
  solution: 'คะแนน: รับคำสั่งซื้อ $12$ (2 ครั้ง) จัดซื้อ $16$ (4) แปรรูปและฆ่าเชื้อ $20$ (4) สอบเทียบ $9$ (2) ฝึกอบรม $6$ (1) คลังสินค้า $6$ (1) รวม $2 + 4 + 4 + 2 + 1 + 1 = 14$ ครั้ง'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: management.quality.internal-audit.p007
  topics:
  - management.quality.internal-audit
  difficulty: 3
  type: order
  stem: เรียงขั้นตอนหลังผู้ตรวจออกรายงานข้อบกพร่องว่าพนักงานใหม่เริ่มงานก่อนผ่านการอบรมสุขลักษณะ
  items:
  - หน่วยงานแก้ไขทันที ให้พนักงานที่ยังไม่ผ่านอบรมเข้ารับการอบรมก่อนกลับเข้าไลน์ผลิต
  - หาสาเหตุราก เช่น ขั้นตอนรับพนักงานไม่มีจุดตรวจว่าอบรมแล้วหรือยัง
  - กำหนดการปฏิบัติการแก้ไขที่สาเหตุ ผู้รับผิดชอบ และกำหนดเสร็จ
  - ผู้ตรวจตรวจว่าทำตามแผนแล้ว
  - ผู้ตรวจสุ่มบันทึกพนักงานใหม่ในเดือนถัด ๆ ไปเพื่อยืนยันว่าไม่เกิดซ้ำ แล้วปิดข้อบกพร่อง
  hints:
  - การแก้ไขเฉพาะหน้ามาก่อนการหาสาเหตุ
  - ปิดข้อบกพร่องได้เมื่อมีหลักฐานว่าได้ผล ไม่ใช่แค่ทำแล้ว
  solution: แก้ไขเฉพาะหน้า → หาสาเหตุราก → วางแผนปฏิบัติการแก้ไข → ยืนยันว่าทำแล้ว → ยืนยันประสิทธิผลด้วยหลักฐานในช่วงเวลาถัดไป แล้วจึงปิด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: management.quality.internal-audit.p008
  topics:
  - management.quality.internal-audit
  difficulty: 3
  type: mcq
  stem: ผู้ตรวจสุ่มใบรับวัตถุดิบ 20 ใบ พบ 1 ใบที่ผู้ตรวจรับลืมลงลายมือชื่อ แต่ผลตรวจวัตถุดิบครบและถูกต้อง ใบอื่นถูกต้องทั้งหมด ควรจัดระดับอย่างไร
  choices:
  - id: a
    text: ข้อบกพร่องย่อย เพราะเป็นความพลาดครั้งเดียว ระบบยังทำงาน
    correct: true
  - id: b
    text: ข้อบกพร่องหลัก เพราะผิดขั้นตอน
    feedback: ข้อบกพร่องหลักคือระบบส่วนหนึ่งไม่มีหรือล้มเหลว หรือส่งผลต่อสินค้าที่ถึงลูกค้า กรณีนี้ไม่ใช่
  - id: c
    text: ไม่ต้องบันทึก เพราะผลตรวจถูกต้อง
    feedback: ยังเป็นการไม่ทำตามข้อกำหนดของบันทึก ต้องบันทึกเป็นข้อพบ
  - id: d
    text: ข้อสังเกตเท่านั้น
    feedback: ข้อสังเกตใช้กับเรื่องที่ยังไม่ผิดข้อกำหนด แต่อาจผิดในอนาคต ส่วนกรณีนี้ผิดแล้ว
  hints:
  - ระบบยังทำงานไหม ใบอื่นถูกต้องหรือไม่
  - ส่งผลต่อสินค้าที่ถึงลูกค้าหรือไม่
  solution: ความพลาดเป็นครั้งคราวที่ระบบยังทำงานและไม่กระทบสินค้า จัดเป็นข้อบกพร่องย่อย หน่วยงานยังต้องหาสาเหตุ (เช่น แบบฟอร์มไม่มีช่องเตือน)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: management.quality.internal-audit.p009
  topics:
  - management.quality.internal-audit
  difficulty: 3
  type: mcq
  stem: ข้อใดเป็นคำถามในรายการตรวจที่ดีที่สุด เมื่อจะตรวจการควบคุมสินค้าไม่เป็นไปตามข้อกำหนดในไลน์ผลิต
  choices:
  - id: a
    text: '"ช่วยแสดงสินค้าที่พบว่าไม่ได้มาตรฐานเมื่อสัปดาห์ก่อน ว่าชี้บ่ง แยกเก็บ และตัดสินใจอย่างไร พร้อมบันทึก"'
    correct: true
  - id: b
    text: '"คุณควบคุมสินค้าไม่ได้มาตรฐานใช่ไหม"'
    feedback: คำถามปิดที่ตอบ "ใช่" ได้ง่าย ไม่ได้หลักฐาน
  - id: c
    text: '"ทำไมคุณถึงปล่อยของเสียออกไป"'
    feedback: เป็นคำถามกล่าวโทษ ทำให้ผู้ถูกตรวจปกป้องตัวเอง
  - id: d
    text: '"มีขั้นตอนเรื่องนี้หรือไม่"'
    feedback: รู้ว่ามีเอกสาร แต่ยังไม่รู้ว่าปฏิบัติจริงหรือไม่
  hints:
  - คำถามที่ดีขอให้ "แสดง" หลักฐาน
  - หลีกเลี่ยงคำถามปิดและคำถามกล่าวโทษ
