  - id: math.sci.p014
    topics: [math.number.scientific-notation]
    difficulty: 3
    type: numeric
    stem: "$(4.2 \\times 10^{5}) + (3.5 \\times 10^{4})$ เขียนในสัญกรณ์วิทยาศาสตร์ได้ $a \\times 10^{5}$ แล้ว $a$ มีค่าเท่าใด"
    answer: { value: 4.55, tolerance: 0.001 }
    hints:
