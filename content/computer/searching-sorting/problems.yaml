  - id: computer.algorithms.searching-sorting.p017
    topics: [computer.algorithms.searching-sorting]
    difficulty: 5
    type: numeric
    stem: |
      นับจำนวนครั้งที่เทียบของการเรียงแบบแทรก โปรแกรมนี้แสดงตัวเลขใด

      ```python
      def insertion_count(a):
          count = 0
          for i in range(1, len(a)):
              key = a[i]
              j = i - 1
              while j >= 0:
                  count = count + 1
                  if a[j] > key:
                      a[j + 1] = a[j]
                      j = j - 1
                  else:
                      break
              a[j + 1] = key
          return count

      print(insertion_count([3, 1, 2, 5, 4]))
      ```
    answer: { value: 6, unit: "ครั้ง" }
    hints:
      - "ไล่ทีละ i: แทรก 1, แทรก 2, แทรก 5, แทรก 4 นับการเทียบแต่ละรอบ"
      - "การเทียบที่ได้ False (ตัวซ้ายไม่มากกว่า) ก็นับ 1 ครั้งแล้วหยุด และถ้า j เลยต้นลิสต์ไปก็หยุดโดยไม่เทียบ"
