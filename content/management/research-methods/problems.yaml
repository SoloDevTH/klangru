  - id: management.research.research-methods.p015
    topics: [management.research.research-methods]
    difficulty: 4
    type: expression
    stem: "จากสูตร $n = \\dfrac{N}{1 + Nd^2}$ จงจัดรูปให้ $N$ อยู่ข้างเดียวของสมการ (ตอบด้วยตัวแปร $n$ และ $d$)"
    prefix: "N ="
    answer: { latex: "\\frac{n}{1-n\\cdot d^{2}}", variables: [n, d] }
    misconceptions:
      - { match: "\\frac{n}{1+n\\cdot d^{2}}", feedback: "ตอนกระจาย $n$ เข้าไปในวงเล็บ เครื่องหมายต้องกลับเป็นลบเมื่อย้ายพจน์ $nNd^2$ ไปอีกข้าง" }
      - { match: "\\frac{n}{1-d^{2}}", feedback: "ลืมคูณ $n$ เข้ากับ $d^2$ ในตัวส่วน" }
    hints:
      - "คูณทั้งสองข้างด้วย $1 + Nd^2$ ก่อนเพื่อกำจัดตัวส่วน"
      - "กระจายแล้วรวมพจน์ที่มี $N$ ไว้ข้างเดียวกัน จากนั้นแยก $N$ ออกมาเป็นตัวประกอบ"
    solution: "$n(1 + Nd^2) = N \\Rightarrow n + nNd^2 = N \\Rightarrow n = N(1 - nd^2) \\Rightarrow N = \\dfrac{n}{1 - nd^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.research.research-methods.p016
    topics: [management.research.research-methods]
    difficulty: 3
    type: numeric
    figure:
      src: p016-likert-counts.svg
      alt: "แผนภูมิแท่งจำนวนผู้ตอบแต่ละระดับของมาตรห้าระดับ ระดับ 1 มี 2 คน ระดับ 2 มี 5 คน ระดับ 3 มี 12 คน ระดับ 4 มี 18 คน และระดับ 5 มี 13 คน"
      caption: "ผลการสำรวจผู้มาติดต่อ 50 คน ตามระดับความพึงพอใจ"
    stem: "จากแผนภูมิ ผู้มาติดต่อ 50 คนให้คะแนนความพึงพอใจตั้งแต่ระดับ 1 (น้อยที่สุด) ถึงระดับ 5 (มากที่สุด) ค่าเฉลี่ยของคะแนนความพึงพอใจเท่าใด (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 3.70, tolerance: 0.01 }
    hints:
      - "คำนวณผลรวมคะแนนทั้งหมดก่อน โดยนำระดับแต่ละระดับคูณด้วยจำนวนคนในระดับนั้น"
      - "เมื่อได้ผลรวมแล้ว หารด้วยจำนวนผู้ตอบทั้งหมด"
    misconceptions:
      - { match: 4, feedback: "นั่นคือค่ามัธยฐานหรือระดับที่มีคนเลือกมากที่สุด ไม่ใช่ค่าเฉลี่ย" }
      - { match: 37, feedback: "หารผลรวมด้วย 5 ซึ่งเป็นจำนวนระดับ แทนที่จะหารด้วย 50 ซึ่งเป็นจำนวนผู้ตอบ" }
    solution: "ผลรวมคะแนน $= 1(2) + 2(5) + 3(12) + 4(18) + 5(13) = 185$ ค่าเฉลี่ย $= 185 / 50 = 3.70$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.research.research-methods.p017
    topics: [management.research.research-methods]
    difficulty: 4
    type: code
    stem: "เขียนฟังก์ชัน `cronbach_alpha(item_vars, total_var)` ที่รับรายการความแปรปรวนรายข้อ (`item_vars`) และความแปรปรวนของคะแนนรวม (`total_var`) แล้วคืนค่าสัมประสิทธิ์แอลฟาของครอนบาค โดยใช้สูตร $\\alpha = \\dfrac{k}{k-1}\\left(1 - \\dfrac{\\sum \\sigma_i^2}{\\sigma_X^2}\\right)$ เมื่อ $k$ คือจำนวนข้อ"
    starter: |
      def cronbach_alpha(item_vars, total_var):
          pass
    tests: |
      r = cronbach_alpha([0.6, 0.8, 0.7, 0.9], 7.5)
      assert r is not None, "ยังไม่ได้คืนค่า (ได้ None) ต้องใช้ return ไม่ใช่ print"
      assert abs(r - 0.8) < 1e-6, f"cronbach_alpha([0.6, 0.8, 0.7, 0.9], 7.5) ควรได้ 0.8 แต่ได้ {r} (ตรวจว่าคูณด้วย k/(k-1) แล้วหรือยัง)"
      r2 = cronbach_alpha([2, 2, 2], 6)
      assert abs(r2) < 1e-6, f"เมื่อความแปรปรวนรวมเท่ากับผลรวมรายข้อ ค่าแอลฟาควรเป็น 0 แต่ได้ {r2}"
    reference: |
      def cronbach_alpha(item_vars, total_var):
          k = len(item_vars)
          return k / (k - 1) * (1 - sum(item_vars) / total_var)
    hints:
      - "จำนวนข้อหาได้จาก len(item_vars) และผลรวมความแปรปรวนรายข้อหาได้จาก sum(item_vars)"
      - "อย่าลืมคูณด้วย k/(k-1) และต้องหารด้วย total_var ไม่ใช่หารด้วยผลรวม"
    solution: "def cronbach_alpha(item_vars, total_var): นับจำนวนข้อ k จากความยาวของรายการ แล้วคืน k/(k-1) × (1 − ผลรวมความแปรปรวนรายข้อ ÷ ความแปรปรวนรวม)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.research.research-methods.p018
    topics: [management.research.research-methods]
    difficulty: 5
    type: numeric
    stem: "กลุ่มวิสาหกิจชุมชนทำกล้วยฉาบ (สมมติ) ต้องการได้แบบสอบถามที่ตอบกลับและนำมาวิเคราะห์ได้อย่างน้อย 267 ชุด จากประสบการณ์เดิมมีผู้ตอบกลับประมาณ 65% ของชุดที่แจกไป ต้องแจกแบบสอบถามอย่างน้อยกี่ชุด (ปัดขึ้นเป็นจำนวนเต็ม)"
    answer: { value: 411, tolerance: 0, unit: "ชุด" }
    hints:
      - "ถ้าแจกไป $x$ ชุด จะได้ตอบกลับประมาณ $0.65x$ ชุด"
      - "จัดรูปเพื่อหา $x$ จากเงื่อนไข $0.65x \\ge 267$ แล้วปัดขึ้นเมื่อได้จำนวนที่ไม่เป็นจำนวนเต็ม"
    misconceptions:
      - { match: 174, feedback: "คูณจำนวนที่ต้องการด้วย 0.65 แทนที่จะหาร จำนวนตอบกลับที่ได้จึงน้อยเกินไป" }
      - { match: 267, feedback: "แจกเท่ากับจำนวนที่ต้องการพอดี แต่ผู้ตอบกลับเพียง 65% จึงได้ไม่ถึง 267" }
    solution: "ให้แจกไป $x$ ชุด ได้ตอบกลับราว $0.65x \\ge 267$ จึง $x \\ge \\dfrac{267}{0.65} \\approx 410.8$ ปัดขึ้นได้ 411 ชุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

