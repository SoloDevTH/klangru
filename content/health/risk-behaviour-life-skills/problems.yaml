problems:
- id: health.safety.risk-behaviour-life-skills.p001
  topics:
  - health.safety.risk-behaviour-life-skills
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็นพฤติกรรมเสี่ยงต่อสุขภาพ
  choices:
  - id: a
    text: ซ้อนรถจักรยานยนต์โดยไม่สวมหมวกนิรภัย
    correct: true
  - id: b
    text: สวมเสื้อชูชีพเมื่อนั่งเรือ
    feedback: เป็นพฤติกรรมที่ช่วยลดความรุนแรงถ้าเกิดเหตุ ไม่ใช่พฤติกรรมเสี่ยง
  - id: c
    text: บอกผู้ปกครองก่อนออกจากบ้าน
    feedback: เป็นการลดความเสี่ยง เพราะมีคนรู้ว่าเราอยู่ที่ไหน
  hints:
  - พฤติกรรมเสี่ยงคือการกระทำที่อาจทำให้ได้รับอันตราย
  - ข้อใดทำให้บาดเจ็บรุนแรงได้ถ้าเกิดอุบัติเหตุ
  solution: การไม่สวมหมวกนิรภัยเพิ่มความรุนแรงของการบาดเจ็บที่ศีรษะเมื่อเกิดอุบัติเหตุ จึงเป็นพฤติกรรมเสี่ยง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.risk-behaviour-life-skills.p002
  topics:
  - health.safety.risk-behaviour-life-skills
  difficulty: 1
  type: mcq
  stem: ถ้าเห็นเหตุทะเลาะวิวาทที่มีอาวุธหน้าตลาด ควรโทรแจ้งตำรวจที่หมายเลขใด
  choices:
  - id: a
    text: '191'
    correct: true
  - id: b
    text: '1669'
    feedback: 1669 ใช้แจ้งเจ็บป่วยฉุกเฉินหรือมีคนบาดเจ็บ ถ้ามีผู้บาดเจ็บโทร 1669 ได้ด้วย แต่เหตุร้ายที่ต้องการตำรวจคือ 191
  - id: c
    text: '1323'
    feedback: 1323 คือสายด่วนสุขภาพจิต
  hints:
  - หมายเลขเหตุด่วนเหตุร้าย
  - เป็นเลข 3 หลัก
  solution: โทร 191 เพื่อแจ้งเหตุร้ายต่อตำรวจ ออกห่างจากเหตุการณ์ และถ้ามีคนบาดเจ็บโทร 1669
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.risk-behaviour-life-skills.p003
  topics:
  - health.safety.risk-behaviour-life-skills
  difficulty: 2
  type: numeric
  stem: ใช้ตารางประเมินความเสี่ยง ถ้าโอกาสเกิดอยู่ระดับ 3 (มาก) และความรุนแรงอยู่ระดับ 2 (ปานกลาง) คะแนนความเสี่ยงเป็นเท่าไร (ตอบเป็นคะแนน)
  answer:
    value: 6
    unit: คะแนน
  misconceptions:
  - match: 5
    feedback: บวกกัน ต้องคูณโอกาสเกิดกับความรุนแรง
  - match: 1
    feedback: ลบกัน ต้องคูณ
  hints:
  - คะแนนความเสี่ยง = โอกาสเกิด × ความรุนแรง
  - 3 × 2
  solution: $3 \times 2 = 6$ อยู่ในช่วง 6–9 จึงเป็นความเสี่ยงสูง ควรหลีกเลี่ยง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.risk-behaviour-life-skills.p004
  topics:
  - health.safety.risk-behaviour-life-skills
  difficulty: 2
  type: match
  stem: จับคู่คำกับตัวอย่าง
  pairs:
  - left: ปัจจัยเสี่ยง
    right: ถูกเพื่อนกดดันให้ลอง
  - left: พฤติกรรมเสี่ยง
    right: เล่นโทรศัพท์ขณะข้ามถนน
  - left: สถานการณ์เสี่ยง
    right: งานเลี้ยงที่มีผู้ใหญ่เมาหลายคน
  - left: ปัจจัยปกป้อง
    right: ครอบครัวที่คุยกันได้ทุกเรื่อง
  hints:
  - พฤติกรรมคือสิ่งที่ทำ สถานการณ์คือเหตุการณ์หรือสถานที่
  - ปัจจัยปกป้องช่วยลดความเสี่ยง
  solution: แรงกดดันจากเพื่อนเป็นปัจจัยเสี่ยง การเล่นโทรศัพท์ขณะข้ามถนนเป็นพฤติกรรมเสี่ยง งานเลี้ยงที่มีคนเมาเป็นสถานการณ์เสี่ยง และครอบครัวที่คุยกันได้เป็นปัจจัยปกป้อง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.risk-behaviour-life-skills.p005
  topics:
  - health.safety.risk-behaviour-life-skills
  difficulty: 2
  type: order
  stem: เรียงขั้นการตัดสินใจและแก้ปัญหา
  items:
  - ระบุปัญหา
  - หาทางเลือกหลายทาง
  - ชั่งผลดีผลเสียของแต่ละทาง
  - เลือกทางที่ปลอดภัยที่สุดและลงมือ
  - ประเมินผล
  hints:
  - ต้องรู้ปัญหาก่อนจึงหาทางเลือกได้
  - ขั้นสุดท้ายคือดูว่าได้ผลหรือไม่
  solution: ระบุปัญหา → หาทางเลือก → ชั่งผลดีผลเสีย → เลือกและลงมือ → ประเมินผล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.risk-behaviour-life-skills.p006
  topics:
  - health.safety.risk-behaviour-life-skills
  difficulty: 2
  type: mcq
  stem: หลังฝนตกหนัก เพื่อนชวนไปกระโดดน้ำเล่นในคลองหลังหมู่บ้านซึ่งน้ำขึ้นสูงและไหลเชี่ยว ข้อใดเหมาะสมที่สุด
  choices:
  - id: a
    text: ปฏิเสธ บอกว่าน้ำเชี่ยวอันตราย ชวนไปทำกิจกรรมอื่น และบอกผู้ใหญ่ถ้าเพื่อนยังจะไป
    correct: true
  - id: b
    text: ไปด้วยแต่ยืนดูอยู่ริมตลิ่ง
    feedback: ตลิ่งหลังฝนตกอาจลื่นและพังได้ และถ้ามีคนจมน้ำ การกระโดดลงไปช่วยเองอันตรายมาก
  - id: c
    text: ไปเล่นเพราะว่ายน้ำเป็น
    feedback: น้ำไหลเชี่ยวพัดคนที่ว่ายน้ำเป็นได้ และอาจมีสิ่งของใต้น้ำ
  hints:
  - ประเมินทั้งโอกาสเกิดและความรุนแรง
  - จมน้ำเป็นสาเหตุการเสียชีวิตสำคัญของวัยรุ่น
  solution: น้ำเชี่ยวหลังฝนตกเสี่ยงสูงและผลร้ายถึงชีวิต จึงควรหลีกเลี่ยง ปฏิเสธพร้อมเสนอทางเลือก และบอกผู้ใหญ่เพื่อช่วยป้องกันเพื่อน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.risk-behaviour-life-skills.p007
  topics:
  - health.safety.risk-behaviour-life-skills
  difficulty: 3
  type: numeric
  stem: บุ๊คประเมินว่าการซ้อนสามโดยไม่มีหมวกนิรภัยมีโอกาสเกิดเหตุระดับ 2 และความรุนแรงระดับ 3 ส่วนการรอรถสองแถวกลับบ้านมีโอกาสเกิดเหตุระดับ 1 และความรุนแรงระดับ 1 ถ้าเลือกรอรถสองแถว คะแนนความเสี่ยงลดลงกี่คะแนน (ตอบเป็นคะแนน)
  answer:
    value: 5
    unit: คะแนน
  misconceptions:
  - match: 6
    feedback: 6 คือคะแนนของการซ้อนสาม ต้องลบคะแนนของการรอรถออก
  - match: 3
    feedback: ดูเหมือนบวกโอกาสกับความรุนแรง (2 + 3 = 5 กับ 1 + 1 = 2) ต้องคูณ
  hints:
  - คำนวณคะแนนของแต่ละทางด้วยการคูณ
  - นำคะแนนมาลบกัน
  solution: ซ้อนสาม $2 \times 3 = 6$ (เสี่ยงสูง) รอรถ $1 \times 1 = 1$ (เสี่ยงต่ำ) ลดลง $6 - 1 = 5$ คะแนน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.risk-behaviour-life-skills.p008
  topics:
  - health.safety.risk-behaviour-life-skills
  difficulty: 3
  type: mcq
  stem: ข้อใดเป็นการลด "ความรุนแรง" ถ้าเกิดเหตุ ไม่ใช่การลดโอกาสเกิด (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: สวมหมวกนิรภัยเมื่อซ้อนจักรยานยนต์
    correct: true
    feedback: ถูก หมวกไม่ได้ทำให้รถล้มน้อยลง แต่ลดการบาดเจ็บที่ศีรษะ
  - id: b
    text: สวมเสื้อชูชีพเมื่อนั่งเรือ
    correct: true
    feedback: ถูก ช่วยให้ลอยน้ำได้ถ้าตกน้ำ
  - id: c
    text: ไปเป็นกลุ่มแทนไปคนเดียว
    feedback: เป็นการลดโอกาสเกิดเหตุ
  - id: d
    text: ไม่เล่นโทรศัพท์ขณะข้ามถนน
    feedback: เป็นการลดโอกาสถูกรถชน
  hints:
  - ความรุนแรงคือผลที่เกิดขึ้นเมื่อเหตุเกิดแล้ว
  - อุปกรณ์ป้องกันมักลดความรุนแรง
  solution: หมวกนิรภัยและเสื้อชูชีพลดความรุนแรงเมื่อเกิดเหตุ ส่วนการไปเป็นกลุ่มและการไม่เล่นโทรศัพท์ขณะข้ามถนนลดโอกาสเกิดเหตุ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.risk-behaviour-life-skills.p009
  topics:
  - health.safety.risk-behaviour-life-skills
  difficulty: 3
  type: mcq
  stem: เพื่อนที่รู้จักในเกมออนไลน์มา 2 เดือน ชวนพลอยไปเจอที่ห้างตามลำพังและขอให้ไม่บอกใคร ข้อใดปลอดภัยที่สุด
  choices:
  - id: a
    text: ไม่ไปเจอตามลำพัง บอกผู้ปกครองเรื่องนี้ และถ้าจะเจอ ต้องให้ผู้ปกครองไปด้วยในที่สาธารณะ
    correct: true
  - id: b
    text: ไปเจอเพราะคุยกันมานานแล้ว
    feedback: คนในโลกออนไลน์อาจไม่ใช่คนที่บอก การขอให้ไม่บอกใครเป็นสัญญาณอันตราย
  - id: c
    text: ไปเจอแต่ส่งที่อยู่บ้านให้เขาก่อน
    feedback: การบอกที่อยู่เพิ่มความเสี่ยง
  hints:
  - การขอให้เก็บเป็นความลับเป็นสัญญาณเตือน
  - ลดความเสี่ยงด้วยการมีผู้ใหญ่รู้และไปด้วย
  solution: ไม่ไปเจอคนที่รู้จักทางออนไลน์ตามลำพัง และบอกผู้ปกครอง โดยเฉพาะเมื่อถูกขอให้ปิดเป็นความลับ ถ้ารู้สึกไม่ปลอดภัยหรือถูกข่มขู่ ขอความช่วยเหลือได้ที่ 1300
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.risk-behaviour-life-skills.p010
  topics:
  - health.safety.risk-behaviour-life-skills
  difficulty: 3
  type: text
  stem: ทักษะชีวิตที่หมายถึงการรู้จักความคิด อารมณ์ จุดเด่น และจุดด้อยของตัวเอง เรียกว่าอะไร (ตอบชื่อทักษะ)
  accepted:
  - การตระหนักรู้ในตนเอง
  - ตระหนักรู้ในตนเอง
  - การตระหนักรู้ตนเอง
  - ตระหนักรู้ตนเอง
  - การรู้จักตนเอง
  - รู้จักตนเอง
  misconceptions:
  - match: ความเห็นใจผู้อื่น
    feedback: ความเห็นใจผู้อื่นคือการเข้าใจความรู้สึกของคนอื่น ไม่ใช่ของตัวเอง
  hints:
  - เป็นคู่กับความเห็นใจผู้อื่นในรายการทักษะชีวิตของ WHO
  - เกี่ยวกับการรู้จักตัวเอง
  solution: การตระหนักรู้ในตนเองคือการรู้จักความคิด อารมณ์ จุดเด่น และจุดด้อยของตัวเอง ช่วยให้รู้ว่าตัวเองอ่อนไหวต่อแรงกดดันแบบใด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.risk-behaviour-life-skills.p011
  topics:
  - health.safety.risk-behaviour-life-skills
  difficulty: 3
  type: mcq
  stem: ครอบครัวของแนนตั้ง "รหัสลับ" ว่าถ้าแนนส่งข้อความคำว่า "ฝนตก" ผู้ปกครองจะโทรมาเรียกให้กลับบ้านทันที รหัสลับนี้ช่วยอย่างไร
  choices:
  - id: a
    text: ช่วยให้ออกจากสถานการณ์ที่ไม่ปลอดภัยได้โดยไม่ต้องอธิบายหรือปฏิเสธต่อหน้าเพื่อน
    correct: true
  - id: b
    text: ช่วยให้ผู้ปกครองติดตามทุกอย่างที่แนนทำ
    feedback: รหัสลับใช้เมื่อแนนต้องการความช่วยเหลือ ไม่ใช่การติดตาม
  - id: c
    text: ใช้บอกเพื่อนว่าฝนกำลังจะตก
    feedback: เป็นรหัสระหว่างแนนกับครอบครัว ไม่เกี่ยวกับสภาพอากาศ
  hints:
  - บางครั้งการปฏิเสธต่อหน้ากลุ่มเพื่อนทำได้ยาก
  - รหัสนี้มีไว้ใช้ตอนไหน
  solution: รหัสลับเป็นทักษะการหลีกเลี่ยงสถานการณ์คับขัน ช่วยให้ขอความช่วยเหลือได้เงียบ ๆ และออกจากสถานการณ์ได้เร็ว
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.risk-behaviour-life-skills.p012
  topics:
  - health.safety.risk-behaviour-life-skills
  difficulty: 4
  type: mcq
  stem: หลังงานบวชตอนดึก ลุงที่ดื่มเหล้ามาทั้งวันจะขับรถไปส่งดาวกับน้อง ส่วนผู้ใหญ่คนอื่นยังไม่กลับ ดาวควรทำอย่างไร
  choices:
  - id: a
    text: ไม่ขึ้นรถ ขอให้ผู้ใหญ่ที่ไม่ได้ดื่มไปส่ง หรือโทรให้ผู้ปกครองมารับ และพาน้องอยู่ในที่ที่มีผู้ใหญ่ดูแล
    correct: true
  - id: b
    text: ขึ้นรถเพราะเกรงใจลุง
    feedback: ผู้ขับที่ดื่มแล้วตอบสนองช้า โอกาสเกิดเหตุสูงและผลร้ายอาจถึงชีวิต ความปลอดภัยสำคัญกว่าความเกรงใจ
  - id: c
    text: ขึ้นรถแต่ให้ลุงขับช้า ๆ
    feedback: แอลกอฮอล์ทำให้ตอบสนองช้าแม้ขับช้า การไม่ขึ้นรถปลอดภัยที่สุด
  hints:
  - ประเมินโอกาสเกิดและความรุนแรงของการนั่งรถคนเมา
  - ใครช่วยได้บ้างในเวลานั้น
  solution: การนั่งรถคนที่ดื่มมีความเสี่ยงสูง ทางที่ปลอดภัยคือไม่ขึ้นรถ หาผู้ใหญ่ที่ไม่ได้ดื่มหรือโทรให้ผู้ปกครองมารับ และดูแลน้องให้อยู่ในที่ปลอดภัย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.risk-behaviour-life-skills.p013
  topics:
  - health.safety.risk-behaviour-life-skills
  difficulty: 4
  type: numeric
  stem: การขี่จักรยานไปโรงเรียนของต้นมีโอกาสเกิดเหตุระดับ 2 และความรุนแรงระดับ 2 เมื่อต้นสวมหมวกนิรภัย ความรุนแรงลดเหลือระดับ 1 ส่วนโอกาสเกิดเท่าเดิม คะแนนความเสี่ยงลดลงกี่เปอร์เซ็นต์ (ตอบเป็นร้อยละ)
  answer:
    value: 50
    unit: "%"
  misconceptions:
  - match: 2
    feedback: 2 คือคะแนนที่ลดลง โจทย์ถามเป็นเปอร์เซ็นต์ของคะแนนเดิม
  - match: 100
    feedback: คะแนนไม่ได้ลดเหลือศูนย์ ยังมีความเสี่ยงอยู่ 2 คะแนน
  hints:
  - คะแนนเดิม 2 × 2 คะแนนใหม่ 2 × 1
  - เปอร์เซ็นต์ที่ลดลง = (คะแนนที่ลดลง ÷ คะแนนเดิม) × 100
  solution: คะแนนเดิม $2 \times 2 = 4$ คะแนนใหม่ $2 \times 1 = 2$ ลดลง $\frac{4 - 2}{4} \times 100 = 50\%$ หมวกนิรภัยไม่ได้ทำให้อุบัติเหตุหายไป แต่ลดความรุนแรงของการบาดเจ็บที่ศีรษะ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.risk-behaviour-life-skills.p014
  topics:
  - health.safety.risk-behaviour-life-skills
  difficulty: 4
  type: mcq
  stem: เลิกเรียนแล้ว เพื่อนสองกลุ่มกำลังจะตีกันหน้าโรงเรียน มีคนยื่นไม้ให้ภูมิ "เข้าไปช่วยพวกเรา" ข้อใดเหมาะสมที่สุด
  choices:
  - id: a
    text: ไม่รับไม้ เดินออกห่าง แจ้งครูหรือยามทันที และถ้ามีอาวุธหรือมีคนบาดเจ็บโทร 191 หรือ 1669
    correct: true
  - id: b
    text: รับไม้ไว้ก่อนเพื่อไม่ให้เพื่อนโกรธ
    feedback: การถืออาวุธทำให้ตัวเองตกเป็นเป้าและอาจทำร้ายผู้อื่น
  - id: c
    text: เข้าไปห้ามด้วยตัวเองคนเดียว
    feedback: อาจบาดเจ็บได้ การแจ้งผู้ใหญ่หรือเจ้าหน้าที่ปลอดภัยกว่า
  hints:
  - ความรุนแรงที่มีอาวุธมีความรุนแรงสูงมาก
  - ใครมีหน้าที่และอำนาจหยุดเหตุการณ์
  solution: หลีกเลี่ยงการเข้าไปเกี่ยวข้อง ออกห่าง และแจ้งครูหรือเจ้าหน้าที่ทันที โทร 191 เมื่อมีเหตุร้ายและ 1669 เมื่อมีคนบาดเจ็บ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.risk-behaviour-life-skills.p015
  topics:
  - health.safety.risk-behaviour-life-skills
  difficulty: 5
  type: mcq
  stem: ช่วงสงกรานต์ เพื่อนในกลุ่มวางแผนขี่จักรยานยนต์ซ้อนกันไปเล่นน้ำที่ถนนใหญ่ บางคนจะดื่มเบียร์ด้วย และไม่มีใครเอาหมวกนิรภัยไป ใช้ห้าขั้นตัดสินใจ แผนใดดีที่สุด
  choices:
  - id: a
    text: ระบุว่าความเสี่ยงคือถนน แอลกอฮอล์ และไม่มีหมวก เสนอให้ไปเล่นน้ำที่วัดใกล้บ้านที่มีผู้ใหญ่ดูแล ให้ผู้ปกครองไปส่ง ไม่ดื่ม และตกลงเวลากลับ ถ้าเพื่อนยังจะไปแบบเดิม เราไม่ไปด้วยและบอกผู้ใหญ่
    correct: true
  - id: b
    text: ไปตามแผนเดิมเพราะปีละครั้ง
    feedback: คะแนนความเสี่ยงสูงทั้งโอกาสเกิดและความรุนแรง และช่วงเทศกาลมีอุบัติเหตุมาก
  - id: c
    text: ไปตามแผนเดิมแต่ขอเป็นคนขับเองเพราะไม่ได้ดื่ม
    feedback: ยังไม่มีหมวกนิรภัย ซ้อนกันหลายคน และถนนช่วงเทศกาลมีคนเมาขับขี่ จึงยังเสี่ยงสูง
  hints:
  - ระบุความเสี่ยงให้ครบก่อน
  - ทางเลือกที่ดีลดทั้งโอกาสเกิดและความรุนแรง
  solution: แผนที่ดีระบุปัญหาครบ เสนอทางเลือกที่ลดทั้งโอกาสเกิด (ไม่ใช้ถนนใหญ่ ไม่ดื่ม มีผู้ใหญ่ดูแล) และความรุนแรง และกล้าปฏิเสธเมื่อเพื่อนยังเลือกทางเสี่ยง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.risk-behaviour-life-skills.p016
  topics:
  - health.safety.risk-behaviour-life-skills
  difficulty: 5
  type: mcq
  stem: คลิปท้าทายในโซเชียลชวนให้กระโดดจากสะพานสูงลงแม่น้ำแล้วถ่ายคลิป เพื่อนบอกว่า "คนลองเยอะแยะ แทบไม่มีใครเป็นอะไร" ข้อใดวิเคราะห์ได้ดีที่สุด
  choices:
  - id: a
    text: แม้จะอ้างว่าโอกาสเกิดเหตุน้อย แต่ผลร้ายอาจถึงชีวิต เช่น กระแทกสิ่งของใต้น้ำ คอหักจนเป็นอัมพาต หรือจมน้ำ ตามหลักการประเมิน ถ้าผลร้ายรุนแรงถึงชีวิตให้หลีกเลี่ยงไว้ก่อน ไม่ทำ ไม่แชร์ และบอกผู้ใหญ่
    correct: true
  - id: b
    text: ลองได้เพราะคะแนนความเสี่ยงต่ำ
    feedback: ดูแค่โอกาสเกิดไม่พอ ผลร้ายที่ถึงชีวิตต้องหลีกเลี่ยง และคำว่า "แทบไม่มีใครเป็นอะไร" ไม่มีหลักฐาน
  - id: c
    text: ลองได้ถ้ามีเพื่อนถ่ายคลิปอยู่ด้วย
    feedback: การมีคนถ่ายคลิปไม่ได้ช่วยป้องกันการบาดเจ็บ และคนที่กระโดดลงไปช่วยก็อาจจมน้ำได้
  hints:
  - ดูความรุนแรงของผลร้าย ไม่ใช่แค่โอกาสเกิด
  - ข้ออ้างของเพื่อนมีหลักฐานหรือไม่
  solution: การกระโดดจากที่สูงลงแหล่งน้ำที่ไม่รู้ความลึกเสี่ยงต่อการบาดเจ็บที่ศีรษะและไขสันหลังและการจมน้ำ แม้มีคนอ้างว่าเกิดยาก ก็ต้องหลีกเลี่ยง ไม่ส่งต่อคลิป และชวนเพื่อนไม่ทำ
