    choices:
      - { id: a, text: "$\\mathrm{SiO_2}$ เป็นโครงผลึกร่างตาข่าย Si แต่ละอะตอมยึดกับ O 4 อะตอมต่อกันไปทั้งก้อน การหลอมต้องทำลายพันธะโคเวเลนต์จำนวนมาก", correct: true, feedback: "ถูก สูตร $\\mathrm{SiO_2}$ บอกแค่อัตราส่วน Si : O = 1 : 2 ในโครงร่างตาข่าย ไม่ใช่โมเลกุลเล็ก ๆ แยกกัน" }
      - { id: b, text: "$\\mathrm{SiO_2}$ เป็นสารประกอบไอออนิกเพราะ Si เป็นโลหะ", feedback: "ซิลิคอนเป็นกึ่งโลหะ และ Si กับ O ยึดกันด้วยพันธะโคเวเลนต์ ไม่ได้เกิดเป็นไอออน" }
      - { id: c, text: "พันธะ Si–O ในแต่ละโมเลกุลเป็นพันธะสาม จึงแข็งแรงมาก", feedback: "ความต่างไม่ได้อยู่ที่ชนิดพันธะในโมเลกุลเดียว แต่อยู่ที่ $\\mathrm{SiO_2}$ ไม่ได้อยู่เป็นโมเลกุลเล็กเลย อะตอมต่อกันเป็นโครงสร้างใหญ่ทั้งก้อน" }
