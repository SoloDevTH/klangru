lessons:
- type: explanation
  file: lesson.md
- type: figure
  src: sequence-words.svg
  alt: 'เส้นเวลาสี่จุดเรียงจากซ้ายไปขวา: 首先 ขั้นแรก 然后 จากนั้น 后来 ต่อมา 最后 สุดท้าย ใต้เส้นมีประโยคตัวอย่างสี่ประโยคที่ใช้คำเชื่อมแต่ละคำ'
  caption: คำบอกลำดับทำให้เห็นว่าเหตุการณ์ใดเกิดก่อนหลัง
- type: check
  problem: chinese.reading.longer-passages.p002
  prompt: 'ลองหาใจความสำคัญก่อนดูคำตอบ: ประโยคไหนบอกเรื่องหลักของข้อความ'
- type: worked-example
  title: หาใจความและรายละเอียดจากข้อความร้านหนังสือ
  problem: 我住的小区在曼谷，小区门口新开了一家书店。书店不大，但是很安静。每个周末，很多居民都会来这里看书。 ใจความคืออะไร และมีรายละเอียดอะไรบ้าง
  steps:
  - text: 'หาเรื่องหลัก: มีร้านหนังสือใหม่เปิดที่หน้าชุมชน (新开了一家书店)'
    why: ประโยคที่มีคำว่า 新开 บอกเหตุการณ์หลักของข้อความ
  - text: 'รายละเอียดที่สนับสนุน: ร้านเล็กแต่เงียบ (不大，但是很安静) และคนมาอ่านหนังสือทุกสุดสัปดาห์ (每个周末，很多居民都会来)'
    why: 但是 แยกข้อมูลสองด้านของร้าน จึงควรอ่านทั้งสองส่วน
  - text: ตัดรายละเอียดออก เรื่องหลักยังอยู่ จึงยืนยันว่าเป็นใจความ
  answer: 'ใจความ: ชุมชนมีร้านหนังสือใหม่ · รายละเอียด: ร้านเล็กแต่เงียบ และคนมาอ่านหนังสือทุกสุดสัปดาห์'
- type: worked-example
  title: เดาคำจากส่วนประกอบของอักษร
  problem: 图书馆 ในข้อความหมายถึงอะไร (ไม่มีในพจนานุกรมที่ผู้เรียนมี)
  steps:
  - text: 'แยกคำประสม: 图书 (หนังสือ) + 馆 (อาคารหรือสถานที่)'
    why: คำประสมสองคำมักบอกความหมายของแต่ละส่วนได้
  - text: 'ดูบริบท: ถ้าเป็นสถานที่ที่มีคนเข้าไปอ่านหนังสือ ความหมายน่าจะตรงกับคำประสม'
  - text: 'รวมความหมาย: 图书馆 คือห้องสมุด'
  answer: 图书馆 = ห้องสมุด
- type: check
  problem: chinese.reading.longer-passages.p011
  prompt: ลองเดาความหมายของ 竹子 จากประโยคก่อนหน้าก่อนดูคำตอบ
glossary:
- term: 大意 dàyì
  definition: ใจความสำคัญ เรื่องหลักที่ตอบได้ว่าใครทำอะไรหรือเกิดอะไรขึ้น
- term: 细节 xìjié
  definition: รายละเอียดที่สนับสนุนใจความ ตัดออกแล้วเรื่องหลักยังอยู่
- term: 首先 · 然后 · 后来 · 最后
  definition: คำบอกลำดับ ขั้นแรก จากนั้น ต่อมา และสุดท้าย
- term: 部首 bùshǒu
  definition: ส่วนของอักษรที่บอกความหมายโดยรวม เช่น 氵 เกี่ยวกับน้ำ
- term: 窍门 qiàomén
  definition: เคล็ดลับ วิธีที่ทำให้งานง่ายขึ้น
flashcards:
- front: 书店 shūdiàn
  back: ร้านหนังสือ
- front: 首先 · 然后 · 后来 · 最后
  back: ขั้นแรก · จากนั้น · ต่อมา · สุดท้าย
- front: สามขั้นแรกของการอ่านข้อความยาว
  back: อ่านคำถามก่อน → หาคำสำคัญ → ดูคำเชื่อม
- front: 图书馆 = 图书 + 馆
  back: ห้องสมุด (หนังสือ + อาคาร)
