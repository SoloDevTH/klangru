problems:
- id: chinese.hanzi.radicals.p001
  topics:
  - chinese.hanzi.radicals
  difficulty: 1
  type: mcq
  stem: อักษร 你 (คุณ) 他 (เขา) 们 (พวก) มีส่วนประกอบ 亻 ทางซ้ายเหมือนกัน 亻 เกี่ยวกับเรื่องใด
  choices:
  - id: a
    text: ต้นไม้
    feedback: หมวดต้นไม้คือ 木
  - id: b
    text: ปาก
    feedback: หมวดปากคือ 口
  - id: c
    text: คน
    correct: true
    feedback: ถูก 亻 คือรูปย่อของ 人 (คน) เรียกว่า 单人旁 dānrénpáng
  - id: d
    text: น้ำ
    feedback: หมวดน้ำคือ 氵 (สามจุด)
  hints:
  - 亻 มีรูปคล้าย 人 ที่ยืนตรง
  - 你 他 们 ล้วนเป็นคำที่ใช้เรียกคน
  solution: 亻 = รูปย่อของ **人 (คน)** อักษรที่มี 亻 มักเกี่ยวกับคน เช่น 你 他 们 住 (อยู่อาศัย)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.hanzi.radicals.p002
  topics:
  - chinese.hanzi.radicals
  difficulty: 1
  type: mcq
  stem: อักษร 河 (แม่น้ำ) 海 (ทะเล) 洗 (ล้าง) มีส่วนประกอบใดเหมือนกัน
  choices:
  - id: a
    text: 口 ทางขวา
    feedback: มีเฉพาะ 河 ที่มี 口 อยู่ใน 可
  - id: b
    text: 木 ด้านบน
    feedback: ไม่มีอักษรใดมี 木
  - id: c
    text: 亻 ทางซ้าย
    feedback: 亻 เป็นหมวดคน ส่วนทางซ้ายของสามคำนี้คือสามจุด
  - id: d
    text: 氵 (สามจุดน้ำ) ทางซ้าย
    correct: true
    feedback: ถูก 氵 เรียกว่า 三点水 sāndiǎnshuǐ แปลว่า สามจุดน้ำ
  hints:
  - ดูส่วนทางซ้ายของแต่ละตัว
  - แม่น้ำ ทะเล และการล้าง ล้วนเกี่ยวกับน้ำ
  solution: ทั้งสามตัวมี **氵** (三点水 สามจุดน้ำ) จึงเกี่ยวกับน้ำ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.hanzi.radicals.p003
  topics:
  - chinese.hanzi.radicals
  difficulty: 2
  type: match
  stem: จับคู่หมวดอักษร (部首) กับความหมายที่มักเกี่ยวข้อง
  pairs:
  - left: 亻
    right: คน
  - left: 氵
    right: น้ำ
  - left: 木
    right: ต้นไม้ ไม้
  - left: 女
    right: ผู้หญิง
  - left: 口
    right: ปาก การพูด การกิน
  - left: 艹
    right: หญ้า พืช
  hints:
  - 亻 มาจาก 人 และ 氵 มาจาก 水
  - 艹 อยู่ด้านบนของอักษร เช่น 花 (ดอกไม้)
  solution: 亻 คน · 氵 น้ำ · 木 ต้นไม้ · 女 ผู้หญิง · 口 ปาก · 艹 หญ้า พืช
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.hanzi.radicals.p004
  topics:
  - chinese.hanzi.radicals
  difficulty: 2
  type: mcq
  stem: อักษร 好 (hǎo ดี) มีโครงสร้างแบบใด
  choices:
  - id: a
    text: อักษรเดี่ยว แยกส่วนไม่ได้
    feedback: 好 แยกได้เป็น 女 กับ 子
  - id: b
    text: ซ้าย-ขวา (女 + 子)
    correct: true
    feedback: ถูก 女 อยู่ซ้าย 子 อยู่ขวา
  - id: c
    text: บน-ล่าง
    feedback: ส่วนประกอบของ 好 วางเคียงกันซ้ายขวา ไม่ได้ซ้อนบนล่าง
  - id: d
    text: ล้อมรอบ
    feedback: 好 ไม่มีกรอบล้อม
  hints:
  - ลองแบ่งอักษรเป็นสองส่วน
  - ส่วนแรกคือ 女 (ผู้หญิง) ส่วนที่สองคือ 子 (ลูก)
  solution: 好 = 女 (ซ้าย) + 子 (ขวา) เป็นโครงสร้าง **ซ้าย-ขวา** 左右结构
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.hanzi.radicals.p005
  topics:
  - chinese.hanzi.radicals
  difficulty: 2
  type: match
  stem: จับคู่อักษรกับโครงสร้าง
  pairs:
  - left: 林 (ป่า)
    right: ซ้าย-ขวา
  - left: 早 (เช้า)
    right: บน-ล่าง
  - left: 国 (ประเทศ)
    right: ล้อมรอบทั้งสี่ด้าน
  - left: 这 (นี่)
    right: ล้อมครึ่ง (ซ้ายและล่าง)
  - left: 人 (คน)
    right: อักษรเดี่ยว
  hints:
  - 早 คือ 日 อยู่บน 十 อยู่ล่าง
  - 这 มี 辶 โอบจากซ้ายลงล่าง
  solution: 林 = 木+木 ซ้าย-ขวา · 早 = 日 บน 十 ล่าง · 国 = 囗 ล้อม 玉 · 这 = 辶 โอบ 文 · 人 อักษรเดี่ยว
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.hanzi.radicals.p006
  topics:
  - chinese.hanzi.radicals
  difficulty: 2
  type: hanzi
  stem: เขียนอักษร 林 (lín) ที่แปลว่า ป่า ตามลำดับขีด (ต้นไม้ 木 สองต้นเป็นป่า)
  character: 林
  pinyin: lín
  meaning: ป่า
  hints:
  - เขียน 木 ทางซ้ายก่อน แล้วจึงเขียน 木 ทางขวา
  - 木 ทางซ้ายเขียนแคบ ขีดสุดท้ายเปลี่ยนจาก 捺 เป็นจุด เพื่อเว้นที่ให้ตัวขวา
  solution: '木 ซ้าย: 横 → 竖 → 撇 → 点 · 木 ขวา: 横 → 竖 → 撇 → 捺 รวม 8 ขีด'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.hanzi.radicals.p007
  topics:
  - chinese.hanzi.radicals
  difficulty: 3
  type: mcq
  stem: เมนูร้านอาหารจีนในกรุงเทพฯ มีคำว่า 汤 (tāng) เราไม่รู้จักคำนี้ แต่เห็น 氵 ทางซ้าย ควรเดาว่า 汤 น่าจะเป็นอาหารประเภทใด
  choices:
  - id: a
    text: ซุป น้ำแกง
    correct: true
    feedback: ถูก 氵 บอกว่าเกี่ยวกับน้ำ 汤 แปลว่า ซุป
  - id: b
    text: ของทอด
    feedback: ของทอดไม่เกี่ยวกับน้ำโดยตรง
  - id: c
    text: ขนมปัง
    feedback: ขนมปังไม่เกี่ยวกับน้ำ
  - id: d
    text: ผัก
    feedback: อักษรเกี่ยวกับพืชมักมี 艹 ด้านบน
  hints:
  - หมวดอักษรบอกกลุ่มของความหมาย
  - 氵 คือหมวดน้ำ อาหารแบบไหนเป็นน้ำ
  solution: 氵 บอกว่าเกี่ยวกับน้ำ **汤 tāng = ซุป น้ำแกง** เช่น 鸡汤 jītāng (ซุปไก่)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.hanzi.radicals.p008
  topics:
  - chinese.hanzi.radicals
  difficulty: 3
  type: mcq
  stem: ร้านน้ำชาในเยาวราชมีป้าย 茶 (chá ชา) ส่วนใดของอักษรนี้บอกว่าเกี่ยวกับพืช
  choices:
  - id: a
    text: 茶 ไม่มีส่วนที่บอกความหมาย
    feedback: 茶 มีหมวดอักษร 艹
  - id: b
    text: 艹 ด้านบน
    correct: true
    feedback: ถูก 艹 เรียกว่า 草字头 cǎozìtóu (หัวหญ้า) ชามาจากใบของต้นชา
  - id: c
    text: 人 ตรงกลาง
    feedback: 人 คือคน ไม่ได้บอกเรื่องพืช
  - id: d
    text: 木 ด้านล่าง
    feedback: ส่วนล่างของ 茶 คล้าย 木 แต่หมวดอักษรตามพจนานุกรมคือ 艹
  hints:
  - หมวดอักษรไม่จำเป็นต้องอยู่ทางซ้าย
  - อักษร 花 (ดอกไม้) 草 (หญ้า) ก็มีส่วนนี้ด้านบน
  solution: '**艹** (草字头) ด้านบนบอกว่าเกี่ยวกับพืช 茶 จึงอยู่ในหมวด 艹 เช่นเดียวกับ 花 草 菜'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.hanzi.radicals.p009
  topics:
  - chinese.hanzi.radicals
  difficulty: 3
  type: numeric
  stem: 'การค้นพจนานุกรมด้วยหมวดอักษร: อักษร 妈 (mā แม่) อยู่ในหมวด 女 ซึ่งมี 3 ขีด ส่วนที่เหลือ (马) มีกี่ขีด (ตอบเป็นตัวเลข)'
  answer:
    value: 3
    unit: ขีด
  misconceptions:
  - match: 6
    feedback: 6 คือจำนวนขีดทั้งหมดของ 妈 ข้อนี้ถามเฉพาะส่วนที่เหลือหลังตัดหมวดอักษร
  - match: 4
    feedback: 马 เขียน 3 ขีด ขีดที่หักมุมหลายครั้งโดยไม่ยกปากกานับเป็นขีดเดียว
  hints:
  - ตัด 女 ออก เหลือ 马
  - '马: ขีดหักมุมต่อเนื่องนับเป็นขีดเดียว'
  solution: 妈 = 女 (3 ขีด) + 马 (3 ขีด) จึงเหลือ **3** ขีด เปิดหมวด 女 แล้วหาในช่อง 3 ขีด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.hanzi.radicals.p010
  topics:
  - chinese.hanzi.radicals
  difficulty: 3
  type: numeric
  stem: อักษร 河 (hé แม่น้ำ) ประกอบด้วย 氵 (3 ขีด) กับ 可 (5 ขีด) อักษร 河 มีทั้งหมดกี่ขีด
  answer:
    value: 8
    unit: ขีด
  misconceptions:
  - match: 7
    feedback: 氵 มี 3 ขีด (จุด จุด และ 提) ไม่ใช่ 2
  - match: 5
    feedback: 5 คือขีดของ 可 อย่างเดียว ต้องบวก 氵 ด้วย
  hints:
  - นับขีดของแต่ละส่วนแล้วบวกกัน
  - 氵 = จุด + จุด + ขีดตวัดขึ้น
  solution: 3 + 5 = **8** ขีด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.hanzi.radicals.p011
  topics:
  - chinese.hanzi.radicals
  difficulty: 3
  type: mcq
  stem: 妈 (mā แม่) และ 吗 (ma คำลงท้ายคำถาม) มี 马 (mǎ ม้า) เป็นส่วนประกอบ 马 ทำหน้าที่อะไรในสองอักษรนี้
  choices:
  - id: a
    text: บอกเสียงอ่าน
    correct: true
    feedback: ถูก ทั้ง mā และ ma ออกเสียงคล้าย mǎ ส่วนอีกฝั่ง (女 口) บอกความหมาย
  - id: b
    text: บอกว่าเกี่ยวกับม้า
    feedback: แม่และคำลงท้ายคำถามไม่เกี่ยวกับม้า
  - id: c
    text: บอกจำนวนขีด
    feedback: ส่วนประกอบไม่ได้มีไว้บอกจำนวนขีด
  - id: d
    text: ไม่มีหน้าที่อะไร
    feedback: 马 บอกเสียง เป็นส่วนสำคัญของอักษรแบบ 形声字
  hints:
  - เทียบพินอินของ 妈 吗 และ 马
  - อักษรจีนจำนวนมากมีส่วนบอกความหมายกับส่วนบอกเสียง
  solution: '妈 = 女 (ความหมาย: ผู้หญิง) + 马 (**เสียง** ma) · 吗 = 口 (ความหมาย: การพูด) + 马 (เสียง) เรียกว่า **形声字** อักษรรูปบอกความหมาย-เสียง'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.hanzi.radicals.p012
  topics:
  - chinese.hanzi.radicals
  difficulty: 4
  type: mcq
  stem: ป้ายพยากรณ์อากาศสำหรับนักท่องเที่ยวชาวจีนในภูเก็ตเขียนว่า 今天＿ (วันนี้ฟ้าแจ่มใส แดดดี) ช่องว่างควรเป็นอักษรใด
  choices:
  - id: a
    text: 请 qǐng
    feedback: 请 มี 讠 (คำพูด) แปลว่า เชิญ กรุณา
  - id: b
    text: 晴 qíng
    correct: true
    feedback: ถูก 日 (ดวงอาทิตย์) + 青 (เสียง qīng) = ฟ้าแจ่มใส
  - id: c
    text: 清 qīng
    feedback: 清 มี 氵 แปลว่า ใส (น้ำใส) ไม่ได้ใช้บอกสภาพอากาศ
  - id: d
    text: 情 qíng
    feedback: 情 มี 忄 (ใจ) แปลว่า ความรู้สึก
  hints:
  - ทุกตัวเลือกมี 青 ซึ่งบอกเสียง ให้ดูส่วนที่บอกความหมาย
  - อากาศแดดดีเกี่ยวกับดวงอาทิตย์
  solution: '**晴** qíng = 日 (ดวงอาทิตย์) + 青 (เสียง) แปลว่า ฟ้าแจ่มใส 今天晴 = วันนี้แดดดี'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.hanzi.radicals.p013
  topics:
  - chinese.hanzi.radicals
  difficulty: 4
  type: match
  stem: อักษรสี่ตัวนี้มี 青 qīng บอกเสียงเหมือนกัน จับคู่อักษรกับความหมายโดยดูหมวดอักษร
  pairs:
  - left: 清 (氵)
    right: ใส สะอาด (อย่างน้ำใส)
  - left: 晴 (日)
    right: ฟ้าแจ่มใส
  - left: 情 (忄)
    right: ความรู้สึก
  - left: 请 (讠)
    right: เชิญ กรุณา
  hints:
  - 氵 น้ำ · 日 ดวงอาทิตย์ · 忄 ใจ · 讠 คำพูด
  - 忄 คือรูปของ 心 (หัวใจ) เมื่ออยู่ทางซ้าย
  solution: 清 qīng ใส · 晴 qíng แจ่มใส · 情 qíng ความรู้สึก · 请 qǐng เชิญ (ทุกตัวออกเสียงคล้าย qīng ต่างวรรณยุกต์)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.hanzi.radicals.p014
  topics:
  - chinese.hanzi.radicals
  difficulty: 4
  type: order
  stem: เรียงขั้นตอนการค้นอักษร 河 ในพจนานุกรมด้วยวิธีหมวดอักษร (部首检字法)
  items:
  - หาหมวดอักษรของ 河 คือ 氵
  - นับขีดของหมวดอักษร (3 ขีด) แล้วเปิดสารบัญหมวดอักษรตรงช่อง 3 ขีด
  - นับขีดส่วนที่เหลือ 可 (5 ขีด) แล้วหาในรายการอักษรของหมวด 氵 ช่อง 5 ขีด
  - เปิดไปหน้าที่ระบุ แล้วอ่านพินอินและความหมาย
  hints:
  - เริ่มจากรู้ว่าอักษรอยู่หมวดใด
  - 'นับขีดสองครั้ง: ครั้งแรกนับหมวด ครั้งที่สองนับส่วนที่เหลือ'
  solution: หาหมวด → นับขีดหมวดแล้วเปิดสารบัญ → นับขีดส่วนที่เหลือแล้วหาในรายการ → เปิดหน้าที่ระบุ ได้ 河 hé แม่น้ำ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.hanzi.radicals.p015
  topics:
  - chinese.hanzi.radicals
  difficulty: 4
  type: mcq
  stem: อักษร 想 (xiǎng คิด อยาก) อยู่ในหมวดอักษรใด
  choices:
  - id: a
    text: 心 ด้านล่าง
    correct: true
    feedback: ถูก ความคิดและความรู้สึกเกี่ยวกับใจ หมวด 心 อยู่ด้านล่างของ 想
  - id: b
    text: 木 ด้านบนซ้าย
    feedback: 木 เป็นส่วนของ 相 (xiāng) ซึ่งบอกเสียง ไม่ใช่หมวดอักษร
  - id: c
    text: 目 ด้านบนขวา
    feedback: 目 เป็นส่วนของ 相 เช่นกัน
  - id: d
    text: 亻 ทางซ้าย
    feedback: 想 ไม่มี 亻
  hints:
  - หมวดอักษรไม่ได้อยู่ทางซ้ายเสมอ
  - 想 = 相 (เสียง xiāng) + ส่วนที่บอกความหมาย
  solution: 想 = 相 (บอกเสียง xiāng) + **心** (ใจ บอกความหมาย) อยู่ในหมวด 心 ด้านล่าง
  license: CC-BY-SA-4.0
