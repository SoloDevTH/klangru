id: physics.units.measurement
subject: physics
title: { th: การวัดและเลขนัยสำคัญ, en: Measurement and significant figures }
summary: อ่านค่าจากเครื่องมือวัดตามความละเอียด นับเลขนัยสำคัญ ปัดเศษ คำนวณกับผลการวัด และบอกความคลาดเคลื่อนของผลการวัด
difficulty: 3
minutes: 35
prerequisites: [physics.units.si, math.number.scientific-notation]
encompasses:
  - { id: physics.units.si, weight: 0.3 }
  - { id: math.number.scientific-notation, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: interactive
    title: อ่านค่าระหว่างขีดสเกลของไม้บรรทัด
    caption: ขยายช่วง 12.3 ถึง 12.4 cm ของไม้บรรทัดที่มีขีดทุก 1 mm ปลายดินสออยู่กลางช่อง จึงอ่านได้ 12.35 cm และค่าจริงน่าจะอยู่ระหว่าง 12.30 ถึง 12.40 cm คือคลาดเคลื่อนได้ครึ่งช่อง (±0.05 cm)
    widget:
      kind: number-line
      min: 12.25
      max: 12.45
      points:
        - { value: 12.3, label: "12.30" }
        - { value: 12.35, label: "อ่านได้ 12.35" }
        - { value: 12.4, label: "12.40" }
      jumps:
        - { from: 12.35, to: 12.3, label: "−0.05" }
        - { from: 12.35, to: 12.4, label: "+0.05" }
glossary:
  - { term: ความละเอียดของเครื่องมือ, definition: "ค่าที่เล็กที่สุดที่เครื่องมือแยกได้ คือค่าของช่องสเกลเล็กที่สุด หรือค่าของหลักสุดท้ายบนจอเครื่องมือแบบตัวเลข" }
  - { term: เลขนัยสำคัญ, definition: "หลักของตัวเลขที่ได้จากการวัดจริง รวมหลักสุดท้ายที่ประมาณ ไม่นับศูนย์ข้างหน้าที่บอกแค่ตำแหน่งจุดทศนิยม" }
  - { term: ความคลาดเคลื่อน, definition: "ขนาดของความไม่แน่นอนของผลการวัด เขียนเป็น ค่าที่อ่านได้ ± ความคลาดเคลื่อน เช่น $(12.35 \\pm 0.05)\\ \\mathrm{cm}$" }
  - { term: ความแม่นและความเที่ยง, definition: "ความแม่นคือผลการวัดใกล้ค่าจริง ความเที่ยงคือวัดซ้ำแล้วได้ค่าใกล้เคียงกัน" }
flashcards:
  - { front: "อ่านค่าจากเครื่องมือแบบสเกลอย่างไร", back: "อ่านให้ถึงช่องสเกลเล็กที่สุด แล้วประมาณเพิ่มอีก 1 ตำแหน่ง เช่น ไม้บรรทัดขีดละ 1 mm อ่านได้ $12.35\\ \\mathrm{cm}$" }
  - { front: "$0.00520$ มีเลขนัยสำคัญกี่ตัว", back: "3 ตัว คือ 5, 2 และ 0 ตัวท้าย ศูนย์ข้างหน้าไม่นับ" }
  - { front: "คูณหารผลการวัด ผลลัพธ์มีเลขนัยสำคัญกี่ตัว", back: "เท่ากับตัวที่มีเลขนัยสำคัญน้อยที่สุด" }
  - { front: "บวกลบผลการวัด ผลลัพธ์ละเอียดถึงหลักใด", back: "มีตำแหน่งทศนิยมเท่ากับตัวที่มีตำแหน่งทศนิยมน้อยที่สุด" }
  - { front: "ความคลาดเคลื่อนเชิงระบบกับแบบสุ่มต่างกันอย่างไร", back: "เชิงระบบเบี่ยงไปทางเดียวทุกครั้ง (เช่น ตาชั่งไม่ตั้งศูนย์) วัดซ้ำไม่ช่วย แบบสุ่มแกว่งทั้งมากและน้อย ลดได้ด้วยการวัดซ้ำแล้วหาค่าเฉลี่ย" }
