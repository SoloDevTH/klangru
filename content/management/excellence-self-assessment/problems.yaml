    ai_assisted: true

  - id: management.quality.excellence-self-assessment.p020
    topics: [management.quality.excellence-self-assessment]
    difficulty: 5
    type: mcq
    stem: "สำนักงานแห่งหนึ่ง (สมมติ) ทดลองใช้แชตบอตตอบคำถามประชาชนมาหกเดือน พบว่าตอบถูก 70% แต่ข้อร้องเรียนเรื่องได้ข้อมูลผิดเพิ่มขึ้น และค่าใช้จ่ายสูงกว่าที่คาด ตามหลักการตัดสินใจเรื่องโอกาสนวัตกรรม ข้อใดเหมาะที่สุด"
    choices:
      - { id: a, text: "เทียบผลกับเกณฑ์ที่ตั้งไว้ก่อนทดลอง ถ้าไม่ผ่านให้หยุดหรือปรับขอบเขต เช่น ใช้เฉพาะคำถามที่ตอบถูกสูง แล้วบันทึกบทเรียนและนำทรัพยากรไปใช้กับโอกาสอื่น", correct: true }
      - { id: b, text: "ขยายไปทุกช่องทางทันทีเพราะลงทุนไปแล้ว", feedback: "ลงทุนไปแล้วไม่ใช่เหตุผลให้ขยายสิ่งที่ยังไม่ได้ผล" }
      - { id: c, text: "หยุดเงียบ ๆ โดยไม่บันทึกอะไร", feedback: "เสียบทเรียนที่ได้จากการทดลอง ซึ่งเป็นส่วนสำคัญของการเรียนรู้ระดับองค์กร" }
      - { id: d, text: "ทดลองต่อไปเรื่อย ๆ โดยไม่กำหนดเกณฑ์", feedback: "ไม่มีเกณฑ์ตัดสินทำให้ทรัพยากรจมอยู่กับโอกาสที่อาจไม่คุ้ม" }
    hints:
      - "การจัดการนวัตกรรมต้องมีเกณฑ์ว่าเมื่อใดทำต่อและเมื่อใดหยุด"
      - "การหยุดก็เป็นการเรียนรู้ได้ถ้าบันทึกบทเรียน"
    solution: "องค์กรที่จัดการนวัตกรรมดีตั้งเกณฑ์ก่อนทดลอง ตัดสินใจทำต่อ ปรับ หรือหยุดจากข้อมูล บันทึกบทเรียน และย้ายทรัพยากรไปยังโอกาสที่ดีกว่า"
