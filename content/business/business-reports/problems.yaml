  difficulty: 5
  type: mcq
  stem: ผู้บริหารขอให้สรุปตารางยอดขายไตรมาสนี้ที่แสดงยอดขายเพิ่ม 6% แต่กำไรลดลง เพราะต้นทุนวัตถุดิบสูงขึ้น ข้อใดเป็นบทสรุปที่ดีที่สุดตามหลักขึ้นต้นด้วยข้อสรุป
  choices:
  - id: a
    text: ตารางนี้มี 12 แถวและ 5 คอลัมน์
    feedback: เป็นการบรรยายโครงสร้างตาราง ไม่ใช่ข้อสรุป
  - id: b
    text: ยอดขายรวมไตรมาสนี้เพิ่ม 6% แต่กำไรลดลงเพราะต้นทุนวัตถุดิบ ควรเจรจาราคากับซัพพลายเออร์หรือปรับราคาภายในเดือนนี้
    correct: true
  - id: c
    text: ยอดขายเป็นหัวข้อที่สำคัญของบริษัทเสมอ
    feedback: เป็นความเห็นทั่วไปที่ไม่มีข้อมูลและไม่บอกการตัดสินใจ
  - id: d
    text: ข้อมูลนี้มาจากฝ่ายการตลาดและฝ่ายบัญชี
    feedback: บอกแหล่งที่มาได้ แต่ไม่ใช่ข้อสรุปที่ผู้บริหารต้องการ
  hints:
  - ผู้บริหารต้องการรู้ผลและสิ่งที่ควรทำ
  - บทสรุปที่ดีมีตัวเลขหลัก สาเหตุ และข้อเสนอแนะในประโยคเดียวหรือสองประโยค
  solution: บทสรุปที่ดีบอกผลหลัก (ยอดขายเพิ่ม กำไรลด) สาเหตุ (ต้นทุนวัตถุดิบ) และสิ่งที่ควรทำ โดยไม่ต้องบรรยายตาราง
