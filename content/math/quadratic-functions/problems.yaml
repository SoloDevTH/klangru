problems:
  - id: math.qf.p001
    topics: [math.functions.quadratic]
    difficulty: 1
    type: mcq
    stem: "กราฟของ $y = -2x^2 + 3$ เป็นพาราโบลาแบบใด"
    choices:
      - { id: a, text: "คว่ำ และมีค่าสูงสุด", correct: true }
      - { id: b, text: "หงาย และมีค่าต่ำสุด", feedback: "ดูเหมือนดูจาก $+3$ แต่ทิศของพาราโบลาดูจากสัมประสิทธิ์ของ $x^2$ ซึ่งคือ $-2$ เป็นลบ" }
      - { id: c, text: "คว่ำ และมีค่าต่ำสุด", feedback: "พาราโบลาคว่ำมีจุดยอดอยู่บนสุด จึงมีค่าสูงสุด ส่วนด้านล่างลงไปได้เรื่อย ๆ ไม่มีค่าต่ำสุด" }
      - { id: d, text: "หงาย และมีค่าสูงสุด", feedback: "พาราโบลาหงายขึ้นไปได้เรื่อย ๆ จึงไม่มีค่าสูงสุด และ $a = -2$ ทำให้กราฟคว่ำ" }
    hints:
      - "ดูเครื่องหมายของสัมประสิทธิ์ของ $x^2$"
      - "$a < 0$ พาราโบลาคว่ำ จุดยอดอยู่บนสุดหรือล่างสุด"
    solution: "$a = -2 < 0$ พาราโบลาจึงคว่ำ จุดยอด $(0, 3)$ อยู่บนสุด ค่าสูงสุดของ $y$ คือ 3"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p002
    topics: [math.functions.quadratic]
    difficulty: 1
    type: numeric
    stem: "พาราโบลา $y = (x - 3)^2 + 5$ มีจุดยอดที่ $x$ เท่าใด"
    answer: { value: 3 }
    hints:
      - "ฟังก์ชันอยู่ในรูป $y = a(x - h)^2 + k$ ซึ่งมีจุดยอดที่ $(h, k)$"
      - "$(x - 3)^2$ มีค่าน้อยที่สุดเป็น 0 ให้หาว่า $x$ เท่าใดทำให้วงเล็บเป็น 0"
    misconceptions:
      - { match: -3, feedback: "ระวังเครื่องหมาย $(x - 3)^2 = 0$ เมื่อ $x = 3$ ไม่ใช่ $-3$" }
      - { match: 5, feedback: "5 คือพิกัด $y$ ของจุดยอด โจทย์ถามพิกัด $x$" }
    solution: "รูป $y = (x - h)^2 + k$ มี $h = 3$, $k = 5$ จุดยอดคือ $(3, 5)$ จึงอยู่ที่ $x = 3$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p003
    topics: [math.functions.quadratic]
    difficulty: 2
    type: numeric
    stem: "แกนสมมาตรของพาราโบลา $y = x^2 - 8x + 7$ คือเส้นตรง $x = \\,?$"
    answer: { value: 4 }
    hints:
      - "แกนสมมาตรของ $y = ax^2 + bx + c$ คือ $x = -\\dfrac{b}{2a}$"
      - "ระบุ $a = 1$ และ $b = -8$ แล้วแทนลงในสูตร ระวังเครื่องหมายลบสองชั้น"
    misconceptions:
      - { match: -4, feedback: "ลืมเครื่องหมายลบหน้าสูตร $x = -\\tfrac{b}{2a} = -\\tfrac{-8}{2} = 4$" }
      - { match: 8, feedback: "ลืมหาร 2 สูตรคือ $-\\tfrac{b}{2a}$ ไม่ใช่ $-\\tfrac{b}{a}$" }
    solution: "$a = 1$, $b = -8$: $x = -\\dfrac{-8}{2(1)} = 4$ ตรวจ: จุดตัดแกน $x$ คือ $x = 1$ และ $x = 7$ ซึ่งมีจุดกึ่งกลางที่ 4 ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p004
    topics: [math.functions.quadratic]
    difficulty: 2
    type: match
    stem: "จับคู่พาราโบลากับจุดยอด"
    pairs:
      - { left: "$y = (x - 1)^2 + 2$", right: "$(1, 2)$" }
      - { left: "$y = (x + 1)^2 - 2$", right: "$(-1, -2)$" }
      - { left: "$y = -(x - 2)^2$", right: "$(2, 0)$" }
      - { left: "$y = x^2 - 4$", right: "$(0, -4)$" }
    hints:
      - "รูป $y = a(x - h)^2 + k$ มีจุดยอด $(h, k)$"
      - "$(x + 1)^2$ เขียนได้เป็น $(x - (-1))^2$"
      - "ถ้าไม่มีวงเล็บ เช่น $x^2 - 4$ แปลว่า $h = 0$"
    solution: "$(x - 1)^2 + 2$ → $(1, 2)$ | $(x + 1)^2 - 2$ → $(-1, -2)$ | $-(x - 2)^2$ → $(2, 0)$ | $x^2 - 4$ → $(0, -4)$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p005
    topics: [math.functions.quadratic]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดถูกต้องเกี่ยวกับพาราโบลา $y = -x^2 + 4x$ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "พาราโบลาคว่ำ", correct: true }
      - { id: b, text: "จุดยอดคือ $(2, 4)$", correct: true }
      - { id: c, text: "กราฟผ่านจุด $(0, 0)$", correct: true }
      - { id: d, text: "มีค่าต่ำสุดเท่ากับ 4", feedback: "พาราโบลาคว่ำมีค่าสูงสุด ไม่ใช่ค่าต่ำสุด 4 คือค่าสูงสุด" }
      - { id: e, text: "แกนสมมาตรคือ $x = -2$", feedback: "ลืมเครื่องหมายลบในสูตร $x = -\\tfrac{4}{2(-1)} = 2$" }
    hints:
      - "เริ่มจากดูเครื่องหมายของ $a$ แล้วหาแกนสมมาตรด้วย $x = -\\tfrac{b}{2a}$"
      - "แทน $x$ ของแกนสมมาตรและ $x = 0$ ลงในฟังก์ชันเพื่อตรวจแต่ละข้อ"
    solution: "$a = -1 < 0$ พาราโบลาคว่ำ แกนสมมาตร $x = -\\tfrac{4}{2(-1)} = 2$ และ $y(2) = -4 + 8 = 4$ จุดยอดคือ $(2, 4)$ เป็นค่าสูงสุด เมื่อ $x = 0$ ได้ $y = 0$ กราฟจึงผ่านจุดกำเนิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p006
    topics: [math.functions.quadratic]
    difficulty: 3
    type: numeric
    stem: "จงหาค่าต่ำสุดของ $y = x^2 - 6x + 11$"
    answer: { value: 2 }
    hints:
      - "ค่าต่ำสุดอยู่ที่จุดยอด หาแกนสมมาตรก่อน"
      - "$x = -\\tfrac{b}{2a}$ แล้วแทน $x$ ที่ได้กลับลงในฟังก์ชัน"
    misconceptions:
      - { match: 3, feedback: "3 คือค่า $x$ ของจุดยอด ค่าต่ำสุดคือค่า $y$ ต้องแทน $x = 3$ กลับลงในฟังก์ชัน" }
      - { match: 11, feedback: "11 คือค่า $y$ เมื่อ $x = 0$ (จุดตัดแกน $y$) ไม่ใช่จุดยอด" }
    solution: "$x = -\\tfrac{-6}{2} = 3$ แล้ว $y = 9 - 18 + 11 = 2$ หรือเขียนเป็น $y = (x - 3)^2 + 2$ ค่าต่ำสุดคือ 2"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p007
    topics: [math.functions.quadratic]
    difficulty: 3
    type: numeric
    stem: "พาราโบลา $y = x^2 - 2x - 8$ ตัดแกน $x$ สองจุด จุดที่มีพิกัด $x$ เป็นบวกอยู่ที่ $x$ เท่าใด"
    answer: { value: 4 }
    hints:
      - "จุดตัดแกน $x$ มีค่า $y = 0$"
      - "แยกตัวประกอบ $x^2 - 2x - 8$ หาสองจำนวนที่คูณกันได้ $-8$ และบวกกันได้ $-2$"
    misconceptions:
      - { match: 2, feedback: "ดูเหมือนแยกตัวประกอบเป็น $(x + 4)(x - 2)$ ลองกระจายดูจะได้ $x^2 + 2x - 8$ เครื่องหมายของพจน์กลางกลับกัน" }
      - { match: 8, feedback: "8 มาจากค่าคงที่ แต่จุดตัดแกน $x$ ต้องมาจากการแก้สมการ $x^2 - 2x - 8 = 0$" }
    solution: "$x^2 - 2x - 8 = (x - 4)(x + 2) = 0$ ได้ $x = 4$ หรือ $x = -2$ จุดที่เป็นบวกคือ $x = 4$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p008
    topics: [math.functions.quadratic]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการหาจุดยอดของ $y = 2x^2 - 8x + 3$ ให้ถูกต้อง"
    items:
      - "ระบุ $a = 2$, $b = -8$, $c = 3$"
      - "หาแกนสมมาตร $x = -\\tfrac{-8}{2(2)} = 2$"
      - "แทน $x = 2$ ลงในฟังก์ชัน ได้ $y = 8 - 16 + 3 = -5$"
      - "สรุปว่าจุดยอดคือ $(2, -5)$ และเป็นจุดต่ำสุดเพราะ $a > 0$"
    hints:
      - "ต้องรู้ค่า $a$ และ $b$ ก่อนจึงจะใช้สูตรแกนสมมาตรได้"
      - "พิกัด $y$ ของจุดยอดหาได้หลังจากรู้พิกัด $x$ แล้ว"
    solution: "ระบุสัมประสิทธิ์ → หาแกนสมมาตร → แทนค่าหาพิกัด $y$ → สรุปจุดยอดและชนิดของจุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p009
    topics: [math.functions.quadratic]
    difficulty: 4
    type: expression
    stem: "พาราโบลารูปหนึ่งมีจุดยอดที่ $(2, -3)$ และผ่านจุด $(0, 5)$ จงเขียนสมการของพาราโบลานี้"
    prefix: "y ="
    answer: { latex: "2(x-2)^2-3", variables: [x] }
    hints:
      - "เริ่มจากรูปจุดยอด $y = a(x - h)^2 + k$ แล้วใส่ $h$ และ $k$"
      - "ยังไม่รู้ $a$ ให้แทนจุด $(0, 5)$ ลงในสมการ"
      - "แก้สมการหา $a$ แล้วเขียนสมการเต็ม"
    misconceptions:
      - { match: "(x-2)^2-3", feedback: "สมการนี้มีจุดยอดถูก แต่ถ้าแทน $x = 0$ จะได้ $y = 1$ ไม่ใช่ 5 ต้องหาค่า $a$ จากจุด $(0, 5)$ ด้วย" }
      - { match: "2(x+2)^2-3", feedback: "ระวังเครื่องหมาย จุดยอดที่ $x = 2$ ต้องเขียนเป็น $(x - 2)^2$" }
    solution: "$y = a(x - 2)^2 - 3$ แทน $(0, 5)$: $5 = a(4) - 3$ → $4a = 8$ → $a = 2$ จึงได้ $y = 2(x - 2)^2 - 3$ (หรือ $y = 2x^2 - 8x + 5$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p010
    topics: [math.functions.quadratic]
    difficulty: 4
    type: numeric
    stem: "แม่ค้าลูกชิ้นปิ้งพบว่า ถ้าตั้งราคาไม้ละ $x$ บาท จะได้กำไรต่อวัน $P(x) = -50x^2 + 1000x - 2000$ บาท กำไรต่อวันสูงสุดเป็นกี่บาท"
    answer: { value: 3000, unit: บาท }
    hints:
      - "พาราโบลาคว่ำ ($a < 0$) กำไรสูงสุดอยู่ที่จุดยอด"
      - "หาราคาที่ดีที่สุดจาก $x = -\\tfrac{b}{2a}$ ก่อน"
      - "แทนราคาที่ได้ลงใน $P(x)$ เพื่อหากำไร"
    misconceptions:
      - { match: 10, feedback: "10 บาทคือราคาที่ทำให้กำไรสูงสุด โจทย์ถามกำไร ต้องแทน $x = 10$ ลงใน $P(x)$" }
      - { match: -2000, feedback: "ดูเหมือนใช้ $x = -\\tfrac{b}{a} = 20$ ลืมหาร 2 ในสูตรแกนสมมาตร" }
    solution: "$x = -\\dfrac{1000}{2(-50)} = 10$ บาท แล้ว $P(10) = -50(100) + 1000(10) - 2000 = -5000 + 10000 - 2000 = 3000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p011
    topics: [math.functions.quadratic]
    difficulty: 4
    type: numeric
    stem: "นักกีฬาเซปักตะกร้อเตะลูกขึ้นไป ความสูงของลูกเมื่อเวลาผ่านไป $t$ วินาทีคือ $h(t) = -5t^2 + 10t + 1.5$ เมตร ลูกตะกร้อขึ้นไปได้สูงสุดกี่เมตร"
    answer: { value: 6.5, tolerance: 0.05, unit: m }
    hints:
      - "ความสูงสูงสุดอยู่ที่จุดยอดของพาราโบลาคว่ำ"
      - "หาเวลาที่จุดยอดจาก $t = -\\tfrac{b}{2a}$"
      - "แทนเวลาที่ได้ลงใน $h(t)$"
    misconceptions:
      - { match: 1, feedback: "1 วินาทีคือเวลาที่ลูกถึงจุดสูงสุด ต้องแทน $t = 1$ ลงใน $h(t)$ เพื่อหาความสูง" }
      - { match: 1.5, feedback: "ดูเหมือนใช้ $t = -\\tfrac{b}{a} = 2$ ซึ่งเป็นเวลาที่ลูกกลับมาสูงเท่าจุดเริ่ม ต้องใช้ $-\\tfrac{b}{2a}$" }
    solution: "$t = -\\dfrac{10}{2(-5)} = 1$ วินาที แล้ว $h(1) = -5 + 10 + 1.5 = 6.5$ เมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p012
    topics: [math.functions.quadratic]
    difficulty: 5
    type: numeric
    stem: "ชาวสวนมีลวดหนาม 60 เมตร ต้องการล้อมแปลงผักรูปสี่เหลี่ยมผืนผ้าที่ติดคลอง โดยไม่ต้องล้อมด้านที่ติดคลอง (ล้อมแค่ 3 ด้าน) พื้นที่แปลงผักมากที่สุดเป็นกี่ตารางเมตร"
    answer: { value: 450, unit: m² }
    hints:
      - "ให้ด้านที่ตั้งฉากกับคลองยาว $x$ เมตร (มี 2 ด้าน) ด้านที่ขนานคลองจะยาว $60 - 2x$ เมตร"
      - "พื้นที่ $A(x) = x(60 - 2x) = -2x^2 + 60x$ เป็นฟังก์ชันกำลังสอง"
      - "หาจุดยอดของ $A(x)$ แล้วคำนวณพื้นที่ที่จุดนั้น"
    misconceptions:
      - { match: 225, feedback: "ดูเหมือนแบ่งลวด 60 เมตรเป็น 4 ด้านเท่ากัน แต่ด้านที่ติดคลองไม่ต้องล้อม ลวดใช้แค่ 3 ด้าน" }
      - { match: 400, feedback: "ดูเหมือนให้ทั้ง 3 ด้านยาวเท่ากันด้านละ 20 เมตร ซึ่งไม่ใช่พื้นที่มากที่สุด ลองเขียนพื้นที่เป็นฟังก์ชันของ $x$ แล้วหาจุดยอด" }
    solution: "$A(x) = x(60 - 2x) = -2x^2 + 60x$ จุดยอดที่ $x = -\\dfrac{60}{2(-2)} = 15$ เมตร ด้านขนานคลองยาว $60 - 30 = 30$ เมตร พื้นที่ $= 15 \\times 30 = 450$ ตารางเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p013
    topics: [math.functions.quadratic]
    difficulty: 5
    type: mcq
    stem: "ค่า $k$ ในข้อใดทำให้กราฟ $y = x^2 - 4x + k$ ไม่ตัดแกน $x$ เลย"
    choices:
      - { id: a, text: "$k > 4$", correct: true }
      - { id: b, text: "$k < 4$", feedback: "เมื่อ $k < 4$ ดิสคริมิแนนต์ $16 - 4k > 0$ กราฟตัดแกน $x$ สองจุด เช่น $k = 0$ ได้ $x = 0$ และ $x = 4$" }
      - { id: c, text: "$k = 4$", feedback: "เมื่อ $k = 4$ ได้ $y = (x - 2)^2$ กราฟแตะแกน $x$ หนึ่งจุดที่ $(2, 0)$" }
      - { id: d, text: "$k > -4$", feedback: "ดูเหมือนเครื่องหมายผิดตอนแก้อสมการ $16 - 4k < 0$ → $4k > 16$ → $k > 4$" }
    hints:
      - "กราฟไม่ตัดแกน $x$ เมื่อสมการ $x^2 - 4x + k = 0$ ไม่มีคำตอบเป็นจำนวนจริง"
      - "ใช้ดิสคริมิแนนต์ $b^2 - 4ac < 0$ แล้วแก้อสมการหา $k$"
    solution: "$b^2 - 4ac = 16 - 4k < 0$ → $k > 4$ หรือมองจากจุดยอด: $y = (x - 2)^2 + (k - 4)$ มีค่าต่ำสุด $k - 4$ ถ้า $k - 4 > 0$ กราฟอยู่เหนือแกน $x$ ทั้งหมด"
    license: CC-BY-SA-4.0
    ai_assisted: true
