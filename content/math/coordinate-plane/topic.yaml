id: math.functions.coordinate-plane
subject: math
title: { th: ระบบพิกัดฉาก, en: The coordinate plane }
summary: บอกตำแหน่งจุดด้วยคู่อันดับ แยกจตุภาคทั้งสี่ หาระยะทางแนวนอนแนวตั้งและจุดกึ่งกลาง เลื่อนขนาน สะท้อน หมุน และขยายรูปบนระนาบ
difficulty: 2.5
minutes: 30
prerequisites: [math.number.integers]
encompasses:
  - { id: math.number.integers, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: quadrants.svg
    alt: "ระนาบพิกัดช่วง −8 ถึง 8 แบ่งเป็นจตุภาคที่ 1 ขวาบน จตุภาคที่ 2 ซ้ายบน จตุภาคที่ 3 ซ้ายล่าง จตุภาคที่ 4 ขวาล่าง มีจุดตัวอย่าง (4, 5) ในจตุภาคที่ 1, (−3, 2) ในจตุภาคที่ 2, (−2, −7) ในจตุภาคที่ 3, (6, −1) และ (2.5, −3.5) ในจตุภาคที่ 4 และ (0, 3) บนแกน y"
    caption: "จุดที่พิกัดเป็นทศนิยมก็วางได้ เช่น $(2.5, -3.5)$ ส่วนจุดที่มีพิกัดเป็น 0 อยู่บนแกน ไม่อยู่ในจตุภาคใด"
  - { type: check, problem: math.coord.p015, prompt: "ลองอ่านพิกัดจากภาพ" }
  - type: worked-example
    title: เส้นรอบรูปและพื้นที่จากพิกัด
    problem: "สี่เหลี่ยมผืนผ้า $ABCD$ มีจุดยอด $A(-3, -1)$, $B(5, -1)$, $C(5, 4)$ และ $D(-3, 4)$ จงหาเส้นรอบรูปและพื้นที่"
    steps:
      - text: "$A$ กับ $B$ มีพิกัด $y$ เท่ากัน ด้าน $AB$ เป็นแนวนอน ยาว $|5 - (-3)| = 8$ หน่วย"
        why: "จุดอยู่คนละฝั่งของแกน $y$ จึงต้องลบด้วยจำนวนลบ ไม่ใช่ $5 - 3$"
      - text: "$B$ กับ $C$ มีพิกัด $x$ เท่ากัน ด้าน $BC$ เป็นแนวตั้ง ยาว $|4 - (-1)| = 5$ หน่วย"
      - text: "เส้นรอบรูป $= 2(8 + 5) = 26$ หน่วย"
      - text: "พื้นที่ $= 8 \\times 5 = 40$ ตารางหน่วย"
    answer: "เส้นรอบรูป 26 หน่วย พื้นที่ 40 ตารางหน่วย"
  - type: figure
    src: transformations.svg
    alt: "สามเหลี่ยมต้นแบบจุดยอด (1, 1), (4, 1), (1, 3) ในจตุภาคที่ 1 ภาพจากการหมุน 90 องศาทวนเข็มนาฬิการอบจุดกำเนิดอยู่จตุภาคที่ 2 จุดยอด (−1, 1), (−1, 4), (−3, 1) ภาพจากการหมุน 180 องศาอยู่จตุภาคที่ 3 และภาพจากการสะท้อนในแกน x อยู่จตุภาคที่ 4 ทุกรูปมีขนาดและรูปร่างเท่ากัน"
    caption: "การหมุนและการสะท้อนย้ายตำแหน่งและทิศของรูป แต่ไม่เปลี่ยนขนาดหรือรูปร่าง"
  - type: worked-example
    title: หมุนสามเหลี่ยม 90° รอบจุดกำเนิด
    problem: "หมุนสามเหลี่ยมที่มีจุดยอด $(1, 1)$, $(4, 1)$, $(1, 3)$ รอบจุดกำเนิด $90^\\circ$ ทวนเข็มนาฬิกา แล้วตรวจว่าความยาวด้านเท่าเดิม"
    steps:
      - text: "ใช้กฎ $(x, y) \\to (-y, x)$ กับทีละจุด: $(1, 1) \\to (-1, 1)$"
        why: "ลองนึกถึงจุด $(1, 0)$ บนแกน $x$ บวก หมุนทวนเข็มนาฬิกาหนึ่งในสี่รอบจะไปอยู่ที่ $(0, 1)$ บนแกน $y$ บวก ซึ่งตรงกับกฎนี้"
      - text: "$(4, 1) \\to (-1, 4)$ และ $(1, 3) \\to (-3, 1)$"
      - text: "ตรวจความยาว: ด้านเดิมจาก $(1, 1)$ ถึง $(4, 1)$ ยาว 3 ด้านใหม่จาก $(-1, 1)$ ถึง $(-1, 4)$ ยาว 3 เท่ากัน"
      - text: "ด้านเดิมจาก $(1, 1)$ ถึง $(1, 3)$ ยาว 2 ด้านใหม่จาก $(-1, 1)$ ถึง $(-3, 1)$ ยาว 2 เท่ากัน ✓"
        why: "การหมุนเปลี่ยนด้านแนวนอนให้เป็นแนวตั้งและกลับกัน แต่ไม่เปลี่ยนความยาว"
    answer: "จุดยอดใหม่คือ $(-1, 1)$, $(-1, 4)$, $(-3, 1)$ ความยาวด้านเท่าเดิม"
  - { type: check, problem: math.coord.p017, prompt: "ลองใช้กฎการหมุนกับจุดเดียว" }
  - type: interactive
    title: เลื่อนขนานจุดด้วยลูกศร
    caption: ลูกศรแรกชี้จากจุดกำเนิดไปยังจุด P(3, −2) ลูกศรที่สองคือการเลื่อนไปทางขวา 4 และลง 5 ปลายของลูกศรผลรวมคือจุดภาพ P′(7, −7) ลากปลายลูกศรเพื่อลองจุดและการเลื่อนแบบอื่น แล้วสังเกตว่าพิกัดของจุดภาพได้จากการบวกทีละพิกัด
    widget:
      kind: vector-add
      a: [3, -2]
      b: [4, -5]
      draggable: true
  - type: interactive
    title: ระยะทางแนวนอนข้ามจุดกำเนิด
    caption: จุด A(−4, 3) และ B(5, 3) อยู่บนเส้นแนวนอนเดียวกัน ระยะห่างจึงอ่านได้จากพิกัด x บนเส้นจำนวน จาก −4 ไป 5 คือ 9 หน่วย ไม่ใช่ 1 หน่วย
    widget:
      kind: number-line
      min: -6
      max: 6
      points:
        - { value: -4, label: A }
        - { value: 5, label: B }
      jumps:
        - { from: -4, to: 5, label: "9 หน่วย" }
glossary:
  - { term: คู่อันดับ, definition: "คู่ของจำนวน $(x, y)$ ที่ลำดับมีความหมาย ตัวแรกคือพิกัด $x$ ตัวหลังคือพิกัด $y$" }
  - { term: จุดกำเนิด, definition: "จุดที่แกน $x$ ตัดกับแกน $y$ มีพิกัด $(0, 0)$" }
  - { term: จตุภาค, definition: "หนึ่งในสี่ส่วนของระนาบที่แกนทั้งสองแบ่งไว้ นับทวนเข็มนาฬิกาจากมุมขวาบน" }
  - { term: การเลื่อนขนาน, definition: "การย้ายทุกจุดไปในทิศเดียวกันด้วยระยะเท่ากัน โดยไม่หมุนและไม่เปลี่ยนขนาด" }
flashcards:
  - { front: "จุด $(-3, 2)$ อยู่ในจตุภาคใด", back: "จตุภาคที่ 2 เพราะ $x < 0$ และ $y > 0$" }
  - { front: "สะท้อน $(x, y)$ ในแกน $x$ ได้จุดใด", back: "$(x, -y)$ พิกัด $y$ เปลี่ยนเครื่องหมาย" }
  - { front: "สะท้อน $(x, y)$ ในแกน $y$ ได้จุดใด", back: "$(-x, y)$ พิกัด $x$ เปลี่ยนเครื่องหมาย" }
  - { front: "ระยะห่างของ $(-4, 3)$ กับ $(5, 3)$", back: "$|5 - (-4)| = 9$ หน่วย" }
