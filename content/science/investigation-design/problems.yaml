- id: science.inquiry.investigation-design.p018
  topics:
  - science.inquiry.investigation-design
  difficulty: 4
  type: mcq
  stem: 'ผลการปลูกถั่วเขียว 7 วัน: น้ำ 0 มิลลิลิตรต่อวัน สูง 2 cm น้ำ 20 มิลลิลิตร สูง 6 cm น้ำ 40 มิลลิลิตร สูง 9 cm ฟ้าอยากรู้ต่อว่า "ถ้ารดน้ำมากขึ้นอีก ต้นจะสูงขึ้นเรื่อย ๆ หรือไม่" การทดลองครั้งต่อไปควรเป็นแบบใด'
  choices:
  - id: a
    text: คาดคะเนว่าที่ 60 มิลลิลิตรอาจสูงขึ้นอีกแต่เพิ่มน้อยลง แล้วทดลองที่ 60 และ 80 มิลลิลิตร โดยควบคุมเมล็ด ดิน กระถาง และแสงเหมือนเดิม
    correct: true
  - id: b
    text: ทดลองซ้ำที่ 0, 20, 40 มิลลิลิตรเหมือนเดิม
    feedback: การทำซ้ำช่วยยืนยันผลเดิม แต่ไม่ตอบคำถามใหม่เรื่องน้ำที่มากกว่า 40 มิลลิลิตร
  - id: c
    text: เปลี่ยนเป็นปลูกถั่วแดงและรดน้ำ 60 มิลลิลิตร
    feedback: เปลี่ยนทั้งชนิดเมล็ดและปริมาณน้ำ จึงไม่ยุติธรรม
  - id: d
    text: ไม่ต้องทดลอง เพราะผลบอกแล้วว่าน้ำยิ่งมากยิ่งสูง
    feedback: ข้อมูลมีถึง 40 มิลลิลิตรเท่านั้น น้ำที่มากเกินอาจทำให้รากเน่า ต้องทดสอบก่อนสรุป
  hints:
  - ใช้แนวโน้มของผลเดิมช่วยคาดคะเน
  - การทดลองต่อไปต้องยังยุติธรรม และทดสอบช่วงที่ยังไม่มีข้อมูล
  solution: ผลเดิมเพิ่ม 4 cm แล้วเพิ่ม 3 cm จึงคาดว่าเพิ่มช้าลง การทดลองต่อไปควรขยายช่วงตัวแปรต้นไปที่ 60 และ 80 มิลลิลิตร และควบคุมสิ่งอื่นเหมือนเดิม นี่คือการใช้ผลทดสอบมาคาดคะเนและวางแผนการทดลองที่ยุติธรรมครั้งต่อไป
  license: CC-BY-SA-4.0
  ai_assisted: true
