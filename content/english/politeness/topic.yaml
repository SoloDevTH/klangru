id: english.culture.politeness
subject: english
title: { th: "ภาษา น้ำเสียง และกิริยาท่าทางที่สุภาพตามวัฒนธรรม", en: "Polite language, tone and manners" }
summary: please thank you excuse me sorry การขอร้องหลายระดับ ภาษาทางการและไม่เป็นทางการ การเลือกภาษาตามบุคคลและโอกาส น้ำเสียง และมารยาทของเจ้าของภาษา
difficulty: 3
minutes: 35
prerequisites: [english.speaking.greetings-introductions]
encompasses:
  - { id: english.speaking.greetings-introductions, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: request-ladder.svg
    alt: "แถบหกระดับจากล่างขึ้นบน แถบยาวขึ้นแปลว่าสุภาพและเป็นทางการมากขึ้น 1 Open the window. (คำสั่ง ห้วน) 2 Open the window, please. (มี please ดีขึ้น) 3 Can you open the window? (เพื่อน คนในครอบครัว) 4 Could you open the window, please? (ครู คนแปลกหน้า) 5 Would you mind opening the window? (สุภาพมาก) 6 I was wondering if you could open the window. (ทางการมาก)"
    caption: "คำขอเดียวกันหลายระดับความสุภาพ"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.culture.politeness.p005, prompt: "หลัง Would you mind ใช้กริยารูปไหน" }
  - type: worked-example
    title: ตอบ Would you mind ...? ให้ถูกความหมาย
    problem: "คนแปลกหน้าบนรถไฟฟ้าถามว่า *Would you mind moving your bag?* เรายินดีย้ายกระเป๋าให้ ตอบอย่างไร"
    steps:
      - text: "แปลตรงตัว: *Would you mind ...?* = คุณจะรังเกียจไหมถ้า ..."
      - text: "เรายินดี แปลว่า ไม่รังเกียจ จึงตอบปฏิเสธ: *No, not at all.* หรือ *Of course not.*"
        why: "ถ้าตอบ Yes จะแปลว่า รังเกียจ คือไม่อยากย้าย"
      - text: "ทำตามและพูดเสริมให้เป็นมิตร: *Here you go.* หรือ *Sorry about that.*"
    answer: "*No, not at all. Sorry about that.* แล้วย้ายกระเป๋า"
  - { type: check, problem: english.culture.politeness.p007, prompt: "บรรทัดไหนในอีเมลไม่สุภาพ" }
glossary:
  - { term: formal, definition: "เป็นทางการ ใช้กับคนไม่สนิท ผู้ใหญ่ หรือโอกาสสำคัญ" }
  - { term: informal, definition: "ไม่เป็นทางการ ใช้กับเพื่อนและครอบครัว" }
  - { term: queue, definition: "แถว หรือเข้าแถว (อเมริกันมักใช้ line / stand in line)" }
  - { term: "Would you mind ...?", definition: "คุณจะรังเกียจไหมถ้า ... คำขอร้องที่สุภาพมาก ตามด้วยกริยา -ing" }
  - { term: "Bless you!", definition: "พูดเมื่อมีคนจาม ตอบว่า Thank you." }
flashcards:
  - { front: "ขอร้องครูหรือคนแปลกหน้า", back: "Could you ..., please?" }
  - { front: "Would you mind opening the door? ตอบว่ายินดี", back: "No, not at all. / Of course not." }
  - { front: "ตอบคำขอบคุณแบบออสเตรเลีย", back: "No worries." }
  - { front: "เรียกครูในโรงเรียนอังกฤษ", back: "Miss / Sir หรือ Mr/Ms + นามสกุล" }
  - { front: "มีคนจาม พูดว่า", back: "Bless you!" }
