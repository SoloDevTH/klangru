  - id: math.pyth.p014
    topics: [math.geometry.pythagoras]
    difficulty: 2
    type: numeric
    stem: "หาระยะทางระหว่างจุด $P(-3, -1)$ และ $Q(2, 11)$ บนระนาบพิกัด (ตอบเป็นจำนวนหน่วย)"
    answer: { value: 13, unit: หน่วย }
    hints:
      - "หาระยะแนวนอนและแนวตั้งก่อน ระวังเครื่องหมายลบของพิกัด"
      - "ระยะแนวนอน $= 2 - (-3)$ ระยะแนวตั้ง $= 11 - (-1)$"
      - "ใช้ $d = \\sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2}$"
