<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="sans-serif">
<title>สเกลจากการโน้มน้าวไปถึงการควบคุมในความสัมพันธ์</title>
<rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
<rect x="40.0" y="90" width="170.0" height="130" fill="#cfe9c4" stroke="#222" stroke-width="2"/>
<text x="125.0" y="130" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">โน้มน้าว</text>
<text x="125.0" y="164" text-anchor="middle" font-size="16" fill="#222">ให้เหตุผลและ</text>
<text x="125.0" y="188" text-anchor="middle" font-size="16" fill="#222">เคารพคำตอบ</text>
<rect x="210.0" y="90" width="170.0" height="130" fill="#f7e6a1" stroke="#222" stroke-width="2"/>
<text x="295.0" y="130" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">กดดัน</text>
<text x="295.0" y="164" text-anchor="middle" font-size="16" fill="#222">พูดซ้ำจนรู้สึก</text>
<text x="295.0" y="188" text-anchor="middle" font-size="16" fill="#222">ไม่มีทางเลือก</text>
<rect x="380.0" y="90" width="170.0" height="130" fill="#f2b77a" stroke="#222" stroke-width="2"/>
<text x="465.0" y="130" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">บังคับ</text>
<text x="465.0" y="164" text-anchor="middle" font-size="16" fill="#222">ใช้กำลังหรือขู่</text>
<text x="465.0" y="188" text-anchor="middle" font-size="16" fill="#222">ให้ต้องทำตาม</text>
<rect x="550.0" y="90" width="170.0" height="130" fill="#e88a7a" stroke="#222" stroke-width="2"/>
<text x="635.0" y="130" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">ควบคุม</text>
<text x="635.0" y="164" text-anchor="middle" font-size="16" fill="#222">จำกัดอิสระ ตรวจ</text>
<text x="635.0" y="188" text-anchor="middle" font-size="16" fill="#222">และขู่ให้ยอม</text>
<line x1="40" y1="260" x2="720" y2="260" stroke="#222" stroke-width="3"/>
<polygon points="720,260 708,252 708,268" fill="#222"/>
<text x="40" y="290" font-size="16" fill="#222">ยิ่งไปทางขวา ยิ่งจำกัดอิสระและความเคารพของอีกฝ่าย</text>
<text x="40" y="74" font-size="18" fill="#222">ความต่างของการมีอิทธิพลต่อกัน (ตัวอย่างสั้น)</text>
</svg>
