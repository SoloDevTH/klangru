      - { match: 2.08, feedback: "นั่นคือระยะที่เพิ่มขึ้น ยังต้องหารด้วยเวลา $0.2$ วินาที" }
    solution: "$\\dfrac{43.73 - 41.65}{0.2} = \\dfrac{2.08}{0.2} = 10.4\\ \\mathrm{m/s}$ (ช่วง $[5.0, 5.1]$ ให้ $10.3$ และช่วง $[4.9, 5.0]$ ให้ $10.5$ ช่วงที่คร่อมจุดนั้นให้ค่ากลางที่ดีกว่า)"
