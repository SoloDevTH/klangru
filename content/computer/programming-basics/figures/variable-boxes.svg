<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="600" height="230" font-family="sans-serif" font-size="15">
  <title>ตัวแปรเปรียบเหมือนกล่องที่มีชื่อ เก็บค่าได้ทีละค่า</title>
  <rect x="0" y="0" width="600" height="230" fill="#ffffff"/>
  <rect x="22" y="70" width="116" height="70" rx="6" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <rect x="40" y="52" width="80" height="26" rx="4" fill="#ffffff" stroke="#0a6b60" stroke-width="2"/>
  <text x="80" y="70" text-anchor="middle" font-size="15" fill="#0a6b60" font-weight="bold" font-family="monospace">score</text>
  <text x="80" y="113" text-anchor="middle" font-size="20" fill="#15211e" font-weight="normal" font-family="monospace">75</text>
  <text x="80" y="168" text-anchor="middle" font-size="13" fill="#4a5a56" font-weight="normal">int (จำนวนเต็ม)</text>
  <rect x="169" y="70" width="116" height="70" rx="6" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <rect x="187" y="52" width="80" height="26" rx="4" fill="#ffffff" stroke="#0a6b60" stroke-width="2"/>
  <text x="227" y="70" text-anchor="middle" font-size="15" fill="#0a6b60" font-weight="bold" font-family="monospace">price</text>
  <text x="227" y="113" text-anchor="middle" font-size="20" fill="#15211e" font-weight="normal" font-family="monospace">12.5</text>
  <text x="227" y="168" text-anchor="middle" font-size="13" fill="#4a5a56" font-weight="normal">float (ทศนิยม)</text>
  <rect x="316" y="70" width="116" height="70" rx="6" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <rect x="334" y="52" width="80" height="26" rx="4" fill="#ffffff" stroke="#0a6b60" stroke-width="2"/>
  <text x="374" y="70" text-anchor="middle" font-size="15" fill="#0a6b60" font-weight="bold" font-family="monospace">name</text>
  <text x="374" y="113" text-anchor="middle" font-size="20" fill="#15211e" font-weight="normal" font-family="monospace">"Mali"</text>
  <text x="374" y="168" text-anchor="middle" font-size="13" fill="#4a5a56" font-weight="normal">str (ข้อความ)</text>
  <rect x="463" y="70" width="116" height="70" rx="6" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <rect x="481" y="52" width="80" height="26" rx="4" fill="#ffffff" stroke="#0a6b60" stroke-width="2"/>
  <text x="521" y="70" text-anchor="middle" font-size="15" fill="#0a6b60" font-weight="bold" font-family="monospace">passed</text>
  <text x="521" y="113" text-anchor="middle" font-size="20" fill="#15211e" font-weight="normal" font-family="monospace">True</text>
  <text x="521" y="168" text-anchor="middle" font-size="13" fill="#4a5a56" font-weight="normal">bool (จริง/เท็จ)</text>
  <text x="20" y="30" text-anchor="start" font-size="15" fill="#15211e" font-weight="bold">ชื่อตัวแปรอยู่บนป้าย ค่าอยู่ในกล่อง</text>
  <text x="20" y="208" text-anchor="start" font-size="14" fill="#b4521f" font-weight="normal">score = 80 จะแทนค่า 75 ในกล่องด้วย 80 (ค่าเดิมหายไป)</text>
</svg>
