problems:
  - id: english.grammar.future-forms.p001
    topics: [english.grammar.future-forms]
    difficulty: 1
    type: text
    stem: "เพื่อนยกของหนัก เราตัดสินใจช่วยทันที เติมคำเดียว: *Wait! I ___ help you.*"
    accepted: ["will"]
    misconceptions:
      - { match: "am", feedback: "ไม่ใช้ am หน้ากริยา help ตรง ๆ ตัดสินใจทันทีใช้ will" }
      - { match: "going to", feedback: "going to ต้องมี am อยู่หน้า และใช้กับแผนที่คิดไว้ก่อน ที่นี่ตัดสินใจทันทีใช้ will" }
      - { match: "want", feedback: "want แปลว่า ต้องการ และต้องมี to ตาม ตัดสินใจทันทีใช้ will" }
    hints:
      - "เราตัดสินใจตอนนี้เลย ไม่ได้วางแผนไว้ก่อน"
      - "ตัดสินใจทันที เสนอช่วย ใช้คำไหน"
    solution: "*Wait! I **will** help you.* (มักย่อเป็น I'll help you.)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.future-forms.p002
    topics: [english.grammar.future-forms]
    difficulty: 1
    type: mcq
    stem: "*won't* ย่อมาจากอะไร"
    choices:
      - { id: a, text: "will not", correct: true, feedback: "ถูก won't = will not" }
      - { id: b, text: "want not", feedback: "won't ไม่เกี่ยวกับ want (ต้องการ) won't = will not" }
      - { id: c, text: "would not", feedback: "would not ย่อเป็น wouldn't" }
      - { id: d, text: "was not", feedback: "was not ย่อเป็น wasn't" }
    hints:
      - "won't เป็นปฏิเสธของ will"
      - "will + not เปลี่ยนรูปเป็น won't"
    solution: "*won't* = **will not** เช่น *I won't be late.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.future-forms.p003
    topics: [english.grammar.future-forms]
    difficulty: 1
    type: match
    stem: "จับคู่รูปเต็มกับรูปย่อ"
    pairs:
      - { left: "I will", right: "I'll" }
      - { left: "will not", right: "won't" }
      - { left: "she is going to", right: "she's going to" }
      - { left: "we are going to", right: "we're going to" }
    hints:
      - "will ย่อเป็น 'll"
      - "is ย่อเป็น 's และ are ย่อเป็น 're"
    solution: "I will → I'll · will not → won't · she is going to → she's going to · we are going to → we're going to"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.future-forms.p004
    topics: [english.grammar.future-forms]
    difficulty: 2
    type: text
    stem: "เติม be ให้ถูก: *My sister ___ going to visit our grandma.*"
    accepted: ["is"]
    misconceptions:
      - { match: "are", feedback: "my sister = she ใช้ is" }
      - { match: "will", feedback: "be going to ต้องใช้ am, is, are หน้า going to" }
      - { match: "am", feedback: "am ใช้กับ I เท่านั้น" }
    hints:
      - "be going to ต้องมี am, is หรือ are"
      - "my sister แทนด้วย she"
    solution: "*My sister **is** going to visit our grandma.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.future-forms.p005
    topics: [english.grammar.future-forms]
    difficulty: 2
    type: mcq
    stem: "ดูตารางของนิดา แล้วตอบ: *What is Nida going to do on Saturday morning?*"
    figure: { src: weekend-planner.svg, alt: "ตารางวันหยุดของนิดา หัวข้อ Nida's weekend plans ช่อง Saturday: morning visit Grandma in Ayutthaya, afternoon buy fruit at the market with Mum ช่อง Sunday: morning play football (9:00), evening do maths homework" }
    choices:
      - { id: a, text: "She is going to visit her grandma in Ayutthaya.", correct: true, feedback: "ถูก ช่อง Saturday morning เขียนว่า visit Grandma in Ayutthaya" }
      - { id: b, text: "She is going to buy fruit at the market.", feedback: "ซื้อผลไม้เป็นแผนตอนบ่ายวันเสาร์ (afternoon)" }
      - { id: c, text: "She is going to play football.", feedback: "เตะฟุตบอลเป็นแผนเช้าวันอาทิตย์" }
      - { id: d, text: "She is going to do her homework.", feedback: "ทำการบ้านเป็นแผนตอนเย็นวันอาทิตย์" }
    hints:
      - "หาช่อง Saturday แล้วดูแถว morning"
      - "คำถามถามเช้าวันเสาร์เท่านั้น"
    solution: "*She is going to **visit her grandma in Ayutthaya**.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.future-forms.p006
    topics: [english.grammar.future-forms]
    difficulty: 2
    type: text
    stem: "ตอบรับแบบสั้น: *Will you come to my party?* — *Yes, I ___.*"
    accepted: ["will", "will."]
    misconceptions:
      - { match: "'ll", feedback: "คำตอบสั้นแบบบอกรับห้ามย่อ ต้องเป็น Yes, I will." }
      - { match: "do", feedback: "คำถามใช้ Will คำตอบจึงใช้ will" }
      - { match: "come", feedback: "คำตอบสั้นใช้กริยาช่วยตัวเดียวกับคำถาม: Yes, I will." }
    hints:
      - "คำตอบสั้นใช้กริยาช่วยตัวเดียวกับคำถาม"
      - "คำตอบบอกรับไม่ย่อ"
    solution: "*Yes, I **will**.* (ปฏิเสธคือ No, I won't.)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.future-forms.p007
    topics: [english.grammar.future-forms]
    difficulty: 2
    type: order
    stem: "เรียงคำเป็นประโยค \"คืนนี้พวกเราจะไปดูหนัง\""
    items: ["We", "are", "going", "to", "watch a movie", "tonight."]
    hints:
      - "We + are + going to + กริยารูปเดิม"
      - "คำบอกเวลาไว้ท้ายประโยค"
    solution: "*We are going to watch a movie tonight.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.future-forms.p008
    topics: [english.grammar.future-forms]
    difficulty: 3
    type: mcq
    stem: "โทรศัพท์บ้านดังขึ้น ทุกคนกำลังยุ่ง เราพูดว่า *___ answer it.*"
    choices:
      - { id: a, text: "I'll", correct: true, feedback: "ถูก เพิ่งตัดสินใจตอนพูด ใช้ will" }
      - { id: b, text: "I'm going to", feedback: "be going to ใช้กับแผนที่คิดไว้ก่อน เราไม่รู้มาก่อนว่าโทรศัพท์จะดัง" }
      - { id: c, text: "I will to", feedback: "หลัง will ไม่มี to" }
      - { id: d, text: "I going to", feedback: "ขาด am และใช้กับแผนที่คิดไว้ก่อน" }
    hints:
      - "เราตัดสินใจตอนไหน"
      - "ตัดสินใจทันทีใช้ will + กริยารูปเดิม"
    solution: "*The phone is ringing. **I'll** answer it.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.future-forms.p009
    topics: [english.grammar.future-forms]
    difficulty: 3
    type: mcq
    stem: "เมฆดำเต็มฟ้า เลือกข้อที่ถูก: *Look at those black clouds! It ___.*"
    choices:
      - { id: a, text: "is going to rain", correct: true, feedback: "ถูก คาดเดาจากสิ่งที่เห็นตอนนี้ ใช้ be going to" }
      - { id: b, text: "is going rain", feedback: "ขาด to: is going to rain" }
      - { id: c, text: "will raining", feedback: "หลัง will ใช้กริยารูปเดิม rain ไม่เติม ing" }
      - { id: d, text: "going to rains", feedback: "ขาด is และหลัง going to ใช้กริยารูปเดิม" }
    hints:
      - "มีหลักฐานให้เห็นตอนนี้ (เมฆดำ)"
      - "be + going to + กริยารูปเดิม"
    solution: "*Look at those black clouds! It **is going to rain**.* (It's going to rain.)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.future-forms.p010
    topics: [english.grammar.future-forms]
    difficulty: 3
    type: text
    stem: "เติมสองคำ (ข้อเท็จจริงในอนาคต): *My brother ___ 15 next year.*"
    accepted: ["will be", "'ll be", "is going to be"]
    misconceptions:
      - { match: "is", feedback: "is บอกปัจจุบัน next year เป็นอนาคต: will be" }
      - { match: "will is", feedback: "หลัง will ใช้กริยารูปเดิม be" }
      - { match: "will has", feedback: "บอกอายุใช้ be ไม่ใช้ have: will be" }
    hints:
      - "บอกอายุใช้ verb to be"
      - "อนาคต: will + กริยารูปเดิม be"
    solution: "*My brother **will be** 15 next year.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.future-forms.p011
    topics: [english.grammar.future-forms]
    difficulty: 3
    type: mcq
    stem: "อ่านบทสนทนา *Mali: Are you going to watch the boat race on Sunday? / Ton: No, I'm not. I'm going to help my dad at his noodle shop. He's very busy on Sundays. / Mali: Oh, OK. I'll take some photos for you!* — ใจความสำคัญคือข้อใด"
    choices:
      - { id: a, text: "ต้นจะไม่ได้ไปดูแข่งเรือ เพราะจะไปช่วยพ่อที่ร้านก๋วยเตี๋ยว", correct: true, feedback: "ถูก เป็นเรื่องหลักของบทสนทนา" }
      - { id: b, text: "มะลิจะถ่ายรูปการแข่งเรือ", feedback: "เป็นรายละเอียดตอนท้าย ไม่ใช่ใจความสำคัญของทั้งบทสนทนา" }
      - { id: c, text: "ร้านก๋วยเตี๋ยวของพ่อต้นขายดีทุกวัน", feedback: "บทสนทนาบอกว่าพ่อยุ่งในวันอาทิตย์ ไม่ใช่ทุกวัน" }
      - { id: d, text: "ต้นกับมะลิจะไปดูแข่งเรือด้วยกัน", feedback: "ต้นตอบว่า No, I'm not. เขาจะไม่ไป" }
    hints:
      - "มะลิถามอะไร ต้นตอบอย่างไร"
      - "ใจความสำคัญคือเรื่องที่ทั้งบทสนทนาพูดถึง"
    solution: "ต้นตอบว่าจะไม่ไปดูแข่งเรือ (No, I'm not.) เพราะ **จะไปช่วยพ่อที่ร้านก๋วยเตี๋ยว** ส่วนการถ่ายรูปเป็นรายละเอียด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.future-forms.p012
    topics: [english.grammar.future-forms]
    difficulty: 3
    type: mcq
    stem: "จากบทสนทนาข้อที่แล้ว ประโยค *I'll take some photos for you!* ใช้ will เพราะอะไร"
    choices:
      - { id: a, text: "มะลิเพิ่งตัดสินใจและเสนอช่วยตอนพูด", correct: true, feedback: "ถูก มะลิเพิ่งรู้ว่าต้นไม่ไป จึงเสนอทันที" }
      - { id: b, text: "มะลิวางแผนถ่ายรูปไว้นานแล้ว", feedback: "ถ้าวางแผนไว้ก่อนจะใช้ I'm going to take photos" }
      - { id: c, text: "มะลิเห็นหลักฐานว่าจะเกิดขึ้น", feedback: "การคาดเดาจากหลักฐานใช้ be going to และประโยคนี้เป็นการเสนอช่วย ไม่ใช่การคาดเดา" }
    hints:
      - "มะลิรู้ว่าต้นไม่ไปตอนไหน"
      - "ทบทวนการใช้ will ข้อ 1 และ 2 ในบทเรียน"
    solution: "มะลิเพิ่งรู้ว่าต้นไม่ไป จึง **ตัดสินใจและเสนอช่วยทันที** ใช้ will"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.future-forms.p013
    topics: [english.grammar.future-forms]
    difficulty: 4
    type: text
    stem: "เติมให้เป็นปฏิเสธ (เราจะไม่นั่งรถเมล์): *We ___ going to take the bus.*"
    accepted: ["aren't", "are not", "'re not"]
    misconceptions:
      - { match: "don't", feedback: "be going to ปฏิเสธด้วย be + not ไม่ใช้ don't" }
      - { match: "not", feedback: "ขาด are: We aren't going to take the bus." }
      - { match: "won't", feedback: "won't ใช้กับ will โดยตรง หน้า going to ต้องเป็น be + not" }
      - { match: "isn't", feedback: "we ใช้ are: aren't" }
    hints:
      - "be going to ใช้ be เป็นตัวหลัก"
      - "we ใช้ are แล้วเติม not"
    solution: "*We **aren't** going to take the bus.* (We are not / We're not)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.future-forms.p014
    topics: [english.grammar.future-forms]
    difficulty: 4
    type: text
    stem: "เติมคำขึ้นต้นคำถาม: *___ you going to join the Loy Krathong festival?*"
    accepted: ["Are"]
    misconceptions:
      - { match: "Do", feedback: "คำถามของ be going to ย้าย be ขึ้นหน้า ไม่ใช้ do" }
      - { match: "Will", feedback: "Will ไม่ใช้ร่วมกับ going to ในประโยคเดียว" }
      - { match: "Is", feedback: "you ใช้ are" }
    hints:
      - "ประโยคบอกเล่าคือ You are going to join ..."
      - "ย้าย be ขึ้นหน้าประธาน"
    solution: "***Are** you going to join the Loy Krathong festival?*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.future-forms.p015
    topics: [english.grammar.future-forms]
    difficulty: 4
    type: mcq
    stem: "เพื่อนเล่าความลับให้ฟัง เราสัญญาว่า *I promise I ___ tell anyone.*"
    choices:
      - { id: a, text: "won't", correct: true, feedback: "ถูก สัญญาใช้ will ปฏิเสธเป็น won't" }
      - { id: b, text: "don't going to", feedback: "be going to ปฏิเสธด้วย am not และการสัญญาใช้ will" }
      - { id: c, text: "will not to", feedback: "หลัง will not ไม่มี to" }
      - { id: d, text: "want", feedback: "want แปลว่า ต้องการ ประโยคนี้หมายถึง จะไม่บอก ใช้ won't" }
    hints:
      - "การสัญญาใช้ will"
      - "ปฏิเสธของ will คืออะไร"
    solution: "*I promise I **won't** tell anyone.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.future-forms.p016
    topics: [english.grammar.future-forms]
    difficulty: 4
    type: text
    stem: "แก้ประโยคให้ถูก (ใช้ will): *She will goes to Chiang Mai tomorrow.* (เขียนเต็มประโยค)"
    accepted:
      - "She will go to Chiang Mai tomorrow."
      - "She will go to Chiang Mai tomorrow"
      - "She'll go to Chiang Mai tomorrow."
      - "She'll go to Chiang Mai tomorrow"
    misconceptions:
      - { match: "She will going to Chiang Mai tomorrow.", feedback: "หลัง will ใช้กริยารูปเดิม go ไม่เติม ing" }
      - { match: "She will to go to Chiang Mai tomorrow.", feedback: "หลัง will ไม่มี to" }
      - { match: "She wills go to Chiang Mai tomorrow.", feedback: "will ไม่เปลี่ยนรูปตามประธาน" }
      - { match: "She is going to go to Chiang Mai tomorrow.", feedback: "ประโยคนี้ถูกไวยากรณ์ แต่โจทย์ให้แก้โดยยังใช้ will" }
    hints:
      - "หลัง will ใช้กริยารูปไหน"
      - "will + กริยารูปเดิม ไม่เติม s"
    solution: "*She will **go** to Chiang Mai tomorrow.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.future-forms.p017
    topics: [english.grammar.future-forms]
    difficulty: 4
    type: mcq
    stem: "ประโยคใดแสดงว่า **วางแผนไว้ก่อนแล้ว**"
    choices:
      - { id: a, text: "I'm going to visit my cousin in Korat next week. I booked the bus ticket yesterday.", correct: true, feedback: "ถูก จองตั๋วไว้แล้ว เป็นแผนที่คิดไว้ก่อน ใช้ be going to" }
      - { id: b, text: "Wait, I'll open the door for you.", feedback: "เป็นการตัดสินใจและเสนอช่วยทันที" }
      - { id: c, text: "I think it will be cold tonight.", feedback: "เป็นการคาดเดาจากความคิดเห็น (I think)" }
      - { id: d, text: "OK, I'll have the fried rice, please.", feedback: "เป็นการตัดสินใจตอนสั่งอาหาร" }
    hints:
      - "หาประโยคที่มีหลักฐานว่าตัดสินใจมาก่อน"
      - "แผนที่คิดไว้ก่อนใช้ be going to"
    solution: "*I'm going to visit my cousin in Korat next week.* มีหลักฐานว่าจองตั๋วไว้แล้ว จึงเป็นแผน ข้ออื่นตัดสินใจหรือคาดเดาตอนพูด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.future-forms.p018
    topics: [english.grammar.future-forms]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "เลือกประโยคที่ **ถูกต้อง** ทั้งหมด"
    choices:
      - { id: a, text: "I think Thailand will win the match.", correct: true, feedback: "ถูก คาดเดาจากความคิดเห็นใช้ will" }
      - { id: b, text: "I'm going to study medicine at university.", correct: true, feedback: "ถูก ความตั้งใจที่คิดไว้ก่อนใช้ be going to" }
      - { id: c, text: "It's late. I'll take a taxi.", correct: true, feedback: "ถูก ตัดสินใจตอนพูดใช้ will" }
      - { id: d, text: "I will going to buy a new phone.", feedback: "ใช้ will กับ going to ซ้อนกันไม่ได้" }
      - { id: e, text: "He is going to went home.", feedback: "หลัง going to ใช้กริยารูปเดิม go" }
      - { id: f, text: "Will you to help me?", feedback: "หลัง will ไม่มี to: Will you help me?" }
    hints:
      - "หลัง will และ going to ใช้กริยารูปเดิม"
      - "ใช้ will หรือ be going to อย่างใดอย่างหนึ่ง ไม่ซ้อนกัน"
    solution: "ถูกคือ *I think Thailand will win the match.*, *I'm going to study medicine at university.*, *It's late. I'll take a taxi.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.future-forms.p019
    topics: [english.grammar.future-forms]
