  - id: math.pyth.p018
    topics: [math.geometry.pythagoras]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการพิสูจน์ทฤษฎีบทพีทาโกรัสด้วยสามเหลี่ยมมุมฉาก 4 รูปในสี่เหลี่ยมจัตุรัสด้าน $a + b$ (แบบที่ช่องว่างตรงกลางเป็นสี่เหลี่ยมจัตุรัสด้าน $c$)"
    items:
      - "พื้นที่สี่เหลี่ยมใหญ่ $= (a + b)^2$"
      - "พื้นที่เดียวกันเท่ากับสามเหลี่ยม 4 รูปรวมกับช่องว่าง: $4 \\cdot \\tfrac12 ab + c^2$"
      - "ตั้งสมการ $(a + b)^2 = 2ab + c^2$"
      - "กระจาย $(a + b)^2$ เป็น $a^2 + 2ab + b^2$"
      - "ตัด $2ab$ ทั้งสองข้าง ได้ $a^2 + b^2 = c^2$"
    hints:
      - "เริ่มจากพื้นที่ของรูปใหญ่ทั้งรูป แล้วคิดพื้นที่เดียวกันอีกวิธีหนึ่งจากชิ้นส่วนข้างใน"
      - "การกระจายวงเล็บและการตัดพจน์ที่เหมือนกันเป็นขั้นท้าย ๆ"
    solution: "คิดพื้นที่สี่เหลี่ยมใหญ่สองวิธี: $(a + b)^2$ และ $4 \\cdot \\tfrac12 ab + c^2$ ตั้งให้เท่ากัน กระจาย $a^2 + 2ab + b^2 = 2ab + c^2$ แล้วตัด $2ab$ ได้ $a^2 + b^2 = c^2$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.pyth.p019
