  - id: computer.algorithms.computational-thinking.p013
    topics: [computer.algorithms.computational-thinking]
    difficulty: 4
    type: mcq
    stem: "นักเรียนสร้างแบบจำลองไฟคนข้ามถนนหน้าโรงเรียน มีสถานะ \"รถไป\" และ \"คนข้าม\" เมื่อกดปุ่มขณะอยู่สถานะ \"รถไป\" ไฟจะเปลี่ยนเป็น \"คนข้าม\" 20 วินาที แล้วกลับเป็น \"รถไป\" ถ้ากดปุ่มขณะอยู่สถานะ \"คนข้าม\" แล้ว ไม่มีอะไรเปลี่ยน ข้อใดอธิบาย **พฤติกรรม** ของแบบจำลองนี้ได้ถูกต้อง"
    choices:
      - { id: a, text: "สถานะเปลี่ยนเมื่อมีเหตุการณ์ (กดปุ่ม หรือครบ 20 วินาที) และผลของการกดปุ่มขึ้นกับสถานะปัจจุบัน", correct: true }
      - { id: b, text: "กดปุ่มกี่ครั้งก็ได้ ไฟคนข้ามจะยาวขึ้นครั้งละ 20 วินาที", feedback: "แบบจำลองกำหนดว่ากดขณะเป็น \"คนข้าม\" ไม่มีอะไรเปลี่ยน" }
      - { id: c, text: "ไฟเปลี่ยนสถานะสลับไปมาทุก 20 วินาทีโดยไม่สนปุ่ม", feedback: "แบบจำลองนี้รอการกดปุ่มในสถานะ \"รถไป\" ไม่ได้สลับเองตลอด" }
      - { id: d, text: "แบบจำลองต้องเก็บสีของเสาไฟด้วย จึงจะทำงานได้", feedback: "สีเสาไม่มีผลต่อพฤติกรรม เป็นรายละเอียดที่ตัดทิ้งได้" }
    hints:
      - "พฤติกรรมคือกติกาการเปลี่ยนจากสถานะหนึ่งไปอีกสถานะหนึ่ง"
      - "ดูว่าการกดปุ่มให้ผลต่างกันในแต่ละสถานะหรือไม่"
    solution: "แบบจำลองเก็บสถานะ (รถไป คนข้าม) และพฤติกรรม คือกติกาที่บอกว่าเหตุการณ์ใดทำให้เปลี่ยนสถานะ การกดปุ่มมีผลเฉพาะในสถานะรถไป และการครบ 20 วินาทีพาไฟกลับเป็นรถไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.computational-thinking.p014
    topics: [computer.algorithms.computational-thinking]
    difficulty: 4
    type: numeric
    stem: |
      อัลกอริทึมคิดค่าน้ำประปาของหมู่บ้านแห่งหนึ่ง (อัตราสมมติ) เป็นดังนี้ บ้านที่ใช้น้ำ 37 หน่วยต้องจ่ายกี่บาท

      ```
      รับ หน่วย
      ค่าน้ำ ← 0
      ถ้า หน่วย > 30:
          ค่าน้ำ ← ค่าน้ำ + (หน่วย − 30) × 15
          หน่วย ← 30
      ถ้า หน่วย > 10:
          ค่าน้ำ ← ค่าน้ำ + (หน่วย − 10) × 10
          หน่วย ← 10
      ค่าน้ำ ← ค่าน้ำ + หน่วย × 8
      แสดง ค่าน้ำ
      ```
    answer: { value: 385, unit: บาท }
    hints:
      - "ไล่ทีละบรรทัด และจดค่าของ หน่วย กับ ค่าน้ำ หลังแต่ละขั้น"
      - "หน่วยที่เกิน 30 คิด 15 บาท หน่วยที่ 11 ถึง 30 คิด 10 บาท และ 10 หน่วยแรกคิด 8 บาท"
    misconceptions:
      - { match: 555, feedback: "คิดทั้ง 37 หน่วยที่ 15 บาท อัลกอริทึมคิดแบบขั้นบันได แต่ละช่วงใช้อัตราของตัวเอง" }
      - { match: 350, feedback: "ข้ามเงื่อนไขแรก หน่วยที่เกิน 30 (7 หน่วย) ต้องคิดหน่วยละ 15 บาท" }
    solution: "หน่วย = 37 > 30: ค่าน้ำ = 7 × 15 = 105 และ หน่วย = 30 → 30 > 10: ค่าน้ำ = 105 + 20 × 10 = 305 และ หน่วย = 10 → ค่าน้ำ = 305 + 10 × 8 = 385 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.computational-thinking.p015
    topics: [computer.algorithms.computational-thinking]
    difficulty: 5
    type: mcq
    stem: "บริษัทขนส่งต้องส่งพัสดุให้บ้าน 500 หลังทั่วอำเภอทุกวันด้วยรถ 10 คัน ข้อใดเป็นการ **หารูปแบบที่ทำให้ทั่วไปได้** เพื่อแก้ปัญหาขนาดใหญ่นี้"
    choices:
      - { id: a, text: "มองว่าเป็นปัญหาเดียวกับ \"แบ่งจุดเป็นกลุ่มตามพื้นที่ แล้วหาเส้นทางสั้นของแต่ละกลุ่ม\" จึงใช้วิธีแบ่งกลุ่มและหาเส้นทางเดิมกับทุกวัน ทุกอำเภอ", correct: true }
      - { id: b, text: "ให้คนขับแต่ละคนเลือกบ้านเองตามใจทุกวัน", feedback: "ไม่มีวิธีที่ทำซ้ำได้ และไม่รับประกันว่าทุกบ้านได้รับของ" }
      - { id: c, text: "เขียนเส้นทางของวันนี้ไว้ใช้ทุกวันโดยไม่เปลี่ยน", feedback: "บ้านที่ต้องส่งเปลี่ยนทุกวัน ต้องการวิธีทั่วไป ไม่ใช่คำตอบเฉพาะวันเดียว" }
      - { id: d, text: "ลองทุกลำดับการส่งที่เป็นไปได้ทั้ง 500 หลัง", feedback: "จำนวนลำดับมากเกินกว่าจะลองได้หมด (มากกว่าจำนวนอะตอมในเอกภพหลายเท่า)" }
    hints:
      - "ปัญหาใหญ่ที่ซับซ้อนมักแยกเป็นปัญหาย่อยที่มีวิธีแก้อยู่แล้ว"
      - "วิธีที่ดีใช้ได้กับข้อมูลชุดใหม่ทุกวัน"
    solution: "การหารูปแบบที่ดีพบว่าปัญหานี้ประกอบด้วยการแบ่งกลุ่มจุดตามพื้นที่และการหาเส้นทางสั้น ซึ่งเป็นปัญหาที่มีวิธีแก้อยู่แล้ว จึงทำให้ทั่วไปและใช้กับข้อมูลใหม่ทุกวันได้ การลองทุกลำดับเป็นไปไม่ได้เพราะมีมากเกินไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.computational-thinking.p016
    topics: [computer.algorithms.computational-thinking]
    difficulty: 5
    type: numeric
    stem: "การแข่งฟุตบอลกีฬาสีแบบพบกันหมด ทีมทุกทีมเจอกันทีมละหนึ่งครั้ง ถ้า 4 ทีมแข่ง 6 นัด 5 ทีมแข่ง 10 นัด จงหารูปแบบแล้วหาว่า 16 ทีมต้องแข่งกี่นัด"
    answer: { value: 120, unit: นัด }
    hints:
      - "ทีมแรกเจอทีมอื่น n − 1 ทีม ทีมที่สองเจอทีมที่ยังไม่เคยเจอ n − 2 ทีม ไปเรื่อย ๆ"
      - "ตรวจสูตรกับ 4 ทีมและ 5 ทีมก่อน: จำนวนนัด = n × (n − 1) ÷ 2"
    misconceptions:
      - { match: 240, feedback: "ลืมหาร 2 การนับ n × (n − 1) นับคู่ A พบ B และ B พบ A เป็นสองนัด ทั้งที่เป็นนัดเดียวกัน" }
      - { match: 256, feedback: "คิดเป็น 16 × 16 ซึ่งรวมทีมเจอตัวเองและนับซ้ำ" }
    solution: "รูปแบบคือ 3 + 2 + 1 = 6 (4 ทีม), 4 + 3 + 2 + 1 = 10 (5 ทีม) ทั่วไปเป็น n(n − 1) ÷ 2 ตรวจ: 4 × 3 ÷ 2 = 6 และ 5 × 4 ÷ 2 = 10 ถูก ดังนั้น 16 ทีม = 16 × 15 ÷ 2 = 120 นัด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.computational-thinking.p017
    topics: [computer.algorithms.computational-thinking]
    difficulty: 5
    type: mcq
    stem: "นักเรียนสร้างแบบจำลองคาดการณ์เวลาเดินทางจากบ้านไปโรงเรียน โดยใช้แค่ระยะทางหารความเร็วเฉลี่ย 30 กม./ชม. ผลคาดการณ์ตอน 7 โมงเช้าผิดไปมาก ข้อใดประเมินแบบจำลองนี้ได้ถูกต้องที่สุด"
