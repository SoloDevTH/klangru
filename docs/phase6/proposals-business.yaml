#   au-ac9-economics-business      Australian Curriculum v9 Economics and Business ใช้เทียบขอบเขต ไม่ได้ตั้งเป้าให้ครอบคลุม
#                                  (ไม่ได้ผูก AC9HE8K03 ธุรกิจของชนพื้นเมืองออสเตรเลีย, AC9HE10K04 ระบบ superannuation, AC9HE10K05 การจัดการกำลังคน
#                                  และทักษะ S01-S05 ส่วนใหญ่ที่เป็นทักษะการสืบสอบ)
# ขอบเขต: การบัญชี การเงิน การตลาด เศรษฐศาสตร์ สถิติธุรกิจ กฎหมายธุรกิจ ธุรกิจระหว่างประเทศ การเป็นผู้ประกอบการ และจริยธรรมธุรกิจ
#   หลักการจัดการ พฤติกรรมองค์การ การจัดการทรัพยากรมนุษย์ การผลิตและการดำเนินงาน การจัดการคุณภาพ การจัดการเชิงกลยุทธ์
#   และการจัดการโครงการ อยู่ในวิชาการจัดการ (management) ไฟล์นี้อ้างได้เฉพาะ management.principles.functions ซึ่งมีในคลังแล้ว
# หัวข้อที่เขียนแล้วในคลัง: management.principles.functions, business.accounting.equation, business.finance.break-even
# เรียงตาม prerequisite: prereq เป็นหัวข้อที่มีในคลังแล้ว หัวข้อในแผนของไฟล์อื่น (เช่น math.number.financial-math) หรือหัวข้อก่อนหน้าในไฟล์นี้
