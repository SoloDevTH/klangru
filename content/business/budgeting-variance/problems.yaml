    feedback: นำต้นทุนคงที่ทั้งหมดมาคิด แต่ค่าเช่าและเตาอบยังต้องจ่ายแม้เลิกอบ
  - match: 21000
    feedback: ลืมค่าจ้างคนอบที่เลี่ยงได้
  hints:
  - ต้นทุนที่เกี่ยวข้องคือต้นทุนที่หายไปถ้าเลิกอบเอง
  - 'อบเอง: ผันแปร $+$ ค่าจ้างที่เลี่ยงได้ · ซื้อ: ราคาซื้อ $\times$ จำนวน'
  solution: อบเอง $= 18 \times 3{,}000 + 15{,}000 = 69{,}000$ บาท · ซื้อ $= 25 \times 3{,}000 = 75{,}000$ บาท · อบเองถูกกว่า $6{,}000$ บาทต่อเดือน (ต้นทุนคงที่ส่วนที่เหลือ $25{,}000$ บาทต้องจ่ายทั้งสองทางเลือก จึงไม่นำมาคิด)
