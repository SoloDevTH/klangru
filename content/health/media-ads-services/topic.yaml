id: health.consumer.media-ads-services
subject: health
title: { th: "ข้อมูลข่าวสาร สื่อโฆษณา และการเลือกใช้บริการสุขภาพ", en: "Health information, advertising and choosing health services" }
summary: การค้นหาและตรวจความน่าเชื่อถือของข้อมูลสุขภาพ อิทธิพลของสื่อต่อพฤติกรรมสุขภาพและความรุนแรง สัญญาณของโฆษณาเกินจริง การเลือกซื้ออย่างมีเหตุผล และการเลือกใช้บริการสุขภาพ
difficulty: 3.5
minutes: 35
prerequisites: [health.consumer.product-safety]
encompasses:
  - { id: health.consumer.product-safety, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: หาสัญญาณเตือนในโฆษณา
    problem: "วิเคราะห์โฆษณาสมมติของแคปซูล \"ฟิตไวไว\" ว่ามีสัญญาณของโฆษณาเกินจริงอะไรบ้าง และควรทำอย่างไร"
    figure:
      src: ad-redflags.svg
      alt: "โฆษณาสมมติแคปซูลสมุนไพรชื่อฟิตไวไว พร้อมป้ายสีแดงชี้จุดน่าสงสัย ลด 10 กิโลใน 7 วัน ชี้ว่าสัญญาเห็นผลเร็วเกินจริง ไม่ต้องคุมอาหาร ไม่ต้องออกกำลังกาย ชี้ว่าไม่ต้องทำอะไรเลย ช่วยรักษาเบาหวานและความดัน ชี้ว่าอ้างรักษาโรคซึ่งอาหารห้ามโฆษณา ธรรมชาติ ปลอดภัย 100% ชี้ว่าธรรมชาติไม่ได้แปลว่าปลอดภัย ดาราดังกินเองรีวิวเอง ชี้ว่าคำรีวิวไม่ใช่หลักฐาน ภาพก่อนและหลัง ชี้ว่าตกแต่งได้ เหลือ 20 กล่องสุดท้าย โปรวันนี้วันเดียว ชี้ว่าเร่งให้รีบตัดสินใจ และไม่มีเลข อย. และเลขอนุญาตโฆษณา ชี้ว่าตรวจเลขไม่ได้"
    steps:
      - text: "อ่านคำสัญญา: \"ลด 10 กิโลใน 7 วัน\" และ \"ไม่ต้องคุมอาหาร ไม่ต้องออกกำลังกาย\" เป็นผลเร็วเกินจริงโดยไม่ต้องพยายาม"
      - text: "หาคำอ้างทางยา: \"ช่วยรักษาเบาหวานและความดัน\" อาหารห้ามโฆษณาว่ารักษาโรค"
        why: "ผลิตภัณฑ์เสริมอาหารไม่ใช่ยา อย. ห้ามโฆษณาอาหารว่าบำบัด บรรเทา รักษา หรือป้องกันโรค"
      - text: "ดูหลักฐาน: มีแต่รีวิวดาราและภาพก่อน-หลัง ไม่มีข้อมูลที่ตรวจสอบได้"
      - text: "ดูการเร่งขายและการตรวจสอบ: \"วันนี้วันเดียว\" และไม่มีเลข อย."
      - text: "ตัดสินใจ: ไม่ซื้อ ไม่แชร์ และร้องเรียนได้ที่สายด่วน อย. 1556"
    answer: "พบสัญญาณเตือนหลายข้อ ทั้งผลเกินจริง อ้างรักษาโรค อาศัยรีวิว เร่งขาย และตรวจสอบไม่ได้ จึงไม่ควรเชื่อและควรร้องเรียน"
  - { type: check, problem: health.consumer.media-ads-services.p004, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: worked-example
    title: เลือกบริการให้เหมาะกับอาการ
    problem: "ฝนเจ็บคอเล็กน้อยมา 1 วัน ไม่มีไข้ คุณยายในบ้านเดียวกันเจ็บแน่นหน้าอกและเหงื่อออกทันที ทั้งสองคนควรใช้บริการใด"
    steps:
      - text: "ประเมินความรุนแรง: ฝนอาการเล็กน้อย คุณยายมีอาการเตือนของโรคหัวใจ"
      - text: "คุณยาย: เป็นเหตุฉุกเฉิน โทร 1669 ทันที"
        why: "เจ็บแน่นหน้าอกทันทีอาจเป็นภาวะหัวใจขาดเลือดซึ่งต้องรักษาเร็วที่สุด"
      - text: "ฝน: ปรึกษาเภสัชกรที่ร้านยาที่มีใบอนุญาตหรือ รพ.สต. และไปพบแพทย์ถ้ามีไข้สูงหรือกลืนลำบาก"
      - text: "เมื่อสงสัยเรื่องสิทธิการรักษา โทรถาม สปสช. 1330"
    answer: "คุณยายโทร 1669 ฝนปรึกษาเภสัชกรหรือ รพ.สต. ก่อน"
  - { type: check, problem: health.consumer.media-ads-services.p005 }
glossary:
  - { term: โฆษณาเกินจริง, definition: "โฆษณาที่อวดอ้างผลเกินกว่าที่มีหลักฐาน เช่น เห็นผลทันที รักษาได้ทุกโรค" }
  - { term: การรู้เท่าทันสื่อ, definition: "ความสามารถในการเข้าถึง วิเคราะห์ และประเมินสื่อ ว่าใครสร้าง เพื่ออะไร และเชื่อถือได้เพียงใด" }
  - { term: ผลิตภัณฑ์เสริมอาหาร, definition: "ผลิตภัณฑ์ที่จัดเป็นอาหาร ไม่ใช่ยา ห้ามโฆษณาว่ารักษาหรือป้องกันโรค" }
  - { term: ราคาต่อหน่วย, definition: "ราคาหารด้วยปริมาณ เช่น บาทต่อกล่อง ใช้เทียบความคุ้มค่า" }
flashcards:
  - { front: "คำถาม 5 ข้อตรวจข้อมูลสุขภาพ", back: "ใครเขียน มีหลักฐานไหม เมื่อไร เพื่ออะไร แหล่งอื่นตรงกันไหม" }
  - { front: "สัญญาณโฆษณาเกินจริง", back: "ผลเร็วเกินจริง ไม่ต้องพยายาม อ้างรักษาโรค ธรรมชาติจึงปลอดภัย รีวิว เร่งซื้อ ไม่มีเลข อย." }
  - { front: "สายด่วนที่เกี่ยวข้อง", back: "อย. 1556 / สปสช. 1330 / ฉุกเฉิน 1669" }
  - { front: "อาการเล็กน้อยเริ่มที่ไหน", back: "เภสัชกรที่ร้านยาที่มีใบอนุญาต หรือ รพ.สต." }
