problems:
  - id: physics.dynamics.forces-intro.p001
    topics: [physics.dynamics.forces-intro]
    difficulty: 1
    type: mcq
    stem: "น้องผลักรถของเล่นที่จอดนิ่งอยู่บนพื้น รถของเล่นจะเป็นอย่างไร"
    choices:
      - { id: a, text: "เริ่มเคลื่อนที่ไปทางที่ผลัก", correct: true }
      - { id: b, text: "อยู่นิ่งเหมือนเดิม เพราะรถของเล่นไม่มีเครื่องยนต์", feedback: "รถไม่ต้องมีเครื่องยนต์ก็เคลื่อนที่ได้ แรงผลักจากมือทำให้วัตถุที่อยู่นิ่งเริ่มเคลื่อนที่" }
      - { id: c, text: "เคลื่อนที่เข้าหาตัวน้อง", feedback: "การผลักคือดันออกไป รถจึงไปทางเดียวกับที่ผลัก ถ้าดึง รถจึงจะเข้าหาตัว" }
    hints:
      - "แรงทำอะไรกับวัตถุที่อยู่นิ่งได้"
      - "ทิศที่รถเคลื่อนที่เป็นทิศเดียวกับทิศของแรง"
    solution: "แรงผลักทำให้วัตถุที่อยู่นิ่งเริ่มเคลื่อนที่ และรถเคลื่อนไปทางเดียวกับที่ผลัก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.forces-intro.p002
    topics: [physics.dynamics.forces-intro]
    difficulty: 1
    type: match
    stem: "จับคู่การกระทำกับผลของแรงที่เกิดขึ้น"
    pairs:
      - { left: "เตะลูกตะกร้อที่วางนิ่งอยู่", right: "วัตถุเริ่มเคลื่อนที่" }
      - { left: "ผู้รักษาประตูรับลูกฟุตบอลไว้ได้", right: "วัตถุหยุดเคลื่อนที่" }
      - { left: "ตีลูกปิงปองที่ลอยมาให้กลับไป", right: "วัตถุเปลี่ยนทิศทาง" }
      - { left: "บีบดินน้ำมันก้อนกลม", right: "วัตถุเปลี่ยนรูปร่าง" }
    hints:
      - "ดูว่าก่อนออกแรง วัตถุอยู่นิ่ง กำลังเคลื่อนที่ หรือเป็นของนิ่ม"
      - "รับลูกคือทำให้ลูกที่วิ่งมาไม่เคลื่อนที่ต่อ ตีกลับคือทำให้ลูกไปอีกทาง"
    solution: "เตะลูกที่นิ่ง → เริ่มเคลื่อนที่ รับลูก → หยุด ตีลูกกลับ → เปลี่ยนทิศ บีบดินน้ำมัน → เปลี่ยนรูปร่าง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.forces-intro.p003
    topics: [physics.dynamics.forces-intro]
    difficulty: 1
    type: text
    stem: "แรงที่โลกดึงดูดวัตถุเข้าหาโลก ทำให้มะม่วงหล่นจากต้น เรียกว่าแรงอะไร"
    accepted: ["แรงโน้มถ่วง", "แรงโน้มถ่วงของโลก", "แรงดึงดูดของโลก", "โน้มถ่วง", "gravity"]
    misconceptions:
      - { match: "แรงเสียดทาน", feedback: "แรงเสียดทานเกิดเมื่อผิวสองผิวถูกัน มะม่วงที่ตกไม่ได้ถูกับอะไร แรงที่ดึงลงคือแรงที่โลกดึงดูดวัตถุ" }
      - { match: "แรงแม่เหล็ก", feedback: "มะม่วงไม่ใช่เหล็ก แม่เหล็กไม่ดูดมะม่วง แรงที่ดึงทุกอย่างลงสู่พื้นคือแรงที่โลกดึงดูดวัตถุ" }
    hints:
      - "เป็นแรงที่ดึงทุกอย่างลงสู่พื้น โดยไม่ต้องแตะกัน"
      - "ชื่อของแรงนี้ขึ้นต้นด้วย แรงโน้ม..."
    solution: "แรงโน้มถ่วง (แรงดึงดูดของโลก) ดึงวัตถุเข้าหาศูนย์กลางของโลก มะม่วงจึงหล่นลงพื้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.forces-intro.p004
    topics: [physics.dynamics.forces-intro]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นแรงไม่สัมผัส (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "แม่เหล็กดูดลวดเย็บกระดาษจากระยะห่าง", correct: true }
      - { id: b, text: "ลูกมะพร้าวหล่นจากต้นลงสู่พื้น", correct: true }
      - { id: c, text: "ลูกโป่งที่ถูกับผมแล้วดูดเศษกระดาษขึ้นมา", correct: true }
      - { id: d, text: "ลมพัดว่าวให้ลอยสูงขึ้น", feedback: "ลมคืออากาศที่เคลื่อนที่ อากาศแตะและดันว่าวอยู่ จึงเป็นแรงสัมผัส แม้เราจะมองไม่เห็นอากาศ" }
      - { id: e, text: "เท้าเตะลูกตะกร้อ", feedback: "เท้าต้องแตะลูกตะกร้อจึงออกแรงได้ จึงเป็นแรงสัมผัส" }
    hints:
      - "แรงไม่สัมผัสส่งผลได้แม้วัตถุไม่แตะกัน"
      - "ลมมองไม่เห็น แต่อากาศแตะวัตถุอยู่หรือไม่"
    solution: "แรงไม่สัมผัส ได้แก่ แรงแม่เหล็ก (ก) แรงโน้มถ่วง (ข) และแรงไฟฟ้าจากลูกโป่งที่ถูกับผม (ค) ส่วนลมพัดว่าวและการเตะลูกตะกร้อเป็นแรงสัมผัส เพราะอากาศและเท้าแตะวัตถุ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.forces-intro.p005
    topics: [physics.dynamics.forces-intro]
    difficulty: 2
    type: numeric
    stem: "แขวนถุงผลไม้กับเครื่องชั่งสปริงตามภาพ ถุงผลไม้หนักกี่นิวตัน (ตอบเป็นตัวเลขในหน่วย N)"
    figure: { src: spring-scale-reading.svg, alt: "เครื่องชั่งสปริงมีสเกล 0 ถึง 10 นิวตัน มีตัวเลขทุก 1 นิวตัน และมีขีดเล็กหนึ่งขีดตรงกลางระหว่างตัวเลขแต่ละคู่ เข็มชี้สีส้มอยู่ที่ขีดเล็กระหว่างเลข 3 กับเลข 4 มีถุงผลไม้แขวนที่ตะขอด้านล่าง" }
    answer: { value: 3.5, tolerance: 0.1, unit: N }
    hints:
      - "หาก่อนว่าเข็มอยู่ระหว่างตัวเลขใดกับตัวเลขใด"
      - "ระหว่างตัวเลขสองตัวที่ห่างกัน 1 N มีขีดเล็กอยู่ตรงกลาง ขีดเล็กนั้นมีค่าครึ่งนิวตัน"
    misconceptions:
      - { match: 3, feedback: "เข็มเลยขีดเลข 3 มาแล้ว อยู่ที่ขีดเล็กกึ่งกลางระหว่าง 3 กับ 4 ต้องอ่านส่วนครึ่งด้วย" }
      - { match: 7, feedback: "ดูเหมือนนับขีดทุกขีดเป็นขีดละ 1 N ขีดเล็กแต่ละขีดห่างกันเพียงครึ่งนิวตัน" }
    solution: "เข็มอยู่ที่ขีดเล็กกึ่งกลางระหว่าง 3 N กับ 4 N จึงอ่านได้ 3.5 N"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.forces-intro.p006
    topics: [physics.dynamics.forces-intro]
    difficulty: 2
    type: mcq
    stem: "ในการแข่งชักเย่อวันกีฬาสี ทีมสีแดงและทีมสีฟ้าดึงเชือกด้วยแรงเท่ากันในทิศตรงข้าม เชือกจะเป็นอย่างไร"
    choices:
      - { id: a, text: "เชือกอยู่นิ่ง เพราะแรงสมดุลกัน", correct: true }
      - { id: b, text: "เชือกเคลื่อนไปทางทีมสีแดง เพราะเริ่มดึงก่อน", feedback: "ถ้าดึงแรงเท่ากัน ไม่ว่าใครเริ่มก่อน แรงทั้งสองหักล้างกันพอดี เชือกจึงไม่เคลื่อนที่" }
      - { id: c, text: "เชือกขาดทุกครั้ง เพราะถูกดึงสองทาง", feedback: "เชือกขาดเมื่อแรงดึงมากเกินที่เชือกทนได้ ไม่ได้ขาดเพราะถูกดึงสองทาง เชือกชักเย่อทนแรงได้มาก" }
    hints:
      - "แรงสองแรงขนาดเท่ากันและทิศตรงข้ามเรียกว่าอะไร"
      - "แรงสมดุลทำให้การเคลื่อนที่เปลี่ยนหรือไม่"
    solution: "แรงเท่ากันในทิศตรงข้ามเป็นแรงสมดุล หักล้างกันพอดี เชือกจึงอยู่นิ่ง (ถ้าทีมใดดึงแรงกว่า เชือกจึงจะเคลื่อนไปทางนั้น)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.forces-intro.p007
    topics: [physics.dynamics.forces-intro]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการใช้เครื่องชั่งสปริงวัดน้ำหนักของถุงส้ม"
    items:
      - "ถือเครื่องชั่งให้ตั้งตรงและดูว่าเข็มชี้อยู่ที่ 0"
      - "แขวนถุงส้มที่ตะขอ"
      - "รอให้ถุงส้มนิ่ง"
      - "มองเข็มชี้ในระดับสายตาแล้วอ่านค่า"
      - "บันทึกค่าพร้อมหน่วยนิวตัน"
    hints:
      - "ก่อนแขวนอะไร ต้องตรวจเครื่องชั่งก่อน"
      - "อ่านค่าตอนที่วัตถุยังแกว่งอยู่ได้หรือไม่"
    solution: "ตรวจเข็มที่ 0 → แขวนถุงส้ม → รอให้นิ่ง → อ่านค่าโดยมองระดับสายตา → บันทึกพร้อมหน่วย N"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.forces-intro.p008
    topics: [physics.dynamics.forces-intro]
    difficulty: 3
    type: numeric
    stem: "แม่ค้าในตลาดแขวนถุงพลาสติกเปล่ากับเครื่องชั่งสปริง อ่านได้ $1\\ \\mathrm{N}$ เมื่อใส่มะม่วงลงในถุงแล้วแขวนใหม่ อ่านได้ $9\\ \\mathrm{N}$ มะม่วงหนักกี่นิวตัน (ตอบในหน่วย N)"
    answer: { value: 8, unit: N }
    hints:
      - "ค่า 9 N เป็นน้ำหนักของอะไรบ้างรวมกัน"
      - "เอาน้ำหนักของถุงเปล่าออก"
    misconceptions:
      - { match: 10, feedback: "ดูเหมือนบวกน้ำหนักถุงเข้าไปอีก ค่า 9 N รวมน้ำหนักถุงไว้แล้ว ต้องลบออก" }
      - { match: 9, feedback: "9 N คือมะม่วงรวมกับถุง ต้องหักน้ำหนักถุง 1 N ออกก่อน" }
    solution: "มะม่วงกับถุงหนัก 9 N ถุงหนัก 1 N มะม่วงจึงหนัก $9 - 1 = 8\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.forces-intro.p009
    topics: [physics.dynamics.forces-intro]
    difficulty: 3
    type: mcq
    stem: "นักเรียนใช้เครื่องชั่งสปริงลากกล่องใบเดิมช้า ๆ บนโต๊ะไม้เรียบ อ่านได้ 2 N เมื่อลากบนพรมขรุขระ จะอ่านได้อย่างไร"
    choices:
      - { id: a, text: "มากกว่า 2 N เพราะพรมขรุขระมีแรงเสียดทานมากกว่า", correct: true }
      - { id: b, text: "เท่าเดิม 2 N เพราะเป็นกล่องใบเดิม", feedback: "กล่องเดิมก็จริง แต่ผิวที่ลากเปลี่ยนไป ผิวขรุขระต้านการเลื่อนมากกว่า จึงต้องดึงแรงขึ้น" }
      - { id: c, text: "น้อยกว่า 2 N เพราะพรมนุ่ม", feedback: "พรมนุ่มแต่ขรุขระ ทำให้กล่องเลื่อนยากขึ้น ไม่ใช่ง่ายขึ้น" }
    hints:
      - "ผิวเรียบกับผิวขรุขระ แบบไหนลากของได้ง่ายกว่า"
      - "แรงที่ต้านการเลื่อนของผิวสองผิวเรียกว่าแรงเสียดทาน"
    solution: "ผิวขรุขระของพรมมีแรงเสียดทานมากกว่าโต๊ะไม้เรียบ จึงต้องใช้แรงดึงมากกว่าเดิม เครื่องชั่งสปริงจึงอ่านได้มากกว่า 2 N"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.forces-intro.p010
    topics: [physics.dynamics.forces-intro]
    difficulty: 3
    type: mcq
    stem: "วางของสี่ชิ้นบนกระดานที่ยกปลายข้างหนึ่งขึ้นให้เอียงเล็กน้อย ของชิ้นใดน่าจะกลิ้งลงมาได้ง่ายที่สุด"
    choices:
      - { id: a, text: "ลูกส้มทรงกลม", correct: true }
      - { id: b, text: "กล่องนมทรงเหลี่ยม", feedback: "กล่องเหลี่ยมมีด้านแบนวางแนบกระดาน จึงกลิ้งไม่ได้ ต้องไถลซึ่งยากกว่า" }
      - { id: c, text: "หนังสือเล่มหนา", feedback: "หนังสือแบนและหนัก ผิวกว้างแนบกระดาน มักอยู่นิ่งเมื่อกระดานเอียงเล็กน้อย" }
      - { id: d, text: "ยางลบก้อนเหลี่ยม", feedback: "ยางลบเหลี่ยมและผิวยางฝืด จึงเลื่อนยาก" }
    hints:
      - "รูปร่างแบบไหนกลิ้งได้"
      - "ของที่มีด้านแบนต้องไถลไปบนกระดาน ส่วนของกลมหมุนไปได้"
    solution: "ลูกส้มกลม แตะกระดานเพียงจุดเล็ก ๆ จึงกลิ้งลงได้ง่าย ส่วนของที่มีด้านแบนต้องไถล ซึ่งมีแรงเสียดทานต้านมากกว่า รูปร่างและวัสดุจึงมีผลต่อการเคลื่อนที่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.forces-intro.p011
    topics: [physics.dynamics.forces-intro]
    difficulty: 3
    type: mcq
    stem: "ชักเย่อระหว่างห้อง ป.3/1 ซึ่งดึงด้วยแรงรวม 450 N กับห้อง ป.3/2 ซึ่งดึงด้วยแรงรวม 400 N ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "แรงไม่สมดุล เชือกเคลื่อนไปทางห้อง ป.3/1", correct: true }
      - { id: b, text: "แรงไม่สมดุล เชือกเคลื่อนไปทางห้อง ป.3/2", feedback: "เชือกเคลื่อนไปทางที่แรงมากกว่า 450 N มากกว่า 400 N เชือกจึงไปทางห้อง ป.3/1" }
      - { id: c, text: "แรงสมดุล เชือกอยู่นิ่ง", feedback: "แรงสมดุลต้องเท่ากัน 450 N ไม่เท่ากับ 400 N จึงไม่สมดุล" }
    hints:
      - "แรงสองข้างเท่ากันหรือไม่"
      - "เมื่อแรงไม่เท่ากัน วัตถุเคลื่อนไปทางแรงที่มากกว่า"
    solution: "450 N ไม่เท่ากับ 400 N แรงจึงไม่สมดุล เชือกเคลื่อนไปทางที่แรงมากกว่า คือห้อง ป.3/1"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.forces-intro.p012
    topics: [physics.dynamics.forces-intro]
    difficulty: 4
    type: numeric
    stem: "ชักเย่อ ทีมซ้ายดึง $520\\ \\mathrm{N}$ ทีมขวาดึง $480\\ \\mathrm{N}$ ในทิศตรงข้าม แรงที่เหลือซึ่งทำให้เชือกเคลื่อนไปทางทีมซ้ายมีขนาดกี่นิวตัน (ตอบในหน่วย N)"
    answer: { value: 40, unit: N }
    hints:
      - "แรงสองแรงทิศตรงข้ามหักล้างกัน"
      - "ส่วนที่หักล้างกันไม่หมดคือผลต่างของแรงทั้งสอง"
    misconceptions:
      - { match: 1000, feedback: "ดูเหมือนบวกแรงทั้งสอง แต่สองทีมดึงคนละทิศ แรงจึงหักล้างกัน ต้องหาผลต่าง" }
