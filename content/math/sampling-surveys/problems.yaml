problems:
  - id: math.stats.sampling-surveys.p001
    topics: [math.stats.sampling-surveys]
    difficulty: 1
    type: match
    stem: "จับคู่คำกับความหมาย"
    pairs:
      - { left: "ประชากร", right: "หน่วยทั้งหมดที่ต้องการศึกษา" }
      - { left: "กลุ่มตัวอย่าง", right: "ส่วนหนึ่งของประชากรที่เลือกมาศึกษา" }
      - { left: "สำมะโน", right: "การเก็บข้อมูลจากทุกหน่วย" }
      - { left: "ค่าสถิติ", right: "ค่าที่คำนวณจากกลุ่มตัวอย่าง" }
      - { left: "ค่าพารามิเตอร์", right: "ค่าที่บรรยายประชากรทั้งหมด" }
    hints:
      - "ประชากรคือทั้งหมด ตัวอย่างคือบางส่วน"
      - "ค่าสถิติมาจากตัวอย่าง ค่าพารามิเตอร์เป็นของประชากร"
    solution: "ประชากรคือทั้งหมด กลุ่มตัวอย่างคือส่วนที่เลือกมา สำมะโนเก็บจากทุกหน่วย ค่าสถิติคำนวณจากตัวอย่าง ค่าพารามิเตอร์บรรยายประชากร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.sampling-surveys.p002
    topics: [math.stats.sampling-surveys]
    difficulty: 1
    type: mcq
    stem: "สำนักงานสถิติแห่งชาติเก็บข้อมูลจากทุกครัวเรือนทั่วประเทศ การเก็บข้อมูลแบบนี้เรียกว่าอะไร"
    choices:
      - { id: a, text: "สำมะโน", correct: true }
      - { id: b, text: "การสุ่มตัวอย่าง", feedback: "การสุ่มตัวอย่างเก็บจากบางส่วน แต่โจทย์เก็บจากทุกครัวเรือน" }
      - { id: c, text: "การทดลอง", feedback: "การทดลองต้องมีการกำหนดสิ่งที่ทำกับแต่ละกลุ่ม ที่นี่เป็นการเก็บข้อมูลอย่างเดียว" }
    hints:
      - "เก็บจากทุกหน่วยหรือบางหน่วย"
      - "เก็บจากทุกหน่วยของประชากร"
    solution: "เก็บข้อมูลจากทุกหน่วยของประชากรคือสำมะโน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.sampling-surveys.p003
    topics: [math.stats.sampling-surveys]
    difficulty: 2
    type: match
    stem: "จับคู่วิธีเลือกนักเรียนกับชื่อวิธี"
    pairs:
      - { left: "จับฉลากชื่อ 50 คนจากรายชื่อนักเรียนทั้งโรงเรียน", right: "สุ่มอย่างง่าย" }
      - { left: "เรียงตามเลขประจำตัว แล้วเลือกทุกคนที่ 20 โดยสุ่มจุดเริ่ม", right: "สุ่มแบบมีระบบ" }
      - { left: "สุ่มจากแต่ละระดับชั้นตามสัดส่วนจำนวนนักเรียนของชั้นนั้น", right: "สุ่มแบบแบ่งชั้นภูมิ" }
      - { left: "สุ่มมา 4 ห้องเรียน แล้วถามทุกคนในห้อง", right: "สุ่มแบบกลุ่ม" }
      - { left: "ถามเพื่อนที่นั่งโต๊ะใกล้ ๆ ในโรงอาหาร", right: "ตามสะดวก (ไม่สุ่ม)" }
    hints:
      - "สุ่มแบบกลุ่มเลือกทั้งกลุ่ม แบ่งชั้นภูมิเลือกบางคนจากทุกกลุ่ม"
      - "เลือกทุกคนที่ $k$ คือแบบมีระบบ"
    solution: "จับฉลากคือสุ่มอย่างง่าย ทุกคนที่ 20 คือมีระบบ สุ่มจากทุกชั้นตามสัดส่วนคือแบ่งชั้นภูมิ สุ่มทั้งห้องคือแบบกลุ่ม ถามคนใกล้ตัวคือตามสะดวกซึ่งไม่ใช่การสุ่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.sampling-surveys.p004
    topics: [math.stats.sampling-surveys]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นคำถามชี้นำที่ทำให้ผลสำรวจมีอคติ"
    choices:
      - { id: a, text: "\"คุณเห็นด้วยไหมว่าโรงเรียนควรขายน้ำอัดลม เพราะนักเรียนส่วนใหญ่ชอบ\"", correct: true }
      - { id: b, text: "\"คุณดื่มน้ำอัดลมสัปดาห์ละกี่ครั้ง\"", feedback: "คำถามนี้ถามข้อเท็จจริงตรง ๆ ไม่ได้บอกให้ตอบทางใด" }
      - { id: c, text: "\"คุณต้องการให้โรงเรียนขายน้ำอัดลมหรือไม่ (ต้องการ / ไม่ต้องการ / ไม่แน่ใจ)\"", feedback: "มีตัวเลือกครบทุกทางและไม่มีข้อความชักจูง" }
    hints:
      - "คำถามชี้นำมีข้อความที่ชักจูงให้ตอบทางใดทางหนึ่ง"
      - "ดูว่าข้อไหนให้เหตุผลสนับสนุนคำตอบหนึ่งไว้ในคำถาม"
    solution: "ข้อ ก ใส่เหตุผล \"นักเรียนส่วนใหญ่ชอบ\" ไว้ในคำถาม ชักจูงให้ตอบว่าเห็นด้วย จึงเป็นคำถามชี้นำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.sampling-surveys.p005
    topics: [math.stats.sampling-surveys]
    difficulty: 2
    type: mcq
    stem: "บริษัทจะทดสอบว่าหลอดไฟล็อตหนึ่งใช้งานได้นานกี่ชั่วโมงก่อนขาด ควรเก็บข้อมูลอย่างไร"
    choices:
      - { id: a, text: "สุ่มหลอดไฟบางส่วนมาทดสอบ", correct: true }
      - { id: b, text: "ทดสอบทุกหลอด (สำมะโน)", feedback: "การทดสอบทำให้หลอดขาด ถ้าทดสอบทุกหลอดจะไม่เหลือหลอดไว้ขาย" }
      - { id: c, text: "ทดสอบเฉพาะหลอดที่ผลิตวันแรก", feedback: "หลอดวันแรกอาจต่างจากวันอื่น ตัวอย่างจึงไม่เป็นตัวแทนของทั้งล็อต" }
    hints:
      - "การทดสอบทำให้หลอดเสียหรือไม่"
      - "ตัวอย่างต้องเป็นตัวแทนของทั้งล็อต"
    solution: "การทดสอบทำลายหลอดไฟ จึงต้องสุ่มตัวอย่างจากทั้งล็อตมาทดสอบ ไม่ทำสำมะโน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.sampling-surveys.p006
    topics: [math.stats.sampling-surveys]
    difficulty: 3
    type: mcq
    stem: "แฟนเพจของนักร้องคนหนึ่งเปิดโพลออนไลน์ \"นักร้องคนไหนเก่งที่สุดในประเทศ\" ให้ใครก็ได้กดตอบ ผลคือนักร้องเจ้าของเพจได้ 85% ปัญหาหลักของผลนี้คืออะไร"
    choices:
      - { id: a, text: "ผู้ตอบเป็นอาสาสมัครที่ส่วนใหญ่เป็นแฟนของนักร้องคนนั้น ไม่เป็นตัวแทนของคนทั้งประเทศ", correct: true }
      - { id: b, text: "จำนวนผู้ตอบน้อยเกินไป", feedback: "ต่อให้มีคนตอบเป็นหมื่นคน ผู้ตอบก็ยังเป็นแฟนเพจ ปัญหาอยู่ที่วิธีเลือก ไม่ใช่ขนาด" }
      - { id: c, text: "85% สูงเกินกว่าที่จะเป็นจริง", feedback: "ค่าสูงไม่ได้แปลว่าผิดเสมอ ต้องดูว่าตัวอย่างมาจากไหน" }
    hints:
      - "ใครมีแนวโน้มจะเห็นและตอบโพลนี้"
      - "การให้คนเลือกตอบเองเรียกว่าตัวอย่างอาสาสมัคร"
    solution: "คนที่ตอบคือคนที่เข้าเพจและอยากตอบ ส่วนใหญ่เป็นแฟน จึงเป็นอคติจากตัวอย่างอาสาสมัคร ขนาดตัวอย่างที่ใหญ่ขึ้นก็แก้ไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.sampling-surveys.p007
    topics: [math.stats.sampling-surveys]
    difficulty: 3
    type: numeric
    stem: "โรงเรียนมีนักเรียน ม.1 400 คน ม.2 500 คน ม.3 300 คน ต้องการตัวอย่าง 60 คนแบบแบ่งชั้นภูมิตามสัดส่วน ควรสุ่มนักเรียน ม.2 กี่คน (ตอบเป็นจำนวนคน)"
    answer: { value: 25, unit: คน }
    hints:
      - "นักเรียนทั้งหมด 1,200 คน ม.2 คิดเป็นสัดส่วนเท่าไร"
      - "$60 \\times \\tfrac{500}{1{,}200}$"
    misconceptions:
      - { match: 20, feedback: "แบ่งเท่ากันชั้นละ 20 คน แต่ต้องแบ่งตามสัดส่วน ม.2 มีนักเรียนมากที่สุดจึงได้มากที่สุด" }
      - { match: 50, feedback: "หาร 500 ด้วย 10 แต่สัดส่วนการสุ่มคือ $\\tfrac{60}{1{,}200} = \\tfrac{1}{20}$" }
    solution: "สัดส่วนการสุ่ม $\\tfrac{60}{1{,}200} = \\tfrac{1}{20}$ ม.2 ได้ $500 \\times \\tfrac{1}{20} = 25$ คน (ม.1 20 คน ม.3 15 คน รวม 60)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.sampling-surveys.p008
    topics: [math.stats.sampling-surveys]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดถูกต้องเกี่ยวกับตัวอย่างสุ่ม (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ตัวอย่างสุ่มขนาดเท่ากันสองชุดจากประชากรเดียวกันอาจให้ค่าต่างกัน", correct: true }
      - { id: b, text: "ตัวอย่างใหญ่ขึ้น ค่าประมาณจะแปรผันน้อยลง", correct: true }
      - { id: c, text: "ถ้าสุ่มถูกวิธี ค่าจากตัวอย่างจะเท่ากับค่าของประชากรพอดี", feedback: "ค่าจากตัวอย่างใกล้เคียงค่าจริง แต่มักไม่เท่าพอดี เพราะมีความแปรผันระหว่างตัวอย่าง" }
      - { id: d, text: "ถ้าเพิ่มขนาดตัวอย่างตามสะดวกให้ใหญ่พอ อคติจะหมดไป", feedback: "ขนาดใหญ่ลดความแปรผัน แต่ไม่แก้อคติจากวิธีเลือก" }
    hints:
      - "ดูภาพแผนภาพจุดของตัวอย่างขนาด 10 และ 50"
      - "แยกเรื่องความแปรผัน (แก้ด้วยขนาด) กับอคติ (แก้ด้วยวิธีเลือก)"
    solution: "ตัวอย่างสุ่มแต่ละชุดให้ค่าต่างกัน และตัวอย่างที่ใหญ่ขึ้นแปรผันน้อยลง แต่ค่าจากตัวอย่างไม่จำเป็นต้องเท่าค่าจริง และขนาดไม่แก้อคติ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.sampling-surveys.p009
    topics: [math.stats.sampling-surveys]
    difficulty: 3
    type: numeric
    stem: "สุ่มนักเรียน 120 คนจากโรงเรียนที่มีนักเรียน 1,800 คน พบว่า 42 คนนำข้าวกล่องมาจากบ้าน ประมาณว่าทั้งโรงเรียนมีนักเรียนนำข้าวกล่องมาจากบ้านกี่คน (ตอบเป็นจำนวนคน)"
    answer: { value: 630, unit: คน }
    hints:
      - "หาสัดส่วนในตัวอย่าง $\\tfrac{42}{120}$"
      - "นำสัดส่วนไปคูณกับจำนวนนักเรียนทั้งโรงเรียน"
    misconceptions:
      - { match: 35, feedback: "35 คือร้อยละในตัวอย่าง ต้องนำไปขยายเป็นจำนวนคนของทั้งโรงเรียน" }
      - { match: 0.35, feedback: "0.35 คือสัดส่วนในตัวอย่าง ต้องคูณกับ 1,800" }
    solution: "$\\tfrac{42}{120} = 0.35$ ประมาณ $0.35 \\times 1{,}800 = 630$ คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.sampling-surveys.p010
    topics: [math.stats.sampling-surveys]
    difficulty: 4
    type: numeric
    stem: "ประมงจังหวัดจับปลานิลในอ่างเก็บน้ำได้ 45 ตัว ติดป้ายแล้วปล่อยคืน หนึ่งสัปดาห์ต่อมาจับได้ 60 ตัว มีป้าย 9 ตัว ประมาณจำนวนปลานิลในอ่างเก็บน้ำ (ตอบเป็นจำนวนตัว)"
    answer: { value: 300, unit: ตัว }
    hints:
      - "สัดส่วนปลาที่มีป้ายในการจับครั้งที่สอง ควรใกล้สัดส่วนในอ่างทั้งหมด"
      - "$\\tfrac{45}{N} \\approx \\tfrac{9}{60}$"
    misconceptions:
      - { match: 12, feedback: "ตั้งสัดส่วนกลับด้าน ได้น้อยกว่าจำนวนปลาที่จับได้เสียอีก ซึ่งเป็นไปไม่ได้" }
      - { match: 96, feedback: "บวกจำนวนปลาที่จับทั้งสองครั้งแล้วลบปลาที่มีป้าย นั่นคือจำนวนปลาที่จับได้ไม่ซ้ำ ไม่ใช่ปลาทั้งอ่าง" }
    solution: "$\\tfrac{45}{N} \\approx \\tfrac{9}{60}$ ได้ $N \\approx \\tfrac{45 \\times 60}{9} = 300$ ตัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.sampling-surveys.p011
    topics: [math.stats.sampling-surveys]
    difficulty: 4
    type: match
    stem: "จับคู่การศึกษากับชนิดของการศึกษา"
    pairs:
      - { left: "สุ่มเกษตรกร 300 คนทั่วจังหวัด ถามว่าใช้ปุ๋ยอินทรีย์หรือไม่", right: "การสำรวจ" }
      - { left: "สุ่มแบ่งแปลงนาเป็นสองกลุ่ม กลุ่มหนึ่งใส่ปุ๋ยสูตรใหม่ อีกกลุ่มใส่สูตรเดิม แล้วเทียบผลผลิต", right: "การทดลอง" }
      - { left: "เก็บข้อมูลผลผลิตของนาที่เจ้าของเลือกใช้ปุ๋ยอินทรีย์เองกับนาที่ไม่ใช้ แล้วเทียบกัน", right: "การศึกษาเชิงสังเกต" }
    hints:
      - "ผู้วิจัยเป็นคนกำหนดว่าแปลงไหนได้ปุ๋ยอะไรหรือไม่"
      - "การสำรวจถามหรือวัดเพื่อบรรยาย ไม่ได้เทียบผลของสิ่งที่ทำ"
    solution: "ถามเพื่อบรรยายคือการสำรวจ ผู้วิจัยสุ่มกำหนดปุ๋ยคือการทดลอง เจ้าของเลือกเองแล้วผู้วิจัยแค่เก็บข้อมูลคือการศึกษาเชิงสังเกต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.sampling-surveys.p012
    topics: [math.stats.sampling-surveys]
    difficulty: 4
    type: mcq
    stem: "ในการทดลองเทียบปุ๋ยสองสูตร ทำไมต้องสุ่มว่าแปลงใดได้ปุ๋ยสูตรใด แทนให้เกษตรกรเลือกเอง"
    choices:
      - { id: a, text: "เพื่อให้สองกลุ่มคล้ายกันในเรื่องอื่น ๆ ผลต่างของผลผลิตจึงน่าจะเกิดจากปุ๋ย", correct: true }
      - { id: b, text: "เพื่อให้ได้ผลผลิตมากที่สุด", feedback: "การสุ่มไม่ได้ทำให้ผลผลิตเพิ่ม แต่ทำให้การเปรียบเทียบยุติธรรม" }
      - { id: c, text: "เพื่อให้ใช้แปลงนาน้อยลง", feedback: "การสุ่มไม่เปลี่ยนจำนวนแปลง" }
    hints:
      - "ถ้าให้เลือกเอง เกษตรกรที่มีดินดีอาจเลือกสูตรใหม่มากกว่า"
      - "ต้องการให้สิ่งที่ต่างกันมีแค่ปุ๋ย"
    solution: "การสุ่มแบ่งกลุ่มกระจายความต่างอื่น ๆ (ดิน น้ำ ความชำนาญ) ให้ทั้งสองกลุ่มพอ ๆ กัน ผลต่างที่เห็นจึงบอกผลของปุ๋ยได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.sampling-surveys.p013
    topics: [math.stats.sampling-surveys]
    difficulty: 4
    type: numeric
    stem: "ใช้กฎคร่าว ๆ $\\tfrac{1}{\\sqrt{n}}$ ประมาณว่าสัดส่วนจากตัวอย่างสุ่มขนาด 400 คน น่าจะคลาดจากสัดส่วนจริงราวกี่เปอร์เซ็นต์ (ตอบเป็นเปอร์เซ็นต์)"
    answer: { value: 5, unit: "%" }
    hints:
      - "$\\sqrt{400} = 20$"
      - "$\\tfrac{1}{20}$ คิดเป็นกี่เปอร์เซ็นต์"
    misconceptions:
      - { match: 0.25, feedback: "ใช้ $\\tfrac{1}{n}$ แทน $\\tfrac{1}{\\sqrt{n}}$" }
      - { match: 20, feedback: "20 คือ $\\sqrt{400}$ ต้องนำไปเป็นตัวส่วน $\\tfrac{1}{20}$" }
    solution: "$\\tfrac{1}{\\sqrt{400}} = \\tfrac{1}{20} = 0.05 = 5\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.sampling-surveys.p014
    topics: [math.stats.sampling-surveys]
    difficulty: 4
    type: numeric
    stem: "สุ่มนักเรียนห้อง ก และห้อง ข มาวัดส่วนสูง ห้อง ก มีค่าเฉลี่ย 152 ซม. ห้อง ข มีค่าเฉลี่ย 146 ซม. ทั้งสองห้องมีส่วนเบี่ยงเบนเฉลี่ย (MAD) ประมาณ 3 ซม. ผลต่างของค่าเฉลี่ยเป็นกี่เท่าของ MAD"
    answer: { value: 2, unit: เท่า }
    hints:
      - "หาผลต่างของค่าเฉลี่ยก่อน"
      - "นำผลต่างหารด้วย MAD"
    misconceptions:
      - { match: 6, feedback: "6 ซม. คือผลต่างของค่าเฉลี่ย ต้องนำไปเทียบกับ MAD" }
      - { match: 0.5, feedback: "หารกลับด้าน ต้องเป็นผลต่าง ÷ MAD" }
    solution: "ผลต่าง $152 - 146 = 6$ ซม. $= \\tfrac{6}{3} = 2$ เท่าของ MAD แผนภาพจุดของสองห้องจะแยกกันให้เห็นชัด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.sampling-surveys.p015
    topics: [math.stats.sampling-surveys]
    difficulty: 5
    type: numeric
    stem: "ถ้าเหรียญยุติธรรม (ออกหัวหรือก้อยอย่างละครึ่ง) โอกาสที่โยน 5 ครั้งแล้วออกก้อยทั้ง 5 ครั้งเป็นเท่าไร (ตอบเป็นทศนิยม)"
    answer: { value: 0.03125, tolerance: 0.0005 }
    hints:
      - "แต่ละครั้งมีโอกาสออกก้อย $\\tfrac12$ และแต่ละครั้งไม่ขึ้นต่อกัน"
      - "$(\\tfrac12)^5$"
    misconceptions:
      - { match: 0.5, feedback: "นี่คือโอกาสของการโยนครั้งเดียว ต้องออกก้อยทั้ง 5 ครั้งติดกัน" }
      - { match: 0.1, feedback: "คิดเป็น $\\tfrac{1}{2 \\times 5}$ แต่ต้องคูณ $\\tfrac12$ ห้าครั้ง" }
    solution: "$(\\tfrac12)^5 = \\tfrac{1}{32} = 0.03125$ เกิดได้แต่ไม่บ่อย (ราว 3 ครั้งใน 100)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.sampling-surveys.p016
    topics: [math.stats.sampling-surveys]
    difficulty: 5
    type: mcq
    stem: "เพื่อนโยนเหรียญ 20 ครั้งได้หัว 16 ครั้ง นักเรียนจำลองการโยนเหรียญยุติธรรมรอบละ 20 ครั้ง ทำ 1,000 รอบ พบว่าได้หัว 16 ครั้งขึ้นไปเพียง 6 รอบ ควรสรุปอย่างไร"
    choices:
      - { id: a, text: "ผลแบบนี้เกิดยากมากถ้าเหรียญยุติธรรม จึงมีเหตุผลที่จะสงสัยว่าเหรียญไม่ยุติธรรม", correct: true }
      - { id: b, text: "พิสูจน์ได้แน่นอนว่าเหรียญไม่ยุติธรรม", feedback: "ผลนี้เกิดได้ราว 6 ใน 1,000 รอบ จึงยังเป็นไปได้ สรุปได้แค่ว่าน่าสงสัย ไม่ใช่แน่นอน" }
      - { id: c, text: "เหรียญยุติธรรมแน่นอน เพราะโอกาสออกหัวคือ 0.5", feedback: "0.5 คือสมมติฐาน การจำลองแสดงว่าผลที่เห็นไม่ค่อยเข้ากับสมมติฐานนี้" }
    hints:
      - "6 จาก 1,000 รอบคือกี่เปอร์เซ็นต์"
      - "ผลที่เกิดยากภายใต้แบบจำลอง ทำให้สงสัยแบบจำลอง แต่ไม่ได้พิสูจน์"
    solution: "ภายใต้แบบจำลองเหรียญยุติธรรม ได้หัว 16 ครั้งขึ้นไปเพียงราว 0.6% ของรอบ ผลของเพื่อนจึงไม่ค่อยเข้ากับแบบจำลอง ควรสงสัยว่าเหรียญไม่ยุติธรรม แต่ยังไม่ใช่การพิสูจน์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.sampling-surveys.p017
    topics: [math.stats.sampling-surveys]
    difficulty: 5
    type: mcq
    stem: "โฆษณาใช้กราฟในภาพแล้วบอกว่า \"ยี่ห้อ ข ขายดีกว่ายี่ห้อ ก หลายเท่า\" ข้อใดวิจารณ์ได้ถูกต้อง"
    figure: { src: truncated-axis.svg, alt: "แผนภูมิแท่งยอดขายต่อเดือนเป็นพันขวด แกนตั้งเริ่มที่ 50 และสิ้นสุดที่ 56 ยี่ห้อ ก สูงถึง 52 ยี่ห้อ ข สูงถึง 55 แท่งของยี่ห้อ ข จึงดูสูงกว่าแท่งของยี่ห้อ ก เกือบ 2.5 เท่า" }
    choices:
      - { id: a, text: "แกนตั้งเริ่มที่ 50 ทำให้แท่งดูต่างกันมาก ที่จริงยอดขายต่างกันเพียง 3 พันขวด หรือราว 6%", correct: true }
      - { id: b, text: "ถูกต้อง เพราะแท่งของ ข สูงกว่าแท่งของ ก ประมาณ 2.5 เท่า", feedback: "ความสูงของแท่งวัดจาก 50 ไม่ใช่จาก 0 ค่าจริงคือ 55 กับ 52 ซึ่งต่างกันไม่มาก" }
      - { id: c, text: "ผิดเพราะยี่ห้อ ก ขายดีกว่า", feedback: "ยี่ห้อ ข ขายได้มากกว่าจริง (55 > 52) แต่ไม่ได้มากหลายเท่า" }
    hints:
      - "อ่านค่าจริงของแต่ละแท่งจากแกนตั้ง"
      - "แกนตั้งเริ่มที่ 0 หรือไม่"
    solution: "ยอดขายจริงคือ 52 กับ 55 พันขวด ต่างกัน 3 พันขวด ($\\tfrac{3}{52} \\approx 6\\%$) แต่แกนตั้งเริ่มที่ 50 ทำให้แท่งดูต่างกันราว 2.5 เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.sampling-surveys.p018
    topics: [math.stats.sampling-surveys]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "ข่าวรายงานว่า \"คนไทย 90% ชอบเครื่องดื่ม X\" จากการถามลูกค้า 50 คนในร้านของบริษัท X ข้อใดเป็นข้อวิจารณ์ที่สมเหตุสมผล (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ลูกค้าในร้านของบริษัทไม่เป็นตัวแทนของคนไทยทั้งประเทศ", correct: true }
      - { id: b, text: "ตัวอย่าง 50 คนเล็กมาก ค่าประมาณจึงแปรผันได้มาก", correct: true }
      - { id: c, text: "ผู้สำรวจคือบริษัทที่ได้ประโยชน์จากผลสำรวจ ควรระวังเรื่องผลประโยชน์ทับซ้อน", correct: true }
      - { id: d, text: "ตัวเลข 90% สูงเกินไป จึงต้องผิดแน่นอน", feedback: "ตัวเลขสูงไม่ได้ผิดเสมอ ข้อวิจารณ์ต้องมาจากวิธีเก็บข้อมูล" }
    hints:
      - "ถามว่า ใครถูกถาม กี่คน และใครเป็นผู้สำรวจ"
      - "วิจารณ์ที่วิธีการ ไม่ใช่ที่ตัวเลขดูแปลก"
    solution: "ตัวอย่างเป็นลูกค้าของบริษัท (ไม่เป็นตัวแทน) มีแค่ 50 คน (แปรผันมาก) และบริษัทมีส่วนได้เสีย แต่การที่ตัวเลขสูงไม่ใช่เหตุผลว่าผิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.sampling-surveys.p019
    topics: [math.stats.sampling-surveys]
    difficulty: 3
    type: mcq
    stem: "ข้อใดเป็นการสำรวจที่ไม่ถูกต้องตามจริยธรรม"
    choices:
      - { id: a, text: "ประกาศชื่อนักเรียนพร้อมคำตอบเรื่องรายได้ครอบครัวบนบอร์ดหน้าห้องโดยไม่ได้ขออนุญาต", correct: true }
      - { id: b, text: "บอกผู้ตอบว่าจะนำข้อมูลไปใช้ทำอะไร และให้เลือกได้ว่าจะตอบหรือไม่", feedback: "การแจ้งวัตถุประสงค์และขอความยินยอมเป็นสิ่งที่ควรทำ" }
      - { id: c, text: "รายงานผลตามจริงแม้ผลไม่เป็นอย่างที่คาดไว้", feedback: "การรายงานตามจริงเป็นหลักจริยธรรมที่สำคัญ" }
    hints:
      - "ข้อมูลส่วนตัวต้องเก็บเป็นความลับ"
      - "ผู้ตอบต้องยินยอม"
    solution: "การเปิดเผยข้อมูลส่วนตัวพร้อมชื่อโดยไม่ได้รับอนุญาตละเมิดความเป็นส่วนตัวของผู้ตอบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.sampling-surveys.p020
    topics: [math.stats.sampling-surveys]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการสำรวจด้วยกลุ่มตัวอย่างเพื่ออนุมานประชากร"
    items: ["กำหนดประชากรและคำถามที่อยากรู้", "เลือกวิธีสุ่มและขนาดตัวอย่าง", "เก็บข้อมูลจากกลุ่มตัวอย่าง", "คำนวณค่าสถิติจากตัวอย่าง", "อนุมานไปยังประชากรพร้อมบอกความไม่แน่นอน"]
    hints:
      - "ต้องรู้ก่อนว่าอยากรู้อะไรจากใคร"
      - "ค่าสถิติคำนวณหลังได้ข้อมูล และการอนุมานเป็นขั้นสุดท้าย"
    solution: "กำหนดประชากรและคำถาม → เลือกวิธีสุ่มและขนาด → เก็บข้อมูล → คำนวณค่าสถิติ → อนุมานพร้อมบอกความไม่แน่นอน"
