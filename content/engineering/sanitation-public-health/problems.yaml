  - id: engineering.environmental.sanitation-public-health.p015
    topics:
      - engineering.environmental.sanitation-public-health
    difficulty: 4
    type: code
    stem: เขียนฟังก์ชัน `attack_rate(cases, exposed)` ที่รับจำนวนผู้ป่วยในกลุ่มที่สัมผัสและจำนวนคนในกลุ่มที่สัมผัส แล้วคืนอัตราป่วยเป็นเปอร์เซ็นต์ (ทศนิยมได้)
    starter: "def attack_rate(cases, exposed):\n    pass\n"
    tests: 'r = attack_rate(30, 40)

      assert r is not None, "ฟังก์ชันยังไม่ได้คืนค่า ให้ใช้ return ไม่ใช่ print"

      assert abs(r - 75.0) < 1e-9, f"attack_rate(30, 40) ควรได้ 75.0 แต่ได้ {r}"

      assert abs(attack_rate(0, 50) - 0.0) < 1e-9, "ไม่มีผู้ป่วยควรได้ 0"

      assert abs(attack_rate(5, 20) - 25.0) < 1e-9, f"attack_rate(5, 20) ควรได้ 25.0 แต่ได้ {attack_rate(5, 20)} (ตรวจตัวหารให้เป็นจำนวนคนที่สัมผัส)"

      '
    reference: "def attack_rate(cases, exposed):\n    return cases / exposed * 100\n"
    hints:
      - อัตราป่วย = ผู้ป่วย ÷ คนที่สัมผัส × 100
      - ใช้ return เพื่อคืนค่า
    solution: คืนค่า cases / exposed * 100 เช่น 30 / 40 * 100 = 75.0
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.sanitation-public-health.p016
    topics:
      - engineering.environmental.sanitation-public-health
    difficulty: 5
    type: numeric
    stem: (ข้อมูลสมมติ) บ้านพักของครอบครัว 6 คน ใช้น้ำเสียประมาณ 50 ลิตรต่อคนต่อวัน ออกแบบให้น้ำพักในบ่อเกรอะ 2 วัน และเผื่อพื้นที่สำหรับตะกอนอีก 30% ของปริมาตรที่คำนวณได้ ปริมาตรบ่อเกรอะที่ควรเป็นกี่ลิตร (ตอบจำนวนเต็ม)
    answer:
      value: 780
      tolerance: 1
      unit: L
    hints:
      - ปริมาตรพื้นฐาน = จำนวนคน × ปริมาณน้ำเสียต่อคนต่อวัน × จำนวนวันที่พัก
      - เพิ่มตะกอนโดยคูณด้วย (1 + 0.30) ของปริมาตรพื้นฐาน
    misconceptions:
      - match: 600
        feedback: ลืมเผื่อพื้นที่สำหรับตะกอนสะสม ซึ่งต้องรวมในปริมาตรใช้งาน
    solution: ปริมาตรพื้นฐาน = 6 × 50 × 2 = 600 ลิตร เผื่อตะกอน 30% ได้ 600 × 1.3 = 780 ลิตร ค่าทั้งหมดเป็นค่าสมมติเพื่อการฝึกคำนวณ การออกแบบจริงต้องใช้เกณฑ์ของหน่วยงานกำกับ
    license: CC-BY-SA-4.0
    ai_assisted: true
