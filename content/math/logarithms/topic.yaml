id: math.functions.logarithms
subject: math
title: { th: ลอการิทึม, en: Logarithms }
summary: ลอการิทึมตอบคำถามว่าต้องยกกำลังเท่าใด ใช้สมบัติของลอการิทึม log ฐานสิบ และ ln แก้สมการเอกซ์โพเนนเชียลอย่างง่าย เช่น ฝากเงินกี่ปีจึงได้สองเท่า
difficulty: 6.5
minutes: 40
prerequisites: [math.functions.exponential, math.functions.inverse]
encompasses:
  - { id: math.functions.exponential, weight: 0.5 }
  - { id: math.functions.functions-intro, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: exp-log-reflect.svg
    alt: "กราฟ y = 2^x เพิ่มเร็วผ่าน (0, 1), (1, 2), (2, 4) และกราฟ y = log ฐาน 2 ของ x ผ่าน (1, 0), (2, 1), (4, 2) มีเส้นประ y = x อยู่ตรงกลาง จุดคู่กันเชื่อมด้วยเส้นประสั้นตั้งฉากกับ y = x แสดงว่ากราฟสองเส้นสะท้อนกัน"
    caption: "สลับพิกัดของจุดบน $y = 2^x$ ได้จุดบน $y = \\log_2 x$ ลอการิทึมจึงเป็นฟังก์ชันผกผันของเอกซ์โพเนนเชียล"
  - { type: check, problem: math.log.p016, prompt: "ใช้ความหมายของลอการิทึมตรวจแต่ละจุด" }
  - type: worked-example
    title: ลอการิทึมที่ได้คำตอบเป็นเศษส่วน
    problem: "หาค่า $\\log_8 4$"
    steps:
      - text: "ให้ $\\log_8 4 = y$ แปลว่า $8^y = 4$"
        why: "ลอการิทึมคือเลขชี้กำลัง เปลี่ยนเป็นรูปเลขยกกำลังจะคิดง่ายกว่า"
      - text: "เขียนทั้งสองข้างเป็นฐาน 2: $8 = 2^3$ และ $4 = 2^2$ ได้ $(2^3)^y = 2^2$"
      - text: "$2^{3y} = 2^2$ ฐานเท่ากัน เลขชี้กำลังต้องเท่ากัน: $3y = 2$"
      - text: "$y = \\frac{2}{3}$ ตรวจ: $8^{2/3} = (\\sqrt[3]{8})^2 = 2^2 = 4$ ✓"
    answer: "$\\log_8 4 = \\frac{2}{3}$"
  - type: worked-example
    title: แก้สมการ $a \\cdot \\mathrm{e}^{kt} = d$
    problem: "ประชากรของเมืองหนึ่งประมาณได้ด้วย $P = 1200\\mathrm{e}^{0.03t}$ คน เมื่อ $t$ เป็นจำนวนปีนับจากปีเริ่มต้น ประชากรจะถึง 3,000 คนเมื่อใด"
    steps:
      - text: "ตั้งสมการ $1200\\mathrm{e}^{0.03t} = 3000$"
      - text: "หาร 1200 ก่อน: $\\mathrm{e}^{0.03t} = 2.5$"
        why: "1200 ไม่ได้ถูกยกกำลัง ต้องแยกเลขยกกำลังออกมาให้อยู่ข้างเดียวก่อนใส่ลอการิทึม"
      - text: "ใส่ $\\ln$ ทั้งสองข้าง: $0.03t = \\ln 2.5 \\approx 0.9163$"
        why: "$\\ln$ เป็นฟังก์ชันผกผันของ $\\mathrm{e}^x$ จึงได้ $\\ln \\mathrm{e}^{0.03t} = 0.03t$ พอดี"
      - text: "$t = \\frac{0.9163}{0.03} \\approx 30.5$ ปี"
      - text: "ตรวจ: $1200\\mathrm{e}^{0.03 \\times 30.54} \\approx 1200 \\times 2.5 = 3000$ ✓"
    answer: "ประมาณ 30.5 ปี จึงเกินปีที่ 30 ไปเล็กน้อย"
  - { type: check, problem: math.log.p017, prompt: "แยกเลขยกกำลังออกมาก่อนใส่ ln" }
  - type: figure
    src: ph-scale.svg
    alt: "มาตรา pH จาก 0 ถึง 14 ใต้ตัวเลข pH 1, 4, 7, 10, 13 กำกับความเข้มข้นไอออนไฮโดรเจน 10 ยกกำลังลบ 1, ลบ 4, ลบ 7, ลบ 10, ลบ 13 โมลต่อลิตร มีจุดน้ำมะนาวประมาณ 2 น้ำบริสุทธิ์ 7 และน้ำสบู่ประมาณ 12"
    caption: "มาตรา pH เป็นมาตราลอการิทึม: pH เพิ่ม 1 หน่วย ความเข้มข้นของ $\\mathrm{H^+}$ ลดลง 10 เท่า"
  - type: interactive
    title: กราฟลอการิทึมเป็นภาพสะท้อนของกราฟเอกซ์โพเนนเชียล
    caption: "เส้นโค้งที่เพิ่มเร็วคือ y = bˣ เส้นโค้งที่เพิ่มช้าคือ y = log ฐาน b ของ x และเส้นตรงคือ y = x ลองเปลี่ยนฐาน b แล้วสังเกตว่าสองกราฟสะท้อนกันข้ามเส้น y = x เสมอ และกราฟลอการิทึมผ่านจุด (1, 0) ทุกฐาน"
    widget:
      kind: function-plot
      functions: ["b^{x}", "\\frac{\\ln x}{\\ln b}", "x"]
      sliders:
        - { name: b, min: 1.5, max: 5, step: 0.5, value: 2, label: ฐาน }
      x: [-4, 6]
      y: [-4, 6]
glossary:
  - { term: ลอการิทึม, definition: "$\\log_b x$ คือเลขชี้กำลังที่ต้องยก $b$ ขึ้นไปเพื่อให้ได้ $x$ กล่าวคือ $\\log_b x = y$ เมื่อ $b^y = x$" }
  - { term: ลอการิทึมสามัญ, definition: "ลอการิทึมฐาน 10 เขียนย่อว่า $\\log x$" }
  - { term: ลอการิทึมธรรมชาติ, definition: "ลอการิทึมฐาน $\\mathrm{e} \\approx 2.718$ เขียนว่า $\\ln x$" }
flashcards:
  - { front: "$\\log_b x = y$ เขียนในรูปเลขยกกำลังได้อย่างไร", back: "$b^y = x$" }
  - { front: "สมบัติผลคูณและผลหารของลอการิทึม", back: "$\\log_b(MN) = \\log_b M + \\log_b N$ และ $\\log_b \\tfrac{M}{N} = \\log_b M - \\log_b N$" }
  - { front: "สมบัติเลขยกกำลังของลอการิทึม", back: "$\\log_b M^k = k \\log_b M$" }
  - { front: "$\\log_b 1$ และ $\\log_b b$ เท่ากับเท่าใด", back: "$\\log_b 1 = 0$ และ $\\log_b b = 1$" }
  - { front: "แก้สมการ $a^x = c$ อย่างไร", back: "ใส่ log ทั้งสองข้าง ได้ $x = \\dfrac{\\log c}{\\log a}$ (ใช้ ln ก็ได้ผลเท่ากัน)" }
