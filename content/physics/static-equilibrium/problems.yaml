  - id: physics.rotation.static-equilibrium.p013
    topics: [physics.rotation.static-equilibrium]
    difficulty: 4
    type: numeric
    stem: "บ่อน้ำในหมู่บ้านใช้รอกแบบล้อกับเพลา ด้ามหมุนห่างแกน $0.40\\ \\mathrm{m}$ เพลาที่เชือกพันมีรัศมี $0.10\\ \\mathrm{m}$ ยกถังน้ำหนัก $120\\ \\mathrm{N}$ ขึ้นช้า ๆ โดยออกแรงที่ด้ามจริง $40\\ \\mathrm{N}$ ประสิทธิภาพของรอกเป็นร้อยละเท่าใด"
    answer: { value: 75, tolerance: 0.5, unit: "%" }
    misconceptions:
      - { match: 133, feedback: "หารกลับด้าน ประสิทธิภาพของเครื่องกลจริงต้องน้อยกว่าร้อยละ 100" }
      - { match: 33.3, feedback: "หารแรงพยายามด้วยภาระ ประสิทธิภาพคือ MA จริง ÷ MA ในอุดมคติ" }
    hints:
      - "MA ในอุดมคติ $= \\dfrac{R}{r}$ และ MA จริง $= \\dfrac{W}{E}$"
      - "ประสิทธิภาพ $= \\dfrac{\\text{MA จริง}}{\\text{MA ในอุดมคติ}} \\times 100\\%$"
    solution: "MA ในอุดมคติ $= \\dfrac{0.40}{0.10} = 4$ (ถ้าไม่มีแรงเสียดทานต้องออกแรงเพียง $30\\ \\mathrm{N}$) MA จริง $= \\dfrac{120}{40} = 3$ ประสิทธิภาพ $= \\dfrac{3}{4} \\times 100\\% = 75\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.rotation.static-equilibrium.p014
    topics: [physics.rotation.static-equilibrium]
    difficulty: 4
    type: mcq
    stem: "ขว้างค้อนให้หมุนตีลังกาไปในอากาศ (ไม่คิดแรงต้านอากาศ) จุดใดของค้อนเคลื่อนที่เป็นเส้นโค้งพาราโบลาเรียบ ๆ เหมือนลูกบอลที่ถูกขว้าง"
    choices:
      - { id: a, text: "ศูนย์กลางมวลของค้อน ซึ่งอยู่ใกล้หัวค้อน", correct: true }
      - { id: b, text: "ปลายด้ามค้อน", feedback: "ปลายด้ามหมุนรอบศูนย์กลางมวลไปด้วย เส้นทางจึงเป็นวงวนซ้อนกับพาราโบลา ไม่เรียบ" }
      - { id: c, text: "จุดกึ่งกลางความยาวของค้อน", feedback: "หัวค้อนหนักกว่าด้ามมาก ศูนย์กลางมวลจึงไม่ได้อยู่กลางความยาว จุดกึ่งกลางความยาวก็หมุนวนเช่นกัน" }
    hints:
      - "แรงโน้มถ่วงลัพธ์ต่อค้อนเสมือนกระทำที่จุดใด"
      - "จุดใดเคลื่อนที่เหมือนมวลทั้งหมดรวมอยู่ที่นั่น"
    solution: "การเคลื่อนที่ของวัตถุแยกได้เป็นการเลื่อนที่ของศูนย์กลางมวลบวกกับการหมุนรอบศูนย์กลางมวล แรงลัพธ์คือน้ำหนักซึ่งกระทำที่ศูนย์ถ่วง (ตรงกับศูนย์กลางมวล) ศูนย์กลางมวลจึงเคลื่อนที่แบบโพรเจกไทล์ ส่วนจุดอื่นหมุนวนรอบมัน หัวค้อนหนักกว่าด้ามมาก ศูนย์กลางมวลจึงอยู่ใกล้หัวค้อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.rotation.static-equilibrium.p015
    topics: [physics.rotation.static-equilibrium]
    difficulty: 5
    type: numeric
    stem: "คานสม่ำเสมอยาว $4.0\\ \\mathrm{m}$ หนัก $300\\ \\mathrm{N}$ ติดบานพับกับผนังและวางตัวในแนวราบ เชือกโยงจากปลายคานไปยึดผนังด้านบนทำมุม $30^\\circ$ กับคาน และมีป้ายหนัก $500\\ \\mathrm{N}$ แขวนที่ปลายคาน แรงตึงเชือกเป็นกี่นิวตัน"
    figure: { src: p-hinged-beam.svg, alt: "คานแนวราบยาว 4.0 m หนัก 300 N ปลายซ้ายติดบานพับกับผนัง ปลายขวามีเชือกโยงเฉียงขึ้นไปยึดผนังด้านบน ทำมุม 30 องศากับคาน และมีป้ายหนัก 500 N แขวนอยู่ใต้ปลายขวา" }
    answer: { value: 1300, tolerance: 10, unit: N }
    misconceptions:
      - { match: 650, feedback: "ใช้แขนของแรงตึงเป็น $4.0\\ \\mathrm{m}$ เต็ม แต่แรงตึงเอียง แขนของโมเมนต์คือ $4.0\\sin 30^\\circ = 2.0\\ \\mathrm{m}$" }
      - { match: 750.6, feedback: "ใช้ $\\cos 30^\\circ$ แต่องค์ประกอบของแรงตึงที่ตั้งฉากกับคานคือ $T\\sin 30^\\circ$" }
    hints:
      - "ใช้บานพับเป็นจุดหมุน แรงจากบานพับจะไม่มีโมเมนต์"
      - "โมเมนต์ของแรงตึง $= T\\sin 30^\\circ \\times 4.0$ น้ำหนักคานกระทำที่ $2.0\\ \\mathrm{m}$ ป้ายที่ $4.0\\ \\mathrm{m}$"
    solution: "รอบบานพับ: $T\\sin 30^\\circ(4.0) = 300(2.0) + 500(4.0) = 2600$ จึงได้ $2.0\\,T = 2600$ และ $T = 1300\\ \\mathrm{N}$ มากกว่าน้ำหนักรวมเพราะเชือกเอียงน้อย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.rotation.static-equilibrium.p016
    topics: [physics.rotation.static-equilibrium]
    difficulty: 5
    type: numeric
    stem: "ในการทดลองสมดุลของแรงสามแรง ห่วงเล็กถูกดึงด้วยเครื่องชั่งสปริงสามอันจนนิ่ง เครื่องชั่ง A อ่านได้ $40\\ \\mathrm{N}$ เครื่องชั่ง B อ่านได้ $30\\ \\mathrm{N}$ และแรงของ A ตั้งฉากกับแรงของ B แรงของเครื่องชั่ง C ทำมุมกี่องศากับแรงของเครื่องชั่ง A (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 143.1, tolerance: 0.3, unit: องศา }
    misconceptions:
      - { match: 36.9, feedback: "นี่คือมุมระหว่างแรงลัพธ์ของ A กับ B และแรงของ A แรงของ C ต้องชี้ตรงข้ามกับแรงลัพธ์นั้น" }
      - { match: 126.9, feedback: "ได้มุมระหว่างแรงของ C กับแรงของ B ซึ่งเป็นอีกมุมหนึ่ง โจทย์ถามมุมกับแรงของ A" }
    hints:
      - "แรงของ C ต้องหักล้างแรงลัพธ์ของ A กับ B พอดี จึงมีขนาดเท่ากันแต่ทิศตรงข้าม"
      - "แรงลัพธ์ของ A กับ B ทำมุม $\\tan^{-1}\\tfrac{30}{40}$ กับ A แล้วแรงของ C อยู่ตรงข้ามกับแรงลัพธ์นี้"
    solution: "แรงลัพธ์ของ A กับ B มีขนาด $50\\ \\mathrm{N}$ ทำมุม $\\tan^{-1}\\tfrac{30}{40} = 36.9^\\circ$ กับ A แรงของ C มีขนาด $50\\ \\mathrm{N}$ ทิศตรงข้าม จึงทำมุม $180^\\circ - 36.9^\\circ = 143.1^\\circ$ กับ A (และ $126.9^\\circ$ กับ B ผลรวมมุมรอบจุด $90 + 143.1 + 126.9 = 360^\\circ$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

