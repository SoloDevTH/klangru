id: math.calculus.infinite-series
subject: math
title:
  th: ลำดับ อนุกรมอนันต์ และการทดสอบด้วยปริพันธ์
  en: Sequences, infinite series, and the integral test
summary: นิยามการลู่เข้าของลำดับและอนุกรม ผลบวกย่อย อนุกรมเรขาคณิตและเทเลสโคป การทดสอบพจน์ที่ n การทดสอบด้วยปริพันธ์ และการประมาณเศษเหลือ
difficulty: 8.5
minutes: 40
