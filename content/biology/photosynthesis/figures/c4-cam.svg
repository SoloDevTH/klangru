<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" font-family="sans-serif" font-size="14">
<title>การตรึงคาร์บอนของพืช C4 และพืช CAM</title>
<rect x="0" y="0" width="780" height="360" fill="#ffffff"/>
<text x="190.0" y="32.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">พืช C4: แยกกันตามตำแหน่ง</text>
<text x="590.0" y="32.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">พืช CAM: แยกกันตามเวลา</text>
<line x1="390.0" y1="20.0" x2="390.0" y2="250.0" stroke="#bbb" stroke-width="1.5" stroke-dasharray="5,4"/>
<rect x="20.0" y="60.0" width="170.0" height="120.0" rx="8" fill="#e3f0dc" stroke="#333" stroke-width="1.5"/>
<text x="105.0" y="82.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">เซลล์มีโซฟิลล์</text>
<text x="105.0" y="100.0" text-anchor="middle" font-size="13" fill="#222">CO₂ + PEP</text>
<text x="105.0" y="118.0" text-anchor="middle" font-size="13" fill="#222">→ OAA (4C) → มาเลต</text>
<text x="105.0" y="136.0" text-anchor="middle" font-size="13" fill="#222">เอนไซม์ PEP คาร์บอกซิเลส</text>
<rect x="210.0" y="60.0" width="170.0" height="120.0" rx="8" fill="#fde9c8" stroke="#333" stroke-width="1.5"/>
<text x="295.0" y="82.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">เซลล์บันเดิลชีท</text>
<text x="295.0" y="100.0" text-anchor="middle" font-size="13" fill="#222">มาเลตปล่อย CO₂</text>
<text x="295.0" y="118.0" text-anchor="middle" font-size="13" fill="#222">CO₂ เข้มข้นสูง</text>
<text x="295.0" y="136.0" text-anchor="middle" font-size="13" fill="#222">→ วัฏจักรคัลวิน</text>
<line x1="190.0" y1="120.0" x2="206.0" y2="120.0" stroke="#444" stroke-width="2"/>
<polygon points="206.0,120.0 197.7,123.5 197.7,116.5" fill="#444"/>
<text x="200.0" y="210.0" text-anchor="middle" font-size="13" fill="#222">รูบิสโกได้ CO₂ มาก การหายใจแสงลดลง</text>
<text x="200.0" y="232.0" text-anchor="middle" font-size="13" fill="#2a7a3a">เช่น อ้อย ข้าวโพด ข้าวฟ่าง</text>
<rect x="410.0" y="60.0" width="170.0" height="120.0" rx="8" fill="#dfe6f5" stroke="#333" stroke-width="1.5"/>
<text x="495.0" y="82.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">กลางคืน</text>
<text x="495.0" y="100.0" text-anchor="middle" font-size="13" fill="#222">ปากใบเปิด</text>
<text x="495.0" y="118.0" text-anchor="middle" font-size="13" fill="#222">CO₂ + PEP → OAA</text>
<text x="495.0" y="136.0" text-anchor="middle" font-size="13" fill="#222">→ กรดมาลิกเก็บในแวคิวโอล</text>
<rect x="600.0" y="60.0" width="170.0" height="120.0" rx="8" fill="#fff3cf" stroke="#333" stroke-width="1.5"/>
<text x="685.0" y="82.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">กลางวัน</text>
<text x="685.0" y="100.0" text-anchor="middle" font-size="13" fill="#222">ปากใบปิด</text>
<text x="685.0" y="118.0" text-anchor="middle" font-size="13" fill="#222">กรดมาลิกปล่อย CO₂</text>
<text x="685.0" y="136.0" text-anchor="middle" font-size="13" fill="#222">→ วัฏจักรคัลวิน</text>
<line x1="580.0" y1="120.0" x2="596.0" y2="120.0" stroke="#444" stroke-width="2"/>
<polygon points="596.0,120.0 587.7,123.5 587.7,116.5" fill="#444"/>
<text x="590.0" y="210.0" text-anchor="middle" font-size="13" fill="#222">ปิดปากใบตอนร้อน จึงเสียน้ำน้อยมาก</text>
<text x="590.0" y="232.0" text-anchor="middle" font-size="13" fill="#2a7a3a">เช่น สับปะรด กระบองเพชร ว่านหางจระเข้</text>
<text x="390.0" y="290.0" text-anchor="middle" font-size="13" fill="#222">พืช C3 (เช่น ข้าว ถั่ว) ตรึง CO₂ ด้วยรูบิสโกโดยตรงในเซลล์มีโซฟิลล์ ได้ PGA (3C) เป็นสารแรก</text>
<text x="390.0" y="316.0" text-anchor="middle" font-size="13" fill="#222">เมื่อร้อนจัดและปากใบปิด O₂ ในใบสูง รูบิสโกจับ O₂ แทน CO₂ เกิดการหายใจแสง</text>
</svg>