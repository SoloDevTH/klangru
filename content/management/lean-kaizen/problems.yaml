    solution: "การเปลี่ยนหน้าจอให้ใช้งานได้คือสิ่งที่ลูกค้าจ่ายเงินซื้อ จึงเป็นงานเพิ่มคุณค่า ส่วนการรอ การเดินหาเครื่องมือ และการซ่อมซ้ำเป็นความสูญเปล่า"
