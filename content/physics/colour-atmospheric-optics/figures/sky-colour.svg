<text x="460.0" y="95.0" text-anchor="start" fill="#1f5fa8" font-size="12">ขอบบรรยากาศ</text>
<circle cx="310.0" cy="154.0" r="6.0" fill="#15211e" stroke="#15211e" stroke-width="1"/>
<text x="322.0" y="176.0" text-anchor="start" fill="#15211e" font-size="12">ผู้สังเกต</text>
<line x1="310.0" y1="20.0" x2="310.0" y2="135.0" stroke="#e0a100" stroke-width="3"/>
<polygon points="310.0,146.0 315.5,135.0 304.5,135.0" fill="#e0a100" stroke="#e0a100" stroke-width="1" stroke-linejoin="round"/>
<text x="318.0" y="40.0" text-anchor="start" fill="#15211e" font-size="13">เที่ยง: ผ่านอากาศสั้น</text>
<text x="318.0" y="58.0" text-anchor="start" fill="#777" font-size="12">ฟ้าเป็นสีฟ้า ดวงอาทิตย์ขาวอมเหลือง</text>
<line x1="15.0" y1="152.0" x2="289.0" y2="152.0" stroke="#e65100" stroke-width="3"/>
