  - ระบุประเภทการว่างงานก่อน แล้วเลือกนโยบายที่ตรงสาเหตุ
  solution: คนตกงานพร้อมกับงานที่หาคนไม่ได้ แสดงว่าทักษะไม่ตรงกับงาน คือการว่างงานเชิงโครงสร้าง แก้ตรงจุดด้วยการฝึกทักษะใหม่และจับคู่คนกับงาน ส่วนการกระตุ้นการใช้จ่ายเหมาะกับการว่างงานตามวัฏจักรเศรษฐกิจ
