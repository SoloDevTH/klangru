problems:
  - id: earthscience.atmosphere.weather-forecasting.p001
    topics: [earthscience.atmosphere.weather-forecasting]
    difficulty: 1
    type: match
    stem: "จับคู่เครื่องมือกับสิ่งที่วัด"
    pairs:
      - { left: "เทอร์โมมิเตอร์", right: "อุณหภูมิอากาศ" }
      - { left: "บารอมิเตอร์", right: "ความกดอากาศ" }
      - { left: "ไฮกรอมิเตอร์", right: "ความชื้นของอากาศ" }
      - { left: "เครื่องวัดน้ำฝน", right: "ปริมาณฝนเป็นมิลลิเมตร" }
      - { left: "อะนิโมมิเตอร์", right: "อัตราเร็วลม" }
    hints:
      - "บาโร เกี่ยวกับความดัน ไฮโกร เกี่ยวกับความชื้น"
      - "อะนิโมมิเตอร์มีถ้วยหมุนตามแรงลม"
    solution: "เทอร์โมมิเตอร์วัดอุณหภูมิ บารอมิเตอร์วัดความกดอากาศ ไฮกรอมิเตอร์วัดความชื้น เครื่องวัดน้ำฝนวัดปริมาณฝน และอะนิโมมิเตอร์วัดอัตราเร็วลม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.weather-forecasting.p002
    topics: [earthscience.atmosphere.weather-forecasting]
    difficulty: 1
    type: text
    stem: "หน่วยงานของรัฐที่ออกคำพยากรณ์อากาศและประกาศเตือนพายุของประเทศไทย และมีสายด่วน 1182 ชื่อว่าอะไร"
    accepted: ["กรมอุตุนิยมวิทยา", "กรมอุตุ", "กรมอุตุฯ", "Thai Meteorological Department", "TMD"]
    misconceptions:
      - { match: "กรมป้องกันและบรรเทาสาธารณภัย", feedback: "กรมป้องกันและบรรเทาสาธารณภัยช่วยเหลือเมื่อเกิดภัย (สายด่วน 1784) แต่ผู้ออกคำพยากรณ์อากาศคือกรมอุตุนิยมวิทยา" }
    hints:
      - "อุตุนิยมวิทยา คือวิชาที่ศึกษาลมฟ้าอากาศ"
      - "ชื่อขึ้นต้นด้วยคำว่า กรม"
    solution: "กรมอุตุนิยมวิทยา ออกคำพยากรณ์อากาศ ประกาศเตือนพายุ และให้ข้อมูลทางสายด่วน 1182"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.weather-forecasting.p003
    topics: [earthscience.atmosphere.weather-forecasting]
    difficulty: 1
    type: mcq
    stem: "นักเรียนเล่นฟุตบอลอยู่กลางสนาม ได้ยินเสียงฟ้าร้องและเห็นฟ้าแลบ ควรทำอย่างไร"
    choices:
      - { id: a, text: "รีบเข้าไปในอาคารที่แข็งแรงหรือรถยนต์ที่ปิดมิดชิด", correct: true }
      - { id: b, text: "หลบใต้ต้นไม้ใหญ่ที่อยู่กลางสนาม", feedback: "ต้นไม้สูงโดดเดี่ยวมักถูกฟ้าผ่า กระแสไฟฟ้าวิ่งผ่านมาถึงคนที่อยู่ใต้ต้นไม้ได้" }
      - { id: c, text: "เล่นต่อจนกว่าฝนจะตก", feedback: "ฟ้าผ่าเกิดได้ก่อนฝนตก ได้ยินเสียงฟ้าร้องแปลว่าอยู่ใกล้พอที่ฟ้าจะผ่าได้" }
      - { id: d, text: "ยืนชูร่มด้ามเหล็กกลางสนาม", feedback: "การยืนเป็นจุดสูงสุดกลางที่โล่งและถือโลหะยิ่งเสี่ยงถูกฟ้าผ่า" }
    hints:
      - "ฟ้าผ่ามักลงที่จุดสูงในที่โล่ง"
      - "ที่หลบที่ปลอดภัยต้องปิดล้อมมิดชิด"
    solution: "ควรเข้าอาคารที่แข็งแรงหรือรถยนต์ที่ปิดหน้าต่าง อยู่ห่างต้นไม้สูง เสาไฟ และที่โล่ง จนเสียงฟ้าร้องหายไปสักระยะ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.weather-forecasting.p004
    topics: [earthscience.atmosphere.weather-forecasting]
    difficulty: 2
    type: numeric
    stem: "นักเรียนบันทึกปริมาณฝนจากเครื่องวัดน้ำฝนที่โรงเรียน 3 วัน ได้ 12 มิลลิเมตร 25.5 มิลลิเมตร และ 8 มิลลิเมตร ปริมาณฝนรวม 3 วันเท่ากับกี่มิลลิเมตร"
    answer: { value: 45.5, tolerance: 0.05, unit: mm }
    misconceptions:
      - { match: 15.17, feedback: "หาค่าเฉลี่ยต่อวัน แต่โจทย์ถามปริมาณฝนรวม" }
    hints:
      - "ปริมาณฝนรวมคือนำค่าแต่ละวันมาบวกกัน"
      - "$12 + 25.5 + 8$"
    solution: "$12 + 25.5 + 8 = 45.5$ มิลลิเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.weather-forecasting.p005
    topics: [earthscience.atmosphere.weather-forecasting]
    difficulty: 2
    type: numeric
    stem: "อากาศก้อนหนึ่งมีไอน้ำ $12\\ \\mathrm{g/m^3}$ แต่ที่อุณหภูมินั้นรับไอน้ำได้มากที่สุด $20\\ \\mathrm{g/m^3}$ ความชื้นสัมพัทธ์เท่ากับร้อยละเท่าใด"
    answer: { value: 60, tolerance: 0.5, unit: "%" }
    misconceptions:
      - { match: 166.7, feedback: "นำค่าที่รับได้มากที่สุดเป็นตัวตั้ง ความชื้นสัมพัทธ์ต้องไม่เกินร้อยละ 100 ให้ใช้ไอน้ำที่มีจริงเป็นตัวตั้ง" }
      - { match: 8, feedback: "8 คือผลต่าง $20 - 12$ ต้องหาร ไม่ใช่ลบ" }
    hints:
      - "ความชื้นสัมพัทธ์ $=$ ไอน้ำที่มีจริง $\\div$ ไอน้ำที่รับได้มากที่สุด $\\times 100$"
      - "$12 \\div 20 \\times 100$"
    solution: "$\\dfrac{12}{20} \\times 100 = 60\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.weather-forecasting.p006
    topics: [earthscience.atmosphere.weather-forecasting]
    difficulty: 2
    type: mcq
    stem: "กรมอุตุนิยมวิทยารายงานว่าพายุลูกหนึ่งในทะเลจีนใต้มีลมสูงสุดใกล้ศูนย์กลาง 90 กิโลเมตรต่อชั่วโมง พายุลูกนี้เป็นพายุชนิดใด"
    choices:
      - { id: a, text: "พายุโซนร้อน", correct: true }
      - { id: b, text: "พายุดีเปรสชัน", feedback: "ดีเปรสชันมีลมสูงสุดต่ำกว่า 63 km/h แต่พายุนี้มี 90 km/h" }
      - { id: c, text: "ไต้ฝุ่น", feedback: "ไต้ฝุ่นต้องมีลมสูงสุดตั้งแต่ 118 km/h ขึ้นไป" }
      - { id: d, text: "พายุฝนฟ้าคะนอง", feedback: "พายุฝนฟ้าคะนองเป็นพายุขนาดเล็ก ไม่ได้แบ่งชนิดตามลมสูงสุดใกล้ศูนย์กลาง" }
    hints:
      - "ดีเปรสชันต่ำกว่า 63 km/h ไต้ฝุ่นตั้งแต่ 118 km/h"
      - "90 อยู่ในช่วงใด"
    solution: "90 km/h อยู่ในช่วง 63–117 km/h จึงเป็นพายุโซนร้อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.weather-forecasting.p007
    topics: [earthscience.atmosphere.weather-forecasting]
    difficulty: 2
    type: numeric
    stem: "เห็นฟ้าแลบแล้วนับได้ 6 วินาทีจึงได้ยินเสียงฟ้าร้อง ถ้าเสียงเดินทางในอากาศ 340 เมตรต่อวินาที ฟ้าผ่าอยู่ห่างประมาณกี่กิโลเมตร"
    answer: { value: 2.04, tolerance: 0.03, unit: km }
    misconceptions:
      - { match: 2040, feedback: "2,040 คือระยะเป็นเมตร โจทย์ถามเป็นกิโลเมตร ให้หารด้วย 1,000" }
      - { match: 56.7, feedback: "นำ 340 หารด้วย 6 ระยะทางคืออัตราเร็วคูณเวลา" }
    hints:
      - "ระยะทาง = อัตราเร็ว × เวลา"
      - "แสงมาถึงแทบทันที เวลาที่นับจึงเป็นเวลาที่เสียงใช้เดินทาง"
    solution: "$340 \\times 6 = 2{,}040$ เมตร $\\approx 2.04$ กิโลเมตร ใกล้พอที่ฟ้าจะผ่ามาถึงได้ ควรเข้าที่หลบทันที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.weather-forecasting.p008
    topics: [earthscience.atmosphere.weather-forecasting]
    difficulty: 3
    type: mcq
    stem: "กราฟแสดงข้อมูลอากาศตอนเช้าของสถานีหนึ่งตั้งแต่วันจันทร์ถึงวันศุกร์ (ข้อมูลสมมติ) ถ้าแนวโน้มยังเป็นเช่นนี้ วันเสาร์น่าจะมีลมฟ้าอากาศแบบใด"
    figure: { src: p-weather-data.svg, alt: "กราฟเส้นสองเส้น วันจันทร์ถึงวันศุกร์ เส้นทึบสีน้ำเงินคือความกดอากาศ 1010, 1008, 1006, 1003 และ 1000 hPa ตามลำดับ เส้นประสีแดงคือความชื้นสัมพัทธ์ 62, 68, 75, 82 และ 88 เปอร์เซ็นต์ ตามลำดับ" }
    choices:
      - { id: a, text: "มีเมฆมาก มีโอกาสเกิดฝนหรือพายุ", correct: true }
      - { id: b, text: "ท้องฟ้าแจ่มใส อากาศแห้งและเย็น", feedback: "อากาศแจ่มใสและแห้งมักมากับความกดอากาศสูงขึ้นและความชื้นลดลง ซึ่งตรงข้ามกับกราฟ" }
      - { id: c, text: "ไม่สามารถคาดการณ์ได้เลย", feedback: "ข้อมูลแสดงแนวโน้มชัดเจนพอจะคาดการณ์อย่างง่ายได้ แม้ไม่แน่นอนร้อยเปอร์เซ็นต์" }
      - { id: d, text: "อุณหภูมิจะต่ำกว่าจุดเยือกแข็ง", feedback: "กราฟไม่ได้แสดงอุณหภูมิ และความกดอากาศต่ำไม่ได้แปลว่าอากาศหนาวจัด" }
    hints:
      - "ความกดอากาศลดลงหรือเพิ่มขึ้น"
      - "บริเวณความกดอากาศต่ำ อากาศลอยตัวขึ้นแล้วเย็นตัว"
    solution: "ความกดอากาศลดลงต่อเนื่องจาก 1,010 เหลือ 1,000 hPa และความชื้นสัมพัทธ์เพิ่มจาก 62% เป็น 88% แสดงว่าอากาศชื้นและมีหย่อมความกดอากาศต่ำเข้ามา อากาศลอยตัวขึ้นเกิดเมฆ จึงมีโอกาสฝนตกหรือมีพายุ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.weather-forecasting.p009
    topics: [earthscience.atmosphere.weather-forecasting]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดเปรียบเทียบพายุฝนฟ้าคะนองกับพายุหมุนเขตร้อนได้ถูกต้อง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "พายุหมุนเขตร้อนกว้างหลายร้อยกิโลเมตร ส่วนพายุฝนฟ้าคะนองกว้างหลายกิโลเมตร", correct: true }
      - { id: b, text: "พายุหมุนเขตร้อนอยู่ได้หลายวัน ส่วนพายุฝนฟ้าคะนองมักเกิดนานราว 1–2 ชั่วโมง", correct: true }
      - { id: c, text: "พายุหมุนเขตร้อนได้พลังงานจากไอน้ำที่ระเหยจากทะเลอุ่นแล้วควบแน่น", correct: true }
      - { id: d, text: "พายุฝนฟ้าคะนองเกิดได้เฉพาะเหนือทะเลเท่านั้น", feedback: "พายุฝนฟ้าคะนองเกิดบนพื้นดินได้บ่อย เช่น พายุฤดูร้อนในภาคเหนือและอีสาน" }
      - { id: e, text: "ในซีกโลกเหนือ พายุหมุนเขตร้อนหมุนตามเข็มนาฬิกา", feedback: "ในซีกโลกเหนือลมหมุนทวนเข็มนาฬิกาเข้าหาศูนย์กลาง" }
    hints:
      - "นึกถึงภาพเมฆพายุไต้ฝุ่นจากดาวเทียม เทียบกับเมฆฝนฟ้าคะนองก้อนเดียว"
      - "พายุหมุนเขตร้อนอ่อนกำลังเมื่อขึ้นฝั่ง เพราะอะไร"
    solution: "พายุหมุนเขตร้อนใหญ่กว่าและอยู่นานกว่ามาก ได้พลังงานจากไอน้ำของทะเลอุ่น และหมุนทวนเข็มนาฬิกาในซีกโลกเหนือ ส่วนพายุฝนฟ้าคะนองเกิดได้ทั้งบนบกและในทะเล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.weather-forecasting.p010
    topics: [earthscience.atmosphere.weather-forecasting]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการเกิดพายุหมุนเขตร้อน"
    items:
      - "น้ำทะเลเขตร้อนอุ่นมาก ไอน้ำระเหยขึ้นสู่อากาศจำนวนมาก"
      - "อากาศร้อนชื้นลอยตัวขึ้น ไอน้ำควบแน่นเป็นเมฆ และปล่อยความร้อนออกมา"
      - "ความกดอากาศที่ผิวน้ำลดต่ำลง อากาศรอบข้างไหลเข้าแทนที่"
      - "การหมุนของโลกทำให้ลมที่ไหลเข้าหมุนเป็นวง เกิดพายุดีเปรสชัน"
      - "ได้ไอน้ำเติมต่อเนื่อง ลมแรงขึ้นเป็นพายุโซนร้อนและไต้ฝุ่น"
    hints:
      - "เริ่มจากแหล่งพลังงานคือทะเลอุ่น"
      - "พายุมีชื่อเรียกเปลี่ยนไปเมื่อลมแรงขึ้น"
    solution: "ทะเลอุ่นให้ไอน้ำ → อากาศชื้นลอยตัว ควบแน่น ปล่อยความร้อน → ความกดอากาศต่ำลง อากาศไหลเข้า → โลกหมุนทำให้ลมหมุนเป็นวง เป็นดีเปรสชัน → ได้พลังงานต่อเนื่องจนเป็นพายุโซนร้อนและไต้ฝุ่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.weather-forecasting.p011
    topics: [earthscience.atmosphere.weather-forecasting]
    difficulty: 3
    type: numeric
    stem: "ฝนตกบนนาข้าวขนาด 1 ไร่ (1,600 ตารางเมตร) วัดได้ 50 มิลลิเมตร ถ้าน้ำฝนขังอยู่ในนาทั้งหมด น้ำฝนมีปริมาตรกี่ลูกบาศก์เมตร"
    answer: { value: 80, tolerance: 0.5, unit: m³ }
    misconceptions:
      - { match: 80000, feedback: "นำ 50 มิลลิเมตรคูณพื้นที่ตรง ๆ ต้องแปลง 50 มิลลิเมตรเป็น 0.05 เมตรก่อน" }
      - { match: 8000, feedback: "แปลง 50 มิลลิเมตรเป็น 5 เมตร ซึ่งผิด 50 มิลลิเมตร $= 5$ เซนติเมตร $= 0.05$ เมตร" }
    hints:
      - "ปริมาตร = พื้นที่ × ความสูงของน้ำ"
      - "1 เมตร = 1,000 มิลลิเมตร"
    solution: "50 มิลลิเมตร $= 0.05$ เมตร ปริมาตร $= 1{,}600 \\times 0.05 = 80$ ลูกบาศก์เมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.weather-forecasting.p012
    topics: [earthscience.atmosphere.weather-forecasting]
    difficulty: 3
    type: mcq
    stem: "คำพยากรณ์อากาศของกรุงเทพมหานครวันพรุ่งนี้ว่า \"มีฝนฟ้าคะนองร้อยละ 60 ของพื้นที่\" ข้อใดตีความถูกต้อง"
    choices:
      - { id: a, text: "คาดว่าฝนจะตกประมาณ 60 ใน 100 ส่วนของพื้นที่กรุงเทพฯ บางเขตอาจไม่มีฝน", correct: true }
      - { id: b, text: "ฝนจะตกรวม 60 มิลลิเมตร", feedback: "ตัวเลขนี้เป็นร้อยละของพื้นที่ ไม่ใช่ปริมาณฝน" }
