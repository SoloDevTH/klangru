      - "นับลูกศรที่ออกจากค่าทางซ้ายแต่ละตัว ลูกศรที่ชี้เข้าค่าเดียวกันทางขวาไม่ใช่ปัญหา"
    solution: "A: 1, 2, 3 มีลูกศรออกตัวละหนึ่งเส้น จึงเป็นฟังก์ชัน (1 กับ 2 ไปที่ 5 ร่วมกันได้) · B: 1 มีลูกศรออกสองเส้นไป 5 และ 7 จึงไม่เป็นฟังก์ชัน"
