id: health.movement.biomechanics-concepts
subject: health
title: { th: "หลักการเคลื่อนไหว: การรับแรง การใช้แรง และความสมดุล", en: "Movement principles: absorbing force, applying force and balance" }
summary: การรับแรงโดยงอข้อต่อและยืดเวลาหยุด การส่งแรงต่อเนื่องจากขาสู่แขน จุดศูนย์ถ่วงกับฐานรองรับ ความคิดรวบยอดเกี่ยวกับการเคลื่อนไหว และการเปรียบเทียบวิธีเคลื่อนไหวจากข้อมูล
difficulty: 3
minutes: 35
prerequisites: [physics.dynamics.forces-intro]
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: จุดศูนย์ถ่วงและฐานรองรับ
    src: balance-stances.svg
    alt: "ภาพคนสามท่า ท่าแรกยืนเท้าชิดตัวตรง ฐานรองรับแคบ จุดศูนย์ถ่วงสูง ล้มง่ายที่สุด ท่าที่สองยืนแยกเท้าตัวตรง ฐานกว้างขึ้น จุดศูนย์ถ่วงสูงเท่าเดิม มั่นคงขึ้น ท่าที่สามแยกเท้าเท่าท่าที่สองและย่อเข่า ฐานกว้าง จุดศูนย์ถ่วงต่ำลง มั่นคงที่สุด ทุกท่ามีเส้นประแนวดิ่งจากจุดศูนย์ถ่วงตกลงกลางฐานรองรับ"
    caption: "ฐานกว้างขึ้นและจุดศูนย์ถ่วงต่ำลง ทำให้มั่นคงขึ้น"
  - type: worked-example
    title: รับลูกบอลแรง ๆ ให้ไม่เจ็บมือ
    problem: "ลูกบอลมวล 0.5 กิโลกรัม พุ่งมาด้วยอัตราเร็ว 8 เมตรต่อวินาที ถ้ารับแบบแขนแข็งลูกจะหยุดใน 0.02 วินาที แต่ถ้าดึงมือเข้าหาตัวลูกจะหยุดใน 0.1 วินาที แรงเฉลี่ยที่มือรับต่างกันอย่างไร"
    steps:
      - text: "หาโมเมนตัมของลูก: $mv = 0.5 \\times 8 = 4\\,\\mathrm{kg\\cdot m/s}$"
      - text: "แขนแข็ง: $\\bar F = 4 \\div 0.02 = 200\\,\\mathrm{N}$"
      - text: "ดึงมือเข้าหาตัว: $\\bar F = 4 \\div 0.1 = 40\\,\\mathrm{N}$"
        why: "โมเมนตัมเท่าเดิม แต่เวลาหยุดนานขึ้น 5 เท่า แรงจึงลดลงเหลือ 1 ใน 5"
      - text: "สรุป: การงอแขนยุบตามแรงทำให้แรงกระแทกเฉลี่ยลดลงจาก 200 เหลือ 40 นิวตัน"
    answer: "แขนแข็งรับแรงเฉลี่ย 200 N ส่วนการดึงมือเข้าหาตัวรับเพียง 40 N"
  - { type: check, problem: health.movement.biomechanics-concepts.p004, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: figure
    title: ส่งแรงต่อเนื่องจากขาถึงมือ
    src: force-chain.svg
    alt: "ผังห้าช่องเรียงจากซ้ายไปขวา 1 เท้าและขา ถีบพื้น ก้าวเท้า 2 สะโพก หมุนไปทางเป้า 3 ลำตัว บิดตาม 4 ไหล่และแขน เหวี่ยงแขน 5 ข้อมือ สะบัดปล่อยลูก ด้านล่างเขียนว่าส่วนที่ใหญ่และแข็งแรงเริ่มก่อน แล้วส่งต่อตามลำดับ จังหวะต่อเนื่อง แรงจึงรวมกันได้มากที่สุด"
  - type: worked-example
    title: เหวี่ยงแขนช่วยให้กระโดดไกลขึ้นหรือไม่
    problem: "ครูให้นักเรียน 5 คนยืนกระโดดไกลแบบไม่เหวี่ยงแขนและแบบเหวี่ยงแขน ผลแสดงในแผนภูมิ แบบเหวี่ยงแขนไกลกว่าโดยเฉลี่ยกี่เซนติเมตร และคิดเป็นร้อยละเท่าไร"
    figure:
      src: jump-data.svg
      alt: "แผนภูมิแท่งระยะยืนกระโดดไกลเป็นเซนติเมตร ของนักเรียน 5 คน แบบไม่เหวี่ยงแขนและแบบเหวี่ยงแขน ต้น 150 และ 168 ฝน 132 และ 145 เก่ง 160 และ 181 มายด์ 140 และ 152 บอส 148 และ 164"
    steps:
      - text: "ค่าเฉลี่ยไม่เหวี่ยงแขน: (150 + 132 + 160 + 140 + 148) ÷ 5 = 730 ÷ 5 = 146 เซนติเมตร"
      - text: "ค่าเฉลี่ยเหวี่ยงแขน: (168 + 145 + 181 + 152 + 164) ÷ 5 = 810 ÷ 5 = 162 เซนติเมตร"
      - text: "ต่างกัน 162 − 146 = 16 เซนติเมตร"
      - text: "ร้อยละที่เพิ่มขึ้น = 16 ÷ 146 × 100 ≈ 11"
        why: "หารด้วยค่าเดิม (แบบไม่เหวี่ยงแขน) เพราะถามว่าเพิ่มจากเดิมเท่าไร"
      - text: "ทุกคนไกลขึ้นเมื่อเหวี่ยงแขน แสดงว่าการส่งแรงจากแขนร่วมกับขาช่วยได้จริง"
    answer: "ไกลขึ้นเฉลี่ย 16 เซนติเมตร หรือประมาณร้อยละ 11"
  - { type: check, problem: health.movement.biomechanics-concepts.p007 }
glossary:
  - { term: จุดศูนย์ถ่วง, definition: "จุดที่เสมือนเป็นที่รวมน้ำหนักทั้งหมดของร่างกายหรือวัตถุ" }
  - { term: ฐานรองรับ, definition: "พื้นที่ใต้ส่วนของร่างกายที่แตะพื้น รวมกับช่องว่างระหว่างส่วนเหล่านั้น" }
  - { term: การรับแรง, definition: "การลดแรงกระแทกโดยงอข้อต่อ ยืดเวลาหยุด และกระจายแรงไปบนพื้นที่กว้าง" }
  - { term: การส่งแรงต่อเนื่อง, definition: "การใช้แรงจากส่วนใหญ่ไปส่วนเล็กตามลำดับ เช่น ขา สะโพก ลำตัว แขน ข้อมือ" }
  - { term: โมเมนตัม, definition: "ผลคูณของมวลกับความเร็ว ยิ่งมากยิ่งหยุดยาก" }
flashcards:
  - { front: "ทำอย่างไรให้มั่นคงขึ้น", back: "ขยายฐานรองรับ ลดจุดศูนย์ถ่วงให้ต่ำ และให้แนวดิ่งจากจุดศูนย์ถ่วงอยู่ในฐาน" }
  - { front: "รับแรงให้ปลอดภัยทำอย่างไร", back: "งอข้อต่อยุบตามแรง ยืดเวลาหยุด และกระจายแรงไปบนพื้นที่กว้าง" }
  - { front: "ลำดับการส่งแรงเมื่อขว้างลูก", back: "ขา → สะโพก → ลำตัว → ไหล่และแขน → ข้อมือ" }
  - { front: "แรงเฉลี่ยเมื่อหยุดวัตถุ", back: "โมเมนตัม (mv) หารด้วยเวลาที่ใช้หยุด เวลานานขึ้น แรงน้อยลง" }
