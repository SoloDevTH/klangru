# - หัวข้อที่เสนอบางส่วนอาจซ้อนกับตัวชี้วัดรายวิชาพื้นฐาน (ว 1.x–ว 3.x ม.4–6) ซึ่งผู้รับผิดชอบหลักสูตรแกนกลางจะเสนอแยก
#   ควรรวมเป็นหัวข้อเดียวก่อนลงมือเขียน
topics:
