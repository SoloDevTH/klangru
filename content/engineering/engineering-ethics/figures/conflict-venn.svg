<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540" width="700" height="540" font-family="sans-serif" font-size="14">
<title>แผนภาพวงกลมแสดงความขัดแย้งทางผลประโยชน์</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15211e"/></marker></defs>
<rect x="0" y="0" width="700" height="540" fill="#ffffff"/>
<text x="350.0" y="34.0" text-anchor="middle" font-size="16" fill="#15211e" font-weight="bold">ความขัดแย้งทางผลประโยชน์ของวิศวกร</text>
<circle cx="245.0" cy="260.0" r="118.0" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="2.5"/>
<circle cx="455.0" cy="260.0" r="118.0" fill="#fff3e0" stroke="#b35c00" stroke-width="2.5"/>
<circle cx="350.0" cy="370.0" r="118.0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
<text x="170.0" y="112.0" text-anchor="middle" font-size="14" fill="#1f5f8b" font-weight="bold">หน้าที่ต่อสาธารณะ</text>
<text x="530.0" y="112.0" text-anchor="middle" font-size="14" fill="#b35c00" font-weight="bold">ผลประโยชน์ส่วนตัว</text>
<text x="350.0" y="508.0" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">หน้าที่ต่อนายจ้างหรือลูกค้า</text>
<text x="350.0" y="300.0" text-anchor="middle" font-size="14" fill="#15211e" font-weight="bold">ความขัดแย้ง</text>
<text x="350.0" y="318.0" text-anchor="middle" font-size="12" fill="#15211e">ต้องเปิดเผยและจัดการ</text>
<text x="190.0" y="214.0" text-anchor="middle" font-size="12" fill="#15211e">การตัดสินใจ</text>
<text x="190.0" y="230.0" text-anchor="middle" font-size="12" fill="#15211e">ที่ต้องเที่ยงธรรม</text>
<text x="520.0" y="214.0" text-anchor="middle" font-size="12" fill="#15211e">การรับของขวัญ</text>
<text x="520.0" y="230.0" text-anchor="middle" font-size="12" fill="#15211e">หรือหุ้นในบริษัท</text>
<text x="350.0" y="430.0" text-anchor="middle" font-size="12" fill="#15211e">งานที่มีคนอื่นเสี่ยง</text>
<text x="350.0" y="446.0" text-anchor="middle" font-size="12" fill="#15211e">ต้องถอนตัวหรือแจ้ง</text>
<text x="350.0" y="528.0" text-anchor="middle" font-size="12" fill="#555555">หน้าที่ต่อความปลอดภัยของสาธารณะอยู่เหนือทุกวงกลม</text>
</svg>
