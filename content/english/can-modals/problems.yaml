problems:
  - id: english.grammar.can-modals.p001
    topics: [english.grammar.can-modals]
    difficulty: 1
    type: mcq
    stem: "เลือกคำที่ถูกต้อง: *I ___ swim.* (ฉันว่ายน้ำได้)"
    choices:
      - { id: a, text: "can", correct: true, feedback: "ถูก can + กริยารูปเดิม" }
      - { id: b, text: "can to", feedback: "หลัง can ไม่มี to" }
      - { id: c, text: "cans", feedback: "can ไม่เติม s" }
      - { id: d, text: "am can", feedback: "ไม่ใช้ am กับ can" }
    hints:
      - "ว่ายน้ำได้ = บอกความสามารถ"
      - "modal + กริยารูปเดิม ไม่มีคำอื่นแทรก"
    solution: "*I **can** swim.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.can-modals.p002
    topics: [english.grammar.can-modals]
    difficulty: 1
    type: text
    stem: "เติมคำให้ได้ความว่า **เธอขี่จักรยานไม่เป็น**: *She ___ ride a bike.*"
    accepted: ["can't", "cannot", "can not"]
    misconceptions:
      - { match: "doesn't can", feedback: "modal ไม่ใช้ do/does ปฏิเสธใส่ not หลัง can: can't" }
      - { match: "don't can", feedback: "modal ไม่ใช้ do ปฏิเสธใส่ not หลัง can: can't" }
      - { match: "can", feedback: "ประโยคนี้เป็นปฏิเสธ ต้องเป็น can't" }
      - { match: "not can", feedback: "not วางหลัง can: cannot (can't)" }
    hints:
      - "ไม่เป็น ไม่ได้ = ปฏิเสธของ can"
      - "ปฏิเสธของ modal ใส่ not หลัง modal"
    solution: "*She **can't** (cannot) ride a bike.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.can-modals.p003
    topics: [english.grammar.can-modals]
    difficulty: 2
    type: mcq
    stem: "ครูกำลังสอนอยู่ นักเรียนมาสายยืนที่ประตู ควรพูดว่าอะไร"
    choices:
      - { id: a, text: "May I come in?", correct: true, feedback: "ถูก May I ...? ขออนุญาตอย่างสุภาพ" }
      - { id: b, text: "Can I to come in?", feedback: "หลัง can ไม่มี to: Can I come in?" }
      - { id: c, text: "Do I come in?", feedback: "Do I come in? ไม่ใช่การขออนุญาต" }
      - { id: d, text: "Come in!", feedback: "เป็นคำสั่ง ซึ่งครูเป็นคนพูด ไม่ใช่นักเรียน" }
    hints:
      - "นักเรียนต้องขออนุญาต"
      - "ขออนุญาตอย่างสุภาพใช้ May I ...?"
    solution: "**May I come in?** (Can I come in? ก็ได้ แต่ May สุภาพกว่า)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.can-modals.p004
    topics: [english.grammar.can-modals]
    difficulty: 2
    type: text
    stem: "เติมกริยาในรูปที่ถูกต้อง: *He can ___ (play) the guitar.*"
    accepted: ["play"]
    misconceptions:
      - { match: "plays", feedback: "หลัง can ใช้กริยารูปเดิม ไม่เติม s แม้ประธานเป็น he" }
      - { match: "to play", feedback: "หลัง can ไม่มี to" }
      - { match: "playing", feedback: "หลัง can ไม่เติม ing" }
    hints:
      - "modal + กริยารูปเดิม"
      - "แม้ประธานเป็น he ก็ไม่เติม s หลัง can"
    solution: "*He can **play** the guitar.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.can-modals.p005
    topics: [english.grammar.can-modals]
    difficulty: 2
    type: match
    stem: "จับคู่ประโยคกับหน้าที่ของประโยค"
    pairs:
      - { left: "I can speak Chinese.", right: "บอกความสามารถ" }
      - { left: "May I use your pen?", right: "ขออนุญาต" }
      - { left: "Could you help me, please?", right: "ขอร้อง" }
      - { left: "You should drink more water.", right: "ให้คำแนะนำ" }
      - { left: "You must wear a uniform.", right: "บอกกฎ" }
    hints:
      - "May I ... ขอทำเอง ส่วน Could you ... ขอให้คนอื่นทำ"
      - "should = ควร must = ต้อง"
    solution: "can = ความสามารถ · May I = ขออนุญาต · Could you = ขอร้อง · should = คำแนะนำ · must = กฎ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.can-modals.p006
    topics: [english.grammar.can-modals]
    difficulty: 2
    type: mcq
    stem: "ป้ายนี้ติดอยู่หน้าห้องสมุด ประโยคใดอธิบายป้ายได้ถูกต้อง"
    figure: { src: no-food-sign.svg, alt: "ป้ายวงกลมขอบแดงมีเส้นแดงขีดทับเฉียง ข้างในมีรูปแก้วน้ำมีหลอดและแฮมเบอร์เกอร์" }
    choices:
      - { id: a, text: "You mustn't eat or drink here.", correct: true, feedback: "ถูก วงกลมแดงมีเส้นขีดทับหมายถึงห้าม" }
      - { id: b, text: "You must eat or drink here.", feedback: "must แปลว่าต้อง ป้ายนี้หมายถึงห้าม" }
      - { id: c, text: "You can eat or drink here.", feedback: "can แปลว่าทำได้ แต่เส้นขีดทับหมายถึงห้าม" }
      - { id: d, text: "You don't have to eat here.", feedback: "don't have to แปลว่าไม่จำเป็น ไม่ได้แปลว่าห้าม" }
    hints:
      - "วงกลมแดงที่มีเส้นขีดทับหมายถึงอะไร"
      - "ห้าม = mustn't"
    solution: "ป้ายห้ามนำอาหารและเครื่องดื่ม: **You mustn't eat or drink here.**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.can-modals.p007
    topics: [english.grammar.can-modals]
    difficulty: 3
    type: text
    stem: "ตามกฎหมายไทย คนขี่และคนซ้อนรถจักรยานยนต์ **ต้อง** สวมหมวกนิรภัย เติมคำ: *You ___ wear a helmet when you ride a motorcycle.*"
    accepted: ["must", "have to"]
    misconceptions:
      - { match: "should", feedback: "should เป็นแค่คำแนะนำ แต่นี่เป็นกฎหมายที่ต้องทำ ใช้ must" }
      - { match: "can", feedback: "can แปลว่าทำได้ แต่กฎหมายบังคับให้ต้องทำ ใช้ must" }
      - { match: "must to", feedback: "หลัง must ไม่มี to" }
    hints:
      - "เป็นกฎหมาย ไม่ใช่คำแนะนำ"
      - "ต้อง = must"
    solution: "*You **must** wear a helmet when you ride a motorcycle.* (have to ก็ใช้ได้)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.can-modals.p008
    topics: [english.grammar.can-modals]
    difficulty: 3
    type: mcq
    stem: "เพื่อนบอกว่า *I have a fever.* (ฉันเป็นไข้) คำแนะนำใดถูกต้อง"
    choices:
      - { id: a, text: "You should see a doctor.", correct: true, feedback: "ถูก should + กริยารูปเดิม ใช้ให้คำแนะนำ" }
      - { id: b, text: "You should to see a doctor.", feedback: "หลัง should ไม่มี to" }
      - { id: c, text: "You mustn't see a doctor.", feedback: "mustn't แปลว่าห้าม ไม่สมเหตุสมผล" }
      - { id: d, text: "You can't see a doctor.", feedback: "can't แปลว่าไม่ได้ ไม่ใช่คำแนะนำ" }
    hints:
      - "ให้คำแนะนำใช้ should"
      - "หลัง should ใช้กริยารูปเดิมทันที"
    solution: "**You should see a doctor.** (ควรไปหาหมอ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.can-modals.p009
    topics: [english.grammar.can-modals]
    difficulty: 3
    type: text
    stem: "เติมคำปฏิเสธที่เหมาะกับป้ายสระว่ายน้ำ: *You ___ run near the pool. It's dangerous.*"
    accepted: ["mustn't", "must not", "shouldn't", "should not", "can't", "cannot"]
    misconceptions:
      - { match: "must", feedback: "must แปลว่าต้อง วิ่งรอบสระอันตราย ต้องใช้ปฏิเสธ mustn't" }
      - { match: "don't have to", feedback: "don't have to แปลว่าไม่จำเป็น ไม่ได้แปลว่าห้าม" }
      - { match: "don't", feedback: "You don't run ... แปลว่าคุณไม่วิ่ง (บอกเฉย ๆ) ถ้าจะบอกว่าห้ามใช้ mustn't" }
    hints:
      - "It's dangerous. บอกว่าไม่ควรหรือห้ามทำ"
      - "ปฏิเสธของ must, should, can ใส่ not หลัง modal"
    solution: "*You **mustn't** run near the pool.* (shouldn't หรือ can't ก็สื่อความได้) เพราะอันตราย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.can-modals.p010
    topics: [english.grammar.can-modals]
    difficulty: 3
    type: order
    stem: "เรียงคำให้เป็นคำขอร้องที่สุภาพ \"ช่วยเปิดหน้าต่างหน่อยได้ไหมคะ\""
    items: ["Could", "you", "open", "the window,", "please?"]
    hints:
      - "คำขอร้องขึ้นต้นด้วย Could"
      - "Could + you + กริยารูปเดิม + ... + please?"
    solution: "*Could you open the window, please?*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.can-modals.p011
    topics: [english.grammar.can-modals]
    difficulty: 4
    type: mcq
    stem: "วันเสาร์โรงเรียนจัดกิจกรรมพิเศษ จะใส่ชุดนักเรียนหรือชุดไปรเวทก็ได้ เติมคำ: *On Saturday, students ___ wear a uniform.*"
    choices:
      - { id: a, text: "don't have to", correct: true, feedback: "ถูก ไม่จำเป็นต้องใส่ ใส่ก็ได้ไม่ใส่ก็ได้" }
      - { id: b, text: "mustn't", feedback: "mustn't แปลว่าห้ามใส่ แต่โจทย์บอกว่าจะใส่ก็ได้" }
      - { id: c, text: "must", feedback: "must แปลว่าต้องใส่ แต่โจทย์บอกว่าเลือกได้" }
      - { id: d, text: "can't", feedback: "can't แปลว่าใส่ไม่ได้ แต่ใส่ได้" }
    hints:
      - "ใส่ก็ได้ ไม่ใส่ก็ได้ คือ ไม่จำเป็น"
      - "ห้าม = mustn't ส่วน ไม่จำเป็น = don't have to"
    solution: "เลือกได้ จึงใช้ **don't have to** (ไม่จำเป็นต้อง) ไม่ใช่ mustn't (ห้าม)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.can-modals.p012
    topics: [english.grammar.can-modals]
    difficulty: 4
    type: text
    stem: "เติมคำขึ้นต้นเพื่อขออนุญาตใช้โทรศัพท์ของเพื่อน: *___ I use your phone, please?*"
    accepted: ["Can", "May", "Could", "can", "may", "could"]
    misconceptions:
      - { match: "do", feedback: "Do I use ...? ไม่ใช่การขออนุญาต ใช้ Can/May/Could I ...?" }
      - { match: "should", feedback: "Should I ...? ถามคำแนะนำว่าควรทำไหม ไม่ใช่ขออนุญาต" }
      - { match: "must", feedback: "Must I ...? ถามว่าจำเป็นต้องทำไหม ไม่ใช่ขออนุญาต" }
    hints:
      - "ขออนุญาตทำบางอย่างเอง ใช้ modal + I"
      - "modal ที่ใช้ขออนุญาต: can, could, may"
    solution: "***Can** I use your phone, please?* (May I หรือ Could I สุภาพขึ้น)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.can-modals.p013
    topics: [english.grammar.can-modals]
    difficulty: 4
    type: mcq
    stem: "นักท่องเที่ยวหลงทางที่สถานีขนส่งหมอชิต อยากถามทางคนแปลกหน้าอย่างสุภาพ ควรพูดว่าอะไร"
    choices:
      - { id: a, text: "Excuse me. Could you tell me the way to the BTS station, please?", correct: true, feedback: "ถูก Excuse me + Could you ... please? สุภาพกับคนแปลกหน้า" }
      - { id: b, text: "Tell me the way to the BTS station.", feedback: "เป็นคำสั่ง ไม่สุภาพกับคนแปลกหน้า" }
      - { id: c, text: "You must tell me the way to the BTS station.", feedback: "must บังคับ ไม่เหมาะกับการขอความช่วยเหลือ" }
      - { id: d, text: "Can you telling me the way to the BTS station?", feedback: "หลัง can ใช้กริยารูปเดิม tell" }
    hints:
      - "ขอให้คนอื่นช่วย ใช้ Could you ...?"
      - "เริ่มด้วยคำเรียกความสนใจอย่างสุภาพ"
    solution: "**Excuse me. Could you tell me the way to the BTS station, please?**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.can-modals.p014
    topics: [english.grammar.can-modals]
    difficulty: 4
    type: mcq
    stem: "เพื่อนถาม *Can I borrow your eraser?* ถ้าจะให้ยืม ควรตอบว่าอะไร"
    choices:
      - { id: a, text: "Sure. Here you are.", correct: true, feedback: "ถูก ตอบรับและยื่นให้" }
      - { id: b, text: "Yes, you can't.", feedback: "Yes ขัดกับ can't ตอบรับใช้ Yes, you can." }
      - { id: c, text: "No, I can.", feedback: "No ขัดกับ I can และเพื่อนขอยืม ไม่ได้ถามความสามารถของเรา" }
      - { id: d, text: "Yes, I borrow.", feedback: "เพื่อนเป็นคนยืม เราเป็นคนให้ยืม และคำตอบไม่ถูกรูป" }
    hints:
      - "เพื่อนขออนุญาตยืม เราอนุญาต"
      - "คำตอบรับที่ใช้บ่อย: Sure. / Of course. / Yes, you can."
    solution: "**Sure. Here you are.** (หรือ Yes, you can.) ถ้าไม่ให้ยืมตอบ Sorry, I'm using it."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.can-modals.p015
    topics: [english.grammar.can-modals]
    difficulty: 5
    type: text
    stem: "แก้ประโยคให้ถูก แล้วพิมพ์ประโยคเต็ม: *She cans speak three languages.*"
    accepted:
      - "She can speak three languages."
      - "She can speak three languages"
      - "She can speak 3 languages."
      - "She can speak 3 languages"
    misconceptions:
      - { match: "She can speaks three languages.", feedback: "หลัง can ใช้กริยารูปเดิม speak" }
      - { match: "She can to speak three languages.", feedback: "หลัง can ไม่มี to" }
      - { match: "She cans to speak three languages.", feedback: "can ไม่เติม s และไม่มี to" }
    hints:
      - "modal ไม่เติม s แม้ประธานเป็น she"
      - "หลัง can ใช้กริยารูปเดิม"
    solution: "**She can speak three languages.** can ไม่เติม s และตามด้วยกริยารูปเดิม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.can-modals.p016
    topics: [english.grammar.can-modals]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "เลือกประโยคที่ **ถูกต้อง** ทั้งหมด"
    choices:
      - { id: a, text: "Students must not use phones during the exam.", correct: true }
      - { id: b, text: "You should drink water when it is hot.", correct: true }
      - { id: c, text: "Could you help me, please?", correct: true }
      - { id: d, text: "He musts finish his homework.", feedback: "must ไม่เติม s: He must finish his homework." }
      - { id: e, text: "Can you to come tomorrow?", feedback: "หลัง can ไม่มี to: Can you come tomorrow?" }
      - { id: f, text: "You don't should eat too much sugar.", feedback: "ปฏิเสธของ should ไม่ใช้ don't: You shouldn't eat too much sugar." }
    hints:
      - "ตรวจว่า modal เติม s หรือไม่ และมี to หลัง modal หรือไม่"
      - "ปฏิเสธของ modal ไม่ใช้ do"
    solution: "ถูก: Students must not use phones ... · You should drink water ... · Could you help me, please? ผิด: musts → must · Can you to come → Can you come · don't should → shouldn't"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.can-modals.p017
    topics: [english.grammar.can-modals]
    difficulty: 5
    type: mcq
    stem: "อ่านคำชี้แจงหน้าวัดแล้วตอบคำถาม\n\n*Welcome to the temple. Visitors must wear clothes that cover their shoulders and knees. You should take off your shoes before you go into the chapel. You mustn't point your feet at the Buddha image. You can take photos outside the chapel.*\n\nข้อใด **ห้ามทำ**"
    choices:
      - { id: a, text: "ชี้เท้าไปทางพระพุทธรูป", correct: true, feedback: "ถูก You mustn't point your feet at the Buddha image." }
      - { id: b, text: "ถ่ายรูปนอกพระอุโบสถ", feedback: "You can take photos outside ... แปลว่าทำได้" }
      - { id: c, text: "ใส่กางเกงขายาวและเสื้อมีแขน", feedback: "ข้อนี้คือสิ่งที่ต้องทำ (must wear clothes that cover ...)" }
      - { id: d, text: "ถอดรองเท้าก่อนเข้าพระอุโบสถ", feedback: "ข้อนี้คือคำแนะนำที่ควรทำ (should)" }
    hints:
      - "หาประโยคที่มี mustn't"
      - "point your feet at = ชี้เท้าไปทาง"
    solution: "*You **mustn't** point your feet at the Buddha image.* จึงห้าม **ชี้เท้าไปทางพระพุทธรูป** ส่วน must = ต้องทำ should = ควรทำ can = ทำได้"
    license: CC-BY-SA-4.0
    ai_assisted: true
