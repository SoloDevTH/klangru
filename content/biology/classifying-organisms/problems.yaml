    ai_assisted: true

  - id: biology.diversity.classifying-organisms.p013
    topics: [biology.diversity.classifying-organisms]
    difficulty: 4
    type: mcq
    stem: "ต้นจัดค้างคาวไว้กลุ่มเดียวกับนก เพราะ \"บินได้เหมือนกัน\" ข้อใดอธิบายว่าทำไมการจัดนี้ไม่ถูก"
    choices:
      - { id: a, text: "ค้างคาวมีขนเป็นเส้น ไม่มีขนนก และแม่เลี้ยงลูกด้วยน้ำนม จึงเป็นสัตว์เลี้ยงลูกด้วยน้ำนม", correct: true }
      - { id: b, text: "ค้างคาวไม่มีกระดูกสันหลัง จึงไม่ใช่นก", feedback: "ค้างคาวมีกระดูกสันหลัง ทั้งค้างคาวและนกเป็นสัตว์มีกระดูกสันหลัง" }
      - { id: c, text: "ค้างคาวบินตอนกลางคืน ส่วนนกบินตอนกลางวัน", feedback: "นกบางชนิด เช่น นกฮูก ออกหากินกลางคืน เวลาที่บินไม่ใช่เกณฑ์แบ่งกลุ่ม" }
      - { id: d, text: "จัดถูกแล้ว เพราะการบินได้คือลักษณะของนก", feedback: "แมลงก็บินได้แต่ไม่ใช่นก ลักษณะเฉพาะของนกคือขนนก" }
    hints:
      - "ลักษณะเฉพาะที่มีแต่นกเท่านั้นคืออะไร"
      - "ค้างคาวมีขนแบบไหน และเลี้ยงลูกอย่างไร"
    solution: "ลักษณะเฉพาะของนกคือขนนก ค้างคาวไม่มีขนนก แต่มีขนเป็นเส้น ออกลูกเป็นตัว และแม่เลี้ยงลูกด้วยน้ำนม ค้างคาวจึงเป็นสัตว์เลี้ยงลูกด้วยน้ำนม การบินได้เพียงอย่างเดียวจึงไม่พอใช้จัดกลุ่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.classifying-organisms.p014
    topics: [biology.diversity.classifying-organisms]
    difficulty: 4
    type: numeric
    stem: "นักเรียนสร้างกุญแจจำแนกแบบสองทาง (แต่ละข้อถามแล้วแยกได้สองทาง) เพื่อแยกสัตว์ 6 ชนิดออกจากกันจนครบ กุญแจนี้มีคำถามทั้งหมดกี่ข้อ"
    answer: { value: 5, unit: ข้อ }
    hints:
      - "ในบทเรียน สัตว์ 4 ชนิดใช้คำถาม 3 ข้อ"
      - "แต่ละคำถามแยกกลุ่มหนึ่งกลุ่มออกเป็นสองกลุ่ม ต้องแยกกี่ครั้งจึงจะได้ 6 กลุ่ม"
    misconceptions:
      - { match: 6, feedback: "ไม่ต้องถามหนึ่งข้อต่อสัตว์หนึ่งชนิด ตัวสุดท้ายเหลืออยู่เองโดยไม่ต้องถาม" }
      - { match: 3, feedback: "3 คือจำนวนข้อที่ตอบตามเส้นทางยาวที่สุดได้ แต่คำถามทั้งหมดในกุญแจมีมากกว่านั้น" }
    solution: "เริ่มจากกลุ่มเดียว แต่ละคำถามแยกกลุ่มหนึ่งเป็นสองกลุ่ม จำนวนกลุ่มจึงเพิ่มทีละ 1 จะได้ 6 กลุ่มต้องใช้ $6 - 1 = 5$ ข้อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.classifying-organisms.p015
    topics: [biology.diversity.classifying-organisms]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "ข้อใดใช้แยกสัตว์เลื้อยคลานออกจากสัตว์สะเทินน้ำสะเทินบกได้ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "สัตว์เลื้อยคลานผิวหนังแห้งและมีเกล็ด", correct: true }
      - { id: b, text: "สัตว์เลื้อยคลานวางไข่ที่มีเปลือกเหนียวบนบก", correct: true }
      - { id: c, text: "สัตว์เลื้อยคลานหายใจด้วยปอด", feedback: "กบตัวเต็มวัยก็หายใจด้วยปอด (และผิวหนัง) ข้อนี้จึงแยกสองกลุ่มไม่ได้" }
      - { id: d, text: "สัตว์เลื้อยคลานมีกระดูกสันหลัง", feedback: "สัตว์สะเทินน้ำสะเทินบกก็มีกระดูกสันหลัง" }
    hints:
      - "เลือกเฉพาะลักษณะที่สองกลุ่มต่างกัน"
      - "เทียบผิวหนังของจิ้งจกกับกบ และที่วางไข่ของเต่ากับกบ"
    solution: "สัตว์เลื้อยคลานผิวหนังแห้งมีเกล็ดและวางไข่เปลือกเหนียวบนบก ส่วนกบผิวหนังเปียกชื้น ไม่มีเกล็ด และวางไข่ในน้ำ ลักษณะที่ทั้งสองกลุ่มมีเหมือนกัน เช่น มีกระดูกสันหลังและหายใจด้วยปอด ใช้แยกไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.classifying-organisms.p016
    topics: [biology.diversity.classifying-organisms]
    difficulty: 5
    type: mcq
    stem: "ตุ่นปากเป็ดวางไข่ มีขนเป็นเส้นทั่วตัว และแม่ให้ลูกกินน้ำนม นักวิทยาศาสตร์จัดตุ่นปากเป็ดไว้กลุ่มใด และเพราะเหตุใด"
    choices:
      - { id: a, text: "สัตว์เลี้ยงลูกด้วยน้ำนม เพราะมีขนเป็นเส้นและเลี้ยงลูกด้วยน้ำนม", correct: true }
      - { id: b, text: "นก เพราะวางไข่และมีปากคล้ายปากเป็ด", feedback: "ปากของตุ่นปากเป็ดนิ่มและไม่มีขนนก การวางไข่ก็พบในปลา กบ และสัตว์เลื้อยคลาน จึงไม่ใช่ลักษณะเฉพาะของนก" }
      - { id: c, text: "สัตว์เลื้อยคลาน เพราะวางไข่", feedback: "สัตว์เลื้อยคลานมีเกล็ดและไม่มีขน ตุ่นปากเป็ดมีขนเป็นเส้น" }
      - { id: d, text: "จัดกลุ่มไม่ได้ เพราะไม่ออกลูกเป็นตัว", feedback: "การออกลูกเป็นตัวพบใน \"ส่วนใหญ่\" ของสัตว์เลี้ยงลูกด้วยน้ำนม ไม่ใช่ทุกชนิด ลักษณะที่สำคัญกว่าคือขนเป็นเส้นและน้ำนม" }
    hints:
      - "ลักษณะใดที่พบเฉพาะในกลุ่มเดียว ไม่พบในกลุ่มอื่นเลย"
      - "การวางไข่พบในหลายกลุ่ม แต่การเลี้ยงลูกด้วยน้ำนมพบในกลุ่มใดกลุ่มเดียว"
    solution: "ขนเป็นเส้นและการเลี้ยงลูกด้วยน้ำนมเป็นลักษณะเฉพาะของสัตว์เลี้ยงลูกด้วยน้ำนม ส่วนการวางไข่พบได้หลายกลุ่ม ตุ่นปากเป็ดจึงเป็นสัตว์เลี้ยงลูกด้วยน้ำนมที่วางไข่ เวลาจำแนกจึงควรใช้ลักษณะเฉพาะของกลุ่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.classifying-organisms.p017
    topics: [biology.diversity.classifying-organisms]
    difficulty: 5
    type: mcq
    stem: "เพื่อนจัดกลุ่ม \"ปลา\" ไว้ 4 ชนิด คือ ปลาทู ปลาฉลาม ม้าน้ำ และปลาวาฬ ชนิดใดไม่ควรอยู่ในกลุ่มนี้"
    choices:
      - { id: a, text: "ปลาวาฬ", correct: true }
      - { id: b, text: "ม้าน้ำ", feedback: "ม้าน้ำรูปร่างไม่เหมือนปลา แต่มีครีบ หายใจด้วยเหงือกตลอดชีวิต และมีกระดูกสันหลัง จึงเป็นปลา" }
      - { id: c, text: "ปลาฉลาม", feedback: "ปลาฉลามมีครีบและหายใจด้วยเหงือก จึงเป็นปลา" }
      - { id: d, text: "ทุกชนิดเป็นปลา", feedback: "มีชนิดหนึ่งที่หายใจด้วยปอดและเลี้ยงลูกด้วยน้ำนม" }
    hints:
      - "อย่าดูแค่ชื่อหรือรูปร่าง ให้ดูว่าหายใจด้วยอะไรและเลี้ยงลูกอย่างไร"
      - "ชนิดใดต้องโผล่ขึ้นมาหายใจที่ผิวน้ำ"
    solution: "ปลาวาฬหายใจด้วยปอดและเลี้ยงลูกด้วยน้ำนม จึงเป็นสัตว์เลี้ยงลูกด้วยน้ำนม ส่วนม้าน้ำแม้รูปร่างแปลกแต่หายใจด้วยเหงือกและมีครีบ จึงเป็นปลา ชื่อและรูปร่างอาจหลอกเราได้"
