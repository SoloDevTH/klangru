      - "เลือกฐานการคำนวณ"
      - "นับจำนวนตัวที่ไม่รู้เทียบกับจำนวนสมการอิสระ"
      - "เขียนสมการดุลที่มีตัวที่ไม่รู้น้อยที่สุดก่อนแล้วแก้"
      - "ตรวจคำตอบด้วยสมการดุลที่ยังไม่ได้ใช้"
    hints:
      - "เริ่มจากภาพ จบด้วยการตรวจ"
      - "ต้องรู้ว่าแก้ได้หรือไม่ ก่อนลงมือเขียนสมการ"
    solution: "แผนภาพกระบวนการ → ฐานการคำนวณ → นับตัวที่ไม่รู้กับสมการ → แก้สมการทีละตัว → ตรวจด้วยสมการที่เหลือ"
