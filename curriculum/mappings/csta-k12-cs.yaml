# หัวข้อในคลังที่ตรงกับ CSTA K–12 Computer Science Standards (Revised 2017)
# เป็นการเทียบภายในของคลังรู้ ไม่ใช่การรับรองจาก CSTA
# full = บทเรียนและโจทย์สอนครบตามมาตรฐาน, partial = บางส่วน (ดู note)
framework: csta-k12-cs
mappings:
  - topic: computer.algorithms.intro
    indicators: ["1A-AP-08", "1A-AP-11", "1A-AP-14"]
    coverage: full
    note: "สร้างและทำตามอัลกอริทึมของกิจวัตร (หุงข้าว ชงชา) แยกงานเป็นลำดับคำสั่งที่ชัดเจน และหาข้อผิดพลาดในอัลกอริทึมที่มีลำดับและวงวน ผังงานและรหัสลำลอง (2-AP-10) กับการเทียบหลายอัลกอริทึม (1B-AP-08) มีบางส่วนแต่ยังไม่ถึงปัญหาที่ซับซ้อน จึงอยู่ในหัวข้อที่เสนอ"
  - topic: computer.data.binary
    indicators: ["2-DA-07", "3A-DA-09"]
    coverage: full
    note: "แทนข้อมูลด้วยหลายรหัส (เลขฐานสอง ASCII ยูนิโคด/UTF-8 RGB การสุ่มวัดเสียง) และแปลงระหว่างบิตกับตัวเลข ตัวอักษร ภาพ และเสียง"
  - topic: computer.programming.basics
    indicators: ["1B-AP-09", "1B-AP-10", "1B-AP-15", "2-AP-11", "2-AP-12"]
    coverage: partial
    note: "ตัวแปร ชนิดข้อมูล ตัวดำเนินการ เงื่อนไขแบบรวม (and/or) วงวนซ้อน การทดสอบและหาข้อผิดพลาดครบในระดับอ่านและไล่โปรแกรม แต่ผู้เรียนยังไม่ได้สร้างโปรแกรมของตัวเองในแอป และยังไม่มีเหตุการณ์ (events)"
  - topic: computer.algorithms.logical-reasoning
    indicators: [1B-AP-08]
    coverage: full
    note: เทียบอัลกอริทึมด้วยกรณีแย่ที่สุด (หาเหรียญปลอม ทายเลข หาบัตรในกล่อง) และปรับปรุงอัลกอริทึมตัดเกรดที่มีบั๊ก
  - topic: computer.data.digital-data-basics
    indicators: [1A-DA-06, 1A-DA-07]
    coverage: full
  - topic: computer.data.digital-data-basics
    indicators: [1A-CS-01, 1A-DA-05]
    coverage: partial
    note: เลือกซอฟต์แวร์ตามงานและตามความต้องการของผู้ใช้ และรู้การทำงานกับไฟล์ทุกแบบ แต่ไม่ได้ใช้งานอุปกรณ์จริง
  - topic: computer.programming.block-programming
    indicators: [1A-AP-09, 1A-AP-12, 1A-AP-13]
    coverage: full
  - topic: computer.programming.block-programming
    indicators: [1A-AP-10, 1A-AP-15]
    coverage: partial
    note: ไล่และเลือกโปรแกรมที่มีลำดับและวงวน แต่ไม่ได้สร้างโปรแกรมเองในเครื่องมือจริง
  - topic: computer.safety.safe-ict-primary
    indicators: [1A-NI-04, 1A-IC-17, 1A-IC-18, 1B-NI-05]
    coverage: full
  - topic: computer.systems.logic-gates
    indicators: [3B-CS-02]
    coverage: full
    note: สวิตช์อนุกรมและขนานเป็น AND และ OR ทรานซิสเตอร์เป็นสวิตช์ อินพุต วงจรตรรกะ และเอาต์พุต วงจรบวก และระดับแรงดันของสัญญาณดิจิทัล
  - topic: computer.algorithms.computational-thinking
    indicators: [1B-AP-11, 2-AP-10, 2-AP-13, 3A-IC-26]
    coverage: full
  - topic: computer.algorithms.computational-thinking
    indicators: [3B-AP-15]
    coverage: partial
    note: หารูปแบบที่ทำให้ทั่วไปได้ในปัญหาขนาดใหญ่ (ส่งพัสดุ 500 หลัง p015, พบกันหมด p016) แต่ไม่ได้วิเคราะห์ปัญหาจริงขนาดใหญ่อย่างละเอียด
  - topic: computer.data.data-processing
    indicators: [1B-DA-06, 1B-DA-07, 3B-DA-07]
    coverage: full
  - topic: computer.data.data-processing
    indicators: [2-DA-08, 2-DA-09, 3A-DA-12, 3A-DA-11, 3B-DA-05, 3B-DA-06]
    coverage: partial
    note: ทำความสะอาดและแปลงข้อมูล (p006, p010, ตัวอย่างหน่วยส่วนสูง) สร้าง ทดสอบ และปรับแบบจำลองเชิงเส้นจากข้อมูล (p012, p015) แต่ไม่ได้เก็บข้อมูลด้วยเครื่องมือหรือสร้างแบบจำลองในซอฟต์แวร์เอง
  - topic: computer.networks.internet-basics
    indicators: [1B-NI-04, 2-NI-04, 3A-NI-04]
    coverage: full
    note: แบ่งเป็นแพ็กเก็ตและประกอบกลับ บทบาทของโพรโทคอลตามชั้น TCP/IP และความทนทานและการขยายได้จากเราเตอร์ สวิตช์ เซิร์ฟเวอร์ ลักษณะการเชื่อมต่อ และที่อยู่แบบลำดับชั้น
  - topic: computer.programming.design-debug
    indicators: [1B-AP-09, 1B-AP-10, 2-AP-11, 2-AP-12]
    coverage: partial
    note: ตัวแปรที่ตั้งชื่อชัด ลำดับ เหตุการณ์ เงื่อนไขแบบรวม และวงวนซ้อน สอนผ่านการไล่ เลือก และแก้โปรแกรม แต่ไม่ได้สร้างโปรแกรมเอง
  - topic: computer.programming.design-debug
    indicators: [1B-AP-15, 2-AP-17, 1B-AP-17, 2-AP-19]
    coverage: full
    note: กรณีทดสอบปกติ ขอบ ผิดรูป ตารางทดสอบ การทดสอบซ้ำ การดีบักอย่างเป็นระบบ และคอมเมนต์ที่อธิบายเหตุผล
  - topic: computer.society.computing-impacts
    indicators: [1A-IC-16, 1B-IC-18, 2-IC-20, 3A-IC-24, 3B-IC-25]
    coverage: full
    note: เปรียบเทียบงานเดียวกันก่อนและหลังมีเทคโนโลยี เทคโนโลยีกับวัฒนธรรมสองทาง ข้อแลกเปลี่ยนต่อชีวิตประจำวันและอาชีพ ประเมินผลกระทบห้าด้าน และเสนอวิธีเพิ่มผลดีลดผลเสีย (p012)
  - topic: computer.society.computing-impacts
    indicators: [3B-IC-26, 3B-IC-27, 3B-IC-28]
    coverage: partial
    note: ช่องว่างทางดิจิทัลและการเข้าถึง (p009, p016) ส่วนการกระจายทรัพยากรคอมพิวเตอร์ระดับโลกกล่าวถึงเพียงประโยคเดียว
  - topic: computer.society.responsible-ict
    indicators: [1B-AP-14, 1B-IC-21, 3A-AP-20, 3A-IC-28]
    coverage: full
  - topic: computer.society.responsible-ict
    indicators: [2-AP-16]
    coverage: partial
    note: สอนขั้นตอนนำโค้ด ไลบรารี และสื่อมาใช้พร้อมให้เครดิต (p009, p010) แต่ผู้เรียนไม่ได้สร้างโปรแกรมของตนเองที่รวมโค้ดผู้อื่นจริง
  - topic: computer.systems.computer-systems
    indicators: [1A-CS-02, 1B-CS-01, 1B-CS-02]
    coverage: full
  - topic: computer.systems.troubleshooting
    indicators: [1A-CS-03, 1B-CS-03]
    coverage: full
  - topic: computer.systems.troubleshooting
    indicators: [2-CS-03, 3A-CS-03]
    coverage: partial
    note: กระบวนการระบุและแก้ปัญหาอย่างเป็นระบบ การแบ่งครึ่ง และการสลับอุปกรณ์ สอนผ่านสถานการณ์ แต่ไม่ได้ลงมือแก้อุปกรณ์จริง
