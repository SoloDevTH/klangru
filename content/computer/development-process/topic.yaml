id: computer.programming.development-process
subject: computer
title: { th: กระบวนการพัฒนาโปรแกรมแบบวนรอบกับผู้ใช้, en: "Iterative program development with users" }
summary: วงจรชีวิตของซอฟต์แวร์ แบบน้ำตกกับแบบวนรอบ การสร้างต้นแบบ ฟังและจัดลำดับความเห็นของผู้ใช้ ต่อยอดโปรแกรมเดิมพร้อมการทดสอบถดถอย บันทึกเหตุผลการออกแบบ และการเลือกแพลตฟอร์มและภาษา
difficulty: 4.5
minutes: 45
prerequisites: [computer.programming.functions, computer.society.inclusive-design]
encompasses:
  - { id: computer.programming.functions, weight: 0.2 }
  - { id: computer.society.inclusive-design, weight: 0.2 }
  - { id: computer.programming.design-debug, weight: 0.3 }
  - { id: computer.design.user-centred-design, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: iterative-cycle.svg
    alt: "ด้านซ้ายคือแบบน้ำตก กล่องห้ากล่องเรียงลงเป็นขั้นบันได ความต้องการ ออกแบบ พัฒนา ทดสอบ นำไปใช้ ลูกศรชี้ลงทีละขั้น ใต้ภาพเขียนว่าผู้ใช้เห็นงานครั้งแรกตอนท้าย เหมาะเมื่อความต้องการชัดและไม่เปลี่ยน ด้านขวาคือแบบวนรอบ กล่องห้ากล่องเรียงเป็นวงกลม ฟังความต้องการ ออกแบบหรือวางแผน สร้างต้นแบบ ผู้ใช้ทดลอง ปรับปรุงและบันทึกเหตุผล ลูกศรวนตามเข็มนาฬิกากลับมาที่ฟังความต้องการ กลางวงเขียนว่ารอบสั้น ๆ ได้ความเห็นทุกรอบ ใต้ภาพเขียนว่าเหมาะเมื่อยังไม่แน่ใจว่าผู้ใช้ต้องการอะไร"
    caption: "แบบน้ำตกทำทีละขั้นครั้งเดียว แบบวนรอบทำทุกขั้นซ้ำเป็นรอบสั้น ๆ"
  - type: worked-example
    title: ปรับปรุงแอปสั่งข้าวสองรอบ
    problem: "ต้นแบบรอบแรกของแอปสั่งข้าวให้นักเรียน 10 คนลองสั่งข้าวมันไก่หนึ่งจาน สั่งสำเร็จ 6 คน ความเห็นที่ได้คือ หาปุ่มยืนยันไม่เจอ (4 คน) อยากจ่ายผ่านแอป (5 คน) และอยากได้ธีมสีชมพู (1 คน) ทีมมีเวลาหนึ่งสัปดาห์ก่อนทดสอบรอบสอง ควรทำอย่างไร"
    steps:
      - text: "วัดผลรอบแรก: อัตราสั่งสำเร็จ 6 ÷ 10 = 60% ตัวเลขนี้คือเส้นฐานไว้เทียบ"
      - text: "จัดลำดับความเห็น: ปุ่มยืนยันกระทบงานหลักและแก้ได้ในวันเดียว (ผลมาก แรงน้อย) การจ่ายผ่านแอปผลมากแต่ต้องเชื่อมระบบการเงิน (แรงมาก) ธีมสีชมพูผลน้อย"
        why: "เรื่องที่ทำให้ผู้ใช้ทำงานหลักไม่สำเร็จต้องมาก่อน เวลาหนึ่งสัปดาห์จึงควรใช้กับเรื่องที่ได้ผลมากแต่ใช้แรงน้อย"
      - text: "ลงมือ: ย้ายปุ่มยืนยันไปล่างจอและขยายให้ใหญ่ จดการจ่ายผ่านแอปไว้ในแผนรอบถัดไป"
      - text: "บันทึกการตัดสินใจ: ย้ายปุ่มเพราะ 4 ใน 10 คนหาไม่เจอ ไม่ทำการจ่ายเงินในรอบนี้เพราะใช้เวลาเกินหนึ่งสัปดาห์"
        why: "บันทึกพร้อมหลักฐานทำให้คนในทีมและคนรุ่นต่อไปรู้ว่าทำไมจึงเลือกแบบนี้"
      - text: "ทดสอบรอบสองกับผู้ใช้ 12 คน (ไม่ซ้ำคนเดิมทั้งหมด) สั่งสำเร็จ 9 คน คิดเป็น 75% เพิ่มขึ้น 15 จุดเปอร์เซ็นต์ แล้วเริ่มรอบถัดไปจากความเห็นใหม่"
    answer: "แก้ปุ่มยืนยันก่อนเพราะผลมากแรงน้อย เลื่อนการจ่ายเงินไปรอบถัดไป บันทึกเหตุผล แล้ววัดผลซ้ำ อัตราสำเร็จเพิ่มจาก 60% เป็น 75%"
  - { type: check, problem: computer.programming.development-process.p006, prompt: "แปลงผลทดสอบเป็นเปอร์เซ็นต์" }
  - type: figure
    src: priority-matrix.svg
    alt: "ตารางสองแกน แกนนอนคือแรงที่ต้องใช้จากน้อยไปมาก แกนตั้งคือผลต่อผู้ใช้จากน้อยไปมาก แบ่งเป็นสี่ช่อง ซ้ายบน (ผลมาก แรงน้อย) เขียนว่าทำก่อน มีจุด 1 ขยายปุ่มยืนยัน ขวาบน (ผลมาก แรงมาก) เขียนว่าวางแผนทำ มีจุด 2 ให้ผู้ปกครองจ่ายเงินแทน ซ้ายล่าง (ผลน้อย แรงน้อย) เขียนว่าทำถ้ามีเวลา มีจุด 3 เปลี่ยนสีธีม ขวาล่าง (ผลน้อย แรงมาก) เขียนว่าพักไว้ มีจุด 4 แนะนำเมนูด้วย AI"
    caption: "จัดลำดับความเห็นด้วยผลต่อผู้ใช้กับแรงที่ต้องใช้"
  - type: worked-example
    title: เพิ่มค่ากล่องใส่กลับบ้านโดยไม่ทำของเดิมพัง
    problem: |
      ฟังก์ชันเดิมคิดราคาอาหารและลดให้สมาชิก 10% แม่ค้าขอเพิ่มข้อกำหนดใหม่: ใส่กล่องกลับบ้านคิดเพิ่มจานละ 5 บาท และ **ส่วนลดสมาชิกคิดจากค่าอาหารเท่านั้น** ให้เพิ่มความสามารถนี้อย่างปลอดภัย

      ```python
      def total_price(items, member=False):
          total = sum(items)
          if member:
              total = total * 0.9
          return total
      ```
    steps:
      - text: "เขียนกรณีทดสอบใหม่จากข้อกำหนดก่อนแก้โค้ด: สั่ง 40 + 15 แบบกลับบ้าน ได้ 55 + 2 × 5 = 65 บาท และถ้าเป็นสมาชิกด้วย ได้ 55 × 0.9 + 10 = 59.5 บาท"
        why: "กรณีทดสอบที่คิดจากข้อกำหนดเป็นตัวบอกว่าโค้ดถูกหรือผิด ไม่ใช่ดูจากผลที่โค้ดให้ออกมาแล้วเชื่อตาม"
      - text: "เก็บกรณีทดสอบเดิมไว้ทั้งหมด: total_price([40, 15]) ต้องได้ 55 และแบบสมาชิกต้องได้ 49.5"
      - text: "แก้โค้ด: เพิ่มพารามิเตอร์ `takeaway=False` ไว้ท้ายสุด แล้วเพิ่ม `if takeaway: total = total + 5 * len(items)` **หลัง** บรรทัดส่วนลด"
        why: "ค่าเริ่มต้นเป็น False ทำให้ทุกที่ที่เรียกแบบเดิมได้ผลเหมือนเดิม และวางหลังส่วนลดเพื่อให้ส่วนลดไม่ไปลดค่ากล่อง"
      - text: "รันทุกกรณี: 55, 49.5, 65 และ 59.5 ผ่านทั้งหมด"
      - text: "ทดลองว่ากรณีทดสอบจับผิดได้จริง: ถ้าวางค่ากล่องไว้ก่อนส่วนลด กรณีสมาชิกกลับบ้านจะได้ (55 + 10) × 0.9 = 58.5 ไม่ใช่ 59.5 กรณีนี้จึงไม่ผ่าน"
        why: "การแก้ที่ดูเหมือนเล็กน้อยอาจเปลี่ยนผลของส่วนอื่นได้ กรณีทดสอบที่ครอบคลุมจะเตือนทันที"
    answer: "เพิ่ม takeaway=False และบวกค่ากล่องหลังคิดส่วนลด กรณีทดสอบทั้งใหม่และเดิมผ่านครบ (55, 49.5, 65, 59.5)"
  - { type: check, problem: computer.programming.development-process.p008, prompt: "กรณีทดสอบที่ค่าขอบจับบั๊กได้หรือไม่" }
glossary:
  - { term: วงจรชีวิตของซอฟต์แวร์ (software life cycle), definition: "ขั้นตอนของซอฟต์แวร์ตั้งแต่เก็บความต้องการ ออกแบบ พัฒนา ทดสอบ จนถึงนำไปใช้และดูแล" }
  - { term: แบบน้ำตก (waterfall), definition: "การพัฒนาที่ทำทีละขั้นจนจบแล้วจึงไปขั้นถัดไป เหมาะเมื่อความต้องการชัดและไม่เปลี่ยน" }
  - { term: การพัฒนาแบบวนรอบ (iterative development), definition: "การทำทุกขั้นแบบย่อในรอบสั้น ให้ผู้ใช้ลองแล้วนำความเห็นไปปรับในรอบถัดไป" }
  - { term: ต้นแบบ (prototype), definition: "รุ่นทดลองที่ทำเร็วและต้นทุนต่ำ เพื่อทดสอบความคิดกับผู้ใช้" }
  - { term: การทดสอบถดถอย (regression testing), definition: "การรันกรณีทดสอบเดิมซ้ำหลังแก้โปรแกรม เพื่อตรวจว่าส่วนที่เคยถูกยังไม่พัง" }
  - { term: บันทึกการตัดสินใจ (decision log), definition: "บันทึกสิ่งที่ตัดสินใจในการออกแบบ เหตุผลพร้อมหลักฐาน และทางเลือกอื่นที่ไม่เลือก" }
  - { term: แพลตฟอร์ม (platform), definition: "สภาพแวดล้อมที่โปรแกรมทำงาน เช่น เว็บเบราว์เซอร์ ระบบปฏิบัติการของโทรศัพท์ หรือคอมพิวเตอร์" }
flashcards:
  - { front: "แบบวนรอบต่างจากแบบน้ำตกอย่างไร", back: "แบบวนรอบทำทุกขั้นซ้ำเป็นรอบสั้นและฟังผู้ใช้ทุกรอบ แบบน้ำตกทำทีละขั้นครั้งเดียว" }
  - { front: "ควรทำความเห็นแบบใดก่อน", back: "ผลต่อผู้ใช้มากแต่ใช้แรงน้อย" }
  - { front: "ทำไมต้องรันกรณีทดสอบเดิมหลังเพิ่มความสามารถใหม่", back: "การแก้อาจทำให้ส่วนเดิมพังโดยไม่ตั้งใจ (การทดสอบถดถอย)" }
  - { front: "บันทึกการตัดสินใจที่ดีมีอะไรบ้าง", back: "สิ่งที่ตัดสินใจ เหตุผลพร้อมหลักฐาน และทางเลือกที่ไม่เลือก" }
  - { front: "นำโค้ดโอเพนซอร์สมาต่อยอดต้องทำอะไร", back: "อ่านสัญญาอนุญาตว่ายอมให้ดัดแปลง และให้เครดิตเจ้าของ" }
