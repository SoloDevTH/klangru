<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="sans-serif" font-size="14">
<title>น้ำบนโลกอยู่ที่ไหนบ้าง</title>
<rect x="0" y="0" width="720" height="300" fill="#ffffff"/>
<text x="20.0" y="30.0" text-anchor="start" font-size="16" font-weight="bold" fill="#222">ถ้าแบ่งน้ำทั้งโลกเป็น 1,000 ขวด</text>
<rect x="20" y="55" width="663.0" height="50" fill="#1d4ed8"/>
<rect x="683.0" y="55" width="17.0" height="50" fill="#22d3ee" stroke="#0e7490"/>
<text x="351.5" y="87.0" text-anchor="middle" font-size="15" fill="#ffffff">น้ำเค็ม (ทะเล มหาสมุทร) ประมาณ 975 ขวด</text>
<line x1="700" y1="107" x2="700" y2="170" stroke="#0e7490" stroke-dasharray="4 3"/>
<line x1="683.0" y1="107" x2="80" y2="170" stroke="#0e7490" stroke-dasharray="4 3"/>
<text x="80.0" y="250.0" text-anchor="start" font-size="15" font-weight="bold" fill="#0e7490">ขยายส่วนน้ำจืด 25 ขวด</text>
<rect x="80.0" y="170" width="425.9" height="50" fill="#e0f2fe" stroke="#334155"/>
<text x="293.0" y="201.0" text-anchor="middle" font-size="14" fill="#222">น้ำแข็งและธารน้ำแข็ง ราว 17 ขวด</text>
<rect x="505.9" y="170" width="186.6" height="50" fill="#60a5fa" stroke="#334155"/>
<text x="599.2" y="201.0" text-anchor="middle" font-size="14" fill="#222">น้ำใต้ดิน ราว 7 ขวดครึ่ง</text>
<rect x="692.6" y="170" width="7.4" height="50" fill="#16a34a" stroke="#334155"/>
<line x1="696.0" y1="260.0" x2="696.0" y2="224.0" stroke="#16a34a" stroke-width="2"/>
<polygon points="696.0,224.0 699.1,231.4 692.9,231.4" fill="#16a34a"/>
<text x="690.0" y="278.0" text-anchor="end" font-size="13" fill="#166534">แม่น้ำ ทะเลสาบ บึง ดินชื้น และไอน้ำในอากาศ รวมกันไม่ถึงครึ่งขวด</text>
</svg>