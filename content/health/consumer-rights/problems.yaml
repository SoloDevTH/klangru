  - ข้อความจากคนอื่นที่ไม่เกี่ยวข้องช่วยได้น้อย
  solution: หลักฐานที่ดีแสดงทั้งการซื้อขาย สิ่งที่ผู้ขายอ้าง ตัวสินค้า และความเสียหายต่อสุขภาพ ใช้ประกอบการร้องเรียน อย. 1556 หรือ สคบ. 1166
