<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" font-family="sans-serif" font-size="14">
<title>ผังตัดสินใจเมื่อข้อกำหนดของลูกค้าขัดกับความปลอดภัย</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15211e"/></marker></defs>
<rect x="0" y="0" width="800" height="480" fill="#ffffff"/>
<text x="400.0" y="30.0" text-anchor="middle" font-size="16" fill="#15211e" font-weight="bold">ผังตัดสินใจเมื่อข้อกำหนดขัดกับความปลอดภัย</text>
<rect x="230.0" y="50.0" width="340.0" height="56.0" rx="10" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="2"/>
<text x="400.0" y="74.0" text-anchor="middle" font-size="14" fill="#15211e">พบว่าข้อกำหนดของลูกค้าอาจกระทบ</text>
<text x="400.0" y="94.0" text-anchor="middle" font-size="14" fill="#15211e">ความปลอดภัยของผู้ใช้หรือสาธารณะ</text>
<line x1="400.0" y1="106.0" x2="400.0" y2="130.0" stroke="#15211e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="190.0" y="130.0" width="420.0" height="56.0" rx="28" fill="#ffffff" stroke="#15211e" stroke-width="2"/>
<text x="400.0" y="154.0" text-anchor="middle" font-size="14" fill="#15211e" font-weight="bold">ข้อมูลและการคำนวณยืนยันว่ามีความเสี่ยงหรือไม่?</text>
<text x="400.0" y="174.0" text-anchor="middle" font-size="12" fill="#555555">(ตรวจด้วยการคำนวณ ไม่ใช้ความรู้สึก)</text>
<line x1="190.0" y1="158.0" x2="130.0" y2="158.0" stroke="#15211e" stroke-width="2" marker-end="url(#ah)"/>
<text x="160.0" y="150.0" text-anchor="middle" font-size="12" fill="#555555">ไม่มี</text>
<rect x="20.0" y="130.0" width="110.0" height="56.0" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="75.0" y="154.0" text-anchor="middle" font-size="13" fill="#15211e">ดำเนินงานต่อ</text>
<text x="75.0" y="172.0" text-anchor="middle" font-size="13" fill="#15211e">บันทึกผลตรวจ</text>
<line x1="400.0" y1="186.0" x2="400.0" y2="214.0" stroke="#15211e" stroke-width="2" marker-end="url(#ah)"/>
<text x="412.0" y="204.0" text-anchor="start" font-size="12" fill="#555555">มี</text>
<rect x="230.0" y="214.0" width="340.0" height="56.0" rx="8" fill="#fff3e0" stroke="#b35c00" stroke-width="2"/>
<text x="400.0" y="238.0" text-anchor="middle" font-size="14" fill="#15211e">บันทึกข้อเท็จจริงและเหตุผลเป็นลายลักษณ์อักษร</text>
<text x="400.0" y="258.0" text-anchor="middle" font-size="12" fill="#555555">พร้อมวันที่ ผู้เกี่ยวข้อง และหลักฐาน</text>
<line x1="400.0" y1="270.0" x2="400.0" y2="298.0" stroke="#15211e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="230.0" y="298.0" width="340.0" height="56.0" rx="8" fill="#fff3e0" stroke="#b35c00" stroke-width="2"/>
<text x="400.0" y="322.0" text-anchor="middle" font-size="14" fill="#15211e">แจ้งผู้มีอำนาจตัดสินใจขององค์กรอย่างเป็นทางการ</text>
<text x="400.0" y="342.0" text-anchor="middle" font-size="12" fill="#555555">และขอให้ตรวจสอบหรือแก้ไขก่อนดำเนินต่อ</text>
<line x1="400.0" y1="354.0" x2="400.0" y2="382.0" stroke="#15211e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="190.0" y="382.0" width="420.0" height="56.0" rx="28" fill="#ffffff" stroke="#15211e" stroke-width="2"/>
<text x="400.0" y="406.0" text-anchor="middle" font-size="14" fill="#15211e" font-weight="bold">แก้ไขให้ปลอดภัยได้โดยไม่ลดมาตรฐานหรือไม่?</text>
<line x1="610.0" y1="410.0" x2="646.0" y2="410.0" stroke="#15211e" stroke-width="2" marker-end="url(#ah)"/>
<text x="632.0" y="402.0" text-anchor="middle" font-size="12" fill="#555555">ได้</text>
<rect x="648.0" y="382.0" width="146.0" height="56.0" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="721.0" y="404.0" text-anchor="middle" font-size="12" fill="#15211e">ทำต่อด้วยมาตรการ</text>
<text x="721.0" y="422.0" text-anchor="middle" font-size="12" fill="#15211e">ที่ผ่านเกณฑ์ แล้วลงนาม</text>
<line x1="190.0" y1="410.0" x2="140.0" y2="410.0" stroke="#15211e" stroke-width="2" marker-end="url(#ah)"/>
<text x="160.0" y="402.0" text-anchor="middle" font-size="12" fill="#555555">ไม่ได้</text>
<rect x="20.0" y="382.0" width="120.0" height="56.0" rx="8" fill="#e8f1f8" stroke="#b3261e" stroke-width="2"/>
<text x="80.0" y="404.0" text-anchor="middle" font-size="12" fill="#15211e">ไม่ลงนามรับรอง</text>
<text x="80.0" y="422.0" text-anchor="middle" font-size="12" fill="#15211e">แจ้งหน่วยงานกำกับ</text>
<text x="400.0" y="466.0" text-anchor="middle" font-size="12" fill="#555555">ผังนี้เป็นกรอบคิดเบื้องต้น ต้องปรับตามกฎหมายและข้อบังคับของหน่วยงานที่เกี่ยวข้อง</text>
</svg>
