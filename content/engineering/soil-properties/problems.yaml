  - id: "engineering.geotech.soil-properties.p017"
    topics: ["engineering.geotech.soil-properties"]
    difficulty: 5
    type: "code"
    stem: "เขียนฟังก์ชัน `soil_class(LL, PL)` ที่รับ LL และ PL ของดินเม็ดละเอียด แล้วคืนสัญลักษณ์กลุ่มตามเกณฑ์ย่อของ USCS นี้: ให้ $\\mathrm{PI} = \\mathrm{LL} - \\mathrm{PL}$ ถ้า $\\mathrm{PI} \\ge 0.73(\\mathrm{LL}-20)$ (อยู่บนหรือเหนือเส้น A) เป็นดินเหนียว C มิฉะนั้นเป็นตะกอนทรายแป้ง M และถ้า $\\mathrm{LL} \\ge 50$ ต่อท้ายด้วย H มิฉะนั้นต่อท้ายด้วย L (เกณฑ์ย่อนี้ไม่รวมเขตแรเงา CL-ML ของแผนภูมิจริง)"
    hints: ["คำนวณ PI และค่าเส้น A $0.73(\\mathrm{LL}-20)$ ก่อน แล้วเลือกตัวอักษรแรก C หรือ M", "ตัวอักษรที่สองดูจาก LL เทียบกับ 50 แล้ว `return` สตริงที่ต่อกัน"]
    solution: "คำนวณ PI แล้วเทียบกับเส้น A เพื่อเลือก C หรือ M จากนั้นใช้ LL ≥ 50 เลือก H หรือ L เช่น LL = 65, PL = 28 ได้ PI = 37 ≥ 32.85 จึงเป็น CH ส่วน LL = 55, PL = 48 ได้ PI = 7 ต่ำกว่าเส้น A จึงเป็น MH"
    license: "CC-BY-SA-4.0"
    ai_assisted: true
    language: "python"
    starter: "def soil_class(LL, PL):\n    pass\n"
    tests: "assert soil_class(65, 28) == \"CH\", f\"soil_class(65, 28) ควรได้ CH แต่ได้ {soil_class(65, 28)}\"\nassert soil_class(35, 20) == \"CL\", f\"soil_class(35, 20) ควรได้ CL (LL ต่ำกว่า 50 และ PI = 15 เหนือเส้น A) แต่ได้ {soil_class(35, 20)}\"\nassert soil_class(55, 48) == \"MH\", f\"soil_class(55, 48) ควรได้ MH เพราะ PI = 7 ต่ำกว่าเส้น A แต่ได้ {soil_class(55, 48)}\"\nassert soil_class(40, 32) == \"ML\", f\"soil_class(40, 32) ควรได้ ML แต่ได้ {soil_class(40, 32)}\"\n"
    reference: "def soil_class(LL, PL):\n    PI = LL - PL\n    first = \"C\" if PI >= 0.73 * (LL - 20) else \"M\"\n    second = \"H\" if LL >= 50 else \"L\"\n    return first + second\n"
