    solution: "จำนวนเต็มเก็บค่าได้ตรงพอดี เมื่อใช้หน่วยสตางค์ทุกราคาเป็นจำนวนเต็ม บวกกี่ครั้งก็ไม่คลาดเคลื่อน (ใช้จำนวนเต็มที่มีบิตมากพอ เช่น 64 บิต)"
