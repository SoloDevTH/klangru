id: health.family.respectful-relationships
subject: health
title: { th: "ความสัมพันธ์ที่เคารพกัน: ความเห็นอกเห็นใจ อำนาจ การบังคับ และการสื่อสารอย่างมั่นใจ", en: "Respectful relationships: empathy, power, coercion and assertive communication" }
summary: วิเคราะห์ความเคารพ ความเห็นอกเห็นใจ อำนาจ และการบังคับในความสัมพันธ์ แยกการโน้มน้าวออกจากการควบคุม และฝึกสื่อสารอย่างมั่นใจและให้เกียรติ
difficulty: 4
minutes: 35
prerequisites: [health.family.friendships-relationships, health.sexuality.body-safety-consent, health.sexuality.gender-and-respect, health.safety.violence-prevention]
encompasses:
  - { id: health.family.friendships-relationships, weight: 0.2 }
  - { id: health.sexuality.body-safety-consent, weight: 0.2 }
  - { id: health.sexuality.gender-and-respect, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: สเกลจากการโน้มน้าวไปถึงการควบคุม
    src: power-control-scale.svg
    alt: "แถบสี่ช่องจากซ้ายไปขวา: โน้มน้าว (ให้เหตุผลและเคารพคำตอบ), กดดัน (พูดซ้ำจนรู้สึกไม่มีทางเลือก), บังคับ (ใช้กำลังหรือขู่ให้ต้องทำตาม), ควบคุม (จำกัดอิสระ ตรวจ และขู่ให้ยอม) มีลูกศรชี้ไปทางขวาว่ายิ่งไปทางขวายิ่งจำกัดอิสระของอีกฝ่าย"
    caption: "ยิ่งไปทางขวา การมีอิทธิพลยิ่งทำลายอิสระและความเคารพของอีกฝ่าย"
  - { type: check, problem: health.family.respectful-relationships.p010, prompt: "ลองคิดก่อนอ่านต่อ: ประโยคนี้ของคู่รักคือความรักหรือการกดดัน" }
  - type: figure
    title: สามแบบการสื่อสาร
    src: communication-styles.svg
    alt: "สามคอลัมน์: ยอมตาม ตัวอย่างประโยค ก็ได้ ตามใจเธอก็แล้วกัน ไม่บอกความต้องการของตัวเอง, ก้าวร้าว ตัวอย่างประโยค เธอนี่มันโง่จริง ๆ ทำไมไม่ฟังฉัน ดูถูกและบังคับอีกฝ่าย, มั่นใจและให้เกียรติ ตัวอย่างประโยค ฉันรู้สึกไม่สบายใจ ฉันขอเลือกรอบนี้นะ บอกความต้องการและเคารพอีกฝ่าย"
    caption: "ประโยค \"ฉัน...\" ช่วยบอกความรู้สึกและความต้องการโดยไม่โทษอีกฝ่าย"
  - { type: check, problem: health.family.respectful-relationships.p004, prompt: "ลองคิดก่อนอ่านต่อ: ประโยคไหนเป็นประโยคที่มั่นใจและให้เกียรติ" }
  - type: worked-example
    title: วิเคราะห์ข้อความว่าเป็นการโน้มน้าว การกดดัน หรือการควบคุม
    problem: "เพื่อนพูดว่า \"ถ้าห่วงฉันจริง ต้องส่งตำแหน่งให้ฉันดูตลอดเวลา\" ข้อความนี้เป็นการโน้มน้าว การกดดัน หรือการควบคุม"
    steps:
      - text: "ดูว่าอีกฝ่ายมีทางเลือกหรือไม่: ถ้าไม่ส่งจะถูกตัดสินว่าไม่ห่วงเลย จึงไม่มีทางเลือกที่แท้จริง"
        why: "การโน้มน้าวที่ดีต้องเปิดให้อีกฝ่ายตอบว่าไม่ได้โดยไม่ถูกลงโทษทางอารมณ์"
      - text: "ดูว่าข้อความจำกัดอิสระหรือไม่: ต้องรายงานตำแหน่งตลอดเวลา ซึ่งจำกัดชีวิตส่วนตัวของอีกฝ่าย"
      - text: "เทียบกับนิยาม: การควบคุมคือการจำกัดอิสระและการตัดสินใจของอีกฝ่าย"
    answer: "เป็นการควบคุม เพราะจำกัดอิสระและไม่เปิดทางเลือกที่แท้จริง ควรบอกผู้ใหญ่ที่ไว้ใจ"
  - type: worked-example
    title: คำนวณการลดลงของความเชื่อที่ทำให้ยอมรับการควบคุม
    problem: "ก่อนเรียนเรื่องนี้ มีนักเรียน 9 คนที่เชื่อว่า \"หึงแปลว่ารัก\" หลังเรียนเหลือ 4 คนที่ยังเชื่อเช่นนั้น จำนวนคนที่เชื่อลดลงกี่เปอร์เซ็นต์ (ตัวเลขสมมติ)"
    steps:
      - text: "หาจำนวนที่ลดลง: 9 − 4 = 5 คน"
      - text: "หารด้วยจำนวนเดิม: 5 ÷ 9 ≈ 0.5556"
        why: "ต้องหารด้วยจำนวนเดิม (9) ไม่ใช่จำนวนที่เหลือ (4) เพื่อให้เป็นร้อยละของกลุ่มเดิม"
      - text: "คูณ 100: 0.5556 × 100 ≈ 55.6%"
    answer: "ลดลงประมาณ 55.6%"
glossary:
  - { term: อำนาจในความสัมพันธ์, definition: "ความสามารถที่คนหนึ่งมีอิทธิพลต่ออีกคน เช่น จากอายุ ความนิยม ฐานะ ร่างกาย หรือตำแหน่ง" }
  - { term: การควบคุม, definition: "การจำกัดอิสระและการตัดสินใจของอีกฝ่าย เช่น ตรวจโทรศัพท์โดยไม่ยินยอม หรือจำกัดการพบเพื่อน" }
  - { term: ความยินยอม, definition: "การตกลงด้วยความเต็มใจ ชัดเจน และอิสระ ซึ่งถอนได้ทุกเมื่อ ให้ไม่ได้เมื่อถูกข่มขู่ เมาหรือหมดสติ" }
  - { term: 'ประโยค "ฉัน..."', definition: "วิธีบอกความรู้สึกและความต้องการของเราโดยไม่โทษอีกฝ่าย เช่น \"ฉันรู้สึกไม่สบายใจเมื่อ...\"" }
flashcards:
  - { front: "ต่างกันอย่างไรระหว่างการโน้มน้าวกับการบังคับ", back: "การโน้มน้าวเคารพคำตอบของอีกฝ่าย ส่วนการบังคับทำให้ไม่มีทางเลือก" }
  - { front: "ความยินยอมที่แท้จริงมีลักษณะอย่างไร", back: "เต็มใจ ชัดเจน ถอนได้ทุกเมื่อ และให้ไม่ได้เมื่อถูกข่มขู่ เมาหรือหมดสติ" }
  - { front: "การเงียบหมายความว่ายินยอมหรือไม่", back: "ไม่ได้หมายความว่ายินยอม ต้องมีความชัดเจนและเต็มใจ" }
  - { front: "ถูกข่มขู่หรือถูกทำร้ายร่างกาย ควรทำอย่างไร", back: "บอกผู้ใหญ่ที่ไว้ใจทันที โทร 191 หรือ 1669 เมื่อมีอันตรายตอนนี้ และโทร 1300 หรือ 1387 เพื่อขอความช่วยเหลือ" }
