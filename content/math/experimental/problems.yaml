problems:
  - id: math.prob.experimental.p001
    topics: [math.prob.experimental]
    difficulty: 1
    type: match
    stem: "จับคู่เหตุการณ์กับคำที่บอกโอกาส"
    pairs:
      - { left: "ทอยลูกเต๋าได้แต้ม 7", right: "เป็นไปไม่ได้" }
      - { left: "ทอยลูกเต๋าได้แต้ม 6", right: "ไม่น่าจะเกิด" }
      - { left: "โยนเหรียญได้หัว", right: "โอกาสเท่า ๆ กัน" }
      - { left: "ทอยลูกเต๋าได้แต้มมากกว่า 1", right: "น่าจะเกิด" }
      - { left: "พรุ่งนี้ดวงอาทิตย์ขึ้นทางทิศตะวันออก", right: "แน่นอน" }
    hints:
      - "ลูกเต๋ามีแต้ม 1 ถึง 6"
      - "นับว่าผลที่ต้องการมีกี่แบบจากทั้งหมด"
    solution: "แต้ม 7 ไม่มีบนลูกเต๋า → เป็นไปไม่ได้ แต้ม 6 มี 1 ใน 6 → ไม่น่าจะเกิด หัวมี 1 ใน 2 → เท่า ๆ กัน มากกว่า 1 มี 5 ใน 6 → น่าจะเกิด ดวงอาทิตย์ขึ้นทางตะวันออกทุกวัน → แน่นอน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.experimental.p002
    topics: [math.prob.experimental]
    difficulty: 1
    type: numeric
    stem: "โยนหมุดหัวกลม 50 ครั้ง ตกแบบปลายแหลมชี้ขึ้น 18 ครั้ง ความถี่สัมพัทธ์ของการตกแบบปลายชี้ขึ้นเท่ากับเท่าใด (ตอบเป็นทศนิยม)"
    answer: { value: 0.36, tolerance: 0.005 }
    hints:
      - "ความถี่สัมพัทธ์ = จำนวนครั้งที่เกิด ÷ จำนวนครั้งที่ทดลองทั้งหมด"
      - "คำนวณ $18 \\div 50$"
    misconceptions:
      - { match: 18, feedback: "นั่นคือความถี่ ยังต้องหารด้วยจำนวนครั้งทั้งหมด" }
      - { match: 0.5625, feedback: "หารด้วยจำนวนครั้งที่ไม่ชี้ขึ้น (32) ต้องหารด้วยจำนวนครั้งทั้งหมด 50" }
    solution: "ความถี่สัมพัทธ์ $= \\tfrac{18}{50} = 0.36$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.experimental.p003
    topics: [math.prob.experimental]
    difficulty: 1
    type: mcq
    stem: "กรมอุตุนิยมวิทยาพยากรณ์ว่าพรุ่งนี้มีโอกาสฝนตก 0.9 คำใดบรรยายได้ดีที่สุด"
    choices:
      - { id: a, text: "น่าจะเกิด", correct: true }
      - { id: b, text: "แน่นอน", feedback: "แน่นอนคือโอกาส 1 พอดี โอกาส 0.9 ยังมีโอกาสที่ฝนจะไม่ตก" }
      - { id: c, text: "ไม่น่าจะเกิด", feedback: "0.9 อยู่ใกล้ 1 ไม่ใช่ใกล้ 0" }
      - { id: d, text: "โอกาสเท่า ๆ กัน", feedback: "โอกาสเท่า ๆ กันคือ 0.5" }
    hints:
      - "นึกถึงมาตราส่วนจาก 0 ถึง 1"
      - "0.9 อยู่ใกล้ปลายด้านใด"
    solution: "0.9 ใกล้ 1 แต่ไม่ถึง 1 จึงเป็น \"น่าจะเกิด\" ยังมีโอกาส 0.1 ที่ฝนไม่ตก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.experimental.p004
    topics: [math.prob.experimental]
    difficulty: 2
    type: numeric
    stem: "ทอยลูกเต๋าที่สมดุล 600 ครั้ง คาดว่าจะได้แต้ม 3 หรือแต้ม 6 ประมาณกี่ครั้ง (ตอบเป็นจำนวนครั้ง)"
    answer: { value: 200, unit: ครั้ง }
    hints:
      - "ความน่าจะเป็นที่ได้ 3 หรือ 6 คือ $\\tfrac26$"
      - "จำนวนครั้งที่คาด $= n \\times P$"
    misconceptions:
      - { match: 100, feedback: "นั่นคือจำนวนที่คาดว่าได้แต้มใดแต้มหนึ่ง ข้อนี้นับทั้งแต้ม 3 และแต้ม 6" }
      - { match: 300, feedback: "ใช้ความน่าจะเป็น $\\tfrac12$ แต่แต้ม 3 หรือ 6 มีแค่ 2 แบบจาก 6 แบบ" }
    solution: "$P(3 \\text{ หรือ } 6) = \\tfrac26 = \\tfrac13$ คาดว่าได้ $600 \\times \\tfrac13 = 200$ ครั้ง ผลจริงอาจไม่ตรง 200 พอดี แต่ควรใกล้เคียง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.experimental.p005
    topics: [math.prob.experimental]
    difficulty: 2
    type: mcq
    stem: "ต้นโยนเหรียญที่สมดุลได้หัว 5 ครั้งติดกัน ครั้งที่ 6 มีโอกาสได้หัวเท่าใด"
    choices:
      - { id: a, text: "$\\tfrac12$ เท่าเดิม", correct: true }
      - { id: b, text: "น้อยกว่า $\\tfrac12$ เพราะถึงคิวได้ก้อยแล้ว", feedback: "เหรียญจำผลเก่าไม่ได้ การโยนแต่ละครั้งเป็นอิสระกัน" }
      - { id: c, text: "มากกว่า $\\tfrac12$ เพราะกำลังออกหัวติดกัน", feedback: "เหรียญสมดุลไม่มี \"ช่วงดวงดี\" ผลครั้งก่อนไม่มีผลต่อครั้งถัดไป" }
    hints:
      - "ผลการโยนครั้งก่อนเปลี่ยนเหรียญหรือไม่"
      - "เหตุการณ์ที่ผลครั้งก่อนไม่มีผลต่อครั้งถัดไปเรียกว่าอะไร"
    solution: "การโยนแต่ละครั้งเป็นอิสระกัน เหรียญสมดุลจึงมีโอกาสได้หัว $\\tfrac12$ ทุกครั้ง ไม่ว่าก่อนหน้านี้ได้อะไร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.experimental.p006
    topics: [math.prob.experimental]
    difficulty: 2
    type: order
    stem: "ทอยลูกเต๋าที่สมดุล 1 ครั้ง เรียงเหตุการณ์จากโอกาสน้อยที่สุดไปมากที่สุด"
    items:
      - "ได้แต้ม 7"
      - "ได้แต้ม 6"
      - "ได้แต้มคู่"
      - "ได้แต้มมากกว่า 1"
      - "ได้แต้มน้อยกว่า 7"
    hints:
      - "นับว่าแต่ละเหตุการณ์มีผลที่ทำให้เกิดกี่แบบจาก 6 แบบ"
      - "แต้ม 7 มี 0 แบบ แต้มคู่มี 3 แบบ"
    solution: "แต้ม 7: $\\tfrac06$ < แต้ม 6: $\\tfrac16$ < แต้มคู่: $\\tfrac36$ < มากกว่า 1: $\\tfrac56$ < น้อยกว่า 7: $\\tfrac66$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.experimental.p007
    topics: [math.prob.experimental]
    difficulty: 2
    type: numeric
    stem: "นักเรียนทอยลูกเต๋า 120 ครั้ง ได้ผลดังแผนภูมิ ความถี่สัมพัทธ์ของการได้แต้มคู่เท่ากับเท่าใด (ตอบเป็นทศนิยม)"
    figure: { src: die-120.svg, alt: "แผนภูมิแท่งความถี่ของแต้มจากการทอยลูกเต๋า 120 ครั้ง แต้ม 1 ได้ 18 ครั้ง แต้ม 2 ได้ 22 ครั้ง แต้ม 3 ได้ 17 ครั้ง แต้ม 4 ได้ 21 ครั้ง แต้ม 5 ได้ 19 ครั้ง แต้ม 6 ได้ 23 ครั้ง" }
    answer: { value: 0.55, tolerance: 0.005 }
    hints:
      - "แต้มคู่คือ 2, 4, 6 รวมความถี่ของสามแท่งนี้"
      - "หารผลรวมด้วย 120"
    misconceptions:
      - { match: 0.5, feedback: "นั่นคือความน่าจะเป็นตามทฤษฎี ข้อนี้ถามความถี่สัมพัทธ์จากผลการทดลองจริง" }
      - { match: 66, feedback: "นั่นคือความถี่ ยังต้องหารด้วย 120" }
    solution: "แต้มคู่: $22 + 21 + 23 = 66$ ครั้ง ความถี่สัมพัทธ์ $= \\tfrac{66}{120} = 0.55$ (ใกล้ค่าตามทฤษฎี 0.5)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.experimental.p008
    topics: [math.prob.experimental]
    difficulty: 3
    type: mcq
    stem: "จากผลการทอยลูกเต๋า 120 ครั้งในแผนภูมิ ข้อสรุปใดเหมาะสมที่สุด"
    figure: { src: die-120.svg, alt: "แผนภูมิแท่งความถี่ของแต้มจากการทอยลูกเต๋า 120 ครั้ง แต้ม 1 ได้ 18 ครั้ง แต้ม 2 ได้ 22 ครั้ง แต้ม 3 ได้ 17 ครั้ง แต้ม 4 ได้ 21 ครั้ง แต้ม 5 ได้ 19 ครั้ง แต้ม 6 ได้ 23 ครั้ง" }
    choices:
      - { id: a, text: "ทุกแต้มได้ใกล้ 20 ครั้งซึ่งเป็นค่าที่คาดไว้ ความต่างเท่านี้เกิดจากความแปรผันตามปกติ ยังไม่มีหลักฐานว่าลูกเต๋าไม่ยุติธรรม", correct: true }
      - { id: b, text: "ลูกเต๋าโกง เพราะแต่ละแต้มไม่ได้ 20 ครั้งพอดี", feedback: "การทดลองสุ่มแทบไม่เคยได้ตรงค่าคาดการณ์พอดี ความต่าง 2–3 ครั้งจาก 20 เป็นเรื่องปกติ" }
      - { id: c, text: "ทอยครั้งถัดไปน่าจะได้แต้ม 3 เพราะออกน้อยที่สุด", feedback: "ลูกเต๋าจำผลเก่าไม่ได้ ครั้งถัดไปยังมีโอกาสได้แต่ละแต้มเท่าเดิม" }
    hints:
      - "ถ้าลูกเต๋ายุติธรรม คาดว่าแต่ละแต้มจะได้ประมาณ $120 \\times \\tfrac16$ ครั้ง"
      - "ผลการทดลองสุ่มแปรผันได้เสมอ ดูว่าต่างจากค่าคาดมากแค่ไหน"
    solution: "ค่าคาด $120 \\times \\tfrac16 = 20$ ครั้ง ผลจริง 17–23 ครั้ง ใกล้เคียงกันทุกแต้ม จึงสอดคล้องกับลูกเต๋าที่ยุติธรรม ถ้าอยากแน่ใจขึ้นต้องทอยมากกว่านี้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.experimental.p009
    topics: [math.prob.experimental]
    difficulty: 3
    type: numeric
    stem: "นักเรียนโยนฝาขวดน้ำปลา 200 ครั้ง ตกหงาย 130 ครั้ง ถ้าโยน 1,000 ครั้ง คาดว่าจะตกหงายประมาณกี่ครั้ง (ตอบเป็นจำนวนครั้ง)"
    answer: { value: 650, unit: ครั้ง }
    hints:
      - "ประมาณความน่าจะเป็นที่ตกหงายด้วยความถี่สัมพัทธ์ $\\tfrac{130}{200}$"
      - "คูณความน่าจะเป็นนั้นด้วย 1,000"
    misconceptions:
      - { match: 500, feedback: "ฝาขวดไม่ได้มีโอกาสหงายกับคว่ำเท่ากันเหมือนเหรียญ ต้องใช้ความถี่สัมพัทธ์จากการทดลอง" }
      - { match: 930, feedback: "บวก 800 ครั้งที่เพิ่มเข้าไปทั้งหมด ต้องคิดเป็นสัดส่วน $0.65 \\times 1{,}000$" }
    solution: "ความถี่สัมพัทธ์ $= \\tfrac{130}{200} = 0.65$ คาดว่าตกหงาย $0.65 \\times 1{,}000 = 650$ ครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.experimental.p010
    topics: [math.prob.experimental]
    difficulty: 3
    type: mcq
    stem: "นักเรียนสามกลุ่มทดลองหมุนวงล้อที่มีช่องสีแดงกว้างไม่เท่าช่องอื่น กลุ่ม ก หมุน 10 ครั้ง ได้แดงความถี่สัมพัทธ์ 0.7 กลุ่ม ข หมุน 100 ครั้ง ได้ 0.62 กลุ่ม ค หมุน 1,000 ครั้ง ได้ 0.588 ค่าใดน่าเชื่อถือที่สุดในการประมาณความน่าจะเป็นที่ได้สีแดง"
    choices:
      - { id: a, text: "0.588 ของกลุ่ม ค", correct: true }
      - { id: b, text: "0.7 ของกลุ่ม ก", feedback: "ทดลองแค่ 10 ครั้ง ผลแกว่งได้มาก ไม่ควรใช้เป็นค่าประมาณหลัก" }
      - { id: c, text: "ค่าเฉลี่ยของทั้งสามกลุ่ม $(0.7 + 0.62 + 0.588) \\div 3$", feedback: "การเฉลี่ยตรง ๆ ให้น้ำหนัก 10 ครั้งเท่ากับ 1,000 ครั้ง ถ้าจะรวมกันต้องนับจำนวนครั้งที่ได้แดงทั้งหมดหารด้วย 1,110" }
    hints:
      - "ยิ่งทดลองมากครั้ง ความถี่สัมพัทธ์ยิ่งเป็นอย่างไร"
      - "นึกถึงกฎจำนวนมาก"
    solution: "ความถี่สัมพัทธ์จากการทดลองจำนวนมากครั้งแปรผันน้อยกว่าและเข้าใกล้ความน่าจะเป็นจริงมากกว่า จึงใช้ 0.588 จากการหมุน 1,000 ครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.experimental.p011
    topics: [math.prob.experimental]
    difficulty: 3
    type: mcq
    stem: "ช่วงฤดูฝน โอกาสฝนตกในแต่ละวันเป็น 30% ต้องการจำลองว่าฝนตกหรือไม่ในแต่ละวัน วิธีใดถูกต้อง"
    choices:
      - { id: a, text: "สุ่มจำนวนเต็ม 1–10 ถ้าได้ 1, 2 หรือ 3 นับว่าฝนตก", correct: true }
      - { id: b, text: "โยนเหรียญ ได้หัวนับว่าฝนตก", feedback: "เหรียญให้โอกาส 50% ไม่ใช่ 30%" }
      - { id: c, text: "ทอยลูกเต๋า ได้ 1, 2 หรือ 3 นับว่าฝนตก", feedback: "ลูกเต๋าได้ 1–3 มีโอกาส $\\tfrac36 = 50\\%$ ไม่ใช่ 30%" }
      - { id: d, text: "ทอยลูกเต๋า ได้ 1 หรือ 2 นับว่าฝนตก", feedback: "โอกาส $\\tfrac26 \\approx 33\\%$ ใกล้เคียงแต่ไม่เท่ากับ 30%" }
    hints:
      - "โอกาสของผลสุ่มที่เลือกต้องเท่ากับ 30% พอดี"
      - "30% $= \\tfrac{3}{10}$"
    solution: "สุ่มจาก 1–10 มี 10 แบบเท่ากัน เลือก 3 แบบได้โอกาส $\\tfrac{3}{10} = 30\\%$ ตรงพอดี วิธีอื่นให้ 50% หรือประมาณ 33%"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.experimental.p012
    topics: [math.prob.experimental]
    difficulty: 3
    type: numeric
    stem: "วงล้อมีช่องสีน้ำเงินกินพื้นที่ $\\tfrac14$ ของวงล้อ ถ้าหมุน 80 ครั้ง คาดว่าจะได้สีน้ำเงินประมาณกี่ครั้ง (ตอบเป็นจำนวนครั้ง)"
    answer: { value: 20, unit: ครั้ง }
    hints:
      - "จำนวนครั้งที่คาด $= n \\times P$"
      - "คำนวณ $80 \\times \\tfrac14$"
    misconceptions:
      - { match: 320, feedback: "คูณด้วย 4 แทนการคูณด้วย $\\tfrac14$ จำนวนที่คาดต้องไม่เกินจำนวนครั้งที่หมุน" }
      - { match: 40, feedback: "ใช้โอกาส $\\tfrac12$ แต่ช่องสีน้ำเงินกินแค่หนึ่งในสี่" }
    solution: "คาดว่าได้สีน้ำเงิน $80 \\times \\tfrac14 = 20$ ครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.experimental.p013
    topics: [math.prob.experimental]
    difficulty: 4
    type: numeric
    stem: "สำรวจนักเรียน 120 คน พบว่า ดื่มทั้งชานมไข่มุกและกาแฟ 18 คน ดื่มชานมอย่างเดียว 42 คน ดื่มกาแฟอย่างเดียว 25 คน ไม่ดื่มทั้งสองอย่าง 35 คน ประมาณความน่าจะเป็นที่นักเรียนคนหนึ่งดื่มชานม และ กาแฟ (ตอบเป็นทศนิยม)"
    answer: { value: 0.15, tolerance: 0.005 }
    hints:
      - "\"และ\" คือต้องดื่มทั้งสองอย่าง"
      - "หารจำนวนคนที่ดื่มทั้งสองอย่างด้วยจำนวนคนทั้งหมด"
    misconceptions:
      - { match: 0.3, feedback: "หารด้วยจำนวนคนดื่มชานม (60) ข้อนี้ถามจากนักเรียนทั้งหมด 120 คน" }
      - { match: 0.7083, feedback: "นั่นคือ \"หรือ\" (อย่างน้อยหนึ่งอย่าง) ข้อนี้ถาม \"และ\"" }
    solution: "ดื่มทั้งสองอย่าง 18 คน ความถี่สัมพัทธ์ $= \\tfrac{18}{120} = 0.15$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.experimental.p014
    topics: [math.prob.experimental]
    difficulty: 4
    type: numeric
