problems:
  - id: chemistry.descriptive.oxygen-sulfur-halogens-noble-gases.p001
    topics: [chemistry.descriptive.oxygen-sulfur-halogens-noble-gases]
    difficulty: 1
    type: mcq
    stem: 'แก๊สมีตระกูลชนิดใดที่นิยมบรรจุในลูกโป่งลอยฟ้า เพราะเบาและไม่ติดไฟ'
    choices:
      - { id: a, text: 'ฮีเลียม (He)', correct: true, feedback: 'ถูก ฮีเลียมเบากว่าอากาศมากและไม่ติดไฟ จึงปลอดภัยกว่าไฮโดรเจนสำหรับลูกโป่ง' }
      - { id: b, text: 'ไฮโดรเจน (H₂)', feedback: 'ไฮโดรเจนเบามากแต่ติดไฟได้ จึงไม่ปลอดภัยสำหรับลูกโป่งลอยฟ้า' }
      - { id: c, text: 'ออกซิเจน (O₂)', feedback: 'ออกซิเจนหนักกว่าอากาศเล็กน้อยและไม่ทำให้ลูกโป่งลอย' }
      - { id: d, text: 'คลอรีน (Cl₂)', feedback: 'คลอรีนหนักกว่าอากาศมากและเป็นพิษ' }
    hints:
      - 'ดูว่าแก๊สชนิดใดเป็นแก๊สมีตระกูลและไม่ติดไฟ'
      - 'ความหนาแน่นของแก๊สที่น้อยกว่าอากาศทำให้ลอยได้'
    solution: 'ฮีเลียมเป็นแก๊สมีตระกูลที่เฉื่อยและมีความหนาแน่นต่ำ จึงใช้บรรจุลูกโป่งและบอลลูนได้โดยไม่ติดไฟ'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.oxygen-sulfur-halogens-noble-gases.p002
    topics: [chemistry.descriptive.oxygen-sulfur-halogens-noble-gases]
    difficulty: 1
    type: mcq
    stem: 'ในชั้นบรรยากาศสตราโตสเฟียร์ ออกซิเจนรูปใดช่วยกรองรังสีอัลตราไวโอเลตไม่ให้ลงสู่พื้นโลกมาก'
    choices:
      - { id: a, text: 'ออกซิเจนอะตอมเดี่ยว (O)', feedback: 'อะตอมเดี่ยวไม่เสถียรและไม่ทำหน้าที่กรองรังสีเป็นหลัก' }
      - { id: b, text: 'โอโซน (O₃)', correct: true, feedback: 'ถูก โอโซนดูดกลืนรังสี UV บางช่วงได้ดี ชั้นโอโซนจึงปกป้องสิ่งมีชีวิต' }
      - { id: c, text: 'ไนโตรเจนไดออกไซด์ (NO₂)', feedback: 'NO₂ ไม่ใช่สารกรองรังสีในชั้นนี้ และเป็นมลพิษ' }
      - { id: d, text: 'ไฮโดรเจนเปอร์ออกไซด์ (H₂O₂)', feedback: 'H₂O₂ ไม่ใช่รูปของออกซิเจนที่ทำหน้าที่กรองรังสี' }
    hints:
      - 'รูปของออกซิเจนที่มี 3 อะตอมต่อโมเลกุล'
      - 'สารนี้มีกลิ่นฉุนเมื่อเกิดฟ้าผ่า'
    solution: 'โอโซนเป็นออกซิเจน 3 อะตอม ดูดกลืนรังสี UV ที่เป็นอันตราย ชั้นโอโซนสตราโตสเฟียร์จึงสำคัญต่อสิ่งมีชีวิต'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.oxygen-sulfur-halogens-noble-gases.p003
    topics: [chemistry.descriptive.oxygen-sulfur-halogens-noble-gases]
    difficulty: 2
    type: numeric
    stem: 'สำหรับปฏิกิริยา $\mathrm{3O_2(g) \rightarrow 2O_3(g)}$ จาก $\Delta H^\circ_f$ ของ $\mathrm{O_3(g)}$ = +142.7 kJ/mol และของ $\mathrm{O_2(g)}$ = 0 จงหา $\Delta H^\circ_{rxn}$ ของปฏิกิริยานี้ (ตอบเป็น kJ)'
    answer: { value: 285.4, tolerance: 0.2, unit: kJ }
    hints:
      - 'ใช้สูตร ผลิตภัณฑ์ลบด้วยสารตั้งต้น โดยสัมประสิทธิ์ของ $\mathrm{O_3}$ คือ 2'
      - 'ออกซิเจนเป็นธาตุในสถานะมาตรฐาน จึงมี $\Delta H^\circ_f$ เป็นศูนย์'
    misconceptions:
      - { match: 142.7, feedback: 'ลืมคูณสัมประสิทธิ์ 2 ของ $\mathrm{O_3}$ ค่า 142.7 เป็นของ O₃ 1 โมลเท่านั้น' }
    solution: '$\Delta H^\circ_{rxn} = 2(+142.7) - 3(0) = +285.4$ kJ ปฏิกิริยาดูดความร้อน จึงเป็นเหตุผลว่าโอโซนไม่เสถียรเท่าออกซิเจน'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.oxygen-sulfur-halogens-noble-gases.p004
    topics: [chemistry.descriptive.oxygen-sulfur-halogens-noble-gases]
    difficulty: 2
    type: numeric
    stem: 'ถ่านหินที่มีกำมะถันเมื่อเผาไหม้จะได้แก๊ส $\mathrm{SO_2}$ ถ้าเผากำมะถัน 10.0 g ให้เป็น $\mathrm{SO_2}$ ทั้งหมด ที่ 25 °C และ 1 atm จะได้แก๊สกี่ลิตร กำหนด $M(\mathrm{S}) = 32.06$ g/mol และ $R = 0.08206$ L·atm/(mol·K) (ตอบเป็นลิตร)'
    answer: { value: 7.63, tolerance: 0.02, unit: L }
    hints:
      - 'หาจำนวนโมลของ S จากมวลและมวลโมลาร์'
      - 'ตามสมการ $\mathrm{S + O_2 \rightarrow SO_2}$ S 1 โมลให้ $\mathrm{SO_2}$ 1 โมล แล้วใช้ $V = nRT/P$ โดยเปลี่ยน 25 °C เป็น 298.15 K'
    misconceptions:
      - { match: 6.99, feedback: 'ใช้ปริมาตรโมลาร์ 22.4 L/mol ซึ่งเป็นค่าที่สภาวะมาตรฐาน STP (0 °C) แทนที่ 25 °C ทำให้ค่าต่ำกว่าจริง' }
    solution: '$n(\mathrm{S}) = 10.0 \div 32.06 = 0.3119$ mol ได้ $n(\mathrm{SO_2}) = 0.3119$ mol $V = 0.3119 \times 0.08206 \times 298.15 / 1.00 = 7.63$ L'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.oxygen-sulfur-halogens-noble-gases.p005
    topics: [chemistry.descriptive.oxygen-sulfur-halogens-noble-gases]
    difficulty: 2
    type: match
    stem: 'จับคู่ออกไซด์กับชนิดหรือสมบัติที่เหมาะสม'
    pairs:
      - { left: '$\mathrm{Na_2O}$', right: 'ออกไซด์เบส ละลายน้ำให้สารละลายเบส' }
      - { left: '$\mathrm{SO_3}$', right: 'ออกไซด์กรด ละลายน้ำให้กรดซัลฟิวริก' }
      - { left: '$\mathrm{Al_2O_3}$', right: 'ออกไซด์แอมโฟเทอริก ทำปฏิกิริยากับทั้งกรดและเบส' }
      - { left: '$\mathrm{H_2O_2}$', right: 'เปอร์ออกไซด์ที่มีออกซิเจนเลขออกซิเดชัน −1' }
    hints:
      - 'ดูว่าออกไซด์ของโลหะมักเป็นเบสหรือกรด'
      - 'อะลูมิเนียมออกไซด์ตอบสนองได้ทั้งกรดและเบส'
    solution: 'Na₂O เป็นออกไซด์เบส SO₃ เป็นออกไซด์กรด Al₂O₃ เป็นแอมโฟเทอริก และ H₂O₂ เป็นเปอร์ออกไซด์ที่ออกซิเจนมีเลขออกซิเดชัน −1'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.oxygen-sulfur-halogens-noble-gases.p006
    topics: [chemistry.descriptive.oxygen-sulfur-halogens-noble-gases]
    difficulty: 2
    type: mcq
    stem: 'ในกระบวนการคอนแทกต์ผลิตกรดซัลฟิวริก ขั้นที่เปลี่ยน $\mathrm{SO_2}$ เป็น $\mathrm{SO_3}$ ใช้ตัวเร่งชนิดใด'
    choices:
      - { id: a, text: 'วาเนเดียม(V) ออกไซด์ $\mathrm{V_2O_5}$', correct: true, feedback: 'ถูก ตัวเร่งนี้ช่วยให้การเปลี่ยน SO₂ เป็น SO₃ เกิดเร็วขึ้นที่อุณหภูมิและความดันที่เหมาะสม' }
      - { id: b, text: 'แพลทินัมบริสุทธิ์ที่ใช้ในการเผาแอมโมเนียเท่านั้น', feedback: 'แพลทินัมใช้ในการออกซิไดซ์แอมโมเนีย ไม่ใช่ขั้นนี้ของคอนแทกต์' }
      - { id: c, text: 'ไม่ต้องใช้ตัวเร่งเลย', feedback: 'ถ้าไม่มีตัวเร่ง ปฏิกิริยาช้ามากจนไม่คุ้มค่าในอุตสาหกรรม' }
      - { id: d, text: 'เกลือโซเดียมคลอไรด์', feedback: 'NaCl ไม่ใช่ตัวเร่งของขั้นนี้' }
    hints:
      - 'ตัวเร่งที่ใช้มีวาเนเดียมเป็นองค์ประกอบ'
      - 'ตัวเร่งไม่ถูกใช้หมดในปฏิกิริยา'
    solution: 'การออกซิไดซ์ SO₂ เป็น SO₃ ในกระบวนการคอนแทกต์ใช้ตัวเร่ง V₂O₅ ที่อุณหภูมิประมาณ 400–450 °C'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.oxygen-sulfur-halogens-noble-gases.p007
    topics: [chemistry.descriptive.oxygen-sulfur-halogens-noble-gases]
    difficulty: 2
    type: text
    stem: 'เขียนสูตรเคมีของกรดซัลฟิวริก ซึ่งเป็นกรดที่ผลิตมากที่สุดในอุตสาหกรรม (พิมพ์ตัวเลขห้อยเป็นตัวเลขปกติ เช่น CO2)'
    accepted: ['H2SO4', 'H₂SO₄']
    misconceptions:
      - { match: 'H2SO3', feedback: 'H₂SO₃ คือกรดซัลฟิวรัส ซึ่งไม่เสถียรและไม่ใช่กรดที่ผลิตมากที่สุดในอุตสาหกรรม' }
    hints:
      - 'กรดนี้มีไฮโดรเจน 2 อะตอม ซัลเฟอร์ 1 อะตอม และออกซิเจน 4 อะตอม'
      - 'เป็นกรดแก่ที่ใช้ในแบตเตอรี่รถยนต์'
    solution: 'กรดซัลฟิวริกมีสูตร $\mathrm{H_2SO_4}$ ใช้ในแบตเตอรี่ตะกั่ว-กรดและการผลิตปุ๋ย'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.oxygen-sulfur-halogens-noble-gases.p008
    topics: [chemistry.descriptive.oxygen-sulfur-halogens-noble-gases]
    difficulty: 3
    type: numeric
    stem: 'จากกำมะถัน 250 kg ผลิตกรดซัลฟิวริกได้ตามทฤษฎีกี่กิโลกรัม (ทุกอะตอม S ไปอยู่ใน $\mathrm{H_2SO_4}$) กำหนด $M(\mathrm{S}) = 32.06$ และ $M(\mathrm{H_2SO_4}) = 98.07$ g/mol (ตอบเป็น kg)'
    answer: { value: 764.7, tolerance: 0.3, unit: kg }
    hints:
      - 'หาจำนวนโมลของ S จาก 250 kg (แปลงเป็น g ก่อน)'
      - 'S 1 อะตอมไปอยู่ใน $\mathrm{H_2SO_4}$ 1 โมเลกุล จึงได้อัตราส่วน 1 : 1'
    misconceptions:
      - { match: 1529.5, feedback: 'คิดว่า S 1 โมลให้ H₂SO₄ 2 โมล ทั้งที่แต่ละโมเลกุลมีซัลเฟอร์เพียงหนึ่งอะตอม' }
    solution: '$n(\mathrm{S}) = 250000 \div 32.06 = 7798$ mol ได้ $n(\mathrm{H_2SO_4}) = 7798$ mol มวล $= 7798 \times 98.07 = 764\,700$ g $= 764.7$ kg ในทางปฏิบัติได้น้อยกว่าเพราะสูญเสียระหว่างขั้นตอน'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.oxygen-sulfur-halogens-noble-gases.p009
    topics: [chemistry.descriptive.oxygen-sulfur-halogens-noble-gases]
    difficulty: 3
    type: numeric
    stem: 'ในโรงงานผลิตคลอรีนด้วยการอิเล็กโทรไลซิสสารละลาย NaCl อิ่มตัว ใช้กระแส 5.00 A เป็นเวลา 1.00 ชั่วโมง ได้แก๊ส $\mathrm{Cl_2}$ กี่กรัม ปฏิกิริยาที่แอโนดคือ $\mathrm{2Cl^{-} \rightarrow Cl_2 + 2e^{-}}$ กำหนด $F = 96485$ C/mol และ $M(\mathrm{Cl_2}) = 70.90$ g/mol (ตอบเป็นกรัม)'
    answer: { value: 6.61, tolerance: 0.02, unit: g }
    hints:
      - 'ประจุรวม $Q = I \times t$ โดยแปลงชั่วโมงเป็นวินาทีก่อน'
      - 'Cl₂ 1 โมลต้องใช้อิเล็กตรอน 2 โมล เพราะ Cl⁻ ให้อิเล็กตรอน 1 ตัวต่อหนึ่งอะตอม'
    misconceptions:
      - { match: 13.23, feedback: 'คิดว่า Cl₂ 1 โมลใช้อิเล็กตรอนเพียง 1 โมล ทั้งที่ต้องใช้ 2 โมล' }
    solution: '$Q = 5.00 \times 3600 = 18000$ C $n_e = 18000 \div 96485 = 0.1866$ mol $n(\mathrm{Cl_2}) = 0.1866 \div 2 = 0.09328$ mol มวล $= 0.09328 \times 70.90 = 6.61$ g'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.oxygen-sulfur-halogens-noble-gases.p010
    topics: [chemistry.descriptive.oxygen-sulfur-halogens-noble-gases]
    difficulty: 3
    type: mcq
    stem: 'เหตุใดยาสีฟันจึงมักมีฟลูออไรด์เป็นส่วนผสม'
    choices:
      - { id: a, text: 'ฟลูออไรด์ช่วยให้เคลือบฟันแข็งแรงขึ้นและลดการผุของฟัน', correct: true, feedback: 'ถูก ไอออนฟลูออไรด์ช่วยเสริมแร่ธาตุในเคลือบฟัน ปริมาณที่ใช้ตามมาตรฐานทั่วไปจึงปลอดภัย' }
      - { id: b, text: 'ฟลูออไรด์ทำให้ฟันขาวขึ้นทันทีโดยไม่ต้องแปรง', feedback: 'ฟลูออไรด์ไม่ได้ทำให้ฟันขาวทันที และการแปรงฟันยังจำเป็น' }
      - { id: c, text: 'ฟลูออไรด์ทำให้ปากมีกลิ่นหอมเป็นเวลานาน', feedback: 'ฟลูออไรด์ไม่ได้เป็นสารแต่งกลิ่นหลัก' }
      - { id: d, text: 'ฟลูออไรด์ฆ่าเชื้อทั้งหมดในปาก', feedback: 'ฟลูออไรด์ไม่ได้ฆ่าเชื้อทั้งหมด ประสิทธิภาพหลักคือการเสริมความแข็งแรงของเคลือบฟัน' }
    hints:
      - 'ดูว่าฟลูออไรด์ทำงานกับส่วนใดของฟัน'
      - 'ฟลูออไรด์เกี่ยวข้องกับการป้องกันฟันผุ'
    solution: 'ฟลูออไรด์เข้าไปแทนที่ส่วนของไฮดรอกซีอะพาไทต์ในเคลือบฟันเป็นฟลูออโรอะพาไทต์ ซึ่งทนกรดได้ดีกว่า'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.oxygen-sulfur-halogens-noble-gases.p011
    topics: [chemistry.descriptive.oxygen-sulfur-halogens-noble-gases]
    difficulty: 3
    type: numeric
    stem: 'เมื่อให้ $\mathrm{Cl_2}$ 5.00 g ทำปฏิกิริยากับ $\mathrm{KBr}$ เกินพอ ตามสมการ $\mathrm{Cl_2 + 2KBr \rightarrow 2KCl + Br_2}$ จะได้ $\mathrm{Br_2}$ กี่กรัม กำหนด $M(\mathrm{Cl_2}) = 70.90$ และ $M(\mathrm{Br_2}) = 159.81$ g/mol (ตอบเป็นกรัม)'
    answer: { value: 11.27, tolerance: 0.02, unit: g }
    hints:
      - 'หาจำนวนโมลของ $\mathrm{Cl_2}$ จากมวลและมวลโมลาร์'
      - 'ตามสมการ $\mathrm{Cl_2}$ 1 โมลให้ $\mathrm{Br_2}$ 1 โมล'
    misconceptions:
      - { match: 22.54, feedback: 'คิดว่า Cl₂ 1 โมลให้ Br₂ 2 โมล ทั้งที่สมการให้ Br₂ 1 โมลต่อ Cl₂ 1 โมล' }
    solution: '$n(\mathrm{Cl_2}) = 5.00 \div 70.90 = 0.07052$ mol ได้ $n(\mathrm{Br_2}) = 0.07052$ mol มวล $= 0.07052 \times 159.81 = 11.27$ g'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.descriptive.oxygen-sulfur-halogens-noble-gases.p012
    topics: [chemistry.descriptive.oxygen-sulfur-halogens-noble-gases]
    difficulty: 3
    type: numeric
    stem: 'ลูกโป่งบรรจุแก๊ส $\mathrm{He}$ 10.0 g ที่ 25 °C และ 1 atm จะมีปริมาตรกี่ลิตร กำหนด $M(\mathrm{He}) = 4.003$ g/mol และ $R = 0.08206$ L·atm/(mol·K) (ตอบเป็นลิตร)'
    answer: { value: 61.1, tolerance: 0.2, unit: L }
    hints:
      - 'หาจำนวนโมลของ He จากมวลและมวลโมลาร์'
      - 'ใช้ $V = nRT/P$ โดยเปลี่ยน 25 °C เป็นเคลวินก่อน'
    misconceptions:
      - { match: 56.0, feedback: 'ใช้ 0 °C (273.15 K) แทน 25 °C (298.15 K) ทำให้ปริมาตรต่ำกว่าจริง' }
    solution: '$n(\mathrm{He}) = 10.0 \div 4.003 = 2.498$ mol $V = 2.498 \times 0.08206 \times 298.15 / 1.00 = 61.1$ L'
