problems:
  - id: math.geometry.quadrilaterals.p001
    topics: [math.geometry.quadrilaterals]
    difficulty: 1
    type: mcq
    stem: "รูปสี่เหลี่ยมที่มีด้านยาวเท่ากันทุกด้าน และทุกมุมเป็นมุมฉาก คือรูปใด"
    choices:
      - { id: a, text: "สี่เหลี่ยมจัตุรัส", correct: true }
      - { id: b, text: "สี่เหลี่ยมผืนผ้า", feedback: "สี่เหลี่ยมผืนผ้ามีมุมฉากทุกมุม แต่ด้านไม่จำเป็นต้องยาวเท่ากันทุกด้าน ข้อนี้บอกทั้งสองสมบัติ" }
      - { id: c, text: "สี่เหลี่ยมขนมเปียกปูน", feedback: "ด้านเท่ากันทุกด้าน แต่มุมไม่จำเป็นต้องเป็นมุมฉาก ข้อนี้บอกทั้งสองสมบัติ" }
      - { id: d, text: "รูปว่าว", feedback: "รูปว่าวมีด้านที่ติดกันเท่ากันสองคู่ ไม่จำเป็นต้องเท่ากันทุกด้าน" }
    hints:
      - "หารูปที่มีทั้งสองสมบัติพร้อมกัน"
      - "ด้านเท่ากันทุกด้านคือขนมเปียกปูน มุมฉากทุกมุมคือผืนผ้า รูปใดเป็นทั้งสองแบบ"
    solution: "รูปที่ด้านเท่ากันทุกด้านและมุมฉากทุกมุมคือสี่เหลี่ยมจัตุรัส ซึ่งเป็นทั้งสี่เหลี่ยมผืนผ้าและสี่เหลี่ยมขนมเปียกปูน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.quadrilaterals.p002
    topics: [math.geometry.quadrilaterals]
    difficulty: 1
    type: match
    stem: "จับคู่ชนิดของรูปสี่เหลี่ยมกับสมบัติที่ใช้นิยาม"
    pairs:
      - { left: "สี่เหลี่ยมด้านขนาน", right: "ด้านตรงข้ามขนานกันสองคู่" }
      - { left: "สี่เหลี่ยมคางหมู", right: "มีด้านขนานกันเพียงคู่เดียว" }
      - { left: "รูปว่าว", right: "ด้านที่อยู่ติดกันยาวเท่ากันสองคู่" }
      - { left: "สี่เหลี่ยมผืนผ้า", right: "สี่เหลี่ยมด้านขนานที่มีมุมฉากทั้งสี่มุม" }
      - { left: "สี่เหลี่ยมขนมเปียกปูน", right: "สี่เหลี่ยมด้านขนานที่ด้านยาวเท่ากันทุกด้าน" }
    hints:
      - "คางหมูกับด้านขนานต่างกันที่จำนวนคู่ของด้านขนาน"
      - "รูปว่าวพูดถึงด้านที่อยู่ติดกัน ไม่ใช่ด้านตรงข้าม"
    solution: "ด้านขนาน: ด้านตรงข้ามขนานสองคู่ คางหมู: ขนานเพียงคู่เดียว ว่าว: ด้านติดกันเท่ากันสองคู่ ผืนผ้า: ด้านขนานที่มีมุมฉาก ขนมเปียกปูน: ด้านขนานที่ด้านเท่ากันหมด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.quadrilaterals.p003
    topics: [math.geometry.quadrilaterals]
    difficulty: 2
    type: numeric
    stem: "กระเบื้องปูพื้นศาลาวัดเป็นรูปสี่เหลี่ยมขนมเปียกปูน ยาวด้านละ $7.5\\ \\mathrm{cm}$ มีความยาวรอบรูปกี่เซนติเมตร (ตอบในหน่วย cm)"
    answer: { value: 30, unit: cm }
    hints:
      - "สี่เหลี่ยมขนมเปียกปูนมีด้านยาวเท่ากันกี่ด้าน"
      - "ความยาวรอบรูป = ผลบวกของด้านทั้งหมด"
    misconceptions:
      - { match: 15, feedback: "บวกแค่สองด้าน รูปสี่เหลี่ยมมี 4 ด้าน" }
      - { match: 56.25, feedback: "นั่นคือ $7.5 \\times 7.5$ ความยาวรอบรูปคือผลบวกของด้าน ไม่ใช่ผลคูณ" }
    solution: "ด้านยาวเท่ากันทั้ง 4 ด้าน ความยาวรอบรูป $= 4 \\times 7.5 = 30\\ \\mathrm{cm}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.quadrilaterals.p004
    topics: [math.geometry.quadrilaterals]
    difficulty: 2
    type: numeric
    stem: "สี่เหลี่ยมด้านขนาน $ABCD$ มีมุม $A = 65^\\circ$ มุม $D$ ซึ่งอยู่ติดกับมุม $A$ มีขนาดกี่องศา (ตอบในหน่วยองศา)"
    figure: { src: parallelogram-angle.svg, alt: "สี่เหลี่ยมด้านขนาน ABCD ฐาน AB อยู่ด้านล่าง ด้าน AD เอียงขึ้นไปทางขวา มุม A ระบุว่า 65 องศา มุม D ที่ปลายบนของด้าน AD ระบุว่า x" }
    answer: { value: 115, unit: องศา }
    hints:
      - "$AB \\parallel DC$ และ $AD$ เป็นเส้นตัด"
      - "มุมที่อยู่ติดกันในสี่เหลี่ยมด้านขนานรวมกันได้ $180^\\circ$"
    misconceptions:
      - { match: 65, feedback: "มุมที่เท่ากับ $65^\\circ$ คือมุมตรงข้าม (มุม $C$) มุม $D$ อยู่ติดกับมุม $A$" }
      - { match: 25, feedback: "มุมที่ติดกันรวมกันได้ $180^\\circ$ ไม่ใช่ $90^\\circ$" }
    solution: "มุมภายในที่อยู่บนข้างเดียวกันของเส้นตัดระหว่างเส้นขนานรวมกันได้ $180^\\circ$ ได้ $x = 180^\\circ - 65^\\circ = 115^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.quadrilaterals.p005
    topics: [math.geometry.quadrilaterals]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อความใดจริง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "สี่เหลี่ยมจัตุรัสทุกรูปเป็นสี่เหลี่ยมผืนผ้า", correct: true }
      - { id: b, text: "สี่เหลี่ยมผืนผ้าทุกรูปเป็นสี่เหลี่ยมจัตุรัส", feedback: "สี่เหลี่ยมผืนผ้า 3 × 5 มีด้านไม่เท่ากัน จึงไม่ใช่จัตุรัส" }
      - { id: c, text: "สี่เหลี่ยมขนมเปียกปูนทุกรูปเป็นสี่เหลี่ยมด้านขนาน", correct: true }
      - { id: d, text: "สี่เหลี่ยมด้านขนานทุกรูปเป็นสี่เหลี่ยมขนมเปียกปูน", feedback: "สี่เหลี่ยมด้านขนานที่ด้านยาว 4 กับ 7 ไม่ได้มีด้านเท่ากันหมด" }
      - { id: e, text: "สี่เหลี่ยมขนมเปียกปูนทุกรูปเป็นรูปว่าว", correct: true }
    hints:
      - "\"ทุกรูปของ X เป็น Y\" จริงเมื่อ X มีสมบัติครบทุกข้อของ Y"
      - "ลองหาตัวอย่างค้าน ถ้าหาได้แม้รูปเดียว ข้อความนั้นเท็จ"
    solution: "จัตุรัสมีมุมฉากสี่มุมจึงเป็นผืนผ้า ✓ ขนมเปียกปูนมีด้านตรงข้ามขนานจึงเป็นด้านขนาน ✓ ขนมเปียกปูนมีด้านติดกันเท่ากันสองคู่จึงเป็นว่าว ✓ ส่วนผืนผ้า 3 × 5 และด้านขนานที่ด้าน 4 กับ 7 เป็นตัวอย่างค้านของอีกสองข้อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.quadrilaterals.p006
    topics: [math.geometry.quadrilaterals]
    difficulty: 2
    type: numeric
    stem: "สี่เหลี่ยมด้านขนานในภาพมีพื้นที่กี่ตารางเซนติเมตร (ตอบในหน่วย cm²)"
    figure: { src: parallelogram-area.svg, alt: "สี่เหลี่ยมด้านขนาน ฐานด้านล่างยาว 12 cm ด้านเอียงทางซ้ายยาว 9 cm มีเส้นประตั้งฉากจากมุมบนซ้ายลงมาที่ฐาน ยาว 7 cm" }
    answer: { value: 84, unit: "cm²" }
    hints:
      - "พื้นที่สี่เหลี่ยมด้านขนาน = ฐาน × ความสูง"
      - "ความสูงคือเส้นที่ตั้งฉากกับฐาน ไม่ใช่ด้านเอียง"
    misconceptions:
      - { match: 108, feedback: "ใช้ด้านเอียง 9 cm แทนความสูง ความสูงต้องเป็นระยะตั้งฉาก 7 cm" }
      - { match: 42, feedback: "คูณ $\\tfrac12$ เหมือนสามเหลี่ยม สี่เหลี่ยมด้านขนานไม่ต้องหารสอง" }
    solution: "พื้นที่ $= 12 \\times 7 = 84\\ \\mathrm{cm^2}$ (ด้านเอียง 9 cm ไม่ได้ใช้)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.quadrilaterals.p007
    topics: [math.geometry.quadrilaterals]
    difficulty: 3
    type: numeric
    stem: "รูปว่าวในภาพมีเส้นทแยงมุมยาว $16\\ \\mathrm{cm}$ และ $10\\ \\mathrm{cm}$ มีพื้นที่กี่ตารางเซนติเมตร (ตอบในหน่วย cm²)"
    figure: { src: kite-diagonals.svg, alt: "รูปว่าว เส้นทแยงมุมแนวตั้งยาว 16 cm เส้นทแยงมุมแนวนอนยาว 10 cm ตัดกันเป็นมุมฉาก" }
    answer: { value: 80, unit: "cm²" }
    hints:
      - "พื้นที่รูปว่าวหาได้จากเส้นทแยงมุมสองเส้น"
      - "คูณเส้นทแยงมุมทั้งสองแล้วหารด้วย 2"
    misconceptions:
      - { match: 160, feedback: "นั่นคือพื้นที่ของสี่เหลี่ยมผืนผ้าที่ล้อมรอบ รูปว่าวกินพื้นที่แค่ครึ่งหนึ่ง" }
      - { match: 26, feedback: "บวกเส้นทแยงมุม ต้องคูณกันแล้วหารด้วย 2" }
    solution: "พื้นที่ $= \\tfrac12 \\times 16 \\times 10 = 80\\ \\mathrm{cm^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.quadrilaterals.p008
    topics: [math.geometry.quadrilaterals]
    difficulty: 3
    type: numeric
    stem: "ลุงทำว่าวปักเป้า โครงเป็นไม้ไผ่สองอันไขว้กันตั้งฉาก ยาว $60\\ \\mathrm{cm}$ และ $45\\ \\mathrm{cm}$ ตัวว่าวเป็นรูปว่าวที่มีไม้สองอันนี้เป็นเส้นทแยงมุม ต้องใช้กระดาษอย่างน้อยกี่ตารางเซนติเมตร (ไม่คิดส่วนที่พับขอบ ตอบในหน่วย cm²)"
    answer: { value: 1350, unit: "cm²" }
    hints:
      - "ไม้สองอันคือเส้นทแยงมุมของรูปว่าว"
      - "พื้นที่ $= \\tfrac12 \\times d_1 \\times d_2$"
    misconceptions:
      - { match: 2700, feedback: "ลืมคูณ $\\tfrac12$ นั่นคือพื้นที่สี่เหลี่ยมผืนผ้าที่ล้อมรอบว่าว" }
      - { match: 210, feedback: "นั่นคือ $2 \\times (60 + 45)$ ซึ่งเป็นความยาว ไม่ใช่พื้นที่" }
    solution: "พื้นที่ $= \\tfrac12 \\times 60 \\times 45 = 1{,}350\\ \\mathrm{cm^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.quadrilaterals.p009
    topics: [math.geometry.quadrilaterals]
    difficulty: 3
    type: mcq
    stem: "รูปสี่เหลี่ยมรูปหนึ่งมีเส้นทแยงมุมตั้งฉากกัน แบ่งครึ่งซึ่งกันและกัน แต่ยาวไม่เท่ากัน รูปนี้คือรูปใด"
    choices:
      - { id: a, text: "สี่เหลี่ยมขนมเปียกปูน (ที่ไม่ใช่จัตุรัส)", correct: true }
      - { id: b, text: "สี่เหลี่ยมจัตุรัส", feedback: "เส้นทแยงมุมของจัตุรัสยาวเท่ากัน แต่ข้อนี้ยาวไม่เท่ากัน" }
      - { id: c, text: "สี่เหลี่ยมผืนผ้า (ที่ไม่ใช่จัตุรัส)", feedback: "เส้นทแยงมุมของผืนผ้ายาวเท่ากันและไม่ตั้งฉากกัน (ยกเว้นจัตุรัส)" }
      - { id: d, text: "รูปว่าว (ที่ไม่ใช่ขนมเปียกปูน)", feedback: "เส้นทแยงมุมของรูปว่าวตั้งฉากกัน แต่มีเส้นเดียวที่ถูกแบ่งครึ่ง ไม่ได้แบ่งครึ่งซึ่งกันและกัน" }
    hints:
      - "แบ่งครึ่งซึ่งกันและกัน บอกว่าเป็นสี่เหลี่ยมด้านขนาน"
      - "ตั้งฉากกันเพิ่มเข้ามา แต่ยาวไม่เท่ากัน ตัดจัตุรัสออก"
    solution: "เส้นทแยงมุมแบ่งครึ่งกัน → สี่เหลี่ยมด้านขนาน ตั้งฉากกัน → ขนมเปียกปูน ยาวไม่เท่ากัน → ไม่ใช่จัตุรัส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.quadrilaterals.p010
    topics: [math.geometry.quadrilaterals]
    difficulty: 3
    type: order
    stem: "เรียงจากชนิดที่กว้างที่สุดไปยังชนิดที่เจาะจงที่สุด (ชนิดถัดไปเป็นกรณีพิเศษของชนิดก่อนหน้า)"
    items:
      - "รูปสี่เหลี่ยม"
      - "สี่เหลี่ยมด้านขนาน"
      - "สี่เหลี่ยมขนมเปียกปูน"
      - "สี่เหลี่ยมจัตุรัส"
    hints:
      - "ชนิดที่กว้างกว่ามีเงื่อนไขน้อยกว่า"
      - "จัตุรัสมีเงื่อนไขมากที่สุด เพราะต้องมีทั้งด้านเท่ากันและมุมฉาก"
    solution: "รูปสี่เหลี่ยม → (ด้านตรงข้ามขนานสองคู่) สี่เหลี่ยมด้านขนาน → (ด้านเท่ากันหมด) ขนมเปียกปูน → (มุมฉาก) จัตุรัส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.quadrilaterals.p011
    topics: [math.geometry.quadrilaterals]
    difficulty: 3
    type: mcq
    stem: "สมบัติใดเป็นจริงกับสี่เหลี่ยมด้านขนาน ทุกรูป"
    choices:
      - { id: a, text: "เส้นทแยงมุมแบ่งครึ่งซึ่งกันและกัน", correct: true }
      - { id: b, text: "เส้นทแยงมุมยาวเท่ากัน", feedback: "จริงเฉพาะสี่เหลี่ยมผืนผ้า (รวมจัตุรัส) สี่เหลี่ยมด้านขนานที่เอียงมีเส้นทแยงมุมยาวหนึ่งเส้นสั้นหนึ่งเส้น" }
      - { id: c, text: "เส้นทแยงมุมตั้งฉากกัน", feedback: "จริงเฉพาะสี่เหลี่ยมขนมเปียกปูน (รวมจัตุรัส)" }
      - { id: d, text: "มุมทุกมุมเท่ากัน", feedback: "จริงเฉพาะสี่เหลี่ยมผืนผ้า สี่เหลี่ยมด้านขนานทั่วไปมีแค่มุมตรงข้ามที่เท่ากัน" }
    hints:
      - "นึกถึงสี่เหลี่ยมด้านขนานที่เอียงมาก ๆ ไม่ใช่ผืนผ้าหรือขนมเปียกปูน"
      - "สมบัติที่ถูกต้องต้องจริงกับรูปนั้นด้วย"
    solution: "สี่เหลี่ยมด้านขนานทุกรูปมีเส้นทแยงมุมแบ่งครึ่งซึ่งกันและกัน ส่วนเส้นทแยงมุมเท่ากัน ตั้งฉาก หรือมุมเท่ากันหมด เป็นสมบัติของชนิดพิเศษเท่านั้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.quadrilaterals.p012
    topics: [math.geometry.quadrilaterals]
    difficulty: 3
    type: expression
    stem: "รูปว่าวมีเส้นทแยงมุมยาว $p$ และ $q$ เขียนพื้นที่ $A$ ในรูปของ $p$ และ $q$"
    prefix: "A ="
    answer: { latex: "\\frac{pq}{2}", variables: [p, q] }
    hints:
      - "รูปว่าวอยู่ในสี่เหลี่ยมผืนผ้าที่กว้าง $p$ ยาว $q$"
      - "รูปว่าวกินพื้นที่ครึ่งหนึ่งของสี่เหลี่ยมผืนผ้านั้น"
    misconceptions:
      - { match: "pq", feedback: "นั่นคือพื้นที่สี่เหลี่ยมผืนผ้าที่ล้อมรอบ รูปว่าวมีพื้นที่ครึ่งหนึ่ง" }
      - { match: "\\frac{p+q}{2}", feedback: "พื้นที่ต้องเกิดจากการคูณความยาวสองค่า ไม่ใช่การบวก" }
    solution: "สี่เหลี่ยมผืนผ้าที่ล้อมรอบมีพื้นที่ $pq$ รูปว่าวกินครึ่งหนึ่ง จึงได้ $A = \\tfrac12 pq$"
