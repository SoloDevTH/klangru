id: computer.data.data-processing
subject: computer
title: { th: การรวบรวม ประมวลผล และนำเสนอข้อมูล, en: "Collecting, processing and presenting data" }
summary: วงจรชีวิตของข้อมูล เก็บข้อมูลปฐมภูมิด้วยเครื่องมือดิจิทัล ทำความสะอาดและตรวจสอบข้อมูล ใช้สูตรในตารางคำนวณ นำเสนอแบบโต้ตอบ และสร้างและปรับแบบจำลองจากข้อมูล
difficulty: 3
minutes: 40
prerequisites: [computer.data.digital-data-basics, math.stats.data-display]
encompasses:
  - { id: computer.data.digital-data-basics, weight: 0.3 }
  - { id: math.stats.data-display, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: data-lifecycle.svg
    alt: "วงจรชีวิตของข้อมูลหกขั้นเรียงเป็นวงตามเข็มนาฬิกา ตรงกลางเขียนว่าข้อมูล ขั้น 1 สร้างและเก็บรวบรวม เช่น แบบสอบถาม เซนเซอร์ ขั้น 2 จัดเก็บ เช่น ตารางคำนวณ ฐานข้อมูล ขั้น 3 ทำความสะอาด ตรวจ แก้ แปลงรูป ขั้น 4 ประมวลผลและวิเคราะห์ ใช้สูตร กรอง สรุป ขั้น 5 นำเสนอและใช้ ด้วยแผนภูมิและข้อสรุป ขั้น 6 เก็บรักษาหรือทำลาย สำรอง หรือลบเมื่อหมดความจำเป็น แล้ววนกลับไปขั้น 1"
    caption: "ข้อมูลทุกชุดผ่านวงจรนี้ ตั้งแต่เกิดจนถูกลบ"
  - type: worked-example
    title: ทำความสะอาดข้อมูลที่หน่วยไม่ตรงกัน
    problem: "ครูให้นักเรียน 6 คนกรอกส่วนสูงในแบบฟอร์มออนไลน์ ได้ 152, 1.48, 160, 157, 1.61, 155 ส่วนสูงเฉลี่ยเป็นกี่เซนติเมตร"
    steps:
      - text: "ตรวจข้อมูลก่อนคำนวณ: ค่า 1.48 และ 1.61 เล็กผิดปกติ ไม่มีนักเรียนสูง 1.48 เซนติเมตร แสดงว่าสองคนนี้กรอกเป็นเมตร"
        why: "ถ้าหาค่าเฉลี่ยทันทีจะได้ราว 104.5 เซนติเมตร ซึ่งเป็นไปไม่ได้สำหรับนักเรียนกลุ่มนี้"
      - text: "แปลงให้เป็นหน่วยเดียวกัน: 1.48 เมตร = 148 เซนติเมตร และ 1.61 เมตร = 161 เซนติเมตร"
      - text: "หาค่าเฉลี่ย: (152 + 148 + 160 + 157 + 161 + 155) ÷ 6 = 933 ÷ 6 = 155.5 เซนติเมตร"
      - text: "ป้องกันครั้งหน้า: ตั้งกฎตรวจสอบในแบบฟอร์มให้รับเฉพาะตัวเลขระหว่าง 100 ถึง 200 และเขียนหน่วยไว้ข้างช่อง"
        why: "การตรวจตั้งแต่ตอนเก็บข้อมูลง่ายกว่ามาแก้ทีหลัง"
    answer: "ส่วนสูงเฉลี่ย 155.5 เซนติเมตร"
  - { type: check, problem: computer.data.data-processing.p005, prompt: "จับคู่ปัญหาของข้อมูลกับวิธีแก้" }
  - type: figure
    src: scatter-model.svg
    alt: "แผนภาพการกระจาย แกนนอนคืออุณหภูมิสูงสุดของวัน 27 ถึง 37 องศาเซลเซียส แกนตั้งคือจำนวนแก้วที่ขายได้ 0 ถึง 160 มีจุดข้อมูล 9 จุดที่เรียงขึ้นเป็นแนวเส้นตรง ได้แก่ 28 องศา 40 แก้ว 29 องศา 45 แก้ว 30 องศา 62 แก้ว 31 องศา 67 แก้ว 32 องศา 87 แก้ว 33 องศา 97 แก้ว 34 องศา 106 แก้ว 35 องศา 124 แก้ว 36 องศา 131 แก้ว เส้นประสีน้ำเงินคือแบบจำลอง แก้ว เท่ากับ 12 คูณอุณหภูมิ ลบ 300 ผ่านใกล้จุดเหล่านี้ มีจุดสีแดงหนึ่งจุดที่ 31 องศา 140 แก้ว ห่างจากเส้นมาก มีป้ายว่า วันกีฬาสี ค่าผิดปกติ"
    caption: "แบบจำลองเส้นตรงอธิบายข้อมูลส่วนใหญ่ได้ดี ยกเว้นวันกีฬาสี"
  - type: worked-example
    title: ทดสอบแบบจำลองกับข้อมูลจริง
    problem: "ใช้แบบจำลอง แก้ว = 12 × อุณหภูมิ − 300 คาดการณ์ยอดขายของวันที่ 29, 32 และ 35 °C แล้วเทียบกับยอดจริง 45, 87 และ 124 แก้ว และอธิบายวันกีฬาสีที่ 31 °C ขายได้ 140 แก้ว"
    steps:
      - text: "คาดการณ์: 12 × 29 − 300 = 48 แก้ว, 12 × 32 − 300 = 84 แก้ว, 12 × 35 − 300 = 120 แก้ว"
      - text: "ความคลาดเคลื่อน (จริง − คาด): 45 − 48 = −3, 87 − 84 = +3, 124 − 120 = +4 คลาดเคลื่อนเฉลี่ยแบบไม่คิดเครื่องหมาย (3 + 3 + 4) ÷ 3 ≈ 3.3 แก้ว ถือว่าแม่นพอสำหรับเตรียมวัตถุดิบ"
        why: "ใช้ค่าสัมบูรณ์เพราะถ้าบวกเลขบวกกับเลขลบตรง ๆ จะหักล้างกันจนดูเหมือนแบบจำลองแม่นกว่าความจริง"
      - text: "วันกีฬาสี: แบบจำลองคาด 12 × 31 − 300 = 72 แก้ว แต่ขายได้ 140 แก้ว ต่างกัน 68 แก้ว เป็นค่าผิดปกติ"
      - text: "หาสาเหตุ: วันนั้นมีคนในโรงเรียนมากกว่าปกติ ไม่ใช่ข้อมูลผิด จึงไม่ลบ แต่ปรับแบบจำลองโดยเพิ่มตัวแปร \"วันที่มีกิจกรรม\" หรือคาดการณ์วันแบบนี้แยกต่างหาก"
        why: "ค่าผิดปกติที่เกิดจริงบอกว่าแบบจำลองยังขาดปัจจัยบางอย่าง"
    answer: "แบบจำลองแม่นสำหรับวันปกติ (คลาดเคลื่อนราว 3 แก้ว) แต่คาดวันกีฬาสีต่ำไป 68 แก้ว ควรเพิ่มปัจจัยวันที่มีกิจกรรมเข้าไปในแบบจำลอง"
  - { type: check, problem: computer.data.data-processing.p011, prompt: "ลองใช้แบบจำลองคาดการณ์ด้วยตัวเอง" }
glossary:
  - { term: ข้อมูลปฐมภูมิ (primary data), definition: "ข้อมูลที่ผู้ใช้เก็บรวบรวมเองโดยตรง เช่น จากแบบสอบถาม การทดลอง หรือเซนเซอร์" }
  - { term: การตรวจสอบความถูกต้อง (validation), definition: "กฎที่ตรวจข้อมูลตอนกรอก เช่น บังคับตอบ ตรวจช่วง ตรวจชนิด หรือให้เลือกจากรายการ" }
  - { term: การทำความสะอาดข้อมูล (data cleaning), definition: "การหาและแก้แถวซ้ำ ค่าว่าง ค่าที่เป็นไปไม่ได้ และรูปแบบที่ไม่ตรงกัน ก่อนนำข้อมูลไปวิเคราะห์" }
  - { term: ค่าผิดปกติ (outlier), definition: "ค่าที่ต่างจากข้อมูลส่วนใหญ่มาก อาจเป็นความผิดพลาดหรือเหตุการณ์จริงที่น่าสนใจ" }
  - { term: ตารางคำนวณ (spreadsheet), definition: "โปรแกรมที่เก็บข้อมูลเป็นตารางเซลล์และคำนวณด้วยสูตร เช่น =SUM(B2:B11)" }
  - { term: แบบจำลองเชิงคำนวณ (computational model), definition: "กฎหรือสูตรที่สร้างจากข้อมูลเพื่ออธิบายหรือคาดการณ์ปรากฏการณ์ และปรับได้เมื่อมีข้อมูลใหม่" }
  - { term: สหสัมพันธ์ (correlation), definition: "การที่สองตัวแปรเปลี่ยนไปด้วยกัน ซึ่งไม่ได้แปลว่าตัวหนึ่งเป็นสาเหตุของอีกตัวเสมอ" }
flashcards:
  - { front: "วงจรชีวิตของข้อมูล", back: "สร้างและเก็บรวบรวม → จัดเก็บ → ทำความสะอาด → ประมวลผล → นำเสนอและใช้ → เก็บรักษาหรือทำลาย" }
  - { front: "ปัญหาที่ต้องตรวจเมื่อทำความสะอาดข้อมูล", back: "แถวซ้ำ ค่าว่าง ค่าที่เป็นไปไม่ได้ รูปแบบหรือหน่วยไม่ตรงกัน และค่าผิดปกติ" }
  - { front: "=COUNTIF(B2:B11,\">=50\") ทำอะไร", back: "นับจำนวนเซลล์ใน B2 ถึง B11 ที่มีค่ามากกว่าหรือเท่ากับ 50" }
  - { front: "เจอค่าผิดปกติ ควรทำอย่างไร", back: "หาสาเหตุก่อน ถ้าผิดพลาดให้แก้หรือตัด ถ้าเป็นเรื่องจริงให้เก็บไว้และอาจปรับแบบจำลอง" }
  - { front: "ปรับแบบจำลองเมื่อใด", back: "เมื่อค่าที่คาดการณ์ต่างจากข้อมูลจริงอย่างเป็นระบบ เช่น คาดต่ำไปทุกวัน" }
