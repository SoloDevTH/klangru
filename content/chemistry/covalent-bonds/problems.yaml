      - { match: 2, feedback: "ถ้าเป็นพันธะคู่ C จะมีอิเล็กตรอนรอบตัว $2 + 4 = 6$ ตัว ยังไม่ครบออกเตต" }
    solution: "เวเลนซ์อิเล็กตรอนรวม $1 + 4 + 5 = 10$ ตัว ถ้าเป็น H–C≡N: พันธะ H–C 2 ตัว พันธะสาม 6 ตัว เหลือ 2 ตัวเป็นคู่โดดเดี่ยวบน N ตรวจ: C มี $2 + 6 = 8$ ✓ N มี $6 + 2 = 8$ ✓ C กับ N จึงใช้อิเล็กตรอนร่วมกัน **3 คู่** (พันธะสาม)"
