      - "นำจำนวนพวงมาลัยคูณกับราคาต่อพวง"
    solution: "ผู้ใหญ่มี ปู่ ย่า ตา ยาย (4 คน) และลุง 2 คน รวม 6 คน ใช้เงิน $6 \\times 25 = 150$ บาท"
