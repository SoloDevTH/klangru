    stem: "โรงงานผลิตน้ำหอมจากสารสองชนิดตามระบบ $Ax=b$ ซึ่งแยกได้ $A=LU$ โดย $L=\\begin{pmatrix}1&0\\\\2&1\\end{pmatrix}$ และ $U=\\begin{pmatrix}3&1\\\\0&4\\end{pmatrix}$ และ $b=(3,10)$ จงหา $x_1$ ซึ่งเป็นปริมาณสารชนิดแรก (ทศนิยม 4 ตำแหน่ง)"
    answer: { value: 0.6667, tolerance: 0.0001 }
    hints:
      - "แก้ $Ly=b$ ด้วยการแทนค่าไปหน้าก่อน"
      - "แก้ $Ux=y$ ด้วยการแทนค่าย้อนหลัง โดยเริ่มจาก $x_2$"
      - "จากแถวแรกของ $U$ แก้หา $x_1$"
    misconceptions:
      - { match: 3, feedback: "3 คือ $y_1$ จากการแทนค่าไปหน้า ยังไม่ได้แทนค่าย้อนหลังเพื่อหา $x_1$" }
    solution: "$y=(3,4)$ จากการแทนค่าไปหน้า แล้ว $x_2=1$ และ $3x_1+1=3$ จึงได้ $x_1=\\frac{2}{3}\\approx 0.6667$"
