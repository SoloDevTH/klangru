      - { id: c, text: "ตรวจเฉพาะว่าระบบรักษาความปลอดภัยได้ตามมาตรฐาน", feedback: "ความปลอดภัยสำคัญ แต่ไม่ครอบคลุมความเป็นธรรม การมีส่วนร่วม และผลต่อกลุ่มที่เปราะบาง" }
      - { id: d, text: "เลื่อนการประเมินไปหลังจากมีปัญหาเกิดขึ้นแล้ว", feedback: "การประเมินหลังเกิดปัญหาแก้ไขได้ยากกว่าการประเมินก่อนเปิดตัว" }
      - { id: a, text: "ถามผู้ได้รับผลกระทบ ตรวจว่าใครอาจถูกยกเว้นจากข้อมูล กำหนดนโยบายเก็บและลบ และทดสอบผลกับกลุ่มที่เปราะบาง", correct: true }
    hints:
      - "การประเมินที่ดีต้องถามคนที่จะได้รับผลกระทบโดยตรงด้วย"
      - "ตัวเลือกที่ครอบคลุมทั้งการมีส่วนร่วม ความครอบคลุมของข้อมูล และนโยบายเก็บข้อมูลเป็นคำตอบที่เหมาะสม"
    solution: "การประเมินที่รอบด้านรวมการฟังผู้ได้รับผลกระทบ การตรวจความครอบคลุมของข้อมูล นโยบายเก็บและลบ และการทดสอบกับกลุ่มเปราะบาง ทำก่อนเปิดตัวเพื่อป้องกันความเสียหาย"
