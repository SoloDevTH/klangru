      - { match: "x^2+8x+15", feedback: "นั่นคือ $(x + 3)(x + 5)$ ซึ่งมีรากเป็น $-3$ และ $-5$ ตัวประกอบของราก $x = 3$ คือ $(x - 3)$" }
