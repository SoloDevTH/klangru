  - id: computer.networks.addressing-routing.p019
    topics: [computer.networks.addressing-routing]
    difficulty: 4
    type: code
    stem: "เขียนฟังก์ชัน subnet_info(cidr) รับสตริงเช่น \"192.168.10.77/26\" แล้วคืน dict ที่มีคีย์ network (ที่อยู่เครือข่าย), broadcast (ที่อยู่กระจายข่าว) และ hosts (จำนวนโฮสต์ที่ใช้ได้) ค่าทั้งหมดเป็นสตริงหรือจำนวนเต็มตามที่ระบุ"
    starter: |
      import ipaddress

      def subnet_info(cidr):
          # คืน dict ที่มี network, broadcast และ hosts
          return {}
    tests: |
      info = subnet_info("192.168.10.77/26")
      assert info["network"] == "192.168.10.64", f"ที่อยู่เครือข่ายควรเป็น 192.168.10.64 แต่ได้ {info.get('network')}"
      assert info["broadcast"] == "192.168.10.127", f"ที่อยู่กระจายข่าวควรเป็น 192.168.10.127 แต่ได้ {info.get('broadcast')}"
      assert info["hosts"] == 62, f"จำนวนโฮสต์ควรเป็น 62 แต่ได้ {info.get('hosts')}"
      info2 = subnet_info("10.1.2.3/16")
      assert info2["network"] == "10.1.0.0" and info2["hosts"] == 65534, "/16 ควรได้เครือข่าย 10.1.0.0 และ 65534 โฮสต์"
    reference: |
      import ipaddress

      def subnet_info(cidr):
          net = ipaddress.ip_network(cidr, strict=False)
          return {
              "network": str(net.network_address),
              "broadcast": str(net.broadcast_address),
              "hosts": net.num_addresses - 2,
          }
    hints:
      - "ใช้ ipaddress.ip_network(cidr, strict=False) เพื่อให้ได้วงเครือข่ายจากสตริง"
      - "ที่อยู่เครือข่ายและกระจายข่าวหาได้จาก network_address และ broadcast_address ของวงนั้น"
    solution: "จำนวนโฮสต์ที่ใช้ได้คือจำนวนที่อยู่ทั้งหมดลบสองค่าที่เครื่องใช้ไม่ได้ (เครือข่ายกับกระจายข่าว)"
    license: CC-BY-SA-4.0
    ai_assisted: true
