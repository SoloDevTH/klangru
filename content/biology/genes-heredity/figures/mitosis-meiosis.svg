<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="sans-serif" font-size="14">
<title>เปรียบเทียบผลของไมโทซิสและไมโอซิส</title>
<rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
<text x="500.0" y="30.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">เซลล์ตั้งต้นมีโครโมโซม 2 คู่ (2n = 4)</text>
<circle cx="120" cy="250" r="55" fill="#fffde7" stroke="#555" stroke-width="2"/>
<rect x="89" y="232.0" width="8" height="36" rx="4" fill="#1565c0"/>
<rect x="107" y="232.0" width="8" height="36" rx="4" fill="#e53935"/>
<rect x="125" y="240.0" width="8" height="20" rx="4" fill="#1565c0"/>
<rect x="143" y="240.0" width="8" height="20" rx="4" fill="#e53935"/>
<text x="120.0" y="330.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">เซลล์ตั้งต้น 2n = 4</text>
<text x="120.0" y="350.0" text-anchor="middle" font-size="12" fill="#555">น้ำเงิน = จากพ่อ แดง = จากแม่</text>
<text x="560.0" y="80.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e7d32">ไมโทซิส: 2 เซลล์ เหมือนเดิม</text>
<line x1="180.0" y1="225.0" x2="420.0" y2="140.0" stroke="#2e7d32" stroke-width="2"/>
<polygon points="420.0,140.0 413.4,146.1 411.0,139.5" fill="#2e7d32"/>
<circle cx="480" cy="135" r="45" fill="#fffde7" stroke="#555" stroke-width="2"/>
<rect x="449" y="117.0" width="8" height="36" rx="4" fill="#1565c0"/>
<rect x="467" y="117.0" width="8" height="36" rx="4" fill="#e53935"/>
<rect x="485" y="125.0" width="8" height="20" rx="4" fill="#1565c0"/>
<rect x="503" y="125.0" width="8" height="20" rx="4" fill="#e53935"/>
<circle cx="600" cy="135" r="45" fill="#fffde7" stroke="#555" stroke-width="2"/>
<rect x="569" y="117.0" width="8" height="36" rx="4" fill="#1565c0"/>
<rect x="587" y="117.0" width="8" height="36" rx="4" fill="#e53935"/>
<rect x="605" y="125.0" width="8" height="20" rx="4" fill="#1565c0"/>
<rect x="623" y="125.0" width="8" height="20" rx="4" fill="#e53935"/>
<text x="540.0" y="200.0" text-anchor="middle" font-size="13" fill="#222">2n = 4 ทั้งสองเซลล์ พันธุกรรมเหมือนเซลล์ตั้งต้น</text>
<text x="620.0" y="265.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#6a1b9a">ไมโอซิส: 4 เซลล์ จำนวนโครโมโซมลดลงครึ่งหนึ่ง</text>
<line x1="180.0" y1="275.0" x2="380.0" y2="350.0" stroke="#6a1b9a" stroke-width="2"/>
<polygon points="380.0,350.0 371.0,350.4 373.5,343.8" fill="#6a1b9a"/>
<circle cx="440" cy="350" r="40" fill="#f3e5f5" stroke="#555" stroke-width="2"/>
<rect x="427" y="332.0" width="8" height="36" rx="4" fill="#1565c0"/>
<rect x="445" y="340.0" width="8" height="20" rx="4" fill="#1565c0"/>
<circle cx="560" cy="350" r="40" fill="#f3e5f5" stroke="#555" stroke-width="2"/>
<rect x="547" y="332.0" width="8" height="36" rx="4" fill="#1565c0"/>
<rect x="565" y="340.0" width="8" height="20" rx="4" fill="#1565c0"/>
<circle cx="680" cy="350" r="40" fill="#f3e5f5" stroke="#555" stroke-width="2"/>
<rect x="667" y="332.0" width="8" height="36" rx="4" fill="#e53935"/>
<rect x="685" y="340.0" width="8" height="20" rx="4" fill="#e53935"/>
<circle cx="800" cy="350" r="40" fill="#f3e5f5" stroke="#555" stroke-width="2"/>
<rect x="787" y="332.0" width="8" height="36" rx="4" fill="#e53935"/>
<rect x="805" y="340.0" width="8" height="20" rx="4" fill="#e53935"/>
<text x="620.0" y="415.0" text-anchor="middle" font-size="13" fill="#222">n = 2 ทุกเซลล์ ได้ชุดผสมต่างจากเซลล์ตั้งต้น (ตัวอย่างไมโอซิสหนึ่งครั้ง ไม่นับครอสซิงโอเวอร์)</text>
<text x="620.0" y="440.0" text-anchor="middle" font-size="13" fill="#222">เซลล์ตั้งต้นเซลล์อื่นอาจจัดเรียงต่างกัน ได้น้ำเงินยาว + แดงสั้น และแดงยาว + น้ำเงินสั้น รวมเป็นไปได้ 2² = 4 แบบ</text>
</svg>