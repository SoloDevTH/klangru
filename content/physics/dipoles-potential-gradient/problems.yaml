- id: physics.electricity.dipoles-potential-gradient.p015
  topics:
  - physics.electricity.dipoles-potential-gradient
  difficulty: 5
  type: numeric
  stem: วงแหวนประจุสม่ำเสมอรัศมี $a = 0.10\,\mathrm{m}$ มีประจุรวม $5.0\,\mathrm{nC}$ บนแกนของวงแหวน ที่ระยะ $z$ จากศูนย์กลางสนาม $E_z(z) = \dfrac{kQz}{(z^2+a^2)^{3/2}}$ มีค่ามากที่สุดเมื่อ $z$ เท่ากับกี่เมตร
  hints:
  - หาอนุพันธ์ $\dfrac{dE_z}{dz} = 0$ โดยใช้กฎผลคูณและกฎลูกโซ่
  - ตัดตัวประกอบที่เป็นบวกทิ้งแล้วเหลือสมการกำลังสองของ $z^2$
  - ตรวจว่าค่าที่ได้เป็น $z > 0$ และหน่วยเป็นเมตร
  answer:
    value: 0.0707
    tolerance: 0.0008
    unit: m
  misconceptions:
  - match: 0.1
    feedback: เดาว่าสนามมากที่สุดที่ขอบวงแหวน แต่ที่ $z = a$ สนามยังไม่ถึงค่าสูงสุดจริง ต้องหาอนุพันธ์
  solution: $\dfrac{d}{dz}\left[\dfrac{z}{(z^2+a^2)^{3/2}}\right] = \dfrac{a^2 - 2z^2}{(z^2+a^2)^{5/2}} = 0$ จึงได้ $z = a/\sqrt{2} \approx 0.0707\,\mathrm{m}$
