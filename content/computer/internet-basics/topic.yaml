id: computer.networks.internet-basics
subject: computer
title: { th: เครือข่ายคอมพิวเตอร์และอินเทอร์เน็ต, en: "Computer networks and the internet" }
summary: แบ่งข้อมูลเป็นแพ็กเก็ตและประกอบกลับ โพรโทคอลและชั้นของเครือข่าย ที่อยู่ IP และ DNS สวิตช์ เราเตอร์ เซิร์ฟเวอร์ ลักษณะการเชื่อมต่อ แบบลูกข่าย-แม่ข่าย HTTP และความทนทานของเครือข่าย
difficulty: 3.5
minutes: 40
prerequisites: [computer.systems.computer-systems]
encompasses:
  - { id: computer.systems.computer-systems, weight: 0.3 }
  - { id: computer.data.binary, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: packets.svg
    alt: "ผู้ส่งที่กรุงเทพฯ แบ่งรูปเป็นแพ็กเก็ต 1 ถึง 4 ส่งเข้าเราเตอร์ R1 จาก R1 มีสองเส้นทางไป R2 และ R3 ซึ่งเชื่อมกันด้วย และทั้งคู่ต่อไปยัง R4 แล้วถึงผู้รับที่เชียงใหม่ แพ็กเก็ต 1 และ 2 ไปทาง R2 แพ็กเก็ต 3 และ 4 ไปทาง R3 ผู้รับเรียง 1 2 3 4 ประกอบเป็นรูปเดิม ด้านบนเขียนว่าเราเตอร์ส่งต่อแต่ละแพ็กเก็ตไปตามเส้นทางที่ว่างในขณะนั้น ด้านล่างเขียนว่าแต่ละแพ็กเก็ตมีส่วนหัว ที่อยู่ผู้ส่ง ที่อยู่ผู้รับ และลำดับที่"
    caption: "แพ็กเก็ตของข้อมูลชุดเดียวกันอาจเดินคนละเส้นทาง"
  - type: worked-example
    title: ติดตามการเปิดหน้าเว็บหนึ่งหน้า
    problem: "แพรพิมพ์ school.example ในเบราว์เซอร์ที่บ้าน (ชื่อสมมติ) จนหน้าเว็บของโรงเรียนขึ้นมา เกิดอะไรขึ้นบ้างตามลำดับ"
    steps:
      - text: "DNS: เบราว์เซอร์ถามเซิร์ฟเวอร์ DNS ว่า school.example มีที่อยู่ IP อะไร แล้วได้คำตอบกลับมา"
        why: "เครื่องส่งข้อมูลถึงกันด้วยที่อยู่ IP ชื่อโดเมนมีไว้ให้คนจำง่าย"
      - text: "TCP: เบราว์เซอร์เปิดการเชื่อมต่อ TCP กับเซิร์ฟเวอร์ที่ IP นั้น เพื่อให้ข้อมูลมาครบและเรียงถูก"
      - text: "HTTP: เบราว์เซอร์ส่งคำขอหน้าแรก ข้อความถูกห่อด้วยส่วนหัว TCP และ IP แล้วส่งออกทาง Wi-Fi ไปที่เราเตอร์บ้าน"
      - text: "IP: เราเตอร์หลายตัวส่งแพ็กเก็ตต่อกันไปจนถึงเครือข่ายของเซิร์ฟเวอร์"
      - text: "แม่ข่ายตอบรหัส 200 พร้อมเนื้อหาหน้าเว็บ ซึ่งถูกแบ่งเป็นแพ็กเก็ตส่งกลับมา เบราว์เซอร์ประกอบกลับตามลำดับแล้วแสดงผล"
        why: "ถ้าแพ็กเก็ตใดหาย TCP จะขอให้ส่งซ้ำ ผู้ใช้จึงเห็นหน้าเว็บครบ"
    answer: "DNS แปลชื่อเป็น IP → เปิดการเชื่อมต่อ TCP → ส่งคำขอ HTTP → เราเตอร์ส่งต่อแพ็กเก็ต → แม่ข่ายตอบ 200 → เบราว์เซอร์ประกอบและแสดงผล"
  - { type: check, problem: computer.networks.internet-basics.p006, prompt: "DNS ทำหน้าที่อะไร" }
  - type: figure
    src: layers.svg
    alt: "แบบจำลอง TCP/IP สี่ชั้นเรียงจากบนลงล่าง ชั้นแอปพลิเคชัน HTTP HTTPS DNS ข้อความที่แอปส่งถึงกัน ชั้นขนส่ง TCP UDP แบ่งเป็นชิ้น ใส่ลำดับ ตรวจว่าครบ ชั้นอินเทอร์เน็ต IP ใส่ที่อยู่ IP หาเส้นทางผ่านเราเตอร์ ชั้นเชื่อมโยง Ethernet Wi-Fi ส่งเป็นสัญญาณผ่านสายหรือคลื่น ด้านขวาแสดงการห่อข้อมูล ชั้นบนมีแค่ข้อมูลของแอป ชั้นถัดไปเพิ่มส่วนหัว TCP ชั้นถัดไปเพิ่มส่วนหัว IP และชั้นล่างสุดเพิ่มส่วนหัวลิงก์ ผู้ส่งเพิ่มส่วนหัวทีละชั้นจากบนลงล่าง ผู้รับแกะออกจากล่างขึ้นบน"
    caption: "แต่ละชั้นทำงานของตัวเองและห่อข้อมูลด้วยส่วนหัวของชั้นนั้น"
  - type: figure
    src: topologies.svg
    alt: "ลักษณะการเชื่อมต่อสี่แบบ แบบบัส ทุกเครื่องต่อกับสายหลักเส้นเดียว สายหลักขาดทั้งวงใช้ไม่ได้ แบบดาว ห้าเครื่องต่อกับสวิตช์ตรงกลาง ศูนย์กลางเสียทุกเครื่องหลุด แบบวงแหวน หกเครื่องต่อกันเป็นวง ส่งต่อกันทีละเครื่อง แบบตาข่าย ห้าเครื่องต่อถึงกันทุกคู่ มีหลายเส้นทาง สายหนึ่งขาดยังส่งทางอื่นได้"
    caption: "แต่ละแบบได้อย่างหนึ่ง เสียอย่างหนึ่ง ระหว่างจำนวนสายกับความทนทาน"
  - type: worked-example
    title: ส่งรูปต้องใช้กี่แพ็กเก็ต
    problem: "รูปขนาด 3 MB (3,000,000 ไบต์) ถูกแบ่งเป็นแพ็กเก็ต แต่ละแพ็กเก็ตบรรจุข้อมูลได้ 1,500 ไบต์ ต้องใช้กี่แพ็กเก็ต และถ้าส่วนหัวแพ็กเก็ตละ 40 ไบต์ ต้องส่งข้อมูลรวมกี่ไบต์"
    steps:
      - text: "จำนวนแพ็กเก็ต = 3,000,000 ÷ 1,500 = 2,000 แพ็กเก็ต (หารลงตัว ถ้าไม่ลงตัวต้องปัดขึ้น)"
      - text: "ส่วนหัวรวม = 2,000 × 40 = 80,000 ไบต์"
        why: "ทุกแพ็กเก็ตต้องมีส่วนหัวของตัวเอง ข้อมูลที่ส่งจริงจึงมากกว่าขนาดไฟล์"
      - text: "ข้อมูลรวม = 3,000,000 + 80,000 = 3,080,000 ไบต์ มากกว่าขนาดรูปราว 2.7%"
    answer: "2,000 แพ็กเก็ต และส่งรวม 3,080,000 ไบต์"
  - { type: check, problem: computer.networks.internet-basics.p004, prompt: "ลองคำนวณจำนวนแพ็กเก็ตของไฟล์อื่น" }
glossary:
  - { term: แพ็กเก็ต (packet), definition: "ข้อมูลชิ้นเล็กที่แบ่งจากข้อมูลใหญ่ มีส่วนหัวบอกที่อยู่ผู้ส่ง ผู้รับ และลำดับที่" }
  - { term: เราเตอร์ (router), definition: "อุปกรณ์ที่เชื่อมเครือข่ายต่างกันและเลือกเส้นทางส่งต่อแพ็กเก็ต" }
  - { term: สวิตช์ (switch), definition: "อุปกรณ์ที่เชื่อมเครื่องในเครือข่ายเดียวกันและส่งข้อมูลให้ถึงเครื่องปลายทาง" }
  - { term: ที่อยู่ IP (IP address), definition: "ตัวเลขประจำอุปกรณ์บนเครือข่าย IPv4 ยาว 32 บิต เขียนเป็นเลข 4 ชุด ชุดละ 0 ถึง 255" }
  - { term: DNS, definition: "ระบบชื่อโดเมน แปลชื่อเว็บไซต์ให้เป็นที่อยู่ IP" }
  - { term: โพรโทคอล (protocol), definition: "กติกาการสื่อสารที่อุปกรณ์ตกลงใช้ร่วมกัน เช่น HTTP, TCP, IP" }
  - { term: ลูกข่าย-แม่ข่าย (client-server), definition: "รูปแบบที่ลูกข่ายส่งคำขอ และแม่ข่ายตอบกลับพร้อมข้อมูลหรือบริการ" }
  - { term: ลักษณะการเชื่อมต่อ (topology), definition: "รูปแบบการต่ออุปกรณ์ในเครือข่าย เช่น บัส ดาว วงแหวน ตาข่าย" }
flashcards:
  - { front: "ทำไมต้องแบ่งข้อมูลเป็นแพ็กเก็ต", back: "ใช้สายร่วมกันได้หลายคน ส่งซ้ำเฉพาะชิ้นที่หาย และอ้อมเส้นทางที่เสียได้" }
  - { front: "TCP กับ UDP ต่างกันอย่างไร", back: "TCP ตรวจลำดับและความครบ ส่งซ้ำเมื่อหาย UDP ส่งเร็วโดยไม่ตรวจ เหมาะกับวิดีโอคอลและเกม" }
  - { front: "รหัส HTTP 404 หมายถึงอะไร", back: "แม่ข่ายไม่พบหน้าที่ขอ" }
  - { front: "ตาข่ายเต็มรูปของ n เครื่องใช้สายกี่เส้น", back: "n(n − 1) ÷ 2 เส้น เช่น 6 เครื่องใช้ 15 เส้น" }
  - { front: "แบบจำลอง TCP/IP สี่ชั้น", back: "แอปพลิเคชัน ขนส่ง อินเทอร์เน็ต เชื่อมโยง" }
