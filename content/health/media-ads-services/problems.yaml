    text: ไปรับคำแนะนำที่ รพ.สต. ใกล้บ้านหรือปรึกษาเภสัชกรก่อน และไปโรงพยาบาลเมื่ออาการแย่ลง เช่น ไข้สูงหลายวัน หายใจหอบ ซึม
    correct: true
