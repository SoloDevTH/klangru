<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 225" width="520" height="225" font-family="sans-serif" font-size="14">
  <title>ตารางทางเลือกการใช้ห้องหน้าบ้านของป้านิด</title>
  <rect x="0" y="0" width="520" height="225" fill="#ffffff"/>
  <rect x="20.0" y="20.0" width="480.0" height="40.0" rx="0" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
  <text x="160.0" y="44.5" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">ทางเลือกการใช้ห้องหน้าบ้าน</text>
  <text x="400.0" y="44.5" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">ประโยชน์ที่ได้ต่อเดือน</text>
  <line x1="300.0" y1="20.0" x2="300.0" y2="60.0" stroke="#1f2937" stroke-width="1"/>
  <rect x="20.0" y="60.0" width="480.0" height="40.0" rx="0" fill="#fff" stroke="#1f2937" stroke-width="1"/>
  <text x="28.0" y="84.5" text-anchor="start" fill="#1f2937" font-size="13">เปิดร้านกาแฟเล็ก ๆ</text>
  <text x="400.0" y="84.5" text-anchor="middle" fill="#1f2937" font-size="13">กำไร 9,000 บาท</text>
  <line x1="300.0" y1="60.0" x2="300.0" y2="100.0" stroke="#1f2937" stroke-width="1"/>
  <rect x="20.0" y="100.0" width="480.0" height="40.0" rx="0" fill="#fff" stroke="#1f2937" stroke-width="1"/>
  <text x="28.0" y="124.5" text-anchor="start" fill="#1f2937" font-size="13">ให้คนอื่นเช่าทำร้านตัดผม</text>
  <text x="400.0" y="124.5" text-anchor="middle" fill="#1f2937" font-size="13">ค่าเช่า 7,000 บาท</text>
  <line x1="300.0" y1="100.0" x2="300.0" y2="140.0" stroke="#1f2937" stroke-width="1"/>
  <rect x="20.0" y="140.0" width="480.0" height="40.0" rx="0" fill="#fff" stroke="#1f2937" stroke-width="1"/>
  <text x="28.0" y="164.6" text-anchor="start" fill="#1f2937" font-size="13">ใช้เก็บของ</text>
  <text x="400.0" y="164.6" text-anchor="middle" fill="#1f2937" font-size="13">ไม่ได้เงิน</text>
  <line x1="300.0" y1="140.0" x2="300.0" y2="180.0" stroke="#1f2937" stroke-width="1"/>
  <text x="260.0" y="208.0" text-anchor="middle" fill="#1f2937" font-size="14">ป้านิดเลือก “ให้เช่าทำร้านตัดผม”</text>
</svg>
