<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 150" width="460" height="150" font-family="sans-serif" font-size="15">
  <title>กล่อง A 3 kg และ B 2 kg วางชิดกันบนพื้นลื่น มีแรง 20 N ดัน A</title>
  <rect x="0" y="0" width="460" height="150" fill="#ffffff"/>
  <g transform="translate(0,-50)">
  <line x1="20" y1="150" x2="440" y2="150" stroke="#15211e" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="170" y="80" width="90" height="70" rx="0" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <rect x="260" y="95" width="75" height="55" rx="0" fill="#dbe8f7" stroke="#15211e" stroke-width="2"/>
  <text x="215" y="122" font-size="17" text-anchor="middle" font-weight="bold">A</text>
  <text x="215" y="142" font-size="13" text-anchor="middle">3 kg</text>
  <text x="297" y="125" font-size="17" text-anchor="middle" font-weight="bold">B</text>
  <text x="297" y="143" font-size="13" text-anchor="middle">2 kg</text>
  <line x1="80" y1="115" x2="157" y2="115" stroke="#b4521f" stroke-width="3" stroke-linecap="round"/><polygon points="168,115 157,120 157,110" fill="#b4521f" stroke="#b4521f" stroke-width="1" stroke-linejoin="round"/>
  <text x="118" y="104" font-size="14" fill="#b4521f" text-anchor="middle">20 N</text>
  <text x="230" y="180" font-size="13" fill="#6b7472" text-anchor="middle">พื้นลื่น</text>
  </g>
</svg>
