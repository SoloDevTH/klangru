      - "บวกผลทั้งหมด: $\\tfrac14 \\times 3 + \\tfrac12 \\times 4 + \\tfrac34 \\times 2 + 1 \\times 1$"
    misconceptions:
      - { match: 10, feedback: "นั่นคือจำนวนกิ่งทั้งหมด ไม่ใช่ความยาวรวม ต้องคูณความยาวของแต่ละกิ่งเข้าไปด้วย" }
      - { match: 2.5, feedback: "บวกเฉพาะค่าบนแกน $\\tfrac14 + \\tfrac12 + \\tfrac34 + 1$ แต่ละค่ามีหลายกิ่ง ต้องคูณด้วยจำนวนจุด" }
    solution: "$\\tfrac34 + 2 + \\tfrac32 + 1 = 0.75 + 2 + 1.5 + 1 = 5.25$ เมตร"
