id: thai.grammar.word-formation
subject: thai
title: { th: "การสร้างคำ: คำประสม คำซ้ำ คำซ้อน คำสมาส", en: "Thai word formation: compounds, reduplication, couplets and samasa" }
summary: แยกคำมูล คำประสม คำซ้ำ คำซ้อน คำสมาส และคำสนธิ ใช้ไม้ยมกให้ถูก อ่านและเขียนคำสมาสตามหลัก สร้างคำใหม่ และวิเคราะห์หลักการสร้างคำในภาษาไทย
difficulty: 5
minutes: 35
prerequisites: [thai.grammar.word-types, thai.grammar.loanwords]
encompasses:
  - { id: thai.grammar.loanwords, weight: 0.3 }
  - { id: thai.grammar.word-types, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: formation-types.svg
    alt: "แผนภาพต้นไม้ การสร้างคำ แตกเป็น 5 แบบ คำมูล คำเดียว ความหมายในตัว เช่น พ่อ กิน นาฬิกา มะละกอ คำประสม คำมูลรวมคำมูล ความหมายใหม่ เช่น แม่น้ำ ลูกเสือ ตู้เย็น รถไฟ คำซ้ำ คำเดิม 2 ครั้งใช้ไม้ยมก เช่น เด็ก ๆ ดี ๆ ไป ๆ มา ๆ คำซ้อน คำความหมายสัมพันธ์ เช่น บ้านเรือน ทรัพย์สิน โยกเยก งุ่มง่าม คำสมาส คำบาลีสันสกฤตรวมกันเป็นคำเดียว เช่น สุขภาพ ภูมิศาสตร์ และคำสนธิ ธนาคาร"
    caption: "วิธีสร้างคำ 5 แบบในภาษาไทย"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: sandhi-dhana.svg
    alt: "แผนภาพสระสนธิ ธน บวก อาคาร ลูกศรชี้รวมกันเป็น ธนาคาร หมายเหตุ อะ บวก อา เป็น อา"
    caption: "สระสนธิ ธน + อาคาร = ธนาคาร"
  - type: worked-example
    title: จำแนกวิธีสร้างคำ
    problem: "บอกวิธีสร้างคำของ ลูกเสือ · เพื่อน ๆ · ทรัพย์สิน · อุบัติเหตุ · พลเมือง"
    steps:
      - text: "ลูกเสือ: ลูก + เสือ แต่ไม่ได้หมายถึงลูกของเสือ เกิดความหมายใหม่ → คำประสม"
        why: "แทรก ของ แล้วความหมายเปลี่ยน"
      - text: "เพื่อน ๆ: คำเดิมซ้ำ ใช้ไม้ยมก บอกว่ามีหลายคน → คำซ้ำ"
      - text: "ทรัพย์สิน: ทรัพย์ (สันสกฤต) กับ สิน (ไทย) ความหมายใกล้กัน → คำซ้อน"
      - text: "อุบัติเหตุ: อุบัติ และ เหตุ เป็นบาลีสันสกฤตทั้งคู่ แปลหลังไปหน้า เหตุที่เกิดขึ้น → คำสมาส"
      - text: "พลเมือง: พล เป็นบาลีสันสกฤต แต่ เมือง เป็นคำไทย → ไม่ใช่สมาส (แม้อ่าน พน-ละ-เมือง)"
        why: "คำสมาสทุกส่วนต้องเป็นบาลีหรือสันสกฤต"
    answer: "ลูกเสือ คำประสม · เพื่อน ๆ คำซ้ำ · ทรัพย์สิน คำซ้อน · อุบัติเหตุ คำสมาส · พลเมือง ไม่ใช่สมาส"
  - { type: check, problem: thai.grammar.word-formation.p003, prompt: "ลองแทรกคำว่า ที่ หรือ ของ" }
  - type: worked-example
    title: สร้างคำสนธิและตรวจการสะกด
    problem: "สนธิ คมน + อาคม และบอกว่าควรเขียน แพทย์ศาสตร์ หรือ แพทยศาสตร์"
    steps:
      - text: "คมน ลงท้ายเสียง อะ คำหลังขึ้นต้นด้วย อา"
      - text: "อะ + อา → อา เชื่อมเป็น คมนาคม"
        why: "สระสนธิทำให้สองสระกลืนเป็นเสียงเดียว"
      - text: "แพทย์ + ศาสตร์ เป็นสมาส ไม่ใส่การันต์ท้ายคำหน้า → แพทยศาสตร์"
      - text: "อ่าน แพด-ทะ-ยะ-สาด ออกเสียงสระท้ายคำหน้า"
    answer: "คมนาคม · เขียน แพทยศาสตร์"
  - { type: check, problem: thai.grammar.word-formation.p006, prompt: "หาคำที่มีคำไทยปน" }
glossary:
  - { term: คำมูล, definition: "คำที่มีความหมายในตัว ไม่ได้สร้างจากคำอื่น" }
  - { term: คำประสม, definition: "คำมูลตั้งแต่ 2 คำรวมกันแล้วเกิดความหมายใหม่ เช่น แม่น้ำ" }
  - { term: คำซ้ำ, definition: "คำเดิมพูดสองครั้ง เขียนด้วยไม้ยมก เช่น เด็ก ๆ" }
  - { term: คำซ้อน, definition: "คำความหมายเหมือน ใกล้เคียง หรือตรงข้ามวางคู่กัน หรือคำเสียงคล้องกัน เช่น บ้านเรือน โยกเยก" }
  - { term: คำสมาส, definition: "คำบาลีหรือสันสกฤตตั้งแต่ 2 คำรวมเป็นคำเดียว แปลจากหลังไปหน้า เช่น ภูมิศาสตร์" }
  - { term: คำสนธิ, definition: "คำสมาสที่เชื่อมเสียงระหว่างคำ เช่น ธน + อาคาร = ธนาคาร" }
flashcards:
  - { front: "คำประสมทดสอบอย่างไร", back: "แทรก ของ ที่ ซึ่ง แล้วความหมายเปลี่ยน" }
  - { front: "คนคนนี้ ใช้ไม้ยมกได้ไหม", back: "ไม่ได้ เพราะ คน สองตัวทำหน้าที่ต่างกัน" }
  - { front: "คำซ้อนต่างจากคำประสม", back: "คำซ้อนความหมายใกล้ส่วนประกอบ คำประสมเกิดความหมายใหม่" }
  - { front: "คำสมาส 3 หลัก", back: "บาลีสันสกฤตทุกส่วน แปลหลังไปหน้า ไม่ใส่การันต์ท้ายคำหน้า" }
  - { front: "อะ + อุ ในสระสนธิ", back: "เป็น โอ เช่น ชโลทร กุศโลบาย" }
