<text x="311.0" y="362.0" text-anchor="middle" font-size="14" fill="#222">แพลงก์ตอนสัตว์</text>
<rect x="402.0" y="165.5" width="90" height="174.5" fill="#90caf9" stroke="#1565c0"/>
