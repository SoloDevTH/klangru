  - id: biology.plants.transport-nutrients.p016
    topics: [biology.plants.transport-nutrients]
    difficulty: 5
    type: numeric
    stem: "ร้านเกษตรขายปุ๋ยสูตร 46-0-0 กระสอบละ 50 กิโลกรัม ราคา 900 บาท และปุ๋ยสูตร 21-0-0 กระสอบละ 50 กิโลกรัม ราคา 600 บาท (ราคาสมมติ) ถ้าคิดเฉพาะไนโตรเจน ปุ๋ยสูตร 46-0-0 มีราคากี่บาทต่อไนโตรเจน 1 กิโลกรัม ตอบทศนิยม 2 ตำแหน่ง"
    answer: { value: 39.13, tolerance: 0.4, unit: บาท/kg }
    hints:
      - "หาไนโตรเจนในกระสอบก่อน"
      - "ราคาต่อไนโตรเจน 1 กิโลกรัม = ราคากระสอบ ÷ ไนโตรเจนในกระสอบ"
    misconceptions:
      - { match: 18, feedback: "นี่คือราคาต่อปุ๋ย 1 กิโลกรัม ยังไม่ได้คิดเฉพาะไนโตรเจน" }
      - { match: 57.14, feedback: "นี่คือราคาต่อไนโตรเจนของสูตร 21-0-0 โจทย์ถามสูตร 46-0-0" }
    solution: "ไนโตรเจนในกระสอบ $= 50 \\times 0.46 = 23$ กิโลกรัม ราคาต่อไนโตรเจน $= 900 \\div 23 \\approx 39.13$ บาทต่อกิโลกรัม ส่วนสูตร 21-0-0 มีไนโตรเจน 10.5 กิโลกรัม ราคา $600 \\div 10.5 \\approx 57.14$ บาทต่อกิโลกรัม สูตร 46-0-0 จึงคุ้มกว่าเมื่อคิดเฉพาะไนโตรเจน"
