<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320" font-family="sans-serif" font-size="14">
<title>ต้นไม้ตัดสินใจสมมติสำหรับทำนายว่าวันขายดีหรือไม่</title>
<rect x="0" y="0" width="840" height="320" fill="#ffffff"/>
<rect x="300.0" y="24.0" width="200" height="52" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="400" y="55" text-anchor="middle" font-size="15" fill="#111827">ฝนตกหรือไม่?</text>
<line x1="400" y1="76" x2="200" y2="134" stroke="#374151" stroke-width="2"/>
<text x="282.0" y="101.0" text-anchor="middle" font-size="14" fill="#1d4ed8">ใช่</text>
<line x1="400" y1="76" x2="600" y2="134" stroke="#374151" stroke-width="2"/>
<text x="518.0" y="101.0" text-anchor="middle" font-size="14" fill="#1d4ed8">ไม่</text>
<rect x="120.0" y="134.0" width="160" height="52" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="200" y="165" text-anchor="middle" font-size="15" fill="#111827">ขายไม่ดี</text>
<rect x="490.0" y="134.0" width="220" height="52" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="600" y="165" text-anchor="middle" font-size="15" fill="#111827">อุณหภูมิ ≥ 30 °C ?</text>
<line x1="600" y1="186" x2="450" y2="244" stroke="#374151" stroke-width="2"/>
<text x="507.0" y="211.0" text-anchor="middle" font-size="14" fill="#1d4ed8">ไม่</text>
<line x1="600" y1="186" x2="730" y2="244" stroke="#374151" stroke-width="2"/>
<text x="683.0" y="211.0" text-anchor="middle" font-size="14" fill="#1d4ed8">ใช่</text>
<rect x="370.0" y="244.0" width="160" height="52" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="450" y="275" text-anchor="middle" font-size="15" fill="#111827">ขายไม่ดี</text>
<rect x="650.0" y="244.0" width="160" height="52" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="730" y="275" text-anchor="middle" font-size="15" fill="#111827">ขายดี</text>
</svg>
