    difficulty: 4
    type: numeric
    stem: 'รถกระบะมวล $1200\ \mathrm{kg}$ ออกตัวจากหยุดนิ่งบนถนนราบ จนมีความเร็ว $20\ \mathrm{m/s}$ ในเวลา $8\ \mathrm{s}$ ถ้าไม่คิดแรงต้าน เครื่องยนต์ให้กำลังเฉลี่ยในการเพิ่มพลังงานจลน์เท่าใด (ตอบเป็นตัวเลขในหน่วย kW)'
    answer: { value: 30, tolerance: 0.3, unit: kW }
    hints:
      - 'งานที่เครื่องยนต์ทำเท่ากับพลังงานจลน์ที่เพิ่มขึ้น $\tfrac12 mv^2$'
      - 'กำลังเฉลี่ย $= \dfrac{\text{งาน}}{\text{เวลา}}$'
    misconceptions:
      - { match: 60, feedback: 'ดูเหมือนลืม $\tfrac12$ ในพลังงานจลน์' }
      - { match: 240, feedback: 'นั่นคืองาน (kJ) ทั้งหมด ยังต้องหารด้วยเวลา $8\ \mathrm{s}$' }
    solution: '$\Delta E_k = \tfrac12(1200)(20)^2 = 240\,000\ \mathrm{J}$ กำลังเฉลี่ย $= \dfrac{240\,000}{8} = 30\,000\ \mathrm{W} = 30\ \mathrm{kW}$'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.pow.p020
    topics: [physics.energy.power]
    difficulty: 5
    type: numeric
    stem: 'รถยนต์มวล $1500\ \mathrm{kg}$ ขับขึ้นถนนบนดอยที่ชันโดย $\sin\theta = 0.1$ ด้วยความเร็วคงตัว $15\ \mathrm{m/s}$ มีแรงต้านจากอากาศและถนนรวม $500\ \mathrm{N}$ เครื่องยนต์ต้องให้กำลังเท่าใด ใช้ $g = 9.8\ \mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย kW ทศนิยม 1 ตำแหน่ง)'
    answer: { value: 29.55, tolerance: 0.3, unit: kW }
    hints:
      - 'ความเร็วคงตัว แรงขับต้องเท่ากับแรงที่ต้านทั้งหมดตามแนวถนน'
      - 'แรงต้านตามแนวถนน $= mg\sin\theta + 500$'
      - '$P = Fv$'
    misconceptions:
      - { match: 7.5, feedback: 'ดูเหมือนคิดแค่แรงต้าน $500\ \mathrm{N}$ ลืมองค์ประกอบของน้ำหนักที่ดึงรถลงตามถนนชัน $mg\sin\theta$' }
      - { match: 22.05, feedback: 'ดูเหมือนคิดแค่ $mg\sin\theta$ ลืมแรงต้านจากอากาศและถนน $500\ \mathrm{N}$' }
    solution: 'แรงขับ $= (1500)(9.8)(0.1) + 500 = 1470 + 500 = 1970\ \mathrm{N}$ กำลัง $= 1970 \times 15 = 29\,550\ \mathrm{W} \approx 29.6\ \mathrm{kW}$ เกือบสี่เท่าของตอนวิ่งทางราบด้วยความเร็วเท่ากัน'
