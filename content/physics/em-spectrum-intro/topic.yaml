id: physics.waves.em-spectrum-intro
subject: physics
title: { th: คลื่นแม่เหล็กไฟฟ้าเบื้องต้น, en: Introduction to electromagnetic waves }
summary: คลื่นแม่เหล็กไฟฟ้าเดินทางในสุญญากาศด้วยอัตราเร็วแสง สเปกตรัมจากคลื่นวิทยุถึงรังสีแกมมา การใช้ประโยชน์ อันตราย และความต่างระหว่างแสงกับคลื่นในตัวกลาง
difficulty: 4
minutes: 35
prerequisites: [physics.waves.wave-basics]
encompasses:
  - { id: physics.waves.wave-basics, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: คลื่นแม่เหล็กไฟฟ้า
    src: em-wave.svg
    alt: "คลื่นสองคลื่นบนแกนเดียวกันซึ่งเป็นทิศการเคลื่อนที่ คลื่นสีส้มคือสนามไฟฟ้าสั่นขึ้นลงในแนวตั้ง คลื่นสีน้ำเงินคือสนามแม่เหล็กสั่นในแนวนอน วาดเฉียงเพื่อแทนทิศพุ่งเข้าและออกจากภาพ ทั้งสองคลื่นมียอดตรงกันและมีความยาวคลื่น λ เท่ากัน มีข้อความว่าในสุญญากาศเคลื่อนที่ด้วยอัตราเร็ว 3.0 × 10⁸ m/s"
    caption: "สนามไฟฟ้าและสนามแม่เหล็กสั่นตั้งฉากกันและตั้งฉากกับทิศการเคลื่อนที่ คลื่นแม่เหล็กไฟฟ้าจึงเป็นคลื่นตามขวาง"
  - type: figure
    title: สเปกตรัมคลื่นแม่เหล็กไฟฟ้า
    src: em-spectrum.svg
    alt: "แถบยาวแบ่งเป็นช่วง จากซ้ายไปขวา: คลื่นวิทยุ ไมโครเวฟ อินฟราเรด แสงที่มองเห็น (แถบแคบสีรุ้ง) อัลตราไวโอเลต รังสีเอกซ์ รังสีแกมมา ด้านบนมีสเกลความยาวคลื่น 1 km, 1 m, 1 cm, 1 mm, 1 µm, 1 nm, 1 pm และลูกศรบอกว่าไปทางขวาความยาวคลื่นสั้นลง ความถี่และพลังงานสูงขึ้น แถบแสงที่มองเห็นขยายให้ดูจากแดง 700 nm ถึงม่วง 400 nm ด้านล่างเป็นตัวอย่างการใช้: วิทยุ ทีวี, เตาไมโครเวฟ Wi-Fi, รีโมต กล้องจับความร้อน, ฆ่าเชื้อ ตรวจธนบัตร, ภาพเอกซเรย์, รักษามะเร็ง และหมายเหตุว่าอัลตราไวโอเลตพลังงานสูง รังสีเอกซ์ และรังสีแกมมาทำให้แตกตัวเป็นไอออนได้"
    caption: "สเกลความยาวคลื่นเพิ่มทีละ 10 เท่า แสงที่มองเห็นเป็นเพียงช่วงแคบ ๆ"
  - type: worked-example
    title: ความยาวคลื่นของสถานีวิทยุ FM
    problem: "สถานีวิทยุ FM ส่งคลื่นความถี่ $95.5\\ \\mathrm{MHz}$ ความยาวคลื่นเป็นเท่าใด และคลื่นนี้อยู่ในช่วงใดของสเปกตรัม"
    steps:
      - text: "แปลงหน่วย: $95.5\\ \\mathrm{MHz} = 95.5 \\times 10^6\\ \\mathrm{Hz}$"
        why: "M (เมกะ) คือ $10^6$ ต้องใช้หน่วย Hz จึงได้ความยาวคลื่นเป็นเมตร"
      - text: "จัดรูปสมการ $c = f\\lambda$ เป็น $\\lambda = \\dfrac{c}{f}$"
      - text: "แทนค่า: $\\lambda = \\dfrac{3.0 \\times 10^8}{95.5 \\times 10^6} \\approx 3.14\\ \\mathrm{m}$"
      - text: "ความยาวคลื่นราว 3 เมตร อยู่ในช่วงคลื่นวิทยุ เสาอากาศวิทยุ FM จึงยาวในระดับเมตร"
    answer: "$\\lambda \\approx 3.1\\ \\mathrm{m}$ เป็นคลื่นวิทยุ"
  - { type: check, problem: physics.waves.em-spectrum-intro.p005, prompt: "ลองคิดก่อนอ่านต่อ" }
  - type: worked-example
    title: ถ้าเสียงเดินทางในอวกาศได้
    problem: "แสงจากดวงอาทิตย์เดินทาง $1.5 \\times 10^{11}\\ \\mathrm{m}$ มาถึงโลก ถ้าสมมติว่าอวกาศมีอากาศให้เสียงเดินทางด้วยอัตราเร็ว $340\\ \\mathrm{m/s}$ เสียงจะใช้เวลานานเท่าใด เทียบกับแสง"
    steps:
      - text: "แสง: $t = \\dfrac{1.5 \\times 10^{11}}{3.0 \\times 10^8} = 500\\ \\mathrm{s}$ ประมาณ 8 นาที 20 วินาที"
      - text: "เสียง: $t = \\dfrac{1.5 \\times 10^{11}}{340} \\approx 4.4 \\times 10^8\\ \\mathrm{s}$"
      - text: "แปลงเป็นปี: 1 ปีประมาณ $3.16 \\times 10^7\\ \\mathrm{s}$ จึงได้ $\\dfrac{4.4 \\times 10^8}{3.16 \\times 10^7} \\approx 14$ ปี"
        why: "แปลงเป็นหน่วยที่คุ้นเคยช่วยให้เห็นว่าต่างกันมากเพียงใด"
      - text: "แต่ในความจริงอวกาศเกือบเป็นสุญญากาศ เสียงจึงมาไม่ถึงเลย ส่วนแสงไม่ต้องใช้ตัวกลาง"
    answer: "แสงใช้เวลา 500 วินาที เสียง (ถ้าเดินทางได้) ใช้ราว 14 ปี"
  - { type: check, problem: physics.waves.em-spectrum-intro.p009, prompt: "ใช้สิ่งที่เพิ่งเรียนเปรียบเทียบแสงกับเสียง" }
  - type: interactive
    title: ความถี่สูง ความยาวคลื่นสั้น
    caption: "แกน x คือความถี่ (MHz) แกน y คือความยาวคลื่น (m) จาก $\\lambda = \\dfrac{c}{f} = \\dfrac{300}{f}$ เมื่อ $f$ เป็น MHz ช่วง x ครอบคลุมวิทยุ FM (88–108 MHz) และทีวีดิจิทัล (UHF) แถบเลื่อน n คือดรรชนีหักเหของตัวกลาง ในตัวกลางที่ n มากขึ้น คลื่นช้าลงและความยาวคลื่นสั้นลง"
    widget:
      kind: function-plot
      functions: ["\\frac{300}{n x}"]
      sliders:
        - { name: n, min: 1, max: 2, step: 0.1, value: 1, label: ดรรชนีหักเหของตัวกลาง }
      x: [50, 800]
      y: [0, 6]
glossary:
  - { term: คลื่นแม่เหล็กไฟฟ้า, definition: "คลื่นตามขวางของสนามไฟฟ้าและสนามแม่เหล็กที่สั่นตั้งฉากกัน เดินทางในสุญญากาศได้ด้วยอัตราเร็ว $3.0 \\times 10^8\\ \\mathrm{m/s}$" }
  - { term: สเปกตรัมคลื่นแม่เหล็กไฟฟ้า, definition: "ช่วงของคลื่นแม่เหล็กไฟฟ้าเรียงตามความถี่ จากคลื่นวิทยุ ไมโครเวฟ อินฟราเรด แสงที่มองเห็น อัลตราไวโอเลต รังสีเอกซ์ ถึงรังสีแกมมา" }
  - { term: อัตราเร็วแสง, definition: "อัตราเร็วของคลื่นแม่เหล็กไฟฟ้าในสุญญากาศ $c = 3.0 \\times 10^8\\ \\mathrm{m/s}$ ในตัวกลางจะช้าลง" }
  - { term: การแตกตัวเป็นไอออน, definition: "การที่อิเล็กตรอนหลุดจากอะตอม รังสีพลังงานสูง เช่น รังสีเอกซ์และรังสีแกมมา ทำให้เกิดได้และทำลาย DNA" }
  - { term: ดัชนียูวี, definition: "ตัวเลขบอกความแรงของรังสีอัลตราไวโอเลตจากแสงแดด ยิ่งสูงยิ่งต้องป้องกันผิวและตามาก" }
flashcards:
  - { front: "เรียงสเปกตรัมจากความยาวคลื่นยาวไปสั้น", back: "วิทยุ → ไมโครเวฟ → อินฟราเรด → แสงที่มองเห็น → อัลตราไวโอเลต → รังสีเอกซ์ → รังสีแกมมา" }
  - { front: "อัตราเร็วของคลื่นแม่เหล็กไฟฟ้าในสุญญากาศ", back: "$3.0 \\times 10^8\\ \\mathrm{m/s}$ เท่ากันทุกชนิด" }
  - { front: "หาความยาวคลื่นจากความถี่", back: "$\\lambda = \\dfrac{c}{f}$ อย่าลืมแปลง MHz และ GHz เป็น Hz" }
  - { front: "แสงต่างจากเสียงอย่างไร", back: "แสงไม่ต้องใช้ตัวกลาง เร็วกว่ามาก และเป็นคลื่นตามขวาง เสียงในอากาศเป็นคลื่นตามยาว" }
  - { front: "คลื่นแม่เหล็กไฟฟ้าชนิดใดทำให้แตกตัวเป็นไอออน", back: "อัลตราไวโอเลตพลังงานสูง รังสีเอกซ์ และรังสีแกมมา" }
