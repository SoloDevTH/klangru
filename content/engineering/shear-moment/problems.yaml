  - id: engineering.mechanics.shear-moment.p015
    topics: [engineering.mechanics.shear-moment]
    difficulty: 5
    type: numeric
    stem: "คานยาว $10\\ \\mathrm{m}$ รับแรงกระจายสม่ำเสมอตลอดความยาว วางบนฐานรองรับสองจุดที่ห่างปลายแต่ละข้างเท่ากันเป็นระยะ $a$ (มีปลายยื่นสองข้าง) ถ้าต้องการให้โมเมนต์บวกสูงสุดกลางช่วงมีขนาดเท่ากับโมเมนต์ลบที่ฐานรองรับ $a$ ควรเป็นกี่เมตร (ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 2.07, tolerance: 0.02, unit: m }
    misconceptions:
      - { match: 2.5, feedback: "ใช้โมเมนต์กลางช่วงเป็น $w(L - 2a)^2/8$ ของคานช่วงเดียว ซึ่งลืมว่าปลายยื่นทั้งสองข้างลดโมเมนต์กลางช่วงลงอีก $wa^2/2$" }
      - { match: 1.83, feedback: "ใช้โมเมนต์ที่ฐานเป็น $wa^2$ แรงของปลายยื่น $wa$ กระทำที่กึ่งกลางปลายยื่น จึงได้ $wa^2/2$" }
    hints:
      - "ที่ฐาน: $M = -wa^2/2$ ที่กึ่งกลาง: $M = \\dfrac{wL}{2}\\left(\\dfrac L2 - a\\right) - \\dfrac{w}{2}\\left(\\dfrac L2\\right)^2$"
      - "ตั้งขนาดให้เท่ากัน ได้สมการกำลังสองของ $a$"
    solution: "กลางช่วง: $M = \\dfrac{wL^2}{8} - \\dfrac{wLa}{2}$ ตั้ง $\\dfrac{wL^2}{8} - \\dfrac{wLa}{2} = \\dfrac{wa^2}{2}$ ได้ $4a^2 + 4La - L^2 = 0$ และ $a = \\dfrac{\\sqrt2 - 1}{2}L = 0.207L = 2.07\\ \\mathrm{m}$ (ตรวจด้วยการไล่ค่า $a$ เชิงตัวเลขได้ $|M| = 2.14w$ ทั้งสองตำแหน่ง)"
