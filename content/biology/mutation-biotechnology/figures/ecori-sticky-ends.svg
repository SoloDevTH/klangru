<text x="380.0" y="290.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">4. ปลายเหนียวของยีนและพลาสมิดจับคู่เบสกัน แล้วไลเกสเชื่อมพันธะ ได้ DNA รีคอมบิแนนท์</text>
