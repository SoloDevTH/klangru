  - id: engineering.environmental.carbon-neutrality.p016
    topics:
      - engineering.environmental.carbon-neutrality
    difficulty: 5
    type: code
    stem: เขียนฟังก์ชัน `total_tco2e(items)` ที่รับลิสต์ของคู่ (มวลเป็นกิโลกรัม, GWP) แล้วคืนคาร์บอนไดออกไซด์เทียบเท่ารวมเป็นตัน โดย tCO₂e = ผลรวมของ (มวล × GWP) ÷ 1000
    starter: "def total_tco2e(items):\n    pass\n"
    tests: 'r = total_tco2e([(2000, 28)])

      assert r is not None, "ฟังก์ชันยังไม่ได้คืนค่า ให้ใช้ return ไม่ใช่ print"

      assert abs(r - 56.0) < 1e-9, f"total_tco2e([(2000, 28)]) ควรได้ 56.0 แต่ได้ {r} (อย่าลืมหารด้วย 1000)"

      assert abs(total_tco2e([(1000, 1), (5, 265)]) - 2.325) < 1e-9, f"ควรได้ 2.325 แต่ได้ {total_tco2e([(1000, 1), (5, 265)])}"

      assert total_tco2e([]) == 0, "ไม่มีรายการควรได้ 0"

      '
    reference: "def total_tco2e(items):\n    return sum(mass * gwp for mass, gwp in items) / 1000\n"
    hints:
      - ใช้ sum พร้อมนิพจน์ mass * gwp สำหรับแต่ละคู่
      - หารผลรวมด้วย 1000 ก่อนคืนค่าด้วย return
    solution: คืนค่า sum(mass * gwp for mass, gwp in items) / 1000 เช่น (1000 × 1 + 5 × 265) ÷ 1000 = 2.325
