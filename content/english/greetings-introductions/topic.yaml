id: english.speaking.greetings-introductions
subject: english
title: { th: การทักทาย แนะนำตัว ขอบคุณ และขอโทษ, en: "Greetings, introductions, thanks and apologies" }
summary: ทักทายตามช่วงเวลา ถามตอบ How are you? แนะนำชื่อ อายุ และที่มา ขอบคุณ ขอโทษ บอกลา และใช้ท่าทางตามวัฒนธรรมของเจ้าของภาษา
difficulty: 1
minutes: 25
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - type: figure
    src: greetings-by-time.svg
    alt: "แถบเวลาจาก 05:00 ถึง 24:00 แบ่งสามช่วง: Good morning ตั้งแต่เช้าถึงเที่ยง (12:00), Good afternoon จากเที่ยงถึงราว 18:00, Good evening ตั้งแต่ราว 18:00 มีรูปดวงอาทิตย์ตอนเช้าและพระจันทร์ตอนค่ำ ข้อความด้านล่างบอกว่า Good night ใช้ตอนลาตอนกลางคืนหรือก่อนนอน ไม่ใช้ทักทายตอนพบกัน และ Hello/Hi ใช้ได้ทุกเวลา ส่วน Goodbye/Bye/See you ใช้ตอนลา"
    caption: "เลือกคำทักทายตามช่วงเวลา Good night ใช้ตอนลาเท่านั้น"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.speaking.greetings-introductions.p001, prompt: "ดูเวลาแล้วเลือกคำทักทาย" }
  - type: figure
    src: introductions-dialogue.svg
    alt: "บทสนทนาสี่บรรทัดในกรอบข้อความ Nok: Hello! I'm Nok. Tom: Hi, Nok. I'm Tom. Nok: Nice to meet you. Tom: Nice to meet you, too. ด้านล่างเป็นภาพตัวการ์ตูนเส้นสองคนชื่อ Nok และ Tom กำลังจับมือกัน"
    caption: "แนะนำตัวและจับมือ ตามธรรมเนียมของเจ้าของภาษา"
  - type: worked-example
    title: แนะนำตัวกับเพื่อนใหม่
    problem: "มีนักเรียนแลกเปลี่ยนชื่อ Emma มาจากออสเตรเลีย เธอพูดว่า *Hi! I'm Emma. What's your name?* ให้ตอบโดยบอกชื่อ (Mint) อายุ (11 ขวบ) และจังหวัด (Khon Kaen)"
    steps:
      - text: "ทักกลับและบอกชื่อ: *Hi, Emma. I'm Mint.* (หรือ My name is Mint.)"
      - text: "บอกอายุด้วย am: *I'm eleven years old.*"
        why: "ภาษาอังกฤษบอกอายุด้วย verb to be ไม่ใช้ have แบบที่บางคนแปลจาก มีอายุ"
      - text: "บอกที่มาด้วย from: *I'm from Khon Kaen.*"
      - text: "ปิดท้ายด้วยคำที่สุภาพ: *Nice to meet you.*"
    answer: "*Hi, Emma. I'm Mint. I'm eleven years old. I'm from Khon Kaen. Nice to meet you.*"
  - { type: check, problem: english.speaking.greetings-introductions.p011, prompt: "ถามกลับอย่างสุภาพด้วยคำสั้น ๆ" }
  - type: worked-example
    title: เลือกคำขอบคุณ ขอโทษ และคำตอบรับ
    problem: "ที่ตลาดนัด ดาวทำเหรียญหล่น นักท่องเที่ยวเก็บให้ ดาวขอบคุณ แล้วต่อมาดาวเดินชนนักท่องเที่ยวคนนั้นโดยไม่ตั้งใจ บทสนทนาควรเป็นอย่างไร"
    steps:
      - text: "ได้รับความช่วยเหลือ ดาวพูดว่า *Thank you.* นักท่องเที่ยวตอบ *You're welcome.*"
      - text: "ทำผิดโดยไม่ตั้งใจ ดาวพูดว่า *I'm sorry.* นักท่องเที่ยวตอบ *That's OK.*"
        why: "Thank you คู่กับ You're welcome ส่วน Sorry คู่กับ That's OK อย่าสลับคู่"
      - text: "ตอนแยกกัน ดาวโบกมือและพูดว่า *Goodbye!* หรือ *Bye!*"
    answer: "Thank you. — You're welcome. / I'm sorry. — That's OK. / Goodbye!"
glossary:
  - { term: greeting, definition: "คำทักทาย เช่น Hello, Good morning" }
  - { term: introduction, definition: "การแนะนำตัวหรือแนะนำผู้อื่น เช่น I'm Nok. This is my friend, Beam." }
  - { term: "Nice to meet you.", definition: "ยินดีที่ได้รู้จัก ตอบกลับว่า Nice to meet you, too." }
  - { term: "You're welcome.", definition: "ด้วยความยินดี ใช้ตอบเมื่อมีคนขอบคุณ" }
  - { term: handshake, definition: "การจับมือทักทาย ธรรมเนียมของเจ้าของภาษาอังกฤษเมื่อพบกันครั้งแรก มักทำพร้อมยิ้มและสบตา" }
flashcards:
  - { front: "Good night ใช้ตอนไหน", back: "ตอนลาตอนกลางคืนหรือก่อนเข้านอน ไม่ใช้ทักทายตอนพบกัน" }
  - { front: "ตอบ How are you? อย่างไร", back: "I'm fine, thank you. And you? (ตอบสั้น ๆ แล้วถามกลับ)" }
  - { front: "อายุ 10 ขวบ ภาษาอังกฤษพูดว่าอย่างไร", back: "I'm ten years old. (ไม่ใช่ I have ten years.)" }
  - { front: "Thank you. ตอบว่าอะไร / I'm sorry. ตอบว่าอะไร", back: "You're welcome. / That's OK." }
  - { front: "เจ้าของภาษาอังกฤษทักทายคนที่พบครั้งแรกด้วยท่าทางอะไร", back: "จับมือสั้น ๆ ยิ้ม และสบตา" }
