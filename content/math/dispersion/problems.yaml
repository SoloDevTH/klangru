problems:
  - id: math.disp.p001
    topics: [math.stats.dispersion]
    difficulty: 1
    type: numeric
    stem: "จงหาพิสัยของข้อมูล 12, 7, 3, 15, 9"
    answer: { value: 12 }
    hints:
      - "พิสัย = ค่าสูงสุด − ค่าต่ำสุด"
      - "หาค่าที่มากที่สุดและน้อยที่สุดในข้อมูลทุกตัว ไม่ใช่ตัวแรกกับตัวสุดท้ายของรายการ"
    misconceptions:
      - { match: 3, feedback: "นั่นคือตัวแรกลบตัวสุดท้ายของรายการ ($12 - 9$) แต่รายการยังไม่ได้เรียง ต้องใช้ค่าสูงสุดและค่าต่ำสุด" }
      - { match: 15, feedback: "นั่นคือค่าสูงสุด ยังต้องลบด้วยค่าต่ำสุด" }
    solution: "ค่าสูงสุด 15 ค่าต่ำสุด 3 พิสัย $= 15 - 3 = 12$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.disp.p002
    topics: [math.stats.dispersion]
    difficulty: 2
    type: numeric
    stem: "ข้อมูล 11 ตัวเรียงแล้วคือ 2, 4, 5, 7, 8, 10, 12, 13, 15, 18, 20 จงหาควอร์ไทล์ที่ 1 ($Q_1$)"
    answer: { value: 5 }
    hints:
      - "ตำแหน่งของ $Q_1$ คือ $\\dfrac{N + 1}{4}$"
      - "แทน $N = 11$ แล้วนับไปถึงข้อมูลตำแหน่งนั้น"
    misconceptions:
      - { match: 4, feedback: "ดูเหมือนใช้ตำแหน่ง $\\tfrac{N}{4} = 2.75$ แล้วปัดลง ตำแหน่งของ $Q_1$ คือ $\\tfrac{N + 1}{4} = 3$" }
      - { match: 10, feedback: "นั่นคือมัธยฐาน ($Q_2$) ซึ่งอยู่ตำแหน่งที่ 6 ส่วน $Q_1$ อยู่ตำแหน่งที่ $\\tfrac{11 + 1}{4}$" }
    solution: "ตำแหน่ง $Q_1 = \\dfrac{11 + 1}{4} = 3$ ข้อมูลตำแหน่งที่ 3 คือ 5 จึงได้ $Q_1 = 5$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.disp.p003
    topics: [math.stats.dispersion]
    difficulty: 3
    type: numeric
    stem: "จงหาพิสัยระหว่างควอร์ไทล์ (IQR) ของข้อมูล 14, 9, 21, 6, 17, 11, 25"
    answer: { value: 12 }
    hints:
      - "เรียงข้อมูลจากน้อยไปมากก่อน"
      - "มีข้อมูล 7 ตัว $Q_1$ อยู่ตำแหน่ง $\\tfrac{7 + 1}{4}$ และ $Q_3$ อยู่ตำแหน่ง $\\tfrac{3(7 + 1)}{4}$"
      - "IQR $= Q_3 - Q_1$"
    misconceptions:
      - { match: 2, feedback: "หยิบตำแหน่งที่ 2 และ 6 จากรายการที่ยังไม่ได้เรียง ($11 - 9$) ต้องเรียงข้อมูลก่อน" }
      - { match: 19, feedback: "นั่นคือพิสัย (สูงสุด − ต่ำสุด) IQR ใช้ $Q_3 - Q_1$" }
    solution: "เรียงได้ 6, 9, 11, 14, 17, 21, 25 $Q_1$ = ตำแหน่งที่ 2 = 9 และ $Q_3$ = ตำแหน่งที่ 6 = 21 IQR $= 21 - 9 = 12$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.disp.p004
    topics: [math.stats.dispersion]
    difficulty: 2
    type: mcq
    stem: "ในแผนภาพกล่อง ข้อมูลประมาณร้อยละเท่าใดอยู่ภายในกล่อง (ระหว่าง $Q_1$ ถึง $Q_3$)"
    choices:
      - { id: a, text: "50%", correct: true }
      - { id: b, text: "25%", feedback: "25% คือส่วนระหว่างควอร์ไทล์ที่อยู่ติดกันหนึ่งช่วง เช่น $Q_1$ ถึงมัธยฐาน กล่องมีสองช่วงแบบนี้" }
      - { id: c, text: "75%", feedback: "75% คือข้อมูลที่มีค่าไม่เกิน $Q_3$ ซึ่งรวมส่วนที่ต่ำกว่า $Q_1$ ไว้ด้วย" }
      - { id: d, text: "100%", feedback: "ข้อมูลทั้งหมดอยู่ระหว่างปลายหนวดทั้งสองข้าง ไม่ใช่ภายในกล่อง" }
    hints:
      - "ควอร์ไทล์แบ่งข้อมูลออกเป็นสี่ส่วน ส่วนละประมาณ 25%"
      - "นับว่าจาก $Q_1$ ถึง $Q_3$ มีกี่ส่วน"
    solution: "จาก $Q_1$ ถึงมัธยฐานมีประมาณ 25% และจากมัธยฐานถึง $Q_3$ อีก 25% รวมเป็นประมาณ 50% คือข้อมูลครึ่งกลาง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.disp.p005
    topics: [math.stats.dispersion]
    difficulty: 3
    type: match
    stem: "แผนภาพกล่องของข้อมูลชุดหนึ่งมีค่าต่ำสุด 3, $Q_1 = 8$, มัธยฐาน 12, $Q_3 = 15$ และค่าสูงสุด 22 จับคู่ค่าวัดกับค่าที่ถูกต้อง"
    pairs:
      - { left: "พิสัย", right: "19" }
      - { left: "พิสัยระหว่างควอร์ไทล์", right: "7" }
      - { left: "มัธยฐาน", right: "12" }
      - { left: "ความกว้างจาก $Q_1$ ถึงมัธยฐาน", right: "4" }
    hints:
      - "พิสัยใช้ค่าสูงสุดกับค่าต่ำสุด"
      - "พิสัยระหว่างควอร์ไทล์คือความกว้างของกล่อง"
    solution: "พิสัย $= 22 - 3 = 19$ | IQR $= 15 - 8 = 7$ | มัธยฐาน $= 12$ | จาก $Q_1$ ถึงมัธยฐาน $= 12 - 8 = 4$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.disp.p006
    topics: [math.stats.dispersion]
    difficulty: 3
    type: numeric
    stem: "จงหาส่วนเบี่ยงเบนมาตรฐาน (ประชากร) ของข้อมูล 2, 4, 4, 4, 5, 5, 7, 9"
    answer: { value: 2 }
    hints:
      - "หาค่าเฉลี่ย $\\mu$ ก่อน"
      - "หา $(x - \\mu)^2$ ของข้อมูลทุกตัวแล้วรวมกัน"
      - "หารผลรวมด้วย $N = 8$ แล้วถอดรากที่สอง"
    misconceptions:
      - { match: 4, feedback: "นั่นคือความแปรปรวน $\\sigma^2$ ยังต้องถอดรากที่สองอีกครั้ง" }
      - { match: 2.138, feedback: "หารด้วย $N - 1 = 7$ ซึ่งเป็นสูตรของกลุ่มตัวอย่าง ข้อนี้ใช้สูตรประชากรที่หารด้วย $N$" }
    solution: "$\\mu = \\dfrac{40}{8} = 5$ ส่วนเบี่ยงเบนยกกำลังสอง: $9, 1, 1, 1, 0, 0, 4, 16$ รวม $32$ $\\sigma^2 = \\dfrac{32}{8} = 4$ $\\sigma = \\sqrt{4} = 2$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.disp.p007
    topics: [math.stats.dispersion]
    difficulty: 4
    type: numeric
    stem: "จงหาส่วนเบี่ยงเบนมาตรฐาน (ประชากร) ของข้อมูล 6, 8, 10, 12, 14 (ตอบเป็นทศนิยม 2 ตำแหน่ง)"
    answer: { value: 2.828, tolerance: 0.03 }
    hints:
      - "ค่าเฉลี่ยของข้อมูลชุดนี้หาได้ง่าย เพราะข้อมูลห่างกันเท่า ๆ กัน"
      - "รวม $(x - \\mu)^2$ แล้วหารด้วย 5"
      - "ผลที่ได้คือความแปรปรวน ถอดรากที่สองเป็นขั้นสุดท้าย"
    misconceptions:
      - { match: 8, feedback: "นั่นคือความแปรปรวน ยังต้องถอดรากที่สอง" }
      - { match: 3.162, feedback: "หารด้วย $N - 1 = 4$ ซึ่งเป็นสูตรของกลุ่มตัวอย่าง ข้อนี้ใช้สูตรประชากรที่หารด้วย $N = 5$" }
    solution: "$\\mu = 10$ ส่วนเบี่ยงเบน: $-4, -2, 0, 2, 4$ ยกกำลังสองรวม $16 + 4 + 0 + 4 + 16 = 40$ $\\sigma^2 = \\dfrac{40}{5} = 8$ $\\sigma = \\sqrt{8} = 2\\sqrt{2} \\approx 2.83$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.disp.p008
    topics: [math.stats.dispersion]
    difficulty: 3
    type: mcq
    stem: "ห้อง ม.3/1 และ ม.3/2 สอบคณิตศาสตร์ได้คะแนนเฉลี่ย 65 คะแนนเท่ากัน ห้อง ม.3/1 มีส่วนเบี่ยงเบนมาตรฐาน 4 คะแนน ห้อง ม.3/2 มีส่วนเบี่ยงเบนมาตรฐาน 12 คะแนน ข้อสรุปใดถูกต้อง"
    choices:
      - { id: a, text: "คะแนนของห้อง ม.3/1 เกาะกลุ่มใกล้ 65 มากกว่าห้อง ม.3/2", correct: true }
      - { id: b, text: "ห้อง ม.3/2 เรียนเก่งกว่า เพราะส่วนเบี่ยงเบนมาตรฐานสูงกว่า", feedback: "ส่วนเบี่ยงเบนมาตรฐานวัดการกระจาย ไม่ได้วัดว่าเก่งกว่า ทั้งสองห้องมีค่าเฉลี่ยเท่ากัน" }
      - { id: c, text: "นักเรียนทุกคนในห้อง ม.3/1 ได้คะแนนระหว่าง 61 ถึง 69", feedback: "ส่วนเบี่ยงเบนมาตรฐานบอกระยะห่างโดยเฉลี่ย ไม่ใช่ขอบเขต อาจมีบางคนได้คะแนนนอกช่วงนี้" }
      - { id: d, text: "พิสัยของห้อง ม.3/2 ต้องน้อยกว่าของห้อง ม.3/1", feedback: "กลับกัน ข้อมูลที่กระจายมากกว่ามักมีพิสัยกว้างกว่า และส่วนเบี่ยงเบนมาตรฐานของห้อง ม.3/2 สูงกว่า" }
    hints:
      - "ส่วนเบี่ยงเบนมาตรฐานวัดอะไร ค่ากลางหรือการกระจาย"
      - "ส่วนเบี่ยงเบนมาตรฐานน้อย แปลว่าข้อมูลส่วนใหญ่อยู่ใกล้หรือไกลจากค่าเฉลี่ย"
    solution: "ค่าเฉลี่ยเท่ากัน แต่ห้อง ม.3/1 มี $\\sigma$ น้อยกว่า คะแนนจึงอยู่ใกล้ 65 มากกว่า ส่วนห้อง ม.3/2 มีทั้งคนที่ได้สูงมากและต่ำมากปนกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.disp.p009
    topics: [math.stats.dispersion]
    difficulty: 4
    type: numeric
    stem: "อุณหภูมิสูงสุดรายวันของจังหวัดเชียงรายในช่วง 5 วัน คือ 31, 33, 34, 35 และ $37\\ ^\\circ\\mathrm{C}$ จงหาส่วนเบี่ยงเบนมาตรฐาน (ประชากร) ของอุณหภูมิชุดนี้ (หน่วย $^\\circ\\mathrm{C}$)"
    answer: { value: 2, unit: "°C" }
    hints:
      - "หาค่าเฉลี่ยของอุณหภูมิทั้งห้าวันก่อน"
      - "หาว่าแต่ละวันห่างจากค่าเฉลี่ยเท่าใด ยกกำลังสอง แล้วรวมกัน"
      - "หารด้วย 5 แล้วถอดรากที่สอง"
    misconceptions:
      - { match: 4, feedback: "นั่นคือความแปรปรวน ซึ่งมีหน่วยเป็น $(^\\circ\\mathrm{C})^2$ ต้องถอดรากที่สองให้หน่วยกลับเป็น $^\\circ\\mathrm{C}$" }
      - { match: 2.236, feedback: "หารด้วย $N - 1 = 4$ ซึ่งเป็นสูตรของกลุ่มตัวอย่าง ข้อนี้ใช้สูตรประชากรที่หารด้วย $N = 5$" }
    solution: "$\\mu = \\dfrac{170}{5} = 34\\ ^\\circ\\mathrm{C}$ ส่วนเบี่ยงเบน: $-3, -1, 0, 1, 3$ ยกกำลังสองรวม $9 + 1 + 0 + 1 + 9 = 20$ $\\sigma^2 = 4$ ได้ $\\sigma = 2\\ ^\\circ\\mathrm{C}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.disp.p010
    topics: [math.stats.dispersion]
    difficulty: 5
    type: numeric
    stem: "ข้อมูล 11 ตัวเรียงแล้วคือ 12, 14, 15, 15, 16, 18, 19, 20, 21, 22, 40 ถ้าใช้เกณฑ์ว่าค่าที่มากกว่า $Q_3 + 1.5\\,\\text{IQR}$ เป็นค่าผิดปกติ เกณฑ์ด้านบนนี้มีค่าเท่าใด"
    answer: { value: 30 }
    hints:
      - "หา $Q_1$ และ $Q_3$ จากตำแหน่ง $\\tfrac{N + 1}{4}$ และ $\\tfrac{3(N + 1)}{4}$"
      - "หา IQR $= Q_3 - Q_1$"
      - "คำนวณ $Q_3 + 1.5 \\times \\text{IQR}$ แล้วดูว่า 40 เกินเกณฑ์หรือไม่"
    misconceptions:
      - { match: 27, feedback: "บวก IQR เข้ากับ $Q_3$ ไปเพียง 1 เท่า เกณฑ์คือ $Q_3 + 1.5$ เท่าของ IQR" }
      - { match: 9, feedback: "นั่นคือ $1.5 \\times \\text{IQR}$ ยังต้องบวกกับ $Q_3$" }
    solution: "ตำแหน่ง $Q_1 = 3$ ได้ $Q_1 = 15$ ตำแหน่ง $Q_3 = 9$ ได้ $Q_3 = 21$ IQR $= 6$ เกณฑ์ $= 21 + 1.5(6) = 30$ ค่า 40 มากกว่า 30 จึงเป็นค่าผิดปกติ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.disp.p011
    topics: [math.stats.dispersion]
    difficulty: 5
    type: numeric
    stem: "ร้านกาแฟแห่งหนึ่ง เงินเดือนพนักงานมีส่วนเบี่ยงเบนมาตรฐาน 1,500 บาท เจ้าของร้านขึ้นเงินเดือนให้ทุกคน 10% แล้วเพิ่มค่าเดินทางให้อีกคนละ 200 บาทเท่ากัน ส่วนเบี่ยงเบนมาตรฐานของเงินที่พนักงานได้รับใหม่เป็นกี่บาท"
    answer: { value: 1650, unit: บาท }
    hints:
      - "คิดแยกสองขั้น: การคูณทุกตัวด้วยค่าคงที่ และการบวกทุกตัวด้วยค่าคงที่"
      - "ขึ้น 10% คือคูณด้วย 1.1 ระยะห่างระหว่างข้อมูลจึงเป็น 1.1 เท่า"
      - "บวกเท่ากันทุกคนแค่เลื่อนข้อมูลทั้งชุด ไม่เปลี่ยนระยะห่างระหว่างกัน"
    misconceptions:
      - { match: 1850, feedback: "บวก 200 เข้าไปในส่วนเบี่ยงเบนมาตรฐานด้วย แต่การบวกค่าเท่ากันทุกตัวไม่เปลี่ยนการกระจาย" }
      - { match: 1500, feedback: "การบวกค่าคงที่ไม่เปลี่ยนการกระจายก็จริง แต่การขึ้น 10% คือการคูณ ทำให้ระยะห่างกว้างขึ้น 1.1 เท่า" }
    solution: "คูณทุกตัวด้วย 1.1 ทำให้ $\\sigma$ เป็น $1.1 \\times 1500 = 1650$ บาท การบวก 200 บาททุกคนไม่เปลี่ยน $\\sigma$ จึงได้ $1650$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.disp.p012
    topics: [math.stats.dispersion]
    difficulty: 5
    type: numeric
    stem: "ข้อมูลประชากรชุดหนึ่งมี $N = 10$ ตัว ผลรวม $\\sum x = 50$ และผลรวมกำลังสอง $\\sum x^2 = 340$ จงหาส่วนเบี่ยงเบนมาตรฐาน"
    answer: { value: 3 }
    hints:
      - "ใช้สูตร $\\sigma = \\sqrt{\\dfrac{\\sum x^2}{N} - \\mu^2}$"
      - "หา $\\mu = \\dfrac{\\sum x}{N}$ ก่อน"
      - "แทนค่าในสูตร โดยลบด้วย $\\mu^2$ ไม่ใช่ $\\mu$ แล้วถอดรากที่สอง"
    misconceptions:
      - { match: 9, feedback: "นั่นคือความแปรปรวน ยังต้องถอดรากที่สอง" }
      - { match: 5.385, feedback: "ลบด้วย $\\mu = 5$ แทน $\\mu^2 = 25$ สูตรคือ $\\tfrac{\\sum x^2}{N} - \\mu^2$" }
    solution: "$\\mu = \\dfrac{50}{10} = 5$ $\\sigma^2 = \\dfrac{340}{10} - 5^2 = 34 - 25 = 9$ $\\sigma = \\sqrt{9} = 3$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.disp.p013
    topics: [math.stats.dispersion]
    difficulty: 2
    type: mcq
    stem: "ข้อมูลชุดหนึ่งมีค่าผิดปกติที่สูงมากอยู่หนึ่งค่า ค่าวัดการกระจายใดได้รับผลจากค่านี้ **มากที่สุด**"
    choices:
      - { id: a, text: "พิสัย", correct: true }
      - { id: b, text: "พิสัยระหว่างควอร์ไทล์ (IQR)", feedback: "IQR ใช้เฉพาะข้อมูลครึ่งกลาง ค่าที่ปลายสุดเพียงค่าเดียวแทบไม่ทำให้ $Q_1$ และ $Q_3$ ขยับ" }
      - { id: c, text: "มัธยฐาน", feedback: "มัธยฐานเป็นค่ากลาง ไม่ใช่ค่าวัดการกระจาย และทนต่อค่าผิดปกติด้วย" }
    hints:
      - "ค่าวัดใดใช้ค่าสูงสุดโดยตรงในการคำนวณ"
      - "พิสัย $=$ ค่าสูงสุด $-$ ค่าต่ำสุด"
    solution: "พิสัยใช้ค่าสูงสุดตรง ๆ ค่าผิดปกติที่สูงมากจึงทำให้พิสัยกว้างขึ้นเท่ากับระยะที่ค่านั้นยื่นออกไป ส่วน IQR ใช้เฉพาะข้อมูลครึ่งกลาง จึงทนต่อค่าผิดปกติ (ส่วนเบี่ยงเบนมาตรฐานก็ได้รับผลมากเช่นกัน เพราะยกกำลังสองระยะห่าง)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.disp.p014
    topics: [math.stats.dispersion]
    difficulty: 2
    type: numeric
    stem: "จงหาส่วนเบี่ยงเบนเฉลี่ย (MAD) ของข้อมูล 2, 4, 6, 8, 10 (ค่าเฉลี่ยของระยะห่างจากค่าเฉลี่ย)"
    answer: { value: 2.4, tolerance: 0.01 }
    hints:
      - "หาค่าเฉลี่ยก่อน แล้วหาระยะห่างของข้อมูลแต่ละตัวจากค่าเฉลี่ย (ใช้ค่าสัมบูรณ์ ไม่สนเครื่องหมาย)"
      - "รวมระยะห่างทั้งหมดแล้วหารด้วยจำนวนข้อมูล"
    misconceptions:
      - { match: 0, feedback: "รวมส่วนเบี่ยงเบนแบบมีเครื่องหมาย บวกกับลบจึงหักล้างกันจนเป็น 0 ต้องใช้ค่าสัมบูรณ์ (ระยะห่าง)" }
      - { match: 2.83, feedback: "นั่นคือส่วนเบี่ยงเบนมาตรฐาน ($\\sqrt{8}$) MAD ใช้ค่าเฉลี่ยของระยะห่างตรง ๆ ไม่ยกกำลังสอง" }
    solution: "ค่าเฉลี่ย $= 30 \\div 5 = 6$ ระยะห่าง $|x - 6|$ คือ 4, 2, 0, 2, 4 รวม 12 MAD $= 12 \\div 5 = 2.4$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.disp.p015
    topics: [math.stats.dispersion]
    difficulty: 3
    type: numeric
    stem: "แผนภาพกล่องแสดงเวลาวิ่ง 100 เมตรในวันกีฬาสีของนักเรียนสองห้อง IQR ของห้อง B มากกว่าห้อง A กี่วินาที"
    figure: { src: boxplots-compare.svg, alt: "แผนภาพกล่องสองกล่องบนแกนเวลา 12 ถึง 19 วินาที ห้อง A ค่าต่ำสุด 13 Q1 14 มัธยฐาน 14.5 Q3 15 ค่าสูงสุด 17 ห้อง B ค่าต่ำสุด 12.5 Q1 13.5 มัธยฐาน 15 Q3 16.5 ค่าสูงสุด 18" }
    answer: { value: 2, tolerance: 0.01, unit: วินาที }
    hints:
      - "IQR คือความยาวของกล่อง $Q_3 - Q_1$"
      - "อ่าน $Q_1$ และ $Q_3$ ของแต่ละห้องจากขอบกล่อง แล้วหา IQR ทั้งสองห้องก่อนลบกัน"
    misconceptions:
      - { match: 1.5, feedback: "นั่นคือผลต่างของพิสัย ($5.5 - 4$) IQR ใช้เฉพาะความยาวของกล่อง" }
      - { match: 0.5, feedback: "นั่นคือผลต่างของมัธยฐาน โจทย์ถามผลต่างของ IQR" }
    solution: "ห้อง A: IQR $= 15 - 14 = 1$ วินาที ห้อง B: IQR $= 16.5 - 13.5 = 3$ วินาที ห้อง B มากกว่า $3 - 1 = 2$ วินาที แปลว่าเวลาวิ่งของนักเรียนครึ่งกลางในห้อง B แตกต่างกันมากกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.disp.p016
    topics: [math.stats.dispersion]
    difficulty: 3
    type: numeric
    stem: "ส่วนสูงของนักกีฬาบาสเกตบอลทีม ก มีค่าเฉลี่ย 178 ซม. ทีม ข มีค่าเฉลี่ย 166 ซม. ทั้งสองทีมมีส่วนเบี่ยงเบนเฉลี่ย (MAD) 4 ซม. เท่ากัน ผลต่างของค่าเฉลี่ยเป็นกี่เท่าของ MAD"
    answer: { value: 3, unit: เท่า }
    hints:
      - "หาผลต่างของค่าเฉลี่ยก่อน"
      - "หารผลต่างด้วย MAD เพื่อดูว่าสองกลุ่มห่างกันกี่ \"ช่วงการกระจาย\""
    misconceptions:
      - { match: 12, feedback: "นั่นคือผลต่างของค่าเฉลี่ยในหน่วยเซนติเมตร ยังต้องหารด้วย MAD 4 ซม." }
    solution: "ผลต่าง $= 178 - 166 = 12$ ซม. คิดเป็น $12 \\div 4 = 3$ เท่าของ MAD แปลว่าข้อมูลสองทีมแทบไม่ซ้อนกัน ทีม ก สูงกว่าทีม ข อย่างชัดเจน ถ้าผลต่างน้อยกว่า MAD มาก ข้อมูลสองทีมจะซ้อนกันมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.disp.p017
    topics: [math.stats.dispersion]
    difficulty: 4
    type: numeric
    stem: "สำรวจราคาทุเรียนหมอนทองจาก 5 แผงในตลาด ได้ราคา 135, 145, 150, 155 และ 165 บาทต่อกิโลกรัม จงหาส่วนเบี่ยงเบนมาตรฐาน (ประชากร) ของราคา"
    answer: { value: 10, unit: บาท }
    hints:
      - "ค่าเฉลี่ยคือ 150 บาท หาส่วนเบี่ยงเบนของแต่ละแผงจาก 150"
      - "ยกกำลังสองส่วนเบี่ยงเบน รวม หารด้วย 5 แล้วถอดรากที่สอง"
    misconceptions:
      - { match: 100, feedback: "นั่นคือความแปรปรวน ยังต้องถอดรากที่สองเพื่อให้ได้หน่วยบาท" }
      - { match: 11.18, feedback: "หารด้วย $N - 1 = 4$ ซึ่งเป็นสูตรของกลุ่มตัวอย่าง โจทย์ให้ใช้สูตรประชากรที่หารด้วย $N = 5$" }
    solution: "ส่วนเบี่ยงเบน: $-15, -5, 0, 5, 15$ ยกกำลังสองรวม $225 + 25 + 0 + 25 + 225 = 500$ ความแปรปรวน $= 500 \\div 5 = 100$ ส่วนเบี่ยงเบนมาตรฐาน $= \\sqrt{100} = 10$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.disp.p018
    topics: [math.stats.dispersion]
    difficulty: 4
    type: expression
    stem: "ข้อมูลสามตัวคือ $x - d$, $x$ และ $x + d$ เมื่อ $d > 0$ เขียนส่วนเบี่ยงเบนมาตรฐาน (ประชากร) ในรูปของ $d$"
    prefix: "σ ="
    answer: { latex: "d\\sqrt{\\frac{2}{3}}", variables: [d] }
    hints:
      - "ค่าเฉลี่ยคือ $x$ ส่วนเบี่ยงเบนคือ $-d$, $0$, $d$"
      - "ความแปรปรวน $= \\dfrac{d^2 + 0 + d^2}{3}$ แล้วถอดรากที่สอง"
    misconceptions:
      - { match: "\\frac{2d}{3}", feedback: "นั่นคือส่วนเบี่ยงเบนเฉลี่ย (MAD) ส่วนเบี่ยงเบนมาตรฐานต้องยกกำลังสองก่อนเฉลี่ยแล้วถอดราก" }
      - { match: "\\frac{2d^2}{3}", feedback: "นั่นคือความแปรปรวน ยังต้องถอดรากที่สอง" }
    solution: "ค่าเฉลี่ย $= \\dfrac{3x}{3} = x$ ความแปรปรวน $= \\dfrac{d^2 + 0 + d^2}{3} = \\dfrac{2d^2}{3}$ จึงได้ $\\sigma = d\\sqrt{\\tfrac{2}{3}} \\approx 0.816d$ สังเกตว่าคำตอบไม่ขึ้นกับ $x$ เพราะการเลื่อนข้อมูลทั้งชุดไม่เปลี่ยนการกระจาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.disp.p019
    topics: [math.stats.dispersion]
    difficulty: 4
    type: numeric
    stem: "สถานีอุตุนิยมวิทยาบันทึกอุณหภูมิช่วงหนึ่ง มีส่วนเบี่ยงเบนมาตรฐาน $2.5\\ ^\\circ\\mathrm{C}$ ถ้าแปลงทุกค่าเป็นองศาฟาเรนไฮต์ด้วย $F = 1.8C + 32$ ส่วนเบี่ยงเบนมาตรฐานในหน่วย $^\\circ\\mathrm{F}$ เป็นเท่าใด"
    answer: { value: 4.5, tolerance: 0.01, unit: "°F" }
    hints:
      - "บวก 32 ทุกค่าทำให้ข้อมูลเลื่อนไปทั้งชุด การกระจายไม่เปลี่ยน"
      - "คูณ 1.8 ทุกค่าทำให้ระยะห่างระหว่างข้อมูลเป็น 1.8 เท่า"
    misconceptions:
      - { match: 36.5, feedback: "บวก 32 เข้าไปด้วย แต่การบวกค่าคงที่เพียงเลื่อนข้อมูลทั้งชุด ไม่ทำให้ข้อมูลห่างกันมากขึ้น" }
      - { match: 2.5, feedback: "การคูณด้วย 1.8 ทำให้ระยะห่างระหว่างข้อมูลขยายเป็น 1.8 เท่า ส่วนเบี่ยงเบนมาตรฐานจึงเปลี่ยน" }
    solution: "ส่วนเบี่ยงเบนมาตรฐานถูกคูณด้วย 1.8 แต่ไม่ได้รับผลจากการบวก 32 จึงได้ $1.8 \\times 2.5 = 4.5\\ ^\\circ\\mathrm{F}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.disp.p020
    topics: [math.stats.dispersion]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการหาส่วนเบี่ยงเบนมาตรฐาน (ประชากร)"
    items:
      - "หาค่าเฉลี่ย $\\mu$"
      - "หาส่วนเบี่ยงเบน $x - \\mu$ ของข้อมูลแต่ละตัว"
      - "ยกกำลังสองส่วนเบี่ยงเบนแต่ละตัวแล้วรวมกัน"
      - "หารผลรวมด้วย $N$ ได้ความแปรปรวน"
      - "ถอดรากที่สองของความแปรปรวน"
    hints:
      - "ต้องรู้ค่าเฉลี่ยก่อนจึงหาส่วนเบี่ยงเบนได้"
      - "ถอดรากที่สองเป็นขั้นสุดท้ายเพื่อให้หน่วยกลับมาเหมือนข้อมูล"
    solution: "ค่าเฉลี่ย → ส่วนเบี่ยงเบน → ยกกำลังสองแล้วรวม → หารด้วย $N$ (ความแปรปรวน) → ถอดรากที่สอง (ส่วนเบี่ยงเบนมาตรฐาน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.disp.p021
    topics: [math.stats.dispersion]
    difficulty: 1
    type: numeric
    stem: "อุณหภูมิต่ำสุดรายวันในกรุงเทพฯ หนึ่งสัปดาห์ คือ 24, 26, 25, 27, 23, 26, 25 องศาเซลเซียส พิสัยของอุณหภูมิเป็นกี่องศา"
    answer: { value: 4, unit: "°C" }
    hints:
      - "หาค่าที่มากที่สุดและน้อยที่สุดในข้อมูล"
      - "พิสัย = ค่าสูงสุด − ค่าต่ำสุด"
    misconceptions:
      - { match: 1, feedback: "ดูเหมือนนำค่าตัวสุดท้ายลบตัวแรกตามที่เขียนมา ($25 - 24$) ต้องใช้ค่าสูงสุด 27 และค่าต่ำสุด 23" }
    solution: "ค่าสูงสุด 27 ค่าต่ำสุด 23 พิสัย $= 27 - 23 = 4$ องศาเซลเซียส"
    license: CC-BY-SA-4.0
    ai_assisted: true
