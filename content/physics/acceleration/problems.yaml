- id: phy.acc.p001
  topics: [physics.kinematics.acceleration]
  difficulty: 1
  type: numeric
  stem: "จักรยานเริ่มจากหยุดนิ่ง และมีความเร็ว $10\\ \\mathrm{m/s}$ หลังผ่านไป $5\\ \\mathrm{s}$ ความเร่งเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s²)"
  answer: { value: 2, unit: m/s² }
  hints:
    - "ความเร่งคือความเร็วที่เปลี่ยนไปในหนึ่งวินาที"
    - "ใช้ $a = \\dfrac{v - u}{t}$ โดยเริ่มจากหยุดนิ่งแปลว่า $u = 0$"
  misconceptions:
    - { match: 0.5, feedback: "ดูเหมือนนำเวลาหารด้วยความเร็ว ต้องนำความเร็วที่เปลี่ยนไปหารด้วยเวลา" }
    - { match: 50, feedback: "ดูเหมือนนำความเร็วคูณเวลา ความเร่งต้องหารด้วยเวลา ลองตรวจหน่วย: $\\mathrm{m/s} \\div \\mathrm{s} = \\mathrm{m/s^2}$" }
  solution: "$a = \\dfrac{v - u}{t} = \\dfrac{10\\ \\mathrm{m/s} - 0\\ \\mathrm{m/s}}{5\\ \\mathrm{s}} = 2\\ \\mathrm{m/s^2}$ คือความเร็วเพิ่มขึ้น $2\\ \\mathrm{m/s}$ ทุกวินาที"
  license: CC-BY-SA-4.0
  ai_assisted: true

- id: phy.acc.p002
  topics: [physics.kinematics.acceleration]
  difficulty: 1
  type: mcq
  stem: "หน่วย SI ของความเร่งคือข้อใด"
  choices:
    - { id: a, text: "$\\mathrm{m/s^2}$", correct: true }
    - { id: b, text: "$\\mathrm{m/s}$", feedback: "นั่นคือหน่วยของความเร็วหรืออัตราเร็ว ความเร่งคือความเร็วหารด้วยเวลาอีกครั้งหนึ่ง" }
    - { id: c, text: "$\\mathrm{m \\cdot s}$", feedback: "ความเร่งเกิดจากการหารด้วยเวลา ไม่ใช่คูณ" }
    - { id: d, text: "$\\mathrm{s/m^2}$", feedback: "กลับด้าน ความเร่งคือความเร็ว (m/s) หารด้วยเวลา (s) เมตรจึงต้องอยู่ข้างบน" }
  hints:
    - "ความเร่ง = ความเร็วที่เปลี่ยนไป ÷ เวลา"
    - "นำหน่วยของความเร็ว $\\mathrm{m/s}$ มาหารด้วย $\\mathrm{s}$"
  solution: "$a = \\dfrac{\\Delta v}{\\Delta t}$ มีหน่วย $\\dfrac{\\mathrm{m/s}}{\\mathrm{s}} = \\mathrm{m/s^2}$"
  license: CC-BY-SA-4.0
  ai_assisted: true

- id: phy.acc.p003
  topics: [physics.kinematics.acceleration]
  difficulty: 2
  type: numeric
  stem: "รถยนต์วิ่งด้วยความเร็ว $20\\ \\mathrm{m/s}$ แล้วเบรกจนความเร็วลดลงเหลือ $5\\ \\mathrm{m/s}$ ในเวลา $3\\ \\mathrm{s}$ ให้ทิศที่รถวิ่งเป็นบวก ความเร่งเป็นเท่าใด (ตอบเป็นตัวเลขพร้อมเครื่องหมาย ในหน่วย m/s²)"
  answer: { value: -5, unit: m/s² }
  hints:
    - "ความเร็วต้น $u = 20\\ \\mathrm{m/s}$ ความเร็วปลาย $v = 5\\ \\mathrm{m/s}$"
    - "คิดความเร็วที่เปลี่ยนไปเป็น ปลาย ลบ ต้น แล้วหารด้วยเวลา"
  misconceptions:
    - { match: 5, feedback: "ขนาดถูก แต่รถช้าลง ความเร็วปลายน้อยกว่าความเร็วต้น $v - u$ จึงติดลบ ความเร่งต้องเป็นลบ" }
    - { match: 1.667, feedback: "ดูเหมือนใช้ $v \\div t$ เฉย ๆ ซึ่งใช้ได้เฉพาะเมื่อเริ่มจากหยุดนิ่ง ที่นี่รถมีความเร็วต้น 20 m/s ต้องใช้ $\\dfrac{v - u}{t}$" }
  solution: "$a = \\dfrac{v - u}{t} = \\dfrac{5\\ \\mathrm{m/s} - 20\\ \\mathrm{m/s}}{3\\ \\mathrm{s}} = \\dfrac{-15\\ \\mathrm{m/s}}{3\\ \\mathrm{s}} = -5\\ \\mathrm{m/s^2}$ เครื่องหมายลบบอกว่าความเร่งมีทิศตรงข้ามกับการเคลื่อนที่ รถจึงช้าลง"
  license: CC-BY-SA-4.0
  ai_assisted: true

- id: phy.acc.p004
  topics: [physics.kinematics.acceleration]
  difficulty: 3
  type: numeric
  stem: "รถจักรยานยนต์ออกตัวจากหยุดนิ่งจนมีความเร็ว $72\\ \\mathrm{km/h}$ ในเวลา $8\\ \\mathrm{s}$ ความเร่งเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s²)"
  answer: { value: 2.5, tolerance: 0.01, unit: m/s² }
  hints:
    - "คำตอบต้องเป็น $\\mathrm{m/s^2}$ แต่ความเร็วให้มาเป็น km/h"
    - "แปลง km/h เป็น m/s ด้วยการหาร 3.6 ก่อน แล้วค่อยหารด้วยเวลา"
  misconceptions:
    - { match: 9, feedback: "ดูเหมือนนำ 72 หาร 8 โดยไม่แปลงหน่วย ได้หน่วยเป็น km/h ต่อวินาที ต้องแปลง 72 km/h เป็น m/s ก่อน" }
  solution: "$v = 72 \\div 3.6 = 20\\ \\mathrm{m/s}$ ดังนั้น $a = \\dfrac{20\\ \\mathrm{m/s} - 0\\ \\mathrm{m/s}}{8\\ \\mathrm{s}} = 2.5\\ \\mathrm{m/s^2}$"
  license: CC-BY-SA-4.0
  ai_assisted: true

- id: phy.acc.p005
  topics: [physics.kinematics.acceleration]
  difficulty: 3
  type: match
  stem: "จับคู่ลักษณะของกราฟความเร็ว–เวลา (แกนนอนคือเวลา แกนตั้งคือความเร็ว) กับความหมายของการเคลื่อนที่"
  pairs:
    - { left: "เส้นตรงแนวนอนเหนือแกนเวลา", right: "ความเร็วคงที่ ความเร่งเป็นศูนย์" }
    - { left: "เส้นตรงชันขึ้น", right: "ความเร็วเพิ่มขึ้นสม่ำเสมอ ความเร่งเป็นบวก" }
    - { left: "เส้นตรงลาดลงเข้าหาแกนเวลา", right: "ความเร็วลดลงสม่ำเสมอ ความเร่งเป็นลบ" }
    - { left: "เส้นทับแกนเวลา", right: "วัตถุหยุดนิ่งตลอดเวลา" }
  hints:
    - "ความเร่งคือความชันของกราฟความเร็ว–เวลา"
    - "เส้นแนวนอนมีความชันเป็นศูนย์ เส้นที่ขึ้นมีความชันบวก เส้นที่ลงมีความชันลบ"
    - "เส้นทับแกนเวลาหมายความว่าความเร็วมีค่าเท่าใดตลอด"
  solution: "ความชันของกราฟ v–t คือความเร่ง: เส้นแนวนอน → $a = 0$ ความเร็วคงที่, เส้นชันขึ้น → $a > 0$, เส้นลาดลงเข้าหาแกนเวลา → $a < 0$ ความเร็วลดลง, เส้นทับแกนเวลา → $v = 0$ ตลอด วัตถุหยุดนิ่ง"
  license: CC-BY-SA-4.0
  ai_assisted: true

- id: phy.acc.p006
  topics: [physics.kinematics.acceleration]
  difficulty: 4
  type: numeric
  stem: "รถบรรทุกวิ่งด้วยความเร็ว $25\\ \\mathrm{m/s}$ แล้วเบรกด้วยความเร่ง $-3\\ \\mathrm{m/s^2}$ (ทิศที่รถวิ่งเป็นบวก) ต้องใช้เวลากี่วินาทีความเร็วจึงลดลงเหลือ $10\\ \\mathrm{m/s}$ (ตอบเป็นตัวเลขในหน่วย s)"
  answer: { value: 5, unit: s }
  hints:
    - "เริ่มจาก $a = \\dfrac{v - u}{t}$ แล้วจัดรูปหา $t$"
    - "คูณ $t$ ทั้งสองข้างแล้วหารด้วย $a$ ได้ $t = \\dfrac{v - u}{a}$"
    - "แทน $v - u = 10 - 25$ และ $a = -3$ ระวังเครื่องหมาย ลบหารลบ"
  misconceptions:
    - { match: -5, feedback: "เวลาติดลบไม่ได้ ลองตรวจเครื่องหมาย: $v - u = -15\\ \\mathrm{m/s}$ และ $a = -3\\ \\mathrm{m/s^2}$ ลบหารลบได้บวก" }
    - { match: 0.2, feedback: "ดูเหมือนจัดรูปกลับด้านเป็น $t = \\dfrac{a}{v - u}$ ลองตรวจหน่วย: ได้หน่วย 1/s ไม่ใช่วินาที" }
  solution: "$t = \\dfrac{v - u}{a} = \\dfrac{10\\ \\mathrm{m/s} - 25\\ \\mathrm{m/s}}{-3\\ \\mathrm{m/s^2}} = \\dfrac{-15\\ \\mathrm{m/s}}{-3\\ \\mathrm{m/s^2}} = 5\\ \\mathrm{s}$ ตรวจ: ความเร็วลดลง $3\\ \\mathrm{m/s}$ ทุกวินาที 5 วินาทีลดลง $15\\ \\mathrm{m/s}$ จาก 25 เหลือ 10 ✓"
  license: CC-BY-SA-4.0
  ai_assisted: true

- id: phy.acc.p007
  topics: [physics.kinematics.acceleration]
  difficulty: 4
  type: numeric
  stem: "กราฟความเร็ว–เวลาของรถเมล์ประกอบด้วยเส้นตรง 3 ช่วง: ช่วงแรกความเร็วเพิ่มจาก $2\\ \\mathrm{m/s}$ ที่ $t = 0$ เป็น $10\\ \\mathrm{m/s}$ ที่ $t = 4\\ \\mathrm{s}$ ช่วงที่สองความเร็วคงที่ $10\\ \\mathrm{m/s}$ จนถึง $t = 8\\ \\mathrm{s}$ ช่วงสุดท้ายความเร็วลดลงจนเป็น $0$ ที่ $t = 12\\ \\mathrm{s}$ ความเร่งใน **ช่วงสุดท้าย** เป็นเท่าใด (ตอบเป็นตัวเลขพร้อมเครื่องหมาย ในหน่วย m/s²)"
  answer: { value: -2.5, tolerance: 0.01, unit: m/s² }
  hints:
    - "ความเร่งคือความชันของกราฟในช่วงนั้น ใช้เฉพาะข้อมูลของช่วงสุดท้าย"
    - "ช่วงสุดท้ายเริ่มที่ $t = 8\\ \\mathrm{s}$ ด้วยความเร็ว $10\\ \\mathrm{m/s}$ และจบที่ $t = 12\\ \\mathrm{s}$ ด้วยความเร็ว $0$"
    - "$\\Delta t$ ของช่วงนี้คือ $12 - 8$ ไม่ใช่ 12"
  misconceptions:
    - { match: 2.5, feedback: "ขนาดถูก แต่ความเร็วลดลง $\\Delta v = 0 - 10$ ติดลบ ความเร่งจึงต้องเป็นลบ" }
    - { match: -0.833, feedback: "ดูเหมือนหารด้วย 12 s ซึ่งเป็นเวลาทั้งหมด แต่ช่วงสุดท้ายกินเวลาตั้งแต่ 8 s ถึง 12 s เท่านั้น" }
  solution: "ช่วงสุดท้าย: $\\Delta v = 0 - 10 = -10\\ \\mathrm{m/s}$ และ $\\Delta t = 12 - 8 = 4\\ \\mathrm{s}$ ดังนั้น $a = \\dfrac{-10\\ \\mathrm{m/s}}{4\\ \\mathrm{s}} = -2.5\\ \\mathrm{m/s^2}$ (เทียบช่วงแรก: $a = \\dfrac{10 - 2}{4} = 2\\ \\mathrm{m/s^2}$ และช่วงที่สอง $a = 0$)"
  license: CC-BY-SA-4.0
  ai_assisted: true

- id: phy.acc.p008
  topics: [physics.kinematics.acceleration]
  difficulty: 5
  type: mcq
  stem: "ให้ทิศขวาเป็นบวก ลูกบอลกำลังกลิ้งไปทางซ้ายด้วยความเร็ว $-4\\ \\mathrm{m/s}$ และมีความเร่งคงที่ $-1\\ \\mathrm{m/s^2}$ หลังจากนั้น $2\\ \\mathrm{s}$ ข้อใดถูกต้อง"
  choices:
    - { id: a, text: "ลูกบอลเร็วขึ้น ความเร็วเป็น $-6\\ \\mathrm{m/s}$", correct: true }
    - { id: b, text: "ลูกบอลช้าลง ความเร็วเป็น $-2\\ \\mathrm{m/s}$", feedback: "ความเร่งเป็นลบไม่ได้แปลว่าช้าลงเสมอ ที่นี่ความเร็วกับความเร่งเป็นลบทั้งคู่ คือมีทิศเดียวกัน ลูกบอลจึงเร็วขึ้น" }
    - { id: c, text: "ลูกบอลหยุดนิ่ง ความเร็วเป็น $0\\ \\mathrm{m/s}$", feedback: "ลูกบอลจะหยุดได้เมื่อความเร่งมีทิศตรงข้ามกับความเร็ว แต่ที่นี่ทั้งสองมีทิศไปทางซ้าย" }
    - { id: d, text: "ลูกบอลเปลี่ยนไปกลิ้งทางขวา ความเร็วเป็น $+2\\ \\mathrm{m/s}$", feedback: "ความเร่งชี้ไปทางซ้าย (ลบ) จึงไม่มีทางผลักให้ลูกบอลกลับไปทางขวาได้ ลองคำนวณ $v = u + at$ ใหม่โดยระวังเครื่องหมาย" }
  hints:
    - "จาก $a = \\dfrac{v - u}{t}$ จัดรูปได้ $v = u + at$"
    - "แทน $u = -4$, $a = -1$, $t = 2$ ระวังเครื่องหมาย"
    - "ความเร็วกับความเร่งมีเครื่องหมายเหมือนกันหรือตรงข้ามกัน"
  solution: "$v = u + at = -4\\ \\mathrm{m/s} + (-1\\ \\mathrm{m/s^2})(2\\ \\mathrm{s}) = -6\\ \\mathrm{m/s}$ ขนาดความเร็วเพิ่มจาก 4 เป็น 6 m/s ลูกบอลจึงเร็วขึ้นไปทางซ้าย เพราะความเร็วและความเร่งมีเครื่องหมายเหมือนกัน (ทิศเดียวกัน)"
  license: CC-BY-SA-4.0
  ai_assisted: true
