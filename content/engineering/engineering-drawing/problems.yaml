    ai_assisted: true

  - id: engineering.drawing.engineering-drawing.p014
    topics: [engineering.drawing.engineering-drawing]
    difficulty: 4
    type: numeric
    stem: "เขียนภาพไอโซเมตริกของกล่องยาว $60\\ \\mathrm{mm}$ ลึก $40\\ \\mathrm{mm}$ สูง $30\\ \\mathrm{mm}$ โดยวัดความยาวจริงตามแนวแกน ภาพที่ได้กว้างในแนวนอนกี่มิลลิเมตร (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 86.6, tolerance: 0.2, unit: mm }
    misconceptions:
      - { match: 100, feedback: "ขอบแนวราบเอียง $30^\\circ$ ความกว้างในแนวนอนของแต่ละขอบจึงเป็น ความยาว × $\\cos 30^\\circ$ ไม่ใช่ความยาวเต็ม" }
      - { match: 50, feedback: "ใช้ $\\sin 30^\\circ$ ซึ่งให้ระยะในแนวตั้ง ความกว้างแนวนอนใช้ $\\cos 30^\\circ$" }
    hints:
      - "ขอบยาวและขอบลึกเอียง $30^\\circ$ จากแนวนอนไปคนละข้าง"
      - "ความกว้าง $= 60\\cos 30^\\circ + 40\\cos 30^\\circ$"
    solution: "ความกว้าง $= (60 + 40)\\cos 30^\\circ = 100 \\times 0.866 = 86.6\\ \\mathrm{mm}$ ความสูงของกล่องไม่มีผลต่อความกว้าง"
    license: CC-BY-SA-4.0
    ai_assisted: true

