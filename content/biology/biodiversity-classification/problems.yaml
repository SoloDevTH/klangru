  - id: biology.diversity.biodiversity-classification.p014
    topics: [biology.diversity.biodiversity-classification]
    difficulty: 4
    type: mcq
    stem: "สมมติว่ามีถนนตัดผ่านป่าตะวันตกจนผืนป่าที่ต่อเนื่องกับเขตรักษาพันธุ์สัตว์ป่าห้วยขาแข้งขาดเป็นหย่อมเล็ก ๆ ข้อใดอธิบายความเชื่อมโยงของผลกระทบได้ถูกต้องที่สุด"
    choices:
      - { id: a, text: "ป่าหย่อมเล็กมีระบบนิเวศย่อยน้อยลง สัตว์ใหญ่บางชนิดหายไป ประชากรที่เหลือเล็กและผสมกันเองมากขึ้น ความหลากหลายทางพันธุกรรมจึงลดลงด้วย", correct: true }
      - { id: b, text: "ความหลากหลายของระบบนิเวศลดลง แต่ความหลากหลายของสปีชีส์และพันธุกรรมไม่เปลี่ยน", feedback: "สามระดับเชื่อมโยงกัน เมื่อแหล่งที่อยู่ลดลง จำนวนชนิดและขนาดประชากรก็ลดตาม" }
      - { id: c, text: "ความหลากหลายทางพันธุกรรมเพิ่มขึ้นเพราะประชากรถูกแยกเป็นหลายกลุ่ม", feedback: "ประชากรกลุ่มเล็กที่แยกกันเสียความแปรผันจากการผสมกันเองและการสุ่ม ความหลากหลายในแต่ละกลุ่มจึงลดลง" }
      - { id: d, text: "ไม่มีผลกระทบ เพราะพื้นที่ป่ารวมยังเท่าเดิม", feedback: "แม้พื้นที่รวมใกล้เดิม ป่าที่แยกเป็นหย่อมทำให้สัตว์ที่ต้องการพื้นที่กว้างอยู่ไม่ได้และเดินข้ามไม่ได้" }
    hints:
      - "ความหลากหลายทางชีวภาพมี 3 ระดับ ลองคิดผลต่อแต่ละระดับ"
      - "ประชากรเล็กที่แยกกันจะเกิดอะไรกับความแปรผันทางพันธุกรรม"
    solution: "ป่าหย่อมเล็กมีแหล่งที่อยู่หลากหลายน้อยลง (ระบบนิเวศ) สัตว์ที่ต้องการพื้นที่กว้างหายไป (สปีชีส์) ประชากรที่เหลือเล็กและแยกกัน ผสมกันเองมากขึ้น ความแปรผันทางพันธุกรรมลดลง (พันธุกรรม) ทั้งสามระดับจึงลดลงตามกัน"
