          - { id: "S1-CYB-TS-08", level: "Specialty I", text: "Evaluate a security threat using the CIA triad, states of data, and types of control.", note: "Practice CT6, CT7" }
          - { id: "S1-CYB-TS-09", level: "Specialty I", text: "Analyze how encryption methods in network communication protect privacy and security.", note: "Practice ESR1, CT6" }
          - { id: "S1-CYB-TS-10", level: "Specialty I", text: "Evaluate security measures as part of a layered defense strategy to protect sensitive information.", note: "Practice ESR1, CT6" }
          - { id: "S2-CYB-TS-06", level: "Specialty II", text: "Design access controls to protect sensitive information.", note: "Practice CT6, HCD10" }
          - { id: "S2-CYB-TS-07", level: "Specialty II", text: "Evaluate security risks to determine appropriate risk management strategies.", note: "Practice CT6, HCD12" }
          - { id: "S2-CYB-TS-08", level: "Specialty II", text: "Examine an incident response plan for a real-world scenario.", note: "Practice IC3, CT6" }
      - id: "CYB-CP"
