<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="sans-serif">
<title>เชื้อสำคัญของโรคติดต่อทางเพศสัมพันธ์</title>
<rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="380.0" y="28.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">เชื้อสำคัญ 8 ชนิดของโรคติดต่อทางเพศสัมพันธ์ (ตาม WHO)</text>
<rect x="20.0" y="50.0" width="350.0" height="220.0" rx="8" fill="#d5f5e3" stroke="#333" stroke-width="1.5"/>
<text x="195.0" y="80.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">รักษาหายด้วยยา</text>
<text x="195.0" y="120.0" font-size="14" text-anchor="middle" fill="#111">ซิฟิลิส</text>
<text x="195.0" y="156.0" font-size="14" text-anchor="middle" fill="#111">หนองใน</text>
<text x="195.0" y="192.0" font-size="14" text-anchor="middle" fill="#111">หนองในเทียม (คลามีเดีย)</text>
<text x="195.0" y="228.0" font-size="14" text-anchor="middle" fill="#111">พยาธิในช่องคลอด (ทริโคโมแนส)</text>
<rect x="390.0" y="50.0" width="350.0" height="220.0" rx="8" fill="#d6eaf8" stroke="#333" stroke-width="1.5"/>
<text x="565.0" y="80.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">ไวรัส: ควบคุมได้ ส่วนใหญ่ยังไม่หายขาด</text>
<text x="565.0" y="120.0" font-size="14" text-anchor="middle" fill="#111">ไวรัสตับอักเสบบี</text>
<rect x="640.0" y="105.0" width="84.0" height="22.0" rx="11" fill="#fcf3cf" stroke="#b7950b" stroke-width="1"/>
<text x="682.0" y="121.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#7d6608">มีวัคซีน</text>
<text x="565.0" y="156.0" font-size="14" text-anchor="middle" fill="#111">เริม</text>
<text x="565.0" y="192.0" font-size="14" text-anchor="middle" fill="#111">เอชไอวี</text>
<text x="565.0" y="228.0" font-size="14" text-anchor="middle" fill="#111">เอชพีวี</text>
<rect x="640.0" y="213.0" width="84.0" height="22.0" rx="11" fill="#fcf3cf" stroke="#b7950b" stroke-width="1"/>
<text x="682.0" y="229.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#7d6608">มีวัคซีน</text>
<text x="380.0" y="300.0" font-size="13.5" text-anchor="middle" fill="#333">ส่วนใหญ่ไม่มีอาการ ทางเดียวที่รู้แน่คือการตรวจ  •  ถุงยางอนามัยลดความเสี่ยงได้มาก</text>
</svg>
