<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="sans-serif">
<title>แผนผังข้อโต้แย้งที่มีข้อกล่าวอ้าง เหตุผล หลักฐาน ข้อโต้แย้งฝ่ายตรงข้าม และการตอบโต้</title>
<rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
<text x="380" y="34" font-size="20" fill="#111" text-anchor="middle" font-weight="bold">แผนผังข้อโต้แย้ง</text>
<rect x="230" y="56" width="300" height="66" rx="8" fill="#e8f0fb" stroke="#1d3f75" stroke-width="2"/>
<text x="380.0" y="80" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">ข้อกล่าวอ้าง (claim)</text>
<text x="380.0" y="102" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">Schools should start later.</text>
<rect x="30" y="160" width="300" height="84" rx="8" fill="#ffffff" stroke="#2e6b4f" stroke-width="2"/>
<text x="180.0" y="184" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">เหตุผล (reason)</text>
<text x="180.0" y="206" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">Students need more sleep</text>
<text x="180.0" y="226" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">to learn well.</text>
<rect x="430" y="160" width="300" height="84" rx="8" fill="#ffffff" stroke="#b3261e" stroke-width="2"/>
<text x="580.0" y="184" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">ฝ่ายตรงข้าม (counter-argument)</text>
<text x="580.0" y="206" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">Later starts may disrupt bus</text>
<text x="580.0" y="226" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">schedules and family routines.</text>
<rect x="30" y="300" width="300" height="84" rx="8" fill="#ffffff" stroke="#2e6b4f" stroke-width="2"/>
<text x="180.0" y="324" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">หลักฐาน (evidence)</text>
<text x="180.0" y="346" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">A survey found most students</text>
<text x="180.0" y="366" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">sleep under 7 hours on weeknights.</text>
<rect x="430" y="300" width="300" height="84" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<text x="580.0" y="324" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">การตอบโต้ (rebuttal)</text>
<text x="580.0" y="346" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">Bus companies can adjust</text>
<text x="580.0" y="366" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">their routes to fit a later start.</text>
<line x1="180" y1="160" x2="262" y2="122" stroke="#2e6b4f" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="262,122 255.02,130.51 251.00,121.82" fill="#2e6b4f"/>
<line x1="580" y1="160" x2="498" y2="122" stroke="#b3261e" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="498,122 509.00,121.82 504.98,130.51" fill="#b3261e"/>
<line x1="180" y1="300" x2="180" y2="246" stroke="#2e6b4f" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="180,246 184.78,255.90 175.22,255.90" fill="#2e6b4f"/>
<line x1="580" y1="300" x2="580" y2="246" stroke="#666666" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="580,246 584.78,255.90 575.22,255.90" fill="#666666"/>
<line x1="40" y1="412" x2="80" y2="412" stroke="#2e6b4f" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="80,412 70.10,416.78 70.10,407.22" fill="#2e6b4f"/>
<text x="88" y="417" font-size="13" fill="#333" text-anchor="start" font-weight="normal">สนับสนุน</text>
<line x1="190" y1="412" x2="230" y2="412" stroke="#b3261e" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="230,412 220.10,416.78 220.10,407.22" fill="#b3261e"/>
<text x="238" y="417" font-size="13" fill="#333" text-anchor="start" font-weight="normal">ค้าน</text>
<line x1="300" y1="412" x2="340" y2="412" stroke="#666666" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="340,412 330.10,416.78 330.10,407.22" fill="#666666"/>
<text x="348" y="417" font-size="13" fill="#333" text-anchor="start" font-weight="normal">ตอบโต้</text>
</svg>
