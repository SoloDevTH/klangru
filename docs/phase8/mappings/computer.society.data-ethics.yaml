topic: computer.society.data-ethics
rows:
  - { framework: csta-k12-cs-2026, indicators: ["MS-DAT-IM-28"], coverage: full, note: "ประโยชน์และความเสี่ยงของเมทาดาทาและข้อมูลส่วนบุคคล รวมถึงความเป็นเจ้าของและอธิปไตยข้อมูล (บทเรียนส่วนเมทาดาทาและอธิปไตยข้อมูล)" }
  - { framework: csta-k12-cs-2026, indicators: ["MS-DAT-IM-29"], coverage: full, note: "ความเอนเอียงที่แทรกได้ในทุกขั้นของงานข้อมูล มีภาพห้าขั้นและตัวอย่างคำนวณ (ภาพ bias-pipeline; ตัวอย่างแสดงวิธีทำ 2 ตัวอย่าง; โจทย์ p002 p003 p005)" }
  - { framework: csta-k12-cs-2026, indicators: ["HS-DAT-IM-27"], coverage: partial, note: "ครอบคลุมผลทางสังคม จริยธรรม และสิ่งแวดล้อมของการเก็บข้อมูลขนาดใหญ่ แต่ยังไม่ลงรายละเอียดการประเมินแอปปัญญาประดิษฐ์โดยเฉพาะ" }
  - { framework: csta-k12-cs-2026, indicators: ["HS-DAT-IM-28"], coverage: partial, note: "ประเมินประสิทธิผลของกฎหมายและนโยบายองค์กร (บทเรียนส่วนกฎหมายและธรรมาภิบาลข้อมูลในองค์กร; โจทย์ p009 p015) แต่ยังไม่มีกิจกรรมโต้วาทีเชิงนโยบาย" }
  - { framework: csta-k12-cs-2026, indicators: ["S1-DSC-PP-12"], coverage: full, note: "นำหลักความเป็นส่วนตัว ความโปร่งใส และความรับผิดชอบไปใช้กับการเก็บ วิเคราะห์ และสื่อสารข้อมูล (บทเรียนส่วนความโปร่งใสและความรับผิดชอบ; โจทย์ p011 p017)" }
  - { framework: csta-k12-cs-2026, indicators: ["S1-DSC-PP-13"], coverage: full, note: "อธิบายว่าการเก็บข้อมูลกระทบกลุ่มที่ถูกมองข้ามอย่างไร (บทเรียนส่วนกลุ่มที่ถูกมองข้าม; โจทย์ p012 p016)" }
  - { framework: csta-k12-cs-2026, indicators: ["S2-DSC-PP-13"], coverage: partial, note: "ประเด็นกฎหมาย PDPA (ฐานทางกฎหมาย ข้อมูลอ่อนไหวมาตรา 26 ข้อยกเว้นวิจัยมาตรา 24 (1) แจ้งเหตุรั่วไหล 72 ชั่วโมงมาตรา 37 (4) ตรวจกับตัวบทแล้ว) และกฎหมายกับแบบจำลองทำนายในระดับแนวคิด ยังไม่ได้วิเคราะห์ชุดข้อมูลขนาดใหญ่และโมเดลทำนายเชิงลึก" }
  - { framework: csta-k12-cs-2026, indicators: ["S2-DSC-PP-14"], coverage: partial, note: "มาตรการคุ้มครองด้านความเป็นส่วนตัวและความเป็นธรรมครบ แต่มาตรการด้านความปลอดภัยทางเทคนิคสอนเพียงระดับแนวคิด" }
  - { framework: acm-cs2023, indicators: ["DM-SEP"], coverage: partial, note: "จริยธรรมวิชาชีพในการจัดการข้อมูลครอบคลุมบางส่วน ยังไม่ครอบคลุมจรรยาบรรณวิชาชีพโดยละเอียด" }
  - { framework: acm-cs2023, indicators: ["SEP-Privacy"], coverage: partial, note: "ผลของการเก็บข้อมูลจำนวนมาก การไม่ระบุตัวตน และความเป็นส่วนตัวเชิงอนุพันธ์ (การระบุตัวซ้ำด้วย k-anonymity อยู่ในหัวข้อความเป็นส่วนตัว)" }
