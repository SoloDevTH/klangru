id: chemistry.mixtures.separating-mixtures
subject: chemistry
title: { th: การแยกสารผสม, en: Separating mixtures }
summary: เลือกวิธีแยกสารจากสมบัติที่ต่างกัน ตั้งแต่การหยิบออก ร่อน ใช้แม่เหล็ก รินออก กรอง ตกตะกอน ไปจนถึงการระเหยแห้ง ตกผลึก กลั่น โครมาโทกราฟี และการสกัด
difficulty: 2.5
minutes: 35
prerequisites: [chemistry.matter.states-changes, chemistry.matter.pure-substances]
encompasses:
  - { id: chemistry.matter.states-changes, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: distillation-setup.svg
    alt: "ชุดการกลั่นอย่างง่าย ทางซ้ายเป็นขวดก้นกลมใส่ของผสมและเศษกระเบื้องกันเดือดพลุ่ง ตั้งบนตะเกียงที่ให้ความร้อน คอขวดมีเทอร์มอมิเตอร์ ปลายกระเปาะอยู่ระดับทางออกของไอ ท่อทางออกต่อเฉียงลงไปผ่านเครื่องควบแน่นซึ่งมีปลอกหุ้ม น้ำเย็นเข้าทางท่อด้านล่างและออกทางท่อด้านบน ปลายท่อมีหยดของเหลวตกลงในบีกเกอร์ทางขวาที่รองรับของเหลวที่กลั่นได้"
    caption: "การกลั่นอย่างง่าย: ระเหยสารที่จุดเดือดต่ำกว่า แล้วทำให้ไอเย็นลงเป็นของเหลวในเครื่องควบแน่น"
  - { type: check, problem: chemistry.mixtures.separating-mixtures.p003, prompt: "ตะกอนเล็กมากจนกรองยาก ใช้อะไรช่วยให้จม" }
  - type: worked-example
    title: แยกผงเหล็ก ทราย และเกลือออกจากกัน
    problem: "ของผสม 40.0 g ประกอบด้วยผงตะไบเหล็ก ทราย และเกลือ ใช้แม่เหล็กดูดผงเหล็กออกได้ 6.0 g แล้วแยกทรายออกมาตากแห้งได้ 26.5 g จงบอกลำดับวิธีแยก และหาร้อยละโดยมวลของเกลือในของผสม"
    steps:
      - text: "ใช้แม่เหล็กก่อน เพราะผงเหล็กเป็นสารเดียวที่ถูกแม่เหล็กดูด และยังแห้งอยู่จึงดูดได้ง่าย"
        why: "ถ้าเติมน้ำก่อน ผงเหล็กเปียกจะติดทรายและเป็นสนิมได้"
      - text: "เติมน้ำแล้วคน เกลือละลาย ทรายไม่ละลาย จากนั้นกรอง ทรายค้างบนกระดาษกรอง"
      - text: "ระเหยน้ำเกลือที่กรองได้ จะได้เกลือ"
      - text: "มวลเกลือ $= 40.0 - 6.0 - 26.5 = 7.5$ g"
        why: "มวลรวมคงที่ มวลของเกลือจึงเท่ากับมวลทั้งหมดลบส่วนที่แยกได้แล้ว"
      - text: "ร้อยละของเกลือ $= \\dfrac{7.5}{40.0} \\times 100 = 18.75$"
    answer: "แม่เหล็ก → ละลายน้ำ → กรอง → ระเหย มีเกลือร้อยละ 18.75 โดยมวล"
  - type: worked-example
    title: ใช้ค่า Rf ตรวจสีผสมอาหาร
    problem: "หยดสีจากขนมชั้นและสีมาตรฐาน 2 ชนิดบนกระดาษแผ่นเดียวกัน ตัวทำละลายเคลื่อนที่ 7.5 cm สีจากขนมให้จุดเดียวที่สูง 4.5 cm สีมาตรฐาน X มี $R_f$ 0.60 และสีมาตรฐาน Y มี $R_f$ 0.35 สีในขนมน่าจะเป็นชนิดใด"
    steps:
      - text: "$R_f$ ของสีจากขนม $= \\dfrac{4.5}{7.5} = 0.60$"
        why: "หารระยะของสารด้วยระยะของตัวทำละลาย วัดจากเส้นเริ่มต้นทั้งคู่"
      - text: "สีจากขนมให้จุดเดียว แปลว่ามีสีชนิดเดียว"
      - text: "$R_f$ 0.60 ตรงกับสี X ในการทดลองเดียวกัน (กระดาษและตัวทำละลายเดียวกัน)"
    answer: "สีในขนมน่าจะเป็นสี X"
  - { type: check, problem: chemistry.mixtures.separating-mixtures.p008, prompt: "อ่านระยะจากเส้นเริ่มต้น ไม่ใช่จากขอบกระดาษ" }
glossary:
  - { term: สารผสม, definition: สารที่เกิดจากสารตั้งแต่ 2 ชนิดขึ้นไปรวมกัน โดยแต่ละชนิดยังคงสมบัติเดิม จึงแยกออกจากกันได้ }
  - { term: การกรอง, definition: การแยกของแข็งที่ไม่ละลายออกจากของเหลว โดยให้ของเหลวผ่านวัสดุที่มีรูเล็ก }
  - { term: การตกผลึก, definition: "การทำให้ตัวละลายแยกออกจากสารละลายอิ่มตัวเป็นผลึก โดยลดอุณหภูมิหรือระเหยตัวทำละลายช้า ๆ" }
  - { term: การกลั่น, definition: การทำให้ของเหลวเดือดเป็นไอ แล้วทำให้ไอเย็นลงเป็นของเหลวอีกครั้งในภาชนะอื่น ใช้แยกสารที่จุดเดือดต่างกัน }
  - { term: โครมาโทกราฟี, definition: วิธีแยกสารปริมาณน้อยโดยให้ตัวทำละลายพาสารเคลื่อนที่ผ่านตัวดูดซับ สารแต่ละชนิดเคลื่อนที่ได้ระยะต่างกัน }
  - { term: ค่า Rf, definition: ระยะทางที่สารเคลื่อนที่หารด้วยระยะทางที่ตัวทำละลายเคลื่อนที่ ไม่มีหน่วย อยู่ระหว่าง 0 ถึง 1 }
  - { term: การสกัดด้วยตัวทำละลาย, definition: การใช้ตัวทำละลายที่ละลายสารที่ต้องการได้ดีดึงสารนั้นออกจากของผสม }
flashcards:
  - { front: "ทรายปนเกลือ แยกอย่างไร", back: "ละลายน้ำ → กรองเอาทรายออก → ระเหยหรือตกผลึกน้ำเกลือได้เกลือคืน" }
  - { front: "ระเหยแห้งกับตกผลึกต่างกันอย่างไร", back: "ระเหยแห้งระเหยจนหมด สิ่งเจือปนค้างด้วย · ตกผลึกกรองผลึกออกก่อนแห้ง สิ่งเจือปนยังละลายอยู่ ได้สารบริสุทธิ์กว่า" }
  - { front: "สูตรค่า Rf", back: "$R_f = \\dfrac{\\text{ระยะที่สารเคลื่อนที่}}{\\text{ระยะที่ตัวทำละลายเคลื่อนที่}}$ วัดจากเส้นเริ่มต้น" }
  - { front: "ทำน้ำจืดจากน้ำทะเลด้วยวิธีใด", back: "การกลั่น (เช่น เครื่องกลั่นพลังแสงอาทิตย์) การกรองหรือการต้มเอาเกลือออกไม่ได้" }
  - { front: "แยกของเหลวที่จุดเดือดใกล้กัน เช่น น้ำมันดิบ", back: "การกลั่นลำดับส่วน ใช้คอลัมน์ให้ไอควบแน่นและระเหยซ้ำหลายครั้ง" }
