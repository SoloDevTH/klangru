<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="sans-serif">
<title>หลัก 5R เรียงจากลดการใช้ทรัพยากรมากที่สุดไปน้อยที่สุด</title>
<rect width="760" height="410" fill="#ffffff"/>
<text x="380.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">หลัก 5R: ยิ่งอยู่ด้านบน ยิ่งลดการใช้ทรัพยากรได้มาก</text>
<rect x="90" y="60" width="300" height="56" rx="10" fill="#dcfce7" stroke="#334155" stroke-width="2"/>
<text x="106" y="84" font-size="17" font-weight="bold" fill="#111827">1. ปฏิเสธ</text>
<text x="106" y="104" font-size="14" fill="#374151">ไม่รับสิ่งที่ไม่จำเป็น</text>
<rect x="150" y="122" width="300" height="56" rx="10" fill="#e0f2fe" stroke="#334155" stroke-width="2"/>
<text x="166" y="146" font-size="17" font-weight="bold" fill="#111827">2. ลด</text>
<text x="166" y="166" font-size="14" fill="#374151">ซื้อและใช้เท่าที่ต้องใช้</text>
<rect x="210" y="184" width="300" height="56" rx="10" fill="#fef9c3" stroke="#334155" stroke-width="2"/>
<text x="226" y="208" font-size="17" font-weight="bold" fill="#111827">3. ใช้ซ้ำ</text>
<text x="226" y="228" font-size="14" fill="#374151">ใช้ของเดิมอีกครั้งโดยไม่แปรรูป</text>
<rect x="270" y="246" width="300" height="56" rx="10" fill="#ffedd5" stroke="#334155" stroke-width="2"/>
<text x="286" y="270" font-size="17" font-weight="bold" fill="#111827">4. ซ่อม</text>
<text x="286" y="290" font-size="14" fill="#374151">ทำให้ของเสียกลับมาใช้ได้</text>
<rect x="330" y="308" width="300" height="56" rx="10" fill="#f3e8ff" stroke="#334155" stroke-width="2"/>
<text x="346" y="332" font-size="17" font-weight="bold" fill="#111827">5. รีไซเคิล</text>
<text x="346" y="352" font-size="14" fill="#374151">นำวัสดุไปแปรรูปเป็นของใหม่</text>
<text x="380.0" y="396" text-anchor="middle" font-size="14" fill="#374151">แนวคิดคือป้องกันการเกิดขยะก่อน แล้วค่อยนำกลับมาใช้ใหม่เมื่อจำเป็น</text>
</svg>
