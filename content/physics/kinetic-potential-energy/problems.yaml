    type: numeric
    stem: 'กล่องมวล $2\ \mathrm{kg}$ ไถลบนพื้นราบด้วยอัตราเร็ว $6\ \mathrm{m/s}$ แล้วถูกดันด้วยแรงคงตัว $26\ \mathrm{N}$ ในแนวราบไปข้างหน้าเป็นระยะ $4\ \mathrm{m}$ ตลอดระยะนี้มีแรงเสียดทาน $10\ \mathrm{N}$ ต้านอยู่ เมื่อสิ้นสุดระยะ $4\ \mathrm{m}$ กล่องมีอัตราเร็วเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s)'
    answer: { value: 10, tolerance: 0.1, unit: m/s }
    hints:
      - 'ใช้ทฤษฎีบทงาน–พลังงาน: งานรวมของทุกแรงเท่ากับ $\Delta E_k$'
      - 'งานรวม $= (26 - 10)(4)$ เพราะแรงเสียดทานทำงานเป็นลบ'
      - '$\tfrac{1}{2}mv^2 = \tfrac{1}{2}mu^2 + W_{\text{รวม}}$ อย่าลืมพลังงานจลน์ตอนต้น'
    misconceptions:
      - { match: 11.83, feedback: 'ดูเหมือนลืมงานของแรงเสียดทาน (ซึ่งเป็นลบ) งานรวมต้องใช้แรงลัพธ์ $26 - 10 = 16\ \mathrm{N}$' }
      - { match: 8, feedback: 'ดูเหมือนลืมพลังงานจลน์ตอนต้น $\tfrac{1}{2}(2)(6)^2 = 36\ \mathrm{J}$ กล่องไม่ได้เริ่มจากหยุดนิ่ง' }
    solution: '$W_{\text{รวม}} = (26 - 10)(4) = 64\ \mathrm{J}$ และ $E_{k,\text{ต้น}} = \tfrac{1}{2}(2)(6)^2 = 36\ \mathrm{J}$ จึงได้ $\tfrac{1}{2}(2)v^2 = 36 + 64 = 100$ → $v^2 = 100$ → $v = 10\ \mathrm{m/s}$'
    license: CC-BY-SA-4.0
    ai_assisted: true

