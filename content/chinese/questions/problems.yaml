    text: 哪 nǎ = ไหน (คำถาม) · 那 nà = นั้น (คำชี้)
    correct: true
    feedback: ถูก 哪 มี 口 ทางซ้ายและเป็นเสียง 3 ส่วน 那 เป็นเสียง 4
  - id: b
    text: ทั้งสองคำแปลว่า นั้น ต่างกันแค่ตัวเขียน
    feedback: 哪 เป็นคำถาม แปลว่า ไหน
  - id: c
    text: 哪 nà = นั้น · 那 nǎ = ไหน
    feedback: สลับกัน 哪 คือ nǎ (ไหน) และ 那 คือ nà (นั้น)
  - id: d
    text: ทั้งสองคำเป็นคำถาม ใช้แทนกันได้
    feedback: 那 ไม่ใช่คำถาม 那是我的书 = นั่นคือหนังสือของฉัน
