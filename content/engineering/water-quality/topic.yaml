id: engineering.environmental.water-quality
subject: engineering
title: { th: พารามิเตอร์คุณภาพน้ำและหน่วยในงานสิ่งแวดล้อม, en: Water-quality parameters and units in environmental engineering }
summary: แปลงหน่วยความเข้มข้นและภาระมลพิษ ผสมน้ำสองสาย อ่านค่า BOD กับ COD และคำนวณความกระด้างของน้ำ
difficulty: 6.5
minutes: 40
prerequisites: [chemistry.solutions.concentration, chemistry.acids-bases.acid-base-ph, chemistry.water.potable-water]
encompasses:
  - { id: chemistry.solutions.concentration, weight: 0.3 }
  - { id: chemistry.acids-bases.acid-base-ph, weight: 0.2 }
curriculum_tags: []
references:
