id: biology.humans.circulatory-system
subject: biology
title: { th: ระบบหมุนเวียนเลือด, en: "The circulatory system" }
summary: หัวใจ 4 ห้อง หลอดเลือดแดง หลอดเลือดดำ หลอดเลือดฝอย ส่วนประกอบของเลือด การหมุนเวียนเลือดผ่านปอดและทั่วร่างกาย การวัดชีพจรขณะพักและหลังออกกำลังกาย และการดูแลระบบหมุนเวียนเลือด
difficulty: 3
minutes: 40
prerequisites: [biology.humans.respiration-excretion]
encompasses:
  - { id: biology.humans.respiration-excretion, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: โครงสร้างของหัวใจคน
    src: heart.svg
    alt: "แผนภาพหัวใจมองจากด้านหน้า ด้านซ้ายของภาพคือด้านขวาของร่างกาย ซีกขวาของร่างกายเป็นสีฟ้า มีห้องบนขวาและห้องล่างขวา หลอดเลือดดำใหญ่สองเส้นนำเลือดจากร่างกายเข้าห้องบนขวาจากด้านบนและด้านข้าง หลอดเลือดแดงไปปอดออกจากห้องล่างขวาขึ้นไปด้านบน ซีกซ้ายของร่างกายเป็นสีชมพูแดง มีห้องบนซ้ายและห้องล่างซ้าย หลอดเลือดดำจากปอดเข้าห้องบนซ้ายทางด้านข้าง หลอดเลือดแดงใหญ่ (เอออร์ตา) ออกจากห้องล่างซ้ายโค้งขึ้นแล้วลง ห้องล่างซ้ายมีผนังหนาที่สุด ระหว่างห้องบนกับห้องล่างมีลิ้นหัวใจกันเลือดไหลย้อน"
    caption: "สีฟ้าแทนเลือดที่มีออกซิเจนน้อย สีแดงแทนเลือดที่มีออกซิเจนมาก เลือดจริงเป็นสีแดงเสมอ (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: figure
    title: แบบจำลองการหมุนเวียนเลือดสองวงจร
    src: double-circulation.svg
    alt: "แผนภาพแบบจำลอง ด้านบนเป็นกล่องปอด ด้านล่างเป็นกล่องเซลล์ทั่วร่างกาย ตรงกลางเป็นหัวใจ 4 ห้อง เส้นสีน้ำเงินจากห้องล่างขวาไปปอด เส้นสีแดงจากปอดกลับเข้าห้องบนซ้าย เส้นสีแดงจากห้องล่างซ้ายไปเซลล์ทั่วร่างกาย และเส้นสีน้ำเงินจากเซลล์ทั่วร่างกายกลับเข้าห้องบนขวา ลูกศรบอกทิศทางการไหล สีแดงคือเลือดที่มีออกซิเจนมาก สีน้ำเงินคือเลือดที่มีออกซิเจนน้อย"
    caption: "เลือดผ่านหัวใจ 2 ครั้งต่อการไหลครบหนึ่งรอบ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ติดตามเส้นทางของเลือดด้วยแบบจำลอง
    problem: "ออกซิเจนหนึ่งโมเลกุลเข้าสู่เลือดที่ปอด แล้วไปถึงกล้ามเนื้อขา บอกเส้นทางผ่านหัวใจและหลอดเลือด"
    steps:
      - text: "ที่ปอด ออกซิเจนเข้าสู่หลอดเลือดฝอยรอบถุงลม"
      - text: "เลือดไหลตามหลอดเลือดดำจากปอด เข้าห้องบนซ้าย แล้วลงห้องล่างซ้าย"
        why: "เลือดจากปอดกลับเข้าหัวใจซีกซ้ายเสมอ และห้องบนส่งลงห้องล่างข้างเดียวกัน"
      - text: "ห้องล่างซ้ายบีบเลือดออกทางหลอดเลือดแดงใหญ่ ไปตามหลอดเลือดแดงที่ขา"
      - text: "ถึงหลอดเลือดฝอยในกล้ามเนื้อขา ออกซิเจนแพร่ออกไปที่เซลล์กล้ามเนื้อ"
    answer: "ปอด → หลอดเลือดดำจากปอด → ห้องบนซ้าย → ห้องล่างซ้าย → หลอดเลือดแดงใหญ่ → หลอดเลือดแดงที่ขา → หลอดเลือดฝอยในกล้ามเนื้อ"
  - { type: check, problem: biology.humans.circulatory-system.p004, prompt: "ใช้แบบจำลองเดียวกันเรียงเส้นทางของเลือด" }
  - type: worked-example
    title: หาอัตราการเต้นของหัวใจจากการวัดซ้ำ
    problem: "นักเรียนนับชีพจรหลังวิ่งเหยาะ 3 ครั้ง ได้ 28 30 และ 29 ครั้งใน 15 วินาที อัตราการเต้นของหัวใจเฉลี่ยเป็นกี่ครั้งต่อนาที"
    steps:
      - text: "หาค่าเฉลี่ย $\\frac{28 + 30 + 29}{3} = 29$ ครั้งใน 15 วินาที"
        why: "การวัดซ้ำแล้วเฉลี่ยลดความคลาดเคลื่อนจากการนับครั้งเดียว"
      - text: "แปลงเป็นต่อนาที $29 \\times 4 = 116$ ครั้งต่อนาที"
    answer: "116 ครั้งต่อนาที"
  - { type: check, problem: biology.humans.circulatory-system.p008, prompt: "ทำแบบเดียวกันกับข้อมูลขณะนั่งพัก" }
glossary:
  - { term: ชีพจร, definition: "การกระเพื่อมของผนังหลอดเลือดแดงตามจังหวะการบีบตัวของหัวใจ คลำได้ที่ข้อมือและข้างลำคอ" }
  - { term: หลอดเลือดแดง, definition: "หลอดเลือดที่นำเลือดออกจากหัวใจ ผนังหนาและยืดหยุ่น" }
  - { term: หลอดเลือดดำ, definition: "หลอดเลือดที่นำเลือดกลับเข้าหัวใจ ผนังบางกว่าและมีลิ้นกันเลือดไหลย้อน" }
  - { term: หลอดเลือดฝอย, definition: "หลอดเลือดขนาดเล็กมาก ผนังหนาเซลล์เดียว เป็นที่แลกเปลี่ยนสารกับเซลล์" }
  - { term: ลิ้นหัวใจ, definition: "แผ่นเนื้อเยื่อในหัวใจที่เปิดให้เลือดไหลทางเดียวและปิดกันเลือดไหลย้อน" }
  - { term: เพลตเลต, definition: "ส่วนประกอบของเลือดที่ช่วยให้เลือดแข็งตัวเมื่อเกิดบาดแผล" }
flashcards:
  - { front: "หัวใจห้องใดผนังหนาที่สุด เพราะอะไร", back: "ห้องล่างซ้าย ต้องบีบส่งเลือดไปทั่วร่างกาย" }
  - { front: "เส้นทางวงจรผ่านปอด", back: "ห้องล่างขวา → หลอดเลือดแดงไปปอด → ปอด → หลอดเลือดดำจากปอด → ห้องบนซ้าย" }
  - { front: "นับชีพจร 15 วินาที แปลงเป็นต่อนาทีอย่างไร", back: "คูณ 4" }
  - { front: "หลอดเลือดแดงไปปอดนำเลือดแบบใด", back: "เลือดที่มีออกซิเจนน้อย" }
  - { front: "ดูแลหัวใจและหลอดเลือด", back: "ออกกำลังกายสม่ำเสมอ ลดเค็ม หวาน มัน ไม่สูบบุหรี่ นอนพอ" }
