      - { id: d, text: "ดาวเหนือ (δ = +89.26°)", feedback: "ดาวเหนืออยู่สูงราว 13–14.5° เหนือขอบฟ้าทิศเหนือตลอดคืน เห็นได้ถ้าท้องฟ้าใสและขอบฟ้าเปิด" }
    hints:
