problems:
  - id: health.safety.home-school-play.p001
    topics: [health.safety.home-school-play]
    difficulty: 1
    type: mcq
    stem: "ภูเห็นสายไฟของพัดลมในบ้านมีรอยแตก มองเห็นลวดข้างใน ภูควรทำอย่างไร"
    choices:
      - { id: a, text: "ไม่จับสายไฟ แล้วรีบบอกพ่อแม่หรือผู้ใหญ่", correct: true }
      - { id: b, text: "ใช้มือพันสายไฟให้แน่น", feedback: "การจับลวดที่โผล่ออกมาอาจถูกไฟฟ้าดูดได้ ต้องให้ผู้ใหญ่ถอดปลั๊กและซ่อม" }
      - { id: c, text: "เปิดพัดลมต่อไป เพราะยังใช้ได้", feedback: "สายไฟชำรุดทำให้ไฟฟ้าดูดหรือเกิดไฟไหม้ได้ ไม่ควรใช้ต่อ" }
      - { id: d, text: "เอาน้ำราดสายไฟให้เย็น", feedback: "น้ำนำไฟฟ้า ทำให้ไฟฟ้าดูดได้ง่ายขึ้น" }
    hints:
      - "ลวดในสายไฟมีกระแสไฟฟ้าไหลอยู่"
      - "งานซ่อมไฟฟ้าเป็นหน้าที่ของผู้ใหญ่"
    solution: "ไม่แตะสายไฟที่ชำรุด และบอกผู้ใหญ่ให้ถอดปลั๊กและเปลี่ยนสายไฟ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.home-school-play.p002
    topics: [health.safety.home-school-play]
    difficulty: 1
    type: mcq
    stem: "เห็นไฟไหม้บ้านหลังข้าง ๆ ผู้ใหญ่ควรโทรแจ้งเบอร์ใด"
    choices:
      - { id: a, text: "199", correct: true }
      - { id: b, text: "1669", feedback: "1669 ใช้เรียกรถพยาบาลเมื่อมีคนเจ็บป่วยฉุกเฉิน ไฟไหม้โทร 199" }
      - { id: c, text: "191", feedback: "191 ใช้แจ้งเหตุร้ายกับตำรวจ ไฟไหม้โทร 199" }
    hints:
      - "เบอร์นี้เป็นเลขสามหลัก"
      - "ไม่ใช่เบอร์เรียกรถพยาบาล"
    solution: "ไฟไหม้โทร 199 ถ้ามีคนบาดเจ็บโทร 1669 ด้วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.home-school-play.p003
    topics: [health.safety.home-school-play]
    difficulty: 1
    type: mcq
    stem: "จะส่งกรรไกรให้เพื่อนในห้องเรียน ควรทำอย่างไร"
    choices:
      - { id: a, text: "หุบกรรไกร ถือส่วนใบมีด แล้วยื่นด้ามจับให้เพื่อน", correct: true }
      - { id: b, text: "โยนกรรไกรไปให้เพื่อน", feedback: "กรรไกรอาจโดนเพื่อนหรือคนอื่นจนบาดเจ็บ" }
      - { id: c, text: "ยื่นปลายแหลมไปทางเพื่อน", feedback: "ปลายแหลมอาจทิ่มมือหรือตัวเพื่อน ต้องยื่นด้ามจับให้" }
      - { id: d, text: "กางกรรไกรแล้ววิ่งเอาไปให้", feedback: "การวิ่งถือของมีคมอาจหกล้มแล้วถูกบาดได้" }
    hints:
      - "ส่วนที่แหลมคมควรหันไปทางไหน"
      - "ผู้รับควรได้จับส่วนที่ปลอดภัย"
    solution: "หุบกรรไกร ถือส่วนใบ แล้วยื่นด้ามจับให้เพื่อน เดินช้า ๆ ไม่โยนหรือวิ่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.home-school-play.p004
    topics: [health.safety.home-school-play]
    difficulty: 2
    type: match
    stem: "ดูแผนผังบ้าน แล้วจับคู่ตัวอักษรกับชนิดของอันตราย"
    figure:
      src: home-hazards-quiz.svg
      alt: "แผนผังบ้านสี่ห้อง ห้องครัวมีจุด A ที่มีดวางยื่นขอบเคาน์เตอร์ และจุด B ที่หม้อบนเตามีด้ามยื่นออกมา ห้องนั่งเล่นมีจุด C ที่ปลั๊กพ่วงเสียบหลายช่องและสายไฟหักงอเป็นรอย ห้องน้ำมีจุด D ที่พื้นมีแอ่งน้ำ จุด E ที่ขวดน้ำยาวางบนพื้น และจุด G ที่ถังน้ำเปิดฝา ห้องบันไดมีจุด F ที่ลูกบอลวางอยู่บนขั้นบันได"
    pairs:
      - { left: "A", right: "ของมีคม" }
      - { left: "B", right: "ความร้อน น้ำร้อนลวก" }
      - { left: "C", right: "ไฟฟ้าดูด" }
      - { left: "D", right: "ลื่นล้ม" }
      - { left: "E", right: "สารพิษ" }
      - { left: "F", right: "สะดุดตกจากที่สูง" }
      - { left: "G", right: "จมน้ำ" }
    hints:
      - "ดูว่าแต่ละจุดมีสิ่งของอะไร แล้วนึกว่าสิ่งนั้นทำอันตรายแบบใด"
      - "ของเล่นบนบันไดทำให้สะดุด ส่วนน้ำบนพื้นทำให้ลื่น"
    solution: "A มีด → ของมีคม, B หม้อบนเตา → ความร้อน, C ปลั๊กพ่วงและสายชำรุด → ไฟฟ้าดูด, D พื้นเปียก → ลื่นล้ม, E น้ำยา → สารพิษ, F ลูกบอลบนบันได → ตกจากที่สูง, G ถังน้ำเปิดฝา → จมน้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.home-school-play.p005
    topics: [health.safety.home-school-play]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นสาเหตุของอันตรายจากการเล่น (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ผลักเพื่อนขณะเล่นไล่จับ", correct: true }
      - { id: b, text: "เล่นชิงช้าที่โซ่ใกล้ขาด", correct: true }
      - { id: c, text: "เล่นฟุตบอลบนลานที่ติดถนน", correct: true }
      - { id: d, text: "อบอุ่นร่างกายก่อนเล่นกีฬา", feedback: "การอบอุ่นร่างกายช่วยป้องกันการบาดเจ็บ ไม่ใช่สาเหตุของอันตราย" }
      - { id: e, text: "เล่นตามกติกาและรอคิว", feedback: "การทำตามกติกาและรอคิวช่วยให้เล่นปลอดภัย" }
    hints:
      - "อันตรายเกิดจากคนเล่น อุปกรณ์ และสถานที่"
      - "ข้อที่ถูกมีสามข้อ"
    solution: "การผลักเพื่อน (คนเล่น) ชิงช้าชำรุด (อุปกรณ์) และลานติดถนน (สถานที่) เป็นสาเหตุของอันตราย ส่วนการอบอุ่นร่างกายและเล่นตามกติกาเป็นการป้องกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.home-school-play.p006
    topics: [health.safety.home-school-play]
    difficulty: 2
    type: order
    stem: "ระหว่างพักกลางวัน เพื่อนตกจากเครื่องเล่นในสนาม เรียงสิ่งที่ควรทำ"
    items:
      - "ดูว่าบริเวณนั้นปลอดภัย ไม่มีอะไรจะหล่นใส่หรือชนเรา"
      - "บอกเพื่อนว่าอย่าเพิ่งลุก และให้เพื่อนอีกคนอยู่เป็นเพื่อน"
      - "วิ่งไปหาครูหรือผู้ใหญ่ที่ใกล้ที่สุด"
      - "บอกครูให้ชัดว่าเกิดอะไร ที่ไหน และเพื่อนเจ็บตรงไหน"
    hints:
      - "ความปลอดภัยของเราเองมาก่อน"
      - "การบอกรายละเอียดทำได้เมื่อเจอผู้ใหญ่แล้ว"
    solution: "ดูความปลอดภัย → ให้เพื่อนอยู่นิ่งและมีคนอยู่ด้วย → ไปหาผู้ใหญ่ → บอกว่าเกิดอะไร ที่ไหน เจ็บตรงไหน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.home-school-play.p007
    topics: [health.safety.home-school-play]
    difficulty: 2
    type: numeric
    stem: "จากแผนผังบ้าน ห้องน้ำมีจุดอันตรายกี่จุด (ตอบเป็นตัวเลขในหน่วยจุด)"
    figure:
      src: home-hazards-quiz.svg
      alt: "แผนผังบ้านสี่ห้อง ห้องครัวมีจุด A ที่มีดวางยื่นขอบเคาน์เตอร์ และจุด B ที่หม้อบนเตามีด้ามยื่นออกมา ห้องนั่งเล่นมีจุด C ที่ปลั๊กพ่วงเสียบหลายช่องและสายไฟหักงอเป็นรอย ห้องน้ำมีจุด D ที่พื้นมีแอ่งน้ำ จุด E ที่ขวดน้ำยาวางบนพื้น และจุด G ที่ถังน้ำเปิดฝา ห้องบันไดมีจุด F ที่ลูกบอลวางอยู่บนขั้นบันได"
    answer: { value: 3, unit: จุด }
    misconceptions:
      - { match: 2, feedback: "อย่าลืมถังน้ำเปิดฝาที่มุมห้องน้ำ ซึ่งอันตรายต่อเด็กเล็ก" }
      - { match: 7, feedback: "7 คือจุดอันตรายทั้งบ้าน คำถามถามเฉพาะห้องน้ำ" }
    hints:
      - "หาห้องที่เขียนว่าห้องน้ำก่อน"
      - "นับวงกลมตัวอักษรในห้องนั้น"
    solution: "ห้องน้ำมี D พื้นเปียก E ขวดน้ำยา และ G ถังน้ำเปิดฝา รวม 3 จุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.home-school-play.p008
    topics: [health.safety.home-school-play]
    difficulty: 3
    type: mcq
    stem: "ที่โรงเรียน เพื่อนวิ่งชนเสาจนหัวแตก มีเลือดออก เราควรขอความช่วยเหลือจากใครก่อน"
    choices:
      - { id: a, text: "ครูหรือผู้ใหญ่ในโรงเรียนที่อยู่ใกล้ที่สุด", correct: true }
      - { id: b, text: "เพื่อนอีกห้องที่อยู่ไกล ๆ", feedback: "เพื่อนวัยเดียวกันอาจช่วยไม่ได้ ควรไปหาผู้ใหญ่ที่ใกล้ที่สุด" }
      - { id: c, text: "รอให้เลิกเรียนแล้วค่อยบอกพ่อแม่", feedback: "เลือดออกจากศีรษะต้องได้รับการดูแลทันที ไม่ควรรอ" }
      - { id: d, text: "ไม่บอกใคร เพราะกลัวเพื่อนถูกดุ", feedback: "การบอกผู้ใหญ่ทำเพื่อช่วยเพื่อน ไม่ใช่เพื่อฟ้อง" }
    hints:
      - "ใครมีความรู้และอยู่ใกล้ที่สุด"
      - "เหตุนี้ต้องการความช่วยเหลือเร็ว"
    solution: "ไปบอกครูหรือผู้ใหญ่ที่ใกล้ที่สุดทันที เพื่อให้ปฐมพยาบาลและพาไปห้องพยาบาลหรือโทร 1669 ถ้าจำเป็น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.home-school-play.p009
    topics: [health.safety.home-school-play]
    difficulty: 3
    type: text
    stem: "ถ้ามีคนเจ็บป่วยฉุกเฉิน เช่น หมดสติ ไม่ตอบสนอง ควรโทรเบอร์ใดเพื่อเรียกรถพยาบาล (ตอบเป็นตัวเลข)"
    accepted: ["1669"]
    misconceptions:
      - { match: "199", feedback: "199 แจ้งไฟไหม้ เจ็บป่วยฉุกเฉินโทร 1669" }
      - { match: "191", feedback: "191 แจ้งเหตุร้ายกับตำรวจ เจ็บป่วยฉุกเฉินโทร 1669" }
    hints:
      - "เป็นเลขสี่หลัก"
      - "เบอร์ของสถาบันการแพทย์ฉุกเฉินแห่งชาติ"
    solution: "1669 คือเบอร์การแพทย์ฉุกเฉิน โทรฟรีทั่วประเทศ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.home-school-play.p010
    topics: [health.safety.home-school-play]
    difficulty: 3
    type: mcq
    stem: "ช่วงหน้าหนาว เด็ก ๆ เล่นว่าวในทุ่งนา ว่าวของต้อมไปติดสายไฟฟ้าริมถนน ต้อมควรทำอย่างไร"
    choices:
      - { id: a, text: "ปล่อยสายป่านทิ้ง ไม่ดึง ไม่ปีนเสา แล้วบอกผู้ใหญ่ให้แจ้งการไฟฟ้า", correct: true }
      - { id: b, text: "ดึงสายป่านแรง ๆ จนว่าวหลุด", feedback: "สายป่านที่เปียกหรือมีลวดอาจนำไฟฟ้าลงมาที่ตัวเราได้" }
      - { id: c, text: "ปีนเสาไฟขึ้นไปเก็บว่าว", feedback: "ปีนเสาไฟเสี่ยงทั้งตกจากที่สูงและถูกไฟฟ้าดูด อันตรายถึงชีวิต" }
      - { id: d, text: "ใช้ไม้ไผ่ยาวเขี่ยว่าวลงมา", feedback: "ไม้ไผ่ที่ชื้นนำไฟฟ้าได้ และอาจทำให้สายไฟขาด" }
    hints:
      - "สายไฟฟ้าริมถนนมีไฟฟ้าแรงสูง"
      - "งานเกี่ยวกับสายไฟเป็นหน้าที่ของเจ้าหน้าที่"
    solution: "ไม่แตะต้องสายป่านหรือสายไฟ ไม่ปีนเสา ให้ผู้ใหญ่แจ้งการไฟฟ้า และครั้งต่อไปเล่นว่าวในที่โล่งไกลจากสายไฟ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.home-school-play.p011
    topics: [health.safety.home-school-play]
    difficulty: 3
    type: mcq
    stem: "บ้านยายที่ราชบุรีมีโอ่งมังกรเก็บน้ำฝนวางไว้ข้างบ้าน ไม่มีฝาปิด และหลานอายุ 2 ขวบชอบเดินไปเล่นแถวนั้น ข้อใดป้องกันอันตรายได้ดีที่สุด"
    choices:
      - { id: a, text: "ปิดฝาโอ่งทุกครั้ง และมีผู้ใหญ่คอยดูหลานตลอดเวลาที่อยู่ข้างบ้าน", correct: true }
      - { id: b, text: "ไม่ต้องทำอะไร เพราะโอ่งสูงกว่าตัวหลาน", feedback: "เด็กเล็กปีนหรือใช้เก้าอี้ปีนขึ้นไปได้ และตกลงไปในโอ่งได้" }
      - { id: c, text: "ใส่น้ำในโอ่งให้น้อยลงก็พอ", feedback: "เด็กเล็กจมน้ำได้แม้น้ำไม่ลึก ต้องปิดฝาและดูแลใกล้ชิด" }
      - { id: d, text: "สอนหลานว่ายน้ำในโอ่ง", feedback: "โอ่งไม่ใช่ที่สำหรับเล่นน้ำ และเด็ก 2 ขวบต้องมีผู้ใหญ่ดูแลตลอด" }
    hints:
      - "เด็กเล็กศีรษะหนัก ถ้าก้มลงในภาชนะใส่น้ำจะพลิกตัวกลับได้ยาก"
      - "ป้องกันทั้งที่ตัวโอ่งและที่การดูแลเด็ก"
    solution: "ปิดฝาโอ่งและภาชนะเก็บน้ำทุกใบ และให้ผู้ใหญ่ดูแลเด็กเล็กใกล้ชิด เพราะเด็กเล็กจมน้ำได้แม้ในน้ำตื้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.home-school-play.p012
    topics: [health.safety.home-school-play]
    difficulty: 3
    type: numeric
    stem: "ภารโรงตรวจเครื่องเล่นสนามของโรงเรียน 12 ชิ้น พบว่าชำรุด 3 ชิ้น จึงปิดไม่ให้เล่น เครื่องเล่นที่ชำรุดคิดเป็นร้อยละเท่าใดของเครื่องเล่นทั้งหมด (ตอบเป็นตัวเลขในหน่วยร้อยละ)"
    answer: { value: 25, unit: "%" }
    misconceptions:
