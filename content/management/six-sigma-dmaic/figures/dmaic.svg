<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="sans-serif" font-size="13">
<title>วงจร DMAIC ห้าขั้น นิยาม วัด วิเคราะห์ ปรับปรุง ควบคุม พร้อมเครื่องมือหลักของแต่ละขั้น</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="900" height="500" fill="#ffffff"/>
<text x="450.0" y="28.0" text-anchor="middle" font-size="18" fill="#222" font-weight="bold">วงจร DMAIC และเครื่องมือหลัก</text>
<rect x="335.0" y="54.0" width="230.0" height="92.0" rx="10" fill="#f7f7f7" stroke="#1f5fa8" stroke-width="2.2"/>
<text x="450.0" y="80.0" text-anchor="middle" font-size="16" fill="#1f5fa8" font-weight="bold">D นิยาม</text>
<text x="450.0" y="98.0" text-anchor="middle" font-size="12" fill="#555">Define</text>
<text x="450.0" y="118.0" text-anchor="middle" font-size="13" fill="#222">กฎบัตรโครงการ SIPOC</text>
<text x="450.0" y="136.0" text-anchor="middle" font-size="13" fill="#222">เสียงลูกค้า → CTQ</text>
<rect x="553.3" y="171.5" width="230.0" height="92.0" rx="10" fill="#f7f7f7" stroke="#2e7d32" stroke-width="2.2"/>
<text x="668.3" y="197.5" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">M วัด</text>
<text x="668.3" y="215.5" text-anchor="middle" font-size="12" fill="#555">Measure</text>
<text x="668.3" y="235.5" text-anchor="middle" font-size="13" fill="#222">วิเคราะห์ระบบการวัด</text>
<text x="668.3" y="253.5" text-anchor="middle" font-size="13" fill="#222">DPMO RTY ระดับซิกมา</text>
<rect x="469.9" y="361.5" width="230.0" height="92.0" rx="10" fill="#f7f7f7" stroke="#b26a00" stroke-width="2.2"/>
<text x="584.9" y="387.5" text-anchor="middle" font-size="16" fill="#b26a00" font-weight="bold">A วิเคราะห์</text>
<text x="584.9" y="405.5" text-anchor="middle" font-size="12" fill="#555">Analyze</text>
<text x="584.9" y="425.5" text-anchor="middle" font-size="13" fill="#222">ก้างปลา 5 ทำไม</text>
<text x="584.9" y="443.5" text-anchor="middle" font-size="13" fill="#222">ทดสอบสมมติฐาน ถดถอย</text>
<rect x="200.1" y="361.5" width="230.0" height="92.0" rx="10" fill="#f7f7f7" stroke="#7b1fa2" stroke-width="2.2"/>
<text x="315.1" y="387.5" text-anchor="middle" font-size="16" fill="#7b1fa2" font-weight="bold">I ปรับปรุง</text>
<text x="315.1" y="405.5" text-anchor="middle" font-size="12" fill="#555">Improve</text>
<text x="315.1" y="425.5" text-anchor="middle" font-size="13" fill="#222">ออกแบบการทดลอง</text>
<text x="315.1" y="443.5" text-anchor="middle" font-size="13" fill="#222">ทดลองนำร่อง FMEA</text>
<rect x="116.7" y="171.5" width="230.0" height="92.0" rx="10" fill="#f7f7f7" stroke="#c62828" stroke-width="2.2"/>
<text x="231.7" y="197.5" text-anchor="middle" font-size="16" fill="#c62828" font-weight="bold">C ควบคุม</text>
<text x="231.7" y="215.5" text-anchor="middle" font-size="12" fill="#555">Control</text>
<text x="231.7" y="235.5" text-anchor="middle" font-size="13" fill="#222">แผนควบคุม SPC</text>
<text x="231.7" y="253.5" text-anchor="middle" font-size="13" fill="#222">ป้องกันความผิดพลาด ส่งมอบ</text>
