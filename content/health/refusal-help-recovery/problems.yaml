  - เขากังวลเรื่องความเครียด แหล่งใดช่วยได้
  solution: ช่วงลังเลควรชวนให้เขาพูดเหตุผลที่อยากเลิกเอง รับฟังความกังวล และแนะนำแหล่งช่วยอย่างสายเลิกบุหรี่ 1600 ที่ช่วยวางแผนรับมืออาการอยากและความเครียด
