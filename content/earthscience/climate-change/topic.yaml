id: earthscience.atmosphere.climate-change
subject: earthscience
title: { th: การเปลี่ยนแปลงภูมิอากาศโลก, en: "Global climate change" }
summary: ปัจจัยธรรมชาติและจากมนุษย์ที่ทำให้ภูมิอากาศเปลี่ยน หลักฐานและความไม่แน่นอน ความไวของภูมิอากาศและการป้อนกลับ งบคาร์บอน ผลกระทบต่อโลกและไทย และการลดผลกระทบกับการปรับตัว
difficulty: 4.5
minutes: 40
prerequisites: [earthscience.atmosphere.energy-balance, earthscience.ocean.ocean-circulation, earthscience.atmosphere.greenhouse-climate-intro]
encompasses:
  - { id: earthscience.atmosphere.energy-balance, weight: 0.3 }
  - { id: earthscience.ocean.ocean-circulation, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: อุณหภูมิผิวโลกตั้งแต่ ค.ศ. 1850
    src: temperature.svg
    alt: "กราฟเส้นแกนนอน ค.ศ. 1850 ถึง 2025 แกนตั้งผลต่างอุณหภูมิผิวโลกเทียบกับช่วง 1850–1900 จาก −0.4 ถึง +1.2 °C แถบสีเทาที่ระดับ 0 แสดงช่วงอ้างอิง 1850–1900 เส้นสีแดงอยู่ราว 0 จนถึง 1900 ลดลงเล็กน้อยราว 1910 ขึ้นเป็นราว 0.25 °C ช่วง 1940 ค่อนข้างคงที่ถึง 1970 จากนั้นเพิ่มขึ้นต่อเนื่องเร็วขึ้นจนราว 1.3 °C ใน ค.ศ. 2024 แถบสีแดงเข้มกำกับว่า 2011–2020 ราว 1.1 °C หมายเหตุว่าเส้นเป็นค่าตัวอย่างที่ปรับให้เรียบ รูปร่างตามข้อมูลจริง ค่าช่วง 2011–2020 ตามรายงาน IPCC AR6"
    caption: "โลกร้อนขึ้นเร็วตั้งแต่ราว ค.ศ. 1970 (วาดโดยทีมคลังรู้ เส้นเป็นค่าตัวอย่างที่ปรับให้เรียบ ไม่ใช่ข้อมูลรายปีจริง)"
  - type: worked-example
    title: แรงบังคับและความไวของภูมิอากาศ
    problem: "ถ้าคาร์บอนไดออกไซด์เพิ่มจาก 280 ppm เป็น 560 ppm แรงบังคับการแผ่รังสีเป็นเท่าใด ถ้าไม่มีการป้อนกลับโลกร้อนขึ้น $0.3\\ \\mathrm{^\\circ C}$ ต่อ $1\\ \\mathrm{W/m^2}$ และการป้อนกลับสุทธิ $f = 0.6$ โลกจะร้อนขึ้นเท่าใดเมื่อถึงสมดุล"
    steps:
      - text: "$\\Delta F = 5.35 \\ln\\dfrac{560}{280} = 5.35 \\ln 2 \\approx 3.7\\ \\mathrm{W/m^2}$"
      - text: "ไม่มีการป้อนกลับ $\\Delta T_0 = 0.3 \\times 3.7 \\approx 1.1\\ \\mathrm{^\\circ C}$"
      - text: "มีการป้อนกลับ $\\Delta T = \\dfrac{\\Delta T_0}{1 - f} = \\dfrac{1.1}{0.4} \\approx 2.8\\ \\mathrm{^\\circ C}$"
        why: "การป้อนกลับแบบเสริม เช่น ไอน้ำและน้ำแข็งละลาย ทำให้ความร้อนที่เกิดขึ้นทำให้เกิดความร้อนเพิ่มอีก รวมกันเป็นอนุกรม $\\Delta T_0(1 + f + f^2 + \\dots) = \\Delta T_0/(1-f)$"
      - text: "ค่านี้อยู่ในช่วงที่ IPCC ประเมิน 2.5–4 °C"
    answer: "$\\Delta F \\approx 3.7\\ \\mathrm{W/m^2}$ และร้อนขึ้นราว 2.8 °C"
  - { type: check, problem: earthscience.atmosphere.climate-change.p006, prompt: "ดวงอาทิตย์อธิบายแนวโน้มได้หรือไม่" }
  - type: interactive
    title: คาร์บอนไดออกไซด์กับอุณหภูมิที่เพิ่มขึ้นเมื่อสมดุล
    caption: "เส้นคือ $\\Delta T = \\dfrac{S}{3.7} \\times 5.35\\ln\\dfrac{x}{280}$ เมื่อ $x$ คือคาร์บอนไดออกไซด์ (ppm) และ $S$ คือความไวของภูมิอากาศสมดุล ลองเลื่อน $S$ ในช่วง 2.5–4 °C แล้วอ่านค่าที่ 420 ppm และ 560 ppm สังเกตว่าเส้นโค้งลง เพราะแรงบังคับเพิ่มตามลอการิทึม (ไม่รวมแก๊สอื่นและละอองลอย)"
    widget:
      kind: function-plot
      functions: ["\\frac{S}{3.7}\\cdot 5.35\\cdot\\ln\\left(\\frac{x}{280}\\right)"]
      sliders:
        - { name: S, min: 1.5, max: 5, step: 0.5, value: 3, label: ความไวของภูมิอากาศ (°C ต่อ CO₂ สองเท่า) }
      x: [280, 1200]
      y: [0, 8]
  - type: figure
    title: งบคาร์บอน
    src: carbon-budget.svg
    alt: "แผนภูมิแท่งแนวนอนสองแท่ง หน่วยพันล้านตันคาร์บอนไดออกไซด์ แท่งบน เป้าหมาย 1.5 °C โอกาสสำเร็จ 50% ส่วนสีเทาปล่อยไปแล้ว ค.ศ. 1850–2019 ราว 2,390 ต่อด้วยส่วนสีส้มเหลือ 500 แท่งล่าง เป้าหมาย 2 °C โอกาสสำเร็จ 67% ส่วนสีเทาปล่อยไปแล้วราว 2,390 ต่อด้วยส่วนสีน้ำเงินเหลือ 1,150 หมายเหตุว่างบที่เหลือนับตั้งแต่ต้น ค.ศ. 2020 ตามรายงาน IPCC AR6 และทั้งโลกปล่อยราว 40 Gt ต่อปี"
    caption: "งบที่เหลือเล็กกว่าที่ปล่อยไปแล้วมาก (วาดโดยทีมคลังรู้ จากค่าในรายงาน IPCC AR6 คณะทำงานที่ 1)"
  - type: worked-example
    title: งบคาร์บอนจะหมดเมื่อใด
    problem: "งบคาร์บอนสำหรับ 1.5 °C (โอกาส 50%) เหลือ 500 Gt CO₂ นับจากต้น ค.ศ. 2020 ถ้าโลกปล่อยคงที่ 40 Gt ต่อปีจะหมดเมื่อใด ถ้าลดการปล่อยลงเป็นเส้นตรงจาก 40 Gt จนเป็นศูนย์ ต้องถึงศูนย์ภายในกี่ปี"
    steps:
      - text: "ปล่อยคงที่ $500 \\div 40 = 12.5$ ปี คือราวกลาง ค.ศ. 2032"
      - text: "ลดเป็นเส้นตรงจาก 40 ถึง 0 ใน $n$ ปี ปริมาณรวมคือพื้นที่สามเหลี่ยม $\\tfrac12 \\times 40 \\times n$"
        why: "อัตราการปล่อยต่อปีคูณเวลาคือปริมาณรวม เมื่ออัตราลดลงเป็นเส้นตรง กราฟอัตรากับเวลาจึงเป็นสามเหลี่ยม"
      - text: "ให้ $20n = 500$ ได้ $n = 25$ ปี คือถึงศูนย์ราว ค.ศ. 2045"
    answer: "ปล่อยคงที่หมดราว ค.ศ. 2032 ถ้าลดเป็นเส้นตรงต้องถึงศูนย์ภายใน 25 ปี (ราว ค.ศ. 2045)"
  - { type: check, problem: earthscience.atmosphere.climate-change.p010 }
glossary:
  - { term: แรงบังคับการแผ่รังสี, definition: "การเปลี่ยนแปลงของสมดุลพลังงานเข้าออกของโลก หน่วยวัตต์ต่อตารางเมตร ค่าบวกทำให้ร้อนขึ้น" }
  - { term: การป้อนกลับ, definition: "การเปลี่ยนแปลงที่เกิดตามการร้อนขึ้นแล้วย้อนมาเสริมหรือลดการร้อนขึ้นนั้น" }
  - { term: ความไวของภูมิอากาศสมดุล, definition: "อุณหภูมิเฉลี่ยที่เพิ่มขึ้นเมื่อคาร์บอนไดออกไซด์เพิ่มเป็นสองเท่าแล้วรอจนสมดุล ค่าดีที่สุดราว 3 °C" }
  - { term: งบคาร์บอน, definition: "ปริมาณคาร์บอนไดออกไซด์สะสมที่ยังปล่อยได้ก่อนอุณหภูมิถึงเป้าหมาย ด้วยโอกาสที่กำหนด" }
  - { term: วัฏจักรมิลานโควิช, definition: "การเปลี่ยนแปลงของวงโคจรและแกนเอียงของโลกในช่วงหลายหมื่นปี ที่ทำให้เกิดยุคน้ำแข็ง" }
  - { term: ละอองลอย, definition: "อนุภาคเล็กมากในอากาศ เช่น ซัลเฟต ส่วนใหญ่สะท้อนแสงอาทิตย์ทำให้เย็นลง" }
  - { term: การลดผลกระทบ, definition: "การลดการปล่อยแก๊สเรือนกระจกหรือเพิ่มการดูดกลับ เพื่อชะลอการเปลี่ยนแปลงภูมิอากาศ" }
  - { term: การปรับตัว, definition: "การเตรียมรับและลดความเสียหายจากผลของการเปลี่ยนแปลงภูมิอากาศที่หลีกเลี่ยงไม่ได้" }
flashcards:
  - { front: "หลักฐานว่าดวงอาทิตย์ไม่ใช่สาเหตุของโลกร้อนช่วงหลัง", back: "พลังงานจากดวงอาทิตย์ไม่เพิ่มตั้งแต่ราว 1960 และสตราโทสเฟียร์เย็นลงขณะโทรโพสเฟียร์อุ่นขึ้น" }
  - { front: "แรงบังคับจาก CO₂ สองเท่า", back: "ราว 3.7 W/m² จาก 5.35 ln 2 ความไวสมดุลราว 3 °C (2.5–4 °C)" }
  - { front: "อุณหภูมิกับ CO₂ สะสม", back: "ร้อนขึ้นราว 0.45 °C ต่อ 1,000 Gt CO₂ ที่ปล่อยสะสม อุณหภูมิหยุดเพิ่มเมื่อการปล่อยสุทธิเป็นศูนย์" }
  - { front: "การลดผลกระทบกับการปรับตัวต่างกันอย่างไร", back: "ลดผลกระทบ คือ ลดการปล่อยหรือดูดกลับ ปรับตัว คือ เตรียมรับผลที่หลีกเลี่ยงไม่ได้ ต้องทำทั้งสองอย่าง" }
  - { front: "การป้อนกลับแบบเสริมที่สำคัญ", back: "ไอน้ำ น้ำแข็งกับอัลบีโด ชั้นดินเยือกแข็งปล่อยมีเทน มหาสมุทรอุ่นดูด CO₂ ได้น้อยลง" }
