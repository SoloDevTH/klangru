<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="sans-serif">
<title>รูปทรงและสีของป้ายสัญลักษณ์ความปลอดภัย</title>
<defs></defs>
<rect x="0" y="0" width="860" height="300" fill="#fff"/>
<text x="20.0" y="32.0" font-size="20" text-anchor="start" fill="#1f5fbf" font-weight="bold">รูปทรงและสีของป้าย บอกความหมายได้ก่อนอ่านตัวหนังสือ</text>
<circle cx="110.0" cy="120.0" r="52.0" fill="#fff" stroke="#c62828" stroke-width="10"/>
<line x1="74.0" y1="84.0" x2="146.0" y2="156.0" stroke="#c62828" stroke-width="10" stroke-linecap="round"/>
<polygon points="320.0,58.0 262.0,165.0 378.0,165.0" fill="#ffd600" stroke="#222" stroke-width="5" stroke-linejoin="round"/>
<text x="320.0" y="145.0" font-size="56" text-anchor="middle" fill="#111" font-weight="bold">!</text>
<circle cx="530.0" cy="120.0" r="52.0" fill="#1565c0" stroke="#1565c0" stroke-width="1.5"/>
<circle cx="530.0" cy="95.0" r="9.0" fill="#fff" stroke="#fff" stroke-width="1.5"/>
<line x1="530.0" y1="108.0" x2="530.0" y2="140.0" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
<line x1="510.0" y1="118.0" x2="550.0" y2="118.0" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
<line x1="530.0" y1="140.0" x2="518.0" y2="162.0" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
<line x1="530.0" y1="140.0" x2="542.0" y2="162.0" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
<rect x="688.0" y="68.0" width="104.0" height="104.0" rx="6" fill="#2e7d32" stroke="#2e7d32" stroke-width="1.5"/>
<line x1="710.0" y1="120.0" x2="766.0" y2="120.0" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
<polygon points="776,120 752,100 752,140" fill="#fff"/>
<text x="110.0" y="212.0" font-size="16" text-anchor="middle" fill="#333" font-weight="normal">วงกลมขอบแดง มีขีดทับ</text>
<text x="110.0" y="245.0" font-size="21" text-anchor="middle" fill="#111" font-weight="bold">ห้ามทำ</text>
<text x="320.0" y="212.0" font-size="16" text-anchor="middle" fill="#333" font-weight="normal">สามเหลี่ยมสีเหลือง</text>
<text x="320.0" y="245.0" font-size="21" text-anchor="middle" fill="#111" font-weight="bold">เตือนให้ระวัง</text>
<text x="530.0" y="212.0" font-size="16" text-anchor="middle" fill="#333" font-weight="normal">วงกลมสีน้ำเงิน</text>
<text x="530.0" y="245.0" font-size="21" text-anchor="middle" fill="#111" font-weight="bold">ต้องทำตาม</text>
<text x="740.0" y="212.0" font-size="16" text-anchor="middle" fill="#333" font-weight="normal">สี่เหลี่ยมสีเขียว</text>
<text x="740.0" y="245.0" font-size="21" text-anchor="middle" fill="#111" font-weight="bold">ปลอดภัย ทางออก</text>
<text x="840.0" y="288.0" font-size="14" text-anchor="end" fill="#555" font-weight="normal">ป้ายจราจรของไทยมีแบบของตัวเอง เช่น ป้ายเตือนเป็นรูปสี่เหลี่ยมข้าวหลามตัดสีเหลือง</text>
</svg>
