rows:
  - { framework: th-coe-engineering-basics, indicators: ["IE-3.2"], coverage: partial, note: "สอนการศึกษาและออกแบบระบบงานเพื่อเพิ่มผลิตภาพและประสิทธิภาพการผลิต (วิธีการทำงาน การศึกษาเวลา การสุ่มงาน การจัดสมดุลสาย) และการยศาสตร์ (ท่าทางการทำงาน การยกด้วยสมการ NIOSH แบบย่อ เสียง แสง) ยังไม่สอนการออกแบบระบบงานเพื่อความปลอดภัย ระบบดับเพลิง การจัดการกากอุตสาหกรรม น้ำเสีย และมลพิษทางอากาศ (การประเมินความเสี่ยงอยู่ใน engineering.safety.risk-assessment)" }
