id: english.grammar.past-simple
subject: english
title: { th: Past simple (อดีตกาลธรรมดา), en: Past simple }
summary: เล่าเหตุการณ์ที่จบแล้วในอดีตด้วยกริยาช่องที่ 2 ทั้งกริยาปกติที่เติม -ed และกริยาไม่ปกติที่ใช้บ่อย และใช้ did ในประโยคปฏิเสธและคำถาม
difficulty: 2
minutes: 30
prerequisites: [english.grammar.present-simple]
encompasses:
  - { id: english.grammar.present-simple, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: past-simple-timeline.svg
    alt: "เส้นเวลาจากอดีตไปอนาคต มีขีดแดงบอกตอนนี้ ในกรอบเส้นประชื่อ yesterday ทางซ้ายของตอนนี้มีกากบาท 3 จุดเรียงกัน 1 got up, 2 took the bus, 3 arrived ประกอบประโยค Yesterday I got up at six, took the bus and arrived at school at eight. ทุกเหตุการณ์จบก่อนถึงตอนนี้"
    caption: "past simple เล่าเหตุการณ์ที่จบแล้วในอดีต เรียงตามลำดับที่เกิด"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: สะกดและออกเสียง -ed
    problem: "เปลี่ยน plan, cry และ visit เป็นรูปอดีต แล้วบอกว่า -ed ออกเสียงอย่างไร"
    steps:
      - text: "plan ลงท้ายด้วยพยัญชนะ-สระ-พยัญชนะ (p-l-a-n) และเป็นพยางค์เดียว จึงเพิ่ม n อีกตัว ได้ planned"
        why: "ถ้าไม่เพิ่ม n จะได้ planed ซึ่งอ่านเป็นอีกคำหนึ่ง (เพลน-ด์ แบบ plane)"
      - text: "cry ลงท้ายด้วยพยัญชนะ + y จึงเปลี่ยน y เป็น i ได้ cried"
      - text: "visit เน้นเสียงพยางค์แรก (VI-sit) จึงไม่ต้องเพิ่ม t ได้ visited"
        why: "กฎเพิ่มตัวสะกดใช้เมื่อพยางค์ท้ายลงเสียงหนักเท่านั้น"
      - text: "ออกเสียง: planned ลงท้ายเสียง n (ก้อง) → /d/ · cried ลงท้ายสระ → /d/ · visited ลงท้ายเสียง t → /ɪd/ เพิ่มพยางค์"
    answer: "planned /d/ · cried /d/ · visited /ɪd/"
  - { type: check, problem: eng.past.p016, prompt: "ลองฟังเสียง -ed ในใจ" }
  - type: worked-example
    title: เขียนบันทึกประจำวันจากโน้ตสั้น ๆ
    problem: "เปลี่ยนโน้ตของเมื่อวานเป็นเรื่องเล่า ใช้ First, Then, After that, Finally: get up at 6 / take the BTS to Siam / meet Ploy, eat noodles / walk around the shops, not buy anything / go home at 9, be very tired"
    steps:
      - text: "เรื่องเกิดเมื่อวานและจบแล้ว ทุกกริยาจึงใช้ past simple"
      - text: "เปลี่ยนกริยาไม่ปกติ: get → got · take → took · meet → met · eat → ate · go → went · be → was ส่วน walk เป็นกริยาปกติ → walked"
      - text: "ประโยคปฏิเสธใช้ didn't + กริยาช่องที่ 1: didn't buy"
        why: "did บอกอดีตแล้ว จึงไม่ใช้ bought ซ้ำ"
      - text: "เรียงด้วยคำบอกลำดับ และใส่คำบอกเวลา Yesterday ไว้ต้นเรื่อง"
    answer: "*Yesterday I got up at six. First, I took the BTS to Siam. Then I met Ploy and we ate noodles. After that, we walked around the shops, but I didn't buy anything. Finally, I went home at nine. I was very tired.*"
  - { type: check, problem: eng.past.p017, prompt: "เรียงเรื่องเล่าด้วยคำบอกลำดับ" }
glossary:
  - { term: past simple, definition: "รูปประโยคที่ใช้กับเหตุการณ์ที่เกิดและจบแล้วในอดีต เช่น I watched a movie yesterday." }
  - { term: กริยาช่องที่ 2 (V2), definition: "รูปอดีตของกริยา กริยาปกติเติม -ed เช่น played ส่วนกริยาไม่ปกติเปลี่ยนรูปเฉพาะตัว เช่น go → went" }
  - { term: กริยาไม่ปกติ, definition: "กริยาที่ไม่ได้เติม -ed ในรูปอดีต ต้องจำเป็นคำ ๆ เช่น buy → bought, eat → ate" }
flashcards:
  - { front: "ปฏิเสธและคำถามของ past simple ใช้อะไร", back: "didn't หรือ Did แล้วตามด้วยกริยาช่องที่ 1 เช่น Did you see it? / I didn't go." }
  - { front: "stop, study เติม -ed อย่างไร", back: "stopped (เพิ่มตัวสะกด) และ studied (พยัญชนะ + y เปลี่ยนเป็น ied)" }
  - { front: "ช่องที่ 2 ของ go, buy, teach, eat", back: "went, bought, taught, ate" }
  - { front: "Did Nok buy a new phone? (ตอบปฏิเสธสั้น)", back: "No, she didn't." }
