<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="sans-serif" font-size="13">
  <title>ผังงานตัดสินใจว่านำสื่อของผู้อื่นมาใช้ได้หรือไม่</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="800" height="560" fill="#ffffff"/>
  <rect x="200.0" y="10.0" width="220.0" height="40.0" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/>
  <text x="310.0" y="34.5" font-size="13" text-anchor="middle" fill="#1f2937">เริ่ม: อยากใช้ภาพ เพลง หรือโค้ด</text>
  <polygon points="310.0,65.0 460.0,105.0 310.0,145.0 160.0,105.0" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="310.0" y="101.0" font-size="13" text-anchor="middle" fill="#1f2937">เป็นสาธารณสมบัติ</text>
  <text x="310.0" y="119.0" font-size="13" text-anchor="middle" fill="#1f2937">หรือ CC0 หรือไม่</text>
  <polygon points="310.0,173.0 510.0,215.0 310.0,257.0 110.0,215.0" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="310.0" y="211.0" font-size="13" text-anchor="middle" fill="#1f2937">มีสัญญาอนุญาต (CC หรือสัญญาซอฟต์แวร์)</text>
  <text x="310.0" y="229.0" font-size="13" text-anchor="middle" fill="#1f2937">ที่อนุญาตสิ่งที่เราจะทำหรือไม่</text>
  <polygon points="310.0,283.0 500.0,335.0 310.0,387.0 120.0,335.0" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="310.0" y="322.0" font-size="13" text-anchor="middle" fill="#1f2937">เข้าข่ายใช้โดยชอบธรรมหรือไม่</text>
  <text x="310.0" y="340.0" font-size="13" text-anchor="middle" fill="#1f2937">(ศึกษา ไม่หากำไร ใช้บางส่วน</text>
  <text x="310.0" y="358.0" font-size="13" text-anchor="middle" fill="#1f2937">รับรู้ความเป็นเจ้าของ)</text>
  <line x1="310.0" y1="50.0" x2="310.0" y2="64.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="310.0" y1="145.0" x2="310.0" y2="172.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="310.0" y1="257.0" x2="310.0" y2="282.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="310.0" y1="387.0" x2="310.0" y2="420.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="320.0" y="165.0" font-size="13" text-anchor="start" fill="#b91c1c">ไม่</text>
  <text x="320.0" y="276.0" font-size="13" text-anchor="start" fill="#b91c1c">ไม่</text>
  <text x="320.0" y="405.0" font-size="13" text-anchor="start" fill="#b91c1c">ไม่</text>
  <rect x="560.0" y="80.0" width="220.0" height="50.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="670.0" y="100.8" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">ใช้ได้</text>
  <text x="670.0" y="118.3" font-size="13" text-anchor="middle" fill="#1f2937">ให้เครดิตเป็นมารยาทที่ดี</text>
  <rect x="560.0" y="190.0" width="220.0" height="50.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="670.0" y="210.8" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">ใช้ได้ตามเงื่อนไข</text>
  <text x="670.0" y="228.3" font-size="13" text-anchor="middle" fill="#1f2937">ให้เครดิตครบ</text>
  <rect x="560.0" y="310.0" width="220.0" height="50.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="670.0" y="330.8" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">ใช้ได้เท่าที่จำเป็น</text>
  <text x="670.0" y="348.3" font-size="13" text-anchor="middle" fill="#1f2937">อ้างอิงที่มา</text>
  <line x1="460.0" y1="105.0" x2="558.0" y2="105.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="468.0" y="97.0" font-size="13" text-anchor="start" fill="#15803d">ใช่</text>
  <line x1="510.0" y1="215.0" x2="558.0" y2="215.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="518.0" y="207.0" font-size="13" text-anchor="start" fill="#15803d">ใช่</text>
  <line x1="500.0" y1="335.0" x2="558.0" y2="335.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="508.0" y="327.0" font-size="13" text-anchor="start" fill="#15803d">ใช่</text>
  <rect x="185.0" y="422.0" width="250.0" height="56.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="310.0" y="445.8" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">ขออนุญาตเจ้าของงาน</text>
  <text x="310.0" y="463.3" font-size="13" text-anchor="middle" fill="#1f2937">หรือหาสื่อที่อนุญาตแทน</text>
  <text x="20.0" y="520.0" font-size="13" text-anchor="start" fill="#6b7280">ถ้าเป็นงานของเราเองทั้งหมด ใช้ได้เลย และเลือกสัญญาอนุญาตให้ผู้อื่นได้</text>
  <text x="20.0" y="545.0" font-size="12" text-anchor="start" fill="#6b7280">ผังนี้เป็นแนวทางเบื้องต้น ไม่ใช่คำแนะนำทางกฎหมาย</text>
</svg>
