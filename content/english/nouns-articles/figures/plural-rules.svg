<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="sans-serif">
<title>ผังการเติม s ทำเป็นพหูพจน์</title>
<rect x="0" y="0" width="760" height="470" fill="#fff"/>
<rect x="20.0" y="30.0" width="330.0" height="58.0" rx="10" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="185.0" y="53.8" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">ลงท้าย s, ss, sh, ch, x</text>
<text x="185.0" y="74.8" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">หรือ o (บางคำ)?</text>
<line x1="350.0" y1="59.0" x2="420.0" y2="59.0" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="420.0,59.0 411.0,63.3 411.0,54.7" fill="#111" stroke="#111" stroke-width="1" stroke-linejoin="round"/>
<text x="385.0" y="51.0" font-size="13" text-anchor="middle" fill="#2e7d32" font-weight="normal">ใช่</text>
<rect x="420.0" y="30.0" width="320.0" height="58.0" rx="10" fill="#eef4fb" stroke="#1f4e9c" stroke-width="2"/>
<text x="580.0" y="53.9" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">เติม -es</text>
<text x="580.0" y="73.9" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">box → boxes · tomato → tomatoes</text>
<line x1="185.0" y1="88.0" x2="185.0" y2="128.0" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="185.0,128.0 180.7,119.0 189.3,119.0" fill="#111" stroke="#111" stroke-width="1" stroke-linejoin="round"/>
<text x="207.0" y="116.0" font-size="13" text-anchor="middle" fill="#b23" font-weight="normal">ไม่</text>
<rect x="20.0" y="130.0" width="330.0" height="58.0" rx="10" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="185.0" y="164.2" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">ลงท้าย พยัญชนะ + y ?</text>
<line x1="350.0" y1="159.0" x2="420.0" y2="159.0" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="420.0,159.0 411.0,163.3 411.0,154.7" fill="#111" stroke="#111" stroke-width="1" stroke-linejoin="round"/>
<text x="385.0" y="151.0" font-size="13" text-anchor="middle" fill="#2e7d32" font-weight="normal">ใช่</text>
<rect x="420.0" y="130.0" width="320.0" height="58.0" rx="10" fill="#eef4fb" stroke="#1f4e9c" stroke-width="2"/>
<text x="580.0" y="153.9" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">เปลี่ยน y เป็น -ies</text>
<text x="580.0" y="173.9" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">baby → babies · city → cities</text>
<line x1="185.0" y1="188.0" x2="185.0" y2="228.0" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="185.0,228.0 180.7,219.0 189.3,219.0" fill="#111" stroke="#111" stroke-width="1" stroke-linejoin="round"/>
<text x="207.0" y="216.0" font-size="13" text-anchor="middle" fill="#b23" font-weight="normal">ไม่</text>
<rect x="20.0" y="230.0" width="330.0" height="58.0" rx="10" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="185.0" y="264.2" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">ลงท้าย f หรือ fe ?</text>
<line x1="350.0" y1="259.0" x2="420.0" y2="259.0" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="420.0,259.0 411.0,263.3 411.0,254.7" fill="#111" stroke="#111" stroke-width="1" stroke-linejoin="round"/>
<text x="385.0" y="251.0" font-size="13" text-anchor="middle" fill="#2e7d32" font-weight="normal">ใช่</text>
<rect x="420.0" y="230.0" width="320.0" height="58.0" rx="10" fill="#eef4fb" stroke="#1f4e9c" stroke-width="2"/>
<text x="580.0" y="253.9" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">เปลี่ยนเป็น -ves (เกือบทุกคำ)</text>
<text x="580.0" y="273.9" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">knife → knives · leaf → leaves</text>
<line x1="185.0" y1="288.0" x2="185.0" y2="328.0" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="185.0,328.0 180.7,319.0 189.3,319.0" fill="#111" stroke="#111" stroke-width="1" stroke-linejoin="round"/>
<text x="207.0" y="316.0" font-size="13" text-anchor="middle" fill="#b23" font-weight="normal">ไม่</text>
<rect x="20.0" y="330.0" width="330.0" height="58.0" rx="10" fill="#eef4fb" stroke="#1f4e9c" stroke-width="2"/>
<text x="185.0" y="353.9" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">คำทั่วไป</text>
<text x="185.0" y="373.9" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">cat → cats · day → days</text>
<rect x="420.0" y="330.0" width="320.0" height="120.0" rx="10" fill="#fff6e5" stroke="#c77700" stroke-width="2"/>
<text x="580.0" y="355.0" font-size="15" text-anchor="middle" fill="#8a4b00" font-weight="bold">ไม่ตามกฎ (ต้องจำ)</text>
<text x="580.0" y="380.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">man → men · woman → women</text>
<text x="580.0" y="400.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">child → children · person → people</text>
<text x="580.0" y="420.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">foot → feet · tooth → teeth</text>
<text x="580.0" y="440.0" font-size="14" text-anchor="middle" fill="#111" font-weight="normal">mouse → mice · fish → fish</text>
<text x="185.0" y="410.0" font-size="15" text-anchor="middle" fill="#1f4e9c" font-weight="bold">เติม -s</text>
</svg>
