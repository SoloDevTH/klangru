    ai_assisted: true

  - id: hlt.nut.p026
    topics: [health.nutrition.basics]
    difficulty: 3
    type: mcq
    stem: "โฆษณาน้ำผลไม้กล่องหนึ่งเขียนตัวใหญ่ว่า \"ไขมัน 0% ดีต่อสุขภาพ\" เมื่อพลิกดูฉลากพบว่าหนึ่งกล่องมีน้ำตาล 30 กรัม ข้อสรุปใดสมเหตุสมผลที่สุด"
    choices:
      - { id: a, text: "ไม่มีไขมันจริง แต่น้ำตาล 30 กรัมเป็นสัดส่วนมากของปริมาณที่ควรได้ต่อวัน คำว่า \"ดีต่อสุขภาพ\" จึงต้องดูทั้งฉลากก่อนเชื่อ", correct: true }
      - { id: b, text: "ดื่มได้ไม่จำกัด เพราะไม่มีไขมัน", feedback: "การไม่มีไขมันไม่ได้แปลว่าไม่มีพลังงานหรือน้ำตาล น้ำตาล 30 กรัมให้พลังงาน 120 กิโลแคลอรี" }
      - { id: c, text: "โฆษณาต้องถูกเสมอ เพราะพิมพ์อยู่บนกล่อง", feedback: "ข้อความโฆษณาเลือกเน้นจุดที่ขายได้ ควรตรวจกับข้อมูลโภชนาการทั้งหมด" }
      - { id: d, text: "น้ำผลไม้ทุกชนิดไม่มีน้ำตาล", feedback: "WHO นับน้ำตาลในน้ำผลไม้เป็นน้ำตาลอิสระที่ควรจำกัด" }
    hints:
      - "ข้อความโฆษณาบอกข้อมูลครบหรือเลือกบอกบางส่วน"
      - "เทียบน้ำตาล 30 กรัมกับประมาณ 50 กรัมต่อวันที่ WHO แนะนำ"
    solution: "ไขมัน 0% อาจจริง แต่น้ำตาล 30 กรัมคิดเป็น $\\frac{30}{50} \\times 100 = 60\\%$ ของน้ำตาลอิสระที่ WHO แนะนำต่อวัน (ที่ 2,000 กิโลแคลอรี) และ WHO นับน้ำตาลในน้ำผลไม้เป็นน้ำตาลอิสระ การประเมินข้อความโฆษณาจึงต้องอ่านฉลากทั้งหมด"
    license: CC-BY-SA-4.0
    ai_assisted: true
