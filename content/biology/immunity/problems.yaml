problems:
  - id: biology.animals.immunity.p001
    topics: [biology.animals.immunity]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นกลไกต่อต้านสิ่งแปลกปลอมด่านที่ 1"
    choices:
      - { id: a, text: "ผิวหนังที่ไม่มีบาดแผล", correct: true }
      - { id: b, text: "เซลล์พลาสมาสร้างแอนติบอดี", feedback: "เป็นกลไกแบบจำเพาะ ซึ่งเกิดหลังจากเชื้อผ่านเข้าไปในร่างกายแล้ว" }
      - { id: c, text: "เซลล์ทีพิฆาตทำลายเซลล์ที่ติดไวรัส", feedback: "เป็นภูมิคุ้มกันแบบใช้เซลล์ ซึ่งเป็นแบบจำเพาะ" }
      - { id: d, text: "แมโครฟาจกินแบคทีเรียในเนื้อเยื่อ", feedback: "ฟาโกไซโทซิสในเนื้อเยื่อเป็นด่านที่ 2 เพราะเชื้อผ่านสิ่งกีดขวางเข้ามาแล้ว" }
    hints:
      - "ด่านที่ 1 ป้องกันไม่ให้เชื้อเข้าสู่ร่างกาย"
      - "เลือกสิ่งกีดขวางทางกายภาพ"
    solution: "ผิวหนังที่ไม่มีบาดแผลเป็นสิ่งกีดขวางที่เชื้อโรคผ่านได้ยาก จึงเป็นด่านที่ 1 ของกลไกแบบไม่จำเพาะ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.immunity.p002
    topics: [biology.animals.immunity]
    difficulty: 1
    type: match
    stem: "จับคู่เซลล์กับหน้าที่"
    pairs:
      - { left: "นิวโทรฟิล", right: "กินเชื้อโรคด้วยฟาโกไซโทซิส" }
      - { left: "เซลล์พลาสมา", right: "หลั่งแอนติบอดี" }
      - { left: "เซลล์ทีผู้ช่วย", right: "กระตุ้นเซลล์บีและเซลล์ทีพิฆาต" }
      - { left: "เซลล์ทีพิฆาต", right: "ทำลายเซลล์ร่างกายที่ติดไวรัส" }
      - { left: "เซลล์ความจำ", right: "จำแอนติเจนเดิมและตอบสนองเร็วเมื่อพบอีก" }
    hints:
      - "เซลล์พลาสมาเปลี่ยนมาจากเซลล์บี"
      - "เซลล์ทีมีสองชนิดหลัก ชนิดหนึ่งสั่งการ อีกชนิดลงมือทำลาย"
    solution: "นิวโทรฟิลเป็นฟาโกไซต์ เซลล์พลาสมาสร้างแอนติบอดี เซลล์ทีผู้ช่วยกระตุ้นลิมโฟไซต์อื่น เซลล์ทีพิฆาตทำลายเซลล์ที่ติดเชื้อ และเซลล์ความจำทำให้ตอบสนองเร็วในครั้งต่อไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.immunity.p003
    topics: [biology.animals.immunity]
    difficulty: 1
    type: text
    stem: "ไวรัสที่ทำให้เกิดภาวะภูมิคุ้มกันบกพร่องจนเข้าสู่ระยะเอดส์ชื่ออะไร"
    accepted: ["เอชไอวี", "HIV", "ไวรัสเอชไอวี"]
    misconceptions:
      - { match: "เอดส์", feedback: "เอดส์คือระยะท้ายของการติดเชื้อ ไม่ใช่ชื่อไวรัส" }
      - { match: "HPV", feedback: "HPV (เอชพีวี) เกี่ยวกับมะเร็งปากมดลูก ไม่ใช่สาเหตุของเอดส์" }
    hints:
      - "ชื่อย่อภาษาอังกฤษมี 3 ตัวอักษร"
      - "ไวรัสนี้ทำลายเซลล์ทีผู้ช่วย"
    solution: "เอชไอวี (HIV) ทำลายเซลล์ทีผู้ช่วย เมื่อจำนวนเซลล์ลดลงมากจะเข้าสู่ระยะเอดส์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.immunity.p004
    topics: [biology.animals.immunity]
    difficulty: 2
    type: match
    stem: "จับคู่สถานการณ์กับชนิดของภูมิคุ้มกัน"
    pairs:
      - { left: "เด็กเป็นอีสุกอีใสแล้วหาย", right: "ก่อเองโดยธรรมชาติ" }
      - { left: "เด็กได้รับวัคซีนหัด", right: "ก่อเองจากการแพทย์" }
      - { left: "ทารกได้แอนติบอดีจากน้ำนมแม่", right: "รับมาโดยธรรมชาติ" }
      - { left: "ผู้ถูกงูเห่ากัดได้รับเซรุ่มแก้พิษงู", right: "รับมาจากการแพทย์" }
    hints:
      - "ก่อเอง = ร่างกายสร้างแอนติบอดีเอง รับมา = ได้แอนติบอดีสำเร็จรูป"
      - "การแพทย์ = วัคซีนหรือเซรุ่ม ธรรมชาติ = ป่วยเองหรือได้จากแม่"
    solution: "ป่วยแล้วหายและวัคซีนทำให้ร่างกายสร้างภูมิคุ้มกันเอง ส่วนน้ำนมแม่และเซรุ่มให้แอนติบอดีสำเร็จรูป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.immunity.p005
    topics: [biology.animals.immunity]
    difficulty: 2
    type: mcq
    stem: "วัคซีนหลายชนิดต้องฉีดเข็มกระตุ้น เพราะเหตุใด"
    choices:
      - { id: a, text: "การได้รับแอนติเจนซ้ำกระตุ้นเซลล์ความจำ ทำให้แอนติบอดีขึ้นเร็วและสูงกว่าครั้งแรก", correct: true }
      - { id: b, text: "วัคซีนเข็มแรกไม่มีแอนติเจนอยู่เลย", feedback: "เข็มแรกมีแอนติเจน แต่การตอบสนองครั้งแรกช้าและต่ำ" }
      - { id: c, text: "เข็มกระตุ้นมีแอนติบอดีสำเร็จรูปเพิ่มเข้าไป", feedback: "วัคซีนให้แอนติเจน ไม่ได้ให้แอนติบอดีสำเร็จรูป" }
      - { id: d, text: "เพื่อทำลายเซลล์ความจำจากเข็มแรก", feedback: "เข็มกระตุ้นอาศัยเซลล์ความจำ ไม่ได้ทำลาย" }
    hints:
      - "เทียบการตอบสนองครั้งแรกกับครั้งที่สองในกราฟ"
      - "เซลล์ใดทำให้ครั้งที่สองต่างจากครั้งแรก"
    solution: "เข็มแรกให้การตอบสนองปฐมภูมิที่ช้าและต่ำ แต่สร้างเซลล์ความจำ เข็มกระตุ้นทำให้เกิดการตอบสนองทุติยภูมิ แอนติบอดีขึ้นเร็ว สูง และอยู่นานกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.immunity.p006
    topics: [biology.animals.immunity]
    difficulty: 2
    type: order
    stem: "เรียงเหตุการณ์ของภูมิคุ้มกันแบบสารน้ำเมื่อแบคทีเรียเข้าสู่ร่างกายครั้งแรก"
    items:
      - "แมโครฟาจกินแบคทีเรียแล้วนำเสนอแอนติเจน"
      - "เซลล์ทีผู้ช่วยรับรู้แอนติเจนและถูกกระตุ้น"
      - "เซลล์ทีผู้ช่วยกระตุ้นเซลล์บีที่จำเพาะต่อแอนติเจนนั้น"
      - "เซลล์บีแบ่งตัวเป็นเซลล์พลาสมาและเซลล์ความจำ"
      - "เซลล์พลาสมาหลั่งแอนติบอดีจับแอนติเจน"
    hints:
      - "เริ่มจากการนำเสนอแอนติเจน"
      - "แอนติบอดีมาจากเซลล์พลาสมา ซึ่งต้องเกิดก่อน"
    solution: "แมโครฟาจนำเสนอแอนติเจน → เซลล์ทีผู้ช่วยถูกกระตุ้น → กระตุ้นเซลล์บี → เซลล์บีแบ่งตัวเป็นเซลล์พลาสมาและเซลล์ความจำ → เซลล์พลาสมาหลั่งแอนติบอดี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.immunity.p007
    topics: [biology.animals.immunity]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "โรคใดเกิดจากไวรัส (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "หัด", correct: true }
      - { id: b, text: "ไข้เลือดออก", correct: true }
      - { id: c, text: "ไข้หวัดใหญ่", correct: true }
      - { id: d, text: "วัณโรค", feedback: "วัณโรคเกิดจากแบคทีเรีย" }
      - { id: e, text: "โรคไหม้ของข้าว", feedback: "โรคไหม้ของข้าวเกิดจากรา" }
      - { id: f, text: "มาลาเรีย", feedback: "มาลาเรียเกิดจากโพรทิสต์ที่ยุงก้นปล่องเป็นพาหะ" }
    hints:
      - "แยกเชื้อก่อโรคเป็นแบคทีเรีย ไวรัส รา และโพรทิสต์"
      - "ยาปฏิชีวนะใช้ไม่ได้กับโรคจากไวรัส"
    solution: "หัด ไข้เลือดออก และไข้หวัดใหญ่เกิดจากไวรัส วัณโรคเกิดจากแบคทีเรีย โรคไหม้ของข้าวเกิดจากรา และมาลาเรียเกิดจากโพรทิสต์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.immunity.p008
    topics: [biology.animals.immunity]
    difficulty: 3
    type: numeric
    stem: "จากกราฟระดับแอนติบอดีของอาสาสมัครที่ได้รับแอนติเจนชนิดเดียวกันในวันที่ 0 และวันที่ 42 ระดับแอนติบอดีสูงสุดหลังได้รับครั้งที่สองเป็นกี่เท่าของระดับสูงสุดหลังได้รับครั้งแรก"
    figure: { src: antibody-graph.svg, alt: "กราฟชื่อระดับแอนติบอดีของอาสาสมัคร (ข้อมูลสมมติ) แกนนอนคือเวลา 0 ถึง 70 วัน แกนตั้งคือระดับแอนติบอดี 0 ถึง 120 หน่วยสัมพัทธ์ มีลูกศรบอกการได้รับแอนติเจนครั้งที่ 1 ในวันที่ 0 และครั้งที่ 2 ในวันที่ 42 เส้นกราฟขึ้นเป็นเนินเตี้ยสูงสุดที่ 10 หน่วยในวันที่ 14 แล้วลดลงเกือบศูนย์ หลังวันที่ 42 เส้นขึ้นชันถึงสูงสุด 100 หน่วยในวันที่ 49 แล้วลดลงช้า ๆ เหลือราว 55 หน่วยในวันที่ 70" }
    answer: { value: 10, unit: เท่า }
    misconceptions:
      - { match: 90, feedback: "90 คือผลต่างของระดับสูงสุด โจทย์ถามว่าเป็นกี่เท่า" }
      - { match: 0.1, feedback: "หารกลับด้าน ต้องเอาค่าครั้งที่สองตั้ง" }
    hints:
      - "อ่านค่าสูงสุดของเนินแรกและเนินที่สอง"
      - "กี่เท่า = ค่าครั้งที่สอง ÷ ค่าครั้งแรก"
    solution: "ครั้งแรกสูงสุด 10 หน่วย ครั้งที่สองสูงสุด 100 หน่วย จึงเป็น $100 \\div 10 = 10$ เท่า และถึงจุดสูงสุดเร็วกว่า (7 วัน เทียบกับ 14 วัน) เพราะเซลล์ความจำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.immunity.p009
    topics: [biology.animals.immunity]
    difficulty: 3
    type: mcq
    stem: "ทำไมผู้ที่ติดเชื้อเอชไอวีและไม่ได้รับยาต้านไวรัสจึงติดเชื้อฉวยโอกาสได้ง่ายทั้งจากแบคทีเรีย ไวรัส และรา"
    choices:
      - { id: a, text: "เอชไอวีทำลายเซลล์ทีผู้ช่วย ซึ่งกระตุ้นทั้งเซลล์บีและเซลล์ทีพิฆาต ภูมิคุ้มกันแบบจำเพาะทั้งสองแบบจึงอ่อนลง", correct: true }
      - { id: b, text: "เอชไอวีทำลายเม็ดเลือดแดง ร่างกายจึงขาดออกซิเจน", feedback: "เอชไอวีเข้าสู่เซลล์ที่มีโปรตีน CD4 เช่น เซลล์ทีผู้ช่วย ไม่ใช่เม็ดเลือดแดง" }
      - { id: c, text: "เอชไอวีทำลายผิวหนังจนเชื้อเข้าได้ง่าย", feedback: "เอชไอวีไม่ได้ทำลายผิวหนังโดยตรง ปัญหาอยู่ที่ภูมิคุ้มกันแบบจำเพาะ" }
      - { id: d, text: "เอชไอวีทำให้ร่างกายสร้างแอนติบอดีมากเกินไปจนทำลายตัวเอง", feedback: "เป็นลักษณะของโรคภูมิต้านทานต่อเนื้อเยื่อตนเอง ไม่ใช่การติดเชื้อเอชไอวี" }
    hints:
      - "เซลล์ที่ถูกทำลายทำหน้าที่สั่งการให้ลิมโฟไซต์อื่นทำงาน"
      - "เมื่อผู้สั่งการหายไป ทั้งสองทางของภูมิคุ้มกันแบบจำเพาะเป็นอย่างไร"
    solution: "เอชไอวีทำลายเซลล์ทีผู้ช่วย ทำให้การกระตุ้นเซลล์บีและเซลล์ทีพิฆาตลดลง เมื่อ CD4 ต่ำกว่า 200 เซลล์ต่อลูกบาศก์มิลลิเมตร เชื้อที่ปกติไม่ก่อโรครุนแรงจึงก่อโรคได้ ยาต้านไวรัสช่วยคงจำนวน CD4 ไว้ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.immunity.p010
    topics: [biology.animals.immunity]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "เอชไอวีติดต่อทางใดได้ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ใช้เข็มฉีดยาร่วมกัน", correct: true }
      - { id: b, text: "มีเพศสัมพันธ์โดยไม่ใช้ถุงยางอนามัยกับผู้ที่มีเชื้อและยังมีไวรัสในเลือด", correct: true }
      - { id: c, text: "จากแม่ที่มีเชื้อสู่ลูกระหว่างตั้งครรภ์ คลอด หรือให้นม หากไม่ได้รับการดูแล", correct: true }
      - { id: d, text: "กินข้าวและใช้แก้วน้ำร่วมกัน", feedback: "เอชไอวีไม่ติดต่อผ่านการใช้ภาชนะร่วมกัน" }
      - { id: e, text: "ยุงกัด", feedback: "เอชไอวีไม่เพิ่มจำนวนในยุง และยุงไม่ฉีดเลือดของคนก่อนหน้าเข้าสู่คนถัดไป" }
      - { id: f, text: "กอดหรือจับมือ", feedback: "การสัมผัสทั่วไปไม่ทำให้ติดเชื้อ" }
    hints:
      - "เอชไอวีอยู่ในเลือด น้ำอสุจิ สารคัดหลั่งในช่องคลอด และน้ำนม"
      - "การใช้ชีวิตประจำวันร่วมกันไม่ทำให้ติดเชื้อ"
    solution: "เอชไอวีติดต่อทางเลือด เพศสัมพันธ์ที่ไม่ป้องกัน และจากแม่สู่ลูก ไม่ติดต่อจากการกินข้าวร่วมกัน ยุงกัด หรือการกอด จึงไม่ควรรังเกียจผู้ติดเชื้อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.immunity.p011
    topics: [biology.animals.immunity]
    difficulty: 3
    type: mcq
    stem: "นักเรียนคนหนึ่งจามและคันตาทุกครั้งที่ปัดฝุ่นที่นอน เพราะแพ้ไรฝุ่น ข้อใดอธิบายกลไกได้ถูกต้อง"
    choices:
      - { id: a, text: "ร่างกายสร้างแอนติบอดี IgE ต่อสารจากไรฝุ่นซึ่งเกาะเซลล์มาสต์ เมื่อพบอีกเซลล์มาสต์หลั่งฮิสตามีน", correct: true }
