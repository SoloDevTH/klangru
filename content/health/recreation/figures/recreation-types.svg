<text x="50.0" y="350.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#fff">7</text>
<text x="78.0" y="339.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">ภาษาและวรรณกรรม</text>
<text x="78.0" y="362.0" font-size="13" text-anchor="start" font-weight="normal" fill="#333">เช่น อ่านนิทาน เขียนกลอน</text>
<rect x="390.0" y="312.0" width="350.0" height="64.0" rx="10" fill="#eef3fa" stroke="#1f4e9a" stroke-width="1.5" />
<circle cx="420.0" cy="344.0" r="17.0" fill="#1f4e9a" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="420.0" y="350.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#fff">8</text>
<text x="448.0" y="339.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">งานอดิเรก</text>
<text x="448.0" y="362.0" font-size="13" text-anchor="start" font-weight="normal" fill="#333">เช่น ปลูกผัก สะสมแสตมป์ ทำอาหาร</text>
<rect x="20.0" y="388.0" width="350.0" height="64.0" rx="10" fill="#eef3fa" stroke="#1f4e9a" stroke-width="1.5" />
<circle cx="50.0" cy="420.0" r="17.0" fill="#1f4e9a" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="50.0" y="426.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#fff">9</text>
<text x="78.0" y="415.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">กิจกรรมทางสังคม</text>
<text x="78.0" y="438.0" font-size="13" text-anchor="start" font-weight="normal" fill="#333">เช่น ชมรม งานประเพณี</text>
<rect x="390.0" y="388.0" width="350.0" height="64.0" rx="10" fill="#eef3fa" stroke="#1f4e9a" stroke-width="1.5" />
<circle cx="420.0" cy="420.0" r="17.0" fill="#1f4e9a" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="420.0" y="426.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#fff">10</text>
<text x="448.0" y="415.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">อาสาสมัคร</text>
<text x="448.0" y="438.0" font-size="13" text-anchor="start" font-weight="normal" fill="#333">เช่น เก็บขยะชายหาด อ่านหนังสือให้น้องฟัง</text>
