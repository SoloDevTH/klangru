<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei','Noto Sans Thai',sans-serif">
<title>แผนผังเลือกใช้ 不 没 别 และ 了</title>
<defs></defs>
<rect x="0" y="0" width="720" height="430" fill="#fff"/>
<text x="360.0" y="30.0" font-size="21" text-anchor="middle" fill="#1a1a1a" font-weight="bold">ปฏิเสธด้วยคำไหน</text>
<rect x="30.0" y="50.0" width="660.0" height="72.0" rx="10" fill="#dbe8f8" stroke="#1f4e9c" stroke-width="2"/>
<text x="120.0" y="94.0" font-size="24" text-anchor="middle" fill="#1f4e9c" font-weight="bold">不 bù</text>
<text x="235.0" y="80.0" font-size="16" text-anchor="start" fill="#1a1a1a" font-weight="normal">ไม่ (นิสัย ความตั้งใจ อนาคต คุณศัพท์ 是)</text>
<text x="235.0" y="106.0" font-size="17" text-anchor="start" fill="#1a1a1a" font-weight="normal">我不喝咖啡。 明天我不去。 他不是老师。</text>
<rect x="30.0" y="134.0" width="660.0" height="72.0" rx="10" fill="#fbe0dc" stroke="#b3261e" stroke-width="2"/>
<text x="120.0" y="178.0" font-size="20" text-anchor="middle" fill="#b3261e" font-weight="bold">没 (有) méi (yǒu)</text>
<text x="235.0" y="164.0" font-size="16" text-anchor="start" fill="#1a1a1a" font-weight="normal">ไม่ได้ / ยังไม่ (เรื่องที่ไม่ได้เกิด) และ ไม่มี</text>
<text x="235.0" y="190.0" font-size="17" text-anchor="start" fill="#1a1a1a" font-weight="normal">我昨天没去。 我没有钱。</text>
<rect x="30.0" y="218.0" width="660.0" height="72.0" rx="10" fill="#fbf0c0" stroke="#7a5a00" stroke-width="2"/>
<text x="120.0" y="262.0" font-size="24" text-anchor="middle" fill="#7a5a00" font-weight="bold">别 bié</text>
<text x="235.0" y="248.0" font-size="16" text-anchor="start" fill="#1a1a1a" font-weight="normal">อย่า (ห้ามหรือเตือน)</text>
<text x="235.0" y="274.0" font-size="17" text-anchor="start" fill="#1a1a1a" font-weight="normal">别说话！ 别担心。</text>
<text x="360.0" y="310.0" font-size="19" text-anchor="middle" fill="#1a1a1a" font-weight="bold">了 le สองตำแหน่ง</text>
<rect x="30.0" y="324.0" width="320.0" height="96.0" rx="10" fill="#dcefd6" stroke="#2a6a2a" stroke-width="2"/>
<rect x="370.0" y="324.0" width="320.0" height="96.0" rx="10" fill="#e6dcf5" stroke="#5b3a8c" stroke-width="2"/>
<text x="190.0" y="352.0" font-size="16" text-anchor="middle" fill="#2a6a2a" font-weight="bold">หลังกริยา: ทำเสร็จแล้ว</text>
<text x="190.0" y="380.0" font-size="19" text-anchor="middle" fill="#1a1a1a" font-weight="normal">我吃了三个包子。</text>
<text x="190.0" y="406.0" font-size="14" text-anchor="middle" fill="#666" font-weight="normal">ปฏิเสธ: 我没吃包子。 (ไม่มี 了)</text>
<text x="530.0" y="352.0" font-size="16" text-anchor="middle" fill="#5b3a8c" font-weight="bold">ท้ายประโยค: สภาพเปลี่ยน</text>
<text x="530.0" y="380.0" font-size="19" text-anchor="middle" fill="#1a1a1a" font-weight="normal">下雨了。 我饿了。</text>
<text x="530.0" y="406.0" font-size="14" text-anchor="middle" fill="#666" font-weight="normal">不…了 = ไม่…แล้ว: 我不去了。</text>
</svg>
