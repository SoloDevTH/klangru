<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei','Noto Sans Thai',sans-serif">
<title>เปรียบเทียบลำดับคำ ภาษาไทย หนังสือ สาม เล่ม กับภาษาจีน 三本书</title>
<defs></defs>
<rect x="0" y="0" width="700" height="300" fill="#fff"/>
<text x="350.0" y="32.0" font-size="22" text-anchor="middle" fill="#1a1a1a" font-weight="bold">ลำดับคำของลักษณนาม</text>
<rect x="150.0" y="60.0" width="140.0" height="56.0" rx="8" fill="#dcefd6" stroke="#2a6a2a" stroke-width="2"/>
<text x="220.0" y="96.0" font-size="22" text-anchor="middle" fill="#1a1a1a" font-weight="normal">หนังสือ</text>
<text x="220.0" y="136.0" font-size="14" text-anchor="middle" fill="#2a6a2a" font-weight="bold">คำนาม</text>
<rect x="310.0" y="60.0" width="140.0" height="56.0" rx="8" fill="#dbe8f8" stroke="#1f4e9c" stroke-width="2"/>
<text x="380.0" y="96.0" font-size="22" text-anchor="middle" fill="#1a1a1a" font-weight="normal">สาม</text>
<text x="380.0" y="136.0" font-size="14" text-anchor="middle" fill="#1f4e9c" font-weight="bold">ตัวเลข</text>
<rect x="470.0" y="60.0" width="140.0" height="56.0" rx="8" fill="#fbf0c0" stroke="#7a5a00" stroke-width="2"/>
<text x="540.0" y="96.0" font-size="22" text-anchor="middle" fill="#1a1a1a" font-weight="normal">เล่ม</text>
<text x="540.0" y="136.0" font-size="14" text-anchor="middle" fill="#7a5a00" font-weight="bold">ลักษณนาม</text>
<rect x="150.0" y="170.0" width="140.0" height="56.0" rx="8" fill="#dbe8f8" stroke="#1f4e9c" stroke-width="2"/>
<text x="220.0" y="210.0" font-size="32" text-anchor="middle" fill="#1a1a1a" font-weight="normal">三</text>
<text x="220.0" y="246.0" font-size="14" text-anchor="middle" fill="#1f4e9c" font-weight="bold">sān · ตัวเลข</text>
<rect x="310.0" y="170.0" width="140.0" height="56.0" rx="8" fill="#fbf0c0" stroke="#7a5a00" stroke-width="2"/>
<text x="380.0" y="210.0" font-size="32" text-anchor="middle" fill="#1a1a1a" font-weight="normal">本</text>
<text x="380.0" y="246.0" font-size="14" text-anchor="middle" fill="#7a5a00" font-weight="bold">běn · ลักษณนาม</text>
<rect x="470.0" y="170.0" width="140.0" height="56.0" rx="8" fill="#dcefd6" stroke="#2a6a2a" stroke-width="2"/>
<text x="540.0" y="210.0" font-size="32" text-anchor="middle" fill="#1a1a1a" font-weight="normal">书</text>
<text x="540.0" y="246.0" font-size="14" text-anchor="middle" fill="#2a6a2a" font-weight="bold">shū · คำนาม</text>
<text x="75.0" y="96.0" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="bold">ไทย</text>
<text x="75.0" y="206.0" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="bold">จีน</text>
<text x="350.0" y="284.0" font-size="16" text-anchor="middle" fill="#666" font-weight="normal">ภาษาจีน: ตัวเลข + ลักษณนาม + คำนาม (คำนามอยู่ท้ายสุด)</text>
