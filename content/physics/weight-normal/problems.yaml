    solution: "แรงโน้มถ่วงของโลกดึงทุกวัตถุเข้าหาศูนย์กลางโลก น้ำหนักของเพื่อนจึงชี้เข้าหาศูนย์กลางโลกเช่นกัน ซึ่งเป็นทิศตรงข้ามกับน้ำหนักของเราเมื่อมองจากอวกาศ"
