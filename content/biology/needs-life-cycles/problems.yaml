  - id: biology.animals.needs-life-cycles.p015
    topics: [biology.animals.needs-life-cycles]
    difficulty: 4
    type: numeric
    stem: "ต้นข้าววัดส่วนสูงของน้องชายทุกปี อายุ 6 ปีสูง 115 เซนติเมตร อายุ 9 ปีสูง 133 เซนติเมตร โดยเฉลี่ยน้องชายสูงขึ้นปีละกี่เซนติเมตร"
    answer: { value: 6, unit: เซนติเมตร }
    hints:
      - "หาก่อนว่าสูงขึ้นทั้งหมดเท่าไร"
      - "จาก 6 ปีถึง 9 ปีผ่านไปกี่ปี แล้วนำส่วนสูงที่เพิ่มหารด้วยจำนวนปี"
    misconceptions:
      - { match: 18, feedback: "นี่คือส่วนสูงที่เพิ่มทั้งหมดใน 3 ปี ต้องหารด้วย 3 เพื่อหาค่าต่อปี" }
      - { match: 4.5, feedback: "หารด้วย 4 แต่จากอายุ 6 ถึง 9 ปีผ่านไป 3 ปี ไม่ใช่ 4 ปี" }
    solution: "สูงขึ้น $133 - 115 = 18$ เซนติเมตร ใน $9 - 6 = 3$ ปี เฉลี่ย $\\frac{18}{3} = 6$ เซนติเมตรต่อปี"
