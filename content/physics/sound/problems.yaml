    ai_assisted: true

  - id: phy.snd.p018
    topics: [physics.waves.sound]
    difficulty: 4
    type: numeric
    stem: "ห่างจากลำโพงในงานวัด $5\\ \\mathrm{m}$ วัดระดับความเข้มเสียงได้ $90\\ \\mathrm{dB}$ ถ้าเสียงกระจายออกทุกทิศเท่ากันและไม่มีการสะท้อน ที่ระยะ $50\\ \\mathrm{m}$ ระดับความเข้มเสียงเป็นกี่เดซิเบล (ตอบเป็นตัวเลขในหน่วย dB)"
    answer: { value: 70, tolerance: 0.2, unit: dB }
    hints:
      - "ระยะเพิ่มขึ้น 10 เท่า ความเข้มลดลงกี่เท่า"
      - "ความเข้มแปรผกผันกับ $r^2$ จึงลดลง $10^2 = 100$ เท่า และทุก ๆ 10 เท่าคือ $10\\ \\mathrm{dB}$"
    misconceptions:
      - { match: 80, feedback: "ดูเหมือนคิดว่าความเข้มลดลงเพียง 10 เท่าตามระยะ แต่ความเข้มแปรผกผันกับ **กำลังสอง** ของระยะ จึงลดลง 100 เท่า" }
      - { match: 9, feedback: "เดซิเบลไม่ได้แปรผกผันกับระยะตรง ๆ ต้องเปลี่ยนเป็นอัตราส่วนความเข้มก่อน แล้วจึงแปลงเป็นเดซิเบล" }
    solution: "$\\dfrac{I_2}{I_1} = \\left(\\dfrac{5}{50}\\right)^2 = \\dfrac{1}{100}$ ระดับลดลง $10\\log 100 = 20\\ \\mathrm{dB}$ จึงเหลือ $90 - 20 = 70\\ \\mathrm{dB}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.snd.p019
    topics: [physics.waves.sound]
    difficulty: 4
    type: numeric
    stem: "ลำโพงส่งกำลังเสียง $10\\ \\mathrm{W}$ ออกไปทุกทิศเท่ากัน ความเข้มเสียงที่ระยะ $4\\ \\mathrm{m}$ จากลำโพงเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย W/m² ทศนิยม 3 ตำแหน่ง)"
    answer: { value: 0.050, tolerance: 0.001, unit: W/m² }
    hints:
      - "พลังงานเสียงกระจายบนผิวทรงกลมรัศมี $4\\ \\mathrm{m}$"
      - "ใช้ $I = \\dfrac{P}{4\\pi r^2}$"
    misconceptions:
      - { match: 0.625, feedback: "ดูเหมือนหารด้วย $r^2$ อย่างเดียว พื้นที่ผิวทรงกลมคือ $4\\pi r^2$ ต้องคูณ $4\\pi$ ด้วย" }
      - { match: 0.199, feedback: "ดูเหมือนใช้ $4\\pi r$ ลืมยกกำลังสองของรัศมี" }
    solution: "$I = \\dfrac{10}{4\\pi(4)^2} = \\dfrac{10}{201.1} \\approx 0.050\\ \\mathrm{W/m^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.snd.p020
    topics: [physics.waves.sound]
    difficulty: 5
    type: numeric
    stem: "ในโรงงาน เครื่องจักรเครื่องหนึ่งทำให้เกิดระดับความเข้มเสียง $80\\ \\mathrm{dB}$ ที่ตำแหน่งของคนงาน ถ้าเปิดเครื่องจักรแบบเดียวกันอีกเครื่องที่ระยะเท่ากัน ระดับความเข้มเสียงรวมเป็นกี่เดซิเบล (ตอบเป็นตัวเลขในหน่วย dB ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 83.0, tolerance: 0.1, unit: dB }
    hints:
      - "เสียงจากสองเครื่องรวมกันที่ **ความเข้ม** ไม่ใช่ที่เดซิเบล"
      - "ความเข้มรวมเป็น 2 เท่า ระดับเพิ่มขึ้น $10\\log 2$"
    misconceptions:
      - { match: 160, feedback: "เดซิเบลบวกกันตรง ๆ ไม่ได้ เพราะเป็นสเกลลอการิทึม ต้องรวมความเข้มก่อน" }
      - { match: 90, feedback: "การเพิ่ม $10\\ \\mathrm{dB}$ หมายถึงความเข้มเพิ่ม 10 เท่า แต่สองเครื่องทำให้ความเข้มเพิ่มแค่ 2 เท่า" }
    solution: "ความเข้มของเครื่องเดียว $I_1 = 10^{-12} \\times 10^{8} = 10^{-4}\\ \\mathrm{W/m^2}$ สองเครื่องรวมเป็น $2 \\times 10^{-4}$ ระดับ $= 10\\log\\dfrac{2 \\times 10^{-4}}{10^{-12}} = 80 + 10\\log 2 \\approx 80 + 3.0 = 83.0\\ \\mathrm{dB}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.snd.p021
    topics: [physics.waves.sound]
