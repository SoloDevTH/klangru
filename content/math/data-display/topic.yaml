id: math.stats.data-display
subject: math
title: { th: การนำเสนอข้อมูล, en: Displaying data }
summary: แยกชนิดข้อมูล สร้างตารางความถี่และตารางสองทาง อ่านแผนภูมิรูปภาพ แท่ง วงกลม แผนภาพจุด ต้นใบ ฮิสโทแกรม กราฟเส้น และตีความโดยไม่ถูกหลอก
difficulty: 2
minutes: 30
prerequisites: [math.number.decimals]
encompasses:
  - { id: math.number.decimals, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - { type: check, problem: math.data.p014, prompt: "อ่านสเกลของแกนตั้งให้ดีก่อนตอบ" }
  - type: figure
    src: stem-leaf-example.svg
    alt: "แผนภาพต้นใบจำนวนวันที่ฝนตกในแต่ละเดือน ต้น 1 มีใบ 5, 8 ต้น 2 มีใบ 0, 3, 3, 7, 9 ต้น 3 มีใบ 1, 2, 6 ต้น 4 มีใบ 4 หมายเหตุ 2 | 7 หมายถึง 27 วัน ข้อมูลทั้งหมด 11 ค่า"
    caption: "อ่านได้ว่าข้อมูลคือ 15, 18, 20, 23, 23, 27, 29, 31, 32, 36, 44 ข้อมูลเรียงจากน้อยไปมากอยู่แล้ว"
  - type: figure
    src: line-graph-icecream.svg
    alt: "กราฟเส้นยอดขายไอศกรีมรายเดือน แกนนอนคือเดือนมกราคมถึงธันวาคม แกนตั้งคือจำนวนถ้วย 0 ถึง 600 ยอดขายเพิ่มจาก 260 ถ้วยในมกราคม ขึ้นสูงสุด 560 ถ้วยในเมษายน แล้วลดลงเรื่อย ๆ เหลือ 220 ถ้วยในธันวาคม"
    caption: "เส้นชันขึ้นมากที่สุดช่วงกุมภาพันธ์ถึงมีนาคม (เพิ่ม 120 ถ้วย) และชันลงมากที่สุดช่วงพฤษภาคมถึงมิถุนายน (ลด 130 ถ้วย)"
  - type: worked-example
    title: อ่านแผนภาพต้นใบ
    problem: "จากแผนภาพต้นใบของจำนวนวันที่ฝนตก จงหาพิสัย มัธยฐาน และฐานนิยม"
    steps:
      - text: "อ่านข้อมูลออกมา: 15, 18, 20, 23, 23, 27, 29, 31, 32, 36, 44 รวม 11 ค่า"
        why: "ต้นคือหลักสิบ ใบคือหลักหน่วย ตามคำอธิบาย 2 | 7 = 27"
      - text: "พิสัย $= 44 - 15 = 29$ วัน"
      - text: "มัธยฐานคือตัวที่ $\\tfrac{11 + 1}{2} = 6$ คือ 27 วัน"
      - text: "ฐานนิยมคือ 23 วัน (ใบ 3 ซ้ำสองครั้งในต้น 2)"
    answer: "พิสัย 29 วัน มัธยฐาน 27 วัน ฐานนิยม 23 วัน"
  - type: worked-example
    title: ความถี่สัมพัทธ์แบบมีเงื่อนไขในตารางสองทาง
    problem: "จากตารางสองทางในบทเรียน (ชาย 24 คน ชอบกีฬา 18 คน, หญิง 26 คน ชอบกีฬา 12 คน) นักเรียนชายหรือนักเรียนหญิงมีแนวโน้มชอบกีฬามากกว่ากัน"
    steps:
      - text: "จำนวนดิบ 18 กับ 12 เทียบตรง ๆ ไม่ได้ เพราะสองกลุ่มมีจำนวนคนต่างกัน"
      - text: "ในบรรดานักเรียนชาย: $\\tfrac{18}{24} = 75\\%$ ชอบกีฬา"
        why: "ตัวหารคือจำนวนในกลุ่มที่สนใจ (แถวของชาย) ไม่ใช่ 50 คนทั้งหมด"
      - text: "ในบรรดานักเรียนหญิง: $\\tfrac{12}{26} \\approx 46.2\\%$ ชอบกีฬา"
      - text: "75% มากกว่า 46.2% อย่างชัดเจน ในกลุ่มนี้นักเรียนชายมีแนวโน้มชอบกีฬามากกว่า"
        why: "นี่เป็นข้อสรุปเฉพาะกลุ่มตัวอย่าง 50 คน และบอกความสัมพันธ์ ไม่ได้บอกสาเหตุ"
    answer: "นักเรียนชาย (75% เทียบกับประมาณ 46%)"
  - { type: check, problem: math.data.p016, prompt: "ลองหามัธยฐานจากแผนภาพต้นใบอีกชุด" }
  - type: simulation
    title: ดูฮิสโทแกรมก่อตัวทีละลูก (PhET Plinko Probability)
    url: https://phet.colorado.edu/en/simulations/plinko-probability
    provider: phet
    note: ปล่อยลูกบอลทีละลูกแล้วตามด้วยทีละหลายลูก สังเกตว่าความสูงของแต่ละแท่งคือความถี่ของช่องนั้น แท่งวางชิดกันแบบฮิสโทแกรม และรูปร่างโดยรวมชัดขึ้นเมื่อมีข้อมูลมากขึ้น
glossary:
  - { term: ข้อมูลเชิงคุณภาพ, definition: "ข้อมูลที่บอกเป็นกลุ่มหรือประเภท เช่น สีที่ชอบ จังหวัดที่เกิด" }
  - { term: ข้อมูลเชิงปริมาณ, definition: "ข้อมูลที่เป็นตัวเลขจากการนับ (ไม่ต่อเนื่อง) หรือการวัด (ต่อเนื่อง)" }
  - { term: ความถี่, definition: "จำนวนครั้งที่ค่าหรือกลุ่มหนึ่งปรากฏในข้อมูล" }
  - { term: ความถี่สัมพัทธ์, definition: "ความถี่หารด้วยจำนวนข้อมูลทั้งหมด มักเขียนเป็นร้อยละ" }
  - { term: อันตรภาคชั้น, definition: "ช่วงของค่าที่ใช้จัดกลุ่มข้อมูลเชิงปริมาณ เช่น 150–159 เซนติเมตร" }
  - { term: ฮิสโทแกรม, definition: "แผนภูมิแท่งที่แท่งวางชิดกัน ใช้แสดงความถี่ของข้อมูลต่อเนื่องที่จัดเป็นอันตรภาคชั้น" }
flashcards:
  - { front: "มุมของส่วนหนึ่งในแผนภูมิวงกลมคำนวณอย่างไร", back: "$\\dfrac{f}{N} \\times 360^\\circ$ เมื่อ $f$ คือความถี่ของส่วนนั้น และ $N$ คือจำนวนทั้งหมด" }
  - { front: "ฮิสโทแกรมต่างจากแผนภูมิแท่งอย่างไร", back: "ฮิสโทแกรมใช้กับข้อมูลต่อเนื่องที่จัดเป็นอันตรภาคชั้น แท่งชิดกัน ส่วนแผนภูมิแท่งใช้เปรียบเทียบกลุ่ม แท่งแยกห่างกัน" }
  - { front: "ส่วนสูงของนักเรียนเป็นข้อมูลชนิดใด", back: "ข้อมูลเชิงปริมาณแบบต่อเนื่อง เพราะได้จากการวัดและมีทศนิยมได้" }
  - { front: "ก่อนเชื่อแผนภูมิแท่ง ควรตรวจอะไร", back: "แกนตั้งเริ่มที่ 0 หรือไม่ สเกลเท่ากันทุกช่องหรือไม่ และหน่วยคืออะไร" }
