    choices:
      - { id: a, text: "ปริมาณอาหารเป็นปัจจัยจำกัดในการทดลองนี้ อาหารมากขึ้นทำให้ความสามารถในการรองรับของตู้สูงขึ้น", correct: true }
      - { id: b, text: "หอยเชอรี่เพิ่มแบบเอ็กซ์โพเนนเชียลไม่สิ้นสุดในทุกตู้", feedback: "จำนวนหอยคงที่ในทุกตู้ แสดงว่าถึงขีดจำกัดแล้ว" }
      - { id: c, text: "ขนาดตู้เป็นปัจจัยเดียวที่กำหนดจำนวนหอย", feedback: "ตู้มีขนาดเท่ากัน แต่จำนวนหอยต่างกันตามอาหาร" }
      - { id: d, text: "อาหารไม่มีผล เพราะทุกตู้ยังมีหอยรอด", feedback: "จำนวนที่คงที่ต่างกันเกือบ 4 เท่า ตามอาหารที่ต่างกัน 4 เท่า" }
    hints:
      - "ตัวแปรที่เปลี่ยนในการทดลองคืออะไร"
      - "จำนวนที่คงที่ในแต่ละตู้คืออะไรของตู้นั้น"
    solution: "ตู้มีขนาดเท่ากัน ต่างกันที่อาหาร จำนวนหอยที่คงที่ (K) เพิ่มขึ้นตามปริมาณอาหาร จึงสนับสนุนว่าทรัพยากรที่มีกำหนดขนาดประชากรที่สภาพแวดล้อมรองรับได้"
