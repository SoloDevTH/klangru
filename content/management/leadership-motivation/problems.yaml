problems:
  - id: management.org.leadership-motivation.p001
    topics: [management.org.leadership-motivation]
    difficulty: 1
    type: order
    stem: "เรียงลำดับขั้นความต้องการของมาสโลว์จากขั้นพื้นฐานที่สุดไปถึงขั้นสูงสุด"
    items:
      - "ความต้องการทางกาย"
      - "ความมั่นคงปลอดภัย"
      - "ความรักและการยอมรับในกลุ่ม"
      - "การได้รับการยกย่อง"
      - "ความสำเร็จสมหวังในชีวิต"
    hints:
      - "ขั้นล่างสุดคือสิ่งที่ร่างกายต้องใช้มีชีวิตอยู่"
      - "ขั้นสูงสุดคือการได้ใช้ศักยภาพของตนเต็มที่"
    solution: "ทางกาย → ความมั่นคงปลอดภัย → ความรักและการยอมรับ → การยกย่อง → ความสำเร็จสมหวังในชีวิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.leadership-motivation.p002
    topics: [management.org.leadership-motivation]
    difficulty: 1
    type: mcq
    multiple: true
    stem: "ตามทฤษฎีสองปัจจัยของเฮิร์ซเบิร์ก ข้อใดเป็นปัจจัยจูงใจ (motivator) เลือกทุกข้อที่ถูก"
    choices:
      - { id: a, text: "ได้รับมอบหมายงานที่ท้าทายและรับผิดชอบโครงการเอง", correct: true }
      - { id: b, text: "ได้รับการยกย่องต่อหน้าเพื่อนร่วมงานเมื่อทำงานสำเร็จ", correct: true }
      - { id: c, text: "เงินเดือนและสวัสดิการ", feedback: "เป็นปัจจัยค้ำจุน ขาดแล้วไม่พอใจ แต่มีแล้วไม่ได้จูงใจให้ทุ่มเทระยะยาว" }
      - { id: d, text: "ห้องทำงานมีเครื่องปรับอากาศ", feedback: "สภาพการทำงานเป็นปัจจัยค้ำจุน" }
      - { id: e, text: "นโยบายการลาที่ยุติธรรม", feedback: "นโยบายขององค์กรเป็นปัจจัยค้ำจุน" }
    hints:
      - "ปัจจัยจูงใจเกี่ยวกับตัวงานและความสำเร็จ"
      - "ปัจจัยค้ำจุนเกี่ยวกับสภาพแวดล้อมรอบงาน"
    solution: "งานที่ท้าทาย ความรับผิดชอบ และการยกย่องเป็นปัจจัยจูงใจ ส่วนเงินเดือน สภาพการทำงาน และนโยบายเป็นปัจจัยค้ำจุน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.leadership-motivation.p003
    topics: [management.org.leadership-motivation]
    difficulty: 1
    type: match
    stem: "จับคู่ขั้นพัฒนาการของทีมกับพฤติกรรมที่พบ"
    pairs:
      - { left: "ก่อตัว", right: "สมาชิกสุภาพ เกรงใจกัน ยังไม่แน่ใจว่าใครทำอะไร" }
      - { left: "ปะทะ", right: "สมาชิกเถียงกันเรื่องวิธีทำงานและบทบาท" }
      - { left: "ปรับตัว", right: "ทีมตกลงกติกาการประชุมได้และเริ่มไว้ใจกัน" }
      - { left: "ทำงานเต็มที่", right: "ทีมแก้ปัญหาได้เองโดยหัวหน้าไม่ต้องคุมใกล้ชิด" }
      - { left: "สลายตัว", right: "ทีมสรุปบทเรียนและส่งมอบงานเมื่อโครงการจบ" }
    hints:
      - "ความขัดแย้งเกิดก่อนการตกลงกติกา"
      - "ขั้นสุดท้ายเกิดเมื่องานจบ"
    solution: "ก่อตัว: เกรงใจ · ปะทะ: ขัดแย้ง · ปรับตัว: ตกลงกติกา · ทำงานเต็มที่: ทำงานได้เอง · สลายตัว: ปิดงาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.leadership-motivation.p004
    topics: [management.org.leadership-motivation]
    difficulty: 2
    type: numeric
    stem: "ตามทฤษฎีความคาดหวัง พนักงานขายคนหนึ่งเชื่อว่าถ้าพยายามจะทำยอดได้ตามเป้า (E = 0.8) ถ้าทำได้จะได้รางวัลจริง (I = 0.5) และอยากได้รางวัลนั้น (V = 0.9) แรงจูงใจ M เป็นเท่าใด (ตอบเป็นทศนิยม)"
    answer: { value: 0.36, tolerance: 0.005 }
    hints:
      - "$M = E \\times I \\times V$"
      - "$0.8 \\times 0.5 \\times 0.9$"
    misconceptions:
      - { match: 2.2, feedback: "ต้องคูณ ไม่ใช่บวก" }
      - { match: 0.733, feedback: "นั่นคือค่าเฉลี่ยของสามตัว ทฤษฎีนี้ใช้การคูณ" }
    solution: "$M = 0.8 \\times 0.5 \\times 0.9 = 0.36$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.leadership-motivation.p005
    topics: [management.org.leadership-motivation]
    difficulty: 2
    type: mcq
    stem: "เจ้าหน้าที่จบใหม่ในงานทะเบียนราษฎรกระตือรือร้นอยากเรียนรู้มาก แต่ยังไม่เคยใช้ระบบทะเบียนเลย หัวหน้าควรใช้แบบการนำใดตามภาวะผู้นำตามสถานการณ์"
    choices:
      - { id: a, text: "S2 สอนงาน: อธิบายวิธีและเหตุผล ชี้แนะใกล้ชิด และให้กำลังใจ", correct: true }
      - { id: b, text: "S4 มอบหมาย: ให้ทำเองเลยเพราะมีความตั้งใจสูง", feedback: "ความตั้งใจสูงแต่ยังไม่มีทักษะ ถ้าปล่อยเองจะผิดพลาดและเสียกำลังใจ" }
      - { id: c, text: "S3 ร่วมมือ: ฟังและให้ร่วมตัดสินใจโดยไม่ต้องสอน", feedback: "S3 เหมาะกับคนที่ทำได้แล้วแต่ยังไม่มั่นใจ คนนี้ยังทำไม่ได้" }
      - { id: d, text: "ปล่อยตามสบาย ให้เรียนรู้จากเพื่อนร่วมงานเอง", feedback: "ผู้ตามที่ยังไม่พร้อมต้องการทิศทางชัดเจนจากหัวหน้า" }
    hints:
      - "ผู้ตามคนนี้ทำได้หรือยัง และอยากทำหรือไม่"
      - "ยังทำไม่ได้แต่อยากทำคือ R2"
    solution: "ยังทำไม่ได้แต่เต็มใจคือความพร้อม R2 เหมาะกับ S2 สอนงาน ที่ให้ทั้งการชี้แนะงานและกำลังใจ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.leadership-motivation.p006
    topics: [management.org.leadership-motivation]
    difficulty: 2
    type: mcq
    stem: "พนักงานโรงงานแห่งหนึ่งได้ข่าวว่าบริษัทจะลดคน ทุกคนกังวลว่าจะตกงาน ผู้จัดการจัดประกวดตำแหน่ง \"พนักงานดีเด่นประจำเดือน\" แต่ไม่มีใครสนใจ ตามทฤษฎีของมาสโลว์ เป็นเพราะอะไร"
    choices:
      - { id: a, text: "ความต้องการขั้นความมั่นคงปลอดภัยยังไม่ได้รับการตอบสนอง ขั้นการยกย่องจึงยังไม่จูงใจ", correct: true }
      - { id: b, text: "พนักงานต้องการความสำเร็จสมหวังในชีวิตแล้ว", feedback: "ถ้ากังวลเรื่องตกงาน ความต้องการขั้นสูงสุดยังไม่ใช่สิ่งที่จูงใจ" }
      - { id: c, text: "การยกย่องเป็นปัจจัยค้ำจุน", feedback: "ตามเฮิร์ซเบิร์ก การยกย่องเป็นปัจจัยจูงใจ และคำถามนี้ถามตามมาสโลว์" }
      - { id: d, text: "พนักงานไม่มีความต้องการใดเลย", feedback: "ทุกคนมีความต้องการ ปัญหาคือขั้นที่ยังขาดอยู่" }
    hints:
      - "พนักงานกำลังกังวลเรื่องใด"
      - "ความกังวลเรื่องตกงานอยู่ในขั้นใด"
    solution: "ความกลัวตกงานคือความต้องการขั้นความมั่นคงที่ยังไม่ได้รับการตอบสนอง รางวัลขั้นการยกย่องจึงไม่จูงใจ ควรสื่อสารเรื่องความมั่นคงให้ชัดก่อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.leadership-motivation.p007
    topics: [management.org.leadership-motivation]
    difficulty: 3
    type: numeric
    stem: "ตามทฤษฎีความคาดหวัง ถ้าความเป็นเครื่องมือ I = 0.6 และคุณค่า V = 1.0 ความคาดหวัง E ต้องเป็นเท่าใด แรงจูงใจ M จึงเท่ากับ 0.48 (ตอบเป็นทศนิยม)"
    answer: { value: 0.8, tolerance: 0.005 }
    hints:
      - "$M = E \\times I \\times V$ จึงได้ $E = \\dfrac{M}{I \\times V}$"
      - "$\\dfrac{0.48}{0.6 \\times 1.0}$"
    misconceptions:
      - { match: 0.288, feedback: "นั่นคือ $0.48 \\times 0.6$ ต้องหาร ไม่ใช่คูณ" }
      - { match: 1.25, feedback: "นั่นคือ $0.6 / 0.48$ หารกลับด้าน" }
    solution: "$E = 0.48 / (0.6 \\times 1.0) = 0.8$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.leadership-motivation.p008
    topics: [management.org.leadership-motivation]
    difficulty: 3
    type: mcq
    stem: "บริษัทแห่งหนึ่งขึ้นเงินเดือนพนักงานทุกคน 8% ข้อร้องเรียนเรื่องค่าตอบแทนลดลง แต่ผลงานและความกระตือรือร้นไม่ดีขึ้น ทฤษฎีของเฮิร์ซเบิร์กอธิบายว่าอย่างไร"
    choices:
      - { id: a, text: "เงินเดือนเป็นปัจจัยค้ำจุน ลดความไม่พอใจได้ แต่ไม่ได้สร้างแรงจูงใจ ต้องเพิ่มปัจจัยจูงใจ เช่น งานที่มีความหมายและการยอมรับ", correct: true }
      - { id: b, text: "ขึ้นเงินเดือนน้อยเกินไป ถ้าขึ้น 20% จะจูงใจได้แน่นอน", feedback: "ตามทฤษฎี ปัจจัยค้ำจุนไม่ว่าจะมากเท่าใดก็ไม่สร้างแรงจูงใจระยะยาว" }
      - { id: c, text: "เงินเดือนเป็นปัจจัยจูงใจ แต่พนักงานไม่รู้ตัว", feedback: "ในทฤษฎีของเฮิร์ซเบิร์ก เงินเดือนจัดเป็นปัจจัยค้ำจุน" }
      - { id: d, text: "ควรลดเงินเดือนกลับเพราะไม่ได้ผล", feedback: "การลดจะทำให้ไม่พอใจมากขึ้น เพราะปัจจัยค้ำจุนที่ขาดทำให้ไม่พอใจ" }
    hints:
      - "เงินเดือนอยู่ในกลุ่มปัจจัยใด"
      - "ปัจจัยกลุ่มนั้นมีผลต่อความไม่พอใจหรือแรงจูงใจ"
    solution: "ข้อร้องเรียนลดลงเพราะปัจจัยค้ำจุนดีขึ้น แต่แรงจูงใจต้องมาจากปัจจัยจูงใจ เช่น ความสำเร็จ การยอมรับ ความรับผิดชอบ และความก้าวหน้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.leadership-motivation.p009
    topics: [management.org.leadership-motivation]
    difficulty: 3
    type: mcq
    stem: "ในการประชุมทีมลดการติดเชื้อในโรงพยาบาล หัวหน้าแพทย์พูดเกือบตลอดเวลา พยาบาลรุ่นน้องไม่กล้าเสนอ ผู้อำนวยความสะดวกควรทำอย่างไร"
    choices:
      - { id: a, text: "เปลี่ยนวิธีให้ทุกคนเขียนความคิดเองก่อนแล้วเสนอทีละคน และกำหนดเวลาพูดอย่างทั่วถึง", correct: true }
      - { id: b, text: "สรุปตามความเห็นของหัวหน้าแพทย์เพราะมีประสบการณ์มากที่สุด", feedback: "ผู้อำนวยความสะดวกต้องเป็นกลางต่อเนื้อหาและดูแลให้ทุกคนมีส่วนร่วม" }
      - { id: c, text: "เสนอคำตอบที่ตนคิดว่าดีที่สุดเพื่อยุติการประชุม", feedback: "ผู้อำนวยความสะดวกดูแลกระบวนการ ไม่ตัดสินเนื้อหาแทนทีม" }
      - { id: d, text: "ยกเลิกการประชุมและให้หัวหน้าแพทย์ตัดสินใจคนเดียว", feedback: "เสียประโยชน์ของความคิดจากหลายวิชาชีพ ซึ่งเป็นเหตุผลที่ตั้งทีม" }
    hints:
      - "บทบาทผู้อำนวยความสะดวกคือดูแลกระบวนการให้ทุกคนมีส่วนร่วม"
      - "มีเทคนิคใดที่ลดอิทธิพลของคนที่พูดมากหรือตำแหน่งสูง"
    solution: "ผู้อำนวยความสะดวกเลือกเทคนิคที่ให้ทุกคนมีเสียงเท่ากัน เช่น เทคนิคกลุ่มระบุ (เขียนก่อน เสนอทีละคน ให้คะแนนลับ) โดยไม่ตัดสินเนื้อหาแทนทีม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.leadership-motivation.p010
    topics: [management.org.leadership-motivation]
    difficulty: 3
    type: numeric
    stem: "ทีมปรับปรุงคุณภาพของโรงงาน 5 คน ใช้เทคนิคกลุ่มระบุจัดอันดับสาเหตุของเสีย 4 ข้อ (อันดับ 1 ได้ 4 คะแนน อันดับ 4 ได้ 1 คะแนน) คะแนนที่สาเหตุ A ได้จากสมาชิกแต่ละคนคือ 4, 3, 4, 2, 4 และสาเหตุ B ได้ 3, 4, 2, 4, 3 สาเหตุ A ได้คะแนนรวมเท่าใด"
    answer: { value: 17, unit: คะแนน }
    hints:
      - "รวมคะแนนที่สมาชิกทุกคนให้สาเหตุ A"
      - "$4 + 3 + 4 + 2 + 4$"
    misconceptions:
      - { match: 16, feedback: "16 คือคะแนนรวมของสาเหตุ B โจทย์ถามสาเหตุ A" }
      - { match: 3, feedback: "นั่นคือจำนวนคนที่ให้อันดับ 1 การรวมคะแนนต้องใช้คะแนนจากทุกคน" }
    solution: "$4 + 3 + 4 + 2 + 4 = 17$ คะแนน (สาเหตุ B ได้ 16) สาเหตุ A มาเป็นอันดับแรกแต่ห่างกันน้อย ทีมควรเก็บข้อมูลยืนยันก่อนตัดสิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.leadership-motivation.p011
    topics: [management.org.leadership-motivation]
    difficulty: 3
    type: match
    stem: "จับคู่บทบาทในทีมปรับปรุงคุณภาพกับหน้าที่"
    pairs:
      - { left: "ผู้สนับสนุน (sponsor)", right: "ผู้บริหารที่อนุมัติทรัพยากรและช่วยขจัดอุปสรรคข้ามหน่วยงาน" }
      - { left: "หัวหน้าทีม", right: "รับผิดชอบผลงานของทีมและนำการวิเคราะห์ปัญหา" }
      - { left: "ผู้อำนวยความสะดวก", right: "ดูแลกระบวนการประชุมให้ทุกคนมีส่วนร่วม โดยเป็นกลางต่อเนื้อหา" }
      - { left: "ผู้บันทึก", right: "จดความคิด ข้อตกลง และงานที่มอบหมายให้ทุกคนเห็น" }
    hints:
      - "ใครมีอำนาจให้ทรัพยากร"
      - "ใครดูแลกระบวนการ ใครดูแลผลงาน"
    solution: "ผู้สนับสนุนให้ทรัพยากรและขจัดอุปสรรค หัวหน้าทีมรับผิดชอบผลงาน ผู้อำนวยความสะดวกดูแลกระบวนการ และผู้บันทึกจดข้อตกลง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.leadership-motivation.p012
    topics: [management.org.leadership-motivation]
    difficulty: 4
    type: mcq
    stem: "เภสัชกรอาวุโสทำงานจ่ายยามา 10 ปีและทำได้ดีมาก ได้รับมอบหมายให้สอนนักศึกษาฝึกงานเป็นครั้งแรก เธอบอกว่า \"กลัวสอนไม่รู้เรื่อง\" ทั้งที่ความรู้ครบ หัวหน้าควรใช้แบบการนำใดในงานนี้"
    choices:
      - { id: a, text: "S3 ร่วมมือ: รับฟังความกังวล ให้กำลังใจ และร่วมวางแผนการสอนกับเธอ", correct: true }
      - { id: b, text: "S1 สั่งการ: กำหนดขั้นตอนการสอนให้ละเอียดทุกข้อ", feedback: "เธอมีความรู้ครบแล้ว การสั่งละเอียดไม่ตอบปัญหาความมั่นใจ" }
      - { id: c, text: "S4 มอบหมาย: ปล่อยให้สอนเองเลยเพราะเก่งอยู่แล้ว", feedback: "ความสามารถสูงแต่ความมั่นใจต่ำในงานใหม่ ยังต้องการการสนับสนุน" }
      - { id: d, text: "ไม่ให้สอน เพราะไม่มั่นใจ", feedback: "เสียโอกาสพัฒนาคนที่มีความสามารถ ปัญหาคือความมั่นใจ ซึ่งแก้ได้ด้วยการสนับสนุน" }
    hints:
      - "เธอทำได้หรือไม่ และมั่นใจหรือไม่ในงานนี้"
      - "ทำได้แต่ไม่มั่นใจคือ R3"
    solution: "ความรู้ครบแต่ไม่มั่นใจในงานใหม่คือ R3 เหมาะกับ S3 ที่เน้นพฤติกรรมสนับสนุนมากและสั่งงานน้อย เมื่อมั่นใจแล้วค่อยเปลี่ยนเป็น S4"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.leadership-motivation.p013
    topics: [management.org.leadership-motivation]
    difficulty: 4
    type: match
    stem: "จับคู่พฤติกรรมของผู้นำกับแบบภาวะผู้นำ"
    pairs:
      - { left: "ตกลงเป้ายอดขายรายเดือน ถ้าถึงเป้าจ่ายค่าคอมมิชชัน ถ้าไม่ถึงตักเตือน", right: "ผู้นำแบบแลกเปลี่ยน" }
      - { left: "เล่าภาพอนาคตของโรงพยาบาลที่ไม่มีผู้ป่วยต้องรอเกินชั่วโมง และพัฒนาลูกทีมให้คิดวิธีใหม่เอง", right: "ผู้นำแบบเปลี่ยนสภาพ" }
      - { left: "ในเหตุไฟไหม้ สั่งอพยพทันทีตามแผนโดยไม่ขอความเห็น", right: "ผู้นำแบบเผด็จการ" }
      - { left: "ให้ทีมลงมติเลือกวันจัดกิจกรรมจิตอาสาร่วมกัน", right: "ผู้นำแบบประชาธิปไตย" }
    hints:
      - "แลกเปลี่ยน = รางวัลแลกกับผลงานตามข้อตกลง"
      - "เปลี่ยนสภาพ = วิสัยทัศน์และแรงบันดาลใจ"
    solution: "ค่าคอมมิชชันแลกยอดขายคือแบบแลกเปลี่ยน วิสัยทัศน์และการพัฒนาลูกทีมคือแบบเปลี่ยนสภาพ การสั่งในเหตุฉุกเฉินคือแบบเผด็จการ และการลงมติร่วมกันคือแบบประชาธิปไตย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.leadership-motivation.p014
    topics: [management.org.leadership-motivation]
    difficulty: 4
    type: mcq
    stem: "ทีมปรับปรุงบริการของเทศบาล (สมมติ) ประชุมมาสามครั้ง สมาชิกเริ่มโต้เถียงกันว่าใครควรรับผิดชอบงานไหนและควรเริ่มจากปัญหาใด หัวหน้าทีมกังวลว่าทีมล้มเหลว ข้อใดตีความและตอบสนองได้ดีที่สุด"
    choices:
      - { id: a, text: "ทีมอยู่ในขั้นปะทะซึ่งเป็นเรื่องปกติ ควรช่วยตกลงบทบาท เป้าหมาย และกติกาการประชุมให้ชัด เพื่อเข้าสู่ขั้นปรับตัว", correct: true }
      - { id: b, text: "ทีมล้มเหลว ควรยุบทีมแล้วตั้งใหม่", feedback: "ทีมใหม่ก็จะผ่านขั้นปะทะเช่นกัน ความขัดแย้งช่วงนี้เป็นส่วนหนึ่งของพัฒนาการ" }
      - { id: c, text: "ห้ามสมาชิกแสดงความเห็นต่างในที่ประชุม", feedback: "การกดความขัดแย้งไว้ทำให้ปัญหากลับมาภายหลัง และเสียความคิดที่หลากหลาย" }
      - { id: d, text: "ทีมอยู่ในขั้นทำงานเต็มที่แล้ว", feedback: "ขั้นทำงานเต็มที่ทีมทำงานได้ราบรื่น แต่ทีมนี้ยังไม่ตกลงบทบาท" }
    hints:
      - "ความขัดแย้งเรื่องบทบาทเกิดในขั้นใดของทักแมน"
      - "ขั้นถัดไปต้องการอะไรจึงจะเกิดได้"
    solution: "การโต้เถียงเรื่องบทบาทและทิศทางคือขั้นปะทะ ผู้นำควรช่วยทำข้อตกลงร่วม (บทบาท เป้าหมาย กติกา) เพื่อให้ทีมผ่านเข้าสู่ขั้นปรับตัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.leadership-motivation.p015
    topics: [management.org.leadership-motivation]
    difficulty: 5
    type: mcq
    stem: "โรงงานประกาศรางวัลทองคำสำหรับทีมที่ลดของเสียได้ 50% ในหนึ่งเดือน พนักงานชอบรางวัลมาก แต่ไม่มีทีมใดพยายาม เมื่อสอบถามพบว่า \"ลด 50% ในเดือนเดียวเป็นไปไม่ได้\" ตามทฤษฎีความคาดหวัง ควรแก้อย่างไร"
    choices:
      - { id: a, text: "ปรับเป้าให้ทำได้จริง เช่น ลดลงเป็นขั้น และให้การอบรมกับเครื่องมือที่จำเป็น เพื่อเพิ่มความคาดหวัง (E)", correct: true }
      - { id: b, text: "เพิ่มมูลค่าของรางวัลเป็นสองเท่า", feedback: "คุณค่า (V) สูงอยู่แล้ว ปัญหาคือ E ใกล้ศูนย์ การคูณกับศูนย์ยังได้ศูนย์" }
      - { id: c, text: "ประกาศย้ำว่าจะให้รางวัลจริง", feedback: "นั่นเพิ่ม I แต่พนักงานไม่ได้สงสัยว่าจะได้รางวัลหรือไม่ เขาเชื่อว่าทำไม่ได้" }
      - { id: d, text: "ลงโทษทีมที่ไม่พยายาม", feedback: "ไม่แก้สาเหตุ คือความเชื่อว่าเป้าเป็นไปไม่ได้" }
    hints:
      - "ตัวใดใน E, I, V ที่ต่ำที่สุดในสถานการณ์นี้"
      - "\"เป็นไปไม่ได้\" คือความเชื่อเรื่องความพยายามกับผลงาน"
    solution: "พนักงานเชื่อว่าพยายามแล้วก็ไม่ถึงเป้า E จึงใกล้ศูนย์ ทำให้ M ใกล้ศูนย์แม้ V สูง ต้องเพิ่ม E ด้วยเป้าที่สมเหตุสมผล การฝึก และเครื่องมือ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.leadership-motivation.p016
    topics: [management.org.leadership-motivation]
    difficulty: 5
    type: numeric
    stem: "บริษัทพิจารณาสองโครงการจูงใจ โครงการ X: E = 0.9, I = 0.4, V = 0.8 โครงการ Y: E = 0.6, I = 0.9, V = 0.7 ตามทฤษฎีความคาดหวัง โครงการที่ให้แรงจูงใจสูงกว่ามีค่า M เท่าใด (ตอบเป็นทศนิยม 3 ตำแหน่ง)"
    answer: { value: 0.378, tolerance: 0.002 }
    hints:
      - "คำนวณ $M = E \\times I \\times V$ ของทั้งสองโครงการ"
      - "X: $0.9 \\times 0.4 \\times 0.8$ · Y: $0.6 \\times 0.9 \\times 0.7$"
    misconceptions:
      - { match: 0.288, feedback: "นั่นคือค่าของโครงการ X ซึ่งต่ำกว่า" }
      - { match: 2.2, feedback: "นั่นคือผลบวกของโครงการ Y ทฤษฎีใช้การคูณ" }
    solution: "X: $0.9 \\times 0.4 \\times 0.8 = 0.288$ · Y: $0.6 \\times 0.9 \\times 0.7 = 0.378$ โครงการ Y สูงกว่า แม้ E จะต่ำกว่า เพราะ I ของ X ต่ำมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.leadership-motivation.p017
    topics: [management.org.leadership-motivation]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "ตามแนวเกณฑ์รางวัลคุณภาพ ผู้นำระดับสูงของโรงพยาบาลควรทำสิ่งใดเพื่อกำหนดทิศทางและสร้างสภาพแวดล้อมให้องค์กรประสบความสำเร็จ เลือกทุกข้อที่ถูก"
    choices:
      - { id: a, text: "กำหนดวิสัยทัศน์และค่านิยม แล้วสื่อสารสองทางกับบุคลากรทุกระดับอย่างสม่ำเสมอ", correct: true }
      - { id: b, text: "ทำตัวเป็นแบบอย่างของค่านิยม เช่น ร่วมเดินตรวจความปลอดภัยของผู้ป่วยเอง", correct: true }
      - { id: c, text: "สร้างบรรยากาศที่บุคลากรกล้ารายงานความผิดพลาดโดยไม่ถูกตำหนิ เพื่อเรียนรู้และปรับปรุง", correct: true }
      - { id: d, text: "เก็บวิสัยทัศน์ไว้รู้เฉพาะผู้บริหาร เพื่อไม่ให้บุคลากรกังวล", feedback: "วิสัยทัศน์ที่ไม่สื่อสารไม่สามารถกำหนดทิศทางให้บุคลากรได้" }
      - { id: e, text: "ลงโทษทุกครั้งที่มีรายงานอุบัติการณ์", feedback: "ทำให้คนปิดบังปัญหา องค์กรจะไม่ได้เรียนรู้" }
    hints:
      - "ผู้นำต้องกำหนดทิศทาง สื่อสาร และเป็นแบบอย่าง"
      - "สภาพแวดล้อมที่ดีส่งเสริมการเรียนรู้และนวัตกรรม"
    solution: "ก ข ค ถูก ผู้นำต้องกำหนดและสื่อสารวิสัยทัศน์และค่านิยม ทำเป็นแบบอย่าง และสร้างวัฒนธรรมที่ปลอดภัยต่อการรายงานและเรียนรู้ ส่วนการปิดบังวิสัยทัศน์และการลงโทษทุกรายงานขัดกับแนวทางนี้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.org.leadership-motivation.p018
    topics: [management.org.leadership-motivation]
    difficulty: 2
    type: mcq
    stem: "ในห้องฉุกเฉินเมื่อผู้ป่วยหัวใจหยุดเต้น แพทย์หัวหน้าทีมกู้ชีพสั่งงานทีละคนอย่างชัดเจนทันทีโดยไม่เปิดให้อภิปราย แบบการนำนี้เหมาะสมหรือไม่"
    choices:
      - { id: a, text: "เหมาะ เพราะเป็นเหตุฉุกเฉินที่ต้องตัดสินใจเร็วและทีมฝึกตามขั้นตอนมาแล้ว", correct: true }
      - { id: b, text: "ไม่เหมาะ ควรประชุมให้ทุกคนลงมติก่อนทุกขั้นตอน", feedback: "การลงมติใช้เวลา ในเหตุฉุกเฉินเวลาเป็นชีวิตผู้ป่วย" }
      - { id: c, text: "ไม่เหมาะ แบบเผด็จการไม่ควรใช้ในทุกกรณี", feedback: "แบบการนำที่ดีขึ้นกับสถานการณ์ เหตุฉุกเฉินเป็นกรณีที่การสั่งการชัดเจนได้ผลดีที่สุด" }
      - { id: d, text: "เหมาะ และควรใช้แบบนี้ในการประชุมวางแผนประจำปีด้วย", feedback: "การวางแผนระยะยาวควรให้ทีมมีส่วนร่วม การสั่งการอย่างเดียวทำให้เสียความคิดและความผูกพัน" }
    hints:
      - "สถานการณ์นี้มีเวลาให้อภิปรายหรือไม่"
      - "แบบการนำที่เหมาะขึ้นกับสถานการณ์"
    solution: "ในเหตุฉุกเฉินที่ต้องการความเร็วและทีมรู้ขั้นตอนแล้ว การสั่งการชัดเจนเหมาะสม แต่ไม่ควรใช้แบบนี้กับงานที่ต้องการความคิดและความผูกพันของทีม"
    license: CC-BY-SA-4.0
    ai_assisted: true
