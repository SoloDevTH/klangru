      - "แนวดิ่ง: $t = \\sqrt{\\dfrac{2h}{g}}$"
      - "แนวราบ: $u = \\dfrac{x}{t}$"
    misconceptions:
      - { match: 7, feedback: "ดูเหมือนใช้ $t = \\dfrac{2h}{g} = 2\\ \\mathrm{s}$ โดยลืมถอดรากที่สอง เวลาจริงคือ $\\sqrt{2}\\ \\mathrm{s}$" }
      - { match: 14, feedback: "ดูเหมือนลืมเลข 2 ใน $h = \\tfrac{1}{2}gt^2$ จึงได้เวลา $1\\ \\mathrm{s}$ ซึ่งสั้นเกินไป" }
    solution: "แนวดิ่ง: $t = \\sqrt{\\dfrac{2(9.8\\ \\mathrm{m})}{9.8\\ \\mathrm{m/s^2}}} = \\sqrt{2}\\ \\mathrm{s} \\approx 1.414\\ \\mathrm{s}$ แนวราบ: $u = \\dfrac{14\\ \\mathrm{m}}{1.414\\ \\mathrm{s}} \\approx 9.90\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

