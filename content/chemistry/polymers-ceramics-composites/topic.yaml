id: chemistry.materials.polymers-ceramics-composites
subject: chemistry
title: { th: พอลิเมอร์ เซรามิก และวัสดุผสม, en: "Polymers, ceramics and composites" }
summary: สมบัติทางกายภาพและการใช้ประโยชน์ของพลาสติก ยาง เส้นใย เซรามิก และวัสดุผสม ความสัมพันธ์ระหว่างโครงสร้างกับสมบัติ และการใช้วัสดุอย่างประหยัดและคุ้มค่า
difficulty: 2.8
minutes: 35
prerequisites: [chemistry.matter.elements-compounds]
encompasses:
  - { id: chemistry.materials.material-properties, weight: 0.3 }
  - { id: chemistry.matter.elements-compounds, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: polymer-structures.svg
    alt: "แผนภาพ 3 ช่อง แต่ละช่องมีสายพอลิเมอร์สีต่าง ๆ 5 สายเป็นเส้นหยัก ช่องที่ 1 เทอร์โมพลาสติก: สายแยกกัน ไม่มีเส้นเชื่อม ข้อความว่าร้อนแล้วอ่อนตัว หลอมขึ้นรูปใหม่ได้ ช่องที่ 2 พลาสติกเทอร์โมเซต: มีเส้นดำแนวตั้งเชื่อมทุกสายถี่ ๆ เป็นร่างแห ข้อความว่าร้อนแล้วไม่อ่อนตัว แข็งถาวร ช่องที่ 3 ยางวัลคาไนซ์: มีสะพานกำมะถันสีเหลืองเชื่อมระหว่างสายเป็นบางจุดห่าง ๆ ข้อความว่ายืดได้และคืนรูป"
    caption: "การเชื่อมระหว่างสายพอลิเมอร์มากหรือน้อยทำให้สมบัติต่างกัน"
  - { type: check, problem: chemistry.materials.polymers-ceramics-composites.p005, prompt: "นึกถึงสายพอลิเมอร์ที่เชื่อมกันเป็นร่างแห" }
  - type: worked-example
    title: เลือกวัสดุทำกล่องข้าวที่เข้าไมโครเวฟได้
    problem: "ร้านอาหารต้องการกล่องใส่ข้าวผัดร้อนที่ลูกค้าอุ่นในไมโครเวฟได้ ตัวเลือกคือ กล่องโฟม (PS รหัส 6) กล่อง PP (รหัส 5) และกล่องอะลูมิเนียมฟอยล์ ควรเลือกแบบใด"
    steps:
      - text: "กำหนดสมบัติที่ต้องการ: ทนความร้อนของอาหารและไมโครเวฟ ไม่ปล่อยสารปนเปื้อน และไม่ทำให้เกิดประกายไฟ"
      - text: "โฟม PS อ่อนตัวที่อุณหภูมิไม่สูงมาก และไม่ควรใส่อาหารร้อนจัดหรืออาหารมัน"
      - text: "อะลูมิเนียมเป็นโลหะ สะท้อนไมโครเวฟและอาจเกิดประกายไฟในเตา"
        why: "โลหะมีอิเล็กตรอนอิสระที่เคลื่อนที่ตามคลื่นไมโครเวฟ"
      - text: "PP เป็นเทอร์โมพลาสติกที่ทนความร้อนสูงกว่า PS ใช้กับไมโครเวฟได้ (ดูสัญลักษณ์ไมโครเวฟบนกล่อง) และรีไซเคิลได้"
    answer: "เลือกกล่อง PP (รหัส 5) ที่มีสัญลักษณ์ใช้กับไมโครเวฟได้"
  - type: figure
    src: beam-reinforced.svg
    alt: "คานคอนกรีตสีเทาวางบนฐานรองสามเหลี่ยมสองข้าง มีลูกศรสีแดงกดลงตรงกลางคาน ครึ่งบนของคานมีลูกศรสีน้ำเงินชี้เข้าหากันเขียนว่าถูกกด ครึ่งล่างมีลูกศรสีส้มชี้ออกจากกันเขียนว่าถูกดึง มีเหล็กเส้นสีแดงเข้มวางตามยาวใกล้ขอบล่างของคาน ข้อความว่าคอนกรีตรับแรงกดด้านบนได้ดีแต่แตกร้าวเมื่อถูกดึง เหล็กเส้นด้านล่างรับแรงดึงแทน"
    caption: "คอนกรีตเสริมเหล็กเป็นวัสดุผสมที่ใช้จุดเด่นของคอนกรีตและเหล็กร่วมกัน"
  - type: worked-example
    title: ลดขยะพลาสติกได้เท่าใด
    problem: "ถุงพลาสติกใบหนึ่งหนัก 5 g ถ้านักเรียนโรงเรียนหนึ่ง 1,200 คน ลดใช้ถุงคนละ 2 ใบต่อวัน เป็นเวลา 200 วันเรียน จะลดขยะพลาสติกได้กี่กิโลกรัม"
    steps:
      - text: "จำนวนถุงที่ลดได้ $= 1{,}200 \\times 2 \\times 200 = 480{,}000$ ใบ"
      - text: "มวล $= 480{,}000 \\times 5 = 2{,}400{,}000$ g"
      - text: "เปลี่ยนเป็นกิโลกรัม: $2{,}400{,}000 \\div 1{,}000 = 2{,}400$ kg"
        why: "1 kg = 1,000 g"
    answer: "ลดขยะพลาสติกได้ 2,400 kg หรือ 2.4 ตัน"
  - { type: check, problem: chemistry.materials.polymers-ceramics-composites.p003, prompt: "ลูกถ้วยต้องกันไฟฟ้าและอยู่กลางแดดฝนได้นาน" }
glossary:
  - { term: พอลิเมอร์, definition: สารโมเลกุลใหญ่ที่เกิดจากมอนอเมอร์จำนวนมากต่อกันเป็นสายยาว }
  - { term: มอนอเมอร์, definition: โมเลกุลเล็กที่เป็นหน่วยย่อยของพอลิเมอร์ }
  - { term: เทอร์โมพลาสติก, definition: พลาสติกที่อ่อนตัวเมื่อได้รับความร้อน จึงหลอมขึ้นรูปใหม่และรีไซเคิลได้ }
  - { term: พลาสติกเทอร์โมเซต, definition: พลาสติกที่สายพอลิเมอร์เชื่อมกันเป็นร่างแห แข็งตัวถาวร ไม่อ่อนตัวเมื่อได้รับความร้อน }
  - { term: วัลคาไนเซชัน, definition: การเติมกำมะถันในยางแล้วให้ความร้อน เพื่อเชื่อมสายพอลิเมอร์ ทำให้ยางแข็งแรงและคืนรูปได้ดี }
  - { term: เซรามิก, definition: "วัสดุจากดินหรือแร่ที่ผ่านการเผาที่อุณหภูมิสูง แข็ง ทนร้อน ไม่นำไฟฟ้า แต่เปราะ" }
  - { term: วัสดุผสม, definition: วัสดุที่เกิดจากวัสดุตั้งแต่ 2 ชนิดรวมกัน ได้สมบัติที่ดีกว่าวัสดุแต่ละชนิด }
flashcards:
  - { front: "เทอร์โมพลาสติก กับ เทอร์โมเซต", back: "เทอร์โมพลาสติกร้อนแล้วอ่อนตัว รีไซเคิลได้ (PET PE PP) · เทอร์โมเซตแข็งถาวร (จานเมลามีน)" }
  - { front: "วัลคาไนเซชัน", back: "เติมกำมะถันในยางแล้วให้ความร้อน สายพอลิเมอร์เชื่อมกัน ยางแข็งแรงและคืนรูปดี" }
  - { front: "สมบัติของเซรามิก", back: "แข็ง ทนร้อน ทนสารเคมี ไม่นำไฟฟ้า แต่เปราะ" }
  - { front: "ทำไมเหล็กเส้นอยู่ด้านล่างของคาน", back: "ด้านล่างถูกดึง คอนกรีตทนแรงดึงไม่ดี เหล็กรับแรงดึงแทน" }
  - { front: "รหัสพลาสติก 1, 2, 5", back: "PET (ขวดน้ำ), HDPE (แกลลอนนม), PP (กล่องเข้าไมโครเวฟ)" }
