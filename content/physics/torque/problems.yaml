problems:
  - id: phy.torq.p001
    topics: [physics.rotation.torque]
    difficulty: 1
    type: numeric
    stem: "ช่างออกแรง $20\\ \\mathrm{N}$ ในทิศตั้งฉากกับด้ามประแจ ที่ระยะ $0.25\\ \\mathrm{m}$ จากน็อต โมเมนต์ของแรงรอบน็อตเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย N m)"
    answer: { value: 5, unit: N m }
    hints:
      - "โมเมนต์ของแรง $M = F \\times l$"
      - "แรงตั้งฉากกับด้ามประแจ แขนของโมเมนต์จึงเท่ากับระยะจากน็อตถึงจุดที่ออกแรง"
    misconceptions:
      - { match: 80, feedback: "ดูเหมือนนำแรงหารด้วยระยะ โมเมนต์ต้อง **คูณ** แรงกับแขนของโมเมนต์ ยิ่งระยะไกล โมเมนต์ยิ่งมาก" }
    solution: "$M = F \\times l = (20\\ \\mathrm{N})(0.25\\ \\mathrm{m}) = 5\\ \\mathrm{N\\,m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.torq.p002
    topics: [physics.rotation.torque]
    difficulty: 1
    type: mcq
    stem: "ออกแรงขนาดเท่ากันผลักบานประตูที่ปิดอยู่ ผลักแบบใดจะทำให้ประตูเปิดได้ง่ายที่สุด"
    choices:
      - { id: a, text: "ผลักที่ขอบประตูด้านที่ไกลบานพับ ในทิศตั้งฉากกับบานประตู", correct: true }
      - { id: b, text: "ผลักที่ตำแหน่งใกล้บานพับ ในทิศตั้งฉากกับบานประตู", feedback: "แขนของโมเมนต์สั้น โมเมนต์จึงน้อย ต้องออกแรงมากกว่าเดิมหลายเท่าจึงจะเปิดได้" }
      - { id: c, text: "ผลักที่ขอบด้านที่ไกลบานพับ ในทิศขนานกับบานประตูพุ่งเข้าหาบานพับ", feedback: "แนวแรงนี้ผ่านบานพับซึ่งเป็นจุดหมุน แขนของโมเมนต์จึงเป็นศูนย์ ประตูไม่หมุนเลยแม้จะผลักไกลจากบานพับ" }
      - { id: d, text: "ผลักที่ตำแหน่งใดก็ได้ ผลเท่ากันเพราะแรงเท่ากัน", feedback: "ผลการหมุนขึ้นกับทั้งขนาดแรงและแขนของโมเมนต์ $M = F \\times l$ ตำแหน่งที่ผลักจึงสำคัญ" }
    hints:
      - "ผลของแรงที่ทำให้วัตถุหมุนคือ $M = F \\times l$"
      - "$l$ คือระยะ **ตั้งฉาก** จากจุดหมุน (บานพับ) ถึงแนวแรง หาตัวเลือกที่ทำให้ $l$ มากที่สุด"
    solution: "แรงเท่ากันทุกแบบ โมเมนต์จึงขึ้นกับแขนของโมเมนต์ การผลักที่ขอบไกลบานพับในทิศตั้งฉากให้ระยะตั้งฉากยาวที่สุด จึงได้โมเมนต์มากที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.torq.p003
    topics: [physics.rotation.torque]
    difficulty: 2
    type: numeric
    stem: "ที่สนามเด็กเล่นในสวนสาธารณะ น้องมวล $24\\ \\mathrm{kg}$ นั่งบนไม้กระดกห่างจุดหมุน $2.5\\ \\mathrm{m}$ พี่มวล $40\\ \\mathrm{kg}$ ต้องนั่งห่างจุดหมุนอีกข้างกี่เมตร ไม้กระดกจึงสมดุล (ไม่คิดมวลของไม้กระดก ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 1.5, tolerance: 0.01, unit: m }
    hints:
      - "ใช้หลักของโมเมนต์: โมเมนต์ของน้องเท่ากับโมเมนต์ของพี่"
      - "น้ำหนักคือ $mg$ แต่ $g$ อยู่ทั้งสองข้างจึงตัดกันได้ เหลือ $m_1 l_1 = m_2 l_2$"
    misconceptions:
      - { match: 4.17, feedback: "ดูเหมือนสลับมวล คนที่หนักกว่าต้องนั่งใกล้จุดหมุนมากกว่า ไม่ใช่ไกลกว่า" }
      - { match: 2.5, feedback: "นั่งระยะเท่ากันจะสมดุลเฉพาะเมื่อมวลเท่ากัน พี่หนักกว่าจึงต้องนั่งใกล้จุดหมุนกว่า" }
    solution: "$(24g)(2.5\\ \\mathrm{m}) = (40g)\\,l$ → $l = \\dfrac{24 \\times 2.5}{40}\\ \\mathrm{m} = \\dfrac{60}{40}\\ \\mathrm{m} = 1.5\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.torq.p004
    topics: [physics.rotation.torque]
    difficulty: 2
    type: match
    stem: "จับคู่คำกับความหมายที่ถูกต้อง"
    pairs:
      - { left: "จุดหมุน", right: "จุดที่วัตถุหมุนรอบ เช่น บานพับประตู" }
      - { left: "แขนของโมเมนต์", right: "ระยะตั้งฉากจากจุดหมุนถึงแนวแรง" }
      - { left: "โมเมนต์ของแรง", right: "ผลคูณของแรงกับแขนของโมเมนต์ มีหน่วย N m" }
      - { left: "สมดุลการหมุน", right: "ผลรวมโมเมนต์ตามเข็มนาฬิกาเท่ากับผลรวมโมเมนต์ทวนเข็มนาฬิกา" }
    hints:
      - "เริ่มจากคำที่เป็น \"ตำแหน่ง\" ก่อน แล้วค่อยดูคำที่เป็น \"ระยะ\" \"ปริมาณ\" และ \"สภาวะ\""
      - "โมเมนต์ $M = F \\times l$ โดย $l$ คือแขนของโมเมนต์"
    solution: "จุดหมุน = จุดที่วัตถุหมุนรอบ · แขนของโมเมนต์ = ระยะตั้งฉากจากจุดหมุนถึงแนวแรง · โมเมนต์ของแรง = $F \\times l$ หน่วย $\\mathrm{N\\,m}$ · สมดุลการหมุน = $\\sum M_{\\text{ตาม}} = \\sum M_{\\text{ทวน}}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.torq.p005
    topics: [physics.rotation.torque]
    difficulty: 3
    type: numeric
    stem: "แขวนถุงมวล $2\\ \\mathrm{kg}$ ไว้บนราวแขวนผ้าแนวระดับ ห่างจากจุดยึดของราว $0.5\\ \\mathrm{m}$ น้ำหนักของถุงทำให้เกิดโมเมนต์รอบจุดยึดเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย N m)"
    answer: { value: 9.8, tolerance: 0.1, unit: N m }
    hints:
      - "แรงที่ทำให้เกิดโมเมนต์คือน้ำหนัก $W = mg$ ไม่ใช่มวล"
      - "น้ำหนักมีทิศลงตั้งฉากกับราวแนวระดับ แขนของโมเมนต์จึงเท่ากับ $0.5\\ \\mathrm{m}$"
    misconceptions:
      - { match: 1, feedback: "ดูเหมือนคูณมวลกับระยะโดยตรง โมเมนต์ต้องใช้แรงในหน่วยนิวตัน ให้หาน้ำหนัก $W = mg$ ก่อน" }
      - { match: 10, feedback: "ดูเหมือนใช้ $g = 10\\ \\mathrm{m/s^2}$ วิธีคิดถูกแล้ว แต่ข้อนี้กำหนด $g = 9.8\\ \\mathrm{m/s^2}$" }
    solution: "$W = mg = (2\\ \\mathrm{kg})(9.8\\ \\mathrm{m/s^2}) = 19.6\\ \\mathrm{N}$ โมเมนต์ $M = W \\times l = (19.6\\ \\mathrm{N})(0.5\\ \\mathrm{m}) = 9.8\\ \\mathrm{N\\,m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.torq.p006
    topics: [physics.rotation.torque]
    difficulty: 3
    type: numeric
    stem: "ชาวสวนใช้ชะแลงยาว $1.2\\ \\mathrm{m}$ งัดก้อนหิน โดยวางก้อนอิฐเป็นจุดหมุนห่างจากปลายที่สอดใต้ก้อนหิน $0.2\\ \\mathrm{m}$ ก้อนหินกดปลายชะแลงด้วยแรง $600\\ \\mathrm{N}$ ชาวสวนต้องกดปลายอีกข้างลงด้วยแรงอย่างน้อยเท่าใด (แรงทุกแรงตั้งฉากกับชะแลง ไม่คิดน้ำหนักของชะแลง ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 120, unit: N }
    hints:
      - "แขนของโมเมนต์ของแรงพยายามวัดจากจุดหมุน ไม่ใช่จากปลายชะแลง"
      - "จุดหมุนห่างปลายข้างก้อนหิน $0.2\\ \\mathrm{m}$ จึงห่างปลายที่กด $1.2 - 0.2 = 1.0\\ \\mathrm{m}$"
      - "ใช้ $F \\times l_{\\text{พยายาม}} = W \\times l_{\\text{หิน}}$ แล้วแก้หา $F$"
    misconceptions:
      - { match: 100, feedback: "ดูเหมือนใช้ความยาวทั้งหมดของชะแลง ($1.2\\ \\mathrm{m}$) เป็นแขนของโมเมนต์ ระยะต้องวัดจากจุดหมุน ซึ่งห่างจากมือ $1.0\\ \\mathrm{m}$" }
      - { match: 3000, feedback: "ดูเหมือนสลับแขนของโมเมนต์ มือที่อยู่ไกลจุดหมุนกว่าต้องใช้แรง **น้อย** กว่าน้ำหนักของก้อนหิน" }
    solution: "$F(1.0\\ \\mathrm{m}) = (600\\ \\mathrm{N})(0.2\\ \\mathrm{m})$ → $F = \\dfrac{120\\ \\mathrm{N\\,m}}{1.0\\ \\mathrm{m}} = 120\\ \\mathrm{N}$ ออกแรงเพียงหนึ่งในห้าของแรงที่หินกด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.torq.p007
    topics: [physics.rotation.torque]
    difficulty: 3
    type: mcq
    stem: "แรงใดต่อไปนี้ทำให้เกิดโมเมนต์รอบจุดหมุนมากที่สุด ($l$ คือระยะตั้งฉากจากจุดหมุนถึงแนวแรง)"
    choices:
      - { id: a, text: "แรง $8\\ \\mathrm{N}$ ที่มี $l = 0.75\\ \\mathrm{m}$", correct: true }
      - { id: b, text: "แรง $10\\ \\mathrm{N}$ ที่มี $l = 0.5\\ \\mathrm{m}$", feedback: "โมเมนต์ $= 10 \\times 0.5 = 5\\ \\mathrm{N\\,m}$ ยังน้อยกว่าอีกตัวเลือกหนึ่ง" }
      - { id: c, text: "แรง $20\\ \\mathrm{N}$ ที่มี $l = 0.2\\ \\mathrm{m}$", feedback: "แรงมากแต่แขนของโมเมนต์สั้น โมเมนต์ $= 20 \\times 0.2 = 4\\ \\mathrm{N\\,m}$ เท่านั้น" }
      - { id: d, text: "แรง $50\\ \\mathrm{N}$ ที่แนวแรงผ่านจุดหมุนพอดี", feedback: "แรงมากที่สุดก็จริง แต่แนวแรงผ่านจุดหมุน $l = 0$ โมเมนต์จึงเป็นศูนย์" }
    hints:
      - "อย่าดูเฉพาะขนาดของแรง ต้องคูณกับแขนของโมเมนต์"
      - "คำนวณ $M = F \\times l$ ของทุกตัวเลือกแล้วเทียบกัน"
    solution: "$8 \\times 0.75 = 6\\ \\mathrm{N\\,m}$, $10 \\times 0.5 = 5\\ \\mathrm{N\\,m}$, $20 \\times 0.2 = 4\\ \\mathrm{N\\,m}$, $50 \\times 0 = 0$ แรง $8\\ \\mathrm{N}$ ที่แขนยาว $0.75\\ \\mathrm{m}$ จึงให้โมเมนต์มากที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.torq.p008
    topics: [physics.rotation.torque]
    difficulty: 3
    type: expression
    stem: "ใช้คานงัดยกของหนัก $W$ ที่อยู่ห่างจุดหมุน $d_1$ โดยออกแรงพยายามที่ระยะ $d_2$ จากจุดหมุนอีกด้านหนึ่ง (แรงทุกแรงตั้งฉากกับคาน ไม่คิดน้ำหนักคาน) เขียนแรงพยายามน้อยที่สุดที่ต้องใช้ในรูปของ $W$, $d_1$ และ $d_2$"
    prefix: "F ="
    answer: { latex: "\\frac{W d_1}{d_2}", variables: [W, d_1, d_2] }
    hints:
      - "เมื่อคานเริ่มยกของได้ โมเมนต์ของแรงพยายามเท่ากับโมเมนต์ของน้ำหนัก"
      - "ตั้งสมการ $F d_2 = W d_1$ แล้วจัดรูปให้ $F$ อยู่ข้างเดียว"
    misconceptions:
      - { match: "\\frac{W d_2}{d_1}", feedback: "สลับระยะ ถ้าออกแรงไกลจุดหมุน ($d_2$ มาก) แรงที่ใช้ต้องน้อยลง $d_2$ จึงต้องอยู่ที่ตัวส่วน" }
      - { match: "W d_1 d_2", feedback: "จาก $F d_2 = W d_1$ ต้องหารทั้งสองข้างด้วย $d_2$ ไม่ใช่คูณ ลองตรวจหน่วย: คำตอบต้องมีหน่วยเป็นนิวตัน" }
    solution: "หลักของโมเมนต์: $F d_2 = W d_1$ จึงได้ $F = \\dfrac{W d_1}{d_2}$ ถ้า $d_2 > d_1$ แรงที่ใช้จะน้อยกว่าน้ำหนักของ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.torq.p009
    topics: [physics.rotation.torque]
    difficulty: 4
    type: numeric
    stem: "แม่ค้าหาบขนมด้วยไม้คานยาว $1.5\\ \\mathrm{m}$ ปลายหน้ามีกระจาดมวล $12\\ \\mathrm{kg}$ ปลายหลังมีกระจาดมวล $8\\ \\mathrm{kg}$ แม่ค้าต้องวางบ่าห่างจากปลายหน้ากี่เมตร ไม้คานจึงสมดุลในแนวระดับ (ไม่คิดมวลของไม้คาน ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 0.6, tolerance: 0.01, unit: m }
    hints:
      - "บ่าเป็นจุดหมุน ให้ระยะจากบ่าถึงปลายหน้าเป็น $x$ ระยะถึงปลายหลังจึงเป็น $1.5 - x$"
      - "ใช้หลักของโมเมนต์ $12g \\cdot x = 8g\\,(1.5 - x)$ แล้วแก้สมการหา $x$"
    misconceptions:
      - { match: 0.9, feedback: "นั่นคือระยะจากบ่าถึง **ปลายหลัง** โจทย์ถามระยะจากปลายหน้าซึ่งมีกระจาดที่หนักกว่า บ่าต้องอยู่ใกล้ข้างที่หนักกว่า" }
      - { match: 0.75, feedback: "วางบ่าตรงกลางจะสมดุลเฉพาะเมื่อสองข้างหนักเท่ากัน ข้างหน้าหนักกว่าจึงต้องเลื่อนบ่าเข้าหาข้างหน้า" }
    solution: "$12x = 8(1.5 - x)$ → $12x = 12 - 8x$ → $20x = 12$ → $x = 0.6\\ \\mathrm{m}$ ตรวจ: $12 \\times 0.6 = 7.2$ และ $8 \\times 0.9 = 7.2$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.torq.p010
    topics: [physics.rotation.torque]
    difficulty: 3
    type: numeric
    stem: "จากโจทย์แม่ค้าหาบขนมที่มีกระจาดมวล $12\\ \\mathrm{kg}$ และ $8\\ \\mathrm{kg}$ ที่ปลายไม้คานสองข้าง เมื่อไม้คานสมดุลในแนวระดับ บ่าของแม่ค้าต้องรับแรงเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ ไม่คิดมวลของไม้คาน (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 196, unit: N }
    hints:
      - "ไม้คานนิ่ง แรงขึ้นรวมจึงเท่ากับแรงลงรวม ($\\sum F = 0$)"
      - "แรงที่บ่าดันขึ้นเท่ากับน้ำหนักของกระจาดทั้งสองรวมกัน หาน้ำหนักด้วย $W = mg$"
    misconceptions:
      - { match: 20, feedback: "นั่นคือมวลรวมในหน่วยกิโลกรัม โจทย์ถามแรงในหน่วยนิวตัน ต้องคูณด้วย $g$" }
      - { match: 39.2, feedback: "ดูเหมือนนำน้ำหนักสองข้างมาลบกัน แต่น้ำหนักทั้งสองมีทิศลงเหมือนกัน บ่าต้องรับน้ำหนักรวม" }
    solution: "$F_{\\text{บ่า}} = (12 + 8)\\ \\mathrm{kg} \\times 9.8\\ \\mathrm{m/s^2} = 196\\ \\mathrm{N}$ ตำแหน่งของบ่าไม่ได้เปลี่ยนแรงที่ต้องรับ แต่ทำให้ไม้คานไม่หมุน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.torq.p011
    topics: [physics.rotation.torque]
    difficulty: 4
    type: numeric
    stem: "คานสม่ำเสมอยาว $4\\ \\mathrm{m}$ มวล $10\\ \\mathrm{kg}$ วางบนจุดหมุนที่ห่างจากปลายซ้าย $1\\ \\mathrm{m}$ ที่ปลายขวาแขวนถุงมวล $5\\ \\mathrm{kg}$ ต้องออกแรงกดลงที่ปลายซ้ายเท่าใด คานจึงสมดุลในแนวระดับ ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 245, unit: N }
    hints:
