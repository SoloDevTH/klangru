<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" font-family="sans-serif" font-size="14">
<title>แรงลัพธ์ของแรง 30 N และ 40 N ที่ทำมุม 60 องศากัน ด้วยรูปสี่เหลี่ยมด้านขนาน</title>
<rect x="0" y="0" width="700" height="340" fill="#ffffff"/>
<line x1="270.0" y1="280.0" x2="370.0" y2="106.8" stroke="#777" stroke-width="1.5" stroke-dasharray="6,4"/>
<line x1="220.0" y1="106.8" x2="370.0" y2="106.8" stroke="#777" stroke-width="1.5" stroke-dasharray="6,4"/>
<line x1="120.0" y1="280.0" x2="260.6" y2="280.0" stroke="#1f5fa8" stroke-width="3"/>
<polygon points="270.0,280.0 259.0,275.1 259.0,284.9" fill="#1f5fa8" stroke="#1f5fa8" stroke-width="1" stroke-linejoin="round"/>
<text x="195.0" y="304.0" text-anchor="middle" fill="#1f5fa8" font-size="14">F₁ = 30 N</text>
<line x1="120.0" y1="280.0" x2="215.3" y2="114.9" stroke="#1e7a3c" stroke-width="3"/>
<polygon points="220.0,106.8 210.2,113.8 218.8,118.8" fill="#1e7a3c" stroke="#1e7a3c" stroke-width="1" stroke-linejoin="round"/>
<text x="158.0" y="193.4" text-anchor="end" fill="#1e7a3c" font-size="14">F₂ = 40 N</text>
<line x1="120.0" y1="280.0" x2="362.3" y2="112.1" stroke="#c0392b" stroke-width="3.5"/>
<polygon points="370.0,106.8 358.1,109.0 363.8,117.1" fill="#c0392b" stroke="#c0392b" stroke-width="1" stroke-linejoin="round"/>
<text x="378.0" y="100.8" text-anchor="start" fill="#c0392b" font-size="14" font-weight="bold">R ≈ 60.8 N</text>
<path d="M 160.0 280.0 L 159.9 277.9 L 159.8 275.8 L 159.5 273.7 L 159.1 271.7 L 158.6 269.6 L 158.0 267.6 L 157.3 265.7 L 156.5 263.7 L 155.6 261.8 L 154.6 260.0 L 153.5 258.2 L 152.4 256.5 L 151.1 254.8 L 149.7 253.2 L 148.3 251.7 L 146.8 250.3 L 145.2 248.9 L 143.5 247.6 L 141.8 246.5 L 140.0 245.4" fill="none" stroke="#1e7a3c" stroke-width="1.5"/>
<text x="168.0" y="250.0" text-anchor="start" fill="#1e7a3c" font-size="13">60°</text>
<path d="M 190.0 280.0 L 190.0 277.9 L 189.9 275.8 L 189.7 273.6 L 189.5 271.5 L 189.2 269.4 L 188.8 267.4 L 188.4 265.3 L 188.0 263.2 L 187.4 261.2 L 186.8 259.1 L 186.2 257.1 L 185.4 255.1 L 184.6 253.2 L 183.8 251.2 L 182.9 249.3 L 181.9 247.4 L 180.9 245.5 L 179.9 243.7 L 178.7 241.9 L 177.6 240.2" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<text x="198.0" y="264.0" text-anchor="start" fill="#c0392b" font-size="13">34.7°</text>
<text x="520.0" y="60.0" text-anchor="middle" fill="#15211e" font-size="14">R² = F₁² + F₂² + 2F₁F₂ cos θ</text>
<text x="520.0" y="85.0" text-anchor="middle" fill="#15211e" font-size="14">= 30² + 40² + 2(30)(40) cos 60°</text>
<text x="520.0" y="110.0" text-anchor="middle" fill="#15211e" font-size="14">= 3700  →  R ≈ 60.8 N</text>
<text x="520.0" y="145.0" text-anchor="middle" fill="#777" font-size="12">(วาดตามมาตราส่วน 1 N : 5 px)</text>
</svg>
