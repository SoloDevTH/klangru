<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 215" width="340" height="215" font-family="sans-serif" font-size="15">
  <title>โปรแกรมบล็อกเกมเก็บเหรียญ เพิ่มคะแนนเมื่อแตะเหรียญ และพูดว่าชนะเมื่อคะแนนมากกว่า 10</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="340" height="215" fill="#ffffff"/>
  <path d="M20,30 q42.5,-22 85,-6 L207.89999999999998,24 v42 H52 l-4,5 h-12 l-4,-5 H20 Z" fill="#f5c242" stroke="#b8860b" stroke-width="1.5"/>
  <text x="32.0" y="48.0" font-size="15" text-anchor="start" fill="#3a2a00" font-weight="bold">เมื่อตัวละครแตะเหรียญ</text>
