    solution: "$t = \\sqrt{\\dfrac{2(2.0)}{1.6}} = \\sqrt{2.5} \\approx 1.58\\ \\mathrm{s}$ นานกว่าบนโลก ($0.64\\ \\mathrm{s}$) ราว 2.5 เท่า ขนนกที่ปล่อยพร้อมกันจะถึงพื้นพร้อมค้อน เพราะไม่มีอากาศต้าน"
