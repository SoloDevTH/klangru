problems:
  - id: bus.bep.p001
    topics: [business.finance.break-even]
    difficulty: 1
    type: mcq
    stem: "ร้านกาแฟเล็ก ๆ ร้านหนึ่ง ข้อใดเป็น **ต้นทุนคงที่** ของร้าน"
    choices:
      - { id: a, text: "ค่าเช่าร้านเดือนละ $8{,}000$ บาท", correct: true }
      - { id: b, text: "เมล็ดกาแฟที่ใช้ชงแต่ละแก้ว", feedback: "ยิ่งขายได้มากยิ่งใช้เมล็ดกาแฟมาก ค่าเมล็ดกาแฟจึงเพิ่มตามจำนวนแก้ว เป็นต้นทุนผันแปร" }
      - { id: c, text: "แก้วพลาสติกและหลอด", feedback: "ใช้แก้วและหลอดหนึ่งชุดต่อเครื่องดื่มหนึ่งแก้ว ต้นทุนนี้เพิ่มตามจำนวนที่ขาย จึงเป็นต้นทุนผันแปร" }
      - { id: d, text: "ค่าส่งของให้ลูกค้าที่สั่งผ่านแอปทีละออร์เดอร์", feedback: "ค่าส่งเกิดขึ้นทุกครั้งที่มีออร์เดอร์ จึงเพิ่มตามจำนวนที่ขาย เป็นต้นทุนผันแปร" }
    hints:
      - "ถามตัวเองว่า ถ้าเดือนนี้ขายได้เพิ่มขึ้นเท่าตัว ค่าใช้จ่ายรายการนั้นเพิ่มขึ้นด้วยหรือไม่"
      - "ต้นทุนคงที่ต้องจ่ายเท่าเดิมแม้ขายไม่ได้เลย"
    solution: "ค่าเช่าร้านจ่ายเดือนละ $8{,}000$ บาทเท่าเดิมไม่ว่าจะขายได้กี่แก้ว จึงเป็นต้นทุนคงที่ ส่วนเมล็ดกาแฟ แก้ว หลอด และค่าส่งต่อออร์เดอร์เพิ่มตามจำนวนที่ขาย จึงเป็นต้นทุนผันแปร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.bep.p002
    topics: [business.finance.break-even]
    difficulty: 1
    type: match
    stem: "จับคู่คำกับความหมาย"
    pairs:
      - { left: "ต้นทุนคงที่", right: "ไม่เปลี่ยนตามจำนวนที่ขายได้ในช่วงเวลาหนึ่ง" }
      - { left: "ต้นทุนผันแปรต่อหน่วย", right: "ต้นทุนที่เพิ่มขึ้นทุกครั้งที่ขายได้ 1 หน่วย" }
      - { left: "กำไรส่วนเกินต่อหน่วย", right: "ราคาขายต่อหน่วยลบต้นทุนผันแปรต่อหน่วย" }
      - { left: "จุดคุ้มทุน", right: "จำนวนขายที่ทำให้รายได้รวมเท่ากับต้นทุนรวม" }
    hints:
      - "คำว่า คงที่ กับ ผันแปร บอกว่าต้นทุนนั้นเปลี่ยนตามจำนวนที่ขายหรือไม่"
      - "ที่จุดคุ้มทุน กำไรเป็นศูนย์พอดี"
    solution: "ต้นทุนคงที่ไม่เปลี่ยนตามจำนวนขาย · ต้นทุนผันแปรต่อหน่วยเพิ่มทุกครั้งที่ขาย 1 หน่วย · กำไรส่วนเกินต่อหน่วย $= p - v$ · จุดคุ้มทุนคือจำนวนขายที่รายได้รวมเท่ากับต้นทุนรวม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.bep.p003
    topics: [business.finance.break-even]
    difficulty: 1
    type: numeric
    stem: "ชานมไข่มุกขายแก้วละ $45$ บาท ต้นทุนวัตถุดิบและแก้วรวมแก้วละ $18$ บาท กำไรส่วนเกินต่อแก้วเท่ากับกี่บาท (ตอบเป็นบาท)"
    answer: { value: 27, unit: บาท }
    hints:
      - "กำไรส่วนเกินคือส่วนที่เหลือจากราคาหลังจ่ายต้นทุนผันแปรของแก้วนั้น"
      - "นำราคาต่อแก้วลบด้วยต้นทุนผันแปรต่อแก้ว"
    misconceptions:
      - { match: 63, feedback: "นั่นคือราคาบวกต้นทุน กำไรส่วนเกินต้องนำต้นทุนผันแปรไปหักออกจากราคา" }
      - { match: 2.5, feedback: "นั่นคือราคาหารด้วยต้นทุน กำไรส่วนเกินเป็นผลต่าง ไม่ใช่อัตราส่วน" }
    solution: "กำไรส่วนเกินต่อแก้ว $= p - v = 45 - 18 = 27$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.bep.p004
    topics: [business.finance.break-even]
    difficulty: 2
    type: numeric
    stem: "รถเข็นกาแฟมีต้นทุนคงที่เดือนละ $9{,}000$ บาท และต้นทุนผันแปรแก้วละ $20$ บาท ถ้าเดือนนี้ขายได้ $200$ แก้ว ต้นทุนรวมเท่ากับกี่บาท (ตอบเป็นบาท)"
    answer: { value: 13000, unit: บาท }
    hints:
      - "ต้นทุนรวม = ต้นทุนคงที่ + ต้นทุนผันแปรทั้งหมด"
      - "ต้นทุนผันแปรทั้งหมดคือต้นทุนต่อแก้วคูณจำนวนแก้ว แล้วบวกต้นทุนคงที่"
    misconceptions:
      - { match: 4000, feedback: "นั่นคือต้นทุนผันแปรอย่างเดียว ต้องบวกต้นทุนคงที่ $9{,}000$ บาทด้วย" }
      - { match: 9020, feedback: "ดูเหมือนบวกต้นทุนผันแปรของแก้วเดียว ต้องคูณ $20$ บาทด้วยจำนวนแก้ว $200$ ก่อน" }
    solution: "$TC = F + v\\,x = 9{,}000 + 20 \\times 200 = 9{,}000 + 4{,}000 = 13{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.bep.p005
    topics: [business.finance.break-even]
    difficulty: 2
    type: numeric
    stem: "ร้านกาแฟขายแก้วละ $50$ บาท ต้นทุนผันแปรแก้วละ $20$ บาท ต้นทุนคงที่เดือนละ $9{,}000$ บาท ถ้าเดือนนี้ขายได้ $400$ แก้ว ได้กำไรกี่บาท (ตอบเป็นบาท)"
    answer: { value: 3000, unit: บาท }
    hints:
      - "กำไร = รายได้รวม − ต้นทุนรวม"
      - "ใช้ $(p - v)\\,x - F$ หรือคิดรายได้และต้นทุนรวมแยกกันแล้วลบ"
    misconceptions:
      - { match: 12000, feedback: "นั่นคือกำไรส่วนเกินรวม $30 \\times 400$ ยังไม่ได้หักต้นทุนคงที่ $9{,}000$ บาท" }
      - { match: 11000, feedback: "ดูเหมือนหักแค่ต้นทุนคงที่ออกจากรายได้ $20{,}000$ บาท ลืมต้นทุนผันแปร $20 \\times 400 = 8{,}000$ บาท" }
    solution: "รายได้ $50 \\times 400 = 20{,}000$ บาท ต้นทุนรวม $9{,}000 + 20 \\times 400 = 17{,}000$ บาท กำไร $= 20{,}000 - 17{,}000 = 3{,}000$ บาท (หรือ $30 \\times 400 - 9{,}000 = 3{,}000$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.bep.p006
    topics: [business.finance.break-even]
    difficulty: 2
    type: numeric
    stem: "ร้านออนไลน์ขายกระเป๋าผ้าใบละ $120$ บาท ต้นทุนผันแปรใบละ $72$ บาท ค่าโฆษณาเหมาเดือนละ $2{,}400$ บาท ต้องขายเดือนละกี่ใบจึงคุ้มทุน (ตอบเป็นจำนวนใบ)"
    answer: { value: 50, unit: ใบ }
    hints:
      - "หากำไรส่วนเกินต่อใบก่อน"
      - "จุดคุ้มทุน = ต้นทุนคงที่ ÷ กำไรส่วนเกินต่อหน่วย"
    misconceptions:
      - { match: 20, feedback: "นั่นคือ $2{,}400 \\div 120$ หารด้วยราคา แต่แต่ละใบยังต้องจ่ายต้นทุนผันแปร $72$ บาท ต้องหารด้วย $120 - 72$" }
      - { match: 33.33, feedback: "นั่นคือ $2{,}400 \\div 72$ หารด้วยต้นทุนผันแปร ต้องหารด้วยกำไรส่วนเกิน $48$ บาท" }
    solution: "กำไรส่วนเกิน $= 120 - 72 = 48$ บาทต่อใบ จุดคุ้มทุน $= \\dfrac{2{,}400}{48} = 50$ ใบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.bep.p007
    topics: [business.finance.break-even]
    difficulty: 2
    type: mcq
    stem: "บนกราฟจุดคุ้มทุน ที่จำนวนขาย **น้อยกว่า** จุดคุ้มทุน เส้นทั้งสองอยู่อย่างไร และร้านมีผลอย่างไร"
    choices:
      - { id: a, text: "เส้นต้นทุนรวมอยู่สูงกว่าเส้นรายได้รวม ร้านขาดทุน", correct: true }
      - { id: b, text: "เส้นรายได้รวมอยู่สูงกว่าเส้นต้นทุนรวม ร้านได้กำไร", feedback: "นั่นคือช่วงทางขวาของจุดคุ้มทุน ก่อนถึงจุดคุ้มทุนรายได้ยังไม่พอจ่ายต้นทุนคงที่" }
      - { id: c, text: "เส้นทั้งสองทับกัน ร้านไม่ได้ไม่เสีย", feedback: "เส้นทั้งสองแตะกันที่จุดเดียวคือจุดคุ้มทุน ไม่ได้ทับกันตลอดช่วง" }
      - { id: d, text: "เส้นต้นทุนรวมอยู่สูงกว่า แต่ร้านได้กำไรเพราะยังขายได้", feedback: "กำไรคือรายได้ลบต้นทุน ถ้าต้นทุนรวมสูงกว่ารายได้รวม ผลต่างติดลบคือขาดทุน" }
    hints:
      - "ที่ $x = 0$ เส้นรายได้อยู่ที่ $0$ แต่เส้นต้นทุนรวมอยู่ที่ $F$"
      - "ดูว่าเส้นไหนอยู่สูงกว่าในช่วงก่อนจุดตัด แล้วคิดว่ารายได้ลบต้นทุนเป็นบวกหรือลบ"
    solution: "เส้นต้นทุนรวมเริ่มที่ $F$ ส่วนเส้นรายได้เริ่มที่ $0$ ก่อนถึงจุดตัด เส้นต้นทุนรวมจึงอยู่สูงกว่า รายได้ − ต้นทุน $< 0$ ร้านขาดทุน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.bep.p008
    topics: [business.finance.break-even]
    difficulty: 2
    type: expression
    stem: "แผงขายข้าวเหนียวมะม่วงขายกล่องละ $35$ บาท ต้นทุนผันแปรกล่องละ $15$ บาท ต้นทุนคงที่เดือนละ $4{,}000$ บาท เขียนกำไร $P$ (บาท) เมื่อขายได้ $x$ กล่อง"
    prefix: "P ="
    answer: { latex: "20x - 4000", variables: [x] }
    hints:
      - "กำไร = รายได้รวม − ต้นทุนรวม"
      - "รายได้รวม $35x$ ต้นทุนรวม $4000 + 15x$ แล้วลบกัน ระวังเครื่องหมาย"
    misconceptions:
      - { match: "35x - 4000", feedback: "ลืมหักต้นทุนผันแปร $15x$ ต้นทุนรวมคือ $4000 + 15x$" }
      - { match: "20x + 4000", feedback: "ต้นทุนคงที่ต้องหักออก ไม่ใช่บวกเพิ่ม" }
    solution: "$P = 35x - (4000 + 15x) = 20x - 4000$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.bep.p009
    topics: [business.finance.break-even]
    difficulty: 3
    type: numeric
    stem: "แผงน้ำส้มที่ตลาดนัดมีค่าเช่าแผงและค่าไฟรวมคืนละ $450$ บาท ต้นทุนผันแปรขวดละ $13$ บาท ขายขวดละ $25$ บาท ต้องขายอย่างน้อยคืนละกี่ขวดจึงไม่ขาดทุน (ตอบเป็นจำนวนขวดเต็ม)"
    answer: { value: 38, unit: ขวด }
    hints:
      - "หากำไรส่วนเกินต่อขวดแล้วนำไปหารต้นทุนคงที่"
      - "ผลหารไม่ลงตัว ลองแทนจำนวนเต็มสองค่าที่อยู่ใกล้ที่สุดในสูตรกำไร แล้วเลือกค่าที่ไม่ขาดทุน"
    misconceptions:
      - { match: 37, feedback: "ปัดลงทำให้ยังขาดทุน $12 \\times 37 - 450 = -6$ บาท ต้องปัดขึ้น" }
      - { match: 18, feedback: "นั่นคือ $450 \\div 25$ หารด้วยราคา ต้องหารด้วยกำไรส่วนเกิน $25 - 13 = 12$ บาท" }
    solution: "$\\dfrac{450}{25 - 13} = \\dfrac{450}{12} = 37.5$ ปัดขึ้นเป็น $38$ ขวด ตรวจ: $12 \\times 38 - 450 = 6 \\ge 0$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.bep.p010
    topics: [business.finance.break-even]
    difficulty: 3
    type: numeric
    stem: "ร้านกาแฟขายแก้วละ $50$ บาท ต้นทุนผันแปรแก้วละ $20$ บาท ต้นทุนคงที่เดือนละ $9{,}000$ บาท ยอดขายที่จุดคุ้มทุนคิดเป็นเงินกี่บาทต่อเดือน (ตอบเป็นบาท)"
    answer: { value: 15000, unit: บาท }
    hints:
      - "หาจุดคุ้มทุนเป็นจำนวนแก้วก่อน"
      - "นำจำนวนแก้วที่จุดคุ้มทุนคูณราคาต่อแก้ว"
    misconceptions:
      - { match: 300, feedback: "นั่นคือจุดคุ้มทุนเป็นจำนวนแก้ว โจทย์ถามเป็นเงิน ต้องคูณราคาแก้วละ $50$ บาท" }
      - { match: 9000, feedback: "นั่นคือต้นทุนคงที่ ที่จุดคุ้มทุนรายได้ต้องจ่ายทั้งต้นทุนคงที่และต้นทุนผันแปร" }
    solution: "จุดคุ้มทุน $= \\dfrac{9{,}000}{30} = 300$ แก้ว ยอดขาย $= 300 \\times 50 = 15{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.bep.p011
    topics: [business.finance.break-even]
    difficulty: 3
    type: numeric
    stem: "ร้านกาแฟเดียวกัน (ราคา $50$ บาท ต้นทุนผันแปร $20$ บาท ต้นทุนคงที่ $9{,}000$ บาทต่อเดือน) อยากได้กำไรเดือนละ $6{,}000$ บาท ต้องขายเดือนละกี่แก้ว (ตอบเป็นจำนวนแก้ว)"
    answer: { value: 500, unit: แก้ว }
    hints:
      - "กำไรส่วนเกินต้องจ่ายต้นทุนคงที่ให้หมดก่อน แล้วจึงเป็นกำไร"
      - "ตั้งสมการ $(p - v)\\,x - F = 6{,}000$ แล้วแก้หา $x$"
    misconceptions:
      - { match: 200, feedback: "นั่นคือ $6{,}000 \\div 30$ ลืมว่าต้องจ่ายต้นทุนคงที่ $9{,}000$ บาทก่อน" }
      - { match: 300, feedback: "นั่นคือจุดคุ้มทุน ซึ่งกำไรเป็นศูนย์ ยังไม่ได้กำไรตามเป้า" }
    solution: "$x = \\dfrac{F + 6{,}000}{p - v} = \\dfrac{9{,}000 + 6{,}000}{30} = 500$ แก้ว ตรวจ: $30 \\times 500 - 9{,}000 = 6{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.bep.p012
    topics: [business.finance.break-even]
    difficulty: 3
    type: expression
    stem: "ให้ $F$ เป็นต้นทุนคงที่ $p$ เป็นราคาต่อหน่วย และ $v$ เป็นต้นทุนผันแปรต่อหน่วย เขียนสูตรจำนวนหน่วย $x$ ที่จุดคุ้มทุน"
    prefix: "x ="
    answer: { latex: "\\frac{F}{p-v}", variables: [F, p, v] }
    hints:
      - "ที่จุดคุ้มทุน รายได้รวมเท่ากับต้นทุนรวม: $p\\,x = F + v\\,x$"
      - "ย้าย $v\\,x$ ไปข้างซ้าย แยกตัวประกอบ $x$ แล้วหาร"
    misconceptions:
      - { match: "\\frac{F}{p}", feedback: "หารด้วยราคาอย่างเดียวลืมต้นทุนผันแปร แต่ละหน่วยเหลือไว้จ่ายต้นทุนคงที่แค่ $p - v$" }
      - { match: "\\frac{F}{v}", feedback: "ต้องหารด้วยกำไรส่วนเกิน $p - v$ ไม่ใช่ต้นทุนผันแปร" }
      - { match: "\\frac{F}{p+v}", feedback: "ย้าย $v\\,x$ ข้ามเครื่องหมายเท่ากับแล้วต้องเปลี่ยนเป็นลบ จึงได้ $p - v$" }
    solution: "$p\\,x = F + v\\,x \\Rightarrow p\\,x - v\\,x = F \\Rightarrow (p - v)\\,x = F \\Rightarrow x = \\dfrac{F}{p - v}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: bus.bep.p013
    topics: [business.finance.break-even]
    difficulty: 3
    type: order
