      - { match: 44.3, feedback: "บวกค่าสัมบูรณ์ของทั้งสองปฏิกิริยา ต้องรวมค่าตามเครื่องหมายจริง" }
    hints:
      - "ผลรวมของ ΔG ของปฏิกิริยาที่จับคู่กันคือการบวกค่าตามเครื่องหมาย"
      - "ระวังเครื่องหมายของการไฮโดรไลซิส ATP ซึ่งเป็นลบ"
    solution: "ΔG°′ รวม = +13.8 + (−30.5) = −16.7 kJ/mol ผลรวมเป็นลบ จึงเกิดปฏิกิริยาทั้งสองได้"
