  - { framework: au-ac9-digital-technologies, indicators: ["AC9TDI10P09"], coverage: partial, note: "โปรแกรมแบบโมดูล (import, from ... import, __name__) คลาส วัตถุ แอตทริบิวต์ เมทอด การห่อหุ้ม การประกอบ และการสืบทอดใน Python ผู้เรียนไล่โปรแกรม เรียงบรรทัด หาและแก้บั๊ก (ลืม self, b = a, ตัวแปรระดับคลาส) แต่ไม่ได้เขียนและรันโปรแกรมเองในแอป" }
  - { framework: csta-k12-cs, indicators: ["3B-AP-14"], coverage: partial, note: "สร้างส่วนประกอบเอง (ฟังก์ชันในโมดูล grading.py คลาส Account, Item, Cart, QueueMachine) แล้วนำมาประกอบเป็นคำตอบของปัญหา ผ่านตัวอย่างและโจทย์ แต่ผู้เรียนไม่ได้สร้างส่วนประกอบเองในแอป" }
