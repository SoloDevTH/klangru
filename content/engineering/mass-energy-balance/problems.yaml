  - id: engineering.process.mass-energy-balance.p015
    topics: [engineering.process.mass-energy-balance]
    difficulty: 4
    type: numeric
    stem: "โรงครัวอุ่นข้าวต้ม $10\\ \\mathrm{kg}$ ($c = 3.8\\ \\mathrm{kJ/(kg\\cdot K)}$) จาก $25\\ ^\\circ\\mathrm{C}$ เป็น $70\\ ^\\circ\\mathrm{C}$ โดยพ่นไอน้ำ $100\\ ^\\circ\\mathrm{C}$ เข้าไปผสมโดยตรง ไอน้ำควบแน่นแล้วเย็นลงเหลือ $70\\ ^\\circ\\mathrm{C}$ ไม่มีความร้อนสูญเสีย ต้องใช้ไอน้ำกี่กิโลกรัม ($h_{fg} = 2257\\ \\mathrm{kJ/kg}$, $c_{\\text{น้ำ}} = 4.18\\ \\mathrm{kJ/(kg\\cdot K)}$ ทศนิยม 3 ตำแหน่ง)"
    answer: { value: 0.718, tolerance: 0.004, unit: kg }
    misconceptions:
      - { match: 0.758, feedback: "คิดเฉพาะความร้อนแฝง ลืมความร้อนที่น้ำจากไอน้ำคายออกเมื่อเย็นลงจาก $100$ เป็น $70\\ ^\\circ\\mathrm{C}$" }
      - { match: 13.6, feedback: "ใช้แค่ความร้อนสัมผัสของน้ำ ($4.18 \\times 30$) โดยไม่คิดความร้อนแฝงของการควบแน่น" }
    hints:
      - "ความร้อนที่ข้าวต้มรับ = ความร้อนที่ไอน้ำให้"
      - "ไอน้ำ 1 kg ให้ความร้อน $h_{fg} + c_{\\text{น้ำ}}(100 - 70)$"
    solution: "ข้าวต้มรับ $10 \\times 3.8 \\times 45 = 1710\\ \\mathrm{kJ}$ ไอน้ำ 1 kg ให้ $2257 + 4.18(30) = 2382.4\\ \\mathrm{kJ}$ จึงต้องใช้ $1710/2382.4 = 0.718\\ \\mathrm{kg}$ ตรวจ: $0.718 \\times 2382.4 = 1710\\ \\mathrm{kJ}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.process.mass-energy-balance.p016
    topics: [engineering.process.mass-energy-balance]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการแก้โจทย์ดุลมวลของกระบวนการ"
    items:
