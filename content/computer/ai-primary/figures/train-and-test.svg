<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="520" height="330" font-family="sans-serif" font-size="14">
<title>ตัวอย่างฝึกมีภาพผลไม้สามกลุ่ม กลุ่มละสามภาพพร้อมป้ายชื่อ ส่วนภาพทดสอบเป็นภาพผลไม้ที่ยังไม่มีป้าย</title>
<rect x="0" y="0" width="520" height="330" fill="#ffffff"/>
<text x="180" y="28" text-anchor="middle" font-weight="bold" fill="#1f2937">ตัวอย่างฝึก (มีป้ายกำกับ)</text>
<text x="432" y="28" text-anchor="middle" font-weight="bold" fill="#1f2937">ภาพทดสอบ</text>
<line x1="350" y1="44" x2="350" y2="300" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="14" y="85" fill="#1f2937" font-weight="bold">มะม่วง</text>
<ellipse cx="120" cy="80" rx="22" ry="17" fill="#facc15" stroke="#854d0e" stroke-width="2" transform="rotate(-20 120 80)"/>
<ellipse cx="170" cy="80" rx="22" ry="17" fill="#facc15" stroke="#854d0e" stroke-width="2" transform="rotate(-20 170 80)"/>
<ellipse cx="220" cy="80" rx="22" ry="17" fill="#facc15" stroke="#854d0e" stroke-width="2" transform="rotate(-20 220 80)"/>
<text x="14" y="175" fill="#1f2937" font-weight="bold">กล้วย</text>
<path d="M96,156 Q120,196 144,156 Q120,178 96,156 Z" fill="#fde047" stroke="#a16207" stroke-width="2"/>
<path d="M146,156 Q170,196 194,156 Q170,178 146,156 Z" fill="#fde047" stroke="#a16207" stroke-width="2"/>
<path d="M196,156 Q220,196 244,156 Q220,178 196,156 Z" fill="#fde047" stroke="#a16207" stroke-width="2"/>
<text x="14" y="265" fill="#1f2937" font-weight="bold">ส้ม</text>
<circle cx="120" cy="260" r="19" fill="#fb923c" stroke="#9a3412" stroke-width="2"/>
<circle cx="170" cy="260" r="19" fill="#fb923c" stroke="#9a3412" stroke-width="2"/>
<circle cx="220" cy="260" r="19" fill="#fb923c" stroke="#9a3412" stroke-width="2"/>
<text x="180" y="312" text-anchor="middle" fill="#6b7280" font-size="12">มะม่วง กล้วย ส้ม อย่างละ 3 ภาพ</text>
<rect x="372" y="90" width="120" height="150" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 4"/>
<ellipse cx="432" cy="150" rx="34" ry="26" fill="#fcd34d" stroke="#92400e" stroke-width="2"/>
<text x="432" y="206" text-anchor="middle" fill="#1f2937">ภาพใหม่</text>
<text x="432" y="224" text-anchor="middle" fill="#1f2937">ยังไม่มีป้าย</text>
<text x="432" y="272" text-anchor="middle" fill="#6b7280" font-size="12">เครื่องต้องทาย</text>
<text x="432" y="288" text-anchor="middle" fill="#6b7280" font-size="12">จากตัวอย่างที่เคยเห็น</text>
</svg>