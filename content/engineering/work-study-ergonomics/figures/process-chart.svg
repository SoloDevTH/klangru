<circle cx="48.0" cy="605.0" r="8.0" fill="#1f5f8b" stroke="#1f5f8b" stroke-width="2"/>
<text x="66.0" y="610.0" text-anchor="start" font-size="13" fill="#15211e">การปฏิบัติงาน 2 ขั้น</text>
<line x1="270.0" y1="605.0" x2="286.0" y2="605.0" stroke="#b35c00" stroke-width="3"/>
<polygon points="286.0,605.0 280.0,600.0 280.0,610.0" fill="#b35c00" stroke="#b35c00" stroke-width="2"/>
<text x="296.0" y="610.0" text-anchor="start" font-size="13" fill="#15211e">การเคลื่อนย้าย 2 ขั้น</text>
<rect x="500.0" y="597.0" width="16.0" height="16.0" rx="0" fill="#2e7d32" stroke="#2e7d32" stroke-width="1.5"/>
<text x="526.0" y="610.0" text-anchor="start" font-size="13" fill="#15211e">การตรวจสอบ 1 ขั้น</text>
<rect x="40.0" y="627.0" width="16.0" height="16.0" rx="0" fill="#ffffff" stroke="#b3261e" stroke-width="2"/>
<text x="48.0" y="639.0" text-anchor="middle" font-size="11" fill="#b3261e" font-weight="bold">D</text>
<text x="66.0" y="640.0" text-anchor="start" font-size="13" fill="#15211e">การรอ (ดีเลย์) 1 ขั้น</text>
<polygon points="270.0,628.0 286.0,628.0 278.0,642.0" fill="#6a4c93" stroke="#6a4c93" stroke-width="2"/>
<text x="296.0" y="640.0" text-anchor="start" font-size="13" fill="#15211e">การเก็บ 2 ขั้น</text>
<text x="360.0" y="692.0" text-anchor="middle" font-size="12" fill="#555555">การรอ (ขั้น 5) และการเก็บ (ขั้น 1 และ 8) เป็นจุดแรกที่ควรพิจารณาลด</text>
</svg>
