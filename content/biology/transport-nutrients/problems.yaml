    stem: "ทุเรียนในสวนที่จันทบุรีติดผลดีแล้ว แต่ปีที่ผ่านมาผลไม่ค่อยหวาน ขอบใบแก่บางใบไหม้เป็นสีน้ำตาล ช่วงผลกำลังโตควรเลือกปุ๋ยใดจากภาพ"
