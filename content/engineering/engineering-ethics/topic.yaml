  - { front: "ผลประโยชน์ทับซ้อนต้องทำอย่างไร", back: "เปิดเผยและพิจารณาถอนตัว หรือให้ผู้ตรวจอิสระทำแทน" }
  - { front: "พบข้อบกพร่องร้ายแรงแล้วลูกค้าไม่ยอมแก้", back: "บันทึกและแจ้งเป็นลายลักษณ์อักษร ถอนการรับรองส่วนที่ไม่ปลอดภัย และแจ้งหน่วยงานกำกับเมื่อจำเป็น" }
  - { front: "ความเสียหายคาดหมายต่อปีคำนวณอย่างไร", back: "ค่าเสียหาย × ความน่าจะเป็นต่อปี" }
  - { front: "ค่าความปลอดภัย (FS) คืออะไร", back: "ความสามารถรับแรงสูงสุด ÷ แรงใช้งาน" }
