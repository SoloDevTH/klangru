id: earthscience.astronomy.space-exploration
subject: earthscience
title: { th: การสำรวจอวกาศและการสังเกตท้องฟ้า, en: "Space exploration and sky observation" }
summary: กล้องโทรทรรศน์ในช่วงความยาวคลื่นต่าง ๆ และหน้าต่างบรรยากาศ ขนาดกล้องกับกำลังแยก ดาวเทียม ยานอวกาศ สถานีอวกาศ การใช้เทคโนโลยีอวกาศ และการวางแผนสังเกตดาว
difficulty: 4
minutes: 35
prerequisites: [physics.waves.electromagnetic-waves, physics.dynamics.satellite-motion]
encompasses:
  - { id: physics.waves.electromagnetic-waves, weight: 0.2 }
  - { id: physics.dynamics.satellite-motion, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: หน้าต่างบรรยากาศ
    src: atmosphere-window.svg
    alt: "กราฟแบบง่าย แกนนอนเป็นความยาวคลื่นแบบลอการิทึมจาก 1 พิโกเมตรถึง 100 เมตร แถบสีด้านบนบอกช่วงรังสีแกมมา รังสีเอกซ์ อัลตราไวโอเลต แสงที่ตามองเห็น อินฟราเรด ไมโครเวฟและคลื่นวิทยุ พื้นที่สีเทาแสดงว่าบรรยากาศดูดกลืนมากเพียงใด ช่วงแกมมา เอกซ์ และอัลตราไวโอเลตถูกดูดกลืนหมด เขียนว่าต้องส่งกล้องขึ้นไปในอวกาศ ช่วงแสงที่ตามองเห็นผ่านได้ อินฟราเรดผ่านได้บางช่วงเป็นหยัก ๆ ช่วงอินฟราเรดไกลถึงราว 1 มิลลิเมตรถูกดูดกลืน ช่วงคลื่นวิทยุจากราวเซนติเมตรถึงสิบกว่าเมตรผ่านได้ เขียนว่ากล้องโทรทรรศน์วิทยุบนพื้นโลก คลื่นวิทยุที่ยาวกว่าราว 20 เมตรถูกสะท้อนกลับ"
    caption: "ช่วงที่ผ่านบรรยากาศได้เรียกว่าหน้าต่างบรรยากาศ (วาดโดยทีมคลังรู้ จากรูปแบบในตำราทั่วไป ไม่ใช่ข้อมูลวัดจริง)"
  - { type: check, problem: earthscience.astronomy.space-exploration.p001, prompt: "ดูว่ารังสีเอกซ์อยู่ในส่วนที่ถูกดูดกลืนหรือไม่" }
  - type: worked-example
    title: เทียบกล้องสองตัว
    problem: "กล้อง ก กว้าง 2.4 m กล้อง ข กว้าง 0.6 m ใช้แสง 550 nm เทียบความสามารถรวมแสงและกำลังแยกของทั้งสองกล้อง"
    steps:
      - text: "การรวมแสงแปรผันตาม $D^2$: $(2.4/0.6)^2 = 4^2 = 16$ กล้อง ก รวมแสงได้มากกว่า 16 เท่า"
        why: "แสงที่เก็บได้ขึ้นกับพื้นที่ของกระจก ซึ่งแปรผันตามกำลังสองของเส้นผ่านศูนย์กลาง"
      - text: "กำลังแยกของกล้อง ก: $\\theta = 1.22 \\times 5.5 \\times 10^{-7} / 2.4 = 2.8 \\times 10^{-7}\\ \\mathrm{rad}$"
      - text: "กำลังแยกของกล้อง ข: $\\theta = 1.22 \\times 5.5 \\times 10^{-7} / 0.6 = 1.1 \\times 10^{-6}\\ \\mathrm{rad}$ หยาบกว่ากล้อง ก 4 เท่า"
        why: "θ แปรผกผันกับ D ไม่ได้ยกกำลังสอง"
      - text: "ถ้าอยู่บนพื้นโลก อากาศที่ปั่นป่วนมักจำกัดความคมไว้ราว 1 ฟิลิปดา $(4.8 \\times 10^{-6}\\ \\mathrm{rad})$ ทั้งสองกล้องจึงได้ภาพคมพอ ๆ กัน แต่กล้อง ก ยังเห็นวัตถุจางกว่า"
    answer: "กล้อง ก รวมแสงได้มากกว่า 16 เท่า และกำลังแยกตามทฤษฎีละเอียดกว่า 4 เท่า"
  - type: interactive
    title: กำลังแยกกับขนาดกล้อง
    caption: "เส้นคือ $\\theta = 1.22\\lambda/D$ ในหน่วยฟิลิปดา เมื่อ $x$ คือเส้นผ่านศูนย์กลางเป็นเมตร และ $L$ คือความยาวคลื่นเป็นไมโครเมตร ลองตั้ง $L = 0.55$ (แสงสีเขียว) แล้วตั้ง $L = 2$ (อินฟราเรดของเจมส์ เว็บบ์) ดูว่ากล้องต้องใหญ่ขึ้นเท่าใดจึงได้ความคมเท่าเดิม"
    widget:
      kind: function-plot
      functions: ["\\frac{0.2516L}{x}"]
      sliders:
        - { name: L, min: 0.3, max: 5, step: 0.05, value: 0.55, label: ความยาวคลื่น (µm) }
      x: [0.5, 10]
      y: [0, 1]
  - type: figure
    title: ความสูงของวงโคจร
    src: orbit-altitudes.svg
    alt: "เส้นระยะจากผิวโลกแบบลอการิทึม ขีดที่ 100, 1,000, 10,000, 100,000 และ 1,000,000 กิโลเมตร จุดสีแดงเรียงจากใกล้ไปไกล สถานีอวกาศนานาชาติราว 400 km กล้องฮับเบิลราว 540 km ไทยโชต 822 km ดาวเทียม GPS ราว 20,200 km วงโคจรค้างฟ้า 35,786 km ดวงจันทร์ราว 384,400 km กล้องเจมส์ เว็บบ์ราว 1.5 ล้าน km"
    caption: "มาตราส่วนลอการิทึม แต่ละขีดไกลขึ้น 10 เท่า (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ทำไมไทยโชตถ่ายภาพที่เดิมซ้ำได้
    problem: "ไทยโชตโคจรสูง 822 km ผ่านใกล้ขั้วโลก ใช้ $GM_{\\text{โลก}} = 3.99 \\times 10^{14}\\ \\mathrm{m^3/s^2}$ และรัศมีโลก 6,371 km หาคาบ แล้วอธิบายว่าทำไมจึงถ่ายภาพได้ทั่วประเทศไทย"
    steps:
      - text: "รัศมีวงโคจร $r = 6{,}371 + 822 = 7{,}193\\ \\mathrm{km} = 7.193 \\times 10^6\\ \\mathrm{m}$"
      - text: "อัตราเร็ว $v = \\sqrt{GM/r} = \\sqrt{3.99 \\times 10^{14} / 7.193 \\times 10^6} \\approx 7.45 \\times 10^3\\ \\mathrm{m/s}$"
        why: "แรงโน้มถ่วงทำหน้าที่เป็นแรงสู่ศูนย์กลาง จากเรื่องการโคจรของดาวเทียม"
      - text: "คาบ $T = 2\\pi r / v \\approx 6.07 \\times 10^3\\ \\mathrm{s} \\approx 101$ นาที วันหนึ่งโคจรราว 14 รอบ"
      - text: "วงโคจรผ่านใกล้ขั้วโลก ขณะที่โลกหมุนอยู่ข้างใต้ แต่ละรอบจึงผ่านเหนือแนวพื้นที่ใหม่ จนครอบคลุมทั้งประเทศและวนกลับมาที่เดิมได้"
    answer: "คาบประมาณ 101 นาที ดาวเทียมผ่านพื้นที่ต่าง ๆ ทีละแนวขณะโลกหมุน จึงถ่ายภาพได้ทั่วประเทศและถ่ายซ้ำที่เดิมได้"
  - { type: check, problem: earthscience.astronomy.space-exploration.p004, prompt: "ดาวเทียมแบบใดดูเหมือนอยู่นิ่งบนท้องฟ้า" }
  - { type: check, problem: earthscience.astronomy.space-exploration.p010, prompt: "ใช้ขั้นการวางแผนสังเกตดาว" }
glossary:
  - { term: หน้าต่างบรรยากาศ, definition: "ช่วงความยาวคลื่นแม่เหล็กไฟฟ้าที่ผ่านบรรยากาศลงมาถึงพื้นโลกได้ ได้แก่ แสงที่ตามองเห็น อินฟราเรดบางช่วง และคลื่นวิทยุ" }
  - { term: กำลังแยก, definition: "มุมเล็กที่สุดที่กล้องยังแยกจุดสองจุดออกจากกันได้ ประมาณ 1.22λ/D" }
  - { term: วงโคจรค้างฟ้า, definition: "วงโคจรเหนือเส้นศูนย์สูตร สูง 35,786 km คาบเท่ากับการหมุนของโลก ดาวเทียมจึงดูอยู่นิ่ง" }
  - { term: สถานีอวกาศนานาชาติ, definition: "ห้องปฏิบัติการที่โคจรรอบโลกสูงราว 400 km มีนักบินอวกาศอยู่ตลอดตั้งแต่ พ.ศ. 2543" }
  - { term: ยานอวกาศ, definition: "ยานที่เดินทางไปสำรวจนอกโลก อาจบินผ่าน โคจรรอบ หรือลงจอดบนวัตถุเป้าหมาย" }
flashcards:
  - { front: "ทำไมต้องส่งกล้องรังสีเอกซ์และรังสีแกมมาขึ้นอวกาศ", back: "บรรยากาศดูดกลืนรังสีเหล่านี้ รังสีลงมาไม่ถึงพื้น" }
  - { front: "กล้องใหญ่ขึ้น 2 เท่า รวมแสงได้กี่เท่า", back: "4 เท่า เพราะแปรผันตาม $D^2$" }
  - { front: "สูตรกำลังแยกของกล้อง", back: "$\\theta \\approx 1.22\\lambda/D$ (เรเดียน)" }
  - { front: "เครื่องมือสำรวจอวกาศของไทย", back: "หอดูดาวแห่งชาติบนดอยอินทนนท์ (2.4 m) กล้องโทรทรรศน์วิทยุแห่งชาติ (40 m) ดาวเทียมไทยโชตและ THEOS-2" }
  - { front: "สังเกตวัตถุจางควรเลือกคืนแบบใด", back: "คืนเดือนมืด ฟ้าใส ไกลแสงไฟ และให้ตาปรับกับความมืด 20–30 นาที" }
