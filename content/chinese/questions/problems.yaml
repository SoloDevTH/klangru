  type: mcq
  stem: เพื่อนชาวจีนถามว่า 你不是中国人吗？ (คุณไม่ใช่คนจีนหรือ) ถ้าเราเป็นคนไทย ควรตอบว่าอะไร
  choices:
  - id: a
    text: 是，我是中国人。
    feedback: เราเป็นคนไทย จึงตอบว่าเป็นคนจีนไม่ได้
  - id: b
    text: 我不是中国人吗？
    feedback: เป็นการถามกลับ ไม่ได้ตอบคำถาม
  - id: c
    text: 对，我不是中国人，我是泰国人。
    correct: true
    feedback: ถูก 对 ยืนยันว่าสิ่งที่ถามถูก คือ ไม่ใช่คนจีน เหมือนภาษาไทย "ใช่ ไม่ใช่คนจีน"
  - id: d
    text: 不，我不是中国人。
    feedback: 不 ตอนต้นปฏิเสธสิ่งที่ผู้ถามคิด ซึ่งขัดกับ 我不是中国人 ที่ตามมา
