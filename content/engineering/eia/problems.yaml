  - id: engineering.environmental.eia.p014
    topics:
      - engineering.environmental.eia
    difficulty: 4
    type: numeric
    stem: จากเมทริกซ์ Leopold ในภาพ กิจกรรม A2 (ขนส่งแร่) มีคะแนนรวม −22 ถ้าการจ้างงานท้องถิ่น (F3) ของ A2 ปรับจาก m = +2 เป็น m = +4 โดยความสำคัญ i = 3 เดิม คะแนนรวมของ A2 จะเป็นเท่าไร (ตอบจำนวนเต็ม)
    figure:
      src: leopold-matrix.svg
      alt: ตารางสามคูณสาม แถวคือกิจกรรม A1 ขุดหน้าดิน A2 ขนส่งแร่ และ A3 ปลูกป่าฟื้นฟู คอลัมน์คือ F1 คุณภาพอากาศ F2 คุณภาพน้ำผิวดิน และ F3 การจ้างงานท้องถิ่น ช่อง A1 มีค่า m = −6 i = 8, m = −7 i = 9, m = +3 i = 6 ช่อง A2 มีค่า m = −4 i = 5, m = −2 i = 4, m = +2 i = 3 ช่อง A3 มีค่า m = +2 i = 6, m = +4 i = 7, m = +5 i = 8
    answer:
      value: -16
      tolerance: 0.1
    hints:
      - คำนวณคะแนนใหม่ของ F3 = m ใหม่ × i เดิม
      - นำคะแนนใหม่ของ F3 ไปแทนคะแนนเดิม แล้วคำนวณรวมใหม่
    misconceptions:
      - match: -20
        feedback: บวกค่า m ที่เพิ่มเข้าไปกับคะแนนรวมโดยตรง โดยไม่ได้คูณด้วยความสำคัญ
    solution: คะแนน F3 ใหม่ = 4 × 3 = 12 (จากเดิม 2 × 3 = 6) คะแนนรวมของ A2 = −20 + (−8) + 12 = −16 ผลกระทบเชิงลบลดลงแต่ยังไม่กลายเป็นบวก
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.eia.p015
    topics:
      - engineering.environmental.eia
    difficulty: 4
    type: code
    stem: เขียนฟังก์ชัน `leopold_score(pairs)` ที่รับลิสต์ของคู่ (m, i) แต่ละคู่คือขนาดและความสำคัญของปัจจัยหนึ่ง แล้วคืนคะแนนรวมของกิจกรรมนั้นเป็นจำนวนเต็มหรือทศนิยม โดยคะแนนรวมคือผลรวมของ m × i
    starter: "def leopold_score(pairs):\n    pass\n"
    tests: 'r = leopold_score([(-6, 8), (-7, 9), (3, 6)])

      assert r is not None, "ฟังก์ชันยังไม่ได้คืนค่า ให้ใช้ return ไม่ใช่ print"

      assert r == -93, f"leopold_score ของ A1 ควรได้ -93 แต่ได้ {r}"

      assert leopold_score([(2, 6), (4, 7), (5, 8)]) == 80, "กิจกรรม A3 ควรได้ 80 (คูณ m กับ i ของแต่ละปัจจัยก่อนรวม)"

      assert leopold_score([]) == 0, "ไม่มีปัจจัยควรได้ 0"

      '
    reference: "def leopold_score(pairs):\n    return sum(m * i for m, i in pairs)\n"
    hints:
      - ใช้ลูปหรือ sum พร้อมนิพจน์ m * i สำหรับแต่ละคู่
      - คืนค่าด้วย return และรองรับกรณีลิสต์ว่าง
    solution: คืนค่า sum(m * i for m, i in pairs) ซึ่งจะได้ 0 สำหรับลิสต์ว่างโดยอัตโนมัติ
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.eia.p016
    topics:
