id: physics.kinematics.velocity
subject: physics
title: { th: การกระจัดและความเร็ว, en: Displacement and velocity }
summary: แยกปริมาณสเกลาร์กับเวกเตอร์ การกระจัดบอกการเปลี่ยนตำแหน่งพร้อมทิศทาง และความเร็วเฉลี่ยคือการกระจัดหารด้วยเวลา ซึ่งต่างจากอัตราเร็ว
difficulty: 3
minutes: 30
prerequisites: [physics.kinematics.speed, math.number.integers]
encompasses:
  - { id: physics.kinematics.speed, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
glossary:
  - { term: ปริมาณสเกลาร์, definition: "ปริมาณที่มีแต่ขนาด ไม่มีทิศทาง เช่น ระยะทาง อัตราเร็ว เวลา มวล" }
  - { term: ปริมาณเวกเตอร์, definition: "ปริมาณที่มีทั้งขนาดและทิศทาง เช่น การกระจัด ความเร็ว ความเร่ง แรง" }
  - { term: การกระจัด, definition: "การเปลี่ยนตำแหน่งจากจุดเริ่มต้นไปจุดสุดท้าย วัดเป็นเส้นตรงพร้อมทิศทาง $\\Delta x = x_2 - x_1$" }
  - { term: ความเร็วเฉลี่ย, definition: "การกระจัดหารด้วยเวลาที่ใช้ $\\bar{v} = \\Delta x / \\Delta t$ มีทิศเดียวกับการกระจัด" }
flashcards:
  - { front: "ระยะทางกับการกระจัดต่างกันอย่างไร", back: "ระยะทางคือความยาวเส้นทางที่เคลื่อนที่จริง (สเกลาร์) การกระจัดคือเส้นตรงจากจุดเริ่มถึงจุดสุดท้ายพร้อมทิศทาง (เวกเตอร์)" }
  - { front: "วิ่งรอบสนามครบ 1 รอบกลับจุดเดิม การกระจัดเป็นเท่าใด", back: "ศูนย์ เพราะตำแหน่งสุดท้ายเท่ากับตำแหน่งเริ่มต้น" }
  - { front: "สูตรการกระจัดในหนึ่งมิติ", back: "$\\Delta x = x_2 - x_1$ (ตำแหน่งสุดท้ายลบตำแหน่งเริ่มต้น)" }
  - { front: "ความเร็วเป็นลบหมายความว่าอะไร", back: "วัตถุเคลื่อนที่ในทิศที่เราตั้งให้เป็นลบ เครื่องหมายบอกทิศ ไม่ได้แปลว่าช้า" }
