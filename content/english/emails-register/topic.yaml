id: english.writing.emails-register
subject: english
title: { th: "อีเมลและข้อความโต้ตอบแบบทางการและไม่เป็นทางการ (ระดับ B2)", en: "Formal and informal emails and messages (B2)" }
summary: เลือกระดับภาษาของอีเมลให้ตรงกับผู้รับ ตั้งแต่คำขึ้นต้น คำขอร้อง การปฏิเสธ การขอโทษ ไปจนถึงการปรับข้อความเดียวกันให้เข้ากับอาจารย์ เพื่อน และลูกค้า
difficulty: 5.5
minutes: 45
prerequisites: [english.writing.notices-announcements, english.culture.politeness]
encompasses:
  - { id: english.writing.notices-announcements, weight: 0.3 }
  - { id: english.culture.politeness, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: register-scale.svg
    alt: "ตารางสามคอลัมน์และสามแถว คอลัมน์คือระดับทางการ กึ่งทางการ และไม่เป็นทางการ แถวคือคำขึ้นต้น คำขอ และคำลงท้าย ระดับทางการใช้ Dear Professor Chen, ขอให้ส่งแบบฟอร์มแบบอ้อม และ Yours sincerely, ระดับกึ่งทางการใช้ Hello Mr Lee, Could you send the form? และ Best regards, ระดับไม่เป็นทางการใช้ Hi Anna, Can you send the form? และ Cheers,"
    caption: "ระดับภาษาในอีเมลสามระดับ"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.writing.emails-register.p001, prompt: "คำขึ้นต้นสำหรับผู้รับที่ไม่รู้ชื่อ" }
  - type: worked-example
    title: ปรับข้อความเดียวกันให้เข้ากับผู้รับสองคน
    problem: "คุณต้องการขอตารางสอบจากอาจารย์ที่ยังไม่สนิท และขอตารางสอบเดียวกันจากเพื่อนร่วมห้อง โดยต้องเขียนสองฉบับให้เหมาะกับผู้รับแต่ละคน"
    steps:
      - text: "ข้อความต้นทาง: *Send me the exam timetable.*"
        why: "ประโยคนี้เป็นคำสั่งตรง ๆ ใช้กับอาจารย์ไม่ได้ ต้องปรับทั้งคำขึ้นต้น คำขอ และคำลงท้าย"
      - text: "ฉบับอาจารย์: *Dear Mr Lee,* ... *Would it be possible to send me the exam timetable?* ... *Yours sincerely,*"
        why: "ใช้ชื่อผู้รับ ใช้คำขออ้อม และลงท้ายด้วย Yours sincerely เพราะเปิดด้วยชื่อ"
      - text: "ฉบับเพื่อน: *Hi Nok,* ... *Can you send me the exam timetable? Thanks!*"
        why: "เพื่อนสนิทรับคำขอแบบตรงได้ และ Thanks! เป็นคำลงท้ายแบบไม่เป็นทางการ"
      - text: "สังเกตว่าเนื้อหาเหมือนกันทั้งสองฉบับ ต่างกันที่คำขึ้นต้น คำขอ และคำลงท้ายเท่านั้น"
    answer: "ฉบับอาจารย์เปิดด้วย Dear Mr Lee และขอแบบอ้อม ฉบับเพื่อนเปิดด้วย Hi Nok และขอแบบตรง"
  - { type: check, problem: english.writing.emails-register.p005, prompt: "ประโยคขอร้องแบบไหนที่ให้เกียรติผู้รับที่สุด" }
  - type: worked-example
    title: เขียนประโยคปฏิเสธคำเชิญอย่างสุภาพ
    problem: "มีคนเชิญคุณไปงานสัมมนาวันอังคารที่ 24 พฤศจิกายน แต่วันนั้นคุณต้องสอน จึงอยากปฏิเสธและขอให้ส่งสไลด์มาให้แทน"
    steps:
      - text: "เริ่มด้วยการขอบคุณ: *Thank you for inviting me to the seminar on 24 November.*"
        why: "ขอบคุณก่อนปฏิเสธ เพื่อไม่ให้ผู้รับรู้สึกว่าเราไม่สนใจ"
      - text: "บอกว่าทำไม่ได้ สั้น ๆ: *I'm afraid I won't be able to attend, because I have a class that day.*"
        why: "I'm afraid เป็นสำนวนที่ทำให้การปฏิเสธนุ่มนวล และเหตุผลสั้น ๆ ก็เพียงพอ"
      - text: "เสนอทางเลือก: *Would it be possible to receive the slides afterwards?*"
        why: "Would it be possible ทำให้ข้อความเป็นคำขอ ไม่ใช่คำสั่ง"
      - text: "ปิดด้วยคำลงท้ายกึ่งทางการ: *Best regards,* ตามด้วยชื่อของคุณ"
        why: "ผู้จัดงานเคยติดต่อกันมาแล้ว จึงใช้ Best regards ได้ ไม่จำเป็นต้องทางการมาก"
    answer: "Thank you for inviting me to the seminar on 24 November. I'm afraid I won't be able to attend, because I have a class that day. Would it be possible to receive the slides afterwards? Best regards, (ชื่อของคุณ)"
glossary:
  - { term: register, definition: "ระดับภาษา การเลือกคำและรูปประโยคให้เหมาะกับผู้อ่านและสถานการณ์" }
  - { term: formal, definition: "ทางการ ใช้กับผู้ใหญ่ ผู้มีอำนาจ หรือคนที่ยังไม่รู้จักดี" }
  - { term: informal, definition: "ไม่เป็นทางการ ใช้กับเพื่อนสนิทหรือคนในครอบครัว" }
  - { term: salutation, definition: "คำขึ้นต้นของจดหมายหรืออีเมล เช่น Dear Mr Lee, หรือ Hi Anna," }
  - { term: sign-off, definition: "คำลงท้ายก่อนชื่อผู้ส่ง เช่น Yours sincerely, หรือ Cheers," }
  - { term: softener, definition: "คำที่ทำให้คำขอหรือการปฏิเสธนุ่มนวลขึ้น เช่น I'm afraid, would it be possible" }
flashcards:
  - { front: "ใช้ Dear Sir or Madam เมื่อไร", back: "เมื่อไม่รู้ชื่อผู้รับ ลงท้ายด้วย Yours faithfully (แบบอังกฤษ)" }
  - { front: "Yours sincerely ใช้คู่กับอะไร", back: "การเปิดด้วยชื่อผู้รับ เช่น Dear Dr Kaew," }
  - { front: "ประโยคขอร้องที่สุภาพกว่า Can you send me ...?", back: "Would it be possible to send me ...? หรือ I would be grateful if you could ..." }
  - { front: "ปฏิเสธคำเชิญอย่างสุภาพใช้โครงสร้างอะไร", back: "ขอบคุณ + I'm afraid I won't be able to attend + ทางเลือกหรือความหวังดี" }
