problems:
  - id: management.public.public-policy.p001
    topics: [management.public.public-policy]
    difficulty: 1
    type: order
    stem: "เรียงขั้นของวงจรนโยบายสาธารณะจากก่อนไปหลัง"
    items:
      - "ปัญหาได้รับความสนใจและเข้าสู่วาระ"
      - "กำหนดทางเลือกและวิเคราะห์ความเป็นไปได้"
      - "ผู้มีอำนาจตัดสินใจรับรองนโยบาย"
      - "หน่วยงานนำนโยบายไปปฏิบัติ"
      - "ติดตามและประเมินผลกระทบ"
      - "ปรับปรุง ขยาย หรือยุติ"
    hints:
      - "ต้องรู้ว่าปัญหาคืออะไรก่อนหาทางเลือก"
      - "การประเมินผลทำหลังจากนโยบายถูกนำไปใช้แล้ว"
    solution: "กำหนดวาระ → กำหนดทางเลือก → ตัดสินใจ → นำไปปฏิบัติ → ประเมินผล → ปรับปรุง ขยาย หรือยุติ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-policy.p002
    topics: [management.public.public-policy]
    difficulty: 1
    type: match
    stem: "เทศบาลแห่งหนึ่ง (สมมติ) อยากลดขยะพลาสติก จับคู่มาตรการกับประเภทของเครื่องมือนโยบาย"
    pairs:
      - { left: "ออกเทศบัญญัติห้ามใช้โฟมบรรจุอาหารในตลาดของเทศบาล", right: "กฎระเบียบ" }
      - { left: "ลดค่าเช่าแผงให้ร้านที่ใช้ภาชนะย่อยสลายได้", right: "แรงจูงใจทางการเงิน" }
      - { left: "ตั้งจุดรับคืนขวดพลาสติกที่เทศบาลดำเนินการเอง", right: "จัดบริการเอง" }
      - { left: "ทำป้ายและคลิปสั้นให้ความรู้เรื่องพลาสติกในแหล่งน้ำ", right: "ข้อมูลและการรณรงค์" }
    hints:
      - "บังคับหรือห้ามคือกฎระเบียบ"
      - "ให้เงินหรือลดค่าใช้จ่ายคือแรงจูงใจทางการเงิน"
    solution: "การห้ามเป็นกฎระเบียบ การลดค่าเช่าเป็นแรงจูงใจทางการเงิน จุดรับคืนเป็นบริการที่รัฐทำเอง และป้ายกับคลิปเป็นการให้ข้อมูล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-policy.p003
    topics: [management.public.public-policy]
    difficulty: 1
    type: mcq
    stem: "หลังข่าวรถรับส่งนักเรียนประสบอุบัติเหตุหลายครั้งในเดือนเดียว (สมมติ) หน่วยงานหลายแห่งเริ่มประชุมเรื่องมาตรฐานรถรับส่งนักเรียน เหตุการณ์นี้อยู่ในขั้นใดของวงจรนโยบาย"
    choices:
      - { id: a, text: "ก่อตัวของปัญหาและกำหนดวาระ", correct: true }
      - { id: b, text: "นำนโยบายไปปฏิบัติ", feedback: "ยังไม่มีนโยบายที่ตัดสินใจแล้วให้นำไปปฏิบัติ" }
      - { id: c, text: "ประเมินผลนโยบาย", feedback: "ยังไม่มีนโยบายใหม่ให้ประเมิน" }
      - { id: d, text: "ยุตินโยบาย", feedback: "เหตุการณ์นี้เป็นจุดเริ่ม ไม่ใช่จุดจบของนโยบาย" }
    hints:
      - "เหตุการณ์ที่สะเทือนใจทำให้ปัญหาได้รับความสนใจ"
      - "ขั้นแรกของวงจรคืออะไร"
    solution: "เหตุการณ์ที่เป็นข่าวทำให้ปัญหาถูกหยิบขึ้นมาเป็นวาระของหน่วยงาน จึงเป็นขั้นก่อตัวของปัญหาและกำหนดวาระ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-policy.p004
    topics: [management.public.public-policy]
    difficulty: 2
    type: numeric
    stem: "โครงการหนึ่งจะให้ผลประโยชน์ 1,000,000 บาทในอีก 3 ปีข้างหน้า ถ้าอัตราคิดลด 4% ต่อปี ผลประโยชน์นี้มีมูลค่าปัจจุบันกี่บาท"
    answer: { value: 888996.36, unit: บาท, tolerance: 10 }
    hints:
      - "$PV = X \\div (1+r)^t$"
      - "หารด้วย $1.04^3$"
    misconceptions:
      - { match: 880000, feedback: "หักแบบไม่ทบต้น (4% × 3 = 12%) ต้องหารด้วย $1.04^3$" }
      - { match: 1124864, feedback: "คูณด้วย $1.04^3$ ซึ่งเป็นการหามูลค่าในอนาคต ไม่ใช่มูลค่าปัจจุบัน" }
    solution: "$1{,}000{,}000 \\div 1.04^3 = 1{,}000{,}000 \\div 1.124864 \\approx 888{,}996$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-policy.p005
    topics: [management.public.public-policy]
    difficulty: 2
    type: numeric
    stem: "โครงการศูนย์ดูแลผู้สูงอายุกลางวันของเทศบาล (สมมติ) มีมูลค่าปัจจุบันของผลประโยชน์ 150 ล้านบาท และมูลค่าปัจจุบันของต้นทุน 120 ล้านบาท อัตราส่วนผลประโยชน์ต่อต้นทุน (B/C) เป็นเท่าไร"
    answer: { value: 1.25, tolerance: 0.01 }
    hints:
      - "B/C = PV ผลประโยชน์ ÷ PV ต้นทุน"
      - "ผลประโยชน์เป็นตัวตั้ง"
    misconceptions:
      - { match: 0.8, feedback: "หารกลับด้าน ต้องเอาผลประโยชน์เป็นตัวตั้ง" }
      - { match: 30, feedback: "นั่นคือ NPV (150 − 120) ไม่ใช่อัตราส่วน" }
    solution: "$150 \\div 120 = 1.25$ มากกว่า 1 จึงคุ้มค่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-policy.p006
    topics: [management.public.public-policy]
    difficulty: 2
    type: match
    stem: "อบจ. แห่งหนึ่ง (สมมติ) ศึกษาความเป็นไปได้ของโครงการรถโดยสารไฟฟ้าระหว่างอำเภอ จับคู่ข้อค้นพบกับด้านของความเป็นไปได้"
    pairs:
      - { left: "สถานีชาร์จที่มีรองรับรถได้เพียง 6 คันพร้อมกัน", right: "ด้านเทคนิค" }
      - { left: "ต้องตรวจสอบก่อนว่า อบจ. มีอำนาจจัดเดินรถเส้นทางนี้เองได้หรือไม่", right: "ด้านกฎหมาย" }
      - { left: "ค่าโดยสารที่เก็บได้ไม่พอค่าบำรุงรักษาแบตเตอรี่", right: "ด้านการเงิน" }
      - { left: "ยังไม่มีพนักงานที่ซ่อมรถไฟฟ้าเป็น", right: "ด้านการบริหาร" }
      - { left: "ผู้ประกอบการรถสองแถวเดิมกังวลว่าจะเสียรายได้", right: "ด้านการยอมรับของสังคม" }
    hints:
      - "อำนาจตามกฎหมายเป็นด้านกฎหมาย คนและหน่วยงานที่จะทำงานเป็นด้านการบริหาร"
      - "ผู้ที่ได้รับผลกระทบและความรู้สึกของชุมชนเป็นด้านสังคม"
    solution: "อุปกรณ์คือเทคนิค อำนาจคือกฎหมาย รายรับรายจ่ายคือการเงิน คนที่จะดูแลคือการบริหาร และความกังวลของผู้ได้รับผลกระทบคือการยอมรับของสังคม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-policy.p007
    topics: [management.public.public-policy]
    difficulty: 3
    type: numeric
    stem: "โครงการระบบน้ำประปาหมู่บ้าน (สมมติ) ลงทุน 10 ล้านบาทในปีที่ 0 ให้ผลประโยชน์สุทธิปีละ 4 ล้านบาท ในปีที่ 1 ถึง 3 อัตราคิดลด 6% NPV เป็นกี่ล้านบาท"
    answer: { value: 0.692, unit: ล้านบาท, tolerance: 0.01 }
    hints:
      - "หา PV ของ 4 ล้านบาทในแต่ละปี แล้วรวม"
      - "$NPV = -10 + \\frac{4}{1.06} + \\frac{4}{1.06^2} + \\frac{4}{1.06^3}$"
    misconceptions:
      - { match: 2, feedback: "รวมเงินโดยไม่คิดลด ($3 \\times 4 - 10$)" }
      - { match: 12, feedback: "รวมผลประโยชน์แต่ลืมหักเงินลงทุน และยังไม่ได้คิดลด" }
    solution: "$\\frac{4}{1.06} + \\frac{4}{1.06^2} + \\frac{4}{1.06^3} \\approx 3.774 + 3.560 + 3.358 = 10.692$ NPV $\\approx 10.692 - 10 = 0.692$ ล้านบาท บวกเล็กน้อย จึงคุ้มแบบเฉียดฉิว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-policy.p008
    topics: [management.public.public-policy]
    difficulty: 3
    type: numeric
    stem: "จากกราฟ จังหวัดหนึ่งทำโครงการตั้งด่านชุมชนช่วงเทศกาล (สมมติ) ใช้วิธีผลต่างของผลต่าง ผลของโครงการต่ออัตราผู้เสียชีวิตต่อประชากรแสนคนเป็นเท่าไร (ตอบค่าติดลบถ้าลดลง)"
    figure:
      src: p-did.svg
      alt: "กราฟเส้นสองเส้น จังหวัดที่ทำโครงการ ปีก่อน 30 ปีหลัง 22 จังหวัดเปรียบเทียบ ปีก่อน 28 ปีหลัง 25 หน่วยผู้เสียชีวิตต่อประชากรแสนคน"
    answer: { value: -5, unit: ต่อแสนคน }
    hints:
      - "หาการเปลี่ยนแปลงของแต่ละจังหวัด (หลัง − ก่อน)"
      - "ผลของโครงการ = การเปลี่ยนแปลงของจังหวัดที่ทำ − การเปลี่ยนแปลงของจังหวัดเปรียบเทียบ"
    misconceptions:
      - { match: -8, feedback: "ดูเฉพาะก่อนกับหลังของจังหวัดที่ทำโครงการ จังหวัดเปรียบเทียบก็ลดลง 3 ด้วยเหตุอื่น ต้องหักออก" }
      - { match: -3, feedback: "นั่นคือการเปลี่ยนแปลงของจังหวัดเปรียบเทียบ" }
      - { match: -11, feedback: "บวกการเปลี่ยนแปลงสองจังหวัดเข้าด้วยกัน ต้องลบกัน" }
    solution: "จังหวัดที่ทำ $22 - 30 = -8$ จังหวัดเปรียบเทียบ $25 - 28 = -3$ ผลของโครงการ $-8 - (-3) = -5$ ต่อประชากรแสนคน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-policy.p009
    topics: [management.public.public-policy]
    difficulty: 3
    type: mcq
    stem: "นโยบายให้ อสม. คัดกรองความดันโลหิตในชุมชน (สมมติ) ได้ผลดีในบางตำบลแต่ไม่ได้ผลในอีกหลายตำบล การสำรวจพบว่าตำบลที่ไม่ได้ผล อสม. ไม่มีเครื่องวัดที่ใช้ได้และไม่รู้ว่าจะส่งต่อผู้ที่ความดันสูงไปที่ใด ข้อสรุปใดตรงที่สุด"
    choices:
      - { id: a, text: "ปัญหาอยู่ที่การนำนโยบายไปปฏิบัติ คือทรัพยากรไม่พอและขั้นตอนไม่ชัดสำหรับผู้ปฏิบัติ", correct: true }
      - { id: b, text: "นโยบายผิดตั้งแต่ต้น ควรยกเลิกทันที", feedback: "นโยบายได้ผลในบางตำบล ข้อมูลชี้ว่าปัญหาอยู่ที่การปฏิบัติ ไม่ใช่ตัวนโยบาย" }
      - { id: c, text: "ประชาชนในตำบลเหล่านั้นไม่สนใจสุขภาพ", feedback: "ข้อมูลที่พบเป็นเรื่องเครื่องมือและขั้นตอนของผู้ปฏิบัติ ไม่มีหลักฐานเรื่องความสนใจของประชาชน" }
      - { id: d, text: "ควรเพิ่มบทลงโทษ อสม. ที่คัดกรองได้น้อย", feedback: "ลงโทษโดยไม่แก้เรื่องเครื่องวัดและขั้นตอนส่งต่อจะไม่ทำให้ได้ผลดีขึ้น" }
    hints:
      - "ผู้ปฏิบัติระดับพื้นที่ต้องมีอะไรบ้างจึงทำงานได้"
      - "แยกระหว่างนโยบายที่ออกแบบผิดกับนโยบายที่ปฏิบัติไม่ได้"
    solution: "นโยบายเดียวกันได้ผลในบางพื้นที่ ข้อมูลชี้ว่าผู้ปฏิบัติขาดเครื่องมือและขั้นตอนส่งต่อ จึงเป็นปัญหาการนำไปปฏิบัติ ควรจัดเครื่องวัดและทำแนวทางส่งต่อให้ชัด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-policy.p010
    topics: [management.public.public-policy]
    difficulty: 3
    type: numeric
    stem: "ถนนเลี่ยงเมือง (สมมติ) ทำให้รถประหยัดเวลาเที่ยวละ 10 นาที มีรถใช้วันละ 8,000 เที่ยว ถ้าตีมูลค่าเวลาเดินทาง 60 บาทต่อชั่วโมง และคิดปีละ 365 วัน ผลประโยชน์ด้านเวลาต่อปีเป็นกี่บาท"
    answer: { value: 29200000, unit: บาท, tolerance: 1000 }
    hints:
      - "เวลาที่ประหยัดต่อวันเป็นชั่วโมง = 8,000 × 10 ÷ 60"
      - "คูณมูลค่าเวลาต่อชั่วโมงและจำนวนวัน"
    misconceptions:
      - { match: 1752000000, feedback: "ไม่ได้แปลงนาทีเป็นชั่วโมง (ใช้ 10 แทน 10/60)" }
      - { match: 80000, feedback: "นั่นคือผลประโยชน์ต่อวัน ยังไม่ได้คูณ 365" }
    solution: "ชั่วโมงที่ประหยัดต่อวัน $8{,}000 \\times 10 \\div 60 \\approx 1{,}333.3$ ชั่วโมง มูลค่าต่อวัน $1{,}333.3 \\times 60 = 80{,}000$ บาท ต่อปี $80{,}000 \\times 365 = 29{,}200{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-policy.p011
    topics: [management.public.public-policy]
    difficulty: 3
    type: match
    stem: "โครงการพัฒนาแหล่งน้ำชุมชน (สมมติ) เก็บตัวชี้วัดผลกระทบหลายตัว จับคู่ตัวชี้วัดกับด้าน"
    pairs:
      - { left: "รายได้เฉลี่ยของครัวเรือนเกษตรกรต่อปี", right: "เศรษฐกิจ" }
      - { left: "ร้อยละเด็กที่ต้องหยุดเรียนเพื่อช่วยหาน้ำ", right: "สังคม" }
      - { left: "จำนวนผู้ป่วยโรคอุจจาระร่วงต่อพันคน", right: "สาธารณสุข" }
      - { left: "ระดับน้ำใต้ดินในฤดูแล้ง", right: "สิ่งแวดล้อม" }
    hints:
      - "เงินและการทำมาหากินเป็นเศรษฐกิจ"
      - "การศึกษาและโอกาสของคนเป็นสังคม การป่วยเป็นสาธารณสุข"
    solution: "รายได้คือเศรษฐกิจ การได้เรียนหนังสือคือสังคม โรคอุจจาระร่วงคือสาธารณสุข ระดับน้ำใต้ดินคือสิ่งแวดล้อม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-policy.p012
    topics: [management.public.public-policy]
    difficulty: 4
    type: numeric
    stem: "ศูนย์ฟื้นฟูสมรรถภาพผู้พิการระดับอำเภอ (สมมติ) ลงทุน 80 ล้านบาทในปีที่ 0 ให้ผลประโยชน์สุทธิปีละ 15 ล้านบาท ในปีที่ 1 ถึง 8 อัตราคิดลด 6% NPV เป็นกี่ล้านบาท"
    answer: { value: 13.15, unit: ล้านบาท, tolerance: 0.1 }
    hints:
      - "ตัวคูณมูลค่าปัจจุบัน 8 ปีที่ 6% คือ $\\sum_{t=1}^{8} 1/1.06^t$"
      - "NPV = 15 × ตัวคูณ − 80"
    misconceptions:
      - { match: 40, feedback: "ไม่ได้คิดลด ($15 \\times 8 - 80$)" }
      - { match: 93.15, feedback: "หาค่า PV ของผลประโยชน์ได้ถูกแล้วแต่ลืมหักเงินลงทุน 80 ล้านบาท" }
    solution: "ตัวคูณ $\\sum_{t=1}^{8} 1/1.06^t \\approx 6.2098$ PV ผลประโยชน์ $15 \\times 6.2098 \\approx 93.15$ NPV $\\approx 93.15 - 80 = 13.15$ ล้านบาท"
