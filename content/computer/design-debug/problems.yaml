      - { match: 0, feedback: "ลองปี 2000: หาร 400 ลงตัวจึงเป็นปีอธิกสุริยคติ แต่ฟังก์ชันตอบว่าไม่ใช่" }
    solution: "คำตอบที่ถูก: 1900 ไม่ใช่, 2000 ใช่, 2023 ไม่ใช่, 2024 ใช่, 2100 ไม่ใช่ ฟังก์ชันตอบ: 1900 ไม่ใช่, 2000 ไม่ใช่, 2023 ไม่ใช่, 2024 ใช่, 2100 ไม่ใช่ ผิดปีเดียวคือ 2000 เพราะลืมกรณีหาร 400 ลงตัว แก้เป็น y % 4 == 0 and (y % 100 != 0 or y % 400 == 0)"
