      - "แผ่นสองแผ่นกางออกได้เมื่อมีประจุชนิดเดียวกัน"
    solution: "ประจุลบของแท่งผลักอิเล็กตรอนอิสระในจานให้เคลื่อนลงไปที่แผ่นโลหะบาง แผ่นทั้งสองจึงมีประจุลบและผลักกันจนกางออก ส่วนจานด้านบนเหลือประจุบวก (การเหนี่ยวนำ) ประจุรวมของอิเล็กโทรสโคปยังเป็นศูนย์"
