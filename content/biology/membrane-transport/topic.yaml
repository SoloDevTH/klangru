id: biology.cells.membrane-transport
subject: biology
title: { th: การลำเลียงสารเข้าและออกจากเซลล์, en: "Transport across the cell membrane" }
summary: โครงสร้างและสมบัติเลือกให้ผ่านของเยื่อหุ้มเซลล์ การแพร่ ออสโมซิส การแพร่แบบฟาซิลิเทต แอกทีฟทรานสปอร์ต เอกโซไซโทซิส และเอนโดไซโทซิส
difficulty: 5
minutes: 40
prerequisites: [biology.cells.cell-structure, biology.molecules.water-biomolecules]
encompasses:
  - { id: biology.cells.cell-structure, weight: 0.2 }
  - { id: biology.molecules.water-biomolecules, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: การลำเลียงผ่านเยื่อหุ้มเซลล์ 4 แบบ
    src: membrane-transport.svg
    alt: "เยื่อหุ้มเซลล์เป็นฟอสโฟลิพิดสองชั้นวางแนวนอน ด้านบนคือนอกเซลล์ ด้านล่างคือในเซลล์ แบ่งเป็น 4 ช่อง: การแพร่ธรรมดา โมเลกุล O₂ และ CO₂ จำนวนมากด้านนอกแพร่ผ่านชั้นลิพิดลงไปด้านในที่มีน้อย; การแพร่ผ่านโปรตีนช่อง ไอออนผ่านช่องระหว่างโปรตีนสองแท่งจากด้านที่มีมากไปด้านที่มีน้อย; การแพร่โดยโปรตีนตัวพา โมเลกุลกลูโคสรูปห้าเหลี่ยมจับกับโปรตีนตัวพาแล้วผ่านลงไปด้านในที่มีน้อย; แอกทีฟทรานสปอร์ต โปรตีนปั๊มใช้ ATP ลำเลียงไอออนจากด้านในที่มีน้อยขึ้นไปด้านนอก ลูกศรชี้ขึ้นสวนความเข้มข้น"
    caption: "สามแบบแรกไปตามความต่างของความเข้มข้นและไม่ใช้ ATP แบบสุดท้ายสวนความเข้มข้นจึงต้องใช้ ATP (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ทำนายทิศทางของน้ำ
    problem: "หยดเลือดลงในน้ำเกลือ 3% (เซลล์เม็ดเลือดแดงไอโซโทนิกกับน้ำเกลือ 0.9%) และวางเยื่อหอมหัวใหญ่ลงในน้ำกลั่น เซลล์ทั้งสองจะเปลี่ยนไปอย่างไร"
    steps:
      - text: "เทียบตัวถูกละลาย: น้ำเกลือ 3% มีตัวถูกละลายมากกว่าในเซลล์เม็ดเลือดแดง จึงเป็นไฮเปอร์โทนิก"
      - text: "น้ำเคลื่อนไปทางที่มีตัวถูกละลายมาก จึงออสโมซิสออกจากเซลล์เม็ดเลือดแดง เซลล์เหี่ยวย่น"
        why: "ออสโมซิสคือน้ำเคลื่อนไปหาด้านที่มีน้ำน้อย (ตัวถูกละลายมาก)"
      - text: "น้ำกลั่นไม่มีตัวถูกละลาย เป็นไฮโพโทนิกต่อเซลล์หอม น้ำจึงเข้าเซลล์"
      - text: "เซลล์หอมมีผนังเซลล์ต้านไว้ จึงเต่งแต่ไม่แตก"
    answer: "เซลล์เม็ดเลือดแดงเหี่ยวย่น ส่วนเซลล์หอมเต่ง"
  - { type: check, problem: biology.cells.membrane-transport.p004, prompt: "ลองใช้เหตุผลเดียวกันกับน้ำกลั่น" }
  - type: figure
    title: เซลล์ในสารละลายต่างความเข้มข้น
    src: osmosis-cells.svg
    alt: "ตาราง 2 แถว 3 คอลัมน์ คอลัมน์คือสารละลายไฮโพโทนิก (น้ำกลั่น) ไอโซโทนิก (น้ำเกลือ 0.9%) และไฮเปอร์โทนิก (น้ำเกลือเข้มข้น) แถวบนคือเซลล์เม็ดเลือดแดง: ในไฮโพโทนิกลูกศรน้ำชี้เข้า เซลล์บวมกลมและขอบขาดเป็นช่วงคือกำลังแตก ในไอโซโทนิกเซลล์เป็นแผ่นกลมเว้าตรงกลางปกติ ในไฮเปอร์โทนิกลูกศรน้ำชี้ออก เซลล์เล็กลงและขอบหยักเหี่ยวย่น แถวล่างคือเซลล์พืช: ในไฮโพโทนิกไซโทพลาซึมเต็มผนังเซลล์และแวคิวโอลใหญ่ เซลล์เต่ง ในไอโซโทนิกแวคิวโอลเล็กลงเล็กน้อย เซลล์อ่อนตัว ในไฮเปอร์โทนิกไซโทพลาซึมหดเป็นก้อนกลางเซลล์ แยกออกจากผนังเซลล์ เรียกว่าพลาสโมไลซิส"
    caption: "เซลล์พืชไม่แตกในน้ำกลั่นเพราะมีผนังเซลล์ (วาดโดยทีมคลังรู้)"
  - type: figure
    title: การลำเลียงสารโมเลกุลใหญ่
    src: bulk-transport.svg
    alt: "4 ช่องแสดงเยื่อหุ้มเซลล์เป็นเส้นแนวนอน ด้านบนคือนอกเซลล์ เอกโซไซโทซิส: เวสิเคิลที่บรรจุสารเคลื่อนขึ้นมารวมกับเยื่อหุ้มแล้วเปิดปล่อยสารออกไปด้านนอก ฟาโกไซโทซิส: เยื่อหุ้มยื่นออกไปสองข้างโอบแบคทีเรีย แล้วคอดเป็นเวสิเคิลที่มีแบคทีเรียอยู่ข้างใน พิโนไซโทซิส: เยื่อหุ้มเว้าเข้าเป็นแอ่งที่มีหยดของเหลวพร้อมโมเลกุลเล็ก แล้วคอดเป็นเวสิเคิลเล็ก ผ่านตัวรับ: แอ่งที่เว้าเข้ามีโปรตีนตัวรับรูปตัว Y เรียงอยู่ แต่ละตัวจับโมเลกุลสีเหลืองรูปข้าวหลามตัด"
    caption: "เอกโซไซโทซิสนำสารออก เอนโดไซโทซิสสามแบบนำสารเข้า ทั้งหมดใช้พลังงาน (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: หาความเข้มข้นที่ไอโซโทนิกจากผลการทดลอง
    problem: "แช่แท่งหัวไชเท้าในสารละลายซูโครส 0.1 โมลต่อลิตร มวลเพิ่ม 5% และใน 0.3 โมลต่อลิตร มวลลด 4% ประมาณความเข้มข้นที่ไอโซโทนิกกับเซลล์หัวไชเท้า"
    steps:
      - text: "ที่ 0.1 มวลเพิ่ม (น้ำเข้า สารละลายเป็นไฮโพโทนิก) ที่ 0.3 มวลลด (น้ำออก เป็นไฮเปอร์โทนิก) จุดไอโซโทนิกจึงอยู่ระหว่างสองค่านี้"
      - text: "จาก 0.1 ถึง 0.3 การเปลี่ยนแปลงลดลงจาก +5 ถึง −4 รวม 9 หน่วย"
      - text: "ต้องลด 5 หน่วยจึงถึงศูนย์: $0.1 + 0.2 \\times \\frac{5}{9} \\approx 0.21$ โมลต่อลิตร"
        why: "สมมติว่าระหว่างสองจุดกราฟเป็นเส้นตรง จึงแบ่งตามสัดส่วนได้"
    answer: "ประมาณ 0.21 โมลต่อลิตร"
  - { type: check, problem: biology.cells.membrane-transport.p009, prompt: "ทบทวนลักษณะของการแพร่แบบฟาซิลิเทต" }
glossary:
  - { term: เยื่อเลือกผ่าน, definition: "เยื่อที่ยอมให้สารบางชนิดผ่านได้ แต่บางชนิดผ่านไม่ได้ เช่น เยื่อหุ้มเซลล์" }
  - { term: ออสโมซิส, definition: "การแพร่ของน้ำผ่านเยื่อเลือกผ่าน จากด้านที่มีตัวถูกละลายน้อยไปด้านที่มีตัวถูกละลายมาก" }
  - { term: สารละลายไฮเปอร์โทนิก, definition: "สารละลายที่มีตัวถูกละลายมากกว่าในเซลล์ ทำให้น้ำออกจากเซลล์" }
  - { term: พลาสโมไลซิส, definition: "การที่ไซโทพลาซึมของเซลล์พืชหดตัวจนเยื่อหุ้มเซลล์หลุดจากผนังเซลล์ เมื่ออยู่ในสารละลายไฮเปอร์โทนิก" }
  - { term: แอกทีฟทรานสปอร์ต, definition: "การลำเลียงสารผ่านโปรตีนตัวพาจากความเข้มข้นต่ำไปสูง โดยใช้พลังงานจาก ATP" }
  - { term: เอนโดไซโทซิส, definition: "การนำสารโมเลกุลใหญ่เข้าเซลล์โดยเยื่อหุ้มเซลล์โอบสารแล้วคอดเป็นเวสิเคิล" }
flashcards:
  - { front: "การลำเลียงแบบใดไม่ใช้ ATP", back: "การแพร่ธรรมดา ออสโมซิส และการแพร่แบบฟาซิลิเทต (ไปตามความต่างของความเข้มข้น)" }
  - { front: "ฟาซิลิเทตต่างจากแอกทีฟทรานสปอร์ตอย่างไร", back: "ทั้งสองใช้โปรตีน แต่ฟาซิลิเทตไปตามเกรเดียนต์ไม่ใช้ ATP ส่วนแอกทีฟทรานสปอร์ตสวนเกรเดียนต์และใช้ ATP" }
  - { front: "เซลล์เม็ดเลือดแดงในสารละลายไฮโพโทนิก ไอโซโทนิก ไฮเปอร์โทนิก", back: "บวมแตก / ปกติ / เหี่ยวย่น" }
  - { front: "โซเดียมโพแทสเซียมปั๊ม", back: "ใช้ ATP 1 โมเลกุล ปั๊ม Na⁺ ออก 3 และ K⁺ เข้า 2 ไอออน" }
  - { front: "เอนโดไซโทซิส 3 แบบ", back: "ฟาโกไซโทซิส (ของแข็ง) พิโนไซโทซิส (ของเหลว) และผ่านตัวรับ (สารจำเพาะ)" }
