    stem: "ผู้ใหญ่อายุ 40 ปี หนัก 80 กิโลกรัม สูง 180 เซนติเมตร ตามเกณฑ์ผู้ใหญ่ชาวเอเชีย อยู่ในช่วงใด"
    choices:
      - { id: a, text: "น้ำหนักเกิน (อ้วนระดับ 1) เพราะ BMI ประมาณ 24.7", correct: true }
      - { id: b, text: "ปกติ เพราะ BMI ประมาณ 24.7 ยังไม่ถึง 25", feedback: "BMI คำนวณถูก แต่ใช้ขอบ 25 ของเกณฑ์สากล เกณฑ์เอเชียเริ่มช่วงน้ำหนักเกินที่ 23.0" }
      - { id: c, text: "อ้วนระดับ 3 เพราะ BMI ประมาณ 44.4", feedback: "44.4 ได้จาก $80 \\div 1.80$ ซึ่งลืมยกกำลังสองส่วนสูง" }
      - { id: d, text: "ต่ำกว่าเกณฑ์ เพราะ BMI ประมาณ 0.0025", feedback: "ค่านี้มาจากการใช้ส่วนสูงเป็นเซนติเมตร ต้องเปลี่ยนเป็น 1.80 เมตรก่อน" }
    hints:
