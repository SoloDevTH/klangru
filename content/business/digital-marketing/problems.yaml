- id: business.marketing.digital-marketing.p019
  topics:
  - business.marketing.digital-marketing
  difficulty: 4
  type: mcq
  stem: ร้านหนึ่งพบว่า CAC เท่ากับ $180$ บาท แต่กำไรขั้นต้นจากการซื้อครั้งแรกเพียง $120$ บาท และลูกค้าส่วนใหญ่ไม่กลับมาซื้อซ้ำ ข้อใด **ช่วยแก้ปัญหาได้ตรงจุดที่สุด**
  choices:
  - id: a
    text: เพิ่มการซื้อซ้ำ เช่น บริการหลังการขาย และสื่อสารกับลูกค้าเดิมที่ยินยอม เพื่อเพิ่มมูลค่าลูกค้าตลอดอายุ
    correct: true
  - id: b
    text: เพิ่มงบโฆษณาเป็นสองเท่าด้วยวิธีเดิม
    feedback: ทุกลูกค้าใหม่ยังขาดทุน 60 บาท ยิ่งได้ลูกค้ามากยิ่งขาดทุนมาก
  - id: c
    text: เลิกวัดผลเพราะตัวเลขไม่ดี
    feedback: การวัดผลคือสิ่งที่ทำให้เห็นปัญหา
  - id: d
    text: ลดราคาสินค้าลงอีก
    feedback: ลดราคาทำให้กำไรต่อคำสั่งซื้อลดลง ปัญหาหนักขึ้น
  hints:
  - เทียบต้นทุนการได้ลูกค้ากับเงินที่ลูกค้าคืนให้ร้าน
  - ลูกค้าที่กลับมาซื้อซ้ำทำให้ CLV สูงขึ้น
  solution: ร้านเสียเงินได้ลูกค้ามา 180 บาท แต่ได้กำไรคืน 120 บาท ถ้าไม่ซื้อซ้ำก็ขาดทุน ทางแก้คือเพิ่ม CLV (ซื้อซ้ำ มูลค่าต่อคำสั่งซื้อ) หรือลด CAC (ปรับกลุ่มเป้าหมายและโฆษณา) การเพิ่มงบด้วยวิธีเดิมหรือลดราคาทำให้ขาดทุนมากขึ้น
