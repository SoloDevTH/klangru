<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" width="560" height="190" font-family="sans-serif" font-size="15">
  <title>range(1, 5) ให้ค่า 1, 2, 3, 4 ไม่รวม 5</title>
  <rect x="0" y="0" width="560" height="190" fill="#ffffff"/>
  <text x="20" y="32" text-anchor="start" font-size="18" fill="#15211e" font-weight="bold" font-family="monospace">for i in range(1, 5):</text>
  <rect x="22" y="62" width="56" height="56" rx="6" fill="#ffffff" stroke="#9aa8a4" stroke-width="1.5"/>
  <text x="50" y="99" text-anchor="middle" font-size="22" fill="#9aa8a4" font-weight="normal">0</text>
  <rect x="97" y="62" width="56" height="56" rx="6" fill="#e2f0ed" stroke="#0a6b60" stroke-width="2.5"/>
  <text x="125" y="99" text-anchor="middle" font-size="22" fill="#15211e" font-weight="bold">1</text>
  <rect x="172" y="62" width="56" height="56" rx="6" fill="#e2f0ed" stroke="#0a6b60" stroke-width="2.5"/>
  <text x="200" y="99" text-anchor="middle" font-size="22" fill="#15211e" font-weight="bold">2</text>
  <rect x="247" y="62" width="56" height="56" rx="6" fill="#e2f0ed" stroke="#0a6b60" stroke-width="2.5"/>
  <text x="275" y="99" text-anchor="middle" font-size="22" fill="#15211e" font-weight="bold">3</text>
  <rect x="322" y="62" width="56" height="56" rx="6" fill="#e2f0ed" stroke="#0a6b60" stroke-width="2.5"/>
  <text x="350" y="99" text-anchor="middle" font-size="22" fill="#15211e" font-weight="bold">4</text>
  <rect x="397" y="62" width="56" height="56" rx="6" fill="#ffffff" stroke="#9aa8a4" stroke-width="1.5"/>
  <text x="425" y="99" text-anchor="middle" font-size="22" fill="#4a5a56" font-weight="normal">5</text>
  <line x1="405" y1="66" x2="449" y2="114" stroke="#b4521f" stroke-width="2.5" stroke-opacity="0.55"/>
  <line x1="449" y1="66" x2="401" y2="114" stroke="#b4521f" stroke-width="2.5" stroke-opacity="0.55"/>
  <rect x="472" y="62" width="56" height="56" rx="6" fill="#ffffff" stroke="#9aa8a4" stroke-width="1.5"/>
  <text x="500" y="99" text-anchor="middle" font-size="22" fill="#9aa8a4" font-weight="normal">6</text>
  <text x="125" y="146" text-anchor="middle" font-size="14" fill="#0a6b60" font-weight="normal">เริ่มที่ 1</text>
  <text x="425" y="146" text-anchor="middle" font-size="14" fill="#b4521f" font-weight="normal">หยุดก่อน 5</text>
  <text x="20" y="178" text-anchor="start" font-size="15" fill="#15211e" font-weight="normal">วนทั้งหมด 5 − 1 = 4 รอบ: i = 1, 2, 3, 4</text>
</svg>
