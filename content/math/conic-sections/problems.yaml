    misconceptions:
      - { match: 4, feedback: "คิดว่าความสูงลดลงเป็นเส้นตรง แต่พาราโบลาลดลงช้าใกล้ยอดและเร็วใกล้ฐาน" }
      - { match: 2, feedback: "2 เมตรคือส่วนที่ลดลงจากยอด ต้องลบออกจาก 8" }
    solution: "$0 = 8 - 100k \\Rightarrow k = 0.08$ ที่ $x = 5$: $y = 8 - 0.08(25) = 6$ เมตร"
