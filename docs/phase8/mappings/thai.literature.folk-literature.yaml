  - { framework: th-core-2551-thai, indicators: ["ท 5.1 ป.6/2"], coverage: partial, note: "ลำดับขั้นการเล่านิทานพื้นบ้านและนิทานจากถิ่นกลางกับอีสาน แต่แอปตรวจการเล่าด้วยปากไม่ได้" }
  - { framework: th-core-2551-thai, indicators: ["ท 5.1 ม.4-6/5"], coverage: partial, note: "อธิบายภูมิปัญญาทางภาษา (คำคล้องจอง คำเก่า ทะนาน เบี้ย คด ใต้ถุน การเปรียบเทียบ) ครบ และสอนวิธีรวบรวม แต่การเก็บข้อมูลภาคสนามจริงทำในแอปไม่ได้" }
