  - id: health.movement.biomechanics-concepts.p014
    topics: [health.movement.biomechanics-concepts]
    difficulty: 4
    type: numeric
    stem: "นักเรียนมวล 40 กิโลกรัม กระโดดลงพื้นด้วยอัตราเร็ว 3 เมตรต่อวินาที ถ้าลงเข่าตรงตัวหยุดใน 0.05 วินาที แรงเฉลี่ยที่ขารับเป็นกี่นิวตัน (ใช้ $\\bar F = mv \\div t$ ตอบเป็นนิวตัน)"
    answer: { value: 2400, unit: N }
    misconceptions:
      - { match: 6, feedback: "6 ได้จาก 120 × 0.05 ต้องหารด้วยเวลา ไม่ใช่คูณ" }
      - { match: 120, feedback: "120 คือโมเมนตัม (kg·m/s) ต้องหารด้วยเวลาที่ใช้หยุดอีกครั้ง" }
    hints:
      - "หาโมเมนตัม mv ก่อน"
      - "นำโมเมนตัมหารด้วย 0.05"
    solution: "mv = 40 × 3 = 120 kg·m/s แรงเฉลี่ย = 120 ÷ 0.05 = 2,400 นิวตัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.biomechanics-concepts.p015
    topics: [health.movement.biomechanics-concepts]
    difficulty: 4
    type: mcq
    stem: "ปลาอยากรู้ว่าการเริ่มวิ่งแบบย่อตัวทำให้วิ่ง 30 เมตรเร็วขึ้นหรือไม่ ข้อใดเป็นการทดลองที่ยุติธรรมที่สุด"
    choices:
      - { id: a, text: "ให้เพื่อนกลุ่มเดียวกันวิ่งทั้งสองแบบ แบบละ 3 ครั้ง ในสนามเดิม จับเวลาด้วยนาฬิกาเดียวกัน แล้วเทียบค่าเฉลี่ย", correct: true }
      - { id: b, text: "ให้เพื่อนคนหนึ่งวิ่งแบบย่อตัว อีกคนวิ่งแบบยืน คนละ 1 ครั้ง", feedback: "คนต่างกันอาจวิ่งเร็วไม่เท่ากันอยู่แล้ว และครั้งเดียวอาจบังเอิญ" }
      - { id: c, text: "วิ่งแบบย่อตัวในสนามหญ้า และแบบยืนบนลู่ยาง", feedback: "เปลี่ยนพื้นด้วย จึงไม่รู้ว่าผลต่างเกิดจากท่าเริ่มหรือจากพื้น" }
    hints:
      - "เปลี่ยนเพียงสิ่งเดียว"
      - "ทำหลายครั้งเพื่อลดความบังเอิญ"
    solution: "การทดลองที่ยุติธรรมต้องให้คนเดิม สถานที่เดิม วิธีวัดเดิม เปลี่ยนเฉพาะท่าเริ่ม และทำหลายครั้งแล้วดูค่าเฉลี่ย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.biomechanics-concepts.p016
    topics: [health.movement.biomechanics-concepts]
    difficulty: 5
    type: numeric
    stem: "จากโจทย์เดียวกัน (มวล 40 กิโลกรัม อัตราเร็ว 3 เมตรต่อวินาที) ถ้านักเรียนงอเข่ายุบตัวจนใช้เวลาหยุด 0.2 วินาทีแทน 0.05 วินาที แรงเฉลี่ยลดลงกี่นิวตัน (ตอบเป็นนิวตัน)"
    answer: { value: 1800, unit: N }
    misconceptions:
      - { match: 600, feedback: "600 นิวตันคือแรงเฉลี่ยเมื่องอเข่า คำถามถามว่าลดลงเท่าไร (2,400 − 600)" }
      - { match: 4, feedback: "4 คือจำนวนเท่าที่แรงลดลง คำถามถามเป็นนิวตัน" }
    hints:
      - "หาแรงเฉลี่ยทั้งสองแบบ"
      - "เข่าตรง 120 ÷ 0.05 งอเข่า 120 ÷ 0.2 แล้วนำมาลบกัน"
    solution: "เข่าตรง 120 ÷ 0.05 = 2,400 N งอเข่า 120 ÷ 0.2 = 600 N ลดลง 2,400 − 600 = 1,800 N (เหลือเพียง 1 ใน 4)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.biomechanics-concepts.p017
    topics: [health.movement.biomechanics-concepts]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "วิเคราะห์การตบลูกวอลเลย์บอลกับการกระโดดยิงประตูบาสเกตบอล ข้อใดเป็นหลักการเคลื่อนไหวที่ทั้งสองทักษะใช้เหมือนกัน (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ย่อเข่าแล้วถีบพื้นพร้อมเหวี่ยงแขนขึ้นเพื่อกระโดดให้สูง", correct: true }
      - { id: b, text: "ส่งแรงต่อเนื่องจากลำตัว ไหล่ แขน ไปจนถึงข้อมือ", correct: true }
      - { id: c, text: "งอเข่าและสะโพกรับแรงตอนลงสู่พื้นด้วยสองเท้า", correct: true }
      - { id: d, text: "ตีลูกให้แรงที่สุดลงพื้นในแดนตรงข้าม", feedback: "การยิงประตูบาสเกตบอลต้องการความแม่นและแรงพอดี ไม่ใช่แรงที่สุด จุดมุ่งหมายต่างกัน" }
    hints:
      - "แยกทักษะเป็น ช่วงขึ้น ช่วงกลางอากาศ และช่วงลงพื้น"
      - "ดูหลักการใช้แรงและการรับแรงในแต่ละช่วง"
    solution: "ทั้งสองทักษะใช้การถีบพื้นและเหวี่ยงแขน (การใช้แรง) การส่งแรงต่อเนื่องถึงข้อมือ และการงอข้อต่อรับแรงตอนลง แต่ต่างกันที่จุดมุ่งหมาย: ตบเน้นแรงและมุมกด ยิงประตูเน้นความแม่นยำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.biomechanics-concepts.p018
    topics: [health.movement.biomechanics-concepts]
    difficulty: 5
    type: mcq
    stem: "ในการเล่นฟุตซอล นักกีฬาต้องวิ่งเร็วแล้วเปลี่ยนทิศทันทีเพื่อหลบคู่แข่ง แต่ลื่นล้มบ่อย ข้อแนะนำใดถูกต้องตามหลักความสมดุลขณะเคลื่อนที่มากที่สุด"
    choices:
      - { id: a, text: "ก่อนเปลี่ยนทิศ ซอยเท้าสั้นลง ย่อเข่าให้จุดศูนย์ถ่วงต่ำ แล้ววางเท้าด้านนอกให้กว้างเพื่อดันพื้นไปทางตรงข้ามกับทิศใหม่", correct: true }
      - { id: b, text: "วิ่งตัวตรงให้สูงที่สุดเพื่อมองเห็นสนาม", feedback: "จุดศูนย์ถ่วงสูงทำให้เสียสมดุลง่ายเมื่อเปลี่ยนทิศ" }
      - { id: c, text: "ก้าวยาวที่สุดตอนเปลี่ยนทิศ", feedback: "ก้าวยาวทำให้เท้าอยู่ไกลจากจุดศูนย์ถ่วงและควบคุมยาก ควรซอยเท้าสั้นก่อนเปลี่ยนทิศ" }
    hints:
      - "จะเปลี่ยนทิศต้องดันพื้นไปทางไหน"
      - "สมดุลขณะเคลื่อนที่ต้องให้เท้าตามจุดศูนย์ถ่วงทัน"
    solution: "ลดจุดศูนย์ถ่วงด้วยการย่อเข่า ซอยเท้าสั้นเพื่อควบคุม และวางเท้าด้านนอกกว้างเพื่อให้ฐานรองรับรับแรงและดันพื้นไปทางตรงข้ามกับทิศใหม่ (แรงปฏิกิริยาส่งตัวไปทิศใหม่)"
    license: CC-BY-SA-4.0
    ai_assisted: true
