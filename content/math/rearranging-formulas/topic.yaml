id: math.algebra.rearrange-formula
subject: math
title: { th: การจัดรูปสูตร, en: Rearranging formulas }
summary: เปลี่ยนตัวแปรที่ต้องการให้อยู่ข้างเดียวของสูตร เช่น จาก v = s/t เป็น s = vt โดยใช้หลักเดียวกับการแก้สมการ แล้วนำไปใช้กับสูตรวิทยาศาสตร์
difficulty: 3.5
minutes: 30
prerequisites: [math.algebra.linear-eq]
encompasses:
  - { id: math.algebra.linear-eq, weight: 0.5 }
  - { id: math.algebra.expressions, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: function-machine.svg
    alt: "แผนภาพเครื่องจักรสองแถว แถวบนเป็นทางไปจาก C ผ่านกล่องคูณ 9 หาร 5 บวก 32 ได้ F แถวล่างเป็นทางกลับจาก F ผ่านกล่องลบ 32 คูณ 5 หาร 9 ได้ C ลูกศรชี้จากขวาไปซ้าย"
    caption: "จัดรูปสูตรคือการเดินเครื่องจักรย้อนกลับ: ใช้การดำเนินการผกผันและกลับลำดับ"
  - type: worked-example
    title: จัดสูตรเส้นรอบรูปให้ความยาวอยู่ข้างเดียว
    problem: "สูตรเส้นรอบรูปสี่เหลี่ยมผืนผ้าคือ $P = 2l + 2w$ จัดสูตรให้ $l$ อยู่ข้างเดียว แล้วหาความยาวของสนามที่มีเส้นรอบรูป $260\\ \\mathrm{m}$ และกว้าง $50\\ \\mathrm{m}$"
    steps:
      - text: "$l$ ถูกคูณ 2 แล้วบวก $2w$ จึงแกะ $+2w$ ก่อน: ลบ $2w$ ทั้งสองข้าง ได้ $P - 2w = 2l$"
        why: "ชั้นที่ห่อทีหลัง (บวก $2w$) ต้องแกะก่อน"
      - text: "หาร 2 ทั้งสองข้าง: $l = \\dfrac{P - 2w}{2}$"
        why: "หารทั้งข้างซ้าย ไม่ใช่หารเฉพาะ $P$ จึงต้องมีวงเล็บหรือเขียนเป็นเศษส่วนทั้งก้อน"
      - text: "แทนค่า: $l = \\dfrac{260 - 2(50)}{2} = \\dfrac{160}{2} = 80\\ \\mathrm{m}$"
      - text: "ตรวจ: $2(80) + 2(50) = 160 + 100 = 260$ ✓"
    answer: "$l = \\dfrac{P - 2w}{2}$ (หรือ $\\dfrac{P}{2} - w$) สนามยาว $80\\ \\mathrm{m}$"
  - { type: check, problem: math.rearr.p001, prompt: "ตัวแปรถูกหาร ต้องแกะด้วยอะไร" }
  - type: worked-example
    title: จัดสูตรลูกตุ้มที่มีรากที่สอง
    problem: "คาบของลูกตุ้มอย่างง่ายคือ $T = 2\\pi\\sqrt{\\dfrac{L}{g}}$ จัดสูตรให้ความยาวเชือก $L$ อยู่ข้างเดียว แล้วหา $L$ เมื่อ $T = 1.5\\ \\mathrm{s}$ และ $g = 9.8\\ \\mathrm{m/s^2}$"
    steps:
      - text: "หาร $2\\pi$ ทั้งสองข้าง ให้รากอยู่ข้างเดียว: $\\dfrac{T}{2\\pi} = \\sqrt{\\dfrac{L}{g}}$"
        why: "ต้องแยกรากออกมาก่อนยกกำลังสอง ไม่เช่นนั้นจะต้องยกกำลังสองทั้ง $2\\pi$ ด้วยและพลาดง่าย"
      - text: "ยกกำลังสองทั้งสองข้าง: $\\dfrac{T^2}{4\\pi^2} = \\dfrac{L}{g}$"
        why: "การยกกำลังสองหักล้างรากที่สอง และ $(2\\pi)^2 = 4\\pi^2$"
      - text: "คูณ $g$ ทั้งสองข้าง: $L = \\dfrac{gT^2}{4\\pi^2}$"
      - text: "แทนค่า: $L = \\dfrac{9.8 \\times 1.5^2}{4\\pi^2} = \\dfrac{22.05}{39.48} \\approx 0.56\\ \\mathrm{m}$"
      - text: "ตรวจ: $2\\pi\\sqrt{\\tfrac{0.5585}{9.8}} \\approx 2\\pi(0.2387) \\approx 1.50\\ \\mathrm{s}$ ✓"
    answer: "$L = \\dfrac{gT^2}{4\\pi^2} \\approx 0.56\\ \\mathrm{m}$"
  - { type: check, problem: math.rearr.p003, prompt: "จัดสูตรพื้นที่ให้ความสูงอยู่ข้างเดียว" }
glossary:
  - { term: "สูตร", definition: "สมการที่บอกความสัมพันธ์ระหว่างปริมาณหลายตัว เช่น $v = \\dfrac{s}{t}$ บอกความสัมพันธ์ของอัตราเร็ว ระยะทาง และเวลา" }
  - { term: "ตัวแปรต้นเรื่อง", definition: "ตัวแปรที่อยู่ข้างเดียวทางซ้ายของสูตร เช่น ใน $s = vt$ ตัวแปรต้นเรื่องคือ $s$" }
  - { term: "การดำเนินการผกผัน", definition: "การดำเนินการที่หักล้างกัน ได้แก่ บวกกับลบ และคูณกับหาร ใช้แกะสิ่งที่ติดอยู่กับตัวแปร" }
flashcards:
  - { front: "จัด $v = \\dfrac{s}{t}$ ให้ $s$ อยู่ข้างเดียว", back: "คูณ $t$ ทั้งสองข้าง ได้ $s = vt$" }
  - { front: "จัด $A = \\tfrac{1}{2}bh$ ให้ $h$ อยู่ข้างเดียว", back: "คูณ 2 ทั้งสองข้าง ได้ $2A = bh$ แล้วหาร $b$ ได้ $h = \\dfrac{2A}{b}$" }
  - { front: "จัดรูปสูตรต่างจากแก้สมการอย่างไร", back: "ใช้หลักเดียวกันทุกอย่าง (ทำสิ่งเดียวกันทั้งสองข้าง) ต่างกันแค่คำตอบเป็นนิพจน์ที่มีตัวอักษร ไม่ใช่ตัวเลขตัวเดียว" }
  - { front: "ตรวจสูตรที่จัดรูปแล้วอย่างไร", back: "เลือกตัวเลขง่าย ๆ ที่เข้ากับสูตรเดิม แทนในสูตรใหม่ ถ้าได้ค่าตรงกัน แสดงว่าจัดรูปถูก" }
