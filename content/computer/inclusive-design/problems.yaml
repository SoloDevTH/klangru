      - { id: b, text: "รายงานความแม่นยำรวมของทุกกลุ่ม เพราะค่ารวมยังสูงอยู่", feedback: "ค่ารวมซ่อนปัญหาของกลุ่มที่ระบบทำได้แย่ ไม่ได้แก้อคติ" }
