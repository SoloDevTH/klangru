    figure: { src: at-two-steps.svg, alt: "กราฟความเร่ง a (m/s²) กับเวลา t (s) เป็นเส้นแนวนอนสองช่วง: a = 2 m/s² ตั้งแต่ 0 ถึง 3 s และ a = −1 m/s² ตั้งแต่ 3 ถึง 7 s" }
    answer: { value: 32, tolerance: 0.3, unit: m }
    hints:
      - "พื้นที่ใต้กราฟ $a$–$t$ ไม่ใช่การกระจัด ให้สร้างกราฟ $v$–$t$ ก่อน"
      - "ช่วงแรกความเร็วเพิ่มจาก $1$ เป็น $7\\ \\mathrm{m/s}$ ช่วงหลังลดจาก $7$ เป็น $3\\ \\mathrm{m/s}$"
      - "การกระจัดแต่ละช่วงคือพื้นที่สี่เหลี่ยมคางหมูใต้กราฟ $v$–$t$"
