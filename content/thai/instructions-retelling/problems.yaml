    text: รอครูพูดจบ แล้วยกมือถามอย่างสุภาพ
    correct: true
    feedback: ถูก ถามเมื่อไม่แน่ใจ และรอให้ผู้พูดพูดจบก่อน
  - id: b
    text: เดาเอาว่าเป็นหน้า ๒๔ แล้วทำไปเลย
    feedback: เดาอาจผิด ทำให้เสียเวลาทำผิดหน้า
  - id: c
    text: ตะโกนถามแทรกขณะครูกำลังพูด
    feedback: ควรรอให้ครูพูดจบก่อน การพูดแทรกเป็นมารยาทที่ไม่ดี
  - id: d
    text: ไม่ทำ เพราะไม่ได้ยิน
    feedback: การไม่ได้ยินไม่ใช่เหตุผลที่จะไม่ทำ ให้ถามก่อน
  hints:
  - หลังฟัง ถ้าไม่แน่ใจต้องทำอย่างไร
  - ถามได้ แต่ถามตอนไหนจึงสุภาพ
  solution: '**รอครูพูดจบ แล้วยกมือถาม** จะได้ทำงานถูกหน้า และไม่รบกวนผู้พูด'
