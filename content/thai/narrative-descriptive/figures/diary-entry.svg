<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" font-family="sans-serif">
<title>บันทึกประจำวันสมมุติของนักเรียน</title>
<defs></defs>
<rect x="0" y="0" width="860" height="320" fill="#fff"/>
<rect x="10.0" y="10.0" width="840.0" height="300.0" rx="10" fill="#fffdf5" stroke="#8d6e63" stroke-width="2"/>
<line x1="30.0" y1="62.0" x2="830.0" y2="62.0" stroke="#e0d6cc" stroke-width="1" stroke-linecap="round"/>
<line x1="30.0" y1="106.0" x2="830.0" y2="106.0" stroke="#e0d6cc" stroke-width="1" stroke-linecap="round"/>
<line x1="30.0" y1="150.0" x2="830.0" y2="150.0" stroke="#e0d6cc" stroke-width="1" stroke-linecap="round"/>
<line x1="30.0" y1="194.0" x2="830.0" y2="194.0" stroke="#e0d6cc" stroke-width="1" stroke-linecap="round"/>
<line x1="30.0" y1="238.0" x2="830.0" y2="238.0" stroke="#e0d6cc" stroke-width="1" stroke-linecap="round"/>
<line x1="30.0" y1="282.0" x2="830.0" y2="282.0" stroke="#e0d6cc" stroke-width="1" stroke-linecap="round"/>
<text x="30.0" y="54.0" font-size="17" text-anchor="start" fill="#5d4037" font-weight="bold">(ก)</text>
<text x="80.0" y="54.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">วันเสาร์ที่ 7 พฤศจิกายน 2569 ฟ้าครึ้ม ฝนตกบ่าย</text>
<text x="30.0" y="98.0" font-size="17" text-anchor="start" fill="#5d4037" font-weight="bold">(ข)</text>
<text x="80.0" y="98.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">วันนี้ฉันช่วยยายทำกระทงใบตองสามใบไว้ลอยในงานที่จะถึงนี้</text>
<text x="30.0" y="142.0" font-size="17" text-anchor="start" fill="#5d4037" font-weight="bold">(ค)</text>
<text x="80.0" y="142.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">ตอนแรกพับกลีบไม่สวย ใบตองฉีกขาดหลายครั้ง</text>
<text x="30.0" y="186.0" font-size="17" text-anchor="start" fill="#5d4037" font-weight="bold">(ง)</text>
<text x="80.0" y="186.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">ยายสอนให้เช็ดใบตองให้แห้งก่อน แล้วพับช้า ๆ</text>
<text x="30.0" y="230.0" font-size="17" text-anchor="start" fill="#5d4037" font-weight="bold">(จ)</text>
<text x="80.0" y="230.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">ใบที่สามสวยที่สุด ฉันภูมิใจมาก</text>
<text x="30.0" y="274.0" font-size="17" text-anchor="start" fill="#5d4037" font-weight="bold">(ฉ)</text>
<text x="80.0" y="274.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">ฉันได้เรียนรู้ว่างานฝีมือต้องใจเย็น พรุ่งนี้จะทำอีกใบให้น้อง</text>
<text x="830.0" y="300.0" font-size="13" text-anchor="end" fill="#777" font-weight="normal">(บันทึกสมมุติ)</text>
</svg>
