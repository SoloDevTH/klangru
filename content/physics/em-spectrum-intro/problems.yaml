  - id: physics.waves.em-spectrum-intro.p014
    topics: [physics.waves.em-spectrum-intro]
    difficulty: 4
    type: mcq
    stem: "ทำไมเจ้าหน้าที่รังสีเทคนิคจึงต้องหลบหลังผนังที่บุตะกั่วทุกครั้งที่ถ่ายภาพเอกซเรย์ให้ผู้ป่วย ทั้งที่ผู้ป่วยอยู่ในห้องได้"
    choices:
      - { id: a, text: "เจ้าหน้าที่ถ่ายภาพวันละหลายสิบครั้ง ปริมาณรังสีที่ทำให้แตกตัวเป็นไอออนจะสะสม ผนังตะกั่วดูดกลืนรังสีเอกซ์ได้ดี", correct: true }
      - { id: b, text: "รังสีเอกซ์อันตรายเฉพาะกับคนที่ไม่ป่วย", feedback: "รังสีเอกซ์มีผลต่อเซลล์ของทุกคนเหมือนกัน ผู้ป่วยรับรังสีเพราะประโยชน์ในการวินิจฉัยคุ้มกับความเสี่ยงเล็กน้อยครั้งเดียว" }
      - { id: c, text: "รังสีเอกซ์ทำให้เครื่องแต่งกายของเจ้าหน้าที่ร้อนจนไหม้", feedback: "ปริมาณรังสีเอกซ์ในการถ่ายภาพไม่ได้ทำให้ร้อน อันตรายมาจากการทำให้อะตอมแตกตัวเป็นไอออนและทำลาย DNA" }
    hints:
      - "รังสีเอกซ์ทำอะไรกับอะตอมในเซลล์"
      - "ผู้ป่วยถ่ายภาพครั้งเดียว เจ้าหน้าที่ถ่ายกี่ครั้งต่อวัน"
    solution: "รังสีเอกซ์ทำให้อะตอมแตกตัวเป็นไอออนและทำลาย DNA ความเสี่ยงเพิ่มตามปริมาณที่สะสม เจ้าหน้าที่ทำงานซ้ำทุกวันจึงต้องหลบหลังตะกั่วซึ่งดูดกลืนรังสีเอกซ์ได้ดี ส่วนผู้ป่วยรับเพียงครั้งเดียวในปริมาณน้อยที่คุ้มกับประโยชน์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.em-spectrum-intro.p015
    topics: [physics.waves.em-spectrum-intro]
    difficulty: 5
    type: numeric
    stem: "ช่วงพายุฤดูร้อน นักเรียนเห็นฟ้าแลบแล้วนับได้ 6 วินาทีจึงได้ยินเสียงฟ้าร้อง ถ้าเสียงเร็ว $340\\ \\mathrm{m/s}$ ฟ้าแลบอยู่ห่าง $2{,}040\\ \\mathrm{m}$ แสงจากฟ้าแลบใช้เวลาเดินทางระยะนี้กี่ไมโครวินาที ($1\\ \\mathrm{\\mu s} = 10^{-6}\\ \\mathrm{s}$ ใช้ $c = 3.0 \\times 10^8\\ \\mathrm{m/s}$ ตอบในหน่วย µs)"
    answer: { value: 6.8, tolerance: 0.07, unit: µs }
    hints:
      - "เวลา = ระยะทาง ÷ อัตราเร็วแสง"
      - "ได้เป็นวินาทีแล้วคูณ $10^6$ เพื่อเปลี่ยนเป็นไมโครวินาที"
    misconceptions:
      - { match: 6, feedback: "6 วินาทีคือเวลาของเสียง แสงเร็วกว่าเสียงมาก จึงใช้เวลาน้อยกว่ามาก" }
      - { match: 0.0000068, feedback: "นี่คือเวลาเป็นวินาที โจทย์ถามเป็นไมโครวินาที ต้องคูณ $10^6$" }
    solution: "$t = \\dfrac{2{,}040}{3.0 \\times 10^8} = 6.8 \\times 10^{-6}\\ \\mathrm{s} = 6.8\\ \\mu\\mathrm{s}$ น้อยกว่าเวลาของเสียงเกือบล้านเท่า จึงถือว่าเห็นฟ้าแลบทันที และใช้เวลาของเสียงประมาณระยะได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.em-spectrum-intro.p016
    topics: [physics.waves.em-spectrum-intro]
    difficulty: 5
    type: mcq
    stem: "คลื่นวิทยุจากโทรศัพท์มือถือกับรังสีแกมมาต่างก็เป็นคลื่นแม่เหล็กไฟฟ้า ทำไมรังสีแกมมาจึงทำลาย DNA ได้ แต่คลื่นวิทยุจากโทรศัพท์ไม่ทำให้อะตอมแตกตัวเป็นไอออน"
    choices:
      - { id: a, text: "รังสีแกมมามีความถี่สูงกว่ามาก พลังงานที่ส่งให้อะตอมแต่ละครั้งจึงสูงพอจะดึงอิเล็กตรอนออก", correct: true }
      - { id: b, text: "รังสีแกมมาเคลื่อนที่เร็วกว่าคลื่นวิทยุ จึงชนอะตอมแรงกว่า", feedback: "ในสุญญากาศคลื่นแม่เหล็กไฟฟ้าทุกชนิดเร็วเท่ากัน ความต่างอยู่ที่ความถี่" }
      - { id: c, text: "คลื่นวิทยุจากโทรศัพท์ผ่านร่างกายไม่ได้เลย", feedback: "คลื่นวิทยุผ่านเนื้อเยื่อได้บางส่วน แต่พลังงานที่ส่งให้อะตอมแต่ละครั้งต่ำเกินกว่าจะทำให้แตกตัวเป็นไอออน" }
    hints:
      - "อะไรเป็นตัวกำหนดพลังงานที่คลื่นแม่เหล็กไฟฟ้าส่งให้อะตอมแต่ละครั้ง"
      - "ความถี่ของรังสีแกมมาสูงกว่าคลื่นวิทยุกี่เท่าโดยประมาณ"
    solution: "พลังงานที่คลื่นแม่เหล็กไฟฟ้าส่งให้อะตอมแต่ละครั้งเพิ่มตามความถี่ รังสีแกมมามีความถี่สูงกว่าคลื่นวิทยุนับล้านล้านเท่า จึงดึงอิเล็กตรอนออกจากอะตอมได้ ส่วนคลื่นวิทยุทำได้เพียงทำให้ร้อนเล็กน้อย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.em-spectrum-intro.p017
    topics: [physics.waves.em-spectrum-intro]
    difficulty: 5
    type: numeric
    stem: "นักเรียนเอาจานหมุนออกจากเตาไมโครเวฟ วางแผ่นช็อกโกแลตแล้วอุ่นสั้น ๆ พบจุดที่ละลายห่างกัน $6.1\\ \\mathrm{cm}$ ซึ่งเท่ากับครึ่งหนึ่งของความยาวคลื่น ถ้าฉลากเตาบอกความถี่ $2.45\\ \\mathrm{GHz}$ อัตราเร็วของคลื่นที่วัดได้เป็นกี่ $\\times 10^8\\ \\mathrm{m/s}$ (ตอบเฉพาะตัวเลขหน้า $\\times 10^8$ ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 2.99, tolerance: 0.03, unit: "× 10^8 m/s" }
    hints:
      - "ความยาวคลื่น = 2 × ระยะห่างระหว่างจุดที่ละลาย และแปลงเป็นเมตร"
      - "$c = f\\lambda$ โดย $f = 2.45 \\times 10^9\\ \\mathrm{Hz}$"
    misconceptions:
      - { match: 1.49, feedback: "ดูเหมือนใช้ 6.1 cm เป็นความยาวคลื่นทั้งลูก ระยะระหว่างจุดร้อนเป็นเพียงครึ่งความยาวคลื่น" }
    solution: "$\\lambda = 2 \\times 0.061 = 0.122\\ \\mathrm{m}$ จึงได้ $c = f\\lambda = (2.45 \\times 10^9)(0.122) \\approx 2.99 \\times 10^8\\ \\mathrm{m/s}$ ใกล้อัตราเร็วแสง (ทดลองกับผู้ใหญ่ และห้ามเปิดเตาเปล่าโดยไม่มีอาหาร)"
    license: CC-BY-SA-4.0
    ai_assisted: true
