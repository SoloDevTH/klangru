    ai_assisted: true

  - id: earthscience.hazards.natural-hazards.p014
    topics: [earthscience.hazards.natural-hazards]
    difficulty: 4
    type: numeric
    stem: "น้ำท่วมขนาดหนึ่งเป็น \"น้ำท่วมรอบ 20 ปี\" คือมีโอกาสเกิด 1 ใน 20 ในแต่ละปี และแต่ละปีไม่ขึ้นต่อกัน โอกาสที่จะเกิดน้ำท่วมขนาดนี้อย่างน้อย 1 ครั้งในช่วง 10 ปีเป็นกี่เปอร์เซ็นต์ (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 40.1, tolerance: 0.3, unit: "%" }
    misconceptions:
      - { match: 50, feedback: "50% มาจาก 10 ÷ 20 ซึ่งนับซ้ำปีที่อาจเกิดมากกว่าหนึ่งครั้ง ต้องหาโอกาสที่ไม่เกิดเลยก่อน" }
      - { match: 59.9, feedback: "59.9% คือโอกาสที่ไม่เกิดเลยตลอด 10 ปี ต้องนำ 100% ลบออก" }
    hints:
      - "โอกาสที่ไม่เกิดในปีหนึ่งคือ 1 − 1/20 = 0.95"
      - "โอกาสที่ไม่เกิดเลย 10 ปีคือ 0.95 คูณกัน 10 ครั้ง แล้วเกิดอย่างน้อย 1 ครั้ง = 1 − ค่านั้น"
    solution: "โอกาสไม่เกิดในแต่ละปี 0.95 ไม่เกิดเลยใน 10 ปี $0.95^{10} \\approx 0.599$ โอกาสเกิดอย่างน้อย 1 ครั้ง $1 - 0.599 = 0.401$ หรือราว 40.1%"
