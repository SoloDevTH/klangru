id: math.stats.data-analysis
subject: math
title: { th: แผนภาพจุด แผนภาพต้น-ใบ และตำแหน่งที่ของข้อมูล, en: "Dot plots, stem-and-leaf plots and measures of position" }
summary: ตั้งคำถามทางสถิติ สร้างและอ่านแผนภาพจุดและแผนภาพต้นใบ เปรียบเทียบรูปร่างของข้อมูล หาควอร์ไทล์ เดไซล์ เปอร์เซ็นไทล์ แล้วแปลความหมายเพื่อตัดสินใจ
difficulty: 3.5
minutes: 40
prerequisites: [math.stats.data-display, math.stats.central-tendency]
encompasses:
  - { id: math.stats.data-display, weight: 0.3 }
  - { id: math.stats.central-tendency, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: rope-dot-plot.svg
    alt: "แผนภาพจุดความยาวของเชือกที่นักเรียน 12 คนตัดได้ หน่วยเป็นเมตร เส้นจำนวนจาก 1 ถึง 2 แบ่งทีละหนึ่งในสี่ จำนวนจุด: 1 เมตรมี 1 จุด, 1 กับหนึ่งในสี่มี 2 จุด, 1 กับครึ่งมี 4 จุด, 1 กับสามในสี่มี 3 จุด, 2 เมตรมี 2 จุด"
    caption: "ฐานนิยมคือ $1\\tfrac12$ เมตร พิสัยคือ 1 เมตร"
  - { type: check, problem: math.stats.data-analysis.p004, prompt: "ค่าน้อยที่สุดคือจุดซ้ายสุด ไม่ใช่ปลายเส้นจำนวน" }
  - type: figure
    src: back-to-back.svg
    alt: "แผนภาพต้นใบแบบหลังชนหลังของคะแนนสอบห้อง ก และห้อง ข ห้องละ 15 คน ต้นตรงกลางคือ 1, 2, 3, 4 ห้อง ก ทางซ้าย: ต้น 2 ใบ 2 5 8 ต้น 3 ใบ 1 3 4 6 6 8 ต้น 4 ใบ 0 1 3 4 7 9 ห้อง ข ทางขวา: ต้น 1 ใบ 8 ต้น 2 ใบ 1 4 6 7 9 ต้น 3 ใบ 0 2 3 5 5 7 9 ต้น 4 ใบ 2 6"
    caption: "ใบของห้อง ก เรียงจากต้นออกไปทางซ้าย ค่าน้อยอยู่ใกล้ต้น"
  - type: figure
    src: shapes.svg
    alt: "แผนภาพจุดสามชุด ชุดแรกสมมาตร จุดสูงสุดอยู่ตรงกลางและลดลงเท่ากันทั้งสองข้าง ชุดที่สองเบ้ขวา จุดกองทางซ้ายและหางยาวไปทางขวา ชุดที่สามเบ้ซ้าย จุดกองทางขวาและหางยาวไปทางซ้าย"
    caption: "เรียกชื่อความเบ้ตามทิศที่หางยาวออกไป"
  - type: worked-example
    title: ควอร์ไทล์เมื่อตำแหน่งไม่ลงตัว
    problem: "ความสูงของต้นกล้า 9 ต้น (cm): 12, 15, 16, 18, 21, 22, 25, 27, 30 หา $Q_1$ และ $Q_3$"
    steps:
      - text: "ข้อมูลเรียงแล้ว $N = 9$ ตำแหน่งของ $Q_1 = \\tfrac{1 \\times 10}{4} = 2.5$"
      - text: "ตัวที่ 2 คือ 15 ตัวที่ 3 คือ 16 ได้ $Q_1 = 15 + 0.5 \\times (16 - 15) = 15.5$"
        why: "ตำแหน่ง 2.5 อยู่กึ่งกลางระหว่างตัวที่ 2 กับ 3 ค่าจึงอยู่กึ่งกลางระหว่าง 15 กับ 16"
      - text: "ตำแหน่งของ $Q_3 = \\tfrac{3 \\times 10}{4} = 7.5$"
      - text: "ตัวที่ 7 คือ 25 ตัวที่ 8 คือ 27 ได้ $Q_3 = 25 + 0.5 \\times (27 - 25) = 26$"
    answer: "$Q_1 = 15.5$ cm และ $Q_3 = 26$ cm"
  - { type: check, problem: math.stats.data-analysis.p007, prompt: "หาตำแหน่งก่อน แล้วค่อยอ่านค่า" }
  - type: worked-example
    title: ใช้เปอร์เซ็นไทล์ตัดสินใจ
    problem: "เวลาเดินทางมาโรงเรียน 19 วัน (นาที) เรียงแล้วได้ 12, 14, 15, 15, 17, 18, 18, 20, 21, 22, 22, 24, 25, 25, 27, 28, 30, 33, 38 ควรออกจากบ้านก่อนเข้าเรียนกี่นาทีเพื่อให้มาทันประมาณ 9 ใน 10 วัน"
    steps:
      - text: "ต้องการค่าที่ประมาณ 90% ของวันใช้เวลาไม่เกินค่านี้ คือ $P_{90}$"
      - text: "ตำแหน่ง $= \\tfrac{90 \\times (19 + 1)}{100} = 18$"
      - text: "ข้อมูลตัวที่ 18 คือ 33 นาที"
      - text: "เทียบกับมัธยฐาน (ตำแหน่ง 10) ซึ่งเท่ากับ 22 นาที ถ้าเผื่อแค่ 22 นาทีจะสายประมาณครึ่งหนึ่งของวัน"
        why: "มัธยฐานแบ่งวันออกเป็นครึ่งที่เร็วกว่าและครึ่งที่ช้ากว่า"
    answer: "ออกจากบ้านก่อนเข้าเรียนอย่างน้อย 33 นาที"
glossary:
  - { term: คำถามทางสถิติ, definition: "คำถามที่คาดว่าคำตอบจะแตกต่างกัน ต้องเก็บข้อมูลหลายค่ามาตอบ" }
  - { term: แผนภาพจุด, definition: "การนำเสนอข้อมูลเชิงปริมาณโดยวางจุดหนึ่งจุดต่อข้อมูลหนึ่งค่าเหนือเส้นจำนวน" }
  - { term: แผนภาพต้นใบ, definition: "การนำเสนอข้อมูลที่แยกตัวเลขเป็นต้น (หลักหน้า) และใบ (หลักสุดท้าย) เห็นข้อมูลทุกตัวและเรียงลำดับแล้ว" }
  - { term: เปอร์เซ็นไทล์, definition: "ค่าที่แบ่งข้อมูลที่เรียงแล้วเป็น 100 ส่วนเท่ากัน P_r คือค่าที่ข้อมูลประมาณร้อยละ r มีค่าไม่เกินค่านี้" }
  - { term: เดไซล์, definition: "ค่าที่แบ่งข้อมูลที่เรียงแล้วเป็น 10 ส่วนเท่ากัน" }
  - { term: ข้อมูลเบ้ขวา, definition: "ข้อมูลที่กองอยู่ทางค่าน้อยและมีหางยาวไปทางค่ามาก" }
flashcards:
  - { front: "ตำแหน่งของ $P_r$", back: "$\\tfrac{r(N + 1)}{100}$ (ข้อมูลเรียงจากน้อยไปมาก)" }
  - { front: "$Q_1$, $Q_2$, $Q_3$ เท่ากับเปอร์เซ็นไทล์ใด", back: "$P_{25}$, $P_{50}$ (มัธยฐาน), $P_{75}$" }
  - { front: "ตำแหน่ง 12.8 อ่านค่าอย่างไร", back: "$x_{12} + 0.8\\,(x_{13} - x_{12})$" }
  - { front: "อยู่ที่เปอร์เซ็นไทล์ที่ 85 แปลว่าอะไร", back: "ประมาณร้อยละ 85 ของกลุ่มมีค่าไม่เกินเรา (ไม่ใช่ได้คะแนนร้อยละ 85)" }
