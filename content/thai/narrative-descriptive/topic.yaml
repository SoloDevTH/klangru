id: thai.composition.narrative-descriptive
subject: thai
title: { th: การเขียนเล่าเรื่อง บรรยาย และพรรณนา, en: "Narrative and descriptive writing" }
summary: เขียนเรื่องจากประสบการณ์และจินตนาการด้วยโครงเรื่อง บันทึกประจำวัน บรรยายสิ่งของให้ชัด พรรณนาด้วยประสาทสัมผัส เขียนชีวประวัติและอัตชีวประวัติ และผลิตงานเขียนของตน
difficulty: 3.5
minutes: 35
prerequisites: [thai.composition.word-choice]
encompasses:
  - { id: thai.composition.word-choice, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: story-mountain.svg
    alt: "เส้นโครงเรื่องรูปภูเขา 5 จุด จุดที่ 1 เปิดเรื่อง ตัวละคร ฉาก อยู่ซ้ายล่าง จุดที่ 2 ปมปัญหา เกิดปัญหา สูงขึ้น จุดที่ 3 จุดสูงสุด ตื่นเต้นที่สุด อยู่ยอดภูเขาตรงกลาง จุดที่ 4 คลี่คลาย ปัญหาหมดไป ต่ำลง จุดที่ 5 จบเรื่อง ได้เรียนรู้ อยู่ขวาล่าง"
    caption: "โครงเรื่องแบบภูเขา 5 ช่วง"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: five-senses.svg
    alt: "แผนภาพพรรณนาตลาดเช้าวันอาทิตย์ด้วยประสาทสัมผัส 5 ตา เห็น ผักสีเขียวสดวางเป็นกอง หู ได้ยิน เสียงแม่ค้าเรียกลูกค้าเจื้อยแจ้ว จมูก ได้กลิ่น กลิ่นข้าวเหนียวนึ่งหอมกรุ่น ลิ้น รับรส ปาท่องโก๋กรอบนอกนุ่มใน ผิว สัมผัส อากาศเช้าเย็นจนขนลุก"
    caption: "พรรณนาด้วยประสาทสัมผัสทั้ง 5"
  - type: worked-example
    title: เปลี่ยนบรรยายเป็นพรรณนา
    problem: "เปลี่ยนประโยค \"ฝนตกหนักตอนเย็น\" ให้เป็นการพรรณนาที่ผู้อ่านเห็นภาพและรู้สึกตาม"
    steps:
      - text: "ถามประสาทสัมผัส: เห็นอะไร ได้ยินอะไร ได้กลิ่นอะไร รู้สึกอย่างไรที่ผิว"
        why: "พรรณนาใช้รายละเอียดจากประสาทสัมผัส ไม่ใช่คำว่า มาก"
      - text: "เห็น: ท้องฟ้ามืดครึ้ม สายฝนเป็นม่านสีเทา · ได้ยิน: ฟ้าร้องครืน ๆ ฝนกระหน่ำหลังคาสังกะสี"
      - text: "ได้กลิ่น: กลิ่นดินหลังฝนลอยมา · สัมผัส: ละอองฝนเย็นเฉียบกระเซ็นถึงแขน"
      - text: "เลือก 2–3 อย่างที่เด่นที่สุด เรียงเป็นประโยคเดียวหรือสองประโยค"
    answer: "\"เย็นนั้นท้องฟ้ามืดครึ้ม ฟ้าร้องครืน ๆ แล้วฝนก็กระหน่ำหลังคาสังกะสีดังสนั่น ละอองฝนเย็นเฉียบกระเซ็นถึงแขน\""
  - { type: check, problem: thai.composition.narrative-descriptive.p001, prompt: "หาประโยคที่ใช้ประสาทสัมผัส" }
  - type: worked-example
    title: วางโครงเรื่องจากจินตนาการ
    problem: "วางโครงเรื่องสั้นเรื่อง \"ร่มวิเศษที่บินได้\" ให้ครบ 5 ช่วง"
    steps:
      - text: "เปิดเรื่อง: น้องฝ้ายได้ร่มสีเหลืองจากยาย เมื่อกางแล้วร่มพาลอยขึ้นฟ้าได้"
      - text: "ปมปัญหา: วันหนึ่งลมแรง ร่มพาฝ้ายลอยไปไกลจนหลงทาง"
        why: "เรื่องต้องมีปัญหา จึงน่าติดตาม"
      - text: "จุดสูงสุด: ฝนฟ้าคะนอง ร่มสั่นไหว ฝ้ายต้องตัดสินใจว่าจะทำอย่างไร"
      - text: "คลี่คลาย: ฝ้ายนึกถึงคำยายว่า หุบร่มครึ่งหนึ่งร่มจะลอยต่ำลง จึงค่อย ๆ ลงจอดที่ลานวัด แล้วถามทางกลับบ้าน"
        why: "ปัญหาคลี่คลายด้วยการกระทำของตัวละคร ไม่ใช่ความบังเอิญ"
      - text: "จบเรื่อง: ฝ้ายกลับถึงบ้าน และได้เรียนรู้ว่าต้องฟังคำแนะนำของผู้ใหญ่ก่อนออกผจญภัย"
    answer: "เปิดเรื่อง (ได้ร่มวิเศษ) → ปมปัญหา (ลมพาหลงทาง) → จุดสูงสุด (พายุ) → คลี่คลาย (หุบร่มลงจอด ถามทาง) → จบ (กลับบ้าน ได้เรียนรู้)"
  - { type: check, problem: thai.composition.narrative-descriptive.p005, prompt: "จุดสูงสุดอยู่กลางเรื่อง" }
glossary:
  - { term: บรรยาย, definition: "เขียนให้รู้ว่าสิ่งนั้นเป็นอย่างไร หรือเกิดอะไรขึ้นตามลำดับ อย่างชัดเจน" }
  - { term: พรรณนา, definition: "เขียนอย่างละเอียดให้ผู้อ่านเห็นภาพและรู้สึกตาม ด้วยประสาทสัมผัสและการเปรียบเทียบ" }
  - { term: โครงเรื่อง, definition: "ลำดับเหตุการณ์ของเรื่อง ตั้งแต่เปิดเรื่อง ปมปัญหา จุดสูงสุด คลี่คลาย ถึงจบเรื่อง" }
  - { term: บันทึกประจำวัน, definition: "การเขียนถึงเหตุการณ์ ความรู้สึก และสิ่งที่ได้เรียนรู้ในแต่ละวัน" }
  - { term: ชีวประวัติ, definition: "เรื่องชีวิตของบุคคลอื่น" }
  - { term: อัตชีวประวัติ, definition: "เรื่องชีวิตที่เจ้าของชีวิตเขียนเอง" }
flashcards:
  - { front: "บรรยาย ต่างจาก พรรณนา อย่างไร", back: "บรรยายให้รู้ชัด พรรณนาให้เห็นภาพและรู้สึกตาม" }
  - { front: "โครงเรื่องแบบภูเขา", back: "เปิดเรื่อง → ปมปัญหา → จุดสูงสุด → คลี่คลาย → จบเรื่อง" }
  - { front: "บันทึกประจำวันมีอะไร", back: "วันที่ เหตุการณ์สำคัญ ความรู้สึก สิ่งที่ได้เรียนรู้" }
  - { front: "ชีวประวัติ กับ อัตชีวประวัติ", back: "ชีวประวัติเล่าชีวิตผู้อื่น (เขา) อัตชีวประวัติเล่าชีวิตตนเอง (ฉัน)" }
