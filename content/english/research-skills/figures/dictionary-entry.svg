<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="sans-serif">
<title>Dictionary entry for bank</title>
<rect x="0" y="0" width="800" height="380" fill="#fff"/>
<rect x="170.0" y="20.0" width="470.0" height="340.0" rx="8" fill="#fffdf6" stroke="#8d6e63" stroke-width="2"/>
<text x="190.0" y="62.0" font-size="34" text-anchor="start" fill="#1f3c88" font-weight="bold">bank</text>
<text x="290.0" y="62.0" font-size="22" text-anchor="start" fill="#444" font-weight="normal">/bæŋk/</text>
<text x="380.0" y="62.0" font-size="20" text-anchor="start" fill="#7d3c98" font-weight="normal" font-style="italic">noun</text>
<text x="190.0" y="105.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">1  an organization that keeps and lends money</text>
<text x="190.0" y="133.0" font-size="16" text-anchor="start" fill="#555" font-weight="normal" font-style="italic">    She keeps her savings in a bank.</text>
<text x="190.0" y="168.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">2  the land along the side of a river or lake</text>
<text x="190.0" y="196.0" font-size="16" text-anchor="start" fill="#555" font-weight="normal" font-style="italic">    We had a picnic on the river bank.</text>
<text x="190.0" y="231.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">3  a place where something is stored for use</text>
<text x="190.0" y="259.0" font-size="16" text-anchor="start" fill="#555" font-weight="normal" font-style="italic">    a blood bank · a food bank</text>
<text x="190.0" y="300.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">verb  to put money into a bank</text>
<text x="190.0" y="328.0" font-size="16" text-anchor="start" fill="#555" font-weight="normal" font-style="italic">    I bank my pocket money every month.</text>
