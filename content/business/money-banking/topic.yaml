id: business.econ.money-banking
subject: business
title: { th: "เงิน ธนาคาร การกู้ยืม และสถาบันการเงิน", en: "Money, banks, borrowing and financial institutions" }
summary: "การแลกเปลี่ยนโดยวิธีต่าง ๆ หน้าที่ของเงิน บทบาทของธนาคารพาณิชย์ เงินฝากและการคุ้มครองเงินฝาก ผลดีผลเสียของการกู้ยืม สถาบันการเงินประเภทต่าง ๆ และธนาคารแห่งประเทศไทย"
difficulty: 3
minutes: 40
prerequisites: [business.econ.personal-budget, math.number.ratio-percent]
encompasses:
  - { id: math.number.ratio-percent, weight: 0.3 }
  - { id: business.econ.personal-budget, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: bank-flow.svg
    alt: "แผนภาพสามกล่องเรียงแนวนอน ผู้ฝากเงิน (ครัวเรือนที่มีเงินเหลือ ธุรกิจที่มีเงินสด) ส่งเงินฝากไปที่ธนาคารพาณิชย์ซึ่งเป็นตัวกลางทางการเงิน และได้ดอกเบี้ยเงินฝากกลับมา ธนาคารพาณิชย์ส่งเงินกู้ให้ผู้กู้ (ครอบครัวซื้อบ้าน ธุรกิจลงทุน) และได้ดอกเบี้ยเงินกู้กลับมา ด้านบนมีธนาคารแห่งประเทศไทย (นโยบายการเงิน กำกับดูแล ออกธนบัตร) ลูกศรเส้นประลงมากำกับดูแลธนาคารพาณิชย์ ข้อความใต้ภาพบอกว่าดอกเบี้ยเงินกู้สูงกว่าดอกเบี้ยเงินฝาก ส่วนต่างเป็นรายได้หลักของธนาคาร และเงินฝากได้รับความคุ้มครองไม่เกิน 1 ล้านบาทต่อผู้ฝากต่อสถาบันการเงิน"
    caption: "ธนาคารพาณิชย์เป็นตัวกลางระหว่างผู้ฝากกับผู้กู้"
  - { type: check, problem: business.econ.money-banking.p003, prompt: "เงินทำหน้าที่อะไรในแต่ละเหตุการณ์" }
  - type: worked-example
    title: "ฝากประจำ 6 เดือนกับการคุ้มครองเงินฝาก"
    problem: "ยายฝากเงินประจำ $6$ เดือน $30{,}000$ บาท ดอกเบี้ย $1.25\\%$ ต่อปี (สมมติ) เมื่อครบกำหนดได้ดอกเบี้ยเท่าไร และเงินก้อนนี้อยู่ในความคุ้มครองเงินฝากหรือไม่ ถ้ายายมีเงินฝากธนาคารนี้อยู่บัญชีเดียว"
    steps:
      - { text: "แปลงเวลาเป็นปี: $6$ เดือน $= \\dfrac{6}{12} = 0.5$ ปี", why: "อัตราดอกเบี้ยบอกเป็นต่อปี เวลาจึงต้องเป็นปีด้วย" }
      - { text: "ดอกเบี้ย $= 30{,}000 \\times 0.0125 \\times 0.5 = 187.5$ บาท" }
      - { text: "เงินรวมเมื่อครบกำหนด $= 30{,}000 + 187.5 = 30{,}187.5$ บาท" }
      - { text: "ยอดรวมไม่เกิน $1$ ล้านบาทต่อผู้ฝากต่อสถาบันการเงิน จึงได้รับความคุ้มครองเต็มจำนวน (ถ้าธนาคารอยู่ภายใต้กฎหมายคุ้มครองเงินฝาก)", why: "วงเงินคุ้มครองนับรวมทั้งเงินต้นและดอกเบี้ยทุกบัญชีในสถาบันการเงินเดียวกัน" }
    answer: "ดอกเบี้ย $187.5$ บาท ได้รับความคุ้มครองเต็มจำนวน"
  - type: worked-example
    title: "ผ่อนโทรศัพท์หรือเก็บเงินซื้อ"
    problem: "โทรศัพท์ราคา $36{,}000$ บาท ร้านให้ผ่อน $18$ เดือน ดอกเบี้ยแบบคงที่ $8\\%$ ต่อปี (สมมติ) หรือเก็บเงินเดือนละ $2{,}000$ บาทแล้วซื้อเงินสด เทียบค่างวดและเงินที่จ่ายเพิ่ม"
    steps:
      - { text: "ดอกเบี้ยรวม $= 36{,}000 \\times 0.08 \\times 1.5 = 4{,}320$ บาท", why: "$18$ เดือน $= 1.5$ ปี และแบบคงที่คิดจากเงินต้นเต็มก้อน" }
      - { text: "ค่างวด $= \\dfrac{36{,}000 + 4{,}320}{18} = 2{,}240$ บาท" }
      - { text: "ถ้าเก็บเงินเดือนละ $2{,}000$ บาท ครบ $18$ เดือนก็ซื้อเงินสดได้ ประหยัด $4{,}320$ บาท แต่ต้องรอ" }
      - { text: "ผลดีของการกู้คือได้ใช้ของทันที ผลเสียคือจ่ายเพิ่ม $4{,}320$ บาทและมีภาระผ่อน ควรเลือกผ่อนเมื่อจำเป็นต้องใช้จริงและผ่อนไหว" }
    answer: "ค่างวด $2{,}240$ บาท จ่ายเพิ่มจากราคาเงินสด $4{,}320$ บาท"
  - { type: check, problem: business.econ.money-banking.p007, prompt: "คุ้มครองต่อบัญชีหรือต่อธนาคาร" }
glossary:
  - { term: "การแลกเปลี่ยนสิ่งของโดยตรง", definition: "การนำสินค้าแลกกับสินค้าโดยไม่ใช้เงิน ต้องหาคนที่ต้องการของของกันและกันพอดี" }
  - { term: "สื่อกลางในการแลกเปลี่ยน", definition: "หน้าที่ของเงินที่ทุกคนยอมรับในการซื้อขายสินค้าและบริการ" }
  - { term: "ตัวกลางทางการเงิน", definition: "สถาบันที่รับเงินจากผู้ที่มีเงินเหลือแล้วส่งต่อให้ผู้ที่ต้องการเงิน เช่น ธนาคารพาณิชย์" }
  - { term: "ดอกเบี้ยแบบคงที่ (เงินต้นคงที่)", definition: "การคิดดอกเบี้ยจากเงินต้นทั้งก้อนตลอดอายุสัญญา แม้เงินต้นจะลดลงทุกงวด" }
  - { term: "สถาบันคุ้มครองเงินฝาก", definition: "หน่วยงานที่จ่ายคืนเงินฝากให้ผู้ฝากเมื่อสถาบันการเงินถูกปิด ภายในวงเงินคุ้มครองตามกฎหมาย" }
  - { term: "ธนาคารเฉพาะกิจของรัฐ", definition: "ธนาคารที่ตั้งตามกฎหมายเฉพาะเพื่อนโยบายของรัฐ เช่น ธนาคารออมสิน ธ.ก.ส. ธนาคารอาคารสงเคราะห์" }
  - { term: "อัตราดอกเบี้ยนโยบาย", definition: "อัตราดอกเบี้ยที่คณะกรรมการนโยบายการเงิน (กนง.) ของ ธปท. กำหนด เพื่อส่งผลต่ออัตราดอกเบี้ยในตลาดและเงินเฟ้อ" }
flashcards:
  - { front: "หน้าที่ของเงิน 4 ข้อ", back: "สื่อกลางในการแลกเปลี่ยน · หน่วยวัดมูลค่า · เครื่องเก็บรักษามูลค่า · มาตรฐานการชำระหนี้ในอนาคต" }
  - { front: "วงเงินคุ้มครองเงินฝาก (ปัจจุบัน)", back: "ไม่เกิน 1 ล้านบาทต่อผู้ฝาก 1 รายต่อสถาบันการเงิน 1 แห่ง รวมทุกบัญชี (เงินฝากสกุลบาท)" }
  - { front: "ค่างวดดอกเบี้ยแบบคงที่", back: "(เงินต้น + เงินต้น × อัตราต่อปี × จำนวนปี) ÷ จำนวนงวด" }
  - { front: "ธนาคารแห่งประเทศไทยทำอะไร", back: "นโยบายการเงิน (กนง.) · ออกธนบัตร · กำกับสถาบันการเงิน · ระบบการชำระเงิน · บริหารเงินสำรอง · ไม่รับฝากเงินจากประชาชน" }
