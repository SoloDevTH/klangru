  # ---------- สุขศึกษา: สุขภาพส่วนบุคคลและสังคม (AC9 HPE สาระ Personal, social and community health) ----------
  # ลำดับ 2
  - { id: health.mental.feelings-basics, title: "รู้จักอารมณ์ของตัวเอง บอกความรู้สึก และทำให้ใจสงบ", difficulty: 1, prereq: [health.family.family-and-self], indicators: ["au-ac9-hpe:AC9HPFP03", "au-ac9-hpe:AC9HP2P03", "au-ac9-hpe:AC9HP4P06"], scope: "สำหรับเด็กเล็ก (อนุบาลถึง ป.4) ชื่ออารมณ์พื้นฐาน ดีใจ เสียใจ โกรธ กลัว ตื่นเต้น เบื่อ ภูมิใจ และสัญญาณในร่างกาย (หน้าร้อน ใจเต้นแรง ท้องปั่นป่วน) ใช้คำพูด \"ฉันรู้สึก...เพราะ...\" บอกความรู้สึก สถานการณ์เดียวกันทำให้คนรู้สึกต่างกันได้ และเหตุผลที่อารมณ์ต่างกัน (ประสบการณ์ ความเหนื่อย ความหิว) ทุกอารมณ์ไม่ผิดแต่การแสดงออกเลือกได้ วิธีทำให้ใจสงบที่เหมาะกับวัย หายใจช้านับ 1–4 นับถึงสิบ ขอเวลาพัก บอกผู้ใหญ่ และสังเกตอารมณ์ของเพื่อนจากสีหน้าท่าทาง ฝึกเลือกวิธีรับมือจากสถานการณ์สั้นในโรงเรียนและที่บ้าน บอกว่าเมื่อไรต้องขอความช่วยเหลือจากผู้ใหญ่ที่ไว้ใจ ต่อยอดได้ใน health.mental.emotions-stress" }
  # ลำดับ 2
  - { id: health.mental.resilience-identity, title: "ตัวตน จุดแข็ง และความยืดหยุ่นทางใจเมื่อเจอความล้มเหลวและการเปลี่ยนแปลง", difficulty: 3, prereq: [health.family.family-and-self, health.family.friendships-relationships], indicators: ["au-ac9-hpe:AC9HP2P01", "au-ac9-hpe:AC9HP4P01", "au-ac9-hpe:AC9HP6P01", "au-ac9-hpe:AC9HP8P01", "au-ac9-hpe:AC9HP10P01", "au-ac9-hpe:AC9HP4P02", "au-ac9-hpe:AC9HP6P02", "au-ac9-hpe:AC9HP8P02", "au-ac9-hpe:AC9HP10P02"], scope: "ตัวตน (identity) ประกอบจากคุณลักษณะส่วนตัว ความชอบ ค่านิยม ความเชื่อ วัฒนธรรม ครอบครัว เพื่อน และสถานที่ และเราก็มีอิทธิพลต่อตัวตนของผู้อื่น (คำชม การล้อ การกีดกัน) การสร้างภาพลักษณ์ต่อตนเองเชิงบวกด้วยจุดแข็งและการพูดกับตัวเอง ความยืดหยุ่นทางใจ (resilience) เป็นทักษะที่ฝึกได้ มองความผิดพลาดเป็นข้อมูลเพื่อปรับปรุง ปัจจัยปกป้อง (คนที่ไว้ใจ ความสามารถที่ภูมิใจ การนอนและการดูแลตัวเอง) ตัวอย่างความสำเร็จหลังความล้มเหลวในการเรียนและกีฬา การเปลี่ยนแปลงและช่วงเปลี่ยนผ่าน (ย้ายโรงเรียน ขึ้นมัธยม ย้ายบ้าน ครอบครัวเปลี่ยน เข้าสู่วัยรุ่น การสูญเสีย) ผลต่อความรู้สึก แหล่งช่วยเหลือและกลยุทธ์รับมือ (วางแผนล่วงหน้า หาข้อมูล แบ่งเป้าหมายย่อย ขอความช่วยเหลือ) การประเมินว่ากลยุทธ์ใดได้ผลและปรับใช้ การช่วยเพื่อนที่กำลังเปลี่ยนผ่าน และสัญญาณที่ต้องพาไปหาผู้ใหญ่หรือโทร 1323 ไม่ใช้คำว่า \"growth mindset\" เป็นข้อเท็จจริงทางวิทยาศาสตร์ที่พิสูจน์แล้ว (หลักฐานเรื่องการแทรกแซงยังปะปน)" }
  # ลำดับ 2
  - { id: health.community.diversity-inclusion, title: "คุณค่าของความหลากหลาย อคติ การเลือกปฏิบัติ และการสร้างการมีส่วนร่วม", difficulty: 3.5, prereq: [health.sexuality.gender-and-respect], indicators: ["au-ac9-hpe:AC9HP4P03", "au-ac9-hpe:AC9HP4P05", "au-ac9-hpe:AC9HP6P05", "au-ac9-hpe:AC9HP8P05", "au-ac9-hpe:AC9HP10P05"], scope: "ความหลากหลายในชุมชนไทย (ชาติพันธุ์ ภาษา ศาสนา ความพิการ รูปแบบครอบครัว เพศ ฐานะ แรงงานข้ามชาติ) และผลต่อสุขภาวะ เมื่อคนรู้สึกเป็นส่วนหนึ่งหรือถูกกีดกัน ห่วงโซ่ ภาพเหมารวม → อคติ → การเลือกปฏิบัติ พร้อมตัวอย่าง ภาพเหมารวมมีผลต่อการเลือก ของเรา (เลือกกีฬา วิชา เพื่อน) อคติที่ไม่รู้ตัว วิธีท้าทายภาพเหมารวมและอคติของตนเอง การเป็นผู้ยืนข้างผู้ถูกกระทำ (upstander) แทนผู้ดูเฉย ๆ ข้อเสนอเพื่อการมีส่วนร่วมระดับบุคคล กลุ่ม และชุมชน (ปรับกิจกรรมให้ทุกคนเข้าร่วม ป้ายหลายภาษา ทางลาด) และการประเมินข้อเสนอด้วยเกณฑ์ กฎหมายไทยที่เกี่ยวข้องโดยสรุป (พ.ร.บ.ความเท่าเทียมระหว่างเพศ พ.ศ. 2558 พ.ร.บ.ส่งเสริมและพัฒนาคุณภาพชีวิตคนพิการ พ.ศ. 2550) และแหล่งช่วยเหลือเมื่อถูกเลือกปฏิบัติหรือกลั่นแกล้ง (1300 1387) เขียนโดยไม่ตีตรากลุ่มใดและให้ผู้เชี่ยวชาญตรวจ" }
  # ลำดับ 2
  - { id: health.family.respectful-relationships, title: "ความสัมพันธ์ที่เคารพกัน: ความเห็นอกเห็นใจ อำนาจ การบังคับ และการสื่อสารอย่างมั่นใจ", difficulty: 4, prereq: [health.family.friendships-relationships, health.sexuality.body-safety-consent, health.sexuality.gender-and-respect], indicators: ["au-ac9-hpe:AC9HP6P04", "au-ac9-hpe:AC9HP6P07", "au-ac9-hpe:AC9HP8P03", "au-ac9-hpe:AC9HP8P04", "au-ac9-hpe:AC9HP8P07", "au-ac9-hpe:AC9HP10P03", "au-ac9-hpe:AC9HP10P04", "au-ac9-hpe:AC9HP10P07"], scope: "สำหรับวัยรุ่น ความเคารพและความเห็นอกเห็นใจแสดงออกอย่างไรในคำพูดและการกระทำ อำนาจในความสัมพันธ์ (อายุ ความนิยม ฐานะ ร่างกาย ตำแหน่ง) ความต่างระหว่างการโน้มน้าว การกดดัน การบังคับ และการควบคุม (ตรวจโทรศัพท์ จำกัดการพบเพื่อน ขู่จะเลิกหรือทำร้ายตัวเอง) ภาพเหมารวมทางเพศที่ทำให้ยอมรับการควบคุม (เช่น \"หึงแปลว่ารัก\") และความเสมอภาคช่วยป้องกัน ความรุนแรง แบบการสื่อสารสามแบบ (ยอมตาม ก้าวร้าว มั่นใจและให้เกียรติ) ประโยค \"ฉัน...\" การขอ ให้ และปฏิเสธความยินยอม อย่างชัดเจน ความยินยอมต้องเต็มใจ ถอนได้ทุกเมื่อ และให้ไม่ได้เมื่อถูกข่มขู่ เมาหรือหมดสติ การบอกความต้องการและความเห็น ในความสัมพันธ์รวมถึงความสัมพันธ์ทางเพศโดยไม่ลงรายละเอียดทางเพศ วิเคราะห์สถานการณ์และเลือกคำตอบที่มั่นใจและให้เกียรติ แหล่งช่วยเหลือ 1300 1387 ศูนย์พึ่งได้ในโรงพยาบาลรัฐ และ 191 เมื่อมีอันตราย ต่อยอดจาก health.safety.violence-prevention ต้องให้ผู้เชี่ยวชาญเพศวิถีศึกษาตรวจก่อนเผยแพร่" }
  # ---------- สุขศึกษาและพลศึกษา: การเคลื่อนไหวและกิจกรรมทางกาย (AC9 HPE สาระ Movement and physical activity) ----------
  # ลำดับ 2
  - { id: health.fitness.active-lifestyle, title: "วิถีชีวิตกระฉับกระเฉง: คำแนะนำกิจกรรมทางกาย พฤติกรรมเนือยนิ่ง และกลยุทธ์เพิ่มการเคลื่อนไหว", difficulty: 3, prereq: [health.fitness.fitness-components], indicators: ["au-ac9-hpe:AC9HPFM03", "au-ac9-hpe:AC9HP2M03", "au-ac9-hpe:AC9HP4M04", "au-ac9-hpe:AC9HP4M05", "au-ac9-hpe:AC9HP4M06", "au-ac9-hpe:AC9HP6M04", "au-ac9-hpe:AC9HP6M05", "au-ac9-hpe:AC9HP6M06", "au-ac9-hpe:AC9HP8M05", "au-ac9-hpe:AC9HP8M06", "au-ac9-hpe:AC9HP10M04", "au-ac9-hpe:AC9HP10M05", "au-ac9-hpe:AC9HP10M06"], scope: "คำแนะนำกิจกรรมทางกายของ WHO (2020) สำหรับอายุ 5–17 ปีและของกรมอนามัย (อ้างฉบับที่ตรวจได้) พฤติกรรมเนือยนิ่งและเวลาหน้าจอ ระดับความหนักเบา ปานกลาง หนัก และการตอบสนองของร่างกาย (หายใจ ชีพจร เหงื่อ การทดสอบการพูด) ประโยชน์ของกิจกรรมทางกาย และกิจกรรมกลางแจ้งในธรรมชาติต่อกายและใจ ปัจจัยที่ทำให้คนเข้าร่วมหรือไม่เข้าร่วม (ตนเอง ครอบครัว เพื่อน สภาพแวดล้อม ความปลอดภัย ค่าใช้จ่าย อากาศร้อนและฝุ่น PM2.5) การใช้พื้นที่ชุมชน (สวนสาธารณะ ลานกีฬา เส้นทางเดินและปั่น) และความปลอดภัยกลางแจ้ง (แดด ความร้อน น้ำ) กลยุทธ์เพิ่มการเคลื่อนไหวและลดการนั่งนาน (เดินหรือปั่นไปโรงเรียน พักยืดเส้นทุกชั่วโมง กิจกรรมกับครอบครัว) การออกแบบแผนเพิ่มกิจกรรมทางกายแบบ SMART ของตนเองหรือกลุ่มคน (เช่น เพื่อนในห้อง ผู้สูงอายุในชุมชน) บันทึกและประเมินผลตามเกณฑ์ ไม่ให้คำแนะนำลดน้ำหนักและเน้นสุขภาพมากกว่ารูปร่าง การเข้าร่วมกิจกรรมจริงทำนอกแอป" }
  # ลำดับ 3
  - { id: health.sport.modified-games-inclusion, title: "ปรับกติกา อุปกรณ์ และการนับคะแนนเพื่อความยุติธรรมและให้ทุกคนได้เล่น", difficulty: 3, prereq: [health.sport.rules-fair-play], indicators: ["au-ac9-hpe:AC9HP2M04", "au-ac9-hpe:AC9HP4M08", "au-ac9-hpe:AC9HP6M08", "au-ac9-hpe:AC9HP8M08", "au-ac9-hpe:AC9HP10M08"], scope: "เหตุผลที่ต้องปรับเกม (ทักษะต่างกัน ความพิการ จำนวนผู้เล่น พื้นที่และอุปกรณ์จำกัด) การร่วมกันตั้งกติกาในกลุ่ม กรอบ STEP ปรับพื้นที่ (Space) งาน (Task) อุปกรณ์ (Equipment) และผู้เล่น (People) ระบบการนับคะแนนแบบต่าง ๆ และผลต่อความยุติธรรม (เช่น ทุกคนต้องได้สัมผัสบอลก่อนยิง คะแนนโบนัสสำหรับการส่ง) ตัวอย่างกีฬาคนพิการและกีฬาที่ทุกคนเล่นร่วมกันได้ (บอคเซีย โกลบอล วีลแชร์บาสเกตบอล) การประเมินเกมที่ปรับแล้วด้วยเกณฑ์ ยุติธรรม ปลอดภัย ทุกคนมีส่วนร่วม ยังท้าทาย จริยธรรมในกีฬา การโกง การเล่นแง่ (gamesmanship) การใช้สารต้องห้าม (หลักการขององค์กรต่อต้านการใช้สารต้องห้ามโลก WADA) และผลของพฤติกรรมเชิงจริยธรรมต่อบุคคลและทีม ต่อยอดจาก health.sport.rules-fair-play" }
  # ---------- การงานอาชีพ: การดำรงชีวิตและครอบครัว (ง 1.1) ----------
  # ลำดับ 1
  - { id: technology.living.self-care-household, title: "งานช่วยเหลือตนเอง ครอบครัว และส่วนรวม วิธีทำ ประโยชน์ และความปลอดภัย", difficulty: 1.5, prereq: [health.safety.home-school-play], indicators: ["th-core-2560-career:ง 1.1 ป.1/1", "th-core-2560-career:ง 1.1 ป.1/2", "th-core-2560-career:ง 1.1 ป.2/1", "th-core-2560-career:ง 1.1 ป.2/2", "th-core-2560-career:ง 1.1 ป.2/3", "th-core-2560-career:ง 1.1 ป.3/1", "th-core-2560-career:ง 1.1 ป.3/2", "th-core-2560-career:ง 1.1 ป.3/3"], scope: "งานช่วยเหลือตนเอง (แต่งกาย เก็บของเล่นและอุปกรณ์การเรียน จัดกระเป๋า ล้างจานของตน) งานช่วยครอบครัว (กวาด ถู พับผ้า รดน้ำต้นไม้ ทิ้งขยะ) และงานส่วนรวม (เวรห้องเรียน ดูแลสวนโรงเรียน) วิธีทำเป็นขั้นตอนและประโยชน์ของแต่ละงาน เลือกวัสดุ อุปกรณ์ และเครื่องมือให้ตรงกับงานและใช้อย่างประหยัด (ไม้กวาดดอกหญ้ากับไม้กวาดทางมะพร้าว ผงซักฟอกพอดี ไม่เปิดน้ำทิ้ง) การใช้อย่างปลอดภัย (กรรไกรปลายมน ส่งของมีคมโดยหันด้ามให้ผู้รับ เข็มและหมุด ไม่จับปลั๊กตอนมือเปียก ไม่ผสมน้ำยาทำความสะอาดต่างชนิด เก็บสารเคมีให้พ้นมือน้อง) ทำงานอย่างสะอาด รอบคอบ เก็บของเข้าที่ และไม่ทำให้สิ่งแวดล้อมเสีย ใช้ภาพลำดับขั้นและสถานการณ์ให้เลือกวิธีที่ถูก การลงมือทำจริงทำที่บ้านและโรงเรียน" }
  # ลำดับ 1
  - { id: technology.living.work-process, title: "กระบวนการทำงาน ทักษะการจัดการ และมารยาทในการทำงาน", difficulty: 2.5, prereq: [technology.living.self-care-household], indicators: ["th-core-2560-career:ง 1.1 ป.4/1", "th-core-2560-career:ง 1.1 ป.4/3", "th-core-2560-career:ง 1.1 ป.5/1", "th-core-2560-career:ง 1.1 ป.5/2", "th-core-2560-career:ง 1.1 ป.5/3", "th-core-2560-career:ง 1.1 ป.6/1", "th-core-2560-career:ง 1.1 ป.6/3", "th-core-2560-career:ง 1.1 ม.1/1", "th-core-2560-career:ง 1.1 ม.3/1"], scope: "กระบวนการทำงานสี่ขั้น วิเคราะห์งาน วางแผน ลงมือทำ ประเมินผลและปรับปรุง พร้อมเหตุผลของแต่ละขั้นและผลเมื่อข้ามขั้น การตั้งเป้าหมายของงานและเหตุผลที่ต้องมีเป้าหมาย ทักษะการจัดการ วางแผนเวลา คน เงิน และวัสดุ รายการตรวจ (checklist) และตารางงาน การทำงานให้เป็นระบบและประณีต วิเคราะห์ขั้นตอนของงานจริง (ทำอาหารว่าง จัดห้อง เตรียมงานวันเกิด) หาขั้นตอนที่ซ้ำหรือรอนาน และจัดลำดับใหม่ให้มีประสิทธิภาพ (ทำงานที่ไม่ต้องรอกันไปพร้อมกัน) อภิปรายแนวทางปรับปรุงงานจากผลการประเมิน มารยาทในการทำงานกับสมาชิกในครอบครัวและผู้อื่น (ขออนุญาตใช้ของ พูดสุภาพ ตรงต่อเวลา รับฟัง ขอบคุณ) ฝึกผ่านโจทย์เรียงขั้นตอน เลือกเหตุผล และเปรียบเทียบแผนงานสองแบบ" }
  # ลำดับ 2
  - { id: technology.living.resource-saving, title: "ใช้พลังงานและทรัพยากรในการทำงานอย่างประหยัด คุ้มค่า และยั่งยืน", difficulty: 3, prereq: [technology.living.work-process, physics.energy.energy-electricity-intro], indicators: ["th-core-2560-career:ง 1.1 ป.4/4", "th-core-2560-career:ง 1.1 ป.5/4", "th-core-2560-career:ง 1.1 ม.2/3", "th-core-2560-career:ง 1.1 ม.3/3", "th-core-2560-career:ง 1.1 ม.4-6/7"], scope: "ทรัพยากรที่ใช้ในการทำงาน (ไฟฟ้า น้ำ แก๊ส วัสดุ เวลา เงิน) ความต่างระหว่างประหยัดกับคุ้มค่า หลัก 3R และ 5R (ลด ใช้ซ้ำ ซ่อม ปฏิเสธ รีไซเคิล) การคิดหน่วยไฟฟ้าและค่าไฟของงานบ้านอย่างง่าย (กำลังไฟฟ้า × ชั่วโมง) ฉลากประหยัดไฟเบอร์ 5 การวางแผนงานให้ใช้ทรัพยากรน้อยลง (ซักผ้าเมื่อเต็มเครื่อง รีดผ้าครั้งเดียว ใช้น้ำล้างผักรดต้นไม้) การเลือกวัสดุที่ใช้ซ้ำได้ และการแยกขยะ เปรียบเทียบความคุ้มค่าของทางเลือกตลอดอายุการใช้งาน (หลอด LED กับหลอดไส้ ถุงผ้ากับถุงพลาสติก) และผลต่อสิ่งแวดล้อม อภิปรายการจัดการงานเพื่อประหยัดพลังงานในบ้าน โรงเรียน และชุมชน จิตสำนึกเป็นเจตคติที่ประเมินในแอปได้เพียงจากการเลือกในสถานการณ์" }
  # ลำดับ 2
  - { id: technology.living.problem-solving-learning, title: "ทักษะกระบวนการแก้ปัญหาและการแสวงหาความรู้เพื่อพัฒนาการทำงาน", difficulty: 3.5, prereq: [technology.living.work-process], indicators: ["th-core-2560-career:ง 1.1 ม.1/3", "th-core-2560-career:ง 1.1 ม.2/1", "th-core-2560-career:ง 1.1 ม.2/2", "th-core-2560-career:ง 1.1 ม.4-6/4", "th-core-2560-career:ง 1.1 ม.4-6/5"], scope: "ขั้นแก้ปัญหาในการทำงาน ระบุปัญหาให้ชัด หาสาเหตุ (ถามทำไมซ้ำ) สร้างทางเลือก ตั้งเกณฑ์และเลือกด้วยตารางให้คะแนน ลงมือ และประเมินผล ตัวอย่างปัญหางานบ้าน งานเกษตร และงานประดิษฐ์ (ผักเหี่ยวเร็ว ผ้าขาวเป็นคราบ ขนมไม่ฟู) การตัดสินใจอย่างมีเหตุผล แทนการลองผิดลองถูก ทักษะการแสวงหาความรู้ แหล่งความรู้ (ผู้รู้และปราชญ์ชาวบ้าน คู่มือ ฉลาก เว็บไซต์หน่วยงาน วิดีโอ) ตั้งคำถามค้นหา ประเมินความน่าเชื่อถือ จดบันทึก ทดลองนำไปใช้และบันทึกผล เพื่อพัฒนาการทำงานและการดำรงชีวิต แยกจาก technology.design.design-process ที่ออกแบบชิ้นงานใหม่ หัวข้อนี้แก้ปัญหาที่เกิดระหว่างทำงานประจำ" }
  # ลำดับ 3
  - { id: technology.living.teamwork-work-ethic, title: "การทำงานกลุ่ม คุณธรรม และลักษณะนิสัยในการทำงาน", difficulty: 3, prereq: [technology.living.work-process], indicators: ["th-core-2560-career:ง 1.1 ป.4/2", "th-core-2560-career:ง 1.1 ป.6/2", "th-core-2560-career:ง 1.1 ม.1/2", "th-core-2560-career:ง 1.1 ม.3/2", "th-core-2560-career:ง 1.1 ม.4-6/6"], scope: "กระบวนการกลุ่ม (ตั้งเป้าหมายร่วม แบ่งบทบาท ผู้นำ เลขานุการ สมาชิก วางแผน ติดตาม สรุปผล) การแบ่งงานตามความถนัด การรับมือเมื่อสมาชิกไม่ทำงานหรือเห็นต่าง ความเสียสละและการทำงานร่วมกันอย่างมีคุณธรรม (ซื่อสัตย์ต่อผลงาน ให้เครดิตเพื่อน ไม่ลอกงาน) ลักษณะนิสัยในการทำงาน ขยัน อดทน รับผิดชอบ ตรงเวลา ประหยัด และเหตุผลที่นิสัยเหล่านี้ทำให้งานบรรลุเป้าหมาย ใช้กรณีศึกษาให้ผู้เรียนวิเคราะห์และเลือกการกระทำ การแสดงพฤติกรรมจริงประเมินโดยครูนอกแอป ตัวชี้วัดทั้งหมดจึงเป็น partial" }
  # ลำดับ 2
  - { id: technology.living.home-living-skills, title: "งานเพื่อการดำรงชีวิต: ดูแลเสื้อผ้า เตรียมและเก็บอาหาร และดูแลที่อยู่อาศัย", difficulty: 3.5, prereq: [technology.living.self-care-household, health.nutrition.basics], indicators: ["th-core-2560-career:ง 1.1 ม.4-6/1"], scope: "ความรู้ของงานบ้านที่ใช้ทั้งชีวิต อ่านสัญลักษณ์ดูแลผ้าบนป้ายเสื้อ (ซัก ฟอกขาว อบแห้ง รีด ซักแห้งตาม ISO 3758) แยกผ้า ขจัดคราบเบื้องต้น ซ่อมเสื้อผ้าอย่างง่าย (เย็บกระดุม ด้นถอยหลัง) การเตรียม ประกอบ และเก็บอาหารอย่างปลอดภัยตามหลัก ห้าประการของ WHO (สะอาด แยกดิบกับสุก ทำให้สุก เก็บที่อุณหภูมิปลอดภัย ใช้น้ำและวัตถุดิบปลอดภัย) ช่วงอุณหภูมิอันตราย 5–60 °C การจัดตู้เย็นและอาหารเหลือ การทำความสะอาดห้องครัวและห้องน้ำ การซ่อมแซมเล็กน้อยอย่างปลอดภัย (เปลี่ยนหลอดไฟเมื่อปิดไฟ ขันน็อตบานพับ) และงานเกษตรในบ้าน (ปลูกผักสวนครัวในกระถาง) อธิบายวิธีทำงานแต่ละอย่างเป็นขั้นตอนพร้อมเหตุผลด้านความปลอดภัย ความประหยัด และสุขอนามัย การลงมือทำจริงทำที่บ้าน" }
