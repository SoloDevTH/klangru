problems:
  - id: management.quality.spc.p001
    topics: [management.quality.spc]
    difficulty: 1
    type: mcq
    stem: "โรงงานบรรจุน้ำมันพืชมีหัวบรรจุ 4 หัว ต้องการทำแผนภูมิ x̄–R ของปริมาตร วิธีเก็บกลุ่มย่อยแบบใดดีที่สุด"
    choices:
      - { id: a, text: "เก็บขวดติดกัน 5 ขวดจากหัวบรรจุเดียว และทำแผนภูมิแยกต่อหัว", correct: true }
      - { id: b, text: "เก็บจากทุกหัวปนกันกลุ่มละ 5 ขวด", feedback: "ความต่างระหว่างหัวจะไปอยู่ในพิสัยภายในกลุ่ม ทำให้ R̄ ใหญ่และเส้นควบคุมของ x̄ กว้างเกินจนจับปัญหาไม่ได้" }
      - { id: c, text: "เก็บ 5 ขวดกระจายตลอดทั้งวัน แล้วรวมเป็นกลุ่มเดียว", feedback: "การเปลี่ยนแปลงระหว่างช่วงเวลาจะปนอยู่ในกลุ่ม แผนภูมิจะไม่เห็นการเลื่อนระหว่างช่วงเวลา" }
      - { id: d, text: "เลือกเฉพาะขวดที่ดูเต็มที่สุดมาวัด", feedback: "เป็นการเลือกแบบลำเอียง ข้อมูลไม่แทนกระบวนการ" }
    hints:
      - "ความผันแปรภายในกลุ่มควรมาจากสาเหตุทั่วไปเท่านั้น"
      - "แหล่งความผันแปรที่รู้อยู่แล้ว (หัวบรรจุ) ไม่ควรปนในกลุ่มเดียว"
    solution: "กลุ่มย่อยที่มีเหตุผลคือชิ้นที่ผลิตติดกันจากแหล่งเดียวกัน ความต่างระหว่างหัวหรือระหว่างเวลาจะได้ปรากฏเป็นความต่างระหว่างกลุ่มที่แผนภูมิจับได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.spc.p002
    topics: [management.quality.spc]
    difficulty: 1
    type: match
    stem: "จับคู่ข้อมูลกับแผนภูมิควบคุมที่เหมาะสม"
    pairs:
      - { left: "น้ำหนักซองขนม สุ่มชั่วโมงละ 5 ซอง", right: "แผนภูมิ x̄–R" }
      - { left: "จำนวนผู้ป่วยที่กลับมารักษาซ้ำต่อเดือน เป็นตัวเลขเดียวต่อเดือน", right: "แผนภูมิ I-MR" }
      - { left: "จำนวนรอยตำหนิบนผ้าม้วนขนาดเท่ากันทุกม้วน", right: "แผนภูมิ c" }
      - { left: "จำนวนรอยตำหนิบนแผ่นเหล็กที่ขนาดแต่ละล็อตไม่เท่ากัน", right: "แผนภูมิ u" }
      - { left: "จำนวนหลอดไฟที่ไม่ติด จากการตรวจวันละ 200 หลอด", right: "แผนภูมิ np" }
    hints:
      - "ข้อมูลแบบวัดหรือแบบนับ และเก็บครั้งละกี่ค่า"
      - "นับชิ้นเสียหรือนับจุดบกพร่อง และขนาดที่ตรวจเท่ากันหรือไม่"
    solution: "ค่าวัดเป็นกลุ่มใช้ x̄–R ค่าวัดทีละค่าใช้ I-MR จุดบกพร่องในหน่วยเท่ากันใช้ c ไม่เท่ากันใช้ u และจำนวนชิ้นเสียจากการตรวจจำนวนเท่ากันใช้ np"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.spc.p003
    topics: [management.quality.spc]
    difficulty: 1
    type: mcq
    stem: "แผนภูมิ R ในคู่แผนภูมิ x̄–R ใช้เฝ้าดูอะไร"
    choices:
      - { id: a, text: "ความผันแปรภายในกลุ่มย่อย", correct: true }
      - { id: b, text: "ค่ากลางของกระบวนการ", feedback: "ค่ากลางดูจากแผนภูมิ x̄" }
      - { id: c, text: "สัดส่วนของเสีย", feedback: "สัดส่วนของเสียดูจากแผนภูมิ p" }
      - { id: d, text: "ความต่างระหว่างค่าที่วัดกับข้อกำหนดของลูกค้า", feedback: "แผนภูมิควบคุมไม่ได้เทียบกับข้อกำหนด เส้นควบคุมคำนวณจากข้อมูลของกระบวนการ" }
    hints:
      - "R ย่อมาจากพิสัย (range)"
      - "พิสัยคือค่ามากสุดลบค่าน้อยสุดภายในกลุ่ม"
    solution: "แผนภูมิ R เฝ้าดูพิสัยภายในกลุ่มย่อย ซึ่งบอกความผันแปรระยะสั้นของกระบวนการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.spc.p004
    topics: [management.quality.spc]
    difficulty: 2
    type: numeric
    stem: "แผนภูมิ x̄–R ของเส้นผ่านศูนย์กลางแกนเพลา กลุ่มย่อยละ 4 ชิ้น ได้ $\\bar{\\bar{x}} = 50.000$ mm และ $\\bar{R} = 2.0$ mm ($A_2 = 0.729$ เมื่อ $n = 4$) เส้นควบคุมบนของแผนภูมิ x̄ เป็นเท่าใด (ตอบในหน่วย mm)"
    answer: { value: 51.458, unit: mm, tolerance: 0.002 }
    hints:
      - "$\\text{UCL}_{\\bar{x}} = \\bar{\\bar{x}} + A_2\\bar{R}$"
      - "$50 + 0.729 \\times 2$"
    misconceptions:
      - { match: 56, feedback: "ดูเหมือนใช้ $3\\bar{R}$ แทน $A_2\\bar{R}$ ค่าคงที่ $A_2$ รวมการแปลงพิสัยเป็นส่วนเบี่ยงเบนมาตรฐานของค่าเฉลี่ยไว้แล้ว" }
      - { match: 51.154, feedback: "ดูเหมือนใช้ $A_2 = 0.577$ ของ $n = 5$ แต่กลุ่มย่อยมี 4 ชิ้น" }
    solution: "$\\text{UCL} = 50.000 + 0.729(2.0) = 51.458$ mm"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.spc.p005
    topics: [management.quality.spc]
    difficulty: 2
    type: numeric
    stem: "จากข้อก่อน ($n = 4$, $\\bar{R} = 2.0$ mm, $D_3 = 0$, $D_4 = 2.282$) เส้นควบคุมบนของแผนภูมิ R เป็นเท่าใด (ตอบในหน่วย mm)"
    answer: { value: 4.564, unit: mm, tolerance: 0.002 }
    hints:
      - "$\\text{UCL}_R = D_4\\bar{R}$"
      - "$2.282 \\times 2.0$"
    misconceptions:
      - { match: 1.458, feedback: "นั่นคือ $A_2\\bar{R}$ ซึ่งใช้กับแผนภูมิ x̄ แผนภูมิ R ใช้ $D_4$" }
      - { match: 8, feedback: "ดูเหมือนคิด $\\bar{R} + 3\\bar{R}$ ต้องใช้ค่าคงที่ $D_4$" }
    solution: "$\\text{UCL}_R = 2.282 \\times 2.0 = 4.564$ mm และ $\\text{LCL}_R = 0 \\times 2.0 = 0$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.spc.p006
    topics: [management.quality.spc]
    difficulty: 3
    type: numeric
    stem: "โรงพยาบาลชุมชนแห่งหนึ่ง (สมมติ) ทำแผนภูมิ I-MR ของเวลารอพบแพทย์เฉลี่ยรายวัน ได้ $\\bar{x} = 32$ นาที และ $\\overline{MR} = 4$ นาที เส้นควบคุมบนของแผนภูมิ I เป็นเท่าใด (ตอบในหน่วยนาที)"
    answer: { value: 42.64, unit: นาที, tolerance: 0.01 }
    hints:
      - "$\\text{UCL}_I = \\bar{x} + 2.66\\,\\overline{MR}$"
      - "$32 + 2.66 \\times 4$"
    misconceptions:
      - { match: 44, feedback: "ดูเหมือนใช้ $3\\overline{MR}$ ต้องแปลง $\\overline{MR}$ เป็น $\\sigma$ ก่อน ($\\sigma \\approx \\overline{MR}/1.128$) ค่าคงที่จึงเป็น 2.66" }
      - { match: 45.068, feedback: "นั่นคือ $3.267\\,\\overline{MR}$ บวก $\\bar{x}$ ค่า 3.267 ใช้กับแผนภูมิ MR" }
    solution: "$\\text{UCL}_I = 32 + 2.66(4) = 42.64$ นาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.spc.p007
    topics: [management.quality.spc]
    difficulty: 3
    type: numeric
    stem: "โรงงานทอผ้านับรอยตำหนิบนผ้าม้วนขนาดเท่ากัน 25 ม้วน ได้ค่าเฉลี่ย $\\bar{c} = 9$ จุดต่อม้วน เส้นควบคุมบนของแผนภูมิ c เป็นเท่าใด"
    answer: { value: 18 }
    hints:
      - "แผนภูมิ c: $\\bar{c} \\pm 3\\sqrt{\\bar{c}}$"
      - "$\\sqrt{9} = 3$"
    misconceptions:
      - { match: 36, feedback: "ดูเหมือนใช้ $3\\bar{c}$ แทน $3\\sqrt{\\bar{c}}$ การแจกแจงปัวซงมีความแปรปรวนเท่ากับ $\\bar{c}$ ส่วนเบี่ยงเบนมาตรฐานจึงเป็น $\\sqrt{\\bar{c}}$" }
      - { match: 12, feedback: "นั่นคือ $\\bar{c} + \\sqrt{\\bar{c}}$ ลืมคูณ 3" }
    solution: "$\\text{UCL} = 9 + 3\\sqrt{9} = 9 + 9 = 18$ จุด และ $\\text{LCL} = 9 - 9 = 0$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.spc.p008
    topics: [management.quality.spc]
    difficulty: 3
    type: numeric
    stem: "โรงงานกระจกนับฟองอากาศต่อตารางเมตร ได้ค่าเฉลี่ย $\\bar{u} = 0.8$ จุดต่อ m² วันหนึ่งตรวจแผ่นกระจกรวม 4 m² เส้นควบคุมบนของแผนภูมิ u สำหรับวันนั้นเป็นเท่าใด (ตอบเป็นจุดต่อ m² ทศนิยม 3 ตำแหน่ง)"
    answer: { value: 2.142, tolerance: 0.005 }
    hints:
      - "$\\text{UCL} = \\bar{u} + 3\\sqrt{\\bar{u}/n_i}$ โดย $n_i$ คือจำนวนหน่วยที่ตรวจวันนั้น"
      - "$\\sqrt{0.8/4} = \\sqrt{0.2}$"
    misconceptions:
      - { match: 3.483, feedback: "ดูเหมือนลืมหารด้วย $n_i = 4$ ($0.8 + 3\\sqrt{0.8}$)" }
      - { match: 1.4, feedback: "ดูเหมือนคิด $\\bar{u} + 3(\\bar{u}/n_i)$ โดยไม่ถอดราก" }
    solution: "$\\text{UCL} = 0.8 + 3\\sqrt{0.8/4} = 0.8 + 3(0.4472) \\approx 2.142$ จุดต่อ m²"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.spc.p009
    topics: [management.quality.spc]
    difficulty: 3
    type: numeric
    stem: "ศูนย์กระจายสินค้าตรวจพัสดุวันละ 200 ชิ้น สัดส่วนพัสดุเสียหายเฉลี่ย $\\bar{p} = 0.04$ เส้นควบคุมบนของแผนภูมิ np เป็นเท่าใด (ตอบเป็นจำนวนชิ้น ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 16.31, unit: ชิ้น, tolerance: 0.02 }
    hints:
      - "$\\text{UCL} = n\\bar{p} + 3\\sqrt{n\\bar{p}(1 - \\bar{p})}$"
      - "$n\\bar{p} = 8$ และ $\\sqrt{8 \\times 0.96}$"
    misconceptions:
      - { match: 0.0816, feedback: "นั่นคือ UCL ของแผนภูมิ p (สัดส่วน) แผนภูมิ np ใช้จำนวนชิ้น" }
      - { match: 16.49, feedback: "ดูเหมือนใช้ $3\\sqrt{n\\bar{p}}$ แบบปัวซง แผนภูมิ np ต้องคูณ $(1 - \\bar{p})$ ด้วย" }
    solution: "$n\\bar{p} = 200 \\times 0.04 = 8$, $\\sqrt{8 \\times 0.96} \\approx 2.771$ ได้ $\\text{UCL} \\approx 8 + 8.31 = 16.31$ ชิ้น ส่วน LCL ติดลบจึงใช้ 0"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.spc.p010
    topics: [management.quality.spc]
    difficulty: 4
    type: numeric
    stem: "แผนภูมิค่าเดี่ยวในภาพเป็นเวลารอรับยาเฉลี่ยรายวันของห้องยาโรงพยาบาลแห่งหนึ่ง (CL = 30 นาที, σ = 2 นาที) ถ้าใช้กฎ Western Electric ทั้งสี่ข้อ ไล่ดูจากวันที่ 1 วันใดเป็นวันแรกที่เกิดสัญญาณ (ตอบเป็นเลขวัน)"
    figure:
      src: p-run.svg
      alt: "แผนภูมิค่าเดี่ยว 20 วัน CL = 30 นาที UCL = 36 LCL = 24 เส้นประที่ ±1σ (32, 28) และ ±2σ (34, 26) ค่ารายวันคือ วันที่ 1 ถึง 20: 29.1, 31.2, 28.4, 30.8, 27.9, 31.5, 29.4, 32.6, 28.8, 30.6, 31.4, 30.9, 31.7, 30.4, 31.1, 30.8, 31.6, 29.5, 30.7, 28.9"
    answer: { value: 17 }
    hints:
      - "ไม่มีจุดใดนอกเส้นควบคุม และไม่มีจุดเกิน ±2σ ตรวจกฎข้อ 3 และ 4"
      - "นับจำนวนจุดติดกันที่อยู่เหนือเส้นกลาง เริ่มจากวันที่ 10"
    misconceptions:
      - { match: 10, feedback: "วันที่ 10 เป็นจุดแรกของรัน สัญญาณเกิดเมื่อครบ 8 จุดติดกัน" }
      - { match: 8, feedback: "วันที่ 8 (32.6) อยู่เกิน +1σ เพียงจุดเดียว ไม่ครบเงื่อนไข 4 ใน 5 จุด" }
    solution: "วันที่ 10–17 (30.6, 31.4, 30.9, 31.7, 30.4, 31.1, 30.8, 31.6) อยู่เหนือเส้นกลางติดกัน 8 จุด ครบกฎข้อ 4 ที่วันที่ 17 จุดเหล่านี้อยู่ภายใน 1σ จึงไม่เข้ากฎข้อ 3 กระบวนการอาจเลื่อนขึ้นเล็กน้อยตั้งแต่วันที่ 10"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.spc.p011
    topics: [management.quality.spc]
    difficulty: 4
    type: numeric
    stem: "ถ้ากระบวนการปกติและค่าที่วัดมีการแจกแจงปกติ ความน่าจะเป็นที่จุดหนึ่งจุดหลุดนอก $\\pm 3\\sigma$ คือประมาณ 0.0027 ถ้าใช้เฉพาะกฎข้อ 1 โดยเฉลี่ยจะเกิดสัญญาณเตือนผิดทุกกี่จุด (ARL ตอบเป็นจำนวนเต็มใกล้เคียง)"
    answer: { value: 370, unit: จุด, tolerance: 1 }
    hints:
      - "ความยาวรันเฉลี่ย = 1 ÷ ความน่าจะเป็นที่จะเกิดสัญญาณต่อจุด"
      - "$1/0.0027$"
    misconceptions:
      - { match: 0.0027, feedback: "นั่นคือความน่าจะเป็นต่อจุด ARL คือส่วนกลับ" }
      - { match: 27, feedback: "ตรวจตำแหน่งทศนิยม $1/0.0027 \\approx 370$" }
    solution: "$\\text{ARL} = 1/0.0027 \\approx 370$ จุด ถ้าบันทึกวันละจุด จะเตือนผิดราวปีละครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.spc.p012
    topics: [management.quality.spc]
    difficulty: 4
    type: numeric
    stem: "ถ้ากระบวนการปกติและแต่ละจุดมีโอกาสอยู่เหนือหรือใต้เส้นกลางเท่ากัน (0.5) อิสระต่อกัน ความน่าจะเป็นที่ 8 จุดที่กำหนดติดกันจะอยู่ด้านเดียวกันทั้งหมด (ด้านใดก็ได้) เป็นร้อยละเท่าใด (ตอบในหน่วย % ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 0.78, unit: "%", tolerance: 0.01 }
    hints:
      - "อยู่เหนือทั้ง 8 จุด: $0.5^8$"
      - "อยู่ใต้ทั้ง 8 จุดก็นับด้วย จึงคูณ 2"
    misconceptions:
      - { match: 0.39, feedback: "นั่นคือด้านเดียว ($0.5^8$) โจทย์ถามด้านใดก็ได้ จึงต้องคูณ 2" }
      - { match: 6.25, feedback: "ดูเหมือนคิด $0.5^4$ ต้องยกกำลัง 8" }
    solution: "$2 \\times 0.5^8 = 2/256 \\approx 0.0078 = 0.78\\%$ ใกล้เคียงกับความน่าจะเป็นของกฎข้อ 1 (0.0027) ในระดับเดียวกัน กฎนี้จึงไม่ได้เตือนผิดง่ายเกินไปเมื่อดูทีละช่วง แต่เมื่อตรวจทุกช่วงที่เลื่อนไป โอกาสเตือนผิดรวมจะสูงขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.spc.p013
    topics: [management.quality.spc]
    difficulty: 4
    type: mcq
    stem: "โรงงานทำแผนภูมิ x̄–R ของความหนาแผ่นยาง พบว่าแผนภูมิ x̄ ไม่มีจุดหลุด แต่แผนภูมิ R มีหลายจุดเกิน UCL ในสัปดาห์ที่เปลี่ยนแม่พิมพ์ ข้อสรุปใดถูกต้องที่สุด"
    choices:
      - { id: a, text: "ความผันแปรภายในกลุ่มเพิ่มขึ้นผิดปกติ ต้องหาสาเหตุก่อน และเส้นควบคุมของ x̄ ที่คำนวณจาก R̄ ยังเชื่อถือไม่ได้", correct: true }
      - { id: b, text: "กระบวนการอยู่ในการควบคุม เพราะแผนภูมิ x̄ ไม่มีจุดหลุด", feedback: "ต้องดูทั้งสองแผนภูมิ แผนภูมิ R ที่หลุดแสดงว่าความผันแปรผิดปกติ" }
      - { id: c, text: "ควรปรับค่าเฉลี่ยของเครื่องให้ต่ำลง", feedback: "ปัญหาอยู่ที่ความผันแปร ไม่ใช่ค่ากลาง การปรับค่ากลางไม่ช่วย" }
      - { id: d, text: "แผนภูมิ R ไม่สำคัญเมื่อแผนภูมิ x̄ ปกติ", feedback: "แผนภูมิ R ต้องดูก่อน เพราะ R̄ ใช้คำนวณเส้นของแผนภูมิ x̄" }
    hints:
      - "แผนภูมิแต่ละอันบอกเรื่องอะไรของกระบวนการ"
      - "ถ้า R̄ สูงผิดปกติ เส้นควบคุมของ x̄ จะกว้างหรือแคบ"
    solution: "แผนภูมิ R หลุดแปลว่าความผันแปรภายในกลุ่มผิดปกติ (อาจมาจากแม่พิมพ์ใหม่) เมื่อ R̄ สูงเกินจริง เส้นของ x̄ จะกว้างเกินจนจุดดูเหมือนปกติ ต้องแก้ความผันแปรก่อนแล้วคำนวณเส้นใหม่"
