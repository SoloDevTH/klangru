problems:
  - id: math.number.unit-rate.p001
    topics: [math.number.unit-rate]
    difficulty: 1
    type: numeric
    stem: "ปากกา 3 ด้าม ราคา 36 บาท ปากกา 1 ด้ามราคากี่บาท"
    answer: { value: 12, unit: บาท }
    hints:
      - "ราคาของ 3 ด้ามรวมกันเป็น 36 บาท"
      - "แบ่ง 36 บาทออกเป็น 3 ส่วนเท่า ๆ กัน"
    misconceptions:
      - { match: 108, feedback: "คูณ 36 × 3 แต่ราคาของด้ามเดียวต้องน้อยกว่าราคาของ 3 ด้าม จึงต้องหาร" }
      - { match: 33, feedback: "ลบ 36 − 3 แต่ต้องแบ่งราคาเป็น 3 ส่วนเท่ากัน คือหาร" }
    solution: "1 ด้ามราคา $36 \\div 3 = 12$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p002
    topics: [math.number.unit-rate]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นอัตราต่อหน่วย"
    choices:
      - { id: a, text: "60 กิโลเมตรต่อชั่วโมง", correct: true }
      - { id: b, text: "120 กิโลเมตรต่อ 2 ชั่วโมง", feedback: "เป็นอัตรา แต่ตัวหลังเป็น 2 ชั่วโมง ยังไม่ใช่ 1 หน่วย" }
      - { id: c, text: "ส้ม 5 ผล 40 บาท", feedback: "เป็นอัตรา แต่บอกราคาของ 5 ผล ไม่ใช่ 1 ผล" }
      - { id: d, text: "ทำงาน 3 วัน ได้ 1,200 บาท", feedback: "ตัวหลังเป็น 3 วัน อัตราต่อหน่วยต้องเป็นต่อ 1 วัน" }
    hints:
      - "อัตราต่อหน่วยคืออัตราที่ปริมาณตัวหลังเป็น 1"
      - "คำว่า ต่อชั่วโมง หมายถึง ต่อ 1 ชั่วโมง"
    solution: "60 กิโลเมตรต่อชั่วโมง คือ 60 กิโลเมตรต่อ 1 ชั่วโมง จึงเป็นอัตราต่อหน่วย ข้ออื่นตัวหลังไม่ใช่ 1"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p003
    topics: [math.number.unit-rate]
    difficulty: 2
    type: numeric
    stem: "ไข่ไก่ 10 ฟอง ราคา 45 บาท ถ้าซื้อ 24 ฟอง ต้องจ่ายกี่บาท"
    answer: { value: 108, unit: บาท }
    hints:
      - "หาราคาของไข่ 1 ฟองก่อน"
      - "1 ฟองราคา 45 ÷ 10 บาท แล้วคูณด้วยจำนวนฟองที่ต้องการ"
    misconceptions:
      - { match: 59, feedback: "บวกจำนวนฟองที่เพิ่ม (45 + 14) ราคาเพิ่มเป็นเท่าตามจำนวนฟอง ต้องหาราคาต่อฟองแล้วคูณ" }
      - { match: 1080, feedback: "คูณ 45 × 24 คือคิดว่า 45 บาทเป็นราคาต่อฟอง แต่ 45 บาทเป็นราคาของ 10 ฟอง" }
    solution: "ราคาต่อฟอง $45 \\div 10 = 4.5$ บาท ไข่ 24 ฟองราคา $4.5 \\times 24 = 108$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p004
    topics: [math.number.unit-rate]
    difficulty: 2
    type: numeric
    stem: "รถโดยสารวิ่งได้ 180 กิโลเมตรในเวลา 3 ชั่วโมงด้วยอัตราเร็วคงที่ อัตราเร็วกี่กิโลเมตรต่อชั่วโมง"
    answer: { value: 60, unit: กม./ชม. }
    hints:
      - "อัตราเร็วคือระยะทางที่วิ่งได้ใน 1 ชั่วโมง"
      - "หารระยะทางด้วยเวลา"
    misconceptions:
      - { match: 540, feedback: "คูณระยะทางกับเวลา อัตราเร็ว = ระยะทาง ÷ เวลา" }
      - { match: 177, feedback: "ลบ 180 − 3 แต่ต้องแบ่งระยะทางให้แต่ละชั่วโมงเท่ากัน คือหาร" }
    solution: "อัตราเร็ว $= 180 \\div 3 = 60$ กิโลเมตรต่อชั่วโมง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p005
    topics: [math.number.unit-rate]
    difficulty: 2
    type: mcq
    stem: "น้ำปลาขวดใหญ่ 700 มิลลิลิตร ราคา 35 บาท ขวดเล็ก 300 มิลลิลิตร ราคา 18 บาท ซื้อแบบใดคุ้มกว่า"
    choices:
      - { id: a, text: "ขวดใหญ่ เพราะราคาต่อมิลลิลิตรถูกกว่า", correct: true }
      - { id: b, text: "ขวดเล็ก เพราะจ่ายเงินน้อยกว่า", feedback: "จ่ายน้อยกว่าแต่ได้น้ำปลาน้อยกว่ามาก ต้องเทียบราคาต่อมิลลิลิตร ขวดเล็กมิลลิลิตรละ 0.06 บาท ขวดใหญ่ 0.05 บาท" }
      - { id: c, text: "คุ้มเท่ากัน", feedback: "ลองหาราคาต่อ 100 มิลลิลิตร ขวดใหญ่ 5 บาท ขวดเล็ก 6 บาท ไม่เท่ากัน" }
      - { id: d, text: "ขวดเล็ก เพราะ 300 ÷ 18 น้อยกว่า 700 ÷ 35", feedback: "300 ÷ 18 คือมิลลิลิตรต่อบาท ยิ่งมากยิ่งคุ้ม ขวดเล็กได้ประมาณ 16.7 มล./บาท ขวดใหญ่ได้ 20 มล./บาท" }
    hints:
      - "เทียบราคาของปริมาณที่เท่ากัน"
      - "หาราคาต่อ 1 มิลลิลิตร (หรือต่อ 100 มิลลิลิตร) ของแต่ละขวด"
    solution: "ขวดใหญ่ $35 \\div 700 = 0.05$ บาทต่อมล. ขวดเล็ก $18 \\div 300 = 0.06$ บาทต่อมล. ขวดใหญ่ถูกกว่าต่อมิลลิลิตร จึงคุ้มกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p006
    topics: [math.number.unit-rate]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการแก้โจทย์ \"ส้ม 4 กิโลกรัม ราคา 120 บาท ซื้อ 7 กิโลกรัมต้องจ่ายเท่าไร\" ด้วยบัญญัติไตรยางศ์"
    items:
      - "เขียนสิ่งที่รู้: ส้ม 4 กิโลกรัม ราคา 120 บาท"
      - "หาราคาต่อ 1 กิโลกรัม: 120 ÷ 4 = 30 บาท"
      - "คูณด้วยจำนวนที่ต้องการ: 30 × 7 = 210 บาท"
      - "ตรวจความสมเหตุสมผล: ซื้อมากขึ้นต้องจ่ายมากกว่า 120 บาท"
    hints:
      - "เริ่มจากสิ่งที่โจทย์บอก"
      - "หาค่าของ 1 หน่วยก่อนคูณ"
    solution: "เขียนสิ่งที่รู้ → หาราคาต่อ 1 กิโลกรัม → คูณด้วย 7 → ตรวจคำตอบ ได้ 210 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p007
    topics: [math.number.unit-rate]
    difficulty: 2
    type: numeric
    stem: "ลุงทำงานรับจ้าง 5 วัน ได้ค่าจ้าง 1,850 บาท ถ้าได้ค่าจ้างวันละเท่ากัน ทำงาน 8 วันจะได้ค่าจ้างกี่บาท"
    answer: { value: 2960, unit: บาท }
    hints:
      - "หาค่าจ้างต่อ 1 วันก่อน"
      - "ค่าจ้างต่อวัน = 1,850 ÷ 5 แล้วคูณด้วย 8"
    misconceptions:
      - { match: 1156.25, feedback: "หารด้วย 8 แล้วคูณ 5 กลับด้าน ทำงานมากขึ้นต้องได้มากกว่า 1,850 บาท" }
      - { match: 1853, feedback: "บวกจำนวนวันที่เพิ่ม ค่าจ้างเพิ่มเป็นเท่าตามจำนวนวัน" }
    solution: "ค่าจ้างวันละ $1{,}850 \\div 5 = 370$ บาท 8 วันได้ $370 \\times 8 = 2{,}960$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p008
    topics: [math.number.unit-rate]
    difficulty: 3
    type: numeric
    stem: "ข้าวหอมมะลิถุง 5 กิโลกรัม ราคา 215 บาท ถ้าแบ่งขายตามราคาเดียวกัน 2 กิโลกรัมราคากี่บาท"
    answer: { value: 86, unit: บาท }
    hints:
      - "หาราคาต่อ 1 กิโลกรัมก่อน"
      - "215 ÷ 5 แล้วคูณด้วย 2"
    misconceptions:
      - { match: 537.5, feedback: "หาร 215 ด้วย 2 แล้วคูณ 5 กลับด้าน ซื้อน้อยลงต้องจ่ายน้อยกว่า 215 บาท" }
      - { match: 430, feedback: "คูณ 215 × 2 คือคิดว่า 215 บาทเป็นราคาต่อกิโลกรัม แต่เป็นราคาของ 5 กิโลกรัม" }
    solution: "ราคาต่อกิโลกรัม $215 \\div 5 = 43$ บาท 2 กิโลกรัมราคา $43 \\times 2 = 86$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p009
    topics: [math.number.unit-rate]
    difficulty: 3
    type: numeric
    stem: "แม่แบ่งเงิน 450 บาท ให้พี่กับน้อง โดยพี่ได้เป็น 2 เท่าของน้อง น้องได้กี่บาท"
    answer: { value: 150, unit: บาท }
    hints:
      - "วาดแท่ง: น้อง 1 ช่อง พี่ 2 ช่อง"
      - "รวมมีกี่ช่อง แบ่ง 450 บาทให้แต่ละช่องเท่ากัน"
    misconceptions:
      - { match: 225, feedback: "แบ่งครึ่ง แต่พี่ได้มากกว่าน้อง ทั้งหมดมี 3 ช่อง" }
      - { match: 300, feedback: "นี่คือส่วนของพี่ (2 ช่อง) โจทย์ถามส่วนของน้อง" }
    solution: "น้อง 1 ช่อง พี่ 2 ช่อง รวม 3 ช่อง ช่องละ $450 \\div 3 = 150$ บาท น้องได้ 150 บาท (พี่ได้ 300 บาท)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p010
    topics: [math.number.unit-rate]
    difficulty: 3
    type: match
    stem: "จับคู่สถานการณ์กับอัตราต่อหน่วย"
    pairs:
      - { left: "วิ่ง 120 กิโลเมตรใน 2 ชั่วโมง", right: "60 กิโลเมตรต่อชั่วโมง" }
      - { left: "ได้ค่าจ้าง 600 บาทใน 4 ชั่วโมง", right: "150 บาทต่อชั่วโมง" }
      - { left: "น้ำไหล 20 ลิตรใน 5 นาที", right: "4 ลิตรต่อนาที" }
      - { left: "กระดาษ 500 แผ่น ราคา 125 บาท", right: "0.25 บาทต่อแผ่น" }
    hints:
      - "อัตราต่อหน่วย = ปริมาณแรก ÷ ปริมาณหลัง"
      - "ดูหน่วยคำตอบ เช่น บาทต่อแผ่น คือ บาท ÷ แผ่น"
    solution: "$120 \\div 2 = 60$, $600 \\div 4 = 150$, $20 \\div 5 = 4$, $125 \\div 500 = 0.25$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p011
    topics: [math.number.unit-rate]
    difficulty: 3
    type: mcq
    stem: "โดยไม่ต้องคำนวณ ผลคูณ $250 \\times \\tfrac34$ เป็นอย่างไรเมื่อเทียบกับ 250"
    choices:
      - { id: a, text: "น้อยกว่า 250", correct: true }
      - { id: b, text: "มากกว่า 250", feedback: "การคูณไม่ได้ทำให้มากขึ้นเสมอ คูณด้วยจำนวนที่น้อยกว่า 1 ผลจะเล็กลง" }
      - { id: c, text: "เท่ากับ 250", feedback: "ค่าจะไม่เปลี่ยนเมื่อคูณด้วย 1 เท่านั้น แต่ 3/4 น้อยกว่า 1" }
      - { id: d, text: "บอกไม่ได้ถ้าไม่คำนวณ", feedback: "ดูแค่ตัวคูณก็บอกได้ 3/4 น้อยกว่า 1 ผลจึงน้อยกว่า 250" }
    hints:
      - "เทียบตัวคูณ 3/4 กับ 1"
      - "คูณด้วยจำนวนที่น้อยกว่า 1 คือการย่อ"
    solution: "$\\tfrac34 < 1$ การคูณจึงย่อ 250 ให้เล็กลง ผลคือ $187.5$ ซึ่งน้อยกว่า 250"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p012
    topics: [math.number.unit-rate]
    difficulty: 3
    type: numeric
    stem: "ต้นมะม่วงสูง 6 เมตร ต้นมะพร้าวสูง 15 เมตร ต้นมะพร้าวสูงเป็นกี่เท่าของต้นมะม่วง (ตอบเป็นทศนิยม)"
    answer: { value: 2.5, tolerance: 0.01, unit: เท่า }
    hints:
      - "สิ่งที่ถูกถาม (มะพร้าว) เป็นตัวเศษ สิ่งที่ใช้เทียบ (มะม่วง) เป็นตัวส่วน"
      - "หาร 15 ด้วย 6"
    misconceptions:
      - { match: 0.4, feedback: "นี่คือมะม่วงเป็นกี่เท่าของมะพร้าว (6 ÷ 15) โจทย์ถามมะพร้าวเทียบกับมะม่วง" }
      - { match: 9, feedback: "ลบ 15 − 6 ได้ว่าสูงกว่ากี่เมตร แต่โจทย์ถามว่ากี่เท่า ต้องหาร" }
    solution: "$\\tfrac{15}{6} = 2.5$ ต้นมะพร้าวสูงเป็น 2.5 เท่าของต้นมะม่วง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p013
    topics: [math.number.unit-rate]
    difficulty: 3
    type: numeric
    stem: "ห้องเรียนมีนักเรียน 40 คน เป็นชาย 18 คน นักเรียนชายเป็นเศษส่วนเท่าใดของนักเรียนทั้งห้อง (ตอบเป็นทศนิยม)"
    answer: { value: 0.45, tolerance: 0.005 }
    hints:
      - "เศษส่วนของทั้งห้อง: จำนวนชายเป็นตัวเศษ จำนวนทั้งห้องเป็นตัวส่วน"
      - "$\\tfrac{18}{40}$ แล้วเขียนเป็นทศนิยม"
    misconceptions:
      - { match: 0.818, feedback: "หาร 18 ด้วย 22 (จำนวนหญิง) แต่โจทย์เทียบกับทั้งห้อง 40 คน" }
      - { match: 2.222, feedback: "หาร 40 ด้วย 18 กลับด้าน" }
    solution: "$\\tfrac{18}{40} = \\tfrac{9}{20} = 0.45$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p014
    topics: [math.number.unit-rate]
    difficulty: 4
    type: numeric
    stem: "เดินได้ $\\tfrac12$ กิโลเมตรในเวลา $\\tfrac14$ ชั่วโมง อัตราเร็วกี่กิโลเมตรต่อชั่วโมง"
    answer: { value: 2, unit: กม./ชม. }
    hints:
      - "อัตราเร็ว = ระยะทาง ÷ เวลา แม้ตัวเลขเป็นเศษส่วน"
      - "หารด้วย $\\tfrac14$ คือคูณด้วย 4"
    misconceptions:
      - { match: 0.125, feedback: "คูณ $\\tfrac12 \\times \\tfrac14$ ต้องหาร" }
      - { match: 0.5, feedback: "หารเวลาด้วยระยะทาง ได้ชั่วโมงต่อกิโลเมตร ไม่ใช่กิโลเมตรต่อชั่วโมง" }
    solution: "$\\tfrac12 \\div \\tfrac14 = \\tfrac12 \\times 4 = 2$ กิโลเมตรต่อชั่วโมง (ใน 1 ชั่วโมงมี 4 ช่วงของ $\\tfrac14$ ชั่วโมง แต่ละช่วงเดิน $\\tfrac12$ กม.)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p015
    topics: [math.number.unit-rate]
    difficulty: 4
    type: numeric
    stem: "รถไฟฟ้าวิ่งด้วยอัตราเร็ว 72 กิโลเมตรต่อชั่วโมง คิดเป็นกี่เมตรต่อวินาที"
    answer: { value: 20, unit: ม./วินาที }
    hints:
      - "72 กิโลเมตร = 72,000 เมตร และ 1 ชั่วโมง = 3,600 วินาที"
      - "หาร 72,000 ด้วย 3,600"
    misconceptions:
      - { match: 259.2, feedback: "คูณด้วย 3.6 แต่เปลี่ยน กม./ชม. เป็น ม./วินาที ต้องหารด้วย 3.6" }
      - { match: 1200, feedback: "หารด้วย 60 ครั้งเดียว (ได้เมตรต่อนาที) ต้องหารด้วย 3,600 วินาที" }
    solution: "$72 \\,\\mathrm{km/h} = \\dfrac{72{,}000\\ \\mathrm{m}}{3{,}600\\ \\mathrm{s}} = 20\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p016
    topics: [math.number.unit-rate]
    difficulty: 4
    type: numeric
    stem: "ผสมน้ำหวานโดยใช้น้ำเชื่อมต่อน้ำเปล่าเป็น $2 : 7$ ถ้าต้องการน้ำหวานทั้งหมด 1,800 มิลลิลิตร ต้องใช้น้ำเชื่อมกี่มิลลิลิตร"
    answer: { value: 400, unit: มล. }
    hints:
      - "ทั้งหมดมีกี่ส่วน"
      - "น้ำเชื่อมเป็น $\\tfrac{2}{2 + 7}$ ของทั้งหมด"
    misconceptions:
      - { match: 514.29, feedback: "ใช้ $\\tfrac27$ ซึ่งเป็นน้ำเชื่อมเทียบกับน้ำเปล่า ต้องเทียบกับทั้งหมด 9 ส่วน" }
      - { match: 900, feedback: "แบ่งครึ่ง แต่สองอย่างไม่ได้มีปริมาณเท่ากัน" }
    solution: "ทั้งหมด $2 + 7 = 9$ ส่วน ส่วนละ $1{,}800 \\div 9 = 200$ มล. น้ำเชื่อม 2 ส่วน $= 400$ มล. (น้ำเปล่า 1,400 มล.)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p017
    topics: [math.number.unit-rate]
    difficulty: 4
    type: mcq
    stem: "ผงซักฟอกสามขนาดตามภาพ ถ้าใช้ราคาต่อ 100 กรัมตัดสิน ขนาดใดคุ้มที่สุด"
    figure:
      src: p-detergent.svg
      alt: "ผงซักฟอกสามถุง ถุง A ขนาด 900 กรัม ราคา 89 บาท ถุง B ขนาด 2.5 กิโลกรัม ราคา 229 บาท ถุง C ขนาด 400 กรัม ราคา 42 บาท"
    choices:
      - { id: a, text: "B", correct: true }
      - { id: b, text: "C", feedback: "C ราคาถูกที่สุดต่อถุง แต่ 100 กรัมละ 10.50 บาท แพงที่สุด" }
      - { id: c, text: "A", feedback: "A 100 กรัมละประมาณ 9.89 บาท ส่วน B 100 กรัมละ 9.16 บาท" }
      - { id: d, text: "คุ้มเท่ากันทุกขนาด", feedback: "ราคาต่อ 100 กรัมของทั้งสามถุงไม่เท่ากัน" }
    hints:
      - "เปลี่ยน 2.5 กิโลกรัมเป็นกรัมก่อน"
      - "หาราคาต่อ 100 กรัม: ราคา ÷ (จำนวนกรัม ÷ 100)"
    solution: "A: $89 \\div 9 \\approx 9.89$ บาท B: 2.5 กก. $= 2{,}500$ ก. $229 \\div 25 = 9.16$ บาท C: $42 \\div 4 = 10.50$ บาท ต่อ 100 กรัม B ถูกที่สุดจึงคุ้มที่สุด"
