<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300"><title>สายส่งข้อมูลและการพัฒนา AI มีขั้นตอนเก็บข้อมูล ทำความสะอาด ฝึก ประเมินแยกกลุ่ม จัดทำเอกสาร และติดตามหลังใช้งาน</title><rect width="720" height="300" fill="#ffffff"/><rect x="20" y="110" width="106" height="90" rx="8" fill="#eff6ff" stroke="#1f2937" stroke-width="1.2"/><text x="73" y="138" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">เก็บข้อมูล</text><text x="73" y="160" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">มีความยินยอม</text><text x="73" y="178" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">และแหล่งที่มา</text><line x1="126" y1="155" x2="138" y2="155" stroke="#1f2937" stroke-width="1.8"/><rect x="138" y="110" width="106" height="90" rx="8" fill="#f0fdf4" stroke="#1f2937" stroke-width="1.2"/><text x="191" y="138" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">ทำความสะอาด</text><text x="191" y="160" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">บันทึกการ</text><text x="191" y="178" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">เปลี่ยนแปลง</text><line x1="244" y1="155" x2="256" y2="155" stroke="#1f2937" stroke-width="1.8"/><rect x="256" y="110" width="106" height="90" rx="8" fill="#eff6ff" stroke="#1f2937" stroke-width="1.2"/><text x="309" y="138" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">ฝึกโมเดล</text><text x="309" y="160" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">บันทึกเวอร์ชัน</text><text x="309" y="178" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">และค่าตั้ง</text><line x1="362" y1="155" x2="374" y2="155" stroke="#1f2937" stroke-width="1.8"/><rect x="374" y="110" width="106" height="90" rx="8" fill="#f0fdf4" stroke="#1f2937" stroke-width="1.2"/><text x="427" y="138" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">ประเมินแยกกลุ่ม</text><text x="427" y="160" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">วัดผลในทุก</text><text x="427" y="178" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">กลุ่มผู้ใช้</text><line x1="480" y1="155" x2="492" y2="155" stroke="#1f2937" stroke-width="1.8"/><rect x="492" y="110" width="106" height="90" rx="8" fill="#eff6ff" stroke="#1f2937" stroke-width="1.2"/><text x="545" y="138" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">เอกสารกำกับ</text><text x="545" y="160" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">model card</text><text x="545" y="178" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">และ datasheet</text><line x1="598" y1="155" x2="610" y2="155" stroke="#1f2937" stroke-width="1.8"/><rect x="610" y="110" width="106" height="90" rx="8" fill="#f0fdf4" stroke="#1f2937" stroke-width="1.2"/><text x="663" y="138" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">ติดตามหลังใช้</text><text x="663" y="160" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">ตรวจผลและ</text><text x="663" y="178" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">รับเรื่องร้องเรียน</text><text x="360" y="60" font-family="sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="normal">ทุกขั้นต้องบันทึกไว้เพื่อให้ตรวจสอบย้อนหลังได้</text><text x="360" y="250" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">ตัวอย่างนี้เป็นแนวคิดทั่วไป ไม่ใช่ข้อกำหนดทางกฎหมายของประเทศใด</text></svg>
