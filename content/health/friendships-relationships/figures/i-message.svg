<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="sans-serif">
<title>สูตรพูดแบบใช้ ฉัน บอกความรู้สึกอย่างให้เกียรติ</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="0" y="0" width="640" height="330" fill="#ffffff"/>
<text x="320.0" y="32.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">พูดบอกความรู้สึกแบบให้เกียรติ: ใช้ "ฉัน" แทนการต่อว่า "เธอ"</text>
<rect x="20.0" y="55.0" width="290.0" height="110.0" rx="10" fill="#e3f2fd" stroke="#555" stroke-width="1.5" />
<text x="165.0" y="85.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">1 ฉันรู้สึก...</text>
<text x="165.0" y="110.0" font-size="14" text-anchor="middle" fill="#111">บอกความรู้สึก</text>
<text x="165.0" y="140.0" font-size="14" text-anchor="middle" fill="#1a3d7c">"เรารู้สึกเสียใจ"</text>
<rect x="330.0" y="55.0" width="290.0" height="110.0" rx="10" fill="#fff3e0" stroke="#555" stroke-width="1.5" />
<text x="475.0" y="85.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">2 เมื่อ...</text>
<text x="475.0" y="110.0" font-size="14" text-anchor="middle" fill="#111">บอกสิ่งที่เกิดขึ้น</text>
<text x="475.0" y="140.0" font-size="14" text-anchor="middle" fill="#1a3d7c">"ตอนที่เธอล้อชื่อพ่อแม่ของเรา"</text>
<rect x="20.0" y="180.0" width="290.0" height="110.0" rx="10" fill="#e8f5e9" stroke="#555" stroke-width="1.5" />
<text x="165.0" y="210.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">3 เพราะ...</text>
<text x="165.0" y="235.0" font-size="14" text-anchor="middle" fill="#111">บอกเหตุผล</text>
<text x="165.0" y="265.0" font-size="14" text-anchor="middle" fill="#1a3d7c">"เพราะเราอายเพื่อนคนอื่น"</text>
<rect x="330.0" y="180.0" width="290.0" height="110.0" rx="10" fill="#f3e5f5" stroke="#555" stroke-width="1.5" />
<text x="475.0" y="210.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">4 ฉันอยากให้...</text>
<text x="475.0" y="235.0" font-size="14" text-anchor="middle" fill="#111">บอกสิ่งที่ขอ</text>
<text x="475.0" y="265.0" font-size="14" text-anchor="middle" fill="#1a3d7c">"เราอยากให้เธอเรียกชื่อเราแทน"</text>
<text x="320.0" y="318.0" font-size="13" text-anchor="middle" fill="#8a1c1c">ไม่ใช้: "เธอนิสัยไม่ดี เธอชอบแกล้งคนอื่นตลอด" ซึ่งเป็นการต่อว่าและทำให้ทะเลาะกันมากขึ้น</text>
</svg>
