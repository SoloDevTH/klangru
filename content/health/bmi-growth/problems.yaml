problems:
  - id: hlt.bmi.p001
    topics: [health.body.bmi-growth]
    difficulty: 1
    type: mcq
    stem: "สูตรดัชนีมวลกาย (BMI) คือข้อใด"
    choices:
      - { id: a, text: "น้ำหนัก (กิโลกรัม) ÷ ส่วนสูง (เมตร) ยกกำลังสอง", correct: true }
      - { id: b, text: "น้ำหนัก (กิโลกรัม) ÷ ส่วนสูง (เมตร)", feedback: "ขาดการยกกำลังสอง ค่าที่ได้จะใหญ่เกินจริงมาก เช่น 60 ÷ 1.6 = 37.5" }
      - { id: c, text: "น้ำหนัก (กิโลกรัม) ÷ ส่วนสูง (เซนติเมตร) ยกกำลังสอง", feedback: "ส่วนสูงต้องเป็นเมตร ถ้าใช้เซนติเมตรจะได้ค่าเล็กมาก เช่น 60 ÷ 160² ≈ 0.0023" }
      - { id: d, text: "ส่วนสูง (เมตร) ÷ น้ำหนัก (กิโลกรัม)", feedback: "สลับตัวตั้งกับตัวหาร BMI เอาน้ำหนักเป็นตัวตั้ง" }
    hints:
      - "หน่วยของ BMI คือ kg/m²"
      - "หน่วย m² บอกว่าส่วนสูงเป็นเมตรและยกกำลังสอง"
    solution: "$\\text{BMI} = \\dfrac{\\text{น้ำหนัก (kg)}}{\\text{ส่วนสูง (m)}^2}$ หน่วยจึงเป็น $\\mathrm{kg/m^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.bmi.p002
    topics: [health.body.bmi-growth]
    difficulty: 1
    type: mcq
    multiple: true
    stem: "ปัจจัยใดมีผลต่อการเจริญเติบโตของร่างกาย (เลือกได้มากกว่าหนึ่งข้อ)"
    choices:
      - { id: a, text: "อาหารที่ครบ 5 หมู่และเพียงพอ", correct: true }
      - { id: b, text: "การนอนหลับที่เพียงพอ", correct: true }
      - { id: c, text: "การออกกำลังกายเป็นประจำ", correct: true }
      - { id: d, text: "พันธุกรรมจากพ่อแม่", correct: true }
      - { id: e, text: "สีของเสื้อผ้าที่สวมใส่", feedback: "สีเสื้อผ้าไม่เกี่ยวกับการเจริญเติบโต" }
    hints:
      - "คิดถึงสิ่งที่ร่างกายต้องใช้สร้างกระดูกและกล้ามเนื้อ และสิ่งที่ถ่ายทอดมาจากพ่อแม่"
      - "มีข้อผิดเพียงข้อเดียว"
    solution: "อาหาร การนอนหลับ การออกกำลังกาย และพันธุกรรม ล้วนมีผลต่อการเจริญเติบโต รวมทั้งสุขภาพและการเจ็บป่วย ส่วนสีเสื้อผ้าไม่มีผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.bmi.p003
    topics: [health.body.bmi-growth]
    difficulty: 1
    type: mcq
    stem: "น้องฝนอายุ 10 ปี คำนวณ BMI ของตัวเองได้ 19 ควรแปลผลอย่างไร"
    choices:
      - { id: a, text: "เทียบกับกราฟ BMI ตามอายุและเพศสำหรับเด็ก หรือให้ครูหรือเจ้าหน้าที่สาธารณสุขช่วยแปลผล", correct: true }
      - { id: b, text: "ปกติ เพราะอยู่ในช่วง 18.5–22.9", feedback: "ช่วง 18.5–22.9 เป็นเกณฑ์ของผู้ใหญ่อายุ 18 ปีขึ้นไป ใช้กับเด็กไม่ได้" }
      - { id: c, text: "ต่ำกว่าเกณฑ์ เพราะยังไม่ถึง 23", feedback: "23 เป็นขอบของช่วงน้ำหนักเกินในผู้ใหญ่ ไม่ใช่เกณฑ์ของเด็ก" }
    hints:
      - "เกณฑ์ในตาราง BMI ที่เรียนใช้กับคนอายุเท่าใด"
      - "ร่างกายเด็กเปลี่ยนไปตามอายุ เกณฑ์จึงต้องขึ้นกับอายุและเพศ"
    solution: "ตารางเกณฑ์ BMI ใช้กับผู้ใหญ่อายุ 18 ปีขึ้นไป เด็กและวัยรุ่นอายุ 5–19 ปีต้องเทียบกับกราฟ BMI ตามอายุและเพศ (BMI-for-age) ของ WHO หรือเกณฑ์อ้างอิงการเจริญเติบโตของเด็กไทย และควรให้บุคลากรสุขภาพแปลผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.bmi.p004
    topics: [health.body.bmi-growth]
    difficulty: 2
    type: numeric
    stem: "ผู้ใหญ่คนหนึ่งหนัก 60 กิโลกรัม สูง 1.60 เมตร มีดัชนีมวลกายเท่าใด (ตอบเป็นตัวเลขในหน่วย kg/m² ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 23.4, tolerance: 0.1, unit: "kg/m²" }
    hints:
      - "ยกกำลังสองส่วนสูงก่อน"
      - "$1.60^2 = 2.56$ แล้วนำ 60 หารด้วยค่านี้"
    misconceptions:
      - { match: 37.5, feedback: "นั่นคือ $60 \\div 1.60$ ยังไม่ได้ยกกำลังสองส่วนสูง" }
      - { match: 18.75, feedback: "ดูเหมือนคิด $1.60^2$ เป็น $1.60 \\times 2 = 3.2$ ยกกำลังสองคือคูณตัวเองสองครั้ง $1.60 \\times 1.60 = 2.56$" }
    solution: "$\\text{BMI} = \\dfrac{60}{1.60^2} = \\dfrac{60}{2.56} \\approx 23.4\\ \\mathrm{kg/m^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.bmi.p005
    topics: [health.body.bmi-growth]
    difficulty: 2
    type: numeric
    stem: "ขั้นแรกของการหา BMI ของคนสูง 1.70 เมตร คือหา $1.70^2$ มีค่าเท่าใด (ตอบเป็นตัวเลขในหน่วย m²)"
    answer: { value: 2.89, tolerance: 0.01, unit: "m²" }
    hints:
      - "ยกกำลังสองคือคูณตัวเลขนั้นกับตัวเอง"
      - "$1.70 \\times 1.70$ ระวังตำแหน่งทศนิยม"
    misconceptions:
      - { match: 3.4, feedback: "นั่นคือ $1.70 \\times 2$ ยกกำลังสองคือ $1.70 \\times 1.70$" }
      - { match: 28.9, feedback: "ตำแหน่งทศนิยมเลื่อนไป ทศนิยม 2 ตำแหน่งคูณทศนิยม 2 ตำแหน่งได้ทศนิยม 4 ตำแหน่ง: $1.70 \\times 1.70 = 2.8900$" }
    solution: "$1.70^2 = 1.70 \\times 1.70 = 2.89\\ \\mathrm{m^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.bmi.p006
    topics: [health.body.bmi-growth]
    difficulty: 2
    type: mcq
    stem: "ผู้ใหญ่อายุ 30 ปีมี BMI 21.5 kg/m² ตามเกณฑ์ผู้ใหญ่ชาวเอเชีย อยู่ในช่วงใด"
    choices:
      - { id: a, text: "น้ำหนักอยู่ในเกณฑ์ปกติ", correct: true }
      - { id: b, text: "น้ำหนักต่ำกว่าเกณฑ์", feedback: "ต่ำกว่าเกณฑ์คือต่ำกว่า 18.5 แต่ 21.5 มากกว่า 18.5" }
      - { id: c, text: "น้ำหนักเกิน (อ้วนระดับ 1)", feedback: "ช่วงนี้เริ่มที่ 23.0 ส่วน 21.5 ยังไม่ถึง" }
    hints:
      - "ช่วงปกติของผู้ใหญ่ชาวเอเชียคือ 18.5 ถึงเท่าใด"
      - "เทียบ 21.5 กับ 18.5 และ 22.9"
    solution: "21.5 อยู่ระหว่าง 18.5 กับ 22.9 จึงอยู่ในเกณฑ์ปกติ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.bmi.p007
    topics: [health.body.bmi-growth]
    difficulty: 2
    type: mcq
    stem: "ผู้ใหญ่ชาวไทยมี BMI 24.0 kg/m² ถ้าใช้เกณฑ์ผู้ใหญ่ชาวเอเชีย ข้อใดถูก"
    choices:
      - { id: a, text: "อยู่ในช่วงน้ำหนักเกิน (อ้วนระดับ 1) ตามเกณฑ์เอเชีย ซึ่งควรใช้เป็นข้อมูลคัดกรองประกอบกับรอบเอวและคำแนะนำของบุคลากรสุขภาพ", correct: true }
      - { id: b, text: "ปกติ เพราะไม่ถึง 25", feedback: "25 เป็นขอบของน้ำหนักเกินตามเกณฑ์สากลของ WHO สำหรับผู้ใหญ่ทั่วไป เกณฑ์เอเชียเริ่มช่วงน้ำหนักเกินที่ 23.0" }
      - { id: c, text: "เป็นโรคอ้วนระดับ 2 แน่นอน", feedback: "อ้วนระดับ 2 เริ่มที่ 25.0 และ BMI เป็นเครื่องมือคัดกรอง ไม่ใช่การวินิจฉัย" }
    hints:
      - "เกณฑ์เอเชียกับเกณฑ์สากลใช้ขอบช่วงน้ำหนักเกินต่างกัน"
      - "ช่วงน้ำหนักเกินตามเกณฑ์เอเชียคือ 23.0–24.9"
    solution: "ตามเกณฑ์ผู้ใหญ่ชาวเอเชีย 24.0 อยู่ในช่วง 23.0–24.9 คือน้ำหนักเกินหรืออ้วนระดับ 1 (ถ้าใช้เกณฑ์สากลจะยังอยู่ในช่วงปกติ) BMI เป็นเพียงเครื่องมือคัดกรอง ควรดูรอบเอวและปรึกษาบุคลากรสุขภาพประกอบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.bmi.p008
    topics: [health.body.bmi-growth]
    difficulty: 2
    type: numeric
    stem: "คุณครูสมศรีสูง 164 เซนติเมตร ตามคำแนะนำของกรมควบคุมโรค รอบเอวของผู้ใหญ่ไม่ควรเกินกี่เซนติเมตร (ตอบเป็นตัวเลขในหน่วย cm)"
    answer: { value: 82, unit: cm }
    hints:
      - "รอบเอวที่เหมาะสมขึ้นกับส่วนสูง"
      - "รอบเอวไม่ควรเกินส่วนสูงหารด้วย 2"
    misconceptions:
      - { match: 164, feedback: "164 คือส่วนสูง รอบเอวไม่ควรเกินครึ่งหนึ่งของส่วนสูง" }
      - { match: 328, feedback: "ดูเหมือนคูณ 2 ต้องหารด้วย 2" }
    solution: "รอบเอวไม่ควรเกิน $\\dfrac{164}{2} = 82$ เซนติเมตร วัดผ่านระดับสะดือ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.bmi.p009
    topics: [health.body.bmi-growth]
    difficulty: 3
    type: numeric
    stem: "พี่ชายอายุ 22 ปี หนัก 72 กิโลกรัม สูง 175 เซนติเมตร มีดัชนีมวลกายเท่าใด (ตอบเป็นตัวเลขในหน่วย kg/m² ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 23.5, tolerance: 0.1, unit: "kg/m²" }
    hints:
      - "เปลี่ยนส่วนสูงเป็นเมตรก่อน"
      - "$1.75^2 = 3.0625$ แล้วนำ 72 หารด้วยค่านี้"
    misconceptions:
      - { match: 41.1, feedback: "นั่นคือ $72 \\div 1.75$ ยังไม่ได้ยกกำลังสองส่วนสูง" }
      - { match: 0.0024, feedback: "ดูเหมือนใช้ส่วนสูงเป็นเซนติเมตร ($72 \\div 175^2$) ต้องเปลี่ยนเป็นเมตรก่อน" }
    solution: "$175\\ \\mathrm{cm} = 1.75\\ \\mathrm{m}$, $1.75^2 = 3.0625$, $\\text{BMI} = \\dfrac{72}{3.0625} \\approx 23.5\\ \\mathrm{kg/m^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.bmi.p010
    topics: [health.body.bmi-growth]
    difficulty: 3
    type: numeric
    stem: "ผู้ใหญ่สูง 1.55 เมตร มีดัชนีมวลกาย 22 kg/m² หนักกี่กิโลกรัม (ตอบเป็นตัวเลขในหน่วย kg ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 52.9, tolerance: 0.1, unit: kg }
    hints:
      - "จัดสูตร BMI ใหม่ให้น้ำหนักอยู่ข้างเดียว"
      - "น้ำหนัก = BMI × (ส่วนสูง)²"
    misconceptions:
      - { match: 34.1, feedback: "นั่นคือ $22 \\times 1.55$ ต้องคูณด้วยส่วนสูงยกกำลังสอง $1.55^2 = 2.4025$" }
      - { match: 14.19, feedback: "ดูเหมือนหาร $22 \\div 1.55$ เมื่อย้ายตัวหารข้ามสมการต้องเปลี่ยนเป็นการคูณ" }
    solution: "น้ำหนัก $= 22 \\times 1.55^2 = 22 \\times 2.4025 \\approx 52.9$ กิโลกรัม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.bmi.p011
    topics: [health.body.bmi-growth]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการหาและแปลผล BMI ของผู้ใหญ่ เมื่อรู้น้ำหนักเป็นกิโลกรัมและส่วนสูงเป็นเซนติเมตร"
    items:
      - "ตรวจว่าอายุ 18 ปีขึ้นไป จึงใช้เกณฑ์ผู้ใหญ่ได้"
      - "เปลี่ยนส่วนสูงจากเซนติเมตรเป็นเมตร"
      - "ยกกำลังสองส่วนสูงที่เป็นเมตร"
      - "นำน้ำหนักหารด้วยส่วนสูงยกกำลังสอง"
      - "เทียบผลกับตารางเกณฑ์ผู้ใหญ่ชาวเอเชีย"
    hints:
      - "ก่อนคำนวณ ต้องรู้ก่อนว่าจะใช้เกณฑ์ไหนได้"
      - "หน่วยต้องถูกก่อนยกกำลังสอง และต้องได้ตัวเลข BMI ก่อนเทียบตาราง"
    solution: "ตรวจอายุ → เปลี่ยนหน่วยส่วนสูงเป็นเมตร → ยกกำลังสอง → นำน้ำหนักมาหาร → เทียบตารางเกณฑ์ผู้ใหญ่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.bmi.p012
    topics: [health.body.bmi-growth]
    difficulty: 3
    type: numeric
    stem: "ผู้ใหญ่สูง 1.68 เมตร น้ำหนักมากที่สุดเท่าใดที่ BMI ยังไม่เกิน 22.9 kg/m² (ตอบเป็นตัวเลขในหน่วย kg ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 64.6, tolerance: 0.1, unit: kg }
    hints:
      - "น้ำหนัก = BMI × (ส่วนสูง)²"
      - "$1.68^2 = 2.8224$"
    misconceptions:
      - { match: 38.5, feedback: "นั่นคือ $22.9 \\times 1.68$ ต้องคูณด้วยส่วนสูงยกกำลังสอง" }
    solution: "น้ำหนักมากที่สุด $= 22.9 \\times 1.68^2 = 22.9 \\times 2.8224 \\approx 64.6$ กิโลกรัม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.bmi.p013
    topics: [health.body.bmi-growth]
    difficulty: 3
    type: mcq
    stem: "นักกีฬายกน้ำหนักทีมชาติอายุ 25 ปี มี BMI 27 kg/m² ทั้งที่มีไขมันในร่างกายไม่มาก ข้อใดอธิบายได้ดีที่สุด"
    choices:
      - { id: a, text: "BMI ไม่แยกน้ำหนักของกล้ามเนื้อกับไขมัน คนที่กล้ามเนื้อมากจึงอาจมี BMI สูง ต้องใช้ข้อมูลอื่นประกอบ", correct: true }
      - { id: b, text: "เครื่องชั่งต้องเสียแน่ ๆ", feedback: "ไม่จำเป็น กล้ามเนื้อหนาแน่นและหนัก น้ำหนักที่สูงจึงเป็นไปได้จริง" }
      - { id: c, text: "นักกีฬาคนนี้เป็นโรคอ้วนอย่างแน่นอน", feedback: "BMI เป็นเครื่องมือคัดกรอง ไม่ใช่การวินิจฉัย และไม่ได้วัดไขมันโดยตรง" }
      - { id: d, text: "สูตร BMI ใช้กับผู้ชายไม่ได้", feedback: "สูตรใช้กับผู้ใหญ่ทั้งชายและหญิง ข้อจำกัดอยู่ที่ไม่แยกกล้ามเนื้อกับไขมัน" }
    hints:
      - "BMI ใช้ข้อมูลอะไรบ้างในการคำนวณ"
      - "น้ำหนักตัวมาจากกล้ามเนื้อ กระดูก ไขมัน และน้ำ BMI แยกสิ่งเหล่านี้ได้หรือไม่"
    solution: "BMI ใช้เพียงน้ำหนักและส่วนสูง จึงไม่รู้ว่าน้ำหนักมาจากกล้ามเนื้อหรือไขมัน นักกีฬาที่กล้ามเนื้อมากอาจมี BMI สูงโดยไขมันไม่มาก จึงต้องดูข้อมูลอื่น เช่น รอบเอว และให้บุคลากรสุขภาพประเมิน"
