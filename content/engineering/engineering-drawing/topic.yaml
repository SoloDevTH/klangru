id: engineering.drawing.engineering-drawing
subject: engineering
title: { th: การเขียนแบบและอ่านแบบวิศวกรรม, en: Engineering drawing and drawing interpretation }
summary: ชนิดของเส้น ภาพฉายออร์โทกราฟิกมุมที่หนึ่งและมุมที่สาม ภาพไอโซเมตริก ภาพตัด มาตราส่วน การกำหนดขนาด พิกัดความเผื่อ และการอ่านแบบโยธา เครื่องกล และไฟฟ้า
difficulty: 4.5
minutes: 40
prerequisites: [math.geometry.volume-surface, math.geometry.angles, math.geometry.similarity]
encompasses:
  - { id: math.geometry.similarity, weight: 0.3 }
  - { id: math.geometry.volume-surface, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ชนิดของเส้นในแบบวิศวกรรม
    src: line-types.svg
    alt: "ตารางตัวอย่างเส้นหกแบบ เส้นเต็มหนาใช้กับขอบและเส้นรอบรูปที่มองเห็น เส้นประใช้กับขอบที่ถูกบัง เส้นลูกโซ่บาง (ขีดยาวสลับขีดสั้น) ใช้กับเส้นศูนย์กลางและแกนสมมาตร เส้นเต็มบางใช้กับเส้นช่วยกำหนดขนาดและลายตัด เส้นลูกโซ่ที่ปลายทั้งสองหนาและมีลูกศรกับตัวอักษร A ใช้บอกแนวระนาบตัด และเส้นบอกขนาดมีหัวลูกศรสองข้าง ตัวเลข 45 อยู่เหนือเส้น"
  - type: figure
    title: ภาพไอโซเมตริกและภาพฉายสามด้าน
    src: orthographic-views.svg
    alt: "ซ้าย: ภาพไอโซเมตริกของชิ้นงานรูปตัวแอล ฐานยาวเตี้ยและมีส่วนตั้งสูงอยู่ด้านซ้าย ขอบแนวราบเอียง 30 องศา ลูกศรสีแดงชี้ไปที่ด้านที่เห็นเป็นรูปตัวแอลว่าเป็นด้านหน้า ขวา: ภาพฉายมุมที่หนึ่ง ภาพด้านหน้าเป็นรูปตัวแอล ภาพด้านบนวางใต้ภาพด้านหน้าเป็นสี่เหลี่ยมผืนผ้ามีเส้นแนวตั้งแบ่งตรงขอบของส่วนตั้ง ภาพด้านขวาวางทางซ้ายของภาพด้านหน้าเป็นสี่เหลี่ยมมีเส้นแนวนอนตรงระดับผิวบนของฐาน"
    caption: "ภาพด้านหน้ากับภาพด้านบนมีความยาวตรงกันในแนวตั้ง ภาพด้านหน้ากับภาพด้านข้างมีความสูงตรงกันในแนวนอน"
  - type: worked-example
    title: อ่านขนาดจริงจากแบบบ้าน
    problem: "แบบแปลนบ้านชั้นเดียวมาตราส่วน 1:100 วัดความกว้างของห้องนั่งเล่นในแบบได้ $38\\ \\mathrm{mm}$ และความยาว $52\\ \\mathrm{mm}$ ห้องจริงกว้างยาวเท่าใด และมีพื้นที่กี่ตารางเมตร"
    steps:
      - text: "มาตราส่วน 1:100 แปลว่าขนาดจริงเป็น 100 เท่าของขนาดในแบบ"
      - text: "กว้าง $38 \\times 100 = 3800\\ \\mathrm{mm} = 3.8\\ \\mathrm{m}$ ยาว $52 \\times 100 = 5200\\ \\mathrm{mm} = 5.2\\ \\mathrm{m}$"
      - text: "พื้นที่ $3.8 \\times 5.2 = 19.76\\ \\mathrm{m^2}$"
        why: "คูณความยาวจริงสองด้าน หรือคิดจากพื้นที่ในแบบ $38 \\times 52 = 1976\\ \\mathrm{mm^2}$ คูณ $100^2$ ได้ $19\\,760\\,000\\ \\mathrm{mm^2}$ ซึ่งเท่ากัน พื้นที่ขยายตามกำลังสองของมาตราส่วน"
    answer: "ห้องกว้าง $3.8\\ \\mathrm{m}$ ยาว $5.2\\ \\mathrm{m}$ พื้นที่ประมาณ $19.8\\ \\mathrm{m^2}$"
  - { type: check, problem: engineering.drawing.engineering-drawing.p003, prompt: "ขนาดจริง = ขนาดในแบบ × ตัวเลขหลังเครื่องหมาย :" }
  - type: figure
    title: ภาพตัดเต็ม
    src: section-view.svg
    alt: "ขวา: ภาพด้านบนของแท่งสี่เหลี่ยมที่มีวงกลมซ้อนสองวงตรงกลาง (รูขั้นบันได) มีเส้นลูกโซ่ปลายหนาลากผ่านกึ่งกลางตามแนวนอน ปลายมีลูกศรชี้ขึ้นและตัวอักษร A ซ้าย: ภาพตัด A–A เห็นเนื้อวัสดุสองข้างแรเงาด้วยเส้นเอียง 45 องศา ตรงกลางเป็นรูที่ไม่แรเงา ส่วนบนของรูกว้างกว่าส่วนล่าง และมีเส้นศูนย์กลางแนวตั้งผ่านรู"
  - type: worked-example
    title: การสวมของเพลากับรู
    problem: "รูมีขนาด $40.000$ ถึง $40.025\\ \\mathrm{mm}$ เพลามีขนาด $39.950$ ถึง $39.975\\ \\mathrm{mm}$ จงหาระยะช่องว่างมากสุดและน้อยสุด และบอกชนิดการสวม"
    steps:
      - text: "ระยะช่องว่างมากสุดเกิดเมื่อรูใหญ่สุดและเพลาเล็กสุด: $40.025 - 39.950 = 0.075\\ \\mathrm{mm}$"
      - text: "ระยะช่องว่างน้อยสุดเกิดเมื่อรูเล็กสุดและเพลาใหญ่สุด: $40.000 - 39.975 = 0.025\\ \\mathrm{mm}$"
        why: "นี่คือกรณีที่แน่นที่สุดที่อาจเกิดขึ้นได้จากชิ้นงานที่ผ่านการตรวจ"
      - text: "ทั้งสองค่าเป็นบวก เพลาเล็กกว่ารูเสมอ จึงเป็นการสวมคลอน"
    answer: "ช่องว่าง $0.025$ ถึง $0.075\\ \\mathrm{mm}$ เป็นการสวมคลอน (clearance fit)"
  - { type: check, problem: engineering.drawing.engineering-drawing.p008, prompt: "จับคู่ขนาดสุดขั้วที่ให้ช่องว่างกว้างที่สุด" }
glossary:
  - { term: ภาพฉายออร์โทกราฟิก, definition: "ภาพสองมิติที่ได้จากการมองชิ้นงานตั้งฉากกับแต่ละด้าน เช่น ภาพด้านหน้า ภาพด้านบน ภาพด้านข้าง (orthographic projection)" }
  - { term: ภาพฉายมุมที่หนึ่ง, definition: "ระบบวางภาพที่ภาพด้านบนอยู่ใต้ภาพด้านหน้าและภาพด้านขวาอยู่ทางซ้าย (first-angle projection)" }
  - { term: ภาพไอโซเมตริก, definition: "ภาพสามมิติที่ขอบแนวราบเอียง 30 องศาจากแนวนอน วัดความยาวจริงตามแนวแกน (isometric drawing)" }
  - { term: ภาพตัด, definition: "ภาพที่สมมติว่าตัดชิ้นงานด้วยระนาบเพื่อแสดงรูปร่างภายใน เนื้อวัสดุที่ถูกตัดแรเงาด้วยลายตัด (sectional view)" }
  - { term: พิกัดความเผื่อ, definition: "ผลต่างระหว่างขนาดใหญ่สุดกับเล็กสุดที่ยอมรับได้ของขนาดหนึ่ง (tolerance)" }
  - { term: มาตราส่วน, definition: "อัตราส่วนขนาดในแบบต่อขนาดจริง เช่น 1:100 (scale)" }
flashcards:
  - { front: "เส้นประในแบบหมายถึงอะไร", back: "ขอบหรือเส้นรอบรูปที่ถูกบัง มองไม่เห็นจากทิศที่มอง" }
  - { front: "ภาพฉายมุมที่หนึ่ง: ภาพด้านบนและภาพด้านขวาวางที่ใด", back: "ภาพด้านบนวางใต้ภาพด้านหน้า ภาพด้านขวาวางทางซ้ายของภาพด้านหน้า (มุมที่สามกลับกัน)" }
  - { front: "มาตราส่วน 1:50 พื้นที่ในแบบ 1 ตารางหน่วย เท่ากับพื้นที่จริงเท่าใด", back: "$50^2 = 2500$ ตารางหน่วย พื้นที่ขยายตามกำลังสองของมาตราส่วน" }
  - { front: "ระยะช่องว่างมากสุดของเพลาในรู", back: "รูใหญ่สุด − เพลาเล็กสุด" }
  - { front: "ตัวเลขกำหนดขนาดในแบบมาตราส่วน 1:100 เป็นขนาดแบบใด", back: "ขนาดจริงของชิ้นงานเสมอ ไม่ต้องคูณมาตราส่วน" }
