id: math.prob.probability
subject: math
title: { th: ความน่าจะเป็น, en: Probability }
summary: บอกโอกาสเป็นตัวเลขจาก 0 ถึง 1 ด้วยปริภูมิตัวอย่าง เหตุการณ์ตรงข้าม และเหตุการณ์อิสระ ผ่านลูกเต๋าและเหรียญ
difficulty: 4
minutes: 30
prerequisites: [math.number.fractions, math.prob.counting]
encompasses:
  - { id: math.number.fractions, weight: 0.4 }
  - { id: math.prob.counting, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - { type: check, problem: math.prob.p014, prompt: "ความน่าจะเป็นอยู่ในช่วงใด" }
  - type: worked-example
    title: ความถี่สัมพัทธ์กับความน่าจะเป็นตามทฤษฎี
    problem: "นักเรียนโยนเหรียญ 50 ครั้ง ได้หัว 29 ครั้ง ความถี่สัมพัทธ์ของการได้หัวเป็นเท่าใด เหรียญนี้ไม่เที่ยงตรงหรือไม่ และถ้าโยน 1,000 ครั้ง คาดว่าจะได้หัวประมาณกี่ครั้ง"
    figure: { src: relative-frequency.svg, alt: "กราฟสัดส่วนการออกหัวเมื่อโยนเหรียญตั้งแต่ 1 ถึง 1,000 ครั้ง แกนนอนเป็นสเกลลอการิทึม ช่วงแรกสัดส่วนแกว่งมากระหว่าง 0.6 ถึง 1 แล้วค่อย ๆ เข้าใกล้เส้นประที่ 0.5 จบที่ประมาณ 0.54 เมื่อโยน 1,000 ครั้ง" }
    steps:
      - text: "ความถี่สัมพัทธ์ $= \\frac{29}{50} = 0.58$"
      - text: "ความน่าจะเป็นตามทฤษฎีของเหรียญเที่ยงตรงคือ 0.5 ผลทดลองต่างไป 0.08"
      - text: "50 ครั้งยังน้อย ความถี่สัมพัทธ์แกว่งได้มาก (ในกราฟ ช่วง 50 ครั้งแรกแกว่งระหว่างประมาณ 0.57 ถึง 1) จึงยังสรุปไม่ได้ว่าเหรียญไม่เที่ยงตรง"
        why: "ความถี่สัมพัทธ์เข้าใกล้ความน่าจะเป็นจริงเมื่อทดลองจำนวนมาก ไม่ใช่เมื่อทดลองไม่กี่ครั้ง"
      - text: "ถ้าเหรียญเที่ยงตรง โยน 1,000 ครั้ง คาดว่าได้หัวประมาณ $1000 \\times 0.5 = 500$ ครั้ง"
        why: "จำนวนที่คาดหมาย = จำนวนครั้ง × ความน่าจะเป็น ผลจริงอาจคลาดไปบ้าง"
    answer: "ความถี่สัมพัทธ์ 0.58 ยังสรุปไม่ได้ว่าเหรียญไม่เที่ยงตรง และคาดว่าได้หัวประมาณ 500 ครั้งจาก 1,000 ครั้ง"
  - { type: check, problem: math.prob.p015, prompt: "คำนวณความถี่สัมพัทธ์จากผลการทดลอง" }
  - type: worked-example
    title: แผนภาพต้นไม้เมื่อหยิบไม่ใส่คืน
    problem: "ในถุงมีลูกอมสีแดง 3 เม็ด สีเขียว 2 เม็ด หยิบทีละเม็ด 2 ครั้งโดยไม่ใส่คืน ความน่าจะเป็นที่ได้สีแดงทั้งสองเม็ดเป็นเท่าใด และต่างจากการหยิบแบบใส่คืนอย่างไร"
    figure: { src: tree-we.svg, alt: "แผนภาพต้นไม้สองขั้น ครั้งแรกแดง 3/5 เขียว 2/5 หลังได้แดง ครั้งที่สองแดง 2/4 เขียว 2/4 หลังได้เขียว ครั้งที่สองแดง 3/4 เขียว 1/4 ปลายกิ่งเขียนผลคูณ แดงแดง 6/20 แดงเขียว 6/20 เขียวแดง 6/20 เขียวเขียว 2/20" }
    steps:
      - text: "ครั้งแรก: ได้แดง $\\frac{3}{5}$"
      - text: "ครั้งที่สอง (ได้แดงไปแล้ว): เหลือแดง 2 เม็ดจาก 4 เม็ด ได้แดงอีก $\\frac{2}{4}$"
        why: "ไม่ใส่คืน ถุงเหลือ 4 เม็ด และแดงลดลงหนึ่งเม็ด ความน่าจะเป็นของขั้นที่สองจึงเปลี่ยน"
      - text: "คูณตามกิ่ง: $\\frac{3}{5} \\times \\frac{2}{4} = \\frac{6}{20} = 0.3$"
      - text: "ตรวจว่าปลายกิ่งรวมกันได้ 1: $\\frac{6 + 6 + 6 + 2}{20} = 1$ ✓"
      - text: "ถ้าใส่คืน ทั้งสองครั้งเป็น $\\frac{3}{5}$ ได้ $\\frac{3}{5} \\times \\frac{3}{5} = \\frac{9}{25} = 0.36$ มากกว่า เพราะครั้งที่สองยังมีแดงครบ 3 เม็ด"
    answer: "ไม่ใส่คืน 0.3 ส่วนใส่คืน 0.36"
  - type: simulation
    title: ปล่อยลูกบอลผ่านหมุด (PhET Plinko Probability)
    url: https://phet.colorado.edu/en/simulations/plinko-probability
    provider: phet
    note: ปล่อยลูกบอลทีละลูกแล้วปล่อยทีละมาก ๆ สังเกตว่าผลแต่ละครั้งเดาไม่ได้ แต่เมื่อทดลองหลายครั้ง สัดส่วนของแต่ละช่องจะนิ่งขึ้น
glossary:
  - { term: ปริภูมิตัวอย่าง, definition: "เซตของผลลัพธ์ที่เป็นไปได้ทั้งหมดของการทดลองสุ่ม เขียนแทนด้วย $S$" }
  - { term: เหตุการณ์, definition: "ส่วนหนึ่งของปริภูมิตัวอย่างที่เราสนใจ เช่น ได้แต้มคู่ $= \\{2, 4, 6\\}$" }
  - { term: เหตุการณ์ตรงข้าม, definition: "เหตุการณ์ที่ $E$ ไม่เกิด เขียนว่า $E'$ และ $P(E') = 1 - P(E)$" }
  - { term: เหตุการณ์อิสระ, definition: "เหตุการณ์ที่การเกิดของอันหนึ่งไม่เปลี่ยนโอกาสของอีกอัน จึงได้ $P(A \\text{ และ } B) = P(A) \\times P(B)$" }
flashcards:
  - { front: "สูตรความน่าจะเป็นเมื่อทุกผลลัพธ์มีโอกาสเท่ากัน", back: "$P(E) = \\frac{n(E)}{n(S)}$" }
  - { front: "ความน่าจะเป็นมีค่าอยู่ในช่วงใด", back: "$0 \\le P(E) \\le 1$ โดย 0 คือเป็นไปไม่ได้ และ 1 คือแน่นอน" }
  - { front: "ทอยลูกเต๋า 2 ลูก มีผลลัพธ์ทั้งหมดกี่แบบ", back: "$6 \\times 6 = 36$ แบบ" }
  - { front: "โจทย์ \"อย่างน้อยหนึ่ง\" คิดอย่างไรให้ง่าย", back: "ใช้เหตุการณ์ตรงข้าม: $1 - P(\\text{ไม่เกิดเลย})$" }
