      - { match: 15, feedback: "ดูเหมือนหาร $32 \\div 2 = 16$ แล้วลบ 1 แต่ $x + 1$ เป็นเลขชี้กำลัง ไม่ใช่ตัวคูณ" }
    solution: "$32 = 2^5$ จึงได้ $2^{x+1} = 2^5$ เลขชี้กำลังเท่ากัน $x + 1 = 5$ ได้ $x = 4$ ตรวจ: $2^5 = 32$ ✓"
