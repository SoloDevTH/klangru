  - id: computer.ai.model-evaluation.p015
    topics: [computer.ai.model-evaluation]
    difficulty: 4
    type: code
    stem: "เขียนฟังก์ชัน `mae(y_true, y_pred)` รับลิสต์ของค่าจริงและค่าทำนายเป็นตัวเลข แล้วคืนค่าคลาดเคลื่อนสัมบูรณ์เฉลี่ย (MAE) เป็นจำนวนทศนิยม"
    starter: |
      def mae(y_true, y_pred):
          pass
    tests: |
      r = mae([10, 12, 15], [11, 15, 13])
      assert abs(r - 2.0) < 1e-9, f"ควรได้ 2.0 แต่ได้ {r}"
      r2 = mae([1, 2], [1, 2])
      assert abs(r2 - 0.0) < 1e-9, f"ค่าทำนายตรงทุกค่าควรได้ 0 แต่ได้ {r2}"
    reference: |
      def mae(y_true, y_pred):
          diffs = [abs(t - p) for t, p in zip(y_true, y_pred)]
          return sum(diffs) / len(diffs)
    hints:
      - "หาผลต่างของแต่ละคู่แล้วใช้ abs ให้เป็นค่าบวก"
      - "รวมค่าสัมบูรณ์ทั้งหมดก่อน"
      - "หารด้วยจำนวนคู่ทั้งหมด"
    solution: "คำนวณ |y − ŷ| ของทุกคู่ แล้วหาค่าเฉลี่ยด้วยการรวมและหารด้วยจำนวนคู่"
