  - id: chemistry.materials.polymers-ceramics-composites.p014
    topics: [chemistry.materials.polymers-ceramics-composites]
    difficulty: 5
    type: mcq
    stem: "ร้านกาแฟเปลี่ยนมาใช้แก้วพลาสติกชีวภาพ PLA ที่ทำจากแป้งมันสำปะหลัง และติดป้ายว่า \"ย่อยสลายได้ 100% ทิ้งที่ไหนก็ไม่เป็นปัญหา\" ข้อใดประเมินป้ายนี้ได้ถูกต้องที่สุด"
    choices:
      - { id: a, text: "ไม่ถูกต้องทั้งหมด PLA ย่อยสลายได้เร็วในโรงหมักปุ๋ยที่ควบคุมอุณหภูมิ แต่ถ้าทิ้งในดินหรือทะเลยังย่อยสลายช้า จึงต้องแยกทิ้งให้ถูกวิธี", correct: true, feedback: "ถูก วัสดุทางเลือกช่วยได้ก็ต่อเมื่อมีระบบจัดการที่เหมาะสม และการลดใช้ยังสำคัญที่สุด" }
      - { id: b, text: "ถูกต้อง เพราะทำจากพืช จึงย่อยสลายทันทีในทุกสภาพแวดล้อม", feedback: "การมาจากพืชไม่ได้แปลว่าย่อยสลายเร็วในทุกที่ PLA ต้องการความร้อนและความชื้นที่เหมาะสม" }
      - { id: c, text: "ไม่ถูกต้อง เพราะ PLA เป็นเซรามิก", feedback: "PLA เป็นพอลิเมอร์ ไม่ใช่เซรามิก" }
      - { id: d, text: "ถูกต้อง และควรเปลี่ยนไปใช้แก้วใช้ครั้งเดียวมากขึ้น เพราะไม่เป็นขยะ", feedback: "แก้วใช้ครั้งเดียวทุกชนิดใช้ทรัพยากรและพลังงาน การใช้แก้วส่วนตัวซ้ำคุ้มค่ากว่า" }
    hints:
      - "พลาสติกชีวภาพต้องการสภาวะแบบใดจึงย่อยสลายได้เร็ว"
      - "การใช้วัสดุอย่างคุ้มค่าเริ่มที่ลดการใช้"
    solution: "PLA ย่อยสลายได้ดีใน **โรงหมักปุ๋ยอุตสาหกรรม** แต่ในดินหรือทะเลยังย่อยช้า ป้ายนี้จึงทำให้เข้าใจผิด วิธีที่คุ้มค่ากว่าคือลดการใช้และพกแก้วส่วนตัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.polymers-ceramics-composites.p015
    topics: [chemistry.materials.polymers-ceramics-composites]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นแนวทางใช้วัสดุอย่างประหยัดและคุ้มค่า (เลือกได้มากกว่า 1 ข้อ)"
    choices:
      - { id: a, text: "ล้างขวด PET ให้สะอาด แยกจากขยะเปียก แล้วส่งรีไซเคิล", correct: true, feedback: "ถูก ขวดที่สะอาดและแยกประเภทแล้วรีไซเคิลได้คุ้มค่ากว่า" }
      - { id: b, text: "ซ่อมเก้าอี้พลาสติกที่ขาหักด้วยเหล็กดามแทนการซื้อใหม่", correct: true, feedback: "ถูก การซ่อมยืดอายุการใช้งาน ลดการใช้ทรัพยากรใหม่" }
      - { id: c, text: "เผาขยะพลาสติกที่บ้านเพื่อให้ขยะหมดเร็ว", feedback: "การเผาพลาสติกในที่โล่งปล่อยควันพิษและฝุ่น PM2.5" }
      - { id: d, text: "ใส่แกงร้อนในกล่องโฟมแล้วอุ่นในไมโครเวฟ", feedback: "โฟม PS ไม่ทนความร้อนสูง อาจเสียรูปและปนเปื้อนอาหาร ควรใช้ภาชนะที่เหมาะกับงาน" }
      - { id: e, text: "นำเศษกระเบื้องที่แตกไปบดผสมทำวัสดุปูทางเดิน", correct: true, feedback: "ถูก นำเศษเซรามิกกลับมาใช้ประโยชน์ใหม่" }
    hints:
      - "นึกถึงการลด ใช้ซ้ำ และรีไซเคิล"
      - "วิธีที่สร้างมลพิษหรือใช้วัสดุผิดงานไม่ถือว่าคุ้มค่า"
    solution: "ข้อ ก ข และ จ เป็นการรีไซเคิล ซ่อม และนำกลับมาใช้ใหม่ ข้อ ค สร้างมลพิษ ข้อ ง ใช้วัสดุไม่เหมาะกับงาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.polymers-ceramics-composites.p016
    topics: [chemistry.materials.polymers-ceramics-composites]
    difficulty: 3
    type: numeric
    stem: "ตัวเรือหางยาวไฟเบอร์กลาสลำหนึ่งหนัก 120 kg เป็นใยแก้วร้อยละ 35 โดยมวล ที่เหลือเป็นเรซินพลาสติก ตัวเรือมีเรซินกี่กิโลกรัม"
    answer: { value: 78, tolerance: 0.5, unit: kg }
    misconceptions:
      - { match: 42, feedback: "นี่คือมวลของใยแก้ว (ร้อยละ 35) โจทย์ถามเรซิน" }
      - { match: 65, feedback: "65 คือร้อยละของเรซิน ต้องคูณกับมวลเรือก่อน" }
    hints:
      - "เรซินคิดเป็นร้อยละ $100 - 35$"
      - "มวลเรซิน = 120 × ร้อยละของเรซิน ÷ 100"
    solution: "เรซินร้อยละ $100 - 35 = 65$ มวล $= 120 \\times 0.65 =$ **78 kg**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.polymers-ceramics-composites.p017
