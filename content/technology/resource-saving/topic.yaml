id: technology.living.resource-saving
subject: technology
title:
  th: ใช้พลังงานและทรัพยากรในการทำงานอย่างประหยัด คุ้มค่า และยั่งยืน
  en: Saving energy and resources at work
summary: ความต่างระหว่างการประหยัดกับการคุ้มค่า หลัก 5R การคิดหน่วยไฟฟ้าและค่าไฟตลอดอายุการใช้งาน การเลือกเครื่องใช้ที่คุ้มค่า และการวางแผนลดการใช้น้ำและไฟในงานประจำวัน
difficulty: 3
minutes: 30
prerequisites:
- technology.living.work-process
- physics.energy.energy-electricity-intro
encompasses:
- id: technology.living.work-process
  weight: 0.2
- id: physics.energy.energy-electricity-intro
  weight: 0.3
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  title: หลัก 5R
  src: ladder.svg
  alt: แผนภาพขั้นบันไดห้าขั้นเรียงลงมาทางขวา ขั้น 1 ปฏิเสธ ไม่รับสิ่งที่ไม่จำเป็น ขั้น 2 ลด ซื้อและใช้เท่าที่ต้องใช้ ขั้น 3 ใช้ซ้ำ ใช้ของเดิมอีกครั้งโดยไม่แปรรูป ขั้น 4 ซ่อม ทำให้ของเสียกลับมาใช้ได้ ขั้น 5 รีไซเคิล นำวัสดุไปแปรรูปเป็นของใหม่ มีคำกำกับว่ายิ่งอยู่ด้านบนยิ่งลดการใช้ทรัพยากรได้มาก
- type: worked-example
  title: คิดค่าไฟของหลอดไฟหนึ่งดวงตลอดเดือน
  problem: หลอดไฟกำลัง 40 วัตต์ เปิดวันละ 4 ชั่วโมง ทั้งเดือน 30 วัน ค่าไฟหน่วยละ 4 บาท (สมมติ) จะเสียค่าไฟเท่าใดต่อเดือน
  steps:
  - text: แปลงกำลังไฟเป็นกิโลวัตต์ 40 ÷ 1000 = 0.04 กิโลวัตต์
    why: หน่วยไฟฟ้าที่คิดเงินคือกิโลวัตต์-ชั่วโมง จึงต้องแปลงวัตต์ก่อน
  - text: หาพลังงานต่อวัน 0.04 × 4 = 0.16 หน่วย
  - text: หาพลังงานทั้งเดือน 0.16 × 30 = 4.8 หน่วย
  - text: คิดเป็นเงิน 4.8 × 4 = 19.2 บาท
    why: ถ้าลืมแปลงวัตต์ ค่าที่ได้จะใหญ่กว่าความจริงถึง 1000 เท่า
  answer: เสียค่าไฟประมาณ 19.2 บาทต่อเดือน
- type: figure
  title: ค่าใช้จ่ายหลอดไฟเมื่อใช้ 10,000 ชั่วโมง
  src: cost.svg
  alt: แผนภูมิแท่งเปรียบเทียบค่าใช้จ่ายหลอดไฟ 10,000 ชั่วโมง แท่งหลอดไส้ 60 วัตต์รวม 2,600 บาท แบ่งเป็นค่าหลอด 200 บาทและค่าไฟ 2,400 บาท แท่งหลอด LED 9 วัตต์รวม 480 บาท แบ่งเป็นค่าหลอด 120 บาทและค่าไฟ 360 บาท ราคาหลอด อายุหลอด และค่าไฟหน่วยละ 4 บาทเป็นค่าสมมติ
- type: worked-example
  title: เลือกหลอดไฟจากค่าใช้จ่ายรวม
  problem: จากภาพ หลอดไส้และหลอด LED แบบใดคุ้มกว่าเมื่อใช้ 10,000 ชั่วโมง และคุ้มกว่าอยู่เท่าใด
  steps:
  - text: หาค่าใช้จ่ายรวมของหลอดไส้ จากภาพ 2,600 บาท
  - text: หาค่าใช้จ่ายรวมของหลอด LED จากภาพ 480 บาท
  - text: เทียบส่วนต่าง 2,600 − 480 = 2,120 บาท
    why: เทียบค่ารวมทั้งค่าหลอดและค่าไฟ ไม่ใช่เทียบเฉพาะราคาซื้อหลอดแต่ละหลอด
  answer: หลอด LED คุ้มกว่า โดยประหยัดได้ 2,120 บาทในช่วง 10,000 ชั่วโมง
- type: check
  problem: technology.living.resource-saving.p002
  prompt: ลองคิดถึงการใช้น้ำและไฟที่บ้านคุณดู มีจุดใดที่ยังใช้เกินความจำเป็นบ้าง
- type: check
  problem: technology.living.resource-saving.p014
  prompt: ถ้าเครื่องใช้ที่บ้านเริ่มเสียเล็กน้อย คุณจะคิดอะไรก่อนตัดสินใจ
glossary:
- term: ทรัพยากร
  definition: สิ่งที่ใช้ในการทำงาน เช่น ไฟฟ้า น้ำ แก๊ส วัสดุ เวลา และเงิน ซึ่งมีจำกัด
- term: ประหยัด
  definition: การใช้ทรัพยากรน้อยลงเมื่อเทียบกับเดิม
- term: คุ้มค่า
  definition: การได้ผลลัพธ์ที่ดีต่อทรัพยากรที่ใช้ไป ซึ่งอาจไม่ตรงกับการใช้น้อยที่สุดเสมอไป
- term: หลัก 5R
  definition: แนวคิดการจัดการทรัพยากรและขยะ 5 ขั้น ได้แก่ ปฏิเสธ ลด ใช้ซ้ำ ซ่อม และรีไซเคิล
- term: กิโลวัตต์-ชั่วโมง (kWh)
  definition: หน่วยพลังงานไฟฟ้าที่ใช้คิดค่าไฟ เท่ากับกำลังไฟเป็นกิโลวัตต์คูณชั่วโมงที่ใช้
flashcards:
- front: ประหยัดกับคุ้มค่าต่างกันอย่างไร
  back: ประหยัดคือใช้น้อยลง ส่วนคุ้มค่าคือได้ผลดีต่อทรัพยากรที่ใช้ไป ต้องพิจารณาทั้งสองอย่างด้วยกัน
- front: หลัก 5R มีอะไรบ้าง
  back: ปฏิเสธ ลด ใช้ซ้ำ ซ่อม และรีไซเคิล เรียงจากลดการใช้มากที่สุดไปน้อยที่สุด
- front: 1 กิโลวัตต์-ชั่วโมงคืออะไร
  back: พลังงานที่ใช้เมื่อเครื่องกำลัง 1 กิโลวัตต์ (1,000 วัตต์) ทำงานนาน 1 ชั่วโมง ใช้คิดค่าไฟ
- front: ทำไมต้องดูค่าไฟตลอดอายุการใช้งาน
  back: เพราะเครื่องที่ราคาซื้อสูงกว่าอาจกินไฟน้อยและอายุยาวกว่า ทำให้ค่าใช้จ่ายรวมต่ำกว่า
