# หัวข้อในคลังที่สอนเนื้อหาของตัวชี้วัดสาระเศรษฐศาสตร์ (ส 3.1, ส 3.2) จริง ตัดสินจาก lesson.md และ problems.yaml ของหัวข้อ
framework: th-core-2551-social-economics
mappings:
  - topic: business.accounting.equation
    indicators: ["ส 3.1 ป.2/3"]
    coverage: partial
    note: "บันทึกรายรับรายจ่ายของกิจการ (รายได้ ค่าใช้จ่าย เงินสดเข้าออก) และสรุปเป็นกำไรขาดทุน ตัวชี้วัดเน้นรายรับรายจ่ายของตนเอง หัวข้อนี้ใช้ตัวอย่างร้านค้าและแผงตลาดนัด ยังไม่มีบัญชีรายรับรายจ่ายส่วนตัว"
  - topic: management.principles.functions
    indicators: ["ส 3.1 ป.6/1"]
    coverage: partial
    note: "สอนผู้มีส่วนได้ส่วนเสียและการชั่งน้ำหนักผลกระทบต่อลูกค้า พนักงาน ชุมชน และรัฐ ซึ่งเป็นบทบาทของผู้ผลิตที่มีความรับผิดชอบ ยังไม่ลงรายละเอียดเรื่องคุณภาพสินค้าและการคุ้มครองผู้บริโภค"
  - topic: business.econ.personal-budget
    indicators: [ส 3.1 ป.1/2, ส 3.1 ป.2/4, ส 3.1 ป.2/2, ส 3.1 ป.2/3, ส 3.1 ป.3/2]
    coverage: full
    note: ใช้จ่ายไม่เกินตัว ประโยชน์ของการออม (เงินสำรองยามฉุกเฉิน ไม่ต้องยืม ได้ของที่ต้องการ) เชื่อมกับความพอประมาณและภูมิคุ้มกันในปรัชญาของเศรษฐกิจพอเพียง
  - topic: business.econ.production-factors
    indicators: [ส 3.1 ป.5/1, ส 3.1 ม.2/2, ส 3.1 ป.6/1, ส 3.1 ป.6/3]
    coverage: full
    note: ปัจจัยการผลิตสี่อย่างและผลตอบแทน (ค่าเช่า ค่าจ้าง ดอกเบี้ย กำไร) ปัจจัยที่มีอิทธิพลต่อการผลิต (ราคาสินค้า ราคาปัจจัย เทคโนโลยี ความต้องการของผู้บริโภค ดินฟ้าอากาศ นโยบายรัฐ) และผลผลิตต่อแรงงาน
  - topic: business.econ.scarcity-choice
    indicators: [ส 3.1 ป.1/1, ส 3.1 ป.2/1, ส 3.1 ป.3/1, ส 3.1 ป.1/3, ส 3.1 ป.3/3, ส 3.1 ม.1/1]
    coverage: full
    note: สินค้ากับบริการ ทรัพยากรสามกลุ่มที่ใช้ผลิตสินค้าและบริการในชีวิตประจำวัน (ตัวอย่างร้านก๋วยเตี๋ยวและร้านข้าวมันไก่) และการจำแนกความจำเป็น (ปัจจัย 4) กับความต้องการ
  - topic: business.econ.consumer-rights
    indicators: [ส 3.1 ป.4/1, ส 3.1 ป.4/2, ส 3.1 ม.2/4, ส 3.1 ป.6/2, ส 3.1 ม.1/2]
    coverage: full
    note: ปัจจัยที่มีผลต่อการเลือกซื้อเจ็ดกลุ่ม (ราคา รายได้ ความจำเป็น คุณภาพ ค่านิยม โฆษณา ฤดูกาล) และโจทย์จับคู่เหตุการณ์ (p001)
  - topic: business.econ.money-banking
    indicators: [ส 3.2 ป.2/1, ส 3.2 ป.4/2, ส 3.2 ป.5/1, ส 3.2 ป.5/2, ส 3.2 ม.1/1]
    coverage: full
    note: แลกสิ่งของโดยตรง ใช้เงินสด ชำระเงินทางอิเล็กทรอนิกส์ (พร้อมเพย์ คิวอาร์) และซื้อเชื่อ ปัญหาของการแลกของ และพัฒนาการของเงิน (p001 p004 p015)
  - topic: business.econ.sufficiency-economy
    indicators: [ส 3.1 ป.4/3, ส 3.1 ม.1/3, ส 3.1 ม.2/3, ส 3.1 ม.4-6/4]
    coverage: full
    note: ความเป็นมา (พระราชดำรัส พ.ศ. 2517 วิกฤต พ.ศ. 2540 การประมวลนิยามและการใช้ในแผนพัฒนาฯ ตั้งแต่ฉบับที่ 9) หลักสามห่วงสองเงื่อนไข ผลลัพธ์สมดุล มั่นคง ยั่งยืน และการใช้ในชีวิตประจำวันของตนเอง (p001 p002 p006)
  - topic: business.econ.sufficiency-economy
    indicators: [ส 3.1 ป.5/2, ส 3.1 ม.3/2, ส 3.1 ม.4-6/2]
    coverage: partial
    note: ยกตัวอย่างการประยุกต์ในครอบครัว โรงเรียน และชุมชน (บัญชีครัวเรือน ผักสวนครัว ธนาคารขยะ กลุ่มออมทรัพย์) และมีโจทย์ แต่การทำกิจกรรมจริงอยู่นอกแอป
