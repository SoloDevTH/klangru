problems:
  - id: phy.vec.p001
    topics: [physics.units.vectors]
    difficulty: 1
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นปริมาณเวกเตอร์ (เลือกได้มากกว่า 1 ข้อ)"
    choices:
      - { id: a, text: "การกระจัด", correct: true }
      - { id: b, text: "ความเร็ว", correct: true }
      - { id: c, text: "ความเร่ง", correct: true }
      - { id: d, text: "อัตราเร็ว", feedback: "อัตราเร็วบอกแค่ว่าเร็วเท่าใด ไม่บอกทิศ จึงเป็นสเกลาร์ ส่วนความเร็วซึ่งบอกทิศด้วยเป็นเวกเตอร์" }
      - { id: e, text: "ระยะทาง", feedback: "ระยะทางคือความยาวเส้นทางที่เคลื่อนที่ไป ไม่สนทิศ จึงเป็นสเกลาร์ ส่วนการกระจัดเป็นเวกเตอร์" }
      - { id: f, text: "เวลา", feedback: "เวลามีแต่ขนาด ไม่มีทิศทาง จึงเป็นสเกลาร์" }
    hints:
      - "ถามตัวเองว่า ปริมาณนั้นต้องบอกทิศทางด้วยหรือไม่จึงจะครบความหมาย"
      - "ปริมาณที่คู่กันอย่าง ระยะทาง–การกระจัด และ อัตราเร็ว–ความเร็ว ตัวหนึ่งเป็นสเกลาร์ อีกตัวเป็นเวกเตอร์"
    solution: "การกระจัด ความเร็ว และความเร่ง ต้องบอกทั้งขนาดและทิศทางจึงเป็นเวกเตอร์ ส่วนอัตราเร็ว ระยะทาง และเวลา มีแต่ขนาดจึงเป็นสเกลาร์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.vec.p002
    topics: [physics.units.vectors]
    difficulty: 1
    type: numeric
    stem: "แมวเดินไปทางทิศตะวันออก $300\\ \\mathrm{m}$ แล้วเดินย้อนไปทางทิศตะวันตก $200\\ \\mathrm{m}$ การกระจัดลัพธ์มีขนาดกี่เมตร (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 100, unit: m }
    hints:
      - "สองเวกเตอร์นี้มีทิศตรงข้ามกัน"
      - "ให้ทิศตะวันออกเป็นบวก ทิศตะวันตกจะเป็นลบ แล้วรวมกันโดยคิดเครื่องหมาย"
    misconceptions:
      - { match: 500, feedback: "นั่นคือระยะทางที่เดินทั้งหมด การกระจัดต้องคิดทิศด้วย สองช่วงนี้มีทิศตรงข้ามกันจึงหักล้างกันบางส่วน" }
    solution: "ให้ทิศตะวันออกเป็นบวก: $(+300\\ \\mathrm{m}) + (-200\\ \\mathrm{m}) = +100\\ \\mathrm{m}$ การกระจัดลัพธ์มีขนาด $100\\ \\mathrm{m}$ ทิศตะวันออก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.vec.p003
    topics: [physics.units.vectors]
    difficulty: 2
    type: numeric
    stem: "นิดปั่นจักรยานจากบ้านไปทางทิศเหนือ $3\\ \\mathrm{km}$ แล้วเลี้ยวไปทางทิศตะวันออกอีก $4\\ \\mathrm{km}$ จนถึงตลาดนัด ตลาดนัดอยู่ห่างจากบ้านเป็นเส้นตรงกี่กิโลเมตร (ตอบเป็นตัวเลขในหน่วย km)"
    answer: { value: 5, unit: km }
    hints:
      - "ทิศเหนือกับทิศตะวันออกตั้งฉากกัน ลองวาดลูกศรแบบหางต่อหัว"
      - "ลูกศรทั้งสองกับเวกเตอร์ลัพธ์เป็นสามเหลี่ยมมุมฉาก ใช้ทฤษฎีบทพีทาโกรัสหาด้านตรงข้ามมุมฉาก"
    misconceptions:
      - { match: 7, feedback: "นั่นคือระยะทางที่ปั่นทั้งหมด สองเวกเตอร์ตั้งฉากกัน จึงบวกขนาดตรง ๆ ไม่ได้ ต้องใช้ทฤษฎีบทพีทาโกรัส" }
      - { match: 1, feedback: "การลบขนาดใช้ได้เฉพาะเวกเตอร์ที่ชี้ทิศตรงข้ามกัน ทิศเหนือกับทิศตะวันออกตั้งฉากกัน" }
    solution: "$R = \\sqrt{(3\\ \\mathrm{km})^2 + (4\\ \\mathrm{km})^2} = \\sqrt{25}\\ \\mathrm{km} = 5\\ \\mathrm{km}$ (ทิศตะวันออกเฉียงเหนือ ทำมุม $\\tan^{-1}\\tfrac{3}{4} \\approx 36.9^\\circ$ ไปทางเหนือของทิศตะวันออก)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.vec.p004
    topics: [physics.units.vectors]
    difficulty: 2
    type: match
    stem: "เวกเตอร์ $\\vec{A}$ มีขนาด $A$ ทำมุม $\\theta$ กับแกน $+x$ จับคู่ปริมาณทางซ้ายกับสูตรทางขวา"
    pairs:
      - { left: "องค์ประกอบ $x$ ($A_x$)", right: "$A\\cos\\theta$" }
      - { left: "องค์ประกอบ $y$ ($A_y$)", right: "$A\\sin\\theta$" }
      - { left: "ขนาด $A$", right: "$\\sqrt{A_x^2 + A_y^2}$" }
      - { left: "$\\tan\\theta$", right: "$\\dfrac{A_y}{A_x}$" }
    hints:
      - "วาดสามเหลี่ยมมุมฉากที่มี $\\vec{A}$ เป็นด้านตรงข้ามมุมฉาก องค์ประกอบ $x$ อยู่ติดกับมุม $\\theta$"
      - "ด้านประชิดมุมสัมพันธ์กับ cos ด้านตรงข้ามมุมสัมพันธ์กับ sin และความยาวด้านตรงข้ามมุมฉากหาได้จากพีทาโกรัส"
    solution: "องค์ประกอบ $x$ เป็นด้านประชิดมุม $\\theta$ จึงได้ $A_x = A\\cos\\theta$ องค์ประกอบ $y$ เป็นด้านตรงข้ามมุม จึงได้ $A_y = A\\sin\\theta$ ขนาดคือ $A = \\sqrt{A_x^2 + A_y^2}$ และ $\\tan\\theta = \\dfrac{A_y}{A_x}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.vec.p005
    topics: [physics.units.vectors]
    difficulty: 3
    type: numeric
    stem: "นักกีฬาเตะลูกฟุตบอลด้วยความเร็ว $20\\ \\mathrm{m/s}$ ทำมุม $30^\\circ$ กับพื้นราบ องค์ประกอบของความเร็วในแนวราบมีขนาดเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 17.32, tolerance: 0.1, unit: m/s }
    hints:
      - "วาดลูกศรความเร็วเอียงขึ้น $30^\\circ$ จากพื้น แล้วแยกเป็นส่วนแนวราบกับแนวดิ่ง"
      - "ส่วนแนวราบอยู่ติดกับมุมที่วัดจากพื้น จึงใช้ $v_x = v\\cos\\theta$"
    misconceptions:
      - { match: 10, feedback: "นั่นคือ $v\\sin 30^\\circ$ ซึ่งเป็นองค์ประกอบแนวดิ่ง มุมวัดจากพื้น องค์ประกอบแนวราบซึ่งอยู่ติดกับมุมต้องใช้ cos" }
    solution: "$v_x = v\\cos\\theta = (20\\ \\mathrm{m/s})\\cos 30^\\circ = 20 \\times 0.866\\ \\mathrm{m/s} \\approx 17.3\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.vec.p006
    topics: [physics.units.vectors]
    difficulty: 3
    type: numeric
    stem: "เวกเตอร์การกระจัดมีองค์ประกอบ $x = 3\\ \\mathrm{m}$ (ทิศตะวันออก) และองค์ประกอบ $y = 4\\ \\mathrm{m}$ (ทิศเหนือ) เวกเตอร์นี้ทำมุมกี่องศากับทิศตะวันออก (ตอบเป็นตัวเลขในหน่วยองศา ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 53.13, tolerance: 0.5, unit: "°" }
    hints:
      - "มุมที่วัดจากแกน $x$ หาได้จาก $\\tan\\theta = \\dfrac{A_y}{A_x}$"
      - "ระวังว่าตัวไหนเป็นตัวเศษ ตัวเศษคือองค์ประกอบที่อยู่ตรงข้ามมุม แล้วใช้ $\\tan^{-1}$"
    misconceptions:
      - { match: 36.87, feedback: "ดูเหมือนคำนวณ $\\tan^{-1}\\tfrac{3}{4}$ ซึ่งเป็นมุมที่วัดจากทิศเหนือ มุมจากทิศตะวันออกต้องใช้ $\\tan\\theta = \\dfrac{A_y}{A_x} = \\dfrac{4}{3}$" }
    solution: "$\\tan\\theta = \\dfrac{4\\ \\mathrm{m}}{3\\ \\mathrm{m}} \\approx 1.333$ ได้ $\\theta = \\tan^{-1}(1.333) \\approx 53.1^\\circ$ ไปทางเหนือของทิศตะวันออก (ขนาดคือ $\\sqrt{3^2 + 4^2} = 5\\ \\mathrm{m}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.vec.p007
    topics: [physics.units.vectors]
    difficulty: 3
    type: expression
    stem: "เวกเตอร์ $\\vec{A}$ มีขนาด $A$ ทำมุม $60^\\circ$ กับแกน $+x$ เขียนองค์ประกอบ $x$ ของ $\\vec{A}$ ในรูปของ $A$ (ใช้ค่าตรีโกณมิติของมุม $60^\\circ$ แบบค่าแม่นตรง)"
    prefix: "A_x ="
    answer: { latex: "\\frac{A}{2}", variables: [A] }
    hints:
      - "องค์ประกอบ $x$ คือ $A\\cos\\theta$"
      - "จำค่า $\\cos 60^\\circ$ จากสามเหลี่ยมมุมฉาก $30^\\circ$–$60^\\circ$–$90^\\circ$ แล้วคูณกับ $A$"
    misconceptions:
      - { match: "\\frac{\\sqrt{3}}{2}A", feedback: "นั่นคือ $A\\sin 60^\\circ$ ซึ่งเป็นองค์ประกอบ $y$ องค์ประกอบ $x$ อยู่ติดมุม ต้องใช้ cos" }
      - { match: "A", feedback: "องค์ประกอบสั้นกว่าเวกเตอร์เสมอเมื่อเวกเตอร์เอียง ต้องคูณ $A$ ด้วย $\\cos 60^\\circ$" }
    solution: "$A_x = A\\cos 60^\\circ = A \\times \\tfrac{1}{2} = \\dfrac{A}{2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.vec.p008
    topics: [physics.units.vectors]
    difficulty: 4
    type: numeric
    stem: "เรือข้ามฟากแล่นข้ามแม่น้ำเจ้าพระยาซึ่งกว้าง $400\\ \\mathrm{m}$ โดยหันหัวเรือตั้งฉากกับฝั่งตลอดเวลา เรือมีความเร็วเทียบกับน้ำ $4\\ \\mathrm{m/s}$ และกระแสน้ำไหลขนานฝั่งด้วยความเร็ว $3\\ \\mathrm{m/s}$ เรือใช้เวลากี่วินาทีจึงถึงฝั่งตรงข้าม (ตอบเป็นตัวเลขในหน่วย s)"
    answer: { value: 100, unit: s }
    hints:
      - "แยกการเคลื่อนที่เป็นสองแนว คือแนวตั้งฉากกับฝั่ง (ข้ามแม่น้ำ) และแนวขนานฝั่ง (ตามกระแสน้ำ)"
      - "กระแสน้ำพาเรือไปตามแนวฝั่ง ไม่ได้ช่วยให้ข้ามเร็วขึ้น เวลาข้ามขึ้นกับความกว้างแม่น้ำและองค์ประกอบความเร็วที่ตั้งฉากกับฝั่งเท่านั้น"
    misconceptions:
      - { match: 80, feedback: "ดูเหมือนใช้ความเร็วลัพธ์ $5\\ \\mathrm{m/s}$ หารความกว้าง แต่ความเร็วลัพธ์มีทิศเฉียง ทางที่เรือไปจริงจึงยาวกว่า $400\\ \\mathrm{m}$ ต้องใช้องค์ประกอบที่ตั้งฉากกับฝั่ง" }
      - { match: 57.14, feedback: "ดูเหมือนนำความเร็วเรือกับกระแสน้ำมาบวกกันเป็น $7\\ \\mathrm{m/s}$ สองความเร็วนี้ตั้งฉากกัน บวกตรง ๆ ไม่ได้ และกระแสน้ำไม่ได้ช่วยให้ข้ามเร็วขึ้น" }
    solution: "องค์ประกอบความเร็วที่ตั้งฉากกับฝั่งคือ $4\\ \\mathrm{m/s}$ เวลาข้าม $t = \\dfrac{400\\ \\mathrm{m}}{4\\ \\mathrm{m/s}} = 100\\ \\mathrm{s}$ (ระหว่างนั้นกระแสน้ำพาเรือไปตามฝั่ง $3 \\times 100 = 300\\ \\mathrm{m}$ และความเร็วลัพธ์มีขนาด $\\sqrt{4^2 + 3^2} = 5\\ \\mathrm{m/s}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.vec.p009
    topics: [physics.units.vectors]
    difficulty: 4
    type: numeric
    stem: "$\\vec{A}$ มีขนาด $10\\ \\mathrm{m}$ ชี้ไปตามแกน $+x$ ($0^\\circ$) และ $\\vec{B}$ มีขนาด $10\\ \\mathrm{m}$ ทำมุม $60^\\circ$ กับแกน $+x$ เวกเตอร์ลัพธ์ $\\vec{A} + \\vec{B}$ มีขนาดเท่าใด (ตอบเป็นตัวเลขในหน่วย m ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 17.32, tolerance: 0.15, unit: m }
    hints:
      - "แยก $\\vec{B}$ เป็นองค์ประกอบ $x$ และ $y$ ก่อน ส่วน $\\vec{A}$ มีแต่องค์ประกอบ $x$"
      - "บวกองค์ประกอบ $x$ ด้วยกันและ $y$ ด้วยกัน แล้วหาขนาดด้วย $R = \\sqrt{R_x^2 + R_y^2}$"
    misconceptions:
      - { match: 20, feedback: "บวกขนาดตรง ๆ ได้เฉพาะเวกเตอร์ที่ชี้ทิศเดียวกัน สองเวกเตอร์นี้ทำมุม $60^\\circ$ กัน ต้องรวมด้วยองค์ประกอบ" }
      - { match: 14.14, feedback: "ดูเหมือนใช้ $\\sqrt{A^2 + B^2}$ ซึ่งใช้ได้เฉพาะเมื่อสองเวกเตอร์ตั้งฉากกัน ต้องแยกเป็นองค์ประกอบก่อน" }
    solution: "$B_x = 10\\cos 60^\\circ = 5\\ \\mathrm{m}$, $B_y = 10\\sin 60^\\circ \\approx 8.66\\ \\mathrm{m}$ จึงได้ $R_x = 10 + 5 = 15\\ \\mathrm{m}$, $R_y = 8.66\\ \\mathrm{m}$ และ $R = \\sqrt{15^2 + 8.66^2}\\ \\mathrm{m} = \\sqrt{300}\\ \\mathrm{m} \\approx 17.3\\ \\mathrm{m}$ (ทำมุม $30^\\circ$ กับแกน $+x$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.vec.p010
    topics: [physics.units.vectors]
    difficulty: 4
    type: mcq
    stem: "เวกเตอร์ความเร็วมีองค์ประกอบ $v_x = -3\\ \\mathrm{m/s}$ และ $v_y = +4\\ \\mathrm{m/s}$ เวกเตอร์นี้ทำมุมเท่าใดกับแกน $+x$ (วัดทวนเข็มนาฬิกา)"
    choices:
      - { id: a, text: "$126.9^\\circ$", correct: true }
      - { id: b, text: "$-53.1^\\circ$", feedback: "นี่คือค่าที่เครื่องคิดเลขให้จาก $\\tan^{-1}\\tfrac{4}{-3}$ แต่มุมนี้ชี้ไปทางขวาล่าง ขณะที่เวกเตอร์จริงชี้ไปทางซ้ายบน ($v_x < 0$, $v_y > 0$) ต้องบวก $180^\\circ$" }
      - { id: c, text: "$53.1^\\circ$", feedback: "ตัดเครื่องหมายลบของ $v_x$ ทิ้งไป มุมนี้ชี้ไปทางขวาบน แต่ $v_x$ เป็นลบ เวกเตอร์จึงชี้ไปทางซ้าย" }
      - { id: d, text: "$36.9^\\circ$", feedback: "นี่คือ $\\tan^{-1}\\tfrac{3}{4}$ ซึ่งสลับตัวเศษกับตัวส่วน และยังไม่ได้คิดว่าเวกเตอร์ชี้ไปทางซ้าย" }
    hints:
      - "วาดเวกเตอร์ก่อน $v_x$ เป็นลบและ $v_y$ เป็นบวก เวกเตอร์ชี้ไปจตุภาคใด"
      - "$\\tan^{-1}$ บนเครื่องคิดเลขให้มุมระหว่าง $-90^\\circ$ ถึง $90^\\circ$ เท่านั้น ถ้า $v_x$ เป็นลบต้องปรับมุมโดยบวก $180^\\circ$"
    solution: "เวกเตอร์ชี้ไปทางซ้ายบน (จตุภาคที่ 2) เครื่องคิดเลขให้ $\\tan^{-1}\\tfrac{4}{-3} \\approx -53.1^\\circ$ ต้องบวก $180^\\circ$ ได้ $126.9^\\circ$ ตรวจ: $5\\cos 126.9^\\circ \\approx -3$ และ $5\\sin 126.9^\\circ \\approx 4$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.vec.p011
    topics: [physics.units.vectors]
    difficulty: 5
    type: numeric
    stem: "โดรนส่งของในเชียงใหม่บินไปทางทิศตะวันออก $100\\ \\mathrm{m}$ จากนั้นบินต่ออีก $60\\ \\mathrm{m}$ ในทิศที่ทำมุม $45^\\circ$ ไปทางเหนือของทิศตะวันตก โดรนอยู่ห่างจากจุดเริ่มต้นเป็นเส้นตรงกี่เมตร (ตอบเป็นตัวเลขในหน่วย m ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 71.52, tolerance: 0.7, unit: m }
    hints:
