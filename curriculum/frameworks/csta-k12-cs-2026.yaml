# 2026 CSTA PK–12 Computer Science Standards (Computer Science Teachers Association)
#
# สถานะ: ฉบับสมบูรณ์ที่เผยแพร่แล้ว (ไม่ใช่ร่าง) PDF ทางการ 218 หน้า สร้างเมื่อ 6 ก.ค. 2026 แก้ไขล่าสุด 17 ก.ค. 2026
#   อ้างอิงตามที่ CSTA แนะนำ: Computer Science Teachers Association. (2026). 2026 CSTA PK–12 computer science standards.
#   https://csteachers.org/pk12standards/ DOI 10.1145/3820482 ISBN 979-8-4007-2780-1
#   ฉบับ 2017 ยังเก็บแยกใน csta-k12-cs.yaml เพราะรหัสและระดับต่างกันทั้งหมด จับคู่ข้ามฉบับไม่ได้ตรง ๆ
#
# ที่มาและการคัดลอก (ตรวจเมื่อ 2026-11-03)
# - ข้อความมาตรฐานทั้ง 331 ข้อ (Foundational 196 ข้อ, High School Specialty 135 ข้อ) ตรวจกับชั้นข้อความของ PDF ทางการ
#   (pdftotext -raw) ว่ารหัสตามด้วยข้อความตรงกันทุกตัวอักษร (ไม่นับช่องว่าง) ไม่ได้ OCR
#   รายการรหัส ระดับ แนวคิดย่อย และข้อความอ่านจากข้อมูลของหน้า View Standards บน csteachers.org
#   แล้วเทียบกับ PDF ได้ครบ 331 ข้อ ต่างกันเพียงเครื่องหมายอัญประกาศเดี่ยว ซึ่งใช้ (’) ตาม PDF
# - ไม่ได้เก็บ boundary statement, implementation example, interdisciplinary connection และ progression
#   (อ่านได้ใน PDF และหน้า View Standards)
#
# โครงสร้าง
# - strand = concept ของ Foundational Standards (ALG PRO DAT SYS SOC) และ specialty area ของ High School Specialty Standards
#   (AIN CYB DSC GMD PHY SWD และ XCS) standard = subconcept (รหัสย่อตามตารางในต้นฉบับ เช่น ALG-PS, CYB-TS)
#   indicator = มาตรฐานแต่ละข้อ
# - รหัสตามต้นฉบับ: Foundational เป็น <ระดับ>-<concept>-<subconcept>-<เลข> เช่น E3-PRO-VD-06, MS-SYS-SE-32
#   ระดับ EK = PK/Kindergarten (อายุ 4–6), E1–E5 = ป.1–ป.5 รายชั้น, MS = เกรด 6–8, HS = เกรด 9–12
#   เลขข้อนับต่อเนื่องข้ามทุก concept ภายในชั้นหรือช่วงชั้นเดียวกัน (จึงไม่เรียงติดกันภายในแต่ละ subconcept)
#   Specialty เป็น <S1|S2>-<area>-<subconcept>-<เลข> เช่น S1-AIN-DD-01 เลขเริ่ม 01 ใหม่ในแต่ละ area และระดับ
# - level: PK/K, Grade 1–Grade 5, MS, HS, Specialty I, Specialty II
#   Foundational สำหรับผู้เรียนทุกคน Specialty I/II สำหรับนักเรียนมัธยมปลายที่เลือกเรียนลึกในสาขานั้น
#   (Specialty II ต่อจาก Specialty I) X+CS คือการบูรณาการเนื้อหา HS กับวิชาอื่น
# - note เก็บรหัส practice ตามบรรทัด "Practice(s):" ของต้นฉบับ ซึ่งมี 12 ข้อในสี่กลุ่ม
#   ESR1–ESR2 = Ethics & Social Responsibility, IC3–IC5 = Inclusive Collaboration, CT6–CT9 = Computational Thinking,
#   HCD10–HCD12 = Human-Centered Design
#   "AI-related" ตามช่อง AI-related ของหน้า View Standards (มาตรฐานที่มีเนื้อหาเรื่อง AI โดยตรง 107 ข้อ)
#
# การจับคู่ใน curriculum/mappings/csta-k12-cs-2026.yaml เป็นการเทียบภายในของคลังรู้ ไม่ใช่การรับรอง (Seal of Alignment) จาก CSTA
