  - id: earthscience.atmosphere.weather-forecasting.p016
    topics: [earthscience.atmosphere.weather-forecasting]
    difficulty: 5
    type: numeric
    stem: "พายุลูกหนึ่งมีศูนย์กลางห่างชายฝั่ง 450 กิโลเมตร เคลื่อนเข้าหาฝั่งตรง ๆ ด้วยอัตราเร็ว 20 กิโลเมตรต่อชั่วโมง ลมแรงแผ่ออกจากศูนย์กลาง 150 กิโลเมตร (ข้อมูลสมมติ) ลมแรงจะเริ่มถึงชายฝั่งในอีกกี่ชั่วโมง"
    answer: { value: 15, tolerance: 0.1, unit: ชั่วโมง }
    misconceptions:
      - { match: 22.5, feedback: "22.5 ชั่วโมงคือเวลาที่ศูนย์กลางขึ้นฝั่ง แต่ลมแรงที่แผ่ออก 150 กิโลเมตรมาถึงก่อน" }
      - { match: 30, feedback: "บวก 150 กิโลเมตรเข้าไป แต่ขอบลมแรงอยู่ข้างหน้าศูนย์กลาง ต้องลบออก" }
    hints:
      - "ลมแรงถึงฝั่งเมื่อศูนย์กลางยังห่างฝั่ง 150 กิโลเมตร"
      - "เวลา = ระยะทางที่ต้องเคลื่อน ÷ อัตราเร็ว"
    solution: "ระยะที่ศูนย์กลางต้องเคลื่อนจนขอบลมแรงถึงฝั่ง $= 450 - 150 = 300$ กิโลเมตร เวลา $= 300 \\div 20 = 15$ ชั่วโมง ต้องเตรียมการให้เสร็จก่อนเวลานี้"
    license: CC-BY-SA-4.0
    ai_assisted: true
