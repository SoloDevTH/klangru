id: chinese.grammar.complex-connectives
subject: chinese
title:
  th: คำเชื่อมประโยคซับซ้อนระดับ HSK 4
  en: Complex connectives at HSK level 4
summary: คู่คำเชื่อมที่บอกการเพิ่ม การยอมรับ เงื่อนไขที่พอและที่จำเป็น ความไม่มีเงื่อนไข เหตุที่รู้แล้ว และการยกเว้น เช่น 不仅…而且 即使…也 只要…就 只有…才 พร้อมตำแหน่งประธาน
difficulty: 5
