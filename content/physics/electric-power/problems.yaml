    answer: { value: 121.5, tolerance: 0.5, unit: บาท }
    hints:
      - "พลังงาน 30 วัน = พลังงานต่อวัน × 30"
      - "ค่าไฟ = จำนวนหน่วย × อัตราต่อหน่วย"
    misconceptions:
      - { match: 4.05, feedback: "นั่นคือค่าไฟของวันเดียว ต้องคูณ 30 วัน" }
      - { match: 27, feedback: "นั่นคือจำนวนหน่วยใน 30 วัน ยังต้องคูณอัตรา 4.5 บาทต่อหน่วย" }
    solution: "$0.9 \\times 30 = 27$ หน่วย ค่าไฟ $= 27 \\times 4.5 = 121.5$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.epow.p017
    topics: [physics.electricity.electric-power]
    difficulty: 3
    type: numeric
    stem: "กาต้มน้ำไฟฟ้ากำลัง $2000\\ \\mathrm{W}$ ต้มน้ำนาน $3$ นาที น้ำได้รับพลังงานความร้อน $302\\,400\\ \\mathrm{J}$ ประสิทธิภาพของกาต้มน้ำเป็นกี่เปอร์เซ็นต์ (ตอบเป็นตัวเลขในหน่วย %)"
    answer: { value: 84, tolerance: 0.5, unit: "%" }
    hints:
      - "หาพลังงานไฟฟ้าที่ใส่เข้าไป $E = Pt$ โดยใช้เวลาเป็นวินาที"
      - "ประสิทธิภาพ = พลังงานที่น้ำได้รับ ÷ พลังงานไฟฟ้าที่ใส่ × 100%"
    misconceptions:
      - { match: 0.84, feedback: "นั่นคือประสิทธิภาพในรูปทศนิยม ต้องคูณ 100 จึงเป็นเปอร์เซ็นต์" }
      - { match: 151.2, feedback: "ดูเหมือนนำพลังงานที่น้ำได้หารด้วยกำลังเฉย ๆ ได้หน่วยเป็นวินาที ต้องหาพลังงานที่ใส่เข้าไปก่อน" }
    solution: "พลังงานไฟฟ้า $= (2000)(180) = 360\\,000\\ \\mathrm{J}$ ประสิทธิภาพ $= \\dfrac{302\\,400}{360\\,000} \\times 100\\% = 84\\%$ อีก $16\\%$ กลายเป็นความร้อนที่ตัวกาและอากาศรอบ ๆ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.epow.p018
    topics: [physics.electricity.electric-power]
    difficulty: 4
    type: numeric
    stem: "โรงไฟฟ้าส่งกำลัง $1\\ \\mathrm{MW}$ ด้วยความต่างศักย์ $22\\ \\mathrm{kV}$ ผ่านสายส่งที่มีความต้านทานรวม $5\\ \\Omega$ กำลังที่สูญเสียเป็นความร้อนในสายส่งเป็นกี่วัตต์ (ตอบเป็นตัวเลขในหน่วย W)"
    answer: { value: 10331, tolerance: 60, unit: W }
    hints:
      - "หากระแสในสายส่งจาก $I = \\dfrac{P}{V}$"
      - "กำลังที่สูญเสียในสายคือ $I^2R$ ของสาย"
    misconceptions:
      - { match: 96800000, feedback: "ดูเหมือนใช้ $\\dfrac{V^2}{R}$ กับ $22\\ \\mathrm{kV}$ ทั้งหมด ซึ่งมากกว่ากำลังที่ส่งเสียอีก ความต่างศักย์ $22\\ \\mathrm{kV}$ ไม่ได้ตกคร่อมสายส่ง ต้องใช้ $I^2R$" }
      - { match: 227.3, feedback: "นั่นคือ $IR$ ซึ่งเป็นความต่างศักย์ที่ตกคร่อมสายส่ง (หน่วยโวลต์) กำลังที่สูญเสียต้องคูณกระแสอีกครั้ง" }
    solution: "$I = \\dfrac{10^6}{22\\,000} \\approx 45.45\\ \\mathrm{A}$ กำลังสูญเสีย $= I^2R = (45.45)^2(5) \\approx 10\\,330\\ \\mathrm{W}$ ประมาณ $1\\%$ ของกำลังที่ส่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.epow.p019
