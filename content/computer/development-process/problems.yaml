    ai_assisted: true

  - id: computer.programming.development-process.p013
    topics: [computer.programming.development-process]
    difficulty: 4
    type: mcq
    stem: "ผู้ใช้แอปสั่งข้าวมีทั้งนักเรียนที่ใช้โทรศัพท์หลายยี่ห้อ ครูที่ใช้คอมพิวเตอร์ และแม่ค้าที่ใช้แท็บเล็ต ทีมมีนักพัฒนา 3 คนและเวลา 1 เทอม ควรเลือกแพลตฟอร์มแบบใด"
    choices:
      - { id: a, text: "เว็บแอปที่ปรับหน้าจอตามขนาดอุปกรณ์ เพราะเขียนครั้งเดียวใช้ได้ทุกเครื่องที่มีเบราว์เซอร์", correct: true }
      - { id: b, text: "แอปเฉพาะระบบแยกทุกระบบปฏิบัติการ", feedback: "ต้องพัฒนาและทดสอบหลายชุด เกินกำลังทีม 3 คนในหนึ่งเทอม และงานนี้ไม่ต้องใช้ความสามารถพิเศษของเครื่อง" }
      - { id: c, text: "แอปเฉพาะระบบของโทรศัพท์ยี่ห้อที่ทีมใช้เท่านั้น", feedback: "ผู้ใช้ส่วนอื่นจะใช้ไม่ได้ ไม่ตรงกับกลุ่มผู้ใช้ที่หลากหลาย" }
      - { id: d, text: "โปรแกรมบนคอมพิวเตอร์ของห้องธุรการเครื่องเดียว", feedback: "นักเรียนและแม่ค้าต้องเดินไปใช้ที่ห้องธุรการ ไม่สะดวก" }
    hints:
      - "ผู้ใช้มีอุปกรณ์หลากหลาย และทีมมีเวลาจำกัด"
      - "แบบใดเขียนครั้งเดียวแล้วใช้ได้ทุกเครื่อง"
    solution: "เว็บแอปที่ปรับตามจอเข้าถึงผู้ใช้ทุกกลุ่มด้วยโค้ดชุดเดียว เหมาะกับทีมเล็ก ข้อแลกเปลี่ยนคือใช้ความสามารถเฉพาะเครื่องและทำงานออฟไลน์ได้น้อยกว่าแอปเฉพาะระบบ ซึ่งงานสั่งข้าวไม่จำเป็น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.development-process.p014
    topics: [computer.programming.development-process]
    difficulty: 5
    type: numeric
    stem: "รอบทดสอบที่ 1 ผู้ใช้ 10 คน สั่งข้าวสำเร็จ 6 คน หลังปรับปรุง รอบที่ 2 ผู้ใช้ 12 คน สั่งสำเร็จ 9 คน อัตราความสำเร็จเพิ่มขึ้นกี่ **จุดเปอร์เซ็นต์**"
    answer: { value: 15, unit: "จุดเปอร์เซ็นต์" }
    hints:
      - "หาอัตราความสำเร็จของแต่ละรอบเป็นเปอร์เซ็นต์ก่อน เพราะจำนวนผู้ทดสอบไม่เท่ากัน"
      - "จุดเปอร์เซ็นต์คือผลต่างของสองเปอร์เซ็นต์"
    misconceptions:
      - { match: 3, feedback: "เทียบจำนวนคน 9 − 6 ไม่ได้ เพราะจำนวนผู้ทดสอบในสองรอบไม่เท่ากัน" }
      - { match: 25, feedback: "25% คือการเพิ่มขึ้นเชิงสัมพัทธ์ (15 ÷ 60) โจทย์ถามผลต่างเป็นจุดเปอร์เซ็นต์" }
    solution: "รอบที่ 1: 6 ÷ 10 = 60% รอบที่ 2: 9 ÷ 12 = 75% เพิ่มขึ้น 75 − 60 = 15 จุดเปอร์เซ็นต์ (คิดเชิงสัมพัทธ์ได้ 25%) ผู้ทดสอบมีไม่มาก ควรทดสอบเพิ่มก่อนสรุปแน่นอน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.development-process.p015
    topics: [computer.programming.development-process]
    difficulty: 5
    type: mcq
    stem: "โครงการใดเหมาะกับ **แบบน้ำตก** มากกว่าแบบวนรอบ"
    choices:
      - { id: a, text: "โปรแกรมคำนวณค่าปรับตามอัตราที่กฎระเบียบกำหนดไว้ชัดเจนและไม่เปลี่ยน", correct: true }
      - { id: b, text: "แอปใหม่สำหรับชมรมที่ยังไม่แน่ใจว่าสมาชิกอยากได้อะไร", feedback: "ความต้องการยังไม่ชัด ต้องลองและฟังผู้ใช้เป็นรอบ ๆ จึงเหมาะกับแบบวนรอบ" }
      - { id: c, text: "เกมที่ต้องลองว่าผู้เล่นสนุกกับด่านแบบไหน", feedback: "ความสนุกต้องทดสอบกับผู้เล่นจริงหลายรอบ เหมาะกับแบบวนรอบ" }
      - { id: d, text: "เว็บโรงอาหารที่แม่ค้าขอเพิ่มเมนูและความสามารถใหม่ทุกเดือน", feedback: "ความต้องการเปลี่ยนบ่อย แบบวนรอบรับการเปลี่ยนได้ดีกว่า" }
    hints:
      - "แบบน้ำตกทำทีละขั้นจนจบ แก้ย้อนกลับยาก"
      - "โครงการใดรู้ความต้องการครบตั้งแต่ต้นและไม่เปลี่ยน"
    solution: "แบบน้ำตกเหมาะเมื่อความต้องการชัดและคงที่ เช่น สูตรคำนวณตามกฎระเบียบ ส่วนงานที่ยังไม่รู้ว่าผู้ใช้ต้องการอะไรหรือเปลี่ยนบ่อยเหมาะกับแบบวนรอบ ที่ได้ความเห็นเร็วและปรับทิศทางได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.development-process.p016
    topics: [computer.programming.development-process]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "ทีมพัฒนาแอปจองห้องสมุดสำหรับนักเรียนทั้งโรงเรียน 1,200 คน ข้อใดเป็นการออกแบบให้ผู้ใช้กลุ่มกว้างอย่างเป็นระบบ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ทดสอบกับนักเรียนหลายระดับชั้น รวมถึงผู้ที่ใช้โปรแกรมอ่านหน้าจอและผู้ที่ใช้โทรศัพท์รุ่นเก่า", correct: true, feedback: "ผู้ใช้หลากหลายช่วยหาปัญหาที่ทีมมองไม่เห็น" }
      - { id: b, text: "ใส่แบบฟอร์มส่งความเห็นในแอป แล้วนำความเห็นมาจัดลำดับทุกรอบ", correct: true, feedback: "ได้ความเห็นต่อเนื่องจากผู้ใช้จริงจำนวนมาก" }
      - { id: c, text: "ตั้งตัวชี้วัด เช่น เวลาที่ใช้จองและอัตราจองสำเร็จ แล้วเทียบแต่ละรอบ", correct: true, feedback: "ตัวเลขช่วยบอกว่าการปรับปรุงได้ผลจริงหรือไม่" }
      - { id: d, text: "ถามเฉพาะสมาชิกในทีมพัฒนา เพราะเข้าใจแอปดีที่สุด", feedback: "ทีมพัฒนาคุ้นกับแอปเกินไป ไม่ได้เป็นตัวแทนผู้ใช้ทั่วไป" }
      - { id: e, text: "ทำตามทุกความเห็นที่ได้รับทันที", feedback: "ความเห็นอาจขัดกันหรือคุ้มค่าไม่เท่ากัน ต้องจัดลำดับก่อน" }
    hints:
      - "ระบบ หมายถึงมีวิธีเก็บความเห็นและวัดผลที่ทำซ้ำได้"
      - "ผู้ใช้กลุ่มกว้างหมายถึงคนที่ต่างจากทีมพัฒนา"
    solution: "ข้อ a, b และ c ถูก การออกแบบให้ผู้ใช้กลุ่มกว้างต้องทดสอบกับผู้ใช้หลากหลาย มีช่องทางรับความเห็นต่อเนื่อง และวัดผลเทียบแต่ละรอบ ข้อ d ได้มุมมองแคบ ข้อ e ไม่ได้จัดลำดับ"
    license: CC-BY-SA-4.0
    ai_assisted: true
