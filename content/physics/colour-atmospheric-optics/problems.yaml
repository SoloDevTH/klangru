  - id: physics.light.colour-atmospheric-optics.p013
    topics: [physics.light.colour-atmospheric-optics]
    difficulty: 4
    type: numeric
    stem: "แสงที่ผ่านผลึกน้ำแข็งหกเหลี่ยมเข้าทางหน้าหนึ่งและออกอีกหน้าหนึ่งเหมือนผ่านปริซึมมุมยอด $A = 60^\\circ$ มุมเบี่ยงเบนน้อยที่สุดหาได้จาก $D = 2\\sin^{-1}\\!\\left(n\\sin\\tfrac{A}{2}\\right) - A$ ถ้าดรรชนีหักเหของน้ำแข็ง $n = 1.31$ มุม $D$ เป็นกี่องศา (ตอบในหน่วยองศา ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 21.8, tolerance: 0.2, unit: องศา }
    hints:
      - "$n\\sin 30^\\circ = 1.31 \\times 0.5 = 0.655$"
      - "หา $\\sin^{-1}(0.655)$ คูณ 2 แล้วลบ 60"
    misconceptions:
      - { match: 81.8, feedback: "ดูเหมือนลืมลบมุมยอด $A = 60^\\circ$ ออก" }
      - { match: 40.9, feedback: "นั่นคือ $\\sin^{-1}(0.655)$ อย่างเดียว ยังต้องคูณ 2 แล้วลบ 60" }
    solution: "$\\sin^{-1}(1.31 \\times 0.5) = \\sin^{-1}(0.655) \\approx 40.9^\\circ$ จึงได้ $D = 2(40.9^\\circ) - 60^\\circ \\approx 21.8^\\circ$ แสงจึงรวมกันมากที่มุมประมาณ 22 องศา เห็นเป็นวงทรงกลดรัศมี 22 องศารอบดวงอาทิตย์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.colour-atmospheric-optics.p014
