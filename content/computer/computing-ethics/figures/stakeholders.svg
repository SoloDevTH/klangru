<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440"><title>ระบบแนะนำเส้นทางอยู่ตรงกลาง รอบ ๆ มีผู้มีส่วนได้เสียห้ากลุ่ม</title><rect width="720" height="440" fill="#ffffff"/><circle cx="360" cy="220" r="160" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4,4"/><rect x="280" y="184" width="160" height="72" rx="12" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/><text x="360" y="214" font-family="sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">ระบบแนะนำเส้นทาง</text><text x="360" y="236" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal">ตัดสินเส้นทางจากข้อมูล</text><rect x="275.0" y="44.0" width="170" height="52" rx="10" fill="#dcfce7" stroke="#1f2937" stroke-width="1.2"/><text x="360.0" y="66.0" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">ผู้ขับขี่</text><text x="360.0" y="85.0" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal">ได้ประโยชน์โดยตรง</text><rect x="496.12064003862315" y="147.6474508437579" width="170" height="52" rx="10" fill="#fef3c7" stroke="#1f2937" stroke-width="1.2"/><text x="581.1206400386232" y="169.6474508437579" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">คนเดินเท้าในซอย</text><text x="581.1206400386232" y="188.6474508437579" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal">ได้รับผลกระทบโดยอ้อม</text><rect x="411.660071158" y="315.3525491562421" width="170" height="52" rx="10" fill="#dcfce7" stroke="#1f2937" stroke-width="1.2"/><text x="496.660071158" y="337.3525491562421" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">ผู้พัฒนาและทีม</text><text x="496.660071158" y="356.3525491562421" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal">ตัดสินการออกแบบ</text><rect x="138.33992884200003" y="315.3525491562421" width="170" height="52" rx="10" fill="#fef3c7" stroke="#1f2937" stroke-width="1.2"/><text x="223.33992884200003" y="337.3525491562421" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">ชุมชนท้องถิ่น</text><text x="223.33992884200003" y="356.3525491562421" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal">ได้รับผลกระทบโดยอ้อม</text><rect x="53.87935996137679" y="147.6474508437579" width="170" height="52" rx="10" fill="#dcfce7" stroke="#1f2937" stroke-width="1.2"/><text x="138.8793599613768" y="169.6474508437579" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">หน่วยงานกำกับ</text><text x="138.8793599613768" y="188.6474508437579" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal">กำหนดกติกา</text><rect x="280" y="184" width="160" height="72" rx="12" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/><text x="360" y="214" font-family="sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">ระบบแนะนำเส้นทาง</text><text x="360" y="236" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal">ตัดสินเส้นทางจากข้อมูล</text><text x="360" y="30" font-family="sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="normal">ผู้มีส่วนได้เสียทางตรงและทางอ้อมต้องถูกระบุก่อนประเมิน</text></svg>
