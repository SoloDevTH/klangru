<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" font-family="sans-serif" font-size="14">
  <title>เส้นทางจากแล็ปท็อปถึงเซิร์ฟเวอร์ ผ่าน Wi-Fi 300 Mbps สายผู้ให้บริการ 100 Mbps และอินเทอร์เน็ต 1 Gbps ทรูพุตสูงสุดถูกจำกัดด้วยลิงก์ 100 Mbps</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="880" height="250" fill="#ffffff"/>
  <rect x="20.0" y="40.0" width="180.0" height="60.0" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="110.0" y="75.2" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">แล็ปท็อป</text>
  <rect x="240.0" y="40.0" width="180.0" height="60.0" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="330.0" y="75.2" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">เราเตอร์บ้าน</text>
  <rect x="460.0" y="40.0" width="180.0" height="60.0" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="550.0" y="75.2" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ผู้ให้บริการ</text>
  <rect x="680.0" y="40.0" width="180.0" height="60.0" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="770.0" y="75.2" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">เซิร์ฟเวอร์</text>
  <line x1="200.0" y1="70.0" x2="240.0" y2="70.0" stroke="#2563eb" stroke-width="6"/>
  <text x="220.0" y="128.0" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold" xml:space="preserve">Wi-Fi 300 Mbps</text>
  <line x1="420.0" y1="70.0" x2="460.0" y2="70.0" stroke="#b91c1c" stroke-width="2"/>
  <text x="440.0" y="128.0" font-size="13" text-anchor="middle" fill="#b91c1c" font-weight="bold" xml:space="preserve">สาย 100 Mbps</text>
  <line x1="640.0" y1="70.0" x2="680.0" y2="70.0" stroke="#2563eb" stroke-width="14"/>
  <text x="660.0" y="128.0" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold" xml:space="preserve">1 Gbps</text>
  <rect x="330.0" y="150.0" width="220.0" height="40.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="440.0" y="176.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">คอขวด: ทรูพุตสูงสุด 100 Mbps</text>
  <line x1="440.0" y1="150.0" x2="440.0" y2="135.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="440.0" y="225.0" font-size="13" text-anchor="middle" fill="#6b7280" xml:space="preserve">ความหนาของเส้นแทนแบนด์วิดท์ ลิงก์ที่บางที่สุดกำหนดความเร็วของทั้งเส้นทาง</text>
</svg>
