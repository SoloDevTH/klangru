    choices:
      - { id: a, text: "เลือกเมนู / จ่ายเงิน / ส่งรายการให้แม่ค้า / แจ้งเมื่ออาหารพร้อม", correct: true }
      - { id: b, text: "หน้าจอสีฟ้า / หน้าจอสีเขียว / หน้าจอสีส้ม", feedback: "แบ่งตามสี ไม่ได้แบ่งตามงานที่ระบบต้องทำ" }
      - { id: c, text: "วันจันทร์ / วันอังคาร / วันพุธ / วันพฤหัสบดี / วันศุกร์", feedback: "ทุกวันระบบทำงานเหมือนกัน การแบ่งตามวันไม่ช่วยออกแบบ" }
      - { id: d, text: "ทำทั้งระบบพร้อมกันในครั้งเดียว", feedback: "ไม่ได้แตกปัญหาเลย งานใหญ่ทำทีเดียวยากต่อการทดสอบและหาข้อผิดพลาด" }
    hints:
