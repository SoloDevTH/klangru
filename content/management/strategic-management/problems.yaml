problems:
  - id: management.strategy.strategic-management.p001
    topics: [management.strategy.strategic-management]
    difficulty: 1
    type: match
    stem: "จับคู่ข้อความของโรงพยาบาลชุมชนแห่งหนึ่ง (สมมติ) กับองค์ประกอบของทิศทางองค์กร"
    pairs:
      - { left: "เป็นโรงพยาบาลที่คนในอำเภอไว้ใจเป็นที่แรก", right: "วิสัยทัศน์" }
      - { left: "ให้บริการสุขภาพแบบองค์รวมแก่ประชาชนในอำเภอ ร่วมกับเครือข่าย อสม.", right: "พันธกิจ" }
      - { left: "ปลอดภัย ซื่อตรง เอาใจใส่", right: "ค่านิยม" }
      - { left: "ลดผู้ป่วยเบาหวานที่ต้องนอนโรงพยาบาลลง 20% ภายในปี 2571", right: "วัตถุประสงค์เชิงกลยุทธ์" }
    hints:
      - "วิสัยทัศน์คือภาพอนาคต พันธกิจคือสิ่งที่ทำให้ใคร"
      - "ข้อที่มีตัวเลขและกรอบเวลาคือวัตถุประสงค์"
    solution: "ภาพที่อยากเป็นคือวิสัยทัศน์ สิ่งที่ทำและให้ใครคือพันธกิจ หลักยึดในการทำงานคือค่านิยม และเป้าหมายที่วัดได้พร้อมกรอบเวลาคือวัตถุประสงค์เชิงกลยุทธ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.strategy.strategic-management.p002
    topics: [management.strategy.strategic-management]
    difficulty: 1
    type: mcq
    stem: "ร้านขนมเปี๊ยะในสุพรรณบุรี (สมมติ) ทำ SWOT ข้อใดเป็น **จุดแข็ง**"
    choices:
      - { id: a, text: "สูตรไส้ถั่วของร้านที่ลูกค้าจำรสได้และทำต่อกันมาสามรุ่น", correct: true }
      - { id: b, text: "นักท่องเที่ยวขับรถผ่านจังหวัดมากขึ้น", feedback: "เป็นเรื่องภายนอกที่ร้านควบคุมไม่ได้ จึงเป็นโอกาส" }
      - { id: c, text: "ราคาน้ำตาลและแป้งสูงขึ้น", feedback: "เป็นเรื่องภายนอก จึงเป็นอุปสรรค" }
      - { id: d, text: "ไม่มีหน้าร้านออนไลน์", feedback: "เป็นเรื่องภายในที่ยังทำได้ไม่ดี จึงเป็นจุดอ่อน" }
    hints:
      - "จุดแข็งเป็นเรื่องภายในองค์กร"
      - "ถ้าร้านควบคุมเรื่องนั้นไม่ได้ เป็นปัจจัยภายนอก"
    solution: "สูตรของร้านเป็นทรัพยากรภายในที่ทำให้เหนือคู่แข่ง จึงเป็นจุดแข็ง นักท่องเที่ยวเป็นโอกาส ราคาวัตถุดิบเป็นอุปสรรค และการไม่มีร้านออนไลน์เป็นจุดอ่อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.strategy.strategic-management.p003
    topics: [management.strategy.strategic-management]
    difficulty: 1
    type: match
    stem: "จับคู่ปัจจัยที่กระทบผู้ส่งออกผลไม้แปรรูป (สมมติ) กับหมวดของ PESTEL"
    pairs:
      - { left: "ค่าเงินบาทแข็งค่าขึ้น", right: "เศรษฐกิจ (E)" }
      - { left: "ผู้บริโภคหันมาลดน้ำตาล", right: "สังคม (S)" }
      - { left: "เครื่องอบแห้งแบบใหม่ใช้ไฟน้อยลงครึ่งหนึ่ง", right: "เทคโนโลยี (T)" }
      - { left: "ฝนทิ้งช่วงนานกว่าปกติ", right: "สิ่งแวดล้อม (E)" }
      - { left: "ประเทศคู่ค้าออกกฎฉลากสารก่อภูมิแพ้ฉบับใหม่", right: "กฎหมาย (L)" }
      - { left: "รัฐบาลสองประเทศลงนามความตกลงการค้า", right: "การเมือง (P)" }
    hints:
      - "PESTEL มีหกด้าน การเมือง เศรษฐกิจ สังคม เทคโนโลยี สิ่งแวดล้อม กฎหมาย"
      - "กฎที่บังคับใช้คือกฎหมาย การตกลงระหว่างรัฐบาลคือการเมือง"
    solution: "ค่าเงินคือเศรษฐกิจ พฤติกรรมผู้บริโภคคือสังคม เครื่องจักรใหม่คือเทคโนโลยี สภาพอากาศคือสิ่งแวดล้อม กฎฉลากคือกฎหมาย และความตกลงระหว่างรัฐบาลคือการเมือง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.strategy.strategic-management.p004
    topics: [management.strategy.strategic-management]
    difficulty: 2
    type: mcq
    stem: "ร้านซ่อมโทรศัพท์ในตลาดแห่งหนึ่ง (สมมติ) พบว่าลูกค้าสามารถเปรียบเทียบราคาได้ทันทีจากร้านอื่นอีกห้าร้านในซอยเดียวกัน และเปลี่ยนร้านได้โดยไม่เสียอะไร ข้อนี้คือแรงกดดันใดตามกรอบของพอร์เตอร์"
    choices:
      - { id: a, text: "อำนาจต่อรองของผู้ซื้อ", correct: true }
      - { id: b, text: "อำนาจต่อรองของผู้ขายวัตถุดิบ", feedback: "ผู้ขายวัตถุดิบคือผู้ที่ร้านซื้ออะไหล่ ไม่ใช่ลูกค้า" }
      - { id: c, text: "ภัยจากสินค้าทดแทน", feedback: "สินค้าทดแทนคือสิ่งที่ต่างประเภทแต่ตอบความต้องการเดียวกัน เช่น ซื้อเครื่องใหม่แทนการซ่อม ข้อนี้คือลูกค้าเปลี่ยนร้านซ่อม" }
      - { id: d, text: "ภัยจากผู้เข้ามาใหม่", feedback: "โจทย์พูดถึงร้านที่มีอยู่แล้วและความสามารถของลูกค้าในการต่อรอง ไม่ใช่ร้านใหม่ที่จะเปิด" }
    hints:
      - "ใครเป็นฝ่ายที่ได้เปรียบในสถานการณ์นี้"
      - "ต้นทุนการเปลี่ยนเจ้าต่ำทำให้ฝ่ายใดมีอำนาจ"
    solution: "เมื่อลูกค้าเปรียบเทียบง่ายและเปลี่ยนร้านได้โดยไม่มีต้นทุน ลูกค้ามีอำนาจต่อรองสูง ร้านต้องแข่งราคาหรือสร้างความแตกต่าง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.strategy.strategic-management.p005
    topics: [management.strategy.strategic-management]
    difficulty: 2
    type: numeric
    stem: "โรงงานแปรรูปอาหาร (สมมติ) ทำตาราง EFE ห้าปัจจัย น้ำหนัก 0.30, 0.20, 0.10, 0.25, 0.15 คะแนนการตอบสนอง 4, 3, 2, 1, 2 ตามลำดับ คะแนน EFE รวมเป็นเท่าไร"
    answer: { value: 2.55, tolerance: 0.01 }
    hints:
      - "คะแนนรวม = ผลรวมของ (น้ำหนัก × คะแนน)"
      - "คูณทีละคู่แล้วบวก"
    misconceptions:
      - { match: 2.4, feedback: "หาค่าเฉลี่ยของคะแนนโดยไม่ถ่วงน้ำหนัก ต้องคูณกับน้ำหนักก่อน" }
      - { match: 12, feedback: "บวกคะแนนตรง ๆ โดยไม่คูณน้ำหนัก" }
    solution: "$0.30(4) + 0.20(3) + 0.10(2) + 0.25(1) + 0.15(2) = 1.2 + 0.6 + 0.2 + 0.25 + 0.3 = 2.55$ สูงกว่าค่ากลาง 2.5 เล็กน้อย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.strategy.strategic-management.p006
    topics: [management.strategy.strategic-management]
    difficulty: 2
    type: mcq
    stem: "จากตาราง TOWS ของวิสาหกิจกาแฟในบทเรียน ข้อใดเป็นกลยุทธ์แบบ **WO**"
    choices:
      - { id: a, text: "ใช้ตลาดกาแฟพิเศษที่โตขึ้น ร่วมกับแพลตฟอร์มออนไลน์เพื่อแก้ปัญหาการตลาดออนไลน์ที่อ่อน", correct: true }
      - { id: b, text: "ใช้เมล็ดคุณภาพสูงเปิดทัวร์ไร่ให้นักท่องเที่ยว", feedback: "ใช้จุดแข็งคว้าโอกาส เป็นแบบ SO" }
      - { id: c, text: "สร้างตราสินค้าแหล่งกำเนิดเพื่อหนีกาแฟนำเข้าราคาต่ำ", feedback: "ใช้จุดแข็งรับอุปสรรค เป็นแบบ ST" }
      - { id: d, text: "ร่วมลงทุนระบบน้ำหยดเพื่อรับมือฝนแล้งโดยใช้เงินไม่มาก", feedback: "ลดจุดอ่อนและเลี่ยงอุปสรรค เป็นแบบ WT" }
    hints:
      - "W คือจุดอ่อน O คือโอกาส"
      - "หาข้อที่ใช้โอกาสภายนอกช่วยแก้จุดอ่อนภายใน"
    solution: "WO ใช้โอกาส (ตลาดกาแฟพิเศษโต) ช่วยแก้จุดอ่อน (การตลาดออนไลน์อ่อน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.strategy.strategic-management.p007
    topics: [management.strategy.strategic-management]
    difficulty: 3
    type: numeric
    stem: "สำนักงานที่ดินแห่งหนึ่ง (สมมติ) ตั้ง KPI เวลารอรับบริการเฉลี่ยไม่เกิน 30 นาที ไตรมาสนี้ทำได้ 36 นาที ร้อยละความสำเร็จของ KPI นี้เป็นเท่าไร"
    answer: { value: 83.33, unit: "%", tolerance: 0.1 }
    hints:
      - "เวลารอยิ่งน้อยยิ่งดี"
      - "ยิ่งน้อยยิ่งดีใช้ เป้าหมาย ÷ ผลจริง × 100"
    misconceptions:
      - { match: 120, feedback: "ใช้ผลจริง ÷ เป้าหมาย ซึ่งใช้กับ KPI ยิ่งมากยิ่งดี ถ้าใช้สูตรนี้รอนานขึ้นกลับได้คะแนนสูงขึ้น" }
      - { match: 80, feedback: "คิดจากส่วนที่เกินเป้าเทียบกับเป้า (6 ÷ 30) ซึ่งเป็นอีกวิธีหนึ่ง แต่โจทย์ให้ใช้สูตรอัตราส่วนในบทเรียน" }
    solution: "$30 \\div 36 \\times 100 \\approx 83.33\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.strategy.strategic-management.p008
    topics: [management.strategy.strategic-management]
    difficulty: 3
    type: match
    stem: "จับคู่ร้านอาหาร (สมมติ) กับกลยุทธ์ระดับธุรกิจของพอร์เตอร์"
    pairs:
      - { left: "ร้านข้าวแกงที่ลดต้นทุนด้วยการซื้อวัตถุดิบล็อตใหญ่และเมนูน้อย ขายถูกกว่าทุกร้าน", right: "ผู้นำต้นทุน" }
      - { left: "ร้านที่ใช้ผักอินทรีย์จากฟาร์มของตัวเองและตั้งราคาสูงกว่าร้านทั่วไป", right: "ความแตกต่าง" }
      - { left: "ร้านที่ทำอาหารสำหรับผู้ป่วยไตโดยเฉพาะ", right: "มุ่งตลาดเฉพาะส่วน" }
    hints:
      - "ผู้นำต้นทุนชนะด้วยต้นทุนที่ต่ำกว่า"
      - "การมุ่งตลาดเฉพาะส่วนเลือกลูกค้ากลุ่มแคบ"
    solution: "ขายถูกกว่าทุกคนเพราะต้นทุนต่ำคือผู้นำต้นทุน คุณภาพพิเศษที่ลูกค้ายอมจ่ายเพิ่มคือความแตกต่าง และเจาะกลุ่มผู้ป่วยไตคือการมุ่งตลาดเฉพาะส่วน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.strategy.strategic-management.p009
    topics: [management.strategy.strategic-management]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการจัดการเชิงกลยุทธ์ของเทศบาลแห่งหนึ่ง (สมมติ) จากก่อนไปหลัง"
    items:
      - "ทบทวนวิสัยทัศน์และพันธกิจกับผู้มีส่วนได้ส่วนเสีย"
      - "วิเคราะห์ปัจจัยภายนอกและภายใน สรุปเป็น SWOT"
      - "จับคู่ปัจจัยด้วย TOWS แล้วเลือกกลยุทธ์"
      - "กำหนดวัตถุประสงค์เชิงกลยุทธ์ KPI และค่าเป้าหมาย"
      - "ทำแผนปฏิบัติการและจัดสรรงบประมาณ คน และอุปกรณ์"
      - "ติดตามผลรายไตรมาส คาดการณ์ และปรับแผน"
    hints:
      - "รู้ทิศทางก่อน แล้วจึงวิเคราะห์"
      - "แผนปฏิบัติการต้องมาหลังกำหนด KPI และการติดตามอยู่ท้ายสุด"
    solution: "ทิศทาง → วิเคราะห์ → เลือกกลยุทธ์ → วัตถุประสงค์และ KPI → แผนปฏิบัติการและทรัพยากร → ติดตามและปรับแผน แล้ววนกลับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.strategy.strategic-management.p010
    topics: [management.strategy.strategic-management]
    difficulty: 3
    type: numeric
    stem: "บริษัทขนส่ง (สมมติ) ให้น้ำหนัก BSC สี่มุมมองเป็น การเงิน 0.30 ลูกค้า 0.25 กระบวนการภายใน 0.25 การเรียนรู้และพัฒนา 0.20 ร้อยละความสำเร็จของแต่ละมุมเป็น 92, 80, 105 และ 70 ตามลำดับ ถ้ากำหนดว่ามุมใดเกิน 100 ให้นับเป็น 100 คะแนนรวมถ่วงน้ำหนักเป็นเท่าไร"
    answer: { value: 86.6, unit: "%", tolerance: 0.05 }
    hints:
      - "เปลี่ยน 105 เป็น 100 ก่อน"
      - "คะแนนรวม = ผลรวมของ (น้ำหนัก × ร้อยละความสำเร็จ)"
    misconceptions:
      - { match: 87.85, feedback: "ไม่ได้ตัดเพดาน 100 ของมุมกระบวนการภายใน" }
      - { match: 86.75, feedback: "หาค่าเฉลี่ยธรรมดาโดยไม่ถ่วงน้ำหนักและไม่ตัดเพดาน" }
    solution: "$0.30(92) + 0.25(80) + 0.25(100) + 0.20(70) = 27.6 + 20 + 25 + 14 = 86.6$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.strategy.strategic-management.p011
    topics: [management.strategy.strategic-management]
    difficulty: 3
    type: mcq
    stem: "ใน balanced scorecard ของโรงเรียนอาชีวะแห่งหนึ่ง (สมมติ) ข้อใดเป็น **ตัวชี้วัดนำ** ของเป้าหมาย \"ผู้สำเร็จการศึกษาได้งานตรงสาขาเพิ่มขึ้น\""
    choices:
      - { id: a, text: "จำนวนชั่วโมงที่ครูไปฝึกงานในสถานประกอบการต่อปี", correct: true }
      - { id: b, text: "ร้อยละผู้สำเร็จการศึกษาที่ได้งานตรงสาขาภายใน 1 ปี", feedback: "นี่คือผลปลายทางที่ต้องรอวัดหลังจบ จึงเป็นตัวชี้วัดตาม" }
      - { id: c, text: "รายได้ของวิทยาลัยจากการบริการวิชาการ", feedback: "เป็นมุมการเงิน ไม่ได้บอกล่วงหน้าว่านักเรียนจะได้งานหรือไม่" }
      - { id: d, text: "ความพึงพอใจของนายจ้างต่อผู้สำเร็จการศึกษา", feedback: "วัดได้หลังผู้สำเร็จการศึกษาทำงานแล้ว จึงเป็นตัวชี้วัดตาม" }
    hints:
      - "ตัวชี้วัดนำเปลี่ยนก่อนผลลัพธ์"
      - "มักอยู่ในมุมการเรียนรู้และพัฒนาหรือกระบวนการภายใน"
    solution: "ครูที่ได้ฝึกในสถานประกอบการจะสอนทักษะตรงงานจริงขึ้น ซึ่งส่งผลต่อการได้งานในอีกหนึ่งถึงสองปี จึงเป็นตัวชี้วัดนำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.strategy.strategic-management.p012
    topics: [management.strategy.strategic-management]
    difficulty: 4
    type: numeric
    stem: "จากกราฟร้อยละลูกค้าที่ซื้อซ้ำ (สมมติ) ถ้าใช้อัตราเพิ่มเฉลี่ยต่อปีระหว่างปี 2564 ถึง 2567 ลากต่อไป ปี 2571 จะต่ำกว่าเป้า 68% กี่จุดเปอร์เซ็นต์"
    figure:
      src: p-kpi-trend.svg
      alt: "กราฟเส้นร้อยละลูกค้าที่ซื้อซ้ำ ปี 2564 52% ปี 2565 54% ปี 2566 55% ปี 2567 57% เส้นประเป้าหมาย 68% ในปี 2571"
    answer: { value: 4.33, unit: จุดเปอร์เซ็นต์, tolerance: 0.05 }
    hints:
      - "อัตราเพิ่มเฉลี่ย = (57 − 52) ÷ 3 จุดต่อปี"
      - "จากปี 2567 ถึง 2571 มี 4 ปี"
    misconceptions:
      - { match: 3, feedback: "ใช้อัตราเพิ่มของปีล่าสุด (2 จุด) ลากต่อ โจทย์ให้ใช้อัตราเฉลี่ยทั้งช่วง" }
      - { match: 11, feedback: "เทียบค่าปี 2567 กับเป้าโดยไม่คาดการณ์ ต้องลากแนวโน้มไปถึงปี 2571 ก่อน" }
      - { match: 6, feedback: "หารผลต่าง 5 จุดด้วย 4 (นับจำนวนปีแทนจำนวนช่วง) ได้อัตรา 1.25 ต่อปี แต่ 2564 ถึง 2567 มีเพียง 3 ช่วงปี" }
    solution: "อัตราเพิ่ม $(57 - 52) \\div 3 \\approx 1.667$ จุดต่อปี ค่าคาดการณ์ปี 2571 $= 57 + 4 \\times 1.667 \\approx 63.67\\%$ ต่ำกว่าเป้า $68 - 63.67 \\approx 4.33$ จุด จึงควรปรับแผนตั้งแต่ตอนนี้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.strategy.strategic-management.p013
    topics: [management.strategy.strategic-management]
    difficulty: 4
    type: numeric
    stem: "บริษัทน้ำดื่มท้องถิ่น (สมมติ) มียอดขาย 180 ล้านบาท ตลาดรวม 1,200 ล้านบาท ผู้นำตลาดมียอดขาย 360 ล้านบาท ส่วนแบ่งตลาดเปรียบเทียบ (relative market share) ของบริษัทนี้เป็นเท่าไร"
    answer: { value: 0.5, tolerance: 0.01 }
    hints:
      - "ส่วนแบ่งตลาดเปรียบเทียบ = ยอดขายของเรา ÷ ยอดขายของผู้นำตลาด"
      - "ไม่ใช่หารด้วยตลาดรวม"
    misconceptions:
      - { match: 0.15, feedback: "นั่นคือส่วนแบ่งตลาดธรรมดา (180 ÷ 1,200) ส่วนแบ่งเปรียบเทียบต้องเทียบกับผู้นำตลาด" }
      - { match: 2, feedback: "หารกลับด้าน ต้องเอายอดขายของเราเป็นตัวตั้ง" }
    solution: "$180 \\div 360 = 0.5$ ยอดขายเป็นครึ่งหนึ่งของผู้นำ ในตาราง BCG จึงอยู่ฝั่งส่วนแบ่งต่ำ (น้อยกว่า 1)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.strategy.strategic-management.p014
    topics: [management.strategy.strategic-management]
    difficulty: 4
    type: mcq
    stem: "สหกรณ์โคนมแห่งหนึ่ง (สมมติ) เคยขายน้ำนมดิบให้โรงงาน ตอนนี้ลงทุนสร้างโรงงานพาสเจอไรซ์และส่งนมกล่องขายในร้านค้าเอง นี่คือกลยุทธ์ระดับองค์กรแบบใด"
    choices:
      - { id: a, text: "การรวมธุรกิจไปข้างหน้า (forward integration)", correct: true }
      - { id: b, text: "การรวมธุรกิจย้อนหลัง (backward integration)", feedback: "ย้อนหลังคือเข้าไปทำงานของผู้ขายวัตถุดิบ เช่น ปลูกหญ้าเลี้ยงวัวเอง ข้อนี้ขยับเข้าใกล้ผู้บริโภค" }
      - { id: c, text: "การกระจายธุรกิจที่ไม่เกี่ยวข้อง", feedback: "นมกล่องยังอยู่ในห่วงโซ่เดียวกับน้ำนมดิบ จึงไม่ใช่ธุรกิจที่ไม่เกี่ยวข้อง" }
      - { id: d, text: "กลยุทธ์หดตัว", feedback: "สหกรณ์ลงทุนเพิ่มและขยายงาน ไม่ใช่การหดตัว" }
    hints:
      - "สหกรณ์ขยับไปทำขั้นตอนที่อยู่ใกล้ผู้บริโภคหรือใกล้วัตถุดิบมากขึ้น"
      - "ไปข้างหน้าคือเข้าใกล้ลูกค้าปลายทาง"
    solution: "สหกรณ์เข้าไปทำงานแปรรูปและจำหน่าย ซึ่งเดิมเป็นของผู้ซื้อ จึงเป็นการรวมธุรกิจไปข้างหน้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.strategy.strategic-management.p015
    topics: [management.strategy.strategic-management]
    difficulty: 5
    type: mcq
    stem: "กรมแห่งหนึ่ง (สมมติ) ทบทวนผลกลางปีงบประมาณ พบว่า KPI \"จำนวนวิสาหกิจที่ได้รับรองมาตรฐาน\" ทำได้ 35% ของเป้าทั้งปี และคาดการณ์ว่าทั้งปีจะได้เพียง 70% เพราะผู้ตรวจประเมินลาออกสองคน ข้อใดเป็นการจัดการที่ดีที่สุดตามหลักการติดตามและปรับแผน"
    choices:
      - { id: a, text: "วิเคราะห์สาเหตุ ปรับแผนปฏิบัติการ เช่น ยืมผู้ตรวจจากหน่วยงานเครือข่ายหรือจัดลำดับวิสาหกิจที่พร้อม แล้วรายงานผู้บริหารพร้อมค่าคาดการณ์ใหม่", correct: true }
      - { id: b, text: "รอจนสิ้นปีงบประมาณแล้วอธิบายเหตุผลในรายงานประจำปี", feedback: "การรอเสียโอกาสแก้ไข การติดตามที่ดีต้องคาดการณ์และปรับตั้งแต่กลางทาง" }
      - { id: c, text: "ลดค่าเป้าหมายลงเหลือ 70% ทันทีโดยไม่ต้องแจ้งใคร", feedback: "การเปลี่ยนเป้าต้องมีเหตุผล ผ่านการอนุมัติ และรายงานอย่างโปร่งใส ไม่ใช่แก้เงียบ ๆ" }
      - { id: d, text: "ลดเกณฑ์การตรวจรับรองให้ง่ายขึ้นเพื่อให้ได้จำนวนตามเป้า", feedback: "ทำให้ตัวเลขดีแต่คุณภาพของการรับรองลดลง ขัดกับวัตถุประสงค์ของ KPI" }
    hints:
      - "การติดตามที่ดีใช้ค่าคาดการณ์เพื่อแก้ก่อนสิ้นปี"
      - "การปรับแผนต้องโปร่งใสและไม่ทำลายคุณภาพ"
    solution: "การติดตามและปรับแผนที่ดีคือหาสาเหตุ ปรับแผนหรือทรัพยากรผ่านเครือข่าย และรายงานผลพร้อมค่าคาดการณ์ใหม่อย่างโปร่งใส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.strategy.strategic-management.p016
    topics: [management.strategy.strategic-management]
    difficulty: 4
    type: numeric
    stem: "ผู้ผลิตเครื่องแกงสำเร็จรูป (สมมติ) มีรายได้ 60 ล้านบาท ตั้งเป้าให้ได้ 90 ล้านบาทภายใน 5 ปี ต้องเติบโตเฉลี่ยทบต้นปีละกี่เปอร์เซ็นต์"
    answer: { value: 8.45, unit: "%", tolerance: 0.05 }
    hints:
      - "CAGR = (ค่าปลาย ÷ ค่าต้น)^(1/n) − 1"
      - "$(90/60)^{1/5} - 1$"
    misconceptions:
      - { match: 10, feedback: "หาร 50% ด้วย 5 ปีตรง ๆ แต่การเติบโตเป็นแบบทบต้น" }
      - { match: 50, feedback: "นั่นคือการเติบโตรวมทั้งห้าปี ไม่ใช่ต่อปี" }
    solution: "$(90/60)^{1/5} - 1 = 1.5^{0.2} - 1 \\approx 0.0845$ ต้องโตเฉลี่ยประมาณ $8.45\\%$ ต่อปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.strategy.strategic-management.p017
    topics: [management.strategy.strategic-management]
    difficulty: 5
    type: mcq
    stem: "บริษัทประกันภัยรถยนต์ (สมมติ) พบว่าคู่แข่งใช้ระบบปัญญาประดิษฐ์ประเมินความเสียหายจากรูปถ่ายภายในไม่กี่นาที ข้อใดเป็นแนวทางที่สอดคล้องกับการประเมินการเปลี่ยนแปลงทางเทคโนโลยีและการตัดสินใจเรื่องนวัตกรรมมากที่สุด"
    choices:
      - { id: a, text: "ทดลองใช้กับเคลมเล็กในสาขาเดียว วัดความแม่นยำ เวลา และข้อร้องเรียน แล้วตัดสินใจขยาย ปรับ หรือหยุดตามผล", correct: true }
      - { id: b, text: "ซื้อระบบมาใช้ทั้งบริษัททันทีเพื่อไม่ให้ตามหลังคู่แข่ง", feedback: "ลงทุนเต็มที่โดยยังไม่รู้ว่าระบบเหมาะกับข้อมูลและลูกค้าของตนหรือไม่ เสี่ยงเกินจำเป็น" }
      - { id: c, text: "ไม่ทำอะไรเพราะเทคโนโลยีใหม่ยังไม่แน่นอน", feedback: "การเพิกเฉยเสี่ยงสูญเสียความสามารถในการแข่งขัน ควรประเมินอย่างมีระบบ" }
      - { id: d, text: "ให้ฝ่ายไอทีตัดสินใจเองทั้งหมดเพราะเป็นเรื่องเทคนิค", feedback: "เทคโนโลยีนี้กระทบลูกค้า กระบวนการ และความเสี่ยงของบริษัท จึงเป็นเรื่องเชิงกลยุทธ์ที่ผู้นำต้องร่วมตัดสินใจ" }
    hints:
      - "นวัตกรรมที่ดีรับความเสี่ยงอย่างมีข้อมูล"
      - "ทดลองขนาดเล็กก่อนแล้วตัดสินใจจากผล"
    solution: "การทดลองขนาดเล็กพร้อมตัวชี้วัดที่ชัดช่วยให้ตัดสินใจขยายหรือหยุดได้จากข้อมูล ลดความเสี่ยงโดยไม่ตามหลังคู่แข่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.strategy.strategic-management.p018
    topics: [management.strategy.strategic-management]
    difficulty: 4
    type: mcq
    stem: "ร้านผ้าไหมในสุรินทร์ (สมมติ) มีช่างทอฝีมือที่สืบทอดลายเฉพาะของหมู่บ้าน คนนอกเรียนรู้ได้ยากเพราะต้องฝึกหลายปี และร้านมีระบบบันทึกลายและจ่ายค่าตอบแทนช่างอย่างเป็นธรรม ทรัพยากรนี้ผ่านเกณฑ์ VRIO ข้อใดบ้าง"
    choices:
      - { id: a, text: "ครบทั้งสี่ข้อ มีคุณค่า หายาก ลอกเลียนยาก และองค์กรจัดการให้ใช้ได้", correct: true }
      - { id: b, text: "มีคุณค่าและหายาก แต่ลอกเลียนได้ง่าย", feedback: "ต้องฝึกหลายปีและเป็นลายเฉพาะ จึงลอกเลียนยาก" }
      - { id: c, text: "มีคุณค่าเท่านั้น", feedback: "ช่างที่มีลายเฉพาะหาได้ยาก จึงผ่านข้อหายากด้วย" }
      - { id: d, text: "ผ่านสามข้อแรก แต่องค์กรยังไม่ได้จัดการให้ใช้ประโยชน์", feedback: "ร้านมีระบบบันทึกลายและค่าตอบแทน ถือว่าจัดการให้ใช้ประโยชน์ได้" }
    hints:
      - "ตรวจทีละข้อ V R I O"
      - "O คือองค์กรมีระบบรองรับการใช้ทรัพยากรหรือไม่"
    solution: "ฝีมือช่างสร้างคุณค่าให้ลูกค้า หายาก ลอกเลียนยากเพราะต้องฝึกนาน และร้านมีระบบรองรับ ผ่านครบ VRIO จึงเป็นความได้เปรียบที่ยั่งยืน"
    license: CC-BY-SA-4.0
    ai_assisted: true
