problems:
- id: chinese.pinyin.initials-finals.p001
  topics:
  - chinese.pinyin.initials-finals
  difficulty: 1
  type: mcq
  stem: ในพยางค์ hǎo (好 ดี) ส่วนที่เป็น **สระ** (韵母 yùnmǔ) คือส่วนใด
  choices:
  - id: a
    text: a
    feedback: a เป็นเพียงตัวแรกของสระ สระของพยางค์นี้คือ ao ทั้งหมด
  - id: b
    text: hǎo
    feedback: hǎo คือทั้งพยางค์ ซึ่งมีทั้งพยัญชนะต้น สระ และวรรณยุกต์
  - id: c
    text: ao
    correct: true
    feedback: ถูก h เป็นพยัญชนะต้น ที่เหลือ ao เป็นสระ
  - id: d
    text: h
    feedback: h คือพยัญชนะต้น (声母)
  hints:
  - พยางค์ = พยัญชนะต้น + สระ + วรรณยุกต์
  - ตัดพยัญชนะต้นตัวแรกออก ที่เหลือคือสระ
  solution: hǎo = **h** (พยัญชนะต้น) + **ao** (สระ) + เสียง 3
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.pinyin.initials-finals.p002
  topics:
  - chinese.pinyin.initials-finals
  difficulty: 1
  type: mcq
  stem: ข้อใด **ไม่ใช่** พยัญชนะต้น (声母) ในพินอิน
  choices:
  - id: a
    text: zh
    feedback: zh เป็นพยัญชนะต้นที่ม้วนลิ้น เขียนด้วยอักษร 2 ตัวแต่เป็นเสียงเดียว
  - id: b
    text: x
    feedback: x เป็นพยัญชนะต้น ใกล้เสียง ซ
  - id: c
    text: r
    feedback: r เป็นพยัญชนะต้นที่ม้วนลิ้น
  - id: d
    text: ai
    correct: true
    feedback: ถูก ai เป็นสระผสม (复韵母)
  hints:
  - พยัญชนะต้นอยู่หน้าพยางค์ สระตามหลัง
  - พยัญชนะต้นบางตัวเขียนด้วยอักษร 2 ตัว คือ zh ch sh
  solution: '**ai** เป็นสระ ส่วน zh, x, r เป็นพยัญชนะต้น'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.pinyin.initials-finals.p003
  topics:
  - chinese.pinyin.initials-finals
  difficulty: 1
  type: match
  stem: จับคู่พยัญชนะต้นพินอินกับพยัญชนะไทยที่เสียงใกล้เคียง (โดยประมาณ)
  pairs:
  - left: m
    right: ม
  - left: f
    right: ฟ
  - left: n
    right: น
  - left: l
    right: ล
  - left: h
    right: ฮ
  hints:
  - พยัญชนะกลุ่มนี้ออกเสียงคล้ายภาษาไทย
  - h ในพินอินออกเสียงจากโคนลิ้น คล้าย ฮ แต่มีเสียงลมแรงกว่า
  solution: m ม · f ฟ · n น · l ล · h ฮ (h จีนมีเสียงลมเสียดที่โคนลิ้นมากกว่า ฮ ของไทย)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.pinyin.initials-finals.p004
  topics:
  - chinese.pinyin.initials-finals
  difficulty: 2
  type: mcq
  stem: 饿 è (หิว) สระ e ในพินอินออกเสียงใกล้สระไทยตัวใดที่สุด
  choices:
  - id: a
    text: แอ
    feedback: ภาษาจีนกลางไม่มีสระ แอ ที่เขียนด้วย e
  - id: b
    text: เออ
    correct: true
    feedback: ถูก e เดี่ยว ๆ ออกเสียงใกล้ เออ (ปากไม่ห่อ)
  - id: c
    text: เอ
    feedback: e ในพินอินไม่ใช่ เอ ยกเว้นใน ie üe ei
  - id: d
    text: อี
    feedback: เสียง อี เขียนด้วย i
  hints:
  - ระวังอย่าอ่านตามภาษาอังกฤษ
  - นึกถึง 喝 hē (ดื่ม) ที่คนไทยอ่านว่า เฮอ
  solution: e เดี่ยว ๆ ออกเสียงใกล้ **เออ** เช่น 饿 è, 喝 hē แต่ใน ie, üe, ei ออกเสียงใกล้ เอ เช่น 谢 xiè
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.pinyin.initials-finals.p005
  topics:
  - chinese.pinyin.initials-finals
  difficulty: 2
  type: match
  stem: จับคู่สระพินอินกับประเภทของสระ
  pairs:
  - left: ü
    right: สระเดี่ยว (单韵母)
  - left: ao
    right: สระผสม (复韵母)
  - left: an
    right: สระนาสิกท้าย -n
  - left: ang
    right: สระนาสิกท้าย -ng
  - left: er
    right: สระม้วนลิ้น
  hints:
  - สระเดี่ยวมีเสียงเดียว สระผสมมีสระสองเสียงต่อกัน
  - สระนาสิกลงท้ายด้วย n หรือ ng
  solution: ü สระเดี่ยว · ao สระผสม · an นาสิก -n (ใกล้ แม่กน) · ang นาสิก -ng (ใกล้ แม่กง) · er สระม้วนลิ้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.pinyin.initials-finals.p006
  topics:
  - chinese.pinyin.initials-finals
  difficulty: 2
  type: text
  stem: 我 (ฉัน) มีเพียงสระ uo เสียง 3 ไม่มีพยัญชนะต้น เขียนพินอินอย่างไร (ใส่เครื่องหมาย หรือพิมพ์เลขเสียงต่อท้าย เช่น wa1)
  accepted:
  - wǒ
  - wo3
  misconceptions:
  - match: uǒ
    feedback: 'พยางค์ที่ขึ้นต้นด้วย u ต้องเปลี่ยน u เป็น w: uo → wo'
  - match: uo3
    feedback: 'พยางค์ที่ขึ้นต้นด้วย u ต้องเปลี่ยน u เป็น w: uo → wo'
  - match: wǔo
    feedback: uo เมื่อไม่มีพยัญชนะต้นเขียนว่า wo ไม่ต้องเหลือ u ไว้
  hints:
  - พยางค์ที่ไม่มีพยัญชนะต้นห้ามขึ้นต้นด้วย u
  - uo ที่ไม่มีพยัญชนะต้นเขียนแทนด้วย w + o
  solution: uo + เสียง 3 → **wǒ** (wo3)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.pinyin.initials-finals.p007
  topics:
  - chinese.pinyin.initials-finals
  difficulty: 2
  type: mcq
  stem: พนักงานร้านสะดวกซื้อในกรุงเทพฯ ได้ยินลูกค้าชาวจีนพูดคำว่า fàn (饭 ข้าว) และ fàng (放 วาง) สองคำนี้ต่างกันที่ส่วนใด
  choices:
  - id: a
    text: 'สระนาสิก: -an ลงท้ายเสียง น ส่วน -ang ลงท้ายเสียง ง'
    correct: true
    feedback: ถูก เหมือนแม่กนกับแม่กงในภาษาไทย
  - id: b
    text: พยัญชนะต้น
    feedback: ทั้งสองคำขึ้นต้นด้วย f เหมือนกัน
  - id: c
    text: วรรณยุกต์
    feedback: ทั้งสองคำเป็นเสียง 4 เหมือนกัน
  - id: d
    text: ไม่ต่างกัน เป็นคำเดียวกัน
    feedback: ต่างกันที่เสียงท้าย ความหมายจึงต่างกัน
  hints:
  - เทียบตัวอักษรของสองคำทีละตัว
  - คำหนึ่งมี g เพิ่มที่ท้าย
  solution: fàn (ฟ่าน ท้าย น) กับ fàng (ฟ่าง ท้าย ง) ต่างกันที่ **สระนาสิก -an / -ang** คนไทยแยกได้ง่ายเพราะมีแม่กนและแม่กง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.pinyin.initials-finals.p008
  topics:
  - chinese.pinyin.initials-finals
  difficulty: 3
  type: mcq
  stem: แม่ค้าที่ตลาดนัดจตุจักรบอกราคาให้ลูกค้าชาวจีน แต่ลูกค้าสับสนระหว่าง 四 sì (สี่) กับ 十 shí (สิบ) นอกจากวรรณยุกต์แล้ว สองคำนี้ต่างกันที่อะไร
  choices:
  - id: a
    text: ไม่ต่างกันเลย
    feedback: ต่างกันที่พยัญชนะต้นและวรรณยุกต์
  - id: b
    text: 'พยัญชนะต้น: s ปลายลิ้นอยู่หลังฟันบน ส่วน sh ม้วนปลายลิ้นขึ้น'
    correct: true
    feedback: ถูก s กับ sh เป็นคู่ที่ต่างกันที่ตำแหน่งลิ้น
  - id: c
    text: 'สระ: sì ใช้สระ อี ส่วน shí ใช้สระ อือ'
    feedback: i หลัง s และ sh ไม่ใช่เสียง อี ทั้งสองคำ เป็นเสียงที่ลิ้นค้างอยู่ตำแหน่งเดิม
  - id: d
    text: sh มีลมแต่ s ไม่มีลม
    feedback: ทั้งสองเป็นเสียงเสียดแทรก ความต่างอยู่ที่ตำแหน่งลิ้น ไม่ใช่ลม
  hints:
  - เทียบพยัญชนะต้นของสองคำ
  - กลุ่ม z c s กับกลุ่ม zh ch sh r ต่างกันที่การม้วนลิ้น
  solution: '四 sì: **s** ปลายลิ้นอยู่หลังฟันบน · 十 shí: **sh** ม้วนปลายลิ้นขึ้น (และวรรณยุกต์ต่างกัน: เสียง 4 กับเสียง 2)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.pinyin.initials-finals.p009
  topics:
  - chinese.pinyin.initials-finals
  difficulty: 3
  type: mcq
  stem: สระ i ใน 字 zì (ตัวอักษร) และ 是 shì (เป็น คือ) ออกเสียงอย่างไร
  choices:
  - id: a
    text: ออกเสียง ไอ แบบภาษาอังกฤษ
    feedback: พินอินไม่ได้อ่านแบบภาษาอังกฤษ
  - id: b
    text: ไม่ออกเสียงเลย
    feedback: ยังมีเสียงสระ แต่เป็นเสียงที่ต่อจากพยัญชนะต้นโดยลิ้นไม่ขยับ
  - id: c
    text: ไม่ใช่เสียง อี ลิ้นค้างอยู่ตำแหน่งของพยัญชนะต้น ฟังใกล้ อือ
    correct: true
    feedback: ถูก i หลัง z c s zh ch sh r เป็นสระพิเศษ
  - id: d
    text: ออกเสียง อี เหมือนใน 你 nǐ
    feedback: i หลัง n ออกเสียง อี แต่หลัง z c s zh ch sh r ไม่ใช่
  hints:
  - ลองเทียบ 你 nǐ กับ 是 shì
  - คนไทยมักเขียนคำอ่าน 是 ว่า ซื่อ ไม่ใช่ ชี่
  solution: i หลัง **z c s** และ **zh ch sh r** ออกเสียงคล้าย **อือ** ลิ้นค้างอยู่ตำแหน่งพยัญชนะ เช่น 字 zì (จื้อ) 是 shì (ซื่อ) โดยประมาณ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.pinyin.initials-finals.p010
  topics:
  - chinese.pinyin.initials-finals
  difficulty: 3
  type: text
  stem: 月 (ดวงจันทร์ เดือน) มีสระ üe เสียง 4 ไม่มีพยัญชนะต้น เขียนพินอินอย่างไร (ใส่เครื่องหมาย หรือพิมพ์เลขเสียงต่อท้าย เช่น ya1)
  accepted:
  - yuè
  - yue4
  misconceptions:
  - match: üè
    feedback: 'พยางค์ที่ขึ้นต้นด้วย ü ต้องเขียน yu: üe → yue'
  - match: ue4
    feedback: 'พยางค์ที่ขึ้นต้นด้วย ü ต้องเขียน yu: üe → yue'
  - match: yè
    feedback: yè คือ 夜 (กลางคืน) ใช้สระ ie คนละเสียงกับ üe
  - match: ye4
    feedback: ye4 คือ 夜 (กลางคืน) ใช้สระ ie คนละเสียงกับ üe
  hints:
  - ü ที่ไม่มีพยัญชนะต้นเขียนเป็น yu และไม่ต้องใส่จุด
  - เครื่องหมายวรรณยุกต์วางบน e
  solution: üe + เสียง 4 → **yuè** (yue4) u ในที่นี้คือ ü ที่ไม่ต้องใส่จุด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.pinyin.initials-finals.p011
  topics:
  - chinese.pinyin.initials-finals
  difficulty: 3
  type: match
  stem: พินอินบางสระเขียนย่อเมื่อมีพยัญชนะต้น จับคู่สระที่เขียนย่อกับรูปเต็ม
  pairs:
  - left: iu (เช่น liù 六)
    right: iou
  - left: ui (เช่น guì 贵)
    right: uei
  - left: un (เช่น lùn 论)
    right: uen
  hints:
  - รูปเต็มมีสระกลางเพิ่มมาอีกตัว
  - ถ้าไม่มีพยัญชนะต้นจะเขียนเต็ม เช่น you, wei, wen
  solution: iu = iou (you) · ui = uei (wei) · un = uen (wen) เมื่อมีพยัญชนะต้นให้เขียนย่อ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.pinyin.initials-finals.p012
  topics:
  - chinese.pinyin.initials-finals
  difficulty: 4
  type: mcq
  stem: พยางค์ใด **เขียนไม่ได้** ในพินอิน
  choices:
  - id: a
    text: qiu
    feedback: qiu มีจริง เช่น 秋 qiū (ฤดูใบไม้ร่วง)
  - id: b
    text: ja
    correct: true
    feedback: ถูก j q x ใช้กับสระ i หรือ ü เท่านั้น จึงมี jia แต่ไม่มี ja
  - id: c
    text: jia
    feedback: jia มีจริง เช่น 家 jiā (บ้าน)
  - id: d
    text: xue
    feedback: xue มีจริง เช่น 学 xué (เรียน) u ในที่นี้คือ ü
  hints:
  - j q x มีเงื่อนไขพิเศษเรื่องสระที่ตามหลัง
  - สระที่ตาม j q x ต้องขึ้นต้นด้วย i หรือ ü
  solution: j q x ตามด้วย i หรือ ü เท่านั้น **ja** จึงไม่มีในพินอิน (ต้องเป็น jia)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.pinyin.initials-finals.p013
  topics:
  - chinese.pinyin.initials-finals
  difficulty: 4
  type: mcq
  stem: ลูกค้าชาวจีนในร้านกาแฟที่หัวหินสั่งว่า 少冰 shǎo bīng (น้ำแข็งน้อย) แต่พนักงานไทยได้ยินเป็น xiǎo (เล็ก) ข้อใดอธิบายความต่างของ sh กับ x ได้ถูกต้อง
  choices:
  - id: a
    text: x ออกเสียงเหมือน x ในภาษาอังกฤษ (กซ)
    feedback: x ในพินอินใกล้ ซ ไม่ใช่ กซ
  - id: b
    text: sh มีลมมากกว่า x
    feedback: ความต่างอยู่ที่ตำแหน่งลิ้น
  - id: c
    text: sh ม้วนปลายลิ้นขึ้น ส่วน x ลิ้นแบน ปลายลิ้นอยู่หลังฟันล่าง และตามด้วย i หรือ ü เสมอ
    correct: true
    feedback: ถูก จึงเป็น shǎo (sh + ao) กับ xiǎo (x + iao)
  - id: d
    text: sh กับ x เสียงเหมือนกัน แค่เขียนต่างกัน
    feedback: ต่างกันทั้งตำแหน่งลิ้นและสระที่ตามหลัง
  hints:
  - 'เทียบสระของสองคำด้วย: ao กับ iao'
  - x ตามด้วยสระอะไรได้บ้าง
  solution: '**sh** ม้วนลิ้น + ao → shǎo (少 น้อย) · **x** ลิ้นแบน + iao → xiǎo (小 เล็ก)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.pinyin.initials-finals.p014
  topics:
  - chinese.pinyin.initials-finals
  difficulty: 4
  type: mcq
  stem: ข้อใดเขียนพินอินถูกต้อง (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: qù (去 ไป)
    correct: true
    feedback: ถูก หลัง q ไม่ต้องใส่จุด เพราะ q ไม่ตามด้วย u ธรรมดา
  - id: b
    text: yuán (元 หยวน)
    correct: true
    feedback: ถูก üan ที่ไม่มีพยัญชนะต้นเขียน yuan
  - id: c
    text: jüé (觉 รู้สึก)
    feedback: หลัง j ไม่ต้องใส่จุด ต้องเขียน jué
  - id: d
    text: lu (绿 สีเขียว)
    feedback: ไม่มีจุดจะกลายเป็นเสียง u คนละคำ ต้องเขียน lǜ
  - id: e
    text: lǜ (绿 สีเขียว)
    correct: true
