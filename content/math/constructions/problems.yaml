    difficulty: 5
    type: numeric
    stem: "สร้างรูปสี่เหลี่ยมจัตุรัสแนบในวงกลมรัศมี 5 ซม. โดยลากเส้นผ่านศูนย์กลางสองเส้นตั้งฉากกันแล้วเชื่อมปลาย รูปจัตุรัสนี้มีพื้นที่กี่ตารางเซนติเมตร (ตอบในหน่วยตารางเซนติเมตร)"
    answer: { value: 50, unit: cm² }
    hints:
      - "เส้นทแยงมุมของจัตุรัสคือเส้นผ่านศูนย์กลาง ยาวเท่าไร"
      - "พื้นที่รูปสี่เหลี่ยมที่เส้นทแยงมุมตั้งฉากกัน $= \\tfrac12 \\times d_1 \\times d_2$"
    misconceptions:
      - { match: 100, feedback: "คูณเส้นทแยงมุม $10 \\times 10$ แล้วลืมหารด้วย 2" }
      - { match: 25, feedback: "ใช้รัศมียกกำลังสอง แต่เส้นทแยงมุมยาว 10 ซม. ไม่ใช่ 5 ซม." }
    solution: "เส้นทแยงมุมทั้งสองเป็นเส้นผ่านศูนย์กลางยาว 10 ซม. และตั้งฉากกัน พื้นที่ $= \\tfrac12 \\times 10 \\times 10 = 50$ ตร.ซม."
