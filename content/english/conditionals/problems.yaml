  ai_assisted: true
- id: english.grammar.conditionals.p017
  topics:
  - english.grammar.conditionals
  difficulty: 4
  type: numeric
  stem: 'อ่านบทความ ถ้าทุกครอบครัวในเมืองประหยัดน้ำตามที่สำนักงานประปาบอกเป็นเวลา 30 วัน จะประหยัดน้ำได้ทั้งหมดกี่ลิตร


    *Every April, many villages in Isan run short of water. Our town has about 2,000 families, and the town water office says that if every family saved 10 litres of water a day, the town would have enough water until the rainy season. Simple changes can help. If you turn off the tap while you brush your teeth, you save several litres each time. If we collect rainwater in big jars, we can use it for our gardens. Unless we change our habits, the problem will get worse every year.*'
  answer:
    value: 600000
    tolerance: 0
    unit: ลิตร
  misconceptions:
  - match: 20000
    feedback: 20,000 ลิตรคือหนึ่งวัน ต้องคูณ 30 วัน
  - match: 300
    feedback: 300 ลิตรคือของครอบครัวเดียว ต้องคูณ 2,000 ครอบครัว
  - match: 60000
    feedback: ลืมคูณ 10 ลิตร
  hints:
  - scan หาจำนวนครอบครัวและจำนวนลิตรต่อวัน
  - ครอบครัว × ลิตรต่อวัน × จำนวนวัน
  solution: 2,000 × 10 × 30 = **600,000 ลิตร**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.conditionals.p018
  topics:
  - english.grammar.conditionals
  difficulty: 5
  type: mcq
  stem: 'อ่านบทความ ใจความสำคัญที่ผู้เขียนต้องการบอกคืออะไร


    *Every April, many villages in Isan run short of water. Our town has about 2,000 families, and the town water office says that if every family saved 10 litres of water a day, the town would have enough water until the rainy season. Simple changes can help. If you turn off the tap while you brush your teeth, you save several litres each time. If we collect rainwater in big jars, we can use it for our gardens. Unless we change our habits, the problem will get worse every year.*'
  choices:
  - id: a
    text: If people change small daily habits, the town can solve its water shortage.
    correct: true
    feedback: ถูก ทุกประโยคสนับสนุนว่าการเปลี่ยนนิสัยเล็ก ๆ ช่วยแก้ปัญหาน้ำได้
  - id: b
    text: You should turn off the tap when you brush your teeth.
    feedback: เป็นตัวอย่างหนึ่ง (รายละเอียดสนับสนุน) ไม่ใช่ใจความทั้งเรื่อง
  - id: c
    text: Isan has more villages than other parts of Thailand.
    feedback: บทความไม่ได้พูดถึงเรื่องนี้
  - id: d
    text: It never rains in Isan.
    feedback: ขัดกับบทความซึ่งพูดถึงฤดูฝนและการเก็บน้ำฝน
  hints:
  - ใจความต้องครอบคลุมทุกย่อหน้า ไม่ใช่ตัวอย่างข้อเดียว
