      - { left: "ร้อยละบุคลากรที่ได้พัฒนาทักษะดิจิทัลตามแผนรายบุคคล", right: "บุคลากร" }
      - { left: "จำนวนหน่วยงานอื่นที่มาศึกษาดูงานและนำวิธีปฏิบัติไปใช้", right: "การเป็นต้นแบบ" }
    hints:
