    stem: (ข้อมูลสมมติ) โรงเรียนช่างกลพิมพ์ชิ้นต้นแบบความสูง 60 มิลลิเมตรด้วยเครื่องพิมพ์ 3 มิติที่มีความหนาชั้น 0.2 มิลลิเมตร และพิมพ์ชั้นละ 45 วินาที เวลาพิมพ์ทั้งหมดกี่ชั่วโมง (ตอบทศนิยมสองตำแหน่ง)
    answer:
      value: 3.75
      tolerance: 0.01
      unit: ชั่วโมง
    hints:
      - จำนวนชั้น = ความสูง ÷ ความหนาชั้น
      - เวลาทั้งหมดเป็นวินาทีก่อน แล้วหาร 3600 เพื่อเป็นชั่วโมง
    misconceptions:
