problems:
  - id: earthscience.hazards.natural-hazards.p001
    topics: [earthscience.hazards.natural-hazards]
    difficulty: 1
    type: match
    stem: "จับคู่ภัยกับลักษณะของภัย"
    pairs:
      - { left: "น้ำป่าไหลหลาก", right: "น้ำไหลลงจากภูเขาแรงและเร็วหลังฝนตกหนัก พาโคลนและท่อนไม้มาด้วย" }
      - { left: "ดินถล่ม", right: "ดิน หิน และต้นไม้บนลาดเขาไถลลงมาอย่างรวดเร็ว" }
      - { left: "การกัดเซาะชายฝั่ง", right: "คลื่นพาทรายและดินออกไป แนวชายฝั่งถอยร่นเข้ามา" }
      - { left: "หลุมยุบ", right: "พื้นดินถล่มลงเป็นหลุมทันทีเหนือโพรงในหินปูน" }
      - { left: "ภัยแล้ง", right: "ฝนน้อยกว่าปกติต่อเนื่องนาน แหล่งน้ำแห้ง พืชผลเสียหาย" }
    hints:
      - "ภัยใดเกี่ยวกับทะเล ภัยใดเกี่ยวกับภูเขา"
      - "หลุมยุบเกี่ยวกับหินชนิดที่น้ำละลายได้"
    solution: "น้ำป่าไหลหลากคือน้ำไหลแรงจากภูเขา ดินถล่มคือดินไถลลงลาดเขา การกัดเซาะชายฝั่งคือชายฝั่งถอยร่น หลุมยุบคือพื้นถล่มเหนือโพรงหินปูน ภัยแล้งคือขาดน้ำเพราะฝนน้อยนาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hazards.natural-hazards.p002
    topics: [earthscience.hazards.natural-hazards]
    difficulty: 1
    type: mcq
    stem: "น้ำท่วมถนนหน้าบ้าน น้ำไหลแรงสูงราวหน้าแข้ง น้องจะเดินลุยไปซื้อของที่ร้านฝั่งตรงข้าม ควรทำอย่างไร"
    choices:
      - { id: a, text: "ไม่เดินลุย รอให้น้ำลดหรือให้ผู้ใหญ่ช่วยหาทางที่ปลอดภัย", correct: true }
      - { id: b, text: "เดินลุยได้ เพราะน้ำไม่ถึงเข่า", feedback: "น้ำที่ไหลแรงแม้สูงแค่หน้าแข้งก็พัดคนล้มได้ และอาจมีท่อเปิด สัตว์มีพิษ หรือไฟรั่ว" }
      - { id: c, text: "ขี่จักรยานผ่านไปเร็ว ๆ", feedback: "จักรยานและรถก็ถูกน้ำไหลพัดได้ และมองไม่เห็นหลุมใต้น้ำ" }
      - { id: d, text: "เดินเกาะเสาไฟฟ้าไปเรื่อย ๆ", feedback: "เสาไฟฟ้าอาจมีไฟรั่ว อันตรายมากเมื่อตัวเปียก" }
    hints:
      - "น้ำที่ไหลมีแรงผลักมากกว่าที่เห็น"
      - "ใต้น้ำขุ่นอาจมีอะไรที่มองไม่เห็นบ้าง"
    solution: "ไม่ควรเดินหรือขับขี่ผ่านน้ำที่ไหลแรง เพราะพัดคนล้มได้ อาจมีท่อเปิด สัตว์มีพิษ และไฟรั่ว ให้รอหรือขอความช่วยเหลือจากผู้ใหญ่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hazards.natural-hazards.p003
    topics: [earthscience.hazards.natural-hazards]
    difficulty: 1
    type: text
    stem: "ระหว่างน้ำท่วม คุณตาลื่นล้มศีรษะแตกและไม่ค่อยรู้สึกตัว ควรโทรสายด่วนหมายเลขใดเพื่อเรียกรถพยาบาล"
    accepted: ["1669"]
    misconceptions:
      - { match: "1784", feedback: "1784 เป็นสายด่วนของกรมป้องกันและบรรเทาสาธารณภัย ใช้แจ้งเหตุสาธารณภัย ผู้บาดเจ็บหรือเจ็บป่วยฉุกเฉินให้โทร 1669" }
      - { match: "1182", feedback: "1182 เป็นสายด่วนของกรมอุตุนิยมวิทยา ใช้สอบถามสภาพอากาศ" }
    hints:
      - "เป็นเลข 4 หลัก ใช้เมื่อเจ็บป่วยฉุกเฉิน"
      - "ขึ้นต้นด้วย 16"
    solution: "โทร 1669 สายด่วนเจ็บป่วยฉุกเฉิน ระหว่างรอ ไม่ควรขยับศีรษะและคอของผู้บาดเจ็บถ้าไม่จำเป็น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hazards.natural-hazards.p004
    topics: [earthscience.hazards.natural-hazards]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "กรมอุตุนิยมวิทยาประกาศว่าพรุ่งนี้จะมีฝนตกหนักมากในจังหวัด และบ้านอยู่ริมแม่น้ำที่เคยท่วม ครอบครัวควรเตรียมตัวอย่างไร (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ยกของมีค่าและเครื่องใช้ไฟฟ้าขึ้นที่สูง", correct: true }
      - { id: b, text: "เตรียมกระเป๋าฉุกเฉิน มีน้ำดื่ม อาหารแห้ง ยาประจำตัว และไฟฉาย", correct: true }
      - { id: c, text: "รู้เส้นทางอพยพและจุดนัดพบของครอบครัว", correct: true }
      - { id: d, text: "รอให้น้ำเข้าบ้านก่อนจึงค่อยเตรียมของ", feedback: "เมื่อน้ำเข้าบ้านแล้วจะเตรียมได้ยากและอันตราย ควรเตรียมทันทีที่มีประกาศ" }
      - { id: e, text: "เปิดสวิตช์ไฟทุกดวงทิ้งไว้เพื่อให้สว่าง", feedback: "ควรตัดไฟเมื่อน้ำใกล้เข้าบ้าน เพื่อป้องกันไฟดูดและไฟช็อต" }
    hints:
      - "สิ่งที่ทำก่อนภัยมาถึงช่วยได้มากที่สุด"
      - "น้ำกับไฟฟ้าเป็นอันตรายเมื่ออยู่ด้วยกัน"
    solution: "ก่อนน้ำมา ให้ยกของขึ้นที่สูง เตรียมกระเป๋าฉุกเฉิน รู้เส้นทางอพยพ และเตรียมตัดไฟเมื่อน้ำใกล้เข้าบ้าน ไม่ควรรอให้น้ำเข้าบ้านก่อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hazards.natural-hazards.p005
    topics: [earthscience.hazards.natural-hazards]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "หมู่บ้านในหุบเขาจังหวัดน่าน ฝนตกหนักมาสามวัน ข้อใดเป็นสัญญาณเตือนว่าอาจเกิดน้ำป่าหรือดินถล่ม (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "น้ำในลำห้วยขุ่นเป็นสีดินและเพิ่มขึ้นเร็วผิดปกติ", correct: true }
      - { id: b, text: "ได้ยินเสียงดังอื้ออึงผิดปกติมาจากบนภูเขา", correct: true }
      - { id: c, text: "ต้นไม้และเสาไฟบนลาดเขาเริ่มเอียง พื้นดินมีรอยแตก", correct: true }
      - { id: d, text: "ฝนเพิ่งหยุดตก แปลว่าปลอดภัยแล้ว", feedback: "ดินยังอิ่มน้ำอยู่ จึงยังถล่มได้แม้ฝนหยุดแล้ว" }
      - { id: e, text: "น้ำในลำห้วยใสและไหลเบาเหมือนปกติ", feedback: "น้ำใสไหลเบาเป็นภาวะปกติ สัญญาณเตือนคือน้ำขุ่นข้นหรือเพิ่มขึ้นเร็ว" }
    hints:
      - "ดินที่ไถลลงมาทำให้น้ำในลำห้วยเปลี่ยนไปอย่างไร"
      - "ดินเริ่มเคลื่อนตัวก่อนถล่ม จะเห็นอะไรบนลาดเขา"
    solution: "สัญญาณเตือนคือ น้ำในลำห้วยขุ่นเป็นสีดินหรือเพิ่มเร็ว เสียงดังผิดปกติจากภูเขา ต้นไม้หรือเสาเอียง และดินแตกร้าว เมื่อพบให้อพยพขึ้นที่สูงที่ห่างลำห้วยทันที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hazards.natural-hazards.p006
    topics: [earthscience.hazards.natural-hazards]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการเกิดดินถล่มบนลาดเขา"
    items:
      - "ฝนตกหนักต่อเนื่องหลายวันบนลาดเขาที่ป่าถูกตัด"
      - "น้ำซึมลงไปในชั้นดินจนดินอิ่มน้ำ"
      - "ดินหนักขึ้นและยึดเกาะกันน้อยลง"
      - "ดินทั้งชั้นไถลลงตามลาดพร้อมหินและต้นไม้"
      - "ดินโคลนทับถมบ้านและถนนที่เชิงเขา"
    hints:
      - "เริ่มจากสาเหตุคือฝน"
      - "ดินต้องเปลี่ยนสมบัติก่อนจึงไถลลงมา"
    solution: "ฝนตกหนัก → น้ำซึมจนดินอิ่มน้ำ → ดินหนักขึ้นและยึดเกาะกันน้อยลง → ดินไถลลงตามลาด → ดินโคลนทับถมที่เชิงเขา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hazards.natural-hazards.p007
    topics: [earthscience.hazards.natural-hazards]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ชายฝั่งบางขุนเทียนของกรุงเทพฯ และชายฝั่งจังหวัดสมุทรปราการถูกกัดเซาะจนแนวชายฝั่งถอยร่นเข้ามา ข้อใดเป็นสาเหตุที่ทำให้การกัดเซาะรุนแรงขึ้น (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ป่าชายเลนที่เคยช่วยชะลอคลื่นถูกตัดไปทำบ่อเลี้ยงกุ้ง", correct: true }
      - { id: b, text: "ตะกอนที่แม่น้ำเคยพามาเติมชายฝั่งลดลง เพราะถูกเขื่อนกักไว้", correct: true }
      - { id: c, text: "แผ่นดินทรุดจากการสูบน้ำบาดาล", correct: true }
      - { id: d, text: "ฝนตกน้อยลงในฤดูแล้ง", feedback: "ฝนในฤดูแล้งไม่ได้เป็นสาเหตุหลัก การกัดเซาะเกิดจากคลื่นและการขาดตะกอน" }
    hints:
      - "อะไรเคยช่วยกันคลื่นและดักตะกอน"
      - "ถ้าแผ่นดินต่ำลง น้ำทะเลจะเข้ามาได้ไกลขึ้นหรือไม่"
    solution: "การกัดเซาะรุนแรงขึ้นเพราะป่าชายเลนถูกทำลาย ตะกอนจากแม่น้ำลดลงเพราะเขื่อน และแผ่นดินทรุดจากการสูบน้ำบาดาล ฝนในฤดูแล้งไม่ใช่สาเหตุหลัก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hazards.natural-hazards.p008
    topics: [earthscience.hazards.natural-hazards]
    difficulty: 3
    type: numeric
    stem: "ฝนตก 120 mm บนลุ่มน้ำพื้นที่ 5 ตารางกิโลเมตร ถ้าน้ำฝน 30% ไหลบ่าลงลำห้วย จะมีน้ำไหลบ่ากี่ลูกบาศก์เมตร"
    answer: { value: 180000, tolerance: 1000, unit: "m³" }
    misconceptions:
      - { match: 600000, feedback: "600,000 m³ คือน้ำฝนทั้งหมด ยังไม่ได้คูณสัดส่วนน้ำไหลบ่า 30%" }
      - { match: 180, feedback: "ลืมแปลงพื้นที่ 1 km² = 1,000,000 m²" }
    hints:
      - "แปลง 120 mm เป็นเมตร และ 5 km² เป็นตารางเมตร"
      - "ปริมาตรน้ำฝน = ความลึกของฝน × พื้นที่ แล้วคูณ 0.30"
    solution: "ฝน 0.12 m พื้นที่ 5,000,000 m² ปริมาตรน้ำฝน $0.12 \\times 5{,}000{,}000 = 600{,}000\\ \\mathrm{m^3}$ น้ำไหลบ่า $0.30 \\times 600{,}000 = 180{,}000\\ \\mathrm{m^3}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hazards.natural-hazards.p009
    topics: [earthscience.hazards.natural-hazards]
    difficulty: 3
    type: mcq
    stem: "พื้นที่ใดมีโอกาสเกิดหลุมยุบมากที่สุด"
    choices:
      - { id: a, text: "พื้นที่ที่มีหินปูนอยู่ใต้ดิน และมีการสูบน้ำใต้ดินจำนวนมาก", correct: true }
      - { id: b, text: "พื้นที่ที่มีหินแกรนิตแข็งอยู่ใต้ดิน", feedback: "น้ำละลายหินแกรนิตได้ยากมาก จึงไม่ค่อยเกิดโพรงใหญ่ หลุมยุบส่วนใหญ่เกิดในหินปูน" }
      - { id: c, text: "ชายหาดที่มีคลื่นแรง", feedback: "ชายหาดที่คลื่นแรงเสี่ยงการกัดเซาะชายฝั่ง ไม่ใช่หลุมยุบ" }
      - { id: d, text: "ยอดเขาสูงชันในภาคเหนือ", feedback: "ลาดเขาสูงชันเสี่ยงดินถล่ม หลุมยุบเกิดจากโพรงใต้ดิน" }
    hints:
      - "หลุมยุบเกิดเหนือโพรงใต้ดิน โพรงเกิดจากหินชนิดใด"
      - "น้ำใต้ดินช่วยพยุงเพดานโพรงไว้ ถ้าสูบออกไปจะเป็นอย่างไร"
    solution: "น้ำฝนที่เป็นกรดอ่อนละลายหินปูนจนเป็นโพรง การสูบน้ำใต้ดินมากทำให้น้ำที่ช่วยพยุงเพดานโพรงหายไป พื้นที่หินปูนที่สูบน้ำใต้ดินมากจึงเสี่ยงที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hazards.natural-hazards.p010
    topics: [earthscience.hazards.natural-hazards]
    difficulty: 3
    type: numeric
    stem: "อาสาสมัครเฝ้าระวังภัยของหมู่บ้านเชิงเขาแห่งหนึ่งวัดปริมาณฝนทุกวันได้ตามกราฟ หมู่บ้านใช้เกณฑ์ (สมมติ) ว่า ถ้าฝนสะสม 3 วัน (วันนั้นรวมกับสองวันก่อนหน้า) มากกว่า 250 mm ให้ประกาศอพยพ ต้องประกาศอพยพครั้งแรกในวันที่เท่าใด"
    figure: { src: p-rainfall.svg, alt: "กราฟแท่งปริมาณฝนรายวัน ข้อมูลสมมติ วันที่ 1 30 mm วันที่ 2 70 mm วันที่ 3 95 mm วันที่ 4 90 mm วันที่ 5 120 mm วันที่ 6 40 mm วันที่ 7 10 mm" }
    answer: { value: 4, tolerance: 0 }
    misconceptions:
      - { match: 5, feedback: "วันที่ 5 เป็นวันที่ฝนตกมากที่สุดในวันเดียว แต่เกณฑ์ใช้ฝนสะสม 3 วัน ซึ่งเกิน 250 mm ตั้งแต่วันก่อนหน้า" }
      - { match: 3, feedback: "ฝนสะสมถึงวันที่ 3 คือ 30 + 70 + 95 = 195 mm ยังไม่เกิน 250 mm" }
    hints:
      - "หาผลรวมของฝน 3 วันติดกัน โดยเริ่มที่วันที่ 3 (วันที่ 1–3)"
      - "เลื่อนไปทีละวัน วันที่ 2–4, 3–5 แล้วดูว่าเกิน 250 ครั้งแรกเมื่อใด"
    solution: "ฝนสะสม 3 วัน ถึงวันที่ 3 คือ $30 + 70 + 95 = 195$ mm ถึงวันที่ 4 คือ $70 + 95 + 90 = 255$ mm เกิน 250 mm แล้ว จึงต้องประกาศอพยพในวันที่ 4 แม้ฝนวันนั้นจะน้อยกว่าวันก่อน เพราะดินอิ่มน้ำจากฝนหลายวันรวมกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hazards.natural-hazards.p011
    topics: [earthscience.hazards.natural-hazards]
    difficulty: 3
    type: mcq
    stem: "หมู่บ้านในภาคตะวันออกเฉียงเหนือขาดน้ำทุกปีในฤดูแล้ง ข้อใดเป็นทางแก้ที่ชาวบ้านทำได้เองและช่วยได้ตรงปัญหาที่สุด"
    choices:
      - { id: a, text: "ขุดสระเก็บน้ำฝนไว้ใช้ และปลูกพืชที่ใช้น้ำน้อยในหน้าแล้ง", correct: true }
      - { id: b, text: "สร้างกำแพงกันคลื่น", feedback: "กำแพงกันคลื่นใช้แก้การกัดเซาะชายฝั่ง ไม่ช่วยเรื่องขาดน้ำ" }
      - { id: c, text: "สูบน้ำบาดาลให้มากที่สุดทุกวันโดยไม่ต้องวางแผน", feedback: "ถ้าสูบเร็วกว่าที่ฝนเติม ระดับน้ำใต้ดินจะลดลงเรื่อย ๆ บ่อแห้ง และอาจเกิดแผ่นดินทรุดหรือหลุมยุบ" }
      - { id: d, text: "ปลูกข้าวนาปรังเพิ่มในหน้าแล้ง", feedback: "ข้าวใช้น้ำมาก ยิ่งทำให้น้ำไม่พอ" }
    hints:
