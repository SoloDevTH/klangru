  - id: math.sci.p015
    topics: [math.number.scientific-notation]
    difficulty: 4
    type: numeric
    stem: "$(6.0 \\times 10^{-3}) - (4.5 \\times 10^{-4})$ เขียนในสัญกรณ์วิทยาศาสตร์ได้ $a \\times 10^{-3}$ แล้ว $a$ มีค่าเท่าใด"
    answer: { value: 5.55, tolerance: 0.001 }
    hints:
      - "$-3$ มากกว่า $-4$ ให้เปลี่ยน $4.5 \\times 10^{-4}$ เป็นรูป $\\square \\times 10^{-3}$"
      - "$4.5 \\times 10^{-4} = 0.45 \\times 10^{-3}$"
    misconceptions:
      - { match: 1.5, feedback: "ลบสัมประสิทธิ์ $6.0 - 4.5$ ทั้งที่เลขชี้กำลังต่างกัน $4.5 \\times 10^{-4}$ เล็กกว่า $6.0 \\times 10^{-3}$ มาก" }
      - { match: -39, feedback: "ดูเหมือนเปลี่ยน $4.5 \\times 10^{-4}$ เป็น $45 \\times 10^{-3}$ ซึ่งปรับผิดทิศ เลขชี้กำลังเพิ่มขึ้น 1 สัมประสิทธิ์ต้องเล็กลง 10 เท่า: $0.45 \\times 10^{-3}$" }
    solution: "$6.0 \\times 10^{-3} - 0.45 \\times 10^{-3} = 5.55 \\times 10^{-3}$ ตรวจ: $0.006 - 0.00045 = 0.00555$ ✓"
