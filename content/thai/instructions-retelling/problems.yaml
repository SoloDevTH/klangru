  difficulty: 4
  type: mcq
  stem: ครูพูดว่า *"เปิดหนังสือหน้า ๔๒ ทำข้อ ๑ ถึง ๕ ลงในสมุด"* ต้นได้ยินไม่ชัดว่าหน้าเท่าไร ต้นควรทำอย่างไร
  choices:
