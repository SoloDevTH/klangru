  - id: chemistry.practice.problem-solving.p014
    topics: [chemistry.practice.problem-solving]
    difficulty: 5
    type: numeric
    stem: "ผลิตไบโอดีเซลจากน้ำมันปาล์ม 1,000 kg (คิดเป็นไตรโอเลอิน มวลโมเลกุล 885.4) ไตรกลีเซอไรด์ 1 mol ทำปฏิกิริยากับเมทานอล 3 mol ได้ไบโอดีเซล 3 mol และกลีเซอรอล 1 mol แต่โรงงานใช้เมทานอล **6 เท่าของโมลน้ำมัน** เพื่อให้ปฏิกิริยาเกิดเกือบสมบูรณ์ ต้องใช้เมทานอลกี่กิโลกรัม (มวลโมเลกุลเมทานอล 32.04)"
    answer: { value: 217.1, unit: kg, tolerance: 2 }
    misconceptions:
      - { match: 108.6, feedback: "นี่คือปริมาณพอดีตามสมการ (3 เท่า) แต่โรงงานใช้ 6 เท่า" }
      - { match: 36.19, feedback: "ใช้อัตราส่วน 1 : 1 ต้องใช้ 6 mol ต่อน้ำมัน 1 mol" }
    hints:
      - "หาโมลของน้ำมัน 1,000 kg"
      - "โมลเมทานอล = 6 × โมลน้ำมัน แล้วคูณ 32.04"
    solution: "น้ำมัน $= 1000 \\div 885.4 = 1.129$ kmol เมทานอล $= 6 \\times 1.129 = 6.777$ kmol มวล $= 6.777 \\times 32.04 \\approx$ **217.1 kg** (เมทานอลส่วนเกินกลั่นกลับมาใช้ใหม่ได้)"
    license: CC-BY-SA-4.0
    ai_assisted: true

