    note: ป.4/3 รวมกับ health.nutrition.basics ซึ่งสอนฉลากโภชนาการและจีดีเอ หัวข้อนี้สอนฉลากอาหารตามประกาศ สธ. 367 เลขสารบบอาหาร วันควรบริโภคก่อน ฉลากยาและเครื่องสำอาง และเครื่องหมาย มอก. พร้อมโจทย์วิเคราะห์เพื่อเลือกซื้อ
  - topic: health.family.family-and-self
