topic: engineering.control.feedback-control
rows:
  - { framework: th-coe-engineering-basics, indicators: ["CHE-3.8"], coverage: partial, note: "พลศาสตร์ของกระบวนการอันดับหนึ่งมีเวลาหน่วงและการควบคุมป้อนกลับ (p008 ถึง p010, p012, p013, p016, p017) ยังไม่ครอบคลุมระบบหลายตัวแปรและกระบวนการอันดับสูง" }
  - { framework: th-coe-engineering-basics, indicators: ["ME-3.3"], coverage: partial, note: "ระบบควบคุมอัตโนมัติแบบวงปิด ตัวควบคุม PID และเสถียรภาพจากขั้ว (p001 ถึง p021) ไม่ครอบคลุม IoT หุ่นยนต์ ระบบลม และไฮดรอลิก" }
  - { framework: th-coe-engineering-basics, indicators: ["EE-3.2"], coverage: partial, note: "เฉพาะส่วนระบบควบคุมในรายการขอบเขต (แผนภาพบล็อกและฟังก์ชันถ่ายโอนวงปิด p003 ถึง p007) ไม่ครอบคลุมการสื่อสาร" }
  - { framework: abet-eac, indicators: ["Mechatronics 1"], coverage: partial, note: "ระบบควบคุมป้อนกลับและตัวควบคุม PID ในระดับแนวคิดและการคำนวณ ยังไม่มีเซนเซอร์ แอกชูเอเตอร์ หรือตัวควบคุมแบบฝังตัวในทางปฏิบัติ" }
  - { framework: abet-eac, indicators: ["Chemical 1.c"], coverage: partial, note: "การวิเคราะห์และควบคุมกระบวนการในเชิงทฤษฎี (ถังน้ำและเตาให้ความร้อนจำลอง) ไม่ครอบคลุมอันตรายของกระบวนการ" }
