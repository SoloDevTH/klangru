<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="sans-serif" font-size="15">
  <title>ต้นไม้เกมสองชั้น ราก MAX มีสองทาง ทางซ้ายไปโหนด MIN ที่มีใบ 3 และ 5 ได้ค่า 3 ทางขวาไปโหนด MIN ที่มีใบ 2 และ 9 ได้ค่า 2 ราก MAX เลือกค่ามากกว่าคือ 3 จึงเดินทางซ้าย</title>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <rect x="0" y="0" width="720" height="380" fill="#ffffff"/>
  <line x1="405.0" y1="82.0" x2="262.5" y2="148.0" stroke="#1d4ed8" stroke-width="4"/>
  <line x1="262.5" y1="192.0" x2="191.2" y2="272.0" stroke="#374151" stroke-width="1.8"/>
  <rect x="169.2" y="272.0" width="44.0" height="36.0" rx="4" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="191.2" y="297.0" font-size="17" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">3</text>
  <line x1="262.5" y1="192.0" x2="333.8" y2="272.0" stroke="#374151" stroke-width="1.8"/>
  <rect x="311.8" y="272.0" width="44.0" height="36.0" rx="4" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="333.8" y="297.0" font-size="17" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">5</text>
  <circle cx="262.5" cy="170.0" r="22" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="262.5" y="176.0" font-size="17" text-anchor="middle" fill="#b91c1c" font-weight="bold" xml:space="preserve">3</text>
  <text x="262.5" y="173.0" font-size="1" text-anchor="middle" fill="#111827" xml:space="preserve"></text>
  <line x1="405.0" y1="82.0" x2="547.5" y2="148.0" stroke="#374151" stroke-width="1.8"/>
  <line x1="547.5" y1="192.0" x2="476.2" y2="272.0" stroke="#374151" stroke-width="1.8"/>
  <rect x="454.2" y="272.0" width="44.0" height="36.0" rx="4" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="476.2" y="297.0" font-size="17" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">2</text>
  <line x1="547.5" y1="192.0" x2="618.8" y2="272.0" stroke="#374151" stroke-width="1.8"/>
  <rect x="596.8" y="272.0" width="44.0" height="36.0" rx="4" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="618.8" y="297.0" font-size="17" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">9</text>
  <circle cx="547.5" cy="170.0" r="22" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="547.5" y="176.0" font-size="17" text-anchor="middle" fill="#b91c1c" font-weight="bold" xml:space="preserve">2</text>
  <text x="547.5" y="173.0" font-size="1" text-anchor="middle" fill="#111827" xml:space="preserve"></text>
  <circle cx="405.0" cy="60.0" r="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="405.0" y="66.0" font-size="17" text-anchor="middle" fill="#1d4ed8" font-weight="bold" xml:space="preserve">3</text>
  <text x="20.0" y="58.0" font-size="15" text-anchor="start" fill="#1d4ed8" font-weight="bold" xml:space="preserve">ชั้น MAX</text>
  <text x="20.0" y="78.0" font-size="13" text-anchor="start" fill="#1d4ed8" xml:space="preserve">(คอมพิวเตอร์)</text>
  <text x="20.0" y="168.0" font-size="15" text-anchor="start" fill="#b91c1c" font-weight="bold" xml:space="preserve">ชั้น MIN</text>
  <text x="20.0" y="188.0" font-size="13" text-anchor="start" fill="#b91c1c" xml:space="preserve">(คู่แข่ง)</text>
  <text x="20.0" y="295.0" font-size="15" text-anchor="start" fill="#374151" font-weight="bold" xml:space="preserve">ท้ายเกม</text>
  <text x="360.0" y="345.0" font-size="14" text-anchor="middle" fill="#4b5563" xml:space="preserve">คะแนนท้ายเกม: มาก = ดีต่อคอมพิวเตอร์   MAX เลือกค่ามากที่สุด   MIN เลือกค่าน้อยที่สุด</text>
</svg>
