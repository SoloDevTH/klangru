id: math.stats.bivariate-data
subject: math
title: { th: ข้อมูลสองตัวแปร แผนภาพการกระจาย และตารางสองทาง, en: "Bivariate data, scatter plots and two-way tables" }
summary: สร้างและอ่านแผนภาพการกระจาย บอกทิศทาง ความแรง และรูปร่างของความสัมพันธ์ ลากเส้นแนวโน้ม ตีความความชันและจุดตัด ทำนายอย่างระวัง และแยกสหสัมพันธ์จากเหตุและผล
difficulty: 4.5
minutes: 40
prerequisites: [math.stats.data-display, math.functions.linear-graphs]
encompasses:
  - { id: math.stats.data-display, weight: 0.3 }
  - { id: math.functions.linear-graphs, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: associations.svg
    alt: "แผนภาพการกระจายสี่รูปเรียงกัน รูปแรกจุดไล่ขึ้นจากซ้ายไปขวาใกล้เส้นตรง ชื่อ ทางบวก แบบเส้นตรง รูปที่สองจุดไล่ลง ชื่อ ทางลบ แบบเส้นตรง รูปที่สามจุดกระจายทั่วไม่มีทิศทาง ชื่อ ไม่มีความสัมพันธ์ รูปที่สี่จุดเพิ่มช้าแล้วเร็วขึ้นเป็นเส้นโค้ง ชื่อ ไม่ใช่เส้นตรง (โค้ง)"
    caption: "บอกทิศทาง ความแรง และรูปร่างทุกครั้งที่อ่านแผนภาพการกระจาย"
  - { type: check, problem: math.stats.bivariate-data.p002, prompt: "ดูทิศทางก่อน แล้วดูว่าเป็นเส้นตรงหรือโค้ง" }
  - type: figure
    src: scatter-fit.svg
    alt: "แผนภาพการกระจายชั่วโมงอ่านหนังสือต่อสัปดาห์ (0 ถึง 10) กับคะแนนสอบ (0 ถึง 100) ของนักเรียน 14 คน จุดคือ (1, 42), (2, 54), (2, 45), (3, 57), (4, 62), (4, 56), (5, 71), (6, 68), (6, 75), (7, 69), (8, 83), (8, 79), (9, 89), (10, 87) มีเส้นแนวโน้ม y = 5x + 40 ผ่านกลางกลุ่มจุด และเส้นประแนวตั้งจากจุด (6, 75) ลงมาถึงเส้นที่ 70 เขียนว่า ส่วนเหลือ +5"
    caption: "เส้นแนวโน้มผ่านกลางกลุ่มจุด ส่วนเหลือคือค่าจริงลบค่าทำนาย"
  - type: worked-example
    title: ตีความเส้นแนวโน้มและทำนาย
    problem: "ใช้ $\\hat{y} = 5x + 40$ (x = ชั่วโมงอ่านต่อสัปดาห์ y = คะแนน) บอกความหมายของความชัน และทำนายคะแนนของคนที่อ่าน 7.5 ชั่วโมง"
    steps:
      - text: "ความชัน 5 มีหน่วย คะแนนต่อชั่วโมง: อ่านเพิ่ม 1 ชั่วโมงต่อสัปดาห์ สัมพันธ์กับคะแนนเพิ่มโดยเฉลี่ย 5 คะแนน"
        why: "ความชันคืออัตราการเปลี่ยนของ y ต่อ x หนึ่งหน่วย"
      - text: "จุดตัด 40: คะแนนที่ทำนายเมื่อไม่อ่านเลย"
      - text: "แทน $x = 7.5$: $\\hat{y} = 5(7.5) + 40 = 37.5 + 40 = 77.5$"
      - text: "7.5 ชั่วโมงอยู่ในช่วงข้อมูล 1–10 ชั่วโมง การทำนายจึงพอเชื่อถือได้"
        why: "ทำนายนอกช่วงข้อมูลอาจผิดมาก"
    answer: "ทำนายได้ประมาณ 77.5 คะแนน"
  - type: worked-example
    title: หาสมการเส้นแนวโน้มจากจุดบนเส้น
    problem: "นักเรียนลากเส้นแนวโน้มของข้อมูลระยะทางที่ขี่จักรยาน (กม.) กับเวลา (นาที) ผ่านจุด $(2, 30)$ และ $(10, 70)$ หาสมการของเส้น"
    steps:
      - text: "ความชัน $m = \\dfrac{70 - 30}{10 - 2} = \\dfrac{40}{8} = 5$ นาทีต่อกิโลเมตร"
        why: "ใช้สองจุดที่อยู่บนเส้น ไม่ใช่สองจุดข้อมูลใด ๆ"
      - text: "แทนจุด $(2, 30)$ ใน $y = 5x + c$: $30 = 10 + c$ จึงได้ $c = 20$"
      - text: "สมการ $\\hat{y} = 5x + 20$: ขี่เพิ่ม 1 กม. ใช้เวลาเพิ่มราว 5 นาที และ 20 นาทีอาจเป็นเวลาเตรียมตัวที่ไม่ขึ้นกับระยะทาง"
    answer: "$\\hat{y} = 5x + 20$"
  - { type: check, problem: math.stats.bivariate-data.p009, prompt: "มีตัวแปรที่สามที่ทำให้ทั้งสองอย่างเพิ่มขึ้นพร้อมกันไหม" }
glossary:
  - { term: ข้อมูลสองตัวแปร, definition: "ข้อมูลที่วัดสองตัวแปรจากหน่วยเดียวกัน เช่น ชั่วโมงอ่านกับคะแนนของนักเรียนแต่ละคน" }
  - { term: แผนภาพการกระจาย, definition: "กราฟที่วางจุด (x, y) หนึ่งจุดต่อหนึ่งหน่วยข้อมูล" }
  - { term: ความสัมพันธ์ทางบวก, definition: "เมื่อตัวแปรหนึ่งมาก อีกตัวมักมากด้วย จุดไล่ขึ้นจากซ้ายไปขวา" }
  - { term: เส้นแนวโน้ม, definition: "เส้นตรงที่ลากผ่านกลางกลุ่มจุดเพื่อสรุปความสัมพันธ์และใช้ทำนาย" }
  - { term: ส่วนเหลือ, definition: "ค่าจริงลบค่าที่เส้นทำนาย" }
  - { term: ตัวแปรแฝง, definition: "ตัวแปรที่สามที่ส่งผลต่อทั้งสองตัวแปร ทำให้ดูเหมือนสัมพันธ์กัน" }
flashcards:
  - { front: "อ่านแผนภาพการกระจายต้องบอกอะไรบ้าง", back: "ทิศทาง ความแรง รูปร่าง และค่าผิดปกติ" }
  - { front: "ความชันของเส้นแนวโน้มบอกอะไร", back: "y เปลี่ยนโดยเฉลี่ยเท่าไรเมื่อ x เพิ่ม 1 หน่วย (บอกพร้อมหน่วย)" }
  - { front: "ส่วนเหลือคำนวณอย่างไร", back: "ค่าจริง − ค่าทำนาย" }
  - { front: "สหสัมพันธ์พิสูจน์เหตุและผลได้ไหม", back: "ไม่ได้ อาจมีตัวแปรที่สาม ต้องใช้การทดลองที่ควบคุมตัวแปร" }
  - { front: "เทียบตารางสองทางอย่างไรให้ยุติธรรม", back: "ใช้ร้อยละภายในแต่ละแถว (หรือหลัก)" }
