  difficulty: 4
  type: mcq
  stem: ทำไมผู้หญิงจึงควรได้รับวัคซีนป้องกันหัดเยอรมัน (MMR) **ก่อน** ตั้งครรภ์ ไม่ใช่ระหว่างตั้งครรภ์
  choices:
  - id: a
    text: ถ้าติดหัดเยอรมันช่วงต้นของการตั้งครรภ์ ทารกเสี่ยงพิการแต่กำเนิด และ MMR เป็นวัคซีนเชื้อเป็นอ่อนฤทธิ์จึงไม่ฉีดระหว่างตั้งครรภ์
    correct: true
  - id: b
    text: เพราะหัดเยอรมันอันตรายต่อแม่เท่านั้น ไม่เกี่ยวกับทารก
    feedback: อันตรายสำคัญคือต่อทารกในครรภ์
  - id: c
    text: เพราะวัคซีนทุกชนิดห้ามฉีดระหว่างตั้งครรภ์
    feedback: วัคซีนบางชนิด เช่น บาดทะยัก (dT) และไข้หวัดใหญ่ แนะนำให้หญิงตั้งครรภ์
  - id: d
    text: เพราะ MMR ทำให้มีบุตรยาก
    feedback: ไม่มีหลักฐาน วัคซีนช่วยปกป้องการตั้งครรภ์ในอนาคต
  hints:
  - หัดเยอรมันมีผลต่อทารกอย่างไร
  - MMR เป็นวัคซีนชนิดเชื้อเป็นอ่อนฤทธิ์
  solution: หัดเยอรมันในช่วงต้นของการตั้งครรภ์ทำให้ทารกพิการได้ จึงควรมีภูมิคุ้มกันก่อนตั้งครรภ์ ส่วนวัคซีนที่แนะนำระหว่างตั้งครรภ์ เช่น บาดทะยักและไข้หวัดใหญ่ ให้ตามคำแนะนำของเจ้าหน้าที่
