    choices:
      - { id: a, text: "ให้หยุดทดสอบทันที ให้นั่งพักในที่ร่ม และรีบบอกครู ถ้าอาการไม่ดีขึ้นหรือหมดสติให้โทร 1669", correct: true }
      - { id: b, text: "เชียร์ให้ทำต่อจนครบ 3 นาที จะได้มีคะแนน", feedback: "อาการเจ็บหน้าอกและหน้ามืดเป็นสัญญาณอันตราย ต้องหยุดทันที" }
      - { id: c, text: "ให้วิ่งต่ออีกหน่อยเพื่อคลายอาการ", feedback: "การออกแรงต่ออาจทำให้อาการรุนแรงขึ้น" }
      - { id: d, text: "ไม่ต้องบอกครู เพราะเดี๋ยวก็หาย", feedback: "ครูต้องรู้เพื่อดูแลและตัดสินใจขอความช่วยเหลือทางการแพทย์" }
    hints:
      - "ความปลอดภัยสำคัญกว่าคะแนน"
      - "อาการที่หน้าอกและอาการหน้ามืดต้องให้ผู้ใหญ่ประเมิน"
    solution: "หยุดทันที นั่งพัก บอกครู และโทร 1669 ถ้าอาการรุนแรงหรือหมดสติ ผู้ที่มีโรคประจำตัวควรปรึกษาแพทย์ก่อนทดสอบหรือออกกำลังกายหนัก"
