<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" width="620" height="430" font-family="sans-serif">
<title>วิธีรับมือความขัดแย้ง 5 แบบ</title>
<rect x="0" y="0" width="620" height="430" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="310.0" y="26.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">วิธีรับมือความขัดแย้ง 5 แบบ</text>
<line x1="110.0" y1="380.0" x2="580.0" y2="380.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="110.0" y1="380.0" x2="110.0" y2="70.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="340.0" y="410.0" font-size="13" text-anchor="middle" fill="#111">ใส่ใจความต้องการของอีกฝ่าย →</text>
<text x="70" y="230.0" font-size="13" text-anchor="middle" transform="rotate(-90 70 230.0)" fill="#111">ใส่ใจความต้องการของตัวเอง →</text>
<rect x="120.0" y="93.0" width="190.0" height="64.0" rx="8" fill="#f9dede" stroke="#333" stroke-width="1.5"/>
<text x="215.0" y="119.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">เอาชนะ</text>
<text x="215.0" y="141.0" font-size="12" text-anchor="middle" fill="#333">ฉันได้ เธอเสีย</text>
<rect x="370.0" y="93.0" width="190.0" height="64.0" rx="8" fill="#eaf6e3" stroke="#333" stroke-width="1.5"/>
<text x="465.0" y="119.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">ร่วมมือ</text>
<text x="465.0" y="141.0" font-size="12" text-anchor="middle" fill="#333">หาทางที่ทุกคนได้</text>
<rect x="245.0" y="198.0" width="190.0" height="64.0" rx="8" fill="#fff4d6" stroke="#333" stroke-width="1.5"/>
<text x="340.0" y="224.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">ประนีประนอม</text>
<text x="340.0" y="246.0" font-size="12" text-anchor="middle" fill="#333">ต่างคนยอมคนละนิด</text>
<rect x="120.0" y="298.0" width="190.0" height="64.0" rx="8" fill="#eeeeee" stroke="#333" stroke-width="1.5"/>
<text x="215.0" y="324.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">หลีกเลี่ยง</text>
<text x="215.0" y="346.0" font-size="12" text-anchor="middle" fill="#333">ไม่คุย ปล่อยไว้ก่อน</text>
<rect x="370.0" y="298.0" width="190.0" height="64.0" rx="8" fill="#dcecf9" stroke="#333" stroke-width="1.5"/>
<text x="465.0" y="324.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">ยอมตาม</text>
<text x="465.0" y="346.0" font-size="12" text-anchor="middle" fill="#333">เธอได้ ฉันยอม</text>
