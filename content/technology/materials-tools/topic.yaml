id: technology.design.materials-tools
subject: technology
title:
  th: วัสดุ เครื่องมือ กลไก ไฟฟ้า และอิเล็กทรอนิกส์สำหรับงานช่าง
  en: Materials, tools, mechanisms, electricity and electronics for making
summary: เลือกวัสดุและวิธียึดให้เหมาะกับงาน ใช้เครื่องมือช่างอย่างปลอดภัย กลไก (คาน เฟือง ลูกเบี้ยว ข้อเหวี่ยง) วงจรแอลอีดีกับตัวต้านทาน และไมโครคอนโทรลเลอร์ในชิ้นงาน
difficulty: 3.5
minutes: 35
prerequisites:
- chemistry.materials.material-properties
- physics.electricity.simple-circuits
encompasses:
- id: chemistry.materials.material-properties
  weight: 0.3
- id: physics.electricity.simple-circuits
  weight: 0.3
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  title: กลไกส่งและเปลี่ยนการเคลื่อนที่
  src: mechanisms.svg
  alt: 'แผนภาพกลไกสามแบบ ซ้าย: เฟืองขับ 12 ฟันขบกับเฟืองตาม 36 ฟัน หมุนในทิศตรงข้ามกัน กลาง: ลูกเบี้ยวรูปไข่หมุนอยู่ใต้ก้านตัวตามที่มีรางนำ ทำให้ตัวตามขึ้นลง ขวา: ข้อเหวี่ยงบนจานหมุนต่อกับก้านต่อที่ดันตัวเลื่อนในรางให้เลื่อนไปมา'
- type: worked-example
  title: เลือกเฟืองทดให้ล้อหมุนตามต้องการ
  problem: มอเตอร์ของรถเข็นจำลองหมุนเร็ว 3,000 รอบต่อนาที แต่ต้องการให้ล้อหมุนประมาณ 100 รอบต่อนาทีเพื่อให้มีแรงพอบรรทุกของ ถ้าใช้เฟืองทดสองชั้น ชั้นละ 10 ฟันขับ 55 ฟัน ล้อจะหมุนกี่รอบต่อนาที
  steps:
  - text: 'ชั้นที่ 1: $10 \times 3{,}000 = 55 \times n_1$ ได้ $n_1 = \frac{30{,}000}{55} \approx 545$ รอบต่อนาที'
    why: ฟันที่ขบกันต่อนาทีของเฟืองคู่หนึ่งเท่ากัน
  - text: 'ชั้นที่ 2: $10 \times 545.5 = 55 \times n_2$ ได้ $n_2 \approx 99$ รอบต่อนาที'
  - text: ล้อหมุนราว 99 รอบต่อนาที ใกล้ 100 ตามต้องการ
    why: เฟืองทดลงทำให้ช้าลงแต่แรงบิดเพิ่มขึ้นในอัตราเดียวกันโดยประมาณ
  - text: 'ตรวจความปลอดภัย: เฟืองมีครอบกันนิ้วเข้าไปถูกหนีบ และยึดมอเตอร์กับโครงให้แน่น'
  answer: ประมาณ 99 รอบต่อนาที
- type: check
  problem: technology.design.materials-tools.p008
  prompt: ลองคำนวณกับเฟืองคู่เดียว
- type: figure
  title: วงจรแอลอีดีกับตัวต้านทาน
  src: led-circuit.svg
  alt: แผนภาพวงจรอนุกรม แหล่งจ่าย 5 V ต่อกับสวิตช์ ตัวต้านทาน R และแอลอีดีสีแดงที่ใช้ 2 V กระแส 0.02 A แล้วกลับมาที่ขั้วลบของแหล่งจ่าย
- type: worked-example
  title: วางแผนงานช่างให้ปลอดภัย
  problem: ต้องเจาะรูในแผ่นไม้อัดเพื่อติดเพลาล้อ แล้วบัดกรีสายไฟเข้ามอเตอร์ วางแผนการทำงานพร้อมมาตรการความปลอดภัย
  steps:
  - text: ร่างตำแหน่งรูด้วยดินสอและฉาก แล้วกดเหล็กหมาดทำรอยนำให้ดอกสว่านไม่ลื่น
  - text: ยึดไม้อัดด้วยปากกาจับ สวมแว่นตานิรภัย มัดผม ไม่สวมถุงมือ แล้วเจาะ
    why: ชิ้นงานที่ไม่ยึดอาจหมุนตามดอกสว่าน และถุงมืออาจถูกดึงพัน
  - text: ถอดปลั๊กสว่านก่อนเปลี่ยนดอกหรือเก็บ
  - text: 'บัดกรี: วางหัวแร้งบนแท่น เปิดหน้าต่าง ยึดมอเตอร์ไว้ แตะหัวแร้งที่จุดต่อแล้วป้อนตะกั่ว รอเย็นก่อนจับ'
  - text: 'เลิกงาน: ถอดปลั๊ก เก็บเครื่องมือ ทำความสะอาด และล้างมือ'
  answer: ทำงานตามลำดับโดยยึดชิ้นงาน สวมแว่นตา ไม่สวมถุงมือกับเครื่องหมุน และจัดการหัวแร้งอย่างปลอดภัย
- type: check
  problem: technology.design.materials-tools.p006
glossary:
- term: กลไก
  definition: ส่วนประกอบที่ส่งแรงหรือเปลี่ยนรูปแบบการเคลื่อนที่ เช่น คาน เฟือง ลูกเบี้ยว ข้อเหวี่ยง
- term: ลูกเบี้ยว
  definition: ชิ้นส่วนรูปไม่กลมที่หมุนแล้วดันตัวตามให้ขึ้นลงหรือไปมาเป็นจังหวะ
- term: อัตราทดเฟือง
  definition: ความสัมพันธ์ระหว่างจำนวนฟันกับความเร็วรอบ ฟัน × รอบ ของเฟืองที่ขบกันเท่ากัน
- term: ตัวต้านทานจำกัดกระแส
  definition: ตัวต้านทานที่ต่ออนุกรมกับแอลอีดีเพื่อไม่ให้กระแสสูงเกินจนแอลอีดีเสีย
- term: ไมโครคอนโทรลเลอร์
  definition: คอมพิวเตอร์ขนาดเล็กบนบอร์ด รับข้อมูลจากเซนเซอร์ ประมวลผลตามโปรแกรม แล้วสั่งอุปกรณ์ทำงาน
flashcards:
- front: เครื่องมือหมุน (สว่าน) ห้ามสวมอะไร
  back: ถุงมือ เสื้อผ้าหลวม เครื่องประดับ และต้องมัดผมยาว
- front: เฟืองขับ 12 ฟัน เฟืองตาม 36 ฟัน
  back: เฟืองตามหมุนช้าลง 3 เท่า แต่แรงบิดมากขึ้น
- front: ค่าตัวต้านทานของแอลอีดี
  back: R = (V แหล่ง − V แอลอีดี) ÷ I
- front: เปลี่ยนการหมุนเป็นการขึ้นลง
  back: ลูกเบี้ยวและตัวตาม หรือข้อเหวี่ยงและก้านต่อ
