  - id: math.algebra.nonlinear-systems.p018
    topics: [math.algebra.nonlinear-systems]
    difficulty: 5
    type: numeric
    stem: "ลูกบอลถูกโยนจากเชิงเนินในสนามเด็กเล่น เคลื่อนที่ตามเส้นโค้ง $y = -0.1x^2 + 2x$ ส่วนพื้นเนินเป็นทางลาดตามเส้นตรง $y = 0.5x$ ($x$ และ $y$ เป็นเมตร เริ่มที่จุดกำเนิด) ลูกบอลตกกระทบเนินที่ระยะ $x$ กี่เมตร"
    answer: { value: 15, unit: เมตร }
    hints:
      - "หาจุดตัดของเส้นโค้งกับเส้นตรงที่ไม่ใช่จุดเริ่มต้น"
      - "$-0.1x^2 + 2x = 0.5x$ ดึงตัวร่วม $x$"
    misconceptions:
      - { match: 20, feedback: "นี่คือจุดที่ลูกบอลตกถึงพื้นราบ ($y = 0$) แต่พื้นเป็นเนินลาด ต้องหาจุดตัดกับ $y = 0.5x$" }
      - { match: 0, feedback: "$x = 0$ คือจุดที่โยน โจทย์ถามจุดตกกระทบ" }
    solution: "$-0.1x^2 + 1.5x = 0$ ได้ $x(-0.1x + 1.5) = 0$ จึง $x = 0$ หรือ $x = 15$ ลูกบอลตกกระทบเนินที่ $x = 15$ เมตร สูง $y = 7.5$ เมตร"
