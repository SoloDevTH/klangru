problems:
  - id: chemistry.bonding.polarity-intermolecular.p001
    topics: [chemistry.bonding.polarity-intermolecular]
    difficulty: 1
    type: mcq
    stem: "โมเลกุลที่มี 2 อะตอมในข้อใดเป็นโมเลกุลมีขั้ว"
    choices:
      - { id: a, text: "$\\mathrm{HCl}$", correct: true, feedback: "ถูก H กับ Cl เป็นอะตอมต่างชนิด อิเล็กโทรเนกาติวิตีต่างกัน" }
      - { id: b, text: "$\\mathrm{H_2}$", feedback: "อะตอมชนิดเดียวกันดึงอิเล็กตรอนเท่ากัน จึงไม่มีขั้ว" }
      - { id: c, text: "$\\mathrm{O_2}$", feedback: "อะตอมชนิดเดียวกัน ไม่มีขั้ว แม้จะเป็นพันธะคู่" }
      - { id: d, text: "$\\mathrm{Cl_2}$", feedback: "อะตอมชนิดเดียวกัน ไม่มีขั้ว" }
    hints:
      - "โมเลกุลสองอะตอมมีขั้วเมื่ออะตอมต่างชนิดกัน"
      - "หาโมเลกุลที่ประกอบด้วยธาตุสองชนิด"
    solution: "โมเลกุลสองอะตอมของธาตุเดียวกัน ($\\mathrm{H_2}$, $\\mathrm{O_2}$, $\\mathrm{Cl_2}$) ไม่มีขั้ว ส่วน **HCl** มีอะตอมต่างชนิด Cl ดึงอิเล็กตรอนแรงกว่า จึงมีขั้ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.polarity-intermolecular.p002
    topics: [chemistry.bonding.polarity-intermolecular]
    difficulty: 2
    type: match
    stem: "จับคู่โมเลกุลกับรูปร่างตามทฤษฎี VSEPR"
    pairs:
      - { left: "$\\mathrm{CO_2}$ (2 กลุ่ม ไม่มีคู่โดดเดี่ยว)", right: "เส้นตรง" }
      - { left: "$\\mathrm{BF_3}$ (3 กลุ่ม ไม่มีคู่โดดเดี่ยว)", right: "สามเหลี่ยมแบนราบ" }
      - { left: "$\\mathrm{NH_3}$ (4 กลุ่ม คู่โดดเดี่ยว 1 คู่)", right: "พีระมิดฐานสามเหลี่ยม" }
      - { left: "$\\mathrm{SF_6}$ (6 กลุ่ม ไม่มีคู่โดดเดี่ยว)", right: "ทรงแปดหน้า" }
    hints:
      - "กลุ่มอิเล็กตรอนผลักกันให้อยู่ห่างกันมากที่สุด"
      - "คู่โดดเดี่ยวไม่ปรากฏในชื่อรูปร่าง แต่ดันพันธะให้เปลี่ยนทิศ"
    solution: "2 กลุ่ม → เส้นตรง · 3 กลุ่ม → สามเหลี่ยมแบนราบ · 4 กลุ่มที่มีคู่โดดเดี่ยว 1 คู่ → พีระมิดฐานสามเหลี่ยม · 6 กลุ่ม → ทรงแปดหน้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.polarity-intermolecular.p003
    topics: [chemistry.bonding.polarity-intermolecular]
    difficulty: 2
    type: mcq
    stem: "แก๊สหุงต้มในครัวไทยมีโพรเพนและบิวเทนเป็นส่วนใหญ่ ซึ่งเป็นโมเลกุลไม่มีขั้ว แต่ในถังที่ความดันสูงกลับเป็นของเหลวได้ แรงใดยึดโมเลกุลเหล่านี้ไว้ด้วยกัน"
    choices:
      - { id: a, text: "แรงลอนดอน", correct: true, feedback: "ถูก ขั้วชั่วคราวเกิดได้กับทุกโมเลกุลที่มีอิเล็กตรอน" }
      - { id: b, text: "แรงระหว่างขั้ว", feedback: "ต้องมีขั้วถาวร จึงเกิดเฉพาะโมเลกุลมีขั้ว" }
      - { id: c, text: "พันธะไฮโดรเจน", feedback: "ต้องมี H ต่อกับ N, O หรือ F จึงเกิดกับสารบางชนิดเท่านั้น" }
    hints:
      - "โมเลกุลไม่มีขั้วจึงไม่มีแรงระหว่างขั้วถาวร"
      - "แรงชนิดใดไม่ต้องมีขั้วถาวร"
    solution: "**แรงลอนดอน** เกิดจากขั้วชั่วคราวที่เกิดได้กับทุกโมเลกุล แม้โพรเพนและบิวเทนไม่มีขั้ว เมื่ออัดให้โมเลกุลอยู่ใกล้กันมาก แรงลอนดอนก็ยึดให้เป็นของเหลวได้ เมื่อเปิดวาล์ว ความดันลดลง ของเหลวจึงกลายเป็นแก๊สออกมา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.polarity-intermolecular.p004
    topics: [chemistry.bonding.polarity-intermolecular]
    difficulty: 2
    type: text
    stem: "แรงยึดเหนี่ยวระหว่างโมเลกุลชนิดที่แรงที่สุดระหว่างโมเลกุลน้ำด้วยกันเรียกว่าอะไร"
    accepted: ["พันธะไฮโดรเจน", "hydrogen bond", "hydrogen bonding"]
    misconceptions:
      - { match: "พันธะโคเวเลนต์", feedback: "พันธะโคเวเลนต์ O–H อยู่ภายในโมเลกุล โจทย์ถามแรงระหว่างโมเลกุล" }
      - { match: "แรงลอนดอน", feedback: "น้ำมีแรงลอนดอนด้วย แต่ไม่ใช่แรงที่แรงที่สุด" }
    hints:
      - "น้ำมี H ต่อกับ O โดยตรง"
      - "แรงนี้มีคำว่าไฮโดรเจนอยู่ในชื่อ"
    solution: "H ในน้ำต่อกับ O ซึ่งดึงอิเล็กตรอนแรง H จึงดึงดูดคู่โดดเดี่ยวบน O ของอีกโมเลกุล เรียกว่า **พันธะไฮโดรเจน**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.polarity-intermolecular.p005
    topics: [chemistry.bonding.polarity-intermolecular]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "จากสูตรโครงสร้างในภาพ สารใดเกิดพันธะไฮโดรเจนระหว่างโมเลกุลของตัวเองได้ (เลือกทุกข้อที่ถูก)"
    figure:
      src: p-h-bond-structures.svg
      alt: "สูตรโครงสร้าง 4 ชนิด A: H3C–CH2–O–H (H ทุกตัวต่อกับ C ยกเว้นตัวสุดท้ายต่อกับ O) B: H3C–O–CH3 (O อยู่ตรงกลาง H ทุกตัวต่อกับ C) C: H3C–NH2 (N ต่อกับ C และ H 2 ตัว) D: H3C–F (F ต่อกับ C และ H ทุกตัวต่อกับ C)"
    choices:
      - { id: a, text: "A", correct: true, feedback: "ถูก มี H ต่อกับ O" }
      - { id: b, text: "B", feedback: "มี O แต่ H ทุกตัวต่อกับ C ไม่มี H ที่ขั้วบวกแรงพอ" }
      - { id: c, text: "C", correct: true, feedback: "ถูก มี H ต่อกับ N" }
      - { id: d, text: "D", feedback: "มี F แต่ H ต่อกับ C ไม่ได้ต่อกับ F" }
    hints:
      - "หาว่ามี H ที่ต่อกับ N, O หรือ F โดยตรงหรือไม่"
      - "การมี O หรือ F ในโมเลกุลยังไม่พอ"
    solution: "A (เอทานอล) มี O–H และ C (เมทิลามีน) มี N–H จึงเกิดพันธะไฮโดรเจนระหว่างโมเลกุลได้ ส่วน B (ไดเมทิลอีเทอร์) และ D (ฟลูออโรมีเทน) มี H ต่อกับ C เท่านั้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.polarity-intermolecular.p006
    topics: [chemistry.bonding.polarity-intermolecular]
    difficulty: 3
    type: mcq
    stem: "$\\mathrm{CCl_4}$ และ $\\mathrm{CHCl_3}$ เป็นทรงสี่หน้าเหมือนกัน ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "$\\mathrm{CHCl_3}$ มีขั้ว แต่ $\\mathrm{CCl_4}$ ไม่มีขั้ว", correct: true, feedback: "ถูก อะตอมรอบนอกของ $\\mathrm{CHCl_3}$ ไม่เหมือนกัน ขั้วจึงไม่หักล้าง" }
      - { id: b, text: "ทั้งสองไม่มีขั้ว เพราะเป็นทรงสี่หน้าเหมือนกัน", feedback: "ทรงสี่หน้าจะไม่มีขั้วเมื่ออะตอมรอบนอกเหมือนกันทั้ง 4 อะตอมเท่านั้น" }
      - { id: c, text: "ทั้งสองมีขั้ว เพราะพันธะ C–Cl มีขั้ว", feedback: "ใน $\\mathrm{CCl_4}$ ขั้ว C–Cl ทั้งสี่ชี้ออกสมมาตรและหักล้างกันหมด" }
    hints:
      - "ดูว่าอะตอมรอบอะตอมกลางเหมือนกันทั้งหมดหรือไม่"
      - "พันธะ C–H มีขั้วน้อยกว่า C–Cl มาก"
    solution: "$\\mathrm{CCl_4}$ มี Cl 4 อะตอมเรียงสมมาตร ขั้วหักล้างกัน ไม่มีขั้ว ส่วน $\\mathrm{CHCl_3}$ มี H แทน Cl หนึ่งตัว ขั้วไม่หักล้าง จึงมีขั้ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.polarity-intermolecular.p007
    topics: [chemistry.bonding.polarity-intermolecular]
    difficulty: 3
    type: order
    stem: "เรียงแฮโลเจนตามจุดเดือดจากต่ำไปสูง"
    items:
      - "$\\mathrm{F_2}$"
      - "$\\mathrm{Cl_2}$"
      - "$\\mathrm{Br_2}$"
      - "$\\mathrm{I_2}$"
    hints:
      - "แฮโลเจนทุกตัวไม่มีขั้ว มีแต่แรงลอนดอน"
      - "แรงลอนดอนเพิ่มตามจำนวนอิเล็กตรอนและมวลโมเลกุล"
    solution: "$\\mathrm{F_2}$ (−188 °C) < $\\mathrm{Cl_2}$ (−34 °C) < $\\mathrm{Br_2}$ (59 °C) < $\\mathrm{I_2}$ (184 °C) โมเลกุลใหญ่ขึ้น อิเล็กตรอนมากขึ้น แรงลอนดอนแรงขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.polarity-intermolecular.p008
    topics: [chemistry.bonding.polarity-intermolecular]
    difficulty: 3
    type: mcq
    stem: "เอทานอลกับไดเมทิลอีเทอร์มีสูตรโมเลกุล $\\mathrm{C_2H_6O}$ เหมือนกัน แต่เอทานอลเดือดที่ 78 °C ส่วนไดเมทิลอีเทอร์เดือดที่ −24 °C เพราะเหตุใด"
    choices:
      - { id: a, text: "เอทานอลมี O–H จึงเกิดพันธะไฮโดรเจนระหว่างโมเลกุล ส่วนไดเมทิลอีเทอร์ไม่มี", correct: true, feedback: "ถูก มวลเท่ากัน ความต่างมาจากชนิดของแรงระหว่างโมเลกุล" }
      - { id: b, text: "เอทานอลมีมวลโมเลกุลมากกว่า", feedback: "สูตรโมเลกุลเหมือนกัน มวลโมเลกุลจึงเท่ากันพอดี" }
      - { id: c, text: "พันธะโคเวเลนต์ในเอทานอลแข็งแรงกว่า จึงต้องใช้พลังงานมากกว่าในการเดือด", feedback: "การเดือดไม่ได้ทำลายพันธะโคเวเลนต์ในโมเลกุล" }
    hints:
      - "มวลเท่ากัน จึงต้องดูที่ชนิดของแรงระหว่างโมเลกุล"
      - "สารใดมี H ต่อกับ O"
    solution: "สองสารมีมวลเท่ากัน แต่เอทานอลมีหมู่ O–H จึงสร้างพันธะไฮโดรเจนระหว่างโมเลกุล ต้องใช้พลังงานมากกว่าจึงจะแยกโมเลกุลออกจากกัน จุดเดือดจึงสูงกว่ามาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.polarity-intermolecular.p009
    topics: [chemistry.bonding.polarity-intermolecular]
    difficulty: 3
    type: mcq
    stem: "เมื่อต้มน้ำจนเดือดกลายเป็นไอ สิ่งใดถูกทำลาย"
    choices:
      - { id: a, text: "พันธะไฮโดรเจนระหว่างโมเลกุลน้ำ", correct: true, feedback: "ถูก ไอน้ำยังเป็นโมเลกุล $\\mathrm{H_2O}$ ครบทุกอะตอม" }
      - { id: b, text: "พันธะโคเวเลนต์ O–H ภายในโมเลกุล", feedback: "ถ้าพันธะ O–H ขาด จะได้แก๊สไฮโดรเจนและออกซิเจน ไม่ใช่ไอน้ำ" }
      - { id: c, text: "ทั้งพันธะไฮโดรเจนและพันธะ O–H", feedback: "การเดือดเป็นการเปลี่ยนสถานะ โมเลกุลน้ำยังอยู่ครบ" }
    hints:
      - "ไอน้ำที่ควบแน่นกลับมาเป็นน้ำชนิดเดิมหรือไม่"
      - "การเปลี่ยนสถานะแยกโมเลกุลออกจากกัน ไม่ได้แยกอะตอมในโมเลกุล"
    solution: "การเดือดแยกโมเลกุลน้ำออกจากกัน โดยทำลาย **แรงระหว่างโมเลกุล** (ส่วนใหญ่เป็นพันธะไฮโดรเจน) ส่วนพันธะ O–H ในโมเลกุลยังอยู่ ไอน้ำจึงยังเป็น $\\mathrm{H_2O}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.polarity-intermolecular.p010
    topics: [chemistry.bonding.polarity-intermolecular]
    difficulty: 4
    type: mcq
    stem: "จากกราฟจุดเดือดของสารประกอบไฮโดรเจน สารในหมู่ 14 มีจุดเดือดเพิ่มขึ้นตามคาบอย่างสม่ำเสมอ แต่ $\\mathrm{H_2O}$ เดือดที่ 100 °C สูงกว่า $\\mathrm{H_2S}$ (−60 °C) มาก ทั้งที่มวลน้อยกว่า ข้อใดอธิบายได้ถูกต้อง"
    choices:
      - { id: a, text: "O มีอิเล็กโทรเนกาติวิตีสูงและอะตอมเล็ก น้ำจึงเกิดพันธะไฮโดรเจน ส่วน $\\mathrm{H_2S}$ มีเพียงแรงระหว่างขั้วและแรงลอนดอน", correct: true, feedback: "ถูก พันธะไฮโดรเจนเกิดกับ N, O, F เท่านั้น" }
      - { id: b, text: "$\\mathrm{H_2O}$ มีแรงลอนดอนมากกว่าเพราะมวลน้อยกว่า", feedback: "แรงลอนดอนเพิ่มตามมวล $\\mathrm{H_2S}$ จึงมีแรงลอนดอนมากกว่า" }
      - { id: c, text: "$\\mathrm{H_2S}$ ไม่มีขั้วเพราะเป็นเส้นตรง", feedback: "$\\mathrm{H_2S}$ เป็นมุมงอเหมือนน้ำและมีขั้ว แต่ไม่เกิดพันธะไฮโดรเจน" }
    hints:
      - "หมู่ 14 ไม่มีคู่โดดเดี่ยวบนอะตอมกลางและไม่เกิดพันธะไฮโดรเจน"
      - "ธาตุใดบ้างที่ทำให้เกิดพันธะไฮโดรเจนได้"
    solution: "โมเลกุลน้ำมี H ต่อกับ O ซึ่งดึงอิเล็กตรอนแรงและอะตอมเล็ก จึงเกิดพันธะไฮโดรเจนที่แรงกว่าแรงระหว่างขั้วใน $\\mathrm{H_2S}$ มาก ส่วนหมู่ 14 ไม่มีพันธะไฮโดรเจน จุดเดือดจึงเพิ่มตามมวลอย่างเดียว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.polarity-intermolecular.p011
    topics: [chemistry.bonding.polarity-intermolecular]
    difficulty: 4
    type: order
    stem: "เรียงสารประกอบไฮโดรเจนของหมู่ 17 ตามจุดเดือดจากต่ำไปสูง"
    items:
      - "HCl"
      - "HBr"
      - "HI"
      - "HF"
    hints:
      - "HCl, HBr, HI ไม่มีพันธะไฮโดรเจน จุดเดือดเพิ่มตามมวล"
      - "HF มีพันธะไฮโดรเจน"
    solution: "HCl (−85 °C) < HBr (−67 °C) < HI (−35 °C) < HF (20 °C) สามตัวแรกเรียงตามแรงลอนดอนที่เพิ่มตามมวล ส่วน HF เบาที่สุดแต่เดือดสูงสุดเพราะพันธะไฮโดรเจน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.polarity-intermolecular.p012
    topics: [chemistry.bonding.polarity-intermolecular]
    difficulty: 4
    type: mcq
    stem: "เมทานอลและเอทานอลผสมกับน้ำได้ทุกอัตราส่วน แต่ 1-บิวทานอลละลายได้ราว 8 g ต่อน้ำ 100 g และ 1-เฮกซานอลละลายได้ไม่ถึง 1 g ข้อใดอธิบายได้ดีที่สุด"
    choices:
