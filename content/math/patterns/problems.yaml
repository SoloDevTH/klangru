problems:
  - id: math.algebra.patterns.p001
    topics: [math.algebra.patterns]
    difficulty: 1
    type: numeric
    stem: "หาจำนวนที่แทน $\\square$ ในแบบรูป 41, 42, 43, $\\square$, 45"
    answer: { value: 44 }
    hints:
      - "จำนวนเพิ่มขึ้นทีละเท่าไร"
      - "จำนวนที่อยู่ระหว่าง 43 กับ 45"
    misconceptions:
      - { match: 46, feedback: "46 คือจำนวนที่อยู่ถัดจาก 45 ช่องว่างอยู่ก่อน 45" }
    solution: "แบบรูปเพิ่มทีละ 1 ถัดจาก 43 คือ 44 และ $44 + 1 = 45$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.patterns.p002
    topics: [math.algebra.patterns]
    difficulty: 1
    type: mcq
    stem: "รูปใดควรอยู่ในกรอบเครื่องหมาย ? ของแบบรูปซ้ำนี้"
    figure: { src: missing-shape.svg, alt: "รูปห้ารูปเรียงเป็นแถว วงกลม สามเหลี่ยม วงกลม สามเหลี่ยม วงกลม แล้วตามด้วยกรอบเส้นประที่มีเครื่องหมาย ?" }
    choices:
      - { id: a, text: "สามเหลี่ยม", correct: true }
      - { id: b, text: "วงกลม", feedback: "รูปสุดท้ายก่อนกรอบเป็นวงกลม ในแบบรูปนี้หลังวงกลมเป็นสามเหลี่ยมเสมอ" }
      - { id: c, text: "สี่เหลี่ยม", feedback: "แบบรูปนี้มีแค่วงกลมกับสามเหลี่ยม ไม่มีสี่เหลี่ยมเลย" }
    hints:
      - "ชุดที่ซ้ำมีกี่รูป"
      - "ชุดที่ซ้ำคือ วงกลม สามเหลี่ยม ดูว่ารูปก่อนกรอบเป็นรูปอะไร"
    solution: "ชุดที่ซ้ำคือ วงกลม สามเหลี่ยม รูปก่อนกรอบเป็นวงกลม รูปถัดไปจึงเป็นสามเหลี่ยม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.patterns.p003
    topics: [math.algebra.patterns]
    difficulty: 1
    type: numeric
    stem: "หาจำนวนที่แทน $\\square$ ในแบบรูป 90, 80, 70, $\\square$, 50"
    answer: { value: 60 }
    hints:
      - "แบบรูปเพิ่มขึ้นหรือลดลง ทีละเท่าไร"
      - "ลดทีละ 10 จาก 70"
    misconceptions:
      - { match: 69, feedback: "ลดทีละ 1 แต่ 90 ไป 80 ลดลง 10" }
    solution: "แบบรูปลดทีละ 10: $70 - 10 = 60$ และ $60 - 10 = 50$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.patterns.p004
    topics: [math.algebra.patterns]
    difficulty: 2
    type: numeric
    stem: "นับเพิ่มทีละ 5: 15, 20, 25, 30, $\\square$ จำนวนถัดไปคือเท่าไร"
    answer: { value: 35 }
    hints:
      - "นับเพิ่มทีละ 5"
      - "$30 + 5$"
    misconceptions:
      - { match: 31, feedback: "เพิ่มทีละ 1 แต่แบบรูปนี้เพิ่มทีละ 5" }
    solution: "$30 + 5 = 35$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.patterns.p005
    topics: [math.algebra.patterns]
    difficulty: 2
    type: mcq
    stem: "ธงประดับงานวันเด็กเรียงสีเป็น แดง เหลือง เหลือง แดง เหลือง เหลือง แดง เหลือง เหลือง … ชุดที่ซ้ำคือข้อใด"
    choices:
      - { id: a, text: "แดง เหลือง เหลือง", correct: true }
      - { id: b, text: "แดง เหลือง", feedback: "ถ้าซ้ำแค่ แดง เหลือง จะได้ แดง เหลือง แดง เหลือง แต่ธงจริงมีเหลืองติดกันสองผืน" }
      - { id: c, text: "แดง เหลือง เหลือง แดง", feedback: "แดงผืนที่สองเป็นการเริ่มชุดใหม่แล้ว ชุดที่ซ้ำคือกลุ่มที่สั้นที่สุด" }
    hints:
      - "หาว่าแดงกลับมาอีกครั้งที่ผืนที่เท่าไร"
      - "ตรวจว่ากลุ่มที่เลือกต่อกันแล้วได้ลำดับสีเหมือนโจทย์"
    solution: "แดงกลับมาที่ผืนที่ 4 ชุดที่ซ้ำจึงเป็นสามผืนแรก แดง เหลือง เหลือง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.patterns.p006
    topics: [math.algebra.patterns]
    difficulty: 2
    type: numeric
    stem: "หาจำนวนที่แทน $\\square$ ในแบบรูป 64, 61, 58, $\\square$, 52"
    answer: { value: 55 }
    hints:
      - "หาผลต่างของ 64 กับ 61"
      - "แบบรูปลดลงทีละ 3"
    misconceptions:
      - { match: 61, feedback: "บวก 3 แต่แบบรูปนี้ลดลง ($64 \\to 61$)" }
    solution: "แบบรูปลดทีละ 3: $58 - 3 = 55$ และ $55 - 3 = 52$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.patterns.p007
    topics: [math.algebra.patterns]
    difficulty: 2
    type: order
    stem: "เรียงจำนวนให้เป็นแบบรูปที่เพิ่มขึ้นทีละ 100 (จากน้อยไปมาก)"
    items: ["145", "245", "345", "445", "545"]
    hints:
      - "เพิ่มทีละ 100 คือหลักร้อยเพิ่มขึ้น 1"
      - "หลักสิบและหลักหน่วยไม่เปลี่ยน"
    solution: "145, 245, 345, 445, 545 หลักร้อยเพิ่มทีละ 1 ส่วน 45 คงเดิม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.patterns.p008
    topics: [math.algebra.patterns]
    difficulty: 3
    type: mcq
    stem: "ป้าวางกระถางดาวเรืองหน้าบ้านเป็นแถว สีส้ม เหลือง ส้ม เหลือง ไปเรื่อย ๆ กระถางที่ 15 เป็นสีอะไร"
    choices:
      - { id: a, text: "สีส้ม", correct: true }
      - { id: b, text: "สีเหลือง", feedback: "สีเหลืองอยู่ที่กระถาง 2, 4, 6, … ซึ่งเป็นจำนวนคู่ แต่ 15 เป็นจำนวนคี่" }
    hints:
      - "ชุดที่ซ้ำมี 2 กระถาง"
      - "กระถางที่ 1, 3, 5, … เป็นสีเดียวกัน 15 อยู่ในกลุ่มไหน"
    solution: "ครบ 7 ชุดได้ 14 กระถาง กระถางที่ 15 เริ่มชุดใหม่ จึงเป็นสีส้ม (กระถางลำดับคี่เป็นสีส้มทุกกระถาง)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.patterns.p009
    topics: [math.algebra.patterns]
    difficulty: 3
    type: numeric
    stem: "ต่อบ้านด้วยไม้ขีดตามแบบรูปในภาพ รูปที่ 5 ใช้ไม้ขีดกี่ก้าน (ตอบเป็นจำนวนก้าน)"
    figure: { src: matchstick-houses.svg, alt: "แบบรูปบ้านจากไม้ขีด บ้านแต่ละหลังเป็นรูปห้าเหลี่ยม มีผนังสองข้าง พื้นหนึ่งก้าน และหลังคาสองก้าน รวม 5 ก้าน รูปที่ 1 มีบ้าน 1 หลัง รูปที่ 2 มีบ้าน 2 หลังติดกันใช้ผนังตรงกลางร่วมกัน รูปที่ 3 มีบ้าน 3 หลังติดกันใช้ผนังร่วมกัน" }
    answer: { value: 21, unit: ก้าน }
    hints:
      - "นับไม้ของรูปที่ 1, 2, 3 แล้วดูว่าเพิ่มทีละเท่าไร"
      - "บ้านหลังใหม่ใช้ผนังร่วมกับหลังเดิม จึงเพิ่มน้อยกว่า 5 ก้าน ทำตารางต่อไปจนถึงรูปที่ 5"
    misconceptions:
      - { match: 25, feedback: "คิดว่าบ้านทุกหลังใช้ 5 ก้าน แต่บ้านที่ติดกันใช้ผนังร่วมกัน" }
      - { match: 20, feedback: "คิดว่าบ้านละ 4 ก้าน แต่ลืมผนังก้านแรกทางซ้ายสุด" }
    solution: "รูปที่ 1, 2, 3 ใช้ 5, 9, 13 ก้าน เพิ่มทีละ 4 รูปที่ 4 ใช้ 17 ก้าน รูปที่ 5 ใช้ 21 ก้าน (กฎ: รูปที่ × 4 + 1)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.patterns.p010
    topics: [math.algebra.patterns]
    difficulty: 3
    type: match
    stem: "จับคู่แบบรูปกับกฎของแบบรูป"
    pairs:
      - { left: "3, 6, 9, 12", right: "เพิ่มทีละ 3" }
      - { left: "40, 36, 32, 28", right: "ลดทีละ 4" }
      - { left: "2, 4, 8, 16", right: "คูณ 2 ทุกครั้ง" }
      - { left: "5, 10, 15, 20", right: "เพิ่มทีละ 5" }
      - { left: "100, 90, 80, 70", right: "ลดทีละ 10" }
    hints:
      - "หาผลต่างของจำนวนที่อยู่ติดกันทุกคู่"
      - "ถ้าผลต่างไม่เท่ากัน ลองดูว่าคูณด้วยจำนวนเดิมหรือไม่"
    solution: "3, 6, 9, 12 เพิ่มทีละ 3; 40 ไป 28 ลดทีละ 4; 2, 4, 8, 16 ผลต่างเป็น 2, 4, 8 ไม่เท่ากัน แต่คูณ 2 ทุกครั้ง; 5, 10, 15, 20 เพิ่มทีละ 5; 100 ไป 70 ลดทีละ 10"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.patterns.p011
    topics: [math.algebra.patterns]
    difficulty: 3
    type: numeric
    stem: "น้องฝนหยอดกระปุกออมสิน วันแรก 5 บาท แล้วแต่ละวันหยอดมากกว่าวันก่อน 2 บาท วันที่ 6 น้องฝนหยอดกี่บาท (ตอบในหน่วยบาท)"
    answer: { value: 15, unit: บาท }
    hints:
      - "เขียนเงินของแต่ละวัน: วันที่ 1 ได้ 5 บาท วันที่ 2 ได้ 7 บาท"
      - "นับเพิ่มทีละ 2 ไปจนถึงวันที่ 6"
    misconceptions:
      - { match: 17, feedback: "บวก 2 ไป 6 ครั้ง แต่จากวันที่ 1 ถึงวันที่ 6 เพิ่มแค่ 5 ครั้ง" }
      - { match: 12, feedback: "คิดเป็น $6 \\times 2$ แต่วันแรกเริ่มที่ 5 บาท ไม่ใช่ 2 บาท" }
    solution: "5, 7, 9, 11, 13, 15 วันที่ 6 หยอด 15 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.patterns.p012
    topics: [math.algebra.patterns]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "แบบรูปเริ่มที่ 1 แล้วบวกทีละ 3 ไปเรื่อย ๆ (1, 4, 7, 10, …) ข้อใดถูก (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "จำนวนเป็นคี่ คู่ สลับกัน", correct: true }
      - { id: b, text: "จำนวนถัดจาก 16 คือ 19", correct: true }
      - { id: c, text: "ทุกจำนวนเป็นจำนวนคี่", feedback: "4 และ 10 เป็นจำนวนคู่ การบวก 3 (จำนวนคี่) ทำให้คี่กับคู่สลับกัน" }
      - { id: d, text: "50 อยู่ในแบบรูปนี้", feedback: "ไล่ต่อไปจะได้ …, 46, 49, 52 ข้าม 50 ไป (50 − 1 = 49 หารด้วย 3 ไม่ลงตัว)" }
    hints:
      - "เขียนต่อไปอีกหลายจำนวน: 1, 4, 7, 10, 13, 16, …"
      - "คี่บวกคี่ได้คู่ คู่บวกคี่ได้คี่"
    solution: "1, 4, 7, 10, 13, 16, 19 คี่กับคู่สลับกัน ถัดจาก 16 คือ 19 ทุกจำนวนมากกว่าพหุคูณของ 3 อยู่ 1 แต่ 50 = 48 + 2 จึงไม่อยู่ในแบบรูป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.patterns.p013
    topics: [math.algebra.patterns]
    difficulty: 4
    type: mcq
    stem: "ผลคูณในสูตรคูณแม่ 4 (4, 8, 12, 16, …) เป็นจำนวนคู่ทุกจำนวน เหตุผลใดถูกต้อง"
    choices:
      - { id: a, text: "4 คูณจำนวนใดก็ตาม แยกเป็นสองส่วนเท่ากันได้เสมอ เช่น $4 \\times 7 = 14 + 14$", correct: true }
      - { id: b, text: "เพราะจำนวนที่นำมาคูณกับ 4 เป็นจำนวนคู่ทุกตัว", feedback: "$4 \\times 3 = 12$ จำนวนที่คูณ (3) เป็นคี่ แต่ผลคูณยังเป็นคู่ เหตุผลนี้จึงไม่ใช่" }
      - { id: c, text: "เพราะผลคูณทุกจำนวนเป็นจำนวนคู่", feedback: "$3 \\times 5 = 15$ เป็นจำนวนคี่ ผลคูณไม่ได้เป็นคู่เสมอ" }
    hints:
      - "จำนวนคู่คือจำนวนที่แบ่งเป็นสองส่วนเท่ากันได้"
      - "4 กลุ่ม แบ่งเป็น 2 กลุ่ม กับ 2 กลุ่ม ได้เสมอ"
    solution: "$4 \\times n$ คือ $n$ สี่กลุ่ม แบ่งเป็นสองกองกองละ $n$ สองกลุ่มได้เท่ากันเสมอ ผลคูณจึงเป็นจำนวนคู่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.patterns.p014
    topics: [math.algebra.patterns]
    difficulty: 4
    type: numeric
    stem: "แบบรูป 2, 5, 8, 11, … เพิ่มทีละ 3 จำนวนที่ 20 ของแบบรูปนี้คือเท่าไร"
    answer: { value: 59 }
    hints:
      - "จากจำนวนที่ 1 ไปถึงจำนวนที่ 20 ต้องบวก 3 กี่ครั้ง"
      - "บวก 3 จำนวน 19 ครั้ง เริ่มจาก 2"
    misconceptions:
      - { match: 62, feedback: "บวก 3 จำนวน 20 ครั้ง แต่จากจำนวนที่ 1 ถึงจำนวนที่ 20 บวกแค่ 19 ครั้ง" }
      - { match: 60, feedback: "คิดเป็น $20 \\times 3$ แต่แบบรูปไม่ได้เริ่มที่ 3 ลองตรวจกับจำนวนที่ 1" }
    solution: "จำนวนที่ 20 = $2 + 19 \\times 3 = 2 + 57 = 59$ (ตรวจกับกฎ: จำนวนที่ $n$ = $3n - 1$, $3 \\times 20 - 1 = 59$ ✓)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.patterns.p015
    topics: [math.algebra.patterns]
    difficulty: 4
    type: numeric
    stem: "แบบรูป ก เริ่มที่ 0 บวกทีละ 4 แบบรูป ข เริ่มที่ 0 บวกทีละ 8 เมื่อแบบรูป ก เป็น 28 จำนวนที่อยู่ลำดับเดียวกันในแบบรูป ข คือเท่าไร"
    answer: { value: 56 }
    hints:
      - "เขียนสองแบบรูปเป็นตารางคู่กัน: (0, 0), (4, 8), (8, 16), …"
      - "เทียบจำนวนในลำดับเดียวกัน ข เป็นกี่เท่าของ ก"
    misconceptions:
      - { match: 36, feedback: "บวก 8 กับ 28 แต่ต้องหาจำนวนในลำดับเดียวกัน ไม่ใช่จำนวนถัดไป" }
      - { match: 32, feedback: "บวก 4 กับ 28 ได้จำนวนถัดไปของแบบรูป ก แต่โจทย์ถามแบบรูป ข" }
    solution: "ก: 0, 4, 8, …, 28 (28 อยู่หลัง 0 ไป 7 ครั้ง) ข ลำดับเดียวกัน: $7 \\times 8 = 56$ หรือเห็นว่า ข เป็นสองเท่าของ ก เสมอ $2 \\times 28 = 56$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.patterns.p016
    topics: [math.algebra.patterns]
    difficulty: 5
    type: numeric
    stem: "ต่อสามเหลี่ยมด้วยไม้จิ้มฟันเรียงเป็นแถว โดยสามเหลี่ยมที่ติดกันใช้ด้านร่วมกัน สามเหลี่ยม 1 รูปใช้ 3 อัน 2 รูปใช้ 5 อัน 3 รูปใช้ 7 อัน ถ้ามีไม้จิ้มฟัน 41 อัน ต่อสามเหลี่ยมแบบนี้ได้กี่รูป (ใช้ไม้หมดพอดี)"
    answer: { value: 20, unit: รูป }
    hints:
      - "สามเหลี่ยมรูปใหม่ใช้ไม้เพิ่มกี่อัน"
      - "เขียนกฎ: จำนวนไม้ = จำนวนรูป × 2 + 1 แล้วย้อนกลับจาก 41"
    misconceptions:
      - { match: 13, feedback: "หาร 41 ด้วย 3 แต่สามเหลี่ยมใช้ด้านร่วมกัน รูปใหม่ใช้ไม้เพิ่มแค่ 2 อัน" }
      - { match: 20.5, feedback: "หาร 41 ด้วย 2 แต่ต้องหักไม้อันแรกที่เป็นจุดเริ่มต้นออกก่อน" }
    solution: "จำนวนไม้ = จำนวนรูป × 2 + 1 ดังนั้น จำนวนรูป × 2 = 41 − 1 = 40 ได้ 20 รูป ตรวจ: $20 \\times 2 + 1 = 41$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algebra.patterns.p017
    topics: [math.algebra.patterns]
