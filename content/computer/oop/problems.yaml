  - id: computer.programming.oop.p014
    topics: [computer.programming.oop]
    difficulty: 5
    type: numeric
    stem: |
      บัญชีนักเรียนของธนาคารโรงเรียนสืบทอดจาก `Account` ในบทเรียน (ถอนเกินยอดเงินไม่ได้) และถอนได้ครั้งละไม่เกิน 100 บาท โปรแกรมนี้แสดงตัวเลขใด

      ```python
      class StudentAccount(Account):
          def withdraw(self, amount):
              if amount > 100:
                  return False
              return super().withdraw(amount)

      s = StudentAccount("ชูใจ", 250)
      s.withdraw(120)
      s.withdraw(100)
      s.deposit(30)
      s.withdraw(90)
      s.withdraw(100)
      print(s.balance)
      ```
    answer: { value: 90, unit: "บาท" }
    hints:
      - "ไล่ยอดเงินทีละบรรทัด ทุกครั้งที่ถอนต้องผ่านสองเงื่อนไข คือไม่เกิน 100 และไม่เกินยอดเงิน"
      - "super().withdraw(amount) คือ withdraw ของ Account ซึ่งตรวจยอดเงินก่อนหัก"
    misconceptions:
      - { match: 60, feedback: "ลืมว่า StudentAccount เขียน withdraw ใหม่ การถอน 120 จึงไม่ผ่าน" }
      - { match: -10, feedback: "การถอน 100 ครั้งสุดท้ายไม่ผ่าน เพราะ Account.withdraw ไม่ยอมให้ถอนเกินยอด 90 บาท" }
    solution: "250 → ถอน 120 ไม่ได้ (เกิน 100) → ถอน 100 เหลือ 150 → ฝาก 30 เป็น 180 → ถอน 90 เหลือ 90 → ถอน 100 ผ่านเงื่อนไขแรก แต่ Account.withdraw พบว่า 100 > 90 จึงไม่ถอน ยอดสุดท้าย 90 บาท"
