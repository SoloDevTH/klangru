<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" font-family="sans-serif" font-size="15">
  <title>ป้ายหนัก 100 N แขวนด้วยเชือกสองเส้นทำมุม 30 และ 60 องศากับเพดาน พร้อมสามเหลี่ยมแรง</title>
  <rect x="0" y="0" width="600" height="300" fill="#ffffff"/>
  <rect x="39.5" y="26" width="314" height="14" rx="0" fill="#e4e1d8" stroke="#15211e" stroke-width="1.5"/>
  <line x1="69.5" y1="40" x2="260" y2="150" stroke="#15211e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="323.5" y1="40" x2="260" y2="150" stroke="#15211e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="260" y1="150" x2="260" y2="200" stroke="#15211e" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="205" y="200" width="110" height="50" rx="0" fill="#f5e6c8" stroke="#15211e" stroke-width="2"/>
  <text x="260" y="231" font-size="15" text-anchor="middle" font-weight="bold">100 N</text>
  <path d="M 104.1 60 A 40 40 0 0 0 109.5 40" fill="none" stroke="#15211e" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="125.6" y="60" font-size="14" text-anchor="middle">30°</text>
  <path d="M 283.5 40 A 40 40 0 0 0 303.5 74.6" fill="none" stroke="#15211e" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="272.7" y="73" font-size="14" text-anchor="middle">60°</text>
  <text x="146.7" y="113" font-size="15" fill="#0a6b60" font-weight="bold">T₁</text>
  <text x="303.8" y="105" font-size="15" fill="#b4521f" font-weight="bold">T₂</text>
  <line x1="520" y1="70" x2="520" y2="219" stroke="#15211e" stroke-width="2.5" stroke-linecap="round"/><polygon points="520,230 515,219 525,219" fill="#15211e" stroke="#15211e" stroke-width="1" stroke-linejoin="round"/>
  <line x1="520" y1="230" x2="460.2" y2="195.5" stroke="#0a6b60" stroke-width="2.5" stroke-linecap="round"/><polygon points="450.7,190 462.7,191.2 457.8,199.8" fill="#0a6b60" stroke="#0a6b60" stroke-width="1" stroke-linejoin="round"/>
  <line x1="450.7" y1="190" x2="514.5" y2="79.5" stroke="#b4521f" stroke-width="2.5" stroke-linecap="round"/><polygon points="520,70 518.8,82 510.2,77.1" fill="#b4521f" stroke="#b4521f" stroke-width="1" stroke-linejoin="round"/>
  <text x="528" y="150" font-size="15" font-weight="bold">W</text>
  <text x="481.4" y="230" font-size="15" fill="#0a6b60" font-weight="bold">T₁</text>
  <text x="463.4" y="130" font-size="15" fill="#b4521f" font-weight="bold">T₂</text>
  <text x="490" y="285" font-size="13" fill="#6b7472" text-anchor="middle">สามเหลี่ยมแรงปิดพอดี</text>
</svg>
