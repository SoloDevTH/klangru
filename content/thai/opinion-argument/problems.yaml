  - การสำรวจของชมรมจักรยานพบว่า 38 คนจาก 50 คนต้องซ่อมจักรยานในภาคเรียนที่แล้ว
  - แม้หลังคาจะมีค่าใช้จ่าย แต่ใช้แผ่นหลังคาเหลือจากการซ่อมอาคารได้
  - จึงขอเสนอให้สภานักเรียนนำเรื่องนี้เข้าที่ประชุมเดือนหน้า
