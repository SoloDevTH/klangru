      - university-foundations:CHEM 12.6
      - university-foundations:CHEM 12.7
    scope: >-
      สมการของอาร์เรเนียส k = Ae^(−Ea/RT) แฟกเตอร์ความถี่และทิศทางการชน หา Ea จากกราฟ ln k กับ 1/T และจากค่า k สองอุณหภูมิ
      กลไกปฏิกิริยา ปฏิกิริยาขั้นมูลฐานและโมเลกุลาริตี สารมัธยันตร์ ขั้นกำหนดอัตรา ตรวจกลไกกับกฎอัตราที่วัดได้ ตัวเร่งเอกพันธุ์และวิวิธพันธุ์
      (เครื่องฟอกไอเสียรถยนต์ กระบวนการฮาเบอร์) แผนภาพพลังงานของปฏิกิริยาที่มีและไม่มีตัวเร่ง และเอนไซม์เป็นตัวเร่งทางชีวภาพ
  # ---------- เคมี: สมดุลกรด-เบส การละลาย และอุณหพลศาสตร์ ----------
  # ลำดับ 3
  - id: chemistry.acids-bases.polyprotic-lewis-complex
    title: กรดหลายโปรตอน กรด-เบสลิวอิส และการเกิดไอออนเชิงซ้อน
    difficulty: 7.5
    prereq: [chemistry.acids-bases.titration-buffers]
    indicators:
      - university-foundations:CHEM 14.5
      - university-foundations:CHEM 15.2
    scope: >-
      กรดหลายโปรตอน (H₂CO₃ H₃PO₄ H₂SO₄) การแตกตัวทีละขั้น K_a1 ≫ K_a2 การคำนวณ pH ที่ขั้นแรกครอบงำ และสัดส่วนของแต่ละสปีชีส์กับ pH
      กราฟการไทเทรตที่มีจุดสมมูลหลายจุด กรดและเบสลิวอิสในรูปการรับและให้คู่อิเล็กตรอน ไอออนโลหะที่ถูกน้ำล้อมเป็นกรด การเกิดไอออนเชิงซ้อน
      ค่าคงที่การเกิด K_f เช่น [Cu(NH₃)₄]²⁺ และ [Ag(NH₃)₂]⁺
  # ลำดับ 2
  - id: chemistry.equilibrium.solubility-product
    title: ผลคูณการละลายและสมดุลควบคู่
    difficulty: 7.5
    prereq: [chemistry.equilibrium.chemical-equilibrium, chemistry.acids-bases.polyprotic-lewis-complex]
    indicators:
      - university-foundations:CHEM 15.1
      - university-foundations:CHEM 15.3
      - th-coe-engineering-basics:ENV-2.6
    scope: >-
      สมดุลการละลายของสารที่ละลายน้อย ผลคูณการละลาย K_sp และความสัมพันธ์กับสภาพละลายได้ระดับโมล ทำนายการตกตะกอนด้วย Q เทียบ K_sp
      ผลของไอออนร่วม การตกตะกอนแยกทีละชนิด สมดุลควบคู่ การละลายของตะกอนเมื่อเติมกรด (CaCO₃ กับฝนกรด หินปูนในถ้ำ ฟันผุ) และเมื่อเกิดไอออนเชิงซ้อน
      (AgCl ละลายในแอมโมเนีย) รวม K ของสมดุลหลายขั้นด้วยการคูณ
  # ลำดับ 1
  - id: chemistry.thermochem.entropy-gibbs
    title: ความเกิดขึ้นเอง เอนโทรปี กฎข้อที่สามของอุณหพลศาสตร์ และพลังงานอิสระของกิบส์
    difficulty: 7
    prereq: [chemistry.thermochem.enthalpy-hess, chemistry.equilibrium.chemical-equilibrium, math.functions.logarithms]
    indicators:
      - university-foundations:CHEM 16.1
      - university-foundations:CHEM 16.2
      - university-foundations:CHEM 16.3
      - university-foundations:CHEM 16.4
      - university-foundations:CHEM 13.2
    scope: >-
      กระบวนการที่เกิดขึ้นเองกับที่ไม่เกิดเอง (และไม่เกี่ยวกับความเร็ว) เอนโทรปีกับจำนวนสถานะจุลภาค ทำนายเครื่องหมายของ ΔS จากสถานะ
      จำนวนโมลแก๊ส และการละลาย กฎข้อที่สองในรูป ΔS_univ > 0 กฎข้อที่สามและเอนโทรปีมาตรฐาน S° คำนวณ ΔS°rxn จากตาราง พลังงานอิสระของกิบส์
      ΔG = ΔH − TΔS สี่กรณีของเครื่องหมายและอุณหภูมิที่เปลี่ยนความเกิดขึ้นเอง ΔG°f ค่าคงที่สมดุล K_p ของแก๊สและ K_p = K_c(RT)^Δn
      ความสัมพันธ์ ΔG = ΔG° + RT ln Q และ ΔG° = −RT ln K
  # ลำดับ 2
  - id: chemistry.redox.nernst-equation
    title: ศักย์ของเซลล์ พลังงานอิสระ ค่าคงที่สมดุล และสมการของเนิร์นสท์
    difficulty: 7.5
    prereq: [chemistry.redox.electrochemical-cells, chemistry.thermochem.entropy-gibbs]
    indicators:
      - university-foundations:CHEM 17.4
    scope: >-
      ความสัมพันธ์ ΔG° = −nFE°cell = −RT ln K เปลี่ยนค่ากันไปมาและบอกทิศของปฏิกิริยา สมการของเนิร์นสท์ E = E° − (0.0592/n) log Q ที่ 25 °C
      ศักย์ของเซลล์เมื่อความเข้มข้นไม่มาตรฐาน เซลล์ความเข้มข้น แบตเตอรี่ที่แรงดันลดลงเมื่อใช้ไปจนเซลล์ถึงสมดุล (E = 0) และหลักการของ pH มิเตอร์
  # ---------- เคมี: เคมีพรรณนาของธาตุ ----------
  # ลำดับ 3
  - id: chemistry.descriptive.metals-metalloids
    title: โลหะเรพรีเซนเททีฟ กึ่งโลหะ และการถลุงโลหะแทรนซิชัน
    difficulty: 6
    prereq: [chemistry.matter.periodic-trends, chemistry.redox.redox-reactions]
    indicators:
      - university-foundations:CHEM 18.2
      - university-foundations:CHEM 18.3
      - university-foundations:CHEM 19.1
    scope: >-
      แหล่งที่พบ การเตรียม และสมบัติของโลหะแอลคาไล แอลคาไลน์เอิร์ท อะลูมิเนียม ดีบุก ตะกั่ว (การแยกด้วยไฟฟ้า การรีดิวซ์ด้วยคาร์บอน)
      สมบัติของกึ่งโลหะ (โบรอน ซิลิคอน เจอร์เมเนียม) ซิลิคอนกับสารกึ่งตัวนำและซิลิเกต แร่ของโลหะแทรนซิชัน การถลุงเหล็กในเตาสูง
      การทำทองแดงให้บริสุทธิ์ สมบัติทั่วไปและสารประกอบของโลหะแทรนซิชัน และแหล่งแร่ดีบุกกับสังกะสีในประเทศไทย
  # ลำดับ 3
  - id: chemistry.descriptive.hydrogen-carbon-nitrogen-phosphorus
    title: อโลหะ ไฮโดรเจน คาร์บอเนต ไนโตรเจน และฟอสฟอรัส
    difficulty: 6.5
    prereq: [chemistry.matter.periodic-trends, chemistry.acids-bases.acid-base-ph]
    indicators:
      - university-foundations:CHEM 18.4
      - university-foundations:CHEM 18.5
      - university-foundations:CHEM 18.6
      - university-foundations:CHEM 18.7
      - university-foundations:CHEM 18.8
    scope: >-
      โครงสร้างและสมบัติทั่วไปของอโลหะ อัญรูปของคาร์บอน ไฮโดรเจน การเตรียม (รีฟอร์มมิงด้วยไอน้ำ แยกน้ำด้วยไฟฟ้า) ไฮไดรด์ และไฮโดรเจนเป็นเชื้อเพลิง
      คาร์บอเนตและไฮโดรเจนคาร์บอเนต การเผาหินปูน และผงฟู ไนโตรเจน กระบวนการฮาเบอร์ แอมโมเนีย ออกไซด์ของไนโตรเจน กรดไนตริก และปุ๋ย
      ฟอสฟอรัสขาวกับแดง กรดฟอสฟอริกและฟอสเฟตในปุ๋ยกับผงซักฟอก และปัญหายูโทรฟิเคชัน
  # ลำดับ 3
  - id: chemistry.descriptive.oxygen-sulfur-halogens-noble-gases
    title: ออกซิเจน กำมะถัน แฮโลเจน และแก๊สมีตระกูล
    difficulty: 6.5
    prereq: [chemistry.matter.periodic-trends, chemistry.acids-bases.acid-base-ph]
    indicators:
      - university-foundations:CHEM 18.9
      - university-foundations:CHEM 18.10
      - university-foundations:CHEM 18.11
      - university-foundations:CHEM 18.12
    scope: >-
      ออกซิเจนและโอโซน ออกไซด์ เปอร์ออกไซด์ ออกไซด์ที่เป็นกรด เบส และแอมโฟเทอริก กำมะถัน แหล่งที่พบ กระบวนการคอนแทกต์ผลิตกรดซัลฟิวริก
      SO₂ กับฝนกรด แฮโลเจน แนวโน้มความว่องไว การเตรียมคลอรีนด้วยการแยกไฟฟ้า สารประกอบของแฮโลเจน (โซเดียมไฮโปคลอไรต์ ฟลูออไรด์ในยาสีฟัน)
      แก๊สมีตระกูล แหล่งที่พบ การใช้ฮีเลียม นีออน อาร์กอน และสารประกอบของซีนอน
  # ลำดับ 3
  - id: chemistry.coordination.complexes-crystal-field
    title: สารประกอบโคออร์ดิเนชันและทฤษฎีสนามผลึก
    difficulty: 8
    prereq: [chemistry.matter.quantum-numbers-orbitals, chemistry.acids-bases.polyprotic-lewis-complex, chemistry.descriptive.metals-metalloids]
    indicators:
      - university-foundations:CHEM 19.2
      - university-foundations:CHEM 19.3
    scope: >-
      ไอออนโลหะกลาง ลิแกนด์ เลขโคออร์ดิเนชัน ลิแกนด์หลายฟันและคีเลต (EDTA ฮีโมโกลบิน คลอโรฟิลล์) การเรียกชื่อและเขียนสูตรสารเชิงซ้อน
      รูปทรงเหลี่ยมสี่หน้า สี่เหลี่ยมแบนราบ ทรงแปดหน้า และไอโซเมอร์ซิส–ทรานส์ ทฤษฎีสนามผลึก การแยกระดับพลังงาน d ในสนามทรงแปดหน้า
      สนามอ่อนกับสนามแรง สปินสูงกับสปินต่ำ อนุกรมสเปกโทรเคมี สีของสารเชิงซ้อนจากแสงที่ถูกดูดกลืน และสมบัติแม่เหล็ก
  # ---------- ชีววิทยา: เซลล์และพลังงาน ----------
  # ลำดับ 2
  - id: biology.cells.cytoskeleton-junctions
    title: การศึกษาเซลล์ด้วยกล้องจุลทรรศน์อิเล็กตรอน โครงร่างเซลล์ และการเชื่อมต่อระหว่างเซลล์
    difficulty: 5
    prereq: [biology.cells.cell-structure, biology.cells.membrane-transport]
    indicators:
      - university-foundations:BIO 4.1
      - university-foundations:BIO 4.5
      - university-foundations:BIO 4.6
    scope: >-
      ทฤษฎีเซลล์ กำลังขยายกับกำลังแยก กล้องจุลทรรศน์อิเล็กตรอนแบบส่องผ่านและแบบส่องกราด เทียบกับกล้องใช้แสง โครงร่างเซลล์สามชนิด
      ไมโครฟิลาเมนต์ (แอกทิน การคอดของเซลล์ การไหลของไซโทพลาซึม) อินเตอร์มีเดียตฟิลาเมนต์ และไมโครทิวบูล (เส้นใยสปินเดิล เซนทริโอล
      แฟลเจลลัมและซิเลียแบบ 9 + 2) เมทริกซ์นอกเซลล์ของเซลล์สัตว์ ผนังเซลล์พืช พลาสโมเดสมาตา และรอยต่อแบบแน่น เดสโมโซม และแกปจังก์ชัน
  # ลำดับ 2
  - id: biology.cells.bioenergetics
    title: พลังงานในสิ่งมีชีวิต พลังงานอิสระ และตัวพาอิเล็กตรอน
    difficulty: 6
    prereq: [biology.cells.enzymes, chemistry.redox.redox-reactions]
    indicators:
      - university-foundations:BIO 6.1
      - university-foundations:BIO 6.2
      - university-foundations:BIO 6.3
      - university-foundations:BIO 7.1
    scope: >-
      วิถีเมแทบอลิซึมแบบสร้างและสลาย พลังงานศักย์และพลังงานจลน์ในระดับโมเลกุล กฎข้อที่หนึ่งและสองของอุณหพลศาสตร์กับสิ่งมีชีวิตในฐานะระบบเปิด
      เอนโทรปีกับการรักษาความเป็นระเบียบ พลังงานอิสระของกิบส์ ΔG ปฏิกิริยาเอ็กเซอร์โกนิกและเอนเดอร์โกนิก สมดุลกับเซลล์ที่ไม่อยู่ในสมดุล
      พลังงานก่อกัมมันต์ ปฏิกิริยารีดอกซ์ในเซลล์ การส่งอิเล็กตรอนพร้อมไฮโดรเจนผ่าน NAD⁺/NADH FAD/FADH₂ และ ATP เป็นสกุลเงินพลังงาน
      ที่ใช้คู่ปฏิกิริยา (energy coupling)
  # ลำดับ 3
  - id: biology.cells.metabolic-regulation
    title: ความเชื่อมโยงของวิถีเมแทบอลิซึมและการควบคุม
    difficulty: 6.5
    prereq: [biology.cells.cellular-respiration, biology.cells.bioenergetics]
    indicators:
      - university-foundations:BIO 6.5
      - university-foundations:BIO 7.6
      - university-foundations:BIO 7.7
    scope: >-
      คาร์โบไฮเดรตอื่น ไกลโคเจน ลิพิด (กลีเซอรอลและเบตาออกซิเดชันของกรดไขมัน) และโปรตีน (การกำจัดหมู่อะมิโน) เข้าสู่ไกลโคลิซิสและวัฏจักรเครบส์
      ที่จุดใด และสารมัธยันตร์ใช้สร้างสารอื่นกลับ การควบคุมเอนไซม์แบบอัลโลสเตอริก การยับยั้งแบบป้อนกลับ การควบคุมการหายใจระดับเซลล์ที่เอนไซม์สำคัญ
      (ฟอสโฟฟรุกโตไคเนส) ด้วย ATP ADP และซิเตรต การควบคุมการขนส่งกลูโคสเข้าเซลล์ และตัวอย่างการเปลี่ยนแป้งส่วนเกินเป็นไขมัน
  # ลำดับ 2
  - id: biology.cells.cell-signaling
    title: การสื่อสารระหว่างเซลล์
    difficulty: 6
    prereq: [biology.cells.membrane-transport, biology.animals.hormones, biology.cells.enzymes]
    indicators:
      - university-foundations:BIO 9.1
      - university-foundations:BIO 9.2
      - university-foundations:BIO 9.3
      - university-foundations:BIO 9.4
    scope: >-
      การส่งสัญญาณแบบออโตไครน์ พาราไครน์ เอนโดไครน์ และผ่านรอยต่อระหว่างเซลล์ ลิแกนด์และตัวรับภายในเซลล์กับตัวรับที่ผิวเซลล์
      (ตัวรับที่เป็นช่องไอออน ตัวรับคู่โปรตีน G ตัวรับที่เป็นเอนไซม์) การส่งต่อสัญญาณ การเติมหมู่ฟอสเฟตแบบลำดับขั้น ผู้ส่งสารที่สอง cAMP
      Ca²⁺ IP₃ การขยายสัญญาณ การตอบสนองที่การแสดงออกของยีน เมแทบอลิซึม การเติบโต และการตายแบบอะพอพโทซิส และการสื่อสารของสิ่งมีชีวิตเซลล์เดียว
      การรับรู้โควรัมของแบคทีเรียและการผสมพันธุ์ของยีสต์
  # ลำดับ 2
  - id: biology.cells.cell-cycle-control
    title: การควบคุมวัฏจักรเซลล์ มะเร็ง และการแบ่งเซลล์ของโพรแคริโอต
    difficulty: 6.5
    prereq: [biology.cells.cell-division, biology.cells.cell-signaling]
    indicators:
      - university-foundations:BIO 10.3
      - university-foundations:BIO 10.4
      - university-foundations:BIO 10.5
    scope: >-
      สัญญาณภายนอกที่ควบคุมการแบ่งเซลล์ (ขนาดเซลล์ ปัจจัยการเจริญเติบโต การสัมผัสกัน) จุดตรวจ G1 G2 และ M ไซคลินกับไคเนสที่ขึ้นกับไซคลิน
      โปรตีนควบคุมเชิงลบ p53 และ Rb มะเร็งเป็นโรคของการควบคุมวัฏจักรเซลล์ โปรโตออนโคยีน ออนโคยีน ยีนต้านเนื้องอก การสะสมมิวเทชัน
      และการแบ่งตัวแบบทวิภาคของแบคทีเรียกับโปรตีน FtsZ เทียบกับไมโทซิส
  # ---------- ชีววิทยา: พันธุศาสตร์ระดับโมเลกุล ----------
  # ลำดับ 2
  - id: biology.genetics.linkage-mapping
    title: ทฤษฎีโครโมโซม ยีนที่เกาะกลุ่ม และแผนที่ยีน
    difficulty: 6
    prereq: [biology.genetics.mendelian]
    indicators:
      - university-foundations:BIO 13.1
    scope: >-
      ทฤษฎีโครโมโซมของบอเวรีและซัตตัน หลักฐานจากแมลงหวี่ของมอร์แกน ยีนที่อยู่บนโครโมโซมเดียวกันไม่รวมกลุ่มอย่างอิสระ ครอสซิงโอเวอร์กับรีคอมบิแนนท์
      คำนวณความถี่ของการรวมกลุ่มใหม่จากผลการผสมทดสอบ หน่วยแผนที่ (เซนติมอร์แกน) และสร้างแผนที่ยีนสามยีนจากความถี่ ทำไมยีนที่อยู่ห่างกันมาก
      จึงดูเหมือนรวมกลุ่มอย่างอิสระ
  # ลำดับ 2
  - id: biology.genetics.dna-replication-repair
    title: การจำลองดีเอ็นเอในโพรแคริโอตและยูแคริโอต และการซ่อมดีเอ็นเอ
    difficulty: 6.5
    prereq: [biology.genetics.chromosomes-dna]
    indicators:
      - university-foundations:BIO 14.4
      - university-foundations:BIO 14.5
      - university-foundations:BIO 14.6
    scope: >-
      การทดลองของเมเซลสันและสตาห์ล จุดเริ่มจำลองและส้อมจำลอง เฮลิเคส โปรตีนจับสายเดี่ยว โทโพไอโซเมอเรส ไพรเมสและไพรเมอร์ DNA พอลิเมอเรส
      สร้างสายใหม่ทิศ 5′→3′ สายนำและสายตามกับชิ้นโอคาซากิ ไลเกส ความแตกต่างในยูแคริโอต (หลายจุดเริ่ม ฮิสโตน) ปัญหาปลายโครโมโซม เทโลเมียร์
      และเทโลเมอเรสกับการแก่และมะเร็ง การพิสูจน์อักษร การซ่อมคู่เบสผิด การซ่อมแบบตัดนิวคลีโอไทด์ออก (ไดเมอร์ไทมีนจากรังสียูวี)
  # ลำดับ 2
  - id: biology.genetics.transcription-rna-processing
    title: การถอดรหัสในโพรแคริโอตและยูแคริโอต และการดัดแปลง RNA
    difficulty: 6.5
    prereq: [biology.genetics.chromosomes-dna]
    indicators:
      - university-foundations:BIO 15.2
      - university-foundations:BIO 15.3
      - university-foundations:BIO 15.4
    scope: >-
      สายแม่แบบกับสายรหัส โพรโมเตอร์ บริเวณ −10 และ −35 ของแบคทีเรีย RNA พอลิเมอเรสกับซิกมาแฟกเตอร์ การเริ่ม การต่อสาย และการสิ้นสุด
      (แบบอาศัยและไม่อาศัยโปรตีน rho) การถอดรหัสและแปลรหัสพร้อมกันในแบคทีเรีย RNA พอลิเมอเรสสามชนิดของยูแคริโอต ทาทาบ็อกซ์และแฟกเตอร์ถอดรหัสทั่วไป
      การเติมแคป 5′ และหางพอลิเอ การตัดต่ออินทรอนโดยสไปซ์โซม การตัดต่อแบบทางเลือก และการดัดแปลง tRNA กับ rRNA
  # ลำดับ 2
  - id: biology.genetics.prokaryotic-gene-regulation
    title: หลักการควบคุมการแสดงออกของยีนและโอเปอรอนของแบคทีเรีย
    difficulty: 7
    prereq: [biology.genetics.transcription-rna-processing]
    indicators:
      - university-foundations:BIO 16.1
      - university-foundations:BIO 16.2
    scope: >-
      เหตุที่เซลล์ต้องควบคุมการแสดงออกของยีน ระดับที่ควบคุมได้ในโพรแคริโอตเทียบกับยูแคริโอต โอเปอรอน ตัวกดและตัวกระตุ้น โอเปอรอน trp แบบกดได้
      โอเปอรอน lac แบบเหนี่ยวนำได้ กับบทบาทของแล็กโทส กลูโคส cAMP และ CAP ทำนายการแสดงออกในสภาพที่มีและไม่มีน้ำตาลแต่ละชนิด และผลของมิวเทชัน
      ที่ตัวดำเนินการหรือยีนตัวกด
  # ลำดับ 2
  - id: biology.genetics.eukaryotic-gene-regulation
    title: การควบคุมการแสดงออกของยีนในยูแคริโอตและมะเร็ง
    difficulty: 7.5
    prereq: [biology.genetics.prokaryotic-gene-regulation, biology.cells.cell-cycle-control]
    indicators:
      - university-foundations:BIO 16.3
      - university-foundations:BIO 16.4
      - university-foundations:BIO 16.5
      - university-foundations:BIO 16.6
      - university-foundations:BIO 16.7
    scope: >-
      การควบคุมแบบเอพิเจเนติกส์ การดัดแปลงฮิสโตนและการเติมหมู่เมทิลที่ DNA กับการเปิดปิดโครมาทิน แฟกเตอร์ถอดรหัส เอนแฮนเซอร์และตัวกด
      การควบคุมหลังการถอดรหัส การตัดต่อแบบทางเลือก ความเสถียรของ mRNA และ microRNA การควบคุมการแปลรหัสและหลังการแปลรหัส (การดัดแปลงโปรตีน
      ยูบิควิตินและโปรตีเอโซม) มะเร็งจากการควบคุมยีนผิดพลาดในทุกระดับ และยาที่มุ่งเป้า เช่น ยายับยั้งไคเนสและยาที่ปรับเอพิเจเนติกส์
  # ลำดับ 3
  - id: biology.genetics.genomics-proteomics
    title: แผนที่จีโนม การหาลำดับเบสทั้งจีโนม จีโนมิกส์ และโปรตีโอมิกส์
    difficulty: 7
    prereq: [biology.genetics.mutation-biotechnology, biology.genetics.linkage-mapping, biology.genetics.transcription-rna-processing]
    indicators:
      - university-foundations:BIO 17.2
      - university-foundations:BIO 17.3
      - university-foundations:BIO 17.4
      - university-foundations:BIO 17.5
    scope: >-
      แผนที่พันธุกรรมกับแผนที่กายภาพ เครื่องหมายทางพันธุกรรม การหาลำดับเบสแบบแซงเกอร์และรุ่นถัดไป การหาลำดับทั้งจีโนมแบบช็อตกันและการต่อลำดับ
      โครงการจีโนมมนุษย์ การใช้จีโนมิกส์ในการแพทย์เฉพาะบุคคล เภสัชพันธุศาสตร์ การวินิจฉัยโรคและการตรวจคัดกรองพาหะ เมทาจีโนมิกส์กับจุลินทรีย์ในลำไส้
      จีโนมิกส์ในการเกษตร โปรตีโอมและโปรตีโอมิกส์ ตัวบ่งชี้ทางชีวภาพ และข้อพิจารณาด้านความเป็นส่วนตัวของข้อมูลพันธุกรรม
  # ---------- ชีววิทยา: วิวัฒนาการและความหลากหลาย ----------
  # ลำดับ 3
  - id: biology.evolution.phylogeny-speciation-rates
    title: การสร้างต้นไม้วิวัฒนาการ เขตลูกผสม และอัตราการเกิดสปีชีส์
    difficulty: 7
    prereq: [biology.evolution.evolution, biology.diversity.biodiversity-classification]
    indicators:
      - university-foundations:BIO 18.3
      - university-foundations:BIO 20.2
      - university-foundations:BIO 20.3
    scope: >-
      ลักษณะโฮโมโลกัสกับอะนาโลกัส ลักษณะบรรพบุรุษกับลักษณะที่เกิดใหม่ร่วมกัน สร้างแคลโดแกรมจากตารางลักษณะด้วยหลักความประหยัดสูงสุด
      ข้อมูลลำดับเบสในระบบวิทยาโมเลกุล การถ่ายโอนยีนในแนวราบและแนวคิดเครือข่ายชีวิต เขตลูกผสมเมื่อประชากรที่แยกกันกลับมาพบกัน
      (การเสริมความแยก การหลอมรวม ความเสถียร) แบบค่อยเป็นค่อยไปเทียบกับแบบดุลยภาพเป็นช่วง และหลักฐานจากซากดึกดำบรรพ์
  # ลำดับ 2
  - id: biology.diversity.viruses
    title: ไวรัส ไพรออน และไวรอยด์
    difficulty: 6.5
    prereq: [biology.genetics.chromosomes-dna, biology.animals.immunity, biology.diversity.biodiversity-classification]
    indicators:
      - university-foundations:BIO 21.1
      - university-foundations:BIO 21.2
      - university-foundations:BIO 21.3
      - university-foundations:BIO 21.4
    scope: >-
      ไวรัสไม่ใช่เซลล์ โครงสร้าง (แคปซิด เยื่อหุ้ม) การจำแนกตามสารพันธุกรรมและระบบของบัลติมอร์ ขั้นตอนการเพิ่มจำนวนในเซลล์เจ้าบ้าน วัฏจักรไลติกและไลโซเจนิก
      ของแบคเทอริโอเฟจ ไวรัสในสัตว์และพืช รีโทรไวรัสและเอนไซม์รีเวิร์สทรานสคริปเทส (เอชไอวี) ไวรัสก่อมะเร็ง (HPV) วัคซีนชนิดต่าง ๆ รวม mRNA
      ยาต้านไวรัสและเหตุที่ยาปฏิชีวนะใช้ไม่ได้ การกลายพันธุ์ของไข้หวัดใหญ่ ไพรออนกับโรควัวบ้า และไวรอยด์ในพืช
  # ลำดับ 2
  - id: biology.diversity.prokaryotes
    title: แบคทีเรียและอาร์เคีย โครงสร้าง เมแทบอลิซึม โรค และประโยชน์
    difficulty: 6.5
    prereq: [biology.diversity.biodiversity-classification, biology.cells.cellular-respiration]
    indicators:
      - university-foundations:BIO 22.1
      - university-foundations:BIO 22.2
      - university-foundations:BIO 22.3
      - university-foundations:BIO 22.4
      - university-foundations:BIO 22.5
    scope: >-
      ความหลากหลายของโพรแคริโอตและแหล่งที่อยู่สุดขั้ว ไบโอฟิล์ม โครงสร้าง ผนังเซลล์แกรมบวกและแกรมลบ แคปซูล ฟิมเบรีย แฟลเจลลัม พลาสมิด
      การแลกเปลี่ยนยีน (ทรานส์ฟอร์เมชัน ทรานส์ดักชัน คอนจูเกชัน) ความหลากหลายทางเมแทบอลิซึม ผู้ผลิตจากแสงหรือสารเคมี บทบาทในวัฏจักรคาร์บอนและไนโตรเจน
      โรคจากแบคทีเรียในคน (วัณโรค อหิวาต์ อาหารเป็นพิษ) เชื้อดื้อยาและการใช้ยาปฏิชีวนะอย่างสมเหตุผล และประโยชน์ในการหมักอาหารไทย
      การบำบัดน้ำเสีย และการผลิตอินซูลิน
  # ลำดับ 3
  - id: biology.diversity.protists
    title: โพรทิสต์ กำเนิดยูแคริโอต กลุ่มหลัก และบทบาททางนิเวศ
    difficulty: 6.5
    prereq: [biology.diversity.biodiversity-classification, biology.diversity.prokaryotes]
    indicators:
      - university-foundations:BIO 23.1
      - university-foundations:BIO 23.2
      - university-foundations:BIO 23.3
      - university-foundations:BIO 23.4
    scope: >-
      หลักฐานของเอนโดซิมไบโอซิส (DNA และไรโบโซมของไมโทคอนเดรียกับคลอโรพลาสต์) และเอนโดซิมไบโอซิสทุติยภูมิ ลักษณะของโพรทิสต์ โครงสร้าง
      การกินอาหาร การเคลื่อนที่ และการสืบพันธุ์ กลุ่มหลักโดยสังเขป (ยูกลีนา ไดอะตอม ไดโนแฟลกเจลเลต อะมีบา พารามีเซียม สาหร่ายสีเขียว สีแดง สีน้ำตาล)
      โพรทิสต์เป็นผู้ผลิตในทะเล สาเหตุของน้ำทะเลเปลี่ยนสี ปรสิตก่อโรค (มาลาเรีย บิด อะมีบา) และผู้ย่อยสลาย
  # ลำดับ 3
  - id: biology.diversity.fungi
    title: ฟังไจ ลักษณะ การจำแนก นิเวศวิทยา และความสำคัญต่อมนุษย์
    difficulty: 6.5
    prereq: [biology.diversity.biodiversity-classification]
    indicators:
      - university-foundations:BIO 24.1
      - university-foundations:BIO 24.2
      - university-foundations:BIO 24.3
      - university-foundations:BIO 24.4
      - university-foundations:BIO 24.5
    scope: >-
      โครงสร้างของฟังไจ ไฮฟา ไมซีเลียม ผนังไคทิน การกินอาหารแบบดูดซึม การสืบพันธุ์แบบอาศัยและไม่อาศัยเพศ สปอร์ กลุ่มหลัก (ไคทริด ราขนมปัง
      ราแอสโคไมซีต เห็ดแบสิดิโอไมซีต) ผู้ย่อยสลาย ไมคอร์ไรซา ไลเคน และเอนโดไฟต์ โรคพืช (โรคใบไหม้ข้าว) โรคในคน (กลาก เกลื้อน ราในปอด)
      สารพิษอะฟลาทอกซิน เห็ดพิษ และการใช้ประโยชน์ ยีสต์หมักอาหาร เพนิซิลลิน เห็ดเพาะ และราควบคุมแมลง
  # ลำดับ 3
  - id: biology.diversity.seedless-plants
    title: กำเนิดพืชบก สาหร่ายสีเขียว ไบรโอไฟต์ และพืชมีท่อลำเลียงไร้เมล็ด
    difficulty: 6.5
    prereq: [biology.diversity.biodiversity-classification, biology.plants.reproduction-growth]
    indicators:
      - university-foundations:BIO 25.1
      - university-foundations:BIO 25.2
      - university-foundations:BIO 25.3
      - university-foundations:BIO 25.4
    scope: >-
      การปรับตัวเพื่อขึ้นบก (คิวทิเคิล ปากใบ เอ็มบริโอที่ได้รับการปกป้อง สปอร์ผนังหนา) สาหร่ายคาโรไฟต์เป็นญาติใกล้ชิดของพืช วัฏจักรชีวิตแบบสลับ
      ที่แกมีโทไฟต์เด่นในลิเวอร์เวิร์ต ฮอร์นเวิร์ต และมอส บทบาทของมอสในป่าดิบเขา พืชมีท่อลำเลียงไร้เมล็ด ไลโคไฟต์ หางม้า และเฟิร์น วัฏจักรชีวิต
      ที่สปอโรไฟต์เด่น และป่าเฟิร์นยุคคาร์บอนิเฟอรัสกับถ่านหิน
  # ลำดับ 3
  - id: biology.diversity.seed-plants
    title: พืชเมล็ด พืชเมล็ดเปลือย พืชดอก และความสำคัญต่อมนุษย์
    difficulty: 6.5
    prereq: [biology.diversity.seedless-plants]
    indicators:
      - university-foundations:BIO 26.1
      - university-foundations:BIO 26.2
      - university-foundations:BIO 26.3
      - university-foundations:BIO 26.4
    scope: >-
      วิวัฒนาการของเมล็ด ละอองเรณู และออวุล ข้อได้เปรียบเหนือสปอร์ พืชเมล็ดเปลือย (สน ปรง แปะก๊วย มะเมื่อย) และวัฏจักรชีวิตของสน
      พืชดอก ดอกและผลเป็นการปรับตัว วัฏจักรชีวิต การเทียบใบเลี้ยงเดี่ยวกับใบเลี้ยงคู่ การวิวัฒนาการร่วมกับสัตว์ถ่ายเรณู ความสำคัญของพืชเมล็ด
      ต่ออาหาร ยา ไม้ และเศรษฐกิจไทย (ข้าว ยาง มันสำปะหลัง) และภัยคุกคามต่อความหลากหลายของพืช
  # ลำดับ 2
  - id: biology.diversity.animal-body-plans
    title: ลักษณะของอาณาจักรสัตว์ แผนผังร่างกาย และวิวัฒนาการของสัตว์
    difficulty: 6.5
    prereq: [biology.diversity.biodiversity-classification, biology.animals.reproduction-development]
    indicators:
      - university-foundations:BIO 27.1
      - university-foundations:BIO 27.2
      - university-foundations:BIO 27.3
      - university-foundations:BIO 27.4
    scope: >-
      ลักษณะร่วมของสัตว์ การเจริญของเอ็มบริโอและชนิดของเนื้อเยื่อ ลักษณะที่ใช้จำแนก สมมาตรแบบรัศมีและแบบด้านข้าง ชั้นเนื้อเยื่อสองชั้นและสามชั้น
      ช่องตัวแท้ ช่องตัวเทียม และไม่มีช่องตัว โพรโทสโตมกับดิวเทอโรสโตม การแบ่งตามการลอกคราบกับไม่ลอกคราบ ต้นไม้วิวัฒนาการของสัตว์ตามข้อมูลโมเลกุล
      การระเบิดของแคมเบรียน และการสูญพันธุ์ครั้งใหญ่ที่เปลี่ยนสายวิวัฒนาการของสัตว์
  # ลำดับ 3
  - id: biology.diversity.basal-animals-lophotrochozoa
    title: ฟองน้ำ ไนดาเรีย หนอนตัวแบน หอย และหนอนปล้อง
    difficulty: 6.5
    prereq: [biology.diversity.animal-body-plans]
    indicators:
      - university-foundations:BIO 28.1
      - university-foundations:BIO 28.2
      - university-foundations:BIO 28.3
      - university-foundations:BIO 28.4
    scope: >-
      ไฟลัมพอริเฟอรา (ฟองน้ำ เซลล์ปลอกคอ การกรองอาหาร) ไฟลัมไนดาเรีย (แมงกะพรุน ดอกไม้ทะเล ปะการัง เซลล์เข็มพิษ รูปแบบโพลิปและเมดูซา)
      ซูเปอร์ไฟลัมโลโฟโทรโคซัว หนอนตัวแบน (พลานาเรีย พยาธิใบไม้ตับและพยาธิตัวตืดที่พบในไทย) โรติเฟอร์ และเนเมอร์เทียน ไฟลัมมอลลัสกา
      (หอยฝาเดียว หอยสองฝา หมึก แมนเทิล เรดูลา) และไฟลัมแอนเนลิดา (ไส้เดือนดิน ปลิง ไส้เดือนทะเล) เทียบแผนผังร่างกายของแต่ละไฟลัม
  # ลำดับ 3
  - id: biology.diversity.ecdysozoa-deuterostomes
    title: หนอนตัวกลม ทาร์ดิเกรด สัตว์ขาปล้อง และดิวเทอโรสโตม
    difficulty: 6.5
    prereq: [biology.diversity.basal-animals-lophotrochozoa]
    indicators:
      - university-foundations:BIO 28.5
      - university-foundations:BIO 28.6
      - university-foundations:BIO 28.7
    scope: >-
      ซูเปอร์ไฟลัมเอคไดโซซัว การลอกคราบ หนอนตัวกลม (พยาธิไส้เดือน พยาธิปากขอ C. elegans) ทาร์ดิเกรดและความทนทาน สัตว์ขาปล้อง
      โครงร่างภายนอก รยางค์เป็นข้อ กลุ่มย่อย แมลง ครัสเตเชียน แมง ตะขาบกิ้งกือ ความสำคัญของแมลงต่อการถ่ายเรณูและการเป็นพาหะ (ยุงลาย)
      ซูเปอร์ไฟลัมดิวเทอโรสโตม เอไคโนเดิร์ม (ดาวทะเล เม่นทะเล ระบบท่อน้ำ) และความเชื่อมโยงกับคอร์เดต
  # ลำดับ 3
  - id: biology.diversity.chordates-fishes-amphibians
    title: คอร์เดต ปลา และสัตว์สะเทินน้ำสะเทินบก
    difficulty: 6.5
    prereq: [biology.diversity.ecdysozoa-deuterostomes]
    indicators:
      - university-foundations:BIO 29.1
      - university-foundations:BIO 29.2
      - university-foundations:BIO 29.3
    scope: >-
      ลักษณะสี่ประการของคอร์เดต (โนโทคอร์ด ท่อประสาทด้านหลัง ช่องเหงือก หางหลังทวารหนัก) เพรียงหัวหอมและแอมฟิออกซัส สัตว์มีกะโหลก
      ปลาไม่มีขากรรไกร ปลากระดูกอ่อน ปลากระดูกแข็ง ปลาครีบรยางค์และการขึ้นบก สัตว์สะเทินน้ำสะเทินบก กบ ซาลาแมนเดอร์ เขียดงู
      การหายใจทางผิวหนัง วัฏจักรชีวิตแบบเมทามอร์โฟซิส และการลดลงจากเชื้อราไคทริด
  # ลำดับ 3
  - id: biology.diversity.amniotes-primates
    title: สัตว์มีถุงน้ำคร่ำ สัตว์เลื้อยคลาน นก สัตว์เลี้ยงลูกด้วยน้ำนม และไพรเมต
    difficulty: 6.5
    prereq: [biology.diversity.chordates-fishes-amphibians, biology.evolution.evolution]
    indicators:
      - university-foundations:BIO 29.4
      - university-foundations:BIO 29.5
      - university-foundations:BIO 29.6
      - university-foundations:BIO 29.7
    scope: >-
      ไข่มีถุงน้ำคร่ำและเยื่อหุ้มเอ็มบริโอ สัตว์เลื้อยคลาน (เต่า จระเข้ งู กิ้งก่า) การควบคุมอุณหภูมิจากภายนอก นกกับไดโนเสาร์ ขนนก กระดูกกลวง
      ถุงลมและการบิน สัตว์เลี้ยงลูกด้วยน้ำนม ขน ต่อมน้ำนม ฟันหลายแบบ กลุ่มโมโนทรีม มาร์ซูเปียล และยูเธอเรีย วิวัฒนาการของไพรเมต
      ลิงโลกเก่าและโลกใหม่ เอป และสายวิวัฒนาการของมนุษย์ตั้งแต่ออสตราโลพิเทคัสถึง Homo sapiens
  # ---------- ชีววิทยา: พืช สัตว์ และนิเวศวิทยา ----------
  # ลำดับ 3
  - id: biology.plants.plant-adaptations
    title: อวัยวะดัดแปลง การรับรู้แสง การป้องกันตัว และการได้ธาตุอาหารของพืช
    difficulty: 6
    prereq: [biology.plants.hormones-responses, biology.plants.plant-transport, biology.plants.plant-structure]
    indicators:
      - university-foundations:BIO 31.3
      - university-foundations:BIO 30.2
      - university-foundations:BIO 30.3
      - university-foundations:BIO 30.4
      - university-foundations:BIO 30.6
    scope: >-
      ลำต้นดัดแปลง (เหง้า หัว ไหล มือเกาะ) รากดัดแปลง (รากสะสมอาหาร รากค้ำ รากหายใจของโกงกาง รากอากาศของกล้วยไม้) ใบดัดแปลงและการเรียงใบ
      ไฟโทโครมกับแสงสีแดงและแสงสีแดงไกล ช่วงแสงกับการออกดอกของพืชวันสั้นและวันยาว นาฬิกาชีวภาพ การป้องกันตัวจากสัตว์กินพืชและเชื้อโรค
      (หนาม สารทุติยภูมิ การตอบสนองต่อบาดแผล) การได้ไนโตรเจนจากแบคทีเรียตรึงไนโตรเจนในปมรากถั่ว ไมคอร์ไรซา พืชกินแมลง (หม้อข้าวหม้อแกงลิง)
      พืชเบียน (กาฝาก ฝอยทอง) และพืชอิงอาศัย
  # ลำดับ 2
  - id: biology.animals.tissues-body-plan
    title: รูปร่างกับหน้าที่ของสัตว์ เนื้อเยื่อหลักสี่ชนิด และอัตราเมแทบอลิซึม
    difficulty: 5.5
    prereq: [biology.cells.cell-structure, biology.animals.homeostasis]
    indicators:
      - university-foundations:BIO 33.1
      - university-foundations:BIO 33.2
    scope: >-
      ขนาดและรูปร่างของสัตว์ อัตราส่วนพื้นที่ผิวต่อปริมาตรกับการแลกเปลี่ยนสาร สัตว์ที่ควบคุมอุณหภูมิภายในและภายนอก อัตราเมแทบอลิซึมพื้นฐาน
      และขนาดร่างกาย เนื้อเยื่อบุผิว (รูปร่างและจำนวนชั้น ต่อม) เนื้อเยื่อเกี่ยวพัน (หลวม เส้นใย กระดูกอ่อน กระดูก ไขมัน เลือด) เนื้อเยื่อกล้ามเนื้อ
      (โครงร่าง เรียบ หัวใจ) และเนื้อเยื่อประสาท ระบุชนิดเนื้อเยื่อจากภาพและหน้าที่ และการทำงานร่วมกันเป็นอวัยวะ
  # ลำดับ 3
  - id: biology.animals.nervous-system-disorders
    title: ความผิดปกติของระบบประสาท
    difficulty: 6
    prereq: [biology.animals.nervous-system]
    indicators:
      - university-foundations:BIO 35.5
    scope: >-
      โรคความเสื่อมของระบบประสาท อัลไซเมอร์และพาร์กินสันกับการสูญเสียเซลล์ประสาทและสารสื่อประสาท โรคหลอดเลือดสมองและสัญญาณเตือน (BE FAST)
      ลมชัก ความผิดปกติทางพัฒนาการ ออทิซึมและสมาธิสั้น โรคทางจิตเวช ซึมเศร้าและจิตเภทกับบทบาทของสารสื่อประสาท การบาดเจ็บของสมองจากการกระแทก
      วิธีวินิจฉัยและรักษาเชิงหลักการ การไม่ตีตราผู้ป่วย และช่องทางขอความช่วยเหลือ (สายด่วนสุขภาพจิต 1323 และเหตุฉุกเฉิน 1669)
  # ลำดับ 3
  - id: biology.ecology.life-history-community
    title: ชีวภูมิศาสตร์ ประวัติชีวิต ประชากรมนุษย์ และนิเวศวิทยาชุมชน
    difficulty: 6.5
    prereq: [biology.ecology.populations, biology.ecology.biomes-succession, biology.ecology.food-webs]
    indicators:
      - university-foundations:BIO 44.2
      - university-foundations:BIO 45.2
      - university-foundations:BIO 45.5
      - university-foundations:BIO 45.6
    scope: >-
      ชีวภูมิศาสตร์ ปัจจัยที่กำหนดการกระจายของสิ่งมีชีวิต ถิ่นเฉพาะ และเส้นวอลเลซ ประวัติชีวิตกับการแลกได้แลกเสียของการสืบพันธุ์ กลยุทธ์ r และ K
      การเติบโตของประชากรโลก การเปลี่ยนผ่านทางประชากร ปิรามิดอายุของไทยกับประเทศอื่น ขีดความสามารถในการรองรับของโลก นิเวศวิทยาชุมชน
      การล่าเหยื่อกับวัฏจักรประชากรผู้ล่า–เหยื่อ การป้องกันตัวของเหยื่อ หลักการแก่งแย่งแข่งขันกีดกันและการแบ่งนิช ภาวะพึ่งพาแบบต่าง ๆ
      ความหลากหลายของชุมชน ชนิดพันธุ์หลักและชนิดพันธุ์ต่างถิ่นรุกราน
  # ลำดับ 3
  - id: biology.ecology.conservation-biology
    title: วิกฤตความหลากหลายทางชีวภาพและชีววิทยาการอนุรักษ์
    difficulty: 6.5
    prereq: [biology.diversity.biodiversity, biology.ecology.environmental-issues, biology.ecology.populations]
    indicators:
      - university-foundations:BIO 47.1
      - university-foundations:BIO 47.4
    scope: >-
      การสูญพันธุ์ครั้งใหญ่ห้าครั้งในอดีต อัตราการสูญพันธุ์พื้นหลังเทียบกับปัจจุบันและวิธีประมาณ (ความสัมพันธ์พื้นที่–จำนวนชนิด) จุดความหลากหลายสูง
      ประเมินสถานะการถูกคุกคามด้วยเกณฑ์บัญชีแดงของ IUCN การออกแบบพื้นที่คุ้มครอง ขนาด รูปร่าง และแนวเชื่อมต่อ การฟื้นฟูระบบนิเวศ
      (ป่าชายเลน แนวปะการัง) การนำชนิดพันธุ์กลับคืนถิ่น กฎหมายและอนุสัญญาที่เกี่ยวข้อง (CITES CBD) และกรณีศึกษาของไทย เช่น สมเสร็จ พะยูน และเสือโคร่ง
