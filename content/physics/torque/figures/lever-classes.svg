<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" width="640" height="410" font-family="sans-serif" font-size="16">
  <title>คานสามอันดับ แบ่งตามตำแหน่งของจุดหมุน น้ำหนัก และแรงพยายาม</title>
  <rect x="40" y="54" width="300" height="12" fill="#d9c7a7" stroke="#15211e" stroke-width="2"/>
  <polygon points="175,66 161,85.6 189,85.6" fill="#c9b79c" stroke="#15211e" stroke-width="2" stroke-linejoin="round"/>
  <rect x="26" y="26" width="28" height="28" fill="#f3d27a" stroke="#15211e" stroke-width="1.5"/>
  <text x="40" y="45" font-size="13" text-anchor="middle" font-weight="bold">W</text>
  <line x1="340" y1="10" x2="340" y2="44" stroke="#b3261e" stroke-width="2.6"/>
  <polygon points="340,52 335.5,42 344.5,42" fill="#b3261e"/>
  <text x="350" y="30" fill="#b3261e" font-size="15" font-weight="bold" font-style="italic">F</text>
  <text x="380" y="54" font-size="14" font-weight="bold">อันดับ 1: จุดหมุนอยู่กลาง</text>
  <text x="380" y="74" fill="#6b7570" font-size="13">กรรไกร ชะแลง ไม้กระดก</text>
  <rect x="40" y="169" width="300" height="12" fill="#d9c7a7" stroke="#15211e" stroke-width="2"/>
  <polygon points="40,181 26,200.6 54,200.6" fill="#c9b79c" stroke="#15211e" stroke-width="2" stroke-linejoin="round"/>
  <rect x="161" y="141" width="28" height="28" fill="#f3d27a" stroke="#15211e" stroke-width="1.5"/>
  <text x="175" y="160" font-size="13" text-anchor="middle" font-weight="bold">W</text>
  <line x1="340" y1="227" x2="340" y2="191" stroke="#b3261e" stroke-width="2.6"/>
  <polygon points="340,183 344.5,193 335.5,193" fill="#b3261e"/>
  <text x="350" y="215" fill="#b3261e" font-size="15" font-weight="bold" font-style="italic">F</text>
  <text x="380" y="169" font-size="14" font-weight="bold">อันดับ 2: น้ำหนักอยู่กลาง</text>
  <text x="380" y="189" fill="#6b7570" font-size="13">รถเข็นดิน ที่เปิดขวด</text>
  <rect x="40" y="284" width="300" height="12" fill="#d9c7a7" stroke="#15211e" stroke-width="2"/>
  <polygon points="40,296 26,315.6 54,315.6" fill="#c9b79c" stroke="#15211e" stroke-width="2" stroke-linejoin="round"/>
  <rect x="326" y="256" width="28" height="28" fill="#f3d27a" stroke="#15211e" stroke-width="1.5"/>
  <text x="340" y="275" font-size="13" text-anchor="middle" font-weight="bold">W</text>
  <line x1="175" y1="342" x2="175" y2="306" stroke="#b3261e" stroke-width="2.6"/>
  <polygon points="175,298 179.5,308 170.5,308" fill="#b3261e"/>
  <text x="185" y="330" fill="#b3261e" font-size="15" font-weight="bold" font-style="italic">F</text>
  <text x="380" y="284" font-size="14" font-weight="bold">อันดับ 3: แรงพยายามอยู่กลาง</text>
  <text x="380" y="304" fill="#6b7570" font-size="13">แหนบ คีมคีบน้ำแข็ง แขนคน</text>
  <text x="40" y="395" fill="#6b7570" font-size="12">▲ = จุดหมุน   W = น้ำหนักของที่ยก   F = แรงพยายาม</text>
</svg>
