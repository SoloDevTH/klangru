    solution: T = 8 ÷ 2^((95 − 85) ÷ 3) = 8 ÷ 2^3.33 ≈ 0.794 ชั่วโมง ≈ 47.6 นาที ค่าที่ใช้ควรตรวจกับเกณฑ์ที่กฎหมายไทยกำหนดในปัจจุบันด้วย
