  - id: biology.ecology.environmental-issues.p012
    topics: [biology.ecology.environmental-issues]
    difficulty: 4
    type: mcq
    stem: "มีข้อเสนอให้สร้างอ่างเก็บน้ำในหุบเขาที่เป็นป่าเพื่อแก้ภัยแล้งของพื้นที่เกษตรด้านล่าง ข้อใดเป็นการประเมินที่รอบด้านที่สุด"
    choices:
      - { id: a, text: "เทียบประโยชน์ เช่น น้ำสำรองหน้าแล้งและการป้องกันน้ำท่วม กับผลกระทบ เช่น ป่าและสัตว์ป่าที่สูญเสีย ชุมชนที่ต้องย้าย และค่าใช้จ่าย แล้วเทียบกับทางเลือกอื่น เช่น แก้มลิงขนาดเล็ก หรือการลดการใช้น้ำ", correct: true }
      - { id: b, text: "ควรสร้างทันที เพราะน้ำสำคัญที่สุด", feedback: "การตัดสินจากประโยชน์ด้านเดียวโดยไม่ดูผลกระทบและทางเลือกอื่นไม่ใช่การประเมินที่รอบด้าน" }
      - { id: c, text: "ไม่ควรสร้างเด็ดขาด เพราะการสร้างใด ๆ ทำลายธรรมชาติเสมอ", feedback: "การปฏิเสธโดยไม่ชั่งประโยชน์และทางเลือกก็ไม่รอบด้านเช่นกัน" }
      - { id: d, text: "ให้ประเมินจากค่าก่อสร้างอย่างเดียว", feedback: "ต้นทุนทางสิ่งแวดล้อมและสังคมก็ต้องนับด้วย" }
    hints:
      - "การประเมินที่ดีดูทั้งประโยชน์และผลกระทบ"
      - "ควรมีทางเลือกอื่นให้เปรียบเทียบด้วย"
    solution: "การประเมินที่รอบด้านต้องชั่งทั้งประโยชน์ ผลกระทบต่อระบบนิเวศและชุมชน ค่าใช้จ่าย และเปรียบเทียบกับทางเลือกอื่นที่อาจแก้ปัญหาเดียวกันด้วยผลกระทบน้อยกว่า ไม่ตัดสินจากมุมเดียว"
