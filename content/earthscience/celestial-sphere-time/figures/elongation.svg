<text x="595.7" y="407.0" text-anchor="start" font-size="11" fill="#7f1d1d" font-weight="bold">ดาวอังคารมุมห่าง 90°</text>
<text x="20.0" y="24.0" text-anchor="start" font-size="12" fill="#334155">มองลงมาจากเหนือระนาบวงโคจร ดาวเคราะห์โคจรทวนเข็มนาฬิกา</text>
<text x="20.0" y="42.0" text-anchor="start" font-size="12" fill="#334155">เมื่อมองจากโลกไปทางดวงอาทิตย์ ด้านซ้ายของภาพคือทางทิศตะวันออกของดวงอาทิตย์</text>
</svg>