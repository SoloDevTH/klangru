  - id: computer.society.responsible-ict.p016
    topics: [computer.society.responsible-ict]
    difficulty: 4
    type: mcq
    stem: "แอปของโรงเรียนจะเก็บวันเกิดและเบอร์โทรผู้ปกครองของนักเรียน ป.2 (อายุราว 8 ปี) การขอความยินยอมแบบใดเหมาะสมตาม พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล"
    choices:
      - { id: a, text: "ขอความยินยอมจากผู้ปกครองอย่างชัดแจ้ง แยกจากข้อความอื่น และบอกว่าจะใช้ข้อมูลเพื่ออะไร", correct: true }
      - { id: b, text: "ให้นักเรียนกดปุ่ม \"ยอมรับ\" เองในแอป", feedback: "เจ้าของข้อมูลอายุไม่เกิน 10 ปี ต้องขอความยินยอมจากผู้ใช้อำนาจปกครอง" }
      - { id: c, text: "ซ่อนข้อความขอความยินยอมไว้ท้ายเงื่อนไขการใช้งานยาว ๆ", feedback: "กฎหมายกำหนดให้การขอความยินยอมแยกจากข้อความอื่นอย่างชัดเจนและอ่านเข้าใจง่าย" }
      - { id: d, text: "ไม่ต้องขอ เพราะเป็นโรงเรียน", feedback: "การเก็บข้อมูลส่วนบุคคลต้องมีฐานตามกฎหมาย และโดยทั่วไปต้องแจ้งวัตถุประสงค์และขอความยินยอม" }
    hints:
      - "อายุของนักเรียนมีผลว่าใครต้องเป็นผู้ให้ความยินยอม"
      - "ความยินยอมต้องชัดแจ้ง แยกส่วน และบอกวัตถุประสงค์"
    solution: "มาตรา 19 กำหนดให้ขอความยินยอมอย่างชัดแจ้ง แจ้งวัตถุประสงค์ และแยกจากข้อความอื่น และมาตรา 20 กำหนดว่าถ้าผู้เยาว์อายุไม่เกิน 10 ปี ต้องขอจากผู้ใช้อำนาจปกครอง ข้อ ก จึงเหมาะสม"
