copyright: "มาตรฐานของกระทรวงศึกษาธิการจีน ไฟล์ทางการประทับ 仅供查阅 (ใช้อ่านอ้างอิงเท่านั้น) และไม่มีข้อความอนุญาตให้ทำซ้ำ จึงเก็บเฉพาะโครง ตัวเลขเชิงปริมาณ และสรุปด้วยคำของคลังรู้ ไม่คัดข้อความต้นฉบับ"
completeness: structure-and-summary
strands:
  - id: HSK3.0-S1
    title: 初等 ขั้นต้น (ระดับ 1–3)
    standards:
      - id: HSK3.0-初等
        text: "เข้าใจภาษาง่าย ๆ และสื่อสารในสังคมได้ในหัวข้อจำกัด ใช้รูปประโยคที่พบบ่อยเรียงเป็นย่อหน้าสั้น เมื่อจบขั้นนี้ควรรู้พยางค์ 608 อักษร 900 คำ 2245 จุดไวยากรณ์ 210 และเขียนอักษรด้วยมือได้ 300 ตัว"
        indicators:
          - { id: HSK3.0-L1, level: HSK 1, text: "ตัวเลข: พยางค์ 269 · อักษร 300 · คำ 500 · ไวยากรณ์ 48 จุด · เขียนด้วยมือ 100 ตัว — ฟัง พูด อ่าน เขียนขั้นแรกเริ่ม สนทนาสั้น ๆ หรือตอบรับในเรื่องที่คุ้นที่สุด หัวข้อ: ข้อมูลส่วนตัว กิจวัตร อาหาร การเดินทาง งานอดิเรก ฟังบทสนทนาสั้นไม่เกิน 80 ตัวอักษร (พูดไม่เร็วกว่า 100 ตัว/นาที) อ่านข้อความไม่เกิน 100 ตัวอักษรโดยอาศัยภาพหรือพินอิน (อย่างน้อย 80 ตัว/นาที) รู้กฎขีดและลำดับขีดเบื้องต้น ลอกอักษรได้อย่างน้อย 10 ตัว/นาที กรอกข้อมูลส่วนตัวและเขียนโน้ตสั้นได้" }
          - { id: HSK3.0-L2, level: HSK 2, text: "ตัวเลข (เพิ่ม/สะสม): พยางค์ 199/468 · อักษร 300/600 · คำ 772/1272 · ไวยากรณ์ 81/129 · เขียนด้วยมือ 200 ตัว — สื่อสารสั้น ๆ ในเรื่องค่อนข้างคุ้น หัวข้อ: การทักทายพื้นฐาน ชีวิตในบ้าน ตารางเรียน การซื้อของ การสั่งอาหาร ความรู้สึก ฟังบทสนทนาหรือการพูดไม่เกิน 150 ตัวอักษร (อย่างน้อย 140 ตัว/นาที) อ่านข้อความไม่เกิน 200 ตัวอักษร (อย่างน้อย 100 ตัว/นาที) เช่น ประกาศหรือข้อความอิเล็กทรอนิกส์ เขียนแนะนำเรื่องตัวเองอย่างน้อย 100 ตัวอักษร" }
          - { id: HSK3.0-L3, level: HSK 3, text: "ตัวเลข (เพิ่ม/สะสม): พยางค์ 140/608 · อักษร 300/900 · คำ 973/2245 · ไวยากรณ์ 81/210 · เขียนด้วยมือ 300 ตัว — สื่อสารเรื่องชีวิตประจำวัน การเรียน และการทำงานได้ หัวข้อ: ประสบการณ์เดินทาง การเรียน กีฬาและกิจกรรม เทศกาลและประเพณี การศึกษา อาชีพ ฟังไม่เกิน 300 ตัวอักษรด้วยความเร็วใกล้ปกติ (อย่างน้อย 180 ตัว/นาที) อ่านไม่เกิน 300 ตัวอักษร (อย่างน้อย 120 ตัว/นาที) จับใจความและรายละเอียด ใช้พจนานุกรม เขียนอีเมล ประกาศ หรือเรื่องเล่าสั้นอย่างน้อย 200 ตัวอักษร" }
  - id: HSK3.0-S2
    title: 中等 ขั้นกลาง (ระดับ 4–6)
    standards:
      - id: HSK3.0-中等
        text: "เข้าใจภาษาทั่วไปหลายหัวข้อ สื่อสารได้ค่อนข้างคล่อง เล่าเป็นย่อหน้าในเรื่องที่ซับซ้อนขึ้นเกี่ยวกับชีวิต งาน อาชีพ และสังคมวัฒนธรรม เมื่อจบขั้นนี้ควรรู้พยางค์ 908 อักษร 1800 คำ 5456 จุดไวยากรณ์ 424 และเขียนอักษรด้วยมือได้ 700 ตัว"
        indicators:
          - { id: HSK3.0-L4, level: HSK 4, text: "ตัวเลข (เพิ่ม/สะสม): พยางค์ 116/724 · อักษร 300/1200 · คำ 1000/3245 · ไวยากรณ์ 76/286 · เขียนด้วยมือเพิ่ม 100 ตัว — เริ่มแปลได้ สื่อสารเรื่องชีวิตประจำวัน การเรียน และงานที่ซับซ้อนขึ้นได้ครบถ้วนต่อเนื่อง หัวข้อ: ชุมชน สุขภาพ ชีวิตในโรงเรียน งานสำนักงาน สัตว์และพืช ฟังการพูดไม่เป็นทางการไม่เกิน 400 ตัวอักษร (180–200 ตัว/นาที) อ่านไม่เกิน 500 ตัวอักษร (อย่างน้อย 140 ตัว/นาที) เขียนเล่าหรืออธิบายอย่างน้อย 300 ตัวอักษร" }
          - { id: HSK3.0-L5, level: HSK 5, text: "ตัวเลข (เพิ่ม/สะสม): พยางค์ 98/822 · อักษร 300/1500 · คำ 1071/4316 · ไวยากรณ์ 71/357 · เขียนด้วยมือ 250 ตัวจากรายการขั้นกลาง — สื่อสารเรื่องซับซ้อนได้ค่อนข้างครบและคล่อง หัวข้อ: ความสัมพันธ์ระหว่างคน วิถีชีวิต วิธีเรียน ธรรมชาติ ปรากฏการณ์สังคม ฟังไม่เกิน 500 ตัวอักษร (200–220 ตัว/นาที) อ่านไม่เกิน 700 ตัวอักษร (อย่างน้อย 160 ตัว/นาที) รวมทั้งข้อความแสดงความเห็น เขียนอย่างน้อย 450 ตัวอักษร แปลเรื่องทั่วไปได้ค่อนข้างแม่น" }
          - { id: HSK3.0-L6, level: HSK 6, text: "ตัวเลข (เพิ่ม/สะสม): พยางค์ 86/908 · อักษร 300/1800 · คำ 1140/5456 · ไวยากรณ์ 67/424 · เขียนด้วยมือ 400 ตัวจากรายการขั้นกลาง — สื่อสารเรื่องการเรียนและงานบางสาขาเฉพาะได้หลากหลาย คล่อง และเหมาะกาลเทศะ หัวข้อ: การเข้าสังคม งานบริษัท ความขัดแย้ง ข่าวสังคม การเปรียบเทียบจีนกับต่างประเทศ ฟังไม่เกิน 600 ตัวอักษร (220–240 ตัว/นาที) อ่านไม่เกิน 900 ตัวอักษร (อย่างน้อย 180 ตัว/นาที) เขียนอย่างน้อย 600 ตัวอักษร ล่ามอย่างไม่เป็นทางการได้" }
  - id: HSK3.0-S3
    title: 高等 ขั้นสูง (ระดับ 7–9)
    standards:
      - id: HSK3.0-高等
        text: "เข้าใจภาษาซับซ้อนหลายหัวข้อและหลายประเภท อภิปรายลึกในเรื่องสังคมและวิชาการได้อย่างเหมาะสม เป็นเหตุเป็นผล ตัวเลขของขั้นนี้ไม่แบ่งรายระดับ: เพิ่ม/สะสม พยางค์ 202/1110 · อักษร 1200/3000 · คำ 5636/11092 · ไวยากรณ์ 148/572 · เขียนด้วยมือรวม 1200 ตัว (เพิ่ม 500)"
        indicators:
          - { id: HSK3.0-L7, level: HSK 7, text: "ตัวเลขใช้ร่วมกับระดับ 8–9 (ดูข้อความมาตรฐาน) — ฟัง พูด อ่าน เขียนได้ดี และเริ่มแปลเฉพาะทางได้ สื่อสารเรื่องกว้างและระดับสูงได้ถูกแบบแผนและคล่อง หัวข้อ: มารยาทสังคม วิทยาศาสตร์และเทคโนโลยี ศิลปะ กีฬา จิตใจและอารมณ์ วิชาเฉพาะ ฟังบรรยายหรือข่าวราว 800 ตัวอักษร อ่านอย่างน้อย 200 ตัว/นาที เขียนรายงาน บทความแสดงความเห็น และงานวิชาการขนาดพอสมควร" }
          - { id: HSK3.0-L8, level: HSK 8, text: "ตัวเลขใช้ร่วมกับระดับ 7 และ 9 — สื่อสารเรื่องระดับสูงหรือเฉพาะทางได้ถูกแบบแผนและคล่องมากขึ้น หัวข้อ: ภาษาและอักษร การเมืองเศรษฐกิจ กฎหมาย ปรัชญา ประวัติศาสตร์ ฟังบรรยายเฉพาะทางหรือข่าวพิเศษราว 800 ตัวอักษร อ่านอย่างน้อย 220 ตัว/นาที กล่าวสุนทรพจน์ พูดโดยไม่ได้เตรียม หรือตอบข้อซักถามได้ เขียนงานยาวและบทความวิชาการ" }
          - { id: HSK3.0-L9, level: HSK 9, text: "ตัวเลขใช้ร่วมกับระดับ 7–8 — ฟัง พูด อ่าน เขียน และแปลเฉพาะทางได้ดี สื่อสารทุกหัวข้อได้ถูกแบบแผน คล่อง และเหมาะสม หัวข้อ: งานวิจัย นโยบายและกฎหมาย การค้า กิจการระหว่างประเทศ อ่านอย่างน้อย 240 ตัว/นาที เขียนวิทยานิพนธ์และงานเขียนหลายประเภท แปลแบบล่ามพร้อมกันในงานทางการได้" }
