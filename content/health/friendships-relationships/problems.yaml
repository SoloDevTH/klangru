      - { id: b, text: "สัมพันธภาพไม่เกี่ยวกับงาน ขอแค่ทุกคนเก่งก็พอ", feedback: "คนเก่งที่ไม่คุยกันจะแบ่งงานและช่วยกันได้ยาก งานจึงสะดุด" }
