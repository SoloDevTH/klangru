problems:
  - id: math.pyth.p001
    topics: [math.geometry.pythagoras]
    difficulty: 1
    type: numeric
    stem: "สามเหลี่ยมมุมฉากมีขายาว $6\\ \\mathrm{cm}$ และ $8\\ \\mathrm{cm}$ ด้านตรงข้ามมุมฉากยาวกี่เซนติเมตร (ตอบในหน่วย cm)"
    answer: { value: 10, unit: cm }
    hints:
      - "ใช้ $a^2 + b^2 = c^2$ โดย $c$ คือด้านตรงข้ามมุมฉาก"
      - "ยกกำลังสองขาทั้งสองแล้วบวกกัน จากนั้นถอดรากที่สอง"
    misconceptions:
      - { match: 14, feedback: "ดูเหมือนนำขาทั้งสองมาบวกกันตรง ๆ ต้องยกกำลังสองก่อนบวก แล้วถอดราก" }
      - { match: 100, feedback: "นั่นคือ $c^2$ ยังต้องถอดรากที่สองอีกครั้งจึงได้ $c$" }
    solution: "$c = \\sqrt{6^2 + 8^2} = \\sqrt{36 + 64} = \\sqrt{100} = 10\\ \\mathrm{cm}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.pyth.p002
    topics: [math.geometry.pythagoras]
    difficulty: 1
    type: mcq
    stem: "สามเหลี่ยม $ABC$ มีมุม $C$ เป็นมุมฉาก ด้านใดเป็นด้านตรงข้ามมุมฉาก"
    figure: { src: triangle-abc.svg, alt: "สามเหลี่ยม ABC มีสัญลักษณ์มุมฉากที่จุด C ไม่มีป้ายชื่อด้าน" }
    choices:
      - { id: a, text: "$AB$", correct: true }
      - { id: b, text: "$AC$", feedback: "$AC$ เป็นด้านหนึ่งที่ประกอบมุม $C$ จึงเป็นขา ด้านตรงข้ามมุมฉากต้องไม่แตะจุด $C$" }
      - { id: c, text: "$BC$", feedback: "$BC$ ลากออกจากจุด $C$ จึงเป็นขาของมุมฉาก ด้านตรงข้ามมุม $C$ คือด้านที่เชื่อม $A$ กับ $B$" }
    hints:
      - "ด้านตรงข้ามมุมใดคือด้านที่ไม่ได้ลากออกจากจุดยอดของมุมนั้น"
      - "หาด้านที่ไม่มีตัวอักษร $C$"
    solution: "มุมฉากอยู่ที่ $C$ ด้าน $AC$ และ $BC$ ลากออกจาก $C$ จึงเป็นขา ด้านตรงข้ามมุมฉากคือ $AB$ ซึ่งยาวที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.pyth.p003
    topics: [math.geometry.pythagoras]
    difficulty: 2
    type: numeric
    stem: "สามเหลี่ยมมุมฉากมีด้านตรงข้ามมุมฉากยาว $13\\ \\mathrm{cm}$ และขาข้างหนึ่งยาว $5\\ \\mathrm{cm}$ ขาอีกข้างยาวกี่เซนติเมตร (ตอบในหน่วย cm)"
    answer: { value: 12, unit: cm }
    hints:
      - "ข้อนี้รู้ด้านตรงข้ามมุมฉาก ต้องการหาขา"
      - "จัดรูป $a^2 + b^2 = c^2$ เป็น $b^2 = c^2 - a^2$"
      - "ลบกำลังสองของ 5 ออกจากกำลังสองของ 13 แล้วถอดรากที่สอง"
    misconceptions:
      - { match: 13.93, feedback: "ดูเหมือนบวก $13^2 + 5^2$ ขาต้องสั้นกว่าด้านตรงข้ามมุมฉากเสมอ เวลาหาขาต้องลบ" }
      - { match: 8, feedback: "ดูเหมือนนำ $13 - 5$ ตรง ๆ ต้องลบกันในรูปกำลังสอง แล้วค่อยถอดราก" }
    solution: "$b = \\sqrt{13^2 - 5^2} = \\sqrt{169 - 25} = \\sqrt{144} = 12\\ \\mathrm{cm}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.pyth.p004
    topics: [math.geometry.pythagoras]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ความยาวด้านชุดใดประกอบเป็นสามเหลี่ยมมุมฉาก (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "3, 4, 5", correct: true }
      - { id: b, text: "4, 5, 6", feedback: "$4^2 + 5^2 = 41$ แต่ $6^2 = 36$ ไม่เท่ากัน การเป็นจำนวนเรียงกันไม่ได้แปลว่าเป็นมุมฉาก" }
      - { id: c, text: "5, 12, 13", correct: true }
      - { id: d, text: "7, 24, 26", feedback: "$7^2 + 24^2 = 625 = 25^2$ ด้านที่สามต้องเป็น 25 ไม่ใช่ 26 ($26^2 = 676$)" }
      - { id: e, text: "9, 12, 15", correct: true }
    hints:
      - "ใช้บทกลับ: ยกกำลังสองด้านสั้นสองด้านแล้วบวกกัน เทียบกับกำลังสองของด้านยาวที่สุด"
      - "พหุคูณของชุด 3, 4, 5 ก็เป็นสามเหลี่ยมมุมฉากด้วย"
    solution: "$3^2 + 4^2 = 25 = 5^2$ ✓ · $4^2 + 5^2 = 41 \\ne 36$ ✗ · $5^2 + 12^2 = 169 = 13^2$ ✓ · $7^2 + 24^2 = 625 \\ne 676$ ✗ · $9^2 + 12^2 = 225 = 15^2$ ✓ (คือ 3, 4, 5 คูณ 3)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.pyth.p005
    topics: [math.geometry.pythagoras]
    difficulty: 3
    type: numeric
    stem: "ช่างไฟพาดบันไดยาว $5\\ \\mathrm{m}$ กับผนังบ้าน เท้าบันไดห่างจากผนัง $1.4\\ \\mathrm{m}$ ปลายบันไดแตะผนังสูงจากพื้นกี่เมตร (ตอบในหน่วย m)"
    answer: { value: 4.8, tolerance: 0.05, unit: m }
    hints:
      - "บันได ผนัง และพื้นเป็นสามเหลี่ยมมุมฉาก บันไดคือด้านตรงข้ามมุมฉาก"
      - "ความสูงบนผนังเป็นขา จึงต้องใช้ $c^2 - a^2$"
      - "คำนวณ $\\sqrt{5^2 - 1.4^2}$"
    misconceptions:
      - { match: 5.19, feedback: "ดูเหมือนบวกกำลังสอง ความสูงบนผนังต้องน้อยกว่าความยาวบันได จึงต้องลบ" }
      - { match: 3.6, feedback: "ดูเหมือนนำ $5 - 1.4$ ตรง ๆ ต้องลบกันในรูปกำลังสองแล้วถอดราก" }
    solution: "ความสูง $= \\sqrt{5^2 - 1.4^2} = \\sqrt{25 - 1.96} = \\sqrt{23.04} = 4.8\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.pyth.p006
    topics: [math.geometry.pythagoras]
    difficulty: 3
    type: numeric
    stem: "หาระยะทางระหว่างจุด $A(1, 2)$ และ $B(7, 10)$ บนระนาบพิกัด (ตอบเป็นจำนวนหน่วย)"
    answer: { value: 10, unit: หน่วย }
    hints:
      - "ระยะแนวนอนและแนวตั้งระหว่างสองจุดเป็นขาของสามเหลี่ยมมุมฉาก"
      - "ระยะแนวนอน $7 - 1$ ระยะแนวตั้ง $10 - 2$"
      - "ใช้ $d = \\sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2}$"
    misconceptions:
      - { match: 14, feedback: "นั่นคือระยะเมื่อเดินแนวนอน 6 แล้วแนวตั้ง 8 ระยะตรงจาก $A$ ไป $B$ เป็นด้านตรงข้ามมุมฉาก ต้องใช้ทฤษฎีบทพีทาโกรัส" }
      - { match: 100, feedback: "นั่นคือ $d^2$ ยังต้องถอดรากที่สอง" }
    solution: "$d = \\sqrt{(7 - 1)^2 + (10 - 2)^2} = \\sqrt{36 + 64} = \\sqrt{100} = 10$ หน่วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.pyth.p007
    topics: [math.geometry.pythagoras]
    difficulty: 3
    type: expression
    stem: "สามเหลี่ยมมุมฉากมีขาข้างหนึ่งยาว $a$ และด้านตรงข้ามมุมฉากยาว $c$ เขียนความยาวของขาอีกข้าง $b$ ในรูปของ $a$ และ $c$"
    prefix: "b ="
    answer: { latex: "\\sqrt{c^2-a^2}", variables: [a, c] }
    hints:
      - "เริ่มจาก $a^2 + b^2 = c^2$"
      - "ย้าย $a^2$ ไปอีกข้างหนึ่งให้เหลือ $b^2$ แล้วถอดรากที่สองทั้งสองข้าง"
    misconceptions:
      - { match: "\\sqrt{c^2+a^2}", feedback: "นั่นยาวกว่า $c$ ซึ่งเป็นไปไม่ได้ ขาต้องสั้นกว่าด้านตรงข้ามมุมฉาก เมื่อย้าย $a^2$ ข้ามเครื่องหมายเท่ากับต้องเป็นลบ" }
      - { match: "c-a", feedback: "รากที่สองกระจายเข้าไปในผลลบไม่ได้ $\\sqrt{c^2 - a^2} \\ne c - a$ ลองแทน $a = 3$, $c = 5$ จะได้ 4 ไม่ใช่ 2" }
    solution: "$a^2 + b^2 = c^2$ → $b^2 = c^2 - a^2$ → $b = \\sqrt{c^2 - a^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.pyth.p008
    topics: [math.geometry.pythagoras]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการหาความสูงที่บันไดยาว $c$ แตะผนัง เมื่อเท้าบันไดห่างผนัง $a$"
    items:
      - "วาดรูปและระบุว่าบันไดเป็นด้านตรงข้ามมุมฉาก"
      - "เขียน $a^2 + h^2 = c^2$"
      - "จัดรูปเป็น $h^2 = c^2 - a^2$"
      - "แทนค่าและคำนวณ $c^2 - a^2$"
      - "ถอดรากที่สองเพื่อหา $h$ แล้วตรวจว่า $h < c$"
    hints:
      - "ต้องรู้ก่อนว่าด้านใดเป็นด้านตรงข้ามมุมฉาก จึงจะเขียนสมการได้ถูก"
      - "การถอดรากที่สองเป็นขั้นท้าย ๆ เพราะต้องได้ค่าของ $h^2$ ก่อน"
    solution: "ระบุด้านตรงข้ามมุมฉาก → เขียนทฤษฎีบท → จัดรูปให้ $h^2$ อยู่ข้างเดียว → คำนวณ → ถอดรากและตรวจว่าขาสั้นกว่าด้านตรงข้ามมุมฉาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.pyth.p009
    topics: [math.geometry.pythagoras]
    difficulty: 4
    type: numeric
    stem: "จอทีวีกว้าง $48$ นิ้ว สูง $27$ นิ้ว ร้านบอกขนาดจอตามความยาวเส้นทแยงมุม จอนี้มีขนาดประมาณกี่นิ้ว (ตอบทศนิยม 1 ตำแหน่ง ในหน่วยนิ้ว)"
    answer: { value: 55.07, tolerance: 0.5, unit: นิ้ว }
    hints:
      - "ความกว้าง ความสูง และเส้นทแยงมุมของจอเป็นสามเหลี่ยมมุมฉาก"
      - "เส้นทแยงมุมเป็นด้านตรงข้ามมุมฉาก"
      - "คำนวณ $\\sqrt{48^2 + 27^2}$"
    misconceptions:
      - { match: 75, feedback: "ดูเหมือนบวกความกว้างกับความสูงตรง ๆ เส้นทแยงต้องสั้นกว่าการเดินอ้อมตามขอบจอ" }
      - { match: 3033, feedback: "นั่นคือกำลังสองของเส้นทแยง ยังต้องถอดรากที่สอง" }
    solution: "เส้นทแยง $= \\sqrt{48^2 + 27^2} = \\sqrt{2{,}304 + 729} = \\sqrt{3{,}033} \\approx 55.1$ นิ้ว จึงเป็นจอขนาด 55 นิ้ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.pyth.p010
    topics: [math.geometry.pythagoras]
    difficulty: 4
    type: numeric
    stem: "ที่ท้องสนามหลวง น้องเล่นว่าวโดยปล่อยสายตึงยาว $50\\ \\mathrm{m}$ จุดบนพื้นที่อยู่ใต้ว่าวพอดีห่างจากน้อง $30\\ \\mathrm{m}$ และมือที่ถือสายอยู่สูงจากพื้น $1.5\\ \\mathrm{m}$ ว่าวลอยสูงจากพื้นกี่เมตร (ตอบในหน่วย m)"
    answer: { value: 41.5, tolerance: 0.4, unit: m }
    hints:
      - "สายว่าวเป็นด้านตรงข้ามมุมฉาก ระยะแนวนอน $30\\ \\mathrm{m}$ เป็นขาข้างหนึ่ง"
      - "หาความสูงของว่าวเหนือระดับมือก่อน ด้วย $\\sqrt{50^2 - 30^2}$"
      - "สามเหลี่ยมเริ่มที่ระดับมือ ไม่ใช่ที่พื้น อย่าลืมความสูงของมือ"
    misconceptions:
      - { match: 40, feedback: "นั่นคือความสูงเหนือระดับมือ สามเหลี่ยมเริ่มที่มือซึ่งสูงจากพื้น $1.5\\ \\mathrm{m}$ ต้องบวกเพิ่ม" }
      - { match: 59.81, feedback: "ดูเหมือนบวกกำลังสองแทนการลบ สายว่าวเป็นด้านตรงข้ามมุมฉาก ความสูงเป็นขาจึงต้องสั้นกว่าสาย" }
    solution: "ความสูงเหนือมือ $= \\sqrt{50^2 - 30^2} = \\sqrt{2{,}500 - 900} = \\sqrt{1{,}600} = 40\\ \\mathrm{m}$ สูงจากพื้น $= 40 + 1.5 = 41.5\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.pyth.p011
    topics: [math.geometry.pythagoras]
    difficulty: 4
    type: mcq
    stem: "ช่างตรวจมุมห้องโดยวัดจากมุมไปตามผนังด้านหนึ่ง $60\\ \\mathrm{cm}$ และอีกด้าน $80\\ \\mathrm{cm}$ แล้ววัดระยะตรงระหว่างสองจุดได้ $98\\ \\mathrm{cm}$ มุมห้องนี้เป็นอย่างไร"
    choices:
      - { id: a, text: "แคบกว่ามุมฉากเล็กน้อย", correct: true }
      - { id: b, text: "เป็นมุมฉากพอดี", feedback: "ถ้าเป็นมุมฉาก ระยะต้องเป็น $\\sqrt{60^2 + 80^2} = 100\\ \\mathrm{cm}$ พอดี แต่วัดได้ $98\\ \\mathrm{cm}$" }
      - { id: c, text: "กว้างกว่ามุมฉากเล็กน้อย", feedback: "ถ้ามุมกว้างกว่ามุมฉาก ปลายทั้งสองจะถ่างออกจากกัน ระยะจะมากกว่า $100\\ \\mathrm{cm}$ แต่วัดได้น้อยกว่า" }
      - { id: d, text: "บอกไม่ได้ ต้องใช้ไม้ฉาก", feedback: "บทกลับของทฤษฎีบทพีทาโกรัสบอกได้ เทียบ $98^2$ กับ $60^2 + 80^2$" }
    hints:
      - "ถ้าเป็นมุมฉากพอดี ระยะควรเป็นเท่าใด"
      - "เทียบ $98^2$ กับ $60^2 + 80^2$ ถ้าน้อยกว่า ปลายทั้งสองอยู่ใกล้กันกว่ากรณีมุมฉาก"
    solution: "$60^2 + 80^2 = 10{,}000 = 100^2$ ถ้าเป็นมุมฉาก ระยะต้องเป็น $100\\ \\mathrm{cm}$ แต่ $98^2 = 9{,}604 < 10{,}000$ ปลายทั้งสองอยู่ใกล้กันเกินไป มุมจึงแคบกว่ามุมฉาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.pyth.p012
    topics: [math.geometry.pythagoras]
    difficulty: 5
    type: numeric
    stem: "ทีวีจอ $55$ นิ้ว (วัดตามเส้นทแยงมุม) มีอัตราส่วนความกว้างต่อความสูง $16 : 9$ จอกว้างประมาณกี่นิ้ว (ตอบทศนิยม 1 ตำแหน่ง ในหน่วยนิ้ว)"
    answer: { value: 47.94, tolerance: 0.48, unit: นิ้ว }
    hints:
      - "ให้ความกว้าง $= 16k$ และความสูง $= 9k$"
      - "ใช้ทฤษฎีบทพีทาโกรัส: $(16k)^2 + (9k)^2 = 55^2$ แก้หา $k$"
      - "เมื่อได้ $k = \\dfrac{55}{\\sqrt{337}}$ แล้วนำไปคูณ 16"
    misconceptions:
      - { match: 35.2, feedback: "ดูเหมือนแบ่ง 55 ตามสัดส่วน $\\tfrac{16}{16 + 9}$ เส้นทแยงไม่ได้เท่ากับกว้างบวกสูง ต้องใช้ $(16k)^2 + (9k)^2 = 55^2$" }
      - { match: 26.96, feedback: "นั่นคือความสูง $9k$ โจทย์ถามความกว้าง ซึ่งคือ $16k$" }
    solution: "$(16k)^2 + (9k)^2 = 55^2$ → $337k^2 = 3{,}025$ → $k = \\dfrac{55}{\\sqrt{337}} \\approx 2.996$ ความกว้าง $= 16k \\approx 47.9$ นิ้ว (ความสูง $9k \\approx 27.0$ นิ้ว)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.pyth.p013
    topics: [math.geometry.pythagoras]
    difficulty: 5
    type: numeric
    stem: "กล่องทรงสี่เหลี่ยมมุมฉากยาว $12\\ \\mathrm{cm}$ กว้าง $4\\ \\mathrm{cm}$ สูง $3\\ \\mathrm{cm}$ ไม้เส้นตรงที่ยาวที่สุดที่ใส่ในกล่องได้ (จากมุมล่างหนึ่งไปมุมบนฝั่งตรงข้าม) ยาวกี่เซนติเมตร (ตอบในหน่วย cm)"
    answer: { value: 13, unit: cm }
    hints:
      - "ใช้ทฤษฎีบทพีทาโกรัสสองครั้ง ครั้งแรกหาเส้นทแยงของพื้นกล่อง"
      - "เส้นทแยงพื้น $= \\sqrt{12^2 + 4^2}$ จากนั้นเส้นทแยงพื้นกับความสูงประกอบเป็นมุมฉากอีกรูปหนึ่ง"
      - "รวมเป็นสูตรเดียวได้ $\\sqrt{12^2 + 4^2 + 3^2}$"
    misconceptions:
      - { match: 12.65, feedback: "นั่นคือเส้นทแยงของพื้นกล่อง ไม้ยังเอียงขึ้นไปถึงมุมบนได้อีก ต้องรวมความสูง $3\\ \\mathrm{cm}$ ด้วย" }
      - { match: 19, feedback: "ดูเหมือนบวกสามด้านตรง ๆ เส้นทแยงต้องคำนวณด้วยผลบวกของกำลังสองแล้วถอดราก" }
    solution: "เส้นทแยงพื้น $= \\sqrt{12^2 + 4^2} = \\sqrt{160}$ ไม้ $= \\sqrt{(\\sqrt{160})^2 + 3^2} = \\sqrt{160 + 9} = \\sqrt{169} = 13\\ \\mathrm{cm}$"
