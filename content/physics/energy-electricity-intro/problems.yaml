problems:
  - id: physics.energy.energy-electricity-intro.p001
    topics: [physics.energy.energy-electricity-intro]
    difficulty: 1
    type: match
    stem: "จับคู่เครื่องใช้ไฟฟ้ากับพลังงานหลักที่เครื่องนั้นเปลี่ยนพลังงานไฟฟ้าไปเป็น"
    pairs:
      - { left: "พัดลม", right: "พลังงานกล (การเคลื่อนที่)" }
      - { left: "หลอดไฟ", right: "พลังงานแสง" }
      - { left: "เตารีด", right: "พลังงานความร้อน" }
      - { left: "ลำโพง", right: "พลังงานเสียง" }
    hints:
      - "นึกว่าเครื่องแต่ละอย่างทำงานแล้วเราได้อะไร"
      - "พัดลมทำให้ใบพัดหมุน เตารีดทำให้ผ้าเรียบด้วยความร้อน"
    solution: "พัดลม → การเคลื่อนที่ หลอดไฟ → แสง เตารีด → ความร้อน ลำโพง → เสียง (ทุกเครื่องมีความร้อนเกิดขึ้นบ้างด้วย)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.energy-electricity-intro.p002
    topics: [physics.energy.energy-electricity-intro]
    difficulty: 1
    type: mcq
    stem: "ถ่านไฟฉายที่ยังไม่ได้ใช้ เก็บพลังงานไว้ในรูปใด"
    choices:
      - { id: a, text: "พลังงานเคมี", correct: true }
      - { id: b, text: "พลังงานแสง", feedback: "ถ่านไฟฉายไม่ได้สว่าง แสงเกิดที่หลอดไฟฉายเมื่อไฟฟ้าไหลผ่าน" }
      - { id: c, text: "พลังงานความร้อน", feedback: "ถ่านไฟฉายที่ยังไม่ใช้ไม่ได้ร้อน พลังงานถูกเก็บในสารเคมีข้างใน" }
    hints:
      - "ข้างในถ่านไฟฉายมีอะไรอยู่"
      - "สารเคมีในถ่านไฟฉายทำปฏิกิริยากันแล้วให้ไฟฟ้า"
    solution: "ถ่านไฟฉายเก็บพลังงานเคมี เมื่อต่อวงจร พลังงานเคมีเปลี่ยนเป็นพลังงานไฟฟ้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.energy-electricity-intro.p003
    topics: [physics.energy.energy-electricity-intro]
    difficulty: 1
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นการใช้ไฟฟ้าอย่างปลอดภัย (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "เช็ดมือให้แห้งก่อนเสียบปลั๊ก", correct: true }
      - { id: b, text: "ถอดปลั๊กโดยจับที่ตัวปลั๊ก", correct: true }
      - { id: c, text: "เห็นสายไฟขาดตกพื้นแล้วอยู่ห่าง ๆ และบอกผู้ใหญ่", correct: true }
      - { id: d, text: "ดึงสายไฟเพื่อถอดปลั๊กให้เร็วขึ้น", feedback: "การดึงสายไฟทำให้สายข้างในขาดหรือฉนวนชำรุด อาจเกิดไฟดูดหรือไฟไหม้ ต้องจับที่ตัวปลั๊ก" }
      - { id: e, text: "เสียบเตารีด หม้อหุงข้าว และกาต้มน้ำพร้อมกันในปลั๊กพ่วงอันเดียว", feedback: "เครื่องเหล่านี้ใช้ไฟมาก เสียบพร้อมกันทำให้ปลั๊กพ่วงและสายไฟร้อนจัดจนไฟไหม้ได้" }
    hints:
      - "น้ำนำไฟฟ้าได้ มือเปียกจึงอันตราย"
      - "ข้อใดทำให้สายไฟเสียหายหรือร้อนเกินไป"
    solution: "ข้อ ก ข ค ปลอดภัย การดึงสายไฟและการใช้เครื่องไฟฟ้ากำลังสูงหลายเครื่องในปลั๊กพ่วงเดียวเสี่ยงต่อไฟดูดและไฟไหม้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.energy-electricity-intro.p004
    topics: [physics.energy.energy-electricity-intro]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการผลิตไฟฟ้าจากเขื่อนจนไฟฟ้ามาถึงบ้าน"
    items:
      - "น้ำถูกกักไว้ในเขื่อนที่สูง"
      - "น้ำไหลลงมาดันกังหันให้หมุน"
      - "กังหันหมุนแม่เหล็กในเครื่องกำเนิดไฟฟ้า"
      - "เกิดกระแสไฟฟ้าในขดลวด"
      - "ไฟฟ้าถูกส่งไปตามสายไฟถึงบ้าน"
    hints:
      - "เริ่มจากแหล่งพลังงาน คือน้ำที่อยู่สูง"
      - "เครื่องกำเนิดไฟฟ้าต้องถูกหมุนก่อน จึงเกิดไฟฟ้า"
    solution: "น้ำที่สูง → น้ำไหลหมุนกังหัน → กังหันหมุนแม่เหล็กในเครื่องกำเนิดไฟฟ้า → เกิดกระแสไฟฟ้าในขดลวด → ส่งไฟฟ้าตามสายถึงบ้าน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.energy-electricity-intro.p005
    topics: [physics.energy.energy-electricity-intro]
    difficulty: 2
    type: text
    stem: "อุปกรณ์ที่มีแม่เหล็กหมุนอยู่ในขดลวด ทำหน้าที่เปลี่ยนพลังงานกลจากการหมุนเป็นพลังงานไฟฟ้า เรียกว่าอะไร"
    accepted: ["เครื่องกำเนิดไฟฟ้า", "ไดนาโม", "generator", "เจเนอเรเตอร์"]
    misconceptions:
      - { match: "มอเตอร์", feedback: "มอเตอร์ทำงานกลับกัน คือเปลี่ยนไฟฟ้าเป็นการหมุน เช่น ในพัดลม เครื่องที่เปลี่ยนการหมุนเป็นไฟฟ้ามีชื่ออื่น" }
      - { match: "กังหัน", feedback: "กังหันเป็นส่วนที่ถูกน้ำ ไอน้ำ หรือลมดันให้หมุน แต่ส่วนที่มีแม่เหล็กกับขดลวดและผลิตไฟฟ้าเรียกอีกชื่อหนึ่ง" }
    hints:
      - "ชื่อของอุปกรณ์นี้บอกว่ามันทำให้เกิดอะไร"
      - "เครื่อง...ไฟฟ้า"
    solution: "เครื่องกำเนิดไฟฟ้า (ไดนาโม) ใช้แม่เหล็กหมุนในขดลวดให้เกิดกระแสไฟฟ้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.energy-electricity-intro.p006
    topics: [physics.energy.energy-electricity-intro]
    difficulty: 2
    type: mcq
    stem: "แม่จะซื้อตู้เย็นใหม่และอยากประหยัดค่าไฟ ควรเลือกตู้เย็นที่มีฉลากใด"
    choices:
      - { id: a, text: "ฉลากประหยัดไฟเบอร์ 5", correct: true }
      - { id: b, text: "ฉลากประหยัดไฟเบอร์ 1", feedback: "ฉลากเบอร์ 5 คือประหยัดไฟมากที่สุด เบอร์น้อยกว่าประหยัดน้อยกว่า" }
      - { id: c, text: "ไม่ต้องดูฉลาก ตู้เย็นทุกเครื่องใช้ไฟเท่ากัน", feedback: "ตู้เย็นต่างรุ่นใช้ไฟต่างกันได้มาก ฉลากช่วยให้เปรียบเทียบได้" }
    hints:
      - "ฉลากประหยัดไฟของไทยใช้ตัวเลขบอกระดับ"
      - "ตัวเลขยิ่งมากยิ่งประหยัด"
    solution: "ฉลากประหยัดไฟเบอร์ 5 แสดงว่าเครื่องนั้นประหยัดไฟมากที่สุดในกลุ่มเดียวกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.energy-electricity-intro.p007
    topics: [physics.energy.energy-electricity-intro]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นหลักฐานว่าเสียงพาพลังงานจากที่หนึ่งไปอีกที่หนึ่งได้"
    choices:
      - { id: a, text: "เสียงลำโพงในงานวัดดังมากจนกระจกหน้าต่างบ้านใกล้ ๆ สั่น", correct: true }
      - { id: b, text: "แสงแดดส่องหลังคาสังกะสีจนร้อน", feedback: "นี่เป็นหลักฐานว่าแสงพาพลังงานได้ แต่โจทย์ถามเรื่องเสียง" }
      - { id: c, text: "ช้อนโลหะในหม้อแกงร้อนขึ้นจนจับไม่ได้", feedback: "นี่คือความร้อนที่ถ่ายโอนผ่านช้อน ไม่ใช่เสียง" }
    hints:
      - "หาข้อที่มีเสียงเป็นสาเหตุ"
      - "พลังงานทำให้สิ่งต่าง ๆ เคลื่อนที่หรือสั่นได้"
    solution: "เสียงดังทำให้กระจกที่อยู่ห่างออกไปสั่น แปลว่าเสียงพาพลังงานจากลำโพงไปถึงกระจก ข้ออื่นเป็นการถ่ายโอนพลังงานด้วยแสงและความร้อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.energy-electricity-intro.p008
    topics: [physics.energy.energy-electricity-intro]
    difficulty: 3
    type: mcq
    stem: "ปล่อยลูกโบว์ลิ่งลูกเดียวกันสองครั้ง ครั้งแรกกลิ้งช้า ครั้งที่สองกลิ้งเร็ว ครั้งที่สองชนพินล้มมากกว่า เพราะเหตุใด"
    choices:
      - { id: a, text: "ลูกที่กลิ้งเร็วกว่ามีพลังงานมากกว่า จึงส่งพลังงานให้พินได้มากกว่า", correct: true }
      - { id: b, text: "ลูกที่กลิ้งเร็วหนักกว่าลูกที่กลิ้งช้า", feedback: "เป็นลูกเดียวกัน น้ำหนักเท่าเดิม ที่ต่างกันคือความเร็ว" }
      - { id: c, text: "ความเร็วไม่เกี่ยวกับพลังงาน ครั้งที่สองโชคดีกว่า", feedback: "ถ้าทำซ้ำหลายครั้งจะเห็นแบบรูปเดิม ลูกที่เร็วกว่าชนพินล้มได้มากกว่าเพราะมีพลังงานมากกว่า" }
    hints:
      - "สองครั้งนี้ต่างกันที่อะไร"
      - "ของที่เคลื่อนที่เร็วกว่ามีพลังงานมากหรือน้อยกว่า"
    solution: "ลูกเดียวกันแต่เร็วกว่ามีพลังงานจลน์มากกว่า เมื่อชนก็ถ่ายโอนพลังงานให้พินได้มากกว่า พินจึงล้มมากกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.energy-electricity-intro.p009
    topics: [physics.energy.energy-electricity-intro]
    difficulty: 3
    type: match
    stem: "จับคู่เหตุการณ์กับการเปลี่ยนรูปของพลังงาน"
    pairs:
      - { left: "ลูกมะพร้าวหล่นจากต้น", right: "พลังงานจากการอยู่ที่สูงเปลี่ยนเป็นพลังงานการเคลื่อนที่" }
      - { left: "ดึงยางหนังสติ๊กให้ยืด", right: "พลังงานจากกล้ามเนื้อไปสะสมในยางที่ยืด" }
      - { left: "จุดเตาถ่านย่างหมู", right: "พลังงานเคมีในถ่านเปลี่ยนเป็นความร้อนและแสง" }
      - { left: "ร่างกายย่อยอาหารแล้ววิ่งเล่น", right: "พลังงานเคมีในอาหารเปลี่ยนเป็นการเคลื่อนไหวและความร้อน" }
    hints:
      - "ดูว่าพลังงานเริ่มจากอะไร และจบที่อะไร"
      - "เชื้อเพลิงและอาหารเก็บพลังงานเคมี ของที่อยู่สูงมีพลังงานจากตำแหน่ง"
    solution: "มะพร้าวหล่น: ความสูง → การเคลื่อนที่ ดึงหนังสติ๊ก: กล้ามเนื้อ → ยางที่ยืด เผาถ่าน: เคมี → ความร้อนและแสง ย่อยอาหาร: เคมี → การเคลื่อนไหวและความร้อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.energy-electricity-intro.p010
    topics: [physics.energy.energy-electricity-intro]
    difficulty: 3
    type: mcq
    stem: "รถของเล่นวิ่งชนกำแพงแล้วหยุด มีเสียงดังโครม และหน้ารถบุบเล็กน้อย พลังงานการเคลื่อนที่ของรถไปอยู่ที่ใด"
    choices:
      - { id: a, text: "เปลี่ยนเป็นเสียง ความร้อน และใช้ไปทำให้รถบุบ", correct: true }
      - { id: b, text: "หายไปหมด เพราะรถหยุดแล้ว", feedback: "พลังงานไม่หายไปไหน รถหยุดเพราะพลังงานถูกถ่ายโอนไปเป็นรูปอื่น เช่น เสียงที่เราได้ยิน" }
      - { id: c, text: "ยังอยู่ในรถทั้งหมด รอให้รถวิ่งต่อ", feedback: "รถหยุดแล้ว จึงไม่มีพลังงานการเคลื่อนที่เหลืออยู่ พลังงานถูกถ่ายโอนออกไปแล้ว" }
    hints:
      - "หลังชน เราได้ยินอะไร และเห็นอะไรเปลี่ยนไป"
      - "เมื่อการเคลื่อนที่เปลี่ยน แสดงว่ามีพลังงานถ่ายโอนเข้าหรือออก"
    solution: "เมื่อรถหยุด พลังงานการเคลื่อนที่ถูกถ่ายโอนออกไป กลายเป็นเสียงที่ได้ยิน ความร้อนเล็กน้อยที่รถและกำแพง และใช้ไปในการทำให้รถบุบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.energy-electricity-intro.p011
    topics: [physics.energy.energy-electricity-intro]
    difficulty: 3
    type: numeric
    stem: "พัดลมตั้งพื้นเครื่องหนึ่งเปิดวันละ 8 ชั่วโมง ใช้ไฟฟ้าวันละ 0.4 หน่วย ถ้าเปิดแบบนี้ทุกวันเป็นเวลา 30 วัน จะใช้ไฟฟ้ากี่หน่วย (ตอบเป็นจำนวนหน่วย)"
    answer: { value: 12, tolerance: 0.05, unit: หน่วย }
    hints:
      - "โจทย์บอกการใช้ไฟต่อวันมาแล้ว ไม่ต้องใช้จำนวนชั่วโมง"
      - "คูณการใช้ไฟต่อวันด้วยจำนวนวัน"
    misconceptions:
      - { match: 3.2, feedback: "ดูเหมือนนำ 0.4 คูณ 8 ชั่วโมง แต่ 0.4 หน่วยเป็นค่าต่อวันอยู่แล้ว ต้องคูณจำนวนวัน" }
      - { match: 240, feedback: "นั่นคือจำนวนชั่วโมงทั้งหมด (8 × 30) ไม่ใช่จำนวนหน่วยไฟฟ้า" }
    solution: "ใช้ไฟ $0.4 \\times 30 = 12$ หน่วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.energy-electricity-intro.p012
    topics: [physics.energy.energy-electricity-intro]
    difficulty: 4
    type: numeric
    stem: "กราฟแท่งด้านขวาแสดงพลังงานจลน์ของรถของเล่นมวล 2 kg ที่ความเร็ว 1, 2 และ 3 m/s ถ้ารถคันเดิมวิ่งเร็ว 4 m/s จะมีพลังงานจลน์กี่จูล (ตอบในหน่วย J)"
    figure: { src: ke-bars.svg, alt: "กราฟแท่งสองกราฟ กราฟซ้ายชื่อความเร็วเท่ากัน 1 m/s: มวล 2 kg พลังงาน 1 J มวล 4 kg พลังงาน 2 J มวล 6 kg พลังงาน 3 J กราฟขวาชื่อมวลเท่ากัน 2 kg: ความเร็ว 1 m/s พลังงาน 1 J ความเร็ว 2 m/s พลังงาน 4 J ความเร็ว 3 m/s พลังงาน 9 J" }
    answer: { value: 16, unit: J }
    hints:
      - "ดูกราฟขวา ความเร็ว 1, 2, 3 ให้พลังงาน 1, 4, 9 ตัวเลขชุดนี้คืออะไร"
      - "1 = 1 × 1, 4 = 2 × 2, 9 = 3 × 3"
    misconceptions:
      - { match: 14, feedback: "ดูเหมือนบวกเพิ่ม 5 เท่ากับครั้งก่อน แต่ระยะห่างของแท่งเพิ่มขึ้นเรื่อย ๆ (3 แล้ว 5) ลองดูว่า 1, 4, 9 เป็นเลขชุดอะไร" }
      - { match: 8, feedback: "ดูเหมือนคิดว่าพลังงานเพิ่มเท่ากับความเร็ว ความเร็ว 4 เป็น 2 เท่าของความเร็ว 2 แต่พลังงานเพิ่มเป็น 4 เท่า ไม่ใช่ 2 เท่า" }
    solution: "พลังงานในกราฟขวาเท่ากับความเร็วคูณตัวเอง (1, 4, 9) ที่ความเร็ว 4 m/s พลังงาน $= 4 \\times 4 = 16$ J (หรือ: ความเร็วเพิ่มจาก 2 เป็น 4 คือ 2 เท่า พลังงานเพิ่ม 4 เท่า จาก 4 J เป็น 16 J)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.energy-electricity-intro.p013
    topics: [physics.energy.energy-electricity-intro]
    difficulty: 4
    type: numeric
    stem: "จากกราฟแท่งด้านซ้าย รถที่วิ่งเร็ว 1 m/s เท่ากันทุกคันมีมวล 2, 4 และ 6 kg ถ้ารถมวล 8 kg วิ่งเร็ว 1 m/s เท่ากัน จะมีพลังงานจลน์กี่จูล (ตอบในหน่วย J)"
    figure: { src: ke-bars.svg, alt: "กราฟแท่งสองกราฟ กราฟซ้ายชื่อความเร็วเท่ากัน 1 m/s: มวล 2 kg พลังงาน 1 J มวล 4 kg พลังงาน 2 J มวล 6 kg พลังงาน 3 J กราฟขวาชื่อมวลเท่ากัน 2 kg: ความเร็ว 1 m/s พลังงาน 1 J ความเร็ว 2 m/s พลังงาน 4 J ความเร็ว 3 m/s พลังงาน 9 J" }
    answer: { value: 4, unit: J }
    hints:
      - "มวลเพิ่มทีละ 2 kg พลังงานเพิ่มทีละเท่าไร"
      - "มวลเพิ่มเป็น 2 เท่า พลังงานเพิ่มเป็น 2 เท่า"
    misconceptions:
      - { match: 16, feedback: "ดูเหมือนใช้แบบรูปของความเร็ว (คูณตัวเอง) กับมวล กราฟซ้ายเพิ่มทีละเท่ากัน พลังงานเพิ่มตามมวลตรง ๆ" }
      - { match: 8, feedback: "8 คือมวล ไม่ใช่พลังงาน ในกราฟซ้าย พลังงานเป็นครึ่งหนึ่งของตัวเลขมวล" }
    solution: "กราฟซ้ายเพิ่มขึ้นสม่ำเสมอ มวล 2, 4, 6 kg ให้ 1, 2, 3 J คือพลังงานเป็นครึ่งหนึ่งของมวล มวล 8 kg จึงมีพลังงาน $8 \\div 2 = 4$ J"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.energy-electricity-intro.p014
    topics: [physics.energy.energy-electricity-intro]
    difficulty: 4
    type: mcq
    stem: "เมื่อกดสวิตช์ไฟฉายแล้วหลอดไฟสว่าง คำอธิบายใดบอกขั้นตอนที่เกิดขึ้นจริงได้ชัดเจนที่สุด"
    choices:
      - { id: a, text: "สวิตช์ทำให้วงจรครบรอบ กระแสไฟฟ้าจากถ่านไฟฉายไหลผ่านไส้หลอด ไส้หลอดร้อนจนเปล่งแสง", correct: true }
      - { id: b, text: "พลังงานไปที่หลอดไฟ หลอดไฟจึงสว่าง", feedback: "ถูกแต่ไม่บอกว่าเกิดอะไรขึ้นระหว่างทาง ควรอธิบายกลไก เช่น วงจรครบรอบ กระแสไฟฟ้าไหล ไส้หลอดร้อน" }
      - { id: c, text: "สวิตช์ปล่อยแสงที่เก็บไว้ในถ่านไฟฉายออกมา", feedback: "ถ่านไฟฉายไม่ได้เก็บแสง ถ่านเก็บพลังงานเคมีซึ่งให้กระแสไฟฟ้า แสงเกิดขึ้นที่หลอดไฟ" }
    hints:
      - "คำอธิบายที่ดีบอกว่าแต่ละส่วนทำอะไรตามลำดับ"
      - "สวิตช์ → วงจร → กระแสไฟฟ้า → ไส้หลอด"
    solution: "ข้อ ก อธิบายกลไกทีละขั้น: สวิตช์ปิดวงจรให้ครบรอบ กระแสไฟฟ้าไหลจากถ่านผ่านไส้หลอด ไส้หลอดร้อนจัดจนเปล่งแสง ส่วนคำว่า พลังงานไปที่หลอดไฟ ไม่ได้บอกว่าเกิดขึ้นได้อย่างไร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.energy-electricity-intro.p015
    topics: [physics.energy.energy-electricity-intro]
    difficulty: 4
    type: mcq
    stem: "แผงโซลาร์เซลล์บนหลังคาบ้านผลิตไฟฟ้าต่างจากโรงไฟฟ้าพลังน้ำอย่างไร"
    choices:
      - { id: a, text: "แผงโซลาร์เซลล์เปลี่ยนแสงเป็นไฟฟ้าโดยตรง ไม่ต้องหมุนกังหันหรือเครื่องกำเนิดไฟฟ้า", correct: true }
      - { id: b, text: "แผงโซลาร์เซลล์ใช้แสงแดดต้มน้ำให้เป็นไอแล้วหมุนกังหัน", feedback: "แผงโซลาร์เซลล์บนหลังคาไม่มีส่วนที่หมุนและไม่ได้ต้มน้ำ แสงทำให้เกิดไฟฟ้าในแผ่นเซลล์ได้เลย" }
      - { id: c, text: "ไม่ต่างกัน ทั้งสองแบบใช้แม่เหล็กหมุนในขดลวด", feedback: "โรงไฟฟ้าพลังน้ำใช้แม่เหล็กหมุนในขดลวด แต่แผงโซลาร์เซลล์ไม่มีแม่เหล็กหมุน" }
    hints:
      - "โรงไฟฟ้าพลังน้ำต้องมีอะไรหมุน"
      - "แผงโซลาร์เซลล์มีส่วนที่เคลื่อนไหวหรือไม่"
    solution: "โรงไฟฟ้าพลังน้ำใช้น้ำหมุนกังหันและเครื่องกำเนิดไฟฟ้า ส่วนแผงโซลาร์เซลล์เปลี่ยนพลังงานแสงเป็นพลังงานไฟฟ้าโดยตรง ไม่มีส่วนที่หมุน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.energy.energy-electricity-intro.p016
    topics: [physics.energy.energy-electricity-intro]
    difficulty: 5
    type: numeric
    stem: "ตู้เย็นรุ่นเก่าใช้ไฟฟ้าปีละ 500 หน่วย ตู้เย็นใหม่ฉลากเบอร์ 5 ขนาดเท่ากันใช้ไฟฟ้าปีละ 300 หน่วย ถ้าค่าไฟหน่วยละ 4 บาท เปลี่ยนเป็นตู้เย็นใหม่จะประหยัดค่าไฟได้ปีละกี่บาท (ตอบเป็นจำนวนบาท)"
    answer: { value: 800, unit: บาท }
    hints:
      - "หาก่อนว่าประหยัดไฟได้ปีละกี่หน่วย"
      - "นำจำนวนหน่วยที่ประหยัดได้คูณค่าไฟต่อหน่วย"
    misconceptions:
      - { match: 200, feedback: "200 คือจำนวนหน่วยไฟฟ้าที่ประหยัดได้ ยังต้องคูณค่าไฟหน่วยละ 4 บาท" }
      - { match: 3200, feedback: "ดูเหมือนนำหน่วยไฟของตู้เย็นสองเครื่องมาบวกกัน ต้องหาผลต่างของหน่วยไฟ ไม่ใช่ผลรวม" }
    solution: "ประหยัดไฟ $500 - 300 = 200$ หน่วยต่อปี ประหยัดเงิน $200 \\times 4 = 800$ บาทต่อปี"
