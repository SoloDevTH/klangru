- id: chinese.vocab.greetings.p016
  topics:
  - chinese.vocab.greetings
  difficulty: 4
  type: mcq
  stem: เพื่อนชาวจีนช่วยถือกระเป๋าให้ ข้อใดเป็นการ **ขอบคุณ** หรือ **ตอบคำขอบคุณ** ที่ถูกต้อง (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: เราพูด 对不起！ เพื่อขอบคุณ
    feedback: 对不起 คือขอโทษ ไม่ใช่ขอบคุณ
  - id: b
    text: เราพูด 谢谢你！ แล้วเพื่อนตอบ 不客气！
    correct: true
    feedback: ถูก
  - id: c
    text: เราพูด 谢谢！ แล้วเพื่อนตอบ 不用谢！
    correct: true
    feedback: ถูก 不用谢 bú yòng xiè แปลว่า ไม่ต้องขอบคุณ
  - id: d
    text: เราพูด 谢谢！ แล้วเพื่อนตอบ 没关系！
    feedback: 没关系 ใช้ตอบคำขอโทษ คนไทยมักใช้ผิดเพราะภาษาไทยตอบทั้งสองแบบว่า ไม่เป็นไร
  hints:
  - คำขอบคุณคือ 谢谢 และอาจเพิ่ม 你 ข้างหลัง
  - คำตอบคำขอบคุณมี 2 แบบที่ขึ้นต้นด้วย 不
  solution: 'ขอบคุณ: 谢谢 / 谢谢你 · ตอบ: **不客气** หรือ **不用谢** ส่วน 没关系 ใช้ตอบ 对不起'
