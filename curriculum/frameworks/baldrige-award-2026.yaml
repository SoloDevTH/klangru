# 2026 Baldrige Award Criteria (Alliance for Performance Excellence ดำเนินการแทน NIST / กระทรวงพาณิชย์สหรัฐฯ)
#
# ที่มา (ตรวจเมื่อ 2026-10-24)
# - Baldrige Excellence Framework ฉบับ 2026 (Baldrige Foundation เผยแพร่ 13 ส.ค. 2026) ขายเป็นเล่ม เราไม่ได้อ่านฉบับเต็ม
#   หน้า NIST ระบุว่าฉบับ 2026 มี Maturity Pathways ชุดคำถามรายหมวด ค่านิยมหลัก และเกณฑ์ให้คะแนน
# - ไฟล์นี้ใช้ "2026 Award Criteria" (PDF 23 หน้า ฟรี) ของ Alliance for Performance Excellence ซึ่งระบุว่าคำถามรางวัล
#   มาจากเฟรมเวิร์กแต่ไม่จำเป็นต้องตรงกันหนึ่งต่อหนึ่ง โครงฉบับ 2026 เหลือหกหมวด (ยุบหมวดผลลัพธ์เดิมเข้าไปในแต่ละหมวด
#   และเปลี่ยนชื่อหมวด 4 เป็น Organizational Intelligence) ต่างจาก TQA 2567-2568 ที่ยังใช้เจ็ดหมวดตาม Baldrige 2023-2024
# - หน้า NIST ไม่มีข้อความลิขสิทธิ์ของเฟรมเวิร์ก PDF ของ Alliance ไม่มีข้อความลิขสิทธิ์หรือสัญญาอนุญาต
#
# รหัสและข้อความ (เราตั้งเอง ต้นฉบับใช้เลขข้อคำถามในแต่ละหมวด)
# - "<หมวด>.R" = คำถามผลลัพธ์ทั้งหมดของหมวดนั้นสรุปเป็นข้อเดียว, "<หมวด>.P<n>" = คำถามกระบวนการข้อที่ n ของหมวด
# - "OP.D" / "OP.S" = คำถามโครงร่างองค์กร (Organizational Description / Organizational Situation) ซึ่งไม่ถูกประเมินคะแนน
# - ข้อความทุกข้อเป็นการสรุปด้วยคำของคลังรู้ ไม่ใช่คำแปลของคำถาม
id: baldrige-award-2026
title: "2026 Baldrige Award Criteria (Baldrige National Quality Award, administered by the Alliance for Performance Excellence)"
short: Baldrige 2026
kind: international-standard
subjects: [management]
language: th
sources:
  - { title: "2026 Baldrige Award Criteria", url: "https://baldrigealliance.org/wp-content/uploads/2026/03/2026-Baldrige-Award-Criteria.pdf", publisher: "Alliance for Performance Excellence", retrieved: "2026-10-24", pages: "2-20" }
  - { title: "Baldrige Excellence Framework", url: "https://www.nist.gov/baldrige/publications/baldrige-excellence-framework", publisher: "National Institute of Standards and Technology (NIST)", retrieved: "2026-10-24" }
copyright: "เฟรมเวิร์ก Baldrige ฉบับเต็มเป็นสิ่งพิมพ์ที่ขาย (Baldrige Excellence Framework® เป็นเครื่องหมายการค้า) และเอกสาร Award Criteria ของ Alliance for Performance Excellence (องค์กรเอกชนไม่แสวงกำไร) ไม่มีสัญญาอนุญาตให้นำไปใช้ซ้ำ จึงถือว่าสงวนลิขสิทธิ์ ไฟล์นี้เก็บเฉพาะโครงหมวดและสรุปด้วยคำของคลังรู้"
completeness: structure-and-summary
strands:
  - id: OP
    title: "Organizational Profile (โครงร่างองค์กร ไม่ประเมินคะแนน)"
    standards:
      - id: OP
        text: "ข้อมูลบริบทที่ผู้ตรวจใช้ตีความหมวดอื่น"
        indicators:
          - { id: "OP.D", text: "ลักษณะองค์กร: ผลิตภัณฑ์และบริการ ขนาดตลาด พันธกิจ วิสัยทัศน์ ค่านิยม วัฒนธรรม โครงสร้างบุคลากร กฎระเบียบ การกำกับดูแล ชุมชน และกลุ่มลูกค้ากับความต้องการ" }
          - { id: "OP.S", text: "สภาวการณ์ขององค์กร: ความท้าทายและความได้เปรียบเชิงกลยุทธ์ (รวมถึงปัญญาประดิษฐ์) วัตถุประสงค์เชิงกลยุทธ์ ตัววัดทางการเงิน และแหล่งข้อมูลเปรียบเทียบ" }
  - id: "1"
    title: "1 Leadership (การนำองค์กร)"
    standards:
      - id: "1"
        text: "ผู้นำระดับสูง การกำกับดูแล และการตอบแทนสังคม"
        indicators:
          - { id: "1.R", text: "ผลลัพธ์: การสื่อสารสองทางของผู้นำ ผลการตรวจสอบด้านการกำกับดูแล ข้อร้องเรียนด้านความปลอดภัย ความเท่าเทียม และจริยธรรม และตัวชี้วัดการตอบแทนสังคม เช่น การลดพลังงานและของเสีย" }
          - { id: "1.P1", text: "ผู้นำกำหนดและถ่ายทอดพันธกิจ วิสัยทัศน์ และค่านิยมผ่านระบบการนำ" }
          - { id: "1.P2", text: "กระบวนการสื่อสารสองทางระหว่างผู้นำกับบุคลากร" }
          - { id: "1.P3", text: "ผู้นำสร้างสภาพแวดล้อมสำหรับความสำเร็จทั้งปัจจุบันและอนาคต" }
          - { id: "1.P4", text: "การวางแผนสืบทอดตำแหน่งผู้นำ" }
          - { id: "1.P5", text: "การกำกับดูแลที่รับผิดชอบ: ความรับผิดชอบของผู้บริหาร ความรับผิดชอบทางการเงิน และความโปร่งใส" }
          - { id: "1.P6", text: "การสนับสนุนชุมชนที่สำคัญ" }
  - id: "2"
    title: "2 Strategy (กลยุทธ์)"
    standards:
      - id: "2"
        text: "การวางแผนเชิงกลยุทธ์และผลด้านตลาดและการเงิน"
        indicators:
          - { id: "2.R", text: "ผลลัพธ์: ผลด้านตลาด ความมั่นคงทางการเงิน (สภาพคล่อง เงินสำรอง อันดับเครดิต) และผลการเงิน เช่น รายได้ อัตรากำไร และผลเทียบงบประมาณ" }
          - { id: "2.P1", text: "กระบวนการวางแผนเชิงกลยุทธ์" }
          - { id: "2.P2", text: "การจัดทำและถ่ายทอดแผนปฏิบัติการให้บรรลุวัตถุประสงค์เชิงกลยุทธ์" }
          - { id: "2.P3", text: "การประเมินประสิทธิผลของกลยุทธ์และการนำแผนไปปฏิบัติ" }
          - { id: "2.P4", text: "การหาโอกาสเชิงกลยุทธ์และการสร้างนวัตกรรมผ่านแผนกลยุทธ์" }
          - { id: "2.P5", text: "การประเมินนวัตกรรมและการเปลี่ยนแปลงทางเทคโนโลยี รวมถึงปัญญาประดิษฐ์ ที่กระทบผลิตภัณฑ์ บริการ และตลาด" }
          - { id: "2.P6", text: "การจัดหาเงินทุนสำหรับความต้องการระยะสั้น ช่วงวิกฤต และความสำเร็จระยะยาว" }
  - id: "3"
    title: "3 Customers (ลูกค้า)"
    standards:
      - id: "3"
        text: "การรับฟังและสร้างความผูกพันกับลูกค้า"
        indicators:
          - { id: "3.R", text: "ผลลัพธ์: ความพึงพอใจ ความไม่พึงพอใจรวมถึงการจัดการข้อร้องเรียน และความผูกพันของลูกค้าแยกตามกลุ่ม" }
          - { id: "3.P1", text: "การรับฟัง โต้ตอบ และสังเกตลูกค้าเพื่อได้ข้อมูลป้อนกลับที่นำไปใช้ได้" }
          - { id: "3.P2", text: "การสร้างความผูกพัน ได้มาและรักษาลูกค้า และจัดการความสัมพันธ์" }
          - { id: "3.P3", text: "การสนับสนุนลูกค้าในการหาข้อมูลและขอความช่วยเหลือ" }
          - { id: "3.P4", text: "การจัดการข้อร้องเรียน การฟื้นความเชื่อมั่น และการป้องกันข้อร้องเรียนซ้ำ" }
  - id: "4"
    title: "4 Organizational Intelligence (การวัด การวิเคราะห์ และการจัดการความรู้ เดิม)"
    standards:
      - id: "4"
        text: "การใช้ข้อมูลทบทวนผลการดำเนินการ ปรับปรุง และสร้างนวัตกรรม"
        indicators:
          - { id: "4.P1", text: "การติดตาม วิเคราะห์ และทบทวนผลการดำเนินการและขีดความสามารถขององค์กร" }
          - { id: "4.P2", text: "การใช้ผลการทบทวนกำหนดลำดับความสำคัญของการปรับปรุงต่อเนื่องและโอกาสสร้างนวัตกรรม" }
          - { id: "4.P3", text: "การตัดสินใจว่าจะดำเนินหรือหยุดโอกาสนวัตกรรมใด" }
          - { id: "4.P4", text: "การรวบรวมและแบ่งปันสารสนเทศแก่บุคลากรและผู้มีส่วนได้ส่วนเสีย" }
  - id: "5"
    title: "5 Workforce (บุคลากร)"
    standards:
      - id: "5"
        text: "ความผูกพัน การพัฒนา และความพร้อมของบุคลากร"
        indicators:
          - { id: "5.R", text: "ผลลัพธ์: วัฒนธรรมที่เกื้อหนุน ความพึงพอใจ ความผูกพัน อัตราการลาออก การพัฒนาผู้นำ และการฝึกอบรมบุคลากร" }
          - { id: "5.P1", text: "การสร้างวัฒนธรรมความผูกพันและผลการปฏิบัติงานสูง" }
          - { id: "5.P2", text: "การพัฒนา การเรียนรู้ และความก้าวหน้าในอาชีพของบุคลากร" }
          - { id: "5.P3", text: "การเตรียมความพร้อมของบุคลากรต่อการเปลี่ยนแปลงขีดความสามารถและอัตรากำลัง รวมถึงเทคโนโลยีใหม่และปัญญาประดิษฐ์" }
  - id: "6"
    title: "6 Operations (การปฏิบัติการ)"
    standards:
      - id: "6"
        text: "ผลิตภัณฑ์ กระบวนการทำงาน เครือข่ายอุปทาน และความเสี่ยง"
        indicators:
          - { id: "6.R", text: "ผลลัพธ์: ผลการดำเนินการของผลิตภัณฑ์และบริการ ประสิทธิภาพและประสิทธิผลของกระบวนการ ผลของเครือข่ายอุปทาน ความมั่นคงปลอดภัยไซเบอร์ และอุบัติการณ์ด้านความปลอดภัย" }
          - { id: "6.P1", text: "การกำหนดข้อกำหนดของผลิตภัณฑ์ บริการ หรือโครงการ" }
          - { id: "6.P2", text: "การออกแบบผลิตภัณฑ์และบริการให้ตรงข้อกำหนด" }
          - { id: "6.P3", text: "การจัดการและปรับปรุงประสิทธิภาพและประสิทธิผลของกระบวนการทำงานหลักและสนับสนุน" }
          - { id: "6.P4", text: "การจัดการเครือข่ายอุปทาน รวมถึงการคัดเลือกผู้ส่งมอบ" }
          - { id: "6.P5", text: "การบริหารความเสี่ยง การเตรียมพร้อมรับภาวะฉุกเฉิน และความต่อเนื่องของการดำเนินงาน" }
          - { id: "6.P6", text: "การจัดการความมั่นคงปลอดภัยไซเบอร์" }
          - { id: "6.P7", text: "การจัดสภาพแวดล้อมการทำงานที่ปลอดภัยสำหรับบุคลากรและผู้อื่น" }
