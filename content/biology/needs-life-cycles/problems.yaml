      - "เทียบเวลานั้นกับ 14 วัน"
    solution: "ยุงใช้ราว $2 + 5 + 2 = 9$ วัน ซึ่งน้อยกว่า 14 วัน ยุงจึงออกไปได้ก่อนเปลี่ยนน้ำ การเปลี่ยนทุก 7 วันได้ผลเพราะ 7 น้อยกว่า 9 ตัดวัฏจักรก่อนเป็นยุง"
