<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="sans-serif">
<title>แก้ข้อความถึงครูให้ถูกต้อง ชัดเจน เหมาะสม</title>
<defs><marker id="a555" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="0" y="0" width="860" height="430" fill="#fff"/>
<text x="20.0" y="34.0" font-size="21" text-anchor="start" fill="#1f5fbf" font-weight="bold">แก้ข้อความถึงครูก่อนกดส่ง</text>
<rect x="20.0" y="56.0" width="380.0" height="200.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="36.0" y="86.0" font-size="18" text-anchor="start" fill="#c0392b" font-weight="bold">ก่อนแก้</text>
<text x="36.0" y="126.0" font-size="20" text-anchor="start" fill="#111" font-weight="normal">ครูคะ งานพรุ่งนี้ยกเลิกใช่มั้ยคะ</text>
<text x="36.0" y="160.0" font-size="20" text-anchor="start" fill="#111" font-weight="normal">เยอะมากเลย</text>
<rect x="440.0" y="56.0" width="400.0" height="200.0" rx="12" fill="#e8f6ec" stroke="#1e8449" stroke-width="2"/>
<text x="456.0" y="86.0" font-size="18" text-anchor="start" fill="#1e8449" font-weight="bold">หลังแก้</text>
<text x="456.0" y="116.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">เรียน คุณครูสมใจ</text>
<text x="456.0" y="146.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">หนูทำการบ้านวิทยาศาสตร์ที่ต้องส่งพรุ่งนี้</text>
<text x="456.0" y="176.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">ไม่เสร็จ เพราะมี 20 ข้อ</text>
<text x="456.0" y="206.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">ขออนุญาตส่งวันศุกร์ได้ไหมคะ</text>
<text x="456.0" y="236.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">ขอบคุณค่ะ</text>
<line x1="404.0" y1="150.0" x2="436.0" y2="150.0" stroke="#555" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a555)"/>
<circle cx="38.0" cy="290.0" r="15.0" fill="#1f5fbf" stroke="#1f5fbf" stroke-width="1.5"/>
<text x="38.0" y="296.0" font-size="17" text-anchor="middle" fill="#fff" font-weight="bold">1</text>
<text x="64.0" y="296.0" font-size="19" text-anchor="start" fill="#1f5fbf" font-weight="bold">ชัดเจน</text>
<text x="210.0" y="296.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">"งาน" → การบ้านวิทยาศาสตร์ · "เยอะ" → 20 ข้อ</text>
<circle cx="38.0" cy="336.0" r="15.0" fill="#1f5fbf" stroke="#1f5fbf" stroke-width="1.5"/>
<text x="38.0" y="342.0" font-size="17" text-anchor="middle" fill="#fff" font-weight="bold">2</text>
<text x="64.0" y="342.0" font-size="19" text-anchor="start" fill="#1f5fbf" font-weight="bold">ถูกความหมาย</text>
<text x="210.0" y="342.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">"ยกเลิก" ไม่ใช่สิ่งที่อยากถาม → ขออนุญาตส่งวันศุกร์</text>
<circle cx="38.0" cy="382.0" r="15.0" fill="#1f5fbf" stroke="#1f5fbf" stroke-width="1.5"/>
<text x="38.0" y="388.0" font-size="17" text-anchor="middle" fill="#fff" font-weight="bold">3</text>
<text x="64.0" y="388.0" font-size="19" text-anchor="start" fill="#1f5fbf" font-weight="bold">เหมาะกับผู้อ่าน</text>
<text x="210.0" y="388.0" font-size="18" text-anchor="start" fill="#111" font-weight="normal">มีคำขึ้นต้น "เรียน" และคำขอบคุณ · "มั้ย" → "ไหม"</text>
</svg>
