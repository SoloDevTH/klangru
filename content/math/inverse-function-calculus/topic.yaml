id: math.calculus.inverse-function-calculus
subject: math
title: { th: อนุพันธ์ของฟังก์ชันผกผันและปริพันธ์ที่ให้ลอการิทึมและตรีโกณมิติผกผัน, en: Derivatives of inverse functions and integrals giving logarithms and inverse trigonometric functions }
summary: หาอนุพันธ์ของฟังก์ชันผกผันและฟังก์ชันตรีโกณมิติผกผัน และคำนวณปริพันธ์ที่ให้ลอการิทึม ฟังก์ชันตรีโกณมิติผกผัน รวมถึงการเปลี่ยนแปลงสุทธิ
difficulty: 7.5
minutes: 40
prerequisites: [math.calculus.differentiation-rules, math.calculus.definite-integral, math.functions.inverse, math.functions.trig-functions]
encompasses:
  - { id: math.calculus.differentiation-rules, weight: 0.4 }
  - { id: math.calculus.definite-integral, weight: 0.3 }
  - { id: math.functions.trig-functions, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: inverse-reflection.svg
    alt: "กราฟ y เท่ากับ e ยกกำลัง x ผ่านจุด (0, 1) และกราฟ y เท่ากับ ln x ผ่านจุด (1, 0) สองเส้นสะท้อนกันข้ามเส้นประ y เท่ากับ x"
    caption: "จุด $(a,b)$ บนกราฟของ $f$ สลับเป็นจุด $(b,a)$ บนกราฟของ $f^{-1}$ ความชันก็กลับเป็นส่วนกลับ"
  - { type: explanation, file: lesson.md }
  - type: interactive
    title: กราฟของ 1 หารด้วยรากของ (1 ลบ x กำลังสอง)
    caption: "กราฟนี้คืออนุพันธ์ของ arcsin x สังเกตว่าค่าพุ่งขึ้นไม่สิ้นสุดเมื่อ x เข้าใกล้ 1 หรือ -1 เพราะตัวส่วนเข้าใกล้ศูนย์"
    widget:
      kind: function-plot
      functions: ["\\frac{1}{\\sqrt{1 - x^2}}"]
      x: [-1, 1]
      y: [0, 4]
  - type: worked-example
    title: หาอนุพันธ์ของฟังก์ชันผกผันที่จุดหนึ่ง
    problem: "กำหนด $f(x)=x^3+3x$ จงหา $(f^{-1})'(4)$"
    steps:
      - text: "หา $f^{-1}(4)$ โดยหา $x$ ที่ทำให้ $x^3+3x=4$ ซึ่งคือ $x=1$ เพราะ $1+3=4$"
        why: "ฟังก์ชันผกผันรับค่าผลลัพธ์แล้วคืนอินพุต"
      - text: "หาอนุพันธ์ $f'(x)=3x^2+3$ จึงได้ $f'(1)=6$"
        why: "ต้องประเมินอนุพันธ์ของ $f$ ที่จุด $f^{-1}(4)$ ไม่ใช่ที่จุด $4$"
      - text: "ใช้สูตร $(f^{-1})'(4)=\\frac{1}{f'(1)}=\\frac{1}{6}$"
    answer: "$(f^{-1})'(4)=\\frac{1}{6}$"
  - { type: check, problem: math.calculus.inverse-function-calculus.p002, prompt: "ลองนึกว่าอนุพันธ์ของ arcsin ต่างจาก arccos อย่างไร" }
  - type: worked-example
    title: เติมกำลังสองแล้วได้อาร์กแทนเจนต์
    problem: "จงหา $\\int_0^1\\frac{dx}{x^2+2x+5}$"
    steps:
      - text: "เติมกำลังสอง $x^2+2x+5=(x+1)^2+4$"
        why: "ตัวส่วนยังไม่อยู่ในรูป $u^2+a^2$ จึงต้องเติมกำลังสองก่อน"
      - text: "ใช้ $u=x+1$ จะได้ $\\int_1^2\\frac{du}{u^2+4}=\\left[\\frac{1}{2}\\arctan\\frac{u}{2}\\right]_1^2$"
        why: "ปริพันธ์ $\\int\\frac{du}{a^2+u^2}$ มีค่า $\\frac{1}{a}\\arctan\\frac{u}{a}$ โดย $a=2$"
      - text: "แทนค่าขอบเขต ได้ $\\frac{1}{2}\\left(\\arctan 1-\\arctan\\frac{1}{2}\\right)\\approx 0.1609$"
        why: "ขอบเขตบนและล่างต้องแปลงเป็นค่า $u$ ด้วย เมื่อ $x=0$ ได้ $u=1$ และ $x=1$ ได้ $u=2$"
    answer: "ค่าปริพันธ์ประมาณ $0.1609$"
  - { type: check, problem: math.calculus.inverse-function-calculus.p004, prompt: "ปริพันธ์นี้ได้ค่า $\\pi$ หารด้วยอะไร" }
glossary:
  - { term: ฟังก์ชันผกผัน, definition: "ฟังก์ชัน $f^{-1}$ ที่ย้อนกลับจากผลลัพธ์ของ $f$ ไปหาอินพุต กราฟของทั้งสองสะท้อนกันข้ามเส้น $y=x$" }
  - { term: ทฤษฎีบทการเปลี่ยนแปลงสุทธิ, definition: "ปริพันธ์จำกัดเขตของอนุพันธ์ของ $F$ เท่ากับ $F(b)-F(a)$ ซึ่งคือการเปลี่ยนแปลงสุทธิของ $F$" }
  - { term: การเติมกำลังสอง, definition: "การเขียนพหุนามกำลังสองให้อยู่ในรูป $(x+h)^2+k$ เพื่อใช้สูตรปริพันธ์ของตรีโกณมิติผกผัน" }
  - { term: ฟังก์ชันคู่และคี่, definition: "ฟังก์ชันคู่มี $f(-x)=f(x)$ และฟังก์ชันคี่มี $f(-x)=-f(x)$ ใช้ลดงานการหาปริพันธ์บนช่วงสมมาตร" }
flashcards:
  - { front: "สูตรอนุพันธ์ของฟังก์ชันผกผัน", back: "$(f^{-1})'(a)=\\frac{1}{f'(f^{-1}(a))}$" }
  - { front: "อนุพันธ์ของ $\\arccos x$", back: "$-\\frac{1}{\\sqrt{1-x^2}}$ มีเครื่องหมายลบ" }
  - { front: "ปริพันธ์ $\\int\\frac{du}{a^2+u^2}$", back: "$\\frac{1}{a}\\arctan\\frac{u}{a}+C$" }
  - { front: "ปริพันธ์ของฟังก์ชันคี่บนช่วง $[-a,a]$", back: "เท่ากับ 0 และถ้าเป็นฟังก์ชันคู่จะเท่ากับ $2\\int_0^a f(x)\\,dx$" }
