<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" font-family="sans-serif" font-size="14">
<title>ต้นไม้ความผิดพลาดแบบประตู OR สองขา</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15211e"/></marker></defs>
<rect x="0" y="0" width="680" height="430" fill="#ffffff"/>
<text x="340.0" y="34.0" text-anchor="middle" font-size="16" fill="#15211e" font-weight="bold">ต้นไม้ความผิดพลาดของการไหลของน้ำหยุด</text>
<rect x="170.0" y="60.0" width="340.0" height="52.0" rx="6" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="2"/>
<text x="340.0" y="84.0" text-anchor="middle" font-size="14" fill="#15211e" font-weight="bold">การไหลของน้ำหยุด (เหตุการณ์ยอด)</text>
<text x="340.0" y="102.0" text-anchor="middle" font-size="12" fill="#555555">P ≈ 6.9% (ค่าสมมติเพื่อการสอน)</text>
<line x1="340.0" y1="112.0" x2="340.0" y2="150.0" stroke="#15211e" stroke-width="2"/>
<rect x="300.0" y="150.0" width="80.0" height="40.0" rx="4" fill="#ffffff" stroke="#15211e" stroke-width="2"/>
<text x="340.0" y="176.0" text-anchor="middle" font-size="13" fill="#15211e" font-weight="bold">หรือ (OR)</text>
<line x1="340.0" y1="190.0" x2="340.0" y2="220.0" stroke="#15211e" stroke-width="2"/>
<line x1="180.0" y1="220.0" x2="500.0" y2="220.0" stroke="#15211e" stroke-width="2"/>
<line x1="180.0" y1="220.0" x2="180.0" y2="250.0" stroke="#15211e" stroke-width="2"/>
<line x1="500.0" y1="220.0" x2="500.0" y2="250.0" stroke="#15211e" stroke-width="2"/>
<rect x="90.0" y="250.0" width="180.0" height="64.0" rx="6" fill="#fff3e0" stroke="#b35c00" stroke-width="2"/>
<text x="180.0" y="276.0" text-anchor="middle" font-size="14" fill="#15211e">ไฟฟ้าขัดข้อง</text>
<text x="180.0" y="296.0" text-anchor="middle" font-size="13" fill="#555555">p = 0.02</text>
<rect x="410.0" y="250.0" width="180.0" height="64.0" rx="6" fill="#fff3e0" stroke="#b35c00" stroke-width="2"/>
<text x="500.0" y="276.0" text-anchor="middle" font-size="14" fill="#15211e">วาล์วติดค้าง</text>
<text x="500.0" y="296.0" text-anchor="middle" font-size="13" fill="#555555">p = 0.05</text>
<rect x="60.0" y="340.0" width="560.0" height="62.0" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="340.0" y="364.0" text-anchor="middle" font-size="13" fill="#15211e">ประตู AND (และ): เหตุการณ์ผลลัพธ์เกิดเมื่อทุกเหตุการณ์ย่อยเกิดพร้อมกัน</text>
<text x="340.0" y="386.0" text-anchor="middle" font-size="13" fill="#15211e">ถ้าเหตุการณ์อิสระต่อกัน P(AND) = p₁ × p₂ = 0.02 × 0.05 = 0.001</text>
</svg>
