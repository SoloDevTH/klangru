id: technology.living.self-care-household
subject: technology
title:
  th: งานช่วยเหลือตนเอง ครอบครัว และส่วนรวม
  en: Self-care, household and community work
summary: งานทั้งสามระดับตั้งแต่ตัวเองถึงส่วนรวม ลำดับขั้นตอนที่ถูกต้องและเหตุผลของแต่ละขั้น การเลือกวัสดุให้ตรงงานและประหยัด และความปลอดภัยของของมีคม ไฟฟ้า และสารทำความสะอาด
difficulty: 1.5
minutes: 25
prerequisites:
- health.safety.home-school-play
encompasses:
- id: health.safety.home-school-play
  weight: 0.2
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  title: งานช่วยเหลือ 3 ระดับ
  src: levels.svg
  alt: แผนภาพสามกล่องเรียงจากซ้ายไปขวา กล่องแรกคืองานช่วยตนเอง (แต่งกาย จัดกระเป๋าเรียน เก็บของเล่นเข้าที่ ล้างจานของตน) กล่องที่สองคืองานช่วยครอบครัว (กวาดและถูพื้น พับผ้าให้เรียบ รดน้ำต้นไม้ ทิ้งขยะให้ถูกที่) และกล่องที่สามคืองานส่วนรวม (เวรห้องเรียน ดูแลสวนโรงเรียน เก็บขยะในโรงเรียน) มีลูกศรชี้จากซ้ายไปขวา
- type: worked-example
  title: พับผ้าเช็ดตัวให้เรียบและเก็บเข้าที่
  problem: ผ้าเช็ดตัวตากจนแห้งสนิทแล้ว ต้องพับให้เรียบและเก็บเข้าตู้ จะทำอย่างไร
  steps:
  - text: ดึงผ้าให้ตึงแล้วพับครึ่งตามยาวทั้งผืน
    why: ขอบสองข้างต้องตรงกันผ้าจึงเรียบและไม่ยับตรงกลาง
  - text: พับครึ่งอีกครั้งให้มุมทั้งสี่ตรงกัน
    why: มุมที่ตรงกันทำให้กองผ้าเป็นระเบียบและเก็บได้พอดี
  - text: พับเป็นชั้นให้ความกว้างเท่ากับช่องในตู้ แล้ววางไว้ที่เดิม
    why: การเก็บที่เดิมทำให้หาของได้เร็วและไม่เกะกะ
  answer: พับตามยาวสองครั้งให้ขอบตรงกัน แล้วเก็บเป็นชั้นให้พอดีกับช่องตู้
- type: check
  problem: technology.living.self-care-household.p002
  prompt: ลองนึกถึงกรรไกรที่บ้านของคุณก่อนตอบ
- type: worked-example
  title: คำนวณผงซักฟอกสำหรับผ้าหลายชุด
  problem: ฉลากบอกให้ใช้ผงซักฟอก 30 กรัมต่อผ้า 3 กิโลกรัม วันนี้มีผ้า 9 กิโลกรัม ต้องใช้กี่กรัม
  steps:
  - text: ดูว่าผ้า 9 กิโลกรัม เป็นกี่เท่าของ 3 กิโลกรัม 9 ÷ 3 = 3 ชุด
    why: ปริมาณผงซักฟอกต้องเพิ่มตามน้ำหนักผ้า ไม่ได้ใช้ค่าเดิมทุกครั้ง
  - text: นำจำนวนชุดคูณกับปริมาณต่อชุด 3 × 30 = 90 กรัม
  - text: ตรวจว่าคำตอบสมเหตุสมผล ผ้าเป็นสามเท่าของชุดแรก จึงควรใช้ผงซักฟอกเป็นสามเท่าด้วย
    why: การตรวจคำตอบด้วยเหตุผลช่วยจับการคูณหรือหารผิดได้
  answer: ต้องใช้ผงซักฟอก 90 กรัม
- type: check
  problem: technology.living.self-care-household.p013
  prompt: ลองดูว่าสารเคมีในบ้านของคุณเก็บไว้ที่ใด และเด็กเอื้อมถึงหรือไม่
glossary:
- term: งานช่วยเหลือตนเอง
  definition: งานที่ทำเพื่อดูแลตัวเอง เช่น แต่งกาย จัดกระเป๋า และล้างจานของตน
- term: งานช่วยครอบครัว
  definition: งานที่ทำเพื่อคนในบ้าน เช่น กวาดพื้น พับผ้า รดน้ำต้นไม้ และทิ้งขยะ
- term: งานส่วนรวม
  definition: งานที่ทำเพื่อคนหมู่มาก เช่น เวรทำความสะอาดห้องเรียน หรือดูแลสวนของโรงเรียน
- term: ฉลากผลิตภัณฑ์
  definition: ข้อความบนภาชนะที่บอกวิธีใช้ ปริมาณที่ควรใช้ และข้อควรระวังของผลิตภัณฑ์
- term: ของมีคม
  definition: เครื่องมือที่มีส่วนปลายหรือใบมีดที่อาจบาดได้ เช่น กรรไกร มีดปอกผลไม้ และคัตเตอร์
flashcards:
- front: งานช่วยเหลือแบ่งเป็นกี่ระดับ และอะไรบ้าง
  back: สามระดับ คือ งานช่วยตนเอง งานช่วยครอบครัว และงานส่วนรวม
- front: ส่งกรรไกรให้เพื่อนอย่างไรให้ปลอดภัย
  back: ปิดใบมีด จับที่ส่วนใบ แล้วหันด้ามให้ผู้รับ
- front: ทำไมจึงไม่ผสมน้ำยาฟอกขาวกับน้ำยาที่มีกรด
  back: เพราะเกิดแก๊สคลอรีนที่เป็นพิษ ต้องใช้ทีละชนิดและล้างให้สะอาดก่อน
- front: ใส่น้ำยาทำความสะอาดมากกว่าที่ฉลากบอก จะเกิดอะไร
  back: สิ้นเปลือง ล้างยากขึ้น และฟองไม่ได้ทำให้สะอาดขึ้น
