    solution: "นักเรียนบางคนไม่มีโทรศัพท์ ระบบที่ใช้ได้เฉพาะคนมีโทรศัพท์ทำให้เกิดความไม่เท่าเทียม จึงต้องมีทางเลือก เช่น แท็บเล็ตกลาง"
