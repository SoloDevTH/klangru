problems:
  - id: math.number.whole-add-sub.p001
    topics: [math.number.whole-add-sub]
    difficulty: 1
    type: numeric
    stem: "กรอบสิบช่องในภาพมีจุดอยู่แล้ว ต้องเติมจุดอีกกี่จุดจึงจะเต็ม 10 จุด (ตอบเป็นจำนวนจุด)"
    figure: { src: ten-frame-8.svg, alt: "กรอบสิบช่อง สองแถว แถวละห้าช่อง แถวบนมีจุดครบห้าช่อง แถวล่างมีจุดสามช่องทางซ้าย อีกสองช่องว่าง" }
    answer: { value: 2, unit: จุด }
    hints:
      - "นับจุดที่มีอยู่ก่อน"
      - "จำนวนนั้นบวกอะไรได้ 10 หรือนับช่องที่ว่าง"
    misconceptions:
      - { match: 8, feedback: "8 คือจำนวนจุดที่มีอยู่แล้ว ข้อนี้ถามจำนวนที่ต้องเติม" }
      - { match: 18, feedback: "นำ 8 กับ 10 มาบวกกัน ข้อนี้ถามว่า 8 บวกอะไรได้ 10" }
    solution: "มีจุด 8 จุด และ $8 + 2 = 10$ ต้องเติมอีก 2 จุด (ตรงกับช่องว่าง 2 ช่อง)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.whole-add-sub.p002
    topics: [math.number.whole-add-sub]
    difficulty: 1
    type: numeric
    stem: "ยายซื้อไข่ไก่ 6 ฟอง และไข่เป็ด 7 ฟอง ยายมีไข่ทั้งหมดกี่ฟอง (ตอบเป็นจำนวนฟอง)"
    answer: { value: 13, unit: ฟอง }
    hints:
      - "รวมไข่สองกลุ่ม ใช้การบวก"
      - "ลองคิด $6 + 6 + 1$ หรือทำให้เป็นสิบ"
    misconceptions:
      - { match: 1, feedback: "ใช้การลบ แต่โจทย์ให้รวมไข่สองกลุ่มเข้าด้วยกัน ต้องบวก" }
      - { match: 12, feedback: "$6 + 6 = 12$ แต่ไข่เป็ดมี 7 ฟอง ต้องบวกเพิ่มอีก 1" }
    solution: "$6 + 7 = 6 + 6 + 1 = 13$ ยายมีไข่ทั้งหมด 13 ฟอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.whole-add-sub.p003
    topics: [math.number.whole-add-sub]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "รู้ว่า $9 + 6 = 15$ ข้อใดเป็นจริงด้วย (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "$6 + 9 = 15$", correct: true }
      - { id: b, text: "$15 - 9 = 6$", correct: true }
      - { id: c, text: "$15 - 6 = 9$", correct: true }
      - { id: d, text: "$9 - 6 = 15$", feedback: "$9 - 6 = 3$ การลบต้องเอาทั้งหมด (15) เป็นตัวตั้ง" }
      - { id: e, text: "$6 - 9 = 15$", feedback: "การลบสลับที่ไม่ได้ และตัวตั้งต้องเป็นทั้งหมด 15" }
    hints:
      - "การบวกสลับที่ได้"
      - "ทั้งหมดคือ 15 ส่วนย่อยคือ 9 กับ 6 เอาทั้งหมดลบส่วนย่อยหนึ่งส่วน ได้อีกส่วน"
    solution: "ครอบครัวของ $9 + 6 = 15$ มี $6 + 9 = 15$, $15 - 9 = 6$ และ $15 - 6 = 9$ ส่วน $9 - 6$ และ $6 - 9$ ไม่ได้ 15"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.whole-add-sub.p004
    topics: [math.number.whole-add-sub]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ประโยคใดเป็นจริง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "$7 = 8 - 1$", correct: true }
      - { id: b, text: "$5 + 2 = 2 + 5$", correct: true }
      - { id: c, text: "$6 = 6$", correct: true }
      - { id: d, text: "$4 + 1 = 5 + 2$", feedback: "ข้างซ้ายเป็น 5 ข้างขวาเป็น 7 ไม่เท่ากัน เครื่องหมาย = ไม่ได้แปลว่า \"คำตอบคือ\"" }
      - { id: e, text: "$3 + 4 = 7 + 2$", feedback: "ข้างซ้ายเป็น 7 ข้างขวาเป็น 9 ทั้งสองข้างต้องมีค่าเท่ากัน" }
    hints:
      - "หาค่าของข้างซ้ายและข้างขวาแยกกัน"
      - "ประโยคเป็นจริงเมื่อสองข้างมีค่าเท่ากัน"
    solution: "$7 = 7$ จริง, $7 = 7$ จริง (สลับที่), $6 = 6$ จริง ส่วน $5 \\ne 7$ และ $7 \\ne 9$ เป็นเท็จ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.whole-add-sub.p005
    topics: [math.number.whole-add-sub]
    difficulty: 2
    type: numeric
    stem: "หาจำนวนที่แทน $\\square$ ใน $\\square + 25 = 63$"
    answer: { value: 38 }
    hints:
      - "63 คือทั้งหมด 25 คือส่วนย่อยหนึ่งส่วน"
      - "หาส่วนที่เหลือด้วยการลบ $63 - 25$"
    misconceptions:
      - { match: 88, feedback: "บวก 63 กับ 25 ลองแทนค่ากลับ $88 + 25$ ไม่ได้ 63 ต้องลบ" }
    solution: "$\\square = 63 - 25 = 38$ ตรวจ: $38 + 25 = 63$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.whole-add-sub.p006
    topics: [math.number.whole-add-sub]
    difficulty: 2
    type: numeric
    stem: "หาจำนวนที่แทน $\\square$ ใน $52 - \\square = 17$"
    answer: { value: 35 }
    hints:
      - "52 คือทั้งหมด ลบส่วนหนึ่งออกไปแล้วเหลือ 17"
      - "ส่วนที่ลบออกไป $= 52 - 17$"
    misconceptions:
      - { match: 69, feedback: "บวก 52 กับ 17 ลองแทนค่ากลับ $52 - 69$ ไม่ได้ 17" }
    solution: "$\\square = 52 - 17 = 35$ ตรวจ: $52 - 35 = 17$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.whole-add-sub.p007
    topics: [math.number.whole-add-sub]
    difficulty: 2
    type: numeric
    stem: "แม่ซื้อผัดกะเพรา 47 บาท และน้ำส้ม 36 บาท แม่จ่ายเงินทั้งหมดกี่บาท (ตอบในหน่วยบาท)"
    answer: { value: 83, unit: บาท }
    hints:
      - "ตั้งหลัก บวกหลักหน่วยก่อน $7 + 6$"
      - "ผลบวกหลักหน่วยถึง 10 ต้องทด 1 ไปหลักสิบ"
    misconceptions:
      - { match: 73, feedback: "ลืมทด $7 + 6 = 13$ เขียน 3 แล้วทด 1 ไปหลักสิบ" }
      - { match: 713, feedback: "เขียน 13 ลงในหลักหน่วยทั้งหมด ต้องเขียน 3 แล้วทด 1 ไปหลักสิบ" }
    solution: "หลักหน่วย $7 + 6 = 13$ เขียน 3 ทด 1 หลักสิบ $4 + 3 + 1 = 8$ ได้ 83 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.whole-add-sub.p008
    topics: [math.number.whole-add-sub]
    difficulty: 2
    type: numeric
    stem: "จำนวนที่น้อยกว่า 403 อยู่ 10 คือจำนวนใด (คิดในใจ)"
    answer: { value: 393 }
    hints:
      - "ลด 10 คือลดหลักสิบลง 1"
      - "หลักสิบของ 403 เป็น 0 ต้องกระจาย 1 ร้อยมาเป็น 10 สิบ"
    misconceptions:
      - { match: 303, feedback: "ลดลง 100 ไม่ใช่ 10 ดูหลักที่เปลี่ยนให้ถูก" }
      - { match: 413, feedback: "นั่นคือมากกว่า 403 อยู่ 10 ข้อนี้ถามจำนวนที่น้อยกว่า" }
    solution: "$403 - 10 = 393$ (403 คือ 39 สิบ กับ 3 หน่วย ลด 1 สิบเหลือ 38 สิบ กับ 3 หน่วย)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.whole-add-sub.p009
    topics: [math.number.whole-add-sub]
    difficulty: 3
    type: match
    stem: "จับคู่วิธีคิดในใจกับชื่อวิธี"
    pairs:
      - { left: "$8 + 6 = 8 + 2 + 4 = 14$", right: "ทำให้เป็นสิบ" }
      - { left: "$13 - 4 = 13 - 3 - 1 = 9$", right: "ลบผ่านสิบ" }
      - { left: "$6 + 7 = 6 + 6 + 1 = 13$", right: "จำนวนเท่ากันบวกหนึ่ง" }
      - { left: "$2 + 6 + 4 = 2 + 10 = 12$", right: "จัดกลุ่มบวกคู่ที่ได้สิบก่อน" }
      - { left: "$12 - 8$ คิดจาก $8 + 4 = 12$", right: "ใช้ความสัมพันธ์ของการบวกและการลบ" }
    hints:
      - "ดูว่าแต่ละวิธีแยกจำนวนใดออกเป็นส่วน ๆ"
      - "วิธีที่เปลี่ยนการลบเป็นการบวกคือการใช้ความสัมพันธ์ของบวกกับลบ"
    solution: "แยก 6 เป็น 2 กับ 4 ให้ 8 เป็น 10 คือทำให้เป็นสิบ แยก 4 เป็น 3 กับ 1 ให้ลงที่ 10 ก่อนคือลบผ่านสิบ $6 + 6 + 1$ ใช้จำนวนเท่ากัน $6 + 4$ เป็นสิบจึงบวกก่อน และ $12 - 8$ หาจาก \"8 บวกอะไรได้ 12\""
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.whole-add-sub.p010
    topics: [math.number.whole-add-sub]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการแก้โจทย์ปัญหาการบวกลบ"
    items:
      - "อ่านโจทย์ หาว่าโจทย์ให้อะไรและถามอะไร"
      - "วาดแบบจำลองแล้วเขียนประโยคสัญลักษณ์"
      - "หาคำตอบโดยการบวกหรือลบ"
      - "ตรวจคำตอบและตอบพร้อมหน่วย"
    hints:
      - "ต้องรู้ก่อนว่าโจทย์ถามอะไร จึงเลือกได้ว่าจะบวกหรือลบ"
      - "การตรวจทำหลังได้คำตอบแล้ว"
    solution: "อ่านและหาสิ่งที่ถาม → เขียนประโยคสัญลักษณ์ → คำนวณ → ตรวจคำตอบและตอบพร้อมหน่วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.whole-add-sub.p011
    topics: [math.number.whole-add-sub]
    difficulty: 3
    type: numeric
    stem: "โรงเรียนตั้งเป้าเก็บขวดพลาสติก 4,003 ขวด ตอนนี้เก็บได้ 1,256 ขวด ยังขาดอีกกี่ขวด (ตอบเป็นจำนวนขวด)"
    answer: { value: 2747, unit: ขวด }
    hints:
      - "ยังขาดอีกเท่าไร ใช้การลบ $4{,}003 - 1{,}256$"
      - "หลักหน่วย 3 น้อยกว่า 6 และหลักสิบกับหลักร้อยเป็น 0 ต้องกระจายจากหลักพัน"
    misconceptions:
      - { match: 3253, feedback: "เอาเลขมากลบเลขน้อยในแต่ละหลักโดยไม่สนว่าตัวไหนอยู่บน ต้องกระจาย 4,003 เป็น 3 พัน 9 ร้อย 9 สิบ 13 หน่วยก่อน" }
      - { match: 5259, feedback: "บวกกัน แต่โจทย์ถามว่ายังขาดอีกเท่าไร ต้องลบ" }
    solution: "กระจาย 4,003 เป็น 3 พัน 9 ร้อย 9 สิบ 13 หน่วย แล้วลบทีละหลัก: $13 - 6 = 7$, $9 - 5 = 4$, $9 - 2 = 7$, $3 - 1 = 2$ ได้ 2,747 ขวด ตรวจ: $2{,}747 + 1{,}256 = 4{,}003$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.whole-add-sub.p012
    topics: [math.number.whole-add-sub]
    difficulty: 3
    type: numeric
    stem: "หาจำนวนที่แทน $\\square$ ใน $\\square - 1{,}875 = 4{,}260$"
    answer: { value: 6135 }
    hints:
      - "$\\square$ คือจำนวนที่ถูกลบ จึงเป็นทั้งหมด"
      - "ทั้งหมด = ส่วนที่ลบออก + ส่วนที่เหลือ"
    misconceptions:
      - { match: 2385, feedback: "ลบ 1,875 ออกจาก 4,260 ลองแทนค่ากลับ $2{,}385 - 1{,}875$ ได้แค่ 510" }
    solution: "$\\square = 4{,}260 + 1{,}875 = 6{,}135$ ตรวจ: $6{,}135 - 1{,}875 = 4{,}260$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.whole-add-sub.p013
    topics: [math.number.whole-add-sub]
    difficulty: 3
    type: mcq
    stem: "ต้นคำนวณ $6{,}912 - 2{,}987$ ได้ 4,925 ใช้การประมาณตรวจว่าคำตอบนี้สมเหตุสมผลหรือไม่"
    choices:
      - { id: a, text: "ไม่สมเหตุสมผล เพราะคำตอบควรใกล้ 4,000", correct: true }
      - { id: b, text: "สมเหตุสมผล เพราะคำตอบควรใกล้ 5,000", feedback: "ปัด 6,912 เป็น 7,000 และ 2,987 เป็น 3,000 ได้ $7{,}000 - 3{,}000 = 4{,}000$ ไม่ใช่ 5,000" }
      - { id: c, text: "สมเหตุสมผล เพราะคำตอบควรใกล้ 10,000", feedback: "นั่นคือการประมาณผลบวก ข้อนี้เป็นการลบ" }
    hints:
      - "ปัดแต่ละจำนวนเป็นหลักพันที่ใกล้ที่สุด"
      - "เทียบผลประมาณกับ 4,925"
    solution: "$7{,}000 - 3{,}000 = 4{,}000$ คำตอบ 4,925 ห่างจาก 4,000 มากเกินไป จึงผิด คำตอบที่ถูกคือ $6{,}912 - 2{,}987 = 3{,}925$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.whole-add-sub.p014
    topics: [math.number.whole-add-sub]
    difficulty: 3
    type: numeric
    stem: "แม่ค้าที่ตลาดนัดมีมะม่วง 245 ผล ตอนเช้าขายไป 128 ผล ตอนบ่ายรับมะม่วงมาเพิ่มอีก 90 ผล ตอนนี้แม่ค้ามีมะม่วงกี่ผล (ตอบเป็นจำนวนผล)"
    answer: { value: 207, unit: ผล }
    hints:
      - "ขั้นแรก ขายไปแล้วเหลือเท่าไร"
      - "ขั้นที่สอง รับมาเพิ่ม ต้องบวก"
    misconceptions:
      - { match: 27, feedback: "ลบ 90 แทนที่จะบวก การรับมะม่วงมาเพิ่มทำให้มีมากขึ้น" }
      - { match: 463, feedback: "บวกทุกจำนวน แต่ที่ขายไปต้องลบออก" }
    solution: "เหลือหลังขาย $245 - 128 = 117$ ผล รับเพิ่ม $117 + 90 = 207$ ผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.whole-add-sub.p015
    topics: [math.number.whole-add-sub]
    difficulty: 4
    type: numeric
    stem: "พ่อมีเงิน 1,250 บาท ซื้อปุ๋ยแล้วเหลือเงิน 785 บาท ดังแบบจำลองแท่ง ค่าปุ๋ยกี่บาท (ตอบในหน่วยบาท)"
    figure: { src: bar-fertilizer.svg, alt: "แบบจำลองแท่ง แท่งบนคือเงินทั้งหมด 1,250 บาท แท่งล่างแบ่งเป็นสองส่วน ส่วนซ้ายเป็นค่าปุ๋ยซึ่งไม่รู้ค่า ส่วนขวาเป็นเงินที่เหลือ 785 บาท" }
    answer: { value: 465, unit: บาท }
    hints:
      - "1,250 คือทั้งหมด 785 คือส่วนย่อยหนึ่งส่วน"
      - "ค่าปุ๋ย = ทั้งหมด − เงินที่เหลือ"
    misconceptions:
      - { match: 2035, feedback: "บวกทั้งหมดกับเงินที่เหลือ ค่าปุ๋ยเป็นส่วนย่อยของ 1,250 จึงต้องน้อยกว่า 1,250" }
      - { match: 1535, feedback: "เอาเลขมากลบเลขน้อยในแต่ละหลัก ต้องกระจายจากหลักทางซ้ายเมื่อตัวตั้งน้อยกว่าตัวลบ" }
    solution: "$1{,}250 - 785 = 465$ บาท ตรวจ: $465 + 785 = 1{,}250$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.whole-add-sub.p016
    topics: [math.number.whole-add-sub]
    difficulty: 4
    type: numeric
    stem: "นักเรียน ป.4 เก็บขวดพลาสติกได้ 1,386 ขวด นักเรียน ป.5 เก็บได้มากกว่า ป.4 อยู่ 257 ขวด สองชั้นเก็บขวดรวมกันกี่ขวด (ตอบเป็นจำนวนขวด)"
    answer: { value: 3029, unit: ขวด }
    hints:
      - "หาจำนวนขวดของ ป.5 ก่อน"
      - "แล้วรวมขวดของ ป.4 กับ ป.5"
    misconceptions:
      - { match: 1643, feedback: "นั่นคือขวดของ ป.5 อย่างเดียว โจทย์ถามสองชั้นรวมกัน" }
      - { match: 2515, feedback: "\"มากกว่า\" แปลว่า ป.5 มีขวดมากกว่า ต้องบวก 257 ไม่ใช่ลบ" }
    solution: "ป.5 เก็บได้ $1{,}386 + 257 = 1{,}643$ ขวด สองชั้นรวม $1{,}386 + 1{,}643 = 3{,}029$ ขวด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.whole-add-sub.p017
    topics: [math.number.whole-add-sub]
    difficulty: 4
    type: numeric
    stem: "หาจำนวนที่แทน $\\square$ ใน $\\square + 286{,}450 = 1{,}000{,}000$"
    answer: { value: 713550 }
