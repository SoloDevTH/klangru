id: engineering.environmental.noise-control
subject: engineering
title: { th: การควบคุมมลภาวะทางเสียง, en: Noise pollution control }
summary: คำนวณเดซิเบลที่รวมจากหลายแหล่ง ลดระดับเสียงตามระยะ หา Leq ของเสียงที่แปรผัน และเลือกวิธีควบคุมเสียงตามลำดับ
difficulty: 6.5
minutes: 35
prerequisites: [physics.waves.sound-properties, math.functions.logarithms]
encompasses:
  - { id: math.functions.logarithms, weight: 0.5 }
  - { id: physics.waves.sound-properties, weight: 0.3 }
curriculum_tags: []
