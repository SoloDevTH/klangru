  - id: physics.waves.resonance-standing-waves.p016
    topics: [physics.waves.resonance-standing-waves]
    difficulty: 5
    type: numeric
    stem: "หลอดเรโซแนนซ์ยาว $1.00\\ \\mathrm{m}$ เริ่มเต็มด้วยน้ำ ถือส้อมเสียง $680\\ \\mathrm{Hz}$ ไว้เหนือปากหลอดแล้วค่อย ๆ ปล่อยน้ำออกจนหมด อัตราเร็วเสียง $340\\ \\mathrm{m/s}$ (ไม่คิดผลของปลายหลอด) จะได้ยินเสียงดังที่สุดกี่ครั้ง"
    answer: { value: 4, tolerance: 0, unit: ครั้ง }
    misconceptions:
      - { match: 8, feedback: "นับทุกความยาวที่เป็นจำนวนเท่าของ $\\lambda/4$ แต่ท่อปลายเปิดหนึ่งด้านสั่นพ้องเฉพาะ $\\lambda/4, 3\\lambda/4, 5\\lambda/4, \\dots$" }
      - { match: 2, feedback: "นับเฉพาะ $\\lambda/4$ กับ $3\\lambda/4$ แต่ความยาวคลื่นสั้น ($0.50\\ \\mathrm{m}$) ลำอากาศยาว $1.00\\ \\mathrm{m}$ จึงมีตำแหน่งสั่นพ้องมากกว่านั้น" }
    hints:
      - "หาความยาวคลื่นก่อน $\\lambda = v/f$"
      - "นับความยาว $\\tfrac{(2n-1)\\lambda}{4}$ ที่ไม่เกิน $1.00\\ \\mathrm{m}$"
    solution: "$\\lambda = \\tfrac{340}{680} = 0.50\\ \\mathrm{m}$ ความยาวที่สั่นพ้องคือ $0.125, 0.375, 0.625, 0.875\\ \\mathrm{m}$ (ค่าถัดไป $1.125\\ \\mathrm{m}$ ยาวเกินหลอด) จึงได้ยินเสียงดังที่สุด 4 ครั้ง"
