problems:
- type: match
  difficulty: 1
  stem: จับคู่คำเชื่อมเชิงโต้แย้งกับหน้าที่ในข้อความ
  pairs:
  - left: 一方面 (yì fāngmiàn)…另一方面 (lìng yì fāngmiàn)…
    right: ยกสองด้านของประเด็น
  - left: 不是 (bú shì)…而是 (érshì)…
    right: ปรับความเข้าใจ บอกว่าสิ่งที่ถูกคือ…
  - left: 与其 (yǔqí)…不如 (bùrú)…
    right: เลือกทางที่ดีกว่าเมื่อเทียบสองทาง
  - left: 总之 (zǒngzhī)
    right: สรุปข้อความโดยรวม
  - left: 由此可见 (yóucǐ-kějiàn)
    right: บอกว่าจากนี้จะเห็นได้ว่า
  hints:
  - ดูว่าคำใดยกสองด้าน และคำใดใช้ปรับความเข้าใจ
  - 与其 ต้องเปรียบเทียบสองทาง ส่วน 总之 นำข้อสรุป
  - 由此可见 เป็นข้อสรุปจากเหตุผลที่ผ่านมา
  solution: 一方面 (yì fāngmiàn)…另一方面 (lìng yì fāngmiàn)… ยกสองด้าน · 不是 (bú shì)…而是 (érshì)… ปรับความเข้าใจ · 与其 (yǔqí)…不如 (bùrú)… เลือกทางที่ดีกว่า · 总之 (zǒngzhī) สรุป · 由此可见 (yóucǐ-kějiàn) บอกข้อสรุปจากเหตุผล
  id: chinese.reading.opinion-texts.p001
  topics:
  - chinese.reading.opinion-texts
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: mcq
  difficulty: 2
  stem: ประโยคใดเป็นความคิดเห็นของผู้เขียน (ไม่ใช่ข้อเท็จจริงที่ตรวจได้)
  choices:
  - id: a
    text: 今年三月 (jīnnián sānyuè)，学校开了一个新图书馆 (xuéxiào kāi le yí gè xīn túshūguǎn)。
    feedback: ประโยคนี้บอกว่าเกิดขึ้นเมื่อไรและเกิดอะไรขึ้น จึงเป็นข้อเท็จจริง
  - id: b
    text: 我认为学校应该多开一些图书馆 (wǒ rènwéi xuéxiào yīnggāi duō kāi yìxiē túshūguǎn)。
    correct: true
    feedback: ถูก 我认为 (wǒ rènwéi) และ 应该 (yīnggāi) บอกทัศนะของผู้เขียน
  - id: c
    text: 图书馆在教学楼的三楼 (túshūguǎn zài jiàoxuélóu de sān lóu)。
    feedback: ประโยคนี้บอกตำแหน่งที่ตรวจได้ จึงเป็นข้อเท็จจริง
  - id: d
    text: 图书馆里有一千本书 (túshūguǎn lǐ yǒu yì qiān běn shū)。
    feedback: ประโยคนี้เป็นจำนวนที่ตรวจได้ จึงเป็นข้อเท็จจริง
  hints:
  - ดูว่าประโยคมีคำบอกทัศนะหรือไม่
  - ข้อเท็จจริงมักมีเวลา สถานที่ หรือจำนวนที่ตรวจได้
  - ความเห็นมักมีคำอย่าง 认为 หรือ 应该
  solution: '**b.** 我认为学校应该多开图书馆 (wǒ rènwéi xuéxiào yīnggāi duō kāi túshūguǎn) เป็นความเห็น ส่วนข้ออื่นตรวจได้ด้วยเวลา สถานที่ หรือจำนวน'
  id: chinese.reading.opinion-texts.p002
  topics:
  - chinese.reading.opinion-texts
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: mcq
  difficulty: 2
  stem: 'อ่านข้อความต่อไปนี้แล้วตอบ


    在泰国，很多人认为，手机会影响学习。我同意这个看法，但我觉得不能简单地禁止手机。一方面，手机可以查资料 (zīliào)、学外语；另一方面，玩游戏会让人分心 (fēnxīn)。所以，我认为学生应该学会控制使用时间。总之，关键不是有没有手机，而是怎么用手机。


    ผู้เขียนคิดอย่างไรเรื่องการใช้โทรศัพท์'
  choices:
  - id: a
    text: ควรห้ามใช้โทรศัพท์ในโรงเรียนทั้งหมด
    feedback: ผู้เขียนบอกว่า ‘不能简单地禁止手机 (bù néng jiǎndān de jìnzhǐ shǒujī)’ จึงไม่เห็นด้วยกับการห้ามทั้งหมด
  - id: b
    text: ไม่ควรห้ามทั้งหมด แต่ควรรู้จักควบคุมเวลาใช้
    correct: true
    feedback: ถูก ผู้เขียนเสนอให้ควบคุมเวลาใช้และให้ความสำคัญกับวิธีใช้
  - id: c
    text: โทรศัพท์ไม่มีประโยชน์ต่อการเรียนเลย
    feedback: ผู้เขียนยกประโยชน์ของโทรศัพท์ไว้ จึงตรงข้ามกับตัวเลือกนี้
  - id: d
    text: โทรศัพท์เป็นสาเหตุหลักของการเรียนตกต่ำ
    feedback: ข้อความไม่ได้บอกว่าเป็นสาเหตุหลัก
  hints:
  - หาประโยคที่มี 我觉得 ซึ่งบอกทัศนะ
  - 关键是 ในประโยคสรุปบอกว่าสำคัญอย่างไร
  - เลือกตัวเลือกที่ตรงกับทั้งความคิดหลักและข้อสรุป
  solution: '**b.** ผู้เขียนไม่เห็นด้วยกับการห้ามทั้งหมด (不能简单地禁止 (bù néng jiǎndān de jìnzhǐ)) และเสนอให้ควบคุมการใช้ (学会控制使用时间 (xuéhuì kòngzhì shǐyòng shíjiān))'
  id: chinese.reading.opinion-texts.p003
  topics:
  - chinese.reading.opinion-texts
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: numeric
  difficulty: 2
  stem: 'อ่านข้อความต่อไปนี้แล้วตอบ


    在泰国，很多人认为，手机会影响学习。我同意这个看法，但我觉得不能简单地禁止手机。一方面，手机可以查资料 (zīliào)、学外语；另一方面，玩游戏会让人分心 (fēnxīn)。所以，我认为学生应该学会控制使用时间。总之，关键不是有没有手机，而是怎么用手机。


    ผู้เขียนยกประเด็นทั้งด้านดีและด้านเสียของโทรศัพท์รวมกี่ประเด็น (ตอบเป็นตัวเลข)'
  answer:
    value: 2
    tolerance: 0
    unit: ประเด็น
  misconceptions:
  - match: 3
    feedback: 3 คือจำนวนการใช้งานที่ยกมาทั้งหมด แต่โจทย์ถามจำนวนประเด็นซึ่งมีสองด้านคือ 一方面 (yì fāngmiàn) กับ 另一方面 (lìng yì fāngmiàn)
  hints:
  - ดูคู่คำ 一方面 และ 另一方面
  - นับด้านที่ถูกยกมาไม่ใช่นับการใช้งานทั้งหมด
  - ทั้งสองคำบอกว่ามีกี่ด้าน
  solution: '**2 ประเด็น** คือด้านที่ดี (查资料 (chá zīliào)、学外语 (xué wàiyǔ)) และด้านเสีย (玩游戏会让人分心 (wán yóuxì huì ràng rén fēnxīn))'
  id: chinese.reading.opinion-texts.p004
  topics:
  - chinese.reading.opinion-texts
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: order
  difficulty: 2
  stem: เรียงประโยคจากข้อความเรื่องโทรศัพท์ตามลำดับการโต้แย้ง (ความคิดหลัก → เหตุผล → ข้อสรุป)
  items:
  - 在泰国 (zài Tàiguó)，很多人认为 (hěn duō rén rènwéi)，手机会影响学习 (shǒujī huì yǐngxiǎng xuéxí)。
  - 我同意这个看法 (wǒ tóngyì zhège kànfǎ)，但我觉得不能简单地禁止手机 (dàn wǒ juéde bù néng jiǎndān de jìnzhǐ shǒujī)。
  - 一方面 (yì fāngmiàn)，手机可以查资料 (shǒujī kěyǐ chá zīliào)、学外语 (xué wàiyǔ)；另一方面 (lìng yì fāngmiàn)，玩游戏会让人分心 (wán yóuxì huì ràng rén fēnxīn)。
  - 所以 (suǒyǐ)，我认为学生应该学会控制使用时间 (wǒ rènwéi xuésheng yīnggāi xuéhuì kòngzhì shǐyòng shíjiān)。
  - 总之 (zǒngzhī)，关键不是有没有手机 (guānjiàn bú shì yǒu méiyǒu shǒujī)，而是怎么用手机 (érshì zěnme yòng shǒujī)。
  hints:
  - ประโยคแรกบอกความเชื่อที่ผู้เขียนยกมาเป็นจุดตั้งต้น
  - ประโยคที่มี 一方面 เป็นเหตุผลที่ผู้เขียนชั่งน้ำหนัก
  - คำว่า 总之 อยู่ท้ายสุดเพราะเป็นข้อสรุป
  solution: ความเชื่อของคนทั่วไป → ความเห็นของผู้เขียน → เหตุผลสองด้าน → ความเห็นที่เสนอ → ข้อสรุป
  id: chinese.reading.opinion-texts.p005
  topics:
  - chinese.reading.opinion-texts
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: text
  difficulty: 3
  stem: 'เติมคำเชื่อมที่หายไปให้ประโยคหมายความว่า ‘เราไม่ได้ต้องเลิกใช้ถุงพลาสติกทั้งหมด แต่ถือถุงผ้าไปตลาดได้’ (ตอบ 2 ตัวอักษร)


    我们不是要完全不用塑料袋 (wǒmen bú shì yào wánquán bú yòng sùliàodài)，___是可以带一个布袋去菜市场买菜 (shì kěyǐ dài yí gè bùdài qù càishìchǎng mǎicài)。'
  accepted:
  - 而是
  misconceptions:
  - match: 但是
    feedback: 但是 (dànshì) บอกการขัดแย้งทั่วไป แต่โครงสร้าง 不是 (bú shì)…而是 (érshì)… ใช้ 而是 (érshì) เพื่อปรับความเข้าใจ
  hints:
  - ประโยคก่อนหน้ามีคำว่า 不是 ซึ่งปฏิเสธบางอย่าง
  - ประโยคหลังเสนอทางเลือกที่ถูกต้องแทน
  - เป็นคู่คำที่แปลว่า ‘แต่เป็น’
  solution: '**而是 (érshì)** เขียนว่า 我们不是要完全不用塑料袋 (wǒmen bú shì yào wánquán bú yòng sùliàodài)，而是可以带一个布袋去菜市场买菜 (érshì kěyǐ dài yí gè bùdài qù càishìchǎng mǎicài)。'
  id: chinese.reading.opinion-texts.p006
  topics:
  - chinese.reading.opinion-texts
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: mcq
  difficulty: 3
  stem: 'อ่านข้อความต่อไปนี้แล้วตอบ


    与其每天晚上熬夜 (áoyè)，不如早一点睡觉。熬夜 (áoyè)的人白天常常没有精神，学习效率 (xiàolǜ)也不高。当然，有人习惯 (xíguàn)晚上工作，这不是坏事。但是，对泰国的大多数学生来说，规律的作息 (zuòxī)更重要。由此可见，早睡比熬夜 (áoyè)更好。


    ประโยค ‘由此可见，早睡比熬夜 (áoyè)更好。’ เป็นส่วนใดของข้อความ'
  choices:
  - id: a
    text: ข้อสรุปของเรื่องทั้งหมด
    correct: true
    feedback: ถูก 由此可见 (yóucǐ-kějiàn) นำข้อสรุปจากเหตุผลที่ผ่านมา
  - id: b
    text: เหตุผลข้อเดียวที่สนับสนุน
    feedback: ประโยคนี้เป็นข้อสรุป ไม่ใช่เหตุผลย่อย
  - id: c
    text: ตัวอย่างของคนที่ทำงานตอนกลางคืน
    feedback: ตัวอย่างนั้นอยู่ในประโยค 有人习惯晚上工作 (yǒurén xíguàn wǎnshang gōngzuò) ไม่ใช่ประโยคนี้
  - id: d
    text: ข้อโต้แย้งของฝ่ายตรงข้าม
    feedback: ฝ่ายตรงข้ามถูกยกไว้ในประโยค 有人习惯晚上工作 (yǒurén xíguàn wǎnshang gōngzuò) แต่ประโยคนี้เป็นข้อสรุปของผู้เขียน
  hints:
  - ดูคำที่นำประโยคนั้น
  - 由此可见 ใช้นำข้อสรุป
  - เลือกตัวเลือกที่บอกว่าเป็นส่วนที่ผู้เขียนสรุปความคิด
  solution: '**a.** 由此可见 (yóucǐ-kějiàn) นำข้อสรุปที่ผู้เขียนต้องการ'
  id: chinese.reading.opinion-texts.p007
  topics:
