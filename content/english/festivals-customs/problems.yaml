problems:
  - id: english.culture.festivals-customs.p001
    topics: [english.culture.festivals-customs]
    difficulty: 1
    type: match
    stem: "จับคู่เทศกาลกับสิ่งที่เกี่ยวข้อง"
    pairs:
      - { left: "Halloween", right: "pumpkin" }
      - { left: "Easter", right: "egg" }
      - { left: "Christmas", right: "Christmas tree" }
      - { left: "Birthday", right: "candles" }
    hints:
      - "pumpkin = ฟักทอง, candles = เทียน"
      - "วันเกิดเป่าเทียนบนเค้ก วันอีสเตอร์มีเกมหาไข่"
    solution: "Halloween → pumpkin · Easter → egg · Christmas → Christmas tree · Birthday → candles"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.festivals-customs.p002
    topics: [english.culture.festivals-customs]
    difficulty: 1
    type: mcq
    stem: "วันคริสต์มาส เราอวยพรเพื่อนว่าอะไร"
    choices:
      - { id: a, text: "Merry Christmas!", correct: true, feedback: "ถูก คำอวยพรคริสต์มาส (ในอังกฤษพูด Happy Christmas! ก็ได้)" }
      - { id: b, text: "Happy birthday!", feedback: "ใช้อวยพรวันเกิด" }
      - { id: c, text: "Happy Easter!", feedback: "ใช้อวยพรวันอีสเตอร์ ซึ่งอยู่ในเดือนมีนาคมหรือเมษายน" }
      - { id: d, text: "Trick or treat!", feedback: "เด็ก ๆ พูดตอนเคาะประตูขอขนมวัน Halloween" }
    hints:
      - "คำอวยพรคริสต์มาสขึ้นต้นด้วยคำที่แปลว่า สุขสันต์ รื่นเริง"
      - "Merry ใช้กับ Christmas เป็นหลัก"
    solution: "***Merry Christmas!***"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.festivals-customs.p003
    topics: [english.culture.festivals-customs]
    difficulty: 1
    type: mcq
    stem: "เทศกาลไทยเทศกาลใดเป็นปีใหม่ไทย"
    choices:
      - { id: a, text: "Songkran", correct: true, feedback: "ถูก สงกรานต์ 13–15 เมษายน เป็นปีใหม่ไทย" }
      - { id: b, text: "Loy Krathong", feedback: "ลอยกระทงเป็นการขอขมาพระแม่คงคา ไม่ใช่ปีใหม่" }
      - { id: c, text: "Christmas", feedback: "คริสต์มาสไม่ใช่เทศกาลไทย" }
      - { id: d, text: "Halloween", feedback: "Halloween ไม่ใช่เทศกาลไทย" }
    hints:
      - "ปีใหม่ไทยมีการรดน้ำดำหัวผู้ใหญ่"
      - "อยู่ในเดือนเมษายน"
    solution: "***Songkran*** (สงกรานต์) เป็นปีใหม่ไทย ตรงกับ 13–15 เมษายน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.festivals-customs.p004
    topics: [english.culture.festivals-customs]
    difficulty: 2
    type: text
    stem: "เติมชื่อเดือน: *Halloween is on 31 ___.*"
    accepted: ["October", "Oct", "Oct."]
    misconceptions:
      - { match: "November", feedback: "Halloween อยู่วันสุดท้ายของเดือนตุลาคม (October)" }
      - { match: "December", feedback: "31 ธันวาคมคือ New Year's Eve ส่วน Halloween คือ 31 ตุลาคม" }
    hints:
      - "Halloween อยู่ก่อนเดือนพฤศจิกายนหนึ่งวัน"
      - "เดือนที่ 10 ภาษาอังกฤษว่าอะไร"
    solution: "*Halloween is on 31 **October**.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.festivals-customs.p005
    topics: [english.culture.festivals-customs]
    difficulty: 2
    type: mcq
    stem: "*What is the weather usually like at Christmas in Australia?*"
    choices:
      - { id: a, text: "It's summer, so it's usually hot.", correct: true, feedback: "ถูก ออสเตรเลียอยู่ซีกโลกใต้ ธันวาคมเป็นฤดูร้อน" }
      - { id: b, text: "It's winter, so it's very cold.", feedback: "ฤดูหนาวช่วงคริสต์มาสเป็นของซีกโลกเหนือ เช่น อังกฤษ แคนาดา" }
      - { id: c, text: "It snows everywhere in Australia.", feedback: "ธันวาคมเป็นหน้าร้อนในออสเตรเลีย" }
      - { id: d, text: "Australia doesn't have Christmas.", feedback: "ออสเตรเลียฉลองคริสต์มาส และ 25 ธ.ค. เป็นวันหยุด" }
    hints:
      - "ออสเตรเลียอยู่ซีกโลกเหนือหรือใต้"
      - "ฤดูของซีกโลกใต้กลับกันกับซีกโลกเหนือ"
    solution: "***It's summer, so it's usually hot.*** หลายครอบครัวไปชายหาดหรือปิ้งย่าง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.festivals-customs.p006
    topics: [english.culture.festivals-customs]
    difficulty: 2
    type: match
    stem: "ดูภาพ จับคู่ภาพกับเทศกาล"
    figure: { src: festival-symbols-quiz.svg, alt: "ภาพสี่ภาพ A ฟักทองสีส้มที่แกะเป็นหน้าตา B ไข่ที่ระบายสีเป็นลวดลาย C ต้นสนประดับลูกบอลสีและดาวบนยอด D ดอกไม้ไฟหลายสีบนท้องฟ้า" }
    pairs:
      - { left: "A", right: "Halloween" }
      - { left: "B", right: "Easter" }
      - { left: "C", right: "Christmas" }
      - { left: "D", right: "New Year's Eve" }
    hints:
      - "ฟักทองแกะหน้าตาเรียกว่า jack-o'-lantern"
      - "คืนวันที่ 31 ธันวาคมมีการนับถอยหลังและจุดอะไร"
    solution: "A ฟักทอง → Halloween · B ไข่ระบายสี → Easter · C ต้นคริสต์มาส → Christmas · D ดอกไม้ไฟ → New Year's Eve"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.festivals-customs.p007
    topics: [english.culture.festivals-customs]
    difficulty: 2
    type: text
    stem: "เพื่อนพูดว่า *Happy New Year!* ตอบกลับด้วยคำเดียวในช่องว่าง: *___ to you!*"
    accepted: ["Same"]
    misconceptions:
      - { match: "Happy", feedback: "Happy to you! ไม่ใช่สำนวน ใช้ Same to you! หรือ Happy New Year! ซ้ำทั้งประโยค" }
      - { match: "Thank", feedback: "Thank you! ใช้ตอบได้ แต่ต้องไม่มี to: Thank you! ส่วนรูปในโจทย์คือ Same to you!" }
    hints:
      - "สำนวนนี้แปลว่า เช่นกันนะ"
      - "ตอบได้อีกแบบว่า You too!"
    solution: "***Same** to you!* (หรือตอบว่า *Happy New Year! / You too!*)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.festivals-customs.p008
    topics: [english.culture.festivals-customs]
    difficulty: 3
    type: text
    stem: "เติมบุพบท: *Halloween is ___ 31 October.*"
    accepted: ["on"]
    misconceptions:
      - { match: "in", feedback: "in ใช้กับเดือน (in October) ถ้ามีวันที่ใช้ on" }
      - { match: "at", feedback: "at ใช้กับช่วงเทศกาล (at Christmas) หรือเวลา ถ้ามีวันที่ใช้ on" }
    hints:
      - "on / at / in ใช้กับเวลาต่างชนิดกัน"
      - "วันที่ (date) ใช้บุพบทอะไร"
    solution: "*Halloween is **on** 31 October.* (วันที่ใช้ on, เดือนใช้ in, ช่วงเทศกาลใช้ at)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.festivals-customs.p009
    topics: [english.culture.festivals-customs]
    difficulty: 3
    type: text
    stem: "เขียนคำอวยพรวันอีสเตอร์ (สองคำ)"
    accepted: ["Happy Easter", "Happy Easter!", "Happy Easter."]
    misconceptions:
      - { match: "Merry Easter", feedback: "Merry ใช้กับ Christmas เป็นหลัก อีสเตอร์ใช้ Happy Easter" }
      - { match: "Merry Easter!", feedback: "Merry ใช้กับ Christmas เป็นหลัก อีสเตอร์ใช้ Happy Easter" }
    hints:
      - "รูปเดียวกับ Happy New Year"
      - "คำที่แปลว่า สุขสันต์ + ชื่อเทศกาล"
    solution: "***Happy Easter!***"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.festivals-customs.p010
    topics: [english.culture.festivals-customs]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ประเทศใดฉลอง Thanksgiving เป็นวันหยุดประจำปี (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "the United States", correct: true, feedback: "ถูก วันพฤหัสบดีที่ 4 ของเดือนพฤศจิกายน" }
      - { id: b, text: "Canada", correct: true, feedback: "ถูก วันจันทร์ที่ 2 ของเดือนตุลาคม" }
      - { id: c, text: "the United Kingdom", feedback: "สหราชอาณาจักรไม่มีวัน Thanksgiving" }
      - { id: d, text: "Australia", feedback: "ออสเตรเลียไม่มีวัน Thanksgiving เป็นวันหยุด" }
      - { id: e, text: "Thailand", feedback: "ไทยไม่มีวัน Thanksgiving" }
    hints:
      - "Thanksgiving เป็นเทศกาลของทวีปอเมริกาเหนือ"
      - "มีสองประเทศ ฉลองคนละเดือน"
    solution: "**the United States** (พ.ย.) และ **Canada** (ต.ค.)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.festivals-customs.p011
    topics: [english.culture.festivals-customs]
    difficulty: 4
    type: numeric
    stem: "Thanksgiving ของสหรัฐฯ ตรงกับ *the fourth Thursday in November* ในปี 2027 วันพฤหัสบดีแรกของเดือนพฤศจิกายนคือวันที่ 4 Thanksgiving ปี 2027 ตรงกับวันที่เท่าไร"
    answer: { value: 25, unit: "พฤศจิกายน" }
    misconceptions:
      - { match: 18, feedback: "นี่คือวันพฤหัสบดีที่ 3 fourth คือที่ 4" }
      - { match: 28, feedback: "บวก 4 × 7 = 28 เข้ากับวันที่ 4 ไม่ได้ วันพฤหัสบดีแรกนับเป็นครั้งที่ 1 แล้ว จึงบวกอีก 3 สัปดาห์" }
    hints:
      - "วันพฤหัสบดีห่างกันทีละ 7 วัน"
      - "ครั้งที่ 1 คือวันที่ 4 บวก 7 ไปอีกสามครั้ง"
    solution: "วันพฤหัสบดีเดือน พ.ย. 2027: 4, 11, 18, 25 ครั้งที่ 4 คือวันที่ **25** (4 + 3 × 7 = 25)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.festivals-customs.p012
    topics: [english.culture.festivals-customs]
    difficulty: 3
    type: order
    stem: "เรียงกิจกรรมงานวันเกิดแบบที่นิยมในประเทศที่ใช้ภาษาอังกฤษ"
    items:
      - "Light the candles on the cake."
      - "Sing \"Happy Birthday\"."
      - "Make a wish."
      - "Blow out the candles."
      - "Cut the cake."
    hints:
      - "ต้องจุดเทียนก่อนจึงจะเป่าได้"
      - "อธิษฐาน (make a wish) ก่อนเป่าเทียน แล้วจึงตัดเค้ก"
    solution: "จุดเทียน → ร้องเพลง Happy Birthday → อธิษฐาน → เป่าเทียน → ตัดเค้ก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.festivals-customs.p013
    topics: [english.culture.festivals-customs]
    difficulty: 4
    type: mcq
    stem: "ข้อใดเปรียบเทียบสงกรานต์กับ Thanksgiving ได้ถูกต้อง"
    choices:
      - { id: a, text: "At both festivals, many families get together.", correct: true, feedback: "ถูก ทั้งสองเทศกาลคนจำนวนมากกลับบ้านไปพบครอบครัว" }
      - { id: b, text: "Both festivals are in April.", feedback: "Thanksgiving อยู่เดือนพฤศจิกายน (สหรัฐฯ) หรือตุลาคม (แคนาดา)" }
      - { id: c, text: "At Thanksgiving, people pour water on each other.", feedback: "การเล่นน้ำเป็นประเพณีสงกรานต์ Thanksgiving เป็นการกินอาหารร่วมกันและขอบคุณ" }
      - { id: d, text: "People celebrate Songkran in Canada, not in Thailand.", feedback: "สงกรานต์เป็นเทศกาลไทย" }
    hints:
      - "นึกถึงสิ่งที่ครอบครัวทำในสองเทศกาล"
      - "ตรวจเดือนและกิจกรรมของแต่ละเทศกาล"
    solution: "***At both festivals, many families get together.***"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.festivals-customs.p014
    topics: [english.culture.festivals-customs]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "ประเทศใดขับรถชิดซ้ายเหมือนประเทศไทย (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "the United Kingdom", correct: true, feedback: "ถูก สหราชอาณาจักรขับชิดซ้าย" }
      - { id: b, text: "Australia", correct: true, feedback: "ถูก ออสเตรเลียขับชิดซ้าย" }
      - { id: c, text: "New Zealand", correct: true, feedback: "ถูก นิวซีแลนด์ขับชิดซ้าย" }
      - { id: d, text: "the United States", feedback: "สหรัฐฯ ขับชิดขวา" }
      - { id: e, text: "Canada", feedback: "แคนาดาขับชิดขวาเหมือนสหรัฐฯ" }
    hints:
      - "สองประเทศในอเมริกาเหนือขับชิดขวา"
      - "มีคำตอบถูกสามข้อ"
    solution: "ขับชิดซ้าย: **the United Kingdom, Australia, New Zealand** · ขับชิดขวา: the United States, Canada"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.festivals-customs.p015
    topics: [english.culture.festivals-customs]
    difficulty: 4
    type: text
    stem: "เพื่อนชาวแคนาดาถามว่า *When is Mother's Day in Thailand?* เติมชื่อเดือน: *It's on 12 ___.*"
    accepted: ["August", "Aug", "Aug."]
    misconceptions:
      - { match: "May", feedback: "เดือนพฤษภาคมคือวันแม่ของแคนาดา สหรัฐฯ และออสเตรเลีย วันแม่ไทยคือ 12 สิงหาคม" }
      - { match: "December", feedback: "เดือนธันวาคม (5 ธ.ค.) คือวันพ่อของไทย" }
    hints:
      - "วันแม่ไทยตรงกับวันที่ 12 ของเดือนที่ 8"
      - "เดือนที่ 8 ภาษาอังกฤษว่าอะไร"
    solution: "*It's on 12 **August**.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.festivals-customs.p016
    topics: [english.culture.festivals-customs]
    difficulty: 5
    type: mcq
    stem: "ข้อใดอธิบาย Australia Day ได้ถูกต้องที่สุด"
    choices:
      - { id: a, text: "It is on 26 January. Many people celebrate, but some Aboriginal and Torres Strait Islander people see it as a day of mourning.", correct: true, feedback: "ถูก ให้ข้อมูลวันที่ และบอกว่าคนในประเทศมองวันนี้ต่างกัน" }
      - { id: b, text: "It is on 26 January, and every Australian celebrates it happily.", feedback: "เหมารวมเกินไป ชนพื้นเมืองบางส่วนมองว่าเป็นวันแห่งความโศกเศร้า" }
      - { id: c, text: "It is on 1 July, the same day as Canada Day.", feedback: "1 กรกฎาคมคือ Canada Day ส่วน Australia Day คือ 26 มกราคม" }
      - { id: d, text: "It is another name for Christmas in Australia.", feedback: "Australia Day เป็นวันชาติ ไม่ใช่คริสต์มาส" }
    hints:
      - "ดูปฏิทินในบทเรียน"
      - "ระวังประโยคที่ใช้คำว่า every หรือ all กับคนทั้งประเทศ"
    solution: "ข้อ a ถูกทั้งวันที่และไม่เหมารวม Australia Day คือ 26 มกราคม มีทั้งงานฉลองและการรำลึก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.culture.festivals-customs.p017
    topics: [english.culture.festivals-customs]
    difficulty: 5
    type: mcq
    stem: "เพื่อนชาวอังกฤษเล่าว่า *My family celebrates Diwali, not Christmas.* เมื่อถึงเทศกาลดิวาลี ข้อใดเหมาะสมที่สุด"
    choices:
      - { id: a, text: "Happy Diwali! What do you do at Diwali?", correct: true, feedback: "ถูก อวยพรตามเทศกาลของเพื่อนและถามด้วยความสนใจ" }
      - { id: b, text: "Merry Christmas!", feedback: "เพื่อนบอกแล้วว่าครอบครัวไม่ได้ฉลองคริสต์มาส" }
      - { id: c, text: "Why not? Everyone in the UK celebrates Christmas.", feedback: "เป็นการเหมารวม คนในสหราชอาณาจักรมีหลายศาสนาและวัฒนธรรม" }
      - { id: d, text: "Happy Halloween!", feedback: "ไม่ตรงกับเทศกาลที่เพื่อนฉลอง" }
    hints:
      - "เพื่อนบอกชื่อเทศกาลที่ครอบครัวฉลองแล้ว"
      - "อวยพรตามเทศกาลนั้น และไม่ตัดสินว่าทุกคนต้องฉลองเหมือนกัน"
    solution: "***Happy Diwali! What do you do at Diwali?*** ประเทศที่ใช้ภาษาอังกฤษมีคนหลายวัฒนธรรม ไม่ใช่ทุกคนฉลองคริสต์มาส"
    license: CC-BY-SA-4.0
    ai_assisted: true
