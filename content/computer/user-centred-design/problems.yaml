problems:
  - id: computer.design.user-centred-design.p001
    topics: [computer.design.user-centred-design]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเขียนเป็น user story ได้ถูกรูปแบบ"
    choices:
      - { id: a, text: "ในฐานะนักเรียน ป.1 ฉันต้องการเลือกเมนูจากรูปภาพ เพื่อสั่งอาหารได้เองแม้อ่านชื่อเมนูไม่ออก", correct: true }
      - { id: b, text: "แอปต้องมีสีสวยและทันสมัย", feedback: "ไม่บอกว่าผู้ใช้คือใคร ต้องการทำอะไร และเพื่ออะไร" }
      - { id: c, text: "ใช้แท็บเล็ตรุ่นใหม่ล่าสุด", feedback: "เป็นการเลือกอุปกรณ์ ไม่ใช่ความต้องการจากมุมของผู้ใช้" }
      - { id: d, text: "ในฐานะผู้ออกแบบ ฉันต้องการใช้โปรแกรมที่ชอบ", feedback: "user story มาจากผู้ใช้ระบบ ไม่ใช่ความชอบของผู้ออกแบบ" }
    hints:
      - "user story มีสามส่วน: ใครเป็นผู้ใช้ ต้องการทำอะไร เพื่ออะไร"
      - "ข้อใดเขียนจากมุมมองของผู้ใช้จริง"
    solution: "user story ต้องมีรูป ในฐานะ…ฉันต้องการ…เพื่อ… และมาจากมุมของผู้ใช้ ข้อ ก ครบทั้งสามส่วน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.design.user-centred-design.p002
    topics: [computer.design.user-centred-design]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ระบบสั่งอาหารล่วงหน้าในโรงอาหารโรงเรียน ใครเป็นผู้มีส่วนได้ส่วนเสียที่ควรไปถามความต้องการ (เลือกได้หลายข้อ)"
    choices:
      - { id: a, text: "นักเรียนทุกระดับชั้น", correct: true, feedback: "เป็นผู้สั่งอาหารโดยตรง" }
      - { id: b, text: "แม่ค้าในโรงอาหาร", correct: true, feedback: "ต้องรับรายการและเตรียมอาหารตามที่สั่ง" }
      - { id: c, text: "ครูเวรที่ดูแลโรงอาหาร", correct: true, feedback: "ได้รับผลเรื่องความเป็นระเบียบและการดูแลนักเรียน" }
      - { id: d, text: "ร้านขายโทรศัพท์ในห้างที่อยู่อีกจังหวัด", feedback: "ไม่ได้ใช้หรือได้รับผลจากระบบนี้" }
    hints:
      - "ใครใช้ระบบโดยตรง และใครได้รับผลจากระบบ"
      - "ผู้มีส่วนได้ส่วนเสียไม่ได้มีแค่คนที่กดสั่งอาหาร"
    solution: "นักเรียน แม่ค้า และครูเวรใช้หรือได้รับผลจากระบบทั้งหมด จึงต้องถามความต้องการทุกกลุ่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.design.user-centred-design.p003
    topics: [computer.design.user-centred-design]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นเกณฑ์การออกแบบที่ **วัดได้** ดีที่สุด"
    choices:
      - { id: a, text: "นักเรียนอย่างน้อย 80% สั่งอาหารเสร็จภายใน 60 วินาที", correct: true }
      - { id: b, text: "แอปต้องใช้ง่าย", feedback: "คำว่า ใช้ง่าย แต่ละคนตัดสินต่างกัน ไม่รู้ว่าเท่าไรจึงผ่าน" }
      - { id: c, text: "ทุกคนต้องชอบแอปนี้", feedback: "วัดยากและแทบเป็นไปไม่ได้ เกณฑ์ควรวัดสิ่งที่สังเกตหรือนับได้" }
      - { id: d, text: "หน้าจอต้องดูทันสมัย", feedback: "ความทันสมัยเป็นความเห็นส่วนตัว ไม่มีตัวเลขให้ตัดสิน" }
    hints:
      - "เกณฑ์ที่ดีต้องทดสอบได้ว่าผ่านหรือไม่ผ่าน"
      - "ข้อใดมีตัวเลขที่จับเวลาหรือนับได้"
    solution: "ข้อ ก มีตัวเลขทั้งจำนวนคนและเวลา จับเวลาทดสอบแล้วบอกได้ทันทีว่าผ่านหรือไม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.design.user-centred-design.p004
    topics: [computer.design.user-centred-design]
    difficulty: 2
    type: match
    stem: "จับคู่คำศัพท์การออกแบบกับความหมาย"
    pairs:
      - { left: "user story", right: "ประโยคบอกความต้องการจากมุมของผู้ใช้" }
      - { left: "เกณฑ์การออกแบบ", right: "ข้อกำหนดที่วัดได้ ใช้ตัดสินว่าผลงานดีพอหรือยัง" }
      - { left: "ภาพร่างหน้าจอ (wireframe)", right: "ภาพวาดอย่างง่ายแสดงว่าอะไรอยู่ตรงไหนบนจอ" }
      - { left: "ต้นแบบ (prototype)", right: "แบบจำลองที่ผู้ใช้ลองกดใช้ได้ก่อนสร้างจริง" }
      - { left: "ผู้มีส่วนได้ส่วนเสีย", right: "ทุกคนที่ใช้หรือได้รับผลจากระบบ" }
    hints:
      - "ภาพร่างกับต้นแบบต่างกันที่ลองใช้งานได้หรือไม่"
      - "คำใดใช้ตัดสินผลงาน คำใดบอกความต้องการ"
    solution: "user story = ความต้องการจากมุมผู้ใช้, เกณฑ์ = ข้อกำหนดที่วัดได้, wireframe = ภาพวาดตำแหน่งบนจอ, prototype = แบบจำลองที่ลองใช้ได้, ผู้มีส่วนได้ส่วนเสีย = ทุกคนที่ได้รับผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.design.user-centred-design.p005
    topics: [computer.design.user-centred-design]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการออกแบบระบบที่ยึดผู้ใช้เป็นศูนย์กลาง (รอบแรก)"
    items:
      - "สังเกตและสัมภาษณ์ผู้ใช้"
      - "เขียน user story และเกณฑ์การออกแบบ"
      - "ร่างทางเลือกหลายแบบแล้วเปรียบเทียบ"
      - "ทำต้นแบบของแบบที่เลือก"
      - "ให้ผู้ใช้จริงทดลองแล้วประเมินกับเกณฑ์"
    hints:
      - "ต้องรู้ความต้องการก่อนจึงจะเขียนเกณฑ์ได้"
      - "จะทดสอบได้ต้องมีต้นแบบก่อน"
    solution: "เข้าใจผู้ใช้ → นิยามปัญหาด้วย user story และเกณฑ์ → สร้างและเปรียบเทียบทางเลือก → ทำต้นแบบ → ทดสอบและประเมิน แล้ววนกลับไปปรับปรุง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.design.user-centred-design.p006
    topics: [computer.design.user-centred-design]
    difficulty: 3
    type: mcq
    stem: "user story: \"ในฐานะนักเรียน ป.1 ฉันต้องการเลือกเมนูจากรูปภาพ เพื่อสั่งอาหารได้เองแม้อ่านชื่อเมนูไม่ออก\" ภาพร่างแบบใดตอบ user story นี้ได้ดีกว่า เพราะอะไร"
    figure:
      src: wireframes-ab.svg
      alt: "ภาพร่างหน้าจอสั่งอาหารสองแบบ แบบ ก มีปุ่มใหญ่ 4 ปุ่ม แต่ละปุ่มมีรูปอาหารและชื่อเมนูตัวหนา และมีปุ่ม สั่งเลย ขนาดใหญ่ แบบ ข เป็นรายการตัวหนังสือสีเทาอ่อนขนาดเล็ก 8 เมนู มีช่องติ๊กเล็ก ๆ และปุ่ม ตกลง ขนาดเล็กสีจาง"
    choices:
      - { id: a, text: "แบบ ก เพราะมีรูปอาหารคู่ชื่อ และปุ่มใหญ่ที่นิ้วเด็กกดได้ง่าย", correct: true }
      - { id: b, text: "แบบ ข เพราะมีเมนูมากกว่า", feedback: "จำนวนเมนูไม่ได้ช่วยเด็กที่อ่านไม่คล่อง แบบ ข ไม่มีรูปเลย" }
      - { id: c, text: "แบบ ข เพราะบอกราคาครบทุกเมนู", feedback: "ราคาเป็นข้อมูลที่ดี แต่ user story นี้เน้นการเลือกจากรูปภาพ ซึ่งแบบ ข ไม่มี" }
      - { id: d, text: "เหมือนกัน เพราะสั่งอาหารได้ทั้งคู่", feedback: "สั่งได้ทั้งคู่สำหรับคนที่อ่านคล่อง แต่ต้องตัดสินจาก user story ของเด็ก ป.1 โดยเฉพาะ" }
    hints:
      - "อ่าน user story อีกครั้ง ผู้ใช้คือใคร มีข้อจำกัดอะไร"
      - "ภาพร่างแบบใดใช้ได้โดยไม่ต้องอ่านตัวหนังสือ"
    solution: "เด็ก ป.1 อ่านไม่คล่อง แบบ ก ใช้รูปภาพคู่ชื่อและปุ่มใหญ่ จึงตอบ user story ได้ ส่วนแบบ ข เป็นตัวหนังสือเล็กสีจางล้วน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.design.user-centred-design.p007
    topics: [computer.design.user-centred-design]
    difficulty: 3
    type: match
    stem: "หน้าจอในภาพมีจุดที่ออกแบบไม่ดี 4 จุด จับคู่หมายเลขกับวิธีแก้ที่ตรงที่สุด"
    figure:
      src: flawed-screen.svg
      alt: "หน้าจอแอปสั่งอาหาร หัวข้อ เมนูวันนี้ จุดที่ 1 คือไอคอนรูปเฟืองมุมขวาบนที่ไม่มีข้อความกำกับ จุดที่ 2 คือรายการเมนูที่เป็นตัวหนังสือสีเทาอ่อนมากบนพื้นขาว จุดที่ 3 คือปุ่มสีแดง ลบทั้งหมด วางติดกับปุ่มสีเขียว ยืนยันสั่ง ขนาดเท่ากัน จุดที่ 4 คือปุ่ม +1 ที่เล็กมาก"
    pairs:
      - { left: "จุดที่ 1", right: "ใส่ข้อความกำกับไอคอน เช่น ตั้งค่า" }
      - { left: "จุดที่ 2", right: "ใช้ตัวอักษรสีเข้มให้ตัดกับพื้น" }
      - { left: "จุดที่ 3", right: "แยกปุ่มอันตรายให้ห่าง และถามยืนยันก่อนลบ" }
      - { left: "จุดที่ 4", right: "ขยายปุ่มให้ใหญ่พอสำหรับนิ้ว" }
    hints:
      - "ดูทีละจุดว่าผู้ใช้จะติดปัญหาอะไร เช่น อ่านไม่ออก เดาความหมายไม่ได้ หรือกดพลาด"
      - "ปุ่มที่ทำให้ข้อมูลหายควรมีการป้องกันความผิดพลาด"
    solution: "1 ไอคอนไม่มีคำอธิบาย → ใส่ข้อความ, 2 สีจางอ่านยาก → ใช้สีเข้ม, 3 ปุ่มลบติดปุ่มยืนยัน → แยกห่างและถามยืนยัน, 4 ปุ่มเล็ก → ขยายให้ใหญ่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.design.user-centred-design.p008
    topics: [computer.design.user-centred-design]
    difficulty: 3
    type: numeric
    stem: "ใช้เกณฑ์ เด็ก ป.1 ใช้ง่าย (น้ำหนัก 3) สั่งได้เร็ว (น้ำหนัก 2) ต้นทุนต่ำ (น้ำหนัก 1) ทางเลือกแบบ ก ได้คะแนน 4, 3 และ 5 ตามลำดับ คะแนนรวมแบบถ่วงน้ำหนักของแบบ ก เป็นเท่าใด"
    answer: { value: 23, unit: คะแนน }
    hints:
      - "คูณคะแนนของแต่ละเกณฑ์ด้วยน้ำหนักของเกณฑ์นั้น"
      - "นำผลคูณทั้งสามมารวมกัน"
    misconceptions:
      - { match: 12, feedback: "12 คือ 4 + 3 + 5 ซึ่งยังไม่ได้คูณน้ำหนัก เกณฑ์ที่สำคัญกว่าต้องมีผลมากกว่า" }
      - { match: 6, feedback: "6 คือผลรวมของน้ำหนัก ต้องนำคะแนนแต่ละเกณฑ์มาคูณกับน้ำหนัก" }
    solution: "4 × 3 + 3 × 2 + 5 × 1 = 12 + 6 + 5 = 23 คะแนน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.design.user-centred-design.p009
    topics: [computer.design.user-centred-design]
    difficulty: 4
    type: numeric
    stem: |
      ทีมเปรียบเทียบแอปจองห้องดนตรีสองแบบด้วยคะแนน 1–5 ดังตาราง แบบ X ได้คะแนนรวมแบบถ่วงน้ำหนักเท่าใด

      | เกณฑ์ (น้ำหนัก) | แบบ X | แบบ Y |
      |---|---|---|
      | ใช้ง่าย (3) | 4 | 3 |
      | ราคาถูก (2) | 2 | 5 |
      | จองได้เร็ว (2) | 5 | 3 |
      | หน้าตาสวย (1) | 3 | 5 |
    answer: { value: 29, unit: คะแนน }
    hints:
      - "คูณคะแนนของแบบ X แต่ละเกณฑ์ด้วยน้ำหนัก"
      - "รวมผลคูณทั้งสี่"
    misconceptions:
      - { match: 14, feedback: "14 คือ 4 + 2 + 5 + 3 ที่ยังไม่ได้คูณน้ำหนัก" }
      - { match: 30, feedback: "30 คือคะแนนของแบบ Y โจทย์ถามแบบ X" }
    solution: "แบบ X: 4 × 3 + 2 × 2 + 5 × 2 + 3 × 1 = 12 + 4 + 10 + 3 = 29 คะแนน (แบบ Y ได้ 9 + 10 + 6 + 5 = 30 สูงกว่าเล็กน้อย คะแนนใกล้กันแบบนี้ควรทดสอบกับผู้ใช้จริงเพิ่ม)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.design.user-centred-design.p010
    topics: [computer.design.user-centred-design]
    difficulty: 3
    type: mcq
    stem: "ทีมอยากรู้ว่านักเรียน ป.1 ใช้ต้นแบบระบบสั่งอาหารได้จริงหรือไม่ วิธีใดให้ข้อมูลที่เชื่อถือได้มากที่สุด"
    choices:
      - { id: a, text: "ให้นักเรียน ป.1 หลายคนลองสั่งอาหาร แล้วสังเกต จับเวลา และจดจุดที่ติดขัด", correct: true }
      - { id: b, text: "ถามเพื่อนในทีมว่าใช้ง่ายไหม", feedback: "ทีมผู้ออกแบบรู้วิธีใช้อยู่แล้ว และไม่ใช่ผู้ใช้กลุ่มเป้าหมาย" }
      - { id: c, text: "ถามครูว่าคิดว่าเด็กจะใช้ได้ไหม", feedback: "เป็นการคาดเดาแทนผู้ใช้ ข้อมูลจากการลองใช้จริงเชื่อถือได้มากกว่า" }
      - { id: d, text: "ถามนักเรียน ป.1 ว่า ชอบแอปนี้ใช่ไหม", feedback: "เป็นคำถามชี้นำ เด็กมักตอบว่าใช่ แต่ไม่ได้บอกว่าใช้ได้จริงหรือไม่" }
    hints:
      - "ข้อมูลที่ดีที่สุดมาจากผู้ใช้กลุ่มไหน"
      - "ดูสิ่งที่ผู้ใช้ทำได้จริง ดีกว่าถามความเห็น"
    solution: "การทดสอบกับผู้ใช้กลุ่มเป้าหมายที่ทำงานจริง แล้วสังเกตและจับเวลา ให้หลักฐานเทียบกับเกณฑ์ได้โดยตรง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.design.user-centred-design.p011
    topics: [computer.design.user-centred-design]
    difficulty: 3
    type: numeric
    stem: "ทดสอบต้นแบบกับนักเรียน ป.1 จำนวน 10 คน มี 7 คนสั่งอาหารเสร็จภายใน 60 วินาที คิดเป็นกี่เปอร์เซ็นต์"
    answer: { value: 70, unit: "%" }
    hints:
      - "เปอร์เซ็นต์ = จำนวนที่ทำได้ ÷ จำนวนทั้งหมด × 100"
      - "7 ÷ 10 × 100"
    misconceptions:
