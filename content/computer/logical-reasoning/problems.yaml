    ai_assisted: true

  - id: computer.algorithms.logical-reasoning.p013
    topics: [computer.algorithms.logical-reasoning]
    difficulty: 4
    type: numeric
    stem: "เครื่องรดน้ำแปลงผักของโรงเรียนรดน้ำในวันที่ความชื้นในดิน **ต่ำกว่า 30** วัดความชื้น 4 วันได้ 25, 40, 30 และ 10 เครื่องรดน้ำกี่วัน"
    answer: { value: 2, unit: วัน }
    hints:
      - "ตรวจเงื่อนไข ความชื้น < 30 ทีละวัน"
      - "30 ต่ำกว่า 30 หรือไม่"
    misconceptions:
      - { match: 3, feedback: "นับวันที่ความชื้น 30 ด้วย แต่ 30 ไม่ได้ต่ำกว่า 30 เงื่อนไขจึงเป็นเท็จ" }
      - { match: 1, feedback: "ตรวจอีกครั้ง ทั้ง 25 และ 10 ต่ำกว่า 30" }
    solution: "25 < 30 จริง, 40 < 30 เท็จ, 30 < 30 เท็จ, 10 < 30 จริง รดน้ำ 2 วัน"
