topic: engineering.management.engineering-economics
rows:
  - { framework: th-coe-engineering-basics, indicators: ["IE-3.4"], coverage: partial, note: "สอนการวิเคราะห์ทางเศรษฐศาสตร์เพื่อการตัดสินใจ ความเสี่ยงและความไม่แน่นอน (ความไว จุดคุ้มทุน ค่าคาดหมาย) และการประเมินความคุ้มค่าของโครงการ ส่วนการจัดการต้นทุนเพื่องบประมาณ และการวิเคราะห์งบการเงินและการบัญชีไม่ได้สอน" }
  - { framework: th-coe-engineering-basics, indicators: ["CIV-3.2"], coverage: partial, note: "สอนเฉพาะแนวคิดและหลักการของเศรษฐศาสตร์วิศวกรรม (รวม B/C ของโครงการรัฐ) ส่วนการบริหารโครงการ การประมาณต้นทุน ความปลอดภัย และกฎหมายก่อสร้างอยู่นอกหัวข้อนี้" }
  - { framework: th-coe-engineering-basics, indicators: ["CHE-3.10"], coverage: partial, note: "สอนหลักเศรษฐศาสตร์วิศวกรรมและการประเมินการลงทุน แต่ไม่ได้สอนการประเมินราคาทุนของโรงงานเคมี (cost estimation) และผลของเงินเฟ้อ" }
  - { framework: abet-eac, indicators: ["Civil 1.d", "Industrial 1"], coverage: partial, note: "ครอบคลุมเฉพาะส่วนเศรษฐศาสตร์วิศวกรรม ส่วนการบริหารโครงการ ความรับผิดชอบทางวิชาชีพ ผลิตภาพ การวิจัยดำเนินงาน และปัจจัยมนุษย์อยู่ในหัวข้ออื่น" }
