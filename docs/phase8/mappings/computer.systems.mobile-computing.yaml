topic: computer.systems.mobile-computing
rows:
  - { framework: acm-cs2023, indicators: ["NC-Mobility"], coverage: partial, note: "เครือข่ายเซลลูลาร์ สถานีฐาน การส่งต่อ การเปลี่ยนเครือข่ายและที่อยู่ IP และ Wi-Fi โรมมิ่ง (บทเรียนส่วนเครือข่ายและส่วนที่อยู่ IP; โจทย์ p001 p004 p014) ยังไม่ลงลึกโพรโทคอลการเคลื่อนที่ของ IP" }
  - { framework: acm-cs2023, indicators: ["SPD-Mobile"], coverage: partial, note: "แพลตฟอร์มแอปเนทีฟ เว็บแอป ข้ามแพลตฟอร์ม และวงจรชีวิตของแอป (บทเรียนส่วนแพลตฟอร์มและวงจรชีวิต; โจทย์ p002 p006 p008) ยังไม่ลงรายละเอียด SDK ของแต่ละแพลตฟอร์ม" }
  - { framework: acm-cs2023, indicators: ["SPD-Common"], coverage: full, note: "ข้อควรคิดทุกแพลตฟอร์ม ได้แก่ การเข้าถึงได้ ภาษาและฟอนต์ไทย ความปลอดภัย และการอัปเดต (บทเรียนส่วนเรื่องที่ต้องคิดทุกแพลตฟอร์ม; โจทย์ p017)" }
