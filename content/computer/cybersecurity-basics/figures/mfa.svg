<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" font-family="sans-serif" font-size="14">
  <title>ปัจจัยยืนยันตัวตนสามแบบ และการยืนยันตัวตนหลายปัจจัยที่กันคนร้ายแม้รหัสผ่านรั่ว</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="860" height="360" fill="#ffffff"/>
  <rect x="30.0" y="20.0" width="250.0" height="95.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="155.0" y="63.1" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">สิ่งที่รู้</text>
  <text x="155.0" y="89.0" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">รหัสผ่าน วลีรหัสผ่าน PIN</text>
  <rect x="305.0" y="20.0" width="250.0" height="95.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="430.0" y="54.4" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">สิ่งที่มี</text>
  <text x="430.0" y="80.2" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">โทรศัพท์ที่รับรหัส</text>
  <text x="430.0" y="97.8" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">แอปยืนยันตัวตน กุญแจ USB</text>
  <rect x="580.0" y="20.0" width="250.0" height="95.0" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="705.0" y="63.1" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">สิ่งที่เป็น</text>
  <text x="705.0" y="89.0" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">ลายนิ้วมือ ใบหน้า</text>
  <text x="430.0" y="150.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">การยืนยันตัวตนหลายปัจจัย (MFA) = ใช้ตั้งแต่ 2 แบบที่ต่างกัน</text>
  <rect x="30.0" y="200.0" width="190.0" height="70.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="125.0" y="230.8" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">คนร้ายได้รหัสผ่าน</text>
  <text x="125.0" y="254.2" font-size="12" text-anchor="middle" fill="#1f2937" xml:space="preserve">จากเว็บอื่นที่ข้อมูลรั่ว</text>
  <line x1="222.0" y1="235.0" x2="262.0" y2="235.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="265.0" y="200.0" width="190.0" height="70.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="360.0" y="230.8" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ระบบขอปัจจัยที่สอง</text>
  <text x="360.0" y="254.2" font-size="12" text-anchor="middle" fill="#1f2937" xml:space="preserve">รหัสในแอปบนโทรศัพท์</text>
  <line x1="457.0" y1="235.0" x2="497.0" y2="235.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="500.0" y="200.0" width="150.0" height="70.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="575.0" y="230.8" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">คนร้ายไม่มี</text>
  <text x="575.0" y="254.2" font-size="12" text-anchor="middle" fill="#1f2937" xml:space="preserve">โทรศัพท์ของเรา</text>
  <line x1="652.0" y1="235.0" x2="692.0" y2="235.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="695.0" y="200.0" width="140.0" height="70.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="765.0" y="230.8" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">เข้าไม่ได้</text>
  <text x="765.0" y="254.2" font-size="12" text-anchor="middle" fill="#1f2937" xml:space="preserve">บัญชียังปลอดภัย</text>
  <text x="430.0" y="310.0" font-size="13" text-anchor="middle" fill="#6b7280" xml:space="preserve">ปัจจัยต้องต่างชนิดกัน รหัสผ่านสองชุดยังเป็น "สิ่งที่รู้" แบบเดียว</text>
  <text x="430.0" y="335.0" font-size="13" text-anchor="middle" fill="#6b7280" xml:space="preserve">ห้ามบอกรหัสยืนยัน (OTP) แก่ใคร เพราะจะทำให้ปัจจัยที่สองไร้ประโยชน์</text>
</svg>
