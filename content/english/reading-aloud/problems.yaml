problems:
  - id: english.phonics.reading-aloud.p001
    topics: [english.phonics.reading-aloud]
    difficulty: 1
    type: numeric
    stem: "คำว่า *banana* มีกี่พยางค์"
    answer: { value: 3, unit: "พยางค์" }
    misconceptions:
      - { match: 6, feedback: "6 คือจำนวนตัวอักษร พยางค์นับจากเสียงสระ ba-na-na" }
      - { match: 2, feedback: "ลองตบมือทีละพยางค์ ba-na-na" }
    hints:
      - "พยางค์นับจากเสียงสระ ไม่ใช่จำนวนตัวอักษร"
      - "แยกคำเป็น ba / na / na"
    solution: "*ba-NA-na* มี **3** พยางค์ เน้นพยางค์ที่สอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.reading-aloud.p002
    topics: [english.phonics.reading-aloud]
    difficulty: 1
    type: mcq
    stem: "คำว่า *teacher* เน้นเสียงพยางค์ไหน"
    choices:
      - { id: a, text: "TEA-cher (พยางค์แรก)", correct: true, feedback: "ถูก teacher เป็นรูปแบบ ●○" }
      - { id: b, text: "tea-CHER (พยางค์ที่สอง)", feedback: "คำนามสองพยางค์ส่วนใหญ่เน้นพยางค์แรก -er ท้ายคำอ่านเบา" }
      - { id: c, text: "เน้นเท่ากันทั้งสองพยางค์", feedback: "คำที่มีสองพยางค์ขึ้นไปจะมีพยางค์เน้นหนึ่งพยางค์" }
    hints:
      - "คำนามสองพยางค์ส่วนใหญ่เน้นพยางค์ไหน"
      - "ส่วนท้าย -er มักอ่านเบา"
    solution: "**TEA**-cher เน้นพยางค์แรก (●○)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.reading-aloud.p003
    topics: [english.phonics.reading-aloud]
    difficulty: 1
    type: mcq
    stem: "คำถาม *Are you hungry?* มักอ่านท้ายประโยคด้วยเสียงแบบไหน"
    choices:
      - { id: a, text: "ขึ้น ↗", correct: true, feedback: "ถูก คำถาม Yes/No มักขึ้นเสียงท้าย" }
      - { id: b, text: "ลง ↘", feedback: "เสียงลงใช้กับประโยคบอกเล่าและคำถาม Wh- ส่วน Are you ...? ตอบ Yes/No ได้" }
      - { id: c, text: "ระดับเดียวตลอด", feedback: "ถ้าอ่านระดับเดียว ผู้ฟังอาจไม่รู้ว่าเป็นคำถาม" }
    hints:
      - "คำถามนี้ตอบ Yes หรือ No ได้หรือไม่"
      - "คำถาม Yes/No ใช้ทำนองแบบไหน"
    solution: "*Are you hungry?↗* เป็นคำถาม Yes/No อ่าน **ขึ้น** ท้าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.reading-aloud.p004
    topics: [english.phonics.reading-aloud]
    difficulty: 2
    type: match
    stem: "จับคู่คำกับรูปแบบการเน้นเสียง (● = เน้น ○ = ไม่เน้น)"
    pairs:
      - { left: "mango", right: "●○" }
      - { left: "hotel", right: "○●" }
      - { left: "computer", right: "○●○" }
      - { left: "hospital", right: "●○○" }
    hints:
      - "นับพยางค์ก่อน แล้วหาพยางค์ที่ดังที่สุด"
      - "MAN-go, ho-TEL, com-PU-ter, HOS-pi-tal"
    solution: "**MAN**go ●○ · ho**TEL** ○● · com**PU**ter ○●○ · **HOS**pital ●○○"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.reading-aloud.p005
    topics: [english.phonics.reading-aloud]
    difficulty: 2
    type: numeric
    stem: "คนไทยมักอ่าน *school* ว่า \"สะ-กูล\" ที่จริงคำนี้มีกี่พยางค์"
    answer: { value: 1, unit: "พยางค์" }
    misconceptions:
      - { match: 2, feedback: "ภาษาไทยเติมสระ อะ ระหว่าง s กับ k แต่ภาษาอังกฤษควบ sk ในพยางค์เดียว" }
      - { match: 6, feedback: "6 คือจำนวนตัวอักษร school มีเสียงสระเดียวคือ oo" }
    hints:
      - "school มีเสียงสระกี่เสียง"
      - "sch ต้นคำเป็นพยัญชนะควบ ไม่มีสระคั่น"
    solution: "*school* มีเสียงสระ oo เสียงเดียว จึงมี **1** พยางค์ อ่าน s กับ k ติดกันโดยไม่เติม อะ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.reading-aloud.p006
    topics: [english.phonics.reading-aloud]
    difficulty: 2
    type: mcq
    stem: "แม่ค้าบอกราคาว่า **FIF**-ty baht (เน้นพยางค์แรก) ราคาคือเท่าไร"
    choices:
      - { id: a, text: "50 บาท", correct: true, feedback: "ถูก -ty เน้นพยางค์แรก FIF-ty = 50" }
      - { id: b, text: "15 บาท", feedback: "15 คือ fif-TEEN เน้นพยางค์ท้ายและยืดเสียง ee" }
      - { id: c, text: "5 บาท", feedback: "5 คือ five มีพยางค์เดียว" }
    hints:
      - "-teen เน้นพยางค์ไหน -ty เน้นพยางค์ไหน"
      - "เน้นพยางค์แรกคือคำที่ลงท้าย -ty"
    solution: "**FIF**-ty = fifty = **50 บาท** ส่วน fif-**TEEN** = 15"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.reading-aloud.p007
    topics: [english.phonics.reading-aloud]
    difficulty: 2
    type: text
    stem: "เขียนพยางค์ที่เน้นในคำ *com-pu-ter* (พิมพ์เฉพาะพยางค์นั้น)"
    accepted: ["pu"]
    misconceptions:
      - { match: "com", feedback: "คนไทยมักเน้นพยางค์แรกหรือท้ายตามคำยืม คอมพิวเตอร์ แต่ภาษาอังกฤษเน้นพยางค์กลาง" }
      - { match: "ter", feedback: "-ter ท้ายคำอ่านเบา คำนี้เน้นพยางค์กลาง" }
    hints:
      - "คำนี้มีรูปแบบ ○●○"
      - "พยางค์กลางของ com-pu-ter คืออะไร"
    solution: "com-**PU**-ter เน้นพยางค์ที่สอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.reading-aloud.p008
    topics: [english.phonics.reading-aloud]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ในประโยค *I want to buy a new bag.* คำใดมักอ่าน **เน้น** (เลือกทุกคำ)"
    choices:
      - { id: a, text: "want", correct: true, feedback: "ถูก กริยาหลักเป็นคำเนื้อหา" }
      - { id: b, text: "to", feedback: "to เป็นคำไวยากรณ์ อ่านเบาและสั้น คล้าย เทอะ" }
      - { id: c, text: "buy", correct: true, feedback: "ถูก กริยาหลักเป็นคำเนื้อหา" }
      - { id: d, text: "a", feedback: "a เป็นคำนำหน้านาม อ่านเบามาก" }
      - { id: e, text: "new", correct: true, feedback: "ถูก คำคุณศัพท์เป็นคำเนื้อหา" }
      - { id: f, text: "bag", correct: true, feedback: "ถูก คำนามเป็นคำเนื้อหา" }
    hints:
      - "คำเนื้อหาคือ คำนาม กริยาหลัก คุณศัพท์"
      - "คำไวยากรณ์ เช่น a, to อ่านเบา"
    solution: "*I **WANT** to **BUY** a **NEW BAG**.* เน้น want, buy, new, bag"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.reading-aloud.p009
    topics: [english.phonics.reading-aloud]
    difficulty: 3
    type: mcq
    stem: "ประโยคใดมักอ่าน **ลงเสียง** ↘ ท้ายประโยค"
    choices:
      - { id: a, text: "Where do you live?", correct: true, feedback: "ถูก คำถามที่ขึ้นต้นด้วย where, what, who มักลงเสียงท้าย" }
      - { id: b, text: "Do you like durian?", feedback: "เป็นคำถาม Yes/No มักขึ้นเสียงท้าย" }
      - { id: c, text: "Is this your bag?", feedback: "เป็นคำถาม Yes/No มักขึ้นเสียงท้าย" }
      - { id: d, text: "Can you swim?", feedback: "เป็นคำถาม Yes/No มักขึ้นเสียงท้าย" }
    hints:
      - "แยกคำถาม Yes/No กับคำถาม Wh-"
      - "คำถาม Wh- ลงเสียงท้ายเหมือนประโยคบอกเล่า"
    solution: "***Where** do you live?↘* เป็นคำถาม Wh- อ่านลงท้าย ส่วนอีกสามข้อเป็นคำถาม Yes/No อ่านขึ้นท้าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.reading-aloud.p010
    topics: [english.phonics.reading-aloud]
    difficulty: 3
    type: order
    stem: "เรียงบรรทัดของกลอนเด็ก (chant) ให้ถูกลำดับ โดยดูจากตัวเลข"
    items: ["One, two, buckle my shoe.", "Three, four, knock at the door.", "Five, six, pick up sticks.", "Seven, eight, lay them straight."]
    hints:
      - "แต่ละบรรทัดขึ้นต้นด้วยตัวเลขสองตัว"
      - "เรียงจาก one, two ไปถึง seven, eight"
    solution: "*One, two, buckle my shoe. / Three, four, knock at the door. / Five, six, pick up sticks. / Seven, eight, lay them straight.* คำท้ายบรรทัดคู่กันสัมผัสกับตัวเลข (two–shoe, four–door, six–sticks, eight–straight)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.reading-aloud.p011
    topics: [english.phonics.reading-aloud]
    difficulty: 3
    type: mcq
    stem: "เวลาพูดเร็ว คู่คำใดอ่าน **เชื่อมเสียง** (พยัญชนะท้าย + สระต้นคำถัดไป)"
    choices:
      - { id: a, text: "turn off", correct: true, feedback: "ถูก n ท้าย turn เชื่อมกับสระ o: เทิร์-นอฟ" }
      - { id: b, text: "big dog", feedback: "dog ขึ้นต้นด้วยพยัญชนะ d ไม่ใช่สระ จึงไม่ใช่การเชื่อมแบบพยัญชนะ + สระ" }
      - { id: c, text: "red car", feedback: "car ขึ้นต้นด้วยพยัญชนะ c จึงไม่ใช่การเชื่อมแบบพยัญชนะ + สระ" }
      - { id: d, text: "blue sky", feedback: "blue ลงท้ายด้วยเสียงสระ และ sky ขึ้นต้นด้วยพยัญชนะ" }
    hints:
      - "ดูตัวท้ายของคำแรกและตัวแรกของคำที่สอง"
      - "หาคู่ที่คำแรกลงท้ายพยัญชนะและคำที่สองขึ้นต้นด้วยสระ"
    solution: "*turn‿off* อ่านต่อกันเป็น เทิร์-นอฟ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.reading-aloud.p012
    topics: [english.phonics.reading-aloud]
    difficulty: 3
    type: mcq
    stem: "ทำไมคนไทยมักอ่าน *desk* ว่า \"เดส\""
    choices:
      - { id: a, text: "ภาษาไทยไม่มีพยัญชนะสองตัวซ้อนกันท้ายคำ จึงตัดเสียง k ทิ้ง", correct: true, feedback: "ถูก ภาษาอังกฤษต้องอ่าน s และ k ท้ายคำครบ: เดสก์" }
      - { id: b, text: "ตัว k ท้ายคำในภาษาอังกฤษไม่ออกเสียงเสมอ", feedback: "k ท้ายคำออกเสียง เช่น book, milk, desk ที่ไม่ออกเสียงคือ k ต้นคำบางคำ เช่น know" }
      - { id: c, text: "desk มีสองพยางค์ คนไทยจึงอ่านแค่พยางค์แรก", feedback: "desk มีพยางค์เดียว (สระ e ตัวเดียว)" }
    hints:
      - "นับพยัญชนะท้ายคำ desk"
      - "ภาษาไทยมีตัวสะกดซ้อนสองเสียงหรือไม่"
    solution: "ภาษาไทยมีตัวสะกดเสียงเดียว ผู้เรียนจึงมักตัด k ทิ้ง ภาษาอังกฤษต้องอ่าน **s + k** ท้ายคำครบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.reading-aloud.p013
    topics: [english.phonics.reading-aloud]
    difficulty: 4
    type: mcq
    stem: "ในประโยค *Here is your PREsent.* (เน้นพยางค์แรก) คำว่า present ทำหน้าที่อะไร"
    choices:
      - { id: a, text: "คำนาม แปลว่า ของขวัญ", correct: true, feedback: "ถูก present ที่เป็นคำนามเน้นพยางค์แรก PRE-sent" }
      - { id: b, text: "กริยา แปลว่า นำเสนอ", feedback: "กริยาเน้นพยางค์ที่สอง pre-SENT เช่น I present my project." }
      - { id: c, text: "คำคุณศัพท์ แปลว่า เร็ว", feedback: "present ไม่ได้แปลว่า เร็ว และตำแหน่งหลัง your ต้องเป็นคำนาม" }
    hints:
      - "คำที่ตามหลัง your มักเป็นคำชนิดใด"
      - "คำสองพยางค์บางคำ เป็นคำนามเมื่อเน้นหน้า เป็นกริยาเมื่อเน้นหลัง"
    solution: "**PRE**sent เน้นหน้าเป็นคำนาม (ของขวัญ) ส่วน pre**SENT** เน้นหลังเป็นกริยา (นำเสนอ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.reading-aloud.p014
    topics: [english.phonics.reading-aloud]
    difficulty: 4
    type: mcq
    stem: "ในวลี *fish and chips* เมื่อพูดเร็ว คำว่า and มักออกเสียงแบบไหน"
    choices:
      - { id: a, text: "เสียงสั้นเบา คล้าย \"เอิน\": ฟิช-เชิน-ชิปส์", correct: true, feedback: "ถูก and เป็นคำไวยากรณ์ จึงใช้รูปเสียงเบา" }
      - { id: b, text: "เสียงเต็ม \"แอนด์\" และเน้นหนัก", feedback: "ถ้าเน้น and จะฟังเหมือนตั้งใจแยกสองอย่าง ปกติอ่านเบา" }
      - { id: c, text: "ไม่ออกเสียงเลย", feedback: "and ยังมีเสียงอยู่ แค่เบาและสั้น" }
    hints:
      - "and เป็นคำเนื้อหาหรือคำไวยากรณ์"
      - "คำไวยากรณ์มักมีรูปเสียงเบา"
    solution: "*fish and chips* อ่านเร็วคล้าย **ฟิช-เชิน-ชิปส์** เน้น FISH และ CHIPS"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.reading-aloud.p015
    topics: [english.phonics.reading-aloud]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "เลือกประโยคที่มักอ่าน **ขึ้นเสียง** ↗ ท้ายประโยค (เลือกทุกข้อ)"
    choices:
      - { id: a, text: "Is it raining?", correct: true, feedback: "ถูก คำถาม Yes/No" }
      - { id: b, text: "Do you like mangoes?", correct: true, feedback: "ถูก คำถาม Yes/No" }
      - { id: c, text: "What's your name?", feedback: "คำถาม Wh- มักลงเสียงท้าย" }
      - { id: d, text: "Sit down, please.", feedback: "ประโยคคำสั่งมักลงเสียงท้าย" }
      - { id: e, text: "I'm from Khon Kaen.", feedback: "ประโยคบอกเล่าลงเสียงท้าย" }
    hints:
      - "หาประโยคที่ตอบ Yes หรือ No ได้"
      - "บอกเล่า คำสั่ง และคำถาม Wh- ลงเสียง"
    solution: "*Is it raining?↗* และ *Do you like mangoes?↗* ขึ้นเสียง ข้ออื่นลงเสียง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.reading-aloud.p016
    topics: [english.phonics.reading-aloud]
    difficulty: 4
    type: text
    stem: "อ่านรายการ *I like rice, fish and mangoes.* คำไหนอ่าน **ลงเสียง** ↘ (พิมพ์คำเดียว)"
    accepted: ["mangoes"]
    misconceptions:
      - { match: "rice", feedback: "คำแรกและคำกลางของรายการขึ้นเสียงเพื่อบอกว่ายังมีต่อ" }
      - { match: "fish", feedback: "คำกลางของรายการขึ้นเสียงเพื่อบอกว่ายังมีต่อ" }
    hints:
      - "รายการขึ้นเสียงทุกคำจนถึงคำสุดท้าย"
      - "คำสุดท้ายบอกว่ารายการจบแล้ว"
    solution: "*I like rice↗, fish↗ and **mangoes**↘.* ลงเสียงที่คำสุดท้ายของรายการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.phonics.reading-aloud.p017
    topics: [english.phonics.reading-aloud]
    difficulty: 5
    type: mcq
    stem: "ครูให้อ่านประกาศหน้าเสาธง *Good morning, students. The school bus leaves at three o'clock from the front gate.* ควรเน้นกลุ่มคำใดมากที่สุด"
    choices:
      - { id: a, text: "school bus · three o'clock · front gate", correct: true, feedback: "ถูก เป็นข้อมูลสำคัญ อะไร เมื่อไร ที่ไหน" }
