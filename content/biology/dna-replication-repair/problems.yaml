  - id: biology.genetics.dna-replication-repair.p023
    topics: [biology.genetics.dna-replication-repair]
    difficulty: 4
    type: code
    stem: "เขียนฟังก์ชัน `hybrid_fraction(n)` ที่คืนสัดส่วนของโมเลกุลดีเอ็นเอลูกผสม (สายหนักหนึ่งสายและสายเบาหนึ่งสาย) ในรุ่นที่ n ของการจำลองแบบกึ่งอนุรักษ์ ถ้า n เป็น 0 คืน 0.0 และถ้า n มากกว่า 0 คืน 2 หารด้วย 2 ยกกำลัง n"
    starter: |
      def hybrid_fraction(n):
          pass
    tests: |
      r = hybrid_fraction(1)
      assert r is not None, "ไม่ได้คืนค่า (ได้ None) ต้องใช้ return ไม่ใช่ print"
      assert abs(r - 1.0) < 1e-9, f"รุ่นที่ 1 ทุกโมเลกุลเป็นลูกผสม ควรได้ 1.0 แต่ได้ {r}"
      assert abs(hybrid_fraction(2) - 0.5) < 1e-9, f"รุ่นที่ 2 ควรได้ 0.5 แต่ได้ {hybrid_fraction(2)}"
      assert abs(hybrid_fraction(3) - 0.25) < 1e-9, f"รุ่นที่ 3 ควรได้ 0.25 แต่ได้ {hybrid_fraction(3)}"
      assert hybrid_fraction(0) == 0.0, "รุ่นที่ 0 ไม่มีลูกผสมเลย ต้องคืน 0.0"
    reference: |
      def hybrid_fraction(n):
          if n == 0:
              return 0.0
          return 2 / 2 ** n
    hints:
      - "แยกกรณี n เท่ากับศูนย์ออกก่อน"
      - "จำนวนลูกผสมคงที่ที่ 2 โมเลกุลในทุกรุ่นหลังรุ่นแรก ส่วนจำนวนรวมเพิ่มเป็นสองเท่าทุกรุ่น"
    solution: "return 2 / 2 ** n เมื่อ n มากกว่า 0 เช่น hybrid_fraction(2) = 2 ÷ 4 = 0.5"
    license: CC-BY-SA-4.0
    ai_assisted: true

