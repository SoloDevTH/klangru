id: thai.writing.handwriting
subject: thai
title: { th: การคัดลายมือตัวบรรจง, en: Thai handwriting in neat print style }
summary: ส่วนต่าง ๆ ของตัวอักษรไทย หัว หาง เชิง ลำดับการลากเส้นที่เริ่มจากหัว และหลักการคัดตัวบรรจงเต็มบรรทัดและครึ่งบรรทัด
difficulty: 1.5
minutes: 25
prerequisites: [thai.writing.vowels, thai.writing.tone-marks-numerals]
encompasses:
  - { id: thai.writing.tone-marks-numerals, weight: 0.2 }
  - { id: thai.writing.vowels, weight: 0.1 }
curriculum_tags: []
lessons:
  - type: figure
    src: stroke-order.svg
    alt: "ลำดับการลากเส้นของพยัญชนะ 6 ตัวบนเส้นบรรทัด จุดสีเขียวคือจุดเริ่มที่หัว ลูกศรสีแดงบอกทิศทาง ลากต่อเนื่องเส้นเดียว บ: เริ่มที่หัวบนซ้าย ลากลง ไปทางขวา แล้วขึ้น ป: เหมือน บ แต่เส้นขวาขึ้นเลยเส้นบนเป็นหาง พ: เริ่มที่หัวบนซ้าย ลากลง เฉียงขึ้นยอดกลาง เฉียงลง แล้วขึ้นเส้นขวา ฟ: เหมือน พ แต่เส้นขวาเป็นหางยาว ด: เริ่มที่หัวข้างในตัว ลากลงถึงเส้นล่าง ขึ้นด้านซ้าย โค้งข้ามบน แล้วลงด้านขวา ต: เหมือน ด แต่ด้านบนมีหยักรูปตัววี"
    caption: "เริ่มที่หัว แล้วลากต่อเนื่องเส้นเดียว"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: line-sizes.svg
    alt: "เปรียบเทียบคำว่า ป่า สองแบบ ซ้าย เต็มบรรทัด: ตัว ป และ า สูงเต็มช่องระหว่างเส้นสองเส้น หางของ ป และไม้เอกอยู่ในช่องเหนือขึ้นไป ขวา ครึ่งบรรทัด: ตัวอักษรสูงประมาณครึ่งช่อง ตั้งบนเส้นล่าง หางและไม้เอกอยู่ในครึ่งบน มีเส้นประแบ่งครึ่งช่อง"
    caption: "ตัวบรรจงเต็มบรรทัดและครึ่งบรรทัด"
  - type: worked-example
    title: คัดคำว่า ปู แบบเต็มบรรทัด
    problem: "คัดคำว่า ปู ตัวบรรจงเต็มบรรทัด ทำทีละขั้นอย่างไร"
    steps:
      - text: "เขียนหัวของ ป ที่ระดับเส้นบน ด้านซ้าย ให้กลมและโปร่ง"
      - text: "ลากลงถึงเส้นล่าง ลากไปทางขวาตามเส้น แล้วลากขึ้นเลยเส้นบนเป็นหาง"
        why: "หางที่สั้นเกินไปทำให้ ป ดูเหมือน บ"
      - text: "เขียนสระอูใต้เส้นล่าง ตรงกลางตัว ป ไม่เยื้องไปตัวอื่น"
      - text: "ตรวจว่าตัวอักษรแตะเส้นพอดีและตั้งตรง"
    answer: "ป หัวกลมอยู่บนซ้าย หางขึ้นเหนือเส้น และสระอูอยู่ใต้เส้นตรงกลาง"
  - { type: check, problem: thai.writing.handwriting.p002, prompt: "ดูตำแหน่งและรูปร่างของหัว" }
  - type: worked-example
    title: แยกตัวอักษรที่หน้าตาคล้ายกัน
    problem: "คำว่า ดอกฟ้า เขียนอย่างไรไม่ให้ครูอ่านเป็น ตอกพ้า"
    steps:
      - text: "ด ไม่มีหยักข้างบน ส่วน ต มีหยัก จึงต้องเขียนยอดของ ด ให้โค้งเรียบ"
      - text: "ฟ ต้องลากเส้นขวาขึ้นเลยเส้นบนเป็นหางชัด ๆ ถ้าหางสั้นจะกลายเป็น พ"
      - text: "ไม้โทของ ฟ้า วางเยื้องซ้าย ไม่ทับหางของ ฟ"
    answer: "ด ยอดโค้งเรียบ · ฟ หางยาวชัด · ไม้โทเยื้องซ้ายไม่ทับหาง"
  - { type: check, problem: thai.writing.handwriting.p007, prompt: "นับพยัญชนะที่มีหางยาว" }
glossary:
  - { term: ตัวบรรจง, definition: "ตัวอักษรที่เขียนอย่างตั้งใจ ทุกส่วนครบ หัวกลม เส้นตรง ขนาดเท่ากัน" }
  - { term: หัว, definition: "วงกลมเล็กที่เป็นจุดเริ่มเขียนของพยัญชนะส่วนใหญ่" }
  - { term: หัวบอด, definition: "หัวที่วงทึบจนไม่เห็นช่องตรงกลาง ทำให้อ่านยาก" }
  - { term: ช่องไฟ, definition: "ระยะห่างระหว่างตัวอักษรที่ควรเท่า ๆ กัน" }
  - { term: ครึ่งบรรทัด, definition: "การคัดให้ตัวพยัญชนะสูงประมาณครึ่งช่องบรรทัด ตั้งบนเส้นล่าง" }
flashcards:
  - { front: "คัดตัวบรรจงต้องเริ่มที่ใด", back: "ที่หัวเสมอ แล้วลากต่อเนื่องเส้นเดียว" }
  - { front: "พยัญชนะที่มีหางยาวขึ้นเหนือเส้น", back: "ป ฝ ฟ ฬ" }
  - { front: "เต็มบรรทัดกับครึ่งบรรทัดต่างกันอย่างไร", back: "เต็ม = พยัญชนะสูงเต็มช่อง · ครึ่ง = สูงครึ่งช่อง ตั้งบนเส้นล่าง" }
  - { front: "หลักการคัดตัวบรรจง", back: "หัวกลมไม่บอด หัวถูกที่ เส้นตรง ขนาดเท่ากัน ช่องไฟเท่ากัน" }
references:
