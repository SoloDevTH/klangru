    stem: "นักบินอวกาศคนเดิมชั่งน้ำหนักบนดวงจันทร์ได้น้อยกว่าบนโลกประมาณ 6 เท่า เหตุผลใดถูกต้องที่สุด"
    choices:
      - { id: a, text: "ดวงจันทร์มีมวลน้อยกว่าโลกมาก แรงโน้มถ่วงที่ดวงจันทร์ดึงจึงน้อยกว่า", correct: true }
      - { id: b, text: "มวลของนักบินอวกาศลดลงเมื่ออยู่บนดวงจันทร์", feedback: "มวลคือปริมาณเนื้อสาร ไม่เปลี่ยนตามสถานที่ สิ่งที่เปลี่ยนคือแรงที่ดวงดาวดึง" }
      - { id: c, text: "บนดวงจันทร์ไม่มีอากาศ จึงไม่มีแรงโน้มถ่วง", feedback: "แรงโน้มถ่วงไม่ต้องอาศัยอากาศ ถ้าไม่มีแรงโน้มถ่วงเลย นักบินจะชั่งได้ศูนย์และลอยหลุดไป" }
    hints:
      - "แรงโน้มถ่วงขึ้นกับอะไรของวัตถุที่ดึงกัน"
      - "เทียบมวลของโลกกับมวลของดวงจันทร์"
    solution: "แรงโน้มถ่วงเป็นแรงดูดที่ขึ้นกับมวลของวัตถุทั้งสอง ดวงจันทร์มีมวลน้อยกว่าโลกมาก จึงดึงนักบินด้วยแรงน้อยกว่า ส่วนมวลของนักบินยังเท่าเดิม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.fields.field-forces.p012
    topics: [physics.fields.field-forces]
    difficulty: 4
    type: mcq
    stem: "นักเรียนต้องการรู้ว่าจำนวนรอบของขดลวดมีผลต่อแรงของแม่เหล็กไฟฟ้าหรือไม่ จึงทดลองสองแบบ แบบ 1 พัน 10 รอบ ต่อถ่าน 1 ก้อน ดูดคลิปได้ 3 ตัว แบบ 2 พัน 20 รอบ ต่อถ่าน 2 ก้อน ดูดคลิปได้ 9 ตัว การทดลองนี้มีปัญหาอะไร"
    choices:
      - { id: a, text: "เปลี่ยนสองตัวแปรพร้อมกัน จึงสรุปไม่ได้ว่าคลิปเพิ่มเพราะจำนวนรอบหรือเพราะกระแสที่มากขึ้น", correct: true }
      - { id: b, text: "ไม่มีปัญหา สรุปได้ว่าจำนวนรอบเพิ่ม 2 เท่า แรงเพิ่ม 3 เท่า", feedback: "จำนวนถ่านก็เปลี่ยนด้วย กระแสที่มากขึ้นทำให้แม่เหล็กไฟฟ้าแรงขึ้นได้เช่นกัน แยกผลของสองตัวแปรไม่ได้" }
      - { id: c, text: "ควรใช้คลิปพลาสติกแทนคลิปเหล็ก", feedback: "พลาสติกไม่ใช่สารแม่เหล็ก แม่เหล็กไฟฟ้าจะดูดไม่ได้เลย การนับคลิปเหล็กเป็นวิธีวัดที่ใช้ได้" }
    hints:
      - "ในการทดลองแบบที่ดี ควรเปลี่ยนตัวแปรต้นกี่ตัว"
      - "ระหว่างแบบ 1 กับแบบ 2 มีอะไรเปลี่ยนไปบ้าง"
    solution: "แบบ 2 เพิ่มทั้งจำนวนรอบและจำนวนถ่าน (ทำให้กระแสมากขึ้น) จึงไม่รู้ว่าผลมาจากตัวแปรใด ควรใช้ถ่าน 1 ก้อนเท่าเดิม แล้วเปลี่ยนเฉพาะจำนวนรอบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.fields.field-forces.p013
    topics: [physics.fields.field-forces]
    difficulty: 4
    type: numeric
    stem: "ยานอวกาศหนัก $800\\ \\mathrm{N}$ เมื่ออยู่บนผิวโลก ถ้ายานขึ้นไปอยู่ที่ระยะห่างจากศูนย์กลางโลกเป็น 2 เท่าของรัศมีโลก แรงโน้มถ่วงที่โลกดึงยานเป็นเท่าใด (ตอบในหน่วย N)"
    answer: { value: 200, tolerance: 1, unit: N }
    misconceptions:
      - { match: 400, feedback: "ระยะ 2 เท่า แรงโน้มถ่วงไม่ได้ลดครึ่งหนึ่ง แต่ลดเหลือ 1/4 เหมือนแรงไฟฟ้า" }
      - { match: 0, feedback: "ที่ระยะนี้ยังมีแรงโน้มถ่วง สนามโน้มถ่วงอ่อนลงแต่ไม่ได้หายไป" }
    hints:
      - "บนผิวโลก ระยะจากศูนย์กลางโลกเท่ากับรัศมีโลกหนึ่งเท่า"
      - "ระยะเพิ่มเป็น 2 เท่า แรงโน้มถ่วงเหลือกี่ส่วน"
    solution: "ระยะจากศูนย์กลางเพิ่มจาก 1 เป็น 2 เท่าของรัศมีโลก แรงเหลือ $\\tfrac{1}{2^2} = \\tfrac{1}{4}$ ได้ $\\tfrac{800}{4} = 200\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.fields.field-forces.p014
