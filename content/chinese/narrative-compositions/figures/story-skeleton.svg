<text x="898.0" y="124" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold">感受</text>
<text x="898.0" y="182" font-size="18" fill="#5b3e96" text-anchor="middle" font-weight="bold">ความรู้สึก</text>
<text x="898.0" y="240" font-size="20" fill="#222" text-anchor="middle" font-weight="normal">很开心</text>
<text x="500" y="352" font-size="18" fill="#444" text-anchor="middle" font-weight="normal">ตัวอย่างจากย่อหน้าในบทเรียนนี้ ให้เติมทุกกล่องก่อนเขียนจริง</text>
