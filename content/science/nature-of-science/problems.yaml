- id: science.nature.nature-of-science.p013
  topics:
  - science.nature.nature-of-science
  difficulty: 4
  type: numeric
  stem: ทีมหนึ่งคำนวณแรงดลของจรวดได้ 100 ในหน่วยปอนด์-แรง·วินาที แต่ทีมนำร่องอ่านเป็น 100 นิวตัน·วินาที ถ้า 1 ปอนด์-แรง ≈ 4.45 นิวตัน แรงดลจริงเป็นกี่นิวตัน·วินาที
  answer:
    value: 445
    unit: N·s
  misconceptions:
  - match: 22.47
    feedback: หารด้วย 4.45 ต้องคูณ เพราะ 1 ปอนด์-แรงมากกว่า 1 นิวตัน
  - match: 100
    feedback: ลืมแปลงหน่วย ซึ่งเป็นความผิดพลาดเดียวกับที่ทำให้ยานสูญหาย
  hints:
  - แปลงหน่วยปอนด์-แรงเป็นนิวตัน
  - คูณ 100 ด้วย 4.45
  solution: $100 \times 4.45 = 445$ นิวตัน·วินาที มากกว่าที่ทีมนำร่องคิดถึง 4.45 เท่า ความผิดพลาดแบบนี้ทำให้ยาน Mars Climate Orbiter สูญหายใน พ.ศ. 2542
