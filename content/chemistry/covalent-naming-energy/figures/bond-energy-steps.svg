<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
<title>แผนภาพพลังงานของปฏิกิริยา H2 + Cl2 → 2HCl คิดจากพลังงานพันธะ</title>
<rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
<line x1="70.0" y1="30.0" x2="70.0" y2="420.0" stroke="#1d3557" stroke-width="2" />
<line x1="70.0" y1="60.0" x2="70.0" y2="33.0" stroke="#1d3557" stroke-width="2" />
<polygon points="70.0,25.0 73.9,34.2 66.1,34.2" fill="#1d3557" stroke="#1d3557" stroke-width="1" />
<text x="84.0" y="40.0" font-size="16" text-anchor="start" fill="#222" font-weight="normal" font-family="sans-serif" >พลังงาน</text>
<line x1="110.0" y1="290.0" x2="260.0" y2="290.0" stroke="#1d3557" stroke-width="4" />
<text x="185.0" y="280.0" font-size="18" text-anchor="middle" fill="#222" font-weight="bold" font-family="sans-serif" >H₂ + Cl₂</text>
<line x1="300.0" y1="66.3" x2="470.0" y2="66.3" stroke="#1d3557" stroke-width="4" />
<text x="385.0" y="56.3" font-size="18" text-anchor="middle" fill="#222" font-weight="bold" font-family="sans-serif" >2H + 2Cl (อะตอมอิสระ)</text>
<line x1="510.0" y1="350.7" x2="680.0" y2="350.7" stroke="#1d3557" stroke-width="4" />
<text x="595.0" y="340.7" font-size="18" text-anchor="middle" fill="#222" font-weight="bold" font-family="sans-serif" >2HCl</text>
<line x1="260.0" y1="290.0" x2="300.0" y2="290.0" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4"/>
<line x1="285.0" y1="290.0" x2="285.0" y2="81.5" stroke="#c0392b" stroke-width="3" />
<polygon points="285.0,70.3 290.5,83.2 279.5,83.2" fill="#c0392b" stroke="#c0392b" stroke-width="1" />
<text x="270.0" y="168.1" font-size="16" text-anchor="end" fill="#c0392b" font-weight="bold" font-family="sans-serif" >สลายพันธะ</text>
<text x="270.0" y="190.1" font-size="16" text-anchor="end" fill="#c0392b" font-weight="normal" font-family="sans-serif" >ดูดพลังงาน</text>
<text x="270.0" y="212.1" font-size="15" text-anchor="end" fill="#c0392b" font-weight="normal" font-family="sans-serif" >436 + 242 = 678 kJ</text>
<line x1="470.0" y1="66.3" x2="510.0" y2="66.3" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4"/>
<line x1="490.0" y1="66.3" x2="490.0" y2="335.5" stroke="#2b6a9a" stroke-width="3" />
<polygon points="490.0,346.7 484.5,333.8 495.5,333.8" fill="#2b6a9a" stroke="#2b6a9a" stroke-width="1" />
<text x="505.0" y="197.5" font-size="16" text-anchor="start" fill="#2b6a9a" font-weight="bold" font-family="sans-serif" >สร้างพันธะ</text>
<text x="505.0" y="219.5" font-size="16" text-anchor="start" fill="#2b6a9a" font-weight="normal" font-family="sans-serif" >คายพลังงาน</text>
<text x="505.0" y="241.5" font-size="15" text-anchor="start" fill="#2b6a9a" font-weight="normal" font-family="sans-serif" >2 × 431 = 862 kJ</text>
<line x1="110.0" y1="290.0" x2="700.0" y2="290.0" stroke="#999" stroke-width="1" stroke-dasharray="3,5"/>
<line x1="700.0" y1="290.0" x2="700.0" y2="338.1" stroke="#2a7f3a" stroke-width="3" />
<polygon points="700.0,347.7 695.3,336.7 704.7,336.7" fill="#2a7f3a" stroke="#2a7f3a" stroke-width="1" />
<text x="700.0" y="380.7" font-size="16" text-anchor="end" fill="#2a7f3a" font-weight="bold" font-family="sans-serif" >ΔH = 678 − 862 = −184 kJ</text>
<text x="700.0" y="402.7" font-size="15" text-anchor="end" fill="#2a7f3a" font-weight="normal" font-family="sans-serif" >คายพลังงานสุทธิ (ปฏิกิริยาคายความร้อน)</text>
</svg>
