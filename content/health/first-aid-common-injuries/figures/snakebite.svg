<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" font-family="sans-serif">
<title>สิ่งที่ควรทำและห้ามทำเมื่อถูกงูกัด</title>
<rect x="0" y="0" width="700" height="380" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="350.0" y="28.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">ถูกงูกัด: ทำอย่างไร</text>
<rect x="20.0" y="45.0" width="320.0" height="300.0" rx="10" fill="#eaf6e3" stroke="#333" stroke-width="1.5"/>
<rect x="360.0" y="45.0" width="320.0" height="300.0" rx="10" fill="#f9dede" stroke="#333" stroke-width="1.5"/>
<text x="180.0" y="75.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#1e6b2a">✓ ควรทำ</text>
<text x="520.0" y="75.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#a00">✗ ห้ามทำ</text>
<text x="40.0" y="110.0" font-size="13" text-anchor="start" fill="#111">• ตั้งสติ ถอยออกห่างจากงู</text>
<text x="40.0" y="142.0" font-size="13" text-anchor="start" fill="#111">• ให้ผู้ถูกกัดอยู่นิ่ง ขยับน้อยที่สุด</text>
<text x="40.0" y="174.0" font-size="13" text-anchor="start" fill="#111">• ดามส่วนที่ถูกกัดด้วยไม้หรือของแข็ง</text>
<text x="40.0" y="206.0" font-size="13" text-anchor="start" fill="#111">• ถอดแหวน กำไล นาฬิกา ก่อนบวม</text>
<text x="40.0" y="238.0" font-size="13" text-anchor="start" fill="#111">• รีบไปโรงพยาบาล หรือโทร 1669</text>
<text x="40.0" y="270.0" font-size="13" text-anchor="start" fill="#111">• จำสีและลายงู หรือถ่ายรูปจากที่ไกล</text>
<text x="58.0" y="290.0" font-size="13" text-anchor="start" fill="#111">ถ้าปลอดภัย</text>
<text x="380.0" y="110.0" font-size="13" text-anchor="start" fill="#111">• ขันชะเนาะ หรือรัดเชือกแน่นเหนือแผล</text>
<text x="380.0" y="142.0" font-size="13" text-anchor="start" fill="#111">• กรีดแผล</text>
<text x="380.0" y="174.0" font-size="13" text-anchor="start" fill="#111">• ใช้ปากดูดพิษ</text>
<text x="380.0" y="206.0" font-size="13" text-anchor="start" fill="#111">• จี้ไฟ พอกยา หรือโปะน้ำแข็ง</text>
<text x="380.0" y="238.0" font-size="13" text-anchor="start" fill="#111">• ไล่จับหรือตีงูเพื่อเอาไปด้วย</text>
<text x="380.0" y="270.0" font-size="13" text-anchor="start" fill="#111">• ให้ผู้ถูกกัดเดินหรือวิ่งไปเอง</text>
<text x="380.0" y="302.0" font-size="13" text-anchor="start" fill="#111">• ดื่มเหล้าหรือกินยาที่ไม่ได้สั่ง</text>
<text x="350.0" y="368.0" font-size="12" text-anchor="middle" fill="#333">ปฐมพยาบาลแล้วต้องไปโรงพยาบาลเสมอ แพทย์ดูอาการและให้เซรุ่มแก้พิษงูเมื่อจำเป็น</text>
</svg>
