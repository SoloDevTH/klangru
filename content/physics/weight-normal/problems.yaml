    stem: "คนมวล $m$ ยืนบนตาชั่งในลิฟต์ที่กำลังเร่งลงด้วยความเร่งขนาด $a$ ในบริเวณที่มีความเร่งโน้มถ่วง $g$ เขียนแรงที่ตาชั่งดันคน (ค่าที่ตาชั่งอ่านได้) ในรูปของ $m$, $g$ และ $a$"
