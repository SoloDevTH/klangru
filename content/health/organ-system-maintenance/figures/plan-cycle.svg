<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" font-family="sans-serif">
<title>วงจรวางแผนดูแลสุขภาพ</title>
<rect x="0" y="0" width="700" height="470" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="350.0" y="28.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">วงจรวางแผนดูแลสุขภาพตนเองและครอบครัว</text>
<line x1="396.8" y1="112.0" x2="474.4" y2="168.4" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<line x1="510.1" y1="236.4" x2="466.8" y2="369.6" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<line x1="373.8" y1="403.6" x2="326.2" y2="403.6" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<line x1="233.2" y1="369.6" x2="189.9" y2="236.4" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<line x1="225.6" y1="168.4" x2="303.2" y2="112.0" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<rect x="272.0" y="48.0" width="156.0" height="60.0" rx="8" fill="#eaf2f8" stroke="#333" stroke-width="1.5"/>
<text x="350.0" y="72.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">1 ประเมิน</text>
<text x="350.0" y="94.0" font-size="11.5" text-anchor="middle" fill="#111">ข้อมูลสุขภาพของแต่ละคน</text>
<rect x="443.2" y="172.4" width="156.0" height="60.0" rx="8" fill="#eaf2f8" stroke="#333" stroke-width="1.5"/>
<text x="521.2" y="196.4" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">2 ตั้งเป้าหมาย</text>
<text x="521.2" y="218.4" font-size="11.5" text-anchor="middle" fill="#111">ชัด วัดได้ มีกำหนดเวลา</text>
<rect x="377.8" y="373.6" width="156.0" height="60.0" rx="8" fill="#eaf2f8" stroke="#333" stroke-width="1.5"/>
<text x="455.8" y="397.6" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">3 วางกิจกรรม</text>
<text x="455.8" y="419.6" font-size="11.5" text-anchor="middle" fill="#111">เหมาะกับวัยและข้อจำกัด</text>
<rect x="166.2" y="373.6" width="156.0" height="60.0" rx="8" fill="#eaf2f8" stroke="#333" stroke-width="1.5"/>
<text x="244.2" y="397.6" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">4 ลงมือและบันทึก</text>
<text x="244.2" y="419.6" font-size="11.5" text-anchor="middle" fill="#111">ตารางหรือแอปบันทึก</text>
<rect x="100.8" y="172.4" width="156.0" height="60.0" rx="8" fill="#eaf2f8" stroke="#333" stroke-width="1.5"/>
<text x="178.8" y="196.4" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">5 ประเมินและปรับ</text>
<text x="178.8" y="218.4" font-size="11.5" text-anchor="middle" fill="#111">ทุก 2–4 สัปดาห์</text>
<text x="350.0" y="263.0" font-size="13" text-anchor="middle" fill="#555">วนซ้ำต่อเนื่อง</text>
