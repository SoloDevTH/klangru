    stem: "ดินสอบางแท่งเป็นปริซึมหกเหลี่ยม (ไม่นับปลายที่เหลาแหลม) ปริซึมหกเหลี่ยมมีสันกี่สัน (ตอบเป็นจำนวนสัน)"
    answer: { value: 18, unit: สัน }
    hints:
