<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="sans-serif">
<title>ความหมายของคำเชื่อม and but or because so</title>
<defs><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7b3c"/></marker><marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b35900"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#fff"/>
<text x="20.0" y="30.0" font-size="16" text-anchor="start" fill="#111" font-weight="bold">เพิ่มความ ขัดแย้ง และให้เลือก</text>
<rect x="20.0" y="45.0" width="230.0" height="120.0" rx="12" fill="#fff" stroke="#1f4e9c" stroke-width="2.5"/>
<circle cx="56.0" cy="80.0" r="20.0" fill="#1f4e9c" stroke="#1f4e9c" stroke-width="2"/>
<text x="56.0" y="88.0" font-size="22" text-anchor="middle" fill="#fff" font-weight="bold">+</text>
<text x="90.0" y="88.0" font-size="24" text-anchor="start" fill="#1f4e9c" font-weight="bold">and</text>
<text x="135.0" y="125.0" font-size="14" text-anchor="middle" fill="#111">เพิ่มเรื่องที่ไปด้วยกัน</text>
<text x="135.0" y="150.0" font-size="13" text-anchor="middle" fill="#555" font-style="italic">I like cats and dogs.</text>
<rect x="265.0" y="45.0" width="230.0" height="120.0" rx="12" fill="#fff" stroke="#c0392b" stroke-width="2.5"/>
<circle cx="301.0" cy="80.0" r="20.0" fill="#c0392b" stroke="#c0392b" stroke-width="2"/>
<text x="301.0" y="88.0" font-size="22" text-anchor="middle" fill="#fff" font-weight="bold">≠</text>
<text x="335.0" y="88.0" font-size="24" text-anchor="start" fill="#c0392b" font-weight="bold">but</text>
<text x="380.0" y="125.0" font-size="14" text-anchor="middle" fill="#111">ความที่ขัดกัน</text>
<text x="380.0" y="150.0" font-size="13" text-anchor="middle" fill="#555" font-style="italic">It's small, but it's strong.</text>
<rect x="510.0" y="45.0" width="230.0" height="120.0" rx="12" fill="#fff" stroke="#b35900" stroke-width="2.5"/>
<circle cx="546.0" cy="80.0" r="20.0" fill="#b35900" stroke="#b35900" stroke-width="2"/>
<text x="546.0" y="88.0" font-size="22" text-anchor="middle" fill="#fff" font-weight="bold">?</text>
<text x="580.0" y="88.0" font-size="24" text-anchor="start" fill="#b35900" font-weight="bold">or</text>
<text x="625.0" y="125.0" font-size="14" text-anchor="middle" fill="#111">ให้เลือกอย่างใดอย่างหนึ่ง</text>
<text x="625.0" y="150.0" font-size="13" text-anchor="middle" fill="#555" font-style="italic">Tea or coffee?</text>
<text x="20.0" y="205.0" font-size="16" text-anchor="start" fill="#111" font-weight="bold">เหตุและผล</text>
<rect x="20.0" y="225.0" width="230.0" height="50.0" rx="10" fill="#eef3fa" stroke="#1e7b3c" stroke-width="2"/>
<text x="135.0" y="255.0" font-size="15" text-anchor="middle" fill="#111">It is raining.  (เหตุ)</text>
<line x1="255.0" y1="250.0" x2="495.0" y2="250.0" stroke="#1e7b3c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrg)"/>
<text x="375.0" y="235.0" font-size="20" text-anchor="middle" fill="#1e7b3c" font-weight="bold">, so</text>
<rect x="505.0" y="225.0" width="235.0" height="50.0" rx="10" fill="#e9f5ec" stroke="#1e7b3c" stroke-width="2"/>
<text x="622.5" y="255.0" font-size="15" text-anchor="middle" fill="#111">I take an umbrella.  (ผล)</text>
<rect x="20.0" y="305.0" width="230.0" height="50.0" rx="10" fill="#e9f5ec" stroke="#b35900" stroke-width="2"/>
<text x="135.0" y="335.0" font-size="15" text-anchor="middle" fill="#111">I take an umbrella.  (ผล)</text>
<line x1="495.0" y1="330.0" x2="255.0" y2="330.0" stroke="#b35900" stroke-width="3" stroke-linecap="round" marker-end="url(#arro)"/>
<text x="375.0" y="315.0" font-size="20" text-anchor="middle" fill="#b35900" font-weight="bold">because</text>
<rect x="505.0" y="305.0" width="235.0" height="50.0" rx="10" fill="#eef3fa" stroke="#b35900" stroke-width="2"/>
<text x="622.5" y="335.0" font-size="15" text-anchor="middle" fill="#111">it is raining.  (เหตุ)</text>
<text x="380.0" y="385.0" font-size="15" text-anchor="middle" fill="#c0392b" font-weight="bold">so นำผล · because นำเหตุ · ใช้คำใดคำหนึ่งในประโยคเดียว ไม่ใช้คู่กัน</text>
</svg>
