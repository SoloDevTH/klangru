<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" font-family="sans-serif" font-size="14">
  <title>ขั้นตอนอย่างง่ายของ HTTPS ระหว่างเบราว์เซอร์กับเซิร์ฟเวอร์</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="860" height="420" fill="#ffffff"/>
  <rect x="60.0" y="15.0" width="200.0" height="48.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160.0" y="44.2" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">เบราว์เซอร์</text>
  <rect x="600.0" y="15.0" width="200.0" height="48.0" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="700.0" y="43.9" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">เซิร์ฟเวอร์ shop.example</text>
  <line x1="160.0" y1="63.0" x2="160.0" y2="405.0" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="700.0" y1="63.0" x2="700.0" y2="405.0" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="162.0" y1="95.0" x2="698.0" y2="95.0" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="430.0" y="87.0" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">1 ขอเชื่อมต่อแบบปลอดภัย</text>
  <line x1="698.0" y1="160.0" x2="162.0" y2="160.0" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="430.0" y="152.0" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">2 ส่งใบรับรอง (มีกุญแจสาธารณะ ลงชื่อโดยหน่วยงานออกใบรับรอง)</text>
  <rect x="170.0" y="213.0" width="520.0" height="34.0" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="430.0" y="235.0" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">3 เบราว์เซอร์ตรวจลายมือชื่อ วันหมดอายุ และชื่อโดเมนในใบรับรอง</text>
  <line x1="164.0" y1="295.0" x2="696.0" y2="295.0" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <text x="430.0" y="287.0" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">4 ใช้กุญแจสาธารณะตกลงกุญแจรอบการใช้งานร่วมกัน</text>
  <line x1="164.0" y1="360.0" x2="696.0" y2="360.0" stroke="#15803d" stroke-width="1.6" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <text x="430.0" y="352.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">5 ส่งข้อมูลจริงเข้ารหัสแบบสมมาตรด้วยกุญแจรอบการใช้งาน</text>
</svg>
