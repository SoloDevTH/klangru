  - id: health.body.digestive-excretory-care.p016
    topics: [health.body.digestive-excretory-care]
    difficulty: 5
    type: mcq
    stem: "เด็ก ป.5 คนหนึ่งท้องเสียบ่อยหลายเดือน เบื่ออาหาร น้ำหนักไม่เพิ่ม และขาดเรียนบ่อย ข้อใดอธิบายผลต่อสุขภาพ การเจริญเติบโต และพัฒนาการได้ถูกต้องที่สุด"
    choices:
      - { id: a, text: "ร่างกายดูดซึมสารอาหารได้น้อยและเสียน้ำ จึงโตไม่สมวัย อ่อนเพลีย และพลาดการเรียนรู้ ต้องไปพบแพทย์หาสาเหตุ", correct: true }
      - { id: b, text: "ไม่มีผลอะไร เพราะท้องเสียหายเองทุกครั้ง", feedback: "ท้องเสียบ่อยต่อเนื่องหลายเดือนไม่ปกติ และกระทบการเติบโต" }
      - { id: c, text: "มีผลแค่ต่อระบบขับถ่าย ไม่เกี่ยวกับการเรียน", feedback: "การขาดเรียนและความอ่อนเพลียกระทบพัฒนาการด้านสติปัญญาและสังคมด้วย" }
    hints:
      - "คิดถึงหน้าที่ของลำไส้เล็กในการดูดซึมสารอาหาร"
      - "พัฒนาการรวมถึงการเรียนรู้และการเข้าสังคม"
    solution: "ท้องเสียเรื้อรังทำให้ได้สารอาหารและน้ำไม่พอ ส่งผลต่อการเติบโต (น้ำหนักไม่เพิ่ม) และพัฒนาการ (ขาดเรียน อ่อนเพลีย) ต้องให้แพทย์ตรวจ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.digestive-excretory-care.p017
    topics: [health.body.digestive-excretory-care]
    difficulty: 5
    type: mcq
    stem: "ต้นหอมไม่ชอบกินผัก ดื่มน้ำวันละไม่กี่แก้วเพราะไม่อยากเข้าห้องน้ำที่โรงเรียน กลั้นอุจจาระทุกวัน และนั่งเล่นเกมหลังเลิกเรียน ตอนนี้ท้องผูกและถ่ายแล้วเจ็บ แผนใดเหมาะสมและครบถ้วนที่สุด"
    choices:
      - { id: a, text: "เพิ่มผักผลไม้ทีละน้อย พกขวดน้ำดื่มให้พอ ฝึกนั่งถ่ายหลังอาหารเช้าทุกวันและไม่กลั้น ออกไปเล่นหรือเดินทุกวัน ถ้าไม่ดีขึ้นหรือมีเลือดปนให้ผู้ใหญ่พาไปพบแพทย์", correct: true }
      - { id: b, text: "กินยาระบายทุกวันโดยไม่เปลี่ยนนิสัยอื่น", feedback: "ไม่แก้สาเหตุ และเอกสารกำกับยาระบายเตือนว่าไม่ควรใช้ต่อเนื่องเป็นเวลานาน เด็กไม่ควรใช้ยาเองโดยไม่ปรึกษาผู้ใหญ่" }
      - { id: c, text: "ดื่มน้ำมากขึ้นอย่างเดียว", feedback: "ช่วยได้บางส่วน แต่ยังขาดใยอาหาร การขับถ่ายเป็นเวลา และการออกกำลังกาย" }
    hints:
      - "หาสาเหตุทั้งหมดจากโจทย์ก่อน มีอย่างน้อยสี่ข้อ"
      - "แผนที่ดีต้องแก้ทุกสาเหตุและรู้ว่าเมื่อไรต้องพบแพทย์"
    solution: "สาเหตุคือ ผักน้อย น้ำน้อย กลั้นอุจจาระ และไม่เคลื่อนไหว แผนข้อ a แก้ครบทุกสาเหตุและบอกสัญญาณที่ต้องไปพบแพทย์"
    license: CC-BY-SA-4.0
    ai_assisted: true

