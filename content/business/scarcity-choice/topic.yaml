id: business.econ.scarcity-choice
subject: business
title: { th: ความต้องการ ทรัพยากรที่มีจำกัด และค่าเสียโอกาส, en: "Needs, wants, scarce resources and opportunity cost" }
summary: สินค้าและบริการ ความจำเป็นกับความต้องการ ทรัพยากรสามกลุ่มที่มีจำกัด การเลือกและค่าเสียโอกาส และความหมายของเศรษฐศาสตร์
difficulty: 1.5
minutes: 25
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: scarcity-flow.svg
    alt: "ผังห้ากล่อง กล่องความต้องการของคนมีไม่จำกัด และกล่องทรัพยากรมีจำกัด มีลูกศรชี้ไปที่กล่องความขาดแคลน จากนั้นลูกศรไปที่กล่องต้องเลือก แล้วไปที่กล่องค่าเสียโอกาส คือสิ่งที่ดีที่สุดที่ไม่ได้เลือก ด้านล่างเขียนว่าทรัพยากรมีสามกลุ่ม คือทรัพยากรธรรมชาติ ทรัพยากรมนุษย์ (แรงงาน) และทุน (เครื่องมือ เครื่องจักร อาคาร)"
    caption: "ความต้องการไม่จำกัด แต่ทรัพยากรมีจำกัด เราจึงต้องเลือก"
  - { type: check, problem: business.econ.scarcity-choice.p005, prompt: "ลองหาค่าเสียโอกาสก่อนดูตัวอย่าง" }
  - type: figure
    src: saturday-choice.svg
    alt: "แผนภาพบ่ายวันเสาร์ของน้องแก้มซึ่งมีเวลา 3 ชั่วโมง แตกเป็นสามทางเลือก ช่วยป้าขายส้มตำได้ค่าขนม 120 บาท รับจ้างเก็บมะม่วงได้ค่าจ้าง 150 บาท และอ่านหนังสือเตรียมสอบซึ่งเป็นสิ่งที่เลือก ด้านล่างเขียนว่าทางเลือกที่ไม่ได้เลือกและดีที่สุดคือเก็บมะม่วง ค่าเสียโอกาสของการอ่านหนังสือเท่ากับ 150 บาท ไม่ใช่ 120 บวก 150"
    caption: "ค่าเสียโอกาสนับเฉพาะทางเลือกที่ดีที่สุดที่ไม่ได้เลือก"
  - type: worked-example
    title: ค่าเสียโอกาสของการใช้ที่ดิน
    problem: "ลุงชัยมีที่ดิน 5 ไร่ ถ้าปลูกผักกาดจะได้กำไรไร่ละ 4,000 บาท ถ้าปลูกผักบุ้งจะได้กำไรไร่ละ 3,500 บาท ลุงชัยเลือกปลูกผักกาดเต็มทั้ง 5 ไร่ ค่าเสียโอกาสของการเลือกนี้เป็นเท่าใด"
    steps:
      - text: "ทางเลือกมีสองทาง คือ ปลูกผักกาด กับ ปลูกผักบุ้ง ลุงชัยเลือกผักกาด"
        why: "ที่ดิน 5 ไร่ใช้ปลูกได้อย่างเดียว เพราะที่ดินมีจำกัด"
      - text: "ทางเลือกที่ไม่ได้เลือกคือปลูกผักบุ้ง ได้กำไร $5 \\times 3{,}500 = 17{,}500$ บาท"
      - text: "ค่าเสียโอกาสคือคุณค่าของทางเลือกที่ดีที่สุดที่ไม่ได้เลือก จึงเท่ากับ $17{,}500$ บาท"
        why: "ทางที่ไม่ได้เลือกมีทางเดียว จึงเป็นทางที่ดีที่สุดที่สละไปโดยอัตโนมัติ"
      - text: "เทียบ: สิ่งที่ได้คือกำไร $5 \\times 4{,}000 = 20{,}000$ บาท มากกว่า $17{,}500$ บาท จึงเป็นการเลือกที่คุ้ม"
    answer: "ค่าเสียโอกาส $17{,}500$ บาท (กำไรจากผักบุ้งที่สละไป)"
  - { type: check, problem: business.econ.scarcity-choice.p004, prompt: "ที่บ้านเราใช้ทรัพยากรอย่างประหยัดอย่างไรบ้าง" }
glossary:
  - { term: สินค้า, definition: "สิ่งที่จับต้องได้ซึ่งใช้สนองความต้องการ เช่น ข้าวสาร ดินสอ เสื้อผ้า" }
  - { term: บริการ, definition: "การกระทำที่ผู้อื่นทำให้ จับต้องไม่ได้ เช่น ตัดผม รักษาโรค ขนส่ง" }
  - { term: ความจำเป็น, definition: "สิ่งที่ขาดไม่ได้ในการดำรงชีวิต เช่น ปัจจัย 4" }
  - { term: ความต้องการ, definition: "สิ่งที่อยากได้เพิ่มเพื่อความสะดวกหรือความสุข มีไม่จำกัด" }
  - { term: ความขาดแคลน, definition: "สภาพที่ทรัพยากรมีไม่พอสนองความต้องการทั้งหมด ทำให้ต้องเลือก" }
  - { term: ทุน, definition: "สิ่งที่มนุษย์สร้างขึ้นเพื่อใช้ผลิตสินค้าและบริการต่อ เช่น เครื่องมือ เครื่องจักร อาคาร" }
  - { term: ค่าเสียโอกาส, definition: "คุณค่าของทางเลือกที่ดีที่สุดที่ต้องสละไปเมื่อเลือกสิ่งหนึ่ง" }
  - { term: เศรษฐศาสตร์, definition: "วิชาที่ศึกษาการเลือกใช้ทรัพยากรที่มีจำกัดเพื่อสนองความต้องการที่ไม่จำกัด" }
flashcards:
  - { front: "ความจำเป็นต่างจากความต้องการอย่างไร", back: "ความจำเป็นคือสิ่งที่ขาดไม่ได้ (ปัจจัย 4) ความต้องการคือสิ่งที่อยากได้เพิ่ม ไม่มีก็อยู่ได้" }
  - { front: "ทรัพยากรสามกลุ่ม", back: "ทรัพยากรธรรมชาติ ทรัพยากรมนุษย์ (แรงงาน) และทุน" }
  - { front: "ค่าเสียโอกาส", back: "คุณค่าของทางเลือกที่ดีที่สุดที่ไม่ได้เลือก นับทางเดียว ไม่บวกทุกทาง" }
  - { front: "ทำไมต้องเลือก", back: "เพราะความต้องการไม่จำกัด แต่ทรัพยากรมีจำกัด (ความขาดแคลน)" }
  - { front: "คำถามพื้นฐานทางเศรษฐกิจ", back: "ผลิตอะไร ผลิตอย่างไร ผลิตเพื่อใคร" }
