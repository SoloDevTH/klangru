  - id: biology.animals.senses.p015
    topics: [biology.animals.senses]
    difficulty: 4
    type: mcq
    stem: "ขณะเครื่องบินลดระดับจากเชียงใหม่สู่กรุงเทพฯ ผู้โดยสารรู้สึกหูอื้อ เมื่อกลืนน้ำลายหรือหาวแรง ๆ อาการดีขึ้น เพราะเหตุใด"
