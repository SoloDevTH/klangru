      - { id: a, text: "$\\mathrm{Na^+}$", correct: true, feedback: "ถูก อยู่ในสารละลายทั้งก่อนและหลังปฏิกิริยา" }
      - { id: b, text: "$\\mathrm{Cl^-}$", correct: true, feedback: "ถูก ยังละลายอยู่ในน้ำเหมือนเดิม" }
      - { id: c, text: "$\\mathrm{Ca^{2+}}$", feedback: "แคลเซียมไอออนรวมกับคาร์บอเนตเป็นตะกอน จึงเปลี่ยนแปลง" }
      - { id: d, text: "$\\mathrm{CO_3^{2-}}$", feedback: "คาร์บอเนตไอออนเข้าไปอยู่ในตะกอน $\\mathrm{CaCO_3}$" }
    hints:
      - "เขียนสมการไอออนิกเต็มของ $\\mathrm{CaCl_2 + Na_2CO_3 \\to CaCO_3(s) + 2NaCl}$"
      - "ไอออนที่ยังละลายอยู่ทั้งสองข้างคือไอออนที่ไม่เปลี่ยนแปลง"
    solution: "สมการไอออนิกสุทธิคือ $\\mathrm{Ca^{2+}(aq) + CO_3^{2-}(aq) \\to CaCO_3(s)}$ ไอออนที่ไม่เปลี่ยนแปลงคือ $\\mathrm{Na^+}$ และ $\\mathrm{Cl^-}$"
