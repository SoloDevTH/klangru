  - { framework: university-foundations, indicators: ["CALC2 3.2"], coverage: full, note: "กำลังของ tan และ sec (sec กำลังคู่ tan กำลังคี่ ∫tan ∫sec ∫sec³) และสูตรผลคูณเป็นผลบวก sin mx cos nx ส่วน sinᵐx cosⁿx สอนใน math.calculus.integration-techniques ซึ่งบทนี้อ้างถึง" }
  - { framework: university-foundations, indicators: ["CALC2 3.3"], coverage: full, note: "x = a sin θ, a tan θ, a sec θ สามเหลี่ยมอ้างอิง การเติมกำลังสอง ขอบเขตของปริพันธ์จำกัดเขต พื้นที่วงรี ความยาวสายไฟ และถังทรงกระบอกวางนอน" }
  - { framework: university-foundations, indicators: ["CALC2 3.5"], coverage: full, note: "ลำดับการเลือกเทคนิคหาปริพันธ์ การจัดรูปให้ตรงกับตารางปริพันธ์ (โจทย์ p019) โปรแกรมคำนวณสัญลักษณ์ และฟังก์ชันที่ไม่มีปฏิยานุพันธ์พื้นฐาน" }
