problems:
  - id: biology.diversity.biodiversity.p001
    topics: [biology.diversity.biodiversity]
    difficulty: 1
    type: mcq
    stem: "ข้าวหอมมะลิ ข้าวเหนียว และข้าวไรซ์เบอร์รี่ เป็นข้าวชนิดเดียวกันแต่ต่างพันธุ์ ความแตกต่างนี้เป็นความหลากหลายทางชีวภาพระดับใด"
    choices:
      - { id: a, text: "ความหลากหลายทางพันธุกรรม", correct: true }
      - { id: b, text: "ความหลากหลายของชนิดสิ่งมีชีวิต", feedback: "ข้าวทั้งสามพันธุ์เป็นชนิดเดียวกัน (Oryza sativa) จึงไม่ใช่ความต่างระหว่างชนิด" }
      - { id: c, text: "ความหลากหลายของระบบนิเวศ", feedback: "ระดับระบบนิเวศคือความต่างของป่า ทะเล ทุ่งนา ไม่ใช่ความต่างของพันธุ์ข้าว" }
    hints:
      - "ข้าวทั้งสามพันธุ์เป็นชนิดเดียวกัน"
      - "ความต่างภายในชนิดเดียวกันเกิดจากความต่างของยีน"
    solution: "ข้าวทั้งสามเป็นชนิดเดียวกัน ความต่างของพันธุ์เกิดจากยีนที่ต่างกัน จึงเป็นความหลากหลายทางพันธุกรรม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.biodiversity.p002
    topics: [biology.diversity.biodiversity]
    difficulty: 1
    type: order
    stem: "เรียงลำดับขั้นอนุกรมวิธานจากกว้างที่สุดไปแคบที่สุด"
    items:
      - "อาณาจักร"
      - "ไฟลัม"
      - "ชั้น"
      - "อันดับ"
      - "วงศ์"
      - "สกุล"
      - "ชนิด"
    hints:
      - "ขั้นที่กว้างที่สุดมีสมาชิกมากที่สุด เช่น สัตว์ทั้งหมด"
      - "สองขั้นสุดท้ายคือสองคำในชื่อวิทยาศาสตร์"
    solution: "อาณาจักร → ไฟลัม → ชั้น → อันดับ → วงศ์ → สกุล → ชนิด ขั้นล่างมีสมาชิกน้อยลงและมีลักษณะร่วมกันมากขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.biodiversity.p003
    topics: [biology.diversity.biodiversity]
    difficulty: 1
    type: text
    stem: "การตั้งชื่อวิทยาศาสตร์ด้วยคำภาษาละตินสองคำ คือชื่อสกุลและคำระบุชนิด เรียกว่าระบบอะไร"
    accepted: ["ทวินาม", "ระบบทวินาม", "การตั้งชื่อแบบทวินาม", "binomial nomenclature", "binomial"]
    hints:
      - "ระบบนี้คิดโดยคาโรลัส ลินเนียส"
      - "ชื่อระบบบอกว่าชื่อมีสองคำ"
    misconceptions:
      - { match: "ชื่อสามัญ", feedback: "ชื่อสามัญคือชื่อที่คนทั่วไปเรียก ต่างไปตามภาษาและท้องถิ่น" }
    solution: "ระบบทวินาม ชื่อวิทยาศาสตร์มีสองคำ คำแรกเป็นชื่อสกุล คำหลังเป็นคำระบุชนิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.biodiversity.p004
    topics: [biology.diversity.biodiversity]
    difficulty: 2
    type: mcq
    stem: "นักเรียน 4 คนเขียนชื่อวิทยาศาสตร์ของช้างเอเชียด้วยลายมือ ใครเขียนถูกตามหลักการ"
    choices:
      - { id: a, text: "ต้น: Elephas maximus โดยขีดเส้นใต้แยกทีละคำ", correct: true }
      - { id: b, text: "ฝน: Elephas Maximus โดยขีดเส้นใต้แยกทีละคำ", feedback: "คำระบุชนิดต้องเป็นอักษรตัวเล็กทั้งหมด" }
      - { id: c, text: "ปอ: elephas maximus โดยขีดเส้นใต้แยกทีละคำ", feedback: "ชื่อสกุลต้องขึ้นต้นด้วยอักษรตัวใหญ่" }
      - { id: d, text: "นิด: Maximus elephas โดยขีดเส้นใต้แยกทีละคำ", feedback: "ชื่อสกุลต้องมาก่อน และต้องขึ้นต้นด้วยตัวใหญ่ ส่วนคำระบุชนิดมาทีหลังและเป็นตัวเล็ก" }
    hints:
      - "คำแรกคือชื่อสกุล คำหลังคือคำระบุชนิด"
      - "ดูอักษรตัวแรกของแต่ละคำ"
    solution: "ชื่อสกุลขึ้นต้นตัวใหญ่ (Elephas) คำระบุชนิดตัวเล็กทั้งหมด (maximus) เขียนด้วยมือให้ขีดเส้นใต้แยกทีละคำ ถ้าพิมพ์ใช้ตัวเอียง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.biodiversity.p005
    topics: [biology.diversity.biodiversity]
    difficulty: 2
    type: match
    stem: "จับคู่สิ่งที่ได้จากความหลากหลายทางชีวภาพกับตัวอย่าง"
    pairs:
      - { left: "ลดแรงคลื่นและกันการกัดเซาะชายฝั่ง", right: "ป่าชายเลน" }
      - { left: "ผสมเกสรให้ลำไยและทุเรียน", right: "ผึ้งและแมลงอื่น" }
      - { left: "ยาสมุนไพรบรรเทาหวัด", right: "ฟ้าทะลายโจร" }
      - { left: "เก็บน้ำและปล่อยลงลำธารตลอดปี", right: "ป่าต้นน้ำ" }
    hints:
      - "นึกถึงบริการจากระบบนิเวศที่บทเรียนยกตัวอย่าง"
      - "รากค้ำยันของโกงกางยึดดินริมทะเล"
    solution: "ป่าชายเลนลดแรงคลื่น ผึ้งผสมเกสร ฟ้าทะลายโจรเป็นสมุนไพร และป่าต้นน้ำเก็บน้ำ ทั้งหมดเป็นประโยชน์ที่มนุษย์ได้จากความหลากหลายทางชีวภาพ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.biodiversity.p006
    topics: [biology.diversity.biodiversity]
    difficulty: 2
    type: mcq
    stem: "ม้ากับลาผสมพันธุ์กันได้ลูกเรียกว่าล่อ ซึ่งเป็นหมัน ข้อสรุปใดถูกต้อง"
    choices:
      - { id: a, text: "ม้ากับลาเป็นคนละชนิด เพราะลูกที่ได้เป็นหมัน", correct: true }
      - { id: b, text: "ม้ากับลาเป็นชนิดเดียวกัน เพราะผสมพันธุ์กันได้", feedback: "ผสมพันธุ์กันได้ยังไม่พอ ลูกต้องไม่เป็นหมันด้วยจึงจะเป็นชนิดเดียวกัน" }
      - { id: c, text: "ล่อเป็นชนิดใหม่ เพราะต่างจากทั้งพ่อและแม่", feedback: "ล่อสืบพันธุ์ต่อไม่ได้ จึงไม่เกิดเป็นกลุ่มที่สืบพันธุ์ต่อเนื่อง" }
    hints:
      - "นึกถึงความหมายของคำว่าชนิดในบทเรียน"
      - "ชนิดเดียวกันต้องได้ลูกที่สืบพันธุ์ต่อได้"
    solution: "สิ่งมีชีวิตชนิดเดียวกันต้องผสมพันธุ์กันได้ตามธรรมชาติและได้ลูกที่ไม่เป็นหมัน ล่อเป็นหมัน ม้ากับลาจึงเป็นคนละชนิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.biodiversity.p007
    topics: [biology.diversity.biodiversity]
    difficulty: 2
    type: numeric
    stem: "จากภาพ ต้นโกงกางในแปลง ข คิดเป็นร้อยละเท่าใดของต้นไม้ทั้งหมดในแปลง ข"
    figure: { src: mangrove-survey.svg, alt: "แผนภูมิแท่งสองแผง แปลง ก ป่าชายเลนธรรมชาติ มีโกงกาง 12 ต้น แสม 8 ต้น ลำพู 6 ต้น ตะบูน 4 ต้น แปลง ข ป่าชายเลนที่ปลูกใหม่ มีโกงกาง 27 ต้น แสม 3 ต้น ลำพู 0 ต้น ตะบูน 0 ต้น แปลงทั้งสองมีขนาดเท่ากัน เป็นข้อมูลสมมติ" }
    answer: { value: 90, unit: "%" }
    hints:
      - "รวมจำนวนต้นไม้ทุกชนิดในแปลง ข ก่อน"
      - "ร้อยละ = (จำนวนโกงกาง ÷ จำนวนทั้งหมด) × 100"
    misconceptions:
      - { match: 40, feedback: "นี่คือร้อยละของโกงกางในแปลง ก ให้ดูแปลง ข" }
      - { match: 27, feedback: "27 คือจำนวนต้น ยังไม่ได้เปลี่ยนเป็นร้อยละ" }
    solution: "แปลง ข มีต้นไม้ $27 + 3 = 30$ ต้น โกงกางคิดเป็น $\\frac{27}{30} \\times 100 = 90\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.biodiversity.p008
    topics: [biology.diversity.biodiversity]
    difficulty: 3
    type: mcq
    stem: "จากภาพ แปลงทั้งสองมีต้นไม้ 30 ต้นเท่ากัน ข้อสรุปใดถูกต้องที่สุด"
    figure: { src: mangrove-survey.svg, alt: "แผนภูมิแท่งสองแผง แปลง ก ป่าชายเลนธรรมชาติ มีโกงกาง 12 ต้น แสม 8 ต้น ลำพู 6 ต้น ตะบูน 4 ต้น แปลง ข ป่าชายเลนที่ปลูกใหม่ มีโกงกาง 27 ต้น แสม 3 ต้น ลำพู 0 ต้น ตะบูน 0 ต้น แปลงทั้งสองมีขนาดเท่ากัน เป็นข้อมูลสมมติ" }
    choices:
      - { id: a, text: "แปลง ก หลากหลายกว่า เพราะมีจำนวนชนิดมากกว่าและแต่ละชนิดมีจำนวนใกล้เคียงกันกว่า", correct: true }
      - { id: b, text: "ทั้งสองแปลงหลากหลายเท่ากัน เพราะมีต้นไม้ 30 ต้นเท่ากัน", feedback: "จำนวนต้นทั้งหมดไม่ได้บอกความหลากหลาย ต้องดูจำนวนชนิดและความสม่ำเสมอ" }
      - { id: c, text: "แปลง ข หลากหลายกว่า เพราะมีโกงกางมากที่สุด", feedback: "การมีชนิดเดียวครองพื้นที่ทำให้ความหลากหลายต่ำ ไม่ใช่สูง" }
    hints:
      - "นับจำนวนชนิดที่พบในแต่ละแปลง"
      - "ดูด้วยว่ามีชนิดใดครองพื้นที่เกือบทั้งหมดหรือไม่"
    solution: "แปลง ก มี 4 ชนิด จำนวนแต่ละชนิดใกล้เคียงกัน แปลง ข มี 2 ชนิด และโกงกางครองถึง 90% แปลง ก จึงหลากหลายกว่าทั้งด้านจำนวนชนิดและความสม่ำเสมอ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.biodiversity.p009
    topics: [biology.diversity.biodiversity]
    difficulty: 3
    type: mcq
    stem: "มนุษย์ (Homo sapiens) จัดอยู่ใน Animalia, Chordata, Mammalia, Primates, Hominidae, Homo ส่วนลิงแสม (Macaca fascicularis) จัดอยู่ใน Animalia, Chordata, Mammalia, Primates, Cercopithecidae, Macaca ลำดับขั้นต่ำที่สุดที่มนุษย์และลิงแสมอยู่ร่วมกันคือขั้นใด"
    choices:
      - { id: a, text: "อันดับ", correct: true }
      - { id: b, text: "ชั้น", feedback: "อยู่ร่วมกันในชั้นจริง แต่ยังอยู่ร่วมกันในขั้นที่ต่ำกว่านั้นอีกหนึ่งขั้น" }
      - { id: c, text: "วงศ์", feedback: "มนุษย์อยู่วงศ์ Hominidae ลิงแสมอยู่วงศ์ Cercopithecidae จึงต่างวงศ์กัน" }
      - { id: d, text: "สกุล", feedback: "ชื่อสกุลคือคำแรกของชื่อวิทยาศาสตร์ Homo กับ Macaca ต่างกัน" }
    hints:
      - "เทียบรายชื่อทีละขั้นจากซ้ายไปขวา"
      - "หาขั้นสุดท้ายที่ชื่อยังเหมือนกัน"
    solution: "ชื่อเหมือนกันถึง Primates ซึ่งเป็นขั้นอันดับ ขั้นวงศ์เริ่มต่างกัน (Hominidae กับ Cercopithecidae) จึงอยู่ร่วมกันต่ำสุดที่ขั้นอันดับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.biodiversity.p010
    topics: [biology.diversity.biodiversity]
    difficulty: 3
    type: text
    stem: "ชื่อวิทยาศาสตร์ของข้าวคือ Oryza sativa ชื่อสกุลของข้าวคืออะไร (พิมพ์เป็นภาษาละติน)"
    accepted: ["Oryza", "oryza"]
    hints:
      - "ชื่อวิทยาศาสตร์มีสองคำ"
      - "คำที่ขึ้นต้นด้วยอักษรตัวใหญ่คือชื่อสกุล"
    misconceptions:
      - { match: "sativa", feedback: "sativa เป็นคำระบุชนิด ใช้ลำพังไม่ได้ ชื่อสกุลคือคำแรก" }
      - { match: "Oryza sativa", feedback: "นี่คือชื่อชนิดเต็ม ชื่อสกุลเป็นเพียงคำแรก" }
    solution: "คำแรก Oryza คือชื่อสกุล ส่วน sativa คือคำระบุชนิด ชื่อชนิดต้องเขียนทั้งสองคำ Oryza sativa"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.biodiversity.p011
    topics: [biology.diversity.biodiversity]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "เกษตรกรปลูกยางพาราพันธุ์เดียวเต็มพื้นที่ 500 ไร่ ข้อใดเป็นความเสี่ยงที่เกิดจากความหลากหลายต่ำ (เลือกได้มากกว่า 1 ข้อ)"
    choices:
      - { id: a, text: "ถ้าเกิดโรคใบร่วงที่ยางพันธุ์นี้ไม่ต้านทาน โรคจะระบาดได้ทั้งสวน", correct: true }
      - { id: b, text: "นก แมลง และสัตว์พื้นถิ่นมีอาหารและที่อยู่น้อยลง", correct: true }
      - { id: c, text: "ต้นยางจะผสมพันธุ์กับพืชชนิดอื่นจนกลายเป็นชนิดใหม่", feedback: "พืชต่างชนิดผสมพันธุ์กันตามธรรมชาติไม่ได้หรือได้ลูกที่เป็นหมัน และไม่เกี่ยวกับความเสี่ยงของสวนพันธุ์เดียว" }
      - { id: d, text: "ต้นยางจะโตช้าลงเพราะมีต้นยางมากเกินไปในประเทศ", feedback: "จำนวนต้นยางในประเทศไม่ทำให้ต้นในสวนโตช้า ปัญหาคือพันธุกรรมเหมือนกันทั้งสวน" }
    hints:
      - "ต้นยางพันธุ์เดียวกันมีพันธุกรรมคล้ายกันมาก"
      - "คิดถึงทั้งตัวพืชและสัตว์ที่เคยอาศัยในพื้นที่"
    solution: "ต้นยางพันธุ์เดียวกันอ่อนแอต่อโรคแบบเดียวกัน โรคจึงระบาดได้ทั้งสวน (ก) และพื้นที่ที่มีพืชชนิดเดียวมีอาหารและที่อยู่สำหรับสัตว์พื้นถิ่นน้อย (ข)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.biodiversity.p012
    topics: [biology.diversity.biodiversity]
    difficulty: 3
    type: mcq
    stem: "ปลาหมอคางดำซึ่งเป็นปลาต่างถิ่นแพร่ระบาดในแหล่งน้ำหลายจังหวัด ข้อใดเป็นการกระทำที่ช่วยรักษาความหลากหลายทางชีวภาพได้ถูกต้องที่สุด"
    choices:
