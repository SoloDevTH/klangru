problems:
  - id: chemistry.industry.life-cycle-assessment.p001
    topics: [chemistry.industry.life-cycle-assessment]
    difficulty: 1
    type: order
    stem: "เรียงขั้นในวัฏจักรชีวิตของกระป๋องเครื่องดื่มอะลูมิเนียม จากแรกสุดไปสุดท้าย"
    items:
      - "ขุดแร่บอกไซต์"
      - "ถลุงและรีดเป็นแผ่น แล้วขึ้นรูปเป็นกระป๋อง"
      - "ขนส่งเครื่องดื่มไปร้านค้า"
      - "ผู้บริโภคดื่มเครื่องดื่ม"
      - "ส่งกระป๋องเปล่าไปร้านรับซื้อของเก่าเพื่อหลอมใหม่"
    hints:
      - "เริ่มจากการได้มาซึ่งวัตถุดิบ"
      - "ลำดับคือ วัตถุดิบ → ผลิต → ขนส่ง → ใช้ → หมดอายุ"
    solution: "ขุดแร่ (วัตถุดิบ) → ถลุงและขึ้นรูป (การผลิต) → ขนส่ง → ดื่ม (การใช้งาน) → ส่งรีไซเคิล (การจัดการเมื่อหมดอายุ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.industry.life-cycle-assessment.p002
    topics: [chemistry.industry.life-cycle-assessment]
    difficulty: 1
    type: mcq
    stem: "การประเมินวัฏจักรชีวิตผลิตภัณฑ์ (LCA) คืออะไร"
    choices:
      - { id: a, text: "การประเมินผลกระทบต่อสิ่งแวดล้อมของผลิตภัณฑ์ตั้งแต่ได้วัตถุดิบจนหมดอายุ", correct: true, feedback: "ถูก LCA ดูทุกขั้นของชีวิตผลิตภัณฑ์" }
      - { id: b, text: "การประเมินว่าผลิตภัณฑ์ใช้งานได้นานกี่ปี", feedback: "อายุการใช้งานเป็นข้อมูลหนึ่ง แต่ LCA ประเมินผลกระทบต่อสิ่งแวดล้อมทุกขั้น" }
      - { id: c, text: "การประเมินผลกระทบเฉพาะตอนทิ้งขยะ", feedback: "ขั้นทิ้งเป็นเพียงขั้นสุดท้าย ต้องรวมวัตถุดิบ การผลิต การขนส่ง และการใช้งานด้วย" }
    hints:
      - "วัฏจักรชีวิตหมายถึงชีวิตทั้งหมดของผลิตภัณฑ์"
      - "ประเมินผลกระทบด้านใด"
    solution: "LCA คือ **การประเมินผลกระทบต่อสิ่งแวดล้อมตลอดชีวิตของผลิตภัณฑ์** ทั้งวัตถุดิบ การผลิต การขนส่ง การใช้งาน และการจัดการเมื่อหมดอายุ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.industry.life-cycle-assessment.p003
    topics: [chemistry.industry.life-cycle-assessment]
    difficulty: 2
    type: match
    stem: "จับคู่กิจกรรมกับขั้นในวัฏจักรชีวิตของผลิตภัณฑ์"
    pairs:
      - { left: "เจาะแก๊สธรรมชาติในอ่าวไทย", right: "การได้มาซึ่งวัตถุดิบ" }
      - { left: "เป่าเม็ดพลาสติกเป็นขวดน้ำที่โรงงาน", right: "การผลิต" }
      - { left: "รถบรรทุกส่งน้ำดื่มไปร้านสะดวกซื้อ", right: "การขนส่ง" }
      - { left: "ซักเสื้อด้วยเครื่องซักผ้าทุกสัปดาห์", right: "การใช้งาน" }
      - { left: "ฝังกลบที่บ่อขยะของเทศบาล", right: "การจัดการเมื่อหมดอายุ" }
    hints:
      - "ถามตัวเองว่ากิจกรรมนั้นเกิดก่อนหรือหลังผู้บริโภคได้รับสินค้า"
      - "การซักเกิดระหว่างที่ผู้บริโภคใช้สินค้า"
    solution: "เจาะแก๊ส → วัตถุดิบ · เป่าขวด → การผลิต · ส่งสินค้า → การขนส่ง · ซักเสื้อ → การใช้งาน · ฝังกลบ → หมดอายุ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.industry.life-cycle-assessment.p004
    topics: [chemistry.industry.life-cycle-assessment]
    difficulty: 2
    type: numeric
    stem: "ถุงพลาสติกหนึ่งใบ (ข้อมูลสมมติ) ปล่อยแก๊สเรือนกระจกขั้นวัตถุดิบ 20 g CO₂e การผลิต 10 g การขนส่ง 2 g และการทิ้ง 3 g ตลอดชีวิตปล่อยทั้งหมดกี่กรัม CO₂e"
    answer: { value: 35, unit: g CO₂e }
    misconceptions:
      - { match: 3, feedback: "นับเฉพาะขั้นทิ้ง LCA ต้องรวมทุกขั้น" }
      - { match: 30, feedback: "ลืมขั้นขนส่งหรือขั้นทิ้ง ต้องรวมให้ครบทั้ง 4 ขั้น" }
    hints:
      - "LCA รวมผลกระทบทุกขั้น"
      - "บวกค่าทั้ง 4 ขั้น"
    solution: "$20 + 10 + 2 + 3 =$ **35 g CO₂e**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.industry.life-cycle-assessment.p005
    topics: [chemistry.industry.life-cycle-assessment]
    difficulty: 3
    type: numeric
    stem: "ถุงผ้าฝ้ายหนึ่งใบปล่อยแก๊สเรือนกระจกรวมทั้งชีวิต 1,350 g CO₂e ส่วนถุงพลาสติกใช้ครั้งเดียวปล่อยใบละ 35 g CO₂e (ข้อมูลสมมติ ไม่คิดการซักถุงผ้า) ต้องใช้ถุงผ้าซ้ำ **อย่างน้อย** กี่ครั้ง จึงปล่อยไม่มากกว่าการใช้ถุงพลาสติกใหม่ทุกครั้ง"
    answer: { value: 39, unit: ครั้ง }
    misconceptions:
      - { match: 38, feedback: "1350 ÷ 35 = 38.6 ถ้าใช้ 38 ครั้ง ถุงพลาสติก 38 ใบปล่อยเพียง 1,330 g ยังน้อยกว่าถุงผ้า ต้องปัดขึ้น" }
      - { match: 1, feedback: "ถุงผ้าหนึ่งใบปล่อยมากกว่าถุงพลาสติกหนึ่งใบหลายสิบเท่า ใช้ครั้งเดียวไม่คุ้ม" }
    hints:
      - "ใช้ถุงผ้า n ครั้งแทนถุงพลาสติก n ใบ"
      - "หา n ที่ทำให้ 35n ≥ 1350 แล้วปัดขึ้นเป็นจำนวนเต็ม"
    solution: "$35n \\ge 1350$ ได้ $n \\ge 38.6$ ต้องใช้ถุงผ้า **อย่างน้อย 39 ครั้ง** (ถุงพลาสติก 39 ใบปล่อย 1,365 g มากกว่าถุงผ้า)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.industry.life-cycle-assessment.p006
    topics: [chemistry.industry.life-cycle-assessment]
    difficulty: 3
    type: numeric
    stem: "จากแผนภูมิ (ข้อมูลสมมติ) ขวดแก้วใช้ครั้งเดียวปล่อยแก๊สเรือนกระจกรวมทุกขั้นมากกว่าขวด PET กี่กรัม CO₂e ต่อขวด"
    figure:
      src: p-bottle-bars.svg
      alt: "แผนภูมิแท่งซ้อน แกนตั้งเป็น g CO₂e ต่อขวด 0 ถึง 500 แท่งขวดแก้วใช้ครั้งเดียว: วัตถุดิบ 120 การผลิต 250 การขนส่ง 90 หมดอายุ 20 แท่งขวด PET: วัตถุดิบ 60 การผลิต 80 การขนส่ง 25 หมดอายุ 15 มีป้ายข้อมูลสมมติ"
    answer: { value: 300, unit: g CO₂e }
    misconceptions:
      - { match: 170, feedback: "เทียบเฉพาะขั้นการผลิต (250 − 80) ต้องเทียบผลรวมทุกขั้น" }
      - { match: 480, feedback: "480 คือผลรวมของขวดแก้ว ต้องลบผลรวมของขวด PET ด้วย" }
    hints:
      - "รวมทุกขั้นของแต่ละขวดก่อน"
      - "นำผลรวมมาลบกัน"
    solution: "ขวดแก้ว $120 + 250 + 90 + 20 = 480$ · ขวด PET $60 + 80 + 25 + 15 = 180$ · ต่างกัน $480 - 180 =$ **300 g CO₂e**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.industry.life-cycle-assessment.p007
    topics: [chemistry.industry.life-cycle-assessment]
    difficulty: 4
    type: numeric
    stem: "ใช้ข้อมูลในแผนภูมิของข้อก่อน (ขวดแก้ว: วัตถุดิบ 120 การผลิต 250 การขนส่ง 90 หมดอายุ 20 · ขวด PET รวม 180 g CO₂e) ถ้าโรงงานเก็บขวดแก้วกลับมาล้างแล้วบรรจุใหม่ การล้างแต่ละรอบปล่อย 20 g และต้องขนส่งทุกรอบ ขวดแก้วต้องใช้อย่างน้อยกี่รอบ ผลกระทบต่อการใช้ 1 รอบจึงน้อยกว่าขวด PET ใช้ครั้งเดียว"
    answer: { value: 6, unit: รอบ }
    misconceptions:
      - { match: 3, feedback: "หาร 480 ด้วย 180 ได้ราว 2.7 แต่การขนส่งและการล้างเกิดทุกรอบ หารด้วยจำนวนรอบไม่ได้" }
      - { match: 5, feedback: "ที่ 5 รอบ ผลกระทบต่อรอบคือ 390/5 + 110 = 188 g ยังมากกว่า 180 g" }
    hints:
      - "ผลกระทบที่เกิดครั้งเดียว = วัตถุดิบ + การผลิต + หมดอายุ ส่วนที่เกิดทุกรอบ = ขนส่ง + ล้าง"
      - "ผลกระทบต่อรอบ = 390/n + 110 หา n ที่น้อยที่สุดที่ทำให้ค่านี้น้อยกว่า 180"
    solution: "ครั้งเดียว $120 + 250 + 20 = 390$ ทุกรอบ $90 + 20 = 110$ ต้องการ $390/n + 110 < 180$ ได้ $n > 5.57$ จึงต้องใช้อย่างน้อย **6 รอบ** (6 รอบได้ 175 g ต่อรอบ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.industry.life-cycle-assessment.p008
    topics: [chemistry.industry.life-cycle-assessment]
    difficulty: 3
    type: mcq
    stem: "ทำไมการรีไซเคิลกระป๋องอะลูมิเนียมจึงคุ้มค่ามาก"
    choices:
      - { id: a, text: "หลอมกระป๋องเก่าใช้พลังงานน้อยกว่าผลิตจากแร่มาก และคุณภาพโลหะไม่ลดลง", correct: true, feedback: "ถูก ใช้พลังงานราว 5% ของการผลิตจากแร่ และรีไซเคิลได้ซ้ำหลายรอบ" }
      - { id: b, text: "อะลูมิเนียมย่อยสลายในดินได้เร็ว", feedback: "อะลูมิเนียมไม่ย่อยสลาย ความคุ้มค่ามาจากพลังงานที่ประหยัดได้" }
      - { id: c, text: "แร่บอกไซต์หาง่ายและไม่ต้องใช้พลังงานในการถลุง", feedback: "การผลิตอะลูมิเนียมจากแร่ต้องแยกด้วยไฟฟ้า ใช้พลังงานสูงมาก นี่จึงเป็นเหตุที่รีไซเคิลคุ้ม" }
      - { id: d, text: "กระป๋องรีไซเคิลแล้วได้พลาสติกกลับมา", feedback: "กระป๋องเป็นโลหะ หลอมแล้วได้อะลูมิเนียม" }
    hints:
      - "เทียบพลังงานที่ใช้ผลิตจากแร่กับการหลอมของเก่า"
      - "คุณภาพหลังรีไซเคิลลดลงหรือไม่"
    solution: "การผลิตอะลูมิเนียมจากแร่ต้องแยกด้วยไฟฟ้าซึ่งใช้พลังงานสูง การหลอมกระป๋องเก่า **ใช้พลังงานเพียงราว 5%** และโลหะที่ได้มีคุณภาพเท่าเดิม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.industry.life-cycle-assessment.p009
    topics: [chemistry.industry.life-cycle-assessment]
    difficulty: 3
    type: numeric
    stem: "ผลิตอะลูมิเนียมจากแร่ใช้พลังงาน 150 MJ ต่อกิโลกรัม ส่วนหลอมจากกระป๋องเก่าใช้ 7.5 MJ ต่อกิโลกรัม (ข้อมูลสมมติ) ธนาคารขยะของโรงเรียนส่งกระป๋อง 1,000 ใบ ใบละ 15 g ไปหลอมใหม่ ประหยัดพลังงานได้กี่ MJ"
    answer: { value: 2137.5, unit: MJ, tolerance: 1 }
    misconceptions:
      - { match: 2250, feedback: "นี่คือพลังงานผลิตจากแร่ทั้งหมด ต้องลบพลังงานที่ใช้หลอมกระป๋องเก่าด้วย" }
      - { match: 2137500, feedback: "ลืมแปลงกรัมเป็นกิโลกรัม 1,000 ใบ × 15 g = 15 kg" }
    hints:
      - "มวลกระป๋องทั้งหมดเป็นกิโลกรัมเท่าใด"
      - "พลังงานที่ประหยัด = (150 − 7.5) × มวล"
    solution: "มวล $= 1000 \\times 15\\,\\mathrm{g} = 15\\,\\mathrm{kg}$ ประหยัด $(150 - 7.5) \\times 15 =$ **2,137.5 MJ**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.industry.life-cycle-assessment.p010
    topics: [chemistry.industry.life-cycle-assessment]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "ถุงพลาสติกบางใส่อาหารที่ใช้แล้วมักไม่มีใครรับซื้อ เหตุผลใดทำให้การรีไซเคิลถุงแบบนี้ไม่คุ้มค่า (เลือกได้หลายข้อ)"
    choices:
      - { id: a, text: "ถุงเปื้อนเศษอาหารและน้ำมัน ต้องล้างก่อน", correct: true, feedback: "ถูก สิ่งปนเปื้อนทำให้แยกยากและคุณภาพต่ำ" }
      - { id: b, text: "ถุงเบามาก ต้องเก็บจำนวนมากจึงได้น้ำหนักพอขาย", correct: true, feedback: "ถูก ค่าเก็บและขนส่งต่อกิโลกรัมสูง" }
      - { id: c, text: "ถุงหลายชนิดเป็นพลาสติกต่างชนิดปนกัน", correct: true, feedback: "ถูก พลาสติกต่างชนิดหลอมรวมกันแล้วได้วัสดุคุณภาพต่ำ" }
      - { id: d, text: "ถุงพลาสติกเป็นเทอร์โมเซต หลอมไม่ได้", feedback: "ถุงส่วนใหญ่เป็น PE ซึ่งเป็นเทอร์โมพลาสติก หลอมได้ ปัญหาอยู่ที่ความคุ้มค่า" }
    hints:
      - "นึกถึงขั้นเก็บ คัดแยก และทำความสะอาด"
      - "ถุงเป็นเทอร์โมพลาสติกหรือเทอร์โมเซต"
    solution: "ถุงบาง **สกปรก เบา และมีพลาสติกหลายชนิดปนกัน** ค่าเก็บ ล้าง และคัดแยกจึงสูงกว่ามูลค่าของวัสดุที่ได้ ทั้งที่ PE หลอมใหม่ได้ในทางเทคนิค"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.industry.life-cycle-assessment.p011
    topics: [chemistry.industry.life-cycle-assessment]
    difficulty: 4
    type: numeric
    stem: "ขวดน้ำดื่ม PET ขนาด 600 mL ปล่อยแก๊สเรือนกระจก 90 g CO₂e ต่อขวด ขวดขนาด 1.5 L ปล่อย 160 g CO₂e ต่อขวด (ข้อมูลสมมติ) เมื่อเทียบด้วยหน่วยหน้าที่ \"บรรจุน้ำ 1 ลิตร\" ขวด 1.5 L ปล่อยกี่กรัม CO₂e ต่อลิตร"
    answer: { value: 106.7, unit: g CO₂e/L, tolerance: 0.5 }
    misconceptions:
      - { match: 160, feedback: "นี่คือค่าต่อขวด ต้องหารด้วยปริมาตร 1.5 L" }
      - { match: 240, feedback: "คูณแทนการหาร ค่าต่อลิตร = ค่าต่อขวด ÷ จำนวนลิตรต่อขวด" }
    hints:
      - "หน่วยหน้าที่คือน้ำ 1 ลิตร"
      - "หารค่าต่อขวดด้วยปริมาตรขวดเป็นลิตร"
    solution: "$160 \\div 1.5 =$ **106.7 g CO₂e ต่อลิตร** น้อยกว่าขวด 600 mL ซึ่งเป็น $90 \\div 0.6 = 150$ g ต่อลิตร แม้ต่อขวดจะมากกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.industry.life-cycle-assessment.p012
    topics: [chemistry.industry.life-cycle-assessment]
    difficulty: 4
    type: mcq
    stem: "โฆษณาหนึ่งบอกว่า \"ขวดของเราลดคาร์บอนได้ 30% ในขั้นการผลิต จึงดีต่อโลกที่สุด\" ข้อใดเป็นการประเมินข้อความนี้ได้ดีที่สุด"
    choices:
      - { id: a, text: "ยังสรุปไม่ได้ ต้องดูผลรวมทุกขั้น เช่น วัตถุดิบ การขนส่ง และการจัดการหลังใช้ และเทียบด้วยหน่วยหน้าที่เดียวกัน", correct: true, feedback: "ถูก การรายงานเพียงขั้นเดียวอาจซ่อนผลกระทบในขั้นอื่น" }
      - { id: b, text: "เชื่อได้ เพราะ 30% เป็นตัวเลขที่วัดมาแล้ว", feedback: "ตัวเลขอาจถูกต้อง แต่เป็นเพียงขั้นเดียว ผลรวมอาจไม่ลดลง" }
      - { id: c, text: "เชื่อไม่ได้เลย เพราะ LCA ใช้ตัวเลขไม่ได้", feedback: "LCA ใช้ตัวเลขได้ แต่ต้องครบทุกขั้นและบอกสมมติฐาน" }
    hints:
      - "LCA ที่สมบูรณ์รวมกี่ขั้น"
      - "ผู้ผลิตอาจเลือกรายงานเฉพาะขั้นที่ได้เปรียบ"
    solution: "ข้อความนี้รายงานเพียงขั้นเดียว **ต้องดูผลรวมทุกขั้นและเทียบที่หน่วยหน้าที่เดียวกัน** ก่อนสรุปว่าดีกว่า"
