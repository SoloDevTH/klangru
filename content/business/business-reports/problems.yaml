- id: business.communication.business-reports.p016
  topics:
  - business.communication.business-reports
  difficulty: 5
  type: numeric
  stem: ร้านค้าแห่งหนึ่ง (สมมติ) มีรายได้ 800,000 บาท ต้นทุนขาย 480,000 บาท ค่าใช้จ่ายดำเนินงาน 220,000 บาท ดอกเบี้ยจ่าย 10,000 บาท และภาษีเงินได้ 20% ของกำไรก่อนภาษี กำไรสุทธิเป็นกี่เปอร์เซ็นต์ของรายได้ (ตอบเป็นเปอร์เซ็นต์)
  answer:
    value: 9.0
    tolerance: 0.1
    unit: '%'
  misconceptions:
  - match: 12.5
    feedback: ตอบจากกำไรจากการดำเนินงานก่อนหักดอกเบี้ยและภาษี ต้องหักทุกรายการจนถึงกำไรสุทธิ
  hints:
  - 'คำนวณทีละขั้น: กำไรขั้นต้น แล้วกำไรจากการดำเนินงาน แล้วกำไรก่อนภาษี'
  - ภาษี 20% คิดจากกำไรก่อนภาษี แล้วหักออกเพื่อให้ได้กำไรสุทธิ
  solution: กำไรขั้นต้น 320,000 → กำไรจากการดำเนินงาน 100,000 → กำไรก่อนภาษี 90,000 → ภาษี 18,000 → กำไรสุทธิ 72,000 บาท คิดเป็น 9% ของรายได้
