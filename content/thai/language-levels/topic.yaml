id: thai.grammar.language-levels
subject: thai
title: { th: ระดับภาษา ภาษาพูด ภาษาเขียน และภาษาถิ่น, en: "Language registers, spoken and written Thai, and regional dialects" }
summary: เปรียบเทียบภาษาไทยมาตรฐานกับภาษาถิ่น แยกภาษาพูดกับภาษาเขียน วิเคราะห์ระดับภาษาตั้งแต่พิธีการถึงกันเอง และเลือกคำให้เหมาะกับกาลเทศะและบุคคล
difficulty: 4
minutes: 35
prerequisites: [thai.grammar.sentences-basic]
encompasses:
  - { id: thai.grammar.sentences-basic, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: formality-stairs.svg
    alt: "บันได 5 ขั้น จากบนลงล่าง: พิธีการ (กล่าวเปิดงาน สุนทรพจน์ในพิธี) ทางการ (หนังสือราชการ ข่าว รายงานวิชาการ) กึ่งทางการ (ประชุมกลุ่ม อภิปราย บทความ) สนทนา (คุยกับครู คนที่ไม่สนิท ซื้อของ) กันเอง (เพื่อนสนิท คนในครอบครัว) แถบสีด้านหลังจัดเป็น 3 ระดับ: พิธีการกับทางการ = ทางการ, กึ่งทางการ = กึ่งทางการ, สนทนากับกันเอง = ไม่เป็นทางการ"
    caption: "ระดับภาษา 5 ระดับ และการรวมเป็น 3 ระดับ"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: เปลี่ยนภาษาพูดเป็นภาษาเขียน
    problem: "เขียนประโยค \"เมื่อวานฝนตกเยอะมาก ถนนน้ำท่วมเลยอ่ะ ไปโรงเรียนยังไงก็ไม่รู้\" ใหม่เป็นภาษาเขียนสำหรับรายงาน"
    steps:
      - text: "หาคำภาษาพูด: เยอะ · เลย · อ่ะ · ยังไง · ไม่รู้"
      - text: "เปลี่ยนเป็นภาษาเขียน: เยอะมาก → ปริมาณมาก · ยังไง → อย่างไร · ตัดคำลงท้าย เลย อ่ะ"
      - text: "เติมประธานที่ละไว้ และเรียงประโยคให้ครบ"
        why: "ภาษาพูดละประธานได้เพราะผู้ฟังรู้ แต่ผู้อ่านรายงานไม่ได้อยู่ในเหตุการณ์"
    answer: "เมื่อวานฝนตกปริมาณมาก ทำให้น้ำท่วมถนน นักเรียนหลายคนไม่สามารถเดินทางมาโรงเรียนได้"
  - { type: check, problem: thai.grammar.language-levels.p012, prompt: "หาคำภาษาพูดในแต่ละตัวเลือก" }
  - type: worked-example
    title: วิเคราะห์ระดับภาษาของข้อความ
    problem: "\"ขอความอนุเคราะห์ใช้ห้องประชุมในวันที่ 5 ธันวาคม เพื่อจัดการประชุมคณะกรรมการนักเรียน\" ใช้ภาษาระดับใด (แบบ 3 ระดับ)"
    steps:
      - text: "ดูคำ: ขอความอนุเคราะห์ คณะกรรมการ เป็นคำทางการ ไม่มีคำภาษาพูด"
      - text: "ดูรูปประโยค: ครบถ้วน บอกวันที่และจุดประสงค์ ไม่มีคำลงท้าย"
      - text: "ดูสถานการณ์: เป็นข้อความขอใช้สถานที่จากหน่วยงาน"
    answer: "ภาษาระดับทางการ"
  - { type: check, problem: thai.grammar.language-levels.p007, prompt: "ข้อความถึงครูควรอยู่ระดับใด" }
  - type: figure
    src: chat-teacher.svg
    alt: "หน้าจอแชตถึง ครูวิภา (ครูประจำชั้น) นักเรียนส่งข้อความ: ครูคะ พรุ่งนี้หนูไม่ไปโรงเรียนนะ / ไม่สบายอ่ะ เป็นไข้ / ขอส่งงานวันศุกร์แทนได้ป่ะคะ"
    caption: "ข้อความนี้ควรแก้คำใดบ้าง"
glossary:
  - { term: ภาษาไทยมาตรฐาน, definition: "ภาษาไทยที่ใช้เป็นภาษาราชการ ในตำรา ข่าว และการติดต่อทั่วประเทศ" }
  - { term: ภาษาถิ่น, definition: "ภาษาไทยที่ใช้ในแต่ละท้องถิ่น มีคำและสำเนียงเฉพาะ เช่น ถิ่นเหนือ อีสาน ใต้" }
  - { term: กาลเทศะ, definition: "เวลาและสถานที่ ใช้ตัดสินว่าควรพูดหรือทำอย่างไร" }
  - { term: ระดับภาษา, definition: "ความเป็นทางการของภาษา จากพิธีการถึงกันเอง" }
  - { term: ภาษาปาก, definition: "คำที่ใช้พูดกันอย่างไม่เป็นทางการ เช่น เยอะ ยังไง ไม่ใช้ในงานเขียนทางการ" }
flashcards:
  - { front: "พูด ในถิ่นเหนือ อีสาน ใต้", back: "อู้ · เว้า · แหลง" }
  - { front: "ระดับภาษา 5 ระดับ", back: "พิธีการ ทางการ กึ่งทางการ สนทนา กันเอง (บางตำรารวมเป็น 3 ระดับ)" }
  - { front: "ยังไง เป็นภาษาเขียนว่า", back: "อย่างไร" }
  - { front: "วิเคราะห์ระดับภาษาดูอะไรบ้าง", back: "คำที่ใช้ รูปประโยค และสถานการณ์ (ใครส่งถึงใคร)" }
