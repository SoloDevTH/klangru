problems:
- id: chinese.grammar.ba-sentences.p001
  topics:
  - chinese.grammar.ba-sentences
  difficulty: 1
  type: mcq
  stem: ครูพูดว่า 请把门关上。 (Qǐng bǎ mén guānshàng.) ครูให้ทำอะไร
  choices:
  - id: a
    text: ออกไปนอกประตู
    feedback: ออกไปคือ 出去
  - id: b
    text: ยืนที่ประตู
    feedback: ไม่มีคำว่ายืน (站)
  - id: c
    text: ปิดประตู
    correct: true
    feedback: ถูก 把门关上 = เอาประตูปิดเข้า (ปิดประตู)
  - id: d
    text: เปิดประตู
    feedback: เปิดคือ 打开
  hints:
  - 门 = ประตู
  - 关上 = ปิด (关 + ส่วนเติมเต็ม 上)
  solution: '**ปิดประตู** (请 = กรุณา)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.ba-sentences.p002
  topics:
  - chinese.grammar.ba-sentences
  difficulty: 2
  type: order
  stem: เรียงคำเป็นประโยค "แม่เอาผลไม้ไปใส่ไว้ในตู้เย็นแล้ว" (冰箱 bīngxiāng = ตู้เย็น)
  items:
  - 妈妈
  - 把
  - 水果
  - 放在
  - 冰箱里
  - 了
  hints:
  - ประธาน + 把 + กรรม + กริยา + ส่วนอื่น
  - 放在 + สถานที่ บอกว่าวางไว้ที่ไหน
  solution: '**妈妈把水果放在冰箱里了。** Māma bǎ shuǐguǒ fàng zài bīngxiāng lǐ le.'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.ba-sentences.p003
  topics:
  - chinese.grammar.ba-sentences
  difficulty: 2
  type: mcq
  stem: 我的雨伞被同学借走了。 (yǔsǎn ร่ม · jièzǒu ยืมไป) แปลว่าอะไร
  choices:
  - id: a
    text: ร่มของฉันถูกเพื่อนร่วมชั้นยืมไป
    correct: true
    feedback: ถูก ผู้ถูกกระทำ (ร่ม) + 被 + ผู้กระทำ (同学) + กริยา
  - id: b
    text: ฉันยืมร่มของเพื่อนไป
    feedback: ผู้ยืมคือ 同学 ไม่ใช่ฉัน
  - id: c
    text: เพื่อนให้ร่มฉันมา
    feedback: ไม่มีคำว่าให้ (给)
  - id: d
    text: ร่มของเพื่อนหายไป
    feedback: ร่มเป็นของฉัน (我的雨伞)
  hints:
  - คำหน้า 被 คือสิ่งที่ถูกกระทำ
  - คำหลัง 被 คือผู้กระทำ
  solution: '**ร่มของฉันถูกเพื่อนร่วมชั้นยืมไป**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.ba-sentences.p004
  topics:
  - chinese.grammar.ba-sentences
  difficulty: 2
  type: hanzi
  stem: เขียนอักษร 把 (bǎ) ตามลำดับขีด
  character: 把
  pinyin: bǎ
  meaning: จับ ถือ (ใช้นำกรรมในประโยค 把)
  hints:
  - 把 = 扌 (มือ) + 巴 รวม 7 ขีด
  - เขียน 扌 ก่อน (横 竖钩 提) แล้วเขียน 巴
  solution: '扌: 横 → 竖钩 → 提 แล้ว 巴: 横折 → 竖 → 横 → 竖弯钩 รวม 7 ขีด'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.ba-sentences.p005
  topics:
  - chinese.grammar.ba-sentences
  difficulty: 3
  type: mcq
  stem: '"ฉันเอาหนังสือใส่ไว้ในกระเป๋านักเรียนแล้ว" ประโยคใดถูกต้อง'
  choices:
  - id: a
    text: 我放书在书包里了。
    feedback: กรรมกับ 在 + สถานที่ วางหลังกริยาพร้อมกันไม่ได้ ต้องใช้ 把
  - id: b
    text: 我把书包里放书了。
    feedback: สิ่งของที่ถูกจัดการ (书) ต้องอยู่หลัง 把
  - id: c
    text: 我把书放在书包里了。
    correct: true
    feedback: ถูก มี 放在 + สถานที่ ตามหลังกริยา
  - id: d
    text: 我把书放。
    feedback: กริยาเปล่า ต้องบอกว่าวางไว้ที่ไหน
  hints:
  - ประโยค 把 ห้ามจบที่กริยาเปล่า
  - 'รูป: 把 + กรรม + 放在 + สถานที่'
  solution: '**我把书放在书包里了。** Wǒ bǎ shū fàng zài shūbāo lǐ le.'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.ba-sentences.p006
  topics:
  - chinese.grammar.ba-sentences
  difficulty: 3
  type: mcq
  stem: '"ฉันยังไม่ได้ทำการบ้านให้เสร็จ" ประโยคใดถูกต้อง'
  choices:
  - id: a
    text: 我把作业没做完。
    feedback: คำปฏิเสธต้องอยู่หน้า 把 ไม่ใช่หน้ากริยา
  - id: b
    text: 我还没把作业做完了。
    feedback: ปฏิเสธด้วย 没 แล้วไม่ใช้ 了
  - id: c
    text: 我把作业做没完。
    feedback: 没 แทรกระหว่างกริยากับผลไม่ได้
  - id: d
    text: 我还没把作业做完。
    correct: true
    feedback: ถูก คำปฏิเสธ (还没) วางหน้า 把
  hints:
  - ในประโยค 把 คำปฏิเสธและกริยาช่วยอยู่หน้า 把
  - 没 กับ 了 ไม่อยู่ด้วยกัน
  solution: '**我还没把作业做完。** Wǒ hái méi bǎ zuòyè zuòwán.'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.ba-sentences.p007
  topics:
  - chinese.grammar.ba-sentences
  difficulty: 3
  type: mcq
  stem: ดูภาพ หลังเก็บห้อง 他把书包放在哪儿了？
  figure: &id001
    src: room-tidy.svg
    alt: 'สองภาพห้องเดียวกัน ภาพซ้าย ก่อนเก็บห้อง: กระเป๋านักเรียนสีแดงวางอยู่บนพื้นข้างเตียง หนังสือสองเล่มวางอยู่บนเตียง เก้าอี้ว่าง ตู้หนังสือว่าง ภาพขวา หลังเก็บห้อง: กระเป๋านักเรียนอยู่บนเก้าอี้ หนังสือสองเล่มอยู่บนชั้นของตู้หนังสือ เตียงและพื้นว่าง'
    caption: ห้องก่อนและหลังเก็บ
  choices:
  - id: a
    text: 他把书包放在椅子上了。
    correct: true
    feedback: ถูก ภาพหลังเก็บห้องกระเป๋าอยู่บนเก้าอี้
  - id: b
    text: 他把书包放在床上了。
    feedback: บนเตียงในภาพก่อนเก็บคือหนังสือ ไม่ใช่กระเป๋า
  - id: c
    text: 他把书包放在地上了。
    feedback: บนพื้นคือที่ของกระเป๋าก่อนเก็บห้อง
  - id: d
    text: 他把书包放在书架上了。
    feedback: บนตู้หนังสือคือหนังสือ
  hints:
  - ดูภาพขวา (หลังเก็บห้อง)
  - 椅子 = เก้าอี้ 床 = เตียง 地上 = บนพื้น 书架 = ตู้หนังสือ
  solution: '**他把书包放在椅子上了。** (เดิมกระเป๋าอยู่บนพื้น)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.ba-sentences.p008
  topics:
  - chinese.grammar.ba-sentences
  difficulty: 3
  type: mcq
  stem: ป้ายในห้องพักโรงแรมที่ภูเก็ตเขียนว่า 请把垃圾扔进垃圾桶。 (lājī ขยะ · rēng โยน ทิ้ง · lājītǒng ถังขยะ) หมายความว่าอะไร
  choices:
  - id: a
    text: ขยะถูกทิ้งแล้ว
    feedback: ไม่มี 被 และเป็นคำขอ (请)
  - id: b
    text: กรุณาทิ้งขยะลงในถังขยะ
    correct: true
    feedback: ถูก 把垃圾 + 扔进 + 垃圾桶 = เอาขยะทิ้งเข้าไปในถัง
  - id: c
    text: กรุณาอย่าทิ้งขยะ
    feedback: ไม่มีคำห้าม 请勿 หรือ 别
  - id: d
    text: ถังขยะอยู่ข้างใน
    feedback: ป้ายไม่ได้บอกตำแหน่งถัง
  hints:
  - 请 = กรุณา
  - 扔进 = ทิ้งเข้าไป (กริยา + ส่วนเติมเต็มทิศทาง)
  solution: '**กรุณาทิ้งขยะลงในถังขยะ**'
  license: CC-BY-SA-4.0
  ai_assisted: true
