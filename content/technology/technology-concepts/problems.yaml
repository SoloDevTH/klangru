problems:
- id: technology.design.technology-concepts.p001
  topics:
  - technology.design.technology-concepts
  difficulty: 1
  type: mcq
  stem: ข้อใด **ไม่ใช่** เทคโนโลยี
  choices:
  - id: a
    text: ฝนที่ตกลงมาตามธรรมชาติ
    correct: true
  - id: b
    text: ครกและสากสำหรับตำส้มตำ
    feedback: ครกเป็นเครื่องมือที่มนุษย์สร้างเพื่อแก้ปัญหา จึงเป็นเทคโนโลยี
  - id: c
    text: ขั้นตอนการทำปลาร้าเพื่อถนอมอาหาร
    feedback: วิธีการที่คิดขึ้นเพื่อแก้ปัญหาก็เป็นเทคโนโลยี
  - id: d
    text: แอปจ่ายเงินด้วยคิวอาร์โค้ด
    feedback: เป็นเทคโนโลยีดิจิทัล
  hints:
  - เทคโนโลยีคือสิ่งที่มนุษย์สร้างหรือคิดขึ้น
  - ทั้งสิ่งของและวิธีการ
  solution: เทคโนโลยีคือสิ่งของหรือวิธีการที่มนุษย์สร้างหรือปรับปรุงเพื่อแก้ปัญหา ฝนเป็นปรากฏการณ์ธรรมชาติ ไม่ใช่เทคโนโลยี
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.technology-concepts.p002
  topics:
  - technology.design.technology-concepts
  difficulty: 1
  type: match
  stem: จับคู่องค์ประกอบของระบบหม้อหุงข้าวไฟฟ้า
  pairs:
  - left: ตัวป้อน
    right: ข้าวสาร น้ำ และไฟฟ้า
  - left: กระบวนการ
    right: แผ่นความร้อนต้มน้ำ
  - left: ผลผลิต
    right: ข้าวสุก
  - left: ข้อมูลย้อนกลับ
    right: อุณหภูมิก้นหม้อสูงเมื่อน้ำแห้ง ทำให้ตัดไปโหมดอุ่น
  hints:
  - ตัวป้อนคือสิ่งที่ใส่เข้าไป
  - ข้อมูลย้อนกลับใช้ควบคุมการทำงานของระบบ
  solution: ตัวป้อนคือสิ่งที่ใส่ กระบวนการเปลี่ยนตัวป้อน ผลผลิตคือสิ่งที่ได้ และข้อมูลย้อนกลับส่งข้อมูลกลับไปควบคุมระบบ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.technology-concepts.p003
  topics:
  - technology.design.technology-concepts
  difficulty: 2
  type: text
  stem: ในระบบทางเทคโนโลยี ข้อมูลจากผลผลิตที่ส่งกลับไปควบคุมการทำงานของระบบ เรียกว่าอะไร
  accepted:
  - ข้อมูลย้อนกลับ
  - feedback
  - ข้อมูลป้อนกลับ
  misconceptions:
  - match: ผลผลิต
    feedback: ผลผลิตคือสิ่งที่ได้จากระบบ แต่ข้อมูลที่ส่งกลับไปควบคุมคือข้อมูลย้อนกลับ
  - match: ตัวป้อน
    feedback: ตัวป้อนคือสิ่งที่ใส่เข้าไปตั้งแต่ต้น
  hints:
  - ภาษาอังกฤษคือ feedback
  - ทำให้ระบบปรับตัวเองได้
  solution: '**ข้อมูลย้อนกลับ (feedback)** เช่น เทอร์โมสตัทของหม้อหุงข้าว หรือเซนเซอร์ความชื้นในระบบรดน้ำอัตโนมัติ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.technology-concepts.p004
  topics:
  - technology.design.technology-concepts
  difficulty: 2
  type: order
  stem: เรียงเทคโนโลยีให้แสงสว่างในบ้านจากที่เกิดก่อนไปหลัง
  items:
  - ตะเกียงน้ำมัน
  - หลอดไส้
  - หลอดฟลูออเรสเซนต์
  - หลอดแอลอีดี
  hints:
  - หลอดไฟต้องมีไฟฟ้าก่อน
  - หลอดแอลอีดีใช้ความรู้เรื่องสารกึ่งตัวนำ ซึ่งใหม่ที่สุด
  solution: ตะเกียง → หลอดไส้ → หลอดฟลูออเรสเซนต์ → หลอดแอลอีดี แต่ละขั้นให้แสงมากขึ้นต่อพลังงานที่ใช้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.technology-concepts.p005
  topics:
  - technology.design.technology-concepts
  difficulty: 2
  type: mcq
  stem: ระบบรดน้ำผักอัตโนมัติ มีเซนเซอร์วัดความชื้นในดิน บอร์ดไมโครคอนโทรลเลอร์ และปั๊มน้ำ ส่วนใดทำหน้าที่ **ข้อมูลย้อนกลับ**
  choices:
  - id: a
    text: เซนเซอร์วัดซ้ำว่าดินชื้นพอแล้วจึงสั่งให้ปั๊มหยุด
    correct: true
  - id: b
    text: ปั๊มน้ำที่ฉีดน้ำออกมา
    feedback: การฉีดน้ำคือผลผลิตของระบบ
  - id: c
    text: ไฟฟ้าที่ป้อนเข้าบอร์ด
    feedback: ไฟฟ้าเป็นตัวป้อนหรือทรัพยากร
  - id: d
    text: ผักที่โตขึ้น
    feedback: เป็นผลลัพธ์ระยะยาว ไม่ได้ส่งข้อมูลกลับไปควบคุมปั๊มโดยตรง
  hints:
  - ข้อมูลย้อนกลับวัดผลแล้วส่งกลับไปควบคุม
  - ระบบจะรู้ได้อย่างไรว่าควรหยุดรดน้ำ
  solution: เซนเซอร์วัดผลของการรดน้ำ (ความชื้นในดิน) แล้วส่งกลับไปให้บอร์ดสั่งหยุดปั๊ม จึงเป็นข้อมูลย้อนกลับ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.technology-concepts.p006
  topics:
  - technology.design.technology-concepts
  difficulty: 2
  type: mcq
  stem: ปัจจัยใดทำให้ชาวนาไทยเปลี่ยนจากควายลากคันไถมาใช้รถไถ (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: ต้องการทำงานให้เร็วขึ้นและเหนื่อยน้อยลง
    correct: true
    feedback: ถูก เป็นปัจจัยด้านความต้องการ
  - id: b
    text: ความรู้ด้านเครื่องยนต์
    correct: true
    feedback: ถูก เป็นปัจจัยด้านความรู้ทางวิทยาศาสตร์และวิศวกรรม
  - id: c
    text: แรงงานในภาคเกษตรลดลงและค่าแรงสูงขึ้น
    correct: true
    feedback: ถูก เป็นปัจจัยด้านเศรษฐกิจและสังคม
  - id: d
    text: ควายไม่ชอบไถนา
    feedback: ไม่ใช่ปัจจัยที่ทำให้เทคโนโลยีเปลี่ยน
  hints:
  - คิดถึงปัจจัยด้านความต้องการ ความรู้ และเศรษฐกิจ
  - ข้อที่ถูกต้องเป็นเหตุผลที่สมเหตุสมผลกับการเปลี่ยนเทคโนโลยี
  solution: การเปลี่ยนแปลงของเทคโนโลยีมักมีหลายปัจจัยร่วมกัน ทั้งความต้องการ ความรู้ใหม่ และสภาพเศรษฐกิจสังคม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.technology-concepts.p007
  topics:
  - technology.design.technology-concepts
  difficulty: 3
  type: mcq
  stem: ตั้งแต่ 1 มกราคม 2563 ห้างร้านใหญ่ในไทยเลิกแจกถุงพลาสติกใช้ครั้งเดียว ทำให้มีถุงผ้าและบรรจุภัณฑ์แบบใหม่มากขึ้น การเปลี่ยนแปลงนี้เกิดจากปัจจัยด้านใดเป็นหลัก
  choices:
  - id: a
    text: สิ่งแวดล้อม และนโยบายที่ตามมา
    correct: true
  - id: b
    text: ความรู้ใหม่ทางวิทยาศาสตร์
    feedback: ถุงผ้าไม่ใช่ความรู้ใหม่ สาเหตุหลักคือปัญหาขยะพลาสติก
  - id: c
    text: ราคาพลาสติกแพงขึ้นมาก
    feedback: ถุงพลาสติกยังราคาถูก เหตุผลหลักคือผลกระทบต่อสิ่งแวดล้อม
  - id: d
    text: ความนิยมสีของถุง
    feedback: ไม่ใช่สาเหตุหลัก
  hints:
  - ถุงพลาสติกใช้ครั้งเดียวสร้างปัญหาอะไร
  - การรณรงค์มาจากความร่วมมือของภาครัฐและเอกชน
  solution: ปัญหาขยะพลาสติกในทะเลและบนบกเป็นปัจจัยด้านสิ่งแวดล้อม ซึ่งนำไปสู่นโยบายและการรณรงค์ ทำให้เทคโนโลยีบรรจุภัณฑ์เปลี่ยน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.technology-concepts.p008
  topics:
  - technology.design.technology-concepts
  difficulty: 3
  type: mcq
  stem: นักเรียนออกแบบเตาแสงอาทิตย์จากกล่องกระดาษ ข้อใดแสดงการใช้ **คณิตศาสตร์** ในงานนี้
  choices:
  - id: a
    text: คำนวณมุมเอียงและพื้นที่ของแผ่นสะท้อนแสงให้รับแสงได้มากที่สุด
    correct: true
  - id: b
    text: รู้ว่าสีดำดูดกลืนความร้อนได้ดี
    feedback: นี่คือความรู้ทางวิทยาศาสตร์
  - id: c
    text: ประกอบกล่องด้วยกาวและเทป
    feedback: นี่คือทักษะทางเทคโนโลยีและงานช่าง
  - id: d
    text: รู้ว่ากระจกใสให้แสงผ่านแต่กันลม
    feedback: นี่คือความรู้ทางวิทยาศาสตร์เรื่องแสงและความร้อน
  hints:
  - คณิตศาสตร์เกี่ยวกับการคำนวณ วัด และรูปร่าง
  - วิทยาศาสตร์อธิบายว่าทำไม
  solution: คณิตศาสตร์ใช้คำนวณมุม พื้นที่ และขนาด วิทยาศาสตร์อธิบายการดูดกลืนแสงและการถ่ายโอนความร้อน เทคโนโลยีนำทั้งสองมาสร้างเตาที่ใช้ได้จริง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.technology-concepts.p009
  topics:
  - technology.design.technology-concepts
  difficulty: 3
  type: match
  stem: จับคู่ผลกระทบของแอปสั่งอาหารกับด้านที่ได้รับผลกระทบ
  pairs:
  - left: ไรเดอร์มีรายได้เพิ่ม
    right: เศรษฐกิจ
  - left: กล่องและช้อนพลาสติกเพิ่มขึ้น
    right: สิ่งแวดล้อม
  - left: คนออกไปกินข้าวกับครอบครัวน้อยลง
    right: สังคม
  - left: สั่งอาหารได้แม้ป่วยอยู่บ้าน
    right: ชีวิตประจำวัน
  hints:
  - เงินและรายได้เป็นเรื่องเศรษฐกิจ
  - ความสัมพันธ์ของคนเป็นเรื่องสังคม
  solution: เทคโนโลยีเดียวมีผลกระทบหลายด้าน ทั้งบวกและลบ การวิเคราะห์ให้ครบช่วยให้ใช้อย่างรู้เท่าทัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.technology-concepts.p010
  topics:
  - technology.design.technology-concepts
  difficulty: 3
  type: numeric
  stem: หลอดไส้ 60 วัตต์เปิดวันละ 5 ชั่วโมง 30 วัน ถ้าค่าไฟหน่วยละ 4 บาท (1 หน่วย = 1 กิโลวัตต์ชั่วโมง) ต้องจ่ายค่าไฟของหลอดนี้กี่บาท
  answer:
    value: 36
    unit: บาท
  misconceptions:
  - match: 36000
    feedback: ลืมแปลงวัตต์ชั่วโมงเป็นกิโลวัตต์ชั่วโมง
  - match: 1.2
    feedback: คิดแค่วันเดียว (60 × 5 = 0.3 kWh × 4) ลืมคูณ 30 วัน
  hints:
  - พลังงาน = กำลัง × เวลา แล้วแปลงวัตต์ชั่วโมงเป็นกิโลวัตต์ชั่วโมง
  - 60 × 5 × 30 แล้วหาร 1,000
  solution: พลังงาน $= 60 \times 5 \times 30 = 9{,}000\,\mathrm{Wh} = 9\,\mathrm{kWh}$ ค่าไฟ $= 9 \times 4 = 36$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.technology-concepts.p011
  topics:
  - technology.design.technology-concepts
  difficulty: 4
  type: numeric
  stem: เปลี่ยนหลอดไส้ 60 วัตต์เป็นหลอดแอลอีดี 9 วัตต์ เปิดวันละ 5 ชั่วโมงทุกวันตลอดปี (365 วัน) ค่าไฟหน่วยละ 4 บาท จะประหยัดค่าไฟได้ปีละกี่บาท
  answer:
    value: 372.3
    tolerance: 1
    unit: บาท
  misconceptions:
  - match: 438
    feedback: คิดเฉพาะค่าไฟของหลอดไส้ (60 W) ลืมหักค่าไฟของหลอดแอลอีดี
  - match: 65.7
    feedback: คิดเฉพาะค่าไฟของหลอดแอลอีดี ไม่ใช่เงินที่ประหยัด
  hints:
  - หาผลต่างของกำลังไฟฟ้าก่อน
  - ผลต่าง × ชั่วโมงต่อวัน × 365 ÷ 1,000 × 4
  solution: ผลต่าง $60 - 9 = 51$ W พลังงานที่ประหยัด $= 51 \times 5 \times 365 = 93{,}075\,\mathrm{Wh} \approx 93.1\,\mathrm{kWh}$ เงินที่ประหยัด $\approx 93.075 \times 4 = 372.3$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.technology-concepts.p012
  topics:
  - technology.design.technology-concepts
  difficulty: 4
  type: numeric
  stem: โรงเรียนติดปั๊มน้ำพลังงานแสงอาทิตย์ราคา 30,000 บาท ช่วยลดค่าไฟเดือนละ 500 บาท ต้องใช้กี่ **ปี** จึงได้เงินคืนเท่าราคาที่ซื้อ (ไม่คิดค่าซ่อมบำรุง)
  answer:
    value: 5
    unit: ปี
  misconceptions:
  - match: 60
    feedback: นี่คือจำนวนเดือน ยังไม่ได้แปลงเป็นปี
  hints:
  - 'หาจำนวนเดือนก่อน: ราคา ÷ เงินที่ประหยัดต่อเดือน'
  - แล้วแปลงเดือนเป็นปี
  solution: $30{,}000 \div 500 = 60$ เดือน $= 60 \div 12 = 5$ ปี เป็นข้อมูลหนึ่งที่ใช้ตัดสินใจ ร่วมกับอายุการใช้งานและผลต่อสิ่งแวดล้อม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.technology-concepts.p013
  topics:
  - technology.design.technology-concepts
  difficulty: 4
  type: mcq
  stem: ข้อใดเป็นการ **คาดการณ์แนวโน้ม** เทคโนโลยีการเกษตรที่มีเหตุผลรองรับดีที่สุด
  choices:
  - id: a
    text: แรงงานเกษตรลดลงและเซนเซอร์ราคาถูกลง จึงน่าจะมีการใช้ระบบให้น้ำและปุ๋ยอัตโนมัติที่สั่งงานผ่านมือถือมากขึ้น
    correct: true
  - id: b
    text: อีก 10 ปี ทุกบ้านจะมีหุ่นยนต์ทำนาแน่นอน เพราะหุ่นยนต์เท่
    feedback: ใช้ความชอบเป็นเหตุผล และไม่ได้คิดถึงราคาและความพร้อมของเกษตรกร
  - id: c
    text: เทคโนโลยีการเกษตรจะไม่เปลี่ยนอีกแล้ว
    feedback: ปัจจัยต่าง ๆ ยังเปลี่ยนอยู่ เทคโนโลยีจึงเปลี่ยนตาม
  - id: d
    text: ชาวนาจะกลับไปใช้ควายทั้งหมดเพราะคิดถึงอดีต
    feedback: ไม่มีปัจจัยทางเศรษฐกิจหรือความต้องการรองรับ
  hints:
  - การคาดการณ์ที่ดีอ้างปัจจัยที่ทำให้เทคโนโลยีเปลี่ยน
  - ดูว่าข้อใดมีทั้งปัจจัยและผลที่สมเหตุสมผล
  solution: การคาดการณ์ที่ดีเริ่มจากปัจจัยที่เห็นอยู่ (แรงงานลด เซนเซอร์ถูกลง) แล้วคาดผลที่สอดคล้องกัน ไม่ใช่การเดาตามความชอบ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.technology-concepts.p014
  topics:
  - technology.design.technology-concepts
  difficulty: 4
  type: mcq
  stem: โรงเรียนในชนบทต้องการแสงสว่างตอนเย็นให้ห้องสมุด มีทางเลือกคือ เครื่องปั่นไฟน้ำมันดีเซล หรือแผงโซลาร์เซลล์กับแบตเตอรี่ ข้อใดเป็นการตัดสินใจที่คำนึงถึงผลกระทบได้ครบที่สุด
  choices:
  - id: a
    text: เปรียบเทียบราคาตลอดอายุการใช้งาน ค่าเชื้อเพลิง เสียงและควันที่รบกวน การดูแลรักษา และการจัดการแบตเตอรี่เมื่อหมดอายุ แล้วจึงเลือก
    correct: true
  - id: b
    text: เลือกเครื่องปั่นไฟเพราะราคาซื้อถูกกว่า
    feedback: ดูแค่ราคาซื้อ ไม่ได้คิดค่าน้ำมัน เสียง ควัน และผลต่อสุขภาพ
  - id: c
    text: เลือกโซลาร์เซลล์เพราะเป็นของใหม่
    feedback: ความใหม่ไม่ใช่เหตุผลเพียงพอ ต้องดูความเหมาะสมและผลกระทบ
  - id: d
    text: เลือกแบบที่ครูชอบ
    feedback: การตัดสินใจควรใช้ข้อมูลและเกณฑ์ ไม่ใช่ความชอบส่วนตัว
  hints:
  - การเลือกใช้เทคโนโลยีต้องคิดหลายด้าน
  - ชีวิต สังคม เศรษฐกิจ และสิ่งแวดล้อม
  solution: การตัดสินใจที่ดีเปรียบเทียบทางเลือกด้วยเกณฑ์หลายด้าน ทั้งค่าใช้จ่ายระยะยาว ผลต่อคนและสิ่งแวดล้อม และการจัดการเมื่อหมดอายุ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.technology-concepts.p015
  topics:
  - technology.design.technology-concepts
  difficulty: 5
  type: mcq
  stem: คนไทยเปลี่ยนโทรศัพท์มือถือบ่อยขึ้น ทำให้ขยะอิเล็กทรอนิกส์เพิ่ม ข้อใดเป็นแนวทางพัฒนาเทคโนโลยีที่ลดผลกระทบนี้ได้ตรงจุดที่สุด
  choices:
  - id: a
    text: ออกแบบให้เปลี่ยนแบตเตอรี่และซ่อมได้ง่าย อัปเดตซอฟต์แวร์ได้นาน และมีระบบรับคืนเพื่อแยกโลหะมีค่ากลับมาใช้
    correct: true
  - id: b
    text: ทิ้งโทรศัพท์เก่าลงถังขยะทั่วไปให้เร็วที่สุด
    feedback: ขยะอิเล็กทรอนิกส์มีโลหะหนักและแบตเตอรี่ที่เป็นอันตราย ต้องแยกทิ้ง
  - id: c
    text: ผลิตโทรศัพท์ให้เสียเร็วขึ้นเพื่อขายได้มากขึ้น
    feedback: ทำให้ขยะเพิ่มขึ้น ขัดกับเป้าหมาย
  - id: d
    text: ห้ามทุกคนใช้โทรศัพท์มือถือ
    feedback: ไม่สมจริงและเสียประโยชน์ที่เทคโนโลยีให้
  hints:
  - ปัญหาเกิดจากอายุการใช้งานสั้นและการทิ้งไม่ถูกวิธี
  - แนวทางที่ดีแก้ที่การออกแบบและการจัดการหลังใช้
  solution: การประเมินผลกระทบช่วยกำหนดแนวทางพัฒนาเทคโนโลยี ยืดอายุการใช้งาน ซ่อมง่าย และนำวัสดุกลับมาใช้ ลดขยะอิเล็กทรอนิกส์ได้ที่ต้นเหตุ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.technology-concepts.p016
  topics:
  - technology.design.technology-concepts
  difficulty: 5
  type: mcq
  stem: บ่อเลี้ยงปลานิลของลุงชัยมีปัญหาออกซิเจนในน้ำต่ำตอนกลางคืน ลุงอยากให้เครื่องตีน้ำทำงานเองเมื่อจำเป็น ข้อใดเป็นการออกแบบระบบที่ครบองค์ประกอบที่สุด
  choices:
  - id: a
    text: 'ตัวป้อน: เซนเซอร์วัดออกซิเจนละลายน้ำ กระบวนการ: บอร์ดเทียบค่ากับเกณฑ์ ผลผลิต: เครื่องตีน้ำทำงาน ข้อมูลย้อนกลับ: เซนเซอร์วัดซ้ำและสั่งหยุดเมื่อค่าสูงพอ'
    correct: true
  - id: b
    text: ตั้งเวลาให้เครื่องตีน้ำทำงานทุกคืนตลอดคืน
    feedback: ไม่มีข้อมูลย้อนกลับ ระบบไม่รู้ว่าออกซิเจนพอแล้วหรือยัง และสิ้นเปลืองไฟ
  - id: c
    text: ให้ลุงตื่นมาดูปลาทุกชั่วโมง
    feedback: ไม่ใช่ระบบอัตโนมัติ และเหนื่อยมาก
  - id: d
    text: ติดกล้องถ่ายรูปบ่อปลาไว้ดูตอนเช้า
    feedback: กล้องบันทึกได้แต่ไม่ได้ควบคุมเครื่องตีน้ำ
  hints:
  - ระบบอัตโนมัติต้องวัดค่าและตัดสินใจเอง
  - ข้อมูลย้อนกลับทำให้รู้ว่าเมื่อใดควรหยุด
  solution: ระบบที่ดีมีครบตัวป้อน กระบวนการ ผลผลิต และข้อมูลย้อนกลับ ทำงานเมื่อจำเป็นและหยุดเมื่อเพียงพอ ประหยัดพลังงานและปลาปลอดภัย
  license: CC-BY-SA-4.0
  ai_assisted: true
