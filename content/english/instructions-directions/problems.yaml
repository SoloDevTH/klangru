    stem: "คู่มือหม้อหุงข้าวเขียนว่า *Plug in the rice cooker. Press \"Cook\". Do not open the lid while the rice is cooking. When the light turns green, the rice is ready.* ข้อใดทำถูกต้องตามคู่มือ"
