<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="520" height="250" font-family="sans-serif" font-size="14">
<title>เส้นทางจากห้องเรียนไปห้องสมุดสองเส้น เส้นบนมีบันได เส้นล่างเป็นทางลาด</title>
<rect x="0" y="0" width="520" height="250" fill="#ffffff"/>
<circle cx="60" cy="150" r="12" fill="#2563eb"/><text x="60" y="186" text-anchor="middle" fill="#1f2937">ห้องเรียน</text>
<rect x="440" y="138" width="24" height="24" fill="#16a34a"/><text x="452" y="186" text-anchor="middle" fill="#1f2937">ห้องสมุด</text>
<polyline points="72,150 100,150 100,130 124,130 124,110 148,110 148,90 172,90 172,70 330,70 330,90 354,90 354,110 378,110 378,130 402,130 402,150 440,150" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/>
<text x="250" y="52" text-anchor="middle" fill="#b45309" font-weight="bold">เส้นที่ 1: มีบันได ยาว 120 เมตร</text>
