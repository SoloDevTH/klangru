problems:
  - id: management.project.cpm-pert.p001
    topics: [management.project.cpm-pert]
    difficulty: 1
    type: mcq
    stem: "เส้นทางวิกฤต (critical path) ของโครงการคืออะไร"
    choices:
      - { id: a, text: "เส้นทางที่ใช้เวลารวมมากที่สุด กิจกรรมบนเส้นทางนี้ช้าไม่ได้เลยโดยไม่ทำให้โครงการช้า", correct: true }
      - { id: b, text: "เส้นทางที่มีจำนวนกิจกรรมมากที่สุด", feedback: "นับเวลา ไม่ใช่นับจำนวนกิจกรรม เส้นทางที่มีกิจกรรมน้อยแต่แต่ละกิจกรรมยาวอาจเป็นเส้นทางวิกฤตได้" }
      - { id: c, text: "เส้นทางที่มีกิจกรรมอันตรายที่สุด", feedback: "คำว่าวิกฤตหมายถึงเวลา ไม่ใช่ความอันตรายของงาน" }
      - { id: d, text: "เส้นทางที่ใช้เวลารวมน้อยที่สุด", feedback: "เส้นทางที่สั้นที่สุดมีเวลาลอยตัวมาก โครงการเสร็จได้เมื่อเส้นทางที่ยาวที่สุดเสร็จ" }
    hints:
      - "โครงการเสร็จเมื่อทุกเส้นทางเสร็จ"
      - "เส้นทางใดเสร็จช้าที่สุด"
    solution: "เส้นทางวิกฤตคือเส้นทางที่ยาวที่สุด กำหนดเวลาเสร็จของโครงการ กิจกรรมบนเส้นทางนี้มีเวลาลอยตัวเป็น 0"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.cpm-pert.p002
    topics: [management.project.cpm-pert]
    difficulty: 1
    type: numeric
    stem: "กิจกรรมติดตั้งระบบเสียงในหอประชุม (สมมติ) ประมาณเวลาเร็วสุด 2 วัน น่าจะเป็นที่สุด 5 วัน ช้าสุด 14 วัน เวลาคาดหมายแบบ PERT เป็นกี่วัน"
    answer: { value: 6, unit: วัน }
    hints:
      - "$t_e = \\dfrac{a + 4m + b}{6}$"
      - "ค่าน่าจะเป็นที่สุดมีน้ำหนัก 4"
    misconceptions:
      - { match: 7, feedback: "หาค่าเฉลี่ยธรรมดาของสามค่า PERT ให้น้ำหนักค่าน่าจะเป็นที่สุด 4 เท่า" }
      - { match: 5, feedback: "ใช้ค่าน่าจะเป็นที่สุดอย่างเดียว ไม่ได้คิดผลของค่าช้าสุดที่ยาวมาก" }
    solution: "$t_e = \\dfrac{2 + 4(5) + 14}{6} = \\dfrac{36}{6} = 6$ วัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.cpm-pert.p003
    topics: [management.project.cpm-pert]
    difficulty: 1
    type: mcq
    stem: "ในข่ายงานแบบกิจกรรมบนโหนด (AON) กล่องและลูกศรหมายถึงอะไร"
    choices:
      - { id: a, text: "กล่องคือกิจกรรม ลูกศรคือความสัมพันธ์ว่ากิจกรรมต้นทางต้องเสร็จก่อนจึงเริ่มกิจกรรมปลายทางได้", correct: true }
      - { id: b, text: "กล่องคือเหตุการณ์ ลูกศรคือกิจกรรม", feedback: "นั่นคือข่ายงานแบบกิจกรรมบนลูกศร (AOA) ไม่ใช่ AON" }
      - { id: c, text: "กล่องคือผู้รับผิดชอบ ลูกศรคือการสั่งงาน", feedback: "นั่นคือแผนผังองค์กร ไม่ใช่ข่ายงาน" }
      - { id: d, text: "ความยาวของลูกศรแสดงระยะเวลาของกิจกรรม", feedback: "ใน AON ระยะเวลาเขียนไว้ในกล่อง ความยาวลูกศรไม่มีความหมาย" }
    hints:
      - "AON ย่อมาจาก activity-on-node"
      - "node คือกล่อง"
    solution: "AON วางกิจกรรมไว้บนโหนด (กล่อง) และใช้ลูกศรแสดงลำดับก่อนหลัง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.cpm-pert.p004
    topics: [management.project.cpm-pert]
    difficulty: 2
    type: numeric
    stem: "จากข่ายงานปรับปรุงห้องสมุดในภาพ โครงการใช้เวลาสั้นที่สุดกี่วัน"
    figure:
      src: p-network.svg
      alt: "ข่ายงาน A 4 วัน B 6 วัน เริ่มได้ทันที C 3 วัน หลัง A · D 5 วัน หลัง A และ B · E 7 วัน หลัง C · F 4 วัน หลัง D · G 2 วัน หลัง E และ F"
    answer: { value: 17, unit: วัน }
    hints:
      - "ไล่ทุกเส้นทางจากจุดเริ่มถึง G"
      - "เวลาโครงการคือเส้นทางที่ยาวที่สุด"
    misconceptions:
      - { match: 31, feedback: "บวกเวลาทุกกิจกรรม แต่บางกิจกรรมทำพร้อมกันได้" }
      - { match: 15, feedback: "นั่นคือเส้นทาง A–D–F–G ยังมีเส้นทางที่ยาวกว่า" }
      - { match: 16, feedback: "นั่นคือเส้นทาง A–C–E–G ยังมีเส้นทางที่ยาวกว่า" }
    solution: "A–C–E–G $= 4 + 3 + 7 + 2 = 16$ · A–D–F–G $= 4 + 5 + 4 + 2 = 15$ · B–D–F–G $= 6 + 5 + 4 + 2 = 17$ ยาวที่สุด 17 วัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.cpm-pert.p005
    topics: [management.project.cpm-pert]
    difficulty: 2
    type: mcq
    stem: "จากข่ายงานในภาพ เส้นทางวิกฤตคือเส้นทางใด"
    figure:
      src: p-network.svg
      alt: "ข่ายงาน A 4 วัน B 6 วัน เริ่มได้ทันที C 3 วัน หลัง A · D 5 วัน หลัง A และ B · E 7 วัน หลัง C · F 4 วัน หลัง D · G 2 วัน หลัง E และ F"
    choices:
      - { id: a, text: "B–D–F–G", correct: true }
      - { id: b, text: "A–C–E–G", feedback: "ยาว 16 วัน สั้นกว่า B–D–F–G หนึ่งวัน จึงมีเวลาลอยตัว 1 วัน" }
      - { id: c, text: "A–D–F–G", feedback: "ยาว 15 วัน" }
      - { id: d, text: "A–C–E–F–G", feedback: "E กับ F ไม่ได้ต่อกัน ไม่มีเส้นทางนี้ในข่ายงาน" }
    hints:
      - "หาเวลารวมของทุกเส้นทาง"
      - "เส้นทางวิกฤตคือเส้นทางที่ยาวที่สุด"
    solution: "B–D–F–G ยาว 17 วัน มากที่สุด จึงเป็นเส้นทางวิกฤต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.cpm-pert.p006
    topics: [management.project.cpm-pert]
    difficulty: 2
    type: numeric
    stem: "จากข่ายงานในภาพ กิจกรรม A มีเวลาลอยตัวรวมกี่วัน"
    figure:
      src: p-network.svg
      alt: "ข่ายงาน A 4 วัน B 6 วัน เริ่มได้ทันที C 3 วัน หลัง A · D 5 วัน หลัง A และ B · E 7 วัน หลัง C · F 4 วัน หลัง D · G 2 วัน หลัง E และ F"
    answer: { value: 1, unit: วัน }
    hints:
      - "$ES_A = 0$ หา $LS_A$ จากการถอยหลัง"
      - "A มีกิจกรรมถัดไปสองตัว C และ D ให้ใช้ LS ที่น้อยกว่าเป็น LF ของ A"
    misconceptions:
      - { match: 2, feedback: "ดูแค่ว่า A สั้นกว่า B 2 วัน แต่ A ยังต้องส่งต่อให้ C และ E ซึ่งยาวด้วย ต้องถอยหลังจากทุกกิจกรรมถัดไป" }
      - { match: 0, feedback: "A ไม่อยู่บนเส้นทางวิกฤต B–D–F–G จึงมีเวลาลอยตัว" }
    solution: "ถอยหลัง $LS_G = 15$, $LS_F = 11$, $LS_D = 6$, $LS_E = 8$, $LS_C = 5$ ดังนั้น $LF_A = \\min(5, 6) = 5$, $LS_A = 1$ ลอยรวม $1 - 0 = 1$ วัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.cpm-pert.p007
    topics: [management.project.cpm-pert]
    difficulty: 3
    type: numeric
    stem: "จากข่ายงานในภาพ กิจกรรม E มีเวลาลอยตัว **อิสระ** (free float) กี่วัน"
    figure:
      src: p-network.svg
      alt: "ข่ายงาน A 4 วัน B 6 วัน เริ่มได้ทันที C 3 วัน หลัง A · D 5 วัน หลัง A และ B · E 7 วัน หลัง C · F 4 วัน หลัง D · G 2 วัน หลัง E และ F"
    answer: { value: 1, unit: วัน }
    hints:
      - "เวลาลอยตัวอิสระ = ES ของกิจกรรมถัดไป − EF ของกิจกรรมนี้"
      - "หา $EF_E$ และ $ES_G$ จากการเดินหน้า"
    misconceptions:
      - { match: 0, feedback: "E ไม่อยู่บนเส้นทางวิกฤต และ G ต้องรอ F จนถึงวันที่ 15 ซึ่งหลัง E เสร็จ" }
      - { match: 3, feedback: "ใช้ $EF_E = 12$ ผิด อย่าลืมว่า E เริ่มหลัง C ซึ่งเริ่มหลัง A" }
    solution: "$EF_A = 4$, $EF_C = 7$, $EF_E = 14$ ส่วน $EF_F = 15$ ดังนั้น $ES_G = \\max(14, 15) = 15$ เวลาลอยตัวอิสระของ E $= 15 - 14 = 1$ วัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.cpm-pert.p008
    topics: [management.project.cpm-pert]
    difficulty: 3
    type: numeric
    stem: "กิจกรรมเทพื้นหอประชุม (สมมติ) ประมาณเวลาเร็วสุด 3 วัน ช้าสุด 15 วัน ความแปรปรวนของเวลาแบบ PERT เป็นกี่ตารางวัน"
    answer: { value: 4, unit: ตารางวัน }
    hints:
      - "$\\sigma = \\dfrac{b - a}{6}$"
      - "ความแปรปรวน = $\\sigma^2$"
    misconceptions:
      - { match: 2, feedback: "นั่นคือส่วนเบี่ยงเบนมาตรฐาน ยังไม่ได้ยกกำลังสอง" }
      - { match: 144, feedback: "ยกกำลังสองของ $b - a$ โดยไม่หาร 6 ก่อน" }
    solution: "$\\sigma = (15 - 3) \\div 6 = 2$ วัน ความแปรปรวน $2^2 = 4$ ตารางวัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.cpm-pert.p009
    topics: [management.project.cpm-pert]
    difficulty: 3
    type: numeric
    stem: "โครงการหอประชุมงบ 4,000,000 บาท ณ สิ้นเดือนที่ 3 ตามแผนควรเสร็จงานมูลค่า (PV) 1,800,000 บาท งานที่เสร็จจริงมีมูลค่า (EV) 1,500,000 บาท และจ่ายเงินจริง (AC) 1,700,000 บาท ดัชนีผลงานด้านกำหนดการ (SPI) เป็นเท่าไร"
    answer: { value: 0.833, tolerance: 0.005 }
    hints:
      - "SPI = EV ÷ PV"
      - "น้อยกว่า 1 แปลว่าช้ากว่าแผน"
    misconceptions:
      - { match: 1.2, feedback: "หารกลับด้าน (PV ÷ EV)" }
      - { match: 0.882, feedback: "นั่นคือ CPI (EV ÷ AC) โจทย์ถาม SPI" }
      - { match: 1.059, feedback: "ใช้ AC ÷ EV... ไม่ใช่ทั้ง SPI และ CPI SPI ใช้ EV ÷ PV" }
    solution: "$SPI = 1{,}500{,}000 \\div 1{,}800{,}000 \\approx 0.833$ งานช้ากว่าแผน ทำได้ราว 83% ของที่ควรทำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.cpm-pert.p010
    topics: [management.project.cpm-pert]
    difficulty: 3
    type: numeric
    stem: "จากข้อมูลโครงการหอประชุม (PV 1,800,000 EV 1,500,000 AC 1,700,000 บาท) ผลต่างด้านต้นทุน (CV) เป็นกี่บาท"
    answer: { value: -200000, unit: บาท }
    hints:
      - "CV = EV − AC"
      - "ค่าติดลบแปลว่าใช้เงินเกินมูลค่างานที่ได้"
    misconceptions:
      - { match: 200000, feedback: "ลบกลับด้าน CV = EV − AC" }
      - { match: -300000, feedback: "นั่นคือ SV (EV − PV) โจทย์ถามด้านต้นทุน" }
      - { match: -100000, feedback: "ใช้ AC − PV ซึ่งไม่ใช่ตัวชี้วัดของมูลค่าที่ได้ ต้องเทียบกับ EV" }
    solution: "$CV = 1{,}500{,}000 - 1{,}700{,}000 = -200{,}000$ บาท ใช้เงินเกินมูลค่างานที่ทำได้ 200,000 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.cpm-pert.p011
    topics: [management.project.cpm-pert]
    difficulty: 3
    type: mcq
    stem: "โครงการติดตั้งแผงโซลาร์บนหลังคาโรงพยาบาล (สมมติ) มี SPI = 1.10 และ CPI = 0.85 แปลว่าอย่างไร"
    choices:
      - { id: a, text: "งานเร็วกว่าแผน แต่ใช้เงินเกินมูลค่างานที่ได้", correct: true }
      - { id: b, text: "งานช้ากว่าแผน และใช้เงินเกิน", feedback: "SPI มากกว่า 1 แปลว่าเร็วกว่าแผน" }
      - { id: c, text: "งานเร็วกว่าแผน และประหยัดเงิน", feedback: "CPI น้อยกว่า 1 แปลว่าใช้เงินมากกว่ามูลค่างานที่ได้" }
      - { id: d, text: "งานช้ากว่าแผน แต่ประหยัดเงิน", feedback: "อ่านความหมายของดัชนีกลับด้านทั้งสองตัว" }
    hints:
      - "SPI = EV ÷ PV, CPI = EV ÷ AC"
      - "ดัชนีมากกว่า 1 ดีกว่าแผน น้อยกว่า 1 แย่กว่าแผน"
    solution: "SPI 1.10 เร็วกว่าแผน CPI 0.85 ได้งาน 0.85 บาทต่อเงินที่จ่าย 1 บาท อาจเป็นเพราะจ่ายค่าล่วงเวลาเพื่อเร่งงาน ควรตรวจสาเหตุ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.cpm-pert.p012
    topics: [management.project.cpm-pert]
    difficulty: 4
    type: numeric
    stem: "เส้นทางวิกฤตของงานซ่อมสะพานไม้ในหมู่บ้าน (สมมติ) มีสามกิจกรรม ค่า (a, m, b) เป็นวัน (2, 4, 6), (5, 7, 15), (3, 6, 9) กิจกรรมเป็นอิสระกัน โอกาสที่จะเสร็จภายใน 20 วันเป็นกี่เปอร์เซ็นต์"
    answer: { value: 83.5, unit: "%", tolerance: 0.5 }
    hints:
      - "หา $t_e$ และ $\\sigma^2$ ของแต่ละกิจกรรม แล้วรวม"
      - "$z = (20 - T_e) \\div \\sigma_T$ แล้วเปิดตารางปกติมาตรฐาน"
    misconceptions:
      - { match: 72.57, feedback: "บวกส่วนเบี่ยงเบนมาตรฐานของแต่ละกิจกรรม ต้องบวกความแปรปรวนแล้วถอดราก" }
      - { match: 92.79, feedback: "ใช้ผลรวมของค่า m (17 วัน) เป็นค่าเฉลี่ย ต้องใช้ผลรวมของ $t_e$" }
    solution: "$t_e = 4, 8, 6$ รวม $18$ วัน $\\sigma^2 = 0.444 + 2.778 + 1 = 4.222$ $\\sigma_T \\approx 2.055$ $z = (20 - 18) \\div 2.055 \\approx 0.97$ $P \\approx 0.835$ หรือราว 83.5%"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.cpm-pert.p013
    topics: [management.project.cpm-pert]
    difficulty: 4
    type: numeric
    stem: "จากข้อมูลโครงการหอประชุม (BAC 4,000,000 EV 1,500,000 AC 1,700,000 บาท) ถ้าประสิทธิภาพด้านต้นทุนจะเป็นอย่างนี้ไปจนจบ ต้นทุนเมื่อเสร็จ (EAC) ประมาณกี่บาท"
    answer: { value: 4533333, unit: บาท, tolerance: 500 }
    hints:
      - "CPI = EV ÷ AC"
      - "EAC = BAC ÷ CPI"
    misconceptions:
      - { match: 4200000, feedback: "บวกเฉพาะส่วนที่เกินแล้ว (AC − EV) ซึ่งใช้เมื่อคาดว่างานที่เหลือจะเป็นไปตามแผน โจทย์บอกว่าประสิทธิภาพจะเป็นอย่างนี้ต่อไป" }
      - { match: 3529412, feedback: "คูณ BAC ด้วย CPI ต้องหารด้วย CPI" }
    solution: "$CPI = 1{,}500{,}000 \\div 1{,}700{,}000 \\approx 0.882$ $EAC = 4{,}000{,}000 \\div 0.882 \\approx 4{,}533{,}333$ บาท เกินงบราว 533,333 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.project.cpm-pert.p014
    topics: [management.project.cpm-pert]
    difficulty: 3
    type: numeric
    stem: "กิจกรรมก่อผนังหอประชุม (สมมติ) เวลาปกติ 8 วัน ต้นทุน 40,000 บาท ถ้าเร่งสุดเหลือ 5 วัน ต้นทุน 61,000 บาท ต้นทุนเร่งต่อวันเป็นกี่บาท"
    answer: { value: 7000, unit: บาทต่อวัน }
    hints:
      - "ต้นทุนที่เพิ่ม ÷ วันที่ลดได้"
