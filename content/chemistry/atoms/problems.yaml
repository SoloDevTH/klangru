  - id: chem.atom.p018
    topics: [chemistry.matter.atoms]
    difficulty: 3
    type: expression
    stem: "ไอออนของธาตุที่มีเลขอะตอม $Z$ มีประจุ $q$ (เช่น $q = 2$ สำหรับไอออน $2+$ และ $q = -1$ สำหรับไอออน $1-$) เขียนจำนวนอิเล็กตรอนของไอออนนี้ในรูปของ $Z$ และ $q$"
    prefix: "จำนวนอิเล็กตรอน ="
    answer: { latex: "Z-q", variables: [Z, q] }
    hints:
      - "อะตอมที่เป็นกลางมีอิเล็กตรอนเท่ากับ $Z$"
      - "ประจุบวกเกิดจากการเสียอิเล็กตรอน ส่วนประจุลบเกิดจากการรับอิเล็กตรอน ลองตรวจสูตรด้วย $\\mathrm{Mg^{2+}}$ ($Z = 12$ มีอิเล็กตรอน 10 ตัว)"
    misconceptions:
      - { match: "Z+q", feedback: "ลองแทน $\\mathrm{Mg^{2+}}$: $12 + 2 = 14$ แต่จริง ๆ มี 10 ตัว ประจุบวกแปลว่าอิเล็กตรอน **น้อยกว่า** โปรตอน" }
      - { match: "q-Z", feedback: "ได้ค่าติดลบเมื่อแทน $Z = 12$, $q = 2$ จำนวนอิเล็กตรอนติดลบไม่ได้ เริ่มจาก $Z$ แล้วลบประจุออก" }
    solution: "ประจุ $=$ จำนวนโปรตอน $-$ จำนวนอิเล็กตรอน หรือ $q = Z - n_e$ จึงได้ $n_e = Z - q$ ตรวจ: $\\mathrm{Mg^{2+}}$ ได้ $12 - 2 = 10$ และ $\\mathrm{Cl^-}$ ได้ $17 - (-1) = 18$"
    license: CC-BY-SA-4.0
    ai_assisted: true

