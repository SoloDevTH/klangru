problems:
  - id: earthscience.astronomy.seasons-moon-tides.p001
    topics: [earthscience.astronomy.seasons-moon-tides]
    difficulty: 1
    type: mcq
    stem: "สาเหตุหลักที่ทำให้โลกมีฤดูกาลคือข้อใด"
    choices:
      - { id: a, text: "แกนโลกเอียง ทำให้มุมของแสงอาทิตย์และความยาวกลางวันเปลี่ยนไปตลอดปี", correct: true }
      - { id: b, text: "โลกอยู่ใกล้ดวงอาทิตย์ในฤดูร้อนและอยู่ไกลในฤดูหนาว", feedback: "โลกอยู่ใกล้ดวงอาทิตย์ที่สุดราวต้นเดือนมกราคม ซึ่งเป็นฤดูหนาวของซีกโลกเหนือ" }
      - { id: c, text: "ดวงอาทิตย์ร้อนขึ้นและเย็นลงเป็นรอบปี", feedback: "พลังงานที่ดวงอาทิตย์ปล่อยออกมาแทบคงที่ตลอดปี" }
      - { id: d, text: "ดวงจันทร์บังแสงอาทิตย์บางช่วงของปี", feedback: "ดวงจันทร์บังดวงอาทิตย์เพียงไม่กี่นาทีตอนสุริยุปราคา ไม่ทำให้เกิดฤดู" }
    hints:
      - "ซีกโลกเหนือกับซีกโลกใต้มีฤดูตรงข้ามกัน"
      - "ถ้าฤดูเกิดจากระยะทาง ทั้งโลกจะร้อนพร้อมกัน"
    solution: "แกนโลกเอียง 23.44° และชี้ทิศเดิมตลอดปี ซีกโลกที่เอียงเข้าหาดวงอาทิตย์ได้แสงตั้งฉากกว่าและกลางวันยาวกว่า จึงเป็นฤดูร้อน ขณะที่อีกซีกเป็นฤดูหนาว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.seasons-moon-tides.p002
    topics: [earthscience.astronomy.seasons-moon-tides]
    difficulty: 1
    type: match
    stem: "จับคู่รูปร่างของดวงจันทร์กับเวลาที่ดวงจันทร์ขึ้นโดยประมาณ"
    pairs:
      - { left: "เดือนดับ", right: "ราว 06.00 น. พร้อมดวงอาทิตย์" }
      - { left: "ขึ้น 8 ค่ำ", right: "ราว 12.00 น." }
      - { left: "วันเพ็ญ", right: "ราว 18.00 น. ตอนดวงอาทิตย์ตก" }
      - { left: "แรม 8 ค่ำ", right: "ราวเที่ยงคืน" }
    hints:
      - "วันเพ็ญดวงจันทร์อยู่ตรงข้ามดวงอาทิตย์"
      - "ดวงจันทร์ขึ้นช้าลงวันละราว 50 นาที ผ่านไป 7 วันช้าลงราว 6 ชั่วโมง"
    solution: "เดือนดับขึ้นพร้อมดวงอาทิตย์ราว 06.00 น. ขึ้น 8 ค่ำราวเที่ยง วันเพ็ญราว 18.00 น. และแรม 8 ค่ำราวเที่ยงคืน แต่ละช่วงห่างกันราว 7 วันและ 6 ชั่วโมง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.seasons-moon-tides.p003
    topics: [earthscience.astronomy.seasons-moon-tides]
    difficulty: 1
    type: mcq
    stem: "ชาวประมงในจังหวัดสมุทรสงครามรู้ว่าน้ำขึ้นสูงมากและลงต่ำมาก (น้ำเกิด) ในบางวัน วันใดเป็นวันน้ำเกิด"
    choices:
      - { id: a, text: "วันเพ็ญและวันเดือนดับ", correct: true }
      - { id: b, text: "เฉพาะวันเพ็ญ", feedback: "วันเดือนดับก็เป็นน้ำเกิด เพราะดวงอาทิตย์ โลก ดวงจันทร์อยู่แนวเดียวกันเช่นกัน" }
      - { id: c, text: "ขึ้น 8 ค่ำและแรม 8 ค่ำ", feedback: "วันนั้นดวงอาทิตย์กับดวงจันทร์ทำมุมฉากกัน ผลหักล้างกัน เป็นน้ำตาย" }
      - { id: d, text: "ทุกวันอาทิตย์", feedback: "น้ำขึ้นน้ำลงขึ้นกับตำแหน่งของดวงจันทร์และดวงอาทิตย์ ไม่เกี่ยวกับวันในสัปดาห์" }
    hints:
      - "น้ำเกิดเมื่อแรงจากดวงอาทิตย์และดวงจันทร์เสริมกัน"
      - "สามดวงอยู่แนวเดียวกันตรงกับรูปร่างดวงจันทร์แบบใด"
    solution: "วันเพ็ญและวันเดือนดับ ดวงอาทิตย์ โลก และดวงจันทร์อยู่แนวเดียวกัน ผลของทั้งสองเสริมกัน จึงเป็นน้ำเกิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.seasons-moon-tides.p004
    topics: [earthscience.astronomy.seasons-moon-tides]
    difficulty: 2
    type: numeric
    stem: "กรุงเทพฯ อยู่ละติจูด 13.75° เหนือ ราว 20 มีนาคม (เดคลิเนชันของดวงอาทิตย์ 0°) ดวงอาทิตย์ตอนเที่ยงมีมุมเงยกี่องศา"
    answer: { value: 76.25, tolerance: 0.1, unit: องศา }
    misconceptions:
      - { match: 13.75, feedback: "13.75° คือมุมที่ดวงอาทิตย์ห่างจากจุดเหนือศีรษะ ไม่ใช่มุมจากขอบฟ้า ต้องนำ 90 ลบ" }
      - { match: 103.75, feedback: "บวกละติจูดเข้ากับ 90 มุมเงยต้องไม่เกิน 90°" }
    hints:
      - "มุมเงยตอนเที่ยง $= 90^\\circ - \\lvert \\text{ละติจูด} - \\text{เดคลิเนชัน} \\rvert$"
      - "$90 - \\lvert 13.75 - 0 \\rvert$"
    solution: "$90^\\circ - \\lvert 13.75 - 0 \\rvert = 76.25^\\circ$ ดวงอาทิตย์อยู่ทางทิศใต้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.seasons-moon-tides.p005
    topics: [earthscience.astronomy.seasons-moon-tides]
    difficulty: 2
    type: mcq
    stem: "ราว 21 มิถุนายน ตอนเที่ยงที่กรุงเทพฯ (ละติจูด 13.75° เหนือ) ดวงอาทิตย์อยู่ทางใด และเงาของเสาชี้ไปทางใด"
    choices:
      - { id: a, text: "ดวงอาทิตย์ค่อนไปทางทิศเหนือเล็กน้อย เงาชี้ไปทางทิศใต้", correct: true }
      - { id: b, text: "ดวงอาทิตย์อยู่ทางทิศใต้ เงาชี้ไปทางทิศเหนือ", feedback: "เป็นจริงในเดือนธันวาคม แต่ 21 มิถุนายน ดวงอาทิตย์อยู่ตรงศีรษะที่ละติจูด 23.44° เหนือ ซึ่งอยู่เหนือกรุงเทพฯ" }
      - { id: c, text: "ดวงอาทิตย์อยู่ตรงศีรษะพอดี ไม่มีเงา", feedback: "ดวงอาทิตย์ตรงศีรษะกรุงเทพฯ ราวปลายเมษายนและกลางสิงหาคม ไม่ใช่ 21 มิถุนายน" }
      - { id: d, text: "ดวงอาทิตย์อยู่ทางทิศตะวันออก เงาชี้ไปทางทิศตะวันตก", feedback: "ตอนเที่ยงดวงอาทิตย์อยู่สูงที่สุดในแนวเหนือ–ใต้ ไม่ใช่ทางทิศตะวันออก" }
    hints:
      - "21 มิถุนายน ดวงอาทิตย์อยู่ตรงศีรษะที่ละติจูด 23.44° เหนือ"
      - "เงาชี้ไปทางตรงข้ามกับดวงอาทิตย์"
    solution: "เดคลิเนชัน 23.44° มากกว่าละติจูด 13.75° ดวงอาทิตย์จึงอยู่ทางทิศเหนือเล็กน้อย มุมเงย $90 - 9.69 = 80.31^\\circ$ เงาสั้น ๆ ชี้ไปทางทิศใต้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.seasons-moon-tides.p006
    topics: [earthscience.astronomy.seasons-moon-tides]
    difficulty: 2
    type: numeric
    stem: "คืนนี้ดวงจันทร์ขึ้นเวลา 19.10 น. ถ้าดวงจันทร์ขึ้นช้าลงวันละราว 50 นาที อีก 3 วัน ดวงจันทร์จะขึ้นช้ากว่าคืนนี้ประมาณกี่นาที"
    answer: { value: 150, tolerance: 1, unit: นาที }
    misconceptions:
      - { match: 50, feedback: "50 นาทีคือช้าลงใน 1 วัน ผ่านไป 3 วันต้องคูณ 3" }
      - { match: 16.7, feedback: "นำ 50 หารด้วย 3 แต่ช้าลงสะสมทุกวัน ต้องคูณ" }
    hints:
      - "ช้าลงวันละ 50 นาที"
      - "$50 \\times 3$"
    solution: "$50 \\times 3 = 150$ นาที หรือ 2 ชั่วโมง 30 นาที ดวงจันทร์จะขึ้นราว 21.40 น."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.seasons-moon-tides.p007
    topics: [earthscience.astronomy.seasons-moon-tides]
    difficulty: 2
    type: order
    stem: "เริ่มจากวันเดือนดับ เรียงลักษณะน้ำขึ้นน้ำลงที่เกิดตามลำดับในหนึ่งเดือนจันทรคติ"
    items:
      - "วันเดือนดับ: น้ำเกิด"
      - "ขึ้น 8 ค่ำ: น้ำตาย"
      - "วันเพ็ญ: น้ำเกิด"
      - "แรม 8 ค่ำ: น้ำตาย"
    hints:
      - "หลังวันเดือนดับคือข้างขึ้น"
      - "น้ำเกิดและน้ำตายสลับกันทุกราว 7 วัน"
    solution: "เดือนดับ (น้ำเกิด) → ขึ้น 8 ค่ำ (น้ำตาย) → วันเพ็ญ (น้ำเกิด) → แรม 8 ค่ำ (น้ำตาย) แล้ววนกลับเป็นเดือนดับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.seasons-moon-tides.p008
    topics: [earthscience.astronomy.seasons-moon-tides]
    difficulty: 3
    type: numeric
    stem: "เชียงใหม่อยู่ละติจูดราว 18.79° เหนือ ราว 21 ธันวาคม (เดคลิเนชัน −23.44°) ดวงอาทิตย์ตอนเที่ยงมีมุมเงยกี่องศา"
    answer: { value: 47.77, tolerance: 0.1, unit: องศา }
    misconceptions:
      - { match: 85.35, feedback: "ใช้ผลต่าง $18.79 - 23.44$ แต่เดคลิเนชันเป็นลบ ต้องเป็น $18.79 - (-23.44) = 42.23$" }
      - { match: 42.23, feedback: "42.23° คือมุมจากจุดเหนือศีรษะ ต้องนำ 90 ลบอีกครั้ง" }
    hints:
      - "$\\lvert 18.79 - (-23.44) \\rvert = 18.79 + 23.44$"
      - "มุมเงย $= 90 - $ ผลต่างนั้น"
    solution: "$\\lvert 18.79 - (-23.44) \\rvert = 42.23^\\circ$ มุมเงย $= 90 - 42.23 = 47.77^\\circ$ ต่ำกว่ากรุงเทพฯ (52.81°) แสงตกเฉียงกว่า เชียงใหม่ในเดือนธันวาคมจึงหนาวกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.seasons-moon-tides.p009
    topics: [earthscience.astronomy.seasons-moon-tides]
    difficulty: 3
    type: numeric
    stem: "รอบของน้ำขึ้นน้ำลงตามดวงจันทร์ยาว 24 ชั่วโมง 50 นาที ที่ชายฝั่งที่มีน้ำขึ้นวันละสองครั้ง น้ำขึ้นสูงสุดสองครั้งที่ติดกันห่างกันกี่ชั่วโมง (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 12.42, tolerance: 0.02, unit: ชั่วโมง }
    misconceptions:
      - { match: 12, feedback: "คิดว่ารอบยาว 24 ชั่วโมงพอดี แต่ดวงจันทร์ขึ้นช้าลงวันละราว 50 นาที รอบจึงยาว 24 ชั่วโมง 50 นาที" }
      - { match: 12.25, feedback: "นำ 24.50 หารด้วย 2 แต่ 50 นาทีไม่ใช่ 0.50 ชั่วโมง ต้องแปลงเป็น 50/60 ≈ 0.83 ชั่วโมง" }
    hints:
      - "แปลง 24 ชั่วโมง 50 นาทีเป็นชั่วโมง: $24 + 50/60$"
      - "มีน้ำขึ้นสองครั้งในหนึ่งรอบ จึงหารด้วย 2"
    solution: "$24 + \\dfrac{50}{60} = 24.83$ ชั่วโมง หารด้วย 2 ได้ $\\approx 12.42$ ชั่วโมง หรือราว 12 ชั่วโมง 25 นาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.seasons-moon-tides.p010
    topics: [earthscience.astronomy.seasons-moon-tides]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "เดือนธันวาคม ครอบครัวหนึ่งเดินทางจากกรุงเทพฯ ไปเที่ยวซิดนีย์ ประเทศออสเตรเลีย (ละติจูดราว 34° ใต้) จะพบสิ่งใด (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ซิดนีย์เป็นฤดูร้อน", correct: true }
      - { id: b, text: "กลางวันที่ซิดนีย์ยาวกว่ากลางคืน", correct: true }
      - { id: c, text: "ตอนเที่ยงที่ซิดนีย์ ดวงอาทิตย์อยู่สูงกว่าตอนเที่ยงที่กรุงเทพฯ ในวันเดียวกัน", correct: true }
      - { id: d, text: "ซิดนีย์เป็นฤดูหนาวเหมือนประเทศในซีกโลกเหนือ", feedback: "ซีกโลกใต้มีฤดูตรงข้ามกับซีกโลกเหนือ เดือนธันวาคมซีกโลกใต้เอียงเข้าหาดวงอาทิตย์" }
      - { id: e, text: "ซิดนีย์อยู่ใกล้ดวงอาทิตย์กว่ากรุงเทพฯ มาก จึงร้อน", feedback: "ระยะจากสองเมืองถึงดวงอาทิตย์แทบไม่ต่างกัน ความร้อนมาจากมุมแสงและความยาวกลางวัน" }
    hints:
      - "เดือนธันวาคม ซีกโลกใดเอียงเข้าหาดวงอาทิตย์"
      - "ใช้สูตรมุมเงย ซิดนีย์ $\\varphi = -34^\\circ$ เดคลิเนชัน $-23.44^\\circ$"
    solution: "เดือนธันวาคมซีกโลกใต้เอียงเข้าหาดวงอาทิตย์ ซิดนีย์เป็นฤดูร้อน กลางวันยาว (ราว 14 ชั่วโมง) มุมเงยตอนเที่ยง $90 - \\lvert -34 + 23.44 \\rvert \\approx 79.4^\\circ$ สูงกว่ากรุงเทพฯ ที่ $52.81^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.seasons-moon-tides.p011
    topics: [earthscience.astronomy.seasons-moon-tides]
    difficulty: 3
    type: numeric
    stem: "กราฟแสดงระดับน้ำทะเลที่ท่าเรือแห่งหนึ่งตลอด 2 วัน (ข้อมูลสมมติ) ผลต่างระหว่างระดับน้ำขึ้นสูงสุดกับน้ำลงต่ำสุดเท่ากับกี่เมตร"
    figure: { src: p-tide-graph.svg, alt: "กราฟเส้นระดับน้ำทะเลเป็นเมตร แกนนอนคือเวลา 2 วัน กราฟขึ้นลงเป็นคลื่นสม่ำเสมอ วันละสองรอบ จุดสูงสุดทุกครั้งอยู่ที่ระดับ 3.2 m จุดต่ำสุดทุกครั้งอยู่ที่ระดับ 0.4 m น้ำขึ้นสูงสุดครั้งแรกราว 05.00 น. ของวันที่ 1 และครั้งต่อ ๆ ไปห่างกันราว 12 ชั่วโมงครึ่ง" }
    answer: { value: 2.8, tolerance: 0.05, unit: m }
    misconceptions:
      - { match: 3.6, feedback: "บวกระดับสูงสุดกับต่ำสุด ผลต่างต้องนำมาลบกัน" }
      - { match: 1.4, feedback: "1.4 m คือครึ่งหนึ่งของผลต่าง วัดจากระดับเฉลี่ย โจทย์ถามจากน้ำลงต่ำสุดถึงน้ำขึ้นสูงสุด" }
    hints:
      - "อ่านค่าสูงสุดและต่ำสุดจากแกนตั้ง"
      - "ผลต่าง $=$ สูงสุด $-$ ต่ำสุด"
    solution: "น้ำขึ้นสูงสุด 3.2 m น้ำลงต่ำสุด 0.4 m ผลต่าง $= 3.2 - 0.4 = 2.8$ m กราฟยังแสดงว่ามีน้ำขึ้นวันละสองครั้ง และเวลาน้ำขึ้นเลื่อนช้าลงในวันที่สอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.seasons-moon-tides.p012
