  - id: biology.animals.behaviour.p014
    topics: [biology.animals.behaviour]
    difficulty: 4
    type: numeric
    stem: "(แบบจำลองอย่างง่าย) นกแต่ละตัวที่หากินบนพื้นเงยหน้าเห็นเหยี่ยวที่บินเข้ามาด้วยโอกาส 0.3 โดยแต่ละตัวเป็นอิสระต่อกัน ถ้าหากินเป็นฝูง 5 ตัว โอกาสที่มีนกอย่างน้อย 1 ตัวเห็นเหยี่ยวเป็นร้อยละเท่าใด (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 83.2, tolerance: 0.5, unit: "%" }
    misconceptions:
      - { match: 150, feedback: "บวกโอกาส 5 ครั้งไม่ได้ ความน่าจะเป็นเกิน 100% ไม่ได้" }
      - { match: 0.2, feedback: "0.24% คือโอกาสที่ทั้ง 5 ตัวเห็นพร้อมกัน ไม่ใช่อย่างน้อย 1 ตัว" }
      - { match: 16.8, feedback: "16.8% คือโอกาสที่ไม่มีตัวใดเห็นเลย ต้องนำไปลบออกจาก 100%" }
    hints:
      - "โอกาสที่นกตัวหนึ่งไม่เห็นคือ 0.7"
      - "อย่างน้อย 1 ตัวเห็น = 1 − (ไม่มีตัวใดเห็นเลย)"
    solution: "โอกาสที่ไม่มีใครเห็น $0.7^5 \\approx 0.168$ จึงได้ $1 - 0.168 = 0.832$ หรือร้อยละ 83.2 เทียบกับ 30% เมื่ออยู่ตัวเดียว การอยู่เป็นกลุ่มจึงช่วยให้รู้ตัวก่อนถูกล่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.behaviour.p015
    topics: [biology.animals.behaviour]
    difficulty: 4
    type: mcq
    stem: "(สถานการณ์สมมติ) นักวิจัยพบว่าฝูงช้างที่นำโดยแม่ช้างอายุมากกว่า 50 ปี ตอบสนองต่อเสียงสิงโตตัวผู้ด้วยการรวมกลุ่มปกป้องลูกได้ถูกต้องบ่อยกว่าฝูงที่นำโดยแม่ช้างอายุน้อย และลูกช้างในฝูงแรกรอดชีวิตมากกว่า หลักฐานนี้สนับสนุนข้อสรุปใดมากที่สุด"
    choices:
      - { id: a, text: "ประสบการณ์ของผู้นำฝูงเพิ่มโอกาสรอดของสมาชิก การอยู่เป็นกลุ่มที่มีผู้นำมีประสบการณ์จึงเป็นประโยชน์", correct: true }
      - { id: b, text: "ช้างทุกตัวรู้วิธีป้องกันสิงโตตั้งแต่เกิดเท่ากัน", feedback: "ข้อมูลแสดงว่าฝูงที่ผู้นำอายุต่างกันตอบสนองต่างกัน แสดงว่ามีการเรียนรู้" }
      - { id: c, text: "การอยู่เป็นกลุ่มไม่มีต้นทุนใด ๆ", feedback: "หลักฐานนี้ไม่ได้วัดต้นทุน และการอยู่เป็นกลุ่มมีต้นทุน เช่น การแบ่งอาหาร" }
      - { id: d, text: "ช้างอายุน้อยไม่ควรอยู่ในฝูง", feedback: "ข้อมูลไม่ได้สนับสนุนข้อนี้ ลูกช้างในฝูงยังได้รับการปกป้อง" }
    hints:
