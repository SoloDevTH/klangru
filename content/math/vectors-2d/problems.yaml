problems:
  - id: math.vec.p001
    topics: [math.geometry.vectors]
    difficulty: 1
    type: numeric
    stem: "เวกเตอร์ $\\vec{v} = \\begin{pmatrix} -5 \\\\ 12 \\end{pmatrix}$ มีขนาดเท่าใด"
    answer: { value: 13 }
    hints:
      - "ขนาดของเวกเตอร์คือความยาวของลูกศร ซึ่งเป็นด้านตรงข้ามมุมฉาก"
      - "ใช้ $|\\vec{v}| = \\sqrt{x^2 + y^2}$ ระวังว่า $(-5)^2$ เป็นบวก"
    misconceptions:
      - { match: 7, feedback: "นำองค์ประกอบมาบวกกันตรง ๆ ขนาดต้องใช้ทฤษฎีบทพีทาโกรัส $\\sqrt{x^2 + y^2}$" }
      - { match: 169, feedback: "นั่นคือ $x^2 + y^2$ ยังต้องถอดรากที่สองอีกครั้ง" }
    solution: "$|\\vec{v}| = \\sqrt{(-5)^2 + 12^2} = \\sqrt{25 + 144} = \\sqrt{169} = 13$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.vec.p002
    topics: [math.geometry.vectors]
    difficulty: 1
    type: mcq
    stem: "ให้ $\\vec{u} = (2, 5)$ และ $\\vec{v} = (3, -1)$ ข้อใดคือ $\\vec{u} + \\vec{v}$"
    choices:
      - { id: a, text: "$(5, 4)$", correct: true }
      - { id: b, text: "$(6, -5)$", feedback: "นั่นคือการคูณองค์ประกอบ การบวกเวกเตอร์ต้องบวกทีละองค์ประกอบ" }
      - { id: c, text: "$(-1, 6)$", feedback: "นั่นคือ $\\vec{u} - \\vec{v}$ โจทย์ให้บวก" }
      - { id: d, text: "$(5, 6)$", feedback: "เครื่องหมายลบของ $-1$ หายไป องค์ประกอบ y คือ $5 + (-1) = 4$" }
    hints:
      - "บวกองค์ประกอบ x กับองค์ประกอบ x และ y กับ y"
      - "องค์ประกอบ y คือ $5 + (-1)$"
    solution: "$\\vec{u} + \\vec{v} = (2 + 3,\\ 5 + (-1)) = (5, 4)$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.vec.p003
    topics: [math.geometry.vectors]
    difficulty: 2
    type: numeric
    stem: "ให้ $\\vec{a} = (4, -2)$ และ $\\vec{b} = (1, 3)$ องค์ประกอบในแนวแกน y ของ $\\vec{a} - \\vec{b}$ เท่ากับเท่าใด"
    answer: { value: -5 }
    hints:
      - "ลบทีละองค์ประกอบ: องค์ประกอบ y ของ $\\vec{a}$ ลบด้วยองค์ประกอบ y ของ $\\vec{b}$"
      - "คำนวณ $-2 - 3$ บนเส้นจำนวน"
    misconceptions:
      - { match: 1, feedback: "นั่นคือ $-2 + 3$ ซึ่งเป็นการบวก โจทย์ให้ $\\vec{a} - \\vec{b}$" }
      - { match: 5, feedback: "นั่นคือ $3 - (-2)$ ซึ่งเป็น $\\vec{b} - \\vec{a}$ ลำดับการลบสำคัญ" }
    solution: "$\\vec{a} - \\vec{b} = (4 - 1,\\ -2 - 3) = (3, -5)$ องค์ประกอบ y คือ $-5$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.vec.p004
    topics: [math.geometry.vectors]
    difficulty: 2
    type: match
    stem: "ให้ $\\vec{a} = (2, 1)$ และ $\\vec{b} = (1, 3)$ จับคู่การดำเนินการกับผลลัพธ์"
    pairs:
      - { left: "$\\vec{a} + \\vec{b}$", right: "$(3, 4)$" }
      - { left: "$\\vec{a} - \\vec{b}$", right: "$(1, -2)$" }
      - { left: "$\\vec{b} - \\vec{a}$", right: "$(-1, 2)$" }
      - { left: "$2\\vec{a}$", right: "$(4, 2)$" }
      - { left: "$-\\vec{b}$", right: "$(-1, -3)$" }
    hints:
      - "ทุกการดำเนินการทำทีละองค์ประกอบ"
      - "การคูณด้วยสเกลาร์คูณทั้งองค์ประกอบ x และ y และ $-\\vec{b}$ คือคูณด้วย $-1$"
      - "$\\vec{a} - \\vec{b}$ กับ $\\vec{b} - \\vec{a}$ ได้ผลเป็นเวกเตอร์ที่ชี้ตรงข้ามกัน"
    solution: "$\\vec{a} + \\vec{b} = (3, 4)$ | $\\vec{a} - \\vec{b} = (2 - 1, 1 - 3) = (1, -2)$ | $\\vec{b} - \\vec{a} = (-1, 2)$ | $2\\vec{a} = (4, 2)$ | $-\\vec{b} = (-1, -3)$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.vec.p005
    topics: [math.geometry.vectors]
    difficulty: 3
    type: numeric
    stem: "ให้ $\\vec{a} = \\begin{pmatrix} 7 \\\\ 2 \\end{pmatrix}$ และ $\\vec{b} = \\begin{pmatrix} 1 \\\\ -6 \\end{pmatrix}$ จงหาขนาดของ $\\vec{a} - \\vec{b}$"
    answer: { value: 10 }
    hints:
      - "หา $\\vec{a} - \\vec{b}$ เป็นองค์ประกอบก่อน แล้วค่อยหาขนาด"
      - "ระวังองค์ประกอบ y: $2 - (-6)$"
      - "ใช้ $\\sqrt{x^2 + y^2}$ กับเวกเตอร์ผลลบ"
    misconceptions:
      - { match: 1.197, feedback: "นั่นคือ $|\\vec{a}| - |\\vec{b}|$ ขนาดของผลลบไม่เท่ากับผลลบของขนาด ต้องลบเวกเตอร์ก่อน" }
      - { match: 7.211, feedback: "องค์ประกอบ y ผิด $2 - (-6) = 8$ ไม่ใช่ $-4$" }
    solution: "$\\vec{a} - \\vec{b} = (7 - 1,\\ 2 - (-6)) = (6, 8)$ ขนาด $= \\sqrt{6^2 + 8^2} = \\sqrt{100} = 10$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.vec.p006
    topics: [math.geometry.vectors]
    difficulty: 3
    type: numeric
    stem: "ลูกบอลถูกตีออกไปด้วยความเร็ว $10\\ \\mathrm{m/s}$ ทำมุม $30^\\circ$ เหนือแนวระดับ องค์ประกอบของความเร็วในแนวระดับเป็นเท่าใด (หน่วย $\\mathrm{m/s}$ ตอบเป็นทศนิยม 2 ตำแหน่ง)"
    answer: { value: 8.66, tolerance: 0.09, unit: m/s }
    hints:
      - "วาดสามเหลี่ยมมุมฉากที่มีความเร็ว $10\\ \\mathrm{m/s}$ เป็นด้านตรงข้ามมุมฉาก"
      - "องค์ประกอบแนวระดับเป็นด้านประชิดมุม $30^\\circ$"
      - "ใช้ $x = r\\cos\\theta$"
    misconceptions:
      - { match: 5, feedback: "นั่นคือ $10\\sin 30^\\circ$ ซึ่งเป็นองค์ประกอบแนวดิ่ง องค์ประกอบที่ประชิดมุมใช้ $\\cos$" }
      - { match: 11.55, feedback: "หารด้วย $\\cos 30^\\circ$ แทนการคูณ องค์ประกอบต้องเล็กกว่าขนาดของเวกเตอร์เสมอ" }
    solution: "$v_x = 10\\cos 30^\\circ = 10 \\times \\dfrac{\\sqrt{3}}{2} = 5\\sqrt{3} \\approx 8.66\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.vec.p007
    topics: [math.geometry.vectors]
    difficulty: 3
    type: mcq
    stem: "เวกเตอร์ใดขนานกับ $\\vec{w} = (2, -3)$"
    choices:
      - { id: a, text: "$(-4, 6)$", correct: true }
      - { id: b, text: "$(3, -2)$", feedback: "สลับองค์ประกอบ x กับ y ไม่ใช่การคูณด้วยสเกลาร์ ลองหา $k$ ที่ทำให้ $k(2, -3) = (3, -2)$ จะหาไม่ได้" }
      - { id: c, text: "$(2, 3)$", feedback: "เปลี่ยนเครื่องหมายแค่องค์ประกอบเดียว ทิศจึงเปลี่ยน ถ้าคูณ $-1$ ต้องเปลี่ยนเครื่องหมายทั้งสองตัว" }
      - { id: d, text: "$(4, -1)$", feedback: "นั่นคือบวก 2 ทุกองค์ประกอบ การบวกค่าคงที่ไม่ใช่การคูณด้วยสเกลาร์ จึงไม่ขนานกัน" }
    hints:
      - "เวกเตอร์สองตัวขนานกันเมื่อตัวหนึ่งเท่ากับ $k$ เท่าของอีกตัว"
      - "ลองหาร องค์ประกอบ x ด้วย 2 และองค์ประกอบ y ด้วย $-3$ ถ้าได้ค่าเท่ากันทั้งคู่ แสดงว่าขนาน"
    solution: "$(-4, 6) = -2(2, -3)$ จึงขนานกับ $\\vec{w}$ (ชี้ทางตรงข้ามและยาวเป็น 2 เท่า) ตัวเลือกอื่นหา $k$ ตัวเดียวที่ใช้ได้กับทั้งสององค์ประกอบไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.vec.p008
    topics: [math.geometry.vectors]
    difficulty: 3
    type: numeric
    stem: "เรือข้ามฟากแล่นตั้งฉากกับฝั่งแม่น้ำเจ้าพระยาด้วยความเร็ว $4\\ \\mathrm{m/s}$ (เทียบกับน้ำ) ขณะที่น้ำไหลขนานกับฝั่งด้วยความเร็ว $3\\ \\mathrm{m/s}$ เรือเคลื่อนที่เทียบกับฝั่งด้วยอัตราเร็วกี่ $\\mathrm{m/s}$"
    answer: { value: 5, unit: m/s }
    hints:
      - "ความเร็วของเรือเทียบกับฝั่ง = ความเร็วของเรือเทียบกับน้ำ + ความเร็วของน้ำ (บวกแบบเวกเตอร์)"
      - "สองเวกเตอร์นี้ตั้งฉากกัน ให้วางหางต่อหัวจะได้สามเหลี่ยมมุมฉาก"
      - "หาขนาดของเวกเตอร์ลัพธ์ด้วยทฤษฎีบทพีทาโกรัส"
    misconceptions:
      - { match: 7, feedback: "บวกขนาดตรง ๆ ซึ่งใช้ได้เฉพาะเมื่อสองเวกเตอร์ชี้ทางเดียวกัน ที่นี่ตั้งฉากกันจึงต้องใช้ทฤษฎีบทพีทาโกรัส" }
      - { match: 1, feedback: "ลบขนาดกัน ซึ่งใช้ได้เฉพาะเมื่อสองเวกเตอร์ชี้ทางตรงข้ามกัน ที่นี่ตั้งฉากกัน" }
    solution: "ให้ทิศข้ามฟากเป็นแกน y และทิศน้ำไหลเป็นแกน x: ความเร็วลัพธ์ $= (3, 4)$ ขนาด $\\sqrt{3^2 + 4^2} = 5\\ \\mathrm{m/s}$ เรือจึงไม่ได้ไปตรงฝั่งตรงข้ามพอดี แต่ถูกพัดไปตามน้ำด้วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.vec.p009
    topics: [math.geometry.vectors]
    difficulty: 2
    type: numeric
    stem: "ต้นข้าวเดินจากประตูโรงเรียนไปทางตะวันออก $120\\ \\mathrm{m}$ แล้วเลี้ยวไปทางเหนืออีก $50\\ \\mathrm{m}$ ถึงร้านเครื่องเขียน การกระจัดจากประตูโรงเรียนถึงร้านมีขนาดกี่เมตร"
    answer: { value: 130, unit: m }
    hints:
      - "การกระจัดคือลูกศรจากจุดเริ่มต้นถึงจุดสุดท้าย ไม่ใช่ระยะที่เดินทั้งหมด"
      - "ทิศตะวันออกกับทิศเหนือตั้งฉากกัน ใช้ทฤษฎีบทพีทาโกรัส"
    misconceptions:
      - { match: 170, feedback: "นั่นคือระยะทางที่เดินทั้งหมด การกระจัดเป็นเวกเตอร์ วัดเป็นเส้นตรงจากจุดเริ่มถึงจุดสุดท้าย" }
      - { match: 70, feedback: "ลบสองระยะกัน แต่สองทิศนี้ตั้งฉากกัน ไม่ได้ตรงข้ามกัน" }
    solution: "การกระจัด $= (120, 50)$ ขนาด $\\sqrt{120^2 + 50^2} = \\sqrt{14400 + 2500} = \\sqrt{16900} = 130\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.vec.p010
    topics: [math.geometry.vectors]
    difficulty: 4
    type: order
    stem: "เรียงขั้นตอนการหาเวกเตอร์ลัพธ์ของเวกเตอร์สองตัวที่โจทย์ให้มาเป็นขนาดและมุม"
    items:
      - "แยกแต่ละเวกเตอร์เป็นองค์ประกอบด้วย $x = r\\cos\\theta$ และ $y = r\\sin\\theta$"
      - "บวกองค์ประกอบ x ของทุกตัวเข้าด้วยกัน และบวกองค์ประกอบ y เข้าด้วยกัน"
      - "หาขนาดของลัพธ์ด้วย $\\sqrt{x^2 + y^2}$"
      - "หาทิศของลัพธ์จาก $\\tan\\theta = \\dfrac{y}{x}$ โดยดูจตุภาคประกอบ"
    hints:
      - "บวกเวกเตอร์ด้วยตัวเลขได้ง่ายที่สุดเมื่ออยู่ในรูปองค์ประกอบ"
      - "ขนาดและทิศของลัพธ์คำนวณได้หลังจากรู้องค์ประกอบของลัพธ์แล้วเท่านั้น"
    solution: "แยกองค์ประกอบ → บวกทีละแกน → หาขนาดด้วยทฤษฎีบทพีทาโกรัส → หาทิศด้วย $\\tan$ (ห้ามบวกขนาดหรือบวกมุมตรง ๆ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.vec.p011
    topics: [math.geometry.vectors]
    difficulty: 5
    type: numeric
    stem: "เครื่องบินทำฝนหลวงบินจากสนามบินไป $200\\ \\mathrm{km}$ ในทิศที่ทำมุม $60^\\circ$ จากทิศตะวันออกไปทางเหนือ จากนั้นบินไปทางตะวันออกอีก $100\\ \\mathrm{km}$ ตอนนี้เครื่องบินอยู่ห่างจากสนามบินเป็นเส้นตรงกี่กิโลเมตร (ตอบเป็นจำนวนเต็ม)"
    answer: { value: 264.58, tolerance: 2.6, unit: km }
    hints:
      - "ให้ทิศตะวันออกเป็นแกน x และทิศเหนือเป็นแกน y แล้วแยกช่วงแรกเป็นองค์ประกอบ"
      - "ช่วงแรก $= (200\\cos 60^\\circ,\\ 200\\sin 60^\\circ)$ ช่วงที่สอง $= (100, 0)$"
      - "บวกองค์ประกอบทั้งสองช่วง แล้วหาขนาดด้วย $\\sqrt{x^2 + y^2}$"
    misconceptions:
      - { match: 300, feedback: "บวกขนาดตรง ๆ ซึ่งเป็นระยะทางที่บิน ไม่ใช่ระยะห่างเป็นเส้นตรง (ใช้ได้เฉพาะเมื่อสองช่วงไปทิศเดียวกัน)" }
      - { match: 223.6, feedback: "คิดเหมือนสองช่วงตั้งฉากกัน แต่ช่วงแรกทำมุม $60^\\circ$ กับทิศตะวันออก ต้องแยกเป็นองค์ประกอบก่อน" }
    solution: "ช่วงแรก $= (200 \\times \\tfrac{1}{2},\\ 200 \\times \\tfrac{\\sqrt{3}}{2}) = (100,\\ 173.2)$ บวกช่วงที่สอง $(100, 0)$ ได้ $(200,\\ 173.2)$ ระยะห่าง $= \\sqrt{200^2 + 173.2^2} = \\sqrt{70000} \\approx 264.6\\ \\mathrm{km}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.vec.p012
    topics: [math.geometry.vectors]
    difficulty: 4
    type: numeric
    stem: "จงหาองค์ประกอบในแนวแกน x ของเวกเตอร์หนึ่งหน่วยที่มีทิศเดียวกับ $\\vec{p} = (5, -12)$ (ตอบเป็นทศนิยม 3 ตำแหน่ง)"
    answer: { value: 0.3846, tolerance: 0.004 }
    hints:
      - "เวกเตอร์หนึ่งหน่วย $= \\dfrac{\\vec{p}}{|\\vec{p}|}$"
      - "หา $|\\vec{p}|$ ด้วยทฤษฎีบทพีทาโกรัสก่อน"
      - "หารองค์ประกอบ x ของ $\\vec{p}$ ด้วยขนาดที่ได้"
    misconceptions:
      - { match: 5, feedback: "นั่นคือองค์ประกอบของ $\\vec{p}$ เอง เวกเตอร์หนึ่งหน่วยต้องหารด้วยขนาด $|\\vec{p}|$ ก่อน" }
      - { match: 0.2941, feedback: "หารด้วย $5 + 12 = 17$ แต่ขนาดของเวกเตอร์คือ $\\sqrt{5^2 + 12^2}$ ไม่ใช่ผลบวกขององค์ประกอบ" }
    solution: "$|\\vec{p}| = \\sqrt{25 + 144} = 13$ เวกเตอร์หนึ่งหน่วย $= \\left(\\tfrac{5}{13}, -\\tfrac{12}{13}\\right)$ องค์ประกอบ x $= \\tfrac{5}{13} \\approx 0.385$ ตรวจ: $\\left(\\tfrac{5}{13}\\right)^2 + \\left(\\tfrac{12}{13}\\right)^2 = 1$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.vec.p013
    topics: [math.geometry.vectors]
    difficulty: 4
    type: mcq
    stem: "เวกเตอร์ $(-3, 3)$ ทำมุมกับแกน x ทางบวก (วัดทวนเข็มนาฬิกา) กี่องศา"
    choices:
      - { id: a, text: "$135^\\circ$", correct: true }
      - { id: b, text: "$45^\\circ$", feedback: "$45^\\circ$ คือทิศของ $(3, 3)$ ซึ่งชี้ไปทางขวาบน แต่ $(-3, 3)$ ชี้ไปทางซ้ายบน (จตุภาคที่ 2)" }
      - { id: c, text: "$-45^\\circ$", feedback: "เครื่องคิดเลขให้ $\\tan^{-1}(-1) = -45^\\circ$ แต่นั่นคือทิศของ $(3, -3)$ ทางขวาล่าง ต้องดูจตุภาคของเวกเตอร์ประกอบ" }
      - { id: d, text: "$225^\\circ$", feedback: "$225^\\circ$ คือทิศของ $(-3, -3)$ ซึ่งชี้ไปทางซ้ายล่าง แต่องค์ประกอบ y ของเวกเตอร์นี้เป็นบวก" }
    hints:
      - "วาดลูกศร: ไปทางซ้าย 3 ขึ้นบน 3 อยู่จตุภาคใด"
      - "$\\tan\\theta = \\tfrac{3}{-3} = -1$ มีหลายมุมที่ให้ค่านี้ เลือกมุมที่อยู่ในจตุภาคเดียวกับลูกศร"
    solution: "ลูกศรอยู่จตุภาคที่ 2 ทำมุม $45^\\circ$ กับแกน x ทางลบ จึงทำมุม $180^\\circ - 45^\\circ = 135^\\circ$ กับแกน x ทางบวก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.vec.p014
    topics: [math.geometry.vectors]
    difficulty: 2
    type: numeric
    stem: "จุด $A(2, -1)$ และ $B(7, 3)$ องค์ประกอบในแนวแกน y ของ $\\overrightarrow{AB}$ เท่ากับเท่าใด"
    answer: { value: 4 }
    hints:
      - "$\\overrightarrow{AB}$ = พิกัดจุดปลาย − พิกัดจุดเริ่มต้น"
      - "องค์ประกอบ y $= 3 - (-1)$"
    misconceptions:
      - { match: -4, feedback: "ลบกลับด้าน ($A - B$) ได้ $\\overrightarrow{BA}$ เวกเตอร์จาก $A$ ไป $B$ ต้องเป็น $B - A$" }
      - { match: 2, feedback: "ดูเหมือนคิด $3 + (-1)$ ต้องลบพิกัด: $3 - (-1) = 4$" }
    solution: "$\\overrightarrow{AB} = (7 - 2,\\ 3 - (-1)) = (5, 4)$ องค์ประกอบ y คือ $4$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.vec.p015
    topics: [math.geometry.vectors]
    difficulty: 2
    type: numeric
    stem: "ถ้า $|\\vec{v}| = 5$ แล้ว $|-3\\vec{v}|$ เท่ากับเท่าใด"
    answer: { value: 15 }
    hints:
      - "คูณสเกลาร์ $k$ ทำให้ขนาดเปลี่ยนเป็น $|k|$ เท่า"
      - "เครื่องหมายลบกลับทิศ แต่ขนาดยังเป็นบวก"
    misconceptions:
      - { match: -15, feedback: "ขนาดของเวกเตอร์ไม่ติดลบ เครื่องหมายลบทำให้ทิศกลับเท่านั้น $|-3\\vec{v}| = |-3| \\cdot 5$" }
      - { match: 5, feedback: "การคูณด้วย $-3$ เปลี่ยนความยาวเป็น 3 เท่าด้วย ไม่ได้แค่กลับทิศ" }
    solution: "$|-3\\vec{v}| = |-3| \\cdot |\\vec{v}| = 3 \\times 5 = 15$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.vec.p016
    topics: [math.geometry.vectors]
    difficulty: 3
    type: numeric
    stem: "จากภาพ อ่านองค์ประกอบของเวกเตอร์ $\\vec{a}$ และ $\\vec{b}$ แล้วหาขนาดของ $2\\vec{a} - \\vec{b}$"
    figure: { src: grid-vectors.svg, alt: "ตารางพิกัด เวกเตอร์ a เริ่มที่จุด (0, 1) และหัวลูกศรอยู่ที่ (3, 2) เวกเตอร์ b เริ่มที่จุด (5, 0) และหัวลูกศรอยู่ที่ (4, 2)" }
    answer: { value: 7 }
    hints:
      - "องค์ประกอบ = พิกัดหัว − พิกัดหาง เวกเตอร์ไม่ขึ้นกับจุดเริ่มต้น"
      - "$\\vec{a} = (3, 1)$ และ $\\vec{b} = (-1, 2)$ แล้วคำนวณ $2\\vec{a} - \\vec{b}$ ทีละองค์ประกอบ"
    misconceptions:
      - { match: 5, feedback: "ดูเหมือนใช้ $\\vec{b} = (1, 2)$ หัวของ $\\vec{b}$ อยู่ทางซ้ายของหาง องค์ประกอบ x จึงเป็น $4 - 5 = -1$" }
      - { match: 2.83, feedback: "ดูเหมือนอ่านเวกเตอร์จากพิกัดหัวลูกศรอย่างเดียว ($\\vec{a} = (3, 2)$, $\\vec{b} = (4, 2)$) ต้องลบพิกัดหางออกด้วย" }
    solution: "$\\vec{a} = (3 - 0,\\ 2 - 1) = (3, 1)$ และ $\\vec{b} = (4 - 5,\\ 2 - 0) = (-1, 2)$ ได้ $2\\vec{a} - \\vec{b} = (6 + 1,\\ 2 - 2) = (7, 0)$ ขนาด $= 7$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.vec.p017
    topics: [math.geometry.vectors]
    difficulty: 2
    type: mcq
    stem: "เลื่อนขนานจุด $P(-2, 5)$ ด้วยเวกเตอร์ $(4, -3)$ ได้จุดใด"
    choices:
      - { id: a, text: "$(2, 2)$", correct: true }
      - { id: b, text: "$(-6, 8)$", feedback: "นั่นคือการลบเวกเตอร์ การเลื่อนขนานต้องบวกเวกเตอร์เข้ากับพิกัดจุด" }
      - { id: c, text: "$(2, 8)$", feedback: "องค์ประกอบ y ของเวกเตอร์คือ $-3$ จุดต้องเลื่อนลง: $5 + (-3) = 2$" }
      - { id: d, text: "$(-8, -15)$", feedback: "ดูเหมือนคูณพิกัด การเลื่อนขนานใช้การบวก" }
    hints:
      - "เลื่อนขนานด้วยเวกเตอร์ $(p, q)$ คือบวก $p$ กับพิกัด x และบวก $q$ กับพิกัด y"
    solution: "$(-2 + 4,\\ 5 + (-3)) = (2, 2)$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.vec.p018
    topics: [math.geometry.vectors]
    difficulty: 4
    type: numeric
    stem: "เรือลากจูงสองลำลากเรือสินค้าในอ่าวไทย ลำแรกออกแรง $50\\ \\mathrm{kN}$ ไปทางทิศตะวันออก ลำที่สองออกแรง $30\\ \\mathrm{kN}$ ในทิศที่ทำมุม $60^\\circ$ จากทิศตะวันออกไปทางเหนือ แรงลัพธ์มีขนาดกี่กิโลนิวตัน (ตอบในหน่วย kN)"
    answer: { value: 70, tolerance: 0.5, unit: kN }
    hints:
      - "ให้ทิศตะวันออกเป็นแกน x แยกแรงที่สองเป็น $(30\\cos 60^\\circ,\\ 30\\sin 60^\\circ)$"
      - "บวกองค์ประกอบกับ $(50, 0)$ แล้วหาขนาดด้วยทฤษฎีบทพีทาโกรัส"
    misconceptions:
      - { match: 80, feedback: "บวกขนาดตรง ๆ ได้เฉพาะเมื่อแรงชี้ทางเดียวกัน ต้องแยกเป็นองค์ประกอบก่อน" }
      - { match: 58.31, feedback: "ดูเหมือนคิดว่าแรงตั้งฉากกัน ($\\sqrt{50^2 + 30^2}$) แต่มุมระหว่างแรงคือ $60^\\circ$ ไม่ใช่ $90^\\circ$" }
    solution: "องค์ประกอบ: $(50 + 30\\cos 60^\\circ,\\ 30\\sin 60^\\circ) = (65,\\ 25.98)$ ขนาด $= \\sqrt{65^2 + 25.98^2} = \\sqrt{4{,}900} = 70\\ \\mathrm{kN}$ (ทิศประมาณ $21.8^\\circ$ เหนือทิศตะวันออก)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.vec.p019
    topics: [math.geometry.vectors]
    difficulty: 4
    type: numeric
    stem: "ให้ $\\overrightarrow{OA} = (6, 2)$ และ $\\overrightarrow{OB} = (2, 8)$ จุด $M$ เป็นจุดกึ่งกลางของ $AB$ จงหาขนาดของ $\\overrightarrow{OM}$ (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 6.40, tolerance: 0.02 }
    hints:
      - "$\\overrightarrow{OM} = \\overrightarrow{OA} + \\tfrac12\\overrightarrow{AB}$"
      - "ซึ่งจัดรูปได้เป็น $\\tfrac12(\\overrightarrow{OA} + \\overrightarrow{OB})$"
    misconceptions:
      - { match: 12.81, feedback: "นั่นคือขนาดของ $\\overrightarrow{OA} + \\overrightarrow{OB}$ ยังต้องคูณ $\\tfrac12$" }
      - { match: 3.61, feedback: "นั่นคือขนาดของ $\\tfrac12\\overrightarrow{AB} = \\tfrac12(-4, 6)$ ซึ่งเป็นระยะจาก $A$ ถึง $M$ ไม่ใช่จาก $O$" }
    solution: "$\\overrightarrow{OM} = \\tfrac12\\big((6, 2) + (2, 8)\\big) = (4, 5)$ ขนาด $= \\sqrt{16 + 25} = \\sqrt{41} \\approx 6.40$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.vec.p020
    topics: [math.geometry.vectors]
    difficulty: 5
    type: numeric
    stem: "เรือหางยาวข้ามแม่น้ำโขงกว้าง $200\\ \\mathrm{m}$ เรือแล่นได้ $5\\ \\mathrm{m/s}$ เทียบกับน้ำ น้ำไหล $3\\ \\mathrm{m/s}$ ขนานกับฝั่ง คนขับหันหัวเรือทวนน้ำจนเรือเคลื่อนตรงข้ามฝั่งพอดี ใช้เวลาข้ามกี่วินาที (ตอบในหน่วยวินาที)"
    figure: { src: river-crossing.svg, alt: "แม่น้ำกว้าง 200 m ลูกศรความเร็วเรือเทียบน้ำ 5 m/s ชี้เฉียงทวนน้ำ ต่อด้วยลูกศรน้ำไหล 3 m/s ขนานฝั่ง ผลลัพธ์เป็นลูกศรประชี้ตรงข้ามฝั่ง ไม่มีตัวเลขบอกขนาดของผลลัพธ์" }
    answer: { value: 50, unit: s }
    hints:
      - "ความเร็วเรือเทียบน้ำ + ความเร็วน้ำ = ความเร็วเทียบฝั่ง ซึ่งชี้ตรงข้ามฝั่ง"
      - "องค์ประกอบทวนน้ำของเรือต้องหักล้างกับน้ำ ($3\\ \\mathrm{m/s}$) จึงเหลือองค์ประกอบข้ามฝั่ง $\\sqrt{5^2 - 3^2}$"
      - "เวลา = ความกว้าง ÷ ความเร็วข้ามฝั่ง"
    misconceptions:
      - { match: 40, feedback: "ใช้ $5\\ \\mathrm{m/s}$ ทั้งหมดในการข้าม แต่เรือต้องใช้ความเร็วส่วนหนึ่งทวนน้ำ ความเร็วข้ามฝั่งจริงคือ $4\\ \\mathrm{m/s}$" }
      - { match: 34.3, feedback: "ดูเหมือนบวกความเร็วแบบตั้งฉาก ($\\sqrt{5^2 + 3^2}$) แต่ในข้อนี้ $5\\ \\mathrm{m/s}$ คือด้านตรงข้ามมุมฉาก (เวกเตอร์เรือ) ต้องใช้ $\\sqrt{5^2 - 3^2}$" }
    solution: "ความเร็วข้ามฝั่ง $= \\sqrt{5^2 - 3^2} = 4\\ \\mathrm{m/s}$ (หัวเรือหันทวนน้ำ $\\sin^{-1}\\tfrac35 \\approx 36.9^\\circ$ จากแนวตั้งฉากฝั่ง) เวลา $= \\dfrac{200}{4} = 50$ วินาที"
    license: CC-BY-SA-4.0
    ai_assisted: true
