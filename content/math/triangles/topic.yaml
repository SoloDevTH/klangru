id: math.geometry.triangles
subject: math
title: { th: รูปสามเหลี่ยม, en: Triangles }
summary: จำแนกรูปสามเหลี่ยมตามด้านและมุม ใช้ผลบวกมุมภายใน 180 องศาและสมบัติของมุมภายนอก และตรวจความเท่ากันทุกประการด้วยเงื่อนไข ด.ม.ด. ม.ด.ม. ด.ด.ด. ม.ม.ด. และ ฉ.ด.ด.
difficulty: 3
minutes: 35
prerequisites: [math.geometry.angles]
encompasses:
  - { id: math.geometry.angles, weight: 0.5 }
  - { id: math.number.integers, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: angle-sum-proof.svg
    alt: "สามเหลี่ยม ABC มีเส้นประผ่านจุด A ขนานกับฐาน BC มุมที่ B ระบุว่า x มุมที่ C ระบุว่า y ที่จุด A มุมระหว่างเส้นขนานด้านซ้ายกับ AB ระบุว่า x มุมระหว่าง AC กับเส้นขนานด้านขวาระบุว่า y และมุมภายในที่ A ระบุว่า z มุม x z y เรียงกันบนเส้นตรง"
    caption: "มุมแย้งตามเส้นขนานทำให้ $x$, $z$, $y$ เรียงกันเป็นมุมตรง จึงได้ $x + y + z = 180^\\circ$"
  - type: worked-example
    title: ไม้สามท่อนประกอบเป็นสามเหลี่ยมได้หรือไม่
    problem: "ช่างมีไม้ยาว $4$, $7$ และ $12$ เซนติเมตร ประกอบเป็นสามเหลี่ยมได้หรือไม่ ถ้าไม่ได้ ควรเปลี่ยนท่อนยาว $12\\ \\mathrm{cm}$ เป็นท่อนยาวเท่าใดได้บ้าง (เป็นจำนวนเต็มเซนติเมตร)"
    steps:
      - text: "สองท่อนที่สั้นกว่ารวมกัน $4 + 7 = 11$ ซึ่งน้อยกว่า $12$ จึงประกอบไม่ได้"
        why: "อสมการสามเหลี่ยม: ผลบวกของสองด้านที่สั้นกว่าต้องมากกว่าด้านที่ยาวที่สุด"
      - text: "ด้านที่สาม $c$ ต้องสอดคล้องกับ $7 - 4 < c < 7 + 4$ คือ $3 < c < 11$"
        why: "ถ้า $c$ สั้นเกินไป ท่อน 4 กับ $c$ รวมกันจะไม่ถึง 7 ถ้ายาวเกินไป ท่อน 4 กับ 7 จะไม่ถึง $c$"
      - text: "จำนวนเต็มที่ใช้ได้คือ $4, 5, 6, 7, 8, 9, 10$ เซนติเมตร"
      - text: "ตรวจค่าขอบ: $c = 11$ ได้ $4 + 7 = 11$ ไม้นอนเป็นเส้นตรง จึงใช้ไม่ได้"
    answer: "ประกอบไม่ได้ ต้องเปลี่ยนเป็นท่อนยาว 4 ถึง 10 cm"
  - { type: check, problem: math.tri.p004, prompt: "มุมที่ฐานของสามเหลี่ยมหน้าจั่วมีสองมุม" }
  - type: worked-example
    title: พิสูจน์ว่ามุมที่ฐานของสามเหลี่ยมหน้าจั่วเท่ากัน
    problem: "ใน $\\triangle ABC$ มี $AB = AC$ แสดงว่า $\\angle B = \\angle C$"
    steps:
      - text: "ให้ $M$ เป็นจุดกึ่งกลางของ $BC$ แล้วลาก $AM$"
        why: "เส้นช่วยนี้แบ่งรูปเป็นสามเหลี่ยมสองรูปที่เทียบกันได้"
      - text: "เทียบ $\\triangle ABM$ กับ $\\triangle ACM$: $AB = AC$ (โจทย์กำหนด) $BM = CM$ ($M$ เป็นจุดกึ่งกลาง) และ $AM = AM$ (ด้านร่วม)"
      - text: "จึงได้ $\\triangle ABM \\cong \\triangle ACM$ ด้วยเงื่อนไข ด.ด.ด."
      - text: "มุมที่สมนัยกันของรูปที่เท่ากันทุกประการย่อมเท่ากัน จึงได้ $\\angle B = \\angle C$"
        why: "$\\angle B$ อยู่ตรงข้ามด้าน $AM$ ใน $\\triangle ABM$ และ $\\angle C$ อยู่ตรงข้ามด้าน $AM$ ใน $\\triangle ACM$"
      - text: "ผลพลอยได้: $\\angle AMB = \\angle AMC$ และรวมกันได้ $180^\\circ$ จึงเป็นมุมฉากทั้งคู่ $AM$ ตั้งฉากกับ $BC$"
    answer: "$\\angle B = \\angle C$ และเส้นจากยอดไปจุดกึ่งกลางฐานตั้งฉากกับฐาน"
  - { type: check, problem: math.tri.p005, prompt: "ใช้สมบัติของมุมภายนอก" }
glossary:
  - { term: สามเหลี่ยมหน้าจั่ว, definition: "สามเหลี่ยมที่มีด้านยาวเท่ากันอย่างน้อยสองด้าน มุมที่ฐานซึ่งอยู่ตรงข้ามด้านที่ยาวเท่ากันจะมีขนาดเท่ากัน" }
  - { term: สามเหลี่ยมด้านเท่า, definition: "สามเหลี่ยมที่มีด้านยาวเท่ากันทั้งสามด้าน มุมทุกมุมมีขนาด $60^\\circ$" }
  - { term: มุมภายนอก, definition: "มุมที่เกิดจากการต่อด้านหนึ่งของสามเหลี่ยมออกไป มีขนาดเท่ากับผลบวกของมุมภายในที่ไม่ใช่มุมประชิด" }
  - { term: เท่ากันทุกประการ, definition: "รูปสองรูปที่ทับกันได้สนิท ด้านที่สมนัยกันยาวเท่ากันและมุมที่สมนัยกันมีขนาดเท่ากัน ใช้สัญลักษณ์ $\\cong$" }
flashcards:
  - { front: "ผลบวกมุมภายในของสามเหลี่ยม", back: "$180^\\circ$ เสมอ ไม่ว่าสามเหลี่ยมจะมีรูปร่างแบบใด" }
  - { front: "สมบัติของมุมภายนอกของสามเหลี่ยม", back: "มุมภายนอกเท่ากับผลบวกของมุมภายในสองมุมที่ไม่ใช่มุมประชิดของมัน" }
  - { front: "เงื่อนไขที่ใช้ยืนยันว่าสามเหลี่ยมสองรูปเท่ากันทุกประการ", back: "ด.ม.ด. (ด้าน-มุม-ด้าน), ม.ด.ม. (มุม-ด้าน-มุม), ด.ด.ด. (ด้าน-ด้าน-ด้าน), ม.ม.ด. (มุม-มุม-ด้าน) และ ฉ.ด.ด. (ฉาก-ด้าน-ด้าน)" }
  - { front: "มุมเท่ากันสามคู่ (ม.ม.ม.) ยืนยันความเท่ากันทุกประการได้หรือไม่", back: "ไม่ได้ สามเหลี่ยมอาจมีรูปร่างเหมือนกันแต่ขนาดต่างกัน (เป็นรูปคล้าย)" }
