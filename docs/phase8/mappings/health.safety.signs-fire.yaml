  - { framework: th-core-2551-health-pe, indicators: ["พ 5.1 ป.2/5"], coverage: partial, note: "สอนสาเหตุ (สามเหลี่ยมของไฟ) อันตราย (ควัน ความร้อน) วิธีป้องกันอัคคีภัย และหลักการหนีไฟครบ แต่ส่วน แสดงการหนีไฟ ต้องซ้อมหนีไฟจริงกับโรงเรียน" }
