id: science.inquiry.data-analysis
subject: science
title:
  th: การจัดกระทำและวิเคราะห์ข้อมูลจากการทดลอง
  en: Processing and analysing experimental data
summary: บันทึกข้อมูลในตาราง หาค่าเฉลี่ย พิสัย และค่าผิดปกติ เลือกและอ่านกราฟ บรรยายแนวโน้ม คำนวณผล สรุปเทียบกับการคาดคะเน และแยกความคลาดเคลื่อนสุ่มกับเป็นระบบ
difficulty: 2.5
minutes: 30
prerequisites:
- science.inquiry.investigation-design
- math.stats.data-display
encompasses:
- id: math.stats.data-display
  weight: 0.3
- id: science.inquiry.investigation-design
  weight: 0.2
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  title: กราฟจากข้อมูลลูกปิงปอง
  src: bounce-graph.svg
  alt: กราฟจุดความสูงที่ลูกปิงปองเด้งเฉลี่ยกับความสูงที่ปล่อย จุด (20, 14.3) (40, 29) (60, 43) (80, 57.5) (100, 72) เรียงเกือบเป็นเส้นตรงผ่านจุดกำเนิด เส้นแนวโน้มสีน้ำเงิน เด้ง ≈ 0.72 × ความสูงที่ปล่อย มีจุดวงกลมสีแดงที่ (80, 41) ระบุว่าเป็นค่าผิดปกติ ไม่นำมาเฉลี่ย
  caption: จุดเรียงเป็นเส้นตรงผ่านจุดกำเนิด แปลว่าความสูงที่เด้งแปรผันตรงกับความสูงที่ปล่อย
- type: worked-example
  title: จากตารางสู่ค่าเฉลี่ยและอัตราส่วน
  problem: ใช้ข้อมูลลูกปิงปองที่ปล่อย 60 cm (43, 44, 42) และ 100 cm (72, 71, 73) หาค่าเฉลี่ย พิสัย และอัตราส่วนความสูงที่เด้งต่อความสูงที่ปล่อย
  steps:
  - text: '60 cm: ค่าเฉลี่ย $\frac{43 + 44 + 42}{3} = 43$ cm พิสัย $44 - 42 = 2$ cm'
  - text: '100 cm: ค่าเฉลี่ย $\frac{72 + 71 + 73}{3} = 72$ cm พิสัย $73 - 71 = 2$ cm'
    why: พิสัยเล็กทั้งสองแถว แปลว่าการวัดซ้ำได้ผลใกล้กัน
  - text: 'อัตราส่วน: $\frac{43}{60} \approx 0.72$ และ $\frac{72}{100} = 0.72$'
  - text: อัตราส่วนเท่ากัน จึงเป็นความสัมพันธ์แบบแปรผันตรง
    why: ถ้าอัตราส่วนคงที่ กราฟจะเป็นเส้นตรงผ่านจุดกำเนิด
  answer: ค่าเฉลี่ย 43 และ 72 cm พิสัย 2 cm ทั้งคู่ อัตราส่วนประมาณ 0.72 เท่ากัน
- type: check
  problem: science.inquiry.data-analysis.p004
  prompt: ลองหาค่าผิดปกติเอง
- type: figure
  title: กราฟการละลายของน้ำตาล
  src: dissolve.svg
  alt: กราฟเส้นเวลาที่น้ำตาล 1 ช้อนชาละลายหมดในน้ำ 100 mL (ข้อมูลสมมติ) แกนนอนอุณหภูมิของน้ำ องศาเซลเซียส แกนตั้งเวลา วินาที จุดข้อมูล 20 °C 120 s, 30 °C 90 s, 40 °C 68 s, 50 °C 52 s, 60 °C 40 s ต่อจุดด้วยเส้น เส้นลาดลงและค่อย ๆ ชันน้อยลง
  caption: 'ความสัมพันธ์เชิงลบที่เป็นเส้นโค้ง: เวลาลดลงช้าลงเมื่อน้ำร้อนขึ้น'
- type: worked-example
  title: อ่านกราฟ ประมาณค่า และสรุปผล
  problem: จากกราฟการละลายของน้ำตาล ประมาณเวลาที่ 35 °C และเขียนข้อสรุปเทียบกับการคาดคะเนว่า "น้ำร้อนทำให้น้ำตาลละลายเร็วขึ้น"
  steps:
  - text: 35 °C อยู่กึ่งกลางระหว่าง 30 °C (90 s) กับ 40 °C (68 s) ประมาณ $\frac{90 + 68}{2} = 79$ s
    why: ค่าอยู่ภายในช่วงที่วัด การประมาณจึงค่อนข้างเชื่อถือได้
  - text: 'แนวโน้ม: อุณหภูมิเพิ่มจาก 20 เป็น 60 °C เวลาลดจาก 120 เหลือ 40 s เป็นความสัมพันธ์เชิงลบ'
  - text: 'เทียบการคาดคะเน: ตรงกับที่คาดไว้ เพราะอนุภาคของน้ำร้อนเคลื่อนที่เร็วกว่า'
  - text: 'คำถามต่อ: น้ำตาลก้อนกับน้ำตาลทรายละลายต่างกันแค่ไหนที่อุณหภูมิเดียวกัน'
  answer: ประมาณ 79 s ข้อมูลสนับสนุนการคาดคะเน และตั้งคำถามใหม่ได้
- type: check
  problem: science.inquiry.data-analysis.p009
glossary:
- term: ค่าผิดปกติ
  definition: ค่าที่ห่างจากค่าอื่นในชุดเดียวกันมากหรือไม่เข้ากับแนวโน้ม ควรวัดใหม่หรือไม่นำมาเฉลี่ยพร้อมบอกเหตุผล
- term: พิสัย
  definition: ค่ามากที่สุดลบค่าน้อยที่สุด บอกว่าข้อมูลกระจายมากน้อยเพียงใด
- term: เส้นแนวโน้ม
  definition: เส้นตรงหรือเส้นโค้งที่ลากผ่านกลางกลุ่มจุดบนกราฟ แสดงแบบรูปของข้อมูล
- term: ความแม่นและความเที่ยง
  definition: ความแม่นคือใกล้ค่าจริงแค่ไหน ความเที่ยงคือวัดซ้ำได้ค่าใกล้กันแค่ไหน
- term: ความคลาดเคลื่อนสุ่มและเป็นระบบ
  definition: ความคลาดเคลื่อนสุ่มทำให้ค่ากระจายสองทาง ลดได้ด้วยการเฉลี่ย ความคลาดเคลื่อนเป็นระบบทำให้ค่าเพี้ยนทางเดียว ต้องแก้ที่เครื่องมือหรือวิธี
flashcards:
- front: แกนของกราฟผลการทดลอง
  back: ตัวแปรต้นแกนนอน ตัวแปรตามแกนตั้ง มีชื่อและหน่วยทั้งสองแกน
- front: เลือกแผนภูมิแท่งหรือกราฟจุด
  back: ตัวแปรต้นเป็นกลุ่มใช้แผนภูมิแท่ง เป็นตัวเลขต่อเนื่องใช้กราฟจุดกับเส้นแนวโน้ม
- front: ความไม่แน่นอนโดยประมาณ
  back: ± ครึ่งหนึ่งของพิสัยของค่าที่วัดซ้ำ
- front: ร้อยละการเปลี่ยนแปลง
  back: (ค่าใหม่ − ค่าเดิม) ÷ ค่าเดิม × 100
