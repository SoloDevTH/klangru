problems:
  - id: biology.animals.behaviour.p001
    topics: [biology.animals.behaviour]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นพฤติกรรมที่เป็นมาแต่กำเนิด"
    choices:
      - { id: a, text: "ลูกเต่าทะเลที่เพิ่งฟักคลานลงทะเลทันที", correct: true }
      - { id: b, text: "สุนัขนั่งเมื่อได้ยินคำสั่ง", feedback: "สุนัขต้องฝึกจึงทำได้ เป็นพฤติกรรมจากการเรียนรู้" }
      - { id: c, text: "นกไม่บินหนีหุ่นไล่กาที่เห็นทุกวัน", feedback: "เป็นแฮบิทูเอชัน ซึ่งเกิดจากการเรียนรู้" }
      - { id: d, text: "ลิงเก็บมะพร้าวที่แก่ได้ถูกต้อง", feedback: "ลิงต้องฝึกหลายเดือน เป็นการเรียนรู้" }
    hints:
      - "พฤติกรรมมาแต่กำเนิดทำได้ครั้งแรกโดยไม่ต้องฝึก"
      - "ตัวเลือกใดเกิดทันทีหลังเกิด"
    solution: "ลูกเต่าทะเลคลานไปทางทะเลทันทีหลังฟักโดยไม่มีใครสอน จึงเป็นพฤติกรรมมาแต่กำเนิด ส่วนข้ออื่นต้องอาศัยประสบการณ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.behaviour.p002
    topics: [biology.animals.behaviour]
    difficulty: 1
    type: match
    stem: "จับคู่ตัวอย่างกับชนิดของพฤติกรรมที่เกิดจากการเรียนรู้"
    pairs:
      - { left: "นกกระจอกไม่ตกใจเสียงรถที่ผ่านทุกวัน", right: "แฮบิทูเอชัน" }
      - { left: "ลูกห่านเดินตามคนที่เห็นครั้งแรกหลังฟัก", right: "การฝังใจ" }
      - { left: "ปลาในบ่อว่ายมาที่ขอบบ่อเมื่อได้ยินเสียงเคาะ เพราะเคยได้อาหารพร้อมเสียงนั้น", right: "การมีเงื่อนไข" }
      - { left: "หนูกดคานซ้ำ ๆ หลังพบว่ากดแล้วได้อาหาร", right: "การลองผิดลองถูก" }
      - { left: "ชิมแปนซีต่อกล่องเพื่อหยิบกล้วยที่แขวนสูงในครั้งแรก", right: "การใช้เหตุผล" }
    hints:
      - "การฝังใจเกิดในช่วงสั้น ๆ หลังเกิด"
      - "การมีเงื่อนไขเชื่อมสิ่งเร้าสองอย่าง การลองผิดลองถูกอาศัยรางวัลจากการกระทำของตัวเอง"
    solution: "ไม่ตกใจเสียงที่ได้ยินซ้ำคือแฮบิทูเอชัน เดินตามสิ่งแรกที่เห็นคือการฝังใจ ปลาเชื่อมเสียงกับอาหารคือการมีเงื่อนไข หนูกดคานเพราะได้รางวัลคือการลองผิดลองถูก และชิมแปนซีแก้ปัญหาใหม่ได้ทันทีคือการใช้เหตุผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.behaviour.p003
    topics: [biology.animals.behaviour]
    difficulty: 1
    type: text
    stem: "สารเคมีที่สัตว์ปล่อยออกมาเพื่อสื่อสารกับสัตว์ชนิดเดียวกัน เช่น สารที่มดใช้ทำทางไปแหล่งอาหาร เรียกว่าอะไร"
    accepted: ["ฟีโรโมน", "pheromone", "pheromones"]
    misconceptions:
      - { match: "ฮอร์โมน", feedback: "ฮอร์โมนทำงานภายในร่างกายของสัตว์ตัวเดียวกัน ฟีโรโมนส่งออกไปสื่อสารกับตัวอื่น" }
    hints:
      - "ชื่อคล้ายฮอร์โมน แต่ใช้สื่อสารนอกร่างกาย"
      - "ขึ้นต้นด้วย ฟี-"
    solution: "ฟีโรโมน มดวางฟีโรโมนเป็นทาง มดตัวอื่นจึงเดินตามไปยังแหล่งอาหาร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.behaviour.p004
    topics: [biology.animals.behaviour]
    difficulty: 2
    type: mcq
    stem: "คนเลี้ยงเป็ดไล่ทุ่งจะอยู่กับลูกเป็ดตั้งแต่ฟักออกจากไข่ ต่อมาลูกเป็ดเดินตามคนเลี้ยงเป็นฝูง พฤติกรรมนี้อาศัยการเรียนรู้แบบใด"
    choices:
      - { id: a, text: "การฝังใจ", correct: true }
      - { id: b, text: "แฮบิทูเอชัน", feedback: "แฮบิทูเอชันคือการหยุดตอบสนองต่อสิ่งเร้าซ้ำ ๆ ไม่ใช่การเดินตาม" }
      - { id: c, text: "การใช้เหตุผล", feedback: "ลูกเป็ดไม่ได้แก้ปัญหาใหม่ แต่จดจำสิ่งที่เห็นในช่วงหลังฟัก" }
      - { id: d, text: "แทกซิส", feedback: "แทกซิสเป็นพฤติกรรมมาแต่กำเนิดต่อสิ่งเร้า เช่น แสง ไม่ได้เรียนรู้ว่าจะตามใคร" }
    hints:
      - "การเรียนรู้นี้เกิดในช่วงเวลาสั้น ๆ หลังฟัก"
      - "ลอเรนซ์ทดลองกับลูกห่าน"
    solution: "ลูกเป็ดฝังใจกับสิ่งเคลื่อนที่ที่เห็นในช่วงแรกหลังฟัก จึงเดินตามคนเลี้ยงเหมือนเดินตามแม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.behaviour.p005
    topics: [biology.animals.behaviour]
    difficulty: 2
    type: mcq
    stem: "ชาวนาปักหุ่นไล่กาในนาข้าว สัปดาห์แรกนกบินหนี แต่หลังจากนั้นนกลงกินข้าวใกล้หุ่นไล่กาตามปกติ พฤติกรรมของนกเป็นแบบใด"
    choices:
      - { id: a, text: "แฮบิทูเอชัน", correct: true }
      - { id: b, text: "การฝังใจ", feedback: "การฝังใจเกิดในช่วงหลังเกิด ไม่ใช่กับนกโตที่เรียนรู้ว่าหุ่นไม่อันตราย" }
      - { id: c, text: "รีเฟล็กซ์", feedback: "การบินหนีในตอนแรกอาจเป็นรีเฟล็กซ์ แต่การเลิกหนีเกิดจากการเรียนรู้" }
      - { id: d, text: "การมีเงื่อนไข", feedback: "ไม่มีการจับคู่สิ่งเร้าสองอย่าง นกเพียงเลิกตอบสนองต่อสิ่งเร้าที่ไม่มีผลต่อมัน" }
    hints:
      - "สิ่งเร้าเกิดซ้ำทุกวันและไม่ทำอันตราย"
      - "นกเลิกตอบสนองต่อสิ่งเร้านั้น"
    solution: "นกเห็นหุ่นไล่กาซ้ำ ๆ โดยไม่มีอันตราย จึงเลิกตอบสนอง เป็นแฮบิทูเอชัน ชาวนาจึงต้องเปลี่ยนตำแหน่งหรือรูปแบบของหุ่นบ่อย ๆ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.behaviour.p006
    topics: [biology.animals.behaviour]
    difficulty: 2
    type: numeric
    stem: "(ข้อมูลสมมติ) ผึ้งสายพันธุ์หนึ่งเต้นช่วงส่ายท้อง 1 วินาทีต่อระยะทางประมาณ 1 กิโลเมตร ถ้าผึ้งเต้นช่วงส่ายท้องนาน 2.5 วินาที แหล่งอาหารอยู่ห่างจากรังประมาณกี่กิโลเมตร"
    answer: { value: 2.5, tolerance: 0.03, unit: km }
    misconceptions:
      - { match: 0.4, feedback: "หารกลับด้าน ยิ่งส่ายนาน แหล่งอาหารยิ่งไกล" }
    hints:
      - "ระยะทางเพิ่มตามเวลาที่ส่ายท้อง"
      - "ระยะทาง = เวลา × ระยะทางต่อวินาที"
    solution: "$2.5\\ \\mathrm{s} \\times 1\\ \\mathrm{km/s} = 2.5$ กิโลเมตร ค่าจริงต่างกันตามสายพันธุ์ผึ้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.behaviour.p007
    topics: [biology.animals.behaviour]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการทดลองของพาฟลอฟที่ทำให้สุนัขน้ำลายไหลเมื่อได้ยินเสียงกระดิ่ง"
    items:
      - "ให้อาหาร สุนัขน้ำลายไหล (ยังไม่ต้องเรียนรู้)"
      - "สั่นกระดิ่งอย่างเดียว สุนัขยังไม่น้ำลายไหล"
      - "สั่นกระดิ่งแล้วให้อาหารทันที ทำซ้ำหลายครั้ง"
      - "สั่นกระดิ่งอย่างเดียว สุนัขน้ำลายไหล"
    hints:
      - "ต้องทดสอบก่อนว่าเสียงกระดิ่งเดิมไม่ทำให้น้ำลายไหล"
      - "การจับคู่เสียงกับอาหารต้องเกิดก่อนผลสุดท้าย"
    solution: "อาหารทำให้น้ำลายไหลอยู่แล้ว → กระดิ่งอย่างเดียวยังไม่มีผล → จับคู่กระดิ่งกับอาหารหลายครั้ง → กระดิ่งอย่างเดียวทำให้น้ำลายไหล เป็นการเรียนรู้แบบมีเงื่อนไข"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.behaviour.p008
    topics: [biology.animals.behaviour]
    difficulty: 3
    type: mcq
    stem: "พลานาเรียที่วางในจานซึ่งครึ่งหนึ่งมีแสงส่อง จะเคลื่อนที่ออกจากบริเวณที่มีแสงตรงไปยังบริเวณที่มืด พฤติกรรมนี้เป็นแบบใด"
    choices:
      - { id: a, text: "แทกซิสแบบหนีแสง", correct: true }
      - { id: b, text: "ไคนีซิส", feedback: "ไคนีซิสเปลี่ยนเพียงอัตราการเคลื่อนที่ ไม่มีทิศทาง แต่พลานาเรียเคลื่อนที่หนีแสงอย่างมีทิศทาง" }
      - { id: c, text: "แทกซิสแบบเข้าหาแสง", feedback: "พลานาเรียเคลื่อนที่ออกจากแสง ไม่ใช่เข้าหา" }
      - { id: d, text: "การลองผิดลองถูก", feedback: "พลานาเรียทำได้ตั้งแต่แรกโดยไม่ต้องเรียนรู้" }
    hints:
      - "พลานาเรียเคลื่อนที่มีทิศทางหรือไม่"
      - "ทิศทางนั้นเข้าหาหรือหนีสิ่งเร้า"
    solution: "พลานาเรียเคลื่อนที่หนีแสงอย่างมีทิศทาง เป็นแทกซิสแบบหนีแสง ซึ่งเป็นพฤติกรรมมาแต่กำเนิด ช่วยให้มันอยู่ในที่มืดและพ้นจากผู้ล่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.behaviour.p009
    topics: [biology.animals.behaviour]
    difficulty: 3
    type: numeric
    stem: "จากกราฟ ร้อยละของหอยทากที่หดตัวลดลงกี่จุดร้อยละ ระหว่างการแตะครั้งที่ 1 กับครั้งที่ 10"
    figure: { src: habituation-graph.svg, alt: "กราฟเส้นชื่อหอยทาก 20 ตัว (ข้อมูลสมมติ) แกนนอนคือครั้งที่แตะ 1 ถึง 10 ห่างกันครั้งละ 1 นาที แกนตั้งคือร้อยละของหอยทากที่หดตัว 0 ถึง 100 ค่าที่ครั้งที่ 1 ถึง 10 คือ 100, 90, 75, 60, 45, 35, 25, 20, 15, 15 ตามลำดับ" }
    answer: { value: 85, unit: จุดร้อยละ }
    misconceptions:
      - { match: 15, feedback: "15 คือร้อยละที่ยังหดตัวในครั้งที่ 10 โจทย์ถามว่าลดลงเท่าใด" }
      - { match: 17, feedback: "17 คือจำนวนหอยทากที่เลิกหดตัว (85% ของ 20 ตัว) โจทย์ถามเป็นจุดร้อยละ" }
    hints:
      - "อ่านค่าที่ครั้งที่ 1 และครั้งที่ 10"
      - "ลบค่าครั้งที่ 10 ออกจากค่าครั้งที่ 1"
    solution: "ครั้งที่ 1 หดตัว 100% ครั้งที่ 10 หดตัว 15% ลดลง $100 - 15 = 85$ จุดร้อยละ เป็นแฮบิทูเอชันเพราะการแตะเบา ๆ ซ้ำ ๆ ไม่มีอันตราย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.behaviour.p010
    topics: [biology.animals.behaviour]
    difficulty: 3
    type: mcq
    stem: "ตอนเช้าดวงอาทิตย์อยู่ทางทิศตะวันออก ผึ้งงานเต้นช่วงส่ายท้องบนรวงผึ้งตรงลงด้านล่าง (สวนกับแนวขึ้นตรง 180°) แหล่งอาหารอยู่ทิศใดของรัง"
    choices:
      - { id: a, text: "ทิศตะวันตก", correct: true }
      - { id: b, text: "ทิศตะวันออก", feedback: "การเต้นตรงขึ้นจึงจะหมายถึงทิศเดียวกับดวงอาทิตย์" }
      - { id: c, text: "ทิศเหนือ", feedback: "ทิศเหนือคือหมุนจากทิศดวงอาทิตย์ 90° ไม่ใช่ 180°" }
      - { id: d, text: "ทิศใต้", feedback: "ทิศใต้คือหมุนจากทิศตะวันออก 90° ตามเข็มนาฬิกา ไม่ใช่ 180°" }
    hints:
      - "แนวขึ้นตรงบนรวงผึ้งแทนทิศของดวงอาทิตย์"
      - "เต้นลงตรงคือทิศตรงข้ามกับดวงอาทิตย์"
    solution: "เต้นลงตรงหมายถึงบินไปทางตรงข้ามกับดวงอาทิตย์ ดวงอาทิตย์อยู่ทิศตะวันออก แหล่งอาหารจึงอยู่ทิศตะวันตก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.behaviour.p011
    topics: [biology.animals.behaviour]
    difficulty: 3
    type: mcq
    stem: "นกเงือกตัวเมียขังตัวเองอยู่ในโพรงไม้โดยปิดปากโพรงเหลือช่องเล็ก ๆ ตลอดช่วงกกไข่และเลี้ยงลูก ส่วนตัวผู้หาผลไม้มาป้อนทางช่องนั้น ข้อใดอธิบายประโยชน์ของพฤติกรรมนี้ได้ดีที่สุด"
    choices:
      - { id: a, text: "ป้องกันไข่และลูกนกจากงู กระรอก และนักล่าอื่น ลูกจึงมีโอกาสรอดมากขึ้น", correct: true }
      - { id: b, text: "ทำให้ตัวผู้ได้ออกกำลังกายมากขึ้น", feedback: "พฤติกรรมพ่อแม่คงอยู่ได้เพราะช่วยให้ลูกรอด ไม่ใช่เพื่อประโยชน์นี้" }
      - { id: c, text: "ลูกนกเรียนรู้การบินในโพรงได้เร็วขึ้น", feedback: "โพรงที่ปิดไม่ได้ช่วยการฝึกบิน" }
      - { id: d, text: "ตัวเมียไม่ต้องกินอาหารเลยตลอดช่วงนั้น", feedback: "ตัวเมียยังต้องกินอาหารที่ตัวผู้นำมาป้อน" }
    hints:
      - "คิดถึงอันตรายที่ไข่และลูกนกในโพรงไม้อาจพบ"
      - "พฤติกรรมพ่อแม่ถูกคัดเลือกเพราะเพิ่มโอกาสรอดของลูก"
    solution: "การปิดโพรงป้องกันนักล่า และตัวผู้ป้อนอาหาร ทำให้ลูกปลอดภัยและได้อาหารพอ จึงเพิ่มโอกาสรอดของลูก ตัวผู้ที่ถูกล่าหรือป่าที่ถูกตัดจึงกระทบทั้งครอบครัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.behaviour.p012
    topics: [biology.animals.behaviour]
    difficulty: 3
    type: mcq
    stem: "หิ่งห้อยริมแม่น้ำแม่กลองกะพริบแสงเป็นจังหวะ ข้อใดอธิบายการสื่อสารนี้ได้ถูกต้อง"
    choices:
