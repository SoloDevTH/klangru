  - id: math.algebra.nonlinear-systems.p020
    topics: [math.algebra.nonlinear-systems]
    difficulty: 4
    type: numeric
    stem: "ร้านข้าวมันไก่ขายวันละ $x$ จาน รายได้ $R = 70x$ บาท ต้นทุนรวม $C = 0.5x^2 + 650$ บาท (ขายมากขึ้นต้นทุนต่อจานสูงขึ้นเพราะต้องจ้างคนเพิ่ม) ต้องขายอย่างน้อยกี่จานจึงคุ้มทุน (รายได้เท่ากับต้นทุนพอดี)"
