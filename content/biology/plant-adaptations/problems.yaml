problems:
  - id: biology.plants.plant-adaptations.p001
    topics: [biology.plants.plant-adaptations]
    difficulty: 1
    type: mcq
    stem: "พืชชนิดใดมีส่วนที่สะสมแป้งเป็นหัวซึ่งเป็นลำต้นดัดแปลง"
    choices:
      - { id: a, text: "มันฝรั่ง", correct: true }
      - { id: b, text: "มันเทศ", feedback: "หัวมันเทศเป็นรากที่สะสมอาหาร ไม่ใช่ลำต้นดัดแปลง" }
      - { id: c, text: "แครอท", feedback: "แครอทเป็นรากแก้วที่สะสมอาหาร ไม่ใช่ลำต้นดัดแปลง" }
      - { id: d, text: "หัวไชเท้า", feedback: "หัวไชเท้าเป็นรากแก้วที่สะสมอาหาร ไม่ใช่ลำต้นดัดแปลง" }
    hints:
      - "ดูว่าส่วนที่สะสมแป้งนั้นงอกจากใบหรือจากลำต้น"
      - "หัวของพืชบางชนิดเป็นลำต้นที่ขยายออกใต้ดิน"
    solution: "หัวของมันฝรั่งเป็นลำต้นใต้ดินที่สะสมแป้งไว้ในปริมาณมาก ส่วนมันเทศกับแครอทเป็นราก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-adaptations.p002
    topics: [biology.plants.plant-adaptations]
    difficulty: 2
    type: mcq
    stem: "รากหายใจของต้นแสมในป่าชายเลนที่ตั้งขึ้นจากดินเลนมีหน้าที่หลักอย่างไร"
    choices:
      - { id: a, text: "รับอากาศให้รากในดินเลนที่ขาดออกซิเจน", correct: true }
      - { id: b, text: "ยึดต้นให้แน่นกับพื้น", feedback: "การยึดต้นเป็นหน้าที่ของรากค้ำ ไม่ใช่รากหายใจ" }
      - { id: c, text: "เก็บน้ำตาลไว้ใช้ในฤดูแล้ง", feedback: "การสะสมอาหารทำโดยรากสะสมอาหารหรือหัว ไม่ใช่รากหายใจ" }
      - { id: d, text: "ปล่อยสารพิษฆ่าเชื้อในดิน", feedback: "รากหายใจทำหน้าที่แลกเปลี่ยนแก๊ส ไม่ได้ปล่อยสารพิษ" }
    hints:
      - "ดินเลนมักขาดออกซิเจน รากที่อยู่ในดินจึงต้องการอากาศ"
      - "รากหายใจอยู่เหนือโคลนบางส่วน"
    solution: "รากหายใจของแสมโผล่พ้นโคลนเพื่อรับอากาศ ช่วยให้รากที่อยู่ใต้โคลนหายใจได้ในดินเลนที่ขาดออกซิเจน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-adaptations.p003
    topics: [biology.plants.plant-adaptations]
    difficulty: 2
    type: mcq
    stem: "รากค้ำของไทรและข้าวโพดงอกจากส่วนใดของต้น"
    choices:
      - { id: a, text: "ลำต้นเหนือพื้นดิน", correct: true }
      - { id: b, text: "ใบที่อยู่ด้านล่างสุด", feedback: "รากค้ำงอกจากลำต้น ไม่ได้งอกจากใบ" }
      - { id: c, text: "ดอกที่ร่วงลงดิน", feedback: "รากค้ำงอกจากลำต้น ไม่ได้มาจากดอก" }
      - { id: d, text: "เมล็ดที่อยู่ในดิน", feedback: "รากค้ำงอกจากลำต้นที่โตแล้ว ไม่ได้งอกจากเมล็ดโดยตรง" }
    hints:
      - "รากค้ำมีหน้าที่พยุงต้นจากด้านบน"
      - "ลองนึกถึงรากที่โผล่ออกจากโคนต้นไทร"
    solution: "รากค้ำเป็นรากที่งอกจากลำต้นเหนือพื้นดินลงสู่พื้นเพื่อช่วยพยุงต้นให้แข็งแรง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-adaptations.p004
    topics: [biology.plants.plant-adaptations]
    difficulty: 2
    type: mcq
    stem: "หม้อของหม้อข้าวหม้อแกงลิงเป็นอวัยวะที่ดัดแปลงมาจากส่วนใด"
    choices:
      - { id: a, text: "ใบ", correct: true }
      - { id: b, text: "ลำต้น", feedback: "ลำต้นไม่ได้พับเป็นภาชนะในหม้อข้าวหม้อแกงลิง" }
      - { id: c, text: "ราก", feedback: "รากไม่ได้พับเป็นภาชนะจับแมลงในพืชชนิดนี้" }
      - { id: d, text: "ดอก", feedback: "ดอกของหม้อข้าวหม้อแกงลิงอยู่ที่ปลายก้านช่อดอก ไม่ได้เป็นหม้อ" }
    hints:
      - "ดูว่าหม้อมีตำแหน่งอยู่ที่ใดของต้น"
      - "ใบของพืชชนิดนี้ดัดแปลงให้ปลายใบยืดออกและพับเป็นภาชนะ"
    solution: "หม้อของหม้อข้าวหม้อแกงลิงเป็นใบดัดแปลงที่ปลายใบยืดเป็นภาชนะจับแมลง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-adaptations.p005
    topics: [biology.plants.plant-adaptations]
    difficulty: 2
    type: mcq
    stem: "ไฟโทโครมในพืชตอบสนองต่อแสงสีใดเป็นหลักในการเปลี่ยนไปเป็นรูปที่ออกฤทธิ์"
    choices:
      - { id: a, text: "แสงสีแดง", correct: true }
      - { id: b, text: "แสงสีแดงไกล", feedback: "แสงสีแดงไกลทำให้ไฟโทโครมเปลี่ยนกลับ ไม่ใช่เปลี่ยนไปเป็นรูปที่ออกฤทธิ์" }
      - { id: c, text: "แสงสีเขียว", feedback: "พืชดูดซับแสงสีเขียวได้น้อย และไม่ใช่ตัวกระตุ้นไฟโทโครมหลัก" }
      - { id: d, text: "ความมืดสนิท", feedback: "ความมืดไม่ได้กระตุ้นการเปลี่ยนรูปของไฟโทโครม" }
    hints:
      - "แสงที่มีความยาวคลื่นสั้นกว่าแสงแดงไกลคือแสงสีแดง"
      - "มีแสงหนึ่งที่ทำให้ไฟโทโครมกลับสู่รูปเดิม"
    solution: "แสงสีแดงเปลี่ยนไฟโทโครมจากรูปที่ไม่ออกฤทธิ์ไปเป็นรูปที่ออกฤทธิ์ ส่วนแสงสีแดงไกลเปลี่ยนกลับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-adaptations.p006
    topics: [biology.plants.plant-adaptations]
    difficulty: 2
    type: mcq
    stem: "พืชวันสั้นจะออกดอกเมื่อใด"
    choices:
      - { id: a, text: "เมื่อช่วงกลางคืนยาวกว่าช่วงวิกฤติ", correct: true }
      - { id: b, text: "เมื่อช่วงกลางวันยาวกว่าช่วงวิกฤติ", feedback: "นั่นคือเงื่อนไขของพืชวันยาว ไม่ใช่พืชวันสั้น" }
      - { id: c, text: "เมื่อช่วงกลางคืนสั้นกว่าช่วงวิกฤติ", feedback: "ถ้ากลางคืนสั้นเกินไป พืชวันสั้นจะไม่ออกดอก" }
      - { id: d, text: "ไม่ขึ้นกับความยาวของช่วงแสงหรือช่วงมืดเลย", feedback: "การออกดอกของพืชวันสั้นขึ้นกับความยาวของช่วงมืดโดยตรง" }
    hints:
      - "ชื่อ 'วันสั้น' บอกว่าพืชชนิดนี้ตอบสนองต่อช่วงแสงที่สั้น"
      - "ถ้าช่วงมืดยาว วันจะสั้นตามไปด้วย"
    solution: "พืชวันสั้นออกดอกเมื่อช่วงกลางคืนยาวกว่าช่วงวิกฤติ ซึ่งเทียบเท่ากับวันสั้นกว่าช่วงวิกฤติ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-adaptations.p007
    topics: [biology.plants.plant-adaptations]
    difficulty: 2
    type: mcq
    stem: "แบคทีเรียในปมรากถั่วทำหน้าที่สำคัญต่อพืชอย่างไร"
    choices:
      - { id: a, text: "ตรึงแก๊สไนโตรเจนจากอากาศให้เป็นแอมโมเนียที่พืชใช้ได้", correct: true }
      - { id: b, text: "สร้างฟอสฟอรัสเพิ่มในดิน", feedback: "แบคทีเรียในปมรากไม่ได้สร้างฟอสฟอรัส หน้าที่หลักคือการตรึงไนโตรเจน" }
      - { id: c, text: "ย่อยเซลลูโลสในผนังเซลล์ของลำต้น", feedback: "แบคทีเรียในปมรากไม่ได้ทำหน้าที่ย่อยผนังเซลล์ลำต้น" }
      - { id: d, text: "ทำให้ใบเปลี่ยนเป็นหนาม", feedback: "การเปลี่ยนใบเป็นหนามเป็นการดัดแปลงของพืช ไม่ใช่หน้าที่ของแบคทีเรียในปมราก" }
    hints:
      - "พืชตระกูลถั่วต้องการไนโตรเจนมาก แต่ไนโตรเจนในอากาศพืชใช้ไม่ได้โดยตรง"
      - "เอนไซม์ไนโตรจีเนสของแบคทีเรียทำให้ไนโตรเจนเปลี่ยนรูป"
    solution: "แบคทีเรียไรโซเบียมในปมรากใช้เอนไซม์ไนโตรจีเนสตรึงแก๊สไนโตรเจนเป็นแอมโมเนีย พืชจึงนำไปสร้างโปรตีนได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-adaptations.p008
    topics: [biology.plants.plant-adaptations]
    difficulty: 2
    type: mcq
    stem: "ไมคอร์ไรซาช่วยให้พืชได้ประโยชน์หลักอย่างไร"
    choices:
      - { id: a, text: "เพิ่มพื้นที่ดูดน้ำและแร่ธาตุ เช่น ฟอสฟอรัส ให้พืช", correct: true }
      - { id: b, text: "ทำให้รากมีคลอโรฟิลล์เพื่อสังเคราะห์แสง", feedback: "ไมคอร์ไรซาไม่ได้ทำให้รากมีคลอโรฟิลล์" }
      - { id: c, text: "ฆ่าแมลงที่กินราก", feedback: "ไมคอร์ไรซาไม่ได้มีหน้าที่ฆ่าแมลง" }
      - { id: d, text: "ทำให้ใบร่วงเร็วขึ้น", feedback: "ไมคอร์ไรซาไม่ได้เกี่ยวข้องกับการร่วงของใบโดยตรง" }
    hints:
      - "เส้นใยของเชื้อรายื่นออกไปไกลกว่ารากพืช"
      - "ฟอสฟอรัสเป็นแร่ธาตุที่พืชดูดได้ยากในดินบางชนิด"
    solution: "เส้นใยของเชื้อราไมคอร์ไรซาทำให้พื้นที่ดูดน้ำและแร่ธาตุของรากขยายออกไป ช่วยให้พืชดูดฟอสฟอรัสและน้ำได้ดีขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-adaptations.p009
    topics: [biology.plants.plant-adaptations]
    difficulty: 2
    type: mcq
    stem: "ฝอยทองซึ่งเป็นพืชเบียนดูดน้ำและอาหารจากพืชอาศัยด้วยโครงสร้างใด"
    choices:
      - { id: a, text: "ฮอสทอเรียม", correct: true }
      - { id: b, text: "รากหายใจ", feedback: "รากหายใจของแสมช่วยรับอากาศ ไม่ได้ดูดอาหารจากพืชอื่น" }
      - { id: c, text: "รากค้ำ", feedback: "รากค้ำช่วยพยุงต้น ไม่ได้ดูดอาหารจากพืชอื่น" }
      - { id: d, text: "มือเกาะ", feedback: "มือเกาะช่วยพันเกาะ ไม่ได้ดูดอาหารจากพืชอื่น" }
    hints:
      - "โครงสร้างนี้เจาะเข้าไปในท่อลำเลียงของพืชอื่น"
      - "ชื่อโครงสร้างนี้มาจากคำที่แปลว่าอวัยวะดูดอาหาร"
    solution: "ฝอยทองใช้ฮอสทอเรียมเจาะเข้าท่อลำเลียงของพืชอาศัยเพื่อดูดน้ำและอาหาร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-adaptations.p010
    topics: [biology.plants.plant-adaptations]
    difficulty: 2
    type: mcq
    stem: "พืชกินแมลงเช่นหม้อข้าวหม้อแกงลิงมักขึ้นในดินที่ขาดธาตุใดเป็นหลัก"
    choices:
      - { id: a, text: "ไนโตรเจน", correct: true }
      - { id: b, text: "น้ำ", feedback: "พืชกินแมลงมักขึ้นในที่ชื้น ปัญหาหลักของดินคือการขาดธาตุอาหาร ไม่ใช่การขาดน้ำ" }
      - { id: c, text: "แสงแดด", feedback: "พืชกินแมลงยังสังเคราะห์แสงได้ ปัญหาหลักคือธาตุอาหารในดิน" }
      - { id: d, text: "คาร์บอนไดออกไซด์", feedback: "พืชได้คาร์บอนไดออกไซด์จากอากาศ ปัญหาในดินคือธาตุอาหาร" }
    hints:
      - "ธาตุที่พืชใช้ในการสร้างโปรตีนและกรดนิวคลีอิก"
      - "แมลงที่ตกลงไปในหม้อเป็นแหล่งของธาตุนี้"
    solution: "พืชกินแมลงมักขึ้นในดินที่ขาดไนโตรเจนและแร่ธาตุ จึงได้ไนโตรเจนจากการย่อยแมลงเป็นส่วนเสริม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-adaptations.p011
    topics: [biology.plants.plant-adaptations]
    difficulty: 3
    type: mcq
    stem: "เมื่อแมลงกัดกินใบ สารใดมีบทบาทสำคัญในการส่งสัญญาณให้พืชผลิตสารป้องกันทั้งต้น"
    choices:
      - { id: a, text: "กรดจัสโมนิก", correct: true }
      - { id: b, text: "ออกซิน", feedback: "ออกซินมีบทบาทหลักในการยืดตัวของลำต้นและทิศทางการเจริญ ไม่ใช่สัญญาณป้องกันจากบาดแผลหลัก" }
      - { id: c, text: "จิบเบอเรลลิน", feedback: "จิบเบอเรลลินกระตุ้นการยืดตัวและการงอกของเมล็ด" }
      - { id: d, text: "กรดแอบไซซิก", feedback: "กรดแอบไซซิกเกี่ยวข้องกับความเครียดจากน้ำและการพักตัวของเมล็ด ไม่ใช่สัญญาณหลักจากแมลงกัด" }
    hints:
      - "ชื่อสารนี้มาจากคำว่าจัสโมน ซึ่งเป็นกลิ่นของดอกมะลิ"
      - "สารนี้ถูกผลิตขึ้นเมื่อเนื้อเยื่อเสียหาย"
    solution: "บาดแผลจากแมลงกระตุ้นการผลิตกรดจัสโมนิก ซึ่งเป็นสัญญาณให้เซลล์อื่นและใบอื่นสร้างสารป้องกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-adaptations.p012
    topics: [biology.plants.plant-adaptations]
    difficulty: 3
    type: mcq
    stem: "สารทุติยภูมิบางชนิด เช่น อัลคาลอยด์ ช่วยพืชโดยหลักอย่างไร"
    choices:
      - { id: a, text: "ทำให้พืชไม่น่ากินหรือเป็นพิษต่อสัตว์ที่มากิน", correct: true }
      - { id: b, text: "ช่วยให้พืชสังเคราะห์แสงได้มากขึ้น", feedback: "การสังเคราะห์แสงเกิดจากคลอโรฟิลล์และระบบแสง ไม่ได้ขึ้นกับสารทุติยภูมิโดยตรง" }
      - { id: c, text: "เป็นแหล่งพลังงานหลักของพืชในการหายใจระดับเซลล์", feedback: "พลังงานหลักของพืชมาจากน้ำตาลที่สร้างจากการสังเคราะห์แสง" }
