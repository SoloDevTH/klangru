  stem: บนวงกลมของมอร์ (ตกลงว่า $\tau$ บวกชี้ลง) จุด X ของหน้า $x$ อยู่ที่ $(50, 40)$ จุดศูนย์กลาง $C = 20$ ถ้าหมุนชิ้นส่วนทวนเข็มนาฬิกา $\theta = 45^\circ$ จุดของหน้า $x'$ อยู่ที่ใด
  choices:
  - id: a
    text: หมุนรัศมี CX ทวนเข็มนาฬิกา $90^\circ$ ได้จุด $(60, -30)$
    correct: true
  - id: b
    text: หมุนรัศมี CX ทวนเข็มนาฬิกา $45^\circ$
    feedback: มุมบนวงกลมเป็นสองเท่าของมุมบนชิ้นส่วน
  - id: c
    text: จุด $(70, 0)$ ซึ่งเป็นความเค้นหลัก
    feedback: ระนาบหลักอยู่ที่ $\theta_p = 26.57^\circ$ ไม่ใช่ $45^\circ$
  - id: d
    text: จุด $(-10, -40)$ ซึ่งเป็นหน้า $y$
    feedback: หน้า $y$ คือการหมุน $90^\circ$ บนชิ้นส่วน หรือ $180^\circ$ บนวงกลม
  hints:
  - CX $= (30, 40)$ ใน (ทิศ $\sigma$, ทิศ $\tau$ ชี้ลง)
  - หมุนเวกเตอร์ $90^\circ$ แล้วบวกกลับกับ C และตรวจด้วยสมการแปลง
  solution: 'บนวงกลมหมุน $2\theta = 90^\circ$ เวกเตอร์ CX $= (30, 40)$ (ทิศ $\tau$ ชี้ลง) หมุนทวนเข็มนาฬิกาบนภาพได้ $(40, -30)$ จุดใหม่จึงเป็น $(20 + 40, -30) = (60, -30)$ ตรวจด้วยสมการแปลง: $\sigma_{x''} = 20 + 30\cos 90^\circ + 40\sin 90^\circ = 60$ และ $\tau_{x''y''} = -30\sin 90^\circ + 40\cos 90^\circ = -30$'
