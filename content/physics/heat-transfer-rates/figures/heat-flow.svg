<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" font-family="sans-serif">
<title>ผนังสามชั้นที่มีความร้อนไหลจากด้านร้อนไปด้านเย็น</title>
<defs><marker id="rh" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="720" height="372" fill="#ffffff"/>
<rect x="120" y="90" width="110" height="170" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="175.0" y="282" text-anchor="middle" font-size="13" fill="#111" font-weight="normal">ชั้นที่ 1</text>
<rect x="230" y="90" width="60" height="170" fill="#bfdbfe" stroke="#334155" stroke-width="2"/>
<text x="260.0" y="282" text-anchor="middle" font-size="13" fill="#111" font-weight="normal">ชั้นที่ 2</text>
<rect x="290" y="90" width="90" height="170" fill="#d9f99d" stroke="#334155" stroke-width="2"/>
<text x="335.0" y="282" text-anchor="middle" font-size="13" fill="#111" font-weight="normal">ชั้นที่ 3</text>
<text x="60" y="165.0" text-anchor="middle" font-size="13" fill="#b91c1c" font-weight="bold">ด้านร้อน</text>
<text x="60" y="185.0" text-anchor="middle" font-size="15" fill="#b91c1c" font-weight="bold">T₁</text>
<text x="440" y="165.0" text-anchor="middle" font-size="13" fill="#1d4ed8" font-weight="bold">ด้านเย็น</text>
<text x="440" y="185.0" text-anchor="middle" font-size="15" fill="#1d4ed8" font-weight="bold">T₂</text>
<line x1="80" y1="140" x2="112" y2="140" stroke="#dc2626" stroke-width="3" marker-end="url(#rh)"/>
<line x1="388" y1="140" x2="420" y2="140" stroke="#dc2626" stroke-width="3" marker-end="url(#rh)"/>
<line x1="80" y1="180" x2="112" y2="180" stroke="#dc2626" stroke-width="3" marker-end="url(#rh)"/>
<line x1="388" y1="180" x2="420" y2="180" stroke="#dc2626" stroke-width="3" marker-end="url(#rh)"/>
<line x1="80" y1="220" x2="112" y2="220" stroke="#dc2626" stroke-width="3" marker-end="url(#rh)"/>
<line x1="388" y1="220" x2="420" y2="220" stroke="#dc2626" stroke-width="3" marker-end="url(#rh)"/>
<text x="250.0" y="68" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">ความร้อนไหลจากด้านร้อนไปด้านเย็น</text>
<text x="250.0" y="328" text-anchor="middle" font-size="12" fill="#444" font-weight="normal">ความหนาของแต่ละชั้นไม่เท่ากัน อัตราการไหลขึ้นกับทั้งสามชั้นพร้อมกัน</text>
<text x="250.0" y="354" text-anchor="middle" font-size="12" fill="#666" font-weight="normal">ภาพไม่ได้วาดตามมาตราส่วน</text>
</svg>