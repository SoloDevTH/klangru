<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" font-family="sans-serif">
<title>ภาพจากโฆษณาเครื่องดื่มสมมุติ</title>
<defs></defs>
<rect x="0" y="0" width="700" height="380" fill="#fff"/>
<rect x="10.0" y="10.0" width="680.0" height="360.0" rx="14" fill="#fff6e5" stroke="#d35400" stroke-width="3"/>
<text x="350.0" y="60.0" font-size="30" text-anchor="middle" fill="#d35400" font-weight="bold">นมสมองไว ตราดาวเด่น</text>
<text x="350.0" y="108.0" font-size="26" text-anchor="middle" fill="#222" font-weight="bold">ดื่มวันละขวด เก่งขึ้นทันที!</text>
<text x="350.0" y="152.0" font-size="20" text-anchor="middle" fill="#333" font-weight="normal">"ลูกผมดื่มแล้ว สอบได้ที่ 1 ของห้องเลยครับ"</text>
<text x="350.0" y="182.0" font-size="16" text-anchor="middle" fill="#666" font-weight="normal">— คุณพ่อในโฆษณา</text>
<rect x="150.0" y="206.0" width="400.0" height="70.0" rx="10" fill="#fff" stroke="#d35400" stroke-width="2"/>
<text x="350.0" y="236.0" font-size="20" text-anchor="middle" fill="#222" font-weight="normal">ทุกคนดื่มกันแล้ว</text>
<text x="350.0" y="264.0" font-size="20" text-anchor="middle" fill="#c0392b" font-weight="bold">อย่าให้ลูกคุณตามไม่ทัน!</text>
<text x="350.0" y="322.0" font-size="20" text-anchor="middle" fill="#222" font-weight="normal">ขวดละ 25 บาท  ซื้อ 10 ขวด แถม 1 ขวด</text>
<text x="350.0" y="352.0" font-size="14" text-anchor="middle" fill="#777" font-weight="normal">(โฆษณาสมมุติ ใช้ฝึกประเมินสื่อ)</text>
</svg>
