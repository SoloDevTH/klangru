id: physics.dynamics.friction
subject: physics
title: { th: แรงเสียดทาน, en: Friction }
summary: แยกแรงเสียดทานสถิตกับแรงเสียดทานจลน์ ใช้สัมประสิทธิ์ความเสียดทานคำนวณแรงเสียดทาน และหาความเร่งของกล่องที่ถูกลากบนพื้นราบ
difficulty: 4.5
minutes: 40
prerequisites: [physics.dynamics.weight-normal]
encompasses:
  - { id: physics.dynamics.weight-normal, weight: 0.5 }
  - { id: physics.dynamics.newton-second, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: friction-graph.svg
    alt: "กราฟแรงเสียดทาน (แกนตั้ง) กับแรงผลัก (แกนนอน) ของกล่องที่มีแรงปฏิกิริยาตั้งฉาก 50 N ช่วงแรกเป็นเส้นตรงจากจุดกำเนิดขึ้นถึง 30 N ที่แรงผลัก 30 N (กล่องนิ่ง แรงเสียดทานเท่ากับแรงผลัก) แล้วลดลงเป็น 20 N และคงที่เมื่อแรงผลักมากกว่า 30 N (กล่องไถล)"
    caption: "แรงเสียดทานสถิตเพิ่มตามแรงผลักจนถึงค่าสูงสุด แล้วกล่องไถลด้วยแรงเสียดทานจลน์ที่น้อยกว่า"
  - type: worked-example
    title: หาสัมประสิทธิ์ความเสียดทานด้วยตาชั่งสปริง
    problem: "ลากกล่องไม้หนัก $8\\ \\mathrm{N}$ บนโต๊ะด้วยตาชั่งสปริงในแนวราบ ขณะกล่องเคลื่อนที่ด้วยความเร็วคงตัว ตาชั่งอ่านได้ $3.2\\ \\mathrm{N}$ หา $\\mu_k$ และทำนายค่าที่อ่านได้เมื่อวางตุ้ม $8\\ \\mathrm{N}$ บนกล่องแล้วลากด้วยความเร็วคงตัวอีกครั้ง"
    steps:
      - text: "ความเร็วคงตัว แรงลัพธ์แนวราบเป็นศูนย์ แรงเสียดทานจลน์ $= 3.2\\ \\mathrm{N}$"
        why: "ถ้ากล่องเร่ง แรงดึงจะมากกว่าแรงเสียดทาน จึงต้องลากด้วยความเร็วคงตัว"
      - text: "พื้นราบ $N$ เท่ากับน้ำหนัก $8\\ \\mathrm{N}$ ดังนั้น $\\mu_k = \\dfrac{3.2}{8} = 0.4$"
      - text: "วางตุ้มเพิ่ม $N = 16\\ \\mathrm{N}$ แรงเสียดทาน $= 0.4 \\times 16 = 6.4\\ \\mathrm{N}$"
        why: "ผิวสัมผัสเดิม $\\mu_k$ จึงเท่าเดิม แรงเสียดทานแปรผันตรงกับ $N$"
    answer: "$\\mu_k = 0.4$ และตาชั่งจะอ่านได้ $6.4\\ \\mathrm{N}$"
  - { type: check, problem: phy.fric.p015, prompt: "อ่านค่าจากกราฟแรงเสียดทาน" }
  - type: worked-example
    title: ลังในกระบะรถที่กำลังเร่ง
    problem: "ลังวางอยู่ในกระบะรถดังรูป สัมประสิทธิ์ความเสียดทานสถิตระหว่างลังกับพื้นกระบะเป็น $0.4$ รถเร่งได้มากที่สุดเท่าใดโดยลังไม่ไถล ใช้ $g = 9.8\\ \\mathrm{m/s^2}$"
    figure:
      src: truck-box.svg
      alt: "รถกระบะด้านข้าง มีลังวางอยู่ในกระบะท้าย ลูกศรความเร่ง a ชี้ไปทางขวาซึ่งเป็นทิศที่รถกำลังเร่ง"
    steps:
      - text: "ถ้าไม่มีแรงเสียดทาน ลังจะอยู่ที่เดิมขณะกระบะเลื่อนไปข้างหน้า แปลว่าลังมีแนวโน้มไถลไปทางท้ายรถเทียบกับกระบะ"
      - text: "แรงเสียดทานสถิตจึงชี้ **ไปข้างหน้า** และเป็นแรงเดียวในแนวราบที่ทำให้ลังเร่งตามรถ: $f_s = ma$"
        why: "แรงเสียดทานต้านการไถลระหว่างผิว ไม่ได้ต้านการเคลื่อนที่ของลังเทียบกับถนน"
      - text: "$f_s$ สูงสุดคือ $\\mu_s mg$ ดังนั้น $ma_{\\max} = \\mu_s mg$ ได้ $a_{\\max} = \\mu_s g = 0.4 \\times 9.8 = 3.92\\ \\mathrm{m/s^2}$"
        why: "มวลของลังตัดกันหมด ลังหนักหรือเบาจึงไถลที่ความเร่งเท่ากัน"
    answer: "รถเร่งได้ไม่เกิน $3.92\\ \\mathrm{m/s^2}$ ถ้าเร่งมากกว่านี้ ลังจะไถลไปทางท้ายกระบะ"
  - { type: check, problem: phy.fric.p016, prompt: "แรงเสียดทานบนลังชี้ทางไหน" }
  - type: interactive
    title: แรงเสียดทานสูงสุดกับแรงปฏิกิริยาตั้งฉาก
    caption: แกนนอนคือแรงปฏิกิริยาตั้งฉาก N (นิวตัน) แกนตั้งคือแรงเสียดทาน (นิวตัน) เส้นบนคือแรงเสียดทานสถิตสูงสุด μs·N และเส้นล่างคือแรงเสียดทานจลน์ μk·N ทั้งสองเป็นเส้นตรงผ่านจุดกำเนิด ลองปรับให้ μk น้อยกว่า μs แล้วสังเกตว่าแรงที่ใช้ให้กล่องเริ่มขยับมากกว่าแรงเสียดทานขณะไถล
    widget:
      kind: function-plot
      functions: ["s x", "k x"]
      sliders:
        - { name: s, min: 0.1, max: 1, step: 0.05, value: 0.6, label: μs (สถิต) }
        - { name: k, min: 0.1, max: 1, step: 0.05, value: 0.4, label: μk (จลน์) }
      x: [0, 500]
      y: [0, 500]
  - type: simulation
    title: ผลักกล่องบนพื้นที่มีแรงเสียดทาน (PhET Forces and Motion Basics)
    url: https://phet.colorado.edu/en/simulations/forces-and-motion-basics
    provider: phet
    note: เปิดแท็บ Friction เปิดการแสดงแรง แล้วค่อย ๆ เพิ่มแรงผลัก ตอนกล่องยังไม่ขยับ แรงเสียดทานจะโตตามแรงผลักพอดี พอกล่องเริ่มไถล แรงเสียดทานจะลดลงเล็กน้อยแล้วคงที่ ลองวางกล่องซ้อนกันเพื่อเพิ่มแรงปฏิกิริยาตั้งฉาก
glossary:
  - { term: แรงเสียดทานสถิต, definition: "แรงเสียดทานขณะวัตถุยังไม่ไถล มีขนาดเท่าที่จำเป็นเพื่อต้านแรงที่พยายามทำให้ไถล ตั้งแต่ 0 ถึงค่าสูงสุด $\\mu_s N$" }
  - { term: แรงเสียดทานจลน์, definition: "แรงเสียดทานขณะวัตถุไถลบนผิว มีขนาด $f_k = \\mu_k N$ เกือบคงตัว และมีทิศตรงข้ามกับการไถล" }
  - { term: สัมประสิทธิ์ความเสียดทาน, definition: "จำนวนที่ไม่มีหน่วย ($\\mu$) บอกว่าผิวคู่หนึ่งฝืดเพียงใด ขึ้นกับชนิดของผิวทั้งสอง" }
flashcards:
  - { front: "แรงเสียดทานจลน์คำนวณอย่างไร", back: "$f_k = \\mu_k N$ เมื่อ $N$ คือแรงปฏิกิริยาตั้งฉาก" }
  - { front: "ผลักกล่องด้วยแรง $30\\ \\mathrm{N}$ แต่กล่องไม่ขยับ แรงเสียดทานเป็นเท่าใด", back: "$30\\ \\mathrm{N}$ พอดี (ทิศตรงข้ามกับแรงผลัก) แรงเสียดทานสถิตมีขนาดเท่าที่จำเป็นเท่านั้น" }
  - { front: "โดยทั่วไป $\\mu_s$ กับ $\\mu_k$ ค่าใดมากกว่า", back: "$\\mu_s$ มากกว่า ทำให้ต้องออกแรงเริ่มขยับมากกว่าแรงที่ใช้ลากให้ไถลต่อไป" }
  - { front: "กล่องไถลบนพื้นราบโดยไม่มีแรงอื่นในแนวราบ จะหน่วงด้วยความเร่งเท่าใด", back: "$a = \\mu_k g$ ไม่ขึ้นกับมวลของกล่อง" }
  - { front: "ทดลองหา $\\mu_k$ ด้วยตาชั่งสปริงอย่างไร", back: "ลากกล่องด้วยความเร็วคงตัว แรงที่อ่านได้คือแรงเสียดทานจลน์ เขียนกราฟแรงเสียดทานกับ $N$ ความชันคือ $\\mu_k$" }
