id: computer.programming.block-programming
subject: computer
title: { th: เขียนโปรแกรมแบบบล็อกและหาข้อผิดพลาด, en: "Block-based programming and debugging" }
summary: สั่งหุ่นยนต์ด้วยบัตรคำสั่งและโปรแกรมแบบบล็อก ใช้ลำดับ วงวน เหตุการณ์ และตัวแปร วางแผนก่อนเขียน ไล่หาบั๊กแล้วแก้ทีละอย่าง และให้เครดิตผลงานผู้อื่น
difficulty: 1.5
minutes: 35
prerequisites: [computer.algorithms.intro]
encompasses:
  - { id: computer.algorithms.intro, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: loop-square.svg
    alt: "ด้านซ้ายเป็นโปรแกรมบล็อก บล็อกเหตุการณ์ เมื่อกดปุ่มเริ่ม ต่อด้วยบล็อก ทำซ้ำ 4 ครั้ง ที่มีบล็อก เดินหน้า 2 ช่อง และ เลี้ยวขวา อยู่ข้างใน ด้านขวาเป็นตาราง 5 คูณ 5 คอลัมน์ A ถึง E แถว 1 ถึง 5 หุ่นยนต์อยู่ที่ B4 หันขึ้น เส้นประแสดงเส้นทาง B4 ขึ้นไป B2 ไปทางขวาถึง D2 ลงมา D4 แล้วกลับมาทางซ้ายถึง B4 เป็นรูปสี่เหลี่ยมจัตุรัส"
    caption: "บล็อกสองบล็อกในวงวนทำซ้ำ 4 รอบ ได้ผลเท่ากับต่อบล็อก 8 บล็อก"
  - type: worked-example
    title: ไล่โปรแกรมที่มีวงวนทีละรอบ
    problem: "จากภาพด้านบน หุ่นยนต์เริ่มที่ B4 หันขึ้น โปรแกรมคือ ทำซ้ำ 4 ครั้ง: เดินหน้า 2 ช่อง แล้วเลี้ยวขวา หุ่นยนต์ผ่านช่องใดบ้าง และจบที่ใด"
    steps:
      - text: "รอบที่ 1: หันขึ้น เดิน 2 ช่องจาก B4 ไป B3 และ B2 แล้วเลี้ยวขวา ตอนนี้หันไปทางขวา"
        why: "เดินหน้าคือเดินไปทางที่หุ่นยนต์หันอยู่ ซึ่งตอนเริ่มคือขึ้นบน"
      - text: "รอบที่ 2: เดิน 2 ช่องไปทางขวา ผ่าน C2 ถึง D2 แล้วเลี้ยวขวา ตอนนี้หันลง"
      - text: "รอบที่ 3: เดินลง 2 ช่อง ผ่าน D3 ถึง D4 แล้วเลี้ยวขวา ตอนนี้หันไปทางซ้าย"
        why: "เมื่อหุ่นยนต์หันลง ขวาของหุ่นยนต์คือซ้ายของเราที่มองภาพ ให้นึกว่าตัวเองหันทางเดียวกับหุ่นยนต์"
      - text: "รอบที่ 4: เดินไปทางซ้าย 2 ช่อง ผ่าน C4 กลับถึง B4 แล้วเลี้ยวขวา ตอนนี้หันขึ้นเหมือนตอนเริ่ม"
      - text: "ครบ 4 รอบ วงวนจบ โปรแกรมไม่มีบล็อกอื่นต่อ จึงหยุด"
    answer: "หุ่นยนต์เดินรอบสี่เหลี่ยมจัตุรัส B4 → B2 → D2 → D4 → B4 จบที่ B4 หันขึ้น"
  - { type: check, problem: computer.programming.block-programming.p006, prompt: "ลองไล่วงวนแบบเดียวกันกับโปรแกรมใหม่" }
  - type: worked-example
    title: ดีบักหุ่นยนต์ที่เดินตกขอบ
    problem: "หุ่นยนต์อยู่ที่ A1 (มุมซ้ายบน) หันไปทางขวา ต้องการให้ไปหยุดที่ C3 โดยเขียนโปรแกรม: เดินหน้า 2 ช่อง, เลี้ยวซ้าย, เดินหน้า 2 ช่อง แต่เมื่อรัน หุ่นยนต์เดินออกนอกตาราง ต้องแก้อย่างไร"
    steps:
      - text: "ผลที่คาดไว้: ไปทางขวา 2 ช่องถึง C1 แล้วลงมา 2 ช่องถึง C3"
        why: "เขียนผลที่คาดไว้ก่อน จึงจะเทียบได้ว่าโปรแกรมผิดตรงไหน"
      - text: "ไล่บล็อกที่ 1: เดินหน้า 2 ช่องจาก A1 ถึง C1 ตรงกับที่คาด"
      - text: "ไล่บล็อกที่ 2: เลี้ยวซ้ายขณะหันไปทางขวา ทำให้หุ่นยนต์หันขึ้น แต่เราต้องการให้หันลง จุดนี้คือจุดแรกที่ผิด"
        why: "ถ้ายืนหันไปทางขวาของกระดาน มือขวาของเราชี้ลงล่างของกระดาน จึงต้องเลี้ยวขวา"
      - text: "แก้บล็อกที่ 2 เป็น เลี้ยวขวา แล้วรันใหม่: A1 → C1 หันลง แล้วเดิน C2, C3 หยุดที่ C3 ตรงกับที่คาด"
    answer: "บั๊กอยู่ที่บล็อกที่ 2 ต้องเปลี่ยน เลี้ยวซ้าย เป็น เลี้ยวขวา"
  - { type: check, problem: computer.programming.block-programming.p011, prompt: "หาบล็อกที่ผิดด้วยวิธีเดียวกัน" }
glossary:
  - { term: โปรแกรม (program), definition: "ชุดคำสั่งที่เรียงไว้ให้คอมพิวเตอร์หรือหุ่นยนต์ทำตามทีละคำสั่ง" }
  - { term: บล็อก (block), definition: "คำสั่งในโปรแกรมแบบภาพที่ลากมาต่อกันได้เหมือนตัวต่อ" }
  - { term: วงวน (loop), definition: "คำสั่งที่ทำชุดคำสั่งข้างในซ้ำตามจำนวนครั้งที่กำหนด" }
  - { term: เหตุการณ์ (event), definition: "สิ่งที่ทำให้สคริปต์เริ่มทำงาน เช่น กดปุ่มเริ่มหรือกดลูกศร" }
  - { term: ตัวแปร (variable), definition: "ที่เก็บข้อมูลที่มีชื่อ เช่น คะแนน ค่าเปลี่ยนได้ระหว่างโปรแกรมทำงาน" }
  - { term: บั๊กและดีบัก (bug, debug), definition: "บั๊กคือข้อผิดพลาดในโปรแกรม ดีบักคือการหาและแก้ข้อผิดพลาดนั้น" }
flashcards:
  - { front: "เลี้ยวขวา ทำให้หุ่นยนต์ย้ายช่องหรือไม่", back: "ไม่ย้าย แค่หันตัวอยู่กับที่ ต้องใช้ เดินหน้า จึงย้ายช่อง" }
  - { front: "ทำไมต้องใช้วงวน", back: "ไม่ต้องต่อบล็อกเดิมซ้ำ โปรแกรมสั้น อ่านง่าย แก้ที่เดียวได้" }
  - { front: "ขั้นตอนดีบัก", back: "รัน → เทียบกับผลที่คาดไว้ → ไล่ทีละบล็อกหาจุดแรกที่ผิด → แก้ทีละอย่าง → รันใหม่" }
  - { front: "แผนก่อนเขียนโปรแกรมควรมีอะไร", back: "เป้าหมาย ลำดับเหตุการณ์ และผลที่คาดไว้" }
