      - "$T = 2\\pi\\sqrt{\\dfrac{L}{g}}$ จัดให้ได้ $L = \\dfrac{gT^2}{4\\pi^2}$"
    solution: "คาบธรรมชาติ $T = 3.0\\ \\mathrm{s}$ ดังนั้น $L = \\dfrac{9.8(3.0)^2}{4\\pi^2} = \\dfrac{88.2}{39.5} \\approx 2.23\\ \\mathrm{m}$"
