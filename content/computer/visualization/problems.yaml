problems:
  - id: computer.data.visualization.p001
    topics: [computer.data.visualization]
    difficulty: 1
    type: mcq
    stem: "ต้องการเปรียบเทียบจำนวนนักเรียนที่เลือกกีฬาแต่ละชนิดจากห้าชนิด ควรใช้แผนภาพแบบใดเป็นอันดับแรก"
    choices:
      - { id: b, text: "กราฟเส้นที่ลากเชื่อมห้าชนิดกีฬาตามเวลา", feedback: "กราฟเส้นเหมาะกับการเปลี่ยนแปลงตามเวลา ไม่ใช่การเปรียบเทียบสิ่งที่ไม่มีลำดับเวลา" }
      - { id: c, text: "แผนภาพกระจายของจำนวนนักเรียนกับอายุ", feedback: "แผนภาพกระจายใช้แสดงความสัมพันธ์ของตัวแปรต่อเนื่องสองตัว ไม่เหมาะกับการเทียบห้าหมวด" }
      - { id: a, text: "แผนภูมิแท่ง", correct: true }
      - { id: d, text: "ฮิสโทแกรม", feedback: "ฮิสโทแกรมแสดงการกระจายของค่าตัวเลข ไม่ได้ใช้เทียบหมวดชื่อที่แยกกันชัดเจน" }
    hints:
      - "คำถามคือการเทียบจำนวนของหลายหมวดที่แยกจากกัน"
      - "ความยาวของแท่งเทียบกันได้ง่ายที่สุดเมื่อวางเรียงกัน"
    solution: "การเทียบจำนวนของหลายหมวดที่แยกจากกันเหมาะกับแผนภูมิแท่ง เพราะผู้ดูเทียบความยาวแท่งได้ง่ายและเร็ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.visualization.p002
    topics: [computer.data.visualization]
    difficulty: 1
    type: match
    stem: "จับคู่คำถามที่ต้องการตอบกับแผนภาพที่เหมาะที่สุด"
    pairs:
      - { left: "ค่ามีการเปลี่ยนแปลงอย่างไรตั้งแต่เดือนมกราคมถึงธันวาคม", right: "กราฟเส้น" }
      - { left: "ความสูงกับน้ำหนักของนักเรียนแต่ละคนสัมพันธ์กันหรือไม่", right: "แผนภาพกระจาย" }
      - { left: "คะแนนสอบของนักเรียนส่วนใหญ่กระจุกอยู่ช่วงไหน", right: "ฮิสโทแกรม" }
      - { left: "ยอดขายของแต่ละสาขาเทียบกันอย่างไร", right: "แผนภูมิแท่ง" }
    hints:
      - "คำถามที่มีเวลาเป็นแกนนอนมักใช้กราฟเส้น"
      - "คำถามเรื่องการกระจายของค่าตัวเลขจำนวนมากต้องนับจำนวนในแต่ละช่วง"
    solution: "การเปลี่ยนแปลงตามเวลาใช้กราฟเส้น ความสัมพันธ์ของตัวแปรต่อเนื่องใช้แผนภาพกระจาย การกระจายของคะแนนใช้ฮิสโทแกรม และการเทียบยอดขายของหลายหมวดใช้แผนภูมิแท่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.visualization.p003
    topics: [computer.data.visualization]
    difficulty: 2
    type: mcq
    stem: "เหตุใดแผนภูมิแท่งจึงควรให้แกนค่าเริ่มที่ศูนย์"
    choices:
      - { id: b, text: "เพื่อให้กราฟมีขนาดใหญ่และดูน่าสนใจ", feedback: "ขนาดของกราฟไม่ได้เป็นเหตุผลในการเลือกแกน ความถูกต้องของการเปรียบเทียบต่างหากสำคัญ" }
      - { id: c, text: "เพราะโปรแกรมวาดกราฟไม่สามารถวาดแกนที่ไม่เริ่มที่ศูนย์ได้", feedback: "โปรแกรมสามารถวาดแกนที่ไม่เริ่มที่ศูนย์ได้ แต่ต้องคำนึงถึงผลต่อการตีความ" }
      - { id: d, text: "เพื่อให้กราฟมีสีที่เข้ากันกับหน้าเอกสาร", feedback: "สีไม่เกี่ยวกับการเลือกค่าเริ่มของแกน" }
      - { id: a, text: "ความยาวแท่งต้องสื่อสัดส่วนของค่า ถ้าตัดแกนความต่างจะดูใหญ่เกินจริง", correct: true }
    hints:
      - "คิดถึงว่าผู้ดูเทียบอะไรจากความยาวของแท่ง"
      - "ถ้าแท่งหนึ่งสูงเป็นสองเท่าของอีกแท่ง ค่าจริงควรเป็นสองเท่าด้วย"
    solution: "แผนภูมิแท่งให้ความยาวแทนค่า การตัดแกนที่ไม่เริ่มที่ศูนย์ทำให้ผู้ดูเห็นสัดส่วนผิดไป จึงควรเริ่มที่ศูนย์ หรือบอกชัดเจนถ้าต้องตัด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.visualization.p004
    topics: [computer.data.visualization]
    difficulty: 2
    type: numeric
    stem: "แผนภูมิแท่งมีแกนค่าเริ่มที่ 90 แท่ง A แทนค่า 92 และแท่ง B แทนค่า 96 บนกราฟที่เห็น ความยาวของแท่ง B (นับจาก 90) ยาวกว่าแท่ง A กี่เท่า (ตอบเป็นจำนวนเท่า)"
    answer: { value: 3, unit: เท่า }
    hints:
      - "นับความยาวที่เห็นจากแกนที่เริ่มที่ 90 ไม่ใช่จากศูนย์"
      - "ความยาวของ A ที่เห็นคือ 92 − 90 และของ B คือ 96 − 90"
    misconceptions:
      - { match: 1.04, feedback: "คำนวณจากค่าจริงเทียบกับศูนย์ คือ 96 ÷ 92 แต่แกนที่เห็นเริ่มที่ 90 ดังนั้นต้องใช้ผลต่างจาก 90" }
    solution: "ความยาวที่เห็นของ A = 92 − 90 = 2 ของ B = 96 − 90 = 6 แท่ง B ยาวกว่า A เป็น 6 ÷ 2 = 3 เท่า ทั้งที่ค่าจริงต่างกันเพียงประมาณ 4%"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.visualization.p005
    topics: [computer.data.visualization]
    difficulty: 2
    type: numeric
    stem: "ผู้ตอบแบบสำรวจ 600 คน มี 240 คนเลือกบริการหนึ่ง ควรแสดงสัดส่วนนี้ในแผนภูมิวงกลมเป็นกี่เปอร์เซ็นต์"
    answer: { value: 40, unit: เปอร์เซ็นต์ }
    hints:
      - "สัดส่วน = จำนวนที่เลือกบริการนี้ ÷ จำนวนผู้ตอบทั้งหมด"
      - "คูณ 100 เพื่อเป็นเปอร์เซ็นต์"
    misconceptions:
      - { match: 60, feedback: "นั่นคือสัดส่วนที่ไม่ได้เลือกบริการนี้ ไม่ใช่สัดส่วนที่เลือก" }
    solution: "สัดส่วน = 240 ÷ 600 × 100 = 40% ควรแสดงป้ายว่าเป็นเปอร์เซ็นต์ของผู้ตอบ 600 คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.visualization.p006
    topics: [computer.data.visualization]
    difficulty: 2
    type: mcq
    stem: "ในกราฟที่ใช้สีแยกกลุ่ม ควรทำอย่างไรให้ผู้บกพร่องการมองเห็นสีอ่านได้"
    choices:
      - { id: a, text: "ใช้รูปร่าง ลาย หรือป้ายกำกับเสริมจากสี และเลือกสีที่ความสว่างต่างกันชัด", correct: true }
      - { id: b, text: "ใช้สีแดงกับสีเขียวคู่กันเพื่อให้เด่นชัด", feedback: "คู่สีแดงกับเขียวเป็นคู่ที่ผู้บกพร่องการเห็นสีแยกได้ยาก" }
      - { id: c, text: "ใส่สีมากที่สุดเท่าที่หาได้เพื่อให้ผู้ดูเลือกเอง", feedback: "สีจำนวนมากทำให้แยกได้ยากและไม่ช่วยผู้บกพร่องการมองเห็นสี" }
      - { id: d, text: "ไม่ต้องมีป้ายกำกับเพราะผู้ดูจำสีได้เอง", feedback: "การพึ่งสีอย่างเดียวทำให้ผู้ที่แยกสีไม่ออกอ่านกราฟไม่ได้" }
    hints:
      - "คิดว่าจะให้ข้อมูลผ่านช่องทางอื่นนอกจากสีได้อย่างไร"
      - "ตัวเลือกที่พึ่งสีอย่างเดียวหรือใช้คู่สีที่แยกยากมักไม่เหมาะ"
    solution: "การเพิ่มรูปร่าง ลาย หรือป้ายกำกับทำให้ข้อมูลไม่พึ่งสีอย่างเดียว และเลือกสีที่ความสว่างต่างกันทำให้แยกได้แม้ไม่เห็นสีบางส่วน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.visualization.p007
    topics: [computer.data.visualization]
    difficulty: 2
    type: text
    stem: "เรียกการเลือกเฉพาะช่วงเวลาหรือข้อมูลบางส่วนที่สนับสนุนข้อสรุป โดยไม่แสดงส่วนที่ขัดแย้งว่าอะไร (ตอบเป็นคำไทยหรืออังกฤษ)"
    accepted: ["การเลือกเฉพาะบางส่วน", "การเลือกข้อมูล", "การเลือกเฉพาะส่วนที่สนับสนุน", "cherry-picking", "cherry picking"]
    hints:
      - "คำอังกฤษที่ใช้เรียกเรื่องนี้เปรียบกับการเก็บเฉพาะผลไม้ที่สวยที่สุด"
      - "ปัญหาคือผู้ดูไม่เห็นภาพรวมที่เป็นจริง"
    solution: "การเลือกเฉพาะบางส่วน (cherry-picking) คือการเลือกข้อมูลที่สนับสนุนข้อสรุปและละข้อมูลที่ขัดแย้ง ทำให้ภาพที่เห็นไม่ตรงกับความจริงโดยรวม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.visualization.p008
    topics: [computer.data.visualization]
    difficulty: 3
    type: code
    stem: |
      เขียนฟังก์ชัน `bar_heights(values, max_height)` ที่คืนลิสต์ความสูงของแท่งจำนวนเต็ม โดยแท่งที่มีค่าสูงสุดสูง `max_height` และแท่งอื่นสูงตามสัดส่วนกับค่าสูงสุด แท่งเริ่มจากศูนย์เสมอ ให้ปัดเป็นจำนวนเต็มด้วย `round`
    starter: |
      def bar_heights(values, max_height):
          return []
    tests: |
      assert bar_heights([2, 4, 8], 80) == [20, 40, 80], f"ควรได้ [20, 40, 80] แต่ได้ {bar_heights([2, 4, 8], 80)}"
      assert bar_heights([50, 55], 100) == [91, 100], f"ควรได้ [91, 100] แต่ได้ {bar_heights([50, 55], 100)}"
      assert bar_heights([0, 3], 30) == [0, 30], f"ค่า 0 ต้องได้ความสูง 0 แต่ได้ {bar_heights([0, 3], 30)}"
      assert bar_heights([5, 5], 10) == [10, 10], f"ค่าเท่ากันต้องได้ความสูงเท่ากัน แต่ได้ {bar_heights([5, 5], 10)}"
    reference: |
      def bar_heights(values, max_height):
          top = max(values)
          return [round(v / top * max_height) for v in values]
    hints:
      - "หาค่าสูงสุดในลิสต์ก่อนด้วย max"
      - "ความสูงของแต่ละแท่งเท่ากับ (ค่า ÷ ค่าสูงสุด) × max_height"
      - "ใช้ round ปัดผลลัพธ์ของแต่ละแท่งเป็นจำนวนเต็ม และคืนลิสต์ตามลำดับเดิม"
    solution: "หาค่าสูงสุดแล้วคำนวณสัดส่วนของแต่ละค่า คูณด้วย max_height แล้วปัด เช่น [50, 55] ได้ 50 ÷ 55 × 100 ≈ 90.9 ปัดเป็น 91 และ 55 ได้ 100"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.visualization.p009
    topics: [computer.data.visualization]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการเขียนสรุปการสืบค้นข้อมูลที่มีหลักฐานและข้อจำกัดครบถ้วน จากขั้นแรกไปจนถึงขั้นสุดท้าย"
    items:
      - "ตั้งคำถามที่ต้องการตอบให้ชัด"
      - "เก็บข้อมูลและตรวจความถูกต้องและความครบถ้วน"
      - "วิเคราะห์และเลือกแผนภาพที่ตรงกับคำถาม"
      - "ระบุข้อจำกัดและอคติที่อาจมีในข้อมูลและการวิเคราะห์"
      - "เขียนสรุปผลพร้อมหลักฐานที่ตรวจสอบได้"
    hints:
      - "ก่อนเลือกภาพต้องรู้ก่อนว่าคำถามคืออะไร"
      - "สรุปที่ดีต้องพูดถึงข้อจำกัดก่อนผลสุดท้าย เพื่อให้ผู้อ่านตีความได้ถูกต้อง"
    solution: "เริ่มจากคำถาม เก็บและตรวจข้อมูล วิเคราะห์และเลือกภาพ ระบุข้อจำกัดและอคติ แล้วจึงเขียนสรุปพร้อมหลักฐาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.visualization.p010
    topics: [computer.data.visualization]
    difficulty: 3
    type: mcq
    stem: "ต้องนำเสนอผลการวิเคราะห์ให้ผู้บริหารตัดสินใจ ควรเลือกวิธีใด"
    choices:
      - { id: b, text: "แสดงโค้ดทั้งหมดและตารางข้อมูลดิบทุกแถว", feedback: "ผู้บริหารต้องการข้อสรุปและผลกระทบต่อการตัดสินใจ รายละเอียดดิบทำให้ประเด็นสำคัญหายไป" }
      - { id: a, text: "สรุปคำแนะนำหนึ่งหรือสองข้อพร้อมตัวเลขสำคัญและผลกระทบ และเก็บรายละเอียดทางเทคนิคไว้เป็นภาคผนวก", correct: true }
      - { id: c, text: "ใช้คำศัพท์เทคนิคเต็มรูปแบบเพื่อแสดงความแม่นยำ", feedback: "คำศัพท์เทคนิคที่ไม่อธิบายทำให้ผู้ฟังที่ไม่ใช่ผู้เชี่ยวชาญเข้าใจยาก" }
      - { id: d, text: "ไม่ระบุข้อจำกัดเพื่อให้ผลดูน่าเชื่อถือ", feedback: "การไม่ระบุข้อจำกัดทำให้ผู้ตัดสินใจประเมินความเสี่ยงผิดพลาด" }
    hints:
      - "คิดถึงสิ่งที่ผู้บริหารต้องใช้ตัดสินใจจริง"
      - "รายละเอียดเทคนิคอยู่ที่ใดได้ โดยไม่บดบังข้อสรุป"
    solution: "ผู้บริหารต้องการข้อสรุปที่ตัดสินใจได้ ตัวเลขสำคัญ และผลกระทบ ส่วนรายละเอียดเทคนิคเก็บไว้ในภาคผนวกสำหรับผู้ที่ต้องตรวจสอบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.visualization.p011
    topics: [computer.data.visualization]
    difficulty: 3
    type: numeric
    stem: "ร้านกาแฟ A ขายได้ 480 แก้ว และร้าน B ขายได้ 510 แก้ว ทำแผนภูมิแท่งโดยให้แกนเริ่มที่ 470 แก้ว บนกราฟที่เห็น แท่งของร้าน B สูงกว่าแท่งของร้าน A กี่เท่า (ตอบเป็นจำนวนเท่า)"
    answer: { value: 4, unit: เท่า }
    hints:
      - "หาความยาวที่เห็นของแต่ละแท่งจากแกนที่เริ่มที่ 470"
      - "ความยาวของ A = 480 − 470 และของ B = 510 − 470"
    misconceptions:
      - { match: 1.06, feedback: "คำนวณจากค่าจริงเทียบกับศูนย์ คือ 510 ÷ 480 แต่แกนนี้เริ่มที่ 470 จึงเห็นความต่างใหญ่กว่ามาก" }
    solution: "ความยาวที่เห็นของ A = 10 และของ B = 40 แท่ง B สูงกว่า A เป็น 40 ÷ 10 = 4 เท่า ทั้งที่ยอดขายต่างกันไม่ถึง 7%"
    license: CC-BY-SA-4.0
    ai_assisted: true

