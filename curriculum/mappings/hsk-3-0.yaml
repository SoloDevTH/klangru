  - topic: chinese.writing.short-messages
    indicators: [HSK3.0-L2, HSK3.0-L3]
    coverage: partial
    note: โครงสร้างแนะนำตัว ลำดับเนื้อหา การขยายให้ถึง 100 ตัวอักษร และเขียนอักษรด้วยมือ (写 信) แต่แอปตรวจงานเขียนอิสระไม่ได้ จึงฝึกผ่านการเรียง การหาที่ผิด และการเลือกประโยค
  - topic: chinese.grammar.complex-connectives
    indicators: [HSK3.0-L4]
    coverage: partial
    note: สอนคู่คำเชื่อมตามขอบเขตในแผนพร้อมความต่างของคู่ที่ความหมายใกล้กัน แต่ตามสำเนารายการไวยากรณ์ GF 0025—2021 มีเพียง 无论/不管…都 既然…就 และ 连…都/也 ที่เป็นระดับ 4 (一…就 只要…就 เป็นระดับ 2; 不仅…还 只有…才 越…越 除了…以外 เป็นระดับ 3; 即使…也 เป็นระดับ 5) และยังไม่ได้สอนคู่ระดับ 4 อื่น เช่น 不是…而是 既…又 哪怕…也 假如…就 ไวยากรณ์ระดับ 4 มี 76 จุด บทนี้ครอบคลุมเฉพาะกลุ่มคำเชื่อมบางส่วน และไม่ได้ฝึกการพูดหรือเขียนอิสระ ต้องตรวจกับฉบับทางการก่อนเผยแพร่
  - topic: chinese.reading.longer-passages
    indicators: [HSK3.0-L4]
    coverage: partial
    note: ฝึกหาใจความ รายละเอียด ลำดับเหตุการณ์ การเดาคำจากส่วนประกอบและบริบท และตอบคำถามเลือกตอบ เรียงประโยค เติมคำ ข้อความที่ยาวที่สุดราว 280 ตัวอักษร (อยู่ในเกณฑ์ไม่เกิน 500 ของระดับ 4 แต่ยังไม่ได้ฝึกข้อความยาวเต็ม 500) และไม่วัดความเร็วในการอ่าน 140 ตัวต่อนาที
  - topic: chinese.reading.opinion-texts
    indicators: [HSK3.0-L5]
    coverage: partial
    note: ระบุความคิดหลัก เหตุผล ข้อสรุป และแยกข้อเท็จจริงกับความคิดเห็นในข้อความแสดงความเห็น ข้อความในโจทย์สั้นกว่าเพดาน 700 ตัวอักษรมาก ไม่วัดความเร็ว 160 ตัวต่อนาที และไม่มีการเขียนความเห็นอย่างน้อย 450 ตัวอักษร
  - topic: chinese.writing.narrative-compositions
    indicators: [HSK3.0-L4]
    coverage: partial
    note: สอนรูปแบบบนกระดาษตาราง โครงเรื่องเล่าห้าส่วน คำบอกลำดับและเวลา การบรรยายคน สถานที่ และสิ่งของ และการขยายประโยคสั้นเป็นย่อหน้า แต่แอปตรวจงานเขียนอิสระไม่ได้ โจทย์เป็นการเรียงประโยค หาที่ผิด และเลือกประโยค จึงไม่ครอบคลุมการเขียนเล่าหรืออธิบายอย่างน้อย 300 ตัวอักษรด้วยตนเอง
