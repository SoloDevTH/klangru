problems:
  - id: biology.genetics.linkage-mapping.p001
    topics: [biology.genetics.linkage-mapping]
    difficulty: 1
    type: mcq
    stem: "เหตุใดยีนที่อยู่บนโครโมโซมเดียวกันจึงมักถูกถ่ายทอดไปพร้อมกัน"
    choices:
      - { id: a, text: "เพราะโครโมโซมทั้งแท่งมักถูกส่งไปยังเซลล์สืบพันธุ์ไปด้วยกัน", correct: true }
      - { id: b, text: "เพราะยีนเหล่านั้นมีจำนวนเท่ากับเซลล์ร่างกาย", feedback: "จำนวนยีนไม่ได้เป็นตัวกำหนดการถ่ายทอดร่วมกัน ตำแหน่งบนโครโมโซมต่างหาก" }
      - { id: c, text: "เพราะยีนเหล่านั้นเป็นลักษณะเด่นทั้งหมด", feedback: "ยีนเด่นหรือด้อยไม่ได้ทำให้ยีนเชื่อมโยงกัน" }
      - { id: d, text: "เพราะยีนเหล่านั้นอยู่ในไซโทพลาซึมไม่ใช่นิวเคลียส", feedback: "ยีนอยู่บนโครโมโซมในนิวเคลียสของเซลล์ยูแคริโอต" }
    hints:
      - "ลองนึกว่าในไมโอซิสโครโมโซมแท่งหนึ่งเคลื่อนไปยังขั้วเดียวกันหรือไม่"
      - "ถ้าไม่มีการแลกเปลี่ยนชิ้นส่วน ยีนที่อยู่บนแท่งเดียวกันจะไปด้วยกัน"
    solution: "ยีนบนโครโมโซมเดียวกันอยู่บนแท่งเดียวกัน เมื่อโครโมโซมถูกส่งไปยังเซลล์สืบพันธุ์ ยีนเหล่านั้นจะไปด้วยกันเป็นส่วนใหญ่ จึงเรียกว่ายีนเชื่อมโยง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.linkage-mapping.p002
    topics: [biology.genetics.linkage-mapping]
    difficulty: 1
    type: text
    stem: "หน่วยวัดระยะบนแผนที่ยีนที่เท่ากับความถี่รีคอมบิแนนท์ 1% มีชื่อเรียกว่าอะไร (ตอบชื่อย่อ)"
    accepted: ["cM", "เซนติมอร์แกน", "centimorgan", "centimorgans", "เซนติมอร์แกน (cM)"]
    hints:
      - "หน่วยนี้ตั้งชื่อตามนักวิทยาศาสตร์ที่ศึกษาแมลงหวี่"
      - "ชื่อย่อมีสองตัวอักษร ใช้ตัว c และ M"
    solution: "เซนติมอร์แกน (cM) เท่ากับความถี่รีคอมบิแนนท์ 1% ใช้วัดระยะห่างระหว่างยีนบนโครโมโซม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.linkage-mapping.p003
    topics: [biology.genetics.linkage-mapping]
    difficulty: 2
    type: mcq
    stem: "ครอสซิงโอเวอร์ซึ่งทำให้เกิดรีคอมบิแนนท์เกิดขึ้นในระยะใดของไมโอซิส"
    choices:
      - { id: a, text: "โพรเฟส I เมื่อโครโมโซมคู่เหมือนจับคู่กัน", correct: true }
      - { id: b, text: "เมทาเฟส II เมื่อโครโมโซมเรียงอยู่กลางเซลล์", feedback: "ในเมทาเฟส II โครมาทิดแต่ละแท่งเรียงอยู่แล้ว การแลกเปลี่ยนชิ้นส่วนเกิดก่อนหน้านี้" }
      - { id: c, text: "แอนาเฟส II เมื่อซิสเตอร์โครมาทิดแยกจากกัน", feedback: "ซิสเตอร์โครมาทิดแยกกันในแอนาเฟส II หลังการแลกเปลี่ยนชิ้นส่วนเสร็จแล้ว" }
      - { id: d, text: "เทโลเฟส I เมื่อเซลล์แบ่งครั้งแรกเสร็จ", feedback: "การแลกเปลี่ยนชิ้นส่วนเกิดขึ้นก่อนที่เซลล์จะแบ่งครั้งแรกเสร็จ" }
    hints:
      - "การแลกเปลี่ยนชิ้นส่วนต้องเกิดตอนที่โครโมโซมคู่เหมือนอยู่ชิดกัน"
      - "ระยะนี้เป็นระยะแรกของไมโอซิส I"
    solution: "ครอสซิงโอเวอร์เกิดในโพรเฟส I เมื่อโครโมโซมคู่เหมือนจับคู่กัน (ไซแนปซิส) และแลกเปลี่ยนชิ้นส่วนโครมาทิดกันที่จุดไคแอสมา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.linkage-mapping.p004
    topics: [biology.genetics.linkage-mapping]
    difficulty: 2
    type: mcq
    stem: "หนึ่งเซนติมอร์แกน (cM) เท่ากับอะไร"
    choices:
      - { id: a, text: "ความถี่รีคอมบิแนนท์ 1%", correct: true }
      - { id: b, text: "ความยาวของดีเอ็นเอ 1 นาโนเมตร", feedback: "เซนติมอร์แกนไม่ได้วัดความยาวทางกายภาพโดยตรง แต่วัดจากความถี่รีคอมบิแนนท์" }
      - { id: c, text: "ยีน 1 ยีนที่อยู่ระหว่างสองยีน", feedback: "หน่วยนี้เป็นค่าระยะ ไม่ได้นับจำนวนยีน" }
      - { id: d, text: "ความถี่พ่อแม่ 1%", feedback: "ความถี่พ่อแม่สูงเมื่อยีนอยู่ใกล้กัน ไม่ใช่นิยามของหน่วยนี้" }
    hints:
      - "หน่วยนี้เกี่ยวกับการคำนวณจากจำนวนลูกที่เป็นรีคอมบิแนนท์"
      - "ดูคำจำกัดความของความถี่รีคอมบิแนนท์"
    solution: "1 cM คือความถี่รีคอมบิแนนท์ 1% ดังนั้นความถี่ 8% คือระยะ 8 cM"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.linkage-mapping.p005
    topics: [biology.genetics.linkage-mapping]
    difficulty: 2
    type: numeric
    stem: "นักเรียนในโครงงานวิทยาศาสตร์ผสมทดสอบแมลงหวี่ได้ลูก 1,000 ตัว เป็น AB 460 ตัว ab 460 ตัว Ab 40 ตัว และ aB 40 ตัว ยีนสองยีนนี้ห่างกันกี่เซนติมอร์แกน (ตอบเป็น cM)"
    answer: { value: 8, tolerance: 0, unit: "cM" }
    misconceptions:
      - { match: 92, feedback: "ตอบความถี่ของลูกที่เป็นพ่อแม่แทนรีคอมบิแนนท์ ต้องนับเฉพาะ Ab และ aB" }
      - { match: 4, feedback: "นับเฉพาะรีคอมบิแนนท์หนึ่งกลุ่ม (40 ตัว) แทนที่จะรวม Ab และ aB" }
    hints:
      - "รีคอมบิแนนท์คือลูกที่ได้ลักษณะรวมแบบใหม่ที่ไม่เหมือนพ่อแม่"
      - "นับรีคอมบิแนนท์ทั้งหมดแล้วหารด้วยจำนวนลูกทั้งหมด"
    solution: "รีคอมบิแนนท์ = Ab 40 + aB 40 = 80 ตัว ความถี่ = 80 ÷ 1,000 × 100 = 8% ระยะห่าง 8 cM"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.linkage-mapping.p006
    topics: [biology.genetics.linkage-mapping]
    difficulty: 2
    type: numeric
    stem: "ผู้เลี้ยงไก่พื้นเมืองในภาคอีสานทดสอบพันธุกรรมของยีนสองยีนที่ห่างกัน 20 cM ถ้าลูกทั้งหมด 1,000 ตัว คาดว่าจะเป็นรีคอมบิแนนท์กี่ตัว (ตอบเป็นจำนวนตัว)"
    answer: { value: 200, tolerance: 0, unit: "ตัว" }
    misconceptions:
      - { match: 800, feedback: "ตอบจำนวนของลูกที่เป็นพ่อแม่ ซึ่งคือ 1 − 0.20 เท่าของทั้งหมด" }
      - { match: 100, feedback: "หารระยะด้วยสองโดยไม่คิดว่า 20% เป็นรีคอมบิแนนท์รวมทั้งสองกลุ่ม" }
    hints:
      - "20 cM หมายถึงความถี่รีคอมบิแนนท์ 20%"
      - "คูณความถี่กับจำนวนลูกทั้งหมด"
    solution: "ความถี่รีคอมบิแนนท์ = 20 cM ÷ 100 = 0.20 จำนวนรีคอมบิแนนท์ = 0.20 × 1,000 = 200 ตัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.linkage-mapping.p007
    topics: [biology.genetics.linkage-mapping]
    difficulty: 2
    type: match
    stem: "จับคู่คำศัพท์กับความหมายในเรื่องการเชื่อมโยงของยีน"
    pairs:
      - { left: "ยีนเชื่อมโยง", right: "ยีนบนโครโมโซมเดียวกันที่มักถ่ายทอดไปด้วยกัน" }
      - { left: "ครอสซิงโอเวอร์", right: "การแลกเปลี่ยนชิ้นส่วนระหว่างโครโมโซมคู่เหมือนในโพรเฟส I" }
      - { left: "รีคอมบิแนนท์", right: "แกมีตหรือลูกที่มีการรวมตัวของอัลลีลแบบใหม่" }
      - { left: "เซนติมอร์แกน", right: "หน่วยระยะที่เท่ากับความถี่รีคอมบิแนนท์ 1%" }
    hints:
      - "คำว่า 'ครอส' ชี้ถึงการแลกเปลี่ยนระหว่างโครโมโซม"
      - "รีคอมบิแนนท์คือผลลัพธ์ของการรวมตัวแบบใหม่"
    solution: "ยีนเชื่อมโยงอยู่บนโครโมโซมเดียวกัน ครอสซิงโอเวอร์แลกเปลี่ยนชิ้นส่วน รีคอมบิแนนท์มีการรวมตัวแบบใหม่ และเซนติมอร์แกนวัดระยะจากความถี่รีคอมบิแนนท์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.linkage-mapping.p008
    topics: [biology.genetics.linkage-mapping]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการคำนวณระยะห่างของยีนสองยีนจากผลการผสมทดสอบ"
    items:
      - "นับจำนวนลูกทั้งหมดที่ได้จากการผสมทดสอบ"
      - "นับจำนวนลูกที่เป็นรีคอมบิแนนท์"
      - "หารจำนวนรีคอมบิแนนท์ด้วยจำนวนลูกทั้งหมด"
      - "คูณด้วย 100 เพื่อแปลงเป็นเปอร์เซ็นต์ แล้วใช้เป็นเซนติมอร์แกน"
    hints:
      - "จะคำนวณสัดส่วนได้ต้องรู้ตัวหารก่อน"
      - "ขั้นสุดท้ายเป็นการแปลงสัดส่วนเป็นเปอร์เซ็นต์"
    solution: "นับลูกทั้งหมด นับรีคอมบิแนนท์ หารรีคอมบิแนนท์ด้วยทั้งหมด แล้วคูณ 100 เพื่อได้ระยะเป็น cM"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.linkage-mapping.p009
    topics: [biology.genetics.linkage-mapping]
    difficulty: 2
    type: text
    stem: "นักพันธุศาสตร์ที่ใช้แมลงหวี่ศึกษาและพบว่ายีนบนโครโมโซมเดียวกันมักถ่ายทอดไปด้วยกัน (ค.ศ. 1910) มีชื่อว่าอะไร"
    accepted: ["มอร์แกน", "Morgan", "Thomas Hunt Morgan", "โทมัส ฮันต์ มอร์แกน", "โทมัส มอร์แกน"]
    hints:
      - "ชื่อนักพันธุศาสตร์คนนี้มีนามสกุลที่ขึ้นต้นด้วยตัว M"
      - "ผลงานนี้เกี่ยวกับการค้นพบการเชื่อมโยงของยีนในแมลงหวี่"
    solution: "โทมัส ฮันต์ มอร์แกน (Thomas Hunt Morgan) ศึกษาแมลงหวี่และพบการเชื่อมโยงของยีนในปี ค.ศ. 1910"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.linkage-mapping.p010
    topics: [biology.genetics.linkage-mapping]
    difficulty: 2
    type: mcq
    stem: "ในการผสมทดสอบแมลงหวี่ในห้องปฏิบัติการของโรงเรียนไทย ถ้าความถี่รีคอมบิแนนท์ที่วัดได้เท่ากับ 50% ยีนทั้งสองนี้น่าจะอยู่ในสภาพใด"
    choices:
      - { id: a, text: "อยู่บนคนละโครโมโซมหรืออยู่ไกลกันมากจนดูแยกอิสระ", correct: true }
      - { id: b, text: "อยู่ติดกันมากบนโครโมโซมเดียวกัน", feedback: "ยีนที่อยู่ติดกันมากจะมีความถี่รีคอมบิแนนท์ต่ำ ไม่ใช่ 50%" }
      - { id: c, text: "เป็นยีนเดียวกันที่มีสองอัลลีล", feedback: "อัลลีลของยีนเดียวกันจะไม่แสดงการรวมตัวใหม่แบบนี้" }
      - { id: d, text: "ไม่สามารถผสมทดสอบได้", feedback: "การผสมทดสอบใช้วัดความถี่รีคอมบิแนนท์ได้โดยตรงในทุกกรณี" }
    hints:
      - "50% คือค่าที่สูงสุดที่ความถี่รีคอมบิแนนท์จะมีได้"
      - "ยีนที่แยกอิสระให้ผลแบบเดียวกับยีนที่อยู่ไกลมากบนโครโมโซมเดียวกัน"
    solution: "ความถี่รีคอมบิแนนท์ 50% เกิดกับยีนที่อยู่บนคนละโครโมโซมหรือไกลกันมากจนแยกอิสระได้ ซึ่งวัดระยะไม่ได้ในการทดลองนั้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.linkage-mapping.p011
    topics: [biology.genetics.linkage-mapping]
    difficulty: 3
    type: mcq
    stem: "เหตุใดยีนสองยีนที่อยู่ไกลกันมากบนโครโมโซมเดียวกันจึงดูเหมือนแยกกันอย่างอิสระในการผสมทดสอบ"
    choices:
      - { id: a, text: "ครอสซิงโอเวอร์เกิดขึ้นสองครั้งหรือมากกว่าในช่วงระหว่างยีน ทำให้ผลของการรวมตัวใหม่หักล้างกัน", correct: true }
      - { id: b, text: "ยีนที่อยู่ไกลกันจะถูกลบออกจากโครโมโซมระหว่างไมโอซิส", feedback: "ยีนไม่ได้หายไป แต่ครอสซิงโอเวอร์หลายครั้งทำให้ผลดูเหมือนแยกอิสระ" }
      - { id: c, text: "โครโมโซมแต่ละแท่งจะกลายเป็นสองแท่งเท่ากันทุกครั้ง", feedback: "การแบ่งโครโมโซมคู่หนึ่งเป็นสองแท่งไม่เกี่ยวกับการดูเหมือนแยกอิสระ" }
      - { id: d, text: "ยีนที่อยู่ไกลกันจะกลายพันธุ์พร้อมกันทุกรุ่น", feedback: "การกลายพันธุ์ไม่ได้เป็นกลไกหลักที่ทำให้ยีนดูเหมือนแยกอิสระ" }
    hints:
      - "ลองนึกถึงผลของครอสซิงโอเวอร์สองครั้งที่เกิดในช่วงเดียวกัน"
      - "การแลกเปลี่ยนสองครั้งอาจทำให้กลับไปเป็นการรวมตัวแบบเดิม"
    solution: "ครอสซิงโอเวอร์ที่เกิดหลายครั้งในช่วงระหว่างยีนที่ไกลกันทำให้การรวมตัวใหม่และแบบเดิมมีโอกาสใกล้เคียงกัน จึงเห็นเป็นอัตรา 50% เหมือนยีนแยกอิสระ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.linkage-mapping.p012
    topics: [biology.genetics.linkage-mapping]
    difficulty: 3
    type: numeric
    stem: "ลูกผสม AB/ab ที่ยีนห่างกัน 20 cM ถูกผสมกับ ab/ab ลูกที่มีจีโนไทป์ Ab/ab คิดเป็นกี่เปอร์เซ็นต์ของลูกทั้งหมด (ตอบเป็นเปอร์เซ็นต์)"
    answer: { value: 10, tolerance: 0, unit: "%" }
    misconceptions:
      - { match: 20, feedback: "ตอบความถี่รีคอมบิแนนท์รวม แต่ Ab เป็นรีคอมบิแนนท์เพียงกลุ่มเดียว จึงได้ครึ่งหนึ่งของ 20%" }
