id: chemistry.materials.everyday-materials
subject: chemistry
title: { th: วัสดุรอบตัวและการนำกลับมาใช้ใหม่, en: Everyday materials and recycling }
summary: วัตถุรอบตัวทำจากวัสดุ เช่น ไม้ พลาสติก โลหะ ผ้า ยาง แก้ว เราจัดกลุ่มและเลือกวัสดุจากสมบัติที่สังเกตได้ และนำวัสดุที่ใช้แล้วกลับมาใช้อีก
difficulty: 1
minutes: 20
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - type: figure
    src: material-sort.svg
    alt: "วัสดุ 6 ชนิดเรียงเป็นช่อง ช่องละหนึ่งตัวอย่าง: ไม้ (เก้าอี้ไม้ แข็ง ลอยน้ำได้), พลาสติก (ขวดน้ำ เบา น้ำซึมผ่านไม่ได้), โลหะ (ช้อน แข็ง ผิวมันวาว), ผ้า (เสื้อยืด นุ่ม พับได้ ดูดซับน้ำ), ยาง (ยางรัดของ ยืดแล้วหดกลับ น้ำซึมผ่านไม่ได้), แก้ว (แก้วน้ำ ใส มองทะลุได้ แตกง่าย)"
    caption: "วัสดุที่พบบ่อยและสมบัติที่สังเกตได้"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: chemistry.materials.everyday-materials.p003, prompt: "ลองแยกวัตถุกับวัสดุให้ออก" }
  - type: worked-example
    title: เลือกผ้าทำผ้ากันเปื้อนสำหรับล้างจาน
    problem: "ป้าจะเย็บผ้ากันเปื้อนใส่ล้างจาน มีผ้าให้เลือก 2 ผืน หยดน้ำ 1 หยดบนผ้าแต่ละผืนแล้วรอ 1 นาที บนผ้าฝ้าย น้ำซึมหายไป บนผ้าเคลือบพลาสติก น้ำยังเป็นหยดกลม ควรใช้ผ้าผืนใด"
    steps:
      - text: "ถามว่าผ้ากันเปื้อนต้องทำงานอะไร: กันไม่ให้น้ำล้างจานเปียกถึงเสื้อ"
        why: "เลือกวัสดุต้องเริ่มจากงานของวัตถุก่อนเสมอ"
      - text: "อ่านผลการทดลอง: ผ้าฝ้ายดูดซับน้ำ ส่วนผ้าเคลือบพลาสติกไม่ดูดซับน้ำ"
      - text: "เทียบกับงาน: ต้องการผ้าที่น้ำไม่ซึมผ่าน"
    answer: "ผ้าเคลือบพลาสติก เพราะไม่ดูดซับน้ำ น้ำจึงไม่ซึมถึงเสื้อ"
  - type: figure
    src: blocks-rebuild.svg
    alt: "ตัวต่อ 8 ชิ้นมีเลข 1 ถึง 8 ด้านซ้ายต่อเป็นรูปบ้าน ลูกศรเขียนว่า แยกชิ้น ต่อใหม่ ชี้ไปทางขวา ด้านขวานำชิ้นเดิมทั้ง 8 ชิ้นมาต่อเป็นรูปรถ มีสองชิ้นเป็นล้อ"
    caption: "แยกวัตถุเป็นชิ้นส่วนย่อย แล้วประกอบเป็นวัตถุใหม่ได้"
  - { type: check, problem: chemistry.materials.everyday-materials.p007, prompt: "ใช้สมบัติการดูดซับน้ำตอบ" }
  - type: worked-example
    title: ใช้ซ้ำหรือรีไซเคิล
    problem: "บ้านหนึ่งมีกล่องนมกระดาษ 10 กล่อง ลูกนำ 4 กล่องมาตัดเป็นกระถางเพาะต้นกล้า ส่วนอีก 6 กล่องล้างแล้วส่งธนาคารขยะให้โรงงานทำเป็นแผ่นหลังคา กล่องแต่ละกลุ่มถูกนำกลับมาใช้แบบใด"
    steps:
      - text: "กล่อง 4 ใบ: ใช้กล่องใบเดิมทำงานใหม่ ไม่ได้ผ่านโรงงาน จึงเป็นการ **ใช้ซ้ำ**"
      - text: "กล่อง 6 ใบ: โรงงานนำวัสดุไปผลิตเป็นของชิ้นใหม่ จึงเป็นการ **รีไซเคิล**"
        why: "รีไซเคิลต้องเปลี่ยนวัสดุเดิมให้เป็นของชิ้นใหม่ เช่น บด หลอม หรือตีเป็นเยื่อ"
      - text: "ตรวจ: $4 + 6 = 10$ ครบทุกกล่อง ไม่มีกล่องไหนกลายเป็นขยะ"
    answer: "4 กล่องเป็นการใช้ซ้ำ 6 กล่องเป็นการรีไซเคิล"
glossary:
  - { term: วัตถุ, definition: สิ่งของที่เราใช้ เช่น ช้อน เก้าอี้ ขวดน้ำ }
  - { term: วัสดุ, definition: สิ่งที่ใช้ทำวัตถุ เช่น โลหะ ไม้ พลาสติก }
  - { term: สมบัติที่สังเกตได้, definition: ลักษณะของวัสดุที่รู้ได้ด้วยการดู จับ บีบ ยืด หรือทดลอง เช่น ใส แข็ง ยืดได้ ดูดซับน้ำ }
  - { term: การดูดซับน้ำ, definition: การที่น้ำซึมเข้าไปเก็บอยู่ในเนื้อวัสดุ เช่น ผ้าขนหนู กระดาษทิชชู }
  - { term: การใช้ซ้ำ, definition: การนำของชิ้นเดิมกลับมาใช้อีก อาจใช้ทำงานเดิมหรืองานใหม่ }
  - { term: การรีไซเคิล, definition: การนำวัสดุที่ใช้แล้วไปผ่านกระบวนการ เช่น บด หลอม แล้วผลิตเป็นของชิ้นใหม่ }
flashcards:
  - { front: "วัตถุกับวัสดุต่างกันอย่างไร", back: "วัตถุคือสิ่งของ (ช้อน) วัสดุคือสิ่งที่ใช้ทำ (โลหะ)" }
  - { front: "วัสดุที่ดูดซับน้ำดีเหมาะกับงานใด และวัสดุที่ไม่ดูดซับน้ำเหมาะกับงานใด", back: "ดูดซับน้ำดี: ผ้าเช็ดตัว ผ้าอ้อม · ไม่ดูดซับน้ำ: ร่ม เสื้อกันฝน ถุงใส่ของ" }
  - { front: "ผสมดินเหนียวกับฟางได้อะไร", back: "อิฐดินที่แข็งแรงขึ้นและไม่แตกร้าวง่าย" }
  - { front: "3 วิธีช่วยลดขยะ", back: "ลดการใช้ · ใช้ซ้ำ · นำกลับมาใช้ใหม่ (รีไซเคิล)" }
