review_flags:
  - { claim: "เกณฑ์คุณภาพน้ำประปาของประเทศไทย (ค่าความขุ่น คลอรีนคงเหลือ จุลินทรีย์)", reason: "ยังไม่ได้ยืนยันกับประกาศทางการฉบับล่าสุด บทเรียนจึงไม่ระบุตัวเลข ต้องตรวจก่อนเผยแพร่", severity: high }
  - { claim: "ช่วงค่าอัตราการกรองและอัตราน้ำล้นผิวที่ตำราทั่วไประบุไว้", reason: "เป็นค่าจากตำราต่างประเทศและยังไม่ได้ยืนยันกับข้อกำหนดของหน่วยงานไทย ต้องตรวจก่อนเผยแพร่", severity: medium }
  - { claim: "ค่า CT ที่ต้องใช้เพื่อฆ่าเชื้อในระดับที่กำหนด", reason: "ขึ้นกับชนิดจุลินทรีย์ อุณหภูมิ และ pH ต้องตรวจจากตารางที่หน่วยงานกำกับกำหนดก่อนนำไปใช้", severity: medium }
