<text x="245.0" y="305.0" text-anchor="end" font-size="14" fill="#222">หลอดน้ำเหลือง (แลกทีล)</text>
<text x="660.0" y="140.0" text-anchor="start" font-size="14" font-weight="bold" fill="#c62828">สารที่เข้าหลอดเลือดฝอย:</text>
<text x="660.0" y="162.0" text-anchor="start" font-size="13" fill="#222">กลูโคส กรดอะมิโน</text>
<text x="660.0" y="182.0" text-anchor="start" font-size="13" fill="#222">วิตามินที่ละลายในน้ำ แร่ธาตุ</text>
<text x="660.0" y="204.0" text-anchor="start" font-size="13" fill="#222">→ เส้นเลือดดำที่ไปตับ</text>
<text x="660.0" y="250.0" text-anchor="start" font-size="14" font-weight="bold" fill="#f57f17">สารที่เข้าแลกทีล:</text>
<text x="660.0" y="272.0" text-anchor="start" font-size="13" fill="#222">กรดไขมันและกลีเซอรอล</text>
<text x="660.0" y="292.0" text-anchor="start" font-size="13" fill="#222">(รวมกลับเป็นไขมัน)</text>
<text x="660.0" y="312.0" text-anchor="start" font-size="13" fill="#222">วิตามิน A D E K</text>
<text x="660.0" y="332.0" text-anchor="start" font-size="13" fill="#222">→ ระบบน้ำเหลือง</text>
