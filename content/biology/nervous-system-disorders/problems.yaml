    stem: "เขียนฟังก์ชัน `has_stroke_warning(symptoms)` ที่รับลิสต์ของอาการที่สังเกตได้ (สตริง) แล้วคืน True ถ้ามีอาการเตือนของ BE FAST อย่างน้อยหนึ่งอย่าง ได้แก่ \"ทรงตัวเสีย\" \"ตามัว\" \"มุมปากตก\" \"แขนอ่อนแรง\" หรือ \"พูดไม่ชัด\" และคืน False ถ้าไม่มี (ฟังก์ชันนี้เป็นแบบฝึกเขียนโค้ด ไม่ใช่เครื่องมือวินิจฉัย)"
    starter: |
      def has_stroke_warning(symptoms):
          pass
    tests: |
      r = has_stroke_warning(["ปวดหัวเล็กน้อย"])
      assert r is not None, "ไม่ได้คืนค่า (ได้ None) ต้องใช้ return ไม่ใช่ print"
      assert r is False, "อาการที่ไม่ใช่อาการเตือนของ BE FAST ต้องคืน False"
      assert has_stroke_warning(["พูดไม่ชัด"]) is True, "พูดไม่ชัดเป็นอาการเตือน ต้องคืน True"
      assert has_stroke_warning(["ไอ", "มุมปากตก"]) is True, "ถ้ามีอาการเตือนปนกับอาการอื่น ต้องคืน True"
      assert has_stroke_warning([]) is False, "ลิสต์ว่างต้องคืน False"
    reference: |
      WARNINGS = {"ทรงตัวเสีย", "ตามัว", "มุมปากตก", "แขนอ่อนแรง", "พูดไม่ชัด"}
      def has_stroke_warning(symptoms):
          return any(s in WARNINGS for s in symptoms)
    hints:
      - "ใช้คำสั่ง any หรือการวนลูปตรวจแต่ละรายการในลิสต์"
      - "เก็บรายการอาการเตือนไว้ในเซตหรือลิสต์แล้วตรวจว่าอยู่ในนั้นหรือไม่"
    solution: "return any(s in WARNINGS for s in symptoms) เมื่อ WARNINGS เป็นเซตของอาการเตือนทั้งห้า"
