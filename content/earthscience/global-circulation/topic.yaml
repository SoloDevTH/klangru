id: earthscience.atmosphere.global-circulation
subject: earthscience
title: { th: การหมุนเวียนของอากาศ, en: "Global atmospheric circulation" }
summary: แรงเกรเดียนต์ความกดอากาศ แรงคอริออลิส แรงสู่ศูนย์กลาง และแรงเสียดทานที่ควบคุมลมในระดับต่าง ๆ การหมุนเวียนสามเซลล์ตามเขตละติจูด และผลต่อภูมิอากาศรวมถึงร่องมรสุมในไทย
difficulty: 5.5
minutes: 40
prerequisites: [earthscience.atmosphere.energy-balance, physics.kinematics.circular, physics.dynamics.friction]
encompasses:
  - { id: earthscience.atmosphere.energy-balance, weight: 0.2 }
  - { id: physics.kinematics.circular, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: แรงที่กระทำต่อลม
    src: wind-forces.svg
    alt: "สองภาพ เส้นไอโซบาร์แนวนอนสามเส้น 996 hPa ด้านบน 1000 และ 1004 hPa ด้านล่าง ความกดอากาศต่ำอยู่ด้านบน ภาพซ้าย ลมเหนือชั้นแรงเสียดทาน ลูกศรแรงเกรเดียนต์ความกดอากาศชี้ขึ้นไปหาความกดอากาศต่ำ ลูกศรแรงคอริออลิสยาวเท่ากันชี้ลง ลมพัดไปทางขวาขนานกับไอโซบาร์ ภาพขวา ลมใกล้ผิวโลก ลมพัดเฉียงขึ้นข้ามไอโซบาร์เข้าหาความกดอากาศต่ำ แรงเสียดทานชี้สวนทางลม แรงคอริออลิสตั้งฉากไปทางขวาของลมและสั้นลง แรงเกรเดียนต์ยังชี้ขึ้นเท่าเดิม ซีกโลกเหนือ แรงคอริออลิสตั้งฉากไปทางขวาของทิศลม"
    caption: "แรงเสียดทานทำให้ลมช้าลง แรงคอริออลิสจึงอ่อนลง ลมใกล้ผิวพื้นจึงพัดเฉียงเข้าหาความกดอากาศต่ำ (วาดโดยทีมคลังรู้ ความยาวลูกศรแรงคำนวณให้ผลรวมเป็นศูนย์)"
  - type: worked-example
    title: อัตราเร็วลมจีออสโทรฟิก
    problem: "ที่ละติจูด 45° เหนือ ความกดอากาศในชั้นบนลดลง 4 hPa ในระยะ 300 km ความหนาแน่นของอากาศ $1.2\\ \\mathrm{kg/m^3}$ (ค่าประมาณ) ลมจีออสโทรฟิกมีอัตราเร็วเท่าใด"
    steps:
      - text: "แปลงหน่วย: $\\Delta p = 4\\ \\mathrm{hPa} = 400\\ \\mathrm{Pa}$, $\\Delta n = 300\\ \\mathrm{km} = 3 \\times 10^5\\ \\mathrm{m}$"
      - text: "ความเร่งจากแรงเกรเดียนต์ $a_p = \\dfrac{400}{1.2 \\times 3 \\times 10^5} \\approx 1.11 \\times 10^{-3}\\ \\mathrm{m/s^2}$"
      - text: "$f = 2(7.29 \\times 10^{-5})\\sin 45^\\circ \\approx 1.03 \\times 10^{-4}\\ \\mathrm{s^{-1}}$"
      - text: "สมดุล $f v_g = a_p$ จึงได้ $v_g = \\dfrac{1.11 \\times 10^{-3}}{1.03 \\times 10^{-4}} \\approx 10.8\\ \\mathrm{m/s}$"
        why: "ลมจีออสโทรฟิกคือลมที่แรงคอริออลิสหักล้างแรงเกรเดียนต์พอดี"
    answer: "ราว 10.8 m/s หรือราว 39 km/h พัดขนานกับไอโซบาร์ โดยความกดอากาศต่ำอยู่ทางซ้าย"
  - { type: check, problem: earthscience.atmosphere.global-circulation.p006, prompt: "ใช้ f = 2Ω sin φ" }
  - type: figure
    title: การหมุนเวียนสามเซลล์และลมประจำ
    src: three-cell.svg
    alt: "โลกเป็นวงกลมมีเส้นละติจูด 0, 30 และ 60 องศาทั้งสองซีก ทางซ้ายเป็นภาพตัดในแนวตั้งของเซลล์หมุนเวียน ซีกโลกละสามเซลล์ คือ แฮดลีย์ (0–30 องศา) เฟอร์เรล (30–60 องศา) และขั้วโลก (60–90 องศา) ด้านขวาของแต่ละวงคือผิวโลก ในเซลล์แฮดลีย์อากาศที่ผิวโลกไหลเข้าหาเส้นศูนย์สูตร เซลล์เฟอร์เรลไหลไปทางขั้วโลก บนลูกโลกมีลูกศรสีแดงแสดงลมที่ผิวโลก ซีกโลกเหนือ 0–30 องศาเป็นลมค้าตะวันออกเฉียงเหนือ 30–60 องศาเป็นลมตะวันตก เหนือ 60 องศาเป็นลมตะวันออก ซีกโลกใต้ 0–30 องศาเป็นลมค้าตะวันออกเฉียงใต้ 30–60 องศาเป็นลมตะวันตก ป้ายด้านขวาบอกว่า 0 องศาคือร่องความกดอากาศต่ำ ITCZ อากาศยกตัว ฝนชุก 30 องศาคือแนวความกดอากาศสูงกึ่งเขตร้อน อากาศจมตัว แห้ง 60 องศาคือแนวความกดอากาศต่ำกึ่งขั้วโลก อากาศยกตัว และขั้วโลกเป็นความกดอากาศสูง"
    caption: "อากาศยกตัวที่ 0° และ 60° จมตัวที่ 30° และขั้วโลก ลมที่ผิวโลกถูกแรงคอริออลิสเบน (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: worked-example
    title: ทำไมลมค้าในซีกโลกเหนือพัดจากตะวันออกเฉียงเหนือ
    problem: "ในเซลล์แฮดลีย์ อากาศที่ผิวโลกบริเวณละติจูด 20° เหนือไหลกลับไปหาเส้นศูนย์สูตร (ไปทางทิศใต้) เหตุใดลมจริงจึงพัดจากทิศตะวันออกเฉียงเหนือ"
    steps:
      - text: "อากาศเริ่มเคลื่อนไปทางทิศใต้เพราะความกดอากาศสูงที่ 30° และต่ำที่ศูนย์สูตร"
      - text: "ซีกโลกเหนือ แรงคอริออลิสเบนลมไปทางขวาของทิศที่เคลื่อน คนที่หันหน้าไปทางใต้มีมือขวาอยู่ทางทิศตะวันตก"
        why: "หันหน้าไปทิศใต้ ทิศตะวันออกอยู่ทางซ้าย ทิศตะวันตกอยู่ทางขวา"
      - text: "ลมจึงเคลื่อนไปทางตะวันตกเฉียงใต้ หรือพูดว่าพัดมาจากทิศตะวันออกเฉียงเหนือ"
      - text: "แรงเสียดทานที่ผิวทะเลทำให้ลมไม่เบนจนขนานกับแนวละติจูด ยังคงมีส่วนที่พัดเข้าหาเส้นศูนย์สูตร"
    answer: "แรงคอริออลิสเบนลมที่ไหลลงใต้ไปทางขวา (ทิศตะวันตก) จึงเป็นลมค้าตะวันออกเฉียงเหนือ"
  - { type: check, problem: earthscience.atmosphere.global-circulation.p003, prompt: "ซีกโลกเหนือเบนไปทางขวา" }
glossary:
  - { term: แรงเกรเดียนต์ความกดอากาศ, definition: "แรงที่เกิดจากความกดอากาศต่างกัน ชี้จากความกดอากาศสูงไปต่ำ ตั้งฉากกับไอโซบาร์ ขนาดต่อมวล (1/ρ)(Δp/Δn)" }
  - { term: แรงคอริออลิส, definition: "แรงปรากฏจากการหมุนของโลก เบนวัตถุที่เคลื่อนที่ไปทางขวาในซีกโลกเหนือ ทางซ้ายในซีกโลกใต้ ขนาดต่อมวล fv โดย f = 2Ω sin φ" }
  - { term: ไอโซบาร์, definition: "เส้นบนแผนที่ที่เชื่อมจุดที่มีความกดอากาศเท่ากัน" }
  - { term: ลมจีออสโทรฟิก, definition: "ลมชั้นบนที่แรงเกรเดียนต์ความกดอากาศสมดุลกับแรงคอริออลิส พัดขนานกับไอโซบาร์" }
  - { term: เซลล์แฮดลีย์, definition: "การหมุนเวียนของอากาศระหว่างเส้นศูนย์สูตรกับละติจูดราว 30° อากาศยกตัวที่ศูนย์สูตรและจมตัวที่ 30°" }
  - { term: เซลล์เฟอร์เรล, definition: "การหมุนเวียนของอากาศระหว่างละติจูดราว 30° กับ 60° ทำให้เกิดลมตะวันตกที่ผิวโลก" }
  - { term: ร่องความกดอากาศต่ำบริเวณศูนย์สูตร, definition: "แนวที่ลมค้าจากสองซีกโลกบรรจบกัน อากาศยกตัว ฝนชุก เรียกย่อว่า ITCZ กรมอุตุนิยมวิทยาเรียกส่วนที่อยู่เหนือไทยว่าร่องมรสุม" }
  - { term: ลมค้า, definition: "ลมประจำที่ผิวโลกระหว่างละติจูด 0°–30° พัดจากทิศตะวันออกเฉียงเหนือในซีกโลกเหนือ และตะวันออกเฉียงใต้ในซีกโลกใต้" }
flashcards:
  - { front: "แรงที่ควบคุมลมมีอะไรบ้าง", back: "แรงเกรเดียนต์ความกดอากาศ แรงคอริออลิส แรงสู่ศูนย์กลาง และแรงเสียดทาน" }
  - { front: "แรงคอริออลิสขึ้นกับอะไร", back: "a = 2Ω v sin φ มากขึ้นตามอัตราเร็วลมและละติจูด เป็นศูนย์ที่เส้นศูนย์สูตร" }
  - { front: "ลมใกล้ผิวพื้นพัดอย่างไรรอบความกดอากาศต่ำในซีกโลกเหนือ", back: "ทวนเข็มนาฬิกาและเฉียงเข้าหาศูนย์กลาง อากาศบรรจบแล้วยกตัว" }
  - { front: "การหมุนเวียนสามเซลล์ (ต่อซีกโลก)", back: "แฮดลีย์ 0–30° เฟอร์เรล 30–60° ขั้วโลก 60–90°" }
  - { front: "ทำไมทะเลทรายใหญ่อยู่ที่ละติจูดราว 30°", back: "เป็นแนวความกดอากาศสูงกึ่งเขตร้อน อากาศแห้งจมตัว เมฆเกิดยาก" }
