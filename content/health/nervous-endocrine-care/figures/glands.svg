<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" width="760" height="510" font-family="sans-serif">
<title>ต่อมไร้ท่อที่สำคัญและระบบประสาทส่วนกลาง</title>
<rect x="0" y="0" width="760" height="510" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="380.0" y="28.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">ระบบประสาทส่วนกลางและต่อมไร้ท่อที่สำคัญ</text>
