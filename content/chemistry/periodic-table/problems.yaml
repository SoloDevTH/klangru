problems:
  - id: chem.pt.p001
    topics: [chemistry.matter.periodic-table]
    difficulty: 1
    type: mcq
    stem: "แถวแนวนอนของตารางธาตุเรียกว่าอะไร"
    choices:
      - { id: a, text: "คาบ", correct: true, feedback: "ถูก ธาตุในคาบเดียวกันมีจำนวนชั้นของอิเล็กตรอนเท่ากัน" }
      - { id: b, text: "หมู่", feedback: "หมู่คือแถวแนวตั้ง ธาตุหมู่เดียวกันมีสมบัติทางเคมีคล้ายกัน" }
      - { id: c, text: "ชั้นอิเล็กตรอน", feedback: "ชั้นอิเล็กตรอนเป็นส่วนของอะตอม ไม่ใช่แถวในตาราง แต่จำนวนชั้นบอกได้ว่าธาตุอยู่แถวนอนใด" }
    hints:
      - "ตารางธาตุมีทั้งแถวแนวนอนและแถวแนวตั้ง แต่ละแบบมีชื่อเฉพาะ"
      - "แถวแนวตั้งมี 18 แถว ส่วนแถวแนวนอนมี 7 แถว"
    solution: "แถวแนวนอนเรียกว่า **คาบ** (มี 7 คาบ) ส่วนแถวแนวตั้งเรียกว่า **หมู่** (มี 18 หมู่)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.pt.p002
    topics: [chemistry.matter.periodic-table]
    difficulty: 1
    type: text
    stem: "โซเดียมมีเลขอะตอม 11 จงเขียนการจัดเรียงอิเล็กตรอนแบบง่าย (พิมพ์ตัวเลขคั่นด้วยจุลภาค เช่น 2,4)"
    accepted: ["2,8,1", "2.8.1", "2-8-1", "2 8 1"]
    misconceptions:
      - { match: "2,9", feedback: "ชั้นที่ 2 จุได้แค่ 8 ตัว อิเล็กตรอนตัวที่ 11 ต้องไปอยู่ชั้นที่ 3" }
      - { match: "8,2,1", feedback: "เติมจากชั้นในสุดก่อน และชั้นในสุดจุได้แค่ 2 ตัว" }
    hints:
      - "เติมอิเล็กตรอนจากชั้นในสุดออกไป"
      - "ชั้นที่ 1 จุได้ 2 ตัว ชั้นที่ 2 จุได้ 8 ตัว ที่เหลือไปชั้นที่ 3"
    solution: "อิเล็กตรอน 11 ตัว: ชั้นที่ 1 ได้ 2 เหลือ 9 ชั้นที่ 2 ได้ 8 เหลือ 1 ไปชั้นที่ 3 จึงได้ **2, 8, 1** ตรวจ: $2 + 8 + 1 = 11$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.pt.p003
    topics: [chemistry.matter.periodic-table]
    difficulty: 2
    type: numeric
    stem: "คลอรีน ($Z = 17$) อยู่หมู่ 17 อะตอมคลอรีนมีเวเลนซ์อิเล็กตรอนกี่ตัว (ตอบเป็นจำนวนตัว)"
    answer: { value: 7, unit: ตัว }
    hints:
      - "เวเลนซ์อิเล็กตรอนคืออิเล็กตรอนในชั้นนอกสุด"
      - "จัดเรียงอิเล็กตรอน 17 ตัวทีละชั้น (2, 8, …) แล้วดูชั้นสุดท้าย"
    misconceptions:
      - { match: 17, feedback: "17 คือเลขอะตอม (และเลขหมู่) ซึ่งนับอิเล็กตรอนทุกชั้น เวเลนซ์อิเล็กตรอนนับเฉพาะชั้นนอกสุด สำหรับหมู่ 13–18 ให้ลบ 10 จากเลขหมู่" }
      - { match: 8, feedback: "8 คืออิเล็กตรอนในชั้นที่ 2 ซึ่งเป็นชั้นใน ชั้นนอกสุดของคลอรีนคือชั้นที่ 3" }
    solution: "คลอรีนจัดเรียงเป็น 2, 8, 7 ชั้นนอกสุดมี **7 ตัว** สอดคล้องกับหมู่ 17 ที่มีเวเลนซ์อิเล็กตรอน $17 - 10 = 7$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.pt.p004
    topics: [chemistry.matter.periodic-table]
    difficulty: 2
    type: match
    stem: "จับคู่หมู่กับชื่อครอบครัวธาตุ"
    pairs:
      - { left: "หมู่ 1 (ยกเว้น H)", right: "โลหะแอลคาไล" }
      - { left: "หมู่ 2", right: "โลหะแอลคาไลน์เอิร์ท" }
      - { left: "หมู่ 17", right: "แฮโลเจน" }
      - { left: "หมู่ 18", right: "แก๊สมีตระกูล" }
    hints:
      - "หมู่ที่อยู่ขวาสุดมีชั้นนอกสุดเต็ม จึงแทบไม่ทำปฏิกิริยา"
      - "สองหมู่ทางซ้ายสุดเป็นโลหะ ชื่อคล้ายกันแต่หมู่ 2 มีคำว่า เอิร์ท ต่อท้าย"
    solution: "หมู่ 1 โลหะแอลคาไล (Li, Na, K) · หมู่ 2 โลหะแอลคาไลน์เอิร์ท (Mg, Ca) · หมู่ 17 แฮโลเจน (F, Cl, Br) · หมู่ 18 แก๊สมีตระกูล (He, Ne, Ar)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.pt.p005
    topics: [chemistry.matter.periodic-table]
    difficulty: 3
    type: text
    stem: "แคลเซียมในนมและเปลือกหอยมีเลขอะตอม 20 จงเขียนการจัดเรียงอิเล็กตรอนแบบง่าย (พิมพ์ตัวเลขคั่นด้วยจุลภาค เช่น 2,4)"
    accepted: ["2,8,8,2", "2.8.8.2", "2-8-8-2", "2 8 8 2"]
    misconceptions:
      - { match: "2,8,10", feedback: "ตามแบบง่ายของบทนี้ ชั้นที่ 3 ใส่ได้ 8 ตัวแล้วตัวถัดไปไปชั้นที่ 4 แคลเซียมอยู่คาบ 4 จึงต้องมี 4 ชั้น" }
      - { match: "2,8,8,1", feedback: "นั่นคือโพแทสเซียม ($Z = 19$) แคลเซียมมีอิเล็กตรอนมากกว่าอีก 1 ตัว" }
    hints:
      - "เติมชั้นที่ 1 ได้ 2 ชั้นที่ 2 ได้ 8 ชั้นที่ 3 ได้ 8"
      - "อิเล็กตรอนที่เหลือหลังชั้นที่ 3 ไปอยู่ชั้นที่ 4"
    solution: "อิเล็กตรอน 20 ตัว: 2 (ชั้น 1) + 8 (ชั้น 2) + 8 (ชั้น 3) = 18 เหลือ 2 ไปชั้นที่ 4 จึงได้ **2, 8, 8, 2** แคลเซียมจึงอยู่คาบ 4 หมู่ 2"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.pt.p006
    topics: [chemistry.matter.periodic-table]
    difficulty: 3
    type: mcq
    stem: "ธาตุที่มีการจัดเรียงอิเล็กตรอน 2, 8, 5 อยู่ตำแหน่งใดในตารางธาตุ"
    choices:
      - { id: a, text: "คาบ 3 หมู่ 15", correct: true, feedback: "ถูก มี 3 ชั้นจึงอยู่คาบ 3 และเวเลนซ์อิเล็กตรอน 5 ตัวตรงกับหมู่ 15 (ธาตุนี้คือฟอสฟอรัส)" }
      - { id: b, text: "คาบ 5 หมู่ 3", feedback: "สลับกัน เลขคาบคือจำนวนชั้น (3 ชั้น) ส่วนจำนวนเวเลนซ์อิเล็กตรอน (5) บอกหมู่" }
      - { id: c, text: "คาบ 2 หมู่ 15", feedback: "ดูเหมือนนับเฉพาะชั้นที่เต็มแล้ว ต้องนับทุกชั้นที่มีอิเล็กตรอน รวมชั้นนอกสุดด้วย จึงได้ 3 ชั้น" }
      - { id: d, text: "คาบ 3 หมู่ 13", feedback: "นับจำนวนชั้นถูกแล้ว แต่หมู่ 13 มีเวเลนซ์อิเล็กตรอน 3 ตัว ธาตุนี้มี 5 ตัว" }
    hints:
      - "นับว่ามีอิเล็กตรอนกี่ชั้น แล้วดูว่าชั้นนอกสุดมีกี่ตัว"
      - "จำนวนชั้น = เลขคาบ · หมู่ 13–18 มีเวเลนซ์อิเล็กตรอนเท่ากับเลขหมู่ลบ 10"
    solution: "2, 8, 5 มี 3 ชั้น จึงอยู่คาบ 3 ชั้นนอกสุดมี 5 ตัว จึงอยู่หมู่ $5 + 10 = 15$ (หมู่ VA แบบเก่า) ธาตุนี้มีเลขอะตอม 15 คือฟอสฟอรัส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.pt.p007
    topics: [chemistry.matter.periodic-table]
    difficulty: 3
    type: numeric
    stem: "หลอดไฟนีออนสีส้มแดงในป้ายร้านแบบดั้งเดิมบรรจุแก๊สนีออน ($Z = 10$) อะตอมนีออนมีเวเลนซ์อิเล็กตรอนกี่ตัว (ตอบเป็นจำนวนตัว)"
    answer: { value: 8, unit: ตัว }
    hints:
      - "จัดเรียงอิเล็กตรอน 10 ตัวทีละชั้นก่อน"
      - "เวเลนซ์อิเล็กตรอนนับเฉพาะชั้นนอกสุด"
    misconceptions:
      - { match: 10, feedback: "10 คืออิเล็กตรอนทั้งหมด เวเลนซ์อิเล็กตรอนนับเฉพาะชั้นนอกสุด" }
      - { match: 2, feedback: "2 คืออิเล็กตรอนในชั้นที่ 1 ซึ่งเป็นชั้นใน ชั้นนอกสุดของนีออนคือชั้นที่ 2" }
    solution: "นีออนจัดเรียงเป็น 2, 8 ชั้นนอกสุดมี **8 ตัว** ซึ่งเต็มพอดี นีออนจึงเป็นแก๊สมีตระกูลที่แทบไม่ทำปฏิกิริยา ใช้ในหลอดไฟได้อย่างปลอดภัย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.pt.p008
    topics: [chemistry.matter.periodic-table]
    difficulty: 3
    type: mcq
    stem: "สารที่ใช้ฆ่าเชื้อในสระว่ายน้ำมักเป็นสารประกอบของคลอรีน (Cl, หมู่ 17 คาบ 3) ธาตุใดต่อไปนี้น่าจะมีสมบัติทางเคมีคล้ายคลอรีนมากที่สุด"
    choices:
      - { id: a, text: "โบรมีน (Br) หมู่ 17 คาบ 4", correct: true, feedback: "ถูก อยู่หมู่เดียวกัน จึงมีเวเลนซ์อิเล็กตรอน 7 ตัวเท่ากัน และเป็นแฮโลเจนเหมือนกัน" }
      - { id: b, text: "กำมะถัน (S) หมู่ 16 คาบ 3", feedback: "อยู่ติดกันในคาบเดียวกันก็จริง แต่ธาตุในคาบเดียวกันมีเวเลนซ์อิเล็กตรอนต่างกัน สมบัติจึงต่างกัน ให้ดูธาตุหมู่เดียวกัน" }
      - { id: c, text: "อาร์กอน (Ar) หมู่ 18 คาบ 3", feedback: "เลขอะตอมถัดจากคลอรีนก็จริง แต่อาร์กอนเป็นแก๊สมีตระกูลที่แทบไม่ทำปฏิกิริยา ต่างจากคลอรีนที่ว่องไวมาก" }
      - { id: d, text: "โซเดียม (Na) หมู่ 1 คาบ 3", feedback: "โซเดียมรวมกับคลอรีนเป็นเกลือแกงได้ดี แต่การรวมกันได้ดีไม่ได้แปลว่าสมบัติคล้ายกัน โซเดียมเป็นโลหะ คลอรีนเป็นอโลหะ" }
    hints:
      - "สมบัติทางเคมีขึ้นกับเวเลนซ์อิเล็กตรอน"
      - "ธาตุที่มีเวเลนซ์อิเล็กตรอนเท่ากันอยู่หมู่เดียวกัน (แถวแนวตั้ง)"
    solution: "ธาตุหมู่เดียวกันมีเวเลนซ์อิเล็กตรอนเท่ากัน จึงมีสมบัติทางเคมีคล้ายกัน โบรมีนอยู่หมู่ 17 เหมือนคลอรีน คำตอบจึงเป็นโบรมีน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.pt.p009
    topics: [chemistry.matter.periodic-table]
    difficulty: 4
    type: numeric
    stem: "กลิ่นคล้ายไข่เน่าที่บ่อน้ำพุร้อนบางแห่งมาจากแก๊สไฮโดรเจนซัลไฟด์ ซึ่งมีกำมะถัน (S) เป็นองค์ประกอบ กำมะถันอยู่คาบ 3 หมู่ 16 กำมะถันมีเลขอะตอมเท่าใด"
    answer: { value: 16 }
    hints:
      - "หมู่ 16 มีเวเลนซ์อิเล็กตรอนกี่ตัว"
      - "คาบ 3 แปลว่ามี 3 ชั้น ชั้นในสองชั้นเต็ม: 2 และ 8"
      - "เขียนการจัดเรียงอิเล็กตรอนทั้งหมด แล้วรวมจำนวนอิเล็กตรอน ซึ่งเท่ากับจำนวนโปรตอนในอะตอมที่เป็นกลาง"
    misconceptions:
      - { match: 6, feedback: "6 คือเวเลนซ์อิเล็กตรอนเท่านั้น ต้องรวมอิเล็กตรอนในชั้นในด้วย" }
      - { match: 8, feedback: "นั่นคือธาตุคาบ 2 หมู่ 16 (ออกซิเจน: 2, 6) กำมะถันอยู่คาบ 3 จึงมีอีกหนึ่งชั้นที่เต็ม 8 ตัว" }
    solution: "หมู่ 16 มีเวเลนซ์อิเล็กตรอน $16 - 10 = 6$ คาบ 3 มี 3 ชั้น จึงจัดเรียงเป็น 2, 8, 6 รวม $2 + 8 + 6 = 16$ เลขอะตอมของกำมะถันจึงเป็น **16**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.pt.p010
    topics: [chemistry.matter.periodic-table]
    difficulty: 4
    type: order
    stem: "เรียงอะตอมต่อไปนี้จากขนาดใหญ่ที่สุดไปเล็กที่สุด: Na (คาบ 3 หมู่ 1), Mg (คาบ 3 หมู่ 2), Cl (คาบ 3 หมู่ 17), K (คาบ 4 หมู่ 1)"
    items:
      - "K"
      - "Na"
      - "Mg"
      - "Cl"
    hints:
      - "อะตอมที่มีจำนวนชั้นมากกว่ามักใหญ่กว่า"
      - "ในคาบเดียวกัน อะตอมเล็กลงเมื่อไปทางขวา เพราะโปรตอนเพิ่มขึ้นและดึงอิเล็กตรอนแรงขึ้น"
      - "หาตัวที่อยู่คาบ 4 ก่อน แล้วเรียงสามตัวในคาบ 3 ตามหมู่"
    solution: "K อยู่คาบ 4 มี 4 ชั้น จึงใหญ่ที่สุด ส่วน Na, Mg, Cl อยู่คาบ 3 เรียงจากซ้ายไปขวา ขนาดจึงลดลงตามลำดับ: K > Na > Mg > Cl"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.pt.p011
    topics: [chemistry.matter.periodic-table]
    difficulty: 4
    type: mcq
    stem: "ครูหย่อนโลหะลิเทียม โซเดียม และโพแทสเซียม (หมู่ 1 คาบ 2, 3 และ 4 ตามลำดับ) ชิ้นเล็กเท่ากันลงในน้ำ โลหะใดน่าจะทำปฏิกิริยารุนแรงที่สุด"
    choices:
      - { id: a, text: "โพแทสเซียม", correct: true, feedback: "ถูก เวเลนซ์อิเล็กตรอนของ K อยู่ชั้นที่ 4 ไกลนิวเคลียสที่สุด จึงหลุดง่ายที่สุด" }
      - { id: b, text: "ลิเทียม", feedback: "ลิเทียมมีขนาดเล็ก เวเลนซ์อิเล็กตรอนอยู่ใกล้นิวเคลียสและถูกดึงแน่น จึงหลุดยากกว่าตัวอื่น ทำปฏิกิริยาช้าที่สุดในสามตัวนี้" }
      - { id: c, text: "รุนแรงเท่ากัน เพราะอยู่หมู่เดียวกัน", feedback: "หมู่เดียวกันมีสมบัติ **คล้าย** กัน แต่ไม่เท่ากันทุกอย่าง ความว่องไวของหมู่ 1 เปลี่ยนตามคาบ" }
    hints:
      - "โลหะหมู่ 1 ทำปฏิกิริยาโดยเสียเวเลนซ์อิเล็กตรอน 1 ตัว"
      - "อิเล็กตรอนที่อยู่ไกลนิวเคลียสหลุดง่ายหรือยาก"
    solution: "ลงล่างในหมู่ 1 อะตอมมีชั้นเพิ่มขึ้น เวเลนซ์อิเล็กตรอนอยู่ไกลนิวเคลียสขึ้นจึงหลุดง่ายขึ้น ความว่องไวจึงเพิ่มขึ้น: Li < Na < K โพแทสเซียมจึงรุนแรงที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.pt.p012
    topics: [chemistry.matter.periodic-table]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "ธาตุ X จัดเรียงอิเล็กตรอนเป็น 2, 8, 8, 1 และธาตุ Y จัดเรียงเป็น 2, 8, 7 ข้อใดถูกต้อง (เลือกได้หลายข้อ)"
    choices:
