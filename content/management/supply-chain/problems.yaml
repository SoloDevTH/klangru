problems:
  - id: management.operations.supply-chain.p001
    topics: [management.operations.supply-chain]
    difficulty: 1
    type: match
    stem: "จับคู่ผู้เกี่ยวข้องในโซ่อุปทานทุเรียนส่งออก (สมมติ) กับบทบาท"
    pairs:
      - { left: "สวนทุเรียน", right: "ผลิตวัตถุดิบที่ต้นน้ำ" }
      - { left: "ล้ง", right: "รวบรวม คัดแยก บรรจุ และตรวจคุณภาพก่อนส่งออก" }
      - { left: "ตัวแทนจัดการขนส่ง (freight forwarder)", right: "จองพื้นที่ขนส่งและจัดการเอกสารส่งออก" }
      - { left: "ผู้นำเข้าในจีน", right: "รับสินค้าที่ปลายทางและกระจายต่อให้ตลาดค้าส่ง" }
    hints:
      - "ต้นน้ำคือจุดเริ่มของสินค้า"
      - "ผู้ให้บริการโลจิสติกส์ไม่ได้เป็นเจ้าของสินค้า แต่จัดการการขนส่ง"
    solution: "สวนผลิต ล้งคัดและบรรจุ ตัวแทนจัดการขนส่งดูแลการขนส่งและเอกสาร และผู้นำเข้ารับสินค้าที่ปลายทางแล้วกระจายต่อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.supply-chain.p002
    topics: [management.operations.supply-chain]
    difficulty: 1
    type: mcq
    stem: "ปรากฏการณ์แส้ม้า (bullwhip effect) หมายถึงอะไร"
    choices:
      - { id: a, text: "ความแปรปรวนของคำสั่งซื้อขยายมากขึ้นเรื่อย ๆ เมื่อย้อนจากผู้บริโภคขึ้นไปทางต้นน้ำ", correct: true }
      - { id: b, text: "ราคาสินค้าสูงขึ้นทุกครั้งที่ผ่านคนกลาง", feedback: "นั่นคือการบวกกำไรของคนกลาง ไม่ใช่การแกว่งของคำสั่งซื้อ" }
      - { id: c, text: "การขนส่งที่ล่าช้าเพราะรถติด", feedback: "แส้ม้าเป็นเรื่องความแปรปรวนของคำสั่งซื้อ ไม่ใช่ความล่าช้าของการขนส่ง" }
      - { id: d, text: "ผู้บริโภคซื้อของมากเกินความต้องการ", feedback: "ผู้บริโภคซื้อค่อนข้างคงที่ การแกว่งเกิดจากการสั่งของแต่ละชั้นในโซ่อุปทาน" }
    hints:
      - "นึกถึงการสะบัดแส้ ปลายแส้แกว่งมากกว่าด้ามจับ"
      - "เทียบคำสั่งซื้อของโรงงานกับยอดซื้อของผู้บริโภค"
    solution: "ยอดซื้อของผู้บริโภคแกว่งเล็กน้อย แต่คำสั่งซื้อของผู้ค้าปลีก ผู้ค้าส่ง และโรงงานแกว่งมากขึ้นเรื่อย ๆ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.supply-chain.p003
    topics: [management.operations.supply-chain]
    difficulty: 1
    type: match
    stem: "จับคู่สินค้า (สมมติ) กับรูปแบบการขนส่งที่เหมาะที่สุด"
    pairs:
      - { left: "ชุดตรวจทางการแพทย์มูลค่าสูง ต้องถึงภายใน 2 วัน", right: "ทางอากาศ" }
      - { left: "ยางพาราแผ่นรมควัน 500 ตัน ส่งไปยุโรป ไม่รีบ", right: "ทางเรือ" }
      - { left: "ส่งผักจากตลาดไทไปร้านอาหาร 20 ร้านในกรุงเทพฯ", right: "ทางถนน" }
      - { left: "น้ำตาลทรายหลายพันตันจากภาคกลางไปภาคเหนือเป็นประจำ", right: "ทางราง" }
    hints:
      - "ของเร่งและมูลค่าสูงยอมจ่ายแพง"
      - "ของหนักปริมาณมาก ระยะไกล ไม่รีบ ใช้รูปแบบที่ถูกต่อตัน"
    solution: "อากาศเร็วที่สุดเหมาะกับของด่วนมูลค่าสูง เรือถูกที่สุดสำหรับปริมาณมากระยะไกล ถนนส่งถึงประตูหลายจุด และรางเหมาะกับปริมาณมากเส้นทางประจำทางบก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.supply-chain.p004
    topics: [management.operations.supply-chain]
    difficulty: 2
    type: numeric
    stem: "ผู้ส่งมอบกล่องบรรจุ (สมมติ) ส่งของ 50 ครั้งในไตรมาส ตรงเวลา 46 ครั้ง ร้อยละการส่งตรงเวลาเป็นเท่าไร"
    answer: { value: 92, unit: "%" }
    hints:
      - "ร้อยละ = ครั้งที่ตรงเวลา ÷ ครั้งทั้งหมด × 100"
      - "46 ÷ 50"
    misconceptions:
      - { match: 8, feedback: "นั่นคือร้อยละที่ส่งช้า" }
    solution: "$46 \\div 50 \\times 100 = 92\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.supply-chain.p005
    topics: [management.operations.supply-chain]
    difficulty: 2
    type: numeric
    stem: "จากตารางผู้ส่งมอบในภาพ แปลงราคาเป็นคะแนนด้วย (ราคาต่ำสุด ÷ ราคาของรายนั้น) × 100 ส่วนคุณภาพและการส่งตรงเวลาใช้ร้อยละตามตาราง คะแนนรวมถ่วงน้ำหนักของผู้ส่งมอบ A เป็นเท่าไร"
    figure:
      src: p-supplier.svg
      alt: "ตาราง A ราคา 52 บาทต่อกล่อง ผ่านการตรวจรับ 98.5% ส่งตรงเวลา 92% · B ราคา 48 ผ่าน 96.0% ตรงเวลา 97% · C ราคา 55 ผ่าน 99.5% ตรงเวลา 88% น้ำหนัก ราคา 0.40 คุณภาพ 0.35 ส่งตรงเวลา 0.25"
    answer: { value: 94.4, tolerance: 0.05 }
    hints:
      - "ราคาต่ำสุดคือ 48 บาท คะแนนราคาของ A = 48 ÷ 52 × 100"
      - "คะแนนรวม = 0.40 × คะแนนราคา + 0.35 × 98.5 + 0.25 × 92"
    misconceptions:
      - { match: 78.28, feedback: "ใช้ราคา 52 เป็นคะแนนตรง ๆ ทำให้ราคาแพงได้คะแนนมาก ต้องแปลงเป็นคะแนนก่อน" }
    solution: "คะแนนราคา $48 \\div 52 \\times 100 \\approx 92.31$ คะแนนรวม $0.40(92.31) + 0.35(98.5) + 0.25(92) \\approx 36.92 + 34.48 + 23.00 = 94.40$ (B ได้ 97.85 และ C ได้ 91.73)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.supply-chain.p006
    topics: [management.operations.supply-chain]
    difficulty: 2
    type: numeric
    stem: "ศูนย์กระจายสินค้าแห่งหนึ่ง (สมมติ) ส่งของครบจำนวน 97% ตรงเวลา 98% ไม่เสียหาย 99% และเอกสารถูกต้อง 96% ถ้าแต่ละด้านเป็นอิสระกัน อัตราคำสั่งซื้อสมบูรณ์เป็นกี่เปอร์เซ็นต์"
    answer: { value: 90.35, unit: "%", tolerance: 0.05 }
    hints:
      - "คำสั่งซื้อสมบูรณ์ต้องถูกต้องทุกด้านพร้อมกัน"
      - "คูณสัดส่วนทั้งสี่ด้าน"
    misconceptions:
      - { match: 97.5, feedback: "หาค่าเฉลี่ยของสี่ด้าน แต่คำสั่งซื้อต้องถูกทุกด้านพร้อมกัน จึงต้องคูณ" }
      - { match: 96, feedback: "ใช้ด้านที่ต่ำที่สุด แต่ความผิดพลาดของด้านอื่นก็ทำให้คำสั่งซื้อไม่สมบูรณ์ด้วย" }
    solution: "$0.97 \\times 0.98 \\times 0.99 \\times 0.96 \\approx 0.9035$ หรือ $90.35\\%$ ต่ำกว่าทุกด้านเมื่อดูแยก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.supply-chain.p007
    topics: [management.operations.supply-chain]
    difficulty: 3
    type: numeric
    stem: "ร้านขายยา (สมมติ) ขายหน้ากากอนามัยสี่สัปดาห์ได้ 20, 22, 18, 20 กล่อง แต่สั่งจากผู้ค้าส่ง 16, 28, 12, 24 กล่อง ใช้ความแปรปรวนของประชากร (หารด้วย 4) อัตราขยายแส้ม้าเป็นเท่าไร"
    answer: { value: 20 }
    hints:
      - "ค่าเฉลี่ยของทั้งสองชุดเท่ากับ 20"
      - "ความแปรปรวน = ค่าเฉลี่ยของ (ค่า − ค่าเฉลี่ย)²"
    misconceptions:
      - { match: 4.47, feedback: "นั่นคืออัตราส่วนของส่วนเบี่ยงเบนมาตรฐาน โจทย์ถามอัตราส่วนของความแปรปรวน" }
      - { match: 0.05, feedback: "หารกลับด้าน ต้องเอาความแปรปรวนของคำสั่งซื้อเป็นตัวตั้ง" }
    solution: "ยอดขาย $\\frac{0 + 4 + 4 + 0}{4} = 2$ คำสั่งซื้อ $\\frac{16 + 64 + 64 + 16}{4} = 40$ อัตราขยาย $40 \\div 2 = 20$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.supply-chain.p008
    topics: [management.operations.supply-chain]
    difficulty: 3
    type: numeric
    stem: "ผู้นำเข้า (สมมติ) ซื้อมังคุดแช่แข็งราคา FOB 80 บาทต่อกิโลกรัม จ่ายค่าระวาง 7 บาทต่อกิโลกรัม ค่าประกัน 0.5% ของ (ราคาสินค้า + ค่าระวาง) อากรขาเข้า 5% ของ (ราคาสินค้า + ค่าระวาง + ค่าประกัน) และค่าดำเนินการ 1.50 บาทต่อกิโลกรัม ต้นทุนถึงมือต่อกิโลกรัมเป็นกี่บาท"
    answer: { value: 93.31, unit: บาทต่อกิโลกรัม, tolerance: 0.05 }
    hints:
      - "ค่าประกัน = 0.005 × 87"
      - "อากร = 0.05 × (87 + ค่าประกัน) แล้วรวมทุกรายการ"
    misconceptions:
      - { match: 88.5, feedback: "ลืมค่าประกันและอากร" }
      - { match: 88.94, feedback: "ลืมอากรขาเข้า" }
    solution: "ราคา + ระวาง $87$ ค่าประกัน $0.435$ ฐานอากร $87.435$ อากร $0.05 \\times 87.435 \\approx 4.372$ ค่าดำเนินการ $1.50$ รวม $87.435 + 4.372 + 1.50 \\approx 93.31$ บาทต่อกิโลกรัม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.supply-chain.p009
    topics: [management.operations.supply-chain]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ผู้ผลิตบะหมี่กึ่งสำเร็จรูป (สมมติ) เจอคำสั่งซื้อจากตัวแทนจำหน่ายแกว่งรุนแรงทุกเดือน แม้ยอดขายหน้าร้านค่อนข้างคงที่ มาตรการใดช่วยลดปรากฏการณ์แส้ม้าได้ (เลือกได้มากกว่าหนึ่งข้อ)"
    choices:
      - { id: a, text: "ให้ตัวแทนแบ่งปันข้อมูลยอดขายหน้าร้านจริงทุกวัน", correct: true }
      - { id: b, text: "ให้ตัวแทนสั่งถี่ขึ้นครั้งละน้อยแทนสั่งเดือนละครั้งล็อตใหญ่", correct: true }
      - { id: c, text: "เลิกจัดโปรโมชันลดราคาเป็นช่วง ๆ แล้วใช้ราคาคงที่", correct: true }
      - { id: d, text: "ให้ทุกชั้นเพิ่มสต็อกสำรองเป็นสองเท่า", feedback: "เพิ่มต้นทุนถือครองแต่ไม่แก้สาเหตุ คำสั่งซื้อยังแกว่งเหมือนเดิม" }
      - { id: e, text: "ผลิตตามคำสั่งซื้อของตัวแทนอย่างเคร่งครัดโดยไม่ดูยอดขายจริง", feedback: "นี่คือสาเหตุของแส้ม้า คือพยากรณ์จากคำสั่งของชั้นถัดไปแทนความต้องการจริง" }
    hints:
      - "สาเหตุหลักคือข้อมูลบิดเบือน การสั่งเป็นล็อต และราคาที่เปลี่ยน"
      - "มาตรการที่ดีต้องแก้สาเหตุ ไม่ใช่เพิ่มของเผื่อ"
    solution: "การแบ่งปันข้อมูลจริง การสั่งถี่ล็อตเล็ก และราคาคงที่ แก้สาเหตุของแส้ม้าโดยตรง ส่วนการเพิ่มสต็อกหรือผลิตตามคำสั่งของตัวแทนไม่ได้แก้สาเหตุ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.supply-chain.p010
    topics: [management.operations.supply-chain]
    difficulty: 3
    type: numeric
    stem: "ค่าขนส่งตู้คอนเทนเนอร์หนึ่งตู้ (สมมติ) ทางรถบรรทุก = 2,000 + 40 × ระยะทาง (กม.) บาท ทางราง (รวมค่ารถส่งต่อที่สถานี) = 12,000 + 25 × ระยะทาง บาท ระยะทางกี่กิโลเมตรที่ต้นทุนสองแบบเท่ากัน"
    answer: { value: 666.67, unit: กม., tolerance: 0.5 }
    hints:
      - "ตั้งสมการ 2,000 + 40d = 12,000 + 25d"
      - "แก้หา d"
    misconceptions:
      - { match: 153.85, feedback: "หาร 10,000 ด้วยผลบวก 65 แทนผลต่าง 15 ของค่าแปรผัน" }
      - { match: 250, feedback: "หาร 10,000 ด้วย 40 (ค่าแปรผันของรถบรรทุก) ต้องหารด้วยผลต่างของค่าแปรผัน" }
    solution: "$2{,}000 + 40d = 12{,}000 + 25d \\Rightarrow 15d = 10{,}000 \\Rightarrow d \\approx 666.67$ กม. ไกลกว่านี้ทางรางถูกกว่า ใกล้กว่านี้รถบรรทุกถูกกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.supply-chain.p011
    topics: [management.operations.supply-chain]
    difficulty: 3
    type: mcq
    stem: "ข้อใดอธิบาย **การขนส่งต่อเนื่องหลายรูปแบบ** (multimodal transport) ได้ถูกต้องที่สุด"
    choices:
      - { id: a, text: "ตู้สินค้าจากโรงงานในลำพูนไปด้วยรถบรรทุก ต่อรถไฟ แล้วขึ้นเรือ โดยมีผู้ประกอบการรายเดียวรับผิดชอบตลอดทางด้วยเอกสารฉบับเดียว", correct: true }
      - { id: b, text: "ส่งสินค้าด้วยรถบรรทุกสองคันพร้อมกันในเส้นทางเดียวกัน", feedback: "ใช้รูปแบบเดียว (ถนน) จึงไม่ใช่หลายรูปแบบ" }
      - { id: c, text: "ผู้ส่งออกจ้างผู้ขนส่งสามรายแยกกัน ทำสัญญาและเอกสารแยกกันทุกช่วง", feedback: "ใช้หลายรูปแบบจริง แต่ไม่มีผู้รับผิดชอบรายเดียวตลอดทาง ซึ่งเป็นลักษณะสำคัญของการขนส่งต่อเนื่องหลายรูปแบบ" }
      - { id: d, text: "ส่งสินค้าทางอากาศแบบเที่ยวบินตรง", feedback: "ใช้รูปแบบเดียว" }
    hints:
      - "ต้องใช้มากกว่าหนึ่งรูปแบบ"
      - "ใครรับผิดชอบตลอดทาง"
    solution: "การขนส่งต่อเนื่องหลายรูปแบบใช้อย่างน้อยสองรูปแบบ และมีผู้ประกอบการรายเดียวรับผิดชอบตลอดเส้นทางภายใต้เอกสารฉบับเดียว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.supply-chain.p012
    topics: [management.operations.supply-chain]
    difficulty: 4
    type: numeric
    stem: "ทุเรียนแช่แข็งหนึ่งตู้มูลค่า 2,400,000 บาท (สมมติ) ส่งทางเรือค่าขนส่ง 45,000 บาท ใช้เวลา 12 วัน หรือทางรางค่าขนส่ง 60,000 บาท ใช้เวลา 5 วัน ต้นทุนถือครองสินค้า 18% ต่อปี (คิด 365 วัน) เมื่อรวมค่าขนส่งกับค่าถือครองระหว่างทาง ทางที่ถูกกว่าถูกกว่าอีกทางกี่บาท"
    answer: { value: 6715.07, unit: บาท, tolerance: 2 }
    hints:
      - "ค่าถือครองระหว่างทาง = 2,400,000 × 0.18 × วัน ÷ 365"
