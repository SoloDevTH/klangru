  - id: earthscience.geology.earth-structure-surface.p014
    topics: [earthscience.geology.earth-structure-surface]
    difficulty: 4
    type: mcq
    stem: "โลกทั้งดวงมีความหนาแน่นเฉลี่ยราว $5.5\\ \\mathrm{g/cm^3}$ แต่หินที่ผิวโลกส่วนใหญ่หนาแน่นราว $2.7\\ \\mathrm{g/cm^3}$ ข้อมูลนี้สนับสนุนข้อสรุปใดมากที่สุด"
    choices:
      - { id: a, text: "ภายในโลกต้องมีสารที่หนาแน่นกว่าหินผิวโลกมาก เช่น แก่นโลกที่เป็นเหล็กและนิกเกิล", correct: true }
      - { id: b, text: "ภายในโลกกลวง", feedback: "ถ้าข้างในกลวง ความหนาแน่นเฉลี่ยต้องต่ำกว่าหินผิวโลก แต่ค่าจริงสูงกว่าเกือบ 2 เท่า" }
      - { id: c, text: "โลกทั้งดวงทำจากหินแกรนิตแบบเดียวกับผิวโลก", feedback: "ถ้าเป็นหินแบบเดียวกันทั้งดวง ความหนาแน่นเฉลี่ยควรใกล้ 2.7 ไม่ใช่ 5.5" }
      - { id: d, text: "ภายในโลกเป็นน้ำ", feedback: "น้ำหนาแน่นเพียง $1\\ \\mathrm{g/cm^3}$ จะทำให้ค่าเฉลี่ยต่ำลง ไม่ใช่สูงขึ้น" }
    hints:
      - "ค่าเฉลี่ยสูงกว่าผิว แปลว่าส่วนข้างในต้องเป็นอย่างไร"
      - "เหล็กมีความหนาแน่นราว $7.9\\ \\mathrm{g/cm^3}$"
    solution: "ค่าเฉลี่ยของทั้งดวงสูงกว่าหินผิวโลกเกือบ 2 เท่า ภายในจึงต้องมีสารที่หนาแน่นกว่ามาก ตรงกับแบบจำลองที่มีแก่นเหล็กและนิกเกิล ซึ่งยังถูกบีบด้วยความดันสูงมากด้วย"
