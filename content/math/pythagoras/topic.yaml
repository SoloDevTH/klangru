id: math.geometry.pythagoras
subject: math
title: { th: ทฤษฎีบทพีทาโกรัส, en: The Pythagorean theorem }
summary: ใช้ความสัมพันธ์ของด้านในสามเหลี่ยมมุมฉากหาความยาวด้านที่ไม่รู้ ตรวจมุมฉากด้วยบทกลับ และหาระยะทางระหว่างจุด
difficulty: 4
minutes: 35
prerequisites: [math.geometry.triangles, math.number.roots]
encompasses:
  - { id: math.number.roots, weight: 0.5 }
  - { id: math.geometry.triangles, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: right-triangle.svg
    alt: "สามเหลี่ยมมุมฉาก ABC มุมฉากอยู่ที่จุด C ขา a อยู่ด้านล่างจาก C ไป B ขา b อยู่ด้านซ้ายจาก C ไป A และด้าน c จาก A ไป B อยู่ตรงข้ามมุมฉาก"
    caption: "ด้านตรงข้ามมุมฉาก $c$ ไม่แตะจุดยอดของมุมฉาก และยาวที่สุดเสมอ"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: proof-rearrangement.svg
    alt: "สี่เหลี่ยมจัตุรัสสองรูปที่ยาวด้านละ a+b เท่ากัน รูปซ้ายมีสามเหลี่ยมมุมฉาก 4 รูปที่มุมทั้งสี่ ล้อมช่องว่างรูปสี่เหลี่ยมจัตุรัสเอียงที่ยาวด้านละ c พื้นที่ c² รูปขวาจัดสามเหลี่ยม 4 รูปเดิมเป็นสี่เหลี่ยมผืนผ้าสองรูป เหลือช่องว่างเป็นสี่เหลี่ยมจัตุรัสพื้นที่ a² และ b² มีเครื่องหมายเท่ากับระหว่างสองรูป"
    caption: "สามเหลี่ยม 4 รูปเท่ากันในกรอบเท่ากัน ช่องว่างจึงเท่ากัน: $c^2 = a^2 + b^2$ (วาดด้วย $a = 3$, $b = 4$)"
  - type: worked-example
    title: หาด้านตรงข้ามมุมฉากของบันไดพาดกำแพง
    problem: "บันไดพาดกำแพง ปลายล่างห่างกำแพง $1.5$ เมตร ปลายบนอยู่สูงจากพื้น $2$ เมตร บันไดยาวกี่เมตร"
    steps:
      - text: "กำแพงตั้งฉากกับพื้น จึงได้สามเหลี่ยมมุมฉาก ขาคือ $1.5$ และ $2$ ส่วนบันไดคือด้านตรงข้ามมุมฉาก $c$"
        why: "บันไดอยู่ตรงข้ามมุมระหว่างพื้นกับกำแพง ซึ่งเป็นมุมฉาก"
      - text: "แทนค่าใน $a^2 + b^2 = c^2$: $1.5^2 + 2^2 = 2.25 + 4 = 6.25$"
      - text: "$c = \\sqrt{6.25} = 2.5$ (เลือกค่าบวก เพราะเป็นความยาว)"
        why: "สมการ $c^2 = 6.25$ มีคำตอบ $\\pm 2.5$ แต่ความยาวติดลบไม่ได้"
    answer: "บันไดยาว $2.5$ เมตร"
  - { type: check, problem: math.pyth.p002, prompt: "ลองคิดก่อนอ่านต่อ" }
  - type: worked-example
    title: ใช้ระยะทางและบทกลับตรวจมุมฉากบนระนาบพิกัด
    problem: "จุด $A(-2, 1)$, $B(2, 4)$ และ $C(5, 0)$ เป็นจุดยอดของสามเหลี่ยม สามเหลี่ยม $ABC$ เป็นสามเหลี่ยมมุมฉากหรือไม่ ถ้าใช่ มุมฉากอยู่ที่จุดใด"
    steps:
      - text: "$AB = \\sqrt{(2 - (-2))^2 + (4 - 1)^2} = \\sqrt{16 + 9} = 5$"
        why: "ผลต่างพิกัด $x$ และ $y$ เป็นขาของสามเหลี่ยมมุมฉากที่มี $AB$ เป็นด้านตรงข้ามมุมฉาก"
      - text: "$BC = \\sqrt{(5 - 2)^2 + (0 - 4)^2} = \\sqrt{9 + 16} = 5$"
      - text: "$AC = \\sqrt{(5 - (-2))^2 + (0 - 1)^2} = \\sqrt{49 + 1} = \\sqrt{50}$"
        why: "ผลต่างที่ติดลบไม่เป็นปัญหา เพราะยกกำลังสองแล้วเป็นบวกเสมอ"
      - text: "ด้านยาวที่สุดคือ $AC$ ตรวจบทกลับ: $AB^2 + BC^2 = 25 + 25 = 50 = AC^2$"
        why: "บทกลับต้องเทียบผลบวกกำลังสองของสองด้านที่สั้นกว่ากับกำลังสองของด้านที่ยาวที่สุด"
      - text: "ผลเท่ากัน จึงเป็นสามเหลี่ยมมุมฉาก มุมฉากอยู่ตรงข้ามด้าน $AC$ คือที่จุด $B$"
    answer: "เป็นสามเหลี่ยมมุมฉาก (และเป็นหน้าจั่วด้วย เพราะ $AB = BC$) มุมฉากอยู่ที่ $B$"
  - { type: check, problem: math.pyth.p015, prompt: "ใช้บทกลับหาตำแหน่งมุมฉาก" }
  - type: interactive
    title: ด้านตรงข้ามมุมฉากสั้นกว่าผลบวกของขาเสมอ
    caption: "แกน x คือความยาวขาข้างหนึ่ง แถบเลื่อน a คือขาอีกข้าง เส้นโค้งคือความยาวด้านตรงข้ามมุมฉาก ส่วนเส้นตรงคือระยะเมื่อเดินอ้อมไปตามขาทั้งสอง สังเกตว่าเส้นโค้งอยู่ต่ำกว่าเสมอ และเมื่อ a = 4 กับ x = 3 เส้นโค้งมีค่า 5 พอดี"
    widget:
      kind: function-plot
      functions: ["\\sqrt{x^2 + a^2}", "x + a"]
      sliders:
        - { name: a, min: 1, max: 8, step: 1, value: 4, label: ขาอีกข้าง }
      x: [0, 10]
      y: [0, 15]
glossary:
  - { term: ด้านตรงข้ามมุมฉาก, definition: "ด้านที่อยู่ตรงข้ามกับมุมฉากในสามเหลี่ยมมุมฉาก เป็นด้านที่ยาวที่สุด" }
  - { term: ขา (ของสามเหลี่ยมมุมฉาก), definition: "ด้านสองด้านที่ประกอบกันเป็นมุมฉาก" }
  - { term: บทกลับของทฤษฎีบทพีทาโกรัส, definition: "ถ้าด้านทั้งสามของสามเหลี่ยมสอดคล้องกับ $a^2 + b^2 = c^2$ สามเหลี่ยมนั้นเป็นสามเหลี่ยมมุมฉาก โดยมุมฉากอยู่ตรงข้ามด้าน $c$" }
  - { term: สามสิ่งอันดับพีทาโกรัส, definition: "จำนวนเต็มบวกสามจำนวนที่สอดคล้องกับ $a^2 + b^2 = c^2$ เช่น 3, 4, 5 และ 5, 12, 13" }
flashcards:
  - { front: "ทฤษฎีบทพีทาโกรัส", back: "ในสามเหลี่ยมมุมฉาก $a^2 + b^2 = c^2$ โดย $c$ คือด้านตรงข้ามมุมฉาก" }
  - { front: "หาขา $b$ เมื่อรู้ $a$ และ $c$", back: "$b = \\sqrt{c^2 - a^2}$ (ลบ ไม่ใช่บวก)" }
  - { front: "ระยะทางระหว่างจุด $(x_1, y_1)$ กับ $(x_2, y_2)$", back: "$d = \\sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2}$" }
  - { front: "สามสิ่งอันดับพีทาโกรัสที่ควรจำ", back: "3–4–5, 5–12–13, 8–15–17, 7–24–25 และพหุคูณ เช่น 6–8–10" }
