# ตัวชี้วัดกลุ่มสาระการเรียนรู้คณิตศาสตร์ (ฉบับปรับปรุง พ.ศ. 2560) ตามหลักสูตรแกนกลางการศึกษาขั้นพื้นฐาน พ.ศ. 2551
#
# ที่มาของข้อความ
# - คัดจาก "คู่มือการใช้หลักสูตร กลุ่มสาระการเรียนรู้คณิตศาสตร์ (ฉบับปรับปรุง พ.ศ.2560)" ของ สสวท. 3 เล่ม (ดู sources)
#   ซึ่งพิมพ์ตารางมาตรฐาน ตัวชี้วัด และสาระการเรียนรู้แกนกลางตามที่กระทรวงศึกษาธิการประกาศใช้
#   (คำสั่ง สพฐ. ที่ 1239/2560 และ 30/2561) ไฟล์ PDF สร้างเมื่อ พ.ค. 2561 คือหลังคำสั่ง 30/2561
# - เอกสารต้นฉบับบน academic.obec.go.th ตอบ 403 จากเครื่องที่ใช้ดึงข้อมูล จึงใช้คู่มือของ สสวท. แทน
# - ดึงข้อความด้วย pdftotext -bbox แยกคอลัมน์ "ตัวชี้วัด" ตามตำแหน่ง แล้วเทียบตัวอักษรกับ pypdf ทุกบรรทัด
#   (ตรงกันทุกบรรทัด ยกเว้นบรรทัดเดียวที่ข้อมูลข้อความใน PDF สลับลำดับสระ/วรรณยุกต์ คือ ค 2.2 ม.2/2
#   ซึ่งแก้ตามภาพหน้ากระดาษ: "รูปสามเหลี่ยมไปใช้ในการแก้ปัญหาคณิตศาสตร์")
#
# รหัสตัวชี้วัด
# - ในเอกสารแต่ละตารางมีแค่เลขข้อ (1. 2. 3. ...) ภายใต้หัวข้อชั้นและมาตรฐาน รหัสในไฟล์นี้ประกอบจาก
#   มาตรฐาน + ชั้น + เลขข้อ ตามรูปแบบรหัสตัวชี้วัดของหลักสูตรแกนกลาง เช่น ข้อ 3 ของมาตรฐาน ค 1.1 ชั้น ป.4 = "ค 1.1 ป.4/3"
# - ระดับ ม.4–6 ในฉบับ 2560 กำหนดตัวชี้วัดรายชั้น (ม.4, ม.5, ม.6) ไม่ใช่ช่วงชั้น ม.4-6
# - บางชั้นไม่มีตัวชี้วัดในบางมาตรฐาน เช่น ค 1.3 และ ค 3.2 ไม่มีในระดับประถม ค 1.2 ไม่มีใน ป.5
#   และในตาราง ค 1.2 ของ ป.2 กับ ป.4 เอกสารระบุว่ามีการจัดการเรียนการสอนเพื่อเป็นพื้นฐานแต่ไม่วัดผล
#   จึงไม่มีรหัสของชั้นนั้น
#
# การเว้นวรรค
# - ต้นฉบับเป็นตารางที่ตัดบรรทัด ตำแหน่งตัดบรรทัดระหว่างอักษรไทยสองตัวไม่บอกว่าเดิมมีวรรคหรือไม่
#   จึงตัดสินจากบริบทและตัวชี้วัดคู่ขนานที่ไม่ถูกตัดบรรทัด (เช่น รายการ "การบวก การลบ" เว้นวรรค
#   ส่วน "ประโยคสัญลักษณ์แสดงการบวก" ไม่เว้น) ช่องว่างภายในบรรทัดคงตามต้นฉบับ
# - คงรูปเขียนตามต้นฉบับแม้ไม่สม่ำเสมอ เช่น "ต่างๆ" ใน ค 1.1 ป.4/6 และ "2 - 3 ขั้นตอน"
#
# จำนวนตัวชี้วัด: ป.1–ป.6 116 ข้อ, ม.1–ม.3 33 ข้อ, ม.4–ม.6 8 ข้อ รวม 157 ข้อ
