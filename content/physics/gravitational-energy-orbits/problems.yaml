- id: physics.dynamics.gravitational-energy-orbits.p013
  topics:
  - physics.dynamics.gravitational-energy-orbits
  difficulty: 5
  type: numeric
  stem: ถ้าบีบมวลโลกทั้งหมดให้เป็นหลุมดำ รัศมีขอบฟ้าเหตุการณ์ (รัศมีชวาร์ซชิลด์ $r_s = \dfrac{2GM}{c^2}$) จะมีค่ากี่มิลลิเมตร กำหนด $G = 6.674\times10^{-11}\,\mathrm{N\,m^2/kg^2}$, $M = 5.972\times10^{24}\,\mathrm{kg}$ และ $c = 2.998\times10^{8}\,\mathrm{m/s}$ ตอบเป็น $\mathrm{mm}$
  hints:
  - ใช้สูตร $r_s = \dfrac{2GM}{c^2}$ ซึ่งมีตัวเลข 2 อยู่ในตัวเศษ
  - แปลงค่าที่ได้จากเมตรเป็นมิลลิเมตรโดยคูณด้วย $1000$
  - ผลลัพธ์เป็นระยะไม่กี่มิลลิเมตร ซึ่งเล็กมากเทียบกับรัศมีโลกประมาณ $6371\,\mathrm{km}$
  answer:
    value: 8.87
    tolerance: 0.02
    unit: mm
  misconceptions:
  - match: 4.43
    feedback: ลืมตัวเลข 2 ในสูตร $r_s = 2GM/c^2$ ผลที่ได้จึงมีค่าเพียงครึ่งเดียว
  solution: $r_s = \dfrac{2(6.674\times10^{-11})(5.972\times10^{24})}{(2.998\times10^{8})^2} \approx 8.869e-03\,\mathrm{m} = 8.87\,\mathrm{mm}$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: physics.dynamics.gravitational-energy-orbits.p014
  topics:
  - physics.dynamics.gravitational-energy-orbits
  difficulty: 5
  type: numeric
  stem: ดาวเทียมสื่อสารมวล $1000\,\mathrm{kg}$ โคจรเป็นวงกลมสูง $400\,\mathrm{km}$ ต้องถูกยกขึ้นไปอยู่ในวงโคจรวงกลมค้างฟ้าที่รัศมี $r = 4.2164\times10^{7}\,\mathrm{m}$ (วัดจากจุดศูนย์กลางโลก) พลังงานรวมของดาวเทียมเพิ่มขึ้นกี่ GJ ใช้ $GM_\mathrm{E} = 3.986\times10^{14}\,\mathrm{m^3/s^2}$ และ $R_\mathrm{E} = 6.371\times10^{6}\,\mathrm{m}$
  hints:
  - พลังงานรวมของวงโคจรวงกลมคือ $E = -\dfrac{GMm}{2r}$ ดังนั้นต้องหาผลต่าง $E_\mathrm{geo} - E_\mathrm{low}$
  - ระยะของวงโคจรต่ำคือ $r = R_\mathrm{E} + 400\,\mathrm{km}$ อย่าลืมบวกรัศมีโลก
  - ได้ $\Delta E = \dfrac{GMm}{2}\left(\dfrac{1}{r_\mathrm{low}} - \dfrac{1}{r_\mathrm{geo}}\right)$ แล้วแปลงเป็น GJ
  answer:
    value: 24.71
    tolerance: 0.25
    unit: GJ
  misconceptions:
  - match: 49.41
    feedback: ใช้ผลต่างของ $U$ แทนผลต่างของ $E$ ลืมว่า $E = \tfrac12 U$ สำหรับวงโคจรวงกลม
  - match: 26.55
    feedback: ใช้รัศมีวงโคจรต่ำเป็น $R_\mathrm{E}$ โดยไม่บวกความสูง 400 km
  solution: $r_\mathrm{low} = 6.771\times10^{6}\,\mathrm{m}$ จึงได้ $\Delta E = \dfrac{GMm}{2}\left(\dfrac{1}{r_\mathrm{low}} - \dfrac{1}{r_\mathrm{geo}}\right) \approx 2.47\times10^{10}\,\mathrm{J} = 24.71\,\mathrm{GJ}$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: physics.dynamics.gravitational-energy-orbits.p015
  topics:
  - physics.dynamics.gravitational-energy-orbits
  difficulty: 3
  type: numeric
  stem: ดาวเทียมสื่อสารค้างฟ้าเหนือประเทศไทยโคจรเป็นวงกลมที่รัศมี $r = 4.2164\times10^{7}\,\mathrm{m}$ วัดจากจุดศูนย์กลางโลก จงหาคาบการโคจร ตอบเป็นชั่วโมง ใช้ $GM_\mathrm{E} = 3.986\times10^{14}\,\mathrm{m^3/s^2}$
  hints:
  - สูตรของคาบวงโคจรวงกลมคือ $T = 2\pi\sqrt{\dfrac{r^3}{GM}}$
  - ระยะ $r$ ในสูตรวัดจากจุดศูนย์กลางโลก ไม่ใช่จากผิวโลก
  - คำนวณเป็นวินาทีแล้วหารด้วย $3600$ เพื่อแปลงเป็นชั่วโมง
  answer:
    value: 23.93
    tolerance: 0.05
    unit: h
  misconceptions:
  - match: 18.71
    feedback: ใส่ความสูงเหนือผิวโลก $35786\,\mathrm{km}$ แทนรัศมีจากศูนย์กลาง ต้องบวกรัศมีโลกเข้าไปด้วย
  solution: $T = 2\pi\sqrt{\dfrac{(4.2164\times10^{7})^3}{3.986\times10^{14}}} \approx 86165\,\mathrm{s} = 23.93\,\mathrm{h}$ ซึ่งใกล้เคียงกับคาบการหมุนของโลก (23 ชั่วโมง 56 นาที)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: physics.dynamics.gravitational-energy-orbits.p016
  topics:
  - physics.dynamics.gravitational-energy-orbits
  difficulty: 2
  type: code
  stem: เขียนฟังก์ชัน `period(a, GM)` ที่คืนค่าคาบ $T$ (หน่วยวินาที) ของวงโคจรวงกลมรัศมี `a` เมตร เมื่อกำหนดค่า $GM$ ของวัตถุกลาง ตามสูตร $T = 2\pi\sqrt{a^3/GM}$ ใช้ไลบรารี `math` ได้
  hints:
  - ต้องใช้ `math.sqrt` และ `math.pi` จากไลบรารี `math` และคืนค่าด้วย `return`
  - คาบมีหน่วยวินาที ตรวจว่าค่า $a^3$ ถูกยกกำลังสาม ไม่ใช่กำลังสอง
  - เขียนสูตรเป็น `2 * math.pi * math.sqrt(a ** 3 / GM)`
  language: python
  starter: |
    import math

    def period(a, GM):
        pass
  tests: |
    r = period(7.0e6, 3.986e14)
    assert r is not None, "ยังไม่ได้คืนค่า (ได้ None) ต้องใช้ return ไม่ใช่ print"
    assert abs(r - 5828.5) < 1.0, f"period(7.0e6, 3.986e14) ควรได้ประมาณ 5828.5 วินาที แต่ได้ {r}"
    r2 = period(4.0e8, 1.327e20)
    assert abs(r2 - 4363) / 4363 < 1e-3, f"period(4.0e8, 1.327e20) ควรได้ประมาณ 4363 วินาที แต่ได้ {r2} (ตรวจว่ายกกำลังสามของ a และลืมคูณ 2π หรือไม่)"
  reference: |
    import math

    def period(a, GM):
        return 2 * math.pi * math.sqrt(a ** 3 / GM)
  solution: โค้ดคำนวณ $T = 2\pi\sqrt{a^3/GM}$ ตัวอย่าง period(7.0e6, 3.986e14) ได้ประมาณ 5828.5 วินาที
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: physics.dynamics.gravitational-energy-orbits.p017
