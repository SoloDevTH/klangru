    misconceptions:
      - { match: 2.56, feedback: "2.56 คือ $h^2$ ยังต้องถอดรากที่สองอีกขั้น" }
      - { match: 0.39, feedback: "ดูเหมือนคิด $\\frac{25}{64}$ ซึ่งกลับด้าน $h^2 = \\frac{w}{\\text{BMI}} = \\frac{64}{25}$" }
    solution: "$h^2 = \\dfrac{64}{25} = 2.56$ ดังนั้น $h = \\sqrt{2.56} = 1.60$ เมตร"
