  - id: earthscience.atmosphere.greenhouse-climate-intro.p013
    topics: [earthscience.atmosphere.greenhouse-climate-intro]
    difficulty: 4
    type: numeric
    stem: "ก่อนยุคอุตสาหกรรมมีคาร์บอนไดออกไซด์ในอากาศราว 280 ppm ปี ค.ศ. 2024 มีราว 425 ppm เพิ่มขึ้นร้อยละเท่าใดของค่าเดิม (ตอบเป็นจำนวนเต็ม)"
    answer: { value: 52, tolerance: 1, unit: "%" }
    misconceptions:
      - { match: 34, feedback: "หารด้วย 425 แต่ร้อยละของการเพิ่มต้องเทียบกับค่าเดิม 280" }
      - { match: 152, feedback: "152% คือค่าใหม่เทียบกับค่าเดิม ต้องหักร้อยละ 100 ของค่าเดิมออก" }
    hints:
      - "เพิ่มขึ้น = 425 − 280"
      - "ร้อยละ = เพิ่มขึ้น ÷ ค่าเดิม × 100"
    solution: "เพิ่มขึ้น $425 - 280 = 145$ ppm คิดเป็น $\\dfrac{145}{280} \\times 100 \\approx 52\\%$ ของค่าเดิม"
