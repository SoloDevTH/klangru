    ai_assisted: true

  - id: chemistry.stoichiometry.reactions.p015
    topics: [chemistry.stoichiometry.reactions]
    difficulty: 4
    type: numeric
    stem: "ถังแก๊สหุงต้มขนาด 15 kg ที่ใช้ในบ้าน ถ้าสมมติว่าเป็นบิวเทน ($\\mathrm{C_4H_{10}}$) ทั้งหมด เผาไหม้สมบูรณ์ตามสมการ $\\mathrm{2C_4H_{10} + 13O_2 \\to 8CO_2 + 10H_2O}$ จะปล่อย $\\mathrm{CO_2}$ กี่กิโลกรัม (C = 12.01, H = 1.008, O = 16.00)"
    answer: { value: 45.4, tolerance: 0.3, unit: kg }
    misconceptions:
      - { match: 11.4, feedback: "บิวเทน 2 mol ให้ $\\mathrm{CO_2}$ 8 mol อัตราส่วนคือ 1 : 4 ไม่ใช่ 1 : 1" }
      - { match: 60, feedback: "ใช้อัตราส่วนสัมประสิทธิ์กับมวลโดยตรง ($15 \\times 4$) ไม่ได้ ต้องเปลี่ยนเป็นโมลก่อน" }
    hints:
      - "$M_{\\mathrm{C_4H_{10}}} = 58.12$ g/mol เปลี่ยน 15,000 g เป็นโมล"
      - "อัตราส่วนโมล $\\mathrm{C_4H_{10} : CO_2} = 2 : 8 = 1 : 4$"
    solution: "บิวเทน $= 15{,}000 / 58.12 = 258.1$ mol · $\\mathrm{CO_2}$ $= 4 \\times 258.1 = 1{,}032$ mol $\\times 44.01 = 45{,}430$ g $=$ **45.4 kg** มากกว่ามวลแก๊สในถังเกือบ 3 เท่า เพราะคาร์บอนรวมกับออกซิเจนจากอากาศ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.stoichiometry.reactions.p016
    topics: [chemistry.stoichiometry.reactions]
    difficulty: 4
    type: mcq
    stem: "เผาผงเหล็ก 5.585 g ในออกซิเจนจนทำปฏิกิริยาหมด ได้ออกไซด์ของเหล็ก 7.985 g สูตรอย่างง่ายของออกไซด์นี้คือข้อใด (Fe = 55.85, O = 16.00)"
    choices:
      - { id: a, text: "$\\mathrm{Fe_2O_3}$", correct: true, feedback: "ถูก Fe 0.100 mol : O 0.150 mol $= 2 : 3$" }
      - { id: b, text: "$\\mathrm{FeO}$", feedback: "ถ้าเป็น FeO จะได้ออกไซด์เพียง $0.100 \\times 71.85 = 7.185$ g" }
      - { id: c, text: "$\\mathrm{Fe_3O_4}$", feedback: "อัตราส่วน 3 : 4 คือ 0.75 แต่ข้อมูลให้ Fe : O $= 0.100 : 0.150 \\approx 0.67$" }
      - { id: d, text: "$\\mathrm{FeO_2}$", feedback: "คิดอัตราส่วนจากมวล (5.585 : 2.400) โดยไม่เปลี่ยนเป็นโมล" }
    hints:
      - "มวลออกซิเจนที่เข้าไปรวม $= 7.985 - 5.585$"
      - "เปลี่ยนมวลของ Fe และ O เป็นโมล แล้วหาอัตราส่วนอย่างต่ำ"
    solution: "O $= 7.985 - 5.585 = 2.400$ g $= 0.150$ mol · Fe $= 5.585 / 55.85 = 0.100$ mol อัตราส่วน $0.100 : 0.150 = 2 : 3$ สูตรอย่างง่ายคือ $\\mathrm{Fe_2O_3}$ สมการที่ดุลแล้วคือ $\\mathrm{4Fe + 3O_2 \\to 2Fe_2O_3}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.stoichiometry.reactions.p017
    topics: [chemistry.stoichiometry.reactions]
