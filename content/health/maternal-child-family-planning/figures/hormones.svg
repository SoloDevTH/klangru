<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="sans-serif">
<title>ฮอร์โมนกับรอบประจำเดือนและการคุมกำเนิดด้วยฮอร์โมน</title>
<rect x="0" y="0" width="720" height="330" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="360.0" y="28.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">ฮอร์โมนกับการตกไข่ และวิธีคุมกำเนิดด้วยฮอร์โมน</text>
<rect x="40.0" y="60.0" width="180.0" height="60.0" rx="8" fill="#e2ecf9" stroke="#333" stroke-width="1.5"/>
<text x="130.0" y="86.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">ต่อมใต้สมอง</text>
<text x="130.0" y="106.0" font-size="12.5" text-anchor="middle" fill="#111">หลั่ง FSH และ LH</text>
<rect x="290.0" y="60.0" width="170.0" height="60.0" rx="8" fill="#e2ecf9" stroke="#333" stroke-width="1.5"/>
<text x="375.0" y="86.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">รังไข่</text>
<text x="375.0" y="106.0" font-size="12.5" text-anchor="middle" fill="#111">ไข่เจริญ แล้วไข่ตก</text>
<rect x="565.0" y="60.0" width="135.0" height="60.0" rx="8" fill="#e2ecf9" stroke="#333" stroke-width="1.5"/>
<text x="632.0" y="86.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">มดลูก</text>
<text x="632.0" y="106.0" font-size="12" text-anchor="middle" fill="#111">ผนังมดลูกหนาขึ้น</text>
<line x1="220.0" y1="90.0" x2="288.0" y2="90.0" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<text x="254.0" y="82.0" font-size="11.5" text-anchor="middle" fill="#111">FSH, LH</text>
<line x1="460.0" y1="90.0" x2="563.0" y2="90.0" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<text x="512.0" y="80.0" font-size="11" text-anchor="middle" fill="#111">เอสโตรเจน</text>
<text x="512.0" y="108.0" font-size="11" text-anchor="middle" fill="#111">โพรเจสเตอโรน</text>
<path d="M 375 122 C 375 170, 130 170, 130 124" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="255.0" y="180.0" font-size="12" text-anchor="middle" fill="#333">เอสโตรเจนและโพรเจสเตอโรนส่งผลย้อนกลับไปที่ต่อมใต้สมอง</text>
<rect x="40.0" y="210.0" width="650.0" height="96.0" rx="8" fill="#fff6e5" stroke="#b7791f" stroke-width="1.5"/>
<text x="365.0" y="236.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#111">ยาเม็ด ยาฉีด ยาฝังคุมกำเนิด มีฮอร์โมนคล้ายเอสโตรเจนหรือโพรเจสเตอโรน</text>
<text x="365.0" y="260.0" font-size="13" text-anchor="middle" fill="#111">→ กดการหลั่ง FSH และ LH ไข่จึงไม่ตก และมูกที่ปากมดลูกข้นจนอสุจิผ่านยาก</text>
<text x="365.0" y="282.0" font-size="13" text-anchor="middle" fill="#111">ส่วนถุงยางอนามัย ห่วงทองแดง และการทำหมัน ไม่ใช้ฮอร์โมน</text>
</svg>
