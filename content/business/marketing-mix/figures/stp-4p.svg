  <text x="308.0" y="100.2" text-anchor="middle" fill="#1f2937" font-size="12">แบ่งลูกค้าเป็นกลุ่ม</text>
  <line x1="393.0" y1="78.0" x2="424.0" y2="78.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="426.0" y="30.0" width="170.0" height="96.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
