problems:
  - id: math.geometry.position-direction.p001
    topics: [math.geometry.position-direction]
    difficulty: 1
    type: mcq
    stem: "ดูชั้นวางของในภาพ นาฬิกาอยู่ตรงไหนเมื่อเทียบกับลูกบอล"
    figure: { src: shelf.svg, alt: "ชั้นวางของสามชั้น ชั้นบนมีนาฬิกาทางซ้ายและแจกันทางขวา ชั้นกลางมีลูกบอลทางซ้าย กล่องตรงกลาง และหนังสือทางขวา ชั้นล่างมีรองเท้าทางซ้ายและตะกร้าทางขวา" }
    choices:
      - { id: a, text: "ข้างบนลูกบอล", correct: true }
      - { id: b, text: "ข้างใต้ลูกบอล", feedback: "นาฬิกาอยู่ชั้นบน ลูกบอลอยู่ชั้นกลาง ของที่อยู่ชั้นสูงกว่าอยู่ข้างบน" }
      - { id: c, text: "ทางขวาของลูกบอล", feedback: "นาฬิกากับลูกบอลอยู่ทางซ้ายของชั้นเหมือนกัน ต่างกันที่อยู่คนละชั้น" }
    hints:
      - "นาฬิกาอยู่ชั้นไหน ลูกบอลอยู่ชั้นไหน"
      - "ชั้นบนอยู่สูงกว่าชั้นกลาง"
    solution: "นาฬิกาอยู่ชั้นบน ลูกบอลอยู่ชั้นกลางตรงลงมา นาฬิกาจึงอยู่ข้างบนลูกบอล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.position-direction.p002
    topics: [math.geometry.position-direction]
    difficulty: 1
    type: match
    stem: "จับคู่คำบอกตำแหน่งกับคำที่มีความหมายตรงข้าม"
    pairs:
      - { left: "ข้างบน", right: "ข้างล่าง" }
      - { left: "ข้างหน้า", right: "ข้างหลัง" }
      - { left: "ทางซ้าย", right: "ทางขวา" }
      - { left: "ข้างใน", right: "ข้างนอก" }
      - { left: "ใกล้", right: "ไกล" }
    hints:
      - "นึกถึงตัวเองยืนอยู่กลางห้อง แล้วชี้ไปทางหนึ่งกับทางตรงข้าม"
      - "ข้างในกล่องกับข้างนอกกล่อง ใกล้บ้านกับไกลบ้าน"
    solution: "ข้างบน–ข้างล่าง ข้างหน้า–ข้างหลัง ทางซ้าย–ทางขวา ข้างใน–ข้างนอก ใกล้–ไกล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.position-direction.p003
    topics: [math.geometry.position-direction]
    difficulty: 1
    type: mcq
    stem: "ดูชั้นวางของในภาพ ในชั้นกลาง ของชิ้นใดอยู่ระหว่างลูกบอลกับหนังสือ"
    figure: { src: shelf.svg, alt: "ชั้นวางของสามชั้น ชั้นบนมีนาฬิกาทางซ้ายและแจกันทางขวา ชั้นกลางมีลูกบอลทางซ้าย กล่องตรงกลาง และหนังสือทางขวา ชั้นล่างมีรองเท้าทางซ้ายและตะกร้าทางขวา" }
    choices:
      - { id: a, text: "กล่อง", correct: true }
      - { id: b, text: "แจกัน", feedback: "แจกันอยู่ชั้นบน ข้อนี้ถามของในชั้นกลาง" }
      - { id: c, text: "ตะกร้า", feedback: "ตะกร้าอยู่ชั้นล่าง ข้างใต้หนังสือ ไม่ได้อยู่ระหว่างลูกบอลกับหนังสือ" }
    hints:
      - "\"ระหว่าง\" คืออยู่ตรงกลางของสองสิ่ง"
      - "ดูเฉพาะชั้นกลาง ไล่จากซ้ายไปขวา"
    solution: "ชั้นกลางเรียงจากซ้ายไปขวาเป็น ลูกบอล กล่อง หนังสือ กล่องจึงอยู่ระหว่างลูกบอลกับหนังสือ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.position-direction.p004
    topics: [math.geometry.position-direction]
    difficulty: 1
    type: numeric
    stem: "ต้องหมุนตัวหนึ่งในสี่รอบกี่ครั้ง จึงหมุนครบหนึ่งรอบพอดี (ตอบเป็นจำนวนครั้ง)"
    answer: { value: 4, unit: ครั้ง }
    hints:
      - "หนึ่งในสี่รอบคือหนึ่งส่วนจากสี่ส่วนของรอบ"
      - "หนึ่งในสี่รอบเท่ากับมุมฉาก 1 มุม หนึ่งรอบเท่ากับมุมฉากกี่มุม"
    misconceptions:
      - { match: 2, feedback: "หมุนหนึ่งในสี่รอบ 2 ครั้งได้แค่ครึ่งรอบ ยังหันไปทางตรงข้ามอยู่" }
    solution: "หนึ่งรอบแบ่งเป็นสี่ส่วนเท่ากัน หมุนหนึ่งในสี่รอบ 4 ครั้งจึงครบหนึ่งรอบ (มุมฉาก 4 มุม)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.position-direction.p005
    topics: [math.geometry.position-direction]
    difficulty: 2
    type: mcq
    stem: "ครูยืนหน้าห้อง หันหน้าเข้าหานักเรียน แล้วยกมือขวาขึ้น นักเรียนที่นั่งมองครูจะเห็นมือนั้นอยู่ทางใดของตัวนักเรียนเอง"
    choices:
      - { id: a, text: "ทางซ้ายของนักเรียน", correct: true }
      - { id: b, text: "ทางขวาของนักเรียน", feedback: "ครูกับนักเรียนหันหน้าสวนกัน ขวาของครูจึงอยู่ฝั่งซ้ายของนักเรียน ลองยืนหันหน้าเข้าหาเพื่อนแล้วยกมือขวาดู" }
      - { id: c, text: "ข้างหลังนักเรียน", feedback: "มือของครูอยู่หน้าห้อง ซึ่งอยู่ข้างหน้านักเรียน" }
    hints:
      - "ครูหันหน้าไปทางไหน นักเรียนหันหน้าไปทางไหน"
      - "เมื่อสองคนหันหน้าเข้าหากัน ซ้ายกับขวาจะสลับกัน"
    solution: "ครูหันหน้าเข้าหานักเรียน คือหันสวนทางกัน มือขวาของครูจึงอยู่ฝั่งเดียวกับมือซ้ายของนักเรียน นักเรียนเห็นมือนั้นอยู่ทางซ้ายของตัวเอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.position-direction.p006
    topics: [math.geometry.position-direction]
    difficulty: 2
    type: mcq
    stem: "ฟ้ายืนหันหน้าไปทางทิศเหนือ แล้วหมุนตัวครึ่งรอบ ตอนนี้ฟ้าหันหน้าไปทางทิศใด"
    choices:
      - { id: a, text: "ทิศใต้", correct: true }
      - { id: b, text: "ทิศตะวันออก", feedback: "นั่นคือหมุนหนึ่งในสี่รอบตามเข็มนาฬิกา ครึ่งรอบคือมุมฉาก 2 มุม" }
      - { id: c, text: "ทิศเหนือ", feedback: "หมุนหนึ่งรอบเต็มจึงจะกลับมาทิศเดิม ครึ่งรอบหันไปทางตรงข้าม" }
    hints:
      - "หมุนครึ่งรอบ คือหันไปทางตรงข้าม"
      - "ทิศตรงข้ามกับทิศเหนือคือทิศอะไร"
    solution: "หมุนครึ่งรอบทำให้หันไปทางตรงข้าม ทิศตรงข้ามกับทิศเหนือคือทิศใต้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.position-direction.p007
    topics: [math.geometry.position-direction]
    difficulty: 2
    type: order
    stem: "ปลื้มยืนหันหน้าไปทางทิศเหนือ แล้วหมุนตัวตามเข็มนาฬิกาทีละหนึ่งในสี่รอบ เรียงทิศที่ปลื้มหันหน้าไป เริ่มจากทิศเหนือ"
    items: ["ทิศเหนือ", "ทิศตะวันออก", "ทิศใต้", "ทิศตะวันตก"]
    hints:
      - "บนแผนที่ เหนืออยู่บน ตะวันออกอยู่ขวา"
      - "ตามเข็มนาฬิกาคือหมุนไปทางขวา เหมือนเข็มที่เดินจากเลข 12 ไปเลข 3"
    solution: "หมุนตามเข็มนาฬิกาทีละหนึ่งในสี่รอบจากทิศเหนือ จะหันไปทิศตะวันออก ทิศใต้ แล้วทิศตะวันตก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.position-direction.p008
    topics: [math.geometry.position-direction]
    difficulty: 2
    type: text
    stem: "ดูแผนผังหมู่บ้าน วัดอยู่ช่องใด (ตอบเป็นตัวอักษรตามด้วยตัวเลข เช่น A1)"
    figure: { src: village-map.svg, alt: "แผนผังหมู่บ้านบนตาราง 5 คูณ 5 ช่อง คอลัมน์ A ถึง E จากซ้ายไปขวา แถว 1 ถึง 5 จากล่างขึ้นบน มีลูกศรบอกทิศเหนือชี้ขึ้น ช่อง A1 เป็นตลาด ช่อง D2 เป็นโรงเรียน ช่อง C3 เป็นบ้านต้น ช่อง D3 เป็นไปรษณีย์ ช่อง B4 เป็นวัด ช่อง A5 เป็นสวน ช่อง E5 เป็นสระน้ำ" }
    accepted: ["B4", "b4", "B 4"]
    misconceptions:
      - { match: "4B", feedback: "ตำแหน่งถูกแล้ว แต่ให้เขียนตัวอักษรก่อนตัวเลข" }
      - { match: "D2", feedback: "D2 คือโรงเรียน วัดอยู่คอลัมน์ที่สองจากซ้าย" }
    hints:
      - "ลากนิ้วจากวัดลงไปข้างล่างเพื่ออ่านตัวอักษร"
      - "แล้วลากนิ้วจากวัดไปทางซ้ายเพื่ออ่านตัวเลข"
    solution: "วัดอยู่คอลัมน์ B และแถวที่ 4 จึงอยู่ช่อง B4"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.position-direction.p009
    topics: [math.geometry.position-direction]
    difficulty: 2
    type: mcq
    stem: "ดูแผนผังหมู่บ้าน ช่อง D2 มีอะไร"
    figure: { src: village-map.svg, alt: "แผนผังหมู่บ้านบนตาราง 5 คูณ 5 ช่อง คอลัมน์ A ถึง E จากซ้ายไปขวา แถว 1 ถึง 5 จากล่างขึ้นบน มีลูกศรบอกทิศเหนือชี้ขึ้น ช่อง A1 เป็นตลาด ช่อง D2 เป็นโรงเรียน ช่อง C3 เป็นบ้านต้น ช่อง D3 เป็นไปรษณีย์ ช่อง B4 เป็นวัด ช่อง A5 เป็นสวน ช่อง E5 เป็นสระน้ำ" }
    choices:
      - { id: a, text: "โรงเรียน", correct: true }
      - { id: b, text: "วัด", feedback: "วัดอยู่ช่อง B4 ถ้าอ่านเลข 2 เป็นคอลัมน์และ D เป็นแถวจะสับสน อ่านตัวอักษรก่อน" }
      - { id: c, text: "ไปรษณีย์", feedback: "ไปรษณีย์อยู่ช่อง D3 คอลัมน์ถูกแล้ว แต่แถวสูงไปหนึ่งแถว" }
    hints:
      - "หาคอลัมน์ D ก่อน แล้วไล่ขึ้นไปถึงแถวที่ 2"
      - "แถวนับจากล่างขึ้นบน"
    solution: "คอลัมน์ D แถวที่ 2 คือโรงเรียน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.position-direction.p010
    topics: [math.geometry.position-direction]
    difficulty: 3
    type: mcq
    stem: "หุ่นยนต์อยู่ที่จุดเริ่มต้นและหันหน้าขึ้น ทำตามคำสั่ง: เดินไปข้างหน้า 3 ช่อง เลี้ยวขวา เดินไปข้างหน้า 2 ช่อง หุ่นยนต์หยุดที่ช่องใด"
    figure: { src: robot-grid.svg, alt: "ตาราง 7 ช่องคูณ 5 แถว หุ่นยนต์อยู่ในช่องที่ 3 จากซ้ายของแถวล่างสุด หันหน้าขึ้น มีช่องที่ทำเครื่องหมายไว้สี่ช่อง ก อยู่ช่องที่ 5 จากซ้ายของแถวที่ 4 จากล่าง ข อยู่ช่องที่ 1 ของแถวที่ 4 ค อยู่ช่องที่ 6 ของแถวที่ 3 ง อยู่ช่องที่ 4 ของแถวที่ 3" }
    choices:
      - { id: a, text: "ก", correct: true }
      - { id: b, text: "ข", feedback: "หุ่นยนต์เลี้ยวซ้ายแทนเลี้ยวขวา เลี้ยวขวาเมื่อหันขึ้นคือหันไปทางขวาของภาพ" }
      - { id: c, text: "ค", feedback: "สลับจำนวนช่อง เดินขึ้น 2 แล้วไปขวา 3 คำสั่งให้ขึ้น 3 ก่อน" }
      - { id: d, text: "ง", feedback: "นับช่องที่ยืนอยู่ตอนเริ่มเป็นช่องแรก ให้นับเฉพาะช่องที่ก้าวไป" }
    hints:
      - "เดินขึ้นไป 3 ช่องก่อน ทำเครื่องหมายไว้"
      - "เลี้ยวขวาเมื่อหันหน้าขึ้น จะหันไปทางขวาของภาพ แล้วเดินอีก 2 ช่อง"
    solution: "จากจุดเริ่มต้น (ช่องที่ 3 แถวที่ 1) เดินขึ้น 3 ช่องถึงแถวที่ 4 เลี้ยวขวาแล้วเดินไปทางขวา 2 ช่องถึงช่องที่ 5 แถวที่ 4 คือช่อง ก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.position-direction.p011
    topics: [math.geometry.position-direction]
    difficulty: 3
    type: mcq
    stem: "ต้นหันหน้าไปทางทิศเหนือ แล้วหมุนตัวตามเข็มนาฬิกาหนึ่งในสี่รอบ ต้นหันหน้าไปทางทิศใด"
    choices:
      - { id: a, text: "ทิศตะวันออก", correct: true }
      - { id: b, text: "ทิศตะวันตก", feedback: "นั่นคือหมุนทวนเข็มนาฬิกา ตามเข็มนาฬิกาคือหมุนไปทางขวา" }
      - { id: c, text: "ทิศใต้", feedback: "ทิศใต้ได้จากการหมุนครึ่งรอบ หนึ่งในสี่รอบหมุนแค่มุมฉาก 1 มุม" }
    hints:
      - "บนแผนที่ ทิศเหนืออยู่บน ทิศตะวันออกอยู่ขวา"
      - "ตามเข็มนาฬิกาจากเลข 12 ไปเลข 3 คือจากบนไปขวา"
    solution: "หมุนตามเข็มนาฬิกาหนึ่งในสี่รอบจากทิศเหนือ (บน) จะหันไปทางขวา คือทิศตะวันออก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.position-direction.p012
    topics: [math.geometry.position-direction]
    difficulty: 3
    type: numeric
    stem: "ดูแผนผังหมู่บ้าน ถ้าเดินจากตลาดไปทางทิศตะวันออกตามแถวที่ 1 จนถึงคอลัมน์ D แล้วเดินขึ้นไปทางทิศเหนือถึงโรงเรียน ต้องเดินผ่านทั้งหมดกี่ช่อง (นับช่องที่ก้าวไป ไม่นับช่องตลาด ตอบเป็นจำนวนช่อง)"
    figure: { src: village-map.svg, alt: "แผนผังหมู่บ้านบนตาราง 5 คูณ 5 ช่อง คอลัมน์ A ถึง E จากซ้ายไปขวา แถว 1 ถึง 5 จากล่างขึ้นบน มีลูกศรบอกทิศเหนือชี้ขึ้น ช่อง A1 เป็นตลาด ช่อง D2 เป็นโรงเรียน ช่อง C3 เป็นบ้านต้น ช่อง D3 เป็นไปรษณีย์ ช่อง B4 เป็นวัด ช่อง A5 เป็นสวน ช่อง E5 เป็นสระน้ำ" }
    answer: { value: 4, unit: ช่อง }
    hints:
      - "จาก A ไป D ไปทางขวากี่ช่อง"
      - "จากแถว 1 ไปแถว 2 ขึ้นไปกี่ช่อง แล้วรวมกัน"
    misconceptions:
      - { match: 5, feedback: "นับช่องตลาดที่ยืนอยู่ตอนเริ่มด้วย ให้นับเฉพาะช่องที่ก้าวไป" }
      - { match: 3, feedback: "นับแค่ทางไปทิศตะวันออก ยังต้องเดินขึ้นไปทิศเหนืออีก" }
