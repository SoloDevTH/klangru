  choices:
  - id: a
    text: จับฉลากพิกัดหลายจุดให้กระจายทั่วนา แล้ววางกรอบตามพิกัดนั้น
    correct: true
  - id: b
    text: วางเฉพาะจุดที่เห็นหอยเยอะ จะได้นับง่าย
    feedback: ได้จำนวนสูงเกินจริง เพราะตัวอย่างไม่เป็นตัวแทน
  - id: c
    text: วางกรอบเดียวตรงกลางนาก็พอ
    feedback: กรอบเดียวอาจบังเอิญมีมากหรือน้อยผิดปกติ
  - id: d
    text: วางเฉพาะริมคันนาเพราะเดินสะดวก
    feedback: ริมคันนาอาจต่างจากกลางนา ตัวอย่างจึงไม่เป็นตัวแทน
  hints:
