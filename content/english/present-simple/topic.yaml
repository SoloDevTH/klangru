id: english.grammar.present-simple
subject: english
title: { th: Present simple (ปัจจุบันกาลธรรมดา), en: Present simple }
summary: ใช้ present simple เล่ากิจวัตรและความจริง เติม s หรือ es กับ he she it ได้ถูก และสร้างประโยคปฏิเสธและคำถามด้วย do และ does
difficulty: 1.5
minutes: 30
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - type: figure
    src: present-simple-timeline.svg
    alt: "เส้นเวลาสองเส้นจากอดีตไปอนาคต มีขีดแดงบอกตอนนี้ เส้นแรก I jog every morning. มีกากบาทเว้นระยะเท่ากันตลอดเส้นทั้งก่อนและหลังตอนนี้ หมายถึงทำซ้ำเป็นประจำ เส้นที่สอง Water boils at 100 °C. มีแถบสีฟ้าคลุมทั้งเส้น หมายถึงจริงเสมอไม่ขึ้นกับเวลา"
    caption: "present simple ใช้กับสิ่งที่เกิดซ้ำเป็นประจำ และสิ่งที่เป็นจริงเสมอ"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: เติม s ให้กริยาที่ลงท้ายด้วย y
    problem: "เติมกริยาให้ถูก: *My sister ___ (study) at the library, and she ___ (play) badminton after school.*"
    steps:
      - text: "ประธานคือ my sister = she เป็นบุรุษที่ 3 เอกพจน์ ประโยคบอกเล่าจึงต้องเติม s หรือ es ทั้งสองช่อง"
      - text: "study ลงท้ายด้วยพยัญชนะ d + y จึงเปลี่ยน y เป็น i แล้วเติม es ได้ studies"
        why: "ถ้าเติม s ตรง ๆ จะได้ studys ซึ่งสะกดผิด"
      - text: "play ลงท้ายด้วยสระ a + y จึงเติม s ตรง ๆ ได้ plays"
        why: "หน้า y เป็นสระ จึงไม่เปลี่ยน y"
    answer: "*My sister **studies** at the library, and she **plays** badminton after school.*"
  - { type: check, problem: eng.pres.p016, prompt: "ลองใช้ do หรือ does ในคำถาม wh-" }
  - type: worked-example
    title: เขียนเรื่องสั้นเกี่ยวกับกิจวัตรของเพื่อน
    problem: "เปลี่ยนข้อความของต้นให้เป็นการเล่าเรื่องต้น (he): *I live in Phitsanulok. I get up at six and I help my mother. I don't like maths because it is hard.*"
    steps:
      - text: "ประธานเปลี่ยนจาก I เป็น He ทุกประโยค ประโยคบอกเล่าต้องเติม s/es"
      - text: "live → lives · get → gets · help → helps"
      - text: "ประโยคปฏิเสธ don't like เปลี่ยนเป็น doesn't like (like ไม่เติม s)"
        why: "s ย้ายไปอยู่ที่ does แล้ว กริยาหลักจึงอยู่ในรูปเดิม"
      - text: "my mother เปลี่ยนเป็น his mother ส่วน it is hard ไม่ต้องเปลี่ยน เพราะประธานคือ it อยู่แล้ว"
      - text: "ตรวจคำเชื่อม and และ because ว่ายังเชื่อมความได้ถูก"
    answer: "*He lives in Phitsanulok. He gets up at six and he helps his mother. He doesn't like maths because it is hard.*"
  - { type: check, problem: eng.pres.p018, prompt: "อ่านเรื่องสั้นแล้วตอบคำถาม" }
glossary:
  - { term: present simple, definition: "รูปประโยคที่ใช้กับนิสัย กิจวัตร ความจริงทั่วไป และตารางเวลา เช่น She walks to school." }
  - { term: ประธานเอกพจน์บุรุษที่ 3, definition: "ประธานที่เป็น he, she, it หรือคน สัตว์ สิ่งของจำนวนหนึ่ง ซึ่งทำให้กริยาใน present simple ต้องเติม s หรือ es" }
  - { term: คำบอกความถี่, definition: "คำอย่าง always, usually, often, sometimes, never ที่บอกว่าทำบ่อยแค่ไหน วางหน้ากริยาหลักแต่หลัง verb to be" }
flashcards:
  - { front: "เมื่อไรต้องเติม s ที่กริยาใน present simple", back: "เมื่อประธานเป็น he, she, it หรือเอกพจน์บุรุษที่ 3 ในประโยคบอกเล่า เช่น She plays." }
  - { front: "กริยาที่ลงท้ายด้วย s, sh, ch, x, o เติมอะไร", back: "เติม es เช่น watches, fixes, goes" }
  - { front: "study, play เป็นรูปเติม s อย่างไร", back: "studies (พยัญชนะ + y เปลี่ยนเป็น ies) และ plays (สระ + y เติม s)" }
  - { front: "He ___ (not / like) durian.", back: "He doesn't like durian. (มี does แล้ว กริยาหลักไม่เติม s)" }
