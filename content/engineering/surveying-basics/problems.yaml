    stem: "หมุด A มีพิกัด $E = 1000.000\\ \\mathrm{m}$, $N = 2000.000\\ \\mathrm{m}$ แนว AB ยาว $250.000\\ \\mathrm{m}$ อะซิมัท $210^\\circ$ พิกัด $N$ ของหมุด B เป็นกี่เมตร (ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 1783.49, tolerance: 0.01, unit: m }
