  - { title: "รากที่ n", url: "https://th.wikipedia.org/wiki/รากที่_n", source: wikipedia-th, lang: th, license: CC-BY-SA-4.0 }
  - { title: "Exponentiation", url: "https://en.wikipedia.org/wiki/Exponentiation", source: wikipedia-en, lang: en, license: CC-BY-SA-4.0 }
  - { title: "6.2 Use Multiplication Properties of Exponents (Elementary Algebra 2e, OpenStax)", url: "https://openstax.org/books/elementary-algebra-2e/pages/6-2-use-multiplication-properties-of-exponents", source: openstax, lang: en, license: CC-BY-NC-SA-4.0 }
