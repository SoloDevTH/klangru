rows:
  - { framework: th-coe-engineering-basics, indicators: ["MET-2.5"], coverage: partial, note: "สอนโลหะวิทยาของเหล็กกล้าคาร์บอนผ่านแผนภาพเฟสเหล็ก–คาร์บอน เพิร์ลไลต์ มาร์เทนไซต์ ซีเมนไทต์ การแบ่งเหล็กกล้าคาร์บอนต่ำ กลาง สูง และเหล็กหล่อในภาพรวม และคาร์บอนเทียบเท่าสำหรับงานเชื่อม รวมถึงการชุบแข็งด้วยการตกตะกอนของอะลูมิเนียมโดยสังเขป แต่ยังไม่สอนเหล็กหล่อแต่ละชนิดอย่างละเอียด เหล็กไร้สนิมอย่างละเอียด ทองแดงและไทเทเนียม และโลหะทนความร้อนสูง" }
  - { framework: th-coe-engineering-basics, indicators: ["MET-2.7"], coverage: partial, note: "สอนกระบวนการอบชุบความร้อนหลัก (อบอ่อน อบปกติ ชุบแข็ง อบคืนตัว) และแผนภาพ TTT ในเชิงแนวคิด แต่ยังไม่สอนการหล่อ การแปรสภาพและการขึ้นรูปร้อนหรือเย็น การปรับปรุงผิว การเชื่อมและบัดกรีอย่างเป็นระบบ" }
