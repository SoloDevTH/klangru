id: math.number.scientific-notation
subject: math
title: { th: เลขชี้กำลังลบและสัญกรณ์วิทยาศาสตร์, en: Negative exponents and scientific notation }
summary: เขียนจำนวนที่ใหญ่มากหรือเล็กมากให้สั้นและอ่านง่ายในรูป a คูณสิบยกกำลัง n แล้วคูณหารจำนวนเหล่านี้โดยจัดการเลขชี้กำลัง
difficulty: 3
minutes: 30
prerequisites: [math.number.exponents, math.number.decimals]
encompasses:
  - { id: math.number.exponents, weight: 0.4 }
  - { id: math.number.decimals, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: powers-of-ten-ladder.svg
    alt: "แกนตั้งสเกลกำลังของสิบตั้งแต่ 10 ยกกำลังลบ 10 ถึง 10 ยกกำลัง 11 เมตร มีจุดเรียงจากบนลงล่าง ระยะโลกถึงดวงอาทิตย์ 1.5 × 10^11 m เส้นผ่านศูนย์กลางโลก 1.3 × 10^7 m ความยาวประเทศไทยประมาณ 1.6 × 10^6 m ตึกสูงประมาณ 3 × 10^2 m คนประมาณ 1.7 m มดประมาณ 3 × 10^-3 m เส้นผมประมาณ 7 × 10^-5 m ฝุ่น PM2.5 2.5 × 10^-6 m ไวรัสประมาณ 1 × 10^-7 m และอะตอมประมาณ 1 × 10^-10 m"
    caption: "เลื่อนขึ้นหนึ่งขีดคือใหญ่ขึ้น 10 เท่า เส้นผมกับฝุ่น PM2.5 ห่างกันไม่ถึงสองขั้น ส่วนอะตอมกับดวงอาทิตย์ห่างกัน 21 ขั้น"
  - type: worked-example
    title: ประมาณด้วยเลขหลักเดียวแล้วเทียบกี่เท่า
    problem: "ประชากรไทยประมาณ 66,000,000 คน ประชากรโลกประมาณ 8,100,000,000 คน ประมาณแต่ละจำนวนเป็นเลขหลักเดียวคูณกำลังของสิบ แล้วบอกว่าประชากรโลกมากกว่าไทยราวกี่เท่า"
    steps:
      - text: "$66{,}000{,}000 = 6.6 \\times 10^{7} \\approx 7 \\times 10^{7}$"
        why: "ปัดสัมประสิทธิ์ให้เหลือหลักเดียวเพื่อคิดในใจได้ง่าย"
      - text: "$8{,}100{,}000{,}000 = 8.1 \\times 10^{9} \\approx 8 \\times 10^{9}$"
      - text: "หาร: $\\dfrac{8 \\times 10^{9}}{7 \\times 10^{7}} = \\dfrac{8}{7} \\times 10^{2} \\approx 1.1 \\times 10^{2}$"
        why: "หารสัมประสิทธิ์และลบเลขชี้กำลังแยกกัน $9 - 7 = 2$"
      - text: "ได้ประมาณ $110$ เท่า หรือพูดคร่าว ๆ ว่าราว 100 เท่า (ใช้ค่าจริงได้ $\\tfrac{8.1 \\times 10^{9}}{6.6 \\times 10^{7}} \\approx 123$ เท่า)"
    answer: "ประชากรโลกมากกว่าไทยราว $10^{2}$ เท่า (ประมาณ 110–120 เท่า)"
  - { type: check, problem: math.sci.p002, prompt: "สัมประสิทธิ์ต้องอยู่ในช่วงใด" }
  - type: worked-example
    title: บวกและลบเมื่อเลขชี้กำลังต่างกัน
    problem: "หา $3.2 \\times 10^{5} + 4.6 \\times 10^{4}$ และ $5.3 \\times 10^{-2} - 8 \\times 10^{-3}$ ตอบในสัญกรณ์วิทยาศาสตร์"
    steps:
      - text: "เปลี่ยน $4.6 \\times 10^{4}$ ให้มีเลขชี้กำลัง 5: $4.6 \\times 10^{4} = 0.46 \\times 10^{5}$"
        why: "สัมประสิทธิ์เล็กลง 10 เท่า เลขชี้กำลังจึงเพิ่มขึ้น 1 ค่ารวมเท่าเดิม"
      - text: "บวก: $(3.2 + 0.46) \\times 10^{5} = 3.66 \\times 10^{5}$"
      - text: "เปลี่ยน $8 \\times 10^{-3} = 0.8 \\times 10^{-2}$"
        why: "$-2$ มากกว่า $-3$ จึงปรับตัวที่เลขชี้กำลังน้อยกว่าให้ขึ้นมาเท่ากัน"
      - text: "ลบ: $(5.3 - 0.8) \\times 10^{-2} = 4.5 \\times 10^{-2}$"
      - text: "ตรวจด้วยทศนิยม: $320{,}000 + 46{,}000 = 366{,}000$ ✓ และ $0.053 - 0.008 = 0.045$ ✓"
    answer: "$3.66 \\times 10^{5}$ และ $4.5 \\times 10^{-2}$"
  - { type: check, problem: math.sci.p007, prompt: "คูณสัมประสิทธิ์ บวกเลขชี้กำลัง แล้วปรับรูป" }
  - type: interactive
    title: เลขชี้กำลังของ 10 บนเส้นจำนวน
    caption: จุดบนเส้นนี้คือเลขชี้กำลัง n ของ 10 ทุกครั้งที่ขยับไปทางซ้าย 1 ช่อง ค่าของ 10 ยกกำลัง n จะถูกหารด้วย 10 สังเกตว่าเลยศูนย์ไปทางลบแล้วค่ายังเป็นบวกเสมอ แค่เล็กลงเรื่อย ๆ
    widget:
      kind: number-line
      min: -4
      max: 4
      points:
        - { value: 3, label: "1000" }
        - { value: 2, label: "100" }
        - { value: 1, label: "10" }
        - { value: 0, label: "1" }
        - { value: -1, label: "0.1" }
        - { value: -2, label: "0.01" }
        - { value: -3, label: "0.001" }
      jumps:
        - { from: 1, to: 0, label: "÷10" }
        - { from: 0, to: -1, label: "÷10" }
        - { from: -1, to: -2, label: "÷10" }
glossary:
  - { term: เลขชี้กำลังลบ, definition: "เลขยกกำลังที่เลขชี้กำลังเป็นจำนวนลบ หมายถึงส่วนกลับ เช่น $10^{-2} = \\dfrac{1}{10^2} = 0.01$" }
  - { term: สัญกรณ์วิทยาศาสตร์, definition: "การเขียนจำนวนในรูป $a \\times 10^{n}$ เมื่อ $1 \\le a < 10$ และ $n$ เป็นจำนวนเต็ม" }
  - { term: สัมประสิทธิ์, definition: "ตัวเลข $a$ ที่อยู่หน้า $10^{n}$ ในสัญกรณ์วิทยาศาสตร์ ต้องมีค่าตั้งแต่ 1 แต่น้อยกว่า 10" }
flashcards:
  - { front: "$a^{-n}$ เท่ากับเท่าใด", back: "$\\dfrac{1}{a^{n}}$ (เมื่อ $a \\ne 0$) เช่น $2^{-3} = \\dfrac{1}{8}$ ค่ายังเป็นบวก ไม่ได้กลายเป็นลบ" }
  - { front: "รูปสัญกรณ์วิทยาศาสตร์มีเงื่อนไขอะไร", back: "$a \\times 10^{n}$ โดย $1 \\le a < 10$ และ $n$ เป็นจำนวนเต็ม" }
  - { front: "$(a \\times 10^{m})(b \\times 10^{n})$ คิดอย่างไร", back: "คูณสัมประสิทธิ์ $a \\times b$ แล้วบวกเลขชี้กำลัง $m + n$ ถ้าสัมประสิทธิ์เกิน 10 ให้ปรับรูปใหม่" }
  - { front: "เขียน $0.004$ ในสัญกรณ์วิทยาศาสตร์", back: "$4 \\times 10^{-3}$ (เลื่อนจุดทศนิยมไปทางขวา 3 ตำแหน่ง)" }
