<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300" font-family="sans-serif" font-size="14">
  <title>ฉลากขนมทองม้วนของกลุ่มแม่บ้าน (สมมติ)</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="460" height="300" fill="#ffffff"/>
  <rect x="20.0" y="20.0" width="420.0" height="260.0" rx="12" fill="#fffbeb" stroke="#1f2937" stroke-width="2"/>
  <text x="230.0" y="58.0" text-anchor="middle" fill="#1f2937" font-size="20" font-weight="bold">ทองม้วนกรอบ สูตรมะพร้าวอ่อน</text>
  <text x="230.0" y="84.0" text-anchor="middle" fill="#6b7280" font-size="13">กลุ่มแม่บ้านบ้านดอนแก้ว (สมมติ)</text>
  <text x="40.0" y="118.0" text-anchor="start" fill="#1f2937" font-size="14" font-weight="bold">ส่วนประกอบ:</text>
  <text x="165.0" y="118.0" text-anchor="start" fill="#1f2937" font-size="14">แป้งข้าวเจ้า 40% กะทิ 30% น้ำตาล 25%</text>
  <text x="40.0" y="144.0" text-anchor="start" fill="#1f2937" font-size="14" font-weight="bold"></text>
  <text x="165.0" y="144.0" text-anchor="start" fill="#1f2937" font-size="14">ไข่ไก่ งาดำ เกลือ</text>
  <text x="40.0" y="170.0" text-anchor="start" fill="#1f2937" font-size="14" font-weight="bold">น้ำหนักสุทธิ:</text>
  <text x="165.0" y="170.0" text-anchor="start" fill="#1f2937" font-size="14">150 กรัม</text>
  <text x="40.0" y="196.0" text-anchor="start" fill="#1f2937" font-size="14" font-weight="bold">ผลิตโดย:</text>
  <text x="165.0" y="196.0" text-anchor="start" fill="#1f2937" font-size="14">กลุ่มแม่บ้านบ้านดอนแก้ว อ.เมือง จ.ลำพูน</text>
  <text x="40.0" y="222.0" text-anchor="start" fill="#1f2937" font-size="14" font-weight="bold">เลขสารบบอาหาร:</text>
  <text x="165.0" y="222.0" text-anchor="start" fill="#1f2937" font-size="14">51-2-XXXXX-2-XXXX</text>
  <text x="40.0" y="248.0" text-anchor="start" fill="#1f2937" font-size="14" font-weight="bold">ราคา:</text>
  <text x="165.0" y="248.0" text-anchor="start" fill="#1f2937" font-size="14">45 บาท</text>
  <text x="230.0" y="266.0" text-anchor="middle" fill="#6b7280" font-size="12">เก็บในที่แห้ง ปิดถุงให้สนิทหลังเปิด</text>
</svg>
