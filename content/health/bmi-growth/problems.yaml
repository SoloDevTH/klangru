    ai_assisted: true

  - id: hlt.bmi.p022
    topics: [health.body.bmi-growth]
    difficulty: 2
    type: numeric
    stem: "สมุดบันทึกสุขภาพของเด็กชายต้นบันทึกว่า ตอนอายุ 10 ปีสูง 140 เซนติเมตร ตอนอายุ 12 ปีสูง 152 เซนติเมตร ส่วนสูงเพิ่มขึ้นเฉลี่ยปีละกี่เซนติเมตร (ตอบเป็นตัวเลขในหน่วย cm)"
    answer: { value: 6, unit: cm }
    hints:
      - "หาส่วนสูงที่เพิ่มขึ้นทั้งหมดก่อน"
      - "นำส่วนที่เพิ่มหารด้วยจำนวนปี"
    misconceptions:
      - { match: 12, feedback: "12 เซนติเมตรคือที่เพิ่มขึ้นตลอด 2 ปี ต้องหารด้วย 2 เพื่อหาค่าเฉลี่ยต่อปี" }
    solution: "เพิ่มขึ้น $152 - 140 = 12$ เซนติเมตร ใน 2 ปี เฉลี่ย $12 \\div 2 = 6$ เซนติเมตรต่อปี การบันทึกเป็นระยะช่วยให้เห็นแนวโน้มการเจริญเติบโตของแต่ละคน"
