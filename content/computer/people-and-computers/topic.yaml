id: computer.society.people-and-computers
subject: computer
title: { th: คนกับคอมพิวเตอร์และอัลกอริทึมรอบตัว, en: "People, computers and the algorithms around us" }
summary: คนออกแบบเทคโนโลยีเพื่อแก้ปัญหา เลือกใช้คอมพิวเตอร์เมื่อเหมาะสม เปลี่ยนลำดับในอัลกอริทึมแล้วผลเปลี่ยน และดูว่าใครได้หรือเสียประโยชน์เมื่อใช้เทคโนโลยีใหม่
difficulty: 2
minutes: 35
prerequisites: [computer.algorithms.intro, computer.safety.safe-ict-primary]
encompasses:
  - { id: computer.algorithms.intro, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: route-choice.svg
    alt: "เส้นทางสองเส้นจากห้องเรียนไปห้องสมุด เส้นบนมีบันไดหลายขั้น ยาว 120 เมตร เส้นล่างเป็นทางลาดโค้งเรียบ ยาว 150 เมตร"
    caption: "อัลกอริทึมเลือกเส้นทางได้ต่างกันขึ้นกับเงื่อนไขที่ตั้งไว้"
  - type: worked-example
    title: เลือกเส้นทางให้ทุกคนไปถึงได้
    problem: "เส้นทางจากห้องเรียนไปห้องสมุดมี 2 เส้น เส้นที่ 1 มีบันได ยาว 120 เมตร เส้นที่ 2 เป็นทางลาด ยาว 150 เมตร ถ้าอัลกอริทึมเลือกเส้นทาง 'ที่สั้นที่สุด' จะเลือกเส้นใด และถ้ามีเพื่อนนั่งรถเข็นต้องเลือกเส้นใด"
    steps:
      - text: "เลือกตามเงื่อนไข 'สั้นที่สุด' เปรียบเทียบ 120 กับ 150 เมตร ได้เส้นที่ 1 ซึ่งมีบันได"
        why: "อัลกอริทึมทำตามเงื่อนไขที่เราตั้งไว้เท่านั้น มันไม่ได้คิดถึงคนที่ใช้เส้นทาง"
      - text: "ตรวจเงื่อนไขของเพื่อนที่นั่งรถเข็น บันไดขึ้นไม่ได้ เส้นที่ 1 จึงใช้ไม่ได้สำหรับเพื่อนคนนี้"
      - text: "เพิ่มเงื่อนไขว่า 'ต้องไม่มีบันได' อัลกอริทึมจะตัดเส้นที่ 1 ทิ้ง เหลือเส้นที่ 2 ยาว 150 เมตร"
        why: "เส้นทางที่ยาวกว่าอาจเป็นเส้นทางที่ดีที่สุดสำหรับบางคน"
      - text: "สรุป ทางเดียวกันแต่เงื่อนไขต่างกันทำให้คำตอบต่างกัน ก่อนตั้งเงื่อนไขควรถามว่าใครได้ประโยชน์และใครเสียประโยชน์"
    answer: "อัลกอริทึม 'สั้นที่สุด' เลือกเส้นที่ 1 แต่เพื่อนที่นั่งรถเข็นต้องใช้เส้นที่ 2 (150 เมตร)"
  - { type: check, problem: computer.society.people-and-computers.p012, prompt: "ลองคิดว่าระบบเช็กชื่อด้วยแอปจะเสียเปรียบใคร" }
  - type: figure
    src: queue-order.svg
    alt: "แผนภาพแถบเวลาสองแถว แถวบนเรียง A ใช้ 5 นาที ตามด้วย B ใช้ 2 นาที และ C ใช้ 3 นาที แถวล่างเรียง B ใช้ 2 นาที ตามด้วย C ใช้ 3 นาที และ A ใช้ 5 นาที แกนนอนบอกเวลา 0 ถึง 10 นาที"
    caption: "สลับลำดับคิวเพียงอย่างเดียว ก็เปลี่ยนเวลาที่แต่ละคนต้องรอ"
  - type: worked-example
    title: จัดคิวสองแบบแล้วเทียบเวลารอ
    problem: "ลูกค้า 3 คนใช้เวลา A 5 นาที B 2 นาที และ C 3 นาที ถ้าจัดคิวตามลำดับเข้าคิว (A B C) กับจัดให้คนที่ใช้เวลาน้อยได้ก่อน (B C A) เวลารอเฉลี่ยต่างกันอย่างไร"
    steps:
      - text: "ลำดับ A B C: A รอ 0 นาที B รอ 5 นาที C รอ 7 นาที รวม 12 นาที เฉลี่ย 4 นาที"
      - text: "ลำดับ B C A: B รอ 0 นาที C รอ 2 นาที A รอ 5 นาที รวม 7 นาที เฉลี่ยประมาณ 2.33 นาที"
        why: "คนที่อยู่หลังต้องรอเวลาทำของทุกคนที่อยู่ข้างหน้า"
      - text: "เทียบ 4 − 2.33 = 1.67 ลำดับที่สองทำให้เวลารอเฉลี่ยลดลงประมาณ 1.67 นาทีต่อคน"
      - text: "ดูด้วยว่าคน A ที่ใช้เวลานานต้องรอ 5 นาที ซึ่งนานกว่าเดิม จึงควรดูผลทั้งสองด้านเสมอ"
        why: "การเฉลี่ยทำให้เห็นภาพรวม แต่ไม่ได้บอกว่าคนแต่ละคนได้รับผลอย่างไร"
    answer: "ลำดับที่สองลดเวลารอเฉลี่ยลงประมาณ 1.67 นาที แต่คน A ต้องรอนานขึ้นจาก 0 เป็น 5 นาที"
  - { type: check, problem: computer.society.people-and-computers.p007, prompt: "ลองสลับ A กับ B แล้วดูว่าเวลารอเฉลี่ยเปลี่ยนอย่างไร" }
glossary:
  - { term: อัลกอริทึม (algorithm), definition: "ลำดับขั้นตอนที่ชัดเจนสำหรับทำงานให้สำเร็จ ถ้าลำดับหรือเงื่อนไขต่างกัน ผลลัพธ์อาจต่างกันได้" }
  - { term: เซนเซอร์ (sensor), definition: "อุปกรณ์ที่รับข้อมูลจากสิ่งรอบตัว เช่น ระยะห่างจากสิ่งกีดขวาง แล้วส่งให้คอมพิวเตอร์ประมวลผล" }
  - { term: ความเป็นส่วนตัว (privacy), definition: "สิทธิที่จะควบคุมว่าข้อมูลเกี่ยวกับตัวเราจะถูกเก็บ ใช้ และเปิดเผยอย่างไร" }
  - { term: การเข้าถึงได้ (accessibility), definition: "การออกแบบให้ทุกคน รวมทั้งคนที่มีข้อจำกัดด้านร่างกาย สายตา หรือการได้ยิน ใช้งานได้" }
  - { term: เทคโนโลยีเกิดใหม่ (emerging technology), definition: "เทคโนโลยีใหม่ที่ยังไม่แพร่หลายและยังมีการพัฒนาอยู่" }
flashcards:
  - { front: "อัลกอริทึมเปลี่ยนแค่ลำดับ ผลเปลี่ยนได้ไหม", back: "ได้ เช่น เวลารอเฉลี่ยของคนในคิวเปลี่ยนไปเมื่อสลับลำดับ" }
  - { front: "ทำไมต้องถามว่าใครได้ประโยชน์จากอัลกอริทึม", back: "เพราะอัลกอริทึมเดียวกันอาจช่วยคนหนึ่งและเสียเปรียบอีกคนได้" }
  - { front: "ข้อจำกัดของโทรศัพท์บ้านนำไปสู่อะไร", back: "โทรศัพท์มือถือที่พกไปได้" }
  - { front: "ก่อนรับเทคโนโลยีใหม่ ขั้นแรกคืออะไร", back: "ตั้งคำถามให้ชัดว่าปัญหาคืออะไร และเทคโนโลยีช่วยแก้ได้จริงหรือไม่" }
