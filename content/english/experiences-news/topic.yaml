id: english.writing.experiences-news
subject: english
title: { th: "การพูดและเขียนบรรยายประสบการณ์ ข่าว และเหตุการณ์", en: "Describing experiences, news and events" }
summary: เล่ากิจวัตร ประสบการณ์ และเหตุการณ์เป็นลำดับ เขียนข่าวแบบพีระมิดกลับหัว เปรียบเทียบเหตุการณ์ และบอกความรู้สึกกับความคิดเห็นต่อข่าวพร้อมเหตุผล
difficulty: 4.5
minutes: 45
prerequisites: [english.grammar.past-continuous, english.grammar.present-perfect]
encompasses:
  - { id: english.grammar.past-continuous, weight: 0.4 }
  - { id: english.grammar.present-perfect, weight: 0.4 }
  - { id: english.grammar.past-simple, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: news-pyramid.svg
    alt: "พีระมิดกลับหัวสี่ชั้น หัวภาพเขียนว่า ข่าวเรียงแบบพีระมิดกลับหัว: สำคัญที่สุดอยู่บนสุด ชั้นบนสุดกว้างที่สุดสีแดง Headline (หัวข่าวสั้น) ตัวอย่าง New Bike Path Opens Along Nan River ชั้นที่ 2 สีส้ม Lead (Who · What · Where · When) ตัวอย่าง A new bike path has opened ... ชั้นที่ 3 สีส้มอ่อน Details (Why · How · ตัวเลข) ตัวอย่าง It took eight months to build ... ชั้นล่างสุดแคบที่สุด Quotes & other views (คำพูด มุมมองอื่น) ตัวอย่าง \"Now I feel much safer.\" ด้านขวามีลูกศรชี้ลง เขียนว่า สำคัญมาก → สำคัญน้อย"
    caption: "โครงสร้างข่าวแบบพีระมิดกลับหัว"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.writing.experiences-news.p009, prompt: "บอกประสบการณ์แล้วระบุปี ต้องเปลี่ยน tense ไหม" }
  - type: figure
    src: nan-news.svg
    alt: "ข่าวสมมุติจาก NAN DAILY NEWS วันที่ 12 October 2026 หัวข่าว New Bike Path Opens Along Nan River ย่อหน้า 1: A 6-kilometre bike path has opened along the Nan River in the city centre. The mayor opened the path on Saturday morning, and more than 300 people cycled on it on the first day. ย่อหน้า 2: The path took eight months to build and cost 18 million baht. It has lights, benches and two rest stops. ย่อหน้า 3: \"I used to ride on the busy road, so I was scared of the cars. Now I feel much safer,\" said Mali, a 15-year-old student. ย่อหน้า 4: However, some shop owners on River Road are unhappy because the path has taken away 40 parking spaces."
    caption: "ข่าวท้องถิ่น (ข่าวสมมุติ) ใช้ในตัวอย่างและโจทย์"
  - type: worked-example
    title: สรุปข่าวและแสดงความคิดเห็น
    problem: "อ่านข่าวทางจักรยานริมแม่น้ำน่าน แล้วเขียนย่อหน้าสั้นที่ (1) สรุปข่าว (2) บอกความรู้สึกและความเห็นพร้อมเหตุผล (3) มองอีกด้านหนึ่ง"
    steps:
      - text: "สรุปข่าวด้วย present perfect ตามด้วยรายละเอียดสำคัญ: *A 6-kilometre bike path has opened along the Nan River. It cost 18 million baht.*"
      - text: "บอกความรู้สึกและเหตุผล: *I'm pleased about this news because students like Mali can now cycle safely.*"
        why: "อ้างข้อมูลจากข่าว (คำพูดของ Mali) ทำให้เหตุผลน่าเชื่อ"
      - text: "มองอีกด้าน: *However, I understand why the shop owners are unhappy, because they have lost 40 parking spaces.*"
      - text: "จบด้วยความเห็นหรือข้อเสนอ: *In my opinion, the town should build a small car park near River Road.*"
    answer: "*A 6-kilometre bike path has opened along the Nan River. It cost 18 million baht. I'm pleased about this news because students like Mali can now cycle safely. However, I understand why the shop owners are unhappy, because they have lost 40 parking spaces. In my opinion, the town should build a small car park near River Road.*"
  - { type: check, problem: english.writing.experiences-news.p008, prompt: "ย่อหน้าเล่าประสบการณ์เริ่มและจบด้วยอะไร" }
glossary:
  - { term: recount, definition: "เรื่องเล่าประสบการณ์ เรียงเป็น orientation → events → personal response" }
  - { term: orientation, definition: "ส่วนเปิดเรื่อง บอกใคร ที่ไหน เมื่อไร" }
  - { term: headline, definition: "หัวข่าว สั้น มักใช้ present simple และตัด a/the" }
  - { term: lead, definition: "ประโยคแรกของข่าว ตอบ Who, What, Where, When" }
  - { term: inverted pyramid, definition: "พีระมิดกลับหัว เรียงข้อมูลข่าวจากสำคัญมากไปน้อย" }
  - { term: quote, definition: "คำพูดที่ยกมาจากคนในข่าว ใส่ในเครื่องหมายคำพูด" }
flashcards:
  - { front: "กิจวัตร / เหตุการณ์ครั้งหนึ่ง / ประสบการณ์ ใช้ tense อะไร", back: "present simple / past simple / present perfect" }
  - { front: "โครงสร้าง recount", back: "Orientation → Events → Personal response" }
  - { front: "lead ของข่าวตอบอะไร", back: "Who? What? Where? When?" }
  - { front: "I have gone there in 2022. ผิดตรงไหน", back: "มีปีระบุชัด ใช้ past simple: I went there in 2022." }
  - { front: "บอกความรู้สึกต่อข่าว", back: "I was delighted / shocked / disappointed to hear that ... because ..." }
