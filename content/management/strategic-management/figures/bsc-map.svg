<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" font-family="sans-serif" font-size="13">
<title>แผนที่กลยุทธ์สี่มุมมองของ balanced scorecard ของวิสาหกิจกาแฟ (สมมติ) เชื่อมเหตุและผลจากล่างขึ้นบน</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="900" height="490" fill="#ffffff"/>
<text x="450.0" y="26.0" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">แผนที่กลยุทธ์ (strategy map) สี่มุมมอง</text>
<rect x="20.0" y="70.0" width="860.0" height="80.0" rx="6" fill="#fafafa" stroke="#1f5fa8" stroke-width="1.2"/>
<text x="30.0" y="115.0" text-anchor="start" font-size="14" fill="#1f5fa8" font-weight="bold">การเงิน</text>
<rect x="340.0" y="88.0" width="220.0" height="44.0" rx="22" fill="#ffffff" stroke="#1f5fa8" stroke-width="2"/>
<text x="450.0" y="115.0" text-anchor="middle" font-size="14" fill="#222">รายได้โตปีละ 10%</text>
<rect x="20.0" y="170.0" width="860.0" height="80.0" rx="6" fill="#fafafa" stroke="#2e7d32" stroke-width="1.2"/>
<text x="30.0" y="215.0" text-anchor="start" font-size="14" fill="#2e7d32" font-weight="bold">ลูกค้า</text>
<rect x="190.0" y="188.0" width="220.0" height="44.0" rx="22" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
<text x="300.0" y="215.0" text-anchor="middle" font-size="14" fill="#222">ลูกค้าซื้อซ้ำเพิ่มขึ้น</text>
<rect x="490.0" y="188.0" width="220.0" height="44.0" rx="22" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
<text x="600.0" y="215.0" text-anchor="middle" font-size="14" fill="#222">ลูกค้าใหม่จากทัวร์ไร่</text>
<rect x="20.0" y="270.0" width="860.0" height="80.0" rx="6" fill="#fafafa" stroke="#b26a00" stroke-width="1.2"/>
<text x="30.0" y="315.0" text-anchor="start" font-size="14" fill="#b26a00" font-weight="bold">กระบวนการภายใน</text>
<rect x="190.0" y="288.0" width="220.0" height="44.0" rx="22" fill="#ffffff" stroke="#b26a00" stroke-width="2"/>
<text x="300.0" y="315.0" text-anchor="middle" font-size="14" fill="#222">รสชาติการคั่วสม่ำเสมอ</text>
<rect x="490.0" y="288.0" width="220.0" height="44.0" rx="22" fill="#ffffff" stroke="#b26a00" stroke-width="2"/>
<text x="600.0" y="315.0" text-anchor="middle" font-size="14" fill="#222">จัดทัวร์ไร่ทุกสุดสัปดาห์</text>
<rect x="20.0" y="370.0" width="860.0" height="80.0" rx="6" fill="#fafafa" stroke="#7b1fa2" stroke-width="1.2"/>
<text x="30.0" y="415.0" text-anchor="start" font-size="14" fill="#7b1fa2" font-weight="bold">การเรียนรู้และพัฒนา</text>
<rect x="190.0" y="388.0" width="220.0" height="44.0" rx="22" fill="#ffffff" stroke="#7b1fa2" stroke-width="2"/>
<text x="300.0" y="415.0" text-anchor="middle" font-size="14" fill="#222">ทักษะคั่วและชิมของทีม</text>
<rect x="490.0" y="388.0" width="220.0" height="44.0" rx="22" fill="#ffffff" stroke="#7b1fa2" stroke-width="2"/>
<text x="600.0" y="415.0" text-anchor="middle" font-size="14" fill="#222">ระบบข้อมูลการขาย</text>
<line x1="300.0" y1="388.0" x2="300.0" y2="332.0" stroke="#444" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="600.0" y1="388.0" x2="600.0" y2="332.0" stroke="#444" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="600.0" y1="388.0" x2="300.0" y2="332.0" stroke="#444" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="300.0" y1="288.0" x2="300.0" y2="232.0" stroke="#444" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="600.0" y1="288.0" x2="600.0" y2="232.0" stroke="#444" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="300.0" y1="188.0" x2="450.0" y2="132.0" stroke="#444" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="600.0" y1="188.0" x2="450.0" y2="132.0" stroke="#444" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="450.0" y="478.0" text-anchor="middle" font-size="13" fill="#444">ลูกศรอ่านว่า &quot;ถ้าทำสิ่งนี้ได้ จะช่วยให้สิ่งข้างบนสำเร็จ&quot; ตัวชี้วัดชั้นล่างจึงเป็นตัวชี้วัดนำ</text>
</svg>
