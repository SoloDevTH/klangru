problems:
- id: thai.reading.fact-opinion.p001
  topics:
  - thai.reading.fact-opinion
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็น **ข้อเท็จจริง**
  choices:
  - id: a
    text: จังหวัดเชียงใหม่อยู่ในภาคเหนือของประเทศไทย
    correct: true
    feedback: ถูก ตรวจสอบได้จากแผนที่
  - id: b
    text: เชียงใหม่เป็นจังหวัดที่น่าเที่ยวที่สุด
    feedback: น่าเที่ยวที่สุด เป็นการประเมิน
  - id: c
    text: ทุกคนควรไปเที่ยวเชียงใหม่สักครั้ง
    feedback: มีคำว่า ควร เป็นข้อเสนอแนะ
  - id: d
    text: อากาศเชียงใหม่ตอนหน้าหนาวน่าจะสบายที่สุด
    feedback: มีคำว่า น่าจะ และสบายที่สุด
  hints:
  - ข้อเท็จจริงตรวจสอบได้
  - ข้อใดไม่มีคำประเมินหรือคำว่า ควร น่าจะ
  solution: '**เชียงใหม่อยู่ภาคเหนือ** ตรวจได้จากแผนที่ จึงเป็นข้อเท็จจริง'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.fact-opinion.p002
  topics:
  - thai.reading.fact-opinion
  difficulty: 1
  type: match
  stem: จับคู่ข้อความกับชนิด
  pairs:
  - left: ห้องเรียนนี้มีโต๊ะ 40 ตัว
    right: ข้อเท็จจริง
  - left: ห้องเรียนนี้สวยที่สุดในโรงเรียน
    right: ข้อคิดเห็น (การประเมิน)
  - left: นักเรียนควรช่วยกันรักษาความสะอาด
    right: ข้อคิดเห็น (ข้อเสนอแนะ)
  - left: พรุ่งนี้ห้องเรียนคงจะร้อนมาก
    right: ข้อคิดเห็น (การคาดการณ์)
  hints:
  - ข้อเท็จจริงนับหรือวัดได้
  - ควร = ข้อเสนอแนะ · คงจะ = คาดการณ์
  solution: โต๊ะ 40 ตัว = ข้อเท็จจริง · สวยที่สุด = ประเมิน · ควร = ข้อเสนอแนะ · คงจะ = คาดการณ์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.fact-opinion.p003
  topics:
  - thai.reading.fact-opinion
  difficulty: 2
  type: mcq
  stem: อ่านบทความในภาพ ประโยคใดเป็น **ข้อคิดเห็น**
  figure: &id001
    src: bike-article.svg
    alt: บทความสมมุติจากจดหมายข่าวโรงเรียน เรื่องปั่นจักรยานไปโรงเรียน 7 ประโยค (1) โรงเรียนบ้านทุ่งมีนักเรียนทั้งหมด 600 คน (2) การสำรวจของสภานักเรียนในเดือนตุลาคม พบว่านักเรียน 150 คนปั่นจักรยานมาโรงเรียน (3) ฉันคิดว่าการปั่นจักรยานเป็นวิธีมาโรงเรียนที่ดีที่สุด (4) จักรยานไม่ปล่อยควันเสีย จึงไม่เพิ่มมลพิษทางอากาศ (5) ถนนหน้าโรงเรียนยังไม่มีทางสำหรับจักรยาน (6) โรงเรียนควรทำทางจักรยานและที่จอดจักรยานที่มีหลังคา (7) ถ้ามีทางจักรยาน นักเรียนคงจะปั่นจักรยานมาโรงเรียนมากขึ้นแน่นอน
  choices:
  - id: a
    text: (3)
    correct: true
    feedback: ถูก มีคำว่า ฉันคิดว่า และ ดีที่สุด
  - id: b
    text: (1)
    feedback: จำนวนนักเรียนตรวจได้
  - id: c
    text: (2)
    feedback: ผลสำรวจตรวจได้
  - id: d
    text: (5)
    feedback: ตรวจได้ว่าถนนมีทางจักรยานหรือไม่
  hints:
  - หาคำว่า คิดว่า ควร คงจะ ดีที่สุด
  - ข้อใดเป็นการประเมินของผู้เขียน
  solution: ประโยค **(3)** "ฉันคิดว่า...ดีที่สุด" เป็นข้อคิดเห็น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.fact-opinion.p004
  topics:
  - thai.reading.fact-opinion
  difficulty: 2
  type: mcq
  stem: '"ถนนลื่นมาก **เพราะ** ฝนเพิ่งหยุดตก" ข้อใดคือ **เหตุ**'
  choices:
  - id: a
    text: ฝนเพิ่งหยุดตก
    correct: true
    feedback: ถูก อยู่หลังคำว่า เพราะ
  - id: b
    text: ถนนลื่นมาก
    feedback: เป็นผล
  - id: c
    text: คำว่า เพราะ
    feedback: เป็นคำเชื่อม
  - id: d
    text: ไม่มีเหตุ
    feedback: มีเหตุ คือฝนตก
  hints:
  - คำว่า เพราะ อยู่หน้าเหตุหรือผล
  - อะไรทำให้ถนนลื่น
  solution: '**ฝนเพิ่งหยุดตก** เป็นเหตุ ถนนลื่นเป็นผล'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.fact-opinion.p005
  topics:
  - thai.reading.fact-opinion
  difficulty: 2
  type: numeric
  stem: อ่านบทความในภาพ นักเรียนที่ปั่นจักรยานมาโรงเรียนคิดเป็น **ร้อยละ** เท่าไรของนักเรียนทั้งหมด
  figure: *id001
  answer:
    value: 25
    unit: '%'
  misconceptions:
  - match: 150
    feedback: ตอบจำนวนคน ต้องเทียบเป็นร้อยละ
  - match: 4
    feedback: หาร 600 ด้วย 150 กลับด้าน
  hints:
  - ใช้ข้อมูลจากประโยค (1) และ (2)
  - ร้อยละ = ส่วน ÷ ทั้งหมด × 100
  solution: $150 \div 600 \times 100 = 25$ ร้อยละ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.fact-opinion.p006
  topics:
  - thai.reading.fact-opinion
  difficulty: 3
  type: mcq
  stem: '"ผลสำรวจพบว่านักเรียนร้อยละ 60 **คิดว่า** โรงเรียนควรมีสนามเพิ่ม" ข้อความนี้เป็นอะไร'
  choices:
  - id: a
    text: ข้อเท็จจริง เพราะตรวจได้ว่าผลสำรวจออกมาอย่างนั้นจริง
    correct: true
    feedback: ถูก เป็นการรายงานผลสำรวจ แม้เนื้อหาที่สำรวจเป็นความเห็น
  - id: b
    text: ข้อคิดเห็น เพราะมีคำว่า คิดว่า
    feedback: คิดว่า เป็นความเห็นของนักเรียนที่ถูกสำรวจ แต่ประโยครายงานผลซึ่งตรวจได้
  - id: c
    text: ข้อคิดเห็น เพราะมีคำว่า ควร
    feedback: ควร อยู่ในเนื้อหาที่สำรวจ ไม่ใช่ความเห็นของผู้เขียน
  - id: d
    text: บอกไม่ได้เลย
    feedback: ตรวจได้จากผลสำรวจ
  hints:
  - ใครเป็นเจ้าของความเห็นนี้
  - ตรวจได้ไหมว่าผลสำรวจบอกร้อยละ 60
  solution: ประโยค **รายงานผลสำรวจ** ซึ่งตรวจได้ จึงเป็น **ข้อเท็จจริง**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.fact-opinion.p007
  topics:
  - thai.reading.fact-opinion
  difficulty: 3
  type: mcq
  stem: ข้อใดเป็นข้อคิดเห็น ทั้งที่ **ไม่มี** คำว่า คิดว่า ควร หรือ น่าจะ
  choices:
  - id: a
    text: ทุเรียนเป็นผลไม้ที่อร่อยที่สุด
    correct: true
    feedback: ถูก อร่อยที่สุดเป็นการประเมิน คนอื่นเห็นต่างได้
  - id: b
    text: ทุเรียนมีเปลือกเป็นหนาม
    feedback: ตรวจได้
  - id: c
    text: ทุเรียนออกผลในฤดูร้อน
    feedback: เป็นข้อมูลที่ตรวจได้
  - id: d
    text: ทุเรียนกิโลกรัมละ 120 บาทที่ร้านนี้
    feedback: ตรวจได้ที่ร้าน
  hints:
  - หาคำประเมินค่า เช่น อร่อย สวย ดีที่สุด
  - คนอื่นเห็นต่างได้หรือไม่
  solution: '**อร่อยที่สุด** เป็นการประเมิน จึงเป็นข้อคิดเห็นแม้ไม่มีคำบ่งชี้'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.fact-opinion.p008
  topics:
  - thai.reading.fact-opinion
  difficulty: 3
  type: mcq
  stem: อ่านบทความในภาพ ประโยค (4) "จักรยานไม่ปล่อยควันเสีย **จึง**ไม่เพิ่มมลพิษทางอากาศ" ข้อใดคือ **ผล**
  figure: *id001
  choices:
  - id: a
    text: ไม่เพิ่มมลพิษทางอากาศ
    correct: true
    feedback: ถูก อยู่หลังคำว่า จึง
  - id: b
    text: จักรยานไม่ปล่อยควันเสีย
    feedback: เป็นเหตุ
  - id: c
    text: นักเรียนปั่นจักรยาน 150 คน
    feedback: อยู่ในประโยค (2) ไม่ใช่ผลในประโยค (4)
  - id: d
    text: โรงเรียนควรทำทางจักรยาน
    feedback: อยู่ในประโยค (6)
  hints:
  - คำว่า จึง อยู่หน้าเหตุหรือผล
  - อะไรเกิดขึ้นเพราะจักรยานไม่ปล่อยควัน
  solution: '**ไม่เพิ่มมลพิษทางอากาศ** เป็นผล ไม่ปล่อยควันเสียเป็นเหตุ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.fact-opinion.p009
  topics:
  - thai.reading.fact-opinion
  difficulty: 3
  type: order
  stem: เรียงเหตุการณ์เป็น **ลูกโซ่เหตุและผล**
  items:
  - ฝนตกหนักทั้งคืน
  - น้ำท่วมถนนหน้าโรงเรียน
  - รถติดยาว
  - นักเรียนหลายคนมาสาย
  hints:
  - เริ่มจากเหตุแรกสุด
  - ผลของข้อหนึ่งเป็นเหตุของข้อถัดไป
  solution: ฝนตกหนัก → น้ำท่วมถนน → รถติด → นักเรียนมาสาย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.fact-opinion.p010
  topics:
  - thai.reading.fact-opinion
  difficulty: 4
  type: mcq
  stem: อ่านบทความในภาพ ประโยค (7) "ถ้ามีทางจักรยาน นักเรียนคงจะปั่นจักรยานมาโรงเรียนมากขึ้น**แน่นอน**" ข้อใดวิเคราะห์ได้ถูกต้อง
  figure: *id001
  choices:
  - id: a
    text: เป็นข้อคิดเห็นแบบคาดการณ์ คำว่า แน่นอน ไม่ได้ทำให้เป็นข้อเท็จจริง
    correct: true
    feedback: ถูก ยังไม่เกิดขึ้นจึงตรวจไม่ได้ และมีคำว่า คงจะ
  - id: b
    text: เป็นข้อเท็จจริง เพราะมีคำว่า แน่นอน
    feedback: ความมั่นใจของผู้เขียนไม่ทำให้ตรวจได้
  - id: c
    text: เป็นข้อเท็จจริง เพราะอยู่ในจดหมายข่าว
    feedback: ที่ตีพิมพ์ไม่ได้ทำให้ทุกประโยคเป็นข้อเท็จจริง
  - id: d
    text: ไม่ใช่ทั้งข้อเท็จจริงและข้อคิดเห็น
    feedback: ทุกประโยคในบทความเป็นแบบใดแบบหนึ่ง หรือผสม
  hints:
  - เหตุการณ์ในอนาคตตรวจได้ตอนนี้หรือไม่
  - สังเกตคำว่า คงจะ
  solution: เป็น **การคาดการณ์** (ข้อคิดเห็น) คำว่า แน่นอน แสดงความมั่นใจ แต่ยังตรวจไม่ได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.fact-opinion.p011
  topics:
  - thai.reading.fact-opinion
  difficulty: 4
  type: mcq
  stem: อ่านบทความในภาพ ประโยคใดเป็น **ข้อมูลสนับสนุน** ข้อเสนอในประโยค (6) ได้ตรงที่สุด
  figure: *id001
  choices:
  - id: a
    text: (5)
    correct: true
    feedback: ถูก ถนนยังไม่มีทางจักรยาน เป็นข้อเท็จจริงที่ชี้ว่าทำไมต้องทำทางจักรยาน
  - id: b
    text: (3)
    feedback: เป็นความเห็นของผู้เขียน ไม่ใช่ข้อมูล
  - id: c
    text: (7)
    feedback: เป็นการคาดการณ์ ไม่ใช่ข้อมูลที่ตรวจได้
  - id: d
    text: (1)
    feedback: จำนวนนักเรียนทั้งหมดไม่ได้บอกความจำเป็นของทางจักรยาน
  hints:
  - ข้อมูลสนับสนุนที่ดีเป็นข้อเท็จจริงที่เกี่ยวข้อง
  - ข้อเสนอ (6) คือทำทางจักรยาน ข้อใดบอกปัญหาที่มีอยู่
  solution: ประโยค **(5)** เป็นข้อเท็จจริงที่เกี่ยวข้องโดยตรงกับข้อเสนอ
