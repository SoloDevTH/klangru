id: health.body.bmi-growth
subject: health
title: { th: การเจริญเติบโต ดัชนีมวลกาย และเกณฑ์สำหรับผู้ใหญ่ชาวเอเชีย, en: "Growth, body mass index and adult cut-offs for Asians" }
summary: ปัจจัยที่มีผลต่อการเจริญเติบโต คำนวณดัชนีมวลกาย (BMI) แปลผลด้วยเกณฑ์ผู้ใหญ่ชาวเอเชีย รู้ว่าเด็กต้องใช้กราฟตามอายุ และ BMI เป็นเพียงเครื่องมือคัดกรอง
difficulty: 3
minutes: 30
prerequisites: [math.number.decimals]
encompasses:
  - { id: math.number.decimals, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: คำนวณและแปลผล BMI ของผู้ใหญ่
    problem: "คุณป้าอายุ 45 ปี หนัก 54 กิโลกรัม สูง 158 เซนติเมตร ดัชนีมวลกายเท่าไร และอยู่ช่วงใดตามเกณฑ์ผู้ใหญ่ชาวเอเชีย"
    steps:
      - text: "ตรวจอายุก่อน: 45 ปี เป็นผู้ใหญ่ ใช้ตารางเกณฑ์ผู้ใหญ่ได้"
        why: "เด็กและวัยรุ่นต้องใช้กราฟ BMI ตามอายุและเพศ ไม่ใช่ตารางนี้"
      - text: "เปลี่ยนส่วนสูงเป็นเมตร: $158\\ \\mathrm{cm} = 1.58\\ \\mathrm{m}$"
      - text: "ยกกำลังสอง: $1.58^2 = 2.4964$"
        why: "สูตรหารด้วยส่วนสูงยกกำลังสอง หน่วยจึงเป็นกิโลกรัมต่อตารางเมตร"
      - text: "หาร: $\\text{BMI} = \\frac{54}{2.4964} \\approx 21.6\\ \\mathrm{kg/m^2}$"
      - text: "เทียบตาราง: 21.6 อยู่ในช่วง 18.5–22.9 คือน้ำหนักอยู่ในเกณฑ์ปกติ"
    answer: "$\\text{BMI} \\approx 21.6\\ \\mathrm{kg/m^2}$ อยู่ในเกณฑ์ปกติ"
  - { type: check, problem: hlt.bmi.p004, prompt: "ลองคำนวณเอง" }
  - type: figure
    title: แผนภูมิดัชนีมวลกายสำหรับผู้ใหญ่
    src: bmi-chart.svg
    alt: "แผนภูมิแกนนอนเป็นส่วนสูง 1.40 ถึง 1.90 เมตร แกนตั้งเป็นน้ำหนัก 30 ถึง 110 กิโลกรัม มีเส้นโค้งแบ่งพื้นที่เป็นห้าแถบตาม BMI 18.5, 23, 25 และ 30 จากล่างขึ้นบน: ต่ำกว่าเกณฑ์ (ต่ำกว่า 18.5) ปกติ (18.5–22.9) น้ำหนักเกินหรืออ้วนระดับ 1 (23.0–24.9) อ้วนระดับ 2 (25.0–29.9) และอ้วนระดับ 3 (30 ขึ้นไป) หัวแผนภูมิระบุว่าใช้กับผู้ใหญ่อายุ 18 ปีขึ้นไปเท่านั้น ตัวอย่าง ที่ส่วนสูง 1.60 เมตร เส้นแบ่งอยู่ที่น้ำหนักประมาณ 47, 59, 64 และ 77 กิโลกรัม"
    caption: "หาจุดตัดของส่วนสูงกับน้ำหนักแล้วดูว่าอยู่แถบใด ใช้กับผู้ใหญ่เท่านั้น เด็กและวัยรุ่นใช้กราฟ BMI ตามอายุและเพศ"
  - type: worked-example
    title: ช่วงน้ำหนักที่ BMI อยู่ในเกณฑ์ปกติ
    problem: "ผู้ใหญ่สูง 1.62 เมตร น้ำหนักควรอยู่ระหว่างเท่าใดถึงเท่าใด BMI จึงอยู่ในช่วงปกติ 18.5–22.9"
    steps:
      - text: "จัดสูตรใหม่ให้น้ำหนักอยู่ข้างเดียว: $\\text{น้ำหนัก} = \\text{BMI} \\times (\\text{ส่วนสูง})^2$"
        why: "เรารู้ BMI ที่ขอบของช่วงและรู้ส่วนสูง สิ่งที่ไม่รู้คือน้ำหนัก"
      - text: "ยกกำลังสองส่วนสูง: $1.62^2 = 2.6244$"
      - text: "ขอบล่าง: $18.5 \\times 2.6244 \\approx 48.6$ กิโลกรัม"
      - text: "ขอบบน: $22.9 \\times 2.6244 \\approx 60.1$ กิโลกรัม"
      - text: "ตีความ: ช่วงกว้างราว 11.5 กิโลกรัม คนสูงเท่ากันจึงมีน้ำหนักต่างกันได้มากและยังอยู่ในเกณฑ์ปกติ"
        why: "เกณฑ์เป็นช่วง ไม่ได้มีน้ำหนักที่ถูกต้องเพียงค่าเดียว และ BMI ไม่ได้ดูสัดส่วนกล้ามเนื้อกับไขมัน"
    answer: "ประมาณ 48.6 ถึง 60.1 กิโลกรัม"
  - { type: check, problem: hlt.bmi.p007, prompt: "ระวังเรื่องเกณฑ์ที่ใช้" }
glossary:
  - { term: ดัชนีมวลกาย (BMI), definition: "น้ำหนักเป็นกิโลกรัมหารด้วยส่วนสูงเป็นเมตรยกกำลังสอง หน่วย kg/m² ใช้คัดกรองภาวะน้ำหนักของผู้ใหญ่" }
  - { term: เกณฑ์ผู้ใหญ่ชาวเอเชีย, definition: "ช่วง BMI สำหรับผู้ใหญ่อายุ 18 ปีขึ้นไป: ต่ำกว่า 18.5 ต่ำกว่าเกณฑ์, 18.5–22.9 ปกติ, 23.0–24.9 น้ำหนักเกิน, 25.0–29.9 อ้วนระดับ 2, 30 ขึ้นไป อ้วนระดับ 3" }
  - { term: กราฟ BMI ตามอายุ (BMI-for-age), definition: "กราฟอ้างอิงที่แยกตามอายุและเพศ ใช้แปลผล BMI ของเด็กและวัยรุ่นอายุ 5–19 ปีแทนเกณฑ์ผู้ใหญ่" }
  - { term: เครื่องมือคัดกรอง, definition: "การวัดอย่างง่ายเพื่อดูว่าใครควรได้รับการตรวจหรือคำแนะนำเพิ่ม ไม่ใช่การวินิจฉัยโรค" }
flashcards:
  - { front: "สูตร BMI", back: "$\\text{BMI} = \\dfrac{\\text{น้ำหนัก (kg)}}{\\text{ส่วนสูง (m)}^2}$ หน่วย kg/m²" }
  - { front: "BMI ช่วงปกติของผู้ใหญ่ชาวเอเชีย", back: "18.5–22.9 kg/m² (23.0 ขึ้นไปถือว่าน้ำหนักเกิน)" }
  - { front: "เด็กอายุ 10 ปีใช้ตารางเกณฑ์ BMI ของผู้ใหญ่ได้หรือไม่", back: "ไม่ได้ ต้องเทียบกับกราฟ BMI ตามอายุและเพศ (อายุ 5–19 ปี) และให้บุคลากรสุขภาพช่วยแปลผล" }
  - { front: "รอบเอวที่แนะนำสำหรับผู้ใหญ่", back: "ไม่เกินส่วนสูง (ซม.) หารด้วย 2 วัดผ่านระดับสะดือ" }
  - { front: "ทำไม BMI จึงเป็นแค่เครื่องมือคัดกรอง", back: "BMI ไม่แยกกล้ามเนื้อ กระดูก และไขมัน นักกีฬาอาจมี BMI สูงทั้งที่ไขมันน้อย ต้องใช้ข้อมูลอื่นประกอบ" }
