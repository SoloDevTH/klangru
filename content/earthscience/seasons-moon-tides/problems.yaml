  - id: earthscience.astronomy.seasons-moon-tides.p014
    topics: [earthscience.astronomy.seasons-moon-tides]
    difficulty: 4
    type: numeric
    stem: "ดวงจันทร์ครบรอบข้างขึ้นข้างแรมทุก 29.5 วัน คำนวณว่าดวงจันทร์ขึ้นช้าลงวันละกี่นาที (หนึ่งวันมี 1,440 นาที)"
    answer: { value: 48.8, tolerance: 0.3, unit: นาที }
    misconceptions:
      - { match: 0.0205, feedback: "นำ 29.5 หารด้วย 1,440 ต้องนำ 1,440 หารด้วย 29.5" }
      - { match: 12.2, feedback: "12.2 คือมุมเป็นองศาที่ดวงจันทร์เคลื่อนต่อวัน ($360 \\div 29.5$) ต้องแปลงเป็นเวลา" }
    hints:
      - "ใน 29.5 วัน ดวงจันทร์ขึ้นช้าลงสะสมครบ 1 วันเต็ม"
      - "$1{,}440 \\div 29.5$"
    solution: "ใน 29.5 วัน เวลาขึ้นของดวงจันทร์เลื่อนไปครบ 1 วัน (1,440 นาที) ต่อวันจึงช้าลง $1{,}440 \\div 29.5 \\approx 48.8$ นาที ใกล้กับค่าประมาณ 50 นาทีที่ใช้กันทั่วไป"
