    ai_assisted: true

  - id: biology.ecology.environmental-issues.p017
    topics: [biology.ecology.environmental-issues]
    difficulty: 5
    type: mcq
    stem: "นักเรียนสร้างแบบจำลองคอมพิวเตอร์ของประชากรกวางในป่าสองผืนที่ถนนตัดขาดจากกัน แบบจำลองแสดงว่าแต่ละผืนมีกวางน้อยจนเสี่ยงสูญพันธุ์ในท้องถิ่น นักเรียนต้องการทดสอบว่าการสร้างทางเชื่อมผืนป่าช่วยได้หรือไม่ ควรปรับแบบจำลองอย่างไร"
    choices:
      - { id: a, text: "เพิ่มค่าการย้ายถิ่นระหว่างสองผืนตามขนาดของทางเชื่อม รันแบบจำลองหลายรอบทั้งแบบมีและไม่มีทางเชื่อม แล้วเทียบโอกาสที่ประชากรจะหายไปในเวลาเดียวกัน", correct: true }
      - { id: b, text: "เพิ่มความสามารถในการรองรับของป่าเป็นสองเท่าโดยไม่เปลี่ยนอย่างอื่น", feedback: "ทางเชื่อมไม่ได้เพิ่มอาหารในป่าโดยตรง สิ่งที่เปลี่ยนคือการย้ายถิ่นระหว่างผืน" }
      - { id: c, text: "รันแบบจำลองครั้งเดียวที่มีทางเชื่อม ถ้ากวางรอดก็สรุปว่าได้ผล", feedback: "ต้องมีกรณีเปรียบเทียบที่ไม่มีทางเชื่อม และรันหลายรอบเพราะผลมีความสุ่ม" }
      - { id: d, text: "ลบถนนออกจากแบบจำลอง", feedback: "ไม่ได้ทดสอบทางแก้ที่เสนอ และไม่ตรงกับสถานการณ์จริงที่ถนนยังอยู่" }
    hints:
      - "ทางเชื่อมเปลี่ยนตัวแปรใดในแบบจำลอง"
      - "การทดสอบที่ดีต้องมีกรณีเปรียบเทียบและทำซ้ำ"
    solution: "ทางเชื่อมทำให้กวางย้ายไปมาระหว่างผืนได้ จึงควรใส่เป็นอัตราการย้ายถิ่น แล้วรันหลายรอบเทียบกับกรณีไม่มีทางเชื่อม ถ้าโอกาสสูญพันธุ์ในท้องถิ่นลดลงชัดเจน แสดงว่าทางเชื่อมเป็นทางแก้ที่น่าลงทุน ซึ่งควรตรวจกับข้อมูลภาคสนามต่อไป"
    license: CC-BY-SA-4.0
    ai_assisted: true
