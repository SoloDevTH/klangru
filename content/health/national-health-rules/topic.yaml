id: health.hygiene.national-health-rules
subject: health
title: { th: สุขบัญญัติแห่งชาติและลักษณะของการมีสุขภาพดี, en: "Thailand's ten national health rules and what good health looks like" }
summary: สุขบัญญัติแห่งชาติ 10 ประการ ลักษณะของคนที่มีสุขภาพดีทั้งกาย ใจ และสังคม เหตุผลที่ต้องทำจนเป็นนิสัย และการใช้ตารางบันทึกพฤติกรรม
difficulty: 1
minutes: 25
prerequisites: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: สุขบัญญัติแห่งชาติ 10 ประการ
    src: ten-rules.svg
    alt: "แผ่นภาพสิบช่อง เรียงเลข 1 ถึง 10: 1 ดูแลรักษาร่างกายและของใช้ให้สะอาด 2 รักษาฟันให้แข็งแรงและแปรงฟันทุกวันอย่างถูกต้อง 3 ล้างมือให้สะอาดก่อนกินอาหารและหลังขับถ่าย 4 กินอาหารสุก สะอาด ปราศจากสารอันตราย หลีกเลี่ยงอาหารรสจัด สีฉูดฉาด 5 งดบุหรี่ สุรา สารเสพติด การพนัน และการสำส่อนทางเพศ 6 สร้างความสัมพันธ์ในครอบครัวให้อบอุ่น 7 ป้องกันอุบัติภัยด้วยความไม่ประมาท 8 ออกกำลังกายสม่ำเสมอและตรวจสุขภาพประจำปี 9 ทำจิตใจให้ร่าเริงแจ่มใสอยู่เสมอ 10 มีสำนึกต่อส่วนรวม ร่วมสร้างสรรค์สังคม"
    caption: "ข้อความตามคู่มือโรงเรียนส่งเสริมสุขบัญญัติแห่งชาติ ของกองสุขศึกษา กรมสนับสนุนบริการสุขภาพ (แผนภาพวาดใหม่โดยทีมคลังรู้)"
  - type: worked-example
    title: พฤติกรรมนี้ตรงกับสุขบัญญัติข้อใด
    problem: "เช้าวันเสาร์ ปลาทำสามอย่าง: (1) อาบน้ำแล้วซักถุงเท้าของตัวเอง (2) ซ้อนจักรยานยนต์ไปตลาดโดยสวมหมวกนิรภัย (3) ช่วยเพื่อนบ้านเก็บขยะในซอย แต่ละอย่างตรงกับสุขบัญญัติข้อใด และช่วยสุขภาพด้านใด"
    steps:
      - text: "อาบน้ำและซักถุงเท้า คือการดูแลร่างกายและของใช้ให้สะอาด ตรงกับข้อ 1 ช่วยสุขภาพกาย"
      - text: "สวมหมวกนิรภัย คือการป้องกันอุบัติภัย ตรงกับข้อ 7 ช่วยความปลอดภัยของร่างกาย"
        why: "หมวกนิรภัยลดการบาดเจ็บที่ศีรษะเมื่อเกิดอุบัติเหตุ"
      - text: "เก็บขยะในซอย คือการทำเพื่อส่วนรวม ตรงกับข้อ 10 ช่วยสุขภาพสังคม"
        why: "ซอยที่สะอาดลดแหล่งเพาะพันธุ์ยุงและหนู ทำให้ทุกคนในชุมชนปลอดภัยขึ้น"
    answer: "(1) ข้อ 1 สุขภาพกาย (2) ข้อ 7 ความปลอดภัย (3) ข้อ 10 สุขภาพสังคม"
  - { type: check, problem: health.hygiene.national-health-rules.p002, prompt: "ทบทวนสุขบัญญัติข้อ 3" }
  - type: worked-example
    title: อ่านตารางบันทึกแล้วคิดเป็นร้อยละ
    problem: "จากตารางบันทึกพฤติกรรมของน้ำใส น้ำใสแปรงฟันก่อนนอนคิดเป็นร้อยละเท่าใดของ 7 วัน"
    figure:
      src: habit-tracker.svg
      alt: "ตารางบันทึก 7 วัน (จันทร์ถึงอาทิตย์) ของน้ำใส 4 พฤติกรรม เครื่องหมายถูกคือทำ กากบาทคือไม่ได้ทำ แปรงฟันก่อนนอน: ทำ ทำ ทำ ทำ ไม่ได้ทำ ทำ ทำ ล้างมือก่อนกินข้าวกลางวัน: ทำ ไม่ได้ทำ ทำ ไม่ได้ทำ ทำ ทำ ทำ ออกกำลังกายอย่างน้อย 60 นาที: ทำ ไม่ได้ทำ ทำ ไม่ได้ทำ ทำ ไม่ได้ทำ ทำ สวมหมวกนิรภัยเมื่อซ้อนจักรยานยนต์: ทำทุกวัน"
    steps:
      - text: "ดูแถวแปรงฟันก่อนนอน นับเครื่องหมายถูกได้ 6 ช่อง (ขาดวันศุกร์)"
      - text: "จำนวนวันทั้งหมดคือ 7 วัน"
      - text: "ร้อยละ $= \\frac{6}{7} \\times 100 \\approx 85.71\\%$"
        why: "ร้อยละคือส่วนที่ทำได้เทียบกับทั้งหมด แล้วคูณ 100 ให้เป็นส่วนของร้อย"
      - text: "แปลผล: ทำได้เกือบทุกวัน ควรหาสาเหตุว่าทำไมวันศุกร์ลืม เช่น นอนค้างบ้านญาติ แล้วเตรียมแปรงสีฟันไปด้วย"
    answer: "ประมาณ $85.71\\%$"
  - { type: check, problem: health.hygiene.national-health-rules.p008, prompt: "ใช้วิธีเดียวกันกับแถวล้างมือ" }
glossary:
  - { term: สุขบัญญัติแห่งชาติ, definition: "ข้อกำหนด 10 ประการที่เด็ก เยาวชน และประชาชนทั่วไปควรปฏิบัติเป็นประจำจนเป็นนิสัย เพื่อให้มีสุขภาพดีทั้งกาย ใจ และสังคม" }
  - { term: สุขภาพ, definition: "ความสมบูรณ์ทั้งทางกาย ทางใจ และทางสังคม ไม่ได้หมายถึงแค่การไม่เป็นโรค" }
  - { term: สุขนิสัย, definition: "พฤติกรรมสุขภาพที่ทำซ้ำจนเป็นปกติ โดยไม่ต้องมีคนเตือน" }
  - { term: ตารางบันทึกพฤติกรรม, definition: "ตารางที่ใช้ติ๊กว่าแต่ละวันทำพฤติกรรมใดแล้วบ้าง ช่วยให้เห็นว่าข้อใดยังทำไม่สม่ำเสมอ" }
flashcards:
  - { front: "สุขบัญญัติแห่งชาติมีกี่ข้อ ข้อแรกคืออะไร", back: "10 ข้อ ข้อแรกคือ ดูแลรักษาร่างกายและของใช้ให้สะอาด" }
  - { front: "สุขบัญญัติข้อ 3 และข้อ 4 คืออะไร", back: "ข้อ 3 ล้างมือให้สะอาดก่อนกินอาหารและหลังขับถ่าย ข้อ 4 กินอาหารสุก สะอาด ปราศจากสารอันตราย หลีกเลี่ยงอาหารรสจัด สีฉูดฉาด" }
  - { front: "สุขบัญญัติข้อ 8 และข้อ 9 คืออะไร", back: "ข้อ 8 ออกกำลังกายสม่ำเสมอและตรวจสุขภาพประจำปี ข้อ 9 ทำจิตใจให้ร่าเริงแจ่มใสอยู่เสมอ" }
  - { front: "ลักษณะของคนที่มีสุขภาพดีมีอะไรบ้าง", back: "ร่างกายแข็งแรง จิตใจร่าเริงแจ่มใส มีความสุข อยู่ร่วมกับผู้อื่นได้ดี และปลอดภัย" }
