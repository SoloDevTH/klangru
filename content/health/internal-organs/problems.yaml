problems:
  - id: health.body.internal-organs.p001
    topics: [health.body.internal-organs]
    difficulty: 1
    type: mcq
    stem: "อวัยวะใดอยู่ในกะโหลกศีรษะ และควบคุมการคิดและการเคลื่อนไหว"
    choices:
      - { id: a, text: "สมอง", correct: true }
      - { id: b, text: "หัวใจ", feedback: "หัวใจอยู่ในทรวงอก ทำหน้าที่สูบฉีดเลือด" }
      - { id: c, text: "ตับ", feedback: "ตับอยู่ในช่องท้องด้านขวาบน ทำหน้าที่เก็บสารอาหารและกำจัดสารพิษ" }
    hints:
      - "อวัยวะนี้อยู่ในศีรษะ"
      - "ใช้คิด จำ และสั่งให้ร่างกายเคลื่อนไหว"
    solution: "สมอง อยู่ในกะโหลกศีรษะ ควบคุมการคิด การจำ และการเคลื่อนไหว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.internal-organs.p002
    topics: [health.body.internal-organs]
    difficulty: 1
    type: mcq
    stem: "เมื่อหายใจเข้า อากาศเข้าไปที่อวัยวะใด"
    choices:
      - { id: a, text: "ปอด", correct: true }
      - { id: b, text: "กระเพาะอาหาร", feedback: "กระเพาะอาหารรับอาหาร ไม่ได้รับอากาศสำหรับหายใจ" }
      - { id: c, text: "หัวใจ", feedback: "หัวใจสูบฉีดเลือด อากาศเข้าไปที่ปอด" }
      - { id: d, text: "ไต", feedback: "ไตกรองของเสียจากเลือด ไม่เกี่ยวกับการหายใจโดยตรง" }
    hints:
      - "อวัยวะนี้มี 2 ข้าง อยู่ในทรวงอก"
      - "หายใจเข้าแล้วหน้าอกพองขึ้น"
    solution: "ปอด รับอากาศเข้าไปเพื่อนำออกซิเจนเข้าสู่เลือด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.internal-organs.p003
    topics: [health.body.internal-organs]
    difficulty: 1
    type: text
    stem: "อวัยวะภายในใดทำหน้าที่สูบฉีดเลือดไปทั่วร่างกาย (ตอบชื่ออวัยวะ)"
    accepted: ["หัวใจ", "heart"]
    misconceptions:
      - { match: "ปอด", feedback: "ปอดใช้หายใจ อวัยวะที่สูบฉีดเลือดคือหัวใจ" }
      - { match: "ตับ", feedback: "ตับไม่ได้สูบฉีดเลือด อวัยวะนั้นคือหัวใจ" }
    hints:
      - "วางมือที่หน้าอกจะรู้สึกว่าอวัยวะนี้เต้น"
      - "ขนาดประมาณกำปั้นของเรา"
    solution: "หัวใจ เป็นกล้ามเนื้อที่บีบตัวสูบฉีดเลือดไปทั่วร่างกาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.internal-organs.p004
    topics: [health.body.internal-organs]
    difficulty: 2
    type: match
    stem: "ดูภาพร่างกายที่หันหน้าเข้าหาเรา แล้วจับคู่ตัวอักษรกับชื่ออวัยวะ"
    figure:
      src: organs-quiz.svg
      alt: "ภาพร่างกายคนหันหน้าเข้าหาผู้ดู A อวัยวะในศีรษะ B อวัยวะคล้ายฟองน้ำในทรวงอกมีสองข้าง (ชี้ข้างทางซ้ายมือผู้ดู) C อวัยวะสีแดงรูปหัวใจระหว่างปอดสองข้าง D อวัยวะสีน้ำตาลแดงขนาดใหญ่ใต้ปอดทางซ้ายมือผู้ดู E ถุงสีส้มใต้หัวใจทางขวามือผู้ดู F อวัยวะรูปเมล็ดถั่ววาดเส้นประใกล้แนวเอว G ท่อเล็กขดไปมากลางท้อง H ท่อใหญ่เป็นกรอบล้อมรอบท่อที่ขดอยู่"
    pairs:
      - { left: "A", right: "สมอง" }
      - { left: "B", right: "ปอด" }
      - { left: "C", right: "หัวใจ" }
      - { left: "D", right: "ตับ" }
      - { left: "E", right: "กระเพาะอาหาร" }
      - { left: "F", right: "ไต" }
      - { left: "G", right: "ลำไส้เล็ก" }
      - { left: "H", right: "ลำไส้ใหญ่" }
    hints:
      - "เริ่มจากอวัยวะที่มั่นใจ เช่น ในศีรษะ และรูปหัวใจ"
      - "ลำไส้ใหญ่เป็นกรอบล้อมลำไส้เล็ก ไตอยู่ด้านหลังจึงวาดเส้นประ"
    solution: "A สมอง B ปอด C หัวใจ D ตับ E กระเพาะอาหาร F ไต G ลำไส้เล็ก H ลำไส้ใหญ่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.internal-organs.p005
    topics: [health.body.internal-organs]
    difficulty: 2
    type: match
    stem: "จับคู่อวัยวะกับวิธีดูแลที่ตรงที่สุด"
    pairs:
      - { left: "สมอง", right: "สวมหมวกนิรภัยเมื่อขี่จักรยาน" }
      - { left: "ปอด", right: "อยู่ห่างควันบุหรี่และฝุ่นควัน" }
      - { left: "ไต", right: "ดื่มน้ำให้พอ ไม่กลั้นปัสสาวะนาน" }
      - { left: "กระเพาะอาหาร", right: "กินอาหารตรงเวลา เคี้ยวให้ละเอียด" }
      - { left: "ตับ", right: "ไม่ดื่มเครื่องดื่มแอลกอฮอล์ ไม่กินยาเอง" }
    hints:
      - "นึกถึงหน้าที่ของแต่ละอวัยวะ"
      - "อวัยวะที่กรองของเสียออกเป็นปัสสาวะต้องการน้ำ"
    solution: "สมอง-หมวกนิรภัย, ปอด-ห่างควัน, ไต-ดื่มน้ำไม่กลั้นปัสสาวะ, กระเพาะ-กินตรงเวลาเคี้ยวละเอียด, ตับ-ไม่ดื่มแอลกอฮอล์ไม่กินยาเอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.internal-organs.p006
    topics: [health.body.internal-organs]
    difficulty: 2
    type: mcq
    stem: "ไตอยู่ที่ส่วนใดของร่างกาย"
    choices:
      - { id: a, text: "ด้านหลังของช่องท้อง ใกล้แนวเอว ข้างละ 1 อัน", correct: true }
      - { id: b, text: "กลางหน้าท้อง ใต้สะดือ", feedback: "กลางท้องเป็นที่อยู่ของลำไส้เล็ก ไตอยู่ด้านหลังใกล้แนวเอว" }
      - { id: c, text: "ในทรวงอก ข้างหัวใจ", feedback: "ข้างหัวใจคือปอด ไตอยู่ในช่องท้องด้านหลัง" }
    hints:
      - "เวลาปวดหลังบริเวณเอว บางครั้งอาจเกี่ยวกับอวัยวะนี้"
      - "ไตมี 2 ข้าง"
    solution: "ไตอยู่ด้านหลังของช่องท้อง ใกล้แนวเอว ซ้ายและขวาข้างละ 1 อัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.internal-organs.p007
    topics: [health.body.internal-organs]
    difficulty: 2
    type: numeric
    stem: "แก้มนับชีพจรที่ข้อมือได้ 22 ครั้งใน 15 วินาที ชีพจรของแก้มเป็นกี่ครั้งต่อนาที (ตอบเป็นครั้งต่อนาที)"
    answer: { value: 88, unit: ครั้ง/นาที }
    misconceptions:
      - { match: 22, feedback: "22 คือจำนวนใน 15 วินาที ต้องเปลี่ยนเป็นต่อ 1 นาที" }
      - { match: 44, feedback: "คูณ 2 ได้ค่าใน 30 วินาที 1 นาทีมี 4 ช่วง 15 วินาที ต้องคูณ 4" }
    hints:
      - "1 นาที = 60 วินาที มีกี่ช่วง 15 วินาที"
      - "นำจำนวนครั้งคูณ 4"
    solution: "60 ÷ 15 = 4 ช่วง, 22 × 4 = 88 ครั้งต่อนาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.internal-organs.p008
    topics: [health.body.internal-organs]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ช่วงหน้าแล้งที่เชียงใหม่ ค่าฝุ่น PM2.5 สูงมาก ข้อใดช่วยดูแลปอด (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "สวมหน้ากากอนามัยเมื่อออกนอกบ้าน", correct: true }
      - { id: b, text: "งดวิ่งเล่นกลางแจ้งนาน ๆ ในวันที่ฝุ่นสูง", correct: true }
      - { id: c, text: "ปิดประตูหน้าต่างเมื่อฝุ่นสูง", correct: true }
      - { id: d, text: "เผาใบไม้ในสวนเพื่อลดขยะ", feedback: "การเผาทำให้เกิดฝุ่นควันเพิ่ม ทำร้ายปอดของทุกคน" }
      - { id: e, text: "อยู่ใกล้คนที่สูบบุหรี่ได้ถ้าอยู่ในบ้าน", feedback: "ควันบุหรี่เป็นอันตรายต่อปอดไม่ว่าในบ้านหรือนอกบ้าน" }
    hints:
      - "ปอดรับทุกอย่างที่อยู่ในอากาศที่หายใจเข้าไป"
      - "ลดการสูดฝุ่นและควันเข้าปอด"
    solution: "สวมหน้ากาก งดกิจกรรมกลางแจ้งนาน ๆ และปิดประตูหน้าต่างในวันที่ฝุ่นสูง ช่วยลดฝุ่นเข้าปอด ส่วนการเผาและควันบุหรี่ทำร้ายปอด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.internal-organs.p009
    topics: [health.body.internal-organs]
    difficulty: 3
    type: order
    stem: "เรียงทางเดินของอาหารที่กินเข้าไป ตั้งแต่เข้าปากจนเป็นกากอาหาร"
    items:
      - "ปาก"
      - "กระเพาะอาหาร"
      - "ลำไส้เล็ก"
      - "ลำไส้ใหญ่"
    hints:
      - "อาหารต้องถูกย่อยก่อนจึงดูดซึมได้"
      - "ท่อที่ดูดซึมสารอาหารคือลำไส้เล็ก ส่วนลำไส้ใหญ่ดูดน้ำกลับ"
    solution: "ปาก → กระเพาะอาหาร → ลำไส้เล็ก → ลำไส้ใหญ่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.internal-organs.p010
    topics: [health.body.internal-organs]
    difficulty: 3
    type: mcq
    stem: "พ่อขี่รถจักรยานยนต์ไปส่งเจได้ที่โรงเรียนซึ่งอยู่ใกล้บ้าน เจได้บอกว่า \"ใกล้แค่นี้ไม่ต้องใส่หมวกกันน็อกก็ได้\" ข้อใดอธิบายได้ดีที่สุด"
    choices:
      - { id: a, text: "ต้องใส่ เพราะหมวกนิรภัยช่วยป้องกันสมองเมื่อศีรษะกระแทก ระยะใกล้ก็เกิดอุบัติเหตุได้", correct: true }
      - { id: b, text: "ไม่ต้องใส่ เพราะกะโหลกศีรษะป้องกันสมองได้ทั้งหมดแล้ว", feedback: "กะโหลกช่วยป้องกัน แต่แรงกระแทกจากการล้มรถแรงพอที่จะทำให้สมองบาดเจ็บได้" }
      - { id: c, text: "ใส่เฉพาะคนขับก็พอ", feedback: "คนซ้อนก็กระแทกพื้นได้เหมือนกัน กฎหมายไทยให้ทั้งคนขับและคนซ้อนสวมหมวกนิรภัย" }
    hints:
      - "สมองเป็นอวัยวะที่บอบบาง"
      - "อุบัติเหตุไม่ได้เลือกระยะทาง"
    solution: "ต้องสวมหมวกนิรภัยทุกครั้ง ทั้งคนขับและคนซ้อน เพราะหมวกช่วยลดแรงกระแทกที่ศีรษะและปกป้องสมอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.internal-organs.p011
    topics: [health.body.internal-organs]
    difficulty: 3
    type: numeric
    stem: "ตอนนั่งพัก ภูมินับการหายใจเข้าได้ 5 ครั้งใน 15 วินาที ภูมิหายใจกี่ครั้งต่อนาที (ตอบเป็นครั้งต่อนาที)"
    answer: { value: 20, unit: ครั้ง/นาที }
    misconceptions:
      - { match: 5, feedback: "5 ครั้งคือใน 15 วินาที ต้องเปลี่ยนเป็นต่อ 1 นาที" }
      - { match: 75, feedback: "นำ 5 คูณ 15 ไม่ถูก ต้องคูณด้วยจำนวนช่วง 15 วินาทีใน 1 นาที คือ 4" }
    hints:
      - "ใช้วิธีเดียวกับการนับชีพจร"
      - "คูณ 4"
    solution: "5 × 4 = 20 ครั้งต่อนาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.internal-organs.p012
    topics: [health.body.internal-organs]
    difficulty: 3
    type: mcq
    stem: "ป้าข้างบ้านยื่นยาแก้ปวดของป้าให้เมย์กิน เพราะเมย์ปวดหัว ข้อใดดีต่อตับและปลอดภัยที่สุด"
    choices:
      - { id: a, text: "ขอบคุณแต่ไม่กิน แล้วบอกพ่อแม่เพื่อให้ผู้ใหญ่หรือเภสัชกรช่วยดูแล", correct: true }
      - { id: b, text: "กินสองเม็ดจะได้หายเร็ว", feedback: "กินยาเกินขนาดทำร้ายตับได้ และยาของผู้ใหญ่อาจไม่เหมาะกับเด็ก" }
      - { id: c, text: "กินครึ่งเม็ดเพราะเป็นเด็ก", feedback: "ขนาดยาสำหรับเด็กต้องให้ผู้ใหญ่หรือเภสัชกรตัดสิน ไม่ควรแบ่งยาเอง" }
    hints:
      - "ตับทำหน้าที่กำจัดสารต่าง ๆ รวมทั้งยา"
      - "ใครควรตัดสินเรื่องยาของเด็ก"
    solution: "ไม่กินยาของผู้อื่นหรือกินยาเอง ให้บอกพ่อแม่หรือผู้ใหญ่ ซึ่งจะปรึกษาเภสัชกรหรือแพทย์ เพราะยาที่ไม่เหมาะหรือเกินขนาดทำร้ายตับได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.internal-organs.p013
    topics: [health.body.internal-organs]
    difficulty: 3
    type: mcq
    stem: "ดูภาพร่างกายที่หันหน้าเข้าหาเรา ตัวอักษรใดเป็นอวัยวะที่อยู่ช่องท้องด้านขวาบนของเจ้าของร่างกาย"
    figure:
      src: organs-quiz.svg
      alt: "ภาพร่างกายคนหันหน้าเข้าหาผู้ดู A อวัยวะในศีรษะ B อวัยวะคล้ายฟองน้ำในทรวงอก C อวัยวะรูปหัวใจระหว่างปอด D อวัยวะสีน้ำตาลแดงขนาดใหญ่ใต้ปอดอยู่ทางซ้ายมือผู้ดู E ถุงสีส้มใต้หัวใจอยู่ทางขวามือผู้ดู F อวัยวะรูปเมล็ดถั่ววาดเส้นประใกล้แนวเอวทางขวามือผู้ดู G ท่อเล็กขดกลางท้อง H ท่อใหญ่เป็นกรอบล้อมรอบ"
    choices:
      - { id: a, text: "D", correct: true }
      - { id: b, text: "E", feedback: "E อยู่ทางขวามือของเรา แต่เป็นด้านซ้ายของเจ้าของร่างกาย (กระเพาะอาหาร)" }
      - { id: c, text: "F", feedback: "F อยู่ด้านหลังใกล้แนวเอว ไม่ใช่ช่องท้องด้านบน" }
      - { id: d, text: "C", feedback: "C อยู่ในทรวงอก ไม่ใช่ช่องท้อง" }
    hints:
      - "คนในภาพหันหน้ามาหาเรา ขวาของเขาอยู่ทางซ้ายมือของเรา"
      - "อวัยวะนั้นคือตับ"
    solution: "ด้านขวาของเจ้าของร่างกายอยู่ทางซ้ายมือของเรา อวัยวะใหญ่ใต้ปอดตรงนั้นคือ D ตับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.internal-organs.p014
    topics: [health.body.internal-organs]
    difficulty: 4
    type: numeric
