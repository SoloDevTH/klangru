      - "ยุติธรรมเมื่อทุกคนได้ $\\tfrac13$"
    solution: "ลูกเต๋าแบ่งหกหน้าเป็นสามกลุ่มกลุ่มละสองหน้า ทุกคนได้ $\\tfrac26 = \\tfrac13$"
