<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" width="780" height="540" font-family="sans-serif" font-size="14">
<title>วัฏจักรหิน</title>
<rect x="0" y="0" width="780" height="540" fill="#ffffff"/>
<rect x="290.0" y="415.0" width="200" height="60" rx="12" fill="#fca5a5" stroke="#1f2937" stroke-width="1.5"/>
<text x="390.0" y="443.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">แมกมา</text>
<text x="390.0" y="465.0" text-anchor="middle" font-size="12" fill="#374151">หินหลอมเหลวใต้ผิวโลก</text>
<rect x="20.0" y="218.0" width="200" height="64" rx="12" fill="#fdba74" stroke="#1f2937" stroke-width="1.5"/>
<text x="120.0" y="248.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">หินอัคนี</text>
<text x="120.0" y="270.0" text-anchor="middle" font-size="12" fill="#374151">แกรนิต บะซอลต์ พัมมิส</text>
<rect x="280.0" y="30.0" width="220" height="60" rx="12" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.5"/>
<text x="390.0" y="58.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">ตะกอน</text>
<text x="390.0" y="80.0" text-anchor="middle" font-size="12" fill="#374151">กรวด ทราย โคลน เปลือกหอย</text>
<rect x="560.0" y="158.0" width="200" height="64" rx="12" fill="#fde68a" stroke="#1f2937" stroke-width="1.5"/>
<text x="660.0" y="188.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">หินตะกอน</text>
<text x="660.0" y="210.0" text-anchor="middle" font-size="12" fill="#374151">หินทราย หินปูน หินดินดาน</text>
<rect x="560.0" y="328.0" width="200" height="64" rx="12" fill="#c4b5fd" stroke="#1f2937" stroke-width="1.5"/>
<text x="660.0" y="358.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">หินแปร</text>
<text x="660.0" y="380.0" text-anchor="middle" font-size="12" fill="#374151">หินอ่อน หินชนวน หินไนส์</text>
<line x1="300.0" y1="425.0" x2="150.0" y2="284.0" stroke="#b91c1c" stroke-width="3"/>
<polygon points="150.0,284.0 160.3,287.8 154.4,294.1" fill="#b91c1c"/>
<text x="175.0" y="390.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">เย็นตัวและแข็งตัว</text>
<text x="175.0" y="407.0" text-anchor="middle" font-size="11" fill="#4b5563">ลาวาบนผิวโลก: วันถึงหลายปี</text>
<line x1="140.0" y1="216.0" x2="285.0" y2="85.0" stroke="#a16207" stroke-width="3"/>
<polygon points="285.0,85.0 280.4,95.0 274.6,88.6" fill="#a16207"/>
<text x="150.0" y="130.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#a16207">ผุพัง กร่อน</text>
<text x="150.0" y="147.0" text-anchor="middle" font-size="11" fill="#4b5563">ถูกน้ำ ลม พัดพา</text>
<line x1="500.0" y1="75.0" x2="600.0" y2="156.0" stroke="#a16207" stroke-width="3"/>
<polygon points="600.0,156.0 589.4,153.0 594.8,146.3" fill="#a16207"/>
<text x="600.0" y="95.0" text-anchor="start" font-size="13" font-weight="bold" fill="#a16207">ทับถม อัดแน่น</text>
<text x="600.0" y="112.0" text-anchor="start" font-size="11" fill="#4b5563">เชื่อมประสาน: นับพันถึงล้านปี</text>
<line x1="660.0" y1="224.0" x2="660.0" y2="326.0" stroke="#6d28d9" stroke-width="3"/>
<polygon points="660.0,326.0 655.7,315.9 664.3,315.9" fill="#6d28d9"/>
<text x="670.0" y="268.0" text-anchor="start" font-size="13" font-weight="bold" fill="#6d28d9">ความร้อน</text>
<text x="670.0" y="286.0" text-anchor="start" font-size="13" font-weight="bold" fill="#6d28d9">และความดันสูง</text>
<line x1="580.0" y1="392.0" x2="490.0" y2="430.0" stroke="#b91c1c" stroke-width="3"/>
<polygon points="490.0,430.0 497.7,422.1 501.0,430.0" fill="#b91c1c"/>
<text x="560.0" y="450.0" text-anchor="start" font-size="13" font-weight="bold" fill="#b91c1c">หลอมละลาย</text>
<text x="560.0" y="467.0" text-anchor="start" font-size="11" fill="#4b5563">ลึกลงไปใต้ผิวโลก</text>
<line x1="222.0" y1="262.0" x2="558.0" y2="350.0" stroke="#6d28d9" stroke-width="2"/>
<polygon points="558.0,350.0 549.1,351.3 550.9,344.5" fill="#6d28d9"/>
<text x="440.0" y="280.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#6d28d9">ความร้อนและความดัน</text>
<text x="20.0" y="520.0" text-anchor="start" font-size="12" fill="#374151">ลูกศรเส้นบางคือทางลัด หินทุกประเภทผุพังเป็นตะกอนหรือหลอมเป็นแมกมาได้ (ไม่ได้วาดทุกเส้น)</text>
</svg>