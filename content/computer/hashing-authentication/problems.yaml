      - { id: b, text: "เข้ารหัสค่าแฮชด้วย AES แล้วเก็บกุญแจไว้ในไฟล์เดียวกัน", feedback: "ถ้ากุญแจอยู่ที่เดียวกับข้อมูล ผู้ได้ข้อมูลไปก็ถอดได้หมด การปรับปรุงนี้ไม่แก้ปัญหาหลัก" }
      - { id: c, text: "บังคับให้รหัสยาวขึ้นแต่ยังใช้ MD5 เหมือนเดิม", feedback: "ความยาวช่วยได้บ้าง แต่ MD5 ยังเร็วเกินไปและไม่มีซอลต์ จึงยังไม่ใช่การแก้ที่ถูกจุด" }
      - { id: d, text: "ส่งรหัสผ่านไปยังอีเมลของสมาชิกทุกครั้งที่ล็อกอิน", feedback: "วิธีนี้ทำให้รหัสผ่านถูกส่งผ่านช่องทางอื่นและไม่เกี่ยวกับการเก็บอย่างปลอดภัย" }
    hints:
