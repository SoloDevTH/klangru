problems:
- id: business.marketing.marketing-mix.p001
  topics:
  - business.marketing.marketing-mix
  difficulty: 1
  type: match
  stem: จับคู่การตัดสินใจของร้านกับส่วนประสมทางการตลาด (4P)
  pairs:
  - left: เปลี่ยนขวดน้ำพริกเป็นกระปุกพลาสติกปิดสนิท
    right: ผลิตภัณฑ์ (Product)
  - left: ตั้งราคากระปุกละ 59 บาท
    right: ราคา (Price)
  - left: ส่งขายในร้านของฝากและเปิดร้านในแอปขายของออนไลน์
    right: ช่องทางจัดจำหน่าย (Place)
  - left: ไลฟ์สดในโซเชียลและลดราคาช่วงเปิดร้าน
    right: การส่งเสริมการตลาด (Promotion)
  hints:
  - Place คือสินค้าไปถึงมือลูกค้าทางไหน
  - Promotion คือการสื่อสารและจูงใจให้ลูกค้าซื้อ
  solution: บรรจุภัณฑ์ → ผลิตภัณฑ์ · 59 บาท → ราคา · ร้านของฝากและแอป → ช่องทางจัดจำหน่าย · ไลฟ์สดและลดราคา → การส่งเสริมการตลาด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.marketing-mix.p002
  topics:
  - business.marketing.marketing-mix
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็น **ความต้องการพื้นฐาน (need)** มากกว่าความอยาก (want)
  choices:
  - id: a
    text: อยากมีอาหารกินเมื่อหิว
    correct: true
  - id: b
    text: อยากได้ชานมไข่มุกยี่ห้อดังที่เพื่อนรีวิว
    feedback: นี่คือความอยากที่เจาะจงยี่ห้อ ความต้องการพื้นฐานคือความหิวหรือกระหาย
  - id: c
    text: อยากได้รองเท้ารุ่นพิเศษสีเดียวกับนักกีฬา
    feedback: ความต้องการพื้นฐานคือมีรองเท้าใส่ ส่วนรุ่นและสีเป็นความอยาก
  - id: d
    text: อยากได้โทรศัพท์รุ่นล่าสุดทั้งที่เครื่องเดิมยังใช้ได้ดี
    feedback: เป็นความอยากที่เกินความจำเป็น
  hints:
  - ความต้องการพื้นฐานคือสิ่งที่ขาดไม่ได้
  - ความอยากคือรูปแบบเฉพาะที่คนเลือกเพื่อสนองความต้องการ
  solution: ความหิวเป็นความต้องการพื้นฐาน ส่วนการอยากได้สินค้ายี่ห้อหรือรุ่นที่เจาะจงคือความอยากที่การตลาดพยายามสร้าง ผู้บริโภคที่รู้เท่าทันควรแยกสองอย่างนี้ออกจากกัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.marketing-mix.p003
  topics:
  - business.marketing.marketing-mix
  difficulty: 2
  type: match
  stem: จับคู่วิธีแบ่งส่วนตลาดกับตัวอย่าง
  pairs:
  - left: ภูมิศาสตร์
    right: ลูกค้าในภาคเหนือกับลูกค้าในภาคใต้
  - left: ประชากรศาสตร์
    right: นักเรียนอายุ 13–18 ปี กับวัยทำงานอายุ 25–35 ปี
  - left: จิตวิทยาและไลฟ์สไตล์
    right: คนรักสุขภาพที่ออกกำลังกายทุกวัน
  - left: พฤติกรรมการซื้อ
    right: ลูกค้าที่ซื้อซ้ำทุกสัปดาห์กับลูกค้าที่ซื้อเฉพาะช่วงเทศกาล
  hints:
  - ภูมิศาสตร์คือแบ่งตามที่อยู่ ประชากรศาสตร์คือแบ่งตามอายุ รายได้ อาชีพ
  - พฤติกรรมคือแบ่งตามวิธีที่ลูกค้าซื้อหรือใช้สินค้า
  solution: ภาค → ภูมิศาสตร์ · อายุ → ประชากรศาสตร์ · คนรักสุขภาพ → จิตวิทยาและไลฟ์สไตล์ · ซื้อซ้ำทุกสัปดาห์ → พฤติกรรม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.marketing-mix.p004
  topics:
  - business.marketing.marketing-mix
  difficulty: 2
  type: mcq
  stem: ร้านทำขนมไทยไร้น้ำตาล (สมมติ) ควรเลือกกลุ่มใดเป็น **ตลาดเป้าหมาย** หลักมากที่สุด
  choices:
  - id: a
    text: ผู้ใหญ่ที่ต้องควบคุมน้ำตาลและคนรักสุขภาพ
    correct: true
  - id: b
    text: ทุกคนในประเทศ
    feedback: การขายให้ทุกคนทำให้สื่อสารไม่ชัด สินค้าไร้น้ำตาลเหมาะกับกลุ่มเฉพาะ
  - id: c
    text: เด็กเล็กที่ชอบขนมหวานจัด
    feedback: กลุ่มนี้ต้องการรสหวาน ไม่ตรงกับจุดเด่นของสินค้า
  - id: d
    text: นักท่องเที่ยวที่หาของฝากราคาถูกที่สุด
    feedback: จุดเด่นของสินค้าคือสุขภาพ ไม่ใช่ราคาถูกที่สุด
  hints:
  - ตลาดเป้าหมายคือกลุ่มที่ได้ประโยชน์จากจุดเด่นของสินค้ามากที่สุด
  - จุดเด่นของสินค้านี้คืออะไร
  solution: สินค้าไร้น้ำตาลตอบโจทย์คนที่ต้องคุมน้ำตาลและคนรักสุขภาพ จึงควรเลือกกลุ่มนี้เป็นเป้าหมาย แล้วออกแบบราคา ช่องทาง และการสื่อสารให้ตรงกลุ่ม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.marketing-mix.p005
  topics:
  - business.marketing.marketing-mix
  difficulty: 2
  type: numeric
  stem: แม่ศรีขายน้ำพริกในตำบลที่มี $1{,}200$ ครัวเรือน คาดว่า $25\%$ ของครัวเรือนเป็นลูกค้าเป้าหมาย และแต่ละครัวเรือนซื้อเดือนละ $2$ กระปุก (สมมติ) แม่ศรีควรเตรียมน้ำพริกเดือนละกี่กระปุก (ตอบเป็นกระปุก)
  answer:
    value: 600
    unit: กระปุก
  misconceptions:
  - match: 300
    feedback: ลืมคูณจำนวนกระปุกต่อครัวเรือน
  - match: 2400
    feedback: ลืมคิดเฉพาะครัวเรือนเป้าหมาย 25%
  hints:
  - หาจำนวนครัวเรือนเป้าหมายก่อน
  - คูณด้วยจำนวนกระปุกที่แต่ละครัวเรือนซื้อต่อเดือน
  solution: ครัวเรือนเป้าหมาย $= 1{,}200 \times 0.25 = 300$ ครัวเรือน ความต้องการ $= 300 \times 2 = 600$ กระปุกต่อเดือน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.marketing-mix.p006
  topics:
  - business.marketing.marketing-mix
  difficulty: 2
  type: order
  stem: เรียงขั้นของวงจรชีวิตผลิตภัณฑ์ตามลำดับเวลา
  items:
  - ขั้นแนะนำ
  - ขั้นเติบโต
  - ขั้นอิ่มตัว
  - ขั้นถดถอย
  hints:
  - สินค้าใหม่เริ่มจากคนรู้จักน้อย
  - ยอดขายสูงสุดในขั้นใด แล้วจึงลดลง
  solution: แนะนำ (ยอดขายต่ำ คนเพิ่งรู้จัก) → เติบโต (ยอดขายเพิ่มเร็ว คู่แข่งเริ่มเข้ามา) → อิ่มตัว (ยอดขายสูงสุดและทรงตัว) → ถดถอย (ยอดขายลดลง)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.marketing-mix.p007
  topics:
  - business.marketing.marketing-mix
  difficulty: 3
  type: numeric
  stem: กระเป๋าผ้าทอมือต้นทุนใบละ $350$ บาท ขายใบละ $500$ บาท (สมมติ) กำไรขั้นต้นคิดเป็นร้อยละเท่าไรของ **ราคาขาย** (ตอบเป็น %)
  answer:
    value: 30
    unit: '%'
  misconceptions:
  - match: 42.857143
    feedback: หารด้วยต้นทุน (นั่นคือส่วนเพิ่มจากต้นทุน) โจทย์ถามเทียบกับราคาขาย
  hints:
  - กำไรต่อใบ $=$ ราคาขาย $-$ ต้นทุน
  - หารด้วยราคาขาย แล้วคูณ $100$
  solution: กำไรต่อใบ $= 500 - 350 = 150$ บาท อัตรากำไรต่อราคาขาย $= \dfrac{150}{500} \times 100 = 30\%$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.marketing-mix.p008
  topics:
  - business.marketing.marketing-mix
  difficulty: 3
  type: match
  stem: จับคู่ขั้นของวงจรชีวิตผลิตภัณฑ์กับกลยุทธ์ที่เหมาะสม
  pairs:
  - left: ขั้นแนะนำ
    right: ให้ทดลองชิม โฆษณาให้คนรู้จัก
  - left: ขั้นเติบโต
    right: ขยายช่องทางขาย เพิ่มรสชาติใหม่
  - left: ขั้นอิ่มตัว
    right: สร้างความภักดี ปรับบรรจุภัณฑ์ แข่งด้านราคาและบริการ
  - left: ขั้นถดถอย
    right: ลดต้นทุน ลดรุ่นที่ขายไม่ดี หรือพัฒนาสินค้าใหม่แทน
  hints:
  - ขั้นแนะนำปัญหาหลักคือคนยังไม่รู้จัก
  - ขั้นอิ่มตัวคู่แข่งมากและลูกค้าใหม่หายาก
  solution: แนะนำ → สร้างการรับรู้ · เติบโต → ขยายตลาด · อิ่มตัว → รักษาลูกค้าและสร้างความแตกต่าง · ถดถอย → ลดต้นทุนหรือเปลี่ยนสินค้า
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.marketing-mix.p009
  topics:
  - business.marketing.marketing-mix
  difficulty: 3
  type: mcq
  stem: จากแผนที่ตำแหน่งในภาพ ร้านใดน่าจะเสียลูกค้าให้คู่แข่งมากที่สุดถ้าลูกค้าเปรียบเทียบเฉพาะราคาและคุณภาพ
  figure:
    src: p-position-map.svg
    alt: แผนที่ตำแหน่ง แกนนอนคือราคาจากต่ำ (ซ้าย) ไปสูง (ขวา) แกนตั้งคือคุณภาพที่ลูกค้ารับรู้จากพื้นฐาน (ล่าง) ไปสูง (บน) ร้าน A อยู่มุมขวาบน (ราคาสูง คุณภาพสูง) ร้าน B อยู่มุมซ้ายล่าง (ราคาต่ำ คุณภาพพื้นฐาน) ร้าน C อยู่ซ้ายบน (ราคาต่ำ คุณภาพค่อนข้างสูง) ร้าน D อยู่ขวาล่าง (ราคาสูง คุณภาพพื้นฐาน) ไม่มีร้านใดอยู่ใกล้จุดกลาง ข้อมูลจากแบบสอบถามลูกค้า 200 คน (สมมติ)
  choices:
  - id: a
    text: ร้าน D
    correct: true
  - id: b
    text: ร้าน A
    feedback: ร้าน A ราคาสูงแต่ลูกค้ารับรู้ว่าคุณภาพสูงด้วย จึงมีเหตุผลให้ลูกค้ายอมจ่าย
  - id: c
    text: ร้าน B
    feedback: ร้าน B ราคาต่ำ เหมาะกับลูกค้าที่เน้นประหยัด
  - id: d
    text: ร้าน C
    feedback: ร้าน C ให้คุณภาพค่อนข้างสูงในราคาต่ำ ลูกค้าน่าจะชอบ
  hints:
  - ดูว่าร้านใดราคาสูงแต่คุณภาพที่ลูกค้ารับรู้ต่ำ
  - ลูกค้าเทียบความคุ้มค่า คือคุณภาพที่ได้ต่อราคาที่จ่าย
  solution: ร้าน D ราคาสูงแต่ลูกค้ารับรู้ว่าคุณภาพพื้นฐาน จึงคุ้มค่าน้อยที่สุด ลูกค้าอาจย้ายไปร้าน C (ถูกกว่าและดีกว่า) หรือร้าน A (แพงพอกันแต่ดีกว่า) ร้าน D ต้องปรับคุณภาพหรือลดราคา
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.marketing-mix.p010
  topics:
  - business.marketing.marketing-mix
  difficulty: 3
  type: mcq
  stem: ข้อใดเป็นการ **ส่งเสริมการขาย (sales promotion)** (เลือกได้มากกว่าหนึ่งข้อ)
  multiple: true
  choices:
  - id: a
    text: แจกคูปองลด 20 บาทเมื่อซื้อครบ 200 บาท
    correct: true
  - id: b
    text: ซื้อ 2 แถม 1 ในเดือนเปิดร้าน
    correct: true
  - id: c
    text: สะสมแต้มครบ 10 แก้วรับฟรี 1 แก้ว
    correct: true
  - id: d
    text: ลงโฆษณาในเพจท้องถิ่นแนะนำร้าน
    feedback: นี่คือการโฆษณา เป็นเครื่องมือส่งเสริมการตลาดอีกแบบ
  - id: e
    text: พนักงานแนะนำสินค้าให้ลูกค้าแต่ละคนที่หน้าร้าน
    feedback: นี่คือการขายโดยใช้พนักงาน
  hints:
  - การส่งเสริมการขายคือสิ่งจูงใจระยะสั้นให้ซื้อทันที
  - ส่วนลด ของแถม และแต้มสะสมเป็นสิ่งจูงใจ
  solution: คูปอง ซื้อ 2 แถม 1 และแต้มสะสมเป็นการส่งเสริมการขาย ส่วนโฆษณาและการขายโดยพนักงานเป็นเครื่องมือส่งเสริมการตลาดแบบอื่น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.marketing-mix.p011
  topics:
  - business.marketing.marketing-mix
  difficulty: 3
  type: text
  stem: ใน 4P ตัว P ที่หมายถึง **การทำให้สินค้าไปถึงมือลูกค้า** เช่น หน้าร้าน ตัวแทนจำหน่าย หรือร้านออนไลน์ เรียกว่าอะไร (ตอบภาษาไทยหรืออังกฤษ)
  accepted:
  - ช่องทางจัดจำหน่าย
  - ช่องทางการจัดจำหน่าย
  - การจัดจำหน่าย
  - place
  - ช่องทางการจัดจำหน่าย (place)
  - ช่องทางจัดจำหน่าย (place)
  misconceptions:
  - match: promotion
    feedback: Promotion คือการส่งเสริมการตลาด เช่น โฆษณา ลดราคา
  - match: การส่งเสริมการตลาด
    feedback: นั่นคือการสื่อสารและจูงใจ ไม่ใช่การส่งสินค้าไปถึงลูกค้า
  hints:
  - ไม่ใช่ราคาและไม่ใช่การโฆษณา
  - คำภาษาอังกฤษหมายถึงสถานที่
  solution: '**ช่องทางจัดจำหน่าย (Place)** คือเส้นทางที่สินค้าไปถึงลูกค้า รวมถึงการขนส่งและการเก็บสต็อก'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.marketing.marketing-mix.p012
  topics:
  - business.marketing.marketing-mix
  difficulty: 3
  type: numeric
  stem: ร้านขายเสื้อมัดย้อมในแอปขายของออนไลน์ราคาตัวละ $250$ บาท แอปหักค่าธรรมเนียม $8\%$ ของราคาขาย และร้านช่วยออกค่าส่ง $15$ บาทต่อตัว (สมมติ) ถ้าต้นทุนเสื้อตัวละ $150$ บาท ร้านได้กำไรตัวละกี่บาท (ตอบเป็นบาท)
  answer:
    value: 65
    unit: บาท
  misconceptions:
  - match: 100
