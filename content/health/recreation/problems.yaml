    ai_assisted: true

  - id: health.movement.recreation.p017
    topics: [health.movement.recreation]
    difficulty: 5
    type: mcq
    stem: "พ่อแม่ให้พิมไปเรียนเปียโนทุกวันหลังเลิกเรียน พิมไม่ชอบและเครียดทุกครั้ง แต่ชอบวาดรูปมาก ตามความหมายของนันทนาการ ข้อใดวิเคราะห์ได้ถูกต้อง"
    choices:
      - { id: a, text: "สำหรับพิม การเรียนเปียโนตอนนี้ยังไม่ใช่นันทนาการ เพราะไม่ได้สมัครใจและไม่ได้ความพึงพอใจ พิมควรคุยกับพ่อแม่ถึงความรู้สึกและกิจกรรมที่ชอบ", correct: true }
      - { id: b, text: "เปียโนเป็นดนตรี จึงเป็นนันทนาการสำหรับทุกคนเสมอ", feedback: "กิจกรรมเดียวกันเป็นนันทนาการหรือไม่ ขึ้นกับความสมัครใจและความพึงพอใจของผู้ทำ" }
      - { id: c, text: "พิมควรหยุดเรียนทุกอย่างโดยไม่บอกพ่อแม่", feedback: "การพูดคุยกับพ่อแม่อย่างเปิดใจเป็นทางที่ดีกว่า" }
      - { id: d, text: "การวาดรูปไม่มีประโยชน์ จึงไม่ใช่นันทนาการ", feedback: "การวาดรูปเป็นศิลปหัตถกรรม ช่วยผ่อนคลายและพัฒนาความคิดสร้างสรรค์" }
    hints:
      - "นิยามของนันทนาการมีคำว่า สมัครใจ และ ความพึงพอใจ"
      - "กิจกรรมเดียวกันอาจเป็นนันทนาการของคนหนึ่ง แต่ไม่ใช่ของอีกคน"
    solution: "นันทนาการขึ้นกับความสมัครใจและความพึงพอใจของผู้ทำ สำหรับพิมที่ไม่สมัครใจและเครียด การเรียนเปียโนจึงยังไม่ใช่นันทนาการ ทางออกที่ดีคือพูดคุยกับพ่อแม่และหาสมดุลกับกิจกรรมที่ชอบ เช่น วาดรูป"
    license: CC-BY-SA-4.0
    ai_assisted: true

