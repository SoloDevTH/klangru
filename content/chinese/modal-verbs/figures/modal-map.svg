<rect x="470.0" y="214.0" width="240.0" height="54.0" rx="8" fill="#fff" stroke="#2a6a2a" stroke-width="2"/>
<text x="590.0" y="248.0" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="normal">不会</text>
<line x1="234.0" y1="241.0" x2="286.0" y2="241.0" stroke="#2a6a2a" stroke-width="2" stroke-linecap="round" marker-end="url(#a2a6a2a)"/>
<line x1="434.0" y1="241.0" x2="466.0" y2="241.0" stroke="#2a6a2a" stroke-width="2" stroke-linecap="round" marker-end="url(#a2a6a2a)"/>
<rect x="30.0" y="280.0" width="200.0" height="54.0" rx="8" fill="#fbf0c0" stroke="#7a5a00" stroke-width="2"/>
<text x="130.0" y="313.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="normal">…ได้ (ความสามารถ สภาพ)</text>
<rect x="290.0" y="280.0" width="140.0" height="54.0" rx="8" fill="#fbf0c0" stroke="#7a5a00" stroke-width="2"/>
<text x="360.0" y="315.0" font-size="22" text-anchor="middle" fill="#1a1a1a" font-weight="bold">能 néng</text>
<rect x="470.0" y="280.0" width="240.0" height="54.0" rx="8" fill="#fff" stroke="#7a5a00" stroke-width="2"/>
<text x="590.0" y="314.0" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="normal">不能</text>
<line x1="234.0" y1="307.0" x2="286.0" y2="307.0" stroke="#7a5a00" stroke-width="2" stroke-linecap="round" marker-end="url(#a7a5a00)"/>
<line x1="434.0" y1="307.0" x2="466.0" y2="307.0" stroke="#7a5a00" stroke-width="2" stroke-linecap="round" marker-end="url(#a7a5a00)"/>
<rect x="30.0" y="346.0" width="200.0" height="54.0" rx="8" fill="#fbe0dc" stroke="#b3261e" stroke-width="2"/>
<text x="130.0" y="379.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="normal">…ได้ไหม (ขออนุญาต)</text>
<rect x="290.0" y="346.0" width="140.0" height="54.0" rx="8" fill="#fbe0dc" stroke="#b3261e" stroke-width="2"/>
<text x="360.0" y="381.0" font-size="22" text-anchor="middle" fill="#1a1a1a" font-weight="bold">可以 kěyǐ</text>
<rect x="470.0" y="346.0" width="240.0" height="54.0" rx="8" fill="#fff" stroke="#b3261e" stroke-width="2"/>
<text x="590.0" y="380.0" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="normal">不可以 / 不能 / 不行</text>
<line x1="234.0" y1="373.0" x2="286.0" y2="373.0" stroke="#b3261e" stroke-width="2" stroke-linecap="round" marker-end="url(#ab3261e)"/>
<line x1="434.0" y1="373.0" x2="466.0" y2="373.0" stroke="#b3261e" stroke-width="2" stroke-linecap="round" marker-end="url(#ab3261e)"/>
<text x="360.0" y="434.0" font-size="15" text-anchor="middle" fill="#666" font-weight="normal">我会游泳。(ว่ายเป็น) · 今天我不能游泳。(วันนี้ว่ายไม่ได้)</text>
</svg>
