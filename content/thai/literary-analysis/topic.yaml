id: thai.literature.literary-analysis
subject: thai
title: { th: การวิเคราะห์และวิจารณ์วรรณคดี, en: "Analysing and critiquing Thai literature" }
summary: หลักการวิจารณ์เบื้องต้น วิเคราะห์เนื้อหา ตัวละคร ฉาก แนวคิด วรรณศิลป์ (เล่นเสียง เล่นคำ ภาพพจน์ รสวรรณคดี ขนบ) วิถีไทยและประวัติศาสตร์ และประเมินคุณค่า จากนิราศภูเขาทองและนิราศนรินทร์
difficulty: 6
minutes: 40
prerequisites: [thai.literature.lessons-from-reading, thai.reading.critical-reading]
encompasses:
  - { id: thai.literature.lessons-from-reading, weight: 0.3 }
  - { id: thai.reading.critical-reading, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: analysis-map.svg
    alt: "แผนภาพ ตัวบทอยู่กลาง ยกมาเป็นหลักฐานทุกครั้ง มีลูกศรออกไป 4 กล่อง ด้านเนื้อหา เรื่อง สรุปตามลำดับ ตัวละครหรือผู้เล่า ฉาก ที่ไหน เมื่อไร แนวคิด แก่นเรื่อง ด้านวรรณศิลป์ สรรคำ เล่นเสียง เล่นคำ ภาพพจน์ เปรียบอะไรกับอะไร รสวรรณคดี ขนบของคำประพันธ์ ด้านสังคมและวัฒนธรรม วิถีชีวิต อาชีพ การแต่งกาย ความเชื่อ ศาสนา ค่านิยม เชื่อมกับประวัติศาสตร์ ตรวจกับแหล่งอื่น ประเมินคุณค่าและนำไปใช้ ชี้จุดเด่น จุดด้อย พร้อมเหตุผล คุณค่าด้านวรรณศิลป์ เนื้อหา สังคม และการนำไปใช้ ข้อคิดสำหรับชีวิตปัจจุบัน ด้านล่างเป็นหลักการวิจารณ์เบื้องต้น 4 ขั้น อ่านและถอดความ วิเคราะห์ วิจารณ์ ประเมินคุณค่า"
    caption: "วิเคราะห์สามด้านจากตัวบท แล้วจึงประเมินคุณค่า"
  - type: worked-example
    title: วิเคราะห์การเล่นคำจากชื่อตำบล
    problem: "วิเคราะห์ \"ถึงบางพลูคิดถึงคู่เมื่ออยู่ครอง · เคยใส่ซองส่งให้ล้วนใบเหลือง / ถึงบางพลัดเหมือนพี่พลัดมาขัดเคือง · ทั้งพลัดเมืองพลัดสมรมาร้อนรน\" (สุนทรภู่ นิราศภูเขาทอง ตามวิกิซอร์ซ)"
    steps:
      - text: "ถอดความ: ผ่านบางพลู นึกถึงคู่ครองที่เคยจีบพลูใส่ซองส่งให้ ผ่านบางพลัด รู้สึกว่าตนพลัดพรากทั้งบ้านเมืองและคนรัก"
      - text: "วรรณศิลป์: เล่นคำจากชื่อตำบล บางพลู → ใบพลู และ บางพลัด → พลัดพราก บรรทัดที่สองมีคำ พลัด ถึงสี่แห่ง (บางพลัด พี่พลัด พลัดเมือง พลัดสมร) ย้ำความรู้สึกพลัดพราก"
        why: "ชื่อสถานที่ที่ผ่านเป็นตัวกระตุ้นความรู้สึก ซึ่งเป็นขนบของนิราศ"
      - text: "รส: คร่ำครวญถึงความพลัดพราก จึงเป็นรสสัลลาปังคพิไสย"
      - text: "สังคมและวัฒนธรรม: การใส่ใบพลูในซองส่งให้กัน สะท้อนวัฒนธรรมการกินหมากพลูในอดีต"
      - text: "สรุปคุณค่า: กวีใช้ชื่อสถานที่จริงสร้างทั้งความไพเราะและอารมณ์ และบันทึกวิถีชีวิตไว้ด้วย"
    answer: "เด่นที่การเล่นคำจากชื่อตำบล (พลู พลัด) และการซ้ำคำ พลัด สี่แห่ง แสดงรสสัลลาปังคพิไสย และสะท้อนวัฒนธรรมหมากพลู"
  - { type: check, problem: thai.literature.literary-analysis.p004, prompt: "หาคำเชื่อมการเปรียบก่อน" }
  - type: worked-example
    title: เชื่อมวรรณคดีกับประวัติศาสตร์
    problem: "\"ถึงสามโคกโศกถวิลถึงปิ่นเกล้า · พระพุทธเจ้าหลวงบำรุงซึ่งกรุงศรี / ประทานนามสามโคกเป็นเมืองตรี · ชื่อปทุมธานีเพราะมีบัว\" (สุนทรภู่ นิราศภูเขาทอง ตามวิกิซอร์ซ) วิเคราะห์ลักษณะเด่นเชื่อมกับประวัติศาสตร์"
    steps:
      - text: "ถอดความ: ผ่านสามโคก กวีคิดถึงกษัตริย์ที่เคยชุบเลี้ยง ซึ่งพระราชทานชื่อเมืองสามโคกว่าปทุมธานีเพราะมีดอกบัวมาก"
      - text: "ตรวจกับแหล่งอื่น: ประวัติจังหวัดปทุมธานีระบุว่ารัชกาลที่ 2 โปรดให้เปลี่ยนชื่อเมืองสามโคกเมื่อ พ.ศ. 2358 (เดิมสะกด ประทุมธานี)"
        why: "ข้อมูลประวัติศาสตร์ในวรรณคดีควรตรวจกับหลักฐานอื่นก่อนสรุป"
      - text: "เชื่อมกับบริบท: นิราศแต่ง พ.ศ. 2371 สมัยรัชกาลที่ 3 ห่างจากการเปลี่ยนชื่อ 13 ปี กวีจึงยังจำได้ และรำลึกถึงรัชกาลที่ 2 ด้วยความอาลัย"
      - text: "ลักษณะเด่น: นิราศบันทึกชื่อสถานที่และเหตุการณ์จริงตามเส้นทาง จึงใช้ศึกษาภูมิศาสตร์และประวัติศาสตร์ท้องถิ่นได้"
    answer: "ตัวบทบันทึกการพระราชทานนามปทุมธานีของรัชกาลที่ 2 ซึ่งตรงกับประวัติจังหวัด แสดงลักษณะเด่นของนิราศที่บันทึกสถานที่และเหตุการณ์จริง"
  - { type: check, problem: thai.literature.literary-analysis.p007, prompt: "หาคำที่บอกอารมณ์" }
glossary:
  - { term: วิเคราะห์วรรณคดี, definition: "แยกส่วนของวรรณคดี เช่น เนื้อหา วรรณศิลป์ สังคม แล้วอธิบายว่าแต่ละส่วนทำงานอย่างไร" }
  - { term: วิจารณ์วรรณคดี, definition: "ประเมินจุดเด่นและจุดด้อยของวรรณคดีอย่างมีเหตุผล โดยยกตัวบทเป็นหลักฐาน" }
  - { term: แนวคิด, definition: "ความคิดหลักที่เรื่องต้องการสื่อ แบบเรียนบางเล่มเรียกแก่นเรื่อง" }
  - { term: วรรณศิลป์, definition: "ฝีมือและความงามทางภาษาของผู้แต่ง เช่น การสรรคำ การเล่นเสียง เล่นคำ ภาพพจน์ และรส" }
  - { term: รสวรรณคดี, definition: "อารมณ์ที่ตัวบทก่อให้เกิดแก่ผู้อ่าน แบบเรียนไทยนิยมแบ่ง 4 รส คือ เสาวรจนี นารีปราโมทย์ พิโรธวาทัง สัลลาปังคพิไสย" }
  - { term: ขนบ, definition: "แบบแผนที่ผู้แต่งในประเภทเดียวกันถือปฏิบัติ เช่น นิราศมักคร่ำครวญถึงหญิงคนรัก" }
  - { term: นิราศ, definition: "คำประพันธ์ที่เล่าการเดินทางไกลจากบ้านหรือคนรัก ผู้แต่งเล่าสถานที่ที่ผ่านและความรู้สึกที่เกิดขึ้นระหว่างทาง" }
flashcards:
  - { front: "หลักการวิจารณ์เบื้องต้น 4 ขั้น", back: "อ่านและถอดความ → วิเคราะห์ → วิจารณ์โดยยกตัวบท → ประเมินคุณค่า" }
  - { front: "รสวรรณคดี 4 รส", back: "เสาวรจนี (ชมความงาม) นารีปราโมทย์ (เกี้ยว) พิโรธวาทัง (โกรธ) สัลลาปังคพิไสย (โศก)" }
  - { front: "วิเคราะห์ภาพพจน์ให้ครบ", back: "บอกชนิด เปรียบอะไรกับอะไร และทำให้ความหมายลึกขึ้นอย่างไร" }
  - { front: "คุณค่าวรรณคดี 4 ด้าน", back: "วรรณศิลป์ เนื้อหา สังคมและวัฒนธรรม การนำไปใช้" }
  - { front: "ก่อนตัดสินว่าวรรณคดีดีหรือไม่", back: "ดูยุคสมัยและขนบของคำประพันธ์ประเภทนั้น" }
