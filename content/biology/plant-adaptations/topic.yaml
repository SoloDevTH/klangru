id: biology.plants.plant-adaptations
subject: biology
title: { th: อวัยวะดัดแปลงและการปรับตัวของพืช, en: "Plant adaptations: modified organs, light, defense and nutrition" }
summary: อวัยวะดัดแปลงของลำต้น ราก และใบ การรับรู้แสงด้วยไฟโทโครมและการออกดอกตามช่วงแสง การป้องกันตัว และการได้ธาตุอาหารจากปมรากถั่ว ไมคอร์ไรซา พืชกินแมลง และพืชเบียน
difficulty: 6
minutes: 45
prerequisites: [biology.plants.hormones-responses, biology.plants.plant-transport, biology.plants.plant-structure]
encompasses:
  - { id: biology.plants.plant-structure, weight: 0.2 }
  - { id: biology.plants.plant-transport, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: อวัยวะดัดแปลงหกแบบของพืช
    src: modified-organs.svg
    alt: "ภาพหกกรอบ กรอบแรกเป็นเหง้าสีน้ำตาลนอนอยู่ใต้ผิวดิน มีหน่อสีเขียวงอกขึ้นพ้นดินและรากเล็กลงด้านล่าง กรอบที่สองเป็นหัวรูปไข่สีน้ำตาลมีตาเป็นจุดเล็ก ๆ อยู่ใต้ผิวดิน ต่อกับต้นอ่อนเหนือดินด้วยไหลเส้นเล็ก กรอบที่สามเป็นลำต้นตั้งตรงมีกิ่งสั้นแตกออกด้านข้างและมือเกาะสีเขียวม้วนเป็นขด กรอบที่สี่เป็นลำต้นที่มีรากค้ำโค้งลงสู่พื้นจากลำต้น กรอบที่ห้าเป็นรากใต้โคลนแนวนอนที่มีรากหายใจตั้งขึ้นพ้นผิวโคลนหลายแท่ง กรอบที่หกเป็นแผ่นใบที่ปลายยืดเป็นมือพันต่อกับหม้อที่มีฝาปิดด้านบน"
    caption: "อวัยวะที่ทำหน้าที่ใหม่ของพืช เช่น เหง้า หัว มือเกาะ รากค้ำ รากหายใจ และหม้อ (แผนภาพวาดโดยทีมคลังรู้)"
  - type: figure
    title: ช่วงแสงของพืชวันสั้นและพืชวันยาว
    src: photoperiod.svg
    alt: "แถบแสดง 24 ชั่วโมงสามแถว แถวบนมีแสง 10 ชั่วโมงและมืด 14 ชั่วโมง แถวกลางมีแสง 14 ชั่วโมงและมืด 10 ชั่วโมง แถวล่างมีแสง 12 ชั่วโมงและมืด 12 ชั่วโมง มีเส้นประสีแดงที่ตำแหน่ง 12 ชั่วโมงเป็นความยาววันวิกฤติ แถวบนระบุว่าพืชวันสั้นออกดอกและพืชวันยาวไม่ออกดอก แถวกลางระบุว่าพืชวันสั้นไม่ออกดอกและพืชวันยาวออกดอก"
    caption: "พืชวันสั้นและพืชวันยาวตอบสนองต่อความยาววันเทียบกับความยาววันวิกฤติ (แผนภาพวาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ตรวจว่าพืชวันสั้นจะออกดอกหรือไม่
    problem: "พืชวันสั้นชนิดหนึ่งมีช่วงมืดวิกฤติ 12 ชั่วโมง ถ้าช่วงกลางคืนยาว 9 ชั่วโมง พืชจะออกดอกหรือไม่"
    steps:
      - text: "กำหนดเงื่อนไขของพืชวันสั้น ออกดอกเมื่อช่วงมืดต่อเนื่องยาวกว่าหรือเท่ากับช่วงมืดวิกฤติ"
        why: "พืชวันสั้นวัดช่วงมืดที่ยาวพอ ไม่ได้วัดช่วงแสงโดยตรง"
      - text: "เปรียบเทียบ 9 ชั่วโมงกับวิกฤติ 12 ชั่วโมง ซึ่ง $9 < 12$"
      - text: "สรุปว่ากลางคืนสั้นกว่าวิกฤติ พืชจึงไม่ออกดอก"
        why: "กลางคืน 9 ชั่วโมงหมายถึงกลางวัน 15 ชั่วโมงในรอบ 24 ชั่วโมง ซึ่งเป็นสภาพวันยาว พืชวันสั้นจึงไม่ออกดอก"
    answer: "ไม่ออกดอก เพราะช่วงกลางคืนสั้นกว่าวิกฤติ"
  - { type: check, problem: biology.plants.plant-adaptations.p006, prompt: "ลองคิดก่อนอ่านต่อ: พืชวันสั้นจะออกดอกเมื่อใด" }
glossary:
  - { term: อวัยวะดัดแปลง, definition: "อวัยวะของพืชที่เปลี่ยนรูปร่างและหน้าที่ไปจากเดิม เช่น หนามเป็นใบดัดแปลง" }
  - { term: ไฟโทโครม, definition: "โปรตีนรับแสงในพืชที่มีสองรูป รูปหนึ่งเปลี่ยนไปเมื่อได้รับแสงสีแดง และกลับเมื่อได้รับแสงสีแดงไกล" }
  - { term: พืชวันสั้น, definition: "พืชที่ออกดอกเมื่อช่วงกลางคืนยาวกว่าช่วงวิกฤติ" }
  - { term: ปมราก, definition: "โครงสร้างบนรากพืชตระกูลถั่วที่มีแบคทีเรียตรึงไนโตรเจนอาศัยอยู่" }
  - { term: ไมคอร์ไรซา, definition: "ความสัมพันธ์ที่เชื้อราอยู่ร่วมกับรากพืช ช่วยดูดน้ำและแร่ธาตุให้พืช" }
  - { term: พืชเบียน, definition: "พืชที่ดูดน้ำและอาหารจากพืชอาศัยด้วยโครงสร้างที่เรียกว่าฮอสทอเรียม" }
flashcards:
  - { front: "หัวมันฝรั่งเป็นอวัยวะอะไรของพืช", back: "ลำต้นดัดแปลงที่สะสมแป้ง" }
  - { front: "พืชวันสั้นออกดอกเมื่อใด", back: "เมื่อช่วงกลางคืนยาวกว่าช่วงวิกฤติ" }
  - { front: "แบคทีเรียในปมรากถั่วทำอะไร", back: "ตรึงไนโตรเจนจากอากาศให้เป็นแอมโมเนีย" }
  - { front: "ฝอยทองได้อาหารจากพืชอาศัยด้วยอะไร", back: "ฮอสทอเรียมที่เจาะเข้าท่อลำเลียง" }
