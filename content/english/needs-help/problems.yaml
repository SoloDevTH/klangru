problems:
  - id: english.speaking.needs-help.p001
    topics: [english.speaking.needs-help]
    difficulty: 1
    type: mcq
    stem: "เพื่อนถามว่า *Would you like some water?* เราอยากได้ ตอบอย่างไร"
    choices:
      - { id: a, text: "Yes, please.", correct: true, feedback: "ถูก ตอบรับข้อเสนออย่างสุภาพ" }
      - { id: b, text: "Yes, I like.", feedback: "Would you like ...? แปลว่า อยากได้ไหม ตอบรับใช้ Yes, please. (I like ต้องมีกรรมและแปลว่า ชอบ)" }
      - { id: c, text: "You're welcome.", feedback: "You're welcome. ใช้ตอบเมื่อมีคนขอบคุณเรา" }
      - { id: d, text: "No, I don't like.", feedback: "ประโยคนี้ผิดไวยากรณ์ และเราอยากได้น้ำ จึงต้องตอบรับ" }
    hints:
      - "Would you like ...? คือการเสนอให้"
      - "ตอบรับข้อเสนอด้วย Yes + คำที่แปลว่า กรุณา"
    solution: "***Yes, please.*** (ถ้าไม่อยากได้ ตอบ *No, thank you.*)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.needs-help.p002
    topics: [english.speaking.needs-help]
    difficulty: 1
    type: match
    stem: "จับคู่หน้าที่กับประโยค"
    pairs:
      - { left: "ขอความช่วยเหลือ", right: "Can you help me, please?" }
      - { left: "เสนอความช่วยเหลือ", right: "Can I help you?" }
      - { left: "ตอบรับข้อเสนอ", right: "Yes, please." }
      - { left: "ปฏิเสธข้อเสนออย่างสุภาพ", right: "No, thank you." }
    hints:
      - "Can you help me? = เธอช่วยฉันได้ไหม, Can I help you? = ให้ฉันช่วยไหม"
      - "please ใช้ตอบรับ thank you ใช้ได้ทั้งตอบรับและปฏิเสธ แต่ No, thank you. คือปฏิเสธ"
    solution: "ขอ → Can you help me, please? · เสนอ → Can I help you? · ตอบรับ → Yes, please. · ปฏิเสธ → No, thank you."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.needs-help.p003
    topics: [english.speaking.needs-help]
    difficulty: 1
    type: text
    stem: "เติมกริยาคำเดียวที่บอกความต้องการ: *I'm thirsty. I ___ some water.*"
    accepted: ["want", "need"]
    misconceptions:
      - { match: "like", feedback: "I like some water. แปลว่า ชอบ ไม่ได้บอกว่าอยากได้ตอนนี้ ใช้ want หรือ need (หรือ I'd like)" }
      - { match: "wants", feedback: "ประธาน I ไม่เติม s: I want" }
    hints:
      - "หิวน้ำ จึงอยากได้น้ำ"
      - "กริยาที่แปลว่า อยากได้ หรือ ต้องการ"
    solution: "*I'm thirsty. I **want** some water.* หรือ *I **need** some water.* (สุภาพขึ้น: *I'd like some water, please.*)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.needs-help.p004
    topics: [english.speaking.needs-help]
    difficulty: 2
    type: mcq
    stem: "นักท่องเที่ยวยืนหน้าตู้ขายตั๋ว BTS นานและดูไม่รู้จะทำอย่างไร เราอยากเสนอความช่วยเหลือ พูดว่าอะไร"
    choices:
      - { id: a, text: "Excuse me. Can I help you?", correct: true, feedback: "ถูก Can I help you? คือเสนอช่วย" }
      - { id: b, text: "Excuse me. Can you help me?", feedback: "ประโยคนี้คือขอให้เขาช่วยเรา สลับกัน" }
      - { id: c, text: "You help?", feedback: "ไม่ครบประโยค ใช้ Can I help you?" }
      - { id: d, text: "Help me!", feedback: "Help me! คือร้องขอความช่วยเหลือ" }
    hints:
      - "เราเป็นคนช่วย ไม่ใช่คนขอ"
      - "Can I + กริยา + you?"
    solution: "***Excuse me. Can I help you?***"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.needs-help.p005
    topics: [english.speaking.needs-help]
    difficulty: 2
    type: text
    stem: "เสนอช่วยถือกระเป๋า เติมคำเดียว: *___ I carry your bag?*"
    accepted: ["Shall", "Can", "Should", "May"]
    misconceptions:
      - { match: "Do", feedback: "Do I carry ...? เป็นคำถามว่าปกติฉันถือไหม ไม่ใช่การเสนอ ใช้ Shall I ...? หรือ Can I ...?" }
      - { match: "Will", feedback: "Will I carry ...? ไม่ใช่การเสนอ ใช้ Shall I ...? หรือ Can I ...?" }
    hints:
      - "เสนอทำบางอย่างให้ ใช้ ___ I + กริยา?"
      - "คำที่นิยมในอังกฤษขึ้นต้นด้วย Sh"
    solution: "***Shall** I carry your bag?* (หรือ *Can I ...?* / *Should I ...?* / *May I ...?*)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.needs-help.p006
    topics: [english.speaking.needs-help]
    difficulty: 2
    type: mcq
    stem: "พนักงานถามว่า *Would you like some help?* แต่เราหาของเองได้ ปฏิเสธอย่างสุภาพอย่างไร"
    choices:
      - { id: a, text: "No, thanks. I'm OK.", correct: true, feedback: "ถูก ปฏิเสธพร้อมขอบคุณ" }
      - { id: b, text: "No.", feedback: "No. คำเดียวฟังห้วน ควรเติม thank you หรือ thanks" }
      - { id: c, text: "No, please.", feedback: "แปลตรงจาก ไม่เป็นไรครับ ภาษาอังกฤษไม่ใช้แบบนี้ ใช้ No, thank you." }
      - { id: d, text: "I don't want your help.", feedback: "ฟังไม่สุภาพ เหมือนไม่พอใจผู้เสนอ" }
    hints:
      - "ปฏิเสธข้อเสนอต้องขอบคุณด้วย"
      - "No, + คำขอบคุณ + เหตุผลสั้น ๆ"
    solution: "***No, thanks. I'm OK.*** (หรือ *No, thank you.*)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.needs-help.p007
    topics: [english.speaking.needs-help]
    difficulty: 2
    type: order
    stem: "เรียงบทสนทนาในร้านโทรศัพท์มือถือที่ห้างให้ถูกลำดับ"
    items:
      - "Staff: Hello. Can I help you?"
      - "Customer: Yes, please. I need a charger for my phone."
      - "Staff: This one is 290 baht. Would you like it?"
      - "Customer: Yes, please. Here you are."
      - "Staff: Thank you. Would you like a bag?"
      - "Customer: No, thank you. I'm fine."
    hints:
      - "พนักงานเปิดบทสนทนาด้วยการเสนอช่วย"
      - "ลูกค้าบอกความต้องการ → พนักงานเสนอสินค้า → ลูกค้าจ่าย → พนักงานเสนอถุง → ลูกค้าปฏิเสธ"
    solution: "เสนอช่วย → บอกความต้องการ (I need a charger) → เสนอสินค้า → ตอบรับและจ่าย → เสนอถุง → ปฏิเสธสุภาพ (No, thank you.)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.needs-help.p008
    topics: [english.speaking.needs-help]
    difficulty: 3
    type: mcq
    stem: "อ่านแชต Ben ต้องการความช่วยเหลือเรื่องอะไร"
    figure: { src: chat.svg, alt: "ข้อความแชต Ben: Hi Nam! Are you free on Saturday? Ben: I need help with my Thai homework. Could you help me? Nam: Sorry, I can't. I visit my grandma on Saturdays. Nam: But I'm free on Sunday afternoon. Would you like to meet at the library at 2 p.m.? Ben: Yes, please! That would be great. Thanks a lot!" }
    choices:
      - { id: a, text: "การบ้านภาษาไทย", correct: true, feedback: "ถูก I need help with my Thai homework." }
      - { id: b, text: "ไปเยี่ยมคุณยาย", feedback: "Nam เป็นคนไปเยี่ยมคุณยาย ไม่ใช่เรื่องที่ Ben ขอ" }
      - { id: c, text: "หาทางไปห้องสมุด", feedback: "ห้องสมุดเป็นที่นัดเจอ ไม่ใช่เรื่องที่ Ben ขอให้ช่วย" }
      - { id: d, text: "ยืมหนังสือ", feedback: "แชตไม่ได้พูดถึงการยืมหนังสือ" }
    hints:
      - "หาประโยคที่มี I need help with"
      - "คำหลัง with คือเรื่องที่ต้องการให้ช่วย"
    solution: "*I need help with my **Thai homework**.* → การบ้านภาษาไทย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.needs-help.p009
    topics: [english.speaking.needs-help]
    difficulty: 3
    type: mcq
    stem: "อ่านแชต ข้อใดอธิบายสิ่งที่ Nam ทำได้ถูกต้อง"
    figure: { src: chat.svg, alt: "ข้อความแชต Ben: Hi Nam! Are you free on Saturday? Ben: I need help with my Thai homework. Could you help me? Nam: Sorry, I can't. I visit my grandma on Saturdays. Nam: But I'm free on Sunday afternoon. Would you like to meet at the library at 2 p.m.? Ben: Yes, please! That would be great. Thanks a lot!" }
    choices:
      - { id: a, text: "ปฏิเสธวันเสาร์พร้อมเหตุผล แล้วเสนอช่วยวันอาทิตย์บ่ายที่ห้องสมุด", correct: true, feedback: "ถูก ปฏิเสธสุภาพ ให้เหตุผล และเสนอทางเลือก" }
      - { id: b, text: "ตอบรับช่วยวันเสาร์", feedback: "Nam ตอบว่า Sorry, I can't. คือปฏิเสธวันเสาร์" }
      - { id: c, text: "ปฏิเสธโดยไม่ให้เหตุผล", feedback: "Nam ให้เหตุผล: I visit my grandma on Saturdays." }
      - { id: d, text: "ขอให้ Ben ช่วยทำการบ้านให้", feedback: "Ben เป็นฝ่ายขอความช่วยเหลือ ไม่ใช่ Nam" }
    hints:
      - "อ่านข้อความสีเขียวทั้งสองข้อความ"
      - "Sorry, I can't = ปฏิเสธ, Would you like to ...? = เสนอ"
    solution: "Nam **ปฏิเสธวันเสาร์ (Sorry, I can't.) ให้เหตุผล (ไปเยี่ยมคุณยาย) แล้วเสนอเจอกันวันอาทิตย์บ่ายสองที่ห้องสมุด** Ben ตอบรับด้วย Yes, please!"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.needs-help.p010
    topics: [english.speaking.needs-help]
    difficulty: 3
    type: numeric
    stem: "นักท่องเที่ยวต่างชาติล้มที่ถนนข้าวสารและบาดเจ็บ เราพูดว่า *Don't worry. I'll call an ambulance.* ในประเทศไทยต้องโทรหมายเลขใดเพื่อเรียกรถพยาบาล (หน่วยแพทย์ฉุกเฉิน)"
    answer: { value: 1669 }
    misconceptions:
      - { match: 191, feedback: "191 คือหมายเลขตำรวจ เจ็บป่วยฉุกเฉินใช้ 1669" }
      - { match: 911, feedback: "911 เป็นหมายเลขฉุกเฉินของสหรัฐฯ และแคนาดา ในไทยเรียกรถพยาบาลใช้ 1669" }
    hints:
      - "ambulance = รถพยาบาล"
      - "หมายเลขสี่หลักของสถาบันการแพทย์ฉุกเฉินแห่งชาติ"
    solution: "**1669** (เจ็บป่วยฉุกเฉิน) ส่วน 191 ตำรวจ 199 ดับเพลิง 1155 ตำรวจท่องเที่ยว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.needs-help.p011
    topics: [english.speaking.needs-help]
    difficulty: 3
    type: text
    stem: "เติมคำเดียว: *Would you like ___ come to my party?*"
    accepted: ["to"]
    misconceptions:
      - { match: "for", feedback: "หลัง would like ตามด้วย to + กริยา" }
      - { match: "that", feedback: "หลัง would like ตามด้วย to + กริยา" }
    hints:
      - "would like + ? + กริยารูปเดิม"
      - "เหมือน want ___ go"
    solution: "*Would you like **to** come to my party?*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.needs-help.p012
    topics: [english.speaking.needs-help]
    difficulty: 3
    type: mcq
    stem: "หลงทางในเมืองที่ไม่คุ้นเคย อยากขอให้คนแปลกหน้าช่วย ข้อใดสุภาพที่สุด"
    choices:
      - { id: a, text: "Excuse me, could you help me, please? I'm lost.", correct: true, feedback: "ถูก เรียกความสนใจด้วย Excuse me ขอด้วย could ... please และบอกปัญหา" }
      - { id: b, text: "Help me. I'm lost.", feedback: "เป็นคำสั่งห้วน ๆ กับคนแปลกหน้า" }
      - { id: c, text: "Hey you! Where is the station?", feedback: "Hey you! ฟังหยาบกับคนแปลกหน้า" }
      - { id: d, text: "You must help me.", feedback: "must ฟังเหมือนบังคับ ไม่ใช่ขอร้อง" }
    hints:
      - "ขึ้นต้นด้วยคำที่ใช้เรียกความสนใจอย่างสุภาพ"
      - "could + please สุภาพกว่าคำสั่ง"
    solution: "***Excuse me, could you help me, please? I'm lost.***"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.needs-help.p013
    topics: [english.speaking.needs-help]
    difficulty: 4
    type: mcq
    stem: "เพื่อนถามว่า *Can you lend me 100 baht?* แต่เราไม่มีเงินติดตัว ตอบอย่างไรดีที่สุด"
    choices:
      - { id: a, text: "Sorry, I can't. I don't have any money with me.", correct: true, feedback: "ถูก ขอโทษ ปฏิเสธ และให้เหตุผล" }
      - { id: b, text: "No.", feedback: "ห้วนเกินไป ไม่มีคำขอโทษหรือเหตุผล" }
      - { id: c, text: "Yes, please.", feedback: "Yes, please. ใช้ตอบรับข้อเสนอ แต่เพื่อนกำลังขอยืมเงินจากเรา" }
      - { id: d, text: "You're welcome.", feedback: "ใช้ตอบเมื่อมีคนขอบคุณ" }
    hints:
      - "เพื่อนขอ เราช่วยไม่ได้ จึงต้องปฏิเสธคำขอ"
      - "ปฏิเสธสุภาพ = ขอโทษ + I can't + เหตุผล"
    solution: "***Sorry, I can't. I don't have any money with me.***"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.needs-help.p014
    topics: [english.speaking.needs-help]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "ประโยคใดเป็นการ **เสนอ** ความช่วยเหลือ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "Shall I open the window?", correct: true, feedback: "ถูก Shall I ...? เสนอทำให้" }
      - { id: b, text: "Would you like some help?", correct: true, feedback: "ถูก เสนอช่วยอย่างสุภาพ" }
      - { id: c, text: "Let me carry that for you.", correct: true, feedback: "ถูก Let me ... เสนอทำให้" }
      - { id: d, text: "Could you open the window, please?", feedback: "เป็นการขอให้อีกฝ่ายทำ ไม่ใช่เสนอ" }
      - { id: e, text: "I need some help.", feedback: "เป็นการบอกความต้องการของตัวเอง" }
    hints:
      - "การเสนอคือผู้พูดจะเป็นคนทำให้"
      - "ดูว่าประธานที่ทำคือ I (ผู้พูด) หรือ you (ผู้ฟัง)"
    solution: "เสนอ: **Shall I open the window?**, **Would you like some help?**, **Let me carry that for you.** ส่วน Could you ...? เป็นการขอ และ I need some help. เป็นการบอกความต้องการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.needs-help.p015
    topics: [english.speaking.needs-help]
    difficulty: 4
    type: order
    stem: "เรียงข้อความที่ Nam เขียนถึงเพื่อนเพื่อขอความช่วยเหลือ"
    items:
      - "Hi Ploy,"
      - "I need some help with my science project."
      - "Could you come to my house after school tomorrow?"
      - "Thanks!"
      - "Nam"
    hints:
      - "ข้อความเริ่มด้วยการทักทายชื่อผู้รับ และจบด้วยชื่อผู้เขียน"
      - "บอกความต้องการก่อน แล้วจึงขอให้ช่วย"
    solution: "Hi Ploy, → I need some help with my science project. → Could you come to my house after school tomorrow? → Thanks! → Nam"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.needs-help.p016
    topics: [english.speaking.needs-help]
    difficulty: 5
    type: mcq
    stem: "ที่สนามบินสุวรรณภูมิ นักเดินทางชาวต่างชาติหาหนังสือเดินทางไม่เจอ ควรพูดกับเจ้าหน้าที่ว่าอย่างไร"
    choices:
      - { id: a, text: "Excuse me, I can't find my passport. Can you help me, please?", correct: true, feedback: "ถูก บอกปัญหาชัดเจนและขอความช่วยเหลืออย่างสุภาพ" }
      - { id: b, text: "Excuse me, can I help you find my passport?", feedback: "Can I help you ...? คือการเสนอช่วย ใช้กับปัญหาของตัวเองไม่ได้" }
      - { id: c, text: "Passport! You find!", feedback: "ไม่ครบประโยคและฟังเหมือนสั่ง" }
      - { id: d, text: "Would you like my passport?", feedback: "Would you like ...? เป็นการเสนอให้ ไม่ได้บอกว่าหาไม่เจอ" }
    hints:
      - "บอกปัญหาก่อน แล้วจึงขอความช่วยเหลือ"
      - "can't find = หาไม่เจอ"
    solution: "***Excuse me, I can't find my passport. Can you help me, please?***"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.needs-help.p017
    topics: [english.speaking.needs-help]
    difficulty: 5
    type: mcq
