<text x="511.8" y="291.0" text-anchor="start" font-size="12" fill="#c2410c" font-weight="normal">ลูก B</text>
<path d="M 514 230 A 44 44 0 0 0 508.1 208.0" fill="none" stroke="#111" stroke-width="1.5"/>
<text x="528.0" y="218.0" text-anchor="start" font-size="12" fill="#111" font-weight="normal">30°</text>
<text x="360.0" y="340.0" text-anchor="middle" font-size="12" fill="#444" font-weight="normal">มวลเท่ากันและชนแบบยืดหยุ่น: ความเร็วสองลูกหลังชนตั้งฉากกันเสมอ (ลูกที่อยู่นิ่งออกไปทำมุม 60° ใต้แนวเดิม)</text>
<text x="360.0" y="362.0" text-anchor="middle" font-size="12" fill="#666" font-weight="normal">ภาพไม่ได้วาดตามมาตราส่วน</text>
<polyline points="483.9,222.0 491.9,235.9 478.0,243.9" fill="none" stroke="#111" stroke-width="1.2"/>
