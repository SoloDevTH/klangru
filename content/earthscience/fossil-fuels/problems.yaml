problems:
  - id: earthscience.geology.fossil-fuels.p001
    topics: [earthscience.geology.fossil-fuels]
    difficulty: 1
    type: order
    stem: "เรียงขั้นตอนการเกิดแหล่งปิโตรเลียม"
    items:
      - "แพลงก์ตอนและสาหร่ายตายทับถมกับตะกอนเม็ดละเอียดในน้ำที่ขาดออกซิเจน"
      - "ถูกฝังลึก กลายเป็นหินต้นกำเนิดที่มีคีโรเจน"
      - "อุณหภูมิสูงถึงช่วงหน้าต่างน้ำมัน คีโรเจนแตกตัวเป็นน้ำมันและแก๊ส"
      - "น้ำมันและแก๊สเคลื่อนที่ขึ้นผ่านรูพรุนและรอยแตกของหิน"
      - "สะสมในหินกักเก็บใต้หินปิดกั้นในโครงสร้างกักเก็บ"
    hints:
      - "เริ่มจากสิ่งมีชีวิต จบที่แหล่งที่เจาะได้"
      - "ต้องได้ความร้อนก่อน จึงจะเกิดน้ำมันที่เคลื่อนที่ได้"
    solution: "สิ่งมีชีวิตทับถม → ฝังลึกเป็นหินต้นกำเนิด → ความร้อนเปลี่ยนคีโรเจนเป็นน้ำมันและแก๊ส → เคลื่อนที่ขึ้น → สะสมในหินกักเก็บใต้หินปิดกั้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.fossil-fuels.p002
    topics: [earthscience.geology.fossil-fuels]
    difficulty: 1
    type: match
    stem: "จับคู่บทบาทในระบบปิโตรเลียมกับหินที่เหมาะสม"
    pairs:
      - { left: "หินต้นกำเนิด", right: "หินดินดานสีดำที่มีสารอินทรีย์มาก" }
      - { left: "หินกักเก็บ", right: "หินทรายที่มีรูพรุนมากและรูพรุนต่อถึงกัน" }
      - { left: "หินปิดกั้น", right: "หินดินดานเนื้อแน่น ของไหลซึมผ่านไม่ได้" }
      - { left: "โครงสร้างกักเก็บ", right: "ชั้นหินโค้งขึ้นเป็นรูปประทุนคว่ำ" }
    hints:
      - "หินกักเก็บต้องมีที่ว่างให้น้ำมันอยู่"
      - "หินปิดกั้นต้องกันไม่ให้น้ำมันหนีขึ้นไป"
    solution: "หินต้นกำเนิดคือหินดินดานสีดำ หินกักเก็บคือหินทรายรูพรุนมาก หินปิดกั้นคือหินดินดานเนื้อแน่น และโครงสร้างกักเก็บ เช่น ประทุนคว่ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.fossil-fuels.p003
    topics: [earthscience.geology.fossil-fuels]
    difficulty: 2
    type: mcq
    stem: "ถ่านหินชนิดใดมีคาร์บอนมากที่สุดและให้ความร้อนต่อกิโลกรัมสูงที่สุด"
    choices:
      - { id: a, text: "แอนทราไซต์", correct: true }
      - { id: b, text: "ลิกไนต์", feedback: "ลิกไนต์มีคาร์บอนราวร้อยละ 60–70 และมีความชื้นมาก ให้ความร้อนต่ำ เป็นถ่านหินส่วนใหญ่ของไทย" }
      - { id: c, text: "พีต", feedback: "พีตเป็นขั้นแรกสุด ยังเห็นเศษพืชและชื้นมาก มีคาร์บอนน้อยที่สุด" }
      - { id: d, text: "บิทูมินัส", feedback: "บิทูมินัสมีคาร์บอนมาก แต่ยังน้อยกว่าแอนทราไซต์ที่ถูกฝังลึกและร้อนกว่า" }
    hints:
      - "ยิ่งถูกฝังลึกและนาน ยิ่งไล่น้ำและสารระเหยออกได้มาก"
      - "ลำดับคือ พีต → ลิกไนต์ → บิทูมินัส → ?"
    solution: "แอนทราไซต์ผ่านความร้อนและแรงกดมากที่สุด มีคาร์บอนมากกว่าร้อยละ 90 จึงให้ความร้อนสูงที่สุดและควันน้อย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.fossil-fuels.p004
    topics: [earthscience.geology.fossil-fuels]
    difficulty: 2
    type: order
    stem: "ในหินกักเก็บที่ยอดโครงสร้างประทุนคว่ำ เรียงของไหลจากบนลงล่าง"
    items:
      - "แก๊สธรรมชาติ"
      - "น้ำมันดิบ"
      - "น้ำเค็ม"
    hints:
      - "ของไหลแยกชั้นตามความหนาแน่น"
      - "สิ่งที่เบาที่สุดอยู่บนสุด"
    solution: "แก๊สเบาที่สุดอยู่บนสุด น้ำมันหนาแน่นกว่าแก๊สอยู่กลาง และน้ำเค็มหนาแน่นที่สุดอยู่ล่าง หลุมเจาะจึงต้องเจาะให้ถึงชั้นน้ำมันหรือแก๊สแต่ไม่ลึกถึงชั้นน้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.fossil-fuels.p005
    topics: [earthscience.geology.fossil-fuels]
    difficulty: 2
    type: match
    stem: "จับคู่ผลิตภัณฑ์จากการกลั่นน้ำมันดิบกับการใช้ประโยชน์"
    pairs:
      - { left: "แก๊สปิโตรเลียมเหลว (LPG)", right: "แก๊สหุงต้มในครัว" }
      - { left: "น้ำมันก๊าด", right: "เชื้อเพลิงเครื่องบินไอพ่น" }
      - { left: "น้ำมันดีเซล", right: "รถบรรทุกและรถไฟ" }
      - { left: "ยางมะตอย", right: "ราดถนน" }
    hints:
      - "ยางมะตอยเป็นกากที่เหลือ หนืดมาก"
      - "LPG มีโมเลกุลเล็กที่สุด"
    solution: "LPG ใช้หุงต้ม น้ำมันก๊าดใช้เป็นเชื้อเพลิงเครื่องบิน ดีเซลใช้กับรถบรรทุกและรถไฟ และยางมะตอยใช้ราดถนน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.fossil-fuels.p006
    topics: [earthscience.geology.fossil-fuels]
    difficulty: 2
    type: mcq
    stem: "แหล่งแก๊สธรรมชาติในอ่าวไทย เช่น ในแอ่งปัตตานี อยู่ในหินชนิดใดและเกิดในสภาพแวดล้อมแบบใด"
    choices:
      - { id: a, text: "หินตะกอนที่สะสมในแอ่งยุคเทอร์เชียรีซึ่งเกิดจากรอยเลื่อน", correct: true }
      - { id: b, text: "หินแกรนิตที่เย็นตัวจากแมกมา", feedback: "หินแกรนิตเป็นหินฐานใต้แอ่ง ไม่มีสารอินทรีย์ที่จะให้ปิโตรเลียม ปิโตรเลียมอยู่ในหินตะกอนด้านบน" }
      - { id: c, text: "ลาวาบะซอลต์จากภูเขาไฟใต้ทะเล", feedback: "หินภูเขาไฟไม่ได้เกิดจากการทับถมของสารอินทรีย์ จึงไม่ใช่หินต้นกำเนิด" }
      - { id: d, text: "หินแปรที่ถูกความร้อนสูงมาก", feedback: "ความร้อนสูงมากทำลายปิโตรเลียม หินแปรจึงไม่ใช่แหล่งปิโตรเลียมที่ดี" }
    hints:
      - "ปิโตรเลียมเกิดจากสารอินทรีย์ที่ทับถมพร้อมตะกอน"
      - "แอ่งปัตตานีเกิดเมื่อเปลือกโลกยืดออกจนเกิดรอยเลื่อนปกติ"
    solution: "แอ่งปัตตานีเป็นแอ่งตะกอนยุคเทอร์เชียรีที่เกิดจากรอยเลื่อนปกติ ตะกอนจากแม่น้ำ ทะเลสาบ และทะเลตื้นทับถมหนาหลายกิโลเมตร มีทั้งหินต้นกำเนิดและหินกักเก็บ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.fossil-fuels.p007
    topics: [earthscience.geology.fossil-fuels]
    difficulty: 3
    type: numeric
    stem: "เรือสำรวจปิโตรเลียมในอ่าวไทยสำรวจคลื่นไหวสะเทือนแบบสะท้อน คลื่นสะท้อนจากผิวบนของหินกักเก็บกลับมาถึงเครื่องรับใช้เวลา 2.4 วินาที คลื่นเดินทางในชั้นหินด้วยอัตราเร็วเฉลี่ย 2,500 เมตรต่อวินาที หินกักเก็บอยู่ลึกกี่เมตร"
    answer: { value: 3000, tolerance: 10, unit: m }
    misconceptions:
      - { match: 6000, feedback: "6,000 m คือระยะที่คลื่นเดินทางไป–กลับ ความลึกต้องหารด้วย 2" }
      - { match: 1041.7, feedback: "นำอัตราเร็วหารด้วยเวลา ระยะทางต้องเป็นอัตราเร็วคูณเวลา" }
    hints:
      - "เวลาที่วัดได้เป็นเวลาไป–กลับ"
      - "$d = \\dfrac{vt}{2}$"
    solution: "$d = \\dfrac{2{,}500 \\times 2.4}{2} = 3{,}000$ เมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.fossil-fuels.p008
    topics: [earthscience.geology.fossil-fuels]
    difficulty: 3
    type: numeric
    stem: "แอ่งตะกอนแห่งหนึ่งมีอุณหภูมิที่ผิวพื้น 28 °C และอุณหภูมิเพิ่มขึ้น 30 °C ทุกความลึก 1 km (ข้อมูลสมมติ) หินต้นกำเนิดต้องถูกฝังลึกอย่างน้อยกี่กิโลเมตร จึงจะร้อนถึง 120 °C ซึ่งเป็นปลายบนของช่วงหน้าต่างน้ำมัน (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 3.07, tolerance: 0.03, unit: km }
    misconceptions:
      - { match: 4, feedback: "นำ 120 หารด้วย 30 โดยลืมว่าที่ผิวพื้นก็ร้อน 28 °C แล้ว" }
      - { match: 4.93, feedback: "บวก 28 แทนที่จะลบ อุณหภูมิที่ต้องเพิ่มคือ 120 − 28" }
    hints:
      - "อุณหภูมิที่ต้องเพิ่ม $= 120 - 28$ °C"
      - "ความลึก $=$ อุณหภูมิที่ต้องเพิ่ม $\\div 30$"
    solution: "ต้องเพิ่ม $120 - 28 = 92$ °C ความลึก $= 92 \\div 30 \\approx 3.07$ km ถ้าลึกกว่านี้มากจะร้อนเกินช่วงหน้าต่างน้ำมัน ได้แก๊สเป็นส่วนใหญ่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.fossil-fuels.p009
    topics: [earthscience.geology.fossil-fuels]
    difficulty: 3
    type: mcq
    stem: "เปรียบเทียบน้ำมันดีเซลกับแก๊สปิโตรเลียมเหลว (LPG) ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "ดีเซลมีโมเลกุลที่มีคาร์บอนมากกว่า จุดเดือดสูงกว่า และระเหยยากกว่า", correct: true }
      - { id: b, text: "ดีเซลมีจุดเดือดต่ำกว่า จึงออกจากด้านบนของหอกลั่น", feedback: "ส่วนที่ออกด้านบนคือส่วนที่จุดเดือดต่ำ เช่น LPG ดีเซลออกด้านล่างกว่า" }
      - { id: c, text: "LPG หนืดกว่าดีเซล", feedback: "LPG เป็นแก๊สที่อุณหภูมิห้อง ความหนืดน้อยกว่าดีเซลมาก" }
      - { id: d, text: "ทั้งสองมีจุดเดือดเท่ากัน ต่างกันที่สีเท่านั้น", feedback: "การกลั่นลำดับส่วนแยกได้เพราะจุดเดือดต่างกัน" }
    hints:
      - "LPG มีคาร์บอน 3–4 อะตอม ดีเซลมีราว 14–20 อะตอม"
      - "โมเลกุลยิ่งใหญ่ แรงยึดเหนี่ยวระหว่างโมเลกุลยิ่งมาก"
    solution: "ดีเซล (ราว C14–C20) มีโมเลกุลใหญ่กว่า LPG (C3–C4) แรงระหว่างโมเลกุลมากกว่า จุดเดือดสูงกว่า หนืดกว่า และระเหยยากกว่า จึงควบแน่นที่ชั้นล่างของหอกลั่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.fossil-fuels.p010
    topics: [earthscience.geology.fossil-fuels]
    difficulty: 3
    type: numeric
    stem: "เผามีเทน $\\mathrm{CH_4}$ (มวลโมเลกุล 16) อย่างสมบูรณ์ตามสมการ $\\mathrm{CH_4 + 2O_2 \\rightarrow CO_2 + 2H_2O}$ ($\\mathrm{CO_2}$ มวลโมเลกุล 44) เผามีเทน 1 kg ได้แก๊สคาร์บอนไดออกไซด์กี่กิโลกรัม"
    answer: { value: 2.75, tolerance: 0.03, unit: kg }
    misconceptions:
      - { match: 0.364, feedback: "นำ 16 หารด้วย 44 ต้องกลับกัน เพราะ CO₂ หนักกว่ามีเทน" }
      - { match: 1, feedback: "คิดว่ามวลเท่ากัน แต่ CO₂ มีออกซิเจนจากอากาศมารวมด้วย จึงหนักกว่า" }
    hints:
      - "มีเทน 1 โมเลกุลให้ CO₂ 1 โมเลกุล"
      - "อัตราส่วนมวล $= 44 / 16$"
    solution: "มีเทน 16 g ให้ CO₂ 44 g มีเทน 1 kg จึงให้ CO₂ $= 44/16 = 2.75$ kg มวลเพิ่มขึ้นเพราะคาร์บอนรวมกับออกซิเจนจากอากาศ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.fossil-fuels.p011
    topics: [earthscience.geology.fossil-fuels]
    difficulty: 3
    type: mcq
    stem: "ภาพตัดขวางแสดงชั้นหินที่โค้งเป็นรูปประทุนคว่ำ และตำแหน่งหลุมเจาะสำรวจที่เสนอ 4 ตำแหน่ง A–D ถ้าหินดินดานสีดำเป็นหินต้นกำเนิด ควรเจาะตำแหน่งใดเพื่อให้มีโอกาสพบน้ำมันและแก๊สมากที่สุด"
    figure: { src: p-wells.svg, alt: "ภาพตัดขวางชั้นหินโค้งขึ้น จุดสูงสุดของความโค้งอยู่ค่อนไปทางขวาของกลางภาพ จากบนลงล่าง หินตะกอนทั่วไป หินดินดานน้ำซึมผ่านไม่ได้ หินทรายมีรูพรุนมาก หินดินดาน และหินดินดานสีดำมีสารอินทรีย์มาก ด้านบนมีตำแหน่งหลุมเจาะ 4 ตำแหน่ง A อยู่ซ้ายสุดบนส่วนที่ชั้นหินราบ B อยู่บนไหล่ด้านซ้ายของส่วนโค้ง C อยู่ตรงจุดสูงสุดของส่วนโค้ง D อยู่บนไหล่ด้านขวาค่อนไปทางส่วนที่ราบ" }
    choices:
      - { id: a, text: "A", feedback: "บริเวณที่ชั้นหินราบ น้ำมันจะเคลื่อนต่อขึ้นไปตามชั้นหินทราย ไม่สะสมที่นี่" }
      - { id: b, text: "B", feedback: "ไหล่ของส่วนโค้งอาจพบน้ำมันบ้าง แต่ส่วนใหญ่ต่ำกว่าระดับที่น้ำมันสะสม มักพบน้ำ" }
      - { id: c, text: "C", correct: true }
      - { id: d, text: "D", feedback: "D อยู่บนไหล่ลาด หินทรายตรงนั้นอยู่ต่ำกว่ายอดโค้งมาก มีโอกาสพบน้ำมากกว่าน้ำมัน" }
    hints:
      - "น้ำมันและแก๊สเบากว่าน้ำ เคลื่อนขึ้นไปตามหินทรายจนถูกปิดกั้น"
      - "จุดที่หินทรายอยู่สูงที่สุดใต้หินดินดานเนื้อแน่นอยู่ที่ไหน"
    solution: "น้ำมันและแก๊สจากหินดินดานสีดำเคลื่อนขึ้นในหินทรายที่มีรูพรุน แล้วไปสะสมที่ยอดโค้งใต้หินดินดานที่ปิดกั้น ตำแหน่ง C อยู่ตรงยอดโค้งจึงมีโอกาสพบมากที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.fossil-fuels.p012
    topics: [earthscience.geology.fossil-fuels]
    difficulty: 3
