id: health.nutrition.malnutrition-meal-planning
subject: health
title: { th: "ภาวะโภชนาการและการจัดรายการอาหารที่เหมาะสมกับวัย", en: "Malnutrition and age-appropriate meal planning" }
summary: ภาวะทุพโภชนาการทั้งขาดและเกิน โรคจากการขาดวิตามินและแร่ธาตุ ปัญหาที่ตามมา การจัดรายการอาหารให้เหมาะกับวัยอย่างประหยัด และการคำนวณพลังงานและราคาของมื้ออาหาร
difficulty: 4
minutes: 35
prerequisites: [health.nutrition.basics, health.body.bmi-growth]
encompasses:
  - { id: health.nutrition.basics, weight: 0.3 }
  - { id: health.body.bmi-growth, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: รูปแบบของภาวะทุพโภชนาการ
    src: malnutrition-forms.svg
    alt: "แผนผังต้นไม้ ภาวะทุพโภชนาการแยกเป็นสองกิ่ง โภชนาการขาด ได้แก่ ผอม (น้ำหนักน้อยเมื่อเทียบส่วนสูง) มักบอกว่าเพิ่งขาดอาหารหรือป่วย เตี้ย (ส่วนสูงน้อยเมื่อเทียบอายุ) ขาดอาหารเรื้อรังเป็นเวลานาน น้ำหนักน้อยเมื่อเทียบอายุ และขาดวิตามินและแร่ธาตุ เช่น เหล็ก ไอโอดีน วิตามินเอ โภชนาการเกิน ได้แก่ น้ำหนักเกินและโรคอ้วน โรคไม่ติดต่อที่เกี่ยวกับอาหาร เบาหวาน ความดันโลหิตสูง โรคหัวใจ และได้รับวิตามินหรือแร่ธาตุเกิน เช่น กินอาหารเสริมเกินขนาด ที่มา WHO คนคนเดียวหรือครอบครัวเดียวอาจมีทั้งสองแบบพร้อมกัน"
  - type: worked-example
    title: จัดรายการอาหาร 1 วันสำหรับวัยรุ่น
    problem: "จัดรายการอาหาร 1 วันให้ฝ้าย อายุ 15 ปี ตามธงโภชนาการระดับ 2,000 กิโลแคลอรี (ข้าว แป้ง 10 ทัพพี ผัก 5 ทัพพี ผลไม้ 4 ส่วน เนื้อสัตว์ 9 ช้อนกินข้าว นม 1 แก้ว) โดยใช้งบไม่เกิน 120 บาท (ราคาเป็นค่าประมาณสมมติ)"
    steps:
      - text: "แบ่งข้าวเป็นมื้อเช้า 2 กลางวัน 4 เย็น 4 ทัพพี รวม 10 ทัพพี"
      - text: "เช้า: ข้าวต้มหมูสับ 2 ช้อนกินข้าว ใส่ผักกาด 1 ทัพพี (25 บาท)"
      - text: "กลางวัน: ข้าวผัดกะเพราไก่ 4 ช้อนกินข้าว ผักลวก 2 ทัพพี และส้ม 1 ส่วน (45 บาท)"
      - text: "เย็น (ทำที่บ้าน): ปลาทูนึ่ง 3 ช้อนกินข้าว แกงจืดผัก 2 ทัพพี และมะละกอ 2 ส่วน (38 บาท)"
        why: "อาหารที่ทำเองที่บ้านและผักผลไม้ตามฤดูกาลช่วยให้ประหยัด"
      - text: "ว่าง: นมจืด 1 กล่อง และกล้วย 1 ส่วน (12 บาท)"
      - text: "ตรวจ: เนื้อสัตว์ $2 + 4 + 3 = 9$ ผัก $1 + 2 + 2 = 5$ ผลไม้ $1 + 2 + 1 = 4$ นม 1 ครบตามธงโภชนาการ ราคา $25 + 45 + 38 + 12 = 120$ บาท พอดีงบ"
    answer: "รายการนี้ครบทุกหมู่ตามระดับ 2,000 กิโลแคลอรี และใช้เงิน 120 บาท"
  - { type: check, problem: health.nutrition.malnutrition-meal-planning.p003, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: worked-example
    title: ขาดและเกินในบ้านเดียวกัน
    problem: "บ้านของภูมิ: ภูมิกินบะหมี่กึ่งสำเร็จรูปเป็นมื้อเย็นแทบทุกวัน น้องสาวไม่กินผักและดื่มน้ำหวานวันละ 3 แก้ว ยายฟันไม่ดีจึงกินแต่ข้าวต้มกับผักดอง วิเคราะห์ปัญหาและเสนอการปรับ"
    steps:
      - text: "ภูมิ: ได้แป้งและโซเดียมมาก แต่โปรตีน ผัก และผลไม้น้อย เสี่ยงขาดโปรตีน วิตามิน และแร่ธาตุ"
      - text: "น้องสาว: ได้น้ำตาลเกิน และขาดวิตามิน แร่ธาตุ และใยอาหาร จึงอาจมีทั้งขาดและเกินพร้อมกัน"
        why: "การได้พลังงานเกินไม่ได้แปลว่าได้สารอาหารครบ"
      - text: "ยาย: ได้โปรตีนน้อยและเค็มเกิน เสี่ยงกล้ามเนื้อลีบและความดันโลหิตสูง"
      - text: "ปรับทั้งบ้าน: ทำกับข้าวกินร่วมกัน เพิ่มไข่ ปลา เต้าหู้ ผักต้มนิ่ม และผลไม้ตามฤดูกาล เปลี่ยนน้ำหวานเป็นน้ำเปล่า และลดผักดอง"
    answer: "บ้านเดียวกันมีทั้งขาดและเกิน แก้ได้ด้วยอาหารครบหมู่ที่ปรับให้เหมาะกับแต่ละวัย"
  - { type: check, problem: health.nutrition.malnutrition-meal-planning.p009 }
glossary:
  - { term: ภาวะโภชนาการ, definition: "สภาพของร่างกายที่เป็นผลจากอาหารที่กินและการใช้สารอาหาร" }
  - { term: ภาวะทุพโภชนาการ, definition: "ภาวะที่ได้สารอาหารไม่เหมาะสม มีทั้งแบบขาด (ผอม เตี้ย ขาดวิตามินแร่ธาตุ) และแบบเกิน (น้ำหนักเกิน โรคอ้วน)" }
  - { term: เตี้ย (แคระแกร็น), definition: "ส่วนสูงน้อยเมื่อเทียบกับอายุ มักเกิดจากการขาดอาหารเรื้อรังเป็นเวลานาน" }
  - { term: โลหิตจาง, definition: "ภาวะที่เลือดมีเม็ดเลือดแดงหรือฮีโมโกลบินน้อย ทำให้เหนื่อยง่ายและหน้าซีด สาเหตุหนึ่งคือขาดธาตุเหล็ก" }
flashcards:
  - { front: "ขาดเหล็ก / ไอโอดีน / วิตามินเอ", back: "โลหิตจาง / คอพอก / มองไม่เห็นในที่มืด" }
  - { front: "ขาดวิตามินบี 1 / วิตามินซี", back: "เหน็บชา / เลือดออกตามไรฟัน" }
  - { front: "ระดับพลังงานตามธงโภชนาการ", back: "1,600 เด็ก 6–13 ปี หญิงวัยทำงาน ผู้สูงอายุ / 2,000 วัยรุ่น 14–25 ปี / 2,400 ผู้ใช้แรงมาก" }
  - { front: "เด็กกังวลเรื่องน้ำหนัก", back: "ไม่อดอาหาร ไม่ใช้ยาลดน้ำหนักเอง ปรึกษาแพทย์หรือนักโภชนาการ ปรับพฤติกรรมทั้งครอบครัว" }
