<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="sans-serif" font-size="15">
  <title>การเผยแพร่และบอกรับหัวข้อผ่านตัวกลาง MQTT</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15211e"/></marker></defs>
  <rect x="0" y="0" width="680" height="320" fill="#ffffff"/>
  <text x="340" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#15211e">MQTT: อุปกรณ์เผยแพร่ไปยังหัวข้อ ตัวกลางส่งต่อให้ผู้บอกรับ</text>
  <rect x="20" y="130" width="150" height="70" rx="8" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="95.0" y="161.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#15211e">เซนเซอร์อุณหภูมิ</text>
  <text x="95.0" y="179.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#15211e">(ผู้เผยแพร่)</text>
  <rect x="265" y="130" width="150" height="70" rx="8" fill="#f6e7df" stroke="#15211e" stroke-width="2"/>
  <text x="340.0" y="161.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#15211e">ตัวกลาง</text>
  <text x="340.0" y="179.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#15211e">(broker)</text>
  <rect x="510" y="80" width="150" height="60" rx="8" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="585.0" y="106.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#15211e">แอปมือถือ</text>
  <text x="585.0" y="124.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#15211e">(ผู้บอกรับ)</text>
  <rect x="510" y="200" width="150" height="60" rx="8" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="585.0" y="226.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#15211e">จอแสดงผลในห้อง</text>
  <text x="585.0" y="244.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#15211e">(ผู้บอกรับ)</text>
  <line x1="170" y1="165" x2="263" y2="165" stroke="#15211e" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="217" y="156" text-anchor="middle" font-size="12" font-weight="normal" fill="#4a5a55">เผยแพร่</text>
  <line x1="415" y1="150" x2="508" y2="110" stroke="#15211e" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="440" y="118" text-anchor="middle" font-size="12" font-weight="normal" fill="#4a5a55">ส่งต่อ</text>
  <line x1="415" y1="180" x2="508" y2="225" stroke="#15211e" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="440" y="214" text-anchor="middle" font-size="12" font-weight="normal" fill="#4a5a55">ส่งต่อ</text>
  <text x="340" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#b5562b">หัวข้อ: home/room1/temp</text>
  <text x="340" y="276" text-anchor="middle" font-size="13" font-weight="normal" fill="#4a5a55">ผู้เผยแพร่ไม่ต้องรู้จักผู้บอกรับ และตัวกลางส่งต่อเฉพาะหัวข้อที่ผู้บอกรับสมัคร</text>
</svg>
