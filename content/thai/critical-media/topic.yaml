id: thai.listening.critical-media
subject: thai
title: { th: การฟังและดูอย่างมีวิจารณญาณ, en: "Critical listening and viewing" }
summary: แยกข้อเท็จจริงกับข้อคิดเห็นจากสิ่งที่ฟังและดู ตรวจความน่าเชื่อถือของข่าว 4 ขั้น รู้ทันข่าวลวงและกลวิธีโน้มน้าวในโฆษณา วิเคราะห์การใช้ภาษา และเลือกสื่ออย่างมีวิจารณญาณเพื่อนำไปใช้ในชีวิต
difficulty: 5
minutes: 35
prerequisites: [thai.listening.main-points, thai.reading.fact-opinion]
encompasses:
  - { id: thai.reading.fact-opinion, weight: 0.3 }
  - { id: thai.listening.main-points, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: check-steps.svg
    alt: "ก่อนเชื่อและก่อนแชร์ ตรวจ 4 ขั้นเรียงด้วยลูกศร 1 หยุด อย่าเพิ่งเชื่อ อย่าเพิ่งแชร์ 2 ดูแหล่ง ใครผลิต มีชื่อ มีวันที่ไหม 3 หาแหล่งอื่น สื่อที่เชื่อถือได้รายงานตรงกันไหม 4 ย้อนหาต้นฉบับ งานวิจัย คำพูดเดิม ถูกตัดตอนไหม"
    caption: "หยุด ดูแหล่ง หาแหล่งอื่น ย้อนหาต้นฉบับ"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: ตรวจโพสต์ที่ถูกแชร์ในกลุ่มแชต
    problem: "โพสต์สมมติบอกว่า ดื่มน้ำมะนาวผสมโซดาทุกเช้ารักษาได้ 100 โรค ผู้เชี่ยวชาญต่างประเทศยืนยันแล้ว แชร์ต่อก่อนถูกลบ (ดูภาพในโจทย์ข้อ 3) ตรวจตาม 4 ขั้น"
    steps:
      - text: "หยุด: โพสต์เร่งให้แชร์และทำให้ตื่นเต้น จึงยังไม่แชร์"
        why: "ข่าวลวงมักเร่งให้ตัดสินใจก่อนคิด"
      - text: "ดูแหล่ง: เพจไม่บอกผู้รับผิดชอบ ไม่มีวันที่ อ้างผู้เชี่ยวชาญโดยไม่บอกชื่อ"
      - text: "หาแหล่งอื่น: ค้นจากหน่วยงานสาธารณสุขหรือสื่อที่เชื่อถือได้ ไม่พบการยืนยันว่ารักษาได้ 100 โรค"
      - text: "ย้อนหาต้นฉบับ: ไม่มีงานวิจัยหรือชื่อผู้เชี่ยวชาญให้ตรวจ คำกล่าวอ้าง 100% เกินจริง"
    answer: "โพสต์นี้ไม่น่าเชื่อถือ ไม่ควรแชร์ ถ้ามีปัญหาสุขภาพควรปรึกษาแพทย์หรือเภสัชกร"
  - { type: check, problem: thai.listening.critical-media.p003, prompt: "ขั้นที่ 1 ของการตรวจคืออะไร" }
  - type: worked-example
    title: วิเคราะห์โฆษณาด้วยตัวเลข
    problem: "โฆษณารองเท้าสมมติเขียนว่า ผู้ใช้ 9 ใน 10 คนพอใจ และมีหมายเหตุว่าสำรวจผู้ซื้อ 10 คนที่ร้านสาขาแรก วิเคราะห์ความน่าเชื่อถือ"
    steps:
      - text: "คำนวณ: 9 ÷ 10 × 100 = ร้อยละ 90 ตัวเลขนี้ถูกต้องทางคณิตศาสตร์"
      - text: "ถามว่าสำรวจกี่คน: 10 คน น้อยมาก"
      - text: "ถามว่าสำรวจใคร: ผู้ที่ซื้อแล้ว ที่ร้านเดียว ซึ่งมักชอบสินค้าอยู่แล้ว"
        why: "กลุ่มตัวอย่างที่เลือกมาเฉพาะทำให้ผลเอนเอียง"
      - text: "สรุป: ตัวเลขถูก แต่ใช้แทนผู้ใช้ทั่วประเทศไม่ได้"
    answer: "ร้อยละ 90 มาจากคนเพียง 10 คนที่ร้านเดียว จึงยังเชื่อถือได้น้อยสำหรับข้อสรุปว่าผู้ใช้ส่วนใหญ่พอใจ"
  - { type: check, problem: thai.listening.critical-media.p006, prompt: "อ่านข้อความตัวเล็กใต้ดอกจัน" }
glossary:
  - { term: วิจารณญาณ, definition: "ปัญญาที่ใช้ไตร่ตรองและตัดสินอย่างมีเหตุผลว่าสิ่งใดน่าเชื่อหรือควรทำ" }
  - { term: ข่าวลวง, definition: "ข้อมูลที่ไม่จริงแต่ทำให้ดูเหมือนข่าว (ศัพท์บัญญัติของ fake news ใช้ได้ทั้ง ข่าวลวง และ ข่าวปลอม)" }
  - { term: ข้อมูลข่าวสารคลาดเคลื่อน, definition: "ศัพท์บัญญัติของ misinformation ข้อมูลผิดที่ส่งต่อโดยไม่รู้" }
  - { term: ข้อมูลข่าวสารผิดพลาด, definition: "ศัพท์บัญญัติของ disinformation ข้อมูลผิดที่จงใจสร้างเพื่อหลอก" }
  - { term: สื่อโน้มน้าวใจ, definition: "สื่อที่ต้องการให้ผู้รับเชื่อ ซื้อ หรือทำบางอย่าง เช่น โฆษณา คลิปรณรงค์" }
flashcards:
  - { front: "ตรวจข่าว 4 ขั้น", back: "หยุด ดูแหล่ง หาแหล่งอื่น ย้อนหาต้นฉบับ" }
  - { front: "9 ใน 10 คนพอใจ ต้องถามอะไร", back: "สำรวจกี่คน ใครสำรวจ สำรวจใคร" }
  - { front: "จาก 150 เป็น 300 เพิ่มร้อยละเท่าไร", back: "ร้อยละ 100 (เพิ่มเป็น 2 เท่า)" }
  - { front: "สัญญาณข่าวลวง", back: "เร่งให้แชร์ ไม่มีแหล่งหรือวันที่ อ้างเกินจริง อ้างผู้เชี่ยวชาญไม่ระบุชื่อ" }
