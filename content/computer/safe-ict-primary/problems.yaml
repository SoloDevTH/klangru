problems:
  - id: computer.safety.safe-ict-primary.p001
    topics: [computer.safety.safe-ict-primary]
    difficulty: 1
    type: mcq
    stem: "ข้อใด **ไม่** ควรทำในห้องคอมพิวเตอร์ของโรงเรียน"
    choices:
      - { id: a, text: "วางแก้วน้ำหวานไว้ข้างแป้นพิมพ์", correct: true }
      - { id: b, text: "ล้างมือให้สะอาดและแห้งก่อนใช้เครื่อง", feedback: "เป็นสิ่งที่ควรทำ มือที่สะอาดและแห้งไม่ทำให้แป้นพิมพ์สกปรกหรือเสียหาย" }
      - { id: c, text: "ใช้เครื่องตามที่ครูกำหนด", feedback: "เป็นข้อตกลงที่ดี ทุกคนได้ใช้เครื่องอย่างทั่วถึง" }
      - { id: d, text: "ออกจากระบบเมื่อใช้งานเสร็จ", feedback: "เป็นสิ่งที่ควรทำ เพื่อไม่ให้คนอื่นเข้าบัญชีของเราได้" }
    hints:
      - "ข้อใดอาจทำให้เครื่องเสียหาย"
      - "ของเหลวหกใส่อุปกรณ์ไฟฟ้าเกิดอะไรขึ้น"
    solution: "น้ำหวานอาจหกใส่แป้นพิมพ์ทำให้เครื่องเสียและเหนียว ข้อตกลงจึงห้ามนำอาหารและเครื่องดื่มไว้ใกล้เครื่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.safety.safe-ict-primary.p002
    topics: [computer.safety.safe-ict-primary]
    difficulty: 1
    type: mcq
    stem: "รหัสผ่านบัญชีเรียนออนไลน์ของเรา บอกใครได้บ้าง"
    choices:
      - { id: a, text: "บอกได้เฉพาะพ่อแม่หรือผู้ปกครอง", correct: true }
      - { id: b, text: "บอกเพื่อนสนิทได้ เพราะไว้ใจกัน", feedback: "เพื่อนอาจเผลอบอกต่อ หรือเข้าบัญชีของเราโดยไม่ตั้งใจ รหัสผ่านต้องเก็บเป็นความลับ" }
      - { id: c, text: "บอกคนที่ทักมาว่าเป็นแอดมินของเกม", feedback: "แอดมินจริงไม่ขอรหัสผ่าน คนที่ขอมักเป็นมิจฉาชีพ" }
      - { id: d, text: "โพสต์ไว้ในกลุ่มห้องเผื่อลืม", feedback: "ทุกคนในกลุ่มจะเห็นรหัสผ่าน และเข้าบัญชีของเราได้" }
    hints:
      - "รหัสผ่านเหมือนกุญแจบ้าน เราให้กุญแจใครได้บ้าง"
      - "คนที่ดูแลความปลอดภัยของเราคือใคร"
    solution: "รหัสผ่านต้องเก็บเป็นความลับ บอกได้เฉพาะพ่อแม่หรือผู้ปกครองที่ดูแลเรา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.safety.safe-ict-primary.p003
    topics: [computer.safety.safe-ict-primary]
    difficulty: 1
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นข้อมูลส่วนตัวที่ **ไม่ควร** บอกคนที่รู้จักทางออนไลน์ (เลือกได้หลายข้อ)"
    choices:
      - { id: a, text: "ที่อยู่บ้าน", correct: true, feedback: "บอกได้ว่าเราอยู่ที่ไหน" }
      - { id: b, text: "ชื่อโรงเรียนและห้องเรียน", correct: true, feedback: "บอกได้ว่าเราอยู่ที่ไหนในเวลากลางวัน" }
      - { id: c, text: "เบอร์โทรศัพท์ของพ่อแม่", correct: true, feedback: "ใช้โทรหลอกลวงครอบครัวของเราได้" }
      - { id: d, text: "สีที่ชอบ", feedback: "สีที่ชอบไม่ได้บอกว่าเราคือใครหรืออยู่ที่ไหน จึงไม่ใช่ข้อมูลส่วนตัวที่อันตราย" }
    hints:
      - "ข้อมูลส่วนตัวคือข้อมูลที่ทำให้คนแปลกหน้าหาตัวเราเจอ หรือติดต่อเราได้"
      - "ข้อใดใช้ตามหาตัวเราหรือครอบครัวได้"
    solution: "ที่อยู่ ชื่อโรงเรียน และเบอร์โทรศัพท์ใช้ตามหาหรือติดต่อเราได้ จึงเป็นข้อมูลส่วนตัว ส่วนสีที่ชอบไม่ได้ระบุตัวเรา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.safety.safe-ict-primary.p004
    topics: [computer.safety.safe-ict-primary]
    difficulty: 2
    type: mcq
    stem: "รหัสผ่านข้อใดปลอดภัยที่สุด"
    choices:
      - { id: a, text: "`Kite?Bean8Lamp`", correct: true }
      - { id: b, text: "`password`", feedback: "เป็นคำที่คนใช้มากที่สุดคำหนึ่ง โปรแกรมเดารหัสลองคำนี้ก่อนเสมอ" }
      - { id: c, text: "`somchai2558`", feedback: "ชื่อกับปีเกิดเป็นข้อมูลส่วนตัว คนรู้จักเดาได้ง่าย" }
      - { id: d, text: "`111111`", feedback: "ตัวเลขซ้ำกันสั้น ๆ เดาได้ในไม่กี่ครั้ง" }
    hints:
      - "ใช้เกณฑ์ ยาว ผสม และเดายาก"
      - "ข้อใดมีทั้งตัวพิมพ์ใหญ่ เล็ก ตัวเลข และสัญลักษณ์ และไม่เกี่ยวกับตัวเรา"
    solution: "`Kite?Bean8Lamp` ยาว 14 ตัว ผสมตัวพิมพ์ใหญ่ ตัวพิมพ์เล็ก ตัวเลข และสัญลักษณ์ และไม่ใช่ข้อมูลส่วนตัว จึงปลอดภัยที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.safety.safe-ict-primary.p005
    topics: [computer.safety.safe-ict-primary]
    difficulty: 2
    type: order
    stem: "หมดคาบคอมพิวเตอร์แล้ว เรียงสิ่งที่ต้องทำก่อนลุกจากเครื่อง"
    items:
      - "บันทึกงานที่ทำ"
      - "ปิดโปรแกรมที่เปิดอยู่"
      - "ออกจากระบบบัญชีของตนเอง"
      - "สั่งปิดเครื่องด้วยคำสั่งปิดเครื่อง"
      - "เก็บหูฟังและดันเก้าอี้เข้าที่"
    hints:
      - "ถ้าปิดโปรแกรมก่อนบันทึก งานจะเป็นอย่างไร"
      - "งานบนจอต้องจบก่อนปิดเครื่อง แล้วจึงเก็บของรอบตัว"
    solution: "บันทึกงาน → ปิดโปรแกรม → ออกจากระบบ → ปิดเครื่อง → เก็บอุปกรณ์ ถ้าปิดเครื่องหรือโปรแกรมก่อนบันทึก งานจะหาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.safety.safe-ict-primary.p006
    topics: [computer.safety.safe-ict-primary]
    difficulty: 2
    type: mcq
    stem: "โทรศัพท์ของแม่ได้รับข้อความตามภาพ ควรทำอย่างไร"
    figure:
      src: prize-sms.svg
      alt: "หน้าจอโทรศัพท์มีข้อความจากเบอร์ที่ไม่รู้จัก เขียนว่า ยินดีด้วย เบอร์ของคุณได้รับรางวัลโทรศัพท์มือถือ 1 เครื่อง กรอกชื่อ ที่อยู่ และรหัสผ่าน เพื่อรับรางวัลภายใน 1 ชั่วโมง มิฉะนั้นสิทธิ์จะถูกยกเลิก แล้วมีลิงก์ให้กด"
    choices:
      - { id: a, text: "ไม่กดลิงก์ ไม่กรอกข้อมูล และบอกแม่ว่าน่าจะเป็นข้อความหลอกลวง", correct: true }
      - { id: b, text: "รีบกดลิงก์ก่อนหมดเวลา 1 ชั่วโมง", feedback: "การเร่งให้รีบทำคือกลลวงที่พบบ่อย เพื่อไม่ให้เรามีเวลาคิดหรือถามใคร" }
      - { id: c, text: "กดลิงก์ดูก่อน แต่กรอกแค่ชื่อกับที่อยู่", feedback: "ที่อยู่ก็เป็นข้อมูลส่วนตัว และการกดลิงก์แปลกอาจพาไปหน้าเว็บอันตราย" }
      - { id: d, text: "ส่งต่อให้เพื่อนในกลุ่มห้องเผื่อได้รางวัลด้วย", feedback: "การส่งต่อทำให้คนอื่นเสี่ยงถูกหลอกไปด้วย" }
    hints:
      - "เราไม่ได้ร่วมชิงรางวัลอะไรเลย ทำไมจึงได้รางวัล"
      - "ดูว่าข้อความขอข้อมูลอะไร และเร่งให้รีบทำหรือไม่"
    solution: "ข้อความนี้มีสัญญาณหลอกลวงครบ: ได้รางวัลโดยไม่ได้ร่วมชิง ขอรหัสผ่าน และเร่งเวลา จึงต้องไม่กดลิงก์ ไม่กรอกข้อมูล และบอกผู้ใหญ่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.safety.safe-ict-primary.p007
    topics: [computer.safety.safe-ict-primary]
    difficulty: 2
    type: mcq
    stem: "ปลาอยากโพสต์รูปถ่ายกับเพื่อนตอนไปเที่ยวทะเลลงโซเชียลมีเดีย ควรทำอย่างไรก่อน"
    choices:
      - { id: a, text: "ถามเพื่อนทุกคนในรูปว่ายินดีให้โพสต์หรือไม่", correct: true }
      - { id: b, text: "โพสต์ได้เลย เพราะเป็นคนถ่ายเอง", feedback: "แม้เราเป็นคนถ่าย แต่เพื่อนในรูปมีสิทธิ์ในความเป็นส่วนตัวของเขา" }
      - { id: c, text: "โพสต์แล้วแท็กชื่อจริงและโรงเรียนของเพื่อนทุกคน", feedback: "เป็นการเปิดเผยข้อมูลส่วนตัวของเพื่อนโดยไม่ได้รับอนุญาต" }
      - { id: d, text: "เลือกรูปที่เพื่อนทำหน้าตลกที่สุด", feedback: "รูปที่เจ้าตัวไม่อยากให้คนเห็นอาจทำให้เขาอับอาย ต้องถามก่อน" }
    hints:
      - "เพื่อนในรูปมีสิทธิ์อะไรบ้าง"
      - "เคารพสิทธิผู้อื่นทำได้อย่างไรก่อนโพสต์"
    solution: "ทุกคนมีสิทธิ์ในความเป็นส่วนตัว ก่อนโพสต์รูปที่มีคนอื่นต้องขออนุญาตเจ้าตัวก่อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.safety.safe-ict-primary.p008
    topics: [computer.safety.safe-ict-primary]
    difficulty: 3
    type: numeric
    stem: "รหัสปลดล็อกแท็บเล็ตเป็นตัวเลข 4 หลัก แต่ละหลักเป็น 0 ถึง 9 ได้ มีรหัสที่ต่างกันได้ทั้งหมดกี่แบบ (นับ 0000 ด้วย)"
    answer: { value: 10000, unit: แบบ }
    hints:
      - "หลักแรกเลือกได้ 10 แบบ หลักที่สองก็เลือกได้ 10 แบบ"
      - "นำจำนวนแบบของแต่ละหลักมาคูณกัน"
    misconceptions:
      - { match: 40, feedback: "40 ได้จาก 4 × 10 แต่ทุกแบบของหลักแรกจับคู่กับทุกแบบของหลักถัดไปได้ ต้องคูณ 10 × 10 × 10 × 10" }
      - { match: 9999, feedback: "9999 คือรหัสที่มากที่สุด แต่รหัสเริ่มนับที่ 0000 จึงมีมากกว่านั้นหนึ่งแบบ" }
    solution: "10 × 10 × 10 × 10 = 10,000 แบบ (ตั้งแต่ 0000 ถึง 9999)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.safety.safe-ict-primary.p009
    topics: [computer.safety.safe-ict-primary]
    difficulty: 3
    type: mcq
    stem: "บีใช้คอมพิวเตอร์ในห้องสมุดเข้าบัญชีอีเมล แล้วปิดหน้าต่างเว็บไปโดยไม่ได้ออกจากระบบ อาจเกิดอะไรขึ้น"
    choices:
      - { id: a, text: "คนที่ใช้เครื่องต่อเปิดเว็บเดิมแล้วเข้าบัญชีของบีได้ทันที", correct: true }
      - { id: b, text: "ไม่เกิดอะไร เพราะปิดหน้าต่างแล้วบัญชีปิดเอง", feedback: "หลายเว็บจำการเข้าระบบไว้ แม้ปิดหน้าต่างแล้วก็ยังเข้าต่อได้ ต้องกดออกจากระบบ" }
      - { id: c, text: "คอมพิวเตอร์จะเสีย", feedback: "การไม่ออกจากระบบไม่ทำให้เครื่องเสีย แต่ทำให้บัญชีไม่ปลอดภัย" }
      - { id: d, text: "อีเมลของบีจะถูกลบทั้งหมดทันที", feedback: "อีเมลไม่หายเอง แต่คนอื่นอาจเข้าไปอ่าน ลบ หรือส่งข้อความแทนบีได้" }
    hints:
      - "ปิดหน้าต่างกับออกจากระบบเหมือนกันหรือไม่"
      - "เครื่องส่วนรวมมีคนอื่นใช้ต่อจากเรา"
    solution: "การปิดหน้าต่างไม่ได้ออกจากระบบ คนที่ใช้ต่ออาจเข้าบัญชีของบีได้ จึงต้องกดออกจากระบบทุกครั้งในเครื่องส่วนรวม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.safety.safe-ict-primary.p010
    topics: [computer.safety.safe-ict-primary]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ในกลุ่มแชทของห้อง พฤติกรรมใด **ไม่เหมาะสม** (เลือกได้หลายข้อ)"
    choices:
      - { id: a, text: "ส่งสติกเกอร์ล้อรูปร่างหน้าตาของเพื่อน", correct: true, feedback: "การล้อปมด้อยทำให้เพื่อนเสียใจ เป็นการกลั่นแกล้งทางออนไลน์" }
      - { id: b, text: "ส่งต่อรูปเพื่อนที่ถูกตัดต่อให้ดูตลก", correct: true, feedback: "ทำให้เพื่อนอับอายและละเมิดสิทธิของเจ้าของรูป" }
      - { id: c, text: "แจ้งการบ้านที่ครูสั่งให้เพื่อนที่ขาดเรียน", feedback: "เป็นการใช้แชทช่วยเหลือกัน เหมาะสมดี" }
      - { id: d, text: "ชมผลงานของเพื่อนที่ได้รางวัล", feedback: "เป็นการให้กำลังใจอย่างสุภาพ เหมาะสมดี" }
    hints:
      - "ถ้าเราเป็นเพื่อนคนนั้น เราจะรู้สึกอย่างไร"
      - "พฤติกรรมใดทำให้คนอื่นอับอายหรือเสียใจ"
    solution: "การล้อรูปร่างหน้าตาและการส่งต่อรูปตัดต่อทำให้เพื่อนเสียใจและอับอาย ไม่เหมาะสม ส่วนการแจ้งการบ้านและการชมเพื่อนเป็นมารยาทที่ดี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.safety.safe-ict-primary.p011
    topics: [computer.safety.safe-ict-primary]
    difficulty: 3
    type: mcq
    stem: "กลุ่มของมิ้นท์ทำรายงานในเอกสารออนไลน์ที่แก้ไขร่วมกัน มิ้นท์เห็นว่าส่วนที่เพื่อนเขียนมีข้อมูลผิด ควรทำอย่างไร"
    choices:
      - { id: a, text: "เขียนความคิดเห็นไว้ตรงจุดนั้น บอกว่าผิดตรงไหนและแนะนำแหล่งที่ถูก", correct: true }
      - { id: b, text: "ลบส่วนของเพื่อนทิ้งแล้วเขียนใหม่เองโดยไม่บอก", feedback: "เป็นการไม่เคารพงานของเพื่อน ควรแจ้งเจ้าของส่วนนั้นก่อน" }
      - { id: c, text: "ไปบ่นในกลุ่มแชทอื่นว่าเพื่อนทำงานไม่ดี", feedback: "เป็นการนินทาทางออนไลน์ ไม่ช่วยแก้ปัญหาและทำให้เพื่อนเสียใจ" }
