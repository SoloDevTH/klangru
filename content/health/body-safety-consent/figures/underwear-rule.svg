<text x="320.0" y="34.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">ส่วนที่ชุดว่ายน้ำหรือชุดชั้นในปิด คือส่วนที่เป็นส่วนตัว</text>
<text x="320.0" y="378.0" font-size="15" text-anchor="middle" fill="#111">ไม่มีใครควรแตะ มอง หรือถ่ายรูปส่วนที่เป็นส่วนตัวของเรา</text>
<text x="320.0" y="402.0" font-size="15" text-anchor="middle" fill="#111">และเราก็ไม่แตะส่วนที่เป็นส่วนตัวของคนอื่น</text>
