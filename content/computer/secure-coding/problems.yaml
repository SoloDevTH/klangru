  - id: computer.security.secure-coding.p014
    topics: [computer.security.secure-coding]
    difficulty: 4
    type: mcq
    stem: |
      ข้อใดเป็นจุดประสงค์ที่สำคัญของการทำแบบจำลองภัยคุกคาม (threat model)
    choices:
      - { id: a, text: 'ระบุทรัพย์สิน ผู้ที่อาจโจมตี และจุดเข้าถึงของระบบ ก่อนเลือกการป้องกัน', correct: true }
      - { id: b, text: 'เขียนเอกสารให้ยาวเพื่อส่งลูกค้า', feedback: "ความยาวของเอกสารไม่ใช่จุดประสงค์ของการทำแบบจำลอง" }
      - { id: c, text: 'วัดเวลาตอบสนองของเซิร์ฟเวอร์', feedback: "นั่นคือการทดสอบประสิทธิภาพ" }
      - { id: d, text: 'ลดจำนวนบรรทัดของโค้ด', feedback: "การลดโค้ดเป็นเรื่องความเรียบง่าย ไม่ใช่เป้าหมายของแบบจำลองภัยคุกคาม" }
    hints:
      - "แบบจำลองภัยคุกคามช่วยให้เห็นความเสี่ยงก่อนลงมือเขียนการป้องกัน"
      - "คำถามหลักคือมีอะไรให้ปกป้อง ใครอาจมาทำร้าย และผ่านทางไหน"
    solution: "แบบจำลองภัยคุกคามทำให้เห็นทรัพย์สิน ผู้โจมตีที่เป็นไปได้ และจุดเข้าถึง เพื่อให้เลือกการป้องกันที่ตรงกับความเสี่ยงสำคัญก่อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.secure-coding.p015
    topics: [computer.security.secure-coding]
    difficulty: 2
    type: numeric
    stem: |
      ระบบเก็บ salt ยาว 16 ไบต์ให้ผู้ใช้แต่ละคนเพื่อใช้กับแฮชรหัสผ่าน ถ้ามีผู้ใช้ 250 คน ต้องใช้พื้นที่เก็บ salt รวมกันกี่ไบต์ (ตอบเป็นจำนวนเต็ม หน่วยไบต์)
    answer: { value: 4000, unit: ไบต์ }
    hints:
      - "แต่ละคนมี salt ของตัวเอง ขนาด 16 ไบต์"
      - "คูณขนาด salt ต่อคนด้วยจำนวนผู้ใช้"
    misconceptions:
      - { match: 250, feedback: "นับเป็นหนึ่งไบต์ต่อคน แต่ละคนมี salt ขนาด 16 ไบต์" }
    solution: "16 × 250 = 4000 ไบต์ salt ไม่จำเป็นต้องเป็นความลับ แต่ต้องไม่ซ้ำกันระหว่างผู้ใช้เพื่อกันการใช้ตารางคำนวณล่วงหน้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.secure-coding.p016
    topics: [computer.security.secure-coding]
    difficulty: 4
    type: code
    stem: |
      เขียนฟังก์ชัน `is_safe_username(name)` ที่ตรวจชื่อผู้ใช้ด้วยรายการที่อนุญาต และ **คืนค่า** `True` ถ้าชื่อ: ยาวตั้งแต่ 3 ถึง 16 ตัวอักษร ขึ้นต้นด้วยตัวอักษรภาษาอังกฤษ A ถึง Z หรือ a ถึง z และตามด้วยอักษรอังกฤษ ตัวเลข หรือขีดล่าง (_) เท่านั้น มิฉะนั้นคืน `False` ห้ามแก้ค่าที่รับมา
    starter: |
      def is_safe_username(name):
          pass
    tests: |
      assert is_safe_username("ada_01") is True, "ada_01 ผ่านเกณฑ์ ควรได้ True"
      assert is_safe_username("a" * 16) is True, "ความยาว 16 ตัวอักษรยังอยู่ในเกณฑ์ ควรได้ True"
      assert is_safe_username("ab") is False, "ยาวไม่ถึง 3 ตัวอักษร ควรได้ False"
      assert is_safe_username("a" * 17) is False, "ยาว 17 ตัวอักษรเกินเกณฑ์ ควรได้ False"
      assert is_safe_username("1abc") is False, "ขึ้นต้นด้วยตัวเลข ควรได้ False"
      assert is_safe_username("ada lovelace") is False, "มีช่องว่าง ควรได้ False"
      assert is_safe_username("ada-lovelace") is False, "มีเครื่องหมายขีดกลาง ควรได้ False"
      assert is_safe_username("ฟ้า_01") is False, "มีอักษรไทย ควรได้ False เพราะอนุญาตเฉพาะอักษรอังกฤษ"
    reference: |
      import re

      def is_safe_username(name):
          return re.fullmatch(r"[A-Za-z][A-Za-z0-9_]{2,15}", name) is not None
    hints:
      - "เขียนเกณฑ์เป็นรูปแบบเดียว คือตัวแรกเป็นอักษรแล้วตามด้วยอักขระที่อนุญาตตามจำนวนที่กำหนด"
      - "โมดูล `re` ของ Python มี `fullmatch` ที่ต้องให้ทั้งสตริงตรงกับรูปแบบ ไม่ใช่แค่บางส่วน"
    solution: "ใช้รูปแบบ [A-Za-z][A-Za-z0-9_]{2,15} กับ re.fullmatch เพื่อให้ตัวแรกเป็นอักษร และส่วนที่เหลือยาว 2 ถึง 15 ตัวจากชุดที่อนุญาต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.secure-coding.p017
    topics: [computer.security.secure-coding]
    difficulty: 5
    type: code
    stem: |
      เขียนฟังก์ชัน `escape_html(text)` ที่หลีกอักขระพิเศษของ HTML เพื่อให้แสดงข้อความในหน้าเว็บได้อย่างปลอดภัย โดยเปลี่ยน `&` เป็น `&amp;`, `<` เป็น `&lt;`, `>` เป็น `&gt;`, `"` เป็น `&quot;` และ `'` เป็น `&#x27;` ต้องเปลี่ยน `&` ก่อนเสมอ และ **คืนค่า** สตริงใหม่
    starter: |
      def escape_html(text):
          pass
    tests: |
      cases = [
          ("<b>ฟ้า</b>", "&lt;b&gt;ฟ้า&lt;/b&gt;"),
          ("A & B", "A &amp; B"),
          ('"x"', "&quot;x&quot;"),
          ("it's", "it&#x27;s"),
          ("&lt;", "&amp;lt;"),
          ("ปกติ", "ปกติ"),
      ]
      for raw, want in cases:
          got = escape_html(raw)
          assert got is not None, "ยังไม่ได้คืนค่า (ได้ None) ต้องใช้ return"
          assert got == want, f"escape_html({raw!r}) ควรได้ {want!r} แต่ได้ {got!r}"
    reference: |
      def escape_html(text):
          return (text.replace("&", "&amp;")
                      .replace("<", "&lt;")
                      .replace(">", "&gt;")
                      .replace('"', "&quot;")
                      .replace("'", "&#x27;"))
    hints:
      - "ใช้ `replace` ทีละอักขระ โดยเริ่มจาก `&` เพื่อไม่ให้ตัวหลีกที่เพิ่มเข้าไปถูกหลีกซ้ำ"
      - "ทุกการเปลี่ยนเป็นการต่อกันของ `replace` ที่คืนสตริงใหม่ทุกครั้ง"
    solution: "return text.replace(\"&\", \"&amp;\").replace(\"<\", \"&lt;\").replace(\">\", \"&gt;\").replace('\"', \"&quot;\").replace(\"'\", \"&#x27;\") โดยเปลี่ยน & ก่อนเพื่อไม่หลีกซ้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.secure-coding.p018
    topics: [computer.security.secure-coding]
    difficulty: 5
    type: code
    stem: |
      เขียนฟังก์ชัน `build_query(user_id)` ที่คืนค่าเป็นทูเพิล `(sql, params)` โดยที่ `sql` คือสตริงคงที่ `"SELECT name FROM students WHERE id = ?"` และ `params` เป็นทูเพิลที่มี `user_id` อยู่ข้างใน ห้ามนำค่า `user_id` ไปต่อเป็นส่วนของสตริง SQL ถ้า `user_id` ไม่ใช่จำนวนเต็มบวก (รวมถึงค่า `True`) ให้โยน `ValueError`
    starter: |
      def build_query(user_id):
          pass
    tests: |
      r = build_query(7)
      assert r is not None, "ยังไม่ได้คืนค่า (ได้ None) ต้องใช้ return"
      assert r == ("SELECT name FROM students WHERE id = ?", (7,)), f"build_query(7) ควรได้ (คำสั่งคงที่, (7,)) แต่ได้ {r!r}"
      for bad in ["7", 0, -1, True, 1.5]:
          try:
              build_query(bad)
          except ValueError:
              continue
          raise AssertionError(f"build_query({bad!r}) ควรโยน ValueError แต่ไม่โยน")
    reference: |
      def build_query(user_id):
          if not isinstance(user_id, int) or isinstance(user_id, bool) or user_id <= 0:
              raise ValueError(f"user_id ต้องเป็นจำนวนเต็มบวก แต่ได้ {user_id!r}")
          return ("SELECT name FROM students WHERE id = ?", (user_id,))
    hints:
      - "สตริง SQL เป็นค่าคงที่ ส่วนค่าข้อมูลถูกส่งแยกในทูเพิล `params`"
      - "ตรวจชนิดด้วย `isinstance` และตรวจว่าไม่ใช่ `bool` เพราะ `True` เป็นจำนวนเต็มใน Python แล้วตรวจว่าค่ามากกว่า 0"
    solution: "ตรวจชนิดและค่าก่อน ถ้าผ่านคืน (\"SELECT name FROM students WHERE id = ?\", (user_id,)) ซึ่งส่ง user_id เป็นพารามิเตอร์แยก ไม่ได้ต่อเข้าสตริง"
    license: CC-BY-SA-4.0
    ai_assisted: true
