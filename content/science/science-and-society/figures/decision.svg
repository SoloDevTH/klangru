<rect x="315.0" y="58.0" width="190.0" height="64.0" rx="12" fill="#fee2e2" stroke="#334155" stroke-width="1.5"/>
<text x="410.0" y="84.0" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">1 ระบุปัญหา</text>
<text x="410.0" y="106.0" text-anchor="middle" font-size="11" fill="#374151">เกิดอะไร กับใคร ที่ไหน</text>
<rect x="470.9" y="148.0" width="190.0" height="64.0" rx="12" fill="#e0f2fe" stroke="#334155" stroke-width="1.5"/>
<text x="565.9" y="174.0" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">2 รวบรวมหลักฐาน</text>
<text x="565.9" y="196.0" text-anchor="middle" font-size="11" fill="#374151">ข้อมูลจากการวัด งานวิจัย</text>
<rect x="470.9" y="328.0" width="190.0" height="64.0" rx="12" fill="#fef9c3" stroke="#334155" stroke-width="1.5"/>
<text x="565.9" y="354.0" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">3 ผู้มีส่วนได้เสีย</text>
<text x="565.9" y="376.0" text-anchor="middle" font-size="11" fill="#374151">ใครได้รับผล มีค่านิยมอย่างไร</text>
<rect x="315.0" y="418.0" width="190.0" height="64.0" rx="12" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/>
<text x="410.0" y="444.0" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">4 ทางเลือก</text>
<text x="410.0" y="466.0" text-anchor="middle" font-size="11" fill="#374151">ประโยชน์ ความเสี่ยง ต้นทุน</text>
<rect x="159.1" y="328.0" width="190.0" height="64.0" rx="12" fill="#ede9fe" stroke="#334155" stroke-width="1.5"/>
<text x="254.1" y="354.0" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">5 ตัดสินใจ</text>
<text x="254.1" y="376.0" text-anchor="middle" font-size="11" fill="#374151">ชั่งน้ำหนักหลักฐานกับค่านิยม</text>
<rect x="159.1" y="148.0" width="190.0" height="64.0" rx="12" fill="#ffedd5" stroke="#334155" stroke-width="1.5"/>
<text x="254.1" y="174.0" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">6 ติดตามผล</text>
<text x="254.1" y="196.0" text-anchor="middle" font-size="11" fill="#374151">วัดผล ปรับเมื่อมีหลักฐานใหม่</text>
<text x="410.0" y="240.0" text-anchor="middle" font-size="13" fill="#1e3a8a" font-weight="bold">วิทยาศาสตร์บอกว่า</text>
<text x="410.0" y="260.0" text-anchor="middle" font-size="12" fill="#1e3a8a">อะไรเป็นไปได้และมีผลอย่างไร</text>
<text x="410.0" y="286.0" text-anchor="middle" font-size="13" fill="#9a3412" font-weight="bold">สังคมตัดสินว่าควรทำอะไร</text>
<text x="410.0" y="306.0" text-anchor="middle" font-size="12" fill="#9a3412">จากค่านิยมและความจำเป็น</text>
</svg>