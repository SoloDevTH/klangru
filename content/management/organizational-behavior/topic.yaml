id: management.org.organizational-behavior
subject: management
title: { th: พฤติกรรมองค์การ การสื่อสาร และการจัดการการเปลี่ยนแปลง, en: "Organizational behavior, communication and change management" }
summary: การรับรู้ ทัศนคติ วัฒนธรรมองค์การ ช่องทางการสื่อสาร ความขัดแย้งและการเจรจา แรงต้านการเปลี่ยนแปลง แบบจำลองของเลวิน และอุปสรรคของการปรับปรุงคุณภาพ
difficulty: 5
minutes: 40
prerequisites: [management.org.leadership-motivation]
encompasses:
  - { id: management.org.leadership-motivation, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: tki-grid.svg
    alt: "แผนภาพสองแกน แกนนอนคือความร่วมมือหรือการใส่ใจความต้องการของอีกฝ่ายจากต่ำไปสูง แกนตั้งคือการยืนยันความต้องการของตนจากต่ำไปสูง มุมบนซ้ายคือแข่งขัน (ยืนยันสูง ร่วมมือต่ำ) มุมบนขวาคือร่วมมือ (สูงทั้งคู่) มุมล่างซ้ายคือหลีกเลี่ยง (ต่ำทั้งคู่) มุมล่างขวาคือยอมตาม (ยืนยันต่ำ ร่วมมือสูง) และตรงกลางคือประนีประนอม"
    caption: "ห้าวิธีรับมือความขัดแย้งตามแบบจำลองของโทมัสและคิลมันน์"
  - type: worked-example
    title: หาช่วงที่ตกลงกันได้ก่อนเจรจาราคาผ้าไหม
    problem: "กลุ่มทอผ้าไหมในจังหวัดสุรินทร์ (สมมติ) จะขายผ้า 20 ผืนให้ร้านของฝาก กลุ่มทอผ้ามีผู้ซื้ออีกรายเสนอ 38,000 บาท แต่ต้องส่งของเองเสียค่าขนส่ง 1,500 บาท ร้านของฝากมีผู้ขายอีกรายเสนอ 44,000 บาท ส่วนรายนี้ส่งถึงร้านให้ จงหาช่วงราคาที่ทั้งสองฝ่ายควรตกลงได้"
    steps:
      - text: "BATNA ของกลุ่มทอผ้าคือขายให้ผู้ซื้ออีกราย ได้สุทธิ $38{,}000 - 1{,}500 = 36{,}500$ บาท นี่คือราคาต่ำสุดที่กลุ่มทอผ้าควรรับ"
        why: "ถ้ารับต่ำกว่านี้ กลุ่มทอผ้าจะได้น้อยกว่าการเดินออกไปขายรายอื่น"
      - text: "BATNA ของร้านคือซื้อจากผู้ขายอีกราย 44,000 บาท นี่คือราคาสูงสุดที่ร้านควรจ่าย"
      - text: "ช่วงที่ตกลงกันได้ (ZOPA) คือ 36,500 ถึง 44,000 บาท กว้าง $44{,}000 - 36{,}500 = 7{,}500$ บาท"
      - text: "ทั้งสองฝ่ายควรหาประเด็นอื่นมาเจรจาร่วมด้วย เช่น ร้านสั่งประจำทุกเดือน แลกกับราคาที่ต่ำลง กลายเป็นการเจรจาแบบบูรณาการ"
        why: "การเพิ่มประเด็นทำให้ทั้งสองฝ่ายได้ประโยชน์รวมมากขึ้น แทนการแย่งเงินก้อนเดียว"
    answer: "ราคาที่ตกลงได้อยู่ระหว่าง 36,500 ถึง 44,000 บาท (ช่วงกว้าง 7,500 บาท) ราคาใดในช่วงนี้ทำให้ทั้งสองฝ่ายดีกว่าการไม่ตกลง"
  - { type: check, problem: management.org.organizational-behavior.p006, prompt: "ZOPA คือช่วงระหว่างสองค่า ไม่ใช่ผลรวม" }
  - type: figure
    src: lewin.svg
    alt: "กล่องสามกล่องเรียงจากซ้ายไปขวาเชื่อมด้วยลูกศร กล่องที่ 1 ละลาย (Unfreeze): ชี้ให้เห็นว่าทำไมต้องเปลี่ยน ใช้ข้อมูลจริง เช่น เวลารอ ลดแรงต้าน รับฟังความกังวล กล่องที่ 2 เปลี่ยน (Change): ทดลองวิธีใหม่ในจุดนำร่อง อบรมและสอนงานข้างตัว สื่อสารความคืบหน้าบ่อย ๆ กล่องที่ 3 ตรึง (Refreeze): เขียนเป็นมาตรฐานงานใหม่ ผูกกับตัวชี้วัดและรางวัล เลิกใช้ระบบเก่า"
    caption: "แบบจำลองการเปลี่ยนแปลงสามขั้นของเลวินพร้อมตัวอย่างกิจกรรมในแต่ละขั้น"
  - type: worked-example
    title: วิเคราะห์สนามแรงของระบบนัดคิวในโรงพยาบาล
    problem: "ทีมของโรงพยาบาลชุมชน (สมมติ) ให้คะแนนแรง 1–5 แรงผลักดัน: นโยบายลดเวลารอ 5 ผู้ป่วยร้องเรียน 4 ผู้อำนวยการสนับสนุน 3 แรงต้าน: พยาบาลกลัวใช้ไม่เป็น 4 งานเพิ่มช่วงเปลี่ยนระบบ 3 อินเทอร์เน็ตไม่เสถียร 2 ทีมควรทำอะไรต่อ"
    steps:
      - text: "รวมแรงผลักดัน $5 + 4 + 3 = 12$ และแรงต้าน $4 + 3 + 2 = 9$"
      - text: "แรงผลักมากกว่าแรงต้าน 3 คะแนน การเปลี่ยนแปลงมีโอกาสเกิด แต่แรงต้าน 9 คะแนนยังมากพอให้คนกลับไปใช้บัตรกระดาษ"
        why: "คะแนนเป็นการประเมินของทีม ใช้เทียบและจัดลำดับ ไม่ใช่การวัดที่แม่นยำ"
      - text: "แรงต้านที่มากที่สุดคือกลัวใช้ไม่เป็น (4) จัดอบรมสั้น ๆ ที่หน้าห้องตรวจและมีพี่เลี้ยงช่วงสัปดาห์แรก"
      - text: "แรงต้านงานเพิ่ม (3) ลดได้ด้วยการเปิดใช้ทีละแผนก และให้พยาบาลร่วมออกแบบขั้นตอน"
      - text: "หลีกเลี่ยงการเพิ่มแรงกดดัน เช่น ขู่ลงโทษ เพราะมักเพิ่มแรงต้านด้านความไม่ไว้ใจ"
    answer: "แรงผลัก 12 แรงต้าน 9 ควรเน้นลดแรงต้านสองตัวใหญ่ (อบรมและมีพี่เลี้ยง เปิดใช้ทีละแผนก) มากกว่ากดดันเพิ่ม"
  - type: figure
    src: p-forcefield.svg
    alt: "แผนภาพสนามแรงของการเปลี่ยนมาใช้ระบบสารบรรณอิเล็กทรอนิกส์ (สมมติ) เส้นตั้งตรงกลาง แรงผลักดันทางซ้ายชี้ไปขวา: นโยบายรัฐบาลดิจิทัล 5 ลดค่ากระดาษและหมึก 4 ค้นหาเอกสารได้เร็ว 3 หน่วยงานข้างเคียงใช้แล้ว 2 แรงต้านทางขวาชี้ไปซ้าย: ไม่คุ้นกับลายมือชื่อดิจิทัล 4 กลัวเอกสารหาย 4 คอมพิวเตอร์เครื่องเก่า 3 ความยาวลูกศรตามคะแนน"
    caption: "สนามแรงของสำนักงานจังหวัดแห่งหนึ่ง (สมมติ) ใช้ในโจทย์ข้อ 7 และ 8"
  - { type: check, problem: management.org.organizational-behavior.p007 }
glossary:
  - { term: พฤติกรรมองค์การ, definition: "การศึกษาความคิด ความรู้สึก และการกระทำของบุคคลและกลุ่มในองค์การ เพื่อนำไปปรับปรุงผลการปฏิบัติงาน" }
  - { term: ความคลาดเคลื่อนพื้นฐานในการอนุมานสาเหตุ, definition: "แนวโน้มที่จะโทษนิสัยของผู้อื่นมากเกินไป และให้น้ำหนักกับสถานการณ์น้อยเกินไป" }
  - { term: ความไม่สอดคล้องทางความคิด, definition: "ความอึดอัดเมื่อความเชื่อกับการกระทำขัดกัน ทำให้คนเปลี่ยนความเชื่อหรือหาเหตุผลมาอธิบาย" }
  - { term: วัฒนธรรมองค์การ, definition: "ค่านิยมและฐานคติร่วมที่กำหนดว่าคนในองค์การคิดและทำอย่างไร แบ่งเป็นสิ่งที่มองเห็น ค่านิยมที่ประกาศ และฐานคติที่ฝังลึก" }
  - { term: ความสมบูรณ์ของช่องทาง, definition: "ความสามารถของช่องทางสื่อสารในการส่งข้อมูลหลายแบบพร้อมกันและรับข้อมูลป้อนกลับทันที การคุยต่อหน้าสมบูรณ์ที่สุด" }
  - { term: BATNA, definition: "ทางเลือกที่ดีที่สุดถ้าการเจรจาตกลงกันไม่ได้ ใช้กำหนดจุดที่ยอมรับได้ของตนเอง" }
  - { term: ZOPA, definition: "ช่วงที่ตกลงกันได้ ระหว่างค่าต่ำสุดที่ผู้ขายรับได้กับค่าสูงสุดที่ผู้ซื้อยอมจ่าย" }
  - { term: การวิเคราะห์สนามแรง, definition: "การเขียนแรงผลักดันและแรงต้านการเปลี่ยนแปลงพร้อมคะแนนความแรง เพื่อวางแผนลดแรงต้าน" }
flashcards:
  - { front: "วัฒนธรรมองค์การสามระดับของชายน์", back: "สิ่งที่มองเห็นได้ → ค่านิยมที่ประกาศ → ฐานคติที่ฝังลึก (เปลี่ยนยากที่สุด)" }
  - { front: "แบบจำลองสามขั้นของเลวิน", back: "ละลาย (Unfreeze) → เปลี่ยน (Change) → ตรึง (Refreeze)" }
  - { front: "ห้าวิธีรับมือความขัดแย้ง", back: "แข่งขัน ร่วมมือ ประนีประนอม หลีกเลี่ยง ยอมตาม (ตามระดับการยืนยันความต้องการของตนและความร่วมมือ)" }
  - { front: "ZOPA", back: "ช่วงระหว่างราคาต่ำสุดที่ผู้ขายรับได้กับราคาสูงสุดที่ผู้ซื้อยอมจ่าย คิดจาก BATNA ของแต่ละฝ่าย" }
  - { front: "เรื่องอ่อนไหวควรสื่อสารทางใด", back: "ช่องทางที่สมบูรณ์ เช่น คุยต่อหน้า เพราะเห็นสีหน้า น้ำเสียง และถามกลับได้ทันที" }
