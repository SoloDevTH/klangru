  - id: physics.magnetism.induction.p018
    topics: [physics.magnetism.induction]
    difficulty: 5
    type: expression
    stem: "วงจร RL ต่อกับแบตเตอรี่ $V$ แล้วปิดสวิตช์ที่ $t = 0$ (กระแสเริ่มต้นเป็นศูนย์) จงเขียนกระแส $I$ เป็นฟังก์ชันของเวลา $t$ ในรูปของ $V$, $R$, $L$, $t$"
    prefix: "I ="
    answer: { latex: "\\frac{V}{R}\\cdot(1-e^{-\\frac{Rt}{L}})", variables: [V, R, L, t] }
    misconceptions:
      - { match: "\\frac{V}{R}\\cdot e^{-\\frac{Rt}{L}}", feedback: "นี่คือกระแสที่ลดลงหลังตัดแบตเตอรี่ ที่ $t = 0$ ได้ $V/R$ ซึ่งขัดกับกระแสเริ่มต้นเป็นศูนย์" }
      - { match: "\\frac{V}{R}\\cdot(1-e^{-\\frac{Lt}{R}})", feedback: "ค่าคงตัวเวลาคือ $\\tau = L/R$ เลขชี้กำลังจึงเป็น $-t/\\tau = -Rt/L$" }
    hints:
      - "$V - IR - L\\,dI/dt = 0$ เป็นสมการเชิงอนุพันธ์อันดับหนึ่ง"
      - "ค่าสุดท้ายคือ $V/R$ และค่าคงตัวเวลา $\\tau = L/R$"
    solution: "แยกตัวแปร $\\dfrac{dI}{V/R - I} = \\dfrac{R}{L}dt$ อินทิเกรตด้วย $I(0) = 0$ ได้ $I = \\dfrac{V}{R}\\left(1 - e^{-Rt/L}\\right)$ ตรวจ: $t = 0$ ได้ $0$ และ $t \\to \\infty$ ได้ $V/R$"
    license: CC-BY-SA-4.0
    ai_assisted: true
