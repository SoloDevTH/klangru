<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="sans-serif">
<title>เลือกแหล่งช่วยเหลือ</title>
<rect x="0" y="0" width="760" height="360" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="380.0" y="28.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">สถานการณ์แบบนี้ ไปขอความช่วยเหลือที่ไหน</text>
<rect x="20.0" y="52.0" width="330.0" height="46.0" rx="8" fill="#f8f9f9" stroke="#333" stroke-width="1.5"/>
<text x="185.0" y="80.0" font-size="13" text-anchor="middle" fill="#111">สงสัยว่าตั้งครรภ์ หรือกังวลเรื่องเอชไอวี</text>
<line x1="352.0" y1="75.0" x2="398.0" y2="75.0" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<rect x="400.0" y="52.0" width="340.0" height="46.0" rx="8" fill="#fdebd0" stroke="#333" stroke-width="1.5"/>
<text x="570.0" y="80.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#111">1663 ปรึกษาเอดส์และท้องไม่พร้อม</text>
<rect x="20.0" y="112.0" width="330.0" height="46.0" rx="8" fill="#f8f9f9" stroke="#333" stroke-width="1.5"/>
<text x="185.0" y="140.0" font-size="13" text-anchor="middle" fill="#111">อยากตรวจโรค รับถุงยาง ปรึกษาการคุมกำเนิด</text>
