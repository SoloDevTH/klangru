problems:
- id: business.finance.capital-budgeting.p001
  topics:
  - business.finance.capital-budgeting
  difficulty: 1
  type: mcq
  stem: โรงงานขนมอบในลำพูน (สมมติ) พิจารณาซื้อเครื่องอบใหม่ รายการใดเป็น **กระแสเงินสดส่วนเพิ่ม** ที่ต้องนำมาคิดในการประเมินโครงการ เลือกทุกข้อที่ถูก
  multiple: true
  choices:
  - id: a
    text: เงินทุนหมุนเวียน (วัตถุดิบสำรอง) ที่ต้องเพิ่มเมื่อเริ่มโครงการ และได้คืนเมื่อจบโครงการ
    correct: true
  - id: b
    text: ค่าเช่าที่โรงงานจะเสียไป เพราะใช้พื้นที่ว่างที่เดิมให้คนอื่นเช่าอยู่
    correct: true
  - id: c
    text: ภาษีเงินได้ที่เพิ่มขึ้นจากกำไรของโครงการ
    correct: true
  - id: d
    text: ค่าจ้างที่ปรึกษาสำรวจตลาดที่จ่ายไปแล้วเมื่อเดือนก่อน
    feedback: เป็นต้นทุนจม จ่ายไปแล้วไม่ว่าจะลงทุนหรือไม่ จึงไม่ใช่กระแสเงินสดส่วนเพิ่ม
  - id: e
    text: ดอกเบี้ยของเงินกู้ที่ใช้ซื้อเครื่อง
    feedback: ต้นทุนการจัดหาเงินสะท้อนอยู่ในอัตราคิดลด (WACC) แล้ว ถ้าหักดอกเบี้ยอีกจะนับซ้ำ
  hints:
  - ถามว่า "เงินก้อนนี้จะเกิดหรือเปลี่ยนไปเพราะเราลงทุนหรือไม่"
  - ต้นทุนจมไม่เปลี่ยน ส่วนค่าเสียโอกาสเปลี่ยน
  solution: 'นับทุกกระแสเงินสดที่เกิดขึ้นหรือเปลี่ยนไปเพราะโครงการ: เงินลงทุน เงินทุนหมุนเวียน รายได้และต้นทุนที่เพิ่ม ภาษี และค่าเสียโอกาส ไม่นับต้นทุนจม และไม่หักดอกเบี้ยเพราะอยู่ในอัตราคิดลดแล้ว'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.capital-budgeting.p002
  topics:
  - business.finance.capital-budgeting
  difficulty: 1
  type: match
  stem: จับคู่เกณฑ์การประเมินโครงการกับเงื่อนไขที่ "ยอมรับโครงการ" (โครงการอิสระ)
  pairs:
  - left: มูลค่าปัจจุบันสุทธิ (NPV)
    right: มากกว่า 0
  - left: อัตราผลตอบแทนภายใน (IRR)
    right: สูงกว่าต้นทุนเงินทุน
  - left: ดัชนีความสามารถทำกำไร (PI)
    right: มากกว่า 1
  - left: ระยะเวลาคืนทุน
    right: สั้นกว่าระยะที่ผู้บริหารกำหนด
  hints:
  - NPV เป็นจำนวนเงิน IRR เป็นอัตรา PI เป็นอัตราส่วน
  - ระยะคืนทุนเป็นจำนวนปี
  solution: NPV > 0 · IRR > WACC · PI > 1 · ระยะคืนทุน < เกณฑ์ สามเกณฑ์แรกให้คำตอบเดียวกันเสมอสำหรับโครงการอิสระแบบปกติ ส่วนระยะคืนทุนไม่ได้วัดความคุ้มค่า
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.capital-budgeting.p003
  topics:
  - business.finance.capital-budgeting
  difficulty: 2
  type: numeric
  stem: จากตารางกระแสเงินสด โครงการ A มีระยะเวลาคืนทุน (ไม่คิดลด) กี่ปี
  answer:
    value: 2.0
    tolerance: 0.01
    unit: ปี
  misconceptions:
  - match: 2.857143
    feedback: ใช้ค่าเฉลี่ยต่อปี ($1{,}400/4 = 350$) แต่เงินแต่ละปีไม่เท่ากัน
  figure: &id001
    src: p-projects.svg
    alt: 'ตารางกระแสเงินสดของสองโครงการ (สมมติ) หน่วยพันบาท โครงการ A ปีที่ 0 ถึง 4: −1,000, 600, 400, 300, 100 โครงการ B: −1,000, 100, 300, 500, 700 ทั้งสองโครงการใช้พื้นที่ติดตั้งจุดเดียว เลือกได้เพียงโครงการเดียว'
  hints:
  - สะสมเงินสดรับจนเท่าเงินลงทุน 1,000
  - ปีที่ 1 ได้ 600 ปีที่ 2 ได้ 400
  solution: 'สะสม: $600$ (ปีที่ 1) $1{,}000$ (ปีที่ 2) คืนทุนพอดี $2$ ปี'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.capital-budgeting.p004
  topics:
  - business.finance.capital-budgeting
  difficulty: 2
  type: numeric
  stem: จากตารางเดียวกัน โครงการ B มีระยะเวลาคืนทุน (ไม่คิดลด) กี่ปี (ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 3.142857
    tolerance: 0.02
    unit: ปี
  misconceptions:
  - match: 4
    feedback: ปัดเป็นทั้งปี ทั้งที่คืนทุนกลางปีที่ 4
  - match: 2.5
    feedback: ใช้ค่าเฉลี่ยต่อปี
  figure: *id001
  hints:
  - สามปีแรกสะสมได้ $100 + 300 + 500 = 900$
  - ปีที่ 4 ต้องการอีก $100$ จาก $700$
  solution: หลัง 3 ปีขาดอีก $100$ คิดเป็น $100/700 \approx 0.14$ ของปีที่ 4 ระยะคืนทุน $\approx 3.14$ ปี ช้ากว่า A แต่ไม่ได้แปลว่า B แย่กว่า เพราะระยะคืนทุนไม่ดูเงินหลังคืนทุน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.capital-budgeting.p005
  topics:
  - business.finance.capital-budgeting
  difficulty: 2
  type: numeric
  stem: โครงการหนึ่งลงทุน $1{,}100$ พันบาท มูลค่าปัจจุบันของกระแสเงินสดรับทั้งหมด (ที่ WACC) $1{,}324.82$ พันบาท ดัชนีความสามารถทำกำไร (PI) เท่ากับเท่าใด (ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 1.204382
    tolerance: 0.01
  misconceptions:
  - match: 0.204382
    feedback: ใช้ NPV แทน PV ของเงินรับ
  hints:
  - PI $= \dfrac{\text{PV ของกระแสเงินสดรับ}}{\text{เงินลงทุน}}$
  - มากกว่า 1 แปลว่า NPV เป็นบวก
  solution: PI $= 1{,}324.82 / 1{,}100 \approx 1.20$ ทุก 1 บาทที่ลงทุนได้มูลค่าปัจจุบันกลับมา 1.20 บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.capital-budgeting.p006
  topics:
  - business.finance.capital-budgeting
  difficulty: 2
  type: match
  stem: จับคู่วิธีประเมินมูลค่ากิจการกับคำอธิบาย
  pairs:
  - left: วิธีรายได้
    right: คิดลดกระแสเงินสดในอนาคตที่กิจการจะสร้างด้วยต้นทุนเงินทุน
  - left: วิธีสินทรัพย์
    right: มูลค่ายุติธรรมของสินทรัพย์หักหนี้สิน
  - left: วิธีมูลค่าตลาด
    right: เทียบกับราคาของกิจการคล้ายกันผ่านตัวคูณ เช่น อัตราส่วนราคาต่อกำไร
  hints:
  - วิธีหนึ่งมองอนาคต วิธีหนึ่งมองงบดุล วิธีหนึ่งมองตลาด
  - P/E คือราคาหุ้นหารกำไรต่อหุ้น
  solution: วิธีรายได้ใช้การคิดลดกระแสเงินสด (DCF) วิธีสินทรัพย์ใช้สินทรัพย์สุทธิ วิธีตลาดใช้ตัวคูณของกิจการเปรียบเทียบ ควรใช้หลายวิธีประกอบกันแล้วอธิบายส่วนต่าง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.capital-budgeting.p007
  topics:
  - business.finance.capital-budgeting
  difficulty: 2
  type: numeric
  stem: บริษัทสมมติมีกำไรต่อหุ้น $2.50$ บาท กิจการคล้ายกันในตลาดมีอัตราส่วนราคาต่อกำไร (P/E) เฉลี่ย $14$ เท่า มูลค่าหุ้นตามวิธีมูลค่าตลาดเป็นกี่บาทต่อหุ้น
  answer:
    value: 35.0
    unit: บาท
  misconceptions:
  - match: 5.6
    feedback: หารแทนคูณ
  hints:
  - ราคา $= \text{P/E} \times \text{กำไรต่อหุ้น}$
  - $14 \times 2.50$
  solution: $14 \times 2.50 = 35$ บาทต่อหุ้น ค่านี้ขึ้นกับว่ากิจการเปรียบเทียบคล้ายกันจริงหรือไม่
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.capital-budgeting.p008
  topics:
  - business.finance.capital-budgeting
  difficulty: 3
  type: numeric
  stem: เครื่องอบใหม่ (สมมติ) ทำให้รายได้เพิ่มปีละ $600$ พันบาท ต้นทุนเงินสดเพิ่ม $250$ พันบาท ค่าเสื่อมราคา $200$ พันบาทต่อปี ภาษี $20\%$ กระแสเงินสดจากการดำเนินงานส่วนเพิ่มต่อปีเท่ากับกี่พันบาท
  answer:
    value: 320
    unit: พันบาท
  misconceptions:
  - match: 120
    feedback: ลืมบวกค่าเสื่อมราคากลับ ค่าเสื่อมไม่ใช่เงินสดจ่าย
  - match: 350
    feedback: ลืมภาษี
  - match: 280
    feedback: หักภาษีแต่ไม่ได้คิดผลประหยัดภาษีจากค่าเสื่อม
  hints:
  - กำไรก่อนภาษี $= 600 - 250 - 200 = 150$ ภาษี $= 30$
  - กระแสเงินสด $=$ กำไรหลังภาษี $+$ ค่าเสื่อมราคา (ไม่ใช่เงินสดจ่าย)
  solution: 'กำไรหลังภาษี $= 150 \times 0.8 = 120$ บวกค่าเสื่อม $200$ ได้ $320$ พันบาทต่อปี (ตรวจ: $(600 - 250)(0.8) + 200(0.2) = 280 + 40 = 320$ ซึ่ง $40$ คือผลประหยัดภาษีจากค่าเสื่อม)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.capital-budgeting.p009
  topics:
  - business.finance.capital-budgeting
  difficulty: 3
  type: numeric
  stem: เมื่อจบโครงการ 5 ปี เครื่องอบมีมูลค่าตามบัญชี $0$ แต่ขายได้ $100$ พันบาท ภาษี $20\%$ กระแสเงินสดหลังภาษีจากการขายเครื่องเป็นกี่พันบาท
  answer:
    value: 80
    unit: พันบาท
  misconceptions:
  - match: 100
    feedback: ลืมภาษีจากกำไรการขาย
  - match: 20
    feedback: นั่นคือภาษี ไม่ใช่เงินสดที่ได้
  hints:
  - กำไรจากการขาย $=$ ราคาขาย $-$ มูลค่าตามบัญชี $= 100$
  - เสียภาษีจากกำไรนั้น $20\%$
  solution: ภาษี $= 100 \times 0.2 = 20$ เงินสดสุทธิ $= 100 - 20 = 80$ พันบาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.capital-budgeting.p010
  topics:
  - business.finance.capital-budgeting
  difficulty: 3
  type: numeric
  stem: จากตารางกระแสเงินสด จงหา NPV ของโครงการ A ที่ WACC $10\%$ (พันบาท ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 169.728844
    tolerance: 0.5
    unit: พันบาท
  misconceptions:
  - match: 400
    feedback: รวมโดยไม่คิดลด
  - match: 1169.728844
    feedback: ลืมหักเงินลงทุน
  figure: *id001
  hints:
  - คิดลดแต่ละปีด้วย $1.1^t$
  - $-1{,}000 + 600/1.1 + 400/1.1^2 + 300/1.1^3 + 100/1.1^4$
  solution: $-1{,}000 + 545.45 + 330.58 + 225.39 + 68.30 \approx 169.73$ พันบาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.capital-budgeting.p011
  topics:
  - business.finance.capital-budgeting
  difficulty: 3
  type: numeric
  stem: บริษัทสมมติคาดว่ากระแสเงินสดอิสระปีหน้า $12$ ล้านบาท และโตคงที่ $3\%$ ต่อปีตลอดไป WACC $9\%$ มูลค่ากิจการตามวิธีรายได้เป็นกี่ล้านบาท
  answer:
    value: 200.0
    unit: ล้านบาท
  misconceptions:
  - match: 133.333333
    feedback: ลืมหักอัตราการเติบโต
  - match: 100.0
    feedback: บวกอัตราการเติบโตแทนการหัก
  hints:
  - มูลค่าของกระแสเงินสดที่โตคงที่ตลอดไป $= \dfrac{FCF_1}{\text{WACC} - g}$
  - $12 / (0.09 - 0.03)$
  solution: $12 / 0.06 = 200$ ล้านบาท ผลไวต่อสมมติฐานมาก ถ้า $g = 4\%$ จะได้ $240$ ล้านบาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.capital-budgeting.p012
  topics:
  - business.finance.capital-budgeting
  difficulty: 3
  type: mcq
  stem: ทำไมมักใช้ WACC เป็นอัตราคิดลดของโครงการ และเมื่อใดไม่ควรใช้ค่าเดิม
  choices:
  - id: a
    text: WACC คือผลตอบแทนที่ผู้ให้เงินทุนทุกกลุ่มต้องการ ใช้ได้กับโครงการที่เสี่ยงพอ ๆ กับธุรกิจเดิม ถ้าโครงการเสี่ยงกว่ามากควรใช้อัตราที่สูงขึ้น
    correct: true
  - id: b
    text: ใช้ WACC เพราะเป็นอัตราดอกเบี้ยเงินฝาก
    feedback: WACC รวมต้นทุนหนี้และต้นทุนส่วนของเจ้าของ ไม่ใช่ดอกเบี้ยเงินฝาก
  - id: c
    text: ใช้ดอกเบี้ยเงินกู้ของโครงการแทน WACC เสมอ เพราะกู้มาลงทุน
    feedback: เงินกู้ก้อนหนึ่งเพิ่มภาระให้ผู้ถือหุ้นด้วย ต้นทุนที่แท้จริงคือส่วนผสมของทุกแหล่ง
  - id: d
    text: ใช้ WACC กับทุกโครงการ ไม่ว่าเสี่ยงแค่ไหน
    feedback: โครงการเสี่ยงสูงจะดูคุ้มเกินจริง และโครงการเสี่ยงต่ำจะถูกปฏิเสธอย่างไม่ควร
  hints:
  - อัตราคิดลดควรเท่ากับผลตอบแทนที่ผู้ให้เงินทุนต้องการสำหรับความเสี่ยงระดับนั้น
  - ทบทวน WACC จากบทแหล่งเงินทุน
  solution: WACC เป็นเกณฑ์ขั้นต่ำสำหรับโครงการที่เสี่ยงเท่ากิจการเดิม โครงการที่เสี่ยงต่างไปมาก เช่น เข้าธุรกิจใหม่ ควรปรับอัตราคิดลดตามความเสี่ยง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.capital-budgeting.p013
  topics:
  - business.finance.capital-budgeting
  difficulty: 4
  type: numeric
  stem: 'โครงการเครื่องอบ (สมมติ) มีกระแสเงินสด (พันบาท) ปีที่ 0–5: $-1{,}100$, $320$, $320$, $320$, $320$, $500$ จงหาระยะเวลาคืนทุนแบบคิดลดที่ $10\%$ (ปี ทศนิยม 2 ตำแหน่ง)'
  answer:
    value: 4.275858
    tolerance: 0.02
    unit: ปี
  misconceptions:
  - match: 3.4375
    feedback: นั่นคือระยะคืนทุนแบบไม่คิดลด
  hints:
  - 'คิดลดแต่ละปีก่อน: $320/1.1 = 290.91$, $264.46$, $240.42$, $218.56$, $500/1.1^5 = 310.46$'
  - สะสมจนกลับเป็นบวก แล้วหาสัดส่วนของปีสุดท้าย
  solution: สะสมหลังปีที่ 4 $\approx -85.64$ ปีที่ 5 มีมูลค่าปัจจุบัน $310.46$ คืนทุนที่ $4 + 85.64/310.46 \approx 4.28$ ปี นานกว่าระยะคืนทุนแบบไม่คิดลด ($3.44$ ปี)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.finance.capital-budgeting.p014
  topics:
  - business.finance.capital-budgeting
  difficulty: 4
  type: numeric
  stem: จากตารางกระแสเงินสด จงหา NPV ของโครงการ B ที่ WACC $10\%$ (พันบาท ทศนิยม 2 ตำแหน่ง)
