problems:
  - id: health.body.digestive-excretory-care.p001
    topics: [health.body.digestive-excretory-care]
    difficulty: 1
    type: mcq
    stem: "อวัยวะใดกรองของเสียออกจากเลือดแล้วสร้างเป็นปัสสาวะ"
    choices:
      - { id: a, text: "ไต", correct: true }
      - { id: b, text: "กระเพาะอาหาร", feedback: "กระเพาะอาหารย่อยอาหาร ไม่ได้กรองเลือด" }
      - { id: c, text: "กระเพาะปัสสาวะ", feedback: "กระเพาะปัสสาวะเก็บปัสสาวะไว้ชั่วคราว แต่ไตเป็นอวัยวะที่สร้างปัสสาวะ" }
    hints:
      - "อวัยวะนี้มี 2 ข้าง อยู่ด้านหลังใกล้แนวเอว"
      - "ปัสสาวะถูกสร้างก่อน แล้วจึงไปเก็บไว้"
    solution: "ไตกรองของเสียและน้ำส่วนเกินจากเลือดเป็นปัสสาวะ แล้วส่งไปเก็บที่กระเพาะปัสสาวะ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.digestive-excretory-care.p002
    topics: [health.body.digestive-excretory-care]
    difficulty: 1
    type: mcq
    stem: "ระหว่างเรียน เพลงรู้สึกปวดปัสสาวะ ควรทำอย่างไร"
    choices:
      - { id: a, text: "ขออนุญาตครูไปห้องน้ำ", correct: true }
      - { id: b, text: "กลั้นไว้จนกลับถึงบ้าน", feedback: "การกลั้นปัสสาวะบ่อย ๆ เสี่ยงต่อการติดเชื้อทางเดินปัสสาวะ" }
      - { id: c, text: "งดดื่มน้ำทั้งวันจะได้ไม่ต้องเข้าห้องน้ำ", feedback: "การดื่มน้ำน้อยทำให้ร่างกายขาดน้ำและท้องผูก" }
    hints:
      - "เมื่อร่างกายส่งสัญญาณให้ขับถ่าย ไม่ควรกลั้น"
      - "ครูอนุญาตให้ไปห้องน้ำได้"
    solution: "เมื่อปวดปัสสาวะให้ไปทันที การกลั้นบ่อย ๆ ไม่ดีต่อระบบขับถ่าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.digestive-excretory-care.p003
    topics: [health.body.digestive-excretory-care]
    difficulty: 2
    type: order
    stem: "เรียงอวัยวะตามทางที่อาหารเดินทางผ่าน"
    items:
      - "ปากและฟัน"
      - "หลอดอาหาร"
      - "กระเพาะอาหาร"
      - "ลำไส้เล็ก"
      - "ลำไส้ใหญ่"
      - "ทวารหนัก"
    hints:
      - "อาหารถูกเคี้ยวก่อนกลืน"
      - "สารอาหารถูกดูดซึมก่อนที่ลำไส้จะดูดน้ำกลับ"
    solution: "ปาก → หลอดอาหาร → กระเพาะอาหาร → ลำไส้เล็ก → ลำไส้ใหญ่ → ทวารหนัก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.digestive-excretory-care.p004
    topics: [health.body.digestive-excretory-care]
    difficulty: 2
    type: match
    stem: "จับคู่อวัยวะกับของเสียที่อวัยวะนั้นขับออก"
    pairs:
      - { left: "ไต", right: "ปัสสาวะ" }
      - { left: "ลำไส้ใหญ่", right: "อุจจาระ" }
      - { left: "ผิวหนัง", right: "เหงื่อ" }
      - { left: "ปอด", right: "แก๊สคาร์บอนไดออกไซด์" }
    hints:
      - "ร่างกายมีทางขับของเสียหลายทาง"
      - "ลมหายใจออกก็พาของเสียออกไปด้วย"
    solution: "ไต-ปัสสาวะ, ลำไส้ใหญ่-อุจจาระ, ผิวหนัง-เหงื่อ, ปอด-คาร์บอนไดออกไซด์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.digestive-excretory-care.p005
    topics: [health.body.digestive-excretory-care]
    difficulty: 2
    type: mcq
    stem: "หลังเล่นบาสเกตบอลกลางแดดทั้งบ่าย ภาคิณปัสสาวะเป็นสีเหลืองเข้มและกลิ่นแรง ควรทำอย่างไร"
    choices:
      - { id: a, text: "ดื่มน้ำสะอาดเพิ่มและพักในที่ร่ม", correct: true }
      - { id: b, text: "ไม่ต้องทำอะไร สีปัสสาวะไม่ได้บอกอะไร", feedback: "ปัสสาวะสีเหลืองเข้มกลิ่นแรงเป็นสัญญาณว่าร่างกายขาดน้ำ" }
      - { id: c, text: "ดื่มน้ำอัดลมหลายขวด", feedback: "น้ำอัดลมมีน้ำตาลมาก ควรดื่มน้ำเปล่าสะอาด" }
    hints:
      - "สีปัสสาวะบอกได้ว่าร่างกายมีน้ำพอหรือไม่"
      - "ออกกำลังกายกลางแดดทำให้เสียเหงื่อมาก"
    solution: "ปัสสาวะสีเหลืองเข้มกลิ่นแรงแสดงว่าขาดน้ำ ควรดื่มน้ำสะอาดเพิ่ม เมื่อดื่มพอปัสสาวะจะกลับเป็นสีเหลืองอ่อนใส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.digestive-excretory-care.p006
    topics: [health.body.digestive-excretory-care]
    difficulty: 2
    type: numeric
    stem: "จากบันทึกในภาพ ธงโภชนาการแนะนำเด็กอายุ 6–13 ปีให้กินผักวันละ 4 ทัพพี วันพุธต้นหอมกินผักน้อยกว่าที่แนะนำกี่ทัพพี (ตอบเป็นทัพพี)"
    figure:
      src: veg-fruit-log.svg
      alt: "แผนภูมิแท่งคู่ บันทึกการกินผักและผลไม้ 5 วันของต้นหอม ข้อมูลสมมติ เส้นประบอกคำแนะนำผักวันละ 4 ทัพพี ผลไม้วันละ 3 ส่วน จันทร์ ผัก 2 ผลไม้ 1 อังคาร ผัก 3 ผลไม้ 2 พุธ ผัก 1 ผลไม้ 1 พฤหัสบดี ผัก 4 ผลไม้ 3 ศุกร์ ผัก 2 ผลไม้ 1"
    answer: { value: 3, unit: ทัพพี }
    misconceptions:
      - { match: 1, feedback: "1 คือจำนวนผักที่กินวันพุธ โจทย์ถามว่าขาดอีกเท่าไร" }
      - { match: 5, feedback: "ต้องลบ ไม่ใช่บวก: ที่แนะนำ 4 ลบที่กิน 1" }
    hints:
      - "อ่านแท่งสีเขียวของวันพุธ"
      - "นำค่าที่แนะนำลบด้วยค่าที่กินจริง"
    solution: "วันพุธกินผัก 1 ทัพพี ขาดอีก 4 − 1 = 3 ทัพพี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.digestive-excretory-care.p007
    topics: [health.body.digestive-excretory-care]
    difficulty: 3
    type: numeric
    stem: "จากบันทึกในภาพ ใน 5 วันต้นหอมกินผักรวมกี่ทัพพี (ตอบเป็นทัพพี)"
    figure:
      src: veg-fruit-log.svg
      alt: "แผนภูมิแท่งคู่ บันทึกการกินผักและผลไม้ 5 วันของต้นหอม ข้อมูลสมมติ เส้นประบอกคำแนะนำผักวันละ 4 ทัพพี ผลไม้วันละ 3 ส่วน จันทร์ ผัก 2 ผลไม้ 1 อังคาร ผัก 3 ผลไม้ 2 พุธ ผัก 1 ผลไม้ 1 พฤหัสบดี ผัก 4 ผลไม้ 3 ศุกร์ ผัก 2 ผลไม้ 1"
    answer: { value: 12, unit: ทัพพี }
    misconceptions:
      - { match: 20, feedback: "20 คือปริมาณที่ควรกินใน 5 วัน (4 × 5) ไม่ใช่ที่กินจริง" }
      - { match: 8, feedback: "8 คือผลไม้รวม ข้อนี้ถามผัก (แท่งสีเขียว)" }
    hints:
      - "อ่านแท่งสีเขียวทุกวัน"
      - "บวกทั้ง 5 วัน"
    solution: "2 + 3 + 1 + 4 + 2 = 12 ทัพพี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.digestive-excretory-care.p008
    topics: [health.body.digestive-excretory-care]
    difficulty: 3
    type: numeric
    stem: "จากบันทึกในภาพ ต้นหอมกินผักเฉลี่ยวันละกี่ทัพพี (ตอบเป็นทัพพี ทศนิยม 1 ตำแหน่ง)"
    figure:
      src: veg-fruit-log.svg
      alt: "แผนภูมิแท่งคู่ บันทึกการกินผักและผลไม้ 5 วันของต้นหอม ข้อมูลสมมติ เส้นประบอกคำแนะนำผักวันละ 4 ทัพพี ผลไม้วันละ 3 ส่วน จันทร์ ผัก 2 ผลไม้ 1 อังคาร ผัก 3 ผลไม้ 2 พุธ ผัก 1 ผลไม้ 1 พฤหัสบดี ผัก 4 ผลไม้ 3 ศุกร์ ผัก 2 ผลไม้ 1"
    answer: { value: 2.4, tolerance: 0.05, unit: ทัพพี }
    misconceptions:
      - { match: 12, feedback: "12 คือผลรวม 5 วัน ต้องหารด้วยจำนวนวัน" }
      - { match: 2, feedback: "2 คือค่าที่พบบ่อยที่สุด ค่าเฉลี่ยต้องรวมแล้วหารด้วย 5" }
    hints:
      - "หาผลรวมของผักทั้ง 5 วันก่อน"
      - "ค่าเฉลี่ย = ผลรวม ÷ จำนวนวัน"
    solution: "ผลรวม 12 ทัพพี เฉลี่ย 12 ÷ 5 = 2.4 ทัพพีต่อวัน น้อยกว่าที่แนะนำ 4 ทัพพี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.digestive-excretory-care.p009
    topics: [health.body.digestive-excretory-care]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดช่วยป้องกันท้องผูก (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "กินผักและผลไม้ทุกวัน", correct: true }
      - { id: b, text: "ดื่มน้ำสะอาดให้พอ", correct: true }
      - { id: c, text: "นั่งถ่ายเป็นเวลาทุกวันและไม่กลั้นอุจจาระ", correct: true }
      - { id: d, text: "ออกกำลังกายหรือเดินทุกวัน", correct: true }
      - { id: e, text: "กินขนมกรุบกรอบแทนผลไม้", feedback: "ขนมกรุบกรอบมีใยอาหารน้อย และมักมีเกลือ น้ำตาล ไขมันมาก" }
      - { id: f, text: "กลั้นอุจจาระไว้ถ่ายที่บ้าน", feedback: "การกลั้นอุจจาระบ่อย ๆ ทำให้อุจจาระแข็งและท้องผูก" }
    hints:
      - "นึกถึงอาหาร น้ำ การขับถ่ายเป็นเวลา และการเคลื่อนไหว"
      - "ข้อที่ถูกมีสี่ข้อ"
    solution: "กินผักผลไม้ ดื่มน้ำ ขับถ่ายเป็นเวลาไม่กลั้น และออกกำลังกาย ช่วยป้องกันท้องผูก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.digestive-excretory-care.p010
    topics: [health.body.digestive-excretory-care]
    difficulty: 3
    type: text
    stem: "เมื่อท้องเสีย ร่างกายเสียน้ำและเกลือแร่ ยาสามัญประจำบ้านชนิดใดใช้ทดแทนน้ำและเกลือแร่ที่เสียไป"
    accepted: ["ผงน้ำตาลเกลือแร่", "น้ำตาลเกลือแร่", "เกลือแร่", "ORS", "โออาร์เอส", "ผงเกลือแร่"]
    misconceptions:
      - { match: "ยาระบาย", feedback: "ยาระบายใช้เมื่อท้องผูก ถ้าใช้ตอนท้องเสียจะเสียน้ำมากขึ้น" }
    hints:
      - "เป็นผงที่นำมาละลายน้ำดื่ม"
      - "ชื่อบอกส่วนประกอบสองอย่าง"
    solution: "ผงน้ำตาลเกลือแร่ (ORS) ผู้ใหญ่ละลายน้ำตามฉลากให้ดื่ม และควรดื่มให้หมดภายใน 24 ชั่วโมง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.digestive-excretory-care.p011
    topics: [health.body.digestive-excretory-care]
    difficulty: 3
    type: mcq
    stem: "ในงานบุญที่วัดช่วงเดือนเมษายน มีอาหารที่ทำไว้ตั้งแต่เช้าวางกลางแดดจนบ่าย กับอาหารที่เพิ่งปรุงเสร็จ ควรเลือกกินอย่างไรเพื่อป้องกันท้องเสีย"
    choices:
      - { id: a, text: "เลือกอาหารที่เพิ่งปรุงสุกใหม่และมีฝาปิด ล้างมือก่อนกิน", correct: true }
      - { id: b, text: "กินอาหารที่ทำไว้ตั้งแต่เช้า เพราะทำไว้ก่อนจะอร่อยกว่า", feedback: "อาหารที่ตั้งไว้นานในที่ร้อน เชื้อโรคเพิ่มจำนวนได้มาก เสี่ยงอาหารเป็นพิษ" }
      - { id: c, text: "กินอะไรก็ได้ แค่ไม่ต้องล้างมือเพราะใช้ช้อน", feedback: "มือที่ไม่สะอาดพาเชื้อโรคเข้าปากได้ แม้จะใช้ช้อน" }
    hints:
      - "อากาศร้อนทำให้อาหารเสียเร็ว"
      - "โรคท้องเสียติดต่อทางอาหาร น้ำ และมือที่ไม่สะอาด"
    solution: "เลือกอาหารสุกใหม่ มีฝาปิด และล้างมือก่อนกิน เพื่อป้องกันเชื้อโรคที่ทำให้ท้องเสีย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.digestive-excretory-care.p012
    topics: [health.body.digestive-excretory-care]
    difficulty: 4
    type: numeric
    stem: "จากบันทึกในภาพ ถ้าต้นหอมควรกินผลไม้วันละ 3 ส่วน ใน 5 วันกินผลไม้ขาดไปรวมกี่ส่วน (ตอบเป็นส่วน)"
    figure:
      src: veg-fruit-log.svg
      alt: "แผนภูมิแท่งคู่ บันทึกการกินผักและผลไม้ 5 วันของต้นหอม ข้อมูลสมมติ เส้นประบอกคำแนะนำผักวันละ 4 ทัพพี ผลไม้วันละ 3 ส่วน จันทร์ ผัก 2 ผลไม้ 1 อังคาร ผัก 3 ผลไม้ 2 พุธ ผัก 1 ผลไม้ 1 พฤหัสบดี ผัก 4 ผลไม้ 3 ศุกร์ ผัก 2 ผลไม้ 1"
    answer: { value: 7, unit: ส่วน }
    misconceptions:
      - { match: 8, feedback: "8 คือผลไม้ที่กินจริงรวม 5 วัน ต้องนำไปลบออกจากที่ควรกิน" }
      - { match: 15, feedback: "15 คือที่ควรกินใน 5 วัน ต้องลบด้วยที่กินจริง" }
    hints:
      - "ใน 5 วันควรกินผลไม้ 3 × 5 ส่วน"
      - "ลบด้วยผลไม้ที่กินจริงรวม 5 วัน"
    solution: "ควรกิน 3 × 5 = 15 ส่วน กินจริง 1 + 2 + 1 + 3 + 1 = 8 ส่วน ขาด 15 − 8 = 7 ส่วน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.digestive-excretory-care.p013
    topics: [health.body.digestive-excretory-care]
    difficulty: 4
    type: mcq
    stem: "อาการใดต้องรีบบอกผู้ใหญ่และไปพบแพทย์"
    choices:
      - { id: a, text: "อุจจาระมีเลือดปน", correct: true }
      - { id: b, text: "ท้องอืดเล็กน้อยหลังกินอาหารมื้อใหญ่ แล้วหายเอง", feedback: "อาการเล็กน้อยที่หายเอง มักไม่อันตราย แต่ถ้าเป็นซ้ำบ่อยให้บอกผู้ใหญ่" }
      - { id: c, text: "ถ่ายอุจจาระวันละครั้ง อุจจาระนุ่ม", feedback: "เป็นการขับถ่ายปกติ" }
    hints:
      - "เลือดในอุจจาระหรือปัสสาวะเป็นสัญญาณเตือนเสมอ"
      - "เลือกข้อที่ไม่ใช่อาการปกติ"
    solution: "อุจจาระมีเลือดปนเป็นอาการที่ต้องให้แพทย์ตรวจหาสาเหตุ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.digestive-excretory-care.p014
    topics: [health.body.digestive-excretory-care]
    difficulty: 4
    type: match
    stem: "จับคู่อาการกับสิ่งที่ควรทำ"
    pairs:
      - { left: "ถ่ายเหลว 3 ครั้งในวันเดียว แต่ยังดื่มน้ำได้", right: "ดื่มผงน้ำตาลเกลือแร่ที่ผู้ใหญ่เตรียมให้ และบอกผู้ใหญ่" }
      - { left: "ปวดแสบเวลาปัสสาวะและปัสสาวะบ่อย", right: "บอกผู้ใหญ่ให้พาไปพบแพทย์" }
      - { left: "ปวดท้องรุนแรงขึ้นทันทีและอาเจียนเป็นเลือด", right: "โทร 1669 ทันที" }
      - { left: "อุจจาระแข็งถ่ายยากเป็นบางวัน", right: "กินผักผลไม้และดื่มน้ำเพิ่ม" }
    hints:
      - "แยกอาการเป็นสามระดับ: ดูแลเองได้ ไปพบแพทย์ และฉุกเฉิน"
      - "อาเจียนเป็นเลือดเป็นเหตุฉุกเฉิน"
    solution: "ท้องเสีย-ดื่มผงน้ำตาลเกลือแร่, ปัสสาวะแสบ-พบแพทย์, ปวดรุนแรงและอาเจียนเป็นเลือด-โทร 1669, อุจจาระแข็ง-ผักผลไม้และน้ำ"
