  - id: phy.n1.p016
    topics: [physics.dynamics.newton-first]
    difficulty: 4
    type: numeric
    stem: "ในงานลอยกระทง โคมหนัก $50\\ \\mathrm{N}$ แขวนนิ่งด้วยเชือกสองเส้นที่ทำมุม $30^\\circ$ กับแนวราบเท่ากันทั้งสองข้าง ดังภาพ เชือกแต่ละเส้นมีแรงตึงเท่าใด (ตอบเป็นตัวเลขในหน่วย N)"
    figure: { src: lantern-30-30.svg, alt: "โคมห้อยจากปมเชือก ปมต่อกับเพดานด้วยเชือกสองเส้น T₁ ไปทางซ้ายและ T₂ ไปทางขวา แต่ละเส้นทำมุม 30° กับเพดานแนวราบ สมมาตรกัน" }
    answer: { value: 50, tolerance: 0.5, unit: N }
    hints:
      - "สมมาตร แรงตึงสองเส้นเท่ากัน องค์ประกอบแนวราบหักล้างกันเอง"
      - "องค์ประกอบแนวดิ่งของเชือกแต่ละเส้นคือ $T\\sin 30^\\circ$ รวมสองเส้นต้องเท่ากับน้ำหนัก"
      - "$2T\\sin 30^\\circ = 50$"
    misconceptions:
      - { match: 25, feedback: "ดูเหมือนแบ่งน้ำหนักครึ่งหนึ่งให้แต่ละเส้น ซึ่งถูกเฉพาะเมื่อเชือกตั้งดิ่ง เชือกที่เอียงให้แรงแนวดิ่งเพียง $T\\sin 30^\\circ$ แรงตึงจึงต้องมากกว่า" }
      - { match: 28.87, feedback: "ดูเหมือนใช้ $\\cos 30^\\circ$ มุม $30^\\circ$ วัดจากแนวราบ องค์ประกอบแนวดิ่งจึงเป็น $T\\sin 30^\\circ$" }
    solution: "$2T\\sin 30^\\circ = 50$ → $2T(0.5) = 50$ → $T = 50\\ \\mathrm{N}$ แต่ละเส้นรับแรงเท่ากับน้ำหนักของโคมทั้งหมด ยิ่งเชือกเกือบแนวราบ แรงตึงยิ่งมาก"
