id: math.number.integers
subject: math
title: { th: จำนวนเต็ม, en: Integers }
summary: รู้จักจำนวนเต็มบวก จำนวนเต็มลบ และศูนย์บนเส้นจำนวน แล้วบวก ลบ คูณ หาร และคำนวณตามลำดับการดำเนินการได้ถูกต้อง
difficulty: 1.5
minutes: 30
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: ลบจำนวนบวกกับลบจำนวนลบบนเส้นจำนวน
    problem: "หาค่า $-2 - 5$ และ $-2 - (-5)$"
    figure: { src: subtract-jumps.svg, alt: "เส้นจำนวนจาก −8 ถึง 4 เริ่มที่ −2 ลูกศรโค้งด้านบนไปทางซ้าย 5 ช่องถึง −7 แทน −2 − 5 ลูกศรโค้งด้านล่างไปทางขวา 5 ช่องถึง 3 แทน −2 − (−5) = −2 + 5" }
    steps:
      - text: "การลบคือการบวกจำนวนตรงข้าม: $-2 - 5 = -2 + (-5)$"
        why: "$p - q = p + (-q)$ ใช้ได้กับจำนวนเต็มทุกตัว จึงเปลี่ยนทุกการลบเป็นการบวกได้"
      - text: "เริ่มที่ $-2$ บวกจำนวนลบคือเดินไปทางซ้าย 5 ช่อง หยุดที่ $-7$"
      - text: "$-2 - (-5) = -2 + 5$ เพราะตรงข้ามของ $-5$ คือ $5$"
      - text: "เริ่มที่ $-2$ เดินไปทางขวา 5 ช่อง หยุดที่ $3$"
      - text: "ตรวจด้วยการบวกกลับ: $-7 + 5 = -2$ ✓ และ $3 + (-5) = -2$ ✓"
        why: "ถ้า $a - b = c$ แล้ว $c + b$ ต้องได้ $a$"
    answer: "$-2 - 5 = -7$ และ $-2 - (-5) = 3$"
  - { type: check, problem: math.int.p015, prompt: "จับคู่ศูนย์ดูก่อน" }
  - { type: check, problem: math.int.p014, prompt: "สังเกตแบบรูปของผลคูณ" }
  - type: worked-example
    title: ทำไมลบคูณลบจึงได้บวก
    problem: "ใช้สมบัติการแจกแจงอธิบายว่า $(-3) \\times (-4) = 12$"
    steps:
      - text: "เริ่มจากสิ่งที่รู้แน่ ๆ: จำนวนใดคูณศูนย์ได้ศูนย์ $(-3) \\times 0 = 0$"
      - text: "เขียน $0$ เป็น $4 + (-4)$ ได้ $(-3) \\times (4 + (-4)) = 0$"
        why: "จำนวนกับจำนวนตรงข้ามรวมกันได้ศูนย์"
      - text: "แจกแจง: $(-3) \\times 4 + (-3) \\times (-4) = 0$"
        why: "เราต้องการให้สมบัติการแจกแจง $a(b + c) = ab + ac$ ยังใช้ได้กับจำนวนลบ"
      - text: "รู้แล้วว่า $(-3) \\times 4 = -12$ จึงได้ $-12 + (-3) \\times (-4) = 0$"
      - text: "จำนวนที่บวกกับ $-12$ แล้วได้ $0$ คือ $12$ ดังนั้น $(-3) \\times (-4) = 12$"
    answer: "$(-3) \\times (-4) = 12$ เพราะต้องเป็นจำนวนตรงข้ามของ $(-3) \\times 4 = -12$"
  - type: simulation
    title: เส้นจำนวนกับจำนวนเต็ม (PhET Number Line Integers)
    url: https://phet.colorado.edu/en/simulations/number-line-integers
    provider: phet
    note: ลองลากจุดไปทางซ้ายและขวาของศูนย์ แล้วสังเกตว่าจำนวนยิ่งไปทางซ้ายยิ่งมีค่าน้อยลง
  - type: interactive
    title: "บวกจำนวนเต็มบนเส้นจำนวน: −8 + 5"
    caption: เริ่มที่ −8 แล้วกระโดดไปทางขวา 5 ช่อง เพราะการบวกจำนวนบวกคือการเดินไปทางขวา สังเกตว่าหยุดที่ −3 ซึ่งยังอยู่ทางซ้ายของศูนย์ คำตอบจึงเป็นลบ
    widget:
      kind: number-line
      min: -10
      max: 5
      points:
        - { value: -8, label: เริ่ม }
        - { value: -3, label: ผลลัพธ์ }
      jumps:
        - { from: -8, to: -3, label: "+5" }
glossary:
  - { term: "จำนวนเต็ม", definition: "จำนวนที่ไม่มีเศษหรือทศนิยม ได้แก่ จำนวนเต็มบวก ศูนย์ และจำนวนเต็มลบ เช่น −3, 0, 5" }
  - { term: "เส้นจำนวน", definition: "เส้นตรงที่วางจำนวนเรียงห่างเท่า ๆ กัน ศูนย์อยู่ตรงกลาง จำนวนบวกอยู่ทางขวา จำนวนลบอยู่ทางซ้าย" }
  - { term: "ค่าสัมบูรณ์", definition: "ระยะห่างจากศูนย์บนเส้นจำนวน ไม่สนทิศ เช่น ค่าสัมบูรณ์ของ −7 คือ 7" }
  - { term: "ลำดับการดำเนินการ", definition: "กติกาว่าต้องคำนวณอะไรก่อน คือ วงเล็บ แล้วคูณหารจากซ้ายไปขวา แล้วบวกลบจากซ้ายไปขวา" }
flashcards:
  - { front: "ลบคูณลบได้อะไร", back: "ได้บวก เช่น $(-3) \\times (-4) = 12$" }
  - { front: "ลบด้วยจำนวนลบ เช่น $5 - (-2)$ เท่ากับเท่าไร", back: "การลบจำนวนลบเหมือนบวกจำนวนบวก $5 - (-2) = 5 + 2 = 7$" }
  - { front: "$-8 + 5$ เท่ากับเท่าไร", back: "เครื่องหมายต่างกัน ให้เอาค่าสัมบูรณ์ลบกัน $8 - 5 = 3$ แล้วใช้เครื่องหมายของตัวที่ค่าสัมบูรณ์มากกว่า ได้ $-3$" }
  - { front: "ลำดับการดำเนินการคืออะไร", back: "วงเล็บก่อน แล้วคูณหารจากซ้ายไปขวา สุดท้ายบวกลบจากซ้ายไปขวา" }
