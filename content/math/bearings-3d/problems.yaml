  - id: math.geometry.bearings-3d.p017
    topics: [math.geometry.bearings-3d]
    difficulty: 5
    type: numeric
    stem: "พีระมิดฐานสี่เหลี่ยมจัตุรัสยาวด้านละ 10 เมตร สันข้าง (จากมุมฐานถึงยอด) ยาว 13 เมตร ดังภาพ พีระมิดสูงกี่เมตร (ตอบทศนิยม 2 ตำแหน่ง)"
    figure:
      src: p-pyramid.svg
      alt: "พีระมิดฐานสี่เหลี่ยมจัตุรัส ด้านฐานยาว 10 เมตร สันข้างที่ลากจากมุมฐานถึงยอดยาว 13 เมตร ยอดอยู่ตรงเหนือจุดกึ่งกลางของฐาน"
    answer: { value: 10.91, tolerance: 0.02, unit: เมตร }
    hints:
      - "ยอดอยู่ตรงเหนือจุดกึ่งกลางฐาน ระยะจากมุมฐานถึงจุดกึ่งกลางคือครึ่งหนึ่งของเส้นทแยงมุมฐาน"
      - "ครึ่งเส้นทแยงมุม $= \\tfrac12\\sqrt{10^2 + 10^2}$ แล้วใช้พีทาโกรัสกับสันข้าง 13 เมตร"
    misconceptions:
      - { match: 12, feedback: "ใช้ครึ่งด้านฐาน 5 เมตร ซึ่งเป็นแนวไปกึ่งกลางด้าน แต่สันข้างลากจากมุมฐาน ต้องใช้ครึ่งเส้นทแยงมุม" }
      - { match: 5.93, feedback: "ลบความยาว $13 - 7.07$ ตรง ๆ ต้องใช้พีทาโกรัส $\\sqrt{13^2 - 7.07^2}$" }
    solution: "ครึ่งเส้นทแยงมุมฐาน $= \\tfrac12\\sqrt{200} = \\sqrt{50} \\approx 7.07$ ม. ความสูง $= \\sqrt{13^2 - 50} = \\sqrt{119} \\approx 10.91$ ม."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.bearings-3d.p018
    topics: [math.geometry.bearings-3d]
    difficulty: 5
    type: numeric
    stem: "สนามรูปสี่เหลี่ยมผืนผ้า ABCD กว้าง 30 เมตร ยาว 40 เมตร มีเสาธงสูง 15 เมตรตั้งอยู่ที่มุม A นักเรียนยืนที่มุม C ซึ่งอยู่ตรงข้าม มองยอดเสาธงด้วยมุมเงยกี่องศา (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 16.7, tolerance: 0.2, unit: องศา }
    hints:
      - "ระยะตามพื้นจาก C ถึงโคนเสา คือเส้นทแยงมุมของสนาม"
      - "$AC = \\sqrt{30^2 + 40^2}$ แล้ว $\\tan\\theta = \\dfrac{15}{AC}$"
    misconceptions:
      - { match: 20.6, feedback: "ใช้ด้านยาว 40 เมตรแทนเส้นทแยงมุม แต่ C อยู่มุมตรงข้ามกับ A" }
      - { match: 73.3, feedback: "ใช้ $\\tan\\theta = \\tfrac{50}{15}$ กลับด้าน มุมเงย: ข้าม/ชิด = ความสูง/ระยะตามพื้น" }
    solution: "$AC = \\sqrt{900 + 1{,}600} = 50$ ม. $\\tan\\theta = \\tfrac{15}{50} = 0.3$ ได้ $\\theta \\approx 16.7^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.bearings-3d.p019
    topics: [math.geometry.bearings-3d]
    difficulty: 5
    type: numeric
    stem: "เรือแล่นจากท่าเรือ 10 กิโลเมตรด้วยแบริง $030^\\circ$ แล้วเลี้ยวแล่นต่ออีก 10 กิโลเมตรด้วยแบริง $120^\\circ$ แบริงของเรือจากท่าเรือเป็นกี่องศา"
    answer: { value: 75, tolerance: 0.6, unit: องศา }
    hints:
      - "สองช่วงต่างกัน $120^\\circ - 30^\\circ = 90^\\circ$ จึงตั้งฉากกัน และยาวเท่ากัน"
      - "สามเหลี่ยมมุมฉากหน้าจั่ว มุมที่ท่าเรือคือ $45^\\circ$ วัดจากแนว $030^\\circ$ ไปทางตามเข็มนาฬิกา"
    misconceptions:
      - { match: 45, feedback: "$45^\\circ$ คือมุมภายในสามเหลี่ยมที่ท่าเรือ ต้องบวกกับแบริงของช่วงแรก $030^\\circ$" }
      - { match: 120, feedback: "120° เป็นแบริงของช่วงที่สองเท่านั้น โจทย์ถามทิศของเรือเมื่อมองจากท่าเรือ" }
    solution: "ช่วงทั้งสองตั้งฉากและยาวเท่ากัน มุมที่ท่าเรือ $= 45^\\circ$ แบริง $= 030^\\circ + 45^\\circ = 075^\\circ$ ตรวจ: ไปตะวันออก $10\\sin30^\\circ + 10\\sin120^\\circ \\approx 13.66$ ไปเหนือ $10\\cos30^\\circ + 10\\cos120^\\circ \\approx 3.66$ $\\tan^{-1}\\tfrac{13.66}{3.66} \\approx 75^\\circ$ ระยะ $10\\sqrt2 \\approx 14.1$ กม."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.bearings-3d.p020
    topics: [math.geometry.bearings-3d]
    difficulty: 3
    type: expression
    stem: "ลูกบาศก์ยาวด้านละ $s$ หน่วย เส้นทแยงมุมของลูกบาศก์ (จากมุมล่างถึงมุมบนที่อยู่ตรงข้าม) ยาวเท่าใด เขียนในรูปของ $s$"
    answer: { latex: "s\\sqrt{3}", variables: [s] }
    hints:
      - "ใช้สูตร $\\sqrt{a^2 + b^2 + c^2}$ โดยทุกด้านยาว $s$"
      - "$\\sqrt{3s^2}$ แล้วดึง $s^2$ ออกจากราก"
    misconceptions:
      - { match: "s\\sqrt{2}", feedback: "นี่คือเส้นทแยงมุมของหน้าลูกบาศก์ ยังต้องรวมความสูงอีกด้าน" }
      - { match: "3s", feedback: "บวกด้านทั้งสาม ต้องใช้ $\\sqrt{s^2 + s^2 + s^2}$" }
    solution: "$\\sqrt{s^2 + s^2 + s^2} = \\sqrt{3s^2} = s\\sqrt3$"
    license: CC-BY-SA-4.0
    ai_assisted: true
