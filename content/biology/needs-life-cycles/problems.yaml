  - id: biology.animals.needs-life-cycles.p016
    topics: [biology.animals.needs-life-cycles]
    difficulty: 5
    type: mcq
    stem: "จากข้อมูลวัฏจักรของยุงลาย (ไข่ 2 วัน ลูกน้ำ 5 วัน ตัวโม่ง 2 วัน) ถ้าบ้านหนึ่งเปลี่ยนน้ำในแจกันทุก 14 วันแทนทุก 7 วัน จะเกิดอะไรขึ้น"
    choices:
      - { id: a, text: "ยุงมีเวลาพอเติบโตจนบินออกไปได้ เพราะ 14 วันนานกว่า 9 วันที่ยุงใช้", correct: true }
      - { id: b, text: "ไม่ต่างกัน เพราะเปลี่ยนน้ำเหมือนกัน", feedback: "เวลาสำคัญมาก ถ้ารอนานกว่า 9 วัน ยุงที่ฟักจากไข่จะกลายเป็นตัวเต็มวัยไปก่อน" }
      - { id: c, text: "ดีกว่าเดิม เพราะลูกน้ำโตจนจับทิ้งได้ง่าย", feedback: "ลูกน้ำจะเป็นตัวโม่งและยุงก่อนถึงวันที่ 14 จึงไม่มีลูกน้ำเหลือให้ทิ้ง" }
      - { id: d, text: "ยุงจะหยุดอยู่ที่ระยะดักแด้ตลอดไป", feedback: "ตัวโม่ง (ระยะดักแด้ของยุง) อยู่ราว 2 วันแล้วเป็นยุง ไม่หยุดอยู่ตลอด" }
    hints:
