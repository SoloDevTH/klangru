    difficulty: 5
    type: numeric
    stem: "ลำต้นของต้นไม้ต้นหนึ่งมีพื้นที่หน้าตัดของไซเลมที่ลำเลียงน้ำได้รวม 50 cm² และน้ำเคลื่อนที่ในไซเลมด้วยอัตราเร็ว 2 เมตรต่อชั่วโมง ต้นไม้ลำเลียงน้ำได้กี่ลิตรต่อชั่วโมง"
