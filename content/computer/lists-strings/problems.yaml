    hints:
      - "สมาชิกตัวแรกของลิสต์มีดัชนีเท่าไร"
      - "นับ 0, 1, 2 ไปตามลำดับในวงเล็บเหลี่ยม"
    solution: "ดัชนีเริ่มที่ 0 fruits[0] คือมะม่วง fruits[1] คือทุเรียน และ fruits[2] คือมังคุด โปรแกรมจึงแสดง ทุเรียน"
