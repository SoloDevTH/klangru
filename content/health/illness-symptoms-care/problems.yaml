      - { id: b, text: "หยุดได้เลย เพราะอาการหายแล้ว", feedback: "อาการหายไม่ได้แปลว่าเชื้อหมด ยาบางชนิดต้องกินครบ การตัดสินใจหยุดต้องถามหมอหรือเภสัชกร" }
