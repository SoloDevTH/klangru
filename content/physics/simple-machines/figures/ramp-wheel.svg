<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" font-family="sans-serif" font-size="14">
<title>พื้นเอียงและล้อกับเพลา</title>
<rect x="0" y="0" width="700" height="320" fill="#ffffff"/>
<text x="20.0" y="26.0" text-anchor="start" fill="#15211e" font-size="14" font-weight="bold">ก. พื้นเอียง</text>
<polygon points="40.0,250.0 311.1,250.0 311.1,180.0" fill="#d7ccc8" stroke="#15211e" stroke-width="2" stroke-linejoin="round"/>
<polygon points="189.1,211.5 224.0,202.5 215.0,167.6 180.1,176.6" fill="#90a4ae" stroke="#15211e" stroke-width="2" stroke-linejoin="round"/>
<line x1="202.0" y1="189.6" x2="259.2" y2="174.8" stroke="#b4521f" stroke-width="3"/>
<polygon points="269.8,172.1 257.8,169.5 260.5,180.1" fill="#b4521f" stroke="#b4521f" stroke-width="1" stroke-linejoin="round"/>
<text x="273.7" y="164.1" text-anchor="start" fill="#b4521f" font-size="14" font-weight="bold">F</text>
<text x="93.6" y="220.6" text-anchor="middle" fill="#15211e" font-size="14">L = 4 m</text>
<line x1="325.1" y1="180.0" x2="325.1" y2="250.0" stroke="#777" stroke-width="1.5"/>
<text x="331.1" y="220.0" text-anchor="start" fill="#15211e" font-size="14">h = 1 m</text>
<text x="40.0" y="300.0" text-anchor="start" fill="#15211e" font-size="14">ไม่มีแรงเสียดทาน: F × L = W × h</text>
<text x="40.0" y="286.0" text-anchor="start" fill="#15211e" font-size="1"></text>
<text x="400.0" y="26.0" text-anchor="start" fill="#15211e" font-size="14" font-weight="bold">ข. ล้อกับเพลา (รอกบ่อน้ำ)</text>
<circle cx="530.0" cy="120.0" r="70.0" fill="none" stroke="#15211e" stroke-width="2.5" stroke-dasharray="6 4"/>
<circle cx="530.0" cy="120.0" r="18.0" fill="#bcaaa4" stroke="#15211e" stroke-width="2.5"/>
<line x1="530.0" y1="120.0" x2="600.0" y2="120.0" stroke="#15211e" stroke-width="4"/>
<circle cx="600.0" cy="120.0" r="6.0" fill="#15211e" stroke="#15211e" stroke-width="1"/>
<line x1="600.0" y1="120.0" x2="600.0" y2="169.0" stroke="#b4521f" stroke-width="3"/>
<polygon points="600.0,180.0 605.5,169.0 594.5,169.0" fill="#b4521f" stroke="#b4521f" stroke-width="1" stroke-linejoin="round"/>
<text x="608.0" y="168.0" text-anchor="start" fill="#b4521f" font-size="14" font-weight="bold">F</text>
<line x1="512.0" y1="120.0" x2="512.0" y2="240.0" stroke="#6d4c41" stroke-width="2.5"/>
<rect x="490.0" y="240.0" width="44.0" height="40.0" rx="0" fill="#90a4ae" stroke="#15211e" stroke-width="2"/>
<text x="512.0" y="265.0" text-anchor="middle" fill="#15211e" font-size="13" font-weight="bold">W</text>
<text x="565.0" y="112.0" text-anchor="middle" fill="#15211e" font-size="14">R</text>
<text x="534.0" y="96.0" text-anchor="start" fill="#15211e" font-size="14">r</text>
<line x1="530.0" y1="120.0" x2="530.0" y2="102.0" stroke="#15211e" stroke-width="1.2"/>
<text x="400.0" y="300.0" text-anchor="start" fill="#15211e" font-size="14">F × R = W × r  ได้เปรียบเชิงกล = R ÷ r</text>
</svg>
