    prefix: "A ="
    answer: { latex: "\\frac{C r}{2}", variables: [C, r] }
    hints:
      - "พื้นที่ของรูปสี่เหลี่ยมผืนผ้า = ยาว × สูง"
      - "ความยาวคือ $\\tfrac{C}{2}$ ความสูงคือ $r$"
    misconceptions:
      - { match: "C r", feedback: "ชิ้นวงกลมครึ่งหนึ่งหันขึ้น อีกครึ่งหันลง ส่วนโค้งด้านล่างจึงยาวเพียงครึ่งหนึ่งของเส้นรอบวง ความยาวของรูปคือ $\\tfrac{C}{2}$" }
      - { match: "\\frac{C}{2}", feedback: "นั่นคือความยาวของรูป ยังต้องคูณความสูง $r$" }
    solution: "พื้นที่ $= \\tfrac{C}{2} \\times r = \\dfrac{Cr}{2}$ และเพราะ $C = 2\\pi r$ จะได้ $\\dfrac{2\\pi r \\cdot r}{2} = \\pi r^2$ ซึ่งคือสูตรพื้นที่วงกลมที่คุ้นเคย"
