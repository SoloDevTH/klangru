problems:
  - id: eng.perf.p001
    topics: [english.grammar.present-perfect]
    difficulty: 1
    type: mcq
    stem: "เลือกคำที่ถูกต้อง: *She ___ finished her homework.*"
    choices:
      - { id: a, text: "has", correct: true, feedback: "ถูก ประธาน she ใช้ has + V3" }
      - { id: b, text: "have", feedback: "have ใช้กับ I, you, we, they ส่วน she ใช้ has" }
      - { id: c, text: "is", feedback: "present perfect ใช้ have/has ไม่ใช่ verb to be" }
      - { id: d, text: "did", feedback: "did ไม่ตามด้วยกริยาช่องที่ 3 ถ้าเป็นอดีตธรรมดาจะเขียนว่า She finished her homework." }
    hints:
      - "finished ในที่นี้เป็นกริยาช่องที่ 3 ต้องมีกริยาช่วยนำหน้า"
      - "present perfect ใช้ have หรือ has เลือกตามประธาน"
    solution: "ประธาน she ใช้ has: *She **has** finished her homework.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.perf.p002
    topics: [english.grammar.present-perfect]
    difficulty: 1
    type: text
    stem: "กริยาช่องที่ 3 (past participle) ของ **eat** คืออะไร"
    accepted: ["eaten"]
    misconceptions:
      - { match: "ate", feedback: "ate เป็นช่องที่ 2 ช่องที่ 3 ที่ใช้หลัง have/has คือรูปอื่น" }
      - { match: "eated", feedback: "eat เป็นกริยาไม่ปกติ ไม่เติม -ed" }
    hints:
      - "eat เป็นกริยาไม่ปกติ: eat – ate – ?"
      - "นึกถึงประโยค Have you ever ___ durian?"
    solution: "eat – ate – **eaten** เช่น *I have eaten durian.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.perf.p003
    topics: [english.grammar.present-perfect]
    difficulty: 2
    type: match
    stem: "จับคู่กริยากับรูปช่องที่ 3 (past participle)"
    pairs:
      - { left: "go", right: "gone" }
      - { left: "see", right: "seen" }
      - { left: "write", right: "written" }
      - { left: "buy", right: "bought" }
      - { left: "take", right: "taken" }
    hints:
      - "ช่องที่ 3 ของกริยาไม่ปกติหลายตัวลงท้ายด้วย -n หรือ -en"
      - "บางตัวช่องที่ 2 และ 3 เหมือนกัน เช่น buy"
    solution: "go → gone · see → seen · write → written · buy → bought · take → taken"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.perf.p004
    topics: [english.grammar.present-perfect]
    difficulty: 2
    type: text
    stem: "เติม since หรือ for: *I have lived in Bangkok ___ 2015.*"
    accepted: ["since"]
    misconceptions:
      - { match: "for", feedback: "for ตามด้วยความยาวของช่วงเวลา แต่ 2015 เป็นจุดเริ่มต้น" }
    hints:
      - "2015 เป็นจุดเริ่มต้น หรือเป็นความยาวของช่วงเวลา"
      - "จุดเริ่มต้นใช้คำที่แปลว่า ตั้งแต่"
    solution: "2015 เป็นปีที่เริ่มอยู่ (จุดเริ่มต้น) จึงใช้ **since**: *I have lived in Bangkok since 2015.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.perf.p005
    topics: [english.grammar.present-perfect]
    difficulty: 2
    type: text
    stem: "เติม since หรือ for: *We have known each other ___ ten years.*"
    accepted: ["for"]
    misconceptions:
      - { match: "since", feedback: "since ตามด้วยจุดเริ่มต้น แต่ ten years เป็นความยาวของช่วงเวลา" }
    hints:
      - "ten years บอกจุดเริ่มต้น หรือบอกว่านานเท่าไร"
      - "ความยาวของช่วงเวลาใช้คำที่แปลว่า เป็นเวลา"
    solution: "ten years เป็นความยาวของช่วงเวลา จึงใช้ **for**: *We have known each other for ten years.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.perf.p006
    topics: [english.grammar.present-perfect]
    difficulty: 2
    type: order
    stem: "เรียงคำให้เป็นคำถามที่ถูกต้อง (คุณเคยกินทุเรียนไหม)"
    items: ["Have", "you", "ever", "eaten", "durian?"]
    hints:
      - "คำถาม present perfect ขึ้นต้นด้วย Have หรือ Has"
      - "ever วางระหว่างประธานกับกริยาช่องที่ 3"
    solution: "*Have you ever eaten durian?* (Have + ประธาน + ever + V3 + กรรม)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.perf.p007
    topics: [english.grammar.present-perfect]
    difficulty: 3
    type: mcq
    stem: "มะลิไม่อยู่บ้านตอนนี้ เลือกคำที่ถูกต้อง: *Mali isn't at home now. She has ___ to the market.*"
    choices:
      - { id: a, text: "gone", correct: true, feedback: "ถูก has gone to = ไปแล้วและยังอยู่ที่นั่น ตรงกับที่ว่าไม่อยู่บ้าน" }
      - { id: b, text: "been", feedback: "has been to = เคยไปและกลับมาแล้ว ขัดกับที่บอกว่าตอนนี้ไม่อยู่บ้าน" }
      - { id: c, text: "went", feedback: "went เป็นช่องที่ 2 หลัง has ต้องใช้ช่องที่ 3" }
      - { id: d, text: "go", feedback: "หลัง has ต้องใช้กริยาช่องที่ 3 ไม่ใช่รูปเดิม" }
    hints:
      - "หลัง has ต้องใช้กริยาช่องที่ 3 เหลือตัวเลือก gone กับ been"
      - "ประโยคแรกบอกว่ามะลิยังไม่กลับมา been กับ gone คำใดหมายถึงยังอยู่ที่นั่น"
    solution: "มะลิไปตลาดและยังไม่กลับ จึงใช้ **gone**: *She has gone to the market.* ถ้าใช้ been จะแปลว่าเคยไปแล้วกลับมาแล้ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.perf.p008
    topics: [english.grammar.present-perfect]
    difficulty: 3
    type: text
    stem: "เติม already หรือ yet: *I haven't finished my report ___.*"
    accepted: ["yet"]
    misconceptions:
      - { match: "already", feedback: "already ใช้ในประโยคบอกเล่า ประโยคปฏิเสธที่วางท้ายประโยคใช้ yet" }
    hints:
      - "ประโยคนี้เป็นบอกเล่าหรือปฏิเสธ"
      - "คำที่แปลว่า ยัง และวางท้ายประโยคปฏิเสธคือคำใด"
    solution: "ประโยคปฏิเสธ (haven't) ใช้ **yet** ท้ายประโยค: *I haven't finished my report yet.* (ฉันยังเขียนรายงานไม่เสร็จ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.perf.p009
    topics: [english.grammar.present-perfect]
    difficulty: 4
    type: mcq
    stem: "เลือกคำที่ถูกต้อง: *I ___ Phuket last year.*"
    choices:
      - { id: a, text: "visited", correct: true, feedback: "ถูก last year เป็นเวลาที่จบแล้ว ใช้ past simple" }
      - { id: b, text: "have visited", feedback: "present perfect ใช้กับคำบอกเวลาที่จบแล้วอย่าง last year ไม่ได้" }
      - { id: c, text: "have visit", feedback: "หลัง have ต้องเป็น V3 และประโยคนี้ไม่ใช้ present perfect เพราะมี last year" }
      - { id: d, text: "visit", feedback: "last year เป็นอดีต ต้องใช้รูปอดีต" }
    hints:
      - "หาคำบอกเวลาในประโยค"
      - "เวลาที่จบแล้ว (yesterday, last year, ago) ใช้ tense ใด"
    solution: "last year ระบุเวลาที่จบแล้ว จึงใช้ past simple: *I **visited** Phuket last year.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.perf.p010
    topics: [english.grammar.present-perfect]
    difficulty: 4
    type: mcq
    stem: "เลือกคำที่ถูกต้อง: *I ___ Phuket three times so far, and I want to go again.*"
    choices:
      - { id: a, text: "have visited", correct: true, feedback: "ถูก so far (จนถึงตอนนี้) แสดงว่าช่วงเวลายังไม่จบ ใช้ present perfect" }
      - { id: b, text: "visited", feedback: "so far แปลว่า จนถึงตอนนี้ ช่วงเวลายังไม่จบ จึงใช้ present perfect" }
      - { id: c, text: "has visited", feedback: "ประธาน I ใช้ have ไม่ใช่ has" }
      - { id: d, text: "have visit", feedback: "หลัง have ต้องใช้กริยาช่องที่ 3 คือ visited" }
    hints:
      - "so far แปลว่าอะไร ช่วงเวลาจบแล้วหรือยัง"
      - "ประสบการณ์ที่นับถึงตอนนี้ใช้ have/has + V3 เลือกตามประธาน I"
    solution: "so far = จนถึงตอนนี้ และนับจำนวนครั้งของประสบการณ์ จึงใช้ present perfect: *I **have visited** Phuket three times so far.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.perf.p011
    topics: [english.grammar.present-perfect]
    difficulty: 4
    type: text
    stem: "นิดเริ่มเป็นพยาบาลที่โรงพยาบาลนี้ปี 2020 และยังทำอยู่ เติมกริยาให้ถูก: *Nid ___ (work) at this hospital since 2020.* (ตอบเฉพาะคำในช่องว่าง)"
    accepted: ["has worked", "'s worked", "’s worked", "has been working"]
    misconceptions:
      - { match: "worked", feedback: "since 2020 แสดงว่ายังทำอยู่ถึงตอนนี้ ต้องใช้ present perfect (has + V3)" }
      - { match: "works", feedback: "เมื่อมี since บอกจุดเริ่มต้น ภาษาอังกฤษใช้ present perfect ไม่ใช่ present simple" }
      - { match: "have worked", feedback: "Nid เป็นบุรุษที่ 3 เอกพจน์ ใช้ has" }
    hints:
      - "since 2020 บอกว่าเริ่มในอดีตและยังทำอยู่"
      - "ใช้ have/has + V3 เลือกตามประธาน Nid"
    solution: "เริ่มทำในอดีตและยังทำอยู่ ใช้ present perfect กับ since: *Nid **has worked** at this hospital since 2020.* (ใช้ has been working ก็ได้)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.perf.p012
    topics: [english.grammar.present-perfect]
    difficulty: 5
    type: text
    stem: "A: *Have you ever been to Chiang Rai?* B: *Yes, I ___ (go) there in 2022.* (ตอบเฉพาะคำในช่องว่าง)"
    accepted: ["went"]
    misconceptions:
      - { match: "have been", feedback: "in 2022 ระบุเวลาที่จบแล้ว ใช้ present perfect ไม่ได้ ต้องเปลี่ยนเป็น past simple" }
      - { match: "have gone", feedback: "in 2022 ระบุเวลาที่จบแล้ว ต้องใช้ past simple และ have gone ยังแปลว่ายังอยู่ที่นั่นด้วย" }
      - { match: "gone", feedback: "gone เป็นช่องที่ 3 ใช้เดี่ยว ๆ ไม่ได้ และ in 2022 ต้องใช้ past simple" }
    hints:
      - "คำถามถามประสบการณ์ แต่คำตอบของ B บอกเวลาที่ชัดเจน"
      - "in 2022 เป็นเวลาที่จบแล้ว ใช้กริยาช่องที่ 2"
    solution: "คำตอบระบุเวลา in 2022 ซึ่งจบแล้ว จึงเปลี่ยนเป็น past simple: *Yes, I **went** there in 2022.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: eng.perf.p013
    topics: [english.grammar.present-perfect]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "เลือกประโยคที่ถูกต้องทั้งหมด"
    choices:
      - { id: a, text: "They have already eaten lunch.", correct: true }
      - { id: b, text: "Has he finished his work yet?", correct: true }
      - { id: c, text: "We haven't met since 2019.", correct: true }
      - { id: d, text: "She has lived here since three years.", feedback: "three years เป็นช่วงเวลา ต้องใช้ for: for three years" }
      - { id: e, text: "I have seen that movie yesterday.", feedback: "yesterday เป็นเวลาที่จบแล้ว ต้องใช้ past simple: I saw that movie yesterday." }
      - { id: f, text: "He has went home.", feedback: "หลัง has ใช้ช่องที่ 3: He has gone home." }
    hints:
      - "ตรวจสามเรื่อง: V3 หลัง have/has, since กับ for, และคำบอกเวลาที่จบแล้ว"
      - "already ใช้ในบอกเล่า yet ใช้ในคำถามและปฏิเสธ"
    solution: "ถูก: They have already eaten lunch. · Has he finished his work yet? · We haven't met since 2019. ผิด: since three years → for three years · have seen … yesterday → saw · has went → has gone"
    license: CC-BY-SA-4.0
    ai_assisted: true
