      - { id: d, text: "ปลูกผักกาดที่ 30 °C อย่างเดียว 50 ต้น แล้ววัดความสูงเฉลี่ย", feedback: "ไม่มีการเปลี่ยนอุณหภูมิ จึงเปรียบเทียบผลของอุณหภูมิไม่ได้" }
    hints:
