  - { framework: university-foundations, indicators: ["CALC1 4.1", "CALC1 4.2", "CALC1 4.3", "CALC1 4.5", "CALC1 4.7"], coverage: full, note: "อัตราสัมพัทธ์ (วงคลื่น บันได กรวยน้ำ โดรน) การประมาณเชิงเส้นและผลต่างเชิงอนุพันธ์ รวมความคลาดเคลื่อนสัมพัทธ์ที่แพร่กระจาย ค่าสุดขีดสัมบูรณ์และสัมพัทธ์ ทฤษฎีบทค่าสุดขีด จุดวิกฤตที่ f′ หาค่าไม่ได้ การทดสอบอนุพันธ์อันดับหนึ่งและสอง ความเว้าและจุดเปลี่ยนเว้า (รวมการอ่านจากกราฟของ f′) และปัญหาค่าเหมาะที่สุดทางวิศวกรรม (กระป๋อง รั้ว แนววางท่อ ระยะสั้นสุด)" }
