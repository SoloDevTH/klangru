<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340" font-family="sans-serif" font-size="14">
<title>วงจรการฝึกแบบจำลองมีห้าขั้นเรียงเป็นวงกลม เริ่มจากเก็บภาพตัวอย่าง ติดป้าย ฝึก ทดสอบด้วยภาพใหม่ แล้วเพิ่มตัวอย่างที่ทายผิดและกลับไปฝึกใหม่</title>
<rect x="0" y="0" width="520" height="340" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<line x1="299.2" y1="72.0" x2="385.5" y2="120.3" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
<line x1="416.5" y1="167.0" x2="373.6" y2="268.7" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
<line x1="283.9" y1="294.2" x2="238.1" y2="294.2" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
<line x1="147.2" y1="270.5" x2="104.3" y2="168.8" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
<line x1="132.7" y1="121.3" x2="219.1" y2="72.9" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
<rect x="185.0" y="30.0" width="150" height="40" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
<text x="260.0" y="55.0" text-anchor="middle" fill="#1f2937" font-size="13">1 เก็บภาพตัวอย่าง</text>
<rect x="351.4" y="123.3" width="150" height="40" rx="10" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
<text x="426.4" y="148.3" text-anchor="middle" fill="#1f2937" font-size="13">2 ติดป้ายกำกับ</text>
<rect x="287.9" y="274.2" width="150" height="40" rx="10" fill="#bbf7d0" stroke="#166534" stroke-width="2"/>
<text x="362.9" y="299.2" text-anchor="middle" fill="#1f2937" font-size="13">3 ฝึกแบบจำลอง</text>
<rect x="82.1" y="274.2" width="150" height="40" rx="10" fill="#fed7aa" stroke="#9a3412" stroke-width="2"/>
<text x="157.1" y="299.2" text-anchor="middle" fill="#1f2937" font-size="13">4 ทดสอบด้วยภาพใหม่</text>
<rect x="18.6" y="123.3" width="150" height="40" rx="10" fill="#fecaca" stroke="#991b1b" stroke-width="2"/>
<text x="93.6" y="148.3" text-anchor="middle" fill="#1f2937" font-size="13">5 เพิ่มตัวอย่างที่ทายผิด</text>
<text x="260" y="190" text-anchor="middle" fill="#6b7280" font-size="13">วนซ้ำจนแม่นพอ</text>
</svg>