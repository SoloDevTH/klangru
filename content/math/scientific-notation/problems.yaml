  - id: math.sci.p020
    topics: [math.number.scientific-notation]
    difficulty: 4
    type: numeric
    stem: "โทรศัพท์ของน้องมีพื้นที่เก็บข้อมูลว่าง $1.28 \\times 10^{11}$ ไบต์ ภาพถ่ายแต่ละภาพมีขนาดประมาณ $4 \\times 10^{6}$ ไบต์ เก็บภาพได้ประมาณกี่ภาพ (ตอบเป็นจำนวนเต็ม)"
    answer: { value: 32000, unit: ภาพ }
    hints:
      - "จำนวนภาพ = พื้นที่ว่าง ÷ ขนาดต่อภาพ"
      - "$\\tfrac{1.28}{4} = 0.32$ และ $10^{11 - 6} = 10^{5}$ แล้วปรับรูป"
    misconceptions:
      - { match: 3200, feedback: "$0.32 \\times 10^{5} = 3.2 \\times 10^{4} = 32{,}000$ ดูเหมือนปรับเลขชี้กำลังผิดไปหนึ่งขั้น" }
      - { match: 320000, feedback: "$0.32 \\times 10^{5}$ คือ $32{,}000$ เมื่อเลื่อนสัมประสิทธิ์ให้ใหญ่ขึ้น เลขชี้กำลังต้องลดลง ไม่ใช่เพิ่ม" }
    solution: "$\\dfrac{1.28 \\times 10^{11}}{4 \\times 10^{6}} = 0.32 \\times 10^{5} = 3.2 \\times 10^{4} = 32{,}000$ ภาพ"
    license: CC-BY-SA-4.0
    ai_assisted: true
