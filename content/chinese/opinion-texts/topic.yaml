lessons:
- type: explanation
  file: lesson.md
- type: figure
  src: argument-structure.svg
  alt: 'โครงสร้างข้อโต้แย้งสามกล่องจากซ้ายไปขวา: 论点 ความคิดหลัก (学生应该学会控制使用时间) ไป 论据 เหตุผลและตัวอย่าง (一方面…另一方面…) ไป 结论 ข้อสรุป (总之，关键是怎么用手机) พร้อมคำสัญญาณใต้แต่ละกล่อง'
  caption: อ่านข้อความแสดงความเห็นให้จบแต่ละกล่องก่อนไปต่อ
- type: check
  problem: chinese.reading.opinion-texts.p002
  prompt: ลองดูก่อนว่าประโยคไหนมีคำบอกทัศนะ เช่น 我认为 หรือ 希望
- type: worked-example
  title: หาความคิดหลักและเหตุผลในข้อความเรื่องโทรศัพท์
  problem: 在泰国，很多人认为，手机会影响学习。我同意这个看法，但我觉得不能简单地禁止手机。一方面，手机可以查资料、学外语；另一方面，玩游戏会让人分心。所以，我认为学生应该学会控制使用时间。总之，关键不是有没有手机，而是怎么用手机。
  steps:
  - text: 'หาประโยคที่บอกทัศนะ: 我认为学生应该学会控制使用时间 และ 我觉得不能简单地禁止手机'
    why: คำว่า 我认为 และ 我觉得 บอกความเห็นของผู้เขียนโดยตรง
  - text: 'หาเหตุผลที่สนับสนุน: 一方面…另一方面… ยกประโยชน์และโทษของโทรศัพท์'
    why: คู่คำนี้บอกว่ามีสองด้านที่ผู้เขียนชั่งน้ำหนัก
  - text: 'หาข้อสรุป: 总之 บอกว่าสิ่งสำคัญคือการใช้ ไม่ใช่การมีหรือไม่มี'
  answer: 'ความคิดหลัก: ควรรู้จักควบคุมการใช้โทรศัพท์ ไม่ใช่ห้ามทั้งหมด · เหตุผล: มีทั้งด้านดีและด้านเสีย · ข้อสรุป: วิธีใช้สำคัญกว่าการมีหรือไม่มี'
- type: check
  problem: chinese.reading.opinion-texts.p016
  prompt: ประโยค 当然，有人习惯晚上工作 ทำหน้าที่อะไร ลองคิดก่อนดูคำตอบ
glossary:
- term: 论点 lùndiǎn
  definition: ความคิดหลักที่ผู้เขียนต้องการให้ผู้อ่านเห็นด้วย
- term: 论据 lùnjù
  definition: เหตุผลหรือตัวอย่างที่สนับสนุนความคิดหลัก
- term: 结论 jiélùn
  definition: ข้อสรุปที่ย้ำความคิดหลักอีกครั้ง มักขึ้นต้นด้วย 总之 หรือ 由此可见
- term: 我认为 wǒ rènwéi
  definition: ฉันคิดว่า ใช้บอกทัศนะของผู้เขียนโดยตรง
- term: 与其…不如… yǔqí…bùrú…
  definition: แทนที่จะ…ไม่สู้… ใช้เปรียบเทียบสองทางแล้วเลือกทางที่ดีกว่า
flashcards:
- front: 一方面…另一方面…
  back: ด้านหนึ่ง…อีกด้านหนึ่ง… (ยกสองด้านของประเด็น)
- front: 不是…而是…
  back: ไม่ใช่…แต่เป็น…
- front: 由此可见
  back: จากนี้จะเห็นได้ว่า (บอกข้อสรุป)
- front: ข้อเท็จจริงกับความคิดเห็นต่างกันอย่างไร
  back: ข้อเท็จจริงตรวจได้ ความคิดเห็นมีคำบอกทัศนะ
