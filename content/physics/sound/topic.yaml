id: physics.waves.sound
subject: physics
title: { th: เสียง, en: Sound }
summary: เสียงเป็นคลื่นตามยาวที่ต้องอาศัยตัวกลาง คำนวณอัตราเร็วเสียงและระยะจากเสียงสะท้อน แยกระดับเสียงกับความดัง และรู้จักหน่วยเดซิเบล
difficulty: 4.5
minutes: 30
prerequisites: [physics.waves.wave-basics]
encompasses:
  - { id: physics.waves.wave-basics, weight: 0.5 }
  - { id: physics.kinematics.speed, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: displacement-pressure.svg
    alt: "สามแถวเรียงจากบนลงล่าง แถวบนเป็นชั้นอนุภาคอากาศ มีบริเวณที่เส้นชิดกัน (ส่วนอัด) และห่างกัน (ส่วนขยาย) สลับกัน แถวกลางเป็นกราฟการกระจัดของอนุภาคกับตำแหน่ง รูปไซน์ ยาวสองความยาวคลื่น มีลูกศรบอกความยาวคลื่น λ จากยอดถึงยอด แถวล่างเป็นกราฟความดันที่เปลี่ยนไปกับตำแหน่ง เส้นประแนวตั้งที่กลางส่วนอัดตัดกราฟการกระจัดที่ศูนย์ และตรงกับยอดสูงสุดของกราฟความดัน ส่วนกลางส่วนขยายการกระจัดเป็นศูนย์และความดันต่ำสุด"
    caption: "ที่กลางส่วนอัดและส่วนขยาย การกระจัดเป็นศูนย์ แต่ความดันสูงสุดและต่ำสุดตามลำดับ คลื่นความดันจึงเลื่อนจากคลื่นการกระจัดไป $\\tfrac{\\lambda}{4}$"
  - { type: check, problem: phy.snd.p021, prompt: "ลองตอบจากภาพ" }
  - type: figure
    src: inverse-square.svg
    alt: "แหล่งกำเนิดเสียงทางซ้าย มีเส้นประกระจายออกไปผ่านแผ่นสี่เหลี่ยมสามแผ่น ที่ระยะ r แผ่นมีพื้นที่ A ความเข้ม I ที่ระยะ 2r แผ่นใหญ่ขึ้นแบ่งเป็น 4 ช่อง พื้นที่ 4A ความเข้ม I/4 ที่ระยะ 3r แผ่นแบ่งเป็น 9 ช่อง พื้นที่ 9A ความเข้ม I/9"
    caption: "พลังงานเสียงเท่าเดิมกระจายบนพื้นที่ที่เพิ่มตาม $r^2$ ความเข้มจึงลดลงตาม $\\dfrac{1}{r^2}$"
  - type: worked-example
    title: ระดับความเข้มเสียงริมถนน
    problem: "เครื่องวัดเสียงริมถนนวัดความเข้มเสียงได้ $1.0 \\times 10^{-4}\\ \\mathrm{W/m^2}$ ระดับความเข้มเสียงเป็นกี่เดซิเบล ($I_0 = 10^{-12}\\ \\mathrm{W/m^2}$)"
    steps:
      - text: "หาอัตราส่วนกับความเข้มอ้างอิง: $\\dfrac{I}{I_0} = \\dfrac{10^{-4}}{10^{-12}} = 10^{8}$"
        why: "เดซิเบลวัดว่าเสียงเข้มกว่าเสียงเบาที่สุดที่หูได้ยินกี่เท่า"
      - text: "ใส่ลอการิทึม: $\\log 10^{8} = 8$"
      - text: "คูณ 10: $\\beta = 10 \\times 8 = 80\\ \\mathrm{dB}$"
        why: "หน่วยเบลคือ $\\log\\tfrac{I}{I_0}$ ส่วนเดซิเบลคือหนึ่งในสิบของเบล ตัวเลขจึงคูณ 10"
    answer: "$80\\ \\mathrm{dB}$ ใกล้เคียงเสียงการจราจรหนาแน่น"
  - type: worked-example
    title: ยืนห่างลำโพงงานวัดเท่าใดจึงไม่เกิน 85 เดซิเบล
    problem: "ลำโพงในงานวัดส่งกำลังเสียง $2.0\\ \\mathrm{W}$ ออกไปทุกทิศเท่ากัน ที่ระยะ $10\\ \\mathrm{m}$ ระดับความเข้มเสียงเป็นเท่าใด และต้องอยู่ห่างอย่างน้อยกี่เมตร ระดับจึงลดลงเหลือ $85\\ \\mathrm{dB}$"
    steps:
      - text: "ความเข้มที่ $10\\ \\mathrm{m}$: $I = \\dfrac{P}{4\\pi r^2} = \\dfrac{2.0}{4\\pi(10)^2} \\approx 1.59 \\times 10^{-3}\\ \\mathrm{W/m^2}$"
        why: "เสียงกระจายทุกทิศ พลังงานจึงแผ่บนผิวทรงกลมรัศมี $r$"
      - text: "ระดับความเข้มเสียง: $\\beta = 10\\log\\dfrac{1.59 \\times 10^{-3}}{10^{-12}} = 10\\log(1.59 \\times 10^{9}) \\approx 92.0\\ \\mathrm{dB}$"
      - text: "ต้องลดลง $92.0 - 85 = 7.0\\ \\mathrm{dB}$ คือความเข้มลดลง $10^{0.70} \\approx 5.0$ เท่า"
        why: "ทุก $10\\ \\mathrm{dB}$ คือ 10 เท่า ดังนั้น $7\\ \\mathrm{dB}$ คือ $10^{7/10}$ เท่า"
      - text: "ความเข้มแปรผกผันกับ $r^2$ ระยะจึงต้องเพิ่ม $\\sqrt{5.0} \\approx 2.24$ เท่า: $r \\approx 10 \\times 2.24 = 22.4\\ \\mathrm{m}$"
    answer: "ที่ $10\\ \\mathrm{m}$ ดังประมาณ $92\\ \\mathrm{dB}$ ต้องอยู่ห่างอย่างน้อยประมาณ $22\\ \\mathrm{m}$"
  - { type: check, problem: phy.snd.p015 }
  - type: interactive
    title: เปรียบเทียบระดับเสียงและความดังจากรูปคลื่น
    caption: แกนนอนคือเวลา (ms) แกนตั้งคือความดันอากาศที่เปลี่ยนไปจากปกติ (หน่วยเปรียบเทียบ) เส้นหนึ่งเป็นเสียงอ้างอิงความถี่ 1 kHz อีกเส้นปรับได้ แถบ f เปลี่ยนความถี่ (kHz) ทำให้เสียงสูงหรือต่ำ คลื่นจะถี่หรือห่างขึ้น ส่วนแถบ a เปลี่ยนแอมพลิจูด ทำให้เสียงดังหรือเบา คลื่นจะสูงหรือเตี้ยลงแต่ความถี่เท่าเดิม
    widget:
      kind: function-plot
      functions: ["\\sin(2\\pi x)", "a \\sin(2\\pi f x)"]
      sliders:
        - { name: f, min: 0.5, max: 3, step: 0.5, value: 2, label: ความถี่ (kHz) }
        - { name: a, min: 0.5, max: 2.5, step: 0.5, value: 1, label: แอมพลิจูด (เทียบกับเสียงอ้างอิง) }
      x: [0, 3]
      y: [-3, 3]
  - type: simulation
    title: คลื่นเสียง (PhET Sound Waves)
    url: https://phet.colorado.edu/en/simulations/sound-waves
    provider: phet
    note: เปิดลำโพงแล้วดูอนุภาคอากาศ จะเห็นส่วนอัดและส่วนขยายแผ่ออกไป อนุภาคแต่ละตัวสั่นไปมาอยู่กับที่ ลองเพิ่มความถี่แล้วสังเกตว่าส่วนอัดอยู่ชิดกันขึ้น (ความยาวคลื่นสั้นลง) และลองเพิ่มแอมพลิจูดแล้วสังเกตว่าส่วนอัดแน่นขึ้น
glossary:
  - { term: เสียงสะท้อน, definition: "เสียงที่กระทบสิ่งกีดขวางแล้วย้อนกลับมา ระยะถึงสิ่งกีดขวางคือ $d = \\tfrac{vt}{2}$ เมื่อ $t$ คือเวลาไปและกลับ" }
  - { term: ระดับเสียง, definition: "ความสูงต่ำของเสียง ขึ้นกับความถี่ ความถี่สูงได้ยินเป็นเสียงสูง" }
  - { term: ความดัง, definition: "ความรู้สึกว่าเสียงแรงหรือเบา ขึ้นกับแอมพลิจูดและพลังงานของคลื่นเสียง" }
  - { term: เดซิเบล, definition: "หน่วยของระดับความเข้มเสียง ($\\mathrm{dB}$) ทุก $10\\ \\mathrm{dB}$ ที่เพิ่มขึ้น ความเข้มเสียงเพิ่ม 10 เท่า" }
flashcards:
  - { front: "อัตราเร็วเสียงในอากาศที่อุณหภูมิ $T$ องศาเซลเซียส", back: "$v \\approx 331 + 0.6T$ ($\\mathrm{m/s}$) เช่น $20\\ ^\\circ\\mathrm{C}$ ได้ $343\\ \\mathrm{m/s}$" }
  - { front: "ได้ยินเสียงสะท้อนหลัง $t$ วินาที ผนังอยู่ไกลเท่าใด", back: "$d = \\dfrac{vt}{2}$ เพราะเสียงเดินทางไปและกลับ" }
  - { front: "ระดับเสียงสูง–ต่ำ กับ ความดัง ขึ้นกับอะไร", back: "ระดับเสียงขึ้นกับความถี่ ความดังขึ้นกับแอมพลิจูด" }
  - { front: "ทำไมนักบินอวกาศคุยกันนอกยานด้วยเสียงไม่ได้", back: "เสียงเป็นคลื่นกล ต้องมีตัวกลาง ในอวกาศเป็นสุญญากาศ" }
