<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" font-family="sans-serif" font-size="14">
  <title>ข้อจำกัดในการใช้งานมีทั้งแบบถาวร ชั่วคราว และตามสถานการณ์ ในด้านการมองเห็น การได้ยิน และการใช้มือ</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="860" height="380" fill="#ffffff"/>
  <rect x="130.0" y="20.0" width="236.0" height="40.0" rx="0" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="248.0" y="46.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ถาวร</text>
  <rect x="366.0" y="20.0" width="236.0" height="40.0" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="484.0" y="46.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ชั่วคราว</text>
  <rect x="602.0" y="20.0" width="236.0" height="40.0" rx="0" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="720.0" y="46.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ตามสถานการณ์</text>
  <rect x="20.0" y="60.0" width="110.0" height="90.0" rx="0" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="75.0" y="110.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">การมองเห็น</text>
  <rect x="130.0" y="60.0" width="236.0" height="90.0" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="248.0" y="110.0" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">ตาบอด สายตาเลือนราง</text>
  <rect x="366.0" y="60.0" width="236.0" height="90.0" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="484.0" y="110.0" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">ตาพร่าหลังหยอดยาขยายม่านตา</text>
  <rect x="602.0" y="60.0" width="236.0" height="90.0" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="720.0" y="110.0" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">จอสะท้อนแดดจ้า</text>
  <rect x="20.0" y="150.0" width="110.0" height="90.0" rx="0" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="75.0" y="200.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">การได้ยิน</text>
  <rect x="130.0" y="150.0" width="236.0" height="90.0" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="248.0" y="200.0" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">หูหนวก หูตึง</text>
  <rect x="366.0" y="150.0" width="236.0" height="90.0" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="484.0" y="200.0" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">หูอื้อจากหวัด</text>
  <rect x="602.0" y="150.0" width="236.0" height="90.0" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="720.0" y="200.0" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">อยู่ในตลาดที่เสียงดัง</text>
  <rect x="20.0" y="240.0" width="110.0" height="90.0" rx="0" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="75.0" y="290.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">การใช้มือ</text>
  <rect x="130.0" y="240.0" width="236.0" height="90.0" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="248.0" y="290.0" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">แขนขาด มือสั่นจากโรค</text>
  <rect x="366.0" y="240.0" width="236.0" height="90.0" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="484.0" y="290.0" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">แขนหัก ใส่เฝือก</text>
  <rect x="602.0" y="240.0" width="236.0" height="90.0" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="720.0" y="290.0" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">มือหนึ่งอุ้มน้อง</text>
  <text x="430.0" y="362.0" font-size="13" text-anchor="middle" fill="#6b7280" xml:space="preserve">ออกแบบให้คนที่มีข้อจำกัดถาวรใช้ได้ คนอีกจำนวนมากที่มีข้อจำกัดชั่วคราวหรือตามสถานการณ์ก็ได้ประโยชน์ด้วย</text>
</svg>
