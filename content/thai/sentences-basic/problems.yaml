problems:
- id: thai.grammar.sentences-basic.p001
  topics:
  - thai.grammar.sentences-basic
  difficulty: 1
  type: order
  stem: 'เรียงคำให้เป็นประโยค: **ปลา / แมว / กิน**'
  items:
  - แมว
  - กิน
  - ปลา
  hints:
  - หากริยาก่อน แล้วถามว่าใครทำ
  - ใครกิน? กินอะไร?
  solution: '**แมวกินปลา** (ประธาน + กริยา + กรรม)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sentences-basic.p002
  topics:
  - thai.grammar.sentences-basic
  difficulty: 1
  type: mcq
  stem: ข้อใด **เป็นประโยค**
  choices:
  - id: a
    text: น้องร้องเพลง
    correct: true
    feedback: ถูก รู้ว่าใคร (น้อง) ทำอะไร (ร้องเพลง)
  - id: b
    text: น้องตัวเล็ก
    feedback: รู้ว่าใคร แต่ไม่รู้ว่าน้องทำอะไร ยังไม่ครบใจความ
  - id: c
    text: ในห้องเรียน
    feedback: บอกแค่สถานที่ ไม่มีทั้งผู้ทำและการกระทำ
  - id: d
    text: เพลงเพราะของแม่
    feedback: เป็นกลุ่มคำนาม ยังไม่บอกว่าเกิดอะไรขึ้น
  hints:
  - ประโยคต้องรู้ว่า ใคร ทำอะไร
  - หาตัวเลือกที่มีทั้งผู้ทำและการกระทำ
  solution: '**น้องร้องเพลง** มีทั้งประธาน (น้อง) และกริยา (ร้องเพลง)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sentences-basic.p003
  topics:
  - thai.grammar.sentences-basic
  difficulty: 1
  type: text
  stem: 'เติมคำให้เป็น **ประโยคปฏิเสธ**: "แมว___กินปลา" (เติมหนึ่งคำ)'
  accepted:
  - ไม่
  misconceptions:
  - match: ไหม
    feedback: ไหม ใช้ทำประโยคคำถาม และวางท้ายประโยค
  - match: อย่า
    feedback: อย่า ใช้ในประโยคคำสั่ง เช่น อย่าให้แมวกินปลา
  hints:
  - ประโยคปฏิเสธบอกว่าไม่ได้ทำ
  - คำปฏิเสธวางหน้ากริยา
  solution: แมว**ไม่**กินปลา
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sentences-basic.p004
  topics:
  - thai.grammar.sentences-basic
  difficulty: 2
  type: match
  stem: จับคู่ประโยคกับชนิดตามเจตนา
  pairs:
  - left: พ่อไปตลาด
    right: บอกเล่า
  - left: พ่อไม่ได้ไปตลาด
    right: ปฏิเสธ
  - left: พ่อไปตลาดไหม
    right: คำถาม
  - left: ไปตลาดกันเถอะ
    right: ชักชวน
  - left: ห้ามวิ่งในตลาด
    right: คำสั่ง
  hints:
  - หาคำสำคัญ ไม่ ไหม เถอะ ห้าม
  - ประโยคที่ไม่มีคำพิเศษเลยคือบอกเล่า
  solution: บอกเล่า (พ่อไปตลาด) · ปฏิเสธ (ไม่ได้) · คำถาม (ไหม) · ชักชวน (กันเถอะ) · คำสั่ง (ห้าม)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sentences-basic.p005
  topics:
  - thai.grammar.sentences-basic
  difficulty: 2
  type: order
  stem: 'เรียงคำให้เป็นประโยค โดยให้ส่วนขยายอยู่ท้ายประโยค: **ที่สนาม / พี่ / ฟุตบอล / เตะ**'
  items:
  - พี่
  - เตะ
  - ฟุตบอล
  - ที่สนาม
  hints:
  - หากริยาคือ เตะ
  - ใครเตะ เตะอะไร ที่ไหน (ส่วนขยายไว้ท้าย)
  solution: '**พี่เตะฟุตบอลที่สนาม**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sentences-basic.p006
  topics:
  - thai.grammar.sentences-basic
  difficulty: 2
  type: mcq
  stem: ดูป้าย ป้ายใดเป็น **ประโยคขอร้อง**
  figure: &id001
    src: signs.svg
    alt: 'ป้าย 4 ป้าย ป้าย ก: ห้ามเดินลัดสนาม ป้าย ข: กรุณาถอดรองเท้าก่อนเข้าห้องสมุด ป้าย ค: ร้านนี้ไม่รับบัตรเครดิต ป้าย ง: ตลาดนัดเปิดทุกวันเสาร์ ตั้งแต่ ๗ โมงเช้า'
  choices:
  - id: a
    text: ป้าย ข
    correct: true
    feedback: ถูก มีคำว่า กรุณา ขอให้ทำอย่างสุภาพ
  - id: b
    text: ป้าย ก
    feedback: ห้าม เป็นประโยคคำสั่ง
  - id: c
    text: ป้าย ค
    feedback: ไม่ เป็นประโยคปฏิเสธ
  - id: d
    text: ป้าย ง
    feedback: บอกเวลาเปิดตลาด เป็นประโยคบอกเล่า
  hints:
  - ประโยคขอร้องมักมีคำว่า โปรด กรุณา ช่วย
  - หาป้ายที่มีคำเหล่านี้
  solution: ป้าย **ข** "กรุณาถอดรองเท้าก่อนเข้าห้องสมุด" เป็นประโยคขอร้อง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sentences-basic.p007
  topics:
  - thai.grammar.sentences-basic
  difficulty: 3
  type: match
  stem: ดูป้าย แล้วจับคู่ป้ายกับชนิดของประโยค
  figure: *id001
  pairs:
  - left: ป้าย ก
    right: คำสั่ง
  - left: ป้าย ข
    right: ขอร้อง
  - left: ป้าย ค
    right: ปฏิเสธ
  - left: ป้าย ง
    right: บอกเล่า
  hints:
  - อ่านคำสำคัญในแต่ละป้าย ห้าม กรุณา ไม่
  - ป้ายที่ไม่มีคำพิเศษเป็นประโยคบอกเล่า
  solution: ก ห้าม → คำสั่ง · ข กรุณา → ขอร้อง · ค ไม่ → ปฏิเสธ · ง บอกเวลาเปิด → บอกเล่า
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sentences-basic.p008
  topics:
  - thai.grammar.sentences-basic
  difficulty: 3
  type: mcq
  stem: ข้อใดเรียงคำ **ถูกต้อง**
  choices:
  - id: a
    text: แม่ซื้อเสื้อสีแดงให้น้อง
    correct: true
    feedback: ถูก คำขยาย สีแดง อยู่หลัง เสื้อ
  - id: b
    text: แม่ซื้อสีแดงเสื้อให้น้อง
    feedback: คำขยายในภาษาไทยอยู่หลังคำที่ถูกขยาย ต้องเป็น เสื้อสีแดง
  - id: c
    text: เสื้อสีแดงซื้อแม่ให้น้อง
    feedback: สลับประธานกับกรรม เสื้อซื้อแม่ไม่ได้
  - id: d
    text: แม่ให้น้องซื้อเสื้อสีแดงไม่
    feedback: คำว่า ไม่ ต้องอยู่หน้ากริยา และความหมายเปลี่ยนไป
  hints:
  - ประธาน + กริยา + กรรม + ส่วนขยาย
  - คำขยายอยู่หลังคำที่ถูกขยาย
  solution: '**แม่ซื้อเสื้อสีแดงให้น้อง** (แม่ = ประธาน ซื้อ = กริยา เสื้อสีแดง = กรรมพร้อมคำขยาย)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sentences-basic.p009
  topics:
  - thai.grammar.sentences-basic
  difficulty: 3
  type: text
  stem: เปลี่ยนประโยค "น้องอ่านหนังสือ" ให้เป็น **ประโยคคำถาม** ที่ถามว่า **ใช่หรือไม่** (เติมคำท้ายประโยค)
  accepted:
  - น้องอ่านหนังสือไหม
  - น้องอ่านหนังสือหรือเปล่า
  - น้องอ่านหนังสือหรือไม่
  - น้องอ่านหนังสือหรือ
  - น้องอ่านหนังสือไหม?
  - น้องอ่านหนังสือหรือเปล่า?
  - น้องอ่านหนังสือหรือไม่?
  misconceptions:
  - match: น้องอ่านหนังสืออะไร
    feedback: เป็นคำถามก็จริง แต่ถามว่าอ่านอะไร ไม่ใช่ถามว่าใช่หรือไม่
  - match: น้องไม่อ่านหนังสือ
    feedback: นี่คือประโยคปฏิเสธ
  - match: น้องอ่านหนังสือหรือยัง
    feedback: หรือยัง ถามว่าทำแล้วหรือยัง ไม่ได้ถามว่าใช่หรือไม่
  hints:
  - คำถามแบบตอบ ใช่/ไม่ใช่ ใช้ ไหม หรือ หรือเปล่า
  - เติมท้ายประโยคเดิมโดยไม่เปลี่ยนคำอื่น
  solution: '**น้องอ่านหนังสือไหม** (หรือ หรือเปล่า หรือไม่)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sentences-basic.p010
  topics:
  - thai.grammar.sentences-basic
  difficulty: 3
  type: mcq
  stem: ข้อใดเป็นประโยค **ชักชวน**
  choices:
  - id: a
    text: ไปเก็บขยะริมหาดกันเถอะ
    correct: true
    feedback: ถูก ...กันเถอะ ชวนให้ทำด้วยกัน
  - id: b
    text: ห้ามทิ้งขยะริมหาด
    feedback: ห้าม เป็นคำสั่ง
  - id: c
    text: หาดนี้ไม่มีขยะ
    feedback: เป็นประโยคปฏิเสธ
  - id: d
    text: ใครเก็บขยะริมหาด
    feedback: เป็นประโยคคำถาม
  hints:
  - ชักชวน = ชวนให้ทำด้วยกัน
  - มักมีคำว่า เถอะ กันเถอะ
  solution: '**ไปเก็บขยะริมหาดกันเถอะ** มี กันเถอะ เป็นการชักชวน'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sentences-basic.p011
  topics:
  - thai.grammar.sentences-basic
  difficulty: 4
  type: order
  stem: เรียงประโยคให้เป็นข้อความสั้นที่ต่อเนื่องกัน
  items:
  - เช้านี้ฉันตื่นสาย
  - จึงรีบอาบน้ำแต่งตัว
  - จากนั้นวิ่งไปที่ป้ายรถโรงเรียน
  - แต่รถออกไปแล้ว
  hints:
  - เรียงตามเวลาที่เกิดขึ้น
  - คำเชื่อม จึง จากนั้น แต่ ไม่อยู่ประโยคแรก
  solution: ตื่นสาย → **จึง**รีบอาบน้ำ → **จากนั้น**วิ่งไปที่ป้าย → **แต่**รถออกไปแล้ว
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sentences-basic.p012
  topics:
  - thai.grammar.sentences-basic
  difficulty: 4
  type: mcq
  stem: ประโยค "ฉันไม่รู้ว่าเขาไปไหน" เป็นประโยคชนิดใด
  choices:
  - id: a
    text: ประโยคปฏิเสธ
    correct: true
    feedback: ถูก ผู้พูดบอกว่าตัวเองไม่รู้ ไม่ได้ถามใคร
  - id: b
    text: ประโยคคำถาม
    feedback: มีคำว่า ไหน ก็จริง แต่ไม่ได้ถาม ไม่ต้องการคำตอบ
  - id: c
    text: ประโยคคำสั่ง
    feedback: ไม่มีการสั่งให้ใครทำอะไร
  - id: d
    text: ประโยคขอร้อง
    feedback: ไม่มีการขอให้ใครช่วย
  hints:
  - ดูเจตนาของผู้พูด ไม่ใช่ดูแค่คำ
  - ผู้พูดต้องการคำตอบหรือกำลังบอกว่าตัวเองไม่รู้
  solution: เป็น **ประโยคปฏิเสธ** มีคำว่า ไม่ และคำว่า ไหน ในที่นี้ไม่ได้ใช้ถาม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sentences-basic.p013
  topics:
  - thai.grammar.sentences-basic
  difficulty: 4
  type: mcq
  stem: นิดอยากให้ครูอธิบายอีกครั้ง ประโยคใด **ตรงกับเจตนาและสุภาพที่สุด**
  choices:
  - id: a
    text: คุณครูช่วยอธิบายอีกครั้งได้ไหมคะ
    correct: true
    feedback: ถูก เจตนาคือขอร้อง และใช้ ช่วย ได้ไหม คะ อย่างสุภาพ
  - id: b
    text: อธิบายใหม่เดี๋ยวนี้
    feedback: เป็นประโยคคำสั่ง ไม่เหมาะกับการพูดกับครู
  - id: c
    text: คุณครูอธิบายไม่เข้าใจ
    feedback: เป็นการบอกเล่าที่ตำหนิ ไม่ได้ขอร้อง
  - id: d
    text: หนูไม่ฟัง
    feedback: ไม่ได้บอกสิ่งที่ต้องการ
  hints:
  - เจตนาของนิดคืออะไร บอก ถาม ขอร้อง หรือสั่ง
  - ประโยคขอร้องใช้ ช่วย กรุณา และคำลงท้ายสุภาพ
  solution: '**คุณครูช่วยอธิบายอีกครั้งได้ไหมคะ** เป็นประโยคขอร้องที่สุภาพ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sentences-basic.p014
  topics:
  - thai.grammar.sentences-basic
  difficulty: 5
  type: mcq
  stem: ประโยค "ช่วยปิดหน้าต่างให้หน่อยได้ไหม" มีเจตนาอย่างไร
  choices:
  - id: a
    text: ขอร้อง
    correct: true
    feedback: ถูก รูปเป็นคำถาม แต่ผู้พูดต้องการให้ผู้ฟังปิดหน้าต่าง
  - id: b
    text: คำถาม เพราะมีคำว่า ไหม
    feedback: ผู้พูดไม่ได้อยากได้คำตอบว่า ได้ หรือ ไม่ได้ แต่อยากให้ช่วยทำ
  - id: c
    text: คำสั่ง
    feedback: ไม่มีคำว่า จง ห้าม อย่า และใช้ ช่วย...หน่อย ซึ่งนุ่มนวลกว่าคำสั่ง
  - id: d
    text: บอกเล่า
    feedback: ไม่ได้บอกเรื่องราว
  hints:
  - ดูว่าผู้พูดอยากให้เกิดอะไรขึ้น
  - คำว่า ช่วย...หน่อย บอกเจตนาอะไร
  solution: เจตนาคือ **ขอร้อง** ให้ช่วยปิดหน้าต่าง คำว่า ได้ไหม ทำให้นุ่มนวลขึ้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sentences-basic.p015
  topics:
  - thai.grammar.sentences-basic
  difficulty: 5
  type: mcq
  stem: ข้อใดเป็น **ประโยคบอกเล่า** ทั้งที่มีคำแสดงคำถาม
  choices:
  - id: a
    text: ใครมาก่อนได้ก่อน
    correct: true
    feedback: ถูก บอกกติกา ไม่ได้ถามว่าใครมาก่อน
  - id: b
    text: ใครมาก่อน
    feedback: เป็นประโยคคำถาม ต้องการคำตอบว่าใคร
  - id: c
    text: ไม่มีใครมาก่อน
    feedback: มีคำว่า ไม่ เป็นประโยคปฏิเสธ
  - id: d
    text: อย่าให้ใครมาก่อน
    feedback: มีคำว่า อย่า เป็นประโยคคำสั่ง
  hints:
  - ประโยคบอกเล่าไม่มีคำปฏิเสธ ไม่ต้องการคำตอบ
  - คำว่า ใคร ในประโยคไหนไม่ได้ใช้ถาม
  solution: '**ใครมาก่อนได้ก่อน** บอกกติกาว่าคนที่มาก่อนจะได้ก่อน จึงเป็นประโยคบอกเล่า'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sentences-basic.p016
  topics:
  - thai.grammar.sentences-basic
