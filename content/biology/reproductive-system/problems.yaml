problems:
  - id: biology.humans.reproductive-system.p001
    topics: [biology.humans.reproductive-system]
    difficulty: 1
    type: match
    stem: "จับคู่อวัยวะในระบบสืบพันธุ์เพศหญิงกับหน้าที่"
    pairs:
      - { left: "รังไข่", right: "สร้างเซลล์ไข่และฮอร์โมนเพศหญิง" }
      - { left: "ท่อนำไข่", right: "ทางผ่านของเซลล์ไข่และเป็นที่เกิดการปฏิสนธิ" }
      - { left: "มดลูก", right: "ที่ฝังตัวและเจริญเติบโตของทารก" }
      - { left: "ช่องคลอด", right: "ทางออกของประจำเดือนและทางคลอดทารก" }
    hints:
      - "เซลล์ไข่สร้างที่ใด แล้วเดินทางผ่านที่ใด"
      - "ทารกเจริญอยู่ในอวัยวะที่มีกล้ามเนื้อหนาและขยายได้"
    solution: "รังไข่สร้างเซลล์ไข่และฮอร์โมน ท่อนำไข่เป็นทางผ่านและที่ปฏิสนธิ มดลูกเป็นที่ฝังตัวและเจริญของทารก ช่องคลอดเป็นทางออกของประจำเดือนและทางคลอด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.reproductive-system.p002
    topics: [biology.humans.reproductive-system]
    difficulty: 1
    type: match
    stem: "จับคู่อวัยวะในระบบสืบพันธุ์เพศชายกับหน้าที่"
    pairs:
      - { left: "อัณฑะ", right: "สร้างอสุจิและฮอร์โมนเทสโทสเตอโรน" }
      - { left: "ถุงอัณฑะ", right: "ห่อหุ้มอัณฑะ ทำให้อุณหภูมิต่ำกว่าในร่างกายเล็กน้อย" }
      - { left: "หลอดเก็บอสุจิ", right: "เก็บอสุจิไว้จนเจริญเต็มที่" }
      - { left: "หลอดนำอสุจิ", right: "ลำเลียงอสุจิไปยังท่อปัสสาวะ" }
      - { left: "ต่อมลูกหมาก", right: "สร้างของเหลวหล่อเลี้ยงอสุจิ" }
    hints:
      - "อสุจิสร้างที่ใด เก็บที่ใด แล้วลำเลียงผ่านที่ใด"
      - "ต่อมต่าง ๆ ทำหน้าที่สร้างของเหลว"
    solution: "อัณฑะสร้างอสุจิและเทสโทสเตอโรน ถุงอัณฑะรักษาอุณหภูมิที่เหมาะ หลอดเก็บอสุจิเก็บจนเจริญเต็มที่ หลอดนำอสุจิลำเลียงไปท่อปัสสาวะ และต่อมลูกหมากสร้างของเหลวหล่อเลี้ยง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.reproductive-system.p003
    topics: [biology.humans.reproductive-system]
    difficulty: 1
    type: text
    stem: "ฮอร์โมนเพศชายที่สร้างจากอัณฑะ และทำให้เสียงห้าว มีหนวดเครา และกล้ามเนื้อมากขึ้น ชื่อว่าอะไร"
    accepted: ["เทสโทสเตอโรน", "เทสโทสเทอโรน", "testosterone"]
    hints:
      - "ขึ้นต้นด้วย เทส"
      - "ฮอร์โมนเพศหญิงคือเอสโทรเจน ฮอร์โมนเพศชายคืออะไร"
    misconceptions:
      - { match: "เอสโทรเจน", feedback: "เอสโทรเจนเป็นฮอร์โมนเพศหญิงที่สร้างจากรังไข่" }
    solution: "เทสโทสเตอโรน สร้างจากอัณฑะ ควบคุมการเปลี่ยนแปลงของร่างกายเพศชายเมื่อเข้าสู่วัยหนุ่มสาว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.reproductive-system.p004
    topics: [biology.humans.reproductive-system]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "การเปลี่ยนแปลงใดเกิดในเด็กหญิงเมื่อเข้าสู่วัยสาว โดยมีเอสโทรเจนเป็นฮอร์โมนหลัก (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "เต้านมขยาย", correct: true }
      - { id: b, text: "สะโพกผาย", correct: true }
      - { id: c, text: "เริ่มมีประจำเดือน", correct: true }
      - { id: d, text: "เสียงแตกและห้าวขึ้น ลูกกระเดือกชัด", feedback: "เป็นการเปลี่ยนแปลงของเพศชายจากเทสโทสเตอโรน" }
      - { id: e, text: "มีหนวดเคราขึ้น", feedback: "หนวดเคราเป็นการเปลี่ยนแปลงของเพศชาย" }
    hints:
      - "แยกการเปลี่ยนแปลงของเพศหญิงกับเพศชายออกจากกัน"
      - "การเปลี่ยนแปลงใดเกี่ยวกับรังไข่และมดลูก"
    solution: "เอสโทรเจนทำให้เต้านมขยาย สะโพกผาย และเริ่มมีรอบประจำเดือน ส่วนเสียงห้าวและหนวดเคราเป็นผลของเทสโทสเตอโรนในเพศชาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.reproductive-system.p005
    topics: [biology.humans.reproductive-system]
    difficulty: 2
    type: mcq
    stem: "การปฏิสนธิของคนเกิดขึ้นที่บริเวณใด"
    choices:
      - { id: a, text: "ท่อนำไข่", correct: true }
      - { id: b, text: "มดลูก", feedback: "มดลูกเป็นที่ฝังตัวหลังจากปฏิสนธิแล้วราว 1 สัปดาห์ ไม่ใช่ที่ปฏิสนธิ" }
      - { id: c, text: "รังไข่", feedback: "รังไข่สร้างและปล่อยเซลล์ไข่ การปฏิสนธิเกิดหลังจากเซลล์ไข่เข้าสู่ท่อนำไข่แล้ว" }
      - { id: d, text: "ช่องคลอด", feedback: "ช่องคลอดเป็นทางผ่าน ไม่ใช่ที่ปฏิสนธิ" }
    hints:
      - "หลังตกไข่ เซลล์ไข่ไปที่ไหนก่อน"
      - "ไซโกตต้องแบ่งเซลล์ระหว่างเดินทางไปมดลูก"
    solution: "อสุจิพบเซลล์ไข่และปฏิสนธิในท่อนำไข่ ได้ไซโกต ซึ่งแบ่งเซลล์ขณะเคลื่อนไปฝังตัวที่ผนังมดลูก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.reproductive-system.p006
    topics: [biology.humans.reproductive-system]
    difficulty: 2
    type: numeric
    stem: "แก้วจดบันทึกว่าประจำเดือนเริ่มวันที่ 3 มีนาคม รอบของเธอยาว 28 วัน ประจำเดือนครั้งถัดไปน่าจะเริ่มวันที่เท่าไรของเดือนมีนาคม"
    answer: { value: 31 }
    hints:
      - "รอบนับจากวันแรกของประจำเดือนครั้งนี้ถึงวันแรกของครั้งถัดไป"
      - "บวก 28 วันจากวันที่ 3"
    misconceptions:
      - { match: 30, feedback: "นับวันที่ 3 เป็นวันที่ 1 แล้วไปจบที่วันที่ 28 ของรอบ แต่ประจำเดือนครั้งถัดไปเริ่มในวันถัดจากนั้น" }
      - { match: 28, feedback: "28 คือความยาวของรอบ ต้องนับต่อจากวันที่ 3" }
    solution: "$3 + 28 = 31$ ประจำเดือนครั้งถัดไปน่าจะเริ่มวันที่ 31 มีนาคม แต่ในวัยรุ่นรอบอาจคลาดเคลื่อนได้หลายวัน จึงควรจดบันทึกต่อเนื่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.reproductive-system.p007
    topics: [biology.humans.reproductive-system]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นการดูแลความสะอาดที่ถูกต้องในช่วงมีประจำเดือน (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "อาบน้ำตามปกติทุกวัน", correct: true }
      - { id: b, text: "เปลี่ยนผ้าอนามัยทุก 3–4 ชั่วโมงหรือเมื่อเปียก", correct: true }
      - { id: c, text: "สวมชุดชั้นในที่สะอาดและเปลี่ยนทุกวัน", correct: true }
      - { id: d, text: "งดอาบน้ำจนกว่าประจำเดือนจะหมด", feedback: "เป็นความเชื่อที่ไม่ถูกต้อง การอาบน้ำช่วยให้สะอาดและสบายตัว" }
      - { id: e, text: "ฉีดล้างภายในช่องคลอดด้วยน้ำยาทุกวัน", feedback: "การฉีดล้างภายในรบกวนสมดุลตามธรรมชาติ ควรล้างเฉพาะภายนอกด้วยน้ำสะอาด" }
    hints:
      - "ความสะอาดช่วยลดกลิ่นและการติดเชื้อ"
      - "ร่างกายมีกลไกรักษาความสะอาดภายในเองอยู่แล้ว"
    solution: "ควรอาบน้ำตามปกติ เปลี่ยนผ้าอนามัยบ่อย และสวมชุดชั้นในสะอาด ล้างอวัยวะเพศภายนอกด้วยน้ำสะอาด ไม่ต้องฉีดล้างภายใน ถ้าปวดท้องมากผิดปกติหรือประจำเดือนมามากผิดปกติ ควรปรึกษาแพทย์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.reproductive-system.p008
    topics: [biology.humans.reproductive-system]
    difficulty: 3
    type: order
    stem: "เรียงลำดับเหตุการณ์ตั้งแต่การตกไข่จนเป็นทารก"
    items:
      - "รังไข่ปล่อยเซลล์ไข่ (การตกไข่)"
      - "เซลล์ไข่เคลื่อนเข้าสู่ท่อนำไข่"
      - "อสุจิปฏิสนธิกับเซลล์ไข่ ได้ไซโกต"
      - "ไซโกตแบ่งเซลล์ขณะเคลื่อนไปยังมดลูก"
      - "ฝังตัวที่ผนังมดลูก"
      - "เอ็มบริโอเจริญเป็นฟีตัสแล้วคลอดเป็นทารก"
    hints:
      - "การปฏิสนธิเกิดก่อนการฝังตัว"
      - "การฝังตัวเกิดที่ปลายทาง คือมดลูก"
    solution: "ตกไข่ → เซลล์ไข่เข้าท่อนำไข่ → ปฏิสนธิได้ไซโกต → ไซโกตแบ่งเซลล์ระหว่างทาง → ฝังตัวที่ผนังมดลูก → เจริญเป็นเอ็มบริโอ ฟีตัส และคลอด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.reproductive-system.p009
    topics: [biology.humans.reproductive-system]
    difficulty: 3
    type: mcq
    stem: "ประจำเดือนเกิดขึ้นได้อย่างไร"
    choices:
      - { id: a, text: "เมื่อไม่มีการปฏิสนธิ ระดับฮอร์โมนลดลง ผนังมดลูกที่หนาขึ้นจึงสลายและหลุดออกมาพร้อมเลือด", correct: true }
      - { id: b, text: "เป็นเลือดเสียที่ร่างกายต้องกำจัดออกทุกเดือน", feedback: "ประจำเดือนไม่ใช่เลือดเสีย แต่เป็นเนื้อเยื่อผนังมดลูกที่สลายพร้อมเลือดตามรอบปกติ" }
      - { id: c, text: "เกิดจากเซลล์ไข่แตกออกเป็นเลือด", feedback: "เซลล์ไข่มีขนาดเล็กมาก ประจำเดือนมาจากผนังมดลูก" }
      - { id: d, text: "เกิดจากการปฏิสนธิ", feedback: "ถ้ามีการปฏิสนธิและฝังตัว ผนังมดลูกจะคงอยู่ และไม่มีประจำเดือน" }
    hints:
      - "ผนังมดลูกหนาขึ้นทุกเดือนเพื่ออะไร"
      - "ถ้าไม่มีไซโกตมาฝังตัว ผนังมดลูกจะเป็นอย่างไร"
    solution: "ผนังมดลูกหนาขึ้นทุกรอบเพื่อรองรับการฝังตัว ถ้าไม่มีการปฏิสนธิ ฮอร์โมนลดลง ผนังมดลูกสลายตัวหลุดออกมาพร้อมเลือด เรียกว่าประจำเดือน แล้วรอบใหม่จึงเริ่มต้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.reproductive-system.p010
    topics: [biology.humans.reproductive-system]
    difficulty: 3
    type: numeric
    stem: "ถ้ารอบประจำเดือนของคนหนึ่งยาว 30 วัน และไข่ตกประมาณ 14 วันก่อนประจำเดือนครั้งถัดไป (ประมาณได้จาก ความยาวรอบ − 14) ไข่ตกราววันที่เท่าไรของรอบ"
    answer: { value: 16 }
    hints:
      - "ใช้ความยาวรอบลบ 14"
      - "ไม่ได้ตกไข่ตรงกลางรอบเสมอไป"
    misconceptions:
      - { match: 15, feedback: "แบ่งครึ่งรอบ แต่ไข่ตกราว 14 วันก่อนรอบถัดไป ไม่ใช่กึ่งกลางรอบเสมอ" }
      - { match: 14, feedback: "วันที่ 14 ใช้กับรอบ 28 วัน รอบนี้ยาว 30 วัน" }
    solution: "$30 - 14 = 16$ ไข่ตกราววันที่ 16 ของรอบ ตัวเลขนี้เป็นค่าประมาณ แต่ละรอบอาจคลาดเคลื่อน จึงใช้นับวันเพื่อคุมกำเนิดไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.reproductive-system.p011
    topics: [biology.humans.reproductive-system]
    difficulty: 3
    type: mcq
    stem: "คู่สมรสคู่หนึ่งยังไม่ต้องการมีบุตร และต้องการป้องกันโรคติดต่อทางเพศสัมพันธ์ไปพร้อมกัน วิธีคุมกำเนิดใดเหมาะสมที่สุด"
    choices:
      - { id: a, text: "ถุงยางอนามัย", correct: true }
      - { id: b, text: "ยาเม็ดคุมกำเนิด", feedback: "ยาเม็ดคุมกำเนิดป้องกันการตั้งครรภ์ แต่ไม่ป้องกันโรคติดต่อทางเพศสัมพันธ์" }
      - { id: c, text: "การนับวัน", feedback: "การนับวันคลาดเคลื่อนง่ายและไม่ป้องกันโรคติดต่อทางเพศสัมพันธ์" }
      - { id: d, text: "ห่วงอนามัย", feedback: "ห่วงอนามัยป้องกันการตั้งครรภ์ได้นาน แต่ไม่ป้องกันโรคติดต่อทางเพศสัมพันธ์" }
    hints:
      - "ต้องการผลสองอย่างพร้อมกัน"
      - "วิธีใดที่กั้นไม่ให้สารคัดหลั่งสัมผัสกันโดยตรง"
    solution: "ถุงยางอนามัยเป็นวิธีที่ช่วยทั้งป้องกันการตั้งครรภ์และลดความเสี่ยงของโรคติดต่อทางเพศสัมพันธ์ วิธีอื่นในตัวเลือกป้องกันได้เฉพาะการตั้งครรภ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.reproductive-system.p012
    topics: [biology.humans.reproductive-system]
    difficulty: 3
    type: mcq
    stem: "แฟนของฝนชวนให้ไปอยู่ด้วยกันตามลำพังที่ห้องพักหลังเลิกเรียน และบอกว่า \"ถ้ารักกันจริงต้องไป\" ฝนยังไม่พร้อมและไม่สบายใจ ข้อใดเป็นการปฏิบัติตนที่เหมาะสมที่สุด"
    choices:
      - { id: a, text: "ปฏิเสธอย่างชัดเจน ไม่ไปอยู่ตามลำพังในที่ลับตา และเล่าให้ผู้ใหญ่ที่ไว้ใจฟัง", correct: true }
      - { id: b, text: "ไปด้วยเพื่อพิสูจน์ว่ารักจริง", feedback: "ความรักที่ดีเคารพการตัดสินใจของอีกฝ่าย การถูกกดดันเป็นสัญญาณของความสัมพันธ์ที่ไม่ปลอดภัย" }
