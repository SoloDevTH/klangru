<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" font-family="sans-serif" font-size="14">
  <title>ชั้นของระบบคอมพิวเตอร์ ผู้ใช้ ซอฟต์แวร์ประยุกต์ ซอฟต์แวร์ระบบ (เคอร์เนลและไดรเวอร์) และฮาร์ดแวร์ แอปติดต่อเคอร์เนลผ่านการเรียกใช้บริการของระบบ</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="860" height="420" fill="#ffffff"/>
  <rect x="60.0" y="20.0" width="560.0" height="72.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="340.0" y="51.6" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ผู้ใช้</text>
  <text x="340.0" y="77.5" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">แตะจอ พิมพ์ พูด</text>
  <line x1="300.0" y1="92.0" x2="300.0" y2="113.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="380.0" y1="113.0" x2="380.0" y2="94.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="60.0" y="115.0" width="560.0" height="72.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="340.0" y="146.6" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ซอฟต์แวร์ประยุกต์</text>
  <text x="340.0" y="172.5" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">เบราว์เซอร์ เกม แอปแชต แอปจดบันทึก (โหมดผู้ใช้)</text>
  <line x1="300.0" y1="187.0" x2="300.0" y2="208.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="380.0" y1="208.0" x2="380.0" y2="189.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="60.0" y="210.0" width="560.0" height="72.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="340.0" y="241.6" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ระบบปฏิบัติการ: เคอร์เนลและไดรเวอร์</text>
  <text x="340.0" y="267.5" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">จัดการกระบวนการ หน่วยความจำ อุปกรณ์ ไฟล์ ผู้ใช้ (โหมดเคอร์เนล)</text>
  <line x1="300.0" y1="282.0" x2="300.0" y2="303.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="380.0" y1="303.0" x2="380.0" y2="284.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="60.0" y="305.0" width="560.0" height="72.0" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="340.0" y="336.6" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ฮาร์ดแวร์</text>
  <text x="340.0" y="362.5" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">หน่วยประมวลผล RAM ดิสก์ จอ ลำโพง การ์ดเครือข่าย</text>
  <text x="390.0" y="201.0" font-size="1" text-anchor="start" fill="#1f2937" xml:space="preserve"></text>
  <text x="392.0" y="202.0" font-size="12" text-anchor="start" fill="#1d4ed8" font-weight="bold" xml:space="preserve">การเรียกใช้บริการของระบบ (system call)</text>
  <text x="392.0" y="297.0" font-size="12" text-anchor="start" fill="#6b7280" xml:space="preserve">คำสั่งผ่านไดรเวอร์</text>
  <text x="392.0" y="107.0" font-size="12" text-anchor="start" fill="#6b7280" xml:space="preserve">ส่วนติดต่อผู้ใช้</text>
  <line x1="680.0" y1="395.0" x2="680.0" y2="25.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah)"/>
  <text x="700.0" y="60.0" font-size="13" text-anchor="start" fill="#1f2937" font-weight="bold" xml:space="preserve">ยิ่งสูง</text>
  <text x="700.0" y="79.0" font-size="13" text-anchor="start" fill="#1f2937" font-weight="bold" xml:space="preserve">ยิ่งซ่อน</text>
  <text x="700.0" y="98.0" font-size="13" text-anchor="start" fill="#1f2937" font-weight="bold" xml:space="preserve">รายละเอียด</text>
  <text x="700.0" y="330.0" font-size="13" text-anchor="start" fill="#1f2937" font-weight="bold" xml:space="preserve">ยิ่งต่ำ</text>
  <text x="700.0" y="349.0" font-size="13" text-anchor="start" fill="#1f2937" font-weight="bold" xml:space="preserve">ยิ่งใกล้</text>
  <text x="700.0" y="368.0" font-size="13" text-anchor="start" fill="#1f2937" font-weight="bold" xml:space="preserve">ฮาร์ดแวร์</text>
</svg>
