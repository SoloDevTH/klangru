problems:
- id: chinese.grammar.location-you-zai.p001
  topics:
  - chinese.grammar.location-you-zai
  difficulty: 1
  type: mcq
  stem: 书在桌子上。 (Shū zài zhuōzi shàng.) คำว่า 上 ในประโยคนี้แปลว่าอะไร
  choices:
  - id: a
    text: ใน
    feedback: ใน คือ 里 lǐ
  - id: b
    text: ข้าง ๆ
    feedback: ข้าง ๆ คือ 旁边 pángbiān
  - id: c
    text: บน
    correct: true
    feedback: ถูก 桌子上 = บนโต๊ะ ประโยคนี้แปลว่า หนังสืออยู่บนโต๊ะ
  - id: d
    text: ใต้
    feedback: ใต้ คือ 下 xià
  hints:
  - 桌子 = โต๊ะ 书 = หนังสือ
  - 上 shàng เป็นคำบอกทิศ ตรงข้ามกับ 下
  solution: 上 = **บน** 书在桌子上 = หนังสืออยู่บนโต๊ะ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.location-you-zai.p002
  topics:
  - chinese.grammar.location-you-zai
  difficulty: 1
  type: match
  stem: จับคู่คำบอกทิศกับความหมาย
  pairs:
  - left: 下边 xiàbian
    right: ล่าง ใต้
  - left: 里边 lǐbian
    right: ใน
  - left: 外边 wàibian
    right: นอก
  - left: 前边 qiánbian
    right: หน้า
  - left: 后边 hòubian
    right: หลัง
  hints:
  - 里 กับ 外 เป็นคู่ตรงข้าม (ใน นอก)
  - 前 กับ 后 เป็นคู่ตรงข้าม (หน้า หลัง)
  solution: 下边 ล่าง · 里边 ใน · 外边 นอก · 前边 หน้า · 后边 หลัง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.location-you-zai.p003
  topics:
  - chinese.grammar.location-you-zai
  difficulty: 2
  type: hanzi
  stem: เขียนอักษร 在 (zài) ที่แปลว่า อยู่ ตามลำดับขีด
  character: 在
  pinyin: zài
  meaning: อยู่ (ที่)
  hints:
  - 在 มี 6 ขีด ส่วนล่างขวาคือ 土 (ดิน)
  - เริ่มด้วยขีดนอนยาวและขีดเฉียง แล้วจึงเขียนขีดตั้งทางซ้าย ก่อนเขียน 土
  solution: 横 → 撇 → 竖 → 横 → 竖 → 横 รวม 6 ขีด (3 ขีดหลังคือ 土)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.location-you-zai.p004
  topics:
  - chinese.grammar.location-you-zai
  difficulty: 2
  type: mcq
  stem: ดูภาพ 猫在哪儿？ (แมวอยู่ที่ไหน)
  figure: &id001
    src: room-quiz.svg
    alt: 'ภาพห้อง: ด้านซ้ายมีกล่องซึ่งมีลูกบอลอยู่ข้างใน ตรงกลางเป็นโต๊ะ บนโต๊ะมีหนังสือ ใต้โต๊ะมีแมวนอนอยู่ ทางขวาของโต๊ะมีกระเป๋าวางบนพื้นติดกับเก้าอี้ โดยกระเป๋าอยู่ทางซ้ายของเก้าอี้ และเก้าอี้อยู่ขวาสุด'
    caption: ห้องของนักเรียนแลกเปลี่ยน
  choices:
  - id: a
    text: 猫在下边桌子。
    feedback: 'ลำดับผิด คำบอกทิศต้องอยู่หลังคำนาม: 桌子下边'
  - id: b
    text: 猫在桌子下边。
    correct: true
    feedback: ถูก แมวนอนอยู่ใต้โต๊ะ
  - id: c
    text: 猫在桌子上边。
    feedback: บนโต๊ะมีหนังสือ ไม่ใช่แมว
  - id: d
    text: 猫在箱子里边。
    feedback: ในกล่องมีลูกบอล
  hints:
  - หาแมวในภาพก่อน แล้วดูว่าอยู่ตรงไหนของอะไร
  - 'รูปประโยค: สิ่งของ + 在 + สถานที่ + คำบอกทิศ'
  solution: '**猫在桌子下边。** Māo zài zhuōzi xiàbian. แมวอยู่ใต้โต๊ะ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.location-you-zai.p005
  topics:
  - chinese.grammar.location-you-zai
  difficulty: 2
  type: order
  stem: นักเรียนแลกเปลี่ยนชาวจีนในหอพักที่เชียงใหม่ถามหาโทรศัพท์ เรียงคำเป็นประโยค "โทรศัพท์อยู่ในกระเป๋านักเรียน" (手机 shǒujī = โทรศัพท์มือถือ, 书包 shūbāo = กระเป๋านักเรียน)
  items:
  - 手机
  - 在
  - 书包
  - 里
  hints:
  - 'ประโยค 在: สิ่งของ + 在 + สถานที่'
  - คำบอกทิศ 里 วางหลังคำนาม 书包
  solution: '**手机在书包里。** Shǒujī zài shūbāo lǐ.'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.location-you-zai.p006
  topics:
  - chinese.grammar.location-you-zai
  difficulty: 2
  type: mcq
  stem: '"บนโต๊ะมีหนังสือหนึ่งเล่ม" ภาษาจีนพูดอย่างไร'
  choices:
  - id: a
    text: 上桌子有一本书。
    feedback: 'คำบอกทิศต้องอยู่หลังคำนาม: 桌子上 ไม่ใช่ 上桌子'
  - id: b
    text: 桌子上在一本书。
    feedback: บอกว่า "มี" ใช้ 有 ส่วน 在 ใช้เมื่อขึ้นต้นด้วยสิ่งของ
  - id: c
    text: 一本书有桌子上。
    feedback: ประโยค 有 ขึ้นต้นด้วยสถานที่
  - id: d
    text: 桌子上有一本书。
    correct: true
    feedback: ถูก สถานที่ + 有 + สิ่งของ ลำดับเหมือนภาษาไทย บนโต๊ะ มี หนังสือ
  hints:
  - ประโยคขึ้นต้นด้วยสถานที่ (บนโต๊ะ) แล้วตามด้วย มี
  - บนโต๊ะ ภาษาจีนพูดว่า โต๊ะ + บน
  solution: '**桌子上有一本书。** Zhuōzi shang yǒu yì běn shū. (สถานที่ + 有 + สิ่งของ)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.location-you-zai.p007
  topics:
  - chinese.grammar.location-you-zai
  difficulty: 3
  type: mcq
  stem: ดูภาพ 椅子左边有什么？ (ของที่วางติดกับเก้าอี้ทางด้านซ้ายคืออะไร)
  figure: *id001
  choices:
  - id: a
    text: 有一个书包。
    correct: true
    feedback: ถูก กระเป๋าวางอยู่บนพื้นทางซ้ายของเก้าอี้
  - id: b
    text: 有一只猫。
    feedback: แมวอยู่ใต้โต๊ะ ไม่ได้ติดกับเก้าอี้
  - id: c
    text: 有一个箱子。
    feedback: กล่องอยู่ทางซ้ายของโต๊ะ ไกลจากเก้าอี้
  - id: d
    text: 有一本书。
    feedback: หนังสืออยู่บนโต๊ะ
  hints:
  - หาเก้าอี้ก่อน (ขวาสุดของภาพ)
  - ดูของที่อยู่ติดกับเก้าอี้ทางด้านซ้าย
  solution: '**椅子左边有一个书包。** ทางซ้ายของเก้าอี้มีกระเป๋าหนึ่งใบ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.location-you-zai.p008
  topics:
  - chinese.grammar.location-you-zai
  difficulty: 3
  type: mcq
  stem: '"ในตู้เย็นไม่มีนม" (冰箱 bīngxiāng = ตู้เย็น, 牛奶 niúnǎi = นม) ประโยคใดถูกต้อง'
  choices:
  - id: a
    text: 牛奶不在冰箱里有。
    feedback: ผสมสองรูปประโยคเข้าด้วยกัน
  - id: b
    text: 冰箱里没有牛奶。
    correct: true
    feedback: ถูก ปฏิเสธ 有 ต้องใช้ 没有 เสมอ
  - id: c
    text: 冰箱里不有牛奶。
    feedback: 有 ปฏิเสธด้วย 不 ไม่ได้ ต้องเป็น 没有
  - id: d
    text: 冰箱没有里牛奶。
    feedback: 里 ต้องติดอยู่หลัง 冰箱
  hints:
  - 'รูปประโยค: สถานที่ + 有 + สิ่งของ'
  - 有 มีรูปปฏิเสธพิเศษ ไม่ใช้ 不
  solution: '**冰箱里没有牛奶。** ปฏิเสธ 有 ด้วย **没有** méiyǒu ส่วน 在 ปฏิเสธด้วย 不在'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.location-you-zai.p009
  topics:
  - chinese.grammar.location-you-zai
  difficulty: 3
  type: mcq
  stem: นักท่องเที่ยวชาวจีนที่สยามถามว่า BTS站在哪儿？ (สถานี BTS อยู่ที่ไหน) เราอยากตอบว่า "อยู่ทางขวา" ควรพูดว่าอะไร
  choices:
  - id: a
    text: 有右边。
    feedback: บอกตำแหน่งของสิ่งที่ถามถึงใช้ 在
  - id: b
    text: 右边在。
    feedback: '在 ต้องอยู่หน้าสถานที่: 在右边'
  - id: c
    text: 在右边。
    correct: true
    feedback: ถูก 右边 yòubian = ทางขวา
  - id: d
    text: 在左边。
    feedback: 左边 = ทางซ้าย
  hints:
  - ตอบแบบสั้นได้ด้วย 在 + ทิศ
  - ขวา คือ 右 yòu ซ้าย คือ 左 zuǒ
  solution: '**在右边。** Zài yòubian. (ประโยคเต็ม: BTS站在右边。)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.location-you-zai.p010
  topics:
  - chinese.grammar.location-you-zai
  difficulty: 3
  type: mcq
  stem: ที่วัดแห่งหนึ่งในกรุงเทพฯ นักท่องเที่ยวชาวจีนถามว่า 洗手间在哪儿？ (ห้องน้ำอยู่ที่ไหน) เราชี้ไปที่ห้องน้ำซึ่งอยู่ไกลออกไป ควรตอบว่าอะไร
  choices:
  - id: a
    text: 在这儿。
    feedback: 这儿 zhèr = ที่นี่ ใช้กับที่อยู่ใกล้ผู้พูด
  - id: b
    text: 在哪儿。
    feedback: 哪儿 nǎr เป็นคำถาม แปลว่า ที่ไหน
  - id: c
    text: 有那儿。
    feedback: บอกตำแหน่งใช้ 在 ไม่ใช่ 有
  - id: d
    text: 在那儿。
    correct: true
    feedback: ถูก 那儿 nàr = ที่นั่น (ไกลจากผู้พูด)
  hints:
  - 这 ใกล้ 那 ไกล 哪 เป็นคำถาม
  - ห้องน้ำอยู่ไกลออกไป
  solution: '**在那儿。** Zài nàr. (这儿 ที่นี่ · 那儿 ที่นั่น · 哪儿 ที่ไหน)'
  license: CC-BY-SA-4.0
  ai_assisted: true
