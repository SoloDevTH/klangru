<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei','Noto Sans Thai',sans-serif">
<title>โปสการ์ดภาษาจีนจากภูเก็ต พร้อมป้ายบอกส่วนประกอบ</title>
<defs></defs>
<rect x="0" y="0" width="780" height="440" fill="#fff"/>
<rect x="200.0" y="20.0" width="560.0" height="400.0" rx="8" fill="#fffdf5" stroke="#7a5a00" stroke-width="2"/>
<line x1="600.0" y1="40.0" x2="600.0" y2="400.0" stroke="#c9b98f" stroke-width="1.5" stroke-linecap="round"/>
<rect x="660.0" y="40.0" width="80.0" height="90.0" rx="2" fill="#fff" stroke="#c9b98f" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="700.0" y="92.0" font-size="14" text-anchor="middle" fill="#666" font-weight="normal">แสตมป์</text>
<line x1="615.0" y1="250.0" x2="745.0" y2="250.0" stroke="#c9b98f" stroke-width="1.2" stroke-linecap="round"/>
<line x1="615.0" y1="290.0" x2="745.0" y2="290.0" stroke="#c9b98f" stroke-width="1.2" stroke-linecap="round"/>
<text x="620.0" y="243.0" font-size="16" text-anchor="start" fill="#666" font-weight="normal">北京市</text>
<text x="620.0" y="283.0" font-size="16" text-anchor="start" fill="#666" font-weight="normal">李明 收</text>
<text x="220.0" y="70.0" font-size="19" text-anchor="start" fill="#1a1a1a" font-weight="normal">李明：</text>
<line x1="178.0" y1="64.0" x2="214.0" y2="64.0" stroke="#1f4e9c" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4,3"/>
<rect x="8.0" y="46.0" width="170.0" height="30.0" rx="8" fill="#fff" stroke="#1f4e9c" stroke-width="1.8"/>
<text x="93.0" y="67.0" font-size="15" text-anchor="middle" fill="#1f4e9c" font-weight="bold">称呼 คำขึ้นต้น</text>
<text x="252.0" y="108.0" font-size="19" text-anchor="start" fill="#1a1a1a" font-weight="normal">你好！</text>
<line x1="178.0" y1="102.0" x2="246.0" y2="102.0" stroke="#2a6a2a" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4,3"/>
<rect x="8.0" y="84.0" width="170.0" height="30.0" rx="8" fill="#fff" stroke="#2a6a2a" stroke-width="1.8"/>
<text x="93.0" y="105.0" font-size="15" text-anchor="middle" fill="#2a6a2a" font-weight="bold">问候 คำทักทาย</text>
<text x="252.0" y="146.0" font-size="19" text-anchor="start" fill="#1a1a1a" font-weight="normal">我现在在普吉岛。这里的海很蓝，</text>
<line x1="178.0" y1="140.0" x2="246.0" y2="140.0" stroke="#b3261e" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4,3"/>
<rect x="8.0" y="122.0" width="170.0" height="30.0" rx="8" fill="#fff" stroke="#b3261e" stroke-width="1.8"/>
<text x="93.0" y="143.0" font-size="15" text-anchor="middle" fill="#b3261e" font-weight="bold">正文 เนื้อความ</text>
<text x="220.0" y="180.0" font-size="19" text-anchor="start" fill="#1a1a1a" font-weight="normal">天气也很好。我每天都去游泳，</text>
<text x="220.0" y="214.0" font-size="19" text-anchor="start" fill="#1a1a1a" font-weight="normal">还吃了很多海鲜。</text>
<text x="252.0" y="256.0" font-size="19" text-anchor="start" fill="#1a1a1a" font-weight="normal">祝你</text>
<line x1="178.0" y1="250.0" x2="246.0" y2="250.0" stroke="#5b3a8c" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4,3"/>
<rect x="8.0" y="232.0" width="170.0" height="30.0" rx="8" fill="#fff" stroke="#5b3a8c" stroke-width="1.8"/>
<text x="93.0" y="253.0" font-size="15" text-anchor="middle" fill="#5b3a8c" font-weight="bold">祝福 คำอวยพร</text>
<text x="220.0" y="290.0" font-size="19" text-anchor="start" fill="#1a1a1a" font-weight="normal">天天开心！</text>
<text x="500.0" y="338.0" font-size="19" text-anchor="start" fill="#1a1a1a" font-weight="normal">小美</text>
<line x1="178.0" y1="332.0" x2="494.0" y2="332.0" stroke="#7a5a00" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4,3"/>
<rect x="8.0" y="314.0" width="170.0" height="30.0" rx="8" fill="#fff" stroke="#7a5a00" stroke-width="1.8"/>
<text x="93.0" y="335.0" font-size="15" text-anchor="middle" fill="#7a5a00" font-weight="bold">署名 ผู้เขียน</text>
<text x="480.0" y="372.0" font-size="19" text-anchor="start" fill="#1a1a1a" font-weight="normal">11月2日</text>
<line x1="178.0" y1="366.0" x2="474.0" y2="366.0" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4,3"/>
<rect x="8.0" y="348.0" width="170.0" height="30.0" rx="8" fill="#fff" stroke="#666" stroke-width="1.8"/>
<text x="93.0" y="369.0" font-size="15" text-anchor="middle" fill="#666" font-weight="bold">日期 วันที่</text>
<rect x="208.0" y="128.0" width="5.0" height="96.0" rx="2" fill="#b3261e" stroke="#b3261e" stroke-width="0"/>
<text x="400.0" y="410.0" font-size="13" text-anchor="middle" fill="#666" font-weight="normal">普吉岛 Pǔjí Dǎo = เกาะภูเก็ต · 海鲜 hǎixiān = อาหารทะเล</text>
</svg>
