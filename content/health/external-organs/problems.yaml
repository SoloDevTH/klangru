problems:
  - id: health.body.external-organs.p001
    topics: [health.body.external-organs]
    difficulty: 1
    type: mcq
    stem: "อวัยวะใดใช้ดมกลิ่น"
    choices:
      - { id: a, text: "จมูก", correct: true }
      - { id: b, text: "ลิ้น", feedback: "ลิ้นใช้รับรส เช่น หวาน เค็ม ส่วนการดมกลิ่นใช้จมูก" }
      - { id: c, text: "หู", feedback: "หูใช้ฟังเสียงและช่วยทรงตัว ไม่ได้ใช้ดมกลิ่น" }
      - { id: d, text: "ตา", feedback: "ตาใช้มองเห็น ไม่ได้ใช้ดมกลิ่น" }
    hints:
      - "นึกถึงตอนได้กลิ่นข้าวหอม ๆ เราสูดลมเข้าทางไหน"
      - "อวัยวะนี้มีรูสองรูและใช้หายใจด้วย"
    solution: "จมูกใช้หายใจและดมกลิ่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.external-organs.p002
    topics: [health.body.external-organs]
    difficulty: 1
    type: match
    stem: "จับคู่อวัยวะกับหน้าที่หลัก"
    pairs:
      - { left: "ตา", right: "มองเห็น" }
      - { left: "หู", right: "ได้ยินเสียง" }
      - { left: "ลิ้น", right: "รับรส" }
      - { left: "จมูก", right: "ดมกลิ่น" }
      - { left: "ผิวหนัง", right: "รับรู้ร้อน เย็น และสัมผัส" }
    hints:
      - "ลองหลับตา ปิดหู หรือบีบจมูก แล้วนึกว่ารับรู้อะไรไม่ได้"
      - "อวัยวะที่ห่อหุ้มทั้งตัวคือผิวหนัง"
    solution: "ตา → มองเห็น, หู → ได้ยินเสียง, ลิ้น → รับรส, จมูก → ดมกลิ่น, ผิวหนัง → รับรู้ร้อน เย็น และสัมผัส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.external-organs.p003
    topics: [health.body.external-organs]
    difficulty: 1
    type: mcq
    stem: "วันสงกรานต์ ฝุ่นและน้ำกระเด็นเข้าตา ควรทำอย่างไร"
    choices:
      - { id: a, text: "กะพริบตาหลาย ๆ ครั้ง หรือล้างตาด้วยน้ำสะอาด", correct: true }
      - { id: b, text: "ใช้มือขยี้ตาแรง ๆ", feedback: "มืออาจสกปรก และการขยี้ทำให้ฝุ่นขูดตาเป็นแผลได้" }
      - { id: c, text: "ใช้ผ้าเช็ดหน้าของเพื่อนเช็ดตา", feedback: "ผ้าของคนอื่นอาจมีเชื้อโรค ควรล้างด้วยน้ำสะอาด" }
      - { id: d, text: "ปล่อยไว้ไม่ต้องทำอะไร แม้จะเจ็บมาก", feedback: "ถ้าเจ็บมากหรือมองไม่ชัด ต้องบอกผู้ใหญ่และไปพบแพทย์" }
    hints:
      - "สิ่งที่ใช้ต้องสะอาด และไม่ทำให้ตาเป็นแผล"
      - "น้ำตาและน้ำสะอาดช่วยพาฝุ่นออก"
    solution: "กะพริบตาหรือล้างตาด้วยน้ำสะอาด ห้ามขยี้ ถ้ายังเจ็บหรือตาแดงมากให้บอกผู้ใหญ่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.external-organs.p004
    topics: [health.body.external-organs]
    difficulty: 1
    type: text
    stem: "อวัยวะในปากที่หุ้มรอบโคนฟันและยึดฟันให้แน่นเรียกว่าอะไร (ตอบเป็นคำเดียว)"
    accepted: ["เหงือก"]
    misconceptions:
      - { match: "ลิ้น", feedback: "ลิ้นใช้รับรสและช่วยกลืน ส่วนที่หุ้มรอบโคนฟันคือเหงือก" }
      - { match: "ฟัน", feedback: "ฟันเป็นส่วนที่ถูกยึดไว้ ส่วนที่หุ้มรอบโคนฟันคือเหงือก" }
    hints:
      - "เวลาแปรงฟัน ต้องแปรงให้ถึงขอบของส่วนนี้ด้วย"
      - "เป็นเนื้อสีชมพูรอบโคนฟัน"
    solution: "เหงือก หุ้มรอบโคนฟันและยึดฟันไว้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.external-organs.p005
    topics: [health.body.external-organs]
    difficulty: 2
    type: match
    stem: "ดูภาพใบหน้า แล้วจับคู่ตัวอักษรกับชื่ออวัยวะ"
    figure:
      src: face-letters.svg
      alt: "ภาพใบหน้าเด็ก มีวงกลมตัวอักษรชี้ไปที่อวัยวะ: A ชี้ที่ตาข้างซ้ายของภาพ, B ชี้ที่อวัยวะด้านข้างศีรษะฝั่งขวา, C ชี้ที่อวัยวะกลางใบหน้าใต้ตา, D ชี้ที่อวัยวะสีแดงด้านล่างของใบหน้า, E ชี้ที่ส่วนสีน้ำตาลเข้มบนศีรษะ"
    pairs:
      - { left: "A", right: "ตา" }
      - { left: "B", right: "หู" }
      - { left: "C", right: "จมูก" }
      - { left: "D", right: "ปาก" }
      - { left: "E", right: "ผม" }
    hints:
      - "เริ่มจากส่วนที่อยู่บนสุดของศีรษะก่อน"
      - "อวัยวะที่อยู่ด้านข้างศีรษะสองข้างใช้ฟังเสียง"
    solution: "A ตา, B หู, C จมูก, D ปาก, E ผม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.external-organs.p006
    topics: [health.body.external-organs]
    difficulty: 2
    type: numeric
    stem: "ต้นแปรงฟันวันละ 2 ครั้ง ทุกวัน ใน 1 สัปดาห์ (7 วัน) ต้นแปรงฟันกี่ครั้ง (ตอบเป็นตัวเลขในหน่วยครั้ง)"
    answer: { value: 14, unit: ครั้ง }
    misconceptions:
      - { match: 9, feedback: "ดูเหมือนนำ 2 บวก 7 แต่ต้องแปรง 2 ครั้งทุกวัน จึงต้องคูณ" }
      - { match: 7, feedback: "7 ครั้งคือแปรงวันละครั้งเท่านั้น ต้นแปรงวันละ 2 ครั้ง" }
    hints:
      - "1 วันแปรง 2 ครั้ง 2 วันแปรงกี่ครั้ง"
      - "นับเพิ่มทีละ 2 ไปจนครบ 7 วัน หรือคูณ 2 กับ 7"
    solution: "$2 \\times 7 = 14$ ครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.external-organs.p007
    topics: [health.body.external-organs]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นวิธีดูแลหูที่ถูกต้อง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "เช็ดทำความสะอาดเฉพาะใบหูด้านนอก", correct: true }
      - { id: b, text: "ไม่เปิดเสียงหูฟังดังมากนาน ๆ", correct: true }
      - { id: c, text: "ใช้ไม้จิ้มฟันแคะเมื่อคันหู", feedback: "ไม้จิ้มฟันแหลม อาจทำให้รูหูหรือแก้วหูเป็นแผล" }
      - { id: d, text: "ปวดหูแล้วไม่ต้องบอกใคร รอให้หายเอง", feedback: "ปวดหูอาจเป็นการติดเชื้อ ควรบอกผู้ใหญ่และไปพบแพทย์" }
    hints:
      - "สิ่งที่แข็งหรือแหลมไม่ควรเข้าไปในรูหู"
      - "เสียงดังมากนาน ๆ ทำให้หูได้ยินลดลง"
    solution: "ข้อถูกคือ เช็ดเฉพาะใบหูด้านนอก และไม่ฟังเสียงดังนาน ๆ ส่วนการแคะหูด้วยของแหลมและการไม่บอกผู้ใหญ่เมื่อปวดหูเป็นอันตราย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.external-organs.p008
    topics: [health.body.external-organs]
    difficulty: 2
    type: numeric
    stem: "ห้องเรียน ป.1 มีนักเรียน 30 คน ครูตรวจเล็บตอนเช้า พบนักเรียนเล็บยาว 6 คน มีนักเรียนเล็บสั้นและสะอาดกี่คน (ตอบเป็นตัวเลขในหน่วยคน)"
    answer: { value: 24, unit: คน }
    misconceptions:
      - { match: 36, feedback: "ต้องเอาคนเล็บยาวออกจากทั้งห้อง จึงใช้การลบ ไม่ใช่การบวก" }
    hints:
      - "นักเรียนทั้งห้องแบ่งเป็นสองกลุ่ม คือเล็บยาวกับเล็บสั้น"
      - "นำจำนวนทั้งห้องลบด้วยคนที่เล็บยาว"
    solution: "$30 - 6 = 24$ คน คนที่เล็บยาวควรตัดเล็บให้สั้น เพราะสิ่งสกปรกและเชื้อโรคติดอยู่ใต้เล็บยาวได้ง่าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.external-organs.p009
    topics: [health.body.external-organs]
    difficulty: 3
    type: mcq
    stem: "ช่วงที่ค่าฝุ่นละอองขนาดเล็ก (PM2.5) ในเชียงใหม่สูงมาก นักเรียนควรดูแลจมูกและการหายใจอย่างไร"
    choices:
      - { id: a, text: "ใส่หน้ากากเมื่อออกนอกอาคาร และลดการวิ่งเล่นกลางแจ้ง", correct: true }
      - { id: b, text: "วิ่งออกกำลังกายกลางแจ้งให้นานขึ้น จะได้แข็งแรง", feedback: "เวลาวิ่งเราหายใจแรงและถี่ ยิ่งสูดฝุ่นเข้าไปมาก ควรออกกำลังกายในอาคารแทน" }
      - { id: c, text: "ไม่ต้องทำอะไร เพราะขนจมูกกรองฝุ่นได้ทั้งหมด", feedback: "ขนจมูกกรองฝุ่นใหญ่ได้ แต่ฝุ่นเล็กมากอย่าง PM2.5 ผ่านเข้าไปถึงปอดได้" }
      - { id: d, text: "แคะจมูกบ่อย ๆ เพื่อเอาฝุ่นออก", feedback: "การแคะจมูกทำให้เป็นแผลและนำเชื้อโรคจากมือเข้าจมูก" }
    hints:
      - "ฝุ่นขนาดเล็กมากผ่านขนจมูกได้"
      - "ยิ่งออกแรงมาก เรายิ่งหายใจเข้าลึกและถี่"
    solution: "ใส่หน้ากากเมื่ออยู่นอกอาคาร และลดกิจกรรมกลางแจ้ง ถ้าหายใจลำบาก ไอมาก หรือแน่นหน้าอก ให้บอกผู้ใหญ่และไปพบแพทย์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.external-organs.p010
    topics: [health.body.external-organs]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนล้างมือด้วยสบู่ก่อนกินข้าวกลางวัน"
    items:
      - "เปิดน้ำให้มือเปียก"
      - "ถูสบู่ให้ทั่วฝ่ามือ หลังมือ ซอกนิ้ว และปลายเล็บ"
      - "ล้างฟองสบู่ออกด้วยน้ำสะอาด"
      - "เช็ดมือให้แห้งด้วยผ้าหรือกระดาษที่สะอาด"
    hints:
      - "สบู่จะเกิดฟองได้ดีเมื่อมือเปียก"
      - "ขั้นสุดท้ายคือทำให้มือแห้ง เพราะมือเปียกเชื้อโรคติดง่าย"
    solution: "ทำให้มือเปียก → ถูสบู่ให้ทั่วทุกซอก → ล้างด้วยน้ำสะอาด → เช็ดให้แห้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.external-organs.p011
    topics: [health.body.external-organs]
    difficulty: 3
    type: mcq
    stem: "หลังเล่นน้ำในคลองหน้าบ้าน มะลิรู้สึกว่ามีน้ำค้างในหู ข้อใดเหมาะที่สุด"
    choices:
      - { id: a, text: "เอียงศีรษะข้างนั้นลง ให้น้ำไหลออกเอง แล้วเช็ดใบหูด้านนอกให้แห้ง", correct: true }
      - { id: b, text: "ใช้ก้านไม้แคะลึก ๆ ให้น้ำออก", feedback: "ของแข็งทำให้รูหูเป็นแผล และน้ำคลองอาจมีเชื้อโรคเข้าแผลได้" }
      - { id: c, text: "ใส่น้ำเพิ่มเข้าไปอีก เพื่อดันน้ำเก่าออก", feedback: "ไม่ควรใส่อะไรเข้าไปในหูเอง" }
      - { id: d, text: "ปวดหูมากก็ปล่อยไว้ เดี๋ยวก็หาย", feedback: "ปวดหูหลังเล่นน้ำอาจเป็นหูอักเสบ ต้องบอกผู้ใหญ่เพื่อไปพบแพทย์" }
    hints:
      - "แรงโน้มถ่วงช่วยให้น้ำไหลออกได้"
      - "ห้ามใส่ของแข็งเข้าไปในรูหู"
    solution: "เอียงศีรษะให้น้ำไหลออก แล้วเช็ดใบหูด้านนอก ถ้าปวดหู มีน้ำหนองไหล หรือได้ยินไม่ชัด ให้บอกผู้ใหญ่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.external-organs.p012
    topics: [health.body.external-organs]
    difficulty: 3
    type: mcq
    stem: "ข้อใดไม่ใช่อวัยวะภายนอก"
    choices:
      - { id: a, text: "หัวใจ", correct: true }
      - { id: b, text: "เล็บ", feedback: "เล็บอยู่ที่ปลายนิ้ว มองเห็นได้ จึงเป็นอวัยวะภายนอก" }
      - { id: c, text: "เหงือก", feedback: "เหงือกอยู่ในปาก แต่อ้าปากก็มองเห็นได้ หลักสูตรจัดเป็นอวัยวะภายนอก (อวัยวะในช่องปาก)" }
      - { id: d, text: "คอ", feedback: "คอมองเห็นได้จากภายนอก จึงเป็นอวัยวะภายนอก" }
    hints:
      - "อวัยวะภายนอกคือส่วนที่เรามองเห็นได้"
      - "อวัยวะใดอยู่ในอกและมองไม่เห็น"
    solution: "หัวใจอยู่ในทรวงอก มองไม่เห็นจากภายนอก จึงเป็นอวัยวะภายใน ส่วนเล็บ เหงือก และคอ เป็นอวัยวะภายนอก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.external-organs.p013
    topics: [health.body.external-organs]
    difficulty: 3
    type: text
    stem: "เมื่ออากาศร้อนหรือวิ่งเล่นมาก ผิวหนังจะขับของเหลวออกมาช่วยระบายความร้อน ของเหลวนี้เรียกว่าอะไร"
    accepted: ["เหงื่อ", "น้ำเหงื่อ"]
    misconceptions:
      - { match: "น้ำตา", feedback: "น้ำตาออกจากตา ส่วนของเหลวที่ผิวหนังขับออกมาคือเหงื่อ" }
    hints:
      - "หลังวิ่งเล่น เสื้อมักเปียกจากของเหลวนี้"
      - "มีรสเค็มเล็กน้อย"
    solution: "เหงื่อ ผิวหนังขับเหงื่อออกทางรูขุมขน เมื่อเหงื่อระเหยร่างกายจะเย็นลง จึงควรอาบน้ำเพื่อล้างเหงื่อและสิ่งสกปรก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.external-organs.p014
    topics: [health.body.external-organs]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "แก้มช่วยพ่อแม่ในทุ่งนาหลังฝนตก ข้อใดเป็นการดูแลเท้าที่ถูกต้อง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "สวมรองเท้าบูตหรือรองเท้าหุ้มส้นขณะลงนา", correct: true }
      - { id: b, text: "กลับถึงบ้านแล้วล้างเท้าด้วยสบู่ และเช็ดซอกนิ้วให้แห้ง", correct: true }
      - { id: c, text: "ถ้าเท้ามีแผล ให้ล้างแผลและบอกผู้ใหญ่", correct: true }
