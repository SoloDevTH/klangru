      - { id: c, text: "เชื่อรุ่นพี่ เพราะกลิ่นหอมแปลว่าไม่อันตราย", feedback: "กลิ่นผลไม้ไม่ได้ทำให้ปลอดภัย ไอที่สูดเข้าไปมีสารเคมีและนิโคติน" }
