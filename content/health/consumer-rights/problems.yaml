    text: ยังไม่โพสต์ข้อความที่ไม่มีหลักฐาน เก็บยาพร้อมใบเสร็จ สอบถามเภสัชกรประจำร้าน และถ้ายังสงสัยให้แจ้ง อย. 1556 ตรวจสอบ
    correct: true
  - id: b
    text: โพสต์เลยเพื่อเตือนคนอื่น ยิ่งแรงยิ่งดี
