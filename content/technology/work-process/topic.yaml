id: technology.living.work-process
subject: technology
title:
  th: กระบวนการทำงาน ทักษะการจัดการ และมารยาทในการทำงาน
  en: Work process, management skills and work etiquette
summary: กระบวนการทำงานสี่ขั้นตั้งแต่วิเคราะห์ วางแผน ลงมือทำ ถึงประเมินผลและปรับปรุง การตั้งเป้าหมายและเครื่องมือช่วยจัดการ การหาเส้นทางที่ต้องรอกันเพื่อลดเวลา และมารยาทในการทำงาน
difficulty: 2.5
minutes: 30
prerequisites:
- technology.living.self-care-household
encompasses:
- id: technology.living.self-care-household
  weight: 0.2
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  title: วงจรกระบวนการทำงาน 4 ขั้น
  src: cycle.svg
  alt: แผนภาพวงจรสี่กล่องตามเข็มนาฬิกา เริ่มจากกล่องวิเคราะห์งาน ลูกศรไปกล่องวางแผน ลงไปกล่องลงมือทำ ไปทางซ้ายที่กล่องประเมินผลและปรับปรุง และลูกศรขึ้นกลับไปกล่องวิเคราะห์งาน มีคำกำกับว่าถ้าผลไม่ถึงเป้าหมายให้กลับไปวิเคราะห์หรือวางแผนใหม่
- type: figure
  title: ผังเวลาเตรียมงานวันเกิด
  src: timeline.svg
  alt: ผังเวลาสองแถวจาก 0 ถึง 100 นาที แถวคนทำมีงาน A ซื้อของ 0 ถึง 30 นาที งาน B ผสมแป้ง 30 ถึง 45 นาที งาน C จัดโต๊ะ 45 ถึง 85 นาที และงาน E แต่งหน้า 90 ถึง 100 นาที แถวเตาอบมีงาน D อบขนม 45 ถึง 90 นาที ไม่ต้องใช้คน เส้นประบอกว่าเสร็จที่ 100 นาที
- type: worked-example
  title: ลดเวลาซื้อของเหลือ 20 นาที เวลาทั้งหมดเปลี่ยนไปอย่างไร
  problem: จากผังเวลาเตรียมงานวันเกิด ถ้างาน A ซื้อของลดลงเหลือ 20 นาที โดยงานอื่นเหมือนเดิม งานทั้งหมดจะเสร็จเมื่อใด
  steps:
  - text: ดูลูกโซ่ A → B → D (อบ) → E ซึ่งแต่ละขั้นรอขั้นก่อนหน้า เป็นเส้นทางวิกฤตที่กำหนดเวลาเสร็จทั้งหมด
    why: ลดเวลาบนเส้นทางนี้เท่านั้นที่จะเปลี่ยนเวลารวม
  - text: เวลาของเส้นทางใหม่ = 20 + 15 + 45 + 10 = 90 นาที
  - text: ตรวจงาน C ซึ่งเริ่มเมื่อ B เสร็จที่ 35 นาที และเสร็จที่ 75 นาที ยังไม่เกินเวลาที่อบเสร็จคือ 80 นาที จึงไม่ทำให้ต้องรอเพิ่ม
    why: งานที่ไม่อยู่บนเส้นทางวิกฤตต้องเสร็จก่อนขั้นที่ต้องรอ จึงจะไม่กระทบเวลารวม
  answer: เสร็จใน 90 นาที เร็วขึ้น 10 นาทีจากเดิมที่ 100 นาที
- type: check
  problem: technology.living.work-process.p002
  prompt: ลองนึกถึงงานที่คุณเคยทำแล้วไม่รู้ว่าเสร็จหรือยัง
- type: worked-example
  title: ประเมินผลการทำขนมสองรอบ
  problem: รอบแรกได้ขนมสวย 18 ชิ้นจากทั้งหมด 24 ชิ้น หลังปรับวิธีอบ รอบที่สองได้ขนมสวย 22 ชิ้นจาก 24 ชิ้น การปรับปรุงได้ผลหรือไม่
  steps:
  - text: คำนวณสัดส่วนขนมสวยของรอบแรก 18 ÷ 24 = 0.75 หรือร้อยละ 75
  - text: คำนวณสัดส่วนขนมสวยของรอบที่สอง 22 ÷ 24 ≈ 0.917 หรือร้อยละ 91.7
    why: ใช้ร้อยละเพื่อเทียบกันได้ตรงแม้จำนวนชิ้นจะต่างกัน
  - text: สมมติเป้าหมายคือร้อยละ 90 รอบแรกยังไม่ถึงเป้า ส่วนรอบที่สองผ่านเป้า
  - text: สรุปว่าการปรับได้ผล ควรบันทึกวิธีนี้ไว้ใช้รอบถัดไปและตรวจซ้ำ
    why: การบันทึกผลทำให้รู้ว่าการปรับปรุงช่วยได้จริง ไม่ได้เป็นเพียงความรู้สึก
  answer: รอบที่สองดีขึ้นจากร้อยละ 75 เป็นร้อยละ 91.7 และผ่านเป้าหมายร้อยละ 90 ควรบันทึกวิธีนี้ไว้
- type: check
  problem: technology.living.work-process.p010
  prompt: ถ้าขนมของคุณสุกไม่ทั่ว คุณจะเริ่มหาสาเหตุจากอะไรก่อน
glossary:
- term: กระบวนการทำงาน
  definition: ลำดับการทำงาน 4 ขั้น ได้แก่ วิเคราะห์งาน วางแผน ลงมือทำ และประเมินผลและปรับปรุง ทำซ้ำเป็นวงจรได้
- term: เป้าหมายของงาน
  definition: สิ่งที่งานต้องบรรลุ เขียนให้วัดหรือตรวจได้ เพื่อใช้บอกว่างานเสร็จและเทียบกับผลได้
- term: รายการตรวจ (checklist)
  definition: รายการงานย่อยที่ต้องทำให้ครบ ใช้ทำเครื่องหมายเมื่อทำเสร็จ เพื่อไม่ให้ตกหล่น
- term: ตารางงาน
  definition: ตารางที่ระบุงาน ผู้รับผิดชอบ และเวลาที่ต้องเสร็จ
- term: เส้นทางวิกฤต
  definition: ลำดับงานที่ต้องรอกันต่อเนื่องและยาวที่สุด เวลาของเส้นทางนี้คือเวลาที่งานทั้งหมดเสร็จเร็วที่สุด
flashcards:
- front: กระบวนการทำงานสี่ขั้นมีอะไรบ้าง
  back: วิเคราะห์งาน วางแผน ลงมือทำ และประเมินผลและปรับปรุง
- front: ทำไมงานต้องมีเป้าหมายที่วัดได้
  back: เพื่อรู้ว่างานเสร็จเมื่อใด และเทียบผลกับสิ่งที่ตั้งไว้เพื่อประเมินและปรับปรุงได้
- front: เส้นทางวิกฤตคืออะไร
  back: ลำดับงานที่ต้องรอกันต่อเนื่องและยาวที่สุด ซึ่งกำหนดเวลาเสร็จของงานทั้งหมด
- front: ระหว่างรอให้หม้อเดือด ควรทำอย่างไร
  back: ทำงานอื่นที่ไม่ต้องรอผลของหม้อ เช่น ล้างผัก เพื่อให้เวลาไม่เปล่าประโยชน์
