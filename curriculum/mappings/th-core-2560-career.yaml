# หัวข้อในคลังที่สอนเนื้อหาของตัวชี้วัดกลุ่มสาระการงานอาชีพ (ง 1.1, ง 2.1) จริง
framework: th-core-2560-career
mappings:
  - topic: management.principles.functions
    indicators: ["ง 1.1 ม.4-6/3"]
    coverage: partial
    note: "สอนความรู้เรื่องการจัดการ (วางแผน จัดองค์การ ชี้นำ ควบคุม และขั้นตอนการควบคุม) ซึ่งเป็นพื้นของทักษะการจัดการในการทำงาน แต่ตัวชี้วัดวัดทักษะจากการลงมือทำงานจริงซึ่งทำในแอปไม่ได้"
  - topic: business.entrepreneurship.careers
    indicators: [ง 2.1 ป.4/1, ง 2.1 ป.5/2, ง 2.1 ป.6/2, ง 2.1 ม.1/1, ง 2.1 ม.2/1, ง 2.1 ม.2/2, ง 2.1 ม.3/1, ง 2.1 ม.3/2, ง 2.1 ม.4-6/1, ง 2.1 ม.3/3]
    coverage: full
    note: ความหมายและความสำคัญของอาชีพ ความแตกต่างของอาชีพ (กลุ่มงาน อิสระกับรับจ้าง) ความรู้ ความสามารถ และคุณธรรมที่อาชีพต้องการ และแนวทางเลือกอาชีพจากความสนใจ ความถนัด และความต้องการของตลาด
  - topic: business.entrepreneurship.careers
    indicators: [ง 2.1 ป.5/1, ง 2.1 ป.6/1, ง 2.1 ม.1/2, ง 2.1 ม.4-6/4, ง 2.1 ม.2/3, ง 2.1 ม.4-6/3, ง 2.1 ม.4-6/2]
    coverage: partial
    note: สอนวิธีสำรวจข้อมูลอาชีพในชุมชนและวิธีสำรวจตนเอง แต่การลงมือสำรวจจริงทำนอกแอป
  - topic: business.entrepreneurship.business-plan
    indicators: [ง 2.1 ม.1/3]
    coverage: partial
    note: อธิบายความสำคัญของการสร้างอาชีพ (รายได้ พึ่งตนเอง สร้างงาน เพิ่มมูลค่าทรัพยากรท้องถิ่น p003) แต่การเห็นความสำคัญเป็นเจตคติที่วัดในแอปไม่ได้
  - topic: technology.living.home-living-skills
    indicators: [ง 1.1 ม.4-6/1]
    coverage: full
    note: อธิบายวิธีการทำงานเพื่อการดำรงชีวิตครบทั้งการดูแลเสื้อผ้า (อ่านป้ายดูแล ขจัดคราบ ซ่อมด้วยวิธีด้นถอยหลัง) การเตรียม ประกอบ และเก็บอาหารตามหลักความปลอดภัย 5 ประการและช่วงอุณหภูมิอันตราย การทำความสะอาดที่ไม่ผสมสารเคมี การซ่อมเล็กน้อยอย่างปลอดภัย และการปลูกผักในกระถาง
  - topic: technology.living.problem-solving-learning
    indicators: [ง 1.1 ม.1/3]
    coverage: full
    note: สอนการตัดสินใจอย่างมีเหตุผลด้วยเกณฑ์ น้ำหนัก และตารางให้คะแนน การเปรียบเทียบผลทดลองซ้ำ และการเลือกทางเลือกที่ตรวจสอบได้ ซึ่งโจทย์ให้ฝึกตัดสินจากสถานการณ์
  - topic: technology.living.problem-solving-learning
    indicators: [ง 1.1 ม.2/1, ง 1.1 ม.2/2, ง 1.1 ม.4-6/4, ง 1.1 ม.4-6/5]
    coverage: partial
    note: สอนขั้นของการแก้ปัญหา การถามทำไมซ้ำเพื่อหาต้นเหตุ การทดลองทีละอย่าง และการประเมินความน่าเชื่อถือของแหล่งความรู้ผ่านบทเรียนและโจทย์สถานการณ์ แต่การนำทักษะไปใช้แก้ปัญหาจริงในการทำงาน การค้นหาความรู้จริง และการทดลองนอกแอปต้องทำเอง
  - topic: technology.living.resource-saving
    indicators: [ง 1.1 ม.3/3]
    coverage: full
    note: อภิปรายการจัดการงานเพื่อประหยัดพลังงาน ทรัพยากร และสิ่งแวดล้อมได้ครบ ทั้งหลัก 5R การคิดค่าไฟตลอดอายุการใช้งาน และการเลือกทางเลือกที่คุ้มค่าจากสถานการณ์
  - topic: technology.living.resource-saving
    indicators: [ง 1.1 ป.4/4, ง 1.1 ป.5/4, ง 1.1 ม.2/3, ง 1.1 ม.4-6/7]
    coverage: partial
    note: สอนความรู้เรื่องพลังงาน ทรัพยากร การคำนวณหน่วยไฟฟ้า และการเลือกวิธีที่ประหยัดและคุ้มค่าในสถานการณ์ แต่การใช้พลังงานและทรัพยากรจริงในงานประจำวันต้องทำนอกแอป และจิตสำนึกเป็นเจตคติที่วัดในแอปได้เพียงจากการเลือกในสถานการณ์
  - topic: technology.living.self-care-household
    indicators: [ง 1.1 ป.1/1, ง 1.1 ป.2/1, ง 1.1 ป.3/1]
    coverage: full
  - topic: technology.living.self-care-household
    indicators: [ง 1.1 ป.1/2, ง 1.1 ป.2/2, ง 1.1 ป.2/3, ง 1.1 ป.3/2, ง 1.1 ป.3/3]
    coverage: partial
    note: สอนวิธีทำงานช่วยเหลือเป็นขั้นตอน เหตุผลของแต่ละขั้น การเลือกวัสดุและเครื่องมือให้ตรงงานและประหยัด และความปลอดภัยของของมีคม ไฟฟ้า และสารทำความสะอาด (ผ่านบทเรียน โจทย์เลือกวิธีที่ถูก และโจทย์เรียงขั้นตอน) แต่การใช้เครื่องมือและทำงานจริงที่บ้านและโรงเรียน รวมทั้งความรอบคอบและความสะอาดที่ปรากฏในการทำงานจริง ต้องทำนอกแอป
  - topic: technology.living.teamwork-work-ethic
    indicators: [ง 1.1 ป.4/2, ง 1.1 ป.6/2, ง 1.1 ม.1/2, ง 1.1 ม.3/2, ง 1.1 ม.4-6/6]
    coverage: partial
    note: สอนกระบวนการกลุ่ม (เป้าหมายร่วม บทบาท การแบ่งงาน การติดตาม) การรับมือเมื่อสมาชิกติดขัดหรือเห็นต่าง คุณธรรมอย่างความซื่อสัตย์ ความเสียสละ และการให้เครดิต และเหตุผลของลักษณะนิสัยในการทำงาน ผ่านกรณีศึกษาและโจทย์เลือกการกระทำ แต่การทำงานกลุ่มจริง การแสดงพฤติกรรมขยัน อดทน และรับผิดชอบ และการประเมินจากครูทำนอกแอป จึงเป็น partial ทั้งหมดตามขอบเขตของแผน
  - topic: technology.living.work-process
    indicators: [ง 1.1 ป.4/1, ง 1.1 ป.5/1, ง 1.1 ป.6/1, ง 1.1 ม.1/1, ง 1.1 ม.3/1]
    coverage: full
  - topic: technology.living.work-process
    indicators: [ง 1.1 ป.4/3, ง 1.1 ป.5/2, ง 1.1 ป.5/3, ง 1.1 ป.6/3]
    coverage: partial
    note: สอนเหตุผลของแต่ละขั้นกระบวนการทำงาน การตั้งเป้าหมาย เครื่องมือจัดการ (รายการตรวจ ตารางงาน การวิเคราะห์เส้นทางที่ต้องรอ) และมารยาทผ่านสถานการณ์และโจทย์เลือกวิธีที่เหมาะสม แต่การใช้ทักษะจัดการงานจริงให้เป็นระบบและประณีต และการปฏิบัติตนด้วยมารยาทกับสมาชิกในครอบครัวและผู้อื่นจริง ทำนอกแอป
