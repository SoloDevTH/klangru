id: management.public.public-administration
subject: management
title: { th: พื้นฐานรัฐประศาสนศาสตร์และการบริหารราชการไทย, en: Foundations of public administration and Thai public administration }
summary: ระบบราชการของเวเบอร์ การบริหารภาครัฐแนวใหม่ ธรรมาภิบาล การบริหารราชการส่วนกลาง ส่วนภูมิภาค และส่วนท้องถิ่น การจัดบริการสาธารณะ และการป้องกันการทุจริต
difficulty: 5
minutes: 40
prerequisites: [management.principles.organizing]
encompasses:
  - { id: management.principles.organizing, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: thai-admin.svg
    alt: "แผนภาพสามคอลัมน์ ส่วนกลางใช้หลักการรวมอำนาจ ประกอบด้วยสำนักนายกรัฐมนตรี กระทรวง ทบวง กรม ข้าราชการสังกัดกระทรวง ทบวง กรม ดูแลนโยบายระดับประเทศ ส่วนภูมิภาคใช้หลักการแบ่งอำนาจ ประกอบด้วยจังหวัดและอำเภอ ผู้ว่าราชการจังหวัดและนายอำเภอได้รับแต่งตั้งจากส่วนกลาง ส่วนท้องถิ่นใช้หลักการกระจายอำนาจ ประกอบด้วยองค์การบริหารส่วนจังหวัด เทศบาล องค์การบริหารส่วนตำบล กรุงเทพมหานครและเมืองพัทยา ผู้บริหารและสภามาจากการเลือกตั้งของประชาชนในพื้นที่"
    caption: "การบริหารราชการไทยสามส่วนและหลักการของแต่ละส่วน"
  - { type: check, problem: management.public.public-administration.p002 }
  - type: worked-example
    title: จ้างเอกชนดูแลไฟฟ้าส่องสว่างคุ้มค่ากว่าหรือไม่
    problem: "เทศบาลเมืองแห่งหนึ่ง (สมมติ) ดูแลเสาไฟฟ้าส่องสว่าง 1,200 ต้น ปีที่แล้วทำเองใช้งบ 2.88 ล้านบาท เอกชนเสนอรับจ้าง 2.4 ล้านบาทต่อปี แต่เทศบาลต้องมีเจ้าหน้าที่ตรวจงานและควบคุมสัญญา ประมาณ 0.3 ล้านบาทต่อปี จงเทียบต้นทุนต่อต้นและบอกสิ่งที่ต้องพิจารณาเพิ่ม"
    steps:
      - text: "ทำเอง: $2{,}880{,}000 \\div 1{,}200 = 2{,}400$ บาทต่อต้นต่อปี"
      - text: "จ้างเอกชน: รวมค่าควบคุมสัญญา $(2{,}400{,}000 + 300{,}000) \\div 1{,}200 = 2{,}250$ บาทต่อต้นต่อปี"
        why: "ถ้าลืมค่าควบคุมสัญญาจะได้ 2,000 บาท ซึ่งดูคุ้มค่าเกินจริง"
      - text: "ประหยัด $2{,}400 - 2{,}250 = 150$ บาทต่อต้น หรือ 180,000 บาทต่อปี"
      - text: "ประสิทธิผลและความรับผิดชอบ: ในสัญญาต้องกำหนดเวลาซ่อมเมื่อมีผู้แจ้ง เช่น ภายใน 48 ชั่วโมง มีค่าปรับ และประชาชนยังแจ้งเรื่องผ่านเทศบาลได้"
        why: "ประชาชนยังถือว่าเทศบาลรับผิดชอบ แม้เอกชนเป็นผู้ทำงาน"
      - text: "ความเป็นธรรมและความโปร่งใส: จัดจ้างด้วยวิธีเปิดเผย เปิดเผยผลการเสนอราคา และตรวจว่ากรรมการไม่มีผลประโยชน์ทับซ้อน"
    answer: "จ้างเอกชนถูกกว่า 150 บาทต่อต้นต่อปี (2,250 เทียบกับ 2,400 บาท) แต่ควรจ้างก็ต่อเมื่อสัญญากำหนดมาตรฐานบริการ ค่าปรับ และช่องทางร้องเรียนที่ชัดเจน"
  - { type: check, problem: management.public.public-administration.p010, prompt: "อย่าลืมต้นทุนที่รัฐยังต้องจ่ายเองแม้จ้างเอกชน" }
  - type: worked-example
    title: ผลประโยชน์ทับซ้อนในคณะกรรมการจัดซื้อ
    problem: "องค์การบริหารส่วนตำบลแห่งหนึ่ง (สมมติ) แต่งตั้งคณะกรรมการพิจารณาผลการจัดซื้อรถบรรทุกน้ำ กรรมการคนหนึ่งพบว่าบริษัทที่เสนอราคาต่ำสุดเป็นของพี่ชายตน ควรทำอย่างไร"
    steps:
      - text: "ระบุว่าเป็นผลประโยชน์ทับซ้อน: กรรมการมีประโยชน์ส่วนตัวที่อาจกระทบการตัดสินใจในหน้าที่"
        why: "แม้บริษัทนั้นจะเสนอราคาต่ำสุดจริง การที่ญาติร่วมพิจารณาทำให้ประชาชนสงสัยความเป็นกลางได้"
      - text: "กรรมการเปิดเผยความสัมพันธ์เป็นลายลักษณ์อักษรต่อผู้มีอำนาจแต่งตั้ง"
      - text: "ถอนตัวจากการพิจารณา และแต่งตั้งกรรมการคนอื่นแทน"
      - text: "เปิดเผยผลการพิจารณาและเหตุผลต่อสาธารณะตามช่องทางที่กำหนด"
    answer: "เปิดเผยความสัมพันธ์ ถอนตัว ให้ผู้อื่นพิจารณาแทน และเปิดเผยผลอย่างโปร่งใส การจัดซื้อดำเนินต่อได้โดยไม่มีข้อสงสัยเรื่องความเป็นกลาง"
  - type: figure
    src: p-permit.svg
    alt: "ผังขั้นตอนห้าขั้นเรียงจากซ้ายไปขวา 1 ยื่นคำขอ 1 วันทำการ 2 ตรวจเอกสาร 3 วันทำการ 3 ตรวจพื้นที่ 5 วันทำการ 4 พิจารณาแบบแปลน 7 วันทำการ 5 ลงนามออกใบอนุญาต 2 วันทำการ แต่ละขั้นเริ่มได้เมื่อขั้นก่อนหน้าเสร็จ"
    caption: "ขั้นตอนการขออนุญาตก่อสร้างอาคารของเทศบาลแห่งหนึ่ง (สมมติ) ใช้ในโจทย์ข้อ 7–9"
glossary:
  - { term: ระบบราชการ, definition: "รูปแบบองค์การตามแนวคิดของเวเบอร์ ที่มีสายบังคับบัญชา กฎระเบียบเป็นลายลักษณ์อักษร การแบ่งงานตามความเชี่ยวชาญ และระบบคุณธรรม" }
  - { term: การเบี่ยงเบนเป้าหมาย, definition: "การที่ผู้ปฏิบัติยึดการทำตามระเบียบเป็นเป้าหมายเสียเอง จนลืมจุดประสงค์ของระเบียบนั้น" }
  - { term: การบริหารภาครัฐแนวใหม่ (NPM), definition: "แนวคิดที่นำวิธีของธุรกิจมาใช้ในภาครัฐ เช่น มุ่งผลงาน วัดผลด้วยตัวชี้วัด การแข่งขัน และการจ้างเอกชน" }
  - { term: ธรรมาภิบาล, definition: "หลักการบริหารที่ดี เช่น นิติธรรม คุณธรรม ความโปร่งใส การมีส่วนร่วม ความรับผิดชอบ และความคุ้มค่า" }
  - { term: หลักการแบ่งอำนาจ, definition: "ส่วนกลางส่งเจ้าหน้าที่ของตนไปประจำในพื้นที่และมอบอำนาจบางส่วนให้ เป็นหลักของราชการส่วนภูมิภาค" }
  - { term: หลักการกระจายอำนาจ, definition: "การให้องค์กรที่ประชาชนในพื้นที่เลือกตั้งมีอำนาจตัดสินใจ งบประมาณ และบุคลากรของตนเอง เป็นหลักของราชการส่วนท้องถิ่น" }
  - { term: ผลประโยชน์ทับซ้อน, definition: "สถานการณ์ที่ผู้มีหน้าที่สาธารณะมีประโยชน์ส่วนตัวที่อาจกระทบการตัดสินใจในหน้าที่" }
flashcards:
  - { front: "ราชการไทยสามส่วนและหลักการ", back: "ส่วนกลาง = รวมอำนาจ · ส่วนภูมิภาค (จังหวัด อำเภอ) = แบ่งอำนาจ · ส่วนท้องถิ่น (อบจ. เทศบาล อบต. กทม. เมืองพัทยา) = กระจายอำนาจ" }
  - { front: "ลักษณะระบบราชการของเวเบอร์", back: "ลำดับขั้น กฎเป็นลายลักษณ์อักษร แบ่งงานตามความเชี่ยวชาญ ไม่ใช้ความสัมพันธ์ส่วนตัว ระบบคุณธรรม" }
  - { front: "หลักธรรมาภิบาลหกหลัก", back: "นิติธรรม คุณธรรม ความโปร่งใส การมีส่วนร่วม ความรับผิดชอบ ความคุ้มค่า" }
  - { front: "NPM ต่างจากระบบราชการดั้งเดิมอย่างไร", back: "เน้นผลงานมากกว่ากฎ ใช้ตัวชี้วัด การแข่งขัน และการจ้างเอกชน มองประชาชนเป็นลูกค้า" }
  - { front: "พบผลประโยชน์ทับซ้อนต้องทำอย่างไร", back: "เปิดเผยเป็นลายลักษณ์อักษร ถอนตัวจากการพิจารณา และเปิดเผยผลอย่างโปร่งใส" }
