<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" font-family="sans-serif" font-size="14">
  <title>แผนภูมิน้ำตกเริ่มจากรายได้ 500,000 บาท หักต้นทุนขาย 300,000 บาทเหลือกำไรขั้นต้น 200,000 บาท หักค่าใช้จ่าย 150,000 บาทเหลือกำไรสุทธิ 50,000 บาท</title>
  <rect x="0" y="0" width="780" height="360" fill="#ffffff"/>
  <rect x="120" y="90.0" width="90" height="230.0" fill="#1d4ed8" opacity="0.85"/>
  <text x="165.0" y="82.0" text-anchor="middle" font-size="13" fill="#1f2937">500,000</text>
  <text x="165.0" y="342" text-anchor="middle" font-size="13" fill="#1f2937">รายได้</text>
  <rect x="250" y="90.0" width="90" height="138.0" fill="#dc2626" opacity="0.85"/>
  <text x="295.0" y="82.0" text-anchor="middle" font-size="13" fill="#1f2937">-300,000</text>
  <text x="295.0" y="342" text-anchor="middle" font-size="13" fill="#1f2937">ต้นทุนขาย</text>
  <rect x="380" y="228.0" width="90" height="92.0" fill="#1d4ed8" opacity="0.85"/>
  <text x="425.0" y="220.0" text-anchor="middle" font-size="13" fill="#1f2937">200,000</text>
  <text x="425.0" y="342" text-anchor="middle" font-size="13" fill="#1f2937">กำไรขั้นต้น</text>
  <rect x="510" y="228.0" width="90" height="69.0" fill="#dc2626" opacity="0.85"/>
  <text x="555.0" y="220.0" text-anchor="middle" font-size="13" fill="#1f2937">-150,000</text>
  <text x="555.0" y="342" text-anchor="middle" font-size="13" fill="#1f2937">ค่าใช้จ่าย</text>
  <rect x="640" y="297.0" width="90" height="23.0" fill="#1d4ed8" opacity="0.85"/>
  <text x="685.0" y="289.0" text-anchor="middle" font-size="13" fill="#1f2937">50,000</text>
  <text x="685.0" y="342" text-anchor="middle" font-size="13" fill="#1f2937">กำไรสุทธิ</text>
  <line x1="100" y1="320" x2="730" y2="320" stroke="#1f2937" stroke-width="1.5"/>
  <text x="380" y="36" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">จากรายได้ถึงกำไรสุทธิ (ข้อมูลสมมติ หน่วยบาท)</text>
</svg>
