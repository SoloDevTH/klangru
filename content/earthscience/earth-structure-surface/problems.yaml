problems:
  - id: earthscience.geology.earth-structure-surface.p001
    topics: [earthscience.geology.earth-structure-surface]
    difficulty: 1
    type: order
    stem: "เรียงชั้นของโลกจากผิวโลกเข้าไปถึงศูนย์กลาง"
    items:
      - "เปลือกโลก"
      - "เนื้อโลก"
      - "แก่นโลกชั้นนอก"
      - "แก่นโลกชั้นใน"
    hints:
      - "เราอาศัยอยู่บนชั้นนอกสุด"
      - "แก่นโลกมีสองชั้น ชั้นในสุดเป็นของแข็ง"
    solution: "เปลือกโลก → เนื้อโลก → แก่นโลกชั้นนอก (เหล็กและนิกเกิลหลอมเหลว) → แก่นโลกชั้นใน (เหล็กและนิกเกิลที่เป็นของแข็ง)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.earth-structure-surface.p002
    topics: [earthscience.geology.earth-structure-surface]
    difficulty: 1
    type: match
    stem: "จับคู่กระบวนการกับตัวอย่าง"
    pairs:
      - { left: "การผุพังเชิงกายภาพ", right: "รากไม้ชอนไชจนหินแตกเป็นก้อน" }
      - { left: "การผุพังเชิงเคมี", right: "น้ำฝนที่เป็นกรดอ่อนละลายหินปูนจนเป็นถ้ำ" }
      - { left: "การกร่อน", right: "คลื่นกัดเซาะชายฝั่งบางขุนเทียนจนแนวฝั่งถอยร่น" }
      - { left: "การสะสมตัวของตะกอน", right: "ดินดอนสามเหลี่ยมที่ปากแม่น้ำเจ้าพระยา" }
    hints:
      - "ผุพังเกิดกับที่ กร่อนพาไปที่อื่น สะสมตัวคือตกทับถม"
      - "เชิงเคมีคือมีสารใหม่เกิดขึ้น"
    solution: "รากไม้ทำให้หินแตกเป็นการผุพังเชิงกายภาพ กรดละลายหินปูนเป็นการผุพังเชิงเคมี คลื่นกัดเซาะเป็นการกร่อน และดินดอนสามเหลี่ยมเกิดจากการสะสมตัวของตะกอน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.earth-structure-surface.p003
    topics: [earthscience.geology.earth-structure-surface]
    difficulty: 1
    type: mcq
    stem: "ชาวสวนขุดหลุมปลูกต้นไม้ ชั้นดินใดมีสีเข้ม มีฮิวมัสและรากพืชมากที่สุด เหมาะกับการเพาะปลูก"
    choices:
      - { id: a, text: "ชั้น A (ดินบน)", correct: true }
      - { id: b, text: "ชั้น B (ดินล่าง)", feedback: "ชั้น B สะสมดินเหนียวและเหล็กที่ถูกชะลงมา มีฮิวมัสน้อยกว่าชั้น A" }
      - { id: c, text: "ชั้น C", feedback: "ชั้น C เป็นหินที่ผุพังบางส่วน แทบไม่มีอินทรียวัตถุ" }
      - { id: d, text: "ชั้น R", feedback: "ชั้น R คือหินพื้นที่ยังไม่ผุพัง พืชเจริญไม่ได้" }
    hints:
      - "ฮิวมัสมาจากซากพืชที่ร่วงลงมาด้านบน"
      - "ชั้นที่อยู่ใต้ชั้นซากใบไม้"
    solution: "ชั้น A เป็นดินบนที่ได้ฮิวมัสจากซากพืชด้านบน มีรากพืชมาก จึงสีเข้มและเหมาะกับการเพาะปลูก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.earth-structure-surface.p004
    topics: [earthscience.geology.earth-structure-surface]
    difficulty: 2
    type: mcq
    stem: "ถ้ำหินปูนและหินงอกหินย้อยในจังหวัดกาญจนบุรีเกิดจากกระบวนการใดเป็นหลัก"
    choices:
      - { id: a, text: "การผุพังเชิงเคมี น้ำฝนที่ละลายคาร์บอนไดออกไซด์เป็นกรดอ่อนละลายหินปูน", correct: true }
      - { id: b, text: "การผุพังเชิงกายภาพจากอุณหภูมิกลางวันกลางคืนต่างกัน", feedback: "การขยายและหดตัวทำให้หินร้าว แต่ไม่ทำให้เกิดโพรงขนาดใหญ่และหินงอกหินย้อย" }
      - { id: c, text: "ลมพัดเม็ดทรายขัดสีหินจนเป็นโพรง", feedback: "ถ้ำหินปูนอยู่ใต้ดิน ลมพัดทรายเข้าไปกัดได้ไม่มาก ตัวการหลักคือน้ำที่เป็นกรดอ่อน" }
      - { id: d, text: "ภูเขาไฟระเบิดทำให้เกิดโพรง", feedback: "หินปูนเป็นหินตะกอน ไม่ได้เกิดจากภูเขาไฟ" }
    hints:
      - "หินปูนคือแคลเซียมคาร์บอเนต ละลายได้ในกรด"
      - "หินงอกหินย้อยเกิดจากสารที่ละลายแล้วตกผลึกใหม่"
    solution: "น้ำฝนละลายคาร์บอนไดออกไซด์เป็นกรดคาร์บอนิก ซึมลงไปละลายหินปูนจนเป็นโพรง เมื่อน้ำหยดและระเหย แคลเซียมคาร์บอเนตตกผลึกเป็นหินงอกหินย้อย จึงเป็นการผุพังเชิงเคมี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.earth-structure-surface.p005
    topics: [earthscience.geology.earth-structure-surface]
    difficulty: 2
    type: numeric
    stem: "เปลือกโลกทวีปหนาเฉลี่ยราว 35 km โลกมีรัศมี 6,371 km เปลือกโลกหนาคิดเป็นร้อยละเท่าใดของรัศมีโลก"
    answer: { value: 0.55, tolerance: 0.01, unit: "%" }
    misconceptions:
      - { match: 182, feedback: "นำรัศมีโลกหารด้วยความหนาเปลือกโลก ต้องกลับกัน" }
      - { match: 0.0055, feedback: "ยังไม่ได้คูณ 100 เพื่อเปลี่ยนเป็นร้อยละ" }
    hints:
      - "ร้อยละ $= \\dfrac{\\text{ความหนา}}{\\text{รัศมี}} \\times 100$"
      - "$35 \\div 6{,}371 \\times 100$"
    solution: "$\\dfrac{35}{6{,}371} \\times 100 \\approx 0.55\\%$ เปลือกโลกบางมากเมื่อเทียบกับขนาดของโลก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.earth-structure-surface.p006
    topics: [earthscience.geology.earth-structure-surface]
    difficulty: 2
    type: mcq
    stem: "ธาตุใดมีมากที่สุดในเปลือกโลกเมื่อคิดโดยมวล"
    choices:
      - { id: a, text: "ออกซิเจน", correct: true }
      - { id: b, text: "เหล็ก", feedback: "เหล็กมากที่สุดเมื่อคิดทั้งดวงโลกเพราะอยู่ในแก่นโลก แต่ในเปลือกโลกมีราวร้อยละ 5" }
      - { id: c, text: "ซิลิคอน", feedback: "ซิลิคอนมากเป็นอันดับสอง ราวร้อยละ 28" }
      - { id: d, text: "ไนโตรเจน", feedback: "ไนโตรเจนมากที่สุดในอากาศ ไม่ใช่ในเปลือกโลก" }
    hints:
      - "แร่ส่วนใหญ่ในเปลือกโลกเป็นสารประกอบซิลิเกตและออกไซด์"
      - "ควอตซ์มีสูตร $\\mathrm{SiO_2}$"
    solution: "ออกซิเจนมีราวร้อยละ 46 ของมวลเปลือกโลก อยู่ในรูปสารประกอบกับซิลิคอนและธาตุอื่นในแร่ ซิลิคอนเป็นอันดับสอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.earth-structure-surface.p007
    topics: [earthscience.geology.earth-structure-surface]
    difficulty: 2
    type: numeric
    stem: "ดินจากแปลงนาชั่งได้ 50 g อบแห้งแล้วเหลือ 40 g ใช้สูตร ร้อยละความชื้น $= \\dfrac{\\text{มวลดินชื้น} - \\text{มวลดินแห้ง}}{\\text{มวลดินแห้ง}} \\times 100$ ดินนี้มีความชื้นร้อยละเท่าใด"
    answer: { value: 25, tolerance: 0.1, unit: "%" }
    misconceptions:
      - { match: 20, feedback: "หารด้วยมวลดินชื้น 50 g แต่สูตรที่กำหนดให้หารด้วยมวลดินแห้ง" }
      - { match: 10, feedback: "10 g คือมวลน้ำ ยังต้องหารด้วยมวลดินแห้งแล้วคูณ 100" }
    hints:
      - "มวลน้ำ $= 50 - 40$"
      - "นำมวลน้ำหารด้วย 40 แล้วคูณ 100"
    solution: "มวลน้ำ $= 50 - 40 = 10$ g ร้อยละความชื้น $= \\dfrac{10}{40} \\times 100 = 25\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.earth-structure-surface.p008
    topics: [earthscience.geology.earth-structure-surface]
    difficulty: 3
    type: numeric
    stem: "นักเรียนเขย่าดินกับน้ำในขวดแล้วตั้งทิ้งไว้ 1 วัน ได้ตะกอนสามชั้นดังภาพ ดินตัวอย่างนี้มีทรายร้อยละเท่าใดของตะกอนทั้งหมด"
    figure: { src: p-sediment-jar.svg, alt: "ขวดใสมีน้ำอยู่ด้านบน ตะกอนสามชั้นที่ก้นขวด ข้างขวดมีไม้บรรทัดหน่วยเซนติเมตร ชั้นล่างคือทราย จากระดับ 0 ถึง 6 cm ชั้นกลางคือทรายแป้ง จาก 6 ถึง 9 cm ชั้นบนคือดินเหนียว จาก 9 ถึง 10 cm เหนือขึ้นไปเป็นน้ำ" }
    answer: { value: 60, tolerance: 0.5, unit: "%" }
    misconceptions:
      - { match: 50, feedback: "ใช้ความสูงทั้งหมด 12 cm ซึ่งรวมน้ำด้านบนด้วย ต้องใช้เฉพาะความหนาของตะกอน 10 cm" }
      - { match: 6, feedback: "6 คือความหนาของชั้นทรายเป็นเซนติเมตร ต้องเทียบกับตะกอนทั้งหมดแล้วคิดเป็นร้อยละ" }
    hints:
      - "อ่านความหนาของแต่ละชั้นจากไม้บรรทัด"
      - "ร้อยละทราย $=$ ความหนาชั้นทราย $\\div$ ความหนาตะกอนทั้งหมด $\\times 100$"
    solution: "ทรายหนา 6 cm ทรายแป้ง 3 cm ดินเหนียว 1 cm รวม 10 cm ทรายคิดเป็น $6/10 \\times 100 = 60\\%$ ดินนี้มีทรายมาก ระบายน้ำดีแต่เก็บน้ำได้น้อย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.earth-structure-surface.p009
    topics: [earthscience.geology.earth-structure-surface]
    difficulty: 3
    type: mcq
    stem: "ชาวนาที่ทุ่งรังสิต จ.ปทุมธานี ตรวจดินได้ pH 4.5 ข้าวโตช้า ควรปรับปรุงดินอย่างไรก่อนเป็นอันดับแรก"
    choices:
      - { id: a, text: "ใส่ปูนมาร์ลหรือปูนขาวเพื่อลดความเป็นกรด", correct: true }
      - { id: b, text: "ใส่กำมะถันเพิ่ม", feedback: "กำมะถันทำให้ดินเป็นกรดมากขึ้น ใช้กับดินที่เป็นเบส" }
      - { id: c, text: "ใส่ปุ๋ยไนโตรเจนอย่างเดียวให้มากขึ้น", feedback: "ดินที่เป็นกรดจัดทำให้พืชดูดธาตุอาหารได้ไม่ดี ต้องแก้ pH ก่อน" }
      - { id: d, text: "ไม่ต้องแก้ เพราะข้าวชอบดินกรดจัด", feedback: "pH 4.5 เป็นกรดจัดเกินไปสำหรับพืชส่วนใหญ่ รวมทั้งข้าว" }
    hints:
      - "pH ต่ำกว่า 7 เป็นกรด ยิ่งต่ำยิ่งเป็นกรดมาก"
      - "ต้องเติมสารที่เป็นเบสเพื่อสะเทิน"
    solution: "pH 4.5 เป็นดินเปรี้ยว ปูนมาร์ลและปูนขาวเป็นเบส ช่วยสะเทินกรดให้ pH ใกล้ 6–7 พืชจึงดูดธาตุอาหารได้ดีขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.earth-structure-surface.p010
    topics: [earthscience.geology.earth-structure-surface]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ชายฝั่งบางขุนเทียนถูกคลื่นกัดเซาะ ชุมชนกำลังเลือกวิธีชะลอการกัดเซาะ ข้อใดช่วยได้จริง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ปลูกป่าชายเลน รากช่วยยึดดินและลดแรงคลื่น", correct: true }
      - { id: b, text: "ปักแนวไม้ไผ่ชะลอคลื่นให้ตะกอนตกสะสมด้านหลัง", correct: true }
      - { id: c, text: "สร้างเขื่อนหินกันคลื่น แต่ต้องติดตามว่าชายฝั่งข้างเคียงถูกกัดเซาะมากขึ้นหรือไม่", correct: true }
      - { id: d, text: "ขุดทรายและโคลนจากชายฝั่งไปถมที่อื่น", feedback: "การขุดตะกอนออกทำให้ชายฝั่งเหลือวัสดุน้อยลง ถูกกัดเซาะเร็วขึ้น" }
      - { id: e, text: "ตัดป่าชายเลนเพื่อให้คลื่นผ่านได้สะดวก", feedback: "ป่าชายเลนเป็นแนวกันคลื่นตามธรรมชาติ ตัดแล้วกัดเซาะมากขึ้น" }
    hints:
      - "วิธีที่ดีต้องลดพลังงานคลื่นหรือช่วยให้ตะกอนสะสม"
      - "ทุกวิธีมีผลข้างเคียงที่ต้องคิด"
    solution: "ป่าชายเลน แนวไม้ไผ่ และเขื่อนหินช่วยลดแรงคลื่นหรือดักตะกอนได้ แต่เขื่อนหินแพงและอาจย้ายปัญหาไปชายฝั่งข้างเคียง ส่วนการขุดตะกอนและตัดป่าชายเลนทำให้กัดเซาะมากขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.earth-structure-surface.p011
    topics: [earthscience.geology.earth-structure-surface]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "การเปลี่ยนแปลงผิวโลกข้อใดเกิดขึ้นอย่างรวดเร็ว ภายในไม่กี่นาทีถึงไม่กี่วัน (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ดินถล่มบนภูเขาหลังฝนตกหนัก", correct: true }
      - { id: b, text: "น้ำป่าไหลหลากพาหินและดินลงมาทับถมที่เชิงเขา", correct: true }
      - { id: c, text: "แม่น้ำกัดเซาะจนเป็นหุบเขาลึก", feedback: "การกัดหุบเขาลึกใช้เวลาหลายพันถึงหลายล้านปี" }
      - { id: d, text: "เสาเฉลียงคอดลงเป็นรูปดอกเห็ด", feedback: "เสาเฉลียงเกิดจากการผุพังและกร่อนที่ช้ามาก ใช้เวลานานมาก" }
      - { id: e, text: "ตะกอนสะสมจนเกิดที่ราบลุ่มเจ้าพระยา", feedback: "ที่ราบลุ่มเกิดจากตะกอนสะสมนานหลายพันปี" }
    hints:
      - "เหตุการณ์ใดที่คนเห็นเกิดขึ้นได้ทันตา"
      - "ภูมิประเทศขนาดใหญ่ส่วนใหญ่ใช้เวลานานมาก"
    solution: "ดินถล่มและน้ำป่าไหลหลากเกิดเร็ว ส่วนหุบเขาลึก เสาเฉลียง และที่ราบลุ่มเจ้าพระยาเกิดจากกระบวนการที่ช้ามาก ผิวโลกเปลี่ยนได้ทั้งเร็วและช้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.earth-structure-surface.p012
    topics: [earthscience.geology.earth-structure-surface]
    difficulty: 3
    type: match
    stem: "จับคู่ปัจจัยการเกิดดินกับผลที่เกิด"
    pairs:
      - { left: "หินต้นกำเนิด", right: "หินแกรนิตผุได้ดินปนทราย หินดินดานผุได้ดินเหนียว" }
      - { left: "ภูมิอากาศร้อนชื้น", right: "หินผุพังเร็ว ดินหนา" }
      - { left: "สิ่งมีชีวิต", right: "ซากพืชและไส้เดือนเพิ่มฮิวมัสในดินบน" }
      - { left: "ความลาดชันของพื้นที่", right: "บนไหล่เขาชัน ดินบางเพราะถูกกร่อนง่าย" }
    hints:
      - "ดินได้แร่มาจากหินที่ผุ"
      - "บนที่ลาดชัน น้ำไหลแรงพาดินไปง่าย"
    solution: "หินต้นกำเนิดกำหนดเนื้อดินและแร่ ภูมิอากาศร้อนชื้นเร่งการผุพัง สิ่งมีชีวิตเพิ่มฮิวมัส และพื้นที่ลาดชันทำให้ดินบาง"
