<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" font-family="sans-serif" font-size="14">
<title>ภาวะผู้นำตามสถานการณ์</title>
<rect x="0" y="0" width="860" height="520" fill="#ffffff"/>
<text x="430.0" y="26.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">ภาวะผู้นำตามสถานการณ์: เลือกแบบการนำตามความพร้อมของผู้ตาม</text>
<rect x="200.0" y="60.0" width="300.0" height="150.0" rx="0" fill="#e3efd9" stroke="#555" stroke-width="1.2"/>
<text x="350.0" y="125.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">S3 ร่วมมือ</text>
<text x="350.0" y="152.0" text-anchor="middle" font-size="12" fill="#222">สนับสนุน ฟัง ให้มีส่วนร่วม</text>
<rect x="500.0" y="60.0" width="300.0" height="150.0" rx="0" fill="#f9ecd0" stroke="#555" stroke-width="1.2"/>
<text x="650.0" y="125.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">S2 สอนงาน</text>
<text x="650.0" y="152.0" text-anchor="middle" font-size="12" fill="#222">อธิบาย ชี้แนะ ให้กำลังใจ</text>
<rect x="200.0" y="210.0" width="300.0" height="150.0" rx="0" fill="#dbe8f5" stroke="#555" stroke-width="1.2"/>
<text x="350.0" y="275.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">S4 มอบหมาย</text>
<text x="350.0" y="302.0" text-anchor="middle" font-size="12" fill="#222">ให้ตัดสินใจและรับผิดชอบเอง</text>
<rect x="500.0" y="210.0" width="300.0" height="150.0" rx="0" fill="#f4d9d9" stroke="#555" stroke-width="1.2"/>
<text x="650.0" y="275.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">S1 สั่งการ</text>
<text x="650.0" y="302.0" text-anchor="middle" font-size="12" fill="#222">บอกชัดว่าทำอะไร ติดตามใกล้ชิด</text>
<line x1="200.0" y1="360.0" x2="820.0" y2="360.0" stroke="#444" stroke-width="1.5"/>
<polygon points="820.0,360.0 811.7,363.5 811.7,356.5" fill="#444"/>
<line x1="200.0" y1="360.0" x2="200.0" y2="40.0" stroke="#444" stroke-width="1.5"/>
<polygon points="200.0,40.0 203.5,48.3 196.5,48.3" fill="#444"/>
<text x="500.0" y="382.0" text-anchor="middle" font-size="13" fill="#222">พฤติกรรมมุ่งงาน (สั่ง ชี้แนะ) มากขึ้น →</text>
<text x="176" y="210" text-anchor="middle" font-size="13" transform="rotate(-90 176 210)">พฤติกรรมมุ่งสัมพันธ์ (สนับสนุน) มากขึ้น →</text>
<rect x="200.0" y="410.0" width="150.0" height="56.0" rx="0" fill="#dbe8f5" stroke="#555" stroke-width="1"/>
<text x="275.0" y="432.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">R4</text>
<text x="275.0" y="452.0" text-anchor="middle" font-size="11" fill="#222">ทำได้ และมั่นใจ</text>
<rect x="350.0" y="410.0" width="150.0" height="56.0" rx="0" fill="#e3efd9" stroke="#555" stroke-width="1"/>
<text x="425.0" y="432.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">R3</text>
<text x="425.0" y="452.0" text-anchor="middle" font-size="11" fill="#222">ทำได้ แต่ไม่มั่นใจ</text>
<rect x="500.0" y="410.0" width="150.0" height="56.0" rx="0" fill="#f9ecd0" stroke="#555" stroke-width="1"/>
<text x="575.0" y="432.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">R2</text>
<text x="575.0" y="452.0" text-anchor="middle" font-size="11" fill="#222">ยังทำไม่ได้ แต่อยากทำ</text>
<rect x="650.0" y="410.0" width="150.0" height="56.0" rx="0" fill="#f4d9d9" stroke="#555" stroke-width="1"/>
<text x="725.0" y="432.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">R1</text>
<text x="725.0" y="452.0" text-anchor="middle" font-size="11" fill="#222">ยังทำไม่ได้ และไม่มั่นใจ</text>
<text x="190.0" y="443.0" text-anchor="end" font-size="12" fill="#222">ความพร้อมของผู้ตาม</text>
<text x="500.0" y="490.0" text-anchor="middle" font-size="12" fill="#222">สูง ←—————————————————→ ต่ำ</text>
</svg>