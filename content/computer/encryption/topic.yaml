id: computer.security.encryption
subject: computer
title: { th: การเข้ารหัสลับ, en: "Encryption" }
summary: รหัสแบบเลื่อนและแบบแทนที่ จุดอ่อนจากการลองทุกกุญแจและการนับความถี่ การเข้ารหัสด้วย XOR กุญแจสมมาตรกับกุญแจสาธารณะ ลายมือชื่อดิจิทัล และการทำงานของ HTTPS
difficulty: 4.5
minutes: 45
prerequisites: [computer.security.cybersecurity-basics, computer.data.binary]
encompasses:
  - { id: computer.security.cybersecurity-basics, weight: 0.3 }
  - { id: computer.data.binary, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: caesar.svg
    alt: "แถบตัวอักษรสองแถว แถวบนคือข้อความต้นฉบับ A ถึง Z แถวล่างคือตัวที่ได้หลังเลื่อนไป 3 ตำแหน่ง A เป็น D, B เป็น E ไปจนถึง W เป็น Z, X เป็น A, Y เป็น B และ Z เป็น C ตัวอักษร A E M N O T ถูกเน้นสีส้ม ใต้ภาพเขียนว่า MEET AT NOON กลายเป็น PHHW DW QRRQ และ X เป็น A, Y เป็น B, Z เป็น C เพราะเลยตัว Z แล้ววนกลับไปเริ่มที่ A (mod 26)"
    caption: "รหัสซีซาร์ กุญแจ k = 3"
  - type: worked-example
    title: ลองทุกกุญแจถอดรหัสซีซาร์
    problem: "ผิงดักได้ข้อความ `FVMRK GEOI` ซึ่งเข้ารหัสด้วยรหัสซีซาร์แต่ไม่รู้กุญแจ จงหาข้อความต้นฉบับและกุญแจ เพื่อแสดงว่าทำไมรหัสนี้ไม่ปลอดภัย"
    steps:
      - text: "กุญแจที่ใช้ได้มีแค่ 1 ถึง 25 จึงลองถอดทีละค่า โดยเลื่อนถอยหลัง k ตำแหน่ง"
        why: "ปริภูมิกุญแจเล็กมาก การลองทุกค่าใช้เวลาไม่กี่นาทีด้วยมือ และไม่ถึงหนึ่งวินาทีด้วยโปรแกรม"
      - text: "k = 1 ได้ EULQJ FDNH, k = 2 ได้ DTKPI ECMG, k = 3 ได้ CSJOH DBLF อ่านไม่รู้เรื่องทั้งหมด"
      - text: "k = 4 ได้ BRING CAKE เป็นคำภาษาอังกฤษที่มีความหมาย จึงน่าจะเป็นคำตอบ"
      - text: "ตรวจ: เข้ารหัส BRING CAKE ด้วย k = 4 ได้ FVMRK GEOI ตรงกับที่ดักได้"
        why: "การตรวจย้อนยืนยันว่าไม่ได้บังเอิญเจอคำที่อ่านได้จากกุญแจผิด"
    answer: "ข้อความคือ BRING CAKE กุญแจ k = 4 รหัสซีซาร์มีกุญแจน้อยเกินไปจนลองครบได้ง่าย"
  - { type: check, problem: computer.security.encryption.p004, prompt: "ถอดรหัสเมื่อรู้กุญแจ" }
  - type: figure
    src: key-types.svg
    alt: "สองกรอบ กรอบบน กุญแจสมมาตร เช่น AES ผู้ส่งปุ้ยมีข้อความ MEET AT NOON เข้ารหัสด้วยกุญแจ K ได้ข้อความเข้ารหัสที่อ่านไม่ออก ผู้รับต้นข้าวถอดรหัสด้วยกุญแจ K ดอกเดียวกัน ข้อความใต้กรอบ เร็ว แต่ต้องหาทางส่งกุญแจ K ให้ผู้รับอย่างปลอดภัยก่อน กรอบล่าง กุญแจสาธารณะ ปุ้ยเข้ารหัสด้วยกุญแจสาธารณะของต้นข้าว ต้นข้าวถอดด้วยกุญแจส่วนตัวของต้นข้าว ข้อความใต้กรอบ กุญแจสาธารณะแจกได้ทุกคน กุญแจส่วนตัวมีแค่ต้นข้าว แต่คำนวณช้ากว่า"
    caption: "กุญแจสมมาตรกับกุญแจสาธารณะ"
  - type: worked-example
    title: จำลองกุญแจสาธารณะด้วยตัวเลขเล็ก ๆ
    problem: "ต้นข้าวประกาศกุญแจสาธารณะ $(e, n) = (3, 33)$ และเก็บกุญแจส่วนตัว $d = 7$ ไว้ ปุ้ยต้องการส่งตัวเลขลับ $m = 4$ ให้ต้นข้าว จงเข้ารหัสด้วย $c = m^e \\bmod n$ แล้วให้ต้นข้าวถอดด้วย $m = c^d \\bmod n$ (ตัวเลขเล็กแบบนี้ใช้จำลองแนวคิดเท่านั้น ระบบจริงใช้ตัวเลขยาวหลายร้อยหลัก)"
    steps:
      - text: "ปุ้ยใช้กุญแจสาธารณะ: $4^3 = 64$"
      - text: "หารด้วย 33 เอาเศษ: $64 \\bmod 33 = 31$ ข้อความเข้ารหัสคือ $c = 31$"
        why: "ใครก็ทำขั้นนี้ได้ เพราะ e และ n เปิดเผย แต่รู้ 31 แล้วย้อนหา 4 ไม่ได้ง่าย ๆ ถ้าไม่รู้ d"
      - text: "ต้นข้าวใช้กุญแจส่วนตัว: ต้องหา $31^7 \\bmod 33$ สังเกตว่า $31 = 33 - 2$ จึงเทียบเท่ากับ $(-2)^7 = -128$"
      - text: "$-128 \\bmod 33$: บวก 33 สี่ครั้ง $-128 + 132 = 4$ ได้ $m = 4$ ตรงกับที่ปุ้ยส่ง"
        why: "คู่กุญแจ e = 3 และ d = 7 ถูกเลือกมาให้ยกกำลังแล้วย้อนกลับกันได้พอดี คนที่รู้แค่ e จะหา d ได้ยากมากเมื่อตัวเลขใหญ่"
    answer: "เข้ารหัสได้ 31 ถอดด้วยกุญแจส่วนตัวได้ 4 คืน"
  - { type: check, problem: computer.security.encryption.p009, prompt: "ทบทวนว่าแต่ละงานใช้กุญแจดอกใด" }
  - type: figure
    src: https.svg
    alt: "แผนภาพลำดับเหตุการณ์ระหว่างเบราว์เซอร์กับเซิร์ฟเวอร์ shop.example ห้าขั้น 1 เบราว์เซอร์ขอเชื่อมต่อแบบปลอดภัย 2 เซิร์ฟเวอร์ส่งใบรับรองที่มีกุญแจสาธารณะ ลงชื่อโดยหน่วยงานออกใบรับรอง 3 เบราว์เซอร์ตรวจลายมือชื่อ วันหมดอายุ และชื่อโดเมนในใบรับรอง 4 ใช้กุญแจสาธารณะตกลงกุญแจรอบการใช้งานร่วมกัน 5 ส่งข้อมูลจริงเข้ารหัสแบบสมมาตรด้วยกุญแจรอบการใช้งาน"
    caption: "HTTPS ใช้กุญแจสาธารณะตกลงกุญแจ แล้วใช้กุญแจสมมาตรกับข้อมูลจริง (แบบย่อ)"
glossary:
  - { term: การเข้ารหัสลับ (encryption), definition: "การแปลงข้อความต้นฉบับเป็นข้อความที่อ่านไม่ออกด้วยอัลกอริทึมและกุญแจ" }
  - { term: กุญแจ (key), definition: "ค่าลับที่ใช้กับอัลกอริทึมเพื่อเข้ารหัสหรือถอดรหัส ความปลอดภัยขึ้นกับกุญแจ" }
  - { term: ปริภูมิกุญแจ (key space), definition: "จำนวนกุญแจทั้งหมดที่เป็นไปได้ กุญแจ n บิตมี 2 ยกกำลัง n ค่า" }
  - { term: รหัสซีซาร์ (Caesar cipher), definition: "รหัสที่เลื่อนตัวอักษรทุกตัวไปเท่ากัน k ตำแหน่ง" }
  - { term: การนับความถี่ (frequency analysis), definition: "การถอดรหัสแบบแทนที่โดยดูว่าตัวใดพบบ่อยที่สุด แล้วจับคู่กับตัวอักษรที่ใช้บ่อยในภาษานั้น" }
  - { term: กุญแจสมมาตร (symmetric key), definition: "การเข้ารหัสที่ใช้กุญแจดอกเดียวกันทั้งเข้ารหัสและถอดรหัส เช่น AES" }
  - { term: กุญแจสาธารณะ (public key), definition: "กุญแจในคู่กุญแจที่แจกให้ทุกคน ใช้เข้ารหัสถึงเจ้าของหรือตรวจลายมือชื่อของเจ้าของ" }
  - { term: ลายมือชื่อดิจิทัล (digital signature), definition: "ค่าที่เจ้าของสร้างด้วยกุญแจส่วนตัว ให้ผู้อื่นตรวจด้วยกุญแจสาธารณะว่ามาจากเจ้าของจริงและไม่ถูกแก้" }
  - { term: ใบรับรอง (certificate), definition: "เอกสารดิจิทัลที่ผูกกุญแจสาธารณะกับชื่อโดเมน ลงชื่อโดยหน่วยงานออกใบรับรองที่เบราว์เซอร์เชื่อถือ" }
flashcards:
  - { front: "สูตรรหัสซีซาร์", back: "เข้ารหัส C = (P + k) mod 26 ถอดรหัส P = (C − k) mod 26" }
  - { front: "ทำไมรหัสซีซาร์ไม่ปลอดภัย", back: "มีกุญแจแค่ 25 ค่า ลองทุกค่าได้ทันที" }
  - { front: "รหัสแบบแทนที่มีกุญแจ 26! แบบ ทำไมยังแพ้", back: "ตัวอักษรถูกแทนด้วยตัวเดิมเสมอ จึงถอดได้ด้วยการนับความถี่" }
  - { front: "กุญแจสาธารณะใช้ทำอะไร กุญแจส่วนตัวใช้ทำอะไร", back: "สาธารณะ: เข้ารหัสถึงเจ้าของ ตรวจลายมือชื่อ ส่วนตัว: ถอดรหัส ลงลายมือชื่อ" }
  - { front: "แม่กุญแจ HTTPS บอกอะไร", back: "ข้อมูลถูกเข้ารหัสระหว่างเรากับโดเมนนั้น ไม่ได้บอกว่าเว็บน่าเชื่อถือ" }
