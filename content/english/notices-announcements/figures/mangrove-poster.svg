<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" width="520" height="560" font-family="sans-serif">
<title>โปสเตอร์กิจกรรมปลูกป่าชายเลนของชุมชน (สมมุติ)</title>
<rect x="0" y="0" width="520" height="560" fill="#fff"/>
<rect x="10.0" y="10.0" width="500.0" height="540.0" rx="10" fill="#eaf6ec" stroke="#2e6b3a" stroke-width="3"/>
<text x="260.0" y="58.0" font-size="28" text-anchor="middle" fill="#1f4f1a" font-weight="bold">MANGROVE PLANTING DAY</text>
<text x="260.0" y="92.0" font-size="19" text-anchor="middle" fill="#2e6b3a" font-weight="normal" font-style="italic">Plant a Tree, Grow a Future!</text>
<rect x="107.0" y="112.0" width="6.0" height="26.0" rx="0" fill="#7a5a2b" stroke="#7a5a2b" stroke-width="1"/>
<circle cx="110.0" cy="108.0" r="14.0" fill="#3f9a4a" stroke="#2e6b3a" stroke-width="1.5"/>
<rect x="407.0" y="112.0" width="6.0" height="26.0" rx="0" fill="#7a5a2b" stroke="#7a5a2b" stroke-width="1"/>
<circle cx="410.0" cy="108.0" r="14.0" fill="#3f9a4a" stroke="#2e6b3a" stroke-width="1.5"/>
<text x="40.0" y="172.0" font-size="17" text-anchor="start" fill="#1f4f1a" font-weight="bold">When:</text>
<text x="150.0" y="172.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">Saturday, 5 December 2026</text>
<text x="150.0" y="206.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">7:30 – 11:00 a.m.</text>
<text x="40.0" y="240.0" font-size="17" text-anchor="start" fill="#1f4f1a" font-weight="bold">Where:</text>
<text x="150.0" y="240.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">Khlong Khon Community Centre,</text>
<text x="150.0" y="274.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">Samut Songkhram</text>
<text x="40.0" y="308.0" font-size="17" text-anchor="start" fill="#1f4f1a" font-weight="bold">Bring:</text>
<text x="150.0" y="308.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">a hat, a water bottle and old clothes</text>
<text x="40.0" y="342.0" font-size="17" text-anchor="start" fill="#1f4f1a" font-weight="bold">Boat trip:</text>
<text x="150.0" y="342.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">adults 60 baht, children 30 baht</text>
<text x="150.0" y="376.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">Free seedlings for all volunteers!</text>
<text x="40.0" y="410.0" font-size="17" text-anchor="start" fill="#1f4f1a" font-weight="bold">Sign up:</text>
<text x="150.0" y="410.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">at the community centre by 28 November</text>
<rect x="130.0" y="460.0" width="260.0" height="52.0" rx="26" fill="#2e6b3a" stroke="#2e6b3a" stroke-width="1"/>
<text x="260.0" y="494.0" font-size="24" text-anchor="middle" fill="#fff" font-weight="bold">JOIN US!</text>
<text x="260.0" y="534.0" font-size="13" text-anchor="middle" fill="#555" font-weight="normal">(ข้อมูลสมมุติ)</text>
</svg>
