<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="sans-serif">
<title>แหล่งเงินทุนของกิจการ</title>
<defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#222"/></marker></defs>
<rect width="760" height="400" fill="#ffffff"/>
<text x="205.0" y="30.0" font-size="15" text-anchor="middle" fill="#1f5fa8" font-weight="bold">หนี้สิน (ต้องจ่ายคืนและดอกเบี้ย)</text>
<text x="565.0" y="30.0" font-size="15" text-anchor="middle" fill="#1e7d45" font-weight="bold">ส่วนของเจ้าของ (ไม่ต้องจ่ายคืน)</text>
<text x="20.0" y="110.0" font-size="13" text-anchor="start" fill="#444" font-weight="bold">ระยะสั้น</text>
<text x="20.0" y="250.0" font-size="13" text-anchor="start" fill="#444" font-weight="bold">ระยะยาว</text>
<rect x="90.0" y="50.0" width="230.0" height="120.0" fill="#e8eef6" stroke="#1f5fa8" stroke-width="1.5" rx="8"/>
<text x="205.0" y="72.0" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">สินเชื่อระยะสั้น</text>
<text x="205.0" y="94.0" font-size="12" text-anchor="middle" fill="#333" font-weight="normal">เงินเบิกเกินบัญชี (OD)</text>
<text x="205.0" y="113.0" font-size="12" text-anchor="middle" fill="#333" font-weight="normal">เครดิตการค้าจากผู้ขาย</text>
<text x="205.0" y="132.0" font-size="12" text-anchor="middle" fill="#333" font-weight="normal">ตั๋วสัญญาใช้เงิน แฟกตอริง</text>
<rect x="90.0" y="190.0" width="230.0" height="120.0" fill="#e8eef6" stroke="#1f5fa8" stroke-width="1.5" rx="8"/>
<text x="205.0" y="212.0" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">หนี้ระยะยาว</text>
<text x="205.0" y="234.0" font-size="12" text-anchor="middle" fill="#333" font-weight="normal">เงินกู้ระยะยาวจากธนาคาร</text>
<text x="205.0" y="253.0" font-size="12" text-anchor="middle" fill="#333" font-weight="normal">หุ้นกู้ (ตลาดตราสารหนี้)</text>
<text x="205.0" y="272.0" font-size="12" text-anchor="middle" fill="#333" font-weight="normal">สัญญาเช่า/เช่าซื้อ</text>
<rect x="450.0" y="50.0" width="230.0" height="120.0" fill="#e3f1e6" stroke="#1e7d45" stroke-width="1.5" rx="8"/>
<text x="565.0" y="72.0" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">แหล่งภายใน</text>
<text x="565.0" y="94.0" font-size="12" text-anchor="middle" fill="#333" font-weight="normal">เงินของเจ้าของ</text>
<text x="565.0" y="113.0" font-size="12" text-anchor="middle" fill="#333" font-weight="normal">กำไรสะสม</text>
<text x="565.0" y="132.0" font-size="12" text-anchor="middle" fill="#333" font-weight="normal">(ต้นทุนคือค่าเสียโอกาส)</text>
<rect x="450.0" y="190.0" width="230.0" height="120.0" fill="#e3f1e6" stroke="#1e7d45" stroke-width="1.5" rx="8"/>
<text x="565.0" y="212.0" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">ตลาดทุน</text>
<text x="565.0" y="234.0" font-size="12" text-anchor="middle" fill="#333" font-weight="normal">หุ้นสามัญ หุ้นบุริมสิทธิ</text>
<text x="565.0" y="253.0" font-size="12" text-anchor="middle" fill="#333" font-weight="normal">เสนอขายผ่าน SET หรือ mai</text>
<text x="565.0" y="272.0" font-size="12" text-anchor="middle" fill="#333" font-weight="normal">เงินร่วมลงทุน (VC)</text>
<line x1="90.0" y1="350.0" x2="680.0" y2="350.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<text x="90.0" y="374.0" font-size="13" text-anchor="start" fill="#222" font-weight="bold">ความเสี่ยงของผู้ให้เงินทุนและผลตอบแทนที่ต้องการสูงขึ้น →</text>
<text x="90.0" y="392.0" font-size="12" text-anchor="start" fill="#444" font-weight="normal">(เจ้าหนี้มีหลักประกัน &lt; ผู้ถือหุ้นกู้ &lt; ผู้ถือหุ้นบุริมสิทธิ &lt; ผู้ถือหุ้นสามัญ)</text>
</svg>