id: math.geometry.position-direction
subject: math
title: { th: ตำแหน่ง ทิศทาง และการบอกทาง, en: "Position, direction and giving directions" }
summary: บอกตำแหน่งด้วยคำ เช่น ข้างบน ข้างใต้ ซ้าย ขวา ทำตามและให้คำบอกทาง หมุนหนึ่งในสี่รอบและครึ่งรอบ อ่านแผนผังและตารางอ้างอิงตำแหน่ง
difficulty: 1
minutes: 25
prerequisites: [math.geometry.shapes]
encompasses: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: turns.svg
    alt: "ภาพสี่ภาพเรียงกัน ภาพแรกลูกศรชี้ขึ้น เขียนว่าเริ่มต้น หันไปข้างหน้า ภาพที่สองลูกศรหมุนตามเข็มนาฬิกาไปชี้ทางขวา เขียนว่าหนึ่งในสี่รอบ มุมฉาก 1 มุม ภาพที่สามลูกศรชี้ลง เขียนว่าครึ่งรอบ มุมฉาก 2 มุม ภาพที่สี่ลูกศรชี้ทางซ้าย เขียนว่าสามในสี่รอบ มุมฉาก 3 มุม"
    caption: "หมุนตามเข็มนาฬิกาจากท่าเริ่มต้น หมุนครบมุมฉาก 4 มุมคือหนึ่งรอบ"
  - { type: check, problem: math.geometry.position-direction.p006, prompt: "ครึ่งรอบคือมุมฉากกี่มุม" }
  - type: figure
    src: village-map.svg
    alt: "แผนผังหมู่บ้านบนตาราง 5 คูณ 5 ช่อง คอลัมน์ A ถึง E จากซ้ายไปขวา แถว 1 ถึง 5 จากล่างขึ้นบน มีลูกศรบอกทิศเหนือชี้ขึ้น ช่อง A1 เป็นตลาด ช่อง D2 เป็นโรงเรียน ช่อง C3 เป็นบ้านต้น ช่อง D3 เป็นไปรษณีย์ ช่อง B4 เป็นวัด ช่อง A5 เป็นสวน ช่อง E5 เป็นสระน้ำ"
    caption: "อ่านตัวอักษรด้านล่างก่อน แล้วจึงอ่านตัวเลขด้านข้าง เช่น วัดอยู่ช่อง B4"
  - type: worked-example
    title: บอกทางจากบ้านไปวัด
    problem: "ในแผนผังหมู่บ้าน ต้นอยู่ที่บ้านช่อง C3 อยากเดินไปวัดช่อง B4 โดยเดินตามช่องตาราง (ไม่เดินเฉียง) บอกทางให้ต้น"
    steps:
      - text: "หาตำแหน่งของทั้งสองที่: บ้าน C3 วัด B4"
      - text: "เทียบตัวอักษร: จาก C ไป B ไปทางซ้าย 1 ช่อง ซึ่งคือทิศตะวันตก"
        why: "บนแผนผังนี้ทิศเหนืออยู่ด้านบน ทางซ้ายจึงเป็นทิศตะวันตก"
      - text: "เทียบตัวเลข: จาก 3 ไป 4 ขึ้นไป 1 ช่อง ซึ่งคือทิศเหนือ"
      - text: "เขียนคำบอกทาง: เดินไปทางทิศตะวันตก 1 ช่อง แล้วเดินไปทางทิศเหนือ 1 ช่อง"
        why: "จะเดินขึ้นเหนือก่อนแล้วค่อยไปตะวันตกก็ได้ ระยะเท่ากัน คือ 2 ช่อง"
    answer: "เดินไปทิศตะวันตก 1 ช่อง แล้วไปทิศเหนือ 1 ช่อง (รวม 2 ช่อง)"
  - { type: check, problem: math.geometry.position-direction.p010, prompt: "นับเฉพาะช่องที่ก้าวไป" }
  - type: worked-example
    title: หันไปทางไหนหลังหมุนหลายครั้ง
    problem: "ฝนหันหน้าไปทางทิศตะวันตก หมุนตามเข็มนาฬิกาหนึ่งในสี่รอบ แล้วหมุนทวนเข็มนาฬิกาครึ่งรอบ ตอนนี้ฝนหันไปทางทิศใด"
    steps:
      - text: "เรียงทิศตามเข็มนาฬิกา: เหนือ → ตะวันออก → ใต้ → ตะวันตก → เหนือ"
      - text: "จากตะวันตก หมุนตามเข็มหนึ่งในสี่รอบ ได้ทิศเหนือ"
      - text: "จากเหนือ หมุนครึ่งรอบ ได้ทิศตรงข้ามคือทิศใต้"
        why: "หมุนครึ่งรอบ ไม่ว่าตามเข็มหรือทวนเข็ม ก็หันไปทางตรงข้ามเหมือนกัน"
    answer: "ทิศใต้"
glossary:
  - { term: คำบอกตำแหน่ง, definition: "คำที่บอกว่าสิ่งหนึ่งอยู่ที่ไหนเมื่อเทียบกับอีกสิ่งหนึ่ง เช่น ข้างบน ข้างใต้ ซ้าย ขวา ระหว่าง" }
  - { term: หนึ่งในสี่รอบ, definition: "การหมุนหนึ่งส่วนจากสี่ส่วนของรอบ เท่ากับมุมฉาก 1 มุม" }
  - { term: ตามเข็มนาฬิกา, definition: "หมุนไปทางเดียวกับเข็มนาฬิกา ตรงข้ามกับทวนเข็มนาฬิกา" }
  - { term: แผนผัง, definition: "ภาพของสถานที่เมื่อมองลงมาจากข้างบน ใช้รูปเล็ก ๆ แทนสิ่งของหรืออาคาร" }
  - { term: ตารางอ้างอิงตำแหน่ง, definition: "การแบ่งแผนผังเป็นช่อง แล้วบอกตำแหน่งด้วยตัวอักษรของคอลัมน์และตัวเลขของแถว เช่น B4" }
flashcards:
  - { front: "หมุนครึ่งรอบเท่ากับมุมฉากกี่มุม", back: "2 มุม หันไปทางตรงข้าม" }
  - { front: "หันทิศเหนือ หมุนตามเข็มนาฬิกาหนึ่งในสี่รอบ", back: "หันไปทิศตะวันออก" }
  - { front: "อ่านช่อง B4 อย่างไร", back: "ตัวอักษร B ก่อน (คอลัมน์ ไปทางขวา) แล้วเลข 4 (แถว ขึ้นไปข้างบน)" }
  - { front: "ครูหันหน้าเข้าหาเรา มือขวาของครูอยู่ทางไหนของเรา", back: "ทางซ้ายของเรา เพราะหันหน้าสวนกัน" }
