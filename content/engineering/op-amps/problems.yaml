    stem: "วงกลับเฟสที่ออกแบบให้อัตราขยายในอุดมคติเป็น $G = -50$ ใช้ออปแอมป์ที่มีอัตราขยายวงเปิด $A = 1000$ (ค่าสมมติ) อัตราขยายวงปิดจริงเท่ากับกี่ ใช้สูตร $G_{cl} = G/(1 + (1 - G)/A)$ (ทศนิยม 2 ตำแหน่ง)"
