lessons:
- type: explanation
  file: lesson.md
- type: figure
  src: compound-growth.svg
  alt: กราฟเส้นสามเส้นของเงินต้น 10,000 บาท ดอกเบี้ยทบต้นปีละครั้ง แกนนอน 0 ถึง 30 ปี แกนตั้ง 0 ถึง 80,000 บาท อัตรา 1.5% ต่อปีเพิ่มช้า ๆ เป็นประมาณ 15,631 บาท อัตรา 4% เป็นประมาณ 32,434 บาท อัตรา 7% โค้งขึ้นชันเป็นประมาณ 76,123 บาท เมื่อครบ 30 ปี
  caption: ดอกเบี้ยทบต้นทำให้เงินโตเร็วขึ้นเรื่อย ๆ ยิ่งอัตราสูงและเวลานาน ยิ่งต่างกันมาก
- type: worked-example
  title: ดอกเบี้ยทบต้นกับเงินเฟ้อ
  problem: ฝากเงิน $50{,}000$ บาท ดอกเบี้ย $2\%$ ต่อปีทบต้น $3$ ปี (สมมติ ไม่คิดภาษี) ถ้าราคาสินค้าสูงขึ้นปีละ $1\%$ เงินเมื่อครบกำหนดซื้อของได้เท่ากับเงินกี่บาทของวันนี้
  steps:
  - text: เงินรวม $= 50{,}000 \times (1.02)^3 = 50{,}000 \times 1.061208 = 53{,}060.40$ บาท
    why: ทบต้นคือดอกเบี้ยปีก่อนได้ดอกเบี้ยต่อในปีถัดไป
  - text: ระดับราคาเพิ่มเป็น $(1.01)^3 = 1.030301$ เท่าของวันนี้
  - text: อำนาจซื้อ $= 53{,}060.40 \div 1.030301 \approx 51{,}499.88$ บาท
    why: หารด้วยระดับราคาเพื่อแปลงเป็นเงินของวันนี้
  - text: เงินโตจริงประมาณ $1{,}500$ บาท ไม่ใช่ $3{,}060$ บาท เพราะเงินเฟ้อกินส่วนหนึ่ง
  answer: เงินรวม $53{,}060.40$ บาท ซื้อของได้เท่ากับประมาณ $51{,}500$ บาทของวันนี้
- type: check
  problem: business.econ.saving-investment.p007
  prompt: ทบต้นต่างจากดอกเบี้ยอย่างง่ายอย่างไร
- type: figure
  src: risk-return.svg
  alt: แผนภาพกระจายเชิงแนวคิด แกนนอนคือความเสี่ยง แกนตั้งคือผลตอบแทนที่คาดหวัง จุดเรียงจากซ้ายล่างไปขวาบน ได้แก่ เงินฝากออมทรัพย์ (เสี่ยงต่ำสุด ผลตอบแทนต่ำสุด) เงินฝากประจำและสลากออมทรัพย์ พันธบัตรรัฐบาล หุ้นกู้บริษัทเอกชน กองทุนรวมผสม ทองคำ (เสี่ยงค่อนข้างสูงแต่ผลตอบแทนไม่สูงตาม) หุ้นหลายบริษัทหรือกองทุนหุ้น และหุ้นบริษัทเดียว (เสี่ยงสูงสุด ผลตอบแทนที่คาดหวังสูงสุด) มีเส้นประโค้งแสดงแนวโน้มว่ายิ่งเสี่ยงมาก ผลตอบแทนที่คาดหวังยิ่งสูง หมายเหตุว่าตำแหน่งเป็นแนวคิดเปรียบเทียบ ไม่ใช่ข้อมูลจริง
  caption: ยิ่งคาดหวังผลตอบแทนสูง ยิ่งต้องรับความเสี่ยงสูง (ภาพแนวคิด)
- type: worked-example
  title: เทียบสองทางเลือกด้วยผลตอบแทนที่คาดหวังและพิสัย
  problem: ทางเลือก P ได้ $3\%$ แน่นอน ทางเลือก Q มีโอกาส $60\%$ ได้ $+10\%$ และโอกาส $40\%$ ได้ $-5\%$ (สมมติ) เทียบผลตอบแทนที่คาดหวังและพิสัย
  steps:
  - text: ผลตอบแทนที่คาดหวังของ Q $= 0.6(10) + 0.4(-5) = 6 - 2 = 4\%$
    why: ถ่วงแต่ละผลด้วยโอกาสเกิด
  - text: พิสัยของ Q $= 10 - (-5) = 15$ จุดเปอร์เซ็นต์ ส่วน P มีพิสัย $0$
  - text: Q คาดว่าได้มากกว่า P เพียง $1$ จุดเปอร์เซ็นต์ แต่มีโอกาส $40\%$ ที่จะขาดทุน
    why: ผลตอบแทนที่คาดหวังเป็นค่าเฉลี่ยระยะยาว ในปีเดียวอาจได้ $-5\%$ จริง
  - text: ถ้าเป็นเงินสำรองฉุกเฉินหรือต้องใช้ในปีหน้า ควรเลือก P ถ้าเป็นเงินระยะยาวและรับการขาดทุนชั่วคราวได้ อาจแบ่งบางส่วนไป Q
  answer: 'Q: คาดหวัง $4\%$ พิสัย $15$ จุด · P: $3\%$ พิสัย $0$ เลือกตามเป้าหมายและระยะเวลา'
- type: check
  problem: business.econ.saving-investment.p012
  prompt: ถ่วงด้วยโอกาสเกิด
glossary:
- term: การออม
  definition: รายได้ส่วนที่ไม่ได้ใช้จ่ายเพื่อการบริโภคในปัจจุบัน
- term: การลงทุน (ทางเศรษฐศาสตร์)
  definition: การใช้จ่ายซื้อสินค้าทุน เช่น เครื่องจักร อาคาร เพื่อผลิตสินค้าในอนาคต
- term: การลงทุนทางการเงิน
  definition: การนำเงินออมไปซื้อสินทรัพย์ เช่น พันธบัตร หุ้น กองทุนรวม เพื่อหวังผลตอบแทน
- term: ดอกเบี้ยทบต้น
  definition: ดอกเบี้ยที่คิดจากเงินต้นรวมดอกเบี้ยที่สะสมแล้ว $FV = P(1+r)^n$
- term: ผลตอบแทนที่คาดหวัง
  definition: ค่าเฉลี่ยของผลตอบแทนในแต่ละสถานการณ์ ถ่วงน้ำหนักด้วยโอกาสเกิด
- term: ความเสี่ยง
  definition: โอกาสที่ผลตอบแทนจริงต่างจากที่คาดไว้ รวมถึงโอกาสขาดทุน
- term: การกระจายความเสี่ยง
  definition: การแบ่งเงินลงทุนในหลายทางเลือกที่ไม่ขึ้นลงพร้อมกัน เพื่อลดความผันผวนโดยรวม
- term: สำนักงาน ก.ล.ต.
  definition: สำนักงานคณะกรรมการกำกับหลักทรัพย์และตลาดหลักทรัพย์ ดูแลตลาดทุนและให้ใบอนุญาตผู้ประกอบธุรกิจหลักทรัพย์และกองทุนรวม
