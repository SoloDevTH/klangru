  - id: science.inquiry.observing-measuring.p019
    topics: [science.inquiry.observing-measuring]
    difficulty: 4
    type: code
    stem: "เขียนฟังก์ชัน format_mean(values) ที่รับลิสต์ของค่าที่วัดได้ (หน่วยเซนติเมตร) แล้วคืนข้อความค่าเฉลี่ยที่ปัดให้มีทศนิยม 1 ตำแหน่ง ตามด้วย ' cm' เช่น format_mean([7.2, 7.6, 7.5]) ต้องคืน '7.4 cm'"
    starter: |
      def format_mean(values):
          pass
    tests: |
      r = format_mean([7.2, 7.6, 7.5])
      assert r == "7.4 cm", f"format_mean([7.2, 7.6, 7.5]) ควรได้ '7.4 cm' แต่ได้ {r!r}"
      r = format_mean([12.1, 12.3, 12.2, 12.2])
      assert r == "12.2 cm", f"format_mean([12.1, 12.3, 12.2, 12.2]) ควรได้ '12.2 cm' แต่ได้ {r!r}"
      r = format_mean([5])
      assert r == "5.0 cm", f"format_mean([5]) ควรได้ '5.0 cm' เพราะต้องมีทศนิยม 1 ตำแหน่ง แต่ได้ {r!r}"
    reference: |
      def format_mean(values):
          mean = sum(values) / len(values)
          return f"{mean:.1f} cm"
    hints:
      - "ค่าเฉลี่ยคือผลรวมหารด้วยจำนวนค่า ใช้ sum กับ len ได้"
      - "ใช้ f-string กำหนดทศนิยมหนึ่งตำแหน่ง เช่น ตัวกำหนดรูปแบบ .1f"
      - "อย่าลืมต่อท้ายข้อความด้วย ' cm' แล้วใช้ return คืนค่า"
    solution: "คำนวณค่าเฉลี่ยด้วย sum(values) / len(values) แล้วจัดรูปแบบด้วย f-string ที่มีทศนิยม 1 ตำแหน่งและหน่วย cm เพื่อให้ปัดตามความละเอียดของการวัด"
    license: CC-BY-SA-4.0
    ai_assisted: true

