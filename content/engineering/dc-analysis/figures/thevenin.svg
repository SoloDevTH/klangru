<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" font-family="sans-serif" font-size="14">
<title>วงจรสมมูลเทวินินและนอร์ตัน</title>
<rect x="0" y="0" width="760" height="270" fill="#ffffff"/>
<rect x="20.0" y="60.0" width="150.0" height="120.0" rx="8" fill="#eef3f8" stroke="#15211e" stroke-width="2"/>
<text x="95.0" y="112.0" text-anchor="middle" fill="#15211e" font-size="14" font-weight="bold">วงจรเชิงเส้น</text>
<text x="95.0" y="132.0" text-anchor="middle" fill="#15211e" font-size="12">แหล่งจ่าย + ตัวต้านทาน</text>
<polyline points="170.0,80.0 200.0,80.0" fill="none" stroke="#15211e" stroke-width="2" stroke-linejoin="round"/>
