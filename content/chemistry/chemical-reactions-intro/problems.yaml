problems:
  - id: chemistry.reactions.chemical-reactions-intro.p001
    topics: [chemistry.reactions.chemical-reactions-intro]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นการเปลี่ยนแปลงทางเคมี"
    choices:
      - { id: a, text: "ทอดไข่จนไข่ขาวสุก", correct: true, feedback: "ถูก ไข่ขาวเปลี่ยนเป็นสารใหม่ ทำให้เย็นลงก็ไม่กลับเป็นไข่ดิบ" }
      - { id: b, text: "น้ำแข็งละลายในแก้วชาเย็น", feedback: "น้ำแข็งกับน้ำเป็นสารเดียวกัน เปลี่ยนแค่สถานะ" }
      - { id: c, text: "ตัดกระดาษเป็นชิ้นเล็ก", feedback: "กระดาษชิ้นเล็กยังเป็นกระดาษ เปลี่ยนแค่รูปร่างและขนาด" }
      - { id: d, text: "ละลายน้ำตาลในน้ำ", feedback: "ระเหยน้ำออกก็ได้น้ำตาลคืน จึงไม่เกิดสารใหม่" }
    hints:
      - "การเปลี่ยนแปลงทางเคมีทำให้เกิดสารใหม่"
      - "ข้อใดที่ทำกลับคืนเป็นสารเดิมไม่ได้"
    solution: "การทอดไข่ทำให้โปรตีนในไข่ขาวเปลี่ยนเป็น **สารใหม่** ที่มีสมบัติต่างไป จึงเป็นการเปลี่ยนแปลงทางเคมี ข้ออื่นเป็นการเปลี่ยนแปลงทางกายภาพ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.chemical-reactions-intro.p002
    topics: [chemistry.reactions.chemical-reactions-intro]
    difficulty: 2
    type: match
    stem: "จับคู่ปฏิกิริยากับหลักฐานที่สังเกตได้ชัดที่สุด"
    pairs:
      - { left: "ผสมเบกกิ้งโซดากับน้ำส้มสายชู", right: "เกิดฟองแก๊ส" }
      - { left: "หยดสารละลายซิลเวอร์ไนเตรตลงในน้ำเกลือ", right: "เกิดตะกอนสีขาว" }
      - { left: "เผาลวดแมกนีเซียม (ห้ามมองแสงตรง ๆ)", right: "ให้แสงสว่างจ้า" }
      - { left: "หั่นแอปเปิลทิ้งไว้ในอากาศ", right: "เนื้อแอปเปิลเปลี่ยนเป็นสีน้ำตาล" }
    hints:
      - "หลักฐานมีทั้งฟองแก๊ส ตะกอน แสง และสีเปลี่ยน"
      - "ตะกอนเกิดเมื่อผสมสารละลายสองชนิด"
    solution: "เบกกิ้งโซดากับน้ำส้มสายชูให้แก๊ส $\\mathrm{CO_2}$ · ซิลเวอร์ไนเตรตกับเกลือให้ตะกอนซิลเวอร์คลอไรด์ · แมกนีเซียมเผาให้แสงจ้า · แอปเปิลทำปฏิกิริยากับออกซิเจนจนสีเปลี่ยน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.chemical-reactions-intro.p003
    topics: [chemistry.reactions.chemical-reactions-intro]
    difficulty: 2
    type: mcq
    stem: "จากสมการข้อความ แมกนีเซียม + ออกซิเจน → แมกนีเซียมออกไซด์ ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "สารตั้งต้นคือแมกนีเซียมและออกซิเจน ผลิตภัณฑ์คือแมกนีเซียมออกไซด์", correct: true, feedback: "ถูก สารตั้งต้นอยู่ซ้ายลูกศร ผลิตภัณฑ์อยู่ขวาลูกศร" }
      - { id: b, text: "สารตั้งต้นคือแมกนีเซียมออกไซด์", feedback: "แมกนีเซียมออกไซด์อยู่ขวาลูกศร จึงเป็นผลิตภัณฑ์" }
      - { id: c, text: "ออกซิเจนเป็นผลิตภัณฑ์", feedback: "ออกซิเจนอยู่ซ้ายลูกศร เป็นสารตั้งต้น" }
    hints:
      - "ลูกศรอ่านว่า ได้"
      - "สารที่อยู่ก่อนลูกศรเข้าทำปฏิกิริยา"
    solution: "ซ้ายลูกศร (แมกนีเซียม ออกซิเจน) เป็น **สารตั้งต้น** ขวาลูกศร (แมกนีเซียมออกไซด์) เป็น **ผลิตภัณฑ์**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.chemical-reactions-intro.p004
    topics: [chemistry.reactions.chemical-reactions-intro]
    difficulty: 2
    type: numeric
    stem: "ผสมสารละลาย A 50.0 g กับสารละลาย B 30.0 g ในบีกเกอร์ เกิดตะกอนสีเหลือง ไม่มีแก๊สเกิดขึ้น ชั่งสารทั้งหมดหลังผสม (ไม่รวมบีกเกอร์) จะได้กี่กรัม"
    answer: { value: 80.0, tolerance: 0.05, unit: g }
    misconceptions:
      - { match: 20, feedback: "มวลไม่ได้หายไป และไม่ได้ลบกัน มวลรวมก่อนเท่ากับหลังเกิดปฏิกิริยา" }
      - { match: 50, feedback: "ตะกอนไม่ได้ทำให้มวลรวมเปลี่ยน ต้องรวมมวลของสารทั้งสอง" }
    hints:
      - "ไม่มีแก๊สหนีออก สารทั้งหมดยังอยู่ในบีกเกอร์"
      - "ใช้กฎทรงมวล"
    solution: "ไม่มีสารหนีออก มวลรวมหลัง = มวลรวมก่อน $= 50.0 + 30.0 =$ **80.0 g**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.chemical-reactions-intro.p005
    topics: [chemistry.reactions.chemical-reactions-intro]
    difficulty: 3
    type: mcq
    stem: "จากภาพ เมื่อเอียงขวดให้เบกกิ้งโซดาผสมกับน้ำส้มสายชู เกิดฟองแก๊สจำนวนมาก โดยยังปิดจุกแน่นอยู่ เครื่องชั่งจะอ่านได้เท่าใด"
    figure:
      src: p-closed-flask.svg
      alt: "ขวดรูปกรวยปิดจุกยางแน่น ภายในมีน้ำส้มสายชูอยู่ก้นขวด และมีหลอดเล็กบรรจุผงเบกกิ้งโซดาตั้งอยู่ ขวดวางบนเครื่องชั่งที่อ่านได้ 182.5 g ข้อความว่าก่อนเอียงขวดให้สารผสมกัน"
    choices:
      - { id: a, text: "182.5 g เท่าเดิม", correct: true, feedback: "ถูก ระบบปิด แก๊สที่เกิดยังอยู่ในขวด มวลรวมจึงเท่าเดิมตามกฎทรงมวล" }
      - { id: b, text: "น้อยกว่า 182.5 g เพราะแก๊สเบา", feedback: "แก๊สมีมวล แม้จะเบา และแก๊สยังอยู่ในขวดที่ปิด" }
      - { id: c, text: "มากกว่า 182.5 g เพราะเกิดสารใหม่เพิ่ม", feedback: "สารใหม่เกิดจากอะตอมเดิมจัดเรียงใหม่ ไม่ได้มีอะตอมเพิ่ม" }
    hints:
      - "มีสารใดออกจากขวดหรือเข้ามาในขวดได้หรือไม่"
      - "ใช้กฎทรงมวลกับระบบปิด"
    solution: "ขวดปิดแน่น ไม่มีสารเข้าหรือออก มวลรวมจึง **เท่าเดิม 182.5 g** ถ้าเปิดจุก แก๊ส $\\mathrm{CO_2}$ จะหนีออกและมวลจะลดลง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.chemical-reactions-intro.p006
    topics: [chemistry.reactions.chemical-reactions-intro]
    difficulty: 3
    type: numeric
    stem: "เทกรดไฮโดรคลอริกเจือจางลงบนชิ้นหินปูนในบีกเกอร์ที่ไม่มีฝาปิด ชั่งมวลรวมก่อนผสมได้ 120.0 g เมื่อฟองหยุดเกิด ชั่งได้ 118.2 g มีแก๊สคาร์บอนไดออกไซด์หนีออกไปกี่กรัม"
    answer: { value: 1.8, tolerance: 0.05, unit: g }
    misconceptions:
      - { match: 238.2, feedback: "นำมวลสองครั้งมาบวกกัน แต่มวลของแก๊สคือส่วนที่หายไป ต้องลบ" }
      - { match: 0, feedback: "บีกเกอร์ไม่มีฝา แก๊สหนีออกไปได้ มวลที่ชั่งจึงลดลง" }
    hints:
      - "นี่เป็นระบบเปิด"
      - "มวลที่หายไปจากเครื่องชั่งคือมวลของแก๊สที่ออกไป"
    solution: "มวลที่ลดลง $= 120.0 - 118.2 =$ **1.8 g** คือมวลของ $\\mathrm{CO_2}$ ที่หนีออกไป กฎทรงมวลยังเป็นจริง เพียงแต่แก๊สไม่ได้ถูกชั่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.chemical-reactions-intro.p007
    topics: [chemistry.reactions.chemical-reactions-intro]
    difficulty: 3
    type: numeric
    stem: "ในสมการ $\\mathrm{CH_4} + \\mathrm{2O_2} \\to \\mathrm{CO_2} + \\mathrm{2H_2O}$ ฝั่งผลิตภัณฑ์มีอะตอมออกซิเจนรวมกี่อะตอม"
    answer: { value: 4, unit: อะตอม }
    misconceptions:
      - { match: 3, feedback: "ลืมคูณ 2 หน้า $\\mathrm{H_2O}$ น้ำ 2 โมเลกุลมี O 2 อะตอม" }
      - { match: 6, feedback: "นับ H ปนกับ O หรือคูณ 2 กับ $\\mathrm{CO_2}$ ด้วย ตัวเลข 2 อยู่หน้า $\\mathrm{H_2O}$ เท่านั้น" }
    hints:
      - "ผลิตภัณฑ์คือ $\\mathrm{CO_2}$ และ $\\mathrm{2H_2O}$"
      - "ตัวเลขหน้าสูตรคูณทุกอะตอมในโมเลกุลนั้น"
    solution: "$\\mathrm{CO_2}$ มี O 2 อะตอม $\\mathrm{2H_2O}$ มี O $2 \\times 1 = 2$ อะตอม รวม **4 อะตอม** เท่ากับฝั่งสารตั้งต้น ($\\mathrm{2O_2}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.chemical-reactions-intro.p008
    topics: [chemistry.reactions.chemical-reactions-intro]
    difficulty: 3
    type: mcq
    stem: "ไฮโดรเจนเผาไหม้กับออกซิเจนได้น้ำ สมการใดเขียนได้ถูกต้องและดุลแล้ว"
    choices:
      - { id: a, text: "$\\mathrm{2H_2} + \\mathrm{O_2} \\to \\mathrm{2H_2O}$", correct: true, feedback: "ถูก H 4 = 4 และ O 2 = 2 และใช้สูตรที่ถูกต้องของทุกสาร" }
      - { id: b, text: "$\\mathrm{H_2} + \\mathrm{O_2} \\to \\mathrm{H_2O}$", feedback: "O ซ้ายมี 2 ขวามี 1 ยังไม่ดุล" }
      - { id: c, text: "$\\mathrm{H_2} + \\mathrm{O_2} \\to \\mathrm{H_2O_2}$", feedback: "จำนวนอะตอมเท่ากัน แต่เปลี่ยนตัวเลขห้อยจนกลายเป็นไฮโดรเจนเปอร์ออกไซด์ ไม่ใช่น้ำ" }
      - { id: d, text: "$\\mathrm{H_2} + \\mathrm{O} \\to \\mathrm{H_2O}$", feedback: "แก๊สออกซิเจนอยู่เป็นโมเลกุล $\\mathrm{O_2}$ ไม่ใช่อะตอมเดี่ยว" }
    hints:
      - "นับอะตอม H และ O ทั้งสองข้าง"
      - "ห้ามเปลี่ยนสูตรของน้ำ เปลี่ยนได้เฉพาะตัวเลขหน้าสูตร"
    solution: "$\\mathrm{2H_2} + \\mathrm{O_2} \\to \\mathrm{2H_2O}$ มี H 4 อะตอมและ O 2 อะตอมทั้งสองข้าง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.chemical-reactions-intro.p009
    topics: [chemistry.reactions.chemical-reactions-intro]
    difficulty: 3
    type: mcq
    stem: "ใส่ผงสังกะสีลงในสารละลายคอปเปอร์(II) ซัลเฟต อุณหภูมิของสารละลายเพิ่มจาก 28 °C เป็น 36 °C ข้อสรุปใดถูกต้อง"
    choices:
      - { id: a, text: "เป็นปฏิกิริยาคายความร้อน เพราะปล่อยความร้อนให้สารละลาย", correct: true, feedback: "ถูก สิ่งแวดล้อมร้อนขึ้นแสดงว่าปฏิกิริยาปล่อยพลังงานออกมา" }
      - { id: b, text: "เป็นปฏิกิริยาดูดความร้อน เพราะสารละลายมีความร้อนมากขึ้น", feedback: "สารละลายคือสิ่งแวดล้อมที่รับความร้อน ปฏิกิริยาที่ดูดความร้อนจะทำให้สารละลายเย็นลง" }
      - { id: c, text: "ไม่เกิดปฏิกิริยา เพราะความร้อนมาจากการคน", feedback: "การคนไม่ได้ทำให้อุณหภูมิเพิ่มถึง 8 °C การเปลี่ยนอุณหภูมิเป็นหลักฐานของปฏิกิริยา" }
    hints:
      - "เทอร์โมมิเตอร์วัดอุณหภูมิของสิ่งแวดล้อม"
      - "สิ่งแวดล้อมร้อนขึ้นแปลว่าพลังงานไหลไปทางใด"
    solution: "อุณหภูมิเพิ่ม 8 °C ปฏิกิริยา **คายความร้อน** ให้สารละลาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.chemical-reactions-intro.p010
    topics: [chemistry.reactions.chemical-reactions-intro]
    difficulty: 2
    type: numeric
    stem: "หย่อนเม็ดฟู่วิตามินซีลงในน้ำ อุณหภูมิของน้ำเปลี่ยนจาก 30.0 °C เป็น 21.5 °C อุณหภูมิลดลงกี่องศาเซลเซียส"
    answer: { value: 8.5, tolerance: 0.05, unit: "°C" }
    misconceptions:
      - { match: 51.5, feedback: "นำอุณหภูมิมาบวกกัน การเปลี่ยนแปลงต้องหาจากผลต่าง" }
    hints:
      - "การเปลี่ยนแปลงอุณหภูมิ = อุณหภูมิเริ่มต้น − อุณหภูมิสุดท้าย"
      - "อุณหภูมิลดลง แสดงว่าเป็นปฏิกิริยาแบบใด"
    solution: "$30.0 - 21.5 =$ **8.5 °C** น้ำเย็นลง แสดงว่าปฏิกิริยาระหว่างกรดซิทริกกับโซเดียมไฮโดรเจนคาร์บอเนตในเม็ดฟู่ดูดความร้อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.chemical-reactions-intro.p011
    topics: [chemistry.reactions.chemical-reactions-intro]
    difficulty: 3
    type: mcq
    stem: "เผากระดาษ 10 g เหลือเถ้าเพียงประมาณ 0.5 g นักเรียนคนหนึ่งบอกว่ากฎทรงมวลใช้กับการเผาไหม้ไม่ได้ ข้อใดตอบนักเรียนคนนี้ได้ดีที่สุด"
    choices:
      - { id: a, text: "มวลส่วนใหญ่ไปอยู่ในแก๊สคาร์บอนไดออกไซด์และไอน้ำที่ลอยออกไป ถ้าเก็บแก๊สทั้งหมดไว้ชั่ง มวลรวมจะเท่ากับกระดาษบวกออกซิเจนที่ใช้", correct: true, feedback: "ถูก การเผาในที่เปิดเป็นระบบเปิด มวลที่ชั่งได้จึงลดลง" }
      - { id: b, text: "นักเรียนพูดถูก อะตอมถูกไฟเผาจนหายไป", feedback: "อะตอมไม่ได้หายไป เพียงจัดเรียงตัวใหม่เป็นแก๊ส" }
      - { id: c, text: "เครื่องชั่งอ่านค่าผิด เพราะมวลต้องเท่าเดิมเสมอ", feedback: "เครื่องชั่งไม่ผิด มวลที่ชั่งลดลงจริงเพราะแก๊สหนีออกไป" }
    hints:
      - "การเผาไหม้ได้ผลิตภัณฑ์อะไร และอยู่ในสถานะใด"
      - "ระบบเปิดหรือระบบปิด"
    solution: "ผลิตภัณฑ์ส่วนใหญ่เป็น **แก๊สที่ลอยออกไป** มวลที่ชั่งได้จึงลดลง ถ้าเผาในภาชนะปิดและชั่งทั้งหมด มวลจะเท่าเดิม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.reactions.chemical-reactions-intro.p012
    topics: [chemistry.reactions.chemical-reactions-intro]
    difficulty: 4
    type: mcq
    stem: "ข้อใดอธิบายได้ถูกต้องว่าทำไมการเผาไหม้แก๊สมีเทนจึงเป็นปฏิกิริยาคายความร้อน"
    choices:
