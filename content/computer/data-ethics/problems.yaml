  - id: computer.society.data-ethics.p012
    topics: [computer.society.data-ethics]
    difficulty: 4
    type: mcq
    stem: "ชุดข้อมูลรูปภาพถูกติดป้ายโดยกลุ่มคนที่มีความหลากหลายจำกัด ผลที่อาจเกิดขึ้นกับโมเดลที่ฝึกจากข้อมูลนี้คืออะไร"
    choices:
      - { id: a, text: "โมเดลอาจเรียนรู้ความเข้าใจของผู้ติดป้าย และทำนายผิดกับกลุ่มที่ไม่ได้อยู่ในกลุ่มผู้ติดป้าย", correct: true }
      - { id: b, text: "โมเดลจะเป็นกลางสมบูรณ์ เพราะป้ายถูกติดโดยมนุษย์", feedback: "มนุษย์ที่ติดป้ายมีมุมมองของตนเอง การติดป้ายจึงอาจแฝงความเอนเอียงได้" }
      - { id: c, text: "ผลลัพธ์จะไม่ได้รับผลกระทบจากป้ายเลย", feedback: "ป้ายเป็นสิ่งที่โมเดลเรียนรู้โดยตรง ป้ายที่เอนเอียงจึงมีผลต่อผลลัพธ์" }
      - { id: d, text: "ความถูกต้องจะสูงขึ้นเสมอเมื่อมีป้ายมากขึ้น", feedback: "ป้ายจำนวนมากจากกลุ่มเดียวกันไม่ได้ทำให้ครอบคลุมกลุ่มอื่นมากขึ้น" }
    hints:
      - "ระบบเรียนรู้จากตัวอย่างและป้ายที่ได้รับ"
      - "ถามว่ากลุ่มที่ไม่ได้อยู่ในการติดป้ายจะได้รับการเรียนรู้อย่างไร"
    solution: "โมเดลเรียนรู้รูปแบบจากป้ายที่มี หากป้ายสะท้อนความเข้าใจของกลุ่มเดียว โมเดลจะทำนายได้ไม่ดีกับกลุ่มที่ไม่ได้อยู่ในนั้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.data-ethics.p013
    topics: [computer.society.data-ethics]
    difficulty: 4
    type: numeric
    stem: "หมู่บ้านแห่งหนึ่งมีผู้เข้าร่วมกิจกรรมจริง 40 คน เผยแพร่จำนวนผู้เข้าร่วมเป็น 43 คน หลังเติมสัญญาณรบกวนแบบสุ่มเพื่อคุ้มครองข้อมูลรายบุคคล ความคลาดเคลื่อนนี้คิดเป็นกี่เปอร์เซ็นต์ของค่าจริง (ตอบเป็นเปอร์เซ็นต์ ทศนิยมได้ 1 ตำแหน่ง)"
    answer: { value: 7.5, tolerance: 0.05, unit: เปอร์เซ็นต์ }
    hints:
      - "หาผลต่างระหว่างค่าที่เผยแพร่กับค่าจริงก่อน"
      - "นำผลต่างไปหารด้วยค่าจริง แล้วคูณ 100"
    misconceptions:
      - { match: 3, feedback: "นั่นคือจำนวนคนที่คลาดเคลื่อน โจทย์ถามเป็นเปอร์เซ็นต์ของค่าจริง" }
      - { match: 43, feedback: "นั่นคือค่าที่เผยแพร่ ไม่ใช่ความคลาดเคลื่อน" }
    solution: "ความคลาดเคลื่อน = |43 − 40| = 3 คน คิดเป็น 3 ÷ 40 × 100 = 7.5% ของค่าจริง สัญญาณรบกวนขนาดนี้ทำให้ผู้อ่านแยกไม่ออกว่าคนใดคนหนึ่งเข้าร่วมหรือไม่ ขณะที่ค่าที่เผยแพร่ยังใกล้ค่าจริงพอใช้ทำสถิติ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.data-ethics.p014
    topics: [computer.society.data-ethics]
    difficulty: 4
    type: mcq
    stem: "ข้อใดเป็นจุดอ่อนที่สำคัญที่สุดของการอ้างว่าข้อมูลปลอดภัยเพราะ 'ลบชื่อออกแล้ว'"
    choices:
      - { id: b, text: "การลบชื่อทำให้ข้อมูลหายไปทั้งหมด จึงใช้ทำสถิติไม่ได้", feedback: "การลบชื่อไม่ได้ทำให้ข้อมูลอื่นหายไป และข้อมูลยังใช้ทำสถิติได้" }
      - { id: a, text: "ข้อมูลที่เหลือเช่น ชั้น เพศ และอายุ อาจรวมกันแล้วระบุตัวบุคคลได้", correct: true }
      - { id: c, text: "ชื่อเป็นข้อมูลเดียวที่กฎหมายคุ้มครอง", feedback: "กฎหมายคุ้มครองข้อมูลส่วนบุคคลที่ระบุตัวบุคคลได้ทั้งทางตรงและทางอ้อม ไม่ได้มีเพียงชื่อ" }
      - { id: d, text: "คอมพิวเตอร์ไม่สามารถประมวลผลข้อมูลที่ไม่มีชื่อได้", feedback: "คอมพิวเตอร์ประมวลผลข้อมูลที่ไม่มีชื่อได้ตามปกติ ปัญหาอยู่ที่การระบุตัวบุคคลซ้ำ" }
    hints:
      - "คิดว่าข้อมูลแต่ละอย่างที่เหลืออยู่อาจเป็นเพียงข้อมูลกลาง ๆ แต่รวมกันแล้วเป็นอย่างไร"
      - "ลองนึกถึงกลุ่มที่มีคนเพียงคนเดียวที่มีลักษณะตรงกับทุกเงื่อนไข"
    solution: "ข้อมูลทางอ้อมที่เหลืออยู่อาจรวมกันจนเหลือคนเพียงไม่กี่คนหรือคนเดียวที่ตรงกับทุกเงื่อนไข จึงระบุตัวบุคคลซ้ำได้ การลบชื่ออย่างเดียวจึงไม่พอ"
