<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="sans-serif" font-size="14">
  <title>ธนาคารพาณิชย์เป็นตัวกลางระหว่างผู้ฝากกับผู้กู้ โดยมีธนาคารแห่งประเทศไทยกำกับดูแล</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
  <rect x="250.0" y="20.0" width="260.0" height="64.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="380.0" y="46.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">ธนาคารแห่งประเทศไทย (ธนาคารกลาง)</text>
  <text x="380.0" y="68.0" text-anchor="middle" fill="#1f2937" font-size="12.5">นโยบายการเงิน · กำกับดูแล · ออกธนบัตร</text>
  <line x1="380.0" y1="84.0" x2="380.0" y2="140.0" stroke="#1f2937" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="390.0" y="116.0" text-anchor="start" fill="#7c3aed" font-size="12.5">กำกับดูแล</text>
  <rect x="20.0" y="150.0" width="160.0" height="100.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="100.0" y="186.0" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="bold">ผู้ฝากเงิน</text>
  <text x="100.0" y="210.0" text-anchor="middle" fill="#1f2937" font-size="12.5">ครัวเรือนที่มีเงินเหลือ</text>
  <text x="100.0" y="230.0" text-anchor="middle" fill="#1f2937" font-size="12.5">ธุรกิจที่มีเงินสด</text>
  <rect x="300.0" y="150.0" width="160.0" height="100.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="380.0" y="192.0" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="bold">ธนาคารพาณิชย์</text>
  <text x="380.0" y="216.0" text-anchor="middle" fill="#1f2937" font-size="12.5">ตัวกลางทางการเงิน</text>
  <rect x="580.0" y="150.0" width="160.0" height="100.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="660.0" y="186.0" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="bold">ผู้กู้</text>
  <text x="660.0" y="210.0" text-anchor="middle" fill="#1f2937" font-size="12.5">ครอบครัวซื้อบ้าน</text>
  <text x="660.0" y="230.0" text-anchor="middle" fill="#1f2937" font-size="12.5">ธุรกิจลงทุน</text>
  <line x1="180.0" y1="175.0" x2="298.0" y2="175.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="240.0" y="168.0" text-anchor="middle" fill="#1f2937" font-size="12.5">เงินฝาก</text>
  <line x1="300.0" y1="228.0" x2="182.0" y2="228.0" stroke="#1f2937" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="240.0" y="246.0" text-anchor="middle" fill="#1f2937" font-size="12">ดอกเบี้ยเงินฝาก</text>
  <line x1="460.0" y1="175.0" x2="578.0" y2="175.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="520.0" y="168.0" text-anchor="middle" fill="#1f2937" font-size="12.5">เงินกู้</text>
  <line x1="580.0" y1="228.0" x2="462.0" y2="228.0" stroke="#1f2937" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="520.0" y="246.0" text-anchor="middle" fill="#1f2937" font-size="12">ดอกเบี้ยเงินกู้</text>
  <text x="380.0" y="290.0" text-anchor="middle" fill="#1f2937" font-size="13.5">ดอกเบี้ยเงินกู้สูงกว่าดอกเบี้ยเงินฝาก ส่วนต่างเป็นรายได้หลักของธนาคาร</text>
  <text x="380.0" y="314.0" text-anchor="middle" fill="#6b7280" font-size="13.5">เงินฝากได้รับความคุ้มครองไม่เกิน 1 ล้านบาทต่อผู้ฝากต่อสถาบันการเงิน</text>
</svg>
