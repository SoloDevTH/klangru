problems:
  - id: earthscience.hydrosphere.water-cycle.p001
    topics: [earthscience.hydrosphere.water-cycle]
    difficulty: 1
    type: mcq
    stem: "น้ำส่วนใหญ่บนโลกอยู่ที่ใด"
    choices:
      - { id: a, text: "ทะเลและมหาสมุทร", correct: true }
      - { id: b, text: "แม่น้ำและทะเลสาบ", feedback: "แม่น้ำและทะเลสาบมีน้ำน้อยมากเมื่อเทียบกับน้ำทั้งโลก ไม่ถึงครึ่งขวดจาก 1,000 ขวด" }
      - { id: c, text: "น้ำใต้ดิน", feedback: "น้ำใต้ดินมีราว 7 ขวดครึ่งจาก 1,000 ขวด น้อยกว่าน้ำในทะเลมาก" }
      - { id: d, text: "เมฆและไอน้ำในอากาศ", feedback: "ไอน้ำในอากาศมีน้อยมาก แม้เมฆจะดูใหญ่" }
    hints:
      - "พื้นผิวโลกส่วนใหญ่เป็นสีน้ำเงินเมื่อมองจากอวกาศ"
      - "น้ำเค็มมีราว 975 ขวดจาก 1,000 ขวด"
    solution: "น้ำประมาณ 975 ใน 1,000 ส่วนอยู่ในทะเลและมหาสมุทรเป็นน้ำเค็ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hydrosphere.water-cycle.p002
    topics: [earthscience.hydrosphere.water-cycle]
    difficulty: 1
    type: match
    stem: "จับคู่ขั้นตอนในวัฏจักรน้ำกับสิ่งที่เกิดขึ้น"
    pairs:
      - { left: "การระเหย", right: "น้ำในทะเลกลายเป็นไอลอยขึ้นไปในอากาศ" }
      - { left: "การควบแน่น", right: "ไอน้ำเย็นลงเป็นละอองน้ำรวมกันเป็นเมฆ" }
      - { left: "หยาดน้ำฟ้า", right: "ฝนตกลงมาจากเมฆ" }
      - { left: "การคายน้ำ", right: "พืชปล่อยไอน้ำออกทางใบ" }
    hints:
      - "ระเหยคือของเหลวกลายเป็นแก๊ส"
      - "ควบแน่นคือแก๊สกลายเป็นของเหลว"
    solution: "การระเหยทำให้น้ำเป็นไอ การควบแน่นทำให้ไอน้ำเป็นละอองน้ำในเมฆ หยาดน้ำฟ้าคือฝน หิมะ ลูกเห็บที่ตกลงมา และการคายน้ำคือพืชปล่อยไอน้ำออกทางใบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hydrosphere.water-cycle.p003
    topics: [earthscience.hydrosphere.water-cycle]
    difficulty: 1
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นวิธีใช้น้ำอย่างประหยัด (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ปิดก๊อกขณะแปรงฟัน แล้วใช้แก้วรองน้ำบ้วนปาก", correct: true }
      - { id: b, text: "นำน้ำที่ล้างผักไปรดต้นไม้", correct: true }
      - { id: c, text: "ซ่อมก๊อกที่มีน้ำหยดตลอดเวลา", correct: true }
      - { id: d, text: "เปิดน้ำไหลทิ้งไว้ขณะล้างจานทีละใบ", feedback: "น้ำที่ไหลทิ้งระหว่างล้างจานสูญเปล่า ควรรองน้ำในกะละมังแล้วล้าง" }
    hints:
      - "ข้อใดทำให้น้ำไหลทิ้งโดยไม่ได้ใช้"
      - "การใช้น้ำซ้ำก็เป็นการประหยัด"
    solution: "ปิดก๊อกขณะแปรงฟัน ใช้น้ำซ้ำรดต้นไม้ และซ่อมก๊อกรั่วช่วยประหยัดน้ำ ส่วนการเปิดน้ำไหลทิ้งเป็นการสิ้นเปลือง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hydrosphere.water-cycle.p004
    topics: [earthscience.hydrosphere.water-cycle]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนของวัฏจักรน้ำ เริ่มจากน้ำในทะเล"
    items:
      - "แสงอาทิตย์ทำให้น้ำในทะเลระเหยเป็นไอ"
      - "ไอน้ำลอยสูงขึ้นแล้วควบแน่นเป็นเมฆ"
      - "ละอองน้ำในเมฆรวมกันจนหนัก ตกลงมาเป็นฝน"
      - "น้ำฝนไหลลงแม่น้ำแล้วไหลกลับลงทะเล"
    hints:
      - "น้ำต้องกลายเป็นไอก่อนจึงจะลอยขึ้นไปได้"
      - "เมฆต้องเกิดก่อนฝน"
    solution: "ระเหย → ควบแน่นเป็นเมฆ → ตกเป็นฝน → ไหลกลับลงทะเล แล้ววัฏจักรก็เริ่มใหม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hydrosphere.water-cycle.p005
    topics: [earthscience.hydrosphere.water-cycle]
    difficulty: 2
    type: mcq
    stem: "รินน้ำเย็นจัดใส่แก้ว ไม่นานมีหยดน้ำเกาะด้านนอกแก้ว หยดน้ำนี้มาจากไหน"
    choices:
      - { id: a, text: "ไอน้ำในอากาศรอบแก้วควบแน่นเมื่อกระทบผิวแก้วที่เย็น", correct: true }
      - { id: b, text: "น้ำในแก้วซึมผ่านแก้วออกมา", feedback: "แก้วไม่มีรูให้น้ำซึม ถ้าใส่น้ำสีในแก้ว หยดน้ำด้านนอกก็ยังใส ไม่มีสี" }
      - { id: c, text: "น้ำแข็งในแก้วระเหยออกมา", feedback: "การระเหยทำให้น้ำกลายเป็นไอ ไม่ได้ทำให้เกิดหยดน้ำ" }
      - { id: d, text: "หยดน้ำเกิดขึ้นเองจากแก้ว", feedback: "น้ำไม่ได้เกิดขึ้นเอง หยดน้ำต้องมาจากไอน้ำที่มีอยู่ในอากาศ" }
    hints:
      - "อากาศรอบตัวเรามีไอน้ำที่มองไม่เห็น"
      - "ไอน้ำที่เย็นลงจะเปลี่ยนสถานะอย่างไร"
    solution: "อากาศมีไอน้ำ เมื่อไอน้ำกระทบผิวแก้วที่เย็น จะควบแน่นเป็นหยดน้ำ เหมือนการเกิดน้ำค้าง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hydrosphere.water-cycle.p006
    topics: [earthscience.hydrosphere.water-cycle]
    difficulty: 2
    type: text
    stem: "ไอน้ำควบแน่นเป็นละอองน้ำเล็ก ๆ ลอยอยู่ใกล้พื้นดิน ทำให้มองเห็นได้ไม่ไกล เรียกว่าอะไร"
    accepted: ["หมอก", "fog"]
    misconceptions:
      - { match: "น้ำค้าง", feedback: "น้ำค้างเป็นหยดน้ำที่เกาะบนผิวใบไม้หรือยอดหญ้า ไม่ได้ลอยอยู่ในอากาศ" }
      - { match: "เมฆ", feedback: "เมฆเกิดแบบเดียวกันแต่อยู่สูงบนท้องฟ้า ถ้าอยู่ใกล้พื้นเรียกอีกชื่อหนึ่ง" }
    hints:
      - "เหมือนเมฆที่ลงมาอยู่ติดพื้น"
      - "เช้าฤดูหนาวบนดอยสูงมักเห็นสิ่งนี้เป็นทะเลขาว ๆ"
    solution: "หมอก คือละอองน้ำเล็ก ๆ ที่เกิดจากไอน้ำควบแน่นใกล้พื้นดิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hydrosphere.water-cycle.p007
    topics: [earthscience.hydrosphere.water-cycle]
    difficulty: 2
    type: numeric
    stem: "ถ้าแบ่งน้ำทั้งโลกเป็น 1,000 ขวด เป็นน้ำจืด 25 ขวด ในจำนวนนี้เป็นน้ำแข็งประมาณ 17 ขวด น้ำจืดที่ไม่ใช่น้ำแข็งมีประมาณกี่ขวด"
    answer: { value: 8, unit: ขวด }
    misconceptions:
      - { match: 42, feedback: "บวกกันแทนการลบ น้ำแข็งเป็นส่วนหนึ่งของน้ำจืด ต้องลบออก" }
      - { match: 983, feedback: "ลบจาก 1,000 ขวด แต่โจทย์ถามเฉพาะน้ำจืด 25 ขวด" }
    hints:
      - "น้ำแข็งเป็นส่วนหนึ่งของน้ำจืด 25 ขวด"
      - "นำน้ำจืดทั้งหมดลบน้ำแข็ง"
    solution: "$25 - 17 = 8$ ขวด น้ำส่วนนี้ส่วนใหญ่เป็นน้ำใต้ดิน ที่เหลือเป็นน้ำในแม่น้ำ ทะเลสาบ บึง ดิน และอากาศ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hydrosphere.water-cycle.p008
    topics: [earthscience.hydrosphere.water-cycle]
    difficulty: 3
    type: mcq
    stem: "เช้าฤดูหนาว นักท่องเที่ยวบนยอดดอยอินทนนท์เห็นเกล็ดน้ำแข็งสีขาวเกาะบนยอดหญ้า คนในท้องถิ่นเรียกว่าแม่คะนิ้ง สิ่งนี้คืออะไร"
    choices:
      - { id: a, text: "น้ำค้างแข็ง เกิดจากไอน้ำใกล้ผิวหญ้าที่เย็นต่ำกว่า 0 °C เปลี่ยนเป็นน้ำแข็ง", correct: true }
      - { id: b, text: "หิมะที่ตกลงมาจากเมฆ", feedback: "หิมะตกมาจากเมฆ แต่แม่คะนิ้งเกิดบนผิวหญ้าในคืนที่ฟ้าโปร่ง ไม่ต้องมีเมฆ" }
      - { id: c, text: "ลูกเห็บ", feedback: "ลูกเห็บตกจากเมฆฝนฟ้าคะนอง มักเกิดในพายุฤดูร้อน ไม่ใช่เช้าฤดูหนาว" }
      - { id: d, text: "หมอก", feedback: "หมอกเป็นละอองน้ำที่ลอยในอากาศ ไม่ได้เป็นเกล็ดน้ำแข็งเกาะยอดหญ้า" }
    hints:
      - "เกิดบนผิววัตถุ เหมือนน้ำค้าง"
      - "อุณหภูมิตอนเช้ามืดบนยอดดอยต่ำกว่าจุดเยือกแข็ง"
    solution: "แม่คะนิ้งคือน้ำค้างแข็ง ไอน้ำในอากาศใกล้ผิวหญ้าที่เย็นต่ำกว่า 0 °C เปลี่ยนเป็นเกล็ดน้ำแข็งโดยตรง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hydrosphere.water-cycle.p009
    topics: [earthscience.hydrosphere.water-cycle]
    difficulty: 3
    type: mcq
    stem: "นักเรียนใส่น้ำ 100 mL ในจานสองใบที่เหมือนกัน วางใบหนึ่งกลางแดด อีกใบในห้องที่ร่ม ผ่านไป 1 วัน จานกลางแดดเหลือน้ำ 60 mL จานในที่ร่มเหลือ 85 mL ข้อสรุปใดถูกต้อง"
    choices:
      - { id: a, text: "น้ำระเหยเร็วขึ้นเมื่ออุณหภูมิสูงขึ้น", correct: true }
      - { id: b, text: "น้ำในที่ร่มไม่ระเหยเลย", feedback: "จานในที่ร่มก็ลดลง 15 mL แสดงว่าระเหยเหมือนกันแต่ช้ากว่า" }
      - { id: c, text: "แสงแดดทำให้น้ำหายไปจากโลก", feedback: "น้ำไม่ได้หายไปจากโลก แต่กลายเป็นไอน้ำในอากาศ" }
      - { id: d, text: "จานในที่ร่มระเหยมากกว่าเพราะเหลือน้ำมากกว่า", feedback: "ยิ่งเหลือน้ำมาก แปลว่าระเหยไปน้อย" }
    hints:
      - "หาว่าแต่ละจานน้ำลดลงเท่าไร"
      - "สองจานต่างกันที่อะไร"
    solution: "กลางแดดลดลง $100 - 60 = 40$ mL ในที่ร่มลดลง $100 - 85 = 15$ mL จานกลางแดดร้อนกว่าและระเหยมากกว่า จึงสรุปว่าอุณหภูมิสูงทำให้น้ำระเหยเร็วขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hydrosphere.water-cycle.p010
    topics: [earthscience.hydrosphere.water-cycle]
    difficulty: 3
    type: numeric
    stem: "จากการทดลองเดิม จานกลางแดดเหลือน้ำ 60 mL จานในที่ร่มเหลือ 85 mL (เริ่มจาก 100 mL ทั้งสองจาน) จานกลางแดดระเหยมากกว่าจานในที่ร่มกี่มิลลิลิตร"
    answer: { value: 25, unit: mL }
    misconceptions:
      - { match: 40, feedback: "40 mL คือน้ำที่ระเหยจากจานกลางแดดอย่างเดียว ต้องเทียบกับจานในที่ร่ม" }
      - { match: 145, feedback: "บวกน้ำที่เหลือสองจาน ต้องหาผลต่างของน้ำที่ระเหย" }
    hints:
      - "หาน้ำที่ระเหยของแต่ละจานก่อน"
      - "นำสองค่ามาลบกัน"
    solution: "กลางแดดระเหย 40 mL ในที่ร่มระเหย 15 mL ต่างกัน $40 - 15 = 25$ mL (หรือ $85 - 60 = 25$ mL)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hydrosphere.water-cycle.p011
    topics: [earthscience.hydrosphere.water-cycle]
    difficulty: 3
    type: mcq
    stem: "ช่วงพายุฤดูร้อนที่จังหวัดเชียงราย มีก้อนน้ำแข็งตกลงมาพร้อมฝน เมื่อผ่าก้อนน้ำแข็งดูเห็นเป็นชั้นซ้อนกัน ก้อนน้ำแข็งนี้คืออะไรและเกิดอย่างไร"
    choices:
      - { id: a, text: "ลูกเห็บ เกิดจากหยดน้ำถูกลมในเมฆพัดขึ้นลงหลายรอบจนน้ำแข็งพอกเป็นชั้น", correct: true }
      - { id: b, text: "หิมะ เกิดจากไอน้ำกลายเป็นผลึกน้ำแข็ง", feedback: "หิมะเป็นเกล็ดเบา ๆ ไม่ใช่ก้อนน้ำแข็งเป็นชั้น และประเทศไทยอากาศใกล้พื้นอุ่นเกินกว่าหิมะจะตกถึงพื้น" }
      - { id: c, text: "น้ำค้างแข็ง เกิดบนผิวหญ้า", feedback: "น้ำค้างแข็งเกิดบนผิววัตถุ ไม่ได้ตกลงมาจากฟ้า" }
      - { id: d, text: "ฝนที่แข็งตัวเมื่อตกถึงพื้น", feedback: "พื้นดินช่วงฤดูร้อนร้อนมาก ฝนไม่แข็งตัวบนพื้น ก้อนน้ำแข็งเกิดในเมฆ" }
    hints:
      - "ชั้นซ้อนกันบอกว่าน้ำแข็งพอกหลายครั้ง"
      - "เมฆฝนฟ้าคะนองมีลมพัดขึ้นลงแรงมาก"
    solution: "ก้อนน้ำแข็งที่ตกพร้อมพายุฝนฟ้าคะนองคือลูกเห็บ หยดน้ำถูกลมพัดขึ้นไปส่วนบนของเมฆที่เย็นจัด แข็งตัว แล้วตกลงมาเปียกน้ำแล้วถูกพัดขึ้นไปอีก พอกเป็นชั้น ๆ จนหนักเกินกว่าลมจะพยุงไว้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hydrosphere.water-cycle.p012
    topics: [earthscience.hydrosphere.water-cycle]
    difficulty: 4
    type: numeric
    stem: "สมมติว่าก๊อกน้ำที่บ้านปล่อยน้ำนาทีละ 6 ลิตร ถ้าปล่อยน้ำไหลตลอดขณะแปรงฟัน 2 นาที จะใช้น้ำ 12 ลิตร แต่ถ้าใช้แก้วรองน้ำ จะใช้น้ำเพียง 0.5 ลิตร แปรงฟันวันละ 2 ครั้ง ใน 30 วันจะประหยัดน้ำได้กี่ลิตร"
    answer: { value: 690, tolerance: 1, unit: ลิตร }
    misconceptions:
      - { match: 720, feedback: "720 ลิตรคือน้ำที่ใช้ถ้าปล่อยไหลตลอด ต้องหักน้ำ 0.5 ลิตรที่ยังใช้ในแก้ว" }
      - { match: 345, feedback: "คิดเพียงวันละครั้ง โจทย์บอกว่าแปรงฟันวันละ 2 ครั้ง" }
    hints:
      - "หนึ่งครั้งประหยัดได้ $12 - 0.5$ ลิตร"
      - "คูณด้วยจำนวนครั้งต่อวันและจำนวนวัน"
    solution: "ประหยัดครั้งละ $12 - 0.5 = 11.5$ ลิตร วันละ 2 ครั้ง 30 วัน ได้ $11.5 \\times 2 \\times 30 = 690$ ลิตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hydrosphere.water-cycle.p013
    topics: [earthscience.hydrosphere.water-cycle]
    difficulty: 4
    type: mcq
    multiple: true
