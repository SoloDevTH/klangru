  solution: ฟังก์ชันคู่ไม่มีพจน์ sin และฟังก์ชันคี่ไม่มีพจน์ cos คาบ $2L$ ให้ความถี่พื้นฐาน $\frac{\pi}{L}$ และการเลื่อนเวลาเปลี่ยนเฟสโดยไม่เปลี่ยนขนาดของฮาร์มอนิก
