<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" font-family="sans-serif" font-size="14">
  <title>วงรอบดึง ถอดรหัส และทำคำสั่ง ของหน่วยประมวลผลกลาง</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="820" height="360" fill="#ffffff"/>
  <rect x="140.0" y="30.0" width="180.0" height="80.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="230.0" y="57.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">1 ดึง (fetch)</text>
  <text x="230.0" y="74.5" font-size="13" text-anchor="middle" fill="#1f2937">ใช้ที่อยู่ใน PC อ่านคำสั่ง</text>
  <text x="230.0" y="92.1" font-size="13" text-anchor="middle" fill="#1f2937">จากหน่วยความจำมาไว้ใน IR</text>
  <rect x="270.0" y="230.0" width="180.0" height="80.0" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="360.0" y="257.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">2 ถอดรหัส (decode)</text>
  <text x="360.0" y="274.6" font-size="13" text-anchor="middle" fill="#1f2937">หน่วยควบคุมแปลว่า</text>
  <text x="360.0" y="292.1" font-size="13" text-anchor="middle" fill="#1f2937">คำสั่งให้ทำอะไรกับข้อมูลใด</text>
  <rect x="10.0" y="230.0" width="180.0" height="80.0" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="100.0" y="257.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">3 ทำคำสั่ง (execute)</text>
  <text x="100.0" y="274.6" font-size="13" text-anchor="middle" fill="#1f2937">ALU คำนวณ หรือย้ายข้อมูล</text>
  <text x="100.0" y="292.1" font-size="13" text-anchor="middle" fill="#1f2937">แล้วเก็บผลไว้</text>
  <path d="M322,80 Q400,120 380,226" stroke="#1f2937" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M268,275 L192,275" stroke="#1f2937" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M80,226 Q60,120 138,80" stroke="#1f2937" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <text x="400.0" y="150.0" font-size="12" text-anchor="start" fill="#6b7280">PC เพิ่มขึ้น 1</text>
  <text x="230.0" y="335.0" font-size="13" text-anchor="middle" fill="#6b7280">วนซ้ำจนกว่าจะพบคำสั่ง HALT</text>
  <text x="650.0" y="40.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">หน่วยความจำหลัก (ตัวอย่าง)</text>
  <text x="560.0" y="66.0" font-size="13" text-anchor="middle" fill="#6b7280">ที่อยู่</text>
  <text x="690.0" y="66.0" font-size="13" text-anchor="middle" fill="#6b7280">สิ่งที่เก็บ</text>
  <rect x="520.0" y="76.0" width="80.0" height="34.0" rx="0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="600.0" y="76.0" width="180.0" height="34.0" rx="0" fill="#dbeafe" stroke="#6b7280" stroke-width="1.5"/>
  <text x="560.0" y="99.0" font-size="14" text-anchor="middle" fill="#1f2937">0</text>
  <text x="690.0" y="99.0" font-size="14" text-anchor="middle" fill="#1f2937">LOAD 4</text>
  <rect x="520.0" y="110.0" width="80.0" height="34.0" rx="0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="600.0" y="110.0" width="180.0" height="34.0" rx="0" fill="#dbeafe" stroke="#6b7280" stroke-width="1.5"/>
  <text x="560.0" y="133.0" font-size="14" text-anchor="middle" fill="#1f2937">1</text>
  <text x="690.0" y="133.0" font-size="14" text-anchor="middle" fill="#1f2937">ADD 5</text>
  <rect x="520.0" y="144.0" width="80.0" height="34.0" rx="0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="600.0" y="144.0" width="180.0" height="34.0" rx="0" fill="#dbeafe" stroke="#6b7280" stroke-width="1.5"/>
  <text x="560.0" y="167.0" font-size="14" text-anchor="middle" fill="#1f2937">2</text>
  <text x="690.0" y="167.0" font-size="14" text-anchor="middle" fill="#1f2937">STORE 6</text>
  <rect x="520.0" y="178.0" width="80.0" height="34.0" rx="0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="600.0" y="178.0" width="180.0" height="34.0" rx="0" fill="#dbeafe" stroke="#6b7280" stroke-width="1.5"/>
  <text x="560.0" y="201.0" font-size="14" text-anchor="middle" fill="#1f2937">3</text>
  <text x="690.0" y="201.0" font-size="14" text-anchor="middle" fill="#1f2937">HALT</text>
  <rect x="520.0" y="212.0" width="80.0" height="34.0" rx="0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="600.0" y="212.0" width="180.0" height="34.0" rx="0" fill="#fef9c3" stroke="#6b7280" stroke-width="1.5"/>
  <text x="560.0" y="235.0" font-size="14" text-anchor="middle" fill="#1f2937">4</text>
  <text x="690.0" y="235.0" font-size="14" text-anchor="middle" fill="#1f2937">7</text>
  <rect x="520.0" y="246.0" width="80.0" height="34.0" rx="0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="600.0" y="246.0" width="180.0" height="34.0" rx="0" fill="#fef9c3" stroke="#6b7280" stroke-width="1.5"/>
  <text x="560.0" y="269.0" font-size="14" text-anchor="middle" fill="#1f2937">5</text>
  <text x="690.0" y="269.0" font-size="14" text-anchor="middle" fill="#1f2937">8</text>
  <rect x="520.0" y="280.0" width="80.0" height="34.0" rx="0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="600.0" y="280.0" width="180.0" height="34.0" rx="0" fill="#fef9c3" stroke="#6b7280" stroke-width="1.5"/>
  <text x="560.0" y="303.0" font-size="14" text-anchor="middle" fill="#1f2937">6</text>
  <text x="690.0" y="303.0" font-size="14" text-anchor="middle" fill="#1f2937">0</text>
  <text x="650.0" y="330.0" font-size="12" text-anchor="middle" fill="#6b7280">คำสั่ง (ฟ้า) และข้อมูล (เหลือง) อยู่ในหน่วยความจำเดียวกัน</text>
</svg>
