  - id: d
    text: ใช้ข้อความเดิมทั้งหมดโดยไม่บอกที่มา เพราะเป็นความรู้ทั่วไป
    feedback: ข้อความที่เขียนไว้เป็นงานของผู้เขียน ถึงความรู้จะเป็นเรื่องทั่วไปก็ต้องเรียบเรียงเอง
  hints:
