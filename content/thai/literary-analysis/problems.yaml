  stem: ดูตัวบทในภาพ ข้อสรุปใด **มีหลักฐานในตัวบทรองรับ** (เลือกทุกข้อที่ถูก)
  figure:
    src: bang-thorani.svg
    alt: ตัวบทนิราศภูเขาทองของสุนทรภู่ ตามวิกิซอร์ซ ตอนผ่านบางธรณี 4 บรรทัด บรรทัด 1 มาถึงบางธรณีทวีโศก ยามวิโยคยากใจให้สะอื้น บรรทัด 2 โอ้สุธาหนาแน่นเป็นแผ่นพื้น ถึงสี่หมื่นสองแสนทั้งแดนไตร บรรทัด 3 เมื่อเคราะห์ร้ายกายเราก็เท่านี้ ไม่มีที่พสุธาจะอาศัย บรรทัด 4 ล้วนหนามเหน็บเจ็บแสบคับแคบใจ เหมือนนกไร้รังเร่อยู่เอกา
