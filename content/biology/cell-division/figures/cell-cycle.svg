<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="sans-serif" font-size="14">
<title>วัฏจักรเซลล์ของเซลล์ที่ใช้เวลา 24 ชั่วโมงต่อรอบ</title>
<rect x="0" y="0" width="880" height="440" fill="#ffffff"/>
<path d="M270,230 L270.0,80.0 A150,150 0 0 1 308.8,374.9 Z" fill="#a5d6a7" stroke="#fff" stroke-width="3"/>
<text x="362.2" y="223.9" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">G1</text>
<text x="362.2" y="245.9" text-anchor="middle" font-size="13" fill="#222">11 ชม.</text>
<path d="M270,230 L308.8,374.9 A150,150 0 0 1 125.1,191.2 Z" fill="#90caf9" stroke="#fff" stroke-width="3"/>
<text x="204.2" y="301.8" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">S</text>
<text x="204.2" y="323.8" text-anchor="middle" font-size="13" fill="#222">8 ชม.</text>
<path d="M270,230 L125.1,191.2 A150,150 0 0 1 231.2,85.1 Z" fill="#ffe082" stroke="#fff" stroke-width="3"/>
<text x="204.2" y="170.2" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">G2</text>
<text x="204.2" y="192.2" text-anchor="middle" font-size="13" fill="#222">4 ชม.</text>
<path d="M270,230 L231.2,85.1 A150,150 0 0 1 270.0,80.0 Z" fill="#ef9a9a" stroke="#fff" stroke-width="3"/>
<circle cx="270" cy="230" r="52" fill="#fff" stroke="#bdbdbd"/>
<text x="270.0" y="226.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">วัฏจักรเซลล์</text>
<text x="270.0" y="246.0" text-anchor="middle" font-size="13" fill="#222">24 ชั่วโมง</text>
<line x1="250.4" y1="81.3" x2="120" y2="38" stroke="#333"/>
<text x="20.0" y="30.0" text-anchor="start" font-size="13" font-weight="bold" fill="#222">M (ไมโทซิสและไซโทไคนีซิส) 1 ชม.</text>
<path d="M293.4,63.6 A168,168 0 1 1 246.6,63.6" fill="none" stroke="#455a64" stroke-width="2.5"/>
<polygon points="246.6,63.6 239.1,68.6 238.0,60.9" fill="#455a64"/>
<text x="450.0" y="190.0" text-anchor="start" font-size="15" font-weight="bold" fill="#455a64">อินเตอร์เฟส</text>
<text x="500.0" y="300.0" text-anchor="start" font-size="13" font-weight="bold" fill="#222">G1:</text>
<text x="532.0" y="300.0" text-anchor="start" font-size="12" fill="#222">เซลล์เติบโต สร้างโปรตีนและออร์แกเนลล์</text>
<text x="500.0" y="328.0" text-anchor="start" font-size="13" font-weight="bold" fill="#222">S:</text>
<text x="532.0" y="328.0" text-anchor="start" font-size="12" fill="#222">จำลอง DNA โครโมโซมเป็นสองโครมาทิด</text>
<text x="500.0" y="356.0" text-anchor="start" font-size="13" font-weight="bold" fill="#222">G2:</text>
<text x="532.0" y="356.0" text-anchor="start" font-size="12" fill="#222">เตรียมพร้อมแบ่งเซลล์</text>
<text x="500.0" y="384.0" text-anchor="start" font-size="13" font-weight="bold" fill="#222">M:</text>
<text x="532.0" y="384.0" text-anchor="start" font-size="12" fill="#222">แบ่งนิวเคลียสและไซโทพลาซึม</text>
