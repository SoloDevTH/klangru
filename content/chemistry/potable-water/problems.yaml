    stem: "เครื่อง RO บนเกาะเล็กแห่งหนึ่งเปลี่ยนน้ำทะเล (เกลือ 35 g/L) เป็นน้ำจืดได้ 40% ของน้ำที่ป้อน ส่วนที่เหลือเป็นน้ำเกลือเข้มข้น ถ้าต้องการน้ำจืด 600 L ต่อวัน และถือว่าเกลือทั้งหมดไปอยู่ในน้ำเกลือเข้มข้น น้ำเกลือเข้มข้นนี้มีเกลือกี่ g/L (ตอบทศนิยมหนึ่งตำแหน่ง ค่าสมมติ)"
    answer: { value: 58.3, unit: g/L, tolerance: 0.3 }
    misconceptions:
      - { match: 87.5, feedback: "หารเกลือทั้งหมดด้วยปริมาตรน้ำจืด 600 L แต่เกลืออยู่ในน้ำเกลือเข้มข้นที่เหลือ 900 L" }
      - { match: 35, feedback: "นี่คือความเข้มข้นของน้ำทะเลเดิม น้ำเกลือที่ทิ้งเข้มข้นกว่าเพราะน้ำส่วนหนึ่งถูกแยกออกไปแล้ว" }
    hints:
      - "น้ำทะเลที่ป้อน = 600 ÷ 0.40 L"
      - "เกลือทั้งหมด = ปริมาตรน้ำทะเล × 35 g/L แล้วหารด้วยปริมาตรน้ำเกลือที่เหลือ"
    solution: "น้ำทะเล $= 600/0.40 = 1500$ L มีเกลือ $1500 \\times 35 = 52{,}500$ g น้ำเกลือเข้มข้น $= 1500 - 600 = 900$ L ความเข้มข้น $= 52{,}500/900 =$ **58.3 g/L** จึงต้องปล่อยทิ้งอย่างระวังไม่ให้กระทบสัตว์ทะเลรอบจุดปล่อย"
