  stem: สหกรณ์ร้านค้า (สมมติ) มีกำไรสุทธิ $250{,}000$ บาท ค่าหุ้นของสมาชิกรวม $1{,}500{,}000$ บาท ข้อบังคับกำหนดให้จัดสรรดังนี้ ทุนสำรอง $10\%$ ของกำไรสุทธิ ปันผล $6\%$ ของค่าหุ้น ทุนสวัสดิการสมาชิก $5\%$ ของกำไรสุทธิ โบนัสกรรมการและเจ้าหน้าที่ $5\%$ ของกำไรสุทธิ ที่เหลือทั้งหมดเป็นเงินเฉลี่ยคืน เงินเฉลี่ยคืนมีกี่บาท (ตอบเป็นบาท)
  answer:
    value: 110000
    unit: บาท
  misconceptions:
