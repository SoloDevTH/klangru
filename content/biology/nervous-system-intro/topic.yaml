id: biology.humans.nervous-system-intro
subject: biology
title: { th: ระบบประสาทส่วนกลาง, en: "The central nervous system" }
summary: เซลล์ประสาท 3 แบบ ส่วนต่าง ๆ ของสมองกับหน้าที่ ไขสันหลังกับวงจรรีเฟล็กซ์ เวลาตอบสนอง และการป้องกันอันตรายต่อสมองและไขสันหลัง
difficulty: 3
minutes: 35
prerequisites: [biology.cells.cell-basics]
encompasses:
  - { id: biology.cells.cell-basics, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ส่วนต่าง ๆ ของสมองและไขสันหลัง
    src: brain-parts.svg
    alt: "สมองมองด้านข้าง ด้านหน้าอยู่ทางซ้าย ซีรีบรัมเป็นส่วนใหญ่ที่สุดสีชมพูมีรอยหยัก หน้าที่คิด จำ ตัดสินใจ สั่งการเคลื่อนไหว ใต้ซีรีบรัมตรงกลางมีทาลามัสสีเหลือง หน้าที่ถ่ายทอดกระแสประสาท และไฮโพทาลามัสสีส้มเล็ก ๆ อยู่ใต้และค่อนไปทางหน้า หน้าที่ควบคุมอุณหภูมิ หิว กระหาย ด้านหลังใต้ซีรีบรัมคือซีรีเบลลัมสีม่วงมีลายเส้น หน้าที่ทรงตัว ก้านสมองสีฟ้าต่อลงมาจากใต้ทาลามัส ประกอบด้วยสมองส่วนกลาง พอนส์ และเมดัลลาออบลองกาตา หน้าที่ควบคุมการหายใจและการเต้นของหัวใจ ต่อลงไปเป็นไขสันหลังสีเหลือง"
    caption: "สมองส่วนกลาง พอนส์ และเมดัลลาออบลองกาตารวมเรียกว่าก้านสมอง (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: figure
    title: วงจรรีเฟล็กซ์
    src: reflex-arc.svg
    alt: "ด้านซ้ายเป็นผิวหนังที่ปลายนิ้วมีความร้อนเป็นสิ่งเร้า หน่วยรับความรู้สึกเป็นจุดสีเขียว เส้นสีเขียวคือเซลล์ประสาทรับความรู้สึก มีตัวเซลล์อยู่นอกไขสันหลัง ลากเข้าสู่ไขสันหลังที่วาดเป็นภาคตัดขวางทางขวา (วงรีสีเหลืองมีเนื้อสีเทารูปผีเสื้อตรงกลาง) ในเนื้อสีเทามีเซลล์ประสาทประสานงานสีส้มเชื่อมต่อกับเซลล์ประสาทสั่งการสีน้ำเงิน ซึ่งลากออกจากไขสันหลังไปยังกล้ามเนื้อแขนด้านล่าง กล้ามเนื้อหดตัวเป็นการตอบสนอง ลูกศรบอกทิศ 1 รับความรู้สึก 2 ประสานงาน 3 สั่งการ"
    caption: "เส้นทางผ่านไขสันหลังสั้น มือจึงชักกลับก่อนที่สมองจะรับรู้ว่าร้อน (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: บอกส่วนของสมองที่เกี่ยวข้อง
    problem: "นักกีฬาฟุตบอลมองเห็นลูก ตัดสินใจเตะไปที่ประตู และวิ่งไปเตะโดยไม่ล้ม ขณะเดียวกันหัวใจเต้นเร็วขึ้นและหายใจถี่ขึ้น บอกส่วนของสมองที่ทำงานในแต่ละเหตุการณ์"
    steps:
      - text: "มองเห็นลูกและตัดสินใจเตะ เป็นการรับรู้และคิด → ซีรีบรัม ซึ่งสั่งการกล้ามเนื้อขาด้วย"
      - text: "วิ่งและเตะโดยไม่ล้ม เป็นการทรงตัวและประสานการเคลื่อนไหว → ซีรีเบลลัม"
      - text: "หัวใจเต้นเร็วขึ้นและหายใจถี่ขึ้นเองโดยไม่ได้สั่ง → ก้านสมอง (เมดัลลาออบลองกาตา)"
        why: "งานที่อยู่นอกอำนาจจิตใจถูกควบคุมโดยก้านสมอง"
    answer: "ซีรีบรัม (มองและตัดสินใจ) ซีรีเบลลัม (ทรงตัว) และเมดัลลาออบลองกาตา (หัวใจและการหายใจ)"
  - { type: check, problem: biology.humans.nervous-system-intro.p004, prompt: "ส่วนที่ทรงตัวอยู่ตำแหน่งใดของสมอง" }
  - type: worked-example
    title: เปรียบเทียบเวลาตอบสนองด้วยไม้บรรทัด
    problem: "ก่อนนอนดึก ไม้บรรทัดตกไป 0.10 เมตรก่อนหนีบได้ หลังอดนอน ไม้บรรทัดตกไป 0.15 เมตร เวลาตอบสนองเปลี่ยนไปเท่าไร ($g = 9.8\\ \\mathrm{m/s^2}$)"
    steps:
      - text: "ก่อน: $t = \\sqrt{\\frac{2 \\times 0.10}{9.8}} \\approx 0.143$ วินาที"
      - text: "หลัง: $t = \\sqrt{\\frac{2 \\times 0.15}{9.8}} \\approx 0.175$ วินาที"
        why: "ไม้บรรทัดตกเร็วขึ้นเรื่อย ๆ ระยะที่ตกจึงไม่แปรผันตรงกับเวลา ต้องใช้สูตรนี้"
      - text: "เวลาเพิ่มขึ้น $0.175 - 0.143 \\approx 0.03$ วินาที"
    answer: "ช้าลงราว 0.03 วินาที การอดนอนทำให้สมองตอบสนองช้าลง"
  - { type: check, problem: biology.humans.nervous-system-intro.p006, prompt: "การตอบสนองนี้ต้องคิดก่อนหรือไม่" }
glossary:
  - { term: ระบบประสาทส่วนกลาง, definition: "สมองและไขสันหลัง เป็นศูนย์ควบคุมการทำงานของร่างกาย" }
  - { term: เซลล์ประสาท, definition: "เซลล์ที่นำกระแสประสาท ประกอบด้วยตัวเซลล์ เดนไดรต์ และแอกซอน" }
  - { term: ซีรีบรัม, definition: "สมองส่วนที่ใหญ่ที่สุด ควบคุมความคิด ความจำ การรับรู้ และการเคลื่อนไหวที่ตั้งใจ" }
  - { term: ซีรีเบลลัม, definition: "สมองน้อย ควบคุมการทรงตัวและประสานการเคลื่อนไหว" }
  - { term: เมดัลลาออบลองกาตา, definition: "ก้านสมองส่วนท้ายที่ต่อกับไขสันหลัง ควบคุมการหายใจ การเต้นของหัวใจ การไอ จาม กลืน" }
  - { term: รีเฟล็กซ์, definition: "การตอบสนองต่อสิ่งเร้าที่เกิดขึ้นทันทีโดยไม่ต้องคิด เช่น กระตุกเข่า ชักมือหนีของร้อน" }
flashcards:
  - { front: "ซีรีบรัม vs ซีรีเบลลัม", back: "ซีรีบรัม: คิด จำ ตัดสินใจ ซีรีเบลลัม: ทรงตัว ประสานการเคลื่อนไหว" }
  - { front: "ศูนย์ควบคุมการหายใจและหัวใจเต้น", back: "เมดัลลาออบลองกาตา (ก้านสมอง)" }
  - { front: "หน้าที่ของไขสันหลัง", back: "ทางผ่านกระแสประสาทระหว่างสมองกับร่างกาย และศูนย์ควบคุมรีเฟล็กซ์" }
  - { front: "วงจรรีเฟล็กซ์", back: "หน่วยรับความรู้สึก → ประสาทรับความรู้สึก → ประสาทประสานงาน → ประสาทสั่งการ → หน่วยปฏิบัติงาน" }
  - { front: "พบคนเจ็บคอหรือหลังหลังตกจากที่สูง", back: "ไม่ขยับตัวผู้บาดเจ็บ แล้วโทร 1669" }
