  <text x="140.0" y="82.0" font-size="15" text-anchor="middle" fill="#0a6b60" font-weight="bold" font-style="normal">ดนตรี</text>
  <text x="330.0" y="82.0" font-size="15" text-anchor="middle" fill="#b4521f" font-weight="bold" font-style="normal">ว่ายน้ำ</text>
  <text x="135.0" y="188.0" font-size="22" text-anchor="middle" fill="#15211e" font-weight="bold" font-style="normal">7</text>
  <text x="235.0" y="188.0" font-size="22" text-anchor="middle" fill="#15211e" font-weight="bold" font-style="normal">5</text>
  <text x="335.0" y="188.0" font-size="22" text-anchor="middle" fill="#15211e" font-weight="bold" font-style="normal">10</text>
  <text x="410.0" y="272.0" font-size="22" text-anchor="middle" fill="#15211e" font-weight="bold" font-style="normal">8</text>
