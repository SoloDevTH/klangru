problems:
  - id: engineering.mechanics.rigid-body-equilibrium.p001
    topics: [engineering.mechanics.rigid-body-equilibrium]
    difficulty: 1
    type: mcq
    stem: "ข้อใดคือเงื่อนไขสมดุลของวัตถุแข็งเกร็งในระนาบ"
    choices:
      - { id: a, text: "$\\sum F_x = 0$, $\\sum F_y = 0$ และ $\\sum M_O = 0$ รอบจุดใดก็ได้", correct: true }
      - { id: b, text: "$\\sum F_x = 0$ และ $\\sum F_y = 0$ เท่านั้น", feedback: "พอสำหรับอนุภาค แต่วัตถุแข็งเกร็งหมุนได้ ต้องให้โมเมนต์ลัพธ์เป็นศูนย์ด้วย" }
      - { id: c, text: "$\\sum M_O = 0$ รอบจุดศูนย์กลางมวลเท่านั้น", feedback: "เมื่อแรงลัพธ์เป็นศูนย์แล้ว โมเมนต์ลัพธ์เท่ากันทุกจุด จึงเลือกจุดใดก็ได้ และยังต้องมีสมการแรงด้วย" }
      - { id: d, text: "แรงทุกแรงต้องผ่านจุดเดียวกัน", feedback: "นั่นคือกรณีพิเศษของอนุภาค วัตถุแข็งเกร็งมีแรงหลายแนวได้" }
    hints:
      - "วัตถุแข็งเกร็งทั้งเลื่อนที่และหมุนได้"
      - "ต้องห้ามทั้งสองอย่าง"
    solution: "สมดุลต้องไม่มีความเร่งเชิงเส้นและเชิงมุม จึงต้องมี $\\sum \\vec F = \\vec 0$ และ $\\sum \\vec M_O = \\vec 0$ ในระนาบได้สามสมการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.mechanics.rigid-body-equilibrium.p002
    topics: [engineering.mechanics.rigid-body-equilibrium]
    difficulty: 1
    type: match
    stem: "จับคู่ฐานรองรับในสองมิติกับแรงปฏิกิริยาที่ต้องวาดในแผนภาพวัตถุอิสระ"
    pairs:
      - { left: "ลูกกลิ้งบนพื้นราบ", right: "แรงหนึ่งแรงตั้งฉากกับพื้น" }
      - { left: "หมุดหรือบานพับ", right: "แรงสองแรง Ax และ Ay" }
      - { left: "ฐานยึดแน่น", right: "แรงสองแรงและโมเมนต์หนึ่งค่า" }
      - { left: "ลวดยึด", right: "แรงตึงหนึ่งแรงตามแนวลวด" }
    hints:
      - "ฐานรองรับห้ามการเคลื่อนที่ทิศใด ก็ให้แรงในทิศนั้น"
      - "ฐานที่ห้ามการหมุนด้วยให้โมเมนต์"
    solution: "ลูกกลิ้งห้ามเฉพาะการเคลื่อนตั้งฉากกับผิว (1 ค่า) หมุดห้ามการเลื่อนทุกทิศ (2 ค่า) ฐานยึดแน่นห้ามทั้งเลื่อนและหมุน (3 ค่า) ลวดดึงได้ตามแนวของมันเท่านั้น (1 ค่า)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.mechanics.rigid-body-equilibrium.p003
    topics: [engineering.mechanics.rigid-body-equilibrium]
    difficulty: 2
    type: numeric
    stem: "ช่างออกแรง $150\\ \\mathrm{N}$ ที่ปลายประแจซึ่งห่างจากศูนย์กลางนอต $0.25\\ \\mathrm{m}$ แนวแรงทำมุม $60^\\circ$ กับด้ามประแจ โมเมนต์รอบนอตเป็นกี่นิวตันเมตร (ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 32.5, tolerance: 0.3, unit: "N·m" }
    misconceptions:
      - { match: 18.75, feedback: "ใช้ $\\cos 60^\\circ$ แต่องค์ประกอบที่ทำให้หมุนคือส่วนที่ตั้งฉากกับด้าม คือ $F\\sin 60^\\circ$" }
      - { match: 37.5, feedback: "คูณแรงกับความยาวด้ามตรง ๆ ซึ่งถูกเฉพาะเมื่อแรงตั้งฉากกับด้าม" }
    hints:
      - "โมเมนต์ใช้ระยะตั้งฉากถึงแนวแรง หรือองค์ประกอบของแรงที่ตั้งฉากกับด้าม"
      - "$M = Fr\\sin\\theta$ เมื่อ $\\theta$ คือมุมระหว่างแรงกับด้าม"
    solution: "$M = Fr\\sin\\theta = 150 \\times 0.25 \\times \\sin 60^\\circ = 37.5 \\times 0.8660 = 32.5\\ \\mathrm{N\\cdot m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.mechanics.rigid-body-equilibrium.p004
    topics: [engineering.mechanics.rigid-body-equilibrium]
    difficulty: 2
    type: numeric
    stem: "แรง $\\vec F = (300\\hat i - 400\\hat j)\\ \\mathrm{N}$ กระทำที่จุด $(2, 1.5)\\ \\mathrm{m}$ จงหาโมเมนต์ $M_O$ รอบจุดกำเนิด (นิวตันเมตร ตอบพร้อมเครื่องหมาย ทวนเข็มนาฬิกาเป็นบวก)"
    answer: { value: -1250, tolerance: 1, unit: "N·m" }
    misconceptions:
      - { match: 1250, feedback: "สลับลำดับเป็น $yF_x - xF_y$ ผลคูณเชิงเวกเตอร์ $\\vec r \\times \\vec F$ ให้ $M_O = xF_y - yF_x$" }
      - { match: -350, feedback: "บวก $yF_x$ แทนการลบ สูตรคือ $xF_y - yF_x$" }
    hints:
      - "$\\vec M_O = \\vec r \\times \\vec F$ ในระนาบเหลือองค์ประกอบ $z$"
      - "$M_O = xF_y - yF_x$"
    solution: "$M_O = (2)(-400) - (1.5)(300) = -800 - 450 = -1250\\ \\mathrm{N\\cdot m}$ เครื่องหมายลบคือหมุนตามเข็มนาฬิกา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.mechanics.rigid-body-equilibrium.p005
    topics: [engineering.mechanics.rigid-body-equilibrium]
    difficulty: 2
    type: numeric
    stem: "มือทั้งสองข้างหมุนพวงมาลัยด้วยแรง $80\\ \\mathrm{N}$ ทิศตรงข้ามกัน แนวแรงขนานห่างกัน $0.36\\ \\mathrm{m}$ โมเมนต์ของคู่ควบเป็นกี่นิวตันเมตร (ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 28.8, tolerance: 0.2, unit: "N·m" }
    misconceptions:
      - { match: 57.6, feedback: "คิดโมเมนต์ของแต่ละแรงด้วยระยะเต็ม $0.36\\ \\mathrm{m}$ แล้วบวกกัน โมเมนต์ของคู่ควบคือแรงหนึ่งแรงคูณระยะระหว่างแนวแรง" }
      - { match: 14.4, feedback: "ใช้ระยะครึ่งหนึ่ง ซึ่งคือโมเมนต์ของแรงเพียงแรงเดียวรอบจุดศูนย์กลาง ต้องรวมทั้งสองแรง" }
    hints:
      - "คู่ควบมีโมเมนต์ $M = Fd$ เมื่อ $d$ คือระยะระหว่างแนวแรงทั้งสอง"
      - "โมเมนต์ของคู่ควบเท่ากันรอบทุกจุด"
    solution: "$M = Fd = 80 \\times 0.36 = 28.8\\ \\mathrm{N\\cdot m}$ (ตรวจ: รอบจุดกึ่งกลาง แต่ละแรงให้ $80 \\times 0.18 = 14.4$ รวมสองแรงได้ $28.8$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.mechanics.rigid-body-equilibrium.p006
    topics: [engineering.mechanics.rigid-body-equilibrium]
    difficulty: 3
    type: numeric
    stem: "ผนังกั้นน้ำได้รับแรงดันน้ำเป็นแรงกระจายรูปสามเหลี่ยม จาก $0$ ที่ผิวน้ำถึง $6\\ \\mathrm{kN/m}$ ที่ก้นซึ่งลึก $3\\ \\mathrm{m}$ (คิดต่อความกว้างผนัง 1 เมตร) แรงลัพธ์มีขนาดกี่กิโลนิวตัน"
    answer: { value: 9, tolerance: 0.05, unit: kN }
    misconceptions:
      - { match: 18, feedback: "คูณค่าสูงสุดกับความยาวเหมือนแรงกระจายสม่ำเสมอ แรงลัพธ์คือพื้นที่สามเหลี่ยม ต้องคูณ $\\tfrac12$" }
      - { match: 6, feedback: "ใช้ค่าสูงสุดของแรงต่อความยาวเป็นแรง ต้องคูณกับความยาวที่กระจาย" }
    hints:
      - "แรงลัพธ์ของแรงกระจาย = พื้นที่ใต้กราฟแรงต่อความยาว"
      - "พื้นที่สามเหลี่ยม $= \\tfrac12 \\times$ ฐาน $\\times$ สูง"
    solution: "$F_R = \\tfrac12 (6)(3) = 9\\ \\mathrm{kN}$ กระทำที่ระยะ $3/3 = 1\\ \\mathrm{m}$ เหนือก้น (ด้านที่แรงมากที่สุด)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.mechanics.rigid-body-equilibrium.p007
    topics: [engineering.mechanics.rigid-body-equilibrium]
    difficulty: 3
    type: numeric
    stem: "สะพานไม้คนเดินข้ามคลองยาว $6\\ \\mathrm{m}$ (ค่าสมมติ) วางบนหมุดที่ฝั่ง A และลูกกลิ้งที่ฝั่ง B รถเข็นขายผลไม้หนัก $12\\ \\mathrm{kN}$ จอดอยู่ห่างฝั่ง A $2\\ \\mathrm{m}$ ไม่คิดน้ำหนักสะพาน แรงปฏิกิริยาแนวดิ่งที่ A เป็นกี่กิโลนิวตัน"
    answer: { value: 8, tolerance: 0.05, unit: kN }
    misconceptions:
      - { match: 4, feedback: "นี่คือแรงที่ B ฝั่งที่อยู่ใกล้น้ำหนักต้องรับแรงมากกว่า" }
      - { match: 6, feedback: "แบ่งครึ่ง ซึ่งถูกเฉพาะเมื่อน้ำหนักอยู่กึ่งกลาง" }
    hints:
      - "หาโมเมนต์รอบ B เพื่อตัดแรงที่ B ออก"
      - "$6A_y = 12 \\times (6 - 2)$"
    solution: "$\\sum M_B = 0$: $6A_y - 12(4) = 0$ ได้ $A_y = 8\\ \\mathrm{kN}$ ตรวจ: $\\sum M_A$ ได้ $B_y = 12(2)/6 = 4$ และ $8 + 4 = 12$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.mechanics.rigid-body-equilibrium.p008
    topics: [engineering.mechanics.rigid-body-equilibrium]
    difficulty: 3
    type: numeric
    stem: "คาน ABC ในภาพมีหมุดที่ A ลูกกลิ้งที่ B ช่วง AB ยาว $4\\ \\mathrm{m}$ รับแรงกระจาย $2\\ \\mathrm{kN/m}$ และปลายยื่น C ห่าง B $2\\ \\mathrm{m}$ รับแรง $3\\ \\mathrm{kN}$ ลง แรงปฏิกิริยาแนวดิ่งที่ A เป็นกี่กิโลนิวตัน (ชี้ขึ้นเป็นบวก)"
    figure: { src: p-overhang.svg, alt: "คาน ABC แนวราบ หมุดที่ A ลูกกลิ้งที่ B ห่าง A 4 เมตร ปลาย C ยื่นเลย B ไป 2 เมตร แรงกระจายสม่ำเสมอ 2 kN/m กดลงตลอดช่วง AB และแรงจุด 3 kN กดลงที่ปลาย C" }
    answer: { value: 2.5, tolerance: 0.05, unit: kN }
    misconceptions:
      - { match: 4, feedback: "ลืมแรงที่ปลายยื่น แรง 3 kN ที่ C ทำให้คานกระดกรอบ B และยก A ขึ้น แรงที่ A จึงลดลง" }
      - { match: 8.5, feedback: "นี่คือแรงที่ B" }
    hints:
      - "เปลี่ยนแรงกระจายเป็นแรงลัพธ์ $8\\ \\mathrm{kN}$ ที่กึ่งกลาง AB"
      - "หาโมเมนต์รอบ B: แรงที่ C อยู่คนละฝั่งกับแรงกระจาย"
    solution: "$\\sum M_B = 0$ (ทวนเข็มบวก): $-4A_y + 8(2) - 3(2) = 0$ ได้ $A_y = 2.5\\ \\mathrm{kN}$ จาก $\\sum M_A$: $4B_y = 8(2) + 3(6) = 34$ ได้ $B_y = 8.5\\ \\mathrm{kN}$ ตรวจ $2.5 + 8.5 = 8 + 3$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.mechanics.rigid-body-equilibrium.p009
    topics: [engineering.mechanics.rigid-body-equilibrium]
    difficulty: 3
    type: mcq
    stem: "คานในระนาบยึดด้วยหมุดที่ปลายทั้งสองข้าง ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "มีค่าที่ไม่รู้ 4 ค่า แต่มีสมการสมดุล 3 สมการ จึงเป็นอินดีเทอร์มิเนตเชิงสถิต", correct: true }
      - { id: b, text: "มีค่าที่ไม่รู้ 2 ค่า หาได้ด้วย $\\sum F_y = 0$ และ $\\sum M = 0$", feedback: "หมุดแต่ละตัวให้แรงสองแรง ($x$ และ $y$) รวมเป็น 4 ค่า" }
      - { id: c, text: "หาแรงทั้งหมดได้ เพราะหาโมเมนต์รอบหลายจุดได้หลายสมการ", feedback: "สมการโมเมนต์รอบจุดอื่นไม่ใช่สมการอิสระใหม่ ในระนาบมีสมการอิสระเพียง 3 สมการ" }
      - { id: d, text: "คานเคลื่อนที่ได้ จึงไม่สมดุล", feedback: "คานมีฐานรองรับมากเกินพอ ไม่ใช่น้อยเกินไป" }
    hints:
      - "นับค่าที่ไม่รู้จากฐานรองรับ"
      - "ในระนาบมีสมการสมดุลอิสระกี่สมการ"
    solution: "หมุดสองตัวให้ $A_x, A_y, B_x, B_y$ รวม 4 ค่า แต่สมการสมดุลในระนาบมี 3 สมการ หาแรง $A_y$ และ $B_y$ ได้ แต่แยก $A_x$ กับ $B_x$ ไม่ได้ ต้องใช้การเสียรูปของคานช่วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.mechanics.rigid-body-equilibrium.p010
    topics: [engineering.mechanics.rigid-body-equilibrium]
    difficulty: 4
    type: numeric
    stem: "บูม AB สม่ำเสมอหนัก $0.5\\ \\mathrm{kN}$ ยาว $4\\ \\mathrm{m}$ ยึดผนังด้วยบานพับที่ A และลวด BC ไปยังจุด C บนผนังสูงกว่า A $3\\ \\mathrm{m}$ ดังภาพ ที่ปลาย B แขวนของหนัก $2\\ \\mathrm{kN}$ แรงตึงในลวด BC เป็นกี่กิโลนิวตัน"
    figure: { src: p-boom.svg, alt: "ผนังแนวดิ่งด้านซ้าย บูม AB แนวราบยาว 4 เมตร ต่อกับผนังด้วยบานพับที่ A ปลาย B ผูกลวดเฉียงขึ้นไปยังจุด C บนผนังซึ่งสูงกว่า A 3 เมตร ที่ B แขวนกล่องหนัก 2 kN บูมสม่ำเสมอหนัก 0.5 kN" }
    answer: { value: 3.75, tolerance: 0.03, unit: kN }
    misconceptions:
      - { match: 3.333, feedback: "ลืมน้ำหนักของบูมเอง ซึ่งกระทำที่กึ่งกลาง" }
      - { match: 2.8125, feedback: "ใช้องค์ประกอบแนวราบของแรงตึง ($4/5$) แต่องค์ประกอบที่ให้โมเมนต์รอบ A คือแนวดิ่ง ($3/5$)" }
    hints:
      - "หาโมเมนต์รอบ A เพื่อตัดแรงที่บานพับ"
      - "ลวดยาว $5\\ \\mathrm{m}$ องค์ประกอบแนวดิ่งของแรงตึงคือ $\\tfrac35 T$ ซึ่งมีแขนโมเมนต์ $4\\ \\mathrm{m}$"
    solution: "$\\sum M_A = 0$: $\\tfrac35 T(4) - 2(4) - 0.5(2) = 0$ ได้ $2.4T = 9$ จึง $T = 3.75\\ \\mathrm{kN}$ แรงที่บานพับ $A_x = \\tfrac45 T = 3\\ \\mathrm{kN}$ และ $A_y = 2.5 - 2.25 = 0.25\\ \\mathrm{kN}$ ตรวจด้วย $\\sum M_B$: $4A_y = 0.5(2)$ ได้ $0.25$ ตรงกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.mechanics.rigid-body-equilibrium.p011
    topics: [engineering.mechanics.rigid-body-equilibrium]
    difficulty: 4
    type: numeric
    stem: "ช่างไฟพาดบันไดยาว $5\\ \\mathrm{m}$ หนัก $200\\ \\mathrm{N}$ กับผนังลื่น โคนบันไดห่างผนัง $3\\ \\mathrm{m}$ (ปลายบนสูง $4\\ \\mathrm{m}$) ช่างหนัก $700\\ \\mathrm{N}$ ยืนที่ระยะ $\\tfrac34$ ของความยาวบันไดจากโคน พื้นต้องให้แรงเสียดทานแนวราบกี่นิวตันบันไดจึงไม่ลื่น (ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 468.75, tolerance: 1, unit: N }
    misconceptions:
      - { match: 75, feedback: "คิดแค่น้ำหนักบันได ต้องรวมโมเมนต์จากน้ำหนักของช่างด้วย" }
      - { match: 600, feedback: "วางช่างไว้ที่ปลายบนสุด ช่างอยู่ที่ $\\tfrac34$ ของความยาว ระยะแนวราบจากโคนจึงเป็น $2.25\\ \\mathrm{m}$" }
    hints:
      - "ผนังลื่นให้แรงตั้งฉากแนวราบเท่านั้น และแรงเสียดทานที่พื้นต้องเท่ากับแรงนี้"
      - "หาโมเมนต์รอบโคนบันได ใช้ระยะแนวราบของน้ำหนักและระยะแนวดิ่ง $4\\ \\mathrm{m}$ ของแรงจากผนัง"
