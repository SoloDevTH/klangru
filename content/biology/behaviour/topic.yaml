id: biology.animals.behaviour
subject: biology
title: { th: พฤติกรรมของสัตว์, en: "Animal behaviour" }
summary: พฤติกรรมที่เป็นมาแต่กำเนิดและที่เกิดจากการเรียนรู้ ความสัมพันธ์กับวิวัฒนาการของระบบประสาท การสื่อสารระหว่างสัตว์ พฤติกรรมพ่อแม่ลูก และประโยชน์กับต้นทุนของการอยู่เป็นกลุ่ม
difficulty: 6
minutes: 40
prerequisites: [biology.animals.nervous-system, biology.evolution.evolution]
encompasses:
  - { id: biology.animals.nervous-system, weight: 0.2 }
  - { id: biology.evolution.evolution, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ประเภทของพฤติกรรมสัตว์
    src: behaviour-types.svg
    alt: "แผนภาพแบ่งพฤติกรรมของสัตว์เป็นสองกลุ่ม ซ้ายคือพฤติกรรมมาแต่กำเนิด ทำได้ทันทีไม่ต้องฝึก มี 4 แบบ ไคนีซิส เช่น ตัวกะปิเคลื่อนที่เร็วในที่แห้ง แทกซิส เช่น ยูกลีนาว่ายเข้าหาแสง รีเฟล็กซ์ เช่น กะพริบตาเมื่อมีฝุ่นเข้า รีเฟล็กซ์ต่อเนื่อง เช่น แมงมุมชักใย ลูกเต่าคลานลงทะเล ขวาคือพฤติกรรมที่เกิดจากการเรียนรู้ เปลี่ยนตามประสบการณ์ มี 5 แบบ แฮบิทูเอชัน เช่น นกไม่กลัวหุ่นไล่กา การฝังใจ เช่น ลูกเป็ดเดินตามสิ่งแรกที่เห็น การมีเงื่อนไข เช่น สุนัขน้ำลายไหลเมื่อได้ยินกระดิ่ง การลองผิดลองถูก เช่น ลิงเรียนเก็บมะพร้าว การใช้เหตุผล เช่น ชิมแปนซีต่อกล่องหยิบกล้วย"
    caption: "พฤติกรรมจริงหลายอย่างอาศัยทั้งยีนและการเรียนรู้ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: จำแนกพฤติกรรมจากการทดลอง
    problem: "นักเรียนใส่ตัวกะปิ 20 ตัวในกล่องที่ครึ่งหนึ่งแห้ง อีกครึ่งชื้น หลัง 10 นาทีพบตัวกะปิ 17 ตัวในด้านชื้น เมื่อสังเกตใกล้ ๆ พบว่าตัวกะปิในด้านแห้งเดินเร็วและเลี้ยวไปมา ส่วนในด้านชื้นเดินช้าและหยุดบ่อย พฤติกรรมนี้เป็นแบบใด"
    steps:
      - text: "ตัวกะปิไม่ได้เดินตรงเข้าหาความชื้น แต่เปลี่ยนอัตราการเคลื่อนที่ตามความชื้น"
        why: "ถ้ามีทิศทางเข้าหาสิ่งเร้า จะเป็นแทกซิส"
      - text: "เมื่อเดินช้าในที่ชื้น จึงอยู่ในด้านชื้นนานกว่า และไปรวมกันในด้านนั้น"
      - text: "พฤติกรรมนี้ทำได้ตั้งแต่เกิด ไม่ต้องเรียนรู้"
    answer: "ไคนีซิส ซึ่งเป็นพฤติกรรมมาแต่กำเนิด ช่วยให้ตัวกะปิอยู่ในที่ชื้นและไม่สูญเสียน้ำ"
  - { type: check, problem: biology.animals.behaviour.p005, prompt: "สิ่งเร้าเดิมเกิดซ้ำทุกวันและไม่มีอันตราย" }
  - type: figure
    title: การเต้นรำแบบส่ายท้องของผึ้ง
    src: waggle-dance.svg
    alt: "ภาพสองฝั่ง ฝั่งซ้ายบนรวงผึ้งแนวตั้ง มีเส้นประทิศขึ้นตรง ผึ้งเต้นช่วงส่ายท้อง (เส้นซิกแซกสีแดง) เอียงไปทางขวาของแนวขึ้นตรง 40 องศา แล้ววนกลับมาเริ่มใหม่สลับซ้ายขวา ฝั่งขวามองทุ่งจากด้านบน มีรังผึ้ง ทิศของดวงอาทิตย์อยู่ตรงขึ้นไปจากรัง และลูกศรสีแดงจากรังไปยังแหล่งอาหารซึ่งอยู่ทางขวาของทิศดวงอาทิตย์ 40 องศา ด้านล่างเขียนว่าความยาวของช่วงส่ายท้องบอกระยะทาง ยิ่งไกลยิ่งส่ายนาน"
    caption: "มุมบนรวงผึ้งเทียบกับแนวขึ้นตรงเท่ากับมุมของแหล่งอาหารเทียบกับทิศดวงอาทิตย์ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ผึ้งบอกทิศอย่างไร
    problem: "ตอนเช้าดวงอาทิตย์อยู่ทางทิศตะวันออก ผึ้งงานเต้นช่วงส่ายท้องเอียงไปทางซ้ายของแนวขึ้นตรง 90° แหล่งอาหารอยู่ทิศใดของรัง"
    steps:
      - text: "แนวขึ้นตรงบนรวงผึ้งแทนทิศของดวงอาทิตย์ คือทิศตะวันออก"
      - text: "เอียงไปทางซ้าย 90° คือหมุนทวนเข็มนาฬิกาจากทิศดวงอาทิตย์ 90° เมื่อมองแผนที่จากด้านบน"
        why: "การเต้นทางขวาของแนวขึ้นตรงตรงกับการหมุนตามเข็มนาฬิกาจากทิศดวงอาทิตย์ ทางซ้ายจึงเป็นทวนเข็มนาฬิกา"
      - text: "หมุนจากทิศตะวันออกทวนเข็มนาฬิกา 90° ได้ทิศเหนือ"
    answer: "แหล่งอาหารอยู่ทางทิศเหนือของรัง"
  - { type: check, problem: biology.animals.behaviour.p010, prompt: "แนวขึ้นตรงบนรวงผึ้งแทนทิศของดวงอาทิตย์" }
glossary:
  - { term: พฤติกรรม, definition: "การกระทำที่สิ่งมีชีวิตตอบสนองต่อสิ่งเร้า" }
  - { term: ไคนีซิส, definition: "การเปลี่ยนอัตราการเคลื่อนที่ตามสิ่งเร้าโดยไม่มีทิศทางแน่นอน" }
  - { term: แทกซิส, definition: "การเคลื่อนที่เข้าหาหรือหนีสิ่งเร้าอย่างมีทิศทาง" }
  - { term: แฮบิทูเอชัน, definition: "การหยุดตอบสนองต่อสิ่งเร้าที่เกิดซ้ำและไม่มีผลต่อสัตว์" }
  - { term: การฝังใจ, definition: "การเรียนรู้ในช่วงเวลาสั้น ๆ หลังเกิด เช่น ลูกเป็ดเดินตามสิ่งแรกที่เห็น" }
  - { term: การมีเงื่อนไข, definition: "การเรียนรู้ที่สัตว์เชื่อมโยงสิ่งเร้าใหม่กับสิ่งเร้าเดิม จนตอบสนองต่อสิ่งเร้าใหม่ได้" }
  - { term: ฟีโรโมน, definition: "สารเคมีที่สัตว์ปล่อยออกมาสื่อสารกับสัตว์ชนิดเดียวกัน" }
flashcards:
  - { front: "พฤติกรรมมาแต่กำเนิด 4 แบบ", back: "ไคนีซิส แทกซิส รีเฟล็กซ์ รีเฟล็กซ์ต่อเนื่อง" }
  - { front: "พฤติกรรมจากการเรียนรู้ 5 แบบ", back: "แฮบิทูเอชัน การฝังใจ การมีเงื่อนไข การลองผิดลองถูก การใช้เหตุผล" }
  - { front: "ระบบประสาทซับซ้อนขึ้น พฤติกรรมเปลี่ยนอย่างไร", back: "เรียนรู้และปรับพฤติกรรมได้มากขึ้น" }
  - { front: "การเต้นรำของผึ้งบอกอะไร", back: "มุมบอกทิศเทียบกับดวงอาทิตย์ ระยะเวลาส่ายท้องบอกระยะทาง" }
  - { front: "ประโยชน์ของการอยู่เป็นกลุ่ม", back: "ระวังศัตรูได้ดีขึ้น ล่าเหยื่อใหญ่ได้ ช่วยเลี้ยงลูก (ต้นทุน: แบ่งอาหาร แย่งคู่ โรคแพร่ง่าย)" }
