<text x="560.0" y="84.2" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">3 กวนเร็ว</text>
<text x="560.0" y="103.2" font-size="15" fill="#222" text-anchor="middle">เติมสารส้ม</text>
<text x="560.0" y="122.2" font-size="15" fill="#222" text-anchor="middle">(และปูนขาว)</text>
<line x1="649.0" y1="98.0" x2="691.0" y2="98.0" stroke="#1d3557" stroke-width="2.5" marker-end="url(#arr1d3557)"/>
<rect x="695.0" y="50.0" width="170.0" height="96.0" rx="8" fill="#eef4fb" stroke="#1d3557" stroke-width="1.6"/>
