<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="sans-serif">
<title>ฉลากยาสามัญประจำบ้าน (ตัวอย่างสมมติ)</title>
<rect x="0" y="0" width="640" height="500" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect x="20.0" y="20.0" width="600.0" height="440.0" rx="10" fill="#fbfdf7" stroke="#2e6b2e" stroke-width="3"/>
<rect x="20.0" y="20.0" width="600.0" height="44.0" rx="10" fill="#2e6b2e" stroke="#2e6b2e" stroke-width="3"/>
<rect x="20.0" y="50.0" width="600.0" height="14.0" rx="0" fill="#2e6b2e" stroke="none" stroke-width="0"/>
<text x="320.0" y="50.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#ffffff">ยาสามัญประจำบ้าน</text>
<text x="320.0" y="96.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#111">ยาเม็ดแก้แพ้ ลดน้ำมูก คลอร์เฟนิรามีน</text>
<text x="320.0" y="120.0" font-size="14" text-anchor="middle" fill="#111">ตัวยาสำคัญ: คลอร์เฟนิรามีน มาลีเอต 2 มิลลิกรัม ต่อ 1 เม็ด</text>
<text x="40.0" y="166.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">สรรพคุณ</text>
<text x="190.0" y="166.0" font-size="15" text-anchor="start" fill="#111">บรรเทาอาการแพ้ เช่น ลมพิษ น้ำมูกไหล</text>
<line x1="36.0" y1="186.0" x2="604.0" y2="186.0" stroke="#c8d8c0" stroke-width="1"/>
<text x="40.0" y="204.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">ขนาดและวิธีใช้</text>
<text x="190.0" y="204.0" font-size="15" text-anchor="start" fill="#111">อ่านในเอกสารกำกับยา หรือถามเภสัชกร</text>
<line x1="36.0" y1="224.0" x2="604.0" y2="224.0" stroke="#c8d8c0" stroke-width="1"/>
<text x="40.0" y="242.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">คำเตือน</text>
<text x="190.0" y="242.0" font-size="15" text-anchor="start" fill="#111">1) ไม่ควรใช้ติดต่อกันนานเกิน 7 วัน</text>
<text x="190.0" y="264.0" font-size="15" text-anchor="start" fill="#111">2) ยานี้อาจทำให้ง่วงซึม ไม่ควรขับขี่ยานพาหนะ</text>
<line x1="36.0" y1="284.0" x2="604.0" y2="284.0" stroke="#c8d8c0" stroke-width="1"/>
<text x="40.0" y="302.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">การเก็บรักษา</text>
<text x="190.0" y="302.0" font-size="15" text-anchor="start" fill="#111">เก็บในที่แห้ง ไม่โดนแสงแดด ไม่เกิน 30 องศาเซลเซียส</text>
<text x="190.0" y="324.0" font-size="15" text-anchor="start" fill="#111">เก็บให้พ้นมือเด็ก</text>
<line x1="36.0" y1="344.0" x2="604.0" y2="344.0" stroke="#c8d8c0" stroke-width="1"/>
<rect x="36.0" y="354.0" width="568.0" height="92.0" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
<text x="52.0" y="380.0" font-size="15" text-anchor="start" fill="#111">Reg. No. 1A 0000/69 (เลขสมมติ)</text>
<text x="52.0" y="406.0" font-size="15" text-anchor="start" fill="#111">Lot No. 2690315</text>
<text x="52.0" y="432.0" font-size="15" text-anchor="start" fill="#111">MFG. 03/2569</text>
<text x="330.0" y="432.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">EXP. 08/2571</text>
<text x="320.0" y="484.0" font-size="12" text-anchor="middle" fill="#555">ฉลากตัวอย่างสำหรับฝึกอ่าน ไม่ใช่ผลิตภัณฑ์จริง</text>
</svg>
