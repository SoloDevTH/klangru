# หัวข้อภาษาไทยในคลังที่สอนเนื้อหาของตัวชี้วัด ท 4.1 (หลักการใช้ภาษาไทย)
# ความครอบคลุมตัดสินจาก lesson.md และ problems.yaml ของหัวข้อ เทียบกับสาระการเรียนรู้แกนกลางของแต่ละตัวชี้วัด
# (เอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง กลุ่มสาระการเรียนรู้ภาษาไทย สพฐ. 2551)
framework: th-core-2551-thai
mappings:
  - topic: thai.writing.consonants
    indicators: ["ท 4.1 ป.1/1", "ท 4.1 ป.2/1", "ท 4.1 ป.1/2", "ท 4.1 ป.2/2", "ท 4.1 ป.3/1", "ท 4.1 ป.4/1"]
    coverage: partial
    note: "สอนพยัญชนะ 44 ตัว อักษรสามหมู่ พยัญชนะต้นกับตัวสะกด และมาตราตัวสะกด 8 มาตรา ยังไม่มีสระ รูปวรรณยุกต์ เลขไทย การฝึกเขียนตัวอักษร การแจกลูกสะกดคำ คำที่ตัวสะกดไม่ตรงมาตราแบบเต็ม คำควบกล้ำ ตัวการันต์ และการบอกความหมายของคำ"
  - topic: thai.writing.tone-rules
    indicators: ["ท 4.1 ป.1/1", "ท 4.1 ป.2/1", "ท 4.1 ป.1/2", "ท 4.1 ป.2/2", "ท 4.1 ป.3/1", "ท 4.1 ป.4/1"]
    coverage: partial
    note: "สอนรูปกับเสียงวรรณยุกต์ คำเป็นคำตาย การผันอักษรกลาง สูง ต่ำ และคำที่มีอักษรนำ ซึ่งเป็นส่วนหนึ่งของสาระการเรียนรู้แกนกลางของตัวชี้วัดเหล่านี้ ยังไม่มีการเขียนสะกดคำและการบอกความหมายของคำ คำพ้อง และคำในบริบท (ป.4/1)"
  - topic: thai.grammar.word-types
    indicators: ["ท 4.1 ป.3/2", "ท 4.1 ป.4/2", "ท 4.1 ป.5/1", "ท 4.1 ป.6/1", ท 4.1 ป.5/2]
    coverage: full
    note: "สอนคำ 7 ชนิดและหน้าที่ประธาน กริยา กรรม ครบตามสาระการเรียนรู้แกนกลาง ป.3 (นาม สรรพนาม กริยา) ป.4 (+วิเศษณ์) ป.5 (บุพบท สันธาน อุทาน) และ ป.6 (ทั้ง 7 ชนิด) ไม่ได้จับคู่ ม.1/3 เพราะต้องวิเคราะห์ลึกกว่านี้ และ ป.5/2 (ส่วนประกอบของประโยค) สอนเพียงบางส่วน"
