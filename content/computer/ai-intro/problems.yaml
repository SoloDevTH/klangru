problems:
  - id: computer.ai.intro.p001
    topics: [computer.ai.intro]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นตัวอย่างของ AI ใน **ระบบทางกายภาพ** (มีเซนเซอร์และอุปกรณ์ที่เคลื่อนไหวในโลกจริง)"
    choices:
      - { id: a, text: "เครื่องคัดแยกมะม่วงที่ใช้กล้องดูผิวแล้วดันผลไปสายพานตามความสุก", correct: true }
      - { id: b, text: "เครื่องคิดเลขที่บวกเลขสองจำนวน", feedback: "เครื่องคิดเลขทำตามสูตรตายตัว ไม่ได้รับรู้หรือตัดสินใจจากสิ่งแวดล้อม" }
      - { id: c, text: "ตัวกรองอีเมลขยะในกล่องจดหมาย", feedback: "ตัวกรองอีเมลขยะเป็น AI ในซอฟต์แวร์ ไม่มีส่วนที่เคลื่อนไหวในโลกจริง" }
      - { id: d, text: "สวิตช์ไฟที่กดเปิดปิดเอง", feedback: "สวิตช์ทำงานตามที่คนกด ไม่มีการรับรู้หรือตัดสินใจ" }
    hints:
      - "ระบบทางกายภาพทำงานเป็นวงจรรับรู้ คิด และลงมือ"
      - "หาตัวเลือกที่มีทั้งเซนเซอร์และอุปกรณ์ที่ลงมือทำ"
    solution: "เครื่องคัดแยกมะม่วงรับรู้ด้วยกล้อง ตัดสินใจว่าสุกหรือไม่ แล้วลงมือดันผลไม้ จึงเป็น AI ในระบบทางกายภาพ ส่วนตัวกรองอีเมลขยะเป็น AI ในซอฟต์แวร์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.intro.p002
    topics: [computer.ai.intro]
    difficulty: 1
    type: match
    stem: "จับคู่คำกับตัวอย่างในงานจำแนกความสุกของมะม่วง"
    pairs:
      - { left: "คุณลักษณะ (feature)", right: "ความเหลืองของผิวและความนิ่มเมื่อกด" }
      - { left: "ป้ายกำกับ (label)", right: "คำตอบว่าผลนั้น สุก หรือ ดิบ" }
      - { left: "ข้อมูลฝึก", right: "มะม่วงที่ติดป้ายแล้ว ใช้สร้างแบบจำลอง" }
      - { left: "ข้อมูลทดสอบ", right: "มะม่วงที่ติดป้ายแล้วแต่เก็บแยกไว้ ใช้วัดความแม่นยำ" }
    hints:
      - "คุณลักษณะคือสิ่งที่วัดได้ ป้ายกำกับคือคำตอบ"
      - "ข้อมูลที่แบบจำลองไม่เห็นระหว่างฝึกใช้ทำอะไร"
    solution: "คุณลักษณะคือค่าที่วัด ป้ายกำกับคือคำตอบที่ถูก ข้อมูลฝึกใช้สร้างแบบจำลอง และข้อมูลทดสอบใช้วัดผลกับข้อมูลที่แบบจำลองไม่เคยเห็น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.intro.p003
    topics: [computer.ai.intro]
    difficulty: 2
    type: numeric
    stem: "แบบจำลองจำแนกภาพใบข้าวว่าเป็นโรคใบไหม้หรือไม่ ทดสอบกับภาพในข้อมูลทดสอบ 50 ภาพ ทำนายถูก 42 ภาพ ความแม่นยำเป็นร้อยละเท่าไร"
    answer: { value: 84, unit: "%" }
    hints:
      - "ความแม่นยำ = จำนวนที่ถูก ÷ จำนวนทั้งหมด × 100"
      - "หาร 42 ด้วย 50"
    misconceptions:
      - { match: 16, feedback: "16% คือร้อยละที่ทำนายผิด (8 ภาพ) ไม่ใช่ความแม่นยำ" }
      - { match: 0.84, feedback: "0.84 เป็นสัดส่วน ต้องคูณ 100 ให้เป็นร้อยละ" }
    solution: "42 ÷ 50 × 100 = 84%"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.intro.p004
    topics: [computer.ai.intro]
    difficulty: 2
    type: mcq
    stem: "นักเรียนฝึกแบบจำลองด้วยภาพ 1,000 ภาพ แล้ววัดความแม่นยำด้วยภาพ 1,000 ภาพชุดเดิมได้ 100% ทำไมตัวเลขนี้จึงเชื่อไม่ได้"
    choices:
      - { id: a, text: "แบบจำลองเคยเห็นภาพเหล่านี้ระหว่างฝึกแล้ว อาจแค่จำได้ ต้องวัดด้วยข้อมูลทดสอบที่แยกไว้", correct: true }
      - { id: b, text: "เพราะ 1,000 ภาพน้อยเกินไปจะคำนวณร้อยละไม่ได้", feedback: "คำนวณได้ ปัญหาคือใช้ข้อมูลชุดเดียวกับที่ฝึก" }
      - { id: c, text: "เพราะความแม่นยำต้องไม่เกิน 50%", feedback: "ความแม่นยำสูงได้ แต่ต้องวัดกับข้อมูลที่ไม่เคยเห็น" }
      - { id: d, text: "ไม่มีปัญหา ตัวเลขนี้เชื่อได้", feedback: "วัดด้วยข้อมูลฝึกให้ผลดีเกินจริง เหมือนออกข้อสอบซ้ำกับแบบฝึกหัดที่เฉลยไปแล้ว" }
    hints:
      - "ถ้าครูออกข้อสอบเหมือนแบบฝึกหัดที่เฉลยแล้ว คะแนนบอกอะไรได้"
      - "นึกถึงการเรียนรู้เกิน (overfitting)"
    solution: "การวัดด้วยข้อมูลที่ใช้ฝึกบอกแค่ว่าแบบจำลองจำข้อมูลนั้นได้ ต้องแยกข้อมูลทดสอบที่ไม่ใช้ฝึกไว้ จึงรู้ว่าทำนายข้อมูลใหม่ได้ดีแค่ไหน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.intro.p005
    topics: [computer.ai.intro]
    difficulty: 2
    type: numeric
    stem: "มะม่วงสองผลมีคุณลักษณะ (ความเหลือง, ความนิ่ม) เป็น (2, 2) และ (5, 6) ระยะทางแบบยุคลิดระหว่างสองผลเท่ากับเท่าไร"
    answer: { value: 5, unit: "" }
    hints:
      - "ระยะ = √((x₁ − x₂)² + (y₁ − y₂)²)"
      - "ผลต่างคือ 3 และ 4"
    misconceptions:
      - { match: 7, feedback: "7 คือ 3 + 4 ซึ่งเป็นระยะเดินตามแนวตาราง ไม่ใช่ระยะทางแบบยุคลิด" }
      - { match: 25, feedback: "25 คือผลรวมกำลังสอง ยังไม่ได้ถอดรากที่สอง" }
    solution: "√((5 − 2)² + (6 − 2)²) = √(9 + 16) = √25 = 5"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.intro.p006
    topics: [computer.ai.intro]
    difficulty: 3
    type: text
    stem: "ใช้ k เพื่อนบ้านใกล้ที่สุด โดย k = 3 กับข้อมูลฝึกในภาพ ผลใหม่ที่ (5, 5) จะถูกทำนายว่า สุก หรือ ดิบ"
    figure:
      src: knn-question.svg
      alt: "แผนภาพการกระจาย แกนนอนความเหลืองของผิว 0 ถึง 10 แกนตั้งความนิ่ม 0 ถึง 10 มะม่วงสุก (วงกลมสีส้ม) ที่ (8, 7), (7, 9), (9, 6), (6, 8) มะม่วงดิบ (สี่เหลี่ยมสีเขียว) ที่ (2, 2), (3, 4), (1, 3), (4, 1) ผลใหม่ (ดาวสีน้ำเงินมีเครื่องหมายคำถาม) ที่ (5, 5)"
    accepted: ["สุก", "ripe"]
    misconceptions:
      - { match: "ดิบ", feedback: "ผลที่ใกล้ที่สุดตัวเดียวคือ (3, 4) ซึ่งดิบ แต่ k = 3 ต้องดูสามผลที่ใกล้ที่สุดแล้วโหวต" }
    hints:
      - "คำนวณระยะจาก (5, 5) ไปทุกผล เช่น ไป (3, 4) ได้ √5 ≈ 2.24"
      - "เลือกสามผลที่ระยะน้อยที่สุด แล้วดูว่าป้ายใดมากกว่า"
    solution: "ระยะที่ใกล้ที่สุดสามอันดับ: (3, 4) ดิบ ≈ 2.24, (6, 8) สุก ≈ 3.16, (8, 7) สุก ≈ 3.61 โหวต สุก 2 ดิบ 1 จึงทำนายว่าสุก (ถ้าใช้ k = 1 จะได้ดิบ ค่า k จึงมีผลต่อคำตอบ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.intro.p007
    topics: [computer.ai.intro]
    difficulty: 3
    type: numeric
    stem: "ใช้มินิแมกซ์กับต้นไม้เกมในภาพ (ราก = ตาคอมพิวเตอร์ เลือกค่ามากที่สุด ชั้นกลาง = ตาคู่แข่ง เลือกค่าน้อยที่สุด) ค่าที่รากเป็นเท่าไร"
    figure:
      src: minimax-question.svg
      alt: "ต้นไม้เกมสองชั้น รากชั้น MAX มีสามกิ่ง กิ่งแรกไปโหนด MIN ที่มีคะแนนท้ายเกม 4, 8, 6 กิ่งที่สองไปโหนด MIN ที่มีคะแนน 7, 9 กิ่งที่สามไปโหนด MIN ที่มีคะแนน 1, 10 ค่าของโหนด MIN และรากเป็นเครื่องหมายคำถาม"
    answer: { value: 7, unit: "" }
    hints:
      - "หาค่าของโหนด MIN แต่ละโหนดก่อน ด้วยค่าน้อยที่สุดของใบ"
      - "รากเลือกค่ามากที่สุดของโหนด MIN ทั้งสาม"
    misconceptions:
      - { match: 10, feedback: "10 คือใบที่มากที่สุด แต่คู่แข่งจะไม่ยอมให้ไปถึง เพราะเลือกค่าน้อยที่สุดในกิ่งนั้น (1)" }
      - { match: 1, feedback: "ชั้นรากเป็นตาคอมพิวเตอร์ เลือกค่ามากที่สุด ไม่ใช่น้อยที่สุด" }
    solution: "โหนด MIN: min(4, 8, 6) = 4, min(7, 9) = 7, min(1, 10) = 1 ราก MAX: max(4, 7, 1) = 7 คอมพิวเตอร์เลือกกิ่งที่สอง ซึ่งรับประกันได้อย่างน้อย 7"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.intro.p008
    topics: [computer.ai.intro]
    difficulty: 3
    type: order
    stem: "สหกรณ์การเกษตรอยากสร้างแบบจำลองแยกทุเรียนสุกพร้อมตัดจากเสียงเคาะ เรียงขั้นตอนการพัฒนาแบบจำลอง"
    items:
      - "เก็บเสียงเคาะทุเรียนจำนวนมากจากหลายสวนและหลายพันธุ์"
      - "ให้ผู้เชี่ยวชาญติดป้ายกำกับว่าแต่ละลูกสุกพร้อมตัดหรือไม่"
      - "แบ่งข้อมูลเป็นข้อมูลฝึกและข้อมูลทดสอบ"
      - "ฝึกแบบจำลองด้วยข้อมูลฝึก"
      - "วัดความแม่นยำด้วยข้อมูลทดสอบ รวมทั้งแยกตามพันธุ์"
      - "นำไปใช้จริงและติดตามผลอย่างต่อเนื่อง"
    hints:
      - "ต้องมีข้อมูลและป้ายกำกับก่อนฝึก"
      - "ต้องแบ่งข้อมูลก่อนฝึก เพื่อไม่ให้ข้อมูลทดสอบหลุดเข้าไปในการฝึก"
    solution: "เก็บข้อมูล → ติดป้ายกำกับ → แบ่งข้อมูลฝึกและทดสอบ → ฝึก → วัดผลด้วยข้อมูลทดสอบ (แยกกลุ่มด้วย) → นำไปใช้และติดตาม การเก็บจากหลายสวนและหลายพันธุ์ช่วยลดความลำเอียงของข้อมูล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.intro.p009
    topics: [computer.ai.intro]
    difficulty: 3
    type: mcq
    stem: "นักเรียนใช้ AI แบบรู้สร้างช่วยเขียนรายงานเรื่องแม่น้ำเจ้าพระยา ได้ข้อความพร้อมแหล่งอ้างอิง 3 รายการ ควรทำอย่างไรต่อ"
    choices:
      - { id: a, text: "เปิดตรวจแหล่งอ้างอิงทุกรายการว่ามีอยู่จริงและเขียนแบบนั้นจริง แล้วอ้างแหล่งที่ตรวจแล้ว และบอกครูว่าใช้ AI ช่วยตามกติกาของโรงเรียน", correct: true }
      - { id: b, text: "คัดลอกทั้งหมดส่งได้เลย เพราะ AI อ้างแหล่งมาให้แล้ว", feedback: "AI แบบรู้สร้างอาจสร้างแหล่งอ้างอิงที่ไม่มีอยู่จริงได้ ต้องตรวจก่อนเสมอ" }
      - { id: c, text: "ลบแหล่งอ้างอิงออก แล้วเขียนว่าข้อมูลมาจาก AI", feedback: "AI ไม่ใช่แหล่งต้นทางของข้อเท็จจริง ต้องหาและอ้างแหล่งที่ตรวจได้" }
      - { id: d, text: "ถาม AI ซ้ำว่าแหล่งอ้างอิงจริงไหม ถ้าตอบว่าจริงก็ใช้ได้", feedback: "AI อาจยืนยันข้อมูลผิดของตัวเองได้ ต้องตรวจจากแหล่งต้นทางโดยตรง" }
    hints:
      - "AI แบบรู้สร้างสร้างข้อความที่ฟังดูน่าจะเป็น ไม่ได้รับประกันว่าจริง"
      - "แหล่งอ้างอิงต้องตรวจจากต้นทาง"
    solution: "AI แบบรู้สร้างอาจสร้างข้อมูลหรือแหล่งอ้างอิงที่ไม่มีจริง (hallucination) ผู้เขียนต้องตรวจทุกแหล่งจากต้นทาง อ้างเฉพาะแหล่งที่มีจริง และเปิดเผยการใช้ AI ตามกติกา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.intro.p010
    topics: [computer.ai.intro]
    difficulty: 4
    type: numeric
    stem: "ระบบปลดล็อกด้วยใบหน้าทดสอบกับภาพผู้ใช้ 360 ภาพ กลุ่มผิวสีอ่อน 300 ภาพ ถูก 291 ภาพ กลุ่มผิวสีเข้ม 60 ภาพ ถูก 45 ภาพ ความแม่นยำของกลุ่มผิวสีเข้มเป็นร้อยละเท่าไร"
    answer: { value: 75, unit: "%" }
    hints:
      - "คิดเฉพาะภาพของกลุ่มผิวสีเข้ม"
      - "45 ÷ 60 × 100"
    misconceptions:
      - { match: 93.33, feedback: "93.33% คือความแม่นยำรวม (336 ÷ 360) ซึ่งถูกกลุ่มใหญ่ดึงขึ้น" }
      - { match: 97, feedback: "97% คือความแม่นยำของกลุ่มผิวสีอ่อน" }
    solution: "45 ÷ 60 × 100 = 75% เทียบกับกลุ่มผิวสีอ่อน 291 ÷ 300 = 97% และรวม 336 ÷ 360 ≈ 93.3% ระบบทำงานกับกลุ่มผิวสีเข้มแย่กว่ามาก แม้ตัวเลขรวมดูดี จึงต้องวัดแยกกลุ่มเสมอ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.intro.p011
    topics: [computer.ai.intro]
    difficulty: 4
    type: mcq
    stem: "มูลนิธิหนึ่งฝึกแบบจำลองคัดใบสมัครทุนการศึกษาด้วยผลการคัดเลือก 10 ปีที่ผ่านมา ซึ่งในอดีตกรรมการรับนักเรียนจากโรงเรียนในเมืองเป็นส่วนใหญ่ ปัญหาที่น่ากังวลที่สุดคืออะไร"
    choices:
      - { id: a, text: "แบบจำลองอาจเรียนรู้ว่านักเรียนโรงเรียนในเมืองควรได้ทุน และให้คะแนนนักเรียนต่างจังหวัดต่ำ ทำซ้ำความลำเอียงในอดีต", correct: true }
      - { id: b, text: "แบบจำลองจะทำงานช้าเพราะข้อมูล 10 ปีมากเกินไป", feedback: "ปริมาณข้อมูลไม่ใช่ปัญหาหลัก ปัญหาคือข้อมูลสะท้อนการตัดสินใจที่ลำเอียง" }
      - { id: c, text: "ไม่มีปัญหา เพราะคอมพิวเตอร์เป็นกลางเสมอ", feedback: "แบบจำลองเรียนรู้จากข้อมูล ถ้าข้อมูลลำเอียง ผลก็ลำเอียงตาม" }
      - { id: d, text: "แบบจำลองจะสุ่มให้ทุนโดยไม่ดูข้อมูลเลย", feedback: "แบบจำลองไม่ได้สุ่ม มันเลียนแบบรูปแบบในข้อมูลฝึก รวมทั้งรูปแบบที่ไม่เป็นธรรม" }
    hints:
      - "แบบจำลองเรียนรู้รูปแบบอะไรจากข้อมูลในอดีต"
      - "ถ้าข้อมูลสะท้อนการตัดสินใจที่ไม่เป็นธรรม ผลจะเป็นอย่างไร"
    solution: "ข้อมูลฝึกสะท้อนการคัดเลือกที่ลำเอียงในอดีต แบบจำลองจึงอาจเรียนรู้และทำซ้ำความลำเอียงนั้น ควรตรวจผลแยกตามกลุ่ม ให้คนตรวจการตัดสินใจ และเปิดให้ผู้สมัครโต้แย้งได้"
