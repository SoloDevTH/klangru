      - { id: c, text: "ไม่มีแรงใด นักว่ายน้ำพุ่งออกไปเพราะความเฉื่อย", feedback: "ความเฉื่อยทำให้คงสภาพเดิม แต่นักว่ายน้ำเริ่มจากเกือบหยุดนิ่งแล้วเร็วขึ้น ต้องมีแรงจากภายนอกกระทำ" }
    hints:
