  type: numeric
  stem: โรงเรียนแห่งหนึ่งสำรวจนักเรียนแบบไม่ระบุชื่อ 120 คน พบว่า 18 คนถูกกลั่นแกล้งทางออนไลน์ในเดือนที่ผ่านมา คิดเป็นร้อยละเท่าใด
  answer:
    value: 15.0
    tolerance: 0.2
    unit: '%'
  misconceptions:
  - match: 6.7
    feedback: หารกลับด้าน ต้องเอาจำนวนที่ถูกแกล้งตั้ง
  - match: 85
    feedback: นี่คือร้อยละของคนที่ไม่ถูกแกล้ง
  hints:
  - ร้อยละ = จำนวนที่ถูกแกล้ง ÷ ทั้งหมด × 100
  - 18 ÷ 120 แล้วคูณ 100
  solution: $\frac{18}{120} \times 100 = 15\%$ โรงเรียนควรนำผลนี้ไปวางนโยบายและช่องทางแจ้งเหตุที่ปลอดภัย
