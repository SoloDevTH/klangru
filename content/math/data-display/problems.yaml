problems:
  - id: math.data.p001
    topics: [math.stats.data-display]
    difficulty: 1
    type: mcq
    stem: "ข้อมูลใดต่อไปนี้เป็นข้อมูลเชิงคุณภาพ"
    choices:
      - { id: a, text: "สีที่นักเรียนแต่ละคนชอบ", correct: true }
      - { id: b, text: "ส่วนสูงของนักเรียนแต่ละคน", feedback: "ส่วนสูงได้จากการวัดเป็นตัวเลข จึงเป็นข้อมูลเชิงปริมาณแบบต่อเนื่อง" }
      - { id: c, text: "จำนวนพี่น้องของนักเรียนแต่ละคน", feedback: "จำนวนพี่น้องได้จากการนับ จึงเป็นข้อมูลเชิงปริมาณแบบไม่ต่อเนื่อง" }
      - { id: d, text: "คะแนนสอบวิชาคณิตศาสตร์", feedback: "คะแนนเป็นตัวเลขที่นำมาบวกหรือหาค่าเฉลี่ยได้ จึงเป็นข้อมูลเชิงปริมาณ" }
    hints:
      - "ข้อมูลเชิงคุณภาพบอกเป็นกลุ่มหรือประเภท ไม่ใช่ตัวเลขที่ได้จากการนับหรือวัด"
      - "ถามตัวเองว่า หาค่าเฉลี่ยของข้อมูลนี้ได้ไหม ถ้าไม่ได้ มักเป็นข้อมูลเชิงคุณภาพ"
    solution: "สีที่ชอบบอกเป็นประเภท (แดง ฟ้า เขียว ...) จึงเป็นข้อมูลเชิงคุณภาพ ส่วนข้ออื่นเป็นตัวเลขจากการวัดหรือการนับ จึงเป็นข้อมูลเชิงปริมาณ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.data.p002
    topics: [math.stats.data-display]
    difficulty: 1
    type: numeric
    stem: "ถามนักเรียน 15 คนว่าชอบผลไม้อะไรที่สุด ได้คำตอบดังนี้: มะม่วง ทุเรียน มะม่วง มังคุด ลำไย มะม่วง ทุเรียน มังคุด มะม่วง ลำไย มะม่วง ทุเรียน มะม่วง มังคุด ทุเรียน ทำตารางความถี่ แล้วตอบว่ามะม่วงได้รับเลือกมากกว่าลำไยกี่คน"
    answer: { value: 4, unit: คน }
    hints:
      - "นับความถี่ของผลไม้แต่ละชนิดด้วยรอยขีด แล้วตรวจว่ารวมกันได้ 15"
      - "นำความถี่ของมะม่วงลบด้วยความถี่ของลำไย"
    misconceptions:
      - { match: 8, feedback: "นำสองความถี่มาบวกกัน โจทย์ถามว่ามากกว่ากันกี่คน จึงต้องลบ" }
      - { match: 6, feedback: "นั่นคือความถี่ของมะม่วงเพียงอย่างเดียว ยังต้องลบความถี่ของลำไยออก" }
    solution: "ความถี่: มะม่วง 6, ทุเรียน 4, มังคุด 3, ลำไย 2 (รวม 15 ✓) มะม่วงมากกว่าลำไย $6 - 2 = 4$ คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.data.p003
    topics: [math.stats.data-display]
    difficulty: 2
    type: numeric
    stem: "แผนภูมิวงกลมแสดงกีฬาที่นักเรียน 40 คนชอบที่สุด ส่วนของ \"ฟุตบอล\" มีมุม $90^\\circ$ มีนักเรียนกี่คนที่ชอบฟุตบอลที่สุด"
    answer: { value: 10, unit: คน }
    hints:
      - "วงกลมเต็มวง $360^\\circ$ แทนนักเรียนทั้ง 40 คน"
      - "หาสัดส่วน $\\dfrac{90}{360}$ แล้วคูณด้วยจำนวนนักเรียนทั้งหมด"
    misconceptions:
      - { match: 25, feedback: "นั่นคือร้อยละ ($\\tfrac{90}{360} \\times 100$) โจทย์ถามจำนวนคน ต้องคูณสัดส่วนด้วย 40" }
      - { match: 90, feedback: "นั่นคือขนาดของมุม ไม่ใช่จำนวนคน ต้องแปลงมุมเป็นสัดส่วนของ $360^\\circ$ ก่อน" }
    solution: "$\\dfrac{90}{360} \\times 40 = \\dfrac{1}{4} \\times 40 = 10$ คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.data.p004
    topics: [math.stats.data-display]
    difficulty: 2
    type: numeric
    stem: "สำรวจลูกค้าร้านเครื่องดื่ม 60 คน มี 12 คนสั่งชาไทย ถ้าวาดแผนภูมิวงกลม ส่วนของชาไทยต้องมีมุมกี่องศา"
    answer: { value: 72, unit: องศา }
    hints:
      - "หาสัดส่วนของลูกค้าที่สั่งชาไทยจากทั้งหมดก่อน"
      - "มุม $= \\dfrac{f}{N} \\times 360^\\circ$"
    misconceptions:
      - { match: 20, feedback: "นั่นคือร้อยละ ($\\tfrac{12}{60} \\times 100$) มุมต้องคิดจาก $360^\\circ$ ไม่ใช่ 100" }
      - { match: 43.2, feedback: "คิดเหมือน 12 คนเป็น 12% แต่ลูกค้ามี 60 คน ไม่ใช่ 100 คน ต้องหารด้วย 60" }
    solution: "$\\dfrac{12}{60} \\times 360^\\circ = 0.2 \\times 360^\\circ = 72^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.data.p005
    topics: [math.stats.data-display]
    difficulty: 2
    type: match
    stem: "จับคู่สถานการณ์กับแผนภูมิที่เหมาะสมที่สุด"
    pairs:
      - { left: "เปรียบเทียบจำนวนหนังสือที่แต่ละห้องยืมจากห้องสมุด", right: "แผนภูมิแท่ง" }
      - { left: "แสดงว่ารายจ่ายแต่ละหมวดเป็นสัดส่วนเท่าใดของรายจ่ายทั้งเดือน", right: "แผนภูมิวงกลม" }
      - { left: "แสดงการกระจายของส่วนสูงนักเรียน 200 คนที่จัดเป็นช่วง 10 เซนติเมตร", right: "ฮิสโทแกรม" }
      - { left: "นับคะแนนโหวตทีละเสียงก่อนสรุปผล", right: "ตารางความถี่แบบรอยขีด" }
    hints:
      - "สัดส่วนของทั้งหมดเหมาะกับแผนภูมิที่เป็นรูปเต็มวง"
      - "ข้อมูลต่อเนื่องที่จัดเป็นช่วงใช้แผนภูมิที่แท่งชิดกัน"
      - "การเปรียบเทียบกลุ่มที่แยกจากกันชัดเจนใช้แท่งที่แยกห่างกัน"
    solution: "เปรียบเทียบกลุ่ม → แผนภูมิแท่ง | สัดส่วนของทั้งหมด → แผนภูมิวงกลม | ข้อมูลต่อเนื่องเป็นช่วง → ฮิสโทแกรม | นับทีละรายการ → ตารางความถี่แบบรอยขีด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.data.p006
    topics: [math.stats.data-display]
    difficulty: 3
    type: numeric
    stem: "ตารางความถี่ส่วนสูงของนักเรียน: 140–149 ซม. มี 3 คน, 150–159 ซม. มี 8 คน, 160–169 ซม. มี 12 คน, 170–179 ซม. มี 5 คน มีนักเรียนกี่คนที่สูงตั้งแต่ 160 ซม. ขึ้นไป"
    answer: { value: 17, unit: คน }
    hints:
      - "\"ตั้งแต่ 160 ซม. ขึ้นไป\" ครอบคลุมกี่อันตรภาคชั้น"
      - "รวมความถี่ของทุกชั้นที่มีค่าตั้งแต่ 160 ขึ้นไป"
    misconceptions:
      - { match: 12, feedback: "นับเฉพาะชั้น 160–169 แต่ชั้น 170–179 ก็สูงตั้งแต่ 160 ซม. ขึ้นไปเช่นกัน" }
      - { match: 25, feedback: "รวมชั้น 150–159 เข้ามาด้วย แต่คนในชั้นนั้นสูงไม่ถึง 160 ซม." }
    solution: "ชั้น 160–169 และ 170–179 รวมกัน: $12 + 5 = 17$ คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.data.p007
    topics: [math.stats.data-display]
    difficulty: 3
    type: numeric
    stem: "จากตารางส่วนสูงเดิม (140–149: 3 คน, 150–159: 8 คน, 160–169: 12 คน, 170–179: 5 คน) ความถี่สัมพัทธ์ของชั้น 150–159 ซม. คิดเป็นร้อยละเท่าใด (ตอบเป็นทศนิยม 1 ตำแหน่ง)"
    answer: { value: 28.57, tolerance: 0.3, unit: "%" }
    hints:
      - "หาจำนวนนักเรียนทั้งหมดก่อน"
      - "ร้อยละ $= \\dfrac{f}{N} \\times 100$"
    misconceptions:
      - { match: 8, feedback: "นั่นคือความถี่ ยังต้องหารด้วยจำนวนทั้งหมดแล้วคูณ 100" }
      - { match: 32, feedback: "ดูเหมือนหารด้วย 25 ซึ่งลืมนับชั้น 140–149 นักเรียนทั้งหมดมี $3 + 8 + 12 + 5 = 28$ คน" }
    solution: "$N = 3 + 8 + 12 + 5 = 28$ ร้อยละ $= \\dfrac{8}{28} \\times 100 \\approx 28.6\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.data.p008
    topics: [math.stats.data-display]
    difficulty: 3
    type: mcq
    stem: "แผนภูมิแท่งในโฆษณาเปรียบเทียบยอดขายข้าวเหนียวมะม่วงต่อวันของร้าน A (92 กล่อง) กับร้าน B (96 กล่อง) แกนตั้งเริ่มที่ 90 กล่อง ทำให้แท่งของร้าน B สูงเป็น 3 เท่าของแท่งร้าน A ข้อสรุปใดถูกต้อง"
    choices:
      - { id: a, text: "ร้าน B ขายได้มากกว่าร้าน A 4 กล่อง หรือประมาณ 4%", correct: true }
      - { id: b, text: "ร้าน B ขายได้มากกว่าร้าน A ประมาณ 3 เท่า", feedback: "ความสูงของแท่งวัดจาก 90 ไม่ใช่จาก 0 แท่งจึงแสดงแค่ส่วนเกิน 90 ($6$ กับ $2$) ยอดขายจริง 96 กับ 92 ต่างกันไม่มาก" }
      - { id: c, text: "สรุปอะไรไม่ได้เลยเพราะแผนภูมิผิด", feedback: "ตัวเลขบนแกนยังอ่านค่าจริงได้ แค่ต้องอ่านตัวเลข ไม่ตัดสินจากความสูงของแท่ง" }
      - { id: d, text: "ร้าน A ขายได้ $\\tfrac{1}{3}$ ของร้าน B", feedback: "นี่คืออัตราส่วนของความสูงแท่ง ($2 : 6$) ไม่ใช่ของยอดขาย ($92 : 96$)" }
    hints:
      - "อ่านค่าจริงของแต่ละร้านจากแกน แล้วเปรียบเทียบตัวเลข ไม่ใช่ความสูงแท่ง"
      - "หาผลต่าง แล้วเทียบผลต่างกับยอดขายของร้าน A"
    solution: "ยอดขายต่างกัน $96 - 92 = 4$ กล่อง คิดเป็น $\\tfrac{4}{92} \\times 100 \\approx 4.3\\%$ แท่งดูต่างกัน 3 เท่าเพราะแกนเริ่มที่ 90 ($96 - 90 = 6$ เทียบกับ $92 - 90 = 2$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.data.p009
    topics: [math.stats.data-display]
    difficulty: 4
    type: numeric
    stem: "ครอบครัวหนึ่งมีรายจ่ายเดือนละ 20,000 บาท แผนภูมิวงกลมของรายจ่ายแสดงส่วน \"ค่าอาหาร\" เป็นมุม $126^\\circ$ ครอบครัวนี้จ่ายค่าอาหารเดือนละกี่บาท"
    answer: { value: 7000, unit: บาท }
    hints:
      - "มุม $360^\\circ$ แทนรายจ่ายทั้งหมด 20,000 บาท"
      - "คูณ 20,000 ด้วยสัดส่วน $\\dfrac{126}{360}$"
    misconceptions:
      - { match: 25200, feedback: "คิดเหมือน $126$ เป็นร้อยละ แต่ $126$ คือองศา ต้องหารด้วย $360$ ไม่ใช่ 100 (และค่าอาหารจะเกินรายจ่ายทั้งหมดไม่ได้)" }
    solution: "$\\dfrac{126}{360} \\times 20000 = 0.35 \\times 20000 = 7000$ บาท (ค่าอาหารคิดเป็น 35% ของรายจ่าย)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.data.p010
    topics: [math.stats.data-display]
    difficulty: 4
    type: numeric
    stem: "นักเรียน 50 คนเลือกชมรมได้ 3 ชมรม ในแผนภูมิวงกลม ชมรมดนตรีไทยมีมุม $108^\\circ$ ชมรมหุ่นยนต์มีสมาชิก 12 คน ที่เหลือเป็นชมรมวาดภาพ ส่วนของชมรมวาดภาพต้องมีมุมกี่องศา"
    answer: { value: 165.6, tolerance: 0.5, unit: องศา }
    hints:
      - "แปลงมุม $108^\\circ$ ของชมรมดนตรีไทยเป็นจำนวนคนก่อน"
      - "จำนวนคนชมรมวาดภาพ = 50 − ดนตรีไทย − หุ่นยนต์"
      - "แปลงจำนวนคนชมรมวาดภาพกลับเป็นมุมด้วย $\\dfrac{f}{N} \\times 360^\\circ$"
    misconceptions:
      - { match: 23, feedback: "นั่นคือจำนวนคนในชมรมวาดภาพ ยังต้องแปลงเป็นมุมด้วย $\\tfrac{23}{50} \\times 360^\\circ$" }
      - { match: 46, feedback: "นั่นคือร้อยละของชมรมวาดภาพ มุมต้องคิดจาก $360^\\circ$" }
    solution: "ดนตรีไทย $= \\dfrac{108}{360} \\times 50 = 15$ คน วาดภาพ $= 50 - 15 - 12 = 23$ คน มุม $= \\dfrac{23}{50} \\times 360^\\circ = 165.6^\\circ$ ตรวจ: $108^\\circ + 86.4^\\circ + 165.6^\\circ = 360^\\circ$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.data.p011
    topics: [math.stats.data-display]
    difficulty: 3
    type: numeric
    stem: "แผนภูมิแท่งยอดขายข้าวเหนียวมะม่วงของร้านหนึ่งแสดงว่า เดือนมกราคมขายได้ 240 กล่อง เดือนกุมภาพันธ์ขายได้ 300 กล่อง ยอดขายเพิ่มขึ้นร้อยละเท่าใด"
    answer: { value: 25, unit: "%" }
    hints:
      - "หายอดที่เพิ่มขึ้นก่อน"
      - "ร้อยละที่เพิ่มขึ้นเทียบกับค่าเดิม (เดือนมกราคม) คือ ส่วนที่เพิ่ม ÷ ค่าเดิม × 100"
    misconceptions:
      - { match: 60, feedback: "นั่นคือจำนวนกล่องที่เพิ่มขึ้น ยังต้องเทียบกับยอดเดิมเป็นร้อยละ" }
      - { match: 20, feedback: "หารด้วยยอดของเดือนกุมภาพันธ์ การเพิ่มขึ้นต้องเทียบกับค่าเดิม (240)" }
    solution: "เพิ่มขึ้น $300 - 240 = 60$ กล่อง ร้อยละ $= \\dfrac{60}{240} \\times 100 = 25\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.data.p012
    topics: [math.stats.data-display]
    difficulty: 5
    type: numeric
    stem: "ตารางความถี่สะสมของคะแนนแบบทดสอบ (เต็ม 50) ของนักเรียน 32 คน: คะแนน 0–9 ความถี่สะสม 4, คะแนน 10–19 ความถี่สะสม 11, คะแนน 20–29 ความถี่สะสม 23, คะแนน 30–39 ความถี่สะสม 30, คะแนน 40–50 ความถี่สะสม 32 นักเรียนที่ได้คะแนน 20–29 คิดเป็นร้อยละเท่าใดของทั้งห้อง (ตอบเป็นทศนิยม 1 ตำแหน่ง)"
    answer: { value: 37.5, tolerance: 0.4, unit: "%" }
    hints:
      - "ความถี่สะสมคือจำนวนนักเรียนตั้งแต่ชั้นแรกจนถึงชั้นนั้น ไม่ใช่ความถี่ของชั้นนั้นอย่างเดียว"
      - "ความถี่ของชั้น 20–29 = ความถี่สะสมของชั้นนี้ − ความถี่สะสมของชั้นก่อนหน้า"
      - "แปลงความถี่ที่ได้เป็นร้อยละของนักเรียนทั้งหมด"
    misconceptions:
      - { match: 71.875, feedback: "ใช้ความถี่สะสม 23 ซึ่งรวมนักเรียนที่ได้ 0–19 ไว้ด้วย ต้องลบความถี่สะสมของชั้นก่อนหน้า (11) ออกก่อน" }
      - { match: 12, feedback: "นั่นคือจำนวนนักเรียนในชั้นนี้ ยังต้องแปลงเป็นร้อยละของ 32 คน" }
    solution: "ความถี่ของชั้น 20–29 $= 23 - 11 = 12$ คน ร้อยละ $= \\dfrac{12}{32} \\times 100 = 37.5\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.data.p013
    topics: [math.stats.data-display]
    difficulty: 1
    type: numeric
    stem: "จากแผนภูมิรูปภาพ มีนักเรียนกี่คนที่มาโรงเรียนด้วยรถจักรยานยนต์"
