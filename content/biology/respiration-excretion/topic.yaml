id: biology.humans.respiration-excretion
subject: biology
title: { th: ระบบหายใจและระบบขับถ่าย, en: "The respiratory and excretory systems" }
summary: อวัยวะในระบบหายใจ กลไกการหายใจเข้าออกด้วยกะบังลมและกระดูกซี่โครง การแลกเปลี่ยนแก๊สที่ถุงลม ไตกับการกำจัดของเสีย และการดูแลระบบหายใจและระบบขับถ่าย
difficulty: 3
minutes: 40
prerequisites: [biology.cells.cell-basics]
encompasses:
  - { id: biology.cells.cell-basics, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: อวัยวะในระบบหายใจ
    src: respiratory-system.svg
    alt: "แผนภาพด้านหน้า จากบนลงล่าง จมูกและโพรงจมูกในศีรษะ คอหอย กล่องเสียง หลอดลมคอที่มีวงกระดูกอ่อนเป็นปล้อง แยกเป็นหลอดลมซ้ายขวาเข้าปอดสีชมพูสองข้าง แต่ละข้างแตกแขนงเป็นหลอดลมฝอยจำนวนมาก กระดูกซี่โครงสีเทาล้อมปอด กะบังลมเป็นเส้นโค้งสีม่วงใต้ปอด ด้านขวาเป็นวงกลมขยายถุงลม เป็นกลุ่มถุงกลมเล็ก ๆ ที่ปลายหลอดลมฝอย มีหลอดเลือดฝอยสีแดงพันรอบ"
    caption: "การแลกเปลี่ยนแก๊สเกิดที่ถุงลม ส่วนอวัยวะอื่นเป็นทางผ่านของอากาศ (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: figure
    title: กลไกการหายใจเข้าและออก
    src: breathing-mechanism.svg
    alt: "ภาพ 2 ช่อง ช่องซ้ายหายใจเข้า ลูกศรอากาศชี้ลงเข้าหลอดลม ปอดสองข้างใหญ่ กระดูกซี่โครงยกขึ้นและกางออก (ลูกศรเฉียงขึ้นออกด้านนอก) กะบังลมแบนราบและอยู่ต่ำ มีลูกศรชี้ลง คำบรรยาย กะบังลมหดตัว เลื่อนต่ำลง ซี่โครงยกขึ้น ช่องอกขยาย ความดันในปอดลดลง ช่องขวาหายใจออก ลูกศรอากาศชี้ขึ้นออกจากหลอดลม ปอดเล็กลง ซี่โครงลดต่ำลงและหุบเข้า กะบังลมโค้งขึ้นเป็นโดม มีลูกศรชี้ขึ้น คำบรรยาย กะบังลมคลายตัว โค้งขึ้น ซี่โครงลดต่ำลง ช่องอกเล็กลง ความดันในปอดเพิ่มขึ้น"
    caption: "อากาศเคลื่อนจากที่ความดันสูงไปความดันต่ำ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ทำนายผลจากแบบจำลองขวดแก้ว
    problem: "ในแบบจำลองขวดแก้ว ถ้าดันแผ่นยางที่ก้นขวดขึ้น ลูกโป่งจะเป็นอย่างไร และเหมือนกับจังหวะใดของการหายใจ"
    steps:
      - text: "ดันแผ่นยางขึ้น ที่ว่างในขวดน้อยลง ปริมาตรในขวดลดลง"
      - text: "ปริมาตรลด ความดันในขวดเพิ่มขึ้นจนสูงกว่าอากาศภายนอก"
        why: "แก๊สปริมาณเท่าเดิมที่ถูกบีบให้อยู่ในที่แคบลงจะมีความดันสูงขึ้น"
      - text: "ความดันรอบลูกโป่งดันอากาศในลูกโป่งออกทางหลอด ลูกโป่งแฟบ"
    answer: "ลูกโป่งแฟบ เหมือนการหายใจออกเมื่อกะบังลมคลายตัวและโค้งขึ้น"
  - { type: check, problem: biology.humans.respiration-excretion.p004, prompt: "ใช้เหตุผลเดียวกันแต่กลับทิศ" }
  - type: figure
    title: อวัยวะในระบบขับถ่ายทางไต
    src: urinary-system.svg
    alt: "แผนภาพด้านหน้า ไตรูปเมล็ดถั่วสีน้ำตาล 2 ข้าง อยู่สองข้างของหลอดเลือดใหญ่ (หลอดเลือดแดงสีแดงและหลอดเลือดดำสีน้ำเงินตั้งตรงคู่กัน) หลอดเลือดแดงนำเลือดเข้าไตและหลอดเลือดดำนำเลือดออกจากไตเป็นเส้นแนวนอน จากไตแต่ละข้างมีท่อไตสีเหลืองโค้งลงไปที่กระเพาะปัสสาวะด้านล่าง และมีท่อปัสสาวะต่อจากกระเพาะปัสสาวะลงไป"
    caption: "ไตกรองเลือดเป็นปัสสาวะ ท่อไตพาไปเก็บในกระเพาะปัสสาวะ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: คำนวณปริมาตรอากาศและปัสสาวะ
    problem: "นักกีฬาคนหนึ่งขณะพักหายใจ 12 ครั้งต่อนาที ครั้งละ 600 มิลลิลิตร (1) ใน 1 ชั่วโมงหายใจเอาอากาศเข้ากี่ลิตร (2) ถ้าไตกรองของเหลวได้ 7.5 ลิตรต่อชั่วโมง และดูดกลับร้อยละ 99 จะได้ปัสสาวะกี่มิลลิลิตรต่อชั่วโมง"
    steps:
      - text: "(1) ต่อนาที $600 \\times 12 = 7{,}200$ มิลลิลิตร $= 7.2$ ลิตร ต่อชั่วโมง $7.2 \\times 60 = 432$ ลิตร"
      - text: "(2) ส่วนที่ไม่ถูกดูดกลับคือร้อยละ $100 - 99 = 1$"
        why: "ปัสสาวะคือส่วนที่กรองแล้วไม่ถูกดูดกลับ"
      - text: "ปัสสาวะ $= 7.5 \\times \\frac{1}{100} = 0.075$ ลิตร $= 75$ มิลลิลิตรต่อชั่วโมง"
    answer: "(1) 432 ลิตรต่อชั่วโมง (2) 75 มิลลิลิตรต่อชั่วโมง"
  - { type: check, problem: biology.humans.respiration-excretion.p008, prompt: "คิดถึงปริมาตรในขวดและความดันก่อน แล้วค่อยคิดถึงลูกโป่ง" }
glossary:
  - { term: กะบังลม, definition: "แผ่นกล้ามเนื้อรูปโดมที่กั้นช่องอกกับช่องท้อง หดตัวเมื่อหายใจเข้า" }
  - { term: ถุงลม, definition: "ถุงเล็ก ๆ ที่ปลายหลอดลมฝอย ผนังบางมีหลอดเลือดฝอยพันรอบ เป็นที่แลกเปลี่ยนแก๊ส" }
  - { term: ฝาปิดกล่องเสียง, definition: "แผ่นกระดูกอ่อนที่ปิดทางเข้ากล่องเสียงขณะกลืนอาหาร ไม่ให้อาหารตกลงหลอดลม" }
  - { term: หน่วยไต, definition: "หน่วยย่อยของไตที่กรองเลือดและดูดสารที่มีประโยชน์กลับ ไตแต่ละข้างมีราว 1 ล้านหน่วย" }
  - { term: ยูเรีย, definition: "ของเสียที่มีไนโตรเจน ตับสร้างจากการสลายโปรตีน และไตขับออกทางปัสสาวะ" }
  - { term: ท่อไต, definition: "ท่อที่นำปัสสาวะจากไตไปยังกระเพาะปัสสาวะ" }
flashcards:
  - { front: "หายใจเข้า กะบังลมและซี่โครงทำอะไร", back: "กะบังลมหดตัวเลื่อนต่ำลง ซี่โครงยกขึ้น ช่องอกขยาย ความดันลด อากาศเข้า" }
  - { front: "ลักษณะของถุงลมที่ช่วยแลกเปลี่ยนแก๊ส", back: "จำนวนมาก ผนังบาง ชื้น มีหลอดเลือดฝอยพันรอบ" }
  - { front: "ลมหายใจออกมีออกซิเจนเท่าไร", back: "ราวร้อยละ 16 (อากาศหายใจเข้าราวร้อยละ 21)" }
  - { front: "ทางเดินของปัสสาวะ", back: "ไต → ท่อไต → กระเพาะปัสสาวะ → ท่อปัสสาวะ" }
  - { front: "ไตกรองวันละกี่ลิตร ได้ปัสสาวะเท่าไร", back: "กรองราว 180 ลิตร ดูดกลับเกือบหมด เหลือปัสสาวะราว 1–2 ลิตร" }
