id: thai.writing.consonants
subject: thai
title: { th: พยัญชนะไทยและอักษรสามหมู่, en: Thai consonants and the three consonant classes }
summary: รู้จักพยัญชนะไทย 44 ตัว แบ่งเป็นอักษรกลาง สูง และต่ำ บอกพยัญชนะต้นและตัวสะกด และจัดคำเข้ามาตราตัวสะกด 8 มาตรา
difficulty: 1
minutes: 25
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - type: figure
    src: consonant-classes.svg
    alt: "ตารางพยัญชนะไทย 44 ตัวเรียงตามลำดับ ก ไก่ ถึง ฮ นกฮูก แถวละ 11 ตัว ระบายสีตามหมู่ อักษรกลางสีฟ้า 9 ตัว ก จ ฎ ฏ ด ต บ ป อ อักษรสูงสีแดง 11 ตัว ข ฃ ฉ ฐ ถ ผ ฝ ศ ษ ส ห อักษรต่ำคู่สีเขียว 14 ตัว ค ฅ ฆ ช ซ ฌ ฑ ฒ ท ธ พ ฟ ภ ฮ อักษรต่ำเดี่ยวสีเหลือง 10 ตัว ง ญ ณ น ม ย ร ล ว ฬ ฃ และ ฅ มีกรอบเส้นประเพราะเลิกใช้แล้ว"
    caption: "พยัญชนะ 44 ตัวแยกสีตามอักษรสามหมู่ สังเกตว่าอักษรต่ำมีมากที่สุด"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: syllable-parts.svg
    alt: "แผนภาพแจกลูกพยางค์ คำว่า ข้าว แยกเป็น พยัญชนะต้น ข บวก วรรณยุกต์ไม้โท บวก สระ อา บวก ตัวสะกด ว และคำว่า กลาง แยกเป็น พยัญชนะต้นควบกล้ำ กล บวก สระ อา บวก ตัวสะกด ง แม่กง"
    caption: "พยางค์หนึ่งมีพยัญชนะต้นและสระเสมอ ตัวสะกดและวรรณยุกต์มีหรือไม่มีก็ได้"
  - type: worked-example
    title: บอกหมู่ของพยัญชนะต้นในคำว่า ผัดไทย
    problem: "คำว่า ผัดไทย มีพยางค์ ผัด และ ไทย พยัญชนะต้นของแต่ละพยางค์เป็นอักษรหมู่ใด"
    steps:
      - text: "หาพยัญชนะต้นของแต่ละพยางค์: ผัด มี ผ ส่วน ไทย มี ท"
        why: "สระ ไ- เขียนไว้หน้าพยัญชนะ แต่พยัญชนะต้นคือ ท ไม่ใช่ตัวสระ"
      - text: "ผ อยู่ในประโยค ผี ฝาก ถุง ข้าว สาร ให้ ฉัน จึงเป็นอักษรสูง"
      - text: "ท ไม่อยู่ในประโยคของอักษรกลางหรืออักษรสูง จึงเป็นอักษรต่ำ"
      - text: "ท ออกเสียงเหมือน ถ ซึ่งเป็นอักษรสูง จึงเป็นอักษรต่ำคู่"
        why: "อักษรต่ำคู่คืออักษรต่ำที่มีอักษรสูงออกเสียงเดียวกัน"
    answer: "ผ เป็นอักษรสูง ท เป็นอักษรต่ำคู่"
  - { type: check, problem: thai.cons.p004, prompt: "ลองจัดหมู่พยัญชนะด้วยตัวเอง" }
  - type: worked-example
    title: วิเคราะห์คำว่า พระจันทร์
    problem: "แยกคำว่า พระจันทร์ เป็นพยางค์ บอกพยัญชนะต้น คำควบกล้ำ ตัวสะกดและมาตรา และตัวการันต์"
    steps:
      - text: "แบ่งพยางค์ตามเสียงอ่าน: พระ-จัน"
      - text: "พระ: พยัญชนะต้น พ กับ ร ออกเสียงควบกัน เป็นควบกล้ำแท้ สระอะ ไม่มีตัวสะกด (แม่ ก กา)"
        why: "ได้ยินทั้งเสียง พ และ ร ในพยางค์เดียว ต่างจาก จริง ที่ไม่ได้ยินเสียง ร"
      - text: "จันทร์: พยัญชนะต้น จ สระอะ (เขียนเป็นไม้หันอากาศ) ตัวสะกด น"
      - text: "ทร์ มีไม้ทัณฑฆาตกำกับ จึงเป็นตัวการันต์ ไม่ออกเสียง"
      - text: "ตัวสะกดที่ออกเสียงคือ น ตรงมาตรา อยู่แม่กน"
        why: "หามาตราจากเสียงท้ายที่ได้ยินจริง โดยข้ามตัวการันต์"
    answer: "พระ: ควบกล้ำแท้ พร แม่ ก กา · จันทร์: ตัวสะกด น แม่กน มี ทร์ เป็นตัวการันต์"
  - { type: check, problem: thai.cons.p016, prompt: "ฟังเสียงพยัญชนะต้นให้ดี" }
glossary:
  - { term: ไตรยางศ์, definition: "การแบ่งพยัญชนะไทยเป็น 3 หมู่ คืออักษรกลาง 9 ตัว อักษรสูง 11 ตัว และอักษรต่ำ 24 ตัว" }
  - { term: อักษรต่ำคู่, definition: "อักษรต่ำ 14 ตัวที่มีเสียงเดียวกับอักษรสูง เช่น ค คู่กับ ข และ ซ คู่กับ ส" }
  - { term: อักษรต่ำเดี่ยว, definition: "อักษรต่ำ 10 ตัว คือ ง ญ ณ น ม ย ร ล ว ฬ ซึ่งไม่มีอักษรสูงที่ออกเสียงเดียวกัน" }
  - { term: ตัวสะกด, definition: "พยัญชนะที่อยู่ท้ายพยางค์หลังสระ เช่น ด ในคำว่า มด" }
flashcards:
  - { front: "อักษรกลาง 9 ตัวมีอะไรบ้าง", back: "ก จ ฎ ฏ ด ต บ ป อ (ไก่ จิก เด็ก ตาย บน ปาก โอ่ง)" }
  - { front: "อักษรสูง 11 ตัวมีอะไรบ้าง", back: "ข ฃ ฉ ฐ ถ ผ ฝ ศ ษ ส ห (ผี ฝาก ถุง ข้าว สาร ให้ ฉัน)" }
  - { front: "อักษรต่ำเดี่ยว 10 ตัวมีอะไรบ้าง", back: "ง ญ ณ น ม ย ร ล ว ฬ (งู ใหญ่ นอน อยู่ ณ ริม วัด โม ฬี โลก)" }
  - { front: "มาตราตัวสะกด 8 มาตรามีอะไรบ้าง", back: "แม่กก กด กบ กง กน กม เกย เกอว (คำที่ไม่มีตัวสะกดเรียกว่าแม่ ก กา)" }
  - { front: "ญ ณ ร ล ฬ เป็นตัวสะกดออกเสียงอะไร", back: "ออกเสียง /น/ อยู่ในมาตราแม่กน เช่น คุณ พร ผล" }
