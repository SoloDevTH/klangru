  - id: biology.cells.cellular-respiration.p018
    topics: [biology.cells.cellular-respiration]
    difficulty: 5
    type: mcq
    stem: "ชุดทดลองวัดการหายใจ (เรสไพโรมิเตอร์) มีเมล็ดถั่วเขียวที่กำลังงอกในหลอดปิด และมีสารละลายโพแทสเซียมไฮดรอกไซด์ (KOH) ดูดซับ CO₂ ต่อกับหลอดแก้วเล็กที่มีหยดน้ำสี เวลาผ่านไปหยดน้ำสีเลื่อนเข้าหาเมล็ด เพราะเหตุใด"
    choices:
      - { id: a, text: "เมล็ดใช้ O₂ ในการหายใจ ส่วน CO₂ ที่ปล่อยถูก KOH ดูดซับ แก๊สในหลอดจึงลดลง", correct: true }
      - { id: b, text: "เมล็ดปล่อย CO₂ ทำให้แก๊สในหลอดเพิ่มขึ้น", feedback: "ถ้าแก๊สเพิ่ม หยดน้ำสีจะเลื่อนออก และ CO₂ ถูก KOH ดูดซับไปแล้ว" }
      - { id: c, text: "เมล็ดสังเคราะห์ด้วยแสงสร้าง O₂", feedback: "เมล็ดที่กำลังงอกยังไม่มีใบสีเขียว และการสร้าง O₂ จะทำให้แก๊สเพิ่มขึ้น" }
      - { id: d, text: "KOH ดูดซับ O₂", feedback: "KOH ดูดซับ CO₂ ไม่ใช่ O₂ การลดลงของ O₂ เกิดจากเมล็ดใช้ในการหายใจ" }
    hints:
      - "การหายใจระดับเซลล์ใช้แก๊สใดและปล่อยแก๊สใด"
      - "แก๊สชนิดใดถูก KOH ดูดซับ จึงไม่เหลือในหลอด"
    solution: "เมล็ดที่งอกหายใจใช้ O₂ และปล่อย CO₂ แต่ KOH ดูดซับ CO₂ ไว้ ปริมาตรแก๊สในหลอดจึงลดเท่ากับ O₂ ที่ใช้ หยดน้ำสีจึงเลื่อนเข้าหาเมล็ด ระยะที่เลื่อนใช้วัดอัตราการใช้ O₂ ได้ ควรมีชุดควบคุมที่ใช้เมล็ดต้มสุกแล้ว"
