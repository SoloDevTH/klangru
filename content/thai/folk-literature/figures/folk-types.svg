<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="sans-serif">
<title>วรรณกรรมพื้นบ้าน 4 กลุ่ม</title>
<defs></defs>
<rect x="0" y="0" width="860" height="330" fill="#fff"/>
<rect x="280.0" y="15.0" width="300.0" height="50.0" rx="10" fill="#5d4037" stroke="#5d4037" stroke-width="1.5"/>
<text x="430.0" y="48.0" font-size="22" text-anchor="middle" fill="#fff" font-weight="bold">วรรณกรรมพื้นบ้าน</text>
<text x="430.0" y="86.0" font-size="15" text-anchor="middle" fill="#555" font-weight="normal">เล่าหรือร้องปากต่อปาก · ไม่รู้ผู้แต่ง · มีหลายสำนวน</text>
<line x1="430.0" y1="98.0" x2="113.0" y2="128.0" stroke="#8d6e63" stroke-width="2" stroke-linecap="round"/>
<rect x="15.0" y="128.0" width="196.0" height="186.0" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="113.0" y="160.0" font-size="20" text-anchor="middle" fill="#1565c0" font-weight="bold">บทร้องเล่น</text>
<text x="113.0" y="186.0" font-size="15" text-anchor="middle" fill="#333" font-weight="normal">ร้องประกอบการเล่น</text>
<text x="113.0" y="226.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">รีรีข้าวสาร</text>
<text x="113.0" y="256.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">มอญซ่อนผ้า</text>
<text x="113.0" y="286.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">จ้ำจี้</text>
<line x1="430.0" y1="98.0" x2="325.0" y2="128.0" stroke="#8d6e63" stroke-width="2" stroke-linecap="round"/>
<rect x="227.0" y="128.0" width="196.0" height="186.0" rx="10" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
<text x="325.0" y="160.0" font-size="20" text-anchor="middle" fill="#ad1457" font-weight="bold">เพลงกล่อมเด็ก</text>
<text x="325.0" y="186.0" font-size="15" text-anchor="middle" fill="#333" font-weight="normal">ร้องให้เด็กนอน</text>
<text x="325.0" y="226.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">เจ้าเนื้อละมุน</text>
<text x="325.0" y="256.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">นกขมิ้น</text>
<text x="325.0" y="286.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">ใต้: เพลงร้องเรือ</text>
<line x1="430.0" y1="98.0" x2="537.0" y2="128.0" stroke="#8d6e63" stroke-width="2" stroke-linecap="round"/>
<rect x="439.0" y="128.0" width="196.0" height="186.0" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
<text x="537.0" y="160.0" font-size="20" text-anchor="middle" fill="#e65100" font-weight="bold">เพลงพื้นบ้าน</text>
<text x="537.0" y="186.0" font-size="15" text-anchor="middle" fill="#333" font-weight="normal">ผู้ใหญ่ร้องโต้ตอบ</text>
<text x="537.0" y="226.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">เพลงฉ่อย ลำตัด</text>
<text x="537.0" y="256.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">ซอ หมอลำ</text>
<text x="537.0" y="286.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">เพลงบอก</text>
<line x1="430.0" y1="98.0" x2="749.0" y2="128.0" stroke="#8d6e63" stroke-width="2" stroke-linecap="round"/>
<rect x="651.0" y="128.0" width="196.0" height="186.0" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="749.0" y="160.0" font-size="20" text-anchor="middle" fill="#2e7d32" font-weight="bold">นิทานพื้นบ้าน</text>
<text x="749.0" y="186.0" font-size="15" text-anchor="middle" fill="#333" font-weight="normal">เล่าเรื่อง มีข้อคิด</text>
<text x="749.0" y="226.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">ปลาบู่ทอง</text>
<text x="749.0" y="256.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">ก่องข้าวน้อย</text>
<text x="749.0" y="286.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">ผาแดงนางไอ่</text>
