    choices:
      - { id: a, text: "นักเรียนส่วนใหญ่ในกลุ่มที่สำรวจชอบข้าวเหนียว ถ้ากลุ่มนี้สุ่มมาอย่างยุติธรรม นักเรียนโรงเรียนนี้ก็น่าจะชอบข้าวเหนียวมากกว่า", correct: true }
      - { id: b, text: "คนไทยร้อยละ 70 ชอบข้าวเหนียว", feedback: "สำรวจแค่นักเรียน 30 คนในโรงเรียนเดียวในภาคเหนือ ใช้สรุปคนทั้งประเทศไม่ได้" }
      - { id: c, text: "นักเรียนทุกคนในโรงเรียนนี้ชอบข้าวเหนียว", feedback: "ในกลุ่มที่สำรวจเองยังมีร้อยละ 30 ที่ไม่ชอบ" }
    hints:
      - "ข้อสรุปควรพูดถึงกลุ่มที่ข้อมูลเป็นตัวแทนได้เท่านั้น"
      - "คิดถึงขนาดของกลุ่มตัวอย่างและสถานที่ที่สำรวจ"
    solution: "ข้อมูลเป็นตัวแทนได้อย่างมากแค่นักเรียนโรงเรียนนั้น และต้องมีเงื่อนไขว่าสุ่มมาอย่างยุติธรรม การสรุปไปถึงคนไทยทั้งประเทศหรือ \"ทุกคน\" เกินกว่าที่ข้อมูลบอก"
