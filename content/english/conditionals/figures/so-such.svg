<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="sans-serif">
<title>so ... that กับ such ... that</title>
<rect x="0" y="0" width="720" height="250" fill="#fff"/>
<text x="360.0" y="30.0" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">“มากจนกระทั่ง”: so หรือ such</text>
<rect x="30.0" y="60.0" width="135.0" height="40.0" rx="6" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="97.5" y="86.0" font-size="17" text-anchor="middle" fill="#111" font-weight="normal">The soup was</text>
<rect x="173.0" y="60.0" width="42.7" height="40.0" rx="6" fill="#dbe8fb" stroke="#2f5fa8" stroke-width="2"/>
<text x="194.4" y="86.0" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">so</text>
<rect x="223.7" y="60.0" width="66.2" height="40.0" rx="6" fill="#fde7cf" stroke="#c46a12" stroke-width="2"/>
<text x="256.8" y="86.0" font-size="17" text-anchor="middle" fill="#111" font-weight="normal">spicy</text>
<rect x="297.9" y="60.0" width="61.4" height="40.0" rx="6" fill="#eee" stroke="#777" stroke-width="2"/>
<text x="328.6" y="86.0" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">that</text>
<rect x="367.3" y="60.0" width="182.3" height="40.0" rx="6" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="458.4" y="86.0" font-size="17" text-anchor="middle" fill="#111" font-weight="normal">I couldn't finish it.</text>
<text x="30.0" y="128.0" font-size="15" text-anchor="start" fill="#2f5fa8" font-weight="bold">so + คุณศัพท์ (ไม่มีคำนามตาม)</text>
<rect x="30.0" y="150.0" width="83.2" height="40.0" rx="6" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="71.6" y="176.0" font-size="17" text-anchor="middle" fill="#111" font-weight="normal">It was</text>
<rect x="121.2" y="150.0" width="61.4" height="40.0" rx="6" fill="#dbe8fb" stroke="#2f5fa8" stroke-width="2"/>
<text x="151.9" y="176.0" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">such</text>
<rect x="190.6" y="150.0" width="33.4" height="40.0" rx="6" fill="#eee" stroke="#777" stroke-width="2"/>
<text x="207.2" y="176.0" font-size="17" text-anchor="middle" fill="#111" font-weight="normal">a</text>
<rect x="231.9" y="150.0" width="66.2" height="40.0" rx="6" fill="#fde7cf" stroke="#c46a12" stroke-width="2"/>
<text x="265.0" y="176.0" font-size="17" text-anchor="middle" fill="#111" font-weight="normal">spicy</text>
<rect x="306.1" y="150.0" width="61.4" height="40.0" rx="6" fill="#e3f2e1" stroke="#2f7a3a" stroke-width="2"/>
<text x="336.8" y="176.0" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">soup</text>
<rect x="375.5" y="150.0" width="61.4" height="40.0" rx="6" fill="#eee" stroke="#777" stroke-width="2"/>
<text x="406.2" y="176.0" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">that</text>
<rect x="444.9" y="150.0" width="182.3" height="40.0" rx="6" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="536.0" y="176.0" font-size="17" text-anchor="middle" fill="#111" font-weight="normal">I couldn't finish it.</text>
<text x="30.0" y="218.0" font-size="15" text-anchor="start" fill="#2f5fa8" font-weight="bold">such + (a/an) + คุณศัพท์ + คำนาม</text>
</svg>
