<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="820" height="320" font-family="sans-serif">
<title>กรอบ STEP สี่ด้านสำหรับปรับเกม</title>
<rect x="0" y="0" width="820" height="320" fill="#ffffff"/>
<rect x="20" y="60" width="180" height="190" rx="14" fill="#cfe3f5" stroke="#222" stroke-width="2.5"/>
<text x="110.0" y="98" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">พื้นที่</text>
<text x="110.0" y="122" text-anchor="middle" font-size="16" fill="#222">(Space)</text>
<line x1="40" y1="136" x2="180" y2="136" stroke="#222" stroke-width="1.5"/>
<text x="110.0" y="170" text-anchor="middle" font-size="18" fill="#222">ลดขนาดสนาม</text>
<text x="110.0" y="198" text-anchor="middle" font-size="18" fill="#222">ทำเขตปลอดภัย</text>
<rect x="212" y="60" width="180" height="190" rx="14" fill="#d7f0d0" stroke="#222" stroke-width="2.5"/>
<text x="302.0" y="98" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">งาน</text>
<text x="302.0" y="122" text-anchor="middle" font-size="16" fill="#222">(Task)</text>
<line x1="232" y1="136" x2="372" y2="136" stroke="#222" stroke-width="1.5"/>
<text x="302.0" y="170" text-anchor="middle" font-size="18" fill="#222">เปลี่ยนเป้าหมาย</text>
<text x="302.0" y="198" text-anchor="middle" font-size="18" fill="#222">ให้เล่นได้หลายแบบ</text>
<rect x="404" y="60" width="180" height="190" rx="14" fill="#fbe7b5" stroke="#222" stroke-width="2.5"/>
<text x="494.0" y="98" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">อุปกรณ์</text>
<text x="494.0" y="122" text-anchor="middle" font-size="16" fill="#222">(Equipment)</text>
<line x1="424" y1="136" x2="564" y2="136" stroke="#222" stroke-width="1.5"/>
<text x="494.0" y="170" text-anchor="middle" font-size="18" fill="#222">ใช้ลูกบอลนิ่ม</text>
<text x="494.0" y="198" text-anchor="middle" font-size="18" fill="#222">หรือเบาลง</text>
<rect x="596" y="60" width="180" height="190" rx="14" fill="#f5d0d0" stroke="#222" stroke-width="2.5"/>
<text x="686.0" y="98" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">ผู้เล่น</text>
<text x="686.0" y="122" text-anchor="middle" font-size="16" fill="#222">(People)</text>
<line x1="616" y1="136" x2="756" y2="136" stroke="#222" stroke-width="1.5"/>
<text x="686.0" y="170" text-anchor="middle" font-size="18" fill="#222">แบ่งทีมให้</text>
<text x="686.0" y="198" text-anchor="middle" font-size="18" fill="#222">ทักษะสมดุล</text>
<text x="20" y="290" font-size="18" fill="#222">ปรับทีละด้าน แล้วทดลองซ้ำ เพื่อให้ทุกคนได้เล่นอย่างยุติธรรม</text>
</svg>
