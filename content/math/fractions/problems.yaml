problems:
  - id: math.frac.p001
    topics: [math.number.fractions]
    difficulty: 1
    type: mcq
    stem: "ข้อใดคือเศษส่วนอย่างต่ำของ $\\dfrac{12}{18}$"
    choices:
      - { id: a, text: "$\\dfrac{2}{3}$", correct: true }
      - { id: b, text: "$\\dfrac{6}{9}$", feedback: "$\\tfrac{6}{9}$ มีค่าเท่ากันก็จริง แต่ยังหารด้วย 3 ได้อีก จึงยังไม่ใช่อย่างต่ำ" }
      - { id: c, text: "$\\dfrac{4}{6}$", feedback: "$\\tfrac{4}{6}$ มีค่าเท่ากันก็จริง แต่ยังหารด้วย 2 ได้อีก จึงยังไม่ใช่อย่างต่ำ" }
      - { id: d, text: "$\\dfrac{3}{2}$", feedback: "ดูเหมือนสลับตัวเศษกับตัวส่วน $\\tfrac{12}{18}$ น้อยกว่า 1 คำตอบจึงต้องน้อยกว่า 1 ด้วย" }
    hints:
      - "หาจำนวนที่หารทั้ง 12 และ 18 ลงตัว"
      - "หารด้วย ห.ร.ม. ของ 12 กับ 18 จะได้อย่างต่ำในขั้นเดียว"
    solution: "ห.ร.ม. ของ 12 และ 18 คือ 6 จึงได้ $\\dfrac{12 \\div 6}{18 \\div 6} = \\dfrac{2}{3}$ ซึ่ง 2 กับ 3 ไม่มีตัวประกอบร่วมนอกจาก 1"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.frac.p002
    topics: [math.number.fractions]
    difficulty: 2
    type: text
    stem: "เขียน $0.75$ เป็นเศษส่วนอย่างต่ำ (พิมพ์ในรูป a/b เช่น 2/5)"
    accepted: ["3/4"]
    hints:
      - "$0.75$ มีทศนิยม 2 ตำแหน่ง จึงเขียนเป็นเศษส่วนที่มีตัวส่วนเป็น 100 ได้"
      - "เขียนเป็น $\\tfrac{75}{100}$ แล้วหารทั้งเศษและส่วนด้วย ห.ร.ม. ของ 75 กับ 100"
    misconceptions:
      - { match: "75/100", feedback: "ค่าถูกแล้ว แต่ยังไม่ใช่อย่างต่ำ ลองหารทั้งเศษและส่วนด้วย 25" }
      - { match: "15/20", feedback: "ค่าถูกแล้ว แต่ยังหารด้วย 5 ได้อีก จึงยังไม่ใช่อย่างต่ำ" }
    solution: "$0.75 = \\dfrac{75}{100}$ ห.ร.ม. ของ 75 กับ 100 คือ 25 จึงได้ $\\dfrac{75 \\div 25}{100 \\div 25} = \\dfrac{3}{4}$ ตรวจ: $3 \\div 4 = 0.75$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.frac.p003
    topics: [math.number.fractions]
    difficulty: 2
    type: text
    stem: "หาค่า $\\dfrac{1}{2} + \\dfrac{1}{3}$ ตอบเป็นเศษส่วนอย่างต่ำ (พิมพ์ในรูป a/b)"
    accepted: ["5/6"]
    hints:
      - "ชิ้นขนาดครึ่งหนึ่งกับหนึ่งในสามมีขนาดไม่เท่ากัน ต้องทำตัวส่วนให้เท่ากันก่อน"
      - "ค.ร.น. ของ 2 และ 3 คือ 6"
      - "เปลี่ยนทั้งสองจำนวนให้มีตัวส่วนเป็น 6 แล้วบวกเฉพาะตัวเศษ"
    misconceptions:
      - { match: "2/5", feedback: "ดูเหมือนบวกเศษกับเศษ ส่วนกับส่วน ซึ่งทำไม่ได้ สังเกตว่า $\\tfrac{2}{5}$ น้อยกว่า $\\tfrac{1}{2}$ ด้วยซ้ำ ต้องทำตัวส่วนให้เท่ากันก่อน" }
      - { match: "2/6", feedback: "ตัวส่วน 6 ถูกแล้ว แต่ต้องคูณตัวเศษด้วย: $\\tfrac{1}{2} = \\tfrac{3}{6}$ และ $\\tfrac{1}{3} = \\tfrac{2}{6}$" }
    solution: "$\\dfrac{1}{2} + \\dfrac{1}{3} = \\dfrac{3}{6} + \\dfrac{2}{6} = \\dfrac{5}{6}$ ตรวจด้วยการประมาณ: มากกว่าครึ่งแต่ไม่ถึง 1 ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.frac.p004
    topics: [math.number.fractions]
    difficulty: 2
    type: match
    stem: "จับคู่เศษส่วนกับทศนิยมที่มีค่าเท่ากัน"
    pairs:
      - { left: "$\\dfrac{1}{2}$", right: "$0.5$" }
      - { left: "$\\dfrac{1}{4}$", right: "$0.25$" }
      - { left: "$\\dfrac{3}{5}$", right: "$0.6$" }
      - { left: "$\\dfrac{1}{8}$", right: "$0.125$" }
      - { left: "$\\dfrac{7}{4}$", right: "$1.75$" }
    hints:
      - "เศษส่วนก็คือการหาร ตัวเศษ ÷ ตัวส่วน"
      - "เศษส่วนที่มากกว่า 1 (ตัวเศษมากกว่าตัวส่วน) ต้องเป็นทศนิยมที่มากกว่า 1"
      - "ลองทำตัวส่วนให้เป็น 10 หรือ 100 เช่น $\\tfrac{3}{5} = \\tfrac{6}{10}$"
    solution: "$\\tfrac{1}{2} = 0.5$, $\\tfrac{1}{4} = \\tfrac{25}{100} = 0.25$, $\\tfrac{3}{5} = \\tfrac{6}{10} = 0.6$, $\\tfrac{1}{8} = 1 \\div 8 = 0.125$, $\\tfrac{7}{4} = 1\\tfrac{3}{4} = 1.75$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.frac.p005
    topics: [math.number.fractions]
    difficulty: 3
    type: numeric
    stem: "แม่ซื้อหมูที่ตลาด $\\dfrac{3}{4}$ กิโลกรัม ราคากิโลกรัมละ 160 บาท แม่ต้องจ่ายเงินกี่บาท"
    answer: { value: 120, unit: บาท }
    hints:
      - "ซื้อไม่ถึง 1 กิโลกรัม ราคาต้องน้อยกว่า 160 บาท"
      - "อ่านว่า \"สามในสี่ของ 160\" ซึ่งคือ $\\tfrac{3}{4} \\times 160$"
      - "หา $\\tfrac{1}{4}$ ของ 160 ก่อน แล้วคูณด้วย 3"
    misconceptions:
      - { match: 213.333, feedback: "ดูเหมือนนำ 160 หารด้วย $\\tfrac{3}{4}$ แต่โจทย์ถามราคาของ \"สามในสี่ของ 1 กิโลกรัม\" ต้องคูณ และคำตอบต้องน้อยกว่า 160" }
      - { match: 40, feedback: "นี่คือราคาของ $\\tfrac{1}{4}$ กิโลกรัม แม่ซื้อ 3 ส่วน จึงต้องคูณ 3 อีกครั้ง" }
    solution: "ราคา $= \\dfrac{3}{4} \\times 160 = 3 \\times \\dfrac{160}{4} = 3 \\times 40 = 120$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.frac.p006
    topics: [math.number.fractions]
    difficulty: 3
    type: numeric
    stem: "หาค่า $\\dfrac{3}{4} \\div \\dfrac{1}{2}$ ตอบเป็นทศนิยม"
    answer: { value: 1.5, tolerance: 0.01 }
    hints:
      - "ถามว่า ในสามในสี่ มีครึ่งหนึ่งอยู่กี่อัน คำตอบควรมากกว่า 1"
      - "การหารด้วยเศษส่วน คือการคูณด้วยส่วนกลับของตัวหาร"
      - "กลับเฉพาะตัวหาร $\\tfrac{1}{2}$ เป็น $\\tfrac{2}{1}$ แล้วคูณกับ $\\tfrac{3}{4}$"
    misconceptions:
      - { match: 0.375, feedback: "ดูเหมือนคูณ $\\tfrac{3}{4} \\times \\tfrac{1}{2}$ โดยไม่กลับตัวหาร ต้องคูณด้วยส่วนกลับของ $\\tfrac{1}{2}$ คือ $\\tfrac{2}{1}$" }
      - { match: 0.667, feedback: "ดูเหมือนกลับตัวตั้ง $\\tfrac{3}{4}$ แทนตัวหาร ต้องกลับเฉพาะตัวหาร (ตัวที่อยู่หลังเครื่องหมาย ÷)" }
    solution: "$\\dfrac{3}{4} \\div \\dfrac{1}{2} = \\dfrac{3}{4} \\times \\dfrac{2}{1} = \\dfrac{6}{4} = \\dfrac{3}{2} = 1.5$ หมายความว่า ในสามในสี่มีครึ่งหนึ่งอยู่หนึ่งอันครึ่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.frac.p007
    topics: [math.number.fractions]
    difficulty: 4
    type: numeric
    stem: "นิดต้องปั่นจักรยานทั้งหมด 36 กิโลเมตร ช่วงเช้าปั่นได้ $\\dfrac{2}{3}$ ของระยะทั้งหมด ช่วงบ่ายปั่นได้อีก $\\dfrac{1}{4}$ ของระยะทั้งหมด เหลือระยะทางอีกกี่กิโลเมตร"
    answer: { value: 3, unit: กิโลเมตร }
    hints:
      - "หาก่อนว่าปั่นไปแล้วรวมเป็นเศษส่วนเท่าไรของระยะทั้งหมด"
      - "$\\tfrac{2}{3} + \\tfrac{1}{4}$ ต้องทำตัวส่วนให้เท่ากัน (ค.ร.น. ของ 3 และ 4 คือ 12)"
      - "ส่วนที่เหลือคือ $1$ ลบด้วยส่วนที่ปั่นไปแล้ว จากนั้นนำไปคูณกับ 36"
    misconceptions:
      - { match: 33, feedback: "นี่คือระยะที่ปั่นไปแล้ว โจทย์ถามระยะที่ **เหลือ** ต้องนำไปลบออกจาก 36" }
      - { match: 20.571, feedback: "ดูเหมือนบวก $\\tfrac{2}{3} + \\tfrac{1}{4}$ เป็น $\\tfrac{3}{7}$ ต้องทำตัวส่วนให้เท่ากันก่อน: $\\tfrac{8}{12} + \\tfrac{3}{12}$" }
    solution: "ปั่นไปแล้ว $\\tfrac{2}{3} + \\tfrac{1}{4} = \\tfrac{8}{12} + \\tfrac{3}{12} = \\tfrac{11}{12}$ ของทาง เหลือ $1 - \\tfrac{11}{12} = \\tfrac{1}{12}$ ของทาง คิดเป็น $\\tfrac{1}{12} \\times 36 = 3$ กิโลเมตร ตรวจ: เช้า 24 กม. บ่าย 9 กม. รวม 33 กม. เหลือ $36 - 33 = 3$ กม. ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.frac.p008
    topics: [math.number.fractions]
    difficulty: 5
    type: numeric
    stem: "หาค่า $\\left(2\\tfrac{1}{2} - \\dfrac{2}{3}\\right) \\div 1\\tfrac{5}{6}$"
    answer: { value: 1 }
    hints:
      - "เปลี่ยนจำนวนคละทุกตัวเป็นเศษเกินก่อน และคำนวณในวงเล็บก่อน"
      - "$2\\tfrac{1}{2} = \\tfrac{5}{2}$ และ $1\\tfrac{5}{6} = \\tfrac{11}{6}$ ส่วนในวงเล็บต้องทำตัวส่วนให้เท่ากันเป็น 6"
      - "เมื่อได้ผลในวงเล็บแล้ว ให้คูณด้วยส่วนกลับของ $\\tfrac{11}{6}$ แล้วสังเกตผลที่ได้"
    misconceptions:
      - { match: 3.361, feedback: "ดูเหมือนคูณด้วย $\\tfrac{11}{6}$ โดยไม่กลับตัวหาร การหารต้องคูณด้วยส่วนกลับ คือ $\\tfrac{6}{11}$" }
      - { match: 2.2, feedback: "ดูเหมือนใช้ตัวหารเป็น $\\tfrac{5}{6}$ แล้วลืมจำนวนเต็ม 1 ใน $1\\tfrac{5}{6}$ ต้องเปลี่ยนเป็นเศษเกิน $\\tfrac{11}{6}$ ก่อน" }
    solution: "ในวงเล็บ: $2\\tfrac{1}{2} - \\tfrac{2}{3} = \\tfrac{5}{2} - \\tfrac{2}{3} = \\tfrac{15}{6} - \\tfrac{4}{6} = \\tfrac{11}{6}$ แล้วหาร: $\\tfrac{11}{6} \\div \\tfrac{11}{6} = \\tfrac{11}{6} \\times \\tfrac{6}{11} = 1$ (จำนวนใดหารด้วยตัวเองได้ 1)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.frac.p009
    topics: [math.number.fractions]
    difficulty: 2
    type: numeric
    stem: "แม่หุงข้าวเหนียวได้ 2 กิโลกรัม แบ่งใส่กระติบใบละ $\\dfrac{1}{4}$ กิโลกรัม จะได้ข้าวเหนียวกี่กระติบ"
    answer: { value: 8, unit: กระติบ }
    hints:
      - "ถามว่าใน 2 กิโลกรัม มี $\\tfrac{1}{4}$ กิโลกรัมอยู่กี่ส่วน จึงเป็นการหาร"
      - "1 กิโลกรัมแบ่งเป็นส่วนละ $\\tfrac{1}{4}$ ได้ 4 ส่วน"
      - "คำนวณ $2 \\div \\tfrac{1}{4}$ โดยคูณด้วยส่วนกลับของ $\\tfrac{1}{4}$"
    misconceptions:
      - { match: 0.5, feedback: "ดูเหมือนคูณ $2 \\times \\tfrac{1}{4}$ แต่โจทย์ถามว่าแบ่งได้กี่กระติบ ต้องหาร และแบ่งเป็นส่วนเล็ก ๆ ได้หลายกระติบ คำตอบจึงควรมากกว่า 2" }
      - { match: 0.125, feedback: "ดูเหมือนหารกลับด้านเป็น $\\tfrac{1}{4} \\div 2$ โจทย์ถามว่า 2 กิโลกรัมมี $\\tfrac{1}{4}$ กิโลกรัมอยู่กี่ส่วน จึงต้องเป็น $2 \\div \\tfrac{1}{4}$" }
    solution: "$2 \\div \\dfrac{1}{4} = 2 \\times \\dfrac{4}{1} = 8$ กระติบ ตรวจ: $8 \\times \\tfrac{1}{4} = 2$ กิโลกรัม ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.frac.p010
    topics: [math.number.fractions]
    difficulty: 3
    type: text
    stem: "หาค่า $\\dfrac{5}{6} - \\dfrac{3}{4}$ ตอบเป็นเศษส่วนอย่างต่ำ (พิมพ์ในรูป a/b)"
    accepted: ["1/12"]
    hints:
      - "ตัวส่วนไม่เท่ากัน ต้องทำตัวส่วนให้เท่ากันก่อนลบ"
      - "ค.ร.น. ของ 6 และ 4 คือ 12"
      - "เปลี่ยนทั้งสองจำนวนให้มีตัวส่วนเป็น 12 แล้วลบเฉพาะตัวเศษ"
    misconceptions:
      - { match: "2/2", feedback: "ดูเหมือนลบเศษกับเศษ ส่วนกับส่วน ($5 - 3$ และ $6 - 4$) ซึ่งทำไม่ได้ ต้องทำตัวส่วนให้เท่ากันก่อน" }
      - { match: "2/24", feedback: "ค่าถูกแล้ว (ใช้ตัวส่วน 24 ได้) แต่ยังไม่ใช่อย่างต่ำ ลองหารทั้งเศษและส่วนด้วย 2" }
      - { match: "1", feedback: "ดูเหมือนลบเศษกับเศษ ส่วนกับส่วน ได้ $\\tfrac{2}{2} = 1$ ต้องทำตัวส่วนให้เท่ากันก่อน สังเกตว่า $\\tfrac{5}{6}$ กับ $\\tfrac{3}{4}$ มีค่าใกล้กันมาก ผลต่างจึงควรเล็กมาก" }
    solution: "$\\dfrac{5}{6} - \\dfrac{3}{4} = \\dfrac{10}{12} - \\dfrac{9}{12} = \\dfrac{1}{12}$ ตรวจด้วยทศนิยม: $0.833 - 0.75 \\approx 0.083 \\approx \\tfrac{1}{12}$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.frac.p011
    topics: [math.number.fractions]
    difficulty: 1
    type: mcq
    stem: "แถบในภาพแบ่งเป็นส่วนเท่า ๆ กัน ส่วนที่ระบายสีคือเศษส่วนใดของทั้งแถบ"
    figure: { src: bar-3-8.svg, alt: "แถบสี่เหลี่ยมยาวแบ่งเป็น 8 ช่องเท่ากัน ระบายสี 3 ช่องทางซ้าย อีก 5 ช่องไม่ระบาย" }
    choices:
      - { id: a, text: "$\\dfrac{3}{8}$", correct: true }
      - { id: b, text: "$\\dfrac{3}{5}$", feedback: "3 ต่อ 5 คือการเทียบส่วนที่ระบายกับส่วนที่ไม่ระบาย ตัวส่วนต้องเป็นจำนวนช่องทั้งหมด" }
      - { id: c, text: "$\\dfrac{5}{8}$", feedback: "$\\tfrac{5}{8}$ คือส่วนที่ไม่ได้ระบาย โจทย์ถามส่วนที่ระบายสี" }
      - { id: d, text: "$\\dfrac{8}{3}$", feedback: "ตัวเศษกับตัวส่วนสลับกัน ตัวส่วนคือจำนวนช่องทั้งหมด ตัวเศษคือจำนวนช่องที่ระบาย" }
    hints:
      - "นับว่าทั้งแถบแบ่งเป็นกี่ช่องเท่ากัน ตัวเลขนี้คือตัวส่วน"
      - "นับช่องที่ระบายสีเป็นตัวเศษ"
    solution: "ทั้งแถบมี 8 ช่องเท่ากัน (ตัวส่วน) ระบาย 3 ช่อง (ตัวเศษ) จึงเป็น $\\tfrac{3}{8}$ ของแถบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.frac.p012
    topics: [math.number.fractions]
    difficulty: 2
    type: text
    stem: "บนเส้นจำนวนในภาพ จุด A แทนเศษส่วนใด ตอบในรูปเศษเกิน (พิมพ์ในรูป a/b)"
    figure: { src: numberline-a.svg, alt: "เส้นจำนวนจาก 0 ถึง 2 มีขีดแบ่งทุกหนึ่งในสามหน่วย มีป้ายตัวเลขเฉพาะ 0, 1 และ 2 จุด A อยู่ที่ขีดที่สองหลังเลข 1 ก่อนถึงเลข 2 หนึ่งขีด" }
    accepted: ["5/3"]
    hints:
      - "ระหว่าง 0 กับ 1 ถูกแบ่งเป็นกี่ช่วงเท่ากัน แต่ละช่วงยาวเท่าใด"
      - "นับจาก 0 ไปถึง A ว่ากี่ช่วง"
    misconceptions:
      - { match: "5/6", feedback: "ดูเหมือนนับช่วงทั้งหมดจาก 0 ถึง 2 (6 ช่วง) เป็นตัวส่วน แต่ตัวส่วนต้องมาจากการแบ่งหนึ่งหน่วย (0 ถึง 1) ซึ่งมี 3 ช่วง" }
      - { match: "2/3", feedback: "นับเฉพาะช่วงหลัง 1 ได้ $\\tfrac{2}{3}$ แต่ A อยู่เลย 1 ไปแล้ว ต้องนับจาก 0" }
