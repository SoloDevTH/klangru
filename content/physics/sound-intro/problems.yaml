problems:
  - id: physics.waves.sound-intro.p001
    topics: [physics.waves.sound-intro]
    difficulty: 1
    type: mcq
    stem: "เสียงเกิดขึ้นได้อย่างไร"
    choices:
      - { id: a, text: "เกิดจากการสั่นของวัตถุ", correct: true }
      - { id: b, text: "เกิดจากแสงที่ส่องกระทบวัตถุ", feedback: "แสงทำให้เรามองเห็น แต่เสียงเกิดเมื่อวัตถุสั่น ในห้องมืดเราก็ยังได้ยินเสียง" }
      - { id: c, text: "เกิดขึ้นในหูของเราเอง", feedback: "หูเป็นตัวรับเสียง เสียงเกิดที่แหล่งกำเนิดเสียงซึ่งกำลังสั่น แล้วเดินทางมาถึงหู" }
    hints:
      - "แตะลำคอขณะพูด รู้สึกอย่างไร"
      - "จับหน้ากลองให้นิ่ง เสียงเป็นอย่างไร"
    solution: "เสียงเกิดจากการสั่นของวัตถุ เมื่อวัตถุหยุดสั่น เสียงก็หยุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.sound-intro.p002
    topics: [physics.waves.sound-intro]
    difficulty: 1
    type: mcq
    stem: "โรยเม็ดข้าวสารบนหน้ากลองยาว แล้วตีกลอง เม็ดข้าวสารกระโดดขึ้นลง ผลนี้แสดงว่าอะไร"
    choices:
      - { id: a, text: "หน้ากลองสั่นเมื่อเกิดเสียง", correct: true }
      - { id: b, text: "เม็ดข้าวสารทำให้เกิดเสียง", feedback: "ถ้าไม่มีเม็ดข้าวสาร กลองก็ยังมีเสียง เม็ดข้าวสารเพียงช่วยให้เห็นว่าหน้ากลองกำลังสั่น" }
      - { id: c, text: "ลมจากไม้ตีกลองพัดเม็ดข้าวสาร", feedback: "เม็ดข้าวสารยังกระโดดต่อหลังไม้ตีกลองลอยออกไปแล้ว แสดงว่าสิ่งที่ทำให้กระโดดคือหน้ากลองที่ยังสั่นอยู่" }
    hints:
      - "เราเห็นหน้ากลองสั่นด้วยตาเปล่ายาก เม็ดข้าวสารช่วยอะไร"
      - "เสียงเกิดจากอะไร"
    solution: "เม็ดข้าวสารกระโดดเพราะหน้ากลองสั่น ผลนี้เป็นหลักฐานว่าวัตถุที่ให้เสียงกำลังสั่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.sound-intro.p003
    topics: [physics.waves.sound-intro]
    difficulty: 1
    type: mcq
    multiple: true
    stem: "เสียงเดินทางผ่านสิ่งใดได้ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "อากาศ", correct: true }
      - { id: b, text: "น้ำ", correct: true }
      - { id: c, text: "โต๊ะไม้", correct: true }
      - { id: d, text: "อวกาศที่ไม่มีอากาศ", feedback: "ในอวกาศไม่มีตัวกลาง ไม่มีอะไรให้สั่นส่งต่อ เสียงจึงเดินทางไม่ได้" }
    hints:
      - "เสียงต้องมีตัวกลาง ตัวกลางเป็นแก๊ส ของเหลว หรือของแข็งก็ได้"
      - "แนบหูกับโต๊ะแล้วให้เพื่อนเคาะ ได้ยินหรือไม่"
    solution: "เสียงเดินทางผ่านอากาศ น้ำ และของแข็งได้ แต่เดินทางในอวกาศที่ไม่มีอากาศไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.sound-intro.p004
    topics: [physics.waves.sound-intro]
    difficulty: 2
    type: mcq
    stem: "นักเรียนกดไม้บรรทัดสองอันที่ยาวเท่ากันไว้ที่ขอบโต๊ะตามภาพ แล้วดีดปลายด้วยแรงเท่ากัน ไม้บรรทัดอันใดให้เสียงสูงกว่า"
    figure: { src: ruler-overhang.svg, alt: "ไม้บรรทัดสองอันยาวเท่ากัน วางบนโต๊ะและมีมือกดไว้ใกล้ขอบโต๊ะ ไม้บรรทัด ก ยื่นออกจากขอบโต๊ะยาว ไม้บรรทัด ข ยื่นออกจากขอบโต๊ะสั้นกว่า ก ประมาณครึ่งหนึ่ง" }
    choices:
      - { id: a, text: "ไม้บรรทัด ข ที่ยื่นสั้นกว่า", correct: true }
      - { id: b, text: "ไม้บรรทัด ก ที่ยื่นยาวกว่า", feedback: "ส่วนที่ยื่นยาวสั่นช้ากว่า เสียงจึงต่ำกว่า ลองนึกถึงลูกระนาด ลูกยาวเสียงต่ำ" }
      - { id: c, text: "สูงเท่ากัน เพราะดีดแรงเท่ากัน", feedback: "ความแรงที่ดีดมีผลต่อความดัง ส่วนความสูงต่ำของเสียงขึ้นกับความยาวที่สั่น" }
    hints:
      - "ส่วนที่ยื่นสั้นสั่นเร็วหรือช้ากว่า"
      - "สั่นเร็วให้เสียงสูง"
    solution: "ส่วนที่ยื่นสั้นสั่นเร็วกว่า ไม้บรรทัด ข จึงให้เสียงสูงกว่า ส่วนไม้บรรทัด ก ยื่นยาว สั่นช้า เสียงต่ำกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.sound-intro.p005
    topics: [physics.waves.sound-intro]
    difficulty: 2
    type: text
    stem: "เครื่องวัดระดับเสียงบอกค่าระดับเสียงเป็นหน่วยอะไร (ตอบชื่อหน่วย)"
    accepted: ["เดซิเบล", "dB", "decibel", "เดซิเบล (dB)"]
    misconceptions:
      - { match: "เฮิรตซ์", feedback: "เฮิรตซ์เป็นหน่วยของความถี่ ซึ่งบอกความสูงต่ำของเสียง ระดับเสียงที่บอกความดังใช้อีกหน่วยหนึ่ง" }
      - { match: "นิวตัน", feedback: "นิวตันเป็นหน่วยของแรง ไม่ใช่ระดับเสียง" }
    hints:
      - "หน่วยนี้ย่อว่า dB"
      - "เดซิ..."
    solution: "เดซิเบล (dB) เช่น พูดคุยตามปกติประมาณ 60 dB"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.sound-intro.p006
    topics: [physics.waves.sound-intro]
    difficulty: 2
    type: mcq
    stem: "ตีกลองยาวใบเดิมแรงขึ้นกว่าเดิม เสียงจะเปลี่ยนไปอย่างไร"
    choices:
      - { id: a, text: "ดังขึ้น เพราะหน้ากลองสั่นแรงขึ้น", correct: true }
      - { id: b, text: "สูงขึ้น เพราะหน้ากลองสั่นแรงขึ้น", feedback: "การสั่นแรงขึ้นทำให้เสียงดังขึ้น ส่วนเสียงสูงต่ำขึ้นกับการสั่นเร็วหรือช้า ซึ่งขึ้นกับขนาดและความตึงของหน้ากลอง" }
      - { id: c, text: "ไม่เปลี่ยน เพราะเป็นกลองใบเดิม", feedback: "กลองใบเดิมก็จริง แต่ตีแรงขึ้นทำให้หน้ากลองสั่นแรงขึ้น เสียงจึงเปลี่ยน" }
    hints:
      - "ตีแรงขึ้น หน้ากลองสั่นแรงขึ้นหรือเร็วขึ้น"
      - "ความดังขึ้นกับความแรงของการสั่น"
    solution: "ตีแรงขึ้น หน้ากลองสั่นแรงขึ้น (แอมพลิจูดมากขึ้น) เสียงจึงดังขึ้น แต่ระดับเสียงสูงต่ำเกือบเท่าเดิม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.sound-intro.p007
    topics: [physics.waves.sound-intro]
    difficulty: 2
    type: match
    stem: "จับคู่เสียงกับระดับเสียงโดยประมาณ"
    pairs:
      - { left: "เสียงกระซิบ", right: "30 dB" }
      - { left: "พูดคุยตามปกติ", right: "60 dB" }
      - { left: "ถนนที่รถติด", right: "80 dB" }
      - { left: "ลำโพงในงานคอนเสิร์ต", right: "100 dB" }
    hints:
      - "เสียงยิ่งดัง ตัวเลขเดซิเบลยิ่งมาก"
      - "เรียงเสียงจากค่อยที่สุดไปดังที่สุดก่อน แล้วจับคู่กับตัวเลขจากน้อยไปมาก"
    solution: "กระซิบ 30 dB พูดคุย 60 dB ถนนรถติด 80 dB ลำโพงคอนเสิร์ต 100 dB"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.sound-intro.p008
    topics: [physics.waves.sound-intro]
    difficulty: 3
    type: mcq
    stem: "นักเรียนทำโทรศัพท์ถ้วยกระดาษ เมื่อดึงเชือกให้ตึงจะได้ยินเสียงเพื่อนชัด แต่เมื่อปล่อยเชือกหย่อนแทบไม่ได้ยิน เพราะเหตุใด"
    choices:
      - { id: a, text: "เชือกที่ตึงสั่นส่งต่อเสียงได้ดี เชือกหย่อนส่งการสั่นได้ไม่ดี", correct: true }
      - { id: b, text: "เชือกที่ตึงทำให้อากาศในถ้วยมากขึ้น", feedback: "อากาศในถ้วยเท่าเดิม สิ่งที่ส่งเสียงจากถ้วยหนึ่งไปอีกถ้วยคือเชือก ซึ่งต้องตึงจึงสั่นส่งต่อได้" }
      - { id: c, text: "เสียงเดินทางในของแข็งไม่ได้ ต้องดึงให้ตึงจึงเป็นอากาศ", feedback: "เชือกเป็นของแข็งไม่ว่าตึงหรือหย่อน และเสียงเดินทางในของแข็งได้ดี ปัญหาคือเชือกหย่อนสั่นส่งต่อได้ไม่ดี" }
    hints:
      - "ตัวกลางที่ส่งเสียงระหว่างถ้วยสองใบคืออะไร"
      - "เชือกต้องสั่นต่อกันไปตลอดเส้น เชือกหย่อนสั่นได้ดีหรือไม่"
    solution: "เสียงทำให้ก้นถ้วยสั่น ก้นถ้วยส่งการสั่นให้เชือก เชือกที่ตึงส่งการสั่นต่อไปถึงถ้วยอีกใบได้ดี เชือกหย่อนดูดซับการสั่นไป เสียงจึงไปไม่ถึง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.sound-intro.p009
    topics: [physics.waves.sound-intro]
    difficulty: 3
    type: mcq
    stem: "เป่านกหวีดสำหรับเรียกสุนัขแล้ว สุนัขวิ่งมาหา แต่คนรอบ ๆ ไม่ได้ยินเสียงอะไร เพราะเหตุใด"
    choices:
      - { id: a, text: "นกหวีดให้เสียงความถี่สูงกว่าที่หูคนได้ยิน แต่หูสุนัขได้ยิน", correct: true }
      - { id: b, text: "นกหวีดให้เสียงค่อยมาก คนจึงไม่ได้ยิน", feedback: "ถ้าเสียงค่อย สุนัขที่อยู่ไกลก็ไม่น่าได้ยินเช่นกัน สิ่งที่ต่างคือช่วงความถี่ที่หูคนกับหูสุนัขรับได้" }
      - { id: c, text: "นกหวีดไม่ได้ให้เสียง สุนัขเห็นลมจากนกหวีด", feedback: "สุนัขมาได้แม้มองไม่เห็นคนเป่า เพราะได้ยินเสียง ซึ่งสูงเกินกว่าหูคน" }
    hints:
      - "หูคนได้ยินเสียงความถี่ประมาณ 20 ถึง 20,000 Hz"
      - "สัตว์บางชนิดได้ยินเสียงที่สูงกว่านั้น"
    solution: "นกหวีดสุนัขให้เสียงความถี่สูงกว่า 20,000 Hz (อัลตราซาวด์) ซึ่งหูคนไม่ได้ยิน แต่หูสุนัขได้ยินเสียงสูงได้มากกว่าคน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.sound-intro.p010
    topics: [physics.waves.sound-intro]
    difficulty: 3
    type: numeric
    stem: "เสียงห้าเสียงมีความถี่ 10 Hz, 250 Hz, 3,000 Hz, 18,000 Hz และ 30,000 Hz หูคนทั่วไปได้ยินเสียงกี่เสียง (ตอบเป็นจำนวนเสียง)"
    answer: { value: 3, unit: เสียง }
    hints:
      - "หูคนได้ยินเสียงความถี่ประมาณ 20 Hz ถึง 20,000 Hz"
      - "ตัดเสียงที่ต่ำกว่า 20 Hz และสูงกว่า 20,000 Hz ออก"
    misconceptions:
      - { match: 5, feedback: "เสียงที่ต่ำกว่า 20 Hz และสูงกว่า 20,000 Hz อยู่นอกช่วงที่หูคนได้ยิน" }
      - { match: 4, feedback: "ตรวจอีกครั้ง 10 Hz ต่ำกว่า 20 Hz และ 30,000 Hz สูงกว่า 20,000 Hz ทั้งสองเสียงหูคนไม่ได้ยิน" }
    solution: "อยู่ในช่วง 20–20,000 Hz ได้แก่ 250, 3,000 และ 18,000 Hz รวม 3 เสียง (10 Hz เป็นอินฟราซาวด์ 30,000 Hz เป็นอัลตราซาวด์)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.sound-intro.p011
    topics: [physics.waves.sound-intro]
    difficulty: 3
    type: mcq
    stem: "นักเรียนทดลองว่าความยาวของลูกระนาดมีผลต่อเสียงสูงต่ำหรือไม่ โดยเคาะลูกระนาดที่ยาวต่างกันด้วยไม้ตีอันเดิมและแรงเท่ากัน ข้อใดคือตัวแปรต้น"
    choices:
      - { id: a, text: "ความยาวของลูกระนาด", correct: true }
      - { id: b, text: "ความสูงต่ำของเสียง", feedback: "ความสูงต่ำของเสียงเป็นผลที่เราสังเกต จึงเป็นตัวแปรตาม" }
      - { id: c, text: "แรงที่ใช้เคาะ", feedback: "แรงที่ใช้เคาะต้องเท่ากันทุกครั้ง จึงเป็นตัวแปรควบคุม" }
    hints:
      - "ตัวแปรต้นคือสิ่งที่ผู้ทดลองตั้งใจเปลี่ยน"
      - "การทดลองนี้เปลี่ยนอะไร"
    solution: "ตัวแปรต้นคือความยาวของลูกระนาด (สิ่งที่เปลี่ยน) ตัวแปรตามคือเสียงสูงต่ำ (สิ่งที่สังเกต) ตัวแปรควบคุมคือไม้ตีและแรงเคาะ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.sound-intro.p012
    topics: [physics.waves.sound-intro]
    difficulty: 4
    type: mcq
    stem: "ภาพแสดงคลื่นเสียงสามคลื่นที่วาดด้วยมาตราส่วนเดียวกัน คลื่นใดเป็นเสียงที่ดังที่สุด"
    figure: { src: waves-abc.svg, alt: "คลื่นสามคลื่นเรียงกัน คลื่น ก ยอดคลื่นเตี้ยและยอดห่างกัน คลื่น ข ยอดห่างกันเท่าคลื่น ก แต่ยอดสูงประมาณสองเท่าของ ก คลื่น ค ยอดเตี้ยเท่าคลื่น ก แต่ยอดชิดกันเป็นสองเท่า" }
    choices:
      - { id: a, text: "ข", correct: true }
      - { id: b, text: "ก", feedback: "ยอดคลื่น ก เตี้ยกว่าคลื่น ข ความดังขึ้นกับความสูงของยอดคลื่น (แอมพลิจูด)" }
      - { id: c, text: "ค", feedback: "คลื่น ค ยอดชิดกัน แปลว่าเสียงสูง ไม่ได้แปลว่าดัง ยอดคลื่นของ ค เตี้ยเท่าคลื่น ก" }
    hints:
      - "ความดังดูจากส่วนใดของคลื่น"
      - "หาคลื่นที่ยอดสูงที่สุด"
    solution: "ความดังขึ้นกับแอมพลิจูด (ความสูงของยอดคลื่น) คลื่น ข ยอดสูงที่สุด จึงดังที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.sound-intro.p013
    topics: [physics.waves.sound-intro]
    difficulty: 4
    type: mcq
    stem: "จากภาพคลื่นเสียงสามคลื่นเดิม คลื่นใดเป็นเสียงที่สูงที่สุด"
