    ai_assisted: true

  - id: biology.genetics.chromosomes-dna.p015
    topics: [biology.genetics.chromosomes-dna]
    difficulty: 4
    type: numeric
    stem: "DNA สายคู่ช่วงหนึ่งมี 10 คู่เบส เป็นคู่ A–T 4 คู่ และคู่ C–G 6 คู่ ช่วงนี้มีพันธะไฮโดรเจนระหว่างคู่เบสทั้งหมดกี่พันธะ"
    answer: { value: 26, unit: พันธะ }
    hints:
      - "คู่ A–T มีพันธะไฮโดรเจนกี่พันธะ และคู่ C–G มีกี่พันธะ"
      - "คูณจำนวนคู่ด้วยจำนวนพันธะของแต่ละแบบแล้วรวมกัน"
    misconceptions:
      - { match: 24, feedback: "สลับจำนวนพันธะ คู่ A–T มี 2 พันธะ คู่ C–G มี 3 พันธะ" }
      - { match: 20, feedback: "คิดว่าทุกคู่มี 2 พันธะ แต่คู่ C–G มี 3 พันธะ" }
    solution: "$4 \\times 2 + 6 \\times 3 = 8 + 18 = 26$ พันธะ DNA ที่มีสัดส่วน C–G สูงจึงแยกสายได้ยากกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.chromosomes-dna.p016
    topics: [biology.genetics.chromosomes-dna]
    difficulty: 4
    type: mcq
    stem: "เฮอร์ชีย์และเชสเลี้ยงไวรัสสองชุด ชุดหนึ่งติดฉลากโปรตีนด้วย ³⁵S อีกชุดติดฉลาก DNA ด้วย ³²P ให้ไวรัสเข้าสู่แบคทีเรีย แล้วปั่นแยกเปลือกไวรัสออก พบ ³²P ในแบคทีเรีย แต่ ³⁵S อยู่นอกแบคทีเรีย ข้อสรุปใดสมเหตุสมผลที่สุด"
    choices:
      - { id: a, text: "DNA ของไวรัสเข้าไปในแบคทีเรียและเป็นสารที่ควบคุมการสร้างไวรัสรุ่นใหม่ จึงเป็นสารพันธุกรรม", correct: true }
      - { id: b, text: "โปรตีนเป็นสารพันธุกรรม เพราะเปลือกโปรตีนเกาะอยู่ที่ผิวแบคทีเรีย", feedback: "โปรตีนอยู่นอกแบคทีเรีย จึงไม่ได้เข้าไปควบคุมการสร้างไวรัสรุ่นใหม่" }
      - { id: c, text: "ทั้ง DNA และโปรตีนเป็นสารพันธุกรรมเท่ากัน", feedback: "มีแต่ ³²P ซึ่งอยู่ใน DNA ที่เข้าไปในแบคทีเรีย หลักฐานจึงชี้ที่ DNA" }
    hints:
      - "กำมะถันพบในโปรตีน ฟอสฟอรัสพบใน DNA"
      - "สารใดเข้าไปอยู่ในแบคทีเรียที่ต่อมาสร้างไวรัสรุ่นใหม่"
    solution: "³²P ติดอยู่กับ DNA และเข้าไปในแบคทีเรีย ส่วน ³⁵S ในโปรตีนอยู่ภายนอก แบคทีเรียสร้างไวรัสรุ่นใหม่ตามข้อมูลใน DNA ที่เข้าไป จึงสรุปว่า DNA เป็นสารพันธุกรรม"
