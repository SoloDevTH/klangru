      - "ทอร์กของแรงตึง $= T \\times 2.0 \\times \\sin 30^\\circ$ ต้องเท่ากับผลรวมโมเมนต์ของน้ำหนักคาน (ที่ $1.0\\ \\mathrm{m}$) และน้ำหนักป้าย (ที่ $2.0\\ \\mathrm{m}$)"
