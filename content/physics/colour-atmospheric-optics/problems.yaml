problems:
  - id: physics.light.colour-atmospheric-optics.p001
    topics: [physics.light.colour-atmospheric-optics]
    difficulty: 1
    type: mcq
    stem: "เสื้อสีแดงที่ตากแดดอยู่ดูเป็นสีแดง เพราะเหตุใด"
    choices:
      - { id: a, text: "เสื้อสะท้อนแสงสีแดงเข้าตา และดูดกลืนแสงสีอื่นในแสงแดด", correct: true }
      - { id: b, text: "เสื้อดูดกลืนแสงสีแดง จึงเห็นเป็นสีแดง", feedback: "สีที่ถูกดูดกลืนไม่มาถึงตา สีที่เราเห็นคือสีที่วัตถุสะท้อนออกมา" }
      - { id: c, text: "เสื้อสร้างแสงสีแดงขึ้นมาเอง", feedback: "เสื้อไม่ใช่แหล่งกำเนิดแสง ในห้องมืดเราจึงมองไม่เห็นสีเสื้อ" }
    hints:
      - "แสงแดดเป็นแสงขาวที่มีหลายสีรวมกัน"
      - "สีที่มาถึงตาคือสีที่วัตถุสะท้อนหรือดูดกลืน"
    solution: "แสงแดดมีทุกสี เสื้อสีแดงสะท้อนแสงสีแดงและดูดกลืนสีอื่น แสงที่มาถึงตาจึงเป็นสีแดง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.colour-atmospheric-optics.p002
    topics: [physics.light.colour-atmospheric-optics]
    difficulty: 2
    type: match
    stem: "จับคู่แสงสีที่ฉายซ้อนกันบนฉากขาวกับสีที่เห็น"
    pairs:
      - { left: "แดง + เขียว", right: "เหลือง" }
      - { left: "เขียว + น้ำเงิน", right: "ฟ้าอมเขียว (ไซแอน)" }
      - { left: "แดง + น้ำเงิน", right: "ม่วงแดง (มาเจนตา)" }
      - { left: "แดง + เขียว + น้ำเงิน", right: "ขาว" }
    hints:
      - "การผสมแสงสีคือการบวกแสง ยิ่งผสมยิ่งสว่าง"
      - "แม่สีของแสงสามสีรวมกันได้แสงขาว"
    solution: "แดง + เขียว = เหลือง เขียว + น้ำเงิน = ฟ้าอมเขียว แดง + น้ำเงิน = ม่วงแดง ทั้งสามสีรวมกัน = ขาว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.colour-atmospheric-optics.p003
    topics: [physics.light.colour-atmospheric-optics]
    difficulty: 2
    type: mcq
    stem: "ในห้องที่มีแต่แสงสีแดงล้วนส่องอยู่ ใบตองสีเขียวจะดูเป็นสีอะไร"
    choices:
      - { id: a, text: "ดำ", correct: true }
      - { id: b, text: "เขียว", feedback: "ใบตองสะท้อนแสงสีเขียว แต่ในห้องไม่มีแสงสีเขียวให้สะท้อนเลย" }
      - { id: c, text: "เหลือง", feedback: "เหลืองเกิดจากแสงแดงรวมกับแสงเขียว แต่ใบตองไม่ได้สะท้อนแสงสีแดง และไม่มีแสงสีเขียวในห้อง" }
      - { id: d, text: "แดง", feedback: "ใบตองสีเขียวดูดกลืนแสงสีแดงเกือบหมด จึงสะท้อนแสงแดงกลับมาน้อยมาก" }
    hints:
      - "ใบตองสีเขียวสะท้อนแสงสีใด และดูดกลืนแสงสีใด"
      - "ในห้องนี้มีแสงสีใดให้สะท้อนบ้าง"
    solution: "ใบตองสีเขียวสะท้อนแสงสีเขียวและดูดกลืนแสงสีแดง ในห้องมีแต่แสงสีแดง ใบตองจึงดูดกลืนเกือบหมด ไม่มีแสงสะท้อนเข้าตา เห็นเป็นสีดำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.colour-atmospheric-optics.p004
    topics: [physics.light.colour-atmospheric-optics]
    difficulty: 2
    type: mcq
    stem: "ทำไมท้องฟ้าตอนกลางวันจึงเป็นสีฟ้า"
    choices:
      - { id: a, text: "โมเลกุลของอากาศกระเจิงแสงสีน้ำเงินได้มากกว่าแสงสีแดง แสงสีน้ำเงินจึงมาจากทุกทิศของท้องฟ้า", correct: true }
      - { id: b, text: "ท้องฟ้าสะท้อนสีน้ำทะเล", feedback: "กลางทะเลทรายหรือบนภูเขาท้องฟ้าก็เป็นสีฟ้า สีฟ้ามาจากการกระเจิงของแสงโดยอากาศ ไม่ใช่การสะท้อนสีทะเล" }
      - { id: c, text: "แสงอาทิตย์เป็นสีฟ้า", feedback: "แสงอาทิตย์เป็นแสงขาวที่มีทุกสี ดวงอาทิตย์ตอนเที่ยงจึงดูขาวอมเหลือง" }
    hints:
      - "อากาศทำอะไรกับแสงแต่ละสีต่างกัน"
      - "แสงความยาวคลื่นสั้นถูกกระเจิงมากกว่าแสงความยาวคลื่นยาว"
    solution: "โมเลกุลของอากาศกระเจิงแสงความยาวคลื่นสั้น (สีน้ำเงิน) มากกว่าแสงความยาวคลื่นยาว (สีแดง) หลายเท่า แสงสีน้ำเงินที่กระเจิงมาถึงตาจากทุกทิศ ท้องฟ้าจึงเป็นสีฟ้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.colour-atmospheric-optics.p005
    topics: [physics.light.colour-atmospheric-optics]
    difficulty: 2
    type: text
    stem: "ปรากฏการณ์ที่เห็นวงแสงกลมรอบดวงอาทิตย์หรือดวงจันทร์ เกิดจากแสงหักเหผ่านผลึกน้ำแข็งในเมฆชั้นสูง คนไทยเรียกว่าอะไร"
    accepted: ["การทรงกลด", "ทรงกลด", "พระอาทิตย์ทรงกลด", "halo", "ฮาโล"]
    misconceptions:
      - { match: "รุ้ง", feedback: "รุ้งเกิดจากหยดน้ำฝนและต้องหันหลังให้ดวงอาทิตย์ แต่วงแสงนี้ล้อมรอบดวงอาทิตย์และเกิดจากผลึกน้ำแข็ง" }
      - { match: "มิราจ", feedback: "มิราจเกิดจากอากาศร้อนใกล้พื้น ทำให้เห็นภาพท้องฟ้าบนถนน ไม่ใช่วงแสงรอบดวงอาทิตย์" }
    hints:
      - "ข่าวมักเรียกว่า พระอาทิตย์...กลด"
      - "ชื่อปรากฏการณ์มีคำว่า กลด"
    solution: "การทรงกลด แสงหักเหผ่านผลึกน้ำแข็งรูปหกเหลี่ยมในเมฆชั้นสูง เบนไปประมาณ 22 องศา จึงเห็นวงแสงรอบดวงอาทิตย์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.colour-atmospheric-optics.p006
    topics: [physics.light.colour-atmospheric-optics]
    difficulty: 3
    type: mcq
    stem: "ตอนห้าโมงเย็นหลังฝนตก ดวงอาทิตย์อยู่ทางทิศตะวันตก ถ้าอยากเห็นรุ้ง ควรหันหน้าไปทางใด"
    choices:
      - { id: a, text: "ทิศตะวันออก (หันหลังให้ดวงอาทิตย์)", correct: true }
      - { id: b, text: "ทิศตะวันตก (หันหน้าเข้าหาดวงอาทิตย์)", feedback: "แสงในรุ้งสะท้อนกลับจากด้านหลังหยดน้ำ ออกมาทางเดียวกับที่แสงเข้า ต้องหันหลังให้ดวงอาทิตย์" }
      - { id: c, text: "ทิศใดก็ได้ เพราะรุ้งเกิดทั่วท้องฟ้า", feedback: "รุ้งเป็นวงกลมรอบจุดตรงข้ามดวงอาทิตย์เท่านั้น ที่มุมประมาณ 42 องศาจากจุดนั้น" }
    hints:
      - "แสงในรุ้งสะท้อนในหยดน้ำแล้วย้อนกลับมาทางไหน"
      - "รุ้งอยู่รอบจุดที่เงาศีรษะของเราชี้ไป"
    solution: "แสงเข้าหยดน้ำ สะท้อนที่ผิวด้านหลัง แล้วย้อนออกมาทางด้านที่แสงเข้า รุ้งจึงอยู่ฝั่งตรงข้ามดวงอาทิตย์ ตอนเย็นดวงอาทิตย์อยู่ทางตะวันตก รุ้งจึงอยู่ทางตะวันออก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.colour-atmospheric-optics.p007
    topics: [physics.light.colour-atmospheric-optics]
    difficulty: 3
    type: mcq
    stem: "นักเรียนผสมสีน้ำสีฟ้าอมเขียว (ไซแอน) กับสีเหลืองในจานสี จะได้สีใด"
    choices:
      - { id: a, text: "เขียว", correct: true }
      - { id: b, text: "ขาว", feedback: "ขาวเกิดจากการบวกแสงสี การผสมสารสียิ่งผสมยิ่งดูดกลืนแสงมากขึ้น จึงไม่มีทางได้ขาว" }
      - { id: c, text: "ม่วงแดง", feedback: "ไซแอนดูดกลืนสีแดง เหลืองดูดกลืนสีน้ำเงิน แสงที่เหลือจึงไม่มีทั้งแดงและน้ำเงิน ม่วงแดงต้องมีทั้งสองสี" }
      - { id: d, text: "ฟ้าอ่อน", feedback: "สีเหลืองดูดกลืนแสงสีน้ำเงินออกไป สีที่ได้จึงไม่เหลือส่วนสีน้ำเงิน" }
    hints:
      - "สารสีฟ้าอมเขียวดูดกลืนแสงสีใด สารสีเหลืองดูดกลืนแสงสีใด"
      - "เหลือแสงสีใดที่ทั้งสองไม่ดูดกลืน"
    solution: "สารสีไซแอนดูดกลืนแสงสีแดง สะท้อนเขียวและน้ำเงิน สารสีเหลืองดูดกลืนแสงสีน้ำเงิน สะท้อนแดงและเขียว ผสมกันจึงเหลือแต่แสงสีเขียวที่ทั้งคู่สะท้อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.colour-atmospheric-optics.p008
    topics: [physics.light.colour-atmospheric-optics]
    difficulty: 3
    type: mcq
    stem: "ส่องไฟฉายแสงขาวผ่านแผ่นกรองแสงสีแดง แล้วผ่านแผ่นกรองแสงสีเขียวอีกแผ่นหนึ่ง บนฉากจะเห็นอะไร"
    choices:
      - { id: a, text: "มืด เพราะแผ่นกรองสีเขียวดูดกลืนแสงสีแดงที่ผ่านมา", correct: true }
      - { id: b, text: "แสงสีเหลือง เพราะแดงรวมกับเขียวเป็นเหลือง", feedback: "แดงรวมกับเขียวเป็นเหลืองเมื่อฉายแสงสองดวงซ้อนกัน แต่แผ่นกรองซ้อนกันทำให้แสงต้องผ่านทั้งสองแผ่น ซึ่งไม่มีสีใดผ่านได้" }
      - { id: c, text: "แสงสีแดง เพราะผ่านแผ่นสีแดงก่อน", feedback: "แสงสีแดงที่ผ่านแผ่นแรกจะถูกแผ่นกรองสีเขียวดูดกลืน" }
    hints:
      - "แผ่นกรองสีแดงให้สีใดผ่าน"
      - "แสงที่เหลือผ่านแผ่นกรองสีเขียวได้หรือไม่"
    solution: "แผ่นกรองสีแดงให้แต่แสงสีแดงผ่าน แผ่นกรองสีเขียวให้แต่แสงสีเขียวผ่าน แสงสีแดงจึงถูกแผ่นที่สองดูดกลืนหมด ฉากมืด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.colour-atmospheric-optics.p009
    topics: [physics.light.colour-atmospheric-optics]
    difficulty: 3
    type: numeric
    stem: "ปริมาณการกระเจิงของแสงโดยโมเลกุลอากาศแปรผกผันกับ $\\lambda^4$ แสงสีน้ำเงินความยาวคลื่น $450\\ \\mathrm{nm}$ ถูกกระเจิงมากกว่าแสงสีแดงความยาวคลื่น $700\\ \\mathrm{nm}$ กี่เท่า (ตอบเป็นจำนวนเท่า ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 5.86, tolerance: 0.06, unit: เท่า }
    hints:
      - "อัตราส่วนการกระเจิง $= \\left(\\dfrac{\\lambda_\\text{แดง}}{\\lambda_\\text{น้ำเงิน}}\\right)^4$"
      - "หา $\\dfrac{700}{450}$ ก่อน แล้วยกกำลังสี่"
    misconceptions:
      - { match: 1.56, feedback: "นั่นคือ $\\dfrac{700}{450}$ ยังไม่ได้ยกกำลังสี่" }
      - { match: 2.42, feedback: "ดูเหมือนยกกำลังสอง การกระเจิงแบบนี้แปรผกผันกับ $\\lambda^4$" }
      - { match: 0.17, feedback: "ดูเหมือนกลับเศษส่วน แสงที่ความยาวคลื่นสั้นกว่าถูกกระเจิงมากกว่า อัตราส่วนต้องมากกว่า 1" }
    solution: "$\\left(\\dfrac{700}{450}\\right)^4 = (1.556)^4 \\approx 5.86$ เท่า แสงสีน้ำเงินจึงกระเจิงไปทั่วท้องฟ้ามากกว่าแสงสีแดงมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.colour-atmospheric-optics.p010
    topics: [physics.light.colour-atmospheric-optics]
    difficulty: 3
    type: mcq
    stem: "ขับรถบนถนนมิตรภาพตอนเที่ยงวันในเดือนเมษายน เห็นข้างหน้าไกล ๆ เหมือนมีน้ำขังบนถนน แต่ขับไปถึงกลับแห้ง ภาพนั้นเกิดจากอะไร"
    choices:
      - { id: a, text: "แสงจากท้องฟ้าหักเหโค้งขึ้นในอากาศร้อนใกล้ผิวถนน เราจึงเห็นภาพท้องฟ้าบนถนน", correct: true }
      - { id: b, text: "ไอน้ำระเหยจากถนนมาเกาะเป็นแอ่งน้ำบาง ๆ", feedback: "ถ้ามีน้ำจริงเมื่อไปถึงต้องเปียก ภาพนี้เกิดจากการหักเหของแสงในอากาศที่ร้อนไม่เท่ากัน" }
      - { id: c, text: "ผิวถนนสะท้อนแสงเหมือนกระจกเงาเพราะยางมะตอยละลาย", feedback: "ผิวถนนไม่ได้เรียบเหมือนกระจก แสงโค้งขึ้นก่อนถึงผิวถนนเพราะอากาศใกล้ถนนร้อนกว่า" }
    hints:
      - "อากาศใกล้ผิวถนนร้อนกว่าอากาศด้านบน ดรรชนีหักเหต่างกันอย่างไร"
      - "สิ่งที่เหมือนน้ำนั้นมีสีเหมือนอะไร"
    solution: "อากาศใกล้ผิวถนนร้อน ดรรชนีหักเหน้อยกว่าอากาศด้านบน แสงจากท้องฟ้าที่ส่องลงเฉียง ๆ จึงหักเหโค้งขึ้นเข้าตา สมองคิดว่าแสงมาจากพื้นถนน จึงเห็นภาพท้องฟ้าเหมือนแอ่งน้ำ เรียกว่ามิราจ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.colour-atmospheric-optics.p011
    topics: [physics.light.colour-atmospheric-optics]
    difficulty: 4
    type: mcq
    stem: "ข้อใดอธิบายสาเหตุของตาบอดสีชนิดแยกสีแดงกับสีเขียวไม่ได้ได้ถูกต้อง"
    choices:
      - { id: a, text: "เซลล์รูปกรวยที่ไวต่อแสงสีแดงหรือสีเขียวขาดไปหรือทำงานผิดปกติ ส่วนใหญ่ถ่ายทอดทางพันธุกรรมผ่านโครโมโซม X", correct: true }
      - { id: b, text: "เลนส์ตาขุ่นจนแสงสีแดงและเขียวผ่านไม่ได้", feedback: "เลนส์ตาขุ่นคือต้อกระจก ทำให้มองมัวทุกสี ตาบอดสีเกิดที่เซลล์รับแสงสีในจอตา" }
      - { id: c, text: "เซลล์รูปแท่งทำงานมากเกินไป", feedback: "เซลล์รูปแท่งใช้มองในที่มืดและแยกสีไม่ได้อยู่แล้ว การแยกสีขึ้นกับเซลล์รูปกรวยสามชนิด" }
      - { id: d, text: "เกิดจากการดูจอโทรศัพท์นานเกินไป", feedback: "ตาบอดสีส่วนใหญ่เป็นตั้งแต่เกิดเพราะพันธุกรรม ไม่ได้เกิดจากการดูจอ" }
    hints:
      - "ตาแยกสีด้วยเซลล์ชนิดใด"
