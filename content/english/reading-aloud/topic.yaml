id: english.phonics.reading-aloud
subject: english
title: { th: "การอ่านออกเสียง การเน้นเสียง และทำนองเสียง", en: "Reading aloud: stress, rhythm and intonation" }
summary: นับพยางค์ หาพยางค์ที่เน้น เน้นคำเนื้อหาในประโยค อ่าน chant และกลอนตามจังหวะ ขึ้นลงเสียงตามชนิดประโยค เชื่อมเสียง และเทียบเสียงอังกฤษกับไทย
difficulty: 2.5
minutes: 35
prerequisites: [english.phonics.alphabet-sounds]
encompasses:
  - { id: english.phonics.alphabet-sounds, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: stress-intonation.svg
    alt: "ภาพสามส่วน ส่วนที่ 1 เน้นเสียงในคำ มีวงกลมใหญ่เหนือพยางค์ที่เน้นและวงกลมเล็กเหนือพยางค์ไม่เน้น TEA-cher (ใหญ่ เล็ก) ba-NA-na (เล็ก ใหญ่ เล็ก) HOS-pi-tal (ใหญ่ เล็ก เล็ก) ho-TEL (เล็ก ใหญ่) ส่วนที่ 2 ทำนองเสียง เส้นเหนือประโยค Where do you live? ระดับคงที่แล้วลงที่ท้ายประโยค เป็นเสียงลงของคำถาม Wh- บอกเล่า และคำสั่ง เส้นเหนือประโยค Do you like mangoes? ขึ้นที่ท้ายประโยค เป็นเสียงขึ้นของคำถาม Yes/No ส่วนที่ 3 เชื่อมเสียง มีเส้นโค้งเชื่อม turn กับ off (เทิร์-นอฟ) an กับ apple (อะ-แนพ-เพิล) get กับ up (เก-ทัพ)"
    caption: "ภาษาอังกฤษไม่มีวรรณยุกต์ แต่ใช้การเน้นเสียงและทำนองเสียงบอกความหมาย"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.phonics.reading-aloud.p001, prompt: "นับเสียงสระ ไม่ใช่นับตัวอักษร" }
  - type: figure
    src: chant-beats.svg
    alt: "บรรทัด One, two, buckle my shoe มีวงกลมใหญ่สีน้ำเงินเหนือ ONE, TWO, BUCK และ SHOE และวงกลมเล็กเหนือ le และ my หมายความว่าปรบมือ 4 ครั้งที่พยางค์ที่เน้น"
    caption: "ปรบมือที่พยางค์ที่เน้น คำเบาระหว่างกลางอ่านเร็วขึ้นให้ทันจังหวะ"
  - type: worked-example
    title: อ่านกลอนสั้นตามจังหวะ
    problem: "เตรียมอ่านกลอนนี้ออกเสียง: *Rain on the roof, / rain on the tree, / rain on the river / and rain on me.*"
    steps:
      - text: "หาคำเนื้อหาในแต่ละบรรทัด: rain, roof / rain, tree / rain, river / rain, me"
        why: "on, the, and เป็นคำไวยากรณ์ อ่านเบา"
      - text: "ทำเครื่องหมายจังหวะ บรรทัดละ 2 ครั้ง: *RAIN on the ROOF, RAIN on the TREE, RAIN on the RIV-er, and RAIN on ME.*"
        why: "river มี 2 พยางค์ เน้นพยางค์แรก RIV-er"
      - text: "หาคำที่สัมผัสกัน: tree กับ me (เสียง อี) อ่านให้ชัด"
      - text: "หยุดสั้นที่จุลภาค และลงเสียงที่ me ↘ เพราะเป็นท้ายข้อความบอกเล่า"
    answer: "*RAIN on the ROOF, | RAIN on the TREE, | RAIN on the RIV-er | and RAIN on ME.↘*"
  - { type: check, problem: english.phonics.reading-aloud.p009, prompt: "คำถามนี้ขึ้นต้นด้วยคำแสดงคำถามหรือไม่" }
  - type: worked-example
    title: อ่านโฆษณาสั้น
    problem: "อ่านโฆษณานี้ออกเสียง: *Fresh coconut ice cream! Only twenty baht. Open every day at Chatuchak Market.*"
    steps:
      - text: "แบ่งกลุ่มคำและหยุดที่เครื่องหมาย: *Fresh coconut ice cream! | Only twenty baht. | Open every day | at Chatuchak Market.*"
      - text: "เน้นข้อมูลที่ผู้ฟังต้องรู้ คือ ขายอะไร ราคาเท่าไร ที่ไหน: ***FRESH COCOnut ICE cream***, ***TWENty BAHT***, ***CHAtuchak MARket***"
        why: "twenty ลงท้าย -ty เน้นพยางค์แรก ผู้ฟังจะไม่สับสนกับ thirteen หรือ fifteen"
      - text: "อ่าน *Open every day* ให้เชื่อมเสียง: *o-pen‿ev-ery day*"
      - text: "ลงเสียงท้ายทุกประโยค ↘ และอ่านประโยคแรกที่มีเครื่องหมาย ! ให้กระตือรือร้น"
    answer: "*FRESH COCOnut ICE cream!↘ | ONly TWENty BAHT.↘ | Open‿EVery DAY | at CHAtuchak MARket.↘*"
glossary:
  - { term: syllable (พยางค์), definition: "หน่วยเสียงที่มีเสียงสระหนึ่งเสียง เช่น ba-na-na มี 3 พยางค์" }
  - { term: stress (การเน้นเสียง), definition: "การอ่านพยางค์หรือคำให้ดังกว่า ยาวกว่า และสูงกว่าส่วนอื่น" }
  - { term: intonation (ทำนองเสียง), definition: "การขึ้นลงของระดับเสียงทั้งประโยค บอกชนิดประโยคและความรู้สึก" }
  - { term: linking (การเชื่อมเสียง), definition: "การอ่านพยัญชนะท้ายคำต่อกับสระต้นคำถัดไปโดยไม่หยุด เช่น turn‿off" }
  - { term: chant, definition: "บทพูดเข้าจังหวะ มีจังหวะเน้นสม่ำเสมอ ใช้ฝึกจังหวะของภาษา" }
  - { term: content word / function word, definition: "คำเนื้อหา (นาม กริยาหลัก คุณศัพท์) อ่านเน้น คำไวยากรณ์ (a, the, to, and) อ่านเบา" }
flashcards:
