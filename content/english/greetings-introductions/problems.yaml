problems:
  - id: english.speaking.greetings-introductions.p001
    topics: [english.speaking.greetings-introductions]
    difficulty: 1
    type: mcq
    stem: "เวลา 8 โมงเช้า ต้นเดินเข้าโรงเรียนและพบครูต่างชาติ ต้นควรทักว่าอะไร"
    choices:
      - { id: a, text: "Good morning.", correct: true, feedback: "ถูก ตอนเช้าถึงเที่ยงใช้ Good morning" }
      - { id: b, text: "Good night.", feedback: "Good night ใช้ตอนลาตอนกลางคืนหรือก่อนนอน ไม่ใช้ทักทาย" }
      - { id: c, text: "Good evening.", feedback: "Good evening ใช้ตอนเย็นและกลางคืน" }
      - { id: d, text: "Goodbye.", feedback: "Goodbye ใช้ตอนลา ไม่ใช่ตอนพบกัน" }
    hints:
      - "8 โมงเช้าอยู่ในช่วงเวลาไหนของวัน"
      - "morning = ตอนเช้า afternoon = ตอนบ่าย evening = ตอนเย็น"
    solution: "8 โมงเช้าเป็นช่วงเช้า ทักว่า **Good morning.** (Hello ก็ใช้ได้ทุกเวลา)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.greetings-introductions.p002
    topics: [english.speaking.greetings-introductions]
    difficulty: 1
    type: text
    stem: "เติมคำตอบรับคำขอบคุณ: *Thank you.* — *You're ___.*"
    accepted: ["welcome", "Welcome", "welcome."]
    misconceptions:
      - { match: "well come", feedback: "welcome เขียนติดกันเป็นคำเดียว มี l ตัวเดียว" }
      - { match: "wellcome", feedback: "welcome มี l ตัวเดียว: w-e-l-c-o-m-e" }
      - { match: "welcom", feedback: "อย่าลืม e ท้ายคำ: welcome" }
    hints:
      - "คำตอบแปลว่า ด้วยความยินดี"
      - "คำนี้ใช้ต้อนรับคนมาเยือนด้วย เช่น ... to Thailand"
    solution: "*Thank you.* — *You're **welcome**.* (ด้วยความยินดี)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.greetings-introductions.p003
    topics: [english.speaking.greetings-introductions]
    difficulty: 1
    type: match
    stem: "จับคู่ประโยคกับคำตอบที่เหมาะสม"
    pairs:
      - { left: "How are you?", right: "I'm fine, thank you." }
      - { left: "What's your name?", right: "My name is Nok." }
      - { left: "Nice to meet you.", right: "Nice to meet you, too." }
      - { left: "Thank you.", right: "You're welcome." }
      - { left: "I'm sorry.", right: "That's OK." }
    hints:
      - "คำถาม How are you? ถามว่าสบายดีไหม"
      - "ขอบคุณคู่กับ You're welcome ขอโทษคู่กับ That's OK"
    solution: "How are you? → I'm fine, thank you. · What's your name? → My name is Nok. · Nice to meet you. → Nice to meet you, too. · Thank you. → You're welcome. · I'm sorry. → That's OK."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.greetings-introductions.p004
    topics: [english.speaking.greetings-introductions]
    difficulty: 1
    type: mcq
    stem: "ตามวัฒนธรรมของเจ้าของภาษาอังกฤษ เช่น ในอังกฤษหรือสหรัฐอเมริกา คนที่พบกันครั้งแรกมักทำท่าอะไร"
    choices:
      - { id: a, text: "จับมือ ยิ้ม และสบตา", correct: true, feedback: "ถูก การจับมือพร้อมสบตาแสดงความเป็นมิตรและจริงใจ" }
      - { id: b, text: "ไหว้", feedback: "การไหว้เป็นวัฒนธรรมไทย เจ้าของภาษาอังกฤษมักจับมือ" }
      - { id: c, text: "โค้งตัวลึก ๆ", feedback: "การโค้งตัวลึกเป็นธรรมเนียมของบางประเทศ เช่น ญี่ปุ่น" }
      - { id: d, text: "ก้มหน้าไม่มองตา", feedback: "เจ้าของภาษาอังกฤษถือว่าการสบตาเป็นมารยาทที่ดี การไม่มองตาอาจดูเหมือนไม่สนใจ" }
    hints:
      - "เป็นท่าทางที่ใช้มือ"
      - "ทำพร้อมกับพูดว่า Nice to meet you."
    solution: "เจ้าของภาษาอังกฤษพบกันครั้งแรกมัก **จับมือ ยิ้ม และสบตา**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.greetings-introductions.p005
    topics: [english.speaking.greetings-introductions]
    difficulty: 2
    type: text
    stem: "เติมคำตอบ: *What's your name?* — *My ___ is Ploy.*"
    accepted: ["name"]
    misconceptions:
      - { match: "names", feedback: "ชื่อของเราหนึ่งชื่อ ใช้ name ไม่เติม s" }
      - { match: "is", feedback: "ประโยคมี is อยู่แล้ว ช่องว่างต้องเป็นคำนามที่ตามหลัง my" }
    hints:
      - "คำถามถามเรื่องอะไร"
      - "ใช้คำเดียวกับในคำถาม"
    solution: "*My **name** is Ploy.* (หรือตอบสั้น ๆ ว่า I'm Ploy.)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.greetings-introductions.p006
    topics: [english.speaking.greetings-introductions]
    difficulty: 2
    type: order
    stem: "สมชายพบแอนนาครั้งแรก เรียงบทสนทนาให้ถูกลำดับ"
    items:
      - "Somchai: Hello! I'm Somchai."
      - "Anna: Hi, Somchai. I'm Anna."
      - "Somchai: Nice to meet you, Anna."
      - "Anna: Nice to meet you, too."
    hints:
      - "บทสนทนาเริ่มด้วยการทักทายและบอกชื่อ"
      - "Nice to meet you, too. ต้องมาหลัง Nice to meet you."
    solution: "ทักทายและบอกชื่อ → ทักกลับและบอกชื่อ → Nice to meet you. → Nice to meet you, too."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.greetings-introductions.p007
    topics: [english.speaking.greetings-introductions]
    difficulty: 2
    type: mcq
    stem: "ครูถามว่า *How old are you?* นักเรียนอายุ 8 ขวบ ควรตอบว่าอะไร"
    choices:
      - { id: a, text: "I'm eight years old.", correct: true, feedback: "ถูก บอกอายุด้วย am" }
      - { id: b, text: "I have eight years.", feedback: "ภาษาอังกฤษไม่บอกอายุด้วย have ใช้ I'm eight (years old)." }
      - { id: c, text: "I'm eight year old.", feedback: "อายุมากกว่าหนึ่งปีต้องใช้ years มี s" }
      - { id: d, text: "My old is eight.", feedback: "old เป็นคำคุณศัพท์ ไม่ใช้เป็นคำนามแบบนี้ ตอบว่า I'm eight." }
    hints:
      - "คำถามใช้ are you คำตอบจึงใช้ I am"
      - "รูปที่ถูกคือ I'm + ตัวเลข + years old"
    solution: "**I'm eight years old.** หรือสั้น ๆ ว่า I'm eight."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.greetings-introductions.p008
    topics: [english.speaking.greetings-introductions]
    difficulty: 2
    type: text
    stem: "นักท่องเที่ยวถามว่า *Where are you from?* เติมคำตอบ: *I'm ___ Chiang Rai.*"
    accepted: ["from"]
    misconceptions:
      - { match: "in", feedback: "I'm in Chiang Rai. แปลว่า ตอนนี้อยู่ที่เชียงราย ส่วนคำถามถามว่ามาจากไหน ใช้ from" }
      - { match: "at", feedback: "คำถามใช้ from คำตอบจึงใช้ from ด้วย" }
    hints:
      - "ดูคำสุดท้ายของคำถาม"
      - "มาจาก = be from"
    solution: "*I'm **from** Chiang Rai.* ตอบด้วยคำว่า from เหมือนในคำถาม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.greetings-introductions.p009
    topics: [english.speaking.greetings-introductions]
    difficulty: 2
    type: mcq
    stem: "บนรถไฟฟ้า แพรวเผลอเหยียบเท้าผู้โดยสารคนหนึ่ง แพรวควรพูดว่าอะไร"
    choices:
      - { id: a, text: "I'm sorry.", correct: true, feedback: "ถูก ทำผิดโดยไม่ตั้งใจให้ขอโทษ" }
      - { id: b, text: "Thank you.", feedback: "Thank you ใช้ขอบคุณเมื่อมีคนช่วย ไม่ใช่ตอนทำผิด" }
      - { id: c, text: "You're welcome.", feedback: "You're welcome ใช้ตอบเมื่อมีคนขอบคุณเรา" }
      - { id: d, text: "Nice to meet you.", feedback: "ใช้ตอนรู้จักกันครั้งแรก ไม่ใช่ตอนขอโทษ" }
    hints:
      - "แพรวทำให้คนอื่นเจ็บโดยไม่ตั้งใจ"
      - "คำขอโทษคือคำว่าอะไร"
    solution: "แพรวทำผิดโดยไม่ตั้งใจ จึงพูดว่า **I'm sorry.** อีกฝ่ายมักตอบ That's OK."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.greetings-introductions.p010
    topics: [english.speaking.greetings-introductions]
    difficulty: 3
    type: mcq
    stem: "4 โมงเย็นเลิกเรียน นักเรียนกำลังกลับบ้าน ควรบอกลาครูว่าอะไร"
    choices:
      - { id: a, text: "Goodbye, teacher. See you tomorrow.", correct: true, feedback: "ถูก Goodbye และ See you tomorrow ใช้บอกลา" }
      - { id: b, text: "Good night, teacher.", feedback: "Good night ใช้ลาตอนกลางคืนหรือก่อนนอน 4 โมงเย็นยังไม่ใช่กลางคืน" }
      - { id: c, text: "Hello, teacher.", feedback: "Hello ใช้ทักตอนพบกัน ไม่ใช่ตอนลา" }
      - { id: d, text: "Nice to meet you, teacher.", feedback: "ใช้ตอนรู้จักกันครั้งแรก นักเรียนรู้จักครูอยู่แล้ว" }
    hints:
      - "ตอนนี้เป็นการลา ไม่ใช่การทักทาย"
      - "พรุ่งนี้จะพบครูอีก"
    solution: "บอกลาด้วย **Goodbye, teacher. See you tomorrow.** (see you = แล้วพบกัน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.greetings-introductions.p011
    topics: [english.speaking.greetings-introductions]
    difficulty: 3
    type: text
    stem: "เติมคำถามกลับ: A: *How are you?* B: *I'm fine, thank you. ___ you?* (A ถามว่าสบายดีไหม B ตอบแล้วถามกลับ)"
    accepted: ["And", "and", "How about", "What about"]
    misconceptions:
      - { match: "how", feedback: "How you? ไม่ครบ ถ้าจะถามซ้ำต้องพูดเต็มว่า How are you? คำสั้นที่ใช้ถามกลับคือ And you?" }
      - { match: "are", feedback: "Are you? ไม่ได้ถามกลับว่าสบายดีไหม ใช้ And you?" }
      - { match: "thank", feedback: "ขอบคุณไปแล้ว ช่องนี้เป็นการถามกลับ ใช้ And you?" }
    hints:
      - "เป็นการถามกลับสั้น ๆ ว่า แล้วคุณล่ะ"
      - "ใช้คำเชื่อมที่แปลว่า และ"
    solution: "*I'm fine, thank you. **And** you?* (How about you? หรือ What about you? ก็ได้)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.greetings-introductions.p012
    topics: [english.speaking.greetings-introductions]
    difficulty: 3
    type: mcq
    stem: "เพื่อนชาวอเมริกันทักว่า *Hi! How are you?* ตอนเดินสวนกันหน้าห้องเรียน คำตอบใดเหมาะที่สุด"
    choices:
      - { id: a, text: "Good, thanks. And you?", correct: true, feedback: "ถูก How are you? เป็นส่วนหนึ่งของการทักทาย ตอบสั้น ๆ และถามกลับ" }
      - { id: b, text: "I have a headache, my stomach hurts and I didn't sleep well last night.", feedback: "ตอบยาวเกินไปสำหรับการทักทายตอนเดินสวนกัน ถ้าป่วยจริงค่อยเล่ากับเพื่อนสนิทหรือครู" }
      - { id: c, text: "Yes.", feedback: "How are you? ไม่ใช่คำถาม yes/no ต้องบอกว่าเป็นอย่างไร" }
      - { id: d, text: "I'm thirteen.", feedback: "ตอบอายุ ซึ่งเป็นคำตอบของ How old are you?" }
    hints:
      - "เจ้าของภาษาใช้ How are you? แทนคำทักทาย"
      - "ตอบสั้น ๆ ว่าสบายดี แล้วถามกลับ"
    solution: "**Good, thanks. And you?** ตอบสั้น สุภาพ และถามกลับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.greetings-introductions.p013
    topics: [english.speaking.greetings-introductions]
    difficulty: 4
    type: mcq
    stem: "ครูใหญ่ของโรงเรียนนานาชาติชื่อ John Smith ตอนเช้านักเรียนควรทักท่านว่าอะไร"
    choices:
      - { id: a, text: "Good morning, Mr. Smith.", correct: true, feedback: "ถูก Mr. ใช้นำหน้านามสกุล และเหมาะกับการพูดกับผู้ใหญ่" }
      - { id: b, text: "Good morning, Mr. John.", feedback: "คนไทยมักเรียก ครู + ชื่อต้น แต่ Mr. ต้องตามด้วยนามสกุล: Mr. Smith" }
      - { id: c, text: "Hey, John!", feedback: "เป็นกันเองเกินไปสำหรับนักเรียนพูดกับครูใหญ่" }
      - { id: d, text: "Good night, Mr. Smith.", feedback: "Good night ใช้ตอนลาตอนกลางคืน ไม่ใช่ทักตอนเช้า" }
    hints:
      - "John เป็นชื่อต้น Smith เป็นนามสกุล"
      - "Mr. หรือ Ms. ต้องตามด้วยนามสกุล"
    solution: "**Good morning, Mr. Smith.** ใช้คำทักตามเวลา และ Mr. + นามสกุล ซึ่งสุภาพกับผู้ใหญ่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.greetings-introductions.p014
    topics: [english.speaking.greetings-introductions]
    difficulty: 4
    type: text
    stem: "ดูภาพบทสนทนา เคนพูดว่า *Hi, I'm Ken. Nice to meet you.* ฟ้าควรตอบประโยคใด (พิมพ์ประโยคที่ตอบรับว่า ยินดีที่ได้รู้จักเช่นกัน)"
    figure: { src: reply-quiz.svg, alt: "กรอบข้อความของ Ken เขียนว่า Hi, I'm Ken. Nice to meet you. กรอบข้อความของ Fah มีเพียงเครื่องหมายคำถาม ด้านล่างเป็นภาพตัวการ์ตูนเส้นสองคนชื่อ Ken และ Fah กำลังจับมือกัน" }
    accepted:
      - "Nice to meet you, too."
      - "Nice to meet you, too"
      - "Nice to meet you too."
      - "Nice to meet you too"
      - "Nice to meet you, too!"
      - "Nice to meet you too!"
      - "Nice to meet you, too, Ken."
      - "Nice to meet you too, Ken."
      - "Nice to meet you, too, Ken"
      - "Nice to meet you too, Ken"
      - "Nice to meet you, Ken."
      - "Nice to meet you, Ken"
      - "You too."
      - "You too"
    misconceptions:
      - { match: "Nice to meet you.", feedback: "ความหมายถูก แต่เมื่อเป็นฝ่ายตอบ ควรเติม too ท้ายประโยค: Nice to meet you, too." }
      - { match: "Nice to meet you", feedback: "ความหมายถูก แต่เมื่อเป็นฝ่ายตอบ ควรเติม too ท้ายประโยค: Nice to meet you, too." }
      - { match: "Me too.", feedback: "Me too ใช้ตอบเมื่อเรารู้สึกหรือทำเหมือนอีกคน เช่น I like durian. — Me too. ส่วนคำตอบของ Nice to meet you. คือ Nice to meet you, too." }
      - { match: "Me too", feedback: "Me too ใช้ตอบเมื่อเรารู้สึกหรือทำเหมือนอีกคน เช่น I like durian. — Me too. ส่วนคำตอบของ Nice to meet you. คือ Nice to meet you, too." }
      - { match: "You're welcome.", feedback: "You're welcome ใช้ตอบคำขอบคุณ ไม่ใช่ตอบ Nice to meet you." }
    hints:
      - "ฟ้าตอบด้วยประโยคเดียวกับเคน"
      - "เติมคำที่แปลว่า เช่นกัน ไว้ท้ายประโยค"
    solution: "ฟ้าตอบว่า ***Nice to meet you, too.*** (ยินดีที่ได้รู้จักเช่นกัน) เจ้าของภาษาอาจตอบสั้น ๆ ว่า You too. ก็ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.speaking.greetings-introductions.p015
    topics: [english.speaking.greetings-introductions]
    difficulty: 4
    type: mcq
    stem: "บีมพาเพื่อนชื่อนุ่นมาแนะนำให้ครูต่างชาติรู้จัก บีมควรพูดว่าอะไร"
    choices:
      - { id: a, text: "This is my friend, Noon.", correct: true, feedback: "ถูก แนะนำคนอื่นใช้ This is ..." }
      - { id: b, text: "He is my friend name Noon.", feedback: "นุ่นเป็นผู้หญิงใช้ she และไม่ต้องมี name แนะนำด้วย This is my friend, Noon." }
      - { id: c, text: "I'm Noon.", feedback: "I'm ใช้แนะนำตัวเอง แต่บีมกำลังแนะนำเพื่อน" }
      - { id: d, text: "My friend is name Noon.", feedback: "ไม่ใช้ is name ถ้าจะบอกชื่อเพื่อนพูดว่า My friend's name is Noon. หรือ This is my friend, Noon." }
    hints:
      - "แนะนำคนที่ยืนอยู่ข้าง ๆ เรา"
      - "ใช้ This is ... ไม่ใช้ I'm ..."
    solution: "แนะนำผู้อื่นใช้ **This is my friend, Noon.**"
