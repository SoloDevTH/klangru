    stem: "ทีมปรับปรุงของโรงพยาบาลลดเวลารอผลแล็บได้สำเร็จ ข้อใดช่วยรักษาผลการปรับปรุงไว้ในระยะยาว เลือกทุกข้อที่ถูก"
    choices:
      - { id: a, text: "ปรับขั้นตอนมาตรฐานและอบรมเจ้าหน้าที่ทุกเวรตามวิธีใหม่", correct: true }
      - { id: b, text: "ทำแผนควบคุมที่ระบุตัวชี้วัด ความถี่ แผนภูมิ I-MR และแผนรับมือเมื่อเกิดสัญญาณ", correct: true }
      - { id: c, text: "ส่งมอบความรับผิดชอบให้เจ้าของกระบวนการ พร้อมกำหนดการทบทวนเป็นระยะ", correct: true }
      - { id: d, text: "ยุบทีมแล้วหยุดวัดผล เพราะปัญหาแก้แล้ว", feedback: "ถ้าไม่วัดต่อจะไม่รู้ว่ากระบวนการกลับไปสภาพเดิมหรือไม่" }
      - { id: e, text: "ให้เจ้าหน้าที่ปรับขั้นตอนเองทุกครั้งที่ตัวเลขขยับเล็กน้อย", feedback: "การปรับตามความผันแปรปกติทำให้ผันแปรมากขึ้น ควรตอบสนองเฉพาะเมื่อมีสัญญาณ" }
    hints:
      - "ผลการปรับปรุงหายไปเมื่อคนกลับไปทำแบบเดิมและไม่มีใครเฝ้าดู"
      - "การควบคุมที่ดีบอกว่าวัดอะไร และทำอะไรเมื่อผิดปกติ"
    solution: "ก ข ค ถูก การรักษาผลต้องมีมาตรฐานใหม่ การอบรม แผนควบคุมพร้อมแผนรับมือ และเจ้าของกระบวนการที่ทบทวนต่อเนื่อง ส่วนการหยุดวัดหรือปรับตามทุกการขยับทำให้ผลไม่ยั่งยืน"
