id: biology.animals.gas-exchange
subject: biology
title: { th: การหายใจและการแลกเปลี่ยนแก๊ส, en: "Breathing and gas exchange in animals" }
summary: โครงสร้างแลกเปลี่ยนแก๊สของฟองน้ำ ไฮดรา พลานาเรีย ไส้เดือนดิน แมลง ปลา กบ และนก ปอดของสัตว์เลี้ยงลูกด้วยน้ำนม การแลกเปลี่ยนและลำเลียงแก๊สของมนุษย์ ปริมาตรอากาศในปอด และผลของการออกกำลังกาย หืด และบุหรี่
difficulty: 5
minutes: 45
prerequisites: [biology.cells.cellular-respiration]
encompasses:
  - { id: biology.cells.cellular-respiration, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: การไหลสวนทางกันในเหงือกปลา
    src: countercurrent.svg
    alt: "ภาพ 2 แบบ แบบ ก ไหลสวนทางกันในเหงือกปลา แถบน้ำไหลจากซ้ายไปขวา ออกซิเจนในน้ำ 100% 70% 40% 15% แถบเลือดด้านล่างไหลจากขวาไปซ้าย ออกซิเจนในเลือดที่ตำแหน่งเดียวกัน 90% 60% 30% 5% ทุกตำแหน่งน้ำสูงกว่าเลือด 10% ลูกศรแสดงออกซิเจนแพร่จากน้ำลงสู่เลือดทุกจุด เลือดออกจากเหงือกได้ราว 90% แบบ ข สมมติให้ไหลทางเดียวกัน น้ำ 100% 80% 60% 50% เลือด 5% 25% 40% 48% ความต่างลดลงเรื่อย ๆ จนเกือบเท่ากัน เลือดได้ไม่ถึง 50%"
    caption: "ตัวเลขเป็นร้อยละของความอิ่มตัวด้วยออกซิเจนแบบประมาณ เพื่อแสดงหลักการ (วาดโดยทีมคลังรู้)"
  - type: figure
    title: ระบบท่อลมของแมลงและถุงลมของนก
    src: insect-bird.svg
    alt: "ด้านซ้ายเป็นลำตัวแมลง 3 ส่วน มีท่อลมสีน้ำเงินสองเส้นยาวตามลำตัว ต่อขึ้นไปยังช่องหายใจที่เป็นวงกลมเรียงข้างลำตัว และแตกเป็นท่อลมฝอยเล็ก ๆ ลงไปถึงเซลล์ ข้อความ อากาศเข้าทางช่องหายใจแล้วไปถึงเซลล์โดยตรง ด้านขวาเป็นแผนภาพนก หลอดลมลงมาจากด้านบน ปอดอยู่ตรงกลาง ถุงลมด้านหน้าอยู่ซ้าย ถุงลมด้านหลังอยู่ขวา ลูกศรหมายเลข 1 เข้า ไปถุงลมด้านหลัง 2 ออก จากถุงลมด้านหลังผ่านปอด 3 เข้า จากปอดไปถุงลมด้านหน้า 4 ออก จากถุงลมด้านหน้าออกทางหลอดลม ข้อความ อากาศไหลผ่านปอดทางเดียว ทั้งตอนหายใจเข้าและออก"
    caption: "แมลงไม่ต้องใช้เลือดลำเลียงออกซิเจน ส่วนถุงลมของนกเป็นที่พักอากาศ ไม่ได้แลกเปลี่ยนแก๊ส (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: worked-example
    title: อธิบายโครงสร้างด้วยหลักการแพร่
    problem: "พลานาเรียไม่มีอวัยวะหายใจ แต่ปลาตัวเล็กขนาดเท่ากันต้องมีเหงือก ใช้หลักการแพร่อธิบายว่าทำไมพลานาเรียจึงอยู่ได้"
    steps:
      - text: "ออกซิเจนต้องแพร่จากผิวไปถึงเซลล์ที่อยู่ลึกที่สุด การแพร่ช้ามากเมื่อระยะทางยาว"
      - text: "พลานาเรียแบนบาง ทุกเซลล์อยู่ห่างผิวเพียงเล็กน้อย ผิวตัวที่ชื้นจึงพอ"
        why: "อัตราการแพร่แปรผกผันกับความหนา (ระยะทาง)"
      - text: "ปลามีลำตัวหนาและมีผิวเป็นเกล็ด ระยะทางยาวและผิวไม่เหมาะ จึงต้องมีเหงือกที่บาง กว้าง และมีเลือดไหลผ่าน"
    answer: "รูปร่างแบนทำให้ระยะแพร่สั้นและพื้นที่ผิวต่อปริมาตรมาก พลานาเรียจึงแลกเปลี่ยนแก๊สทางผิวตัวได้"
  - { type: check, problem: biology.animals.gas-exchange.p004, prompt: "ทบทวนว่าพื้นผิวแลกเปลี่ยนแก๊สที่ดีต้องมีลักษณะใด" }
  - type: figure
    title: ปริมาตรอากาศในปอดจากสไปโรมิเตอร์
    src: spirogram.svg
    alt: "กราฟปริมาตรอากาศในปอด 0 ถึง 6 ลิตรกับเวลา เส้นขึ้นลงเป็นคลื่นเล็กระหว่าง 2.3 กับ 2.8 ลิตร (ปกติ ≈ 500 mL) แล้วขึ้นไปสูงสุด 5.8 ลิตรเมื่อหายใจเข้าเต็มที่ และลงต่ำสุด 1.2 ลิตรเมื่อหายใจออกเต็มที่ ด้านขวามีแถบบอก สำรองหายใจเข้า ≈ 3,000 mL (2.8 ถึง 5.8) ปกติ ≈ 500 mL (2.3 ถึง 2.8) สำรองหายใจออก ≈ 1,100 mL (1.2 ถึง 2.3) ค้างในปอด ≈ 1,200 mL (0 ถึง 1.2) และเส้นแนวตั้งบอกความจุปอด ≈ 4,600 mL จาก 1.2 ถึง 5.8"
    caption: "อากาศค้างในปอดไล่ออกไม่ได้ จึงวัดด้วยสไปโรมิเตอร์โดยตรงไม่ได้ (วาดโดยทีมคลังรู้ ค่าตัวอย่างของผู้ใหญ่)"
  - type: worked-example
    title: อ่านค่าจากสไปโรแกรม
    problem: "สไปโรแกรมของนักกีฬาว่ายน้ำ หายใจปกติขึ้นลงระหว่าง 2.6 ถึง 3.3 ลิตร หายใจเข้าเต็มที่ถึง 6.9 ลิตร และหายใจออกเต็มที่ถึง 1.3 ลิตร หาปริมาตรอากาศหายใจปกติ สำรองหายใจเข้า สำรองหายใจออก และความจุปอด"
    steps:
      - text: "ปกติ $= 3.3 - 2.6 = 0.7$ ลิตร"
      - text: "สำรองหายใจเข้า $= 6.9 - 3.3 = 3.6$ ลิตร และสำรองหายใจออก $= 2.6 - 1.3 = 1.3$ ลิตร"
        why: "สำรองหายใจเข้าวัดจากยอดของการหายใจปกติ สำรองหายใจออกวัดจากจุดต่ำของการหายใจปกติ"
      - text: "ความจุปอด $= 6.9 - 1.3 = 5.6$ ลิตร ตรวจ: $0.7 + 3.6 + 1.3 = 5.6$ ลิตร"
    answer: "ปกติ 0.7 ลิตร สำรองหายใจเข้า 3.6 ลิตร สำรองหายใจออก 1.3 ลิตร ความจุปอด 5.6 ลิตร"
  - { type: check, problem: biology.animals.gas-exchange.p007, prompt: "ใช้วิธีเดียวกันกับกราฟของนักเรียนคนนี้" }
glossary:
  - { term: ระบบท่อลม, definition: "ระบบท่อในแมลงที่นำอากาศจากช่องหายใจผ่านท่อลมและท่อลมฝอยไปถึงเซลล์โดยตรง" }
  - { term: การไหลสวนทางกัน, definition: "การที่เลือดในเหงือกปลาไหลสวนทางกับน้ำ ทำให้มีความต่างของความเข้มข้นตลอดทาง" }
  - { term: ถุงลมของนก, definition: "ถุงที่ต่อกับปอดของนก ทำหน้าที่เป็นที่พักและสูบอากาศ ทำให้อากาศไหลผ่านปอดทางเดียว" }
  - { term: ความดันย่อย, definition: "ความดันส่วนที่เกิดจากแก๊สชนิดหนึ่งในของผสม แก๊สแพร่จากความดันย่อยสูงไปต่ำ" }
  - { term: ความจุปอด, definition: "ปริมาตรอากาศที่หายใจออกได้มากที่สุดหลังหายใจเข้าเต็มที่ เท่ากับปกติ + สำรองหายใจเข้า + สำรองหายใจออก" }
  - { term: ช่องว่างตาย, definition: "ส่วนของทางเดินหายใจที่ไม่มีการแลกเปลี่ยนแก๊ส อากาศส่วนนี้ไม่ถึงถุงลม" }
flashcards:
  - { front: "พื้นผิวแลกเปลี่ยนแก๊สที่ดี", back: "กว้าง บาง ชื้น และมีการไหลเวียนรักษาความต่างของความเข้มข้น" }
  - { front: "ทำไมเหงือกปลามีประสิทธิภาพสูง", back: "เลือดไหลสวนทางกับน้ำ ความต่างของออกซิเจนจึงคงอยู่ตลอดแผ่นเหงือก" }
  - { front: "คาร์บอนไดออกไซด์ลำเลียงในเลือดรูปใดมากที่สุด", back: "ไบคาร์บอเนตไอออนในพลาสมา (ราวร้อยละ 70)" }
  - { front: "ความจุปอด", back: "ปกติ + สำรองหายใจเข้า + สำรองหายใจออก ≈ 4,600 mL ในผู้ใหญ่" }
  - { front: "คาร์บอนมอนอกไซด์จากบุหรี่ทำอะไร", back: "จับฮีโมโกลบินแน่นกว่าออกซิเจน เลือดนำออกซิเจนได้น้อยลง" }
