<text x="40.0" y="58.0" font-size="22" text-anchor="start" fill="#1a1a1a" font-weight="bold">去清迈（สมมติ）</text>
<text x="40.0" y="246.0" font-size="19" text-anchor="start" fill="#1a1a1a" font-weight="normal">　　上个月，我和爸爸妈妈坐火车去清迈。</text>
<text x="40.0" y="276.0" font-size="19" text-anchor="start" fill="#1a1a1a" font-weight="normal">火车很慢，我们坐了十二个小时，但是我</text>
<text x="40.0" y="306.0" font-size="19" text-anchor="start" fill="#1a1a1a" font-weight="normal">一点儿也不累，因为窗外的风景很美。</text>
<text x="40.0" y="336.0" font-size="19" text-anchor="start" fill="#1a1a1a" font-weight="normal">　　在清迈，我们先去看了大象，然后去</text>
<text x="40.0" y="366.0" font-size="19" text-anchor="start" fill="#1a1a1a" font-weight="normal">夜市买东西。清迈比曼谷凉快，晚上我们</text>
<text x="40.0" y="396.0" font-size="19" text-anchor="start" fill="#1a1a1a" font-weight="normal">都穿外套。我很喜欢清迈，如果有机会，</text>
<text x="40.0" y="426.0" font-size="19" text-anchor="start" fill="#1a1a1a" font-weight="normal">我明年还想去。</text>
<text x="40.0" y="94.0" font-size="14" text-anchor="start" fill="#666" font-weight="normal">风景 fēngjǐng = ทิวทัศน์</text>
<text x="40.0" y="116.0" font-size="14" text-anchor="start" fill="#666" font-weight="normal">窗外 chuāngwài = นอกหน้าต่าง</text>
<text x="40.0" y="138.0" font-size="14" text-anchor="start" fill="#666" font-weight="normal">外套 wàitào = เสื้อแจ็กเก็ต</text>
<text x="40.0" y="160.0" font-size="14" text-anchor="start" fill="#666" font-weight="normal">小时 xiǎoshí = ชั่วโมง</text>
</svg>
