  ai_assisted: true
- id: science.nature.nature-of-science.p014
  topics:
  - science.nature.nature-of-science
  difficulty: 4
  type: mcq
  stem: ข้อใดแสดงว่า **มุมมองและค่านิยมของสังคม** มีผลต่อการพัฒนาความรู้วิทยาศาสตร์
  choices:
  - id: a
    text: ประเทศไทยปลูกข้าวมาก จึงมีงานวิจัยพันธุ์ข้าวที่ทนน้ำท่วมและทนแล้งจำนวนมาก
    correct: true
  - id: b
    text: น้ำเดือดที่ 100 องศาเซลเซียสที่ระดับน้ำทะเลในทุกประเทศ
    feedback: เป็นข้อเท็จจริงทางธรรมชาติที่ไม่ขึ้นกับวัฒนธรรม
  - id: c
    text: นักวิทยาศาสตร์ไทยใช้หน่วย SI เหมือนประเทศอื่น
    feedback: แสดงการตกลงร่วมกันเรื่องหน่วย ไม่ใช่อิทธิพลของค่านิยมต่อคำถามวิจัย
  - id: d
    text: แรงโน้มถ่วงดึงวัตถุลงสู่พื้นโลก
    feedback: เป็นปรากฏการณ์ธรรมชาติ ไม่ได้ขึ้นกับมุมมองของสังคม
  hints:
  - ค่านิยมของสังคมไม่ได้เปลี่ยนธรรมชาติ แต่มีผลต่ออะไร
  - คิดถึงการเลือกคำถามวิจัยและการให้ทุน
  solution: ธรรมชาติไม่ขึ้นกับวัฒนธรรม แต่สังคมมีผลต่อว่าจะศึกษาเรื่องใดและให้ทุนกับปัญหาใด สังคมที่ปลูกข้าวมากจึงวิจัยเรื่องข้าวมาก
