<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="sans-serif" font-size="14">
<title>ระบบหมุนเวียนเลือดแบบเปิดและแบบปิด</title>
<rect x="0" y="0" width="1000" height="430" fill="#ffffff"/>
<text x="250.0" y="36.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">ก. แบบเปิด (แมลง)</text>
<text x="750.0" y="36.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">ข. แบบปิด (ไส้เดือนดิน)</text>
<ellipse cx="250" cy="220" rx="210" ry="110" fill="#fff8e1" stroke="#8d6e63" stroke-width="3"/>
<rect x="120" y="135" width="250" height="22" rx="11" fill="#ffcdd2" stroke="#c62828" stroke-width="2.5"/>
<circle cx="170" cy="146" r="4" fill="#fff" stroke="#c62828"/>
<circle cx="220" cy="146" r="4" fill="#fff" stroke="#c62828"/>
<circle cx="270" cy="146" r="4" fill="#fff" stroke="#c62828"/>
<circle cx="320" cy="146" r="4" fill="#fff" stroke="#c62828"/>
<text x="250.0" y="96.0" text-anchor="middle" font-size="13" fill="#222">หัวใจเป็นท่อยาวด้านหลัง มีรูเปิดรับเลือด</text>
<line x1="120.0" y1="146.0" x2="70.0" y2="170.0" stroke="#c62828" stroke-width="3"/>
<polygon points="70.0,170.0 76.6,162.5 80.0,169.5" fill="#c62828"/>
<text x="250.0" y="240.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#6d4c41">ช่องว่างในลำตัว (ฮีโมซีล)</text>
<text x="250.0" y="262.0" text-anchor="middle" font-size="13" fill="#6d4c41">ของเหลวไหลอาบเซลล์โดยตรง</text>
<circle cx="110" cy="210" r="11" fill="#e8f5e9" stroke="#2e7d32"/>
<circle cx="150" cy="290" r="11" fill="#e8f5e9" stroke="#2e7d32"/>
<circle cx="250" cy="310" r="11" fill="#e8f5e9" stroke="#2e7d32"/>
<circle cx="350" cy="290" r="11" fill="#e8f5e9" stroke="#2e7d32"/>
<circle cx="395" cy="215" r="11" fill="#e8f5e9" stroke="#2e7d32"/>
<line x1="80.0" y1="200.0" x2="100.0" y2="270.0" stroke="#e57373" stroke-width="2.5"/>
<polygon points="100.0,270.0 94.4,263.0 101.1,261.1" fill="#e57373"/>
<line x1="200.0" y1="320.0" x2="300.0" y2="320.0" stroke="#e57373" stroke-width="2.5"/>
<polygon points="300.0,320.0 291.7,323.5 291.7,316.5" fill="#e57373"/>
<line x1="400.0" y1="270.0" x2="370.0" y2="175.0" stroke="#e57373" stroke-width="2.5"/>
<polygon points="370.0,175.0 375.8,181.8 369.2,184.0" fill="#e57373"/>
<text x="250.0" y="375.0" text-anchor="middle" font-size="14" fill="#222">ไม่มีหลอดเลือดฝอย ความดันต่ำ ไหลช้า</text>
<rect x="540" y="120" width="420" height="180" rx="90" fill="#fce4ec" stroke="#ad1457" stroke-width="3"/>
<line x1="580" y1="165" x2="930" y2="165" stroke="#c62828" stroke-width="6"/>
<text x="760.0" y="155.0" text-anchor="middle" font-size="13" fill="#c62828">หลอดเลือดด้านหลัง (เลือดไหลไปด้านหน้า)</text>
<line x1="580" y1="255" x2="930" y2="255" stroke="#c62828" stroke-width="6"/>
<text x="760.0" y="278.0" text-anchor="middle" font-size="13" fill="#c62828">หลอดเลือดด้านท้อง (เลือดไหลไปด้านท้าย)</text>
<path d="M600,165 q-12,45 0,90" fill="none" stroke="#c62828" stroke-width="5"/>
<path d="M622,165 q-12,45 0,90" fill="none" stroke="#c62828" stroke-width="5"/>
<path d="M644,165 q-12,45 0,90" fill="none" stroke="#c62828" stroke-width="5"/>
<path d="M666,165 q-12,45 0,90" fill="none" stroke="#c62828" stroke-width="5"/>
<path d="M688,165 q-12,45 0,90" fill="none" stroke="#c62828" stroke-width="5"/>
<text x="708.0" y="215.0" text-anchor="start" font-size="13" font-weight="bold" fill="#222">หัวใจเทียม 5 คู่</text>
<path d="M850,165 q20,20 0,45 q-20,25 0,45" fill="none" stroke="#e57373" stroke-width="2"/>
<path d="M895,165 q20,20 0,45 q-20,25 0,45" fill="none" stroke="#e57373" stroke-width="2"/>
<path d="M935,165 q20,20 0,45 q-20,25 0,45" fill="none" stroke="#e57373" stroke-width="2"/>
<line x1="935" y1="230" x2="960" y2="328" stroke="#555"/>
<text x="965.0" y="340.0" text-anchor="end" font-size="13" fill="#b71c1c">หลอดเลือดฝอย</text>
<line x1="920.0" y1="165.0" x2="880.0" y2="165.0" stroke="#c62828" stroke-width="3"/>
<polygon points="880.0,165.0 889.2,161.1 889.2,168.9" fill="#c62828"/>
<line x1="600.0" y1="255.0" x2="640.0" y2="255.0" stroke="#c62828" stroke-width="3"/>
<polygon points="640.0,255.0 630.8,258.9 630.8,251.1" fill="#c62828"/>
<text x="750.0" y="375.0" text-anchor="middle" font-size="14" fill="#222">เลือดอยู่ในหลอดเลือดตลอดเวลา ความดันสูง ไหลเร็ว</text>
<text x="560.0" y="110.0" text-anchor="start" font-size="12" fill="#222">ด้านหน้า</text>
<text x="940.0" y="110.0" text-anchor="end" font-size="12" fill="#222">ด้านท้าย</text>
</svg>