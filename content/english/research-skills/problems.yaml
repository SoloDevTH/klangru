  ai_assisted: true
- id: english.reading.research-skills.p010
  topics:
  - english.reading.research-skills
  difficulty: 3
  type: numeric
  stem: 'จากบันทึกการสำรวจ: *We asked 40 students how they come to school. 28 students walk or cycle.* ในการนำเสนอ ควรบอกว่านักเรียนที่เดินหรือปั่นจักรยานคิดเป็นกี่เปอร์เซ็นต์'
  answer:
    value: 70
    tolerance: 0
    unit: '%'
  misconceptions:
  - match: 28
    feedback: 28 คือจำนวนคน ต้องเทียบกับ 40 คนก่อน
  - match: 30
    feedback: 30% คือคนที่ไม่ได้เดินหรือปั่นจักรยาน (12 จาก 40)
  hints:
  - เปอร์เซ็นต์ = จำนวนที่สนใจ ÷ ทั้งหมด × 100
  - 28 ÷ 40 × 100
  solution: 28 ÷ 40 × 100 = **70%** นำเสนอว่า *The data shows that 70% of students walk or cycle to school.*
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.reading.research-skills.p011
  topics:
  - english.reading.research-skills
  difficulty: 3
  type: match
  stem: จับคู่ส่วนของการนำเสนอกับประโยคที่เหมาะสม
  pairs:
  - left: Introduction
    right: Today I'm going to talk about coral bleaching.
  - left: Main point
    right: First, warm water makes corals lose their algae.
  - left: Evidence
    right: According to the Ocean Research Institute, this happens after a few weeks of hot water.
  - left: Conclusion
    right: In conclusion, we need to protect our seas from rising temperatures.
  hints:
  - Introduction บอกหัวข้อ Conclusion สรุป
  - According to ... ใช้บอกหลักฐานจากแหล่งข้อมูล
  solution: Today I'm going to ... (Introduction) · First, ... (Main point) · According to ... (Evidence) · In conclusion, ... (Conclusion)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.reading.research-skills.p012
  topics:
  - english.reading.research-skills
  difficulty: 4
  type: mcq
  stem: 'ต้นฉบับ: *When sea water stays too warm for several weeks, corals push out the tiny algae that live inside them and give them colour.*


    ข้อใดเป็น **การจดบันทึก** ที่ดีที่สุด'
  choices:
  - id: a
    text: warm water (weeks) → corals push out algae → lose colour
    correct: true
    feedback: ถูก สั้น ใช้คำสำคัญ และเห็นลำดับเหตุผล
  - id: b
    text: When sea water stays too warm for several weeks, corals push out the tiny algae that live inside them and give them colour.
    feedback: ลอกทั้งประโยค ไม่ใช่การจดคำสำคัญ
  - id: c
    text: corals, algae
    feedback: สั้นเกินไปจนไม่รู้ว่าเกิดอะไรขึ้นหรือเพราะอะไร
  - id: d
    text: corals are scared of hot water
    feedback: ผิดจากต้นฉบับ ปะการังไม่ได้กลัว
  hints:
  - จดคำสำคัญ ไม่ใช่ลอกทั้งประโยค
  - บันทึกต้องบอกเหตุและผลได้
  solution: '**warm water (weeks) → corals push out algae → lose colour**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.reading.research-skills.p013
  topics:
  - english.reading.research-skills
  difficulty: 4
  type: mcq
  stem: 'ต้นฉบับ: *When sea water stays too warm for several weeks, corals push out the tiny algae that live inside them and give them colour.*


    ข้อใดเป็น **การถอดความ** (paraphrase) ที่ดีที่สุด'
  choices:
  - id: a
    text: Corals lose their colour when hot water makes them push out their algae.
    correct: true
    feedback: ถูก ใช้คำและโครงสร้างของตนเอง ความหมายเท่าเดิม
  - id: b
    text: When sea water stays too warm for several weeks, corals push out the tiny algae.
    feedback: เกือบเหมือนต้นฉบับทุกคำ ไม่ใช่การถอดความ
  - id: c
    text: Corals turn white because people touch them.
    feedback: ความหมายผิดจากต้นฉบับ
  - id: d
    text: Algae are very small.
    feedback: เป็นแค่รายละเอียด ไม่ใช่ใจความ
  hints:
  - ถอดความ = เปลี่ยนคำและโครงสร้าง แต่ความหมายเท่าเดิม
  - ตรวจว่าความหมายยังถูกไหม
  solution: '**Corals lose their colour when hot water makes them push out their algae.**'
  license: CC-BY-SA-4.0
  ai_assisted: true
