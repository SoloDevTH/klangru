summary: ภาษีเงินได้บุคคลธรรมดา (ค่าใช้จ่าย ค่าลดหย่อน อัตราก้าวหน้า) ภาษีหัก ณ ที่จ่าย ภาษีเงินได้นิติบุคคลและ SME ภาษีมูลค่าเพิ่ม การนำเข้าส่งออก และภาษีที่ดิน
