  - id: business.econ.scarcity-choice.p014
    topics: [business.econ.scarcity-choice]
    difficulty: 4
    type: numeric
    stem: "ฝนปกติทำงานพิเศษช่วงเย็นได้ชั่วโมงละ 50 บาท เย็นวันศุกร์เธอไม่ไปทำงาน แต่ใช้เวลา 3 ชั่วโมงไปดูภาพยนตร์ ซึ่งจ่ายค่าตั๋ว 120 บาท ถ้านับทั้งเงินที่จ่ายและรายได้ที่เสียไป การดูภาพยนตร์ครั้งนี้มีต้นทุนรวมกี่บาท (ตอบเป็นบาท)"
    answer: { value: 270, unit: บาท }
    hints:
      - "ต้นทุนมีสองส่วน คือ เงินที่จ่ายจริง และค่าจ้างที่ไม่ได้รับเพราะไม่ได้ไปทำงาน"
      - "หาค่าจ้างที่เสียไปจากจำนวนชั่วโมงคูณค่าจ้างต่อชั่วโมง แล้วบวกค่าตั๋ว"
    misconceptions:
      - { match: 120, feedback: "นับแค่ค่าตั๋ว ลืมค่าจ้าง 3 ชั่วโมงที่เสียไป ซึ่งเป็นค่าเสียโอกาสของเวลา" }
      - { match: 150, feedback: "นับแค่ค่าจ้างที่เสียไป ลืมค่าตั๋วที่จ่ายจริง" }
      - { match: 170, feedback: "คิดค่าจ้างเพียง 1 ชั่วโมง แต่ดูภาพยนตร์ 3 ชั่วโมง" }
    solution: "ค่าจ้างที่เสียไป $= 3 \\times 50 = 150$ บาท ต้นทุนรวม $= 120 + 150 = 270$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.scarcity-choice.p015
    topics: [business.econ.scarcity-choice]
    difficulty: 5
    type: numeric
    stem: "ไร่หนึ่งใช้ที่ดินและแรงงานชุดเดิมในหนึ่งฤดู ปลูกข้าวอย่างเดียวได้ 6 ตัน หรือปลูกข้าวโพดอย่างเดียวได้ 9 ตัน และแบ่งที่ปลูกผสมได้ตามสัดส่วนเดิม ค่าเสียโอกาสของการปลูกข้าวเพิ่ม **1 ตัน** เท่ากับข้าวโพดกี่ตัน (ตอบเป็นตัน)"
    answer: { value: 1.5, tolerance: 0.01, unit: ตัน }
    hints:
      - "ถ้าเปลี่ยนจากปลูกข้าวโพดทั้งหมดมาปลูกข้าวทั้งหมด จะได้ข้าว 6 ตันแต่เสียข้าวโพดกี่ตัน"
      - "หารข้าวโพดที่เสียไปด้วยข้าวที่ได้มา จะได้ค่าเสียโอกาสต่อข้าว 1 ตัน"
    misconceptions:
      - { match: 0.667, feedback: "หารกลับด้าน นั่นคือค่าเสียโอกาสของข้าวโพด 1 ตัน (เป็นข้าว) ต้องเอาข้าวโพดที่เสียไปหารด้วยข้าวที่ได้" }
      - { match: 9, feedback: "นั่นคือข้าวโพดที่เสียไปเมื่อปลูกข้าวทั้ง 6 ตัน ต้องหารด้วย 6 เพื่อให้เป็นต่อข้าว 1 ตัน" }
    solution: "ปลูกข้าว 6 ตันต้องสละข้าวโพด 9 ตัน ข้าว 1 ตันจึงต้องสละข้าวโพด $9 \\div 6 = 1.5$ ตัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.scarcity-choice.p016
    topics: [business.econ.scarcity-choice]
    difficulty: 5
    type: mcq
    stem: "หลังเลิกเรียน พลอยมีเวลา 2 ชั่วโมง ทำได้อย่างเดียว ประโยชน์ที่พลอยคิดเป็นเงินคือ (A) สอนการบ้านน้องข้างบ้านได้ 500 บาท (B) ขายขนมที่ตลาดนัดได้กำไร 450 บาท (C) ช่วยพ่อรดน้ำต้นไม้ได้ 300 บาท ทางเลือกใดที่ **ประโยชน์ที่ได้มากกว่าค่าเสียโอกาสของตัวเอง**"
    choices:
      - { id: a, text: "A เท่านั้น", correct: true }
      - { id: b, text: "A และ B", feedback: "ถ้าเลือก B ค่าเสียโอกาสคือ A = 500 บาท ซึ่งมากกว่า 450 บาทที่ได้ B จึงไม่คุ้ม" }
      - { id: c, text: "ทั้ง A B และ C", feedback: "C ได้ 300 บาท แต่ค่าเสียโอกาสคือ A = 500 บาท จึงไม่คุ้ม" }
      - { id: d, text: "ไม่มีทางเลือกใดคุ้ม เพราะต้องสละสองทางที่เหลือรวมกัน", feedback: "ค่าเสียโอกาสนับเฉพาะทางที่ดีที่สุดที่ไม่ได้เลือก ไม่บวกสองทาง ทาง A ได้ 500 แต่สละ 450 จึงคุ้ม" }
    hints:
      - "หาค่าเสียโอกาสของแต่ละทาง: ทางที่ดีที่สุดในสองทางที่เหลือ"
      - "เทียบประโยชน์ของทางนั้นกับค่าเสียโอกาสของมัน"
    solution: "เลือก A: ค่าเสียโอกาส $= \\max(450, 300) = 450 < 500$ คุ้ม · เลือก B: ค่าเสียโอกาส $= 500 > 450$ ไม่คุ้ม · เลือก C: ค่าเสียโอกาส $= 500 > 300$ ไม่คุ้ม จึงมีเฉพาะ A"
