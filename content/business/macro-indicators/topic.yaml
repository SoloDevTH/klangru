id: business.econ.macro-indicators
subject: business
title:
  th: ตัวชี้วัดเศรษฐกิจมหภาคและโครงสร้างตลาด
  en: Macroeconomic indicators and market structures
summary: GDP ด้านรายจ่าย GDP ที่แท้จริงและตัวปรับค่า อัตราการเติบโต ดัชนีราคาและอัตราดอกเบี้ยที่แท้จริง ผลต่อการตัดสินใจของธุรกิจ และโครงสร้างตลาดสี่แบบกับ HHI
difficulty: 5.5
minutes: 45
