id: math.geometry.similarity
subject: math
title: { th: รูปคล้าย, en: Similar figures }
summary: รู้จักรูปคล้ายและสามเหลี่ยมคล้าย ใช้อัตราส่วนของด้านที่สมนัยกันหาความยาว อ่านมาตราส่วนแผนที่ และวัดความสูงด้วยเงา
difficulty: 4
minutes: 35
prerequisites: [math.geometry.triangles, math.number.ratio-percent]
encompasses:
  - { id: math.number.ratio-percent, weight: 0.5 }
  - { id: math.geometry.triangles, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: dilation-grid.svg
    alt: "ระนาบพิกัดแสดงสามเหลี่ยม ABC สีน้ำเงินที่ A(1, 1) B(3, 1) C(1, 2) และภาพจากการขยายด้วยอัตราส่วน 2 จากจุดกำเนิด O คือสามเหลี่ยม A′B′C′ สีส้มที่ A′(2, 2) B′(6, 2) C′(2, 4) มีเส้นประจาก O ผ่านจุดยอดแต่ละคู่"
    caption: "จุดเดิมกับจุดใหม่อยู่บนรังสีเดียวกันจาก $O$ และ $OA' = 2 \\cdot OA$"
  - type: worked-example
    title: ขยายสามเหลี่ยมบนระนาบพิกัด
    problem: "ขยาย $\\triangle ABC$ ที่มี $A(1, 1)$, $B(3, 1)$, $C(1, 2)$ ด้วยอัตราส่วน $2$ จากจุดกำเนิด แล้วตรวจว่าได้รูปคล้าย"
    steps:
      - text: "คูณพิกัดทุกจุดด้วย 2: $A'(2, 2)$, $B'(6, 2)$, $C'(2, 4)$"
        why: "การขยายจากจุดกำเนิดด้วยอัตราส่วน $k$ ส่งจุด $(x, y)$ ไปที่ $(kx, ky)$"
      - text: "เทียบด้าน: $AB = 2$, $A'B' = 4$ และ $AC = 1$, $A'C' = 2$ อัตราส่วนเป็น $2$ ทั้งคู่"
      - text: "$BC = \\sqrt{2^2 + 1^2} = \\sqrt{5}$ และ $B'C' = \\sqrt{4^2 + 2^2} = \\sqrt{20} = 2\\sqrt{5}$ อัตราส่วนเป็น 2 เช่นกัน"
        why: "ด้านเอียงก็ยาวขึ้นด้วยอัตราส่วนเดียวกัน ตรวจด้วยระยะทางระหว่างจุด"
      - text: "มุมที่ $A$ และ $A'$ เป็นมุมฉากทั้งคู่ และ $B'C'$ ขนานกับ $BC$ (ความชัน $-\\tfrac12$ เท่ากัน)"
    answer: "$A'(2, 2)$, $B'(6, 2)$, $C'(2, 4)$ ด้านทุกคู่มีอัตราส่วน 2 มุมเท่าเดิม จึงเป็นรูปคล้าย"
  - { type: check, problem: math.sim.p001, prompt: "ลองใช้อัตราส่วนการขยาย" }
  - type: figure
    src: altitude-hypotenuse.svg
    alt: "สามเหลี่ยมมุมฉาก ABC มุมฉากที่ C ด้าน b จาก A ถึง C ด้าน a จาก C ถึง B ส่วนสูง h เป็นเส้นประจาก C ตั้งฉากลงที่จุด D บนด้าน AB แบ่ง AB เป็นส่วน p (จาก A ถึง D) และ q (จาก D ถึง B)"
    caption: "ส่วนสูงจากมุมฉากแบ่งสามเหลี่ยมเป็นสามเหลี่ยมเล็กสองรูปที่คล้ายกับรูปใหญ่"
  - type: worked-example
    title: พิสูจน์ทฤษฎีบทพีทาโกรัสด้วยสามเหลี่ยมคล้าย
    problem: "ใน $\\triangle ABC$ มุม $C$ เป็นมุมฉาก ลาก $CD \\perp AB$ ให้ $AD = p$, $DB = q$, $AB = c = p + q$, $AC = b$ และ $BC = a$ แสดงว่า $a^2 + b^2 = c^2$"
    steps:
      - text: "$\\triangle ACD$ กับ $\\triangle ABC$ มีมุม $A$ ร่วมกัน และมีมุมฉากที่ $D$ กับ $C$ จึงคล้ายกันแบบ มุม–มุม"
        why: "มุมเท่ากันสองคู่ก็พอสำหรับสามเหลี่ยม"
      - text: "จับคู่ด้าน: ด้านตรงข้ามมุมฉากของรูปเล็กคือ $AC = b$ ของรูปใหญ่คือ $AB = c$ ด้านประชิดมุม $A$ คือ $AD = p$ กับ $AC = b$ ได้ $\\dfrac{b}{c} = \\dfrac{p}{b}$ จึงได้ $b^2 = cp$"
      - text: "ทำแบบเดียวกันกับ $\\triangle CBD \\sim \\triangle ABC$ (มุม $B$ ร่วมกัน) ได้ $\\dfrac{a}{c} = \\dfrac{q}{a}$ จึงได้ $a^2 = cq$"
      - text: "บวกกัน: $a^2 + b^2 = cq + cp = c(p + q) = c \\cdot c = c^2$"
        why: "$p + q$ คือด้าน $AB$ ทั้งเส้น"
    answer: "$a^2 + b^2 = c^2$ (และได้ผลพลอยได้ $h^2 = pq$ จาก $\\triangle ACD \\sim \\triangle CBD$)"
  - { type: check, problem: math.sim.p006, prompt: "ตั้งสัดส่วนให้ถูกข้าง" }
  - type: interactive
    title: วัตถุสูงเท่าใดก็มีเงายาวตามสัดส่วน
    caption: "แกน x คือความยาวเงา (m) แกน y คือความสูงของวัตถุ (m) ณ เวลาเดียวกัน วัตถุทุกชิ้นอยู่บนเส้นตรงเส้นเดียวที่ผ่านจุดกำเนิด แถบเลื่อน k คืออัตราส่วนความสูงต่อความยาวเงา ซึ่งเปลี่ยนไปตามเวลาของวัน"
    widget:
      kind: function-plot
      functions: ["k x"]
      sliders:
        - { name: k, min: 0.25, max: 3, step: 0.25, value: 1.25, label: สูง ÷ เงา }
      x: [0, 10]
      y: [0, 12]
  - type: simulation
    title: เล่นกับอัตราส่วนที่คงที่ (PhET Ratio and Proportion)
    url: https://phet.colorado.edu/en/simulations/ratio-and-proportion
    provider: phet
    note: ขยับมือทั้งสองให้รักษาอัตราส่วนเดิมไว้ เหมือนด้านที่สมนัยกันของรูปคล้ายที่ต้องขยายด้วยตัวคูณเดียวกันเสมอ
glossary:
  - { term: รูปคล้าย, definition: "รูปที่มีรูปร่างเหมือนกันแต่ขนาดอาจต่างกัน มุมที่สมนัยกันเท่ากัน และด้านที่สมนัยกันมีอัตราส่วนเท่ากันทุกคู่" }
  - { term: ด้านที่สมนัยกัน, definition: "ด้านที่อยู่ในตำแหน่งเดียวกันของรูปคล้ายสองรูป เช่น ด้านที่อยู่ตรงข้ามมุมที่เท่ากัน" }
  - { term: อัตราส่วนการขยาย (ตัวคูณมาตราส่วน), definition: "จำนวน $k$ ที่คูณความยาวของรูปเดิมแล้วได้ความยาวที่สมนัยกันของรูปใหม่" }
  - { term: มาตราส่วน, definition: "อัตราส่วนระหว่างระยะบนแผนที่หรือแบบกับระยะจริง เช่น 1 : 50,000" }
flashcards:
  - { front: "สามเหลี่ยมสองรูปคล้ายกันเมื่อใด (ตรวจง่ายที่สุด)", back: "เมื่อมีมุมเท่ากันสองคู่ (มุมคู่ที่สามจะเท่ากันเอง เพราะมุมภายในรวม 180°)" }
  - { front: "รูปคล้ายที่ด้านขยาย $k$ เท่า พื้นที่ขยายกี่เท่า", back: "$k^2$ เท่า เช่น ด้านขยาย 3 เท่า พื้นที่ขยาย 9 เท่า" }
  - { front: "มาตราส่วน 1 : 50,000 หมายความว่าอะไร", back: "ระยะ 1 cm บนแผนที่ เท่ากับระยะจริง 50,000 cm หรือ 500 m" }
  - { front: "วัดความสูงต้นไม้ด้วยเงาทำอย่างไร", back: "ณ เวลาเดียวกัน $\\dfrac{\\text{สูงต้นไม้}}{\\text{เงาต้นไม้}} = \\dfrac{\\text{สูงไม้วัด}}{\\text{เงาไม้วัด}}$" }
