id: biology.ecology.habitats
subject: biology
title: { th: พืชและสัตว์ในแหล่งที่อยู่, en: Plants and animals in their habitats }
summary: พืชและสัตว์ที่พบในบริเวณต่าง ๆ ของท้องถิ่น สิ่งที่แหล่งที่อยู่ให้ การสำรวจเปรียบเทียบ และผลเมื่อสภาพแวดล้อมเปลี่ยน
difficulty: 1.2
minutes: 25
prerequisites: [biology.life.living-things]
encompasses: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: แหล่งที่อยู่ในสวนหลังโรงเรียน
    src: habitats-scene.svg
    alt: "ภาพสวนที่มีแหล่งที่อยู่ 4 แบบ 1 บนต้นไม้: นกทำรังบนกิ่ง กระรอกปีนลำต้น ใบไม้ให้ร่มเงา ผลเป็นอาหาร 2 สนามหญ้าและดอกไม้: ผีเสื้อดูดน้ำหวานจากดอก ตั๊กแตนกินใบหญ้า มีแดดมาก 3 ใต้ก้อนหิน: มืด ชื้น เย็น มีไส้เดือน กิ้งกือ มด กินเศษใบไม้ผุ 4 สระน้ำ: ปลาว่ายในน้ำ กบวางไข่ บัวลอยบนผิวน้ำ"
    caption: "แต่ละบริเวณให้อาหาร น้ำ และที่หลบภัยต่างกัน จึงพบสิ่งมีชีวิตต่างชนิดกัน (วาดโดยทีมคลังรู้)"
  - { type: check, problem: biology.ecology.habitats.p004, prompt: "ดูภาพที่ 3 ใต้ก้อนหิน" }
  - type: worked-example
    title: ทำไมกบอยู่ที่สระน้ำ
    problem: "ครูถามว่า ถ้าจะหาแหล่งที่อยู่ที่เหมาะกับกบในโรงเรียน ควรเลือกสระบัว ลานจอดรถ หรือห้องเรียน เพราะเหตุใด"
    steps:
      - text: "คิดก่อนว่ากบต้องการอะไร: แมลงเป็นอาหาร น้ำสำหรับวางไข่ (ลูกอ๊อดอยู่ในน้ำ) และที่ชื้นเพราะผิวหนังกบต้องไม่แห้ง"
      - text: "ลานจอดรถร้อน แห้ง ไม่มีน้ำ และมีรถวิ่ง ไม่เหมาะ"
      - text: "ห้องเรียนไม่มีน้ำให้วางไข่ และมีแมลงให้กินน้อย ไม่เหมาะ"
      - text: "สระบัวมีน้ำ มีแมลงบินรอบ ๆ และมีใบบัวให้เกาะและหลบซ่อน เหมาะที่สุด"
        why: "แหล่งที่อยู่ที่เหมาะต้องให้สิ่งที่สัตว์ต้องการครบ ไม่ใช่แค่อย่างเดียว"
    answer: "สระบัว เพราะมีน้ำ อาหาร ที่หลบภัย และความชื้นที่กบต้องการ"
  - type: figure
    title: ผลการสำรวจสัตว์ในโรงเรียน
    src: survey-chart.svg
    alt: "กราฟแท่งจำนวนชนิดของสัตว์ที่พบในการสำรวจ 15 นาที สนามหญ้า 6 ชนิด สระน้ำ 4 ชนิด ลานคอนกรีต 1 ชนิด"
    caption: "สำรวจทุกที่ด้วยเวลาเท่ากัน จึงเปรียบเทียบกันได้ (วาดโดยทีมคลังรู้)"
  - { type: check, problem: biology.ecology.habitats.p006, prompt: "อ่านค่าจากกราฟ" }
glossary:
  - { term: แหล่งที่อยู่, definition: "บริเวณที่สิ่งมีชีวิตอาศัยอยู่ ให้อาหาร น้ำ ที่หลบภัย และสภาพที่เหมาะกับการดำรงชีวิต" }
  - { term: แหล่งที่อยู่ขนาดเล็ก, definition: "บริเวณเล็ก ๆ ภายในแหล่งที่อยู่ใหญ่ เช่น ใต้ก้อนหิน ใต้ใบไม้ผุ บนเปลือกไม้" }
  - { term: ที่หลบภัย, definition: "ที่ที่สัตว์ใช้หลบศัตรู หลบแดดฝน และเลี้ยงลูก เช่น รัง รู โพรงไม้" }
  - { term: ป่าชายเลน, definition: "ป่าริมชายฝั่งที่น้ำทะเลท่วมถึงเมื่อน้ำขึ้น มีต้นโกงกาง ปู และปลาตีน" }
flashcards:
  - { front: "แหล่งที่อยู่ให้อะไรแก่สิ่งมีชีวิต", back: "อาหาร น้ำ ที่หลบภัยและที่เลี้ยงลูก และสภาพที่เหมาะ เช่น แสง อุณหภูมิ ความชื้น" }
  - { front: "ทำไมไส้เดือนอยู่ใต้ก้อนหิน", back: "ใต้ก้อนหินมืด ชื้น เย็น และมีเศษใบไม้ผุเป็นอาหาร ตัวไส้เดือนจึงไม่แห้ง" }
  - { front: "ถ้าสระน้ำแห้ง ปลาและกบเป็นอย่างไร", back: "ปลาอยู่ไม่ได้และอาจตาย กบต้องย้ายไปหาที่ชื้น" }
  - { front: "ตัวอย่างสัตว์ที่เปลี่ยนสภาพแวดล้อม", back: "ปลวกสร้างจอมปลวก นกกระจาบสานรัง คนตัดต้นไม้สร้างบ้าน" }
