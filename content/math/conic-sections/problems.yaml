    solution: "$x^2 + y^2 = 9$ วงกลมรัศมี 3; $y = 2x^2$ พาราโบลา; ตัวหารใต้ $x^2$ กับ $y^2$ ต่างกันและบวกกันเป็นวงรี; $x^2 - y^2 = 1$ ลบกันเป็นไฮเพอร์โบลา"
