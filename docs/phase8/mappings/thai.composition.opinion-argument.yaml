  - { framework: th-core-2551-thai, indicators: ["ท 2.1 ม.2/7", "ท 2.1 ม.3/6", "ท 2.1 ม.3/7"], coverage: partial, note: "อธิบาย ชี้แจง วิเคราะห์ วิจารณ์ และโต้แย้งด้วยข้ออ้าง เหตุผล หลักฐาน ข้อแย้งและการหักล้าง แผนผังการโต้แย้ง คำแสดงระดับความมั่นใจ และการตัดเหตุผลวิบัติ (อ้างบทการอ่านเชิงวิเคราะห์) ฝึกด้วยการระบุส่วน เรียงย่อหน้า และแก้ร่าง แต่การเขียนงานโต้แย้งของตนเองตรวจในแอปไม่ได้" }
