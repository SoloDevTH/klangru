id: health.nutrition.basics
subject: health
title: { th: สารอาหาร ธงโภชนาการ และการอ่านฉลากโภชนาการ, en: "Nutrients, the food guide and nutrition labels" }
summary: อาหารหลัก 5 หมู่ ปริมาณที่ควรกินตามธงโภชนาการ พลังงานจากคาร์โบไฮเดรต โปรตีน และไขมัน และการอ่านฉลากโภชนาการเพื่อเลือกอาหาร
difficulty: 3
minutes: 35
prerequisites: [math.number.ratio-percent]
encompasses:
  - { id: math.number.ratio-percent, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ปริมาณอาหารต่อวันตามธงโภชนาการ
    src: food-guide.svg
    alt: "แผนภาพสามเหลี่ยมหัวกลับหกชั้น จากบนลงล่าง: ข้าว แป้ง, ผัก, ผลไม้, เนื้อสัตว์ ถั่ว ไข่, นม, น้ำมัน น้ำตาล เกลือ ข้างกันเป็นตารางปริมาณต่อวันที่พลังงาน 1,600 / 2,000 / 2,400 กิโลแคลอรี: ข้าวแป้ง 8 / 10 / 12 ทัพพี ผัก 4 (ผู้ใหญ่ 6) / 5 / 6 ทัพพี ผลไม้ 3 (ผู้ใหญ่ 4) / 4 / 5 ส่วน เนื้อสัตว์ 6 / 9 / 12 ช้อนกินข้าว นม 2 (ผู้ใหญ่ 1) / 1 / 1 แก้ว น้ำมัน น้ำตาล เกลือ ใช้แต่น้อยเท่าที่จำเป็น"
    caption: "ชั้นบนกว้างคือกลุ่มที่ควรกินมาก ชั้นล่างแคบคือกลุ่มที่ควรกินน้อย ตัวเลขจากธงโภชนาการของกรมอนามัย (แผนภาพวาดใหม่โดยทีมคลังรู้)"
  - type: worked-example
    title: หาพลังงานจากสารอาหารบนฉลาก
    problem: "ฉลากของโยเกิร์ตถ้วยหนึ่ง (1 หน่วยบริโภค) เขียนว่า คาร์โบไฮเดรต 18 กรัม โปรตีน 5 กรัม ไขมัน 3 กรัม โยเกิร์ตถ้วยนี้ให้พลังงานกี่กิโลแคลอรี"
    steps:
      - text: "จำค่าพลังงานต่อกรัม: คาร์โบไฮเดรตและโปรตีน $4\\ \\mathrm{kcal/g}$ ไขมัน $9\\ \\mathrm{kcal/g}$"
        why: "ไขมันเก็บพลังงานได้หนาแน่นกว่า จึงใช้ 9 ไม่ใช่ 4"
      - text: "คูณแต่ละชนิด: คาร์โบไฮเดรต $18 \\times 4 = 72$ โปรตีน $5 \\times 4 = 20$ ไขมัน $3 \\times 9 = 27$"
      - text: "รวมกัน $72 + 20 + 27 = 119\\ \\mathrm{kcal}$"
      - text: "ตรวจความสมเหตุสมผล: ฉลากจริงปัดพลังงานเป็นจำนวนเต็มสิบ จึงอาจเขียนว่า 120 กิโลแคลอรี"
        why: "ฉลากโภชนาการปัดตัวเลขตามกฎการแสดงค่า ผลที่คำนวณจึงต่างจากฉลากได้เล็กน้อย"
    answer: "ประมาณ $119\\ \\mathrm{kcal}$"
  - { type: check, problem: hlt.nut.p004, prompt: "ลองคิดก่อนอ่านต่อ: คาร์โบไฮเดรต 20 กรัมให้พลังงานเท่าไร" }
  - type: figure
    title: ฉลากโภชนาการสมมติสำหรับฝึกอ่าน
    src: nutrition-label.svg
    alt: "ฉลากข้อมูลโภชนาการสมมติของขนมปังกรอบ หนึ่งหน่วยบริโภคคือครึ่งซอง 30 กรัม จำนวนหน่วยบริโภคต่อซอง 2 ต่อหนึ่งหน่วยบริโภค: พลังงานทั้งหมด 150 กิโลแคลอรี (พลังงานจากไขมัน 60 กิโลแคลอรี) ไขมันทั้งหมด 7 กรัม 11% ไขมันอิ่มตัว 3 กรัม โปรตีน 3 กรัม คาร์โบไฮเดรตทั้งหมด 19 กรัม 6% ใยอาหาร 1 กรัม 4% น้ำตาล 6 กรัม โซเดียม 160 มิลลิกรัม 8% ร้อยละคิดจากค่าอ้างอิงต่อวัน ไขมัน 65 กรัม คาร์โบไฮเดรต 300 กรัม ใยอาหาร 25 กรัม โซเดียม 2,000 มิลลิกรัม"
    caption: "ตัวเลขทุกตัวบนฉลากเป็นของหนึ่งหน่วยบริโภค ซองนี้มี 2 หน่วยบริโภค"
  - type: worked-example
    title: กินหมดซองได้อะไรบ้าง
    problem: "จากฉลากสมมติด้านบน ถ้ากินขนมปังกรอบหมดซอง จะได้พลังงานกี่กิโลแคลอรี ได้ไขมันกี่เปอร์เซ็นต์ของปริมาณที่แนะนำต่อวัน และพลังงานจากไขมันคิดเป็นกี่เปอร์เซ็นต์ของพลังงานทั้งหมด"
    steps:
      - text: "อ่านหนึ่งหน่วยบริโภค (ครึ่งซอง) และจำนวนหน่วยบริโภคต่อซอง (2) ก่อน"
        why: "ตัวเลขบนฉลากคิดต่อหนึ่งหน่วยบริโภค ถ้ากินมากหรือน้อยกว่านั้นต้องปรับก่อนเสมอ"
      - text: "พลังงานทั้งซอง $= 150 \\times 2 = 300\\ \\mathrm{kcal}$"
      - text: "ไขมันทั้งซอง $= 7 \\times 2 = 14$ กรัม คิดเป็น $\\frac{14}{65} \\times 100 \\approx 21.5\\%$ (หรือ $11\\% \\times 2 = 22\\%$ ต่างกันเพราะฉลากปัด 10.8% เป็น 11%)"
      - text: "พลังงานจากไขมัน $= 14 \\times 9 = 126\\ \\mathrm{kcal}$ คิดเป็น $\\frac{126}{300} \\times 100 = 42\\%$ ของพลังงานทั้งหมด"
        why: "ต้องแปลงกรัมของไขมันเป็นพลังงานก่อนเทียบกับพลังงานทั้งหมด ถ้าเอา 14 กรัมหาร 300 กิโลแคลอรีตรง ๆ หน่วยไม่เข้ากัน"
      - text: "ตีความ: ขนมซองเดียวให้ไขมันราวหนึ่งในห้าของทั้งวัน และพลังงานเกือบครึ่งมาจากไขมัน จึงควรแบ่งกินตามที่ฉลากแนะนำ"
    answer: "$300\\ \\mathrm{kcal}$, ไขมันประมาณ $21.5\\%$ ของปริมาณที่แนะนำต่อวัน และพลังงานจากไขมัน $42\\%$"
  - { type: check, problem: hlt.nut.p009, prompt: "ใช้ฉลากด้านบนตอบ" }
glossary:
  - { term: สารอาหาร, definition: "สารในอาหารที่ร่างกายนำไปใช้ ได้แก่ คาร์โบไฮเดรต โปรตีน ไขมัน วิตามิน แร่ธาตุ และน้ำ สามชนิดแรกให้พลังงาน" }
  - { term: อาหารหลัก 5 หมู่, definition: "การจัดกลุ่มอาหารของไทย: หมู่ 1 โปรตีน หมู่ 2 คาร์โบไฮเดรต หมู่ 3 ผัก (เกลือแร่) หมู่ 4 ผลไม้ (วิตามิน) หมู่ 5 ไขมัน" }
  - { term: ธงโภชนาการ, definition: "แผนภาพรูปสามเหลี่ยมหัวกลับของกรมอนามัย บอกสัดส่วนและปริมาณอาหารแต่ละกลุ่มที่ควรกินใน 1 วันด้วยหน่วยครัวเรือน เช่น ทัพพี ช้อนกินข้าว แก้ว" }
  - { term: หนึ่งหน่วยบริโภค, definition: "ปริมาณอาหารที่ฉลากโภชนาการใช้คิดตัวเลขทุกตัว เช่น ครึ่งซอง หรือ 1 กล่อง" }
  - { term: ร้อยละของปริมาณที่แนะนำต่อวัน, definition: "ปริมาณสารอาหารในหนึ่งหน่วยบริโภคเทียบกับค่าอ้างอิงต่อวัน คิดจากความต้องการพลังงานวันละ 2,000 กิโลแคลอรี" }
flashcards:
  - { front: "คาร์โบไฮเดรต โปรตีน ไขมัน 1 กรัม ให้พลังงานเท่าไร", back: "คาร์โบไฮเดรต 4 kcal โปรตีน 4 kcal ไขมัน 9 kcal" }
  - { front: "อาหารหลัก 5 หมู่ หมู่ใดให้สารอาหารอะไร", back: "1 โปรตีน (เนื้อ นม ไข่ ถั่ว) 2 คาร์โบไฮเดรต (ข้าว แป้ง) 3 เกลือแร่ (ผัก) 4 วิตามิน (ผลไม้) 5 ไขมัน" }
  - { front: "ตามธงโภชนาการ กลุ่มใดควรกินมากที่สุดและน้อยที่สุด", back: "มากที่สุด: ข้าว แป้ง น้อยที่สุด: น้ำมัน น้ำตาล เกลือ (ใช้แต่น้อยเท่าที่จำเป็น)" }
  - { front: "อ่านฉลากโภชนาการ ต้องดูอะไรก่อน", back: "หนึ่งหน่วยบริโภค และจำนวนหน่วยบริโภคต่อภาชนะ แล้วจึงคูณตามที่กินจริง" }
  - { front: "WHO แนะนำเกลือและน้ำตาลอิสระสำหรับผู้ใหญ่ไม่เกินเท่าไร", back: "เกลือไม่เกิน 5 กรัมต่อวัน (โซเดียม 2 กรัม) น้ำตาลอิสระไม่เกิน 10% ของพลังงาน (ราว 50 กรัมที่ 2,000 kcal)" }
