      - { left: "ผลที่ไม่ตั้งใจ", right: "คนบางกลุ่มเข้าถึงบริการยากเพราะไม่มีอุปกรณ์" }
      - { left: "ผลต่อสิ่งแวดล้อม", right: "ทำให้เกิดขยะจากเครื่องที่ถูกทิ้ง" }
    hints:
