      - "ชื่อลมบอกทิศที่ลมพัดมา"
    solution: "อากาศที่ผิวโลกไหลไปทางขั้วโลกเหนือ แรงคอริออลิสเบนไปทางขวา คือทิศตะวันออก ลมจึงพัดจากตะวันตกไปตะวันออก เรียกว่าลมตะวันตก"
