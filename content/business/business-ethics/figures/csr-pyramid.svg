<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="sans-serif" font-size="14">
  <title>พีระมิดความรับผิดชอบต่อสังคมของธุรกิจสี่ระดับ</title>
  <rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
  <polygon points="380.0,20 380.0,20 470.0,90 290.0,90" fill="#ede9fe" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="290.0,90 470.0,90 560.0,160 200.0,160" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="200.0,160 560.0,160 650.0,230 110.0,230" fill="#fef3c7" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="110.0,230 650.0,230 740.0,300 20.0,300" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="380.0" y="64.0" text-anchor="middle" fill="#1f2937" font-size="12" font-weight="bold">ความรับผิดชอบ</text>
  <text x="380.0" y="80.0" text-anchor="middle" fill="#1f2937" font-size="12" font-weight="bold">เชิงการให้</text>
  <text x="380.0" y="124.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">ความรับผิดชอบเชิงจริยธรรม</text>
  <text x="380.0" y="146.0" text-anchor="middle" fill="#1f2937" font-size="12">ทำสิ่งที่ถูกและเป็นธรรม แม้ไม่มีกฎหมายบังคับ</text>
  <text x="380.0" y="194.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">ความรับผิดชอบทางกฎหมาย</text>
  <text x="380.0" y="216.0" text-anchor="middle" fill="#1f2937" font-size="12">ทำตามกฎหมาย เช่น แรงงาน ภาษี สิ่งแวดล้อม</text>
  <text x="380.0" y="264.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">ความรับผิดชอบทางเศรษฐกิจ</text>
  <text x="380.0" y="286.0" text-anchor="middle" fill="#1f2937" font-size="12">มีกำไร อยู่รอด จ้างงาน ผลิตของที่คนต้องการ</text>
  <text x="380.0" y="322.0" text-anchor="middle" fill="#6b7280" font-size="12">ยอดสุด: บริจาค อาสา ช่วยชุมชน · ฐาน: ต้องอยู่รอดและทำตามกฎหมายก่อน</text>
</svg>
