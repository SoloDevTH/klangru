problems:
- id: thai.grammar.sounds-of-thai.p001
  topics:
  - thai.grammar.sounds-of-thai
  difficulty: 1
  type: mcq
  stem: พยัญชนะไทยมี 44 รูป ออกเสียงได้กี่เสียง
  choices:
  - id: a
    text: 21 เสียง
    correct: true
    feedback: ถูก หลายรูปออกเสียงเดียวกัน เช่น ท ถ ฐ ฑ ฒ ธ
  - id: b
    text: 44 เสียง
    feedback: นี่คือจำนวนรูป ไม่ใช่จำนวนเสียง
  - id: c
    text: 8 เสียง
    feedback: 8 เสียงคือเสียงตัวสะกด (พยัญชนะท้าย)
  - id: d
    text: 32 เสียง
    feedback: 32 เป็นจำนวนสระตามแบบเรียนประถม
  hints:
  - หลายรูปออกเสียงเหมือนกัน
  - ลองนึก ส ศ ษ ซ ว่าออกเสียงต่างกันหรือไม่
  solution: พยัญชนะ 44 รูป **21 เสียง**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sounds-of-thai.p002
  topics:
  - thai.grammar.sounds-of-thai
  difficulty: 1
  type: numeric
  stem: เสียงวรรณยุกต์ในภาษาไทยมีกี่เสียง (ตอบเป็นตัวเลข)
  answer:
    value: 5
    tolerance: 0
    unit: เสียง
  misconceptions:
  - match: 4
    feedback: 4 คือจำนวนรูปวรรณยุกต์ (่ ้ ๊ ๋) เสียงสามัญไม่มีรูป
  hints:
  - นับ สามัญ เอก โท ตรี จัตวา
  - เสียงสามัญไม่มีรูปแต่ก็นับเป็นเสียง
  solution: เสียงวรรณยุกต์ **5 เสียง** (สามัญ เอก โท ตรี จัตวา) แต่มีรูปเพียง 4 รูป
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sounds-of-thai.p003
  topics:
  - thai.grammar.sounds-of-thai
  difficulty: 2
  type: match
  stem: จับคู่เสียงกับชื่อเรียกตามลักษณะการเกิดเสียง
  pairs:
  - left: เสียงสระ
    right: เสียงแท้
  - left: เสียงพยัญชนะ
    right: เสียงแปร
  - left: เสียงวรรณยุกต์
    right: เสียงดนตรี
  hints:
  - เสียงสระออกได้สะดวกไม่ถูกกั้น
  - วรรณยุกต์คือระดับเสียงสูงต่ำเหมือนตัวโน้ต
  solution: สระ = เสียงแท้ · พยัญชนะ = เสียงแปร · วรรณยุกต์ = เสียงดนตรี
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sounds-of-thai.p004
  topics:
  - thai.grammar.sounds-of-thai
  difficulty: 2
  type: numeric
  stem: ดูตารางสระเดี่ยว สระที่เกิดจาก **ลิ้นส่วนหลัง** มีกี่เสียง (นับทั้งเสียงสั้นและเสียงยาว)
  figure:
    src: vowel-chart.svg
    alt: 'ตารางสระเดี่ยว 3 แถว 3 คอลัมน์ คอลัมน์ ลิ้นส่วนหน้า ลิ้นส่วนกลาง ลิ้นส่วนหลัง แถว ลิ้นยกสูง ลิ้นยกกลาง ลิ้นลดต่ำ ช่องในตาราง: แถวยกสูง อิ/อี อึ/อือ อุ/อู · แถวยกกลาง เอะ/เอ เออะ/เออ โอะ/โอ · แถวลดต่ำ แอะ/แอ อะ/อา เอาะ/ออ คอลัมน์ลิ้นส่วนหลังระบายสีหมายถึงริมฝีปากห่อกลม'
  answer:
    value: 6
    tolerance: 0
    unit: เสียง
  misconceptions:
  - match: 3
    feedback: นับแค่ช่อง ช่องละ 2 เสียง (สั้นกับยาว)
  - match: 9
    feedback: 9 คือจำนวนช่องทั้งตาราง
  hints:
  - ดูคอลัมน์ขวาสุด
  - แต่ละช่องมีสระ 2 เสียง
  solution: คอลัมน์ลิ้นส่วนหลังมี อุ/อู โอะ/โอ เอาะ/ออ = 3 ช่อง × 2 = **6 เสียง**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sounds-of-thai.p005
  topics:
  - thai.grammar.sounds-of-thai
  difficulty: 2
  type: mcq
  stem: คู่ใดต่างกัน **เฉพาะความยาวของสระ**
  choices:
  - id: a
    text: ขัน – ขาน
    correct: true
    feedback: ถูก สระอะกับอา พยัญชนะและวรรณยุกต์เหมือนกัน
  - id: b
    text: นา – หน้า
    feedback: ต่างที่เสียงวรรณยุกต์ (สามัญ กับ โท)
  - id: c
    text: กิน – กัน
    feedback: ต่างที่ตำแหน่งลิ้น (อิ กับ อะ) ไม่ใช่ความยาว
  - id: d
    text: ปา – ปลา
    feedback: ต่างที่พยัญชนะต้น (ปลา มีควบกล้ำ)
  hints:
  - หาคู่สระสั้นยาวที่มาด้วยกัน เช่น อะ–อา
  - พยัญชนะ ตัวสะกด และวรรณยุกต์ต้องเหมือนกัน
  solution: '**ขัน–ขาน** ต่างกันแค่สระสั้น (อะ) กับสระยาว (อา)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sounds-of-thai.p006
  topics:
  - thai.grammar.sounds-of-thai
  difficulty: 3
  type: mcq
  stem: ประโยค "เมื่อวานเขากินข้าว" กับ "พรุ่งนี้เขาจะกินข้าว" แสดงลักษณะเด่นของภาษาไทยข้อใด
  choices:
  - id: a
    text: เป็นภาษาคำโดด คำกริยาไม่เปลี่ยนรูปตามกาล
    correct: true
    feedback: ถูก กิน ไม่เปลี่ยนรูป ใช้คำ เมื่อวาน จะ พรุ่งนี้ บอกเวลาแทน
  - id: b
    text: คำไทยแท้มีหลายพยางค์
    feedback: คำไทยแท้ส่วนมากมีพยางค์เดียว และประโยคนี้ไม่ได้แสดงเรื่องนี้
  - id: c
    text: มีลักษณนาม
    feedback: ประโยคนี้ไม่มีลักษณนาม
  - id: d
    text: ตัวสะกดไม่ตรงมาตรา
    feedback: ไม่เกี่ยวกับประโยคนี้
  hints:
  - ดูว่าคำว่า กิน เปลี่ยนรูปหรือไม่เมื่อเวลาเปลี่ยน
  - ภาษาอังกฤษเปลี่ยน eat เป็น ate ภาษาไทยทำอย่างไร
  solution: ภาษาไทยเป็น**ภาษาคำโดด** ไม่เปลี่ยนรูปคำตามกาล ใช้คำอื่นช่วยบอก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sounds-of-thai.p007
  topics:
  - thai.grammar.sounds-of-thai
  difficulty: 3
  type: mcq
  stem: คำใดมี **สระประสม** (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: เรียน
    correct: true
    feedback: สระเอีย เป็นสระประสม
  - id: b
    text: เมือง
    correct: true
    feedback: สระเอือ เป็นสระประสม
  - id: c
    text: ตัว
    correct: true
    feedback: สระอัว เป็นสระประสม
  - id: d
    text: เลย
    feedback: สระเออ + ย สะกด สระเออเป็นสระเดี่ยว
  - id: e
    text: แมว
    feedback: สระแอ + ว สะกด สระแอเป็นสระเดี่ยว
  - id: f
    text: เกาะ
    feedback: สระเอาะ เป็นสระเดี่ยวเสียงสั้น
  hints:
  - 'สระประสมมี 3 เสียง: เอีย เอือ อัว'
  - ระวังรูปที่มีสระหลายชิ้นแต่เป็นสระเดี่ยว เช่น เอาะ
  solution: 'สระประสม: **เรียน (เอีย) เมือง (เอือ) ตัว (อัว)**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sounds-of-thai.p008
  topics:
  - thai.grammar.sounds-of-thai
  difficulty: 3
  type: numeric
  stem: ตัวสะกด (พยัญชนะท้าย) ในภาษาไทยออกเสียงได้กี่เสียงตามมาตราตัวสะกด
  answer:
    value: 8
    tolerance: 0
    unit: เสียง
  misconceptions:
  - match: 21
    feedback: 21 คือเสียงพยัญชนะต้น ตัวสะกดออกเสียงได้น้อยกว่า
  - match: 44
    feedback: 44 คือจำนวนรูปพยัญชนะ
  hints:
  - นึกถึงมาตราตัวสะกด
  - กก กด กบ กง กน กม เกย เกอว
  solution: ตัวสะกดออกเสียงได้ **8 เสียง** คือ /ก ด บ ง น ม ย ว/ (บางตำรานับเสียงหยุดที่เส้นเสียงด้วยเป็น 9)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sounds-of-thai.p009
  topics:
  - thai.grammar.sounds-of-thai
  difficulty: 3
  type: match
  stem: จับคู่พยัญชนะกับฐานที่เกิดเสียง
  pairs:
  - left: บ
    right: ริมฝีปาก
  - left: ฟ
    right: ริมฝีปากกับฟัน
  - left: จ
    right: เพดานแข็ง
  - left: ก
    right: เพดานอ่อน
  - left: ห
    right: เส้นเสียง
  hints:
  - ลองออกเสียงช้า ๆ แล้วสังเกตว่าลมถูกกั้นที่ไหน
  - บ ปิดริมฝีปาก ก ใช้ลิ้นส่วนหลังแตะเพดานด้านใน
  solution: บ–ริมฝีปาก · ฟ–ริมฝีปากกับฟัน · จ–เพดานแข็ง · ก–เพดานอ่อน · ห–เส้นเสียง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sounds-of-thai.p010
  topics:
  - thai.grammar.sounds-of-thai
  difficulty: 4
  type: numeric
  stem: คำว่า **กราบ** มีเสียงพยัญชนะทั้งหมดกี่เสียง (นับพยัญชนะต้นและตัวสะกด)
  answer:
    value: 3
    tolerance: 0
    unit: เสียง
  misconceptions:
  - match: 2
    feedback: ลืมนับ ร ในคำควบกล้ำ กร ซึ่งออกเสียงด้วย
  - match: 1
    feedback: นับแค่พยัญชนะต้นตัวแรก
  hints:
  - กร เป็นควบกล้ำแท้ ออกเสียงทั้ง ก และ ร
  - อย่าลืมตัวสะกด บ
  solution: กราบ = ก + ร (ควบกล้ำ) + อา + บ สะกด มีเสียงพยัญชนะ **3 เสียง**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sounds-of-thai.p011
  topics:
  - thai.grammar.sounds-of-thai
  difficulty: 4
  type: mcq
  stem: คนไทยเรียกสัตว์ชนิดหนึ่งว่า "หมา" คนอังกฤษเรียก "dog" ข้อนี้แสดงธรรมชาติของภาษาข้อใด
  choices:
  - id: a
    text: เสียงกับความหมายสัมพันธ์กันตามข้อตกลงของคนในสังคม
    correct: true
    feedback: ถูก ไม่มีเหตุผลทางเสียงว่าสัตว์นี้ต้องชื่อนี้
  - id: b
    text: ภาษาไทยดีกว่าภาษาอังกฤษ
    feedback: ไม่มีภาษาใดดีกว่ากัน แต่ละสังคมตกลงคำต่างกัน
  - id: c
    text: ทุกคำเลียนเสียงธรรมชาติ
    feedback: คำเลียนเสียงมีบางคำ เช่น ตุ๊กแก แต่ หมา กับ dog ไม่ได้เลียนเสียงเห่า
  - id: d
    text: ภาษาไม่เปลี่ยนแปลง
    feedback: ไม่เกี่ยว และภาษาเปลี่ยนแปลงได้
  hints:
  - สัตว์ตัวเดียวกัน แต่ชื่อต่างกันในแต่ละภาษา
  - ใครเป็นคนกำหนดว่าเสียงไหนแทนอะไร
  solution: '**เสียงกับความหมายสัมพันธ์กันตามข้อตกลงของสังคม**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sounds-of-thai.p012
  topics:
  - thai.grammar.sounds-of-thai
  difficulty: 4
  type: mcq
  stem: ข้อใด **ไม่ใช่** ลักษณะของภาษาไทย
  choices:
  - id: a
    text: คำนามเปลี่ยนรูปเมื่อเป็นพหูพจน์
    correct: true
    feedback: ถูก ภาษาไทยใช้คำบอกจำนวนแทน เช่น นักเรียนหลายคน
  - id: b
    text: มีลักษณนาม
    feedback: เป็นลักษณะของภาษาไทย เช่น แมว 2 ตัว
  - id: c
    text: คำขยายอยู่หลังคำที่ถูกขยาย
    feedback: เป็นลักษณะของภาษาไทย เช่น บ้านใหญ่
  - id: d
    text: เสียงวรรณยุกต์ทำให้ความหมายต่างกัน
    feedback: เป็นลักษณะของภาษาไทย เช่น ขาว กับ ข้าว
  hints:
  - ภาษาไทยเป็นภาษาคำโดด
  - คำไทยไม่เปลี่ยนรูปตามจำนวน
  solution: ภาษาไทย**ไม่เปลี่ยนรูปคำนามตามจำนวน** (ภาษาอังกฤษ book → books)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sounds-of-thai.p013
  topics:
  - thai.grammar.sounds-of-thai
  difficulty: 4
  type: mcq
  stem: คำว่า "ออนไลน์" "แอปพลิเคชัน" เพิ่งมีใช้ในภาษาไทยไม่กี่สิบปีมานี้ แสดงธรรมชาติของภาษาข้อใด
  choices:
  - id: a
    text: ภาษาเปลี่ยนแปลงได้ตามเวลาและสังคม
    correct: true
    feedback: ถูก มีคำใหม่เกิดขึ้นเมื่อมีสิ่งใหม่
  - id: b
    text: ภาษาใช้เสียงสื่อความหมาย
    feedback: จริง แต่ไม่ใช่ประเด็นของตัวอย่างนี้
  - id: c
    text: หน่วยเล็กประกอบเป็นหน่วยใหญ่
    feedback: จริง แต่ตัวอย่างนี้เน้นการเกิดคำใหม่
  - id: d
    text: ภาษาไทยเป็นภาษาคำโดด
    feedback: ไม่เกี่ยวกับการเกิดคำใหม่
  hints:
  - คำเหล่านี้เมื่อห้าสิบปีก่อนมีไหม
  - การมีคำใหม่แปลว่าภาษาเป็นอย่างไร
  solution: '**ภาษาเปลี่ยนแปลงได้** มีคำใหม่ตามสิ่งใหม่ในสังคม'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sounds-of-thai.p014
  topics:
  - thai.grammar.sounds-of-thai
  difficulty: 4
  type: order
  stem: เรียงหน่วยของภาษาจาก **เล็กที่สุด** ไป **ใหญ่ที่สุด**
  items:
  - เสียง
  - พยางค์
  - คำ
  - วลี
  - ประโยค
  hints:
  - เสียงหลายเสียงรวมเป็นพยางค์
  - วลียังไม่ครบความ ประโยคครบความ
  solution: เสียง → พยางค์ → คำ → วลี → ประโยค
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.sounds-of-thai.p015
  topics:
  - thai.grammar.sounds-of-thai
  difficulty: 5
  type: mcq
  stem: คำว่า คา ข่า ค่า ค้า ขา ความหมายต่างกันทั้งห้าคำ ข้อใดอธิบาย **ถูกต้องที่สุด**
  choices:
  - id: a
    text: ห้าคำมีเสียงพยัญชนะและเสียงสระเดียวกัน ต่างกันเพียงเสียงวรรณยุกต์ 5 เสียง
    correct: true
    feedback: ถูก /ค/ + /อา/ เหมือนกัน วรรณยุกต์ สามัญ เอก โท ตรี จัตวา
  - id: b
    text: ห้าคำใช้รูปวรรณยุกต์ต่างกัน 5 รูป
