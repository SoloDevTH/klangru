<rect x="0" y="0" width="860" height="470" fill="#fff"/>
<text x="20.0" y="34.0" font-size="21" text-anchor="start" fill="#1f5fbf" font-weight="bold">บริบทช่วยเดาความหมายของคำยาก</text>
<rect x="20.0" y="60.0" width="820.0" height="60.0" rx="6" fill="#f7f7f7" stroke="#999" stroke-width="1.5"/>
