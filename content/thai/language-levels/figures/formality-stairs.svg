<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="sans-serif">
<title>บันไดระดับภาษา 5 ระดับ และการจัดเป็น 3 ระดับ</title>
<rect x="0" y="0" width="880" height="440" fill="#fff"/>
<text x="20.0" y="38.0" font-size="20" text-anchor="start" fill="#111" font-weight="bold">ระดับภาษา 5 ระดับ (สูงสุด = เป็นทางการมากที่สุด)</text>
<text x="800.0" y="38.0" font-size="18" text-anchor="middle" fill="#333" font-weight="bold">แบบ 3 ระดับ</text>
<rect x="10.0" y="72.0" width="860.0" height="124.0" rx="8" fill="#eef0fb" stroke="none" stroke-width="0"/>
<text x="800.0" y="141.0" font-size="19" text-anchor="middle" fill="#333" font-weight="bold">ทางการ</text>
<rect x="10.0" y="200.0" width="860.0" height="60.0" rx="8" fill="#eaf6ee" stroke="none" stroke-width="0"/>
<text x="800.0" y="237.0" font-size="19" text-anchor="middle" fill="#333" font-weight="bold">กึ่งทางการ</text>
<rect x="10.0" y="264.0" width="860.0" height="124.0" rx="8" fill="#fbf1e6" stroke="none" stroke-width="0"/>
<text x="800.0" y="333.0" font-size="19" text-anchor="middle" fill="#333" font-weight="bold">ไม่เป็นทางการ</text>
<rect x="300.0" y="76.0" width="116.0" height="52.0" rx="4" fill="#7d3c98" stroke="#222" stroke-width="1.5"/>
<text x="358.0" y="110.0" font-size="20" text-anchor="middle" fill="#fff" font-weight="bold">พิธีการ</text>
<text x="430.0" y="110.0" font-size="18" text-anchor="start" fill="#222" font-weight="normal">กล่าวเปิดงาน สุนทรพจน์ในพิธี</text>
<rect x="230.0" y="140.0" width="116.0" height="52.0" rx="4" fill="#1f5fbf" stroke="#222" stroke-width="1.5"/>
<text x="288.0" y="174.0" font-size="20" text-anchor="middle" fill="#fff" font-weight="bold">ทางการ</text>
<text x="360.0" y="174.0" font-size="18" text-anchor="start" fill="#222" font-weight="normal">หนังสือราชการ ข่าว รายงานวิชาการ</text>
<rect x="160.0" y="204.0" width="116.0" height="52.0" rx="4" fill="#1e8449" stroke="#222" stroke-width="1.5"/>
<text x="218.0" y="238.0" font-size="20" text-anchor="middle" fill="#fff" font-weight="bold">กึ่งทางการ</text>
<text x="290.0" y="238.0" font-size="18" text-anchor="start" fill="#222" font-weight="normal">ประชุมกลุ่ม อภิปราย บทความ</text>
<rect x="90.0" y="268.0" width="116.0" height="52.0" rx="4" fill="#b9770e" stroke="#222" stroke-width="1.5"/>
<text x="148.0" y="302.0" font-size="20" text-anchor="middle" fill="#fff" font-weight="bold">สนทนา</text>
<text x="220.0" y="302.0" font-size="18" text-anchor="start" fill="#222" font-weight="normal">คุยกับครู คนที่ไม่สนิท ซื้อของ</text>
<rect x="20.0" y="332.0" width="116.0" height="52.0" rx="4" fill="#c0392b" stroke="#222" stroke-width="1.5"/>
<text x="78.0" y="366.0" font-size="20" text-anchor="middle" fill="#fff" font-weight="bold">กันเอง</text>
<text x="150.0" y="366.0" font-size="18" text-anchor="start" fill="#222" font-weight="normal">เพื่อนสนิท คนในครอบครัว</text>
<text x="440.0" y="418.0" font-size="17" text-anchor="middle" fill="#444" font-weight="normal">ตำราบางเล่มแบ่ง 5 ระดับ บางเล่มรวมเป็น 3 ระดับ (แถบสีด้านหลัง)</text>
</svg>
