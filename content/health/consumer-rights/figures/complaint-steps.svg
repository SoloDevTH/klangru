<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="sans-serif">
<title>สี่ขั้นการร้องเรียน</title>
<rect x="0" y="0" width="760" height="250" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="380.0" y="28.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">ร้องเรียนอย่างไรให้ได้ผล</text>
<rect x="20.0" y="60.0" width="165.0" height="130.0" rx="10" fill="#fadbd8" stroke="#333" stroke-width="1.5"/>
<text x="102.5" y="94.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">1 หยุดใช้</text>
<text x="102.5" y="128.0" font-size="12" text-anchor="middle" fill="#111">ดูแลสุขภาพก่อน</text>
<text x="102.5" y="148.0" font-size="12" text-anchor="middle" fill="#111">ถ้าบาดเจ็บไปพบแพทย์</text>
<line x1="188.0" y1="125.0" x2="204.0" y2="125.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="207.0" y="60.0" width="165.0" height="130.0" rx="10" fill="#fcf3cf" stroke="#333" stroke-width="1.5"/>
<text x="289.5" y="94.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">2 เก็บหลักฐาน</text>
<text x="289.5" y="128.0" font-size="12" text-anchor="middle" fill="#111">ใบเสร็จ ฉลาก ภาพถ่าย</text>
<text x="289.5" y="148.0" font-size="12" text-anchor="middle" fill="#111">แชตและโฆษณา</text>
<line x1="375.0" y1="125.0" x2="391.0" y2="125.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="394.0" y="60.0" width="165.0" height="130.0" rx="10" fill="#d6eaf8" stroke="#333" stroke-width="1.5"/>
<text x="476.5" y="94.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">3 ติดต่อผู้ขาย</text>
<text x="476.5" y="128.0" font-size="12" text-anchor="middle" fill="#111">บอกปัญหาและ</text>
<text x="476.5" y="148.0" font-size="12" text-anchor="middle" fill="#111">สิ่งที่ต้องการ</text>
<line x1="562.0" y1="125.0" x2="578.0" y2="125.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="581.0" y="60.0" width="165.0" height="130.0" rx="10" fill="#d5f5e3" stroke="#333" stroke-width="1.5"/>
<text x="663.5" y="94.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">4 ร้องเรียนหน่วยงาน</text>
<text x="663.5" y="128.0" font-size="12" text-anchor="middle" fill="#111">ระบุชื่อ เหตุการณ์ หลักฐาน</text>
<text x="663.5" y="148.0" font-size="12" text-anchor="middle" fill="#111">แล้วติดตามผล</text>
<text x="380.0" y="225.0" font-size="12.5" text-anchor="middle" fill="#333">ผู้ที่อายุไม่ถึง 18 ปี ให้ผู้ปกครองช่วยดำเนินการ</text>
</svg>
