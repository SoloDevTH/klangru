problems:
  - id: biology.ecology.populations.p001
    topics: [biology.ecology.populations]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นประชากร"
    choices:
      - { id: a, text: "นกเงือกกรามช้างทั้งหมดในเขตรักษาพันธุ์สัตว์ป่าห้วยขาแข้งในปีนี้", correct: true }
      - { id: b, text: "นกทุกชนิดในเขตรักษาพันธุ์สัตว์ป่าห้วยขาแข้ง", feedback: "นกหลายชนิดรวมกันเป็นส่วนหนึ่งของกลุ่มสิ่งมีชีวิต ไม่ใช่ประชากร" }
      - { id: c, text: "สิ่งมีชีวิตทั้งหมดกับดิน น้ำ และอากาศในป่า", feedback: "รวมสิ่งไม่มีชีวิตด้วยคือระบบนิเวศ" }
      - { id: d, text: "นกเงือกกรามช้างหนึ่งตัว", feedback: "หนึ่งตัวเป็นสิ่งมีชีวิตหนึ่งตัว ประชากรต้องเป็นกลุ่ม" }
    hints:
      - "ประชากรคือสิ่งมีชีวิตชนิดเดียวกัน"
      - "ต้องอยู่ในพื้นที่เดียวกันและเวลาเดียวกัน"
    solution: "ประชากรคือสิ่งมีชีวิตชนิดเดียวกันในพื้นที่และเวลาเดียวกัน นกเงือกกรามช้างทั้งหมดในห้วยขาแข้งในปีนี้จึงเป็นประชากร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.populations.p002
    topics: [biology.ecology.populations]
    difficulty: 1
    type: match
    stem: "จับคู่รูปแบบการกระจายของประชากรกับตัวอย่าง"
    pairs:
      - { left: "แบบกลุ่ม", right: "ช้างป่าอยู่รวมกันเป็นโขลง" }
      - { left: "แบบสม่ำเสมอ", right: "ต้นยางพาราในสวนที่ปลูกเป็นแถว" }
      - { left: "แบบสุ่ม", right: "ต้นไม้ที่เมล็ดปลิวไปตกตามลม" }
    hints:
      - "แบบสม่ำเสมอมีระยะห่างเท่า ๆ กัน"
      - "แบบสุ่มไม่มีรูปแบบชัดเจน"
    solution: "ช้างอยู่เป็นโขลงคือแบบกลุ่ม ยางพาราที่ปลูกเป็นแถวคือแบบสม่ำเสมอ ต้นไม้จากเมล็ดที่ลมพาไปคือแบบสุ่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.populations.p003
    topics: [biology.ecology.populations]
    difficulty: 1
    type: text
    stem: "ขนาดประชากรสูงสุดที่สภาพแวดล้อมหนึ่งรองรับได้อย่างยั่งยืน แทนด้วยตัวอักษร K เรียกว่าอะไร"
    accepted: ["ความสามารถในการรองรับ", "ความสามารถในการรองรับของสภาพแวดล้อม", "carrying capacity", "ขีดความสามารถในการรองรับ"]
    misconceptions:
      - { match: "ความหนาแน่น", feedback: "ความหนาแน่นคือจำนวนต่อพื้นที่ ไม่ใช่ขนาดสูงสุดที่รองรับได้" }
      - { match: "อัตราการเพิ่ม", feedback: "อัตราการเพิ่มแทนด้วย r" }
    hints:
      - "เป็นเส้นที่กราฟรูปตัว S ราบลงไปหา"
      - "ขึ้นกับอาหาร น้ำ และที่อยู่ที่สภาพแวดล้อมให้ได้"
    solution: "K คือความสามารถในการรองรับ ขนาดประชากรสูงสุดที่สภาพแวดล้อมรองรับได้ ประชากรแบบลอจิสติกจะเพิ่มจนคงที่ใกล้ค่านี้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.populations.p004
    topics: [biology.ecology.populations]
    difficulty: 2
    type: numeric
    stem: "นักเรียนวางแปลงขนาด 1 m² จำนวน 10 แปลงในป่าชายเลน นับต้นกล้าแสมได้ 3, 5, 2, 0, 4, 6, 1, 3, 2, 4 ต้น ความหนาแน่นเฉลี่ยของต้นกล้าแสมเป็นกี่ต้นต่อตารางเมตร"
    answer: { value: 3, unit: "ต้น/m²" }
    misconceptions:
      - { match: 30, feedback: "30 คือจำนวนรวมทั้ง 10 แปลง ต้องหารด้วยพื้นที่รวม 10 m²" }
      - { match: 3.33, feedback: "หารด้วย 9 เพราะไม่นับแปลงที่ได้ 0 ต้น แปลงนั้นก็เป็นข้อมูลที่ต้องนับ" }
    hints:
      - "รวมจำนวนต้นในทุกแปลง"
      - "หารด้วยพื้นที่ทั้งหมด 10 m² รวมแปลงที่ไม่พบต้นด้วย"
    solution: "รวม $3+5+2+0+4+6+1+3+2+4 = 30$ ต้น ในพื้นที่ 10 m² ความหนาแน่น $30 \\div 10 = 3$ ต้นต่อตารางเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.populations.p005
    topics: [biology.ecology.populations]
    difficulty: 2
    type: numeric
    stem: "จับปลาตะเพียนในหนองน้ำได้ 40 ตัว ทำเครื่องหมายแล้วปล่อยคืน ต่อมาจับได้ 45 ตัว มีเครื่องหมาย 9 ตัว หนองน้ำนี้มีปลาตะเพียนประมาณกี่ตัว"
    answer: { value: 200, unit: "ตัว" }
    misconceptions:
      - { match: 8, feedback: "ใช้สูตรผิดเป็น M × R ÷ C ต้องเป็น M × C ÷ R" }
      - { match: 85, feedback: "บวกจำนวนจับสองครั้ง ปลาบางตัวถูกจับซ้ำ และปลาที่ไม่เคยถูกจับยังมีอีกมาก" }
    hints:
      - "M = 40, C = 45, R = 9"
      - "$N = \\frac{M \\times C}{R}$"
    solution: "$N = \\frac{40 \\times 45}{9} = \\frac{1{,}800}{9} = 200$ ตัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.populations.p006
    topics: [biology.ecology.populations]
    difficulty: 2
    type: mcq
    stem: "หอยแครงวางไข่ครั้งละจำนวนมาก ลูกหอยส่วนใหญ่ถูกกินหรือตายตั้งแต่ยังเป็นตัวอ่อน ตัวที่รอดถึงโตเต็มวัยจึงมีน้อยแต่มักอยู่ได้อีกนาน เส้นโค้งการรอดชีวิตของหอยแครงน่าจะเป็นแบบใด"
    choices:
      - { id: a, text: "แบบที่ 3", correct: true }
      - { id: b, text: "แบบที่ 1", feedback: "แบบที่ 1 ส่วนใหญ่รอดจนแก่ เช่น คนและช้าง" }
      - { id: c, text: "แบบที่ 2", feedback: "แบบที่ 2 ตายในอัตราใกล้เคียงกันทุกช่วงอายุ" }
      - { id: d, text: "ไม่มีเส้นโค้งการรอดชีวิต เพราะเป็นสัตว์ไม่มีกระดูกสันหลัง", feedback: "สิ่งมีชีวิตทุกชนิดมีรูปแบบการรอดชีวิตตามอายุ" }
    hints:
      - "ช่วงอายุใดที่ตายมากที่สุด"
      - "ดูภาพเส้นโค้งการรอดชีวิต เส้นใดลดลงชันตั้งแต่อายุน้อย"
    solution: "ตายมากตอนเป็นตัวอ่อนแล้วตัวที่รอดอยู่ได้นาน ตรงกับแบบที่ 3 ซึ่งพบในสัตว์ที่ให้ลูกจำนวนมากแต่ไม่เลี้ยงดูลูก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.populations.p007
    topics: [biology.ecology.populations]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นปัจจัยที่ขึ้นกับความหนาแน่นของประชากร (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "โรคระบาดในฟาร์มไก่ที่เลี้ยงหนาแน่น", correct: true }
      - { id: b, text: "การแย่งอาหารของหนอนผีเสื้อบนต้นไม้ต้นเดียว", correct: true }
      - { id: c, text: "น้ำท่วมฉับพลันที่พัดพารังมดทั้งหมด", feedback: "น้ำท่วมทำลายรังมดไม่ว่าจะมีมดมากหรือน้อย จึงไม่ขึ้นกับความหนาแน่น" }
      - { id: d, text: "อากาศหนาวจัดผิดปกติที่ทำให้ปลาในบ่อตาย", feedback: "อากาศหนาวมีผลไม่ว่าประชากรจะมากหรือน้อย" }
    hints:
      - "ถ้าประชากรหนาแน่นขึ้น ผลของปัจจัยนั้นรุนแรงขึ้นหรือไม่"
      - "ปัจจัยทางชีวภาพ เช่น โรคและการแข่งขัน มักขึ้นกับความหนาแน่น"
    solution: "โรคแพร่ง่ายและการแย่งอาหารรุนแรงขึ้นเมื่อประชากรหนาแน่น จึงขึ้นกับความหนาแน่น ส่วนน้ำท่วมและอากาศหนาวจัดมีผลไม่ว่าประชากรจะมากหรือน้อย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.populations.p008
    topics: [biology.ecology.populations]
    difficulty: 3
    type: mcq
    stem: "จากภาพพีระมิดอายุ ประชากรใดน่าจะมีจำนวนลดลงในอนาคตถ้าไม่มีการอพยพเข้า"
    figure: { src: age-structure.svg, alt: "พีระมิดอายุ 3 รูป 8 ชั้น ชั้นล่างคือวัยเด็ก ชั้นบนคือวัยสูงอายุ ร้อยละจากล่างขึ้นบน ประชากร ก 30, 26, 22, 18, 14, 10, 6, 3 ประชากร ข 16, 16, 15, 15, 14, 13, 10, 6 ประชากร ค 10, 12, 14, 16, 17, 16, 14, 10" }
    choices:
      - { id: a, text: "ประชากร ค", correct: true }
      - { id: b, text: "ประชากร ก", feedback: "ฐานกว้างแปลว่ามีวัยเด็กมาก ซึ่งจะเข้าสู่วัยเจริญพันธุ์ ประชากรจึงเพิ่ม" }
      - { id: c, text: "ประชากร ข", feedback: "วัยเด็กใกล้เคียงกับวัยเจริญพันธุ์ ประชากรค่อนข้างคงที่" }
      - { id: d, text: "ทั้งสามประชากรเพิ่มขึ้นเท่ากัน", feedback: "รูปร่างพีระมิดต่างกันมาก แนวโน้มจึงต่างกัน" }
    hints:
      - "ฐานของพีระมิดคือวัยเด็ก ซึ่งจะกลายเป็นพ่อแม่ในอนาคต"
      - "พีระมิดใดมีฐานแคบกว่าส่วนกลาง"
    solution: "ประชากร ค มีวัยเด็กน้อยกว่าวัยเจริญพันธุ์ เมื่อวัยเด็กกลุ่มนี้โตขึ้น จำนวนพ่อแม่และการเกิดจะลดลง ประชากรจึงมีแนวโน้มลดลง ส่วน ก กำลังเพิ่ม และ ข ค่อนข้างคงที่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.populations.p009
    topics: [biology.ecology.populations]
    difficulty: 3
    type: numeric
    stem: "ประชากรหนึ่งมี r = 0.5 ต่อสัปดาห์ และ K = 1,000 ตัว เมื่อมี N = 200 ตัว ประชากรเพิ่มขึ้นในอัตรากี่ตัวต่อสัปดาห์ ตามสมการ $\\frac{dN}{dt} = rN\\left(\\frac{K-N}{K}\\right)$"
    answer: { value: 80, unit: "ตัวต่อสัปดาห์" }
    misconceptions:
      - { match: 100, feedback: "ใช้สูตรเอ็กซ์โพเนนเชียล rN ลืมคูณสัดส่วนที่ว่างเหลือ (K − N)/K" }
      - { match: 20, feedback: "ใช้ N/K แทน (K − N)/K ต้องใช้ส่วนที่ยังว่างอยู่" }
    hints:
      - "หา $\\frac{K - N}{K}$ ก่อน"
      - "$0.5 \\times 200 \\times \\frac{800}{1{,}000}$"
    solution: "$\\frac{dN}{dt} = 0.5 \\times 200 \\times \\frac{1{,}000 - 200}{1{,}000} = 100 \\times 0.8 = 80$ ตัวต่อสัปดาห์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.populations.p010
    topics: [biology.ecology.populations]
    difficulty: 3
    type: numeric
    stem: "แบคทีเรียในแกงที่ทิ้งไว้นอกตู้เย็นเริ่มต้น 20 เซลล์ และเพิ่มเป็น 2 เท่าทุก 3 ชั่วโมง ถ้าทรัพยากรไม่จำกัด ผ่านไป 12 ชั่วโมงจะมีกี่เซลล์"
    answer: { value: 320, unit: "เซลล์" }
    misconceptions:
      - { match: 80, feedback: "คูณด้วยจำนวนครั้งที่แบ่ง (4) แทนที่จะคูณด้วย 2 สี่ครั้ง" }
      - { match: 160, feedback: "นับการแบ่งได้ 3 ครั้ง แต่ 12 ชั่วโมงมี 4 ช่วงช่วงละ 3 ชั่วโมง" }
    hints:
      - "12 ชั่วโมงเพิ่มเป็น 2 เท่ากี่ครั้ง"
      - "$N = 20 \\times 2^n$"
    solution: "12 ÷ 3 = 4 ครั้ง $N = 20 \\times 2^4 = 320$ เซลล์ การเพิ่มแบบเอ็กซ์โพเนนเชียลนี้เป็นเหตุผลที่ไม่ควรทิ้งอาหารไว้ในอุณหภูมิห้องนาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.populations.p011
    topics: [biology.ecology.populations]
    difficulty: 3
    type: mcq
    stem: "จากกราฟการเพิ่มแบบลอจิสติก (K = 1,000) ประชากรเพิ่มเร็วที่สุดในช่วงใด"
    figure: { src: growth-curves.svg, alt: "กราฟจำนวนประชากรกับเวลา 0 ถึง 20 สัปดาห์ เส้นแบบลอจิสติกสีน้ำเงินรูปตัว S เริ่มที่ 20 ตัว เพิ่มช้าในช่วงแรก ชันที่สุดเมื่อประชากรราว 500 ตัวราวสัปดาห์ที่ 8 แล้วราบลงเข้าใกล้ 1,000 ตัวหลังสัปดาห์ที่ 16 เส้นแบบเอ็กซ์โพเนนเชียลสีแดงรูปตัว J พุ่งขึ้นเรื่อย ๆ มีเส้นประที่ K = 1,000 และ K/2 = 500" }
    choices:
      - { id: a, text: "เมื่อประชากรราว 500 ตัว ราวสัปดาห์ที่ 8", correct: true }
      - { id: b, text: "ช่วงแรกที่ประชากรเพิ่งเริ่มต้น", feedback: "ช่วงแรกประชากรน้อย จำนวนที่เพิ่มต่อสัปดาห์จึงน้อย แม้ทรัพยากรเหลือมาก" }
      - { id: c, text: "เมื่อประชากรใกล้ 1,000 ตัว", feedback: "ใกล้ K ทรัพยากรเหลือน้อย การเพิ่มจึงช้าจนเกือบหยุด" }
      - { id: d, text: "ทุกช่วงเพิ่มเร็วเท่ากัน", feedback: "ความชันของกราฟรูปตัว S เปลี่ยนไปตามเวลา" }
    hints:
      - "อัตราการเพิ่มคือความชันของกราฟ"
      - "ความชันมากที่สุดอยู่ที่ใดบนกราฟรูปตัว S"
    solution: "ความชันของกราฟรูปตัว S มากที่สุดเมื่อ N = K/2 = 500 ตัว ราวสัปดาห์ที่ 8 เพราะเป็นจุดที่ทั้งจำนวนพ่อแม่และทรัพยากรที่เหลือยังมากพอ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.populations.p012
    topics: [biology.ecology.populations]
    difficulty: 4
    type: numeric
    stem: "จากการสำรวจต้นกล้าแสมด้วยแปลง 1 m² ได้ความหนาแน่นเฉลี่ย 3 ต้นต่อตารางเมตร ถ้าพื้นที่ป่าชายเลนที่ฟื้นฟูมีขนาด 50 m × 50 m และการกระจายใกล้เคียงกันทั้งพื้นที่ จะมีต้นกล้าแสมประมาณกี่ต้น"
    answer: { value: 7500, unit: "ต้น" }
    misconceptions:
      - { match: 300, feedback: "ใช้ความยาวรอบรูปหรือบวก 50 + 50 แทนพื้นที่ พื้นที่คือ 50 × 50 = 2,500 m²" }
      - { match: 2500, feedback: "2,500 คือพื้นที่ ต้องคูณด้วยความหนาแน่น 3 ต้นต่อตารางเมตร" }
    hints:
      - "หาพื้นที่ทั้งหมดเป็นตารางเมตร"
      - "จำนวน = ความหนาแน่น × พื้นที่"
    solution: "พื้นที่ $50 \\times 50 = 2{,}500$ m² จำนวน $3 \\times 2{,}500 = 7{,}500$ ต้น ค่านี้น่าเชื่อถือเมื่อวางแปลงแบบสุ่มหลายแปลงและการกระจายไม่ต่างกันมาก"
