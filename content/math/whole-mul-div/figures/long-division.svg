  <text x="260.0" y="108.0" font-size="24" text-anchor="middle" fill="#15211e">5</text>
  <text x="290.0" y="108.0" font-size="24" text-anchor="middle" fill="#15211e">8</text>
  <text x="200.0" y="146.0" font-size="24" text-anchor="middle" fill="#15211e">1</text>
  <text x="230.0" y="146.0" font-size="24" text-anchor="middle" fill="#15211e">2</text>
