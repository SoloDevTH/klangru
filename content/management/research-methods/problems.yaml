    stem: "งานวิจัยรายงานว่า p = 0.03 เมื่อกำหนดระดับนัยสำคัญไว้ที่ 0.05 ข้อใดตีความได้ถูกต้องที่สุด"
    choices:
      - { id: a, text: "มีโอกาส 97% ที่สมมติฐานวิจัยเป็นจริง", feedback: "ค่า p ไม่ใช่โอกาสที่สมมติฐานวิจัยจะเป็นจริง" }
      - { id: b, text: "ถ้าสมมติฐานว่างเป็นจริง โอกาสได้ผลที่ห่างจากสมมติฐานว่างเท่านี้หรือมากกว่าประมาณ 3% จึงปฏิเสธสมมติฐานว่างที่ระดับ 0.05", correct: true }
      - { id: c, text: "ขนาดของผลที่พบมีเพียง 3% ของค่าทั้งหมด", feedback: "ค่า p ไม่ได้บอกขนาดของผลโดยตรง ต้องดูค่าขนาดผลประกอบ" }
      - { id: d, text: "ความน่าจะเป็นที่งานวิจัยนี้ผิดคือ 3%", feedback: "ค่า p ไม่ใช่ความน่าจะเป็นที่งานวิจัยผิด เป็นความน่าจะเป็นของข้อมูลภายใต้สมมติฐานว่าง" }
    hints:
      - "ค่า p คือความน่าจะเป็นของข้อมูล เมื่อสมมติว่าสมมติฐานว่างเป็นจริง"
      - "ตัวเลือกที่ถูกไม่ได้พูดถึงความน่าจะเป็นของสมมติฐานวิจัยหรือความผิดพลาดของงานวิจัย"
    solution: "ค่า p = 0.03 หมายความว่า ถ้าสมมติฐานว่างเป็นจริง โอกาสได้ผลเท่านี้หรือมากกว่าอยู่ที่ราว 3% ซึ่งน้อยกว่า 0.05 จึงปฏิเสธสมมติฐานว่างได้ตามเกณฑ์ ค่านี้ไม่บอกว่าผลใหญ่หรือสำคัญ และไม่ใช่โอกาสที่งานวิจัยผิด"
