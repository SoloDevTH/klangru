id: english.reading.main-idea
subject: english
title: { th: "การจับใจความสำคัญ รายละเอียดสนับสนุน และการสรุป", en: "Main idea, supporting details and summarising" }
summary: แยกหัวข้อ ใจความสำคัญ และรายละเอียดสนับสนุน อ่านแบบ skimming และ scanning เดาคำจากบริบท สรุปความ หาแก่นเรื่อง และแสดงความเห็นพร้อมเหตุผล
difficulty: 4
minutes: 40
prerequisites: [english.grammar.questions, english.grammar.connectors]
encompasses:
  - { id: english.grammar.connectors, weight: 0.3 }
  - { id: english.grammar.questions, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: main-idea-table.svg
    alt: "ภาพโต๊ะ ด้านบนสุดเป็นป้าย TOPIC: mangrove forests มีลูกศรชี้ลงไปที่พื้นโต๊ะ พื้นโต๊ะเขียนว่า MAIN IDEA: Mangrove forests protect the coast of Thailand. มีขาโต๊ะสามขา แต่ละขาต่อกับกล่องรายละเอียด: Their roots stop waves from washing away the land. / They are homes for young fish, crabs and shrimps. / The trees store carbon from the air. ด้านล่างเขียนว่า SUPPORTING DETAILS (รายละเอียดสนับสนุน)"
    caption: "หัวข้อ ใจความสำคัญ (พื้นโต๊ะ) และรายละเอียดสนับสนุน (ขาโต๊ะ)"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.reading.main-idea.p003, prompt: "ประโยคไหนที่ประโยคอื่นช่วยพิสูจน์" }
  - type: figure
    src: school-newsletter.svg
    alt: "จดหมายข่าวสมมุติ BAN NONG BUA SCHOOL NEWS ฉบับ November 2026 มีสามข่าว ข่าวที่ 1 Book Fair Is Coming!: Our book fair will be held in the school library from Monday 16 November to Friday 20 November, 8:30 a.m. – 4:00 p.m. Every student will get a 50-baht coupon. Don't miss it! ข่าวที่ 2 600 New Trees at Bang Pu: On Saturday 7 November, 45 students from M.2 and 38 students from M.3 planted 600 mangrove trees at Bang Pu, Samut Prakan. \"My feet were covered in mud, but it was fun,\" said Ploy (M.2). ข่าวที่ 3 Sports Day Winners: Congratulations to the Green Team! They won 12 gold medals. The Red Team came second with 9 gold medals, and the Blue Team came third with 7. The day ended with a picnic."
    caption: "จดหมายข่าวโรงเรียน (ข้อมูลสมมุติ) ใช้ในตัวอย่างและโจทย์"
  - type: worked-example
    title: สรุปข่าวปลูกป่าในประโยคเดียว
    problem: "อ่านข่าว *600 New Trees at Bang Pu* ในจดหมายข่าว แล้วสรุปใจความเป็นภาษาอังกฤษหนึ่งประโยค"
    steps:
      - text: "skim หัวข่าวและประโยคแรก: ข่าวนี้ว่าด้วยการปลูกป่าชายเลน"
      - text: "scan หาคำตอบ Who / What / When / Where: students from M.2 and M.3 · planted 600 mangrove trees · Saturday 7 November · Bang Pu, Samut Prakan"
      - text: "ตัดรายละเอียดเล็ก: คำพูดของ Ploy เรื่องโคลนเป็นสีสันของข่าว ไม่ต้องใส่ในข้อสรุป"
        why: "ข้อสรุปต้องสั้น มีแค่ใจความและข้อมูลหลัก"
      - text: "เรียบเรียงด้วยคำของตัวเอง: *On 7 November, 83 M.2 and M.3 students planted 600 mangrove trees at Bang Pu.*"
        why: "45 + 38 = 83 รวมจำนวนนักเรียนแทนการเขียนแยกสองตัวเลข"
    answer: "*On 7 November, 83 M.2 and M.3 students planted 600 mangrove trees at Bang Pu, Samut Prakan.*"
  - { type: check, problem: english.reading.main-idea.p009, prompt: "theme ต่างจาก topic อย่างไร" }
glossary:
  - { term: topic, definition: "หัวข้อเรื่อง เรื่องนี้พูดถึงอะไร เป็นคำหรือวลีสั้น" }
  - { term: main idea, definition: "ใจความสำคัญ สิ่งที่ผู้เขียนบอกเกี่ยวกับหัวข้อ เป็นประโยคเต็ม" }
  - { term: supporting detail, definition: "รายละเอียดสนับสนุน เหตุผล ตัวอย่าง หรือตัวเลขที่ทำให้ใจความน่าเชื่อ" }
  - { term: skimming, definition: "อ่านข้ามเพื่อจับภาพรวม อ่านชื่อเรื่อง ประโยคแรกและประโยคสุดท้าย" }
  - { term: scanning, definition: "กวาดตาหาข้อมูลเฉพาะ เช่น ชื่อ วันที่ ตัวเลข" }
  - { term: theme, definition: "แก่นเรื่อง ข้อคิดของนิทานหรือเรื่องสั้นที่ใช้ได้กับชีวิตจริง" }
  - { term: inference, definition: "การตีความจากหลักฐานในเรื่อง สิ่งที่ไม่ได้เขียนไว้ตรง ๆ" }
  - { term: non-fiction / fiction, definition: "สารคดี (เรื่องจริง เช่น ข่าว บทความ) / บันเทิงคดี (เรื่องแต่ง เช่น นิทาน เรื่องสั้น)" }
flashcards:
  - { front: "topic กับ main idea ต่างกันอย่างไร", back: "topic = คำหรือวลี (อะไร) · main idea = ประโยคที่บอกสิ่งที่ผู้เขียนคิดเกี่ยวกับหัวข้อ" }
  - { front: "skimming vs scanning", back: "skimming = จับภาพรวม · scanning = หาข้อมูลเฉพาะ (ชื่อ ตัวเลข วันที่)" }
  - { front: "ข้อสรุปที่ดีมีลักษณะอย่างไร", back: "สั้น ใช้คำของตัวเอง มีใจความและประเด็นหลัก ไม่มีความเห็นของผู้อ่าน" }
  - { front: "theme ของ The Ant and the Grasshopper", back: "It is wise to prepare for the future." }
  - { front: "แสดงความเห็นต่อเรื่องที่อ่านให้ครบ", back: "ความเห็น + เหตุผล (because) + ตัวอย่างจากเรื่อง (For example)" }
