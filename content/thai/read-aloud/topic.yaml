id: thai.reading.read-aloud
subject: thai
title: { th: การอ่านออกเสียงร้อยแก้วและร้อยกรอง, en: "Reading prose and poetry aloud" }
summary: อ่านออกเสียงคำ ข้อความ และเรื่องสั้นให้ถูกต้องคล่องแคล่ว คำที่อ่านไม่ตรงรูป การแบ่งวรรคตอน จังหวะกลอนสุภาพและกาพย์ยานี และหลักการอ่านทำนองเสนาะเบื้องต้น
difficulty: 2.5
minutes: 30
prerequisites: [thai.writing.spelling-basics, thai.writing.tone-rules]
encompasses:
  - { id: thai.writing.spelling-basics, weight: 0.3 }
  - { id: thai.writing.tone-rules, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: poem-rhythm.svg
    alt: "สองส่วน ส่วนบน กลอนสุภาพ วรรคละ 8 คำ อ่าน 3 / 2 / 3: ยามเช้าตรู่ / ดูฟ้า / สีทองผ่อง · นกร้องก้อง / กังวาน / เสียงแสนหวาน · ลมโชยพัด / ดอกไม้ / หอมทั่วลาน · เด็กสำราญ / ร่าเริง / ไปโรงเรียน สัมผัส ผ่อง–ก้อง หวาน–ลาน ลาน–(สำ)ราญ ส่วนล่าง กาพย์ยานี 11 วรรคหน้า 5 คำ (2 / 3) วรรคหลัง 6 คำ (3 / 3): เช้านี้ / ฟ้าแจ่มใส · ลมโชยไกล / พาชื่นบาน · นกน้อย / ร้องขับขาน · ทุกหัวใจ / สุขสดใส สัมผัส ใส–ไกล บาน–ขาน"
    caption: "แบ่งจังหวะอ่านกลอนสุภาพและกาพย์ยานี (บทตัวอย่างแต่งโดยคลังรู้)"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: เตรียมอ่านข้อความร้อยแก้ว
    problem: "เตรียมอ่านออกเสียง: \"ชาวบ้านช่วยกันปลูกผลไม้ริมตลาดเพื่อรักษาธรรมชาติ\""
    steps:
      - text: "หาคำที่อ่านไม่ตรงรูป: ผลไม้ (ผน-ละ-ไม้) ตลาด (ตะ-หลาด) ธรรมชาติ (ทำ-มะ-ชาด)"
      - text: "หาคำควบกล้ำและ ร ล: ปลูก (ปล ควบกล้ำแท้) รักษา (ร ชัด)"
      - text: "แบ่งวรรคตอน: ชาวบ้านช่วยกันปลูกผลไม้ / ริมตลาด / เพื่อรักษาธรรมชาติ"
        why: "หยุดตรงรอยต่อของกลุ่มความหมาย ไม่หยุดกลางคำ"
      - text: "เลือกน้ำเสียง: เป็นข่าวดีของชุมชน อ่านชัด เสียงสดใส"
    answer: "ชาวบ้านช่วยกันปลูก ผน-ละ-ไม้ / ริม ตะ-หลาด / เพื่อรักษา ทำ-มะ-ชาด"
  - { type: check, problem: thai.reading.read-aloud.p005, prompt: "อย่าหยุดกลางคำ" }
  - type: worked-example
    title: แบ่งจังหวะวรรคกลอน
    problem: "แบ่งจังหวะอ่านวรรคกลอนสุภาพ \"ลมโชยพัดดอกไม้หอมทั่วลาน\""
    steps:
      - text: "นับคำ: ลม โชย พัด ดอก ไม้ หอม ทั่ว ลาน = 8 คำ"
      - text: "กลอนสุภาพอ่าน 3 / 2 / 3: ลมโชยพัด / ดอกไม้ / หอมทั่วลาน"
      - text: "ตรวจว่าไม่ได้ตัดคำ: ดอกไม้ อยู่ในช่วงเดียวกัน"
        why: "ถ้าจังหวะตัดคำกลางคำ ผู้ฟังจะฟังไม่รู้เรื่อง"
      - text: "ลาน เป็นคำสัมผัสกับ หวาน ในวรรคก่อน จึงเน้นและทอดเสียงเล็กน้อย"
    answer: "ลมโชยพัด / ดอกไม้ / หอมทั่วลาน (เน้นคำ ลาน)"
  - { type: check, problem: thai.reading.read-aloud.p007, prompt: "นับคำก่อนแบ่ง" }
glossary:
  - { term: ร้อยแก้ว, definition: "ข้อความธรรมดาที่ไม่มีข้อบังคับเรื่องจำนวนคำและสัมผัส เช่น นิทาน ข่าว" }
  - { term: ร้อยกรอง, definition: "ข้อความที่แต่งตามแบบแผน มีจำนวนคำและสัมผัสกำหนด เช่น กลอน กาพย์ โคลง" }
  - { term: วรรคตอน, definition: "การเว้นช่วงหยุดเวลาอ่าน ช่วยให้ความหมายถูกต้อง" }
  - { term: คำที่อ่านไม่ตรงรูป, definition: "คำที่ออกเสียงต่างจากตัวเขียน เช่น ตลาด (ตะ-หลาด) ธรรมชาติ (ทำ-มะ-ชาด)" }
  - { term: ทำนองเสนาะ, definition: "การอ่านร้อยกรองให้มีทำนองไพเราะ แบ่งจังหวะ เน้นสัมผัส และทอดเสียง" }
flashcards:
  - { front: "อ่านออกเสียงที่ดีต้องเป็นอย่างไร", back: "ถูกต้อง คล่องแคล่ว และเหมาะสมกับเรื่อง" }
  - { front: "จังหวะกลอนสุภาพ", back: "วรรคละ 8 คำ อ่าน 3 / 2 / 3" }
  - { front: "จังหวะกาพย์ยานี 11", back: "วรรคหน้า 5 คำ (2 / 3) วรรคหลัง 6 คำ (3 / 3)" }
  - { front: "ธรรมชาติ อ่านว่า", back: "ทำ-มะ-ชาด" }
  - { front: "เสื้อที่ตากลมไว้ อ่าน ตากลม ว่า", back: "ตาก-ลม" }
