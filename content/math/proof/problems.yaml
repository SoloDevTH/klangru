problems:
  - id: math.geometry.proof.p001
    topics: [math.geometry.proof]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นการให้เหตุผลแบบนิรนัย"
    choices:
      - { id: a, text: "มุมตรงข้ามเท่ากันทุกคู่ เพราะแต่ละมุมรวมกับมุมเดียวกันได้ 180°", correct: true }
      - { id: b, text: "วัดมุมภายในของสามเหลี่ยม 20 รูป ได้ผลรวมประมาณ 180° ทุกรูป จึงสรุปว่าเป็นจริงเสมอ", feedback: "เป็นการสรุปจากตัวอย่าง (อุปนัย) ใช้ตั้งข้อคาดการณ์ได้ แต่ยังไม่ใช่การพิสูจน์" }
      - { id: c, text: "เส้นทแยงมุมในรูปนี้ดูตั้งฉากกัน จึงตั้งฉากกัน", feedback: "การดูจากรูปไม่ใช่เหตุผล รูปอาจวาดไม่แม่นยำ" }
      - { id: d, text: "ครูบอกว่าสมบัตินี้จริง จึงจริงทุกรูป", feedback: "การอ้างผู้อื่นไม่ใช่การพิสูจน์ ต้องมีเหตุผลจากนิยามหรือทฤษฎีบท" }
    hints:
      - "นิรนัยคือการให้เหตุผลจากข้อเท็จจริงทั่วไปที่ยอมรับแล้ว"
      - "ข้อใดใช้นิยามหรือสมบัติที่จริงเสมอ ไม่ใช่ตัวอย่างหรือการมอง"
    solution: "การอ้างว่ามุมตรงมีขนาด 180° เป็นข้อเท็จจริงทั่วไป ใช้ได้กับทุกคู่ของเส้นที่ตัดกัน จึงเป็นการให้เหตุผลแบบนิรนัย ข้ออื่นเป็นการสรุปจากตัวอย่าง จากการมอง หรือจากการอ้างผู้อื่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.proof.p002
    topics: [math.geometry.proof]
    difficulty: 1
    type: numeric
    stem: "เส้นตรงสองเส้นตัดกัน เกิดมุมหนึ่งขนาด 65° มุมที่อยู่ตรงข้ามกับมุมนี้มีขนาดกี่องศา"
    answer: { value: 65, unit: องศา }
    hints:
      - "มุมตรงข้ามคือมุมที่ไม่อยู่ติดกัน"
      - "มุมตรงข้ามเท่ากันเสมอ"
    misconceptions:
      - { match: 115, feedback: "115° คือมุมที่อยู่ติดกัน (รวมกันได้ 180°) ไม่ใช่มุมตรงข้าม" }
      - { match: 25, feedback: "คิดเป็นมุมประกอบฉาก แต่โจทย์ไม่มีมุมฉาก" }
    solution: "มุมตรงข้ามเท่ากัน จึงเป็น 65° (เพราะทั้งสองมุมรวมกับมุมที่อยู่ระหว่างกลางขนาด 115° ได้ 180°)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.proof.p003
    topics: [math.geometry.proof]
    difficulty: 2
    type: mcq
    stem: "ในภาพ เส้นตรง $l$ ขนานกับเส้นตรง $m$ และ $t$ เป็นเส้นตัด เหตุผลใดทำให้สรุปได้ว่า $x = y$"
    figure:
      src: transversal.svg
      alt: "เส้นตรง l และ m แนวนอนขนานกัน มีลูกศรบอกว่าขนาน เส้นตัด t เอียงตัดทั้งสองเส้น มุม x อยู่ที่จุดตัดบน เหนือเส้น l ทางขวาของ t มุม y อยู่ที่จุดตัดล่าง เหนือเส้น m ทางขวาของ t"
    choices:
      - { id: a, text: "มุมภายนอกและมุมภายในที่อยู่ตรงข้ามบนข้างเดียวกันของเส้นตัดมีขนาดเท่ากัน", correct: true }
      - { id: b, text: "มุมแย้งมีขนาดเท่ากัน", feedback: "มุมแย้งอยู่ระหว่างเส้นขนานและอยู่คนละข้างของเส้นตัด แต่ $x$ อยู่นอกเส้นขนานและทั้งสองมุมอยู่ข้างเดียวกันของ $t$" }
      - { id: c, text: "มุมตรงข้ามมีขนาดเท่ากัน", feedback: "มุมตรงข้ามต้องเกิดที่จุดตัดเดียวกัน แต่ $x$ กับ $y$ อยู่คนละจุดตัด" }
      - { id: d, text: "มุมภายในบนข้างเดียวกันของเส้นตัดรวมกันได้ 180°", feedback: "สมบัตินี้ใช้กับมุมที่อยู่ระหว่างเส้นขนานทั้งคู่ และให้ผลรวม ไม่ได้ให้ว่าเท่ากัน" }
    hints:
      - "ดูว่ามุมทั้งสองอยู่ข้างใดของเส้นตัด และอยู่ระหว่างหรือนอกเส้นขนาน"
      - "$x$ อยู่เหนือ $l$ (ภายนอก) $y$ อยู่เหนือ $m$ (ภายใน) ทั้งคู่อยู่ทางขวาของ $t$"
    solution: "$x$ เป็นมุมภายนอก $y$ เป็นมุมภายในที่อยู่ตรงข้ามบนข้างเดียวกันของเส้นตัด (มักเรียกว่ามุมสมนัย) เมื่อ $l \\parallel m$ มุมคู่นี้เท่ากัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.proof.p004
    topics: [math.geometry.proof]
    difficulty: 2
    type: numeric
    stem: "แปลงผักรูปสี่เหลี่ยมด้านขนาน ABCD มีด้าน AB ยาว $3x + 2$ เมตร และด้าน CD ยาว $5x - 6$ เมตร ด้าน AB ยาวกี่เมตร"
    answer: { value: 14, unit: เมตร }
    hints:
      - "ด้านตรงข้ามของสี่เหลี่ยมด้านขนานยาวเท่ากัน"
      - "ตั้งสมการ $3x + 2 = 5x - 6$ หา $x$ แล้วแทนกลับ"
    misconceptions:
      - { match: 4, feedback: "4 คือค่าของ $x$ ต้องแทนกลับใน $3x + 2$ เพื่อหาความยาว AB" }
    solution: "AB = CD (ด้านตรงข้ามของสี่เหลี่ยมด้านขนาน) $3x + 2 = 5x - 6 \\Rightarrow 8 = 2x \\Rightarrow x = 4$ ดังนั้น AB $= 3(4) + 2 = 14$ เมตร (ตรวจ: CD $= 5(4) - 6 = 14$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.proof.p005
    topics: [math.geometry.proof]
    difficulty: 2
    type: order
    stem: "กำหนดให้ △ABC มี AB = AC จงเรียงขั้นการพิสูจน์ว่า ∠B = ∠C"
    items:
      - "ลาก AD แบ่งครึ่ง ∠BAC ให้พบ BC ที่จุด D"
      - "AB = AC (กำหนดให้), ∠BAD = ∠CAD (AD แบ่งครึ่งมุม) และ AD เป็นด้านร่วม"
      - "△ABD ≅ △ACD ตามเงื่อนไข ด.ม.ด."
      - "∠B = ∠C เพราะเป็นมุมที่สมนัยกันของรูปที่เท่ากันทุกประการ"
    hints:
      - "ต้องสร้างสามเหลี่ยมสองรูปก่อน จึงจะเทียบกันได้"
      - "รวบรวมด้าน มุม ด้าน ให้ครบก่อนสรุปว่าเท่ากันทุกประการ"
    solution: "สร้างเส้นช่วย AD → รวบรวมข้อมูล ด้าน-มุม-ด้าน → สรุป △ABD ≅ △ACD → ได้มุมที่สมนัยกัน ∠B = ∠C"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.proof.p006
    topics: [math.geometry.proof]
    difficulty: 3
    type: mcq
    stem: "ในภาพ M เป็นจุดกึ่งกลางของ AB และ PA = PB ต้องการพิสูจน์ว่า PM ตั้งฉากกับ AB ขั้นแรกแสดงว่า △PMA ≅ △PMB ด้วยเงื่อนไขใด"
    figure:
      src: equidistant.svg
      alt: "ส่วนของเส้นตรง AB มีจุดกึ่งกลาง M ขีดหนึ่งขีดบอกว่า AM เท่ากับ MB จุด P อยู่ด้านบน ขีดสองขีดบอกว่า PA เท่ากับ PB เส้นประ PM ไม่มีเครื่องหมายมุมฉาก"
    choices:
      - { id: a, text: "ด.ด.ด. (PA = PB, AM = BM, PM ร่วม)", correct: true }
      - { id: b, text: "ด.ม.ด. (PA = PB, มุมฉากที่ M, PM ร่วม)", feedback: "ยังไม่รู้ว่ามุมที่ M เป็นมุมฉาก นั่นคือสิ่งที่ต้องการพิสูจน์ ใช้เป็นเหตุผลไม่ได้ (ให้เหตุผลวน)" }
      - { id: c, text: "ฉ.ด.ด.", feedback: "ฉ.ด.ด. ใช้กับสามเหลี่ยมมุมฉาก แต่ยังไม่รู้ว่าเป็นมุมฉาก" }
      - { id: d, text: "ม.ม.ม.", feedback: "ม.ม.ม. ไม่ใช่เงื่อนไขของความเท่ากันทุกประการ (ให้แค่ความคล้าย) และเรายังไม่รู้ขนาดมุม" }
    hints:
      - "ใช้เฉพาะสิ่งที่กำหนดให้และสิ่งที่เห็นว่าร่วมกัน ห้ามใช้สิ่งที่ต้องการพิสูจน์"
      - "มีด้านที่เท่ากันกี่คู่"
    solution: "PA = PB (กำหนดให้) AM = BM (M เป็นจุดกึ่งกลาง) PM = PM (ด้านร่วม) จึงได้ △PMA ≅ △PMB (ด.ด.ด.) แล้ว ∠PMA = ∠PMB และรวมกันได้ 180° แต่ละมุมจึงเป็น 90° นี่คือบทกลับ: จุดที่ห่างจาก A และ B เท่ากันอยู่บนเส้นแบ่งครึ่งตั้งฉาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.proof.p007
    topics: [math.geometry.proof]
    difficulty: 3
    type: numeric
    stem: "ในภาพ DE ลากผ่าน A ขนานกับ BC มุม DAB = 48° และมุม EAC = 62° มุม BAC มีขนาดกี่องศา"
    figure:
      src: parallel-apex.svg
      alt: "สามเหลี่ยม ABC มี A อยู่ด้านบน เส้นตรง DE ผ่าน A ขนานกับ BC มุมระหว่าง AD กับ AB เขียน 48 องศา มุมระหว่าง AC กับ AE เขียน 62 องศา มุม BAC เขียนเครื่องหมายคำถาม"
    answer: { value: 70, unit: องศา }
    hints:
      - "มุม DAB, BAC และ CAE เรียงกันบนเส้นตรง DE"
      - "มุมทั้งสามรวมกันเป็นมุมตรง"
    misconceptions:
      - { match: 110, feedback: "110° คือ 48° + 62° ต้องนำผลรวมนี้ไปลบออกจาก 180°" }
      - { match: 132, feedback: "ลบเพียง 48° ออกจาก 180° ต้องลบทั้ง 48° และ 62°" }
    solution: "∠DAB + ∠BAC + ∠CAE = 180° (มุมตรง) ∠BAC $= 180° - 48° - 62° = 70°$ (และจากมุมแย้ง ∠B = 48°, ∠C = 62° รวมสามมุมของสามเหลี่ยมได้ 180° พอดี)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.proof.p008
    topics: [math.geometry.proof]
    difficulty: 3
    type: mcq
    stem: "นักเรียนเขียนว่า \"△ABC กับ △DEF มี AB = DE = 7 ซม., AC = DF = 5 ซม. และ ∠B = ∠E = 40° จึงเท่ากันทุกประการ\" ข้อโต้แย้งนี้ผิดที่ใด"
    choices:
      - { id: a, text: "มุม 40° ไม่ได้อยู่ระหว่างด้านสองด้านที่เท่ากัน (เป็น ด.ด.ม.) ซึ่งไม่รับประกันความเท่ากันทุกประการ", correct: true }
      - { id: b, text: "ต้องรู้มุมทั้งสามมุมจึงจะสรุปได้", feedback: "รู้มุมทั้งสามก็ได้แค่ความคล้าย ไม่ใช่ความเท่ากันทุกประการ" }
      - { id: c, text: "ไม่ผิด เพราะมีด้านสองด้านและมุมหนึ่งมุมเท่ากัน", feedback: "ตำแหน่งของมุมสำคัญ ถ้ามุมไม่อยู่ระหว่างสองด้าน อาจสร้างสามเหลี่ยมได้สองรูปที่ต่างกัน" }
      - { id: d, text: "ต้องวัดด้านที่สามก่อน จึงจะใช้เงื่อนไขใดก็ได้", feedback: "ถ้ารู้ด้านที่สามจะใช้ ด.ด.ด. ได้ แต่ข้อโต้แย้งที่เขียนมาผิดเพราะใช้ ด.ด.ม." }
    hints:
      - "เงื่อนไข ด.ม.ด. ต้องให้มุมอยู่ตรงไหน"
      - "∠B อยู่ระหว่างด้าน AB กับ BC ไม่ใช่ระหว่าง AB กับ AC"
    solution: "∠B อยู่ระหว่าง AB กับ BC ไม่ได้อยู่ระหว่าง AB กับ AC จึงเป็นกรณี ด.ด.ม. ซึ่งสร้างสามเหลี่ยมได้สองแบบ (ด้าน AC ยาว 5 ซม. แกว่งไปตัดเส้นฐานได้สองจุด) ข้อสรุปจึงไม่สมเหตุสมผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.proof.p009
    topics: [math.geometry.proof]
    difficulty: 3
    type: match
    stem: "จับคู่ข้อสรุปกับเงื่อนไขที่ทำให้ข้อสรุปนั้นจริง"
    pairs:
      - { left: "มุมแย้งเท่ากัน", right: "เส้นตัดตัดเส้นตรงสองเส้นที่ขนานกัน" }
      - { left: "มุมตรงข้ามเท่ากัน", right: "เส้นตรงสองเส้นตัดกัน" }
      - { left: "เส้นทแยงมุมแบ่งครึ่งซึ่งกันและกัน", right: "รูปสี่เหลี่ยมเป็นสี่เหลี่ยมด้านขนาน" }
      - { left: "สี่เหลี่ยมด้านขนานเป็นสี่เหลี่ยมผืนผ้า", right: "เส้นทแยงมุมยาวเท่ากัน" }
      - { left: "จุด P ห่างจาก A และ B เท่ากัน", right: "P อยู่บนเส้นแบ่งครึ่งตั้งฉากของ AB" }
    hints:
      - "อ่านแต่ละคู่เป็นประโยค 'ถ้า (ขวา) แล้ว (ซ้าย)'"
      - "สมบัติของสี่เหลี่ยมด้านขนานพิสูจน์ได้จากการลากเส้นทแยงมุม"
    solution: "ถ้าเส้นขนาน แล้วมุมแย้งเท่ากัน; ถ้าเส้นสองเส้นตัดกัน แล้วมุมตรงข้ามเท่ากัน; ถ้าเป็นสี่เหลี่ยมด้านขนาน แล้วเส้นทแยงมุมแบ่งครึ่งกัน; ถ้าเส้นทแยงมุมของสี่เหลี่ยมด้านขนานยาวเท่ากัน แล้วเป็นสี่เหลี่ยมผืนผ้า; ถ้า P อยู่บนเส้นแบ่งครึ่งตั้งฉาก แล้ว PA = PB"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.proof.p010
    topics: [math.geometry.proof]
    difficulty: 4
    type: mcq
    stem: "จุด A(0, 0), B(4, 2), C(3, 4), D(−1, 2) ข้อใดสรุปถูกต้องพร้อมเหตุผลที่เพียงพอ"
    choices:
      - { id: a, text: "ABCD เป็นสี่เหลี่ยมผืนผ้า เพราะ AB = DC = (4, 2), BC = AD = (−1, 2) และ (4, 2)·(−1, 2) = 0", correct: true }
      - { id: b, text: "ABCD เป็นสี่เหลี่ยมจัตุรัส เพราะเส้นทแยงมุม AC และ BD ยาว 5 หน่วยเท่ากัน", feedback: "เส้นทแยงมุมเท่ากันบอกว่าเป็นสี่เหลี่ยมผืนผ้า (เมื่อเป็นสี่เหลี่ยมด้านขนาน) แต่ AB = $\\sqrt{20}$ กับ BC = $\\sqrt5$ ไม่เท่ากัน จึงไม่ใช่จัตุรัส" }
      - { id: c, text: "ABCD เป็นสี่เหลี่ยมขนมเปียกปูน เพราะด้านตรงข้ามขนานกัน", feedback: "ด้านตรงข้ามขนานบอกได้แค่ว่าเป็นสี่เหลี่ยมด้านขนาน ขนมเปียกปูนต้องมีด้านยาวเท่ากันทั้งสี่ด้าน" }
      - { id: d, text: "ABCD เป็นสี่เหลี่ยมผืนผ้า เพราะเมื่อวาดลงกระดาษแล้วมุมดูเป็นมุมฉาก", feedback: "ข้อสรุปถูกแต่เหตุผลไม่ใช่การพิสูจน์ การมองจากรูปไม่ใช่เหตุผล" }
    hints:
      - "หาเวกเตอร์ของด้าน AB, BC, DC, AD"
      - "สองเวกเตอร์ตั้งฉากกันเมื่อผลคูณเชิงสเกลาร์ $x_1x_2 + y_1y_2 = 0$"
    solution: "AB = (4, 2) = DC และ BC = (−1, 2) = AD จึงเป็นสี่เหลี่ยมด้านขนาน (4)(−1) + (2)(2) = 0 มุม B จึงเป็นมุมฉาก สี่เหลี่ยมด้านขนานที่มีมุมฉากคือสี่เหลี่ยมผืนผ้า แต่ AB = $\\sqrt{20}$ ≠ BC = $\\sqrt5$ จึงไม่ใช่จัตุรัส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.proof.p011
    topics: [math.geometry.proof]
    difficulty: 4
    type: mcq
    stem: "△ABC มี ∠A = 40° และ ∠B = 75° ส่วน △DEF มี ∠D = 40° และ ∠F = 65° ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "△ABC ~ △DEF (A↔D, B↔E, C↔F)", correct: true }
      - { id: b, text: "ไม่คล้ายกัน เพราะมุมที่โจทย์ให้มาไม่ตรงกันเป็นคู่", feedback: "หามุมที่สามก่อน ∠C = 65° และ ∠E = 75° จะเห็นว่ามุมเท่ากันสองคู่" }
      - { id: c, text: "△ABC ~ △DFE (A↔D, B↔F, C↔E)", feedback: "จับคู่จุดผิด ∠B = 75° ต้องคู่กับ ∠E = 75° ไม่ใช่ ∠F = 65°" }
      - { id: d, text: "สรุปไม่ได้จนกว่าจะรู้ความยาวด้าน", feedback: "เกณฑ์ ม.ม. ใช้มุมสองคู่ก็พอ ไม่ต้องรู้ด้าน" }
    hints:
      - "หามุมที่สามของแต่ละรูปจากผลบวก 180°"
      - "เกณฑ์ ม.ม.: มุมเท่ากันสองคู่ก็คล้ายกัน แล้วจับคู่จุดตามมุมที่เท่ากัน"
    solution: "∠C = 180° − 40° − 75° = 65° และ ∠E = 180° − 40° − 65° = 75° ได้ ∠A = ∠D, ∠B = ∠E, ∠C = ∠F จึงคล้ายกันตามเกณฑ์ ม.ม. เขียน △ABC ~ △DEF"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.proof.p012
    topics: [math.geometry.proof]
    difficulty: 4
    type: numeric
    stem: "ป้ายจราจรรูปวงกลมรัศมี 30 ซม. ถูกออกแบบใหม่ให้มีรัศมี 75 ซม. โดยลวดลายเหมือนเดิมทุกประการ พื้นที่หน้าป้ายใหม่เป็นกี่เท่าของป้ายเดิม"
    answer: { value: 6.25, tolerance: 0.01, unit: เท่า }
    hints:
      - "วงกลมทุกวงคล้ายกัน อัตราส่วนความยาวคือ $\\tfrac{75}{30}$"
      - "อัตราส่วนพื้นที่ของรูปคล้ายเท่ากับกำลังสองของอัตราส่วนความยาว"
    misconceptions:
      - { match: 2.5, feedback: "2.5 คืออัตราส่วนของรัศมี (ความยาว) พื้นที่ต้องยกกำลังสอง" }
      - { match: 45, feedback: "ลบรัศมี 75 − 30 ความสัมพันธ์ของรูปคล้ายเป็นการคูณ ไม่ใช่การบวก" }
    solution: "ขยายด้วยตัวประกอบสเกล $k = \\tfrac{75}{30} = 2.5$ พื้นที่เพิ่ม $k^2 = 6.25$ เท่า (ตรวจ: $\\pi(75)^2 \\div \\pi(30)^2 = 5625 \\div 900 = 6.25$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.proof.p013
    topics: [math.geometry.proof]
    difficulty: 4
    type: order
    stem: "ABCD เป็นสี่เหลี่ยมด้านขนาน เส้นทแยงมุม AC และ BD ตัดกันที่ M จงเรียงขั้นการพิสูจน์ว่า AM = CM และ BM = DM"
    items:
      - "AB ∥ DC จึงได้ ∠BAM = ∠DCM และ ∠ABM = ∠CDM (มุมแย้ง)"
      - "AB = CD (ด้านตรงข้ามของสี่เหลี่ยมด้านขนานยาวเท่ากัน)"
      - "△ABM ≅ △CDM ตามเงื่อนไข ม.ด.ม."
      - "AM = CM และ BM = DM (ด้านที่สมนัยกันของรูปที่เท่ากันทุกประการ)"
    hints:
      - "เลือกสามเหลี่ยมคู่ที่มีด้าน AB และ CD"
      - "รวบรวมมุมและด้านก่อน แล้วจึงสรุปว่าเท่ากันทุกประการ"
    solution: "มุมแย้งสองคู่จาก AB ∥ DC → ด้าน AB = CD ซึ่งอยู่ระหว่างมุมทั้งสอง → △ABM ≅ △CDM (ม.ด.ม.) → ด้านที่สมนัยเท่ากัน เส้นทแยงมุมจึงแบ่งครึ่งซึ่งกันและกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.proof.p014
    topics: [math.geometry.proof]
    difficulty: 3
    type: numeric
    stem: "วุ้นกะทิรูปลูกบาศก์ยาวด้านละ 6 ซม. ตัดเป็นพีระมิดที่เท่ากันทุกประการ 3 ชิ้น โดยแต่ละชิ้นมีฐานเป็นหน้าหนึ่งของลูกบาศก์และมียอดร่วมกันที่มุมหนึ่งของลูกบาศก์ พีระมิดแต่ละชิ้นมีปริมาตรกี่ลูกบาศก์เซนติเมตร"
    answer: { value: 72, unit: ลบ.ซม. }
    hints:
      - "ปริมาตรลูกบาศก์ $= 6^3$"
      - "แบ่งเป็น 3 ชิ้นเท่ากัน"
    misconceptions:
      - { match: 108, feedback: "หารด้วย 2 แต่ตัดได้ 3 ชิ้น" }
      - { match: 216, feedback: "216 คือปริมาตรของลูกบาศก์ทั้งก้อน ต้องหารด้วย 3" }
    solution: "ลูกบาศก์มีปริมาตร $6^3 = 216$ ลบ.ซม. แบ่งเป็นพีระมิดเท่ากัน 3 ชิ้น ชิ้นละ $216 \\div 3 = 72$ ลบ.ซม. ตรงกับสูตร $\\tfrac13 \\times$ พื้นที่ฐาน $\\times$ สูง $= \\tfrac13 \\times 36 \\times 6 = 72$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.proof.p015
    topics: [math.geometry.proof]
    difficulty: 2
    type: mcq
    stem: "นำเหรียญสิบบาท 20 เหรียญมาซ้อนเป็นตั้งตรง และอีก 20 เหรียญซ้อนเป็นตั้งเอียง ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "ปริมาตรเท่ากัน เพราะสูงเท่ากันและหน้าตัดทุกระดับเป็นวงกลมขนาดเท่ากัน", correct: true }
      - { id: b, text: "ตั้งเอียงมีปริมาตรมากกว่า เพราะดูยาวกว่า", feedback: "ความยาวตามแนวเอียงไม่ใช่ความสูง และเหรียญทุกเหรียญเหมือนเดิม" }
      - { id: c, text: "ตั้งเอียงมีปริมาตรน้อยกว่า เพราะเอียงทำให้เตี้ยลง", feedback: "ถ้าซ้อนเหรียญเท่ากัน ความสูงตามแนวดิ่งเท่าเดิม" }
      - { id: d, text: "เทียบไม่ได้จนกว่าจะรู้มุมเอียง", feedback: "หลักของคาวาเลียรีไม่ต้องใช้มุมเอียง ใช้แค่ความสูงและพื้นที่หน้าตัด" }
    hints:
      - "หลักของคาวาเลียรีใช้ความสูงและพื้นที่หน้าตัดที่ทุกระดับ"
      - "ตัดตั้งเหรียญที่ระดับใดก็ได้ หน้าตัดเป็นรูปอะไร"
    solution: "ทั้งสองตั้งสูงเท่ากัน และหน้าตัดที่ทุกระดับความสูงเป็นวงกลมขนาดเหรียญเท่ากัน ตามหลักของคาวาเลียรีจึงมีปริมาตรเท่ากัน (เป็นเหตุผลที่ทรงกระบอกเอียงยังมีปริมาตร $\\pi r^2 h$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.proof.p016
    topics: [math.geometry.proof]
    difficulty: 4
    type: numeric
    stem: "ครึ่งทรงกลมรัศมี 5 ซม. วางคว่ำบนพื้น และทรงกระบอกรัศมี 5 ซม. สูง 5 ซม. ที่เจาะกรวยออก (ฐานกรวยอยู่ด้านบน ยอดกรวยอยู่ที่กลางพื้น) ตัดทั้งสองรูปด้วยระนาบที่สูงจากพื้น 3 ซม. หน้าตัดของแต่ละรูปมีพื้นที่กี่ตารางเซนติเมตร (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 50.27, tolerance: 0.1, unit: ตร.ซม. }
    hints:
      - "ครึ่งทรงกลม: ที่ความสูง $h$ หน้าตัดเป็นวงกลมรัศมี $\\sqrt{5^2 - h^2}$ (ใช้ทฤษฎีบทพีทาโกรัส)"
      - "ทรงกระบอกเจาะกรวย: กรวยมีรัศมีเท่ากับความสูงจากยอด หน้าตัดเป็นวงแหวนรัศมีนอก 5 รัศมีใน $h$"
    misconceptions:
      - { match: 28.27, feedback: "28.27 คือพื้นที่วงกลมรัศมี 3 (รูที่เจาะ) ต้องหาพื้นที่วงแหวน $\\pi(5^2 - 3^2)$" }
      - { match: 78.54, feedback: "78.54 คือ $\\pi \\cdot 5^2$ พื้นที่หน้าตัดของทรงกระบอกเต็ม ยังไม่ได้หักรูของกรวย" }
    solution: "ครึ่งทรงกลม: $\\pi(5^2 - 3^2) = 16\\pi$ ทรงกระบอกเจาะกรวย: $\\pi \\cdot 5^2 - \\pi \\cdot 3^2 = 16\\pi \\approx 50.27$ ตร.ซม. เท่ากัน (เท่ากันทุกระดับ $h$) ตามหลักของคาวาเลียรี ครึ่งทรงกลมจึงมีปริมาตร $\\pi r^3 - \\tfrac13\\pi r^3 = \\tfrac23\\pi r^3$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.proof.p017
    topics: [math.geometry.proof]
    difficulty: 5
    type: mcq
    stem: "จุด A(0, 0), B(3, 1), C(4, 4), D(1, 3) นักเรียนพิสูจน์ว่า \"AB, BC, CD, DA ยาว $\\sqrt{10}$ เท่ากันทั้งสี่ด้าน ดังนั้น ABCD เป็นสี่เหลี่ยมจัตุรัส\" ข้อใดประเมินข้อโต้แย้งนี้ถูกต้อง"
    choices:
      - { id: a, text: "ผิด ด้านยาวเท่ากันทั้งสี่บอกได้แค่ว่าเป็นสี่เหลี่ยมขนมเปียกปูน และ AB·BC = (3, 1)·(1, 3) = 6 ≠ 0 จึงไม่มีมุมฉาก", correct: true }
      - { id: b, text: "ถูก เพราะสี่เหลี่ยมที่ด้านยาวเท่ากันทั้งสี่ด้านเป็นสี่เหลี่ยมจัตุรัสเสมอ", feedback: "สี่เหลี่ยมขนมเปียกปูนก็มีด้านยาวเท่ากันทั้งสี่ด้าน แต่มุมไม่จำเป็นต้องเป็นมุมฉาก" }
      - { id: c, text: "ผิด เพราะด้านทั้งสี่ยาวไม่เท่ากัน", feedback: "คำนวณแล้วทุกด้านยาว $\\sqrt{10}$ จริง ข้อผิดอยู่ที่ข้อสรุป ไม่ใช่การคำนวณ" }
      - { id: d, text: "ข้อสรุปถูก แต่ต้องเพิ่มว่าเส้นทแยงมุมตั้งฉากกัน", feedback: "เส้นทแยงมุมของขนมเปียกปูนตั้งฉากกันเสมอ จึงไม่ช่วยแยกจัตุรัส และรูปนี้ AC = $\\sqrt{32}$ ≠ BD = $\\sqrt8$ จึงไม่ใช่จัตุรัส" }
    hints:
      - "รูปสี่เหลี่ยมชนิดใดบ้างที่มีด้านยาวเท่ากันทั้งสี่ด้าน"
      - "ตรวจมุม B ด้วยผลคูณเชิงสเกลาร์ของ AB = (3, 1) กับ BC = (1, 3) หรือเทียบความยาวเส้นทแยงมุม"
    solution: "ด้านทั้งสี่ยาว $\\sqrt{10}$ จริง จึงเป็นสี่เหลี่ยมขนมเปียกปูน แต่ (3)(1) + (1)(3) = 6 ≠ 0 มุม B ไม่ใช่มุมฉาก และ AC = $\\sqrt{32}$ ≠ BD = $\\sqrt{8}$ ABCD จึงไม่ใช่สี่เหลี่ยมจัตุรัส ข้อโต้แย้งสรุปเกินกว่าที่เหตุผลรองรับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.proof.p018
    topics: [math.geometry.proof]
    difficulty: 5
    type: numeric
    stem: "หมู่บ้าน A อยู่ที่จุด (2, 0) และหมู่บ้าน B อยู่ที่จุด (6, 4) (หน่วยเป็นกิโลเมตร) อบต. จะตั้งหอกระจายข่าวบนถนนที่อยู่ในแนวแกน $y$ ให้ห่างจากสองหมู่บ้านเท่ากัน หอกระจายข่าวอยู่ที่จุด $(0, y)$ โดย $y$ เท่ากับเท่าใด"
    figure:
      src: villages.svg
      alt: "ระนาบพิกัด หมู่บ้าน A อยู่ที่จุด (2, 0) หมู่บ้าน B อยู่ที่จุด (6, 4) ถนนเป็นแถบสีน้ำตาลตามแนวแกน y"
    answer: { value: 6, unit: กม. }
    hints:
      - "จุดที่ห่างจาก A และ B เท่ากันอยู่บนเส้นแบ่งครึ่งตั้งฉากของ AB"
      - "ตั้งสมการ $(0 - 2)^2 + (y - 0)^2 = (0 - 6)^2 + (y - 4)^2$ หรือหาสมการของเส้นแบ่งครึ่งตั้งฉากจากจุดกึ่งกลางและความชัน"
    misconceptions:
      - { match: 2, feedback: "2 คือพิกัด $y$ ของจุดกึ่งกลาง (4, 2) ของ AB แต่จุดกึ่งกลางไม่ได้อยู่บนถนน ต้องเดินตามเส้นแบ่งครึ่งตั้งฉากไปจนถึงแกน $y$" }
      - { match: 4, feedback: "ลองเลือกระดับเดียวกับหมู่บ้าน B แต่ระยะจาก (0, 4) ถึง A คือ $\\sqrt{20}$ และถึง B คือ 6 ไม่เท่ากัน" }
    solution: "$4 + y^2 = 36 + y^2 - 8y + 16 \\Rightarrow 8y = 48 \\Rightarrow y = 6$ ตรวจด้วยเส้นแบ่งครึ่งตั้งฉาก: จุดกึ่งกลาง (4, 2) ความชันของ AB = 1 เส้นตั้งฉากมีความชัน −1 คือ $y = -x + 6$ ตัดแกน $y$ ที่ (0, 6) ระยะถึงทั้งสองหมู่บ้านเท่ากับ $\\sqrt{40}$ กม."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.proof.p019
    topics: [math.geometry.proof]
    difficulty: 5
    type: mcq
    stem: "นักเรียนพิสูจน์ว่า \"มุมภายในของสามเหลี่ยมรวมกันได้ 180°\" ดังนี้: \"ต่อด้าน BC ออกไปเป็นมุมภายนอก ∠ACD ซึ่งเท่ากับ ∠A + ∠B (สมบัติของมุมภายนอก) และ ∠ACD + ∠ACB = 180° (มุมตรง) จึงได้ ∠A + ∠B + ∠ACB = 180°\" ถ้าสมบัติของมุมภายนอกในชั้นเรียนนี้พิสูจน์มาจากผลบวกมุมภายใน 180° ข้อโต้แย้งนี้มีปัญหาอะไร"
    choices:
      - { id: a, text: "ให้เหตุผลวน เพราะใช้ทฤษฎีบทที่พิสูจน์มาจากสิ่งที่กำลังจะพิสูจน์", correct: true }
      - { id: b, text: "ไม่มีปัญหา เพราะทุกขั้นเป็นจริง", feedback: "ทุกขั้นจริง แต่การพิสูจน์ต้องไม่อาศัยข้อสรุปของตัวเอง แม้ทางอ้อม" }
      - { id: c, text: "ใช้มุมตรงผิด เพราะ ∠ACD + ∠ACB ไม่เท่ากับ 180°", feedback: "∠ACD กับ ∠ACB อยู่บนเส้นตรง BD จึงรวมกันได้ 180° ขั้นนี้ถูก" }
      - { id: d, text: "พิสูจน์ได้เฉพาะสามเหลี่ยมมุมแหลม", feedback: "ขั้นตอนใช้ได้กับสามเหลี่ยมทุกชนิด ปัญหาอยู่ที่ลำดับของเหตุผล" }
    hints:
      - "เหตุผลในแต่ละขั้นต้องมาจากสิ่งที่พิสูจน์แล้วก่อนหน้า"
      - "สมบัติของมุมภายนอกพิสูจน์มาจากอะไร"
