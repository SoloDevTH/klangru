problems:
  - id: biology.humans.respiration-excretion.p001
    topics: [biology.humans.respiration-excretion]
    difficulty: 1
    type: order
    stem: "เรียงอวัยวะที่อากาศผ่านเมื่อหายใจเข้า ตั้งแต่จมูกจนถึงที่แลกเปลี่ยนแก๊ส"
    items:
      - "จมูกและโพรงจมูก"
      - "คอหอย"
      - "กล่องเสียง"
      - "หลอดลมคอ"
      - "หลอดลม"
      - "หลอดลมฝอย"
      - "ถุงลม"
    hints:
      - "อากาศผ่านคอหอยซึ่งเป็นทางร่วมกับอาหารก่อน แล้วจึงเข้ากล่องเสียง"
      - "ท่อลมแตกแขนงเล็กลงเรื่อย ๆ จนถึงปลายทาง"
    solution: "จมูก → คอหอย → กล่องเสียง → หลอดลมคอ → หลอดลม → หลอดลมฝอย → ถุงลม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.respiration-excretion.p002
    topics: [biology.humans.respiration-excretion]
    difficulty: 1
    type: match
    stem: "จับคู่อวัยวะในระบบขับถ่ายทางไตกับหน้าที่"
    pairs:
      - { left: "ไต", right: "กรองของเสียออกจากเลือดและสร้างปัสสาวะ" }
      - { left: "ท่อไต", right: "ลำเลียงปัสสาวะจากไตไปยังกระเพาะปัสสาวะ" }
      - { left: "กระเพาะปัสสาวะ", right: "เก็บปัสสาวะไว้ชั่วคราว" }
      - { left: "ท่อปัสสาวะ", right: "นำปัสสาวะออกนอกร่างกาย" }
    hints:
      - "ปัสสาวะเกิดที่ไต แล้วไหลลงไปเก็บ"
      - "ท่อไตกับท่อปัสสาวะอยู่คนละช่วง"
    solution: "ไตกรองเลือดและสร้างปัสสาวะ ท่อไตลำเลียงปัสสาวะลงกระเพาะปัสสาวะซึ่งเก็บไว้ชั่วคราว แล้วท่อปัสสาวะนำออกนอกร่างกาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.respiration-excretion.p003
    topics: [biology.humans.respiration-excretion]
    difficulty: 1
    type: text
    stem: "ส่วนใดของปอดที่มีหลอดเลือดฝอยพันรอบ และเป็นที่แลกเปลี่ยนแก๊สออกซิเจนกับแก๊สคาร์บอนไดออกไซด์"
    accepted: ["ถุงลม", "ถุงลมปอด", "alveoli", "alveolus"]
    hints:
      - "อยู่ที่ปลายสุดของหลอดลมฝอย"
      - "ผนังบางเพียงเซลล์ชั้นเดียว"
    misconceptions:
      - { match: "หลอดลมฝอย", feedback: "หลอดลมฝอยเป็นทางผ่านของอากาศ การแลกเปลี่ยนแก๊สเกิดที่ปลายของมัน" }
    solution: "ถุงลม ผนังบาง ชื้น และมีหลอดเลือดฝอยพันรอบ แก๊สจึงแพร่ระหว่างอากาศในถุงลมกับเลือดได้ง่าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.respiration-excretion.p004
    topics: [biology.humans.respiration-excretion]
    difficulty: 2
    type: mcq
    stem: "ขณะหายใจเข้า กะบังลมเป็นอย่างไร"
    choices:
      - { id: a, text: "หดตัว เลื่อนต่ำลงและแบนราบ", correct: true }
      - { id: b, text: "คลายตัว โค้งขึ้นเป็นรูปโดม", feedback: "นี่คือตอนหายใจออก ซึ่งทำให้ช่องอกเล็กลง" }
      - { id: c, text: "หดตัว โค้งขึ้นดันปอด", feedback: "เมื่อกะบังลมหดตัว มันจะดึงตัวลงและแบนลง ไม่ได้โค้งขึ้น" }
      - { id: d, text: "อยู่นิ่ง ปอดขยายเองได้", feedback: "ปอดไม่มีกล้ามเนื้อ ขยายเองไม่ได้ ต้องอาศัยกะบังลมและกระดูกซี่โครง" }
    hints:
      - "หายใจเข้าต้องทำให้ช่องอกใหญ่ขึ้นหรือเล็กลง"
      - "กล้ามเนื้อรูปโดมเมื่อหดตัวจะแบนลง"
    solution: "ขณะหายใจเข้า กะบังลมหดตัวและเลื่อนต่ำลง กระดูกซี่โครงยกขึ้น ช่องอกขยาย ความดันในปอดลดลง อากาศจึงเข้าสู่ปอด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.respiration-excretion.p005
    topics: [biology.humans.respiration-excretion]
    difficulty: 2
    type: numeric
    stem: "นักเรียนนั่งพักแล้วนับการหายใจของเพื่อนได้ 9 ครั้งใน 30 วินาที อัตราการหายใจของเพื่อนกี่ครั้งต่อนาที"
    answer: { value: 18, unit: ครั้ง/นาที }
    hints:
      - "1 นาทีมี 60 วินาที"
      - "30 วินาทีเป็นครึ่งนาที จึงคูณด้วย 2"
    misconceptions:
      - { match: 9, feedback: "9 ครั้งคือจำนวนใน 30 วินาที ต้องคิดเป็นต่อ 60 วินาที" }
      - { match: 4.5, feedback: "หารด้วย 2 แทนการคูณ ใน 1 นาทีต้องหายใจมากกว่าใน 30 วินาที" }
    solution: "$9 \\times \\frac{60}{30} = 18$ ครั้งต่อนาที อยู่ในช่วงปกติขณะพัก (ราว 12–20 ครั้งต่อนาที)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.respiration-excretion.p006
    topics: [biology.humans.respiration-excretion]
    difficulty: 2
    type: mcq
    stem: "ในแบบจำลองการหายใจด้วยขวดแก้ว ส่วนใดแทนกะบังลม"
    figure: { src: p-bell-jar.svg, alt: "ขวดแก้วรูปทรงระฆังไม่มีก้น ปากขวดมีจุกและหลอดแก้วสอดลงไป หลอดแยกเป็นรูปตัว Y ปลายทั้งสองต่อกับลูกโป่งสีชมพู ก้นขวดปิดด้วยแผ่นยางสีม่วงที่มีด้ามดึงอยู่ด้านล่าง มีตัวอักษรชี้ ก ที่หลอดแก้ว ข ที่ลูกโป่ง ค ที่ผนังขวดแก้ว ง ที่แผ่นยางก้นขวด" }
    choices:
      - { id: a, text: "ง", correct: true }
      - { id: b, text: "ค", feedback: "ผนังขวดแก้วแทนผนังช่องอก ซึ่งขยับไม่ได้ในแบบจำลองนี้" }
      - { id: c, text: "ข", feedback: "ลูกโป่งแทนปอดที่พองและแฟบตามความดัน" }
      - { id: d, text: "ก", feedback: "หลอดแก้วแทนหลอดลมคอที่เป็นทางให้อากาศผ่าน" }
    hints:
      - "กะบังลมอยู่ใต้ปอด เคลื่อนขึ้นลงได้"
      - "ส่วนใดของแบบจำลองที่เราดึงหรือดันได้"
    solution: "แผ่นยางที่ก้นขวด (ง) แทนกะบังลม เพราะอยู่ใต้ลูกโป่งและดึงลงหรือดันขึ้นได้ ส่วน ก แทนหลอดลมคอ ข แทนปอด ค แทนผนังช่องอก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.respiration-excretion.p007
    topics: [biology.humans.respiration-excretion]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ช่วงที่ภาคเหนือมีฝุ่นควันมาก โครงสร้างใดในทางเดินหายใจช่วยดักฝุ่นไม่ให้ลงไปถึงถุงลม (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ขนจมูก", correct: true }
      - { id: b, text: "เมือกในโพรงจมูกและหลอดลม", correct: true }
      - { id: c, text: "ขนเล็ก ๆ (ซิเลีย) ที่โบกพัดเมือกขึ้นไปทางคอ", correct: true }
      - { id: d, text: "กะบังลม", feedback: "กะบังลมช่วยให้หายใจเข้าออก ไม่ได้อยู่ในทางเดินของอากาศ จึงไม่ได้ดักฝุ่น" }
      - { id: e, text: "กระดูกอ่อนรูปตัว C", feedback: "กระดูกอ่อนช่วยค้ำหลอดลมคอไม่ให้แฟบ ไม่ได้ดักฝุ่น" }
    hints:
      - "นึกถึงสิ่งที่อยู่บนผิวด้านในของทางเดินหายใจ"
      - "ฝุ่นที่ติดเมือกถูกพัดออกไปทางไหน"
    solution: "ขนจมูกกรองฝุ่นขนาดใหญ่ เมือกจับฝุ่น และซิเลียโบกพัดเมือกขึ้นไปที่คอเพื่อกลืนหรือไอออก แต่ฝุ่น PM2.5 เล็กมากจนผ่านด่านเหล่านี้ได้บางส่วน จึงควรสวมหน้ากากที่กันฝุ่นละเอียดเมื่อค่าฝุ่นสูง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.respiration-excretion.p008
    topics: [biology.humans.respiration-excretion]
    difficulty: 3
    type: mcq
    stem: "ในแบบจำลองขวดแก้ว เมื่อดึงแผ่นยางที่ก้นขวดลง ลูกโป่งพองขึ้น ข้อใดอธิบายได้ถูกต้อง"
    choices:
      - { id: a, text: "ปริมาตรในขวดเพิ่ม ความดันในขวดลดลง อากาศภายนอกจึงดันเข้าไปในลูกโป่ง", correct: true }
      - { id: b, text: "แผ่นยางดูดอากาศเข้าไปในลูกโป่งโดยตรง", feedback: "แผ่นยางไม่ได้ต่อกับลูกโป่ง อากาศเข้าลูกโป่งเพราะความต่างของความดัน" }
      - { id: c, text: "ปริมาตรในขวดลดลง ความดันเพิ่มขึ้น จึงดันอากาศเข้าลูกโป่ง", feedback: "การดึงแผ่นยางลงทำให้ที่ว่างในขวดมากขึ้น ไม่ใช่น้อยลง" }
      - { id: d, text: "ลูกโป่งขยายตัวเองเมื่อมีที่ว่าง", feedback: "ลูกโป่งไม่ขยายเอง ต้องมีอากาศถูกดันเข้าไปจากภายนอก" }
    hints:
      - "ดึงแผ่นยางลง ที่ว่างในขวดเปลี่ยนไปอย่างไร"
      - "อากาศเคลื่อนจากที่ที่ความดันสูงไปความดันต่ำ"
    solution: "ดึงแผ่นยางลงทำให้ปริมาตรในขวดเพิ่ม ความดันรอบลูกโป่งลดลงต่ำกว่าอากาศภายนอก อากาศจึงไหลผ่านหลอดเข้าไปในลูกโป่ง เหมือนการหายใจเข้าเมื่อกะบังลมเลื่อนต่ำลง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.respiration-excretion.p009
    topics: [biology.humans.respiration-excretion]
    difficulty: 3
    type: numeric
    stem: "ขณะพัก เด็กคนหนึ่งหายใจ 16 ครั้งต่อนาที แต่ละครั้งรับอากาศเข้า 500 มิลลิลิตร ใน 1 นาทีรับอากาศเข้าปอดกี่ลิตร"
    answer: { value: 8, unit: L }
    hints:
      - "ปริมาตรต่อนาที = ปริมาตรต่อครั้ง × จำนวนครั้งต่อนาที"
      - "1 ลิตร = 1,000 มิลลิลิตร"
    misconceptions:
      - { match: 8000, feedback: "นี่คือคำตอบเป็นมิลลิลิตร โจทย์ถามเป็นลิตร ต้องหารด้วย 1,000" }
      - { match: 0.5, feedback: "นี่คือปริมาตรของการหายใจครั้งเดียว ต้องคูณด้วยจำนวนครั้งต่อนาที" }
    solution: "$500 \\times 16 = 8{,}000$ มิลลิลิตร $= 8$ ลิตรต่อนาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.respiration-excretion.p010
    topics: [biology.humans.respiration-excretion]
    difficulty: 3
    type: mcq
    stem: "อากาศที่หายใจเข้ามีแก๊สออกซิเจนราวร้อยละ 21 และแก๊สคาร์บอนไดออกไซด์ราวร้อยละ 0.04 อากาศที่หายใจออกน่าจะเป็นแบบใด"
    choices:
      - { id: a, text: "ออกซิเจนราวร้อยละ 16 คาร์บอนไดออกไซด์ราวร้อยละ 4", correct: true }
      - { id: b, text: "ออกซิเจนร้อยละ 0 คาร์บอนไดออกไซด์ร้อยละ 21", feedback: "ร่างกายใช้ออกซิเจนเพียงบางส่วน ลมหายใจออกยังมีออกซิเจนเหลือมาก" }
      - { id: c, text: "ออกซิเจนราวร้อยละ 25 คาร์บอนไดออกไซด์ราวร้อยละ 0.01", feedback: "ร่างกายนำออกซิเจนไปใช้ ออกซิเจนจึงต้องลดลง ไม่ใช่เพิ่มขึ้น" }
      - { id: d, text: "เหมือนอากาศหายใจเข้าทุกอย่าง", feedback: "ที่ถุงลมมีการแลกเปลี่ยนแก๊ส สัดส่วนของแก๊สจึงเปลี่ยนไป" }
    hints:
      - "ร่างกายรับแก๊สใดเข้า และปล่อยแก๊สใดออก"
      - "ร่างกายใช้ออกซิเจนหมดทุกโมเลกุลหรือไม่"
    solution: "ที่ถุงลม ออกซิเจนบางส่วนแพร่เข้าเลือด และคาร์บอนไดออกไซด์แพร่ออกมา ลมหายใจออกจึงมีออกซิเจนลดลงเหลือราวร้อยละ 16 และคาร์บอนไดออกไซด์เพิ่มเป็นราวร้อยละ 4"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.respiration-excretion.p011
    topics: [biology.humans.respiration-excretion]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ลักษณะใดของถุงลมที่ช่วยให้แลกเปลี่ยนแก๊สได้ดี (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "มีจำนวนมาก ทำให้มีพื้นที่ผิวรวมมาก", correct: true }
      - { id: b, text: "ผนังบางเพียงเซลล์ชั้นเดียว", correct: true }
      - { id: c, text: "มีหลอดเลือดฝอยพันรอบ", correct: true }
      - { id: d, text: "ผิวด้านในชื้น", correct: true }
      - { id: e, text: "มีกระดูกอ่อนหนาค้ำไว้", feedback: "กระดูกอ่อนพบที่หลอดลมคอและหลอดลม ถ้าถุงลมมีผนังหนา แก๊สจะแพร่ผ่านได้ยาก" }
    hints:
      - "การแพร่เร็วเมื่อพื้นที่มาก ระยะทางสั้น และความเข้มข้นต่างกันมาก"
      - "แก๊สต้องละลายในน้ำก่อนแพร่ผ่านเยื่อ"
    solution: "ถุงลมจำนวนมากให้พื้นที่ผิวมาก ผนังบางทำให้ระยะทางสั้น หลอดเลือดฝอยพาเลือดมาและพาไปตลอดจึงรักษาความต่างของความเข้มข้น และผิวชื้นให้แก๊สละลายก่อนแพร่ ส่วนกระดูกอ่อนหนาไม่มีที่ถุงลม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.respiration-excretion.p012
    topics: [biology.humans.respiration-excretion]
    difficulty: 4
    type: numeric
    stem: "ไตของผู้ใหญ่กรองของเหลวออกจากเลือดได้วันละประมาณ 180 ลิตร แต่ขับเป็นปัสสาวะเพียง 1.5 ลิตร ของเหลวที่กรองได้ถูกดูดกลับเข้าเลือดร้อยละเท่าไร (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 99.2, tolerance: 0.1, unit: "%" }
    hints:
      - "ปริมาณที่ถูกดูดกลับ = ที่กรองได้ − ที่ออกเป็นปัสสาวะ"
      - "นำปริมาณที่ดูดกลับหารด้วย 180 แล้วคูณ 100"
    misconceptions:
      - { match: 0.8, feedback: "นี่คือร้อยละที่ออกเป็นปัสสาวะ โจทย์ถามส่วนที่ถูกดูดกลับ" }
