  - id: biology.cells.enzymes.p017
    topics: [biology.cells.enzymes]
    difficulty: 5
    type: numeric
    stem: "จากการทดลองในข้อก่อน แป้งถูกย่อยหมดใน 8 นาทีที่ 20 °C และใน 2 นาทีที่ 37 °C ถ้าถือว่าอัตราการย่อยแปรผกผันกับเวลาที่ใช้ อะไมเลสที่ 37 °C ย่อยแป้งเร็วกว่าที่ 20 °C กี่เท่า"
    answer: { value: 4, unit: เท่า }
    hints:
      - "อัตรา ∝ 1 ÷ เวลา"
      - "เทียบ $\\frac{1}{2}$ กับ $\\frac{1}{8}$"
    misconceptions:
      - { match: 0.25, feedback: "นำ 2 หาร 8 ได้อัตราส่วนกลับด้าน ที่ 37 °C ใช้เวลาน้อยกว่าจึงเร็วกว่า คำตอบต้องมากกว่า 1" }
      - { match: 6, feedback: "6 คือผลต่างของเวลา (8 − 2) ความเร็วต้องเทียบเป็นอัตราส่วน" }
    solution: "อัตราที่ 37 °C $\\propto \\frac{1}{2}$ อัตราที่ 20 °C $\\propto \\frac{1}{8}$ อัตราส่วน $= \\frac{1/2}{1/8} = \\frac{8}{2} = 4$ เท่า"
