id: chinese.vocab.self-introduction
subject: chinese
title: { th: "การแนะนำตัว ครอบครัว และสัญชาติ", en: "Introducing yourself, family and nationality" }
summary: บอกชื่อด้วย 叫 และ 姓 บอกสัญชาติด้วย 泰国人 บอกอายุด้วย 岁 เรียกสมาชิกในครอบครัว และใช้ 有 กับ 没有 บอกว่ามีพี่น้องกี่คน
difficulty: 2
minutes: 30
prerequisites: [chinese.grammar.questions]
encompasses:
  - { id: chinese.grammar.questions, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: family-tree.svg
    alt: "แผนผังครอบครัว แถวบน: 爷爷 yéye ปู่ และ 奶奶 nǎinai ย่า (ฝั่งพ่อ) 外公 wàigōng ตา และ 外婆 wàipó ยาย (ฝั่งแม่) แถวกลาง: 爸爸 bàba พ่อ และ 妈妈 māma แม่ แถวล่าง จากซ้ายไปขวา: 哥哥 gēge พี่ชาย 姐姐 jiějie พี่สาว 我 wǒ ฉัน 弟弟 dìdi น้องชาย 妹妹 mèimei น้องสาว ทางซ้ายของ 我 อายุมากกว่า ทางขวาอายุน้อยกว่า"
    caption: "คำเรียกญาติแยกฝั่งพ่อฝั่งแม่ และแยกพี่น้องตามอายุและเพศ"
  - { type: check, problem: chinese.vocab.self-introduction.p005, prompt: "บอกอายุต้องมี 是 ไหม" }
  - type: worked-example
    title: ถามและตอบเรื่องครอบครัว
    problem: "เพื่อนชาวจีนถามว่า 你家有几口人？你有哥哥吗？ เรามีพ่อ แม่ และน้องชาย 2 คน ตอบอย่างไร"
    steps:
      - text: "นับสมาชิกรวมตัวเอง: พ่อ แม่ น้องชาย 2 คน และเรา = $1 + 1 + 2 + 1 = 5$ คน"
      - text: "ตอบคำถามแรก: 我家有五口人。"
        why: "口 เป็นลักษณนามของสมาชิกในครอบครัว"
      - text: "เราไม่มีพี่ชาย ปฏิเสธ 有 ด้วย 没有: 我没有哥哥。"
      - text: "บอกเพิ่มว่ามีน้องชาย 2 คน: 我有两个弟弟。"
    answer: "我家有五口人。我没有哥哥，我有两个弟弟。"
  - type: worked-example
    title: ตอบคำถามแซ่อย่างสุภาพ
    problem: "ครูชาวจีนถาม 您贵姓？ เรามีชื่อจีนว่า 林美 (แซ่ 林) ตอบอย่างไร"
    steps:
      - text: "贵 เป็นคำยกย่องผู้ฟัง ตัดออกเมื่อพูดถึงตัวเอง"
      - text: "ตอบแซ่ด้วย 姓: 我姓林"
      - text: "บอกชื่อเต็มต่อด้วย 叫: 叫林美"
        why: "叫 ตามด้วยชื่อ 姓 ตามด้วยแซ่"
    answer: "我姓林，叫林美。 Wǒ xìng Lín, jiào Lín Měi."
  - { type: check, problem: chinese.vocab.self-introduction.p014, prompt: "和 เชื่อมอะไรได้บ้าง" }
glossary:
  - { term: "叫 jiào", definition: "ชื่อ ใช้ในรูป 我叫 + ชื่อ" }
  - { term: "姓 xìng", definition: "แซ่ นามสกุล ใช้ในรูป 我姓 + แซ่ ถามสุภาพว่า 您贵姓" }
  - { term: "岁 suì", definition: "ปี (อายุ) เช่น 我十三岁 ไม่ต้องมี 是" }
  - { term: "口 kǒu", definition: "ลักษณนามของสมาชิกในครอบครัว เช่น 我家有四口人" }
  - { term: "和 hé", definition: "และ ใช้เชื่อมคำนาม เช่น 爸爸和妈妈 เชื่อมประโยคไม่ได้" }
flashcards:
  - { front: "ฉันชื่อมะลิ / ฉันแซ่หลิน", back: "我叫玛丽。 / 我姓林。" }
  - { front: "ปีนี้ฉันอายุ 13 ปี", back: "我今年十三岁。 (ไม่มี 是)" }
  - { front: "哥哥 姐姐 弟弟 妹妹", back: "พี่ชาย พี่สาว น้องชาย น้องสาว" }
  - { front: "ปู่ ย่า ตา ยาย", back: "爷爷 奶奶 外公 外婆" }
  - { front: "ยินดีที่ได้รู้จัก", back: "很高兴认识你。" }
