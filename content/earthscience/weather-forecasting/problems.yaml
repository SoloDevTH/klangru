      - { id: c, text: "ติดตามประกาศฉบับล่าสุด และอพยพเมื่อเจ้าหน้าที่แนะนำ", correct: true }
      - { id: d, text: "รอดูก่อน ถ้าตาพายุผ่านไปแล้วลมสงบ แปลว่าพายุหมดแล้ว", feedback: "เมื่อตาพายุผ่าน ลมสงบเพียงชั่วคราว แล้วลมแรงจะกลับมาจากอีกทิศ" }
