    answer: { value: 222, tolerance: 0.5, unit: N }
    hints:
      - "$\\mathrm{N/kg}$ บอกว่ามวล $1\\ \\mathrm{kg}$ ถูกดึงด้วยแรงกี่นิวตัน"
      - "$W = mg$ โดยใช้ $g$ ของดาวอังคาร"
    misconceptions:
      - { match: 588, feedback: "นี่คือน้ำหนักบนโลก บนดาวอังคารต้องใช้ $g = 3.7\\ \\mathrm{N/kg}$" }
      - { match: 16.2, feedback: "ดูเหมือนนำมวลหารด้วย $g$ น้ำหนักคือมวล **คูณ** ความเข้มสนามโน้มถ่วง" }
    solution: "$W = mg = 60 \\times 3.7 = 222\\ \\mathrm{N}$ น้อยกว่าบนโลก ($588\\ \\mathrm{N}$) เกือบสามเท่า แต่มวลยังเป็น $60\\ \\mathrm{kg}$"
