  - { id: business.econ.retirement-savings, title: "การออมเพื่อวัยเกษียณ ประกันสังคม และกองทุนบำนาญ", difficulty: 4, prereq: [business.econ.saving-investment], indicators: ["au-ac9-economics-business:AC9HE10K04"], scope: "ทำไมต้องออมเพื่อวัยเกษียณ (อายุยืนขึ้น สังคมสูงวัยของไทย) ระบบบำนาญหลายชั้น (รัฐ ภาคบังคับจากนายจ้างและลูกจ้าง ภาคสมัครใจ) ในไทย บำนาญชราภาพของประกันสังคมตามมาตรา 33 39 40 กองทุนการออมแห่งชาติ (กอช.) กองทุนสำรองเลี้ยงชีพ และกองทุนรวมที่ลดหย่อนภาษี ตัวอย่างต่างประเทศ ระบบ superannuation ของออสเตรเลียที่นายจ้างต้องสมทบ (อัตรา 12% ตั้งแต่ 1 ก.ค. 2568) ผลของการเริ่มออมเร็วด้วยดอกเบี้ยทบต้น ผลของค่าธรรมเนียมและเงินเฟ้อ ผลต่อการตัดสินใจทางการเงิน (เลือกงานที่มีสวัสดิการ สมทบเพิ่ม ถอนก่อนกำหนด) คำนวณเงินสะสมอย่างง่าย อัตราสมทบและเงื่อนไขต้องตรวจจากสำนักงานประกันสังคม กอช. และกรมสรรพากรฉบับล่าสุด" }
  # ลำดับ 2
  - { id: business.econ.economic-inquiry, title: "การสืบค้นประเด็นเศรษฐกิจและธุรกิจ: ตั้งคำถาม หาข้อมูล ตีความ และเสนอทางเลือก", difficulty: 4.5, prereq: [business.stats.descriptive, business.econ.demand-supply], indicators: ["au-ac9-economics-business:AC9HE7S01", "au-ac9-economics-business:AC9HE8S01", "au-ac9-economics-business:AC9HE9S01", "au-ac9-economics-business:AC9HE10S01", "au-ac9-economics-business:AC9HE7S02", "au-ac9-economics-business:AC9HE8S02", "au-ac9-economics-business:AC9HE9S02", "au-ac9-economics-business:AC9HE10S02", "au-ac9-economics-business:AC9HE7S03", "au-ac9-economics-business:AC9HE8S03", "au-ac9-economics-business:AC9HE10S03", "au-ac9-economics-business:AC9HE7S04", "au-ac9-economics-business:AC9HE8S04", "au-ac9-economics-business:AC9HE10S04", "au-ac9-economics-business:AC9HE7S05", "au-ac9-economics-business:AC9HE8S05", "au-ac9-economics-business:AC9HE9S05", "au-ac9-economics-business:AC9HE10S05"], scope: "วงจรการสืบค้นประเด็นเศรษฐกิจร่วมสมัย (เช่น ค่าครองชีพ ราคาสินค้าเกษตร ร้านค้าออนไลน์กับร้านในชุมชน) ตั้งคำถามเชิงพรรณนา เชิงเหตุผล และเชิงประเมิน และปรับคำถามเมื่อได้ข้อมูลใหม่ แหล่งข้อมูลปฐมภูมิและทุติยภูมิ (ธนาคารแห่งประเทศไทย สำนักงานสถิติแห่งชาติ สศช. กระทรวงพาณิชย์ รายงานบริษัท ข่าว) การประเมินความน่าเชื่อถือและการจัดระเบียบข้อมูลในตาราง ตีความตารางและกราฟ แยกแนวโน้ม ความสัมพันธ์ และเหตุกับผลทางเศรษฐกิจ (สหสัมพันธ์ไม่ใช่เหตุและผล) และคาดการณ์ผลต่อผู้บริโภคและการเงิน เสนอทางเลือกตอบประเด็นด้วยการวิเคราะห์ต้นทุนผลประโยชน์หรือตารางเกณฑ์ แล้วเขียนคำอธิบายและข้อโต้แย้งที่ใช้ศัพท์เศรษฐศาสตร์ อ้างอิงแหล่งข้อมูลและยอมรับข้อจำกัดของหลักฐาน ใช้ข้อมูลจริงของไทยที่ระบุปีและแหล่ง" }
  # ลำดับ 2
  - { id: business.communication.business-reports, title: "การสื่อสารสารสนเทศทางธุรกิจ รายงาน การนำเสนอ และการเลือกรูปแบบให้เหมาะกับผู้ฟัง", difficulty: 5, prereq: [business.stats.descriptive], indicators: ["th-tqf-accounting:5.5.2", "th-tqf-public-administration:5.5(1)", "th-tqf-public-administration:5.5(3)"], scope: "วิเคราะห์ผู้ฟังและวัตถุประสงค์ (ผู้บริหาร ลูกค้า ประชาชน หน่วยงานกำกับ) โครงสร้างรายงานธุรกิจและบันทึกเสนอ (บทสรุปผู้บริหาร ข้อค้นพบ ข้อเสนอแนะ) หลักขึ้นต้นด้วยข้อสรุป (pyramid principle) การเขียนภาษาไทยที่กระชับชัดเจน การเลือกตาราง กราฟ หรือข้อความให้เหมาะกับข้อมูล (เทียบค่า แนวโน้ม สัดส่วน) และหลีกเลี่ยงกราฟที่ชวนเข้าใจผิด การอธิบายตัวเลขทางบัญชีและงบประมาณให้ผู้ที่ไม่ใช่นักบัญชีเข้าใจ การทำสไลด์และพูดนำเสนอ (หนึ่งสไลด์หนึ่งประเด็น) การตอบคำถาม และการเลือกช่องทาง (อีเมล รายงาน อินโฟกราฟิก ประชุม) ฝึกด้วยการแก้รายงานตัวอย่างและเลือกรูปแบบนำเสนอ การพูดจริงประเมินนอกแอป" }
  # ลำดับ 3
  - { id: business.law.transport-insurance, title: "กฎหมายการขนส่งสินค้าและการประกันภัยสินค้าระหว่างขนส่ง", difficulty: 6.5, prereq: [business.law.contracts, management.operations.supply-chain], indicators: ["th-tqf-logistics:8.2.2"], scope: "สัญญารับขนตามประมวลกฎหมายแพ่งและพาณิชย์ (ลักษณะรับขน มาตรา 608–639) หน้าที่และความรับผิดของผู้ขนส่ง ข้อยกเว้นความรับผิด และอายุความ พ.ร.บ.การรับขนของทางทะเล พ.ศ. 2534 และพ.ร.บ.การขนส่งต่อเนื่องหลายรูปแบบ พ.ศ. 2548 โดยสรุป ใบตราส่ง (B/L) ทั้งในฐานะใบรับของ หลักฐานสัญญา และเอกสารสิทธิ การประกันภัยขนส่งสินค้า (ความเสียหายที่คุ้มครองตาม Institute Cargo Clauses A B C มูลค่าเอาประกันที่นิยม CIF + 10%) ความเชื่อมโยงกับ Incoterms 2020 (CIF กำหนดความคุ้มครองขั้นต่ำ ICC (C) CIP กำหนด ICC (A)) ขั้นตอนเรียกร้องค่าเสียหายเมื่อสินค้าเสียหายหรือสูญหาย และพิธีการศุลกากรเบื้องต้น ใช้กรณีศึกษาสินค้าเสียหายระหว่างขนส่ง ระบุว่าเป็นความรู้ทั่วไป ไม่ใช่คำปรึกษากฎหมาย" }
