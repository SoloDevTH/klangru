problems:
  - id: computer.security.secure-coding.p001
    topics: [computer.security.secure-coding]
    difficulty: 1
    type: numeric
    stem: |
      รหัสผ่านที่ยาว 3 ตัวอักษร และใช้ตัวอักษรภาษาอังกฤษพิมพ์เล็กเพียงชุดเดียวทั้ง 26 ตัว มีรูปแบบที่เป็นไปได้ทั้งหมดกี่แบบ (ตอบเป็นจำนวนเต็ม)
    answer: { value: 17576, unit: แบบ }
    hints:
      - "แต่ละตำแหน่งเลือกได้จาก 26 ตัวอักษร และแต่ละตำแหน่งเลือกอิสระจากกัน"
      - "เมื่อมี 3 ตำแหน่ง ให้คูณ 26 ด้วยตัวเองสามครั้ง"
    misconceptions:
      - { match: 78, feedback: "คิดว่าเป็น 26 คูณ 3 แต่ตำแหน่งแต่ละตำแหน่งต้องคูณกัน ไม่ใช่บวกกัน" }
    solution: "26 × 26 × 26 = 26^3 = 17576 แบบ เมื่อความยาวเพิ่มขึ้นจำนวนแบบจะเพิ่มอย่างรวดเร็ว นี่เป็นเหตุผลว่าทำไมความยาวจึงสำคัญ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.secure-coding.p002
    topics: [computer.security.secure-coding]
    difficulty: 1
    type: mcq
    stem: |
      ข้อใดเป็นตัวอย่างของการตรวจข้อมูลเข้าแบบรายการที่อนุญาต (allowlist)
    choices:
      - { id: a, text: 'รับทุกอักขระยกเว้นเครื่องหมาย < และ >', feedback: "นี่คือรายการที่ห้าม (denylist) ซึ่งอาจตกหล่นรูปแบบที่ไม่เคยคิดถึง" }
      - { id: b, text: 'รับเฉพาะตัวเลข 0 ถึง 9 สำหรับเบอร์โทร', correct: true }
      - { id: c, text: 'ตัดข้อความให้เหลือ 10 ตัวอักษรแรกเท่านั้น', feedback: "การตัดความยาวช่วยได้บ้าง แต่ไม่ได้กำหนดว่าอักขระใดยอมรับได้" }
      - { id: d, text: 'บันทึกข้อความที่รับมาลงไฟล์ log ทุกครั้ง', feedback: "การบันทึกช่วยติดตามเหตุการณ์ แต่ไม่ได้ตรวจว่าข้อมูลถูกต้อง" }
    hints:
      - "รายการที่อนุญาตบอกว่าอะไรยอมรับได้"
      - "ตัวเลือกที่ระบุชุดอักขระที่ยอมรับตรง ๆ คือคำตอบ"
    solution: "การรับเฉพาะตัวเลข 0 ถึง 9 คือการกำหนดรายการที่อนุญาตชัดเจน ข้อมูลอื่นทั้งหมดจะถูกปฏิเสธ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.secure-coding.p003
    topics: [computer.security.secure-coding]
    difficulty: 2
    type: numeric
    stem: |
      ทีมพัฒนาพบรหัสผ่านของฐานข้อมูลถูกเขียนไว้ตรง ๆ ในโค้ด 3 ไฟล์ ถ้าต้องเปลี่ยนรหัสผ่านนี้และไม่มีการดึงค่าจากที่อื่น ต้องแก้ไขกี่จุดอย่างน้อย (ตอบเป็นจำนวนเต็ม)
    answer: { value: 3, unit: จุด }
    hints:
      - "นับจำนวนที่ค่าลับปรากฏอยู่ในโค้ดทั้งหมด"
      - "ทุกไฟล์ที่มีค่านั้นต้องถูกแก้เพื่อให้ค่าใหม่ใช้ได้"
    misconceptions:
      - { match: 1, feedback: "คิดว่าแก้ที่เดียวพอ แต่ค่าถูกเขียนซ้ำในสามไฟล์ จึงต้องแก้ทั้งสาม หรือดึงค่าจากที่กลางเพียงที่เดียว" }
    solution: "ค่าที่ฝังอยู่สามจุดต้องแก้สามจุด วิธีที่ดีกว่าคือเก็บความลับนอกโค้ดแล้วอ่านจากตัวแปรสภาพแวดล้อมหรือระบบจัดการความลับที่จุดเดียว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.secure-coding.p004
    topics: [computer.security.secure-coding]
    difficulty: 2
    type: mcq
    stem: |
      ข้อใดเป็นวิธีเก็บรหัสผ่านของผู้ใช้ที่ถูกต้องที่สุด
    choices:
      - { id: a, text: 'เก็บเป็นข้อความธรรมดาเพื่อให้ตรวจสอบได้ง่าย', feedback: "ถ้าฐานข้อมูลรั่วไหล รหัสผ่านทุกคนจะถูกเปิดเผยทันที" }
      - { id: b, text: 'เก็บแฮชโดยไม่ใส่ salt เพราะทำให้ค่าเดาได้ยากพอแล้ว', feedback: "การไม่ใส่ salt ทำให้รหัสผ่านที่เหมือนกันได้แฮชเหมือนกัน และเปิดช่องให้โจมตีด้วยตารางที่คำนวณไว้ล่วงหน้า" }
      - { id: c, text: 'เข้ารหัสด้วย Base64 แล้วเก็บ', feedback: "Base64 เป็นการแปลงรูปแบบเพื่อการส่งข้อมูล ไม่ได้ซ่อนค่า และถอดกลับได้ทันที" }
      - { id: d, text: 'เก็บค่าแฮชที่มี salt โดยใช้ฟังก์ชันที่ออกแบบสำหรับรหัสผ่าน', correct: true }
    hints:
      - "ควรเก็บค่าที่ย้อนกลับเป็นรหัสผ่านเดิมได้ยากที่สุด"
      - "ตัวเลือกที่แค่แปลงรูปแบบไม่ได้ป้องกันอะไรมากนัก"
    solution: "การเก็บแฮชที่มี salt ด้วยฟังก์ชันที่ออกแบบสำหรับรหัสผ่าน ทำให้การรั่วไหลของฐานข้อมูลไม่ได้เปิดเผยรหัสผ่านโดยตรง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.secure-coding.p005
    topics: [computer.security.secure-coding]
    difficulty: 2
    type: text
    stem: |
      ช่องโหว่ที่เกิดจากการนำข้อมูลที่ผู้ใช้กรอกไปต่อเข้าเป็นส่วนของคำสั่ง SQL โดยตรง เรียกว่าอะไร (ตอบชื่อภาษาอังกฤษสองคำ)
    accepted: ["SQL injection", "SQLi"]
    misconceptions:
      - { match: "xss", feedback: "XSS เกิดจากการแสดงข้อความที่ไม่หลีกอักขระในหน้าเว็บ ไม่ใช่การแทรกในคำสั่ง SQL" }
    hints:
      - "คำแรกบอกภาษาของคำสั่งที่ถูกโจมตี"
      - "คำที่สองหมายถึงการแทรกข้อมูลเข้าไปในคำสั่ง"
    solution: "การแทรกคำสั่ง SQL (SQL injection) เกิดเมื่อข้อมูลถูกตีความเป็นส่วนของคำสั่ง ป้องกันด้วยคำสั่งแบบพารามิเตอร์และการตรวจข้อมูลเข้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.secure-coding.p006
    topics: [computer.security.secure-coding]
    difficulty: 2
    type: order
    stem: |
      ลำดับแนวปฏิบัติเมื่อข้อมูลจากผู้ใช้เดินทางผ่านระบบ เรียงจากจุดที่ข้อมูลเข้าสู่ระบบไปจนถึงจุดที่ข้อมูลออกไป
    items:
      - "ตรวจชนิด ความยาว และรูปแบบของข้อมูลเทียบกับรายการที่อนุญาต"
      - "ส่งข้อมูลเข้าคำสั่งฐานข้อมูลด้วยพารามิเตอร์ ไม่ต่อเป็นสตริง"
      - "หลีกอักขระตามบริบทก่อนแสดงผลในหน้าเว็บ"
      - "บันทึกเหตุการณ์ที่ผิดปกติ โดยไม่เก็บรหัสผ่านหรือความลับลง log"
    hints:
      - "ข้อมูลต้องถูกตรวจก่อนจะถูกใช้ในที่ใด ๆ ภายในระบบ"
      - "การหลีกอักขระทำเมื่อถึงจุดที่ข้อมูลจะถูกแสดงออกไป"
    solution: "ตรวจข้อมูลที่ขอบระบบก่อน แล้วแยกคำสั่งกับข้อมูลเมื่อเข้าฐานข้อมูล หลีกอักขระที่จุดแสดงผล และบันทึกเหตุการณ์โดยไม่รวมความลับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.secure-coding.p007
    topics: [computer.security.secure-coding]
    difficulty: 3
    type: match
    stem: |
      จับคู่ชื่อช่องโหว่หรือหลักการกับคำอธิบายที่ตรงที่สุด
    pairs:
      - { left: "XSS", right: "ข้อความจากผู้ใช้ถูกแสดงในหน้าเว็บโดยไม่หลีกอักขระ" }
      - { left: "การตรวจสิทธิ์ที่ขาดหาย", right: "ระบบไม่ตรวจว่าผู้ใช้มีสิทธิ์เข้าถึงข้อมูลนั้นหรือไม่" }
      - { left: "ความลับฝังในโค้ด", right: "รหัสผ่านหรือกุญแจ API อยู่ในซอร์สโค้ดหรือประวัติของรีโพ" }
      - { left: "สิทธิ์น้อยที่สุด", right: "ให้สิทธิ์แก่บัญชีเท่าที่หน้าที่ต้องใช้เท่านั้น" }
    hints:
      - "ดูว่าคำอธิบายพูดถึงการแสดงผล การตรวจสิทธิ์ ความลับ หรือการให้สิทธิ์"
      - "สิทธิ์น้อยที่สุดเป็นหลักการออกแบบ ไม่ใช่ช่องโหว่"
    solution: "XSS เกิดจากการแสดงผลที่ไม่หลีกอักขระ การตรวจสิทธิ์ที่ขาดทำให้เข้าถึงข้อมูลของผู้อื่นได้ ความลับฝังในโค้ดรั่วได้เมื่อโค้ดถูกแชร์ และสิทธิ์น้อยที่สุดคือหลักการจำกัดสิทธิ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.secure-coding.p008
    topics: [computer.security.secure-coding]
    difficulty: 2
    type: numeric
    stem: |
      ระบบจำกัดการเข้าสู่ระบบไว้ไม่เกิน 5 ครั้งภายใน 10 นาที ถ้าผู้ใช้พิมพ์รหัสผ่านผิดไปแล้ว 3 ครั้งในช่วงเวลานั้น ระบบจะยอมให้ผิดได้อีกกี่ครั้งก่อนจะล็อก (ตอบเป็นจำนวนเต็ม)
    answer: { value: 2, unit: ครั้ง }
    hints:
      - "ขีดจำกัดคือจำนวนครั้งทั้งหมดที่อนุญาต ลบจำนวนที่ใช้ไปแล้ว"
      - "ระบบล็อกเมื่อถึงขีดจำกัดพอดี"
    misconceptions:
      - { match: 3, feedback: "ตอบจำนวนที่ผิดไปแล้ว แต่โจทย์ถามจำนวนที่เหลือก่อนถึงขีดจำกัด" }
    solution: "ขีดจำกัด 5 ลบ 3 ที่ใช้ไปแล้วได้ 2 ครั้ง การจำกัดจำนวนครั้งเป็นการป้องกันการเดารหัสผ่านซ้ำ ๆ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.secure-coding.p009
    topics: [computer.security.secure-coding]
    difficulty: 3
    type: numeric
    stem: |
      ระบบร้านกาแฟมีบทบาทผู้ใช้ 3 แบบ คือ ลูกค้า พนักงาน และผู้จัดการ และมีการกระทำ 4 อย่าง คือ ดูเมนู สั่งซื้อ แก้ราคา และดูรายงาน ถ้าต้องกำหนดสิทธิ์ให้ทุกคู่ของบทบาทกับการกระทำแบบชัดเจนตามหลักสิทธิ์น้อยที่สุด จะต้องเขียนกฎทั้งหมดกี่ข้อ (ตอบเป็นจำนวนเต็ม)
    answer: { value: 12, unit: ข้อ }
    hints:
      - "แต่ละบทบาทต้องมีการตัดสินใจสำหรับทุกการกระทำ"
      - "นับคู่ทั้งหมดของบทบาทกับการกระทำ"
    misconceptions:
      - { match: 4, feedback: "นับเฉพาะการกระทำ ไม่ได้นับทุกคู่ของบทบาทกับการกระทำ" }
    solution: "3 บทบาท × 4 การกระทำ = 12 คู่ และต้องกำหนดสิทธิ์ของแต่ละคู่ให้ชัดเจน โดยค่าเริ่มต้นคือไม่อนุญาต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.secure-coding.p010
    topics: [computer.security.secure-coding]
    difficulty: 3
    type: mcq
    stem: |
      เหตุใดการแสดงข้อความ error ที่มีรายละเอียดภายในให้ผู้ใช้ทั่วไปเห็นจึงเสี่ยงต่อความปลอดภัย
    choices:
      - { id: a, text: 'ทำให้ผู้ใช้อ่านข้อความนานขึ้น', feedback: "เรื่องความยาวของข้อความไม่ใช่ประเด็นด้านความปลอดภัย" }
      - { id: b, text: 'ทำให้ภาษาไทยแสดงผลผิดพลาด', feedback: "ปัญหาการแสดงผลภาษาไม่เกี่ยวกับความปลอดภัยโดยตรง" }
      - { id: c, text: 'เปิดเผยรายละเอียดภายในระบบ เช่น ชื่อตาราง หรือเวอร์ชันของซอฟต์แวร์ ซึ่งอาจถูกนำไปใช้วางแผนการโจมตี', correct: true }
      - { id: d, text: 'ทำให้ระบบช้าลงอย่างมาก', feedback: "ข้อความ error ปกติไม่ได้ทำให้ช้าอย่างมีนัยสำคัญ" }
    hints:
      - "ข้อมูลที่ผู้ไม่หวังดีอยากรู้คือโครงสร้างและเวอร์ชันของระบบ"
      - "ควรบอกผู้ใช้เพียงพอให้แก้ไขได้ และเก็บรายละเอียดเชิงลึกไว้ในบันทึกของทีม"
    solution: "ข้อความที่เผยรายละเอียดภายในให้ข้อมูลกับผู้ไม่หวังดี ควรแสดงข้อความทั่วไปแก่ผู้ใช้ และบันทึกรายละเอียดไว้ฝั่งเซิร์ฟเวอร์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.secure-coding.p011
    topics: [computer.security.secure-coding]
    difficulty: 3
    type: mcq
    stem: |
      ข้อใดเป็นแนวทางการจัดการความลับ เช่น กุญแจ API ที่ถูกต้อง
    choices:
      - { id: a, text: 'commit ไฟล์ .env ที่มีค่าความลับลงในรีโพเพื่อให้ทีมใช้ร่วมกัน', feedback: "ค่าที่ถูก commit จะอยู่ในประวัติของรีโพ และอาจรั่วได้แม้ลบไฟล์ภายหลัง" }
      - { id: b, text: 'ฝังค่า API key ในโค้ดเพื่อให้ไม่ต้องตั้งค่าเพิ่ม', feedback: "ค่าที่ฝังในโค้ดจะถูกแชร์และบันทึกไปพร้อมโค้ด" }
      - { id: c, text: 'อ่านค่าจากตัวแปรสภาพแวดล้อมหรือระบบจัดการความลับ แล้วไม่พิมพ์ค่าออกมาในบันทึก', correct: true }
      - { id: d, text: 'ส่งรหัสผ่านไปกับ URL ในรูปแบบ query string', feedback: "URL มักถูกบันทึกในประวัติและ log ของเซิร์ฟเวอร์ จึงไม่ควรส่งความลับทางนั้น" }
    hints:
      - "ความลับควรอยู่นอกโค้ดและไม่ถูกบันทึกในที่ที่คนอื่นเข้าถึงได้"
      - "ตัวเลือกที่พูดถึงการอ่านค่าจากภายนอกโค้ดคือแนวทางที่ถูกต้อง"
