  - ระดับเอสโตรเจนและโพรเจสเตอโรนส่งผลย้อนกลับไปที่ต่อมใต้สมอง
  solution: ฮอร์โมนคล้ายเอสโตรเจนและโพรเจสเตอโรนในยาส่งผลย้อนกลับไปกดการหลั่ง FSH และ LH ไข่จึงไม่ตก และยังทำให้มูกที่ปากมดลูกข้นจนอสุจิผ่านยาก
