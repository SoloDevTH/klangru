problems:
  - id: computer.programming.block-programming.p001
    topics: [computer.programming.block-programming]
    difficulty: 1
    type: mcq
    stem: "ข้อใดอธิบายคำว่า **โปรแกรม** ได้ถูกต้องที่สุด"
    choices:
      - { id: a, text: "ชุดคำสั่งที่เรียงไว้ให้คอมพิวเตอร์ทำตามทีละคำสั่ง", correct: true }
      - { id: b, text: "เครื่องคอมพิวเตอร์ที่ใช้เล่นเกม", feedback: "เครื่องคอมพิวเตอร์คือฮาร์ดแวร์ โปรแกรมคือคำสั่งที่ทำงานอยู่ในเครื่อง" }
      - { id: c, text: "ภาพที่แสดงบนหน้าจอ", feedback: "ภาพบนจอเป็นผลที่โปรแกรมแสดง ไม่ใช่ตัวโปรแกรม" }
      - { id: d, text: "คำสั่งที่คอมพิวเตอร์เลือกทำตามใจชอบ", feedback: "คอมพิวเตอร์ไม่เลือกเอง ทำตามคำสั่งตรงตัวตามลำดับที่เราเรียง" }
    hints:
      - "นึกถึงบัตรคำสั่งที่เราเรียงให้เพื่อนที่เป็นหุ่นยนต์ทำตาม"
      - "โปรแกรมคืออัลกอริทึมที่เขียนในรูปที่เครื่องทำตามได้"
    solution: "โปรแกรมคือชุดคำสั่งที่เรียงลำดับไว้ให้คอมพิวเตอร์หรือหุ่นยนต์ทำตามทีละคำสั่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.block-programming.p002
    topics: [computer.programming.block-programming]
    difficulty: 1
    type: match
    stem: "จับคู่บล็อกกับสิ่งที่บล็อกนั้นทำ"
    pairs:
      - { left: "เมื่อกดปุ่มเริ่ม", right: "เริ่มให้สคริปต์ด้านล่างทำงาน" }
      - { left: "เดินหน้า 1 ช่อง", right: "ย้ายไปช่องถัดไปตามทางที่หันอยู่" }
      - { left: "เลี้ยวขวา", right: "หันตัวไปทางขวาโดยไม่ย้ายช่อง" }
      - { left: "ทำซ้ำ 3 ครั้ง", right: "ทำบล็อกข้างในซ้ำหลายรอบ" }
    hints:
      - "บล็อกหัวโค้งเป็นบล็อกเหตุการณ์"
      - "บล็อกใดทำให้หุ่นยนต์ย้ายช่องจริง บล็อกใดแค่หันตัว"
    solution: "เมื่อกดปุ่มเริ่ม = เริ่มสคริปต์, เดินหน้า = ย้ายช่อง, เลี้ยวขวา = หันตัวอยู่กับที่, ทำซ้ำ = ทำบล็อกข้างในหลายรอบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.block-programming.p003
    topics: [computer.programming.block-programming]
    difficulty: 2
    type: order
    stem: "หุ่นยนต์อยู่ที่ A5 หันขึ้น ต้องไปเก็บดาวที่ C2 โดยไม่ชนหิน เรียงบล็อกให้เป็นโปรแกรมที่ถูกต้อง"
    figure:
      src: maze-star.svg
      alt: "ตาราง 5 คูณ 5 คอลัมน์ A ถึง E จากซ้ายไปขวา แถว 1 ถึง 5 จากบนลงล่าง หุ่นยนต์อยู่ที่ A5 มุมซ้ายล่าง หันขึ้น ดาวอยู่ที่ C2 มีก้อนหินที่ B4 B3 และ C3 ช่องอื่นว่าง"
    items:
      - "เมื่อกดปุ่มเริ่ม"
      - "เดินหน้า 3 ช่อง"
      - "เลี้ยวขวา"
      - "เดินหน้า 2 ช่อง"
      - "เก็บดาว"
    hints:
      - "หินขวางทางขวาของแถว 3 และ 4 หุ่นยนต์ควรขึ้นไปถึงแถวไหนก่อนเลี้ยว"
      - "จาก A5 ขึ้นไปแถว 2 ต้องเดินกี่ช่อง แล้วจาก A2 ไป C2 ต้องเดินกี่ช่อง"
    solution: "เริ่ม → เดินหน้า 3 ช่อง (A5 → A2) → เลี้ยวขวา → เดินหน้า 2 ช่อง (A2 → C2) → เก็บดาว ถ้าสลับเป็นเดิน 2 ช่องก่อน หุ่นยนต์จะเลี้ยวที่ A3 แล้วชนหินที่ B3"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.block-programming.p004
    topics: [computer.programming.block-programming]
    difficulty: 2
    type: numeric
    stem: |
      หุ่นยนต์ทำตามโปรแกรมบล็อกนี้ เดินไปทั้งหมดกี่ช่อง

      ```
      เมื่อกดปุ่มเริ่ม
      ทำซ้ำ 5 ครั้ง
          เดินหน้า 2 ช่อง
      ```
    answer: { value: 10, unit: ช่อง }
    hints:
      - "บล็อกในวงวนทำกี่รอบ แต่ละรอบเดินกี่ช่อง"
      - "รวมทุกรอบเข้าด้วยกัน"
    misconceptions:
      - { match: 7, feedback: "7 ได้จาก 5 + 2 แต่การเดิน 2 ช่องเกิดซ้ำทุกรอบ ต้องคูณ 5 × 2" }
      - { match: 2, feedback: "2 ช่องคือรอบเดียว วงวนทำซ้ำ 5 รอบ" }
    solution: "เดินรอบละ 2 ช่อง 5 รอบ = 5 × 2 = 10 ช่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.block-programming.p005
    topics: [computer.programming.block-programming]
    difficulty: 2
    type: mcq
    stem: "ก่อนเริ่มต่อบล็อกทำเกมหุ่นยนต์เก็บดาว น้ำใสเขียนแผนไว้ แผนข้อใดดีที่สุด"
    choices:
      - { id: a, text: "เป้าหมาย: หุ่นยนต์เก็บดาวโดยไม่ชนหิน / ลำดับ: กดเริ่ม เดินขึ้น เลี้ยว เดินไปที่ดาว / ผลที่คาด: หยุดที่ช่อง C2", correct: true }
      - { id: b, text: "ทำเกมให้สนุก", feedback: "บอกแค่ความตั้งใจ ไม่บอกลำดับเหตุการณ์และผลที่คาดไว้ จึงใช้ตรวจโปรแกรมไม่ได้" }
      - { id: c, text: "ลองต่อบล็อกไปเรื่อย ๆ จนกว่าจะได้", feedback: "การลองผิดลองถูกโดยไม่มีแผน ทำให้ไม่รู้ว่าผลที่ถูกคืออะไร" }
      - { id: d, text: "ใช้บล็อกสีสวย ๆ ให้มากที่สุด", feedback: "จำนวนหรือสีของบล็อกไม่ได้บอกว่าโปรแกรมต้องทำอะไร" }
    hints:
      - "แผนที่ดีบอกว่าโปรแกรมต้องทำอะไร ทำตามลำดับใด และผลออกมาเป็นอย่างไร"
      - "แผนข้อใดใช้ตรวจได้ว่าโปรแกรมถูกหรือผิด"
    solution: "แผนที่ดีมีเป้าหมาย ลำดับเหตุการณ์ และผลที่คาดไว้ เมื่อรันแล้วจึงเทียบได้ว่าถูกหรือมีบั๊ก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.block-programming.p006
    topics: [computer.programming.block-programming]
    difficulty: 3
    type: mcq
    stem: "หุ่นยนต์เริ่มที่ A5 หันไปทางขวา และทำตามโปรแกรมในภาพ หุ่นยนต์จะหยุดที่ช่องใด"
    figure:
      src: trace-stairs.svg
      alt: "โปรแกรมบล็อก: เมื่อกดปุ่มเริ่ม แล้ว ทำซ้ำ 3 ครั้ง ข้างในมี เดินหน้า 1 ช่อง, เลี้ยวซ้าย, เดินหน้า 1 ช่อง, เลี้ยวขวา ตามลำดับ ข้างโปรแกรมเป็นตาราง 5 คูณ 5 คอลัมน์ A ถึง E แถว 1 ถึง 5 จากบนลงล่าง หุ่นยนต์อยู่ที่ A5 มุมซ้ายล่าง หันไปทางขวา"
    choices:
      - { id: a, text: "D2", correct: true }
      - { id: b, text: "C3", feedback: "C3 คือตำแหน่งหลังรอบที่ 2 วงวนทำทั้งหมด 3 รอบ" }
      - { id: c, text: "B4", feedback: "B4 คือตำแหน่งหลังรอบแรกเท่านั้น บล็อกในวงวนต้องทำซ้ำ 3 รอบ" }
      - { id: d, text: "A2", feedback: "ดูเหมือนนับแต่การเดินขึ้น แต่ทุกรอบหุ่นยนต์เดินไปทางขวา 1 ช่องก่อนแล้วจึงขึ้น" }
    hints:
      - "รอบแรก: เดินไปทางขวา 1 ช่อง เลี้ยวซ้ายแล้วหันไปทางไหน"
      - "หลังจบหนึ่งรอบ หุ่นยนต์หันไปทางขวาเหมือนตอนเริ่ม แต่ละรอบจึงขยับขวา 1 และขึ้น 1"
    solution: "แต่ละรอบ: ขวา 1 ช่อง เลี้ยวซ้าย (หันขึ้น) ขึ้น 1 ช่อง เลี้ยวขวา (หันขวาเหมือนเดิม) รอบ 1 ถึง B4 รอบ 2 ถึง C3 รอบ 3 ถึง D2 ได้เส้นทางเป็นขั้นบันได"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.block-programming.p007
    topics: [computer.programming.block-programming]
    difficulty: 3
    type: mcq
    stem: "โปรแกรมในภาพตั้งใจให้หุ่นยนต์เดินรอบสี่เหลี่ยมจัตุรัสตามเส้นประแล้วกลับมาที่ B4 แต่เมื่อรัน หุ่นยนต์ไปหยุดที่ D4 ต้องแก้อย่างไร"
    figure:
      src: bug-square.svg
      alt: "โปรแกรมบล็อก: เมื่อกดปุ่มเริ่ม แล้ว ทำซ้ำ 3 ครั้ง ข้างในมี เดินหน้า 2 ช่อง และ เลี้ยวขวา ข้างโปรแกรมเป็นตาราง หุ่นยนต์อยู่ที่ B4 หันขึ้น เส้นประเป็นเส้นทางที่ต้องการ คือ B4 ขึ้นไป B2 ไปขวาถึง D2 ลงมา D4 แล้วไปซ้ายกลับ B4"
    choices:
      - { id: a, text: "เปลี่ยน ทำซ้ำ 3 ครั้ง เป็น ทำซ้ำ 4 ครั้ง", correct: true }
      - { id: b, text: "เปลี่ยน เลี้ยวขวา เป็น เลี้ยวซ้าย", feedback: "ถ้าเลี้ยวซ้าย หุ่นยนต์จะเดินไปทางซ้ายของ B2 ไม่ตรงกับเส้นประ ทิศถูกแล้ว แค่เดินไม่ครบ" }
      - { id: c, text: "เปลี่ยน เดินหน้า 2 ช่อง เป็น เดินหน้า 3 ช่อง", feedback: "ด้านของสี่เหลี่ยมยาว 2 ช่องถูกแล้ว ถ้าเดิน 3 ช่องรูปจะใหญ่เกินเส้นประ" }
      - { id: d, text: "ย้าย เลี้ยวขวา ออกไปไว้นอกวงวน", feedback: "หุ่นยนต์จะเดินตรงขึ้นไปเรื่อย ๆ ไม่เลี้ยวที่มุมเลย" }
    hints:
      - "สี่เหลี่ยมมีกี่ด้าน วงวนทำกี่รอบ"
      - "หุ่นยนต์หยุดที่ D4 แปลว่าเดินไปแล้วกี่ด้าน และขาดอีกกี่ด้าน"
    solution: "แต่ละรอบเดิน 1 ด้าน สามรอบจึงได้ 3 ด้าน (B4 → B2 → D2 → D4) ขาดด้านสุดท้าย ต้องทำซ้ำ 4 ครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.block-programming.p008
    topics: [computer.programming.block-programming]
    difficulty: 3
    type: numeric
    stem: "เมื่อรันโปรแกรมในภาพ หุ่นยนต์จะพูดตัวเลขใด"
    figure:
      src: coins-variable.svg
      alt: "โปรแกรมบล็อกเรียงจากบนลงล่าง: เมื่อกดปุ่มเริ่ม, ตั้ง เหรียญ เป็น 0, ทำซ้ำ 4 ครั้ง ข้างในมี เดินหน้า 1 ช่อง และ เพิ่ม เหรียญ ทีละ 2, หลังวงวนคือ พูด เหรียญ"
    answer: { value: 8 }
    hints:
      - "ตัวแปร เหรียญ เริ่มที่ค่าใด"
      - "แต่ละรอบเพิ่มเหรียญเท่าใด และวงวนทำกี่รอบ"
    misconceptions:
      - { match: 2, feedback: "2 คือค่าหลังรอบแรก บล็อก เพิ่ม เหรียญ อยู่ในวงวน จึงทำทั้ง 4 รอบ" }
      - { match: 4, feedback: "4 คือจำนวนรอบ แต่แต่ละรอบเพิ่มเหรียญทีละ 2" }
    solution: "เหรียญเริ่มที่ 0 รอบละ +2 สี่รอบ: 0 → 2 → 4 → 6 → 8 จึงพูด 8"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.block-programming.p009
    topics: [computer.programming.block-programming]
    difficulty: 3
    type: mcq
    stem: "เกมในภาพมีสคริปต์สองชุดที่ทำงานเมื่อกดลูกศร หุ่นยนต์อยู่ที่ C3 หันขึ้น ผู้เล่นกดลูกศร ขึ้น, ขวา, ขึ้น, ขึ้น ตามลำดับ หุ่นยนต์จะอยู่ที่ช่องใด"
    figure:
      src: events-keys.svg
      alt: "สคริปต์ชุดแรก: เมื่อกดลูกศรขึ้น ต่อด้วย เดินหน้า 1 ช่อง สคริปต์ชุดที่สอง: เมื่อกดลูกศรขวา ต่อด้วย เลี้ยวขวา ข้าง ๆ เป็นตาราง 5 คูณ 5 คอลัมน์ A ถึง E แถว 1 ถึง 5 จากบนลงล่าง หุ่นยนต์อยู่ที่ C3 หันขึ้น"
    choices:
      - { id: a, text: "E2", correct: true }
      - { id: b, text: "D2", feedback: "หลังเลี้ยวขวา ผู้เล่นกดลูกศรขึ้นอีก 2 ครั้ง จึงเดินหน้า 2 ช่อง ไม่ใช่ 1 ช่อง" }
      - { id: c, text: "A2", feedback: "ลูกศรขวาสั่ง เลี้ยวขวา ไม่ใช่เลี้ยวซ้าย หุ่นยนต์จึงหันไปทางขวาของตาราง" }
      - { id: d, text: "C2", feedback: "ทุกครั้งที่กดลูกศรขึ้น สคริปต์ เดินหน้า 1 ช่อง ทำงานใหม่ ไม่ได้ทำแค่ครั้งแรก" }
    hints:
      - "การกดลูกศรแต่ละครั้งเป็นข้อมูลเข้าที่ทำให้สคริปต์ของลูกศรนั้นทำงานหนึ่งครั้ง"
      - "ลูกศรขึ้นแปลว่าเดินหน้าไปทางที่หันอยู่ ไม่ได้แปลว่าขึ้นด้านบนของตารางเสมอ"
    solution: "ขึ้น: C3 → C2 / ขวา: หันไปทางขวา / ขึ้น: C2 → D2 / ขึ้น: D2 → E2 หุ่นยนต์อยู่ที่ E2"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.block-programming.p010
    topics: [computer.programming.block-programming]
    difficulty: 3
    type: order
    stem: "โปรแกรมเกมของต้นทำงานไม่ตรงกับที่ตั้งใจ เรียงขั้นตอนการดีบักให้ถูกต้อง"
    items:
      - "รันโปรแกรมแล้วดูว่าเกิดอะไรขึ้น"
      - "เทียบผลที่ได้กับผลที่คาดไว้ในแผน"
      - "ไล่ทีละบล็อกหาจุดแรกที่เริ่มผิด"
      - "แก้บล็อกนั้นเพียงอย่างเดียว"
      - "รันโปรแกรมอีกครั้งเพื่อตรวจว่าแก้ได้จริง"
    hints:
      - "ต้องรู้ก่อนว่าผลผิดอย่างไร จึงจะหาจุดที่ผิดได้"
      - "แก้แล้วต้องทดสอบซ้ำเสมอ"
    solution: "รัน → เทียบกับที่คาด → ไล่หาจุดแรกที่ผิด → แก้ทีละอย่าง → รันทดสอบซ้ำ ถ้ายังไม่ถูกก็วนกลับไปเทียบใหม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.block-programming.p011
    topics: [computer.programming.block-programming]
    difficulty: 3
    type: mcq
    stem: |
