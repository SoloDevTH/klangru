<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="460" height="250" font-family="sans-serif">
  <title>ใบเสร็จที่กำหนดความกว้างคอลัมน์ 10 ช่อง 3 ช่อง และ 9 ช่อง แต่ละบรรทัดตรงกับกรอบเดียวกัน</title>
  <rect x="0" y="0" width="460" height="250" fill="#ffffff"/>
  <text x="90.0" y="26" font-size="13" text-anchor="middle" fill="#1f2937">ชื่อ</text>
  <rect x="30.0" y="34" width="120.0" height="22" fill="#fde68a" stroke="#b45309" stroke-width="1"/>
  <text x="90.0" y="50" font-size="12" text-anchor="middle" fill="#7c2d12">10 ช่อง</text>
  <text x="168.0" y="26" font-size="13" text-anchor="middle" fill="#1f2937">จำนวน</text>
  <rect x="150.0" y="34" width="36.0" height="22" fill="#fde68a" stroke="#b45309" stroke-width="1"/>
  <text x="168.0" y="50" font-size="12" text-anchor="middle" fill="#7c2d12">3 ช่อง</text>
  <text x="240.0" y="26" font-size="13" text-anchor="middle" fill="#1f2937">ราคา</text>
  <rect x="186.0" y="34" width="108.0" height="22" fill="#fde68a" stroke="#b45309" stroke-width="1"/>
  <text x="240.0" y="50" font-size="12" text-anchor="middle" fill="#7c2d12">9 ช่อง</text>
  <text x="30.0" y="90" font-size="18" font-family="DejaVu Sans Mono, monospace" fill="#1f2937" xml:space="preserve">Latte     </text>
  <text x="150.0" y="90" font-size="18" font-family="DejaVu Sans Mono, monospace" fill="#1f2937" xml:space="preserve">  2</text>
  <text x="186.0" y="90" font-size="18" font-family="DejaVu Sans Mono, monospace" fill="#1f2937" xml:space="preserve">    65.00</text>
  <text x="30.0" y="120" font-size="18" font-family="DejaVu Sans Mono, monospace" fill="#1f2937" xml:space="preserve">Croissant </text>
  <text x="150.0" y="120" font-size="18" font-family="DejaVu Sans Mono, monospace" fill="#1f2937" xml:space="preserve">  1</text>
  <text x="186.0" y="120" font-size="18" font-family="DejaVu Sans Mono, monospace" fill="#1f2937" xml:space="preserve">    45.50</text>
  <line x1="30.0" y1="132" x2="294.0" y2="132" stroke="#374151" stroke-width="1.5"/>
  <text x="30.0" y="150" font-size="18" font-family="DejaVu Sans Mono, monospace" fill="#1f2937" xml:space="preserve">Total     </text>
  <text x="150.0" y="150" font-size="18" font-family="DejaVu Sans Mono, monospace" fill="#1f2937" xml:space="preserve">  3</text>
  <text x="186.0" y="150" font-size="18" font-family="DejaVu Sans Mono, monospace" fill="#1f2937" xml:space="preserve">   175.50</text>
  <text x="30.0" y="200" font-size="14" fill="#374151">ทุกแถวยาวเท่ากัน 22 ช่อง ชื่อชิดซ้าย ตัวเลขชิดขวา</text>
  <text x="30.0" y="222" font-size="13" fill="#6b7280">ช่องว่างที่เติมมาจาก ljust(10), rjust(3) และ :&gt;9,.2f</text>
</svg>
