problems:
  - id: chemistry.materials.material-properties.p001
    topics: [chemistry.materials.material-properties]
    difficulty: 1
    type: mcq
    stem: "วัตถุใดนำไฟฟ้า"
    choices:
      - { id: a, text: "ตะปูเหล็ก", correct: true, feedback: "ถูก โลหะทุกชนิดนำไฟฟ้า" }
      - { id: b, text: "ยางลบ", feedback: "ยางเป็นฉนวนไฟฟ้า" }
      - { id: c, text: "ไม้บรรทัดพลาสติก", feedback: "พลาสติกเป็นฉนวนไฟฟ้า จึงใช้หุ้มสายไฟ" }
      - { id: d, text: "ตะเกียบไม้", feedback: "ไม้แห้งไม่นำไฟฟ้า" }
    hints:
      - "วัสดุใดใช้ทำไส้สายไฟ"
      - "มองหาวัตถุที่ทำจากโลหะ"
    solution: "**ตะปูเหล็ก** ทำจากโลหะ โลหะนำไฟฟ้า ส่วนยาง พลาสติก และไม้แห้งเป็นฉนวนไฟฟ้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.material-properties.p002
    topics: [chemistry.materials.material-properties]
    difficulty: 1
    type: mcq
    stem: "วัตถุใดมี **สภาพยืดหยุ่น** ดึงแล้วยืด ปล่อยแล้วกลับคืนรูปเดิม"
    choices:
      - { id: a, text: "ยางรัดถุงกับข้าว", correct: true, feedback: "ถูก ยางยืดแล้วหดกลับ" }
      - { id: b, text: "ดินน้ำมัน", feedback: "ดินน้ำมันเปลี่ยนรูปแล้วไม่กลับคืน" }
      - { id: c, text: "แก้วน้ำ", feedback: "แก้วยืดไม่ได้ ถ้าออกแรงมากจะแตก" }
    hints:
      - "สภาพยืดหยุ่นต้องกลับคืนรูปเดิมได้"
      - "นึกถึงของที่ดึงแล้วดีดกลับ"
    solution: "**ยางรัดถุง** ยืดได้และหดกลับเมื่อปล่อย จึงมีสภาพยืดหยุ่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.material-properties.p003
    topics: [chemistry.materials.material-properties]
    difficulty: 2
    type: mcq
    stem: "นำตะปูเหล็กขูดแผ่นไม้ แผ่นไม้เป็นรอย แต่นำแผ่นไม้ขูดตะปู ตะปูไม่เป็นรอย สรุปได้ว่าอย่างไร"
    choices:
      - { id: a, text: "เหล็กแข็งกว่าไม้", correct: true, feedback: "ถูก วัสดุที่ขูดอีกชนิดเป็นรอยได้แข็งกว่า" }
      - { id: b, text: "ไม้แข็งกว่าเหล็ก", feedback: "ไม้ถูกขูดเป็นรอย แปลว่าไม้อ่อนกว่า" }
      - { id: c, text: "เหล็กหนักกว่าไม้จึงแข็งกว่า", feedback: "ข้อสรุปมาจากการขูดขีด ไม่ใช่น้ำหนัก" }
    hints:
      - "ใครเป็นฝ่ายที่มีรอย"
      - "วัสดุที่ถูกขูดเป็นรอยคือวัสดุที่อ่อนกว่า"
    solution: "ตะปูทำให้ไม้เป็นรอย แต่ไม้ทำให้ตะปูเป็นรอยไม่ได้ **เหล็กจึงแข็งกว่าไม้**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.material-properties.p004
    topics: [chemistry.materials.material-properties]
    difficulty: 2
    type: order
    stem: "นักเรียนขูดวัสดุ A, B, C กันเองได้ผลว่า A ขูด B และ C เป็นรอย, B ขูด C เป็นรอย, C ขูดอะไรไม่เป็นรอยเลย เรียงวัสดุจาก **อ่อนที่สุด** ไป **แข็งที่สุด**"
    items: ["C", "B", "A"]
    hints:
      - "วัสดุที่ขูดอีกชนิดเป็นรอยแข็งกว่า"
      - "C ขูดอะไรไม่ได้เลย จึงอ่อนที่สุด"
    solution: "C อ่อนที่สุด (ขูดอะไรไม่ได้) B แข็งกว่า C แต่อ่อนกว่า A และ A ขูดได้ทั้งสองชนิด จึงเรียงเป็น **C, B, A**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.material-properties.p005
    topics: [chemistry.materials.material-properties]
    difficulty: 2
    type: mcq
    stem: "ทำไมด้ามกระทะจึงมักทำจากไม้หรือพลาสติก"
    choices:
      - { id: a, text: "ไม้และพลาสติกนำความร้อนไม่ดี มือจึงไม่ร้อน", correct: true, feedback: "ถูก เป็นฉนวนความร้อน" }
      - { id: b, text: "ไม้และพลาสติกนำความร้อนได้ดี", feedback: "ถ้านำความร้อนดี ด้ามจะร้อนจนจับไม่ได้" }
      - { id: c, text: "ไม้และพลาสติกนำไฟฟ้าได้ดี", feedback: "ไม้และพลาสติกไม่นำไฟฟ้า และเรื่องนี้เกี่ยวกับความร้อน" }
    hints:
      - "ตัวกระทะร้อนมากเมื่อตั้งไฟ"
      - "ด้ามต้องไม่ส่งความร้อนมาที่มือ"
    solution: "ไม้และพลาสติก **นำความร้อนไม่ดี** (ฉนวนความร้อน) ความร้อนจากตัวกระทะจึงมาถึงมือได้น้อย ส่วนตัวกระทะเป็นโลหะเพราะนำความร้อนไปยังอาหารได้ดี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.material-properties.p006
    topics: [chemistry.materials.material-properties]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "นักเรียนหนีบวัตถุ X ด้วยวงจรในภาพ ถ้า X เป็นวัตถุต่อไปนี้ หลอดไฟจะสว่างเมื่อใช้วัตถุใด (เลือกได้มากกว่า 1 ข้อ)"
    figure:
      src: p-circuit-tester.svg
      alt: "วงจรเป็นวงเดียว ถ่านไฟฉายต่อสายไฟไปยังหลอดไฟ จากหลอดไฟต่อไปยังปากคีบอันแรก ปากคีบสองอันหนีบปลายสองข้างของวัตถุ X และปากคีบอันที่สองต่อสายกลับไปที่ถ่านไฟฉาย"
    choices:
      - { id: a, text: "ช้อนสแตนเลส", correct: true, feedback: "ถูก สแตนเลสเป็นโลหะ นำไฟฟ้า" }
      - { id: b, text: "คลิปหนีบกระดาษ", correct: true, feedback: "ถูก ทำจากเหล็ก นำไฟฟ้า" }
      - { id: c, text: "หลอดดูดพลาสติก", feedback: "พลาสติกเป็นฉนวน วงจรจึงไม่ครบ หลอดไม่สว่าง" }
      - { id: d, text: "ยางลบ", feedback: "ยางเป็นฉนวน หลอดไม่สว่าง" }
    hints:
      - "หลอดไฟสว่างเมื่อไฟฟ้าไหลผ่านวัตถุ X ได้"
      - "วัตถุใดทำจากโลหะ"
    solution: "ไฟฟ้าไหลครบวงเมื่อ X เป็นตัวนำไฟฟ้า **ช้อนสแตนเลส** และ **คลิปหนีบกระดาษ** เป็นโลหะ หลอดจึงสว่าง ส่วนพลาสติกและยางเป็นฉนวน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.material-properties.p007
    topics: [chemistry.materials.material-properties]
    difficulty: 3
    type: numeric
    stem: "ยางรัดของยาว 10 cm ดึงจนยาว 16 cm แล้วปล่อย ยางกลับมายาว 10 cm เท่าเดิม ขณะดึง ยางยืดออกไปกี่เซนติเมตร"
    answer: { value: 6, unit: cm }
    misconceptions:
      - { match: 16, feedback: "16 cm คือความยาวขณะดึง คำถามถามว่ายืดเพิ่มขึ้นเท่าใด" }
      - { match: 26, feedback: "ต้องลบ ไม่ใช่บวก ยืดออก = ความยาวขณะดึง − ความยาวเดิม" }
    hints:
      - "ยืดออก = ความยาวขณะดึง − ความยาวเดิม"
      - "ใช้ 16 และ 10"
    solution: "ยืดออก $16 - 10 = 6$ cm และกลับคืน 10 cm เท่าเดิม แสดงว่ายางมีสภาพยืดหยุ่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.material-properties.p008
    topics: [chemistry.materials.material-properties]
    difficulty: 3
    type: mcq
    stem: "ร้านรับซื้อของเก่าต้องแยกกระป๋องเหล็กออกจากกระป๋องอะลูมิเนียม วิธีใดง่ายที่สุด"
    choices:
      - { id: a, text: "ใช้แม่เหล็กดูด กระป๋องที่ถูกดูดคือกระป๋องเหล็ก", correct: true, feedback: "ถูก แม่เหล็กดูดเหล็กแต่ไม่ดูดอะลูมิเนียม" }
      - { id: b, text: "ใช้แม่เหล็กดูด กระป๋องที่ถูกดูดคืออะลูมิเนียม", feedback: "แม่เหล็กไม่ดูดอะลูมิเนียม" }
      - { id: c, text: "ทดสอบการนำไฟฟ้า", feedback: "ทั้งสองเป็นโลหะ นำไฟฟ้าทั้งคู่ จึงแยกไม่ได้" }
    hints:
      - "ทั้งเหล็กและอะลูมิเนียมเป็นโลหะ ต้องหาสมบัติที่ต่างกัน"
      - "แม่เหล็กดูดโลหะทุกชนิดหรือไม่"
    solution: "ทั้งสองนำไฟฟ้าและนำความร้อน แต่ **แม่เหล็กดูดเหล็ก ไม่ดูดอะลูมิเนียม** จึงใช้แม่เหล็กแยกได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.material-properties.p009
    topics: [chemistry.materials.material-properties]
    difficulty: 3
    type: match
    stem: "จับคู่ส่วนของสิ่งของกับสมบัติของวัสดุที่ทำให้เลือกใช้"
    pairs:
      - { left: "ไส้สายไฟทองแดง", right: "นำไฟฟ้าดี" }
      - { left: "พลาสติกหุ้มสายไฟ", right: "ไม่นำไฟฟ้า" }
      - { left: "หม้ออะลูมิเนียม", right: "นำความร้อนดี" }
      - { left: "ยางยืดขอบกางเกง", right: "มีสภาพยืดหยุ่น" }
      - { left: "หัวมีดตัดกระจกที่เป็นเพชร", right: "แข็งมาก" }
    hints:
      - "ถามว่าแต่ละส่วนต้องทำงานอะไร"
      - "สายไฟมีสองส่วน ส่วนในให้ไฟไหล ส่วนนอกกันไฟดูด"
    solution: "ทองแดงนำไฟฟ้า · พลาสติกหุ้มเป็นฉนวน · อะลูมิเนียมนำความร้อนไปยังอาหาร · ยางยืดหยุ่น · เพชรแข็งที่สุดจึงขูดกระจกได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.material-properties.p010
    topics: [chemistry.materials.material-properties]
    difficulty: 3
    type: numeric
    stem: "ทดลองตามภาพในบทเรียน เนยบนช้อนโลหะละลายในเวลา 45 วินาที ส่วนเนยบนช้อนพลาสติกละลายในเวลา 300 วินาที เนยบนช้อนพลาสติกละลายช้ากว่ากี่วินาที"
    answer: { value: 255, unit: วินาที }
    misconceptions:
      - { match: 345, feedback: "ต้องหาผลต่าง (ลบ) ไม่ใช่ผลรวม" }
    hints:
      - "ช้ากว่า = เวลาที่มากกว่า − เวลาที่น้อยกว่า"
      - "300 − 45"
    solution: "$300 - 45 = 255$ วินาที ช้อนพลาสติกนำความร้อนช้ากว่ามาก จึงเป็นฉนวนความร้อนที่ดีกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.material-properties.p011
    topics: [chemistry.materials.material-properties]
    difficulty: 4
    type: mcq
    stem: "ในการทดลองเปรียบเทียบการนำความร้อนของช้อนสามชนิด ข้อใดทำให้การทดลอง **ไม่ยุติธรรม**"
    choices:
      - { id: a, text: "ใช้ช้อนโลหะยาว 10 cm แต่ช้อนไม้ยาว 20 cm", correct: true, feedback: "ถูก ความยาวต่างกันทำให้ความร้อนต้องเดินทางไกลไม่เท่ากัน" }
      - { id: b, text: "ติดเนยก้อนเท่ากันทุกช้อน", feedback: "นี่คือการควบคุมตัวแปรที่ถูกต้อง" }
      - { id: c, text: "จุ่มช้อนทุกคันในน้ำร้อนชามเดียวกันพร้อมกัน", feedback: "ทำให้อุณหภูมิน้ำเท่ากัน เป็นการทดลองที่ยุติธรรม" }
    hints:
      - "การทดลองยุติธรรมเปลี่ยนเพียงสิ่งเดียวคือชนิดวัสดุ"
      - "หาข้อที่มีสิ่งอื่นต่างกันด้วย"
    solution: "ถ้าช้อนยาวไม่เท่ากัน ช้อนที่ยาวกว่าย่อมใช้เวลานานกว่าแม้วัสดุเหมือนกัน จึงสรุปไม่ได้ว่าผลเกิดจากวัสดุ ต้องให้ทุกช้อน **ยาวเท่ากัน**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.material-properties.p012
    topics: [chemistry.materials.material-properties]
    difficulty: 4
    type: mcq
    stem: "นักเรียนงอคลิปหนีบกระดาษเหล็กเป็นรูปตะขอ และปั้นดินน้ำมันจากก้อนกลมเป็นรูปงู ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "รูปร่างเปลี่ยน แต่ยังเป็นเหล็กและดินน้ำมันเหมือนเดิม", correct: true, feedback: "ถูก การบีบ งอ บิด ยืด เปลี่ยนรูปร่าง แต่ไม่เปลี่ยนวัสดุ" }
      - { id: b, text: "เหล็กกลายเป็นวัสดุใหม่เพราะรูปร่างเปลี่ยน", feedback: "ตะขอยังเป็นเหล็ก แม่เหล็กยังดูดได้และยังนำไฟฟ้า" }
      - { id: c, text: "ทั้งสองมีสภาพยืดหยุ่นเพราะเปลี่ยนรูปได้", feedback: "สภาพยืดหยุ่นต้องกลับคืนรูปเดิมเมื่อปล่อย ทั้งสองไม่กลับคืน" }
    hints:
      - "ลองทดสอบตะขอด้วยแม่เหล็กอีกครั้ง ผลจะเหมือนเดิมไหม"
      - "การเปลี่ยนรูปร่างกับการเปลี่ยนเป็นวัสดุใหม่ต่างกัน"
    solution: "การงอและการปั้น **เปลี่ยนรูปร่างแต่ไม่เปลี่ยนวัสดุ** ทั้งสองไม่กลับคืนรูปเดิม จึงไม่ใช่สภาพยืดหยุ่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.material-properties.p013
    topics: [chemistry.materials.material-properties]
    difficulty: 4
    type: mcq
    stem: "แม่ค้าข้าวแกงอยากได้ทัพพีตักแกงร้อนแบบใหม่ ข้อใดเลือกวัสดุได้เหมาะที่สุด"
    choices:
      - { id: a, text: "ส่วนตักเป็นสแตนเลส ด้ามเป็นไม้", correct: true, feedback: "ถูก สแตนเลสแข็ง ทนร้อน และไม่เป็นสนิมง่าย ไม้นำความร้อนไม่ดี" }
      - { id: b, text: "ทั้งอันเป็นสแตนเลส", feedback: "ด้ามโลหะนำความร้อนจากแกงขึ้นมาถึงมือ" }
      - { id: c, text: "ส่วนตักเป็นยาง ด้ามเป็นโลหะ", feedback: "ยางยืดหยุ่นและไม่แข็งพอตักของหนัก ส่วนด้ามโลหะร้อนมือ" }
    hints:
      - "แยกคิดทีละส่วน: ส่วนตักต้องทำอะไร ด้ามต้องทำอะไร"
      - "ด้ามต้องไม่ร้อนมือ"
    solution: "ส่วนตักต้องแข็งและทนร้อน จึงใช้ **สแตนเลส** ด้ามต้องไม่ส่งความร้อนถึงมือ จึงใช้ **ไม้** ซึ่งนำความร้อนไม่ดี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.material-properties.p014
    topics: [chemistry.materials.material-properties]
    difficulty: 4
    type: mcq
    stem: "ทำไมสายไฟในบ้านจึงมีทองแดงอยู่ข้างในและมีพลาสติกหุ้มข้างนอก"
    choices:
