<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" font-family="sans-serif" font-size="15">
  <title>สี่ขั้นเมื่อพบข้อความหรือบุคคลที่ไม่เหมาะสมทางออนไลน์: หยุด เก็บหลักฐาน บล็อกและรายงาน บอกผู้ใหญ่ที่ไว้ใจ</title>
  <rect x="0" y="0" width="800" height="250" fill="#ffffff"/>
  <rect x="20.0" y="40.0" width="170.0" height="170.0" rx="14" fill="#fdf2e6" stroke="#b4521f" stroke-width="2.5" />
  <circle cx="105.0" cy="40.0" r="20.0" fill="#b4521f" stroke="#b4521f" stroke-width="1.5"/>
  <text x="105.0" y="47.0" text-anchor="middle" fill="#fff" font-weight="bold" font-size="20" >1</text>
  <text x="105.0" y="100.0" text-anchor="middle" fill="#b4521f" font-weight="bold" font-size="19" >หยุด</text>
  <text x="105.0" y="145.0" text-anchor="middle" fill="#15211e" font-weight="normal" font-size="15" >ไม่ตอบโต้</text>
  <text x="105.0" y="170.0" text-anchor="middle" fill="#15211e" font-weight="normal" font-size="15" >ไม่ส่งต่อ</text>
  <line x1="193.0" y1="125.0" x2="203.0" y2="125.0" stroke="#15211e" stroke-width="2.5" />
  <polygon points="213.0,125.0 203.0,120.0 203.0,130.0" fill="#15211e"/>
  <rect x="216.0" y="40.0" width="170.0" height="170.0" rx="14" fill="#e3ecfa" stroke="#1f4e9c" stroke-width="2.5" />
  <circle cx="301.0" cy="40.0" r="20.0" fill="#1f4e9c" stroke="#1f4e9c" stroke-width="1.5"/>
  <text x="301.0" y="47.0" text-anchor="middle" fill="#fff" font-weight="bold" font-size="20" >2</text>
  <text x="301.0" y="100.0" text-anchor="middle" fill="#1f4e9c" font-weight="bold" font-size="19" >เก็บหลักฐาน</text>
  <text x="301.0" y="145.0" text-anchor="middle" fill="#15211e" font-weight="normal" font-size="15" >จับภาพหน้าจอ</text>
  <text x="301.0" y="170.0" text-anchor="middle" fill="#15211e" font-weight="normal" font-size="15" >ไว้ให้ผู้ใหญ่ดู</text>
  <line x1="389.0" y1="125.0" x2="399.0" y2="125.0" stroke="#15211e" stroke-width="2.5" />
  <polygon points="409.0,125.0 399.0,120.0 399.0,130.0" fill="#15211e"/>
  <rect x="412.0" y="40.0" width="170.0" height="170.0" rx="14" fill="#efe7f6" stroke="#6a3d9a" stroke-width="2.5" />
  <circle cx="497.0" cy="40.0" r="20.0" fill="#6a3d9a" stroke="#6a3d9a" stroke-width="1.5"/>
  <text x="497.0" y="47.0" text-anchor="middle" fill="#fff" font-weight="bold" font-size="20" >3</text>
  <text x="497.0" y="100.0" text-anchor="middle" fill="#6a3d9a" font-weight="bold" font-size="19" >บล็อกและรายงาน</text>
  <text x="497.0" y="145.0" text-anchor="middle" fill="#15211e" font-weight="normal" font-size="15" >ใช้ปุ่มรายงาน</text>
  <text x="497.0" y="170.0" text-anchor="middle" fill="#15211e" font-weight="normal" font-size="15" >ในแอปหรือเกม</text>
  <line x1="585.0" y1="125.0" x2="595.0" y2="125.0" stroke="#15211e" stroke-width="2.5" />
  <polygon points="605.0,125.0 595.0,120.0 595.0,130.0" fill="#15211e"/>
  <rect x="608.0" y="40.0" width="170.0" height="170.0" rx="14" fill="#d6efe9" stroke="#0a6b60" stroke-width="2.5" />
  <circle cx="693.0" cy="40.0" r="20.0" fill="#0a6b60" stroke="#0a6b60" stroke-width="1.5"/>
  <text x="693.0" y="47.0" text-anchor="middle" fill="#fff" font-weight="bold" font-size="20" >4</text>
  <text x="693.0" y="100.0" text-anchor="middle" fill="#0a6b60" font-weight="bold" font-size="19" >บอกผู้ใหญ่</text>
  <text x="693.0" y="145.0" text-anchor="middle" fill="#15211e" font-weight="normal" font-size="15" >พ่อแม่ ผู้ปกครอง</text>
  <text x="693.0" y="170.0" text-anchor="middle" fill="#15211e" font-weight="normal" font-size="15" >หรือครูที่ไว้ใจ</text>
  <text x="400.0" y="240.0" text-anchor="middle" fill="#6b7672" font-weight="normal" font-size="14" >ถ้าเป็นเรื่องอันตรายหรือเร่งด่วน ให้บอกผู้ใหญ่ทันที</text>
</svg>
