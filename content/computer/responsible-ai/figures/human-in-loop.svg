<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250"><title>ระบบ AI เสนอคำแนะนำ ผู้ตรวจที่เป็นมนุษย์ตัดสินใจสุดท้าย และผู้ได้รับผลกระทบอุทธรณ์ได้</title><rect width="720" height="250" fill="#ffffff"/><rect x="20" y="80" width="170" height="80" rx="10" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.5"/><text x="105.0" y="110" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">ข้อมูลนำเข้า</text><text x="105.0" y="134" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal">ข้อมูลผู้สมัครที่ยินยอม</text><rect x="250" y="80" width="190" height="80" rx="10" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/><text x="345.0" y="110" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">ระบบ AI</text><text x="345.0" y="134" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal">เสนอคำแนะนำพร้อมเหตุผลสั้น ๆ</text><rect x="500" y="80" width="190" height="80" rx="10" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/><text x="595.0" y="110" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">ผู้ตรวจที่เป็นมนุษย์</text><text x="595.0" y="134" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle" font-weight="normal">ตัดสินใจสุดท้ายและบันทึกเหตุผล</text><line x1="190" y1="120" x2="250" y2="120" stroke="#1f2937" stroke-width="1.5"/><line x1="440" y1="120" x2="500" y2="120" stroke="#1f2937" stroke-width="1.5"/><rect x="250" y="190" width="190" height="40" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="345" y="215" font-family="sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="normal">ผู้ได้รับผลกระทบอุทธรณ์ได้</text><line x1="595" y1="160" x2="595" y2="190" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/><line x1="595" y1="190" x2="440" y2="210" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/><text x="360" y="40" font-family="sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="normal">มนุษย์ยังรับผิดชอบการตัดสินใจที่มีผลกระทบสูง</text></svg>
