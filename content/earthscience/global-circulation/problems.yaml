  - id: earthscience.atmosphere.global-circulation.p015
    topics: [earthscience.atmosphere.global-circulation]
    difficulty: 5
    type: numeric
    stem: "ถ้าความกดอากาศเปลี่ยนต่อระยะทางเท่ากัน ลมจีออสโทรฟิกที่กรุงเทพฯ (13.75° เหนือ) จะเร็วเป็นกี่เท่าของที่ละติจูด 45° เหนือ (ตามสูตร $v_g = \\dfrac{1}{\\rho f}\\dfrac{\\Delta p}{\\Delta n}$ และ $\\rho$ เท่ากัน)"
    answer: { value: 2.97, tolerance: 0.03, unit: เท่า }
    misconceptions:
      - { match: 0.336, feedback: "กลับเศษกับส่วน $v_g$ แปรผกผันกับ $f$ ที่ละติจูดต่ำ $f$ น้อย $v_g$ จึงมาก" }
      - { match: 3.27, feedback: "ใช้อัตราส่วนของละติจูด $45 / 13.75$ ต้องใช้อัตราส่วนของ $\\sin\\varphi$" }
    hints:
      - "$v_g \\propto 1/f \\propto 1/\\sin\\varphi$"
      - "อัตราส่วน $= \\sin 45^\\circ / \\sin 13.75^\\circ$"
    solution: "$\\dfrac{v_{กรุงเทพฯ}}{v_{45^\\circ}} = \\dfrac{\\sin 45^\\circ}{\\sin 13.75^\\circ} = \\dfrac{0.7071}{0.2377} \\approx 2.97$ เท่า ใกล้เส้นศูนย์สูตรลมจริงไม่เร็วขนาดนั้น เพราะสมดุลจีออสโทรฟิกใช้ได้ไม่ดี แรงอื่นมีบทบาทมากขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.global-circulation.p016
