<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 390" width="620" height="390" font-family="sans-serif">
<title>ความสูงขนมจากการทดลองผงฟู 1.5 ช้อนชา สามครั้ง</title>
<rect width="620" height="390" fill="#ffffff"/>
<text x="310.0" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">ความสูงขนมจากการทดลองซ้ำ (ผงฟู 1.5 ช้อนชา)</text>
<line x1="90" y1="320.0" x2="570" y2="320.0" stroke="#334155" stroke-width="1.5"/>
<text x="80" y="325.0" text-anchor="end" font-size="13" fill="#374151">0</text>
