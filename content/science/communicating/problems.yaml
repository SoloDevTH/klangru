problems:
  - id: science.inquiry.communicating.p001
    topics: [science.inquiry.communicating]
    difficulty: 1
    type: match
    stem: "จับคู่ส่วนของรายงานการทดลองกับสิ่งที่ควรเขียน"
    pairs:
      - { left: "บทนำ", right: "คำถาม สมมติฐาน และที่มาของปัญหา" }
      - { left: "วิธีการ", right: "วัสดุ ตัวแปร และขั้นตอนที่คนอื่นทำซ้ำได้" }
      - { left: "ผลการทดลอง", right: "ตารางและกราฟของข้อมูลที่ได้" }
      - { left: "อภิปรายผล", right: "อธิบายว่าผลหมายความว่าอะไรและน่าเชื่อถือเพียงใด" }
    hints:
      - "ทำไม → ทำอย่างไร → พบอะไร → หมายความว่าอะไร"
      - "ผลการทดลองบอกข้อมูล อภิปรายผลอธิบายข้อมูล"
    solution: "บทนำบอกว่าทำไม วิธีการบอกว่าทำอย่างไร ผลบอกว่าพบอะไร และอภิปรายผลบอกว่าหมายความว่าอะไร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.communicating.p002
    topics: [science.inquiry.communicating]
    difficulty: 1
    type: mcq
    stem: "ข้อความใดเหมาะที่สุดที่จะเขียนในส่วน \"ผลการทดลอง\""
    choices:
      - { id: a, text: "หลัง 14 วัน ต้นผักบุ้งที่ใส่ปุ๋ยหมัก 40 g สูงเฉลี่ย 33 cm", correct: true }
      - { id: b, text: "ต้นผักบุ้งสวยมาก น่ากินที่สุด", feedback: "เป็นความรู้สึกส่วนตัว ไม่ได้บอกข้อมูลที่วัดได้" }
      - { id: c, text: "ปุ๋ยหมักให้ไนโตรเจน พืชจึงโตเร็ว", feedback: "เป็นการอธิบายเหตุผล ควรอยู่ในส่วนอภิปรายผล" }
      - { id: d, text: "เราจะลองใช้ปุ๋ยชนิดอื่นในครั้งหน้า", feedback: "เป็นข้อเสนอแนะ ควรอยู่ในส่วนสรุปผล" }
    hints:
      - "ผลการทดลองบอกสิ่งที่วัดหรือสังเกตได้"
      - "มีตัวเลขและหน่วยหรือไม่"
    solution: "ส่วนผลการทดลองรายงานข้อมูลที่วัดได้ตามจริงพร้อมหน่วย คำอธิบายเหตุผลและข้อเสนอแนะอยู่ในส่วนอื่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.communicating.p003
    topics: [science.inquiry.communicating]
    difficulty: 2
    type: order
    stem: "เรียงส่วนของรายงานการทดลองตามลำดับที่ใช้กันทั่วไป"
    items:
      - "ชื่อเรื่องและบทคัดย่อ"
      - "บทนำ"
      - "วิธีการ"
      - "ผลการทดลอง"
      - "อภิปรายผลและสรุปผล"
      - "เอกสารอ้างอิง"
    hints:
      - "ผู้อ่านต้องรู้ว่าทำไมก่อนรู้ว่าทำอย่างไร"
      - "เอกสารอ้างอิงอยู่ท้ายสุด"
    solution: "ชื่อเรื่องและบทคัดย่อ → บทนำ → วิธีการ → ผลการทดลอง → อภิปรายผลและสรุปผล → เอกสารอ้างอิง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.communicating.p004
    topics: [science.inquiry.communicating]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเขียนปริมาณพร้อมหน่วยได้ถูกต้องตามแบบสากล"
    choices:
      - { id: a, text: "25 °C และ 3.5 kg", correct: true }
      - { id: b, text: "25 c และ 3.5 Kg", feedback: "หน่วยองศาเซลเซียสเขียน °C ส่วนกิโลกรัมใช้ k ตัวเล็ก (kg)" }
      - { id: c, text: "25องศา และ 3.5 กิโล", feedback: "\"กิโล\" ไม่บอกว่าเป็นกิโลกรัมหรือกิโลเมตร และควรเว้นวรรคระหว่างตัวเลขกับหน่วย" }
      - { id: d, text: "25 C° และ 3.5 kgs", feedback: "เครื่องหมายองศาอยู่หน้า C (°C) และสัญลักษณ์หน่วยไม่เติม s เมื่อเป็นพหูพจน์" }
    hints:
      - "สัญลักษณ์หน่วย SI มีรูปแบบตายตัว"
      - "k ตัวเล็กคือกิโล C ตัวใหญ่คือเซลเซียส"
    solution: "ตัวเลข เว้นวรรค แล้วตามด้วยสัญลักษณ์ที่ถูกต้อง: 25 °C และ 3.5 kg"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.communicating.p005
    topics: [science.inquiry.communicating]
    difficulty: 2
    type: text
    stem: "สัญลักษณ์หน่วย SI ของมิลลิลิตรเขียนอย่างไร"
    accepted: ["mL", "ml"]
    misconceptions:
      - { match: "มล", feedback: "มล. เป็นอักษรย่อภาษาไทย โจทย์ถามสัญลักษณ์สากล" }
    hints:
      - "มิลลิ แปลว่า หนึ่งในพัน ใช้อักษร m ตัวเล็ก (M ตัวใหญ่คือเมกะ)"
      - "ลิตรใช้ L หรือ l"
    solution: "มิลลิลิตรเขียน mL (นิยมใช้ L ตัวใหญ่เพื่อไม่ให้สับสนกับเลข 1) หรือ ml"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.communicating.p006
    topics: [science.inquiry.communicating]
    difficulty: 2
    type: mcq
    stem: "นักเรียนทดลองว่าปริมาณปุ๋ยหมัก (g) มีผลต่อความสูงของต้นผักบุ้ง (cm) อย่างไร ควรวาดกราฟอย่างไร"
    choices:
      - { id: a, text: "ปริมาณปุ๋ยหมัก (g) อยู่แกนนอน ความสูงของต้น (cm) อยู่แกนตั้ง", correct: true }
      - { id: b, text: "ความสูงของต้น (cm) อยู่แกนนอน ปริมาณปุ๋ยหมัก (g) อยู่แกนตั้ง", feedback: "ตัวแปรต้น (สิ่งที่เราเปลี่ยน) อยู่แกนนอน ตัวแปรตาม (สิ่งที่วัดผล) อยู่แกนตั้ง" }
      - { id: c, text: "วาดแกนใดก็ได้ ไม่ต้องบอกหน่วย", feedback: "แกนต้องบอกปริมาณและหน่วย ผู้อ่านจึงอ่านค่าได้" }
      - { id: d, text: "ใช้แผนภูมิวงกลม", feedback: "แผนภูมิวงกลมใช้แสดงส่วนของทั้งหมด ไม่เหมาะกับความสัมพันธ์ของตัวแปรสองตัว" }
    hints:
      - "ตัวแปรใดที่นักเรียนเป็นคนกำหนด"
      - "ตัวแปรต้นอยู่แกนนอน"
    solution: "ปริมาณปุ๋ยหมักเป็นตัวแปรต้นอยู่แกนนอน ความสูงเป็นตัวแปรตามอยู่แกนตั้ง และทั้งสองแกนบอกหน่วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.communicating.p007
    topics: [science.inquiry.communicating]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "กราฟในภาพมาจากรายงานของนักเรียน ควรปรับปรุงอะไรบ้าง (เลือกได้มากกว่าหนึ่งข้อ)"
    figure: { src: p-graph.svg, alt: "กราฟจุดห้าจุด แกนนอนเขียนเพียงคำว่า ปุ๋ย มีตัวเลข 0 10 20 30 40 แกนตั้งเขียนเพียงคำว่า ความสูง มีตัวเลข 0 10 20 30 จุดอยู่ที่ (0, 8) (10, 14) (20, 21) (30, 26) (40, 33) ไม่มีชื่อกราฟ" }
    choices:
      - { id: a, text: "ใส่ชื่อกราฟ เช่น ความสูงของต้นผักบุ้งหลัง 14 วันกับปริมาณปุ๋ยหมัก", correct: true }
      - { id: b, text: "ใส่หน่วยที่แกนนอน เช่น ปริมาณปุ๋ยหมัก (g)", correct: true }
      - { id: c, text: "ใส่หน่วยที่แกนตั้ง เช่น ความสูงของต้น (cm)", correct: true }
      - { id: d, text: "สลับแกนนอนกับแกนตั้ง", feedback: "ปริมาณปุ๋ยเป็นตัวแปรต้น อยู่แกนนอนถูกแล้ว" }
      - { id: e, text: "เปลี่ยนเป็นแผนภูมิวงกลม", feedback: "แผนภูมิวงกลมไม่แสดงความสัมพันธ์ระหว่างตัวแปรสองตัว กราฟจุดเหมาะแล้ว" }
    hints:
      - "ผู้อ่านรู้ไหมว่ากราฟนี้เกี่ยวกับอะไร"
      - "ตัวเลข 30 บนแกนตั้งหมายถึง 30 อะไร"
    solution: "กราฟขาดชื่อกราฟและหน่วยของทั้งสองแกน ส่วนการวางตัวแปรต้นที่แกนนอนและชนิดกราฟถูกต้องแล้ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.communicating.p008
    topics: [science.inquiry.communicating]
    difficulty: 3
    type: mcq
    stem: "ในข้อโต้แย้งเรื่องปุ๋ยหมัก ข้อความใดเป็น \"หลักฐาน\""
    choices:
      - { id: a, text: "กระถางที่ใส่ปุ๋ย 40 g สูงเฉลี่ย 33 cm กระถางที่ไม่ใส่สูงเฉลี่ย 8 cm (ทำซ้ำ 5 กระถาง)", correct: true }
      - { id: b, text: "ปุ๋ยหมักทำให้ผักบุ้งสูงขึ้น", feedback: "นี่คือข้อกล่าวอ้าง (คำตอบของคำถาม) ยังไม่ใช่ข้อมูลที่สนับสนุน" }
      - { id: c, text: "ปุ๋ยหมักให้ไนโตรเจนซึ่งพืชใช้สร้างโปรตีน", feedback: "นี่คือเหตุผลที่เชื่อมหลักฐานกับความรู้วิทยาศาสตร์" }
      - { id: d, text: "ทุกคนในกลุ่มเชื่อว่าปุ๋ยหมักดีที่สุด", feedback: "ความเชื่อของสมาชิกไม่ใช่หลักฐาน หลักฐานต้องเป็นข้อมูลที่วัดได้" }
    hints:
      - "หลักฐานคือข้อมูลที่วัดหรือสังเกตได้"
      - "มองหาข้อความที่มีตัวเลขจากการทดลอง"
    solution: "หลักฐานคือข้อมูลจากการทดลอง ข้อ a มีค่าที่วัดได้และจำนวนซ้ำ ข้อ b เป็นข้อกล่าวอ้าง ข้อ c เป็นเหตุผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.communicating.p009
    topics: [science.inquiry.communicating]
    difficulty: 3
    type: numeric
    stem: "นักเรียนวัดความยาวใบผักบุ้งสามครั้งได้ 12.4 cm, 12.8 cm และ 12.6 cm ค่าเฉลี่ยที่ควรรายงานคือกี่เซนติเมตร"
    answer: { value: 12.6, tolerance: 0.01, unit: "cm" }
    misconceptions:
      - { match: 37.8, feedback: "นี่คือผลรวม ต้องหารด้วยจำนวนครั้ง 3" }
      - { match: 12.8, feedback: "นี่คือค่าที่มากที่สุด ค่าเฉลี่ยคือผลรวมหารจำนวนครั้ง" }
    hints:
      - "ค่าเฉลี่ย = ผลรวม ÷ จำนวนครั้ง"
      - "รายงานทศนิยมเท่ากับข้อมูลที่วัด (หนึ่งตำแหน่ง)"
    solution: "$\\dfrac{12.4 + 12.8 + 12.6}{3} = \\dfrac{37.8}{3} = 12.6$ cm"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.communicating.p010
    topics: [science.inquiry.communicating]
    difficulty: 3
    type: numeric
    stem: "จากข้อมูล 12.4 cm, 12.8 cm และ 12.6 cm ถ้ารายงานเป็น ค่าเฉลี่ย ± ความไม่แน่นอน โดยความไม่แน่นอน = พิสัย ÷ 2 ความไม่แน่นอนเป็นกี่เซนติเมตร"
    answer: { value: 0.2, tolerance: 0.01, unit: "cm" }
    misconceptions:
      - { match: 0.4, feedback: "นี่คือพิสัย ต้องหารด้วย 2" }
      - { match: 0.13, feedback: "หารด้วยจำนวนครั้ง 3 แต่สูตรนี้ใช้พิสัยหารด้วย 2" }
    hints:
      - "พิสัย = ค่ามากที่สุด − ค่าน้อยที่สุด"
      - "นำพิสัยหารด้วย 2"
    solution: "พิสัย $= 12.8 - 12.4 = 0.4$ cm ความไม่แน่นอน $= 0.4/2 = 0.2$ cm รายงานเป็น $12.6 \\pm 0.2$ cm ผู้อ่านจึงรู้ว่าผลกระจายเพียงใด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.communicating.p011
    topics: [science.inquiry.communicating]
    difficulty: 3
    type: mcq
    stem: "กลุ่มของมิ้นต้องเขียนผลการทดลองลงจดหมายข่าวของหมู่บ้านในจังหวัดสุพรรณบุรี ประโยคใดเหมาะที่สุด"
    choices:
      - { id: a, text: "ผักบุ้งที่ใส่ปุ๋ยหมักจากเศษอาหารกระถางละ 40 กรัม สูงกว่ากระถางที่ไม่ใส่ราว 4 เท่าใน 2 สัปดาห์ ทำปุ๋ยเองได้จากเศษผักผลไม้ในครัว", correct: true }
      - { id: b, text: "ค่าเฉลี่ยของตัวแปรตามในกลุ่มทดลองแตกต่างจากกลุ่มควบคุมที่ระดับ 25 cm (n = 5)", feedback: "ถูกต้องทางวิชาการ แต่ใช้ศัพท์เฉพาะที่ชาวบ้านส่วนใหญ่ไม่คุ้น ควรใช้ภาษาง่ายและบอกสิ่งที่นำไปใช้ได้" }
      - { id: c, text: "ปุ๋ยหมักเป็นยาวิเศษ ใส่แล้วผักโตทุกชนิดแน่นอน 100%", feedback: "เกินหลักฐาน การทดลองนี้ทดสอบเฉพาะผักบุ้งในกระถาง และไม่มีอะไรแน่นอน 100%" }
      - { id: d, text: "ดูตารางที่ 1–4 ในภาคผนวก", feedback: "ผู้อ่านจดหมายข่าวไม่มีภาคผนวก ต้องสรุปสาระสำคัญให้เข้าใจได้ทันที" }
    hints:
      - "ผู้อ่านคือชาวบ้าน ไม่ใช่นักวิทยาศาสตร์"
      - "ภาษาง่าย ถูกต้อง ไม่เกินหลักฐาน และนำไปใช้ได้"
    solution: "ข้อ a ใช้ภาษาง่าย บอกผลที่สำคัญเป็นตัวเลขที่เข้าใจได้ และบอกสิ่งที่นำไปทำได้ โดยไม่อ้างเกินกว่าที่ทดลอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.communicating.p012
    topics: [science.inquiry.communicating]
    difficulty: 4
    type: mcq
    stem: "รายการอ้างอิงข้อใดมีข้อมูลครบที่สุดสำหรับให้ผู้อ่านตามไปตรวจสอบได้"
    choices:
      - { id: a, text: "สมชาย ใจดี. (2567). การทำปุ๋ยหมักจากเศษอาหาร. วารสารเกษตรชุมชน, 12(3), 45–52.", correct: true }
      - { id: b, text: "อินเทอร์เน็ต", feedback: "อินเทอร์เน็ตไม่ใช่แหล่งอ้างอิง ต้องบอกผู้เขียน ชื่อเรื่อง และลิงก์ที่เจาะจง" }
      - { id: c, text: "หนังสือเรื่องปุ๋ย", feedback: "ขาดผู้แต่ง ปีที่พิมพ์ และสำนักพิมพ์ ผู้อ่านหาไม่เจอ" }
      - { id: d, text: "ครูบอกในห้องเรียน", feedback: "ผู้อ่านคนอื่นตรวจสอบไม่ได้ ควรอ้างแหล่งข้อมูลที่เผยแพร่และค้นได้" }
    hints:
      - "รายการอ้างอิงที่ดีบอกใคร เมื่อไร อะไร ที่ไหน"
      - "ผู้อ่านต้องหาแหล่งนั้นเจอได้"
    solution: "ข้อ a มีผู้แต่ง ปี ชื่อเรื่อง ชื่อวารสาร เล่ม ฉบับ และหน้า ผู้อ่านจึงตามไปอ่านต้นฉบับได้ (รายการนี้เป็นตัวอย่างสมมติ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.communicating.p013
    topics: [science.inquiry.communicating]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "นักเรียนทำรายงานเรื่องสมุนไพรไล่แมลงในหมู่บ้าน โดยสัมภาษณ์ปราชญ์ชาวบ้าน และอยากใช้ภาพแมลงจากเว็บไซต์หนึ่ง ข้อใดเป็นการปฏิบัติที่มีจริยธรรม (เลือกได้มากกว่าหนึ่งข้อ)"
    choices:
      - { id: a, text: "ขออนุญาตปราชญ์ชาวบ้านก่อนนำความรู้ไปเผยแพร่ และระบุชื่อผู้ให้ข้อมูลตามที่เขายินยอม", correct: true }
      - { id: b, text: "ตรวจสัญญาอนุญาตของภาพก่อนใช้ และระบุที่มาใต้ภาพ", correct: true }
      - { id: c, text: "คัดลอกข้อความจากเว็บไซต์มาทั้งย่อหน้าโดยไม่บอกที่มา เพราะเป็นข้อมูลสาธารณะ", feedback: "ข้อมูลที่เข้าถึงได้ไม่ได้แปลว่านำมาเป็นของตนได้ ต้องเขียนด้วยคำของตนเองและอ้างอิงที่มา" }
      - { id: d, text: "ไม่ต้องอ้างอิงภาพ เพราะหาได้จากเครื่องมือค้นหา", feedback: "ภาพส่วนใหญ่มีลิขสิทธิ์ เครื่องมือค้นหาเป็นเพียงทางที่พบภาพ ไม่ใช่เจ้าของ" }
    hints:
      - "ความรู้และผลงานมีเจ้าของ"
      - "ผู้ให้ข้อมูลควรได้รับการเคารพและให้เครดิต"
    solution: "ต้องขออนุญาตและให้เครดิตผู้ให้ความรู้ ตรวจสัญญาอนุญาตและระบุที่มาของภาพ การคัดลอกโดยไม่อ้างอิงเป็นการลอกเลียนผลงาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.communicating.p014
    topics: [science.inquiry.communicating]
    difficulty: 4
    type: mcq
    stem: "กลุ่มหนึ่งทดลองครั้งเดียวกับต้นไม้เพียงสองต้น พบว่าต้นที่ฟังเพลงสูงกว่าต้นที่ไม่ได้ฟัง 1 cm ข้อสรุปใดเขียนได้เหมาะสมกับหลักฐานที่สุด"
    choices:
      - { id: a, text: "ในการทดลองเบื้องต้นนี้ ต้นที่ฟังเพลงสูงกว่าเล็กน้อย แต่มีต้นไม้น้อยและทำครั้งเดียว ยังสรุปไม่ได้ ควรทดลองซ้ำกับต้นไม้จำนวนมากขึ้น", correct: true }
      - { id: b, text: "พิสูจน์แล้วว่าเพลงทำให้ต้นไม้โตเร็ว", feedback: "ต้นไม้สองต้นอาจต่างกันเองตามธรรมชาติ 1 cm หลักฐานน้อยเกินกว่าจะพิสูจน์" }
      - { id: c, text: "เพลงไม่มีผลต่อต้นไม้แน่นอน", feedback: "หลักฐานน้อยเกินกว่าจะสรุปได้ทั้งว่ามีผลหรือไม่มีผล" }
      - { id: d, text: "ไม่ต้องเขียนข้อสรุป เพราะผลไม่ชัดเจน", feedback: "ผลที่ไม่ชัดเจนก็ต้องรายงานอย่างซื่อสัตย์ พร้อมบอกข้อจำกัดและข้อเสนอแนะ" }
    hints:
      - "ขนาดตัวอย่างและจำนวนครั้งที่ทำซ้ำมีผลต่อความเชื่อมั่น"
      - "ใช้คำให้พอดีกับหลักฐาน"
    solution: "ตัวอย่างน้อยและทำครั้งเดียว ความต่าง 1 cm อาจเกิดจากความแปรปรวนตามธรรมชาติ ควรรายงานผลตามจริง บอกข้อจำกัด และเสนอให้ทดลองซ้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.communicating.p015
    topics: [science.inquiry.communicating]
    difficulty: 4
    type: order
    stem: "เรียงประโยคต่อไปนี้ให้เป็นย่อหน้าข้อโต้แย้งทางวิทยาศาสตร์ที่ดี"
    items:
      - "ปุ๋ยหมักจากเศษอาหารทำให้ต้นผักบุ้งสูงขึ้น"
      - "หลัง 14 วัน กระถางที่ใส่ปุ๋ย 40 g สูงเฉลี่ย 33 cm ส่วนกระถางที่ไม่ใส่สูงเฉลี่ย 8 cm (ทำซ้ำ 5 กระถาง)"
      - "เพราะปุ๋ยหมักให้ธาตุไนโตรเจนที่พืชใช้สร้างโปรตีนและคลอโรฟิลล์"
      - "อย่างไรก็ตาม การทดลองนี้ทำในฤดูเดียวและใช้ดินชนิดเดียว ควรทดลองซ้ำในสภาพอื่น"
    hints:
      - "ข้อกล่าวอ้าง → หลักฐาน → เหตุผล"
      - "ข้อจำกัดอยู่ท้ายสุด"
    solution: "ข้อกล่าวอ้าง → หลักฐานที่เป็นตัวเลข → เหตุผลทางวิทยาศาสตร์ → ข้อจำกัดและข้อเสนอแนะ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.communicating.p016
    topics: [science.inquiry.communicating]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "ย่อหน้าอภิปรายผลของนักเรียนคนหนึ่งเขียนว่า \"ผักบุ้งที่ใส่ปุ๋ยสูงขึ้น 33 แสดงว่าปุ๋ยหมักทำให้ผักทุกชนิดโตเร็วกว่าปุ๋ยเคมี 100%\" ข้อใดเป็นปัญหาของย่อหน้านี้ (เลือกได้มากกว่าหนึ่งข้อ)"
    choices:
      - { id: a, text: "ตัวเลข 33 ไม่มีหน่วย", correct: true }
      - { id: b, text: "สรุปเกินหลักฐาน ทดลองเฉพาะผักบุ้งแต่สรุปถึงผักทุกชนิด", correct: true }
      - { id: c, text: "เปรียบเทียบกับปุ๋ยเคมีทั้งที่ไม่ได้ทดลองกับปุ๋ยเคมี", correct: true }
      - { id: d, text: "ไม่ได้เทียบกับกลุ่มควบคุมที่ไม่ใส่ปุ๋ย และไม่บอกความน่าเชื่อถือของผล", correct: true }
      - { id: e, text: "ย่อหน้าสั้นเกินไป อภิปรายผลต้องยาวอย่างน้อยหนึ่งหน้า", feedback: "ความยาวไม่ใช่ปัญหาหลัก อภิปรายผลสั้นก็ได้ถ้าครบถ้วนและถูกต้อง" }
    hints:
      - "ตรวจหน่วย ขอบเขตของข้อสรุป และสิ่งที่นำมาเปรียบเทียบ"
      - "ข้อสรุปควรพอดีกับสิ่งที่ทดลองจริง"
    solution: "ย่อหน้านี้ขาดหน่วย สรุปเกินตัวอย่างที่ทดลอง เปรียบเทียบกับสิ่งที่ไม่ได้ทดลอง ไม่อ้างถึงกลุ่มควบคุม และไม่บอกความน่าเชื่อถือ ความยาวไม่ใช่ปัญหา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.communicating.p017
    topics: [science.inquiry.communicating]
    difficulty: 5
    type: mcq
    stem: "บทคัดย่อข้อใดดีที่สุดสำหรับโครงงานเรื่องปุ๋ยหมักกับผักบุ้ง"
    choices:
      - { id: a, text: "โครงงานนี้ศึกษาผลของปริมาณปุ๋ยหมักจากเศษอาหาร (0, 10, 20, 30, 40 g ต่อกระถาง) ต่อความสูงของผักบุ้ง ปลูกปริมาณละ 5 กระถาง วัดความสูงหลัง 14 วัน พบว่าความสูงเฉลี่ยเพิ่มจาก 8 cm เป็น 33 cm ตามปริมาณปุ๋ย สรุปว่าปุ๋ยหมักช่วยให้ผักบุ้งสูงขึ้นในช่วงปริมาณที่ทดลอง", correct: true }
      - { id: b, text: "ผักบุ้งเป็นผักที่คนไทยนิยมรับประทาน มีประโยชน์มาก ปุ๋ยหมักก็มีประโยชน์ คณะผู้จัดทำจึงสนใจทำโครงงานนี้", feedback: "เป็นเพียงที่มา ไม่บอกวิธีการ ผล และข้อสรุป" }
      - { id: c, text: "ผลการทดลองดีมาก ผักบุ้งโตเร็วมาก ทุกคนควรใช้ปุ๋ยหมัก", feedback: "ไม่มีตัวเลข ไม่บอกวิธีการ และสรุปเกินหลักฐาน" }
      - { id: d, text: "ตารางที่ 1 แสดงความสูงของผักบุ้งทั้ง 25 กระถางในแต่ละวันตั้งแต่วันที่ 1 ถึงวันที่ 14", feedback: "บทคัดย่อต้องสรุป ไม่ใช่ยกข้อมูลดิบทั้งหมด และต้องบอกวัตถุประสงค์กับข้อสรุป" }
    hints:
      - "บทคัดย่อที่ดีตอบ: ทำอะไร อย่างไร พบอะไร สรุปว่าอะไร"
      - "มีตัวเลขสำคัญพร้อมหน่วย"
    solution: "ข้อ a บอกวัตถุประสงค์ วิธีการ (ปริมาณ จำนวนซ้ำ ระยะเวลา) ผลเป็นตัวเลขพร้อมหน่วย และข้อสรุปที่จำกัดขอบเขตไว้ตามที่ทดลอง"
    license: CC-BY-SA-4.0
    ai_assisted: true
