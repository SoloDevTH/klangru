<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" font-family="sans-serif"><title>เซลล์การกัดกร่อนของเหล็กสองจุดบนผิวเดียวกันที่ต่อกันด้วยน้ำชื้น</title><rect x="0" y="0" width="700" height="340" fill="#ffffff"/><rect x="60" y="150" width="180" height="90" fill="#c9d3dd" stroke="#1f3a5f" stroke-width="2"/><rect x="460" y="150" width="180" height="90" fill="#c9d3dd" stroke="#1f3a5f" stroke-width="2"/><text x="150" y="205" text-anchor="middle" font-size="16">เหล็ก (แอโนด)</text><text x="550" y="205" text-anchor="middle" font-size="16">เหล็ก (แคโทด)</text><rect x="60" y="250" width="580" height="60" fill="#eef6ff" stroke="#6b8fb5" stroke-dasharray="5,4"/><text x="350" y="285" text-anchor="middle" font-size="15">น้ำที่มีไอออน (ความชื้นหรือน้ำเกลือ) เป็นตัวนำไอออน</text><line x1="150" y1="150" x2="150" y2="110" stroke="#1f3a5f" stroke-width="3"/><line x1="550" y1="150" x2="550" y2="110" stroke="#1f3a5f" stroke-width="3"/><line x1="150" y1="110" x2="550" y2="110" stroke="#1f3a5f" stroke-width="3"/><polygon points="340,110 352,104 352,116" fill="#1f3a5f"/><text x="350" y="98" text-anchor="middle" font-size="15" fill="#b5452b">e⁻ ไหลผ่านโลหะ</text><text x="150" y="228" text-anchor="middle" font-size="13" fill="#111">Fe → Fe²⁺ + 2e⁻</text><text x="550" y="228" text-anchor="middle" font-size="13" fill="#111">O₂ + 2H₂O + 4e⁻ → 4OH⁻</text><text x="350" y="40" text-anchor="middle" font-size="15">ที่แอโนดโลหะละลายออก ที่แคโทดปฏิกิริยารับอิเล็กตรอน</text></svg>
