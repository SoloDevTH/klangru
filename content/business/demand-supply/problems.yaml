problems:
- id: business.econ.demand-supply.p001
  topics:
  - business.econ.demand-supply
  difficulty: 1
  type: mcq
  stem: ถ้าราคามะม่วงในตลาดสูงขึ้นมาก โดยสิ่งอื่นไม่เปลี่ยน ผู้ซื้อส่วนใหญ่จะทำอย่างไร
  choices:
  - id: a
    text: ซื้อมะม่วงน้อยลง
    correct: true
  - id: b
    text: ซื้อมะม่วงมากขึ้น
    feedback: ราคาสูงขึ้น ผู้ซื้อมักซื้อน้อยลง นี่คือกฎของอุปสงค์
  - id: c
    text: ซื้อเท่าเดิมเสมอ
    feedback: ผู้ซื้อส่วนใหญ่ตอบสนองต่อราคา บางคนหันไปซื้อผลไม้อื่นแทน
  - id: d
    text: เลิกกินผลไม้ทุกชนิด
    feedback: ผู้ซื้อมักเปลี่ยนไปซื้อผลไม้อื่นที่ถูกกว่า ไม่ได้เลิกกินทั้งหมด
  hints:
  - คิดถึงตัวเองเมื่อของที่ชอบแพงขึ้น
  - 'กฎของอุปสงค์: ราคากับปริมาณซื้อเปลี่ยนสวนทางกัน'
  solution: ตามกฎของอุปสงค์ เมื่อราคาสูงขึ้น ปริมาณที่ผู้ซื้อต้องการซื้อจะลดลง (สิ่งอื่นคงที่) เพราะเงินซื้อได้น้อยลงและมีผลไม้อื่นทดแทนได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.demand-supply.p002
  topics:
  - business.econ.demand-supply
  difficulty: 1
  type: mcq
  stem: ตลาดนัดแห่งหนึ่งเคยมีร้านขายลูกชิ้นปิ้งร้านเดียว ต่อมามีร้านแบบเดียวกันมาเปิดเพิ่มอีก 4 ร้าน ราคาลูกชิ้นในตลาดนัดน่าจะเป็นอย่างไร
  choices:
  - id: a
    text: มีแนวโน้มลดลง เพราะร้านต้องแข่งกันดึงลูกค้า
    correct: true
  - id: b
    text: สูงขึ้น เพราะมีร้านมากขึ้น
    feedback: ร้านมากขึ้นแปลว่าผู้ขายแข่งกัน ราคามักลดลง
  - id: c
    text: เท่าเดิมแน่นอน
    feedback: เมื่อมีคู่แข่ง ร้านที่ราคาสูงกว่ามักขายได้น้อยลง จึงต้องปรับราคาหรือคุณภาพ
  - id: d
    text: ทุกร้านต้องปิดกิจการ
    feedback: การแข่งขันไม่ได้ทำให้ทุกร้านปิด ร้านที่ดีกว่ายังขายได้
  hints:
  - ลูกค้ามีทางเลือกมากขึ้น
  - ถ้าร้านหนึ่งขายแพงกว่าร้านอื่น ลูกค้าจะทำอย่างไร
  solution: เมื่อผู้ขายมากขึ้น ลูกค้ามีทางเลือก ร้านต้องแข่งขันด้วยราคาที่ต่ำลงหรือคุณภาพที่ดีขึ้น การแข่งขันทางการค้าจึงทำให้ราคามีแนวโน้มลดลง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.demand-supply.p003
  topics:
  - business.econ.demand-supply
  difficulty: 2
  type: match
  stem: จับคู่เหตุการณ์กับการเปลี่ยนแปลงในตลาดทุเรียน (สิ่งอื่นคงที่)
  pairs:
  - left: ประเทศคู่ค้าสั่งซื้อทุเรียนเพิ่มมาก
    right: อุปสงค์เพิ่ม (เส้นอุปสงค์เลื่อนไปขวา)
  - left: ข่าวว่ากินทุเรียนมากเกินไปไม่ดีต่อสุขภาพ
    right: อุปสงค์ลด (เส้นอุปสงค์เลื่อนไปซ้าย)
  - left: ต้นฤดู ผลผลิตยังออกน้อย
    right: อุปทานลด (เส้นอุปทานเลื่อนไปซ้าย)
  - left: ชาวสวนใช้วิธีดูแลใหม่ ได้ผลผลิตต่อไร่มากขึ้น
    right: อุปทานเพิ่ม (เส้นอุปทานเลื่อนไปขวา)
  hints:
  - ถามก่อนว่าเหตุการณ์กระทบผู้ซื้อหรือผู้ขาย
  - ผู้ซื้ออยากซื้อมากขึ้นหรือผู้ขายผลิตได้มากขึ้น = เลื่อนไปขวา
  solution: คำสั่งซื้อจากต่างประเทศ → อุปสงค์เพิ่ม · ข่าวสุขภาพ → อุปสงค์ลด · ผลผลิตต้นฤดูน้อย → อุปทานลด · เทคโนโลยีการผลิตดีขึ้น → อุปทานเพิ่ม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.demand-supply.p004
  topics:
  - business.econ.demand-supply
  difficulty: 2
  type: mcq
  stem: ราคาไข่ไก่สูงขึ้นจาก 4 บาทเป็น 5 บาทต่อฟอง แล้วผู้ซื้อซื้อน้อยลง ข้อใดอธิบายถูกต้อง
  choices:
  - id: a
    text: ปริมาณซื้อเปลี่ยนไปตามเส้นอุปสงค์เดิม (เคลื่อนที่บนเส้น)
    correct: true
  - id: b
    text: เส้นอุปสงค์เลื่อนไปทางซ้าย
    feedback: การเปลี่ยนราคาของสินค้านั้นเองทำให้เคลื่อนที่บนเส้นเดิม เส้นเลื่อนเมื่อปัจจัยอื่นเปลี่ยน
  - id: c
    text: เส้นอุปทานเลื่อนไปทางขวา
    feedback: โจทย์พูดถึงผู้ซื้อตอบสนองต่อราคา ไม่ใช่ผู้ขายผลิตได้มากขึ้น
  - id: d
    text: อุปสงค์ลดลงเพราะคนไม่ชอบไข่แล้ว
    feedback: รสนิยมไม่ได้เปลี่ยน ผู้ซื้อลดการซื้อเพราะราคาสูงขึ้น
  hints:
  - ปัจจัยที่เปลี่ยนคือราคาของไข่เอง หรือสิ่งอื่น
  - ราคาของสินค้าเองอยู่บนแกนของกราฟ
  solution: เมื่อราคาของสินค้าเองเปลี่ยน ปริมาณซื้อเปลี่ยนไปตามเส้นอุปสงค์เดิม เรียกว่า **การเปลี่ยนแปลงปริมาณเสนอซื้อ** ส่วนเส้นอุปสงค์จะ **เลื่อน** เมื่อปัจจัยอื่นเปลี่ยน เช่น รายได้ รสนิยม ราคาสินค้าทดแทน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.demand-supply.p005
  topics:
  - business.econ.demand-supply
  difficulty: 2
  type: numeric
  stem: ตลาดทุเรียนหมอนทองในจังหวัดหนึ่ง (สมมติ) มีอุปสงค์ $Q_d = 600 - 4P$ และอุปทาน $Q_s = -300 + 5P$ เมื่อ $P$ คือราคา (บาทต่อกิโลกรัม) และ $Q$ คือปริมาณ (ตันต่อสัปดาห์) ถ้าราคาเท่ากับ $80$ บาทต่อกิโลกรัม ผู้ซื้อต้องการซื้อกี่ตันต่อสัปดาห์ (ตอบเป็นตัน)
  answer:
    value: 280
    unit: ตัน
  misconceptions:
  - match: 100
    feedback: แทนค่าในสมการอุปทาน โจทย์ถามปริมาณที่ผู้ซื้อต้องการ
  - match: 920
    feedback: เครื่องหมายผิด ต้องลบ $4P$
  hints:
  - แทนค่า $P = 80$ ในสมการอุปสงค์
  - $Q_d = 600 - 4(80)$
  solution: $Q_d = 600 - 4(80) = 600 - 320 = 280$ ตันต่อสัปดาห์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.demand-supply.p006
  topics:
  - business.econ.demand-supply
  difficulty: 3
  type: numeric
  stem: ตลาดทุเรียนหมอนทองในจังหวัดหนึ่ง (สมมติ) มีอุปสงค์ $Q_d = 600 - 4P$ และอุปทาน $Q_s = -300 + 5P$ เมื่อ $P$ คือราคา (บาทต่อกิโลกรัม) และ $Q$ คือปริมาณ (ตันต่อสัปดาห์) **ราคาดุลยภาพ** เป็นกี่บาทต่อกิโลกรัม (ตอบเป็นบาท)
  answer:
    value: 100.0
    unit: บาท
  misconceptions:
  - match: 33.333333
    feedback: ย้ายข้างเครื่องหมายผิด ($600 - 300 = 9P$) ต้องเป็น $600 + 300 = 9P$
  - match: 150
    feedback: นั่นคือราคาที่ทำให้ $Q_d = 0$ ไม่ใช่ดุลยภาพ
  hints:
  - ดุลยภาพคือจุดที่ $Q_d = Q_s$
  - ตั้ง $600 - 4P = -300 + 5P$ แล้วย้ายข้าง
  solution: $600 - 4P = -300 + 5P \Rightarrow 900 = 9P \Rightarrow P = 100$ บาทต่อกิโลกรัม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.demand-supply.p007
  topics:
  - business.econ.demand-supply
  difficulty: 3
  type: numeric
  stem: ตลาดทุเรียนหมอนทองในจังหวัดหนึ่ง (สมมติ) มีอุปสงค์ $Q_d = 600 - 4P$ และอุปทาน $Q_s = -300 + 5P$ เมื่อ $P$ คือราคา (บาทต่อกิโลกรัม) และ $Q$ คือปริมาณ (ตันต่อสัปดาห์) **ปริมาณดุลยภาพ** เป็นกี่ตันต่อสัปดาห์ (ตอบเป็นตัน)
  answer:
    value: 200.0
    unit: ตัน
  misconceptions:
  - match: 100
    feedback: ตอบราคาดุลยภาพ โจทย์ถามปริมาณ
  - match: 600
    feedback: แทน $P = 0$ ในสมการอุปสงค์
  hints:
  - หาราคาดุลยภาพก่อน
  - แทนราคาดุลยภาพในสมการใดก็ได้ ต้องได้ค่าเท่ากันทั้งสองสมการ
  solution: $P = 100$ แทนใน $Q_d = 600 - 4(100) = 200$ และ $Q_s = -300 + 5(100) = 200$ ตรงกัน ปริมาณดุลยภาพ $200$ ตันต่อสัปดาห์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.demand-supply.p008
  topics:
  - business.econ.demand-supply
  difficulty: 3
  type: numeric
  stem: ตลาดทุเรียนหมอนทองในจังหวัดหนึ่ง (สมมติ) มีอุปสงค์ $Q_d = 600 - 4P$ และอุปทาน $Q_s = -300 + 5P$ เมื่อ $P$ คือราคา (บาทต่อกิโลกรัม) และ $Q$ คือปริมาณ (ตันต่อสัปดาห์) ถ้าพ่อค้าคนกลางตั้งราคาไว้ที่ $120$ บาทต่อกิโลกรัม จะเกิด **อุปทานส่วนเกิน** กี่ตันต่อสัปดาห์ (ตอบเป็นตัน)
  answer:
    value: 180
    unit: ตัน
  misconceptions:
  - match: 300
    feedback: ตอบปริมาณเสนอขาย ต้องลบปริมาณเสนอซื้อออก
  - match: 120
    feedback: ตอบปริมาณเสนอซื้อ
  hints:
  - หา $Q_d$ และ $Q_s$ ที่ราคา $120$ บาท
  - อุปทานส่วนเกิน $= Q_s - Q_d$
  solution: 'ที่ $P = 120$: $Q_d = 600 - 480 = 120$ ตัน $Q_s = -300 + 600 = 300$ ตัน อุปทานส่วนเกิน $= 300 - 120 = 180$ ตัน ทุเรียนล้นตลาด ผู้ขายจะลดราคาลงจนเข้าสู่ $100$ บาท'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.demand-supply.p009
  topics:
  - business.econ.demand-supply
  difficulty: 3
  type: mcq
  stem: ภาพแสดงเส้นอุปสงค์ D และอุปทาน S ของตลาดทุเรียน (เส้นทึบ) จุด E คือดุลยภาพเดิม เส้นประคือเส้นที่อาจเลื่อนไป ถ้า **ต้นฤดูผลผลิตออกน้อย** แต่ความต้องการซื้อเท่าเดิม ดุลยภาพใหม่คือจุดใด
  choices:
  - id: a
    text: จุด A
    correct: true
  - id: b
    text: จุด B
    feedback: จุด B เกิดจากอุปสงค์เพิ่ม แต่โจทย์บอกความต้องการซื้อเท่าเดิม
  - id: c
    text: จุด C
    feedback: จุด C ต้องมีทั้งอุปสงค์เพิ่มและอุปทานลด
  - id: d
    text: จุด E
    feedback: ผลผลิตน้อยลงทำให้อุปทานลด ดุลยภาพต้องเปลี่ยน
  figure:
    src: p-shift-points.svg
    alt: กราฟแกนนอนคือปริมาณ (ตันต่อสัปดาห์) แกนตั้งคือราคา (บาทต่อกิโลกรัม) เส้นทึบ D ลาดลง และเส้นทึบ S ลาดขึ้น ตัดกันที่จุด E เส้นประ S′ อยู่ทางซ้ายของ S และเส้นประ D′ อยู่ทางขวาของ D จุด A คือจุดที่ D ตัด S′ จุด B คือจุดที่ D′ ตัด S จุด C คือจุดที่ D′ ตัด S′
  hints:
  - ผลผลิตออกน้อยกระทบผู้ขาย เส้นใดเลื่อน ไปทางไหน
  - หาจุดที่เส้นอุปสงค์เดิมตัดกับเส้นอุปทานที่เลื่อนแล้ว
  solution: ผลผลิตน้อยลง → อุปทานลด เส้น S เลื่อนไปทางซ้าย (เส้นประ S′) ส่วนอุปสงค์เท่าเดิม ดุลยภาพใหม่คือจุดที่ D ตัด S′ คือจุด A ราคาสูงขึ้นและปริมาณซื้อขายลดลง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.demand-supply.p010
  topics:
  - business.econ.demand-supply
  difficulty: 4
  type: numeric
  stem: ต่อจากตลาดทุเรียน ($Q_d = 600 - 4P$) ต้นฤดูผลผลิตออกน้อย อุปทานกลายเป็น $Q_s = -480 + 5P$ ราคาดุลยภาพใหม่เป็นกี่บาทต่อกิโลกรัม (ตอบเป็นบาท)
  answer:
    value: 120.0
    unit: บาท
  misconceptions:
  - match: 100.0
    feedback: นั่นคือราคาดุลยภาพเดิม ต้องใช้อุปทานใหม่
  - match: 13.333333
    feedback: ย้ายข้างเครื่องหมายผิด
  hints:
  - ตั้ง $600 - 4P = -480 + 5P$
  - $1{,}080 = 9P$
  solution: $600 - 4P = -480 + 5P \Rightarrow 9P = 1{,}080 \Rightarrow P = 120$ บาท ปริมาณ $= 600 - 480 = 120$ ตัน ราคาสูงขึ้นจาก $100$ บาท และปริมาณลดจาก $200$ ตัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.demand-supply.p011
  topics:
  - business.econ.demand-supply
  difficulty: 4
  type: numeric
  stem: ร้านชานมราคาแก้วละ $50$ บาท ขายได้วันละ $1{,}000$ แก้ว เมื่อขึ้นราคาเป็น $55$ บาท ขายได้ $750$ แก้ว **ค่าความยืดหยุ่นของอุปสงค์ต่อราคา** (ตอบเป็นค่าสัมบูรณ์ คิดร้อยละจากค่าเดิม) เป็นเท่าใด
  answer:
    value: 2.5
    tolerance: 0.03
  misconceptions:
  - match: 0.4
    feedback: หารกลับด้าน ต้องเป็นร้อยละของปริมาณหารด้วยร้อยละของราคา
  - match: 50
    feedback: ใช้ผลต่างจำนวนแก้วและบาทโดยตรง ต้องแปลงเป็นร้อยละก่อน
  hints:
  - ร้อยละการเปลี่ยนแปลงของปริมาณ $= \dfrac{750 - 1{,}000}{1{,}000} \times 100$
  - ความยืดหยุ่น $=$ ร้อยละการเปลี่ยนแปลงของปริมาณ $\div$ ร้อยละการเปลี่ยนแปลงของราคา
  solution: ปริมาณลด $25\%$ ราคาเพิ่ม $10\%$ ความยืดหยุ่น $= \dfrac{25}{10} = 2.5$ มากกว่า $1$ จึงเป็นอุปสงค์ที่ **ยืดหยุ่นมาก** ขึ้นราคาแล้วรายรับลดจาก $50{,}000$ เป็น $41{,}250$ บาท
