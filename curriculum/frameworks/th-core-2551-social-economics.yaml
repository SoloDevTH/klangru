strands:
  - id: ส3
    title: เศรษฐศาสตร์
    standards:
      - id: ส 3.1
        text: "เข้าใจและสามารถบริหารจัดการทรัพยากรในการผลิตและการบริโภค การใช้ทรัพยากรที่มีอยู่อย่างจำกัดได้อย่างมีประสิทธิภาพและคุ้มค่า รวมทั้งเข้าใจหลักการของเศรษฐกิจพอเพียง เพื่อการดำรงชีวิตอย่างมีดุลยภาพ"
        indicators:
          - { id: "ส 3.1 ป.1/1", level: ป.1, text: "ระบุสินค้าและบริการที่ใช้ประโยชน์ในชีวิตประจำวัน" }
          - { id: "ส 3.1 ป.1/2", level: ป.1, text: "ยกตัวอย่างการใช้จ่ายเงินในชีวิตประจำวันที่ไม่เกินตัวและเห็นประโยชน์ของการออม" }
          - { id: "ส 3.1 ป.1/3", level: ป.1, text: "ยกตัวอย่างการใช้ทรัพยากรในชีวิตประจำวันอย่างประหยัด" }
          - { id: "ส 3.1 ป.2/1", level: ป.2, text: "ระบุทรัพยากรที่นำมาผลิตสินค้าและบริการที่ใช้ในชีวิตประจำวัน" }
          - { id: "ส 3.1 ป.2/2", level: ป.2, text: "บอกที่มาของรายได้และรายจ่ายของตนเองและครอบครัว" }
          - { id: "ส 3.1 ป.2/3", level: ป.2, text: "บันทึกรายรับรายจ่ายของตนเอง", note: "ข้อความตามเล่มหลักสูตร เอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง (สพฐ.) พิมพ์ว่า “บันทึกรายรับ-รายจ่ายของตนเอง”" }
          - { id: "ส 3.1 ป.2/4", level: ป.2, text: "สรุปผลดีของการใช้จ่ายที่เหมาะสมกับรายได้และการออม" }
          - { id: "ส 3.1 ป.3/1", level: ป.3, text: "จำแนกความต้องการและความจำเป็นในการใช้สินค้าและบริการในการดำรงชีวิต" }
          - { id: "ส 3.1 ป.3/2", level: ป.3, text: "วิเคราะห์การใช้จ่ายของตนเอง" }
          - { id: "ส 3.1 ป.3/3", level: ป.3, text: "อธิบายได้ว่าทรัพยากรที่มีอยู่จำกัดมีผลต่อการผลิตและบริโภคสินค้าและบริการ" }
          - { id: "ส 3.1 ป.4/1", level: ป.4, text: "ระบุปัจจัยที่มีผลต่อการเลือกซื้อสินค้าและบริการ" }
          - { id: "ส 3.1 ป.4/2", level: ป.4, text: "บอกสิทธิพื้นฐานและรักษาผลประโยชน์ของตนเองในฐานะผู้บริโภค" }
          - { id: "ส 3.1 ป.4/3", level: ป.4, text: "อธิบายหลักการของเศรษฐกิจพอเพียงและนำไปใช้ในชีวิตประจำวันของตนเอง" }
          - { id: "ส 3.1 ป.5/1", level: ป.5, text: "อธิบายปัจจัยการผลิตสินค้าและบริการ" }
          - { id: "ส 3.1 ป.5/2", level: ป.5, text: "ประยุกต์ใช้แนวคิดของปรัชญาของเศรษฐกิจพอเพียงในการทำกิจกรรมต่างๆ ในครอบครัว โรงเรียนและชุมชน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตาราง เว้นวรรคตรงรอยต่อ “ต่างๆ|ในครอบครัว” และ “ในครอบครัว|โรงเรียน” ตามเอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง (สพฐ.) ซึ่งพิมพ์สองจุดนี้กลางบรรทัด" }
          - { id: "ส 3.1 ป.5/3", level: ป.5, text: "อธิบายหลักการสำคัญและประโยชน์ของสหกรณ์" }
          - { id: "ส 3.1 ป.6/1", level: ป.6, text: "อธิบายบทบาทของผู้ผลิตที่มีความรับผิดชอบ" }
          - { id: "ส 3.1 ป.6/2", level: ป.6, text: "อธิบายบทบาทของผู้บริโภคที่รู้เท่าทัน" }
          - { id: "ส 3.1 ป.6/3", level: ป.6, text: "บอกวิธีและประโยชน์ของการใช้ทรัพยากรอย่างยั่งยืน" }
          - { id: "ส 3.1 ม.1/1", level: ม.1, text: "อธิบายความหมายและความสำคัญของเศรษฐศาสตร์" }
          - { id: "ส 3.1 ม.1/2", level: ม.1, text: "วิเคราะห์ค่านิยมและพฤติกรรมการบริโภคของคนในสังคมซึ่งส่งผลต่อเศรษฐกิจของชุมชนและประเทศ" }
          - { id: "ส 3.1 ม.1/3", level: ม.1, text: "อธิบายความเป็นมา หลักการและความสำคัญของปรัชญาของเศรษฐกิจพอเพียงต่อสังคมไทย", note: "เว้นวรรคตรงรอยต่อ “ความเป็นมา|หลักการ” ตามเอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง (สพฐ.)" }
          - { id: "ส 3.1 ม.2/1", level: ม.2, text: "วิเคราะห์ปัจจัยที่มีผลต่อการลงทุนและการออม" }
          - { id: "ส 3.1 ม.2/2", level: ม.2, text: "อธิบายปัจจัยการผลิตสินค้าและบริการ และปัจจัยที่มีอิทธิพลต่อการผลิตสินค้าและบริการ" }
          - { id: "ส 3.1 ม.2/3", level: ม.2, text: "เสนอแนวทางการพัฒนาการผลิตในท้องถิ่นตามปรัชญาของเศรษฐกิจพอเพียง" }
          - { id: "ส 3.1 ม.2/4", level: ม.2, text: "อภิปรายแนวทางการคุ้มครองสิทธิของตนเองในฐานะผู้บริโภค" }
          - { id: "ส 3.1 ม.3/1", level: ม.3, text: "อธิบายกลไกราคาในระบบเศรษฐกิจ" }
          - { id: "ส 3.1 ม.3/2", level: ม.3, text: "มีส่วนร่วมในการแก้ไขปัญหาและพัฒนาท้องถิ่นตามปรัชญาของเศรษฐกิจพอเพียง" }
          - { id: "ส 3.1 ม.3/3", level: ม.3, text: "วิเคราะห์ความสัมพันธ์ระหว่างแนวคิดเศรษฐกิจพอเพียงกับระบบสหกรณ์" }
          - { id: "ส 3.1 ม.4-6/1", level: ม.4-6, text: "อภิปรายการกำหนดราคาและค่าจ้างในระบบเศรษฐกิจ" }
          - { id: "ส 3.1 ม.4-6/2", level: ม.4-6, text: "ตระหนักถึงความสำคัญของปรัชญาของเศรษฐกิจพอเพียงที่มีต่อเศรษฐกิจสังคมของประเทศ" }
          - { id: "ส 3.1 ม.4-6/3", level: ม.4-6, text: "ตระหนักถึงความสำคัญของระบบสหกรณ์ในการพัฒนาเศรษฐกิจในระดับชุมชนและประเทศ" }
          - { id: "ส 3.1 ม.4-6/4", level: ม.4-6, text: "วิเคราะห์ปัญหาทางเศรษฐกิจในชุมชนและเสนอแนวทางแก้ไข" }
      - id: ส 3.2
        text: "เข้าใจระบบและสถาบันทางเศรษฐกิจต่างๆ ความสัมพันธ์ทางเศรษฐกิจและความจำเป็นของการร่วมมือกันทางเศรษฐกิจในสังคมโลก"
        indicators:
          - { id: "ส 3.2 ป.1/1", level: ป.1, text: "อธิบายเหตุผลความจำเป็นที่คนต้องทำงานอย่างสุจริต" }
          - { id: "ส 3.2 ป.2/1", level: ป.2, text: "อธิบายการแลกเปลี่ยนสินค้าและบริการโดยวิธีต่างๆ" }
          - { id: "ส 3.2 ป.2/2", level: ป.2, text: "บอกความสัมพันธ์ระหว่างผู้ซื้อกับผู้ขาย", note: "ข้อความตามเล่มหลักสูตร เอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง (สพฐ.) พิมพ์ว่า “ผู้ซื้อและผู้ขาย”" }
          - { id: "ส 3.2 ป.3/1", level: ป.3, text: "บอกสินค้าและบริการที่รัฐจัดหาและให้บริการแก่ประชาชน" }
          - { id: "ส 3.2 ป.3/2", level: ป.3, text: "บอกความสำคัญของภาษีและบทบาทของประชาชนในการเสียภาษี" }
          - { id: "ส 3.2 ป.3/3", level: ป.3, text: "อธิบายเหตุผลการแข่งขันทางการค้า ที่มีผลทำให้ราคาสินค้าลดลง" }
          - { id: "ส 3.2 ป.4/1", level: ป.4, text: "อธิบายความสัมพันธ์ทางเศรษฐกิจของคนในชุมชน" }
          - { id: "ส 3.2 ป.4/2", level: ป.4, text: "อธิบายหน้าที่เบื้องต้นของเงิน" }
          - { id: "ส 3.2 ป.5/1", level: ป.5, text: "อธิบายบทบาทหน้าที่เบื้องต้นของธนาคาร" }
          - { id: "ส 3.2 ป.5/2", level: ป.5, text: "จำแนกผลดีผลเสียของการกู้ยืม", note: "ข้อความตามเล่มหลักสูตร เอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง (สพฐ.) พิมพ์ว่า “จำแนกผลดีและผลเสียของการกู้ยืม”" }
          - { id: "ส 3.2 ป.6/1", level: ป.6, text: "อธิบายความสัมพันธ์ระหว่างผู้ผลิต ผู้บริโภค ธนาคารและรัฐบาล", note: "เว้นวรรคตรงรอยต่อ “ผู้บริโภค|ธนาคาร” ตามเอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง (สพฐ.)" }
          - { id: "ส 3.2 ป.6/2", level: ป.6, text: "ยกตัวอย่างการรวมกลุ่มทางเศรษฐกิจภายในท้องถิ่น" }
          - { id: "ส 3.2 ม.1/1", level: ม.1, text: "วิเคราะห์บทบาทหน้าที่และความแตกต่างของสถาบันการเงินแต่ละประเภทและธนาคารกลาง" }
          - { id: "ส 3.2 ม.1/2", level: ม.1, text: "ยกตัวอย่างที่สะท้อนให้เห็นการพึ่งพาอาศัยกัน และการแข่งขันกันทางเศรษฐกิจในประเทศ", note: "เว้นวรรคตรงรอยต่อ “พึ่งพาอาศัยกัน|และการแข่งขัน” ตามเอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง (สพฐ.) (ต่างจาก ส 3.2 ม.2/2 ที่เอกสารเดียวกันไม่เว้นวรรค)" }
          - { id: "ส 3.2 ม.1/3", level: ม.1, text: "ระบุปัจจัยที่มีอิทธิพลต่อการกำหนดอุปสงค์และอุปทาน" }
          - { id: "ส 3.2 ม.1/4", level: ม.1, text: "อภิปรายผลของการมีกฎหมายเกี่ยวกับทรัพย์สินทางปัญญา" }
          - { id: "ส 3.2 ม.2/1", level: ม.2, text: "อภิปรายระบบเศรษฐกิจแบบต่างๆ" }
          - { id: "ส 3.2 ม.2/2", level: ม.2, text: "ยกตัวอย่างที่สะท้อนให้เห็นการพึ่งพาอาศัยกันและการแข่งขันกันทางเศรษฐกิจในภูมิภาคเอเชีย" }
          - { id: "ส 3.2 ม.2/3", level: ม.2, text: "วิเคราะห์การกระจายของทรัพยากรในโลกที่ส่งผลต่อความสัมพันธ์ทางเศรษฐกิจระหว่างประเทศ" }
          - { id: "ส 3.2 ม.2/4", level: ม.2, text: "วิเคราะห์การแข่งขันทางการค้าในประเทศและต่างประเทศที่ส่งผลต่อคุณภาพสินค้า ปริมาณการผลิตและราคาสินค้า", note: "เว้นวรรคตรงรอยต่อ “คุณภาพสินค้า|ปริมาณการผลิต” ตามเอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง (สพฐ.)" }
          - { id: "ส 3.2 ม.3/1", level: ม.3, text: "อธิบายบทบาทหน้าที่ของรัฐบาลในระบบเศรษฐกิจ" }
          - { id: "ส 3.2 ม.3/2", level: ม.3, text: "แสดงความคิดเห็นต่อนโยบายและกิจกรรมทางเศรษฐกิจของรัฐที่มีต่อบุคคล กลุ่มคนและประเทศชาติ" }
          - { id: "ส 3.2 ม.3/3", level: ม.3, text: "อภิปรายบทบาทความสำคัญของการรวมกลุ่มทางเศรษฐกิจระหว่างประเทศ" }
          - { id: "ส 3.2 ม.3/4", level: ม.3, text: "อภิปรายผลกระทบที่เกิดจากภาวะเงินเฟ้อ เงินฝืด", note: "เว้นวรรคตรงรอยต่อ “เงินเฟ้อ|เงินฝืด” ตามเอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง (สพฐ.)" }
          - { id: "ส 3.2 ม.3/5", level: ม.3, text: "วิเคราะห์ผลเสียจากการว่างงานและแนวทางแก้ปัญหา" }
          - { id: "ส 3.2 ม.3/6", level: ม.3, text: "วิเคราะห์สาเหตุและวิธีการกีดกันทางการค้าในการค้าระหว่างประเทศ" }
          - { id: "ส 3.2 ม.4-6/1", level: ม.4-6, text: "อธิบายบทบาทของรัฐบาลเกี่ยวกับนโยบายการเงิน การคลังในการพัฒนาเศรษฐกิจของประเทศ" }
          - { id: "ส 3.2 ม.4-6/2", level: ม.4-6, text: "วิเคราะห์ผลกระทบของการเปิดเสรีทางเศรษฐกิจในยุคโลกาภิวัตน์ที่มีผลต่อสังคมไทย" }
          - { id: "ส 3.2 ม.4-6/3", level: ม.4-6, text: "วิเคราะห์ผลดีผลเสียของความร่วมมือทางเศรษฐกิจระหว่างประเทศในรูปแบบต่างๆ" }
