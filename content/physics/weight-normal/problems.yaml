    answer: { value: 8, tolerance: 0.05, unit: N }
    hints:
      - "หามวลของก้อนหินจากค่าที่อ่านบนโลกก่อน มวลไม่เปลี่ยนเมื่อย้ายที่"
      - "น้ำหนักบนดวงจันทร์ $= m \\times 1.6$"
    misconceptions:
      - { match: 49, feedback: "เครื่องชั่งสปริงวัดน้ำหนัก ซึ่งขึ้นกับ $g$ บนดวงจันทร์สปริงจึงยืดน้อยลง" }
      - { match: 8.17, feedback: "ดูเหมือนใช้ทางลัด \"หนึ่งในหก\" ($\\tfrac{49}{6}$) โจทย์ให้ค่า $g$ ของดวงจันทร์มาแล้ว ควรคำนวณจากค่านั้น" }
    solution: "มวล $m = \\dfrac{49}{9.8} = 5\\ \\mathrm{kg}$ บนดวงจันทร์ $W = 5 \\times 1.6 = 8\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wn.p019
    topics: [physics.dynamics.weight-normal]
    difficulty: 4
    type: numeric
    stem: "คนมวล $70\\ \\mathrm{kg}$ ยืนในลิฟต์ของตึกสูงในกรุงเทพฯ ลิฟต์กำลังขึ้นด้วยความเร็ว $3\\ \\mathrm{m/s}$ แล้วชะลอจนหยุดในเวลา $2\\ \\mathrm{s}$ ด้วยความเร่งคงตัว ระหว่างที่ชะลอ พื้นลิฟต์ดันคนด้วยแรงเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 581, tolerance: 1, unit: N }
    hints:
      - "หาความเร่งจาก $a = \\dfrac{v - u}{t}$ ให้ทิศขึ้นเป็นบวก ลิฟต์ขึ้นแต่ช้าลง ความเร่งจึงเป็นลบ"
      - "$N = m(g + a)$ โดยแทน $a$ ที่เป็นลบ"
    misconceptions:
      - { match: 791, feedback: "ดูเหมือนใช้ความเร่งเป็นบวก ลิฟต์กำลังขึ้นแต่ช้าลง ความเร่งจึงชี้ลง ตาชั่งต้องอ่านน้อยกว่าน้ำหนัก" }
      - { match: 686, feedback: "นี่คือน้ำหนัก ($mg$) ซึ่งเป็นค่าที่อ่านได้เมื่อลิฟต์ไม่มีความเร่ง ระหว่างชะลอยังมีความเร่งอยู่" }
    solution: "$a = \\dfrac{0 - 3}{2} = -1.5\\ \\mathrm{m/s^2}$ (ชี้ลง) $N = m(g + a) = 70(9.8 - 1.5) = 70 \\times 8.3 = 581\\ \\mathrm{N}$ น้อยกว่าน้ำหนัก $686\\ \\mathrm{N}$ จึงรู้สึกตัวเบาลงตอนลิฟต์ใกล้ถึงชั้นบน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wn.p020
    topics: [physics.dynamics.weight-normal]
    difficulty: 4
    type: numeric
    stem: "กล่อง A มวล $3\\ \\mathrm{kg}$ วางซ้อนอยู่บนกล่อง B มวล $5\\ \\mathrm{kg}$ ซึ่งวางบนพื้น มีมือกดกล่อง A ลงตรง ๆ ด้วยแรง $20\\ \\mathrm{N}$ ทุกอย่างนิ่ง พื้นดันกล่อง B ด้วยแรงเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 98.4, tolerance: 0.1, unit: N }
    hints:
      - "มองกล่องทั้งสองรวมกันเป็นระบบเดียว แรงภายนอกในแนวดิ่งมีอะไรบ้าง"
      - "แรงลงคือน้ำหนักรวมและแรงจากมือ แรงขึ้นคือแรงจากพื้น"
    misconceptions:
      - { match: 78.4, feedback: "นี่คือน้ำหนักของกล่องทั้งสองรวมกัน ยังไม่ได้รวมแรงที่มือกดลง $20\\ \\mathrm{N}$" }
      - { match: 49, feedback: "นี่คือน้ำหนักของกล่อง B อย่างเดียว พื้นต้องรับทั้งกล่อง B กล่อง A ที่วางทับ และแรงจากมือ" }
    solution: "ระบบกล่องสองใบนิ่ง: $N_{\\text{พื้น}} = (3 + 5)(9.8) + 20 = 78.4 + 20 = 98.4\\ \\mathrm{N}$ (ส่วนกล่อง B ดันกล่อง A ขึ้นด้วยแรง $3 \\times 9.8 + 20 = 49.4\\ \\mathrm{N}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wn.p021
    topics: [physics.dynamics.weight-normal]
    difficulty: 5
    type: numeric
    stem: "ขณะลิฟต์จอดนิ่ง ตาชั่งในลิฟต์อ่านแรงได้ $540\\ \\mathrm{N}$ เมื่อลิฟต์เริ่มเคลื่อนที่ ตาชั่งอ่านได้ $600\\ \\mathrm{N}$ ลิฟต์มีความเร่งขนาดเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย m/s² ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 1.09, tolerance: 0.02, unit: m/s² }
    hints:
      - "ค่าที่อ่านได้ตอนจอดนิ่งคือน้ำหนัก ใช้หามวลของคนก่อน"
      - "ใช้ $N - mg = ma$ โดย $N = 600\\ \\mathrm{N}$"
    misconceptions:
      - { match: 6.12, feedback: "ดูเหมือนนำผลต่างแรง $60\\ \\mathrm{N}$ หารด้วย $9.8$ ซึ่งได้หน่วย kg ไม่ใช่ความเร่ง ต้องหารผลต่างแรงด้วยมวลของคน" }
      - { match: 10.89, feedback: "นี่คือ $\\tfrac{N}{m}$ ซึ่งเท่ากับ $g + a$ ยังต้องลบ $g$ ออก" }
    solution: "$m = \\dfrac{540}{9.8} \\approx 55.1\\ \\mathrm{kg}$ แล้ว $a = \\dfrac{600 - 540}{55.1} \\approx 1.09\\ \\mathrm{m/s^2}$ ทิศขึ้น (ลิฟต์เริ่มขึ้น หรือกำลังจะหยุดขณะลง)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wn.p022
    topics: [physics.dynamics.weight-normal]
    difficulty: 3
