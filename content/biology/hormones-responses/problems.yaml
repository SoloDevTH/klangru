problems:
  - id: biology.plants.hormones-responses.p001
    topics: [biology.plants.hormones-responses]
    difficulty: 1
    type: match
    stem: "จับคู่ฮอร์โมนพืชกับบทบาทหลัก"
    pairs:
      - { left: "ออกซิน", right: "กระตุ้นการยืดตัวของเซลล์และการเกิดราก" }
      - { left: "ไซโทไคนิน", right: "กระตุ้นการแบ่งเซลล์และชะลอใบเหลือง" }
      - { left: "จิบเบอเรลลิน", right: "กระตุ้นการยืดของลำต้นและการงอกของเมล็ด" }
      - { left: "เอทิลีน", right: "เร่งการสุกของผล" }
      - { left: "กรดแอบไซซิก", right: "ทำให้ปากใบปิดเมื่อขาดน้ำ" }
    hints:
      - "ฮอร์โมนที่เป็นแก๊สเกี่ยวกับการสุกของผล"
      - "ฮอร์โมนที่ช่วยพืชรับมือกับความแล้งทำให้พืชเสียน้ำน้อยลง"
    solution: "ออกซินยืดเซลล์และเกิดราก ไซโทไคนินแบ่งเซลล์และชะลอการเสื่อม จิบเบอเรลลินยืดลำต้นและกระตุ้นการงอก เอทิลีนเร่งการสุก และกรดแอบไซซิกปิดปากใบเมื่อขาดน้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.hormones-responses.p002
    topics: [biology.plants.hormones-responses]
    difficulty: 1
    type: mcq
    stem: "แม่ค้าใส่กล้วยดิบกับมะม่วงสุกไว้ในถุงพลาสติกที่ปิดสนิท กล้วยสุกเร็วขึ้น ฮอร์โมนใดจากมะม่วงสุกทำให้เกิดผลนี้"
    choices:
      - { id: a, text: "เอทิลีน", correct: true }
      - { id: b, text: "ออกซิน", feedback: "ออกซินเกี่ยวกับการยืดตัวของเซลล์และการเกิดราก ไม่ได้เร่งการสุก" }
      - { id: c, text: "ไซโทไคนิน", feedback: "ไซโทไคนินชะลอการเสื่อม ไม่ได้เร่งการสุก" }
      - { id: d, text: "กรดแอบไซซิก", feedback: "กรดแอบไซซิกเกี่ยวกับการปิดปากใบและการพักตัว" }
    hints:
      - "ฮอร์โมนนี้เป็นแก๊ส จึงแพร่ไปทั่วถุง"
      - "ผลไม้ที่สุกแล้วปล่อยฮอร์โมนนี้ออกมามาก"
    solution: "ผลไม้สุกปล่อยแก๊สเอทิลีน ถุงที่ปิดสนิทกักแก๊สไว้ กล้วยที่อยู่ในถุงจึงสุกเร็วขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.hormones-responses.p003
    topics: [biology.plants.hormones-responses]
    difficulty: 1
    type: text
    stem: "ต้นไม้ในกระถางที่วางริมหน้าต่างเจริญเติบโตโค้งเข้าหาแสง การตอบสนองนี้เรียกว่าอะไร"
    accepted: ["การเบนตามแสง", "เบนตามแสง", "โฟโทโทรพิซึม", "โฟโททรอพิซึม", "phototropism"]
    hints:
      - "เป็นการเจริญเติบโตที่มีทิศทางตามสิ่งเร้า เรียกว่าการเบน"
      - "สิ่งเร้าในข้อนี้คือแสง"
    misconceptions:
      - { match: "การเบนตามแรงโน้มถ่วง", feedback: "การเบนตามแรงโน้มถ่วงตอบสนองต่อแรงโน้มถ่วง ข้อนี้สิ่งเร้าคือแสง" }
    solution: "การเบนตามแสง (โฟโทโทรพิซึม) ออกซินเคลื่อนไปด้านที่มืดกว่า เซลล์ด้านนั้นยืดมากกว่า ยอดจึงโค้งเข้าหาแสง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.hormones-responses.p004
    topics: [biology.plants.hormones-responses]
    difficulty: 2
    type: mcq
    stem: "เมื่อแตะใบไมยราบ ใบจะหุบลงภายในไม่กี่วินาที และกางออกได้อีกในเวลาต่อมา ข้อใดอธิบายได้ถูกต้อง"
    choices:
      - { id: a, text: "เซลล์ที่โคนก้านใบเสียน้ำอย่างรวดเร็ว แรงดันเต่งลดลง", correct: true }
      - { id: b, text: "เป็นการเบนตามการสัมผัส เพราะเซลล์ด้านหนึ่งเจริญเติบโตมากกว่า", feedback: "การเจริญเติบโตเกิดช้าและกลับคืนไม่ได้ แต่ไมยราบหุบภายในไม่กี่วินาทีแล้วกางได้อีก" }
      - { id: c, text: "ออกซินถูกทำลายเมื่อถูกสัมผัส", feedback: "การหุบใบเร็วเกินกว่าจะเกิดจากการเปลี่ยนแปลงของออกซินและการยืดตัวของเซลล์" }
    hints:
      - "การหุบใบเกิดเร็วมากและกลับคืนได้"
      - "อะไรทำให้เซลล์พืชเต่งหรือเหี่ยว"
    solution: "การหุบใบของไมยราบเกิดจากเซลล์ที่โคนก้านใบเสียน้ำอย่างรวดเร็วจนแรงดันเต่งลดลง จึงเร็วและกลับคืนได้ เป็นการเคลื่อนไหวแบบนาสติก ไม่ใช่การเบน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.hormones-responses.p005
    topics: [biology.plants.hormones-responses]
    difficulty: 2
    type: mcq
    stem: "เมื่อแสงส่องยอดต้นกล้าจากด้านเดียว ออกซินจะเป็นอย่างไร"
    choices:
      - { id: a, text: "เคลื่อนไปสะสมด้านที่มืดกว่า เซลล์ด้านนั้นจึงยืดมากกว่า", correct: true }
      - { id: b, text: "เคลื่อนไปด้านที่สว่าง เซลล์ด้านสว่างจึงยืดมากกว่า", feedback: "ถ้าด้านสว่างยืดมากกว่า ยอดจะโค้งหนีแสง ซึ่งไม่ตรงกับที่สังเกตได้" }
      - { id: c, text: "กระจายเท่ากันทั้งสองด้าน", feedback: "ถ้าออกซินเท่ากันทั้งสองด้าน เซลล์จะยืดเท่ากันและยอดจะไม่โค้ง" }
    hints:
      - "ยอดโค้งเข้าหาแสง แปลว่าด้านใดยืดยาวกว่า"
      - "ออกซินกระตุ้นการยืดตัวของเซลล์ในลำต้น"
    solution: "ออกซินเคลื่อนไปด้านที่มืดกว่า เซลล์ด้านมืดยืดมากกว่าด้านสว่าง ยอดจึงโค้งเข้าหาแสง หลักฐานมาจากการสอดแผ่นไมกาของบอยเซน-เจนเซน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.hormones-responses.p006
    topics: [biology.plants.hormones-responses]
    difficulty: 2
    type: mcq
    stem: "ชาวสวนจุ่มโคนกิ่งชบาลงในผงเร่งรากก่อนนำไปปักชำ ผงเร่งรากมีสารที่ออกฤทธิ์คล้ายฮอร์โมนใด"
    choices:
      - { id: a, text: "ออกซิน เช่น IBA หรือ NAA", correct: true }
      - { id: b, text: "เอทิลีน", feedback: "เอทิลีนเร่งการสุกและการร่วง ไม่ได้ใช้เร่งรากกิ่งปักชำ" }
      - { id: c, text: "กรดแอบไซซิก", feedback: "กรดแอบไซซิกทำให้ตาพักตัว ไม่ได้กระตุ้นการเกิดราก" }
      - { id: d, text: "ไซโทไคนิน", feedback: "ไซโทไคนินที่มากกว่าออกซินกระตุ้นการเกิดยอด ไม่ใช่ราก" }
    hints:
      - "ฮอร์โมนนี้ถูกค้นพบจากต้นกล้าที่โค้งเข้าหาแสง"
      - "ในการเพาะเลี้ยงเนื้อเยื่อ ฮอร์โมนนี้ที่มากกว่าทำให้เกิดราก"
    solution: "ผงเร่งรากมีสารสังเคราะห์ที่ออกฤทธิ์คล้ายออกซิน เช่น IBA และ NAA ซึ่งกระตุ้นการเกิดรากที่โคนกิ่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.hormones-responses.p007
    topics: [biology.plants.hormones-responses]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "จากภาพ ชุดการทดลองใดที่โคลีออปไทล์จะโค้งเข้าหาแสง (เลือกได้มากกว่า 1 ข้อ)"
    figure: { src: coleoptile-setups.svg, alt: "โคลีออปไทล์ 4 ชุด แสงส่องจากด้านซ้ายทุกชุด ชุด ก ครอบปลายยอดด้วยหมวกใสที่แสงผ่านได้ ชุด ข สอดแผ่นไมกาใต้ปลายยอดทางด้านขวาซึ่งเป็นด้านมืด ชุด ค ตัดปลายยอดแล้ววางกลับบนแผ่นวุ้นบาง ๆ ที่วางบนต้นเดิม ชุด ง ตัดปลายยอดทิ้ง ภาพแสดงก่อนเริ่มการทดลอง ทุกต้นยังตั้งตรง" }
    choices:
      - { id: a, text: "ชุด ก", correct: true }
      - { id: b, text: "ชุด ข", feedback: "แผ่นไมกาด้านมืดกั้นไม่ให้ออกซินเคลื่อนลงมาทางด้านมืด ด้านมืดจึงไม่ยืดมากกว่า ต้นกล้าไม่โค้ง" }
      - { id: c, text: "ชุด ค", correct: true }
      - { id: d, text: "ชุด ง", feedback: "ไม่มีปลายยอดที่รับแสงและสร้างออกซิน ต้นกล้าจึงไม่โค้ง" }
    hints:
      - "ปลายยอดต้องรับแสงได้ และออกซินต้องเคลื่อนลงมาทางด้านมืดได้"
      - "สารผ่านวุ้นได้ แต่ผ่านแผ่นไมกาไม่ได้"
    solution: "ชุด ก หมวกใสให้แสงผ่าน ปลายยอดรับแสงได้ จึงโค้ง ชุด ค ออกซินจากปลายยอดซึมผ่านวุ้นลงมาได้ จึงโค้ง ชุด ข ไมกากั้นด้านมืด ชุด ง ไม่มีปลายยอด สองชุดนี้จึงไม่โค้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.hormones-responses.p008
    topics: [biology.plants.hormones-responses]
    difficulty: 3
    type: numeric
    stem: "จากกราฟ วุ้นที่มีออกซินไม่ทราบความเข้มข้นทำให้โคลีออปไทล์โค้ง 7.5 องศา ถ้ารู้ว่าความเข้มข้นอยู่ในช่วงต่ำ (ไม่เกิน 0.20 mg/L) วุ้นนี้มีออกซินเข้มข้นกี่ mg/L ตอบทศนิยม 3 ตำแหน่ง"
    figure: { src: went-curve.svg, alt: "กราฟเส้นมุมโค้งของโคลีออปไทล์ (องศา) กับความเข้มข้นของออกซินในวุ้น (mg/L) ที่ 0, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40 mg/L มุมโค้ง 0, 5, 10, 15, 20, 17, 12, 7, 3 องศา มุมเพิ่มเป็นเส้นตรงจนสูงสุดที่ 0.20 mg/L แล้วลดลง เป็นข้อมูลสมมติ" }
    answer: { value: 0.075, unit: mg/L, tolerance: 0.003 }
    hints:
      - "ในช่วง 0 ถึง 0.20 mg/L มุมโค้งเพิ่มขึ้นเป็นเส้นตรง"
      - "มุมเพิ่มขึ้น 5 องศาทุก 0.05 mg/L ใช้สัดส่วนหาความเข้มข้นที่ให้ 7.5 องศา"
    misconceptions:
      - { match: 0.345, feedback: "นี่คือค่าในช่วงความเข้มข้นสูงที่มุมลดลง โจทย์บอกว่าความเข้มข้นอยู่ในช่วงต่ำ" }
      - { match: 0.75, feedback: "หน่วยผิดไป 10 เท่า ที่ 0.10 mg/L มุมโค้งเพียง 10 องศา" }
    solution: "ช่วงต่ำมุมโค้ง 10 องศาต่อ 0.10 mg/L ความเข้มข้นที่ให้ 7.5 องศาจึงเท่ากับ $0.10 \\times \\frac{7.5}{10} = 0.075$ mg/L"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.hormones-responses.p009
    topics: [biology.plants.hormones-responses]
    difficulty: 3
    type: mcq
    stem: "ช่วงฤดูแล้ง ต้นข้าวโพดที่ขาดน้ำมีกรดแอบไซซิกในใบเพิ่มขึ้น ผลที่เกิดขึ้นกับพืชคือข้อใด"
    choices:
      - { id: a, text: "ปากใบปิด พืชเสียน้ำน้อยลง แต่รับคาร์บอนไดออกไซด์ได้น้อยลงด้วย", correct: true }
      - { id: b, text: "ปากใบเปิดกว้างเพื่อดูดน้ำจากอากาศ", feedback: "ปากใบเปิดกว้างทำให้เสียน้ำทางการคายน้ำมากขึ้น พืชไม่ได้ดูดน้ำจากอากาศทางปากใบ" }
      - { id: c, text: "ลำต้นยืดยาวขึ้นอย่างรวดเร็ว", feedback: "การยืดของลำต้นเกี่ยวกับออกซินและจิบเบอเรลลิน กรดแอบไซซิกมักชะลอการเจริญเติบโต" }
    hints:
      - "กรดแอบไซซิกช่วยพืชรับมือกับความแล้ง"
      - "ปากใบเป็นทางที่น้ำระเหยออกและคาร์บอนไดออกไซด์เข้า"
    solution: "กรดแอบไซซิกทำให้เซลล์คุมเสียน้ำ ปากใบปิด การคายน้ำจึงลดลง แต่คาร์บอนไดออกไซด์เข้าใบได้น้อยลง การสังเคราะห์ด้วยแสงจึงลดลงด้วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.hormones-responses.p010
    topics: [biology.plants.hormones-responses]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการทดลองของเวนต์ที่แสดงว่าปลายยอดสร้างสารที่ทำให้ต้นกล้าโค้ง"
    items:
      - "ตัดปลายยอดโคลีออปไทล์มาวางบนแผ่นวุ้น"
      - "ทิ้งไว้ให้สารจากปลายยอดซึมลงในวุ้น แล้วนำปลายยอดออก"
      - "ตัดวุ้นเป็นชิ้นเล็ก วางเยื้องไปด้านหนึ่งบนต้นที่ตัดยอดแล้ว"
      - "ตั้งไว้ในที่มืด แล้ววัดมุมที่ต้นกล้าโค้ง"
      - "สรุปว่าสารในวุ้นทำให้เซลล์ด้านที่ได้รับสารยืดมากกว่า"
    hints:
      - "ต้องได้วุ้นที่มีสารก่อน จึงนำไปวางบนต้นกล้าได้"
      - "ทำในที่มืดเพื่อไม่ให้แสงเป็นสาเหตุของการโค้ง"
    solution: "ปลายยอดวางบนวุ้น → สารซึมลงวุ้น → วางวุ้นเยื้องบนต้นที่ตัดยอด → ตั้งในที่มืดแล้ววัดมุม → สรุปว่ามีสารกระตุ้นการยืดของเซลล์ ซึ่งต่อมาเรียกว่าออกซิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.hormones-responses.p011
    topics: [biology.plants.hormones-responses]
    difficulty: 3
    type: mcq
    stem: "วางต้นกล้าถั่วเขียวนอนราบในที่มืด ออกซินสะสมทางด้านล่างของทั้งลำต้นและราก ผลที่เกิดขึ้นคือข้อใด"
    choices:
      - { id: a, text: "ลำต้นโค้งขึ้น รากโค้งลง เพราะออกซินกระตุ้นการยืดของเซลล์ลำต้นแต่ยับยั้งการยืดของเซลล์ราก", correct: true }
