problems:
  - id: engineering.design.design-process.p001
    topics: [engineering.design.design-process]
    difficulty: 1
    type: mcq
    stem: "ทีมออกแบบเครื่องกรองอากาศสำหรับห้องเรียน ข้อใดเป็น **ข้อจำกัด** (constraint) ไม่ใช่เกณฑ์"
    choices:
      - { id: a, text: "ราคาต้องไม่เกินงบประมาณ 8,000 บาท", correct: true }
      - { id: b, text: "ยิ่งเงียบยิ่งดี", feedback: "นี่คือเกณฑ์ ใช้ให้คะแนนเปรียบเทียบว่าแบบใดเงียบกว่า ไม่ใช่เงื่อนไขผ่านหรือไม่ผ่าน" }
      - { id: c, text: "ยิ่งกรองฝุ่นได้เร็วยิ่งดี", feedback: "นี่คือเกณฑ์ เพราะเป็นสิ่งที่อยากได้มากที่สุด ไม่มีเส้นตัดผ่าน" }
      - { id: d, text: "รูปทรงสวยงามน่าใช้", feedback: "ความสวยงามเป็นเกณฑ์ที่ให้คะแนนได้ ไม่ใช่เงื่อนไขบังคับ" }
    hints:
      - "ข้อจำกัดคือเงื่อนไขที่ทางเลือกต้องผ่านแน่นอน"
      - "ข้อใดเป็นเส้นตัด เกินแล้วตัดทิ้งทันที"
    solution: "งบประมาณที่ห้ามเกินเป็นข้อจำกัด ทางเลือกที่แพงเกินถูกตัดทิ้ง ส่วนความเงียบ ความเร็ว และความสวยงามเป็นเกณฑ์ที่ให้คะแนนเปรียบเทียบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.design.design-process.p002
    topics: [engineering.design.design-process]
    difficulty: 1
    type: match
    stem: "จับคู่คำศัพท์การออกแบบกับความหมาย"
    pairs:
      - { left: "เกณฑ์ (criteria)", right: "คุณลักษณะที่ใช้ให้คะแนนเปรียบเทียบทางเลือก" }
      - { left: "ข้อจำกัด (constraint)", right: "เงื่อนไขที่ต้องผ่านแน่นอน" }
      - { left: "ต้นแบบ (prototype)", right: "ชิ้นงานทดลองที่สร้างเพื่อทดสอบแนวคิด" }
      - { left: "การแลกได้แลกเสีย (trade-off)", right: "ยอมเสียคุณลักษณะหนึ่งเพื่อได้อีกคุณลักษณะหนึ่ง" }
    hints:
      - "คำใดเป็นสิ่งที่ห้ามละเมิด คำใดเป็นสิ่งที่ใช้เปรียบเทียบ"
      - "ต้นแบบเป็นของจริงที่จับต้องได้"
    solution: "เกณฑ์ใช้เปรียบเทียบ ข้อจำกัดต้องผ่าน ต้นแบบใช้ทดสอบ การแลกได้แลกเสียคือการยอมเสียสิ่งหนึ่งเพื่อได้อีกสิ่งหนึ่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.design.design-process.p003
    topics: [engineering.design.design-process]
    difficulty: 2
    type: mcq
    stem: "โรงเรียนในเชียงใหม่ต้องการลดฝุ่น PM2.5 ในห้องเรียน ข้อใดเป็นข้อกำหนดทางวิศวกรรมที่ดีที่สุด"
    choices:
      - { id: a, text: "ลด PM2.5 ในห้อง $150\\ \\mathrm{m^3}$ ให้ไม่เกิน $37.5\\ \\mu\\mathrm{g/m^3}$ ภายใน 30 นาที โดยเสียงไม่เกิน $50\\ \\mathrm{dB}$", correct: true }
      - { id: b, text: "ทำให้อากาศในห้องสะอาดที่สุดเท่าที่ทำได้", feedback: "วัดไม่ได้ว่าเมื่อใดผ่าน ข้อกำหนดต้องมีตัวเลข หน่วย และเงื่อนไขการวัด" }
      - { id: c, text: "ซื้อเครื่องกรองอากาศยี่ห้อที่ดีที่สุด", feedback: "นี่คือการเลือกคำตอบล่วงหน้า ไม่ใช่การบอกว่าต้องการผลลัพธ์อะไร" }
      - { id: d, text: "นักเรียนรู้สึกหายใจสบายขึ้น", feedback: "เป็นความต้องการของผู้ใช้ที่ดี แต่ต้องแปลงเป็นค่าที่วัดได้ก่อน" }
    hints:
      - "ข้อกำหนดที่ดีต้องตรวจได้ว่าผ่านหรือไม่ผ่าน"
      - "มองหาตัวเลข หน่วย และเงื่อนไข"
    solution: "ข้อ a ระบุปริมาณ ค่าเป้าหมาย หน่วย เวลา และข้อจำกัดด้านเสียง จึงทดสอบได้ว่าแบบใดผ่าน ข้ออื่นเป็นความต้องการกว้าง ๆ หรือเป็นการเลือกคำตอบล่วงหน้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.design.design-process.p004
    topics: [engineering.design.design-process]
    difficulty: 2
    type: order
    stem: "เรียงขั้นของการออกแบบเชิงวิศวกรรมรอบแรก"
    items:
      - "นิยามปัญหาและความต้องการของผู้ใช้"
      - "เขียนเกณฑ์ ข้อจำกัด และข้อกำหนดที่วัดได้"
      - "สร้างทางเลือกหลายแบบ"
      - "วิเคราะห์และเลือกแบบด้วยเมทริกซ์ตัดสินใจ"
      - "สร้างและทดสอบต้นแบบ"
      - "ประเมินผลกับข้อกำหนดแล้วปรับปรุงแบบ"
    hints:
      - "ต้องรู้ว่าต้องการอะไรก่อนจะสร้างทางเลือก"
      - "ต้องมีทางเลือกก่อนจะเลือก และต้องเลือกก่อนจะสร้างต้นแบบ"
    solution: "นิยามปัญหา → เขียนเกณฑ์และข้อกำหนด → สร้างทางเลือก → เลือกแบบ → สร้างและทดสอบต้นแบบ → ประเมินและปรับปรุง (แล้ววนซ้ำ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.design.design-process.p005
    topics: [engineering.design.design-process]
    difficulty: 2
    type: numeric
    stem: "ผังมอร์โฟโลยีของรถเข็นผักในตลาดมีฟังก์ชันขับเคลื่อน 3 วิธี โครงรถ 4 แบบ และระบบเบรก 2 แบบ ถ้าเลือกหนึ่งวิธีจากทุกฟังก์ชัน จะได้ทางเลือกผสมกี่แบบ"
    answer: { value: 24, tolerance: 0, unit: แบบ }
    misconceptions:
      - { match: 9, feedback: "บวกจำนวนวิธี $3 + 4 + 2$ แต่การเลือกจากทุกฟังก์ชันพร้อมกันต้องคูณกัน" }
    hints:
      - "แต่ละวิธีขับเคลื่อนจับคู่กับโครงรถได้ทุกแบบ"
      - "ใช้หลักการคูณ"
    solution: "$3 \\times 4 \\times 2 = 24$ แบบ จากนั้นคัดแบบที่เข้ากันไม่ได้ออก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.design.design-process.p006
    topics: [engineering.design.design-process]
    difficulty: 3
    type: numeric
    stem: "เมทริกซ์ตัดสินใจมีเกณฑ์สี่ข้อ น้ำหนัก 0.35, 0.25, 0.25 และ 0.15 แบบหนึ่งได้คะแนน 4, 3, 5 และ 2 ตามลำดับ คะแนนรวมถ่วงน้ำหนักเป็นเท่าใด"
    answer: { value: 3.7, tolerance: 0.01 }
    misconceptions:
      - { match: 14, feedback: "บวกคะแนนดิบโดยไม่ถ่วงน้ำหนัก" }
      - { match: 3.5, feedback: "นี่คือค่าเฉลี่ยคะแนนดิบ เกณฑ์ที่สำคัญกว่าต้องมีผลมากกว่า" }
    hints:
      - "คูณคะแนนกับน้ำหนักของเกณฑ์เดียวกัน"
      - "บวกผลคูณทั้งสี่"
    solution: "$0.35(4) + 0.25(3) + 0.25(5) + 0.15(2) = 1.40 + 0.75 + 1.25 + 0.30 = 3.70$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.design.design-process.p007
    topics: [engineering.design.design-process]
    difficulty: 3
    type: mcq
    stem: "เลือกปั๊มน้ำสามแบบ เกณฑ์คือ สมรรถนะ (น้ำหนัก 0.5) ต้นทุน (0.3) การบำรุงรักษา (0.2) คะแนน 1–10 (10 ดีที่สุด) X: 9, 4, 5 · Y: 6, 8, 8 · Z: 8, 7, 5 ควรเลือกแบบใด"
    choices:
      - { id: a, text: "Z", correct: true }
      - { id: b, text: "Y", feedback: "Y มีผลรวมคะแนนดิบสูงสุด (22) แต่เมื่อถ่วงน้ำหนักได้ 7.0 น้อยกว่า Z" }
      - { id: c, text: "X", feedback: "X มีสมรรถนะสูงสุด แต่ต้นทุนและการบำรุงรักษาแย่ คะแนนถ่วงน้ำหนักได้เพียง 6.7" }
      - { id: d, text: "เลือกไม่ได้ เพราะคะแนนเท่ากันทั้งหมด", feedback: "คำนวณคะแนนถ่วงน้ำหนักแล้วได้ 6.7, 7.0 และ 7.1 ไม่เท่ากัน" }
    hints:
      - "หาคะแนนถ่วงน้ำหนักของทุกแบบ"
      - "X: $0.5(9) + 0.3(4) + 0.2(5)$"
    solution: "X $= 4.5 + 1.2 + 1.0 = 6.7$ · Y $= 3.0 + 2.4 + 1.6 = 7.0$ · Z $= 4.0 + 2.1 + 1.0 = 7.1$ จึงเลือก Z แต่สูสีกับ Y ควรทำการวิเคราะห์ความไวต่อน้ำหนักด้วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.design.design-process.p008
    topics: [engineering.design.design-process]
    difficulty: 3
    type: numeric
    stem: "ปรับสเกลราคาเป็นคะแนน 0–10 แบบยิ่งถูกยิ่งดี ด้วยสูตร $10 \\times x_{\\min}/x$ ทางเลือกที่ถูกที่สุดราคา 25,000 บาท ทางเลือกที่ราคา 40,000 บาทได้คะแนนเท่าใด"
    answer: { value: 6.25, tolerance: 0.01 }
    misconceptions:
      - { match: 16, feedback: "กลับเศษกับส่วน คะแนนต้องไม่เกิน 10 และของที่แพงกว่าต้องได้คะแนนน้อยกว่า" }
    hints:
      - "$x_{\\min} = 25\\,000$ และ $x = 40\\,000$"
      - "ทางเลือกที่ถูกที่สุดได้ 10 คะแนนเต็ม"
    solution: "$10 \\times \\dfrac{25\\,000}{40\\,000} = 6.25$ คะแนน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.design.design-process.p009
    topics: [engineering.design.design-process]
    difficulty: 3
    type: numeric
    stem: "ทีมวิเคราะห์ FMEA ของปั๊มสูบน้ำเพื่อการเกษตร (ค่าสมมติ) รูปแบบความล้มเหลว \"ซีลรั่ว\" ได้ความรุนแรง 8 โอกาสเกิด 4 และความยากในการตรวจพบ 6 ค่า RPN เป็นเท่าใด"
    answer: { value: 192, tolerance: 0 }
    misconceptions:
      - { match: 18, feedback: "บวกสามค่า แต่ RPN คือผลคูณ $S \\times O \\times D$" }
    hints:
      - "RPN = ความรุนแรง × โอกาสเกิด × ความยากในการตรวจพบ"
      - "คูณทั้งสามค่า"
    solution: "RPN $= 8 \\times 4 \\times 6 = 192$ รูปแบบความล้มเหลวที่ RPN สูงต้องแก้ก่อน เช่น ลดโอกาสเกิดด้วยซีลที่ดีขึ้น หรือเพิ่มตัวตรวจจับการรั่วให้ตรวจพบง่ายขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.design.design-process.p010
    topics: [engineering.design.design-process]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "กราฟแสดงต้นทุนและสมรรถนะของตู้อบแห้งห้าแบบ (A–E) ต้องการต้นทุนต่ำและสมรรถนะสูง ทางเลือกใด **ถูกครอบงำ** และตัดทิ้งได้ทันที (เลือกทุกข้อที่ถูก)"
    figure: { src: p-tradeoff.svg, alt: "กราฟจุด แกนนอนเป็นต้นทุน 0 ถึง 60 พันบาท แกนตั้งเป็นสมรรถนะ 0 ถึง 70 กิโลกรัมต่อวัน จุด A อยู่ที่ต้นทุน 20 สมรรถนะ 30 จุด B ต้นทุน 35 สมรรถนะ 45 จุด C ต้นทุน 30 สมรรถนะ 28 จุด D ต้นทุน 50 สมรรถนะ 60 จุด E ต้นทุน 45 สมรรถนะ 40" }
    choices:
      - { id: a, text: "A", feedback: "A ถูกที่สุด ไม่มีแบบใดถูกกว่าและดีกว่าพร้อมกัน" }
      - { id: b, text: "B", feedback: "แบบที่ดีกว่า B มีแค่ D ซึ่งแพงกว่า จึงไม่มีแบบใดครอบงำ B" }
      - { id: c, text: "C", correct: true }
      - { id: d, text: "D", feedback: "D สมรรถนะสูงที่สุด ไม่มีแบบใดดีกว่า" }
      - { id: e, text: "E", correct: true }
    hints:
      - "ทางเลือกถูกครอบงำเมื่อมีอีกแบบที่ถูกกว่าหรือเท่ากัน และสมรรถนะสูงกว่าหรือเท่ากัน (ดีกว่าอย่างน้อยหนึ่งด้าน)"
      - "สำหรับแต่ละจุด มองหาจุดที่อยู่ทางซ้ายบนของมัน"
    solution: "C (30, 28) ถูกครอบงำโดย A (20, 30) ซึ่งถูกกว่าและดีกว่า E (45, 40) ถูกครอบงำโดย B (35, 45) ส่วน A, B, D อยู่บนแนวพาเรโต ต้องใช้ความต้องการของผู้ใช้ตัดสินต่อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.design.design-process.p011
    topics: [engineering.design.design-process]
    difficulty: 4
    type: numeric
    stem: "ทดสอบต้นแบบสะพานไม้ไอศกรีมห้าชิ้นจนพัง ได้ภาระที่รับได้ $52$, $47$, $55$, $50$ และ $46\\ \\mathrm{N}$ ภาระใช้งานตามข้อกำหนดคือ $30\\ \\mathrm{N}$ ค่าความปลอดภัยที่ควรรายงาน (ใช้ผลทดสอบที่ต่ำที่สุด) เป็นเท่าใด ตอบทศนิยม 2 ตำแหน่ง"
    answer: { value: 1.53, tolerance: 0.01 }
    misconceptions:
      - { match: 1.67, feedback: "ใช้ค่าเฉลี่ย $50\\ \\mathrm{N}$ แต่ชิ้นที่ผลิตจริงอาจอ่อนเท่าชิ้นที่แย่ที่สุด จึงต้องใช้ค่าต่ำสุด" }
      - { match: 0.65, feedback: "กลับเศษกับส่วน ค่าความปลอดภัย = ความสามารถรับได้ ÷ ภาระใช้งาน ซึ่งต้องมากกว่า 1" }
    hints:
      - "ค่าความปลอดภัย = ความสามารถรับได้ ÷ ภาระใช้งาน"
      - "ใช้ความสามารถที่ต่ำที่สุดจากการทดสอบ"
    solution: "ค่าต่ำสุด $46\\ \\mathrm{N}$ ค่าความปลอดภัย $= 46/30 = 1.53$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.design.design-process.p012
    topics: [engineering.design.design-process]
    difficulty: 5
    type: numeric
    stem: "ทางเลือก A ได้คะแนนสมรรถนะ 9 ต้นทุน 4 ทางเลือก B ได้สมรรถนะ 6 ต้นทุน 8 (10 ดีที่สุด) ถ้าให้น้ำหนักสมรรถนะ $w$ และต้นทุน $1 - w$ ค่า $w$ เท่าใดทำให้สองทางเลือกได้คะแนนเท่ากัน ตอบทศนิยม 2 ตำแหน่ง"
    answer: { value: 0.57, tolerance: 0.01 }
    misconceptions:
      - { match: 0.5, feedback: "น้ำหนักเท่ากันให้ A ได้ 6.5 และ B ได้ 7 ยังไม่เท่ากัน ต้องตั้งสมการแก้หา $w$" }
      - { match: 0.43, feedback: "นี่คือน้ำหนักของต้นทุน $1 - w$ คำถามถามน้ำหนักของสมรรถนะ" }
    hints:
      - "คะแนนของ A $= 9w + 4(1 - w)$ คะแนนของ B $= 6w + 8(1 - w)$"
      - "ตั้งให้เท่ากันแล้วแก้สมการ"
    solution: "$9w + 4 - 4w = 6w + 8 - 8w$ ได้ $5w + 4 = 8 - 2w$ จึง $7w = 4$ และ $w = 4/7 \\approx 0.57$ ถ้าสมรรถนะมีน้ำหนักมากกว่า 0.57 เลือก A ถ้าน้อยกว่าเลือก B ผลจึงไวต่อน้ำหนักในช่วงใกล้ 0.5–0.6"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.design.design-process.p013
    topics: [engineering.design.design-process]
    difficulty: 4
    type: numeric
    stem: "แบบจำลองถังเก็บน้ำฝนของโรงเรียน (ข้อมูลสมมติ): หลังคา $100\\ \\mathrm{m^2}$ สัมประสิทธิ์น้ำท่า 0.8 ถังจุ $10\\ \\mathrm{m^3}$ ต้นเดือนแรกมีน้ำ $2\\ \\mathrm{m^3}$ ใช้น้ำเดือนละ $9\\ \\mathrm{m^3}$ ฝนสามเดือนเป็น $40$, $150$ และ $220\\ \\mathrm{mm}$ ระดับน้ำ (ไม่ต่ำกว่า 0 ไม่เกินความจุ) ปลายเดือนที่ 3 เป็นกี่ลูกบาศก์เมตร"
    answer: { value: 10, tolerance: 0.01, unit: m³ }
    misconceptions:
      - { match: 11.6, feedback: "ลืมว่าถังจุได้ $10\\ \\mathrm{m^3}$ น้ำส่วนเกินล้นทิ้ง" }
      - { match: 7.8, feedback: "ปล่อยให้ระดับน้ำติดลบในเดือนแรก แต่ถังว่างแล้วจะติดลบไม่ได้ ต้องตั้งเป็น 0 แล้วนับเป็นการขาดน้ำ" }
    hints:
      - "น้ำเข้า = $100 \\times$ ฝน (เมตร) $\\times 0.8$"
      - "ทำทีละเดือน: ระดับใหม่ = ระดับเดิม + น้ำเข้า − 9 แล้วจำกัดให้อยู่ระหว่าง 0 กับ 10"
    solution: "น้ำเข้า $3.2$, $12$, $17.6\\ \\mathrm{m^3}$ เดือน 1: $2 + 3.2 - 9 = -3.8$ → 0 (ขาดน้ำ $3.8$) เดือน 2: $0 + 12 - 9 = 3$ เดือน 3: $3 + 17.6 - 9 = 11.6$ เกินความจุ → $10\\ \\mathrm{m^3}$ (ล้น $1.6$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.design.design-process.p014
    topics: [engineering.design.design-process]
    difficulty: 4
    type: mcq
    stem: "วิศวกรอาสาออกแบบระบบน้ำดื่มสะอาดสำหรับหมู่บ้านห่างไกลแห่งหนึ่ง ข้อใดเป็นการแตกปัญหาใหญ่เป็นปัญหาย่อยที่เหมาะสมที่สุด"
    choices:
      - { id: a, text: "แหล่งน้ำ → การสูบ → การกรอง → การฆ่าเชื้อ → การเก็บและจ่าย → การดูแลโดยชุมชน", correct: true }
      - { id: b, text: "ซื้อเครื่องกรองราคาแพงที่สุด แล้วแจกให้ทุกบ้าน", feedback: "นี่คือการกระโดดไปที่คำตอบเดียว ไม่ได้แตกปัญหาหรือดูความต้องการ เช่น ไฟฟ้า การซ่อม และค่าใช้จ่ายระยะยาว" }
      - { id: c, text: "แบ่งงานตามตัวบุคคลในทีม คนละหนึ่งสัปดาห์", feedback: "นี่คือการแบ่งเวลาทำงาน ไม่ใช่การแตกปัญหาตามหน้าที่ของระบบ" }
      - { id: d, text: "ออกแบบระบบทั้งหมดพร้อมกันในครั้งเดียว แล้วจึงทดสอบ", feedback: "ปัญหาซับซ้อนแก้ทีเดียวไม่ได้ ถ้าพังจะไม่รู้ว่าส่วนใดผิด" }
    hints:
      - "แตกตามหน้าที่ (ฟังก์ชัน) ที่ระบบต้องทำ"
      - "อย่าลืมการใช้งานระยะยาวโดยชุมชน"
    solution: "แตกตามฟังก์ชันของระบบตั้งแต่แหล่งน้ำถึงผู้ใช้ แต่ละส่วนออกแบบและทดสอบได้แยกกัน และรวมการดูแลโดยชุมชนเพราะเป็นความต้องการทางสังคมที่ทำให้ระบบใช้ได้จริงในระยะยาว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.design.design-process.p015
    topics: [engineering.design.design-process]
    difficulty: 5
    type: numeric
    stem: "เลือกเครื่องกรองอากาศสามรุ่น: P อัตราส่งอากาศสะอาด $300\\ \\mathrm{m^3/h}$ ราคา 6,000 บาท เสียง $50\\ \\mathrm{dB}$ · Q $450\\ \\mathrm{m^3/h}$ 9,000 บาท $55\\ \\mathrm{dB}$ · R $380\\ \\mathrm{m^3/h}$ 7,000 บาท $45\\ \\mathrm{dB}$ น้ำหนัก 0.5, 0.3, 0.2 ปรับสเกลเป็น 0–10 (อัตราส่งอากาศใช้ $10x/x_{\\max}$ ราคาและเสียงใช้ $10x_{\\min}/x$) คะแนนรวมของ R เป็นเท่าใด ตอบทศนิยม 2 ตำแหน่ง"
    answer: { value: 8.79, tolerance: 0.02 }
    misconceptions:
      - { match: 8.19, feedback: "ปรับสเกลราคาและเสียงแบบยิ่งมากยิ่งดี แต่สองเกณฑ์นี้ยิ่งน้อยยิ่งดี ต้องใช้ $x_{\\min}/x$" }
    hints:
      - "R: อากาศ $10 \\times 380/450$ ราคา $10 \\times 6000/7000$ เสียง $10 \\times 45/45$"
      - "คูณด้วยน้ำหนักแล้วบวก"
    solution: "คะแนน R: อากาศ $8.44$ ราคา $8.57$ เสียง $10$ รวม $0.5(8.44) + 0.3(8.57) + 0.2(10) = 8.79$ (P ได้ 8.13 Q ได้ 8.64) R ชนะแม้ไม่ได้ดีที่สุดในเกณฑ์ที่มีน้ำหนักมากที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.design.design-process.p016
    topics: [engineering.design.design-process]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "ออกแบบคันกั้นน้ำถาวรรอบชุมชนริมแม่น้ำในจังหวัดพระนครศรีอยุธยา นอกจากความแข็งแรงและราคา ควรพิจารณาเรื่องใดอีก (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "น้ำที่ถูกกั้นไม่ให้เข้าชุมชนจะไปท่วมพื้นที่ใกล้เคียงมากขึ้นหรือไม่", correct: true }
      - { id: b, text: "ทางเข้าออกของชาวบ้าน ท่าน้ำ และโบราณสถานริมน้ำ", correct: true }
      - { id: c, text: "ความปลอดภัยของคนเมื่อคันกั้นน้ำเกิดรั่วหรือพัง", correct: true }
      - { id: d, text: "สีของคันกั้นน้ำตามความชอบของผู้ออกแบบ", feedback: "ความสวยงามพิจารณาได้ แต่ต้องมาจากความต้องการของชุมชน ไม่ใช่ความชอบส่วนตัวของผู้ออกแบบ" }
    hints:
      - "การออกแบบต้องคำนึงถึงสาธารณสุข ความปลอดภัย สังคม วัฒนธรรม สิ่งแวดล้อม และเศรษฐกิจ"
      - "ผลกระทบไม่ได้หยุดอยู่ที่ชุมชนที่ได้รับการปกป้อง"
    solution: "ข้อ a เป็นผลกระทบต่อสิ่งแวดล้อมและชุมชนข้างเคียง ข้อ b เป็นผลกระทบทางสังคมและวัฒนธรรม ข้อ c เป็นความปลอดภัยสาธารณะ ส่วนความชอบส่วนตัวของผู้ออกแบบไม่ใช่เกณฑ์ที่ถูกต้อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.design.design-process.p017
    topics: [engineering.design.design-process]
    difficulty: 2
    type: mcq
    stem: "ต้นแบบตู้อบแห้งทำความร้อนได้ไม่ถึงข้อกำหนดในวันที่มีเมฆมาก ทีมควรทำอย่างไรต่อ"
    choices:
      - { id: a, text: "วิเคราะห์สาเหตุจากข้อมูลการทดสอบ แล้วย้อนกลับไปปรับแบบและทดสอบซ้ำ", correct: true }
      - { id: b, text: "เลิกโครงการ เพราะต้นแบบล้มเหลว", feedback: "ผลที่ไม่ผ่านเป็นข้อมูลสำหรับการปรับปรุง การออกแบบเป็นกระบวนการวนซ้ำ" }
      - { id: c, text: "ลดข้อกำหนดลงให้ต้นแบบผ่าน", feedback: "ข้อกำหนดมาจากความต้องการของผู้ใช้ ถ้าลดลงโดยไม่มีเหตุผล ผู้ใช้จะได้ของที่ใช้ไม่ได้" }
      - { id: d, text: "ทดสอบเฉพาะวันที่แดดจัดเพื่อให้ผลดูดี", feedback: "การเลือกเงื่อนไขทดสอบที่ทำให้ผลดูดีเป็นการทดสอบที่ไม่ยุติธรรมและไม่ซื่อตรง" }
    hints:
      - "การออกแบบเป็นกระบวนการวนซ้ำ"
      - "ผลทดสอบที่ไม่ผ่านบอกอะไรเรา"
    solution: "ใช้ข้อมูลหาสาเหตุ เช่น ฉนวนไม่พอหรือพื้นที่รับแสงน้อย แล้วปรับแบบและทดสอบซ้ำในเงื่อนไขเดิม นี่คือหัวใจของการออกแบบแบบวนซ้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true
