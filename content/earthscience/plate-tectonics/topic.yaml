id: earthscience.geology.plate-tectonics
subject: earthscience
title: { th: โครงสร้างโลกและการเคลื่อนที่ของแผ่นธรณี, en: "Earth's structure and plate tectonics" }
summary: ชั้นของโลกตามองค์ประกอบและสมบัติเชิงกล หลักฐานจากคลื่นไหวสะเทือน ทวีปเลื่อน การแผ่ขยายพื้นสมุทร การพาความร้อนในเนื้อโลก และแนวรอยต่อของแผ่นธรณีพร้อมหลักฐาน
difficulty: 5
minutes: 40
prerequisites: [physics.waves.wave-basics]
encompasses:
  - { id: physics.waves.wave-basics, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: โครงสร้างภายในของโลก
    src: earth-layers.svg
    alt: "ครึ่งวงกลมแสดงภาพตัดโลกตามมาตราส่วน ชั้นนอกสีน้ำตาลคือเปลือกโลก หนา 30–50 km ใต้ทวีป 5–10 km ใต้ทะเล วาดหนาเกินจริง ถัดมาเป็นเนื้อโลก ซิลิเกตของ Mg และ Fe ลึกถึง 2,890 km แก่นโลกชั้นนอก Fe–Ni ของเหลว ลึก 2,890–5,150 km และแก่นโลกชั้นใน Fe–Ni ของแข็ง ลึก 5,150–6,371 km ด้านขวามีเส้นประบอกฐานของธรณีภาค (แข็ง) ที่ราว 100 km และเส้นจุดบอกฐานของฐานธรณีภาค (อ่อน) ที่ราว 350 km"
    caption: "ด้านซ้ายแบ่งตามองค์ประกอบ เส้นประด้านขวาแบ่งตามสมบัติเชิงกล (วาดโดยทีมคลังรู้)"
  - type: figure
    title: เขตอับคลื่นไหวสะเทือน
    src: shadow-zones.svg
    alt: "ภาพตัดโลก จุดเกิดแผ่นดินไหวอยู่ด้านบน แก่นโลกชั้นนอกที่เป็นของเหลวอยู่ตรงกลาง เส้นคลื่นจากจุดเกิดไปถึงผิวโลกไม่เกิน 104° แถบสีม่วงที่ 104°–140° ทั้งสองข้างเป็นเขตอับคลื่น P เส้นประสีน้ำเงินจาก 104° ลงไปถึงด้านตรงข้ามเป็นเขตอับคลื่น S เพราะคลื่น S ผ่านแก่นโลกชั้นนอกที่เป็นของเหลวไม่ได้"
    caption: "เส้นทางคลื่นวาดแบบง่าย จริง ๆ คลื่นโค้งเพราะอัตราเร็วเพิ่มตามความลึก (วาดโดยทีมคลังรู้)"
  - { type: check, problem: earthscience.geology.plate-tectonics.p003, prompt: "คลื่น S เป็นคลื่นตามขวาง" }
  - type: worked-example
    title: หาระยะทางถึงจุดเกิดแผ่นดินไหว
    problem: "สถานีวัดที่เชียงใหม่บันทึกคลื่น S ตามหลังคลื่น P 15 s ใช้อัตราเร็วคลื่น P 6.0 km/s และคลื่น S 3.5 km/s หาระยะทางถึงจุดเกิดแผ่นดินไหว"
    steps:
      - text: "ให้ระยะทางเป็น $d$ เวลาที่คลื่น P ใช้ $d/6.0$ เวลาที่คลื่น S ใช้ $d/3.5$"
      - text: "คลื่น S มาช้ากว่า 15 s: $\\dfrac{d}{3.5} - \\dfrac{d}{6.0} = 15$"
        why: "เราไม่รู้เวลาที่แผ่นดินไหวเกิด แต่รู้ผลต่างของเวลาที่คลื่นทั้งสองมาถึง"
      - text: "$\\dfrac{1}{3.5} - \\dfrac{1}{6.0} = 0.286 - 0.167 = 0.119\\ \\mathrm{s/km}$ ดังนั้น $d = 15 / 0.119 = 126\\ \\mathrm{km}$"
      - text: "ระยะทางบอกได้แค่ว่าจุดเกิดอยู่บนวงกลมรัศมี 126 km ต้องใช้อย่างน้อยสามสถานีจึงหาตำแหน่งได้"
    answer: "ประมาณ 126 km"
  - type: figure
    title: แนวรอยต่อของแผ่นธรณีสามแบบ
    src: plate-boundaries.svg
    alt: "สามช่อง ช่องแรก แยกออกจากกัน ภาพตัดมีน้ำทะเลด้านบน แผ่นธรณีสีเทาแยกไปซ้ายและขวา แมกมาสีแดงดันขึ้นตรงกลาง เขียนว่าแมกมาดันขึ้นสร้างพื้นสมุทรใหม่ สันเขากลางมหาสมุทร หุบเขาทรุด ช่องที่สอง เคลื่อนเข้าหากัน แผ่นมหาสมุทรสีเทาเคลื่อนไปทางขวาแล้วมุดเอียงลงใต้แผ่นทวีปสีน้ำตาลอ่อน มีร่องลึกที่จุดมุด และภูเขาไฟบนแผ่นทวีปมีแมกมาสีแดงขึ้นมา ช่องที่สาม เลื่อนผ่านกัน มองจากด้านบน สองแผ่นเลื่อนสวนกันขึ้นและลงตามรอยเลื่อนสีแดง ถนนสีน้ำเงินที่ตัดผ่านถูกเลื่อนแยกออก เขียนว่ารอยเลื่อนแนวระดับ เช่น รอยเลื่อนสะกาย"
    caption: "ภาพแบบง่าย ไม่ได้ตามมาตราส่วน (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: หลักฐานจากแถบแม่เหล็ก
    problem: "นักธรณีวิทยาพบว่าแถบแม่เหล็กบนพื้นสมุทรสองข้างสันเขามีลวดลายเหมือนกันเป็นภาพสะท้อน และหินที่ห่างสันเขา 30 km มีอายุ 1.0 ล้านปี ข้อมูลนี้บอกอะไร"
    steps:
      - text: "หินบะซอลต์บันทึกทิศสนามแม่เหล็กโลกตอนที่เย็นตัวที่สันเขา และสนามแม่เหล็กโลกกลับทิศเป็นระยะ"
      - text: "แถบที่สมมาตรสองข้างแปลว่าหินเกิดที่สันเขาแล้วถูกแยกออกไปทั้งสองข้างเท่า ๆ กัน"
        why: "ถ้าหินเกิดพร้อมกันทั้งพื้นสมุทร จะไม่เป็นแถบที่สมมาตรรอบสันเขา"
      - text: "อัตราเร็วของแผ่นข้างหนึ่ง $= \\dfrac{30 \\times 10^5\\ \\mathrm{cm}}{1.0 \\times 10^6\\ \\text{ปี}} = 3\\ \\mathrm{cm/ปี}$"
    answer: "พื้นสมุทรแผ่ขยายออกจากสันเขา แผ่นข้างหนึ่งเคลื่อนราว 3 cm/ปี และสองแผ่นแยกห่างกันราว 6 cm/ปี"
  - { type: check, problem: earthscience.geology.plate-tectonics.p007, prompt: "อัตราเร็ว = ระยะจากสันเขา ÷ อายุ" }
glossary:
  - { term: ธรณีภาค, definition: "ชั้นนอกที่แข็งของโลก รวมเปลือกโลกและเนื้อโลกตอนบนสุด หนาราว 100 km แตกเป็นแผ่นธรณี" }
  - { term: ฐานธรณีภาค, definition: "เนื้อโลกตอนบนใต้ธรณีภาค ราว 100–350 km เป็นของแข็งที่อ่อนตัวและไหลได้ช้า" }
  - { term: แนวไม่ต่อเนื่องโมโฮโรวิซิก, definition: "รอยต่อระหว่างเปลือกโลกกับเนื้อโลก ที่อัตราเร็วคลื่นไหวสะเทือนเพิ่มขึ้นทันที" }
  - { term: เขตอับคลื่น, definition: "บริเวณบนผิวโลกที่ไม่ได้รับคลื่นไหวสะเทือนชนิดหนึ่งโดยตรง เพราะแก่นโลกทำให้คลื่นหักเหหรือผ่านไม่ได้" }
  - { term: การแผ่ขยายพื้นสมุทร, definition: "การเกิดพื้นสมุทรใหม่ที่สันเขากลางมหาสมุทรแล้วเคลื่อนออกไปสองข้าง" }
  - { term: แนวมุดตัว, definition: "แนวที่แผ่นธรณีที่หนาแน่นกว่ามุดลงใต้อีกแผ่น มีร่องลึก ภูเขาไฟ และแผ่นดินไหว" }
  - { term: รอยเลื่อนมีพลัง, definition: "รอยเลื่อนที่มีหลักฐานว่าเคยขยับในช่วงเวลาทางธรณีวิทยาที่ไม่นาน และอาจทำให้เกิดแผ่นดินไหวได้อีก" }
flashcards:
  - { front: "หลักฐานว่าแก่นโลกชั้นนอกเป็นของเหลว", back: "เขตอับคลื่น S เกิน 104° เพราะคลื่น S ผ่านของเหลวไม่ได้" }
  - { front: "หลักฐานทวีปเลื่อนของเวเกเนอร์", back: "ขอบทวีปต่อกันได้ ซากดึกดำบรรพ์เดียวกันข้ามทวีป หินและเทือกเขาต่อกัน ร่องรอยธารน้ำแข็งโบราณ" }
  - { front: "หลักฐานการแผ่ขยายพื้นสมุทร", back: "แถบแม่เหล็กสมมาตรสองข้างสันเขา อายุหินเพิ่มขึ้นเมื่อห่างจากสันเขา" }
  - { front: "ทำไมเปลือกมหาสมุทรอายุน้อยกว่าเปลือกทวีปมาก", back: "เปลือกมหาสมุทรเกิดที่สันเขาและมุดกลับที่ร่องลึก เปลือกทวีปเบากว่าจึงไม่มุด" }
  - { front: "รอยเลื่อนสะกายเป็นแนวรอยต่อแบบใด", back: "เลื่อนผ่านกันในแนวระดับ" }
