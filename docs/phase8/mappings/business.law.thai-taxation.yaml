  - { framework: th-tqf-accounting, indicators: ["8.1.4"], coverage: partial, note: "คำนวณภาษีเงินได้บุคคลธรรมดา ภาษีหัก ณ ที่จ่าย ภาษีเงินได้นิติบุคคล (รวม SME และการปรับกำไรทางภาษี) ภาษีมูลค่าเพิ่ม แบบแสดงรายการหลัก ภาษีมูลค่าเพิ่มการนำเข้าและส่งออก (p003–p017) ยังไม่มีภาษีธุรกิจเฉพาะ อากรแสตมป์ อนุสัญญาภาษีซ้อน การกำหนดราคาโอน และรายละเอียดวิธีปฏิบัติเชิงลึก" }
