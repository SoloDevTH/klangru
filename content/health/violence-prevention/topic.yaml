id: health.safety.violence-prevention
subject: health
title:
  th: การป้องกันความรุนแรงและการแก้ปัญหาโดยสันติ
  en: Preventing violence and resolving problems peacefully
summary: รูปแบบของความรุนแรง การกลั่นแกล้งและการกลั่นแกล้งทางไซเบอร์ ความรุนแรงในคู่รัก ปัจจัยในสังคมไทย สิ่งที่ผู้ถูกกระทำและผู้เห็นเหตุการณ์ทำได้ และแหล่งช่วยเหลือ 1300 191
difficulty: 4
minutes: 35
prerequisites:
- health.safety.risk-behaviour-life-skills
- health.family.conflict-resolution
encompasses:
- id: health.family.conflict-resolution
  weight: 0.2
- id: health.safety.risk-behaviour-life-skills
  weight: 0.2
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  title: ปัจจัยของความรุนแรงหลายระดับ
  src: factor-levels.svg
  alt: วงกลมซ้อนสามชั้น ในสุดคือบุคคล ถัดมาคือความสัมพันธ์ นอกสุดคือชุมชนและสังคม ด้านขวามีกล่องอธิบาย บุคคล ใช้แอลกอฮอล์และสารเสพติดเร็ว จัดการอารมณ์ไม่ได้ เคยเห็นหรือถูกทำร้ายในบ้าน ความสัมพันธ์ ลงโทษรุนแรงหรือขาดการดูแล กลุ่มเพื่อนหรือแก๊งใช้ความรุนแรง ค่านิยมต้องเอาคืน ชุมชนและสังคม สุราและอาวุธหาง่าย ยาเสพติด ความยากจน ความเหลื่อมล้ำ ค่านิยมชายเป็นใหญ่ สื่อทำให้ดูเท่
  caption: การป้องกันที่ได้ผลต้องทำหลายระดับพร้อมกัน
- type: worked-example
  title: วิเคราะห์ปัจจัยและเสนอแนวทางป้องกัน
  problem: 'ข่าวสมมติ: นักเรียนช่างกลสองสถาบันทะเลาะกันซ้ำ ๆ หลายปี ล่าสุดมีผู้บาดเจ็บจากอาวุธที่ป้ายรถเมล์ ผู้ก่อเหตุดื่มสุรามาก่อน และรุ่นพี่ปลูกฝังว่าต้องเอาคืนเพื่อศักดิ์ศรีสถาบัน วิเคราะห์ปัจจัยและเสนอแนวทางป้องกัน'
  steps:
  - text: 'ระดับบุคคล: ดื่มสุราก่อนก่อเหตุ ทำให้ยั้งคิดได้น้อยลง'
  - text: 'ระดับความสัมพันธ์: ค่านิยมรุ่นพี่ที่ให้เอาคืนเพื่อศักดิ์ศรี'
    why: ค่านิยมของกลุ่มทำให้ความรุนแรงส่งต่อเป็นรุ่น
  - text: 'ระดับชุมชนและสังคม: เข้าถึงอาวุธและสุราได้ง่าย และความขัดแย้งสะสมระหว่างสถาบัน'
  - text: 'แนวทาง: ฝึกจัดการความโกรธ ให้รุ่นพี่ต้นแบบสร้างกิจกรรมร่วมระหว่างสถาบัน ควบคุมการขายสุราและตรวจอาวุธ และให้ชุมชนแจ้งเหตุเร็ว'
  answer: ความรุนแรงมีหลายสาเหตุ แนวทางป้องกันจึงต้องครอบคลุมบุคคล กลุ่มเพื่อน และชุมชน
- type: check
  problem: health.safety.violence-prevention.p003
  prompt: ลองตอบก่อนอ่านต่อ
- type: figure
  title: ผู้เห็นเหตุการณ์ช่วยได้
  src: bystander.svg
  alt: ห้ากล่องเรียงกัน ไม่ร่วมวง ไม่หัวเราะ ไม่กดถูกใจ ไม่ส่งต่อ เบี่ยงเหตุการณ์ ครูเรียกเธอแน่ะ พาเพื่อนออกมา อยู่ข้างผู้ถูกกระทำ ส่งข้อความให้กำลังใจ ช่วยเก็บหลักฐาน ชวนให้หยุด พอแล้ว ไม่ตลก พูดสั้น ไม่ยั่วยุ แจ้งผู้ใหญ่ ครู ผู้ปกครอง 191 ถ้ามีอันตราย ด้านล่างกรอบแดงเขียนว่า ห้ามเข้าไปแยกคนที่ต่อสู้หรือมีอาวุธด้วยตัวเอง ความปลอดภัยของเรามาก่อนเสมอ
- type: worked-example
  title: ช่วยเพื่อนที่ถูกกลั่นแกล้งในแชตกลุ่ม
  problem: มีคนในกลุ่มแชตห้องโพสต์ข้อความล้อเรื่องฐานะทางบ้านของภูมิทุกวัน ภูมิไม่ตอบอะไรแต่เริ่มเงียบในห้องเรียน เราเห็นทุกข้อความ จะช่วยอย่างไร
  steps:
  - text: 'ไม่ร่วมวง: ไม่ตอบ ไม่ส่งสติกเกอร์หัวเราะ ไม่ส่งต่อ'
  - text: 'ส่งข้อความส่วนตัวหาภูมิ: "เราเห็นแล้วนะ ไม่ใช่ความผิดนาย เราอยู่ข้างนาย"'
    why: ผู้ถูกกระทำมักรู้สึกโดดเดี่ยว ข้อความเดียวช่วยได้มาก
  - text: บันทึกหน้าจอพร้อมวันเวลาไว้ ก่อนข้อความอาจถูกลบ
  - text: ชวนภูมิไปบอกครูประจำชั้นด้วยกัน หรือไปบอกเองถ้าภูมิยังไม่พร้อม
  answer: ไม่ร่วมวง อยู่ข้างภูมิ เก็บหลักฐาน และแจ้งผู้ใหญ่
- type: check
  problem: health.safety.violence-prevention.p010
glossary:
- term: การกลั่นแกล้ง
  definition: การทำร้ายซ้ำ ๆ โดยตั้งใจ ซึ่งผู้กระทำมีอำนาจมากกว่า ทั้งทางร่างกาย วาจา สังคม และออนไลน์
- term: การกลั่นแกล้งทางไซเบอร์
  definition: การกลั่นแกล้งผ่านโซเชียลมีเดีย แอปแชต เกม หรือโทรศัพท์ เช่น โพสต์ภาพให้อับอาย ส่งข้อความขู่ สร้างบัญชีปลอม
- term: ผู้เห็นเหตุการณ์
  definition: ผู้ที่รู้หรือเห็นความรุนแรงที่เกิดกับคนอื่น ช่วยหยุดได้ด้วยการไม่ร่วมวง อยู่ข้างผู้ถูกกระทำ และแจ้งผู้ใหญ่
- term: ความรุนแรงในคู่รัก
  definition: การทำร้ายร่างกาย จิตใจ ทางเพศ หรือการควบคุมโดยแฟนหรือคู่ครอง รวมถึงอดีตคู่
- term: ศูนย์พึ่งได้ (OSCC)
  definition: ศูนย์ในโรงพยาบาลของรัฐที่ช่วยเด็กและผู้หญิงที่ถูกกระทำความรุนแรงครบทั้งการแพทย์ กฎหมาย และสังคม
flashcards:
- front: ล้อเล่นกับกลั่นแกล้งต่างกันอย่างไร
  back: ถ้าอีกฝ่ายรู้สึกแย่ ขอให้หยุดแล้วยังทำซ้ำ คือการกลั่นแกล้ง
- front: ถูกกลั่นแกล้งออนไลน์ทำอย่างไร
  back: ไม่ตอบโต้ → เก็บหลักฐาน → บล็อกและรายงาน → บอกผู้ใหญ่ที่ไว้ใจ
- front: สัญญาณเตือนความรุนแรงในคู่รัก
  back: หึงหวงรุนแรง ตรวจโทรศัพท์ ห้ามพบเพื่อน ข่มขู่ กดดันเรื่องเพศหรือภาพส่วนตัว
- front: แหล่งช่วยเหลือเรื่องความรุนแรง
  back: 1300 ศูนย์ช่วยเหลือสังคม 24 ชม. 191 ตำรวจ 1669 ผู้บาดเจ็บ 1323 สุขภาพจิต ศูนย์พึ่งได้ในโรงพยาบาลรัฐ
