topic: computer.programming.development-process
rows:
  - { framework: csta-k12-cs, indicators: ["1B-AP-13"], coverage: full, note: "วางแผนการพัฒนาแบบวนรอบโดยฟังผู้ใช้หลายกลุ่ม (นักเรียน แม่ค้า ครู ผู้ปกครอง ผู้มีข้อจำกัด) จัดลำดับความเห็นด้วยผลต่อผู้ใช้กับแรงที่ต้องใช้ และวางแผนรอบถัดไป" }
  - { framework: csta-k12-cs, indicators: ["3B-AP-24"], coverage: full, note: "เทียบ Python JavaScript C SQL และ Scratch ว่าคุณลักษณะของแต่ละภาษาเหมาะกับปัญหาแบบใด" }
  - { framework: csta-k12-cs, indicators: ["1B-AP-12", "3B-AP-22"], coverage: partial, note: "ต่อยอดโปรแกรมเดิมตามสัญญาอนุญาตพร้อมให้เครดิต เพิ่มความสามารถ (ค่ากล่องกลับบ้าน ส่วนลดสมาชิก) และอภิปรายผลที่ไม่ตั้งใจ เช่น ค่าเริ่มต้นของพารามิเตอร์ที่ทำให้ลูกค้าทั่วไปได้ส่วนลด แต่ผู้เรียนไม่ได้แก้โปรแกรมเองในแอป" }
  - { framework: csta-k12-cs, indicators: ["2-AP-15", "3A-AP-19"], coverage: partial, note: "วิธีขอความเห็นจากผู้ใช้และเพื่อนร่วมทีม ให้ผู้ใช้ลงมือทำงานจริง วัดอัตราความสำเร็จเทียบแต่ละรอบ และออกแบบให้ผู้ใช้กลุ่มกว้างอย่างเป็นระบบ แต่การเก็บความเห็นจากผู้ใช้จริงทำนอกแอป" }
  - { framework: csta-k12-cs, indicators: ["3A-AP-23"], coverage: partial, note: "องค์ประกอบของบันทึกการตัดสินใจ (สิ่งที่ตัดสินใจ เหตุผลพร้อมหลักฐาน ทางเลือกที่ไม่เลือก) และรูปแบบข้อความ ภาพก่อนหลัง ผังงาน วิดีโอสาธิต ผู้เรียนประเมินบันทึกตัวอย่าง แต่ไม่ได้บันทึกโปรแกรมซับซ้อนของตนเอง" }
  - { framework: csta-k12-cs, indicators: ["3B-AP-17"], coverage: partial, note: "ขั้นของวงจรชีวิตของซอฟต์แวร์ แบบน้ำตกกับแบบวนรอบและเมื่อใดควรใช้แบบใด แต่ไม่ได้วางแผนและพัฒนาโปรแกรมจริงของตนเอง" }
  - { framework: csta-k12-cs, indicators: ["3B-AP-19"], coverage: partial, note: "ชั่งเว็บแอปที่ปรับตามจอกับแอปเฉพาะระบบสำหรับผู้ใช้หลายอุปกรณ์ แต่ไม่ได้พัฒนาโปรแกรมบนหลายแพลตฟอร์มจริง" }
  - { framework: csta-k12-cs, indicators: ["3B-AP-21"], coverage: partial, note: "เขียนกรณีทดสอบจากข้อกำหนดก่อนแก้โค้ด ใช้ assert และนับกรณีที่ผ่าน จับบั๊กที่ค่าขอบ แต่ผู้เรียนไม่ได้รันชุดทดสอบเองในแอป" }
