<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="sans-serif" font-size="14">
<title>แบบจำลองการเปลี่ยนแปลงสามขั้นของเลวิน</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="ahk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
<text x="380.0" y="30.0" text-anchor="middle" font-size="16" fill="#222" font-weight="bold" >แบบจำลองการเปลี่ยนแปลงสามขั้นของเลวิน</text>
<rect x="30.0" y="70.0" width="210.0" height="190.0" rx="10" fill="#fdf2e9" stroke="#d35400" stroke-width="2" />
<text x="135.0" y="100.0" text-anchor="middle" font-size="16" fill="#d35400" font-weight="bold" >1. ละลาย (Unfreeze)</text>
<text x="44.0" y="140.0" text-anchor="start" font-size="13.5" fill="#222" >• ชี้ให้เห็นว่าทำไมต้องเปลี่ยน</text>
<text x="44.0" y="172.0" text-anchor="start" font-size="13.5" fill="#222" >• ใช้ข้อมูลจริง เช่น เวลารอ</text>
<text x="44.0" y="204.0" text-anchor="start" font-size="13.5" fill="#222" >• ลดแรงต้าน รับฟังความกังวล</text>
<line x1="245.0" y1="165.0" x2="280.0" y2="165.0" stroke="#222" stroke-width="3" marker-end="url(#ahk)" />
<rect x="285.0" y="70.0" width="210.0" height="190.0" rx="10" fill="#eef4fb" stroke="#1f5fa8" stroke-width="2" />
<text x="390.0" y="100.0" text-anchor="middle" font-size="16" fill="#1f5fa8" font-weight="bold" >2. เปลี่ยน (Change)</text>
<text x="299.0" y="140.0" text-anchor="start" font-size="13.5" fill="#222" >• ทดลองวิธีใหม่ในจุดนำร่อง</text>
<text x="299.0" y="172.0" text-anchor="start" font-size="13.5" fill="#222" >• อบรมและสอนงานข้างตัว</text>
<text x="299.0" y="204.0" text-anchor="start" font-size="13.5" fill="#222" >• สื่อสารความคืบหน้าบ่อย ๆ</text>
<line x1="500.0" y1="165.0" x2="535.0" y2="165.0" stroke="#222" stroke-width="3" marker-end="url(#ahk)" />
<rect x="540.0" y="70.0" width="210.0" height="190.0" rx="10" fill="#edf7ee" stroke="#2e7d32" stroke-width="2" />
<text x="645.0" y="100.0" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold" >3. ตรึง (Refreeze)</text>
<text x="554.0" y="140.0" text-anchor="start" font-size="13.5" fill="#222" >• เขียนเป็นมาตรฐานงานใหม่</text>
<text x="554.0" y="172.0" text-anchor="start" font-size="13.5" fill="#222" >• ผูกกับตัวชี้วัดและรางวัล</text>
<text x="554.0" y="204.0" text-anchor="start" font-size="13.5" fill="#222" >• เลิกใช้ระบบเก่า</text>
</svg>
