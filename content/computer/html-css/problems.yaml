problems:
  - id: computer.web.html-css.p001
    topics: [computer.web.html-css]
    difficulty: 1
    type: mcq
    stem: "ภาษาใดใช้บอก **โครงสร้าง** ของหน้าเว็บ ว่าส่วนใดเป็นหัวเรื่อง ย่อหน้า หรือรายการ"
    choices:
      - { id: a, text: "HTML", correct: true }
      - { id: b, text: "CSS", feedback: "CSS บอกการแสดงผล เช่น สีและขนาด ไม่ได้บอกว่าส่วนใดคืออะไร" }
      - { id: c, text: "HTTP", feedback: "HTTP เป็นโพรโทคอลที่ใช้ส่งหน้าเว็บระหว่างเบราว์เซอร์กับแม่ข่าย ไม่ใช่ภาษาเขียนหน้าเว็บ" }
      - { id: d, text: "Python", feedback: "Python เป็นภาษาเขียนโปรแกรมทั่วไป ไม่ใช่ภาษามาร์กอัปของหน้าเว็บ" }
    hints:
      - "เอกสารเว็บมีสามชั้น เนื้อหา โครงสร้าง การแสดงผล"
      - "ภาษามาร์กอัปใส่ป้ายบอกว่าแต่ละส่วนคืออะไร"
    solution: "HTML (HyperText Markup Language) ใช้แท็กบอกโครงสร้าง เช่น h1 p ul ส่วน CSS กำหนดหน้าตา และ HTTP เป็นโพรโทคอลที่ใช้ส่งไฟล์เหล่านี้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.web.html-css.p002
    topics: [computer.web.html-css]
    difficulty: 1
    type: match
    stem: "จับคู่แท็ก HTML กับความหมาย"
    pairs:
      - { left: "h1", right: "หัวเรื่องสำคัญที่สุดของหน้า" }
      - { left: "p", right: "ย่อหน้า" }
      - { left: "li", right: "ข้อหนึ่งในรายการ" }
      - { left: "a", right: "ลิงก์ไปยังหน้าอื่น" }
      - { left: "img", right: "ภาพ" }
    hints:
      - "p มาจาก paragraph, li มาจาก list item"
      - "a ต้องมีแอตทริบิวต์ href, img ต้องมี src และ alt"
    solution: "h1 หัวเรื่องระดับ 1, p ย่อหน้า, li ข้อในรายการ (อยู่ใน ul หรือ ol), a ลิงก์ (anchor), img ภาพ (image)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.web.html-css.p003
    topics: [computer.web.html-css]
    difficulty: 2
    type: mcq
    stem: "โค้ด HTML ข้อใดซ้อนแท็กถูกต้อง"
    choices:
      - { id: a, text: "`<p>ส่งงานภายใน <strong>วันศุกร์</strong></p>`", correct: true }
      - { id: b, text: "`<p>ส่งงานภายใน <strong>วันศุกร์</p></strong>`", feedback: "strong เปิดทีหลัง p จึงต้องปิดก่อน p" }
      - { id: c, text: "`<p>ส่งงานภายใน <strong>วันศุกร์<strong></p>`", feedback: "แท็กปิดต้องมีเครื่องหมาย / เป็น </strong>" }
      - { id: d, text: "`<p>ส่งงานภายใน <strong>วันศุกร์</strong>`", feedback: "ขาดแท็กปิด </p>" }
    hints:
      - "แท็กปิดมีเครื่องหมาย / หน้าชื่อแท็ก"
      - "แท็กที่เปิดทีหลังต้องปิดก่อน เหมือนกล่องซ้อนกัน"
    solution: "ข้อ ก เปิด p แล้วเปิด strong จากนั้นปิด strong ก่อนแล้วจึงปิด p กล่องในอยู่ในกล่องนอกพอดี ข้ออื่นปิดสลับ ลืม / หรือลืมปิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.web.html-css.p004
    topics: [computer.web.html-css]
    difficulty: 2
    type: mcq
    stem: "หน้าเว็บในภาพมีขั้นตอนที่มีหมายเลข 1, 2, 3 ส่วนนี้น่าจะเขียนด้วยโค้ด HTML แบบใด"
    figure:
      src: handwash-page.svg
      alt: "หน้าเว็บในเบราว์เซอร์ มีหัวเรื่องตัวใหญ่ ขั้นตอนล้างมือ 7 ขั้น ใต้หัวเรื่องเป็นรายการสามข้อที่มีหมายเลขนำหน้า 1. ฝ่ามือถูฝ่ามือ 2. ฝ่ามือถูหลังมือ 3. ฝ่ามือถูฝ่ามือนิ้วสอดประสานกัน และด้านล่างมีลิงก์สีน้ำเงินขีดเส้นใต้ อ่านต่อทั้ง 7 ขั้น"
    choices:
      - { id: a, text: "`<ol>` ที่มี `<li>` สามข้อ", correct: true }
      - { id: b, text: "`<ul>` ที่มี `<li>` สามข้อ", feedback: "ul แสดงเป็นจุดนำหน้า ไม่มีหมายเลข และใช้กับรายการที่ลำดับไม่สำคัญ" }
      - { id: c, text: "`<p>` สามย่อหน้าที่พิมพ์ตัวเลขเอง", feedback: "แสดงคล้ายกันได้ แต่โปรแกรมอ่านหน้าจอจะไม่รู้ว่าเป็นรายการ และต้องแก้เลขเองทุกครั้งที่แทรกขั้นตอน" }
      - { id: d, text: "`<h1>` สามบรรทัด", feedback: "h1 ใช้กับหัวเรื่อง ไม่ใช่ข้อในรายการ และจะแสดงเป็นตัวใหญ่" }
    hints:
      - "ขั้นตอนล้างมือต้องทำตามลำดับหรือไม่"
      - "รายการแบบมีลำดับ (ordered list) ใส่หมายเลขให้อัตโนมัติ"
    solution: "ขั้นตอนต้องทำตามลำดับ จึงควรใช้ ol (ordered list) ซึ่งเบราว์เซอร์ใส่หมายเลขให้เอง แต่ละขั้นอยู่ใน li ถ้าแทรกขั้นใหม่ หมายเลขจะเลื่อนให้อัตโนมัติ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.web.html-css.p005
    topics: [computer.web.html-css]
    difficulty: 2
    type: match
    stem: "จับคู่ตัวเลือก CSS กับสิ่งที่ถูกเลือก"
    pairs:
      - { left: "p", right: "ทุกย่อหน้าในหน้า" }
      - { left: ".note", right: "ทุกอิลิเมนต์ที่มี class=\"note\"" }
      - { left: "#menu", right: "อิลิเมนต์เดียวที่มี id=\"menu\"" }
    hints:
      - "จุดนำหน้าหมายถึงคลาส เครื่องหมาย # หมายถึงไอดี"
      - "ไม่มีเครื่องหมายนำหน้าหมายถึงชื่อแท็ก"
    solution: "p เลือกตามชื่อแท็ก .note เลือกตามคลาส (ใช้ซ้ำได้หลายอิลิเมนต์) #menu เลือกตามไอดี (ไม่ซ้ำในหน้า)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.web.html-css.p006
    topics: [computer.web.html-css]
    difficulty: 2
    type: order
    stem: "เรียงบรรทัดให้เป็นโครงหน้าเว็บ HTML ที่ถูกต้อง"
    items:
      - "`<!DOCTYPE html>`"
      - "`<html lang=\"th\">`"
      - "`<head>`"
      - "`<title>ห้องสมุด</title>`"
      - "`</head>`"
      - "`<body>`"
      - "`</body>`"
      - "`</html>`"
    hints:
      - "บรรทัดแรกประกาศว่าเป็นเอกสาร HTML ส่วน html ครอบทั้งหมด"
      - "head มาก่อน body และ title อยู่ใน head"
    solution: "<!DOCTYPE html> → <html lang=\"th\"> → <head> → <title>ห้องสมุด</title> → </head> → <body> → </body> → </html> เนื้อหาที่แสดงบนจอจะใส่ระหว่าง <body> กับ </body>"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.web.html-css.p007
    topics: [computer.web.html-css]
    difficulty: 3
    type: numeric
    stem: "ปุ่มบนหน้าเว็บมี CSS `width: 150px; padding: 12px; border: 3px solid; margin: 10px;` ปุ่มนี้ใช้ความกว้างบนหน้าทั้งหมดกี่พิกเซล (รวม margin ทั้งสองข้าง)"
    answer: { value: 200, unit: px }
    hints:
      - "width วัดเฉพาะส่วนเนื้อหา"
      - "padding border และ margin มีทั้งซ้ายและขวา จึงคูณ 2"
    misconceptions:
      - { match: 175, feedback: "บวก padding border margin เพียงข้างเดียว ต้องคิดทั้งซ้ายและขวา" }
      - { match: 180, feedback: "ลืมรวม margin ซึ่งเป็นระยะว่างรอบกล่องที่ยังใช้พื้นที่บนหน้า" }
    solution: "150 + 2 × (12 + 3 + 10) = 150 + 50 = 200 px (ส่วนที่มองเห็นถึงเส้นขอบกว้าง 150 + 2 × 15 = 180 px)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.web.html-css.p008
    topics: [computer.web.html-css]
    difficulty: 3
    type: mcq
    stem: |
      ย่อหน้า `<p class="note">อ่านด่วน</p>` จะเป็นสีอะไร

      ```css
      .note { color: green; }
      p { color: black; }
      ```
    choices:
      - { id: a, text: "สีเขียว", correct: true }
      - { id: b, text: "สีดำ เพราะกฎของ p เขียนทีหลัง", feedback: "กฎที่เขียนทีหลังชนะเฉพาะเมื่อตัวเลือกเจาะจงเท่ากัน ตัวเลือกคลาสเจาะจงกว่าชื่อแท็ก" }
      - { id: c, text: "สีเขียวปนดำ", feedback: "ค่า color ของอิลิเมนต์มีได้ค่าเดียว เบราว์เซอร์เลือกจากกฎที่ชนะ" }
      - { id: d, text: "ไม่มีสี เพราะกฎขัดกัน", feedback: "กฎที่ขัดกันไม่ได้ยกเลิกกัน เบราว์เซอร์มีกติกาตัดสินว่ากฎใดชนะ" }
    hints:
      - "ทั้งสองกฎใช้กับย่อหน้านี้ ต้องดูว่ากฎใดชนะ"
      - "ความเจาะจง: ไอดี > คลาส > ชื่อแท็ก ลำดับที่เขียนใช้ตัดสินเมื่อเจาะจงเท่ากันเท่านั้น"
    solution: "ตัวเลือก .note (คลาส) เจาะจงกว่า p (ชื่อแท็ก) จึงชนะแม้เขียนก่อน ย่อหน้าจึงเป็นสีเขียว ย่อหน้าอื่นที่ไม่มีคลาส note เป็นสีดำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.web.html-css.p009
    topics: [computer.web.html-css]
    difficulty: 3
    type: mcq
    stem: "คุณป้าที่สายตาเลือนรางตั้งเบราว์เซอร์ให้ใช้ตัวอักษรขนาดใหญ่และพื้นดำตัวอักษรเหลือง เว็บแบบใดจะยังอ่านได้ครบ"
    choices:
      - { id: a, text: "เว็บที่เขียนเนื้อหาเป็นข้อความใน HTML และกำหนดหน้าตาด้วย CSS", correct: true }
      - { id: b, text: "เว็บที่ทำข้อความทั้งหมดเป็นภาพเพื่อให้ฟอนต์สวยเหมือนกันทุกเครื่อง", feedback: "ข้อความในภาพเปลี่ยนสีหรือขนาดตามที่ผู้ใช้ตั้งไม่ได้ ขยายแล้วแตก และโปรแกรมอ่านหน้าจออ่านไม่ได้" }
      - { id: c, text: "เว็บที่ใส่สีและขนาดลงในทุกแท็กโดยตรงและบังคับไม่ให้เปลี่ยน", feedback: "การผูกหน้าตาไว้กับเนื้อหาทำให้ผู้ใช้ปรับให้เหมาะกับตัวเองได้ยาก" }
      - { id: d, text: "เว็บที่ใช้ h1 กับทุกข้อความเพื่อให้ตัวใหญ่", feedback: "ตัวใหญ่ขึ้นจริง แต่โครงสร้างผิด โปรแกรมอ่านหน้าจอจะเห็นทุกบรรทัดเป็นหัวเรื่อง" }
    hints:
      - "ผู้ใช้เปลี่ยนการแสดงผลได้ก็ต่อเมื่อเนื้อหาไม่ได้ผูกติดกับหน้าตา"
      - "ข้อความที่เป็นภาพเปลี่ยนสีไม่ได้"
    solution: "เมื่อเนื้อหาเป็นข้อความที่มีโครงสร้าง และหน้าตาแยกอยู่ใน CSS เบราว์เซอร์จึงแทนการแสดงผลด้วยการตั้งค่าของผู้ใช้ได้โดยเนื้อหาไม่เสีย นี่คือเหตุผลด้านการเข้าถึงของการแยกโครงสร้างกับการแสดงผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.web.html-css.p010
    topics: [computer.web.html-css]
    difficulty: 2
    type: text
    stem: "ในแท็ก img แอตทริบิวต์ใดใช้ใส่ข้อความบอกสิ่งที่ภาพสื่อ ให้โปรแกรมอ่านหน้าจออ่านแทนภาพ (ตอบชื่อแอตทริบิวต์)"
    accepted: ["alt"]
    misconceptions:
      - { match: "src", feedback: "src บอกตำแหน่งไฟล์ภาพ ไม่ใช่ข้อความบรรยายภาพ" }
      - { match: "title", feedback: "title แสดงเป็นป้ายเมื่อชี้เมาส์ ข้อความแทนภาพมีแอตทริบิวต์เฉพาะ" }
    hints:
      - "ย่อมาจาก alternative text"
      - "มีสามตัวอักษร"
    solution: "alt เช่น <img src=\"stadium.jpg\" alt=\"สนามกลางของโรงเรียนมีลู่วิ่งสีแดงล้อมสนามหญ้า\"> ถ้าภาพโหลดไม่ขึ้น เบราว์เซอร์ก็แสดงข้อความนี้แทน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.web.html-css.p011
    topics: [computer.web.html-css]
    difficulty: 4
    type: mcq
    stem: |
      นักเรียนอยากให้หัวเรื่องเป็นสีแดงตัวขนาด 30px จึงเขียน CSS นี้ แต่หัวเรื่องยังเป็นสีดำและขนาดเท่าเดิม เพราะอะไร

      ```css
      h1 { color: red font-size: 30px; }
      ```
    choices:
      - { id: a, text: "ขาด ; หลัง red ทำให้ค่า color อ่านเป็น red font-size: 30px ซึ่งไม่ถูกต้อง เบราว์เซอร์จึงทิ้งการประกาศนี้ทั้งก้อน", correct: true }
      - { id: b, text: "ต้องเขียน font-size ก่อน color", feedback: "ลำดับการประกาศในกฎเดียวกันไม่สำคัญ ปัญหาอยู่ที่เครื่องหมายคั่น" }
      - { id: c, text: "ชื่อสี red ใช้ใน CSS ไม่ได้ ต้องเป็นรหัสสี", feedback: "red เป็นชื่อสีที่ CSS รู้จัก ใช้ได้" }
      - { id: d, text: "h1 ต้องเขียนเป็น .h1", feedback: ".h1 จะเลือกอิลิเมนต์ที่มีคลาส h1 ซึ่งไม่ใช่สิ่งที่ต้องการ การเลือกตามชื่อแท็กไม่ใส่จุด" }
    hints:
      - "การประกาศแต่ละข้อใน CSS คั่นด้วยเครื่องหมายใด"
      - "ถ้าค่าที่อ่านได้ไม่ถูกต้อง เบราว์เซอร์จะทำอย่างไรกับการประกาศนั้น"
    solution: "การประกาศคั่นด้วย ; เมื่อขาด ; เบราว์เซอร์อ่านถึง ; ตัวถัดไปเป็นการประกาศเดียว คือ color: red font-size: 30px ซึ่งไม่ใช่ค่าสีที่ถูกต้อง จึงทิ้งทั้งหมด ทั้งสีและขนาดจึงไม่เปลี่ยน แก้เป็น h1 { color: red; font-size: 30px; }"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.web.html-css.p012
    topics: [computer.web.html-css]
    difficulty: 4
    type: mcq
    stem: "หน้าเว็บร้านขนมเขียนชื่อสินค้าทุกชิ้นด้วย `<h1>` เพราะอยากให้ตัวใหญ่ ข้อใดเป็นการแก้ที่ดีที่สุด"
    choices:
      - { id: a, text: "ใช้ h1 กับชื่อร้านเพียงที่เดียว ชื่อสินค้าใช้ h2 หรือ p ตามความหมาย แล้วกำหนดขนาดตัวอักษรด้วย CSS", correct: true }
      - { id: b, text: "เปลี่ยนชื่อสินค้าทั้งหมดเป็นภาพตัวอักษรขนาดใหญ่", feedback: "ข้อความในภาพอ่านด้วยโปรแกรมอ่านหน้าจอไม่ได้ ค้นหาไม่เจอ และแก้ยาก" }
      - { id: c, text: "คงไว้แบบเดิม เพราะหน้าตาออกมาตามที่ต้องการแล้ว", feedback: "หน้าตาถูก แต่โครงสร้างผิด ผู้ใช้โปรแกรมอ่านหน้าจอจะได้ยินหัวเรื่องระดับ 1 นับสิบ และเครื่องมือค้นหาไม่รู้ว่าอะไรสำคัญ" }
      - { id: d, text: "เปลี่ยนเป็น h6 ทั้งหมด", feedback: "ยังเลือกแท็กหัวเรื่องโดยไม่ดูความหมาย และ h6 แสดงผลเป็นตัวเล็ก" }
    hints:
      - "เลือกแท็กตามความหมาย ไม่ใช่ตามหน้าตา"
      - "ขนาดตัวอักษรเป็นเรื่องของการแสดงผล"
    solution: "h1 คือหัวเรื่องสำคัญที่สุดของหน้า ซึ่งควรมีหนึ่งเดียว ชื่อสินค้าเป็นหัวเรื่องย่อย จึงใช้ h2 แล้วกำหนดขนาดด้วย CSS เช่น h2 { font-size: 28px; } โครงสร้างถูกและหน้าตาก็ได้ตามต้องการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.web.html-css.p013
    topics: [computer.web.html-css]
    difficulty: 4
    type: numeric
    stem: |
      กฎ `.sale { color: red; }` ทำให้ข้อความกี่รายการในโค้ดนี้เป็นสีแดง

      ```html
      <ul>
        <li class="sale">ปากกา</li>
        <li>ดินสอ</li>
        <li class="sale new">ยางลบ</li>
        <li class="new">ไม้บรรทัด</li>
      </ul>
      <p class="sale">ลดราคาถึงสิ้นเดือน</p>
      ```
    answer: { value: 3, unit: รายการ }
    hints:
      - ".sale เลือกทุกอิลิเมนต์ที่มีคลาส sale ไม่ว่าจะเป็นแท็กอะไร"
      - "class=\"sale new\" มีสองคลาส คือ sale และ new"
    misconceptions:
      - { match: 2, feedback: "นับเฉพาะ li ตัวเลือก .sale ไม่ได้จำกัดชื่อแท็ก ย่อหน้าที่มีคลาส sale ก็ถูกเลือกด้วย (ถ้าต้องการเฉพาะ li ต้องเขียน li.sale)" }
      - { match: 1, feedback: "class=\"sale new\" แปลว่ามีทั้งคลาส sale และ new จึงถูกเลือกด้วย" }
    solution: "อิลิเมนต์ที่มีคลาส sale คือ ปากกา ยางลบ (มีสองคลาส sale กับ new) และย่อหน้า ลดราคาถึงสิ้นเดือน รวม 3 รายการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.web.html-css.p014
    topics: [computer.web.html-css]
    difficulty: 4
    type: mcq
    stem: "หน้า `https://school.example/club/index.html` มีลิงก์ `<a href=\"photos/day1.html\">` เมื่อกดลิงก์ เบราว์เซอร์จะไปที่อยู่ใด"
    choices:
      - { id: a, text: "https://school.example/club/photos/day1.html", correct: true }
      - { id: b, text: "https://school.example/photos/day1.html", feedback: "นี่คือผลของ /photos/day1.html (ขึ้นต้นด้วย /) ซึ่งเริ่มจากรากของโดเมน ที่อยู่สัมพัทธ์ที่ไม่มี / นำหน้าเริ่มจากโฟลเดอร์ของหน้าปัจจุบัน" }
      - { id: c, text: "https://photos/day1.html", feedback: "photos ไม่ใช่ชื่อโดเมน ที่อยู่สัมพัทธ์ยังอยู่ในโดเมนเดิม" }
      - { id: d, text: "https://school.example/club/index.html/photos/day1.html", feedback: "index.html เป็นไฟล์ ไม่ใช่โฟลเดอร์ เบราว์เซอร์ตัดชื่อไฟล์ออกก่อนแล้วต่อท้ายโฟลเดอร์" }
    hints:
      - "ที่อยู่สัมพัทธ์อ้างจากโฟลเดอร์ของหน้าปัจจุบัน"
      - "หน้าปัจจุบันอยู่ในโฟลเดอร์ใด"
    solution: "หน้าปัจจุบันอยู่ในโฟลเดอร์ https://school.example/club/ ต่อด้วย photos/day1.html ได้ https://school.example/club/photos/day1.html ข้อดีของที่อยู่สัมพัทธ์คือย้ายทั้งเว็บไปโดเมนอื่นได้โดยไม่ต้องแก้ลิงก์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.web.html-css.p015
    topics: [computer.web.html-css]
    difficulty: 5
    type: numeric
    stem: "พื้นที่หน้าเว็บกว้าง 720 px ต้องวางการ์ดสองใบข้างกัน การ์ดแต่ละใบมี `width: 300px; padding: 20px; border: 2px solid;` ค่า margin (ทุกด้านเท่ากัน หน่วย px เป็นจำนวนเต็ม) มากที่สุดเท่าใดที่การ์ดทั้งสองยังอยู่บรรทัดเดียวกัน"
    answer: { value: 8, unit: px }
    hints:
      - "ความกว้างรวมของการ์ดหนึ่งใบ = 300 + 2 × (20 + 2 + m)"
      - "สองใบต้องไม่เกิน 720 px ตั้งอสมการแล้วแก้หา m"
    misconceptions:
      - { match: 16, feedback: "คิด margin เพียงข้างเดียวต่อการ์ด แต่การ์ดแต่ละใบมี margin ทั้งซ้ายและขวา" }
      - { match: 30, feedback: "ลืมคิด padding และ border ซึ่งกินพื้นที่ใบละ 2 × 22 = 44 px" }
    solution: "2 × (300 + 2 × (22 + m)) ≤ 720 → 2 × (344 + 2m) ≤ 720 → 688 + 4m ≤ 720 → m ≤ 8 ใช้ margin ได้มากที่สุด 8 px (รวม 720 px พอดี)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.web.html-css.p016
    topics: [computer.web.html-css]
    difficulty: 5
    type: mcq
    stem: "เว็บข่าวมี 3,000 หน้า เดิมใส่สีและขนาดไว้ในทุกแท็กของทุกหน้า วันนี้ต้องการเพิ่มโหมดมืด (พื้นดำ ตัวอักษรสว่าง) และหน้าแบบสำหรับจอโทรศัพท์ ข้อใดอธิบายได้ดีที่สุดว่าทำไมการแทนเอกสารเป็นเนื้อหา โครงสร้าง และการแสดงผลแยกกัน จึงสำคัญในงานนี้"
    choices:
      - { id: a, text: "ถ้าย้ายหน้าตาไปไว้ในไฟล์ CSS ไม่กี่ไฟล์ จะสร้างโหมดมืดและแบบจอโทรศัพท์ได้โดยเพิ่ม CSS ชุดใหม่ ไม่ต้องแก้เนื้อหาและโครงสร้างของทั้ง 3,000 หน้า และโครงสร้างเดิมยังใช้กับโปรแกรมอ่านหน้าจอได้", correct: true }
      - { id: b, text: "การแยกทำให้หน้าเว็บโหลดเร็วขึ้นเท่านั้น ไม่เกี่ยวกับการเพิ่มโหมดมืด", feedback: "การแยกช่วยให้นำไฟล์ CSS ไปใช้ซ้ำได้จริง แต่ประโยชน์หลักในงานนี้คือแก้หน้าตาทั้งเว็บได้จากที่เดียว" }
      - { id: c, text: "ไม่จำเป็นต้องแยก แค่ทำภาพหน้าจอของทุกหน้าไว้สองแบบ", feedback: "ภาพหน้าจอ 6,000 ภาพแก้ไม่ได้ ค้นหาไม่ได้ และอ่านด้วยโปรแกรมอ่านหน้าจอไม่ได้" }
      - { id: d, text: "ต้องเขียน HTML ใหม่ทั้ง 3,000 หน้าทุกครั้งที่เพิ่มรูปแบบการแสดงผล", feedback: "ถ้าแยกการแสดงผลออกไปแล้ว ไม่ต้องแก้ HTML เลย" }
    hints:
      - "โหมดมืดและหน้าจอโทรศัพท์เปลี่ยนชั้นใดของเอกสาร"
      - "ถ้าหน้าตาอยู่ปนในทุกหน้า ต้องแก้กี่ที่"
    solution: "โหมดมืดและแบบจอโทรศัพท์เปลี่ยนเฉพาะการแสดงผล ถ้าการแสดงผลแยกอยู่ใน CSS ก็เพิ่ม CSS ชุดใหม่ได้โดยเนื้อหาและโครงสร้างคงเดิม ส่วนโครงสร้างที่ถูกต้องยังช่วยการเข้าถึงและเครื่องมือค้นหา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.web.html-css.p017
    topics: [computer.web.html-css]
    difficulty: 5
    type: mcq
    multiple: true
    stem: |
      หน้าเว็บนี้มีจุดที่ควรแก้ด้านโครงสร้างและการเข้าถึงข้อใดบ้าง (เลือกทุกข้อที่ถูก)

      ```html
      <h1>ตลาดนัดชุมชน</h1>
      <h1>เปิดทุกวันเสาร์</h1>
      <p>แผนที่ <img src="map.png"></p>
      <p>ดูร้านค้า <a href="shops.html">คลิกที่นี่</p></a>
      ```
    choices:
      - { id: a, text: "มี h1 สองตัว บรรทัด เปิดทุกวันเสาร์ ควรเป็นย่อหน้าหรือหัวเรื่องย่อย", correct: true }
      - { id: b, text: "ภาพแผนที่ไม่มี alt", correct: true }
      - { id: c, text: "แท็ก a กับ p ปิดสลับลำดับ ต้องปิด a ก่อน p", correct: true }
      - { id: d, text: "ข้อความลิงก์ คลิกที่นี่ ไม่บอกว่ากดแล้วไปไหน", correct: true }
      - { id: e, text: "img ต้องมีแท็กปิด </img>", feedback: "img เป็นอิลิเมนต์ว่างที่ไม่มีแท็กปิด" }
    hints:
      - "ตรวจทีละบรรทัด: แท็กเลือกตามความหมายหรือไม่ ภาพมี alt หรือไม่ ปิดแท็กถูกลำดับหรือไม่"
      - "ผู้ใช้โปรแกรมอ่านหน้าจอมักฟังรายการลิงก์ทั้งหมดในหน้า ลิงก์ที่ชื่อ คลิกที่นี่ บอกอะไรเขาได้บ้าง"
    solution: "ควรมี h1 เดียว ภาพต้องมี alt บอกสิ่งที่แผนที่แสดง แท็กต้องปิดเป็น <a ...>...</a></p> และข้อความลิงก์ควรบอกปลายทาง เช่น รายชื่อร้านค้า ส่วน img ไม่มีแท็กปิดอยู่แล้ว"
    license: CC-BY-SA-4.0
    ai_assisted: true
