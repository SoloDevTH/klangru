    ai_assisted: true

  - id: physics.matter.elasticity.p015
    topics: [physics.matter.elasticity]
    difficulty: 5
    type: numeric
    stem: "เครนที่ไซต์ก่อสร้างยกถังปูนหนัก $20\\ \\mathrm{kN}$ ด้วยลวดสลิงเส้นเดียว ลวดชนิดนี้ขาดที่ความเค้น $4.0 \\times 10^{8}\\ \\mathrm{N/m^2}$ วิศวกรกำหนดค่าความปลอดภัย 5 (ความเค้นใช้งานไม่เกิน $\\tfrac{1}{5}$ ของความเค้นที่ทำให้ขาด) ลวดต้องมีเส้นผ่านศูนย์กลางอย่างน้อยกี่มิลลิเมตร"
    answer: { value: 17.8, tolerance: 0.2, unit: mm }
    misconceptions:
      - { match: 7.98, feedback: "ไม่ได้ใช้ค่าความปลอดภัย ลวดที่รับความเค้นเท่ากับค่าที่ทำให้ขาดพอดีจะขาดเมื่อมีแรงกระชากเพียงเล็กน้อย" }
      - { match: 8.92, feedback: "ได้รัศมีแล้วแต่ยังไม่คูณ 2 เป็นเส้นผ่านศูนย์กลาง" }
    hints:
      - "ความเค้นใช้งานสูงสุด $= \\dfrac{4.0 \\times 10^8}{5}$"
      - "พื้นที่ขั้นต่ำ = แรง ÷ ความเค้นใช้งาน แล้วใช้ $A = \\dfrac{\\pi d^2}{4}$ หา $d$"
    solution: "ความเค้นใช้งาน $= 8.0 \\times 10^{7}\\ \\mathrm{N/m^2}$ พื้นที่ขั้นต่ำ $A = \\dfrac{2.0 \\times 10^{4}}{8.0 \\times 10^{7}} = 2.5 \\times 10^{-4}\\ \\mathrm{m^2}$ จาก $A = \\dfrac{\\pi d^2}{4}$ ได้ $d = \\sqrt{\\dfrac{4(2.5 \\times 10^{-4})}{\\pi}} = 0.0178\\ \\mathrm{m} \\approx 17.8\\ \\mathrm{mm}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.matter.elasticity.p016
    topics: [physics.matter.elasticity]
    difficulty: 5
    type: numeric
    stem: "ลวดเหล็กกล้า ($Y = 2.0 \\times 10^{11}\\ \\mathrm{N/m^2}$) ยาว $2.0\\ \\mathrm{m}$ พื้นที่หน้าตัด $1.0 \\times 10^{-6}\\ \\mathrm{m^2}$ ถูกดึงด้วยแรงที่ค่อย ๆ เพิ่มจาก 0 ถึง $200\\ \\mathrm{N}$ (ยังอยู่ในช่วงแปรผันตรง) พลังงานศักย์ยืดหยุ่นที่สะสมในลวดเป็นเท่าใด (ตอบในหน่วย J)"
    answer: { value: 0.2, tolerance: 0.005, unit: J }
    misconceptions:
      - { match: 0.4, feedback: "ใช้ $F \\times \\Delta L$ ซึ่งถือว่าแรงคงที่ $200\\ \\mathrm{N}$ ตลอด แต่แรงเพิ่มจาก 0 พลังงานคือพื้นที่สามเหลี่ยมใต้กราฟ $\\tfrac12 F\\,\\Delta L$" }
      - { match: 200, feedback: "ใช้ระยะยืดเป็นมิลลิเมตรในการคูณ ต้องแปลงเป็นเมตรก่อน" }
    hints:
      - "หาระยะยืดจาก $\\Delta L = \\dfrac{F L_0}{A Y}$ ก่อน"
      - "พลังงานคือพื้นที่ใต้กราฟแรงกับระยะยืด ซึ่งเป็นรูปสามเหลี่ยม"
    solution: "$\\Delta L = \\dfrac{(200)(2.0)}{(1.0 \\times 10^{-6})(2.0 \\times 10^{11})} = 2.0 \\times 10^{-3}\\ \\mathrm{m}$ พลังงาน $= \\tfrac12 F\\,\\Delta L = \\tfrac12 (200)(2.0 \\times 10^{-3}) = 0.20\\ \\mathrm{J}$"
