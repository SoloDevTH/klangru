problems:
  - id: physics.dynamics.free-body-practice.p001
    topics: [physics.dynamics.free-body-practice]
    difficulty: 1
    type: mcq
    stem: "ในแผนภาพแรง ลูกศรแทนน้ำหนักของวัตถุชี้ไปทางใดเสมอ"
    choices:
      - { id: a, text: "ชี้ลงในแนวดิ่ง (เข้าหาโลก)", correct: true }
      - { id: b, text: "ชี้ไปทางที่วัตถุเคลื่อนที่", feedback: "น้ำหนักเกิดจากโลกดึงวัตถุ จึงชี้ลงเสมอ ไม่ขึ้นกับทิศการเคลื่อนที่" }
      - { id: c, text: "ตั้งฉากกับพื้นที่วัตถุวางอยู่", feedback: "แรงที่ตั้งฉากกับพื้นคือแรงปฏิกิริยาตั้งฉาก ถ้าพื้นเอียง น้ำหนักยังชี้ลงในแนวดิ่ง" }
    hints:
      - "น้ำหนักคือแรงที่อะไรกระทำต่อวัตถุ"
      - "โลกดึงวัตถุไปทางไหน"
    solution: "น้ำหนักคือแรงที่โลกดึงดูดวัตถุ จึงชี้ลงในแนวดิ่งเข้าหาโลกเสมอ ไม่ว่าวัตถุจะเคลื่อนที่อย่างไรหรือวางบนผิวแบบใด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.free-body-practice.p002
    topics: [physics.dynamics.free-body-practice]
    difficulty: 1
    type: text
    stem: "แรงที่ของเหลวดันวัตถุที่จมอยู่ให้ขึ้นข้างบน เรียกว่าแรงอะไร"
    accepted: ["แรงลอยตัว", "แรงพยุง", "ลอยตัว", "buoyant force", "buoyancy"]
    misconceptions:
      - { match: "แรงปฏิกิริยาตั้งฉาก", feedback: "แรงปฏิกิริยาตั้งฉากเกิดจากผิวของแข็งที่วัตถุแตะ แรงที่ของเหลวดันขึ้นมีชื่อเฉพาะ" }
      - { match: "แรงเสียดทาน", feedback: "แรงเสียดทานขนานกับผิวและต้านการไถล ไม่ใช่แรงที่ดันขึ้น" }
    hints:
      - "แรงนี้ทำให้เรือลอยอยู่บนน้ำได้"
      - "ชื่อแรงนี้มีคำว่า ลอย"
    solution: "แรงที่ของเหลวดันวัตถุขึ้นเรียกว่าแรงลอยตัว (แรงพยุง) มีขนาดเท่ากับน้ำหนักของของเหลวที่ถูกวัตถุแทนที่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.free-body-practice.p003
    topics: [physics.dynamics.free-body-practice]
    difficulty: 2
    type: match
    stem: "จับคู่ชื่อแรงกับทิศของแรงในแผนภาพแรง"
    pairs:
      - { left: "น้ำหนัก", right: "ชี้ลงในแนวดิ่งเสมอ" }
      - { left: "แรงปฏิกิริยาตั้งฉาก", right: "ตั้งฉากกับผิวสัมผัส ดันออกจากผิว" }
      - { left: "แรงเสียดทาน", right: "ขนานกับผิว ต้านการไถลหรือแนวโน้มที่จะไถล" }
      - { left: "แรงลอยตัว", right: "ชี้ขึ้น เกิดจากของเหลวรอบวัตถุ" }
      - { left: "แรงตึงเชือก", right: "ตามแนวเชือก ดึงออกจากวัตถุ" }
    hints:
      - "แรงใดเกิดจากผิวของแข็ง แรงใดเกิดจากของเหลว แรงใดเกิดจากเชือก"
      - "แรงจากผิวมีสองแรง แรงหนึ่งตั้งฉาก อีกแรงขนานกับผิว"
    solution: "น้ำหนักชี้ลง แรงปฏิกิริยาตั้งฉากตั้งฉากกับผิว แรงเสียดทานขนานกับผิว แรงลอยตัวชี้ขึ้น และแรงตึงเชือกอยู่ตามแนวเชือก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.free-body-practice.p004
    topics: [physics.dynamics.free-body-practice]
    difficulty: 2
    type: numeric
    stem: "พ่อค้าสองคนช่วยกันเข็นรถเข็นขายผลไม้ไปทางขวา คนหนึ่งออกแรง $40\\ \\mathrm{N}$ อีกคน $25\\ \\mathrm{N}$ ทั้งสองแรงไปทางขวา แรงเสียดทาน $15\\ \\mathrm{N}$ แรงลัพธ์ในแนวระดับมีขนาดเท่าใด (ตอบในหน่วย N)"
    answer: { value: 50, unit: N }
    misconceptions:
      - { match: 80, feedback: "บวกแรงเสียดทานเข้าไปด้วย แรงเสียดทานมีทิศตรงข้าม ต้องลบ" }
      - { match: 30, feedback: "ดูเหมือนคิดว่าแรงของสองคนสวนทางกัน ทั้งสองคนดันไปทางขวา จึงบวกกัน" }
    hints:
      - "เขียนแผนภาพแรง กำหนดทางขวาเป็นบวก"
      - "แรงที่ไปทางขวาเป็นบวก แรงไปทางซ้ายเป็นลบ แล้วรวมกัน"
    solution: "แรงลัพธ์ $= 40 + 25 - 15 = 50\\ \\mathrm{N}$ ไปทางขวา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.free-body-practice.p005
    topics: [physics.dynamics.free-body-practice]
    difficulty: 2
    type: mcq
    stem: "หนังสือวางนิ่งอยู่บนโต๊ะที่เป็นพื้นราบ แผนภาพแรงของหนังสือควรมีแรงใดบ้าง"
    choices:
      - { id: a, text: "น้ำหนักชี้ลง และแรงปฏิกิริยาตั้งฉากจากโต๊ะชี้ขึ้น ขนาดเท่ากัน", correct: true }
      - { id: b, text: "น้ำหนักชี้ลงเพียงแรงเดียว", feedback: "ถ้ามีแต่น้ำหนัก หนังสือจะตกลง โต๊ะที่แตะหนังสืออยู่ต้องดันขึ้นด้วย" }
      - { id: c, text: "น้ำหนัก แรงปฏิกิริยาตั้งฉาก และแรงเสียดทาน", feedback: "หนังสือบนพื้นราบที่ไม่มีแรงอื่นมาผลัก ไม่มีแนวโน้มจะไถล จึงไม่มีแรงเสียดทาน" }
    hints:
      - "มีอะไรแตะหนังสืออยู่บ้าง"
      - "หนังสืออยู่นิ่ง แรงลัพธ์ต้องเป็นเท่าใด"
    solution: "หนังสือมีน้ำหนัก (โลกดึง) และแรงปฏิกิริยาตั้งฉาก (โต๊ะดัน) สองแรงนี้สมดุลกันเพราะหนังสืออยู่นิ่ง ไม่มีแรงเสียดทานเพราะไม่มีแรงในแนวระดับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.free-body-practice.p006
    topics: [physics.dynamics.free-body-practice]
    difficulty: 3
    type: mcq
    stem: "กล่องไถลไปทางขวาบนพื้นแล้วค่อย ๆ ช้าลง โดยไม่มีใครผลัก แผนภาพแรงใดถูกต้อง"
    figure: { src: p-which-fbd.svg, alt: "แผนภาพแรงสามแบบของกล่อง ทุกแบบมีน้ำหนัก W ชี้ลงและแรงปฏิกิริยาตั้งฉาก N ชี้ขึ้น ยาวเท่ากัน แบบ ก มีแรงเสียดทาน f ชี้ไปทางซ้าย แบบ ข มีแรงเสียดทาน f ชี้ไปทางซ้าย และมีลูกศรสีเขียวชื่อแรงเคลื่อนที่ชี้ไปทางขวา แบบ ค มีแรงเสียดทาน f ชี้ไปทางขวา ใต้ภาพเขียนว่ากล่องกำลังไถลไปทางขวา" }
    choices:
      - { id: a, text: "แบบ ก", correct: true }
      - { id: b, text: "แบบ ข", feedback: "ไม่มีสิ่งใดผลักกล่องไปทางขวา \"แรงเคลื่อนที่\" จึงไม่มีจริง กล่องเคลื่อนที่ต่อไปได้เพราะความเฉื่อย" }
      - { id: c, text: "แบบ ค", feedback: "แรงเสียดทานต้านการไถล กล่องไถลไปทางขวา แรงเสียดทานจึงชี้ไปทางซ้าย" }
    hints:
      - "มีอะไรแตะกล่องบ้าง และมีใครผลักกล่องหรือไม่"
      - "กล่องช้าลง แรงลัพธ์ชี้ไปทางเดียวกับหรือตรงข้ามกับการเคลื่อนที่"
    solution: "กล่องมีน้ำหนัก แรงปฏิกิริยาตั้งฉาก และแรงเสียดทานที่ชี้ไปทางซ้าย (ตรงข้ามการไถล) เป็นแรงลัพธ์ที่ทำให้กล่องช้าลง แบบ ก จึงถูก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.free-body-practice.p007
    topics: [physics.dynamics.free-body-practice]
    difficulty: 3
    type: numeric
    stem: "แผนภาพแรงของกล่องมวล $8\\ \\mathrm{kg}$ บนพื้นราบเป็นดังภาพ กล่องมีความเร่งเท่าใด (ตอบในหน่วย m/s²)"
    figure: { src: p-fbd-numbers.svg, alt: "แผนภาพแรงของกล่อง น้ำหนัก W = 78.4 N ชี้ลง แรงปฏิกิริยาตั้งฉาก N = 78.4 N ชี้ขึ้น แรง F = 50 N ชี้ไปทางขวา และแรงเสียดทาน f = 20 N ชี้ไปทางซ้าย ความยาวลูกศรเป็นสัดส่วนกับขนาดแรง" }
    answer: { value: 3.75, tolerance: 0.04, unit: m/s² }
    misconceptions:
      - { match: 6.25, feedback: "ใช้แรง $50\\ \\mathrm{N}$ อย่างเดียว ต้องหักแรงเสียดทานก่อน ความเร่งเกิดจากแรงลัพธ์" }
      - { match: 8.75, feedback: "บวกแรงเสียดทานเข้าไป แรงเสียดทานมีทิศตรงข้ามกับแรง $F$ ต้องลบ" }
    hints:
      - "แนวดิ่งสมดุลกันแล้ว ดูเฉพาะแนวระดับ"
      - "แรงลัพธ์แนวระดับหารด้วยมวล"
    solution: "แนวดิ่ง $N = W$ สมดุล แนวระดับ $\\Sigma F = 50 - 20 = 30\\ \\mathrm{N}$ ไปทางขวา $a = \\dfrac{30}{8} = 3.75\\ \\mathrm{m/s^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.free-body-practice.p008
    topics: [physics.dynamics.free-body-practice]
    difficulty: 3
    type: numeric
    stem: "แขวนก้อนหินกับเครื่องชั่งสปริงในอากาศ อ่านได้ $20\\ \\mathrm{N}$ เมื่อหย่อนก้อนหินลงจมในน้ำทั้งก้อนโดยไม่แตะก้นภาชนะ อ่านได้ $12\\ \\mathrm{N}$ แรงลอยตัวมีขนาดเท่าใด (ตอบในหน่วย N)"
    answer: { value: 8, unit: N }
    misconceptions:
      - { match: 12, feedback: "$12\\ \\mathrm{N}$ คือแรงตึงที่เครื่องชั่งอ่านได้ (น้ำหนักปรากฏ) ไม่ใช่แรงลอยตัว" }
      - { match: 32, feedback: "บวกค่าที่อ่านได้ทั้งสองครั้ง จากแผนภาพแรง $T + F_B = W$ ต้องลบ" }
    hints:
      - "เขียนแผนภาพแรงของก้อนหินในน้ำ มีแรงอะไรขึ้นและลงบ้าง"
      - "ก้อนหินนิ่ง $T + F_B = W$"
    solution: "แรงขึ้นคือ $T = 12\\ \\mathrm{N}$ และ $F_B$ แรงลงคือ $W = 20\\ \\mathrm{N}$ จาก $T + F_B = W$ ได้ $F_B = 20 - 12 = 8\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.free-body-practice.p009
    topics: [physics.dynamics.free-body-practice]
    difficulty: 3
    type: mcq
    stem: "เรือหางยาวลอยนิ่งอยู่ในคลอง ข้อใดเปรียบเทียบแรงลอยตัวกับน้ำหนักของเรือ (รวมคนและของ) ได้ถูกต้อง"
    choices:
      - { id: a, text: "แรงลอยตัวเท่ากับน้ำหนัก", correct: true }
      - { id: b, text: "แรงลอยตัวมากกว่าน้ำหนัก เรือจึงลอย", feedback: "ถ้าแรงลอยตัวมากกว่า แรงลัพธ์ชี้ขึ้น เรือจะเร่งขึ้นจากน้ำ แต่เรือลอยนิ่ง แรงลัพธ์จึงเป็นศูนย์" }
      - { id: c, text: "แรงลอยตัวน้อยกว่าน้ำหนักเล็กน้อย", feedback: "ถ้าแรงลอยตัวน้อยกว่า เรือจะจมลงเรื่อย ๆ" }
    hints:
      - "เรืออยู่นิ่ง แรงลัพธ์เป็นเท่าใด"
      - "แรงในแนวดิ่งมีน้ำหนักลงและแรงลอยตัวขึ้น"
    solution: "เรือลอยนิ่ง แรงลัพธ์เป็นศูนย์ แรงลอยตัวจึงเท่ากับน้ำหนักพอดี ถ้าบรรทุกของเพิ่ม เรือจะจมลึกขึ้นจนแทนที่น้ำมากพอให้แรงลอยตัวเท่ากับน้ำหนักใหม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.free-body-practice.p010
    topics: [physics.dynamics.free-body-practice]
    difficulty: 3
    type: mcq
    stem: "รถกระบะบรรทุกลังผักเร่งออกจากไฟแดงไปข้างหน้า ลังไม่ไถลบนพื้นกระบะ แรงเสียดทานที่พื้นกระบะกระทำต่อลังชี้ไปทางใด"
    choices:
      - { id: a, text: "ไปข้างหน้า ทิศเดียวกับความเร่งของรถ", correct: true }
      - { id: b, text: "ไปข้างหลัง เพราะแรงเสียดทานต้านการเคลื่อนที่เสมอ", feedback: "แรงเสียดทานต้านการไถลของลังเทียบกับพื้นกระบะ ลังมีแนวโน้มไถลไปท้ายรถ แรงเสียดทานจึงชี้ไปข้างหน้า" }
      - { id: c, text: "ไม่มีแรงเสียดทาน เพราะลังไม่ไถล", feedback: "ไม่ไถลไม่ได้แปลว่าไม่มีแรงเสียดทาน แรงเสียดทานสถิตกำลังทำงานอยู่ และเป็นแรงที่ทำให้ลังเร่งไปกับรถ" }
    hints:
      - "ถ้าพื้นกระบะลื่นมาก ลังจะไถลไปทางไหนเทียบกับรถ"
      - "ลังเร่งไปข้างหน้าพร้อมรถ ต้องมีแรงลัพธ์ชี้ไปทางใด"
    solution: "ลังเร่งไปข้างหน้าพร้อมรถ จึงต้องมีแรงลัพธ์ชี้ไปข้างหน้า แรงเดียวในแนวระดับคือแรงเสียดทานสถิตจากพื้นกระบะ จึงชี้ไปข้างหน้า (ต้านแนวโน้มที่ลังจะไถลไปท้ายรถ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.free-body-practice.p011
    topics: [physics.dynamics.free-body-practice]
    difficulty: 4
    type: numeric
    stem: "ลูกบอลหนัก $3\\ \\mathrm{N}$ ถูกเชือกผูกไว้กับก้นถังน้ำ ลูกบอลจมอยู่ใต้น้ำทั้งลูกและอยู่นิ่ง แรงลอยตัวเป็น $10\\ \\mathrm{N}$ แรงตึงเชือกมีขนาดเท่าใด (ตอบในหน่วย N)"
    answer: { value: 7, unit: N }
    misconceptions:
      - { match: 13, feedback: "วางแรงตึงไว้ทิศเดียวกับน้ำหนักแล้วบวก แต่ลืมว่าต้องสมดุลกับแรงลอยตัว เชือกดึงลงช่วยน้ำหนัก $F_B = W + T$" }
      - { match: 3, feedback: "แรงตึงไม่เท่ากับน้ำหนัก เขียนแผนภาพแรงก่อน มีแรงลง 2 แรงและแรงขึ้น 1 แรง" }
    hints:
      - "เชือกผูกกับก้นถัง เชือกดึงลูกบอลไปทางไหน"
      - "ลูกบอลนิ่ง แรงขึ้น = แรงลง: $F_B = W + T$"
    solution: "แรงขึ้นมีแรงลอยตัว $10\\ \\mathrm{N}$ แรงลงมีน้ำหนัก $3\\ \\mathrm{N}$ และแรงตึง $T$ (เชือกดึงลง) $10 = 3 + T$ ได้ $T = 7\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.free-body-practice.p012
    topics: [physics.dynamics.free-body-practice]
    difficulty: 4
    type: numeric
    stem: "รถบั๊มในสวนสนุกสองคันชนกัน คัน A มวลรวมคนขับ $150\\ \\mathrm{kg}$ คัน B มวลรวมคนขับ $250\\ \\mathrm{kg}$ ขณะชน A ดัน B ด้วยแรง $1500\\ \\mathrm{N}$ ขณะนั้นคัน B มีความเร่งเท่าใด (ไม่คิดแรงอื่นในแนวระดับ ตอบในหน่วย m/s²)"
    answer: { value: 6, tolerance: 0.06, unit: m/s² }
    misconceptions:
      - { match: 10, feedback: "นำแรงหารด้วยมวลของคัน A ความเร่งของ B ต้องใช้มวลของ B" }
      - { match: 3.75, feedback: "นำมวลทั้งสองคันมารวมกัน แรง $1500\\ \\mathrm{N}$ นี้กระทำต่อ B คันเดียว" }
    hints:
      - "แผนภาพแรงของ B มีแรงที่ A ดันอยู่หนึ่งแรงในแนวระดับ"
      - "$a_B = \\dfrac{F}{m_B}$"
    solution: "แรงที่กระทำต่อ B คือ $1500\\ \\mathrm{N}$ ความเร่ง $a_B = \\dfrac{1500}{250} = 6\\ \\mathrm{m/s^2}$ ส่วน B ก็ดัน A กลับด้วย $1500\\ \\mathrm{N}$ เท่ากัน A จึงมีความเร่ง $10\\ \\mathrm{m/s^2}$ ในทิศตรงข้าม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.free-body-practice.p013
    topics: [physics.dynamics.free-body-practice]
    difficulty: 4
    type: mcq
    stem: "รถยนต์ชนกับรถจักรยานยนต์ที่จอดอยู่ ข้อใดถูกต้องเกี่ยวกับแรงที่รถทั้งสองกระทำต่อกันขณะชน"
    choices:
      - { id: a, text: "แรงทั้งสองมีขนาดเท่ากัน ทิศตรงข้าม แต่รถจักรยานยนต์มีความเร่งมากกว่าเพราะมวลน้อยกว่า", correct: true }
      - { id: b, text: "รถยนต์ออกแรงต่อรถจักรยานยนต์มากกว่า เพราะรถยนต์หนักกว่า", feedback: "ตามกฎข้อที่ 3 ของนิวตัน แรงคู่นี้มีขนาดเท่ากันเสมอ ไม่ขึ้นกับมวล ที่ต่างกันคือความเร่ง" }
      - { id: c, text: "แรงทั้งสองหักล้างกัน รถทั้งสองจึงหยุดนิ่ง", feedback: "แรงคู่นี้กระทำต่อวัตถุคนละคัน จึงหักล้างกันไม่ได้ แต่ละคันมีแรงลัพธ์และเปลี่ยนการเคลื่อนที่" }
    hints:
      - "กฎข้อที่ 3 ของนิวตันบอกอะไรเกี่ยวกับแรงคู่กิริยา–ปฏิกิริยา"
      - "แรงเท่ากันกระทำต่อมวลต่างกัน ความเร่งเป็นอย่างไร"
    solution: "แรงที่รถยนต์ทำต่อรถจักรยานยนต์กับแรงที่รถจักรยานยนต์ทำต่อรถยนต์เป็นคู่กิริยา–ปฏิกิริยา ขนาดเท่ากัน ทิศตรงข้าม กระทำต่อคนละคัน รถจักรยานยนต์มวลน้อยกว่าจึงมีความเร่ง (และอันตราย) มากกว่ามาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.free-body-practice.p014
    topics: [physics.dynamics.free-body-practice]
    difficulty: 4
    type: order
    stem: "เรียงขั้นตอนการเขียนแผนภาพแรงของกล่องที่ถูกลากด้วยเชือกบนพื้น"
    items:
      - "เลือกกล่องเป็นวัตถุที่สนใจ แล้ววาดเป็นกล่องเล็ก ๆ"
      - "ใส่น้ำหนักชี้ลง"
      - "ไล่ดูสิ่งที่แตะกล่อง แล้วใส่แรงปฏิกิริยาตั้งฉาก แรงเสียดทาน และแรงตึงเชือก"
      - "ปรับความยาวลูกศรตามขนาดแรงและเขียนชื่อแรง"
      - "ตรวจว่าทุกแรงมีผู้ออกแรง แล้วรวมเป็นแรงลัพธ์"
    hints:
      - "ต้องรู้ก่อนว่ากำลังเขียนแผนภาพของวัตถุชิ้นไหน"
      - "แรงไม่สัมผัสใส่ได้เลย แรงสัมผัสต้องไล่ดูทีละจุดที่แตะ"
    solution: "เลือกวัตถุ → ใส่น้ำหนัก → ใส่แรงสัมผัสจากทุกสิ่งที่แตะ → ปรับความยาวและชื่อ → ตรวจผู้ออกแรงแล้วหาแรงลัพธ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.free-body-practice.p015
    topics: [physics.dynamics.free-body-practice]
    difficulty: 4
    type: mcq
    stem: "นักเรียนต้องการวางแผนการทดลองเพื่อแสดงว่า เมื่อแรงลัพธ์เท่าเดิม ความเร่งขึ้นกับมวลของรถทดลอง ควรทำอย่างไร"
    choices:
      - { id: a, text: "ดึงรถด้วยเครื่องชั่งสปริงให้อ่านค่าเท่าเดิมทุกครั้ง เพิ่มมวลบนรถทีละก้อน แล้ววัดความเร่ง", correct: true }
      - { id: b, text: "ใช้รถคันเดิม เพิ่มแรงดึงทีละขั้น แล้ววัดความเร่ง", feedback: "แบบนี้ศึกษาผลของแรง ไม่ใช่ผลของมวล ต้องให้แรงคงที่และเปลี่ยนมวล" }
      - { id: c, text: "เพิ่มมวลบนรถและเพิ่มแรงดึงไปพร้อมกัน", feedback: "เปลี่ยนสองอย่างพร้อมกัน จะไม่รู้ว่าความเร่งที่เปลี่ยนเกิดจากมวลหรือแรง" }
      - { id: d, text: "วางรถหลายคันที่มวลต่างกันบนพื้นต่างชนิดกัน แล้วดึงด้วยแรงเท่ากัน", feedback: "พื้นต่างชนิดทำให้แรงเสียดทานต่างกัน แรงลัพธ์จึงไม่เท่ากันแม้แรงดึงเท่ากัน" }
    hints:
      - "สิ่งที่อยากรู้ผลคือมวล จึงเป็นสิ่งเดียวที่เปลี่ยน"
      - "จะทำให้แรงลัพธ์เท่าเดิมทุกครั้งได้อย่างไร"
    solution: "ให้แรงดึงเท่าเดิม (อ่านเครื่องชั่งสปริงค่าเดิม) บนพื้นเดิม แล้วเปลี่ยนเฉพาะมวล ผลที่ควรได้คือมวลมากขึ้น ความเร่งลดลง ตาม $a = \\dfrac{\\Sigma F}{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.free-body-practice.p016
    topics: [physics.dynamics.free-body-practice]
    difficulty: 5
    type: numeric
    stem: "ลูกเหล็กหนัก $5.0\\ \\mathrm{N}$ ถูกปล่อยลงในขวดน้ำมันพืช สักพักลูกเหล็กจมลงด้วยความเร็วคงตัว แรงลอยตัวจากน้ำมันเป็น $1.2\\ \\mathrm{N}$ แรงต้านของน้ำมันขณะนั้นมีขนาดเท่าใด (ตอบในหน่วย N)"
    answer: { value: 3.8, tolerance: 0.04, unit: N }
    misconceptions:
      - { match: 6.2, feedback: "วางแรงต้านไว้ทิศเดียวกับน้ำหนัก แรงต้านตรงข้ามกับการเคลื่อนที่ ลูกเหล็กจมลง แรงต้านจึงชี้ขึ้น" }
      - { match: 5, feedback: "ลืมแรงลอยตัว น้ำมันดันขึ้นด้วยแรงลอยตัวอีกแรงหนึ่ง" }
    hints:
      - "ความเร็วคงตัวแปลว่าแรงลัพธ์เป็นศูนย์"
      - "แรงขึ้นมีแรงลอยตัวและแรงต้าน แรงลงมีน้ำหนัก"
    solution: "ความเร็วคงตัว แรงลัพธ์เป็นศูนย์ $F_B + F_{\\text{ต้าน}} = W$ ได้ $F_{\\text{ต้าน}} = 5.0 - 1.2 = 3.8\\ \\mathrm{N}$ ชี้ขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.free-body-practice.p017
    topics: [physics.dynamics.free-body-practice]
    difficulty: 5
    type: numeric
    stem: "ผลักลังมวล $25\\ \\mathrm{kg}$ บนพื้นโกดังด้วยแรง $150\\ \\mathrm{N}$ ตามแนวระดับ สัมประสิทธิ์ความเสียดทานจลน์ $0.40$ ลังมีความเร่งเท่าใด (ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ ตอบในหน่วย m/s²)"
    answer: { value: 2.08, tolerance: 0.03, unit: m/s² }
    misconceptions:
      - { match: 6, feedback: "ลืมแรงเสียดทาน ความเร่งเกิดจากแรงลัพธ์ ไม่ใช่แรงผลักอย่างเดียว" }
      - { match: 5.6, feedback: "คิดแรงเสียดทานเป็น $\\mu m$ ลืมคูณ $g$ แรงเสียดทาน $= \\mu N = \\mu mg$" }
    hints:
      - "แนวดิ่งสมดุล $N = mg$ แล้วหา $f = \\mu_k N$"
      - "แรงลัพธ์แนวระดับ = แรงผลัก − แรงเสียดทาน แล้วหารด้วยมวล"
    solution: "$N = (25)(9.8) = 245\\ \\mathrm{N}$, $f = 0.40 \\times 245 = 98\\ \\mathrm{N}$ แรงลัพธ์ $150 - 98 = 52\\ \\mathrm{N}$ ได้ $a = \\dfrac{52}{25} = 2.08\\ \\mathrm{m/s^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.free-body-practice.p018
    topics: [physics.dynamics.free-body-practice]
    difficulty: 5
    type: numeric
    stem: "ใช้มือกดก้อนไม้ปริมาตร $0.0020\\ \\mathrm{m^3}$ ความหนาแน่น $600\\ \\mathrm{kg/m^3}$ ให้จมอยู่ใต้น้ำทั้งก้อนและอยู่นิ่ง (น้ำความหนาแน่น $1000\\ \\mathrm{kg/m^3}$, $g = 9.8\\ \\mathrm{m/s^2}$) มือต้องออกแรงกดเท่าใด (ตอบในหน่วย N)"
    answer: { value: 7.84, tolerance: 0.08, unit: N }
    misconceptions:
      - { match: 19.6, feedback: "$19.6\\ \\mathrm{N}$ คือแรงลอยตัว ยังต้องหักน้ำหนักของไม้ที่ช่วยกดลงอยู่แล้ว" }
      - { match: 31.36, feedback: "บวกน้ำหนักไม้กับแรงลอยตัว น้ำหนักไม้ชี้ลงทางเดียวกับแรงกด จึงช่วยกด ไม่ได้ต้าน" }
    hints:
      - "หาน้ำหนักไม้ $W = \\rho_{\\text{ไม้}} V g$ และแรงลอยตัว $F_B = \\rho_{\\text{น้ำ}} V g$"
      - "แผนภาพแรง: ขึ้นมี $F_B$ ลงมี $W$ และแรงกดของมือ"
    solution: "$W = (600)(0.0020)(9.8) = 11.76\\ \\mathrm{N}$, $F_B = (1000)(0.0020)(9.8) = 19.6\\ \\mathrm{N}$ ไม้นิ่ง $F_B = W + F_{\\text{มือ}}$ ได้ $F_{\\text{มือ}} = 19.6 - 11.76 = 7.84\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.dynamics.free-body-practice.p019
    topics: [physics.dynamics.free-body-practice]
    difficulty: 5
    type: mcq
    stem: "นักเรียนออกแบบกันชนให้รถทดลองที่จะวิ่งชนผนัง เพื่อให้ไข่ที่วางบนรถไม่แตก การออกแบบใดดีที่สุดและให้เหตุผลถูกต้อง"
    choices:
      - { id: a, text: "ติดฟองน้ำหนา ๆ ที่หน้ารถ เพราะยืดเวลาที่รถหยุด แรงที่ผนังกับรถกระทำต่อกันจึงลดลง", correct: true }
      - { id: b, text: "ติดแผ่นเหล็กแข็งที่หน้ารถ เพราะผนังจะออกแรงต่อรถน้อยกว่าที่รถออกแรงต่อผนัง", feedback: "ตามกฎข้อที่ 3 แรงคู่นี้เท่ากันเสมอ และวัสดุแข็งทำให้หยุดเร็ว แรงจึงมากขึ้น" }
      - { id: c, text: "ติดฟองน้ำที่ผนังแทนรถ เพราะแรงคู่กิริยา–ปฏิกิริยาจะไม่เท่ากันอีก", feedback: "ติดที่ผนังก็ช่วยยืดเวลาชนได้ แต่เหตุผลผิด แรงคู่นี้เท่ากันเสมอไม่ว่าติดฟองน้ำไว้ที่ใด" }
    hints:
      - "รถต้องเปลี่ยนความเร็วจากค่าหนึ่งเป็นศูนย์ ถ้าใช้เวลานานขึ้น ความเร่ง (และแรง) เป็นอย่างไร"
      - "แรงที่รถกับผนังกระทำต่อกันเท่ากันเสมอ ที่เปลี่ยนได้คือขนาดของแรงคู่นั้น"
    solution: "ฟองน้ำยุบตัวทำให้รถใช้เวลาหยุดนานขึ้น ความเร่งลดลง แรงที่ผนังกับรถกระทำต่อกันจึงลดลงทั้งคู่ (ยังเท่ากันตามกฎข้อที่ 3) ไข่จึงได้รับแรงน้อยลง"
    license: CC-BY-SA-4.0
    ai_assisted: true
