    accepted: ["อัลตราโซนิก", "อัลตร้าโซนิก", "คลื่นอัลตราโซนิก", "เสียงอัลตราโซนิก", "อัลตราซาวด์", "อัลตร้าซาวด์", "ultrasonic", "ultrasound", "คลื่นเหนือเสียง", "คลื่นความถี่เหนือเสียง"]
    misconceptions:
