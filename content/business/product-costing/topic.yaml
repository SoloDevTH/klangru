id: business.accounting.product-costing
subject: business
title: { th: "ต้นทุนผลิตภัณฑ์และการกำหนดต้นทุนต่อหน่วย", en: "Product costing and unit cost" }
summary: "วัตถุดิบทางตรง ค่าแรงทางตรง ค่าใช้จ่ายการผลิต การปันส่วนด้วยอัตรากำหนดล่วงหน้า ต้นทุนงานสั่งทำ ต้นทุนช่วงและหน่วยเทียบเท่า และการใช้ต้นทุนต่อหน่วยตั้งราคา"
difficulty: 5.5
minutes: 45
prerequisites: [business.finance.break-even, business.accounting.financial-statements]
encompasses:
  - { id: business.accounting.financial-statements, weight: 0.3 }
  - { id: business.finance.break-even, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: cost-flow.svg
    alt: "แผนภาพการไหลของต้นทุน กล่องวัตถุดิบทางตรง ค่าแรงทางตรง และค่าใช้จ่ายการผลิต (ปันส่วนด้วยอัตรากำหนดล่วงหน้า) มีลูกศรเข้ากล่องงานระหว่างทำ เมื่อผลิตเสร็จลูกศรไปกล่องสินค้าสำเร็จรูป เมื่อขายได้ลูกศรไปกล่องต้นทุนขาย ข้อความบอกว่างานระหว่างทำและสินค้าสำเร็จรูปที่ยังไม่ขายคือสินค้าคงเหลือในงบแสดงฐานะการเงิน และค่าใช้จ่ายในการขายและบริหารเป็นค่าใช้จ่ายของงวด ไม่เข้าต้นทุนสินค้า"
    caption: "ต้นทุนผลิตไหลตามสินค้า และกลายเป็นต้นทุนขายเมื่อขายได้"
  - { type: check, problem: business.accounting.product-costing.p001, prompt: "แยกประเภทต้นทุนก่อนคำนวณ" }
  - type: worked-example
    title: "ต้นทุนงานโต๊ะประชุม 10 ตัว"
    problem: "โรงงานเฟอร์นิเจอร์ (สมมติ) รับทำโต๊ะประชุม 10 ตัว ใช้ไม้ $18{,}000$ บาท ช่างใช้ $40$ ชั่วโมง ค่าจ้างชั่วโมงละ $150$ บาท โรงงานประมาณค่าใช้จ่ายการผลิตทั้งปี $360{,}000$ บาท และชั่วโมงแรงงานทางตรงทั้งปี $6{,}000$ ชั่วโมง หาต้นทุนต่อตัวและราคาขายถ้าบวกส่วนเพิ่ม $40\\%$"
    steps:
      - { text: "อัตราค่าใช้จ่ายการผลิต $= 360{,}000 \\div 6{,}000 = 60$ บาทต่อชั่วโมง", why: "ใช้ตัวเลขประมาณทั้งปี เพราะยอดจริงยังไม่รู้ตอนเสนอราคา" }
      - { text: "ค่าแรงทางตรง $= 40 \\times 150 = 6{,}000$ บาท ค่าใช้จ่ายการผลิตที่ปันส่วน $= 40 \\times 60 = 2{,}400$ บาท" }
      - { text: "ต้นทุนงาน $= 18{,}000 + 6{,}000 + 2{,}400 = 26{,}400$ บาท ต่อตัว $= 2{,}640$ บาท" }
      - { text: "ราคาขาย $= 2{,}640 \\times 1.40 = 3{,}696$ บาทต่อตัว", why: "ส่วนเพิ่มต้องครอบคลุมค่าใช้จ่ายขายและบริหาร และเหลือกำไร" }
    answer: "ต้นทุน $2{,}640$ บาทต่อตัว ราคาขาย $3{,}696$ บาทต่อตัว"
  - type: worked-example
    title: "ต้นทุนช่วงของน้ำพริกเผา"
    problem: "แผนกผสมและบรรจุ (สมมติ) มีงานต้นงวด $200$ ขวด เริ่มผลิต $1{,}800$ ขวด เสร็จ $1{,}700$ ขวด ปลายงวด $300$ ขวด (วัตถุดิบ $100\\%$ แปรสภาพ $40\\%$) ต้นทุนวัตถุดิบรวม $30{,}000$ บาท ต้นทุนแปรสภาพรวม $18{,}200$ บาท (รวมต้นงวดแล้ว) หาต้นทุนสินค้าเสร็จ"
    steps:
      - { text: "หน่วยเทียบเท่า วัตถุดิบ $= 1{,}700 + 300 = 2{,}000$ แปรสภาพ $= 1{,}700 + 300 \\times 0.4 = 1{,}820$", why: "วัตถุดิบใส่ครบตั้งแต่ต้น แต่การแปรสภาพทำไปแค่ $40\\%$" }
      - { text: "ต้นทุนต่อหน่วยเทียบเท่า วัตถุดิบ $= 30{,}000 \\div 2{,}000 = 15$ บาท แปรสภาพ $= 18{,}200 \\div 1{,}820 = 10$ บาท รวม $25$ บาทต่อขวด" }
      - { text: "สินค้าเสร็จ $= 1{,}700 \\times 25 = 42{,}500$ บาท" }
      - { text: "ตรวจ: งานปลายงวด $= 300 \\times 15 + 120 \\times 10 = 5{,}700$ บาท และ $42{,}500 + 5{,}700 = 48{,}200$ บาท เท่ากับต้นทุนทั้งหมด" }
    answer: "ต้นทุนสินค้าเสร็จ $42{,}500$ บาท ($25$ บาทต่อขวด)"
  - { type: check, problem: business.accounting.product-costing.p007, prompt: "คิดต้นทุนต่อใบของงานพิมพ์กล่อง" }
glossary:
  - { term: "วัตถุดิบทางตรง", definition: "วัตถุดิบหลักที่ระบุได้ว่าใช้ในสินค้าชิ้นใด" }
  - { term: "ค่าแรงทางตรง", definition: "ค่าจ้างของคนที่ลงมือผลิตสินค้าโดยตรงและระบุได้ว่าเป็นของสินค้าชิ้นใด" }
  - { term: "ค่าใช้จ่ายการผลิต", definition: "ต้นทุนการผลิตอื่นที่ระบุเข้าสินค้าโดยตรงไม่ได้ เช่น วัตถุดิบทางอ้อม ค่าแรงทางอ้อม ค่าไฟโรงงาน ค่าเสื่อมราคาเครื่องจักร" }
  - { term: "ต้นทุนแปรสภาพ", definition: "ค่าแรงทางตรง + ค่าใช้จ่ายการผลิต" }
  - { term: "อัตราค่าใช้จ่ายการผลิตกำหนดไว้ล่วงหน้า", definition: "ค่าใช้จ่ายการผลิตที่ประมาณ ÷ ฐานกิจกรรมที่ประมาณ ใช้ปันส่วนค่าใช้จ่ายเข้างานระหว่างปี" }
  - { term: "หน่วยเทียบเท่าสำเร็จรูป", definition: "จำนวนหน่วยเสร็จสมบูรณ์ที่เทียบได้กับงานที่ทำไปแล้ว รวมงานที่ทำไม่เสร็จตามร้อยละความสำเร็จ" }
  - { term: "บัตรต้นทุนงาน", definition: "เอกสารที่สะสมวัตถุดิบ ค่าแรง และค่าใช้จ่ายการผลิตของงานสั่งทำแต่ละงาน" }
flashcards:
  - { front: "ต้นทุนเบื้องต้น vs ต้นทุนแปรสภาพ", back: "เบื้องต้น = วัตถุดิบทางตรง + ค่าแรงทางตรง · แปรสภาพ = ค่าแรงทางตรง + ค่าใช้จ่ายการผลิต" }
  - { front: "ต้นทุนการผลิต", back: "งานระหว่างทำต้นงวด + วัตถุดิบทางตรงที่ใช้ + ค่าแรงทางตรง + ค่าใช้จ่ายการผลิต − งานระหว่างทำปลายงวด" }
  - { front: "ปันส่วนเกิน / ปันส่วนขาด", back: "ยอดที่ปันส่วน (อัตรา × ฐานจริง) มากกว่ายอดจริง = ปันส่วนเกิน · น้อยกว่า = ปันส่วนขาด" }
  - { front: "งานสั่งทำ vs ต้นทุนช่วง", back: "งานสั่งทำ: งานแต่ละชิ้นต่างกัน สะสมต้นทุนตามงาน · ต้นทุนช่วง: สินค้าเหมือนกันต่อเนื่อง เฉลี่ยตามหน่วยเทียบเท่า" }
  - { front: "ราคาแบบต้นทุนบวกส่วนเพิ่ม", back: "ราคา = ต้นทุนต่อหน่วย × (1 + อัตราส่วนเพิ่ม)" }
