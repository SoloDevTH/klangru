<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="sans-serif">
<title>ใจความสำคัญเปรียบเป็นพื้นโต๊ะ รายละเอียดสนับสนุนเป็นขาโต๊ะ</title>
<rect x="0" y="0" width="700" height="400" fill="#fff"/>
<rect x="220.0" y="18.0" width="260.0" height="38.0" rx="19" fill="#eef3e6" stroke="#3f7a32" stroke-width="2"/>
<text x="350.0" y="43.0" font-size="17" text-anchor="middle" fill="#1f4f1a" font-weight="bold">TOPIC: mangrove forests</text>
<line x1="350.0" y1="58.0" x2="350.0" y2="86.0" stroke="#3f7a32" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="350.0,86.0 345.7,77.0 354.3,77.0" fill="#3f7a32" stroke="#3f7a32" stroke-width="1" stroke-linejoin="round"/>
<rect x="60.0" y="92.0" width="580.0" height="76.0" rx="8" fill="#dbe8fb" stroke="#2f5fa8" stroke-width="2.5"/>
<text x="350.0" y="120.0" font-size="15" text-anchor="middle" fill="#2f5fa8" font-weight="bold">MAIN IDEA</text>
<text x="350.0" y="150.0" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">Mangrove forests protect the coast of Thailand.</text>
<rect x="136.0" y="168.0" width="28.0" height="92.0" rx="0" fill="#c9a26b" stroke="#7a5a2b" stroke-width="2"/>
<rect x="65.0" y="262.0" width="170.0" height="92.0" rx="6" fill="#fde7cf" stroke="#c46a12" stroke-width="2"/>
<text x="150.0" y="286.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">Their roots stop</text>
<text x="150.0" y="308.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">waves from washing</text>
<text x="150.0" y="330.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">away the land.</text>
<rect x="336.0" y="168.0" width="28.0" height="92.0" rx="0" fill="#c9a26b" stroke="#7a5a2b" stroke-width="2"/>
<rect x="265.0" y="262.0" width="170.0" height="92.0" rx="6" fill="#fde7cf" stroke="#c46a12" stroke-width="2"/>
<text x="350.0" y="286.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">They are homes for</text>
<text x="350.0" y="308.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">young fish, crabs</text>
<text x="350.0" y="330.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">and shrimps.</text>
<rect x="536.0" y="168.0" width="28.0" height="92.0" rx="0" fill="#c9a26b" stroke="#7a5a2b" stroke-width="2"/>
<rect x="465.0" y="262.0" width="170.0" height="92.0" rx="6" fill="#fde7cf" stroke="#c46a12" stroke-width="2"/>
<text x="550.0" y="286.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">The trees store</text>
<text x="550.0" y="308.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">carbon from</text>
<text x="550.0" y="330.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal">the air.</text>
<text x="350.0" y="384.0" font-size="15" text-anchor="middle" fill="#c46a12" font-weight="bold">SUPPORTING DETAILS (รายละเอียดสนับสนุน)</text>
</svg>
