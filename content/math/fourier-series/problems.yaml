  difficulty: 3
  type: text
  stem: 'ปรากฏการณ์ที่กราฟของผลบวกย่อยเกินค่าของฟังก์ชันเล็กน้อยใกล้จุดกระโดด แม้เพิ่มจำนวนพจน์แล้วก็ยังคงอยู่ เรียกว่าอะไร (ตอบชื่อ)'
  accepted:
