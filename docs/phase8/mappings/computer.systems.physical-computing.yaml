  - { framework: csta-k12-cs, indicators: ["2-CS-02"], coverage: partial, note: "ออกแบบระบบที่รวมเซนเซอร์ ไมโครคอนโทรลเลอร์ ตัวขับเคลื่อน และโมดูลสื่อสารเพื่อเก็บและส่งข้อมูล (ระบบรดน้ำ ระบบนับคนเข้าห้องสมุด ระบบเตือนน้ำท่วม) พร้อมการปรับเทียบ ความถี่ในการส่ง และพลังงาน แต่การต่อวงจรและรันโปรแกรมบนบอร์ดจริงต้องใช้ฮาร์ดแวร์นอกแอป" }
  - { framework: csta-k12-cs, indicators: ["3A-CS-01"], coverage: full, note: "อธิบายนามธรรมที่ซ้อนเป็นชั้นในหม้อหุงข้าวดิจิทัล (ผู้ใช้ โปรแกรมหลัก ไลบรารี วงจร) ข้อดีที่เปลี่ยนชั้นล่างได้โดยชั้นบนไม่ต้องแก้ และข้อเสียที่ผู้ใช้มองไม่เห็นสาเหตุเมื่อมีปัญหา" }
