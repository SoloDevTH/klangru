<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="sans-serif">
<title>วัตถุที่ตกลงมามีน้ำหนักชี้ลง แรงต้านอากาศชี้ขึ้น และความเร็วชี้ลง</title>
<defs><marker id="mk" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#1f2937"/></marker><marker id="mr" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#dc2626"/></marker><marker id="mb" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="mg" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#15803d"/></marker></defs>
<rect width="640" height="330" fill="#ffffff"/>
<ellipse cx="240" cy="165" rx="34" ry="26" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
<text x="240.0" y="170.0" text-anchor="middle" font-size="15" fill="#111" font-weight="bold">m</text>
<line x1="240.0" y1="133.0" x2="240.0" y2="65.0" stroke="#dc2626" stroke-width="3" marker-end="url(#mr)"/>
<text x="240.0" y="53.0" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="normal">แรงต้านอากาศ F<tspan baseline-shift="sub" font-size="75%">D</tspan> (ชี้ขึ้น)</text>
<line x1="240.0" y1="195.0" x2="240.0" y2="263.0" stroke="#1f2937" stroke-width="3" marker-end="url(#mk)"/>
<text x="240.0" y="283.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="normal">น้ำหนัก mg (ชี้ลง)</text>
<line x1="320.0" y1="145.0" x2="320.0" y2="215.0" stroke="#1d4ed8" stroke-width="3" marker-end="url(#mb)"/>
<text x="332.0" y="177.0" text-anchor="start" font-size="13" fill="#1d4ed8" font-weight="normal">ความเร็ว v</text>
<text x="332.0" y="195.0" text-anchor="start" font-size="13" fill="#1d4ed8" font-weight="normal">(ชี้ลง)</text>
<text x="320.0" y="314.0" text-anchor="middle" font-size="12" fill="#444" font-weight="normal">ถ้า F<tspan baseline-shift="sub" font-size="75%">D</tspan> น้อยกว่า mg วัตถุยังเร่ง ถ้า F<tspan baseline-shift="sub" font-size="75%">D</tspan> เท่ากับ mg ความเร็วจะคงที่</text>
</svg>