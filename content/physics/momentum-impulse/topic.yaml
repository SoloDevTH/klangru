id: physics.momentum.momentum-impulse
subject: physics
title: { th: โมเมนตัมและการดล, en: Momentum and impulse }
summary: โมเมนตัมเท่ากับมวลคูณความเร็ว การดลเท่ากับโมเมนตัมที่เปลี่ยนไป แรงเฉลี่ยในการชน และเหตุผลที่ถุงลมนิรภัยลดแรงกระแทก
difficulty: 5
minutes: 35
prerequisites: [physics.dynamics.newton-second]
encompasses:
  - { id: physics.dynamics.newton-second, weight: 0.4 }
  - { id: physics.kinematics.acceleration, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: รับลูกบอลแบบมือแข็งกับแบบดึงมือตาม
    problem: "ลูกบอลมวล $0.15\\ \\mathrm{kg}$ พุ่งมาด้วยความเร็ว $4\\ \\mathrm{m/s}$ ถ้ารับแบบมือแข็งลูกหยุดใน $0.01\\ \\mathrm{s}$ ถ้าดึงมือตามลูกหยุดใน $0.04\\ \\mathrm{s}$ แรงเฉลี่ยในสองกรณีเป็นเท่าใด และกราฟแรงกับเวลาต่างกันอย่างไร"
    figure:
      src: force-time-two-catches.svg
      alt: "กราฟแรง (N) กับเวลา (s) มีสามเหลี่ยมสองรูปเริ่มที่เวลา 0 รูปแรกสูงแคบ ยอด 120 N ที่ 0.005 s และจบที่ 0.01 s แทนการรับแบบมือแข็ง รูปที่สองเตี้ยกว้าง ยอด 30 N ที่ 0.02 s และจบที่ 0.04 s แทนการดึงมือตาม มีข้อความว่าพื้นที่ใต้กราฟเท่ากัน คือการดล 0.6 N·s"
    steps:
      - text: "การดลเท่ากันทั้งสองแบบ: $\\Delta p = 0 - (0.15)(4) = -0.6\\ \\mathrm{kg\\cdot m/s}$ ขนาด $0.6\\ \\mathrm{N\\cdot s}$"
        why: "ลูกบอลเริ่มที่ความเร็วเดียวกันและหยุดเหมือนกัน วิธีรับไม่ได้เปลี่ยนโมเมนตัมที่ต้องกำจัด"
      - text: "มือแข็ง: $F = \\dfrac{0.6}{0.01} = 60\\ \\mathrm{N}$ ดึงมือตาม: $F = \\dfrac{0.6}{0.04} = 15\\ \\mathrm{N}$"
      - text: "ในกราฟ พื้นที่สามเหลี่ยมทั้งสองเท่ากับ $0.6\\ \\mathrm{N\\cdot s}$ แต่แรงสูงสุดต่างกัน 4 เท่า ($120\\ \\mathrm{N}$ กับ $30\\ \\mathrm{N}$)"
        why: "สามเหลี่ยมมีพื้นที่ $\\tfrac12 \\times$ ฐาน $\\times$ สูง แรงสูงสุดจึงเป็นสองเท่าของแรงเฉลี่ย"
    answer: "แรงเฉลี่ย $60\\ \\mathrm{N}$ กับ $15\\ \\mathrm{N}$ การดึงมือตามยืดเวลา 4 เท่า แรงจึงลดลง 4 เท่า"
  - { type: check, problem: phy.mom.p006, prompt: "ใช้แนวคิดเดียวกันกับถุงลมนิรภัย" }
  - type: worked-example
    title: กระโดดลงพื้น แรงจากพื้นต้องรวมน้ำหนัก
    problem: "นักเรียนมวล $60\\ \\mathrm{kg}$ กระโดดลงจากแท่นสูง $0.8\\ \\mathrm{m}$ แล้วย่อเข่าจนหยุดในเวลา $0.3\\ \\mathrm{s}$ พื้นดันเท้าด้วยแรงเฉลี่ยเท่าใด ($g = 9.8\\ \\mathrm{m/s^2}$)"
    steps:
      - text: "ความเร็วขณะถึงพื้น: $v = \\sqrt{2gh} = \\sqrt{2(9.8)(0.8)} \\approx 3.96\\ \\mathrm{m/s}$"
      - text: "โมเมนตัมที่ต้องกำจัด: $\\Delta p = 60 \\times 3.96 \\approx 238\\ \\mathrm{kg\\cdot m/s}$ แรงลัพธ์เฉลี่ย $= \\dfrac{238}{0.3} \\approx 792\\ \\mathrm{N}$ ทิศขึ้น"
      - text: "แรงลัพธ์ $=$ แรงจากพื้น $-$ น้ำหนัก ดังนั้นแรงจากพื้น $= 792 + (60)(9.8) = 792 + 588 \\approx 1380\\ \\mathrm{N}$"
        why: "ขณะหยุด น้ำหนักยังดึงลงอยู่ตลอด พื้นจึงต้องดันทั้งเพื่อหยุดตัวและเพื่อรับน้ำหนัก"
      - text: "ถ้ายืดขาแข็งจนหยุดใน $0.03\\ \\mathrm{s}$ แรงจากพื้นจะเป็น $\\dfrac{238}{0.03} + 588 \\approx 8500\\ \\mathrm{N}$ มากกว่าราว 6 เท่า"
    answer: "ประมาณ $1.4 \\times 10^3\\ \\mathrm{N}$ (ราว 2.3 เท่าของน้ำหนักตัว)"
  - { type: check, problem: phy.mom.p004, prompt: "การดลคือแรงคูณเวลา" }
  - type: interactive
    title: เวลาที่ใช้หยุดกับแรงเฉลี่ย (หลักการของถุงลมนิรภัย)
    caption: 'แกนนอนคือเวลาที่ใช้หยุด Δt (s) แกนตั้งคือขนาดแรงเฉลี่ย F = Δp/Δt (N) แถบ p คือขนาดของโมเมนตัมที่เปลี่ยนไป ลองดูว่าเมื่อเวลาที่ใช้หยุดเพิ่มจาก 0.01 s เป็น 0.1 s แรงลดลงเหลือหนึ่งในสิบ ทั้งที่โมเมนตัมที่เปลี่ยนไปเท่าเดิม'
    widget:
      kind: function-plot
      functions: ['\frac{p}{x}']
      sliders:
        - { name: p, min: 1, max: 20, step: 1, value: 6, label: Δp (kg·m/s) }
      x: [0, 0.5]
      y: [0, 600]
  - type: simulation
    title: ห้องทดลองการชน (PhET Collision Lab)
    url: https://phet.colorado.edu/en/simulations/collision-lab
    provider: phet
    note: เปิดการแสดงเวกเตอร์โมเมนตัม แล้วลองให้ลูกบอลมวลต่างกันเคลื่อนที่ด้วยความเร็วต่าง ๆ สังเกตว่าลูกที่มวลมากแม้เคลื่อนที่ช้าก็มีลูกศรโมเมนตัมยาวได้ และโมเมนตัมของแต่ละลูกเปลี่ยนไปเท่าใดหลังชน
glossary:
  - { term: โมเมนตัม (p), definition: 'ผลคูณของมวลกับความเร็ว $p = mv$ เป็นปริมาณเวกเตอร์ หน่วย $\mathrm{kg \cdot m/s}$' }
  - { term: การดล (impulse), definition: 'ผลคูณของแรงเฉลี่ยกับเวลาที่แรงกระทำ $F\Delta t$ เท่ากับโมเมนตัมที่เปลี่ยนไป หน่วย $\mathrm{N \cdot s}$' }
  - { term: แรงเฉลี่ย, definition: 'แรงคงตัวที่ให้การดลเท่ากับแรงจริงในช่วงเวลาเดียวกัน $F = \tfrac{\Delta p}{\Delta t}$' }
flashcards:
  - { front: 'สูตรโมเมนตัมและการดล', back: '$p = mv$ และ $F\Delta t = \Delta p = mv - mu$' }
  - { front: '$\mathrm{N \cdot s}$ กับ $\mathrm{kg \cdot m/s}$ ต่างกันหรือไม่', back: 'เท่ากัน เพราะ $1\ \mathrm{N} = 1\ \mathrm{kg \cdot m/s^2}$ คูณด้วย $\mathrm{s}$ ได้ $\mathrm{kg \cdot m/s}$' }
  - { front: 'ถุงลมนิรภัยลดแรงกระแทกได้อย่างไร', back: 'โมเมนตัมที่เปลี่ยนไปเท่าเดิม แต่ถุงลมเพิ่มเวลาที่ใช้หยุด $\Delta t$ แรงเฉลี่ย $\tfrac{\Delta p}{\Delta t}$ จึงลดลง' }
  - { front: 'ลูกบอลมวล $0.5\ \mathrm{kg}$ ชนกำแพงด้วย $6\ \mathrm{m/s}$ กระดอนกลับ $4\ \mathrm{m/s}$ โมเมนตัมเปลี่ยนไปเท่าใด', back: 'ขนาด $0.5 \times (6 + 4) = 5\ \mathrm{kg \cdot m/s}$ เพราะทิศกลับ ต้องรวมขนาดของความเร็วทั้งสอง' }
