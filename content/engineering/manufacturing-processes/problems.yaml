problems:
  - id: engineering.manufacturing.manufacturing-processes.p001
    topics:
      - engineering.manufacturing.manufacturing-processes
    difficulty: 1
    type: mcq
    stem: การหล่อแบบทรายเหมาะกับการผลิตแบบใดมากที่สุด
    choices:
      - id: a
        text: ชิ้นงานขนาดใหญ่ รูปร่างซับซ้อน และปริมาณน้อยถึงปานกลาง
        correct: true
      - id: b
        text: ชิ้นงานขนาดเล็กเหมือนกันหลายล้านชิ้นที่ต้องการผิวเรียบมาก
        feedback: งานปริมาณมากและผิวเรียบมักเหมาะกับการหล่อแบบแม่พิมพ์ถาวรมากกว่า
      - id: c
        text: ชิ้นงานพลาสติกบางที่ผลิตด้วยการป้อนความร้อนสูง
        feedback: การหล่อแบบทรายใช้กับโลหะ ไม่ใช่การขึ้นรูปพลาสติกบาง
      - id: d
        text: ชิ้นงานที่ต้องการการเชื่อมโลหะที่มีความหนามากเป็นพิเศษ
        feedback: การเชื่อมเป็นกระบวนการต่อชิ้นส่วน ไม่ใช่วิธีหลักของการหล่อแบบทราย
    hints:
      - แบบทรายเป็นแม่พิมพ์ที่ทำใหม่ได้ง่ายและใช้ได้กับชิ้นงานขนาดใหญ่
      - ลองนึกถึงปริมาณที่ไม่สูงมากและความละเอียดผิวที่ไม่ต้องสูงที่สุด
    solution: แบบทรายเหมาะกับชิ้นงานขนาดใหญ่ รูปร่างซับซ้อน และปริมาณน้อยถึงปานกลาง เพราะทำแม่พิมพ์ใหม่ได้ง่ายและต้นทุนแม่พิมพ์ต่ำ แต่ผิวหยาบและความคลาดเคลื่อนกว้างกว่าแบบแม่พิมพ์ถาวร
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.manufacturing.manufacturing-processes.p002
    topics:
      - engineering.manufacturing.manufacturing-processes
    difficulty: 1
    type: numeric
    stem: (ข้อมูลสมมติ) กลึงเพลาโลหะเส้นผ่านศูนย์กลาง 50 มิลลิเมตร ด้วยความเร็วรอบ 500 รอบต่อนาที ความเร็วตัดเท่ากับกี่เมตรต่อนาที (ตอบทศนิยมหนึ่งตำแหน่ง)
    answer:
      value: 78.5
      tolerance: 0.1
      unit: m/min
    hints:
      - ความเร็วตัด V = π × D × N ÷ 1000 เมื่อ D เป็นมิลลิเมตร
      - D คือเส้นผ่านศูนย์กลาง ไม่ใช่รัศมี
    misconceptions:
      - match: 39.3
        feedback: ใช้รัศมีแทนเส้นผ่านศูนย์กลางในสูตร ทำให้ความเร็วตัดต่ำลงครึ่งหนึ่ง
      - match: 25.0
        feedback: ลืมคูณด้วย π ในสูตรความเร็วตัด
    solution: V = π × 50 × 500 ÷ 1000 ≈ 78.5 เมตร/นาที ค่านี้เป็นความเร็วที่ผิวชิ้นงานเคลื่อนที่เทียบกับมีดตัด
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.manufacturing.manufacturing-processes.p003
    topics:
      - engineering.manufacturing.manufacturing-processes
    difficulty: 1
    type: mcq
    stem: ข้อใดเป็นกระบวนการขึ้นรูปโลหะที่แตกต่างจากการตัดเฉือนที่สุด
    choices:
      - id: a
        text: การรีดแผ่นโลหะผ่านลูกกลิ้ง
        correct: true
      - id: b
        text: การกลึงเพลาให้ได้เส้นผ่านศูนย์กลางตามแบบ
        feedback: การกลึงเอาเนื้อวัสดุออกเป็นเศษ จึงเป็นการตัดเฉือน
      - id: c
        text: การกัดร่องบนชิ้นงานด้วยเครื่องมือหมุน
        feedback: การกัดเอาเนื้อวัสดุออกเป็นเศษ จึงเป็นการตัดเฉือน
      - id: d
        text: การเจาะรูด้วยดอกสว่านบนแผ่นเหล็ก
        feedback: การเจาะเอาเนื้อวัสดุออกเป็นเศษ จึงเป็นการตัดเฉือน
    hints:
      - การตัดเฉือนเอาเนื้อวัสดุออกเป็นเศษ
      - การขึ้นรูปเปลี่ยนรูปร่างโดยใช้แรงกดหรือดึงโดยไม่ตัดเนื้อออก
    solution: การรีดโลหะเปลี่ยนรูปหน้าตัดด้วยแรงกดผ่านลูกกลิ้ง โดยไม่มีเศษเกิดขึ้น ส่วนการกลึงและการกัดเอาเนื้อวัสดุออกเป็นเศษ
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.manufacturing.manufacturing-processes.p004
    topics:
      - engineering.manufacturing.manufacturing-processes
    difficulty: 1
    type: match
    stem: จับคู่กระบวนการผลิตกับลักษณะเด่น
    pairs:
      - left: การตีขึ้นรูป (forging)
        right: ใช้แรงกดหรือกระแทกให้โลหะไหลเข้ารูปแม่พิมพ์และได้เนื้อแน่น
      - left: การอัดรีด (extrusion)
        right: ดันโลหะผ่านรูหน้าตัดเพื่อได้รูปหน้าตัดยาวต่อเนื่อง
      - left: การเชื่อม (welding)
        right: หลอมโลหะบริเวณรอยต่อเพื่อให้ชิ้นงานรวมเป็นชิ้นเดียว
      - left: การฉีดพลาสติก (injection molding)
        right: ฉีดพลาสติกหลอมเหลวเข้าแม่พิมพ์ที่เย็นตัวเพื่อให้ได้รูปร่างซ้ำกัน
    hints:
      - การฉีดใช้กับพลาสติกที่หลอมเหลวเข้าแม่พิมพ์
      - การตีขึ้นรูปใช้แรงกระแทกหรือกดให้โลหะไหลเข้ารูปแม่พิมพ์
    solution: การตีขึ้นรูปใช้แรงกดให้โลหะไหลตามรูปแม่พิมพ์และได้เนื้อแน่นขึ้น การอัดรีดดันโลหะผ่านรูหน้าตัดเพื่อได้รูปหน้าตัดยาวต่อเนื่อง การเชื่อมหลอมและรวมชิ้นงาน และการฉีดขึ้นรูปพลาสติกหลอมเหลวเข้าแม่พิมพ์ที่เย็นตัว
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.manufacturing.manufacturing-processes.p005
    topics:
      - engineering.manufacturing.manufacturing-processes
    difficulty: 2
    type: mcq
    stem: ข้อใดเป็นกระบวนการขึ้นรูปโลหะที่ไม่ทำให้สูญเสียเนื้อวัสดุเป็นเศษ (เลือกทุกข้อที่ถูก)
    multiple: true
    choices:
      - id: a
        text: การรีดโลหะให้เป็นแผ่น
        correct: true
      - id: b
        text: การดึงลวดผ่านแม่พิมพ์
        correct: true
      - id: c
        text: การกลึงเพลาให้เรียว
        feedback: การกลึงเอาเนื้อโลหะออกเป็นเศษ
      - id: d
        text: การตีขึ้นรูปชิ้นส่วนเพลาให้มีความแข็งแรง
        correct: true
    hints:
      - ดูว่ากระบวนการนั้นเปลี่ยนรูปโลหะโดยกดหรือดึง หรือเอาเนื้อออก
      - การกลึงและการเจาะเป็นการตัดเฉือนซึ่งสร้างเศษ
    solution: การรีด การตีขึ้นรูป และการดึงลวดเปลี่ยนรูปโลหะโดยไม่มีเศษเกิดขึ้น ส่วนการกลึงและการเจาะเอาเนื้อออกเป็นเศษ
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.manufacturing.manufacturing-processes.p006
    topics:
      - engineering.manufacturing.manufacturing-processes
    difficulty: 2
    type: numeric
    stem: (ข้อมูลสมมติ) เครื่องกลึงตัดชิ้นงานยาว 120 มิลลิเมตรด้วยอัตราป้อน 0.2 มิลลิเมตรต่อรอบ และความเร็วรอบ 500 รอบต่อนาที เวลาตัดหนึ่งเที่ยวตลอดความยาวชิ้นงานกี่นาที (ตอบทศนิยมหนึ่งตำแหน่ง ไม่รวมระยะเข้าออก)
    answer:
      value: 1.2
      tolerance: 0.01
      unit: นาที
    hints:
      - เวลาตัด t = L ÷ (f × N) โดย f เป็นมิลลิเมตรต่อรอบ
      - ผลคูณ f × N คือการเคลื่อนที่ของมีดในหนึ่งนาที
    misconceptions:
      - match: 0.24
        feedback: ลืมอัตราป้อน ทำให้ได้เวลาสั้นเกินจริง
      - match: 72
        feedback: ได้ค่าเป็นวินาทีแต่โจทย์ถามเป็นนาที
    solution: t = 120 ÷ (0.2 × 500) = 120 ÷ 100 = 1.2 นาที การเพิ่มอัตราป้อนจะลดเวลาตัด แต่ผิวงานหยาบขึ้นและมีแรงตัดสูงขึ้น
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.manufacturing.manufacturing-processes.p007
    topics:
      - engineering.manufacturing.manufacturing-processes
    difficulty: 2
    type: order
    stem: เรียงลำดับขั้นตอนหลักของการหล่อแบบทราย
    items:
      - ทำแบบจำลองและแกนทรายที่คำนึงถึงการหดตัวของโลหะ
      - ประกอบแบบทรายพร้อมกำหนดช่องทางเทและช่องระบายอากาศ
      - เทโลหะหลอมเหลวลงในแม่พิมพ์
      - รอให้โลหะเย็นตัวแล้วแกะทรายออก
      - ตกแต่งผิวและตรวจสอบขนาดชิ้นงาน
    hints:
      - ต้องเตรียมแม่พิมพ์ก่อนเทโลหะเสมอ
      - การแกะทรายทำได้หลังโลหะแข็งตัวแล้ว
    solution: ขั้นตอนหลักเริ่มจากทำแบบจำลองและแกนทรายโดยเผื่อการหดตัว ประกอบแบบพร้อมช่องทางเท เทโลหะ รอให้เย็นแล้วแกะทราย และตกแต่งกับตรวจสอบขนาด
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.manufacturing.manufacturing-processes.p008
    topics:
      - engineering.manufacturing.manufacturing-processes
    difficulty: 3
    type: numeric
    stem: (ข้อมูลสมมติ) โรงหล่อชุมชนในจังหวัดสมุทรปราการต้องการชิ้นงานอะลูมิเนียมยาว 250 มิลลิเมตรหลังเย็นตัว โลหะหดตัวประมาณ 1.3% ความยาวของแบบจำลองต้องเผื่อการหดตัวเป็นกี่มิลลิเมตร (ตอบทศนิยมหนึ่งตำแหน่ง)
    answer:
      value: 253.3
      tolerance: 0.05
      unit: mm
    hints:
      - แบบจำลองต้องใหญ่กว่าชิ้นงานสุดท้ายเพราะโลหะจะหดลงเมื่อเย็น
      - ความยาวแบบ = ความยาวสุดท้าย × (1 + ค่าการหดตัว)
    misconceptions:
      - match: 246.8
        feedback: ลดขนาดแบบแทนที่จะเพิ่ม แบบจำลองต้องใหญ่กว่าเพราะโลหะจะหดตัว
      - match: 3.3
        feedback: ได้เฉพาะส่วนที่เผื่อ (ประมาณ 3.3 มม.) ยังไม่ได้บวกกับความยาวชิ้นงาน
    solution: ความยาวแบบ = 250 × (1 + 0.013) = 253.25 ≈ 253.3 มิลลิเมตร (ถ้าคิดแบบ 250 ÷ (1 − 0.013) จะได้ประมาณ 253.29 มิลลิเมตร ซึ่งปัดแล้วเท่ากัน) เมื่อโลหะหดตัวจะได้ขนาดสุดท้ายประมาณ 250 มิลลิเมตร
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.manufacturing.manufacturing-processes.p009
    topics:
      - engineering.manufacturing.manufacturing-processes
    difficulty: 3
    type: numeric
    stem: (ข้อมูลสมมติ) โรงงานหล่อในจังหวัดสมุทรปราการพิจารณาระหว่างการหล่อแบบทราย (ต้นทุนคงที่ 30,000 บาท ต้นทุนผันแปร 120 บาทต่อชิ้น) และการหล่อแบบแม่พิมพ์ถาวร (ต้นทุนคงที่ 300,000 บาท ต้นทุนผันแปร 30 บาทต่อชิ้น) จุดคุ้มทุนคือกี่ชิ้นที่ทำให้ต้นทุนทั้งสองแบบเท่ากัน (ตอบจำนวนเต็ม)
    answer:
      value: 3000
      tolerance: 1
      unit: ชิ้น
    hints:
      - 'ตั้งสมการต้นทุนทั้งสองแบบให้เท่ากัน: F₁ + v₁Q = F₂ + v₂Q'
      - แก้หา Q โดยหาร (F₂ − F₁) ด้วย (v₁ − v₂)
    misconceptions:
      - match: 2500.0
        feedback: หารต้นทุนคงที่ของแบบแม่พิมพ์ด้วยต้นทุนผันแปรของแบบทราย ไม่ได้แก้สมการต้นทุนเท่ากัน
    solution: 30,000 + 120Q = 300,000 + 30Q จัดรูปได้ 90Q = 270,000 จึง Q = 3,000 ชิ้น ถ้าผลิตมากกว่านี้การหล่อแบบแม่พิมพ์ถาวรจะคุ้มกว่า
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.manufacturing.manufacturing-processes.p010
    topics:
      - engineering.manufacturing.manufacturing-processes
    difficulty: 3
    type: numeric
    stem: (ข้อมูลสมมติ) โรงงานพลาสติกต้องเลือกวิธีผลิตฝาครอบพลาสติกระหว่างการฉีดขึ้นรูปด้วยแม่พิมพ์ (ต้นทุนแม่พิมพ์และต้นทุนคงที่ 500,000 บาท ผันแปร 40 บาทต่อชิ้น) กับการพิมพ์ 3 มิติ (ไม่มีต้นทุนคงที่ ผันแปร 400 บาทต่อชิ้น) จุดคุ้มทุนอยู่ที่กี่ชิ้น (ตอบทศนิยมหนึ่งตำแหน่ง)
    answer:
      value: 1388.9
      tolerance: 0.1
      unit: ชิ้น
    hints:
      - ตั้งสมการ F₁ + v₁Q = F₂ + v₂Q โดยให้ F ของการพิมพ์ 3 มิติเป็นศูนย์
      - แก้หา Q โดยหาร F₁ − F₂ ด้วย v₂ − v₁ ตามลำดับที่ถูกต้อง
    misconceptions:
      - match: 1250.0
        feedback: หารต้นทุนคงที่ด้วยต้นทุนผันแปรของการพิมพ์ 3 มิติโดยไม่ลบส่วนต่างของการหล่อ
    solution: 0 + 400Q = 500,000 + 40Q จัดรูปได้ 360Q = 500,000 จึง Q ≈ 1,388.9 ชิ้น ถ้าผลิตมากกว่านี้การฉีดขึ้นรูปด้วยแม่พิมพ์จะถูกกว่าการพิมพ์ 3 มิติ
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.manufacturing.manufacturing-processes.p011
    topics:
      - engineering.manufacturing.manufacturing-processes
    difficulty: 3
    type: numeric
    stem: (ข้อมูลสมมติ) เชื่อมเหล็กด้วยกระแส 150 แอมแปร์ แรงดัน 24 โวลต์ ความเร็วเชื่อม 300 มิลลิเมตรต่อนาที และประสิทธิภาพของกระบวนการ 0.8 ปริมาณความร้อนที่ป้อน (heat input) เท่ากับกี่กิโลจูลต่อมิลลิเมตร (ใช้ H = η × V × I × 60 ÷ (1000 × S) ตอบทศนิยมสามตำแหน่ง)
    answer:
      value: 0.576
      tolerance: 0.002
      unit: kJ/mm
    hints:
      - ความร้อนที่ป้อนต่อหน่วยความยาวขึ้นกับกระแส แรงดัน ประสิทธิภาพ และความเร็วเชื่อม
      - ใช้ค่า 60 เพื่อแปลงความเร็วจากนาทีเป็นวินาที
    misconceptions:
      - match: 0.72
        feedback: ลืมคูณด้วยประสิทธิภาพของกระบวนการ จึงประเมินความร้อนที่ป้อนสูงเกินจริง
    solution: H = 0.8 × 24 × 150 × 60 ÷ (1000 × 300) = 172,800 ÷ 300,000 = 0.576 kJ/mm ความร้อนที่ป้อนมากเกินไปทำให้เขตรอยเชื่อมกว้างและโลหะเสียสมบัติ
