  - id: computer.society.privacy.p018
    topics: [computer.society.privacy]
    difficulty: 5
    type: mcq
    stem: "เทศบาลแห่งหนึ่งเสนอติดกล้องจดจำใบหน้าทั่วตลาดสดเพื่อตามหาคนร้าย ข้อใดเป็นการประเมินที่ **รอบด้านที่สุด** ทั้งด้านความปลอดภัย กฎหมาย และจริยธรรม"
    choices:
      - { id: a, text: "อาจช่วยจับคนร้ายได้ แต่ภาพใบหน้าที่ใช้จดจำเป็นข้อมูลชีวภาพซึ่งเป็นข้อมูลอ่อนไหว ต้องมีฐานทางกฎหมายและมาตรการรักษาความปลอดภัย ระบบอาจจำคนผิดจนคนบริสุทธิ์เดือดร้อน และทำให้คนรู้สึกถูกจับตา จึงควรจำกัดจุดติดตั้ง ระยะเวลาเก็บ และมีหน่วยงานตรวจสอบ", correct: true }
      - { id: b, text: "ควรติดทันที เพราะคนที่ไม่ได้ทำผิดไม่มีอะไรต้องปิดบัง", feedback: "ความเป็นส่วนตัวเป็นสิทธิของทุกคน ไม่ใช่เฉพาะคนทำผิด ข้อนี้ยังไม่พิจารณาการจำผิดและกฎหมายคุ้มครองข้อมูลเลย" }
      - { id: c, text: "ไม่ควรติดเด็ดขาด เพราะเทคโนโลยีทุกชนิดละเมิดความเป็นส่วนตัว", feedback: "ปัดตกโดยไม่ชั่งประโยชน์ด้านความปลอดภัย และไม่เสนอเงื่อนไขที่ทำให้ใช้ได้อย่างเหมาะสม" }
      - { id: d, text: "ควรติด เพราะกล้องราคาถูกลงมากแล้ว", feedback: "พิจารณาแค่ต้นทุน ไม่ได้ดูผลด้านความปลอดภัย กฎหมาย และจริยธรรม" }
    hints:
      - "การประเมินที่ดีต้องพูดถึงทั้งประโยชน์และความเสี่ยง"
      - "ตรวจว่าแต่ละตัวเลือกพูดถึงความปลอดภัย กฎหมาย และจริยธรรมครบหรือไม่"
    solution: "ข้อ ก ชั่งประโยชน์ด้านความปลอดภัย กล่าวถึงกฎหมาย (ข้อมูลชีวภาพเป็นข้อมูลอ่อนไหวตาม PDPA มาตรา 26) ความเสี่ยงทางจริยธรรม (จำคนผิด และความรู้สึกถูกจับตา) และเสนอเงื่อนไขควบคุม ส่วนข้ออื่นมองด้านเดียว"
