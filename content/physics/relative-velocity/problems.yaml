  - id: physics.kinematics.relative-velocity.p015
    topics: [physics.kinematics.relative-velocity]
    difficulty: 4
    type: expression
    stem: 'ให้ $v$ เป็นความเร็วของวัตถุ $P$ เทียบกับ $A$ ให้ $w$ เป็นความเร็วของ $B$ เทียบกับ $A$ และให้ $u$ เป็นความเร็วของ $P$ เทียบกับ $B$ จงเขียน $u$ ในรูปของ $v$ และ $w$'
    prefix: 'u ='
    answer: { latex: 'v - w', variables: [v, w] }
    hints:
      - ใช้สูตร $v_{PA} = v_{PB} + v_{BA}$ โดยแทน $v = v_{PA}$, $u = v_{PB}$ และ $w = v_{BA}$
      - ย้ายข้างสมการเพื่อแยก $u$
    misconceptions:
      - { match: 'v+w', feedback: 'บวกผิดทิศ ต้องย้ายข้างโดยลบ $w$ ออกจาก $v$' }
      - { match: 'w-v', feedback: 'สลับลำดับลบ ความเร็วของ $P$ เทียบกับ $B$ ต้องเป็น $v$ ลบ $w$' }
    solution: '$v = u + w$ จึงได้ $u = v - w$'
