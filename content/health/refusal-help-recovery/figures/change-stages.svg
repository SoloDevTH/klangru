<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" font-family="sans-serif">
<title>ช่วงของการเปลี่ยนพฤติกรรม</title>
<rect x="0" y="0" width="700" height="470" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="350.0" y="28.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">ช่วงของการเปลี่ยนพฤติกรรมเมื่อเลิกสารเสพติด</text>
<line x1="398.2" y1="110.0" x2="468.3" y2="160.9" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<line x1="505.1" y1="230.9" x2="464.2" y2="356.6" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<line x1="372.9" y1="391.6" x2="327.1" y2="391.6" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<line x1="235.8" y1="356.6" x2="194.9" y2="230.9" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<line x1="231.7" y1="160.9" x2="301.8" y2="110.0" stroke="#c0392b" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="6,4"/>
<text x="350.0" y="242.0" font-size="12.5" text-anchor="middle" fill="#c0392b">เส้นประ: อาจกลับไปใช้ซ้ำ</text>
<text x="350.0" y="262.0" font-size="12.5" text-anchor="middle" fill="#c0392b">แล้วเริ่มใหม่ได้</text>
<rect x="275.0" y="45.0" width="150.0" height="60.0" rx="8" fill="#eaf2f8" stroke="#333" stroke-width="1.5"/>
<text x="350.0" y="69.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">ยังไม่คิดจะเลิก</text>
<text x="350.0" y="91.0" font-size="11.5" text-anchor="middle" fill="#333">ให้ข้อมูล ไม่ตัดสิน</text>
<rect x="441.4" y="165.9" width="150.0" height="60.0" rx="8" fill="#eaf2f8" stroke="#333" stroke-width="1.5"/>
<text x="516.4" y="189.9" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">ลังเล</text>
<text x="516.4" y="211.9" font-size="11.5" text-anchor="middle" fill="#333">ถามเหตุผลที่อยากเลิก</text>
<rect x="377.9" y="361.6" width="150.0" height="60.0" rx="8" fill="#eaf2f8" stroke="#333" stroke-width="1.5"/>
<text x="452.9" y="385.6" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">เตรียมตัว</text>
<text x="452.9" y="407.6" font-size="11.5" text-anchor="middle" fill="#333">ช่วยวางเป้าหมายเล็ก ๆ</text>
<rect x="172.1" y="361.6" width="150.0" height="60.0" rx="8" fill="#eaf2f8" stroke="#333" stroke-width="1.5"/>
<text x="247.1" y="385.6" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">ลงมือเลิก</text>
<text x="247.1" y="407.6" font-size="11.5" text-anchor="middle" fill="#333">พาไปบำบัด อยู่ข้างเขา</text>
<rect x="108.6" y="165.9" width="150.0" height="60.0" rx="8" fill="#eaf2f8" stroke="#333" stroke-width="1.5"/>
<text x="183.6" y="189.9" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">รักษาการเลิกไว้</text>
<text x="183.6" y="211.9" font-size="11.5" text-anchor="middle" fill="#333">ชวนทำกิจกรรมทดแทน</text>
</svg>
