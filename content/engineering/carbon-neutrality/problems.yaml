problems:
  - id: engineering.environmental.carbon-neutrality.p001
    topics:
      - engineering.environmental.carbon-neutrality
    difficulty: 1
    type: mcq
    stem: ศักยภาพการทำให้โลกร้อน (GWP) ของก๊าซหนึ่งหมายถึงอะไร
    choices:
      - id: a
        text: ความสามารถในการกักความร้อนของก๊าซเทียบกับ CO₂ ในช่วงเวลาที่กำหนด
        correct: true
      - id: b
        text: ปริมาณก๊าซที่ปล่อยออกมาต่อปีของโรงงาน
        feedback: นั่นคือปริมาณการปล่อย ไม่ใช่ค่าศักยภาพของก๊าซ
      - id: c
        text: อุณหภูมิของบรรยากาศในวันที่วัด
        feedback: อุณหภูมิเป็นผลของหลายปัจจัย ไม่ใช่นิยามของ GWP
      - id: d
        text: ราคาของคาร์บอนเครดิตในตลาด
        feedback: ราคาคาร์บอนเครดิตเป็นเรื่องตลาด ไม่เกี่ยวกับคุณสมบัติการกักความร้อนของก๊าซ
    hints:
      - GWP เทียบผลของก๊าซแต่ละชนิดกับ CO₂ ในช่วงเวลาที่กำหนด
      - ค่า GWP ของ CO₂ เองเท่ากับ 1 เสมอ
    solution: GWP คือความสามารถในการกักความร้อนของก๊าซหนึ่งหน่วยมวล เทียบกับ CO₂ หนึ่งหน่วยมวล ในช่วงเวลาที่กำหนด เช่น 100 ปี ทำให้สามารถรวมการปล่อยก๊าซต่างชนิดเป็นหน่วยเดียว คือ tCO₂e
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.carbon-neutrality.p002
    topics:
      - engineering.environmental.carbon-neutrality
    difficulty: 1
    type: numeric
    stem: มีเทน 2 ตัน เทียบเป็นคาร์บอนไดออกไซด์เทียบเท่า (tCO₂e) โดยใช้ GWP100 = 28 ตามรายงาน IPCC AR5 เท่ากับเท่าไร (ตอบจำนวนเต็ม)
    answer:
      value: 56
      tolerance: 0.1
      unit: tCO₂e
    hints:
      - tCO₂e = ปริมาณก๊าซ × GWP ของก๊าซนั้น
      - มีเทนมี GWP100 ประมาณ 28 เท่าของ CO₂
    misconceptions:
      - match: 2
        feedback: ไม่ได้คูณด้วย GWP จึงยังไม่ได้เทียบเป็น CO₂ เทียบเท่า
      - match: 530
        feedback: ใช้ GWP ของไนตรัสออกไซด์ (265) แทนของมีเทน
    solution: tCO₂e = 2 × 28 = 56 ค่า GWP ขึ้นกับรายงาน IPCC ฉบับที่ใช้และช่วงเวลาที่กำหนด ต้องระบุไว้ในรายงานทุกครั้ง
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.carbon-neutrality.p003
    topics:
      - engineering.environmental.carbon-neutrality
    difficulty: 1
    type: match
    stem: จับคู่ขอบเขตการปล่อยกับตัวอย่างที่ตรงที่สุด
    pairs:
      - left: Scope 1
        right: การเผาไหม้น้ำมันดีเซลในเครื่องกำเนิดไฟฟ้าของโรงงาน
      - left: Scope 2
        right: ไฟฟ้าที่โรงงานซื้อจากระบบจำหน่ายไฟฟ้าภายนอก
      - left: Scope 3
        right: การขนส่งวัตถุดิบโดยผู้ขายที่บริษัทไม่ได้เป็นเจ้าของ
      - left: คาร์บอนเครดิต
        right: หน่วยการลดหรือกักเก็บการปล่อยที่ตรวจสอบได้ ใช้ชดเชยการปล่อยที่เหลือ
    hints:
      - Scope 1 คือการปล่อยที่เกิดจากแหล่งที่องค์กรควบคุมโดยตรง
      - Scope 2 เป็นการปล่อยทางอ้อมจากพลังงานที่องค์กรซื้อ
    solution: Scope 1 คือการปล่อยโดยตรงจากการเผาไหม้ในสถานที่และยานพาหนะของบริษัท Scope 2 คือการปล่อยทางอ้อมจากไฟฟ้าหรือความร้อนที่ซื้อ Scope 3 คือการปล่อยในห่วงโซ่คุณค่าอื่น เช่น การขนส่งของผู้ขาย และการกำจัดของเสียหลังการขาย
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.carbon-neutrality.p004
    topics:
      - engineering.environmental.carbon-neutrality
    difficulty: 2
    type: numeric
    stem: (ข้อมูลสมมติ) อาคารสำนักงานในกรุงเทพมหานครใช้ไฟฟ้า 12,000 kWh ในหนึ่งเดือน โดยใช้ค่าการปล่อยสมมติ 0.5 kgCO₂e ต่อ kWh การปล่อยจากไฟฟ้าเท่ากับกี่ตันคาร์บอนไดออกไซด์เทียบเท่า (ตอบทศนิยมหนึ่งตำแหน่ง)
    answer:
      value: 6.0
      tolerance: 0.05
      unit: tCO₂e
    hints:
      - การปล่อย = ปริมาณกิจกรรม × ค่าการปล่อย (emission factor)
      - ผลลัพธ์อยู่ในหน่วยกิโลกรัม ต้องหารด้วย 1000 เพื่อเป็นตัน
    misconceptions:
      - match: 6000
        feedback: ไม่ได้หารด้วย 1000 ผลลัพธ์ยังเป็นกิโลกรัม ไม่ใช่ตัน
    solution: การปล่อย = 12,000 × 0.5 = 6,000 kgCO₂e = 6.0 tCO₂e ค่าการปล่อยของโครงข่ายไฟฟ้าต้องใช้ค่าที่หน่วยงานกำกับประกาศในปีนั้น
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.carbon-neutrality.p005
    topics:
      - engineering.environmental.carbon-neutrality
    difficulty: 2
    type: numeric
    stem: การเผาไหม้โพรเพน (C₃H₈) สมบูรณ์ตามสมการ C₃H₈ + 5O₂ → 3CO₂ + 4H₂O ปล่อย CO₂ กี่กิโลกรัมต่อโพรเพน 1 กิโลกรัม (ใช้มวลอะตอม C = 12.011, H = 1.008, O = 15.999 ตอบทศนิยมสองตำแหน่ง)
    answer:
      value: 2.99
      tolerance: 0.005
      unit: kg CO₂/kg
    hints:
      - คำนวณมวลโมเลกุลของ C₃H₈ และ CO₂ ก่อน
      - CO₂ 3 โมลต่อโพรเพน 1 โมล ดังนั้นมวลที่ได้ = 3 × M(CO₂) ÷ M(C₃H₈)
    misconceptions:
      - match: 3.0
        feedback: ใช้อัตราส่วนโมลแทนอัตราส่วนมวล จึงไม่ได้คิดมวลโมเลกุลที่ต่างกัน
    solution: M(C₃H₈) = 44.097 g/mol M(CO₂) = 44.009 g/mol อัตราส่วน = 3 × 44.009 ÷ 44.097 ≈ 2.99 kg CO₂ ต่อ kg โพรเพน
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.carbon-neutrality.p006
    topics:
      - engineering.environmental.carbon-neutrality
    difficulty: 2
    type: mcq
    stem: ถ้าต้องการลดการปล่อยก๊าซเรือนกระจกของโรงงาน ควรเริ่มจากมาตรการใดเป็นอันดับแรก
    choices:
      - id: a
        text: ลดความต้องการพลังงานด้วยการเพิ่มประสิทธิภาพก่อนลงทุนซื้อพลังงานหมุนเวียนเพิ่ม
        correct: true
      - id: b
        text: ซื้อคาร์บอนเครดิตทั้งหมดตั้งแต่วันแรกโดยไม่ลดการปล่อยในโรงงาน
        feedback: การชดเชยโดยไม่ลดการปล่อยจริงไม่ใช่การลดการปล่อยที่แหล่งกำเนิด
      - id: c
        text: เพิ่มการใช้ดีเซลเพื่อให้เครื่องจักรทำงานเร็วขึ้นและจบงานก่อน
        feedback: การเพิ่มการใช้เชื้อเพลิงฟอสซิลเพิ่มการปล่อยโดยตรง
      - id: d
        text: ย้ายโรงงานไปไว้ที่อื่นโดยไม่วิเคราะห์การปล่อยใหม่
        feedback: การย้ายโดยไม่วิเคราะห์อาจทำให้การปล่อยรวมไม่ลดลง
    hints:
      - ลดความต้องการพลังงานก่อนลงทุนซื้อพลังงานสะอาดเพิ่ม
      - การลดความสูญเปล่ามักคุ้มทุนและเกิดผลได้เร็ว
    solution: การลดความต้องการพลังงานด้วยการเพิ่มประสิทธิภาพ เช่น ซ่อมฉนวนและปรับระบบอากาศ มักเป็นอันดับแรกเพราะทำได้เร็วและคุ้มค่า จากนั้นจึงเพิ่มพลังงานหมุนเวียน ส่วนการชดเชยด้วยคาร์บอนเครดิตควรเป็นทางเลือกสุดท้ายสำหรับส่วนที่เหลือ
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.carbon-neutrality.p007
    topics:
      - engineering.environmental.carbon-neutrality
    difficulty: 2
    type: order
    stem: เรียงลำดับขั้นตอนการคำนวณคาร์บอนฟุตพรินต์ของผลิตภัณฑ์
    items:
      - กำหนดขอบเขตการศึกษาและหน่วยการทำงาน (functional unit)
      - รวบรวมข้อมูลกิจกรรม เช่น ปริมาณพลังงานและวัตถุดิบที่ใช้
      - เลือกค่าการปล่อย (emission factor) ที่เหมาะกับข้อมูลนั้น
      - คูณข้อมูลกิจกรรมกับค่าการปล่อยแล้วรวมผลทั้งหมด
      - รายงานผลต่อหน่วยการทำงานพร้อมระบุสมมติฐาน
    hints:
      - ต้องรู้ก่อนว่าจะวัดอะไรและต่อหน่วยอะไร
      - ค่าการปล่อยเลือกได้เมื่อรู้ข้อมูลกิจกรรมที่จะคูณแล้ว
    solution: เริ่มจากกำหนดขอบเขตและหน่วยการทำงาน จากนั้นรวบรวมข้อมูลกิจกรรม เลือกค่าการปล่อย คูณและรวมผล และรายงานต่อหน่วยพร้อมสมมติฐาน
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.carbon-neutrality.p008
    topics:
      - engineering.environmental.carbon-neutrality
    difficulty: 3
    type: numeric
    stem: (ข้อมูลสมมติ) โรงงานแปรรูปอาหารในจังหวัดชลบุรีใช้น้ำมันดีเซล 500 ลิตรในหนึ่งเดือน โดยมีค่าการปล่อย 2.68 kgCO₂ ต่อลิตร และใช้ไฟฟ้า 12,000 kWh โดยมีค่าการปล่อย 0.5 kgCO₂e ต่อ kWh รวมการปล่อยทั้งสองแหล่งเท่ากับกี่ tCO₂e (ตอบทศนิยมสองตำแหน่ง)
    answer:
      value: 7.34
      tolerance: 0.01
      unit: tCO₂e
    hints:
      - คำนวณการปล่อยจากดีเซลและไฟฟ้าแยกกันก่อน แล้วรวม
      - ผลรวมเป็นกิโลกรัมต้องหารด้วย 1000 เป็นตัน
    misconceptions:
      - match: 6.0
        feedback: นับเฉพาะการปล่อยจากไฟฟ้า (Scope 2) และไม่รวมการเผาไหม้ดีเซลในสถานที่ (Scope 1)
    solution: Scope 1 จากดีเซล = 500 × 2.68 = 1,340 kg Scope 2 จากไฟฟ้า = 12,000 × 0.5 = 6,000 kg รวม = 7,340 kg = 7.34 tCO₂e ค่าสมมติทั้งสองต้องตรวจกับค่าที่หน่วยงานรับรองปัจจุบัน
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.carbon-neutrality.p009
    topics:
      - engineering.environmental.carbon-neutrality
    difficulty: 3
    type: numeric
    stem: (ข้อมูลสมมติ) จากการปล่อยรวม 7,340 kg CO₂e ในเดือนนั้น โรงงานผลิตได้ 2,000 ชิ้น การปล่อยต่อชิ้นเป็นกี่กิโลกรัม CO₂e (ตอบทศนิยมสองตำแหน่ง)
    answer:
      value: 3.67
      tolerance: 0.01
      unit: kgCO₂e ต่อชิ้น
    hints:
      - การปล่อยต่อหน่วย = การปล่อยรวม ÷ จำนวนหน่วยการทำงาน
      - ใช้หน่วยกิโลกรัมทั้งตัวตั้งและตัวหาร
    misconceptions:
      - match: 7340
        feedback: ยังไม่ได้หารด้วยจำนวนชิ้น ค่านี้คือการปล่อยรวมทั้งเดือน
    solution: การปล่อยต่อชิ้น = 7,340 ÷ 2,000 ≈ 3.67 kgCO₂e ต่อชิ้น ค่านี้เป็นฐานของคาร์บอนฟุตพรินต์ที่นำไปเปรียบเทียบได้
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.carbon-neutrality.p010
    topics:
      - engineering.environmental.carbon-neutrality
    difficulty: 3
    type: numeric
    stem: (ข้อมูลสมมติ) โรงงานใช้พลังงานหมุนเวียนแทน 30% ของไฟฟ้า 12,000 kWh โดยค่าการปล่อยของไฟฟ้าจากโครงข่ายเท่ากับ 0.5 kgCO₂e ต่อ kWh การลดการปล่อยที่ทำได้เท่ากับกี่ tCO₂e (ตอบทศนิยมหนึ่งตำแหน่ง)
    answer:
      value: 1.8
      tolerance: 0.05
      unit: tCO₂e
    hints:
      - ปริมาณไฟฟ้าที่เปลี่ยนไปเป็นพลังงานหมุนเวียน = 30% ของ 12,000 kWh
      - การปล่อยที่หลีกเลี่ยงได้ = ปริมาณที่เปลี่ยน × ค่าการปล่อยของโครงข่าย
    misconceptions:
      - match: 3.6
        feedback: ได้ปริมาณไฟฟ้าที่เปลี่ยน (3,600 kWh หรือ 3.6 MWh) แต่ยังไม่ได้คูณด้วยค่าการปล่อย 0.5 kgCO₂e ต่อ kWh
    solution: ไฟฟ้าที่เปลี่ยน = 0.3 × 12,000 = 3,600 kWh การปล่อยที่หลีกเลี่ยงได้ = 3,600 × 0.5 = 1,800 kgCO₂e = 1.8 tCO₂e
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.carbon-neutrality.p011
    topics:
      - engineering.environmental.carbon-neutrality
    difficulty: 4
    type: numeric
    stem: การเผาไหม้มีเทน (CH₄) สมบูรณ์ตามสมการ CH₄ + 2O₂ → CO₂ + 2H₂O ปล่อย CO₂ กี่กิโลกรัมต่อมีเทน 1 กิโลกรัม (ใช้ C = 12.011, H = 1.008, O = 15.999 ตอบทศนิยมสองตำแหน่ง)
    answer:
      value: 2.74
      tolerance: 0.005
      unit: kg CO₂/kg
    hints:
      - มีเทน 1 โมลให้ CO₂ 1 โมล ดังนั้นอัตราส่วนมวลคือ M(CO₂) ÷ M(CH₄)
      - คำนวณ M(CH₄) จาก C 1 อะตอมและ H 4 อะตอม
    misconceptions:
      - match: 2.75
        feedback: ปัดมวลอะตอมจนได้ 44 ÷ 16 ซึ่งเป็นค่าประมาณที่ต่างจากการคำนวณจากมวลอะตอมที่ระบุ
    solution: M(CH₄) = 16.043 g/mol M(CO₂) = 44.009 g/mol อัตราส่วน = 44.009 ÷ 16.043 ≈ 2.74 kg CO₂ ต่อ kg CH₄ ขณะที่มีเทนที่รั่วออกไปโดยไม่ถูกเผามีค่าเทียบเท่าประมาณ 28 kg CO₂e ต่อ kg (GWP100 ตาม AR5) การเผามีเทนให้เป็น CO₂ จึงลดผลต่อโลกร้อนได้มาก
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.carbon-neutrality.p012
    topics:
      - engineering.environmental.carbon-neutrality
    difficulty: 4
    type: numeric
    stem: (ข้อมูลสมมติ) องค์กรมีการปล่อยฐาน 1,200 tCO₂e ต่อปี ปีที่ 5 ลดการปล่อยได้ 35% จากฐาน และปีที่ 6 ลดเพิ่มอีก 20% จากค่าของปีที่ 5 ปีที่ 6 เหลือการปล่อยกี่ tCO₂e (ตอบจำนวนเต็ม)
    answer:
      value: 624
      tolerance: 0.5
      unit: tCO₂e
    hints:
      - ปีที่ 5 เหลือ 65% ของฐาน
      - ปีที่ 6 คือ 80% ของค่าปีที่ 5 ไม่ใช่ 80% ของค่าฐาน
    misconceptions:
      - match: 540
        feedback: รวมการลด 35% กับ 20% เป็น 55% จากฐานทีเดียว แทนที่จะคิดลดต่อจากค่าของปีก่อนหน้า
      - match: 780
