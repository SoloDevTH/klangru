# สเกล overall ของ CEFR วัดทักษะการใช้ภาษา หัวข้อไวยากรณ์อย่างเดียวจึงไม่ทำให้ผ่าน descriptor ได้ครบ
# จับคู่เฉพาะที่บทเรียนและโจทย์ฝึกภาษาที่ descriptor ระดับนั้นต้องใช้โดยตรง
# past simple และ present perfect ยังไม่ได้จับคู่ เพราะสเกล overall ไม่ได้ระบุการเล่าเรื่องในอดีตหรือประสบการณ์
# (อยู่ในสเกลย่อยที่ไฟล์ cefr.yaml ยังไม่ได้เก็บ) ส่วนหัวข้อภาษาจีนจับคู่กับ hsk-3-0 แทน
framework: cefr
mappings:
  - topic: english.grammar.present-simple
    indicators: ["CEFR-A1-written-production", "CEFR-A2-spoken-production"]
    coverage: partial
    note: "ฝึกเขียนประโยคง่ายเรื่องตัวเองและครอบครัว สิ่งที่ชอบไม่ชอบ และกิจวัตร ด้วย present simple ยังไม่ได้ฝึกพูดหรือเขียนบรรยายต่อเนื่อง"
  - topic: english.grammar.be-have-there
    indicators: [CEFR-A1-written-production, CEFR-A1-spoken-production]
    coverage: partial
    note: ผู้เรียนเขียนประโยคง่ายเรื่องตนเองและสิ่งรอบตัวตามแบบที่กำหนด (เติมคำ แปล แปลงประโยค) แต่ยังไม่ได้เขียนข้อความเรื่องตนเองอย่างอิสระ
  - topic: english.grammar.can-modals
    indicators: [CEFR-A2-spoken-interaction]
    coverage: partial
    note: ฝึกขอ อนุญาต และตอบรับในบทสนทนาสั้นที่เขียน แต่ไม่ได้ฝึกพูดโต้ตอบจริง
  - topic: english.grammar.connectors
    indicators: [CEFR-A2-written-production]
    coverage: full
    note: ผู้เรียนเขียนประโยคและวลีที่เชื่อมด้วย and, but, or, because, so และตัวเชื่อมลำดับ ทั้งเติมคำ รวมประโยค และเขียนประโยคใหม่
  - topic: english.grammar.present-continuous
    indicators: [CEFR-A2-spoken-production]
    coverage: partial
    note: สอนโครงสร้างที่ใช้บรรยายคนและสิ่งที่กำลังทำ และแยกจากกิจวัตร (present simple) ในรูปเขียน แต่ตรวจการพูดนำเสนอไม่ได้
  - topic: english.grammar.questions
    indicators: [CEFR-A1-spoken-interaction, CEFR-A2-spoken-interaction]
    coverage: partial
    note: ฝึกถามและตอบคำถามง่ายในรูปเขียนและบทสนทนาที่อ่าน แต่ไม่ได้ฝึกพูดโต้ตอบจริง
  - topic: english.speaking.greetings-introductions
    indicators: [CEFR-A1-spoken-interaction]
    coverage: partial
    note: ฝึกถามตอบคำถามง่ายเรื่องตนเองในรูปบทสนทนาที่เขียน แต่ไม่ได้ฝึกพูดโต้ตอบจริง
  - topic: english.vocabulary.classroom-language
    indicators: [CEFR-A1-listening]
    coverage: partial
    note: เป็นทักษะการฟัง แอปทดสอบได้แค่การอ่านคำสั่งที่ใช้คำเดียวกัน
  - topic: english.grammar.adjectives-comparison
    indicators: [CEFR-A2-written-production]
    coverage: partial
    note: เขียนประโยคเปรียบเทียบเป็นชุดสั้น ๆ และเชื่อมด้วย but, and, because ในตัวอย่าง แต่การเขียนเป็นชุดด้วยคำเชื่อมเป็นแกนของ english.grammar.connectors
  - topic: english.grammar.future-forms
    indicators: [CEFR-A2-spoken-interaction]
    coverage: partial
    note: ฝึกถามตอบเรื่องแผนการ เสนอช่วย และนัดหมายในบทสนทนาสั้นที่อ่านและเขียน แต่แอปไม่มีเสียงจึงไม่ได้ฝึกพูดโต้ตอบจริง
  - topic: english.grammar.nouns-articles
    indicators: [CEFR-A1-written-production]
    coverage: full
    note: เขียนวลีและประโยคง่ายเรื่องของใกล้ตัว อาหาร และครอบครัว ใช้ a/an/the รูปพหูพจน์ และ some/any ให้ถูก (รายการซื้อของ บรรยายแผงผลไม้)
  - topic: english.grammar.prepositions
    indicators: [CEFR-A1-listening]
    coverage: partial
    note: ฝึกจับข้อมูลรูปธรรมเรื่องสถานที่และเวลา (ตำแหน่ง วัน เดือน เวลา ทางเดินบนแผนที่) จากข้อความที่อ่าน แต่แอปไม่มีเสียงจึงไม่ได้ฝึกฟังจริง
  - topic: english.grammar.pronouns-possessives
    indicators: [CEFR-A1-written-production]
    coverage: full
    note: เขียนประโยคง่าย ๆ แยกกันเรื่องตนเองและครอบครัว (แนะนำพ่อ น้อง ของของตนเอง) ด้วยสรรพนาม my/mine, this/these และ whose ให้ถูกต้อง
  - topic: english.speaking.everyday-conversations
    indicators: [CEFR-A2-spoken-interaction, CEFR-B1-spoken-interaction]
    coverage: partial
    note: ครอบคลุมการแลกเปลี่ยนข้อมูลง่าย ๆ ในสถานการณ์ประจำวันที่คาดเดาได้ (ซื้อของ สั่งอาหาร ซื้อตั๋ว) ในรูปอ่านและเขียน แต่แอปไม่มีเสียงจึงไม่ได้ฝึกพูดโต้ตอบ
  - topic: english.vocabulary.self-family-numbers
    indicators: [CEFR-A1-reading]
    coverage: full
    note: อ่านคำ วลี และข้อความสั้นมากเรื่องตนเองและครอบครัว แล้วตอบคำถามหรือเลือกภาพ
  - topic: english.vocabulary.self-family-numbers
    indicators: [CEFR-A1-listening]
    coverage: partial
    note: ฝึกจับข้อมูลรูปธรรม (จำนวน สี ขนาด) จากคำและข้อความที่อ่าน แต่แอปไม่มีเสียงจึงไม่ได้ฝึกฟังจริง
  - topic: english.culture.politeness
    indicators: [CEFR-A2-spoken-interaction]
    coverage: partial
    note: เลือกถ้อยคำสุภาพในบทสนทนาประจำวันในรูปอ่านและเขียน ไม่ได้พูดโต้ตอบจริง
  - topic: english.grammar.past-continuous
    indicators: [CEFR-B1-spoken-production, CEFR-B1-written-production]
    coverage: partial
    note: เรียงเรื่องเล่าเป็นลำดับ (ฉาก เหตุการณ์ ความรู้สึก) ในรูปเขียนและเรียงประโยค แอปไม่มีเสียง
  - topic: english.listening.instructions-directions
    indicators: [CEFR-A2-listening, CEFR-B1-listening]
    coverage: partial
    note: ฝึกจับใจความและรายละเอียดของประกาศและคำแนะนำเรื่องใกล้ตัวในรูปอ่าน แอปไม่มีเสียงจึงไม่ได้ฝึกฟังจริง
  - topic: english.reading.non-text-information
    indicators: [CEFR-A2-reading]
    coverage: full
    note: อ่านข้อความสั้นที่คุ้นเคยบนป้าย ตารางเวลา แผนภูมิ และฉลาก แล้วตอบคำถาม
  - topic: english.speaking.needs-help
    indicators: [CEFR-A2-spoken-interaction]
    coverage: partial
    note: บทสนทนาสั้นในสถานการณ์ประจำวันที่คาดเดาได้ในรูปอ่านและเขียน ไม่ได้พูดโต้ตอบจริง
  - topic: english.writing.describing-self
    indicators: [CEFR-A1-written-production, CEFR-A2-written-production, CEFR-A1-written-interaction, CEFR-A2-written-interaction]
    coverage: full
    note: เขียนประโยคเรื่องส่วนตัว และเชื่อมเป็นย่อหน้าด้วย and, but, because, so
  - topic: english.writing.describing-self
    indicators: [CEFR-A2-spoken-production]
    coverage: partial
    note: บรรยายคน กิจวัตร สิ่งที่ชอบและไม่ชอบในรูปเขียน แอปไม่มีเสียงจึงไม่ได้ฝึกพูดนำเสนอ
  - topic: english.grammar.conditionals
    indicators: [CEFR-B1-spoken-interaction]
    coverage: partial
    note: สอนการให้คำแนะนำ (If I were you, I would ...) การบอกเงื่อนไขและผลที่ใช้ในการสนทนา แต่ฝึกในรูปเขียน แอปไม่มีเสียงและไม่มีคู่สนทนาจริง
  - topic: english.grammar.passive-voice
    indicators: [CEFR-B1-reading]
    coverage: partial
    note: อ่านข้อความข้อเท็จจริงสั้นที่ใช้ passive (ป้าย ฉลาก ข้อเท็จจริงทางประวัติศาสตร์) ได้ แต่ยังไม่มีบทความยาว
  - topic: english.grammar.sentence-types
    indicators: [CEFR-B1-written-production]
    coverage: partial
    note: ผู้เรียนพิมพ์ประโยคที่รวมจากประโยคสั้นด้วย who, which, that, because, although และใส่จุลภาคถูกตำแหน่ง แต่ยังไม่ได้เขียนข้อความต่อเนื่องยาวอย่างอิสระ (ตรวจอัตโนมัติไม่ได้)
  - topic: english.reading.main-idea
    indicators: [CEFR-A2-reading]
    coverage: full
    note: อ่านข้อความสั้นเรื่องที่คุ้นเคย (จดหมายข่าวโรงเรียน ย่อหน้าสั้น บทสนทนา) แล้วตอบคำถามใจความ รายละเอียด และเดาคำศัพท์จากบริบท
  - topic: english.reading.main-idea
    indicators: [CEFR-B1-reading, CEFR-A2-listening, CEFR-B1-listening]
    coverage: partial
    note: อ่านข้อความข้อเท็จจริงเรื่องป่าชายเลน ถุงพลาสติก และข่าวโรงเรียนด้วย skimming และ scanning แต่ข้อความยาว 3–6 ประโยค ยังไม่มีบทความยาวหลายย่อหน้า
  - topic: english.speaking.feelings-opinions
    indicators: [CEFR-B1-spoken-production, CEFR-B1-spoken-interaction, CEFR-B1-written-production, CEFR-B1-written-interaction]
    coverage: partial
    note: สอนสำนวนแสดงความเห็น ถามความเห็น เห็นด้วย แย้ง และตอบรับ (So do I / Neither do I) มีโจทย์จับคู่คำถามกับคำตอบและเรียงบทสนทนา แต่แอปไม่มีเสียงและไม่มีคู่สนทนาจริง
  - topic: english.writing.experiences-news
    indicators: [CEFR-B1-spoken-production, CEFR-B1-written-production, CEFR-B1-written-interaction]
    coverage: partial
    note: เรียงเรื่องเล่าประสบการณ์เป็นลำดับ (orientation → events → response) ในรูปเขียน แอปไม่มีเสียง
  - topic: english.writing.notices-announcements
    indicators: [CEFR-B1-written-interaction, CEFR-B1-written-production]
    coverage: partial
    note: สอนโครงสร้างอีเมลเชิญ (Subject, Dear ..., I'm writing to ..., Best wishes) และให้เรียงส่วนของอีเมล แต่ผู้เรียนไม่ได้เขียนอีเมลเอง
