    solution: "$\\dfrac{78}{150} = 0.52$ มากกว่า 0.5 เล็กน้อย คือรอบเอวเกินครึ่งหนึ่งของส่วนสูง ($75$ เซนติเมตร) อยู่ 3 เซนติเมตร"
