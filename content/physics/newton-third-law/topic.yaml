id: physics.dynamics.newton-third
subject: physics
title: { th: กฎการเคลื่อนที่ข้อที่ 3 ของนิวตัน, en: "Newton's third law of motion" }
summary: แรงเกิดเป็นคู่เสมอ แรงกิริยาและแรงปฏิกิริยามีขนาดเท่ากัน ทิศตรงข้าม และกระทำต่อวัตถุคนละก้อน จึงไม่หักล้างกัน พร้อมความเข้าใจผิดที่พบบ่อย
difficulty: 3.5
minutes: 30
prerequisites: [physics.dynamics.forces, physics.dynamics.newton-first]
encompasses:
  - { id: physics.dynamics.forces, weight: 0.5 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: แยกแรงที่กระทำต่อหนังสือออกจากคู่ของมัน
    problem: "หนังสือหนัก $5\\ \\mathrm{N}$ วางนิ่งบนโต๊ะ จงบอกแรงที่กระทำต่อหนังสือ และแรงคู่กิริยา–ปฏิกิริยาของแต่ละแรง พร้อมขนาด"
    figure:
      src: book-table-pairs.svg
      alt: "หนังสือวางบนโต๊ะซึ่งตั้งอยู่บนพื้นโลก ลูกศรเส้นทึบสองลูกคือแรงที่กระทำต่อหนังสือ: โลกดึงหนังสือลง (W สีส้ม) และโต๊ะดันหนังสือขึ้น (N สีเขียว) ลูกศรเส้นประสองลูกคือแรงที่หนังสือกระทำต่อสิ่งอื่น: หนังสือกดโต๊ะลง (สีเขียว) และหนังสือดึงโลกขึ้น (สีส้ม) แรงสีเดียวกันเป็นคู่กิริยา–ปฏิกิริยา"
    steps:
      - text: "แรงที่กระทำต่อหนังสือมีสองแรง: โลกดึงหนังสือลง $5\\ \\mathrm{N}$ และโต๊ะดันหนังสือขึ้น $N$"
      - text: "หนังสือนิ่ง (กฎข้อที่ 1) จึงได้ $N = 5\\ \\mathrm{N}$"
        why: "สองแรงนี้เท่ากันเพราะหนังสือสมดุล ไม่ใช่เพราะกฎข้อที่ 3 ถ้ามีคนกดหนังสือ $N$ จะมากกว่า $5\\ \\mathrm{N}$"
      - text: "สลับประธานกับกรรมหาคู่: \"โลกดึงหนังสือ\" คู่กับ \"หนังสือดึงโลกขึ้น $5\\ \\mathrm{N}$\" และ \"โต๊ะดันหนังสือ\" คู่กับ \"หนังสือกดโต๊ะลง $5\\ \\mathrm{N}$\""
      - text: "ตรวจ: แต่ละคู่เป็นแรงชนิดเดียวกัน (แรงโน้มถ่วงคู่แรงโน้มถ่วง แรงสัมผัสคู่แรงสัมผัส) และกระทำต่อวัตถุคนละก้อน"
    answer: "ต่อหนังสือ: น้ำหนัก $5\\ \\mathrm{N}$ ลง และแรงจากโต๊ะ $5\\ \\mathrm{N}$ ขึ้น คู่ของมันคือหนังสือดึงโลกขึ้น และหนังสือกดโต๊ะลง อย่างละ $5\\ \\mathrm{N}$"
  - { type: check, problem: phy.n3.p005, prompt: "หาคู่ของน้ำหนักด้วยการสลับประธานกับกรรม" }
  - type: worked-example
    title: แรงที่กล่องสองใบดันกัน
    problem: "ดันกล่อง A มวล $3\\ \\mathrm{kg}$ ด้วยแรง $20\\ \\mathrm{N}$ บนพื้นลื่น กล่อง A ดันกล่อง B มวล $2\\ \\mathrm{kg}$ ที่วางชิดอยู่ ดังภาพ จงหาความเร่ง แรงที่ A ดัน B และแรงที่ B ดัน A"
    figure:
      src: blocks-contact-3-2.svg
      alt: "กล่อง A มวล 3 kg และกล่อง B มวล 2 kg วางชิดกันบนพื้นลื่น มีแรง 20 N ดันกล่อง A จากด้านซ้ายไปทางขวา"
    steps:
      - text: "สองกล่องเคลื่อนที่ไปด้วยกัน มองเป็นก้อนเดียว: $a = \\dfrac{20}{3 + 2} = 4\\ \\mathrm{m/s^2}$"
      - text: "กล่อง B ได้รับแรงแนวราบแรงเดียวคือแรงที่ A ดัน: $F_{AB} = m_B a = 2 \\times 4 = 8\\ \\mathrm{N}$ ไปทางขวา"
      - text: "กฎข้อที่ 3: B ดัน A กลับ $8\\ \\mathrm{N}$ ไปทางซ้าย"
      - text: "ตรวจที่กล่อง A: $20 - 8 = 12\\ \\mathrm{N} = 3 \\times 4$ ✓"
        why: "แรงที่ B ดันกลับคือเหตุผลที่กล่อง A ไม่ได้เร่งด้วย $\\tfrac{20}{3}\\ \\mathrm{m/s^2}$"
    answer: "$a = 4\\ \\mathrm{m/s^2}$ A ดัน B $8\\ \\mathrm{N}$ และ B ดัน A $8\\ \\mathrm{N}$ ในทิศตรงข้าม"
  - { type: check, problem: phy.n3.p003, prompt: "รถหนักกับรถเบาชนกัน แรงเท่ากันหรือไม่" }
  - type: interactive
    title: นักสเกตสองคนผลักกัน
    caption: "นักสเกต A (60 kg) และ B (30 kg) ยืนชิดกันที่ตำแหน่ง 0 แล้วผลักกัน แรงที่ A ผลัก B และแรงที่ B ผลัก A มีขนาดเท่ากันและทิศตรงข้าม ทั้งคู่จึงไถลออกไปคนละทาง แต่ในเวลาเท่ากัน B ซึ่งมีมวลน้อยกว่า (ความเฉื่อยน้อยกว่า) ไถลไปได้ไกลเป็นสองเท่าของ A แรงเท่ากันไม่ได้แปลว่าผลต่อการเคลื่อนที่เท่ากัน"
    widget:
      kind: number-line
      min: -6
      max: 6
      points:
        - { value: -2, label: "A (60 kg)" }
        - { value: 4, label: "B (30 kg)" }
      jumps:
        - { from: 0, to: -2, label: "A ไถลไป 2 m" }
        - { from: 0, to: 4, label: "B ไถลไป 4 m" }
glossary:
  - { term: กฎข้อที่ 3 ของนิวตัน, definition: "เมื่อวัตถุ A ออกแรงกระทำต่อวัตถุ B วัตถุ B จะออกแรงกระทำต่อ A ด้วยขนาดเท่ากันและทิศตรงข้ามพร้อมกันเสมอ" }
  - { term: แรงกิริยาและแรงปฏิกิริยา, definition: "แรงคู่ที่เกิดขึ้นตามกฎข้อที่ 3 เป็นแรงชนิดเดียวกัน เกิดพร้อมกัน และกระทำต่อวัตถุคนละก้อน" }
  - { term: แรงคู่กิริยา–ปฏิกิริยา, definition: "หาได้โดยสลับประธานกับกรรม เช่น \"เท้าดันพื้น\" คู่กับ \"พื้นดันเท้า\"" }
flashcards:
  - { front: "แรงกิริยาและแรงปฏิกิริยามีลักษณะอย่างไร", back: "ขนาดเท่ากัน ทิศตรงข้าม เป็นแรงชนิดเดียวกัน เกิดพร้อมกัน และกระทำต่อวัตถุคนละก้อน" }
  - { front: "ทำไมแรงกิริยาและแรงปฏิกิริยาจึงไม่หักล้างกัน", back: "เพราะกระทำต่อวัตถุคนละก้อน แรงจะหักล้างกันได้ต้องกระทำต่อวัตถุก้อนเดียวกัน" }
  - { front: "หนังสือวางบนโต๊ะ แรงปฏิกิริยาของน้ำหนักหนังสือคือแรงใด", back: "แรงที่หนังสือดึงโลกขึ้น ไม่ใช่แรงที่โต๊ะดันหนังสือ" }
  - { front: "เวลาเดิน แรงใดดันตัวเราไปข้างหน้า", back: "แรงที่พื้นดันเท้าไปข้างหน้า ซึ่งเป็นปฏิกิริยาของแรงที่เท้าดันพื้นไปข้างหลัง" }
