    answer: { value: 109.1, tolerance: 0.5, unit: N }
    hints:
      - "ใช้ $R = \\sqrt{A^2 + B^2 + 2AB\\cos\\theta}$ หรือแยกองค์ประกอบโดยวางแรงแรกตามแกน $x$"
