strands:
  - id: ALG
    title: "Algorithms & Design"
    standards:
      - id: "ALG-PS"
        text: "Algorithmic Problem Solving"
        indicators:
          - { id: "EK-ALG-PS-01", level: "PK/K", text: "Carry out algorithms in daily activities.", note: "Practice CT7" }
          - { id: "E1-ALG-PS-01", level: "Grade 1", text: "Decompose a problem or task into individual parts to develop an algorithm.", note: "Practice CT6, CT7" }
          - { id: "E2-ALG-PS-01", level: "Grade 2", text: "Create an algorithm that includes sequence, events, and iteration to solve a problem or express an idea.", note: "Practice CT6, CT8" }
          - { id: "E3-ALG-PS-01", level: "Grade 3", text: "Create an algorithm that includes a combination of sequence, events, iteration, and selection to solve a problem or express an idea.", note: "Practice CT6, CT8" }
          - { id: "E4-ALG-PS-01", level: "Grade 4", text: "Create a written representation of an algorithm that includes a combination of sequence, events, iteration, and selection to solve a problem or express an idea.", note: "Practice CT6, CT7" }
          - { id: "E5-ALG-PS-01", level: "Grade 5", text: "Create a visual representation of an algorithm that includes variables and a combination of sequence, events, iteration, and selection to solve a problem or express an idea.", note: "Practice CT6, CT7" }
          - { id: "MS-ALG-PS-01", level: "MS", text: "Design an algorithm that includes variables of multiple data types to solve a problem or express an idea.", note: "Practice CT6, CT7" }
          - { id: "MS-ALG-PS-02", level: "MS", text: "Model a given algorithm with a flowchart or pseudocode that includes a combination of control structures and procedures.", note: "Practice CT7, CT8" }
          - { id: "MS-ALG-PS-03", level: "MS", text: "Verify the accuracy of an algorithm for given inputs.", note: "Practice CT9, HCD11" }
          - { id: "MS-ALG-PS-04", level: "MS", text: "Justify whether a problem is best solved using procedural instructions, rule-based logic, data-driven methods, or a combination of these approaches.", note: "Practice CT6; AI-related" }
          - { id: "MS-ALG-PS-05", level: "MS", text: "Use an AI tool to generate outputs that assist in solving a computational problem.", note: "Practice CT8, HCD11; AI-related" }
          - { id: "HS-ALG-PS-01", level: "HS", text: "Design an algorithm using appropriate data structures to solve a problem or express an idea.", note: "Practice CT7, CT9" }
          - { id: "HS-ALG-PS-02", level: "HS", text: "Optimize the design of an algorithm using procedural abstraction and control structures.", note: "Practice CT6, CT7" }
          - { id: "HS-ALG-PS-03", level: "HS", text: "Evaluate algorithms for efficiency, correctness, and clarity, using metrics or test cases.", note: "Practice CT9" }
          - { id: "HS-ALG-PS-04", level: "HS", text: "Describe the differences between deterministic and probabilistic algorithms.", note: "Practice CT6; AI-related" }
          - { id: "HS-ALG-PS-05", level: "HS", text: "Evaluate AI-generated output to assess bias, accuracy, and potential harms.", note: "Practice ESR1, CT9; AI-related" }
      - id: "ALG-ML"
        text: "Machine Learning"
        indicators:
          - { id: "EK-ALG-ML-02", level: "PK/K", text: "Recognize attributes of objects to notice patterns and make decisions.", note: "Practice IC3, CT7; AI-related" }
          - { id: "E1-ALG-ML-02", level: "Grade 1", text: "Recognize that AI systems are technologies that use patterns in data to make decisions or generate new things.", note: "Practice IC3, CT7; AI-related" }
          - { id: "E2-ALG-ML-02", level: "Grade 2", text: "Examine how data is used to train a machine learning model.", note: "Practice ESR1, CT7; AI-related" }
          - { id: "E3-ALG-ML-02", level: "Grade 3", text: "Investigate how a machine learning model can change when new data is added to a training set.", note: "Practice CT7, CT9; AI-related" }
          - { id: "E4-ALG-ML-02", level: "Grade 4", text: "Analyze relationships between the properties of training data and a machine learning model’s output.", note: "Practice CT9, HCD11; AI-related" }
          - { id: "E5-ALG-ML-02", level: "Grade 5", text: "Train a machine learning model to make a classification or prediction.", note: "Practice CT8, CT9; AI-related" }
          - { id: "MS-ALG-ML-06", level: "MS", text: "Hypothesize how a machine learning model generates classifications or predictions.", note: "Practice CT7, CT9; AI-related" }
          - { id: "MS-ALG-ML-07", level: "MS", text: "Investigate ways to improve the accuracy of a machine learning model and reduce bias by refining the quality of examples and nonexamples in the training data.", note: "Practice ESR1, CT9; AI-related" }
          - { id: "MS-ALG-ML-08", level: "MS", text: "Evaluate the features and limitations of a machine learning model.", note: "Practice ESR1, IC3; AI-related" }
          - { id: "HS-ALG-ML-06", level: "HS", text: "Justify the selection of a type of AI algorithm to accomplish a task.", note: "Practice IC3, CT7; AI-related" }
          - { id: "HS-ALG-ML-07", level: "HS", text: "Evaluate training data by examining its source, quality, representativeness, potential biases, and privacy implications.", note: "Practice ESR1, ESR2; AI-related" }
          - { id: "HS-ALG-ML-08", level: "HS", text: "Develop a machine learning model for a chosen task using appropriate data and tools.", note: "Practice CT8, CT9; AI-related" }
      - id: "ALG-IM"
        text: "Impacts of Algorithms & Design"
        indicators:
          - { id: "EK-ALG-IM-03", level: "PK/K", text: "Describe how people create algorithms to solve problems.", note: "Practice ESR1, IC3" }
          - { id: "E1-ALG-IM-03", level: "Grade 1", text: "Explain how a change to an algorithm leads to a different outcome.", note: "Practice ESR1, IC3" }
          - { id: "E2-ALG-IM-03", level: "Grade 2", text: "Describe how an algorithm might impact peers in varied situations.", note: "Practice ESR1, IC3" }
          - { id: "E3-ALG-IM-03", level: "Grade 3", text: "Compare how different algorithms may affect outcomes, situations, and people with a wide range of needs.", note: "Practice ESR1, IC3; AI-related" }
          - { id: "E4-ALG-IM-03", level: "Grade 4", text: "Evaluate how different algorithms for solving the same problem produce outcomes that may benefit or disadvantage different groups of people.", note: "Practice ESR1, IC3; AI-related" }
          - { id: "E5-ALG-IM-03", level: "Grade 5", text: "Articulate how human-centered design principles are incorporated into the development of a computing technology.", note: "Practice ESR1, IC3; AI-related" }
          - { id: "MS-ALG-IM-09", level: "MS", text: "Evaluate which human-centered design principles are present or missing in an existing computing technology.", note: "Practice ESR1, HCD10; AI-related" }
          - { id: "MS-ALG-IM-10", level: "MS", text: "Examine evidence of beneficial and harmful impacts, ethical issues, and biases of algorithms encountered in daily life.", note: "Practice ESR1, HCD10; AI-related" }
          - { id: "MS-ALG-IM-11", level: "MS", text: "Modify an algorithm to address a specific societal impact, ethical issue, or bias.", note: "Practice ESR1, HCD12; AI-related" }
          - { id: "HS-ALG-IM-09", level: "HS", text: "Design a computing technology using human-centered design principles.", note: "Practice CT8, HCD10; AI-related" }
          - { id: "HS-ALG-IM-10", level: "HS", text: "Evaluate the ethical implications, societal impacts, and potential biases of rule-based and data-driven algorithms.", note: "Practice ESR1, CT9; AI-related" }
          - { id: "HS-ALG-IM-11", level: "HS", text: "Articulate the values embedded in the design of an algorithmic system.", note: "Practice ESR1, HCD10; AI-related" }
  - id: PRO
    title: "Programming"
    standards:
      - id: "PRO-PD"
        text: "Program Development"
        indicators:
          - { id: "EK-PRO-PD-04", level: "PK/K", text: "Create a sequence of commands to solve a problem or express an idea.", note: "Practice CT7, CT8" }
          - { id: "E1-PRO-PD-04", level: "Grade 1", text: "Create code from an algorithm that includes sequence to solve a problem or express an idea.", note: "Practice CT7, CT8" }
          - { id: "E2-PRO-PD-04", level: "Grade 2", text: "Create code from an algorithm that includes sequence, events, and iteration to solve a problem or express an idea.", note: "Practice CT7, CT8" }
          - { id: "E3-PRO-PD-04", level: "Grade 3", text: "Develop code from a student-created algorithm that includes a combination of sequence, events, iteration, and selection to solve a problem or express an idea.", note: "Practice ESR2, CT8" }
          - { id: "E3-PRO-PD-05", level: "Grade 3", text: "Use constructive feedback to improve a program.", note: "Practice IC5, CT9" }
          - { id: "E4-PRO-PD-04", level: "Grade 4", text: "Compare different programming solutions to the same problem based on correctness and clarity.", note: "Practice IC3, CT9" }
          - { id: "E4-PRO-PD-05", level: "Grade 4", text: "Collaborate with a team by offering a meaningful contribution to creating a program.", note: "Practice IC5, CT8" }
          - { id: "E5-PRO-PD-04", level: "Grade 5", text: "Create a novel program by modifying or combining elements of existing programs.", note: "Practice ESR2, CT8" }
          - { id: "E5-PRO-PD-05", level: "Grade 5", text: "Construct individual components of a program that are collaboratively assembled into a programming project.", note: "Practice IC4, CT8" }
          - { id: "MS-PRO-PD-12", level: "MS", text: "Use a procedure to structure code for clarity and reusability.", note: "Practice CT7, CT8" }
          - { id: "MS-PRO-PD-13", level: "MS", text: "Use reference documentation in program development.", note: "Practice IC4, CT9" }
          - { id: "MS-PRO-PD-14", level: "MS", text: "Justify the importance of attribution and intellectual property when developing computing technologies.", note: "Practice ESR2, IC3" }
          - { id: "MS-PRO-PD-15", level: "MS", text: "Develop a program utilizing inclusive collaboration practices.", note: "Practice IC4, CT8" }
          - { id: "HS-PRO-PD-12", level: "HS", text: "Create a modular program that uses procedures, external libraries, or objects to improve reusability and readability.", note: "Practice CT7, CT8" }
          - { id: "HS-PRO-PD-13", level: "HS", text: "Use documentation, libraries, application programming interfaces (APIs), and other tools in program development.", note: "Practice ESR2, CT9" }
          - { id: "HS-PRO-PD-14", level: "HS", text: "Apply appropriate attribution of intellectual property when developing a computing technology.", note: "Practice ESR2, IC3" }
          - { id: "HS-PRO-PD-15", level: "HS", text: "Collaborate on a programming project using a defined workflow that includes design documentation and clear task roles.", note: "Practice IC4, IC5" }
      - id: "PRO-VD"
        text: "Variables & Data Storage"
        indicators:
          - { id: "EK-PRO-VD-05", level: "PK/K", text: "Identify everyday gestures and symbols that represent information people use to make choices.", note: "Practice IC3, CT7" }
          - { id: "E1-PRO-VD-05", level: "Grade 1", text: "Identify terms that refer to data values that change over time in everyday life.", note: "Practice IC3, CT7" }
          - { id: "E2-PRO-VD-05", level: "Grade 2", text: "Label different representations of information with a name and whether its value is constant or changes.", note: "Practice IC3, CT7" }
          - { id: "E3-PRO-VD-06", level: "Grade 3", text: "Identify the variables being stored and manipulated in a program.", note: "Practice IC3, CT7" }
          - { id: "E4-PRO-VD-06", level: "Grade 4", text: "Trace how data flows and changes variable values in a program.", note: "Practice CT7, CT9" }
          - { id: "E5-PRO-VD-06", level: "Grade 5", text: "Use variables to store, compare, and modify data within a program.", note: "Practice CT7, CT8" }
          - { id: "MS-PRO-VD-16", level: "MS", text: "Use variables of multiple data types to store, access, and manipulate data within a program.", note: "Practice CT7, CT8" }
          - { id: "HS-PRO-VD-16", level: "HS", text: "Create a program that uses appropriate data structures to store, access, and manipulate data.", note: "Practice CT7, CT8" }
      - id: "PRO-RD"
        text: "Reading & Documenting"
        indicators:
          - { id: "EK-PRO-RD-06", level: "PK/K", text: "Describe how a sequence of commands completes a task.", note: "Practice IC3, CT6" }
          - { id: "E1-PRO-RD-06", level: "Grade 1", text: "Explain the function of code that includes an event and sequence.", note: "Practice IC3, CT6" }
          - { id: "E2-PRO-RD-06", level: "Grade 2", text: "Explain the steps taken to create a program.", note: "Practice ESR2, IC3" }
          - { id: "E3-PRO-RD-07", level: "Grade 3", text: "Articulate how a specific segment of code contributes to the overall purpose of a program.", note: "Practice IC3, CT6" }
          - { id: "E4-PRO-RD-07", level: "Grade 4", text: "Document a program to clarify its functionality.", note: "Practice IC3, CT6" }
          - { id: "E5-PRO-RD-07", level: "Grade 5", text: "Create embedded or external documentation for a programming project.", note: "Practice IC4, CT6" }
          - { id: "MS-PRO-RD-17", level: "MS", text: "Analyze the roles of iteration, selection, variables, and procedures in a segment of code.", note: "Practice IC3, CT7" }
          - { id: "MS-PRO-RD-18", level: "MS", text: "Analyze AI-generated code for accuracy and usability in a programming project.", note: "Practice CT9, HCD11; AI-related" }
          - { id: "HS-PRO-RD-17", level: "HS", text: "Analyze how a segment of code works, including the role of parameters, return values, and data structures.", note: "Practice CT6, CT7" }
          - { id: "HS-PRO-RD-18", level: "HS", text: "Evaluate AI-generated code for accuracy, reliability, and alignment with program requirements.", note: "Practice CT6, CT9; AI-related" }
      - id: "PRO-TR"
        text: "Testing & Refining"
        indicators:
          - { id: "EK-PRO-TR-07", level: "PK/K", text: "Identify a step in a sequence of commands that does not work as expected.", note: "Practice CT6, CT9" }
          - { id: "E1-PRO-TR-07", level: "Grade 1", text: "Debug a program that includes a sequence of commands.", note: "Practice CT6, CT9" }
          - { id: "E2-PRO-TR-07", level: "Grade 2", text: "Debug a program that includes sequence, events, and iteration.", note: "Practice CT6, CT9" }
          - { id: "E3-PRO-TR-08", level: "Grade 3", text: "Debug a program that includes a combination of sequence, events, iteration, and selection.", note: "Practice CT6, CT9" }
          - { id: "E4-PRO-TR-08", level: "Grade 4", text: "Debug a program incrementally and repeatedly throughout the development process.", note: "Practice CT9, HCD11" }
          - { id: "E5-PRO-TR-08", level: "Grade 5", text: "Debug a program using systematic strategies.", note: "Practice CT9, HCD11" }
          - { id: "MS-PRO-TR-19", level: "MS", text: "Use systematic strategies to test, refine, and document changes to a computing technology to meet the intended purpose.", note: "Practice IC4, CT9" }
          - { id: "MS-PRO-TR-20", level: "MS", text: "Refine a computing technology based on user feedback to improve its usability and accessibility.", note: "Practice HCD10, HCD11" }
          - { id: "HS-PRO-TR-19", level: "HS", text: "Evaluate a computing technology’s alignment with design specifications and responsible design values, including its correctness, effectiveness, and user experience.", note: "Practice CT9, HCD11" }
          - { id: "HS-PRO-TR-20", level: "HS", text: "Refine a computing technology based on user feedback, testing results, and responsible design values to improve its effectiveness and impact.", note: "Practice HCD10, HCD11" }
  - id: DAT
    title: "Data & Analysis"
    standards:
      - id: "DAT-DC"
        text: "Data Collection & Preparation"
        indicators:
          - { id: "EK-DAT-DC-08", level: "PK/K", text: "Use collected data to help answer questions.", note: "Practice IC3, CT7" }
          - { id: "E1-DAT-DC-08", level: "Grade 1", text: "Use multiple methods to collect both numeric and non-numeric data to help answer questions.", note: "Practice IC3, CT7" }
          - { id: "E2-DAT-DC-08", level: "Grade 2", text: "Compare numeric and non-numeric types of data in terms of how they are collected and what information they provide.", note: "Practice IC3, CT7" }
          - { id: "E3-DAT-DC-09", level: "Grade 3", text: "Evaluate numeric and non-numeric data for accuracy and completeness.", note: "Practice IC3, CT7" }
          - { id: "E4-DAT-DC-09", level: "Grade 4", text: "Organize collected data into a table using a computational tool, with rows representing records and columns representing attributes.", note: "Practice CT8" }
          - { id: "E5-DAT-DC-09", level: "Grade 5", text: "Use computational tools to collect and organize different types of data.", note: "Practice CT8, CT9" }
          - { id: "MS-DAT-DC-21", level: "MS", text: "Evaluate how different levels of precision and granularity in data collection affect accuracy, storage, and analysis.", note: "Practice IC3, CT7" }
          - { id: "MS-DAT-DC-22", level: "MS", text: "Explain how data and its associated metadata can be used to answer questions.", note: "Practice ESR2, IC3" }
          - { id: "MS-DAT-DC-23", level: "MS", text: "Use a computational tool to sort, filter, group, and summarize structured data.", note: "Practice IC3, CT7" }
          - { id: "MS-DAT-DC-24", level: "MS", text: "Analyze options to address a data quality issue.", note: "Practice CT9, HCD11" }
          - { id: "HS-DAT-DC-21", level: "HS", text: "Use a computational tool to generate simulated data that fits certain parameters for use in a simulation.", note: "Practice CT8, HCD12" }
          - { id: "HS-DAT-DC-22", level: "HS", text: "Create a data dictionary that describes the name, type, and allowable values for each attribute and the logical relationships between variables in a dataset.", note: "Practice CT7, CT8" }
          - { id: "HS-DAT-DC-23", level: "HS", text: "Use a computational tool to clean and organize text-based data.", note: "Practice CT9, HCD11" }
          - { id: "HS-DAT-DC-24", level: "HS", text: "Evaluate different approaches to verifying consistency and compliance with expected data types, values, and ranges.", note: "Practice CT6, CT7" }
      - id: "DAT-DI"
        text: "Data Investigation"
        indicators:
          - { id: "EK-DAT-DI-09", level: "PK/K", text: "Investigate a question that can be answered by collecting data in students’ everyday environments.", note: "Practice IC3, CT6" }
