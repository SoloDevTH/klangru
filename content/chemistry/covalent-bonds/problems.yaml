problems:
  - id: chem.cov.p001
    topics: [chemistry.bonding.covalent]
    difficulty: 1
    type: mcq
    stem: "พันธะโคเวเลนต์เกิดขึ้นอย่างไร"
    choices:
      - { id: a, text: "อะตอมอโลหะสองอะตอมใช้คู่อิเล็กตรอนร่วมกัน", correct: true, feedback: "ถูก คู่อิเล็กตรอนที่ใช้ร่วมกันนับให้ทั้งสองอะตอม จึงช่วยให้ทั้งคู่ครบออกเตต" }
      - { id: b, text: "อะตอมโลหะให้อิเล็กตรอนแก่อะตอมอโลหะ", feedback: "นั่นคือการเกิดพันธะไอออนิก เช่น ในเกลือแกง NaCl ซึ่งอิเล็กตรอนย้ายไปเลย ไม่ได้ใช้ร่วมกัน" }
      - { id: c, text: "โปรตอนในนิวเคลียสของสองอะตอมรวมกัน", feedback: "ปฏิกิริยาเคมีไม่เปลี่ยนนิวเคลียส ถ้าโปรตอนเปลี่ยนจะกลายเป็นคนละธาตุ พันธะเคมีเกี่ยวกับเวเลนซ์อิเล็กตรอนเท่านั้น" }
    hints:
      - "พันธะเคมีเกี่ยวข้องกับเวเลนซ์อิเล็กตรอน"
      - "คำว่า โค (co-) แปลว่า ร่วมกัน"
    solution: "พันธะโคเวเลนต์เกิดเมื่ออะตอม (มักเป็นอโลหะ) นำเวเลนซ์อิเล็กตรอนมาใช้ร่วมกันเป็นคู่ เพื่อให้แต่ละอะตอมมีอิเล็กตรอนชั้นนอกสุดครบ 8 (หรือ 2 สำหรับ H)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.cov.p002
    topics: [chemistry.bonding.covalent]
    difficulty: 1
    type: numeric
    stem: "สูตรโครงสร้างของมีเทน ($\\mathrm{CH_4}$) คือคาร์บอนอยู่ตรงกลาง ต่อกับไฮโดรเจน 4 อะตอมด้วยพันธะเดี่ยว โมเลกุลนี้มีพันธะโคเวเลนต์ทั้งหมดกี่พันธะ"
    answer: { value: 4, unit: พันธะ }
    hints:
      - "นับเส้นในสูตรโครงสร้าง หนึ่งเส้นคือหนึ่งพันธะ"
      - "ไฮโดรเจนแต่ละอะตอมต่อกับคาร์บอนด้วยพันธะเดียว"
    misconceptions:
      - { match: 5, feedback: "5 คือจำนวนอะตอม (C 1 + H 4) พันธะคือเส้นที่เชื่อมระหว่างอะตอม" }
      - { match: 8, feedback: "8 คือจำนวนอิเล็กตรอนที่ใช้ร่วมกัน (4 คู่) แต่หนึ่งพันธะเดี่ยวคือหนึ่งคู่" }
    solution: "คาร์บอนต่อกับไฮโดรเจน 4 อะตอม อะตอมละ 1 พันธะ รวม **4 พันธะ** (C–H) ใช้อิเล็กตรอนร่วมกัน 4 คู่ หรือ 8 ตัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.cov.p003
    topics: [chemistry.bonding.covalent]
    difficulty: 2
    type: match
    stem: "จับคู่โมเลกุลกับรูปร่าง"
    pairs:
      - { left: "$\\mathrm{CH_4}$", right: "ทรงสี่หน้า" }
      - { left: "$\\mathrm{NH_3}$", right: "พีระมิดฐานสามเหลี่ยม" }
      - { left: "$\\mathrm{H_2O}$", right: "มุมงอ" }
      - { left: "$\\mathrm{CO_2}$", right: "เส้นตรง" }
    hints:
      - "นับพันธะและคู่อิเล็กตรอนโดดเดี่ยวรอบอะตอมกลางของแต่ละโมเลกุล"
      - "กลุ่มอิเล็กตรอน 4 กลุ่มรอบอะตอมกลางชี้ไปทางมุมของทรงสี่หน้า ถ้าบางกลุ่มเป็นคู่โดดเดี่ยว เราจะเห็นเฉพาะตำแหน่งของอะตอม รูปร่างจึงเปลี่ยนไป ส่วนอะตอมกลางที่มีกลุ่มอิเล็กตรอนแค่ 2 ทิศจะอยู่ในแนวเดียวกัน"
    solution: "$\\mathrm{CH_4}$ 4 พันธะ → ทรงสี่หน้า · $\\mathrm{NH_3}$ 3 พันธะ 1 คู่โดดเดี่ยว → พีระมิดฐานสามเหลี่ยม · $\\mathrm{H_2O}$ 2 พันธะ 2 คู่โดดเดี่ยว → มุมงอ · $\\mathrm{CO_2}$ พันธะคู่ 2 พันธะ ไม่มีคู่โดดเดี่ยว → เส้นตรง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.cov.p004
    topics: [chemistry.bonding.covalent]
    difficulty: 2
    type: numeric
    stem: "ถุงขนมกรุบกรอบหลายยี่ห้ออัดแก๊สไนโตรเจน ($\\mathrm{N_2}$) ไว้กันขนมแตกและไม่ให้เหม็นหืน ไนโตรเจนมีเวเลนซ์อิเล็กตรอน 5 ตัว อะตอม N สองอะตอมในโมเลกุล $\\mathrm{N_2}$ ใช้อิเล็กตรอนร่วมกันกี่ **คู่**"
    answer: { value: 3, unit: คู่ }
    hints:
      - "N แต่ละอะตอมต้องการอิเล็กตรอนเพิ่มอีกกี่ตัวจึงครบ 8"
      - "แต่ละคู่ที่ใช้ร่วมกันเพิ่มอิเล็กตรอนให้อะตอมหนึ่งได้ 1 ตัว"
    misconceptions:
      - { match: 1, feedback: "ถ้าใช้ร่วมกันแค่คู่เดียว N แต่ละตัวจะมีอิเล็กตรอนรอบตัวเพียง 6 ตัว ยังไม่ครบออกเตต" }
      - { match: 6, feedback: "6 คือจำนวนอิเล็กตรอนที่ใช้ร่วมกัน โจทย์ถามจำนวนคู่ (หนึ่งคู่ = 2 ตัว)" }
    solution: "N มีเวเลนซ์อิเล็กตรอน 5 ตัว ขาดอีก 3 ตัว จึงใช้อิเล็กตรอนร่วมกัน **3 คู่** เกิดพันธะสาม N≡N ตรวจ: N แต่ละตัวมีพันธะสาม (6 ตัว) และคู่โดดเดี่ยว 1 คู่ (2 ตัว) รวม 8 ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.cov.p005
    topics: [chemistry.bonding.covalent]
    difficulty: 3
    type: numeric
    stem: "ในโมเลกุลน้ำ ($\\mathrm{H_2O}$) ออกซิเจน (เวเลนซ์อิเล็กตรอน 6 ตัว) ต่อกับไฮโดรเจน 2 อะตอมด้วยพันธะเดี่ยว ออกซิเจนมีคู่อิเล็กตรอนโดดเดี่ยวกี่คู่"
    answer: { value: 2, unit: คู่ }
    hints:
      - "พันธะเดี่ยวสองพันธะใช้เวเลนซ์อิเล็กตรอนของออกซิเจนเองไปกี่ตัว"
      - "เวเลนซ์อิเล็กตรอนที่เหลือของออกซิเจนจับกันเป็นคู่"
    misconceptions:
      - { match: 4, feedback: "4 คือจำนวนอิเล็กตรอนที่เหลือ โจทย์ถามจำนวนคู่ ให้หารด้วย 2" }
      - { match: 0, feedback: "คู่โดดเดี่ยวไม่ปรากฏในสูตร H–O–H แต่ยังอยู่บนออกซิเจน ลองนับเวเลนซ์อิเล็กตรอนที่ยังไม่ได้ใช้" }
    solution: "ออกซิเจนใช้เวเลนซ์อิเล็กตรอนของตัวเอง 2 ตัวในพันธะ O–H สองพันธะ เหลือ $6 - 2 = 4$ ตัว จับเป็น **2 คู่** ตรวจ: รอบ O มีพันธะ 2 คู่ + คู่โดดเดี่ยว 2 คู่ = 8 ตัว ✓ คู่โดดเดี่ยวสองคู่นี้เองที่ทำให้น้ำเป็นมุมงอ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.cov.p006
    topics: [chemistry.bonding.covalent]
    difficulty: 3
    type: text
    stem: "พันธะระหว่างคาร์บอนกับออกซิเจนแต่ละพันธะในโมเลกุล $\\mathrm{CO_2}$ เป็นพันธะชนิดใด (ตอบ: เดี่ยว, คู่ หรือ สาม)"
    accepted: ["คู่", "พันธะคู่", "double", "double bond"]
    misconceptions:
      - { match: "เดี่ยว", feedback: "ถ้าเป็นพันธะเดี่ยว O–C–O คาร์บอนจะมีอิเล็กตรอนรอบตัวเพียง 4 ตัว ยังไม่ครบออกเตต" }
      - { match: "พันธะเดี่ยว", feedback: "ถ้าเป็นพันธะเดี่ยว O–C–O คาร์บอนจะมีอิเล็กตรอนรอบตัวเพียง 4 ตัว ยังไม่ครบออกเตต" }
      - { match: "สาม", feedback: "ถ้าเป็นพันธะสามทั้งสองข้าง คาร์บอนจะมีอิเล็กตรอนรอบตัว 12 ตัว เกินออกเตต คาร์บอนสร้างได้ 4 พันธะ แบ่งให้ออกซิเจนสองตัวเท่า ๆ กัน" }
    hints:
      - "คาร์บอนสร้างได้ 4 พันธะ ออกซิเจนสร้างได้ 2 พันธะ"
      - "คาร์บอนต้องแบ่ง 4 พันธะให้ออกซิเจน 2 อะตอมเท่า ๆ กัน"
    solution: "C ต้องการ 4 พันธะ O แต่ละตัวต้องการ 2 พันธะ จึงได้ O=C=O เป็น **พันธะคู่** สองพันธะ C มีอิเล็กตรอนรอบตัว $4 + 4 = 8$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.cov.p007
    topics: [chemistry.bonding.covalent]
    difficulty: 3
    type: numeric
    stem: "แอมโมเนีย ($\\mathrm{NH_3}$) ใช้ทำปุ๋ยยูเรียที่เกษตรกรไทยใช้ในนาข้าว โมเลกุลแอมโมเนียหนึ่งโมเลกุลมีเวเลนซ์อิเล็กตรอนรวมกี่ตัว (N มีเลขอะตอม 7, H มีเลขอะตอม 1)"
    answer: { value: 8, unit: ตัว }
    hints:
      - "นับเฉพาะเวเลนซ์อิเล็กตรอน (ชั้นนอกสุด) ไม่ใช่อิเล็กตรอนทั้งหมด"
      - "N จัดเรียงเป็น 2, 5 ส่วน H มีอิเล็กตรอน 1 ตัว"
      - "รวมเวเลนซ์อิเล็กตรอนของ N หนึ่งอะตอมกับ H สามอะตอม"
    misconceptions:
      - { match: 10, feedback: "ดูเหมือนใช้เลขอะตอม 7 ของ N ซึ่งรวมอิเล็กตรอนชั้นในด้วย เวเลนซ์อิเล็กตรอนของ N มี 5 ตัว" }
      - { match: 6, feedback: "ดูเหมือนนับ H แค่อะตอมเดียว สูตร $\\mathrm{NH_3}$ มีไฮโดรเจน 3 อะตอม" }
    solution: "N: 2, 5 → เวเลนซ์ 5 ตัว · H: 1 ตัว × 3 อะตอม = 3 ตัว รวม $5 + 3 = 8$ ตัว (เป็นพันธะ N–H 3 คู่ และคู่โดดเดี่ยวบน N 1 คู่)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.cov.p008
    topics: [chemistry.bonding.covalent]
    difficulty: 4
    type: mcq
    stem: "แท็กซี่ในกรุงเทพฯ หลายคันใช้เชื้อเพลิง NGV ซึ่งส่วนใหญ่เป็นมีเทน ($\\mathrm{CH_4}$) โมเลกุลมีเทนจริงในสามมิติมีรูปร่างและมุมพันธะ H–C–H เท่าใด"
    choices:
      - { id: a, text: "ทรงสี่หน้า มุมประมาณ 109.5°", correct: true, feedback: "ถูก คู่อิเล็กตรอน 4 คู่ผลักกันให้ห่างกันมากที่สุดในสามมิติ จึงชี้ไปยังมุมของทรงสี่หน้า" }
      - { id: b, text: "สี่เหลี่ยมแบนราบ มุม 90°", feedback: "นั่นคือรูปที่วาดบนกระดาษ ในสามมิติพันธะทั้งสี่แยกห่างกันได้มากกว่า 90° คือราว 109.5°" }
      - { id: c, text: "พีระมิดฐานสามเหลี่ยม มุมประมาณ 107°", feedback: "นั่นคือแอมโมเนีย ซึ่งมีคู่โดดเดี่ยว 1 คู่ คาร์บอนในมีเทนไม่มีคู่โดดเดี่ยว" }
      - { id: d, text: "เส้นตรง มุม 180°", feedback: "มุม 180° ใช้กับอะตอมกลางที่มีกลุ่มอิเล็กตรอนแค่ 2 ทิศ เช่น $\\mathrm{CO_2}$ มีเทนมี 4 ทิศ" }
    hints:
      - "นับพันธะและคู่โดดเดี่ยวรอบคาร์บอน"
      - "คู่อิเล็กตรอน 4 คู่ผลักกันให้ห่างที่สุดในสามมิติ ไม่ใช่บนแผ่นกระดาษ"
    solution: "C ในมีเทนมีพันธะเดี่ยว 4 พันธะ ไม่มีคู่โดดเดี่ยว คู่อิเล็กตรอนทั้งสี่ผลักกันจนชี้ไปยังมุมของทรงสี่หน้า มุม H–C–H ประมาณ 109.5°"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.cov.p009
    topics: [chemistry.bonding.covalent]
    difficulty: 4
    type: numeric
    stem: "โมเลกุล $\\mathrm{CO_2}$ (O=C=O) มีอิเล็กตรอนที่ใช้ร่วมกันในพันธะทั้งหมดกี่ **ตัว**"
    answer: { value: 8, unit: ตัว }
    hints:
      - "พันธะคู่หนึ่งพันธะใช้อิเล็กตรอนร่วมกันกี่คู่"
      - "หนึ่งคู่คืออิเล็กตรอน 2 ตัว และในโมเลกุลมีพันธะคู่ 2 พันธะ"
    misconceptions:
      - { match: 4, feedback: "4 คือจำนวนคู่ (พันธะคู่ 2 พันธะ × 2 คู่) โจทย์ถามจำนวนตัว หนึ่งคู่มี 2 ตัว" }
      - { match: 2, feedback: "2 คือจำนวนพันธะ แต่ละพันธะเป็นพันธะคู่ซึ่งใช้อิเล็กตรอน 4 ตัว" }
    solution: "พันธะคู่ 1 พันธะ = 2 คู่ = 4 ตัว มี 2 พันธะ รวม $2 \\times 4 = 8$ ตัว (อีก 8 ตัวจาก 16 ตัวเป็นคู่โดดเดี่ยวบนออกซิเจน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.cov.p010
    topics: [chemistry.bonding.covalent]
    difficulty: 4
    type: order
    stem: "เรียงขั้นตอนการเขียนโครงสร้างของโมเลกุลโคเวเลนต์ให้ถูกต้อง"
    items:
      - "นับเวเลนซ์อิเล็กตรอนของทุกอะตอมรวมกัน"
      - "เลือกอะตอมกลาง (อะตอมที่สร้างพันธะได้มากที่สุด ไม่ใช่ H)"
      - "ต่ออะตอมรอบนอกกับอะตอมกลางด้วยพันธะเดี่ยว"
      - "เติมคู่โดดเดี่ยวให้อะตอมรอบนอกครบออกเตต แล้ววางอิเล็กตรอนที่เหลือบนอะตอมกลาง"
      - "ถ้าอะตอมกลางยังไม่ครบออกเตต ย้ายคู่โดดเดี่ยวจากอะตอมรอบนอกมาเป็นพันธะคู่หรือสาม"
    hints:
      - "ต้องรู้ก่อนว่ามีอิเล็กตรอนให้ใช้กี่ตัว"
      - "โครงกระดูกของโมเลกุล (ใครต่อกับใคร) มาก่อนการเติมคู่โดดเดี่ยว"
      - "การเปลี่ยนเป็นพันธะคู่หรือสามเป็นขั้นแก้ไขเมื่อตรวจแล้วยังไม่ครบออกเตต"
    solution: "นับเวเลนซ์อิเล็กตรอน → เลือกอะตอมกลาง → ต่อพันธะเดี่ยว → เติมคู่โดดเดี่ยว → ถ้าอะตอมกลางไม่ครบ 8 ให้สร้างพันธะคู่หรือสาม เช่น $\\mathrm{CO_2}$ ต้องใช้ขั้นสุดท้ายจึงได้ O=C=O"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chem.cov.p011
    topics: [chemistry.bonding.covalent]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "$\\mathrm{H_2O}$ และ $\\mathrm{CO_2}$ ต่างก็มี 3 อะตอม แต่น้ำเป็นมุมงอ ส่วน $\\mathrm{CO_2}$ เป็นเส้นตรง ข้อใดอธิบายได้ถูกต้อง (เลือกได้หลายข้อ)"
    choices:
