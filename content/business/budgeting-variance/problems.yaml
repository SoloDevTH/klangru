  ai_assisted: true
- id: business.accounting.budgeting-variance.p014
  topics:
  - business.accounting.budgeting-variance
  difficulty: 4
  type: numeric
  stem: จากงบประมาณการผลิตกาแฟสกัดเย็น $4{,}200$ ขวด แต่ละขวดใช้เมล็ดกาแฟ $0.25$ กิโลกรัม ต้องการเมล็ดคงเหลือปลายเดือน $150$ กิโลกรัม มีต้นเดือน $200$ กิโลกรัม ราคาเมล็ดกิโลกรัมละ $600$ บาท (สมมติ) งบประมาณซื้อเมล็ดกาแฟเป็นกี่บาท (ตอบเป็นบาท)
  answer:
    value: 600000
    unit: บาท
  misconceptions:
  - match: 630000
    feedback: ลืมปรับวัตถุดิบต้นงวดและปลายงวด
  - match: 840000
    feedback: บวกวัตถุดิบต้นงวด ต้องลบออก
  hints:
  - วัตถุดิบที่ใช้ผลิต $= 4{,}200 \times 0.25$
  - ซื้อ $=$ ใช้ $+$ ปลายงวดที่ต้องการ $-$ ต้นงวด แล้วคูณราคา
  solution: ใช้ผลิต $= 1{,}050$ กก. ซื้อ $= 1{,}050 + 150 - 200 = 1{,}000$ กก. เป็นเงิน $= 1{,}000 \times 600 = 600{,}000$ บาท
