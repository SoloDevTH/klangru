problems:
  - id: chemistry.lab.safety-measurement.p001
    topics: [chemistry.lab.safety-measurement]
    difficulty: 1
    type: mcq
    stem: "ระหว่างทดลอง สารละลายกรดกระเด็นเข้าตาเพื่อน สิ่งแรกที่ควรทำคืออะไร"
    choices:
      - { id: a, text: "พาไปล้างตาด้วยน้ำสะอาดที่ไหลผ่านอย่างน้อย 15 นาที และแจ้งครู", correct: true, feedback: "ถูก น้ำปริมาณมากชะสารออกได้เร็วที่สุด" }
      - { id: b, text: "หยดสารละลายเบสลงในตาเพื่อสะเทินกรด", feedback: "อันตรายมาก เบสกัดตาได้เช่นกัน และปฏิกิริยาสะเทินให้ความร้อน" }
      - { id: c, text: "ให้หลับตาแน่น ๆ แล้วขยี้ตา", feedback: "การหลับตาทำให้สารค้างในตา และการขยี้ทำให้กระจกตาบาดเจ็บ" }
      - { id: d, text: "รอดูอาการ 10 นาทีก่อน ถ้าแสบมากค่อยล้าง", feedback: "ทุกวินาทีสำคัญ ต้องล้างทันที" }
    hints:
      - "สิ่งที่ปลอดภัยที่สุดในการชะสารเคมีออกคืออะไร"
      - "ดูตารางการจัดการอุบัติเหตุในบทเรียน"
    solution: "ล้างตา **ทันที** ด้วยน้ำสะอาดที่ไหลผ่าน (ที่ล้างตาฉุกเฉิน) อย่างน้อย 15 นาที ลืมตาและกลอกตาขณะล้าง แจ้งครู แล้วพบแพทย์ ห้ามใช้สารอื่นสะเทิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.lab.safety-measurement.p002
    topics: [chemistry.lab.safety-measurement]
    difficulty: 1
    type: mcq
    stem: "นักเรียนพบขวดสารใสไม่มีฉลากบนโต๊ะปฏิบัติการ ควรทำอย่างไร"
    choices:
      - { id: a, text: "ไม่ใช้ ไม่ดม ไม่ชิม และแจ้งครู", correct: true, feedback: "ถูก สารที่ไม่รู้ชนิดต้องถือว่าอันตรายไว้ก่อน" }
      - { id: b, text: "ยกขึ้นดมใกล้ ๆ ว่ามีกลิ่นไหม", feedback: "ห้ามดมสารโดยตรง ไอของสารบางชนิดเป็นพิษหรือกัดเยื่อบุจมูก" }
      - { id: c, text: "แตะปลายนิ้วชิมเล็กน้อย ถ้าไม่มีรสก็เป็นน้ำ", feedback: "ห้ามชิมสารเคมีเด็ดขาด สารพิษหลายชนิดไม่มีรสและใสเหมือนน้ำ" }
    hints:
      - "สารใสไม่จำเป็นต้องเป็นน้ำ"
      - "ข้อปฏิบัติข้อใดเกี่ยวกับการดมและการชิม"
    solution: "สารที่ไม่มีฉลาก **ห้ามใช้ ห้ามดม ห้ามชิม** ให้แจ้งครูเพื่อจัดการ กรดเจือจาง เมทานอล หรือสารพิษหลายชนิดใสไม่มีสีเหมือนน้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.lab.safety-measurement.p003
    topics: [chemistry.lab.safety-measurement]
    difficulty: 2
    type: mcq
    stem: "ขวดโพแทสเซียมเปอร์แมงกาเนตมีสัญลักษณ์ GHS ดังภาพ สัญลักษณ์นี้หมายถึงอะไร"
    figure:
      src: p-ghs-rondflam.svg
      alt: "สัญลักษณ์ GHS กรอบสี่เหลี่ยมขนมเปียกปูนขอบแดง ภายในเป็นเปลวไฟสีดำลุกอยู่เหนือวงกลม"
      credit: "GHS pictogram, Wikimedia Commons (สาธารณสมบัติ)"
      source: "https://commons.wikimedia.org/wiki/File:GHS-pictogram-rondflam.svg"
      license: PD
    choices:
      - { id: a, text: "สารออกซิไดซ์ ช่วยให้สารอื่นติดไฟหรือลุกไหม้รุนแรงขึ้น", correct: true, feedback: "ถูก เปลวไฟเหนือวงกลม (ออกซิเจน) คือสารออกซิไดซ์" }
      - { id: b, text: "สารไวไฟ ตัวมันเองติดไฟง่าย", feedback: "สารไวไฟเป็นเปลวไฟเหนือเส้นตรง ไม่มีวงกลม" }
      - { id: c, text: "วัตถุระเบิด", feedback: "วัตถุระเบิดเป็นรูปลูกระเบิดแตกกระจาย" }
    hints:
      - "สังเกตว่าใต้เปลวไฟเป็นวงกลม ไม่ใช่เส้นตรง"
      - "วงกลมแทนออกซิเจน ซึ่งช่วยให้ไฟลุก"
    solution: "เปลวไฟเหนือวงกลมคือ **สารออกซิไดซ์** สารนี้ไม่จำเป็นต้องติดไฟเอง แต่ให้ออกซิเจนจนสารอื่นลุกไหม้รุนแรง จึงต้องเก็บให้ห่างจากสารไวไฟ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.lab.safety-measurement.p004
    topics: [chemistry.lab.safety-measurement]
    difficulty: 2
    type: mcq
    stem: "ขวดสารละลายโซเดียมไฮดรอกไซด์มีสัญลักษณ์ดังภาพ ข้อใดเป็นการป้องกันที่จำเป็นที่สุด"
    figure:
      src: p-ghs-acid.svg
      alt: "สัญลักษณ์ GHS ขอบแดง ภายในมีหลอดทดลองสองหลอดเทของเหลวลงบนแผ่นโลหะและบนมือ ทั้งสองจุดมีรอยกัดกร่อนเป็นควัน"
      credit: "GHS pictogram, Wikimedia Commons (สาธารณสมบัติ)"
      source: "https://commons.wikimedia.org/wiki/File:GHS-pictogram-acid.svg"
      license: PD
    choices:
      - { id: a, text: "สวมแว่นตานิรภัยและถุงมือ เพราะสารกัดผิวหนังและตา", correct: true, feedback: "ถูก สัญลักษณ์นี้คือสารกัดกร่อน" }
      - { id: b, text: "เก็บให้ห่างจากเปลวไฟ เพราะติดไฟง่าย", feedback: "สัญลักษณ์นี้ไม่ใช่รูปเปลวไฟ" }
      - { id: c, text: "เปิดฝาดมได้ เพราะอันตรายเฉพาะเมื่อกลืน", feedback: "ภาพแสดงมือที่ถูกสารกัด อันตรายเมื่อสัมผัส และห้ามดมสารโดยตรงอยู่แล้ว" }
    hints:
      - "ภาพแสดงของเหลวหยดลงบนอะไรบ้าง"
      - "ถ้าสารกัดมือและโลหะได้ ส่วนใดของร่างกายต้องป้องกัน"
    solution: "รูปของเหลวกัดโลหะและมือคือ **สารกัดกร่อน** (เช่น กรดและเบสเข้มข้น) ต้องสวมแว่นตานิรภัยและถุงมือ ถ้าหกโดนผิวให้ล้างด้วยน้ำปริมาณมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.lab.safety-measurement.p005
    topics: [chemistry.lab.safety-measurement]
    difficulty: 2
    type: mcq
    stem: "สัญลักษณ์ในภาพเตือนถึงอันตรายแบบใด"
    figure:
      src: p-ghs-silhouette.svg
      alt: "สัญลักษณ์ GHS ขอบแดง ภายในเป็นภาพครึ่งตัวของคนสีดำ มีรูปดาวแตกกระจายสีขาวที่หน้าอก"
      credit: "GHS pictogram, Wikimedia Commons (สาธารณสมบัติ)"
      source: "https://commons.wikimedia.org/wiki/File:GHS-pictogram-silhouette.svg"
      license: PD
    choices:
      - { id: a, text: "อันตรายต่อสุขภาพระยะยาว เช่น ก่อมะเร็ง หรือทำลายอวัยวะ", correct: true, feedback: "ถูก ภาพคนที่มีรอยแตกที่อกหมายถึงอันตรายต่อสุขภาพ" }
      - { id: b, text: "พิษเฉียบพลัน ได้รับเล็กน้อยก็ถึงตาย", feedback: "พิษเฉียบพลันใช้รูปหัวกะโหลกไขว้" }
      - { id: c, text: "ระคายเคืองเล็กน้อย", feedback: "อันตรายเล็กน้อยใช้รูปเครื่องหมายตกใจ" }
    hints:
      - "รูปนี้ไม่ใช่หัวกะโหลกและไม่ใช่เครื่องหมายตกใจ"
      - "ภาพเน้นที่ร่างกายภายในของคน"
    solution: "ภาพคนที่มีรอยแตกที่อกคือ **อันตรายต่อสุขภาพ** เช่น ก่อมะเร็ง ทำให้เกิดการกลายพันธุ์ หรือเป็นอันตรายต่อระบบทางเดินหายใจเมื่อได้รับซ้ำ ๆ อาจไม่แสดงอาการทันที จึงต้องป้องกันทุกครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.lab.safety-measurement.p006
    topics: [chemistry.lab.safety-measurement]
    difficulty: 3
    type: mcq
    stem: "สารละลายคอปเปอร์(II) ซัลเฟตที่เหลือจากการทดลองมีสัญลักษณ์ดังภาพ ควรกำจัดอย่างไร"
    figure:
      src: p-ghs-pollu.svg
      alt: "สัญลักษณ์ GHS ขอบแดง ภายในเป็นต้นไม้แห้งตายและปลาตายนอนอยู่ริมน้ำ"
      credit: "GHS pictogram, Wikimedia Commons (สาธารณสมบัติ)"
      source: "https://commons.wikimedia.org/wiki/File:GHS-pictogram-pollu.svg"
      license: PD
    choices:
      - { id: a, text: "เทใส่ภาชนะรองรับของเสียโลหะหนักที่ครูจัดไว้", correct: true, feedback: "ถูก สารเป็นพิษต่อสิ่งมีชีวิตในน้ำ ต้องไม่ลงท่อ" }
      - { id: b, text: "เทลงอ่างล้างมือแล้วเปิดน้ำตามมาก ๆ", feedback: "น้ำทิ้งจากอ่างไหลลงแหล่งน้ำ การเจือจางไม่ได้ทำให้โลหะหนักหายไป" }
      - { id: c, text: "เทลงดินหลังห้องปฏิบัติการ", feedback: "โลหะหนักสะสมในดินและไหลลงแหล่งน้ำได้" }
    hints:
      - "ภาพเตือนอันตรายต่อสิ่งใด"
      - "ทองแดงเป็นโลหะหนัก ไม่สลายไปเมื่อเจือจาง"
    solution: "ภาพต้นไม้และปลาตายคือ **อันตรายต่อสิ่งแวดล้อม** สารละลายคอปเปอร์(II) ซัลเฟตเป็นพิษต่อสัตว์น้ำ ต้องเก็บในภาชนะรองรับของเสียที่แยกประเภทไว้ ส่งกำจัดอย่างถูกวิธี ห้ามเทลงอ่างหรือดิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.lab.safety-measurement.p007
    topics: [chemistry.lab.safety-measurement]
    difficulty: 2
    type: match
    stem: "จับคู่งานกับเครื่องแก้วที่เหมาะสมที่สุด"
    pairs:
      - { left: "ต้มน้ำหรือผสมสารปริมาณมาก ไม่ต้องการปริมาตรแม่นยำ", right: "บีกเกอร์" }
      - { left: "ดูดสารละลาย 25.00 mL ไปใส่ขวดรูปกรวย", right: "ปิเปตต์" }
      - { left: "หยดสารทีละน้อยและอ่านปริมาตรที่ใช้ไป", right: "บิวเรตต์" }
      - { left: "เตรียมสารละลายให้มีปริมาตร 100.0 mL พอดี", right: "ขวดกำหนดปริมาตร" }
      - { left: "ตวงน้ำประมาณ 40 mL ละเอียดถึง 1 mL", right: "กระบอกตวง" }
    hints:
      - "เครื่องมือที่มีขีดบอกปริมาตรเพียงขีดเดียวให้ปริมาตรเดียวที่แม่นยำมาก"
      - "เครื่องมือที่มีก๊อกปิดเปิดใช้ปล่อยสารทีละหยด"
    solution: "บีกเกอร์ใช้งานที่ไม่ต้องแม่น · ปิเปตต์ดูดปริมาตรเดียวแม่นยำ · บิวเรตต์ปล่อยทีละน้อยและอ่านได้ 0.01 mL · ขวดกำหนดปริมาตรเตรียมสารละลายปริมาตรแน่นอน · กระบอกตวงตวงได้ละเอียดระดับ 1 mL"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.lab.safety-measurement.p008
    topics: [chemistry.lab.safety-measurement]
    difficulty: 3
    type: numeric
    stem: "ภาพขยายกระบอกตวงมีขีดทุก 1 mL อ่านปริมาตรของน้ำ (ตอบเป็น mL ทศนิยม 1 ตำแหน่ง)"
    figure:
      src: p-meniscus.svg
      alt: "ภาพขยายกระบอกตวง มีขีดทุก 1 mL ตั้งแต่ 20 ถึง 30 mL ตัวเลขกำกับที่ 20 25 และ 30 ผิวน้ำโค้งเว้า ขอบน้ำที่ติดผนังอยู่ตรงขีด 27 พอดี จุดต่ำสุดของส่วนโค้งอยู่ระหว่างขีด 26 กับ 27 ค่อนไปทาง 26 ราวสองในห้าของช่อง"
    answer: { value: 26.4, tolerance: 0.2, unit: mL }
    misconceptions:
      - { match: 27.0, feedback: "อ่านที่ขอบน้ำซึ่งติดผนัง ต้องอ่านที่จุดต่ำสุดของส่วนโค้งเว้า" }
      - { match: 26, feedback: "ต้องประมาณทศนิยมเพิ่มอีกหนึ่งตำแหน่ง ส่วนโค้งไม่ได้อยู่ตรงขีด 26 พอดี" }
    hints:
      - "น้ำมีผิวโค้งเว้า อ่านที่จุดใดของส่วนโค้ง"
      - "หาว่าจุดต่ำสุดอยู่ระหว่างขีดใด แล้วประมาณว่าเลยขีดล่างมาประมาณกี่ส่วนสิบของช่อง"
    solution: "อ่านที่ **จุดต่ำสุดของส่วนโค้งเว้า** ซึ่งอยู่ระหว่าง 26 กับ 27 mL เลยขีด 26 มาราว 4 ใน 10 ของช่อง จึงได้ประมาณ **26.4 mL** (ตัวเลขหลักสุดท้ายเป็นค่าประมาณ ค่า 26.3–26.5 ถือว่าอ่านถูก)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.lab.safety-measurement.p009
    topics: [chemistry.lab.safety-measurement]
    difficulty: 3
    type: numeric
    stem: "ก่อนไทเทรต บิวเรตต์อ่านได้ 0.50 mL หลังไทเทรตอ่านได้ 23.85 mL ใช้สารละลายจากบิวเรตต์ไปกี่ mL"
    answer: { value: 23.35, tolerance: 0.01, unit: mL }
    misconceptions:
      - { match: 24.35, feedback: "นำค่าเริ่มต้นไปบวก ปริมาตรที่ใช้ = ค่าหลัง − ค่าก่อน" }
      - { match: 23.85, feedback: "ค่าเริ่มต้นไม่ได้อยู่ที่ 0.00 ต้องลบ 0.50 ออกก่อน" }
    hints:
      - "สเกลบิวเรตต์เริ่ม 0 ที่ด้านบน ตัวเลขยิ่งมากแปลว่าสารไหลออกไปมาก"
      - "ปริมาตรที่ใช้ = ค่าที่อ่านหลังไทเทรต − ค่าที่อ่านก่อนไทเทรต"
    solution: "ปริมาตรที่ใช้ $= 23.85 - 0.50 = 23.35\\ \\mathrm{mL}$ บันทึกทศนิยมสองตำแหน่งตามความละเอียดของบิวเรตต์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.lab.safety-measurement.p010
    topics: [chemistry.lab.safety-measurement]
    difficulty: 3
    type: numeric
    stem: "ขวดน้ำปลาขวดหนึ่งบรรจุ 700 cm³ เท่ากับกี่ dm³"
    answer: { value: 0.7, tolerance: 0.001, unit: dm³ }
    misconceptions:
      - { match: 700000, feedback: "คูณแฟกเตอร์กลับด้าน หน่วย cm³ ต้องอยู่ตัวส่วนเพื่อตัดกัน" }
      - { match: 7, feedback: "1 dm³ = 1,000 cm³ ไม่ใช่ 100 cm³ (dm ต่อ cm คือ 10 แต่ยกกำลังสาม)" }
    hints:
      - "$1\\ \\mathrm{dm^3} = 1{,}000\\ \\mathrm{cm^3}$"
      - "คูณด้วยแฟกเตอร์ $\\frac{1\\ \\mathrm{dm^3}}{1000\\ \\mathrm{cm^3}}$ ให้ cm³ ตัดกัน"
    solution: "$700\\ \\mathrm{cm^3} \\times \\dfrac{1\\ \\mathrm{dm^3}}{1{,}000\\ \\mathrm{cm^3}} = 0.700\\ \\mathrm{dm^3}$ (เท่ากับ 0.7 ลิตร)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.lab.safety-measurement.p011
    topics: [chemistry.lab.safety-measurement]
    difficulty: 3
    type: numeric
