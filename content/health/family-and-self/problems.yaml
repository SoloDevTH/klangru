      - "พ่อของทั้งสองคนเป็นพี่น้องกัน"
    solution: "พ่อของต้นข้าว (ธนา) กับวิชัยเป็นพี่น้องกัน ลูกของสองคนนี้จึงเป็นลูกพี่ลูกน้องกัน"
