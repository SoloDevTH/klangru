  - id: computer.data.visualization.p018
    topics: [computer.data.visualization]
    difficulty: 5
    type: code
    stem: |
      เขียนฟังก์ชัน `histogram_counts(data, bins)` ที่แบ่งช่วงค่าตั้งแต่ค่าต่ำสุดถึงค่าสูงสุดของ `data` ออกเป็น `bins` ช่วงที่กว้างเท่ากัน แล้วคืนลิสต์จำนวนค่าที่อยู่ในแต่ละช่วง ช่วงสุดท้ายรวมค่าสูงสุดไว้ด้วย และถ้าค่าทุกตัวเท่ากัน ให้นับทั้งหมดไว้ในช่วงแรก
    starter: |
      def histogram_counts(data, bins):
          return []
    tests: |
      assert histogram_counts([1, 2, 2, 3, 4, 5], 2) == [3, 3], f"ควรได้ [3, 3] แต่ได้ {histogram_counts([1, 2, 2, 3, 4, 5], 2)}"
      assert histogram_counts([0, 10], 5) == [1, 0, 0, 0, 1], f"ควรได้ [1, 0, 0, 0, 1] แต่ได้ {histogram_counts([0, 10], 5)}"
      assert histogram_counts([7, 7, 7], 3) == [3, 0, 0], f"ค่าเท่ากันทั้งหมดต้องนับในช่วงแรก แต่ได้ {histogram_counts([7, 7, 7], 3)}"
      assert histogram_counts([1.5, 2.5, 3.5, 4.5], 3) == [1, 1, 2], f"ควรได้ [1, 1, 2] แต่ได้ {histogram_counts([1.5, 2.5, 3.5, 4.5], 3)}"
    reference: |
      def histogram_counts(data, bins):
          lo = min(data)
          hi = max(data)
          width = (hi - lo) / bins
          counts = [0] * bins
          for x in data:
              if width == 0:
                  index = 0
              else:
                  index = int((x - lo) / width)
              if index >= bins:
                  index = bins - 1
              counts[index] += 1
          return counts
    hints:
      - "หาค่าต่ำสุด ค่าสูงสุด และความกว้างของแต่ละช่วงก่อน คือ (สูงสุด − ต่ำสุด) ÷ bins"
      - "สำหรับแต่ละค่า หาช่วงที่ค่านั้นอยู่จาก int((x − ต่ำสุด) ÷ ความกว้าง)"
      - "ระวังค่าสูงสุดที่จะได้ดัชนีเกินช่วงสุดท้าย และกรณีที่ความกว้างเป็นศูนย์"
    solution: "คำนวณ lo, hi และ width แล้วนับแต่ละค่าลงในช่วง int((x − lo) ÷ width) โดยจำกัดดัชนีไม่ให้เกิน bins − 1 และถ้า width เป็นศูนย์นับทั้งหมดในช่วงแรก เช่น [1,2,2,3,4,5] กับ 2 ช่วงได้ [3, 3]"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.visualization.p019
    topics: [computer.data.visualization]
    difficulty: 5
    type: numeric
    stem: "ระบบตรวจใบเสร็จผิดปกติพิจารณาใบเสร็จ 1,000 ใบ มีใบเสร็จที่ผิดปกติจริง 40 ใบ ระบบจับได้ 30 ใบ และแจ้งผิดว่าใบปกติเป็นผิดปกติ 60 ใบ อัตราที่ระบบจับใบผิดปกติจริงได้ (recall) คิดเป็นกี่เปอร์เซ็นต์"
    answer: { value: 75, unit: เปอร์เซ็นต์ }
    hints:
      - "recall = จำนวนที่จับได้จริง ÷ จำนวนที่ผิดปกติจริงทั้งหมด"
      - "ใบผิดปกติจริงมี 40 ใบ ไม่ใช่ 1,000 ใบ"
    misconceptions:
      - { match: 93, feedback: "นั่นคือความถูกต้องรวมของทั้งระบบ ไม่ใช่อัตราที่จับใบผิดปกติได้ ซึ่งต้องหารด้วยจำนวนใบผิดปกติจริงเท่านั้น" }
      - { match: 40, feedback: "นั่นคือจำนวนใบผิดปกติจริง ไม่ใช่เปอร์เซ็นต์ที่ระบบจับได้" }
    solution: "จับได้จริง 30 ใบจากใบผิดปกติจริง 40 ใบ recall = 30 ÷ 40 × 100 = 75% ส่วนความถูกต้องรวม = (30 + 900) ÷ 1,000 = 93% ซึ่งสูงกว่ามากเพราะส่วนใหญ่เป็นใบปกติ"
    license: CC-BY-SA-4.0
    ai_assisted: true

