topic: engineering.environmental.air-pollution-control
rows:
  - { framework: th-coe-engineering-basics, indicators: ["ENV-3.5"], coverage: partial, note: "สอนชนิดและแหล่งของมลพิษอากาศ การคำนวณอัตราปล่อย การเลือกอุปกรณ์ดักฝุ่น (ไซโคลน ถุงกรอง ESP) และการดักแก๊ส SO₂ ในระดับหลักการและการคำนวณประสิทธิภาพ ยังไม่สอนการออกแบบระบบควบคุมมลพิษทั้งระบบ การคำนวณขนาดอุปกรณ์จริง และการตรวจวัดภาคสนาม" }
  - { framework: th-coe-engineering-basics, indicators: ["ENV-3.14"], coverage: partial, note: "สอนการแปลงหน่วย ppm กับ µg/m³ และแนวคิดมาตรฐานคุณภาพอากาศ แต่ยังไม่มีตัวเลขมาตรฐานคุณภาพอากาศของประเทศไทยในบทเรียน เพราะยังไม่ได้ยืนยันจากประกาศทางการ (ต้องตรวจก่อนเผยแพร่) และยังไม่สอนมาตรฐานคุณภาพสิ่งแวดล้อมด้านอื่น" }
