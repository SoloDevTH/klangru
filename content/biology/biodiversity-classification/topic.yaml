id: biology.diversity.biodiversity-classification
subject: biology
title: { th: ความหลากหลายทางชีวภาพและอนุกรมวิธาน, en: "Biodiversity and taxonomy" }
summary: ความเชื่อมโยงของความหลากหลายสามระดับ กำเนิดเซลล์แรกเริ่มและเอนโดซิมไบโอซิส ระบบสามโดเมน ลักษณะของแบคทีเรีย อาร์เคีย โพรทิสต์ พืช ฟังไจ สัตว์ การอ่านแคลโดแกรม และการสร้างไดโคโทมัสคีย์
difficulty: 6.5
minutes: 45
prerequisites: [biology.evolution.evolution, biology.diversity.biodiversity]
encompasses:
  - { id: biology.diversity.biodiversity, weight: 0.3 }
  - { id: biology.evolution.evolution, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ต้นไม้วิวัฒนาการของสิ่งมีชีวิตสามโดเมน
    src: three-domains.svg
    alt: "ต้นไม้วิวัฒนาการแบบกิ่งมุมฉาก เริ่มจากจุดบรรพบุรุษร่วมที่เป็นเซลล์แรกเริ่มทางซ้าย แตกกิ่งแรกเป็นแบคทีเรียกับกิ่งที่รวมอาร์เคียและยูคาเรีย กิ่งที่สองแยกอาร์เคียออกจากยูคาเรีย ในยูคาเรียแตกเป็นโพรทิสต์ (หลายสายวิวัฒนาการ) พืช ฟังไจ และสัตว์ โดยฟังไจกับสัตว์เป็นกลุ่มพี่น้องที่ใกล้ชิดกันที่สุด มีเครื่องหมายสี่เหลี่ยมสีแดงบนกิ่งยูคาเรียบอกการได้ไมโทคอนเดรีย และบนกิ่งพืชบอกการได้คลอโรพลาสต์จากเอนโดซิมไบโอซิส วงเล็บด้านขวาแบ่งเป็นโดเมนแบคทีเรีย โดเมนอาร์เคีย และโดเมนยูคาเรียซึ่งมีนิวเคลียส"
    caption: "อาร์เคียมีบรรพบุรุษร่วมกับยูคาเรียใกล้กว่ากับแบคทีเรีย ความยาวกิ่งไม่ได้แสดงเวลาตามสัดส่วน (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: จำแนกจุลินทรีย์จากบ่อน้ำพุร้อน
    problem: "นักเรียนเพาะจุลินทรีย์จากบ่อน้ำพุร้อนอุณหภูมิ 80 °C พบว่าเป็นเซลล์เดียว ไม่มีนิวเคลียส ผนังเซลล์ไม่มีเพปทิโดไกลแคน และลำดับเบสของ rRNA คล้ายของยูคาเรียมากกว่าของแบคทีเรีย ควรจัดไว้ในโดเมนใด"
    steps:
      - text: "ไม่มีนิวเคลียส แปลว่าเป็นโพรแคริโอต จึงไม่ใช่โดเมนยูคาเรีย"
      - text: "โพรแคริโอตมีสองโดเมน คือแบคทีเรียและอาร์เคีย ต้องหาลักษณะที่แยกสองโดเมนนี้"
      - text: "ผนังเซลล์ไม่มีเพปทิโดไกลแคน ต่างจากแบคทีเรียทั่วไป"
        why: "เพปทิโดไกลแคนเป็นลักษณะเด่นของผนังเซลล์แบคทีเรีย และเป็นเป้าของยาปฏิชีวนะกลุ่มเพนิซิลลิน"
      - text: "rRNA คล้ายยูคาเรีย ตรงกับต้นไม้วิวัฒนาการที่อาร์เคียมีบรรพบุรุษร่วมกับยูคาเรียใกล้กว่า"
      - text: "การอยู่ในน้ำร้อนจัดเป็นเพียงข้อมูลเสริม เพราะอาร์เคียหลายชนิดก็อยู่ในดินหรือทะเลทั่วไป"
    answer: "จัดไว้ในโดเมนอาร์เคีย"
  - { type: check, problem: biology.diversity.biodiversity-classification.p012, prompt: "ลักษณะใดแยกอาร์เคียออกจากแบคทีเรียได้" }
  - type: figure
    title: แคลโดแกรมของสัตว์มีกระดูกสันหลัง
    src: vertebrate-cladogram.svg
    alt: "แคลโดแกรมแบบกิ่งมุมฉากของสัตว์ 6 ชนิดเรียงจากบนลงล่าง ปลาฉลาม ปลาทู กบ แมว จิ้งจก นกกระจอก ปลาฉลามแยกออกก่อน บนกิ่งที่นำไปสู่สัตว์ที่เหลือมีเครื่องหมายโครงกระดูกแข็ง ถัดมาปลาทูแยกออก บนกิ่งต่อไปมีเครื่องหมายมีขา 4 ขา ถัดมากบแยกออก บนกิ่งต่อไปมีเครื่องหมายไข่มีถุงแอมเนียน ถัดมาแมวแยกออกโดยบนกิ่งของแมวมีเครื่องหมายขนและต่อมน้ำนม กิ่งสุดท้ายมีเครื่องหมายกะโหลกไดแอปซิดแล้วแตกเป็นจิ้งจกกับนกกระจอก บนกิ่งของนกกระจอกมีเครื่องหมายขนนก"
    caption: "จิ้งจกกับนกมีบรรพบุรุษร่วมกันใกล้กว่าจิ้งจกกับแมว (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: สร้างไดโคโทมัสคีย์สำหรับสิ่งมีชีวิต 4 ชนิด
    problem: "สร้างไดโคโทมัสคีย์แยก เห็ดฟาง ยูกลีนา มะม่วง และไส้เดือนดิน"
    steps:
      - text: "จำนวนข้อที่ต้องใช้คือ $4 - 1 = 3$ ข้อ"
      - text: "ข้อ 1 ใช้ลักษณะที่แบ่งได้ชัด เช่น 1ก เซลล์เดียว → ยูกลีนา 1ข หลายเซลล์ → ไปข้อ 2"
        why: "ลักษณะที่ดีต้องตรงข้ามกันและครอบคลุมทุกตัวอย่าง สิ่งมีชีวิตแต่ละชนิดเข้าได้ทางเดียว"
      - text: "ข้อ 2 แยกกลุ่มที่สังเคราะห์ด้วยแสงได้ 2ก มีคลอโรฟิลล์ → มะม่วง 2ข ไม่มีคลอโรฟิลล์ → ไปข้อ 3"
      - text: "ข้อ 3 แยกฟังไจออกจากสัตว์ 3ก ผนังเซลล์เป็นไคทิน ดูดซึมอาหารที่ย่อยนอกเซลล์ → เห็ดฟาง 3ข ไม่มีผนังเซลล์ กินอาหารเข้าไปย่อยในทางเดินอาหาร → ไส้เดือนดิน"
      - text: "ตรวจคีย์โดยไล่สิ่งมีชีวิตทุกชนิดผ่านคีย์ ทุกชนิดต้องถึงชื่อของตัวเองเพียงชื่อเดียว"
    answer: "คีย์ 3 ข้อ: เซลล์เดียว/หลายเซลล์ → มีคลอโรฟิลล์/ไม่มี → ผนังเซลล์ไคทิน/ไม่มีผนังเซลล์"
  - { type: check, problem: biology.diversity.biodiversity-classification.p010, prompt: "คีย์ที่แยกทีละสองทาง ต้องใช้กี่ข้อ" }
glossary:
  - { term: โดเมน, definition: "หมวดหมู่สูงสุดของการจำแนก มี 3 โดเมน คือ แบคทีเรีย อาร์เคีย และยูคาเรีย" }
  - { term: อาร์เคีย, definition: "โพรแคริโอตที่ผนังเซลล์ไม่มีเพปทิโดไกลแคน มีลิพิดในเยื่อหุ้มเซลล์ต่างจากแบคทีเรีย และใกล้ชิดกับยูคาเรีย" }
  - { term: ทฤษฎีเอนโดซิมไบโอซิส, definition: "แนวคิดว่าไมโทคอนเดรียและคลอโรพลาสต์มาจากโพรแคริโอตที่ถูกเซลล์ใหญ่กลืนเข้าไปแล้วอยู่ร่วมกัน" }
  - { term: แคลโดแกรม, definition: "แผนภาพกิ่งแสดงความสัมพันธ์ของสิ่งมีชีวิตจากลักษณะที่เกิดขึ้นใหม่ร่วมกัน" }
  - { term: ลักษณะที่เกิดขึ้นใหม่ร่วมกัน, definition: "ลักษณะที่บรรพบุรุษร่วมของกลุ่มหนึ่งเพิ่งมี และถ่ายทอดให้ทุกสายในกลุ่มนั้น เช่น ขนนก" }
  - { term: ไดโคโทมัสคีย์, definition: "กุญแจระบุชนิดที่แยกทีละสองทางด้วยลักษณะตรงข้ามกัน" }
flashcards:
  - { front: "3 โดเมนของสิ่งมีชีวิต", back: "แบคทีเรีย อาร์เคีย ยูคาเรีย (เสนอโดยวูส จากลำดับเบสของ rRNA)" }
  - { front: "หลักฐานของทฤษฎีเอนโดซิมไบโอซิส", back: "ไมโทคอนเดรียและคลอโรพลาสต์มีเยื่อหุ้มสองชั้น มี DNA วงกลมและไรโบโซมแบบแบคทีเรีย และแบ่งตัวได้เอง" }
  - { front: "ฟังไจต่างจากพืชอย่างไร", back: "ไม่มีคลอโรฟิลล์ ผนังเซลล์เป็นไคทิน ย่อยอาหารนอกเซลล์แล้วดูดซึม สะสมไกลโคเจน" }
  - { front: "อ่านแคลโดแกรมว่าใครใกล้ชิดกันที่สุด", back: "ดูจุดแตกกิ่งที่เป็นบรรพบุรุษร่วมที่ใหม่ที่สุด ไม่ใช่ดูว่าปลายกิ่งอยู่ติดกัน" }
  - { front: "ไดโคโทมัสคีย์สำหรับสิ่งมีชีวิต n ชนิดใช้กี่ข้อ", back: "n − 1 ข้อ" }
