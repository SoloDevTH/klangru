      - { left: "$x - 8 = 1$", right: "ลบ $3x$ ทั้งสองข้าง" }
      - { left: "$x = 9$", right: "บวก 8 ทั้งสองข้าง" }
      - { left: "$4(9 - 2) = 28 = 3(9) + 1$", right: "แทนค่ากลับเพื่อตรวจคำตอบ" }
    hints:
      - "เทียบแต่ละบรรทัดกับบรรทัดก่อนหน้า ว่าเปลี่ยนไปอย่างไร"
      - "ขั้นแรกวงเล็บหายไป ขั้นที่สองพจน์ $3x$ หายจากข้างขวา"
    solution: "$4(x - 2) \\to 4x - 8$ ใช้สมบัติการแจกแจง → ลบ $3x$ ทั้งสองข้างได้ $x - 8 = 1$ → บวก 8 ทั้งสองข้างได้ $x = 9$ → แทน $x = 9$ ได้ $28 = 28$ ✓"
