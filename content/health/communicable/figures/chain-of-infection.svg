<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="sans-serif">
<title>เส้นทางของเชื้อโรคจากคนหนึ่งไปอีกคน</title>
<rect x="0" y="0" width="700" height="330" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="350.0" y="30.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">เส้นทางของเชื้อโรค: ตัดได้ที่ทุกขั้น</text>
<rect x="21.0" y="60.0" width="118.0" height="96.0" rx="10" fill="#fff1e6" stroke="#b5562b" stroke-width="2"/>
<text x="80.0" y="86.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">1 เชื้อโรค</text>
<text x="80.0" y="112.0" font-size="12" text-anchor="middle" fill="#111">ไวรัส แบคทีเรีย</text>
<text x="80.0" y="130.0" font-size="12" text-anchor="middle" fill="#111">ในตัวผู้ป่วย</text>
<line x1="141.0" y1="108.0" x2="154.0" y2="108.0" stroke="#b5562b" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="80.0" y1="160.0" x2="80.0" y2="200.0" stroke="#2e6b2e" stroke-width="2" stroke-dasharray="5,4"/>
<rect x="21.0" y="202.0" width="118.0" height="62.0" rx="10" fill="#eaf6ea" stroke="#2e6b2e" stroke-width="2"/>
<text x="80.0" y="228.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1d4f1d">รักษาผู้ป่วย</text>
<text x="80.0" y="248.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1d4f1d">พักที่บ้าน</text>
<rect x="156.0" y="60.0" width="118.0" height="96.0" rx="10" fill="#fff1e6" stroke="#b5562b" stroke-width="2"/>
<text x="215.0" y="86.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">2 ทางออก</text>
<text x="215.0" y="112.0" font-size="12" text-anchor="middle" fill="#111">ไอ จาม น้ำมูก</text>
<text x="215.0" y="130.0" font-size="12" text-anchor="middle" fill="#111">อุจจาระ เลือด</text>
<line x1="276.0" y1="108.0" x2="289.0" y2="108.0" stroke="#b5562b" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="215.0" y1="160.0" x2="215.0" y2="200.0" stroke="#2e6b2e" stroke-width="2" stroke-dasharray="5,4"/>
<rect x="156.0" y="202.0" width="118.0" height="62.0" rx="10" fill="#eaf6ea" stroke="#2e6b2e" stroke-width="2"/>
<text x="215.0" y="228.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1d4f1d">ปิดปากจมูก</text>
<text x="215.0" y="248.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1d4f1d">เวลาไอจาม</text>
<rect x="291.0" y="60.0" width="118.0" height="96.0" rx="10" fill="#fff1e6" stroke="#b5562b" stroke-width="2"/>
<text x="350.0" y="86.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">3 ทางแพร่</text>
<text x="350.0" y="112.0" font-size="12" text-anchor="middle" fill="#111">ละอองฝอย มือ</text>
<text x="350.0" y="130.0" font-size="12" text-anchor="middle" fill="#111">อาหาร น้ำ ยุง</text>
<line x1="411.0" y1="108.0" x2="424.0" y2="108.0" stroke="#b5562b" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="350.0" y1="160.0" x2="350.0" y2="200.0" stroke="#2e6b2e" stroke-width="2" stroke-dasharray="5,4"/>
<rect x="291.0" y="202.0" width="118.0" height="62.0" rx="10" fill="#eaf6ea" stroke="#2e6b2e" stroke-width="2"/>
<text x="350.0" y="228.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1d4f1d">ล้างมือ อาหารสุก</text>
<text x="350.0" y="248.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1d4f1d">กำจัดลูกน้ำยุง</text>
<rect x="426.0" y="60.0" width="118.0" height="96.0" rx="10" fill="#fff1e6" stroke="#b5562b" stroke-width="2"/>
<text x="485.0" y="86.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">4 ทางเข้า</text>
<text x="485.0" y="112.0" font-size="12" text-anchor="middle" fill="#111">จมูก ปาก ตา</text>
<text x="485.0" y="130.0" font-size="12" text-anchor="middle" fill="#111">ผิวหนังที่ถูกกัด</text>
<line x1="546.0" y1="108.0" x2="559.0" y2="108.0" stroke="#b5562b" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="485.0" y1="160.0" x2="485.0" y2="200.0" stroke="#2e6b2e" stroke-width="2" stroke-dasharray="5,4"/>
<rect x="426.0" y="202.0" width="118.0" height="62.0" rx="10" fill="#eaf6ea" stroke="#2e6b2e" stroke-width="2"/>
<text x="485.0" y="228.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1d4f1d">สวมหน้ากาก</text>
<text x="485.0" y="248.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1d4f1d">ไม่ขยี้ตา</text>
<rect x="561.0" y="60.0" width="118.0" height="96.0" rx="10" fill="#fff1e6" stroke="#b5562b" stroke-width="2"/>
<text x="620.0" y="86.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">5 คนต่อไป</text>
<text x="620.0" y="112.0" font-size="12" text-anchor="middle" fill="#111">คนที่ยังไม่มี</text>
<text x="620.0" y="130.0" font-size="12" text-anchor="middle" fill="#111">ภูมิคุ้มกัน</text>
<line x1="620.0" y1="160.0" x2="620.0" y2="200.0" stroke="#2e6b2e" stroke-width="2" stroke-dasharray="5,4"/>
<rect x="561.0" y="202.0" width="118.0" height="62.0" rx="10" fill="#eaf6ea" stroke="#2e6b2e" stroke-width="2"/>
<text x="620.0" y="228.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1d4f1d">วัคซีน</text>
<text x="620.0" y="248.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1d4f1d">กินดี นอนพอ</text>
<text x="350.0" y="300.0" font-size="13.5" text-anchor="middle" fill="#111">กล่องสีเขียว = วิธีตัดเส้นทาง ถ้าตัดได้แม้ขั้นเดียว เชื้อก็ไปไม่ถึงคนต่อไป</text>
</svg>
