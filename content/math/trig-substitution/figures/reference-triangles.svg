<text x="735.0" y="40.0" font-size="16" fill="#1d3557" text-anchor="middle" font-weight="bold">x = a sec θ</text>
<text x="735.0" y="62.0" font-size="14" fill="#444" text-anchor="middle">sec θ = x/a</text>
<text x="450.0" y="318.0" font-size="14" fill="#444" text-anchor="middle">ด้านที่ได้จากนิยามของการแทนค่า และด้านที่สามจากทฤษฎีบทพีทาโกรัส</text></svg>
