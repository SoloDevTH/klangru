      - { match: 4, feedback: "find คืนดัชนีของ n ตัวแรกเท่านั้น ไม่ได้นับจำนวน n" }
    solution: "s.count(\"a\") = 3 และ s.find(\"n\") = 2 (n ตัวแรกอยู่ที่ดัชนี 2) ผลรวม 3 + 2 = 5"
