    ai_assisted: true

  - id: math.stats.statistical-investigation.p013
    topics: [math.stats.statistical-investigation]
    difficulty: 4
    type: numeric
    stem: "สำรวจจำนวนชั่วโมงนอนในคืนก่อนสอบของนักเรียนห้องละ 8 คน ห้อง A: 8, 7, 9, 8, 6, 8, 7, 9 ห้อง B: 7, 6, 6, 8, 5, 7, 6, 7 ค่าเฉลี่ยของห้อง A มากกว่าห้อง B กี่ชั่วโมง (ตอบในหน่วยชั่วโมง)"
    answer: { value: 1.25, tolerance: 0.01, unit: ชั่วโมง }
    hints:
      - "หาผลรวมของแต่ละห้อง แล้วหารด้วย 8"
      - "นำค่าเฉลี่ยของห้อง A ลบค่าเฉลี่ยของห้อง B"
    misconceptions:
      - { match: 10, feedback: "นั่นคือผลต่างของผลรวม ($62 - 52$) ต้องหารด้วยจำนวนคนก่อน" }
      - { match: 0, feedback: "พิสัยของทั้งสองห้องเท่ากัน (3 ชั่วโมง) แต่ข้อนี้ถามค่าเฉลี่ย" }
    solution: "ห้อง A: $62 \\div 8 = 7.75$ ชั่วโมง ห้อง B: $52 \\div 8 = 6.5$ ชั่วโมง ผลต่าง $7.75 - 6.5 = 1.25$ ชั่วโมง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.statistical-investigation.p014
