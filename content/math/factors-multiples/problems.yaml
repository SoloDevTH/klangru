problems:
  - id: math.fm.p001
    topics: [math.number.factors-multiples]
    difficulty: 1
    type: mcq
    multiple: true
    stem: "จำนวนใดบ้างเป็นตัวประกอบของ 18 (เลือกได้มากกว่า 1 ข้อ)"
    choices:
      - { id: a, text: "1", correct: true }
      - { id: b, text: "3", correct: true }
      - { id: c, text: "6", correct: true }
      - { id: d, text: "9", correct: true }
      - { id: e, text: "4", feedback: "18 หารด้วย 4 ได้ 4.5 ไม่ลงตัว 4 จึงไม่ใช่ตัวประกอบของ 18" }
      - { id: f, text: "36", feedback: "36 เป็นพหุคูณของ 18 ($18 \\times 2$) ไม่ใช่ตัวประกอบ ตัวประกอบต้องไม่มากกว่าตัวมันเอง" }
    hints:
      - "ตัวประกอบของ 18 คือจำนวนที่หาร 18 ได้ลงตัว"
      - "หาคู่ที่คูณกันได้ 18: เริ่มจาก $1 \\times 18$, $2 \\times 9$, …"
    solution: "$18 = 1 \\times 18 = 2 \\times 9 = 3 \\times 6$ ตัวประกอบของ 18 คือ 1, 2, 3, 6, 9, 18 ในตัวเลือกจึงถูก 1, 3, 6, 9"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.fm.p002
    topics: [math.number.factors-multiples]
    difficulty: 2
    type: numeric
    stem: "36 มีตัวประกอบทั้งหมดกี่ตัว"
    answer: { value: 9, unit: ตัว }
    hints:
      - "หาคู่ตัวประกอบที่คูณกันได้ 36 เริ่มจาก 1 ไปเรื่อย ๆ"
      - "คู่สุดท้ายคือ $6 \\times 6$ ซึ่งเป็นจำนวนเดียวกัน ให้นับเพียงครั้งเดียว"
    misconceptions:
      - { match: 10, feedback: "ดูเหมือนนับ 6 สองครั้งจากคู่ $6 \\times 6$ ทั้งที่เป็นตัวประกอบตัวเดียวกัน" }
      - { match: 7, feedback: "ดูเหมือนไม่ได้นับ 1 กับ 36 ทั้งสองเป็นตัวประกอบของ 36 ด้วย" }
    solution: "$36 = 1 \\times 36 = 2 \\times 18 = 3 \\times 12 = 4 \\times 9 = 6 \\times 6$ ตัวประกอบคือ 1, 2, 3, 4, 6, 9, 12, 18, 36 รวม 9 ตัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.fm.p003
    topics: [math.number.factors-multiples]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "จำนวนใดบ้างเป็นจำนวนเฉพาะ (เลือกได้มากกว่า 1 ข้อ)"
    choices:
      - { id: a, text: "1", feedback: "1 มีตัวประกอบเพียงตัวเดียว จำนวนเฉพาะต้องมีตัวประกอบสองตัวพอดี 1 จึงไม่ใช่จำนวนเฉพาะ" }
      - { id: b, text: "2", correct: true }
      - { id: c, text: "9", feedback: "$9 = 3 \\times 3$ จึงมีตัวประกอบ 1, 3, 9 จำนวนคี่ไม่จำเป็นต้องเป็นจำนวนเฉพาะ" }
      - { id: d, text: "29", correct: true }
      - { id: e, text: "51", feedback: "$51 = 3 \\times 17$ ลองบวกเลขโดด $5 + 1 = 6$ หารด้วย 3 ลงตัว 51 จึงหารด้วย 3 ลงตัวด้วย" }
      - { id: f, text: "57", feedback: "$57 = 3 \\times 19$ บวกเลขโดด $5 + 7 = 12$ หารด้วย 3 ลงตัว 57 จึงไม่ใช่จำนวนเฉพาะ" }
    hints:
      - "จำนวนเฉพาะมีตัวประกอบสองตัวพอดี คือ 1 กับตัวมันเอง"
      - "ลองหารด้วยจำนวนเฉพาะเล็ก ๆ คือ 2, 3, 5 ถ้าหารตัวใดลงตัวแสดงว่าไม่ใช่จำนวนเฉพาะ"
    solution: "2 มีตัวประกอบ 1, 2 และ 29 มีตัวประกอบ 1, 29 เป็นจำนวนเฉพาะ ส่วน 1 มีตัวประกอบตัวเดียว, $9 = 3 \\times 3$, $51 = 3 \\times 17$, $57 = 3 \\times 19$ ไม่ใช่จำนวนเฉพาะ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.fm.p004
    topics: [math.number.factors-multiples]
    difficulty: 2
    type: text
    stem: "แยกตัวประกอบเฉพาะของ 60 เขียนเรียงจากน้อยไปมาก (พิมพ์ เช่น 2×3×7 หรือ 2*3*7)"
    accepted: ["2×2×3×5", "2x2x3x5", "2*2*3*5", "2·2·3·5", "2^2×3×5", "2^2x3x5", "2^2*3*5", "2^2·3·5"]
    hints:
      - "หาร 60 ด้วยจำนวนเฉพาะที่เล็กที่สุดที่หารลงตัว แล้วทำซ้ำกับผลหาร"
      - "หารด้วย 2 ไปจนหารไม่ลงตัว แล้วลอง 3 และ 5 ต่อ"
    misconceptions:
      - { match: "4×3×5", feedback: "ผลคูณเท่ากับ 60 ก็จริง แต่ 4 ไม่ใช่จำนวนเฉพาะ ต้องแยก 4 เป็น $2 \\times 2$ ต่อ" }
      - { match: "4x3x5", feedback: "ผลคูณเท่ากับ 60 ก็จริง แต่ 4 ไม่ใช่จำนวนเฉพาะ ต้องแยก 4 เป็น $2 \\times 2$ ต่อ" }
      - { match: "4*3*5", feedback: "ผลคูณเท่ากับ 60 ก็จริง แต่ 4 ไม่ใช่จำนวนเฉพาะ ต้องแยก 4 เป็น $2 \\times 2$ ต่อ" }
      - { match: "2×3×5", feedback: "$2 \\times 3 \\times 5 = 30$ ยังขาด 2 อีกหนึ่งตัว 60 หารด้วย 2 ได้สองครั้ง" }
      - { match: "2x3x5", feedback: "$2 \\times 3 \\times 5 = 30$ ยังขาด 2 อีกหนึ่งตัว 60 หารด้วย 2 ได้สองครั้ง" }
      - { match: "2*3*5", feedback: "$2 \\times 3 \\times 5 = 30$ ยังขาด 2 อีกหนึ่งตัว 60 หารด้วย 2 ได้สองครั้ง" }
    solution: "$60 \\div 2 = 30$, $30 \\div 2 = 15$, $15 \\div 3 = 5$ และ 5 เป็นจำนวนเฉพาะ ดังนั้น $60 = 2 \\times 2 \\times 3 \\times 5 = 2^2 \\times 3 \\times 5$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.fm.p005
    topics: [math.number.factors-multiples]
    difficulty: 2
    type: numeric
    stem: "หา ห.ร.ม. ของ 24 และ 36"
    answer: { value: 12 }
    hints:
      - "ห.ร.ม. คือตัวประกอบร่วมที่มากที่สุด"
      - "แยกตัวประกอบเฉพาะทั้งสองจำนวน แล้วคูณเฉพาะส่วนที่มีร่วมกัน"
    misconceptions:
      - { match: 72, feedback: "นั่นคือ ค.ร.น. ห.ร.ม. ต้องหารทั้ง 24 และ 36 ลงตัว จึงมากกว่า 24 ไม่ได้" }
      - { match: 6, feedback: "6 เป็นตัวประกอบร่วมก็จริง แต่ยังไม่ใช่ตัวที่มากที่สุด ลองดูว่ามีตัวประกอบร่วมที่ใหญ่กว่า 6 หรือไม่" }
    solution: "$24 = 2 \\times 2 \\times 2 \\times 3$ และ $36 = 2 \\times 2 \\times 3 \\times 3$ ส่วนร่วมคือ $2 \\times 2 \\times 3 = 12$ ห.ร.ม. จึงเป็น 12"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.fm.p006
    topics: [math.number.factors-multiples]
    difficulty: 3
    type: numeric
    stem: "หา ค.ร.น. ของ 12 และ 18"
    answer: { value: 36 }
    hints:
      - "ค.ร.น. คือพหุคูณร่วมที่น้อยที่สุด"
      - "แยกตัวประกอบเฉพาะ แล้วคูณส่วนร่วมกับส่วนที่เหลือของทั้งสองจำนวน"
    misconceptions:
      - { match: 216, feedback: "นั่นคือ $12 \\times 18$ เป็นพหุคูณร่วมก็จริง แต่ไม่ใช่ตัวที่น้อยที่สุด เพราะ 12 กับ 18 มีตัวประกอบร่วมกัน" }
      - { match: 6, feedback: "นั่นคือ ห.ร.ม. ค.ร.น. ต้องเป็นพหุคูณของทั้งสองจำนวน จึงน้อยกว่า 18 ไม่ได้" }
    solution: "$12 = 2 \\times 2 \\times 3$ และ $18 = 2 \\times 3 \\times 3$ ส่วนร่วมคือ $2 \\times 3 = 6$ ส่วนที่เหลือคือ 2 และ 3 ค.ร.น. $= 6 \\times 2 \\times 3 = 36$ ตรวจ: $36 \\div 12 = 3$ และ $36 \\div 18 = 2$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.fm.p007
    topics: [math.number.factors-multiples]
    difficulty: 3
    type: numeric
    stem: "รถเมล์สาย ก ออกจากอู่ทุก 12 นาที สาย ข ออกทุก 15 นาที ถ้าทั้งสองสายออกพร้อมกันเวลา 6:00 น. อีกกี่นาทีจะออกพร้อมกันอีกครั้ง"
    answer: { value: 60, unit: นาที }
    hints:
      - "เวลาที่สาย ก ออกเป็นพหุคูณของ 12 เวลาที่สาย ข ออกเป็นพหุคูณของ 15"
      - "หาพหุคูณร่วมที่น้อยที่สุดของ 12 และ 15"
    misconceptions:
      - { match: 180, feedback: "นั่นคือ $12 \\times 15$ ซึ่งเป็นเวลาที่ออกพร้อมกันก็จริง แต่ไม่ใช่ครั้งถัดไป เพราะ 12 กับ 15 มี 3 เป็นตัวประกอบร่วม" }
      - { match: 3, feedback: "นั่นคือ ห.ร.ม. แต่โจทย์เหตุการณ์ที่เกิดซ้ำเป็นรอบต้องใช้ ค.ร.น." }
    solution: "$12 = 2 \\times 2 \\times 3$ และ $15 = 3 \\times 5$ ค.ร.น. $= 2 \\times 2 \\times 3 \\times 5 = 60$ อีก 60 นาที (เวลา 7:00 น.) จะออกพร้อมกันอีกครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.fm.p008
    topics: [math.number.factors-multiples]
    difficulty: 3
    type: match
    stem: "จับคู่ข้อความทางซ้ายกับค่าทางขวา"
    pairs:
      - { left: "ห.ร.ม. ของ 8 และ 12", right: "4" }
      - { left: "ค.ร.น. ของ 8 และ 12", right: "24" }
      - { left: "ผลคูณ $8 \\times 12$", right: "96" }
      - { left: "จำนวนเฉพาะที่อยู่ระหว่าง 8 กับ 12", right: "11" }
    hints:
      - "$8 = 2 \\times 2 \\times 2$ และ $12 = 2 \\times 2 \\times 3$"
      - "ห.ร.ม. ต้องไม่มากกว่า 8 ส่วน ค.ร.น. ต้องไม่น้อยกว่า 12 และหารด้วยทั้ง 8 และ 12 ลงตัว"
    solution: "ส่วนร่วมของ 8 และ 12 คือ $2 \\times 2 = 4$ จึงได้ ห.ร.ม. = 4 และ ค.ร.น. $= 4 \\times 2 \\times 3 = 24$ ผลคูณ $8 \\times 12 = 96$ (สังเกตว่า $4 \\times 24 = 96$ ด้วย) ระหว่าง 8 กับ 12 มี 9, 10, 11 แต่มีเพียง 11 ที่เป็นจำนวนเฉพาะ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.fm.p009
    topics: [math.number.factors-multiples]
    difficulty: 4
    type: numeric
    stem: "ร้านผ้าไทยมีผ้าไหม 3 ผืน ยาว 84, 126 และ 210 เซนติเมตร ต้องการตัดทุกผืนเป็นชิ้นยาวเท่ากันให้ยาวที่สุดโดยไม่เหลือเศษ จะได้ผ้าทั้งหมดกี่ชิ้น"
    answer: { value: 10, unit: ชิ้น }
    hints:
      - "ความยาวของแต่ละชิ้นต้องหาร 84, 126 และ 210 ลงตัว และยาวที่สุด จึงเป็น ห.ร.ม."
      - "หา ห.ร.ม. ของสามจำนวนก่อน แล้วนำไปหารความยาวของแต่ละผืน"
      - "รวมจำนวนชิ้นจากทั้งสามผืน"
    misconceptions:
      - { match: 42, feedback: "42 เซนติเมตรคือความยาวของแต่ละชิ้น แต่โจทย์ถามจำนวนชิ้นทั้งหมด ต้องนำ 42 ไปหารความยาวของแต่ละผืนแล้วรวมกัน" }
    solution: "$84 = 2 \\times 2 \\times 3 \\times 7$, $126 = 2 \\times 3 \\times 3 \\times 7$, $210 = 2 \\times 3 \\times 5 \\times 7$ ส่วนร่วมคือ $2 \\times 3 \\times 7 = 42$ ชิ้นละ 42 cm ได้ $\\tfrac{84}{42} + \\tfrac{126}{42} + \\tfrac{210}{42} = 2 + 3 + 5 = 10$ ชิ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.fm.p010
    topics: [math.number.factors-multiples]
    difficulty: 4
    type: numeric
    stem: "แม่มีขนมเปี๊ยะ 48 ชิ้น และทองม้วน 60 ชิ้น ต้องการจัดใส่ถุงของฝาก ให้ทุกถุงมีขนมเปี๊ยะจำนวนเท่ากัน และทองม้วนจำนวนเท่ากัน โดยไม่มีขนมเหลือ จัดได้มากที่สุดกี่ถุง"
    answer: { value: 12, unit: ถุง }
    hints:
      - "จำนวนถุงต้องหารทั้ง 48 และ 60 ลงตัว"
      - "ต้องการจำนวนถุงมากที่สุด จึงหาตัวประกอบร่วมที่มากที่สุด"
    misconceptions:
      - { match: 240, feedback: "นั่นคือ ค.ร.น. ของ 48 และ 60 แต่จำนวนถุงต้องหาร 48 และ 60 ลงตัว จึงมากกว่า 48 ไม่ได้ โจทย์แบ่งของใช้ ห.ร.ม." }
      - { match: 9, feedback: "9 คือจำนวนขนมในแต่ละถุง (ขนมเปี๊ยะ 4 กับทองม้วน 5) โจทย์ถามจำนวนถุง" }
    solution: "$48 = 2 \\times 2 \\times 2 \\times 2 \\times 3$ และ $60 = 2 \\times 2 \\times 3 \\times 5$ ห.ร.ม. $= 2 \\times 2 \\times 3 = 12$ จัดได้ 12 ถุง ถุงละขนมเปี๊ยะ 4 ชิ้นและทองม้วน 5 ชิ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.fm.p011
    topics: [math.number.factors-multiples]
    difficulty: 5
    type: numeric
    stem: "จำนวนนับ $a$ กับ 18 มี ห.ร.ม. เท่ากับ 6 และ ค.ร.น. เท่ากับ 72 จงหา $a$"
    answer: { value: 24 }
    hints:
      - "สำหรับสองจำนวนใด ๆ ห.ร.ม. × ค.ร.น. = ผลคูณของสองจำนวนนั้น"
      - "เขียนเป็นสมการ $6 \\times 72 = a \\times 18$ แล้วหาร 18 ทั้งสองข้าง"
    misconceptions:
      - { match: 216, feedback: "ดูเหมือนคำนวณ $\\tfrac{18 \\times 72}{6}$ ความสัมพันธ์ที่ถูกคือ ห.ร.ม. × ค.ร.น. = $a \\times 18$ จึงต้องหารด้วย 18 ไม่ใช่คูณ" }
      - { match: 4, feedback: "นั่นคือ $72 \\div 18$ ลืมคูณ ห.ร.ม. ด้วย ลองตรวจ: ห.ร.ม. ของ 4 กับ 18 คือ 2 ไม่ใช่ 6" }
    solution: "ห.ร.ม. × ค.ร.น. = ผลคูณสองจำนวน: $6 \\times 72 = 18a$ → $432 = 18a$ → $a = 24$ ตรวจ: $24 = 2^3 \\times 3$, $18 = 2 \\times 3^2$ ห.ร.ม. $= 6$ ค.ร.น. $= 72$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.fm.p012
    topics: [math.number.factors-multiples]
    difficulty: 5
    type: numeric
    stem: "ไฟประดับงานลอยกระทงมี 3 สี สีแดงกะพริบทุก 4 วินาที สีเขียวทุก 6 วินาที สีเหลืองทุก 10 วินาที เริ่มกะพริบพร้อมกัน ภายใน 5 นาทีต่อจากนั้น ไฟจะกะพริบพร้อมกันทั้งสามสีอีกกี่ครั้ง (ไม่นับครั้งแรกที่เริ่ม)"
    answer: { value: 5, unit: ครั้ง }
    hints:
      - "ไฟสามสีกะพริบพร้อมกันทุก ๆ ค.ร.น. ของ 4, 6 และ 10 วินาที"
      - "เปลี่ยน 5 นาทีเป็นวินาทีก่อน"
      - "นำเวลาทั้งหมดหารด้วย ค.ร.น. เพื่อนับว่ามีรอบพร้อมกันกี่ครั้ง"
    misconceptions:
      - { match: 6, feedback: "ดูเหมือนนับครั้งแรกที่เริ่มพร้อมกันด้วย โจทย์บอกให้ไม่นับครั้งนั้น" }
      - { match: 1, feedback: "ดูเหมือนใช้ $4 \\times 6 \\times 10 = 240$ วินาทีเป็นรอบ แต่ 4, 6 และ 10 มีตัวประกอบร่วม ค.ร.น. จึงน้อยกว่านั้น" }
    solution: "$4 = 2 \\times 2$, $6 = 2 \\times 3$, $10 = 2 \\times 5$ ค.ร.น. $= 2 \\times 2 \\times 3 \\times 5 = 60$ วินาที 5 นาที = 300 วินาที กะพริบพร้อมกันที่วินาทีที่ 60, 120, 180, 240, 300 รวม $300 \\div 60 = 5$ ครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true
