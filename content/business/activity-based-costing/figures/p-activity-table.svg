<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="sans-serif">
<title>ข้อมูลกลุ่มต้นทุนกิจกรรมของโรงงานขนมเปี๊ยะ (สมมติ)</title>
<defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#222"/></marker></defs>
<rect width="720" height="250" fill="#ffffff"/>
<rect x="20.0" y="20.0" width="680.0" height="34.0" fill="#e8eef6" stroke="#222" stroke-width="1.2" rx="0"/>
<text x="28.0" y="42.0" font-size="14" text-anchor="start" fill="#222" font-weight="bold">กลุ่มต้นทุนกิจกรรม</text>
<text x="218.0" y="42.0" font-size="14" text-anchor="start" fill="#222" font-weight="bold">ต้นทุน (บาท)</text>
<text x="338.0" y="42.0" font-size="14" text-anchor="start" fill="#222" font-weight="bold">ตัวผลักดันต้นทุน</text>
<text x="528.0" y="42.0" font-size="14" text-anchor="start" fill="#222" font-weight="bold">A ใช้</text>
<text x="618.0" y="42.0" font-size="14" text-anchor="start" fill="#222" font-weight="bold">B ใช้</text>
<rect x="20.0" y="54.0" width="680.0" height="36.0" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="0"/>
<text x="28.0" y="77.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">ใช้เครื่องอบ</text>
<text x="218.0" y="77.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">480,000</text>
<text x="338.0" y="77.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">ชั่วโมงเครื่องจักร</text>
<text x="528.0" y="77.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">8,000</text>
<text x="618.0" y="77.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">2,000</text>
<rect x="20.0" y="90.0" width="680.0" height="36.0" fill="#f7f7f7" stroke="#bbb" stroke-width="1" rx="0"/>
<text x="28.0" y="113.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">ตั้งเครื่องและล้างไลน์</text>
<text x="218.0" y="113.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">300,000</text>
<text x="338.0" y="113.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">จำนวนครั้งที่ตั้งเครื่อง</text>
<text x="528.0" y="113.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">20</text>
<text x="618.0" y="113.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">40</text>
<rect x="20.0" y="126.0" width="680.0" height="36.0" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="0"/>
<text x="28.0" y="149.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">ตรวจคุณภาพ</text>
<text x="218.0" y="149.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">240,000</text>
<text x="338.0" y="149.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">จำนวนครั้งที่ตรวจ</text>
<text x="528.0" y="149.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">40</text>
<text x="618.0" y="149.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">80</text>
<rect x="20.0" y="162.0" width="680.0" height="36.0" fill="#f7f7f7" stroke="#bbb" stroke-width="1" rx="0"/>
<text x="28.0" y="185.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">ออกแบบและดูแลสูตร</text>
<text x="218.0" y="185.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">180,000</text>
<text x="338.0" y="185.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">ชั่วโมงงานออกแบบ</text>
<text x="528.0" y="185.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">100</text>
<text x="618.0" y="185.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">200</text>
<text x="28.0" y="222.0" font-size="13" text-anchor="start" fill="#333" font-weight="normal">ผลิต A 20,000 กล่อง ใช้แรงงานทางตรง 10,000 ชม. · ผลิต B 2,000 กล่อง ใช้แรงงานทางตรง 2,000 ชม.</text>
