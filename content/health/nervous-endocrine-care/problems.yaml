problems:
- id: health.body.nervous-endocrine-care.p001
  topics:
  - health.body.nervous-endocrine-care
  difficulty: 1
  type: mcq
  stem: ระบบใดส่งสัญญาณไปทั่วร่างกายด้วยฮอร์โมนที่ไปตามกระแสเลือด
  choices:
  - id: a
    text: ระบบต่อมไร้ท่อ
    correct: true
  - id: b
    text: ระบบประสาท
    feedback: ระบบประสาทส่งสัญญาณเป็นกระแสประสาทไปตามเซลล์ประสาท ไม่ใช่ฮอร์โมนในเลือด
  - id: c
    text: ระบบย่อยอาหาร
    feedback: ระบบย่อยอาหารย่อยและดูดซึมอาหาร ไม่ได้เป็นระบบส่งสัญญาณหลักของร่างกาย
  hints:
  - ฮอร์โมนสร้างจากต่อมชนิดหนึ่ง
  - ต่อมชนิดนี้ไม่มีท่อ ปล่อยสารเข้าเลือดโดยตรง
  solution: ระบบต่อมไร้ท่อสร้างฮอร์โมนแล้วปล่อยเข้าสู่กระแสเลือดโดยตรง ส่วนระบบประสาทใช้กระแสประสาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.nervous-endocrine-care.p002
  topics:
  - health.body.nervous-endocrine-care
  difficulty: 1
  type: match
  stem: จับคู่ต่อมไร้ท่อกับฮอร์โมนที่สร้าง
  pairs:
  - left: ต่อมใต้สมอง
    right: โกรทฮอร์โมน
  - left: ต่อมไทรอยด์
    right: ไทรอกซิน
  - left: ต่อมหมวกไต
    right: อะดรีนาลีน
  - left: ตับอ่อน
    right: อินซูลิน
  hints:
  - ต่อมที่คอต้องใช้ไอโอดีนสร้างฮอร์โมน
  - ต่อมที่อยู่บนไตทำงานเมื่อตกใจ
  solution: ต่อมใต้สมองสร้างโกรทฮอร์โมน ต่อมไทรอยด์สร้างไทรอกซิน ต่อมหมวกไตสร้างอะดรีนาลีน และตับอ่อนสร้างอินซูลิน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.nervous-endocrine-care.p003
  topics:
  - health.body.nervous-endocrine-care
  difficulty: 2
  type: mcq
  stem: โกรทฮอร์โมนซึ่งช่วยการเติบโตหลั่งมากที่สุดในช่วงใด
  choices:
  - id: a
    text: ช่วงแรกของการหลับลึก
    correct: true
  - id: b
    text: ตอนตื่นนอนใหม่ ๆ
    feedback: โกรทฮอร์โมนช่วงที่หลั่งมากและคาดได้ที่สุดคือหลังเริ่มหลับไม่นานในช่วงหลับลึก
  - id: c
    text: ระหว่างกินอาหาร
    feedback: การกินอาหารไม่ใช่ช่วงที่โกรทฮอร์โมนหลั่งมากที่สุด
  hints:
  - เกี่ยวกับเหตุผลที่เด็กควรนอนให้พอ
  - เกิดขึ้นตอนที่ร่างกายพักมากที่สุด
  solution: โกรทฮอร์โมนหลั่งมากที่สุดช่วงแรกของการหลับลึก การนอนพอและสม่ำเสมอจึงสำคัญต่อการเติบโต
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.nervous-endocrine-care.p004
  topics:
  - health.body.nervous-endocrine-care
  difficulty: 2
  type: mcq
  stem: ถ้าร่างกายขาดไอโอดีน ต่อมใดได้รับผลโดยตรง
  choices:
  - id: a
    text: ต่อมไทรอยด์
    correct: true
  - id: b
    text: ต่อมหมวกไต
    feedback: ต่อมหมวกไตไม่ได้ใช้ไอโอดีนสร้างอะดรีนาลีน
  - id: c
    text: ตับอ่อน
    feedback: ตับอ่อนสร้างอินซูลิน ซึ่งไม่ต้องใช้ไอโอดีน
  hints:
  - ต่อมนี้อยู่ที่คอ
  - ถ้าขาดอาจเกิดคอพอก
  solution: ต่อมไทรอยด์ใช้ไอโอดีนสร้างไทรอกซิน ถ้าขาดไอโอดีนอาจเกิดคอพอกและกระทบพัฒนาการของสมองในเด็ก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.nervous-endocrine-care.p005
  topics:
  - health.body.nervous-endocrine-care
  difficulty: 2
  type: text
  stem: ตับอ่อนสร้างฮอร์โมนชนิดใดที่ช่วยลดระดับน้ำตาลในเลือด (ตอบชื่อฮอร์โมน)
  accepted:
  - อินซูลิน
  - insulin
  - Insulin
  misconceptions:
  - match: อะดรีนาลีน
    feedback: อะดรีนาลีนสร้างจากต่อมหมวกไต และทำให้ร่างกายตื่นตัว
  - match: ไทรอกซิน
    feedback: ไทรอกซินสร้างจากต่อมไทรอยด์ คุมการเผาผลาญ
  hints:
  - ถ้าร่างกายขาดฮอร์โมนนี้หรือใช้ไม่ได้ จะเป็นเบาหวาน
  - ขึ้นต้นด้วย "อิน"
  solution: ตับอ่อนสร้างอินซูลิน ซึ่งช่วยให้เซลล์นำน้ำตาลจากเลือดไปใช้ ระดับน้ำตาลในเลือดจึงลดลง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.nervous-endocrine-care.p006
  topics:
  - health.body.nervous-endocrine-care
  difficulty: 2
  type: mcq
  stem: แม่ของนิดให้นิดไปซื้อเกลือที่ร้านค้าในหมู่บ้าน ควรเลือกเกลือแบบใดเพื่อช่วยให้ต่อมไทรอยด์ทำงานปกติ
  choices:
  - id: a
    text: เกลือบริโภคเสริมไอโอดีน
    correct: true
  - id: b
    text: เกลือที่ราคาถูกที่สุดโดยไม่ดูฉลาก
    feedback: ควรดูฉลากว่าเป็นเกลือบริโภคเสริมไอโอดีน
  - id: c
    text: ไม่ต้องใช้เกลือเลย แล้วกินอาหารรสจืดทุกมื้อ
    feedback: การลดเค็มดีต่อสุขภาพ แต่เกลือเสริมไอโอดีนในปริมาณพอเหมาะเป็นแหล่งไอโอดีนสำคัญ
  hints:
  - ต่อมไทรอยด์ต้องใช้แร่ธาตุชนิดหนึ่ง
  - กฎหมายไทยกำหนดให้เกลือบริโภคต้องเสริมแร่ธาตุนี้
  solution: เลือกเกลือบริโภคเสริมไอโอดีนและใช้แต่พอดี ไอโอดีนช่วยให้ต่อมไทรอยด์สร้างไทรอกซินได้ปกติ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.nervous-endocrine-care.p007
  topics:
  - health.body.nervous-endocrine-care
  difficulty: 3
  type: numeric
  stem: จากแผนภูมิ ชั่วโมงนอนเฉลี่ยของภูมิในคืนก่อนวันไปโรงเรียน (จันทร์ถึงศุกร์) เป็นกี่ชั่วโมง (ตอบเป็นชั่วโมง)
  figure:
    src: sleep-log.svg
    alt: แผนภูมิแท่ง ชั่วโมงนอนของภูมิ อายุ 13 ปี (ข้อมูลสมมติ) แต่ละแท่งคือการนอนคืนก่อนวันนั้น วันจันทร์ 7.5 ชั่วโมง อังคาร 6.5 พุธ 7 พฤหัสบดี 6 ศุกร์ 8 (วันไปโรงเรียน สีเข้ม) เสาร์ 9.5 อาทิตย์ 10 (วันหยุด สีอ่อน)
  answer:
    value: 7
    unit: ชั่วโมง
  misconceptions:
  - match: 7.79
    feedback: ดูเหมือนเฉลี่ยทั้ง 7 วัน โจทย์ถามเฉพาะวันไปโรงเรียน 5 วัน
  - match: 35
    feedback: 35 คือผลรวม ต้องหารด้วยจำนวนคืน 5
  hints:
  - รวมชั่วโมงนอน 5 คืนที่เป็นแท่งสีเข้ม
  - หารผลรวมด้วย 5
  solution: $7.5 + 6.5 + 7 + 6 + 8 = 35$ ชั่วโมง เฉลี่ย $35 \div 5 = 7$ ชั่วโมง ซึ่งน้อยกว่าที่แนะนำสำหรับอายุ 13–17 ปี (8–10 ชั่วโมง)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.nervous-endocrine-care.p008
  topics:
  - health.body.nervous-endocrine-care
  difficulty: 3
  type: numeric
  stem: "ภูมิต้องตื่นตอน 06:00 น. ถ้าต้องการนอนให้ได้ 9 ชั่วโมง ต้องหลับให้ได้ภายในกี่นาฬิกาของคืนก่อน (ตอบเป็นเลขชั่วโมงแบบ 24 ชั่วโมง เช่น 20)"
  answer:
    value: 21
    unit: นาฬิกา
  misconceptions:
  - match: 15
    feedback: บวก 9 เข้ากับ 6 แทนที่จะนับย้อนหลัง
  - match: 22
    feedback: นับย้อนแค่ 8 ชั่วโมง โจทย์ต้องการ 9 ชั่วโมง
  hints:
  - นับย้อนหลังจากเวลาตื่น
  - "06:00 ย้อนไป 6 ชั่วโมงคือเที่ยงคืน แล้วย้อนอีก 3 ชั่วโมง"
  solution: "06:00 ย้อนหลัง 9 ชั่วโมง คือ 21:00 น. ของคืนก่อน ควรเข้านอนก่อนเวลานั้นเล็กน้อยเพราะต้องใช้เวลากว่าจะหลับ"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.nervous-endocrine-care.p009
  topics:
  - health.body.nervous-endocrine-care
  difficulty: 3
  type: order
  stem: เรียงลำดับเหตุการณ์เมื่อเห็นสุนัขวิ่งเข้ามาหา
  items:
  - ตาเห็นสุนัขและส่งกระแสประสาทไปยังสมอง
  - สมองแปลว่าเป็นอันตราย
  - สมองส่งสัญญาณให้ต่อมหมวกไตหลั่งอะดรีนาลีน
  - หัวใจเต้นเร็ว หายใจเร็ว ร่างกายพร้อมวิ่ง
  hints:
  - เริ่มจากหน่วยรับความรู้สึก
  - ฮอร์โมนทำงานหลังจากระบบประสาทสั่งแล้ว
  solution: ตาเห็น → สมองแปลผล → ต่อมหมวกไตหลั่งอะดรีนาลีน → หัวใจเต้นเร็ว นี่คือตัวอย่างที่ระบบประสาทและต่อมไร้ท่อทำงานร่วมกัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.nervous-endocrine-care.p010
  topics:
  - health.body.nervous-endocrine-care
  difficulty: 3
  type: mcq
  stem: ข้อใดเป็นวิธีดูแลระบบประสาทและระบบต่อมไร้ท่อให้ทำงานปกติ (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: นอนให้ได้ 8–10 ชั่วโมงในวัยรุ่น และปิดหน้าจอก่อนนอน
    correct: true
    feedback: ถูก การนอนช่วยทั้งสมองและการหลั่งโกรทฮอร์โมน
  - id: b
    text: สวมหมวกนิรภัยเมื่อซ้อนรถจักรยานยนต์
    correct: true
    feedback: ถูก ช่วยป้องกันสมองบาดเจ็บ
  - id: c
    text: กินอาหารเสริมเพิ่มความสูงตามโฆษณาโดยไม่ปรึกษาแพทย์
    feedback: การใช้ฮอร์โมนหรืออาหารเสริมเองไม่ใช่การดูแลที่เหมาะสม ควรปรึกษาแพทย์
  - id: d
    text: ดื่มเครื่องดื่มชูกำลังเพื่ออ่านหนังสือดึกทุกคืน
    feedback: ทำให้นอนน้อยและนอนไม่สม่ำเสมอ ซึ่งรบกวนสมองและฮอร์โมน
  hints:
  - ข้อที่ถูกช่วยให้สมองได้พักหรือป้องกันอันตราย
  - ข้อที่ผิดเป็นการใช้ผลิตภัณฑ์โดยไม่จำเป็น
  solution: การนอนพอ ปิดหน้าจอก่อนนอน และสวมหมวกนิรภัยช่วยดูแลทั้งสองระบบ ส่วนอาหารเสริมเพิ่มความสูงโดยไม่ปรึกษาแพทย์และการอดนอนด้วยเครื่องดื่มชูกำลังไม่ใช่การดูแลที่เหมาะสม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.nervous-endocrine-care.p011
  topics:
  - health.body.nervous-endocrine-care
  difficulty: 3
  type: mcq
  stem: ข้อใดเปรียบเทียบระบบประสาทกับระบบต่อมไร้ท่อได้ถูกต้อง
  choices:
  - id: a
    text: ระบบประสาทตอบสนองเร็วแต่ผลสั้น ระบบต่อมไร้ท่อตอบสนองช้ากว่าแต่ผลอยู่นาน
    correct: true
  - id: b
    text: ระบบต่อมไร้ท่อเร็วกว่าเพราะฮอร์โมนไปทุกที่พร้อมกัน
    feedback: ฮอร์โมนต้องเดินทางไปกับเลือด จึงช้ากว่ากระแสประสาท
  - id: c
    text: ทั้งสองระบบทำงานแยกกันโดยไม่เกี่ยวข้องกัน
    feedback: สองระบบทำงานร่วมกัน โดยมีไฮโพทาลามัสในสมองเป็นจุดเชื่อม
  hints:
  - นึกถึงตอนตกใจ ใจเต้นแรงอยู่นานแม้เหตุการณ์จบแล้ว
  - กระแสประสาทเร็วมาก ส่วนเลือดต้องไหลเวียน
  solution: ระบบประสาทสั่งการได้ในเสี้ยววินาทีแต่ผลสั้น ระบบต่อมไร้ท่อใช้ฮอร์โมนในเลือดจึงช้ากว่าแต่ผลอยู่นาน และทั้งสองระบบทำงานร่วมกัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.nervous-endocrine-care.p012
  topics:
  - health.body.nervous-endocrine-care
  difficulty: 4
  type: mcq
  stem: ในการแข่งฟุตบอลของโรงเรียน เพื่อนของต้นโหม่งบอลชนศีรษะกับอีกคน หลังจากนั้นบอกว่าปวดหัว อาเจียน และดูง่วงซึม ต้นควรทำอย่างไร
  choices:
  - id: a
    text: ให้เพื่อนหยุดเล่น ไม่ขยับคอโดยไม่จำเป็น บอกครูทันที และโทร 1669
    correct: true
  - id: b
    text: ให้เพื่อนนั่งพักสักครู่แล้วกลับไปเล่นต่อเพราะยังเดินได้
    feedback: อาเจียนและง่วงซึมหลังศีรษะกระแทกเป็นสัญญาณอันตราย ไม่ควรกลับไปเล่น
  - id: c
    text: ให้เพื่อนนอนหลับในห้องคนเดียวจะได้หายเร็ว
    feedback: ต้องมีผู้ใหญ่อยู่ด้วยและสังเกตอาการ อาการเหล่านี้ต้องได้รับการช่วยเหลือทางการแพทย์
  hints:
  - อาการใดบ้างที่เป็นสัญญาณอันตรายหลังศีรษะกระแทก
  - เหตุฉุกเฉินทางการแพทย์ในไทยโทรหมายเลขใด
  solution: อาเจียนและง่วงซึมหลังศีรษะกระแทกเป็นสัญญาณที่ต้องได้รับการช่วยเหลือทันที ให้หยุดเล่น บอกครู โทร 1669 และไม่เคลื่อนย้ายถ้าอาจบาดเจ็บที่คอ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.body.nervous-endocrine-care.p013
  topics:
  - health.body.nervous-endocrine-care
  difficulty: 4
  type: numeric
