  - id: computer.data.data-preparation.p017
    topics: [computer.data.data-preparation]
    difficulty: 5
    type: code
    stem: "เขียนฟังก์ชัน `merge_tables(a_text, b_text)` รับข้อความ CSV สองชุด ชุดแรกมีหัวคอลัมน์ `student_id,name` ชุดที่สองมี `student_id,math` รวมแบบ inner join ด้วย student_id แล้วคืนรายการดิกชันนารี `{\"student_id\": int, \"name\": str, \"math\": int}` เรียงตาม student_id จากน้อยไปมาก"
    starter: |
      def merge_tables(a_text, b_text):
          pass
    tests: |
      a = "student_id,name\n3,วิชัย\n1,สมชาย\n2,สมหญิง\n"
      b = "student_id,math\n2,18\n4,20\n1,15\n"
      r = merge_tables(a, b)
      expected = [{"student_id": 1, "name": "สมชาย", "math": 15}, {"student_id": 2, "name": "สมหญิง", "math": 18}]
      assert r == expected, f"ได้ {r} ควรได้ {expected} (ต้องเก็บเฉพาะรหัสที่อยู่ในทั้งสองตาราง และเรียงตามรหัส)"
      r2 = merge_tables("student_id,name\n", "student_id,math\n")
      assert r2 == [], f"ตารางว่างต้องได้รายการว่าง แต่ได้ {r2}"
    reference: |
      import csv, io
      def merge_tables(a_text, b_text):
          names = {}
          for row in csv.DictReader(io.StringIO(a_text)):
              names[int(row["student_id"])] = row["name"].strip()
          rows = []
          for row in csv.DictReader(io.StringIO(b_text)):
              sid = int(row["student_id"])
              if sid in names:
                  rows.append({"student_id": sid, "name": names[sid], "math": int(row["math"])})
          return sorted(rows, key=lambda r: r["student_id"])
    hints:
      - "เริ่มจากทำดิกชันนารีของตารางแรก โดยใช้รหัสเป็นคีย์"
      - "วนตารางที่สอง และเก็บเฉพาะรหัสที่มีอยู่ในดิกชันนารีของตารางแรก"
      - "เรียงผลตามรหัสนักเรียนก่อนคืนค่า"
    solution: "สร้างดิกชันนารีชื่อจากตารางแรก แล้ววนตารางที่สองเก็บเฉพาะรหัสที่ตรงกัน แปลงคะแนนเป็น int และเรียงตาม student_id"
    license: CC-BY-SA-4.0
    ai_assisted: true

