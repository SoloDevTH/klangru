<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" font-family="sans-serif" font-size="15">
  <title>เส้นทางข้อมูลของระบบ IoT จากเซนเซอร์ถึงแอป</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15211e"/></marker></defs>
  <rect x="0" y="0" width="680" height="300" fill="#ffffff"/>
  <text x="340" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#15211e">เส้นทางข้อมูลของระบบ IoT จากอุปกรณ์ถึงแอป</text>
  <rect x="20" y="110" width="130" height="70" rx="8" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="85.0" y="141.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#15211e">เซนเซอร์และ</text>
  <text x="85.0" y="159.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#15211e">แอคชูเอเตอร์</text>
  <rect x="190" y="110" width="130" height="70" rx="8" fill="#f6e7df" stroke="#15211e" stroke-width="2"/>
  <text x="255.0" y="141.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#15211e">เกตเวย์</text>
  <text x="255.0" y="159.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#15211e">(ประมวลผลขอบ)</text>
  <rect x="360" y="110" width="130" height="70" rx="8" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="425.0" y="141.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#15211e">คลาวด์</text>
  <text x="425.0" y="159.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#15211e">(เก็บและวิเคราะห์)</text>
  <rect x="530" y="110" width="130" height="70" rx="8" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="595.0" y="141.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#15211e">แอปผู้ใช้</text>
  <text x="595.0" y="159.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#15211e">(ดูและสั่งงาน)</text>
  <line x1="154" y1="145.0" x2="186" y2="145.0" stroke="#15211e" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="170.0" y="98" text-anchor="middle" font-size="12" font-weight="normal" fill="#4a5a55">BLE / Zigbee / LoRa</text>
  <line x1="324" y1="145.0" x2="356" y2="145.0" stroke="#15211e" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="340.0" y="98" text-anchor="middle" font-size="12" font-weight="normal" fill="#4a5a55">Wi-Fi / 4G / 5G</text>
  <line x1="494" y1="145.0" x2="526" y2="145.0" stroke="#15211e" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="510.0" y="98" text-anchor="middle" font-size="12" font-weight="normal" fill="#4a5a55">MQTT / HTTPS</text>
  <text x="340" y="230" text-anchor="middle" font-size="13" font-weight="normal" fill="#4a5a55">ลูกศรแสดงทางของข้อมูลจากอุปกรณ์ ส่วนคำสั่งจากแอปย้อนกลับมาตามเส้นทางเดียวกัน</text>
  <text x="340" y="256" text-anchor="middle" font-size="13" font-weight="normal" fill="#4a5a55">เกตเวย์ทำหน้าที่แปลโพรโทคอลและคัดกรองข้อมูลก่อนส่งขึ้นคลาวด์</text>
</svg>
