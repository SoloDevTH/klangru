id: math.geometry.volume-surface
subject: math
title: { th: ปริมาตรและพื้นที่ผิว, en: Volume and surface area }
summary: หาปริมาตรและพื้นที่ผิวของปริซึม ทรงกระบอก พีระมิด กรวย และทรงกลม แล้วแปลงหน่วยปริมาตรเป็นลิตรเพื่อใช้ในชีวิตจริง
difficulty: 3.5
minutes: 40
prerequisites: [math.geometry.area-perimeter, math.number.exponents, math.measure.volume-capacity]
encompasses:
  - { id: math.geometry.area-perimeter, weight: 0.5 }
  - { id: math.number.exponents, weight: 0.2 }
  - { id: math.number.decimals, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: พื้นที่ผิวของแก้วน้ำทรงกระบอกจากรูปคลี่
    problem: "แก้วน้ำทรงกระบอกไม่มีฝา รัศมีฐาน $4\\ \\mathrm{cm}$ สูง $10\\ \\mathrm{cm}$ ต้องใช้วัสดุกี่ตารางเซนติเมตร (ใช้ $\\pi \\approx 3.14$)"
    figure: { src: cylinder-net.svg, alt: "รูปคลี่ของทรงกระบอก ประกอบด้วยสี่เหลี่ยมผืนผ้าผิวข้างกว้าง h = 10 ยาว 2πr ประมาณ 25.1 cm และวงกลมรัศมี r = 4 สองวงติดที่ขอบบนและขอบล่าง" }
    steps:
      - text: "คลี่แก้วออก: ผิวข้างเป็นสี่เหลี่ยมผืนผ้า และมีก้นแก้วเป็นวงกลม 1 วง (ไม่มีฝา)"
        why: "รูปคลี่ปกติของทรงกระบอกปิดมีวงกลม 2 วง แต่แก้วน้ำเปิดด้านบน"
      - text: "ด้านยาวของสี่เหลี่ยมเท่ากับเส้นรอบวงฐาน $2\\pi r = 2 \\times 3.14 \\times 4 = 25.12\\ \\mathrm{cm}$"
        why: "ผิวข้างพันรอบฐานพอดีหนึ่งรอบ"
      - text: "ผิวข้าง $= 25.12 \\times 10 = 251.2\\ \\mathrm{cm^2}$"
      - text: "ก้นแก้ว $= \\pi r^2 = 3.14 \\times 16 = 50.24\\ \\mathrm{cm^2}$"
      - text: "รวม $= 251.2 + 50.24 = 301.44\\ \\mathrm{cm^2}$"
    answer: "ประมาณ $301.44\\ \\mathrm{cm^2}$"
  - { type: check, problem: math.vol.p002, prompt: "ปริมาตรวัดเป็นหน่วยแบบใด" }
  - type: worked-example
    title: ปริมาตรของทรงประกอบ ไอศกรีมโคน
    problem: "โคนไอศกรีมทรงกรวยรัศมี $3\\ \\mathrm{cm}$ ลึก $12\\ \\mathrm{cm}$ ใส่ไอศกรีมเต็มโคนและพูนเป็นครึ่งทรงกลมรัศมี $3\\ \\mathrm{cm}$ ด้านบน มีไอศกรีมทั้งหมดกี่ลูกบาศก์เซนติเมตร (ใช้ $\\pi \\approx 3.14$)"
    figure: { src: ice-cream-composite.svg, alt: "ไอศกรีมโคน ส่วนล่างเป็นกรวยคว่ำรัศมีปาก 3 cm สูง 12 cm ส่วนบนเป็นครึ่งทรงกลมรัศมี 3 cm วางบนปากกรวย" }
    steps:
      - text: "แยกเป็นสองทรง: กรวย และครึ่งทรงกลม ที่มีรัศมีเท่ากัน"
        why: "ทรงประกอบหาปริมาตรได้โดยแยกเป็นทรงพื้นฐานแล้วบวกกัน"
      - text: "กรวย: $\\tfrac13 \\pi r^2 h = \\tfrac13 \\times 3.14 \\times 9 \\times 12 = 113.04\\ \\mathrm{cm^3}$"
      - text: "ครึ่งทรงกลม: $\\tfrac12 \\times \\tfrac43 \\pi r^3 = \\tfrac23 \\times 3.14 \\times 27 = 56.52\\ \\mathrm{cm^3}$"
        why: "ใช้ครึ่งหนึ่งของปริมาตรทรงกลม เพราะพูนแค่ครึ่งลูก"
      - text: "รวม $= 113.04 + 56.52 = 169.56\\ \\mathrm{cm^3}$"
      - text: "ตรวจ: เขียนเป็น $36\\pi + 18\\pi = 54\\pi$ ได้ $54 \\times 3.14 = 169.56$ ✓"
    answer: "ประมาณ $169.56\\ \\mathrm{cm^3}$"
  - { type: check, problem: math.vol.p006, prompt: "ทรงที่เรียวเข้าหายอดต่างจากปริซึมอย่างไร" }
  - type: interactive
    title: ทรงกระบอกกับกรวยที่ฐานและความสูงเท่ากัน
    caption: "แกน x คือรัศมีฐาน เส้นบนคือปริมาตรทรงกระบอก เส้นล่างคือปริมาตรกรวยที่สูงเท่ากัน ลองเลื่อนความสูง h แล้วสังเกตว่าเส้นล่างสูงเป็นหนึ่งในสามของเส้นบนเสมอ และเมื่อรัศมีเพิ่มเป็นสองเท่า ปริมาตรเพิ่มเป็นสี่เท่า"
    widget:
      kind: function-plot
      functions: ["\\pi x^2 h", "\\frac{1}{3}\\pi x^2 h"]
      sliders:
        - { name: h, min: 1, max: 5, step: 0.5, value: 2, label: ความสูง }
      x: [0, 3]
      y: [0, 60]
glossary:
  - { term: ปริมาตร, definition: "ขนาดของที่ว่างภายในทรงสามมิติ นับเป็นจำนวนลูกบาศก์หน่วย เช่น $\\mathrm{cm^3}$ หรือ $\\mathrm{m^3}$" }
  - { term: พื้นที่ผิว, definition: "ผลรวมพื้นที่ของทุกหน้าที่ห่อหุ้มทรงสามมิติ มีหน่วยเป็นตารางหน่วย เช่น $\\mathrm{cm^2}$" }
  - { term: ปริซึม, definition: "ทรงที่มีหน้าตัดหัวท้ายเป็นรูปเหมือนกันและขนานกัน หน้าตัดทุกระดับเท่ากับฐาน" }
  - { term: สูงเอียง, definition: "ระยะจากยอดกรวยหรือยอดพีระมิดลงมาตามผิวด้านข้างถึงขอบฐาน ใช้หาพื้นที่ผิวข้าง" }
flashcards:
  - { front: "ปริมาตรปริซึมและทรงกระบอก", back: "พื้นที่ฐาน × สูง ทรงกระบอกจึงได้ $\\pi r^2 h$" }
  - { front: "ปริมาตรพีระมิดและกรวย", back: "$\\tfrac{1}{3}$ × พื้นที่ฐาน × สูง กรวยจึงได้ $\\tfrac{1}{3}\\pi r^2 h$" }
  - { front: "ปริมาตรและพื้นที่ผิวทรงกลมรัศมี $r$", back: "ปริมาตร $\\tfrac{4}{3}\\pi r^3$ พื้นที่ผิว $4\\pi r^2$" }
  - { front: "$1\\ \\mathrm{m^3}$ เท่ากับกี่ลิตร", back: "$1{,}000$ ลิตร และ $1$ ลิตร $= 1{,}000\\ \\mathrm{cm^3}$" }
