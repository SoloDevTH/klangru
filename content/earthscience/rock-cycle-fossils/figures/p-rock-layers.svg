<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="sans-serif" font-size="14">
<title>ชั้นหินในหน้าผาแห่งหนึ่ง (สมมติ)</title>
<rect x="0" y="0" width="640" height="330" fill="#ffffff"/>
<rect x="60" y="20" width="300" height="70" fill="#fde68a" stroke="#44403c"/>
<text x="35.0" y="62.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">ง</text>
<text x="380.0" y="51.0" text-anchor="start" font-size="15" font-weight="bold" fill="#222">ดินและกรวดแม่น้ำ</text>
<rect x="60" y="90" width="300" height="70" fill="#fdba74" stroke="#44403c"/>
<text x="35.0" y="132.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">ค</text>
<text x="380.0" y="121.0" text-anchor="start" font-size="15" font-weight="bold" fill="#222">หินทราย</text>
<text x="380.0" y="143.0" text-anchor="start" font-size="13" fill="#374151">พบ: ไม้กลายเป็นหิน</text>
<rect x="60" y="160" width="300" height="70" fill="#fca5a5" stroke="#44403c"/>
<text x="35.0" y="202.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">ข</text>
