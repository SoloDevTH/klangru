      - "en มีอะตอม N สองอะตอมที่ให้คู่อิเล็กตรอน"
    solution: "NH₃ ให้ได้หนึ่งคู่ en ให้ได้สองคู่ และ EDTA ให้ได้หกคู่จากอะตอม N สองและ O สี่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.acids-bases.polyprotic-lewis-complex.p012
    topics: [chemistry.acids-bases.polyprotic-lewis-complex]
    difficulty: 2
    type: text
    stem: "ชื่อเรียกของไอออนเชิงซ้อน [Ag(NH₃)₂]⁺ ตามระบบ IUPAC ประมาณว่าอย่างไร (ตอบเป็นภาษาไทยหรืออังกฤษ)"
    accepted: ["ไดแอมมีนซิลเวอร์(I)", "ไดแอมมีนซิลเวอร์ (I)", "diamminesilver(I)", "diamminesilver"]
    misconceptions:
      - { match: "ไดแอมมีนซิลเวอร์(II)", feedback: "เลขออกซิเดชันของ Ag ในไอออนนี้คือ +1 จึงเป็น (I)" }
    hints:
      - "NH₃ เรียกว่า ammine ในชื่อเชิงซ้อน"
      - "จำนวน NH₃ สองตัวเรียกว่า di"
