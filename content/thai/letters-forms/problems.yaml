problems:
- id: thai.composition.letters-forms.p001
  topics:
  - thai.composition.letters-forms
  difficulty: 1
  type: mcq
  stem: ในจดหมาย **ที่อยู่ผู้เขียน** เขียนไว้ตรงไหน
  choices:
  - id: a
    text: มุมขวาบน
    correct: true
    feedback: ถูก
  - id: b
    text: มุมซ้ายบน
    feedback: มุมซ้ายบนเป็นที่อยู่ผู้ส่งบน **ซองจดหมาย** ไม่ใช่ในตัวจดหมาย
  - id: c
    text: ท้ายจดหมายใต้ชื่อ
    feedback: ท้ายจดหมายเป็นคำลงท้ายและลงชื่อ
  - id: d
    text: กลางหน้ากระดาษ
    feedback: กลางหน้าเป็นเนื้อความ
  hints:
  - นึกถึงภาพส่วนประกอบของจดหมาย
  - ส่วนที่ 1 อยู่บนสุด ด้านขวา
  solution: ที่อยู่ผู้เขียนอยู่ **มุมขวาบน** แล้วตามด้วยวันที่
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.letters-forms.p002
  topics:
  - thai.composition.letters-forms
  difficulty: 1
  type: match
  stem: จับคู่ผู้รับจดหมายกับ **คำลงท้าย** ที่เหมาะ
  pairs:
  - left: แม่
    right: ด้วยความเคารพอย่างสูง
  - left: คุณครู
    right: ด้วยความเคารพ
  - left: เพื่อนสนิท
    right: ด้วยความคิดถึง
  - left: ผู้อำนวยการพิพิธภัณฑ์ (กิจธุระ)
    right: ขอแสดงความนับถือ
  hints:
  - ผู้ใหญ่ที่ใกล้ชิดที่สุดใช้คำที่ยกย่องที่สุด
  - จดหมายกิจธุระใช้คำลงท้ายแบบทางการ
  solution: แม่ = ด้วยความเคารพอย่างสูง · ครู = ด้วยความเคารพ · เพื่อน = ด้วยความคิดถึง · กิจธุระ = ขอแสดงความนับถือ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.letters-forms.p003
  topics:
  - thai.composition.letters-forms
  difficulty: 2
  type: mcq
  stem: จ่าหน้าซองจดหมาย **แสตมป์** ติดตรงไหน
  choices:
  - id: a
    text: มุมขวาบนของซอง
    correct: true
    feedback: ถูก
  - id: b
    text: มุมซ้ายบนของซอง
    feedback: เป็นที่เขียนชื่อและที่อยู่ผู้ส่ง
  - id: c
    text: กลางซอง
    feedback: กลางซองค่อนขวาล่างเป็นที่อยู่ผู้รับ
  - id: d
    text: ด้านหลังซอง
    feedback: ไปรษณีย์ต้องเห็นแสตมป์ด้านหน้า
  hints:
  - ด้านหน้าซองมี 3 ส่วน ผู้ส่ง แสตมป์ ผู้รับ
  - ผู้ส่งอยู่ซ้ายบน แสตมป์อยู่อีกมุมหนึ่ง
  solution: แสตมป์ติด **มุมขวาบน**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.letters-forms.p004
  topics:
  - thai.composition.letters-forms
  difficulty: 2
  type: mcq
  stem: ปลาเขียนจดหมายถึงแม่ที่ทำงานต่างจังหวัด คำขึ้นต้นใดเหมาะที่สุด
  choices:
  - id: a
    text: กราบเท้าคุณแม่ที่เคารพอย่างสูง
    correct: true
    feedback: ถูก เป็นคำขึ้นต้นสำหรับพ่อแม่
  - id: b
    text: ถึงแม่
    feedback: เป็นกันเองเกินไปสำหรับจดหมายถึงพ่อแม่
  - id: c
    text: เรียน ผู้ปกครอง
    feedback: เป็นแบบทางการ ไม่ใช่จดหมายส่วนตัวถึงแม่
  - id: d
    text: แม่เพื่อนรัก
    feedback: ใช้กับเพื่อน
  hints:
  - จดหมายถึงพ่อแม่ต้องแสดงความเคารพสูง
  - คู่กับคำลงท้าย ด้วยความเคารพอย่างสูง
  solution: '**กราบเท้าคุณแม่ที่เคารพอย่างสูง** คู่กับ ด้วยความเคารพอย่างสูง'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.letters-forms.p005
  topics:
  - thai.composition.letters-forms
  difficulty: 2
  type: order
  stem: เรียงที่อยู่ผู้รับบนซองให้ถูก (จากบรรทัดบนลงล่าง)
  items:
  - นางบุญมา ใจดี
  - 45 หมู่ 7 ตำบลท่าน้ำ
  - อำเภอริมคลอง จังหวัดสุขสันต์
  - '12340'
  hints:
  - เริ่มจากชื่อผู้รับ
  - ที่อยู่เรียงจากพื้นที่เล็กไปใหญ่ แล้วจบด้วยรหัสไปรษณีย์
  solution: ชื่อ → บ้านเลขที่ หมู่ ตำบล → อำเภอ จังหวัด → **รหัสไปรษณีย์**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.letters-forms.p006
  topics:
  - thai.composition.letters-forms
  difficulty: 3
  type: mcq
  stem: อ่านใบลาในภาพ ข้อมูลสำคัญใด **ขาดไป** ในเนื้อความ
  figure: &id001
    src: leave-letter-draft.svg
    alt: 'ใบลาป่วยสมมุติที่ยังเขียนไม่ครบ มุมขวาบนเป็นที่อยู่ บ้านเลขที่ 8 หมู่ 2 ต.บ้านสวน อ.เมือง จ.สุขสันต์ (สมมุติ) วันที่ 4 พฤศจิกายน 2569 เรื่อง ขอลาป่วย เรียน คุณครูประจำชั้น ป.4/2 เนื้อความ: ข้าพเจ้า เด็กชายต้นกล้า มีสุข นักเรียนชั้น ป.4/2 มีไข้และไอ แพทย์ให้พักที่บ้าน จึงขอลาป่วย เมื่อหายแล้วจะกลับมาเรียนตามปกติ จึงเรียนมาเพื่อโปรดพิจารณา คำลงท้าย ด้วยความคิดถึง ลงชื่อ ต้นกล้า มีสุข (เด็กชายต้นกล้า มีสุข) ไม่มีส่วนอื่นอีก'
  choices:
  - id: a
    text: วันที่ขอลาและจำนวนวัน
    correct: true
    feedback: ถูก ครูไม่รู้ว่าต้นกล้าจะหยุดวันไหนถึงวันไหน
  - id: b
    text: ชื่อและชั้นของผู้ลา
    feedback: 'มีแล้ว: เด็กชายต้นกล้า มีสุข ป.4/2'
  - id: c
    text: สาเหตุที่ลา
    feedback: 'มีแล้ว: มีไข้และไอ'
  - id: d
    text: ชื่อเรื่อง
    feedback: 'มีแล้ว: ขอลาป่วย'
  hints:
  - ใบลาต้องบอก ใคร ลาเพราะอะไร ลาวันไหนถึงวันไหน
  - ไล่ดูทีละข้อว่ามีครบไหม
  solution: เนื้อความไม่บอก **ลาวันที่เท่าไรถึงวันที่เท่าไร รวมกี่วัน**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.letters-forms.p007
  topics:
  - thai.composition.letters-forms
  difficulty: 3
  type: mcq
  stem: อ่านใบลาในภาพ คำลงท้าย "ด้วยความคิดถึง" ควรแก้เป็นข้อใด
  figure: *id001
  choices:
  - id: a
    text: ด้วยความเคารพ
    correct: true
    feedback: ถูก ใบลาเขียนถึงครู ใช้คำลงท้ายแสดงความเคารพ
  - id: b
    text: รักและคิดถึง
    feedback: ใช้กับเพื่อนหรือคนในครอบครัวแบบเป็นกันเอง
  - id: c
    text: ด้วยความเคารพอย่างสูง
    feedback: มักใช้กับพ่อแม่หรือปู่ย่าตายาย
  - id: d
    text: ไม่ต้องมีคำลงท้าย
    feedback: จดหมายทุกแบบมีคำลงท้าย
  hints:
  - ผู้รับคือใคร
  - คำลงท้ายต้องเข้าคู่กับ เรียน...
  solution: เขียนถึงครู ใช้ **ด้วยความเคารพ** (บางเล่มใช้ ขอแสดงความนับถือ ก็ได้ตามที่ครูกำหนด)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.letters-forms.p008
  topics:
  - thai.composition.letters-forms
  difficulty: 3
  type: text
  stem: เขียนจำนวนเงิน **250 บาท** เป็นตัวอักษรสำหรับกรอกแบบรายการ
  accepted:
  - สองร้อยห้าสิบบาทถ้วน
  misconceptions:
  - match: สองร้อยห้าสิบบาท
    feedback: เกือบถูก จำนวนเต็มบาทต้องลงท้ายด้วย ถ้วน กันการเติมสตางค์
  - match: สองร้อยห้าสิบ
    feedback: ต้องมีหน่วย บาท และคำว่า ถ้วน
  - match: สองร้อยห้าสิบบาทถ้วนบาท
    feedback: ใส่บาทซ้ำ
  hints:
  - อ่านตัวเลขทีละหลัก ร้อย สิบ หน่วย
  - จำนวนเต็มบาทลงท้ายด้วยคำใด
  solution: 250 บาท = **สองร้อยห้าสิบบาทถ้วน**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.letters-forms.p009
  topics:
  - thai.composition.letters-forms
  difficulty: 3
  type: mcq
  stem: อ่านใบสมัครในภาพ ข้อใด **กรอกผิด**
  figure: &id002
    src: library-form.svg
    alt: 'ใบสมัครสมาชิกห้องสมุดประชาชนสมมุติที่กรอกแล้ว ชื่อ–นามสกุล เด็กหญิงใบเตย ใจดี วันเกิด 12 มกราคม 2558 โรงเรียนและชั้น โรงเรียนบ้านสวน ป.5 โทรศัพท์ผู้ปกครอง ว่าง อาชีพ (ผู้ใหญ่) ว่าง ค่าสมาชิก 20 บาท ตัวอักษรเขียนว่า สองสิบบาท ลงชื่อผู้สมัคร ใบเตย ใจดี วันที่ ยังไม่ได้กรอก หมายเหตุท้ายแบบ: ช่องที่ไม่เกี่ยวกับผู้สมัครให้ขีด - จำนวนเงินเขียนทั้งตัวเลขและตัวอักษร'
  choices:
  - id: a
    text: ค่าสมาชิกเป็นตัวอักษร "สองสิบบาท"
    correct: true
    feedback: ถูก 20 อ่านว่า ยี่สิบ ต้องเขียน ยี่สิบบาทถ้วน
  - id: b
    text: ชื่อ–นามสกุล
    feedback: กรอกครบ มีคำนำหน้า
  - id: c
    text: วันเกิด
    feedback: กรอกครบทั้งวัน เดือน ปี
  - id: d
    text: โรงเรียนและชั้น
    feedback: กรอกครบ
  hints:
  - ตรวจตัวเลขกับตัวอักษรให้ตรงกัน
  - ภาษาไทยอ่าน 20 ว่าอย่างไร
  solution: 20 ต้องเขียนว่า **ยี่สิบบาทถ้วน** ไม่ใช่ สองสิบบาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.letters-forms.p010
  topics:
  - thai.composition.letters-forms
  difficulty: 3
  type: mcq
  stem: อ่านใบสมัครในภาพ ใบเตยเป็นนักเรียน ช่อง **อาชีพ (ผู้ใหญ่)** ควรทำอย่างไร
  figure: *id002
  choices:
  - id: a
    text: ขีด - ในช่อง
    correct: true
    feedback: ถูก ช่องที่ไม่เกี่ยวกับผู้สมัครให้ขีด ไม่ปล่อยว่าง
  - id: b
    text: ปล่อยว่างไว้
    feedback: ผู้รับแบบไม่รู้ว่าลืมกรอกหรือไม่เกี่ยว
  - id: c
    text: เขียนว่า นักเรียน
    feedback: ช่องนี้เป็นของผู้ใหญ่ ข้อมูลนักเรียนอยู่ในช่องโรงเรียนแล้ว
  - id: d
    text: เขียนอาชีพของพ่อ
    feedback: ช่องนี้ถามอาชีพของผู้สมัครที่เป็นผู้ใหญ่
  hints:
  - อ่านหมายเหตุท้ายแบบ
  - ช่องที่ไม่เกี่ยวควรทำอย่างไร
  solution: ช่องที่ไม่เกี่ยวกับผู้สมัคร **ขีด -** ตามหมายเหตุ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.letters-forms.p011
  topics:
  - thai.composition.letters-forms
  difficulty: 4
  type: numeric
  stem: ต้นกล้าขอลาป่วยตั้งแต่วันที่ 4 ถึงวันที่ 6 พฤศจิกายน 2569 (วันพุธถึงวันศุกร์) ต้องเขียนในใบลาว่ารวมกี่วัน
  answer:
    value: 3
    unit: วัน
  misconceptions:
  - match: 2
    feedback: นำ 6 − 4 ได้ 2 แต่ต้องนับวันที่ 4 ด้วย จึงต้องบวก 1
  hints:
  - นับวันทีละวัน 4 5 6
  - วันสุดท้าย − วันแรก + 1
  solution: $6 - 4 + 1 = 3$ วัน (พุธ พฤหัสบดี ศุกร์)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.letters-forms.p012
  topics:
  - thai.composition.letters-forms
  difficulty: 4
  type: order
  stem: เรียงเนื้อความ **จดหมายกิจธุระ** ขอเข้าชมพิพิธภัณฑ์
  items:
  - ด้วยข้าพเจ้าเป็นหัวหน้าชุมนุมประวัติศาสตร์ โรงเรียนบ้านสวน
  - ชุมนุมมีความประสงค์ขอเข้าชมพิพิธภัณฑ์ในวันเสาร์ที่ 14 พฤศจิกายน 2569 เวลา 09.00 น. จำนวน 25 คน
  - จึงเรียนมาเพื่อโปรดพิจารณาอนุเคราะห์
  - ขอแสดงความนับถือ
  hints:
  - 'เนื้อความกิจธุระ: เหตุ → จุดประสงค์ → ปิด'
  - คำลงท้ายอยู่หลังเนื้อความ
  solution: เหตุ (ผู้เขียนเป็นใคร) → จุดประสงค์ (ขออะไร เมื่อไร กี่คน) → จึงเรียนมาเพื่อโปรดพิจารณาอนุเคราะห์ → ขอแสดงความนับถือ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.letters-forms.p013
  topics:
  - thai.composition.letters-forms
  difficulty: 4
  type: mcq
  stem: ประโยคใดเหมาะกับ **จดหมายกิจธุระ** ถึงเจ้าของฟาร์มเห็ด
  choices:
  - id: a
    text: ชุมนุมเกษตรใคร่ขอความอนุเคราะห์เข้าศึกษาดูงานการเพาะเห็ด
    correct: true
    feedback: ถูก ใช้ภาษาทางการ กระชับ บอกจุดประสงค์ชัด
  - id: b
    text: พวกหนูอยากไปดูฟาร์มเห็ดหน่อยค่ะ
    feedback: เป็นภาษาพูด ไม่เป็นทางการ
  - id: c
    text: ไปดูฟาร์มได้ป่ะครับ
    feedback: ใช้คำแสลง ไม่สุภาพสำหรับกิจธุระ
  - id: d
    text: ฟาร์มของคุณสวยมาก อยากไปเที่ยวเล่นจังเลย
    feedback: ไม่บอกจุดประสงค์ที่ชัด และเป็นภาษาพูด
  hints:
  - จดหมายกิจธุระใช้ภาษาระดับใด
  - หาคำที่เป็นทางการ เช่น ใคร่ อนุเคราะห์
  solution: '**ชุมนุมเกษตรใคร่ขอความอนุเคราะห์...** เป็นภาษาทางการและบอกจุดประสงค์ชัด'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.letters-forms.p014
  topics:
  - thai.composition.letters-forms
  difficulty: 4
  type: mcq
