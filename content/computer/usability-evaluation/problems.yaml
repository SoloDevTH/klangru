problems:
  - id: computer.design.usability-evaluation.p001
    topics: [computer.design.usability-evaluation]
    difficulty: 1
    type: mcq
    stem: "ความใช้งานได้ (usability) ตามมาตรฐานสากลประกอบด้วยองค์ประกอบใดบ้าง"
    choices:
      - { id: b, text: "ความเร็วของเซิร์ฟเวอร์ ขนาดไฟล์ และจำนวนหน้า", feedback: "สิ่งเหล่านี้เป็นคุณสมบัติทางเทคนิค ไม่ใช่องค์ประกอบของความใช้งานได้ตามมาตรฐาน" }
      - { id: a, text: "ประสิทธิผล ประสิทธิภาพ และความพึงพอใจ", correct: true }
      - { id: c, text: "ราคา ยี่ห้อ และการโฆษณา", feedback: "ราคาและการตลาดไม่ได้เป็นส่วนหนึ่งขององค์ประกอบความใช้งานได้" }
      - { id: d, text: "จำนวนฟีเจอร์และสีของปุ่ม", feedback: "จำนวนฟีเจอร์หรือสีไม่ได้บอกว่าผู้ใช้ทำงานได้สำเร็จและพอใจหรือไม่" }
    hints:
      - "ลองนึกถึงสามคำถามว่าผู้ใช้ทำได้ไหม ทำได้เร็วแค่ไหน และรู้สึกอย่างไร"
      - "องค์ประกอบทั้งหมดวัดจากมุมมองของผู้ใช้"
    solution: "มาตรฐานแยกความใช้งานได้เป็นประสิทธิผล (ทำงานสำเร็จหรือไม่) ประสิทธิภาพ (ใช้เวลาและความพยายามเท่าไร) และความพึงพอใจ (รู้สึกอย่างไร)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.design.usability-evaluation.p002
    topics: [computer.design.usability-evaluation]
    difficulty: 1
    type: match
    stem: "จับคู่หลักการประเมินเชิงฮิวริสติกกับตัวอย่างการออกแบบที่สอดคล้องกับหลักการนั้น"
    pairs:
      - { left: "ระบบควรแจ้งสถานะให้ผู้ใช้เห็น", right: "แถบแสดงความคืบหน้าเมื่ออัปโหลดไฟล์" }
      - { left: "ผู้ใช้ควรควบคุมและยกเลิกได้", right: "ปุ่มเลิกทำ (undo) หลังลบรายการ" }
      - { left: "ป้องกันข้อผิดพลาดก่อนเกิด", right: "ถามยืนยันก่อนลบข้อมูลถาวร" }
      - { left: "ให้ผู้ใช้จำน้อยลง", right: "เลือกจากเมนูที่เห็น แทนการพิมพ์คำสั่งจากความจำ" }
    hints:
      - "ลองดูว่าตัวอย่างนั้นช่วยให้ผู้ใช้รู้ สั่ง หรือกลับคำได้อย่างไร"
      - "หลักการเกี่ยวกับการจำมักแก้ด้วยการแสดงตัวเลือกให้เห็น"
    solution: "การแสดงสถานะ การยกเลิกได้ การป้องกันข้อผิดพลาด และการแสดงตัวเลือกให้เห็นเป็นตัวอย่างที่ตรงกับหลักการทั้งสี่ข้อตามลำดับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.design.usability-evaluation.p003
    topics: [computer.design.usability-evaluation]
    difficulty: 2
    type: numeric
    stem: "ผู้ตอบ SUS คนหนึ่งให้คำตอบข้อ 1 ถึง 10 ตามลำดับดังนี้ 4, 2, 5, 1, 4, 2, 5, 2, 4, 1 (แต่ละข้อตอบในระดับ 1 ถึง 5) คะแนน SUS ของผู้ตอบคนนี้เท่ากับเท่าใด (คะแนนเต็ม 100)"
    answer: { value: 85 }
    hints:
      - "ข้อคี่ให้คะแนนเท่ากับค่าที่ตอบลบหนึ่ง"
      - "ข้อคู่ให้คะแนนเท่ากับห้าลบค่าที่ตอบ"
      - "รวมคะแนนทั้งสิบข้อแล้วคูณ 2.5"
    misconceptions:
      - { match: 62.5, feedback: "ไม่ได้เปลี่ยนคะแนนของข้อคู่เป็นห้าลบค่าที่ตอบ ทำให้ได้ผลรวมต่ำเกินไป" }
      - { match: 34, feedback: "ลืมคูณผลรวมด้วย 2.5 ผลรวมดิบยังไม่ใช่คะแนนเต็ม 100" }
    solution: "ข้อคี่ (4−1)+(5−1)+(4−1)+(5−1)+(4−1) = 17 ข้อคู่ (5−2)+(5−1)+(5−2)+(5−2)+(5−1) = 17 รวม 34 คูณ 2.5 ได้ 85"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.design.usability-evaluation.p004
    topics: [computer.design.usability-evaluation]
    difficulty: 2
    type: mcq
    stem: "การทดสอบแบบคิดดังๆ (think-aloud) ทำอย่างไร"
    choices:
      - { id: b, text: "ให้ผู้ใช้ตอบแบบสอบถามหลังทำงานเสร็จเท่านั้น", feedback: "นั่นคือการสำรวจหลังการใช้งาน ไม่ได้เป็นการพูดคิดขณะทำงาน" }
      - { id: c, text: "ให้ผู้ใช้ทำงานโดยไม่มีผู้สังเกต แล้วดูจากสถิติของระบบ", feedback: "สถิติของระบบบอกว่าเกิดอะไรขึ้น แต่ไม่บอกว่าผู้ใช้คิดอย่างไรขณะทำ" }
      - { id: a, text: "ให้ผู้ใช้พูดสิ่งที่คิดขณะทำงาน แล้วผู้สังเกตจดจุดที่ลังเล กดผิด หรือหาไม่เจอ", correct: true }
      - { id: d, text: "ให้ทีมพัฒนาทำงานแทนผู้ใช้แล้วบันทึกผล", feedback: "ทีมพัฒนารู้ระบบดีเกินไปจนไม่ใช่ตัวแทนผู้ใช้ใหม่" }
    hints:
      - "คำว่าคิดดังๆ หมายถึงให้ผู้ใช้เล่าความคิดของตนออกมาเป็นคำพูด"
      - "ผู้สังเกตเน้นจุดที่ผู้ใช้หยุดชะงักหรือทำผิด"
    solution: "การคิดดังๆ คือให้ผู้ใช้พูดความคิดระหว่างลงมือทำงาน ผู้สังเกตจึงเห็นทั้งการกระทำและเหตุผลที่อยู่เบื้องหลัง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.design.usability-evaluation.p005
    topics: [computer.design.usability-evaluation]
    difficulty: 2
    type: numeric
    stem: "ทีมทดสอบแอปสั่งอาหารกับผู้ใช้ 12 คน ผู้ใช้ 9 คนทำงานสำเร็จ อัตราสำเร็จของงานคิดเป็นกี่เปอร์เซ็นต์"
    answer: { value: 75, unit: เปอร์เซ็นต์ }
    hints:
      - "อัตราสำเร็จ = จำนวนที่สำเร็จ ÷ จำนวนผู้ทดสอบทั้งหมด"
      - "ผลลัพธ์คูณ 100 เพื่อเป็นเปอร์เซ็นต์"
    misconceptions:
      - { match: 25, feedback: "นั่นคืออัตราที่ล้มเหลว ไม่ใช่อัตราสำเร็จ" }
    solution: "อัตราสำเร็จ = 9 ÷ 12 × 100 = 75%"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.design.usability-evaluation.p006
    topics: [computer.design.usability-evaluation]
    difficulty: 2
    type: mcq
    stem: "ควรตัดสินใจเลือกเวอร์ชันจากผลการทดสอบ A/B อย่างไรจึงเชื่อถือได้"
    choices:
      - { id: b, text: "เลือกเวอร์ชันที่ทีมชอบมากกว่า", feedback: "ความชอบของทีมไม่ใช่ผลการทดสอบกับผู้ใช้" }
      - { id: c, text: "ดูจากตัวชี้วัดที่เพิ่งคิดขึ้นหลังเห็นผลแล้ว", feedback: "การเลือกตัวชี้วัดหลังเห็นผลทำให้ผลดูดีกว่าความจริงได้ง่าย" }
      - { id: d, text: "เลือกจากผลของผู้ใช้เพียงสามคนแรกที่ตอบ", feedback: "จำนวนผู้ใช้น้อยเกินไปทำให้ผลต่างอาจเป็นเพียงความบังเอิญ" }
      - { id: a, text: "ดูความแตกต่างของตัวชี้วัดที่กำหนดไว้ก่อนทดสอบ และมีจำนวนผู้ใช้มากพอให้ผลต่างนั้นน่าเชื่อถือ", correct: true }
    hints:
      - "ตัวชี้วัดต้องกำหนดไว้ก่อนเริ่มทดสอบเพื่อหลีกเลี่ยงการเลือกผลที่ชอบ"
      - "ผลต่างเล็กน้อยจากผู้ใช้จำนวนน้อยอาจเกิดจากความบังเอิญ"
    solution: "การตัดสินใจที่น่าเชื่อถือต้องใช้ตัวชี้วัดที่กำหนดไว้ก่อน และมีตัวอย่างพอให้ผลต่างนั้นไม่ใช่ความบังเอิญ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.design.usability-evaluation.p007
    topics: [computer.design.usability-evaluation]
    difficulty: 2
    type: text
    stem: "การประเมินที่ผู้เชี่ยวชาญตรวจหน้าจอเทียบกับหลักการใช้งานที่ดี เรียกเป็นภาษาไทยว่าอย่างไร (ตอบเป็นคำไทยหรืออังกฤษ)"
    accepted: ["การประเมินเชิงฮิวริสติก", "การประเมินแบบฮิวริสติก", "ฮิวริสติกอีวาลูเอชัน", "heuristic evaluation"]
    hints:
      - "คำนี้มาจากคำว่า heuristic ซึ่งหมายถึงหลักที่ใช้เป็นแนวทาง"
      - "ผู้ประเมินใช้หลักการที่ดีเป็นเกณฑ์ ไม่ได้ให้ผู้ใช้จริงทดสอบ"
    solution: "การประเมินเชิงฮิวริสติก (heuristic evaluation) คือการให้ผู้เชี่ยวชาญตรวจการออกแบบเทียบกับหลักการที่ยอมรับกันอย่างแพร่หลาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.design.usability-evaluation.p008
    topics: [computer.design.usability-evaluation]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนของรอบการปรับปรุงความใช้งานได้ จากขั้นแรกไปจนถึงขั้นสุดท้าย"
    items:
      - "วางแผนการทดสอบและเลือกงานตัวอย่างที่ผู้ใช้ต้องทำ"
      - "ให้ผู้ใช้จริงทำงานและบันทึกผลกับจุดที่ติดขัด"
      - "วิเคราะห์และจัดลำดับปัญหาตามความรุนแรงและความถี่"
      - "แก้ไขปัญหาที่สำคัญที่สุดก่อน"
      - "ทดสอบซ้ำเพื่อตรวจว่าปัญหาลดลงจริง"
    hints:
      - "ก่อนทดสอบต้องรู้ก่อนว่าจะทดสอบอะไร"
      - "การทดสอบซ้ำเป็นขั้นสุดท้ายของรอบ และนำไปสู่รอบถัดไป"
    solution: "รอบการปรับปรุงเริ่มจากการวางแผน ทดสอบกับผู้ใช้ วิเคราะห์และจัดลำดับ แก้ปัญหาสำคัญก่อน และทดสอบซ้ำเพื่อยืนยันผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.design.usability-evaluation.p009
    topics: [computer.design.usability-evaluation]
    difficulty: 3
    type: numeric
    stem: "ปุ่มกดในแอปหนึ่งกว้าง W = 40 พิกเซล และอยู่ห่างจากจุดเริ่มต้นของนิ้ว D = 160 พิกเซล ดัชนีความยากของกฎของฟิตส์ log₂(D/W + 1) มีค่าเท่าใด (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 2.32, tolerance: 0.01 }
    hints:
      - "หาอัตราส่วน D หารด้วย W ก่อน"
      - "บวก 1 แล้วหาลอการิทึมฐาน 2 ของผลลัพธ์"
    misconceptions:
      - { match: 4, feedback: "หยุดที่ D ÷ W ไม่ได้บวก 1 และไม่ได้หาลอการิทึมฐาน 2" }
      - { match: 5, feedback: "บวก 1 แล้วแต่ยังไม่ได้หาลอการิทึมฐาน 2" }
    solution: "D ÷ W + 1 = 160 ÷ 40 + 1 = 5 และ log₂(5) ≈ 2.32"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.design.usability-evaluation.p010
    topics: [computer.design.usability-evaluation]
    difficulty: 3
    type: mcq
    stem: "เหตุใดการทดสอบกับผู้ใช้จริงจึงสำคัญกว่าการให้ทีมประเมินเองอย่างเดียว"
    choices:
      - { id: a, text: "ทีมมักรู้ระบบดีเกินไปจนมองไม่เห็นจุดที่ผู้ใช้ใหม่จะสับสน", correct: true }
      - { id: b, text: "ผู้ใช้จริงจะให้คะแนนดีเสมอ จึงทำให้ระบบดูดีขึ้น", feedback: "เป้าหมายของการทดสอบคือการพบปัญหาจริง ไม่ใช่การให้คะแนนสูง" }
      - { id: c, text: "การทดสอบกับผู้ใช้จริงไม่ต้องใช้เวลาหรือทรัพยากรเลย", feedback: "การทดสอบกับผู้ใช้ใช้เวลาและทรัพยากร แต่ให้ข้อมูลที่ผู้เชี่ยวชาญให้ไม่ได้" }
      - { id: d, text: "ทีมไม่สามารถอ่านรายงานการประเมินได้", feedback: "ทีมอ่านรายงานได้ ปัญหาคือทีมมักมองไม่เห็นจุดสับสนของตนเอง" }
    hints:
      - "คิดว่าคนที่สร้างระบบมีความรู้เกี่ยวกับระบบมากกว่าผู้ใช้ใหม่เพียงใด"
      - "ผู้ใช้ใหม่ไม่มีความรู้เดิมเหมือนทีมพัฒนา"
    solution: "ความรู้ที่ทีมสะสมไว้ทำให้มองข้ามจุดที่ผู้ใช้ใหม่จะติด การทดสอบกับผู้ใช้จริงจึงเผยปัญหาที่ทีมมองไม่เห็นเอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.design.usability-evaluation.p011
    topics: [computer.design.usability-evaluation]
    difficulty: 3
    type: mcq
    stem: "ข้อใดเป็นตัวอย่างการนำความรู้เรื่องปัจจัยมนุษย์ไปใช้ได้จริง"
    choices:
      - { id: b, text: "ใส่ข้อมูลทุกอย่างลงในหน้าเดียวเพื่อให้ผู้ใช้เห็นครบ", feedback: "การแสดงข้อมูลทั้งหมดในหน้าเดียวทำให้ภาระทางความคิดสูงและหาสิ่งที่ต้องการยาก" }
      - { id: a, text: "ผู้ใช้จำข้อมูลได้จำกัดในเวลาสั้น จึงแสดงข้อมูลทีละส่วนที่จำเป็นต่อการตัดสินใจ", correct: true }
      - { id: c, text: "ให้ผู้ใช้จำรหัสคำสั่งยาวจากคู่มือทุกครั้ง", feedback: "การบังคับให้จำคำสั่งเพิ่มภาระและขัดกับหลักการให้ผู้ใช้จำน้อยลง" }
      - { id: d, text: "ทำปุ่มสำคัญให้เล็กที่สุดเพื่อให้หน้าดูสะอาด", feedback: "ปุ่มเล็กทำให้ใช้เวลาเลื่อนไปชี้นานขึ้น ตามกฎของฟิตส์" }
    hints:
      - "ลองคิดถึงความจำระยะสั้นและภาระทางความคิด"
      - "ตัวเลือกที่ทำให้ผู้ใช้ต้องจำหรือต้องอ่านมากเกินไปมักไม่เหมาะ"
    solution: "ความจำระยะสั้นมีขีดจำกัด การแสดงข้อมูลทีละส่วนที่จำเป็นช่วยลดภาระทางความคิดและทำให้ผู้ใช้ตัดสินใจได้เร็วขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.design.usability-evaluation.p012
    topics: [computer.design.usability-evaluation]
    difficulty: 4
    type: numeric
    stem: "ผู้ตอบ SUS อีกคนหนึ่งให้คำตอบข้อ 1 ถึง 10 ตามลำดับดังนี้ 3, 2, 4, 2, 5, 1, 4, 3, 4, 2 (แต่ละข้อตอบในระดับ 1 ถึง 5) คะแนน SUS ของผู้ตอบคนนี้เท่ากับเท่าใด (คะแนนเต็ม 100)"
    answer: { value: 75 }
    hints:
      - "คิดคะแนนของแต่ละข้อก่อน ข้อคี่ใช้ค่าที่ตอบลบหนึ่ง ข้อคู่ใช้ห้าลบค่าที่ตอบ"
      - "หาผลรวมของสิบข้อ แล้วคูณ 2.5"
    misconceptions:
      - { match: 30, feedback: "ลืมคูณด้วย 2.5 ทำให้ได้ผลรวมดิบ" }
    solution: "ข้อคี่ (3−1)+(4−1)+(5−1)+(4−1)+(4−1) = 15 ข้อคู่ (5−2)+(5−2)+(5−1)+(5−3)+(5−2) = 15 รวม 30 คูณ 2.5 ได้ 75"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.design.usability-evaluation.p013
    topics: [computer.design.usability-evaluation]
    difficulty: 4
    type: mcq
    stem: "ข้อใดเป็นตัวอย่างของรูปแบบหลอกล่อ (dark pattern)"
    choices:
      - { id: b, text: "แสดงข้อความยืนยันว่าบันทึกข้อมูลสำเร็จแล้ว", feedback: "การแจ้งผลการทำงานเป็นแนวทางที่ดี ช่วยให้ผู้ใช้รู้สถานะของระบบ" }
      - { id: c, text: "มีปุ่มยกเลิกที่มองเห็นได้ชัดเจน", feedback: "ปุ่มที่เห็นชัดช่วยให้ผู้ใช้ควบคุมได้ จึงไม่ใช่รูปแบบหลอกล่อ" }
      - { id: a, text: "ทำให้การยกเลิกสมาชิกซับซ้อนกว่าการสมัคร เช่น ต้องผ่านหลายหน้าจอจึงจะยกเลิกได้", correct: true }
      - { id: d, text: "ใช้สีต่างกันเพื่อแยกหัวข้อของเมนู", feedback: "การใช้สีแยกหัวข้อเป็นการออกแบบทั่วไป ไม่ได้มุ่งทำให้ผู้ใช้เข้าใจผิด" }
    hints:
      - "รูปแบบหลอกล่อมักทำให้ผู้ใช้ทำสิ่งที่ไม่ได้ตั้งใจหรือทำได้ยากขึ้นโดยเจตนา"
      - "ตัวเลือกที่ช่วยให้ผู้ใช้ควบคุมได้ไม่ใช่รูปแบบหลอกล่อ"
    solution: "การทำให้การยกเลิกยากกว่าการสมัครเป็นรูปแบบหลอกล่อที่ทำให้ผู้ใช้ติดอยู่ ขัดกับหลักการให้ผู้ใช้ควบคุมและยกเลิกได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.design.usability-evaluation.p014
    topics: [computer.design.usability-evaluation]
    difficulty: 4
    type: numeric
    stem: "ปุ่มเวอร์ชัน A มีผู้ใช้กด 40 คนจาก 500 คน และเวอร์ชัน B มีผู้ใช้กด 60 คนจาก 500 คน อัตราการกดของ B สูงกว่า A กี่เปอร์เซ็นต์จุด (ตอบเป็นเปอร์เซ็นต์จุด)"
    answer: { value: 4, unit: เปอร์เซ็นต์จุด }
    hints:
      - "หาอัตราการกดของแต่ละเวอร์ชันเป็นเปอร์เซ็นต์ก่อน"
      - "ผลต่างของสองเปอร์เซ็นต์เรียกว่าเปอร์เซ็นต์จุด ไม่ใช่เปอร์เซ็นต์ของค่าเดิม"
    misconceptions:
      - { match: 50, feedback: "นั่นคือการเพิ่มขึ้นแบบสัมพัทธ์ (จาก 8% เป็น 12%) ไม่ใช่ผลต่างเป็นเปอร์เซ็นต์จุด" }
    solution: "อัตราของ A = 40 ÷ 500 = 8% อัตราของ B = 60 ÷ 500 = 12% ผลต่าง = 12 − 8 = 4 เปอร์เซ็นต์จุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.design.usability-evaluation.p015
    topics: [computer.design.usability-evaluation]
    difficulty: 4
    type: mcq
    stem: "ทีมมีปัญหาที่พบจากการทดสอบหลายข้อ ควรเลือกแก้ปัญหาใดก่อน"
    choices:
      - { id: b, text: "ปัญหาที่แก้ได้ง่ายที่สุดแม้จะกระทบผู้ใช้น้อย", feedback: "การเลือกแก้เฉพาะที่ง่ายอาจทำให้ปัญหาร้ายแรงค้างอยู่" }
      - { id: c, text: "ปัญหาที่ผู้บริหารคนหนึ่งเห็นว่าสวยงามกว่า", feedback: "ความสวยงามตามความเห็นส่วนตัวไม่ใช่เกณฑ์จัดลำดับความสำคัญ" }
      - { id: d, text: "ทุกปัญหาพร้อมกันโดยไม่ต้องเรียงลำดับ", feedback: "การแก้ทุกอย่างพร้อมกันทำให้ไม่รู้ว่าการเปลี่ยนแปลงใดช่วยจริง" }
      - { id: a, text: "ปัญหาที่มีความรุนแรงสูงและพบบ่อยในผู้ใช้จำนวนมาก", correct: true }
    hints:
      - "ลองนึกถึงทั้งความรุนแรงของปัญหาและจำนวนผู้ใช้ที่ได้รับผลกระทบ"
      - "ปัญหาที่ทำให้ผู้ใช้ทำงานไม่สำเร็จควรมาก่อนปัญหาเล็กน้อย"
    solution: "จัดลำดับตามความรุนแรงและความถี่ แก้ปัญหาที่กระทบผู้ใช้จำนวนมากและทำให้ทำงานไม่สำเร็จก่อน ช่วยให้ใช้ทรัพยากรได้คุ้มค่าที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.design.usability-evaluation.p016
    topics: [computer.design.usability-evaluation]
    difficulty: 5
    type: numeric
    stem: "ค่าเฉลี่ยคะแนน SUS ของแอปหนึ่งก่อนปรับปรุงคือ 58 คะแนน หลังปรับปรุงเพิ่มเป็น 74 คะแนน ค่าเฉลี่ยเพิ่มขึ้นกี่เปอร์เซ็นต์เมื่อเทียบกับค่าก่อนปรับปรุง (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 27.6, tolerance: 0.1, unit: เปอร์เซ็นต์ }
    hints:
      - "หาผลต่างของคะแนนก่อน คือ 74 − 58"
      - "หารด้วยค่าก่อนปรับปรุง แล้วคูณ 100"
    misconceptions:
      - { match: 16, feedback: "นั่นคือผลต่างของคะแนน ไม่ใช่เปอร์เซ็นต์ที่เพิ่มเมื่อเทียบกับค่าเดิม" }
      - { match: 21.6, feedback: "หารด้วยค่าหลังปรับปรุงแทนค่าก่อนปรับปรุง โจทย์ต้องเทียบกับค่าเดิม" }
    solution: "ผลต่าง = 74 − 58 = 16 คะแนน เพิ่มขึ้น 16 ÷ 58 × 100 ≈ 27.6%"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.design.usability-evaluation.p017
    topics: [computer.design.usability-evaluation]
    difficulty: 5
    type: mcq
    stem: "ข้อใดเป็นการประเมินการออกแบบอย่างรับผิดชอบที่ครอบคลุมที่สุด"
    choices:
      - { id: a, text: "ตรวจทั้งความถูกต้อง ประสิทธิผล และประสบการณ์ผู้ใช้ รวมถึงผลต่อกลุ่มที่อาจถูกกีดกันจากการใช้งาน", correct: true }
      - { id: b, text: "ดูเฉพาะว่าหน้าจอสวยตามแนวโน้มล่าสุดหรือไม่", feedback: "ความสวยงามเพียงอย่างเดียวไม่ครอบคลุมความถูกต้อง ความสามารถในการใช้งาน หรือผลต่อผู้ใช้" }
      - { id: c, text: "ตรวจเฉพาะจำนวนคลิกที่ผู้ใช้ต้องทำ", feedback: "จำนวนคลิกเป็นตัวชี้วัดเพียงด้านเดียว ไม่บอกว่าผู้ใช้ได้รับผลดีหรือถูกเอาเปรียบหรือไม่" }
      - { id: d, text: "ทดสอบเฉพาะกับทีมพัฒนาที่รู้ระบบดีที่สุด", feedback: "ทีมพัฒนาไม่ใช่ตัวแทนของผู้ใช้ที่หลากหลาย" }
    hints:
      - "การประเมินที่รับผิดชอบต้องครอบคลุมทั้งคนที่ใช้ได้ดีและคนที่อาจถูกกีดกัน"
      - "ตัวเลือกที่ดูเพียงมิติเดียวมักไม่ครอบคลุม"
    solution: "การประเมินที่รอบด้านตรวจความถูกต้อง ประสิทธิผล และประสบการณ์ รวมถึงการกีดกันผู้ใช้บางกลุ่ม ซึ่งสอดคล้องกับค่านิยมการออกแบบอย่างรับผิดชอบ"
    license: CC-BY-SA-4.0
    ai_assisted: true
