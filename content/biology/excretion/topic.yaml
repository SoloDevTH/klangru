id: biology.animals.excretion
subject: biology
title: { th: การขับถ่าย, en: "Excretion" }
summary: ของเสียไนโตรเจน 3 แบบ โครงสร้างกำจัดของเสียของฟองน้ำ ไฮดรา พลานาเรีย ไส้เดือนดิน แมลง และสัตว์มีกระดูกสันหลัง โครงสร้างของไตและหน่วยไต การกรอง การดูดกลับ การหลั่ง และโรคไต
difficulty: 5.5
minutes: 50
prerequisites: [biology.animals.circulation, biology.cells.membrane-transport, biology.humans.respiration-excretion]
encompasses:
  - { id: biology.cells.membrane-transport, weight: 0.3 }
  - { id: biology.animals.circulation, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: โครงสร้างกำจัดของเสียในสัตว์ไม่มีกระดูกสันหลัง
    src: invertebrate-excretion.svg
    alt: "แผนภาพอย่างง่าย 3 แผง แผงแรกพลานาเรีย มีท่อขับถ่ายสองข้างลำตัว แตกแขนง ปลายแขนงเป็นเฟลมเซลล์รูปวงกลม ซิเลียโบกพัดดันของเสียออกทางรูขับถ่าย แผงที่สองไส้เดือนดิน ลำตัวเป็นปล้อง มีเนฟริเดียมที่ปากกรวยอยู่ในปล้องหนึ่ง ท่อขดผ่านไปยังปล้องถัดไปแล้วเปิดออกทางรูขับถ่ายที่ผนังลำตัว แผงที่สามแมลง มีท่อมัลพิเกียนปลายตันหลายท่อแยกออกจากทางเดินอาหาร ลอยอยู่ในเลือดของช่องตัว และเทของเสียลงทางเดินอาหารไปออกทางทวารหนัก"
    caption: "แผนภาพอย่างง่าย ไม่ได้วาดตามสัดส่วนจริง (วาดโดยทีมคลังรู้)"
  - type: figure
    title: หน่วยไต
    src: nephron.svg
    alt: "หน่วยไตบนพื้นหลังสองชั้น ชั้นบนคอร์เทกซ์ ชั้นล่างเมดัลลา หลอดเลือดเข้านำเลือดสู่โกลเมอรูลัสซึ่งเป็นกลุ่มหลอดเลือดฝอยในโบว์แมนส์แคปซูล หลอดเลือดออกนำเลือดออก จากแคปซูลต่อด้วยท่อหน่วยไตส่วนต้นที่ขดอยู่ในคอร์เทกซ์ ลงเป็นห่วงเฮนเลรูปตัวยูในเมดัลลา ขึ้นมาเป็นท่อหน่วยไตส่วนท้ายที่ขดในคอร์เทกซ์ แล้วเข้าท่อรวมซึ่งลงไปทางเมดัลลาสู่กรวยไต ลูกศรสีน้ำเงินแสดงการดูดกลับจากท่อส่วนต้น ห่วงเฮนเล และท่อรวม ลูกศรสีเขียวแสดงการหลั่งเข้าสู่ท่อส่วนท้าย กล่องสรุป 1 การกรอง ที่โกลเมอรูลัส น้ำและสารโมเลกุลเล็กเข้าแคปซูล 2 การดูดกลับ กลูโคส กรดอะมิโน Na⁺ น้ำ จากท่อกลับสู่เลือด 3 การหลั่ง H⁺ K⁺ ยาบางชนิด จากเลือดเข้าสู่ท่อ"
    caption: "แผนภาพอย่างง่ายของหน่วยไตหนึ่งหน่วย (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: เทียบสารในพลาสมา ของเหลวที่กรองได้ และปัสสาวะ
    problem: "พลาสมามีกลูโคส 0.1 g ต่อ 100 mL ของเหลวในโบว์แมนส์แคปซูลมีกลูโคส 0.1 g ต่อ 100 mL แต่ปัสสาวะไม่มีกลูโคส อธิบายข้อมูลนี้"
    steps:
      - text: "ความเข้มข้นในแคปซูลเท่ากับในพลาสมา แสดงว่ากลูโคสผ่านการกรองได้อย่างอิสระ"
        why: "การกรองแยกตามขนาด กลูโคสโมเลกุลเล็กจึงผ่านได้ทั้งหมด"
      - text: "ปัสสาวะไม่มีกลูโคส แสดงว่ากลูโคสถูกดูดกลับทั้งหมดระหว่างทาง"
      - text: "การดูดกลับเกิดที่ท่อหน่วยไตส่วนต้นแบบใช้พลังงาน เพราะต้องดึงกลูโคสกลับแม้ความเข้มข้นในท่อจะต่ำกว่าในเลือด"
    answer: "กลูโคสถูกกรองแล้วดูดกลับหมดที่ท่อหน่วยไตส่วนต้น"
  - { type: check, problem: biology.animals.excretion.p005, prompt: "การกรองแยกตามขนาดของสาร" }
  - type: worked-example
    title: คำนวณปริมาณที่ถูกดูดกลับ
    problem: "ไตกรองโซเดียมไอออนวันละ 180 L × 3.3 g/L และขับออกในปัสสาวะวันละ 4.5 g โซเดียมไอออนถูกดูดกลับร้อยละเท่าใด"
    steps:
      - text: "กรองได้ $180 \\times 3.3 = 594$ g ต่อวัน"
      - text: "ดูดกลับ $594 - 4.5 = 589.5$ g"
      - text: "ร้อยละ $\\frac{589.5}{594} \\times 100 \\approx 99.2\\%$"
        why: "เทียบกับปริมาณที่กรองได้เสมอ ไม่ใช่ปริมาณในปัสสาวะ"
    answer: "ประมาณร้อยละ 99.2"
  - { type: check, problem: biology.animals.excretion.p010, prompt: "การดูดกลับกลูโคสมีขีดจำกัดหรือไม่" }
glossary:
  - { term: แอมโมเนีย, definition: "ของเสียไนโตรเจนที่เป็นพิษมาก ละลายน้ำดี ต้องใช้น้ำมากในการขับออก" }
  - { term: ยูเรีย, definition: "ของเสียไนโตรเจนที่ตับสร้างจากแอมโมเนีย พิษน้อยกว่า ขับออกทางปัสสาวะ" }
  - { term: กรดยูริก, definition: "ของเสียไนโตรเจนที่ละลายน้ำน้อย ใช้น้ำน้อยมากในการขับออก พบในนก สัตว์เลื้อยคลาน แมลง" }
  - { term: เฟลมเซลล์, definition: "เซลล์ที่ปลายท่อขับถ่ายของพลานาเรีย มีซิเลียโบกพัดดันของเหลวไปตามท่อ" }
  - { term: เนฟริเดียม, definition: "อวัยวะขับถ่ายของไส้เดือนดิน มีปล้องละ 1 คู่" }
  - { term: ท่อมัลพิเกียน, definition: "ท่อขับถ่ายของแมลง ปลายตันลอยในช่องตัว เทของเสียลงทางเดินอาหาร" }
  - { term: หน่วยไต, definition: "หน่วยทำงานของไต ประกอบด้วยโกลเมอรูลัส โบว์แมนส์แคปซูล ท่อหน่วยไต และต่อกับท่อรวม" }
  - { term: การหลั่ง, definition: "การลำเลียงสารจากเลือดเข้าสู่ท่อหน่วยไต เช่น H⁺ K⁺ และยาบางชนิด" }
flashcards:
  - { front: "ของเสียไนโตรเจน 3 แบบ เรียงจากใช้น้ำมากไปน้อย", back: "แอมโมเนีย ยูเรีย กรดยูริก" }
  - { front: "หน่วยไตทำงาน 3 ขั้น", back: "การกรองที่โกลเมอรูลัส การดูดกลับ และการหลั่ง" }
  - { front: "กลูโคสและกรดอะมิโนถูกดูดกลับที่ใด", back: "ท่อหน่วยไตส่วนต้น เกือบทั้งหมด แบบใช้พลังงาน" }
  - { front: "พบโปรตีนในปัสสาวะบ่งบอกอะไร", back: "โกลเมอรูลัสอาจเสียหาย เพราะปกติโปรตีนไม่ผ่านการกรอง" }
  - { front: "สาเหตุสำคัญของไตเรื้อรัง", back: "เบาหวาน ความดันเลือดสูง และการใช้ยาบางชนิดนานโดยไม่มีคำแนะนำ" }
