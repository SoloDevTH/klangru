    ai_assisted: true

  - id: phy.work.p018
    topics: [physics.energy.work]
    difficulty: 4
    type: numeric
    stem: "รถยนต์มวล $1{,}000\\ \\mathrm{kg}$ เร่งจาก $10\\ \\mathrm{m/s}$ เป็น $20\\ \\mathrm{m/s}$ บนถนนราบ งานรวมที่ทำต่อรถเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย kJ)"
    answer: { value: 150, tolerance: 0.5, unit: kJ }
    hints:
      - "งานรวมเท่ากับพลังงานจลน์ที่เปลี่ยนไป"
      - "$W = \\tfrac{1}{2}mv^2 - \\tfrac{1}{2}mu^2$"
    misconceptions:
      - { match: 50, feedback: "ดูเหมือนใช้ $\\tfrac{1}{2}m(v - u)^2$ ต้องหาพลังงานจลน์ของแต่ละความเร็วแล้วลบกัน $\\tfrac{1}{2}m(v^2 - u^2)$" }
      - { match: 200, feedback: "นี่คือพลังงานจลน์ที่ $20\\ \\mathrm{m/s}$ ทั้งหมด แต่รถมีพลังงานจลน์อยู่แล้ว $50\\ \\mathrm{kJ}$ ตอนเริ่ม" }
    solution: "$W = \\tfrac{1}{2}(1{,}000)(20^2 - 10^2) = 500 \\times 300 = 150{,}000\\ \\mathrm{J} = 150\\ \\mathrm{kJ}$ ความเร็วเพิ่มเป็นสองเท่า แต่พลังงานจลน์เพิ่มเป็นสี่เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.work.p019
    topics: [physics.energy.work]
    difficulty: 5
    type: numeric
    stem: "รถกระบะมวล $1{,}200\\ \\mathrm{kg}$ วิ่งด้วยความเร็ว $20\\ \\mathrm{m/s}$ บนถนนราบ คนขับเหยียบเบรกจนรถหยุด แรงเบรกคงตัว $6{,}000\\ \\mathrm{N}$ รถไถลไปได้ระยะเท่าใดจึงหยุด (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 40, tolerance: 0.2, unit: m }
    hints:
      - "แรงเบรกทำงานเป็นลบ ดึงพลังงานจลน์ของรถออกจนหมด"
      - "$F s = \\tfrac{1}{2}mv^2$ แล้วแก้หา $s$"
    misconceptions:
      - { match: 4, feedback: "ดูเหมือนใช้ $mv$ (โมเมนตัม) แทนพลังงานจลน์ งานของแรงเบรกต้องเท่ากับ $\\tfrac{1}{2}mv^2$" }
      - { match: 2, feedback: "ดูเหมือนใช้ $\\tfrac{1}{2}mv$ ลืมยกกำลังสองของความเร็ว" }
    solution: "พลังงานจลน์ $= \\tfrac{1}{2}(1{,}200)(20)^2 = 240{,}000\\ \\mathrm{J}$ แรงเบรกทำงาน $-Fs$ เท่ากับพลังงานที่หายไป: $6{,}000 s = 240{,}000$ ได้ $s = 40\\ \\mathrm{m}$ ถ้าวิ่งเร็วเป็นสองเท่า ระยะเบรกจะยาวเป็นสี่เท่า"
