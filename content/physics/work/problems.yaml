problems:
  - id: phy.work.p001
    topics: [physics.energy.work]
    difficulty: 1
    type: numeric
    stem: 'แม่เข็นรถเข็นในซูเปอร์มาร์เก็ตด้วยแรง $30\ \mathrm{N}$ ในแนวระดับ รถเข็นเคลื่อนที่ไปตามทิศของแรงได้ $12\ \mathrm{m}$ แรงของแม่ทำงานเท่าใด (ตอบเป็นตัวเลขในหน่วย J)'
    answer: { value: 360, unit: J }
    hints:
      - 'แรงขนานกับการเคลื่อนที่ จึงใช้สูตร $W = Fs$ ได้เลย'
      - 'นำแรง (นิวตัน) คูณกับการกระจัด (เมตร) ได้งานในหน่วยจูล'
    misconceptions:
      - { match: 2.5, feedback: 'ดูเหมือนนำแรงหารด้วยระยะทาง งานคือแรง **คูณ** การกระจัด $W = Fs$' }
      - { match: 42, feedback: 'ดูเหมือนนำแรงบวกกับระยะทาง ปริมาณที่มีหน่วยต่างกันบวกกันไม่ได้ งานคือ $W = Fs$' }
    solution: '$W = Fs = (30\ \mathrm{N})(12\ \mathrm{m}) = 360\ \mathrm{N \cdot m} = 360\ \mathrm{J}$'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.work.p002
    topics: [physics.energy.work]
    difficulty: 1
    type: mcq
    stem: 'หน่วยจูล ($\mathrm{J}$) ซึ่งเป็นหน่วยของงาน เท่ากับหน่วยใด'
    choices:
      - { id: a, text: '$\mathrm{N \cdot m}$ (นิวตันคูณเมตร)', correct: true }
      - { id: b, text: '$\mathrm{N/m}$ (นิวตันต่อเมตร)', feedback: 'งานได้จากการ **คูณ** แรงกับการกระจัด ไม่ใช่การหาร หน่วยจึงเป็น $\mathrm{N \cdot m}$' }
      - { id: c, text: '$\mathrm{W}$ (วัตต์)', feedback: 'วัตต์เป็นหน่วยของกำลัง คืองานต่อเวลา ($1\ \mathrm{W} = 1\ \mathrm{J/s}$) ไม่ใช่หน่วยของงาน' }
      - { id: d, text: '$\mathrm{kg \cdot m/s}$', feedback: 'นี่คือหน่วยของโมเมนตัม ($p = mv$) งานคือแรงคูณระยะ ได้ $\mathrm{N \cdot m} = \mathrm{kg \cdot m^2/s^2}$' }
    hints:
      - 'เขียนสูตรของงานเมื่อแรงขนานกับการเคลื่อนที่'
      - 'นำหน่วยของแต่ละปริมาณในสูตรมาดำเนินการแบบเดียวกับตัวเลข'
    solution: 'จาก $W = Fs$ หน่วยของงานคือหน่วยของแรงคูณหน่วยของระยะ $1\ \mathrm{J} = 1\ \mathrm{N} \times 1\ \mathrm{m} = 1\ \mathrm{N \cdot m}$'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.work.p003
    topics: [physics.energy.work]
    difficulty: 2
    type: mcq
    multiple: true
    stem: 'สถานการณ์ใดที่แรงที่กล่าวถึง **ทำงานเป็นศูนย์** (เลือกได้หลายข้อ)'
    choices:
      - { id: a, text: 'แรงของแขนที่ยกถุงข้าวไว้นิ่ง ๆ นาน 10 นาที', correct: true, feedback: 'ถูก ถุงข้าวไม่เคลื่อนที่ $s = 0$ จึงไม่มีงาน แม้จะเหนื่อย' }
      - { id: b, text: 'แรงแบกกระเป๋าขึ้นของนักเรียนที่เดินบนพื้นราบด้วยความเร็วคงตัว', correct: true, feedback: 'ถูก แรงแบกชี้ขึ้น แต่การเคลื่อนที่อยู่ในแนวราบ ตั้งฉากกัน $\cos 90^\circ = 0$' }
      - { id: c, text: 'แรงปฏิกิริยาตั้งฉากจากพื้นที่กระทำต่อกล่องซึ่งไถลไปตามพื้นราบ', correct: true, feedback: 'ถูก แรงตั้งฉากกับพื้นจึงตั้งฉากกับการเคลื่อนที่' }
      - { id: d, text: 'แรงที่ยกถุงข้าวจากพื้นขึ้นวางบนโต๊ะ', feedback: 'แรงยกชี้ขึ้นและถุงข้าวเคลื่อนที่ขึ้นตามแนวแรง งานจึงเป็นบวก ไม่ใช่ศูนย์' }
      - { id: e, text: 'แรงเสียดทานที่กระทำต่อกล่องซึ่งกำลังไถลไปตามพื้น', feedback: 'แรงเสียดทานสวนทางการเคลื่อนที่ งานจึงเป็น **ลบ** ไม่ใช่ศูนย์' }
    hints:
      - 'งานเป็นศูนย์เมื่อวัตถุไม่เคลื่อนที่ หรือเมื่อแรงตั้งฉากกับการเคลื่อนที่'
      - 'ตรวจทีละข้อว่าวัตถุเคลื่อนที่หรือไม่ และมุมระหว่างแรงกับการเคลื่อนที่เป็นเท่าใด'
    solution: 'งานเป็นศูนย์ในข้อ ก (ไม่มีการกระจัด) ข และ ค (แรงตั้งฉากกับการเคลื่อนที่ $\cos 90^\circ = 0$) ส่วนข้อ ง งานเป็นบวก และข้อ จ งานเป็นลบ'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.work.p004
    topics: [physics.energy.work]
    difficulty: 2
    type: numeric
    stem: 'ยกถุงข้าวสารมวล $5\ \mathrm{kg}$ ขึ้นตรง ๆ ด้วยความเร็วคงตัวจากพื้นไปวางบนชั้นสูง $1.2\ \mathrm{m}$ แรงยกทำงานเท่าใด ใช้ $g = 9.8\ \mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย J)'
    answer: { value: 58.8, tolerance: 0.3, unit: J }
    hints:
      - 'ยกด้วยความเร็วคงตัว แรงยกจึงเท่ากับน้ำหนักของถุงข้าว'
      - 'หาน้ำหนักจาก $mg$ ก่อน ได้แรงในหน่วยนิวตัน'
      - 'แรงยกมีทิศเดียวกับการเคลื่อนที่ ใช้ $W = Fs$ โดย $F = mg$'
    misconceptions:
      - { match: 6, feedback: 'ดูเหมือนใช้มวล ($\mathrm{kg}$) แทนแรง ต้องคูณด้วย $g$ ก่อนจึงได้แรงยกในหน่วยนิวตัน' }
      - { match: 60, feedback: 'ดูเหมือนใช้ $g = 10\ \mathrm{m/s^2}$ วิธีคิดถูกแล้ว แต่ข้อนี้กำหนด $g = 9.8\ \mathrm{m/s^2}$' }
    solution: 'แรงยก $F = mg = (5\ \mathrm{kg})(9.8\ \mathrm{m/s^2}) = 49\ \mathrm{N}$ งาน $W = Fs = (49\ \mathrm{N})(1.2\ \mathrm{m}) = 58.8\ \mathrm{J}$'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.work.p005
    topics: [physics.energy.work]
    difficulty: 3
    type: numeric
    stem: 'ผู้โดยสารที่สนามบินลากกระเป๋าเดินทางโดยดึงหูจับด้วยแรง $50\ \mathrm{N}$ ทำมุม $60^\circ$ กับพื้น กระเป๋าเคลื่อนที่ไปตามพื้นราบ $20\ \mathrm{m}$ แรงดึงทำงานเท่าใด (ตอบเป็นตัวเลขในหน่วย J)'
    answer: { value: 500, unit: J }
    hints:
      - 'แรงไม่ขนานกับการเคลื่อนที่ ต้องใช้ $W = Fs\cos\theta$'
      - 'มุม $\theta$ คือมุมระหว่างแรงกับทิศการเคลื่อนที่ (แนวพื้น) และ $\cos 60^\circ = 0.5$'
    misconceptions:
      - { match: 1000, feedback: 'ดูเหมือนลืม $\cos\theta$ มีเพียงองค์ประกอบของแรงตามแนวพื้น ($F\cos\theta$) เท่านั้นที่ทำงาน' }
      - { match: 866.03, feedback: 'ดูเหมือนใช้ $\sin 60^\circ$ แทน $\cos 60^\circ$ องค์ประกอบที่ขนานกับการเคลื่อนที่คือ $F\cos\theta$ เมื่อ $\theta$ วัดจากแนวการเคลื่อนที่' }
    solution: '$W = Fs\cos\theta = (50\ \mathrm{N})(20\ \mathrm{m})\cos 60^\circ = (50)(20)(0.5)\ \mathrm{J} = 500\ \mathrm{J}$'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.work.p006
    topics: [physics.energy.work]
    difficulty: 3
    type: numeric
    stem: 'กล่องไถลไปตามพื้นได้ $4\ \mathrm{m}$ โดยมีแรงเสียดทาน $15\ \mathrm{N}$ ต้านการเคลื่อนที่ตลอดทาง แรงเสียดทานทำงานเท่าใด (ตอบเป็นตัวเลขในหน่วย J พร้อมเครื่องหมาย)'
    answer: { value: -60, unit: J }
    hints:
      - 'แรงเสียดทานมีทิศสวนทางกับการเคลื่อนที่ มุม $\theta$ เป็นเท่าใด'
      - 'ใช้ $W = Fs\cos\theta$ กับ $\theta = 180^\circ$ และระวังเครื่องหมาย'
    misconceptions:
      - { match: 60, feedback: 'ขนาดถูกแล้ว แต่ลืมเครื่องหมาย แรงเสียดทานสวนทางการเคลื่อนที่ $\cos 180^\circ = -1$ งานจึงเป็นลบ' }
    solution: '$W = Fs\cos 180^\circ = (15\ \mathrm{N})(4\ \mathrm{m})(-1) = -60\ \mathrm{J}$ เครื่องหมายลบบอกว่าแรงเสียดทานดึงพลังงานออกจากกล่อง'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.work.p007
    topics: [physics.energy.work]
    difficulty: 3
    type: expression
    stem: 'ออกแรงคงตัว $F$ ดันกล่องไปตามพื้นราบในทิศเดียวกับแรงได้การกระจัด $s$ โดยมีแรงเสียดทานขนาด $f$ ต้านการเคลื่อนที่ จงเขียนนิพจน์ของ **งานรวม** $W$ ที่ทำต่อกล่อง'
    prefix: 'W ='
    answer: { latex: '(F-f)s', variables: [F, f, s] }
    misconceptions:
      - { match: '(F+f)s', feedback: 'งานของแรงเสียดทานเป็นลบ ($-fs$) เพราะสวนทางการเคลื่อนที่ จึงต้องลบออก ไม่ใช่บวกเข้า' }
      - { match: 'Fs', feedback: 'นี่คืองานของแรงดันอย่างเดียว งานรวมต้องรวมงานของแรงเสียดทาน ($-fs$) ด้วย' }
    hints:
      - 'หางานของแต่ละแรงแยกกันก่อน แล้วค่อยนำมารวมกัน'
      - 'แรงดันทำงานเป็นบวก ส่วนแรงเสียดทานสวนทางการเคลื่อนที่จึงทำงานเป็นลบ'
      - 'งานรวม = งานของแรงดัน + งานของแรงเสียดทาน (คิดเครื่องหมายด้วย)'
    solution: 'งานของแรงดัน $= Fs$ งานของแรงเสียดทาน $= fs\cos 180^\circ = -fs$ งานรวม $= Fs - fs = (F - f)s$ ซึ่งเท่ากับงานของแรงลัพธ์ $(F - f)$ นั่นเอง (หน่วยจูล)'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.work.p008
    topics: [physics.energy.work]
    difficulty: 4
    type: numeric
    stem: 'รถจักรยานยนต์น้ำมันหมด วินัยเข็นรถไปตามถนนราบด้วยแรง $200\ \mathrm{N}$ ในทิศที่รถเคลื่อนที่ มีแรงต้านรวม (แรงเสียดทานและแรงต้านอื่น ๆ) $150\ \mathrm{N}$ เข็นไปได้ $30\ \mathrm{m}$ งานรวมที่ทำต่อรถจักรยานยนต์เป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย J)'
    answer: { value: 1500, unit: J }
    hints:
      - 'มีสองแรงที่ทำงาน คือแรงเข็น (งานบวก) และแรงต้าน (งานลบ)'
      - 'หางานของแต่ละแรง แล้วนำมาบวกกันโดยคิดเครื่องหมาย หรือหาแรงลัพธ์ก่อนแล้วคูณระยะ'
    misconceptions:
      - { match: 6000, feedback: 'นี่คืองานของแรงเข็นอย่างเดียว งานรวมต้องรวมงานของแรงต้านซึ่งเป็นลบด้วย' }
      - { match: 10500, feedback: 'ดูเหมือนนำแรงทั้งสองมาบวกกัน แรงต้านสวนทางการเคลื่อนที่ งานของมันจึงเป็นลบ ต้องลบออก' }
    solution: 'งานของแรงเข็น $= (200\ \mathrm{N})(30\ \mathrm{m}) = 6000\ \mathrm{J}$ งานของแรงต้าน $= (150\ \mathrm{N})(30\ \mathrm{m})(-1) = -4500\ \mathrm{J}$ งานรวม $= 6000 - 4500 = 1500\ \mathrm{J}$ (หรือแรงลัพธ์ $50\ \mathrm{N} \times 30\ \mathrm{m} = 1500\ \mathrm{J}$)'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.work.p009
    topics: [physics.energy.work]
    difficulty: 4
    type: numeric
    stem: 'นักเรียนแบกกระเป๋ามวล $8\ \mathrm{kg}$ เดินขึ้นบันไดโรงเรียนไปชั้น 3 ซึ่งสูงกว่าชั้น 1 อยู่ $7\ \mathrm{m}$ แล้วเดินต่อไปตามทางเดินราบอีก $20\ \mathrm{m}$ ถึงห้องเรียน ตลอดทางเดินด้วยความเร็วคงตัว แรงที่นักเรียนแบกกระเป๋า (ทิศขึ้น) ทำงานต่อกระเป๋ารวมเท่าใด ใช้ $g = 9.8\ \mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย J)'
    answer: { value: 548.8, tolerance: 5, unit: J }
    hints:
      - 'แรงแบกมีทิศขึ้นและมีขนาดเท่ากับน้ำหนักกระเป๋า $mg$'
      - 'ช่วงเดินทางราบ แรงแบกตั้งฉากกับการเคลื่อนที่ งานช่วงนั้นเป็นเท่าใด'
      - 'นับเฉพาะการกระจัดในแนวดิ่งที่ขนานกับแรงแบก แล้วใช้ $W = mgh$'
    misconceptions:
      - { match: 2116.8, feedback: 'ดูเหมือนนับระยะทางเดินราบ $20\ \mathrm{m}$ เข้าไปด้วย ช่วงนั้นแรงแบกตั้งฉากกับการเคลื่อนที่ จึงไม่ทำงาน' }
      - { match: 56, feedback: 'ดูเหมือนใช้มวลแทนแรง ต้องคูณด้วย $g = 9.8\ \mathrm{m/s^2}$ เพื่อได้แรงแบกในหน่วยนิวตัน' }
    solution: 'แรงแบก $F = mg = (8\ \mathrm{kg})(9.8\ \mathrm{m/s^2}) = 78.4\ \mathrm{N}$ ช่วงขึ้นบันได $W_1 = (78.4\ \mathrm{N})(7\ \mathrm{m}) = 548.8\ \mathrm{J}$ ช่วงเดินราบ แรงตั้งฉากกับการเคลื่อนที่ $W_2 = 0$ งานรวม $= 548.8\ \mathrm{J}$'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.work.p010
    topics: [physics.energy.work]
    difficulty: 5
    type: numeric
    stem: 'คนงานลากรถเข็นของไปตามพื้นราบด้วยเชือกที่ทำมุม $30^\circ$ กับพื้น ออกแรงดึง $100\ \mathrm{N}$ มีแรงเสียดทาน $60\ \mathrm{N}$ ต้านการเคลื่อนที่ ลากไปได้ $15\ \mathrm{m}$ งานรวมที่ทำต่อรถเข็นเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย J ทศนิยม 1 ตำแหน่ง ใช้ $\cos 30^\circ \approx 0.866$)'
    answer: { value: 399.0, tolerance: 4, unit: J }
    hints:
      - 'หางานของแรงดึงด้วย $W = Fs\cos\theta$ และงานของแรงเสียดทานซึ่งเป็นลบ'
      - 'แรงเสียดทานสวนทางการเคลื่อนที่ $\theta = 180^\circ$'
      - 'งานรวม = งานของแรงดึง + งานของแรงเสียดทาน'
    misconceptions:
      - { match: 600, feedback: 'ดูเหมือนลืม $\cos 30^\circ$ ของแรงดึง แรงดึงที่เฉียงขึ้นทำงานได้เพียง $Fs\cos\theta$' }
      - { match: 1299.0, feedback: 'นี่คืองานของแรงดึงอย่างเดียว ยังไม่ได้รวมงานของแรงเสียดทานซึ่งเป็นลบ' }
    solution: 'งานของแรงดึง $= (100\ \mathrm{N})(15\ \mathrm{m})\cos 30^\circ \approx 1299.0\ \mathrm{J}$ งานของแรงเสียดทาน $= (60\ \mathrm{N})(15\ \mathrm{m})(-1) = -900\ \mathrm{J}$ งานรวม $\approx 1299.0 - 900 = 399.0\ \mathrm{J}$'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.work.p011
    topics: [physics.energy.work]
    difficulty: 2
    type: match
    stem: 'แรง $F$ กระทำต่อวัตถุที่เคลื่อนที่ได้การกระจัด $s$ โดยแรงทำมุม $\theta$ กับการเคลื่อนที่ จับคู่มุมกับงานที่แรงทำ'
    pairs:
      - { left: '$\theta = 0^\circ$', right: '$W = Fs$' }
      - { left: '$\theta = 60^\circ$', right: '$W = \tfrac{1}{2}Fs$' }
      - { left: '$\theta = 90^\circ$', right: '$W = 0$' }
      - { left: '$\theta = 180^\circ$', right: '$W = -Fs$' }
    hints:
