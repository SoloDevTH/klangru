id: earthscience.geology.earth-structure-surface
subject: earthscience
title: { th: โครงสร้างโลก ดิน และกระบวนการเปลี่ยนแปลงผิวโลก, en: "Earth's structure, soil and surface processes" }
summary: ชั้นของโลกตามองค์ประกอบทางเคมี การผุพังอยู่กับที่ การกร่อน และการสะสมตัวของตะกอน ชั้นหน้าตัดดินและปัจจัยการเกิดดิน และการตรวจวัดเนื้อดิน ความชื้น pH และธาตุอาหาร
difficulty: 3
minutes: 35
prerequisites: [earthscience.geology.rock-cycle-fossils]
encompasses:
  - { id: earthscience.geology.rock-cycle-fossils, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: โครงสร้างภายในโลก
    src: earth-layers.svg
    alt: "ภาพตัดหนึ่งในสี่ของโลกจากศูนย์กลางถึงผิว รัศมี 6,371 กิโลเมตร ชั้นนอกสุดบางมากสีน้ำตาลคือเปลือกโลก หนา 5–70 กิโลเมตร (วาดหนาเกินจริง) หินที่มีออกซิเจน ซิลิคอน อะลูมิเนียมมาก ถัดลงมาสีส้มคือเนื้อโลก ลึกถึงราว 2,900 กิโลเมตร หินที่มีซิลิคอน ออกซิเจน แมกนีเซียม เหล็ก สีเหลืองคือแก่นโลกชั้นนอก ลึก 2,900–5,150 กิโลเมตร เหล็กและนิกเกิลหลอมเหลว และสีเหลืองอ่อนตรงกลางคือแก่นโลกชั้นใน ลึก 5,150–6,371 กิโลเมตร เหล็กและนิกเกิลที่เป็นของแข็ง"
    caption: "ความลึกของเนื้อโลกและแก่นโลกวาดตามมาตราส่วน ส่วนเปลือกโลกบางมากจนต้องวาดหนาเกินจริง (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: เปลือกโลกบางแค่ไหน
    problem: "เปลือกโลกทวีปหนาเฉลี่ยราว 35 km โลกมีรัศมี 6,371 km ถ้าวาดโลกเป็นวงกลมรัศมี 10 cm เปลือกโลกจะหนากี่มิลลิเมตร"
    steps:
      - text: "สัดส่วนความหนา $= \\dfrac{35}{6{,}371} \\approx 0.0055$"
      - text: "รัศมี 10 cm $= 100$ mm"
        why: "แปลงเป็นมิลลิเมตรก่อน เพราะคำตอบเล็กมาก"
      - text: "ความหนาในภาพ $= 0.0055 \\times 100 \\approx 0.55$ mm"
    answer: "ราว 0.55 mm บางกว่าเส้นดินสอ เปลือกโลกจึงเป็นเหมือนเปลือกไข่บาง ๆ ของโลก"
  - { type: check, problem: earthscience.geology.earth-structure-surface.p001, prompt: "เริ่มจากชั้นที่เราอาศัยอยู่" }
  - type: figure
    title: ชั้นหน้าตัดดิน
    src: soil-profile.svg
    alt: "ภาพตัดดินจากผิวลงไปลึก มีหญ้าอยู่ด้านบน ชั้น O สีดำบาง ๆ ใบไม้และซากพืชที่ผุพัง ชั้น A สีน้ำตาลเข้ม ดินบน มีฮิวมัสและรากพืชมาก ชั้น E สีจาง น้ำชะแร่ธาตุลงไป ชั้น B สีน้ำตาลแดง ดินล่าง สะสมดินเหนียวและเหล็ก ชั้น C มีก้อนหิน หินที่ผุพังบางส่วน และชั้น R สีเทา หินพื้นที่ยังไม่ผุพัง ดินจริงบางที่ไม่มีครบทุกชั้น"
    caption: "ยิ่งลึก อินทรียวัตถุยิ่งน้อย และใกล้หินต้นกำเนิดมากขึ้น (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: หาร้อยละความชื้นของดิน
    problem: "นักเรียนตักดินจากแปลงผักมาชั่งได้ 120 g อบจนแห้งแล้วชั่งได้ 96 g ดินนี้มีความชื้นร้อยละเท่าใด (คิดเทียบกับมวลดินแห้ง)"
    steps:
      - text: "มวลน้ำที่ระเหยไป $= 120 - 96 = 24$ g"
      - text: "ร้อยละความชื้น $= \\dfrac{24}{96} \\times 100 = 25\\%$"
        why: "สูตรในบทนี้ใช้มวลดินแห้งเป็นตัวหาร เพราะมวลดินแห้งไม่เปลี่ยนตามปริมาณน้ำ"
      - text: "ถ้าใช้มวลดินชื้นเป็นตัวหารจะได้ $24/120 \\times 100 = 20\\%$ ซึ่งเป็นอีกนิยามหนึ่ง จึงต้องบอกเสมอว่าใช้แบบใด"
    answer: "ความชื้นร้อยละ 25 ของมวลดินแห้ง"
  - { type: check, problem: earthscience.geology.earth-structure-surface.p007, prompt: "หารด้วยมวลดินแห้ง" }
glossary:
  - { term: เปลือกโลก, definition: "ชั้นนอกสุดของโลก หนา 5–70 km เป็นหินที่มีออกซิเจน ซิลิคอน และอะลูมิเนียมมาก" }
  - { term: เนื้อโลก, definition: "ชั้นใต้เปลือกโลกถึงความลึกราว 2,900 km เป็นหินซิลิเกตที่มีแมกนีเซียมและเหล็กมาก" }
  - { term: แก่นโลก, definition: "ชั้นในสุดของโลก ประกอบด้วยเหล็กและนิกเกิล ชั้นนอกหลอมเหลว ชั้นในเป็นของแข็ง" }
  - { term: การผุพังอยู่กับที่, definition: "การที่หินแตกหรือเปลี่ยนสภาพ ณ ที่เดิม ทั้งเชิงกายภาพ เชิงเคมี และเชิงชีวภาพ" }
  - { term: การกร่อน, definition: "การที่น้ำ ลม ธารน้ำแข็ง คลื่น หรือแรงโน้มถ่วงพาหินและดินออกไปจากที่เดิม" }
  - { term: การสะสมตัวของตะกอน, definition: "การที่ตะกอนตกทับถมเมื่อตัวกลางที่พามาอ่อนกำลังลง เช่น ดินดอนสามเหลี่ยมปากแม่น้ำ" }
  - { term: ชั้นหน้าตัดดิน, definition: "ลำดับชั้นของดินที่เห็นเมื่อขุดลงไป ได้แก่ ชั้น O A E B C และ R" }
  - { term: ฮิวมัส, definition: "อินทรียวัตถุสีเข้มที่ได้จากการย่อยสลายซากพืชซากสัตว์ ทำให้ดินอุดมสมบูรณ์" }
flashcards:
  - { front: "ชั้นของโลกตามองค์ประกอบมีอะไรบ้าง", back: "เปลือกโลก เนื้อโลก และแก่นโลก (ชั้นนอกหลอมเหลว ชั้นในเป็นของแข็ง)" }
  - { front: "ธาตุใดมีมากที่สุดในเปลือกโลก", back: "ออกซิเจน รองลงมาคือซิลิคอน" }
  - { front: "การผุพังต่างจากการกร่อนอย่างไร", back: "การผุพังเกิดกับที่ การกร่อนพาวัสดุออกไปจากที่เดิม" }
  - { front: "ชั้นดินใดเหมาะกับการเพาะปลูกที่สุด", back: "ชั้น A (ดินบน) มีฮิวมัสและธาตุอาหารมาก" }
  - { front: "ปัจจัยที่ทำให้ดินต่างกัน", back: "หินต้นกำเนิด ภูมิอากาศ สิ่งมีชีวิต ลักษณะภูมิประเทศ และเวลา" }
