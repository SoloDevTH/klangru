problems:
  - id: math.geometry.nets-views.p001
    topics: [math.geometry.nets-views]
    difficulty: 1
    type: mcq
    stem: "รูปคลี่ของลูกบาศก์ประกอบด้วยรูปอะไร กี่รูป"
    choices:
      - { id: a, text: "สี่เหลี่ยมจัตุรัส 6 รูป", correct: true }
      - { id: b, text: "สี่เหลี่ยมจัตุรัส 4 รูป", feedback: "นับแค่หน้ารอบข้าง ลูกบาศก์ยังมีหน้าบนและหน้าล่างอีก 2 หน้า" }
      - { id: c, text: "สี่เหลี่ยมจัตุรัส 8 รูป", feedback: "8 คือจำนวนจุดยอดของลูกบาศก์ ไม่ใช่จำนวนหน้า" }
    hints:
      - "รูปคลี่มีรูปหนึ่งรูปต่อหน้าหนึ่งหน้า"
      - "ลูกบาศก์มีหน้ากี่หน้า แต่ละหน้าเป็นรูปอะไร"
    solution: "ลูกบาศก์มี 6 หน้า ทุกหน้าเป็นสี่เหลี่ยมจัตุรัสเท่ากัน รูปคลี่จึงมีสี่เหลี่ยมจัตุรัส 6 รูป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.nets-views.p002
    topics: [math.geometry.nets-views]
    difficulty: 1
    type: match
    stem: "จับคู่ทรงสามมิติกับรูปคลี่"
    pairs:
      - { left: "ทรงกระบอก", right: "วงกลม 2 รูป และสี่เหลี่ยมมุมฉาก 1 รูป" }
      - { left: "กรวย", right: "วงกลม 1 รูป และรูปเสี้ยววงกลม 1 รูป" }
      - { left: "พีระมิดฐานสี่เหลี่ยม", right: "สี่เหลี่ยม 1 รูป และสามเหลี่ยม 4 รูป" }
      - { left: "ปริซึมสามเหลี่ยม", right: "สามเหลี่ยม 2 รูป และสี่เหลี่ยมมุมฉาก 3 รูป" }
    hints:
      - "นับว่าทรงแต่ละแบบมีหน้าเป็นรูปอะไรบ้าง"
      - "ปริซึมมีฐานสองฐาน พีระมิดมีฐานเดียว"
    solution: "ทรงกระบอก: วงกลม 2 สี่เหลี่ยม 1 กรวย: วงกลม 1 เสี้ยววงกลม 1 พีระมิดฐานสี่เหลี่ยม: ฐาน 1 สามเหลี่ยม 4 ปริซึมสามเหลี่ยม: สามเหลี่ยม 2 สี่เหลี่ยมมุมฉาก 3"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.nets-views.p003
    topics: [math.geometry.nets-views]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "รูปคลี่ใดพับเป็นลูกบาศก์ได้ (เลือกทุกข้อที่ถูก)"
    figure: { src: four-nets.svg, alt: "รูปคลี่สี่แบบ แต่ละแบบมีสี่เหลี่ยมจัตุรัส 6 รูป แบบ ก เป็นสี่เหลี่ยมผืนผ้า 2 แถว แถวละ 3 ช่อง แบบ ข เป็นแถวนอน 4 ช่อง และช่องซ้ายสุดมีช่องต่อขึ้นข้างบน 1 ช่องและลงข้างล่าง 1 ช่อง แบบ ค เป็นสองแถวแถวละ 3 ช่องเหลื่อมกันเป็นขั้นบันได ช่องขวาสุดของแถวล่างอยู่ใต้ช่องซ้ายสุดของแถวบน แบบ ง เป็นแถวนอน 4 ช่อง มีช่องต่อขึ้นข้างบนที่ช่องซ้ายสุดและช่องขวาสุด เป็นรูปตัว U" }
    choices:
      - { id: a, text: "ก", feedback: "แบบ ก มีกลุ่ม 2 × 2 อยู่ข้างใน สี่หน้าจะมาชนกันที่มุมเดียว พับไม่ได้" }
      - { id: b, text: "ข", correct: true }
      - { id: c, text: "ค", correct: true }
      - { id: d, text: "ง", feedback: "ลองพับแบบ ง: สองช่องที่ยื่นขึ้นจะไปเป็นหน้าเดียวกัน (หน้าบน) ซ้อนกัน และไม่มีหน้าล่าง" }
    hints:
      - "รูปที่มีกลุ่ม 2 × 2 พับไม่ได้"
      - "ลองนึกพับแถวยาว 4 ช่องเป็นผนังรอบลูกบาศก์ แล้วดูว่าช่องที่เหลือไปเป็นหน้าบนและหน้าล่างคนละหน้าหรือไม่"
    solution: "ข: แถว 4 ช่องพันรอบเป็นผนัง ช่องที่ยื่นขึ้นและลงเป็นหน้าบนกับหน้าล่าง ✓ ค: แบบ 3–3 ขั้นบันไดเป็นรูปคลี่ลูกบาศก์ ✓ ก มีกลุ่ม 2 × 2 ✗ ง สองช่องที่ยื่นขึ้นทับกันเป็นหน้าบน ✗"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.nets-views.p004
    topics: [math.geometry.nets-views]
    difficulty: 2
    type: mcq
    stem: "พับรูปคลี่ในภาพเป็นลูกบาศก์ หน้าใดอยู่ตรงข้ามกับหน้า A"
    figure: { src: net-letters.svg, alt: "รูปคลี่ลูกบาศก์เป็นขั้นบันไดสามขั้น แถวล่างมีช่อง A และ B (B อยู่ขวาของ A) แถวกลางมีช่อง C และ D โดย C อยู่เหนือ B และ D อยู่ขวาของ C แถวบนมีช่อง E และ F โดย E อยู่เหนือ D และ F อยู่ขวาของ E" }
    choices:
      - { id: a, text: "D", correct: true }
      - { id: b, text: "B", feedback: "B อยู่ติดกับ A ในรูปคลี่ เมื่อพับก็ยังติดกัน หน้าตรงข้ามต้องไม่ติดกัน" }
      - { id: c, text: "C", feedback: "C ติดกับ B ซึ่งติดกับ A ลองพับ B ขึ้นเป็นผนัง แล้วดูว่า C ไปอยู่ตรงไหน" }
      - { id: d, text: "F", feedback: "F อยู่ไกลจาก A ในรูปคลี่ แต่ไกลในรูปคลี่ไม่ได้แปลว่าอยู่ตรงข้าม ลองพับทีละหน้า" }
    hints:
      - "วาง A เป็นหน้าล่าง แล้วพับ B ขึ้นเป็นผนังด้านขวา"
      - "B, C, D เรียงต่อกันแบบหักมุม ลองหาว่าหน้าใดพับมาอยู่บนสุด ตรงข้ามกับหน้าล่าง"
    solution: "ให้ A เป็นหน้าล่าง B พับขึ้นเป็นผนังด้านขวา C ต่อจาก B ทางด้านบนของรูปคลี่ จึงพับเป็นผนังด้านหลัง บนหน้า C ทิศทางขวาของรูปคลี่ชี้ขึ้นข้างบน (เพราะ C ต่อมาจาก B ที่ตั้งขึ้น) D ซึ่งต่อจาก C ทางขวาจึงพับลงมาเป็นหน้าบน D จึงอยู่ตรงข้ามกับ A (ตรวจด้วยการตัดกระดาษพับจริงได้)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.nets-views.p005
    topics: [math.geometry.nets-views]
    difficulty: 2
    type: numeric
    stem: "ทรงในภาพสร้างจากลูกบาศก์ขนาดเท่ากัน ไม่มีลูกบาศก์ลอยอยู่ ทรงนี้ใช้ลูกบาศก์กี่ก้อน (ตอบเป็นจำนวนก้อน)"
    figure: { src: cube-structure-q.svg, alt: "ภาพไอโซเมตริกของทรงที่ต่อจากลูกบาศก์ แถวหน้ามีสามกองเรียงจากซ้ายไปขวา สูง 1, 2 และ 1 ก้อน และมีกองสูง 3 ก้อนอยู่ข้างหลังกองขวาสุดของแถวหน้า มีลูกศรชี้ที่ด้านหน้า" }
    answer: { value: 7, unit: ก้อน }
    hints:
      - "นับทีละกอง กองหนึ่งสูงกี่ก้อน"
      - "กองที่อยู่ข้างหลังต้องมีลูกบาศก์รองถึงพื้น แม้จะมองไม่เห็นทุกก้อน"
    misconceptions:
      - { match: 4, feedback: "นับแค่จำนวนกอง (ช่องที่เห็นจากด้านบน) ต้องนับทุกก้อนในแต่ละกอง" }
      - { match: 6, feedback: "กองหลังสูง 3 ก้อน ก้อนล่างสุดถูกบังบางส่วน แต่ต้องมีอยู่เพราะไม่มีก้อนลอย" }
    solution: "แถวหน้า $1 + 2 + 1 = 4$ ก้อน กองหลัง 3 ก้อน รวม $4 + 3 = 7$ ก้อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.nets-views.p006
    topics: [math.geometry.nets-views]
    difficulty: 2
    type: mcq
    stem: "รูปคลี่ประกอบด้วยรูปห้าเหลี่ยมที่เท่ากัน 2 รูป และสี่เหลี่ยมมุมฉาก 5 รูป เป็นรูปคลี่ของทรงใด"
    choices:
      - { id: a, text: "ปริซึมห้าเหลี่ยม", correct: true }
      - { id: b, text: "พีระมิดฐานห้าเหลี่ยม", feedback: "พีระมิดมีฐานเดียวและหน้าข้างเป็นสามเหลี่ยม รูปคลี่นี้มีห้าเหลี่ยมสองรูปและหน้าข้างเป็นสี่เหลี่ยม" }
      - { id: c, text: "ปริซึมสี่เหลี่ยม", feedback: "ชื่อปริซึมเรียกตามรูปของฐาน ฐานเป็นห้าเหลี่ยม ไม่ใช่สี่เหลี่ยม" }
    hints:
      - "รูปที่เท่ากันสองรูปคือฐานสองฐาน"
      - "ทรงที่มีฐานสองฐานและหน้าข้างเป็นสี่เหลี่ยมคือปริซึม เรียกชื่อตามฐาน"
    solution: "มีฐานห้าเหลี่ยม 2 รูปและหน้าข้างสี่เหลี่ยมมุมฉาก 5 รูป (เท่ากับจำนวนด้านของฐาน) จึงเป็นปริซึมห้าเหลี่ยม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.nets-views.p007
    topics: [math.geometry.nets-views]
    difficulty: 3
    type: mcq
    stem: "จากทรงในภาพ ภาพด้านหน้ามีสามคอลัมน์ แต่ละคอลัมน์สูงกี่ช่อง เรียงจากซ้ายไปขวา"
    figure: { src: cube-structure-q.svg, alt: "ภาพไอโซเมตริกของทรงที่ต่อจากลูกบาศก์ แถวหน้ามีสามกองเรียงจากซ้ายไปขวา สูง 1, 2 และ 1 ก้อน และมีกองสูง 3 ก้อนอยู่ข้างหลังกองขวาสุดของแถวหน้า มีลูกศรชี้ที่ด้านหน้า" }
    choices:
      - { id: a, text: "1, 2, 3", correct: true }
      - { id: b, text: "1, 2, 1", feedback: "ดูแค่แถวหน้า แต่กองสูง 3 ก้อนข้างหลังโผล่พ้นกองหน้าขึ้นมา ภาพด้านหน้าจึงสูงเท่ากองที่สูงที่สุดในคอลัมน์" }
      - { id: c, text: "3, 2, 1", feedback: "กลับซ้ายขวา กองสูง 3 ก้อนอยู่ทางขวาเมื่อมองจากด้านหน้า" }
      - { id: d, text: "1, 2, 4", feedback: "รวมความสูงของกองหน้ากับกองหลัง แต่ภาพด้านหน้าไม่นำกองมาต่อกัน กองหลังซ้อนอยู่หลังกองหน้า" }
    hints:
      - "มองจากลูกศร คอลัมน์ขวาสุดมีกองหน้าและกองหลังซ้อนกัน"
      - "ความสูงในภาพด้านหน้าคือความสูงของกองที่สูงที่สุดในคอลัมน์นั้น"
    solution: "คอลัมน์ซ้ายสูง 1 คอลัมน์กลางสูง 2 คอลัมน์ขวามีกองหน้าสูง 1 กับกองหลังสูง 3 เห็นสูงสุด 3 ภาพด้านหน้าจึงเป็น 1, 2, 3"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.nets-views.p008
    topics: [math.geometry.nets-views]
    difficulty: 3
    type: numeric
    stem: "จากทรงในภาพ ภาพด้านบนมีสี่เหลี่ยมจัตุรัสกี่ช่อง (ตอบเป็นจำนวนช่อง)"
    figure: { src: cube-structure-q.svg, alt: "ภาพไอโซเมตริกของทรงที่ต่อจากลูกบาศก์ แถวหน้ามีสามกองเรียงจากซ้ายไปขวา สูง 1, 2 และ 1 ก้อน และมีกองสูง 3 ก้อนอยู่ข้างหลังกองขวาสุดของแถวหน้า มีลูกศรชี้ที่ด้านหน้า" }
    answer: { value: 4, unit: ช่อง }
    hints:
      - "ภาพด้านบนไม่บอกความสูง บอกแค่ว่าช่องใดมีลูกบาศก์"
      - "นับจำนวนกอง"
    misconceptions:
      - { match: 7, feedback: "7 คือจำนวนลูกบาศก์ทั้งหมด ภาพด้านบนเห็นกองละหนึ่งช่องเท่านั้น" }
      - { match: 3, feedback: "ลืมกองหลัง กองหลังอยู่คนละช่องกับกองหน้า จึงเห็นเป็นอีกช่องหนึ่งจากด้านบน" }
    solution: "มี 4 กอง (แถวหน้า 3 กอง แถวหลัง 1 กอง) ภาพด้านบนจึงมี 4 ช่อง เรียงเป็นรูปตัว L"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.nets-views.p009
    topics: [math.geometry.nets-views]
    difficulty: 3
    type: mcq
    stem: "แม่หั่นแตงกวาเป็นแว่นตั้งฉากกับความยาวของลูก ถ้าถือว่าแตงกวาเป็นทรงกระบอก หน้าตัดของแต่ละแว่นเป็นอย่างไร"
    choices:
      - { id: a, text: "วงกลมที่มีขนาดเท่ากันทุกแว่น", correct: true }
      - { id: b, text: "วงกลมที่เล็กลงเรื่อย ๆ", feedback: "ที่เล็กลงเป็นสมบัติของกรวยและพีระมิด ทรงกระบอกตัดขนานกับฐานได้รูปเท่าฐานทุกครั้ง" }
      - { id: c, text: "สี่เหลี่ยมมุมฉาก", feedback: "สี่เหลี่ยมมุมฉากได้จากการผ่าตามความยาว ไม่ใช่หั่นเป็นแว่น" }
    hints:
      - "หั่นตั้งฉากกับความยาว คือตัดขนานกับฐานของทรงกระบอก"
      - "ฐานของทรงกระบอกเป็นรูปอะไร และขนาดเปลี่ยนไปตามความยาวหรือไม่"
    solution: "การหั่นเป็นแว่นคือการตัดขนานกับฐาน ทรงกระบอกตัดขนานกับฐานได้วงกลมเท่ากับฐานทุกครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.nets-views.p010
    topics: [math.geometry.nets-views]
    difficulty: 3
    type: match
    stem: "จับคู่การตัดกับรูปหน้าตัดที่ได้"
    pairs:
      - { left: "ตัดพีระมิดฐานสี่เหลี่ยมจัตุรัสขนานกับฐาน", right: "สี่เหลี่ยมจัตุรัสที่เล็กกว่าฐาน" }
      - { left: "ตัดทรงกลมแนวใดก็ได้", right: "วงกลม" }
      - { left: "ตัดทรงกระบอกตามแนวแกน", right: "สี่เหลี่ยมมุมฉาก" }
      - { left: "ตัดปริซึมสามเหลี่ยมขนานกับหน้าสามเหลี่ยม", right: "สามเหลี่ยมที่เท่ากับหน้าปลาย" }
    hints:
      - "ปริซึมตัดขนานกับฐานได้รูปเท่าฐาน พีระมิดได้รูปที่เล็กลง"
      - "ทรงกลมไม่ว่าตัดแนวไหนก็ได้รูปเดียวกัน"
    solution: "พีระมิด: จัตุรัสเล็กกว่าฐาน ทรงกลม: วงกลม ทรงกระบอกตามแกน: สี่เหลี่ยมมุมฉาก ปริซึมสามเหลี่ยมขนานหน้าปลาย: สามเหลี่ยมเท่าหน้าปลาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.nets-views.p011
    topics: [math.geometry.nets-views]
    difficulty: 3
    type: mcq
    stem: "นำกระดาษรูปสามเหลี่ยมมุมฉากติดกับไม้ตามด้านประกอบมุมฉากด้านหนึ่ง แล้วหมุนไม้ให้กระดาษหมุนครบรอบเร็ว ๆ จะเห็นเป็นทรงอะไร"
    choices:
      - { id: a, text: "กรวย", correct: true }
      - { id: b, text: "ทรงกระบอก", feedback: "ทรงกระบอกเกิดจากการหมุนสี่เหลี่ยมมุมฉาก สามเหลี่ยมแคบลงไปถึงยอด จึงได้ทรงที่มียอดแหลม" }
      - { id: c, text: "พีระมิด", feedback: "การหมุนรอบแกนทำให้ได้ฐานเป็นวงกลม พีระมิดมีฐานเป็นรูปหลายเหลี่ยม" }
      - { id: d, text: "ทรงกลม", feedback: "ทรงกลมเกิดจากการหมุนครึ่งวงกลมรอบเส้นผ่านศูนย์กลาง" }
    hints:
      - "จุดที่อยู่ไกลแกนที่สุดหมุนเป็นวงกลมวงใหญ่ จุดบนแกนอยู่กับที่"
      - "ด้านล่างของสามเหลี่ยมหมุนเป็นวงกลม ยอดบนแกนกลายเป็นยอดแหลม"
    solution: "ด้านประกอบมุมฉากที่ติดไม้คือแกน ด้านประกอบมุมฉากอีกด้านหมุนเป็นฐานวงกลม ด้านตรงข้ามมุมฉากหมุนเป็นผิวข้างที่เอียงไปถึงยอด จึงได้กรวย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.nets-views.p012
    topics: [math.geometry.nets-views]
    difficulty: 3
    type: mcq
    stem: "ช่างต้องการตัดกระดาษแข็งแผ่นเดียวแล้วพับเป็นกล่องใส่ขนมเปี๊ยะ ควรวาดแบบใดลงบนกระดาษแข็ง"
    choices:
      - { id: a, text: "รูปคลี่ของกล่อง", correct: true }
      - { id: b, text: "ภาพด้านหน้า ด้านข้าง และด้านบน", feedback: "ภาพสามด้านบอกขนาดได้ดี แต่ไม่ได้บอกว่าหน้าแต่ละหน้าต่อกันอย่างไรเพื่อตัดเป็นชิ้นเดียว" }
      - { id: c, text: "ภาพสามมิติแบบไอโซเมตริก", feedback: "ภาพสามมิติดูเหมือนจริง แต่ตัดตามเส้นแล้วพับไม่ได้ และมุมในภาพไม่ใช่ขนาดจริง" }
    hints:
      - "สิ่งที่ตัดออกจากกระดาษแข็งแผ่นเดียวแล้วพับได้คืออะไร"
      - "แบบนั้นแสดงทุกหน้าในขนาดจริงต่อกันเป็นชิ้นเดียว"
    solution: "รูปคลี่แสดงทุกหน้าของกล่องในขนาดจริงต่อกันเป็นชิ้นเดียว ตัดแล้วพับตามรอยพับได้ทันที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.nets-views.p013
    topics: [math.geometry.nets-views]
    difficulty: 4
    type: numeric
    stem: "โรงงานพิมพ์ฉลากพันรอบกระป๋องปลากระป๋องรูปทรงกระบอกรัศมี $7\\ \\mathrm{cm}$ พอดี (ไม่ซ้อนทับ) ฉลากเป็นสี่เหลี่ยมมุมฉาก ด้านยาวของฉลากยาวกี่เซนติเมตร (ใช้ $\\pi \\approx \\tfrac{22}{7}$ ตอบในหน่วย cm)"
    answer: { value: 44, unit: cm }
    hints:
      - "ฉลากคือส่วนที่เป็นสี่เหลี่ยมมุมฉากในรูปคลี่ของทรงกระบอก"
      - "ด้านยาวของฉลากพันรอบวงกลมพอดี จึงเท่ากับเส้นรอบวง $2\\pi r$"
    misconceptions:
      - { match: 14, feedback: "14 cm คือเส้นผ่านศูนย์กลาง ฉลากต้องพันรอบกระป๋อง ยาวเท่าเส้นรอบวง" }
      - { match: 22, feedback: "ใช้ $\\pi r$ ซึ่งเป็นครึ่งรอบ เส้นรอบวงคือ $2\\pi r$" }
      - { match: 154, feedback: "นั่นคือพื้นที่ของฝากระป๋อง $\\pi r^2$ ข้อนี้ถามความยาว" }
    solution: "ด้านยาวของฉลาก = เส้นรอบวง $= 2\\pi r \\approx 2 \\times \\tfrac{22}{7} \\times 7 = 44\\ \\mathrm{cm}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.nets-views.p014
    topics: [math.geometry.nets-views]
    difficulty: 4
    type: numeric
    stem: "จะเขียนจุด 1 ถึง 6 ลงบนรูปคลี่ในภาพแล้วพับเป็นลูกเต๋าที่ถูกต้อง (จุดบนหน้าตรงข้ามรวมกันได้ 7) ถ้าหน้า A มี 2 จุด หน้า D ต้องมีกี่จุด (ตอบเป็นจำนวนจุด)"
    figure: { src: net-letters.svg, alt: "รูปคลี่ลูกบาศก์เป็นขั้นบันไดสามขั้น แถวล่างมีช่อง A และ B (B อยู่ขวาของ A) แถวกลางมีช่อง C และ D โดย C อยู่เหนือ B และ D อยู่ขวาของ C แถวบนมีช่อง E และ F โดย E อยู่เหนือ D และ F อยู่ขวาของ E" }
    answer: { value: 5, unit: จุด }
    hints:
      - "หาก่อนว่าหน้า D อยู่ตรงข้ามกับหน้า A หรือไม่ (ลองพับ A เป็นหน้าล่าง)"
      - "หน้าตรงข้ามของลูกเต๋ารวมกันได้ 7"
    misconceptions:
      - { match: 2, feedback: "หน้าตรงข้ามไม่ได้มีจำนวนจุดเท่ากัน แต่รวมกันได้ 7" }
      - { match: 9, feedback: "บวก 7 เข้าไป ต้องหาจำนวนที่บวกกับ 2 แล้วได้ 7" }
    solution: "เมื่อพับ A เป็นหน้าล่าง D จะพับมาเป็นหน้าบน จึงอยู่ตรงข้ามกับ A หน้า D ต้องมี $7 - 2 = 5$ จุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.nets-views.p015
    topics: [math.geometry.nets-views]
    difficulty: 4
    type: mcq
    stem: "ข้อใด **ไม่** สามารถเป็นหน้าตัดของลูกบาศก์ได้ (ตัดด้วยระนาบเรียบหนึ่งครั้ง)"
    choices:
      - { id: a, text: "วงกลม", correct: true }
      - { id: b, text: "สามเหลี่ยม", feedback: "ตัดเฉียงที่มุมของลูกบาศก์ ตัดผ่านสามหน้าที่มาพบกัน จะได้สามเหลี่ยม" }
      - { id: c, text: "หกเหลี่ยม", feedback: "ตัดผ่านจุดกึ่งกลางของสันหกเส้นที่เหมาะสม จะได้หกเหลี่ยมด้านเท่า" }
      - { id: d, text: "สี่เหลี่ยมมุมฉากที่ไม่ใช่จัตุรัส", feedback: "ตัดเฉียงผ่านสันสองเส้นที่ขนานกันฝั่งตรงข้าม จะได้สี่เหลี่ยมมุมฉากที่ยาวกว่าด้านของลูกบาศก์" }
    hints:
      - "ระนาบตัดหน้าแบนของลูกบาศก์เป็นเส้นตรงเสมอ"
      - "หน้าตัดของลูกบาศก์จึงมีขอบเป็นเส้นตรงทุกด้าน รูปใดมีขอบโค้ง"
    solution: "ทุกหน้าของลูกบาศก์แบน รอยตัดบนแต่ละหน้าจึงเป็นส่วนของเส้นตรง หน้าตัดเป็นรูปหลายเหลี่ยม (3 ถึง 6 ด้าน) ได้ แต่เป็นวงกลมไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.nets-views.p016
    topics: [math.geometry.nets-views]
    difficulty: 4
    type: mcq
    stem: "หมุนสี่เหลี่ยมมุมฉากขนาด $3\\ \\mathrm{cm} \\times 5\\ \\mathrm{cm}$ ครบหนึ่งรอบ โดยใช้ด้านที่ยาว $5\\ \\mathrm{cm}$ เป็นแกน จะได้ทรงใด"
    choices:
      - { id: a, text: "ทรงกระบอกรัศมี 3 cm สูง 5 cm", correct: true }
      - { id: b, text: "ทรงกระบอกรัศมี 5 cm สูง 3 cm", feedback: "ด้านที่เป็นแกนกลายเป็นความสูง ด้านที่ตั้งฉากกับแกนหมุนเป็นรัศมี" }
      - { id: c, text: "ทรงกระบอกรัศมี 1.5 cm สูง 5 cm", feedback: "ด้าน 3 cm หมุนจากแกนออกไปเป็นรัศมีทั้งเส้น ไม่ใช่เส้นผ่านศูนย์กลาง" }
      - { id: d, text: "กรวยรัศมี 3 cm สูง 5 cm", feedback: "กรวยเกิดจากการหมุนสามเหลี่ยมมุมฉาก สี่เหลี่ยมมีความกว้างเท่ากันตลอด จึงได้ทรงกระบอก" }
    hints:
      - "ด้านที่ติดแกนอยู่กับที่ กลายเป็นความสูง"
      - "ด้านตรงข้ามแกนอยู่ห่างแกนเท่าไร ระยะนี้คือรัศมี"
    solution: "แกนยาว 5 cm เป็นความสูง ด้าน 3 cm ที่ตั้งฉากกับแกนกวาดเป็นวงกลมรัศมี 3 cm จึงได้ทรงกระบอกรัศมี 3 cm สูง 5 cm"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.nets-views.p017
    topics: [math.geometry.nets-views]
    difficulty: 5
    type: numeric
    stem: "พีระมิดฐานสี่เหลี่ยมจัตุรัสยาวด้านละ $12\\ \\mathrm{cm}$ ตัดด้วยระนาบที่ขนานกับฐานตรงครึ่งหนึ่งของความสูง หน้าตัดมีพื้นที่กี่ตารางเซนติเมตร (ตอบในหน่วย cm²)"
    answer: { value: 36, unit: "cm²" }
    hints:
      - "หน้าตัดขนานกับฐานเป็นจัตุรัสที่เล็กลง ตรงครึ่งความสูง ด้านยาวเป็นครึ่งหนึ่งของด้านฐาน"
      - "ด้านของหน้าตัด $= 12 \\div 2$ แล้วยกกำลังสอง"
    misconceptions:
      - { match: 72, feedback: "ครึ่งหนึ่งของพื้นที่ฐาน แต่ด้านยาวลดลงครึ่งหนึ่งทั้งสองด้าน พื้นที่จึงเหลือหนึ่งในสี่" }
      - { match: 144, feedback: "นั่นคือพื้นที่ฐาน หน้าตัดของพีระมิดเล็กลงเมื่อตัดสูงขึ้น" }
    solution: "ตรงครึ่งความสูง ขอบของพีระมิดเข้ามาครึ่งทางระหว่างขอบฐานกับยอด ด้านของหน้าตัดจึงยาว $12 \\div 2 = 6\\ \\mathrm{cm}$ พื้นที่ $= 6 \\times 6 = 36\\ \\mathrm{cm^2}$ (หนึ่งในสี่ของฐาน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.nets-views.p018
    topics: [math.geometry.nets-views]
    difficulty: 5
    type: numeric
    stem: "ทรงหนึ่งต่อจากลูกบาศก์ ภาพด้านบนเป็นจัตุรัส $2 \\times 2$ ช่อง ภาพด้านหน้าเป็นสองคอลัมน์ สูง 2 ช่องทั้งคู่ และภาพด้านข้างเป็นสองคอลัมน์ สูง 2 ช่องทั้งคู่ ทรงนี้ใช้ลูกบาศก์ **น้อยที่สุด** กี่ก้อน (ไม่มีก้อนลอย ตอบเป็นจำนวนก้อน)"
    answer: { value: 6, unit: ก้อน }
    hints:
      - "ภาพด้านบนบอกว่าทั้ง 4 ช่องต้องมีอย่างน้อย 1 ก้อน"
      - "แต่ละคอลัมน์ของภาพด้านหน้าและด้านข้างต้องมีกองสูง 2 อย่างน้อยหนึ่งกอง ลองวางกองสูง 2 ไว้ในแนวทแยง"
    misconceptions:
      - { match: 8, feedback: "นั่นคือจำนวนมากที่สุด (ทุกกองสูง 2) ข้อนี้ถามน้อยที่สุด" }
      - { match: 4, feedback: "ถ้าทุกกองสูง 1 ภาพด้านหน้าจะสูงแค่ 1 ช่อง ต้องมีกองสูง 2 ด้วย" }
      - { match: 5, feedback: "กองสูง 2 กองเดียวทำให้ภาพด้านหน้าสูง 2 ได้แค่คอลัมน์เดียว อีกคอลัมน์ยังสูง 1" }
    solution: "ทุกช่องต้องมีอย่างน้อย 1 ก้อน (4 ก้อน) ภาพด้านหน้าต้องมีกองสูง 2 ในทั้งสองคอลัมน์ และภาพด้านข้างก็ต้องมีในทั้งสองแถว วางกองสูง 2 สองกองในแนวทแยง (หน้าซ้ายและหลังขวา) ครบทุกเงื่อนไข ได้ $2 + 1 + 1 + 2 = 6$ ก้อน น้อยกว่านี้ไม่ได้เพราะกองสูง 2 กองเดียวครอบคลุมได้แค่คอลัมน์เดียวและแถวเดียว"
    license: CC-BY-SA-4.0
    ai_assisted: true
