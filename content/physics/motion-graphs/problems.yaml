    solution: "พื้นที่สี่เหลี่ยมคางหมู $= \\tfrac{1}{2}(u + v)t$ จึงได้ $s = \\dfrac{(u + v)t}{2}$ ซึ่งเป็นสมการหนึ่งในสี่สมการของความเร่งคงตัว"
