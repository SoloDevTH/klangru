  topics:
  - chinese.grammar.word-order
  difficulty: 4
  type: order
  stem: เรียงคำเป็นประโยค "เสาร์อาทิตย์พวกเราก็วิ่งที่สวนสาธารณะลุมพินี" (周末 zhōumò = สุดสัปดาห์, 公园 gōngyuán = สวนสาธารณะ, 跑步 pǎobù = วิ่ง)
  items:
  - 我们
  - 周末
  - 也
  - 在
  - 伦披尼公园
  - 跑步
  hints:
  - ประธาน + เวลา + 也 + 在 + สถานที่ + กริยา
  - 也 วางหน้าส่วนที่เป็นกริยา (รวม 在 + สถานที่)
  solution: '**我们周末也在伦披尼公园跑步。** (伦披尼 Lúnpīní = ลุมพินี)'
