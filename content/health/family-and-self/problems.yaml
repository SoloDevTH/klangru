    choices:
      - { id: a, text: "บอกเพื่อนให้หยุดล้อ ปลอบใจเมฆ และถ้ายังล้อต่อให้บอกครู", correct: true }
      - { id: b, text: "หัวเราะตามเพื่อน เพราะเป็นแค่เรื่องเล่น ๆ", feedback: "การล้อเรื่องครอบครัวทำให้เพื่อนเจ็บใจ ไม่ใช่เรื่องเล่น" }
      - { id: c, text: "บอกเมฆว่าครอบครัวที่ไม่มีพ่ออยู่ด้วยไม่ใช่ครอบครัวจริง", feedback: "ครอบครัวพ่อหรือแม่เลี้ยงเดี่ยวก็เป็นครอบครัวจริง ความรักสำคัญกว่ารูปแบบ" }
      - { id: d, text: "ไม่ต้องทำอะไร เพราะไม่ใช่เรื่องของเรา", feedback: "การช่วยหยุดการล้อเลียนเป็นการเคารพความแตกต่างและช่วยเพื่อน" }
    hints:
      - "ครอบครัวแต่ละบ้านต่างกันทั้งรูปแบบและฐานะ"
      - "ถ้าแก้เองไม่ได้ ควรขอให้ใครช่วย"
    solution: "ความแตกต่างของครอบครัวไม่ใช่เรื่องน่าอาย ควรห้ามการล้อเลียน ให้กำลังใจเพื่อน และบอกครูถ้าการล้อยังเกิดขึ้น"
