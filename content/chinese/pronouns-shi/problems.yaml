problems:
- id: chinese.grammar.pronouns-shi.p001
  topics:
  - chinese.grammar.pronouns-shi
  difficulty: 1
  type: mcq
  stem: 我 (wǒ) แปลว่าอะไร
  choices:
  - id: a
    text: เขา
    feedback: เขาคือ 他 หรือ 她 tā
  - id: b
    text: พวกเรา
    feedback: พวกเราคือ 我们 wǒmen
  - id: c
    text: ฉัน ผม หนู (ผู้พูด)
    correct: true
    feedback: ถูก 我 ใช้แทนตัวผู้พูดได้ทุกเพศทุกวัย
  - id: d
    text: คุณ เธอ
    feedback: คุณคือ 你 nǐ
  hints:
  - เป็นคำแรกที่ใช้แนะนำตัวเอง เช่น 我是…
  - ภาษาไทยมีหลายคำ (ฉัน ผม หนู) แต่ภาษาจีนมีคำเดียว
  solution: 我 wǒ = **ฉัน ผม หนู** ใช้ได้ทั้งชายและหญิง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.pronouns-shi.p002
  topics:
  - chinese.grammar.pronouns-shi
  difficulty: 1
  type: match
  stem: จับคู่สรรพนามกับความหมาย
  pairs:
  - left: 我
    right: ฉัน ผม
  - left: 你
    right: คุณ เธอ
  - left: 他
    right: เขา (ผู้ชาย)
  - left: 她
    right: เขา (ผู้หญิง)
  - left: 我们
    right: พวกเรา
  hints:
  - 他 กับ 她 อ่านเหมือนกันว่า tā ดูส่วนทางซ้าย
  - 们 men ต่อท้ายทำให้เป็นพหูพจน์
  solution: 我 ฉัน · 你 คุณ · 他 เขา (ชาย มี 亻 คน) · 她 เขา (หญิง มี 女 ผู้หญิง) · 我们 พวกเรา
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.pronouns-shi.p003
  topics:
  - chinese.grammar.pronouns-shi
  difficulty: 1
  type: hanzi
  stem: เขียนอักษร 我 (wǒ) ที่แปลว่า ฉัน ตามลำดับขีด
  character: 我
  pinyin: wǒ
  meaning: ฉัน ผม
  hints:
  - 我 มี 7 ขีด เริ่มด้วย 撇 สั้นด้านบนซ้าย
  - 'ลำดับ: 撇 → 横 → 竖钩 → 提 → 斜钩 (ขีดยาวเฉียงลงขวาแล้วเกี่ยวขึ้น) → 撇 → 点'
  solution: 撇 → 横 → 竖钩 → 提 → 斜钩 → 撇 → 点 รวม 7 ขีด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.pronouns-shi.p004
  topics:
  - chinese.grammar.pronouns-shi
  difficulty: 2
  type: mcq
  stem: นิดพูดถึงคุณแม่ของเธอว่า "เขาเป็นครู" ต้องใช้คำว่า "เขา" ตัวใด
  choices:
  - id: a
    text: 你
    feedback: 你 แปลว่า คุณ ใช้กับคนที่เราคุยด้วย
  - id: b
    text: 她
    correct: true
    feedback: 'ถูก 她 มี 女 (ผู้หญิง) ใช้กับผู้หญิง: 她是老师'
  - id: c
    text: 他
    feedback: 他 มี 亻 (คน) ใช้กับผู้ชาย หรือเมื่อไม่ระบุเพศ
  - id: d
    text: 它
    feedback: 它 ใช้กับสัตว์หรือสิ่งของ
  hints:
  - 他 她 它 อ่านว่า tā เหมือนกัน ต่างกันที่การเขียน
  - ดูส่วนประกอบทางซ้ายของอักษร
  solution: 'คุณแม่เป็นผู้หญิง จึงใช้ **她** tā: 她是老师 (เขาเป็นครู)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.pronouns-shi.p005
  topics:
  - chinese.grammar.pronouns-shi
  difficulty: 2
  type: mcq
  stem: เราถือหนังสือของตัวเองอยู่ในมือ แล้วบอกเพื่อนว่า "นี่คือหนังสือของฉัน" ต้องพูดว่าอะไร
  choices:
  - id: a
    text: 这是书我的。
    feedback: 'เรียงแบบภาษาไทย ภาษาจีนต้องวางเจ้าของก่อน: 我的书'
  - id: b
    text: 这我的书。
    feedback: ขาดคำกริยา 是 ที่แปลว่า คือ
  - id: c
    text: 这是我的书。
    correct: true
    feedback: ถูก 这 zhè = นี่ (ใกล้) และ 我的书 = หนังสือของฉัน
  - id: d
    text: 那是我的书。
    feedback: 那 nà = นั่น โน่น ใช้กับสิ่งที่อยู่ห่างตัว
  hints:
  - ของอยู่ในมือ ใกล้ตัว ใช้คำว่า นี่ หรือ นั่น
  - ภาษาจีนวางเจ้าของไว้หน้าสิ่งของ
  solution: '**这是我的书。** Zhè shì wǒ de shū. (这 นี่ + 是 คือ + 我的书 หนังสือของฉัน)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.pronouns-shi.p006
  topics:
  - chinese.grammar.pronouns-shi
  difficulty: 2
  type: order
  stem: เรียงคำให้เป็นประโยค "เขาไม่ใช่ครู"
  items:
  - 他
  - 不
  - 是
  - 老师
  hints:
  - ประโยค 是 เรียงแบบ ประธาน + 是 + คำนาม เหมือนภาษาไทย
  - 不 (ไม่) วางหน้า 是 เหมือน ไม่ วางหน้า ใช่
  solution: '**他不是老师。** Tā bú shì lǎoshī. (เขา + ไม่ + ใช่ + ครู)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.pronouns-shi.p007
  topics:
  - chinese.grammar.pronouns-shi
  difficulty: 2
  type: text
  stem: 'เขียน "หนังสือของฉัน" เป็นภาษาจีน (พิมพ์อักษรจีน 3 ตัว: 我 ฉัน, 的 ของ, 书 หนังสือ)'
  accepted:
  - 我的书
  - 我的書
  misconceptions:
  - match: 书的我
    feedback: เรียงตามภาษาไทย ภาษาจีนวางเจ้าของไว้ก่อน แล้วตามด้วย 的 และสิ่งของ
  - match: 的我书
    feedback: 的 อยู่ระหว่างเจ้าของกับสิ่งของ ไม่ใช่หน้าสุด
  - match: 我书的
    feedback: 的 ต้องอยู่หน้าสิ่งของ ไม่ใช่ท้ายวลี
  hints:
  - ภาษาไทยเรียง สิ่งของ + ของ + เจ้าของ ภาษาจีนกลับกัน
  - รูปแบบคือ เจ้าของ + 的 + สิ่งของ
  solution: '**我的书** wǒ de shū (ฉัน + ของ + หนังสือ) ลำดับกลับกับภาษาไทย'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.pronouns-shi.p008
  topics:
  - chinese.grammar.pronouns-shi
  difficulty: 3
  type: mcq
  stem: เปลี่ยนประโยค 他是中国人 (เขาเป็นคนจีน) ให้เป็นประโยคปฏิเสธ
  choices:
  - id: a
    text: 他不中国人。
    feedback: ขาด 是 ประโยคบอกว่าใครเป็นอะไรต้องมี 是
  - id: b
    text: 他不是中国人。
    correct: true
    feedback: ถูก วาง 不 หน้า 是 อ่านว่า bú shì
  - id: c
    text: 他是不中国人。
    feedback: 不 ต้องอยู่หน้า 是 ไม่ใช่หลัง
  - id: d
    text: 他没是中国人。
    feedback: 是 ใช้ 不 ปฏิเสธ ไม่ใช้ 没
  hints:
  - 'ภาษาไทย: เขา ไม่ใช่ คนจีน'
  - คำปฏิเสธวางไว้หน้าคำกริยา
  solution: '**他不是中国人。** Tā bú shì Zhōngguó rén. (不 + 是 อ่าน bú shì)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.pronouns-shi.p009
  topics:
  - chinese.grammar.pronouns-shi
  difficulty: 3
  type: mcq
  stem: ไกด์ชาวไทยที่วัดอรุณฯ พูดกับนักท่องเที่ยวชาวจีนทั้งกลุ่มว่า "พวกคุณเป็นคนจีนใช่ไหม" คำว่า "พวกคุณ" คือคำใด
  choices:
  - id: a
    text: 他们 tāmen
    feedback: 他们 แปลว่า พวกเขา (คนที่ไม่ได้คุยด้วย)
  - id: b
    text: 您 nín
    feedback: 您 คือ คุณ แบบสุภาพ แต่หมายถึงคนเดียว
  - id: c
    text: 你们 nǐmen
    correct: true
    feedback: ถูก 你 + 们 = คุณหลายคน
  - id: d
    text: 我们 wǒmen
    feedback: 我们 แปลว่า พวกเรา
  hints:
  - ไกด์กำลังพูดกับคนหลายคนตรงหน้า
  - 们 ต่อท้ายสรรพนามทำให้หมายถึงหลายคน
  solution: '**你们** nǐmen = พวกคุณ: 你们是中国人吗？'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.pronouns-shi.p010
  topics:
  - chinese.grammar.pronouns-shi
  difficulty: 3
  type: mcq
  stem: นักเรียนไทยต้องการพูดว่า "ฉันยุ่ง" ข้อใดถูกต้อง (忙 máng = ยุ่ง)
  choices:
  - id: a
    text: 我是忙。
    feedback: 是 ใช้เชื่อมกับคำนาม (ฉันเป็นนักเรียน) ไม่ใช้กับคำคุณศัพท์ ภาษาไทยเองก็ไม่พูดว่า ฉันเป็นยุ่ง
  - id: b
    text: 我是很忙。
    feedback: ไม่ต้องใช้ 是 กับคำคุณศัพท์
  - id: c
    text: 忙我。
    feedback: ภาษาจีนวางประธานไว้หน้า
  - id: d
    text: 我很忙。
    correct: true
    feedback: ถูก ประโยคบอกลักษณะใช้ 很 แทน 是
  hints:
  - 忙 เป็นคำบอกลักษณะ ไม่ใช่คำนาม
  - ประโยคแบบนี้ใช้ 很 hěn วางหน้าคำบอกลักษณะ
  solution: '**我很忙。** Wǒ hěn máng. 是 ใช้กับคำนาม เช่น 我是学生 ส่วนคำบอกลักษณะใช้ 很'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.pronouns-shi.p011
  topics:
  - chinese.grammar.pronouns-shi
  difficulty: 3
  type: mcq
  stem: ข้อใดถูกต้องเกี่ยวกับ 我妈妈 และ 我的妈妈 (แม่ของฉัน)
  choices:
  - id: a
    text: ถูกทั้งสองแบบ แต่ภาษาพูดนิยม 我妈妈 เพราะเป็นคนใกล้ชิด
    correct: true
    feedback: ถูก คำเรียกญาติ คนสนิท และหน่วยงานของเรามักละ 的
  - id: b
    text: ถูกแบบเดียวคือ 我的妈妈
    feedback: 我妈妈 ก็ถูกและนิยมกว่าในภาษาพูด
  - id: c
    text: ถูกแบบเดียวคือ 我妈妈 ส่วน 我的妈妈 ผิด
    feedback: 我的妈妈 ไม่ผิด แต่ฟังเป็นทางการหรือเน้นกว่า
  - id: d
    text: ต้องเขียน 妈妈我
    feedback: เจ้าของต้องอยู่ก่อนเสมอ
  hints:
  - 的 แสดงความเป็นเจ้าของ แต่ไม่จำเป็นทุกครั้ง
  - นึกถึง 我们学校 (โรงเรียนของเรา)
  solution: ถูกทั้งคู่ คำเรียก **ญาติ คนสนิท หรือหน่วยงานของเรา** มักละ 的 เช่น 我妈妈, 我朋友, 我们学校 แต่สิ่งของทั่วไปต้องมี 的 เช่น 我的书
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.pronouns-shi.p012
  topics:
  - chinese.grammar.pronouns-shi
  difficulty: 3
  type: text
  stem: เขียน "นี่คือครูของพวกเรา" เป็นภาษาจีน (พิมพ์อักษรจีน; 老师 = ครู)
  accepted:
  - 这是我们老师
  - 这是我们的老师
  - 这是我们老师。
  - 这是我们的老师。
  misconceptions:
  - match: 这是老师我们
    feedback: 'เจ้าของต้องอยู่หน้าคำนาม: 我们(的)老师'
  - match: 这是我老师
    feedback: 我 คือ ฉัน คนเดียว พวกเราคือ 我们
  - match: 那是我们的老师
    feedback: 那 แปลว่า นั่น ส่วน นี่ คือ 这
  hints:
  - เริ่มด้วย 这是 (นี่คือ)
  - ของพวกเรา = 我们 + 的 (ละ 的 ได้เพราะเป็นคนใกล้ชิด)
  solution: '**这是我们(的)老师。** Zhè shì wǒmen (de) lǎoshī.'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.pronouns-shi.p013
  topics:
  - chinese.grammar.pronouns-shi
  difficulty: 4
  type: order
  stem: เรียงคำให้เป็นประโยค "นั่นคือโทรศัพท์มือถือของเขา" (手机 shǒujī = โทรศัพท์มือถือ)
  items:
  - 那
  - 是
  - 他
  - 的
  - 手机
  hints:
  - เริ่มด้วยคำชี้ นั่น แล้วตามด้วย คือ
  - ของเขา = 他的 วางหน้า 手机
  solution: '**那是他的手机。** Nà shì tā de shǒujī.'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.pronouns-shi.p014
  topics:
  - chinese.grammar.pronouns-shi
  difficulty: 4
  type: mcq
  stem: ที่จุดรับของหายในสนามบินสุวรรณภูมิ เจ้าหน้าที่ชี้กระเป๋าใบหนึ่งแล้วถามนักท่องเที่ยวชาวจีนว่า 这是你的包吗？ (นี่กระเป๋าของคุณใช่ไหม) ถ้าไม่ใช่ นักท่องเที่ยวควรตอบว่าอะไร
  choices:
  - id: a
    text: 是，这是我的。
    feedback: เป็นการตอบรับว่าใช่
  - id: b
    text: 不是，这不是你的。
    feedback: 你的 แปลว่า ของคุณ (ของเจ้าหน้าที่) ไม่ใช่ของฉัน
  - id: c
    text: 没，这没是我的。
    feedback: 是 ปฏิเสธด้วย 不 ไม่ใช่ 没
  - id: d
    text: 不是，这不是我的。
    correct: true
    feedback: ถูก 不是 = ไม่ใช่ และ 我的 ใช้แทน 我的包 ได้เมื่อรู้แล้วว่าพูดถึงอะไร
  hints:
  - คำตอบปฏิเสธของคำถาม 是…吗 ขึ้นต้นด้วย 不是
  - ของฉัน = 我的 ไม่ต้องพูด 包 ซ้ำ
  solution: '**不是，这不是我的。** Bú shì, zhè bú shì wǒ de. (เจ้าของ + 的 ใช้แทนคำนามที่รู้กันอยู่แล้วได้)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.pronouns-shi.p015
  topics:
  - chinese.grammar.pronouns-shi
  difficulty: 4
  type: match
  stem: จับคู่ประโยคภาษาจีนกับความหมาย
  pairs:
  - left: 这是我的。
    right: นี่เป็นของฉัน
  - left: 那是你的书。
    right: นั่นคือหนังสือของคุณ
  - left: 他不是老师。
    right: เขาไม่ใช่ครู
  - left: 我们是学生。
    right: พวกเราเป็นนักเรียน
  - left: 她是我妈妈。
    right: เขาเป็นแม่ของฉัน
  hints:
  - 这 = นี่, 那 = นั่น, 不是 = ไม่ใช่
  - 我的 ที่ไม่มีคำนามตามหลังแปลว่า ของฉัน
  solution: 这是我的 นี่เป็นของฉัน · 那是你的书 นั่นคือหนังสือของคุณ · 他不是老师 เขาไม่ใช่ครู · 我们是学生 พวกเราเป็นนักเรียน · 她是我妈妈 เขาเป็นแม่ของฉัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.pronouns-shi.p016
  topics:
  - chinese.grammar.pronouns-shi
  difficulty: 5
  type: mcq
  stem: ประโยคใด **ผิดไวยากรณ์** (เลือกทุกข้อที่ผิด)
  multiple: true
  choices:
  - id: a
    text: 这是书我的。
    correct: true
    feedback: 'ผิด เจ้าของต้องอยู่หน้า: 这是我的书'
  - id: b
    text: 他是很高。
    correct: true
