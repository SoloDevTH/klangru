    ai_assisted: true

  - id: computer.programming.oop.p015
    topics: [computer.programming.oop]
    difficulty: 5
    type: numeric
    stem: |
      โปรแกรมจัดทีมกีฬาสีนี้แสดงตัวเลขใด

      ```python
      class Team:
          members = []

          def __init__(self, name):
              self.name = name

          def add(self, person):
              self.members.append(person)

      red = Team("แดง")
      blue = Team("น้ำเงิน")
      red.add("ก้อง")
      red.add("ฝน")
      blue.add("ต้น")
      print(len(blue.members))
      ```
    answer: { value: 3, unit: "คน" }
    hints:
      - "members ประกาศไว้ที่ใด ใน __init__ หรือใต้ class โดยตรง"
      - "ตัวแปรที่ประกาศใต้ class โดยตรงเป็นของคลาส ทุกวัตถุใช้ร่วมกัน"
    misconceptions:
      - { match: 1, feedback: "คิดว่าแต่ละทีมมีลิสต์ของตัวเอง แต่ members อยู่ระดับคลาส ทุกทีมจึงใช้ลิสต์เดียวกัน" }
      - { match: 0, feedback: "blue.add(\"ต้น\") เพิ่มสมาชิกแล้ว และลิสต์นี้ยังมีสมาชิกที่ red เพิ่มด้วย" }
    solution: "members = [] อยู่ใต้ class จึงเป็นลิสต์เดียวที่ทุกวัตถุใช้ร่วมกัน ทั้งสามคนถูกเพิ่มเข้าลิสต์เดียวกัน len เป็น 3 วิธีแก้คือย้ายไปเป็น self.members = [] ใน __init__ แต่ละทีมจะมีลิสต์ของตัวเอง"
