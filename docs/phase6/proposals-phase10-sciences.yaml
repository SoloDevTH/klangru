  - id: chemistry.states.real-gases-phase-diagrams
    title: แก๊สจริง สมบัติของของเหลว ความดันไอ และแผนภาพเฟส
    difficulty: 6.5
    prereq: [chemistry.gases.gas-laws, physics.thermal.phase-change, chemistry.bonding.polarity-intermolecular, math.functions.logarithms]
    indicators:
      - university-foundations:CHEM 9.6
      - university-foundations:CHEM 10.2
      - university-foundations:CHEM 10.3
      - university-foundations:CHEM 10.4
      - university-foundations:UPHYS2 1.5
    scope: >-
      ตัวประกอบการอัดตัว Z = PV/nRT และสมการแวนเดอร์วาลส์กับความหมายของ a และ b สมบัติของของเหลวที่มาจากแรงระหว่างโมเลกุล ความหนืด
      ความตึงผิว และการซึมตามรูเล็ก สมดุลการระเหยกับการควบแน่น ความดันไอกับอุณหภูมิ จุดเดือดปกติ สมการเคลาซิอุส–คลาเปรอง
      กราฟการให้ความร้อนและความร้อนของการเปลี่ยนสถานะ แผนภาพเฟสของน้ำและคาร์บอนไดออกไซด์ จุดร่วมสาม จุดวิกฤต ของไหลวิกฤตยิ่งยวด
      การระเหิดของน้ำแข็งแห้ง และหม้อความดันกับการต้มน้ำบนยอดดอย
  # ลำดับ 2
  - id: chemistry.solutions.solution-process-colligative
    title: กระบวนการละลาย กฎของเฮนรี สมบัติคอลลิเกทีฟ และคอลลอยด์
    difficulty: 6.5
    prereq: [chemistry.solutions.concentration, chemistry.bonding.polarity-intermolecular, chemistry.states.real-gases-phase-diagrams]
    indicators:
      - university-foundations:CHEM 11.1
      - university-foundations:CHEM 11.3
      - university-foundations:CHEM 11.4
      - university-foundations:CHEM 11.5
    scope: >-
      การละลายเชิงโมเลกุล พลังงานของการแยกตัวละลาย แยกตัวทำละลาย และการเกิดแรงดึงดูดใหม่ เอนทัลปีของการละลาย (ถุงประคบร้อนเย็น)
      สารละลายอุดมคติ ของเหลวผสมเข้ากันได้และไม่ได้ กฎของเฮนรี C = kP กับน้ำอัดลมและโรคน้ำหนีบ สมบัติคอลลิเกทีฟ ความดันไอลดลงตามกฎของราอูลต์
      จุดเดือดสูงขึ้น จุดเยือกแข็งต่ำลง ความดันออสโมติก π = iMRT ตัวประกอบแวนต์ฮอฟฟ์ น้ำเกลือทางการแพทย์และการกรองน้ำแบบออสโมซิสผันกลับ
      คอลลอยด์ ชนิด (โซล เจล อิมัลชัน แอโรซอล) ปรากฏการณ์ทินดอลล์ และสบู่กับอิมัลซิไฟเออร์
  # ---------- เคมี: จลนศาสตร์ ----------
  # ลำดับ 1
  - id: chemistry.kinetics.rate-laws
    title: กฎอัตรา อันดับปฏิกิริยา และกฎอัตราแบบอินทิเกรต
    difficulty: 7
    prereq: [chemistry.kinetics.reaction-rates, math.functions.logarithms]
    indicators:
      - university-foundations:CHEM 12.3
      - university-foundations:CHEM 12.4
    scope: >-
      กฎอัตรา rate = k[A]^m[B]^n อันดับปฏิกิริยาหาได้จากการทดลองไม่ใช่จากสัมประสิทธิ์ หาอันดับและค่าคงที่อัตราด้วยวิธีอัตราเริ่มต้น หน่วยของ k
      กฎอัตราแบบอินทิเกรตอันดับศูนย์ หนึ่ง และสอง กราฟเส้นตรงที่ใช้ระบุอันดับ ([A], ln[A], 1/[A] กับเวลา) ครึ่งชีวิตของแต่ละอันดับ
      และตัวอย่างการสลายของยาในร่างกาย การสลายของ H₂O₂ และกัมมันตรังสีที่เป็นอันดับหนึ่ง
  # ลำดับ 2
  - id: chemistry.kinetics.arrhenius-mechanisms
    title: สมการของอาร์เรเนียส กลไกปฏิกิริยา และตัวเร่งปฏิกิริยา
    difficulty: 7.5
    prereq: [chemistry.kinetics.rate-laws]
    indicators:
