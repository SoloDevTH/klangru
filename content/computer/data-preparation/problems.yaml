  - id: computer.data.data-preparation.p014
    topics: [computer.data.data-preparation]
    difficulty: 4
    type: code
    stem: "เขียนฟังก์ชัน `clean_rows(text)` ที่รับข้อความ CSV มีหัวคอลัมน์ `id,name,score` แล้วคืนรายการดิกชันนารีตามลำดับแถวเดิม โดย id เป็นจำนวนเต็ม name ตัดช่องว่างหัวท้ายและทำให้ตัวอักษรแรกของแต่ละคำเป็นตัวพิมพ์ใหญ่ (ใช้ `.title()`) score เป็น float ข้ามแถวที่คะแนนว่าง และเก็บเฉพาะแถวแรกของ id ที่ซ้ำ"
    starter: |
      def clean_rows(text):
          pass
    tests: |
      sample = "id,name,score\n1, ana lee ,80\n2,BEN,\n1,Ana Lee,80\n3,chai,72.5\n"
      r = clean_rows(sample)
      expected = [{"id": 1, "name": "Ana Lee", "score": 80.0}, {"id": 3, "name": "Chai", "score": 72.5}]
      assert r == expected, f"ได้ {r} ควรได้ {expected} (ตรวจว่าตัดช่องว่าง ข้ามคะแนนว่าง และตัดแถว id ซ้ำ)"
      r2 = clean_rows("id,name,score\n5,  dao  ,\n")
      assert r2 == [], f"แถวเดียวที่คะแนนว่างต้องได้รายการว่าง แต่ได้ {r2}"
    reference: |
      import csv, io
      def clean_rows(text):
          seen = set()
          out = []
          for row in csv.DictReader(io.StringIO(text)):
              if row["score"].strip() == "":
                  continue
              uid = int(row["id"].strip())
              if uid in seen:
                  continue
              seen.add(uid)
              out.append({"id": uid, "name": row["name"].strip().title(), "score": float(row["score"])})
          return out
    hints:
      - "ตัดช่องว่างของชื่อและแปลงตัวพิมพ์ก่อนเก็บลงผล"
      - "ใช้เซตเก็บรหัสที่เคยเห็นแล้วเพื่อตรวจแถวซ้ำ"
      - "ตรวจคะแนนว่างก่อนเพิ่มรหัสลงเซต เพราะแถวที่คะแนนว่างไม่ควรกันแถวที่ซ้ำและมีคะแนนในภายหลัง"
    solution: "วนทีละแถว ข้ามแถวที่คะแนนว่าง แปลง id เป็น int และตรวจกับเซตของรหัสที่เคยเก็บแล้ว ชื่อถูกตัดช่องว่างและทำ title() คะแนนเป็น float"
    license: CC-BY-SA-4.0
    ai_assisted: true

