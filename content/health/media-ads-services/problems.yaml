  difficulty: 5
  type: mcq
  stem: อินฟลูเอนเซอร์ที่มีผู้ติดตามหลายแสนคนรีวิวน้ำชงลดน้ำหนักว่า "กินเองจริง ลด 8 กิโลในเดือนเดียว" พร้อมโค้ดส่วนลด ข้อใดวิเคราะห์ได้ครบที่สุด
  choices:
  - id: a
    text: อาจได้ค่าตอบแทนจากยอดขายผ่านโค้ด ผลของคนเดียวไม่ใช่หลักฐาน ภาพตกแต่งได้ การลดเร็วมากอาจอันตราย จึงควรตรวจเลข อย. และปรึกษาบุคลากรสุขภาพ
    correct: true
  - id: b
    text: เชื่อได้เพราะคนรีวิวมีผู้ติดตามมาก
    feedback: จำนวนผู้ติดตามไม่ได้ทำให้คำรีวิวเป็นหลักฐานทางสุขภาพ
  - id: c
    text: เชื่อได้เพราะผู้รีวิวบอกว่ากินเองจริง
    feedback: แม้กินจริง ผลของคนเดียวอาจเกิดจากปัจจัยอื่น และไม่ได้บอกความปลอดภัย
  hints:
  - คิดถึงผลประโยชน์ของผู้รีวิว
  - หลักฐานจากคนเดียวต่างจากการวิจัย
  solution: คำรีวิวที่มีโค้ดส่วนลดอาจมีผลประโยชน์แอบแฝง ผลของคนเดียวไม่ใช่หลักฐาน และการลดน้ำหนักเร็วมากเป็นสัญญาณเตือน ต้องตรวจเลข อย. และปรึกษาผู้เชี่ยวชาญ
