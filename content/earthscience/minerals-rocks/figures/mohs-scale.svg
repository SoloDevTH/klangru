<text x="426.7" y="118.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">ออร์โทเคลส</text>
<circle cx="500.0" cy="170" r="11" fill="#fff" stroke="#111" stroke-width="1.5"/>
