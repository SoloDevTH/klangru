  - id: c
    text: ปล่อยให้กลับไปด้วยกันเพราะเป็นเรื่องของคู่รัก
    feedback: ความรุนแรงในคู่รักไม่ใช่เรื่องส่วนตัว และคนเมาไม่ควรพาใครกลับบ้าน
  - id: d
    text: ถ่ายคลิปลงโซเชียลให้คนอื่นตัดสิน
    feedback: ทำให้เพื่อนอับอายและไม่ได้ช่วยให้ปลอดภัย
  hints:
  - ชั่งผลดีผลเสียต่อความปลอดภัยของเพื่อนและของเรา
  - แหล่งช่วยที่ใกล้ที่สุดคือผู้ใหญ่ในงาน
  solution: ทางเลือกที่ปลอดภัยที่สุดคือแยกเพื่อนออกมาอยู่กับคนอื่น ให้ผู้ใหญ่ช่วย และโทร 191 ถ้ามีอันตราย จากนั้นค่อยชวนเพื่อนคุยเรื่องสัญญาณเตือนในความสัมพันธ์และแหล่งช่วยเหลืออย่าง 1300
