    figure:
      src: voice-test.svg
      alt: "แผนภูมิแท่ง จำนวนประโยคที่ระบบเข้าใจถูกจาก 200 ประโยค ภาคกลาง 188 ภาคเหนือ 176 ภาคอีสาน 150 ภาคใต้ 162 ผู้สูงอายุ 130"
    answer: { value: 35, unit: "%" }
    hints:
      - "จำนวนที่เข้าใจผิด = 200 − จำนวนที่เข้าใจถูก"
      - "เปอร์เซ็นต์ = จำนวนที่เข้าใจผิด ÷ 200 × 100"
    misconceptions:
      - { match: 65, feedback: "65% คือสัดส่วนที่เข้าใจถูก โจทย์ถามสัดส่วนที่เข้าใจผิด" }
      - { match: 70, feedback: "70 คือจำนวนประโยคที่ผิด ยังไม่ได้แปลงเป็นเปอร์เซ็นต์ของ 200" }
    solution: "ผู้สูงอายุเข้าใจถูก 130 ประโยค ผิด 200 − 130 = 70 ประโยค = 70 ÷ 200 × 100 = 35% ขณะที่ภาคกลางผิดเพียง 12 ÷ 200 = 6% แสดงว่าระบบมีอคติ อาจเพราะข้อมูลเสียงที่ใช้ฝึกมีเสียงผู้สูงอายุน้อย"
