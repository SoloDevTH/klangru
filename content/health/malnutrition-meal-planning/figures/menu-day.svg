<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="sans-serif">
<title>รายการอาหาร 1 วันของภูมิ (ค่าสมมติสำหรับฝึก)</title>
<rect x="0" y="0" width="760" height="340" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="380.0" y="28.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">รายการอาหาร 1 วันของภูมิ อายุ 13 ปี (ค่าสมมติสำหรับฝึกคำนวณ)</text>
<rect x="15.0" y="55.0" width="730.0" height="34.0" rx="0" fill="#e8f6f3" stroke="#888" stroke-width="1.5"/>
<text x="20.0" y="77.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#111">มื้อ</text>
<text x="110.0" y="77.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#111">รายการอาหาร</text>
<text x="375.0" y="77.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#111">คาร์โบไฮเดรต (g)</text>
<text x="505.0" y="77.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#111">โปรตีน (g)</text>
<text x="595.0" y="77.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#111">ไขมัน (g)</text>
<text x="675.0" y="77.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#111">ราคา (บาท)</text>
<rect x="15.0" y="89.0" width="730.0" height="40.0" rx="0" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
<text x="20.0" y="114.0" font-size="13" text-anchor="start" fill="#111">เช้า</text>
<text x="110.0" y="114.0" font-size="13" text-anchor="start" fill="#111">ข้าวต้มหมูใส่ไข่</text>
<text x="405.0" y="114.0" font-size="13" text-anchor="middle" fill="#111">45</text>
<text x="535.0" y="114.0" font-size="13" text-anchor="middle" fill="#111">18</text>
<text x="625.0" y="114.0" font-size="13" text-anchor="middle" fill="#111">10</text>
<text x="705.0" y="114.0" font-size="13" text-anchor="middle" fill="#111">35</text>
<rect x="15.0" y="129.0" width="730.0" height="40.0" rx="0" fill="#f8f9f9" stroke="#ccc" stroke-width="1.5"/>
<text x="20.0" y="154.0" font-size="13" text-anchor="start" fill="#111">กลางวัน</text>
<text x="110.0" y="154.0" font-size="13" text-anchor="start" fill="#111">ข้าวกะเพราไก่ไข่ดาว</text>
<text x="405.0" y="154.0" font-size="13" text-anchor="middle" fill="#111">80</text>
<text x="535.0" y="154.0" font-size="13" text-anchor="middle" fill="#111">30</text>
<text x="625.0" y="154.0" font-size="13" text-anchor="middle" fill="#111">25</text>
<text x="705.0" y="154.0" font-size="13" text-anchor="middle" fill="#111">45</text>
<rect x="15.0" y="169.0" width="730.0" height="40.0" rx="0" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
<text x="20.0" y="194.0" font-size="13" text-anchor="start" fill="#111">ว่าง</text>
<text x="110.0" y="194.0" font-size="13" text-anchor="start" fill="#111">นมจืด 1 กล่อง</text>
<text x="405.0" y="194.0" font-size="13" text-anchor="middle" fill="#111">12</text>
<text x="535.0" y="194.0" font-size="13" text-anchor="middle" fill="#111">8</text>
<text x="625.0" y="194.0" font-size="13" text-anchor="middle" fill="#111">8</text>
<text x="705.0" y="194.0" font-size="13" text-anchor="middle" fill="#111">12</text>
<rect x="15.0" y="209.0" width="730.0" height="40.0" rx="0" fill="#f8f9f9" stroke="#ccc" stroke-width="1.5"/>
<text x="20.0" y="234.0" font-size="13" text-anchor="start" fill="#111">เย็น</text>
<text x="110.0" y="234.0" font-size="13" text-anchor="start" fill="#111">ข้าวสวย แกงจืดเต้าหู้ ผัดผัก ปลาทู</text>
<text x="405.0" y="234.0" font-size="13" text-anchor="middle" fill="#111">85</text>
<text x="535.0" y="234.0" font-size="13" text-anchor="middle" fill="#111">30</text>
<text x="625.0" y="234.0" font-size="13" text-anchor="middle" fill="#111">15</text>
<text x="705.0" y="234.0" font-size="13" text-anchor="middle" fill="#111">40</text>
<text x="20.0" y="265.0" font-size="12.5" text-anchor="start" fill="#333">พลังงาน: คาร์โบไฮเดรตและโปรตีน 4 kcal/g  ไขมัน 9 kcal/g</text>
<text x="20.0" y="290.0" font-size="12.5" text-anchor="start" fill="#333">ภูมิเป็นเด็กอายุ 6–13 ปี จึงใช้ธงโภชนาการระดับ 1,600 กิโลแคลอรีต่อวัน</text>
<text x="20.0" y="315.0" font-size="11" text-anchor="start" fill="#777">ตัวเลขเป็นค่าสมมติเพื่อฝึกคำนวณ ไม่ใช่ค่าวิเคราะห์จริงของอาหาร</text>
</svg>
