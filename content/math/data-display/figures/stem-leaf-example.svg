<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 252" width="420" height="252" font-family="sans-serif" font-size="16">
  <title>แผนภาพต้นใบตัวอย่าง</title>
  <text x="60" y="28" text-anchor="start" fill="#15211e" font-size="15" font-weight="bold">จำนวนวันที่ฝนตกในแต่ละเดือน (ข้อมูลสมมติ)</text>
  <text x="90" y="52" text-anchor="middle" fill="#6b7672" font-size="13" >ต้น</text>
  <text x="150" y="52" text-anchor="start" fill="#6b7672" font-size="13" >ใบ</text>
  <text x="90" y="82" text-anchor="middle" fill="#b4521f" font-size="18" font-weight="bold">1</text>
  <text x="150" y="82" text-anchor="start" fill="#15211e" font-size="18" xml:space="preserve">5   8</text>
  <text x="90" y="116" text-anchor="middle" fill="#b4521f" font-size="18" font-weight="bold">2</text>
  <text x="150" y="116" text-anchor="start" fill="#15211e" font-size="18" xml:space="preserve">0   3   3   7   9</text>
  <text x="90" y="150" text-anchor="middle" fill="#b4521f" font-size="18" font-weight="bold">3</text>
  <text x="150" y="150" text-anchor="start" fill="#15211e" font-size="18" xml:space="preserve">1   2   6</text>
  <text x="90" y="184" text-anchor="middle" fill="#b4521f" font-size="18" font-weight="bold">4</text>
  <text x="150" y="184" text-anchor="start" fill="#15211e" font-size="18" xml:space="preserve">4</text>
  <line x1="120" y1="60" x2="120" y2="202" stroke="#15211e" stroke-width="2" />
  <text x="60" y="236" text-anchor="start" fill="#6b7672" font-size="13" >หมายเหตุ: 2 | 7 หมายถึง 27 วัน</text>
</svg>
