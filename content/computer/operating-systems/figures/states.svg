<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="sans-serif" font-size="14">
  <title>แผนภาพสถานะของกระบวนการ ใหม่ ไปพร้อม ไปกำลังทำงาน ไปสิ้นสุด กำลังทำงานกลับไปพร้อมเมื่อหมดเวลา และไปรอเมื่อรอข้อมูล แล้วจากรอกลับไปพร้อม</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="860" height="330" fill="#ffffff"/>
