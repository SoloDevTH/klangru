- id: math.calculus.convergence-tests.p016
  topics:
  - math.calculus.convergence-tests
  difficulty: 4
  type: match
  stem: 'จับคู่อนุกรมกับการทดสอบที่เหมาะที่สุดเป็นวิธีแรก'
  pairs:
  - left: '$\displaystyle\sum_{n=1}^{\infty}\frac{2n^2+1}{n^3+4}$'
    right: เปรียบเทียบลิมิตกับ $\sum \frac{1}{n}$
  - left: '$\displaystyle\sum_{n=1}^{\infty}\frac{(-1)^n}{n+5}$'
    right: การทดสอบของไลบ์นิซ
  - left: '$\displaystyle\sum_{n=1}^{\infty}\left(\frac{n}{2n+3}\right)^n$'
    right: การทดสอบราก
  - left: '$\displaystyle\sum_{n=1}^{\infty}\frac{5^n}{n!}$'
    right: การทดสอบอัตราส่วน
  hints:
  - ดูว่าพจน์มีเครื่องหมายสลับหรือไม่ มีกำลัง $n$ หรือแฟกทอเรียลหรือไม่
  - พจน์ที่ยกกำลัง $n$ ทั้งก้อนเหมาะกับการทดสอบราก
  solution: อนุกรมแรกเปรียบเทียบลิมิตกับ $\sum\frac{1}{n}$ ได้ค่าจำกัดบวก อนุกรมที่สองสลับเครื่องหมายจึงใช้ไลบ์นิซ อนุกรมที่สามเป็นกำลัง $n$ ทั้งก้อนจึงใช้การทดสอบราก อนุกรมสุดท้ายมีแฟกทอเรียลจึงใช้การทดสอบอัตราส่วน
