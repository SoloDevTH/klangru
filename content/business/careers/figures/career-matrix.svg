<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="680" height="240" font-family="sans-serif" font-size="14">
  <title>ตารางให้คะแนนสามอาชีพตามเกณฑ์สี่ข้อพร้อมน้ำหนัก</title>
  <rect x="0" y="0" width="680" height="240" fill="#ffffff"/>
  <text x="340.0" y="24.0" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="bold">คะแนนที่โอ๊ตให้แต่ละอาชีพ (1 = น้อย, 5 = มาก)</text>
