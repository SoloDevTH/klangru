problems:
  - id: chemistry.redox.redox-reactions.p001
    topics: [chemistry.redox.redox-reactions]
    difficulty: 1
    type: mcq
    stem: "เมื่อเผาแมกนีเซียมในอากาศได้แมกนีเซียมออกไซด์ $\\mathrm{2Mg + O_2 \\to 2MgO}$ แมกนีเซียมเกิดการเปลี่ยนแปลงแบบใด"
    choices:
      - { id: a, text: "ถูกออกซิไดซ์ เพราะรับออกซิเจน", correct: true, feedback: "ถูก การรับออกซิเจนคือออกซิเดชัน (Mg เสียอิเล็กตรอนกลายเป็น $\\mathrm{Mg^{2+}}$)" }
      - { id: b, text: "ถูกรีดิวซ์ เพราะรับออกซิเจน", feedback: "การรับออกซิเจนคือออกซิเดชัน การเสียออกซิเจนต่างหากที่เป็นรีดักชัน" }
      - { id: c, text: "ไม่เปลี่ยนแปลง เพราะเป็นเพียงการเผา", feedback: "การเผาไหม้เป็นปฏิกิริยารีดอกซ์ที่เกิดสารใหม่" }
    hints:
      - "แมกนีเซียมรับหรือเสียออกซิเจน"
      - "รับออกซิเจน = ออกซิเดชัน"
    solution: "Mg รวมกับออกซิเจน จึง **ถูกออกซิไดซ์** (เลขออกซิเดชันเพิ่มจาก 0 เป็น +2)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.redox.redox-reactions.p002
    topics: [chemistry.redox.redox-reactions]
    difficulty: 2
    type: numeric
    stem: "เลขออกซิเดชันของ S ใน $\\mathrm{H_2SO_4}$ เป็นเท่าใด (ถ้าเป็นบวก ไม่ต้องใส่เครื่องหมาย +)"
    answer: { value: 6 }
    misconceptions:
      - { match: 8, feedback: "ลืมนับ H 2 อะตอม (+2) ผลรวมของสารประกอบต้องเป็นศูนย์" }
      - { match: -2, feedback: "−2 เป็นเลขออกซิเดชันของ S ในซัลไฟด์ แต่ใน $\\mathrm{H_2SO_4}$ ต้องคำนวณจากผลรวม" }
    hints:
      - "H = +1 และ O = −2"
      - "$2(+1) + x + 4(-2) = 0$"
    solution: "$2(+1) + x + 4(-2) = 0$ ได้ $x =$ **+6**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.redox.redox-reactions.p003
    topics: [chemistry.redox.redox-reactions]
    difficulty: 2
    type: numeric
    stem: "ด่างทับทิม ($\\mathrm{KMnO_4}$) ใช้ล้างผักและฆ่าเชื้อ เลขออกซิเดชันของ Mn ในสารนี้เป็นเท่าใด"
    answer: { value: 7 }
    misconceptions:
      - { match: 8, feedback: "ลืมนับ K (+1) ผลรวมต้องเป็นศูนย์" }
      - { match: 2, feedback: "+2 คือ Mn ใน $\\mathrm{Mn^{2+}}$ หลังถูกรีดิวซ์ ไม่ใช่ใน $\\mathrm{KMnO_4}$" }
    hints:
      - "K เป็นธาตุหมู่ 1 เลขออกซิเดชัน +1"
      - "$(+1) + x + 4(-2) = 0$"
    solution: "$+1 + x - 8 = 0$ ได้ $x =$ **+7** ซึ่งเป็นเลขออกซิเดชันสูงสุดของ Mn จึงเป็นตัวออกซิไดส์ที่แรง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.redox.redox-reactions.p004
    topics: [chemistry.redox.redox-reactions]
    difficulty: 3
    type: numeric
    stem: "เลขออกซิเดชันของ Cr ในไอออนไดโครเมต $\\mathrm{Cr_2O_7^{2-}}$ เป็นเท่าใด"
    answer: { value: 6 }
    misconceptions:
      - { match: 7, feedback: "ตั้งผลรวมเป็นศูนย์ แต่ไอออนนี้มีประจุ −2 ผลรวมต้องเป็น −2" }
      - { match: 12, feedback: "12 คือผลรวมของ Cr ทั้ง 2 อะตอม ต้องหารด้วย 2" }
    hints:
      - "ผลรวมเลขออกซิเดชันในไอออนเท่ากับประจุของไอออน"
      - "$2x + 7(-2) = -2$"
    solution: "$2x - 14 = -2$ ได้ $2x = 12$ และ $x =$ **+6**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.redox.redox-reactions.p005
    topics: [chemistry.redox.redox-reactions]
    difficulty: 3
    type: mcq
    stem: "ปฏิกิริยาใดเป็นปฏิกิริยารีดอกซ์"
    choices:
      - { id: a, text: "$\\mathrm{Zn + CuSO_4 \\to ZnSO_4 + Cu}$", correct: true, feedback: "ถูก Zn เปลี่ยนจาก 0 เป็น +2 และ Cu จาก +2 เป็น 0" }
      - { id: b, text: "$\\mathrm{HCl + NaOH \\to NaCl + H_2O}$", feedback: "ทุกธาตุมีเลขออกซิเดชันเท่าเดิม (H +1, Cl −1, Na +1, O −2) เป็นปฏิกิริยาสะเทิน" }
      - { id: c, text: "$\\mathrm{AgNO_3 + NaCl \\to AgCl + NaNO_3}$", feedback: "ไอออนเพียงสลับคู่กันเป็นตะกอน เลขออกซิเดชันไม่เปลี่ยน" }
      - { id: d, text: "$\\mathrm{CaCO_3 \\to CaO + CO_2}$", feedback: "Ca +2, C +4, O −2 ทั้งก่อนและหลัง ไม่ใช่รีดอกซ์" }
    hints:
      - "หาเลขออกซิเดชันของแต่ละธาตุก่อนและหลัง"
      - "ปฏิกิริยาที่มีธาตุอิสระเกิดขึ้นหรือหายไปมักเป็นรีดอกซ์"
    solution: "ข้อ ก มี Zn ถูกออกซิไดซ์ (0 → +2) และ $\\mathrm{Cu^{2+}}$ ถูกรีดิวซ์ (+2 → 0) จึงเป็น **รีดอกซ์** ข้ออื่นเลขออกซิเดชันไม่เปลี่ยน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.redox.redox-reactions.p006
    topics: [chemistry.redox.redox-reactions]
    difficulty: 3
    type: mcq
    stem: "การถลุงทองแดงแบบโบราณ $\\mathrm{2CuO + C \\to 2Cu + CO_2}$ สารใดเป็นตัวรีดิวซ์"
    choices:
      - { id: a, text: "C", correct: true, feedback: "ถูก C ดึงออกซิเจนจาก CuO และเลขออกซิเดชันเพิ่มจาก 0 เป็น +4 จึงถูกออกซิไดซ์ และเป็นตัวรีดิวซ์" }
      - { id: b, text: "CuO", feedback: "CuO เสียออกซิเจน (ถูกรีดิวซ์) จึงเป็นตัวออกซิไดส์" }
      - { id: c, text: "Cu", feedback: "Cu เป็นผลิตภัณฑ์ ไม่ได้ทำหน้าที่รีดิวซ์สารอื่น" }
      - { id: d, text: "$\\mathrm{CO_2}$", feedback: "$\\mathrm{CO_2}$ เป็นผลิตภัณฑ์ที่เกิดจากตัวรีดิวซ์ถูกออกซิไดซ์" }
    hints:
      - "สารใดรับออกซิเจน (ถูกออกซิไดซ์)"
      - "สารที่ถูกออกซิไดซ์คือตัวรีดิวซ์"
    solution: "C ถูกออกซิไดซ์ (0 → +4) จึงเป็น **ตัวรีดิวซ์** ส่วน Cu ใน CuO ถูกรีดิวซ์ (+2 → 0)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.redox.redox-reactions.p007
    topics: [chemistry.redox.redox-reactions]
    difficulty: 3
    type: mcq
    stem: "ครึ่งปฏิกิริยาออกซิเดชันของ $\\mathrm{Zn(s) + Cu^{2+}(aq) \\to Zn^{2+}(aq) + Cu(s)}$ คือข้อใด"
    choices:
      - { id: a, text: "$\\mathrm{Zn \\to Zn^{2+} + 2e^-}$", correct: true, feedback: "ถูก Zn เสียอิเล็กตรอน 2 ตัว" }
      - { id: b, text: "$\\mathrm{Cu^{2+} + 2e^- \\to Cu}$", feedback: "นี่คือครึ่งปฏิกิริยารีดักชัน (รับอิเล็กตรอน)" }
      - { id: c, text: "$\\mathrm{Zn + 2e^- \\to Zn^{2+}}$", feedback: "รับอิเล็กตรอนแล้วประจุจะลดลง ไม่ใช่กลายเป็น +2 และประจุสองข้างไม่ดุล" }
      - { id: d, text: "$\\mathrm{Cu \\to Cu^{2+} + 2e^-}$", feedback: "ในปฏิกิริยานี้ Cu เป็นผลิตภัณฑ์ ไม่ได้ถูกออกซิไดซ์" }
    hints:
      - "ออกซิเดชันคือการเสียอิเล็กตรอน"
      - "อิเล็กตรอนจึงอยู่ฝั่งผลิตภัณฑ์"
    solution: "Zn เสียอิเล็กตรอน: $\\mathrm{Zn \\to Zn^{2+} + 2e^-}$ ประจุสองข้างเป็นศูนย์เท่ากัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.redox.redox-reactions.p008
    topics: [chemistry.redox.redox-reactions]
    difficulty: 4
    type: order
    stem: "นักเรียนจุ่มโลหะ X, Y, Z ลงในสารละลายไอออนของโลหะอื่น ได้ผลดังตาราง เรียงโลหะตามความสามารถในการเป็นตัวรีดิวซ์จาก **มากที่สุด** ไป **น้อยที่สุด**"
    figure:
      src: p-displacement-table.svg
      alt: "ตาราง 3 แถว 3 คอลัมน์ แถวคือโลหะ X, Y, Z คอลัมน์คือสารละลาย X²⁺, Y²⁺, Z²⁺ ผล: โลหะ X ในสารละลาย Y²⁺ มีโลหะเกาะ ในสารละลาย Z²⁺ มีโลหะเกาะ · โลหะ Y ในสารละลาย X²⁺ ไม่เปลี่ยนแปลง ในสารละลาย Z²⁺ มีโลหะเกาะ · โลหะ Z ในสารละลาย X²⁺ และ Y²⁺ ไม่เปลี่ยนแปลง"
    items:
      - "X"
      - "Y"
      - "Z"
    hints:
      - "มีโลหะเกาะ แปลว่าโลหะที่จุ่มให้อิเล็กตรอนแก่ไอออนในสารละลายได้"
      - "นับว่าแต่ละโลหะแทนที่ไอออนอื่นได้กี่ชนิด"
    solution: "X แทนที่ได้ทั้ง Y²⁺ และ Z²⁺ · Y แทนที่ได้เฉพาะ Z²⁺ · Z แทนที่ไม่ได้เลย ลำดับตัวรีดิวซ์: **X > Y > Z**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.redox.redox-reactions.p009
    topics: [chemistry.redox.redox-reactions]
    difficulty: 3
    type: mcq
    stem: "ครูสาธิต \"ต้นไม้เงิน\" โดยแขวนลวดทองแดงในสารละลายซิลเวอร์ไนเตรต ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "มีผลึกเงินเกาะลวด สารละลายค่อย ๆ เป็นสีฟ้า เพราะ Cu เป็นตัวรีดิวซ์ที่แรงกว่า Ag", correct: true, feedback: "ถูก $\\mathrm{Cu + 2Ag^+ \\to Cu^{2+} + 2Ag}$ ไอออน $\\mathrm{Cu^{2+}}$ ทำให้สารละลายเป็นสีฟ้า" }
      - { id: b, text: "ไม่เกิดปฏิกิริยา เพราะทองแดงไม่ทำปฏิกิริยากับกรด", feedback: "ซิลเวอร์ไนเตรตไม่ใช่กรด ทองแดงอยู่เหนือเงินในอนุกรม จึงแทนที่ไอออนเงินได้" }
      - { id: c, text: "ทองแดงเกาะบนผิวเงิน", feedback: "ไม่มีโลหะเงินในตอนเริ่ม ไอออนเงินต่างหากที่ถูกรีดิวซ์เป็นโลหะ" }
    hints:
      - "เทียบตำแหน่งของ Cu และ Ag ในอนุกรมความว่องไว"
      - "โลหะที่อยู่สูงกว่าแทนที่ไอออนของโลหะที่อยู่ต่ำกว่า"
    solution: "Cu อยู่สูงกว่า Ag จึงให้อิเล็กตรอนแก่ $\\mathrm{Ag^+}$ ได้ **เงินเกาะลวด** และสารละลายมี $\\mathrm{Cu^{2+}}$ สีฟ้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.redox.redox-reactions.p010
    topics: [chemistry.redox.redox-reactions]
    difficulty: 3
    type: mcq
    stem: "โรงถลุงแร่ดีบุกที่ภูเก็ตเผาแร่แคสซิเทอไรต์ ($\\mathrm{SnO_2}$) กับถ่านโค้ก $\\mathrm{SnO_2 + C \\to Sn + CO_2}$ ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "$\\mathrm{SnO_2}$ ถูกรีดิวซ์ เพราะ Sn เปลี่ยนจาก +4 เป็น 0", correct: true, feedback: "ถูก แร่เสียออกซิเจนและเลขออกซิเดชันลดลง" }
      - { id: b, text: "$\\mathrm{SnO_2}$ ถูกออกซิไดซ์ เพราะมีออกซิเจนอยู่", feedback: "การมีออกซิเจนในสูตรไม่ได้แปลว่าถูกออกซิไดซ์ ต้องดูการเปลี่ยนแปลง ซึ่ง $\\mathrm{SnO_2}$ เสียออกซิเจน" }
      - { id: c, text: "C เป็นตัวออกซิไดส์", feedback: "C รับออกซิเจน (0 → +4) จึงถูกออกซิไดซ์ และเป็นตัวรีดิวซ์" }
    hints:
      - "หาเลขออกซิเดชันของ Sn ใน $\\mathrm{SnO_2}$"
      - "เลขออกซิเดชันลดลงคือรีดักชัน"
    solution: "Sn: $x + 2(-2) = 0$ ได้ +4 แล้วกลายเป็น 0 **$\\mathrm{SnO_2}$ ถูกรีดิวซ์** ส่วนคาร์บอนเป็นตัวรีดิวซ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.redox.redox-reactions.p011
    topics: [chemistry.redox.redox-reactions]
    difficulty: 4
    type: numeric
    stem: "ดุลสมการ $\\mathrm{MnO_4^- + Fe^{2+} + H^+ \\to Mn^{2+} + Fe^{3+} + H_2O}$ ด้วยจำนวนเต็มน้อยที่สุด สัมประสิทธิ์ของ $\\mathrm{Fe^{2+}}$ เป็นเท่าใด"
    answer: { value: 5 }
    misconceptions:
      - { match: 1, feedback: "ดุลอะตอม Fe ได้แล้ว แต่ประจุยังไม่ดุล Mn รับอิเล็กตรอน 5 ตัว ต้องใช้ $\\mathrm{Fe^{2+}}$ 5 ไอออนให้อิเล็กตรอน" }
      - { match: 7, feedback: "+7 คือเลขออกซิเดชันของ Mn ไม่ใช่จำนวนอิเล็กตรอนที่รับ ซึ่งคือ $7 - 2 = 5$" }
    hints:
      - "Mn เปลี่ยนจาก +7 เป็น +2 รับอิเล็กตรอนกี่ตัว"
      - "Fe เปลี่ยนจาก +2 เป็น +3 เสียอิเล็กตรอน 1 ตัว ทำให้จำนวนอิเล็กตรอนเท่ากัน"
    solution: "Mn รับ 5e⁻ Fe เสีย 1e⁻ ต้องใช้ $\\mathrm{Fe^{2+}}$ **5** ไอออน: $\\mathrm{MnO_4^- + 5Fe^{2+} + 8H^+ \\to Mn^{2+} + 5Fe^{3+} + 4H_2O}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.redox.redox-reactions.p012
    topics: [chemistry.redox.redox-reactions]
    difficulty: 5
    type: numeric
    stem: "ทองแดงละลายในกรดไนตริกเจือจาง $\\mathrm{Cu + HNO_3 \\to Cu(NO_3)_2 + NO + H_2O}$ ดุลสมการด้วยวิธีเลขออกซิเดชันโดยใช้จำนวนเต็มน้อยที่สุด สัมประสิทธิ์ของ $\\mathrm{HNO_3}$ เป็นเท่าใด"
    answer: { value: 8 }
    misconceptions:
      - { match: 2, feedback: "2 คือจำนวน $\\mathrm{HNO_3}$ ที่ถูกรีดิวซ์เป็น NO แต่ต้องใช้อีก 6 โมเลกุลเป็นไอออน $\\mathrm{NO_3^-}$ ใน $\\mathrm{Cu(NO_3)_2}$" }
      - { match: 4, feedback: "ตรวจ O และ H อีกครั้ง $\\mathrm{3Cu(NO_3)_2}$ มี N 6 อะตอม และ NO อีก 2 อะตอม รวม N 8 อะตอม" }
    hints:
      - "Cu: 0 → +2 (เสีย 2) · N: +5 → +2 (รับ 3) ทำให้เท่ากันได้ Cu 3 อะตอม และ N ที่เปลี่ยน 2 อะตอม"
      - "นับ N ทั้งหมดทางขวา ทั้งใน $\\mathrm{3Cu(NO_3)_2}$ และใน NO"
    solution: "ใช้ Cu 3 อะตอม (เสีย 6e⁻) และ N 2 อะตอมเป็น NO (รับ 6e⁻) ทางขวามี N $= 3 \\times 2 + 2 = 8$ จึงใช้ $\\mathrm{HNO_3}$ **8** โมเลกุล ดุล H ด้วย $\\mathrm{4H_2O}$: $\\mathrm{3Cu + 8HNO_3 \\to 3Cu(NO_3)_2 + 2NO + 4H_2O}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.redox.redox-reactions.p013
    topics: [chemistry.redox.redox-reactions]
    difficulty: 5
    type: numeric
    stem: "ดุลสมการ $\\mathrm{Cr_2O_7^{2-} + Fe^{2+} \\to Cr^{3+} + Fe^{3+}}$ ในสารละลายกรดด้วยวิธีครึ่งปฏิกิริยา โดยใช้จำนวนเต็มน้อยที่สุด สัมประสิทธิ์ของ $\\mathrm{H^+}$ เป็นเท่าใด"
    answer: { value: 14 }
    misconceptions:
