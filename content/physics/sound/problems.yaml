problems:
  - id: phy.snd.p001
    topics: [physics.waves.sound]
    difficulty: 1
    type: mcq
    stem: "นักบินอวกาศสองคนลอยอยู่นอกยานอวกาศห่างกันไม่กี่เมตร ถ้าไม่ใช้วิทยุ ทั้งสองคุยกันด้วยเสียงไม่ได้ เพราะเหตุใด"
    choices:
      - { id: a, text: "อวกาศเป็นสุญญากาศ ไม่มีตัวกลางให้คลื่นเสียงเดินทาง", correct: true }
      - { id: b, text: "ในอวกาศเย็นมาก เสียงจึงเดินทางช้าจนไปไม่ถึง", feedback: "อุณหภูมิมีผลต่ออัตราเร็วเสียงในอากาศก็จริง แต่ปัญหาในอวกาศคือไม่มีอากาศหรือตัวกลางใดเลย เสียงจึงเดินทางไม่ได้แม้แต่ช้า ๆ" }
      - { id: c, text: "ในอวกาศไม่มีแรงโน้มถ่วง เสียงจึงตกลงไม่ถึงหู", feedback: "เสียงไม่ได้ต้องอาศัยแรงโน้มถ่วง เสียงเป็นการสั่นของอนุภาคในตัวกลางที่ส่งต่อกันไป สิ่งที่ขาดในอวกาศคือตัวกลาง" }
      - { id: d, text: "เสียงในอวกาศมีความถี่สูงเกินกว่าหูจะได้ยิน", feedback: "ความถี่ของเสียงขึ้นกับแหล่งกำเนิด ไม่ได้เปลี่ยนเพราะอยู่ในอวกาศ ปัญหาคือไม่มีตัวกลางให้เสียงเดินทาง" }
    hints:
      - "เสียงเป็นคลื่นชนิดใด ต้องอาศัยอะไรในการเดินทาง"
      - "คลื่นเสียงเกิดจากอนุภาคของตัวกลางอัดและขยายต่อกันไป ในอวกาศมีอนุภาคเหล่านั้นหรือไม่"
    solution: "เสียงเป็นคลื่นกลตามยาว เกิดจากอนุภาคของตัวกลางอัดและขยายส่งต่อกันไป อวกาศเป็นสุญญากาศเกือบสมบูรณ์ ไม่มีตัวกลาง เสียงจึงเดินทางไม่ได้ (แต่คลื่นวิทยุเป็นคลื่นแม่เหล็กไฟฟ้า เดินทางในสุญญากาศได้)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.snd.p002
    topics: [physics.waves.sound]
    difficulty: 1
    type: numeric
    stem: "ช่วงหน้าฝน นักเรียนเห็นฟ้าแลบแล้วได้ยินเสียงฟ้าร้องตามมาอีก $3\\ \\mathrm{s}$ ถ้าเสียงเดินทางในอากาศด้วยอัตราเร็ว $340\\ \\mathrm{m/s}$ ฟ้าแลบอยู่ห่างจากนักเรียนกี่เมตร (ถือว่าแสงมาถึงทันที ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 1020, unit: m }
    hints:
      - "แสงมาถึงแทบทันที เวลา $3\\ \\mathrm{s}$ จึงเป็นเวลาที่เสียงใช้เดินทางจากฟ้าแลบมาถึงหู"
      - "เสียงเดินทาง **ทางเดียว** ใช้ ระยะทาง = อัตราเร็ว × เวลา"
    misconceptions:
      - { match: 510, feedback: "ดูเหมือนหารด้วย 2 เหมือนโจทย์เสียงสะท้อน แต่เสียงฟ้าร้องเดินทางจากฟ้าแลบมาถึงหูทางเดียว ไม่ได้ไปและกลับ" }
      - { match: 113.3, feedback: "ดูเหมือนนำอัตราเร็วหารด้วยเวลา ระยะทางต้องเป็นอัตราเร็ว **คูณ** เวลา" }
    solution: "$d = vt = (340\\ \\mathrm{m/s})(3\\ \\mathrm{s}) = 1020\\ \\mathrm{m}$ ประมาณ $1\\ \\mathrm{km}$ (จำง่าย ๆ ว่าเสียงเดินทางราว $1\\ \\mathrm{km}$ ทุก $3\\ \\mathrm{s}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.snd.p003
    topics: [physics.waves.sound]
    difficulty: 2
    type: numeric
    stem: "วันหนึ่งในฤดูร้อนที่กรุงเทพฯ อุณหภูมิอากาศ $32\\ ^\\circ\\mathrm{C}$ อัตราเร็วเสียงในอากาศเป็นเท่าใด ใช้ $v = 331 + 0.6T$ (ตอบเป็นตัวเลขในหน่วย m/s ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 350.2, tolerance: 0.5, unit: m/s }
    hints:
      - "แทน $T = 32$ ในสูตร โดย $T$ เป็นองศาเซลเซียส"
      - "คูณ $0.6$ กับอุณหภูมิก่อน แล้วจึงบวกกับ $331$"
    misconceptions:
      - { match: 363, feedback: "ดูเหมือนลืมคูณ $0.6$ อุณหภูมิเพิ่ม $1\\ ^\\circ\\mathrm{C}$ อัตราเร็วเสียงเพิ่มเพียง $0.6\\ \\mathrm{m/s}$" }
    solution: "$v = 331 + 0.6(32) = 331 + 19.2 = 350.2\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.snd.p004
    topics: [physics.waves.sound]
    difficulty: 2
    type: match
    stem: "จับคู่ลักษณะของเสียงกับสิ่งที่เป็นตัวกำหนด"
    pairs:
      - { left: "ระดับเสียง (เสียงสูงหรือต่ำ)", right: "ความถี่ของคลื่นเสียง" }
      - { left: "ความดัง (เสียงดังหรือเบา)", right: "แอมพลิจูดของคลื่นเสียง" }
      - { left: "อัตราเร็วของเสียง", right: "ชนิดของตัวกลางและอุณหภูมิ" }
      - { left: "เสียงก้องจากหน้าผา", right: "การสะท้อนของเสียง" }
    hints:
      - "ระวังอย่าสับสน \"เสียงสูง\" กับ \"เสียงดัง\" ในภาษาพูด"
      - "นึกถึงรูปคลื่น: คลื่นที่ถี่ขึ้นกับคลื่นที่สูงขึ้นให้เสียงต่างกันอย่างไร"
    solution: "ระดับเสียงขึ้นกับความถี่ · ความดังขึ้นกับแอมพลิจูด · อัตราเร็วเสียงขึ้นกับตัวกลางและอุณหภูมิ · เสียงก้องเกิดจากการสะท้อนของเสียง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.snd.p005
    topics: [physics.waves.sound]
    difficulty: 2
    type: numeric
    stem: "นักท่องเที่ยวยืนตะโกนหันหน้าเข้าหาหน้าผาที่อุทยานแห่งชาติเขาใหญ่ แล้วได้ยินเสียงสะท้อนกลับมาหลังตะโกน $2\\ \\mathrm{s}$ ถ้าอัตราเร็วเสียงในอากาศเป็น $340\\ \\mathrm{m/s}$ หน้าผาอยู่ห่างกี่เมตร (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 340, unit: m }
    hints:
      - "เสียงเดินทางจากนักท่องเที่ยวไปถึงหน้าผา แล้วสะท้อนกลับมา"
      - "ระยะที่เสียงเดินทางทั้งหมดคือ $vt$ ซึ่งเป็นสองเท่าของระยะถึงหน้าผา ใช้ $d = \\dfrac{vt}{2}$"
    misconceptions:
      - { match: 680, feedback: "นั่นคือระยะที่เสียงเดินทางทั้งไปและกลับ ระยะถึงหน้าผาเป็นครึ่งหนึ่งของค่านี้" }
    solution: "ระยะที่เสียงเดินทางไปกลับ $= (340\\ \\mathrm{m/s})(2\\ \\mathrm{s}) = 680\\ \\mathrm{m}$ ระยะถึงหน้าผา $d = \\dfrac{680}{2} = 340\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.snd.p006
    topics: [physics.waves.sound]
    difficulty: 3
    type: numeric
    stem: "ส้อมเสียงสั่นด้วยความถี่ $680\\ \\mathrm{Hz}$ ในอากาศที่เสียงมีอัตราเร็ว $340\\ \\mathrm{m/s}$ คลื่นเสียงนี้มีความยาวคลื่นเท่าใด (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 0.5, tolerance: 0.01, unit: m }
    hints:
      - "เสียงเป็นคลื่น ใช้ $v = f\\lambda$ ได้"
      - "จัดรูปเป็น $\\lambda = \\dfrac{v}{f}$ แล้วแทนค่า"
    misconceptions:
      - { match: 2, feedback: "ดูเหมือนนำความถี่หารด้วยอัตราเร็ว ($\\tfrac{f}{v}$) ซึ่งได้หน่วย $\\mathrm{1/m}$ ความยาวคลื่นคือ $\\lambda = \\tfrac{v}{f}$" }
    solution: "$\\lambda = \\dfrac{v}{f} = \\dfrac{340\\ \\mathrm{m/s}}{680\\ \\mathrm{Hz}} = 0.5\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.snd.p007
    topics: [physics.waves.sound]
    difficulty: 3
    type: mcq
    stem: "เสียงในห้องเรียนดังขึ้นจาก $60\\ \\mathrm{dB}$ เป็น $70\\ \\mathrm{dB}$ ข้อใดอธิบายการเปลี่ยนแปลงได้ถูกต้อง"
    choices:
      - { id: a, text: "ความเข้มเสียงเพิ่มขึ้นเป็น 10 เท่า", correct: true }
      - { id: b, text: "ความเข้มเสียงเพิ่มขึ้นประมาณ 1.17 เท่า (เท่ากับ 70 หาร 60)", feedback: "เดซิเบลไม่ได้เป็นสเกลแบบเชิงเส้น การนำตัวเลขเดซิเบลมาหารกันจึงไม่ได้อัตราส่วนของความเข้ม ทุก $10\\ \\mathrm{dB}$ ที่เพิ่ม ความเข้มเพิ่ม 10 เท่า" }
      - { id: c, text: "ความถี่ของเสียงสูงขึ้น เสียงจึงแหลมขึ้น", feedback: "เดซิเบลบอกระดับความเข้มเสียง (ความดัง) ไม่ได้บอกความถี่ เสียงอาจดังขึ้นโดยระดับเสียงสูงต่ำเท่าเดิม" }
      - { id: d, text: "อัตราเร็วของเสียงในห้องเพิ่มขึ้น", feedback: "อัตราเร็วเสียงขึ้นกับตัวกลางและอุณหภูมิ ไม่ได้ขึ้นกับความดัง เสียงดังและเสียงเบาในห้องเดียวกันเดินทางเร็วเท่ากัน" }
    hints:
      - "เดซิเบลเป็นหน่วยของระดับความเข้มเสียง ซึ่งเกี่ยวกับความดัง"
      - "สเกลเดซิเบลเพิ่มทีละ $10\\ \\mathrm{dB}$ หมายถึงความเข้มเพิ่มกี่เท่า"
    solution: "ทุก $10\\ \\mathrm{dB}$ ที่เพิ่มขึ้น ความเข้มเสียงเพิ่มขึ้น 10 เท่า จาก $60$ เป็น $70\\ \\mathrm{dB}$ ความเข้มจึงเพิ่ม 10 เท่า (หูรับรู้ว่าดังขึ้นประมาณ 2 เท่า) ส่วนความถี่และอัตราเร็วเสียงไม่ได้เปลี่ยน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.snd.p008
    topics: [physics.waves.sound]
    difficulty: 4
    type: numeric
    stem: "เรือประมงในอ่าวไทยใช้เครื่องหาความลึกส่งคลื่นเสียงลงไปในน้ำ คลื่นเสียงสะท้อนจากพื้นทะเลกลับมาถึงเรือหลังส่ง $0.08\\ \\mathrm{s}$ ถ้าเสียงเดินทางในน้ำทะเลด้วยอัตราเร็ว $1500\\ \\mathrm{m/s}$ ทะเลตรงนั้นลึกกี่เมตร (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 60, unit: m }
    hints:
      - "ใช้อัตราเร็วเสียงในน้ำ ไม่ใช่ในอากาศ"
      - "คลื่นเสียงเดินทางลงไปแล้วสะท้อนกลับขึ้นมา ใช้ $d = \\dfrac{vt}{2}$"
    misconceptions:
      - { match: 120, feedback: "นั่นคือระยะที่เสียงเดินทางทั้งลงไปและกลับขึ้นมา ความลึกเป็นครึ่งหนึ่งของค่านี้" }
      - { match: 13.6, feedback: "ดูเหมือนใช้อัตราเร็วเสียงในอากาศ ($340\\ \\mathrm{m/s}$) แต่คลื่นเสียงนี้เดินทางในน้ำ ซึ่งเร็วกว่ามาก" }
    solution: "$d = \\dfrac{vt}{2} = \\dfrac{(1500\\ \\mathrm{m/s})(0.08\\ \\mathrm{s})}{2} = \\dfrac{120\\ \\mathrm{m}}{2} = 60\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.snd.p009
    topics: [physics.waves.sound]
    difficulty: 4
    type: numeric
    stem: "นักเรียนทดลองวัดอัตราเร็วเสียงในอากาศได้ $346\\ \\mathrm{m/s}$ อากาศขณะนั้นมีอุณหภูมิประมาณเท่าใด ใช้ $v = 331 + 0.6T$ (ตอบเป็นตัวเลขในหน่วย °C)"
    answer: { value: 25, unit: °C }
    hints:
      - "จัดรูปสูตรให้ $T$ อยู่ข้างเดียว"
      - "ลบ $331$ ออกจากทั้งสองข้างก่อน แล้วหารด้วย $0.6$"
    misconceptions:
      - { match: 15, feedback: "ดูเหมือนลืมหารด้วย $0.6$ ผลต่าง $15\\ \\mathrm{m/s}$ คือ $0.6T$ ไม่ใช่ $T$" }
      - { match: 9, feedback: "ดูเหมือนคูณผลต่างด้วย $0.6$ จาก $0.6T = 15$ ต้อง **หาร** ด้วย $0.6$" }
    solution: "$346 = 331 + 0.6T$ → $0.6T = 15$ → $T = \\dfrac{15}{0.6} = 25\\ ^\\circ\\mathrm{C}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.snd.p010
    topics: [physics.waves.sound]
    difficulty: 3
    type: expression
    stem: "ส่งเสียงไปกระทบผนังแล้วได้ยินเสียงสะท้อนกลับมาหลังเวลา $t$ อัตราเร็วเสียงคือ $v$ เขียนระยะจากผู้ฟังถึงผนังในรูปของ $v$ และ $t$"
    prefix: "d ="
    answer: { latex: "\\frac{vt}{2}", variables: [v, t] }
    hints:
      - "ในเวลา $t$ เสียงเดินทางได้ระยะทางทั้งหมดเท่าใด"
      - "ระยะทั้งหมดนั้นคือไปและกลับ ระยะถึงผนังจึงเป็นเท่าใดของระยะทั้งหมด"
    misconceptions:
      - { match: "vt", feedback: "$vt$ คือระยะที่เสียงเดินทางทั้งไปและกลับ ระยะถึงผนังเป็นครึ่งหนึ่ง" }
      - { match: "\\frac{v}{2t}", feedback: "ระยะทาง = อัตราเร็ว **คูณ** เวลา ไม่ใช่หาร ลองตรวจหน่วย: $\\tfrac{\\mathrm{m/s}}{\\mathrm{s}}$ ไม่ใช่เมตร" }
    solution: "ในเวลา $t$ เสียงเดินทางได้ $vt$ ซึ่งเป็นระยะไปกลับ $= 2d$ จึงได้ $d = \\dfrac{vt}{2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.snd.p011
    topics: [physics.waves.sound]
    difficulty: 4
    type: numeric
    stem: "ในวันที่อุณหภูมิ $35\\ ^\\circ\\mathrm{C}$ เด็กคนหนึ่งปรบมือหน้ากำแพงวัด แล้วได้ยินเสียงสะท้อนหลังปรบมือ $0.5\\ \\mathrm{s}$ กำแพงอยู่ห่างกี่เมตร ใช้ $v = 331 + 0.6T$ (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 88, unit: m }
    hints:
      - "หาอัตราเร็วเสียงที่อุณหภูมินี้ก่อน"
      - "จากนั้นใช้ $d = \\dfrac{vt}{2}$ เพราะเสียงเดินทางไปและกลับ"
    misconceptions:
      - { match: 85, feedback: "ดูเหมือนใช้อัตราเร็วเสียง $340\\ \\mathrm{m/s}$ แต่ข้อนี้ให้อุณหภูมิมา ต้องคำนวณอัตราเร็วจาก $v = 331 + 0.6T$" }
      - { match: 176, feedback: "นั่นคือระยะที่เสียงเดินทางทั้งไปและกลับ ระยะถึงกำแพงเป็นครึ่งหนึ่งของค่านี้" }
    solution: "$v = 331 + 0.6(35) = 352\\ \\mathrm{m/s}$ แล้ว $d = \\dfrac{vt}{2} = \\dfrac{(352\\ \\mathrm{m/s})(0.5\\ \\mathrm{s})}{2} = 88\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.snd.p012
    topics: [physics.waves.sound]
    difficulty: 5
    type: numeric
