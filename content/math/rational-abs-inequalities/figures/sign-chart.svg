<circle cx="270.0" cy="175.0" r="7.0" fill="#fff" stroke="#1f5fae" stroke-width="2.4"/>
<circle cx="510.0" cy="175.0" r="7" fill="#1f5fae"/>
<text x="270.0" y="201.0" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#111">1</text>
