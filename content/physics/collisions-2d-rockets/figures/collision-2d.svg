<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="sans-serif">
<title>การชนสองมิติของลูกบิลเลียดมวลเท่ากัน ลูกที่ชนออกไปทำมุม 30 องศา ลูกที่อยู่นิ่งออกไปทำมุมตั้งฉากกับทิศนั้น</title>
<defs><marker id="ak" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#1f2937"/></marker><marker id="ab" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ao" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#c2410c"/></marker></defs>
<rect width="720" height="380" fill="#ffffff"/>
<text x="170.0" y="40.0" text-anchor="middle" font-size="15" fill="#111" font-weight="bold">ก่อนชน</text>
<circle cx="80.0" cy="200.0" r="18" fill="#93c5fd" stroke="#334155" stroke-width="1.5"/>
<circle cx="230.0" cy="200.0" r="18" fill="#fca5a5" stroke="#334155" stroke-width="1.5"/>
<line x1="104.0" y1="200.0" x2="160.0" y2="200.0" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ab)"/>
<text x="132.0" y="184.0" text-anchor="middle" font-size="14" fill="#1d4ed8" font-weight="bold">u</text>
<text x="230.0" y="240.0" text-anchor="middle" font-size="12" fill="#444" font-weight="normal">อยู่นิ่ง</text>
<text x="540.0" y="40.0" text-anchor="middle" font-size="15" fill="#111" font-weight="bold">หลังชน</text>
<line x1="470" y1="230" x2="610" y2="230" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="614" y="234" text-anchor="start" font-size="11" fill="#64748b">แนวเดิม</text>
<circle cx="470.0" cy="230.0" r="12" fill="#93c5fd" stroke="#334155" stroke-width="1.5"/>
<line x1="470.0" y1="230.0" x2="565.3" y2="175.0" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ab)"/>
<text x="573.3" y="169.0" text-anchor="start" font-size="12" fill="#1d4ed8" font-weight="normal">ลูก A</text>
