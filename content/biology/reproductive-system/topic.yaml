id: biology.humans.reproductive-system
subject: biology
title: { th: ระบบสืบพันธุ์และการเปลี่ยนแปลงเมื่อเข้าสู่วัยหนุ่มสาว, en: "The reproductive system and puberty" }
summary: อวัยวะสืบพันธุ์เพศชายและเพศหญิง ฮอร์โมนเพศกับการเปลี่ยนแปลงในวัยหนุ่มสาว รอบประจำเดือน การปฏิสนธิจนคลอด การคุมกำเนิด การตั้งครรภ์ก่อนวัยอันควร และการดูแลร่างกายและจิตใจ
difficulty: 3
minutes: 40
prerequisites: [biology.cells.cell-basics]
encompasses:
  - { id: biology.cells.cell-basics, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: แบบจำลองเส้นทางของอสุจิ
    src: male-pathway.svg
    alt: "แผนผังกล่องเรียงจากซ้ายไปขวาพร้อมลูกศร อัณฑะ (อยู่ในถุงอัณฑะ สร้างอสุจิและเทสโทสเตอโรน) → หลอดเก็บอสุจิ (เก็บอสุจิจนเจริญเต็มที่) → หลอดนำอสุจิ (ลำเลียงอสุจิ) → ท่อปัสสาวะ (ทางผ่านร่วมกับปัสสาวะ) → ออกนอกร่างกายทางองคชาต ด้านล่างมีวงรีสีเขียว 3 วง ต่อมสร้างน้ำเลี้ยงอสุจิ มีลูกศรชี้ไปที่หลอดนำอสุจิ ต่อมลูกหมากและต่อมคาวเปอร์ มีลูกศรชี้ไปที่ท่อปัสสาวะ ข้อความใต้ภาพ ต่อมทั้งสามสร้างของเหลวหล่อเลี้ยงอสุจิ อสุจิรวมกับของเหลวเรียกว่าน้ำอสุจิ"
    caption: "แบบจำลองแสดงลำดับของอวัยวะ ไม่ได้แสดงรูปร่างจริง (วาดโดยทีมคลังรู้)"
  - type: figure
    title: อวัยวะในระบบสืบพันธุ์เพศหญิง
    src: female-system.svg
    alt: "แผนภาพมองด้านหน้า มดลูกรูปคล้ายผลชมพู่คว่ำอยู่ตรงกลาง มีโพรงมดลูกด้านใน ด้านล่างคือปากมดลูกต่อกับช่องคลอด จากมุมบนทั้งสองข้างของมดลูกมีท่อนำไข่โค้งออกไป ปลายท่อนำไข่เป็นแฉกคล้ายนิ้วมืออยู่ใกล้รังไข่รูปไข่ทั้งสองข้าง ป้ายบอก ท่อนำไข่เป็นที่เกิดการปฏิสนธิ ปลายท่อนำไข่รับเซลล์ไข่ รังไข่สร้างเซลล์ไข่และฮอร์โมน มดลูกเป็นที่ฝังตัวและเจริญของทารก"
    caption: "รังไข่ไม่ได้ต่อกับท่อนำไข่โดยตรง ปลายท่อนำไข่ที่เป็นแฉกช่วยรับเซลล์ไข่ (วาดโดยทีมคลังรู้)"
  - type: figure
    title: รอบประจำเดือน
    src: menstrual-cycle.svg
    alt: "กราฟความหนาของผนังมดลูกตลอดรอบ 28 วัน แกนนอนเป็นวันที่ 1 ถึง 28 วันที่ 1 ถึง 5 มีแถบสีแดงคือประจำเดือน ความหนาของผนังมดลูกลดลงจากสูงเหลือต่ำสุดในวันที่ 5 แล้วค่อย ๆ หนาขึ้น เส้นประสีน้ำเงินที่วันที่ 14 คือการตกไข่ หลังจากนั้นผนังหนาขึ้นต่อจนสูงสุดและพร้อมรับการฝังตัวช่วงท้ายรอบ"
    caption: "ถ้าไม่มีการปฏิสนธิ ผนังมดลูกจะสลายเป็นประจำเดือนรอบใหม่ (วาดโดยทีมคลังรู้ เป็นแบบจำลองเชิงคุณภาพ)"
  - type: worked-example
    title: คำนวณวันประจำเดือนและวันตกไข่
    problem: "รอบประจำเดือนของคนหนึ่งยาว 32 วัน ประจำเดือนเริ่มวันที่ 10 ของเดือนที่มี 30 วัน ครั้งถัดไปเริ่มเมื่อใด และไข่ตกราววันที่เท่าไรของรอบ"
    steps:
      - text: "ครั้งถัดไปเริ่มหลังวันแรกครั้งนี้ 32 วัน: $10 + 32 = 42$ เกินเดือนที่มี 30 วัน จึงเป็นวันที่ $42 - 30 = 12$ ของเดือนถัดไป"
      - text: "วันตกไข่ ≈ ความยาวรอบ − 14 $= 32 - 14 = 18$"
        why: "ช่วงหลังตกไข่ถึงประจำเดือนครั้งถัดไปค่อนข้างคงที่ราว 14 วัน ส่วนช่วงก่อนตกไข่ยาวสั้นต่างกันได้"
    answer: "ประจำเดือนครั้งถัดไปราววันที่ 12 ของเดือนถัดไป และไข่ตกราววันที่ 18 ของรอบ (ค่าประมาณเท่านั้น)"
  - { type: check, problem: biology.humans.reproductive-system.p009, prompt: "ทบทวนว่าผนังมดลูกหนาขึ้นเพื่ออะไร" }
  - type: figure
    title: จากการตกไข่ถึงการฝังตัว
    src: fertilization-path.svg
    alt: "แผนภาพระบบสืบพันธุ์เพศหญิงด้านหน้า ลูกศรสีน้ำเงินแสดงอสุจิเคลื่อนขึ้นจากช่องคลอดผ่านปากมดลูก ทางด้านขวามีหมายเลขบอกขั้น 1 ตกไข่ รังไข่ปล่อยเซลล์ไข่ 2 ปฏิสนธิในท่อนำไข่ได้ไซโกต (วงกลมใกล้ปลายท่อนำไข่) 3 ไซโกตแบ่งเซลล์ระหว่างทาง (กลุ่มเซลล์เล็ก ๆ ในท่อนำไข่ใกล้มดลูก) 4 ฝังตัวที่ผนังมดลูก ราว 1 สัปดาห์หลังปฏิสนธิ"
    caption: "การปฏิสนธิเกิดในท่อนำไข่ ส่วนการฝังตัวเกิดในมดลูก (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - { type: check, problem: biology.humans.reproductive-system.p005, prompt: "ดูภาพแล้วตอบว่าขั้นที่ 2 เกิดที่ไหน" }
glossary:
  - { term: วัยหนุ่มสาว, definition: "ช่วงที่ร่างกายเปลี่ยนแปลงเพราะฮอร์โมนเพศ จนระบบสืบพันธุ์ทำงานได้ (วัยเจริญพันธุ์)" }
  - { term: เทสโทสเตอโรน, definition: "ฮอร์โมนเพศชายที่อัณฑะสร้าง ควบคุมลักษณะของเพศชาย" }
  - { term: เอสโทรเจน, definition: "ฮอร์โมนเพศหญิงที่รังไข่สร้าง ควบคุมลักษณะของเพศหญิงและทำให้ผนังมดลูกหนาขึ้น" }
  - { term: การตกไข่, definition: "การที่รังไข่ปล่อยเซลล์ไข่ออกมา โดยปกติเดือนละ 1 เซลล์" }
  - { term: ประจำเดือน, definition: "เนื้อเยื่อผนังมดลูกที่สลายหลุดออกมาพร้อมเลือด เมื่อไม่มีการปฏิสนธิ" }
  - { term: รก, definition: "อวัยวะที่ทารกในครรภ์ใช้รับสารอาหารและออกซิเจนจากแม่ และส่งของเสียออก โดยเลือดไม่ไหลปนกัน" }
flashcards:
  - { front: "การปฏิสนธิเกิดที่ใด", back: "ท่อนำไข่ แล้วไซโกตจึงไปฝังตัวที่มดลูก" }
  - { front: "อัณฑะและรังไข่สร้างอะไร", back: "อัณฑะ: อสุจิและเทสโทสเตอโรน รังไข่: เซลล์ไข่ เอสโทรเจน และโพรเจสเทอโรน" }
  - { front: "ไข่ตกราววันที่เท่าไรของรอบ", back: "ประมาณความยาวรอบ − 14 (รอบ 28 วันราววันที่ 14)" }
  - { front: "วิธีคุมกำเนิดที่ช่วยป้องกันโรคติดต่อทางเพศสัมพันธ์ด้วย", back: "ถุงยางอนามัย" }
  - { front: "ระยะเวลาตั้งครรภ์", back: "ราว 40 สัปดาห์ (280 วัน) นับจากวันแรกของประจำเดือนครั้งสุดท้าย" }
