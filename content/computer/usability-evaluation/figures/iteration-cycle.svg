<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="sans-serif" font-size="15">
  <title>วงรอบการปรับปรุงความใช้งานได้ห้าขั้นตอน</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5562b"/></marker></defs>
  <rect x="0" y="0" width="600" height="400" fill="#ffffff"/>
  <text x="300" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#15211e">รอบการปรับปรุงความใช้งานได้</text>
  <rect x="215.0" y="52.0" width="170" height="46" rx="10" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="300.0" y="80.0" text-anchor="middle" font-size="14" fill="#15211e">1 วางแผนการทดสอบ</text>
  <rect x="405.2" y="141.8" width="170" height="46" rx="10" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="490.2" y="169.8" text-anchor="middle" font-size="14" fill="#15211e">2 ทดสอบกับผู้ใช้</text>
  <rect x="332.6" y="287.2" width="170" height="46" rx="10" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="417.6" y="315.2" text-anchor="middle" font-size="14" fill="#15211e">3 วิเคราะห์และจัดลำดับ</text>
  <rect x="97.4" y="287.2" width="170" height="46" rx="10" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="182.4" y="315.2" text-anchor="middle" font-size="14" fill="#15211e">4 แก้ปัญหาสำคัญก่อน</text>
  <rect x="24.8" y="141.8" width="170" height="46" rx="10" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="109.8" y="169.8" text-anchor="middle" font-size="14" fill="#15211e">5 ทดสอบซ้ำ</text>
  <line x1="361.4" y1="104.0" x2="428.8" y2="135.8" stroke="#b5562b" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="475.7" y1="193.8" x2="432.1" y2="281.2" stroke="#b5562b" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="326.6" y1="310.2" x2="273.4" y2="310.2" stroke="#b5562b" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="167.9" y1="281.2" x2="124.3" y2="193.8" stroke="#b5562b" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="171.2" y1="135.8" x2="238.6" y2="104.0" stroke="#b5562b" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="300" y="210" text-anchor="middle" font-size="14" fill="#4a5a55">ผลทดสอบ</text>
  <text x="300" y="229" text-anchor="middle" font-size="14" fill="#4a5a55">ทำซ้ำจนพอใจ</text>
  <text x="300" y="382" text-anchor="middle" font-size="13" fill="#4a5a55">แต่ละรอบแก้ปัญหาที่รุนแรงที่สุดก่อน แล้วตรวจว่าปัญหานั้นลดลงจริง</text>
</svg>
