      - { id: b, text: "ถ่านไฟฉายหมดพอดี", feedback: "ถ้าสลับกลับมาเป็นแบบเดิมหลอดจะสว่างอีก ปัญหาจึงไม่ได้อยู่ที่ถ่าน" }
      - { id: c, text: "กระแสไหลย้อนกลับแล้วหักล้างกันเป็นศูนย์", feedback: "ในวงจรนี้มีกระแสไหลทางเดียวเท่านั้น ไม่มีกระแสสองทางมาหักล้างกัน ไดโอดต่างหากที่ไม่ยอมให้กระแสไหลทางนั้น" }
      - { id: d, text: "LED เป็นตัวต้านทานโอห์มมิก จึงต้องต่อถูกขั้ว", feedback: "ตัวต้านทานโอห์มมิกให้กระแสไหลได้ทั้งสองทางเท่ากัน ไม่ขึ้นกับขั้ว" }
    hints:
