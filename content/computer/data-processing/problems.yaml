  - id: computer.data.data-processing.p013
    topics: [computer.data.data-processing]
    difficulty: 4
    type: mcq
    stem: "นักเรียนจะทำแผนที่ค่าฝุ่น PM2.5 ของจังหวัดให้ชาวบ้านใช้ตัดสินใจว่าวันไหนควรใส่หน้ากาก การนำเสนอแบบโต้ตอบใด **ช่วยให้คนเข้าใจได้ดีที่สุด**"
    choices:
      - { id: a, text: "แผนที่แบ่งตามอำเภอ ให้เลือกวันที่ได้ ระบายสีตามระดับคุณภาพอากาศพร้อมคำอธิบายสี และแตะที่อำเภอเพื่อดูค่าและคำแนะนำ", correct: true }
      - { id: b, text: "ตารางตัวเลขดิบทุกชั่วโมงของทุกสถานีในไฟล์เดียว", feedback: "ข้อมูลครบแต่ชาวบ้านอ่านยาก ไม่ช่วยให้ตัดสินใจได้เร็ว" }
      - { id: c, text: "ภาพนิ่งแผนภูมิวงกลมของค่าฝุ่นเฉลี่ยทั้งปี", feedback: "ไม่บอกรายวันและรายพื้นที่ ซึ่งเป็นสิ่งที่ผู้ใช้ต้องการ" }
      - { id: d, text: "แผนที่สวย ๆ ที่ใช้หลายสีแต่ไม่มีคำอธิบายว่าแต่ละสีหมายถึงอะไร", feedback: "ผู้ดูแปลความหมายของสีไม่ได้ จึงตัดสินใจไม่ได้" }
    hints:
      - "คิดจากคำถามของผู้ใช้: ที่ไหน วันไหน อันตรายแค่ไหน"
      - "การโต้ตอบที่ดีให้ผู้ใช้เลือกดูสิ่งที่เขาสนใจได้เอง"
    solution: "ผู้ใช้อยากรู้ค่าฝุ่นของพื้นที่ตนในวันที่สนใจ ข้อ ก ให้เลือกวันและพื้นที่ ใช้สีที่มีคำอธิบาย และแตะดูค่าพร้อมคำแนะนำได้ จึงช่วยให้เข้าใจปรากฏการณ์และตัดสินใจได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-processing.p014
    topics: [computer.data.data-processing]
    difficulty: 4
    type: mcq
    stem: "นักเรียนใช้แบบจำลอง แก้ว = 12 × อุณหภูมิ − 300 ซึ่งสร้างจากข้อมูลวันที่อุณหภูมิ 28 ถึง 36 °C แล้วแทนค่า 20 °C ได้ −60 แก้ว ข้อใดสรุปได้ถูกต้อง"
    choices:
      - { id: a, text: "แบบจำลองไม่ควรใช้นอกช่วงข้อมูลที่ใช้สร้าง ผลติดลบแสดงว่าความสัมพันธ์แบบเส้นตรงใช้ไม่ได้ที่อุณหภูมินี้", correct: true }
      - { id: b, text: "วันที่ 20 °C ร้านต้องรับซื้อน้ำคืน 60 แก้ว", feedback: "จำนวนแก้วที่ขายติดลบไม่มีความหมายในโลกจริง เป็นสัญญาณว่าแบบจำลองใช้ผิดช่วง" }
      - { id: c, text: "คำนวณผิด ต้องได้ 60 แก้ว", feedback: "12 × 20 − 300 = −60 คำนวณถูกแล้ว ปัญหาอยู่ที่การใช้แบบจำลองนอกช่วงข้อมูล" }
      - { id: d, text: "แบบจำลองผิดทั้งหมด ต้องทิ้ง", feedback: "แบบจำลองยังใช้ได้ดีในช่วง 28 ถึง 36 °C แค่ไม่ควรใช้นอกช่วง" }
    hints:
      - "แบบจำลองสร้างจากข้อมูลช่วงใด และ 20 °C อยู่ในช่วงนั้นหรือไม่"
      - "ยอดขายติดลบเป็นไปได้หรือไม่"
    solution: "การใช้แบบจำลองนอกช่วงข้อมูล (extrapolation) เสี่ยงผิด ผลติดลบซึ่งเป็นไปไม่ได้ยืนยันว่าความสัมพันธ์เส้นตรงนี้ใช้ได้เฉพาะช่วงที่มีข้อมูล ถ้าต้องการคาดการณ์วันอากาศเย็น ต้องเก็บข้อมูลวันเย็นเพิ่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-processing.p015
    topics: [computer.data.data-processing]
    difficulty: 5
    type: numeric
    stem: |
      เดือนต่อมา แบบจำลอง แก้ว = 12 × อุณหภูมิ − 300 คาดต่ำกว่ายอดขายจริงทุกวัน ชมรมจึงปรับแบบจำลองเป็น แก้ว = 12 × อุณหภูมิ + b โดยเลือก b ให้ค่าเฉลี่ยของ (จริง − คาด) ใน 4 วันนี้เท่ากับศูนย์ แบบจำลองใหม่คาดว่าวันที่ 33 °C จะขายได้กี่แก้ว

      | อุณหภูมิ (°C) | 30 | 32 | 34 | 36 |
      |---|---|---|---|---|
      | ขายได้จริง (แก้ว) | 70 | 92 | 115 | 138 |
    answer: { value: 103.75, tolerance: 0.1, unit: แก้ว }
    hints:
      - "หาความคลาดเคลื่อน (จริง − คาด) ของแบบจำลองเดิมทุกวัน แล้วหาค่าเฉลี่ย"
      - "เลื่อนค่าคงที่ขึ้นเท่ากับค่าเฉลี่ยนั้น: b = −300 + ค่าเฉลี่ยความคลาดเคลื่อน แล้วแทน 33 °C"
    misconceptions:
      - { match: 96, feedback: "96 คือค่าที่แบบจำลองเดิมคาด ยังไม่ได้ปรับค่าคงที่" }
      - { match: 106, feedback: "อาจปรับด้วยความคลาดเคลื่อนของวันแรกวันเดียว (+10) ต้องใช้ค่าเฉลี่ยของทั้ง 4 วัน" }
    solution: "คาดเดิม: 60, 84, 108, 132 จริง − คาด: 10, 8, 7, 6 ค่าเฉลี่ย 31 ÷ 4 = 7.75 จึงได้ b = −300 + 7.75 = −292.25 แบบจำลองใหม่ที่ 33 °C: 12 × 33 − 292.25 = 396 − 292.25 = 103.75 แก้ว (ในทางปฏิบัติเตรียมราว 104 แก้ว)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-processing.p016
    topics: [computer.data.data-processing]
    difficulty: 5
    type: mcq
    stem: "นักเรียนตั้งสมมติฐานว่า \"ปิดไฟห้องเรียนช่วงพักเที่ยงจะลดค่าไฟของโรงเรียนได้ราว 5%\" แล้วสร้างแบบจำลองในตารางคำนวณจากจำนวนหลอด กำลังไฟ และชั่วโมงใช้งาน ข้อใดประเมินบทบาทของแบบจำลองนี้ได้ถูกต้องที่สุด"
    choices:
      - { id: a, text: "แบบจำลองช่วยทดสอบสมมติฐานเบื้องต้นและลองเปลี่ยนเงื่อนไขได้เร็ว แต่ต้องเทียบกับบิลค่าไฟจริงหลังทดลองปิดไฟ แล้วปรับแบบจำลองถ้าผลต่างกัน", correct: true }
      - { id: b, text: "ถ้าแบบจำลองได้ 5% ก็พิสูจน์แล้วว่าสมมติฐานถูก ไม่ต้องดูข้อมูลจริง", feedback: "แบบจำลองตั้งอยู่บนข้อสมมติ เช่น ชั่วโมงใช้งาน ซึ่งอาจไม่ตรงกับความจริง ต้องยืนยันด้วยข้อมูลจริง" }
      - { id: c, text: "แบบจำลองไม่มีประโยชน์ เพราะไม่ใช่ข้อมูลจริง", feedback: "แบบจำลองช่วยคาดการณ์และเลือกสิ่งที่ควรทดลองได้ก่อนลงมือจริง จึงมีประโยชน์" }
      - { id: d, text: "ควรเพิ่มรายละเอียดทุกอย่างในโรงเรียนเข้าไปในแบบจำลอง จึงจะเชื่อได้", feedback: "รายละเอียดที่ไม่มีผลทำให้ซับซ้อนโดยไม่จำเป็น สิ่งที่ทำให้เชื่อได้คือการเทียบกับข้อมูลจริง" }
    hints:
      - "แบบจำลองเป็นเครื่องมือทดสอบสมมติฐาน ไม่ใช่หลักฐานสุดท้าย"
      - "วงจร สร้าง → ทดสอบกับข้อมูล → ปรับ"
    solution: "แบบจำลองช่วยให้ทดสอบสมมติฐานได้เร็วและลองหลายเงื่อนไข แต่ผลขึ้นกับข้อสมมติที่ใส่ไป จึงต้องเทียบกับข้อมูลจริง เช่น บิลค่าไฟหลังทดลอง แล้วปรับแบบจำลองให้ดีขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-processing.p017
