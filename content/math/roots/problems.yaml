problems:
  - id: math.root.p001
    topics: [math.number.roots]
    difficulty: 1
    type: numeric
    stem: "$\\sqrt{81}$ มีค่าเท่าใด"
    answer: { value: 9 }
    hints:
      - "หาจำนวนที่ไม่เป็นลบซึ่งยกกำลังสองแล้วได้ 81"
      - "ลองท่องกำลังสองสมบูรณ์: $8^2 = 64$, $9^2 = ?$"
    misconceptions:
      - { match: 40.5, feedback: "ดูเหมือนหาร 81 ด้วย 2 แต่การถอดรากที่สองคือหาจำนวนที่คูณตัวเองแล้วได้ 81" }
      - { match: 6561, feedback: "นั่นคือ $81^2$ ซึ่งเป็นการยกกำลังสอง การถอดรากต้องทำย้อนกลับ" }
    solution: "$9 \\times 9 = 81$ และ 9 ไม่เป็นลบ จึงได้ $\\sqrt{81} = 9$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.root.p002
    topics: [math.number.roots]
    difficulty: 1
    type: numeric
    stem: "$\\sqrt[3]{64}$ มีค่าเท่าใด"
    answer: { value: 4 }
    hints:
      - "รากที่สามคือจำนวนที่ยกกำลังสามแล้วได้ 64"
      - "ลองยกกำลังสามจำนวนเต็มเล็ก ๆ ทีละตัว: $2^3, 3^3, 4^3, \\ldots$"
    misconceptions:
      - { match: 8, feedback: "นั่นคือรากที่สอง ($8 \\times 8 = 64$) แต่โจทย์ถามรากที่สาม ต้องคูณตัวเอง 3 ครั้ง" }
      - { match: 21.333, feedback: "ดูเหมือนหาร 64 ด้วย 3 แต่รากที่สามคือหาจำนวนที่คูณตัวเอง 3 ครั้งแล้วได้ 64" }
    solution: "$4 \\times 4 \\times 4 = 64$ จึงได้ $\\sqrt[3]{64} = 4$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.root.p003
    topics: [math.number.roots]
    difficulty: 2
    type: mcq
    stem: "$\\sqrt[3]{-64}$ มีค่าเท่าใด"
    choices:
      - { id: a, text: "$-4$", correct: true }
      - { id: b, text: "$4$", feedback: "ลองตรวจ $4^3 = 64$ ไม่ใช่ $-64$ ต้องใช้จำนวนลบยกกำลังสาม" }
      - { id: c, text: "ไม่มีค่าในระบบจำนวนจริง", feedback: "ข้อนี้จริงเฉพาะรากที่สองของจำนวนลบ รากที่สามของจำนวนลบหาได้ เพราะจำนวนลบยกกำลังสามยังเป็นลบ" }
      - { id: d, text: "$-8$", feedback: "นั่นคือการถอดรากที่สองของ 64 แล้วใส่เครื่องหมายลบ แต่ $(-8)^3 = -512$ โจทย์ถามรากที่สาม" }
    hints:
      - "จำนวนลบยกกำลังสามได้ผลเป็นบวกหรือลบ"
      - "หาจำนวนที่ยกกำลังสามแล้วได้ 64 ก่อน แล้วพิจารณาเครื่องหมาย"
    solution: "$(-4)^3 = (-4)(-4)(-4) = -64$ จึงได้ $\\sqrt[3]{-64} = -4$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.root.p004
    topics: [math.number.roots]
    difficulty: 2
    type: mcq
    stem: "นักเรียนทำแปลงผักรูปสี่เหลี่ยมจัตุรัสพื้นที่ $70\\ \\mathrm{m^2}$ ความยาวด้านของแปลง (เป็นเมตร) อยู่ระหว่างจำนวนเต็มคู่ใด"
    choices:
      - { id: a, text: "8 กับ 9", correct: true }
      - { id: b, text: "35 กับ 36", feedback: "ดูเหมือนหาร 70 ด้วย 2 แต่ความยาวด้านคือ $\\sqrt{70}$ ลองตรวจ: แปลงด้าน 35 เมตรมีพื้นที่ $1225\\ \\mathrm{m^2}$" }
      - { id: c, text: "64 กับ 81", feedback: "64 และ 81 คือกำลังสองสมบูรณ์ที่ล้อม 70 ไว้ ถูกครึ่งทางแล้ว แต่ต้องถอดรากของทั้งสองจำนวนอีกครั้ง" }
    hints:
      - "ความยาวด้านของสี่เหลี่ยมจัตุรัสคือรากที่สองของพื้นที่"
      - "หากำลังสองสมบูรณ์ที่อยู่ติดกันซึ่งล้อม 70 ไว้"
      - "ถอดรากของกำลังสองสมบูรณ์ทั้งสองตัวนั้น"
    solution: "$64 < 70 < 81$ หรือ $8^2 < 70 < 9^2$ จึงได้ $8 < \\sqrt{70} < 9$ ด้านยาวระหว่าง 8 ถึง 9 เมตร (ประมาณ 8.37 m)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.root.p005
    topics: [math.number.roots]
    difficulty: 2
    type: numeric
    stem: "$\\sqrt{0.16}$ มีค่าเท่าใด (ตอบเป็นทศนิยม)"
    answer: { value: 0.4, tolerance: 0.004 }
    hints:
      - "เขียน $0.16$ เป็นเศษส่วนที่มีส่วนเป็น 100"
      - "หารากของเศษและส่วนแยกกัน แล้วตรวจด้วยการยกกำลังสองกลับ"
    misconceptions:
      - { match: 0.04, feedback: "ลองตรวจ $0.04 \\times 0.04 = 0.0016$ ไม่ใช่ 0.16 ตำแหน่งทศนิยมเลื่อนผิด" }
      - { match: 0.08, feedback: "ดูเหมือนหาร 0.16 ด้วย 2 แต่ต้องหาจำนวนที่คูณตัวเองแล้วได้ 0.16" }
    solution: "$\\sqrt{0.16} = \\sqrt{\\dfrac{16}{100}} = \\dfrac{4}{10} = 0.4$ ตรวจ: $0.4 \\times 0.4 = 0.16$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.root.p006
    topics: [math.number.roots]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นจำนวนอตรรกยะ (เลือกได้มากกว่า 1 ข้อ)"
    choices:
      - { id: a, text: "$\\sqrt{2}$", correct: true }
      - { id: b, text: "$\\sqrt{16}$", feedback: "$\\sqrt{16} = 4$ เขียนเป็น $\\tfrac{4}{1}$ ได้ จึงเป็นจำนวนตรรกยะ เครื่องหมายรากไม่ได้แปลว่าเป็นอตรรกยะเสมอ" }
      - { id: c, text: "$\\pi$", correct: true }
      - { id: d, text: "$0.333\\ldots$ (3 ซ้ำไม่รู้จบ)", feedback: "ทศนิยมไม่รู้จบแต่ซ้ำเป็นแบบแผน เท่ากับ $\\tfrac{1}{3}$ จึงเป็นจำนวนตรรกยะ" }
      - { id: e, text: "$\\sqrt{\\tfrac{4}{9}}$", feedback: "$\\sqrt{\\tfrac{4}{9}} = \\tfrac{2}{3}$ ซึ่งเป็นเศษส่วนของจำนวนเต็ม จึงเป็นจำนวนตรรกยะ" }
      - { id: f, text: "$\\sqrt[3]{10}$", correct: true }
    hints:
      - "จำนวนอตรรกยะเขียนเป็นเศษส่วนของจำนวนเต็มไม่ได้"
      - "ลองถอดรากแต่ละตัว ถ้าได้จำนวนเต็มหรือเศษส่วน แสดงว่าเป็นตรรกยะ"
      - "ทศนิยมที่ซ้ำเป็นแบบแผนเป็นตรรกยะ ส่วนรากของจำนวนที่ไม่ใช่กำลังสอง (หรือกำลังสาม) สมบูรณ์เป็นอตรรกยะ"
    solution: "$\\sqrt{2}$, $\\pi$ และ $\\sqrt[3]{10}$ เป็นอตรรกยะ (10 ไม่ใช่กำลังสามสมบูรณ์) ส่วน $\\sqrt{16} = 4$, $0.333\\ldots = \\tfrac{1}{3}$ และ $\\sqrt{\\tfrac{4}{9}} = \\tfrac{2}{3}$ เป็นตรรกยะ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.root.p007
    topics: [math.number.roots]
    difficulty: 3
    type: numeric
    stem: "ที่ดินรูปสี่เหลี่ยมจัตุรัสมีพื้นที่ 2 งาน (1 งาน = 400 ตารางเมตร) ที่ดินนี้ยาวด้านละประมาณกี่เมตร (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 28.3, tolerance: 0.3, unit: m }
    hints:
      - "แปลงพื้นที่เป็นตารางเมตรก่อน"
      - "ความยาวด้านของสี่เหลี่ยมจัตุรัส = รากที่สองของพื้นที่"
      - "พื้นที่อยู่ระหว่างกำลังสองสมบูรณ์ $28^2$ กับ $29^2$ ใช้เครื่องคิดเลขหรือลองยกกำลังสองทศนิยมเพื่อหาค่าให้ละเอียด"
    misconceptions:
      - { match: 400, feedback: "ดูเหมือนหารพื้นที่ด้วย 2 ความยาวด้านต้องหาจากรากที่สองของพื้นที่" }
      - { match: 20, feedback: "นั่นคือรากที่สองของ 400 ซึ่งเป็นพื้นที่ 1 งาน แต่ที่ดินนี้มี 2 งาน คือ $800\\ \\mathrm{m^2}$" }
    solution: "พื้นที่ $= 2 \\times 400 = 800\\ \\mathrm{m^2}$ ด้าน $= \\sqrt{800} \\approx 28.3\\ \\mathrm{m}$ ตรวจ: $28^2 = 784$ และ $29^2 = 841$ ค่าจึงอยู่ระหว่าง 28 กับ 29 ✓ ($28.3^2 = 800.89$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.root.p008
    topics: [math.number.roots]
    difficulty: 3
    type: numeric
    stem: "จำนวนเต็มที่ใกล้ $\\sqrt{130}$ ที่สุดคือจำนวนใด"
    answer: { value: 11 }
    hints:
      - "หากำลังสองสมบูรณ์สองตัวที่ล้อม 130 ไว้"
      - "$11^2 = 121$ และ $12^2 = 144$"
      - "เทียบว่า 130 ห่างจาก 121 หรือ 144 มากกว่ากัน"
    misconceptions:
      - { match: 12, feedback: "130 ห่างจาก 121 เพียง 9 แต่ห่างจาก 144 ถึง 14 จึงใกล้ $11^2$ มากกว่า ($\\sqrt{130} \\approx 11.4$)" }
      - { match: 65, feedback: "ดูเหมือนหาร 130 ด้วย 2 แต่ต้องหาจำนวนที่ยกกำลังสองแล้วใกล้ 130" }
    solution: "$121 < 130 < 144$ จึงได้ $11 < \\sqrt{130} < 12$ และ 130 ใกล้ 121 มากกว่า ($130 - 121 = 9$, $144 - 130 = 14$) คำตอบคือ 11 ($\\sqrt{130} \\approx 11.40$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.root.p009
    topics: [math.number.roots]
    difficulty: 3
    type: numeric
    stem: "$\\sqrt{3^2 + 4^2}$ มีค่าเท่าใด"
    answer: { value: 5 }
    hints:
      - "ทำสิ่งที่อยู่ใต้เครื่องหมายรากให้เสร็จก่อน"
      - "หา $3^2 + 4^2$ แล้วจึงถอดรากที่สองของผลรวม"
    misconceptions:
      - { match: 7, feedback: "ดูเหมือนถอดรากแยกทีละพจน์ ($3 + 4$) แต่ $\\sqrt{a + b} \\ne \\sqrt{a} + \\sqrt{b}$ ต้องบวกใต้รากก่อน" }
      - { match: 25, feedback: "นั่นคือผลรวมใต้เครื่องหมายราก ยังต้องถอดรากที่สองอีกขั้น" }
    solution: "$\\sqrt{3^2 + 4^2} = \\sqrt{9 + 16} = \\sqrt{25} = 5$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.root.p010
    topics: [math.number.roots]
    difficulty: 4
    type: order
    stem: "เรียงจำนวนจริงต่อไปนี้จากน้อยไปมาก"
    items:
      - "$3.1$"
      - "$\\pi$"
      - "$\\dfrac{22}{7}$"
      - "$\\sqrt{10}$"
      - "$3.2$"
    hints:
      - "เขียนทุกจำนวนเป็นทศนิยมอย่างน้อย 3 ตำแหน่งแล้วเทียบกัน"
      - "$\\pi \\approx 3.1416$ และ $\\tfrac{22}{7}$ เป็นค่าประมาณของ $\\pi$ แต่ไม่เท่ากันพอดี"
      - "สำหรับ $\\sqrt{10}$ ลองยกกำลังสองค่าทดลอง เช่น $3.16^2$ เพื่อหาทศนิยม"
    solution: "$3.1 < \\pi \\approx 3.1416 < \\tfrac{22}{7} \\approx 3.1429 < \\sqrt{10} \\approx 3.1623 < 3.2$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.root.p011
    topics: [math.number.roots]
    difficulty: 4
    type: numeric
    stem: "ถังเก็บน้ำรูปลูกบาศก์จุน้ำได้ 216 ลิตรพอดี ถังนี้ยาวด้านละกี่เซนติเมตร (1 ลิตร = $1000\\ \\mathrm{cm^3}$)"
    answer: { value: 60, unit: cm }
    hints:
      - "ปริมาตรลูกบาศก์ = ด้าน × ด้าน × ด้าน จึงต้องใช้รากที่สาม"
      - "แปลงปริมาตรเป็น $\\mathrm{cm^3}$ ก่อน หรือใช้ว่า 1 ลิตร = $1\\ \\mathrm{dm^3}$ แล้วแปลงคำตอบภายหลัง"
      - "ถอดรากที่สามของปริมาตรที่แปลงหน่วยแล้ว"
    misconceptions:
      - { match: 6, feedback: "$\\sqrt[3]{216} = 6$ ถูกแล้ว แต่หน่วยคือเดซิเมตร (เพราะ 1 ลิตร = $1\\ \\mathrm{dm^3}$) ต้องแปลงเป็นเซนติเมตรด้วย" }
      - { match: 14.697, feedback: "ดูเหมือนใช้รากที่สอง แต่ปริมาตรเป็นด้านยกกำลังสาม ต้องใช้รากที่สาม" }
    solution: "$216\\ \\mathrm{L} = 216 \\times 1000 = 216{,}000\\ \\mathrm{cm^3}$ ด้าน $= \\sqrt[3]{216{,}000} = 60\\ \\mathrm{cm}$ ตรวจ: $60 \\times 60 \\times 60 = 216{,}000$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.root.p012
    topics: [math.number.roots]
    difficulty: 4
    type: numeric
    stem: "มีจำนวนเต็มกี่จำนวนที่อยู่ระหว่าง $\\sqrt{10}$ กับ $\\sqrt{90}$"
    answer: { value: 6 }
    hints:
      - "ประมาณ $\\sqrt{10}$ และ $\\sqrt{90}$ ว่าอยู่ระหว่างจำนวนเต็มใด"
      - "$3^2 = 9 < 10$ และ $9^2 = 81 < 90 < 100$"
      - "นับจำนวนเต็มที่มากกว่า $\\sqrt{10}$ และน้อยกว่า $\\sqrt{90}$ ระวังจำนวนที่อยู่ตรงขอบ"
    misconceptions:
      - { match: 79, feedback: "นั่นคือจำนวนเต็มระหว่าง 10 กับ 90 แต่โจทย์ถามจำนวนเต็มระหว่าง $\\sqrt{10}$ กับ $\\sqrt{90}$ ต้องประมาณค่ารากก่อน" }
      - { match: 7, feedback: "ดูเหมือนนับ 3 ด้วย แต่ $3 = \\sqrt{9}$ น้อยกว่า $\\sqrt{10}$ จึงไม่อยู่ในช่วง" }
    solution: "$\\sqrt{10} \\approx 3.16$ และ $\\sqrt{90} \\approx 9.49$ จำนวนเต็มในช่วงคือ 4, 5, 6, 7, 8, 9 รวม 6 จำนวน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.root.p013
    topics: [math.number.roots]
    difficulty: 5
    type: numeric
    stem: "จำนวนเต็มบวก $n$ ที่น้อยที่สุดที่ทำให้ $\\sqrt{12n}$ เป็นจำนวนเต็ม คือจำนวนใด"
    answer: { value: 3 }
    hints:
      - "$\\sqrt{12n}$ เป็นจำนวนเต็มเมื่อ $12n$ เป็นกำลังสองสมบูรณ์"
      - "แยกตัวประกอบ $12 = 2 \\times 2 \\times 3$ กำลังสองสมบูรณ์ต้องมีตัวประกอบแต่ละตัวเป็นคู่"
      - "หาว่าต้องคูณตัวประกอบใดเพิ่มเพื่อให้ทุกตัวมีคู่"
    misconceptions:
      - { match: 12, feedback: "$12 \\times 12 = 144 = 12^2$ ใช้ได้ แต่ยังไม่ใช่ค่าที่น้อยที่สุด ลองแยกตัวประกอบ 12 แล้วดูว่าขาดตัวใด" }
    solution: "$12 = 2^2 \\times 3$ ตัวประกอบ 2 มีคู่แล้ว แต่ 3 ยังขาดคู่ จึงต้องคูณด้วย 3: $12 \\times 3 = 36 = 6^2$ ได้ $\\sqrt{36} = 6$ ดังนั้น $n = 3$ (ตรวจ $n = 1, 2$: 12 และ 24 ไม่ใช่กำลังสองสมบูรณ์)"
    license: CC-BY-SA-4.0
    ai_assisted: true
