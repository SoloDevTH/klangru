<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" font-family="sans-serif" font-size="14">
<title>การวิเคราะห์สนามแรงของการเปลี่ยนมาใช้ระบบสารบรรณอิเล็กทรอนิกส์</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="ahk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="0" y="0" width="820" height="380" fill="#ffffff"/>
<text x="410.0" y="30.0" text-anchor="middle" font-size="16" fill="#222" font-weight="bold" >สนามแรง: เปลี่ยนมาใช้ระบบสารบรรณอิเล็กทรอนิกส์ (สมมติ)</text>
<line x1="410.0" y1="55.0" x2="410.0" y2="345.0" stroke="#222" stroke-width="3" />
<text x="290.0" y="62.0" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold" >แรงผลักดัน →</text>
<text x="530.0" y="62.0" text-anchor="middle" font-size="14" fill="#c0392b" font-weight="bold" >← แรงต้าน</text>
<line x1="268.0" y1="95.0" x2="398.0" y2="95.0" stroke="#2e7d32" stroke-width="10" />
<polygon points="398.0,83.0 398.0,107.0 407.0,95.0" fill="#2e7d32" stroke="#2e7d32" stroke-width="1" />
<text x="260.0" y="100.0" text-anchor="end" font-size="15" fill="#2e7d32" font-weight="bold" >5</text>
<text x="238.0" y="100.0" text-anchor="end" font-size="13.5" fill="#222" >นโยบายรัฐบาลดิจิทัล</text>
<line x1="294.0" y1="163.0" x2="398.0" y2="163.0" stroke="#2e7d32" stroke-width="10" />
<polygon points="398.0,151.0 398.0,175.0 407.0,163.0" fill="#2e7d32" stroke="#2e7d32" stroke-width="1" />
<text x="286.0" y="168.0" text-anchor="end" font-size="15" fill="#2e7d32" font-weight="bold" >4</text>
<text x="264.0" y="168.0" text-anchor="end" font-size="13.5" fill="#222" >ลดค่ากระดาษและหมึก</text>
<line x1="320.0" y1="231.0" x2="398.0" y2="231.0" stroke="#2e7d32" stroke-width="10" />
<polygon points="398.0,219.0 398.0,243.0 407.0,231.0" fill="#2e7d32" stroke="#2e7d32" stroke-width="1" />
<text x="312.0" y="236.0" text-anchor="end" font-size="15" fill="#2e7d32" font-weight="bold" >3</text>
<text x="290.0" y="236.0" text-anchor="end" font-size="13.5" fill="#222" >ค้นหาเอกสารได้เร็ว</text>
<line x1="346.0" y1="299.0" x2="398.0" y2="299.0" stroke="#2e7d32" stroke-width="10" />
<polygon points="398.0,287.0 398.0,311.0 407.0,299.0" fill="#2e7d32" stroke="#2e7d32" stroke-width="1" />
<text x="338.0" y="304.0" text-anchor="end" font-size="15" fill="#2e7d32" font-weight="bold" >2</text>
<text x="316.0" y="304.0" text-anchor="end" font-size="13.5" fill="#222" >หน่วยงานข้างเคียงใช้แล้ว</text>
<line x1="422.0" y1="129.0" x2="526.0" y2="129.0" stroke="#c0392b" stroke-width="10" />
<polygon points="422.0,117.0 422.0,141.0 413.0,129.0" fill="#c0392b" stroke="#c0392b" stroke-width="1" />
<text x="534.0" y="134.0" text-anchor="start" font-size="15" fill="#c0392b" font-weight="bold" >4</text>
<text x="556.0" y="134.0" text-anchor="start" font-size="13.5" fill="#222" >ไม่คุ้นกับลายมือชื่อดิจิทัล</text>
<line x1="422.0" y1="197.0" x2="526.0" y2="197.0" stroke="#c0392b" stroke-width="10" />
<polygon points="422.0,185.0 422.0,209.0 413.0,197.0" fill="#c0392b" stroke="#c0392b" stroke-width="1" />
<text x="534.0" y="202.0" text-anchor="start" font-size="15" fill="#c0392b" font-weight="bold" >4</text>
<text x="556.0" y="202.0" text-anchor="start" font-size="13.5" fill="#222" >กลัวเอกสารหาย</text>
<line x1="422.0" y1="265.0" x2="500.0" y2="265.0" stroke="#c0392b" stroke-width="10" />
<polygon points="422.0,253.0 422.0,277.0 413.0,265.0" fill="#c0392b" stroke="#c0392b" stroke-width="1" />
<text x="508.0" y="270.0" text-anchor="start" font-size="15" fill="#c0392b" font-weight="bold" >3</text>
<text x="530.0" y="270.0" text-anchor="start" font-size="13.5" fill="#222" >คอมพิวเตอร์เครื่องเก่า</text>
<text x="410.0" y="368.0" text-anchor="middle" font-size="12.5" fill="#444" >ตัวเลขคือคะแนนความแรง 1–5 ที่ทีมให้</text>
