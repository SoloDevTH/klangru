  solution: ร้อยละการงอกลดจาก 92 เป็น 85, 61 และ 12 ตามความเข้มข้นที่เพิ่ม ตรงกับการคาดคะเน และข้อสรุปที่ดีเสนอการทำซ้ำหรือคำถามต่อ (การแพร่ของน้ำออกจากเซลล์ดูใน [การแพร่และออสโมซิส](/topic/biology.cells.diffusion-osmosis/))
