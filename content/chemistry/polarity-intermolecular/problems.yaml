      - { id: b, text: "แกรไฟต์มีไอออนอิสระเคลื่อนที่ได้", feedback: "แกรไฟต์ไม่มีไอออน มีแต่อะตอมคาร์บอนที่ยึดกันด้วยพันธะโคเวเลนต์" }
      - { id: c, text: "แผ่นของแกรไฟต์เลื่อนผ่านกันได้ จึงพาประจุไปได้", feedback: "การเลื่อนของแผ่นทำให้แกรไฟต์ลื่น แต่ไม่ได้เป็นสาเหตุของการนำไฟฟ้า" }
    hints:
