    text: จัดกิจกรรมกีฬาและดนตรีตอนเย็น อบรมเพื่อนช่วยเพื่อนเรื่องทักษะปฏิเสธ และติดป้ายสายด่วน 1165 1600 1323
    correct: true
  - id: b
    text: ประกาศชื่อนักเรียนที่เคยสูบบุหรี่หน้าเสาธง
    feedback: การประจานทำให้คนไม่กล้าขอความช่วยเหลือ
  - id: c
    text: ให้สภานักเรียนตรวจค้นกระเป๋าเพื่อนเอง
    feedback: นักเรียนไม่มีอำนาจตรวจค้น และอาจเกิดความขัดแย้ง
  - id: d
    text: แจกคลิปน่ากลัวโดยไม่บอกแหล่งช่วยเหลือ
    feedback: การขู่อย่างเดียวได้ผลน้อย ต้องมีทักษะและทางออกด้วย
