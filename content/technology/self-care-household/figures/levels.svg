<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 345" width="760" height="345" font-family="sans-serif">
<title>งานช่วยเหลือ 3 ระดับ</title>
<rect width="760" height="345" fill="#ffffff"/>
<text x="380.0" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">งานช่วยเหลือ 3 ระดับ</text>
<rect x="22" y="64" width="216" height="232" rx="12" fill="#e8f1fb" stroke="#334155" stroke-width="2"/>
<text x="130.0" y="98" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">1. งานช่วยตนเอง</text>
<text x="130.0" y="122" text-anchor="middle" font-size="14" fill="#374151">ทำเพื่อตัวเอง</text>
<line x1="42" y1="136" x2="218" y2="136" stroke="#94a3b8" stroke-width="1"/>
<circle cx="48" cy="161" r="3.5" fill="#334155"/>
<text x="60" y="166" font-size="15" fill="#111827">แต่งกายด้วยตนเอง</text>
<circle cx="48" cy="195" r="3.5" fill="#334155"/>
<text x="60" y="200" font-size="15" fill="#111827">จัดกระเป๋าเรียน</text>
<circle cx="48" cy="229" r="3.5" fill="#334155"/>
<text x="60" y="234" font-size="15" fill="#111827">เก็บของเล่นเข้าที่</text>
<circle cx="48" cy="263" r="3.5" fill="#334155"/>
<text x="60" y="268" font-size="15" fill="#111827">ล้างจานของตน</text>
<rect x="272" y="64" width="216" height="232" rx="12" fill="#e9f7ef" stroke="#334155" stroke-width="2"/>
<text x="380.0" y="98" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">2. งานช่วยครอบครัว</text>
<text x="380.0" y="122" text-anchor="middle" font-size="14" fill="#374151">ทำเพื่อคนในบ้าน</text>
<line x1="292" y1="136" x2="468" y2="136" stroke="#94a3b8" stroke-width="1"/>
<circle cx="298" cy="161" r="3.5" fill="#334155"/>
<text x="310" y="166" font-size="15" fill="#111827">กวาดและถูพื้น</text>
<circle cx="298" cy="195" r="3.5" fill="#334155"/>
<text x="310" y="200" font-size="15" fill="#111827">พับผ้าให้เรียบ</text>
<circle cx="298" cy="229" r="3.5" fill="#334155"/>
<text x="310" y="234" font-size="15" fill="#111827">รดน้ำต้นไม้</text>
<circle cx="298" cy="263" r="3.5" fill="#334155"/>
<text x="310" y="268" font-size="15" fill="#111827">ทิ้งขยะให้ถูกที่</text>
<rect x="522" y="64" width="216" height="232" rx="12" fill="#fff4e5" stroke="#334155" stroke-width="2"/>
<text x="630.0" y="98" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">3. งานส่วนรวม</text>
<text x="630.0" y="122" text-anchor="middle" font-size="14" fill="#374151">ทำเพื่อคนหมู่มาก</text>
<line x1="542" y1="136" x2="718" y2="136" stroke="#94a3b8" stroke-width="1"/>
<circle cx="548" cy="161" r="3.5" fill="#334155"/>
<text x="560" y="166" font-size="15" fill="#111827">เวรห้องเรียน</text>
<circle cx="548" cy="195" r="3.5" fill="#334155"/>
<text x="560" y="200" font-size="15" fill="#111827">ดูแลสวนโรงเรียน</text>
<circle cx="548" cy="229" r="3.5" fill="#334155"/>
<text x="560" y="234" font-size="15" fill="#111827">เก็บขยะในโรงเรียน</text>
<line x1="246" y1="180.0" x2="264" y2="180.0" stroke="#334155" stroke-width="2.5"/>
<polygon points="264,180.0 254,174.0 254,186.0" fill="#334155"/>
<line x1="496" y1="180.0" x2="514" y2="180.0" stroke="#334155" stroke-width="2.5"/>
<polygon points="514,180.0 504,174.0 504,186.0" fill="#334155"/>
<text x="380.0" y="329" text-anchor="middle" font-size="14" fill="#374151">ผู้ได้รับประโยชน์กว้างขึ้นจากซ้ายไปขวา แต่ทุกระดับใช้ขั้นตอนเดียวกัน</text>
</svg>
