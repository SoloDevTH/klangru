<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" font-family="sans-serif" font-size="14">
<title>โรคหลอดเลือดสมองสองแบบ แบบขาดเลือดเกิดจากการอุดตันของหลอดเลือด แบบเลือดออกเกิดจากหลอดเลือดแตก</title>
<rect x="0" y="0" width="820" height="330" fill="#ffffff"/>
<rect x="20" y="20" width="380" height="250" rx="14" fill="#fafafa" stroke="#90a4ae" stroke-width="1.5"/>
<text x="34" y="46" font-weight="bold" fill="#263238">ก. แบบขาดเลือด (หลอดเลือดอุดตัน)</text>
<path d="M120,80 L120,240" stroke="#c62828" stroke-width="14" stroke-linecap="round"/>
<circle cx="120" cy="150" r="13" fill="#4e342e"/>
<text x="140" y="155" fill="#4e342e" font-size="13">ลิ่มเลือด</text>
<ellipse cx="260" cy="200" rx="70" ry="40" fill="#cfd8dc" stroke="#78909c" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="260" y="205" text-anchor="middle" fill="#37474f" font-size="13">เนื้อสมองขาดเลือด</text>
<path d="M120,200 L190,200" fill="none" stroke="#c62828" stroke-width="6" opacity="0.3" stroke-dasharray="6 4"/>
<text x="210" y="258" text-anchor="middle" fill="#455a64" font-size="12">เลือดไปเลี้ยงไม่พอ เซลล์เสียหาย</text>
<rect x="420" y="20" width="380" height="250" rx="14" fill="#fafafa" stroke="#90a4ae" stroke-width="1.5"/>
<text x="434" y="46" font-weight="bold" fill="#263238">ข. แบบเลือดออก (หลอดเลือดแตก)</text>
<path d="M520,80 L520,240" stroke="#c62828" stroke-width="14" stroke-linecap="round"/>
<path d="M526,150 L540,145 L534,156 L548,154" fill="none" stroke="#fff" stroke-width="3"/>
<path d="M527,152 Q560,160 600,190" fill="none" stroke="#c62828" stroke-width="6" stroke-linecap="round"/>
<circle cx="560" cy="172" r="4" fill="#c62828"/><circle cx="578" cy="186" r="3.5" fill="#c62828"/>
<text x="540" y="132" fill="#b71c1c" font-size="12">ผนังหลอดเลือดแตก</text>
<ellipse cx="655" cy="200" rx="60" ry="36" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
<text x="655" y="205" text-anchor="middle" fill="#b71c1c" font-size="13">เลือดคั่งในสมอง</text>
<text x="610" y="258" text-anchor="middle" fill="#455a64" font-size="12">เลือดกดเนื้อสมองและทำลายเซลล์</text>
</svg>