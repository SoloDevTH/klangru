<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="sans-serif" font-size="14">
<title>สมมติฐานการไหลเนื่องจากความดัน</title>
<rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
<rect x="270" y="120" width="60" height="320" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
<rect x="490" y="120" width="60" height="320" fill="#fff3e0" stroke="#e65100" stroke-width="3"/>
<text x="300.0" y="108.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565c0">ไซเลม</text>
<text x="520.0" y="108.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">โฟลเอ็ม (ซีฟทิวบ์)</text>
<rect x="600" y="110" width="230" height="100" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="715.0" y="140.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">แหล่งสร้าง (ใบ)</text>
<text x="715.0" y="164.0" text-anchor="middle" font-size="13" fill="#222">ซูโครสถูกลำเลียงแบบใช้</text>
<text x="715.0" y="184.0" text-anchor="middle" font-size="13" fill="#222">พลังงานเข้าโฟลเอ็ม</text>
<rect x="600" y="350" width="230" height="100" rx="14" fill="#fbe9e7" stroke="#bf360c" stroke-width="2"/>
<text x="715.0" y="380.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#bf360c">แหล่งรับ (ราก ผล)</text>
<text x="715.0" y="404.0" text-anchor="middle" font-size="13" fill="#222">ซูโครสออกจากโฟลเอ็ม</text>
<text x="715.0" y="424.0" text-anchor="middle" font-size="13" fill="#222">ไปใช้หรือเก็บเป็นแป้ง</text>
