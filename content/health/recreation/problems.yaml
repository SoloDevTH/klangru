problems:
  - id: health.movement.recreation.p001
    topics: [health.movement.recreation]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นกิจกรรมนันทนาการ"
    choices:
      - { id: a, text: "วันเสาร์ ฝ้ายวาดภาพสีน้ำในสวนเพราะชอบวาดรูป", correct: true }
      - { id: b, text: "ต้นถูกครูสั่งให้คัดลายมือเป็นการลงโทษ", feedback: "นันทนาการต้องทำด้วยความสมัครใจ การถูกลงโทษไม่ใช่ความสมัครใจ" }
      - { id: c, text: "เก่งแอบเล่นพนันทายผลฟุตบอลกับรุ่นพี่", feedback: "การพนันเป็นภัยต่อตนเองและสังคม จึงไม่ใช่นันทนาการ" }
      - { id: d, text: "มดทำการบ้านคณิตศาสตร์ที่ต้องส่งพรุ่งนี้", feedback: "การบ้านเป็นงานที่ต้องทำ ไม่ใช่กิจกรรมในเวลาว่างที่เลือกทำเอง" }
    hints:
      - "นันทนาการทำด้วยความสมัครใจในเวลาว่าง"
      - "ต้องได้ความพึงพอใจและไม่เป็นภัยต่อสังคม"
    solution: "การวาดภาพในวันหยุดเพราะชอบ ทำด้วยความสมัครใจในเวลาว่าง ได้ความสุข และไม่เป็นภัยต่อใคร จึงเป็นนันทนาการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.recreation.p002
    topics: [health.movement.recreation]
    difficulty: 1
    type: mcq
    stem: "กิจกรรมใดไม่ใช่กิจกรรมนันทนาการ"
    choices:
      - { id: a, text: "เล่นไพ่พนันเอาเงินกับเพื่อน", correct: true }
      - { id: b, text: "เล่นตะกร้อกับเพื่อนหลังเลิกเรียน", feedback: "การเล่นกีฬาด้วยความสมัครใจในเวลาว่างเป็นนันทนาการ" }
      - { id: c, text: "ปลูกต้นไม้หน้าบ้านในวันหยุด", feedback: "เป็นงานอดิเรกที่ทำในเวลาว่าง เป็นนันทนาการ" }
      - { id: d, text: "ร้องเพลงในชมรมประสานเสียง", feedback: "ดนตรีและการร้องเพลงเป็นนันทนาการประเภทหนึ่ง" }
    hints:
      - "กิจกรรมใดอาจทำให้ตนเองและผู้อื่นเดือดร้อน"
      - "นันทนาการต้องไม่ผิดกฎหมายและไม่เป็นภัยต่อสังคม"
    solution: "การพนันผิดกฎหมายและเป็นภัยต่อตนเองและครอบครัว จึงไม่ใช่นันทนาการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.recreation.p003
    topics: [health.movement.recreation]
    difficulty: 2
    type: match
    stem: "จับคู่กิจกรรมกับประเภทของนันทนาการ"
    pairs:
      - { left: "จักสานตะกร้าจากไม้ไผ่", right: "ศิลปหัตถกรรม" }
      - { left: "รำวงในงานประจำปีของหมู่บ้าน", right: "เต้นรำและนาฏศิลป์" }
      - { left: "เก็บขยะชายหาดกับกลุ่มเยาวชน", right: "อาสาสมัคร" }
      - { left: "เดินป่าและตั้งแคมป์", right: "กิจกรรมกลางแจ้ง" }
      - { left: "เขียนกลอนส่งประกวด", right: "ภาษาและวรรณกรรม" }
    hints:
      - "ดูว่ากิจกรรมใช้มือทำชิ้นงาน ใช้การเคลื่อนไหวตามจังหวะ หรือช่วยเหลือผู้อื่น"
      - "การเขียนเกี่ยวกับภาษา"
    solution: "จักสาน → ศิลปหัตถกรรม, รำวง → เต้นรำและนาฏศิลป์, เก็บขยะ → อาสาสมัคร, เดินป่า → กิจกรรมกลางแจ้ง, เขียนกลอน → ภาษาและวรรณกรรม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.recreation.p004
    topics: [health.movement.recreation]
    difficulty: 2
    type: numeric
    stem: "จากกราฟเวลาว่างของเจได ใน 1 สัปดาห์เจไดมีเวลาว่างรวมกี่ชั่วโมง (ตอบเป็นตัวเลขในหน่วยชั่วโมง)"
    figure:
      src: free-time.svg
      alt: "กราฟแท่งแนวนอน เวลาว่างใน 1 สัปดาห์ของเจได เป็นชั่วโมง ดูจอเพื่อความบันเทิง 14 เล่นกีฬากับเพื่อน 4 ช่วยงานบ้าน 3 อ่านการ์ตูนและนิทาน 2 ฝึกเล่นดนตรี 1"
    answer: { value: 24, unit: ชั่วโมง }
    misconceptions:
      - { match: 14, feedback: "14 คือเวลาดูจออย่างเดียว ต้องรวมทุกกิจกรรม" }
      - { match: 10, feedback: "ลืมรวมเวลาดูจอ 14 ชั่วโมง" }
    hints:
      - "อ่านตัวเลขท้ายแท่งทุกแท่ง"
      - "นำทุกค่ามาบวกกัน"
    solution: "$14 + 4 + 3 + 2 + 1 = 24$ ชั่วโมง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.recreation.p005
    topics: [health.movement.recreation]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นหลักการของกิจกรรมนันทนาการ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ทำด้วยความสมัครใจ", correct: true }
      - { id: b, text: "ทำในเวลาว่าง", correct: true }
      - { id: c, text: "เหมาะกับวัย ความสนใจ และปลอดภัย", correct: true }
      - { id: d, text: "ต้องมีการแข่งขันและมีผู้ชนะเสมอ", feedback: "นันทนาการหลายอย่างไม่มีการแข่งขัน เช่น อ่านหนังสือ ปลูกผัก" }
      - { id: e, text: "ต้องใช้อุปกรณ์ราคาแพง", feedback: "นันทนาการที่ดีควรประหยัด ใช้วัสดุในท้องถิ่นได้" }
    hints:
      - "ทบทวนหลักการ 8 ข้อในบทเรียน"
      - "ข้อที่ถูกมีสามข้อ"
    solution: "หลักการสำคัญ คือ สมัครใจ ทำในเวลาว่าง เหมาะกับผู้ร่วมและปลอดภัย ไม่จำเป็นต้องแข่งขันหรือใช้ของแพง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.recreation.p006
    topics: [health.movement.recreation]
    difficulty: 3
    type: numeric
    stem: "จากกราฟเวลาว่างของเจได เวลาดูจอเพื่อความบันเทิงคิดเป็นร้อยละเท่าใดของเวลาว่างทั้งหมด (ตอบทศนิยม 2 ตำแหน่ง หน่วยร้อยละ)"
    figure:
      src: free-time.svg
      alt: "กราฟแท่งแนวนอน เวลาว่างใน 1 สัปดาห์ของเจได เป็นชั่วโมง ดูจอเพื่อความบันเทิง 14 เล่นกีฬากับเพื่อน 4 ช่วยงานบ้าน 3 อ่านการ์ตูนและนิทาน 2 ฝึกเล่นดนตรี 1"
    answer: { value: 58.33, unit: "%", tolerance: 0.5 }
    misconceptions:
      - { match: 171.43, feedback: "หารกลับด้าน ต้องเอาเวลาดูจอ (14) หารด้วยเวลาว่างทั้งหมด (24)" }
      - { match: 14, feedback: "14 คือชั่วโมง ยังไม่ได้เปลี่ยนเป็นร้อยละ" }
    hints:
      - "หาเวลาว่างทั้งหมดก่อน"
      - "ร้อยละ = เวลาดูจอ ÷ เวลาว่างทั้งหมด × 100"
    solution: "เวลาว่างทั้งหมด 24 ชั่วโมง $\\frac{14}{24} \\times 100 \\approx 58.33\\%$ มากกว่าครึ่งหนึ่งของเวลาว่าง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.recreation.p007
    topics: [health.movement.recreation]
    difficulty: 3
    type: mcq
    stem: "ในวันหยุด ภูมิกับพ่อทำว่าวจุฬาเล่นที่ท้องสนามหลวง ภูมิสังเกตว่าเมื่อปรับมุมสายซุงว่าวจึงลอยได้ดีขึ้น ความรู้นี้เชื่อมโยงกับวิชาใดมากที่สุด"
    choices:
      - { id: a, text: "วิทยาศาสตร์ เรื่องแรงและลม", correct: true }
      - { id: b, text: "ภาษาอังกฤษ", feedback: "การปรับว่าวให้ลอยเกี่ยวกับแรงที่ลมกระทำต่อว่าว ไม่ใช่ภาษา" }
      - { id: c, text: "ประวัติศาสตร์เท่านั้น", feedback: "ว่าวจุฬามีประวัติยาวนาน แต่การทำให้ลอยดีขึ้นเป็นเรื่องของแรงและลม" }
      - { id: d, text: "ไม่เกี่ยวกับวิชาใดเลย", feedback: "นันทนาการเชื่อมโยงกับหลายวิชาได้ เช่น วิทยาศาสตร์ ศิลปะ" }
    hints:
      - "อะไรทำให้ว่าวลอยขึ้น"
      - "ลมดันว่าวด้วยแรง"
    solution: "การที่ว่าวลอยขึ้นเกิดจากแรงที่ลมกระทำต่อตัวว่าว จึงเชื่อมโยงกับวิทยาศาสตร์เรื่องแรงและลม (และศิลปะในการตกแต่งว่าว)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.recreation.p008
    topics: [health.movement.recreation]
    difficulty: 3
    type: text
    stem: "การอ่านนิทานบนเปลใต้ต้นไม้ เป็นนันทนาการแบบใช้แรง หรือแบบนั่งพัก (ตอบ \"ใช้แรง\" หรือ \"นั่งพัก\")"
    accepted: ["นั่งพัก", "แบบนั่งพัก"]
    misconceptions:
      - { match: "ใช้แรง", feedback: "การอ่านหนังสือแทบไม่ได้ขยับร่างกาย จึงเป็นนันทนาการแบบนั่งพัก" }
    hints:
      - "ระหว่างอ่านนิทาน ร่างกายเคลื่อนไหวมากหรือน้อย"
      - "ใช้แรงคือขยับร่างกายมาก เช่น เล่นกีฬา"
    solution: "อ่านนิทานเป็นนันทนาการแบบนั่งพัก ช่วยผ่อนคลายและพัฒนาสติปัญญา ควรสลับกับกิจกรรมที่ขยับร่างกาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.recreation.p009
    topics: [health.movement.recreation]
    difficulty: 3
    type: numeric
    stem: "ชมรมของโรงเรียนจัดกิจกรรมพับกระดาษให้น้อง ป.2 จำนวน 30 คน ค่ากระดาษและอุปกรณ์รวม 450 บาท เฉลี่ยค่าอุปกรณ์คนละกี่บาท (ตอบเป็นตัวเลขในหน่วยบาท)"
    answer: { value: 15, unit: บาท }
    misconceptions:
      - { match: 13500, feedback: "ต้องหารค่าใช้จ่ายด้วยจำนวนคน ไม่ใช่คูณ" }
      - { match: 0.07, feedback: "หารกลับด้าน ต้องเอาค่าใช้จ่าย (450) หารด้วยจำนวนคน (30)" }
    hints:
      - "เฉลี่ยต่อคน = ค่าใช้จ่ายทั้งหมด ÷ จำนวนคน"
      - "450 ÷ 30"
    solution: "$450 \\div 30 = 15$ บาทต่อคน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.recreation.p010
    topics: [health.movement.recreation]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "วันลอยกระทง ดาวนั่งทำกระทงจากใบตองกับยายที่บ้าน กิจกรรมนี้ให้ประโยชน์ด้านใดบ้าง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ได้ฝึกความคิดสร้างสรรค์และทักษะการใช้มือ", correct: true }
      - { id: b, text: "ครอบครัวได้ใช้เวลาร่วมกัน", correct: true }
      - { id: c, text: "ได้เรียนรู้วัฒนธรรมและประเพณีไทย", correct: true }
      - { id: d, text: "ทำให้ไม่ต้องไปโรงเรียน", feedback: "นันทนาการทำในเวลาว่าง ไม่ได้แทนการเรียน" }
    hints:
      - "ประโยชน์ของนันทนาการมีทั้งด้านสติปัญญา สังคม และวัฒนธรรม"
      - "ข้อที่ถูกมีสามข้อ"
    solution: "การทำกระทงช่วยฝึกความคิดสร้างสรรค์และมือ ทำให้ครอบครัวใกล้ชิด และสืบทอดประเพณี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.recreation.p011
    topics: [health.movement.recreation]
    difficulty: 4
    type: order
    stem: "นักเรียน ม.3 จะจัดกิจกรรมนันทนาการให้ผู้สูงอายุในชุมชน เรียงขั้นตอนการจัดกิจกรรม"
    items:
      - "กำหนดเป้าหมายและกลุ่มผู้ร่วม"
      - "เลือกกิจกรรมให้เหมาะกับวัยและความสามารถของผู้สูงอายุ"
      - "เตรียมสถานที่ อุปกรณ์ งบประมาณ และแผนความปลอดภัย"
      - "ดำเนินกิจกรรม"
      - "ประเมินผลและสรุปสิ่งที่จะปรับปรุง"
    hints:
      - "ต้องรู้ก่อนว่าจัดเพื่ออะไรและให้ใคร จึงเลือกกิจกรรมได้"
      - "การประเมินผลทำหลังจัดกิจกรรมแล้ว"
    solution: "กำหนดเป้าหมาย → เลือกกิจกรรม → เตรียมความพร้อม → ดำเนินกิจกรรม → ประเมินผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.recreation.p012
    topics: [health.movement.recreation]
    difficulty: 4
    type: numeric
    stem: "จากกราฟเวลาว่างของเจได ถ้าเจไดลดเวลาดูจอลงครึ่งหนึ่ง แล้วนำเวลาที่ลดได้ทั้งหมดไปเล่นกีฬากับเพื่อน เวลาเล่นกีฬาจะเป็นกี่ชั่วโมงต่อสัปดาห์ (ตอบเป็นตัวเลขในหน่วยชั่วโมง)"
    figure:
      src: free-time.svg
      alt: "กราฟแท่งแนวนอน เวลาว่างใน 1 สัปดาห์ของเจได เป็นชั่วโมง ดูจอเพื่อความบันเทิง 14 เล่นกีฬากับเพื่อน 4 ช่วยงานบ้าน 3 อ่านการ์ตูนและนิทาน 2 ฝึกเล่นดนตรี 1"
    answer: { value: 11, unit: ชั่วโมง }
    misconceptions:
      - { match: 7, feedback: "7 ชั่วโมงคือเวลาที่ลดได้ ต้องบวกกับเวลาเล่นกีฬาเดิม 4 ชั่วโมง" }
      - { match: 18, feedback: "ย้ายเวลาดูจอทั้งหมด 14 ชั่วโมง แต่โจทย์ลดเพียงครึ่งหนึ่ง" }
    hints:
      - "ครึ่งหนึ่งของ 14 ชั่วโมงคือเท่าใด"
      - "บวกเวลาที่ลดได้กับเวลาเล่นกีฬาเดิม"
    solution: "ลดเวลาดูจอ $14 \\div 2 = 7$ ชั่วโมง เวลาเล่นกีฬา $4 + 7 = 11$ ชั่วโมงต่อสัปดาห์ หรือเฉลี่ยประมาณวันละ 1.6 ชั่วโมง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.movement.recreation.p013
    topics: [health.movement.recreation]
    difficulty: 4
    type: mcq
    stem: "นักเรียนจะจัดกิจกรรมนันทนาการให้ผู้สูงอายุที่ศาลาวัดในชุมชน ซึ่งส่วนใหญ่อายุมากกว่า 70 ปี บางคนเดินไม่คล่อง กิจกรรมใดเหมาะสมที่สุด"
    choices:
      - { id: a, text: "ร้องเพลงพื้นบ้านและรำวงจังหวะช้า ๆ ที่นั่งเก้าอี้ร่วมได้", correct: true }
      - { id: b, text: "วิ่งผลัดแข่งขันระยะ 100 เมตร", feedback: "ผู้สูงอายุที่เดินไม่คล่องเสี่ยงหกล้ม และการแข่งขันอาจกดดัน" }
      - { id: c, text: "เกมกระโดดเชือกทีมละ 10 คน", feedback: "การกระโดดเสี่ยงต่อข้อเข่าและการล้มของผู้สูงอายุ" }
      - { id: d, text: "ปีนหน้าผาจำลอง", feedback: "ต้องใช้กำลังมากและอันตรายสำหรับผู้สูงอายุ" }
    hints:
      - "เลือกให้เหมาะกับวัย ความสามารถ และปลอดภัย"
      - "ผู้ที่เดินไม่คล่องต้องร่วมได้ด้วย"
    solution: "เพลงพื้นบ้านและรำวงจังหวะช้าที่นั่งร่วมได้ เหมาะกับวัยและความสามารถ ปลอดภัย และทุกคนมีส่วนร่วม"
