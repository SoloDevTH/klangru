id: computer.data.data-preparation
subject: computer
title: { th: "เตรียมข้อมูลด้วยโปรแกรม: ทำความสะอาด แปลง และรวมแหล่ง", en: "Preparing data with code: cleaning, transforming and combining sources" }
summary: อ่านเมทาดาทาและพจนานุกรมข้อมูล ตรวจและทำความสะอาดข้อมูล จัดการค่าที่หายไป แปลงรูปแบบ และรวมหลายตารางด้วยคีย์ร่วมให้พร้อมวิเคราะห์
difficulty: 5.5
minutes: 40
prerequisites: [computer.programming.files-exceptions, computer.data.data-processing]
encompasses:
  - { id: computer.data.data-processing, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: cleaning-pipeline.svg
    alt: "ห้ากล่องเรียงจากซ้ายไปขวา กล่องแรกคือไฟล์ดิบจากแบบฟอร์มและบันทึกห้องสมุด กล่องที่สองคือตรวจชนิด ช่วง และความสอดคล้อง กล่องที่สามคือทำความสะอาดข้อความและค่าที่หายไป กล่องที่สี่คือรวมตารางด้วยคีย์ร่วมรหัสนักเรียน กล่องที่ห้าคือข้อมูลพร้อมวิเคราะห์และบันทึกทุกขั้น มีลูกศรชี้จากกล่องหนึ่งไปกล่องถัดไป"
    caption: "ขั้นตอนเตรียมข้อมูลตามลำดับ ควรบันทึกกฎที่ใช้ในทุกขั้น"
  - type: worked-example
    title: เติมค่าที่หายไปด้วยค่าเฉลี่ย แล้วความกระจายเปลี่ยนไปอย่างไร
    problem: "คะแนนสอบวิชาสมมติของนักเรียนห้าคนคือ 8, 6, ว่าง, 9 และ 7 ถ้าเติมค่าที่หายไปด้วยค่าเฉลี่ยของคนที่มีคะแนน ค่าเฉลี่ยของทั้งห้าคนจะเปลี่ยนไปหรือไม่ และความกระจายจะเปลี่ยนอย่างไร"
    steps:
      - text: "หาค่าเฉลี่ยของคนที่มีคะแนนก่อน: (8 + 6 + 9 + 7) ÷ 4 = 30 ÷ 4 = 7.5"
        why: "ค่าที่เติมต้องมาจากข้อมูลที่มีจริง ไม่ใช่ค่าที่เดาเอง"
      - text: "เติม 7.5 ลงช่องที่ว่าง ได้คะแนน 8, 6, 7.5, 9, 7 รวมเป็น 37.5"
      - text: "ค่าเฉลี่ยใหม่คือ 37.5 ÷ 5 = 7.5 เท่าเดิม เพราะค่าที่เติมเท่ากับค่าเฉลี่ยพอดี"
      - text: "ความกระจายลดลง ระยะของค่าจากเฉลี่ยเดิมคือ 0.5, −1.5, 1.5, −0.5 ยกกำลังสองรวมได้ 5 หารด้วย 4 ได้ความแปรปรวน 1.25 เมื่อเติมค่าที่อยู่ตรงกลางเข้าไปอีกหนึ่งค่า หารด้วย 5 ได้ 1.0"
        why: "ค่าที่เติมไม่ได้เพิ่มการกระจาย จึงทำให้ข้อมูลดูแน่นกว่าความเป็นจริง"
    answer: "ค่าเฉลี่ยไม่เปลี่ยนคือ 7.5 แต่ความแปรปรวนลดลงจาก 1.25 เป็น 1.0 การเติมค่าเฉลี่ยจึงทำให้ข้อมูลดูแน่นเกินจริง"
  - { type: check, problem: computer.data.data-preparation.p008, prompt: "ลองเลือกสิ่งที่ควรตรวจก่อนนำข้อมูลไปคำนวณ" }
  - type: worked-example
    title: รวมตารางสองแหล่งด้วยคีย์ร่วม (inner join) (ข้อมูลสมมติ)
    problem: "ตาราง A มีรหัส 101 สมชาย รหัส 102 สมหญิง และรหัส 103 วิชัย ตาราง B มีรหัส 102 เวลาอ่าน 3 ชั่วโมง รหัส 103 เวลาอ่าน 1.5 ชั่วโมง และรหัส 104 เวลาอ่าน 2 ชั่วโมง ถ้ารวมแบบ inner join จะได้แถวใดบ้าง"
    steps:
      - text: "ตรวจรูปแบบคีย์ก่อน ทั้งสองตารางเก็บรหัสเป็นตัวเลขสามหลักเหมือนกัน จึงจับคู่ได้"
        why: "ถ้ารหัสฝั่งหนึ่งเป็นข้อความที่มีช่องว่าง การจับคู่จะพลาดทั้งที่เป็นคนเดียวกัน"
      - text: "หารหัสที่อยู่ในทั้งสองตาราง รหัส 101 มีในตาราง A แต่ไม่มีในตาราง B จึงตัดออก รหัส 104 มีในตาราง B แต่ไม่มีในตาราง A จึงตัดออกเช่นกัน"
      - text: "เหลือรหัส 102 และ 103 รวมแถวได้ สมหญิง เวลาอ่าน 3 ชั่วโมง และ วิชัย เวลาอ่าน 1.5 ชั่วโมง"
      - text: "บันทึกรหัส 104 ไว้ให้ทีมตรวจว่ามีเวลาอ่านแต่ไม่มีชื่อในบันทึกของแบบฟอร์ม"
        why: "การตัดแถวโดยไม่บันทึกทำให้ไม่รู้ว่าข้อมูลหายไปเพราะอะไร"
    answer: "ได้สองแถว คือรหัส 102 สมหญิง และรหัส 103 วิชัย"
  - { type: check, problem: computer.data.data-preparation.p007, prompt: "จับคู่ปัญหาของข้อมูลกับวิธีแก้" }
glossary:
  - { term: เมทาดาทา (metadata), definition: "ข้อมูลที่บอกว่าข้อมูลอื่นคืออะไร เช่น ชื่อคอลัมน์ ชนิด หน่วย ช่วงค่าที่ยอมรับ และวันที่เก็บ" }
  - { term: พจนานุกรมข้อมูล (data dictionary), definition: "ตารางที่รวบรวมเมทาดาทาของทุกคอลัมน์ในชุดข้อมูลไว้ในที่เดียว" }
  - { term: การเตรียมข้อมูล (data preparation), definition: "ขั้นตอนตรวจ ทำความสะอาด แปลง และรวมข้อมูลให้พร้อมสำหรับการวิเคราะห์หรือการเรียนรู้ของเครื่อง" }
  - { term: คีย์ร่วม (join key), definition: "คอลัมน์ที่มีค่าเดียวกันในสองตาราง ใช้จับคู่แถวของทั้งสองตารางเข้าด้วยกัน" }
  - { term: inner join, definition: "การรวมตารางที่เก็บเฉพาะแถวซึ่งคีย์อยู่ในทั้งสองตาราง" }
  - { term: ค่าที่หายไป (missing value), definition: "ช่องข้อมูลที่ไม่มีค่า ซึ่งต่างจากการมีค่าเป็นศูนย์ และต้องจัดการแยกกัน" }
flashcards:
  - { front: "เมทาดาทาคืออะไร", back: "ข้อมูลที่บอกว่าข้อมูลอื่นคืออะไร เช่น ชื่อคอลัมน์ ชนิด หน่วย และช่วงค่าที่ยอมรับ" }
  - { front: "ทำไมต้องตัดช่องว่างและแปลงตัวพิมพ์ก่อนเปรียบเทียบข้อความ", back: "เพราะ 'Book Bee ' กับ 'book bee' เป็นค่าเดียวกันในความหมาย แต่โปรแกรมจะถือว่าต่างกัน" }
  - { front: "inner join เก็บแถวแบบใด", back: "เก็บเฉพาะแถวที่คีย์อยู่ในทั้งสองตาราง" }
  - { front: "เติมค่าที่หายไปด้วยค่าเฉลี่ย มีผลอย่างไร", back: "ค่าเฉลี่ยไม่เปลี่ยน แต่ความกระจายจะลดลง ข้อมูลจึงดูแน่นกว่าจริง" }
  - { front: "ค่าว่างกับค่าศูนย์ต่างกันอย่างไร", back: "ค่าว่างคือไม่มีข้อมูล ค่าศูนย์คือมีข้อมูลที่เป็นศูนย์ การเติมศูนย์แทนค่าว่างจึงสร้างข้อมูลเท็จ" }
