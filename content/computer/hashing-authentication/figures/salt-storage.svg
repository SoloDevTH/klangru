<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260"><title>ตารางจัดเก็บสองแถว รหัสเดียวกันแต่ซอลต์ต่างกันทำให้ค่าแฮชต่างกัน</title><rect width="720" height="260" fill="#ffffff"/><rect x="40" y="20" width="640" height="40" rx="0" fill="#e5e7eb" stroke="#374151" stroke-width="1.2"/><text x="70" y="45" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">ผู้ใช้</text><text x="190" y="45" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">ซอลต์</text><text x="360" y="45" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">แฮชที่เก็บ (ย่อ)</text><rect x="40" y="60" width="640" height="44" rx="0" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><text x="70" y="88" font-family="sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="normal">ฝน</text><text x="190" y="88" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="normal">salt-A</text><text x="360" y="88" font-family="sans-serif" font-size="14" fill="#1d4ed8" text-anchor="start" font-weight="normal">c94a5845cf3e8c32ccd1fb57…</text><rect x="40" y="110" width="640" height="44" rx="0" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><text x="70" y="138" font-family="sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="normal">ปาน</text><text x="190" y="138" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="normal">salt-B</text><text x="360" y="138" font-family="sans-serif" font-size="14" fill="#1d4ed8" text-anchor="start" font-weight="normal">89eb0f79e88e31621fc81b6f…</text><text x="360" y="180" font-family="sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="normal">รหัสผ่านทั้งสองเหมือนกัน แต่ซอลต์ต่างกัน</text><text x="360" y="202" font-family="sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="normal">จึงได้แฮชต่างกัน เซิร์ฟเวอร์ไม่เก็บรหัสผ่านจริง</text><text x="360" y="240" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">ตัวอย่างใช้ PBKDF2-HMAC-SHA256 จำนวน 1000 รอบ เพื่อการสาธิตเท่านั้น</text></svg>
