      - "เก็บน้ำส่วนเกินไว้ และลดความต้องการใช้น้ำ"
    solution: "เก็บน้ำฝนในฤดูฝนไว้ในสระ และปลูกพืชใช้น้ำน้อยในหน้าแล้ง ช่วยทั้งเพิ่มน้ำที่มีและลดน้ำที่ต้องใช้ ชาวบ้านทำได้เอง"
