  stem: แหล่งกำเนิดเสียงทรงกลมให้กำลังเสียง $P = 0.50\,\mathrm{W}$ ที่ตำแหน่งใดห่างจากแหล่งจึงได้ความเข้มเสียง $I = 1.0\times10^{-5}\,\mathrm{W/m^2}$ ตอบเป็นเมตร
  hints:
  - ความเข้มสำหรับแหล่งทรงกลมคือ $I = \dfrac{P}{4\pi r^2}$
  - จัดรูปให้ $r$ อยู่ข้างเดียวในรูปรากที่สอง
  - ตรวจว่าค่าที่ได้เป็นเมตรและอยู่ไกลกว่าลำโพงในข้อ 12 มาก
