id: earthscience.astronomy.sky-day-night
subject: earthscience
title: { th: ท้องฟ้า กลางวันกลางคืน และทิศ, en: "The sky, day and night, and directions" }
summary: ดวงอาทิตย์ ดวงจันทร์ และดาวที่เห็นตอนกลางวันและกลางคืน เหตุที่ไม่เห็นดาวตอนกลางวัน การขึ้นตกของดวงอาทิตย์ กลางวันกลางคืน การหาทิศ และประโยชน์ของดวงอาทิตย์
difficulty: 1.2
minutes: 25
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: เส้นทางของดวงอาทิตย์ในหนึ่งวัน
    src: sun-path.svg
    alt: "ภาพท้องฟ้าและพื้นดิน มีคนยืนตรงกลางหันหน้าไปทางทิศใต้ ทางซ้ายของภาพคือทิศตะวันออก ดวงอาทิตย์ขึ้น ทางขวาคือทิศตะวันตก ดวงอาทิตย์ตก เส้นประโค้งเป็นรูปครึ่งวงกลมมีลูกศรไปทางขวา ตอนเช้าดวงอาทิตย์อยู่ต่ำทางซ้าย ตอนเที่ยงอยู่สูงตรงกลาง ตอนเย็นอยู่ต่ำทางขวา"
    caption: "ภาพแบบง่าย ทางที่ดวงอาทิตย์ผ่านเปลี่ยนไปเล็กน้อยตามฤดู ในประเทศไทยบางช่วงของฤดูร้อนและฤดูฝน ดวงอาทิตย์ตอนเที่ยงค่อนไปทางทิศเหนือ (วาดโดยทีมคลังรู้)"
  - { type: check, problem: earthscience.astronomy.sky-day-night.p006, prompt: "เงาอยู่ด้านตรงข้ามกับดวงอาทิตย์เสมอ" }
  - type: figure
    title: กลางวันและกลางคืน
    src: day-night.svg
    alt: "ดวงอาทิตย์อยู่ทางซ้าย มีลูกศรแสงส่องไปทางขวาถึงโลก โลกครึ่งซ้ายที่หันหาดวงอาทิตย์เป็นสีฟ้า เขียนว่า กลางวัน ด้านที่หันหาดวงอาทิตย์ ครึ่งขวาเป็นสีมืด เขียนว่า กลางคืน ด้านที่หันหนีดวงอาทิตย์ มีลูกศรโค้งสีแดงใต้โลก ข้อความว่า โลกหมุนรอบตัวเองจากทิศตะวันตกไปทิศตะวันออก รอบละ 1 วัน"
    caption: "ดวงอาทิตย์ส่องโลกได้ทีละครึ่งลูก โลกหมุนรอบตัวเอง แต่ละที่จึงผ่านกลางวันและกลางคืนสลับกัน (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: worked-example
    title: ทำไมเราเห็นดวงอาทิตย์ขึ้นทางตะวันออก
    problem: "น้องบอกว่า ดวงอาทิตย์เดินข้ามท้องฟ้าทุกวัน ใช้แบบจำลองไฟฉายกับลูกโลกอธิบายว่าที่จริงเกิดอะไรขึ้น"
    steps:
      - text: "ให้ไฟฉายเป็นดวงอาทิตย์ ลูกโลกเป็นโลก ไฟฉายส่องลูกโลกได้แค่ครึ่งลูก ด้านที่สว่างคือกลางวัน ด้านที่มืดคือกลางคืน"
      - text: "หมุนลูกโลกจากทิศตะวันตกไปทิศตะวันออก สติกเกอร์ที่ประเทศไทยค่อย ๆ หมุนจากด้านมืดเข้าหาแสง นี่คือตอนเช้า"
        why: "โลกหมุนไปทางตะวันออก ทางตะวันออกของเราจึงหันเข้าหาดวงอาทิตย์ก่อน"
      - text: "หมุนต่อ สติกเกอร์หันตรงเข้าหาไฟฉาย นี่คือตอนเที่ยง แล้วหมุนออกไปด้านมืด นี่คือตอนเย็น"
      - text: "หมุนครบหนึ่งรอบใช้เวลาประมาณ 24 ชั่วโมง ไฟฉายไม่ได้ขยับเลย"
    answer: "ดวงอาทิตย์ไม่ได้เดินข้ามท้องฟ้า โลกหมุนรอบตัวเองไปทางตะวันออก เราจึงเห็นดวงอาทิตย์ขึ้นทางตะวันออก และเกิดกลางวันกลางคืนสลับกันทุกวัน"
  - { type: check, problem: earthscience.astronomy.sky-day-night.p014, prompt: "ด้านสว่างคือกลางวัน ด้านมืดคือกลางคืน" }
  - type: figure
    title: หาทิศจากดวงอาทิตย์ตอนเช้า
    src: directions.svg
    alt: "ภาพมองจากด้านบน เรายืนอยู่ตรงกลาง หันหน้าไปทางดวงอาทิตย์ขึ้น ลูกศรข้างหน้าชี้ทิศตะวันออก ลูกศรข้างหลังชี้ทิศตะวันตก ลูกศรทางมือซ้ายชี้ทิศเหนือ ลูกศรทางมือขวาชี้ทิศใต้"
    caption: "ห้ามมองดวงอาทิตย์ตรง ๆ ให้ดูว่าแสงมาจากทางไหนแทน (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: หาทิศของประตูห้องเรียน
    problem: "ตอนเช้าแสงแดดส่องเข้ามาทางหน้าต่างด้านหลังห้องเรียน ประตูอยู่ตรงข้ามกับหน้าต่างนั้น ประตูอยู่ทางทิศใด"
    steps:
      - text: "ตอนเช้าดวงอาทิตย์อยู่ทางทิศตะวันออก แสงที่ส่องเข้าหน้าต่างจึงมาจากทิศตะวันออก หน้าต่างด้านหลังหันไปทางทิศตะวันออก"
      - text: "ประตูอยู่ตรงข้ามกับหน้าต่าง ทิศที่อยู่ตรงข้ามกับทิศตะวันออกคือทิศตะวันตก"
        why: "ทิศตะวันออกกับทิศตะวันตกอยู่ตรงข้ามกัน เหมือนข้างหน้ากับข้างหลัง"
    answer: "ประตูอยู่ทางทิศตะวันตก"
  - { type: check, problem: earthscience.astronomy.sky-day-night.p009, prompt: "หันหน้าไปทางทิศตะวันออก แล้วดูมือขวา" }
glossary:
  - { term: ดาวฤกษ์, definition: "ดาวที่มีแสงในตัวเอง เช่น ดวงอาทิตย์ และดาวส่วนใหญ่ที่เห็นตอนกลางคืน" }
  - { term: ขอบฟ้า, definition: "เส้นที่ท้องฟ้าดูเหมือนบรรจบกับพื้นดินหรือพื้นน้ำ" }
  - { term: การหมุนรอบตัวเองของโลก, definition: "โลกหมุนจากทิศตะวันตกไปทิศตะวันออก ครบรอบในเวลาประมาณ 24 ชั่วโมง ทำให้เกิดกลางวันกลางคืน" }
  - { term: ทิศหลัก, definition: "ทิศเหนือ ทิศใต้ ทิศตะวันออก และทิศตะวันตก" }
  - { term: เงา, definition: "บริเวณมืดด้านหลังวัตถุที่บังแสง อยู่ด้านตรงข้ามกับแหล่งแสงเสมอ" }
flashcards:
  - { front: "ทำไมกลางวันไม่เห็นดาว", back: "ดาวยังอยู่ แต่แสงอาทิตย์ทำให้ท้องฟ้าสว่างจนกลบแสงดาว" }
  - { front: "กลางวันกลางคืนเกิดจากอะไร", back: "โลกหมุนรอบตัวเอง ด้านที่หันหาดวงอาทิตย์เป็นกลางวัน ด้านที่หันหนีเป็นกลางคืน" }
  - { front: "หันหน้าไปทางดวงอาทิตย์ขึ้น มือซ้ายคือทิศอะไร", back: "ทิศเหนือ (มือขวาคือทิศใต้ ข้างหลังคือทิศตะวันตก)" }
  - { front: "เงาตอนเช้าชี้ไปทางไหน", back: "ทิศตะวันตก เพราะดวงอาทิตย์อยู่ทางทิศตะวันออก" }
