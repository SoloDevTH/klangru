  <line x1="335.0" y1="70.0" x2="377.0" y2="70.0" stroke="#15211e" stroke-width="1.8" stroke-linecap="butt"/>
  <polygon points="385.0,70.0 377.0,73.6 377.0,66.4" fill="#15211e"/>
  <text x="392.0" y="75.0" fill="#15211e" font-size="13" text-anchor="start" font-weight="bold">E</text>
