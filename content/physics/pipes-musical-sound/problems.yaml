  - id: physics.waves.pipes-musical-sound.p021
    topics: [physics.waves.pipes-musical-sound]
    difficulty: 4
    type: numeric
    stem: 'นักเรียนทำขลุ่ยของเล่นจากท่อพีวีซีปลายเปิดสองด้าน ยาว $0.30\,\mathrm{m}$ รัศมีภายใน $1.0\,\mathrm{cm}$ อัตราเร็วเสียง $343\,\mathrm{m/s}$ เมื่อคิดการแก้ปลายท่อ $0.6r$ ที่ปลายเปิดแต่ละด้าน ความถี่มูลฐานเป็นกี่เฮิรตซ์ (ตอบทศนิยม 1 ตำแหน่ง)'
    answer: { value: 549.7, tolerance: 0.5, unit: Hz }
    hints:
      - 'ท่อปลายเปิดสองด้านมีปลายเปิดสองปลาย จึงต้องเพิ่มความยาว $0.6r$ สองครั้ง'
      - 'ความยาวยังผลคือ $L + 2(0.6r)$ แล้วใช้แทน $L$ ในสูตร $f_1 = \frac{v}{2L}$'
    misconceptions:
      - { match: 571.7, feedback: 'ยังไม่ได้คิดการแก้ปลายท่อ ใช้ความยาวจริง $0.30\,\mathrm{m}$' }
      - { match: 560.5, feedback: 'เพิ่มการแก้ปลายท่อเพียงด้านเดียว ท่อนี้เปิดทั้งสองปลาย' }
    solution: 'ความยาวยังผล $L_{\text{eff}} = 0.30 + 2 \times 0.6 \times 0.010 = 0.312\,\mathrm{m}$ จึงได้ $f_1 = \frac{343}{2 \times 0.312} \approx 549.7\,\mathrm{Hz}$ ต่ำกว่าค่าที่ไม่แก้ปลายท่อ ($571.7\,\mathrm{Hz}$) เล็กน้อย'
    license: CC-BY-SA-4.0
    ai_assisted: true
