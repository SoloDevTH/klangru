problems:
  - id: math.ctr.p001
    topics: [math.stats.central-tendency]
    difficulty: 1
    type: numeric
    stem: "จงหาค่าเฉลี่ยเลขคณิตของข้อมูล 2, 4, 9, 11, 14"
    answer: { value: 8 }
    hints:
      - "ค่าเฉลี่ย = ผลรวมของข้อมูล ÷ จำนวนข้อมูล"
      - "รวมข้อมูลทั้ง 5 ตัว แล้วหารด้วย 5"
    misconceptions:
      - { match: 40, feedback: "นั่นคือผลรวม ยังต้องหารด้วยจำนวนข้อมูล 5 ตัว" }
      - { match: 9, feedback: "นั่นคือมัธยฐาน (ตัวตรงกลาง) ค่าเฉลี่ยต้องรวมทุกตัวแล้วหาร" }
    solution: "$\\bar{x} = \\dfrac{2 + 4 + 9 + 11 + 14}{5} = \\dfrac{40}{5} = 8$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ctr.p002
    topics: [math.stats.central-tendency]
    difficulty: 1
    type: numeric
    stem: "จงหาฐานนิยมของข้อมูล 2, 7, 7, 8, 9, 10, 12"
    answer: { value: 7 }
    hints:
      - "ฐานนิยมคือค่าที่ปรากฏบ่อยที่สุด"
      - "นับว่าแต่ละค่าปรากฏกี่ครั้ง แล้วตอบค่าที่มีจำนวนครั้งมากที่สุด"
    misconceptions:
      - { match: 2, feedback: "นั่นคือจำนวนครั้งที่ 7 ปรากฏ ฐานนิยมคือตัวค่า ไม่ใช่ความถี่" }
      - { match: 8, feedback: "นั่นคือมัธยฐาน (ตัวตรงกลางของ 7 ตัว) ฐานนิยมคือค่าที่ซ้ำบ่อยที่สุด" }
    solution: "7 ปรากฏ 2 ครั้ง ค่าอื่นปรากฏครั้งเดียว ฐานนิยมจึงเป็น 7"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ctr.p003
    topics: [math.stats.central-tendency]
    difficulty: 2
    type: numeric
    stem: "จงหามัธยฐานของข้อมูล 12, 5, 9, 20, 7, 15"
    answer: { value: 10.5, tolerance: 0.01 }
    hints:
      - "เรียงข้อมูลจากน้อยไปมากก่อนเสมอ"
      - "ข้อมูลมี 6 ตัว (จำนวนคู่) จึงมีสองตัวอยู่ตรงกลาง"
      - "หาค่าเฉลี่ยของข้อมูลตำแหน่งที่ 3 และ 4"
    misconceptions:
      - { match: 14.5, feedback: "หยิบสองตัวตรงกลางจากรายการที่ยังไม่ได้เรียง (9 กับ 20) ต้องเรียงข้อมูลก่อน" }
      - { match: 9, feedback: "เลือกตัวตรงกลางเพียงตัวเดียว ข้อมูลมีจำนวนคู่จึงต้องเฉลี่ยสองตัวตรงกลาง" }
    solution: "เรียงได้ 5, 7, 9, 12, 15, 20 สองตัวตรงกลางคือ 9 กับ 12 มัธยฐาน $= \\dfrac{9 + 12}{2} = 10.5$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ctr.p004
    topics: [math.stats.central-tendency]
    difficulty: 2
    type: mcq
    stem: "มัธยฐานของข้อมูล 8, 2, 9, 1, 6 คือข้อใด"
    choices:
      - { id: a, text: "6", correct: true }
      - { id: b, text: "9", feedback: "9 คือตัวกลางของรายการตามที่เขียนมา ซึ่งยังไม่ได้เรียง ต้องเรียงจากน้อยไปมากก่อน" }
      - { id: c, text: "5.2", feedback: "5.2 คือค่าเฉลี่ยเลขคณิต ($\\tfrac{26}{5}$) ไม่ใช่มัธยฐาน" }
      - { id: d, text: "5", feedback: "5 คือค่าเฉลี่ยของค่าต่ำสุดกับสูงสุด ($\\tfrac{1 + 9}{2}$) มัธยฐานต้องเรียงข้อมูลทุกตัวแล้วหาตัวตรงกลาง" }
    hints:
      - "ขั้นแรกของการหามัธยฐานคืออะไร"
      - "เรียงข้อมูลจากน้อยไปมาก แล้วหาตำแหน่งที่ $\\tfrac{N + 1}{2}$"
    solution: "เรียงได้ 1, 2, 6, 8, 9 ข้อมูล 5 ตัว ตัวตรงกลางคือตำแหน่งที่ 3 ได้ 6"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ctr.p005
    topics: [math.stats.central-tendency]
    difficulty: 2
    type: match
    stem: "ข้อมูลชุดหนึ่งคือ 2, 3, 3, 5, 7, 10 จับคู่ค่ากลางแต่ละแบบกับค่าที่ถูกต้อง"
    pairs:
      - { left: "ค่าเฉลี่ยเลขคณิต", right: "5" }
      - { left: "มัธยฐาน", right: "4" }
      - { left: "ฐานนิยม", right: "3" }
    hints:
      - "ข้อมูลเรียงไว้แล้ว และมี 6 ตัว"
      - "ค่าเฉลี่ยใช้ผลรวม มัธยฐานเฉลี่ยสองตัวตรงกลาง ฐานนิยมดูค่าที่ซ้ำ"
    solution: "ค่าเฉลี่ย $= \\tfrac{30}{6} = 5$ | มัธยฐาน $= \\tfrac{3 + 5}{2} = 4$ | ฐานนิยม $= 3$ (ปรากฏ 2 ครั้ง)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ctr.p006
    topics: [math.stats.central-tendency]
    difficulty: 3
    type: numeric
    stem: "นักเรียนคนหนึ่งได้เกรดดังนี้: คณิตศาสตร์ 1.5 หน่วยกิต เกรด 4, วิทยาศาสตร์ 1.5 หน่วยกิต เกรด 3, ภาษาไทย 1.0 หน่วยกิต เกรด 3.5 และพลศึกษา 0.5 หน่วยกิต เกรด 2 เกรดเฉลี่ยของภาคเรียนนี้เท่ากับเท่าใด (ตอบเป็นทศนิยม 2 ตำแหน่ง)"
    answer: { value: 3.333, tolerance: 0.03 }
    hints:
      - "วิชาที่มีหน่วยกิตมากมีน้ำหนักมากกว่า จึงใช้ค่าเฉลี่ยถ่วงน้ำหนัก"
      - "คูณเกรดกับหน่วยกิตของแต่ละวิชา แล้วรวมกัน"
      - "หารผลรวมนั้นด้วยหน่วยกิตรวม"
    misconceptions:
      - { match: 3.125, feedback: "นั่นคือค่าเฉลี่ยของเกรดทั้ง 4 ตัวแบบธรรมดา แต่หน่วยกิตไม่เท่ากัน ต้องถ่วงน้ำหนักด้วยหน่วยกิต" }
      - { match: 3.75, feedback: "หารด้วยจำนวนวิชา (4) แทนหน่วยกิตรวม (4.5) ค่าเฉลี่ยถ่วงน้ำหนักต้องหารด้วยผลรวมของน้ำหนัก" }
    solution: "$\\sum wx = 1.5(4) + 1.5(3) + 1.0(3.5) + 0.5(2) = 6 + 4.5 + 3.5 + 1 = 15$ หน่วยกิตรวม $= 4.5$ เกรดเฉลี่ย $= \\dfrac{15}{4.5} \\approx 3.33$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ctr.p007
    topics: [math.stats.central-tendency]
    difficulty: 3
    type: numeric
    stem: "ข้อมูล 5 จำนวนมีค่าเฉลี่ย 12 ถ้าสี่จำนวนแรกคือ 10, 15, 8, 14 จำนวนที่ห้าคือเท่าใด"
    answer: { value: 13 }
    hints:
      - "ค่าเฉลี่ย 12 ของข้อมูล 5 จำนวน บอกอะไรเกี่ยวกับผลรวม"
      - "ผลรวมทั้งหมด $= 12 \\times 5$ แล้วลบผลรวมของสี่จำนวนที่รู้"
    misconceptions:
      - { match: 11.75, feedback: "นั่นคือค่าเฉลี่ยของสี่จำนวนแรก โจทย์ถามจำนวนที่ห้า ให้หาผลรวมทั้งหมดจากค่าเฉลี่ยก่อน" }
      - { match: 12, feedback: "จำนวนที่ห้าไม่จำเป็นต้องเท่ากับค่าเฉลี่ย ใช้ผลรวม $12 \\times 5 = 60$ ช่วยหา" }
    solution: "ผลรวมทั้งหมด $= 12 \\times 5 = 60$ ผลรวมสี่จำนวน $= 10 + 15 + 8 + 14 = 47$ จำนวนที่ห้า $= 60 - 47 = 13$ ตรวจ: $\\tfrac{60}{5} = 12$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ctr.p008
    topics: [math.stats.central-tendency]
    difficulty: 3
    type: mcq
    stem: "บริษัทเล็ก ๆ มีพนักงาน 9 คน เงินเดือน 8 คนอยู่ระหว่าง 15,000–20,000 บาท ส่วนเจ้าของบริษัทได้ 250,000 บาท ถ้าต้องการบอกว่า \"พนักงานทั่วไปได้เงินเดือนประมาณเท่าไร\" ควรใช้ค่าใด"
    choices:
      - { id: a, text: "มัธยฐาน", correct: true }
      - { id: b, text: "ค่าเฉลี่ยเลขคณิต", feedback: "เงินเดือน 250,000 บาทเป็นค่าผิดปกติที่ดึงค่าเฉลี่ยให้สูงกว่าเงินเดือนของพนักงานเกือบทุกคน" }
      - { id: c, text: "ฐานนิยม", feedback: "เงินเดือนแต่ละคนอาจไม่ซ้ำกันเลย ฐานนิยมจึงอาจไม่มี หรือไม่ได้บอกค่าทั่วไปของกลุ่ม" }
      - { id: d, text: "เงินเดือนสูงสุดลบต่ำสุด", feedback: "นั่นคือพิสัย ซึ่งวัดการกระจาย ไม่ใช่ค่ากลาง" }
    hints:
      - "มีข้อมูลตัวใดที่ต่างจากตัวอื่นมากผิดปกติหรือไม่"
      - "ค่ากลางแบบใดไม่ถูกค่าผิดปกติดึง"
    solution: "เงินเดือนของเจ้าของเป็นค่าผิดปกติ มัธยฐาน (ตัวที่ 5 เมื่อเรียง) จะอยู่ในช่วง 15,000–20,000 บาท ตรงกับพนักงานทั่วไป ส่วนค่าเฉลี่ยจะสูงกว่า 40,000 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ctr.p009
    topics: [math.stats.central-tendency]
    difficulty: 3
    type: numeric
    stem: "สำรวจนักเรียน 20 คนว่าไปตลาดนัดใกล้บ้านกี่ครั้งต่อสัปดาห์: 0 ครั้ง 3 คน, 1 ครั้ง 7 คน, 2 ครั้ง 6 คน, 3 ครั้ง 4 คน ค่าเฉลี่ยของจำนวนครั้งที่ไปตลาดนัดเป็นเท่าใด (ตอบเป็นทศนิยม 2 ตำแหน่ง)"
    answer: { value: 1.55, tolerance: 0.015, unit: ครั้งต่อสัปดาห์ }
    hints:
      - "จำนวนครั้งแต่ละค่าต้องนับซ้ำตามจำนวนคน ใช้ความถี่เป็นน้ำหนัก"
      - "หา $\\sum fx$ โดยคูณจำนวนครั้งกับจำนวนคนของแต่ละแถวแล้วรวม"
      - "หารด้วยจำนวนคนทั้งหมด $\\sum f$"
    misconceptions:
      - { match: 7.75, feedback: "หารด้วยจำนวนแถว (4) แต่ต้องหารด้วยจำนวนคนทั้งหมด (20)" }
      - { match: 5, feedback: "นั่นคือค่าเฉลี่ยของความถี่ ($\\tfrac{20}{4}$) ต้องเฉลี่ยจำนวนครั้ง โดยใช้ความถี่เป็นน้ำหนัก" }
    solution: "$\\sum fx = 0(3) + 1(7) + 2(6) + 3(4) = 0 + 7 + 12 + 12 = 31$ ค่าเฉลี่ย $= \\dfrac{31}{20} = 1.55$ ครั้งต่อสัปดาห์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ctr.p010
    topics: [math.stats.central-tendency]
    difficulty: 4
    type: numeric
    stem: "ตารางความถี่: ค่า 1 มีความถี่ 4, ค่า 2 มีความถี่ 6, ค่า 3 มีความถี่ 2, ค่า 4 มีความถี่ 5, ค่า 5 มีความถี่ 3 จงหามัธยฐานของข้อมูลชุดนี้"
    answer: { value: 2.5, tolerance: 0.01 }
    hints:
      - "ข้อมูลมีทั้งหมดกี่ตัว และตัวตรงกลางอยู่ตำแหน่งใด"
      - "มีข้อมูล 20 ตัว มัธยฐานคือค่าเฉลี่ยของตำแหน่งที่ 10 และ 11"
      - "ทำความถี่สะสม 4, 10, 12, ... เพื่อดูว่าตำแหน่งที่ 10 และ 11 ตกอยู่ที่ค่าใด"
    misconceptions:
      - { match: 3, feedback: "นั่นคือตัวกลางของค่า 1 ถึง 5 ในตาราง แต่ค่าแต่ละตัวมีความถี่ไม่เท่ากัน ต้องนับตำแหน่งตามความถี่" }
      - { match: 4, feedback: "นั่นคือมัธยฐานของความถี่ 2, 3, 4, 5, 6 ต้องหามัธยฐานของข้อมูล ไม่ใช่ของความถี่" }
    solution: "$N = 4 + 6 + 2 + 5 + 3 = 20$ ความถี่สะสม: ค่า 1 ถึงตำแหน่ง 4, ค่า 2 ถึงตำแหน่ง 10, ค่า 3 ถึงตำแหน่ง 12 ตำแหน่งที่ 10 คือ 2 และตำแหน่งที่ 11 คือ 3 มัธยฐาน $= \\dfrac{2 + 3}{2} = 2.5$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ctr.p011
    topics: [math.stats.central-tendency]
    difficulty: 4
    type: numeric
    stem: "ห้องเรียนหนึ่งมีนักเรียน 30 คนสอบได้คะแนนเฉลี่ย 64 คะแนน ต่อมานักเรียนที่ป่วยอีก 1 คนมาสอบย้อนหลัง ทำให้คะแนนเฉลี่ยของทั้ง 31 คนเป็น 65 คะแนน นักเรียนคนนี้สอบได้กี่คะแนน"
    answer: { value: 95, unit: คะแนน }
    hints:
      - "แปลงค่าเฉลี่ยเป็นผลรวมคะแนน: ผลรวม = ค่าเฉลี่ย × จำนวนคน"
      - "หาผลรวมคะแนนก่อนและหลังนักเรียนคนนี้สอบ"
      - "คะแนนของนักเรียนคนนี้คือผลต่างของผลรวมทั้งสอง"
    misconceptions:
      - { match: 65, feedback: "คะแนนของคนที่มาเพิ่มต้องสูงกว่าค่าเฉลี่ยใหม่มาก จึงจะดึงค่าเฉลี่ยของทั้งห้องขึ้นได้ 1 คะแนน ลองใช้ผลรวมคะแนนแทน" }
      - { match: 1, feedback: "นั่นคือค่าเฉลี่ยที่เพิ่มขึ้น ไม่ใช่คะแนนของนักเรียน ให้เปรียบเทียบผลรวมคะแนนก่อนและหลัง" }
    solution: "ผลรวมเดิม $= 30 \\times 64 = 1920$ ผลรวมใหม่ $= 31 \\times 65 = 2015$ คะแนนของนักเรียนคนนี้ $= 2015 - 1920 = 95$ คะแนน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ctr.p012
    topics: [math.stats.central-tendency]
    difficulty: 5
    type: numeric
    stem: "วิชาหนึ่งคิดคะแนนรวมจาก คะแนนเก็บ 30% สอบกลางภาค 30% และสอบปลายภาค 40% (ทุกส่วนคิดเต็ม 100) ต้นกล้าได้คะแนนเก็บ 80 และกลางภาค 70 ถ้าอยากได้คะแนนรวมอย่างน้อย 80 ต้องสอบปลายภาคได้อย่างน้อยกี่คะแนน"
    answer: { value: 87.5, tolerance: 0.5, unit: คะแนน }
    hints:
      - "คะแนนรวม $= 0.3(\\text{เก็บ}) + 0.3(\\text{กลางภาค}) + 0.4(\\text{ปลายภาค})$"
      - "ตั้งสมการ $0.3(80) + 0.3(70) + 0.4x = 80$"
      - "ย้ายส่วนที่รู้แล้วไปอีกข้าง แล้วหารด้วย 0.4"
    misconceptions:
      - { match: 90, feedback: "คิดเหมือนทั้งสามส่วนมีน้ำหนักเท่ากัน (ค่าเฉลี่ยธรรมดา) แต่ปลายภาคมีน้ำหนัก 40% ต้องใช้ค่าเฉลี่ยถ่วงน้ำหนัก" }
      - { match: 35, feedback: "นั่นคือ $0.4x$ ยังต้องหารด้วย 0.4 เพื่อหาคะแนนปลายภาค" }
    solution: "$0.3(80) + 0.3(70) + 0.4x = 80$ → $24 + 21 + 0.4x = 80$ → $0.4x = 35$ → $x = 87.5$ คะแนน ตรวจ: $24 + 21 + 0.4(87.5) = 80$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ctr.p013
    topics: [math.stats.central-tendency]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "ข้อความใดถูกต้อง (เลือกได้มากกว่าหนึ่งข้อ)"
    choices:
      - { id: a, text: "ถ้าบวก 5 เข้ากับข้อมูลทุกตัว ค่าเฉลี่ยและมัธยฐานจะเพิ่มขึ้น 5 ทั้งคู่", correct: true }
      - { id: b, text: "ถ้าคูณข้อมูลทุกตัวด้วย 2 ค่าเฉลี่ยจะเป็น 2 เท่าของเดิม", correct: true }
      - { id: c, text: "ค่าเฉลี่ยต้องเป็นค่าใดค่าหนึ่งในข้อมูลเสมอ", feedback: "ไม่จริง เช่น ค่าเฉลี่ยของ 1 กับ 2 คือ 1.5 ซึ่งไม่อยู่ในข้อมูล" }
