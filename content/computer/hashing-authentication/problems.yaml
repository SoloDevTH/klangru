  - id: computer.security.hashing-authentication.p018
    topics: [computer.security.hashing-authentication]
    difficulty: 5
    type: numeric
    stem: "รหัสยาว 8 ตัวอักษรจาก 62 ตัวอักษรมีพื้นที่รูปแบบ 62 ยกกำลัง 8 แบบ เมื่อเทียบเป็นจำนวนบิต ค่า log2 ของพื้นที่นี้เท่ากับเท่าไร (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 47.63, tolerance: 0.01 }
    hints:
      - "log2 ของผลคูณเท่ากับผลรวมของ log2 ของแต่ละตัวประกอบ"
      - "คูณ log2(62) ด้วย 8"
    misconceptions:
      - { match: 47, feedback: "47 เป็นการปัดลงของค่าจริง แต่โจทย์ขอทศนิยม 2 ตำแหน่ง" }
      - { match: 62, feedback: "62 คือจำนวนตัวอักษร ไม่ใช่จำนวนบิต" }
    solution: "$\\log_2(62^8) = 8 \\log_2 62 \\approx 8 \\times 5.954 = 47.63$ บิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

