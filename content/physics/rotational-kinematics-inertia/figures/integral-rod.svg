<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280" font-family="sans-serif">
  <title>แท่งยาวสม่ำเสมอที่แบ่งเป็นชิ้น dm ที่ระยะ x จากแกนกึ่งกลาง</title>
  <rect width="600" height="280" fill="#ffffff"/>
  <rect x="190.0" y="134.0" width="220.0" height="32" fill="#c9d9ee" stroke="#1d4f91" stroke-width="2"/>
  <rect x="348.4" y="134.0" width="13.2" height="32" fill="#f2b04a" stroke="#7a4b00" stroke-width="1.5"/>
  <circle cx="300.0" cy="150.0" r="6" fill="#c0392b"/>
  <line x1="300.0" y1="92.0" x2="300.0" y2="208.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="310.0" y="88.0" font-size="14" fill="#c0392b">แกนหมุน (ตั้งฉากกับหน้ากระดาษ)</text>
  <line x1="190.0" y1="210.0" x2="410.0" y2="210.0" stroke="#333" stroke-width="1.2"/>
  <line x1="190.0" y1="204.0" x2="190.0" y2="216.0" stroke="#333"/>
  <line x1="410.0" y1="204.0" x2="410.0" y2="216.0" stroke="#333"/>
  <text x="190.0" y="232.0" font-size="14" text-anchor="middle" fill="#333">x = −L/2</text>
  <text x="410.0" y="232.0" font-size="14" text-anchor="middle" fill="#333">x = +L/2</text>
  <line x1="300.0" y1="172.0" x2="355.0" y2="172.0" stroke="#7a4b00" stroke-width="1.5" marker-end="url(#a3)"/>
  <defs><marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7a4b00"/></marker></defs>
  <text x="335.0" y="190.0" font-size="15" text-anchor="middle" fill="#7a4b00">x</text>
  <text x="355.0" y="124.0" font-size="15" text-anchor="middle" fill="#7a4b00">dm = (M/L) dx</text>
  <text x="300.0" y="270.0" font-size="14" text-anchor="middle" fill="#555">ชิ้นส่วนที่ระยะ x มีระยะตั้งฉากจากแกนเท่ากับ |x| จึงได้ I = ∫ x² dm</text>
</svg>
