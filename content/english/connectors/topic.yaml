id: english.grammar.connectors
subject: english
title: { th: "คำเชื่อม and, but, or, because, so และตัวเชื่อมลำดับ", en: "Connectors: and, but, or, because, so and sequencers" }
summary: เชื่อมประโยคด้วย and but or because so before after เรียงลำดับเหตุการณ์ด้วย First Next Then Finally และใช้คำเชื่อมช่วยจับใจความและให้เหตุผล
difficulty: 2.5
minutes: 30
prerequisites: [english.grammar.present-simple]
encompasses:
  - { id: english.grammar.present-simple, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: connector-meanings.svg
    alt: "แผนภาพคำเชื่อม แถวบนสามกล่อง: and (เครื่องหมายบวก) เพิ่มเรื่องที่ไปด้วยกัน I like cats and dogs. / but (เครื่องหมายไม่เท่ากับ) ความที่ขัดกัน It's small, but it's strong. / or (เครื่องหมายคำถาม) ให้เลือกอย่างใดอย่างหนึ่ง Tea or coffee? แถวล่างเหตุและผล: It is raining. (เหตุ) ลูกศรขวาเขียนว่า , so ไปที่ I take an umbrella. (ผล) และ I take an umbrella. (ผล) ลูกศรซ้ายจาก because it is raining. (เหตุ) ข้อความล่างสุด so นำผล because นำเหตุ ใช้คำใดคำหนึ่งในประโยคเดียว ไม่ใช้คู่กัน"
    caption: "and เพิ่ม · but ขัดแย้ง · or ให้เลือก · so นำผล · because นำเหตุ"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.grammar.connectors.p003, prompt: "คำถามให้เลือกหนึ่งอย่าง" }
  - type: figure
    src: sequence-steps.svg
    alt: "สี่ขั้นตอนเรียงจากซ้ายไปขวามีลูกศรคั่น: First, boil the water. (รูปกาต้มน้ำมีไอ) Next, put the noodles in a bowl. (รูปชามมีเส้นบะหมี่) Then, pour the hot water on them. (รูปกาเทน้ำลงชาม) Finally, wait three minutes and eat. (รูปนาฬิกา 3 นาที)"
    caption: "ตัวเชื่อมลำดับ First, Next, Then, Finally ช่วยเล่าขั้นตอน"
  - type: worked-example
    title: รวมสองประโยคด้วย because และ so
    problem: "รวมสองประโยคนี้สองแบบ: *The market is crowded.* / *We go early in the morning.*"
    steps:
      - text: "หาเหตุและผล: ตลาดคนเยอะ (เหตุ) จึงไปตั้งแต่เช้า (ผล)"
      - text: "แบบ so: เหตุก่อน แล้ว , so แล้วผล: *The market is crowded, so we go early in the morning.*"
        why: "so นำผล จึงต้องอยู่หน้าผล"
      - text: "แบบ because: ผลก่อน แล้ว because แล้วเหตุ: *We go early in the morning because the market is crowded.*"
      - text: "ตรวจว่าไม่ได้ใช้ because กับ so ในประโยคเดียวกัน"
    answer: "*The market is crowded, so we go early in the morning.* / *We go early in the morning because the market is crowded.*"
  - { type: check, problem: english.grammar.connectors.p007, prompt: "ภาษาอังกฤษใช้คำเชื่อมเหตุผลกี่คำ" }
  - type: worked-example
    title: เล่ากิจกรรมวันลอยกระทงตามลำดับ
    problem: "เขียนเล่า 4 ขั้น: ทำกระทงจากใบตอง → ไปริมแม่น้ำ → อธิษฐาน → ปล่อยกระทงลงน้ำ"
    steps:
      - text: "ขั้นแรกใช้ First,: *First, we make a krathong from banana leaves.*"
      - text: "ขั้นต่อไปใช้ Next,: *Next, we go to the river.*"
      - text: "ขั้นที่สามใช้ Then,: *Then, we make a wish.*"
        why: "ตัวเชื่อมลำดับตามด้วยจุลภาคเสมอ"
      - text: "ขั้นสุดท้ายใช้ Finally,: *Finally, we put the krathong on the water.*"
      - text: "อ่านทวนว่าลำดับตรงกับเหตุการณ์จริง และทุกประโยคใช้ present simple เพราะเล่าสิ่งที่ทำทุกปี"
    answer: "*First, we make a krathong from banana leaves. Next, we go to the river. Then, we make a wish. Finally, we put the krathong on the water.*"
glossary:
  - { term: คำเชื่อม (connector), definition: "คำที่เชื่อมคำหรือประโยคและบอกความสัมพันธ์ เช่น and, but, or, because, so" }
  - { term: because, definition: "เพราะ นำเหตุ เช่น I'm happy because it's Friday." }
  - { term: so, definition: "ดังนั้น จึง นำผล มักมีจุลภาคหน้า เช่น It's Friday, so I'm happy." }
  - { term: ตัวเชื่อมลำดับ (sequencer), definition: "คำบอกลำดับขั้น เช่น First, Next, Then, After that, Finally" }
  - { term: รายละเอียดสนับสนุน (supporting detail), definition: "ข้อมูลหรือเหตุผลที่ช่วยอธิบายใจความสำคัญ มักตามหลัง because หรือ for example" }
flashcards:
  - { front: "because กับ so ต่างกันอย่างไร", back: "because นำเหตุ (I stay home because I'm sick.) so นำผล (I'm sick, so I stay home.)" }
  - { front: "Because I am sick, so I stay home. ผิดตรงไหน", back: "ใช้ because กับ so คู่กันไม่ได้ เลือกคำเดียว" }
  - { front: "Do you want tea ___ coffee?", back: "or (ให้เลือก)" }
  - { front: "ตัวเชื่อมลำดับสี่ขั้น", back: "First, → Next, → Then, → Finally," }
  - { front: "I brush my teeth ___ I go to bed. (ก่อน)", back: "before" }
