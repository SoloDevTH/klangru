    type: mcq
    stem: "นักวิทยาศาสตร์ตรวจจับนิวทริโนจากดวงอาทิตย์ได้ในเครื่องตรวจวัดใต้ดิน ข้อมูลนี้สำคัญเพราะเหตุใด"
    choices:
      - { id: a, text: "นิวทริโนหนีออกจากแกนได้ทันทีและถึงโลกในราว 8 นาที จึงเป็นหลักฐานโดยตรงว่าการหลอมนิวเคลียสกำลังเกิดที่แกนตอนนี้", correct: true }
      - { id: b, text: "นิวทริโนเป็นแหล่งพลังงานหลักที่ทำให้โลกอบอุ่น", feedback: "นิวทริโนแทบไม่ทำปฏิกิริยากับสสาร จึงไม่ได้ให้ความร้อนแก่โลก โลกอุ่นเพราะแสงอาทิตย์" }
      - { id: c, text: "นิวทริโนแสดงว่าดวงอาทิตย์ลุกไหม้ด้วยออกซิเจน", feedback: "การเผาไหม้ทางเคมีไม่ได้สร้างนิวทริโน นิวทริโนเกิดจากปฏิกิริยานิวเคลียร์" }
      - { id: d, text: "นิวทริโนใช้เวลาหลายแสนปีออกจากดวงอาทิตย์ จึงบอกอดีตของดวงอาทิตย์", feedback: "ที่ใช้เวลานานคือพลังงานในรูปโฟตอน นิวทริโนหนีออกมาแทบทันที" }
    hints:
