problems:
  - id: chemistry.bonding.metallic.p001
    topics: [chemistry.bonding.metallic]
    difficulty: 1
    type: mcq
    stem: "ตามแบบจำลองทะเลอิเล็กตรอน อนุภาคใดในก้อนโลหะเคลื่อนที่ไปทั่วทั้งก้อนได้อย่างอิสระ"
    choices:
      - { id: a, text: "เวเลนซ์อิเล็กตรอน", correct: true, feedback: "ถูก เวเลนซ์อิเล็กตรอนหลุดจากอะตอมของตัวเองและเคลื่อนที่ไปทั่ว" }
      - { id: b, text: "ไอออนบวก", feedback: "ไอออนบวกอยู่ประจำตำแหน่งในโครงผลึก ทำได้เพียงสั่นอยู่กับที่" }
      - { id: c, text: "โปรตอน", feedback: "โปรตอนอยู่ในนิวเคลียส ไม่ได้เคลื่อนที่ออกมา" }
      - { id: d, text: "อิเล็กตรอนทุกตัวในอะตอม", feedback: "เฉพาะเวเลนซ์อิเล็กตรอนเท่านั้นที่เป็นอิสระ อิเล็กตรอนชั้นในยังอยู่กับไอออน" }
    hints:
      - "อะตอมโลหะเสียอิเล็กตรอนชั้นนอกได้ง่าย"
      - "สิ่งที่เหลืออยู่กับที่เรียกว่าอะไร"
    solution: "เวเลนซ์อิเล็กตรอนเป็น **อิเล็กตรอนอิสระ** เคลื่อนที่รอบไอออนบวกที่เรียงตัวอยู่กับที่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.metallic.p002
    topics: [chemistry.bonding.metallic]
    difficulty: 2
    type: match
    stem: "จับคู่สมบัติของโลหะกับคำอธิบายด้วยแบบจำลองทะเลอิเล็กตรอน"
    pairs:
      - { left: "นำไฟฟ้าได้ดี", right: "อิเล็กตรอนอิสระเคลื่อนที่ไปทางขั้วบวกได้เมื่อต่อแหล่งไฟฟ้า" }
      - { left: "ตีแผ่และดึงเป็นเส้นได้", right: "ชั้นไอออนบวกเลื่อนผ่านกันได้โดยยังมีอิเล็กตรอนยึดไว้" }
      - { left: "ผิวมันวาว", right: "อิเล็กตรอนอิสระดูดกลืนแสงแล้วคายแสงออกมา" }
      - { left: "จุดหลอมเหลวสูงขึ้นจาก Na ไป Al", right: "จำนวนอิเล็กตรอนอิสระและประจุของไอออนเพิ่มขึ้น" }
    hints:
      - "แต่ละสมบัติเกี่ยวกับอิเล็กตรอนอิสระหรือการจัดเรียงของไอออน"
      - "จุดหลอมเหลวขึ้นกับความแข็งแรงของพันธะ"
    solution: "นำไฟฟ้า: อิเล็กตรอนอิสระเคลื่อนที่ · ตีแผ่ได้: ชั้นไอออนเลื่อนได้ · มันวาว: อิเล็กตรอนดูดกลืนและคายแสง · จุดหลอมเหลว: พันธะแข็งแรงขึ้นเมื่ออิเล็กตรอนอิสระและประจุมากขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.metallic.p003
    topics: [chemistry.bonding.metallic]
    difficulty: 3
    type: numeric
    stem: "อะลูมิเนียม (หมู่ 13 เลขอะตอม 13) 0.50 mol ให้อิเล็กตรอนอิสระในทะเลอิเล็กตรอนกี่โมล"
    answer: { value: 1.5, tolerance: 0.01, unit: mol }
    misconceptions:
      - { match: 6.5, feedback: "ไม่ใช่อิเล็กตรอนทั้ง 13 ตัว เฉพาะเวเลนซ์อิเล็กตรอน 3 ตัวเท่านั้นที่เป็นอิสระ" }
      - { match: 0.5, feedback: "อะตอม Al หนึ่งอะตอมให้อิเล็กตรอนอิสระ 3 ตัว ไม่ใช่ 1 ตัว" }
    hints:
      - "Al มีเวเลนซ์อิเล็กตรอนกี่ตัว (2, 8, 3)"
      - "คูณจำนวนโมลของ Al ด้วยจำนวนอิเล็กตรอนอิสระต่ออะตอม"
    solution: "Al แต่ละอะตอมให้เวเลนซ์อิเล็กตรอน 3 ตัว เหลือ $\\mathrm{Al^{3+}}$ อิเล็กตรอนอิสระ $= 0.50 \\times 3 =$ **1.5 mol**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.metallic.p004
    topics: [chemistry.bonding.metallic]
    difficulty: 2
    type: order
    stem: "เรียงโลหะต่อไปนี้ตามจุดหลอมเหลวจาก **ต่ำไปสูง**"
    items:
      - "โซเดียม (Na)"
      - "แมกนีเซียม (Mg)"
      - "อะลูมิเนียม (Al)"
    hints:
      - "นับเวเลนซ์อิเล็กตรอนของแต่ละธาตุ"
      - "อิเล็กตรอนอิสระมากและไอออนประจุมาก พันธะโลหะยิ่งแข็งแรง"
    solution: "Na (98 °C) < Mg (650 °C) < Al (660 °C) เพราะอิเล็กตรอนอิสระต่ออะตอมเพิ่มจาก 1 เป็น 2 และ 3"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.metallic.p005
    topics: [chemistry.bonding.metallic]
    difficulty: 3
    type: mcq
    stem: "ข้อใดอธิบายได้ดีที่สุดว่าทำไมแมกนีเซียม (650 °C) มีจุดหลอมเหลวสูงกว่าโซเดียม (98 °C)"
    choices:
      - { id: a, text: "Mg ให้อิเล็กตรอนอิสระอะตอมละ 2 ตัวและเป็นไอออน 2+ ที่เล็กกว่า แรงดึงดูดในพันธะโลหะจึงมากกว่า", correct: true, feedback: "ถูก ทั้งจำนวนอิเล็กตรอนอิสระ ประจุ และขนาดของไอออนทำให้พันธะแข็งแรงขึ้น" }
      - { id: b, text: "อะตอม Mg หนักกว่าอะตอม Na", feedback: "มวลไม่ได้กำหนดความแข็งแรงของพันธะ เช่น K หนักกว่า Na แต่หลอมเหลวที่อุณหภูมิต่ำกว่า" }
      - { id: c, text: "Mg ยึดกันด้วยพันธะโคเวเลนต์ ส่วน Na ยึดกันด้วยพันธะโลหะ", feedback: "ทั้งสองเป็นโลหะ ยึดกันด้วยพันธะโลหะเหมือนกัน" }
      - { id: d, text: "Na มีอิเล็กตรอนทั้งหมดมากกว่า Mg", feedback: "Na มี 11 อิเล็กตรอน Mg มี 12 และสิ่งที่สำคัญคือจำนวนอิเล็กตรอนอิสระ ไม่ใช่อิเล็กตรอนทั้งหมด" }
    hints:
      - "เปรียบเทียบจำนวนเวเลนซ์อิเล็กตรอนและประจุของไอออน"
      - "แรงไฟฟ้ามากขึ้นเมื่อประจุมากขึ้น"
    solution: "Mg ให้อิเล็กตรอนอิสระ 2 ตัวต่ออะตอม ได้ $\\mathrm{Mg^{2+}}$ ซึ่งเล็กกว่า $\\mathrm{Na^+}$ แรงดึงดูดระหว่างไอออนกับทะเลอิเล็กตรอนจึงมากกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.metallic.p006
    topics: [chemistry.bonding.metallic]
    difficulty: 3
    type: mcq
    stem: "จุดหลอมเหลวของโลหะหมู่ 1 ลดลงจากบนลงล่าง (Li 181 °C, Na 98 °C, K 64 °C) เพราะเหตุใด"
    choices:
      - { id: a, text: "ไอออนใหญ่ขึ้น อิเล็กตรอนอิสระอยู่ห่างนิวเคลียสมากขึ้น แรงดึงดูดในพันธะโลหะจึงอ่อนลง", correct: true, feedback: "ถูก ทุกธาตุให้อิเล็กตรอนอิสระ 1 ตัวเท่ากัน ความต่างจึงมาจากขนาดไอออน" }
      - { id: b, text: "ธาตุที่อยู่ล่างให้อิเล็กตรอนอิสระน้อยกว่า", feedback: "ธาตุหมู่ 1 ทุกตัวให้อิเล็กตรอนอิสระ 1 ตัวเท่ากัน" }
      - { id: c, text: "ธาตุที่อยู่ล่างมีมวลมากกว่าจึงหลอมง่าย", feedback: "มวลมากไม่ได้ทำให้หลอมง่าย สิ่งที่สำคัญคือแรงดึงดูดระหว่างไอออนกับอิเล็กตรอน" }
    hints:
      - "จำนวนอิเล็กตรอนอิสระต่ออะตอมในหมู่ 1 เท่ากันหรือไม่"
      - "ขนาดอะตอมเปลี่ยนอย่างไรเมื่อลงมาในหมู่"
    solution: "ทุกธาตุหมู่ 1 ให้อิเล็กตรอนอิสระ 1 ตัว แต่ไอออนใหญ่ขึ้นจากบนลงล่าง แรงดึงดูดกับทะเลอิเล็กตรอนจึง **อ่อนลง** จุดหลอมเหลวลดลง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.metallic.p007
    topics: [chemistry.bonding.metallic]
    difficulty: 3
    type: mcq
    stem: "ช่างทองตีทองคำจนเป็นแผ่นบางได้ แต่เมื่อทุบผลึกเกลือแกง (NaCl) ผลึกแตก ข้อใดอธิบายความต่างนี้ถูกต้อง"
    choices:
      - { id: a, text: "ในทองคำ ชั้นไอออนบวกเลื่อนได้โดยทะเลอิเล็กตรอนยังยึดไว้ ในเกลือ ชั้นที่เลื่อนทำให้ไอออนประจุเดียวกันมาประจันกันและผลักกัน", correct: true, feedback: "ถูก พันธะโลหะไม่มีทิศทาง ส่วนผลึกไอออนิกต้องจัดไอออนบวกลบสลับกันเสมอ" }
      - { id: b, text: "ทองคำมีจุดหลอมเหลวต่ำกว่าเกลือ จึงอ่อนกว่า", feedback: "การตีแผ่ไม่ได้ขึ้นกับจุดหลอมเหลว ทองคำหลอมที่ 1,064 °C ซึ่งสูงกว่าเกลือ (801 °C) ด้วยซ้ำ" }
      - { id: c, text: "เกลือเป็นโมเลกุลเล็ก ๆ ที่แยกจากกันง่าย", feedback: "NaCl ไม่ได้เป็นโมเลกุล เป็นโครงผลึกของไอออน" }
    hints:
      - "นึกภาพแถวบนเลื่อนไปหนึ่งตำแหน่ง"
      - "ในผลึกไอออนิก ไอออนข้างเคียงจะเป็นประจุอะไร"
    solution: "พันธะโลหะไม่มีทิศทาง ชั้นไอออนบวกจึงเลื่อนได้โดยไม่แตก ส่วนในผลึกไอออนิก การเลื่อนทำให้ **ไอออนประจุเดียวกันผลักกัน** ผลึกจึงแตก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.metallic.p008
    topics: [chemistry.bonding.metallic]
    difficulty: 3
    type: numeric
    stem: "ทองรูปพรรณหนัก 1 บาท (15.16 g) มีทองคำร้อยละ 96.5 โดยมวล สร้อยเส้นนี้มีทองคำกี่กรัม"
    answer: { value: 14.63, tolerance: 0.02, unit: g }
    misconceptions:
      - { match: 0.53, feedback: "นี่คือมวลของโลหะอื่นที่ผสม (ร้อยละ 3.5) โจทย์ถามมวลทองคำ" }
      - { match: 15.16, feedback: "ทองรูปพรรณเป็นโลหะผสม ไม่ใช่ทองคำบริสุทธิ์ทั้งหมด" }
    hints:
      - "มวลทองคำ = มวลทั้งหมด × ร้อยละของทองคำ ÷ 100"
      - "คูณ 15.16 ด้วย 0.965"
    solution: "มวลทองคำ $= 15.16 \\times \\dfrac{96.5}{100} = 14.63$ g ที่เหลือ 0.53 g เป็นเงินและทองแดง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.metallic.p009
    topics: [chemistry.bonding.metallic]
    difficulty: 4
    type: mcq
    stem: "ทองคำแท่ง 99.99% อ่อนมาก ร้านทองจึงทำสร้อยและแหวนจากทองรูปพรรณ 96.5% ที่ผสมเงินและทองแดง เหตุผลใดถูกต้อง"
    choices:
      - { id: a, text: "อะตอมเงินและทองแดงมีขนาดต่างจากทองคำ จึงขวางไม่ให้ชั้นไอออนเลื่อนผ่านกันง่าย โลหะผสมจึงแข็งกว่า", correct: true, feedback: "ถูก นี่คือเหตุผลที่โลหะผสมส่วนมากแข็งกว่าโลหะบริสุทธิ์" }
      - { id: b, text: "เงินและทองแดงเกิดพันธะไอออนิกกับทองคำ ทำให้แข็งขึ้น", feedback: "โลหะกับโลหะยังยึดกันด้วยพันธะโลหะ ไม่ได้เกิดไอออนบวกและลบ" }
      - { id: c, text: "การผสมทำให้มีอิเล็กตรอนอิสระน้อยลง", feedback: "เงินและทองแดงก็ให้อิเล็กตรอนอิสระเช่นกัน ความแข็งมาจากการขวางการเลื่อนของชั้น" }
      - { id: d, text: "เพื่อให้สีเหลืองเข้มขึ้นเท่านั้น", feedback: "การผสมเปลี่ยนสีได้บ้าง แต่เหตุผลหลักคือเพิ่มความแข็งให้ทนการใช้งาน" }
    hints:
      - "อะไรทำให้โลหะบริสุทธิ์อ่อนและตีแผ่ได้ง่าย"
      - "อะตอมขนาดต่างกันมีผลอย่างไรต่อชั้นที่เรียงเป็นระเบียบ"
    solution: "อะตอมขนาดต่างกันแทรกอยู่ในโครงผลึก ทำให้ชั้นไอออนเลื่อนผ่านกันยาก ทองรูปพรรณจึงแข็งและทนกว่าทองคำบริสุทธิ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.metallic.p010
    topics: [chemistry.bonding.metallic]
    difficulty: 4
    type: match
    stem: "จับคู่สารกับชนิดของโครงสร้างและพันธะ"
    pairs:
      - { left: "$\\mathrm{NaCl}$", right: "โครงผลึกไอออนิก" }
      - { left: "$\\mathrm{I_2}$", right: "โมเลกุลโคเวเลนต์ ยึดกันด้วยแรงลอนดอน" }
      - { left: "$\\mathrm{SiO_2}$ (ควอตซ์)", right: "โคเวเลนต์โครงร่างตาข่าย" }
      - { left: "$\\mathrm{Cu}$", right: "พันธะโลหะ" }
    hints:
      - "โลหะกับอโลหะเกิดสารไอออนิก อโลหะกับอโลหะเกิดสารโคเวเลนต์"
      - "สารโคเวเลนต์บางชนิดต่ออะตอมกันทั้งก้อนแทนที่จะเป็นโมเลกุลเล็ก"
    solution: "NaCl ไอออนิก · $\\mathrm{I_2}$ โมเลกุลไม่มีขั้ว ยึดกันด้วยแรงลอนดอน · $\\mathrm{SiO_2}$ โครงร่างตาข่าย · Cu พันธะโลหะ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.metallic.p011
    topics: [chemistry.bonding.metallic]
    difficulty: 3
    type: mcq
    stem: "สาร W หลอมเหลวที่ประมาณ 1,700 °C ไม่นำไฟฟ้าทั้งเมื่อเป็นของแข็งและเมื่อหลอมเหลว และไม่ละลายน้ำ W น่าจะเป็นสารประเภทใด"
    choices:
      - { id: a, text: "สารโคเวเลนต์โครงร่างตาข่าย", correct: true, feedback: "ถูก จุดหลอมเหลวสูงมากเพราะต้องสลายพันธะโคเวเลนต์ทั้งก้อน และไม่มีไอออนหรืออิเล็กตรอนอิสระ เช่น $\\mathrm{SiO_2}$" }
      - { id: b, text: "สารประกอบไอออนิก", feedback: "สารไอออนิกนำไฟฟ้าได้เมื่อหลอมเหลว แต่ W ไม่นำ" }
      - { id: c, text: "โลหะ", feedback: "โลหะนำไฟฟ้าได้ทั้งของแข็งและของเหลว" }
      - { id: d, text: "สารโคเวเลนต์โมเลกุลเล็ก", feedback: "สารโมเลกุลเล็กมีจุดหลอมเหลวต่ำ เพราะแรงระหว่างโมเลกุลอ่อน" }
    hints:
      - "สารใดบ้างที่นำไฟฟ้าเมื่อหลอมเหลว"
      - "จุดหลอมเหลวสูงมากแต่ไม่มีอนุภาคที่มีประจุเคลื่อนที่ได้"
