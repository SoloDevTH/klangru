id: management.quality.concepts
subject: management
title: { th: แนวคิดการจัดการคุณภาพ, en: Quality management concepts }
summary: ความหมายของคุณภาพ วงจร PDCA การบริหารคุณภาพโดยรวม (TQM) ภาพรวมระบบ ISO 9001 และการคำนวณต้นทุนคุณภาพสี่กลุ่ม
difficulty: 4
minutes: 35
prerequisites: [math.number.ratio-percent]
encompasses:
  - { id: math.number.ratio-percent, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: pdca.svg
    alt: "วงกลมแบ่งสี่ส่วนหมุนตามเข็มนาฬิกา P วางแผน (ตั้งเป้า หาสาเหตุ วางวิธีแก้) อยู่ขวาบน D ลงมือทำ (ทดลองตามแผน เก็บข้อมูล) อยู่ขวาล่าง C ตรวจสอบ (เทียบผลกับเป้า) อยู่ซ้ายล่าง A ปรับปรุง (ทำเป็นมาตรฐานหรือแก้แล้ววนใหม่) อยู่ซ้ายบน ด้านขวามีตารางจับคู่ข้อกำหนด ISO 9001:2015 ข้อ 4 บริบทขององค์กร ครอบทั้งวงจร ข้อ 5 ความเป็นผู้นำ อยู่กลางวงจร ข้อ 6 การวางแผน กับ P ข้อ 7 การสนับสนุนและข้อ 8 การดำเนินงาน กับ D ข้อ 9 การประเมินผล กับ C และข้อ 10 การปรับปรุง กับ A"
    caption: "วงจร PDCA และโครงข้อกำหนดของ ISO 9001:2015 (สรุปด้วยคำของคลังรู้ ไม่ใช่ข้อความในมาตรฐาน)"
  - { type: check, problem: mgt.qt.p001, prompt: "ลองตอบก่อนดูตัวอย่าง" }
  - type: worked-example
    title: คิดต้นทุนคุณภาพของโรงงานขนมปัง
    problem: "โรงงานขนมปังแห่งหนึ่งมียอดขายปีละ 8,000,000 บาท ในปีนี้จ่ายค่าอบรมสุขอนามัยพนักงาน 35,000 บาท ค่าตรวจเชื้อและชั่งน้ำหนักตัวอย่างขนม 45,000 บาท ค่าขนมไหม้หรือขึ้นรูปผิดที่ต้องทิ้งในโรงงาน 120,000 บาท และค่ารับคืนขนมขึ้นราจากร้านค้า 80,000 บาท ต้นทุนคุณภาพรวมเป็นร้อยละเท่าใดของยอดขาย"
    steps:
      - text: "จัดกลุ่ม: อบรมพนักงาน = ป้องกัน 35,000 บาท ตรวจเชื้อและชั่งตัวอย่าง = ประเมิน 45,000 บาท ขนมเสียในโรงงาน = ล้มเหลวภายใน 120,000 บาท รับคืนจากร้านค้า = ล้มเหลวภายนอก 80,000 บาท"
        why: "ดูว่าเงินก้อนนั้นจ่ายเพื่อไม่ให้เกิดของเสีย (ป้องกัน) เพื่อตรวจหา (ประเมิน) หรือจ่ายเพราะของเสียเกิดแล้ว และพบก่อนหรือหลังถึงลูกค้า"
      - text: "รวม: $35{,}000 + 45{,}000 + 120{,}000 + 80{,}000 = 280{,}000$ บาท"
      - text: "เทียบยอดขาย: $\\dfrac{280{,}000}{8{,}000{,}000} \\times 100 = 3.5\\%$"
      - text: "ต้นทุนของคุณภาพที่ไม่ดี (ล้มเหลวภายใน + ภายนอก) $= 200{,}000$ บาท คิดเป็น $\\dfrac{200{,}000}{280{,}000} \\times 100 \\approx 71.4\\%$ ของต้นทุนคุณภาพทั้งหมด"
        why: "สัดส่วนนี้สูงแปลว่าโรงงานจ่ายเงินส่วนใหญ่ไปกับการตามแก้ปัญหา ควรลงทุนป้องกันเพิ่ม"
    answer: "ต้นทุนคุณภาพรวม 280,000 บาท หรือ 3.5% ของยอดขาย โดยกว่า 70% เป็นต้นทุนความล้มเหลว"
  - { type: check, problem: mgt.qt.p003 }
  - type: worked-example
    title: ลงทุนป้องกันเพิ่มแล้วคุ้มหรือไม่
    problem: "โรงงานเฟอร์นิเจอร์มียอดขายปีละ 10 ล้านบาท ต้นทุนคุณภาพก่อนปรับปรุง (พันบาทต่อปี): ป้องกัน 20 ประเมิน 60 ล้มเหลวภายใน 180 ล้มเหลวภายนอก 140 โรงงานลงทุนอบรมช่างและทำจิ๊กจับชิ้นงาน ทำให้ต้นทุนป้องกันเป็น 70 ล้มเหลวภายในลดเหลือ 110 และล้มเหลวภายนอกลดเหลือ 50 ส่วนต้นทุนประเมินเท่าเดิม ต้นทุนคุณภาพรวมลดลงเท่าใด"
    figure:
      src: coq-bars.svg
      alt: "แผนภูมิแท่งซ้อนสองแท่ง หน่วยพันบาท แท่งก่อนปรับปรุง ป้องกัน 20 ประเมิน 60 ล้มเหลวภายใน 180 ล้มเหลวภายนอก 140 รวม 400 แท่งหลังปรับปรุง ป้องกัน 70 ประเมิน 60 ล้มเหลวภายใน 110 ล้มเหลวภายนอก 50 รวม 290 หมายเหตุข้างแผนภูมิ ใช้เงินป้องกันเพิ่ม 50 ความล้มเหลวลดลง 160 ต้นทุนรวมลดลง 110"
    steps:
      - text: "ก่อนปรับปรุง: $20 + 60 + 180 + 140 = 400$ พันบาท"
      - text: "หลังปรับปรุง: $70 + 60 + 110 + 50 = 290$ พันบาท"
      - text: "ลดลง $400 - 290 = 110$ พันบาท หรือ 110,000 บาทต่อปี"
        why: "ต้องเทียบผลรวมทั้งสี่กลุ่ม เพราะต้นทุนป้องกันเพิ่มขึ้น 50 พันบาท ถ้าดูเฉพาะความล้มเหลวที่ลดลง 160 พันบาท จะประเมินความคุ้มค่าสูงเกินจริง"
      - text: "เทียบยอดขาย: ก่อน $\\dfrac{400{,}000}{10{,}000{,}000} = 4\\%$ หลัง $\\dfrac{290{,}000}{10{,}000{,}000} = 2.9\\%$ ลดลง 1.1 จุดร้อยละ"
    answer: "ต้นทุนคุณภาพรวมลดลง 110,000 บาทต่อปี (จาก 4% เหลือ 2.9% ของยอดขาย) การลงทุนป้องกันจึงคุ้มค่า"
glossary:
  - { term: วงจร PDCA, definition: "วงจรปรับปรุงงานสี่ขั้น วางแผน (Plan) ลงมือทำ (Do) ตรวจสอบ (Check) ปรับปรุง (Act) แล้ววนซ้ำ เรียกอีกชื่อว่าวงจรเดมมิง" }
  - { term: การบริหารคุณภาพโดยรวม (TQM), definition: "แนวทางบริหารที่ให้ทุกคนในองค์กรร่วมกันปรับปรุงคุณภาพอย่างต่อเนื่อง โดยมุ่งที่ลูกค้าและใช้ข้อมูลตัดสินใจ" }
  - { term: ISO 9001, definition: "มาตรฐานสากลที่กำหนดข้อกำหนดของระบบบริหารคุณภาพ องค์กรขอรับการรับรองได้โดยผ่านการตรวจจากหน่วยรับรองภายนอก" }
  - { term: ต้นทุนคุณภาพ, definition: "ผลรวมต้นทุนป้องกัน ต้นทุนประเมิน ต้นทุนความล้มเหลวภายใน และต้นทุนความล้มเหลวภายนอก" }
flashcards:
  - { front: "PDCA ย่อมาจากอะไร", back: "Plan วางแผน · Do ลงมือทำ · Check ตรวจสอบ · Act ปรับปรุง (ทำเป็นมาตรฐานหรือแก้แล้ววนใหม่)" }
  - { front: "ต้นทุนคุณภาพ 4 กลุ่ม", back: "ป้องกัน · ประเมิน · ล้มเหลวภายใน (พบก่อนถึงลูกค้า) · ล้มเหลวภายนอก (ลูกค้าพบ)" }
  - { front: "ค่าสอบเทียบเครื่องชั่งเป็นต้นทุนกลุ่มใด", back: "ต้นทุนประเมิน เพราะจ่ายเพื่อให้การตรวจวัดถูกต้อง" }
  - { front: "หลักการบริหารคุณภาพ 7 ข้อของมาตรฐานตระกูล ISO 9000", back: "มุ่งเน้นลูกค้า · ความเป็นผู้นำ · การมีส่วนร่วมของบุคลากร · การบริหารเชิงกระบวนการ · การปรับปรุง · การตัดสินใจจากหลักฐาน · การบริหารความสัมพันธ์" }
  - { front: "ใบรับรอง ISO 9001 รับประกันอะไร", back: "ระบบบริหารคุณภาพเป็นไปตามข้อกำหนด ไม่ได้รับประกันว่าสินค้าทุกชิ้นไม่มีของเสีย" }
