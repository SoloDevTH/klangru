<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="sans-serif">
<title>วงจรความเครียด: เหตุการณ์ ความคิด อารมณ์ ร่างกาย พฤติกรรม</title>
<rect x="0" y="0" width="720" height="460" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="360.0" y="26.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">ความเครียดส่งผลถึงกันเป็นวงจร และตัดวงจรได้ทุกจุด</text>
<line x1="416.6" y1="116.1" x2="460.3" y2="147.9" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="495.3" y1="255.6" x2="478.6" y2="306.9" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="387.0" y1="373.5" x2="333.0" y2="373.5" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="241.4" y1="306.9" x2="224.7" y2="255.6" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="259.7" y1="147.9" x2="303.4" y2="116.1" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="292.0" y="47.0" width="136.0" height="56.0" rx="10" fill="#eeeeee" stroke="#333" stroke-width="1.5"/>
<text x="360.0" y="69.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">เหตุการณ์</text>
<text x="360.0" y="89.0" font-size="12" text-anchor="middle" fill="#333">สอบพรุ่งนี้</text>
<rect x="448.9" y="161.0" width="136.0" height="56.0" rx="10" fill="#dcecf9" stroke="#333" stroke-width="1.5"/>
<text x="516.9" y="183.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">ความคิด</text>
<text x="516.9" y="203.0" font-size="12" text-anchor="middle" fill="#333">"ต้องสอบตกแน่"</text>
<rect x="389.0" y="345.5" width="136.0" height="56.0" rx="10" fill="#f3e6f7" stroke="#333" stroke-width="1.5"/>
<text x="457.0" y="367.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">อารมณ์</text>
<text x="457.0" y="387.5" font-size="12" text-anchor="middle" fill="#333">กังวล กลัว</text>
<rect x="195.0" y="345.5" width="136.0" height="56.0" rx="10" fill="#f9dede" stroke="#333" stroke-width="1.5"/>
<text x="263.0" y="367.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">ร่างกาย</text>
<text x="263.0" y="387.5" font-size="12" text-anchor="middle" fill="#333">ใจเต้นแรง ปวดท้อง</text>
<rect x="135.1" y="161.0" width="136.0" height="56.0" rx="10" fill="#fff4d6" stroke="#333" stroke-width="1.5"/>
<text x="203.1" y="183.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">พฤติกรรม</text>
<text x="203.1" y="203.0" font-size="12" text-anchor="middle" fill="#333">นอนดึก เล่นมือถือ</text>
<rect x="15.0" y="70.0" width="165.0" height="46.0" rx="8" fill="#eaf6e3" stroke="#3a7d2c" stroke-width="1.5"/>
<text x="97.0" y="89.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1e6b2a">คิดใหม่</text>
<text x="97.0" y="107.0" font-size="11" text-anchor="middle" fill="#1e6b2a">"เตรียมมาแล้ว ทำเท่าที่ทำได้"</text>
<rect x="545.0" y="330.0" width="165.0" height="46.0" rx="8" fill="#eaf6e3" stroke="#3a7d2c" stroke-width="1.5"/>
<text x="627.0" y="349.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1e6b2a">หายใจช้า ๆ</text>
<text x="627.0" y="367.0" font-size="11" text-anchor="middle" fill="#1e6b2a">ขยับร่างกาย</text>
<rect x="15.0" y="360.0" width="165.0" height="46.0" rx="8" fill="#eaf6e3" stroke="#3a7d2c" stroke-width="1.5"/>
<text x="97.0" y="379.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1e6b2a">นอนให้พอ</text>
<text x="97.0" y="397.0" font-size="11" text-anchor="middle" fill="#1e6b2a">พูดคุยกับคนที่ไว้ใจ</text>
<text x="360.0" y="450.0" font-size="12" text-anchor="middle" fill="#333">กล่องสีเขียวคือจุดที่ตัดวงจรได้</text>
