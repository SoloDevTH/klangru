    hints:
      - "จาก $h = \\tfrac12 gt^2$ ความชันของกราฟ $h$ กับ $t^2$ คือ $\\tfrac{g}{2}$"
      - "หาความชันจากจุดกำเนิดและจุด $(0.25, 1.2)$ บนเส้น"
    misconceptions:
      - { match: 4.8, feedback: "นั่นคือความชันซึ่งเท่ากับ $\\tfrac{g}{2}$ ต้องคูณ 2" }
      - { match: 2.4, feedback: "ดูเหมือนหารความชันด้วย 2 ต้องคูณ 2 เพราะความชัน $= \\tfrac{g}{2}$" }
    solution: "ความชัน $= \\dfrac{1.2}{0.25} = 4.8\\ \\mathrm{m/s^2}$ ดังนั้น $g = 2 \\times 4.8 = 9.6\\ \\mathrm{m/s^2}$ ต่ำกว่า $9.8$ เล็กน้อย อาจเพราะแรงต้านอากาศหรือความคลาดเคลื่อนในการจับเวลา"
