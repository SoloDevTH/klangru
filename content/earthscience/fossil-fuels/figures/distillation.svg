<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="sans-serif" font-size="14">
<title>การกลั่นลำดับส่วนน้ำมันดิบ</title>
<rect x="0" y="0" width="800" height="470" fill="#ffffff"/>
<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#fca5a5"/></linearGradient></defs>
<rect x="300" y="40" width="110" height="380" rx="18" fill="url(#g)" stroke="#334155" stroke-width="3"/>
<line x1="308" y1="88" x2="402" y2="88" stroke="#475569" stroke-dasharray="4 3"/>
<line x1="410.0" y1="70.0" x2="470.0" y2="70.0" stroke="#334155" stroke-width="2"/>
<polygon points="470.0,70.0 461.7,73.5 461.7,66.5" fill="#334155"/>
<text x="478.0" y="68.0" text-anchor="start" font-size="13" font-weight="bold" fill="#222">แก๊สปิโตรเลียม</text>
<text x="478.0" y="85.0" text-anchor="start" font-size="12" fill="#334155">C1–C4 · แก๊สหุงต้ม วัตถุดิบปิโตรเคมี</text>
<text x="290.0" y="74.0" text-anchor="end" font-size="12" fill="#334155">ต่ำกว่า 30 °C</text>
<line x1="308" y1="150" x2="402" y2="150" stroke="#475569" stroke-dasharray="4 3"/>
<line x1="410.0" y1="132.0" x2="470.0" y2="132.0" stroke="#334155" stroke-width="2"/>
<polygon points="470.0,132.0 461.7,135.5 461.7,128.5" fill="#334155"/>
<text x="478.0" y="130.0" text-anchor="start" font-size="13" font-weight="bold" fill="#222">แนฟทาและน้ำมันเบนซิน</text>
<text x="478.0" y="147.0" text-anchor="start" font-size="12" fill="#334155">C5–C10 · น้ำมันรถเบนซิน วัตถุดิบพลาสติก</text>
<text x="290.0" y="136.0" text-anchor="end" font-size="12" fill="#334155">30–180 °C</text>
<line x1="308" y1="212" x2="402" y2="212" stroke="#475569" stroke-dasharray="4 3"/>
<line x1="410.0" y1="194.0" x2="470.0" y2="194.0" stroke="#334155" stroke-width="2"/>
<polygon points="470.0,194.0 461.7,197.5 461.7,190.5" fill="#334155"/>
<text x="478.0" y="192.0" text-anchor="start" font-size="13" font-weight="bold" fill="#222">น้ำมันก๊าด</text>
<text x="478.0" y="209.0" text-anchor="start" font-size="12" fill="#334155">C10–C14 · น้ำมันเครื่องบิน ตะเกียง</text>
<text x="290.0" y="198.0" text-anchor="end" font-size="12" fill="#334155">180–250 °C</text>
<line x1="308" y1="274" x2="402" y2="274" stroke="#475569" stroke-dasharray="4 3"/>
<line x1="410.0" y1="256.0" x2="470.0" y2="256.0" stroke="#334155" stroke-width="2"/>
<polygon points="470.0,256.0 461.7,259.5 461.7,252.5" fill="#334155"/>
<text x="478.0" y="254.0" text-anchor="start" font-size="13" font-weight="bold" fill="#222">น้ำมันดีเซล</text>
<text x="478.0" y="271.0" text-anchor="start" font-size="12" fill="#334155">C14–C20 · รถบรรทุก รถไฟ เครื่องจักร</text>
<text x="290.0" y="260.0" text-anchor="end" font-size="12" fill="#334155">250–350 °C</text>
<line x1="308" y1="336" x2="402" y2="336" stroke="#475569" stroke-dasharray="4 3"/>
<line x1="410.0" y1="318.0" x2="470.0" y2="318.0" stroke="#334155" stroke-width="2"/>
<polygon points="470.0,318.0 461.7,321.5 461.7,314.5" fill="#334155"/>
<text x="478.0" y="316.0" text-anchor="start" font-size="13" font-weight="bold" fill="#222">น้ำมันเตาและน้ำมันหล่อลื่น</text>
<text x="478.0" y="333.0" text-anchor="start" font-size="12" fill="#334155">C20–C40 · เรือ โรงงาน หล่อลื่นเครื่องยนต์</text>
<text x="290.0" y="322.0" text-anchor="end" font-size="12" fill="#334155">สูงกว่า 350 °C</text>
<line x1="308" y1="398" x2="402" y2="398" stroke="#475569" stroke-dasharray="4 3"/>
<line x1="410.0" y1="380.0" x2="470.0" y2="380.0" stroke="#334155" stroke-width="2"/>
<polygon points="470.0,380.0 461.7,383.5 461.7,376.5" fill="#334155"/>
<text x="478.0" y="378.0" text-anchor="start" font-size="13" font-weight="bold" fill="#222">ยางมะตอย (กากที่เหลือ)</text>
<text x="478.0" y="395.0" text-anchor="start" font-size="12" fill="#334155">มากกว่า C40 · ราดถนน กันซึม</text>
<text x="290.0" y="384.0" text-anchor="end" font-size="12" fill="#334155">ไม่กลายเป็นไอ</text>
<line x1="180.0" y1="400.0" x2="300.0" y2="400.0" stroke="#b91c1c" stroke-width="4"/>
<polygon points="300.0,400.0 291.7,403.5 291.7,396.5" fill="#b91c1c"/>
<text x="60.0" y="380.0" text-anchor="start" font-size="13" font-weight="bold" fill="#b91c1c">น้ำมันดิบที่ให้ความร้อน</text>
<text x="60.0" y="398.0" text-anchor="start" font-size="12" fill="#b91c1c">ราว 350–400 °C</text>
<text x="355.0" y="26.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">หอกลั่น</text>
<text x="290.0" y="48.0" text-anchor="end" font-size="11" fill="#64748b">จุดเดือดของส่วนที่ออก</text>
<text x="355.0" y="450.0" text-anchor="middle" font-size="12" fill="#334155">ด้านบนเย็น ด้านล่างร้อน</text>
<text x="792.0" y="464.0" text-anchor="end" font-size="11" fill="#64748b">ช่วงอุณหภูมิและจำนวนคาร์บอนเป็นค่าโดยประมาณ ต่างกันตามโรงกลั่น</text>
</svg>