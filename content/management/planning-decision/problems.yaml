      - { id: d, text: "ถ้าเลือกทางที่ EMV เท่ากับ 22,000 บาท จะได้กำไร 22,000 บาทแน่นอน", feedback: "แต่ละครั้งจะได้ผลใดผลหนึ่งในตาราง ไม่ใช่ค่า EMV" }
