problems:
  - id: management.operations.packaging-systems.p001
    topics: [management.operations.packaging-systems]
    difficulty: 1
    type: mcq
    stem: "ข้อใดไม่ใช่หน้าที่หลักของบรรจุภัณฑ์ในงานโลจิสติกส์"
    choices:
      - { id: a, text: "ปกป้องสินค้าจากการกระแทก ความชื้น และการปนเปื้อนระหว่างขนส่ง", feedback: "เป็นหน้าที่หลักของบรรจุภัณฑ์ คือการปกป้องสินค้า" }
      - { id: b, text: "รวมหน่วยเพื่อให้ขนถ่ายและนับได้ง่าย", feedback: "เป็นหน้าที่หลักของบรรจุภัณฑ์ คือการรวมหน่วยขนส่ง" }
      - { id: c, text: "เพิ่มน้ำหนักรวมของพัสดุเพื่อให้ค่าขนส่งสูงขึ้น", correct: true }
      - { id: d, text: "สื่อสารข้อมูลบนกล่อง เช่น ชื่อสินค้า วิธีเก็บ และวิธีขนถ่าย", feedback: "เป็นหน้าที่หลักของบรรจุภัณฑ์ คือการสื่อสารข้อมูล" }
    hints:
      - "ลองนึกถึงสิ่งที่บรรจุภัณฑ์ช่วยให้สินค้าทำได้ระหว่างขนส่ง"
      - "ตัวเลือกที่ถูกเป็นสิ่งที่ผู้ประกอบการต้องการหลีกเลี่ยง ไม่ใช่สิ่งที่บรรจุภัณฑ์ควรทำ"
    solution: "บรรจุภัณฑ์มีหน้าที่ปกป้อง รวมหน่วย สื่อสาร และสะดวกต่อการขนถ่าย การเพิ่มน้ำหนักเพื่อให้ค่าขนส่งสูงขึ้นไม่ใช่หน้าที่ และเป็นสิ่งที่ควรหลีกเลี่ยงเพราะเพิ่มต้นทุน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.packaging-systems.p002
    topics: [management.operations.packaging-systems]
    difficulty: 1
    type: numeric
    stem: "พาเลทมาตรฐานขนาด 1,200 × 1,000 มิลลิเมตร มีพื้นที่ด้านบนกี่ตารางเมตร (ตอบเป็นตัวเลขในหน่วย m²)"
    answer: { value: 1.2, tolerance: 0.01, unit: "m²" }
    hints:
      - "พื้นที่สี่เหลี่ยมผืนผ้าคือความกว้างคูณความยาว"
      - "1 ตารางเมตรเท่ากับ 1,000 × 1,000 ตารางมิลลิเมตร"
    misconceptions:
      - { match: 1200000, feedback: "นั่นคือพื้นที่เป็นตารางมิลลิเมตร ต้องหารด้วย 1,000,000 เพื่อให้เป็นตารางเมตร" }
      - { match: 2.2, feedback: "บวกด้านทั้งสองแทนที่จะคูณกัน" }
    solution: "$1200 \\times 1000 = 1{,}200{,}000$ มม.² $= 1.2$ m²"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.packaging-systems.p003
    topics: [management.operations.packaging-systems]
    difficulty: 1
    type: match
    stem: "จับคู่ระดับบรรจุภัณฑ์กับตัวอย่าง"
    pairs:
      - { left: "ชั้นใน", right: "ซองฟอยล์ที่หุ้มขนมแต่ละชิ้นให้สัมผัสสินค้าโดยตรง" }
      - { left: "ชั้นกลาง", right: "กล่องกระดาษที่รวมซองหลายซองเข้าด้วยกันเพื่อการขาย" }
      - { left: "ชั้นนอก", right: "ลังลูกฟูกที่บรรจุกล่องกลางหลายกล่องเพื่อการขนส่ง" }
      - { left: "หน่วยขนส่ง (unit load)", right: "พาเลทที่รวมลังหลายลังให้ยกด้วยเครื่องจักรได้ทีเดียว" }
    hints:
      - "ชั้นในคือสิ่งที่อยู่ชิดกับสินค้ามากที่สุด"
      - "หน่วยขนส่งไม่ใช่บรรจุภัณฑ์ที่สัมผัสสินค้า แต่เป็นสิ่งที่รวมลังเข้าด้วยกัน"
    solution: "ชั้นในสัมผัสสินค้า ชั้นกลางรวมหน่วยขาย ชั้นนอกใช้ขนส่ง และหน่วยขนส่งรวมลังหลายลังให้เป็นกองเดียวสำหรับเครื่องจักรยก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.packaging-systems.p004
    topics: [management.operations.packaging-systems]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นขนาดพื้นที่พาเลทที่อยู่ในรายการขนาดหลักของมาตรฐาน ISO 6780"
    choices:
      - { id: a, text: "1,200 × 1,200 มม.", feedback: "ไม่อยู่ในรายการขนาดหลักของ ISO 6780" }
      - { id: b, text: "1,000 × 1,200 มม.", correct: true }
      - { id: c, text: "1,300 × 1,000 มม.", feedback: "ไม่อยู่ในรายการขนาดหลักของ ISO 6780" }
      - { id: d, text: "900 × 900 มม.", feedback: "ไม่อยู่ในรายการขนาดหลักของ ISO 6780" }
    hints:
      - "มาตรฐานนี้มีหกขนาดหลัก ขนาดแต่ละขนาดมีด้านไม่เกินประมาณ 1,200 มม."
      - "ตัดตัวเลือกที่มีด้านที่ไม่เคยเป็นขนาดมาตรฐานก่อน แล้วเทียบกับรายการ"
    solution: "รายการขนาดหลักของ ISO 6780 ที่อ้างอิงกันทั่วไปรวม 1,000 × 1,200 มม. (เทียบเท่า 1,200 × 1,000 เมื่อหมุน) ขนาดอื่นในตัวเลือกไม่อยู่ในรายการนี้ ต้องตรวจรายการฉบับปัจจุบันจาก ISO"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.packaging-systems.p005
    topics: [management.operations.packaging-systems]
    difficulty: 2
    type: numeric
    stem: "กล่องขนาด 400 × 300 มม. วางบนพาเลท 1,200 × 1,000 มม. โดยไม่หมุนกล่องและไม่ให้กล่องยื่นเกินขอบพาเลท วางได้กี่กล่องต่อชั้น (ตอบเป็นจำนวนกล่อง)"
    answer: { value: 9, tolerance: 0, unit: "กล่อง" }
    hints:
      - "นับจำนวนกล่องตามด้านกว้างของพาเลทก่อน แล้วนับตามด้านยาว"
      - "ปัดลงทุกครั้งเพราะกล่องต้องเป็นแถวเต็ม"
    misconceptions:
      - { match: 10, feedback: "หารพื้นที่พาเลทด้วยพื้นที่กล่องได้ 10 แต่กล่องต้องวางเป็นแถวและคอลัมน์เต็ม 1,000 ÷ 300 ได้เพียง 3 แถวเต็ม" }
      - { match: 8, feedback: "นั่นคือจำนวนกล่องเมื่อหมุนกล่อง ข้อนี้ห้ามหมุน" }
    solution: "ด้านกว้าง $\\lfloor 1200/400 \\rfloor = 3$ กล่อง ด้านยาว $\\lfloor 1000/300 \\rfloor = 3$ กล่อง รวม $3 \\times 3 = 9$ กล่องต่อชั้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.packaging-systems.p006
    topics: [management.operations.packaging-systems]
    difficulty: 2
    type: numeric
    stem: "โรงงานข้าวเกรียบปลาในสมุทรสาคร (สมมติ) ใช้กล่องขนาด 400 × 300 × 250 มม. วางชั้นละ 9 กล่องบนพาเลท 1,200 × 1,000 มม. ทุกกล่องวางในทิศเดียวกัน พาเลทสูง 144 มม. และความสูงรวมของพาเลทกับกองกล่องต้องไม่เกิน 1,800 มม. ได้กล่องทั้งหมดกี่กล่องต่อกอง (ตอบเป็นจำนวนกล่อง)"
    answer: { value: 54, tolerance: 0, unit: "กล่อง" }
    hints:
      - "หาความสูงที่กล่องซ้อนได้ก่อน โดยหักความสูงพาเลทออกจาก 1,800 มม."
      - "จำนวนชั้นต้องเป็นจำนวนเต็มและปัดลง แล้วคูณด้วยจำนวนต่อชั้น"
    misconceptions:
      - { match: 63, feedback: "ลืมหักความสูงของพาเลทออกก่อนหาร จึงได้ 7 ชั้นเกินจริง" }
    solution: "ความสูงที่ซ้อนได้ $1800 - 144 = 1656$ มม. จำนวนชั้น $\\lfloor 1656 / 250 \\rfloor = 6$ ชั้น ทั้งหมด $6 \\times 9 = 54$ กล่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.packaging-systems.p007
    topics: [management.operations.packaging-systems]
    difficulty: 2
    type: numeric
    stem: "กล่องขนาด 400 × 300 มม. วางชั้นละ 9 กล่องบนพาเลท 1,200 × 1,000 มม. โดยทุกกล่องวางในทิศเดียวกัน พื้นที่ฐานที่กล่องคลุมคิดเป็นร้อยละเท่าใดของพื้นที่พาเลท (ตอบเป็นตัวเลขในหน่วย %)"
    answer: { value: 90, tolerance: 0.1, unit: "%" }
    hints:
      - "หาพื้นที่ที่กล่องทั้งหมดคลุมก่อน คือจำนวนกล่องคูณพื้นที่หนึ่งกล่อง"
      - "อัตราการใช้พื้นที่ = พื้นที่ที่กล่องคลุม ÷ พื้นที่พาเลท × 100"
    misconceptions:
      - { match: 75, feedback: "นั่นคือสัดส่วนปริมาตรของกล่องทั้งกองเทียบกับกรอบ 1,200 × 1,000 × 1,800 มม. ซึ่งเป็นคนละตัวชี้วัดกับพื้นที่ฐาน" }
      - { match: 100, feedback: "ไม่ได้คิดช่องว่างที่เหลือบนพาเลท เมื่อกล่องวางไม่เต็มพื้นที่ ร้อยละจึงต่ำกว่า 100" }
    solution: "พื้นที่กล่องหนึ่งใบ $400 \\times 300 = 120{,}000$ มม.² พื้นที่ที่คลุม $9 \\times 120{,}000 = 1{,}080{,}000$ มม.² เทียบพื้นที่พาเลท $1{,}200{,}000$ มม.² ได้ $90\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.packaging-systems.p008
    topics: [management.operations.packaging-systems]
    difficulty: 4
    type: numeric
    stem: "พาเลทหนึ่งกองมี 6 ชั้น ชั้นละ 9 กล่อง กล่องละ 8.5 กก. สมมติให้น้ำหนักกระจายเท่ากันทุกกล่อง กล่องหนึ่งในชั้นล่างสุดต้องรับน้ำหนักจากกล่องที่ซ้อนอยู่ด้านบนโดยเฉลี่ยกี่กิโลกรัม (ไม่รวมน้ำหนักพาเลท ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 42.5, tolerance: 0.05, unit: "กก." }
    hints:
      - "กล่องชั้นล่างรับน้ำหนักเฉพาะกล่องที่อยู่เหนือมันขึ้นไป ไม่รวมชั้นล่างเอง"
      - "หาจำนวนกล่องทั้งหมดที่อยู่เหนือชั้นล่างสุด แล้วหารด้วยจำนวนกล่องในชั้นล่างสุด"
    misconceptions:
      - { match: 382.5, feedback: "นั่นคือน้ำหนักรวมของกล่องเหนือชั้นล่างทั้งหมด ยังไม่ได้หารด้วยจำนวนกล่องในชั้นล่าง" }
      - { match: 51, feedback: "นั่นคือน้ำหนักของทั้งคอลัมน์ 6 กล่อง รวมกล่องล่างสุดตัวมันเองด้วย ซึ่งไม่ได้รับน้ำหนักจากตัวมันเอง" }
    solution: "ชั้นเหนือชั้นล่างมี $5 \\times 9 = 45$ กล่อง รวมน้ำหนัก $45 \\times 8.5 = 382.5$ กก. หารด้วย 9 กล่องในชั้นล่างได้ $42.5$ กก. ต่อกล่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.packaging-systems.p009
    topics: [management.operations.packaging-systems]
    difficulty: 3
    type: numeric
    stem: "กล่องมีค่าความแข็งกด (BCT) 150 กิโลกรัม (ค่าสมมติ) ใช้ตัวคูณความปลอดภัย 2.0 กล่องละ 8.5 กก. เมื่อซ้อนแนวดิ่งกันจะซ้อนได้มากที่สุดกี่กล่อง (รวมกล่องล่างสุดด้วย ตอบเป็นจำนวนกล่อง)"
    answer: { value: 9, tolerance: 0, unit: "กล่อง" }
    hints:
      - "น้ำหนักที่กล่องล่างสุดรับได้ต้องไม่เกินค่า BCT หารด้วยตัวคูณความปลอดภัย"
      - "หาจำนวนกล่องเหนือชั้นล่างสุดที่รับได้ แล้วอย่าลืมบวกกล่องล่างสุดเข้าไป"
    misconceptions:
      - { match: 18, feedback: "ไม่ได้หารค่า BCT ด้วยตัวคูณความปลอดภัย 2.0 จึงได้จำนวนชั้นเกินจริง" }
      - { match: 8, feedback: "นับเฉพาะกล่องเหนือชั้นล่างแล้วลืมนับกล่องล่างสุดซึ่งต้องนับด้วย" }
    solution: "น้ำหนักที่รับได้เหนือกล่องล่างสุด $150 / 2.0 = 75$ กก. จำนวนกล่องเหนือได้ $\\lfloor 75 / 8.5 \\rfloor = 8$ กล่อง (ถ้า 9 กล่องจะได้ $76.5$ กก. เกินค่า) รวมกล่องล่างสุดได้ $8 + 1 = 9$ กล่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.packaging-systems.p010
    topics: [management.operations.packaging-systems]
    difficulty: 3
    type: numeric
    stem: "กลุ่มแม่บ้านทำน้ำพริกแปรรูป (สมมติ) ส่งออก 2,000 กระปุกต่อเดือน กระปุกละ 150 บาท ใช้บรรจุภัณฑ์เดิมราคา 12 บาทต่อกระปุก มีกระปุกแตกระหว่างขนส่ง 4% บรรจุภัณฑ์ใหม่ราคา 15 บาทต่อกระปุก และคาดว่าแตกเหลือ 1% (สมมติ) ต้นทุนรวมที่ลดลงต่อเดือนเท่าใด (ต้นทุนรวม = ค่าบรรจุ + มูลค่าสินค้าที่เสียหาย หน่วยเป็นบาท)"
    answer: { value: 3000, tolerance: 0, unit: "บาท" }
    hints:
      - "คำนวณต้นทุนรวมต่อเดือนของทั้งสองทางเลือกแยกกัน แล้วนำมาลบกัน"
      - "มูลค่าสินค้าที่เสียหายคือจำนวนกระปุกที่แตกคูณด้วยราคาต่อกระปุก"
    misconceptions:
      - { match: 9000, feedback: "นั่นคือการประหยัดจากความเสียหายเท่านั้น ลืมหักค่าบรรจุที่เพิ่มขึ้นอีก 6,000 บาท" }
    solution: "เดิม $12 \\times 2000 + 0.04 \\times 2000 \\times 150 = 24{,}000 + 12{,}000 = 36{,}000$ บาท ใหม่ $15 \\times 2000 + 0.01 \\times 2000 \\times 150 = 30{,}000 + 3{,}000 = 33{,}000$ บาท ลดลง $3{,}000$ บาทต่อเดือน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.packaging-systems.p011
    topics: [management.operations.packaging-systems]
    difficulty: 4
    type: numeric
    stem: "ผู้ส่งออกผลไม้ไทยรายหนึ่ง (สมมติ) ใช้พาเลทไม้ใช้ครั้งเดียวราคา 180 บาทต่อพาเลท (สมมติ) พาเลทพลาสติกหมุนเวียนราคา 900 บาท และทุกรอบที่ใช้ต้องทำความสะอาดและขนส่งกลับ 10 บาท พาเลทพลาสติกต้องใช้อย่างน้อยกี่รอบจึงมีต้นทุนรวมต่ำกว่าพาเลทไม้ (ตอบเป็นจำนวนรอบเต็ม)"
    answer: { value: 6, tolerance: 0, unit: "รอบ" }
    hints:
      - "ต้นทุนพาเลทพลาสติกเมื่อใช้ n รอบคือ 900 + 10n บาท และต้นทุนพาเลทไม้เมื่อใช้ n ครั้งคือ 180n บาท"
      - "หาค่า n ที่ทำให้ 180n มากกว่า 900 + 10n แล้วปัดขึ้นเป็นจำนวนเต็ม"
    misconceptions:
      - { match: 5, feedback: "ที่ 5 รอบ พาเลทพลาสติกรวมค่าทำความสะอาดเป็น 900 + 50 = 950 บาท ยังแพงกว่าพาเลทไม้ 5 × 180 = 900 บาท อย่าลืมค่าทำความสะอาด 10 บาทต่อรอบ และต้องต่ำกว่า ไม่ใช่แค่เท่ากัน" }
    solution: "ต้องให้ $180n > 900 + 10n$ จึงได้ $170n > 900$ และ $n > 5.29$ ปัดขึ้นเป็น 6 รอบ ที่ 6 รอบ พาเลทพลาสติกรวม $960$ บาท พาเลทไม้รวม $1{,}080$ บาท"
    license: CC-BY-SA-4.0
