      - { id: d, text: "การต้มทำให้คลอโรพลาสต์ทำงานเร็วขึ้น", feedback: "ชุดที่ต้มไม่เปลี่ยนสี การต้มทำลายโปรตีนในระบบแสงและตัวรับอิเล็กตรอน" }
