problems:
  - id: phy.wave.p001
    topics: [physics.waves.wave-basics]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นคลื่นตามขวาง"
    choices:
      - { id: a, text: "คลื่นในเส้นเชือกที่ปลายถูกสะบัดขึ้นลง", correct: true }
      - { id: b, text: "คลื่นเสียงที่เดินทางในอากาศ", feedback: "อนุภาคของอากาศสั่นไปมาในแนวเดียวกับทิศที่เสียงเดินทาง เกิดเป็นส่วนอัดและส่วนขยาย เสียงจึงเป็นคลื่นตามยาว" }
      - { id: c, text: "คลื่นในขดสปริงที่ปลายถูกดันเข้าและดึงออกตามแนวยาวของสปริง", feedback: "ขดสปริงสั่นไปมาในแนวเดียวกับทิศที่คลื่นเคลื่อนที่ จึงเป็นคลื่นตามยาว" }
    hints:
      - "คลื่นตามขวาง: อนุภาคสั่นในทิศ **ตั้งฉาก** กับทิศที่คลื่นเคลื่อนที่"
      - "ดูแต่ละตัวเลือกว่าตัวกลางสั่นไปทางไหน เทียบกับทิศที่คลื่นวิ่งไป"
    solution: "เมื่อสะบัดเชือกขึ้นลง เชือกแต่ละส่วนสั่นขึ้นลง ส่วนคลื่นวิ่งไปตามแนวเชือก ทิศการสั่นตั้งฉากกับทิศของคลื่นจึงเป็นคลื่นตามขวาง ส่วนเสียงและคลื่นที่เกิดจากการดันดึงสปริงตามแนวยาวเป็นคลื่นตามยาว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wave.p002
    topics: [physics.waves.wave-basics]
    difficulty: 1
    type: numeric
    stem: "คลื่นในเส้นเชือกมีความถี่ $5\\ \\mathrm{Hz}$ และความยาวคลื่น $2\\ \\mathrm{m}$ คลื่นนี้เคลื่อนที่ด้วยอัตราเร็วเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s)"
    answer: { value: 10, unit: m/s }
    hints:
      - "ใช้สมการคลื่น $v = f\\lambda$"
      - "คูณความถี่กับความยาวคลื่น หน่วย $\\mathrm{Hz} \\times \\mathrm{m} = \\mathrm{m/s}$"
    misconceptions:
      - { match: 2.5, feedback: "ดูเหมือนนำความถี่หารด้วยความยาวคลื่น สมการคลื่นคือ $v = f\\lambda$ ต้องคูณกัน" }
      - { match: 0.4, feedback: "ดูเหมือนนำความยาวคลื่นหารด้วยความถี่ ($\\tfrac{\\lambda}{f}$) ซึ่งไม่ใช่อัตราเร็ว ถ้าจะหารต้องหารด้วยคาบ $v = \\tfrac{\\lambda}{T}$" }
    solution: "$v = f\\lambda = (5\\ \\mathrm{Hz})(2\\ \\mathrm{m}) = 10\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wave.p003
    topics: [physics.waves.wave-basics]
    difficulty: 1
    type: text
    stem: "หน่วยของความถี่ ซึ่งหมายถึงจำนวนรอบต่อวินาที เรียกว่าอะไร (ตอบชื่อหน่วยหรือสัญลักษณ์)"
    accepted: ["เฮิรตซ์", "เฮิร์ตซ์", "เฮิรตซ", "Hz", "hertz", "รอบต่อวินาที", "1/s", "s^-1"]
    misconceptions:
      - { match: "วินาที", feedback: "วินาทีเป็นหน่วยของ **คาบ** (เวลาที่ใช้ต่อรอบ) ความถี่คือจำนวนรอบต่อวินาที ซึ่งเป็นส่วนกลับของคาบ" }
      - { match: "s", feedback: "$\\mathrm{s}$ เป็นหน่วยของคาบ ความถี่เป็นส่วนกลับของคาบ หน่วยจึงเป็นรอบต่อวินาที ซึ่งมีชื่อเรียกพิเศษ" }
      - { match: "เมตร", feedback: "เมตรเป็นหน่วยของความยาวคลื่นและแอมพลิจูด ไม่ใช่ความถี่" }
    hints:
      - "หน่วยนี้ตั้งชื่อตามนักฟิสิกส์ชาวเยอรมันผู้ทดลองเรื่องคลื่นแม่เหล็กไฟฟ้า"
      - "สัญลักษณ์ของหน่วยมีสองตัวอักษร เขียนขึ้นต้นด้วย H ตัวใหญ่"
    solution: "ความถี่มีหน่วยเป็นเฮิรตซ์ ($\\mathrm{Hz}$) โดย $1\\ \\mathrm{Hz} = 1$ รอบต่อวินาที $= 1\\ \\mathrm{s^{-1}}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wave.p004
    topics: [physics.waves.wave-basics]
    difficulty: 2
    type: numeric
    stem: "ชาวประมงที่จอดเรืออยู่ในอ่าวไทยสังเกตว่าเรือลอยขึ้นลงตามคลื่นครบ $12$ รอบในเวลา $60\\ \\mathrm{s}$ คาบของคลื่นนี้เป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย s)"
    answer: { value: 5, unit: s }
    hints:
      - "คาบคือเวลาที่ใช้ในการสั่นครบ 1 รอบ"
      - "นำเวลาทั้งหมดหารด้วยจำนวนรอบ"
    misconceptions:
      - { match: 0.2, feedback: "นั่นคือความถี่ (จำนวนรอบต่อวินาที $\\tfrac{12}{60}\\ \\mathrm{Hz}$) คาบเป็นส่วนกลับของความถี่ คือวินาทีต่อรอบ" }
    solution: "$T = \\dfrac{60\\ \\mathrm{s}}{12\\ \\text{รอบ}} = 5\\ \\mathrm{s}$ (ความถี่ $f = \\tfrac{1}{T} = 0.2\\ \\mathrm{Hz}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wave.p005
    topics: [physics.waves.wave-basics]
    difficulty: 2
    type: match
    stem: "จับคู่ปริมาณของคลื่นกับความหมาย"
    pairs:
      - { left: "แอมพลิจูด", right: "การกระจัดมากที่สุดของอนุภาคจากแนวสมดุล" }
      - { left: "ความยาวคลื่น", right: "ระยะระหว่างสันคลื่นสองสันที่อยู่ติดกัน" }
      - { left: "ความถี่", right: "จำนวนรอบของการสั่นใน 1 วินาที" }
      - { left: "คาบ", right: "เวลาที่ใช้ในการสั่นครบ 1 รอบ" }
    hints:
      - "สองปริมาณเป็น \"ระยะ\" (หน่วยเมตร) และอีกสองปริมาณเกี่ยวกับ \"เวลา\""
      - "ความถี่และคาบเป็นส่วนกลับของกัน ตัวหนึ่งคือรอบต่อวินาที อีกตัวคือวินาทีต่อรอบ"
    solution: "แอมพลิจูด = การกระจัดสูงสุดจากแนวสมดุล (m) · ความยาวคลื่น = ระยะระหว่างสันที่ติดกัน (m) · ความถี่ = จำนวนรอบต่อวินาที (Hz) · คาบ = เวลาต่อรอบ (s)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wave.p006
    topics: [physics.waves.wave-basics]
    difficulty: 3
    type: numeric
    stem: "คลื่นในเส้นเชือกมีความถี่ $2\\ \\mathrm{Hz}$ วัดระยะจากสันคลื่นถึงท้องคลื่นที่อยู่ถัดไปได้ $0.3\\ \\mathrm{m}$ คลื่นนี้มีอัตราเร็วเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s)"
    answer: { value: 1.2, tolerance: 0.01, unit: m/s }
    hints:
      - "ระยะจากสันคลื่นถึงท้องคลื่นที่อยู่ติดกันเป็นกี่ส่วนของความยาวคลื่น"
      - "สันถึงท้องคือครึ่งความยาวคลื่น หา $\\lambda$ ก่อนแล้วใช้ $v = f\\lambda$"
    misconceptions:
      - { match: 0.6, feedback: "ดูเหมือนใช้ระยะสันถึงท้อง ($0.3\\ \\mathrm{m}$) เป็นความยาวคลื่น ระยะนั้นเป็นเพียงครึ่งความยาวคลื่น ความยาวคลื่นวัดจากสันถึงสัน" }
    solution: "$\\lambda = 2 \\times 0.3\\ \\mathrm{m} = 0.6\\ \\mathrm{m}$ จึงได้ $v = f\\lambda = (2\\ \\mathrm{Hz})(0.6\\ \\mathrm{m}) = 1.2\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wave.p007
    topics: [physics.waves.wave-basics]
    difficulty: 3
    type: numeric
    stem: "นักเรียนยืนบนสะพานข้ามแม่น้ำเจ้าพระยา มองเห็นคลื่นที่เกิดจากเรือด่วนวิ่งผ่าน นับสันคลื่นที่เรียงกันได้ $5$ สัน และระยะจากสันแรกถึงสันที่ห้าประมาณ $8\\ \\mathrm{m}$ คลื่นนี้มีความยาวคลื่นเท่าใด (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 2, unit: m }
    hints:
      - "ระหว่างสันคลื่น 5 สันมีช่องว่างกี่ช่อง"
      - "แต่ละช่องระหว่างสันที่ติดกันคือ 1 ความยาวคลื่น นำระยะทั้งหมดหารด้วยจำนวนช่อง"
    misconceptions:
      - { match: 1.6, feedback: "ดูเหมือนหารด้วยจำนวนสัน (5) สันคลื่น 5 สันมีช่วงระหว่างสันเพียง 4 ช่วง จึงต้องหารด้วย 4" }
    solution: "สันคลื่น 5 สันมีช่วงระหว่างสัน 4 ช่วง ระยะ $8\\ \\mathrm{m}$ จึงเท่ากับ $4\\lambda$ ได้ $\\lambda = \\dfrac{8\\ \\mathrm{m}}{4} = 2\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wave.p008
    topics: [physics.waves.wave-basics]
    difficulty: 3
    type: mcq
    stem: "สะบัดปลายเชือกเส้นเดิมที่ตึงเท่าเดิม ให้ความถี่เพิ่มขึ้นเป็นสองเท่า ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "อัตราเร็วคลื่นเท่าเดิม ความยาวคลื่นลดลงครึ่งหนึ่ง", correct: true }
      - { id: b, text: "อัตราเร็วคลื่นเพิ่มเป็นสองเท่า ความยาวคลื่นเท่าเดิม", feedback: "อัตราเร็วคลื่นขึ้นกับตัวกลาง (ความตึงและมวลของเชือก) ไม่ได้ขึ้นกับว่าสะบัดถี่แค่ไหน เชือกเส้นเดิมตึงเท่าเดิม อัตราเร็วจึงเท่าเดิม" }
      - { id: c, text: "อัตราเร็วคลื่นเท่าเดิม ความยาวคลื่นเพิ่มเป็นสองเท่า", feedback: "ถ้า $v$ คงที่ใน $v = f\\lambda$ เมื่อ $f$ เพิ่ม $\\lambda$ ต้องลดลง ไม่ใช่เพิ่มขึ้น" }
      - { id: d, text: "ทั้งอัตราเร็วและความยาวคลื่นเท่าเดิม", feedback: "ถ้าทั้ง $v$ และ $\\lambda$ เท่าเดิม $f$ ก็ต้องเท่าเดิมตาม $v = f\\lambda$ แต่โจทย์บอกว่าความถี่เพิ่มขึ้น" }
    hints:
      - "อัตราเร็วคลื่นขึ้นกับแหล่งกำเนิดหรือตัวกลาง"
      - "ใช้ $v = f\\lambda$ โดยให้ $v$ คงที่ แล้วดูว่า $\\lambda$ ต้องเปลี่ยนอย่างไรเมื่อ $f$ เป็นสองเท่า"
    solution: "อัตราเร็วคลื่นขึ้นกับตัวกลาง เชือกเส้นเดิมตึงเท่าเดิมจึงได้ $v$ เท่าเดิม จาก $\\lambda = \\dfrac{v}{f}$ เมื่อ $f$ เป็นสองเท่า $\\lambda$ จึงเหลือครึ่งหนึ่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wave.p009
    topics: [physics.waves.wave-basics]
    difficulty: 4
    type: numeric
    stem: "คลื่นสึนามิในทะเลอันดามันเคลื่อนที่ในทะเลลึกด้วยอัตราเร็วประมาณ $200\\ \\mathrm{m/s}$ และมีคาบประมาณ $10$ นาที คลื่นนี้มีความยาวคลื่นประมาณกี่กิโลเมตร (ตอบเป็นตัวเลขในหน่วย km)"
    answer: { value: 120, unit: km }
    hints:
      - "แปลงคาบเป็นวินาทีก่อน: 1 นาที = 60 วินาที"
      - "ใช้ $v = \\dfrac{\\lambda}{T}$ จัดรูปเป็น $\\lambda = vT$ แล้วแปลงเมตรเป็นกิโลเมตร"
    misconceptions:
      - { match: 2, feedback: "ดูเหมือนใช้คาบเป็น 10 โดยไม่แปลงนาทีเป็นวินาที อัตราเร็วมีหน่วย $\\mathrm{m/s}$ เวลาจึงต้องเป็นวินาที $10$ นาที $= 600\\ \\mathrm{s}$" }
      - { match: 120000, feedback: "นั่นคือคำตอบในหน่วยเมตร โจทย์ถามเป็นกิโลเมตร หารด้วย 1000 อีกครั้ง" }
    solution: "$T = 10 \\times 60 = 600\\ \\mathrm{s}$ ได้ $\\lambda = vT = (200\\ \\mathrm{m/s})(600\\ \\mathrm{s}) = 120000\\ \\mathrm{m} = 120\\ \\mathrm{km}$ ความยาวคลื่นยาวมาก คนบนเรือกลางทะเลลึกจึงแทบไม่รู้สึกว่ามีคลื่นผ่าน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wave.p010
    topics: [physics.waves.wave-basics]
    difficulty: 4
    type: expression
    stem: "คลื่นเคลื่อนที่ด้วยอัตราเร็ว $v$ และมีคาบ $T$ เขียนความยาวคลื่นในรูปของ $v$ และ $T$"
    prefix: "\\lambda ="
    answer: { latex: "vT", variables: [v, T] }
    hints:
      - "ในเวลา 1 คาบ คลื่นเคลื่อนที่ได้ระยะทางเท่าใด"
      - "จาก $v = \\dfrac{\\lambda}{T}$ คูณทั้งสองข้างด้วย $T$"
    misconceptions:
      - { match: "\\frac{v}{T}", feedback: "ดูเหมือนสับสนคาบกับความถี่ $\\lambda = \\tfrac{v}{f}$ แต่ $f = \\tfrac{1}{T}$ จึงได้ $\\lambda = vT$ ลองตรวจหน่วย: $\\mathrm{m/s} \\times \\mathrm{s} = \\mathrm{m}$" }
      - { match: "\\frac{T}{v}", feedback: "หน่วยของ $\\tfrac{T}{v}$ คือ $\\mathrm{s^2/m}$ ไม่ใช่เมตร ระยะทาง = อัตราเร็ว × เวลา" }
    solution: "ในเวลา 1 คาบ คลื่นเคลื่อนที่ได้ 1 ความยาวคลื่น ระยะทาง = อัตราเร็ว × เวลา จึงได้ $\\lambda = vT$ (เท่ากับ $\\tfrac{v}{f}$ เพราะ $T = \\tfrac{1}{f}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wave.p011
    topics: [physics.waves.wave-basics]
    difficulty: 4
    type: numeric
    stem: "สะบัดปลายเชือกด้วยความถี่ $4\\ \\mathrm{Hz}$ เกิดคลื่นที่มีความยาวคลื่น $0.5\\ \\mathrm{m}$ คลื่นต้องใช้เวลากี่วินาทีจึงเคลื่อนที่ไปถึงอีกปลายหนึ่งของเชือกซึ่งอยู่ห่างออกไป $6\\ \\mathrm{m}$ (ตอบเป็นตัวเลขในหน่วย s)"
    answer: { value: 3, unit: s }
    hints:
      - "หาอัตราเร็วคลื่นจาก $v = f\\lambda$ ก่อน"
      - "จากนั้นใช้ความสัมพันธ์ของอัตราเร็ว: เวลา $= \\dfrac{\\text{ระยะทาง}}{\\text{อัตราเร็ว}}$"
    misconceptions:
      - { match: 12, feedback: "นั่นคือจำนวนความยาวคลื่นในเชือก ($\\tfrac{6}{0.5}$) ยังไม่ใช่เวลา ต้องหาอัตราเร็วคลื่นแล้วนำไปหารระยะทาง" }
      - { match: 1.5, feedback: "ดูเหมือนใช้ความถี่ ($4$) เป็นอัตราเร็ว ความถี่มีหน่วย $\\mathrm{Hz}$ ไม่ใช่ $\\mathrm{m/s}$ ต้องหาอัตราเร็วจาก $v = f\\lambda$ ก่อน" }
    solution: "$v = f\\lambda = (4\\ \\mathrm{Hz})(0.5\\ \\mathrm{m}) = 2\\ \\mathrm{m/s}$ เวลา $t = \\dfrac{6\\ \\mathrm{m}}{2\\ \\mathrm{m/s}} = 3\\ \\mathrm{s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wave.p012
    topics: [physics.waves.wave-basics]
    difficulty: 5
    type: numeric
    stem: "ทุ่นลอยในทะเลที่ชายหาดพัทยาขึ้นจากท้องคลื่นไปถึงสันคลื่นในเวลา $1.5\\ \\mathrm{s}$ และสันคลื่นที่อยู่ติดกันห่างกัน $6\\ \\mathrm{m}$ คลื่นนี้เคลื่อนที่ด้วยอัตราเร็วเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s)"
    answer: { value: 2, unit: m/s }
    hints:
      - "การขึ้นจากท้องคลื่นไปถึงสันคลื่นเป็นการสั่นกี่รอบ"
