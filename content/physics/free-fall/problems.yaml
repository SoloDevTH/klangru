  - id: phy.ff.p019
    topics: [physics.kinematics.free-fall]
    difficulty: 4
    type: numeric
    stem: "ยืนบนสะพานสูงจากผิวน้ำ $14.7\\ \\mathrm{m}$ แล้วขว้างก้อนหินลงตรง ๆ ด้วยอัตราเร็ว $4.9\\ \\mathrm{m/s}$ ก้อนหินกระทบน้ำด้วยอัตราเร็วเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ และไม่คิดแรงต้านอากาศ (ตอบเป็นตัวเลขในหน่วย m/s ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 17.67, tolerance: 0.1, unit: m/s }
    hints:
      - "ไม่รู้และไม่ถามเวลา ใช้ $v^2 = u^2 + 2gh$ (ตั้งทิศลงเป็นบวก)"
      - "อย่าบวกอัตราเร็วตรง ๆ ต้องรวมในรูปกำลังสอง"
    misconceptions:
      - { match: 21.87, feedback: "ดูเหมือนบวก $4.9$ กับ $\\sqrt{2gh}$ ตรง ๆ ต้องบวกกันในรูปกำลังสอง $v = \\sqrt{u^2 + 2gh}$" }
      - { match: 16.97, feedback: "นั่นคืออัตราเร็วเมื่อปล่อยจากหยุดนิ่ง ลืมความเร็วต้น $4.9\\ \\mathrm{m/s}$" }
    solution: "$v^2 = 4.9^2 + 2(9.8)(14.7) = 24.01 + 288.12 = 312.13$ ดังนั้น $v \\approx 17.7\\ \\mathrm{m/s}$"
