<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="sans-serif" font-size="15">
  <title>ตารางแฮช 7 ช่อง ดัชนี 0 ถึง 6 ฟังก์ชันแฮช h(k) = k mod 7 รหัส 6503 ไปช่อง 0 รหัส 6512 และ 6519 ไปช่อง 2 ทั้งคู่ เกิดการชนกันจึงต่อกันเป็นลิสต์ รหัส 6534 ไปช่อง 3 รหัส 6508 ไปช่อง 5 ช่องอื่นว่าง</title>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <rect x="0" y="0" width="760" height="380" fill="#ffffff"/>
  <text x="380.0" y="30.0" font-size="17" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">ตารางแฮช: h(รหัส) = รหัส mod 7</text>
  <rect x="300.0" y="50.0" width="70.0" height="40.0" rx="0" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="288.0" y="76.0" font-size="15" text-anchor="end" fill="#4b5563" font-weight="bold" xml:space="preserve">0</text>
  <rect x="300.0" y="90.0" width="70.0" height="40.0" rx="0" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="288.0" y="116.0" font-size="15" text-anchor="end" fill="#4b5563" font-weight="bold" xml:space="preserve">1</text>
  <rect x="300.0" y="130.0" width="70.0" height="40.0" rx="0" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="288.0" y="156.0" font-size="15" text-anchor="end" fill="#4b5563" font-weight="bold" xml:space="preserve">2</text>
  <rect x="300.0" y="170.0" width="70.0" height="40.0" rx="0" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="288.0" y="196.0" font-size="15" text-anchor="end" fill="#4b5563" font-weight="bold" xml:space="preserve">3</text>
  <rect x="300.0" y="210.0" width="70.0" height="40.0" rx="0" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="288.0" y="236.0" font-size="15" text-anchor="end" fill="#4b5563" font-weight="bold" xml:space="preserve">4</text>
  <rect x="300.0" y="250.0" width="70.0" height="40.0" rx="0" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="288.0" y="276.0" font-size="15" text-anchor="end" fill="#4b5563" font-weight="bold" xml:space="preserve">5</text>
  <rect x="300.0" y="290.0" width="70.0" height="40.0" rx="0" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="288.0" y="316.0" font-size="15" text-anchor="end" fill="#4b5563" font-weight="bold" xml:space="preserve">6</text>
  <line x1="335.0" y1="70.0" x2="404.0" y2="70.0" stroke="#374151" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="408.0" y="55.0" width="82.0" height="30.0" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="449.0" y="76.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">6503</text>
  <circle cx="335.0" cy="70.0" r="3" fill="#111827" stroke="#111827" stroke-width="1.5"/>
  <line x1="335.0" y1="150.0" x2="404.0" y2="150.0" stroke="#374151" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="408.0" y="135.0" width="82.0" height="30.0" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="449.0" y="156.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">6512</text>
  <circle cx="335.0" cy="150.0" r="3" fill="#111827" stroke="#111827" stroke-width="1.5"/>
  <line x1="494.0" y1="150.0" x2="514.0" y2="150.0" stroke="#374151" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="518.0" y="135.0" width="82.0" height="30.0" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="559.0" y="156.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">6519</text>
  <circle cx="335.0" cy="150.0" r="3" fill="#111827" stroke="#111827" stroke-width="1.5"/>
  <line x1="335.0" y1="190.0" x2="404.0" y2="190.0" stroke="#374151" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="408.0" y="175.0" width="82.0" height="30.0" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="449.0" y="196.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">6534</text>
  <circle cx="335.0" cy="190.0" r="3" fill="#111827" stroke="#111827" stroke-width="1.5"/>
  <line x1="335.0" y1="270.0" x2="404.0" y2="270.0" stroke="#374151" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="408.0" y="255.0" width="82.0" height="30.0" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="449.0" y="276.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">6508</text>
  <circle cx="335.0" cy="270.0" r="3" fill="#111827" stroke="#111827" stroke-width="1.5"/>
  <text x="30.0" y="80.0" font-size="15" text-anchor="start" fill="#111827" font-family="monospace" xml:space="preserve">6503 mod 7 = 0</text>
  <text x="30.0" y="110.0" font-size="15" text-anchor="start" fill="#111827" font-family="monospace" xml:space="preserve">6512 mod 7 = 2</text>
  <text x="30.0" y="140.0" font-size="15" text-anchor="start" fill="#111827" font-family="monospace" xml:space="preserve">6519 mod 7 = 2</text>
  <text x="30.0" y="170.0" font-size="15" text-anchor="start" fill="#111827" font-family="monospace" xml:space="preserve">6534 mod 7 = 3</text>
  <text x="30.0" y="200.0" font-size="15" text-anchor="start" fill="#111827" font-family="monospace" xml:space="preserve">6508 mod 7 = 5</text>
  <text x="560.0" y="192.0" font-size="14" text-anchor="middle" fill="#b45309" font-weight="bold" xml:space="preserve">ชนกัน (collision)</text>
  <text x="380.0" y="366.0" font-size="14" text-anchor="middle" fill="#4b5563" xml:space="preserve">ค้นรหัส: คำนวณ h แล้วดูเฉพาะช่องนั้น ไม่ต้องไล่ทั้งตาราง</text>
</svg>
