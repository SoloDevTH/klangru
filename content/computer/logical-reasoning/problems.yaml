problems:
  - id: computer.algorithms.logical-reasoning.p001
    topics: [computer.algorithms.logical-reasoning]
    difficulty: 1
    type: mcq
    stem: "กฎจราจร: ถ้าไฟจราจรเป็นสีแดง แล้วรถต้องหยุด ตอนนี้ไฟเป็นสีแดง รถต้องทำอย่างไร"
    choices:
      - { id: a, text: "หยุด", correct: true }
      - { id: b, text: "ขับต่อไปได้", feedback: "เงื่อนไข ไฟเป็นสีแดง เป็นจริง จึงต้องทำตามที่บอกหลัง แล้ว คือหยุด" }
      - { id: c, text: "บอกไม่ได้", feedback: "รู้ทั้งกฎและข้อเท็จจริง จึงสรุปได้แน่นอนว่าต้องหยุด" }
    hints:
      - "เงื่อนไขในกฎนี้คืออะไร ตอนนี้เป็นจริงหรือเท็จ"
      - "เมื่อเงื่อนไขเป็นจริง ให้ทำตามส่วนหลังคำว่า แล้ว"
    solution: "เงื่อนไข ไฟเป็นสีแดง เป็นจริง จึงสรุปได้ว่ารถต้องหยุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.logical-reasoning.p002
    topics: [computer.algorithms.logical-reasoning]
    difficulty: 2
    type: mcq
    stem: "รู้ว่า \"ถ้าฝนตก แล้วสนามหญ้าเปียก\" เป็นจริง เช้านี้แพรเห็นสนามหญ้าเปียก ข้อสรุปใดถูกต้อง"
    choices:
      - { id: a, text: "สรุปไม่ได้แน่นอนว่าฝนตก เพราะสนามอาจเปียกจากเหตุอื่น", correct: true }
      - { id: b, text: "ฝนตกแน่นอน", feedback: "นี่คือการคิดกลับด้าน กฎบอกว่าฝนตกทำให้สนามเปียก แต่ไม่ได้บอกว่าสนามเปียกได้จากฝนอย่างเดียว อาจมีคนรดน้ำ" }
      - { id: c, text: "ฝนไม่ได้ตกแน่นอน", feedback: "ข้อมูลที่มีไม่พอจะบอกว่าฝนไม่ตก ฝนอาจตกจริงก็ได้" }
    hints:
      - "มีเหตุอื่นที่ทำให้สนามเปียกได้หรือไม่"
      - "กฎ ถ้า A แล้ว B ไม่ได้บอกว่า ถ้า B แล้ว A"
    solution: "สนามเปียกได้หลายสาเหตุ เช่น ฝนตก รดน้ำ หรือน้ำค้าง การเห็นผลจึงสรุปเหตุไม่ได้แน่นอน ต้องหาข้อมูลเพิ่ม เช่น ดูว่าถนนเปียกด้วยหรือไม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.logical-reasoning.p003
    topics: [computer.algorithms.logical-reasoning]
    difficulty: 2
    type: numeric
    stem: "พิพิธภัณฑ์ใช้ผังงานในภาพคิดค่าเข้าชม น้องเก้าอายุ 8 ปี ต้องจ่ายกี่บาท"
    figure:
      src: ticket-price.svg
      alt: "ผังงาน: เริ่ม รับค่าอายุ แล้วถามว่า อายุ น้อยกว่า 12 หรือไม่ ถ้าใช่ ราคา 20 บาท ถ้าไม่ใช่ ถามต่อว่า อายุ มากกว่าหรือเท่ากับ 60 หรือไม่ ถ้าใช่ ราคา 30 บาท ถ้าไม่ใช่ ราคา 50 บาท จากนั้นแสดงราคา"
    answer: { value: 20, unit: บาท }
    hints:
      - "เริ่มจากเงื่อนไขแรก แทนอายุ 8 ลงไป"
      - "8 น้อยกว่า 12 หรือไม่ ถ้าใช่ไปทางไหน"
    misconceptions:
      - { match: 50, feedback: "50 บาทเป็นราคาเมื่อตอบ ไม่ใช่ ทั้งสองเงื่อนไข แต่ 8 < 12 เป็นจริงตั้งแต่เงื่อนไขแรก" }
    solution: "8 < 12 เป็นจริง จึงไปทาง ใช่ ได้ราคา 20 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.logical-reasoning.p004
    topics: [computer.algorithms.logical-reasoning]
    difficulty: 3
    type: numeric
    stem: "ใช้ผังงานค่าเข้าชมพิพิธภัณฑ์ในภาพ คุณตาอายุ 60 ปีพอดี ต้องจ่ายกี่บาท"
    figure:
      src: ticket-price.svg
      alt: "ผังงาน: เริ่ม รับค่าอายุ แล้วถามว่า อายุ น้อยกว่า 12 หรือไม่ ถ้าใช่ ราคา 20 บาท ถ้าไม่ใช่ ถามต่อว่า อายุ มากกว่าหรือเท่ากับ 60 หรือไม่ ถ้าใช่ ราคา 30 บาท ถ้าไม่ใช่ ราคา 50 บาท จากนั้นแสดงราคา"
    answer: { value: 30, unit: บาท }
    hints:
      - "ตรวจเงื่อนไขแรกก่อน 60 < 12 หรือไม่"
      - "เครื่องหมาย >= หมายถึงมากกว่าหรือเท่ากับ 60 >= 60 จริงหรือเท็จ"
    misconceptions:
      - { match: 50, feedback: "60 >= 60 เป็นจริง เพราะ >= รวมค่าที่เท่ากันด้วย คุณตาจึงได้ราคาผู้สูงอายุ" }
      - { match: 20, feedback: "60 < 12 เป็นเท็จ จึงไม่ได้ราคาเด็ก ต้องไปตรวจเงื่อนไขที่สอง" }
    solution: "60 < 12 เท็จ → ตรวจ 60 >= 60 จริง → ราคา 30 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.logical-reasoning.p005
    topics: [computer.algorithms.logical-reasoning]
    difficulty: 2
    type: mcq
    stem: "ไฟทางเดินอัตโนมัติเปิดเมื่อ \"มืด **และ** มีคนเดินผ่าน\" ตอนเที่ยงวันแดดจ้า มีนักเรียนเดินผ่าน ไฟจะเป็นอย่างไร"
    choices:
      - { id: a, text: "ไฟไม่เปิด", correct: true }
      - { id: b, text: "ไฟเปิด", feedback: "มีคนเดินผ่านจริง แต่ไม่มืด เงื่อนไขแบบ และ ต้องจริงทั้งสองข้อ ไฟจึงไม่เปิด" }
      - { id: c, text: "ไฟกะพริบ", feedback: "กฎนี้มีแค่เปิดหรือไม่เปิด ไม่มีการกะพริบ" }
    hints:
      - "ตรวจเงื่อนไขทีละข้อ: มืดหรือไม่ มีคนเดินผ่านหรือไม่"
      - "และ ต้องจริงทั้งสองข้อ"
    solution: "เที่ยงวันไม่มืด เงื่อนไขแรกเป็นเท็จ แม้มีคนเดินผ่าน ผลของ และ ก็เป็นเท็จ ไฟจึงไม่เปิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.logical-reasoning.p006
    topics: [computer.algorithms.logical-reasoning]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "สัญญาณกันขโมยดังเมื่อ \"ประตูเปิด **หรือ** หน้าต่างเปิด\" สถานการณ์ใดทำให้สัญญาณดัง (เลือกได้หลายข้อ)"
    choices:
      - { id: a, text: "ประตูเปิด หน้าต่างปิด", correct: true, feedback: "จริงหนึ่งข้อก็พอสำหรับ หรือ" }
      - { id: b, text: "ประตูปิด หน้าต่างเปิด", correct: true, feedback: "หน้าต่างเปิดเป็นจริง สัญญาณจึงดัง" }
      - { id: c, text: "ประตูเปิด หน้าต่างเปิด", correct: true, feedback: "จริงทั้งสองข้อ หรือ ก็เป็นจริงด้วย" }
      - { id: d, text: "ประตูปิด หน้าต่างปิด", feedback: "ทั้งสองเงื่อนไขเป็นเท็จ หรือ จึงเป็นเท็จ สัญญาณไม่ดัง" }
    hints:
      - "หรือ จริงเมื่อเงื่อนไขอย่างน้อยหนึ่งข้อเป็นจริง"
      - "มีกรณีเดียวที่ หรือ เป็นเท็จ"
    solution: "สัญญาณดังทุกกรณีที่ประตูหรือหน้าต่างเปิดอย่างน้อยหนึ่งอย่าง ไม่ดังกรณีเดียวคือปิดทั้งคู่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.logical-reasoning.p007
    topics: [computer.algorithms.logical-reasoning]
    difficulty: 2
    type: order
    stem: "ภูมิลืมนำการบ้านไปโรงเรียนบ่อย เรียงขั้นตอนการออกแบบวิธีแก้ปัญหาอย่างมีเหตุผล"
    items:
      - "บอกปัญหาให้ชัดว่าลืมการบ้านสัปดาห์ละหลายครั้ง"
      - "หาสาเหตุว่าเก็บกระเป๋าตอนเช้าที่รีบ"
      - "คิดวิธีแก้หลายแบบ เช่น ตั้งปลุกเตือน หรือจัดกระเป๋าตั้งแต่กลางคืน"
      - "เลือกวิธีจัดกระเป๋าตามตารางเรียนตอนกลางคืน เพราะแก้ที่สาเหตุโดยตรง"
      - "ลองทำหนึ่งสัปดาห์แล้วนับว่าลืมกี่ครั้ง"
    hints:
      - "ต้องรู้ปัญหาและสาเหตุก่อน จึงจะคิดวิธีแก้ได้ตรงจุด"
      - "ขั้นสุดท้ายคือการตรวจว่าวิธีที่เลือกได้ผลจริงหรือไม่"
    solution: "บอกปัญหา → หาสาเหตุ → คิดหลายทางเลือก → เลือกพร้อมเหตุผล → ลองทำและตรวจผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.logical-reasoning.p008
    topics: [computer.algorithms.logical-reasoning]
    difficulty: 3
    type: mcq
    stem: "เอ บี และซี ชอบสีต่างกันคนละสี คือ แดง เขียว และฟ้า รู้ว่า (1) บีชอบสีฟ้า (2) เอไม่ชอบสีแดง ซีชอบสีอะไร"
    choices:
      - { id: a, text: "แดง", correct: true }
      - { id: b, text: "เขียว", feedback: "ถ้าซีชอบเขียว เอต้องชอบแดง ซึ่งขัดกับข้อ (2) ที่บอกว่าเอไม่ชอบแดง" }
      - { id: c, text: "ฟ้า", feedback: "บีชอบสีฟ้าแล้ว และแต่ละคนชอบสีต่างกัน ซีจึงชอบฟ้าไม่ได้" }
    hints:
      - "ใช้ข้อ (1) ตัดสีฟ้าออก เหลือแดงกับเขียวสำหรับเอและซี"
      - "เอไม่ชอบแดง เอจึงชอบสีที่เหลือสีใด"
    solution: "บีชอบฟ้า เหลือแดงกับเขียว เอไม่ชอบแดง เอจึงชอบเขียว ซีจึงชอบแดง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.logical-reasoning.p009
    topics: [computer.algorithms.logical-reasoning]
    difficulty: 3
    type: mcq
    stem: "มีเหรียญ 9 เหรียญ เหรียญปลอม 1 เหรียญหนักกว่าเหรียญอื่น แบ่งเป็น 3 กลุ่ม กลุ่มละ 3 เหรียญ แล้วชั่งกลุ่ม ก กับกลุ่ม ข ได้ผลตามภาพ เหรียญปลอมอยู่ในกลุ่มใด"
    figure:
      src: coin-balance.svg
      alt: "ตาชั่งสองแขน จานซ้ายมีกลุ่ม ก 3 เหรียญ จานขวามีกลุ่ม ข 3 เหรียญ คานเอียง จานขวาต่ำลง จานซ้ายยกสูงขึ้น กลุ่ม ค 3 เหรียญวางไว้นอกตาชั่ง"
    choices:
      - { id: a, text: "กลุ่ม ข", correct: true }
      - { id: b, text: "กลุ่ม ก", feedback: "จานที่ยกสูงขึ้นคือจานที่เบากว่า เหรียญปลอมหนักกว่า จึงอยู่ในจานที่ต่ำลง" }
      - { id: c, text: "กลุ่ม ค", feedback: "ถ้าเหรียญปลอมอยู่ในกลุ่ม ค ตาชั่งต้องสมดุล แต่ภาพตาชั่งเอียง" }
      - { id: d, text: "บอกไม่ได้ ต้องชั่งกลุ่ม ค ด้วย", feedback: "ผลการชั่งครั้งเดียวบอกได้แล้ว เพราะตาชั่งเอียงไปข้างหนึ่ง" }
    hints:
      - "จานที่หนักกว่าจะต่ำลงหรือยกขึ้น"
      - "ถ้าเหรียญปลอมไม่ได้อยู่บนตาชั่ง ตาชั่งจะเป็นอย่างไร"
    solution: "จานขวาที่มีกลุ่ม ข ต่ำลง แปลว่ากลุ่ม ข หนักกว่า เหรียญปลอมที่หนักกว่าจึงอยู่ในกลุ่ม ข"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.logical-reasoning.p010
    topics: [computer.algorithms.logical-reasoning]
    difficulty: 3
    type: numeric
    stem: "มีเหรียญ 9 เหรียญ หนึ่งเหรียญเป็นเหรียญปลอมที่หนักกว่า ใช้ตาชั่งสองแขนด้วยวิธีแบ่ง 3 กลุ่ม กลุ่มละ 3 เหรียญ ต้องชั่งกี่ครั้งจึงรู้แน่นอนว่าเหรียญใดปลอม ไม่ว่าเหรียญปลอมจะเป็นเหรียญใด"
    answer: { value: 2, unit: ครั้ง }
    hints:
      - "ชั่งครั้งแรก กลุ่มแรกกับกลุ่มที่สอง บอกได้ว่าเหรียญปลอมอยู่กลุ่มใด"
      - "จาก 3 เหรียญในกลุ่มนั้น ชั่ง 1 เหรียญกับ 1 เหรียญ ถ้าสมดุล เหรียญปลอมคือเหรียญที่เหลือ"
    misconceptions:
      - { match: 4, feedback: "4 ครั้งคือกรณีแย่ที่สุดของการชั่งทีละคู่ การแบ่ง 3 กลุ่มตัดตัวเลือกได้ 2 ใน 3 ทุกครั้ง จึงใช้น้อยกว่า" }
      - { match: 3, feedback: "หลังชั่งครั้งแรก เหลือ 3 เหรียญ ชั่งอีกครั้งเดียวก็รู้แล้ว เพราะถ้าสมดุล เหรียญที่ไม่ได้ชั่งคือเหรียญปลอม" }
    solution: "ครั้งที่ 1: ชั่งกลุ่ม 1 กับกลุ่ม 2 รู้ว่าเหรียญปลอมอยู่กลุ่มใด (ถ้าสมดุลคือกลุ่ม 3) ครั้งที่ 2: ชั่ง 2 เหรียญจากกลุ่มนั้น ข้างที่ต่ำคือเหรียญปลอม ถ้าสมดุลคือเหรียญที่เหลือ รวม 2 ครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.logical-reasoning.p011
    topics: [computer.algorithms.logical-reasoning]
    difficulty: 3
    type: mcq
    stem: |
      นักเรียนต้องเลือกเส้นทางไปโรงเรียนที่ **ปลอดภัย** และใช้เวลา **ไม่เกิน 15 นาที** ควรเลือกเส้นทางใด

      | เส้นทาง | เวลา | ข้อมูลความปลอดภัย |
      |---|---|---|
      | ก | 10 นาที | ต้องข้ามถนนใหญ่โดยไม่มีทางม้าลาย |
      | ข | 14 นาที | มีทางเท้าและสะพานลอย |
      | ค | 20 นาที | มีทางเท้าตลอดทาง |
    choices:
      - { id: a, text: "เส้นทาง ข", correct: true }
      - { id: b, text: "เส้นทาง ก", feedback: "เร็วที่สุด แต่ไม่ผ่านเกณฑ์ความปลอดภัย การข้ามถนนใหญ่ไม่มีทางม้าลายอันตราย" }
      - { id: c, text: "เส้นทาง ค", feedback: "ปลอดภัย แต่ใช้ 20 นาที เกินเกณฑ์ 15 นาที" }
    hints:
      - "ตรวจทีละเส้นทางว่าผ่านเกณฑ์ทั้งสองข้อหรือไม่"
      - "เกณฑ์เชื่อมด้วยคำว่า และ ต้องผ่านทั้งสองข้อ"
    solution: "ก ไม่ปลอดภัย ค ใช้เวลาเกิน 15 นาที มีเพียง ข ที่ปลอดภัยและใช้ 14 นาที จึงผ่านเกณฑ์ทั้งสองข้อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.logical-reasoning.p012
    topics: [computer.algorithms.logical-reasoning]
    difficulty: 3
    type: match
    stem: "จับคู่คำเชื่อมเงื่อนไขกับความหมาย"
    pairs:
      - { left: "และ", right: "จริงเมื่อเงื่อนไขทั้งสองเป็นจริง" }
      - { left: "หรือ", right: "จริงเมื่อเงื่อนไขอย่างน้อยหนึ่งเป็นจริง" }
      - { left: "ไม่", right: "กลับค่าจริงเป็นเท็จ และเท็จเป็นจริง" }
      - { left: "ถ้า...แล้ว", right: "ทำคำสั่งเมื่อเงื่อนไขเป็นจริง" }
    hints:
      - "และ เข้มงวดกว่า หรือ"
      - "คำใดใช้เลือกว่าจะทำคำสั่งหรือไม่"
    solution: "และ = จริงทั้งคู่, หรือ = จริงอย่างน้อยหนึ่ง, ไม่ = กลับค่า, ถ้า...แล้ว = ทำเมื่อเงื่อนไขจริง"
