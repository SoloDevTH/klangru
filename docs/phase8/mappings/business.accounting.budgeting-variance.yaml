  - { framework: th-tqf-accounting, indicators: ["8.1.2"], coverage: partial, note: "งบประมาณหลัก (ขาย การผลิต วัตถุดิบ เงินสด) จากการพยากรณ์ งบยืดหยุ่น ผลต่างปริมาณขายและงบยืดหยุ่น ผลต่างราคาและปริมาณของวัตถุดิบ ผลต่างอัตราและประสิทธิภาพแรงงาน กำไรส่วนงาน คำสั่งซื้อพิเศษ ผลิตเองหรือซื้อ ร่วมกับหัวข้อ product-costing ที่สอนพฤติกรรมต้นทุนและต้นทุนผลิตภัณฑ์ ยังไม่มีการบริหารสินค้าคงเหลือ (EOQ) ผลต่างค่าใช้จ่ายการผลิต การเทียบเคียงสมรรถนะ และ balanced scorecard" }
