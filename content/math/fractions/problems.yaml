  - id: math.frac.p014
    topics: [math.number.fractions]
    difficulty: 3
    type: numeric
    stem: "ศูนย์ช่วยเหลือผู้ประสบภัยน้ำท่วมมีข้าวสาร 50 กิโลกรัม แบ่งให้ 9 ครอบครัวเท่า ๆ กันจนหมด ครอบครัวหนึ่งได้ข้าวสารกี่กิโลกรัม (ตอบเป็นทศนิยมสองตำแหน่ง หน่วยกิโลกรัม)"
    answer: { value: 5.56, tolerance: 0.01, unit: kg }
    hints:
      - "เศษส่วน $\\tfrac{a}{b}$ หมายถึง $a \\div b$"
      - "ข้าว 50 กิโลกรัมแบ่ง 9 ส่วน ได้ส่วนละ $\\tfrac{50}{9}$ กิโลกรัม"
      - "หาร 50 ด้วย 9 แล้วปัดเป็นทศนิยมสองตำแหน่ง"
    misconceptions:
      - { match: 0.18, feedback: "นั่นคือ $9 \\div 50$ ตัวตั้งคือปริมาณข้าวที่ถูกแบ่ง (50) ตัวหารคือจำนวนครอบครัว (9)" }
      - { match: 5, feedback: "$50 \\div 9 = 5$ เศษ 5 แต่โจทย์แบ่งจนหมด ข้าวที่เหลือ 5 กิโลกรัมก็ต้องแบ่งต่อด้วย ได้อีก $\\tfrac{5}{9}$ กิโลกรัม" }
    solution: "แต่ละครอบครัวได้ $\\tfrac{50}{9} = 5\\tfrac{5}{9} \\approx 5.56$ กิโลกรัม (อยู่ระหว่าง 5 กับ 6 กิโลกรัม) ตรวจ: $\\tfrac{50}{9} \\times 9 = 50$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.frac.p015
    topics: [math.number.fractions]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "โดยไม่ต้องคำนวณ ข้อใดบ้างมีค่ามากกว่า 250 (เลือกได้มากกว่า 1 ข้อ)"
    choices:
      - { id: a, text: "$250 \\times \\dfrac{3}{4}$", feedback: "$\\tfrac{3}{4} < 1$ คูณแล้วได้ค่าเล็กลง (ได้แค่สามในสี่ของ 250)" }
      - { id: b, text: "$250 \\times \\dfrac{5}{4}$", correct: true }
      - { id: c, text: "$250 \\times \\dfrac{4}{4}$", feedback: "$\\tfrac{4}{4} = 1$ คูณแล้วได้ 250 เท่าเดิม ไม่ได้มากกว่า" }
      - { id: d, text: "$250 \\div \\dfrac{4}{3}$", feedback: "หารด้วยจำนวนที่มากกว่า 1 ได้ค่าเล็กลง เพราะเท่ากับ $250 \\times \\tfrac{3}{4}$" }
      - { id: e, text: "$250 \\div \\dfrac{3}{5}$", correct: true }
    hints:
      - "คูณด้วยจำนวนที่มากกว่า 1 ผลจะใหญ่ขึ้น คูณด้วยจำนวนที่น้อยกว่า 1 ผลจะเล็กลง"
      - "การหารด้วยเศษส่วนเท่ากับคูณด้วยส่วนกลับ ดูว่าส่วนกลับมากกว่าหรือน้อยกว่า 1"
    solution: "$\\tfrac{5}{4} > 1$ จึง $250 \\times \\tfrac{5}{4} > 250$ ✓ · $250 \\div \\tfrac{3}{5} = 250 \\times \\tfrac{5}{3}$ และ $\\tfrac{5}{3} > 1$ ✓ · ส่วน $\\tfrac{3}{4}$ และ $\\div \\tfrac{4}{3}$ ทำให้เล็กลง และ $\\tfrac{4}{4} = 1$ ได้เท่าเดิม (ค่าจริง: 187.5, 312.5, 250, 187.5, 416.67)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.frac.p016
    topics: [math.number.fractions]
    difficulty: 3
    type: numeric
    stem: "แปลงปลูกผักชีในกระบะเป็นรูปสี่เหลี่ยมผืนผ้า กว้าง $\\tfrac{2}{3}$ เมตร ยาว $\\tfrac{3}{4}$ เมตร มีพื้นที่กี่ตารางเมตร (ตอบเป็นทศนิยม หน่วยตารางเมตร)"
    answer: { value: 0.5, tolerance: 0.01, unit: "m^2" }
    hints:
      - "พื้นที่สี่เหลี่ยมผืนผ้า = กว้าง × ยาว ใช้ได้กับด้านที่เป็นเศษส่วนด้วย"
      - "นึกถึงสี่เหลี่ยมจัตุรัส 1 ตารางเมตร แบ่งเป็น $3 \\times 4 = 12$ ช่อง แปลงผักครอบกี่ช่อง"
      - "คูณเศษกับเศษ ส่วนกับส่วน แล้วทำเป็นอย่างต่ำ"
    misconceptions:
      - { match: 1.42, feedback: "ดูเหมือนนำ $\\tfrac{2}{3} + \\tfrac{3}{4}$ มาบวกกัน ซึ่งเป็นครึ่งหนึ่งของความยาวรอบรูป พื้นที่ต้องคูณ" }
      - { match: 2.83, feedback: "นั่นคือความยาวรอบรูป $2(\\tfrac{2}{3} + \\tfrac{3}{4})$ โจทย์ถามพื้นที่" }
    solution: "พื้นที่ $= \\tfrac{2}{3} \\times \\tfrac{3}{4} = \\tfrac{6}{12} = \\tfrac{1}{2} = 0.5$ ตารางเมตร ในสี่เหลี่ยมจัตุรัส 1 ตารางเมตรที่แบ่งเป็น 12 ช่อง แปลงผักครอบ $2 \\times 3 = 6$ ช่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.frac.p017
    topics: [math.number.fractions]
    difficulty: 4
    type: numeric
    stem: "ร้านผ้าไหมมีผ้ายาว $3\\tfrac{1}{2}$ เมตร ตัดเป็นผ้าพันคอผืนละ $\\tfrac{3}{4}$ เมตร ได้ผ้าพันคอเต็มผืนมากที่สุดกี่ผืน (ตอบเป็นจำนวนผืน)"
    answer: { value: 4, unit: ผืน }
    hints:
      - "ถามว่าในผ้า $3\\tfrac{1}{2}$ เมตร มีความยาว $\\tfrac{3}{4}$ เมตรอยู่กี่ช่วง จึงเป็นการหาร"
      - "เปลี่ยน $3\\tfrac{1}{2}$ เป็นเศษเกิน แล้วคูณด้วยส่วนกลับของ $\\tfrac{3}{4}$"
      - "ผลหารไม่ใช่จำนวนเต็ม ผ้าพันคอต้องเต็มผืน จึงปัดลง"
    misconceptions:
      - { match: 4.67, feedback: "$\\tfrac{14}{3} \\approx 4.67$ คือผลหารที่ถูกต้อง แต่ผ้าพันคอต้องเต็มผืน เศษที่เหลือไม่พอทำอีกผืน" }
      - { match: 5, feedback: "ปัดขึ้นไม่ได้ ผ้าที่เหลือหลังตัด 4 ผืนยาวแค่ $\\tfrac{1}{2}$ เมตร ไม่พอผืนที่ 5" }
      - { match: 2.63, feedback: "ดูเหมือนคูณ $3\\tfrac{1}{2} \\times \\tfrac{3}{4}$ แต่โจทย์ถามว่าแบ่งได้กี่ผืน ต้องหาร" }
    solution: "$3\\tfrac{1}{2} \\div \\tfrac{3}{4} = \\tfrac{7}{2} \\times \\tfrac{4}{3} = \\tfrac{28}{6} = 4\\tfrac{2}{3}$ ได้เต็มผืน 4 ผืน ใช้ผ้า $4 \\times \\tfrac{3}{4} = 3$ เมตร เหลือ $\\tfrac{1}{2}$ เมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.frac.p018
    topics: [math.number.fractions]
    difficulty: 4
    type: numeric
    stem: "พี่ได้เงินเดือน ใช้ $\\tfrac{2}{5}$ ของเงินเดือนเป็นค่าอาหาร แล้วใช้ $\\tfrac{1}{3}$ ของเงินที่เหลือเป็นค่าเดินทาง หลังจากนั้นเหลือเงิน 6,000 บาท พี่ได้เงินเดือนกี่บาท (ตอบในหน่วยบาท)"
    answer: { value: 15000, unit: บาท }
    hints:
      - "หลังจ่ายค่าอาหาร เหลือ $1 - \\tfrac{2}{5} = \\tfrac{3}{5}$ ของเงินเดือน"
      - "ค่าเดินทางคือ $\\tfrac{1}{3}$ ของ $\\tfrac{3}{5}$ เมื่อจ่ายแล้วจะเหลือ $\\tfrac{2}{3}$ ของ $\\tfrac{3}{5}$"
      - "เศษส่วนที่เหลือของเงินเดือนเท่ากับ 6,000 บาท ใช้หาเงินเดือนทั้งหมด"
    misconceptions:
      - { match: 22500, feedback: "ดูเหมือนคิดค่าเดินทางเป็น $\\tfrac{1}{3}$ ของเงินเดือนทั้งหมด แต่โจทย์บอกว่าเป็น $\\tfrac{1}{3}$ ของเงินที่เหลือหลังจ่ายค่าอาหาร" }
      - { match: 10000, feedback: "$\\tfrac{3}{5}$ ของ 10,000 คือ 6,000 แต่นั่นคือเงินก่อนจ่ายค่าเดินทาง ยังต้องหัก $\\tfrac{1}{3}$ ของส่วนนี้ด้วย" }
    solution: "เหลือหลังค่าอาหาร $\\tfrac{3}{5}$ ค่าเดินทาง $\\tfrac{1}{3} \\times \\tfrac{3}{5} = \\tfrac{1}{5}$ เหลือ $\\tfrac{3}{5} - \\tfrac{1}{5} = \\tfrac{2}{5}$ ของเงินเดือน $= 6{,}000$ บาท เงินเดือน $= 6{,}000 \\div \\tfrac{2}{5} = 15{,}000$ บาท ตรวจ: อาหาร 6,000 เหลือ 9,000 เดินทาง 3,000 เหลือ 6,000 ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.frac.p019
