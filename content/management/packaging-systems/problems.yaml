      - { id: b, text: "เพื่อให้วางพาเลทได้เต็มพื้นที่ภายในโดยมีที่ว่างเหลือน้อย", correct: true }
      - { id: c, text: "เพื่อไม่ต้องใช้ฉลากขนถ่ายและบาร์โค้ดบนกล่อง", feedback: "ฉลากและบาร์โค้ดยังจำเป็นต่อการขนถ่ายและการติดตาม ไม่เกี่ยวกับขนาดพาเลท" }
      - { id: d, text: "เพื่อให้ผู้รับต้องแกะพาเลทออกทุกครั้งก่อนเก็บ", feedback: "ตรงข้ามกับเป้าหมายของหน่วยขนส่ง ซึ่งลดการจับต้องสินค้าทีละชิ้น" }
    hints:
