      - { id: b, text: "การสลายพันธะในกลูโคสปล่อยพลังงานออกมา", feedback: "การสลายพันธะต้องใช้พลังงานเสมอ พลังงานถูกปล่อยเมื่อเกิดพันธะใหม่" }
      - { id: c, text: "ATP ถูกสร้างจากอะตอมของกลูโคส", feedback: "ATP สร้างจาก ADP และ Pi ที่มีอยู่แล้ว อะตอมของกลูโคสกลายเป็น CO₂ และ H₂O" }
      - { id: d, text: "สสารถูกเปลี่ยนเป็นพลังงาน มวลของผลิตภัณฑ์จึงน้อยกว่าสารตั้งต้นมาก", feedback: "อะตอมทุกอะตอมยังอยู่ครบใน CO₂ และ H₂O พลังงานมาจากความต่างของพลังงานพันธะ ไม่ใช่การเปลี่ยนมวล" }
    hints:
