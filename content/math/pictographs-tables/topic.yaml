id: math.stats.pictographs-tables
subject: math
title: { th: แผนภูมิรูปภาพ ตาราง และกราฟเส้น, en: "Pictographs, tables and line graphs" }
summary: คัดแยกและนับข้อมูลด้วยรอยขีด อ่านและเขียนแผนภูมิรูปภาพเมื่อรูปหนึ่งแทน 1 2 5 หรือ 10 อ่านตารางทางเดียว ตารางสองทาง ตารางเวลา กราฟเส้น และใช้ตอบโจทย์
difficulty: 1.5
minutes: 35
prerequisites: [math.number.whole-mul-div]
encompasses:
  - { id: math.number.whole-mul-div, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: tally.svg
    alt: "ตารางรอยขีดสามแถว แมวมีรอยขีดหนึ่งกลุ่มห้า (สี่ขีดตั้งและหนึ่งขีดขวาง) กับอีก 2 ขีด รวม 7 สุนัขมีสองกลุ่มห้ากับอีก 2 ขีด รวม 12 ปลามี 4 ขีด รวม 4"
    caption: "ขีดที่ 5 ขีดขวางทับ 4 ขีดแรก จึงนับทีละห้าได้"
  - type: figure
    src: pictograph-fruit.svg
    alt: "แผนภูมิรูปภาพผลไม้ที่นักเรียนชั้น ป.2 ชอบ รูปคน 1 รูปแทนนักเรียน 2 คน มะม่วงมี 4 รูปครึ่ง ทุเรียน 3 รูป มังคุด 5 รูป กล้วย 2 รูปครึ่ง"
    caption: "1 รูปแทน 2 คน ครึ่งรูปจึงแทน 1 คน: มะม่วง 9 คน ทุเรียน 6 คน มังคุด 10 คน กล้วย 5 คน"
  - type: worked-example
    title: อ่านแผนภูมิรูปภาพที่ 1 รูปแทน 10
    problem: "แผนภูมิรูปภาพจำนวนแก้วน้ำมะพร้าวที่ขายได้ 1 รูปแทน 10 แก้ว วันเสาร์มี 7 รูป วันอาทิตย์มี 4 รูปครึ่ง วันเสาร์ขายได้มากกว่าวันอาทิตย์กี่แก้ว"
    steps:
      - text: "วันเสาร์: $7 \\times 10 = 70$ แก้ว"
        why: "1 รูปแทน 10 แก้ว ต้องคูณจำนวนรูปด้วย 10 ไม่ใช่ตอบ 7"
      - text: "ครึ่งรูปแทนครึ่งหนึ่งของ 10 คือ 5 แก้ว"
      - text: "วันอาทิตย์: $4 \\times 10 + 5 = 45$ แก้ว"
      - text: "มากกว่ากัน: $70 - 45 = 25$ แก้ว"
        why: "คำว่า มากกว่ากันเท่าไร ใช้การลบ"
    answer: "วันเสาร์ขายได้มากกว่า 25 แก้ว"
  - { type: check, problem: math.stats.pictographs-tables.p004, prompt: "ครึ่งรูปแทนกี่เล่ม" }
  - type: figure
    src: line-graph.svg
    alt: "กราฟเส้นความสูงของต้นถั่วที่วัดทุกสัปดาห์ แกนนอนเป็นสัปดาห์ที่ 0 ถึง 5 แกนตั้งเป็นความสูง 0 ถึง 20 เซนติเมตร ทีละ 2 จุดบนกราฟคือ 2, 5, 9, 14, 17 และ 18 เซนติเมตร เส้นชันที่สุดระหว่างสัปดาห์ที่ 2 กับ 3"
    caption: "เส้นขึ้นแปลว่าต้นถั่วสูงขึ้น ช่วงที่ชันที่สุดคือช่วงที่สูงขึ้นเร็วที่สุด"
  - type: worked-example
    title: เติมตารางสองทาง
    problem: "ตารางสองทางแสดงชมรมของนักเรียน ป.4/1 ดนตรี 9 คน กีฬา 14 คน ศิลปะยังไม่ทราบ และรวมทั้งห้อง 30 คน ห้อง ป.4/2 ดนตรี 11 คน กีฬา 12 คน ศิลปะ 6 คน มีนักเรียนอยู่ชมรมศิลปะทั้งสองห้องรวมกันกี่คน"
    steps:
      - text: "ป.4/1 ศิลปะ $= 30 - 9 - 14 = 7$ คน"
        why: "หลักรวมคือผลรวมของทุกชมรมในแถวนั้น"
      - text: "ศิลปะทั้งสองห้อง $= 7 + 6 = 13$ คน"
      - text: "ตรวจ: ป.4/2 รวม $11 + 12 + 6 = 29$ คน ทั้งหมด $30 + 29 = 59$ คน เท่ากับผลรวมของหลัก $20 + 26 + 13 = 59$"
        why: "ผลรวมตามแถวและตามหลักต้องได้เท่ากัน"
    answer: "13 คน"
  - { type: check, problem: math.stats.pictographs-tables.p012, prompt: "อ่านค่าสองเดือนก่อน แล้วลบกัน" }
glossary:
  - { term: รอยขีด, definition: "การขีดทีละขีดขณะนับ ขีดที่ 5 ขีดขวางทับเป็นกลุ่มละ 5" }
  - { term: แผนภูมิรูปภาพ, definition: "แผนภูมิที่ใช้รูปแทนจำนวน ต้องบอกว่า 1 รูปแทนเท่าไร" }
  - { term: ตารางทางเดียว, definition: "ตารางที่จำแนกข้อมูลเรื่องเดียว เช่น ผลไม้ที่ชอบ" }
  - { term: ตารางสองทาง, definition: "ตารางที่จำแนกข้อมูลสองเรื่องพร้อมกัน แต่ละช่องตรงกับทั้งแถวและหลัก" }
  - { term: กราฟเส้น, definition: "กราฟที่ลากเส้นต่อจุด แสดงการเปลี่ยนแปลงตามเวลา" }
  - { term: แผนภาพจุด, definition: "แผนภาพที่วางจุด 1 จุดต่อข้อมูล 1 ตัวเหนือเส้นจำนวน" }
flashcards:
  - { front: "1 รูปแทน 5 คน มี 6 รูป แทนกี่คน", back: "6 × 5 = 30 คน" }
  - { front: "รอยขีดสองกลุ่มที่มีขีดขวางกับอีก 3 ขีด เป็นเท่าไร", back: "5 + 5 + 3 = 13" }
  - { front: "ตารางสองทางต่างจากตารางทางเดียวอย่างไร", back: "จำแนกข้อมูลสองเรื่องพร้อมกัน (แถวและหลัก)" }
  - { front: "กราฟเส้นที่ลงแปลว่าอะไร", back: "ค่าลดลงในช่วงเวลานั้น" }
