    answer: { value: 1040, unit: N }
    hints:
      - 'รู้งาน การกระจัด และมุม ต้องการหาแรง'
      - 'จัดรูป $W = Fs\cos\theta$ ให้ $F$ อยู่ข้างเดียว'
      - '$F = \dfrac{W}{s\cos\theta}$ แล้วแทนค่า $\cos 60^\circ = 0.5$'
    misconceptions:
      - { match: 520, feedback: 'ดูเหมือนลืม $\cos\theta$ ค่า $\tfrac{W}{s}$ คือองค์ประกอบของแรงตามแนวพื้นเท่านั้น แรงในโซ่ต้องหารด้วย $\cos 60^\circ$ อีก' }
      - { match: 260, feedback: 'ดูเหมือนคูณด้วย $\cos 60^\circ$ แทนที่จะหาร จาก $W = Fs\cos\theta$ จะได้ $F = \tfrac{W}{s\cos\theta}$' }
    solution: '$F = \dfrac{W}{s\cos\theta} = \dfrac{13000\ \mathrm{J}}{(25\ \mathrm{m})(0.5)} = 1040\ \mathrm{N}$ ตรวจ: $(1040)(25)(0.5) = 13000\ \mathrm{J}$ ✓'
