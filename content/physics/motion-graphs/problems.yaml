      - "เริ่มจากหยุดนิ่งด้วยความเร่งคงตัว จึงใช้ $x = \\tfrac{1}{2}at^2$ ได้ ลองใช้จุดใดจุดหนึ่งหาค่า $a$ ก่อน"
