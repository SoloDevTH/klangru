  <text x="590.0" y="96.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">กำลังทำงาน</text>
  <rect x="700.0" y="182.0" width="140.0" height="56.0" rx="28" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="770.0" y="216.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">สิ้นสุด</text>
  <rect x="390.0" y="232.0" width="140.0" height="56.0" rx="28" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="460.0" y="266.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">รอ</text>
  <line x1="160.0" y1="90.0" x2="258.0" y2="90.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="209.0" y="80.0" font-size="12" text-anchor="middle" fill="#1f2937" xml:space="preserve">โหลดเข้า RAM</text>
  <path d="M400,78 L518,78" stroke="#1f2937" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
