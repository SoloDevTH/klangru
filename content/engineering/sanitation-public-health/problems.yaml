      - id: b
        text: ตรวจคุณภาพน้ำและปรับปรุงแหล่งน้ำ แยกบ่อจากบ่อเกรอะ พร้อมให้ความรู้ชุมชนเรื่องการปรับคุณภาพน้ำ
