    solution: "ทางซ้าย: กระแส $\\tfrac{12}{2 + 4} = 2\\ \\mathrm{A}$ ตกคร่อม $2\\ \\Omega$ ไป $4\\ \\mathrm{V}$ จุด P จึงต่ำกว่าขั้วบวก $4\\ \\mathrm{V}$ ทางขวา: กระแส $\\tfrac{12}{6} = 2\\ \\mathrm{A}$ ตกคร่อม $3\\ \\Omega$ ตัวบนไป $6\\ \\mathrm{V}$ จุด Q ต่ำกว่าขั้วบวก $6\\ \\mathrm{V}$ ดังนั้นความต่างศักย์ระหว่าง P กับ Q $= 6 - 4 = 2\\ \\mathrm{V}$ (P มีศักย์สูงกว่า)"
