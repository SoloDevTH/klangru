  - id: earthscience.geology.earth-structure-surface.p015
    topics: [earthscience.geology.earth-structure-surface]
    difficulty: 4
    type: mcq
    stem: "ภูเขาหัวโล้นในจังหวัดน่านถูกแผ้วถางป่าเพื่อปลูกข้าวโพด เมื่อฝนตกหนัก ดินถล่มและแม่น้ำขุ่นจัด ข้อใดอธิบายการเชื่อมโยงของระบบโลกได้ถูกต้องที่สุด"
    choices:
      - { id: a, text: "ชีวภาค (ป่าถูกตัด) ทำให้รากที่ยึดดินหายไป อุทกภาค (น้ำฝน) จึงกร่อนธรณีภาค (ดิน) และพาตะกอนลงแม่น้ำ", correct: true }
      - { id: b, text: "บรรยากาศทำให้ภูเขาร้อนจนดินแตก", feedback: "โจทย์เน้นการตัดป่าและฝนตกหนัก ไม่ใช่ความร้อน" }
      - { id: c, text: "ดินถล่มเกิดจากแผ่นดินไหวเท่านั้น", feedback: "ดินถล่มเกิดจากฝนตกหนักบนที่ลาดชันที่ไม่มีพืชยึดดินได้บ่อยมาก" }
      - { id: d, text: "ข้าวโพดดูดน้ำมากเกินไปจนดินแห้งและแตก", feedback: "ปัญหาคือข้าวโพดมีรากตื้น ยึดดินไม่ได้เหมือนป่า ไม่ใช่ดินแห้ง" }
    hints:
      - "รากไม้ใหญ่ทำหน้าที่อะไรกับดิน"
      - "ระบบโลกได้แก่ ธรณีภาค อุทกภาค บรรยากาศ และชีวภาค"
    solution: "การตัดป่า (ชีวภาค) ทำให้ไม่มีรากยึดดินและไม่มีเรือนยอดลดแรงฝน น้ำฝน (อุทกภาค) จึงกร่อนดิน (ธรณีภาค) อย่างรวดเร็ว เกิดดินถล่มและตะกอนลงแม่น้ำ แก้ได้ด้วยการปลูกป่า หรือปลูกหญ้าแฝกขวางความลาดชัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

