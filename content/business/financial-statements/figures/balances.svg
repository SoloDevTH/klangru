<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" font-family="sans-serif" font-size="14">
  <title>ตารางยอดคงเหลือหลังปรับปรุงของร้านอุปกรณ์กีฬา</title>
  <rect x="0" y="0" width="520" height="400" fill="#ffffff"/>
  <text x="260.0" y="24.0" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="bold">ยอดคงเหลือบางบัญชีของร้านอุปกรณ์กีฬา</text>
  <rect x="20.0" y="38.0" width="480.0" height="38.0" rx="0" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
  <text x="170.0" y="61.5" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">บัญชี (หลังปรับปรุง ณ 31 ธ.ค.)</text>
  <text x="410.0" y="61.5" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">จำนวนเงิน (บาท)</text>
  <line x1="320.0" y1="38.0" x2="320.0" y2="76.0" stroke="#1f2937" stroke-width="1"/>
  <rect x="20.0" y="76.0" width="480.0" height="38.0" rx="0" fill="#fff" stroke="#1f2937" stroke-width="1"/>
  <text x="28.0" y="99.5" text-anchor="start" fill="#1f2937" font-size="13">เงินสด</text>
  <text x="492.0" y="99.5" text-anchor="end" fill="#1f2937" font-size="13">38,000</text>
  <line x1="320.0" y1="76.0" x2="320.0" y2="114.0" stroke="#1f2937" stroke-width="1"/>
  <rect x="20.0" y="114.0" width="480.0" height="38.0" rx="0" fill="#fff" stroke="#1f2937" stroke-width="1"/>
  <text x="28.0" y="137.6" text-anchor="start" fill="#1f2937" font-size="13">ลูกหนี้การค้า</text>
  <text x="492.0" y="137.6" text-anchor="end" fill="#1f2937" font-size="13">12,000</text>
  <line x1="320.0" y1="114.0" x2="320.0" y2="152.0" stroke="#1f2937" stroke-width="1"/>
  <rect x="20.0" y="152.0" width="480.0" height="38.0" rx="0" fill="#fff" stroke="#1f2937" stroke-width="1"/>
  <text x="28.0" y="175.6" text-anchor="start" fill="#1f2937" font-size="13">สินค้าคงเหลือ</text>
  <text x="492.0" y="175.6" text-anchor="end" fill="#1f2937" font-size="13">25,000</text>
  <line x1="320.0" y1="152.0" x2="320.0" y2="190.0" stroke="#1f2937" stroke-width="1"/>
  <rect x="20.0" y="190.0" width="480.0" height="38.0" rx="0" fill="#fff" stroke="#1f2937" stroke-width="1"/>
  <text x="28.0" y="213.6" text-anchor="start" fill="#1f2937" font-size="13">อุปกรณ์</text>
  <text x="492.0" y="213.6" text-anchor="end" fill="#1f2937" font-size="13">90,000</text>
  <line x1="320.0" y1="190.0" x2="320.0" y2="228.0" stroke="#1f2937" stroke-width="1"/>
  <rect x="20.0" y="228.0" width="480.0" height="38.0" rx="0" fill="#fff" stroke="#1f2937" stroke-width="1"/>
  <text x="28.0" y="251.6" text-anchor="start" fill="#1f2937" font-size="13">ค่าเสื่อมราคาสะสม – อุปกรณ์</text>
  <text x="492.0" y="251.6" text-anchor="end" fill="#1f2937" font-size="13">18,000</text>
  <line x1="320.0" y1="228.0" x2="320.0" y2="266.0" stroke="#1f2937" stroke-width="1"/>
  <rect x="20.0" y="266.0" width="480.0" height="38.0" rx="0" fill="#fff" stroke="#1f2937" stroke-width="1"/>
  <text x="28.0" y="289.6" text-anchor="start" fill="#1f2937" font-size="13">เจ้าหนี้การค้า</text>
  <text x="492.0" y="289.6" text-anchor="end" fill="#1f2937" font-size="13">15,000</text>
  <line x1="320.0" y1="266.0" x2="320.0" y2="304.0" stroke="#1f2937" stroke-width="1"/>
  <rect x="20.0" y="304.0" width="480.0" height="38.0" rx="0" fill="#fff" stroke="#1f2937" stroke-width="1"/>
  <text x="28.0" y="327.6" text-anchor="start" fill="#1f2937" font-size="13">ค่าใช้จ่ายค้างจ่าย</text>
  <text x="492.0" y="327.6" text-anchor="end" fill="#1f2937" font-size="13">3,000</text>
  <line x1="320.0" y1="304.0" x2="320.0" y2="342.0" stroke="#1f2937" stroke-width="1"/>
  <rect x="20.0" y="342.0" width="480.0" height="38.0" rx="0" fill="#fff" stroke="#1f2937" stroke-width="1"/>
  <text x="28.0" y="365.6" text-anchor="start" fill="#1f2937" font-size="13">เงินกู้ยืมระยะยาว</text>
  <text x="492.0" y="365.6" text-anchor="end" fill="#1f2937" font-size="13">40,000</text>
  <line x1="320.0" y1="342.0" x2="320.0" y2="380.0" stroke="#1f2937" stroke-width="1"/>
</svg>
