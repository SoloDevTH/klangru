    ai_assisted: true

  - id: math.stats.discrete-distributions.p014
    topics: [math.stats.discrete-distributions]
    difficulty: 4
    type: expression
    stem: "สำหรับการแจกแจงไฮเปอร์จีโอเมตริก เมื่อหยิบ $n$ หน่วยจากประชากร $N$ หน่วยซึ่งมี $K$ หน่วยเป็นประเภทที่สนใจ จงเขียนค่าเฉลี่ย $E(X)$ ในรูปนิพจน์"
    prefix: "E(X) ="
    answer: { latex: "\\frac{nK}{N}", variables: [n, K, N] }
    misconceptions:
      - { match: "\\frac{nN}{K}", feedback: "สลับ $K$ กับ $N$ ค่าเฉลี่ยคือ $n$ คูณสัดส่วน $\\frac{K}{N}$ ซึ่งเป็นสัดส่วนของประเภทที่สนใจ" }
      - { match: "n\\cdot\\left(1-\\frac{K}{N}\\right)", feedback: "นั่นคือค่าเฉลี่ยของจำนวนหน่วยที่ไม่ใช่ประเภทที่สนใจ โจทย์ถามจำนวนประเภทที่สนใจ" }
    hints:
      - "ค่าเฉลี่ยคือจำนวนหน่วยที่หยิบ คูณด้วยสัดส่วนของประเภทที่สนใจในประชากร"
      - "สัดส่วนของประเภทที่สนใจคือ $\\frac{K}{N}$"
    solution: "$E(X)=\\frac{nK}{N}$ เป็นจำนวนหน่วยประเภทที่สนใจเฉลี่ยในตัวอย่างขนาด $n$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.discrete-distributions.p015
    topics: [math.stats.discrete-distributions]
    difficulty: 4
    type: numeric
    stem: "โรงงานแห่งหนึ่งตรวจชิ้นงานทีละชิ้น โดยแต่ละชิ้นเสียด้วยความน่าจะเป็น $0.05$ อย่างอิสระ โดยเฉลี่ยต้องตรวจกี่ชิ้นจึงจะพบชิ้นเสียชิ้นแรก (ตอบจำนวนเต็ม)"
    answer: { value: 20, tolerance: 0 }
    hints:
      - "จำนวนชิ้นที่ตรวจจนพบชิ้นเสียชิ้นแรกเป็นการแจกแจงเรขาคณิต"
      - "ค่าเฉลี่ยของการแจกแจงเรขาคณิตคือ $\\frac{1}{p}$"
      - "แทน $p=0.05$ ใน $\\frac{1}{p}$"
    misconceptions:
      - { match: 19, feedback: "19 คือ $\\frac{1-p}{p}$ ซึ่งนับเฉพาะชิ้นดีที่ตรวจก่อนพบชิ้นเสีย โจทย์นับรวมชิ้นเสียชิ้นแรกด้วย" }
    solution: "$E(X)=\\frac{1}{0.05}=20$ ชิ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.discrete-distributions.p016
    topics: [math.stats.discrete-distributions]
    difficulty: 5
    type: numeric
    stem: "ในกล่องมีลูกบอล 12 ลูก เป็นสีแดง 5 ลูก และสีน้ำเงิน 7 ลูก สุ่มหยิบ 4 ลูกโดยไม่ใส่คืน จงหาความน่าจะเป็นที่ได้ลูกสีแดงพอดี 2 ลูก (ตอบทศนิยม 4 ตำแหน่ง)"
    figure: { src: balls-in-box.svg, alt: "ลูกบอล 12 ลูกเรียงเป็นสี่คอลัมน์สามแถว มีลูกสีแดง 5 ลูก และลูกสีน้ำเงิน 7 ลูก" }
    answer: { value: 0.4242, tolerance: 0.0001 }
    hints:
      - "ลูกสีแดงและสีน้ำเงินเป็นสองประเภท และหยิบโดยไม่ใส่คืน จึงใช้การแจกแจงไฮเปอร์จีโอเมตริกได้"
      - "นับวิธีเลือกลูกสีแดง 2 ลูกจาก 5 ลูก และลูกสีน้ำเงิน 2 ลูกจาก 7 ลูก"
      - "หารด้วยวิธีเลือก 4 ลูกจาก 12 ลูกทั้งหมด"
    misconceptions:
      - { match: 0.3545, feedback: "0.3545 คือค่าจากทวินามที่มี $p=\\frac{5}{12}$ โดยถือว่าหยิบใส่คืน โจทย์หยิบโดยไม่ใส่คืนจึงต้องใช้การจัดหมู่" }
    solution: "$P(X=2)=\\frac{\\binom{5}{2}\\binom{7}{2}}{\\binom{12}{4}}=\\frac{10\\cdot 21}{495}=\\frac{14}{33}\\approx 0.4242$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.discrete-distributions.p017
    topics: [math.stats.discrete-distributions]
    difficulty: 5
    type: numeric
    stem: "นักฟุตบอลคนหนึ่งยิงลูกโทษเข้าด้วยความน่าจะเป็น $0.4$ ในแต่ละครั้งอย่างอิสระ จงหาความน่าจะเป็นที่เขายิงเข้าครั้งแรกภายในสามครั้งแรก นั่นคือ $P(X\\le 3)$ (ตอบทศนิยม 3 ตำแหน่ง)"
    answer: { value: 0.784, tolerance: 0.0005 }
    hints:
      - "ภายในสามครั้งแรกหมายถึง $X=1$ หรือ $X=2$ หรือ $X=3$"
      - "เหตุการณ์ตรงข้ามคือไม่เข้าเลยในสามครั้งแรก ซึ่งมีความน่าจะเป็น $(1-p)^3$"
      - "ใช้ $P(X\\le 3)=1-(1-p)^3$ โดยแทน $p=0.4$"
    misconceptions:
      - { match: 0.144, feedback: "0.144 คือ $P(X=3)$ เฉพาะเมื่อเข้าที่ครั้งที่ 3 เท่านั้น โจทย์ถามภายในสามครั้งแรก จึงต้องรวมกรณีเข้าที่ครั้งแรกหรือครั้งที่สองด้วย" }
    solution: "$P(X\\le 3)=1-0.6^3=1-0.216=0.784$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.discrete-distributions.p018
    topics: [math.stats.discrete-distributions]
    difficulty: 5
    type: mcq
    stem: "ถ้าประชากรมีขนาด $N$ ใหญ่มากเมื่อเทียบกับจำนวนที่หยิบ $n$ (เช่น $N=10000$ และ $n=5$) ข้อใดถูกต้องเกี่ยวกับการแจกแจงไฮเปอร์จีโอเมตริก"
    choices:
      - { id: a, text: "ใกล้เคียงกับการแจกแจงทวินามที่มี $p=\\frac{K}{N}$", correct: true }
      - { id: b, text: "มีค่าเฉลี่ยเท่ากับ $\\frac{1}{p}$", feedback: "ค่าเฉลี่ยของไฮเปอร์จีโอเมตริกคือ $\\frac{nK}{N}$ ส่วน $\\frac{1}{p}$ เป็นค่าเฉลี่ยของการแจกแจงเรขาคณิต" }
      - { id: c, text: "ความแปรปรวนมากกว่าความแปรปรวนของทวินาม $np(1-p)$ ที่มี $p=\\frac{K}{N}$", feedback: "ตัวคูณประชากรจำกัด $\\frac{N-n}{N-1}$ น้อยกว่า 1 เสมอเมื่อ $n>1$ ความแปรปรวนของไฮเปอร์จีโอเมตริกจึงน้อยกว่าของทวินาม และเข้าใกล้ค่าทวินามเมื่อ $N$ ใหญ่" }
      - { id: d, text: "ใช้ได้เฉพาะเมื่อหยิบใส่คืนเท่านั้น", feedback: "ไฮเปอร์จีโอเมตริกคือการหยิบโดยไม่ใส่คืน ส่วนการหยิบใส่คืนใช้การแจกแจงทวินาม" }
    hints:
      - "เมื่อ $N$ ใหญ่มาก การหยิบแต่ละหน่วยแทบไม่เปลี่ยนสัดส่วนของประชากร"
      - "พิจารณาตัวคูณ $\\frac{N-n}{N-1}$ เมื่อ $N$ มากขึ้นเรื่อย ๆ"
    solution: "เมื่อ $N$ ใหญ่มาก $\\frac{N-n}{N-1}\\to 1$ และสัดส่วน $\\frac{K}{N}$ คงที่ ทำให้ไฮเปอร์จีโอเมตริกใกล้เคียงทวินามที่มี $p=\\frac{K}{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true
