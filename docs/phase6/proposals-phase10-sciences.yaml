  - { id: biology.diversity.viruses, title: "ไวรัส ไพรออน และไวรอยด์", difficulty: 6.5, prereq: [biology.genetics.chromosomes-dna, biology.animals.immunity, biology.diversity.biodiversity-classification], indicators: ["university-foundations:BIO 21.1", "university-foundations:BIO 21.2", "university-foundations:BIO 21.3", "university-foundations:BIO 21.4"], scope: "ไวรัสไม่ใช่เซลล์ โครงสร้าง (แคปซิด เยื่อหุ้ม) การจำแนกตามสารพันธุกรรมและระบบของบัลติมอร์ ขั้นตอนการเพิ่มจำนวนในเซลล์เจ้าบ้าน วัฏจักรไลติกและไลโซเจนิก ของแบคเทอริโอเฟจ ไวรัสในสัตว์และพืช รีโทรไวรัสและเอนไซม์รีเวิร์สทรานสคริปเทส (เอชไอวี) ไวรัสก่อมะเร็ง (HPV) วัคซีนชนิดต่าง ๆ รวม mRNA ยาต้านไวรัสและเหตุที่ยาปฏิชีวนะใช้ไม่ได้ การกลายพันธุ์ของไข้หวัดใหญ่ ไพรออนกับโรควัวบ้า และไวรอยด์ในพืช" }
  # ลำดับ 2
  - { id: biology.diversity.prokaryotes, title: "แบคทีเรียและอาร์เคีย โครงสร้าง เมแทบอลิซึม โรค และประโยชน์", difficulty: 6.5, prereq: [biology.diversity.biodiversity-classification, biology.cells.cellular-respiration], indicators: ["university-foundations:BIO 22.1", "university-foundations:BIO 22.2", "university-foundations:BIO 22.3", "university-foundations:BIO 22.4", "university-foundations:BIO 22.5"], scope: "ความหลากหลายของโพรแคริโอตและแหล่งที่อยู่สุดขั้ว ไบโอฟิล์ม โครงสร้าง ผนังเซลล์แกรมบวกและแกรมลบ แคปซูล ฟิมเบรีย แฟลเจลลัม พลาสมิด การแลกเปลี่ยนยีน (ทรานส์ฟอร์เมชัน ทรานส์ดักชัน คอนจูเกชัน) ความหลากหลายทางเมแทบอลิซึม ผู้ผลิตจากแสงหรือสารเคมี บทบาทในวัฏจักรคาร์บอนและไนโตรเจน โรคจากแบคทีเรียในคน (วัณโรค อหิวาต์ อาหารเป็นพิษ) เชื้อดื้อยาและการใช้ยาปฏิชีวนะอย่างสมเหตุผล และประโยชน์ในการหมักอาหารไทย การบำบัดน้ำเสีย และการผลิตอินซูลิน" }
  # ลำดับ 3
  - { id: biology.diversity.protists, title: "โพรทิสต์ กำเนิดยูแคริโอต กลุ่มหลัก และบทบาททางนิเวศ", difficulty: 6.5, prereq: [biology.diversity.biodiversity-classification, biology.diversity.prokaryotes], indicators: ["university-foundations:BIO 23.1", "university-foundations:BIO 23.2", "university-foundations:BIO 23.3", "university-foundations:BIO 23.4"], scope: "หลักฐานของเอนโดซิมไบโอซิส (DNA และไรโบโซมของไมโทคอนเดรียกับคลอโรพลาสต์) และเอนโดซิมไบโอซิสทุติยภูมิ ลักษณะของโพรทิสต์ โครงสร้าง การกินอาหาร การเคลื่อนที่ และการสืบพันธุ์ กลุ่มหลักโดยสังเขป (ยูกลีนา ไดอะตอม ไดโนแฟลกเจลเลต อะมีบา พารามีเซียม สาหร่ายสีเขียว สีแดง สีน้ำตาล) โพรทิสต์เป็นผู้ผลิตในทะเล สาเหตุของน้ำทะเลเปลี่ยนสี ปรสิตก่อโรค (มาลาเรีย บิด อะมีบา) และผู้ย่อยสลาย" }
  # ลำดับ 3
  - { id: biology.diversity.fungi, title: "ฟังไจ ลักษณะ การจำแนก นิเวศวิทยา และความสำคัญต่อมนุษย์", difficulty: 6.5, prereq: [biology.diversity.biodiversity-classification], indicators: ["university-foundations:BIO 24.1", "university-foundations:BIO 24.2", "university-foundations:BIO 24.3", "university-foundations:BIO 24.4", "university-foundations:BIO 24.5"], scope: "โครงสร้างของฟังไจ ไฮฟา ไมซีเลียม ผนังไคทิน การกินอาหารแบบดูดซึม การสืบพันธุ์แบบอาศัยและไม่อาศัยเพศ สปอร์ กลุ่มหลัก (ไคทริด ราขนมปัง ราแอสโคไมซีต เห็ดแบสิดิโอไมซีต) ผู้ย่อยสลาย ไมคอร์ไรซา ไลเคน และเอนโดไฟต์ โรคพืช (โรคใบไหม้ข้าว) โรคในคน (กลาก เกลื้อน ราในปอด) สารพิษอะฟลาทอกซิน เห็ดพิษ และการใช้ประโยชน์ ยีสต์หมักอาหาร เพนิซิลลิน เห็ดเพาะ และราควบคุมแมลง" }
  # ลำดับ 3
  - { id: biology.diversity.seedless-plants, title: "กำเนิดพืชบก สาหร่ายสีเขียว ไบรโอไฟต์ และพืชมีท่อลำเลียงไร้เมล็ด", difficulty: 6.5, prereq: [biology.diversity.biodiversity-classification, biology.plants.reproduction-growth], indicators: ["university-foundations:BIO 25.1", "university-foundations:BIO 25.2", "university-foundations:BIO 25.3", "university-foundations:BIO 25.4"], scope: "การปรับตัวเพื่อขึ้นบก (คิวทิเคิล ปากใบ เอ็มบริโอที่ได้รับการปกป้อง สปอร์ผนังหนา) สาหร่ายคาโรไฟต์เป็นญาติใกล้ชิดของพืช วัฏจักรชีวิตแบบสลับ ที่แกมีโทไฟต์เด่นในลิเวอร์เวิร์ต ฮอร์นเวิร์ต และมอส บทบาทของมอสในป่าดิบเขา พืชมีท่อลำเลียงไร้เมล็ด ไลโคไฟต์ หางม้า และเฟิร์น วัฏจักรชีวิต ที่สปอโรไฟต์เด่น และป่าเฟิร์นยุคคาร์บอนิเฟอรัสกับถ่านหิน" }
  # ลำดับ 3
  - { id: biology.diversity.seed-plants, title: "พืชเมล็ด พืชเมล็ดเปลือย พืชดอก และความสำคัญต่อมนุษย์", difficulty: 6.5, prereq: [biology.diversity.seedless-plants], indicators: ["university-foundations:BIO 26.1", "university-foundations:BIO 26.2", "university-foundations:BIO 26.3", "university-foundations:BIO 26.4"], scope: "วิวัฒนาการของเมล็ด ละอองเรณู และออวุล ข้อได้เปรียบเหนือสปอร์ พืชเมล็ดเปลือย (สน ปรง แปะก๊วย มะเมื่อย) และวัฏจักรชีวิตของสน พืชดอก ดอกและผลเป็นการปรับตัว วัฏจักรชีวิต การเทียบใบเลี้ยงเดี่ยวกับใบเลี้ยงคู่ การวิวัฒนาการร่วมกับสัตว์ถ่ายเรณู ความสำคัญของพืชเมล็ด ต่ออาหาร ยา ไม้ และเศรษฐกิจไทย (ข้าว ยาง มันสำปะหลัง) และภัยคุกคามต่อความหลากหลายของพืช" }
  # ลำดับ 2
  - { id: biology.diversity.animal-body-plans, title: "ลักษณะของอาณาจักรสัตว์ แผนผังร่างกาย และวิวัฒนาการของสัตว์", difficulty: 6.5, prereq: [biology.diversity.biodiversity-classification, biology.animals.reproduction-development], indicators: ["university-foundations:BIO 27.1", "university-foundations:BIO 27.2", "university-foundations:BIO 27.3", "university-foundations:BIO 27.4"], scope: "ลักษณะร่วมของสัตว์ การเจริญของเอ็มบริโอและชนิดของเนื้อเยื่อ ลักษณะที่ใช้จำแนก สมมาตรแบบรัศมีและแบบด้านข้าง ชั้นเนื้อเยื่อสองชั้นและสามชั้น ช่องตัวแท้ ช่องตัวเทียม และไม่มีช่องตัว โพรโทสโตมกับดิวเทอโรสโตม การแบ่งตามการลอกคราบกับไม่ลอกคราบ ต้นไม้วิวัฒนาการของสัตว์ตามข้อมูลโมเลกุล การระเบิดของแคมเบรียน และการสูญพันธุ์ครั้งใหญ่ที่เปลี่ยนสายวิวัฒนาการของสัตว์" }
  # ลำดับ 3
  - { id: biology.diversity.basal-animals-lophotrochozoa, title: "ฟองน้ำ ไนดาเรีย หนอนตัวแบน หอย และหนอนปล้อง", difficulty: 6.5, prereq: [biology.diversity.animal-body-plans], indicators: ["university-foundations:BIO 28.1", "university-foundations:BIO 28.2", "university-foundations:BIO 28.3", "university-foundations:BIO 28.4"], scope: "ไฟลัมพอริเฟอรา (ฟองน้ำ เซลล์ปลอกคอ การกรองอาหาร) ไฟลัมไนดาเรีย (แมงกะพรุน ดอกไม้ทะเล ปะการัง เซลล์เข็มพิษ รูปแบบโพลิปและเมดูซา) ซูเปอร์ไฟลัมโลโฟโทรโคซัว หนอนตัวแบน (พลานาเรีย พยาธิใบไม้ตับและพยาธิตัวตืดที่พบในไทย) โรติเฟอร์ และเนเมอร์เทียน ไฟลัมมอลลัสกา (หอยฝาเดียว หอยสองฝา หมึก แมนเทิล เรดูลา) และไฟลัมแอนเนลิดา (ไส้เดือนดิน ปลิง ไส้เดือนทะเล) เทียบแผนผังร่างกายของแต่ละไฟลัม" }
  # ลำดับ 3
  - { id: biology.diversity.ecdysozoa-deuterostomes, title: "หนอนตัวกลม ทาร์ดิเกรด สัตว์ขาปล้อง และดิวเทอโรสโตม", difficulty: 6.5, prereq: [biology.diversity.basal-animals-lophotrochozoa], indicators: ["university-foundations:BIO 28.5", "university-foundations:BIO 28.6", "university-foundations:BIO 28.7"], scope: "ซูเปอร์ไฟลัมเอคไดโซซัว การลอกคราบ หนอนตัวกลม (พยาธิไส้เดือน พยาธิปากขอ C. elegans) ทาร์ดิเกรดและความทนทาน สัตว์ขาปล้อง โครงร่างภายนอก รยางค์เป็นข้อ กลุ่มย่อย แมลง ครัสเตเชียน แมง ตะขาบกิ้งกือ ความสำคัญของแมลงต่อการถ่ายเรณูและการเป็นพาหะ (ยุงลาย) ซูเปอร์ไฟลัมดิวเทอโรสโตม เอไคโนเดิร์ม (ดาวทะเล เม่นทะเล ระบบท่อน้ำ) และความเชื่อมโยงกับคอร์เดต" }
  # ลำดับ 3
  - { id: biology.diversity.chordates-fishes-amphibians, title: "คอร์เดต ปลา และสัตว์สะเทินน้ำสะเทินบก", difficulty: 6.5, prereq: [biology.diversity.ecdysozoa-deuterostomes], indicators: ["university-foundations:BIO 29.1", "university-foundations:BIO 29.2", "university-foundations:BIO 29.3"], scope: "ลักษณะสี่ประการของคอร์เดต (โนโทคอร์ด ท่อประสาทด้านหลัง ช่องเหงือก หางหลังทวารหนัก) เพรียงหัวหอมและแอมฟิออกซัส สัตว์มีกะโหลก ปลาไม่มีขากรรไกร ปลากระดูกอ่อน ปลากระดูกแข็ง ปลาครีบรยางค์และการขึ้นบก สัตว์สะเทินน้ำสะเทินบก กบ ซาลาแมนเดอร์ เขียดงู การหายใจทางผิวหนัง วัฏจักรชีวิตแบบเมทามอร์โฟซิส และการลดลงจากเชื้อราไคทริด" }
  # ลำดับ 3
  - { id: biology.diversity.amniotes-primates, title: "สัตว์มีถุงน้ำคร่ำ สัตว์เลื้อยคลาน นก สัตว์เลี้ยงลูกด้วยน้ำนม และไพรเมต", difficulty: 6.5, prereq: [biology.diversity.chordates-fishes-amphibians, biology.evolution.evolution], indicators: ["university-foundations:BIO 29.4", "university-foundations:BIO 29.5", "university-foundations:BIO 29.6", "university-foundations:BIO 29.7"], scope: "ไข่มีถุงน้ำคร่ำและเยื่อหุ้มเอ็มบริโอ สัตว์เลื้อยคลาน (เต่า จระเข้ งู กิ้งก่า) การควบคุมอุณหภูมิจากภายนอก นกกับไดโนเสาร์ ขนนก กระดูกกลวง ถุงลมและการบิน สัตว์เลี้ยงลูกด้วยน้ำนม ขน ต่อมน้ำนม ฟันหลายแบบ กลุ่มโมโนทรีม มาร์ซูเปียล และยูเธอเรีย วิวัฒนาการของไพรเมต ลิงโลกเก่าและโลกใหม่ เอป และสายวิวัฒนาการของมนุษย์ตั้งแต่ออสตราโลพิเทคัสถึง Homo sapiens" }
