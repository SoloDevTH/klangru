id: chemistry.bonding.ionic
subject: chemistry
title: { th: พันธะไอออนิก, en: Ionic bonding }
summary: การเกิดไอออนและพันธะไอออนิกด้วยสัญลักษณ์แบบจุดของลิวอิส สูตรและชื่อสารประกอบไอออนิก วัฏจักรบอร์น–ฮาเบอร์ สมบัติ การละลายแบบแตกตัว และสมการไอออนิกสุทธิ
difficulty: 5
minutes: 40
prerequisites: [chemistry.matter.periodic-trends]
encompasses:
  - { id: chemistry.matter.periodic-trends, weight: 0.3 }
  - { id: chemistry.matter.periodic-table, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: lewis-ion-formation.svg
    alt: "สัญลักษณ์แบบจุดของลิวอิส แถวบน: Na มีจุดสีแดง 1 จุด บวก Cl มีจุด 7 จุด ลูกศรโค้งสีแดงแสดงการย้ายอิเล็กตรอน 1 ตัวจาก Na ไป Cl ได้ Na⁺ ไม่มีจุด บวก Cl ในวงเล็บเหลี่ยมมีจุดครบ 8 จุด (1 จุดเป็นวงกลมกลวงสีแดงคืออิเล็กตรอนที่รับมา) ประจุ − แถวล่าง: Mg มีจุดสีแดง 2 จุด บวก O มีจุด 6 จุด ย้ายอิเล็กตรอน 2 ตัว ได้ Mg²⁺ บวก O ในวงเล็บเหลี่ยมมีจุดครบ 8 จุด (2 จุดเป็นอิเล็กตรอนที่รับมา) ประจุ 2−"
    caption: "โลหะให้เวเลนซ์อิเล็กตรอนแก่อโลหะ ได้ไอออนที่มีอิเล็กตรอนครบแปด"
  - { type: check, problem: chemistry.bonding.ionic.p003, prompt: "ประจุบวกรวมต้องเท่ากับประจุลบรวม" }
  - type: worked-example
    title: เขียนสูตรและชื่อจากไอออน
    problem: "เขียนสูตรและชื่อสารประกอบที่เกิดจาก (ก) $\\mathrm{Fe^{3+}}$ กับ $\\mathrm{SO_4^{2-}}$ (ข) $\\mathrm{NH_4^+}$ กับ $\\mathrm{PO_4^{3-}}$"
    steps:
      - text: "(ก) หาจำนวนที่ทำให้ประจุหักล้าง: ค.ร.น. ของ 3 กับ 2 คือ 6 ใช้ $\\mathrm{Fe^{3+}}$ 2 ไอออน (+6) และ $\\mathrm{SO_4^{2-}}$ 3 ไอออน (−6)"
      - text: "ซัลเฟตมีหลายอะตอม ต้องใส่วงเล็บ ได้ $\\mathrm{Fe_2(SO_4)_3}$"
        why: "ตัวห้อย 3 คูณทั้งกลุ่ม $\\mathrm{SO_4}$ ถ้าไม่มีวงเล็บจะอ่านเป็น $\\mathrm{O_{43}}$"
      - text: "เหล็กมีได้ทั้ง 2+ และ 3+ จึงต้องบอกประจุ: ไอร์ออน(III) ซัลเฟต"
      - text: "(ข) ต้องใช้ $\\mathrm{NH_4^+}$ 3 ไอออนกับ $\\mathrm{PO_4^{3-}}$ 1 ไอออน ได้ $\\mathrm{(NH_4)_3PO_4}$ ชื่อ แอมโมเนียมฟอสเฟต"
        why: "แอมโมเนียมเป็นไอออนบวกที่ไม่มีโลหะ แต่สารนี้ยังเป็นสารประกอบไอออนิก"
    answer: "(ก) $\\mathrm{Fe_2(SO_4)_3}$ ไอร์ออน(III) ซัลเฟต · (ข) $\\mathrm{(NH_4)_3PO_4}$ แอมโมเนียมฟอสเฟต"
  - type: figure
    src: born-haber-nacl.svg
    alt: "แผนภาพระดับพลังงานตามมาตราส่วน หน่วย kJ/mol เริ่มที่ Na(s) + ½Cl₂(g) ที่ระดับ 0 ลูกศรขึ้น +107 (ระเหิด) ถึง Na(g) + ½Cl₂(g) ที่ 107 ลูกศรขึ้น +496 (ไอออไนเซชัน) ถึง 603 ลูกศรขึ้น +122 (แยก Cl₂) ถึง Na⁺(g) + e⁻ + Cl(g) ที่ 725 ลูกศรลง −349 (รับอิเล็กตรอน) ถึง Na⁺(g) + Cl⁻(g) ที่ 376 และลูกศรลงยาว −787 (พลังงานโครงผลึก) ถึง NaCl(s) ที่ −411 ลูกศรสีเขียวจาก 0 ลงตรงถึง −411 คือพลังงานของการเกิด NaCl"
    caption: "วัฏจักรบอร์น–ฮาเบอร์ของ NaCl: ผลรวมของทุกขั้นเท่ากับพลังงานของการเกิดสารจากธาตุ"
  - type: worked-example
    title: หาพลังงานโครงผลึกของโพแทสเซียมคลอไรด์
    problem: "จงหาพลังงานโครงผลึกของ KCl (kJ/mol) จากข้อมูล: ระเหิด K +89 · พลังงานไอออไนเซชันของ K +419 · $\\tfrac12$ พลังงานพันธะ Cl–Cl +122 · สัมพรรคภาพอิเล็กตรอนของ Cl −349 · พลังงานของการเกิด KCl(s) −437"
    steps:
      - text: "เขียนวัฏจักร: พลังงานการเกิด = ผลรวมของทุกขั้น รวมพลังงานโครงผลึก $U$"
      - text: "$-437 = 89 + 419 + 122 + (-349) + U$"
        why: "ใส่เครื่องหมายตามทิศ ขั้นที่ดูดพลังงานเป็นบวก ขั้นที่คายเป็นลบ"
      - text: "ผลรวมขั้นที่รู้ค่า $= 89 + 419 + 122 - 349 = 281$"
      - text: "$U = -437 - 281 = -718$ kJ/mol"
    answer: "พลังงานโครงผลึกของ KCl $= -718$ kJ/mol (คายพลังงาน)"
  - { type: check, problem: chemistry.bonding.ionic.p012, prompt: "ไอออนต้องเคลื่อนที่ได้จึงนำไฟฟ้า" }
glossary:
  - { term: ไอออน, definition: อะตอมหรือกลุ่มอะตอมที่มีประจุ เพราะเสียหรือรับอิเล็กตรอน }
  - { term: พันธะไอออนิก, definition: แรงดึงดูดทางไฟฟ้าระหว่างไอออนบวกกับไอออนลบในโครงผลึก }
  - { term: สัญลักษณ์แบบจุดของลิวอิส, definition: สัญลักษณ์ธาตุที่ล้อมด้วยจุดเท่าจำนวนเวเลนซ์อิเล็กตรอน }
  - { term: พลังงานโครงผลึก, definition: "พลังงานที่คายออกเมื่อไอออนในสถานะแก๊สรวมกันเป็นผลึก 1 โมล" }
  - { term: สารละลายอิเล็กโทรไลต์, definition: สารละลายที่นำไฟฟ้าได้เพราะมีไอออนอิสระ }
  - { term: ไอออนที่ไม่เปลี่ยนแปลง, definition: ไอออนที่อยู่ในสารละลายทั้งก่อนและหลังปฏิกิริยา จึงตัดออกจากสมการไอออนิกสุทธิ }
flashcards:
  - { front: "ประจุของไอออนหมู่ 1, 2, 13, 15, 16, 17", back: "1+, 2+, 3+, 3−, 2−, 1−" }
  - { front: "ชื่อ $\\mathrm{CuSO_4}$ และ $\\mathrm{FeCl_2}$", back: "คอปเปอร์(II) ซัลเฟต · ไอร์ออน(II) คลอไรด์ (บอกประจุของโลหะแทรนซิชันด้วยเลขโรมัน)" }
  - { front: "วัฏจักรบอร์น–ฮาเบอร์", back: "ΔH การเกิด = ระเหิด + IE + ½ พลังงานพันธะ + EA + พลังงานโครงผลึก" }
  - { front: "ทำไม NaCl ของแข็งไม่นำไฟฟ้า แต่ละลายน้ำแล้วนำไฟฟ้า", back: "ในผลึกไอออนเคลื่อนที่ไม่ได้ เมื่อละลายน้ำไอออนแยกจากกันและเคลื่อนที่ได้" }
  - { front: "สมการไอออนิกสุทธิของ AgNO₃ + NaCl", back: "$\\mathrm{Ag^+(aq) + Cl^-(aq) \\to AgCl(s)}$ ตัด Na⁺ และ NO₃⁻ ออก" }
