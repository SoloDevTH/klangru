<rect x="700" y="442" width="240" height="56" fill="#ffffff" stroke="#bdbdbd"/>
<text x="820.0" y="476.0" text-anchor="middle" font-size="15" fill="#222" font-style="italic">Canis familiaris</text>
<rect x="160" y="514" width="22" height="16" fill="#c8e6c9" stroke="#66bb6a"/>
