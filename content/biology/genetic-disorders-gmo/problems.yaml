    difficulty: 5
    type: numeric
    stem: "คู่สมรสที่ไปตรวจคัดกรองที่โรงพยาบาลจังหวัดพบว่าเป็นพาหะธาลัสซีเมียชนิดเดียวกันทั้งคู่ ถ้ามีลูก 3 คน โอกาสที่ลูกอย่างน้อย 1 คนเป็นโรคเป็นร้อยละเท่าใด (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 57.8, tolerance: 0.6, unit: "%" }
    misconceptions:
      - { match: 75, feedback: "บวกโอกาส 25% สามครั้งไม่ได้ เพราะลูกหลายคนอาจเป็นโรคพร้อมกัน ให้ใช้เหตุการณ์ตรงข้าม" }
      - { match: 1.6, feedback: "1.6% คือโอกาสที่ลูกทั้ง 3 คนเป็นโรค ไม่ใช่อย่างน้อย 1 คน" }
      - { match: 42.2, feedback: "42.2% คือโอกาสที่ไม่มีลูกคนใดเป็นโรค ต้องนำไปลบออกจาก 100%" }
    hints:
      - "ลูกแต่ละคนไม่เป็นโรคด้วยโอกาส 3/4 และเป็นอิสระต่อกัน"
      - "โอกาสอย่างน้อย 1 คน = 1 − โอกาสที่ไม่มีใครเป็นโรคเลย"
    solution: "โอกาสที่ลูกทั้ง 3 คนไม่เป็นโรค $\\left(\\tfrac34\\right)^3 = \\tfrac{27}{64}$ จึงได้ $1 - \\tfrac{27}{64} = \\tfrac{37}{64} \\approx 0.578$ หรือร้อยละ 57.8"
