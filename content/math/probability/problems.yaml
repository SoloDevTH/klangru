problems:
  - id: math.prob.p001
    topics: [math.prob.probability]
    difficulty: 1
    type: numeric
    stem: "ทอยลูกเต๋าที่เที่ยงตรง 1 ลูก ความน่าจะเป็นที่จะได้แต้ม 5 เป็นเท่าใด (ตอบเป็นเศษส่วนหรือทศนิยม)"
    answer: { value: 0.16667, tolerance: 0.0034 }
    hints:
      - "ปริภูมิตัวอย่างมีผลลัพธ์กี่แบบ และทุกแบบมีโอกาสเท่ากันหรือไม่"
      - "ใช้ $P(E) = \\dfrac{n(E)}{n(S)}$ โดยเหตุการณ์ \"ได้แต้ม 5\" มีผลลัพธ์เพียงแบบเดียว"
    misconceptions:
      - { match: 0.83333, feedback: "นั่นคือความน่าจะเป็นที่ **ไม่ได้** แต้ม 5 ซึ่งเป็นเหตุการณ์ตรงข้าม ลองนับเฉพาะผลลัพธ์ที่ได้แต้ม 5" }
    solution: "$S = \\{1, 2, 3, 4, 5, 6\\}$ มี 6 ผลลัพธ์ เหตุการณ์ได้แต้ม 5 มี 1 ผลลัพธ์ จึงได้ $P = \\dfrac{1}{6} \\approx 0.167$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.p002
    topics: [math.prob.probability]
    difficulty: 1
    type: numeric
    stem: "กรมอุตุนิยมวิทยาพยากรณ์ว่าพรุ่งนี้กรุงเทพฯ มีโอกาสฝนตก 70% โอกาสที่ฝนจะไม่ตกเป็นกี่เปอร์เซ็นต์"
    answer: { value: 30, unit: "%" }
    hints:
      - "\"ฝนตก\" กับ \"ฝนไม่ตก\" เป็นเหตุการณ์ตรงข้ามกัน"
      - "ใช้ $P(E') = 1 - P(E)$ หรือ 100% ลบด้วยโอกาสฝนตก"
    misconceptions:
      - { match: 70, feedback: "นั่นคือโอกาสที่ฝน **ตก** โจทย์ถามโอกาสที่ฝนไม่ตก ซึ่งเป็นเหตุการณ์ตรงข้าม" }
    solution: "ฝนไม่ตกเป็นเหตุการณ์ตรงข้ามของฝนตก: $100\\% - 70\\% = 30\\%$ (หรือ $1 - 0.7 = 0.3$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.p003
    topics: [math.prob.probability]
    difficulty: 1
    type: text
    stem: "เหตุการณ์ที่มีความน่าจะเป็นเท่ากับ 1 เช่น ทอยลูกเต๋าแล้วได้แต้มน้อยกว่า 7 เรียกว่าเหตุการณ์อะไร (ตอบเป็นคำ)"
    accepted: ["เหตุการณ์ที่แน่นอน", "เหตุการณ์แน่นอน", "แน่นอน", "เหตุการณ์ที่เกิดขึ้นแน่นอน", "certain", "certain event", "a certain event"]
    hints:
      - "ความน่าจะเป็น 1 หมายถึงเกิดขึ้นทุกครั้งที่ทดลอง"
      - "ตรงข้ามกับเหตุการณ์ที่มีความน่าจะเป็น 0 ซึ่งเรียกว่าเหตุการณ์ที่เป็นไปไม่ได้"
    misconceptions:
      - { match: "เหตุการณ์ที่เป็นไปไม่ได้", feedback: "เหตุการณ์ที่เป็นไปไม่ได้มีความน่าจะเป็น 0 แต่ความน่าจะเป็น 1 หมายถึงเกิดทุกครั้ง" }
      - { match: "เป็นไปไม่ได้", feedback: "เหตุการณ์ที่เป็นไปไม่ได้มีความน่าจะเป็น 0 แต่ความน่าจะเป็น 1 หมายถึงเกิดทุกครั้ง" }
    solution: "ความน่าจะเป็น 1 คือเหตุการณ์ที่แน่นอน เกิดขึ้นทุกครั้ง เช่น ลูกเต๋ามีแต้มสูงสุด 6 จึงได้แต้มน้อยกว่า 7 เสมอ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.p004
    topics: [math.prob.probability]
    difficulty: 2
    type: mcq
    stem: "โยนเหรียญ 1 อันสองครั้ง ข้อใดคือปริภูมิตัวอย่าง (H = หัว, T = ก้อย)"
    choices:
      - { id: a, text: "$\\{HH, HT, TH, TT\\}$", correct: true }
      - { id: b, text: "$\\{HH, HT, TT\\}$", feedback: "HT (ครั้งแรกหัว ครั้งที่สองก้อย) กับ TH เป็นคนละผลลัพธ์ ต้องนับแยกกัน" }
      - { id: c, text: "$\\{H, T\\}$", feedback: "นั่นคือปริภูมิตัวอย่างของการโยนครั้งเดียว โยนสองครั้งต้องบอกผลของทั้งสองครั้ง" }
      - { id: d, text: "$\\{0, 1, 2\\}$", feedback: "นั่นคือจำนวนหัวที่เป็นไปได้ ซึ่งแต่ละค่ามีโอกาสไม่เท่ากัน ปริภูมิตัวอย่างควรบอกผลแต่ละครั้ง" }
    hints:
      - "ผลลัพธ์หนึ่งแบบต้องบอกทั้งผลครั้งแรกและครั้งที่สอง"
      - "ครั้งแรกออกได้ 2 แบบ ครั้งที่สองออกได้ 2 แบบ ตามหลักการคูณมีทั้งหมดกี่แบบ"
    solution: "ผลลัพธ์เขียนเป็น (ครั้งแรก, ครั้งที่สอง) ได้ $2 \\times 2 = 4$ แบบ คือ $\\{HH, HT, TH, TT\\}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.p005
    topics: [math.prob.probability]
    difficulty: 2
    type: numeric
    stem: "ในกล่องจับฉลากงานวันเด็กมีลูกบอลสีแดง 4 ลูก สีน้ำเงิน 5 ลูก และสีเขียว 3 ลูก สุ่มหยิบ 1 ลูก ความน่าจะเป็นที่จะ **ไม่ใช่** สีน้ำเงินเป็นเท่าใด"
    answer: { value: 0.58333, tolerance: 0.006 }
    hints:
      - "นับลูกบอลทั้งหมดก่อน นั่นคือ $n(S)$"
      - "ลูกที่ไม่ใช่สีน้ำเงินคือสีแดงกับสีเขียวรวมกัน หรือใช้เหตุการณ์ตรงข้าม"
    misconceptions:
      - { match: 0.41667, feedback: "นั่นคือความน่าจะเป็นที่ **ได้** สีน้ำเงิน โจทย์ถามไม่ใช่สีน้ำเงิน" }
      - { match: 1.4, feedback: "ดูเหมือนคิด $\\tfrac{7}{5}$ คือเทียบลูกที่ไม่ใช่สีน้ำเงินกับลูกสีน้ำเงิน ความน่าจะเป็นต้องเทียบกับลูกทั้งหมด และต้องไม่เกิน 1" }
    solution: "ลูกบอลทั้งหมด $4 + 5 + 3 = 12$ ลูก ไม่ใช่สีน้ำเงิน $4 + 3 = 7$ ลูก จึงได้ $P = \\dfrac{7}{12} \\approx 0.583$ (หรือ $1 - \\tfrac{5}{12}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.p006
    topics: [math.prob.probability]
    difficulty: 2
    type: match
    stem: "ทอยลูกเต๋าที่เที่ยงตรง 1 ลูก จับคู่เหตุการณ์กับความน่าจะเป็น"
    pairs:
      - { left: "ได้แต้มคู่", right: "$\\tfrac{1}{2}$" }
      - { left: "ได้แต้มมากกว่า 4", right: "$\\tfrac{1}{3}$" }
      - { left: "ได้แต้ม 7", right: "$0$" }
      - { left: "ได้แต้มน้อยกว่า 7", right: "$1$" }
    hints:
      - "เขียนผลลัพธ์ของแต่ละเหตุการณ์ออกมาเป็นเซต แล้วนับ"
      - "ปริภูมิตัวอย่างมี 6 ผลลัพธ์ ใช้ $P(E) = \\dfrac{n(E)}{6}$"
    solution: "แต้มคู่ $\\{2, 4, 6\\}$ ได้ $\\tfrac{3}{6} = \\tfrac{1}{2}$ · มากกว่า 4 คือ $\\{5, 6\\}$ ได้ $\\tfrac{2}{6} = \\tfrac{1}{3}$ · แต้ม 7 เป็นไปไม่ได้ ได้ 0 · น้อยกว่า 7 เกิดทุกครั้ง ได้ 1"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.p007
    topics: [math.prob.probability]
    difficulty: 3
    type: numeric
    stem: "ทอยลูกเต๋าที่เที่ยงตรง 2 ลูกพร้อมกัน ความน่าจะเป็นที่ผลรวมของแต้มเท่ากับ 7 เป็นเท่าใด"
    answer: { value: 0.16667, tolerance: 0.0034 }
    hints:
      - "ลูกเต๋าสองลูกแยกกันได้ ผลลัพธ์ทั้งหมดมี $6 \\times 6$ แบบ"
      - "เขียนคู่ (ลูกแรก, ลูกที่สอง) ที่รวมกันได้ 7 ให้ครบ โดย (1, 6) กับ (6, 1) นับเป็นคนละแบบ"
    misconceptions:
      - { match: 0.09091, feedback: "ดูเหมือนคิดว่าผลรวม 2 ถึง 12 ทั้ง 11 ค่ามีโอกาสเท่ากัน แต่ผลรวมแต่ละค่าเกิดได้จำนวนแบบไม่เท่ากัน ต้องนับจาก 36 ผลลัพธ์" }
    solution: "$n(S) = 36$ ผลรวม 7 ได้จาก (1, 6), (2, 5), (3, 4), (4, 3), (5, 2), (6, 1) รวม 6 แบบ จึงได้ $P = \\dfrac{6}{36} = \\dfrac{1}{6} \\approx 0.167$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.p008
    topics: [math.prob.probability]
    difficulty: 3
    type: mcq
    stem: "โยนเหรียญที่เที่ยงตรงได้หัวติดกัน 5 ครั้ง ความน่าจะเป็นที่ครั้งที่ 6 จะได้หัวเป็นเท่าใด"
    choices:
      - { id: a, text: "$\\tfrac{1}{2}$", correct: true }
      - { id: b, text: "น้อยกว่า $\\tfrac{1}{2}$ เพราะออกหัวมาหลายครั้งแล้ว ก้อยน่าจะออกบ้าง", feedback: "เหรียญจำผลที่ผ่านมาไม่ได้ การโยนแต่ละครั้งเป็นอิสระต่อกัน โอกาสจึงเท่าเดิม" }
      - { id: c, text: "มากกว่า $\\tfrac{1}{2}$ เพราะหัวกำลังออกติดต่อกัน", feedback: "ถ้าเหรียญเที่ยงตรง ผลที่ผ่านมาไม่ได้ทำให้หัวออกง่ายขึ้น การโยนแต่ละครั้งเป็นอิสระต่อกัน" }
      - { id: d, text: "$\\tfrac{1}{64}$", feedback: "$\\left(\\tfrac{1}{2}\\right)^6 = \\tfrac{1}{64}$ คือโอกาสได้หัว 6 ครั้งติด **ก่อนเริ่มโยน** แต่ 5 ครั้งแรกเกิดไปแล้ว เหลือแค่ครั้งที่ 6" }
    hints:
      - "เหรียญรู้หรือไม่ว่าครั้งก่อน ๆ ออกอะไร"
      - "การโยนแต่ละครั้งเป็นเหตุการณ์อิสระ ผลก่อนหน้าไม่เปลี่ยนความน่าจะเป็นของครั้งถัดไป"
    solution: "การโยนแต่ละครั้งเป็นอิสระต่อกัน ความน่าจะเป็นที่ครั้งที่ 6 ได้หัวจึงยังเป็น $\\tfrac{1}{2}$ เหมือนทุกครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.p009
    topics: [math.prob.probability]
    difficulty: 3
    type: numeric
    stem: "โยนเหรียญที่เที่ยงตรง 3 ครั้ง ความน่าจะเป็นที่จะได้หัวทั้ง 3 ครั้งเป็นเท่าใด"
    answer: { value: 0.125, tolerance: 0.001 }
    hints:
      - "การโยนแต่ละครั้งเป็นอิสระต่อกัน"
      - "\"ครั้งที่ 1 ได้หัว และ ครั้งที่ 2 ได้หัว และ ครั้งที่ 3 ได้หัว\" ให้คูณความน่าจะเป็นของแต่ละครั้ง"
    misconceptions:
      - { match: 1.5, feedback: "ดูเหมือนบวก $\\tfrac{1}{2}$ สามครั้ง ความน่าจะเป็นเกิน 1 ไม่ได้ เหตุการณ์อิสระที่เกิด \"และ\" กันต้องคูณ" }
      - { match: 0.25, feedback: "ดูเหมือนคิดว่าจำนวนหัว 0, 1, 2, 3 มีโอกาสเท่ากัน แต่ \"หัว 1 ครั้ง\" เกิดได้ 3 แบบ ส่วน \"หัวทั้งสาม\" เกิดได้แบบเดียวจาก 8 แบบ" }
    solution: "$P = \\tfrac{1}{2} \\times \\tfrac{1}{2} \\times \\tfrac{1}{2} = \\tfrac{1}{8} = 0.125$ ตรวจด้วยการนับ: ผลลัพธ์ทั้งหมด $2^3 = 8$ แบบ มี HHH เพียงแบบเดียว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.p010
    topics: [math.prob.probability]
    difficulty: 4
    type: numeric
    stem: "ทอยลูกเต๋าที่เที่ยงตรง 2 ลูก ความน่าจะเป็นที่จะได้แต้ม 6 **อย่างน้อย 1 ลูก** เป็นเท่าใด"
    answer: { value: 0.30556, tolerance: 0.005 }
    hints:
      - "\"อย่างน้อย 1 ลูก\" นับตรง ๆ ยาก ลองคิดเหตุการณ์ตรงข้าม"
      - "เหตุการณ์ตรงข้ามคือไม่ได้ 6 เลยทั้งสองลูก มีความน่าจะเป็น $\\tfrac{5}{6} \\times \\tfrac{5}{6}$"
      - "นำ 1 ลบด้วยความน่าจะเป็นของเหตุการณ์ตรงข้าม"
    misconceptions:
      - { match: 0.33333, feedback: "ดูเหมือนบวก $\\tfrac{1}{6} + \\tfrac{1}{6}$ ซึ่งนับกรณี (6, 6) ซ้ำสองครั้ง ลองใช้เหตุการณ์ตรงข้ามแทน" }
      - { match: 0.02778, feedback: "นั่นคือความน่าจะเป็นที่ได้ 6 **ทั้งสองลูก** แต่โจทย์ถามอย่างน้อย 1 ลูก ซึ่งรวมกรณีได้ 6 ลูกเดียวด้วย" }
    solution: "$P(\\text{ไม่ได้ 6 เลย}) = \\tfrac{5}{6} \\times \\tfrac{5}{6} = \\tfrac{25}{36}$ ดังนั้น $P(\\text{ได้ 6 อย่างน้อย 1 ลูก}) = 1 - \\tfrac{25}{36} = \\tfrac{11}{36} \\approx 0.306$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.p011
    topics: [math.prob.probability]
    difficulty: 4
    type: numeric
    stem: "ห้องเรียนมีนักเรียนชาย 5 คน หญิง 4 คน ครูสุ่มเลือก 2 คนไปช่วยงานกีฬาสี ความน่าจะเป็นที่จะได้ชายทั้งคู่เป็นเท่าใด"
    answer: { value: 0.27778, tolerance: 0.003 }
    hints:
      - "เลือก 2 คนโดยไม่สนลำดับ ใช้การจัดหมู่นับทั้งหมด: $C(9, 2)$"
      - "จำนวนแบบที่ได้ชายทั้งคู่คือ $C(5, 2)$"
    misconceptions:
      - { match: 0.30864, feedback: "ดูเหมือนคิด $\\left(\\tfrac{5}{9}\\right)^2$ ราวกับเลือกคนเดิมซ้ำได้ แต่เมื่อเลือกชายคนแรกไปแล้ว เหลือชาย 4 คนจาก 8 คน" }
    solution: "$P = \\dfrac{C(5, 2)}{C(9, 2)} = \\dfrac{10}{36} = \\dfrac{5}{18} \\approx 0.278$ (หรือคิด $\\tfrac{5}{9} \\times \\tfrac{4}{8} = \\tfrac{5}{18}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.p012
    topics: [math.prob.probability]
    difficulty: 4
    type: numeric
    stem: "ขับรถผ่านสี่แยกไฟแดง 2 แห่งบนถนนสายหนึ่ง โอกาสเจอไฟเขียวที่แยกแรกคือ 0.4 และที่แยกที่สองคือ 0.5 โดยสองแยกเป็นอิสระต่อกัน ความน่าจะเป็นที่ต้องหยุดรอไฟ (ไม่ได้ไฟเขียว) **อย่างน้อย 1 แยก** เป็นเท่าใด"
    answer: { value: 0.8, tolerance: 0.008 }
    hints:
      - "เหตุการณ์ตรงข้ามของ \"หยุดอย่างน้อย 1 แยก\" คืออะไร"
      - "ตรงข้ามคือได้ไฟเขียวทั้งสองแยก ซึ่งเป็นเหตุการณ์อิสระ จึงคูณกัน"
    misconceptions:
      - { match: 0.3, feedback: "นั่นคือความน่าจะเป็นที่ต้องหยุด **ทั้งสองแยก** ($0.6 \\times 0.5$) แต่โจทย์ถามอย่างน้อย 1 แยก" }
      - { match: 1.1, feedback: "ดูเหมือนบวก $0.6 + 0.5$ ความน่าจะเป็นเกิน 1 ไม่ได้ ลองใช้เหตุการณ์ตรงข้าม" }
    solution: "$P(\\text{เขียวทั้งสองแยก}) = 0.4 \\times 0.5 = 0.2$ ดังนั้น $P(\\text{หยุดอย่างน้อย 1 แยก}) = 1 - 0.2 = 0.8$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.prob.p013
    topics: [math.prob.probability]
    difficulty: 5
    type: numeric
