  stem: 'บทสนทนา: A: 你去＿1＿泰国吗？ B: 去＿2＿。 A: 你是什么时候去＿3＿？ B: 去年。我在曼谷买了一件T恤，现在还穿＿4＿呢！ คำในช่อง 1–4 ตามลำดับคือข้อใด'
  choices:
  - id: a
    text: 过 · 过 · 的 · 过
    feedback: 现在还穿…呢 บอกสภาพที่ยังเป็นอยู่ ใช้ 着
  - id: b
    text: 过 · 过 · 的 · 着
    correct: true
    feedback: ถูก ช่อง 1–2 ถามตอบประสบการณ์ ช่อง 3 เป็นรูป 是…的 ช่อง 4 บอกว่ายังสวมอยู่
  - id: c
    text: 了 · 了 · 的 · 着
    feedback: ถามว่าเคยไปไหมใช้ 过 ไม่ใช่ 了
  - id: d
    text: 过 · 过 · 了 · 着
    feedback: มี 是 อยู่หน้า 什么时候 ต้องปิดด้วย 的
