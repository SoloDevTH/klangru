<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="sans-serif" font-size="14">
  <title>ระบบบำนาญหลายชั้น 3 ชั้น จากล่างขึ้นบน ได้แก่ ความช่วยเหลือจากรัฐ ภาคบังคับจากประกันสังคม และภาคสมัครใจ</title>
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="150" y="300" width="560" height="84" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="430" y="336" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">ชั้นที่ 1: ความช่วยเหลือจากรัฐ</text>
  <text x="430" y="362" text-anchor="middle" font-size="13" fill="#1f2937">เช่น เบี้ยยังชีพผู้สูงอายุ ตามเกณฑ์อายุและรายได้</text>
  <rect x="150" y="200" width="560" height="84" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="430" y="236" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">ชั้นที่ 2: ภาคบังคับ</text>
  <text x="430" y="262" text-anchor="middle" font-size="13" fill="#1f2937">ประกันสังคม มาตรา 33 บำนาญชราภาพ ลูกจ้างและนายจ้างจ่ายสมทบ</text>
  <rect x="150" y="100" width="560" height="84" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="430" y="136" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">ชั้นที่ 3: ภาคสมัครใจ</text>
  <text x="430" y="162" text-anchor="middle" font-size="13" fill="#1f2937">กอช. กองทุนสำรองเลี้ยงชีพ กองทุนรวมเพื่อการเลี้ยงชีพ (RMF) ประกันบำนาญ</text>
  <line x1="110" y1="384" x2="110" y2="90" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="96" y="250" text-anchor="middle" font-size="13" fill="#1f2937" transform="rotate(-90 96 250)">ยิ่งขึ้นบน ยิ่งต้องออมเอง</text>
  <text x="430" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">ระบบบำนาญหลายชั้น (ภาพแนวคิด)</text>
</svg>
