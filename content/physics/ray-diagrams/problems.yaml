  - id: physics.light.ray-diagrams.p013
    topics: [physics.light.ray-diagrams]
    difficulty: 4
    type: mcq
    stem: "เมื่อเลื่อนวัตถุจากระยะไกลมากเข้าหากระจกนูน ภาพที่ได้จากแผนภาพรังสีเป็นอย่างไร"
    choices:
      - { id: a, text: "เป็นภาพเสมือนหัวตั้งย่อเสมอ อยู่หลังกระจกระหว่างกระจกกับ $F$ และใหญ่ขึ้นเมื่อวัตถุเข้าใกล้", correct: true }
      - { id: b, text: "เปลี่ยนจากภาพจริงเป็นภาพเสมือนเมื่อวัตถุผ่านจุดโฟกัส", feedback: "การเปลี่ยนชนิดภาพแบบนี้เกิดกับกระจกเว้า กระจกนูนกระจายแสง รังสีสะท้อนไม่เคยตัดกันจริง" }
      - { id: c, text: "เป็นภาพเสมือนหัวตั้งขยายเมื่อวัตถุอยู่ใกล้มาก", feedback: "กระจกนูนให้ภาพย่อเสมอ ภาพเข้าใกล้ขนาดวัตถุเมื่อวัตถุชิดกระจก แต่ไม่ขยาย" }
    hints:
      - "รังสีสะท้อนจากกระจกนูนลู่เข้าหรือกระจายออก"
      - "ภาพเสมือนที่เกิดจากแนวต่อของรังสีกระจกนูนอยู่ที่ใด"
    solution: "กระจกนูนกระจายแสง ภาพจึงเกิดจากแนวต่อหลังกระจกเสมอ เป็นภาพเสมือนหัวตั้งย่อ อยู่ระหว่างกระจกกับ $F$ เมื่อวัตถุเข้าใกล้ ภาพใหญ่ขึ้นและเคลื่อนเข้าหากระจก แต่ยังเล็กกว่าวัตถุ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.ray-diagrams.p014
    topics: [physics.light.ray-diagrams]
    difficulty: 4
    type: numeric
    stem: "ต้องการให้กระจกเว้าความยาวโฟกัส $10\\ \\mathrm{cm}$ ให้ **ภาพจริง** ขนาด 2 เท่าของวัตถุ ต้องวางวัตถุห่างกระจกเท่าใด (ตอบในหน่วย cm)"
    answer: { value: 15, tolerance: 0.15, unit: cm }
    misconceptions:
      - { match: 5, feedback: "$5\\ \\mathrm{cm}$ ให้ภาพขยาย 2 เท่าก็จริง แต่เป็นภาพเสมือนหลังกระจก ($s' = -2s$) โจทย์ต้องการภาพจริง ($s' = +2s$)" }
      - { match: 20, feedback: "ที่ $20\\ \\mathrm{cm}$ (จุด $C$) ภาพมีขนาดเท่าวัตถุ ไม่ใช่ 2 เท่า" }
    hints:
      - "ภาพจริงขยาย 2 เท่า แปลว่า $s' = 2s$"
      - "แทนใน $\\tfrac{1}{10} = \\tfrac{1}{s} + \\tfrac{1}{2s}$ แล้วแก้หา $s$"
    solution: "$\\tfrac{1}{10} = \\tfrac{1}{s} + \\tfrac{1}{2s} = \\tfrac{3}{2s}$ ได้ $s = 15\\ \\mathrm{cm}$ และ $s' = 30\\ \\mathrm{cm}$ ตรงกับแผนภาพที่วัตถุอยู่ระหว่าง $F$ กับ $C$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.ray-diagrams.p015
    topics: [physics.light.ray-diagrams]
    difficulty: 4
    type: order
    stem: "เรียงขั้นตอนการเขียนแผนภาพรังสีหาภาพของเลนส์นูน"
    items:
      - "เลือกมาตราส่วน ลากแกนมุขสำคัญและเส้นแทนเลนส์"
      - "มาร์กจุด F และ 2F ทั้งสองฝั่งของเลนส์"
      - "วาดวัตถุเป็นลูกศรตั้งบนแกนตามระยะที่โจทย์กำหนด"
      - "ลากรังสีหลักสองเส้นจากปลายวัตถุ แล้วใช้เส้นที่สามตรวจ"
      - "วัดระยะภาพและความสูงภาพแล้วแปลงกลับด้วยมาตราส่วน"
    hints:
      - "ต้องมีแกนและจุดโฟกัสก่อนจึงลากรังสีได้"
      - "วัดค่าได้หลังจากรู้ตำแหน่งภาพแล้วเท่านั้น"
    solution: "มาตราส่วนและแกน → มาร์ก F, 2F → วาดวัตถุ → ลากรังสีหลักและตรวจด้วยเส้นที่สาม → วัดแล้วแปลงกลับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.ray-diagrams.p016
    topics: [physics.light.ray-diagrams]
    difficulty: 5
    type: numeric
    stem: "ใช้แว่นขยายเลนส์นูนความยาวโฟกัส $10\\ \\mathrm{cm}$ ส่องพระเครื่อง ต้องการให้ภาพเสมือนอยู่ห่างเลนส์ $25\\ \\mathrm{cm}$ (ระยะที่ตาเห็นชัด) ต้องวางพระเครื่องห่างเลนส์เท่าใด (ตอบในหน่วย cm)"
    answer: { value: 7.14, tolerance: 0.07, unit: cm }
    misconceptions:
      - { match: 16.67, feedback: "ใช้ $s' = +25$ ซึ่งเป็นภาพจริงอีกฝั่ง แว่นขยายให้ภาพเสมือน ต้องใช้ $s' = -25\\ \\mathrm{cm}$" }
    hints:
      - "ภาพของแว่นขยายเป็นภาพเสมือน $s'$ จึงเป็นลบ"
      - "$\\tfrac{1}{s} = \\tfrac{1}{f} - \\tfrac{1}{s'} = \\tfrac{1}{10} + \\tfrac{1}{25}$"
    solution: "$\\tfrac{1}{s} = \\tfrac{1}{10} - \\tfrac{1}{-25} = \\tfrac{1}{10} + \\tfrac{1}{25} = \\tfrac{7}{50}$ ได้ $s \\approx 7.14\\ \\mathrm{cm}$ ใกล้กว่า $F$ ตามที่แผนภาพแว่นขยายต้องเป็น กำลังขยาย $\\tfrac{25}{7.14} = 3.5$ เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.ray-diagrams.p017
    topics: [physics.light.ray-diagrams]
    difficulty: 5
    type: numeric
    stem: "เครื่องฉายในห้องเรียนใช้เลนส์นูนตัวเดียว จอห่างเลนส์ $3.00\\ \\mathrm{m}$ ต้องการภาพบนจอใหญ่กว่าวัตถุ (แผ่นภาพ) 50 เท่า เลนส์ต้องมีความยาวโฟกัสเท่าใด (ตอบในหน่วย cm)"
    answer: { value: 5.88, tolerance: 0.06, unit: cm }
    misconceptions:
      - { match: 6, feedback: "$6\\ \\mathrm{cm}$ คือระยะวัตถุ $s = \\tfrac{300}{50}$ ยังต้องแทนในสูตรเลนส์เพื่อหา $f$" }
      - { match: 300, feedback: "$300\\ \\mathrm{cm}$ คือระยะภาพ ความยาวโฟกัสต้องน้อยกว่าระยะวัตถุมาก" }
    hints:
      - "กำลังขยาย $m = \\tfrac{s'}{s}$ หา $s$ จาก $s' = 300\\ \\mathrm{cm}$ และ $m = 50$"
      - "แทน $s$ และ $s'$ ใน $\\tfrac{1}{f} = \\tfrac{1}{s} + \\tfrac{1}{s'}$"
    solution: "$s = \\tfrac{300}{50} = 6\\ \\mathrm{cm}$ แล้ว $\\tfrac{1}{f} = \\tfrac{1}{6} + \\tfrac{1}{300} = \\tfrac{51}{300}$ ได้ $f \\approx 5.88\\ \\mathrm{cm}$ วัตถุอยู่ระหว่าง $F$ กับ $2F$ ใกล้ $F$ มาก จึงได้ภาพจริงขยายมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.ray-diagrams.p018
    topics: [physics.light.ray-diagrams]
    difficulty: 5
    type: numeric
    stem: "ตู้ปลามีน้ำลึก $12\\ \\mathrm{cm}$ ($n = 1.33$) อยู่บนแผ่นแก้วหนา $6.0\\ \\mathrm{cm}$ ($n = 1.50$) มีเหรียญวางใต้แผ่นแก้ว มองลงจากด้านบนเกือบตั้งฉาก เหรียญดูอยู่ลึกจากผิวน้ำเท่าใด (ตอบในหน่วย cm)"
    answer: { value: 13.02, tolerance: 0.13, unit: cm }
    misconceptions:
      - { match: 13.53, feedback: "หารความหนารวม $18\\ \\mathrm{cm}$ ด้วย $1.33$ ทั้งหมด แต่ชั้นแก้วมีดรรชนีหักเห $1.50$ ต้องคิดแยกทีละชั้น" }
      - { match: 12, feedback: "หารความหนารวมด้วย $1.50$ ทั้งหมด ต้องหารแต่ละชั้นด้วยดรรชนีหักเหของชั้นนั้น" }
    hints:
      - "แต่ละชั้นทำให้ดูตื้นลงตามดรรชนีหักเหของชั้นนั้น"
      - "ความลึกปรากฏรวม $= \\tfrac{t_1}{n_1} + \\tfrac{t_2}{n_2}$"
    solution: "$\\dfrac{12}{1.33} + \\dfrac{6.0}{1.50} = 9.02 + 4.00 \\approx 13.0\\ \\mathrm{cm}$ ขณะที่ความลึกจริงคือ $18\\ \\mathrm{cm}$"
