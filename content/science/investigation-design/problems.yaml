- id: science.inquiry.investigation-design.p017
  topics:
  - science.inquiry.investigation-design
  difficulty: 5
  type: mcq
  stem: ชมรมวิทยาศาสตร์อยากสำรวจปลาในสระของวัดใกล้โรงเรียน ข้อใดเป็นการวางแผนที่รับผิดชอบที่สุด
  choices:
  - id: a
    text: ขออนุญาตเจ้าอาวาส ให้ครูไปด้วย ใช้สวิงจับ นับ แล้วปล่อยกลับที่เดิมทันที และสวมเสื้อชูชีพเมื่ออยู่ริมน้ำลึก
    correct: true
  - id: b
    text: แอบเข้าไปตอนเย็นเพื่อไม่รบกวนใคร แล้วเก็บปลาบางตัวกลับมาเลี้ยง
    feedback: ต้องขออนุญาตเจ้าของสถานที่ และไม่นำสิ่งมีชีวิตออกจากแหล่งที่อยู่โดยไม่จำเป็น
  - id: c
    text: ลงไปในสระคนเดียวเพื่อนับให้ละเอียด
