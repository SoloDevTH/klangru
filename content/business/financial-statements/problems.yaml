problems:
  - id: business.accounting.financial-statements.p001
    topics: [business.accounting.financial-statements]
    difficulty: 1
    type: match
    stem: "จับคู่งบการเงินกับสิ่งที่งบนั้นแสดง"
    pairs:
      - { left: "งบแสดงฐานะการเงิน", right: "สินทรัพย์ หนี้สิน และส่วนของเจ้าของ ณ วันใดวันหนึ่ง" }
      - { left: "งบกำไรขาดทุน", right: "รายได้ ค่าใช้จ่าย และกำไรของช่วงเวลาหนึ่ง" }
      - { left: "งบกระแสเงินสด", right: "เงินสดรับและจ่ายของช่วงเวลาหนึ่ง แยกตามกิจกรรม" }
      - { left: "งบแสดงการเปลี่ยนแปลงส่วนของเจ้าของ", right: "ทุนต้นงวด เงินลงทุนเพิ่ม กำไร ถอนใช้ และทุนปลายงวด" }
    hints:
      - "งบใดแสดง ณ วันเดียว งบใดแสดงตลอดช่วงเวลา"
      - "งบกระแสเงินสดสนใจแค่เงินสดเข้าออก"
    solution: "ฐานะการเงิน → ณ วันหนึ่ง · กำไรขาดทุน → รายได้ค่าใช้จ่ายของงวด · กระแสเงินสด → เงินสดรับจ่าย · การเปลี่ยนแปลงส่วนของเจ้าของ → ทุนต้นงวดถึงปลายงวด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.financial-statements.p002
    topics: [business.accounting.financial-statements]
    difficulty: 1
    type: mcq
    stem: "บัญชี **ลูกหนี้การค้า** แสดงอยู่ในงบใด"
    choices:
      - { id: a, text: "งบแสดงฐานะการเงิน (สินทรัพย์หมุนเวียน)", correct: true }
      - { id: b, text: "งบกำไรขาดทุน (รายได้)", feedback: "รายได้จากการขายเชื่ออยู่ในงบกำไรขาดทุน แต่ยอดลูกหนี้ที่ยังเก็บไม่ได้เป็นสินทรัพย์" }
      - { id: c, text: "งบกำไรขาดทุน (ค่าใช้จ่าย)", feedback: "ลูกหนี้คือเงินที่จะได้รับ ไม่ใช่ค่าใช้จ่าย" }
      - { id: d, text: "งบแสดงฐานะการเงิน (หนี้สิน)", feedback: "ลูกหนี้คือคนอื่นค้างเรา จึงเป็นสินทรัพย์ ไม่ใช่หนี้สิน" }
    hints:
      - "ลูกหนี้คือเงินที่คนอื่นค้างจ่ายเรา"
      - "สินทรัพย์อยู่ในงบใด"
    solution: "ลูกหนี้การค้าเป็นสินทรัพย์หมุนเวียน (คาดว่าจะได้รับเงินภายในหนึ่งปี) แสดงในงบแสดงฐานะการเงิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.financial-statements.p003
    topics: [business.accounting.financial-statements]
    difficulty: 2
    type: numeric
    stem: "ร้านกาแฟซื้อเครื่องชงราคาทุน $85{,}000$ บาท คาดว่าใช้ได้ $4$ ปี และขายเป็นเศษเหล็กได้ $5{,}000$ บาทเมื่อเลิกใช้ ค่าเสื่อมราคาแบบเส้นตรงปีละกี่บาท (ตอบเป็นบาท)"
    answer: { value: 20000, unit: บาท }
    hints:
      - "หักมูลค่าคงเหลือออกจากราคาทุนก่อน"
      - "หารด้วยอายุการให้ประโยชน์"
    misconceptions:
      - { match: 21250, feedback: "ไม่ได้หักมูลค่าคงเหลือ $5{,}000$ บาท ต้องใช้ $(85{,}000 - 5{,}000) \\div 4$" }
      - { match: 22500, feedback: "บวกมูลค่าคงเหลือ ต้องลบ" }
    solution: "$\\dfrac{85{,}000 - 5{,}000}{4} = \\dfrac{80{,}000}{4} = 20{,}000$ บาทต่อปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.financial-statements.p004
    topics: [business.accounting.financial-statements]
    difficulty: 2
    type: numeric
    stem: "ร้านขายของชำ (สมมติ) มีสินค้าคงเหลือต้นปี $40{,}000$ บาท ซื้อสินค้าสุทธิ $180{,}000$ บาท สินค้าคงเหลือปลายปี $35{,}000$ บาท ต้นทุนขายเป็นกี่บาท (ตอบเป็นบาท)"
    answer: { value: 185000, unit: บาท }
    hints:
      - "ต้นทุนขาย $=$ ต้นงวด $+$ ซื้อสุทธิ $-$ ปลายงวด"
      - "สินค้าที่ยังเหลือปลายปียังไม่ได้ขาย"
    misconceptions:
      - { match: 180000, feedback: "ใช้ยอดซื้อเป็นต้นทุนขายตรง ๆ ต้องปรับด้วยสินค้าคงเหลือต้นงวดและปลายงวด" }
      - { match: 255000, feedback: "บวกสินค้าคงเหลือปลายงวด ต้องหักออก" }
    solution: "$40{,}000 + 180{,}000 - 35{,}000 = 185{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.financial-statements.p005
    topics: [business.accounting.financial-statements]
    difficulty: 2
    type: mcq
    stem: "วันที่ 31 ธันวาคม ร้านยังไม่ได้รับใบแจ้งหนี้ค่าไฟฟ้าเดือนธันวาคม ซึ่งประมาณ $3{,}200$ บาท รายการปรับปรุงใดถูกต้อง"
    choices:
      - { id: a, text: "Dr. ค่าไฟฟ้า $3{,}200$ / Cr. ค่าใช้จ่ายค้างจ่าย $3{,}200$", correct: true }
      - { id: b, text: "ไม่ต้องบันทึก รอจ่ายเงินเดือนมกราคมแล้วค่อยบันทึก", feedback: "ใช้ไฟในเดือนธันวาคม ค่าใช้จ่ายเป็นของปีนี้ตามเกณฑ์คงค้าง" }
      - { id: c, text: "Dr. ค่าไฟฟ้า $3{,}200$ / Cr. เงินสด $3{,}200$", feedback: "ยังไม่ได้จ่ายเงินสด สิ่งที่เกิดคือหนี้สิน" }
      - { id: d, text: "Dr. ค่าใช้จ่ายค้างจ่าย $3{,}200$ / Cr. ค่าไฟฟ้า $3{,}200$", feedback: "สลับด้าน ค่าใช้จ่ายเพิ่มต้องเดบิต หนี้สินเพิ่มต้องเครดิต" }
    hints:
      - "ใช้ไฟไปแล้วในปีนี้ แต่ยังไม่ได้จ่ายเงิน"
      - "ค่าใช้จ่ายเพิ่มบันทึกเดบิต หนี้สินเพิ่มบันทึกเครดิต"
    solution: "ค่าไฟฟ้าเกิดในปีนี้ (ค่าใช้จ่ายเพิ่ม เดบิต) และยังค้างจ่าย (หนี้สินเพิ่ม เครดิต ค่าใช้จ่ายค้างจ่าย)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.financial-statements.p006
    topics: [business.accounting.financial-statements]
    difficulty: 2
    type: match
    stem: "จับคู่รายการเงินสดกับกิจกรรมในงบกระแสเงินสด"
    pairs:
      - { left: "รับเงินจากลูกค้าที่ซื้อสินค้า", right: "กิจกรรมดำเนินงาน" }
      - { left: "จ่ายเงินซื้อรถส่งของ", right: "กิจกรรมลงทุน" }
      - { left: "รับเงินกู้จากธนาคาร", right: "กิจกรรมจัดหาเงิน" }
    hints:
      - "ดำเนินงานคือการค้าประจำวัน ลงทุนคือซื้อขายสินทรัพย์ระยะยาว"
      - "จัดหาเงินคือเงินจากเจ้าของและผู้ให้กู้"
    solution: "รับเงินจากลูกค้า → ดำเนินงาน · ซื้อรถ → ลงทุน · กู้เงิน → จัดหาเงิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.financial-statements.p007
    topics: [business.accounting.financial-statements]
    difficulty: 3
    type: numeric
    stem: "วันที่ 1 ตุลาคม สถาบันกวดวิชา (สมมติ) รับค่าเรียนล่วงหน้าคอร์ส 12 เดือน $36{,}000$ บาท บันทึกเป็นรายได้รับล่วงหน้า ณ 31 ธันวาคมของปีเดียวกัน ต้องรับรู้รายได้ค่าเรียนของปีนี้กี่บาท (ตอบเป็นบาท)"
    answer: { value: 9000, unit: บาท }
    hints:
      - "นับจำนวนเดือนที่สอนไปแล้วตั้งแต่ 1 ตุลาคมถึง 31 ธันวาคม"
      - "รายได้ $= 36{,}000 \\times \\dfrac{\\text{เดือนที่สอนแล้ว}}{12}$"
    misconceptions:
      - { match: 36000, feedback: "รับเงินทั้งก้อนแล้ว แต่สอนไปแค่ 3 เดือน รายได้ปีนี้คือส่วนที่สอนแล้วเท่านั้น" }
      - { match: 27000, feedback: "นั่นคือส่วนที่ยังสอนไม่ถึง (รายได้รับล่วงหน้าคงเหลือ) ซึ่งเป็นหนี้สิน" }
      - { match: 6000, feedback: "นับแค่ 2 เดือน ตุลาคม พฤศจิกายน และธันวาคมรวมเป็น 3 เดือน" }
    solution: "สอนแล้ว 3 เดือน (ต.ค. พ.ย. ธ.ค.) รายได้ $= 36{,}000 \\times \\dfrac{3}{12} = 9{,}000$ บาท ส่วนที่เหลือ $27{,}000$ บาทยังเป็นรายได้รับล่วงหน้า (หนี้สิน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.financial-statements.p008
    topics: [business.accounting.financial-statements]
    difficulty: 3
    type: numeric
    stem: "ร้านขายอุปกรณ์การเกษตรในนครสวรรค์ (สมมติ) ปีนี้ขายได้ $520{,}000$ บาท ต้นทุนขาย $310{,}000$ บาท ค่าใช้จ่ายในการขายและบริหารรวม $150{,}000$ บาท กำไรสุทธิเป็นกี่บาท (ตอบเป็นบาท)"
    answer: { value: 60000, unit: บาท }
    hints:
      - "หากำไรขั้นต้นก่อน: ขาย $-$ ต้นทุนขาย"
      - "กำไรสุทธิ $=$ กำไรขั้นต้น $-$ ค่าใช้จ่ายในการขายและบริหาร"
    misconceptions:
      - { match: 210000, feedback: "นั่นคือกำไรขั้นต้น ยังต้องหักค่าใช้จ่ายในการขายและบริหาร" }
      - { match: 370000, feedback: "หักแค่ค่าใช้จ่ายในการขายและบริหาร ลืมหักต้นทุนขาย" }
    solution: "กำไรขั้นต้น $= 520{,}000 - 310{,}000 = 210{,}000$ บาท กำไรสุทธิ $= 210{,}000 - 150{,}000 = 60{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.financial-statements.p009
    topics: [business.accounting.financial-statements]
    difficulty: 3
    type: order
    stem: "เรียงงานสิ้นงวดตั้งแต่ได้งบทดลองจนได้งบการเงิน"
    items:
      - "บันทึกรายการปรับปรุง เช่น ค่าเสื่อมราคา ค่าใช้จ่ายค้างจ่าย"
      - "จัดทำงบทดลองหลังปรับปรุง"
      - "จัดทำงบกำไรขาดทุน เพื่อหากำไรสุทธิ"
      - "จัดทำงบแสดงการเปลี่ยนแปลงส่วนของเจ้าของ"
      - "จัดทำงบแสดงฐานะการเงิน"
    hints:
      - "ต้องปรับปรุงก่อน ยอดในงบการเงินจึงจะถูกต้อง"
      - "ต้องรู้กำไรสุทธิก่อนจึงหาส่วนของเจ้าของปลายงวดได้ และต้องรู้ส่วนของเจ้าของปลายงวดก่อนทำงบแสดงฐานะการเงิน"
    solution: "ปรับปรุงรายการ → งบทดลองหลังปรับปรุง → งบกำไรขาดทุน → งบแสดงการเปลี่ยนแปลงส่วนของเจ้าของ → งบแสดงฐานะการเงิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.financial-statements.p010
    topics: [business.accounting.financial-statements]
    difficulty: 3
    type: mcq
    stem: "นักบัญชีลืมบันทึกค่าเสื่อมราคาของปีนี้ $15{,}000$ บาท ผลต่องบการเงินคืออะไร"
    choices:
      - { id: a, text: "กำไรสุทธิสูงเกินไป $15{,}000$ บาท และสินทรัพย์สุทธิในงบแสดงฐานะการเงินสูงเกินไป $15{,}000$ บาท", correct: true }
      - { id: b, text: "กำไรสุทธิต่ำเกินไป $15{,}000$ บาท", feedback: "ค่าเสื่อมราคาเป็นค่าใช้จ่าย เมื่อลืมบันทึก ค่าใช้จ่ายต่ำไป กำไรจึงสูงเกินไป" }
      - { id: c, text: "เงินสดสูงเกินไป $15{,}000$ บาท", feedback: "ค่าเสื่อมราคาไม่ได้จ่ายเป็นเงินสด เงินสดจึงไม่ได้รับผลกระทบ" }
      - { id: d, text: "ไม่มีผลต่องบใด เพราะไม่มีเงินสดเกี่ยวข้อง", feedback: "แม้ไม่มีเงินสดเข้าออก แต่ค่าใช้จ่ายและมูลค่าสินทรัพย์ผิด" }
    hints:
      - "ค่าเสื่อมราคาเป็นค่าใช้จ่ายและเพิ่มค่าเสื่อมราคาสะสม"
      - "ค่าเสื่อมราคามีการจ่ายเงินสดหรือไม่"
    solution: "ไม่บันทึกค่าเสื่อมราคา ค่าใช้จ่ายต่ำไป กำไรสูงไป $15{,}000$ บาท ค่าเสื่อมราคาสะสมต่ำไป สินทรัพย์สุทธิจึงสูงไป $15{,}000$ บาท (ส่วนของเจ้าของก็สูงไปเท่ากัน) แต่เงินสดไม่เปลี่ยน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.financial-statements.p011
    topics: [business.accounting.financial-statements]
    difficulty: 3
    type: numeric
    stem: "จากยอดคงเหลือหลังปรับปรุงในภาพ สินทรัพย์รวมในงบแสดงฐานะการเงินของร้านอุปกรณ์กีฬาเป็นกี่บาท (ตอบเป็นบาท)"
    figure: { src: balances.svg, alt: "ตารางยอดคงเหลือหลังปรับปรุง ณ 31 ธันวาคม ของร้านอุปกรณ์กีฬา เงินสด 38,000 ลูกหนี้การค้า 12,000 สินค้าคงเหลือ 25,000 อุปกรณ์ 90,000 ค่าเสื่อมราคาสะสม – อุปกรณ์ 18,000 เจ้าหนี้การค้า 15,000 ค่าใช้จ่ายค้างจ่าย 3,000 เงินกู้ยืมระยะยาว 40,000 (บาท)" }
    answer: { value: 147000, unit: บาท }
    hints:
      - "เลือกเฉพาะบัญชีสินทรัพย์ เจ้าหนี้ ค่าใช้จ่ายค้างจ่าย และเงินกู้เป็นหนี้สิน"
      - "ค่าเสื่อมราคาสะสมต้องหักออกจากอุปกรณ์"
    misconceptions:
      - { match: 183000, feedback: "บวกค่าเสื่อมราคาสะสมเข้าไป ค่าเสื่อมราคาสะสมเป็นรายการหักจากอุปกรณ์" }
      - { match: 165000, feedback: "ไม่ได้หักค่าเสื่อมราคาสะสม อุปกรณ์ต้องแสดงสุทธิ $90{,}000 - 18{,}000$" }
    solution: "$38{,}000 + 12{,}000 + 25{,}000 + (90{,}000 - 18{,}000) = 147{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.financial-statements.p012
    topics: [business.accounting.financial-statements]
    difficulty: 4
    type: numeric
    stem: "จากยอดคงเหลือในภาพเดียวกัน ส่วนของเจ้าของ (ทุนปลายงวด) ของร้านอุปกรณ์กีฬาเป็นกี่บาท (ตอบเป็นบาท)"
    figure: { src: balances.svg, alt: "ตารางยอดคงเหลือหลังปรับปรุง ณ 31 ธันวาคม ของร้านอุปกรณ์กีฬา เงินสด 38,000 ลูกหนี้การค้า 12,000 สินค้าคงเหลือ 25,000 อุปกรณ์ 90,000 ค่าเสื่อมราคาสะสม – อุปกรณ์ 18,000 เจ้าหนี้การค้า 15,000 ค่าใช้จ่ายค้างจ่าย 3,000 เงินกู้ยืมระยะยาว 40,000 (บาท)" }
    answer: { value: 89000, unit: บาท }
    hints:
      - "หาสินทรัพย์รวม (สุทธิจากค่าเสื่อมราคาสะสม) และหนี้สินรวม"
      - "ส่วนของเจ้าของ $=$ สินทรัพย์ $-$ หนี้สิน"
    misconceptions:
      - { match: 107000, feedback: "ไม่ได้หักค่าเสื่อมราคาสะสมออกจากสินทรัพย์ ($165{,}000 - 58{,}000$)" }
      - { match: 129000, feedback: "ลืมเงินกู้ยืมระยะยาว ซึ่งเป็นหนี้สินเช่นกัน" }
    solution: "สินทรัพย์ $= 147{,}000$ บาท หนี้สิน $= 15{,}000 + 3{,}000 + 40{,}000 = 58{,}000$ บาท ส่วนของเจ้าของ $= 147{,}000 - 58{,}000 = 89{,}000$ บาท"
