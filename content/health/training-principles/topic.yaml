id: health.fitness.training-principles
subject: health
title:
  th: หลักการฝึกและการวางแผนการออกกำลังกาย
  en: Training principles and exercise planning
summary: หลัก FITT ความก้าวหน้า ความเฉพาะเจาะจง การคืนกลับ การอบอุ่นและคลายอุ่น ชีพจรเป้าหมาย การจัดเวลาฝึกและพัก ผลของการออกกำลังกายเป็นประจำ และการบันทึกผล
difficulty: 4
minutes: 35
prerequisites:
- health.fitness.fitness-components
encompasses:
- id: health.fitness.fitness-components
  weight: 0.3
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  title: โครงสร้างการฝึกหนึ่งครั้ง
  src: session.svg
  alt: กราฟชีพจรตามเวลา 0 ถึง 50 นาที แบ่งเป็นสามช่วง อบอุ่นร่างกาย 0 ถึง 10 นาที ชีพจรค่อย ๆ เพิ่มจากราว 75 เป็น 150 ครั้งต่อนาที ช่วงฝึกหลัก 10 ถึง 40 นาทีชีพจรอยู่ราว 145 ถึง 156 ภายในแถบแรเงาช่วงเป้าหมายของคนอายุ 15 ปี 133 ถึง 174 ครั้งต่อนาที คลายอุ่น 40 ถึง 50 นาทีชีพจรค่อย ๆ ลดลงเหลือราว 95
  caption: เส้นชีพจรเป็นตัวอย่างอย่างง่าย ไม่ใช่ข้อมูลวัดจริง
- type: worked-example
  title: หาช่วงชีพจรเป้าหมาย
  problem: แบม อายุ 14 ปี ต้องการฝึกความอดทนของหัวใจและปอดในช่วง 65–85% ของอัตราการเต้นของหัวใจสูงสุดโดยประมาณ ช่วงชีพจรเป้าหมายคือเท่าใด
  steps:
  - text: ค่าสูงสุดโดยประมาณ $220 - 14 = 206$ ครั้ง/นาที
  - text: ขอบล่าง $0.65 \times 206 = 133.9 \approx 134$ ครั้ง/นาที
  - text: ขอบบน $0.85 \times 206 = 175.1 \approx 175$ ครั้ง/นาที
  - text: ระหว่างวิ่ง จับชีพจรที่ข้อมือ 15 วินาทีแล้วคูณ 4 หรือใช้การทดสอบการพูดร่วมด้วย
    why: สูตรเป็นค่าประมาณที่คลาดได้มาก ความรู้สึกเหนื่อยช่วยยืนยัน
  answer: ประมาณ 134–175 ครั้ง/นาที
- type: check
  problem: health.fitness.training-principles.p004
  prompt: ลองตอบก่อนอ่านต่อ
- type: figure
  title: บันทึกผลดันพื้นของภูมิ
  src: progress-log.svg
  alt: กราฟเส้นบันทึกผลดันพื้น 30 วินาที ข้อมูลสมมติ สัปดาห์ 0, 2, 4, 6, 8, 10 ได้ 18, 20, 23, 26, 23, 27 ครั้ง ช่วงสัปดาห์ 6 ถึง 8 แรเงาเขียนว่าป่วย หยุดฝึก 2 สัปดาห์
  caption: บันทึกผลสม่ำเสมอทำให้เห็นทั้งความก้าวหน้าและผลของการหยุดฝึก
- type: worked-example
  title: วางแผนหนึ่งสัปดาห์ด้วย FITT
  problem: แบมมีผลทดสอบความอดทนของหัวใจและปอดระดับต่ำ ชอบปั่นจักรยาน เรียนพิเศษวันอังคารและพฤหัสบดีถึงหนึ่งทุ่ม วางแผนสัปดาห์แรก
  steps:
  - text: 'เป้าหมาย: เพิ่มความอดทนของหัวใจและปอด ชนิดกิจกรรมจึงเป็นปั่นจักรยานหรือเดินเร็ว (Type)'
  - text: 'ความบ่อย: ปั่นจันทร์ พุธ ศุกร์ อาทิตย์ (F = 4 วัน) วันอังคารและพฤหัสบดีเดินเร็วไปกลับที่เรียนพิเศษ วันเสาร์เล่นกีฬากับเพื่อนหรือพัก'
    why: จัดให้ไม่ชนเวลาเรียนและมีวันเบา
  - text: 'ความหนักและเวลา: เริ่มระดับปานกลาง คะแนนเหนื่อย 5–6 จาก 10 ครั้งละ 25 นาที (I, T) บวกอบอุ่นและคลายอุ่นอย่างละ 5 นาที'
  - text: 'เสริมกล้ามเนื้อ: ดันพื้นและสควอตหลังปั่นในวันจันทร์ พุธ ศุกร์ (3 วันต่อสัปดาห์)'
  - text: บันทึกเวลา ชีพจร และความรู้สึกทุกครั้ง สัปดาห์ถัดไปเพิ่มเวลาปั่นเป็น 30 นาทีถ้ารู้สึกสบาย
  answer: แผนครบ FITT มีวันเบา ฝึกกล้ามเนื้อ 3 วัน และมีการบันทึกเพื่อเพิ่มความหนักทีละน้อย
- type: check
  problem: health.fitness.training-principles.p009
glossary:
- term: หลัก FITT
  definition: การกำหนดความบ่อย (Frequency) ความหนัก (Intensity) ระยะเวลา (Time) และชนิดของกิจกรรม (Type) ในแผนออกกำลังกาย
- term: หลักความก้าวหน้า
  definition: การเพิ่มความหนักหรือระยะเวลาของการฝึกทีละน้อยเมื่อร่างกายปรับตัวได้
- term: หลักการคืนกลับ
  definition: เมื่อหยุดฝึกนาน สมรรถภาพที่ได้จากการฝึกจะค่อย ๆ ลดลง
- term: ชีพจรเป้าหมาย
  definition: ช่วงอัตราการเต้นของหัวใจที่ต้องการระหว่างฝึก มักคิดเป็นร้อยละของอัตราการเต้นสูงสุดโดยประมาณ
- term: สมรรถภาพทางกลไก
  definition: ความสามารถที่ใช้ในการเล่นกีฬา เช่น ความเร็ว ความคล่องแคล่วว่องไว พลัง การทรงตัว และการประสานงาน
flashcards:
- front: อัตราการเต้นของหัวใจสูงสุดโดยประมาณ
  back: 220 − อายุ (ครั้ง/นาที) เป็นค่าประมาณ ใช้ร่วมกับความรู้สึกเหนื่อย
- front: วิธีของคาร์โวเนน
  back: (ค่าสูงสุด − ชีพจรขณะพัก) × ความหนัก + ชีพจรขณะพัก
- front: การทดสอบการพูด
  back: 'ปานกลาง: พูดได้แต่ร้องเพลงไม่ได้ หนัก: พูดได้ไม่กี่คำก็ต้องหยุดหายใจ'
- front: โครงสร้างการฝึกหนึ่งครั้ง
  back: อบอุ่น 5–10 นาที → ฝึกหลักตาม FITT → คลายอุ่น 5–10 นาที
