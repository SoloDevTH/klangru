problems:
  - id: biology.animals.senses.p001
    topics: [biology.animals.senses]
    difficulty: 1
    type: mcq
    stem: "เซลล์ใดในเรตินาทำให้เรามองเห็นสี"
    choices:
      - { id: a, text: "เซลล์รูปกรวย", correct: true }
      - { id: b, text: "เซลล์รูปแท่ง", feedback: "เซลล์รูปแท่งทำงานในแสงสลัวและให้ภาพขาวดำ" }
      - { id: c, text: "เซลล์ของม่านตา", feedback: "ม่านตาปรับขนาดรูม่านตา ไม่ได้รับแสง" }
      - { id: d, text: "เซลล์ของเลนส์ตา", feedback: "เลนส์ตาหักเหแสงให้โฟกัสบนเรตินา ไม่ได้รับแสง" }
    hints:
      - "เซลล์รับแสงมีสองแบบ"
      - "แบบหนึ่งมี 3 ชนิดที่ไวต่อแสงสีต่างกัน"
    solution: "เซลล์รูปกรวยมี 3 ชนิดที่ไวต่อแสงสีน้ำเงิน เขียว และแดง สมองเทียบสัญญาณจากทั้งสามชนิดจึงเห็นเป็นสี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.senses.p002
    topics: [biology.animals.senses]
    difficulty: 1
    type: text
    stem: "ส่วนใดของหูชั้นในที่มี 3 หลอดตั้งฉากกันและรับรู้การหมุนของศีรษะ"
    accepted: ["หลอดกึ่งวงกลม", "semicircular canal", "semicircular canals", "หลอดครึ่งวงกลม"]
    misconceptions:
      - { match: "คอเคลีย", feedback: "คอเคลียเปลี่ยนการสั่นเป็นกระแสประสาทเพื่อการได้ยิน" }
      - { match: "ท่อยูสเตเชียน", feedback: "ท่อยูสเตเชียนอยู่ที่หูชั้นกลาง ช่วยปรับความดัน" }
    hints:
      - "หูชั้นในมีหน้าที่ได้ยินและทรงตัว"
      - "ชื่อบอกรูปร่างว่าเป็นครึ่งวง"
    solution: "หลอดกึ่งวงกลม 3 หลอดตั้งฉากกัน ของเหลวภายในไหลเมื่อศีรษะหมุน ทำให้รับรู้การหมุนเพื่อการทรงตัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.senses.p003
    topics: [biology.animals.senses]
    difficulty: 1
    type: match
    stem: "จับคู่โครงสร้างกับหน้าที่"
    pairs:
      - { left: "ม่านตา", right: "ปรับขนาดรูม่านตาตามความสว่าง" }
      - { left: "เลนส์ตา", right: "ปรับความโค้งเพื่อโฟกัสภาพบนเรตินา" }
      - { left: "เยื่อแก้วหู", right: "สั่นตามคลื่นเสียงที่เข้ามาในช่องหู" }
      - { left: "คอเคลีย", right: "เปลี่ยนการสั่นของของเหลวเป็นกระแสประสาท" }
      - { left: "ท่อยูสเตเชียน", right: "ปรับความดันในหูชั้นกลางให้เท่าภายนอก" }
    hints:
      - "สองข้อแรกอยู่ในตา สามข้อหลังอยู่ในหู"
      - "ท่อยูสเตเชียนต่อกับคอหอย"
    solution: "ม่านตาปรับรูม่านตา เลนส์ปรับโฟกัส เยื่อแก้วหูสั่นตามเสียง คอเคลียเปลี่ยนการสั่นเป็นกระแสประสาท ท่อยูสเตเชียนปรับความดัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.senses.p004
    topics: [biology.animals.senses]
    difficulty: 2
    type: order
    stem: "เรียงลำดับทางเดินของเสียงตั้งแต่เข้าหูจนถึงสมอง"
    items:
      - "ช่องหู"
      - "เยื่อแก้วหู"
      - "กระดูกค้อน ทั่ง โกลน"
      - "คอเคลีย"
      - "เส้นประสาทหู"
    hints:
      - "เริ่มจากหูชั้นนอก ผ่านหูชั้นกลาง ไปหูชั้นใน"
      - "กระดูกสามชิ้นอยู่ระหว่างเยื่อแก้วหูกับหูชั้นใน"
    solution: "ช่องหู → เยื่อแก้วหู → กระดูกค้อน ทั่ง โกลน → คอเคลีย → เส้นประสาทหู แล้วสมองจึงแปลเป็นเสียง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.senses.p005
    topics: [biology.animals.senses]
    difficulty: 2
    type: mcq
    stem: "ทำไมภาพที่ตกบนจุดบอดจึงมองไม่เห็น"
    choices:
      - { id: a, text: "เป็นตำแหน่งที่เส้นประสาทตาออกจากลูกตา จึงไม่มีเซลล์รับแสง", correct: true }
      - { id: b, text: "เป็นตำแหน่งที่มีเซลล์รูปกรวยแน่นที่สุดจนแสงทะลุผ่านไป", feedback: "บริเวณที่มีเซลล์รูปกรวยแน่นที่สุดคือโฟเวีย ซึ่งเห็นชัดที่สุด" }
      - { id: c, text: "เลนส์ตาหักเหแสงไปบริเวณนั้นไม่ได้", feedback: "แสงตกบริเวณนั้นได้ แต่ไม่มีเซลล์ใดรับแสงไว้" }
      - { id: d, text: "ม่านตาบังแสงไว้", feedback: "ม่านตาอยู่ด้านหน้าลูกตา ไม่ได้บังเฉพาะจุดใดของเรตินา" }
    hints:
      - "การเห็นต้องมีเซลล์รับแสง"
      - "เส้นประสาทตาต้องออกจากลูกตาที่ใดที่หนึ่ง"
    solution: "จุดบอดเป็นตำแหน่งที่ใยประสาทจากเรตินารวมกันเป็นเส้นประสาทตาแล้วออกจากลูกตา บริเวณนั้นไม่มีเซลล์รูปแท่งหรือรูปกรวย ภาพที่ตกตรงนั้นจึงไม่ถูกรับรู้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.senses.p006
    topics: [biology.animals.senses]
    difficulty: 2
    type: mcq
    stem: "ฝนเป็นหวัดคัดจมูก กินแกงเขียวหวานแล้วบอกว่ารสชาติจืดไปหมด ทั้งที่ยังรู้ว่าเผ็ดและเค็ม ข้อใดอธิบายได้ดีที่สุด"
    choices:
      - { id: a, text: "กลิ่นของอาหารไปไม่ถึงเซลล์รับกลิ่น สิ่งที่รู้สึกเป็นรสชาติส่วนใหญ่มาจากกลิ่น", correct: true }
      - { id: b, text: "เชื้อหวัดทำลายปุ่มรับรสทั้งหมด", feedback: "ฝนยังรับรสเค็มได้ แสดงว่าปุ่มรับรสยังทำงาน" }
      - { id: c, text: "ลิ้นรับรสได้เฉพาะเมื่อหายใจทางจมูก", feedback: "ปุ่มรับรสทำงานเองได้ แต่ข้อมูลกลิ่นที่ขาดไปทำให้แยกรสชาติอาหารไม่ออก" }
      - { id: d, text: "ความเผ็ดบังรสอื่นทั้งหมด", feedback: "ตอนไม่เป็นหวัด ฝนกินแกงเดียวกันก็รู้รสชาติได้ ความเผ็ดจึงไม่ใช่สาเหตุ" }
    hints:
      - "ลิ้นรับได้เพียง 5 รส"
      - "เป็นหวัดแล้วอะไรเปลี่ยนไป ลิ้นหรือจมูก"
    solution: "ลิ้นยังรับรสเค็มได้ แต่เมือกที่อุดโพรงจมูกทำให้โมเลกุลกลิ่นไปไม่ถึงเซลล์รับกลิ่น รสชาติที่ซับซ้อนของแกงซึ่งส่วนใหญ่มาจากกลิ่นจึงหายไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.senses.p007
    topics: [biology.animals.senses]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ภูมิใช้หูฟังฟังเพลงบนรถไฟฟ้าวันละหลายชั่วโมง ข้อใดเป็นการดูแลหูที่เหมาะสม (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ลดระดับเสียงลงและพักหูเป็นระยะ", correct: true }
      - { id: b, text: "ใช้หูฟังตัดเสียงรบกวน จะได้ไม่ต้องเปิดเสียงดังเพื่อกลบเสียงรถไฟ", correct: true }
      - { id: c, text: "เปิดเสียงให้ดังกว่าเสียงรถไฟมาก ๆ จะได้ไม่ต้องเพ่งฟัง", feedback: "เสียงที่ดังเกินไปทำลายเซลล์ขนในคอเคลียซึ่งไม่สร้างใหม่" }
      - { id: d, text: "ถ้ามีเสียงวิ้งในหูหลังฟังเพลง ไม่เป็นไรเพราะจะหายเอง", feedback: "เสียงวิ้งเป็นสัญญาณว่าหูรับเสียงมากเกินไป ถ้าเกิดซ้ำหรือไม่หายควรพบแพทย์" }
    hints:
      - "อันตรายขึ้นกับทั้งความดังและเวลาที่ฟัง"
      - "เสียงรอบข้างที่ดังทำให้เราเพิ่มเสียงในหูฟังโดยไม่รู้ตัว"
    solution: "ลดเสียงและพักหูลดพลังงานเสียงที่หูได้รับ หูฟังตัดเสียงรบกวนทำให้ไม่ต้องเปิดดัง ส่วนการเปิดดังกลบเสียงรถและการละเลยเสียงวิ้งเพิ่มความเสี่ยงประสาทหูเสื่อม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.senses.p008
    topics: [biology.animals.senses]
    difficulty: 3
    type: numeric
    stem: "บัตรทดสอบจุดบอดมีเครื่องหมาย + กับจุดดำห่างกัน 9 cm นักเรียนจ้อง + ด้วยตาขวา พบว่าจุดดำหายไปเมื่อตาอยู่ห่างบัตร 35 cm จุดบอดอยู่ห่างจากแนวสายตากี่องศา (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 14.4, unit: "องศา", tolerance: 0.2 }
    misconceptions:
      - { match: 75.6, feedback: "สลับด้าน ด้านตรงข้ามมุมคือระยะระหว่าง + กับจุดดำ ด้านประชิดคือระยะจากตาถึงบัตร" }
      - { match: 0.26, feedback: "0.26 เป็นค่า tan ของมุม ยังต้องหามุมด้วย tan⁻¹" }
    hints:
      - "ตา + และจุดดำเป็นสามเหลี่ยมมุมฉาก มุมฉากอยู่ที่ +"
      - "$\\tan\\theta$ = ระยะระหว่าง + กับจุดดำ ÷ ระยะจากตาถึงบัตร แล้วใช้ $\\tan^{-1}$"
    solution: "$\\tan\\theta = \\frac{9}{35} = 0.257$ ได้ $\\theta = \\tan^{-1} 0.257 \\approx 14.4^\\circ$ ใกล้ค่าราว 15 องศาที่ตำราระบุ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.senses.p009
    topics: [biology.animals.senses]
    difficulty: 3
    type: mcq
    stem: "นักเรียนวัดระยะสองจุดของเพื่อน (ข้อมูลสมมติ) ได้ ปลายนิ้วชี้ 3 mm ฝ่ามือ 10 mm ท้องแขน 35 mm แผ่นหลัง 42 mm ข้อสรุปใดถูกต้อง"
    choices:
      - { id: a, text: "ปลายนิ้วชี้ไวต่อสัมผัสที่สุด เพราะมีตัวรับสัมผัสหนาแน่นที่สุด", correct: true }
      - { id: b, text: "แผ่นหลังไวต่อสัมผัสที่สุด เพราะได้ค่ามากที่สุด", feedback: "ระยะสองจุดยิ่งมาก แปลว่าต้องแยกปลายแหลมให้ห่างมากจึงรู้สึกเป็นสองจุด คือไวน้อย" }
      - { id: c, text: "ทุกบริเวณไวเท่ากัน ความต่างเกิดจากความหนาของผิว", feedback: "ความต่างหลักมาจากความหนาแน่นของตัวรับ ไม่ใช่ความหนาของผิว" }
      - { id: d, text: "ปลายนิ้วชี้ไวที่สุด เพราะอยู่ใกล้สมองที่สุด", feedback: "ปลายนิ้วไม่ได้อยู่ใกล้สมองกว่าแผ่นหลัง ความไวขึ้นกับจำนวนตัวรับ" }
    hints:
      - "ระยะสองจุดน้อยแปลว่าอะไร"
      - "บริเวณที่แยกสองจุดใกล้กันได้ต้องมีตัวรับจำนวนมากในพื้นที่เล็ก"
    solution: "ระยะสองจุดน้อยแปลว่าแยกสองจุดที่อยู่ใกล้กันได้ ปลายนิ้วชี้ได้ 3 mm น้อยที่สุดจึงไวที่สุด เพราะมีตัวรับสัมผัสหนาแน่น ส่วนแผ่นหลังไวน้อยที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.senses.p010
    topics: [biology.animals.senses]
    difficulty: 3
    type: mcq
    stem: "เมื่อเดินจากลานจอดรถกลางแดดเข้าโรงภาพยนตร์ที่มืด ตอนแรกมองแทบไม่เห็น ผ่านไปหลายนาทีจึงเห็นที่นั่งได้แต่แยกสีได้ไม่ชัด ข้อใดอธิบายได้ถูกต้อง"
    choices:
      - { id: a, text: "เซลล์รูปแท่งค่อย ๆ กลับมาไวต่อแสงในที่มืด และเซลล์รูปแท่งให้ภาพขาวดำ จึงเห็นแต่แยกสีไม่ได้", correct: true }
      - { id: b, text: "เซลล์รูปกรวยปรับตัวในที่มืด จึงเห็นภาพสีชัดเจนขึ้น", feedback: "เซลล์รูปกรวยต้องการแสงมาก ในที่มืดจึงแทบไม่ทำงาน เราจึงแยกสีได้ไม่ชัด" }
      - { id: c, text: "รูม่านตาหดเล็กลงเพื่อให้แสงเข้ามากขึ้น", feedback: "ในที่มืด รูม่านตาขยาย ไม่ใช่หด" }
      - { id: d, text: "โฟเวียเริ่มทำงานเมื่ออยู่ในที่มืด", feedback: "โฟเวียมีแต่เซลล์รูปกรวย ทำงานดีในที่สว่าง" }
    hints:
      - "เซลล์รับแสงแบบใดทำงานในแสงสลัว"
      - "เซลล์แบบนั้นให้ข้อมูลสีหรือไม่"
    solution: "ในที่มืด รูม่านตาขยายและเซลล์รูปแท่งค่อย ๆ ไวต่อแสงขึ้น (ใช้เวลาหลายนาที) เซลล์รูปแท่งไม่ให้ข้อมูลสี จึงเห็นที่นั่งแต่แยกสีไม่ชัด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.senses.p011
    topics: [biology.animals.senses]
    difficulty: 3
    type: numeric
    stem: "WHO แนะนำว่าผู้ใหญ่ฟังเสียงเฉลี่ย 80 dB ได้ไม่เกิน 40 ชั่วโมงต่อสัปดาห์ และทุก 3 dB ที่ดังขึ้น เวลาที่ปลอดภัยลดลงครึ่งหนึ่ง ถ้าเปิดลำโพงในห้องที่ 86 dB ควรฟังไม่เกินกี่ชั่วโมงต่อสัปดาห์"
    answer: { value: 10, unit: "ชั่วโมง" }
    misconceptions:
      - { match: 20, feedback: "86 − 80 = 6 dB คือการเพิ่ม 3 dB สองครั้ง ต้องลดครึ่งสองครั้ง" }
      - { match: 34, feedback: "เวลาไม่ได้ลดทีละ 1 ชั่วโมงต่อ 1 dB แต่ลดครึ่งทุก 3 dB" }
    hints:
      - "เสียงดังขึ้นจาก 80 dB กี่ dB"
      - "นับว่าเพิ่ม 3 dB กี่ครั้ง แล้วหาร 40 ด้วย 2 ตามจำนวนครั้งนั้น"
    solution: "ดังขึ้น $86 - 80 = 6$ dB คือเพิ่ม 3 dB สองครั้ง เวลาที่ปลอดภัย $40 \\div 2^2 = 10$ ชั่วโมงต่อสัปดาห์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.senses.p012
    topics: [biology.animals.senses]
    difficulty: 3
    type: mcq
    stem: "ชาวนาและชาวประมงที่ทำงานกลางแดดและลมฝุ่นหลายปีมักเป็นต้อเนื้อ ข้อใดเป็นแนวทางป้องกันที่ตรงสาเหตุที่สุด"
    choices:
