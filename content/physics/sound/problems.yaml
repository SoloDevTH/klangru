      - { id: c, text: "ไม่มีใครได้ยิน เพราะเสียงความถี่สูงเดินทางในอากาศไม่ได้", feedback: "อัลตราโซนิกเดินทางในอากาศได้ สุนัขได้ยินถึงราว $45{,}000\\ \\mathrm{Hz}$ และค้างคาวก็ใช้อัลตราโซนิกในอากาศหาตำแหน่งเหยื่อ" }
