  <line x1="140" y1="90" x2="140" y2="140" stroke="#1f2937" stroke-width="1"/>
  <text x="148.0" y="119.5" text-anchor="start" fill="#1f2937" font-size="13">รับเงินจากลูกค้า · นำเงินฝากธนาคาร</text>
  <rect x="20" y="140" width="600" height="50" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
