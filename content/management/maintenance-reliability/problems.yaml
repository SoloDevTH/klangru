      - "ของเสียกระทบตัวประกอบใด"
    solution: "การเสียนานลดความพร้อมใช้ การหยุดเล็ก ๆ บ่อย ๆ ลดสมรรถนะ (ผลิตได้น้อยกว่าความเร็วเต็มที่ในเวลาเดินเครื่อง) และของเสียลดคุณภาพ"
