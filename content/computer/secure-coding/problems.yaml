      หลักการที่ระบบต้องปฏิเสธการเข้าถึงทันทีเมื่อการตรวจสอบเกิดข้อผิดพลาด แทนการปล่อยให้ผ่าน เรียกว่าอะไร (ตอบเป็นภาษาอังกฤษ)
