# หัวข้อในคลังที่ตรงกับ 2026 CSTA PK–12 Computer Science Standards
# เป็นการเทียบภายในของคลังรู้ ไม่ใช่การรับรองจาก CSTA
# full = บทเรียนและโจทย์สอนครบตามมาตรฐาน, partial = บางส่วน (ดู note)
# แอปไม่มีตัวแก้ไขหรือตัวรันโปรแกรม มาตรฐานที่ให้ผู้เรียน "สร้าง" หรือ "พัฒนา" โปรแกรม ชิ้นงาน หรือแบบจำลองเอง
# จึงเป็น partial เมื่อบทเรียนสอนผ่านการไล่ เลือก เรียง และแก้โปรแกรมที่ให้มา
framework: csta-k12-cs-2026
mappings:
  # ---------- อัลกอริทึม ----------
  - topic: computer.algorithms.intro
    indicators: [EK-ALG-PS-01, E1-ALG-PS-01, EK-ALG-IM-03, MS-ALG-PS-03, EK-PRO-TR-07]
    coverage: full
    note: ทำตามและแยกกิจวัตรเป็นขั้นตอน (หุงข้าว ชงชา ไข่เจียว) อัลกอริทึมที่ดีต้องชัดเจนและมีจุดจบ ไล่ตารางค่าเพื่อตรวจผลกับข้อมูลเข้า และหาขั้นที่ผิดในอัลกอริทึมหาค่าเฉลี่ย
  - topic: computer.algorithms.intro
    indicators: [E4-ALG-PS-01, MS-ALG-PS-02]
    coverage: partial
    note: เขียนอัลกอริทึมด้วยรหัสลำลองและผังงานที่มีลำดับ ทางเลือก และวงวน แต่ไม่มีเหตุการณ์ (events) และยังไม่ใช้กระบวนงานย่อย (procedure)
  - topic: computer.algorithms.computational-thinking
    indicators: [E1-ALG-PS-01, MS-ALG-PS-02]
    coverage: full
    note: แยกปัญหาเป็นส่วนย่อยหลายชั้น หารูปแบบ นามธรรม และออกแบบอัลกอริทึมด้วยรหัสลำลองและผังงานที่มีวงวน ทางเลือก และส่วนที่ใช้ซ้ำทุกห้อง
  - topic: computer.algorithms.computational-thinking
    indicators: [S1-XCS-XC-01, S1-XCS-XC-02]
    coverage: partial
    note: จับคู่ปัญหาในวิชาอื่นกับอัลกอริทึมเดียวกัน (ค้นหาแบบแบ่งครึ่ง ค่าน้ำประปา ค่าจอดรถ) แต่ผู้เรียนไม่ได้ตั้งปัญหาในวิชาอื่นแล้วสร้างคำตอบเชิงคำนวณเอง
  - topic: computer.algorithms.logical-reasoning
    indicators: [MS-ALG-PS-03]
    coverage: full
    note: คาดการณ์ผลของเงื่อนไขกับข้อมูลเข้า (ค่าส่ง ค่าเข้าชม เครื่องรดน้ำ) และหาข้อมูลเข้าที่ทำให้อัลกอริทึมตัดเกรดผิด
  - topic: computer.algorithms.logical-reasoning
    indicators: [E4-PRO-PD-04]
    coverage: partial
    note: เปรียบเทียบหลายอัลกอริทึมของปัญหาเดียวกันด้วยความถูกต้องและจำนวนขั้นในกรณีแย่ที่สุด (หาเหรียญปลอม ทายเลข หาบัตร) แต่เป็นอัลกอริทึม ไม่ใช่โปรแกรม
  - topic: computer.algorithms.searching-sorting
    indicators: [HS-ALG-PS-03]
    coverage: full
    note: นับจำนวนการเทียบและใช้บิ๊กโอเปรียบเทียบการค้นหาและการเรียงหลายวิธี และชั่งความอ่านง่ายกับประสิทธิภาพเมื่อเลือกวิธี
  - topic: computer.algorithms.efficiency
    indicators: [HS-ALG-PS-03]
    coverage: full
    note: วัดประสิทธิภาพด้วยจำนวนขั้นเป็นฟังก์ชันของ n และบิ๊กโอ พิสูจน์ความถูกต้องด้วยค่าคงตัวของวงวน และแสดงว่ากรณีทดสอบอย่างเดียวไม่พอ
  - topic: computer.algorithms.efficiency
    indicators: [S2-SWD-DD-04]
    coverage: partial
    note: ดัดแปลงการค้นหาแบบทวิภาคกับปัญหาใหม่ และเปลี่ยนการหารหัสซ้ำจากเทียบทุกคู่เป็นเรียงแล้วตรวจตัวติดกันหรือใช้เซต แต่ผู้เรียนไม่ได้แก้โปรแกรมเองในแอป
  - topic: computer.algorithms.data-structures
    indicators: [S2-SWD-DD-01]
    coverage: full
    note: ใช้ตารางแฮช ต้นไม้ค้นหาแบบทวิภาค และกราฟกับปัญหาจริง (ใส่คีย์และนับการชน ใส่ค่าในต้นไม้ ท่องกราฟหาทางสั้นที่สุด) และเลือกโครงสร้างให้เหมาะกับงาน
  - topic: computer.algorithms.data-structures
    indicators: [HS-ALG-PS-01, S1-SWD-DD-01]
    coverage: partial
    note: เลือกโครงสร้างข้อมูลให้เหมาะกับงานและไล่การทำงานของสแตกกับคิว แต่ผู้เรียนไม่ได้ออกแบบอัลกอริทึมหรือเขียนโครงสร้างข้อมูลเองในแอป
  - topic: computer.ai.intro
    indicators: [E1-ALG-ML-02, E2-ALG-ML-02, E4-ALG-ML-02, MS-ALG-ML-06, MS-ALG-ML-07, MS-ALG-ML-08, MS-ALG-PS-04, HS-ALG-ML-06, MS-ALG-IM-10, S1-AIN-DD-05, S1-AIN-HR-09]
    coverage: full
    note: AI หารูปแบบจากข้อมูลเพื่อจำแนกหรือสร้างสิ่งใหม่ ข้อมูลฝึกกับข้อมูลทดสอบ ความลำเอียงจากข้อมูลและวิธีลด (เก็บข้อมูลให้ครบทุกกลุ่ม วัดแยกกลุ่ม) การเรียนรู้เกินและความแม่นยำที่หลอกตา และเลือกระหว่างการค้นหาตามกติกา การเขียน if-else และการเรียนรู้จากข้อมูล
  - topic: computer.ai.intro
    indicators: [E5-ALG-ML-02, HS-ALG-ML-07, HS-ALG-ML-08, HS-ALG-PS-05, HS-ALG-IM-10, E4-SOC-HU-18, S1-AIN-DD-01, S1-AIN-DD-02, S1-AIN-HR-08, S2-DSC-MI-08]
    coverage: partial
    note: จำแนกมะม่วงด้วย k เพื่อนบ้านใกล้ที่สุดด้วยมือและโค้ดที่ให้มา ตรวจผลของ AI แบบรู้สร้าง และวัดผลแบบจำลองกับข้อมูลที่ไม่สมดุล แต่ผู้เรียนไม่ได้ฝึกแบบจำลองหรือแก้ข้อมูลฝึกเองในเครื่องมือจริง และไม่ได้ประเมินแหล่งที่มาหรือความเป็นส่วนตัวของข้อมูลฝึกอย่างละเอียด

  # ---------- การเขียนโปรแกรม ----------
  - topic: computer.programming.block-programming
    indicators: [EK-PRO-PD-04, EK-PRO-RD-06, E1-PRO-RD-06, E1-PRO-TR-07, E2-PRO-TR-07, E3-PRO-VD-06]
    coverage: full
    note: เรียงบล็อกคำสั่งให้หุ่นยนต์ทำงานสำเร็จ อธิบายโปรแกรมที่เริ่มด้วยบล็อกเหตุการณ์ ไล่และแก้โปรแกรมที่มีลำดับ เหตุการณ์ และวงวน และตัวแปรเหรียญหรือชีวิตที่เปลี่ยนค่าในเกม
  - topic: computer.programming.block-programming
    indicators: [E1-PRO-PD-04, E2-PRO-PD-04, E2-ALG-PS-01, E5-PRO-PD-04]
    coverage: partial
    note: เลือกและเรียงบล็อกเป็นโปรแกรมที่มีลำดับ เหตุการณ์ และวงวน และดัดแปลงเกมของเพื่อนพร้อมให้เครดิต แต่ไม่ได้สร้างโปรแกรมเองในเครื่องมือจริง
  - topic: computer.programming.basics
    indicators: [E3-PRO-VD-06, E4-PRO-VD-06, E5-PRO-VD-06, MS-PRO-VD-16]
    coverage: full
    note: ไล่ค่าตัวแปรที่เปลี่ยนผ่านการกำหนดค่า เงื่อนไข และวงวน (รวมวงวนซ้อนและ while) ตัวแปรหลายชนิดข้อมูล (จำนวนเต็ม ทศนิยม สตริง บูลีน) และผู้เรียนเขียนโปรแกรมเองในแอปที่เก็บ เทียบ และแก้ค่าตัวแปรจำนวนเต็มและทศนิยม (ราคารวม ผลบวกสะสม เงินฝากทบต้นที่วนจนถึงเป้า)
  - topic: computer.programming.basics
    indicators: [MS-PRO-RD-17, E3-PRO-TR-08]
    coverage: partial
    note: วิเคราะห์บทบาทของวงวน เงื่อนไข และตัวแปร และหาข้อผิดพลาดของโปรแกรม (ผู้เรียนแก้โค้ดในแอปจนผ่านชุดทดสอบได้แล้ว) แต่หัวข้อนี้ยังไม่มีกระบวนงานย่อยและเหตุการณ์
  - topic: computer.programming.design-debug
    indicators: [E3-PRO-TR-08, E4-PRO-TR-08, E5-PRO-TR-08, MS-PRO-TR-19, E4-PRO-RD-07, MS-ALG-PS-03]
    coverage: full
    note: ไล่และแก้โปรแกรมที่มีลำดับ เหตุการณ์ วงวน และเงื่อนไขแบบรวม เขียนทีละส่วนแล้วทดสอบทีละส่วน ดีบักอย่างเป็นระบบ เลือกกรณีทดสอบปกติ ขอบ และผิดรูป และเขียนคอมเมนต์ที่อธิบายเหตุผล
  - topic: computer.programming.design-debug
    indicators: [E5-PRO-RD-07, S1-SWD-TR-07]
    coverage: partial
    note: เลือกชุดข้อมูลทดสอบที่ครอบคลุมขอบและข้อมูลผิดรูป และรู้ว่าเอกสารควรมีอะไร แต่ผู้เรียนไม่ได้เขียนแผนทดสอบหรือเอกสารของโครงงานตนเอง
  - topic: computer.programming.functions
    indicators: [MS-PRO-RD-17, HS-PRO-RD-17, MS-PRO-PD-12]
    coverage: full
    note: อธิบายบทบาทของพารามิเตอร์ ค่าที่คืน ขอบเขตของตัวแปร วงวน และเงื่อนไขในฟังก์ชัน ไล่ผลของโค้ดที่เรียกฟังก์ชัน และผู้เรียนเขียนฟังก์ชันเองในแอปเพื่อจัดโค้ดให้อ่านง่ายและใช้ซ้ำได้ (bmi grade is_leap) ซึ่งชุดทดสอบเรียกใช้ซ้ำกับหลายค่า
  - topic: computer.programming.functions
    indicators: [HS-PRO-PD-12, HS-ALG-PS-02, S1-XCS-XC-02]
    coverage: partial
    note: แยกโปรแกรมเป็นฟังก์ชันและโมดูลเพื่อใช้ซ้ำ ฟังก์ชันแก้โจทย์คณิตศาสตร์และวิทยาศาสตร์ และเลือกฟังก์ชันแบบมีพารามิเตอร์ที่ใช้ซ้ำได้ แต่โจทย์เขียนโค้ดเป็นฟังก์ชันเดี่ยวที่ให้สูตรมาแล้ว ผู้เรียนยังไม่ได้สร้างโปรแกรมหลายโมดูลหรือใช้ไลบรารีภายนอก ไม่ได้ปรับปรุงการออกแบบอัลกอริทึม และไม่ได้ตั้งวิธีแก้ปัญหาของศาสตร์อื่นเองตั้งแต่ต้น
  - topic: computer.programming.lists-strings
    indicators: [HS-PRO-RD-17, HS-PRO-VD-16, MS-PRO-VD-16]
    coverage: full
    note: ไล่โค้ดที่ใช้ลิสต์ ดิกชันนารี เซต และสตริง รวมการอ้างถึงลิสต์เดียวกันจากสองตัวแปร และผู้เรียนเขียนโปรแกรมเองในแอปที่เก็บ เข้าถึง และจัดการข้อมูลด้วยลิสต์และดิกชันนารี (ค่าเฉลี่ยคะแนน คัดคะแนนที่ผ่านลงลิสต์ใหม่ นับคำ)
  - topic: computer.programming.lists-strings
    indicators: [HS-ALG-PS-01, S1-SWD-DD-01, HS-DAT-DC-23]
    coverage: partial
    note: เลือกโครงสร้างข้อมูลให้เหมาะกับปัญหา (คะแนน 40 คน นับคำ ตัดสต็อก) และประมวลผลข้อความ แต่โจทย์เขียนโค้ดกำหนดโครงสร้างข้อมูลมาให้ ผู้เรียนยังไม่ได้ออกแบบอัลกอริทึมและเลือกโครงสร้างเองจากปัญหาเปิด ยังไม่ได้สร้างโครงสร้างข้อมูลเชิงเส้นเอง (สแตก คิว) และการจัดข้อความมีเพียงการแยกคำด้วย split ไม่มีชุดข้อมูลข้อความจริงให้ทำความสะอาด
  - topic: computer.programming.recursion
    indicators: [HS-PRO-RD-17]
    coverage: full
    note: ไล่ฟังก์ชันเรียกซ้ำด้วยกองการเรียก พารามิเตอร์และค่าที่คืนในแต่ละชั้น และการเรียกซ้ำกับลิสต์ สตริง และโฟลเดอร์ซ้อน
  - topic: computer.programming.oop
    indicators: [HS-PRO-RD-17, MS-PRO-PD-13]
    coverage: full
    note: ไล่โค้ดคลาส เมทอด และการสืบทอด และอ่านเอกสาร API ของโมดูลและบริการข้อมูลเพื่อเรียกใช้ให้ถูก
  - topic: computer.programming.oop
    indicators: [HS-PRO-PD-12, HS-PRO-PD-13, S1-SWD-DD-02]
    coverage: partial
    note: แยกโปรแกรมสหกรณ์เป็นโมดูล ใช้ไลบรารีและ API และสร้างคลาสที่นำมาใช้ซ้ำ ผ่านตัวอย่างและโจทย์ แต่ผู้เรียนไม่ได้สร้างโปรแกรมแบบโมดูลเองในแอป
  - topic: computer.programming.development-process
    indicators: [E3-PRO-PD-05, E5-PRO-PD-04, MS-PRO-TR-20, HS-PRO-TR-20, HS-PRO-PD-14, HS-PRO-TR-19, S2-SWD-DD-03, S2-SWD-PP-09]
    coverage: partial
    note: วงจรชีวิตซอฟต์แวร์ ต้นแบบที่ทดสอบกับผู้ใช้หลายกลุ่ม จัดลำดับความเห็น ต่อยอดโปรแกรมโอเพนซอร์สพร้อมให้เครดิต บันทึกเหตุผลการออกแบบ และเลือกแบบวนรอบหรือแบบน้ำตก แต่ผู้เรียนไม่ได้ปรับโปรแกรมของตนเองตามผลทดสอบในแอป
  - topic: computer.programming.teamwork
    indicators: [E4-PRO-PD-05, E5-PRO-PD-05, MS-PRO-PD-15, HS-PRO-PD-15, E5-SOC-CE-19, HS-SOC-CE-45, S1-SWD-PP-08, S1-GMD-PP-09, S2-GMD-PP-08]
