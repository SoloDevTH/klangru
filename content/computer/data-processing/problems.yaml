problems:
  - id: computer.data.data-processing.p001
    topics: [computer.data.data-processing]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็น **ข้อมูลปฐมภูมิ** ของชมรมที่อยากรู้ว่าเพื่อนชอบน้ำเมนูใด"
    choices:
      - { id: a, text: "ผลแบบสอบถามออนไลน์ที่ชมรมส่งให้นักเรียนตอบเอง", correct: true }
      - { id: b, text: "บทความในเว็บไซต์ที่บอกว่าวัยรุ่นไทยชอบชานม", feedback: "เป็นข้อมูลที่คนอื่นเก็บไว้แล้ว จึงเป็นข้อมูลทุติยภูมิ" }
      - { id: c, text: "ตัวเลขยอดขายน้ำของร้านอื่นที่ได้ยินมา", feedback: "ไม่ได้เก็บเอง และไม่รู้ว่าเก็บมาอย่างไร เป็นข้อมูลทุติยภูมิ" }
      - { id: d, text: "สถิติประชากรจากหน่วยงานรัฐ", feedback: "เป็นข้อมูลทุติยภูมิ และไม่ได้ตอบคำถามเรื่องเมนูของเพื่อนในโรงเรียน" }
    hints:
      - "ข้อมูลปฐมภูมิคือข้อมูลที่เราเก็บเองโดยตรง"
      - "ข้อใดที่ชมรมเป็นผู้เก็บจากแหล่งต้นทางเอง"
    solution: "แบบสอบถามที่ชมรมส่งให้นักเรียนตอบเป็นข้อมูลที่ชมรมเก็บเองโดยตรง จึงเป็นข้อมูลปฐมภูมิ ข้ออื่นเป็นข้อมูลที่ผู้อื่นเก็บไว้แล้ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-processing.p002
    topics: [computer.data.data-processing]
    difficulty: 1
    type: order
    stem: "เรียงขั้นของวงจรชีวิตข้อมูล"
    items:
      - "สร้างและเก็บรวบรวม"
      - "จัดเก็บ"
      - "ทำความสะอาด"
      - "ประมวลผลและวิเคราะห์"
      - "นำเสนอและใช้"
      - "เก็บรักษาหรือทำลาย"
    hints:
      - "ต้องมีข้อมูลก่อนจึงจะเก็บไว้ที่ใดที่หนึ่งได้"
      - "ทำความสะอาดก่อนวิเคราะห์ และวิเคราะห์ก่อนนำเสนอ"
    solution: "สร้างและเก็บรวบรวม → จัดเก็บ → ทำความสะอาด → ประมวลผลและวิเคราะห์ → นำเสนอและใช้ → เก็บรักษาหรือทำลาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-processing.p003
    topics: [computer.data.data-processing]
    difficulty: 2
    type: numeric
    stem: "จากตารางคำนวณในภาพ สูตร `=AVERAGE(B2:B6)` ให้ผลเท่าใด"
    figure:
      src: score-sheet.svg
      alt: "ตารางคำนวณ คอลัมน์ A ชื่อ คอลัมน์ B คะแนน แถว 1 เป็นหัวตาราง แถว 2 ก้อง 72 แถว 3 ข้าวหอม 45 แถว 4 ขิม 50 แถว 5 ต้นกล้า 88 แถว 6 น้ำ 39 แถว 7 ปอ 61 แถว 8 พลอย 50 แถว 9 ฟ้า 94 แถว 10 มีน 47 แถว 11 วิว 66"
    answer: { value: 58.8, tolerance: 0.01 }
    hints:
      - "B2:B6 คือเซลล์ B2, B3, B4, B5 และ B6 รวม 5 เซลล์"
      - "ค่าเฉลี่ย = ผลรวม ÷ จำนวนเซลล์"
    misconceptions:
      - { match: 61.2, feedback: "61.2 คือค่าเฉลี่ยของทั้ง 10 คน (B2:B11) แต่สูตรใช้แค่ B2 ถึง B6" }
      - { match: 294, feedback: "294 คือผลรวม ยังต้องหารด้วยจำนวนเซลล์ 5" }
    solution: "B2:B6 = 72, 45, 50, 88, 39 ผลรวม 294 หารด้วย 5 ได้ 58.8"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-processing.p004
    topics: [computer.data.data-processing]
    difficulty: 2
    type: mcq
    stem: "แบบฟอร์มลงทะเบียนค่ายมีช่อง \"อายุ\" ผู้สมัครต้องเป็นนักเรียนอายุ 12 ถึง 15 ปี กฎตรวจสอบข้อใดช่วยป้องกันข้อมูลผิดได้ดีที่สุด"
    choices:
      - { id: a, text: "รับเฉพาะจำนวนเต็มตั้งแต่ 12 ถึง 15 และบังคับตอบ", correct: true }
      - { id: b, text: "ให้พิมพ์อะไรก็ได้ แล้วค่อยตรวจทีหลัง", feedback: "จะได้ค่าอย่าง \"สิบสาม\" \"13 ปีครับ\" หรือเว้นว่าง ต้องมาแก้ทีหลังซึ่งเสียเวลาและผิดพลาดง่าย" }
      - { id: c, text: "รับเฉพาะตัวอักษร", feedback: "อายุเป็นตัวเลข การรับเฉพาะตัวอักษรทำให้นำไปคำนวณไม่ได้" }
      - { id: d, text: "รับตัวเลขใดก็ได้ ตั้งแต่ 0 ถึง 999", feedback: "ตรวจชนิดแล้ว แต่ช่วงกว้างเกินไป ค่าที่พิมพ์ผิด เช่น 130 ยังผ่านได้" }
    hints:
      - "กฎที่ดีตรวจทั้งชนิดข้อมูล ช่วงของค่า และการเว้นว่าง"
      - "ค่าที่ถูกต้องมีได้แค่ไหนถึงไหน"
    solution: "กฎที่ดีที่สุดตรวจทั้งชนิด (จำนวนเต็ม) ช่วง (12 ถึง 15) และบังคับตอบ จึงกันข้อมูลผิดได้ตั้งแต่ตอนกรอก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-processing.p005
    topics: [computer.data.data-processing]
    difficulty: 2
    type: match
    stem: "จับคู่ปัญหาของข้อมูลกับวิธีแก้ที่เหมาะสม"
    pairs:
      - { left: "นักเรียนคนเดียวกดส่งแบบสอบถามสองครั้ง", right: "ลบแถวที่ซ้ำให้เหลือแถวเดียว" }
      - { left: "บางคนกรอกน้ำหนักเป็นกรัม บางคนเป็นกิโลกรัม", right: "แปลงให้เป็นหน่วยเดียวกัน" }
      - { left: "มีคนพิมพ์ \"ชาเยน\" และ \"ชาเย็น\"", right: "แก้ให้สะกดแบบเดียวกัน และครั้งหน้าให้เลือกจากรายการ" }
      - { left: "อุณหภูมิวันหนึ่งสูงกว่าวันอื่นมาก", right: "ตรวจหาสาเหตุก่อนตัดสินใจว่าจะเก็บหรือแก้" }
    hints:
      - "ปัญหาแต่ละแบบมีวิธีแก้ของตัวเอง"
      - "ค่าผิดปกติไม่ได้ผิดเสมอไป"
    solution: "ส่งซ้ำ = ลบแถวซ้ำ, หน่วยต่างกัน = แปลงหน่วย, สะกดต่างกัน = ทำให้เป็นแบบเดียวกันและใช้รายการให้เลือก, ค่าผิดปกติ = หาสาเหตุก่อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-processing.p006
    topics: [computer.data.data-processing]
    difficulty: 3
    type: numeric
    stem: "ชมรมทำความสะอาดข้อมูลในภาพ โดย (1) ลบแถวที่ส่งซ้ำ (2) ตัดแถวที่ช่องใดช่องหนึ่งว่าง (3) ตัดแถวที่จำนวนแก้วผิดกติกา (4) แก้คำที่สะกดผิดให้ถูกโดยไม่ตัดแถว หลังทำความสะอาดเหลือข้อมูลกี่แถว (ไม่นับแถวหัวตาราง)"
    figure:
      src: dirty-sheet.svg
      alt: "ตารางคำนวณผลแบบสอบถามร้านน้ำชมรม ข้อมูลดิบ กติกา ทุกช่องต้องตอบ และแก้วต่อสัปดาห์ต้องอยู่ระหว่าง 0 ถึง 14 คอลัมน์ A เวลาส่ง B ชื่อเล่น C ชั้น D เมนูที่ชอบ E แก้วต่อสัปดาห์ แถว 2 08:01 ต้น ม.2 ชาเย็น 3 แถว 3 08:03 ฝน ม.1 นมชมพู 5 แถว 4 08:01 ต้น ม.2 ชาเย็น 3 แถว 5 08:10 บอส ม.3 เมนูว่าง 2 แถว 6 08:12 แก้ว ม.1 ชาเย็น 70 แถว 7 08:15 มิว ม.2 โกโก้ 4 แถว 8 08:20 เจ ม.3 ชาเยน 6 แถว 9 08:22 ปาล์ม ม.1 นมชมพู 2 แถว 10 08:30 ใบเตย ม.2 โกโก้ 7 แถว 11 08:31 กัน ม.3 นมชมพู 1"
    answer: { value: 7, unit: แถว }
    hints:
      - "หาแถวที่เหมือนกันทุกช่องรวมทั้งเวลาส่ง แถวที่เว้นว่าง และแถวที่จำนวนแก้วเกิน 14"
      - "แถวที่สะกดผิดแก้ได้ จึงไม่ต้องตัดออก"
    misconceptions:
      - { match: 6, feedback: "ตัดแถวที่สะกด \"ชาเยน\" ไปด้วย แต่แถวนั้นแค่สะกดผิด แก้ให้ถูกแล้วเก็บไว้ได้" }
      - { match: 8, feedback: "ตัดไม่ครบ ตรวจว่าเจอแถวซ้ำ แถวว่าง และแถวที่ผิดกติกาครบทั้งสามแบบหรือยัง" }
    solution: "ข้อมูลดิบ 10 แถว ลบแถว 4 (ซ้ำกับแถว 2) ตัดแถว 5 (เมนูว่าง) และแถว 6 (70 แก้วเกิน 14) แก้แถว 8 เป็น \"ชาเย็น\" เหลือ 10 − 3 = 7 แถว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-processing.p007
    topics: [computer.data.data-processing]
    difficulty: 3
    type: numeric
    stem: "จากตารางคำนวณในภาพ สูตร `=COUNTIF(B2:B11,\">=50\")` ให้ผลเท่าใด"
    figure:
      src: score-sheet.svg
      alt: "ตารางคำนวณ คอลัมน์ A ชื่อ คอลัมน์ B คะแนน แถว 1 เป็นหัวตาราง แถว 2 ก้อง 72 แถว 3 ข้าวหอม 45 แถว 4 ขิม 50 แถว 5 ต้นกล้า 88 แถว 6 น้ำ 39 แถว 7 ปอ 61 แถว 8 พลอย 50 แถว 9 ฟ้า 94 แถว 10 มีน 47 แถว 11 วิว 66"
    answer: { value: 7 }
    hints:
      - "COUNTIF นับจำนวนเซลล์ที่ตรงเงื่อนไข ไม่ได้บวกค่า"
      - "เงื่อนไข >= 50 นับคะแนน 50 พอดีด้วย"
    misconceptions:
      - { match: 5, feedback: "ไม่ได้นับคะแนน 50 ซึ่งมีสองคน เงื่อนไข >= รวมค่าที่เท่ากับ 50 ด้วย" }
      - { match: 481, feedback: "บวกคะแนนของคนที่ผ่าน แต่ COUNTIF นับจำนวนเซลล์ ไม่ได้หาผลรวม" }
    solution: "คะแนนที่มากกว่าหรือเท่ากับ 50 คือ 72, 50, 88, 61, 50, 94, 66 รวม 7 เซลล์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-processing.p008
    topics: [computer.data.data-processing]
    difficulty: 3
    type: mcq
    stem: "นักเรียนบันทึกค่าฝุ่น PM2.5 หน้าโรงเรียนทุกเช้าตลอดเดือนมกราคม ต้องการให้เห็นว่าค่าฝุ่นเพิ่มขึ้นหรือลดลงตามวัน ควรใช้แผนภูมิแบบใด"
    choices:
      - { id: a, text: "แผนภูมิเส้น แกนนอนเป็นวันที่ แกนตั้งเป็นค่าฝุ่น", correct: true }
      - { id: b, text: "แผนภูมิวงกลม แบ่งตามวัน", feedback: "แผนภูมิวงกลมแสดงสัดส่วนของส่วนรวม ไม่เหมาะกับการดูแนวโน้มตามเวลา และ 31 ชิ้นอ่านไม่ออก" }
      - { id: c, text: "ตารางตัวเลข 31 แถวเพียงอย่างเดียว", feedback: "มีข้อมูลครบ แต่มองแนวโน้มยาก คำถามต้องการให้เห็นการเปลี่ยนแปลง" }
      - { id: d, text: "แผนภาพการกระจายระหว่างค่าฝุ่นกับชื่อนักเรียนที่จด", feedback: "ชื่อผู้จดไม่เกี่ยวกับคำถาม และไม่ได้แสดงลำดับเวลา" }
    hints:
      - "คำถามเกี่ยวกับการเปลี่ยนแปลงตามเวลา"
      - "แผนภูมิแบบใดเชื่อมจุดตามลำดับเวลา"
    solution: "แผนภูมิเส้นแสดงการเปลี่ยนแปลงตามเวลาได้ชัด เห็นวันที่ค่าฝุ่นขึ้นสูงและช่วงที่ลดลง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-processing.p009
    topics: [computer.data.data-processing]
    difficulty: 3
    type: mcq
    stem: "ข้อมูลของร้านแห่งหนึ่งแสดงว่า วันที่ขายไอศกรีมได้มาก มักเป็นวันที่ขายพัดลมพกพาได้มากด้วย ข้อสรุปใดสมเหตุสมผลที่สุด"
    choices:
      - { id: a, text: "ทั้งสองอย่างน่าจะขายดีเพราะปัจจัยร่วม คืออากาศร้อน ไม่ใช่ไอศกรีมทำให้คนซื้อพัดลม", correct: true }
      - { id: b, text: "การกินไอศกรีมทำให้คนอยากซื้อพัดลม", feedback: "เป็นการสรุปเหตุและผลจากสหสัมพันธ์โดยไม่มีหลักฐาน" }
      - { id: c, text: "ควรแจกไอศกรีมฟรีเพื่อเพิ่มยอดขายพัดลม", feedback: "ตั้งอยู่บนข้อสรุปว่าไอศกรีมเป็นสาเหตุ ซึ่งข้อมูลยังไม่ได้แสดง" }
      - { id: d, text: "ข้อมูลนี้ผิดแน่นอน เพราะสินค้าสองอย่างไม่เกี่ยวกัน", feedback: "ข้อมูลอาจถูก สินค้าสองอย่างขายดีพร้อมกันได้ถ้ามีปัจจัยร่วม" }
    hints:
      - "สองสิ่งที่ขึ้นลงพร้อมกันอาจมีสาเหตุร่วม"
      - "อะไรทำให้คนอยากได้ทั้งไอศกรีมและพัดลม"
    solution: "ข้อมูลแสดงสหสัมพันธ์ ไม่ได้แสดงเหตุและผล อากาศร้อนเป็นปัจจัยร่วมที่ทำให้ทั้งสองอย่างขายดี การสรุปว่าอย่างหนึ่งเป็นสาเหตุของอีกอย่างต้องมีหลักฐานเพิ่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-processing.p010
    topics: [computer.data.data-processing]
    difficulty: 3
    type: numeric
    stem: "หลังทำความสะอาดข้อมูลในภาพตามโจทย์ข้อก่อน (ลบแถวซ้ำ ตัดแถวที่ว่างหรือผิดกติกา) ค่าเฉลี่ยของจำนวนแก้วต่อสัปดาห์เป็นเท่าใด"
    figure:
      src: dirty-sheet.svg
      alt: "ตารางคำนวณผลแบบสอบถามร้านน้ำชมรม ข้อมูลดิบ กติกา ทุกช่องต้องตอบ และแก้วต่อสัปดาห์ต้องอยู่ระหว่าง 0 ถึง 14 คอลัมน์ A เวลาส่ง B ชื่อเล่น C ชั้น D เมนูที่ชอบ E แก้วต่อสัปดาห์ แถว 2 08:01 ต้น ม.2 ชาเย็น 3 แถว 3 08:03 ฝน ม.1 นมชมพู 5 แถว 4 08:01 ต้น ม.2 ชาเย็น 3 แถว 5 08:10 บอส ม.3 เมนูว่าง 2 แถว 6 08:12 แก้ว ม.1 ชาเย็น 70 แถว 7 08:15 มิว ม.2 โกโก้ 4 แถว 8 08:20 เจ ม.3 ชาเยน 6 แถว 9 08:22 ปาล์ม ม.1 นมชมพู 2 แถว 10 08:30 ใบเตย ม.2 โกโก้ 7 แถว 11 08:31 กัน ม.3 นมชมพู 1"
    answer: { value: 4, unit: แก้ว }
    hints:
      - "แถวที่เหลือคือแถว 2, 3, 7, 8, 9, 10, 11"
      - "รวมจำนวนแก้วของ 7 แถวนี้แล้วหารด้วย 7"
    misconceptions:
