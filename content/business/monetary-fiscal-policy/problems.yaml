  difficulty: 5
  type: numeric
  stem: ประเทศสมมติมีหนี้สาธารณะ $12{,}000$ พันล้านบาท GDP $18{,}000$ พันล้านบาท ปีหน้าขาดดุล $600$ พันล้านบาท (กู้เพิ่มเท่ากับขาดดุล) และ GDP ราคาประจำปีโต $4\%$ หนี้สาธารณะต่อ GDP ปีหน้าเป็นกี่เปอร์เซ็นต์ (ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 67.307692
    tolerance: 0.02
    unit: '%'
  misconceptions:
  - match: 66.666667
    feedback: ยังเป็นสัดส่วนปีนี้
  - match: 70.0
    feedback: ลืมให้ GDP เติบโต
  hints:
  - หนี้ปีหน้า $= 12{,}000 + 600$
  - GDP ปีหน้า $= 18{,}000 \times 1.04$
  solution: หนี้ $= 12{,}600$ GDP $= 18{,}720$ สัดส่วน $\approx 67.31\%$ (เดิม $66.67\%$) ถ้าสมมติเพดาน $70\%$ ของ GDP พื้นที่ทางการคลังเหลือน้อยลง สัดส่วนนี้ลดได้ถ้า GDP โตเร็วกว่าหนี้
