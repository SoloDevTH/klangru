    stem: "จงหาค่าของ $\\displaystyle\\lim_{n \\to \\infty}\\sum_{i=1}^{n}\\frac3n\\left(1 + \\frac{3i}{n}\\right)^2$ โดยมองเป็นปริพันธ์จำกัดเขต"
    answer: { value: 21 }
    hints:
