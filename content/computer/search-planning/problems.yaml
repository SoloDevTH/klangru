      - "ลองทั้งสี่ทิศทางจากพิกัดของ cell"
      - "ตรวจว่าพิกัดใหม่อยู่ภายในขอบของกริดก่อนอ่านค่า"
      - "เก็บเฉพาะช่องที่เป็นจุด . เท่านั้น"
    solution: "สำหรับแต่ละทิศทางคำนวณพิกัดใหม่ ตรวจขอบของกริด แล้วเก็บเฉพาะพิกัดที่อ่านได้เป็น . ซึ่งเดินได้"
