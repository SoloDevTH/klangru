problems:
- id: chinese.grammar.questions.p001
  topics:
  - chinese.grammar.questions
  difficulty: 1
  type: mcq
  stem: 你是学生吗？ (Nǐ shì xuésheng ma?) แปลว่าอะไร
  choices:
  - id: a
    text: คุณไม่ใช่นักเรียน
    feedback: ไม่มีคำปฏิเสธ 不 ในประโยค
  - id: b
    text: ใครเป็นนักเรียน
    feedback: ถ้าถามว่าใครต้องใช้ 谁 shéi
  - id: c
    text: คุณเป็นนักเรียนไหม
    correct: true
    feedback: ถูก 吗 ท้ายประโยคทำให้ประโยคบอกเล่ากลายเป็นคำถามแบบใช่หรือไม่
  - id: d
    text: คุณเป็นนักเรียน
    feedback: ประโยคนี้มี 吗 ท้ายประโยค จึงเป็นคำถาม ไม่ใช่ประโยคบอกเล่า
  hints:
  - 你是学生 = คุณเป็นนักเรียน
  - 吗 ma ท้ายประโยคทำหน้าที่เหมือน ไหม หรือ หรือเปล่า ในภาษาไทย
  solution: '**คุณเป็นนักเรียนไหม** 你是学生 (บอกเล่า) + 吗 = คำถามแบบตอบ ใช่/ไม่ใช่'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.questions.p002
  topics:
  - chinese.grammar.questions
  difficulty: 1
  type: match
  stem: จับคู่คำแสดงคำถามกับความหมายภาษาไทย
  pairs:
  - left: 什么 shénme
    right: อะไร
  - left: 谁 shéi
    right: ใคร
  - left: 哪儿 nǎr
    right: ที่ไหน
  - left: 怎么 zěnme
    right: อย่างไร
  - left: 多少 duōshao
    right: เท่าไร (จำนวนมาก)
  hints:
  - 哪儿 มี 儿 ต่อท้ายและใช้ถามสถานที่
  - 多少 ใช้ถามจำนวนที่ไม่รู้ว่ามากน้อยแค่ไหน
  solution: 什么 อะไร · 谁 ใคร · 哪儿 ที่ไหน · 怎么 อย่างไร · 多少 เท่าไร
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.questions.p003
  topics:
  - chinese.grammar.questions
  difficulty: 2
  type: hanzi
  stem: เขียนอักษร 吗 (ma) คำลงท้ายคำถาม ตามลำดับขีด
  character: 吗
  pinyin: ma
  meaning: ไหม (คำลงท้ายประโยคคำถาม)
  hints:
  - 吗 = 口 (ปาก) ทางซ้าย + 马 (ม้า) ทางขวา รวม 6 ขีด
  - เขียน 口 ทางซ้ายให้เสร็จก่อน แล้วจึงเขียน 马 ทางขวา
  solution: '口: 竖 → 横折 → 横 แล้ว 马: 横折 → 竖折折钩 → 提 รวม 6 ขีด (口 บอกว่าเกี่ยวกับการพูด 马 mǎ บอกเสียง)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.questions.p004
  topics:
  - chinese.grammar.questions
  difficulty: 2
  type: mcq
  stem: นักเรียนแลกเปลี่ยนชาวจีนที่โรงเรียนในนครปฐมพูดว่า 我是中国人，你呢？ (Wǒ shì Zhōngguórén, nǐ ne?) คำว่า 你呢？ หมายถึงอะไร
  choices:
  - id: a
    text: คุณอยู่ที่ไหน
    feedback: ถามสถานที่ใช้ 哪儿
  - id: b
    text: แล้วคุณล่ะ (เป็นคนประเทศอะไร)
    correct: true
    feedback: ถูก 呢 ถามกลับเรื่องเดียวกับที่เพิ่งพูด ไม่ต้องพูดคำถามซ้ำทั้งประโยค
  - id: c
    text: คุณชื่ออะไร
    feedback: ถามชื่อใช้ 你叫什么名字？
  - id: d
    text: คุณสบายดีไหม
    feedback: ทักทายใช้ 你好吗？
  hints:
  - ประโยคแรกบอกสัญชาติของผู้พูด
  - 你呢 = คุณ + 呢 ถามเรื่องเดียวกันกลับไปที่ผู้ฟัง
  solution: 你呢？ = **แล้วคุณล่ะ** ในที่นี้ถามว่าเป็นคนประเทศอะไร ตอบได้ว่า 我是泰国人。
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.questions.p005
  topics:
  - chinese.grammar.questions
  difficulty: 2
  type: order
  stem: เรียงคำให้เป็นคำถาม "ครูของคุณเป็นคนประเทศไหน"
  items:
  - 你的
  - 老师
  - 是
  - 哪国
  - 人
  hints:
  - ประธานคือ ครูของคุณ = 你的老师
  - ประโยคตอบคือ 你的老师是泰国人 แล้วแทน 泰国 ด้วย 哪国
  solution: '**你的老师是哪国人？** Nǐ de lǎoshī shì nǎ guó rén? คำแสดงคำถามอยู่ตรงตำแหน่งของคำตอบ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.questions.p006
  topics:
  - chinese.grammar.questions
  difficulty: 2
  type: mcq
  stem: คำว่า 什么 谁 哪儿 ในภาษาจีนวางไว้ตรงไหนของประโยค
  choices:
  - id: a
    text: ต้นประโยคเสมอ เหมือนภาษาอังกฤษ
    feedback: ภาษาจีนไม่ย้ายคำแสดงคำถามไปต้นประโยค
  - id: b
    text: ท้ายประโยคเสมอ ตามด้วย 吗
    feedback: คำแสดงคำถามไม่ต้องตามด้วย 吗 และไม่ได้อยู่ท้ายเสมอ
  - id: c
    text: หน้ากริยาเสมอ
    feedback: 什么 谁 อยู่หลังกริยาได้ เช่น 你叫什么
  - id: d
    text: ตำแหน่งเดียวกับคำตอบ ไม่ต้องย้ายไปต้นประโยค
    correct: true
    feedback: 'ถูก เหมือนภาษาไทย: คุณชื่ออะไร / ฉันชื่อมะลิ'
  hints:
  - เทียบ 我叫玛丽 กับ 你叫什么
  - ดูว่า 什么 อยู่ช่องเดียวกับคำว่าอะไรในประโยคตอบ
  solution: คำแสดงคำถาม **อยู่ตรงตำแหน่งของคำตอบ** เหมือนภาษาไทย ไม่ย้ายไปต้นประโยคแบบภาษาอังกฤษ (What is your name?)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.questions.p007
  topics:
  - chinese.grammar.questions
  difficulty: 3
  type: mcq
  stem: ประโยคใด **ผิด** (เลือกทุกข้อที่ผิด)
  multiple: true
  choices:
  - id: a
    text: 你叫什么名字吗？
    correct: true
    feedback: ผิด มี 什么 เป็นคำถามอยู่แล้ว เติม 吗 ซ้ำไม่ได้
  - id: b
    text: 他是谁吗？
    correct: true
    feedback: ผิด 谁 เป็นคำถามอยู่แล้ว ต้องเป็น 他是谁？
  - id: c
    text: 你是老师吗？
    feedback: ข้อนี้ถูก (คุณเป็นครูไหม)
  - id: d
    text: 你去哪儿？
    feedback: ข้อนี้ถูก (คุณจะไปไหน)
  hints:
  - 吗 ใช้กับคำถามแบบใช่หรือไม่
  - ถ้ามีคำแสดงคำถาม เช่น 什么 谁 哪儿 อยู่แล้ว ไม่ต้องมี 吗
  solution: 'ผิด: **你叫什么名字吗？** และ **他是谁吗？** เพราะใช้คำแสดงคำถามคู่กับ 吗 ที่ถูกคือ 你叫什么名字？ และ 他是谁？'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.questions.p008
  topics:
  - chinese.grammar.questions
  difficulty: 3
  type: text
  stem: เปลี่ยน 你是学生。 ให้เป็นคำถามแบบ **บอกเล่าซ้อนปฏิเสธ** (A不A) โดยไม่ใช้ 吗 (พิมพ์อักษรจีน)
  accepted:
  - 你是不是学生
  - 你是不是学生。
  - 你是不是学生.
  - 你是不是学生？
  - 你是不是学生?
  - 你是不是學生
  - 你是不是學生。
  - 你是不是學生.
  - 你是不是學生？
  - 你是不是學生?
  misconceptions:
  - match: 你是不是学生吗
    feedback: ใช้ A不A แล้วไม่ต้องเติม 吗
  - match: 你是不是学生吗。
    feedback: ใช้ A不A แล้วไม่ต้องเติม 吗
  - match: 你是不是学生吗？
    feedback: ใช้ A不A แล้วไม่ต้องเติม 吗
  - match: 你不是学生
    feedback: นี่คือประโยคปฏิเสธ ไม่ใช่คำถาม ต้องมีทั้ง 是 และ 不是
  - match: 你不是学生。
    feedback: นี่คือประโยคปฏิเสธ ไม่ใช่คำถาม ต้องมีทั้ง 是 และ 不是
  - match: 你不是学生？
    feedback: นี่คือประโยคปฏิเสธ ไม่ใช่คำถาม ต้องมีทั้ง 是 และ 不是
  - match: 你是学生不是
    feedback: 'รูปที่ใช้บ่อยคือวาง 是不是 ติดกันหน้ากรรม: 你是不是学生'
  - match: 你是学生不是。
    feedback: 'รูปที่ใช้บ่อยคือวาง 是不是 ติดกันหน้ากรรม: 你是不是学生'
  - match: 你是学生不是？
    feedback: 'รูปที่ใช้บ่อยคือวาง 是不是 ติดกันหน้ากรรม: 你是不是学生'
  hints:
  - รูป A不A คือ กริยา + 不 + กริยาเดิม
  - กริยาในประโยคนี้คือ 是 จึงเป็น 是不是 แล้ววางแทน 是
  solution: '**你是不是学生？** Nǐ shì bu shì xuésheng? (不 ตรงกลางอ่านเสียงเบา) ความหมายเท่ากับ 你是学生吗？'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.questions.p009
  topics:
  - chinese.grammar.questions
  difficulty: 3
  type: mcq
  stem: ร้านกาแฟในหัวหิน พนักงานอยากถามลูกค้าชาวจีนว่า "รับชาหรือกาแฟคะ" ประโยคใดถูกต้อง
  choices:
  - id: a
    text: 你喝茶还是咖啡吗？
    feedback: 还是 เป็นคำถามอยู่แล้ว ไม่ต้องเติม 吗
  - id: b
    text: 你喝茶吗咖啡？
    feedback: 吗 อยู่ท้ายประโยคเท่านั้น และไม่ใช้ถามแบบให้เลือก
  - id: c
    text: 你喝茶还是咖啡？
    correct: true
    feedback: ถูก 还是 háishi ใช้ในคำถามให้เลือก ก หรือ ข
  - id: d
    text: 你喝茶或者咖啡？
    feedback: 或者 ใช้ในประโยคบอกเล่า เช่น 我喝茶或者咖啡都可以 ในคำถามให้เลือกใช้ 还是
  hints:
  - คำถามให้เลือกระหว่างสองอย่างใช้คำเชื่อมพิเศษ
  - รูปคือ ก + 还是 + ข และไม่ต้องมี 吗
  solution: '**你喝茶还是咖啡？** Nǐ hē chá háishi kāfēi? 还是 = หรือ (ในคำถามให้เลือก)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.questions.p010
  topics:
  - chinese.grammar.questions
  difficulty: 3
  type: mcq
  stem: ข้อใดใช้ 几 หรือ 多少 ได้เหมาะสมที่สุด
  choices:
  - id: a
    text: 你们学校有几学生？
    feedback: 几 ต้องมีลักษณนาม เช่น 几个 และใช้กับจำนวนที่คาดว่าน้อย
  - id: b
    text: 你有多少个哥哥？
    feedback: จำนวนพี่ชายคาดว่าน้อยกว่า 10 ควรใช้ 你有几个哥哥？
  - id: c
    text: 现在多少点？
    feedback: ถามเวลาใช้ 现在几点？
  - id: d
    text: 你们学校有多少学生？
    correct: true
    feedback: ถูก จำนวนนักเรียนทั้งโรงเรียนมักมากกว่า 10 จึงใช้ 多少 และวางคำนามต่อได้เลย
  hints:
  - 几 jǐ ใช้กับจำนวนที่คาดว่าน้อยกว่า 10 และต้องมีลักษณนาม
  - 多少 duōshao ใช้กับจำนวนมากหรือไม่รู้ และไม่ต้องมีลักษณนามก็ได้
  solution: '**你们学校有多少学生？** ใช้ 多少 กับจำนวนมาก ส่วนจำนวนพี่น้องใช้ 几个 และเวลาใช้ 几点'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.questions.p011
  topics:
  - chinese.grammar.questions
  difficulty: 3
  type: mcq
  stem: นักท่องเที่ยวชาวจีนที่สถานีหัวลำโพงอยากถามว่า "ไปเชียงใหม่ไปอย่างไร" ควรพูดว่าอะไร (清迈 Qīngmài = เชียงใหม่)
  choices:
  - id: a
    text: 去清迈怎么走？
    correct: true
    feedback: ถูก 怎么 + กริยา ถามวิธีการ 怎么走 = ไปอย่างไร
  - id: b
    text: 去清迈什么走？
    feedback: 什么 แปลว่าอะไร ใช้ถามสิ่งของ ไม่ใช่วิธีการ
  - id: c
    text: 去清迈哪儿走？
    feedback: 哪儿 ถามสถานที่
  - id: d
    text: 怎么去清迈吗？
    feedback: 怎么 เป็นคำถามอยู่แล้ว ไม่ต้องเติม 吗
  hints:
  - คำถามเรื่องวิธีการใช้คำว่า อย่างไร
  - '怎么 วางหน้ากริยา: 怎么 + 走/去/写'
  solution: '**去清迈怎么走？** Qù Qīngmài zěnme zǒu? (พูด 怎么去清迈？ ก็ได้)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.questions.p012
  topics:
  - chinese.grammar.questions
  difficulty: 4
  type: order
  stem: เพื่อนชาวจีนถามว่า "คุณจะไปเชียงใหม่หรือภูเก็ต" เรียงคำให้ถูกต้อง (普吉 Pǔjí = ภูเก็ต)
  items:
  - 你
  - 去
  - 清迈
  - 还是
  - 普吉
  hints:
  - เริ่มด้วย คุณ + ไป
  - รูปคำถามให้เลือกคือ ก + 还是 + ข
  solution: '**你去清迈还是普吉？** Nǐ qù Qīngmài háishi Pǔjí? ไม่มี 吗 เพราะ 还是 ทำให้เป็นคำถามแล้ว'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.questions.p013
  topics:
  - chinese.grammar.questions
  difficulty: 4
  type: match
  stem: จับคู่คำถามกับคำตอบที่เหมาะสม
  pairs:
  - left: 你叫什么名字？
    right: 我叫王小龙。
  - left: 他是谁？
    right: 他是我的老师。
  - left: 你去哪儿？
    right: 我去学校。
  - left: 你有几本书？
    right: 我有三本书。
  - left: 你喝茶还是咖啡？
    right: 我喝咖啡。
  hints:
  - 'ดูคำแสดงคำถามในแต่ละประโยค: 什么 谁 哪儿 几 还是'
  - คำตอบจะมีคำใหม่อยู่ตรงตำแหน่งของคำแสดงคำถาม
  solution: 什么名字 → 我叫王小龙 · 谁 → 他是我的老师 · 哪儿 → 我去学校 · 几本 → 三本 · 茶还是咖啡 → 我喝咖啡
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.questions.p014
  topics:
  - chinese.grammar.questions
  difficulty: 4
  type: mcq
  stem: ช่วงสงกรานต์ พี่เลี้ยงชาวจีนอยากถามอายุเด็กชายวัย 6 ขวบ ประโยคใดเหมาะที่สุด
  choices:
  - id: a
    text: 您多大年纪？
    feedback: เป็นคำถามสุภาพสำหรับผู้สูงอายุ ไม่ใช้กับเด็ก
  - id: b
    text: 你几个岁？
    feedback: '岁 เป็นลักษณนามอยู่แล้ว ไม่ต้องมี 个: 几岁'
  - id: c
    text: 你多大吗？
    feedback: 多大 เป็นคำถามอยู่แล้ว ไม่ต้องเติม 吗
  - id: d
    text: 你几岁？
    correct: true
    feedback: ถูก ถามเด็กที่อายุน่าจะไม่ถึง 10 ปีใช้ 几岁
  hints:
  - 几 ใช้กับจำนวนที่คาดว่าน้อยกว่า 10
  - ผู้ใหญ่วัยเดียวกันใช้ 你多大？ ผู้สูงอายุใช้ 您多大年纪？
  solution: 'เด็กเล็ก: **你几岁？** Nǐ jǐ suì? · คนวัยเดียวกัน: 你多大？ · ผู้สูงอายุ: 您多大年纪？'
