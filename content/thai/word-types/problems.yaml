problems:
  - id: thai.word.p001
    topics: [thai.grammar.word-types]
    difficulty: 1
    type: mcq
    stem: "คำใดเป็น **คำนาม**"
    choices:
      - { id: a, text: "โรงเรียน", correct: true, feedback: "ถูก โรงเรียนเป็นชื่อสถานที่" }
      - { id: b, text: "วิ่ง", feedback: "วิ่ง บอกการกระทำ เป็นคำกริยา" }
      - { id: c, text: "เร็ว", feedback: "เร็ว บอกลักษณะ ใช้ขยายคำอื่น เป็นคำวิเศษณ์" }
      - { id: d, text: "และ", feedback: "และ ใช้เชื่อมคำหรือประโยค เป็นคำสันธาน" }
    hints:
      - "คำนามคือคำที่เรียกชื่อคน สัตว์ สิ่งของ หรือสถานที่"
      - "ลองถามว่าคำใดตอบคำถาม \"อะไร\" หรือ \"ที่ไหน\" ได้"
    solution: "โรงเรียนเป็นชื่อสถานที่ จึงเป็นคำนาม ส่วน วิ่ง เป็นคำกริยา เร็ว เป็นคำวิเศษณ์ และ และ เป็นคำสันธาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.word.p002
    topics: [thai.grammar.word-types]
    difficulty: 1
    type: match
    stem: "จับคู่คำกับชนิดของคำ"
    pairs:
      - { left: "แมว", right: "คำนาม" }
      - { left: "ฉัน", right: "คำสรรพนาม" }
      - { left: "กิน", right: "คำกริยา" }
      - { left: "โอ๊ย", right: "คำอุทาน" }
    hints:
      - "คำหนึ่งเป็นชื่อสัตว์ คำหนึ่งใช้แทนตัวผู้พูด"
      - "คำที่เหลือ คำหนึ่งบอกการกระทำ อีกคำแสดงความรู้สึกเจ็บ"
    solution: "แมว = คำนาม (ชื่อสัตว์) · ฉัน = คำสรรพนาม (แทนผู้พูด) · กิน = คำกริยา (การกระทำ) · โอ๊ย = คำอุทาน (แสดงความเจ็บ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.word.p003
    topics: [thai.grammar.word-types]
    difficulty: 2
    type: text
    stem: "ประโยค \"ฉันชอบอ่านหนังสือ\" คำว่า **ฉัน** เป็นคำชนิดใด"
    accepted: ["คำสรรพนาม", "สรรพนาม"]
    misconceptions:
      - { match: "คำนาม", feedback: "ฉัน ทำหน้าที่ประธานเหมือนคำนาม แต่เป็นคำที่ใช้แทนชื่อผู้พูด จึงเป็นคำสรรพนาม" }
      - { match: "นาม", feedback: "ฉัน ทำหน้าที่ประธานเหมือนคำนาม แต่เป็นคำที่ใช้แทนชื่อผู้พูด จึงเป็นคำสรรพนาม" }
    hints:
      - "ฉัน ใช้เรียกใคร เป็นชื่อเฉพาะของคนหรือไม่"
      - "คำที่ใช้แทนชื่อคนเพื่อไม่ต้องพูดชื่อซ้ำเรียกว่าคำชนิดใด"
    solution: "ฉัน ใช้แทนชื่อผู้พูด จึงเป็น **คำสรรพนาม** และทำหน้าที่ประธานของประโยค"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.word.p004
    topics: [thai.grammar.word-types]
    difficulty: 2
    type: mcq
    stem: "ประโยค \"แมวนอนบนโต๊ะ\" คำว่า **บน** เป็นคำชนิดใด"
    choices:
      - { id: a, text: "คำบุพบท", correct: true, feedback: "ถูก บน นำหน้าคำนาม โต๊ะ เพื่อบอกตำแหน่ง" }
      - { id: b, text: "คำวิเศษณ์", feedback: "คำบอกตำแหน่งจะเป็นคำวิเศษณ์เมื่อไม่มีคำนามตามหลัง เช่น นอนข้างบน แต่ประโยคนี้มี โต๊ะ ตามหลัง" }
      - { id: c, text: "คำสันธาน", feedback: "คำสันธานเชื่อมสองส่วนเข้าด้วยกัน เช่น และ แต่ ส่วน บน บอกตำแหน่งของแมว" }
      - { id: d, text: "คำนาม", feedback: "บน ไม่ได้เป็นชื่อของสิ่งใด แต่บอกความสัมพันธ์ระหว่างแมวกับโต๊ะ" }
    hints:
      - "ดูว่าหลังคำว่า บน มีคำอะไรตามมา"
      - "คำที่นำหน้าคำนามเพื่อบอกตำแหน่งหรือความสัมพันธ์เรียกว่าคำชนิดใด"
    solution: "บน นำหน้าคำนาม โต๊ะ และบอกความสัมพันธ์ด้านตำแหน่ง จึงเป็น **คำบุพบท**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.word.p005
    topics: [thai.grammar.word-types]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "เลือก **คำสันธาน** ให้ครบทุกคำ"
    choices:
      - { id: a, text: "และ", correct: true }
      - { id: b, text: "แต่", correct: true }
      - { id: c, text: "เพราะ", correct: true }
      - { id: d, text: "ใน", feedback: "ใน นำหน้าคำนาม เช่น ในห้อง เป็นคำบุพบท" }
      - { id: e, text: "ของ", feedback: "ของ นำหน้าคำนามหรือสรรพนาม เช่น ของฉัน เป็นคำบุพบท" }
      - { id: f, text: "เร็ว", feedback: "เร็ว ขยายคำกริยา เป็นคำวิเศษณ์" }
    hints:
      - "คำสันธานเชื่อมคำกับคำ หรือประโยคกับประโยค"
      - "ลองดูว่าคำใดวางไว้ระหว่างประโยคสองประโยคเพื่อเชื่อมความเข้าด้วยกันได้ เช่น ฉันหิว ___ ยังไม่ได้กินข้าว"
    solution: "และ แต่ เพราะ เชื่อมความสองส่วนเข้าด้วยกัน จึงเป็นคำสันธาน ส่วน ใน และ ของ เป็นคำบุพบท และ เร็ว เป็นคำวิเศษณ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.word.p006
    topics: [thai.grammar.word-types]
    difficulty: 3
    type: match
    stem: "ประโยค \"เด็กชายวิ่งเร็วในสนาม\" จับคู่คำกับชนิดของคำ"
    pairs:
      - { left: "เด็กชาย", right: "คำนาม" }
      - { left: "วิ่ง", right: "คำกริยา" }
      - { left: "เร็ว", right: "คำวิเศษณ์" }
      - { left: "ใน", right: "คำบุพบท" }
    hints:
      - "หาผู้ทำและการกระทำก่อน"
      - "คำหนึ่งบอกว่าวิ่งอย่างไร อีกคำนำหน้าคำว่า สนาม"
    solution: "เด็กชาย = คำนาม (ประธาน) · วิ่ง = คำกริยา · เร็ว = คำวิเศษณ์ ขยาย วิ่ง · ใน = คำบุพบท นำหน้าคำนาม สนาม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.word.p007
    topics: [thai.grammar.word-types]
    difficulty: 2
    type: text
    stem: "ผู้ชมฟุตบอลตะโกนว่า \"ไชโย ทีมชาติไทยยิงประตูได้แล้ว\" คำว่า **ไชโย** เป็นคำชนิดใด"
    accepted: ["คำอุทาน", "อุทาน"]
    misconceptions:
      - { match: "คำกริยา", feedback: "ไชโย ไม่ได้บอกการกระทำ แต่เป็นคำที่เปล่งออกมาแสดงความดีใจ" }
    hints:
      - "คำนี้บอกอะไร เป็นการกระทำ หรือเป็นเสียงแสดงความรู้สึก"
      - "คำที่เปล่งออกมาเพื่อแสดงอารมณ์ เช่น ดีใจ ตกใจ เจ็บ เรียกว่าคำชนิดใด"
    solution: "ไชโย เปล่งออกมาแสดงความดีใจ จึงเป็น **คำอุทาน**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.word.p008
    topics: [thai.grammar.word-types]
    difficulty: 3
    type: mcq
    stem: "ประโยค \"นี่คือบ้านของฉัน\" คำว่า **นี่** เป็นคำชนิดใด"
    choices:
      - { id: a, text: "คำสรรพนาม", correct: true, feedback: "ถูก นี่ ใช้แทนสิ่งที่ชี้ คือบ้าน และทำหน้าที่ประธาน" }
      - { id: b, text: "คำวิเศษณ์", feedback: "คำที่เป็นวิเศษณ์คือ นี้ ซึ่งตามหลังคำนาม เช่น บ้านนี้ ส่วน นี่ ใช้แทนคำนาม" }
      - { id: c, text: "คำนาม", feedback: "นี่ ไม่ใช่ชื่อของสิ่งใด แต่ใช้แทนสิ่งที่ชี้ถึง" }
      - { id: d, text: "คำบุพบท", feedback: "คำบุพบทในประโยคนี้คือ ของ ซึ่งนำหน้า ฉัน" }
    hints:
      - "นี่ อยู่ต้นประโยคและไม่มีคำนามอยู่ข้างหน้า"
      - "เทียบกับ \"บ้านนี้\" ที่ นี้ ขยายคำนาม ส่วน นี่ ทำหน้าที่แทนอะไร"
    solution: "นี่ ใช้ชี้และแทนสิ่งของ (บ้าน) และเป็นประธานของประโยค จึงเป็น **คำสรรพนาม** ต่างจาก นี้ ที่ตามหลังคำนามเป็นคำวิเศษณ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.word.p009
    topics: [thai.grammar.word-types]
    difficulty: 3
    type: order
    stem: "เรียงคำให้เป็นประโยคตามลำดับ ประธาน → กริยา → กรรม → บุพบทวลีบอกสถานที่"
    items: ["พ่อ", "ซื้อ", "ทุเรียน", "จากตลาด"]
    hints:
      - "ใครเป็นผู้ทำ และทำอะไร"
      - "สิ่งที่ถูกซื้อคือกรรม ส่วนวลีที่ขึ้นต้นด้วยคำบุพบทอยู่ท้าย"
    solution: "พ่อ (ประธาน) ซื้อ (กริยา) ทุเรียน (กรรม) จากตลาด (บุพบท จาก + คำนาม ตลาด) ได้ประโยค \"พ่อซื้อทุเรียนจากตลาด\""
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.word.p010
    topics: [thai.grammar.word-types]
    difficulty: 4
    type: mcq
    stem: "ประโยค \"ความรู้เป็นสิ่งมีค่า\" คำว่า **ความรู้** เป็นคำชนิดใด"
    choices:
      - { id: a, text: "คำนาม", correct: true, feedback: "ถูก ความ + คำกริยา รู้ กลายเป็นคำนาม และทำหน้าที่ประธาน" }
      - { id: b, text: "คำกริยา", feedback: "รู้ อย่างเดียวเป็นคำกริยา แต่เมื่อมี ความ นำหน้าจะกลายเป็นคำนาม" }
      - { id: c, text: "คำวิเศษณ์", feedback: "ความรู้ ไม่ได้ขยายคำอื่น แต่เป็นสิ่งที่ประโยคพูดถึง" }
      - { id: d, text: "คำสรรพนาม", feedback: "ความรู้ ไม่ได้ใช้แทนคำนามอื่น แต่เป็นชื่อของสิ่งที่จับต้องไม่ได้" }
    hints:
      - "สังเกตคำว่า ความ ที่นำหน้า"
      - "การ หรือ ความ นำหน้าคำกริยาหรือคำวิเศษณ์ ทำให้ได้คำชนิดใด"
    solution: "ความรู้ เกิดจาก ความ + รู้ เป็นชื่อของสิ่งที่จับต้องไม่ได้ จึงเป็น **คำนาม** ทำหน้าที่ประธาน ส่วน เป็น คือคำกริยาของประโยค"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.word.p011
    topics: [thai.grammar.word-types]
    difficulty: 4
    type: text
    stem: "ประโยค \"คุณครูชมนักเรียน\" คำว่า **นักเรียน** ทำหน้าที่อะไรในประโยค (ประธาน กริยา หรือกรรม)"
    accepted: ["กรรม", "ทำหน้าที่กรรม", "กรรมของประโยค"]
    misconceptions:
      - { match: "ประธาน", feedback: "ประธานคือผู้ทำ ในประโยคนี้ผู้ชมคือคุณครู ส่วนนักเรียนเป็นผู้ถูกชม" }
    hints:
      - "ใครเป็นผู้ชม และใครเป็นผู้ถูกชม"
      - "ผู้ถูกกระทำซึ่งอยู่หลังคำกริยาทำหน้าที่อะไร"
    solution: "คุณครู (ประธาน) ชม (กริยา) นักเรียน (ผู้ถูกชม) นักเรียนจึงทำหน้าที่ **กรรม** แม้จะเป็นคำนามเหมือนคุณครูก็ตาม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.word.p012
    topics: [thai.grammar.word-types]
    difficulty: 5
    type: mcq
    stem: "ประกาศหน้าโรงเรียน: \"นักเรียน**ที่**มาสายต้องรายงานตัว**ที่**ห้องธุรการ\" คำว่า ที่ ทั้งสองแห่งเป็นคำชนิดใด"
    choices:
      - { id: a, text: "ที่ แรกเป็นคำสรรพนาม ที่ ที่สองเป็นคำบุพบท", correct: true, feedback: "ถูก ที่ แรกแทนคำว่านักเรียนและเชื่อมกับ มาสาย ส่วน ที่ ที่สองนำหน้าคำนาม ห้องธุรการ" }
      - { id: b, text: "ทั้งสองแห่งเป็นคำบุพบท", feedback: "ที่ แรกไม่ได้นำหน้าคำนาม แต่ตามด้วยข้อความ มาสาย ที่มาขยายนักเรียน จึงไม่ใช่บุพบท" }
      - { id: c, text: "ทั้งสองแห่งเป็นคำสรรพนาม", feedback: "ที่ ที่สองนำหน้าคำนาม ห้องธุรการ เพื่อบอกสถานที่ จึงเป็นบุพบท" }
      - { id: d, text: "ที่ แรกเป็นคำบุพบท ที่ ที่สองเป็นคำสรรพนาม", feedback: "สลับกัน ดูว่า ที่ ตัวใดมีคำนามบอกสถานที่ตามหลัง" }
    hints:
      - "ดูคำที่ตามหลัง ที่ แต่ละแห่ง: แห่งแรกคือ มาสาย แห่งที่สองคือ ห้องธุรการ"
      - "ที่ ที่ใช้แทนคำนามข้างหน้าและเชื่อมข้อความมาขยายเป็นสรรพนาม ส่วน ที่ ที่นำหน้าคำนามบอกสถานที่เป็นบุพบท"
    solution: "ที่ แรกแทนคำว่า นักเรียน และเชื่อมข้อความ มาสาย มาขยาย จึงเป็นคำสรรพนาม ที่ ที่สองนำหน้าคำนาม ห้องธุรการ บอกสถานที่ จึงเป็นคำบุพบท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.word.p013
    topics: [thai.grammar.word-types]
    difficulty: 5
    type: mcq
    stem: "ประโยค \"เขาเดินช้า ๆ ไปที่ตลาด\" ข้อใดบอกชนิดของคำได้ถูกต้องทั้งหมด"
    choices:
      - { id: a, text: "เขา = สรรพนาม, เดิน = กริยา, ช้า ๆ = วิเศษณ์, ที่ = บุพบท", correct: true, feedback: "ถูกทุกคำ" }
      - { id: b, text: "เขา = สรรพนาม, เดิน = กริยา, ช้า ๆ = วิเศษณ์, ที่ = สรรพนาม", feedback: "ที่ ในประโยคนี้นำหน้าคำนาม ตลาด บอกสถานที่ จึงเป็นบุพบท ไม่ได้แทนคำนามใด" }
      - { id: c, text: "เขา = สรรพนาม, เดิน = กริยา, ช้า ๆ = กริยา, ที่ = บุพบท", feedback: "ช้า ๆ บอกว่าเดินอย่างไร จึงขยายคำกริยา เป็นคำวิเศษณ์" }
      - { id: d, text: "เขา = นาม, เดิน = กริยา, ช้า ๆ = วิเศษณ์, ที่ = บุพบท", feedback: "เขา ในประโยคนี้ใช้แทนคนที่พูดถึง จึงเป็นสรรพนาม (เขา ที่หมายถึงภูเขาจึงจะเป็นคำนาม)" }
