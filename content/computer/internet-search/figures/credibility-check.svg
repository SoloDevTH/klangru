<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250" font-family="sans-serif" font-size="15">
  <title>ห้าคำถามตรวจความน่าเชื่อถือของข้อมูล ใคร เมื่อไร ที่ไหน ทำไม และหลักฐาน</title>
  <rect x="0" y="0" width="860" height="250" fill="#ffffff"/>
  <rect x="16.0" y="40.0" width="156.0" height="170.0" rx="14" fill="#d6efe9" stroke="#0a6b60" stroke-width="2.2" />
  <text x="94.0" y="88.0" text-anchor="middle" fill="#0a6b60" font-weight="bold" font-size="24" >ใคร?</text>
  <text x="94.0" y="140.0" text-anchor="middle" fill="#15211e" font-weight="normal" font-size="13" >ผู้เขียนหรือหน่วยงาน</text>
  <text x="94.0" y="166.0" text-anchor="middle" fill="#15211e" font-weight="normal" font-size="13" >รู้จริงเรื่องนี้ไหม</text>
  <rect x="184.0" y="40.0" width="156.0" height="170.0" rx="14" fill="#e3ecfa" stroke="#1f4e9c" stroke-width="2.2" />
  <text x="262.0" y="88.0" text-anchor="middle" fill="#1f4e9c" font-weight="bold" font-size="24" >เมื่อไร?</text>
  <text x="262.0" y="140.0" text-anchor="middle" fill="#15211e" font-weight="normal" font-size="13" >เขียนหรือแก้ไข</text>
  <text x="262.0" y="166.0" text-anchor="middle" fill="#15211e" font-weight="normal" font-size="13" >ล่าสุดเมื่อไร</text>
  <rect x="352.0" y="40.0" width="156.0" height="170.0" rx="14" fill="#efe7f6" stroke="#6a3d9a" stroke-width="2.2" />
  <text x="430.0" y="88.0" text-anchor="middle" fill="#6a3d9a" font-weight="bold" font-size="24" >ที่ไหน?</text>
  <text x="430.0" y="140.0" text-anchor="middle" fill="#15211e" font-weight="normal" font-size="13" >เว็บไซต์อะไร</text>
  <text x="430.0" y="166.0" text-anchor="middle" fill="#15211e" font-weight="normal" font-size="13" >ชื่อเว็บน่าสงสัยไหม</text>
  <rect x="520.0" y="40.0" width="156.0" height="170.0" rx="14" fill="#fdf2e6" stroke="#b4521f" stroke-width="2.2" />
  <text x="598.0" y="88.0" text-anchor="middle" fill="#b4521f" font-weight="bold" font-size="24" >ทำไม?</text>
  <text x="598.0" y="140.0" text-anchor="middle" fill="#15211e" font-weight="normal" font-size="13" >เขียนเพื่อให้ความรู้</text>
  <text x="598.0" y="166.0" text-anchor="middle" fill="#15211e" font-weight="normal" font-size="13" >หรือขายของ ปลุกปั่น</text>
  <rect x="688.0" y="40.0" width="156.0" height="170.0" rx="14" fill="#e6f3e3" stroke="#2e6b33" stroke-width="2.2" />
  <text x="766.0" y="88.0" text-anchor="middle" fill="#2e6b33" font-weight="bold" font-size="24" >หลักฐาน?</text>
  <text x="766.0" y="140.0" text-anchor="middle" fill="#15211e" font-weight="normal" font-size="13" >อ้างแหล่งที่มาไหม</text>
  <text x="766.0" y="166.0" text-anchor="middle" fill="#15211e" font-weight="normal" font-size="13" >แหล่งอื่นยืนยันไหม</text>
  <text x="430.0" y="238.0" text-anchor="middle" fill="#6b7672" font-weight="normal" font-size="14" >ข้อมูลที่ผ่านหลายข้อ และตรงกับแหล่งอื่นที่ไม่เกี่ยวข้องกัน น่าเชื่อถือมากขึ้น</text>
</svg>
